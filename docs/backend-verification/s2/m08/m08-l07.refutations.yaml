m08-l07-q01:
  key:
    anchor: kafka-streams-dsl-api#hopping-time-windows
    sentence: Since hopping windows can overlap - and in general they do - a data record may belong to more than one such windows.
  wrong:
  - option: A hopping window is defined by its size alone, without an advance interval
    anchor: kafka-streams-dsl-api#hopping-time-windows
    sentence: 'A hopping window is defined by two properties: the window’s size and its advance interval (aka “hop”).'
  - option: Kafka Streams uses the name hopping window for what it calls a sliding window
    anchor: kafka-streams-dsl-api#hopping-time-windows
    sentence: Kafka Streams follows the terminology in academic literature, where the semantics of sliding windows are different to those of hopping windows.
  - option: Hopping windows are aligned to the timestamp of the first record, not to the epoch
    anchor: kafka-streams-dsl-api#hopping-time-windows
    sentence: Hopping time windows are aligned to the epoch
m08-l07-q02:
  key:
    anchor: kafka-streams-dsl-api#session-windows
    sentence: If an event falls outside of the session gap, then a new session will be created.
  wrong:
  - option: The event is merged into the nearest existing session
    anchor: kafka-streams-dsl-api#session-windows
    sentence: Any events processed that fall within the inactivity gap of any existing sessions are merged into the existing sessions.
  - option: The event is dropped, because every session has a fixed size
    anchor: kafka-streams-dsl-api#session-windows
    sentence: sizes vary - even windows for the same key typically have different sizes
  - option: The event extends the session with the latest end time, whatever the gap
    anchor: kafka-streams-dsl-api#session-windows
    sentence: Sessions represent a period of activity separated by a defined gap of inactivity (or “idleness”).
m08-l07-q03:
  key:
    anchor: kafka-streams-dsl-api#window-final-results
    sentence: the 09:00 to 10:00 window will accept out-of-order records until 10:10, at which point, the window is closed.
  wrong:
