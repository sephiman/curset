# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q061
  prompt:
    es: "¿Cómo considera a los Planes de Gobierno Abierto el Plan de Acción para la implementación de la Agenda 2030 aprobado por el Gobierno de España?"
  options:
  - id: a
    correct: true
    text:
      es: "Como política palanca para alcanzar los Objetivos de Desarrollo Sostenible."
  - id: b
    text:
      es: "Como instrumento de seguimiento de los exámenes nacionales voluntarios."
  - id: c
    text:
      es: "Como política sectorial vinculada en exclusiva al Objetivo 17."
  - id: d
    text:
      es: "Como plan subordinado a la Estrategia de Seguridad Nacional."
  explanation:
    es: "El Plan de Acción considera los Planes de Gobierno Abierto «política palanca para alcanzar los ODS», porque contribuyen al Objetivo 16 y aceleran el resto. No los presenta como instrumento de los exámenes voluntarios, ni los vincula al Objetivo 17, ni los subordina a otra estrategia."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
