- id: g-event-time
  term: {en: event time}
  definition: {en: "The time that each individual event occurred on its producing device."}
  origin: m08-l07
  citation: "flink-time#notions-of-time-event-time-and-processing-time"
- id: g-processing-time
  term: {en: processing time}
  definition: {en: "The system time of the machine that is executing the respective operation."}
  origin: m08-l07
  citation: "flink-time#notions-of-time-event-time-and-processing-time"
- id: g-watermark
  term: {en: watermark}
  definition: {en: "The mechanism in Flink to measure progress in event time. A Watermark(t) declares that event time has reached time t in that stream, meaning that there should be no more elements from the stream with a timestamp t' <= t."}
  origin: m08-l07
  citation: "flink-time#event-time-and-watermarks"
- id: g-tumbling-window
  term: {en: tumbling window}
  definition: {en: "A window that models fixed-size, non-overlapping, gap-less windows. It is a hopping window whose window size is equal to its advance interval."}
  origin: m08-l07
  citation: "kafka-streams-dsl-api#tumbling-time-windows"
- id: g-hopping-window
  term: {en: hopping window}
  definition: {en: "A window that models fixed-sized, possibly overlapping windows. It is defined by two properties: the window's size and its advance interval."}
  origin: m08-l07
  citation: "kafka-streams-dsl-api#hopping-time-windows"
- id: g-session-window
  term: {en: session window}
  definition: {en: "A window used to aggregate key-based events into sessions. Sessions represent a period of activity separated by a defined gap of inactivity."}
  origin: m08-l07
  citation: "kafka-streams-dsl-api#session-windows"
- id: g-changelog-topic
  term: {en: changelog topic}
  definition: {en: "A replicated Kafka topic that Kafka Streams maintains for each state store, in which it tracks any state updates."}
  origin: m08-l07
  citation: "kafka-streams-architecture#fault-tolerance"
- id: g-savepoint
  term: {en: savepoint}
  definition: {en: "A consistent image of the execution state of a streaming job, created via Flink's checkpointing mechanism."}
  origin: m08-l07
  citation: "flink-savepoints#what-is-a-savepoint"
