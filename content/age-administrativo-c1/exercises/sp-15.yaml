type: case
title:
  es: "La Jefatura de Tráfico de Toledo"
scenario:
  es: "La Jefatura Central de Tráfico es un organismo autónomo del Ministerio del Interior. Su Jefatura Provincial de Tráfico de Toledo atiende en el mostrador y en la sede electrónica. Entre el lunes, 11 de enero de 2027, y el jueves, 18 de marzo de 2027, no cae en Toledo ningún festivo, y en los plazos por días hábiles solo son inhábiles los sábados y los domingos.\n\nDoña Amparo Ledesma Ortigosa, vecina de Toledo, acude al mostrador. Su hermano, Don Aurelio Ledesma Ortigosa, que no es parte ni representante en ningún procedimiento suyo, pregunta por el estado de su expediente. Ella presenta una queja por la sede electrónica, porque su lector de pantalla no puede usarla. El martes, 12 de enero de 2027, entrega en la oficina de asistencia en materia de registros de la Subdelegación del Gobierno en Toledo una solicitud de autorización, que entra en el registro electrónico de la Jefatura Central el viernes, 15 de enero de 2027. En otro expediente, la Jefatura le concede diez días hábiles para aportar un documento. En un tercer procedimiento, la Jefatura declara de oficio la tramitación de urgencia y el interesado no está conforme.\n\nLa barrera del aparcamiento daña el coche de Don Hilario Ruano Escobar, que reclama por ello.\n\nLa Jefatura Central adjudicó a Seguridad Cigarral Alto S.L. el contrato de servicios de implantación del control de accesos de la sede por 150.000 euros, IVA excluido, con un presupuesto base de licitación de 180.000 euros, IVA excluido. La empresa debía terminar el viernes, 29 de enero de 2027, y entrega el trabajo el lunes, 15 de febrero de 2027, con 17 días naturales de demora imputable a ella. Para el servicio de vigilancia de la sede, de 2027 a 2029 y de valor estimado 120.000 euros, IVA excluido, licita un procedimiento abierto simplificado.\n\nLos funcionarios citados son de carrera del Cuerpo General Administrativo, Subgrupo C1. Doña Lorena Quesada Ferrer pide una reducción de jornada porque su hija de nueve años, con leucemia, necesita un ingreso hospitalario de larga duración que acredita el servicio público de salud. El padre trabaja y no cobra retribuciones íntegras por ese permiso ni por prestación de la Seguridad Social. Doña Lidia Santos Molero tiene ocho años de servicios. Don Ignacio Valverde Cuesta cesa en la Jefatura al obtener por concurso un destino en el Ministerio de Hacienda, y Doña Sonia Merino Pardo quiere participar en otro concurso de ese Ministerio. Don Ismael Pacheco Lara llega tarde sin justificación cuatro días de enero de 2027: 2 h 10 min el lunes, 11; 3 h 25 min el lunes, 18; 1 h 50 min el viernes, 22; y 2 h 40 min el jueves, 28. Don Esteban Arroyo Lozano, con residencia oficial en Toledo, sale en comisión de servicio con derecho a indemnización a Albacete.\n\nEl capítulo 2 del presupuesto inicial de gastos de la Jefatura para 2027 es de 2.500.000 euros, y en febrero se le aprueba un suplemento de crédito de 200.000 euros. La Jefatura quiere dotar otro programa del mismo servicio con 50.000 euros de ese crédito, y aporta 40.000 euros al Ayuntamiento de Toledo, sin contrapartida directa, para financiar gastos corrientes de un programa de educación vial.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-1996-4997-art-3
- id: q01
  lesson: m02-l01
  prompt:
    es: "Don Aurelio Ledesma Ortigosa pide en el mostrador el estado de tramitación del expediente de su hermana. Según el artículo 3.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿a quién puede facilitarse esa información?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo a quienes tengan la condición de interesados en el procedimiento o a sus representantes legales."
  - id: b
    text:
      es: "A cualquier ciudadano que la pida, sin exigir para ello la acreditación de legitimación alguna."
  - id: c
    text:
      es: "A los familiares de la persona interesada hasta el segundo grado, si acreditan el parentesco."
  - id: d
    text:
      es: "A cualquier persona que se identifique, previa autorización escrita de la persona titular de la Jefatura."
  explanation:
    es: "El estado de los procedimientos en tramitación es información particular, y solo se facilita a quienes son interesados en cada procedimiento o a sus representantes legales (art. 3.1 RD 208/1996). Don Aurelio no es parte ni representante de su hermana, y el parentesco no cambia eso. La opción que la abre a cualquier ciudadano sin legitimación describe la información general (art. 2.2 RD 208/1996). La de los familiares hasta el segundo grado añade una categoría que la norma no recoge. La que exige autorización escrita de la persona titular de la Jefatura tampoco figura en el artículo."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2018-12699-art-12
- id: q02
  lesson: m02-l03
  prompt:
    es: "De acuerdo con el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, ¿hasta qué fecha debe responder la Jefatura a la queja que Doña Amparo presenta por la sede electrónica el lunes, 11 de enero de 2027?"
  options:
  - id: a
    text:
      es: "El lunes, 1 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 8 de febrero de 2027."
  - id: c
    text:
      es: "El viernes, 5 de febrero de 2027."
  - id: d
    text:
      es: "El jueves, 11 de marzo de 2027."
  explanation:
    es: "La entidad obligada responde a las quejas de accesibilidad en veinte días hábiles desde que las recibe (art. 12.3 RD 1112/2018). La Jefatura recibe la queja el lunes, 11 de enero de 2027, y el cómputo empieza el martes 12. Sin sábados ni domingos, el día hábil veinte es el lunes, 8 de febrero de 2027. La fecha del viernes, 5 de febrero de 2027, cuenta el día de la recepción como primero y llega solo al día hábil diecinueve. La del lunes, 1 de febrero de 2027, sale de contar veinte días naturales, que acaban el domingo 31 de enero y pasan al lunes. La del jueves, 11 de marzo de 2027, aplica los dos meses de la reclamación posterior, que no es esta queja."
  citation: "art. 12.3 RD 1112/2018"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-21
- id: q03
  lesson: m03-l03
  prompt:
    es: "El plazo máximo de la solicitud de autorización de Doña Amparo es de dos meses. ¿Hasta qué fecha puede notificarle la Jefatura Central la resolución expresa sin que se produzca el silencio administrativo?"
  options:
  - id: a
    text:
      es: "El viernes, 12 de marzo de 2027."
  - id: b
    text:
      es: "El domingo, 14 de marzo de 2027."
  - id: c
    text:
      es: "El martes, 16 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 15 de marzo de 2027."
  explanation:
    es: "En un procedimiento iniciado a solicitud, el plazo máximo corre desde que la solicitud entra en el registro electrónico del organismo competente para tramitarla (art. 21.3.b LPAC). Esa entrada es el viernes, 15 de enero de 2027, y no el martes 12, cuando Doña Amparo la entrega en la oficina de la Subdelegación. Los plazos en meses empiezan el día siguiente y acaban el mismo día del mes de vencimiento (art. 30.4 LPAC): el lunes, 15 de marzo de 2027, día hábil. La fecha del viernes, 12 de marzo de 2027, cuenta desde el día de la entrega en la oficina. La del domingo, 14 de marzo de 2027, cuenta el día de la entrada como primero. La del martes, 16 de marzo de 2027, suma sesenta días naturales, no dos meses."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: q04
  lesson: m03-l03
  prompt:
    es: "Señale hasta qué fecha puede ampliar la Jefatura, como máximo, el plazo de diez días hábiles que concedió a Doña Amparo el lunes, 25 de enero de 2027, si ella pide la ampliación el miércoles, 3 de febrero de 2027:"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 15 de febrero de 2027."
  - id: b
    text:
      es: "El viernes, 12 de febrero de 2027."
  - id: c
    text:
      es: "El sábado, 13 de febrero de 2027."
  - id: d
    text:
      es: "El lunes, 22 de febrero de 2027."
  explanation:
    es: "La ampliación de un plazo no puede exceder de la mitad del plazo (art. 32.1 LPAC), y la petición llega antes del vencimiento (art. 32.3 LPAC). Los diez días hábiles desde el lunes 25 de enero vencen el lunes, 8 de febrero de 2027. La mitad son cinco días hábiles más, del martes 9 al lunes, 15 de febrero de 2027. La fecha del viernes, 12 de febrero de 2027, cuenta el día del vencimiento como primero de los cinco. La del sábado, 13 de febrero de 2027, suma cinco días naturales. La del lunes, 22 de febrero de 2027, duplica el plazo con diez días hábiles más."
  citation: "art. 32.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: q05
  lesson: m03-l03
  prompt:
    es: "Si la Jefatura denegara a Doña Amparo la ampliación del plazo que pidió, ¿qué recurso cabría contra ese acuerdo, según el artículo 32.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El recurso de reposición, ante el mismo órgano, en el plazo de un mes."
  - id: b
    text:
      es: "El recurso contencioso-administrativo, directamente y sin agotar la vía administrativa."
  - id: c
    correct: true
    text:
      es: "Ninguno, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento."
  - id: d
    text:
      es: "El recurso extraordinario de revisión, si aparecen documentos nuevos."
  explanation:
    es: "Los acuerdos sobre ampliación de plazos o sobre su denegación no son susceptibles de recurso, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento (art. 32.3 LPAC). Por eso no cabe contra la denegación a Doña Amparo la reposición ni el contencioso directo. Tampoco el recurso extraordinario de revisión, que solo cabe contra actos firmes en vía administrativa."
  citation: "art. 32.3 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-33
- id: q21
  lesson: m03-l03
  prompt:
    es: "¿Qué recurso cabe contra el acuerdo de la Jefatura que declara la tramitación de urgencia, según el artículo 33.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Recurso de alzada ante el superior jerárquico de la Jefatura, en el plazo de un mes desde el acuerdo."
  - id: b
    correct: true
    text:
      es: "Ninguno contra el acuerdo, sin perjuicio del que proceda contra la resolución final del procedimiento."
  - id: c
    text:
      es: "Recurso potestativo de reposición, en el plazo de un mes, ante la propia Jefatura Central."
  - id: d
    text:
      es: "Recurso extraordinario de revisión, por tratarse de un acto de trámite que acelera el procedimiento."
  explanation:
    es: "No cabe recurso alguno contra el acuerdo que declara la tramitación de urgencia, sin perjuicio del procedente contra la resolución que ponga fin al procedimiento (art. 33.2 LPAC). La alzada y la reposición son recursos contra resoluciones y actos de trámite que la ley no excluye, y aquí la ley los excluye. El recurso extraordinario de revisión solo cabe contra actos firmes y por las causas tasadas del artículo 125. El interesado puede alegar su disconformidad al recurrir la resolución final."
  citation: "art. 33.2 LPAC"
  difficulty: 2
  tags:
  - "recurso"
  - "requisito"
# anchor: boe-a-2017-12902-art-193
- id: q07
  lesson: m03-l04
  prompt:
    es: "¿Qué importe total de penalidades por demora puede imponer la Jefatura Central a Seguridad Cigarral Alto S.L. por el retraso en la entrega, si el IVA es del 21 % y el pliego no prevé otras penalidades?"
  options:
  - id: a
    text:
      es: "Una penalidad total de 990,00 euros."
  - id: b
    text:
      es: "Una penalidad total de 1.836,00 euros."
  - id: c
    correct: true
    text:
      es: "Una penalidad total de 1.530,00 euros."
  - id: d
    text:
      es: "Una penalidad total de 1.851,30 euros."
  explanation:
    es: "Por demora en el plazo total imputable al contratista cabe imponer penalidades diarias de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido (art. 193.3 LCSP). El precio es el de adjudicación, 150.000 euros, y la penalidad diaria es de 90,00 euros. Los días son naturales (disposición adicional duodécima LCSP): 17. El total es de 90,00 por 17, es decir, 1.530,00 euros. La cifra de 1.836,00 euros calcula sobre el presupuesto base de licitación de 180.000 euros. La de 1.851,30 euros calcula sobre el precio con el 21 % de IVA. La de 990,00 euros cuenta solo los once días hábiles del retraso."
  citation: "art. 193.3 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-210
- id: q08
  lesson: m03-l04
  prompt:
    es: "Entregado el trabajo de implantación el lunes, 15 de febrero de 2027, el acto formal y positivo de recepción o conformidad debe realizarse, como máximo, en esta fecha, si el pliego no fija otro plazo:"
  options:
  - id: a
    text:
      es: "El lunes, 1 de marzo de 2027."
  - id: b
    text:
      es: "El lunes, 8 de marzo de 2027."
  - id: c
    text:
      es: "El miércoles, 17 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 15 de marzo de 2027."
  explanation:
    es: "El contrato se entiende cumplido con un acto formal y positivo de recepción o conformidad dentro del mes siguiente a la entrega (art. 210.2 LCSP). El mes se cuenta de fecha a fecha desde el día siguiente a la entrega del lunes, 15 de febrero de 2027 (art. 30.4 LPAC): acaba el lunes, 15 de marzo de 2027, día hábil. La fecha del miércoles, 17 de marzo de 2027, cuenta treinta días naturales. La del lunes, 1 de marzo de 2027, cuenta el mes desde el vencimiento del plazo de ejecución, el viernes 29 de enero, y el domingo 28 de febrero pasa al lunes. La del lunes, 8 de marzo de 2027, cuenta quince días hábiles."
  citation: "art. 210.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-159
- id: q09
  lesson: m03-l04
  prompt:
    es: "En el procedimiento abierto simplificado del servicio de vigilancia, la mesa pide por comunicación electrónica, el martes, 2 de febrero de 2027, a la empresa con mejor puntuación que constituya la garantía definitiva y aporte la documentación. ¿Hasta qué fecha puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves, 11 de febrero de 2027."
  - id: b
    text:
      es: "El martes, 9 de febrero de 2027."
  - id: c
    text:
      es: "El miércoles, 10 de febrero de 2027."
  - id: d
    text:
      es: "El martes, 16 de febrero de 2027."
  explanation:
    es: "En el abierto simplificado, la empresa con mejor puntuación constituye la garantía definitiva y aporta la documentación en siete días hábiles desde el envío de la comunicación (art. 159.4.f) LCSP; disposición adicional duodécima LCSP). Se cuentan desde el miércoles 3 de febrero: el séptimo día hábil es el jueves, 11 de febrero de 2027. La fecha del miércoles, 10 de febrero de 2027, cuenta el día del envío como primero. La del martes, 9 de febrero de 2027, cuenta siete días naturales. La del martes, 16 de febrero de 2027, aplica los diez días hábiles del requerimiento del procedimiento abierto ordinario (art. 150.2 LCSP)."
  citation: "art. 159.4.f) LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-81
- id: q10
  lesson: m03-l06
  prompt:
    es: "En la reclamación de Don Hilario, el órgano instructor pide el martes, 26 de enero de 2027, informe al servicio de mantenimiento. ¿Hasta qué fecha puede emitirse ese informe preceptivo?"
  options:
  - id: a
    text:
      es: "El viernes, 5 de febrero de 2027."
  - id: b
    text:
      es: "El lunes, 8 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 9 de febrero de 2027."
  - id: d
    text:
      es: "El martes, 16 de febrero de 2027."
  explanation:
    es: "El informe del servicio cuyo funcionamiento causó la lesión es preceptivo y su plazo de emisión no puede exceder de diez días (art. 81.1 LPAC). Son hábiles (art. 30.2 LPAC) y se cuentan desde el día siguiente a la petición, el miércoles 27 de enero: el décimo es el martes, 9 de febrero de 2027. La fecha del lunes, 8 de febrero de 2027, cuenta el día de la petición como primero. La del viernes, 5 de febrero de 2027, cuenta diez días naturales. La del martes, 16 de febrero de 2027, aplica quince días hábiles, que no es el plazo del informe."
  citation: "art. 81.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8730-art-3
- id: q11
  lesson: m04-l04
  prompt:
    es: "Según el artículo 3 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿en qué situación está Don Ignacio Valverde Cuesta durante el plazo posesorio de su nuevo destino?"
  options:
  - id: a
    text:
      es: "En servicios especiales, porque ha cesado en su puesto para ocupar un destino por concurso."
  - id: b
    correct: true
    text:
      es: "En servicio activo, porque ha cesado en su puesto por obtener otro mediante un procedimiento de provisión."
  - id: c
    text:
      es: "En servicio en otras Administraciones Públicas, porque pasa a servir en otro Departamento."
  - id: d
    text:
      es: "En excedencia voluntaria por interés particular, hasta que tome posesión del nuevo destino."
  explanation:
    es: "Se hallan en servicio activo quienes cesan en un puesto por haber obtenido otro mediante procedimientos de provisión de puestos de trabajo, durante el plazo posesorio (art. 3.i) RD 365/1995). Don Ignacio cesa al obtener por concurso su destino en el Ministerio de Hacienda, así que sigue en servicio activo. No pasa a servicios especiales, que requieren supuestos como el cargo político (art. 4 RD 365/1995). Tampoco al servicio en otras Administraciones Públicas, porque Hacienda es un Departamento de la misma Administración General del Estado. Ni a excedencia voluntaria por interés particular, que se solicita y no nace del cese."
  citation: "art. 3.i) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-49
- id: q12
  lesson: m04-l05
  prompt:
    es: "Según el artículo 49.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué derecho tiene Doña Lorena Quesada Ferrer por el ingreso hospitalario de su hija?"
  options:
  - id: a
    text:
      es: "Una reducción de al menos la mitad de la jornada, con la consiguiente reducción proporcional de sus retribuciones."
  - id: b
    text:
      es: "Una reducción de hasta el cincuenta por ciento de la jornada, retribuida, durante un mes como máximo."
  - id: c
    text:
      es: "Un permiso retribuido de cinco días hábiles por la hospitalización de un familiar de primer grado."
  - id: d
    correct: true
    text:
      es: "Una reducción de al menos la mitad de la jornada, con retribuciones íntegras con cargo al presupuesto de la Jefatura."
  explanation:
    es: "El artículo 49.e) TREBEP da a quien cuida de un hijo menor con cáncer u otra enfermedad grave, con ingreso hospitalario de larga duración acreditado por el servicio público de salud y con ambos progenitores trabajando, una reducción de al menos la mitad de la jornada con retribuciones íntegras. Para las íntegras se exige que el otro progenitor no cobre las suyas íntegras por este permiso ni por la prestación de la Seguridad Social, y el padre no las cobra. La reducción con disminución proporcional de retribuciones es la regla del caso contrario. La reducción de hasta el cincuenta por ciento durante un mes es la del cuidado de un familiar de primer grado por enfermedad muy grave (art. 48.i) TREBEP). El permiso de cinco días hábiles es el de la hospitalización de un familiar de primer grado (art. 48.a) TREBEP)."
  citation: "art. 49.e) TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-50
- id: q13
  lesson: m04-l05
  prompt:
    es: "Doña Lidia Santos Molero disfruta seguidas todas sus vacaciones anuales de 2027 desde el lunes, 1 de febrero de 2027. ¿Cuál es el último día de sus vacaciones, contando el 1 de febrero como primero?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 2 de marzo de 2027."
  - id: b
    text:
      es: "El lunes, 22 de febrero de 2027."
  - id: c
    text:
      es: "El jueves, 25 de febrero de 2027."
  - id: d
    text:
      es: "El miércoles, 3 de marzo de 2027."
  explanation:
    es: "Las vacaciones anuales son de veintidós días hábiles, y los sábados no cuentan (art. 50.1 TREBEP). Con ocho años de servicios Doña Lidia no tiene días añadidos por antigüedad, que en la Administración General del Estado empiezan con quince años (apartado 9.1 Resolución de 14-04-2026). Contando el lunes, 1 de febrero de 2027, como primer día, el día hábil veintidós es el martes, 2 de marzo de 2027. La fecha del miércoles, 3 de marzo de 2027, suma el día de los quince años de servicio. La del jueves, 25 de febrero de 2027, cuenta también los sábados. La del lunes, 22 de febrero de 2027, cuenta veintidós días naturales."
  citation: "art. 50.1 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-42
- id: q14
  lesson: m04-l05
  prompt:
    es: "El Ministerio de Hacienda publica en el «Boletín Oficial del Estado», el viernes, 15 de enero de 2027, la convocatoria del concurso al que quiere presentarse Doña Sonia Merino Pardo. ¿Hasta qué fecha puede presentar su solicitud?"
  options:
  - id: a
    text:
      es: "El sábado, 30 de enero de 2027."
  - id: b
    text:
      es: "El jueves, 4 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes, 5 de febrero de 2027."
  - id: d
    text:
      es: "El lunes, 15 de febrero de 2027."
  explanation:
    es: "El plazo de presentación de instancias del concurso es de quince días hábiles, contados desde el siguiente al de la publicación de la convocatoria en el «Boletín Oficial del Estado» (art. 42.2 RD 364/1995). Desde el lunes 18 de enero, el día hábil quince es el viernes, 5 de febrero de 2027. La fecha del jueves, 4 de febrero de 2027, cuenta el día de la publicación como primero. La del sábado, 30 de enero de 2027, cuenta quince días naturales. La del lunes, 15 de febrero de 2027, aplica un mes."
  citation: "art. 42.2 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1986-1216-art-7
- id: q15
  lesson: m04-l06
  prompt:
    es: "De acuerdo con el Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿cuál es la calificación de la conducta de Don Ismael Pacheco Lara en enero de 2027?"
  options:
  - id: a
    text:
      es: "Falta leve, porque el incumplimiento injustificado del horario acumulado en el mes no llega a diez horas."
  - id: b
    correct: true
    text:
      es: "Falta grave, porque el incumplimiento injustificado de la jornada acumula diez horas o más en el mes."
  - id: c
    text:
      es: "Falta leve, porque ningún retraso aislado alcanza por sí solo las diez horas que exige el reglamento."
  - id: d
    text:
      es: "Falta muy grave, porque acumula cuatro incumplimientos injustificados del horario en el mismo mes."
  explanation:
    es: "Los cuatro retrasos suman 10 h 5 min: 2 h 10 min, 3 h 25 min, 1 h 50 min y 2 h 40 min, todos en enero, que el reglamento toma como mes natural (art. 7.2 RD 33/1986). El incumplimiento injustificado de la jornada que acumulado suponga un mínimo de diez horas al mes es falta grave (art. 7.1.l) RD 33/1986). Con menos de diez horas sería leve, pero la suma las supera. El cómputo es mensual, no por cada retraso, así que la opción del retraso aislado falla. Ese reglamento no califica de muy grave la acumulación de retrasos, sea cual sea su número."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2002-10337-art-12
- id: q16
  lesson: m05-l04
  prompt:
    es: "Don Esteban Arroyo Lozano sale a Albacete el lunes, 8 de febrero de 2027, a las 15:30, y concluye la comisión el miércoles, 10 de febrero de 2027, a las 15:00. Según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, su manutención asciende a:"
  options:
  - id: a
    text:
      es: "74,80 euros, equivalentes a dos dietas enteras de manutención del grupo 2."
  - id: b
    text:
      es: "28,21 euros, equivalentes a una dieta entera de manutención del grupo 3."
  - id: c
    text:
      es: "84,63 euros, equivalentes a tres dietas enteras de manutención del grupo 3."
  - id: d
    correct: true
    text:
      es: "56,42 euros, equivalentes a dos dietas enteras de manutención del grupo 3."
  explanation:
    es: "La comisión dura 47 h 30 min, más de veinticuatro horas. El lunes, la salida a las 15:30, después de las catorce y antes de las veintidós horas, da el 50 por 100 de la manutención (art. 12.3.a) RD 462/2002). El martes, día intermedio, da el 100 por 100 (art. 12.3.c). El miércoles, la comisión concluye a las 15:00, después de las catorce horas, y da el 50 por 100 (art. 12.3.b). Suman dos dietas enteras de manutención. El Subgrupo C1 es el grupo 3 (anexo I RD 462/2002; disposición transitoria tercera.2 TREBEP), con 28,21 euros de manutención: 56,42 euros. Los 74,80 euros usan la manutención del grupo 2, 37,40 euros. Los 84,63 euros pagan los tres días al 100 por 100. Los 28,21 euros pagan solo el día intermedio."
  citation: "art. 12.3 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2023-16462-art-1
- id: q17
  lesson: m05-l04
  prompt:
    es: "Don Esteban Arroyo Lozano usa su automóvil, autorizado en la orden de comisión, y recorre 236 kilómetros entre ida y vuelta. ¿Qué importe le corresponde por el uso del vehículo, según la Orden HFP/793/2023, de 12 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "61,36 euros por los 236 kilómetros recorridos con el automóvil."
  - id: b
    text:
      es: "30,68 euros por los 118 kilómetros recorridos solo en el trayecto de ida."
  - id: c
    text:
      es: "25,02 euros por los 236 kilómetros con el importe de la motocicleta."
  - id: d
    text:
      es: "122,72 euros por contar dos veces los kilómetros de ida y vuelta."
  explanation:
    es: "El uso del vehículo particular se indemniza con 0,26 euros por kilómetro recorrido en automóvil (art. 1 Orden HFP/793/2023). Son 236 kilómetros entre ida y vuelta: 236 por 0,26, es decir, 61,36 euros. La cifra de 30,68 euros cuenta solo el trayecto de ida. La de 25,02 euros aplica el importe de la motocicleta, 0,106 euros por kilómetro. La de 122,72 euros cuenta dos veces los kilómetros, porque los 236 ya incluyen ida y vuelta."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2014-879-anexo-iv
- id: q18
  lesson: m05-l05
  prompt:
    es: "Señale cómo se imputa la aportación de 40.000 euros al Ayuntamiento de Toledo según la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica:"
  options:
  - id: a
    text:
      es: "Al capítulo 7, porque el Ayuntamiento recibe fondos públicos sin contrapartida directa."
  - id: b
    text:
      es: "Al capítulo 2, porque financia gasto corriente en bienes y servicios de un programa de educación vial."
  - id: c
    correct: true
    text:
      es: "Al capítulo 4, porque no hay contrapartida directa y el Ayuntamiento la destina a gasto corriente."
  - id: d
    text:
      es: "Al capítulo 6, porque la aportación financia una actuación de educación vial de carácter duradero."
  explanation:
    es: "El capítulo 4 recoge los pagos de organismos autónomos y otros entes sin contrapartida directa de los agentes receptores, que estos destinan a financiar gastos de naturaleza corriente (anexo IV, capítulo 4, Resolución de 20-01-2014). El Ayuntamiento recibe los 40.000 euros sin contrapartida directa y los gasta en un programa corriente. El capítulo 7 recoge lo que el receptor destina a operaciones de capital, y aquí es gasto corriente. El capítulo 2 es el gasto en bienes y servicios de la propia Jefatura, con contrapartida. El capítulo 6 son las inversiones reales de la propia Jefatura."
  citation: "anexo IV, capítulo 4, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-47
- id: q19
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el gasto del contrato de vigilancia que se impute a 2029, sin otros compromisos plurianuales, no podrá exceder de:"
  options:
  - id: a
    text:
      es: "1.750.000 euros, el 70 por ciento del crédito inicial del capítulo 2."
  - id: b
    correct: true
    text:
      es: "1.500.000 euros, el 60 por ciento del crédito inicial del capítulo 2."
  - id: c
    text:
      es: "1.250.000 euros, el 50 por ciento del crédito inicial del capítulo 2."
  - id: d
    text:
      es: "1.620.000 euros, el 60 por ciento del crédito del capítulo 2 tras el suplemento."
  explanation:
    es: "El gasto que se imputa a cada ejercicio posterior no puede exceder de un porcentaje del crédito inicial: 70 por ciento el ejercicio inmediato siguiente, 60 el segundo y 50 el tercero y el cuarto (art. 47.2 LGP). En un organismo autónomo los créditos de gastos corrientes en bienes y servicios se especifican a nivel de capítulo (art. 44.1 LGP). El contrato empieza en 2027 y llega a 2029, el segundo ejercicio posterior: el 60 por ciento de 2.500.000 euros, es decir, 1.500.000 euros. Los 1.750.000 euros son el 70 por ciento, el límite de 2028. Los 1.250.000 euros son el 50 por ciento, el de los ejercicios tercero y cuarto. Los 1.620.000 euros aplican el 60 por ciento al crédito de 2.700.000 euros tras el suplemento, y la norma habla del crédito inicial."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2003-21614-art-52
- id: q20
  lesson: m05-l02
  prompt:
    es: "¿Puede la Jefatura dotar otro programa del mismo servicio con 50.000 euros del crédito del capítulo 2 suplementado en febrero, mediante una transferencia de crédito?"
  options:
  - id: a
    text:
      es: "Sí, si el titular del Ministerio del Interior la autoriza previo informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "Sí, porque la restricción de las transferencias solo afecta a los créditos de distintas secciones presupuestarias."
  - id: c
    text:
      es: "Sí, si la persona titular de la Dirección del organismo la autoriza dentro de su presupuesto, sin otros requisitos."
  - id: d
    correct: true
    text:
      es: "No, porque las transferencias de crédito no pueden minorar créditos suplementados en el ejercicio."
  explanation:
    es: "Las transferencias de crédito no pueden minorar créditos extraordinarios ni créditos que se hayan suplementado o ampliado en el ejercicio (art. 52.1.c) LGP). El capítulo 2 de la Jefatura recibió un suplemento de 200.000 euros en febrero, así que no puede dotar con él a otro programa. Que el titular del Ministerio, con informe de la Intervención Delegada, o la Dirección del organismo en su presupuesto autoricen ciertas transferencias, regula quién las autoriza y no levanta la restricción. La restricción tampoco se limita a las secciones distintas, que es otra regla de la misma lista."
  citation: "art. 52.1 LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
