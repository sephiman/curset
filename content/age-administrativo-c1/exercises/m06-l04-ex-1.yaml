# anchor: fuente-ms-word-seleccionar-objetos-html
- id: m06-l04-q023
  prompt:
    es: "En Word 365, que una forma o un objeto del documento está seleccionado lo indican:"
  options:
  - id: a
    correct: true
    text:
      es: "Los controladores de tamaño que aparecen en el objeto."
  - id: b
    text:
      es: "La flecha de selección en la que se convierte el puntero."
  - id: c
    text:
      es: "Un borde alrededor del objeto y el texto asociado resaltado."
  - id: d
    text:
      es: "El delimitador de objeto con forma de anclaje junto al párrafo."
  explanation:
    es: "La página dice: «Los controladores de tamaño indican que se ha seleccionado una forma o un objeto». El anclaje indica el párrafo al que está asociado un objeto con ajuste de texto. El borde con el texto resaltado es lo que se ve al seleccionar un comentario en la vista Lista. La flecha de selección del puntero solo indica que se puede hacer clic en el objeto."
  citation: "fuente: `ms-word-seleccionar-objetos.html`; «Seleccionar una forma u otro objeto de Word»"
