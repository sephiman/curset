- id: m04-l05-q01
  prompt:
    en: Which Kotlin annotation generates static methods for functions defined in named objects or companion objects,
      so that Java code can call them on the enclosing class?
  options:
  - id: a
    text:
      en: '`@JvmOverloads`'
  - id: b
    correct: true
    text:
      en: '`@JvmStatic`'
  - id: c
    text:
      en: '`@Throws`'
  - id: d
    text:
      en: '`@IntroducedAt`'
  explanation:
    en: '`@JvmStatic` generates static methods for functions defined in named objects or companion objects. `@JvmOverloads`
      does not, because it generates overloads for optional parameters. `@Throws` does not, because it alerts callers
      about possible exceptions. `@IntroducedAt` does not, because it makes the generated overloads reflect the
      version in which each optional parameter was introduced.'
  citation: kotlin-docs-java-to-kotlin-interop#static-methods
  extract:
    en: You can also generate static methods for functions defined in named objects or companion objects if you
      annotate such functions with the @JvmStatic annotation.
- id: m04-l05-q02
  prompt:
    en: A Kotlin function throws `IOException` and has no `@Throws` annotation. Java code calls it inside a `try`
      block with `catch (IOException e)`. What does the Java compiler do?
  options:
  - id: a
    text:
      en: It compiles, because Kotlin declares every exception it throws in the Java signature
  - id: b
    text:
      en: It compiles, because Kotlin treats all exceptions as checked exceptions
  - id: c
    correct: true
    text:
      en: It reports an error, because the Kotlin function does not declare `IOException`
  - id: d
    text:
      en: It reports an error until the Java caller is annotated with `@Throws`
  explanation:
    en: The Java compiler reports an error, because the Kotlin function does not declare `IOException`. The code
      does not compile cleanly through declared exceptions, because normally the Java signatures of Kotlin functions
      do not declare exceptions thrown. Kotlin does not make the exception checked, because in Kotlin all exceptions
      are unchecked. Annotating the Java caller does not help, because the `@Throws` annotation is used in Kotlin.
  citation: kotlin-docs-java-to-kotlin-interop#checked-exceptions
  extract:
    en: You get an error message from the Java compiler, because writeToFile() does not declare IOException.
