# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q020
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde a los Ministros como titulares de su departamento, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Convocar y resolver las pruebas selectivas de personal funcionario y laboral."
  - id: b
    correct: true
    text:
      es: "Ejercer la potestad reglamentaria en las materias propias de su Departamento."
  - id: c
    text:
      es: "Desempeñar la jefatura superior de todo el personal del Departamento."
  - id: d
    text:
      es: "Ostentar la representación ordinaria del Ministerio y dirigir los servicios comunes."
  explanation:
    es: "El artículo 61.a atribuye a los Ministros «Ejercer la potestad reglamentaria en las materias propias de su Departamento». La jefatura superior del personal, la representación ordinaria con la dirección de los servicios comunes y las pruebas selectivas corresponden a los Subsecretarios (art. 63.1, letras f, encabezamiento y m)."
  citation: "art. 61.a LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-12
- id: m01-l08-q021
  prompt:
    es: "De acuerdo con la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿quién nombra y separa a los Ministros que forman parte del Gobierno?"
  options:
  - id: a
    text:
      es: "El Rey, a propuesta del Congreso de los Diputados."
  - id: b
    text:
      es: "El Consejo de Ministros, a propuesta de su Presidente."
  - id: c
    correct: true
    text:
      es: "El Rey, a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "El Presidente del Gobierno, dando cuenta al Rey."
  explanation:
    es: "El artículo 12.2 de la Ley 50/1997 dice que los Ministros «serán nombrados y separados por el Rey, a propuesta del Presidente del Gobierno». El Presidente propone pero no nombra. El Congreso no propone Ministros. El Consejo de Ministros no nombra a sus miembros."
  citation: "art. 12.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q022
  prompt:
    es: "Según el artículo 62 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia corresponde a los Secretarios de Estado en materia de nombramientos?"
  options:
  - id: a
    correct: true
    text:
      es: "Nombrar y separar a los Subdirectores Generales de la Secretaría de Estado."
  - id: b
    text:
      es: "Nombrar y separar a los Directores generales adscritos a la Secretaría de Estado."
  - id: c
    text:
      es: "Nombrar y separar a los Subsecretarios de los Ministerios de su área."
  - id: d
    text:
      es: "Nombrar a los Subdelegados del Gobierno en las provincias de su ámbito."
  explanation:
    es: "El artículo 62.2.c atribuye a los Secretarios de Estado «Nombrar y separar a los Subdirectores Generales de la Secretaría de Estado». Los Directores generales y los Subsecretarios se nombran por Real Decreto del Consejo de Ministros (arts. 66.2 y 63.3). Los Subdelegados los nombra el Delegado del Gobierno (art. 74)."
  citation: "art. 62.2.c LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q023
  prompt:
    es: "De acuerdo con el artículo 62.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios de Estado resuelven los recursos contra resoluciones de órganos directivos directamente dependientes cuyos actos:"
  options:
  - id: a
    text:
      es: "Agoten la vía administrativa, así como los conflictos de atribuciones entre dichos órganos."
  - id: b
    text:
      es: "No agoten la vía administrativa, salvo los dictados en materia de personal."
  - id: c
    text:
      es: "Pongan fin a la vía administrativa, previo informe del Subsecretario del Departamento."
  - id: d
    correct: true
    text:
      es: "No agoten la vía administrativa, así como los conflictos de atribuciones entre dichos órganos."
  explanation:
    es: "El artículo 62.2.i atribuye a los Secretarios de Estado resolver los recursos contra resoluciones de los órganos directivos que dependan directamente de él «y cuyos actos no agoten la vía administrativa, así como los conflictos de atribuciones». Si los actos agotan la vía administrativa o le ponen fin, no hay recurso ante el Secretario de Estado. La ley no excluye los actos en materia de personal."
  citation: "art. 62.2.i LRJSP"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q024
  prompt:
    es: "¿Cuál de las siguientes competencias en materia de contratos y convenios corresponde a los Secretarios de Estado, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Celebrar contratos relativos a asuntos de su Secretaría de Estado y los convenios no reservados al Ministro."
  - id: b
    text:
      es: "Celebrar cualesquiera contratos y convenios del Ministerio, incluidos los reservados al Ministro, sin autorización previa."
  - id: c
    text:
      es: "Celebrar solo los contratos que les delegue expresamente el Consejo de Ministros."
  - id: d
    text:
      es: "Celebrar los contratos de los servicios comunes del Ministerio, por delegación del Subsecretario."
  explanation:
    es: "El artículo 62.2.g atribuye a los Secretarios de Estado «Celebrar contratos relativos a asuntos de su Secretaría de Estado y los convenios no reservados al Ministro del que dependan». Los convenios reservados al Ministro quedan fuera, y la autorización sigue siendo necesaria cuando sea preceptiva. La competencia es propia, no delegada por el Consejo de Ministros ni por el Subsecretario."
  citation: "art. 62.2.g LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-15
- id: m01-l08-q025
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿cómo se nombra y se separa a los Secretarios de Estado?"
  options:
  - id: a
    text:
      es: "Por orden del Ministro del Departamento al que pertenezcan, previa comunicación al Consejo de Ministros."
  - id: b
    text:
      es: "Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro del Departamento."
  - id: c
    correct: true
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno o del Ministro del Departamento."
  - id: d
    text:
      es: "Por el Rey, a propuesta del Presidente del Gobierno, del mismo modo que a los Ministros."
  explanation:
    es: "El artículo 15.1 de la Ley 50/1997 dice que son nombrados y separados «por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan». El nombramiento por el Rey es el de los Ministros (art. 12.2). No basta una orden ministerial, y el Real Decreto es del Consejo de Ministros, no del Presidente."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q026
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano del Ministerio ostenta su representación ordinaria y dirige los servicios comunes?"
  options:
  - id: a
    text:
      es: "El Ministro, como titular del Departamento ministerial."
  - id: b
    correct: true
    text:
      es: "El titular de la Subsecretaría del Ministerio."
  - id: c
    text:
      es: "El titular de la Secretaría General Técnica."
  - id: d
    text:
      es: "El titular de la Secretaría de Estado."
  explanation:
    es: "El artículo 63.1 dice: «Los Subsecretarios ostentan la representación ordinaria del Ministerio, dirigen los servicios comunes». El Secretario general técnico depende del Subsecretario y tiene competencias sobre servicios comunes, pero no los dirige ni representa al Ministerio (art. 65.1). Los Secretarios de Estado y el Ministro no tienen atribuida la representación ordinaria."
  citation: "art. 63.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q027
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia en materia de personal corresponde en todo caso a los Subsecretarios de los Ministerios?"
  options:
  - id: a
    text:
      es: "Aprobar las relaciones de puestos de trabajo de todo el Departamento."
  - id: b
    correct: true
    text:
      es: "Desempeñar la jefatura superior de todo el personal del Departamento."
  - id: c
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  - id: d
    text:
      es: "Nombrar y separar a los Directores generales del Departamento."
  explanation:
    es: "El artículo 63.1.f atribuye al Subsecretario «Desempeñar la jefatura superior de todo el personal del Departamento». La separación del servicio la impone el Ministro (art. 61.s). Los Directores generales se nombran por Real Decreto del Consejo de Ministros (art. 66.2). En materia de relaciones de puestos de trabajo el Subsecretario solo asiste a los órganos superiores (art. 63.1.e)."
  citation: "art. 63.1.f LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q028
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué alcance tiene la potestad disciplinaria que ejercen los Subsecretarios sobre el personal del Departamento?"
  options:
  - id: a
    correct: true
    text:
      es: "Se extiende a las faltas graves o muy graves, salvo la separación del servicio."
  - id: b
    text:
      es: "Se extiende a las faltas leves, graves y muy graves, sin excepción alguna."
  - id: c
    text:
      es: "Se extiende a las faltas muy graves, incluida la sanción de separación del servicio."
  - id: d
    text:
      es: "Se limita a las faltas leves y graves, salvo la suspensión de funciones."
  explanation:
    es: "El artículo 63.1.ñ atribuye al Subsecretario la potestad disciplinaria «por faltas graves o muy graves, salvo la separación del servicio». La separación del servicio queda fuera porque la impone el Ministro (art. 61.s). La ley no le da la potestad sin excepción ni la limita a faltas leves y graves."
  citation: "art. 63.1.ñ LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q029
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia corresponde a los Subsecretarios respecto de las pruebas selectivas de personal?"
  options:
  - id: a
    text:
      es: "Convocar las pruebas selectivas de personal funcionario, cuya resolución corresponde al Ministro."
  - id: b
    text:
      es: "Resolver las pruebas selectivas de personal laboral, cuya convocatoria corresponde al Consejo de Ministros."
  - id: c
    text:
      es: "Proponer al Ministro la convocatoria de las pruebas selectivas de personal funcionario y laboral."
  - id: d
    correct: true
    text:
      es: "Convocar y resolver las pruebas selectivas de personal funcionario y laboral."
  explanation:
    es: "El artículo 63.1.m atribuye al Subsecretario «Convocar y resolver pruebas selectivas de personal funcionario y laboral». Las dos fases son suyas y abarcan los dos tipos de personal. La ley no reparte la convocatoria y la resolución con el Ministro o el Consejo de Ministros, ni reduce su papel a proponer."
  citation: "art. 63.1.m LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q030
  prompt:
    es: "De acuerdo con el artículo 63.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios serán nombrados y separados por Real Decreto del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "A propuesta del titular del Ministerio o del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Secretario de Estado del que dependan."
  - id: c
    correct: true
    text:
      es: "A propuesta del titular del Ministerio."
  - id: d
    text:
      es: "A propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 63.3 dice que los Subsecretarios se nombran y separan «por Real Decreto del Consejo de Ministros a propuesta del titular del Ministerio». La propuesta alternativa del Presidente del Gobierno es la de los Secretarios generales y los Directores generales (arts. 64.3 y 66.2). El Subsecretario no depende de un Secretario de Estado: depende del Ministro (art. 60.1)."
  citation: "art. 63.3 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q032
  prompt:
    es: "Según el artículo 63.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios se nombran entre funcionarios de carrera del Subgrupo A1 del Estado, de las Comunidades Autónomas o de las Entidades locales:"
  options:
  - id: a
    text:
      es: "O, excepcionalmente, entre personas ajenas a la función pública, mediante memoria razonada."
  - id: b
    text:
      es: "Que se encuentren en servicio activo, sin que quepa nombrar a funcionarios jubilados."
  - id: c
    correct: true
    text:
      es: "O entre personas que hubieran perdido tal condición como consecuencia de su jubilación."
  - id: d
    text:
      es: "Con una antigüedad mínima de diez años en cuerpos o escalas del Subgrupo A1."
  explanation:
    es: "El artículo 63.3 permite nombrar a funcionarios de carrera del Subgrupo A1 «o entre personas que hubieran perdido tal condición como consecuencia de su jubilación». La ley no pide antigüedad mínima. La excepción con memoria razonada existe solo para los Directores generales (art. 66.2). Los jubilados sí pueden ser nombrados."
  citation: "art. 63.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
