- id: g-application-module
  term: {en: application module}
  definition: {en: "In a Spring Boot application, an application module is a unit of functionality that exposes an API to other modules and keeps internal implementation components that other modules are not supposed to access."}
  origin: m01-l03
  citation: "spring-modulith-fundamentals#modules"
- id: g-aggregate-root
  term: {en: aggregate root}
  definition: {en: "An entity managed by a repository. In a Domain-Driven Design application, aggregate roots usually publish domain events."}
  origin: m01-l03
  citation: "spring-data-commons-domain-events#page-title"
