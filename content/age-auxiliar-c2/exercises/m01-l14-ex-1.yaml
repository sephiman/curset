# anchor: boe-a-2023-25758-art-122
- id: m01-l14-q089
  prompt:
    es: "De acuerdo con el artículo 122.1 del Real Decreto-ley 6/2023, de 19 de diciembre, la carrera horizontal consiste en el reconocimiento del desarrollo profesional del personal funcionario de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante su progresión en un sistema de tramos, sin necesidad de cambiar de puesto de trabajo."
  - id: b
    text:
      es: "Mediante su ascenso en la estructura de puestos de trabajo por los procedimientos de provisión previstos."
  - id: c
    text:
      es: "Mediante su acceso a Cuerpos o Escalas de un Subgrupo superior por promoción interna."
  - id: d
    text:
      es: "Mediante su progresión en un sistema de tramos, que exige ocupar un puesto de nivel superior."
  explanation:
    es: "El artículo 122.1 define la carrera horizontal como el reconocimiento del desarrollo profesional «mediante su progresión a través del ascenso en un sistema de tramos […] sin necesidad de cambiar de puesto de trabajo». El ascenso por los procedimientos de provisión y el acceso a un Subgrupo superior por promoción interna son otras figuras. Exigir un puesto de nivel superior contradice el «sin necesidad de cambiar de puesto»."
  citation: "art. 122.1 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-70
- id: m01-l14-q093
  prompt:
    es: "De acuerdo con el artículo 70.2 del Real Decreto 364/1995, de 10 de marzo, los funcionarios de carrera adquieren un grado personal por el desempeño de uno o más puestos del nivel correspondiente durante:"
  options:
  - id: a
    text:
      es: "Tres años continuados o cuatro con interrupción."
  - id: b
    text:
      es: "Dos años, sean continuados o con interrupción."
  - id: c
    text:
      es: "Un año continuado o dos con interrupción."
  - id: d
    correct: true
    text:
      es: "Dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 70.2 dice que el grado se adquiere «por el desempeño de uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción». Con interrupción hacen falta tres años, no dos. Las parejas de tres y cuatro años o de uno y dos años no están en el precepto."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1984-17387-art-21
- id: m01-l14-q094
  prompt:
    es: "Según el artículo 21.1.d) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿cómo se adquiere el grado personal por el desempeño de puestos?"
  options:
  - id: a
    text:
      es: "Tomando posesión de un puesto del nivel correspondiente, sin exigir un tiempo mínimo de desempeño."
  - id: b
    text:
      es: "Prestando dos años de servicio activo en el Cuerpo o Escala, cualquiera que sea el nivel del puesto."
  - id: c
    text:
      es: "Desempeñando un único puesto del nivel correspondiente durante dos años continuados, sin cambiar de puesto."
  - id: d
    correct: true
    text:
      es: "Desempeñando uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 21.1.d) dice: «El grado personal se adquiere por el desempeño de uno o más puestos de nivel correspondiente durante dos años continuados o tres con interrupción». La toma de posesión sola no basta: hace falta tiempo de desempeño. Cuenta el nivel de los puestos, no el mero servicio en el Cuerpo. Pueden ser varios puestos del mismo nivel, no uno solo."
  citation: "art. 21.1.d) Ley 30/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m01-l14-q096
  prompt:
    es: "Una funcionaria con grado 16 consolidado toma posesión el lunes 1 de marzo de 2027 de un puesto de nivel 18 y lo desempeña sin interrupción. ¿En qué fecha completa el tiempo para consolidar el grado 18?"
  options:
  - id: a
    text:
      es: "El miércoles 1 de marzo de 2028."
  - id: b
    text:
      es: "El viernes 1 de marzo de 2030."
  - id: c
    correct: true
    text:
      es: "El jueves 1 de marzo de 2029."
  - id: d
    text:
      es: "El viernes 1 de septiembre de 2028."
  explanation:
    es: "El puesto supera el grado en dos niveles, no en más de dos, así que rige la regla general del artículo 70.2: «dos años continuados». Contados de fecha a fecha desde el lunes 1 de marzo de 2027, los dos años se cumplen el jueves 1 de marzo de 2029. El miércoles 1 de marzo de 2028 es un año. El viernes 1 de septiembre de 2028 son dieciocho meses. El viernes 1 de marzo de 2030 son tres años, el tiempo exigido solo cuando hay interrupción."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-70
- id: m01-l14-q100
  prompt:
    es: "Una funcionaria del Subgrupo A2 con grado 20 consolidado obtiene por concurso un puesto de nivel 26 y lo desempeña cuatro años de forma continuada. Al cabo de esos cuatro años, el grado que tendrá consolidado es:"
  options:
  - id: a
    correct: true
    text:
      es: "El grado 24, dos niveles más por cada dos años."
  - id: b
    text:
      es: "El grado 26, el del puesto que desempeña."
  - id: c
    text:
      es: "El grado 22, dos niveles más que el que tenía."
  - id: d
    text:
      es: "El grado 20, hasta que obtenga un puesto de nivel 22."
  explanation:
    es: "El puesto supera su grado en seis niveles, más de dos, así que consolida «cada dos años de servicios continuados el grado superior en dos niveles al que poseyesen». A los dos años consolida el 22 y a los cuatro, el 24. El 26 exigiría dos años más. El 22 es el grado de los dos primeros años. No hace falta un puesto de nivel 22: el de nivel 26 permite subir de dos en dos."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-1995-8729-art-70
- id: m01-l14-q102
  prompt:
    es: "Un funcionario del Subgrupo C1 con grado 18 consolidado obtiene por concurso un puesto de nivel 20 y lo desempeña dos años continuados. El grado que consolida al cabo de esos dos años es:"
  options:
  - id: a
    correct: true
    text:
      es: "El grado 20, porque el puesto no supera su grado en más de dos niveles."
  - id: b
    text:
      es: "El grado 19, porque consolida un nivel por cada año de servicios continuados."
  - id: c
    text:
      es: "El grado 18, porque necesita tres años en el nuevo puesto para cambiar de grado."
  - id: d
    text:
      es: "El grado 22, máximo del intervalo de su Subgrupo, porque el puesto es superior."
  explanation:
    es: "La regla de dos en dos niveles del artículo 70.2 solo se aplica cuando el puesto es «superior en más de dos niveles». Aquí la diferencia es de dos, así que rige la regla general: dos años continuados en un puesto de nivel 20 dan el grado 20. No existe un ritmo de un nivel por año. Tres años solo se exigen con interrupción. El grado nunca supera «el correspondiente al del puesto desempeñado», así que el 22 queda descartado."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
# anchor: boe-a-1995-8729-art-70
- id: m01-l14-q104
  prompt:
    es: "¿Cuál de las siguientes reglas limita la consolidación del grado de dos en dos niveles cuando el puesto supera el grado personal en más de dos niveles?"
  options:
  - id: a
    text:
      es: "Puede superar el nivel del puesto desempeñado, pero no el intervalo de su Cuerpo o Escala."
  - id: b
    text:
      es: "No puede superar el nivel del puesto desempeñado, pero sí el intervalo de su Cuerpo o Escala."
  - id: c
    correct: true
    text:
      es: "No puede superar el nivel del puesto desempeñado ni el intervalo de su Cuerpo o Escala."
  - id: d
    text:
      es: "No puede superar en más de cuatro niveles el grado que tenía al obtener el puesto."
  explanation:
    es: "El artículo 70.2 del Real Decreto 364/1995 dice que esos funcionarios consolidan de dos en dos niveles «sin que en ningún caso puedan superar el correspondiente al del puesto desempeñado, ni el intervalo de niveles correspondiente a su Cuerpo o Escala». Los dos límites operan a la vez, así que las opciones que admiten superar uno de ellos son falsas. No hay un tope de cuatro niveles sobre el grado anterior."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2023-25758-dt-sexta
- id: m01-l14-q113
  prompt:
    es: "De acuerdo con la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, hasta que se apruebe la normativa reglamentaria, el intervalo de niveles del Subgrupo C1 es:"
  options:
  - id: a
    text:
      es: "Del nivel 18 al nivel 24."
  - id: b
    text:
      es: "Del nivel 14 al nivel 18."
  - id: c
    text:
      es: "Del nivel 20 al nivel 26."
  - id: d
    correct: true
    text:
      es: "Del nivel 16 al nivel 22."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo C1 el nivel mínimo 16 y el máximo 22. Del 18 al 24 es el Grupo B. Del 14 al 18 es el C2. Del 20 al 26 es el A2."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m01-l14-q114
  prompt:
    es: "Según la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, ¿cuál es el intervalo de niveles del Subgrupo A1 hasta que se apruebe la normativa reglamentaria?"
  options:
  - id: a
    text:
      es: "Del nivel 20 al nivel 30."
  - id: b
    text:
      es: "Del nivel 22 al nivel 30."
  - id: c
    correct: true
    text:
      es: "Del nivel 24 al nivel 30."
  - id: d
    text:
      es: "Del nivel 24 al nivel 28."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo A1 el intervalo del 24 al 30. Del 20 al 30 es el intervalo del antiguo Grupo A en el artículo 71.1 del Real Decreto 364/1995, no el de la disposición transitoria por la que se pregunta. El 22 no es el mínimo de ningún grupo de la tabla. El máximo del A1 es el 30, no el 28."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m01-l14-q117
  prompt:
    es: "De acuerdo con la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, los intervalos de niveles que fija para cada grupo o subgrupo de clasificación rigen:"
  options:
  - id: a
    text:
      es: "Hasta que se aprueben las leyes de Función Pública de las Comunidades Autónomas."
  - id: b
    text:
      es: "Durante los cinco años siguientes a la entrada en vigor del real decreto-ley."
  - id: c
    correct: true
    text:
      es: "Hasta tanto no se apruebe la normativa reglamentaria correspondiente."
  - id: d
    text:
      es: "Hasta que cada Departamento apruebe su nueva relación de puestos de trabajo."
  explanation:
    es: "La disposición transitoria sexta empieza: «Hasta tanto no se apruebe la normativa reglamentaria correspondiente, los intervalos de los niveles […] son los siguientes». Rige hasta esa norma reglamentaria. No depende de leyes autonómicas, de un plazo de cinco años ni de las relaciones de puestos de cada Departamento."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-71
- id: m01-l14-q118
  prompt:
    es: "De acuerdo con el artículo 71.2 del Real Decreto 364/1995, de 10 de marzo, en ningún caso los funcionarios podrán obtener puestos de trabajo:"
  options:
  - id: a
    text:
      es: "De nivel superior en más de dos niveles al correspondiente a su grado personal consolidado."
  - id: b
    correct: true
    text:
      es: "No incluidos en los niveles del intervalo correspondiente al Grupo en el que figure clasificado su Cuerpo o Escala."
  - id: c
    text:
      es: "De nivel superior al de su grado personal mientras no lo hayan consolidado durante dos años."
  - id: d
    text:
      es: "Adscritos a un Departamento ministerial distinto de aquel en el que hayan prestado servicios desde su ingreso."
  explanation:
    es: "El artículo 71.2 dice: «En ningún caso los funcionarios podrán obtener puestos de trabajo no incluidos en los niveles del intervalo correspondiente al Grupo en el que figure clasificado su Cuerpo o Escala». El límite es el intervalo del Grupo. Obtener un puesto superior en más de dos niveles al grado es posible: el artículo 70.2 regula precisamente ese caso. El precepto tampoco liga los puestos al grado ni al Departamento de ingreso."
  citation: "art. 71.2 RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-71
- id: m01-l14-q119
  prompt:
    es: "¿Para cuáles de los siguientes grupos fija intervalos de niveles el artículo 71.1 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    correct: true
    text:
      es: "Para los Grupos A, B, C, D y E."
  - id: b
    text:
      es: "Para los Subgrupos A1, A2, C1 y C2 y el Grupo B."
  - id: c
    text:
      es: "Para los Grupos A, B y C, sin dividirlos en Subgrupos."
  - id: d
    text:
      es: "Para los Subgrupos A1 y A2 y los Grupos B y C."
  explanation:
    es: "El artículo 71.1 contiene una tabla con los Grupos A, B, C, D y E, la clasificación anterior al TREBEP. Los Subgrupos A1, A2, C1 y C2 y el Grupo B son los de la disposición transitoria sexta del Real Decreto-ley 6/2023. La tabla del artículo 71.1 no se queda en tres grupos ni mezcla Subgrupos con Grupos."
  citation: "art. 71.1 RD 364/1995"
  difficulty: 3
  tags:
  - "estructura"
