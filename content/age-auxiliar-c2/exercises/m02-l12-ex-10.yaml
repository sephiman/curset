# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q197
  prompt:
    es: "¿Cuál de las siguientes es la primera de las tres fases de la Búsqueda de Google, según la guía de funcionamiento de Google?"
  options:
  - id: a
    text:
      es: "La publicación de resultados, que devuelve la información relevante para una consulta"
  - id: b
    correct: true
    text:
      es: "El rastreo, en el que programas automatizados descargan texto, imágenes y vídeos"
  - id: c
    text:
      es: "La indexación, en la que se analiza el contenido y se guarda en el índice"
  - id: d
    text:
      es: "La contratación de posicionamiento, en la que el propietario paga por mejorar su posición"
  explanation:
    es: "El rastreo es la fase inicial: Google descarga texto, imágenes y vídeos de las páginas que encuentra mediante programas automatizados. «La indexación, en la que se analiza el contenido y se guarda en el índice» es la fase que sigue al rastreo. «La publicación de resultados, que devuelve la información relevante para una consulta» es la fase final, que se produce cuando un usuario hace una búsqueda. «La contratación de posicionamiento, en la que el propietario paga por mejorar su posición» no existe como fase: Google no acepta pagos para rastrear sitios con más frecuencia ni para mejorar su posicionamiento."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Presentamos las tres fases de la Búsqueda de Google»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q198
  prompt:
    es: "¿Qué hace la Búsqueda de Google en la fase de indexación, según su guía de funcionamiento?"
  options:
  - id: a
    text:
      es: "Recibe de los propietarios cada página nueva para añadirla a mano al índice de Google"
  - id: b
    text:
      es: "Devuelve la información relevante cuando un usuario hace una consulta"
  - id: c
    text:
      es: "Descarga texto, imágenes y vídeos de las páginas mediante programas automatizados"
  - id: d
    correct: true
    text:
      es: "Analiza el texto, las imágenes y los vídeos de las páginas y los guarda en el índice"
  explanation:
    es: "En la indexación Google analiza el contenido de las páginas y almacena la información en el índice, una gran base de datos. «Descarga texto, imágenes y vídeos de las páginas mediante programas automatizados» es el rastreo, la fase anterior a la indexación. «Devuelve la información relevante cuando un usuario hace una consulta» es la publicación de resultados, que llega cuando un usuario busca. «Recibe de los propietarios cada página nueva para añadirla a mano al índice de Google» contradice la guía: la mayoría de las páginas no se envían manualmente, sino que los rastreadores las encuentran y se añaden automáticamente."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Indexación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q199
  prompt:
    es: "¿Cómo se llama el programa de Google que obtiene el contenido de las páginas durante el rastreo, según su guía de funcionamiento?"
  options:
  - id: a
    text:
      es: "Sitemap, la lista de páginas que envía el propietario del sitio"
  - id: b
    text:
      es: "Índice de Google, la gran base de datos donde se almacena la información"
  - id: c
    correct: true
    text:
      es: "Googlebot, también llamado rastreador, robot, bot o araña"
  - id: d
    text:
      es: "Canónica, la página que puede aparecer en los resultados de búsqueda"
  explanation:
    es: "El programa que obtiene el contenido es el Googlebot, que la guía también llama rastreador, robot, bot o araña. «Índice de Google, la gran base de datos donde se almacena la información» es la base de datos donde se guarda la información tras la indexación, no el programa que rastrea. «Sitemap, la lista de páginas que envía el propietario del sitio» es una lista de páginas que el propietario envía para que Google las rastree, no un programa. «Canónica, la página que puede aparecer en los resultados de búsqueda» es la página elegida entre las de contenido parecido para aparecer en los resultados."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Rastreo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q200
  prompt:
    es: "¿Cuál de las siguientes formas de descubrir URL nuevas describe Google en la fase de rastreo?"
  options:
  - id: a
    correct: true
    text:
      es: "Extraer enlaces de páginas conocidas o recibir un sitemap enviado por el propietario"
  - id: b
    text:
      es: "Esperar a que cada propietario añada a mano su página al índice"
  - id: c
    text:
      es: "Cobrar a los propietarios que quieren ser rastreados con más frecuencia"
  - id: d
    text:
      es: "Consultar un registro central que contiene todas las páginas de la Web"
  explanation:
    es: "Google descubre URL al extraer enlaces de páginas que ya conoce y cuando el propietario envía un sitemap. «Consultar un registro central que contiene todas las páginas de la Web» contradice la guía: no hay ningún registro central con todas las páginas web, y por eso Google tiene que buscar constantemente páginas nuevas. «Cobrar a los propietarios que quieren ser rastreados con más frecuencia»: Google no acepta pagos para rastrear sitios con mayor frecuencia. «Esperar a que cada propietario añada a mano su página al índice»: la mayoría de las páginas no se envían manualmente: se encuentran y se añaden automáticamente."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Rastreo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q201
  prompt:
    es: "¿Qué es la página canónica, según la guía de funcionamiento de la Búsqueda de Google?"
  options:
  - id: a
    text:
      es: "La página que Googlebot descubre antes al rastrear un sitio"
  - id: b
    text:
      es: "La página cuyo propietario ha pagado por aparecer en primer lugar en los resultados"
  - id: c
    text:
      es: "La versión para móviles, que sustituye a todas las demás versiones"
  - id: d
    correct: true
    text:
      es: "La página que puede aparecer en los resultados, elegida entre las parecidas"
  explanation:
    es: "La canónica es la página que puede aparecer en los resultados; Google agrupa las páginas parecidas y elige la más representativa del grupo. «La página que Googlebot descubre antes al rastrear un sitio» no depende del orden de descubrimiento: se elige la más representativa de un grupo de páginas con contenido parecido. «La versión para móviles, que sustituye a todas las demás versiones»: las demás páginas del grupo son versiones alternativas que se sirven en otros contextos, como una búsqueda desde un móvil, pero no sustituyen a la canónica. «La página cuyo propietario ha pagado por aparecer en primer lugar en los resultados»: Google no acepta pagos para mejorar el posicionamiento, que se hace automáticamente."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Indexación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q202
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe cómo publica Google los resultados de una consulta, según su guía de funcionamiento?"
  options:
  - id: a
    text:
      es: "Devuelve los mismos resultados a todos los usuarios que escriben la misma consulta"
  - id: b
    text:
      es: "Ordena los resultados según el importe que paga cada propietario"
  - id: c
    correct: true
    text:
      es: "Considera cientos de factores, como la ubicación, el idioma y el dispositivo"
  - id: d
    text:
      es: "Usa un único factor, el número de visitas que ha recibido cada página"
  explanation:
    es: "Para decidir la relevancia, el sistema tiene en cuenta cientos de factores, entre ellos la ubicación, el idioma y el dispositivo. «Usa un único factor, el número de visitas que ha recibido cada página» contradice la guía, que habla de cientos de factores y no de uno solo. «Ordena los resultados según el importe que paga cada propietario»: Google no acepta pagos para mejorar el posicionamiento; la clasificación es automática. «Devuelve los mismos resultados a todos los usuarios que escriben la misma consulta»: la guía pone el ejemplo de que un usuario de Barcelona y otro de Hong Kong obtienen resultados distintos con la misma consulta."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Publicación de resultados de búsqueda»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-google-busqueda-funcionamiento-html
- id: m02-l12-q203
  prompt:
    es: "¿Garantiza Google que rastreará, indexará y servirá una página que cumpla las Directrices básicas de la Búsqueda, según su guía de funcionamiento?"
  options:
  - id: a
    text:
      es: "Sí, si el propietario paga por un rastreo prioritario"
  - id: b
    correct: true
    text:
      es: "No, no lo garantiza aunque la página cumpla las directrices"
  - id: c
    text:
      es: "Sí, pero solo en la fase de rastreo, no en las de indexación ni publicación"
  - id: d
    text:
      es: "Sí, siempre que el propietario envíe un sitemap"
  explanation:
    es: "La guía dice que Google no garantiza rastrear, indexar o servir una página, aunque cumpla las directrices. «Sí, siempre que el propietario envíe un sitemap»: el sitemap solo ayuda a descubrir páginas; no hay garantía de rastreo, indexación ni publicación. «Sí, si el propietario paga por un rastreo prioritario»: Google no acepta pagos para rastrear sitios con más frecuencia ni para mejorar su posicionamiento. «Sí, pero solo en la fase de rastreo, no en las de indexación ni publicación»: la guía no garantiza ninguna de las tres fases, y añade que no todas las páginas pasan por todas ellas."
  citation: "fuente: `google-busqueda-funcionamiento.html`; «Algunas notas antes de empezar»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q213
  prompt:
    es: "¿Qué pautas de la WAI se aplican a los agentes de usuario, como los navegadores, las extensiones y los reproductores multimedia?"
  options:
  - id: a
    text:
      es: "ACT (Accessibility Conformance Testing)"
  - id: b
    text:
      es: "WCAG (Web Content Accessibility Guidelines)"
  - id: c
    text:
      es: "ATAG (Authoring Tool Accessibility Guidelines)"
  - id: d
    correct: true
    text:
      es: "UAAG (User Agent Accessibility Guidelines)"
  explanation:
    es: "Los agentes de usuario incluyen los navegadores, las extensiones de navegador y los reproductores multimedia, y las pautas que les corresponden son las UAAG. «WCAG (Web Content Accessibility Guidelines)» se aplican al contenido web: la información de una página y el código que define su estructura y presentación. «ATAG (Authoring Tool Accessibility Guidelines)» se aplican a las herramientas de creación de contenido web, como editores HTML y sistemas de gestión de contenidos. «ACT (Accessibility Conformance Testing)» establece reglas para comprobar la conformidad del contenido web; no es una pauta para navegadores."
  citation: "fuente: `w3c-wai-estandares.html`; «User Agent Accessibility Guidelines (UAAG)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-navegador-predeterminado-html
- id: m02-l12-q236
  prompt:
    es: "En Windows 11, ¿qué se selecciona junto a «Establecer Microsoft Edge como explorador predeterminado» para fijarlo como explorador por defecto?"
  options:
  - id: a
    text:
      es: "Administrar extensiones"
  - id: b
    correct: true
    text:
      es: "Establecer valor predeterminado"
  - id: c
    text:
      es: "Obtener extensiones para Microsoft Edge"
  - id: d
    text:
      es: "Anclar a Inicio"
  explanation:
    es: "Tras seleccionar Microsoft Edge en «Establecer valores predeterminados para aplicaciones», se elige «Establecer valor predeterminado» junto a esa opción. «Anclar a Inicio» es la opción que fija un elemento en el menú Inicio, no el explorador predeterminado. «Obtener extensiones para Microsoft Edge» abre la búsqueda de extensiones de Edge, según la página de extensiones. «Administrar extensiones» abre la lista para activar o desactivar extensiones, según la página de extensiones."
  citation: "fuente: `ms-win-navegador-predeterminado.html`; «Cómo configurar Microsoft Edge como explorador predeterminado»"
  difficulty: 1
  tags:
  - "configuración"
