# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q308
  prompt:
    es: "Según el artículo 9.Tres de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿quién autoriza en Defensa las generaciones de crédito por ventas de productos farmacéuticos o servicios hospitalarios?"
  options:
  - id: a
    text:
      es: "La persona titular del Ministerio de Hacienda."
  - id: b
    text:
      es: "La persona titular del Ministerio de Sanidad."
  - id: c
    correct: true
    text:
      es: "La persona titular del Ministerio de Defensa."
  - id: d
    text:
      es: "La Intervención Delegada en el Ministerio de Defensa."
  explanation:
    es: "El artículo 9.Tres de la Ley 31/2022 atribuye a la persona titular del Ministerio de Defensa las generaciones del artículo 53.2.b) motivadas por esos ingresos. Es una excepción a la regla general del artículo 62.1.b) LGP, que da las del párrafo b) en el presupuesto del Estado al Ministro de Hacienda. El Ministerio de Sanidad tiene su propia atribución en el artículo 9.Cuatro, para los ingresos de la disposición adicional décima del texto refundido de la Ley General de la Seguridad Social. La Intervención Delegada informa en las generaciones del artículo 63.1.b), pero no las autoriza."
  citation: "art. 9.Tres Ley 31/2022"
  difficulty: 3
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q309
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, la clasificación económica de gastos agrupa las operaciones financieras en dos capítulos. ¿Cómo se denominan, por este orden, los capítulos 8 y 9?"
  options:
  - id: a
    correct: true
    text:
      es: "Activos financieros y Pasivos financieros."
  - id: b
    text:
      es: "Gastos financieros y Pasivos financieros."
  - id: c
    text:
      es: "Transferencias de capital y Activos financieros."
  - id: d
    text:
      es: "Activos financieros y Gastos financieros."
  explanation:
    es: "El anexo II denomina el capítulo 8 «Activos financieros» y el 9 «Pasivos financieros». «Gastos financieros» es el capítulo 3, de las operaciones corrientes, y «Transferencias de capital» es el 7, de las de capital."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q310
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, la clasificación económica de gastos cierra las operaciones corrientes con los capítulos 3 y 4. ¿Cómo se denominan, por este orden?"
  options:
  - id: a
    correct: true
    text:
      es: "Gastos financieros y Transferencias corrientes."
  - id: b
    text:
      es: "Transferencias corrientes y Gastos financieros."
  - id: c
    text:
      es: "Gastos financieros y Transferencias de capital."
  - id: d
    text:
      es: "Gastos de personal y Transferencias corrientes."
  explanation:
    es: "El anexo II denomina el capítulo 3 «Gastos financieros» y el 4 «Transferencias corrientes», los dos últimos de las operaciones corrientes. La opción que invierte el orden pone las denominaciones en el capítulo equivocado. «Transferencias de capital» es el capítulo 7, y «Gastos de personal» es el 1."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q320
  prompt:
    es: "¿Cuál de los siguientes gastos se imputa al artículo 62 «Inversión nueva asociada al funcionamiento operativo de los servicios» del presupuesto de gastos?"
  options:
  - id: a
    correct: true
    text:
      es: "La compra de equipos inventariables de videoconferencia para unas salas que no disponían de ellos."
  - id: b
    text:
      es: "La compra de sillas análogas a las de una sala de reuniones que han quedado inservibles por su uso normal."
  - id: c
    text:
      es: "Las obras que prorrogan la vida útil del ascensor de la sede y aumentan su eficacia para el servicio."
  - id: d
    text:
      es: "La compra de dos furgonetas que sustituyen a otras dos análogas dadas de baja por su desgaste."
  explanation:
    es: "El artículo 62 recoge los proyectos de inversión «que incrementan el stock de capital público, con la finalidad de mejorar cuantitativa o cualitativamente el funcionamiento interno» de la Administración (anexo IV, art. 62, Resolución de 20 de enero de 2014). Unos equipos de videoconferencia para salas que no los tenían son bienes nuevos que se suman a los existentes: incrementan ese stock. Los otros tres gastos son de reposición, del artículo 63: las sillas análogas a otras inservibles por su uso normal reponen bienes que «hayan devenido inútiles para la prestación del mismo como consecuencia de su uso normal»; las obras del ascensor buscan «prorrogar la vida útil del bien» y aumentar su eficacia; y las furgonetas que sustituyen a otras análogas son la «sustitución de los bienes existentes por otros análogos» que el concepto 630 exige."
  citation: "anexo IV, art. 62, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q321
  prompt:
    es: "Se imputa al concepto 630 «Inversión de reposición asociada al funcionamiento operativo de los servicios» el gasto de 18.600 euros destinado a:"
  options:
  - id: a
    text:
      es: "Dotar de estanterías el archivo de una oficina de atención al público de nueva creación."
  - id: b
    correct: true
    text:
      es: "Sustituir por otras análogas las estanterías del archivo central, inútiles ya por su uso normal."
  - id: c
    text:
      es: "Comprar los primeros equipos de digitalización del archivo central, que hasta ahora no contaba con ellos."
  - id: d
    text:
      es: "Comprar estanterías adicionales para el archivo central, que se suman a las que ya tiene."
  explanation:
    es: "Al concepto 630 se imputan los mismos gastos que al 620, «siempre que se trate de sustitución de los bienes existentes por otros análogos» (anexo IV, art. 63, Resolución de 20 de enero de 2014); reponer bienes que han devenido inútiles por su uso normal es, además, una de las finalidades del artículo 63. Solo la sustitución de las estanterías inservibles por otras análogas cumple esa condición. Las estanterías de una oficina de nueva creación y los primeros equipos de digitalización son bienes que el servicio no tenía, y las estanterías adicionales se suman a las existentes sin sustituir ninguna: los tres incrementan el stock de capital público y son inversión nueva del artículo 62."
  citation: "anexo IV, art. 63, Resolución de 20-01-2014"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q322
  prompt:
    es: "De acuerdo con el anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, el artículo 62 recoge los proyectos de inversión que:"
  options:
  - id: a
    text:
      es: "Mantienen o reponen los bienes deteriorados, para que sigan cumpliendo la finalidad a que estaban destinados."
  - id: b
    text:
      es: "Reponen los bienes afectos al servicio que han devenido inútiles para su prestación por su uso normal."
  - id: c
    correct: true
    text:
      es: "Incrementan el stock de capital público, para mejorar el funcionamiento interno de la Administración."
  - id: d
    text:
      es: "Sustituyen los bienes existentes por otros análogos, destinados al funcionamiento interno de la Administración."
  explanation:
    es: "El artículo 62 «Recoge aquellos proyectos de inversión que incrementan el stock de capital público, con la finalidad de mejorar cuantitativa o cualitativamente el funcionamiento interno de la Administración del Estado, organismos autónomos, agencias estatales y otros organismos públicos». Mantener o reponer los bienes deteriorados y reponer los bienes que han devenido inútiles por su uso normal son finalidades del artículo 63, la inversión de reposición. La sustitución de los bienes existentes por otros análogos es la condición del concepto 630, también del artículo 63."
  citation: "anexo IV, art. 62, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q323
  prompt:
    es: "Según el anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, ¿qué finalidad tienen los proyectos de inversión del artículo 63?"
  options:
  - id: a
    text:
      es: "Incrementar el stock de capital público con bienes de los que el servicio no disponía."
  - id: b
    text:
      es: "Conservar las infraestructuras y los bienes destinados al uso general de los ciudadanos."
  - id: c
    text:
      es: "Adquirir por primera vez los bienes inventariables que requiere un servicio de nueva creación."
  - id: d
    correct: true
    text:
      es: "Prorrogar la vida útil del bien o ponerlo en un estado de uso que aumente su eficacia."
  explanation:
    es: "El artículo 63 recoge proyectos de inversión destinados al funcionamiento interno de la Administración con la finalidad de mantener o reponer los bienes deteriorados, de «Prorrogar la vida útil del bien o a poner éste en un estado de uso que aumente la eficacia en la cobertura de las necesidades derivadas de la prestación del servicio», o de reponer los bienes que han devenido inútiles por su uso normal. Incrementar el stock de capital público es lo propio del artículo 62, y adquirir por primera vez los bienes de un servicio nuevo incrementa ese stock, así que también es inversión nueva. Los bienes destinados al uso general quedan fuera del artículo 63, cuyos proyectos se destinan al funcionamiento interno de la Administración."
  citation: "anexo IV, art. 63, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q324
  prompt:
    es: "De acuerdo con el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los contratos de obra de carácter plurianual, la retención adicional de crédito del 10 por ciento:"
  options:
  - id: a
    correct: true
    text:
      es: "Se efectúa al adjudicarse el contrato y se aplica al ejercicio de terminación de la obra o al siguiente."
  - id: b
    text:
      es: "Se efectúa al aprobarse el gasto y se aplica al ejercicio en que se inicie la ejecución de la obra."
  - id: c
    text:
      es: "Se efectúa al adjudicarse el contrato y se reparte por igual entre los ejercicios de ejecución de la obra."
  - id: d
    text:
      es: "Se efectúa al formalizarse el contrato y se aplica al mismo ejercicio en que se formalice el contrato."
  explanation:
    es: "El artículo 47.2 manda efectuar una retención adicional de crédito del 10 por ciento del importe de adjudicación «en el momento en que ésta se realice», y añade que «Esta retención se aplicará al ejercicio en que finalice el plazo fijado en el contrato para la terminación de la obra o al siguiente, según el momento en que se prevea realizar el pago de la certificación final». La retención no se hace al aprobarse el gasto ni al formalizarse el contrato, sino al adjudicarse; y no va al ejercicio de inicio, al de formalización ni repartida entre los ejercicios de ejecución, sino al de terminación de la obra o al siguiente."
  citation: "art. 47.2 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q325
  prompt:
    es: "Conforme al artículo 47.6 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la tramitación anticipada de expedientes de contratación, de encargos a medios propios y de convenios podrá ultimarse:"
  options:
  - id: a
    text:
      es: "Hasta la aprobación del gasto, y la adjudicación se reserva al ejercicio en que se inicie la ejecución."
  - id: b
    text:
      es: "Hasta la adjudicación del contrato, y la formalización se reserva al ejercicio en que se inicie la ejecución."
  - id: c
    correct: true
    text:
      es: "Incluso con la adjudicación y formalización del contrato, aunque su ejecución deba iniciarse en ejercicios posteriores."
  - id: d
    text:
      es: "Incluso con la formalización del contrato, siempre que su ejecución se inicie dentro del mismo ejercicio."
  explanation:
    es: "El artículo 47.6 dispone que la tramitación anticipada de esos expedientes «podrá ultimarse incluso con la adjudicación y formalización del correspondiente contrato, la formalización del encargo o la suscripción del convenio, aun cuando su ejecución, ya sea en una o en varias anualidades, deba iniciarse en ejercicios posteriores». No se detiene en la aprobación del gasto ni en la adjudicación: llega hasta la formalización. Tampoco exige que la ejecución empiece en el mismo ejercicio; la admite precisamente cuando debe iniciarse en ejercicios posteriores."
  citation: "art. 47.6 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q326
  prompt:
    es: "Según el artículo 55.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué caso se financia un crédito extraordinario o suplementario del Estado con Deuda Pública o con baja en otros créditos de la misma naturaleza?"
  options:
  - id: a
    text:
      es: "Cuando la necesidad surge en operaciones no financieras del Presupuesto."
  - id: b
    correct: true
    text:
      es: "Cuando la necesidad surge en operaciones financieras del Presupuesto."
  - id: c
    text:
      es: "Cuando el crédito consignado es insuficiente pero ampliable."
  - id: d
    text:
      es: "Cuando el gasto puede demorarse hasta el ejercicio siguiente."
  explanation:
    es: "El artículo 55.1.b) financia con Deuda Pública, o con baja en otros créditos de la misma naturaleza, el crédito extraordinario o suplementario cuando la necesidad surge en operaciones financieras del Presupuesto. Si surge en operaciones no financieras, el artículo 55.1.a) lo financia con baja en el Fondo de Contingencia o en otros créditos no financieros. Un crédito ampliable e insuficiente no exige crédito extraordinario ni suplementario, porque el artículo 55.1 los prevé cuando no exista crédito adecuado o sea insuficiente y no ampliable. Y un gasto que puede demorarse hasta el ejercicio siguiente tampoco los exige: la norma los prevé para el que no puede demorarse."
  citation: "art. 55.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q328
  prompt:
    es: "Según el artículo 63.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los titulares de los ministerios pueden autorizar una transferencia entre créditos de un mismo programa con el previo informe favorable de:"
  options:
  - id: a
    text:
      es: "la Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "la Abogacía del Estado en el departamento."
  - id: c
    correct: true
    text:
      es: "la Intervención Delegada competente en el ministerio."
  - id: d
    text:
      es: "el Consejo de Estado, en pleno."
  explanation:
    es: "El artículo 63.1 LGP dice que los titulares de los ministerios podrán autorizar las transferencias entre créditos de un mismo programa «previo informe favorable de la Intervención Delegada competente en el ministerio». La Intervención General de la Administración del Estado no es la que informa: el artículo atribuye el informe a la Intervención Delegada del propio ministerio. La Abogacía del Estado y el Consejo de Estado no son los órganos que el apartado nombra: el informe previo es el de la Intervención Delegada."
  citation: "art. 63.1.a) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q329
  prompt:
    es: "Según el artículo 62.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ante un informe negativo de la Intervención Delegada que el titular del ministerio remite en discrepancia, ¿quién acuerda o deniega la modificación?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro de Hacienda."
  - id: b
    text:
      es: "El Secretario de Estado de Presupuestos y Gastos."
  - id: c
    text:
      es: "El Subsecretario del propio ministerio."
  - id: d
    text:
      es: "La Comisión de Políticas de Gasto."
  explanation:
    es: "El artículo 62.2 atribuye al Ministro de Hacienda «acordar o denegar las modificaciones presupuestarias» cuando hay informe negativo de la Intervención Delegada y el titular lo remite en discrepancia. Ni el Secretario de Estado, ni el Subsecretario, ni la Comisión de Políticas de Gasto tienen esa competencia en el artículo."
  citation: "art. 62.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q330
  prompt:
    es: "Conforme al anexo II de la Orden HAC/557/2026, de 3 de junio, el artículo 23 «Indemnizaciones por razón del servicio» pertenece al capítulo de:"
  options:
  - id: a
    text:
      es: "inversiones reales."
  - id: b
    correct: true
    text:
      es: "gastos corrientes en bienes y servicios."
  - id: c
    text:
      es: "transferencias de capital."
  - id: d
    text:
      es: "fondo de contingencia y otros imprevistos."
  explanation:
    es: "El anexo II ordena la clasificación económica por dígitos: el artículo 23 «Indemnizaciones por razón del servicio» va en el capítulo 2, «Gastos corrientes en bienes y servicios». Las inversiones reales son el capítulo 6, las transferencias de capital el 7 y el fondo de contingencia el 5."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
