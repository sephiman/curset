# anchor: boe-a-2015-11719-art-48
- id: q32
  lesson: m04-l05
  prompt:
    es: "El lunes, 28 de febrero de 2028, Don Mateo solicita el permiso de lactancia de su hija. Conforme al artículo 48.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿tiene derecho a él?"
  options:
  - id: a
    text:
      es: "Sí, porque el permiso se mantiene hasta que la hija cumple los dieciocho meses."
  - id: b
    text:
      es: "No, porque el permiso de lactancia solo corresponde a la madre biológica y no puede transferirse."
  - id: c
    text:
      es: "Sí, porque el permiso se mantiene hasta que la hija cumple los dos años."
  - id: d
    correct: true
    text:
      es: "No, porque la hija ya ha cumplido los doce meses que marca el permiso."
  explanation:
    es: "El permiso por lactancia corresponde por un hijo menor de doce meses (art. 48.f) TREBEP). La hija nació el miércoles 17 de febrero de 2027 y cumplió doce meses el jueves 17 de febrero de 2028, así que el lunes 28 de febrero de 2028, ya no es menor de esa edad. Las opciones de los dieciocho meses y de los dos años alargan el límite de edad. La opción de que solo corresponde a la madre biológica es falsa: es un derecho individual de los funcionarios, sin que pueda transferirse al otro progenitor."
  citation: "art. 48.f) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: q33
  lesson: m04-l04
  prompt:
    es: "Conforme al artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿hasta qué mes puede prolongarse como máximo la excedencia que solicita Don Mateo?"
  options:
  - id: a
    text:
      es: "Hasta abril de 2029, un año después de que empiece la excedencia."
  - id: b
    correct: true
    text:
      es: "Hasta febrero de 2030, tres años después del nacimiento de su hija."
  - id: c
    text:
      es: "Hasta octubre de 2030, treinta meses después de que empiece la excedencia."
  - id: d
    text:
      es: "Hasta abril de 2031, tres años después de que empiece la excedencia."
  explanation:
    es: "La excedencia por cuidado de cada hijo no puede superar los tres años, a contar desde la fecha de nacimiento (art. 89.4 TREBEP). La hija nació el miércoles 17 de febrero de 2027, así que el máximo llega a febrero de 2030, aunque la excedencia empiece en abril de 2028. Las opciones de abril de 2031 y octubre de 2030 cuentan el plazo desde el inicio de la excedencia, con tres años y con treinta meses. La de abril de 2029 aplica un solo año, que no es el límite del artículo."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-89
- id: q34
  lesson: m04-l04
  prompt:
    es: "Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué duración máxima tiene la excedencia que solicita Doña Irene?"
  options:
  - id: a
    text:
      es: "Una duración no superior a dos años, el plazo de reserva del puesto."
  - id: b
    correct: true
    text:
      es: "Una duración no superior a tres años."
  - id: c
    text:
      es: "Una duración no superior a un año, prorrogable por otro año."
  - id: d
    text:
      es: "Una duración mínima de dos años y máxima de quince años."
  explanation:
    es: "Los funcionarios tienen derecho a una excedencia no superior a tres años para cuidar de un familiar a su cargo, hasta el segundo grado, que por enfermedad no pueda valerse por sí mismo y no realice actividad retribuida (art. 89.4 TREBEP). La madre de Doña Irene cumple esos requisitos. La opción de los dos años confunde la excedencia con el plazo de reserva del puesto. La del año prorrogable no figura en el artículo. La del mínimo de dos años y máximo de quince corresponde a la excedencia voluntaria por agrupación familiar."
  citation: "art. 89.4 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-art-54
- id: q35
  lesson: m04-l05
  prompt:
    es: "Según el artículo 54 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué principio de conducta incumple la actuación que se imputa a Don Rubén Salcedo Ibáñez?"
  options:
  - id: a
    text:
      es: "Desempeñar las tareas del puesto de forma diligente y cumpliendo la jornada y el horario establecidos."
  - id: b
    text:
      es: "Garantizar la atención al ciudadano en la lengua que lo solicite, si es oficial en el territorio."
  - id: c
    correct: true
    text:
      es: "Administrar los recursos y bienes públicos con austeridad, sin utilizarlos en provecho propio ni de personas allegadas."
  - id: d
    text:
      es: "Mantener actualizada su formación y cualificación."
  explanation:
    es: "Los empleados públicos administran los recursos y bienes públicos con austeridad y no los utilizan en provecho propio o de personas allegadas (art. 54.5 TREBEP). El vehículo oficial es un bien público y Don Rubén lo usa para fines particulares. El principio de la diligencia y la jornada se refiere al cumplimiento de las tareas y del horario, que no se discute. El de la atención al ciudadano en la lengua que solicite no guarda relación con el hecho. El de la formación tampoco."
  citation: "art. 54.5 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-98
- id: q42
  lesson: m04-l06
  prompt:
    es: "Conforme al artículo 98.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿cómo se reparten las fases del expediente disciplinario que el Presidente incoa a Don Rubén?"
  options:
  - id: a
    correct: true
    text:
      es: "Órganos distintos: uno instruye el expediente y otro impone la sanción."
  - id: b
    text:
      es: "Un solo órgano: el que incoa el expediente lo instruye y lo resuelve."
  - id: c
    text:
      es: "Un solo órgano, que nombra funcionarios distintos para cada una de las fases."
  - id: d
    text:
      es: "Órganos distintos solo en las faltas muy graves; en las graves, el mismo órgano."
  explanation:
    es: "El procedimiento disciplinario separa la fase instructora de la sancionadora y las encomienda a órganos distintos (art. 98.2 TREBEP). Quien incoa el expediente a Don Rubén no puede, por tanto, instruirlo y resolverlo a la vez. La opción de un solo órgano que instruye y resuelve ignora esa separación. La del único órgano con funcionarios distintos para cada fase la mantiene en un órgano, que es lo que el artículo excluye. La que limita la separación a las faltas muy graves añade una distinción que el artículo no hace."
  citation: "art. 98.2 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-56
- id: q37
  lesson: m05-l02
  prompt:
    es: "Conforme al artículo 56.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿hasta qué importe, sumando los suplementos del ejercicio en el capítulo 2, puede autorizar el Ministro de Hacienda un suplemento de crédito de la Confederación?"
  options:
  - id: a
    text:
      es: "500.000 euros, porque es el límite del Presidente de la Confederación."
  - id: b
    text:
      es: "620.000 euros, porque es el 10 por ciento del capítulo."
  - id: c
    correct: true
    text:
      es: "1.000.000 de euros, tope inferior al 20 por ciento del capítulo."
  - id: d
    text:
      es: "1.240.000 euros, porque es el 20 por ciento del capítulo."
  explanation:
    es: "El Ministro de Hacienda autoriza cuando, superándose alguno de los límites del Presidente, no se alcance el 20 por ciento del capítulo ni se supere la cuantía de 1.000.000 de euros (art. 56.3.b LGP). El 20 por ciento de 6.200.000 euros son 1.240.000 euros, mayor que el tope de 1.000.000, que es el que manda. La opción de 500.000 euros es el límite del Presidente. La de 620.000 euros es el 10 por ciento del capítulo, también del Presidente. La de 1.240.000 euros ignora el tope absoluto."
  citation: "art. 56.3.b LGP"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2003-21614-art-56
- id: q38
  lesson: m05-l02
  prompt:
    es: "Según el artículo 56.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuántos euros más puede autorizar este año el Presidente de la Confederación, por sí solo, en suplementos de crédito del capítulo 2?"
  options:
  - id: a
    correct: true
    text:
      es: "200.000 euros, porque el límite de 500.000 euros es del conjunto del ejercicio."
  - id: b
    text:
      es: "320.000 euros, porque el límite es el 10 por ciento del capítulo, sin tope."
  - id: c
    text:
      es: "340.000 euros, porque cubre la parte que aún falta del suplemento previsto."
  - id: d
    text:
      es: "500.000 euros, porque el límite se aplica a cada suplemento por separado en el ejercicio."
  explanation:
    es: "El Presidente autoriza hasta el 10 por ciento del capítulo cuando no supere 500.000 euros (art. 56.3.a LGP): el 10 por ciento de 6.200.000 euros son 620.000, así que manda el tope de 500.000. Esos límites se refieren al conjunto de las modificaciones del ejercicio (art. 56.4 LGP), y ya ha autorizado 300.000 euros, que no se financian con aportación del Estado. Le quedan 200.000 euros. La opción de 320.000 euros aplica el 10 por ciento sin el tope. La de 340.000 euros resta 300.000 de la falta de 640.000. La de 500.000 euros no suma lo ya autorizado."
  citation: "art. 56.4 LGP"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2003-21614-art-53
- id: q39
  lesson: m05-l02
  prompt:
    es: "Según el artículo 53.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede la Confederación generar ya crédito con la aportación comunicada por el Estado?"
  options:
  - id: a
    text:
      es: "No, porque la generación solo puede realizarse cuando se hayan efectuado los ingresos que la justifican en todo caso."
  - id: b
    correct: true
    text:
      es: "Sí, porque en un organismo autónomo basta un compromiso firme de aportación con ingreso previsto en el ejercicio."
  - id: c
    text:
      es: "No, porque la aportación del Estado a un organismo autónomo no puede dar lugar a generaciones de crédito."
  - id: d
    text:
      es: "Sí, porque basta la comunicación de la aportación, aunque el ingreso no se prevea en el propio ejercicio."
  explanation:
    es: "En los organismos autónomos, la generación por aportación del Estado puede realizarse una vez reconocido el derecho o cuando exista un compromiso firme de aportación, siempre que el ingreso se prevea en el propio ejercicio (art. 53.3 LGP). La aportación es un compromiso firme para este año, aunque no esté ingresada. La opción de esperar a los ingresos aplica la regla general, que este artículo exceptúa. La de negar la generación por aportación del Estado contradice el artículo 53.2.a). La de bastar la comunicación suprime los requisitos del compromiso firme y del ingreso en el propio ejercicio."
  citation: "art. 53.3 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-155
- id: q40
  lesson: m05-l03
  prompt:
    es: "Conforme al artículo 155 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién conoce de la discrepancia que la Confederación plantea contra el reparo al expediente de gasto?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, que adopta la resolución definitiva en todos los casos."
  - id: b
    text:
      es: "El Ministro de Hacienda, a propuesta del Presidente de la Confederación y previo informe."
  - id: c
    text:
      es: "La propia Intervención Delegada que formuló el reparo, que resuelve de forma definitiva."
  - id: d
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado, con resolución obligatoria para la Delegada."
  explanation:
    es: "Si el reparo lo formuló una intervención delegada, corresponde a la Intervención General de la Administración del Estado conocer la discrepancia, y su resolución es obligatoria para aquella (art. 155.a) LGP). La discrepancia llega a ella a través del Presidente de la Confederación. La opción del Consejo de Ministros solo vale cuando el reparo es de la propia Intervención General o esta confirmó el de una delegada. La del Ministro de Hacienda no figura en el procedimiento. La de la Intervención Delegada que resuelve su propio reparo anula la garantía de la discrepancia."
  citation: "art. 155.a) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
