  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-5
- id: m02-l03-q118
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Consejo de Cooperación Archivística es el órgano de cooperación entre las administraciones públicas en materia de archivos, adscrito al Ministerio de Cultura a través de:"
  options:
  - id: a
    text:
      es: "La Subdirección General de los Archivos Estatales."
  - id: b
    text:
      es: "La Subsecretaría de Cultura."
  - id: c
    text:
      es: "La Presidencia del Gobierno."
  - id: d
    correct: true
    text:
      es: "La Secretaría de Estado de Cultura."
  explanation:
    es: "La adscripción se hace a través de la Secretaría de Estado de Cultura. La Subsecretaría y la Subdirección General están en otro nivel del Ministerio, y la Presidencia del Gobierno no interviene."
  citation: "art. 5.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-5
- id: m02-l03-q120
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, entre las funciones del Consejo de Cooperación Archivística está la propuesta y promoción de políticas públicas, directrices y estrategias relativas a la administración de archivos y patrimonio documental, con especial atención a:"
  options:
  - id: a
    correct: true
    text:
      es: "La implantación de las nuevas tecnologías en la gestión de los archivos."
  - id: b
    text:
      es: "La participación en proyectos supranacionales de digitalización de fondos."
  - id: c
    text:
      es: "La formación profesional del personal de los archivos privados y públicos."
  - id: d
    text:
      es: "La conservación preventiva de los fondos de los archivos históricos estatales."
  explanation:
    es: "La función destaca la implantación de las nuevas tecnologías en la gestión de los archivos. La conservación preventiva, los proyectos supranacionales y la formación del personal privado no son el énfasis de esa letra."
  citation: "art. 5.2.c) RD 1708/2011"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-5
- id: m02-l03-q121
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, entre las funciones del Consejo de Cooperación Archivística está informar los planes de cooperación archivística, proceder a su seguimiento y, eventualmente, a:"
  options:
  - id: a
    text:
      es: "La suscripción de los convenios que se deriven de ellos."
  - id: b
    text:
      es: "La designación de los órganos que los ejecuten."
  - id: c
    text:
      es: "La aprobación definitiva de su texto."
  - id: d
    correct: true
    text:
      es: "La propuesta de su actualización."
  explanation:
    es: "El Consejo informa los planes, les hace seguimiento y, si procede, propone su actualización. Aprobarlos corresponde al Consejo de Ministros, y los convenios y la designación de ejecutores no son funciones suyas."
  citation: "art. 5.2.d) RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-5
- id: m02-l03-q123
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, la elaboración de criterios uniformes para el desarrollo de los servicios archivísticos es función de:"
  options:
  - id: a
    text:
      es: "El Archivo General de la Administración."
  - id: b
    text:
      es: "La Comisión Superior Calificadora de Documentos Administrativos."
  - id: c
    text:
      es: "La Comisión de Archivos de la Administración General del Estado."
  - id: d
    correct: true
    text:
      es: "El Consejo de Cooperación Archivística."
  explanation:
    es: "Elaborar criterios uniformes es una función del Consejo de Cooperación Archivística. La Comisión de Archivos coordina el Sistema de la Administración General del Estado, la Comisión Superior Calificadora dictamina sobre calificación de documentos y el Archivo General de la Administración custodia documentos."
  citation: "art. 5.2.b) RD 1708/2011"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2011-18541-art-9
- id: m02-l03-q048
  prompt:
    es: "Según el artículo 9 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los documentos de los archivos de oficina, concluida su tramitación, se transfieren al archivo central del Departamento:"
  options:
  - id: a
    text:
      es: "Al cumplirse cinco años desde la finalización del procedimiento."
  - id: b
    correct: true
    text:
      es: "De acuerdo con los plazos establecidos durante el proceso de valoración."
  - id: c
    text:
      es: "Cuando lo acuerde la Comisión de Archivos de la Administración General del Estado."
  - id: d
    text:
      es: "Una vez prescritas las acciones derivadas del procedimiento."
  explanation:
    es: "El artículo 9 dice que esos documentos «serán objeto de transferencia al archivo central del Departamento respectivo, de acuerdo con los plazos establecidos durante el proceso de valoración». El Real Decreto no fija cinco años. La transferencia no depende de un acuerdo de la Comisión de Archivos. Tampoco de la prescripción de las acciones."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q049
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde al Archivo Central según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Eliminar los documentos de apoyo informativo antes de la transferencia al Archivo central."
  - id: b
    correct: true
    text:
      es: "Llevar a cabo el proceso de identificación de series y elaborar el cuadro de clasificación."
  - id: c
    text:
      es: "Acreditar las actuaciones y actividades de la unidad productora de los documentos."
  - id: d
    text:
      es: "Custodiar los documentos en fase de tramitación o de continua consulta administrativa."
  explanation:
    es: "El artículo 10.1 incluye entre las funciones del Archivo Central «Llevar a cabo el proceso de identificación de series y elaborar el cuadro de clasificación». Eliminar los documentos de apoyo informativo y acreditar las actuaciones de la unidad productora son funciones de los archivos de oficina o de gestión (artículo 9). Custodiar los documentos en tramitación o de continua consulta también es propio de esos archivos de oficina."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q050
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los archivos generales o centrales custodian los documentos:"
  options:
  - id: a
    text:
      es: "Mientras están en fase de tramitación o sometidos a continua utilización y consulta administrativa por su unidad productora."
  - id: b
    text:
      es: "Desde que se producen, para apoyar la gestión administrativa de cada unidad productora."
  - id: c
    correct: true
    text:
      es: "Una vez finalizada su tramitación y transcurridos los plazos de la normativa o de los calendarios de conservación."
  - id: d
    text:
      es: "Una vez finalizada su tramitación, sin sujeción a plazo alguno de permanencia previa."
  explanation:
    es: "El artículo 10.1 dice que estos archivos custodian los documentos «una vez finalizada su tramitación y transcurridos los plazos establecidos por la normativa vigente o en los calendarios de conservación». La fase de tramitación y de continua consulta corresponde a los archivos de oficina o de gestión (artículo 9). Apoyar la gestión desde la producción también es función de esos archivos. No basta que termine la tramitación: deben transcurrir los plazos."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-11
- id: m02-l03-q053
  prompt:
    es: "Según el artículo 11 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el archivo intermedio custodia los documentos de los Departamentos ministeriales y sus organismos públicos:"
  options:
  - id: a
    text:
      es: "Mientras se encuentran en fase de tramitación o de continua utilización administrativa."
  - id: b
    text:
      es: "Una vez declarado su valor histórico por la Comisión Superior Calificadora."
  - id: c
    correct: true
    text:
      es: "Una vez finalizada su fase activa conforme a lo establecido en los calendarios de conservación."
  - id: d
    text:
      es: "Desde su producción hasta su eliminación o su conservación permanente."
  explanation:
    es: "El artículo 11 define el archivo intermedio como responsable de la custodia de esos documentos «una vez finalizada su fase activa conforme a lo establecido en los calendarios de conservación». La fase de tramitación es la de los archivos de oficina. Los documentos con valor histórico van al archivo histórico. Desde la producción hasta la eliminación o conservación permanente es todo el ciclo vital, no la fase del archivo intermedio."
  citation: "art. 11 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-11
- id: m02-l03-q054
  prompt:
    es: "¿Cuál de las siguientes es una función del Archivo General de la Administración según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Coordinar y controlar el funcionamiento de los archivos de gestión de cada Ministerio."
  - id: b
    text:
      es: "Organizar los documentos producidos por cada una de las unidades administrativas."
  - id: c
    text:
      es: "Custodiar los documentos en fase de tramitación de cada unidad administrativa."
  - id: d
    correct: true
    text:
      es: "Conservar los documentos que son transferidos desde los Archivos Centrales de los Ministerios."
  explanation:
    es: "El artículo 11 da al Archivo General de la Administración, como primera función, «Conservar los documentos que son transferidos desde los Archivos Centrales de los Ministerios». Coordinar y controlar los archivos de gestión es función del Archivo Central (artículo 10.1). Organizar los documentos de cada unidad y custodiar los que están en tramitación corresponde a los archivos de oficina o de gestión (artículo 9)."
  citation: "art. 11 RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q056
  prompt:
    es: "Según el artículo 12.1 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los archivos históricos custodian, conservan y tratan los fondos del patrimonio histórico documental español:"
  options:
  - id: a
    text:
      es: "Que tengan una antigüedad superior a cien años, cualquiera que sea la persona física o jurídica que los produjo."
  - id: b
    text:
      es: "Que hayan finalizado su fase activa conforme a lo establecido en los calendarios de conservación de cada Ministerio."
  - id: c
    text:
      es: "Que generen o reúnan las Comunidades Autónomas y las Entidades Locales en su ámbito."
  - id: d
    correct: true
    text:
      es: "Que reflejen la trayectoria de la administración estatal o resulten altamente significativos por su valor histórico."
  explanation:
    es: "El artículo 12.1 se refiere a los fondos «que sean reflejo de la trayectoria de la administración estatal a lo largo de la historia o que en todo caso resulten altamente significativos por su valor histórico, su singular importancia o su proyección internacional». Los cien años son un requisito del artículo 49.4 de la Ley 16/1985 para los particulares. La fase activa finalizada define lo que custodia el archivo intermedio (artículo 11). Los fondos de las Comunidades Autónomas y Entidades Locales no son el criterio del artículo."
  citation: "art. 12.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q057
  prompt:
    es: "Fuera del ámbito de los servicios periféricos, ¿qué archivo ejerce las funciones de archivo histórico de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El Archivo General de la Administración."
  - id: b
    text:
      es: "El Archivo Central del Ministerio de Cultura."
  - id: c
    text:
      es: "El archivo central de cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "El Archivo Histórico Nacional."
  explanation:
    es: "El artículo 12.2 del Real Decreto 1708/2011 dice: «El Archivo Histórico Nacional ejerce las funciones de archivo histórico de la Administración General del Estado». El Archivo General de la Administración es el archivo intermedio (artículo 11). El archivo central de cualquier Ministerio, el de Cultura incluido, es un archivo general o central (artículo 10)."
  citation: "art. 12.2 RD 1708/2011"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q058
  prompt:
    es: "Según el artículo 12.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿desde qué archivo recibe el Archivo Histórico Nacional los documentos con valor histórico que conserva?"
  options:
  - id: a
    text:
      es: "Directamente desde los archivos centrales de los Ministerios."
  - id: b
    text:
      es: "Desde los archivos de oficina o de gestión."
  - id: c
    correct: true
    text:
      es: "Desde el Archivo General de la Administración."
  - id: d
    text:
      es: "Desde los Archivos Históricos Provinciales."
  explanation:
    es: "Entre las funciones del Archivo Histórico Nacional, el artículo 12.2.a) recoge «Conservar los documentos con valor histórico que le son transferidos desde el Archivo General de la Administración». Los archivos centrales transfieren al archivo intermedio, no al histórico. Los archivos de oficina transfieren al archivo central. Los Archivos Históricos Provinciales ejercen las funciones de archivo intermedio e histórico en los servicios periféricos; el artículo no los señala como origen de esas transferencias."
  citation: "art. 12.2.a) RD 1708/2011"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-8
- id: m02-l03-q064
  prompt:
    es: "¿Cuál de las siguientes NO es una clase de archivo de la Administración General del Estado según el artículo 8 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Archivos de oficina o de gestión."
  - id: b
    correct: true
    text:
      es: "Archivos de conservación permanente."
  - id: c
    text:
      es: "Archivo intermedio."
  - id: d
    text:
      es: "Archivos históricos."
  explanation:
    es: "El artículo 8 clasifica los Archivos, atendiendo al ciclo vital, en archivos de oficina o de gestión, archivos generales o centrales de los Ministerios y de sus organismos públicos, archivo intermedio y archivos históricos. Los archivos de oficina o de gestión, el archivo intermedio y los archivos históricos están en esa lista. Los «archivos de conservación permanente» no son una clase: la conservación permanente es uno de los destinos posibles de los documentos al final del ciclo vital."
  citation: "art. 8 RD 1708/2011"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2011-18541-art-9
- id: m02-l03-q124
  prompt:
    es: "Entre las clases de archivo del Estado, ¿qué documentos custodian los archivos que existen en todos los órganos y unidades administrativas de la Administración?"
  options:
  - id: a
    text:
      es: "Los transferidos desde los Archivos Centrales de los Ministerios y organismos públicos."
  - id: b
    correct: true
    text:
      es: "Los que están en fase de tramitación o sometidos a continua utilización y consulta administrativa."
  - id: c
    text:
      es: "Los que han finalizado su fase activa conforme a los calendarios de conservación."
  - id: d
    text:
      es: "Los de valor histórico transferidos por el Archivo General de la Administración."
  explanation:
    es: "Los archivos de oficina o de gestión custodian documentos en tramitación o de consulta continua. Los transferidos por los Archivos Centrales llegan al archivo intermedio. Los documentos con fase activa terminada también son del intermedio, y los de valor histórico, del archivo histórico."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-9
- id: m02-l03-q125
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, entre las funciones de los archivos de oficina o de gestión figura apoyar:"
  options:
  - id: a
    text:
      es: "La coordinación de los archivos del Departamento."
  - id: b
    text:
      es: "La investigación científica de los fondos."
  - id: c
    text:
      es: "La difusión cultural del patrimonio documental."
  - id: d
    correct: true
    text:
      es: "La gestión administrativa."
  explanation:
    es: "Los archivos de gestión apoyan la gestión administrativa. La investigación, la difusión cultural y la coordinación de los archivos del Departamento son funciones de otros archivos, esta última del Archivo Central."
  citation: "art. 9 RD 1708/2011"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-9
- id: m02-l03-q126
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, entre las funciones de los archivos de oficina o de gestión figura organizar:"
  options:
  - id: a
    text:
      es: "Los instrumentos de descripción del archivo histórico."
  - id: b
    text:
      es: "Las series de cada Departamento para su valoración."
  - id: c
    correct: true
    text:
      es: "Los documentos producidos por sus respectivas unidades."
  - id: d
    text:
      es: "Los documentos transferidos desde los Archivos Centrales."
  explanation:
    es: "Cada archivo de gestión organiza los documentos que producen sus propias unidades. Los transferidos desde los Archivos Centrales, la valoración de series del Departamento y la descripción histórica corresponden a archivos de otras fases."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q128
  prompt:
    es: "¿Cuántas funciones tiene el Archivo Central de los Ministerios y organismos públicos en el Sistema de Archivos de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Cinco funciones."
  - id: b
    correct: true
    text:
      es: "Ocho funciones."
  - id: c
    text:
      es: "Diez funciones."
  - id: d
    text:
      es: "Siete funciones."
  explanation:
    es: "El Archivo Central cumple ocho funciones. Cinco son las de los archivos de oficina y siete las del Archivo General de la Administración, de ahí que sean las cifras cercanas."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q130
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Archivo Central coordina y controla el funcionamiento de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los distintos archivos de gestión."
  - id: b
    text:
      es: "Los Archivos Centrales de los demás Ministerios."
  - id: c
    text:
      es: "Los archivos históricos provinciales de las Delegaciones del Gobierno."
  - id: d
    text:
      es: "Las oficinas de asistencia en materia de registros."
  explanation:
    es: "El Archivo Central coordina y controla los distintos archivos de gestión. Las oficinas de asistencia pertenecen al registro, los archivos históricos provinciales actúan en los servicios periféricos y los Archivos Centrales de otros Ministerios son pares, no subordinados."
  citation: "art. 10.1.1.º RD 1708/2011"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-11
- id: m02-l03-q131
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, entre las funciones del Archivo General de la Administración está aplicar las resoluciones de la Comisión Superior Calificadora de Documentos Administrativos relativas a la conservación permanente y:"
  options:
  - id: a
    text:
      es: "A la descripción de las fracciones de serie de los archivos de gestión."
  - id: b
    text:
      es: "A la transferencia a los Archivos Históricos Provinciales."
  - id: c
    text:
      es: "A la propuesta de plazos de los calendarios de conservación."
  - id: d
    correct: true
    text:
      es: "Al acceso, en su caso, de agrupaciones documentales."
  explanation:
    es: "Las resoluciones que aplica el Archivo General de la Administración se refieren a la conservación permanente y al acceso, en su caso, de agrupaciones documentales. La descripción, las transferencias provinciales y los plazos de los calendarios no son materia de esa función."
  citation: "art. 11 RD 1708/2011"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-11
- id: m02-l03-q132
  prompt:
    es: "Atendiendo al ciclo vital de los documentos, ¿qué archivo es el archivo intermedio de la Administración General del Estado, según la normativa vigente?"
  options:
  - id: a
    correct: true
    text:
      es: "El Archivo General de la Administración."
  - id: b
    text:
      es: "El Archivo Histórico Nacional, adscrito al Ministerio de Cultura."
  - id: c
    text:
      es: "Los Archivos Históricos Provinciales de las Delegaciones del Gobierno."
  - id: d
    text:
      es: "El Archivo Central de cada uno de los Ministerios."
  explanation:
    es: "El archivo intermedio de la Administración General del Estado es el Archivo General de la Administración. El Archivo Histórico Nacional es el histórico, el Archivo Central es el de cada Ministerio y los provinciales actúan en los servicios periféricos."
  citation: "art. 11 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
