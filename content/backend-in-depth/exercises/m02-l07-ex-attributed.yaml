variants:
- id: m02-l07-qa04
  prompt:
    en: According to Jeff Erickson in Backtracking, what does he advise aiming for when designing a new backtracking
      algorithm for a problem that has several possible variants?
  options:
  - id: a
    correct: true
    text:
      en: The simplest possible variant, computing a number or even a single boolean
  - id: b
    text:
      en: A fast algorithm first, and a correct algorithm only once the speed is right
  - id: c
    text:
      en: A search that skips the obviously stupid choices so that fewer possibilities are tried
  - id: d
    text:
      en: The most detailed variant, because each variant needs a recursive strategy of its own
  explanation:
    en: Erickson writes that when we design backtracking algorithms we should aim for the simplest possible variant
      of the problem, computing a number or even a single boolean. He rules out making the algorithm fast first,
      because he writes that you can make the algorithm faster later. He rules out skipping obviously stupid choices,
      because he writes that there is no skipping obviously stupid choices and that you should try everything. He
      rules out a separate strategy for each variant, because he writes that the same recursive strategy can be
      used to solve many different variants of the same problem.
