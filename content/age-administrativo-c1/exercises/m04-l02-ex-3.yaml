# anchor: boe-a-2015-11719-art-59
- id: m04-l02-q045
  prompt:
    es: "Según el artículo 59.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en las ofertas de empleo público se reservará para personas con discapacidad un cupo:"
  options:
  - id: a
    text:
      es: "No inferior al quince por ciento de las vacantes"
  - id: b
    text:
      es: "No inferior al siete por ciento de los efectivos totales"
  - id: c
    text:
      es: "No superior al siete por ciento de las vacantes"
  - id: d
    correct: true
    text:
      es: "No inferior al siete por ciento de las vacantes"
  explanation:
    es: "El artículo 59.1 reserva «un cupo no inferior al siete por ciento de las vacantes». El quince por ciento no está en el artículo. El siete por ciento es un mínimo, no un máximo. El cupo se calcula sobre las vacantes; los efectivos totales son la base del objetivo progresivo del dos por ciento."
  citation: "art. 59.1 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-59
- id: m04-l02-q046
  prompt:
    es: "Según el artículo 59.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué debe alcanzarse progresivamente con la reserva de plazas para personas con discapacidad?"
  options:
  - id: a
    text:
      es: "El dos por ciento de las plazas ofertadas en cada convocatoria"
  - id: b
    text:
      es: "El diez por ciento de las plazas convocadas en cada oferta"
  - id: c
    correct: true
    text:
      es: "El dos por ciento de los efectivos totales en cada Administración Pública"
  - id: d
    text:
      es: "El siete por ciento de los efectivos totales en cada Administración Pública"
  explanation:
    es: "El artículo 59.1 hace la reserva «de modo que progresivamente se alcance el dos por ciento de los efectivos totales en cada Administración Pública». El dos por ciento de las plazas ofertadas es la parte de la reserva para discapacidad intelectual, otra cifra del mismo artículo. El siete por ciento es el cupo sobre las vacantes, no sobre los efectivos. El diez por ciento de las plazas convocadas es la reserva del artículo 108.4 del Real Decreto-ley 6/2023, no el objetivo del artículo 59.1."
  citation: "art. 59.1 TREBEP"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-59
- id: m04-l02-q047
  prompt:
    es: "Según el artículo 59.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, al menos el dos por ciento de las plazas ofertadas dentro de la reserva del siete por ciento es para quienes acrediten:"
  options:
  - id: a
    text:
      es: "Discapacidad igual o superior al 65 por ciento, y el resto para cualquier otro grado"
  - id: b
    correct: true
    text:
      es: "Discapacidad intelectual, y el resto para cualquier otro tipo de discapacidad"
  - id: c
    text:
      es: "Discapacidad física, y el resto para cualquier otro tipo de discapacidad"
  - id: d
    text:
      es: "Discapacidad sensorial, y el resto para cualquier otro tipo de discapacidad"
  explanation:
    es: "El artículo 59.1 dice que, al menos, el dos por ciento de las plazas ofertadas será «para ser cubiertas por personas que acrediten discapacidad intelectual» y el resto para cualquier otro tipo de discapacidad. El artículo no reserva ese dos por ciento a la discapacidad física, a la sensorial ni a un grado del 65 por ciento."
  citation: "art. 59.1 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2015-11719-art-59
- id: m04-l02-q048
  prompt:
    es: "¿Cuál de las siguientes condiciones exige el artículo 59.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público para cubrir las plazas del cupo de reserva por discapacidad?"
  options:
  - id: a
    text:
      es: "Superar los procesos selectivos y tener reconocida una discapacidad del 65 por ciento"
  - id: b
    text:
      es: "Acreditar la discapacidad, aunque no se superen todas las pruebas del proceso selectivo"
  - id: c
    correct: true
    text:
      es: "Superar los procesos selectivos y acreditar la discapacidad y la compatibilidad con las tareas"
  - id: d
    text:
      es: "Obtener una puntuación superior a la del último aspirante aprobado del turno general"
  explanation:
    es: "El artículo 59.1 reserva las plazas para personas con discapacidad «siempre que superen los procesos selectivos y acrediten su discapacidad y la compatibilidad con el desempeño de las tareas». Acreditar la discapacidad no basta si no se superan las pruebas. El artículo no exige un grado del 65 por ciento: remite a las personas definidas en el artículo 4.2 de la Ley General de derechos de las personas con discapacidad. Tampoco exige superar la puntuación del turno general."
  citation: "art. 59.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12632-art-4
- id: m04-l02-q049
  prompt:
    es: "Según el artículo 4.2 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, son personas con discapacidad, entre otras, aquellas con un grado de discapacidad reconocido:"
  options:
  - id: a
    text:
      es: "Igual o superior al 30 por ciento"
  - id: b
    text:
      es: "Igual o superior al 20 por ciento"
  - id: c
    text:
      es: "Igual o superior al 25 por ciento"
  - id: d
    correct: true
    text:
      es: "Igual o superior al 33 por ciento"
  explanation:
    es: "El artículo 4.2, en la redacción vigente desde el 23 de octubre de 2026, da la consideración de personas con discapacidad a aquellas a quienes se haya reconocido «un grado de discapacidad igual o superior al 33 por ciento». El 20, el 25 y el 30 por ciento no son ese umbral: con un grado del 25 o del 30 por ciento no se alcanza."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q050
  prompt:
    es: "Según el artículo 108.4 del Real Decreto-ley 6/2023, de 19 de diciembre, en la oferta de empleo público de la Administración del Estado se reservará para personas con discapacidad un porcentaje:"
  options:
  - id: a
    text:
      es: "No inferior al diez por ciento de los efectivos totales"
  - id: b
    text:
      es: "No superior al diez por ciento de las plazas convocadas"
  - id: c
    text:
      es: "No inferior al quince por ciento de las plazas convocadas"
  - id: d
    correct: true
    text:
      es: "No inferior al diez por ciento de las plazas convocadas"
  explanation:
    es: "El artículo 108.4 reserva «un porcentaje no inferior al diez por ciento de las plazas convocadas». El quince por ciento no está en el artículo. El diez por ciento es un mínimo, no un máximo. El porcentaje se calcula sobre las plazas convocadas; los efectivos totales son la base del objetivo progresivo del dos por ciento."
  citation: "art. 108.4 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q051
  prompt:
    es: "Según el Real Decreto-ley 6/2023, de 19 de diciembre, la reserva de plazas para personas con discapacidad en la oferta de empleo público de la Administración del Estado:"
  options:
  - id: a
    text:
      es: "Se concentra siempre en convocatorias independientes, una para cada tipo de discapacidad"
  - id: b
    text:
      es: "Se hace solo sobre las plazas de promoción interna incluidas en la oferta de empleo público"
  - id: c
    correct: true
    text:
      es: "Se hace sobre el total de plazas de la oferta y puede concentrarse en los cuerpos que mejor se adapten"
  - id: d
    text:
      es: "Se aplica por separado a cada convocatoria, sin posibilidad de concentrar las plazas reservadas"
  explanation:
    es: "El artículo 108.4 dice que «la reserva se hará sobre el número total de las plazas incluidas en la respectiva oferta de empleo público», y que las plazas reservadas pueden concentrarse en las convocatorias de cuerpos, escalas o categorías que mejor se adapten a sus capacidades y competencias. No se aplica por separado a cada convocatoria ni solo a la promoción interna. La concentración es posible, no obligatoria, y no se hace por tipo de discapacidad."
  citation: "art. 108.4 RDL 6/2023"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-da-decimonovena
- id: m04-l02-q052
  prompt:
    es: "Según la disposición adicional decimonovena de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, en las ofertas de empleo público se reservará un cupo:"
  options:
  - id: a
    text:
      es: "No inferior al cinco por ciento de las vacantes, para personas con un grado de minusvalía igual o superior al 65 por ciento"
  - id: b
    correct: true
    text:
      es: "No inferior al cinco por ciento de las vacantes, para personas con un grado de minusvalía igual o superior al 33 por ciento"
  - id: c
    text:
      es: "No inferior al cinco por ciento de las vacantes, para personas con discapacidad de cualquier grado"
  - id: d
    text:
      es: "No inferior al siete por ciento de las vacantes, para personas con un grado de minusvalía igual o superior al 33 por ciento"
  explanation:
    es: "La disposición adicional decimonovena reserva «un cupo no inferior al cinco por ciento de las vacantes para ser cubiertas entre personas con discapacidad cuyo grado de minusvalía sea igual o superior al 33 por ciento». El siete por ciento es el cupo del artículo 59.1 del Estatuto Básico, no el de esta disposición. El umbral es el 33 por ciento, no el 65, y la disposición sí exige un grado mínimo."
  citation: "disposición adicional decimonovena Ley 30/1984"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2004-21221-art-2
- id: m04-l02-q053
  prompt:
    es: "Según el artículo 2.1 del Real Decreto 2271/2004, de 3 de diciembre, ¿qué cupo mínimo de las vacantes de las ofertas de empleo público se reserva para personas con discapacidad?"
  options:
  - id: a
    text:
      es: "Un cupo no inferior al quince por ciento de las vacantes"
  - id: b
    text:
      es: "Un cupo no inferior al siete por ciento de las vacantes"
  - id: c
    text:
      es: "Un cupo no inferior al doce por ciento de las vacantes"
  - id: d
    correct: true
    text:
      es: "Un cupo no inferior al cinco por ciento de las vacantes"
  explanation:
    es: "El artículo 2.1 reserva «un cupo no inferior al cinco por ciento de las vacantes para ser cubiertas entre personas con discapacidad cuyo grado de minusvalía sea igual o superior al 33 por ciento». El siete por ciento es el cupo del artículo 59.1 del Estatuto Básico, una norma posterior, no el de este real decreto. El doce y el quince por ciento no están en el artículo."
  citation: "art. 2.1 RD 2271/2004"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-dd-unica
- id: m04-l02-q054
  prompt:
    es: "Según la letra f) de la disposición derogatoria única del texto refundido de la Ley del Estatuto Básico del Empleado Público, quedan derogadas:"
  options:
  - id: a
    text:
      es: "Todas las normas de rango inferior a la ley que regulen el empleo público, se opongan o no al Estatuto"
  - id: b
    text:
      es: "Todas las normas de igual o inferior rango anteriores al Estatuto, con independencia de su contenido"
  - id: c
    text:
      es: "Solo las normas de rango reglamentario que contradigan o se opongan a lo dispuesto en el Estatuto"
  - id: d
    correct: true
    text:
      es: "Todas las normas de igual o inferior rango que contradigan o se opongan a lo dispuesto en el Estatuto"
  explanation:
    es: "La letra f) deroga «todas las normas de igual o inferior rango que contradigan o se opongan a lo dispuesto en este Estatuto». No deroga las que no se oponen al Estatuto, ni todas las anteriores por el mero hecho de serlo. Tampoco se limita a los reglamentos: incluye las normas de igual rango."
  citation: "disposición derogatoria única TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2004-21221-art-2
- id: m04-l02-q055
  prompt:
    es: "De acuerdo con el artículo 2.2 del Real Decreto 2271/2004, de 3 de diciembre, las plazas reservadas para personas con discapacidad:"
  options:
  - id: a
    text:
      es: "Se incluyen siempre en las convocatorias de ingreso ordinario, sin turno independiente"
  - id: b
    correct: true
    text:
      es: "Pueden incluirse en las convocatorias de ingreso ordinario o convocarse en un turno independiente"
  - id: c
    text:
      es: "Se convocan siempre en un turno independiente de las convocatorias de ingreso ordinario"
  - id: d
    text:
      es: "Solo pueden convocarse por el sistema de concurso de valoración de méritos"
  explanation:
    es: "El artículo 2.2 dice que esas plazas «podrán incluirse dentro de las convocatorias de plazas de ingreso ordinario o convocarse en un turno independiente». Las dos opciones con «siempre» eliminan una de las dos vías que el artículo permite. El artículo no impone el concurso de valoración de méritos."
  citation: "art. 2.2 RD 2271/2004"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-25758-art-113
- id: m04-l02-q056
  prompt:
    es: "¿Cómo se accede, en la Administración del Estado, a las plazas reservadas a personas con discapacidad intelectual?"
  options:
  - id: a
    text:
      es: "Mediante las mismas pruebas del turno general, con adaptaciones de tiempo"
  - id: b
    text:
      es: "Mediante concurso de valoración de méritos, sin fase de oposición"
  - id: c
    text:
      es: "Mediante nombramiento directo, previo informe del órgano competente en discapacidad"
  - id: d
    correct: true
    text:
      es: "Mediante la convocatoria de pruebas selectivas específicas e independientes"
  explanation:
    es: "El artículo 113.3 del Real Decreto-ley 6/2023 dice que el acceso a esas plazas «se llevará a cabo mediante la convocatoria de pruebas selectivas específicas e independientes». No se hace con las pruebas del turno general. El concurso solo cabe para personal funcionario cuando lo establece una ley (artículo 114.6), y el nombramiento directo no es un sistema selectivo."
  citation: "art. 113.3 RDL 6/2023"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-25758-art-113
- id: m04-l02-q057
  prompt:
    es: "De acuerdo con el artículo 113.3 del Real Decreto-ley 6/2023, de 19 de diciembre, el acceso por pruebas específicas a las plazas reservadas a personas con discapacidad intelectual exige tener reconocido un grado de discapacidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Igual o superior al treinta y tres por cien"
  - id: b
    text:
      es: "Igual o superior al cincuenta por cien"
  - id: c
    text:
      es: "Igual o superior al sesenta y cinco por cien"
  - id: d
    text:
      es: "Igual o superior al cuarenta y cinco por cien"
  explanation:
    es: "El artículo 113.3 se aplica a las personas con discapacidad intelectual «siempre que éstas tengan reconocido un grado de discapacidad igual o superior al treinta y tres por cien». El cuarenta y cinco, el cincuenta y el sesenta y cinco por cien endurecen ese umbral, que el artículo fija en el treinta y tres."
  citation: "art. 113.3 RDL 6/2023"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2004-21221-art-3
- id: m04-l02-q058
  prompt:
    es: "¿Qué ocurre con el aspirante del cupo de reserva por discapacidad que supera los ejercicios sin obtener plaza, con puntuación superior a la de otros aspirantes del sistema general?"
  options:
  - id: a
    text:
      es: "Obtiene plaza en todo caso, aunque se supere el número de plazas convocadas"
  - id: b
    text:
      es: "Queda en una bolsa de reserva para la siguiente convocatoria del mismo turno"
  - id: c
    text:
      es: "Conserva los ejercicios aprobados para la convocatoria siguiente del cupo"
  - id: d
    correct: true
    text:
      es: "Se incluye por su orden de puntuación en el sistema de acceso general"
  explanation:
    es: "El artículo 3.2 del Real Decreto 2271/2004 dice que ese aspirante «será incluido por su orden de puntuación en el sistema de acceso general». El artículo no crea una bolsa de reserva ni conserva los ejercicios para otra convocatoria. Tampoco le da plaza por encima de las convocadas: entra en el sistema general según su puntuación."
  citation: "art. 3.2 RD 2271/2004"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2023-25758-art-113
- id: m04-l02-q059
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe cómo participan las personas con discapacidad en los procesos selectivos de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "En igualdad de condiciones que el resto, acreditando el grado de discapacidad y la compatibilidad con las tareas"
  - id: b
    text:
      es: "En igualdad de condiciones que el resto, sin necesidad de acreditar el grado de discapacidad"
  - id: c
    text:
      es: "Con pruebas de menor contenido que el resto, acreditando solo el grado de discapacidad"
  - id: d
    text:
      es: "Con una puntuación adicional por su grado de discapacidad, sin acreditar la compatibilidad con las tareas"
  explanation:
    es: "El artículo 113.2 del Real Decreto-ley 6/2023 dice que «podrán participar en los procesos selectivos en igualdad de condiciones que el resto de las personas aspirantes, debiendo acreditar el grado de discapacidad, así como la compatibilidad» con las funciones y tareas. No reciben una puntuación adicional ni hacen pruebas de menor contenido. Y sí deben acreditar el grado de discapacidad."
  citation: "art. 113.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-59
- id: m04-l02-q060
  prompt:
    es: "De acuerdo con el artículo 59.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, para el proceso selectivo cada Administración Pública adoptará las medidas precisas para establecer:"
  options:
  - id: a
    correct: true
    text:
      es: "Las adaptaciones y ajustes razonables de tiempos y medios"
  - id: b
    text:
      es: "Un temario propio y reducido para las personas con discapacidad"
  - id: c
    text:
      es: "Una puntuación adicional para las personas con discapacidad"
  - id: d
    text:
      es: "Una reducción del número de ejercicios para las personas con discapacidad"
  explanation:
    es: "El artículo 59.2 obliga a cada Administración a establecer «las adaptaciones y ajustes razonables de tiempos y medios en el proceso selectivo». No prevé menos ejercicios, una puntuación adicional ni un temario propio. Las pruebas son las mismas; lo que se adapta es el tiempo y los medios para hacerlas."
  citation: "art. 59.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2004-21221-art-8
- id: m04-l02-q061
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las adaptaciones que solicita un aspirante con discapacidad para las pruebas selectivas de la Administración General del Estado es correcta?"
  options:
  - id: a
    text:
      es: "Solo se otorgan si el grado de discapacidad es igual o superior al 65 por ciento"
  - id: b
    correct: true
    text:
      es: "Solo se otorgan cuando la discapacidad guarde relación directa con la prueba"
  - id: c
    text:
      es: "Se otorgan en todo caso si se piden antes del primer ejercicio"
  - id: d
    text:
      es: "Se otorgan de forma automática a quien acredite la discapacidad"
  explanation:
    es: "El artículo 8.5 del Real Decreto 2271/2004 dice que «la adaptación no se otorgará de forma automática, sino únicamente en aquellos casos en que la discapacidad guarde relación directa con la prueba a realizar». Por eso no basta con acreditar la discapacidad ni con pedirla antes del primer ejercicio. El artículo 8.1 ofrece las adaptaciones desde un grado del 33 por ciento, no del 65."
  citation: "art. 8.5 RD 2271/2004"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2004-21221-art-9
- id: m04-l02-q062
  prompt:
    es: "Superado el proceso, ¿qué puede pedir al órgano convocante quien ingresa en la Administración General del Estado por una convocatoria ordinaria con plazas reservadas para personas con discapacidad?"
  options:
  - id: a
    text:
      es: "La exención del periodo de prácticas o del curso selectivo de la convocatoria"
  - id: b
    correct: true
    text:
      es: "La alteración del orden de prelación para elegir plaza dentro del ámbito territorial de la convocatoria"
  - id: c
    text:
      es: "Un aumento de su puntuación final para mejorar su puesto en el orden de prelación"
  - id: d
    text:
      es: "Un destino fuera del ámbito territorial que haya determinado la convocatoria"
  explanation:
    es: "El artículo 9 del Real Decreto 2271/2004 permite solicitar al órgano convocante «la alteración del orden de prelación para la elección de las plazas dentro del ámbito territorial que se determine en la convocatoria», por motivos de dependencia personal, dificultades de desplazamiento u otros análogos. Un destino fuera de ese ámbito contradice «dentro del ámbito territorial». Eximir del periodo de prácticas o del curso selectivo no es lo que el artículo permite pedir: se pide cambiar el orden para elegir plaza. Aumentar la puntuación tampoco: el artículo pide limitar la alteración a «la mínima modificación en el orden de prelación necesaria»."
  citation: "art. 9 RD 2271/2004"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2004-21221-art-10
- id: m04-l02-q063
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 2271/2004, de 3 de diciembre, a la solicitud de adaptación del puesto de trabajo de un empleado público con discapacidad debe acompañarse:"
  options:
  - id: a
    text:
      es: "Una declaración responsable del propio empleado sobre la adaptación que precisa en el puesto"
  - id: b
    text:
      es: "La conformidad previa de la junta de personal del centro de trabajo en el que está el puesto"
  - id: c
    correct: true
    text:
      es: "Un informe del órgano competente que acredite la procedencia de la adaptación y la compatibilidad con las funciones"
  - id: d
    text:
      es: "Un presupuesto de la adaptación aprobado previamente por el ministerio de adscripción del puesto"
  explanation:
    es: "El artículo 10.1 exige acompañar «un informe expedido por el órgano competente en la materia, que acredite la procedencia de la adaptación y la compatibilidad con el desempeño de las funciones». No pide un presupuesto aprobado ni la conformidad de la junta de personal. Una declaración del propio empleado no sustituye al informe del órgano competente."
  citation: "art. 10.1 RD 2271/2004"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2004-21221-art-10
- id: m04-l02-q064
  prompt:
    es: "En la Administración General del Estado, ¿a quién corresponde la valoración, realización y financiación de las adaptaciones del puesto de trabajo de un empleado con discapacidad?"
  options:
  - id: a
    text:
      es: "Al departamento con competencias en función pública, para toda la Administración"
  - id: b
    text:
      es: "A la comunidad autónoma en la que esté el centro de trabajo"
  - id: c
    correct: true
    text:
      es: "Al ministerio u organismo al que esté adscrito el puesto de trabajo"
  - id: d
    text:
      es: "Al propio empleado, con cargo a las subvenciones que pueda obtener"
  explanation:
    es: "El artículo 10.2 del Real Decreto 2271/2004 dice que «el ministerio u organismo al que esté adscrito el puesto de trabajo será el encargado de la valoración, la realización y la financiación de las adaptaciones». No lo centraliza el departamento con competencias en función pública. Las subvenciones pueden ayudar, pero el coste no recae en el empleado. La comunidad autónoma no tiene ese encargo."
  citation: "art. 10.2 RD 2271/2004"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
