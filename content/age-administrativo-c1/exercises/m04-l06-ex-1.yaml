# anchor: boe-a-1985-7820-art-5
- id: m04-l06-q024
  prompt:
    es: "En la Administración del Estado, ¿desde cuándo se cuenta el plazo para resolver una solicitud de autorización de compatibilidad para un segundo puesto en el sector público?"
  options:
  - id: a
    text:
      es: "Desde la fecha del informe favorable sobre el segundo puesto."
  - id: b
    text:
      es: "Desde la fecha de la propuesta de la Subsecretaría."
  - id: c
    text:
      es: "Desde la fecha de toma de posesión en el segundo puesto."
  - id: d
    correct: true
    text:
      es: "Desde la fecha de presentación de la solicitud."
  explanation:
    es: "El artículo 5 del Real Decreto 598/1985 fija el plazo de tres meses «a contar desde la fecha de presentación de la solicitud». El informe sobre el segundo puesto y la propuesta de la Subsecretaría son trámites dentro de ese plazo, no su inicio. La toma de posesión en el segundo puesto no puede marcar el inicio: la autorización debe ser previa."
  citation: "art. 5 RD 598/1985"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1985-7820-art-5
- id: m04-l06-q025
  prompt:
    es: "Un funcionario de un ministerio presenta el martes, 10 de marzo de 2026, su solicitud de autorización de compatibilidad para un segundo puesto en el sector público. Sin prórroga, ¿hasta qué fecha tiene la Administración para resolverla?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 10 de abril de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles, 10 de junio de 2026."
  - id: c
    text:
      es: "Hasta el lunes, 11 de mayo de 2026."
  - id: d
    text:
      es: "Hasta el viernes, 10 de julio de 2026."
  explanation:
    es: "El artículo 5 del Real Decreto 598/1985 da tres meses «a contar desde la fecha de presentación de la solicitud». Los meses se cuentan de fecha a fecha (artículo 30.4 de la Ley 39/2015): del martes 10 de marzo de 2026 al miércoles 10 de junio de 2026, que es hábil. El viernes 10 de abril sería un mes, la duración máxima de la prórroga. El lunes 11 de mayo resulta de dos meses (el 10 de mayo es domingo), el plazo del artículo 14 de la Ley 53/1984 para actividades privadas. El viernes 10 de julio supone cuatro meses, que solo se alcanzan con la prórroga máxima."
  citation: "art. 5 RD 598/1985"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "fecha"
# anchor: boe-a-1985-7820-art-5
- id: m04-l06-q026
  prompt:
    es: "Una funcionaria del Estado presenta el martes, 15 de septiembre de 2026, su solicitud de autorización de compatibilidad para un segundo puesto en el sector público. Si el plazo para resolver se prorroga por el máximo permitido, ¿hasta qué fecha puede resolverse?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el viernes, 15 de enero de 2027."
  - id: b
    text:
      es: "Hasta el martes, 15 de diciembre de 2026."
  - id: c
    text:
      es: "Hasta el lunes, 15 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 15 de marzo de 2027."
  explanation:
    es: "El artículo 5 del Real Decreto 598/1985 da tres meses desde la presentación, prorrogables «por un periodo de tiempo no superior a un mes». Contando de fecha a fecha (artículo 30.4 de la Ley 39/2015), los tres meses vencen el martes 15 de diciembre de 2026 y el mes de prórroga lleva el final al viernes 15 de enero de 2027, que es hábil. El martes 15 de diciembre es el plazo sin prórroga. El lunes 15 de febrero supondría dos meses de prórroga y el lunes 15 de marzo, tres."
  citation: "art. 5 RD 598/1985"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "fecha"
