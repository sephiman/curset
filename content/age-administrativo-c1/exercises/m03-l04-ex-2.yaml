- id: m03-l04-q060
  prompt:
    es: "Según el artículo 118.5 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el informe del apartado 2 no se exige en los contratos menores pagados por anticipo de caja fija cuyo valor estimado:"
  options:
  - id: a
    text:
      es: "No exceda de 3.000 euros."
  - id: b
    text:
      es: "No exceda de 10.000 euros."
  - id: c
    correct: true
    text:
      es: "No exceda de 5.000 euros."
  - id: d
    text:
      es: "No exceda de 15.000 euros."
  explanation:
    es: "El artículo 118.5 LCSP excluye el informe en los contratos pagados por anticipo de caja fija u otro sistema similar «siempre y cuando el valor estimado del contrato no exceda de 5.000 euros». Los 3.000 y los 10.000 euros no figuran en el precepto. Los 15.000 euros son el límite del contrato menor de suministro y servicios, no el de esta excepción."
