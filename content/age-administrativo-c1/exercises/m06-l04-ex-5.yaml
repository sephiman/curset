  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas lleva a las opciones Expandido y Condensado del espaciado entre caracteres?"
  options:
  - id: a
    correct: true
    text:
      es: "Inicio › iniciador del cuadro Fuente › Avanzadas › Espaciado"
  - id: b
    text:
      es: "Inicio › iniciador del cuadro Fuente › Fuente › Espaciado"
  - id: c
    text:
      es: "Inicio › iniciador del cuadro Párrafo › Avanzadas › Espaciado"
  - id: d
    text:
      es: "Insertar › iniciador del cuadro Fuente › Avanzadas › Espaciado"
  explanation:
    es: "La página dice: «En la pestaña Inicio, seleccione el iniciador del cuadro de diálogo Fuente […] y, a continuación, seleccione la pestaña Avanzadas». Después, en el cuadro Espaciado, se elige Expandido o Condensado. La página lleva a la pestaña Avanzadas del cuadro Fuente. La página parte del iniciador del cuadro Fuente, no del de Párrafo. La página parte de la pestaña Inicio, no de Insertar."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Expandir o comprimir uniformemente el espacio entre todos los caracteres seleccionados»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q202
  prompt:
    es: "En el cuadro Espaciado de Word 365, ¿cuál de las siguientes opciones aumenta por igual el espacio entre todas las letras seleccionadas?"
  options:
  - id: a
    text:
      es: "Condensado"
  - id: b
    text:
      es: "Interletraje"
  - id: c
    correct: true
    text:
      es: "Expandido"
  - id: d
    text:
      es: "Escala"
  explanation:
    es: "La página dice: «En el cuadro Espaciado, seleccione Expandido o Condensado y, después, especifique cuánto espacio desea en el cuadro Por». Condensado es la otra opción de Espaciado, para reducir ese espacio. Interletraje ajusta el espaciado entre pares de letras concretos. Escala modifica la forma de los caracteres según un porcentaje."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Expandir o comprimir uniformemente el espacio entre todos los caracteres seleccionados»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q205
  prompt:
    es: "En el cuadro Espaciado de Word 365, ¿cuál de los siguientes cuadros se usa para especificar cuánto espacio se desea tras elegir Expandido o Condensado?"
  options:
  - id: a
    correct: true
    text:
      es: "Por"
  - id: b
    text:
      es: "Puntos y superiores"
  - id: c
    text:
      es: "Escala"
  - id: d
    text:
      es: "Posición"
  explanation:
    es: "La página dice: «especifique cuánto espacio desea en el cuadro Por». Puntos y superiores es el cuadro del tamaño en puntos del Interletraje. En Escala se escribe un porcentaje. La página usa el cuadro Por."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Expandir o comprimir uniformemente el espacio entre todos los caracteres seleccionados»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q206
  prompt:
    es: "En el cuadro de diálogo Fuente de Word 365, ¿qué se escribe en el cuadro Puntos y superiores al activar Interletraje?"
  options:
  - id: a
    text:
      es: "La cantidad de espacio que se añade entre todas las letras"
  - id: b
    text:
      es: "El porcentaje al que se estira o comprime el texto"
  - id: c
    text:
      es: "La altura de línea que se aplica al estilo del párrafo"
  - id: d
    correct: true
    text:
      es: "El tamaño en puntos desde el que se aplica el Interletraje"
  explanation:
    es: "La página dice: «Seleccione la casilla Interletraje para fuentes y, a continuación, escriba el tamaño en puntos en el cuadro Puntos y superiores». Esa cantidad se escribe en el cuadro Por. Ese porcentaje se escribe en el cuadro Escala. El interlineado se elige con los botones del cuadro Modificar estilo."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Interletrar los caracteres que superan un tamaño determinado»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q207
  prompt:
    es: "En Word 365, ¿qué efecto tiene en el cuadro Escala un porcentaje superior a 100 en el texto?"
  options:
  - id: a
    text:
      es: "Comprime el texto"
  - id: b
    correct: true
    text:
      es: "Estira el texto"
  - id: c
    text:
      es: "Aplica Condensado a las letras"
  - id: d
    text:
      es: "Activa el Interletraje para fuentes"
  explanation:
    es: "La página dice: «Los porcentajes superiores a 100 estiran el texto. Los porcentajes inferiores a 100 comprimen el texto». Comprimir es el efecto de los porcentajes inferiores a 100, no de los superiores. Condensado es una opción distinta, del cuadro Espaciado: modifica el espaciado entre las letras y no la forma de los caracteres, que es lo que escala el cuadro Escala. Interletraje para fuentes es otra casilla de la pestaña Avanzadas, la que ajusta el espaciado entre pares de letras concretos."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Estirar o escalar texto horizontalmente»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q209
  prompt:
    es: "Según la página de Microsoft, ¿cuál es el mejor método en Word 365 para cambiar el espacio vertical entre las líneas de un párrafo?"
  options:
  - id: a
    correct: true
    text:
      es: "Modificar el estilo que usa el párrafo"
  - id: b
    text:
      es: "Aplicar Condensado a todo el párrafo"
  - id: c
    text:
      es: "Aumentar el porcentaje de Escala del párrafo"
  - id: d
    text:
      es: "Activar Interletraje para el párrafo"
  explanation:
    es: "La página dice: «el mejor método es modificar el estilo que usa el párrafo». Condensado cambia el espaciado entre letras, no el vertical entre líneas. La Escala cambia la forma de los caracteres, no el espacio entre líneas. Interletraje ajusta el espaciado entre pares de letras concretos."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Cambiar el interlineado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q210
  prompt:
    es: "En Word 365, ¿qué indica el anclaje de una imagen con un ajuste de texto distinto de En línea con el texto?"
  options:
  - id: a
    text:
      es: "La página en la que se imprimirá la imagen"
  - id: b
    correct: true
    text:
      es: "El párrafo al que está asociada la imagen"
  - id: c
    text:
      es: "El tamaño original de la imagen insertada"
  - id: d
    text:
      es: "El estilo de ajuste que se aplicó a la imagen"
  explanation:
    es: "La página dice que, con los ajustes distintos de En línea con el texto, «se anclan a una ubicación específica del documento; el anclaje indica el párrafo al que está asociado el objeto». La página en la que se imprime no es esa ubicación: el anclaje se asocia a un párrafo. El tamaño original de la imagen no tiene que ver con el anclaje, que habla de la posición en el texto. Y el estilo de ajuste es lo que decide si hay anclaje (En línea con el texto no lo tiene), no lo que el anclaje indica."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 2
  tags:
  - "concepto"
