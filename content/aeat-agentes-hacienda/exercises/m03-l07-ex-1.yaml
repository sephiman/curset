# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0001
  prompt:
    es: "¿Cuál de las siguientes actividades es una de las funciones administrativas en que consiste la gestión tributaria, según el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La elaboración y mantenimiento de los censos tributarios."
  - id: b
    text:
      es: "El cobro de las deudas tributarias en periodo ejecutivo mediante el procedimiento administrativo de apremio."
  - id: c
    text:
      es: "La investigación de los supuestos de hecho de las obligaciones tributarias que sean ignorados por la Administración."
  - id: d
    text:
      es: "El asesoramiento e informe a órganos de la Administración pública sobre cuestiones de aplicación de los tributos."
  explanation:
    es: "El artículo 117.1.l) incluye entre las funciones de la gestión tributaria la elaboración y mantenimiento de los censos tributarios. La investigación de hechos ignorados por la Administración es una función de la inspección (art. 141.a). El cobro de las deudas, con el apremio en periodo ejecutivo, es la recaudación (art. 160). El asesoramiento e informe a órganos de la Administración pública también está entre las funciones de la inspección (art. 141.i)."
  citation: "art. 117.1 LGT"
  difficulty: 1
  tags:
  - "funciones"
  - "censos"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0003
  prompt:
    es: "De acuerdo con el artículo 117.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones y el ejercicio de las funciones de la gestión tributaria se realizarán de acuerdo con lo establecido en esa ley y en:"
  options:
  - id: a
    text:
      es: "las circulares internas de cada órgano de gestión competente."
  - id: b
    text:
      es: "las instrucciones que dicte cada año el Ministerio de Hacienda."
  - id: c
    correct: true
    text:
      es: "su normativa de desarrollo."
  - id: d
    text:
      es: "los criterios interpretativos que fije la Dirección General de Tributos."
  explanation:
    es: "El artículo 117.2 remite a la propia ley y a su normativa de desarrollo. Las instrucciones anuales, los criterios de la Dirección General de Tributos y las circulares internas no son la normativa de desarrollo que el precepto menciona."
  citation: "art. 117.2 LGT"
  difficulty: 1
  tags:
  - "funciones"
# anchor: boe-a-2003-23186-art-118
- id: m03-l07-q0004
  prompt:
    es: "Conforme al artículo 118 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la gestión tributaria se iniciará por una autoliquidación, comunicación de datos o cualquier otra declaración, por una solicitud del obligado tributario y también:"
  options:
  - id: a
    text:
      es: "por requerimiento del órgano de inspección competente."
  - id: b
    text:
      es: "por denuncia presentada por otro obligado tributario."
  - id: c
    text:
      es: "a instancia de un tercero con interés legítimo en el asunto."
  - id: d
    correct: true
    text:
      es: "de oficio por la Administración tributaria."
  explanation:
    es: "El artículo 118 da tres formas de iniciación: la declaración (autoliquidación o comunicación de datos incluidas), la solicitud del obligado y la actuación de oficio de la Administración. El requerimiento de la inspección, la instancia de un tercero y la denuncia de otro obligado no figuran entre ellas."
  citation: "art. 118 LGT"
  difficulty: 1
  tags:
  - "iniciación"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0070
  prompt:
    es: "¿Cuál de las siguientes actuaciones NO es una de las funciones administrativas en que consiste la gestión tributaria, según el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La información y asistencia tributaria."
  - id: b
    text:
      es: "La realización de actuaciones de comprobación de valores."
  - id: c
    text:
      es: "La emisión de certificados tributarios."
  - id: d
    correct: true
    text:
      es: "La práctica del embargo de bienes del deudor en el procedimiento de apremio."
  explanation:
    es: "El embargo en el apremio es recaudación en periodo ejecutivo (art. 160 y siguientes), no una función de la gestión. Los certificados tributarios (letra j), la información y asistencia (letra m) y la comprobación de valores (letra g) sí figuran en el artículo 117.1."
  citation: "art. 117.1 LGT"
  difficulty: 1
  tags:
  - "funciones"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0071
  prompt:
    es: "De acuerdo con el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las funciones de la gestión tributaria relativas a las declaraciones y a los documentos con trascendencia tributaria:"
  options:
  - id: a
    text:
      es: "Incluyen la recepción de declaraciones, pero no la tramitación de las autoliquidaciones, que corresponde a la inspección."
  - id: b
    correct: true
    text:
      es: "Incluyen la recepción y tramitación de declaraciones, autoliquidaciones, comunicaciones de datos y demás documentos con trascendencia tributaria."
  - id: c
    text:
      es: "Excluyen las comunicaciones de datos, que se tramitan siempre en el procedimiento de devolución."
  - id: d
    text:
      es: "Se limitan a las declaraciones presentadas en plazo, sin alcanzar a las extemporáneas."
  explanation:
    es: "La letra a) abarca la recepción y tramitación de declaraciones, autoliquidaciones, comunicaciones de datos y demás documentos con trascendencia tributaria. No separa autoliquidaciones para la inspección, no excluye las comunicaciones de datos ni distingue entre declaraciones en plazo y fuera de plazo."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0072
  prompt:
    es: "Según el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la gestión tributaria incluye el reconocimiento y comprobación de la procedencia de los beneficios e incentivos fiscales y de los regímenes tributarios especiales, que se realiza mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "la tramitación del correspondiente procedimiento de gestión tributaria."
  - id: b
    text:
      es: "un procedimiento de inspección con alcance parcial sobre el beneficio aplicado."
  - id: c
    text:
      es: "una resolución del órgano de recaudación en periodo ejecutivo."
  - id: d
    text:
      es: "una consulta tributaria escrita dirigida a la Dirección General de Tributos."
  explanation:
    es: "La letra c) del artículo 117.1 precisa que el reconocimiento y comprobación de beneficios, incentivos y regímenes especiales se hace mediante el correspondiente procedimiento de gestión tributaria. No se trata de una inspección parcial, de una resolución de recaudación ni de una consulta."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
  - "beneficios fiscales"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0073
  prompt:
    es: "Según el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué liquidaciones tributarias entran en la función de práctica de liquidaciones de la gestión tributaria?"
  options:
  - id: a
    text:
      es: "Las derivadas de las actas de inspección extendidas por los órganos de inspección."
  - id: b
    text:
      es: "Las resultantes de la inscripción de los obligados en los censos tributarios."
  - id: c
    text:
      es: "Las derivadas de los procedimientos de apremio seguidos en periodo ejecutivo."
  - id: d
    correct: true
    text:
      es: "Las derivadas de las actuaciones de verificación y comprobación realizadas."
  explanation:
    es: "La letra i) atribuye a la gestión las liquidaciones derivadas de las actuaciones de verificación y comprobación realizadas. Las de las actas de la inspección proceden de la función inspectora, las del apremio de la recaudación, y la inscripción censal no genera liquidación."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
  - "liquidaciones"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0074
  prompt:
    es: "De acuerdo con el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la realización de actuaciones de control del cumplimiento de la obligación de presentar declaraciones tributarias y de otras obligaciones formales es una función de:"
  options:
  - id: a
    correct: true
    text:
      es: "la gestión tributaria, junto con la realización de actuaciones de verificación de datos."
  - id: b
    text:
      es: "los servicios de información y asistencia, sin facultades de comprobación."
  - id: c
    text:
      es: "la inspección tributaria, con exclusión de las actuaciones de verificación de datos y de comprobación limitada."
  - id: d
    text:
      es: "la recaudación tributaria, cuando existan deudas pendientes de pago."
  explanation:
    es: "La letra e) incluye en la gestión el control de la obligación de presentar declaraciones y de otras obligaciones formales, y la letra f) las actuaciones de verificación de datos. No es una función exclusiva de la inspección, no depende de que haya deudas pendientes y no se confía a servicios sin facultades de comprobación."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
  - "control"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0075
  prompt:
    es: "Conforme al artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las funciones de la gestión tributaria:"
  options:
  - id: a
    text:
      es: "Comprenden las actuaciones de verificación de datos y de comprobación limitada, pero no las de comprobación de valores."
  - id: b
    correct: true
    text:
      es: "Comprenden las actuaciones de verificación de datos, de comprobación de valores y de comprobación limitada."
  - id: c
    text:
      es: "Comprenden las actuaciones de comprobación limitada, pero no las de verificación de datos ni de comprobación de valores."
  - id: d
    text:
      es: "Comprenden las actuaciones de verificación de datos y de comprobación de valores, pero no las de comprobación limitada."
  explanation:
    es: "Las letras f), g) y h) del artículo 117.1 recogen juntas las actuaciones de verificación de datos, de comprobación de valores y de comprobación limitada. Las demás opciones excluyen una o dos de ellas sin apoyo en el artículo."
  citation: "art. 117.1 LGT"
  difficulty: 3
  tags:
  - "funciones"
  - "procedimientos"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0076
  prompt:
    es: "De acuerdo con el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la expedición y revocación del número de identificación fiscal:"
  options:
  - id: a
    text:
      es: "Es una función de la gestión tributaria, que solo alcanza a su expedición por el órgano competente y no a su revocación."
  - id: b
    text:
      es: "Es una función de la inspección tributaria, que la ejerce según su propia normativa."
  - id: c
    correct: true
    text:
      es: "Es una función de la gestión tributaria, en los términos establecidos en la normativa específica."
  - id: d
    text:
      es: "Es una función de la recaudación tributaria, en los términos que fije la ley de cada tributo."
  explanation:
    es: "La letra k) incluye en la gestión tributaria la expedición y, en su caso, revocación del número de identificación fiscal, en los términos de la normativa específica. No es función de la inspección ni de la recaudación, y no se limita a la expedición."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
  - "NIF"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0077
  prompt:
    es: "Conforme al artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la gestión tributaria comprende la realización de las demás actuaciones de aplicación de los tributos no integradas en las funciones de:"
  options:
  - id: a
    text:
      es: "inspección y aduanas e impuestos especiales."
  - id: b
    correct: true
    text:
      es: "inspección y recaudación."
  - id: c
    text:
      es: "inspección y revisión en vía administrativa."
  - id: d
    text:
      es: "recaudación y revisión en vía administrativa."
  explanation:
    es: "La letra n) es la cláusula residual de la gestión tributaria: lo que no se integra en la inspección ni en la recaudación. Ni la revisión en vía administrativa ni las aduanas aparecen en esa delimitación."
  citation: "art. 117.1 LGT"
  difficulty: 2
  tags:
  - "funciones"
# anchor: boe-a-2003-23186-art-117
- id: m03-l07-q0078
  prompt:
    es: "Según el artículo 117.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las funciones administrativas de la gestión tributaria figura la comprobación y realización de las devoluciones previstas en la normativa tributaria, así como:"
  options:
  - id: a
    text:
      es: "la práctica de liquidaciones derivadas de las actas de inspección extendidas por los órganos competentes."
  - id: b
    text:
      es: "la resolución de recursos de reposición contra los actos de gestión."
  - id: c
    text:
      es: "la declaración de fallidos y la derivación de la acción de cobro."
  - id: d
    correct: true
    text:
      es: "la emisión de certificados tributarios y la información y asistencia tributaria."
  explanation:
    es: "La emisión de certificados (letra j) y la información y asistencia (letra m) son funciones de la gestión tributaria. Las liquidaciones de las actas son de la inspección, los fallidos y la derivación son de la recaudación, y la resolución de recursos pertenece a la revisión."
  citation: "art. 117.1 LGT"
  difficulty: 3
  tags:
  - "funciones"
# anchor: boe-a-2003-23186-art-118
- id: m03-l07-q0080
  prompt:
    es: "¿Qué documentos permiten iniciar la gestión tributaria, además de la solicitud del obligado y de la actuación de oficio, según el artículo 118 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Una autoliquidación, una comunicación de datos o cualquier otra clase de declaración."
  - id: b
    text:
      es: "Una declaración, una denuncia pública o un requerimiento de información a terceros del obligado."
  - id: c
    text:
      es: "Un acta de inspección, una autoliquidación o una comunicación de datos."
  - id: d
    text:
      es: "Una autoliquidación o una comunicación de datos, pero no otras declaraciones."
  explanation:
    es: "El artículo 118.a) admite la autoliquidación, la comunicación de datos o cualquier otra clase de declaración. No excluye las demás declaraciones, no incluye denuncias ni requerimientos a terceros, y el acta de inspección no inicia la gestión."
  citation: "art. 118 LGT"
  difficulty: 2
  tags:
  - "iniciación"
