# anchor: boe-a-2003-23186-art-99
- id: m03-l08-q0139
  prompt:
    es: "Según el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué documentos pueden incorporarse al contenido de las diligencias que se extiendan en un procedimiento de aplicación de los tributos?"
  options:
  - id: a
    text:
      es: "Los informes preceptivos de los órganos de la Administración tributaria que se emitan de oficio."
  - id: b
    text:
      es: "Las actas con acuerdo suscritas por el obligado tributario."
  - id: c
    text:
      es: "Las propuestas de liquidación del órgano de inspección actuante."
  - id: d
    correct: true
    text:
      es: "Las comunicaciones que notifican el inicio u otros hechos del procedimiento."
  explanation:
    es: "El artículo 99.7 permite que las comunicaciones se incorporen al contenido de las diligencias. Las propuestas de liquidación no pueden contenerlas las diligencias, y los informes y las actas son documentos distintos con su propio contenido."
  citation: "art. 99.7 LGT"
  difficulty: 2
  tags:
  - "diligencias"
  - "comunicaciones"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0140
  prompt:
    es: "De acuerdo con el artículo 87.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué puede contener la comunicación de inicio de un procedimiento cuando la Administración cuente con la información necesaria para ello?"
  options:
  - id: a
    text:
      es: "La liquidación definitiva, con efectos inmediatos para el obligado."
  - id: b
    text:
      es: "El acta con la conformidad anticipada del obligado tributario."
  - id: c
    correct: true
    text:
      es: "La propuesta de resolución o de liquidación."
  - id: d
    text:
      es: "La resolución sancionadora por las infracciones que se aprecien."
  explanation:
    es: "La letra e) del artículo 87.3 incluye, en su caso, la propuesta de resolución o de liquidación cuando la Administración cuente con la información necesaria. Es una propuesta, no una liquidación definitiva, y no se adelanta ni un acta ni una sanción."
  citation: "art. 87.3 RGAT"
  difficulty: 1
  tags:
  - "comunicación de inicio"
  - "propuesta"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0321
  prompt:
    es: "¿Qué debe indicar la comunicación de inicio sobre el plazo legal de prescripción, según el artículo 87.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos?"
  options:
  - id: a
    text:
      es: "Su fecha de vencimiento, calculada por la inspección en el momento de notificar el inicio."
  - id: b
    correct: true
    text:
      es: "Su efecto interruptivo, cuando proceda incluirlo en la comunicación de inicio."
  - id: c
    text:
      es: "Su suspensión mientras dure el procedimiento, hasta que se notifique la liquidación."
  - id: d
    text:
      es: "El importe de la deuda que prescribiría si las actuaciones no lo interrumpieran."
  explanation:
    es: "La comunicación de inicio contiene, cuando proceda, el efecto interruptivo del plazo legal de prescripción (art. 87.3.d). La norma no obliga a calcular una fecha de vencimiento ni a cuantificar la deuda que prescribiría. El efecto que se indica es la interrupción, no una suspensión del plazo mientras dure el procedimiento."
  citation: "art. 87.3 RGAT"
  difficulty: 1
  tags:
  - "comunicación de inicio"
  - "prescripción"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0322
  prompt:
    es: "¿Cuándo incluye la comunicación de inicio la indicación de la finalización de otro procedimiento, según el artículo 87.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos?"
  options:
  - id: a
    text:
      es: "Siempre que el obligado haya presentado alegaciones en el procedimiento anterior."
  - id: b
    text:
      es: "Cuando el otro procedimiento lleve más de seis meses pendiente sin resolverse, para evitar su caducidad."
  - id: c
    text:
      es: "Cuando el obligado lo solicite expresamente al órgano que notifica el inicio del procedimiento."
  - id: d
    correct: true
    text:
      es: "Cuando esa finalización se derive de la comunicación de inicio del procedimiento que se notifica."
  explanation:
    es: "La comunicación de inicio incluye, en su caso, la indicación de la finalización de otro procedimiento cuando esa finalización se derive de la comunicación de inicio del procedimiento que se notifica (art. 87.3.f). La condición es la relación entre ambos procedimientos, no que el obligado haya alegado, que el otro procedimiento esté parado desde hace meses ni que el obligado lo pida."
  citation: "art. 87.3 RGAT"
  difficulty: 3
  tags:
  - "comunicación de inicio"
  - "finalización de otro procedimiento"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0052
  prompt:
    es: "De acuerdo con el artículo 151.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones inspectoras podrán desarrollarse indistintamente, según determine la inspección, en el lugar donde:"
  options:
  - id: a
    text:
      es: "Se encuentre el domicilio personal del actuario que dirige las actuaciones."
  - id: b
    correct: true
    text:
      es: "Se realicen total o parcialmente las actividades gravadas."
  - id: c
    text:
      es: "Tenga su sede el órgano competente para liquidar, en todo caso."
  - id: d
    text:
      es: "El obligado tributario designe, mediante escrito dirigido al jefe del equipo de inspección."
  explanation:
    es: "La letra b) del artículo 151.1 admite el lugar donde se realicen total o parcialmente las actividades gravadas. Las otras opciones no son lugares de la lista: ni el domicilio del actuario, ni la sede del órgano que liquida, ni un lugar que el obligado elija, pues el lugar lo determina la inspección."
  citation: "art. 151.1 LGT"
  difficulty: 1
  tags:
  - "lugar"
  - "actuaciones"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0053
  prompt:
    es: "Conforme al artículo 151.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el lugar en que pueden desarrollarse las actuaciones inspectoras:"
  options:
  - id: a
    correct: true
    text:
      es: "Pueden desarrollarse en las oficinas de la Administración tributaria, cuando los elementos sobre los que hayan de realizarse puedan ser examinados en ellas."
  - id: b
    text:
      es: "Pueden desarrollarse en las oficinas de la Administración tributaria siempre que el obligado tributario no se oponga."
  - id: c
    text:
      es: "Solo pueden desarrollarse en las oficinas de la Administración si el obligado tributario las solicita por escrito."
  - id: d
    text:
      es: "Deben desarrollarse en el domicilio fiscal del obligado, salvo autorización del órgano competente para liquidar."
  explanation:
    es: "La letra d) permite actuar en las oficinas cuando los elementos que deban examinarse puedan examinarse allí, sin condicionarlo a la oposición ni a la petición del obligado. El domicilio fiscal es uno de los lugares posibles, no el obligatorio, porque el artículo dice que se actúa indistintamente según determine la inspección."
  citation: "art. 151.1 LGT"
  difficulty: 3
  tags:
  - "lugar"
  - "oficinas"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0054
  prompt:
    es: "Según el artículo 151.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones podrán realizarse en los lugares señalados en las letras anteriores o en otro lugar, a través de sistemas digitales de comunicación bidireccional y simultánea de imagen y sonido, lo que requiere:"
  options:
  - id: a
    text:
      es: "La autorización del delegado o del director de departamento."
  - id: b
    correct: true
    text:
      es: "La conformidad del obligado tributario."
  - id: c
    text:
      es: "La autorización judicial previa a la sesión."
  - id: d
    text:
      es: "La presencia de dos funcionarios de inspección en cada sesión."
  explanation:
    es: "La letra e) condiciona el uso de los sistemas digitales a la conformidad del obligado tributario. No requiere la autorización del delegado, el juez ni la presencia de dos funcionarios."
  citation: "art. 151.1 LGT"
  difficulty: 1
  tags:
  - "lugar"
  - "medios digitales"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0055
  prompt:
    es: "¿Dónde se desarrolla la inspección, conforme al artículo 151.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando el obligado tributario es una persona con discapacidad o con movilidad reducida?"
  options:
  - id: a
    text:
      es: "En su domicilio fiscal, que en este caso pasa a ser el único lugar posible."
  - id: b
    text:
      es: "En el lugar que ella elija, aunque no sea ninguno de los descritos en el apartado 1."
  - id: c
    text:
      es: "En las oficinas de la Administración tributaria, que deberán estar adaptadas al efecto para esa persona y para su representante."
  - id: d
    correct: true
    text:
      es: "En el lugar que resulte más apropiado para la persona, de entre los descritos en el apartado 1 del artículo."
  explanation:
    es: "El artículo 151.6 elige el lugar más apropiado para la persona, pero dentro de los descritos en el apartado 1. No lo reduce al domicilio fiscal, no deja la elección libre fuera de esos lugares ni impone las oficinas."
  citation: "art. 151.6 LGT"
  difficulty: 2
  tags:
  - "lugar"
  - "discapacidad"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0056
  prompt:
    es: "De acuerdo con el artículo 151.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los libros y demás documentación a que se refiere el artículo 142.1 deberán ser examinados en el domicilio, local, despacho u oficina del obligado, en presencia del mismo o de la persona que designe, salvo que:"
  options:
  - id: a
    text:
      es: "El actuario considere más cómodo su examen en las oficinas públicas."
  - id: b
    text:
      es: "El obligado tributario no designe a ninguna persona para presenciar el examen."
  - id: c
    correct: true
    text:
      es: "El obligado tributario consienta su examen en las oficinas públicas."
  - id: d
    text:
      es: "El órgano competente para liquidar autorice su examen en las oficinas públicas."
  explanation:
    es: "El artículo 151.3 admite el examen en las oficinas públicas si el obligado lo consiente. La comodidad del actuario o la autorización del órgano que liquida no sustituyen ese consentimiento, y que no designe a nadie no cambia el lugar."
  citation: "art. 151.3 LGT"
  difficulty: 1
  tags:
  - "lugar"
  - "libros"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0057
  prompt:
    es: "Conforme al artículo 151.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el análisis de los libros y documentos del obligado tributario:"
  options:
  - id: a
    text:
      es: "La inspección no puede analizar en sus oficinas copias de los libros y documentos del obligado, sino solo los originales."
  - id: b
    text:
      es: "La inspección puede analizar en sus oficinas las copias solo cuando consten en soporte electrónico."
  - id: c
    text:
      es: "La inspección puede analizar en sus oficinas las copias con autorización del delegado o del director de departamento."
  - id: d
    correct: true
    text:
      es: "La inspección puede analizar en sus oficinas las copias, en cualquier soporte, de los libros y documentos del obligado."
  explanation:
    es: "El artículo 151.3 permite analizar en las oficinas de la inspección las copias en cualquier soporte, sin limitarlas al electrónico ni condicionarlas a una autorización. Tampoco obliga a trabajar solo con originales."
  citation: "art. 151.3 LGT"
  difficulty: 2
  tags:
  - "lugar"
  - "copias"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0058
  prompt:
    es: "Según el artículo 151.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tratándose de los registros y documentos establecidos por normas de carácter tributario o de los justificantes exigidos por estas, podrá requerirse:"
  options:
  - id: a
    text:
      es: "Su depósito en el órgano competente para liquidar hasta la terminación del procedimiento."
  - id: b
    correct: true
    text:
      es: "Su presentación en las oficinas de la Administración tributaria para su examen."
  - id: c
    text:
      es: "Su entrega a un perito designado por la Administración para que los examine fuera de las oficinas."
  - id: d
    text:
      es: "Su presentación en el domicilio del actuario, en el día y hora que este señale."
  explanation:
    es: "El artículo 151.4 permite requerir esos registros y justificantes para examinarlos en las oficinas de la Administración. No prevé depositarlos en el órgano que liquida, entregarlos a un perito ni presentarlos en el domicilio del actuario."
  citation: "art. 151.4 LGT"
  difficulty: 2
  tags:
  - "lugar"
  - "registros"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0059
  prompt:
    es: "De acuerdo con el artículo 151.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la inspección podrá personarse en las empresas, oficinas, dependencias, instalaciones o almacenes del obligado, entendiéndose las actuaciones con este o con el encargado o responsable de los locales:"
  options:
  - id: a
    correct: true
    text:
      es: "Sin previa comunicación."
  - id: b
    text:
      es: "Previa comunicación notificada con al menos diez días de antelación."
  - id: c
    text:
      es: "Previa autorización del delegado o del director de departamento."
  - id: d
    text:
      es: "Previo consentimiento escrito del obligado tributario o de su representante."
  explanation:
    es: "El artículo 151.2 permite la personación sin previa comunicación. No exige notificar con diez días de antelación, ni autorización del delegado o del director de departamento (que se necesita para la entrada ante oposición), ni consentimiento escrito."
  citation: "art. 151.2 LGT"
  difficulty: 1
  tags:
  - "personación"
  - "sin previa comunicación"
# anchor: boe-a-2007-15984-art-177
- id: m03-l08-q0061
  prompt:
    es: "Según el artículo 177.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el procedimiento de inspección podrá iniciarse sin previa comunicación mediante personación en la empresa, oficinas, dependencias, instalaciones, centros de trabajo o almacenes del obligado, o:"
  options:
  - id: a
    correct: true
    text:
      es: "Donde exista alguna prueba de la obligación tributaria, aunque sea parcial."
  - id: b
    text:
      es: "Donde el actuario presuma que existen bienes embargables del obligado."
  - id: c
    text:
      es: "En el domicilio de los socios o administradores de la entidad obligada."
  - id: d
    text:
      es: "En la sede del órgano competente para liquidar, con citación previa del obligado y de su representante."
  explanation:
    es: "El artículo 177.2 añade el lugar donde exista alguna prueba de la obligación tributaria, aunque sea parcial. Los bienes embargables son materia de recaudación, el domicilio de los socios no está en el texto y la sede del órgano que liquida no es lugar de personación."
  citation: "art. 177.2 RGAT"
  difficulty: 2
  tags:
  - "personación"
  - "inicio"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0063
  prompt:
    es: "Conforme al artículo 173.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el obligado tributario o su representante deberán hallarse presentes en las actuaciones inspectoras:"
  options:
  - id: a
    text:
      es: "Siempre que las actuaciones se desarrollen en los locales del obligado."
  - id: b
    correct: true
    text:
      es: "Cuando a juicio del órgano de inspección sea preciso para la adecuada práctica de aquellas."
  - id: c
    text:
      es: "Cuando así lo solicite el obligado tributario mediante escrito motivado dirigido al órgano de inspección."
  - id: d
    text:
      es: "Únicamente cuando se examinen la contabilidad principal y auxiliar."
  explanation:
    es: "El artículo 173.3 deja la decisión al órgano de inspección: la presencia es obligatoria cuando, a su juicio, hace falta para la adecuada práctica de las actuaciones. No depende del lugar, de una petición del obligado ni del tipo de documentación examinada."
  citation: "art. 173.3 RGAT"
  difficulty: 1
  tags:
  - "personación"
  - "presencia"
# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0064
  prompt:
    es: "De acuerdo con el artículo 180.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre las actuaciones en el domicilio fiscal, oficinas, dependencias, instalaciones o almacenes del obligado cuando existe personación, previa comunicación o sin ella:"
  options:
  - id: a
    text:
      es: "Se debe prestar la debida colaboración, pero el obligado no está obligado a proporcionar los medios auxiliares necesarios."
  - id: b
    text:
      es: "Se debe prestar colaboración solo cuando la personación se haya hecho previa comunicación."
  - id: c
    correct: true
    text:
      es: "Se debe prestar la debida colaboración y proporcionar el lugar y los medios auxiliares necesarios para el ejercicio de las funciones inspectoras."
  - id: d
    text:
      es: "Se debe proporcionar el lugar, pero los medios auxiliares los aporta la Administración tributaria."
  explanation:
    es: "El artículo 180.2 impone colaborar y proporcionar el lugar y los medios auxiliares necesarios, haya habido o no comunicación previa. No limita el deber a la personación comunicada ni traslada los medios a la Administración."
  citation: "art. 180.2 RGAT"
  difficulty: 2
  tags:
  - "personación"
  - "colaboración"
# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0065
  prompt:
    es: "Según el artículo 180.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, sin perjuicio del ejercicio de las facultades y funciones inspectoras, las actuaciones del procedimiento deberán practicarse de forma que:"
  options:
  - id: a
    correct: true
    text:
      es: "Se perturbe lo menos posible el desarrollo normal de las actividades laborales o económicas del obligado tributario."
  - id: b
    text:
      es: "Se concentren en una sola jornada para reducir la duración del procedimiento."
  - id: c
    text:
      es: "Se respete la jornada laboral de oficina, sin posibilidad de actuar fuera de ella."
  - id: d
    text:
      es: "Se practiquen siempre en las oficinas de la Administración tributaria."
  explanation:
    es: "El artículo 180.4 ordena perturbar lo menos posible las actividades del obligado. No impone concentrar las actuaciones en un día, ni excluye actuar fuera de la jornada, que prevé el artículo 182, ni obliga a hacerlo en las oficinas."
  citation: "art. 180.4 RGAT"
  difficulty: 1
  tags:
  - "actuaciones"
  - "perturbación"
# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0066
  prompt:
    es: "De acuerdo con el artículo 180.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, los requerimientos de comparecencia en las oficinas no realizados en presencia del obligado deberán habilitar un plazo mínimo de:"
  options:
  - id: a
    text:
      es: "Cinco días, contados a partir del día siguiente al de la notificación del requerimiento."
  - id: b
    text:
      es: "Quince días, contados a partir del día siguiente al de la notificación del requerimiento."
  - id: c
    correct: true
    text:
      es: "Diez días, contados a partir del día siguiente al de la notificación del requerimiento."
  - id: d
    text:
      es: "Siete días naturales, contados a partir del día siguiente al de la notificación del requerimiento."
  explanation:
    es: "El artículo 180.3 fija un mínimo de diez días desde el día siguiente al de la notificación del requerimiento. Cinco días es el plazo de las reiteraciones de requerimientos de información (art. 171.3) y de las alegaciones contra medidas cautelares (art. 181.5). Quince días es el de la ratificación o el de alegaciones del acta. Siete días naturales es el mínimo de cada periodo que solicita el obligado (art. 184.1)."
  citation: "art. 180.3 RGAT"
  difficulty: 2
  tags:
  - "plazo"
  - "comparecencia"
# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0067
  prompt:
    es: "Conforme al artículo 180.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre las actuaciones de cada día que se hayan realizado en presencia del obligado tributario:"
  options:
  - id: a
    text:
      es: "Al término de ellas, el personal inspector debe notificar por escrito la reanudación con diez días de antelación."
  - id: b
    text:
      es: "Al término de ellas, la reanudación debe fijarse con el consentimiento expreso del obligado tributario."
  - id: c
    text:
      es: "Al término de ellas, la reanudación no puede tener lugar antes de que transcurran cinco días hábiles."
  - id: d
    correct: true
    text:
      es: "Al término de ellas, el personal inspector puede fijar el lugar, día y hora para su reanudación, que puede tener lugar el día hábil siguiente."
  explanation:
    es: "Cuando las actuaciones se han hecho en presencia del obligado, el personal inspector puede fijar al final de la jornada la reanudación, incluso el día hábil siguiente (art. 180.3). Los diez días de plazo mínimo son para los requerimientos de comparecencia que no se hacen en presencia del obligado. No hace falta su consentimiento ni un intervalo de cinco días."
  citation: "art. 180.3 RGAT"
  difficulty: 3
  tags:
  - "actuaciones"
  - "reanudación"
# anchor: boe-a-2003-23186-art-152
- id: m03-l08-q0068
  prompt:
    es: "Según el artículo 152.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones que se desarrollen en oficinas públicas se realizarán dentro del horario oficial de apertura al público de las mismas y, en todo caso:"
  options:
  - id: a
    text:
      es: "Dentro de la jornada laboral de oficina del obligado tributario."
  - id: b
    correct: true
    text:
      es: "Dentro de la jornada de trabajo vigente."
  - id: c
    text:
      es: "Entre las ocho y las quince horas de los días hábiles."
  - id: d
    text:
      es: "Dentro de los días y horas que fije el órgano competente para liquidar."
  explanation:
    es: "El artículo 152.1 añade, además del horario de apertura al público, la jornada de trabajo vigente. La jornada del obligado se respeta en sus locales (art. 152.2). El artículo no fija un horario concreto en horas ni deja la fijación al órgano que liquida."
  citation: "art. 152.1 LGT"
  difficulty: 1
  tags:
  - "horario"
  - "oficinas"
# anchor: boe-a-2003-23186-art-152
- id: m03-l08-q0069
  prompt:
    es: "De acuerdo con el artículo 152.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las actuaciones que se desarrollan en los locales del interesado:"
  options:
  - id: a
    correct: true
    text:
      es: "Se respetará la jornada laboral de oficina o de la actividad que se realice en ellos, con la posibilidad de actuar de común acuerdo en otras horas o días."
  - id: b
    text:
      es: "Se respetará la jornada laboral de oficina, sin que sea posible actuar en otras horas o días aunque exista acuerdo."
  - id: c
    text:
      es: "Se respetará la jornada oficial de las oficinas públicas, con independencia de la actividad que se realice en los locales."
  - id: d
    text:
      es: "Se podrá actuar en cualquier hora o día, sin necesidad de acuerdo con el obligado, siempre que se perturbe lo menos posible."
  explanation:
    es: "El artículo 152.2 respeta la jornada de oficina o de la actividad del local y admite actuar en otras horas o días de común acuerdo. No lo prohíbe, no impone la jornada de las oficinas públicas y no autoriza a actuar a cualquier hora sin acuerdo."
  citation: "art. 152.2 LGT"
  difficulty: 2
  tags:
  - "horario"
  - "locales"
# anchor: boe-a-2003-23186-art-152
- id: m03-l08-q0070
  prompt:
    es: "Conforme al artículo 152.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando las circunstancias de las actuaciones lo exijan, se podrá actuar fuera de los días y horas ordinarios:"
  options:
  - id: a
    text:
      es: "Con la autorización judicial previa en todos los casos."
  - id: b
    text:
      es: "Siempre que el obligado tributario haya sido informado por escrito el día anterior."
  - id: c
    correct: true
    text:
      es: "En los términos que se establezcan reglamentariamente."
  - id: d
    text:
      es: "Hasta un máximo de diez horas por semana en cada procedimiento."
  explanation:
    es: "El artículo 152.3 remite al reglamento los términos para actuar fuera de los días y horas ordinarios. El reglamento (art. 182) exige consentimiento o autorización del delegado o del director de departamento, no autorización judicial, y la ley no establece un aviso del día anterior ni un límite semanal."
  citation: "art. 152.3 LGT"
  difficulty: 2
  tags:
  - "horario"
  - "reglamento"
# anchor: boe-a-2007-15984-art-182
- id: m03-l08-q0072
  prompt:
    es: "Según el artículo 182.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en el ámbito de la Agencia Estatal de Administración Tributaria, ¿a quién corresponde autorizar las actuaciones fuera de la jornada laboral en los locales del obligado?"
  options:
  - id: a
    text:
      es: "Al inspector regional de la delegación especial en cuyo ámbito territorial se encuentre el local."
  - id: b
    correct: true
    text:
      es: "Al delegado o al director de departamento del que dependa el órgano actuante."
  - id: c
    text:
      es: "Al director general de la Agencia Estatal de Administración Tributaria."
  - id: d
    text:
      es: "Al jefe del equipo o unidad que desarrolle las actuaciones."
  explanation:
    es: "El artículo 182.2 atribuye la autorización al delegado o al director de departamento del que dependa el órgano actuante. El inspector regional y el jefe de equipo no figuran en el texto, y el director general queda por encima del nivel que señala."
  citation: "art. 182.2 RGAT"
  difficulty: 2
  tags:
  - "horario"
  - "órgano"
# anchor: boe-a-2007-15984-art-182
- id: m03-l08-q0073
  prompt:
    es: "¿Qué puede exigir el obligado tributario, conforme al artículo 182.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando se actúa en sus locales fuera de la jornada laboral con autorización del órgano competente?"
  options:
  - id: a
    text:
      es: "Que la autorización se notifique al sindicato o comité de empresa."
  - id: b
    correct: true
    text:
      es: "Que se le entregue copia de la autorización."
  - id: c
    text:
      es: "Que se levante diligencia en presencia de un notario."
  - id: d
    text:
      es: "Que el órgano competente ratifique la autorización en cinco días."
  explanation:
    es: "El último párrafo del artículo 182.2 reconoce al obligado el derecho a exigir copia de la autorización. No prevé notificarla a sindicatos, levantar acta notarial ni una ratificación posterior."
  citation: "art. 182.2 RGAT"
  difficulty: 1
  tags:
  - "horario"
  - "autorización"
# anchor: boe-a-2007-15984-art-182
- id: m03-l08-q0074
  prompt:
    es: "De acuerdo con el artículo 182.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actuaciones inspectoras que se desarrollen en las oficinas públicas podrán realizarse fuera del horario oficial de apertura al público cuando:"
  options:
  - id: a
    text:
      es: "Lo autorice el delegado o el director de departamento, en todo caso, y medie el consentimiento del obligado."
  - id: b
    text:
      es: "Lo solicite el obligado tributario y lo autorice el órgano competente para liquidar."
  - id: c
    text:
      es: "Lo requiera el actuario y no exista oposición del obligado en los cinco días siguientes."
  - id: d
    correct: true
    text:
      es: "Lo requieran las circunstancias de dichas actuaciones o medie el consentimiento del obligado tributario."
  explanation:
    es: "El artículo 182.1 permite actuar en oficinas públicas fuera del horario cuando lo requieran las circunstancias o medie consentimiento del obligado, alternativas entre sí, sin autorización del delegado. Las otras opciones añaden requisitos que no están en el texto."
  citation: "art. 182.1 RGAT"
  difficulty: 2
  tags:
  - "horario"
  - "oficinas"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0128
  prompt:
    es: "Según el artículo 151.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuál de los siguientes lugares pueden desarrollarse las actuaciones inspectoras?"
  options:
  - id: a
    text:
      es: "En el domicilio de la persona que denunció al obligado tributario ante la Administración."
  - id: b
    text:
      es: "En el lugar donde esté ubicada la sede del órgano competente para dictar la liquidación."
  - id: c
    text:
      es: "En el lugar donde resida el actuario que dirige las actuaciones, si coincide con el del obligado."
  - id: d
    correct: true
    text:
      es: "En el lugar donde el obligado tributario tenga su domicilio fiscal o donde su representante tenga su domicilio, despacho u oficina."
  explanation:
    es: "La letra a) del artículo 151.1 admite el domicilio fiscal del obligado o el domicilio, despacho u oficina de su representante. El domicilio de un denunciante, la sede del órgano que liquida y la residencia del actuario no son lugares de la lista."
  citation: "art. 151.1 LGT"
  difficulty: 1
  tags:
  - "lugar"
  - "domicilio fiscal"
