# anchor: boe-a-1985-151-art-7
- id: m04-l06-q017
  prompt:
    es: "Los servicios prestados en un segundo puesto del sector público autorizado como compatible quedan fuera del cómputo:"
  options:
  - id: a
    text:
      es: "A efectos de trienios, pero computan para derechos pasivos."
  - id: b
    correct: true
    text:
      es: "A efectos de trienios y de derechos pasivos."
  - id: c
    text:
      es: "A efectos de derechos pasivos, pero computan para trienios."
  - id: d
    text:
      es: "A efectos de trienios y de derechos pasivos, solo si el puesto es laboral."
  explanation:
    es: "El artículo 7.2 de la Ley 53/1984 dice que esos servicios «no se computarán a efectos de trienios ni de derechos pasivos». Las dos opciones que excluyen solo uno de los dos efectos contradicen el texto. La que limita la regla al segundo puesto laboral añade una condición que el artículo no pone: rige sea cual sea la naturaleza del puesto."
  citation: "art. 7.2 Ley 53/1984"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1985-151-art-9
- id: m04-l06-q019
  prompt:
    es: "Según el artículo 9 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, en el Estado la autorización de compatibilidad para un segundo puesto público se acuerda a propuesta de:"
  options:
  - id: a
    text:
      es: "La Dirección General de la Función Pública."
  - id: b
    correct: true
    text:
      es: "La Subsecretaría del Departamento correspondiente."
  - id: c
    text:
      es: "La Secretaría General Técnica del Departamento correspondiente."
  - id: d
    text:
      es: "La Oficina de Conflictos de Intereses."
  explanation:
    es: "El artículo 9 atribuye la autorización o denegación al ministerio que nombra, «a propuesta de la Subsecretaría del Departamento correspondiente». Ni la Dirección General de la Función Pública, ni la Secretaría General Técnica, ni la Oficina de Conflictos de Intereses aparecen en el artículo como proponentes."
  citation: "art. 9 Ley 53/1984"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1985-151-art-9
- id: m04-l06-q020
  prompt:
    es: "Según el artículo 9 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, si ambos puestos son de la Administración del Estado, ¿quién emite el informe favorable sobre el segundo puesto?"
  options:
  - id: a
    text:
      es: "La Subsecretaría del Departamento al que corresponda el puesto principal."
  - id: b
    text:
      es: "La Secretaría General Técnica del Departamento del segundo puesto."
  - id: c
    correct: true
    text:
      es: "La Subsecretaría del Departamento al que corresponda el segundo puesto."
  - id: d
    text:
      es: "La Dirección General de la Función Pública, oída la Subsecretaría."
  explanation:
    es: "El artículo 9 dice: «Si los dos puestos correspondieran a la Administración del Estado, emitirá este informe la Subsecretaría del Departamento al que corresponda el segundo puesto». La Subsecretaría del puesto principal es la que propone la autorización, no la que informa sobre el segundo puesto. La Secretaría General Técnica y la Dirección General de la Función Pública no aparecen en el artículo."
  citation: "art. 9 Ley 53/1984"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1985-151-art-9
- id: m04-l06-q021
  prompt:
    es: "¿Qué informe requiere además la autorización de compatibilidad cuando el puesto principal es de la Administración del Estado y el segundo de una Comunidad Autónoma?"
  options:
  - id: a
    correct: true
    text:
      es: "El previo informe favorable del órgano competente de la Comunidad Autónoma."
  - id: b
    text:
      es: "El previo informe favorable de la Subsecretaría del Departamento del puesto principal."
  - id: c
    text:
      es: "El previo informe favorable de la Delegación del Gobierno en la Comunidad Autónoma."
  - id: d
    text:
      es: "El previo informe favorable del Pleno de la Corporación Local."
  explanation:
    es: "El artículo noveno de la Ley 53/1984 exige además «el previo informe favorable del órgano competente de la Comunidad Autónoma o Pleno de la Corporación Local, conforme a la adscripción del segundo puesto». El segundo puesto es autonómico, así que informa la Comunidad Autónoma. La Subsecretaría del Departamento propone la autorización a partir del puesto principal, y solo emite el informe sobre el segundo puesto cuando los dos son de la Administración del Estado. El Pleno de la Corporación Local informa cuando el segundo puesto es local. La Delegación del Gobierno no es ninguno de los órganos que cita el artículo."
  citation: "art. 9 Ley 53/1984"
  difficulty: 2
  tags:
