      es: "En el plazo de seis meses."
  explanation:
    es: "El artículo 45.1 fija diez días para la resolución, con la única salvedad de la separación del servicio. La suspensión de funciones no es separación, así que rige el plazo de diez días. Un mes, tres meses y seis meses no son el plazo de este trámite."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-45
- id: m04-l06-q254
  prompt:
    es: "El órgano competente recibe el lunes, 15 de noviembre de 2027, un expediente en el que se propone suspensión de funciones. Si el plazo para resolver se cuenta desde el día siguiente, sin festivos en esas fechas, ¿cuándo vence?"
  options:
  - id: a
    text:
      es: "El jueves, 25 de noviembre de 2027."
  - id: b
    text:
      es: "El viernes, 26 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 29 de noviembre de 2027."
  - id: d
    text:
      es: "El miércoles, 15 de diciembre de 2027."
  explanation:
    es: "Como no es separación del servicio, el artículo 45.1 del Real Decreto 33/1986 da diez días, hábiles por el artículo 30.2 de la Ley 39/2015. Del martes 16 al viernes 19 van cuatro, del lunes 22 al viernes 26 nueve, y el décimo es el lunes 29 de noviembre de 2027. El jueves 25 sale de contar días naturales. El viernes 26 cuenta como primero el día de la recepción. El 15 de diciembre es un mes."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-47
- id: m04-l06-q255
  prompt:
    es: "Según el artículo 47.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿para imponer qué sanción es competente el Consejo de Ministros?"
  options:
  - id: a
    correct: true
    text:
      es: "La separación del servicio."
  - id: b
    text:
      es: "La suspensión de funciones."
  - id: c
    text:
      es: "El traslado con cambio de residencia."
  - id: d
    text:
      es: "El apercibimiento."
  explanation:
    es: "El artículo 47.1 reserva al Consejo de Ministros la imposición de «la separación del servicio». La suspensión de funciones y el traslado con cambio de residencia los imponen los Ministros y Secretarios de Estado (artículo 47.2). El apercibimiento lo imponen el Subsecretario, los Directores generales y los Delegados del Gobierno (artículo 47.3)."
  citation: "art. 47.1 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m04-l06-q256
  prompt:
    es: "Según el artículo 47.2 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, los Ministros y Secretarios de Estado del Departamento de destino son competentes para imponer:"
  options:
  - id: a
    text:
      es: "La suspensión de funciones, pero no el traslado con cambio de residencia."
  - id: b
    text:
      es: "El apercibimiento y el traslado con cambio de residencia."
  - id: c
    text:
      es: "Solo el apercibimiento, cuando se trate de faltas leves."
  - id: d
    correct: true
    text:
      es: "La suspensión de funciones y el traslado con cambio de residencia."
  explanation:
    es: "El artículo 47.2 les atribuye «las sanciones de los apartados b) y c) del artículo 14»: la suspensión de funciones y el traslado con cambio de residencia. Excluir el traslado deja fuera el apartado c). El apercibimiento es el apartado e), que el artículo 47.3 da al Subsecretario, a los Directores generales y a los Delegados del Gobierno."
  citation: "art. 47.2 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m04-l06-q257
  prompt:
    es: "De acuerdo con el artículo 47.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la sanción de apercibimiento puede imponerla a cualquier funcionario destinado en el Departamento:"
  options:
  - id: a
    text:
      es: "El Director general de cualquier centro directivo del Departamento."
  - id: b
    text:
      es: "El Delegado del Gobierno de cualquier comunidad autónoma."
  - id: c
    correct: true
    text:
      es: "El Subsecretario del Departamento."
  - id: d
    text:
      es: "El Jefe del centro o dependencia del funcionario."
  explanation:
    es: "El artículo 47.3 RD 33/1986 asigna la sanción de apercibimiento (apartados d y e del artículo 14) al «Subsecretario del Departamento, en todo caso». Los Directores generales la imponen solo «respecto del personal dependiente de su Dirección General», no a cualquier funcionario del Departamento. Los Delegados del Gobierno la imponen solo «respecto a los funcionarios destinados en su correspondiente ámbito territorial», no a los de cualquier comunidad autónoma. El artículo 47 enumera los órganos sancionadores en tres apartados: el Consejo de Ministros para la separación del servicio, los Ministros y Secretarios de Estado, o los Subsecretarios por delegación, para las sanciones de los apartados b) y c) del artículo 14, y los del apartado 3. El Jefe del centro o dependencia no es ninguno de ellos."
  citation: "art. 47.3 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m04-l06-q258
  prompt:
    es: "¿Cuál de las siguientes sanciones pueden imponer los Delegados del Gobierno a los funcionarios de su ámbito territorial, según el artículo 47.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El apercibimiento."
  - id: b
    text:
      es: "La suspensión de funciones."
  - id: c
    text:
      es: "El traslado con cambio de residencia."
  - id: d
    text:
      es: "La separación del servicio."
  explanation:
    es: "El artículo 47.3 permite a los Delegados del Gobierno imponer en su ámbito territorial las sanciones «de los apartados d) y e) del artículo 14». El apartado d) figura como derogado y el e) es el apercibimiento. La suspensión de funciones y el traslado con cambio de residencia son de los Ministros y Secretarios de Estado (artículo 47.2), y la separación del servicio, del Consejo de Ministros (artículo 47.1)."
  citation: "art. 47.3 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-94
- id: m04-l06-q260
  prompt:
    es: "El Instructor de un procedimiento disciplinario recoge indicios fundados de que los hechos investigados son delictivos. Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué efecto tiene esto sobre la tramitación?"
  options:
  - id: a
    text:
      es: "Continúa su curso normal hasta la propuesta de resolución del Instructor."
  - id: b
    correct: true
    text:
      es: "Se suspende la tramitación del procedimiento disciplinario ya iniciado."
  - id: c
    text:
      es: "Se amplía en un mes el plazo para formular el pliego de cargos."
  - id: d
    text:
      es: "Pasa a tramitarse por el procedimiento sumario con audiencia al interesado."
  explanation:
    es: "El artículo 94.3 dice que, ante indicios fundados de criminalidad, «se suspenderá su tramitación». El procedimiento no sigue su curso, y la ampliación del plazo del pliego de cargos exige causas justificadas del Instructor, no indicios de delito. El procedimiento sumario es el de las faltas leves, no el que sustituye al ordinario."
  citation: "art. 94.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
