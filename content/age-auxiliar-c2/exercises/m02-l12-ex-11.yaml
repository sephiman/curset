# anchor: fuente-ms-win-navegador-predeterminado-html
- id: m02-l12-q237
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes procedimientos elige la aplicación que abre los archivos de un tipo concreto, como .txt, en «Aplicaciones predeterminadas»?"
  options:
  - id: a
    correct: true
    text:
      es: "Buscar la extensión del archivo, elegir el resultado y seleccionar la aplicación"
  - id: b
    text:
      es: "Hacer clic con el botón derecho en el archivo y elegir «Anclar a Inicio»"
  - id: c
    text:
      es: "Seleccionar «Administrar extensiones» y activar el conmutador del tipo de archivo"
  - id: d
    text:
      es: "Abrir Edge y seleccionar «Más herramientas › Anclar a Inicio»"
  explanation:
    es: "La página indica escribir la extensión en la barra de búsqueda, seleccionar el resultado y elegir una de las aplicaciones propuestas. «Hacer clic con el botón derecho en el archivo y elegir «Anclar a Inicio»»: «Anclar a Inicio» coloca el elemento en el menú Inicio y no cambia la aplicación asociada. «Abrir Edge y seleccionar «Más herramientas › Anclar a Inicio»»: esa ruta fija un sitio web en el menú Inicio, según la página del menú Inicio. «Seleccionar «Administrar extensiones» y activar el conmutador del tipo de archivo»: «Administrar extensiones» sirve para desactivar extensiones de Edge, según su página."
  citation: "fuente: `ms-win-navegador-predeterminado.html`; «Cómo cambiar las aplicaciones predeterminadas»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-ie-edge-ciclo-vida-html
- id: m02-l12-q239
  prompt:
    es: "¿Qué recomienda Microsoft, tras la retirada de la aplicación de escritorio de Internet Explorer 11, a quienes necesitan compatibilidad con sitios antiguos?"
  options:
  - id: a
    text:
      es: "Seguir con la versión anterior de Edge, que aún recibe actualizaciones"
  - id: b
    correct: true
    text:
      es: "Pasarse a Microsoft Edge con el modo IE"
  - id: c
    text:
      es: "Agregar una extensión de Chrome Web Store que sustituya a Internet Explorer"
  - id: d
    text:
      es: "Abrir las páginas antiguas en una ventana InPrivate de Edge"
  explanation:
    es: "Microsoft recomienda pasarse a Microsoft Edge con el modo IE, que permite la compatibilidad con versiones anteriores. «Seguir con la versión anterior de Edge, que aún recibe actualizaciones»: la versión anterior de Edge dejó de recibir actualizaciones de seguridad el 9 de marzo de 2021. «Abrir las páginas antiguas en una ventana InPrivate de Edge»: InPrivate solo evita guardar el historial, las cookies, los datos del sitio y los formularios; no aporta compatibilidad. «Agregar una extensión de Chrome Web Store que sustituya a Internet Explorer»: las extensiones personalizan la experiencia con el explorador; la compatibilidad la da el modo IE."
  citation: "fuente: `ms-ie-edge-ciclo-vida.html`; «Preguntas frecuentes sobre el ciclo de vida: Internet Explorer y Microsoft Edge»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-ie-edge-ciclo-vida-html
- id: m02-l12-q240
  prompt:
    es: "Según Microsoft, ¿hasta cuándo será compatible como mínimo el modo IE de Microsoft Edge, que permite la compatibilidad con versiones anteriores?"
  options:
  - id: a
    text:
      es: "Hasta el 9 de marzo de 2021"
  - id: b
    text:
      es: "Hasta el 14 de octubre de 2025"
  - id: c
    correct: true
    text:
      es: "Al menos hasta 2029"
  - id: d
    text:
      es: "Hasta el 15 de junio de 2022"
  explanation:
    es: "Microsoft indica que el modo IE será compatible al menos hasta 2029. «Hasta el 15 de junio de 2022» es la fecha desde la que la aplicación de escritorio de Internet Explorer 11 dejó de ser compatible con ciertos sistemas. «Hasta el 9 de marzo de 2021» es la fecha en que terminó el soporte de la versión anterior de Microsoft Edge. «Hasta el 14 de octubre de 2025» es la fecha en que terminó el soporte de Windows 10, según la página del menú Inicio, y no tiene que ver con el modo IE."
  citation: "fuente: `ms-ie-edge-ciclo-vida.html`; «Preguntas frecuentes sobre el ciclo de vida: Internet Explorer y Microsoft Edge»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-ie-edge-ciclo-vida-html
- id: m02-l12-q241
  prompt:
    es: "¿Con qué antelación notificará Microsoft la retirada del modo IE de Microsoft Edge, según su página sobre el ciclo de vida de Internet Explorer?"
  options:
  - id: a
    text:
      es: "Sin aviso previo, con una actualización de Edge"
  - id: b
    text:
      es: "Con seis meses de antelación"
  - id: c
    text:
      es: "Con tres años de antelación"
  - id: d
    correct: true
    text:
      es: "Con un año de antelación"
  explanation:
    es: "Microsoft notificará la retirada del modo IE con un año de antelación. «Con seis meses de antelación» es la mitad del plazo que indica la página. «Con tres años de antelación»: triplica el plazo que indica la página. «Sin aviso previo, con una actualización de Edge» contradice la página, que promete una notificación previa."
  citation: "fuente: `ms-ie-edge-ciclo-vida.html`; «Preguntas frecuentes sobre el ciclo de vida: Internet Explorer y Microsoft Edge»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-ie-edge-ciclo-vida-html
- id: m02-l12-q242
  prompt:
    es: "Según la página de Microsoft sobre el ciclo de vida de Internet Explorer y Edge, ¿qué directiva de ciclo de vida rige a Microsoft Edge?"
  options:
  - id: a
    text:
      es: "La del producto de Windows en el que esté instalado"
  - id: b
    correct: true
    text:
      es: "La Directiva moderna"
  - id: c
    text:
      es: "La de las actualizaciones de seguridad extendidas (ESU)"
  - id: d
    text:
      es: "La de Microsoft Edge (versión anterior), que terminó en 2021"
  explanation:
    es: "Microsoft Edge se rige por la Directiva moderna. «La del producto de Windows en el que esté instalado» es la que rige a Internet Explorer, que es un componente del sistema operativo. «La de las actualizaciones de seguridad extendidas (ESU)»: las ESU permiten que algunas versiones de Internet Explorer sigan siendo compatibles tras la fecha final del sistema operativo. «La de Microsoft Edge (versión anterior), que terminó en 2021»: la versión anterior de Edge dejó de recibir actualizaciones de seguridad el 9 de marzo de 2021."
  citation: "fuente: `ms-ie-edge-ciclo-vida.html`; «Preguntas frecuentes sobre el ciclo de vida: Internet Explorer y Microsoft Edge»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-inprivate-2026-11-06-html
- id: m02-l12-q244
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué se guarda aunque se navegue en una ventana de InPrivate?"
  options:
  - id: a
    text:
      es: "El historial de exploración"
  - id: b
    text:
      es: "Las cookies y los datos del sitio"
  - id: c
    correct: true
    text:
      es: "Las descargas y los favoritos"
  - id: d
    text:
      es: "Las entradas de formularios"
  explanation:
    es: "La exploración InPrivate limita el seguimiento local, pero permite guardar las descargas y los favoritos. «El historial de exploración» no se guarda: la ventana de InPrivate navega sin guardar el historial de exploración. «Las cookies y los datos del sitio» no se guardan: InPrivate navega sin guardar las cookies ni los datos del sitio. «Las entradas de formularios» no se guardan: InPrivate navega sin guardar las entradas de formularios."
  citation: "fuente: `ms-edge-inprivate_2026-11-06.html`; «Explorar InPrivate en Microsoft Edge»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-inprivate-2026-11-06-html
- id: m02-l12-q245
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué icono se selecciona para abrir una ventana de InPrivate con el ratón?"
  options:
  - id: a
    correct: true
    text:
      es: "Configuración y más"
  - id: b
    text:
      es: "Extensiones"
  - id: c
    text:
      es: "Descargas"
  - id: d
    text:
      es: "Favoritos"
  explanation:
    es: "La página indica seleccionar el icono Configuración y más y, después, abrir la nueva ventana InPrivate. «Extensiones» es el botón a la derecha de la barra de direcciones que da acceso a las extensiones del explorador. «Favoritos» abre la lista de favoritos, que también se muestra con Ctrl+Mayús+O. «Descargas» abre la lista de descargas, que también se muestra con Ctrl+J."
  citation: "fuente: `ms-edge-inprivate_2026-11-06.html`; «Explorar InPrivate en Microsoft Edge»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-privacidad-html
- id: m02-l12-q246
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué ocurre con las sugerencias automáticas de búsqueda al explorar en una ventana de InPrivate?"
  options:
  - id: a
    text:
      es: "Siguen activas: lo que se escribe en la barra de direcciones se envía al proveedor de búsqueda"
  - id: b
    text:
      es: "Se activan y los sitios visitados se envían a Microsoft como datos de diagnóstico"
  - id: c
    correct: true
    text:
      es: "Están desactivadas, y no se recopila información sobre los sitios web visitados"
  - id: d
    text:
      es: "Siguen activas y se comparten con otras funciones de Windows mediante el indexador"
  explanation:
    es: "En InPrivate o en modo Invitado las sugerencias automáticas están desactivadas y no se recopila información sobre los sitios visitados. «Siguen activas: lo que se escribe en la barra de direcciones se envía al proveedor de búsqueda» es lo que ocurre fuera de InPrivate, cuando se activan las sugerencias de búsqueda. «Siguen activas y se comparten con otras funciones de Windows mediante el indexador»: los sitios visitados en InPrivate no se comparten con otras características de Windows. «Se activan y los sitios visitados se envían a Microsoft como datos de diagnóstico» contradice la página: no se recopila información sobre los sitios web que se visitan."
  citation: "fuente: `ms-edge-privacidad.html`; «Cuando se usa el modo Invitado o de exploración de InPrivate, Microsoft Edge recopila información sobre cómo usar el navegador en función de la configuración de los datos de diagnóstico de Windows o la configuración de privacidad de Microsoft Edge, pero las sugerencias automáticas están desactivadas y no se recopila información sobre los sitios web que visitas.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-privacidad-html
- id: m02-l12-q247
  prompt:
    es: "En Windows 11, ¿se comparte con el menú Inicio o la barra de tareas, mediante el indexador, el historial de los sitios visitados en una ventana de InPrivate de Edge?"
  options:
  - id: a
    text:
      es: "Sí, con una categoría como «visitada recientemente»"
  - id: b
    text:
      es: "Sí, hasta que se cierran todas las ventanas de InPrivate abiertas"
  - id: c
    text:
      es: "Sí, pero solo las direcciones URL, sin su frecuencia"
  - id: d
    correct: true
    text:
      es: "No: los sitios visitados en modo InPrivate no se comparten"
  explanation:
    es: "Edge comparte su historial con Windows mediante el indexador, pero los sitios visitados en InPrivate no se comparten. «Sí, con una categoría como «visitada recientemente»»: esas categorías son las del historial normal compartido con Windows, del que se excluyen los sitios de InPrivate. «Sí, pero solo las direcciones URL, sin su frecuencia»: el historial normal compartido incluye URL, categoría y frecuencia, pero nada de lo visitado en InPrivate. «Sí, hasta que se cierran todas las ventanas de InPrivate abiertas» no se comparte en ningún momento; al cerrar todas las ventanas de InPrivate, Edge además elimina el historial, las cookies y los datos del sitio."
  citation: "fuente: `ms-edge-privacidad.html`; «Qué datos se recopilan o almacenan y por qué»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q248
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué hace la tecla F10 al pulsarla sola, sin combinarla con otra tecla?"
  options:
  - id: a
    text:
      es: "Abre las Herramientas de desarrollo"
  - id: b
    correct: true
    text:
      es: "Establece el foco en el botón Configuración y más"
  - id: c
    text:
      es: "Entra al Lector inmersivo o sale de él"
  - id: d
    text:
      es: "Abre el menú Configuración y más"
  explanation:
    es: "F10 por sí sola establece el foco en el botón Configuración y más; para abrir el menú hay que añadir Entrar. «Abre el menú Configuración y más» es lo que hace F10 seguida de Entrar, no F10 sola. «Abre las Herramientas de desarrollo» lo hace F12. «Entra al Lector inmersivo o sale de él» corresponde a F9."
  citation: "fuente: `ms-edge-atajos.html`; «F10 — Establecer el foco en el botón Configuración y más»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q249
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre las opciones de borrar los datos de exploración en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+K"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+Suprimir"
  - id: c
    text:
      es: "Ctrl+Mayús+D"
  - id: d
    text:
      es: "Alt+Flecha izquierda"
  explanation:
    es: "La página de Microsoft asigna Ctrl+Mayús+Suprimir a esta acción. «Alt+Flecha izquierda» vuelve atrás a la página anterior, no abre las opciones de borrado. «Ctrl+Mayús+D» guarda todas las pestañas abiertas como favoritos. «Ctrl+Mayús+K» duplica la pestaña actual."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+Mayús+ Suprimir — Abrir las opciones de borrar los datos de exploración»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q250
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas guarda todas las pestañas abiertas como favoritos en una carpeta nueva en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+D"
  - id: b
    text:
      es: "Ctrl+Mayús+E"
  - id: c
    text:
      es: "Ctrl+Mayús+B"
  - id: d
    text:
      es: "Ctrl+Mayús+O"
  explanation:
    es: "La página de Microsoft asigna Ctrl+Mayús+D a esta acción. «Ctrl+Mayús+O» abre Favoritos, pero no guarda nada. «Ctrl+Mayús+B» muestra u oculta la barra de favoritos. «Ctrl+Mayús+E» abre la búsqueda en la barra lateral."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+Mayús+D — Guardar todas las pestañas abiertas como favoritos en una carpeta nueva»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q251
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas muestra u oculta la barra de favoritos en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+O"
  - id: b
    text:
      es: "Alt+Mayús+B"
  - id: c
    text:
      es: "Ctrl+Mayús+D"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+B"
  explanation:
    es: "La página de Microsoft asigna Ctrl+Mayús+B a esta acción. «Alt+Mayús+B» establece el foco en el primer elemento de la barra de favoritos, pero no la muestra ni la oculta. «Ctrl+Mayús+O» abre Favoritos. «Ctrl+Mayús+D» guarda todas las pestañas abiertas como favoritos."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+Mayús+B — Mostrar u ocultar la barra de favoritos»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q252
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas vuelve a abrir la última pestaña cerrada y cambia a ella en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+T"
  - id: b
    text:
      es: "Ctrl+Mayús+Pestaña"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+T"
  - id: d
    text:
      es: "Alt+Mayús+T"
  explanation:
    es: "La página de Microsoft asigna Ctrl+Mayús+T a esta acción. «Ctrl+T» abre una pestaña nueva, no recupera la cerrada. «Ctrl+Mayús+Pestaña» cambia a la pestaña anterior, no recupera la cerrada. «Alt+Mayús+T» establece el foco en el primer elemento de la barra de herramientas de la barra de aplicaciones."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+Mayús+T — Volver a abrir la última pestaña cerrada y cambiar a ella»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q253
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas duplica la pestaña actual en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+K"
  - id: b
    text:
      es: "Ctrl+Mayús+M"
  - id: c
    text:
      es: "Ctrl+M"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+K"
  explanation:
    es: "La página de Microsoft asigna Ctrl+Mayús+K a esta acción. «Ctrl+K» abre una consulta de búsqueda en la barra de direcciones. «Ctrl+Mayús+M» inicia sesión como usuario distinto o examina como invitado. «Ctrl+M» silencia la pestaña actual."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+Mayús+K — Duplicar la pestaña actual»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q254
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas pasa a la última pestaña abierta en la ventana en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+Pestaña"
  - id: b
    text:
      es: "Ctrl+0"
  - id: c
    correct: true
    text:
      es: "Ctrl+9"
  - id: d
    text:
      es: "Ctrl+1"
  explanation:
    es: "La página de Microsoft asigna Ctrl+9 a esta acción. «Ctrl+1» pasa a una pestaña específica, de la primera a la octava, no a la última. «Ctrl+0» restablece el nivel de zoom de la página. «Ctrl+Mayús+Pestaña» cambia a la pestaña anterior."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+9 — Pasar a la última pestaña»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m02-l12-q255
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué hace la combinación de teclas Ctrl+1, Ctrl+2 y así hasta Ctrl+8?"
  options:
  - id: a
    text:
      es: "Pasan a la pestaña del extremo derecho"
  - id: b
    correct: true
    text:
      es: "Pasan a una pestaña específica de la ventana"
  - id: c
    text:
      es: "Abren una pestaña nueva numerada"
  - id: d
    text:
      es: "Cambian el nivel de zoom de la página"
  explanation:
    es: "La página de Microsoft asigna Ctrl+1, Ctrl+2 y así hasta Ctrl+8 a esta acción. «Cambian el nivel de zoom de la página»: el zoom se controla con Ctrl+Signo más, Ctrl+Signo menos y Ctrl+0. «Pasan a la pestaña del extremo derecho»: pasar a la pestaña final es Ctrl+9. «Abren una pestaña nueva numerada»: abrir una pestaña nueva es Ctrl+T."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+1, 2, ... 8 — Pasar a una pestaña específica»"
  difficulty: 2
  tags:
  - "atajo"
