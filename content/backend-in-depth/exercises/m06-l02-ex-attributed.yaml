type: quiz
variants:
- id: m06-l02-qa02
  prompt:
    en: According to the Jakarta Persistence Team in Jakarta Persistence 3.2 section 3.5.3 Pessimistic Locking,
      which statement does the specification make about how pessimistic locking is carried out on the database?
  options:
  - id: a
    text:
      en: The provider locks exactly the rows that the application selected, and never any others
  - id: b
    correct: true
    text:
      en: A portable application should not rely on how the database achieves pessimistic locking
  - id: c
    text:
      en: Locking a join-table relationship also locks the state of the entities it references
  - id: d
    text:
      en: Pessimistic locking is allowed only for entities that contain a version attribute
  explanation:
    en: The specification states that a portable application should not rely on how pessimistic locking is achieved
      on the database. It rules out the claim that the provider locks exactly the selected rows, because the specification
      says a persistence provider or the underlying database management system may lock more rows than the ones
      selected by the application. It rules out the claim that locking a join-table relationship also locks the
      referenced entities, because the specification says the state of entities referenced by such relationships
      will not be locked unless those entities are explicitly locked. It rules out the claim that only versioned
      entities can be locked, because the specification says pessimistic locking may be applied to entities that
      do not contain version attributes.
  citation: jakarta-persistence-spec#a2066
  extract:
    en: a portable application should not rely on how pessimistic locking is achieved on the database
- id: m06-l02-qa04
  prompt:
    en: According to the HikariCP wiki in About Pool Sizing, at what limit does it say a properly tuned connection
      pool is set, in terms of the queries that the database processes?
  options:
  - id: a
    correct: true
    text:
      en: Right at the number of queries the database can process simultaneously
  - id: b
    text:
      en: At the number of application threads, so that no thread waits for a connection
  - id: c
    text:
      en: At the number of disk spindles, because disk access is the only bottleneck
  - id: d
    text:
      en: At one connection per CPU core, because more connections only add context switching
  explanation:
    en: The wiki states that a properly tuned pool is set right at the limit of the number of queries the database
      is capable of processing simultaneously. It rules out a pool sized to the application threads, because it
      says you want the rest of the application threads blocked on the pool awaiting connections. It rules out sizing
      by disk spindles alone, because it names CPU, Disk and Network as the three basic categories of database bottlenecks.
      It rules out exactly one connection per CPU core, because it says that when threads become blocked on I/O
      you can get more work done with more connections than physical computing cores.
  citation: hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections; hikaricp-pool-sizing#limited-resources;
    hikaricp-pool-sizing#limited-resources
  extract:
    en: If the pool is properly tuned it is set right at the limit of the number of queries the database is capable
      of processing simultaneously
