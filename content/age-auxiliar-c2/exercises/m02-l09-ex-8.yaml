      es: "Como FECHANUMERO(texto_fecha)"
  - id: d
    text:
      es: "Devuelve siempre un error de valor"
  explanation:
    es: "La página dice que, si un argumento de fecha es texto, se trata como FECHANUMERO(texto_fecha). «Como un número de serie igual a cero»: la página dice que el texto se trata como FECHANUMERO(texto_fecha). «Lo ignora y usa solo el otro argumento»: la página lo trata como FECHANUMERO(texto_fecha). «Devuelve siempre un error de valor»: el error se da solo si el texto no se puede analizar como fecha."
