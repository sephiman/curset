# anchor: boe-a-2005-14803-art-36
- id: m03-l09-q0032
  prompt:
    es: "De acuerdo con el artículo 36.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, los importes ingresados por los obligados al pago a través de tarjetas de crédito y débito:"
  options:
  - id: a
    text:
      es: "Podrán ser minorados por los descuentos que la entidad emisora aplique en la utilización de la tarjeta."
  - id: b
    text:
      es: "No podrán superar en ningún caso el importe de la deuda, y el exceso se devolverá de oficio."
  - id: c
    text:
      es: "Podrán simultanearse, para un mismo documento de ingreso, con otros medios de pago admitidos."
  - id: d
    correct: true
    text:
      es: "No podrán ser minorados como consecuencia de descuentos en la utilización de tales tarjetas o por cualquier otro motivo."
  explanation:
    es: "Los importes ingresados con tarjeta no se minoran por descuentos ni por ningún otro motivo (artículo 36.3). Admitir que el descuento de la entidad emisora reduzca lo ingresado contradice el precepto. La devolución de oficio del exceso no es el contenido del apartado. La simultaneidad con otros medios para un mismo documento está excluida por el apartado anterior del artículo."
  citation: "art. 36.3 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "tarjeta"
# anchor: boe-a-2005-14803-art-37
- id: m03-l09-q0034
  prompt:
    es: "Según el artículo 37 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en el pago mediante transferencia bancaria se considerará efectuado el pago:"
  options:
  - id: a
    text:
      es: "En la fecha en que el obligado haya dado la orden de transferencia a su entidad."
  - id: b
    text:
      es: "En la fecha en que el importe llegue a la cuenta del Tesoro público."
  - id: c
    correct: true
    text:
      es: "En la fecha en que haya tenido entrada el importe en la entidad que preste el servicio de caja."
  - id: d
    text:
      es: "En la fecha en que el órgano de recaudación reciba la justificación de la transferencia por escrito."
  explanation:
    es: "La transferencia se entiende pagada cuando el importe entra en la entidad que presta el servicio de caja (artículo 37). La fecha de la orden del obligado es anterior y no fija el pago. La llegada a la cuenta del Tesoro es posterior. La recepción de la justificación por el órgano no es el momento que señala el precepto."
  citation: "art. 37 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "transferencia"
# anchor: boe-a-2005-14803-art-37
- id: m03-l09-q0035
  prompt:
    es: "¿En qué fecha se considera efectuado un pago por transferencia ordenada el lunes 15 de marzo de 2027, cuyo importe tiene entrada en la entidad que presta el servicio de caja el miércoles 17 de marzo de 2027, según el artículo 37 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El lunes 15 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles 17 de marzo de 2027."
  - id: c
    text:
      es: "El martes 16 de marzo de 2027, día siguiente a la fecha de la orden."
  - id: d
    text:
      es: "El jueves 18 de marzo de 2027."
  explanation:
    es: "El pago se considera efectuado cuando el importe tiene entrada en la entidad que presta el servicio de caja (artículo 37): el 17 de marzo. El 15 es la fecha de la orden, que no fija el pago. Los días 16 y 18 no corresponden a ningún hecho que el artículo señale."
  citation: "art. 37 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "transferencia"
  - "cómputo"
# anchor: boe-a-2005-14803-art-38
- id: m03-l09-q0037
  prompt:
    es: "Sobre la domiciliación del pago en una cuenta que no es de titularidad del obligado, conforme al artículo 38.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Es posible siempre, porque basta con que el obligado comunique su orden de domiciliación a la Administración."
  - id: b
    text:
      es: "Es imposible, porque la cuenta debe ser en todo caso de titularidad del obligado al pago."
  - id: c
    text:
      es: "Es posible solo si el titular de la cuenta es cónyuge o representante legal del obligado ante la Administración."
  - id: d
    correct: true
    text:
      es: "Es posible en los términos que cada Administración establezca, siempre que el titular de la cuenta autorice la domiciliación."
  explanation:
    es: "El pago puede domiciliarse en una cuenta de otro titular si el titular lo autoriza y en los términos que cada Administración establezca (artículo 38.1.a). La sola comunicación del obligado no basta sin esa autorización. Afirmar que nunca cabe contradice el segundo párrafo del apartado. El precepto no limita la autorización a cónyuges ni a representantes."
  citation: "art. 38.1.a RGR"
  difficulty: 2
  tags:
  - "pago"
  - "domiciliación"
# anchor: boe-a-2005-14803-art-38
- id: m03-l09-q0038
  prompt:
    es: "¿En qué fecha se entiende realizado el pago de una autoliquidación domiciliada con orden dada el 28 de junio de 2027 y cargo en cuenta el jueves 1 de julio de 2027, según el artículo 38.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El lunes 28 de junio de 2027, fecha de la orden de domiciliación."
  - id: b
    correct: true
    text:
      es: "El jueves 1 de julio de 2027, fecha de cargo en cuenta."
  - id: c
    text:
      es: "El viernes 2 de julio de 2027, día siguiente al cargo en cuenta."
  - id: d
    text:
      es: "La fecha en que la Administración recibe la relación de cargos de la entidad."
  explanation:
    es: "Los pagos domiciliados se entienden realizados en la fecha de cargo en cuenta (artículo 38.2): el 1 de julio. La orden del 28 de junio solo es la comunicación previa. El día siguiente al cargo no es fecha del precepto. La fecha en que la Administración recibe la relación de cargos no se toma como momento del pago."
  citation: "art. 38.2 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "domiciliación"
  - "cómputo"
# anchor: boe-a-2005-14803-art-38
- id: m03-l09-q0039
  prompt:
    es: "De acuerdo con el artículo 38.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando el cargo en cuenta de una domiciliación no se realice o se realice fuera de plazo por causa no imputable al obligado al pago:"
  options:
  - id: a
    text:
      es: "Se le exigirán intereses de demora, pero no recargos ni sanciones."
  - id: b
    text:
      es: "Se le exigirán los recargos, pero no los intereses de demora ni las sanciones."
  - id: c
    correct: true
    text:
      es: "No se le exigirán recargos, intereses de demora ni sanciones."
  - id: d
    text:
      es: "Se le exigirán los recargos, los intereses de demora y las sanciones que procedan."
  explanation:
    es: "Si la entidad no carga o carga tarde por una causa no imputable al obligado, no se le exigen recargos, intereses de demora ni sanciones (artículo 38.3). Mantener alguno de los tres conceptos, o los tres, contradice el texto. Los intereses que corresponda se liquidan, en su caso, a la entidad responsable."
  citation: "art. 38.3 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "domiciliación"
# anchor: boe-a-2005-14803-art-38
- id: m03-l09-q0040
  prompt:
    es: "¿Qué puede exigirse al obligado si una domiciliación se carga el 30 de junio de 2027 y no el 20 de junio de 2027 por un fallo de la entidad de crédito, sin culpa del obligado, conforme al artículo 38.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Ni recargos, ni intereses de demora, ni sanciones, porque el retraso no le es imputable."
  - id: b
    text:
      es: "Los intereses de demora de diez días, porque el pago se hizo fuera de plazo."
  - id: c
    text:
      es: "El recargo por declaración extemporánea, porque el ingreso se produjo tras el vencimiento."
  - id: d
    text:
      es: "Una sanción reducida, porque la entidad de crédito actuó en su nombre."
  explanation:
    es: "Cuando el cargo se realiza fuera de plazo por causa no imputable al obligado no se le exigen recargos, intereses de demora ni sanciones (artículo 38.3). No hay intereses por los diez días de retraso. El recargo por declaración extemporánea no se refiere a un pago domiciliado y tardío. No cabe sanción, ni siquiera reducida, aunque la entidad actuase por cuenta del obligado."
  citation: "art. 38.3 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "domiciliación"
# anchor: boe-a-2005-14803-art-39
- id: m03-l09-q0041
  prompt:
    es: "¿Cuál de los siguientes tiene la condición de efecto timbrado según el artículo 39.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Los sellos de correos de franqueo ordinario."
  - id: b
    text:
      es: "El justificante de ingreso validado por una entidad de crédito."
  - id: c
    text:
      es: "El resguardo de depósito en la Caja General de Depósitos."
  - id: d
    correct: true
    text:
      es: "Los timbres móviles."
  explanation:
    es: "Los timbres móviles figuran entre los efectos timbrados del artículo 39.1, junto con el papel timbrado común, el papel timbrado de pagos al Estado, los documentos timbrados especiales y los aprobados por orden ministerial. Los sellos de correos no están en la lista. El justificante validado y el resguardo de depósito acreditan un pago o una consignación, no son efectos timbrados."
  citation: "art. 39.1 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "efectos timbrados"
# anchor: boe-a-2005-14803-art-39
- id: m03-l09-q0042
  prompt:
    es: "De acuerdo con el artículo 39.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre los efectos timbrados:"
  options:
  - id: a
    text:
      es: "El papel timbrado común es efecto timbrado, pero el papel timbrado de pagos al Estado no lo es."
  - id: b
    text:
      es: "Los timbres móviles no son efectos timbrados, salvo que se aprueben por ley."
  - id: c
    correct: true
    text:
      es: "El papel timbrado común y el papel timbrado de pagos al Estado tienen la condición de efectos timbrados."
  - id: d
    text:
      es: "Solo son efectos timbrados los documentos timbrados especiales."
  explanation:
    es: "El artículo 39.1 incluye entre los efectos timbrados el papel timbrado común y el de pagos al Estado. Excluir uno de ellos no concuerda con la lista. Los timbres móviles sí figuran en la lista, de modo que no hace falta aprobarlos por ley. La lista no se limita a los documentos timbrados especiales."
  citation: "art. 39.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "efectos timbrados"
# anchor: boe-a-2003-23186-art-61
- id: m03-l09-q0043
  prompt:
    es: "Conforme al artículo 61.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se entiende pagada en efectivo una deuda tributaria cuando se haya realizado el ingreso de su importe:"
  options:
  - id: a
    text:
      es: "En la cuenta del Tesoro público, una vez que la entidad de crédito lo haya transferido."
  - id: b
    correct: true
    text:
      es: "En las cajas de los órganos competentes, oficinas recaudadoras o entidades autorizadas para su admisión."
  - id: c
    text:
      es: "En cualquier entidad de crédito, aunque no esté autorizada para admitir el pago."
  - id: d
    text:
      es: "En la caja de cualquier órgano de la Administración tributaria, aunque no sea competente."
  explanation:
    es: "La deuda se entiende pagada en efectivo cuando el ingreso se hace en las cajas de los órganos competentes, oficinas recaudadoras o entidades autorizadas (artículo 61.1). No hace falta esperar a que la entidad transfiera al Tesoro. El ingreso en una entidad no autorizada, o en un órgano no competente, no cumple el requisito."
  citation: "art. 61.1 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "momento del pago"
# anchor: boe-a-2003-23186-art-61
- id: m03-l09-q0044
  prompt:
    es: "De acuerdo con el artículo 61.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en caso de empleo de efectos timbrados se entenderá pagada la deuda tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando aquellos se utilicen en la forma que reglamentariamente se determine."
  - id: b
    text:
      es: "Cuando aquellos se adquieran en una expendeduría autorizada."
  - id: c
    text:
      es: "Cuando aquellos se presenten en la oficina gestora competente."
  - id: d
    text:
      es: "Cuando aquellos se inutilicen por la Fábrica Nacional de Moneda y Timbre al emplearse."
  explanation:
    es: "Con efectos timbrados la deuda se entiende pagada cuando se utilizan en la forma que el reglamento determine (artículo 61.2). Comprarlos en una expendeduría no paga la deuda. Tampoco basta presentarlos en la oficina ni su inutilización por el organismo que los fabrica."
  citation: "art. 61.2 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "momento del pago"
  - "efectos timbrados"
# anchor: boe-a-2003-23186-art-61
- id: m03-l09-q0045
  prompt:
    es: "Según el artículo 61.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el pago en especie extinguirá la deuda tributaria:"
  options:
  - id: a
    text:
      es: "En el momento en que la Administración acepte los bienes ofrecidos."
  - id: b
    text:
      es: "En el momento en que se valoren los bienes por perito independiente."
  - id: c
    correct: true
    text:
      es: "En el momento señalado en las normas que lo regulen."
  - id: d
    text:
      es: "En el momento en que el obligado entregue los bienes sin condición alguna."
  explanation:
    es: "El pago en especie extingue la deuda en el momento que señalen las normas que lo regulan (artículo 61.3). La aceptación de los bienes, su valoración pericial o la entrega sin condiciones no son los momentos que fija el artículo."
  citation: "art. 61.3 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "momento del pago"
  - "pago en especie"
# anchor: boe-a-2005-14803-art-34
- id: m03-l09-q0046
  prompt:
    es: "De acuerdo con el artículo 34.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando el pago se realice a través de entidades de crédito u otras personas autorizadas, la entrega al deudor del justificante de ingreso lo libera:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde la fecha que se consigne en el justificante y por el importe que figure en él."
  - id: b
    text:
      es: "Desde la fecha en que la entidad ingrese el importe en la cuenta del Tesoro."
  - id: c
    text:
      es: "Desde la fecha en que el deudor presente el justificante ante el órgano de recaudación."
  - id: d
    text:
      es: "Desde la fecha de la orden de pago que el deudor dio a la entidad de crédito."
  explanation:
    es: "El justificante libera al deudor desde la fecha que consta en él y por el importe que figure (artículo 34.4). La liberación no espera al ingreso de la entidad en el Tesoro. Tampoco a que el deudor presente el justificante. La fecha de la orden de pago no es la que cuenta, porque las órdenes no surten por sí solas efecto frente a la Hacienda pública."
  citation: "art. 34.4 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "momento del pago"
# anchor: boe-a-2005-14803-art-34
- id: m03-l09-q0047
  prompt:
    es: "Un obligado paga en una entidad de crédito autorizada, que le entrega el viernes 26 de febrero de 2027 un justificante de ingreso por 1.500 euros. La entidad ingresa lo recaudado en el Tesoro el 12 de marzo de 2027. Conforme al artículo 34.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿desde cuándo y por qué importe queda liberado el obligado?"
  options:
  - id: a
    text:
      es: "Desde el 12 de marzo de 2027 y por 1.500 euros, la fecha en que el Tesoro recibe el ingreso."
  - id: b
    text:
      es: "Desde el 26 de febrero de 2027, pero por el importe que luego compruebe la Administración."
  - id: c
    text:
      es: "Desde el 12 de marzo de 2027 y por el importe que el obligado acredite ante el órgano."
  - id: d
    correct: true
    text:
      es: "Desde el 26 de febrero de 2027 y por 1.500 euros, la fecha y el importe del justificante."
  explanation:
    es: "El justificante libera desde la fecha que consta en él y por su importe (artículo 34.4): el 26 de febrero y 1.500 euros. La fecha del ingreso en el Tesoro es posterior y no retrasa la liberación. El importe del justificante tampoco queda a una comprobación posterior, salvo prueba fehaciente de inexactitud que aquí no se da."
  citation: "art. 34.4 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "momento del pago"
  - "cómputo"
# anchor: boe-a-2005-14803-art-34
- id: m03-l09-q0048
  prompt:
    es: "Según el artículo 34.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las órdenes de pago dadas por el deudor a las entidades de crédito u otras personas autorizadas para recibir el pago:"
  options:
  - id: a
    text:
      es: "Surtirán efectos frente a la Hacienda pública desde la fecha de la orden."
  - id: b
    correct: true
    text:
      es: "No surtirán por sí solas efectos frente a la Hacienda pública."
  - id: c
    text:
      es: "Surtirán efectos frente a la Hacienda pública si la entidad las acepta por escrito."
  - id: d
    text:
      es: "No surtirán efectos, y el deudor perderá las acciones contra la entidad incumplidora."
  explanation:
    es: "Las órdenes de pago no producen por sí solas efectos frente a la Hacienda pública (artículo 34.5). Darles efecto desde la fecha de la orden, o condicionarlo a la aceptación escrita de la entidad, se aparta del texto. El deudor conserva las acciones contra la entidad o persona que incumpla."
  citation: "art. 34.5 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "momento del pago"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0049
  prompt:
    es: "Según el artículo 62.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias resultantes de una autoliquidación deberán pagarse:"
  options:
  - id: a
    text:
      es: "Entre los días uno y 15 de cada mes, hasta el día 20 del mes posterior."
  - id: b
    text:
      es: "Entre el día uno de septiembre y el 20 de noviembre de cada año."
  - id: c
    text:
      es: "En el momento de la presentación, con independencia de lo que diga cada tributo."
  - id: d
    correct: true
    text:
      es: "En los plazos que establezca la normativa de cada tributo."
  explanation:
    es: "Las autoliquidaciones se pagan en los plazos de la normativa de cada tributo (artículo 62.1). El plazo del día 20 del mes posterior es el de las liquidaciones notificadas entre los días uno y 15. El de septiembre a noviembre es el de las deudas de notificación colectiva y periódica. El pago en el momento de la presentación no es la regla general: cada tributo fija su plazo."
  citation: "art. 62.1 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "plazos de pago"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0050
  prompt:
    es: "Hugo Navarro recibe el miércoles 10 de febrero de 2027 la notificación de una liquidación practicada por la Administración. Sin festivos, y sabiendo que el 20 de marzo de 2027 es sábado, ¿hasta qué fecha puede pagar en período voluntario conforme al artículo 62.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Hasta el sábado 20 de marzo de 2027, día 20 del mes posterior."
  - id: b
    text:
      es: "Hasta el lunes 5 de abril de 2027, día cinco del segundo mes posterior."
  - id: c
    correct: true
    text:
      es: "Hasta el lunes 22 de marzo de 2027, primer día hábil siguiente al día 20."
  - id: d
    text:
      es: "Hasta el viernes 19 de marzo de 2027, inmediato hábil anterior al día 20."
  explanation:
    es: "La notificación entre los días uno y 15 abre el plazo hasta el día 20 del mes posterior o, si no es hábil, hasta el inmediato hábil siguiente (artículo 62.2.a). El 20 de marzo es sábado y el plazo llega al lunes 22. El sábado 20 no es hábil. El 5 de abril es la regla de las notificaciones entre los días 16 y último. El hábil anterior no es el que manda el artículo, sino el siguiente."
  citation: "art. 62.2 LGT"
  difficulty: 3
  tags:
  - "pago"
  - "plazos de pago"
  - "cómputo"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0051
  prompt:
    es: "Sofía Cano recibe el miércoles 17 de febrero de 2027 la notificación de una liquidación practicada por la Administración. Si el 5 de abril de 2027 es lunes y hábil, ¿hasta qué fecha puede pagar en período voluntario según el artículo 62.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes 5 de abril de 2027, día cinco del segundo mes posterior."
  - id: b
    text:
      es: "Hasta el sábado 20 de marzo de 2027, día 20 del mes posterior."
  - id: c
    text:
