# anchor: boe-a-2017-12902-art-243
- id: q27
  lesson: m03-l04
  prompt:
    es: "Según el artículo 243.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué plazo de garantía debe establecer el pliego de las obras del centro de visitantes, que el OAPN recibe sin reservas?"
  options:
  - id: a
    text:
      es: "No inferior a dos años, sin excepciones, que fija el director facultativo de las obras."
  - id: b
    text:
      es: "Quince años desde la recepción, el mismo en que responde por los vicios ocultos."
  - id: c
    correct: true
    text:
      es: "No inferior a un año, salvo casos especiales, según la naturaleza y complejidad de la obra."
  - id: d
    text:
      es: "Tres meses desde la recepción, el mismo en que se aprueba la certificación final."
  explanation:
    es: "El pliego establece el plazo de garantía de las obras atendiendo a su naturaleza y complejidad, y no puede ser inferior a un año salvo casos especiales (art. 243.3 LCSP). Rige para las obras del centro de visitantes, cuya recepción sin reservas abre ese plazo (art. 243.2 LCSP). La opción de dos años sin excepciones añade un mínimo que la ley no impone y lo deja al director facultativo, que no lo fija. Los quince años son el plazo de responsabilidad por vicios ocultos una vez expirada la garantía (art. 244.1 LCSP), no el plazo de garantía. Los tres meses son el plazo para aprobar la certificación final de las obras (art. 243.1 LCSP)."
  citation: "art. 243.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-53
- id: q26
  lesson: m03-l04
  prompt:
    es: "Según el artículo 53 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si un licitador interpone recurso especial contra el acuerdo con el que el OAPN adjudica las obras del centro de visitantes, ¿qué efecto produce sobre la tramitación?"
  options:
  - id: a
    text:
      es: "El OAPN puede formalizar el contrato, salvo que el Tribunal adopte medidas cautelares."
  - id: b
    correct: true
    text:
      es: "Queda en suspenso la tramitación del procedimiento hasta que se resuelva el recurso especial."
  - id: c
    text:
      es: "Suspende la tramitación solo si el recurrente presta garantía por los perjuicios de la demora."
  - id: d
    text:
      es: "Suspende la tramitación únicamente si así lo acuerda el Tribunal que resuelve el recurso."
  explanation:
    es: "Las obras superan los tres millones de euros de valor estimado, así que su adjudicación admite recurso especial (art. 44.1.a LCSP). Una vez interpuesto el recurso contra la adjudicación, queda en suspenso la tramitación del procedimiento, salvo en los contratos basados en un acuerdo marco o en los específicos de un sistema dinámico de adquisición (art. 53 LCSP). El contrato de las obras no es ninguno de esos dos, así que la suspensión rige. La opción que deja al OAPN formalizar el contrato mientras se resuelve confunde la suspensión con unas medidas cautelares que no son necesarias. La que exige una garantía del recurrente al estilo de la suspensión judicial no figura en el artículo. La que la condiciona a un acuerdo del Tribunal añade un requisito que el artículo no pide."
  citation: "art. 53 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-58
- id: q13
  lesson: m05-l02
  prompt:
    es: "En el presupuesto de un organismo autónomo como el OAPN, las incorporaciones de crédito, como la del remanente de las obras al presupuesto de 2028, únicamente pueden realizarse con cargo a:"
  options:
  - id: a
    text:
      es: "Una baja en el Fondo de Contingencia de ejecución presupuestaria o en otros créditos de operaciones no financieras."
  - id: b
    text:
      es: "Los mayores ingresos sobre los previstos inicialmente en el presupuesto de gastos del propio organismo autónomo."
  - id: c
    text:
      es: "Una baja en otros créditos de operaciones no financieras del presupuesto del propio organismo autónomo."
  - id: d
    correct: true
    text:
      es: "La parte del remanente de tesorería no aplicada al presupuesto del organismo al fin del ejercicio anterior."
  explanation:
    es: "En los organismos autónomos, las incorporaciones solo pueden hacerse con cargo a la parte del remanente de tesorería que al fin del ejercicio anterior no se aplicó al presupuesto del organismo. La opción del Fondo de Contingencia o la baja en otros créditos es la financiación de las incorporaciones del presupuesto del Estado. La de los mayores ingresos es una de las fuentes del suplemento de crédito del organismo. La de la baja en otros créditos de su presupuesto es una fuente de las ampliaciones, no de las incorporaciones."
  citation: "art. 58 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2019-7414-art-1
- id: q14
  lesson: m04-l08
  prompt:
    es: "¿Se aplica el IV Convenio colectivo único para el personal laboral de la Administración General del Estado a las guías de uso público que el OAPN emplea como personal fijo discontinuo?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque el Convenio se aplica al personal laboral de la Administración General del Estado y sus organismos autónomos."
  - id: b
    text:
      es: "No, porque el Convenio solo se aplica al personal laboral de los departamentos ministeriales de la Administración General del Estado."
  - id: c
    text:
      es: "No, porque el personal laboral fijo discontinuo está excluido del ámbito de aplicación del Convenio por su modalidad de contrato."
  - id: d
    text:
      es: "Solo si lo acuerda la Comisión Paritaria, porque el ámbito del Convenio no alcanza a los organismos autónomos del Estado."
  explanation:
    es: "El Convenio se aplica al personal laboral de la Administración General del Estado y de sus organismos autónomos. El OAPN es un organismo autónomo, y el artículo 2 no excluye al personal fijo discontinuo. La opción de los departamentos ministeriales recorta el ámbito y deja fuera a los organismos autónomos. La de la exclusión del personal fijo discontinuo inventa una causa que el artículo 2 no recoge. La del acuerdo de la Comisión Paritaria niega que el ámbito alcance a los organismos autónomos, y lo alcanza."
  citation: "art. 1.1 Convenio único"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-2019-7414-art-73
- id: q15
  lesson: m04-l08
  prompt:
    es: "¿Cuántos días hábiles de vacaciones le corresponden en 2027 a Doña Lidia Carrasco Bermejo según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "22 días hábiles, los de un año completo de servicios prestados."
  - id: b
    text:
      es: "6 días hábiles, un día por cada mes completo de servicio."
  - id: c
    correct: true
    text:
      es: "11 días hábiles, la parte proporcional a seis meses de servicio."
  - id: d
    text:
      es: "13 días hábiles, la parte proporcional a siete meses de servicio."
  explanation:
    es: "Las vacaciones son de veintidós días hábiles por año completo de servicios, o los que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor. Doña Lidia sirve seis meses, del jueves, 1 de julio, al viernes, 31 de diciembre de 2027: 22 × 6 ÷ 12 = 11 días hábiles. La opción de 22 días da el año completo. La de 6 días cuenta un día por mes. La de 13 días cuenta siete meses de servicio."
  citation: "art. 73.1 Convenio único"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2015-11719-art-89
- id: q16
  lesson: m04-l04
  prompt:
    es: "Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué reserva tiene Doña Marta Olmedo Sanz al pedir reingresar el miércoles, 1 de septiembre de 2027?"
  options:
  - id: a
    text:
      es: "Su mismo puesto, que se reserva durante los tres años que dura como máximo la excedencia."
  - id: b
    correct: true
    text:
      es: "Un puesto en la misma localidad y de igual retribución, porque ya pasaron los dos años de reserva."
  - id: c
    text:
      es: "Ninguna reserva, porque pasados dos años solo conserva la expectativa de reingresar por concurso."
  - id: d
    text:
      es: "Un puesto de su cuerpo en la misma provincia, con la retribución básica del grupo al que pertenece."
  explanation:
    es: "En la excedencia por cuidado de familiares el puesto se reserva al menos dos años, y después la reserva es a un puesto en la misma localidad y de igual retribución. Desde el lunes, 3 de marzo de 2025, han pasado dos años y medio, así que ya no se reserva el suyo. La opción de los tres años atribuye a la reserva el plazo máximo de la excedencia. La de ninguna reserva niega el derecho que el artículo reconoce. La del puesto en la provincia con la retribución básica cambia la localidad y la retribución."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: q17
  lesson: m04-l05
  prompt:
    es: "¿Qué reducción de jornada puede solicitar Don Julián Peñalver Ordóñez para cuidar de su padre, y por cuánto tiempo como máximo, según el artículo 48.i) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre?"
  options:
  - id: a
    text:
      es: "Hasta el cincuenta por ciento de la jornada, con carácter retribuido, durante tres meses como máximo."
  - id: b
    text:
      es: "Hasta un tercio de la jornada, con carácter retribuido, durante un año como máximo."
  - id: c
    text:
      es: "Hasta el cincuenta por ciento de la jornada, con disminución proporcional de retribuciones, durante un mes."
  - id: d
    correct: true
    text:
      es: "Hasta el cincuenta por ciento de la jornada, con carácter retribuido, durante un mes como máximo."
  explanation:
    es: "Para atender el cuidado de un familiar de primer grado por enfermedad muy grave, el funcionario puede solicitar una reducción de hasta el cincuenta por ciento de la jornada, retribuida, por un mes como máximo. La opción de los tres meses alarga el plazo máximo. La del tercio de la jornada durante un año cambia el porcentaje y el plazo. La de la disminución proporcional de retribuciones aplica la reducción de guarda legal, que sí rebaja el sueldo."
  citation: "art. 48.i) TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-1995-8729-art-56
- id: q23
  lesson: m04-l05
  prompt:
    es: "Si el plazo de presentación de solicitudes de la convocatoria por libre designación de la Jefatura del Área de Uso Público terminó el lunes, 5 de julio de 2027, ¿hasta qué fecha puede nombrarse al titular con la prórroga del artículo 56.1 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    correct: true
    text:
      es: "Lunes, 6 de septiembre de 2027."
  - id: b
    text:
      es: "Jueves, 5 de agosto de 2027."
  - id: c
    text:
      es: "Domingo, 5 de septiembre de 2027."
  - id: d
    text:
      es: "Martes, 17 de agosto de 2027."
  explanation:
    es: "El nombramiento se hace en el plazo máximo de un mes desde la finalización del de presentación de solicitudes, y ese plazo puede prorrogarse hasta un mes más. Desde el lunes, 5 de julio de 2027, un mes llega al jueves, 5 de agosto, y la prórroga, al domingo, 5 de septiembre. Como es inhábil, pasa al lunes, 6 de septiembre de 2027 (art. 30.5 LPAC). La fecha del jueves, 5 de agosto de 2027, no suma la prórroga. La del domingo, 5 de septiembre de 2027, no pasa al día hábil. La del martes, 17 de agosto de 2027, cuenta los dos meses desde la publicación de la convocatoria: acaban el sábado, 14 de agosto, y pasan al martes, 17, porque el lunes, 16 de agosto, es festivo en Madrid."
  citation: "art. 56.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2002-10337-art-12
- id: q24
  lesson: m05-l04
  prompt:
    es: "Si Doña Carolina Ibáñez Rubio prolongara su comisión hasta el jueves, 18 de noviembre de 2027, con regreso a las 17:00, y su manutención diaria fuera de 37,40 euros, ¿qué manutención devengaría según el artículo 12.3 del Real Decreto 462/2002, de 24 de mayo?"
  options:
  - id: a
    correct: true
    text:
      es: "56,10 euros: manutención entera el día de salida y la mitad el de regreso."
  - id: b
    text:
      es: "74,80 euros: manutención entera tanto el día de salida como el de regreso."
  - id: c
    text:
      es: "37,40 euros: solo la manutención del día de salida, sin nada el de regreso."
  - id: d
    text:
      es: "93,50 euros: las dos jornadas enteras y la mitad más por la cena de regreso."
  explanation:
    es: "Una comisión que dura más de veinticuatro horas cuenta aquí desde las 8:30 del miércoles hasta las 17:00 del jueves, 32 horas y media. El día de salida, si la hora fijada para iniciar la comisión es anterior a las catorce horas, se percibe el 100 por 100 de la manutención: 37,40 euros. El día de regreso, si la comisión concluye después de las catorce horas, se percibe el 50 por 100: 18,70 euros. El total es de 56,10 euros. La cifra de 74,80 euros paga entero el día de regreso. La de 37,40 euros no paga nada ese día. La de 93,50 euros suma el 50 por 100 de la cena, que solo corresponde si el regreso es posterior a las veintidós horas."
  citation: "art. 12.3 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2023-16462-art-1
- id: q20
  lesson: m05-l04
  prompt:
    es: "¿Qué indemnización por uso de vehículo particular corresponde a Don Cosme Aldea Ferrer por su viaje a Madrid, según la Orden HFP/793/2023, de 12 de julio, que revisa el importe fijado en el Real Decreto 462/2002, de 24 de mayo?"
  options:
  - id: a
    text:
      es: "44,20 euros: 170 kilómetros a 0,26 euros por kilómetro de automóvil."
  - id: b
    correct: true
    text:
      es: "18,02 euros: 170 kilómetros a 0,106 euros por kilómetro de motocicleta."
  - id: c
    text:
      es: "9,01 euros: 85 kilómetros a 0,106 euros por kilómetro de motocicleta."
  - id: d
    text:
      es: "22,10 euros: 85 kilómetros a 0,26 euros por kilómetro de automóvil."
  explanation:
    es: "La indemnización por uso de vehículo particular es de 0,106 euros por kilómetro en motocicleta y de 0,26 en automóvil. Don Cosme usa su motocicleta y recorre 170 kilómetros entre ida y vuelta: 170 × 0,106 = 18,02 euros. La cifra de 44,20 euros aplica la tarifa del automóvil. La de 9,01 euros cuenta solo la mitad del recorrido con la tarifa de la motocicleta. La de 22,10 euros combina la mitad del recorrido con la tarifa del automóvil."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
