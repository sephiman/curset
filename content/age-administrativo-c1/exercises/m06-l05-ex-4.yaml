    text:
      es: "1"
  - id: c
    text:
      es: "1900"
  - id: d
    text:
      es: "365"
  explanation:
    es: "La página dice que, de manera predeterminada, el 1 de enero de 1900 es el número de serie 1. Los demás valores no son el número de serie de esa fecha."
