# anchor: boe-a-2015-10565-art-81
- id: m01-l11-q366
  prompt:
    es: "Señale quién emite el informe preceptivo en la responsabilidad patrimonial por funcionamiento anormal de la Administración de Justicia, según el artículo 81.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo, a través de su Sala de Gobierno."
  - id: b
    text:
      es: "El Ministerio Fiscal."
  - id: c
    text:
      es: "El Defensor del Pueblo."
  - id: d
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 81.3 exige el informe del Consejo General del Poder Judicial en esas reclamaciones, que se evacúa en dos meses. El Tribunal Supremo, el Ministerio Fiscal y el Defensor del Pueblo no emiten ese informe preceptivo."
  citation: "art. 81.3 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-115
- id: m01-l11-q367
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el error o la ausencia de calificación del recurso no será obstáculo para su tramitación, siempre que:"
  options:
  - id: a
    text:
      es: "El recurrente lo subsane en el plazo de diez días."
  - id: b
    text:
      es: "Se haya presentado dentro del plazo de un mes."
  - id: c
    correct: true
    text:
      es: "Se deduzca su verdadero carácter."
  - id: d
    text:
      es: "El órgano lo requiera."
  explanation:
    es: "El artículo 115.2 admite tramitar el recurso mal calificado o sin calificar si de él se deduce su verdadero carácter. No exige subsanación en diez días, ni que se presente en un mes, ni un requerimiento del órgano."
  citation: "art. 115.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-118
- id: m01-l11-q368
  prompt:
    es: "Señale el plazo para alegar sobre nuevos hechos o documentos al resolver un recurso, según el artículo 118.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "No inferior a cinco días ni superior a diez."
  - id: b
    text:
      es: "No inferior a quince días ni superior a veinte."
  - id: c
    correct: true
    text:
      es: "No inferior a diez días ni superior a quince."
  - id: d
    text:
      es: "No inferior a veinte días ni superior a treinta."
  explanation:
    es: "El artículo 118.1 da a los interesados un plazo no inferior a diez días ni superior a quince para alegar y presentar documentos sobre los nuevos hechos o documentos. Las horquillas de cinco a diez días, de quince a veinte y de veinte a treinta no son la que fija este apartado."
  citation: "art. 118.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-126
- id: m01-l11-q369
  prompt:
    es: "Conforme al artículo 126.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, transcurrido el plazo de tres meses desde la interposición del recurso extraordinario de revisión sin resolución, este se entenderá:"
  options:
  - id: a
    correct: true
    text:
      es: "Desestimado."
  - id: b
    text:
      es: "Estimado."
  - id: c
    text:
      es: "Caducado."
  - id: d
    text:
      es: "Inadmitido a trámite."
  explanation:
    es: "El artículo 126.3 da efecto desestimatorio al silencio en el recurso extraordinario de revisión, y queda expedita la vía contencioso-administrativa. El silencio no lo estima, no lo declara caducado ni lo inadmite a trámite."
  citation: "art. 126.3 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-106
- id: m01-l11-q370
  prompt:
    es: "Señale de qué pueden declarar de oficio la nulidad en cualquier momento las Administraciones, previo dictamen del Consejo de Estado, según el artículo 106.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Los actos de trámite que produzcan indefensión."
  - id: b
    correct: true
    text:
      es: "Las disposiciones administrativas, en los supuestos del artículo 47.2."
  - id: c
    text:
      es: "Los actos anulables por desviación de poder."
  - id: d
    text:
      es: "Las resoluciones judiciales firmes."
  explanation:
    es: "El artículo 106.2 permite declarar de oficio, previo dictamen favorable, la nulidad de las disposiciones administrativas en los supuestos del artículo 47.2. Los actos de trámite con indefensión y los actos anulables no son objeto de ese apartado, y las resoluciones judiciales no son actos de la Administración."
  citation: "art. 106.2 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q371
  prompt:
    es: "¿Cuál de las siguientes informaciones debe publicar la Administración en la sede electrónica al ampliar plazos por una incidencia técnica, según el artículo 32.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El acuerdo de ampliación, en el Boletín Oficial del Estado."
  - id: b
    correct: true
    text:
      es: "La incidencia técnica acontecida y la ampliación concreta del plazo no vencido."
  - id: c
    text:
      es: "La relación de interesados afectados y el plazo de cada uno."
  - id: d
    text:
      es: "El informe técnico del órgano responsable del sistema."
  explanation:
    es: "El artículo 32.4 obliga a publicar en la sede electrónica la incidencia técnica y la ampliación concreta del plazo no vencido. No exige publicar el acuerdo en el Boletín Oficial del Estado, ni una relación de afectados con su plazo, ni un informe técnico."
  citation: "art. 32.4 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-22
- id: m01-l11-q373
  prompt:
    es: "Según el artículo 22.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para resolver se suspende al requerir la subsanación de deficiencias, por el tiempo que medie entre:"
  options:
  - id: a
    text:
      es: "La presentación de la solicitud y la notificación del requerimiento."
  - id: b
    correct: true
    text:
      es: "La notificación del requerimiento y su efectivo cumplimiento por el destinatario."
  - id: c
    text:
      es: "La notificación del requerimiento y la propuesta de resolución."
  - id: d
    text:
      es: "La solicitud de informes y la recepción del último de ellos."
  explanation:
    es: "El artículo 22.1.a) suspende el plazo desde la notificación del requerimiento hasta su efectivo cumplimiento por el destinatario. No cuenta el tiempo anterior al requerimiento, ni llega hasta la propuesta de resolución, y la espera de informes es otra causa de suspensión, la de la letra d)."
  citation: "art. 22.1.a) LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-114
- id: m01-l11-q374
  prompt:
    es: "¿Cuál de las siguientes resoluciones pone fin a la vía administrativa, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los acuerdos de iniciación de los procedimientos de oficio."
  - id: b
    text:
      es: "Los acuerdos de ampliación de los plazos."
  - id: c
    text:
      es: "Las notificaciones de las resoluciones dictadas."
  - id: d
    correct: true
    text:
      es: "Las resoluciones de los recursos de alzada."
  explanation:
    es: "Según el artículo 114.1.a), las resoluciones de los recursos de alzada ponen fin a la vía administrativa. Los acuerdos de iniciación y de ampliación de plazos son actos de trámite, y la notificación solo da a conocer una resolución ya dictada: ninguno figura en el apartado."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-114
- id: m01-l11-q375
  prompt:
    es: "Conforme al artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ponen fin a la vía administrativa las resoluciones de los órganos administrativos que carezcan de superior jerárquico, salvo que:"
  options:
  - id: a
    text:
      es: "Lo disponga una orden."
  - id: b
    correct: true
    text:
      es: "Una Ley establezca lo contrario."
  - id: c
    text:
      es: "El interesado haya interpuesto recurso de reposición."
  - id: d
    text:
      es: "El órgano pertenezca a la Administración local."
  explanation:
    es: "El artículo 114.1.c) pone fin a la vía administrativa con las resoluciones de los órganos sin superior jerárquico, salvo que una Ley establezca lo contrario. Una orden ministerial no tiene rango para excepcionarlo, el recurso de reposición no cambia la regla y la ley no distingue por Administración."
  citation: "art. 114.1 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-114
- id: m01-l11-q376
  prompt:
    es: "¿Cuál de los siguientes pone fin a la vía administrativa, según el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los informes preceptivos emitidos por los órganos consultivos antes de la resolución."
  - id: b
    text:
      es: "Los requerimientos de subsanación de la solicitud."
  - id: c
    text:
      es: "Las propuestas de resolución del instructor."
  - id: d
    correct: true
    text:
      es: "Los convenios que tengan la consideración de finalizadores del procedimiento."
  explanation:
    es: "La letra d) del artículo 114.1 incluye los acuerdos, pactos, convenios o contratos que tengan la consideración de finalizadores del procedimiento. Los informes, los requerimientos de subsanación y las propuestas de resolución son actos de trámite."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-122
- id: m01-l11-q377
  prompt:
    es: "Conforme al artículo 122.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra la resolución de un recurso de alzada no cabrá ningún otro recurso administrativo, salvo:"
  options:
  - id: a
    correct: true
    text:
      es: "El recurso extraordinario de revisión."
  - id: b
    text:
      es: "El recurso potestativo de reposición."
  - id: c
    text:
      es: "Una nueva alzada ante el órgano superior."
  - id: d
    text:
      es: "La reclamación previa a la vía judicial."
  explanation:
    es: "El artículo 122.3 deja abierto solo el recurso extraordinario de revisión, en los casos del artículo 125.1. La reposición procede contra actos que ponen fin a la vía administrativa, no contra la resolución de alzada, y una nueva alzada o una reclamación previa tampoco están previstas."
  citation: "art. 122.3 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-42
- id: m01-l11-q378
  prompt:
    es: "Señale quién puede hacerse cargo de la notificación en papel si el interesado está ausente de su domicilio, según el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad."
  - id: b
    text:
      es: "Cualquier persona que se encuentre en el domicilio y sea pariente del interesado."
  - id: c
    text:
      es: "Cualquier persona que se encuentre en el domicilio y esté autorizada por escrito por el interesado."
  - id: d
    text:
      es: "Únicamente quien conviva con el interesado y pueda acreditar su identidad con un documento oficial."
  explanation:
    es: "El artículo 42.2 permite que reciba la notificación cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad. La ley no exige parentesco, ni una autorización escrita, ni convivencia con el interesado."
  citation: "art. 42.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q379
  prompt:
    es: "Conforme al artículo 23.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, quien se encuentre en un motivo de abstención se abstendrá de intervenir en el procedimiento y lo comunicará:"
  options:
  - id: a
    text:
      es: "Al interesado, que podrá promover la recusación."
  - id: b
    text:
      es: "Al órgano que tramita el procedimiento, que designará un suplente."
  - id: c
    correct: true
    text:
      es: "A su superior inmediato, quien resolverá lo procedente."
  - id: d
    text:
      es: "Al Consejo de Estado, que emitirá dictamen."
  explanation:
    es: "El artículo 23.1 manda abstenerse y comunicarlo al superior inmediato, que resuelve lo procedente. La comunicación al interesado y la recusación son vías distintas del artículo 24. Designar un suplente no es lo que prevé el artículo y el Consejo de Estado no interviene en la abstención."
  citation: "art. 23.1 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1980-8648-art-22
- id: m01-l11-q400
  prompt:
    es: "Conforme al artículo 22 de la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, la Comisión Permanente debe ser consultada sobre la revisión de oficio de:"
  options:
  - id: a
    text:
      es: "Únicamente las disposiciones administrativas de carácter general."
  - id: b
    correct: true
    text:
      es: "Disposiciones administrativas y actos administrativos, en los supuestos previstos por las leyes."
  - id: c
    text:
      es: "Únicamente los actos que hayan puesto fin a la vía administrativa."
  - id: d
    text:
      es: "Los actos y disposiciones de las Comunidades Autónomas, en todo caso."
  explanation:
    es: "El apartado diez del artículo 22 manda consultar a la Comisión Permanente sobre la revisión de oficio de disposiciones y actos administrativos, en los supuestos previstos por las leyes. No se limita a las disposiciones generales ni a los actos que agotan la vía administrativa, y las Comunidades Autónomas pueden tener su propio órgano consultivo."
  citation: "art. 22.10 LO 3/1980"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-99
- id: m01-l11-q405
  prompt:
    es: "¿Cuál de los siguientes trámites debe preceder a la ejecución forzosa de los actos administrativos por las Administraciones Públicas, conforme al artículo 99 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La declaración de lesividad del acto."
  - id: b
    text:
      es: "El dictamen favorable del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "El apercibimiento."
  - id: d
    text:
      es: "La audiencia."
  explanation:
    es: "El artículo 99 permite la ejecución forzosa previo apercibimiento. La declaración de lesividad es el paso para que la Administración impugne ante los tribunales un acto suyo favorable (artículo 107.1), el dictamen favorable del Consejo de Estado se exige para declarar la nulidad de oficio (artículo 106.1) y la audiencia se da a los interesados antes de la propuesta de resolución (artículo 82.1), no antes de ejecutar."
  citation: "art. 99 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-100
- id: m01-l11-q406
  prompt:
    es: "¿Cuál de las siguientes medidas es un medio de ejecución forzosa de los actos administrativos, conforme al artículo 100.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La revocación del acto."
  - id: b
    text:
      es: "La convalidación del acto."
  - id: c
    correct: true
    text:
      es: "La compulsión sobre las personas."
  - id: d
    text:
      es: "La declaración de lesividad del acto."
  explanation:
    es: "El artículo 100.1 enumera cuatro medios: apremio sobre el patrimonio, ejecución subsidiaria, multa coercitiva y compulsión sobre las personas. La revocación es la forma de retirar actos de gravamen o desfavorables (artículo 109.1), la convalidación subsana los vicios de un acto anulable (artículo 52.1) y la declaración de lesividad permite a la Administración impugnar un acto favorable (artículo 107.1); ninguna ejecuta forzosamente un acto."
  citation: "art. 100.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-100
- id: m01-l11-q407
  prompt:
    es: "Si fueran varios los medios de ejecución forzosa admisibles, ¿cuál de las siguientes reglas fija el artículo 100.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Se elegirá el menos gravoso para el patrimonio del obligado."
  - id: b
    correct: true
    text:
      es: "Se elegirá el menos restrictivo de la libertad individual."
  - id: c
    text:
      es: "Se elegirá el que suponga menor coste para la Administración."
  - id: d
    text:
      es: "Se elegirá el de ejecución más rápida."
  explanation:
    es: "El artículo 100.2 manda elegir el medio menos restrictivo de la libertad individual. No fija como criterio el menor gravamen para el patrimonio del obligado, el menor coste para la Administración ni la rapidez de la ejecución."
  citation: "art. 100.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q408
  prompt:
    es: "¿Cuál de las siguientes medidas puede acordar la Administración tras un ciberincidente que afecte gravemente a la tramitación, conforme al artículo 32.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La suspensión de los plazos de prescripción de las infracciones."
  - id: b
    text:
      es: "La reducción a la mitad de los plazos de los procedimientos."
  - id: c
    correct: true
    text:
      es: "La ampliación general de los plazos de los procedimientos."
  - id: d
    text:
      es: "La retroacción de las actuaciones."
  explanation:
    es: "El artículo 32.5 permite acordar la ampliación general de plazos de los procedimientos administrativos. No suspende los plazos de prescripción de las infracciones, que dependen de las leyes que las establecen (artículo 30 de la Ley 40/2015). Reducir los plazos a la mitad es el efecto de la tramitación de urgencia (artículo 33.1), y la retroacción de actuaciones no es una medida que el artículo prevea."
  citation: "art. 32.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
