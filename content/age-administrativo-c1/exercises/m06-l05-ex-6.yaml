    es: "En Excel 365, la celda A1 contiene =PROMEDI(B1:B3), con el nombre de la función mal escrito. ¿Cuál de los siguientes errores muestra?"
  options:
  - id: a
    text:
      es: "#N/A"
  - id: b
    text:
      es: "#¡VALOR!"
  - id: c
    text:
      es: "#¡REF!"
  - id: d
    correct: true
    text:
      es: "#¿NOMBRE?"
