# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q172
  prompt:
    es: "Conforme al artículo 54.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con qué fuente puede financiarse la ampliación de crédito de un organismo autónomo, pero no la del presupuesto del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Con mayores ingresos sobre los previstos inicialmente en su presupuesto."
  - id: b
    text:
      es: "Con cargo al Fondo de Contingencia de ejecución presupuestaria."
  - id: c
    text:
      es: "Con Deuda Pública emitida para financiar operaciones no financieras del organismo."
  - id: d
    text:
      es: "Con el importe de las transferencias de crédito recibidas de otros ministerios."
  explanation:
    es: "Para el Estado el artículo 54.3 prevé el Fondo de Contingencia o la baja en otros créditos del presupuesto no financiero. Los organismos autónomos añaden la parte del remanente de tesorería no aplicada y los mayores ingresos sobre los previstos inicialmente. El Fondo es fuente del Estado, y ni la Deuda Pública para operaciones no financieras ni las transferencias recibidas figuran como fuente."
  citation: "art. 54.3 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-50
- id: m05-l02-q173
  prompt:
    es: "¿Qué modificaciones excluye el artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria de la financiación con cargo al Fondo de Contingencia de ejecución presupuestaria?"
  options:
  - id: a
    text:
      es: "Las incorporaciones de crédito autorizadas por el Ministro de Hacienda."
  - id: b
    correct: true
    text:
      es: "Las de gastos derivados de decisiones discrecionales de la Administración que carezcan de cobertura presupuestaria."
  - id: c
    text:
      es: "Las ampliaciones de crédito que afecten a operaciones del presupuesto del Estado."
  - id: d
    text:
      es: "Los créditos extraordinarios y suplementos para obligaciones del ejercicio corriente."
  explanation:
    es: "El Fondo financia ampliaciones, créditos extraordinarios y suplementos e incorporaciones, y «en ningún caso» las modificaciones para gastos que deriven de decisiones discrecionales de la Administración sin cobertura presupuestaria (art. 50.1). Las otras tres figuras son precisamente las que el Fondo puede financiar cuando proceda."
  citation: "art. 50.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q176
  prompt:
    es: "Según el artículo 62.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la generación de crédito por enajenaciones de inmovilizado en el presupuesto de un organismo autónomo la autoriza:"
  options:
  - id: a
    text:
      es: "El Presidente o Director del organismo, sin posibilidad de avocación."
  - id: b
    text:
      es: "El titular del ministerio, previo informe favorable de la Intervención Delegada."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "El Ministro de Hacienda."
  explanation:
    es: "Las generaciones por enajenaciones de inmovilizado (art. 53.2.c) las autoriza el Ministro de Hacienda. El Presidente o Director ejerce solo las de ventas e ingresos afectados en su presupuesto y las que el artículo 63 da a los ministros, entre las que no están las enajenaciones. El titular del ministerio autoriza las de aportaciones, reembolsos y reintegros. El Consejo de Ministros no interviene."
  citation: "art. 62.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q177
  prompt:
    es: "¿Qué créditos tienen excepcionalmente la condición de ampliables según el artículo 54.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, además de los de obligaciones específicas derivadas de normas con rango de ley?"
  options:
  - id: a
    text:
      es: "Los destinados a las retribuciones básicas del personal funcionario del Estado."
  - id: b
    correct: true
    text:
      es: "Los destinados al pago de pensiones de Clases Pasivas del Estado."
  - id: c
    text:
      es: "Los destinados a subvenciones nominativas consignadas en el estado de gastos."
  - id: d
    text:
      es: "Los destinados a inversiones reales de carácter plurianual del ejercicio."
  explanation:
    es: "El artículo 54.1 declara ampliables, excepcionalmente, los créditos para pensiones de Clases Pasivas del Estado y los de obligaciones específicas derivadas de normas con rango de ley que se relacionen en el estado de gastos. Las retribuciones del personal, las subvenciones nominativas y las inversiones plurianuales no tienen esa condición por el artículo."
  citation: "art. 54.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q201
  prompt:
    es: "De acuerdo con el artículo 52.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las transferencias de crédito son:"
  options:
  - id: a
    correct: true
    text:
      es: "traspasos de dotaciones entre créditos, incluso con creación de créditos nuevos, con las restricciones del propio artículo."
  - id: b
    text:
      es: "modificaciones que incrementan los créditos como consecuencia de ingresos no previstos o superiores a los del presupuesto inicial."
  - id: c
    text:
      es: "incorporaciones al ejercicio de los remanentes de crédito del ejercicio anterior en los casos que la ley enumera."
  - id: d
    text:
      es: "créditos concedidos para gastos que no pueden demorarse cuando el crédito consignado no existe o es insuficiente."
  explanation:
    es: "El artículo 52.1 define la transferencia como traspaso de dotaciones entre créditos, también con creación de créditos nuevos y con las restricciones de sus cuatro letras. La opción de los ingresos no previstos describe la generación de crédito. La de los remanentes del ejercicio anterior describe la incorporación. La del gasto que no puede demorarse y carece de crédito adecuado describe el crédito extraordinario o el suplemento de crédito."
  citation: "art. 52.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q202
  prompt:
    es: "Según el artículo 52.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, no podrán realizarse transferencias:"
  options:
  - id: a
    text:
      es: "desde créditos para operaciones corrientes a créditos para operaciones de capital."
  - id: b
    correct: true
    text:
      es: "desde créditos para operaciones de capital a créditos para operaciones corrientes del presupuesto."
  - id: c
    text:
      es: "desde créditos para operaciones corrientes a créditos para operaciones financieras."
  - id: d
    text:
      es: "desde créditos para operaciones de capital a créditos para operaciones financieras."
  explanation:
    es: "La letra a) prohíbe dos recorridos: de operaciones financieras al resto, y de operaciones de capital a operaciones corrientes. Pasar crédito de corrientes a capital no está prohibido por esa letra. Tampoco lo está pasarlo de corrientes a financieras ni de capital a financieras: ninguno de los dos sale de los créditos financieros ni va de capital a corrientes."
  citation: "art. 52.1.a) LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q203
  prompt:
    es: "Un ministerio quiere transferir 150.000 euros de un crédito del capítulo 8 «Activos financieros» a un crédito del capítulo 2 de su mismo programa, sin que concurra ninguna excepción legal. ¿Puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 52.1.a) prohíbe transferir desde créditos para operaciones financieras al resto de los créditos."
  - id: b
    text:
      es: "Sí, con el informe favorable de la Intervención Delegada, porque ambos créditos pertenecen al mismo programa y a la misma sección."
  - id: c
    text:
      es: "Sí, si la transferencia la autoriza el Ministro de Hacienda, porque la Ley 31/2022 le reserva las que afectan al capítulo 8."
  - id: d
    text:
      es: "Sí, pero solo si el Gobierno la acuerda a propuesta del Ministro de Hacienda y a iniciativa del ministro afectado."
  explanation:
    es: "El capítulo 8 es una operación financiera y el artículo 52.1.a) impide transferir desde esos créditos al resto. El informe de la Intervención Delegada no levanta la restricción, que se aplica aunque programa y sección coincidan. Que la Ley 31/2022 atribuya al Ministro de Hacienda las variaciones del capítulo 8 fija quién autoriza, no deroga la prohibición, y el artículo 10.Uno de esa ley solo exime las transferencias de capital a corrientes. La iniciativa conjunta del Gobierno y los ministros afectados es la vía de las reorganizaciones entre secciones, que aquí no concurren."
  citation: "art. 52.1.a) LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q206
  prompt:
    es: "Según el artículo 52.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué créditos no podrán minorarse mediante transferencias, con carácter general?"
  options:
  - id: a
    text:
      es: "Los créditos que se hayan incorporado al ejercicio como remanentes de crédito del ejercicio anterior."
  - id: b
    text:
      es: "Los créditos de la sección 06 Deuda Pública."
  - id: c
    correct: true
    text:
      es: "Los créditos extraordinarios y los que se hayan suplementado o ampliado en el ejercicio."
  - id: d
    text:
      es: "Los créditos destinados a gastos corrientes en bienes y servicios."
  explanation:
    es: "La letra c) impide minorar créditos extraordinarios y créditos suplementados o ampliados en el ejercicio. Los remanentes incorporados no aparecen en esa lista. La sección 06 Deuda Pública es precisamente una de las excepciones de la letra, de modo que sí puede minorarse. Los gastos corrientes en bienes y servicios tampoco están protegidos: el artículo 63.1.a) incluso prevé crear créditos nuevos para ellos."
  citation: "art. 52.1.c) LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q207
  prompt:
    es: "La restricción del artículo 52.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria sobre minorar créditos ampliados no afecta a los créditos ampliables de la Seguridad Social ni a:"
  options:
  - id: a
    correct: true
    text:
      es: "los créditos de la sección 06 Deuda Pública."
  - id: b
    text:
      es: "los créditos de la sección 07 Clases Pasivas."
  - id: c
    text:
      es: "los créditos del programa de contratación centralizada."
  - id: d
    text:
      es: "los créditos del Fondo de Contingencia de ejecución presupuestaria."
  explanation:
    es: "La letra c) del artículo 52.1 dice que las transferencias no minorarán créditos extraordinarios o créditos suplementados o ampliados en el ejercicio, y su segundo párrafo exceptúa dos supuestos: «créditos con carácter ampliable de las entidades que integran el sistema de la Seguridad Social» y los que afecten «a créditos de la sección 06 Deuda Pública». Los créditos de Clases Pasivas, los del Fondo de Contingencia y los del programa de contratación centralizada no están en ese párrafo. El programa de contratación centralizada es la excepción de otra regla, la de la letra b), sobre transferencias entre secciones distintas."
  citation: "art. 52.1.c) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q208
  prompt:
    es: "En marzo se aprobó un suplemento de crédito para una aplicación presupuestaria de gastos corrientes. En junio se propone minorar esa aplicación para dotar otra del mismo programa. ¿Puede hacerse mediante transferencia?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 52.1.c) no permite minorar créditos que se hayan suplementado en el ejercicio, aunque la transferencia sea del mismo programa."
  - id: b
    text:
      es: "Sí, siempre que el titular del ministerio la autorice con informe favorable de la Intervención Delegada."
  - id: c
    text:
      es: "Sí, porque la restricción afecta solo a los créditos extraordinarios y no a los suplementados."
  - id: d
    text:
      es: "Sí, pero solo en la parte del crédito que no procediera del suplemento aprobado en marzo."
  explanation:
    es: "La letra c) impide minorar créditos extraordinarios y también los suplementados o ampliados en el ejercicio, sin salvar un porcentaje ni una parte del crédito. Ni el informe de la Intervención Delegada ni la competencia del titular del ministerio sustituyen esa prohibición. Decir que solo afecta a los extraordinarios omite los suplementados que nombra la letra."
  citation: "art. 52.1.c) LGP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q209
  prompt:
    es: "En el ámbito de la Seguridad Social, el artículo 52.1.d) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria no permite minorar créditos ampliables salvo para:"
  options:
  - id: a
    text:
      es: "financiar créditos para la acción protectora no contributiva y universal."
  - id: b
    correct: true
    text:
      es: "financiar otros créditos que también sean ampliables."
  - id: c
    text:
      es: "atender gastos de personal de la propia entidad."
  - id: d
    text:
      es: "financiar créditos extraordinarios aprobados en el ejercicio."
  explanation:
    es: "La letra d) permite minorar créditos ampliables de la Seguridad Social solo para financiar otros créditos ampliables. La acción protectora no contributiva aparece en el artículo 63 como supuesto que exige informe del Ministerio de Hacienda, no como excepción de esta letra. Los gastos de personal y los créditos extraordinarios no figuran en la letra d)."
  citation: "art. 52.1.d) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q210
  prompt:
    es: "Según el artículo 52.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál de las siguientes transferencias queda fuera de las restricciones del apartado 1?"
  options:
  - id: a
    text:
      es: "La que se realice desde créditos para operaciones financieras a créditos de personal."
  - id: b
    correct: true
    text:
      es: "La que haya de realizarse como consecuencia de una reorganización administrativa."
  - id: c
    text:
      es: "La que minore un crédito extraordinario concedido durante el ejercicio."
  - id: d
    text:
      es: "La que cree un crédito para una subvención nominativa no conforme con la Ley General de Subvenciones."
  explanation:
    es: "El artículo 52.2 libera de las restricciones del apartado 1 las transferencias que hayan de realizarse por reorganizaciones administrativas. Las otras tres siguen sometidas a sus reglas: transferir desde créditos financieros lo prohíbe la letra a), minorar créditos extraordinarios lo prohíbe la letra c) y crear créditos para subvenciones nominativas fuera de la Ley General de Subvenciones lo prohíbe el apartado 3."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q212
  prompt:
    es: "No están sometidas a las restricciones de las transferencias de crédito del artículo 52.1 de la Ley General Presupuestaria las transferencias que se realicen:"
  options:
  - id: a
    correct: true
    text:
      es: "desde el programa de imprevistos."
  - id: b
    text:
      es: "desde el programa de contratación centralizada hacia créditos de personal."
  - id: c
    text:
      es: "entre créditos de un mismo programa que afecten al concepto 202."
  - id: d
    text:
      es: "desde créditos de operaciones financieras a créditos corrientes."
  explanation:
    es: "El artículo 52.2 libera de las restricciones las transferencias que se realicen desde el programa de imprevistos. El programa de contratación centralizada solo está exceptuado de la prohibición entre secciones, no para pasar crédito a personal. Una transferencia que afecta al concepto 202 sigue sujeta a todas las reglas. Desde créditos financieros solo se puede transferir si concurre una de las excepciones del apartado 2, y esta opción no cita ninguna."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q213
  prompt:
    es: "Por el traspaso de unos servicios a una comunidad autónoma, el Estado debe pasar créditos de la sección de un ministerio a otra sección distinta. ¿Puede hacerse pese a la prohibición de transferir entre secciones?"
  options:
  - id: a
    text:
      es: "No, porque el artículo 52.1.b) prohíbe toda transferencia entre secciones presupuestarias, sin que el traspaso de competencias sea excepción."
  - id: b
    text:
      es: "No, salvo que se trate de créditos del programa de contratación centralizada, única excepción a la prohibición entre secciones."
  - id: c
    text:
      es: "Sí, pero solo si los créditos proceden de operaciones corrientes y se pasan a créditos de operaciones de capital."
  - id: d
    correct: true
    text:
      es: "Sí, porque el artículo 52.2 excluye de las restricciones las transferencias por traspaso de competencias a comunidades autónomas."
  explanation:
    es: "El artículo 52.2 saca de las restricciones del apartado 1, y con ellas de la prohibición entre secciones, las transferencias que se hagan por traspaso de competencias a comunidades autónomas. Decir que la prohibición no admite excepciones contradice ese apartado. La contratación centralizada es otra excepción distinta, que aquí no concurre. El tipo de operación de origen y destino no condiciona esta excepción."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q214
  prompt:
    es: "Dos ministerios firman un convenio de colaboración y uno cede al otro 200.000 euros de su presupuesto. ¿Se opone la prohibición de transferir entre secciones que contiene la Ley General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Sí, porque ninguna restricción del apartado 1 admite excepciones por razón de un convenio entre ministerios."
  - id: b
    text:
      es: "Sí, salvo que el convenio lo apruebe el Consejo de Estado antes de efectuarse la transferencia."
  - id: c
    text:
      es: "No, pero únicamente si el importe no supera el uno por ciento de los créditos de ambos ministerios."
  - id: d
    correct: true
    text:
      es: "No, porque los convenios entre departamentos ministeriales quedan fuera de las restricciones del apartado 1 del artículo 52."
  explanation:
    es: "El artículo 52.2 excluye de las restricciones del apartado 1 las transferencias que se deriven de convenios o acuerdos de colaboración entre departamentos ministeriales, de modo que la prohibición entre secciones no les alcanza. No hay condición de dictamen del Consejo de Estado ni umbral del uno por ciento: esas condiciones no están en el artículo."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q215
  prompt:
    es: "Según el artículo 52.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las transferencias nunca podrán crear créditos para subvenciones nominativas, salvo que:"
  options:
  - id: a
    text:
      es: "las autorice el titular del ministerio con informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "se realicen entre créditos de un mismo programa y de un mismo servicio del ministerio."
  - id: c
    correct: true
    text:
      es: "sean conformes con la Ley General de Subvenciones o vayan a otros entes del sector público."
  - id: d
    text:
      es: "las acuerde el Gobierno a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados."
  explanation:
    es: "El apartado 3 admite crear o aumentar créditos para subvenciones nominativas solo si la transferencia es conforme con la Ley General de Subvenciones o se destina a otros entes del sector público. Ni la autorización del titular del ministerio, ni que coincidan programa y servicio, ni el acuerdo del Gobierno aparecen como excepción en ese apartado."
  citation: "art. 52.3 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q216
  prompt:
    es: "Un ministerio propone una transferencia para crear un crédito nuevo destinado a una subvención nominativa a una asociación privada, sin base en la Ley General de Subvenciones. ¿Qué dispone sobre ello la Ley General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Que puede hacerse si la autoriza el Ministro de Hacienda y la asociación justifica después la subvención."
  - id: b
    text:
      es: "Que puede hacerse si el crédito de origen es de operaciones corrientes del mismo programa y sección."
  - id: c
    text:
      es: "Que puede hacerse si el Consejo de Ministros lo acuerda en los tres meses siguientes a la transferencia."
  - id: d
    correct: true
    text:
      es: "Que no puede hacerse: las transferencias no pueden crear créditos para subvenciones nominativas fuera de esa ley."
  explanation:
    es: "El artículo 52.3 prohíbe crear o aumentar créditos para subvenciones nominativas mediante transferencia, salvo que sean conformes con la Ley General de Subvenciones o vayan a otros entes del sector público. Una asociación privada sin base en esa ley no entra en la salvedad, y ni el Ministro de Hacienda ni el Consejo de Ministros pueden levantar la prohibición. Que el origen sea corriente tampoco la levanta."
  citation: "art. 52.3 LGP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q217
  prompt:
    es: "Según el artículo 9.Dos.6 de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿quién puede autorizar una transferencia de créditos de capital a créditos corrientes en el presupuesto del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La persona titular del Ministerio de Hacienda."
  - id: b
    text:
      es: "El titular del ministerio afectado, previo informe favorable de la Intervención Delegada."
  - id: c
    text:
      es: "El Gobierno, a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados."
  - id: d
    text:
      es: "Nadie, porque el artículo 52.1.a) de la Ley General Presupuestaria lo prohíbe en todo caso."
  explanation:
    es: "El artículo 9.Dos.6 de la Ley 31/2022 atribuye a la persona titular del Ministerio de Hacienda autorizar las transferencias de capital a corrientes en el Estado, y el artículo 10.Uno levanta para ellas la limitación del artículo 52.1.a). Por eso no es cierto que nadie pueda hacerlas. Ni el titular del ministerio ni el Gobierno tienen esa competencia."
  citation: "art. 9.Dos.6 Ley 31/2022"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q219
  prompt:
    es: "Según el artículo 52.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, una transferencia desde créditos para operaciones corrientes a créditos para operaciones de capital:"
  options:
  - id: a
    text:
      es: "queda prohibida en todo caso, porque la letra a) protege los créditos para operaciones corrientes."
  - id: b
    text:
      es: "queda prohibida salvo que la autorice el Gobierno, a propuesta del Ministro de Hacienda, en acuerdo motivado."
  - id: c
    text:
      es: "queda prohibida salvo que se realice entre créditos del mismo programa y de la misma sección presupuestaria."
  - id: d
    correct: true
    text:
      es: "no queda prohibida por esa letra, que solo impide transferir desde financieras al resto y de capital a corrientes."
  explanation:
    es: "La letra a) cierra dos caminos: desde operaciones financieras al resto y desde capital a corrientes. El camino inverso, de corrientes a capital, no está vedado. Las otras opciones inventan una prohibición con excepciones que el artículo no contiene."
  citation: "art. 52.1.a) LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q220
  prompt:
    es: "Un organismo autónomo con presupuesto limitativo propone pasar 60.000 euros de un crédito de inversiones reales a gastos corrientes en bienes y servicios. Con la Ley 31/2022 en vigor, ¿puede hacerse y quién lo autoriza?"
  options:
  - id: a
    text:
      es: "Sí, y lo autoriza el Presidente o Director del organismo autónomo, sin posibilidad de avocación por el ministro."
  - id: b
    text:
      es: "No, porque el artículo 52.1.a) de la Ley General Presupuestaria prohíbe en todo caso pasar crédito de capital a corrientes."
  - id: c
    correct: true
    text:
      es: "Sí, y la autoriza el Ministro de Hacienda, porque la Ley 31/2022 le reserva las transferencias de capital a corrientes de los organismos autónomos."
  - id: d
    text:
      es: "Sí, y lo autoriza el titular del ministerio de adscripción, con informe favorable de la Intervención Delegada."
  explanation:
    es: "El artículo 9.Dos.6 de la Ley 31/2022 reserva a la persona titular del Ministerio de Hacienda las transferencias de capital a corrientes en el presupuesto de las entidades de los apartados 1.º, 2.º y 4.º del artículo 1.a), entre ellas los organismos autónomos, y el artículo 10.Uno levanta para ellas la limitación del artículo 52.1.a). Por eso no es cierto que estén prohibidas, ni las puede autorizar el director del organismo ni el titular del ministerio."
  citation: "art. 9.Dos.6 Ley 31/2022"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1996-2627-regla-6
- id: m05-l02-q223
  prompt:
    es: "Con carácter previo a la tramitación de un expediente de transferencia de crédito, la regla 6.1 de la Instrucción de operatoria contable establece que se retiene su importe:"
  options:
  - id: a
    correct: true
    text:
      es: "en las aplicaciones presupuestarias que vayan a ser minoradas."
  - id: b
    text:
      es: "en las aplicaciones presupuestarias que vayan a recibir el crédito."
  - id: c
    text:
      es: "en todas las aplicaciones presupuestarias del programa afectado."
  - id: d
    text:
      es: "en la aplicación presupuestaria que designe la Intervención Delegada."
  explanation:
    es: "La retención recae sobre las aplicaciones que vayan a ser minoradas. No se retiene en las que reciben crédito, no alcanza a todo el programa y no depende de una designación de la Intervención Delegada."
  citation: "regla 6.1 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-6
- id: m05-l02-q224
  prompt:
    es: "Una vez aprobada una transferencia de crédito, ¿qué documento contable implica, según la regla 6.2 de la Instrucción de operatoria contable, para las aplicaciones que ceden crédito?"
  options:
  - id: a
    text:
      es: "Un documento MC con signo positivo, igual que el de las aplicaciones que reciben crédito."
  - id: b
    correct: true
    text:
      es: "Un documento MC con signo negativo, distinto del que recibe el crédito."
  - id: c
    text:
      es: "Un documento RC con signo negativo, que sustituye a la retención previa."
  - id: d
    text:
      es: "Un único documento MC con signo positivo que recoge ambas operaciones."
  explanation:
    es: "Aprobada la transferencia, la regla 6.2 exige dos documentos MC: uno con signo positivo para las aplicaciones que reciben crédito y otro con signo negativo para las que lo ceden. Las demás opciones rompen ese reparto: un MC positivo para quien cede, un RC en lugar del MC o un único documento."
  citation: "regla 6.2 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q226
  prompt:
    es: "Para que el titular de un ministerio autorice una transferencia entre créditos de un mismo programa, ¿qué informe previo exige el artículo 63.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "El informe favorable de la Abogacía del Estado en el departamento ministerial."
  - id: b
    text:
      es: "El dictamen favorable del Consejo de Estado sobre el expediente."
  - id: c
    text:
      es: "El informe favorable de la Secretaría de Estado de Presupuestos y Gastos del Ministerio de Hacienda."
  - id: d
    correct: true
    text:
      es: "El informe favorable de la Intervención Delegada competente en el ministerio."
  explanation:
    es: "El artículo 63.1 permite a los titulares de los ministerios autorizar estas modificaciones previo informe favorable de la Intervención Delegada competente en el ministerio. La Abogacía del Estado, el Consejo de Estado y la Secretaría de Estado de Presupuestos y Gastos no intervienen como informantes previos en ese artículo."
  citation: "art. 63.1.a) LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q229
  prompt:
    es: "Una transferencia entre dos conceptos del capítulo 2 de un mismo programa incrementa el concepto 202. Según el artículo 63.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, no la autoriza el titular del ministerio porque:"
  options:
  - id: a
    correct: true
    text:
      es: "incrementa uno de los créditos que enumera el artículo 43.2, entre ellos los destinados a arrendamientos de edificios y otras construcciones."
  - id: b
    text:
      es: "afecta a créditos de personal, que el artículo 63.1.a) excluye expresamente de la competencia del titular."
  - id: c
    text:
      es: "se realiza entre programas de distintos servicios, que el artículo 63.1.a) no le permite acordar."
  - id: d
    text:
      es: "crea un crédito nuevo, y esa creación exige en todo caso el acuerdo del Gobierno a propuesta del Ministro de Hacienda."
  explanation:
    es: "El artículo 63.1.a) excluye las transferencias que incrementen los créditos del apartado 2 del artículo 43, y la letra b) de ese apartado incluye los arrendamientos de edificios y otras construcciones, que es el concepto 202. Por eso la autoriza el Ministro de Hacienda. El concepto 202 no es de personal, la transferencia es de un mismo programa y no crea crédito nuevo."
  citation: "art. 63.1.a) LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "requisito"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q230
  prompt:
    es: "Según la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿cuál de los siguientes créditos, afectado por una transferencia dentro de un mismo programa, reserva su autorización al Ministro de Hacienda?"
  options:
  - id: a
    text:
      es: "220 «Material de oficina»."
  - id: b
    text:
      es: "226 «Gastos diversos»."
  - id: c
    text:
      es: "227 «Trabajos realizados por otras empresas y profesionales»."
  - id: d
    correct: true
    text:
      es: "225.02 «Tributos locales»."
  explanation:
    es: "El artículo 9.Dos.1 reserva al Ministro de Hacienda las transferencias que afecten a los créditos del artículo 8.Uno.2, 3 y 4, entre ellos el 225.02 «Tributos locales». Los conceptos 220, 226 y 227 son gastos corrientes en bienes y servicios sin esa reserva: dentro de un mismo programa los autoriza el titular del ministerio."
  citation: "art. 9.Dos.1 Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
