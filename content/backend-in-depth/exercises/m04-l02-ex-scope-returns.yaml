type: quiz
variants:
- id: m04-l02-v-kotlin-scope-returns-001
  prompt:
    en: |-
      What does this program print? The first line is the value of the scope function call, the second the `Box` after the lambda ran.

      ```kotlin
      data class Box(var label: String, var size: Int)

      fun main() {
          val box = Box("kt", 1)
          val out = box.let { box.size += 2; box.label.length }
          println(out)
          println(box)
      }
      ```
  options:
  - id: a
    text:
      en: '`2`, `Box(label=kt, size=3)`'
    correct: true
  - id: b
    text:
      en: '`Box(label=kt, size=3)`, `Box(label=kt, size=3)`'
  - id: c
    text:
      en: '`2`, `Box(label=kt, size=1)`'
  - id: d
    text:
      en: '`3`, `Box(label=kt, size=3)`'
  explanation:
    en: 'The call is `box.let`, and its lambda adds 2 to `size` before its last expression. `let` returns the lambda result,
      so `out` is the value of the last expression in the lambda. The output is `2`, `Box(label=kt, size=3)`. `Box(label=kt,
      size=3)`, `Box(label=kt, size=3)` comes from this mistake: thinking the call returns the context object. `let`, `run`
      and `with` return the lambda result, not the object. `2`, `Box(label=kt, size=1)` comes from this mistake: forgetting
      that the lambda bumps the size. The lambda runs once and adds 2 to `size` of the same `Box`. `3`, `Box(label=kt, size=3)`
      comes from this mistake: printing the size as the lambda result. The last expression of the lambda is `box.label.length`,
      not `box.size`.'
  family: kotlin-scope-returns
  code_reading: true
  citation: kotlin-docs-scope-functions#let
  difficulty: 3
  tags: &id001
  - kotlin
  - scope-functions
