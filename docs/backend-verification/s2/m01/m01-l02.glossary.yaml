- id: g-proxy-class
  term: {en: proxy class}
  definition: {en: "A class created at runtime that implements a specified list of interfaces, known as proxy interfaces."}
  origin: m01-l02
  citation: "javadoc-proxy#class-proxy"
- id: g-invocation-handler
  term: {en: invocation handler}
  definition: {en: "The object associated with each proxy instance, which implements the interface InvocationHandler and to which method invocations on the proxy instance are dispatched."}
  origin: m01-l02
  citation: "javadoc-proxy#class-proxy"
- id: g-cglib
  term: {en: CGLIB}
  definition: {en: "A common open-source class definition library, repackaged into spring-core, that Spring AOP uses to create a runtime-generated subclass of the target type."}
  origin: m01-l02
  citation: "spring-fw-aop-proxying#proxying-mechanisms"
