# anchor: boe-a-1996-2627-regla-19
- id: m05-l03-q072
  prompt:
    es: "Un servicio gestor tramita en 2026 un contrato de 90.000 euros, con 30.000 en cada uno de los ejercicios 2026, 2027 y 2028. Según la regla 19.1 de la Instrucción de operatoria contable, ¿qué RC expide al inicio?"
  options:
  - id: a
    text:
      es: "Un RC de ejercicio corriente por 90.000 euros y un RC de ejercicios posteriores sin importes."
  - id: b
    text:
      es: "Un único RC por 90.000 euros que reparte el importe entre los tres ejercicios."
  - id: c
    text:
      es: "Tres RC de ejercicio corriente, uno por cada año, de 30.000 euros cada uno."
  - id: d
    correct: true
    text:
      es: "Un RC de ejercicio corriente por 30.000 euros y un RC de ejercicios posteriores que detalla 30.000 euros para 2027 y 30.000 para 2028."
  explanation:
    es: "La regla 19.1 manda expedir, junto al RC por la anualidad en curso (2026, 30.000 euros), un RC de ejercicios posteriores que detalla el importe de cada ejercicio posterior afectado: 30.000 euros en 2027 y 30.000 en 2028. Imputar los 90.000 euros al ejercicio corriente o a un único RC mezcla el presupuesto en curso con los futuros. Tres RC de ejercicio corriente ignoran que 2027 y 2028 no son el ejercicio corriente."
  citation: "regla 19.1 IOC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "cantidad"
# anchor: boe-a-1996-2627-regla-78
- id: m05-l03-q073
  prompt:
    es: "Según la regla 78.1 de la Instrucción de operatoria contable, ¿cuándo expide el Servicio gestor el documento OK en la ejecución de un contrato?"
  options:
  - id: a
    text:
      es: "Una vez formalizado el contrato y aprobado el expediente de gasto."
  - id: b
    text:
      es: "Antes de que el contratista justifique el cumplimiento de la prestación."
  - id: c
    correct: true
    text:
      es: "Una vez aprobado el expediente de reconocimiento de la obligación."
  - id: d
    text:
      es: "Cuando se adjudica el contrato, junto con el documento D de compromiso."
  explanation:
    es: "La regla 78.1 exige que el contratista justifique la prestación antes del reconocimiento de la obligación y que, aprobado el expediente de reconocimiento, el Servicio gestor expida el documento OK. Formalizar el contrato y aprobar el gasto dan lugar a los documentos D y A. La justificación de la prestación precede al OK, no lo sigue. El documento D se expide al formalizar, no con el OK."
  citation: "regla 78.1 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-septimo
- id: m05-l03-q074
  prompt:
    es: "Según el apartado séptimo de la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado, ¿quién autoriza los documentos MC y RC-102?"
  options:
  - id: a
    correct: true
    text:
      es: "El Director General de Presupuestos."
  - id: b
    text:
      es: "El responsable del órgano que gestiona los créditos."
  - id: c
    text:
      es: "El jefe de contabilidad."
  - id: d
    text:
      es: "El Interventor General de la Administración del Estado."
  explanation:
    es: "El apartado séptimo.1 dice que los documentos MC de modificación de créditos y RC-102 de no disponibilidad los autoriza el Director General de Presupuestos. El responsable del órgano gestor autoriza los demás documentos del presupuesto de gastos. El jefe de contabilidad autoriza solo los RC expedidos de oficio. El Interventor General no figura entre quienes los autorizan."
  citation: "apartado séptimo Orden de documentos contables"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1996-2749-apartado-septimo
- id: m05-l03-q075
  prompt:
    es: "Según el apartado séptimo de la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado, ¿quién autoriza los demás documentos de gasto, salvo excepciones?"
  options:
  - id: a
    text:
      es: "El Director General de Presupuestos, que los autoriza todos con carácter general."
  - id: b
    correct: true
    text:
      es: "El responsable del órgano que tenga encomendada la gestión de los créditos afectados."
  - id: c
    text:
      es: "El Ordenador general de pagos del Estado, una vez registrados en contabilidad."
  - id: d
    text:
      es: "El jefe de contabilidad de la oficina de contabilidad que los registra."
  explanation:
    es: "El apartado séptimo.2 atribuye los demás documentos al responsable del órgano que tenga encomendada la gestión de los créditos a que se refieran las operaciones. El Director General de Presupuestos autoriza solo los MC y RC-102. El Ordenador general de pagos no autoriza documentos de gasto. El jefe de contabilidad autoriza únicamente los RC expedidos de oficio."
  citation: "apartado séptimo Orden de documentos contables"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2017-12902-art-100
- id: m05-l03-q076
  prompt:
    es: "Según el artículo 100.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el presupuesto base de licitación es el límite máximo de gasto que puede comprometer el órgano de contratación y, salvo disposición en contrario:"
  options:
  - id: a
    text:
      es: "excluye el Impuesto sobre el Valor Añadido en todo caso."
  - id: b
    text:
      es: "incluye el Impuesto sobre el Valor Añadido solo en contratos de obras."
  - id: c
    correct: true
    text:
      es: "incluye el Impuesto sobre el Valor Añadido."
  - id: d
    text:
      es: "incluye únicamente los costes directos del contrato."
  explanation:
    es: "El artículo 100.1 define el presupuesto base de licitación como el límite máximo de gasto que puede comprometer el órgano de contratación, incluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario. Excluirlo en todo caso o incluirlo solo en obras contradice el texto. El apartado 2 desglosa costes directos e indirectos, así que no se limita a los directos."
  citation: "art. 100.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-2627-regla-20
- id: m05-l03-q077
  prompt:
    es: "¿Qué dos fases del artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, quedan fuera de las tres en que la regla 20.1 de la Instrucción de operatoria contable divide la ejecución del gasto?"
  options:
  - id: a
    text:
      es: "El compromiso de gasto y la ordenación del pago."
  - id: b
    text:
      es: "La aprobación del gasto y el pago material."
  - id: c
    text:
      es: "El reconocimiento de la obligación y la ordenación del pago."
  - id: d
    correct: true
    text:
      es: "La ordenación del pago y el pago material."
  explanation:
    es: "La regla 20.1 recoge autorización, compromiso y reconocimiento de la obligación, que equivalen a las tres primeras fases del artículo 73.1. Quedan fuera la ordenación del pago y el pago material. El compromiso y el reconocimiento sí están en la Instrucción, y la aprobación del gasto es la fase que la Instrucción llama autorización."
  citation: "regla 20.1 IOC"
  difficulty: 3
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2003-21614-art-75
- id: m05-l03-q101
  prompt:
    es: "Según el artículo 75.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué funciones competen al Director General del Tesoro y Política Financiera?"
  options:
  - id: a
    text:
      es: "Las de Interventor General de la Administración del Estado."
  - id: b
    text:
      es: "Las de Habilitado general de los departamentos ministeriales."
  - id: c
    correct: true
    text:
      es: "Las de Ordenador General de pagos del Estado."
  - id: d
    text:
      es: "Las de Ordenador general de pagos de las Entidades gestoras y Servicios comunes de la Seguridad Social."
  explanation:
    es: "El artículo 75.1 LGP dice que, bajo la superior autoridad del Ministro de Economía, «competen al Director General del Tesoro y Política Financiera las funciones de Ordenador General de pagos del Estado». Las de Ordenador general de pagos de las Entidades gestoras y Servicios comunes de la Seguridad Social las atribuye el apartado 2 al Director General de la Tesorería General de la Seguridad Social. Las de Interventor General de la Administración del Estado no son de ordenación de pagos: el artículo 75 trata de la ordenación, no del control. El Habilitado general no figura en el apartado 1: el apartado 3 solo cita las Habilitaciones como intermediarias para entregar pagos a los acreedores."
  citation: "art. 75.1 LGP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2003-21614-art-75
- id: m05-l03-q103
  prompt:
    es: "Según el artículo 75.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las órdenes de pago se expedirán, con carácter general, a favor:"
  options:
  - id: a
    correct: true
    text:
      es: "del acreedor que figura en la correspondiente propuesta de pago."
  - id: b
    text:
      es: "de la Habilitación o Caja pagadora del departamento afectado."
  - id: c
    text:
      es: "del órgano gestor que reconoció la obligación correspondiente."
  - id: d
    text:
      es: "del titular de la cuenta del Tesoro que designe la Dirección General del Tesoro."
  explanation:
    es: "La regla general del artículo 75.3 es que la orden de pago se expide a favor del acreedor de la propuesta de pago. Las Habilitaciones y Cajas pagadoras solo reciben órdenes de pago en los supuestos que regule una Orden ministerial, y ni el órgano gestor ni el titular de la cuenta del Tesoro son destinatarios del pago."
  citation: "art. 75.3 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-75
- id: m05-l03-q104
  prompt:
    es: "Conforme al artículo 75.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿por medio de qué disposición se pueden regular los supuestos en que las órdenes de pago se expidan a favor de Habilitaciones o Cajas pagadoras?"
  options:
  - id: a
    correct: true
    text:
      es: "Por Orden del Ministro de Economía."
  - id: b
    text:
      es: "Por Resolución de la Secretaría de Estado de Presupuestos y Gastos."
  - id: c
    text:
      es: "Por Resolución de la Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "Por Real Decreto acordado en Consejo de Ministros."
  explanation:
    es: "El artículo 75.3 remite a una Orden del Ministro de Economía para regular los supuestos de pago a favor de Habilitaciones, Cajas pagadoras o Depositarías de fondos. No hace falta Real Decreto del Consejo de Ministros, y las resoluciones de la IGAE o de la Secretaría de Estado de Presupuestos y Gastos no son el instrumento que el artículo prevé."
  citation: "art. 75.3 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-75
- id: m05-l03-q105
  prompt:
    es: "De acuerdo con el artículo 75.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los agentes mediadores en el pago, como las Habilitaciones y las Cajas pagadoras, actúan:"
  options:
  - id: a
    correct: true
    text:
      es: "como intermediarios para la posterior entrega del pago a los acreedores."
  - id: b
    text:
      es: "como órganos de control que verifican la regularidad del pago realizado."
  - id: c
    text:
      es: "como acreedores directos titulares del crédito frente a la Hacienda Pública estatal."
  - id: d
    text:
      es: "como órganos que reconocen la obligación y proponen su pago."
  explanation:
    es: "Según el artículo 75.3, los agentes mediadores actúan como intermediarios para la posterior entrega a los acreedores. No son acreedores directos, ni reconocen obligaciones ni ejercen control: eso corresponde a otros órganos."
  citation: "art. 75.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-75
- id: m05-l03-q106
  prompt:
    es: "Según el artículo 75.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál de los siguientes puede ser destinatario de una orden de pago en los supuestos que regule una Orden del Ministro de Economía?"
  options:
  - id: a
    text:
      es: "Los Servicios gestores que tramitan el expediente de gasto."
  - id: b
    correct: true
    text:
      es: "Las entidades colaboradoras de la Ley General de Subvenciones."
  - id: c
    text:
      es: "Las Oficinas de Contabilidad de los departamentos ministeriales."
  - id: d
    text:
      es: "Las intervenciones delegadas de cada departamento."
  explanation:
    es: "El artículo 75.3 cita entre los posibles destinatarios a las entidades colaboradoras de conformidad con la Ley General de Subvenciones. Las Oficinas de Contabilidad, los Servicios gestores y las intervenciones delegadas intervienen en la gestión y el control, pero no como agentes mediadores del pago."
  citation: "art. 75.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-107
- id: m05-l03-q107
  prompt:
    es: "Según el artículo 107 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Ordenador de Pagos aplicará en la expedición de las órdenes de pago criterios:"
  options:
  - id: a
    text:
      es: "cronológicos exclusivamente, sin atender al importe ni a la forma de pago."
  - id: b
    correct: true
    text:
      es: "objetivos, tales como la fecha de recepción o el importe de la operación."
  - id: c
    text:
      es: "discrecionales, que fija el Ministro en cada orden de pago."
  - id: d
    text:
      es: "subjetivos, que valora la Dirección General del Tesoro en cada caso concreto."
  explanation:
    es: "El artículo 107 exige criterios objetivos, como la fecha de recepción, el importe de la operación, la aplicación presupuestaria y la forma de pago, entre otros. Los criterios discrecionales o subjetivos contradicen esa exigencia, y el orden cronológico no es el único criterio posible."
  citation: "art. 107 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-107
- id: m05-l03-q109
  prompt:
    es: "Entre los criterios objetivos que menciona el artículo 107 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria para la expedición de órdenes de pago figura:"
  options:
  - id: a
    text:
      es: "el grado de ejecución del presupuesto del departamento."
  - id: b
    text:
      es: "la fecha de aprobación del gasto por el Ministro."
  - id: c
    correct: true
    text:
      es: "la forma de pago de la operación."
  - id: d
    text:
      es: "la naturaleza jurídica del órgano que propone el pago."
  explanation:
    es: "El artículo 107 menciona la forma de pago entre sus criterios objetivos, junto a la fecha de recepción, el importe de la operación y la aplicación presupuestaria. La fecha de aprobación del gasto, la naturaleza del órgano proponente y el grado de ejecución del presupuesto no figuran en él."
  citation: "art. 107 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-12506-apartado-sexto
- id: m05-l03-q110
  prompt:
    es: "Según el apartado sexto.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, con carácter general los órganos que dictan los actos de reconocimiento de obligaciones proponen su pago a:"
  options:
  - id: a
    text:
      es: "la Subsecretaría del departamento correspondiente."
  - id: b
    correct: true
    text:
      es: "la Dirección General del Tesoro y Política Financiera."
  - id: c
    text:
      es: "la Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "la Oficina de Contabilidad que registre la obligación."
  explanation:
    es: "El apartado sexto.1 dispone que los órganos que reconocen obligaciones propongan el pago a la Dirección General del Tesoro y Política Financiera. Ni la IGAE, ni la Oficina de Contabilidad, ni la Subsecretaría reciben esas propuestas para ordenar el pago."
  citation: "apartado sexto.1 Orden PRE/1576/2002"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2002-12506-apartado-sexto
- id: m05-l03-q111
  prompt:
    es: "Conforme al apartado sexto.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, ¿cómo proponen el pago los órganos que dictan actos de reconocimiento de obligaciones?"
  options:
  - id: a
    text:
      es: "Mediante la expedición de órdenes de pago a favor del acreedor."
  - id: b
    text:
      es: "Mediante resoluciones de aprobación y compromiso del gasto."
  - id: c
    text:
      es: "Mediante certificaciones expedidas por la Oficina de Contabilidad."
  - id: d
    correct: true
    text:
      es: "Mediante la expedición de las oportunas propuestas de pago."
  explanation:
    es: "Los órganos que reconocen obligaciones expiden propuestas de pago, según el apartado sexto.1. Las órdenes de pago las expide después el Ordenador de pagos; las certificaciones de la Oficina de Contabilidad y las resoluciones de aprobación del gasto no son el instrumento de la propuesta."
  citation: "apartado sexto.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-octavo
- id: m05-l03-q112
  prompt:
    es: "Según el apartado octavo.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, registradas las propuestas de pago, las pone a disposición de la Dirección General del Tesoro:"
  options:
  - id: a
    text:
      es: "el órgano que reconoció la obligación."
  - id: b
    text:
      es: "la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "la intervención delegada del departamento."
  - id: d
    correct: true
    text:
      es: "cada Oficina de Contabilidad integrada en el Sistema."
  explanation:
    es: "Son las Oficinas de Contabilidad integradas en el Sistema las que ponen los datos de las propuestas a disposición de la Dirección General del Tesoro y Política Financiera. El órgano gestor solo las expide, y las intervenciones y la IGAE no intervienen en ese traslado."
  citation: "apartado octavo.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2002-12506-apartado-octavo
- id: m05-l03-q113
  prompt:
    es: "Según el apartado octavo.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, ¿qué hace la Dirección General del Tesoro cuando las Oficinas de Contabilidad le facilitan los datos?"
  options:
  - id: a
    text:
      es: "Aprueba el gasto al que se refiere la propuesta."
  - id: b
    text:
      es: "Fiscaliza el pago antes de su materialización."
  - id: c
    correct: true
    text:
      es: "Procede a ordenar el pago."
  - id: d
    text:
      es: "Reconoce la obligación que la propuesta recoge."
  explanation:
    es: "Con los datos a su disposición, la Dirección General del Tesoro y Política Financiera procede a ordenar el pago. Reconocer la obligación y aprobar el gasto son fases anteriores a cargo de otros órganos, y la fiscalización es una función de control, no de ordenación."
  citation: "apartado octavo.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-octavo
- id: m05-l03-q114
  prompt:
    es: "Según el apartado octavo.2.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, las propuestas de pago que no sean ordenadas en un proceso de ordenación:"
  options:
  - id: a
    text:
      es: "caducan y deben expedirse de nuevo en el ejercicio siguiente."
  - id: b
    correct: true
    text:
      es: "quedan retenidas a la espera de que se efectúe su ordenación en un proceso posterior."
  - id: c
    text:
      es: "se devuelven al órgano gestor que las expidió, para que las anule o las modifique de oficio."
  - id: d
    text:
      es: "se ordenan automáticamente en el proceso siguiente por la Oficina de Contabilidad."
  explanation:
    es: "Las propuestas no ordenadas quedan retenidas hasta un proceso posterior de ordenación. No se devuelven al órgano gestor, no caducan y tampoco las ordena la Oficina de Contabilidad, que no es la competente."
  citation: "apartado octavo.2.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-octavo
- id: m05-l03-q115
  prompt:
    es: "Según el apartado octavo.2.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, se seleccionan las propuestas a ordenar conforme al artículo 107 de la Ley 47/2003 y atendiendo a:"
  options:
  - id: a
    text:
      es: "criterios de rentabilidad de la deuda pública emitida."
  - id: b
    text:
      es: "los criterios que fije la Intervención General en cada proceso."
  - id: c
    text:
      es: "las preferencias que manifieste el acreedor de cada propuesta."
  - id: d
    correct: true
    text:
      es: "criterios de gestión eficiente de tesorería."
  explanation:
    es: "El apartado octavo.2.2 añade a los criterios del artículo 107 los de gestión eficiente de tesorería. La rentabilidad de la deuda, las instrucciones de la IGAE y las preferencias del acreedor no aparecen como criterios de selección."
  citation: "apartado octavo.2.2 Orden PRE/1576/2002"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q116
  prompt:
    es: "Según el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la ordenación del pago se sitúa en el procedimiento de gestión de los gastos:"
  options:
  - id: a
    text:
      es: "después del pago material, como cierre del procedimiento."
  - id: b
    text:
      es: "entre el compromiso de gasto y el reconocimiento de la obligación."
  - id: c
    correct: true
    text:
