  - id: b
    text:
      es: "Devuelve el número de columna de una referencia"
  - id: c
    correct: true
    text:
      es: "Devuelve el número de fila de una referencia"
  - id: d
    text:
      es: "Ordena el contenido de un rango por filas"
  explanation:
    es: "La página dice que FILA devuelve el número de fila de una referencia, y FILAS el número de filas. «Devuelve el número de filas de una referencia»: esa es la función FILAS, en plural. «Devuelve el número de columna de una referencia»: esa es la función COLUMNA. «Ordena el contenido de un rango por filas»: esa función es ORDENAR."
