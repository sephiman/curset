type: quiz
variants:
- id: m12-l05-qa01
  prompt:
    en: According to Martin Fowler in Technical Debt, what happens to teams that take on cruft to deliver urgent
      new features faster than they otherwise would?
  options:
  - id: a
    text:
      en: They stay ahead of the design payoff line for months before they slow down
  - id: b
    correct: true
    text:
      en: They end up maxing out all their credit cards and still deliver later
  - id: c
    text:
      en: They pay interest only as time passes, as on a financial loan
  - id: d
    text:
      en: Cruft slows only their later features, never the urgent ones themselves
  explanation:
    en: Fowler writes that teams who take on cruft this way end up maxing out all their credit cards and still deliver
      later than they would have with higher internal quality. Fowler rules out staying ahead of the design payoff
      line for months, because he writes that teams hit that line in weeks rather than months. He rules out interest
      paid only as time passes, because he says an interest payment is triggered only when someone has to work with
      that part of the software. He rules out cruft slowing only later features, because he writes that cruft has
      a quick impact and slows down the very new features that are needed quickly.
  citation: fowler-technical-debt#is-high-quality-software-worth-the-cost
- id: m12-l05-qa02
  prompt:
    en: According to Martin Fowler in Technical Debt, how should a team treat cruft in the areas of the code base
      that developers modify frequently?
  options:
  - id: a
    text:
      en: Accept it for now, since frequent changes bring little added risk of cruft building up
  - id: b
    correct: true
    text:
      en: Apply zero tolerance to cruft, because its interest payments are cripplingly high
  - id: c
    text:
      en: Clear all of it in one dedicated pass before any further feature work
  - id: d
    text:
      en: Remove it only after a spreadsheet shows the exact cost of removal
  explanation:
    en: Fowler writes that areas of high activity need a zero-tolerance attitude to cruft, because the interest
      payments there are cripplingly high. He rules out accepting the cruft for now, because he writes that cruft
      accumulates where developers change code without attention to quality and that more changes mean greater risk
      of it building up. He rules out one dedicated pass that clears all of it, because he writes that the usual
      best route is to pay the principal off gradually. He rules out waiting for a spreadsheet with the exact cost
      of removal, because he writes that none of these costs are objectively measurable.
  citation: fowler-technical-debt#is-high-quality-software-worth-the-cost
- id: m12-l05-qa03
  prompt:
    en: According to Martin Fowler in Technical Debt, in his example where a feature takes four days with a clear
      module structure and six days with cruft, what is the interest on the debt?
  options:
  - id: a
    text:
      en: The five days spent cleaning up the confusing module structure
  - id: b
    text:
      en: The four days the feature takes even with a clear module structure
  - id: c
    text:
      en: A charge that builds up with time whether or not the code is ever modified
  - id: d
    correct: true
    text:
      en: The two day difference between six days with cruft and four without
  explanation:
    en: Fowler writes that the two day difference between the six days with cruft and the four days without it is
      the interest on the debt. He rules out the five days of cleaning up the module structure, because he describes
      that cleanup as paying off the principal. He rules out the four days with a clear module structure, because
      he writes that the extra effort needed to add new features is the interest paid on the debt. He rules out
      a charge that builds up with time, because he says an interest payment is triggered only when someone has
      to work with that part of the software.
  citation: fowler-technical-debt#banner; fowler-technical-debt#is-high-quality-software-worth-the-cost
- id: m12-l05-qa04
  prompt:
    en: 'According to Hyrum Wright in Chapter 15: Deprecation of Software Engineering at Google, what happens to
      a deprecation process that has no explicit owners?'
  options:
  - id: a
    text:
      en: It finishes on its own once the users of the system are asked to migrate themselves
  - id: b
    text:
      en: It becomes cheaper, because explicit owners are a poor use of resources
  - id: c
    correct: true
    text:
      en: It is unlikely to make meaningful progress, however many warnings it generates
  - id: d
    text:
      en: It speeds up, because spreading the work across many teams reduces its cost
  explanation:
    en: Wright writes that without explicit owners a deprecation process is unlikely to make meaningful progress,
      no matter how many warnings and alerts a system generates. Wright rules out finishing once users migrate themselves,
      because he writes that delegating deprecation to users becomes an advisory deprecation, which will never organically
      finish. He rules out owners being a poor use of resources, because he writes that the alternatives, never
      deprecating or delegating to users, are even worse. He rules out spreading the work across many teams, because
      he writes that centralizing deprecation efforts makes costs more transparent and lets expertise reduce them.
  citation: abseil-swe-ch15#process_owners
- id: m12-l05-qa05
  prompt:
    en: 'According to Hyrum Wright in Chapter 15: Deprecation of Software Engineering at Google, what effect does
      placing a deprecation warning on an old system and walking away have on how that system is used?'
  options:
  - id: a
    correct: true
    text:
      en: New uses fall slightly, but teams rarely migrate away
  - id: b
    text:
      en: Users carry out most of the migration work themselves
  - id: c
    text:
      en: New uses of the old system stop altogether
  - id: d
    text:
      en: The old system stops needing maintenance and resources
  explanation:
    en: Wright writes that a warning alone can lead to slightly fewer new uses of an obsolete system but rarely
      leads teams to migrate away from it. Wright rules out users carrying out most of the migration, because he
      writes that advisory deprecation should not be counted on to do the majority of migration work. He rules out
      new uses stopping altogether, because he writes that the many existing uses of the old system keep picking
      up a large share of new uses, however much users are asked to use the new system. He rules out the old system
      no longer needing maintenance, because he writes that it will continue to require maintenance and other resources
      unless users are more actively encouraged to migrate.
  citation: abseil-swe-ch15#advisory_deprecation
- id: m12-l05-qa06
  prompt:
    en: 'According to Hyrum Wright in Chapter 15: Deprecation of Software Engineering at Google, what does he strongly
      advocate about compulsory deprecations, which usually come with a deadline for removing the obsolete system?'
  options:
  - id: a
    correct: true
    text:
      en: That a specialized team actively staffs them through completion
  - id: b
    text:
      en: That customer teams staff them alongside their own feature work
  - id: c
    text:
      en: That the schedule stays fixed once the deadline has been announced
  - id: d
    text:
      en: That they need no enforcement mechanism once users have been warned
  explanation:
    en: Wright writes that he strongly advocates that compulsory deprecations are actively staffed by a specialized
      team through completion. He rules out customer teams staffing them, because he writes that customers see unstaffed
      deprecation work as an unfunded mandate that makes them push aside their own priorities. He rules out a fixed
      schedule, because he writes that an enforcement mechanism does not imply that the schedule cannot change.
      He rules out dropping enforcement after warnings, because he writes that for compulsory deprecation to work
      its schedule needs an enforcement mechanism.
  citation: abseil-swe-ch15#compulsory_deprecation
- id: m12-l05-qa07
  prompt:
    en: 'According to Hyrum Wright in Chapter 15: Deprecation of Software Engineering at Google, when is deprecation
      best suited, as opposed to leaving an aging system in place?'
  options:
  - id: a
    text:
      en: For any system that has simply grown old, because its age alone justifies deprecation
  - id: b
    text:
      en: For two systems doing the same job, since running both costs little over time
  - id: c
    correct: true
    text:
      en: For systems that are demonstrably obsolete and have a replacement with comparable functionality
  - id: d
    text:
      en: For every obsolete system at once, since an organization can absorb unlimited deprecation work at the
        same time
  explanation:
    en: Wright writes that deprecation is best suited for systems that are demonstrably obsolete and have a replacement
      that provides comparable functionality. Wright rules out deprecating a system for its age alone, because he
      writes that age alone does not justify deprecation. He rules out running two systems for the same job as cheap,
      because he writes that over time the costs of maintaining them both can grow substantially. He rules out deprecating
      every obsolete system at once, because he writes that organizations have a limit on the amount of deprecation
      work that is reasonable to undergo simultaneously.
  citation: abseil-swe-ch15#why_deprecatequestion_mark
