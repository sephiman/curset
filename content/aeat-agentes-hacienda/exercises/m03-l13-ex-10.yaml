  prompt:
    es: "Según el artículo 210.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los datos, pruebas o circunstancias obtenidos en un procedimiento de aplicación de los tributos que vayan a tenerse en cuenta en el procedimiento sancionador:"
