# anchor: boe-a-1985-12534-art-49
- id: m02-l03-q066
  prompt:
    es: "Según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, se entiende por documento toda expresión en lenguaje natural o convencional y cualquier otra expresión gráfica, sonora o en imagen, recogidas en cualquier tipo de:"
  options:
  - id: a
    text:
      es: "Soporte electrónico firmado por un órgano de una Administración."
  - id: b
    correct: true
    text:
      es: "Soporte material, incluso los soportes informáticos."
  - id: c
    text:
      es: "Soporte original, con exclusión de los soportes informáticos."
  - id: d
    text:
      es: "Soporte papel o pergamino conservado en un archivo público."
  explanation:
    es: "La ley define el documento por su contenido y lo extiende a cualquier soporte material, con los soportes informáticos incluidos de forma expresa. Limitarlo a soportes originales deja fuera los informáticos, que el texto cita. Restringirlo al papel y al pergamino o a lo electrónico firmado añade un requisito que la definición no contiene."
  citation: "art. 49.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q067
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el sistema archivístico es el conjunto de normas reguladoras, así como de órganos, centros y servicios competentes en la gestión eficaz de:"
  options:
  - id: a
    text:
      es: "Los archivos y de los registros públicos."
  - id: b
    correct: true
    text:
      es: "Los documentos y de los archivos."
  - id: c
    text:
      es: "Los fondos y de las colecciones documentales."
  - id: d
    text:
      es: "Los documentos y de los expedientes electrónicos."
  explanation:
    es: "El real decreto cierra la definición con los documentos y los archivos. Los expedientes electrónicos tienen su propia definición en otra letra del mismo apartado. Los fondos y colecciones aparecen en la definición del Sistema de Archivos de la Administración General del Estado, no en la del sistema archivístico. Los registros públicos no figuran en ella."
  citation: "art. 2.2.a) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q068
  prompt:
    es: "Dentro de la gestión de documentos y archivos, ¿qué elementos reúne, junto con las normas reguladoras, el conjunto que se denomina sistema archivístico?"
  options:
  - id: a
    correct: true
    text:
      es: "Órganos, centros y servicios competentes en la gestión de documentos y archivos."
  - id: b
    text:
      es: "Documentos de archivo en soporte papel y en soporte electrónico, con sus metadatos."
  - id: c
    text:
      es: "Fondos, colecciones y agrupaciones documentales de cada Ministerio y organismo público."
  - id: d
    text:
      es: "Calendarios de conservación, cuadros de clasificación y relaciones de entrega de cada Ministerio."
  explanation:
    es: "El sistema archivístico suma a las normas los órganos, centros y servicios competentes en la gestión eficaz de los documentos y de los archivos. Los calendarios, cuadros y relaciones son instrumentos de trabajo, no elementos de esa definición. Los fondos y agrupaciones son lo que gestiona el sistema. Los documentos de archivo tienen una definición distinta."
  citation: "art. 2.2.a) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
  - "composición"
# anchor: boe-a-2021-5032-art-46
- id: m02-l03-q069
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, el documento administrativo electrónico tiene un formato determinado y susceptible de identificación y tratamiento diferenciado admitido en:"
  options:
  - id: a
    text:
      es: "La Norma Técnica de Calidad de los Servicios Electrónicos."
  - id: b
    correct: true
    text:
      es: "El Esquema Nacional de Interoperabilidad y normativa correspondiente."
  - id: c
    text:
      es: "El Reglamento General de Protección de Datos de la Unión Europea."
  - id: d
    text:
      es: "El Esquema Nacional de Seguridad y su normativa de desarrollo."
  explanation:
    es: "El reglamento remite el formato al Esquema Nacional de Interoperabilidad. El Esquema Nacional de Seguridad se cita en otros preceptos para la conservación, no para el formato. El reglamento de protección de datos no regula formatos. La norma técnica de calidad que figura entre las opciones no existe en el texto."
  citation: "art. 46.1 RD 203/2021"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q070
  prompt:
    es: "Para ser considerados válidos, los documentos electrónicos administrativos deben incorporar, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "La relación de funcionarios habilitados del órgano emisor."
  - id: b
    text:
      es: "El sello del registro electrónico en el que se presentaron."
  - id: c
    text:
      es: "La firma manuscrita digitalizada de la persona que los emite."
  - id: d
    correct: true
    text:
      es: "Una referencia temporal del momento en que han sido emitidos."
  explanation:
    es: "La letra c) exige una referencia temporal del momento de emisión. El sello de registro corresponde a la presentación de un documento, no a su emisión. La ley pide las firmas electrónicas que correspondan, no una firma manuscrita digitalizada. La relación de funcionarios habilitados es un registro de la Administración, no un requisito del documento."
  citation: "art. 26.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q071
  prompt:
    es: "¿Qué deben incorporar los documentos electrónicos administrativos para ser considerados válidos, además de los datos de identificación, la referencia temporal y las firmas electrónicas que correspondan?"
  options:
  - id: a
    correct: true
    text:
      es: "Los metadatos mínimos exigidos."
  - id: b
    text:
      es: "Una copia auténtica en soporte papel."
  - id: c
    text:
      es: "Un número de registro de salida."
  - id: d
    text:
      es: "El visto bueno del archivo central."
  explanation:
    es: "La letra d) pide incorporar los metadatos mínimos exigidos. El número de registro de salida no es un requisito de validez. La copia en papel no se exige a un documento electrónico. El archivo central no interviene en la validez de un documento que se emite."
  citation: "art. 26.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q072
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos electrónicos administrativos deben disponer de datos de identificación que permitan su individualización, sin perjuicio de su posible incorporación a:"
  options:
  - id: a
    correct: true
    text:
      es: "Un expediente electrónico."
  - id: b
    text:
      es: "Un archivo de gestión."
  - id: c
    text:
      es: "El Registro Electrónico General."
  - id: d
    text:
      es: "Un calendario de conservación."
  explanation:
    es: "La letra b) permite que el documento, ya individualizado, se incorpore a un expediente electrónico. El archivo de gestión custodia documentos en tramitación, pero no es el destino que fija el precepto. El Registro Electrónico General recibe asientos. El calendario de conservación es un instrumento de valoración, no un lugar al que se incorpore un documento."
  citation: "art. 26.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q073
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, no requerirán de firma electrónica los documentos electrónicos emitidos por las Administraciones Públicas que se publiquen con carácter meramente informativo ni los que no formen parte de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un expediente administrativo."
  - id: b
    text:
      es: "Un archivo de oficina."
  - id: c
    text:
      es: "Un sistema de gestión documental."
  - id: d
    text:
      es: "Un registro electrónico general."
  explanation:
    es: "La excepción alcanza a los documentos que no forman parte de un expediente administrativo. Un archivo de oficina, un registro o un sistema de gestión documental no son el criterio del precepto."
  citation: "art. 26.3 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q074
  prompt:
    es: "Entre los documentos electrónicos emitidos por las Administraciones Públicas, ¿qué será necesario identificar en todo caso en los que no requieren firma electrónica?"
  options:
  - id: a
    text:
      es: "Al interesado al que se dirige cada documento."
  - id: b
    text:
      es: "Al funcionario que los incorpora al expediente."
  - id: c
    text:
      es: "El soporte en el que se archivan."
  - id: d
    correct: true
    text:
      es: "El origen de esos documentos."
  explanation:
    es: "Aunque no lleven firma, hay que identificar su origen. Ni el destinatario, ni quien los incorpora al expediente, ni el soporte de archivo son lo que el precepto pide identificar."
  citation: "art. 26.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-27
- id: m02-l03-q075
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, tienen la consideración de copia auténtica de un documento público administrativo o privado las realizadas por los órganos competentes en las que quede garantizada la identidad del órgano que ha realizado la copia y:"
  options:
  - id: a
    correct: true
    text:
      es: "Su contenido, cualquiera que sea el soporte de la copia."
  - id: b
    text:
      es: "Su soporte, que ha de ser siempre electrónico y estar firmado."
  - id: c
    text:
      es: "El consentimiento expreso del titular del documento original."
  - id: d
    text:
      es: "La fecha y la hora en que se emitió el documento original."
  explanation:
    es: "Se garantizan la identidad del órgano y el contenido, y el soporte es indiferente. Exigir soporte electrónico contradice el «cualquiera que sea su soporte». El consentimiento del titular y la fecha del original no son condiciones de la copia auténtica."
  citation: "art. 27.2 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-27
- id: m02-l03-q076
  prompt:
    es: "En relación con los documentos públicos administrativos y los privados, ¿qué validez y eficacia tienen las copias auténticas respecto de los documentos originales?"
  options:
  - id: a
    correct: true
    text:
      es: "La misma validez y eficacia que los documentos originales."
  - id: b
    text:
      es: "Una validez que depende del consentimiento del titular del original."
  - id: c
    text:
      es: "Una eficacia limitada a la Administración que las expidió."
  - id: d
    text:
      es: "Una validez meramente informativa, sin eficacia probatoria alguna."
  explanation:
    es: "Las copias auténticas valen lo mismo que los originales. Una validez informativa, condicionada al consentimiento del titular o limitada a quien las expide es menos de lo que el precepto reconoce."
  citation: "art. 27.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-12534-art-49
- id: m02-l03-q138
  prompt:
    es: "Según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, del concepto de documento se excluyen, entre las ediciones, los ejemplares:"
  options:
  - id: a
    text:
      es: "Que son anteriores a cien años."
  - id: b
    text:
      es: "Que se conservan en soportes informáticos."
  - id: c
    correct: true
    text:
      es: "Que no son originales de la edición."
  - id: d
    text:
      es: "Que carecen de firma."
  explanation:
    es: "La ley define el documento por cualquier expresión recogida en un soporte material y añade: «Se excluyen los ejemplares no originales de ediciones». Los soportes informáticos no se excluyen: el texto los incluye de forma expresa. La antigüedad de cien años es un requisito que el artículo pide a las personas físicas para integrar el Patrimonio Documental, no un criterio del concepto de documento. La firma no aparece en la definición."
  citation: "art. 49.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q139
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, el documento electrónico es la información en forma electrónica archivada en:"
  options:
  - id: a
    text:
      es: "Un soporte electrónico, siempre que incorpore la firma de un órgano administrativo."
  - id: b
    text:
      es: "Un soporte físico, junto con el índice que permite su localización."
  - id: c
    text:
      es: "Un expediente electrónico, junto con los metadatos exigidos por el Esquema Nacional de Seguridad."
  - id: d
    correct: true
    text:
      es: "Un soporte electrónico, según un formato determinado y susceptible de identificación y tratamiento diferenciado."
  explanation:
    es: "El real decreto toma la definición de la Ley 11/2007: la información de cualquier naturaleza en forma electrónica se archiva en un soporte electrónico, con un formato determinado y susceptible de identificación y tratamiento diferenciado. No exige firma de un órgano. Un soporte físico contradice el adjetivo electrónico. El expediente es el conjunto de documentos de un procedimiento y no el lugar donde se archiva cada documento."
  citation: "art. 2.2.c) RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q140
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, el expediente electrónico es el conjunto de documentos electrónicos correspondientes a:"
  options:
  - id: a
    text:
      es: "Un mismo interesado, con independencia del procedimiento al que pertenezcan y del órgano."
  - id: b
    text:
      es: "Una misma serie documental, siempre que estén firmados por el mismo órgano."
  - id: c
    text:
      es: "Un archivo de gestión de cualquier unidad, mientras estén en fase de tramitación."
  - id: d
    correct: true
    text:
      es: "Un procedimiento administrativo, cualquiera que sea el tipo de información que contengan."
  explanation:
    es: "El expediente electrónico agrupa los documentos electrónicos de un procedimiento administrativo, sea cual sea la información que contengan. No se define por la serie ni por el órgano firmante, ni por el archivo donde esté, ni por el interesado."
  citation: "art. 2.2.d) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-26
- id: m02-l03-q142
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas emitirán los documentos administrativos por escrito, a través de medios electrónicos, a menos que su naturaleza exija:"
  options:
  - id: a
    text:
      es: "La firma manuscrita de la persona titular del órgano."
  - id: b
    text:
      es: "La comunicación al archivo central del Departamento."
  - id: c
    correct: true
    text:
      es: "Otra forma más adecuada de expresión y constancia."
  - id: d
    text:
      es: "La autorización previa del órgano superior jerárquico."
  explanation:
    es: "La regla general es el escrito por medios electrónicos. La excepción es que la naturaleza del documento exija «otra forma más adecuada de expresión y constancia». La firma manuscrita, la autorización del superior y la comunicación al archivo central no aparecen como excepción."
  citation: "art. 26.1 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2021-5032-art-46
- id: m02-l03-q143
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, el documento administrativo electrónico es la información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico, según un formato determinado y susceptible de identificación y tratamiento diferenciado admitido en:"
  options:
  - id: a
    text:
      es: "Las instrucciones de la Comisión de Archivos de la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "El Esquema Nacional de Interoperabilidad y la normativa correspondiente."
  - id: c
    text:
      es: "El Esquema Nacional de Seguridad y su normativa de desarrollo."
  - id: d
    text:
      es: "El calendario de conservación de cada Departamento ministerial."
  explanation:
    es: "El formato ha de estar admitido «en el Esquema Nacional de Interoperabilidad y normativa correspondiente». El Esquema Nacional de Seguridad regula la seguridad de los soportes y no aparece en esa definición. El calendario de conservación fija plazos de permanencia, no formatos. La Comisión de Archivos da instrucciones archivísticas, pero el artículo no le remite el formato."
  citation: "art. 46.1 RD 203/2021"
  difficulty: 3
  tags:
  - "concepto"
