# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q123
  prompt:
    es: "Según la página de Microsoft Azure sobre qué es el almacenamiento en la nube, este guarda los datos:"
  options:
  - id: a
    text:
      es: "en el disco duro del equipo, sincronizado con la red local."
  - id: b
    text:
      es: "en hardware local de la organización, con copia en Internet."
  - id: c
    correct: true
    text:
      es: "en servidores remotos a los que se accede online."
  - id: d
    text:
      es: "en unidades de memoria de la propia aplicación móvil."
  explanation:
    es: "La página define el almacenamiento en la nube como el que «guarda datos en servidores remotos a los que se accede online, en lugar de en hardware local». La página dice que se guardan en servidores remotos en lugar de en equipos locales o discos duros físicos. La página dice que se guardan en servidores remotos en lugar de en hardware local. La aplicación móvil solo es una vía de acceso mediante una API; los datos están en servidores remotos."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q124
  prompt:
    es: "¿Cuántos modelos de almacenamiento en la nube distingue la página de Microsoft Azure sobre qué es el almacenamiento en la nube?"
  options:
  - id: a
    text:
      es: "Dos: público y privado."
  - id: b
    text:
      es: "Tres: público, privado e híbrido."
  - id: c
    correct: true
    text:
      es: "Cuatro: público, privado, híbrido y multinube."
  - id: d
    text:
      es: "Cinco: público, privado, híbrido, multinube y comunitario."
  explanation:
    es: "La página dice: «Hay cuatro modelos diferentes de almacenamiento en la nube: nubes públicas, privadas e híbridas, así como opciones multinube». Dos modelos dejan fuera el híbrido y el multinube, que la página enumera. Tres dejan fuera el multinube. Y cinco añaden un modelo comunitario que no está en la enumeración de la página, que cierra la lista en cuatro."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q125
  prompt:
    es: "¿Cuál de los siguientes tipos de almacenamiento en la nube organiza los datos en unidades discretas, cada una con sus propios metadatos?"
  options:
  - id: a
    text:
      es: "El almacenamiento de archivos."
  - id: b
    text:
      es: "El almacenamiento en bloque."
  - id: c
    correct: true
    text:
      es: "El almacenamiento de objetos."
  - id: d
    text:
      es: "El almacenamiento en multinube."
  explanation:
    es: "La página dice que «el almacenamiento de objetos organiza los datos en unidades discretas u objetos, cada uno con sus propios metadatos». El almacenamiento de archivos mantiene una estructura jerárquica de carpetas y directorios. El almacenamiento en bloque divide los datos en bloques de tamaño fijo. La multinube no es un tipo de almacenamiento sino un modelo, que usa servicios de varios proveedores."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q126
  prompt:
    es: "¿Cuál de los siguientes usos resulta adecuado para el almacenamiento en bloque, según la página de Microsoft Azure sobre el almacenamiento en la nube?"
  options:
  - id: a
    text:
      es: "Para sistemas de archivos compartidos y aplicaciones colaborativas."
  - id: b
    text:
      es: "Para grandes cantidades de datos no estructurados, como imágenes o vídeos."
  - id: c
    text:
      es: "Para mantener la información regulada en un entorno privado."
  - id: d
    correct: true
    text:
      es: "Para bases de datos y aplicaciones de alto rendimiento."
  explanation:
    es: "Según la página, el almacenamiento en bloque divide los datos en bloques de tamaño fijo que «se pueden recuperar rápidamente, lo que hace que este tipo sea adecuado para bases de datos y aplicaciones de alto rendimiento». Los sistemas de archivos compartidos y las aplicaciones colaborativas son el uso del almacenamiento de archivos. Los datos no estructurados como imágenes y vídeos son el uso ideal del almacenamiento de objetos. Mantener la información regulada en un entorno privado es una característica del modelo de nube híbrida."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q127
  prompt:
    es: "¿Cuál de los siguientes modelos de almacenamiento en la nube está dedicado a una sola organización y puede hospedarse de forma local o mediante un proveedor de servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "La nube privada."
  - id: b
    text:
      es: "La nube pública."
  - id: c
    text:
      es: "La nube híbrida."
  - id: d
    text:
      es: "La multinube."
  explanation:
    es: "La página dice que el almacenamiento en la nube privada «está dedicado a una sola organización» y que «se puede hospedar de forma local o mediante un proveedor de servicios». En la nube pública, proveedores de terceros entregan el almacenamiento a través de Internet y las organizaciones comparten recursos. La nube híbrida combina modelos públicos y privados. La multinube usa servicios de varios proveedores."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q128
  prompt:
    es: "¿Cuál de los siguientes modelos de almacenamiento en la nube permite que la información confidencial o regulada permanezca en un entorno privado y las cargas menos críticas pasen a la nube pública?"
  options:
  - id: a
    text:
      es: "La nube pública."
  - id: b
    correct: true
    text:
      es: "La nube híbrida."
  - id: c
    text:
      es: "La nube privada."
  - id: d
    text:
      es: "La multinube."
  explanation:
    es: "La página dice que la nube híbrida «combina modelos públicos y privados»: la información confidencial o regulada puede permanecer en un entorno privado y las cargas menos críticas se mueven a la nube pública. En la nube pública las organizaciones comparten recursos con otras personas, aunque aisladas en el nivel de datos. La nube privada está dedicada a una sola organización y no combina modelos. La multinube sirve para evitar el bloqueo del proveedor, optimizar costes o cumplir requisitos regionales."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q129
  prompt:
    es: "¿Cuál de las siguientes opciones es un beneficio del almacenamiento en la nube, según la página de Microsoft Azure?"
  options:
  - id: a
    correct: true
    text:
      es: "La rentabilidad: la organización solo paga por el almacenamiento que usa."
  - id: b
    text:
      es: "El gasto de capital inicial que supone comprar y mantener hardware propio."
  - id: c
    text:
      es: "Una capacidad fija, que no puede expandirse ni contraerse con la demanda."
  - id: d
    text:
      es: "Los datos alojados en un único servidor, sin replicar entre regiones."
  explanation:
    es: "Entre los beneficios, la página cita la rentabilidad: «las organizaciones solo pagan por el almacenamiento que usan, lo que evita el gasto de capital de comprar y mantener hardware». La página dice que se evita el gasto de capital de comprar y mantener hardware. La página dice que la capacidad puede expandirse o contraerse rápidamente. La página dice que los datos se distribuyen y replican entre servidores y regiones."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q130
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a la durabilidad en el almacenamiento en la nube, según la página de Microsoft Azure?"
  options:
  - id: a
    text:
      es: "La capacidad de ampliar o reducir el espacio según la demanda."
  - id: b
    correct: true
    text:
      es: "La capacidad de conservar los datos a lo largo del tiempo sin pérdida."
  - id: c
    text:
      es: "La capacidad de pagar solo por el almacenamiento que se usa."
  - id: d
    text:
      es: "La capacidad de recuperar las copias en ubicaciones independientes."
  explanation:
    es: "La página define la durabilidad como «la capacidad de conservar los datos a lo largo del tiempo sin pérdida», que se aumenta replicando los datos entre regiones. Ampliar o reducir el espacio según la demanda es la escalabilidad. Pagar solo por lo que se usa es la rentabilidad. Almacenar copias en ubicaciones independientes es lo que la página relaciona con mantener la disponibilidad."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q285
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes utilidades puede examinar y reparar volúmenes NTFS manteniéndolos en línea ante daños significativos del sistema de archivos?"
  options:
  - id: a
    correct: true
    text:
      es: "chkdsk"
  - id: b
    text:
      es: "format"
  - id: c
    text:
      es: "Format-Volume"
  - id: d
    text:
      es: "BitLocker"
  explanation:
    es: "La página indica que la utilidad chkdsk puede examinar y reparar volúmenes NTFS en línea. «format» sirve para dar formato a un volumen, no para repararlo en línea. «Format-Volume» es un cmdlet de PowerShell para dar formato, no la utilidad de reparación que cita la página. «BitLocker» cifra la unidad con la ayuda del TPM, no repara el sistema de archivos."
  citation: "fuente: `ms-win-ntfs.html`; «Para obtener daños más significativos en el sistema de archivos, la chkdsk utilidad puede examinar y reparar volúmenes NTFS mientras los mantiene en línea, lo que minimiza el tiempo de inactividad.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q286
  prompt:
    es: "En Windows 11, ¿qué característica de NTFS detecta y repara automáticamente daños menores en el sistema de archivos en segundo plano, sin desconectar el volumen?"
  options:
  - id: a
    correct: true
    text:
      es: "El NTFS de recuperación automática"
  - id: b
    text:
      es: "Las listas de control de acceso (ACL)"
  - id: c
    text:
      es: "Las cuotas de disco"
  - id: d
    text:
      es: "La compresión del sistema de archivos"
  explanation:
    es: "La página describe el NTFS de recuperación automática como la que repara daños menores en segundo plano. «Las listas de control de acceso (ACL)» asignan permisos detallados a archivos y carpetas, no reparan daños. «Las cuotas de disco» controlan el espacio que usa cada usuario, no reparan daños. «La compresión del sistema de archivos» maximiza los datos que caben en el volumen, no repara daños."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q287
  prompt:
    es: "En Windows 11, ¿qué protege BitLocker, el cifrado de unidad integrado con NTFS, aunque la unidad se quite e instale en otro sistema?"
  options:
  - id: a
    text:
      es: "Los permisos de acceso, que se heredan en el otro sistema"
  - id: b
    correct: true
    text:
      es: "Los datos de la unidad, mediante cifrado de dispositivo"
  - id: c
    text:
      es: "Las cuotas de disco de cada usuario del volumen"
  - id: d
    text:
      es: "La copia de seguridad automática en la nube"
  explanation:
    es: "La página indica que BitLocker protege los datos aunque se extraiga la unidad e instale en otro sistema. «Los permisos de acceso, que se heredan en el otro sistema» no es lo que dice la página, que habla de proteger los datos mediante cifrado. «Las cuotas de disco de cada usuario del volumen» no es lo que protege BitLocker según la página. «La copia de seguridad automática en la nube» no es lo que protege BitLocker según la página. Lo que dice la fuente: «protegiendo los datos incluso si se quita una unidad e instala en otro sistema»."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q288
  prompt:
    es: "En Windows 11, ¿cuál es el tamaño máximo de clúster que admite NTFS, con el que un volumen y un archivo pueden llegar a 8 PB, según la tabla de Microsoft?"
  options:
  - id: a
    text:
      es: "64 KB, el máximo anterior"
  - id: b
    text:
      es: "512 KB, de 2 PB"
  - id: c
    correct: true
    text:
      es: "2048 KB"
  - id: d
    text:
      es: "4 KB, el predeterminado"
  explanation:
    es: "La tabla da 2048 KB como tamaño máximo de clúster, con 8 PB de volumen y archivo. «64 KB, el máximo anterior» es el máximo anterior, que limita el volumen a 256 TB. «512 KB, de 2 PB» permite un volumen y un archivo de 2 PB, no de 8 PB. «4 KB, el predeterminado» es el tamaño predeterminado, que limita el volumen a 16 TB."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 3
  tags:
  - "cantidad"
