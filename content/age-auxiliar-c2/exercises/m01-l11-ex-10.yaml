# anchor: boe-a-2015-10565-art-31
- id: m01-l11-q141
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el registro electrónico de cada Administración u Organismo es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Permite la presentación de documentos solo en días hábiles, durante las veinticuatro horas."
  - id: b
    text:
      es: "Se rige, a efectos de plazos, por la fecha y hora del dispositivo desde el que se presenta."
  - id: c
    text:
      es: "Permite la presentación de documentos todos los días del año, en horario de oficina."
  - id: d
    correct: true
    text:
      es: "Permite la presentación de documentos todos los días del año durante las veinticuatro horas."
  explanation:
    es: "El artículo 31.2 dice que el registro electrónico «permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». No se limita a los días hábiles ni al horario de las oficinas. Para el cómputo de plazos rige «la fecha y hora oficial de la sede electrónica de acceso», no la del equipo del interesado."
  citation: "art. 31.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-10565-art-31
- id: m01-l11-q142
  prompt:
    es: "De acuerdo con el artículo 31.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la presentación por el interesado en un día inhábil, a efectos de un plazo en días hábiles:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entenderá realizada en la primera hora del primer día hábil siguiente, salvo que una norma permita la recepción en día inhábil."
  - id: b
    text:
      es: "Se entenderá realizada en la última hora del último día hábil anterior, salvo que una norma permita la recepción en día inhábil."
  - id: c
    text:
      es: "Se entenderá realizada en ese mismo día inhábil, a la hora que conste, salvo que una norma disponga otra cosa."
  - id: d
    text:
      es: "No será admitida por el registro electrónico hasta el día hábil siguiente, salvo que una norma permita la recepción en día inhábil."
  explanation:
    es: "El artículo 31.2.b) dice que la presentación en un día inhábil «se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil». No se retrotrae al último hábil anterior ni vale como hecha ese mismo día. El registro sí la admite: funciona todos los días del año durante las veinticuatro horas."
  citation: "art. 31.2.b) LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "efecto"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q144
  prompt:
    es: "De acuerdo con el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración, salvo precepto en contrario, podrá conceder una ampliación de los plazos establecidos:"
  options:
  - id: a
    text:
      es: "Que no exceda de la tercera parte de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: b
    correct: true
    text:
      es: "Que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: c
    text:
      es: "Que no exceda del doble de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: d
    text:
      es: "Que no exceda de la mitad de los mismos, solo a petición de los interesados y oídos los terceros."
  explanation:
    es: "El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero». El límite no es la tercera parte ni el doble. La ampliación cabe «de oficio o a petición de los interesados», no solo a petición, y la ley no exige oír a terceros."
  citation: "art. 32.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q146
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la ampliación de plazos es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá ser objeto de ampliación un plazo ya vencido."
  - id: b
    text:
      es: "Un plazo ya vencido podrá ampliarse si el interesado lo pide en los cinco días siguientes."
  - id: c
    text:
      es: "Contra el acuerdo que deniega la ampliación cabe recurso de alzada."
  - id: d
    text:
      es: "La decisión sobre la ampliación podrá adoptarse después de vencido el plazo, si se pidió antes."
  explanation:
    es: "El artículo 32.3 dice que «en ningún caso podrá ser objeto de ampliación un plazo ya vencido». No hay un margen de cinco días para pedirla después. La petición y la decisión deben producirse «antes del vencimiento del plazo», aunque la petición llegue a tiempo. Los acuerdos sobre ampliación o su denegación «no serán susceptibles de recurso», tampoco de alzada."
  citation: "art. 32.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-33
- id: m01-l11-q147
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la aplicación de la tramitación de urgencia a un procedimiento:"
  options:
  - id: a
    text:
      es: "Reduce a la mitad todos los plazos del procedimiento ordinario, incluidos los de presentación de solicitudes y recursos."
  - id: b
    correct: true
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: c
    text:
      es: "Reduce a la tercera parte los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: d
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de audiencia y prueba."
  explanation:
    es: "Con la tramitación de urgencia «se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos». Los plazos de solicitudes y recursos no se reducen. La reducción es a la mitad, no a la tercera parte, y la audiencia y la prueba no están exceptuadas."
  citation: "art. 33 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-33
- id: m01-l11-q148
  prompt:
    es: "Según el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento al que se aplica la tramitación de urgencia, ¿cuál es el plazo mínimo del trámite de audiencia?"
  options:
  - id: a
    text:
      es: "No inferior a diez días."
  - id: b
    text:
      es: "No inferior a siete días."
  - id: c
    correct: true
    text:
      es: "No inferior a cinco días."
  - id: d
    text:
      es: "No inferior a tres días."
  explanation:
    es: "En la tramitación ordinaria la audiencia dura un plazo no inferior a diez días ni superior a quince (art. 82.2). La urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (art. 33). La audiencia no está exceptuada, así que su mínimo pasa de diez a cinco días. Diez días es el mínimo ordinario, sin reducir. Siete días es el plazo de alegaciones tras las actuaciones complementarias (art. 87). Tres días no resulta de ninguna reducción a la mitad."
  citation: "art. 33 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-21
- id: m01-l11-q149
  prompt:
    es: "De acuerdo con el artículo 21.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración está obligada a dictar resolución expresa y a notificarla en todos los procedimientos, excepto:"
  options:
  - id: a
    text:
      es: "En la terminación por desistimiento o renuncia y en los relativos a derechos sometidos solo a declaración responsable o comunicación."
  - id: b
    text:
      es: "En la terminación por pacto o convenio y en los iniciados de oficio en que se haya producido la caducidad."
  - id: c
    text:
      es: "En la terminación por caducidad y en los relativos a derechos sometidos a autorización administrativa previa."
  - id: d
    correct: true
    text:
      es: "En la terminación por pacto o convenio y en los relativos a derechos sometidos solo a declaración responsable o comunicación."
  explanation:
    es: "El artículo 21.1 exceptúa «los supuestos de terminación del procedimiento por pacto o convenio, así como los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación». En el desistimiento, la renuncia y la caducidad sí hay que resolver: la resolución declara la circunstancia que concurra. Los derechos sometidos a autorización previa no están exceptuados."
  citation: "art. 21.1 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-21
- id: m01-l11-q150
  prompt:
    es: "Conforme al artículo 21.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para notificar la resolución expresa que fije la norma reguladora del procedimiento:"
  options:
  - id: a
    text:
      es: "No podrá exceder de seis meses en ningún caso, aunque una norma con rango de Ley o el Derecho de la Unión Europea prevean otro."
  - id: b
    text:
      es: "No podrá exceder de seis meses, salvo que una norma reglamentaria establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: c
    correct: true
    text:
      es: "No podrá exceder de seis meses, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: d
    text:
      es: "No podrá exceder de un año, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  explanation:
    es: "El artículo 21.2 dice que el plazo «no podrá exceder de seis meses salvo que una norma con rango de Ley establezca uno mayor o así venga previsto en el Derecho de la Unión Europea». El límite admite esas dos salvedades, así que no es absoluto. Un reglamento no puede superarlo. El límite es de seis meses, no de un año."
  citation: "art. 21.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-21
- id: m01-l11-q151
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuenta el plazo máximo para resolver en los procedimientos iniciados de oficio?"
  options:
  - id: a
    text:
      es: "Desde la notificación del acuerdo de iniciación."
  - id: b
    correct: true
    text:
      es: "Desde la fecha del acuerdo de iniciación."
  - id: c
    text:
      es: "Desde la publicación del acuerdo de iniciación."
  - id: d
    text:
      es: "Desde el día siguiente a la primera actuación de instrucción."
  explanation:
    es: "En los procedimientos iniciados de oficio el plazo se cuenta «desde la fecha del acuerdo de iniciación» (art. 21.3.a). No se cuenta desde su notificación ni desde su publicación, ni desde la primera actuación de instrucción."
  citation: "art. 21.3 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-21
- id: m01-l11-q153
  prompt:
    es: "Una solicitud entra el martes 31 de marzo de 2026 en el registro electrónico del órgano competente para tramitarla. Si su norma reguladora no fija plazo máximo, el último día para notificar la resolución es:"
  options:
  - id: a
    text:
      es: "El lunes 29 de junio de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 30 de junio de 2026."
  - id: c
    text:
      es: "El miércoles 1 de julio de 2026."
  - id: d
    text:
      es: "El miércoles 30 de septiembre de 2026."
  explanation:
    es: "El plazo supletorio es de tres meses, contados desde la entrada en el registro del órgano competente (art. 21.3). Los meses van de fecha a fecha, y junio no tiene día 31: el plazo expira el último día del mes (art. 30.4), el martes 30 de junio de 2026, que es hábil. El lunes 29 de junio termina un día antes. El miércoles 1 de julio pasa al mes siguiente, que la ley no prevé. El miércoles 30 de septiembre aplica seis meses."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m01-l11-q154
  prompt:
    es: "De acuerdo con el artículo 22.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si se solicitan informes preceptivos a otro órgano, el plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá necesariamente entre la petición y la recepción del informe, sin límite de tiempo alguno."
  - id: b
    correct: true
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión pueda exceder de tres meses."
  - id: c
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión exceda de seis meses."
  - id: d
    text:
      es: "Se ampliará en un tiempo igual al que medie entre la petición del informe preceptivo y su recepción."
  explanation:
    es: "El artículo 22.1.d) dice que el plazo «se podrá suspender» por el tiempo entre la petición y la recepción del informe, y que la suspensión «no podrá exceder en ningún caso de tres meses». La suspensión no es obligatoria ni ilimitada, y su tope no es de seis meses. La ley habla de suspensión, no de ampliación del plazo."
  citation: "art. 22.1.d) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-22
- id: m01-l11-q155
  prompt:
    es: "De acuerdo con el artículo 22.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los interesados promuevan la recusación, el transcurso del plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el propio recusado, previo informe."
  - id: b
    correct: true
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el superior jerárquico del recusado."
  - id: c
    text:
      es: "Podrá suspenderse, si el instructor lo acuerda, hasta que el recusado manifieste si concurre la causa."
  - id: d
    text:
      es: "No se suspenderá, porque las cuestiones incidentales no suspenden la tramitación."
  explanation:
    es: "El artículo 22.2.c) dice que el plazo se suspende cuando se promueve la recusación, «desde que ésta se plantee hasta que sea resuelta por el superior jerárquico del recusado». No la resuelve el recusado. La suspensión no depende del instructor. La recusación es justo la cuestión incidental que sí suspende la tramitación (art. 74)."
  citation: "art. 22.2.c) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-23
- id: m01-l11-q156
  prompt:
    es: "De acuerdo con el artículo 23 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, agotados los medios personales y materiales disponibles, la ampliación del plazo máximo de resolución y notificación:"
  options:
  - id: a
    text:
      es: "Se acordará de manera motivada, sin superar la mitad del plazo establecido, y contra ella no cabe recurso."
  - id: b
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido, y contra ella cabe recurso de alzada."
  - id: c
    text:
      es: "Se acordará sin necesidad de motivación, sin superar el plazo establecido, y contra ella no cabe recurso."
  - id: d
    correct: true
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido para la tramitación, y contra ella no cabe recurso."
  explanation:
    es: "El artículo 23 permite acordar «de manera motivada» la ampliación del plazo máximo, «no pudiendo ser éste superior al establecido para la tramitación del procedimiento», y contra ese acuerdo «no cabrá recurso alguno». El límite de la mitad del plazo es el de la ampliación de plazos del artículo 32.1, otra figura. No cabe alzada y la motivación es obligatoria."
  citation: "art. 23 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
