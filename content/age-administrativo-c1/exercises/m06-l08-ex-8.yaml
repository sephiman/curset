    text:
      es: "Establece el foco en el primer elemento de la barra de favoritos"
  - id: d
    text:
      es: "Abre Favoritos en un panel lateral"
  explanation:
    es: "Alt+Mayús+B establece el foco en el primer elemento de la barra de favoritos. Mostrar u ocultar la barra de favoritos es la función de Ctrl+Mayús+B. Guardar la pestaña actual como favorita es la función de Ctrl+D. Abrir Favoritos es la función de Ctrl+Mayús+O."
