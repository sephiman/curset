- id: m11-l04-q11
  prompt:
    en: A JUnit Jupiter test class is annotated with `@TestInstance(Lifecycle.PER_CLASS)`. Which statement about
      its test instances is correct according to the user guide?
  options:
  - id: a
    correct: true
    text:
      en: All test methods execute on the same test instance
  - id: b
    text:
      en: JUnit creates a new instance of the class before each test method, as in the default mode
  - id: c
    text:
      en: State in instance variables never needs resetting, because each method gets a fresh instance
  - id: d
    text:
      en: '`@BeforeAll` and `@AfterAll` must still be declared on static methods'
  explanation:
    en: All test methods execute on the same test instance, and a new instance is created once per test class. A
      new instance before each method is ruled out because that per-method lifecycle is the default, and `PER_CLASS`
      is the annotation chosen to run all methods on the same instance. Never resetting instance state is ruled
      out because tests that rely on state stored in instance variables may need to reset it in `@BeforeEach` or
      `@AfterEach`. Static-only lifecycle methods are ruled out because the per-class mode makes it possible to
      declare `@BeforeAll` and `@AfterAll` on non-static methods.
  citation: junit-writing-lifecycle#test-instance-lifecycle
- id: m11-l04-q13
  prompt:
    en: A Mockito mock of a class is created and none of its methods is stubbed. According to the Javadoc, what
      does a call to an unstubbed method that returns an `int` give?
  options:
  - id: a
    text:
      en: '`1`'
  - id: b
    text:
      en: '`-1`'
  - id: c
    text:
      en: '`Integer.MIN_VALUE`'
  - id: d
    correct: true
    text:
      en: '`0`'
  explanation:
    en: An unstubbed method that returns an `int` gives `0`, the default the Javadoc names for an `int` or `Integer`.
      The numbers `1`, `-1` and `Integer.MIN_VALUE` fail because the Javadoc names `0` as that default.
  citation: mockito-javadoc-source#2
