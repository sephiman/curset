# anchor: boe-a-1997-25336-art-11
- id: m01-l05-q030
  prompt:
    es: "¿Cuál de los siguientes es un requisito para ser miembro del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Ostentar la condición de Diputado o Senador en el momento del nombramiento."
  - id: b
    text:
      es: "Haber cumplido veinticinco años de edad en la fecha del nombramiento."
  - id: c
    text:
      es: "Ser funcionario de carrera de un cuerpo del subgrupo A1."
  - id: d
    correct: true
    text:
      es: "No estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme."
  explanation:
    es: "El artículo 11 exige ser español, mayor de edad, disfrutar de los derechos de sufragio activo y pasivo, «no estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme» y reunir los requisitos de idoneidad de la Ley 3/2015. No exige ser Diputado o Senador. La edad exigida es la mayoría de edad, no veinticinco años. No exige ser funcionario."
  citation: "art. 11 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q032
  prompt:
    es: "Según el artículo 99.3 de la Constitución Española de 1978, ¿qué mayoría necesita el candidato a la Presidencia del Gobierno en la primera votación de investidura?"
  options:
  - id: a
    text:
      es: "La mayoría simple de los miembros del Congreso de los Diputados."
  - id: b
    correct: true
    text:
      es: "La mayoría absoluta de los miembros del Congreso de los Diputados."
  - id: c
    text:
      es: "La mayoría de tres quintos de los miembros del Congreso de los Diputados."
  - id: d
    text:
      es: "La mayoría absoluta de los miembros de cada una de las Cámaras."
  explanation:
    es: "El artículo 99.3 dice que el Rey nombrará Presidente al candidato si el Congreso, «por el voto de la mayoría absoluta de sus miembros», le otorga su confianza. La mayoría simple basta solo en la segunda votación, cuarenta y ocho horas después. Los tres quintos no se exigen en la investidura. El Senado no vota la investidura."
  citation: "art. 99.3 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q033
  prompt:
    es: "De acuerdo con el artículo 99.3 de la Constitución Española de 1978, si el candidato no alcanza la mayoría absoluta, la misma propuesta se someterá a nueva votación:"
  options:
  - id: a
    text:
      es: "Veinticuatro horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  - id: b
    correct: true
    text:
      es: "Cuarenta y ocho horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  - id: c
    text:
      es: "Cuarenta y ocho horas después de la anterior, y la confianza exigirá de nuevo la mayoría absoluta del Congreso."
  - id: d
    text:
      es: "Cinco días después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  explanation:
    es: "El artículo 99.3 dice que la propuesta se someterá «a nueva votación cuarenta y ocho horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple». El plazo no es de veinticuatro horas ni de cinco días; cinco días es el plazo de la moción de censura (art. 113.3). En la segunda votación no se exige de nuevo la mayoría absoluta."
  citation: "art. 99.3 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "mayoría"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q034
  prompt:
    es: "¿Qué ocurre si, transcurridos dos meses desde la primera votación de investidura, ningún candidato ha obtenido la confianza del Congreso?"
  options:
  - id: a
    text:
      es: "El Rey disuelve el Congreso y convoca nuevas elecciones con el refrendo del Presidente del Gobierno en funciones."
  - id: b
    correct: true
    text:
      es: "El Rey disuelve ambas Cámaras y convoca nuevas elecciones con el refrendo del Presidente del Congreso."
  - id: c
    text:
      es: "El Rey disuelve ambas Cámaras y convoca nuevas elecciones con el refrendo del Presidente del Gobierno en funciones."
  - id: d
    text:
      es: "Queda investido Presidente el candidato que haya obtenido más votos en la última votación."
  explanation:
    es: "El artículo 99.5 dice que, en ese caso, «el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso». Se disuelven las dos Cámaras, no solo el Congreso. El refrendo es del Presidente del Congreso, no del Presidente del Gobierno en funciones. Nadie queda investido sin obtener la confianza del Congreso."
  citation: "art. 99.5 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-1978-31229-art-100
- id: m01-l05-q035
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de los miembros del Gobierno se ajusta a la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los Ministros son nombrados por el Rey, a propuesta del Presidente, y separados por el Congreso de los Diputados."
  - id: b
    text:
      es: "Los Vicepresidentes son nombrados por el Rey, previa votación de investidura en el Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Los demás miembros del Gobierno son nombrados y separados por el Rey, a propuesta de su Presidente."
  - id: d
    text:
      es: "Los Ministros son nombrados por el Presidente del Gobierno, previa deliberación del Consejo de Ministros."
  explanation:
    es: "El artículo 100 dice: «Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente». El Congreso no separa a los Ministros; exige la responsabilidad política del Gobierno en su conjunto (art. 113.1). Solo el candidato a Presidente se somete a investidura (art. 99). Los Ministros los nombra el Rey, no el Presidente, y la ley no exige deliberación del Consejo."
  citation: "art. 100 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-101
- id: m01-l05-q036
  prompt:
    es: "¿Cuál de las siguientes situaciones es causa de cese del Gobierno según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La dimisión o el fallecimiento de cualquiera de sus Vicepresidentes."
  - id: b
    correct: true
    text:
      es: "La dimisión o el fallecimiento de su Presidente."
  - id: c
    text:
      es: "La derrota del Gobierno en la votación de un proyecto de ley en el Congreso."
  - id: d
    text:
      es: "La aprobación de una moción en la que la Cámara manifieste su posición tras una interpelación."
  explanation:
    es: "El artículo 101.1 dice que el Gobierno cesa tras las elecciones generales, en los casos de pérdida de la confianza parlamentaria previstos en la Constitución, «o por dimisión o fallecimiento de su Presidente». La dimisión de un Vicepresidente no hace cesar al Gobierno. Perder la votación de un proyecto de ley no es uno de los casos de pérdida de la confianza parlamentaria previstos en la Constitución, que son la cuestión de confianza y la moción de censura (art. 114). La moción consecutiva a una interpelación (art. 111.2) solo manifiesta la posición de la Cámara."
  citation: "art. 101.1 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-101
- id: m01-l05-q037
  prompt:
    es: "Tras la celebración de elecciones generales el Gobierno cesa, pero el Gobierno cesante continuará en funciones:"
  options:
  - id: a
    text:
      es: "Hasta la votación de investidura del nuevo Presidente en el Congreso."
  - id: b
    text:
      es: "Hasta la constitución de las nuevas Cortes Generales tras las elecciones."
  - id: c
    correct: true
    text:
      es: "Hasta la toma de posesión del nuevo Gobierno."
  - id: d
    text:
      es: "Durante un plazo máximo de dos meses desde las elecciones."
  explanation:
    es: "El artículo 101.2 dice que el Gobierno cesante «continuará en funciones hasta la toma de posesión del nuevo Gobierno». La investidura y la constitución de las Cortes son pasos anteriores, y no ponen fin a las funciones. La Constitución no fija un plazo máximo de dos meses; los dos meses del artículo 99.5 se cuentan desde la primera votación de investidura."
  citation: "art. 101.2 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q038
  prompt:
    es: "De acuerdo con el artículo 21.3 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno en funciones limitará su gestión:"
  options:
  - id: a
    text:
      es: "A la aprobación de Reales Decretos-leyes, absteniéndose de adoptar cualesquiera otras medidas sin autorización del Congreso."
  - id: b
    correct: true
    text:
      es: "Al despacho ordinario de los asuntos públicos, absteniéndose de adoptar otras medidas salvo urgencia debidamente acreditada o razones de interés general."
  - id: c
    text:
      es: "Al despacho ordinario de los asuntos públicos, sin excepción alguna aunque concurran razones de urgencia."
  - id: d
    text:
      es: "A los asuntos que le autorice expresamente la Diputación Permanente del Congreso de los Diputados."
  explanation:
    es: "El artículo 21.3 dice que el Gobierno en funciones limitará su gestión «al despacho ordinario de los asuntos públicos», absteniéndose de adoptar otras medidas «salvo casos de urgencia debidamente acreditados o por razones de interés general cuya acreditación expresa así lo justifique». La ley no reduce su gestión a los Reales Decretos-leyes. Sí admite excepciones por urgencia o interés general. No depende de autorizaciones de la Diputación Permanente."
  citation: "art. 21.3 Ley 50/1997"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q039
  prompt:
    es: "Según el artículo 21.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué facultad tiene vedada el Presidente del Gobierno en funciones?"
  options:
  - id: a
    text:
      es: "Convocar y presidir las reuniones del Consejo de Ministros."
  - id: b
    text:
      es: "Impartir instrucciones a los demás miembros del Gobierno."
  - id: c
    text:
      es: "Representar al Gobierno en el ejercicio de sus funciones."
  - id: d
    correct: true
    text:
      es: "Plantear la cuestión de confianza ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 21.4 dice que el Presidente del Gobierno en funciones no podrá proponer la disolución de las Cámaras, «plantear la cuestión de confianza» ni proponer un referéndum consultivo. Convocar y presidir el Consejo, impartir instrucciones y representar al Gobierno son funciones del artículo 2.2 que el artículo 21.4 no le retira."
  citation: "art. 21.4 Ley 50/1997"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-108
- id: m01-l05-q040
  prompt:
    es: "¿Ante qué órgano responde el Gobierno solidariamente en su gestión política, según la regulación constitucional de sus relaciones con las Cortes Generales?"
  options:
  - id: a
    text:
      es: "Ante las Cortes Generales, reunidas en sesión conjunta."
  - id: b
    text:
      es: "Ante el Senado, como Cámara de representación territorial."
  - id: c
    text:
      es: "Ante el Rey, que nombra al Presidente del Gobierno."
  - id: d
    correct: true
    text:
      es: "Ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 108 dice: «El Gobierno responde solidariamente en su gestión política ante el Congreso de los Diputados». No responde ante las Cortes en sesión conjunta ni ante el Senado: la moción de censura y la cuestión de confianza son del Congreso (arts. 112 y 113). El Rey nombra al Presidente, pero el Gobierno no responde políticamente ante él."
  citation: "art. 108 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q041
  prompt:
    es: "¿Ante qué órgano será exigible, en su caso, la responsabilidad criminal del Presidente y los demás miembros del Gobierno?"
  options:
  - id: a
    text:
      es: "Ante la Sala de lo Penal de la Audiencia Nacional."
  - id: b
    text:
      es: "Ante el Pleno del Tribunal Constitucional."
  - id: c
    correct: true
    text:
      es: "Ante la Sala de lo Penal del Tribunal Supremo."
  - id: d
    text:
      es: "Ante la Sala de lo Civil y Penal del Tribunal Superior de Justicia."
  explanation:
    es: "El artículo 102.1 dice que la responsabilidad criminal del Presidente y los demás miembros del Gobierno «será exigible, en su caso, ante la Sala de lo Penal del Tribunal Supremo». No es competente la Audiencia Nacional ni un Tribunal Superior de Justicia. El Tribunal Constitucional no juzga responsabilidades penales."
  citation: "art. 102.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q042
  prompt:
    es: "De acuerdo con el artículo 102.2 de la Constitución Española de 1978, si la acusación fuere por traición o por cualquier delito contra la seguridad del Estado en el ejercicio de sus funciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo podrá ser planteada por iniciativa de la cuarta parte de los miembros del Congreso, y con la aprobación de la mayoría absoluta del mismo."
  - id: b
    text:
      es: "Solo podrá ser planteada por iniciativa de la décima parte de los miembros del Congreso, y con la aprobación de la mayoría absoluta del mismo."
  - id: c
    text:
      es: "Solo podrá ser planteada por iniciativa de la cuarta parte de los miembros del Congreso, y con la aprobación de la mayoría de tres quintos del mismo."
  - id: d
    text:
      es: "Solo podrá ser planteada por iniciativa de la cuarta parte de los miembros de cada Cámara, y con la aprobación de la mayoría absoluta de las Cortes."
  explanation:
    es: "El artículo 102.2 dice que la acusación «sólo podrá ser planteada por iniciativa de la cuarta parte de los miembros del Congreso, y con la aprobación de la mayoría absoluta del mismo». La décima parte es la que propone la moción de censura (art. 113.2). La aprobación exige mayoría absoluta, no tres quintos. Interviene solo el Congreso, no las dos Cámaras."
  citation: "art. 102.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q044
  prompt:
    es: "Señale la respuesta correcta sobre las funciones y actividades que pueden ejercer los miembros del Gobierno según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Pueden ejercer una actividad profesional, siempre que no sea retribuida."
  - id: b
    text:
      es: "Pueden ejercer una función pública que no derive de su cargo, con autorización del Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "Pueden ejercer las funciones representativas propias del mandato parlamentario."
  - id: d
    text:
      es: "Pueden ejercer una actividad mercantil, previa declaración ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 98.3 dice que los miembros del Gobierno no podrán ejercer «otras funciones representativas que las propias del mandato parlamentario», así que estas sí pueden ejercerlas. El mismo apartado prohíbe «actividad profesional o mercantil alguna», sea o no retribuida y con o sin declaración. También prohíbe «cualquier otra función pública que no derive de su cargo», sin admitir autorización."
  citation: "art. 98.3 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
