# anchor: fuente-ms-office-cinta-html
- id: m06-l05-q376
  prompt:
    es: "Señale el método abreviado de Excel 365 que contrae la cinta de opciones cuando está expandida:"
  options:
  - id: a
    text:
      es: "Alt+F1"
  - id: b
    text:
      es: "F10"
  - id: c
    text:
      es: "Ctrl+F2"
  - id: d
    correct: true
    text:
      es: "Ctrl+F1"
  explanation:
    es: "La página dice, para contraer la cinta expandida: «Presione CTRL+F1». «Alt+F1» crea un gráfico incrustado a partir de los datos del rango actual. «F10» activa la barra de menús. «Ctrl+F2» edita la celda activa en la barra de fórmulas. Ninguna contrae la cinta."
  citation: "fuente: `ms-office-cinta.html`; «Ocultar o mostrar la cinta de opciones»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-office-cinta-html
- id: m06-l05-q377
  prompt:
    es: "En Excel 365, ¿qué ocurre con las personalizaciones de la cinta de opciones respecto a las demás aplicaciones de Office?"
  options:
  - id: a
    text:
      es: "Se aplican a todas las aplicaciones de Office del equipo"
  - id: b
    correct: true
    text:
      es: "Solo se aplican al programa en el que se hicieron"
  - id: c
    text:
      es: "Se aplican a todas las aplicaciones que usan la misma cuenta"
  - id: d
    text:
      es: "Se aplican solo al libro que está abierto"
  explanation:
    es: "La página dice: «las personalizaciones solo se aplican al programa de Office en el que está trabajando en ese momento». «Se aplican a todas las aplicaciones de Office del equipo» y «se aplican a todas las aplicaciones que usan la misma cuenta» lo contradicen: la página pone el ejemplo de personalizar PowerPoint sin que los cambios se vean en otro programa. «Se aplican solo al libro que está abierto» tampoco: el ámbito es el programa, no el libro."
  citation: "fuente: `ms-office-cinta.html`; «Lo que puede personalizar»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-cinta-html
- id: m06-l05-q379
  prompt:
    es: "En Excel 365, ¿qué ocurre al importar un archivo de personalización de la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Se combinan con las personalizaciones existentes"
  - id: b
    text:
      es: "Solo se pierde la personalización anterior de la barra de herramientas de acceso rápido de Excel"
  - id: c
    text:
      es: "Se conservan las anteriores como una copia de seguridad en el equipo"
  - id: d
    correct: true
    text:
      es: "Se pierden las personalizaciones anteriores de la cinta y de la barra de acceso rápido"
  explanation:
    es: "La página dice: «Al importar un archivo de personalización de la cinta de opciones, perderá todas las personalizaciones anteriores de la cinta y de la barra de herramientas de acceso rápido». «Se combinan con las personalizaciones existentes» contradice que se pierdan. «Solo se pierde la personalización anterior de la barra de herramientas de acceso rápido de Excel» omite la cinta, que también se pierde. «Se conservan las anteriores como una copia de seguridad en el equipo» tampoco consta: la página dice que se pierden."
  citation: "fuente: `ms-office-cinta.html`; «Compartir una cinta personalizada con otro usuario u otro equipo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l05-q380
  prompt:
    es: "En Excel 365, ¿qué caracteriza a los comandos de la barra de herramientas de acceso rápido en Excel?"
  options:
  - id: a
    text:
      es: "Cambian según la pestaña activa de la cinta"
  - id: b
    text:
      es: "Solo pueden ser comandos de la pestaña Inicio"
  - id: c
    text:
      es: "Se aplican solo al libro que está abierto"
  - id: d
    correct: true
    text:
      es: "Son independientes de la pestaña que se muestra en la cinta"
  explanation:
    es: "La página dice: la barra «contiene un conjunto de comandos que son independientes de la pestaña que se muestra actualmente en la cinta de opciones». Por eso «cambian según la pestaña activa de la cinta» es lo contrario, y «solo pueden ser comandos de la pestaña Inicio» también, ya que no dependen de ninguna pestaña. «Se aplican solo al libro que está abierto» no es una característica que la página les atribuya."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l05-q381
  prompt:
    es: "En Excel 365, ¿cómo se agrega a la barra de herramientas de acceso rápido un comando que está en la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Botón derecho en el comando y Personalizar la cinta de opciones en el menú contextual"
  - id: b
    correct: true
    text:
      es: "Botón derecho en el comando y Agregar a la barra de herramientas de acceso rápido"
  - id: c
    text:
      es: "Doble clic en la pestaña que contiene el comando"
  - id: d
    text:
      es: "Botón derecho en la cinta y Ocultar barra de herramientas de acceso rápido"
  explanation:
    es: "La página dice: «Haga clic con el botón derecho en el comando y después seleccione Agregar a la barra de herramientas de acceso rápido en el menú contextual». «Botón derecho en el comando y Personalizar la cinta de opciones» no es esa orden: Personalizar la cinta se usa para organizar pestañas y comandos de la cinta. «Doble clic en la pestaña que contiene el comando» expande o contrae la cinta, según la página. «Botón derecho en la cinta y Ocultar barra de herramientas de acceso rápido» oculta toda la barra, no agrega un comando."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Agregar un comando a la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l05-q382
  prompt:
    es: "En Excel 365, ¿cuál es la única forma de aumentar el tamaño de los botones de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Activar una opción de tamaño en Microsoft Office"
  - id: b
    text:
      es: "Mostrar la barra en varias líneas"
  - id: c
    correct: true
    text:
      es: "Bajar la resolución de pantalla"
  - id: d
    text:
      es: "Arrastrar el borde de la barra"
  explanation:
    es: "La página dice: «La única forma de aumentar el tamaño de los botones es bajar la resolución de pantalla que se usa». «Activar una opción de tamaño en Microsoft Office» la contradice: la página dice que no se puede con una opción. «Mostrar la barra en varias líneas» tampoco: «No puede mostrar la barra de herramientas de acceso rápido en varias líneas». «Arrastrar el borde de la barra» no lo cita la página, que da una única forma."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
  - "concepto"
