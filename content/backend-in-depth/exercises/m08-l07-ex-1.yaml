type: quiz
variants:
- id: m08-l07-q01
  prompt:
    en: In Kafka Streams, which statement about hopping windows is correct, given that they are defined by a window
      size and an advance interval?
  options:
  - id: a
    correct: true
    text:
      en: A data record may belong to more than one window, because hopping windows can overlap
  - id: b
    text:
      en: A hopping window is defined by its size alone, without an advance interval
  - id: c
    text:
      en: Kafka Streams uses the name hopping window for what it calls a sliding window
  - id: d
    text:
      en: Hopping windows are aligned to the timestamp of the first record, not to the epoch
  explanation:
    en: A record may belong to more than one hopping window, because hopping windows can overlap. A window defined
      by its size alone is wrong, because a hopping window has two properties, the size and the advance interval.
      Using the name for sliding windows is wrong, because Kafka Streams follows the academic terminology where
      sliding windows have different semantics. Alignment to the first record is wrong, because hopping windows
      are aligned to the epoch.
  citation: kafka-streams-dsl-api#hopping-time-windows
  extract:
    en: Since hopping windows can overlap - and in general they do - a data record may belong to more than one such
      windows.
- id: m08-l07-q02
  prompt:
    en: In Kafka Streams session windows, what happens to an event that falls outside the inactivity gap of every
      existing session for its key?
  options:
  - id: a
    text:
      en: The event is merged into the nearest existing session
  - id: b
    text:
      en: The event is dropped, because every session has a fixed size
  - id: c
    correct: true
    text:
      en: A new session is created for the event
  - id: d
    text:
      en: The event extends the session with the latest end time, whatever the gap
  explanation:
    en: An event outside the session gap creates a new session. Merging into the nearest session is wrong, because
      only events that fall within the inactivity gap of an existing session are merged. Dropping the event is wrong,
      because session window sizes vary, even for the same key. Extending the latest session regardless of the gap
      is wrong, because sessions are periods of activity separated by a defined gap of inactivity.
  citation: kafka-streams-dsl-api#session-windows
  extract:
    en: If an event falls outside of the session gap, then a new session will be created.
- id: m08-l07-q03
  prompt:
    en: In a Kafka Streams hourly window with a grace period of 10 minutes, until what time does the 09:00 to 10:00
      window accept out-of-order records?
  options:
  - id: a
    text:
      en: '10:00'
  - id: b
    text:
      en: '10:30'
  - id: c
    correct: true
    text:
      en: '10:10'
  - id: d
    text:
      en: '11:00'
  explanation:
    en: The window accepts out-of-order records until 10:10, when it is closed. 10:00, 10:30 and 11:00 are all excluded,
      because the documentation gives 10:10 as the point at which the 09:00 to 10:00 window is closed under a 10-minute
      grace period.
  citation: kafka-streams-dsl-api#window-final-results
  extract:
    en: the 09:00 to 10:00 window will accept out-of-order records until 10:10, at which point, the window is closed.
- id: m08-l07-q04
  prompt:
    en: In Flink, what does a `Watermark(t)` flowing through a stream declare about event time and the elements
      that can still arrive?
  options:
  - id: a
    text:
      en: The wall clock of the machine has reached t, so processing of earlier elements has finished
  - id: b
    text:
      en: No element with a timestamp at or below t can ever arrive again, and Flink guarantees it
  - id: c
    text:
      en: The operator has received exactly t elements since the previous watermark
  - id: d
    correct: true
    text:
      en: Event time has reached t, so no more elements with a timestamp at or below t should arrive
  explanation:
    en: A `Watermark(t)` declares that event time has reached t, so no more elements with a timestamp at or below
      t should arrive. The wall clock reading is wrong, because event time can progress independently of processing
      time. A guarantee that nothing late arrives is wrong, because certain elements can violate the watermark condition.
      An element count is wrong, because a watermark is a declaration about timestamps, that all events up to a
      certain timestamp should have arrived.
  citation: flink-time#event-time-and-watermarks
- id: m08-l07-q05
  prompt:
    en: A Flink operator consumes several input streams, for example after a `keyBy(…)` function. How does Flink
      define the current event time of that operator?
  options:
  - id: a
    correct: true
    text:
      en: The minimum of its input streams' event times
  - id: b
    text:
      en: The maximum of its input streams' event times
  - id: c
    text:
      en: The average of its input streams' event times
  - id: d
    text:
      en: The event time of the input stream that delivered a watermark last
  explanation:
    en: The current event time of such an operator is the minimum of its input streams' event times. The maximum,
      the average and the event time of the last stream to deliver a watermark are all excluded, because the documentation
      defines it as the minimum.
  citation: flink-time#watermarks-in-parallel-streams
- id: m08-l07-q06
  prompt:
    en: A Kafka Streams application sums the values per user over a `KStream` that receives the records (alice,
      1) and then (alice, 3). What does the sum for alice equal?
  options:
  - id: a
    correct: true
    text:
      en: '4'
  - id: b
    text:
      en: '3'
  - id: c
    text:
      en: '1'
  - id: d
    text:
      en: '7'
  explanation:
    en: A `KStream` record is an insert, so the sum for alice is 4. A sum of 3 is wrong, because the second record
      would not be considered an update of the previous record, which is what a `KTable` does. A sum of 1 and a
      sum of 7 are both excluded, because the documentation gives 4 as the sum for alice.
  citation: kafka-streams-dsl-api#kstream
  extract:
    en: If your stream processing application were to sum the values per user, it would return 4 for alice.
- id: m08-l07-q07
  prompt:
    en: Which statement about co-partitioning of the input topics for an equi-join in Kafka Streams is correct,
      according to the Kafka documentation?
  options:
  - id: a
    correct: true
    text:
      en: The input topics of the join must have the same number of partitions
  - id: b
    text:
      en: Kafka Streams verifies at runtime that the partitioning strategy of both sides matches
  - id: c
    text:
      en: A `KTable`-`KTable` foreign-key join needs co-partitioned inputs like any other join
  - id: d
    text:
      en: A `KStream`-`GlobalKTable` join needs co-partitioning, because each instance holds only some partitions
  explanation:
    en: The input topics of an equi-join must have the same number of partitions. A runtime check of the partitioning
      strategy is wrong, because Kafka Streams cannot verify whether the partitioning strategy matches. Co-partitioning
      for a foreign-key join is wrong, because `KTable`-`KTable` foreign-key joins do not require it. Co-partitioning
      for a `GlobalKTable` join is wrong, because each instance has a full copy of the changelog stream.
  citation: kafka-streams-dsl-api#join-co-partitioning-requirements
  extract:
    en: The input topics of the join (left side and right side) must have the same number of partitions.
- id: m08-l07-q08
  prompt:
    en: A Kafka Streams application reads one input topic with 5 partitions, and 8 instances of the application
      are started. What happens to the 3 instances beyond the number of partitions?
  options:
  - id: a
    text:
      en: They share the partitions with the others by reading parts of each partition
  - id: b
    text:
      en: Kafka Streams refuses to start them and throws an exception
  - id: c
    correct: true
    text:
      en: They launch but remain idle
  - id: d
    text:
      en: Kafka Streams adds partitions to the input topic so that they have work
  explanation:
    en: The excess instances launch but remain idle. Sharing partitions is wrong, because the assignment of partitions
      to tasks never changes and each task is a fixed unit of parallelism. Refusing to start them is wrong, because
      the excess instances launch. Adding partitions is wrong, because Kafka Streams creates a fixed number of tasks
      based on the input stream partitions.
  citation: kafka-streams-architecture#stream-partitions-and-tasks
  extract:
    en: the “excess” app instances will launch but remain idle
- id: m08-l07-q09
