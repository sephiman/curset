  - id: d
    text:
      es: "Cuando obtiene un puesto de libre designación de nivel superior a su grado."
  explanation:
    es: "El artículo 70.2 del Real Decreto 364/1995 aplica esa regla a «los funcionarios que obtengan un puesto de trabajo superior en más de dos niveles al correspondiente a su grado personal». Con uno o dos niveles de diferencia rige la regla general y se consolida el nivel del puesto. Seguir en un puesto del mismo nivel no sube el grado. El sistema de provisión no cuenta: lo que importa es la diferencia de niveles."
