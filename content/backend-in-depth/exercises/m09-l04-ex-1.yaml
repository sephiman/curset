- id: m09-l04-q05
  prompt:
    en: In the `RateLimit` header fields draft, what does the `w` parameter of a quota policy item hold?
  options:
  - id: a
    text:
      en: An integer number of milliseconds, so sub-second windows are possible
  - id: b
    correct: true
    text:
      en: A non-negative, non-zero integer interval in seconds
  - id: c
    text:
      en: An integer number of minutes
  - id: d
    text:
      en: A UNIX timestamp marking when the window ends
  explanation:
