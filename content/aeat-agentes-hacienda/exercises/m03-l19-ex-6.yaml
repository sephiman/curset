# anchor: boe-a-1992-28740-art-92
- id: m03-l19-q0194
  prompt:
    es: "Señale la respuesta CORRECTA sobre las cuotas deducibles conforme al artículo 92.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Los sujetos pasivos pueden deducir las cuotas de entregas efectuadas por quien no sea sujeto pasivo del impuesto, si figuran en factura."
  - id: b
    text:
      es: "Los sujetos pasivos pueden deducir solo las cuotas soportadas por repercusión directa, sin que alcance a las adquisiciones intracomunitarias de bienes."
  - id: c
    text:
      es: "Los sujetos pasivos pueden deducir las cuotas soportadas por repercusión directa, aunque se hayan devengado fuera del territorio de aplicación del impuesto."
  - id: d
    correct: true
    text:
      es: "Los sujetos pasivos pueden deducir las cuotas soportadas por repercusión directa o correspondientes a adquisiciones intracomunitarias de bienes definidas en los artículos 13, número 1.º, y 16."
  explanation:
    es: "Además de las cuotas soportadas por repercusión directa, son deducibles las correspondientes a las adquisiciones intracomunitarias del artículo 92.Uno.4.º. Las cuotas deben devengarse en el territorio de aplicación, y las entregas han de ser de otro sujeto pasivo."
  citation: "art. 92.Uno LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "cuotas deducibles"
