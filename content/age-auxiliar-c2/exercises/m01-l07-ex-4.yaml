# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q047
  prompt:
    es: "¿Cuál de los siguientes forma parte de la Comisión de Transparencia y Buen Gobierno según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Un representante de la Autoridad Independiente de Responsabilidad Fiscal"
  - id: b
    text:
      es: "Un representante del Consejo General del Poder Judicial"
  - id: c
    text:
      es: "Un representante de la Secretaría de Estado de Presupuestos y Gastos"
  - id: d
    text:
      es: "Un representante del Pleno del Consejo de Estado, a propuesta de su Presidente"
  explanation:
    es: "La letra h) del artículo 36.2 incluye en la Comisión a «un representante de la Autoridad Independiente de Responsabilidad Fiscal». La lista no incluye al Consejo General del Poder Judicial ni al Consejo de Estado. La Secretaría de Estado que la ley menciona es la de Administraciones Públicas, no la de Presupuestos y Gastos."
  citation: "art. 36.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q048
  prompt:
    es: "De acuerdo con el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Presidente del Consejo de Transparencia y Buen Gobierno será nombrado:"
  options:
  - id: a
    correct: true
    text:
      es: "Por un período no renovable de cinco años mediante Real Decreto"
  - id: b
    text:
      es: "Por un período de cinco años, renovable una sola vez, mediante Real Decreto"
  - id: c
    text:
      es: "Por un período no renovable de seis años mediante Real Decreto"
  - id: d
    text:
      es: "Por un período de tres años, renovable, mediante Orden ministerial"
  explanation:
    es: "El artículo 37.1 dice que el Presidente «será nombrado por un período no renovable de cinco años mediante Real Decreto». El mandato no es renovable. No dura seis ni tres años. El nombramiento se hace por Real Decreto, no por Orden ministerial."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q049
  prompt:
    es: "Según el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿cómo refrenda el Congreso de los Diputados el nombramiento del Presidente del Consejo de Transparencia y Buen Gobierno?"
  options:
  - id: a
    text:
      es: "En sesión plenaria, por mayoría de tres quintos, en el plazo de dos meses"
  - id: b
    text:
      es: "A través de la Comisión competente, por mayoría simple de los presentes, en el plazo de un mes natural"
  - id: c
    correct: true
    text:
      es: "A través de la Comisión competente, por mayoría absoluta, en el plazo de un mes natural"
  - id: d
    text:
      es: "A través de la Comisión competente, por mayoría absoluta, en el plazo de quince días"
  explanation:
    es: "El artículo 37.1 dice que el Congreso, «a través de la Comisión competente y por acuerdo adoptado por mayoría absoluta», refrenda el nombramiento «en el plazo de un mes natural» desde la comunicación. No lo hace el Pleno ni por tres quintos. No basta la mayoría simple. El plazo no es de quince días."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "mayoría"
  - "plazo"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q050
  prompt:
    es: "De acuerdo con el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Presidente del Consejo cesa por expiración de su mandato, a petición propia o:"
  options:
  - id: a
    text:
      es: "Por separación acordada por el Congreso de los Diputados por mayoría absoluta"
  - id: b
    correct: true
    text:
      es: "Por separación acordada por el Gobierno, previa instrucción del procedimiento correspondiente"
  - id: c
    text:
      es: "Por separación acordada libremente por el Ministro que propuso su nombramiento"
  - id: d
    text:
      es: "Por separación acordada por la Comisión de Transparencia y Buen Gobierno"
  explanation:
    es: "El artículo 37.2 prevé el cese «por separación acordada por el Gobierno, previa instrucción del correspondiente procedimiento», y solo por las causas que enumera. El Congreso refrenda el nombramiento, pero no separa al Presidente. El Ministro instruye el procedimiento, pero no acuerda la separación, y menos libremente. La Comisión no tiene esta función."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-39
- id: m01-l07-q051
  prompt:
    es: "¿Qué órgano aprueba el Estatuto del Consejo de Transparencia y Buen Gobierno, y mediante qué norma, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Ministros, mediante Real Decreto"
  - id: b
    text:
      es: "El Ministro de Hacienda, mediante Orden ministerial"
  - id: c
    text:
      es: "Las Cortes Generales, mediante ley ordinaria"
  - id: d
    text:
      es: "La Comisión de Transparencia y Buen Gobierno, mediante resolución"
  explanation:
    es: "El artículo 39.2 dice que «el Consejo de Ministros aprobará mediante Real Decreto el Estatuto del Consejo de Transparencia y Buen Gobierno». No lo aprueba un ministro por orden, ni las Cortes por ley, ni la propia Comisión."
  citation: "art. 39.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q053
  prompt:
    es: "Según el artículo 36 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué miembros de la Comisión de Transparencia y Buen Gobierno tienen derecho a remuneración?"
  options:
  - id: a
    text:
      es: "Todos sus miembros, en la cuantía que fije el Estatuto del Consejo"
  - id: b
    text:
      es: "Los vocales que no sean Diputados ni Senadores, por su dedicación exclusiva"
  - id: c
    correct: true
    text:
      es: "Únicamente el Presidente"
  - id: d
    text:
      es: "El Presidente y los representantes del Tribunal de Cuentas y del Defensor del Pueblo"
  explanation:
    es: "El artículo 36.3 dice que ser miembro de la Comisión «no exigirá dedicación exclusiva ni dará derecho a remuneración con excepción de lo previsto en el artículo siguiente». El artículo siguiente fija las retribuciones del Presidente del Consejo (art. 37.3), que es el único retribuido. Los demás miembros no cobran, sea cual sea la institución que los propone, y la ley no les exige dedicación exclusiva."
  citation: "art. 36.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "composición"
  - "excepción"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q054
  prompt:
    es: "¿Cuál de las siguientes es causa de separación del Presidente del Consejo de Transparencia y Buen Gobierno, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La pérdida de la confianza del Gobierno que propuso su nombramiento"
  - id: b
    text:
      es: "La condena por cualquier delito, aunque se haya cometido por imprudencia"
  - id: c
    text:
      es: "La renovación de las Cortes Generales tras la celebración de elecciones"
  - id: d
    correct: true
    text:
      es: "La incompatibilidad sobrevenida"
  explanation:
    es: "El artículo 37.2 solo permite la separación por «incumplimiento grave de sus obligaciones, incapacidad permanente para el ejercicio de su función, incompatibilidad sobrevenida o condena por delito doloso». La pérdida de confianza no está en la lista: el mandato es de cinco años no renovables y no depende del Gobierno. La condena tiene que ser por delito doloso, no por uno imprudente. La renovación de las Cortes no es causa de cese."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-2
- id: m01-l07-q055
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las disposiciones del título I se aplican, entre otros sujetos, a:"
  options:
  - id: a
    text:
      es: "Las universidades privadas."
  - id: b
    text:
      es: "Las comunidades de propietarios."
  - id: c
    text:
      es: "Las cofradías y hermandades religiosas."
  - id: d
    correct: true
    text:
      es: "Las Universidades públicas."
  explanation:
    es: "El título I se aplica a las entidades de Derecho Público con personalidad jurídica propia vinculadas a las Administraciones o dependientes de ellas, entre las que el artículo 2.1.d) incluye las Universidades públicas. Las universidades privadas, las comunidades de propietarios y las cofradías y hermandades religiosas no son sujetos del ámbito del artículo 2.1."
  citation: "art. 2.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2013-12887-art-2
- id: m01-l07-q056
  prompt:
    es: "Señale en qué medida quedan sujetas las corporaciones de Derecho Público a las disposiciones del título I, conforme al artículo 2.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "En todas sus actividades, sin distinción."
  - id: b
    correct: true
    text:
      es: "En lo relativo a sus actividades sujetas a Derecho Administrativo."
  - id: c
    text:
      es: "Solo cuando reciban subvenciones públicas."
  - id: d
    text:
      es: "Únicamente respecto de su organización interna."
  explanation:
    es: "El artículo 2.1.e) aplica el título I a las corporaciones de Derecho Público en lo relativo a sus actividades sujetas a Derecho Administrativo. No se les aplica en todas sus actividades. Tampoco depende de que reciban subvenciones, que es el criterio del artículo 3 para las entidades privadas, ni se limita a su organización interna."
  citation: "art. 2.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-2
- id: m01-l07-q057
  prompt:
    es: "Conforme al artículo 2.1.g) de la Ley 19/2013, de 9 de diciembre, el título I se aplica a las sociedades mercantiles cuando la participación, directa o indirecta, de las entidades del artículo 2 en su capital social sea:"
  options:
  - id: a
    correct: true
    text:
      es: "Superior al 50 por 100."
  - id: b
    text:
      es: "Igual o superior al 25 por 100."
  - id: c
    text:
      es: "Superior al 75 por 100."
  - id: d
    text:
      es: "Del 100 por 100."
  explanation:
    es: "Entran en el ámbito del título I las sociedades mercantiles en cuyo capital social la participación directa o indirecta de las entidades del artículo 2 sea superior al 50 por 100. Un 25 por 100 o más no basta. Exigir más del 75 por 100 o el 100 por 100 es subir el umbral por encima del que fija la ley."
  citation: "art. 2.1.g) Ley 19/2013"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2013-12887-art-3
- id: m01-l07-q058
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las disposiciones del capítulo de publicidad activa son aplicables, además de a los sujetos del ámbito subjetivo del título I, a:"
  options:
  - id: a
    text:
      es: "Los partidos políticos y las fundaciones privadas, pero no los sindicatos."
  - id: b
    text:
      es: "Solo los partidos políticos que concurran a elecciones."
  - id: c
    correct: true
    text:
      es: "Los partidos políticos, las organizaciones sindicales y las organizaciones empresariales."
  - id: d
    text:
      es: "Las asociaciones y fundaciones declaradas de utilidad pública."
  explanation:
    es: "El artículo 3.a) somete a la publicidad activa a los partidos políticos, las organizaciones sindicales y las organizaciones empresariales, sin más condición. La opción que deja fuera a los sindicatos y añade las fundaciones privadas altera la lista. Limitar la obligación a los partidos que concurran a elecciones añade un requisito que la ley no pone. Las asociaciones y fundaciones de utilidad pública no figuran en el artículo 3.a)."
  citation: "art. 3 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2013-12887-art-6
- id: m01-l07-q061
  prompt:
    es: "¿Cuál de las siguientes opciones completa los datos que, junto a la identidad de los responsables de los órganos, incluye el organigrama de los sujetos del título I, según la Ley 19/2013, de 9 de diciembre?"
  options:
  - id: a
    text:
      es: "Retribución y régimen de incompatibilidades."
  - id: b
    text:
      es: "Domicilio y horario de atención al público."
  - id: c
    text:
      es: "Situación patrimonial y declaración de bienes."
  - id: d
    correct: true
    text:
      es: "Perfil y trayectoria profesional."
  explanation:
    es: "El organigrama debe identificar a los responsables de los diferentes órganos y su perfil y trayectoria profesional. La retribución es información económica del artículo 8, y la situación patrimonial no se exige en el organigrama. El domicilio y el horario de atención tampoco son datos que el artículo 6.1 pida."
  citation: "art. 6.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
  - "estructura"
# anchor: boe-a-2013-12887-art-6
- id: m01-l07-q062
  prompt:
    es: "Según el artículo 6.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las Administraciones Públicas publicarán los planes y programas anuales y plurianuales en los que se fijen:"
  options:
  - id: a
    correct: true
    text:
      es: "Objetivos concretos, así como las actividades, medios y tiempo previsto para su consecución."
  - id: b
    text:
      es: "Las líneas generales de política presupuestaria y el estado de ejecución del gasto."
  - id: c
    text:
      es: "Los criterios de selección de personal y los plazos de las convocatorias."
  - id: d
    text:
      es: "Los objetivos generales de la legislatura y las competencias de cada órgano."
  explanation:
    es: "Los planes y programas publicados fijan objetivos concretos, con las actividades, medios y tiempo previsto para su consecución. La política presupuestaria y su ejecución son información del artículo 8, los criterios de selección de personal no forman parte de esos planes y los objetivos generales de la legislatura no son los objetivos concretos que exige el artículo."
  citation: "art. 6.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
  - "concepto"
# anchor: boe-a-2013-12887-art-7
- id: m01-l07-q063
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los documentos que deban someterse a un período de información pública durante su tramitación se publican dentro de la información:"
  options:
  - id: a
    text:
      es: "Institucional, organizativa y de planificación."
  - id: b
    correct: true
    text:
      es: "De relevancia jurídica."
  - id: c
    text:
      es: "Económica, presupuestaria y estadística."
  - id: d
    text:
      es: "Sobre el ejercicio del derecho de acceso."
  explanation:
    es: "El artículo 7.e) incluye esos documentos entre la información de relevancia jurídica. La información institucional, organizativa y de planificación es la del artículo 6, la económica, presupuestaria y estadística es la del artículo 8, y el ejercicio del derecho de acceso no es un bloque de publicidad activa."
  citation: "art. 7 Ley 19/2013"
  difficulty: 1
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2013-12887-art-7
- id: m01-l07-q064
  prompt:
    es: "Según el artículo 7 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las Administraciones Públicas publican las directrices, instrucciones, acuerdos o circulares en la medida en que supongan:"
  options:
  - id: a
    correct: true
    text:
      es: "Una interpretación del Derecho o tengan efectos jurídicos."
  - id: b
    text:
      es: "Una modificación de su estructura orgánica."
  - id: c
    text:
      es: "Una asignación de competencias entre sus órganos."
  - id: d
    text:
      es: "Una limitación del derecho de acceso a la información pública solicitada."
  explanation:
    es: "El artículo 7.a) manda publicar las directrices, instrucciones, acuerdos, circulares o respuestas a consultas cuando supongan una interpretación del Derecho o tengan efectos jurídicos. Que modifiquen la estructura orgánica, asignen competencias o limiten el acceso no es el criterio del artículo."
  citation: "art. 7 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
