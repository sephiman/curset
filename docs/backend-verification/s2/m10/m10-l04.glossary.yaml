- id: g-token-passthrough
  term:
    en: token passthrough
  definition:
    en: “Token passthrough” is an anti-pattern where an MCP server accepts tokens from an MCP client without validating that the tokens were properly issued to the MCP server and passes them through to the downstream API.
  origin: m10-l04
  citation: mcp-security-best-practices#token-passthrough
- id: g-indirect-prompt-injection
  term:
    en: indirect prompt injection
  definition:
    en: Indirect prompt injections occur when an LLM accepts input from external sources, such as websites or files. Like direct injections, indirect injections can be either intentional or unintentional.
  origin: m10-l04
  citation: owasp-llm-top10-prompt-injection#indirect-prompt-injections
- id: g-threat-modeling
  term:
    en: threat modeling
  definition:
    en: In the context of application security, threat modeling is a structured, repeatable process used to gain actionable insights into the security characteristics of a particular system. It involves modeling a system from a security perspective, identifying applicable threats based on this model, and determining responses to these threats.
  origin: m10-l04
  citation: owasp-cs-threat-modeling#overview
