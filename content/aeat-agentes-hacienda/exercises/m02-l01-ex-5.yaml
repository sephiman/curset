# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0017
  prompt:
    es: "Según el artículo 82.1 de la Constitución Española de 1978, las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley:"
  options:
  - id: a
    text:
      es: "Sobre cualquier materia, incluidas las reservadas a ley orgánica."
  - id: b
    correct: true
    text:
      es: "Sobre materias determinadas no incluidas en el artículo 81 de la Constitución."
  - id: c
    text:
      es: "Sobre materias determinadas, incluido el régimen electoral general."
  - id: d
    text:
      es: "Sobre todas las materias, salvo las presupuestarias y tributarias."
  explanation:
    es: "El artículo 82.1 permite delegar «sobre materias determinadas no incluidas en el artículo anterior», que es el artículo 81, el de las leyes orgánicas. No cabe delegar en materias de ley orgánica, y el régimen electoral general es una de ellas (art. 81.1 CE). La opción de las materias presupuestarias y tributarias inventa una excepción y admite las materias del artículo 81, que el texto excluye."
  citation: "art. 82.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0019
  prompt:
    es: "¿Mediante qué ley se otorga la delegación legislativa para refundir varios textos legales en uno solo, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Mediante una ley de bases de las Cortes Generales."
  - id: b
    text:
      es: "Mediante una ley orgánica de las Cortes Generales."
  - id: c
    text:
      es: "Mediante una ley aprobada solo por el Congreso de los Diputados."
  - id: d
    correct: true
    text:
      es: "Mediante una ley ordinaria de las Cortes Generales."
  explanation:
    es: "El artículo 82.2 dice que la delegación se otorga «por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo». La ley de bases es para la formación de textos articulados. La Constitución no exige ley orgánica para delegar, y las leyes las aprueban las Cortes Generales, no el Congreso solo."
  citation: "art. 82.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0025
  prompt:
    es: "Según el artículo 86.1 de la Constitución Española de 1978, en cuanto a su presupuesto habilitante y a sus límites materiales, los Decretos-leyes:"
  options:
  - id: a
    text:
      es: "Pueden dictarse en caso de extraordinaria y urgente necesidad y pueden afectar al régimen de las Comunidades Autónomas."
  - id: b
    text:
      es: "Pueden dictarse en caso de extraordinaria necesidad, aunque no sea urgente, y no pueden afectar al Derecho electoral general."
  - id: c
    correct: true
    text:
      es: "Pueden dictarse en caso de extraordinaria y urgente necesidad y no pueden afectar al Derecho electoral general."
  - id: d
    text:
      es: "Pueden dictarse en caso de urgencia y pueden afectar a los deberes de los ciudadanos regulados en el Título I."
  explanation:
    es: "El artículo 86.1 permite los Decretos-leyes «en caso de extraordinaria y urgente necesidad» y dice que no podrán afectar, entre otras materias, «al Derecho electoral general». Los dos requisitos van juntos: la necesidad extraordinaria sin urgencia no basta. El régimen de las Comunidades Autónomas y los deberes del Título I están en la lista de materias vedadas, así que las opciones que los admiten son falsas."
  citation: "art. 86.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0027
  prompt:
    es: "De acuerdo con el artículo 86.2 de la Constitución Española de 1978, los Decretos-leyes deberán ser sometidos a debate y votación de totalidad al Congreso de los Diputados:"
  options:
  - id: a
    text:
      es: "En el plazo de los quince días siguientes a su promulgación."
  - id: b
    text:
      es: "En el plazo de los dos meses siguientes a su promulgación."
  - id: c
    correct: true
    text:
      es: "En el plazo de los treinta días siguientes a su promulgación."
  - id: d
    text:
      es: "En el plazo de los veinte días naturales siguientes a su promulgación."
  explanation:
    es: "El artículo 86.2 CE dice que los Decretos-leyes deberán ser sometidos a debate y votación de totalidad al Congreso «en el plazo de los treinta días siguientes a su promulgación». Quince días y veinte días naturales no coinciden con la cifra del apartado, que es treinta. Dos meses es el plazo que el artículo 90.2 da al Senado para vetar o enmendar un proyecto de ley, otro trámite."
  citation: "art. 86.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0028
  prompt:
    es: "¿Sobre qué ha de pronunciarse expresamente el Congreso de los Diputados respecto de los Decretos-leyes, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Sobre su convalidación, que necesita después la ratificación del Senado."
  - id: b
    text:
      es: "Sobre su convalidación o su conversión automática en ley orgánica."
  - id: c
    text:
      es: "Sobre su enmienda artículo por artículo, sin votación de totalidad."
  - id: d
    correct: true
    text:
      es: "Sobre su convalidación o derogación, en una votación de totalidad."
  explanation:
    es: "El artículo 86.2 dice que los Decretos-leyes se someten «a debate y votación de totalidad» y que el Congreso «habrá de pronunciarse expresamente dentro de dicho plazo sobre su convalidación o derogación». El Senado no ratifica la convalidación. No hay conversión en ley orgánica, y la votación es de totalidad, no por artículos. Para enmendarlos, las Cortes pueden tramitarlos como proyectos de ley (art. 86.3)."
  citation: "art. 86.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0029
  prompt:
    es: "Según el artículo 86.3 de la Constitución Española de 1978, ¿qué podrán hacer las Cortes con los Decretos-leyes durante el plazo de treinta días que sigue a su promulgación?"
  options:
  - id: a
    correct: true
    text:
      es: "Tramitarlos como proyectos de ley por el procedimiento de urgencia."
  - id: b
    text:
      es: "Tramitarlos como proyectos de ley por el procedimiento ordinario."
  - id: c
    text:
      es: "Tramitarlos como proposiciones de ley en lectura única ante el Senado."
  - id: d
    text:
      es: "Convertirlos en leyes de bases mediante acuerdo de ambas Cámaras."
  explanation:
    es: "El artículo 86.3 dice que, durante ese plazo, «las Cortes podrán tramitarlos como proyectos de ley por el procedimiento de urgencia». El procedimiento no es el ordinario. Se tramitan como proyectos, no como proposiciones, y no se convierten en leyes de bases, que son leyes de delegación."
  citation: "art. 86.3 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-129
- id: m02-l01-q0034
  prompt:
    es: "Según el artículo 129.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué carácter tiene la atribución directa de la habilitación reglamentaria a los Ministros?"
  options:
  - id: a
    text:
      es: "Ordinario, sin necesidad de justificación."
  - id: b
    correct: true
    text:
      es: "Excepcional, y deberá justificarse en la ley habilitante."
  - id: c
    text:
      es: "Excepcional, y deberá justificarse en el preámbulo del reglamento."
  - id: d
    text:
      es: "Subsidiario, para cuando el Gobierno no dicte el reglamento en plazo."
  explanation:
    es: "El artículo 129.4 dice que la atribución directa a los titulares de los departamentos ministeriales «tendrá carácter excepcional y deberá justificarse en la ley habilitante». No es ordinaria. La justificación va en la ley que habilita, no en el reglamento. El texto no la configura como subsidiaria de la inactividad del Gobierno."
  citation: "art. 129.4 LPAC"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-10565-art-47
- id: m02-l01-q0042
  prompt:
    es: "De acuerdo con el artículo 47.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán nulas de pleno derecho las disposiciones administrativas que establezcan:"
  options:
  - id: a
    text:
      es: "La retroactividad de disposiciones sancionadoras favorables a los interesados."
  - id: b
    correct: true
    text:
      es: "La retroactividad de disposiciones sancionadoras no favorables."
  - id: c
    text:
      es: "La irretroactividad de disposiciones restrictivas de derechos individuales."
  - id: d
    text:
      es: "La irretroactividad de sanciones desfavorables."
  explanation:
    es: "El artículo 47.2 declara nulas las disposiciones que establezcan «la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales». La retroactividad de las favorables no está en la lista. Las dos opciones que hablan de irretroactividad invierten el supuesto: la irretroactividad de esas disposiciones es justo lo que garantiza el artículo 9.3 CE."
  citation: "art. 47.2 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m02-l01-q0043
  prompt:
    es: "¿Cuál de las siguientes disposiciones administrativas es nula de pleno derecho según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La que regula materias reservadas a la Ley."
  - id: b
    text:
      es: "La que no figuraba en el Plan Anual Normativo."
  - id: c
    text:
      es: "La que reduce a diez días hábiles la audiencia pública por razones motivadas."
  - id: d
    text:
      es: "La que se tramita por urgencia sin consulta pública previa."
  explanation:
    es: "El artículo 47.2 declara nulas de pleno derecho las disposiciones administrativas que «regulen materias reservadas a la Ley». Las otras tres no son causa de nulidad. La audiencia puede reducirse hasta siete días hábiles por razones motivadas (art. 26.6 Ley 50/1997), y la consulta pública puede omitirse con tramitación urgente (art. 26.2.f). El artículo 47.2 no recoge la falta de inclusión en el Plan Anual Normativo."
  citation: "art. 47.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-37
- id: m02-l01-q0044
  prompt:
    es: "Según el artículo 37.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las resoluciones administrativas de carácter particular no podrán vulnerar una disposición de carácter general:"
  options:
  - id: a
    text:
      es: "Salvo que procedan de un órgano de superior jerarquía al que dictó la disposición."
  - id: b
    text:
      es: "Salvo que procedan del mismo órgano que dictó la disposición general."
  - id: c
    text:
      es: "Salvo que las dicte el Consejo de Ministros mediante Real Decreto motivado."
  - id: d
    correct: true
    text:
      es: "Aunque procedan de un órgano de igual o superior jerarquía al que dictó la disposición."
  explanation:
    es: "El artículo 37.1 dice que no podrán vulnerarla «aunque aquéllas procedan de un órgano de igual o superior jerarquía al que dictó la disposición general». Ni el órgano superior, ni el mismo órgano, ni el Consejo de Ministros pueden dispensar de la disposición general en un caso particular."
  citation: "art. 37.1 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-129
- id: m02-l01-q0045
  prompt:
    es: "De acuerdo con el artículo 129.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el ejercicio de la potestad reglamentaria las Administraciones actuarán conforme a los principios de:"
  options:
  - id: a
    text:
      es: "Necesidad, eficacia, proporcionalidad, seguridad jurídica, jerarquía y eficiencia."
  - id: b
    correct: true
    text:
      es: "Necesidad, eficacia, proporcionalidad, seguridad jurídica, transparencia y eficiencia."
  - id: c
    text:
      es: "Necesidad, eficacia, legalidad, seguridad jurídica, transparencia y economía."
  - id: d
    text:
      es: "Oportunidad, eficacia, proporcionalidad, publicidad, transparencia y eficiencia."
  explanation:
    es: "El artículo 129.1 enumera seis principios: «necesidad, eficacia, proporcionalidad, seguridad jurídica, transparencia, y eficiencia». Las otras opciones cambian alguno: jerarquía por transparencia, legalidad por proporcionalidad y economía por eficiencia, oportunidad por necesidad y publicidad por seguridad jurídica."
  citation: "art. 129.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-25
- id: m02-l01-q0047
  prompt:
    es: "¿Antes de qué fecha se eleva el Plan Anual Normativo al Consejo de Ministros para su aprobación, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Antes del 31 de marzo de cada año."
  - id: b
    text:
      es: "Antes del 30 de junio de cada año."
  - id: c
    correct: true
    text:
      es: "Antes del 30 de abril de cada año."
  - id: d
    text:
      es: "Antes del 31 de diciembre de cada año."
  explanation:
    es: "El artículo 25.4 dice que el Ministro de la Presidencia «elevará el Plan al Consejo de Ministros para su aprobación antes del 30 de abril». El 31 de marzo, el 30 de junio y el 31 de diciembre no son fechas que fije la ley."
  citation: "art. 25.4 Ley 50/1997"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0048
  prompt:
    es: "Según el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, podrá prescindirse del trámite de consulta pública cuando la propuesta normativa:"
  options:
  - id: a
    text:
      es: "Regule de forma completa una materia que carecía de regulación."
  - id: b
    text:
      es: "Imponga obligaciones relevantes a sus destinatarios."
  - id: c
    text:
      es: "Afecte a los derechos e intereses legítimos de las personas."
  - id: d
    correct: true
    text:
      es: "Regule aspectos parciales de una materia."
  explanation:
    es: "El artículo 26.2.e) permite prescindir de la consulta «cuando la propuesta regule aspectos parciales de una materia». Regular una materia por completo no figura entre los supuestos. La ley permite prescindir cuando la propuesta «no imponga obligaciones relevantes», no cuando las imponga. Afectar a derechos e intereses legítimos es lo que obliga a la audiencia pública del artículo 26.6, no una causa para omitir la consulta."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0049
  prompt:
    es: "¿Cuál de las siguientes circunstancias permite prescindir de la consulta pública previa según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Que se trate de normas presupuestarias u organizativas de la Administración General del Estado."
  - id: b
    text:
      es: "Que la propuesta normativa afecte a las competencias de varios departamentos ministeriales."
  - id: c
    text:
      es: "Que la propuesta normativa desarrolle una ley orgánica aprobada por las Cortes Generales."
  - id: d
    text:
      es: "Que la propuesta normativa vaya a someterse después al dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 26.2.a) permite prescindir de la consulta «cuando se trate de normas presupuestarias u organizativas de la Administración General del Estado o de las organizaciones dependientes o vinculadas a éstas». Que la propuesta afecte a varios Ministerios, desarrolle una ley orgánica o vaya a pasar por el Consejo de Estado no está entre las seis circunstancias del artículo."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0051
  prompt:
    es: "De acuerdo con el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la consulta pública deberá proporcionar un tiempo suficiente, que en ningún caso será inferior a:"
  options:
  - id: a
    text:
      es: "Un plazo de quince días hábiles."
  - id: b
    text:
      es: "Un plazo de siete días naturales."
  - id: c
    text:
      es: "Un plazo de treinta días naturales."
  - id: d
    correct: true
    text:
      es: "Un plazo de quince días naturales."
  explanation:
    es: "El artículo 26.2 exige un tiempo suficiente, «que en ningún caso será inferior a quince días naturales». Los quince días hábiles son el plazo mínimo de la audiencia e información públicas (art. 26.6), no de la consulta. Siete días es el mínimo al que puede reducirse esa audiencia, y en días hábiles. Treinta días no es un plazo del artículo."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0052
  prompt:
    es: "¿Qué órgano elabora con carácter preceptivo la Memoria del Análisis de Impacto Normativo, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "La elabora la Secretaría General Técnica del Ministerio proponente."
  - id: b
    correct: true
    text:
      es: "La elabora el centro directivo competente."
  - id: c
    text:
      es: "La elabora la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    text:
      es: "La elabora la Comisión Permanente del Consejo de Estado."
  explanation:
    es: "El artículo 26.3 dice: «El centro directivo competente elaborará con carácter preceptivo una Memoria del Análisis de Impacto Normativo». La Secretaría General Técnica informa los proyectos, la Comisión General de Secretarios de Estado y Subsecretarios los examina antes del Consejo de Ministros y la Comisión Permanente del Consejo de Estado dictamina; ninguno elabora la Memoria."
  citation: "art. 26.3 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0053
  prompt:
    es: "Según el artículo 26.6 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el plazo mínimo de la audiencia e información públicas será de:"
  options:
  - id: a
    text:
      es: "Quince días naturales, reducible hasta un mínimo de siete días naturales."
  - id: b
    text:
      es: "Diez días hábiles, reducible hasta un mínimo de cinco días hábiles."
  - id: c
    correct: true
    text:
      es: "Quince días hábiles, reducible hasta un mínimo de siete días hábiles."
  - id: d
    text:
      es: "Treinta días hábiles, reducible hasta un mínimo de quince días hábiles."
  explanation:
    es: "El artículo 26.6 dice que el plazo mínimo «será de 15 días hábiles, y podrá ser reducido hasta un mínimo de siete días hábiles». Los quince días naturales son el mínimo de la consulta pública previa (art. 26.2). Diez y cinco días, o treinta y quince, no son los plazos de este artículo."
  citation: "art. 26.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0054
  prompt:
    es: "¿En cuál de los siguientes casos puede reducirse a siete días hábiles la audiencia e información públicas, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Cuando la propuesta regule aspectos parciales de una materia."
  - id: b
    text:
      es: "Cuando el Consejo de Estado haya emitido ya su dictamen."
  - id: c
    text:
      es: "Cuando la norma vaya a entrar en vigor el día siguiente al de su publicación."
  - id: d
    correct: true
    text:
      es: "Cuando se aplique la tramitación urgente de iniciativas normativas."
  explanation:
    es: "El artículo 26.6 permite reducir el plazo hasta siete días hábiles «cuando razones debidamente motivadas así lo justifiquen; así como cuando se aplique la tramitación urgente de iniciativas normativas». Regular aspectos parciales de una materia permite prescindir de la consulta pública previa (art. 26.2.e), no reducir la audiencia. El dictamen del Consejo de Estado y la fecha de entrada en vigor no son causas de reducción."
  citation: "art. 26.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
