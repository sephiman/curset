# anchor: boe-a-1985-5392-art-31
- id: m01-l10-q047
  prompt:
    es: "De acuerdo con el artículo 31.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Provincia es una entidad local determinada por la agrupación de Municipios:"
  options:
  - id: a
    text:
      es: "Sin personalidad jurídica propia, que actúa a través de la Diputación."
  - id: b
    correct: true
    text:
      es: "Con personalidad jurídica propia y plena capacidad para el cumplimiento de sus fines."
  - id: c
    text:
      es: "Con personalidad jurídica propia y capacidad limitada a la cooperación con los Municipios."
  - id: d
    text:
      es: "Con personalidad jurídica derivada de la Comunidad Autónoma en que se integra."
  explanation:
    es: "El artículo 31.1 LBRL dice que la Provincia es una entidad local «con personalidad jurídica propia y plena capacidad para el cumplimiento de sus fines». La personalidad es suya, no de la Diputación ni de la Comunidad Autónoma. Su capacidad es plena, no limitada a cooperar con los Municipios."
  citation: "art. 31.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-31
- id: m01-l10-q048
  prompt:
    es: "Según el artículo 31.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cuáles son los fines propios y específicos de la Provincia?"
  options:
  - id: a
    text:
      es: "Garantizar la autonomía financiera y tributaria de los Municipios de su territorio."
  - id: b
    text:
      es: "Garantizar la unidad de gobierno y gestión de los Municipios de su territorio."
  - id: c
    text:
      es: "Garantizar la representación de los Municipios de su territorio ante las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "Garantizar los principios de solidaridad y equilibrio intermunicipales."
  explanation:
    es: "El artículo 31.2 LBRL dice que son fines propios y específicos de la Provincia «garantizar los principios de solidaridad y equilibrio intermunicipales». La autonomía financiera de los Municipios, su unidad de gobierno y su representación ante las Cortes no son los fines que enumera el artículo."
  citation: "art. 31.2 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-32
- id: m01-l10-q049
  prompt:
    es: "¿Qué órganos existen en todas las Diputaciones Provinciales según la legislación básica estatal de régimen local?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente, los Vicepresidentes, la Junta de Gobierno y el Pleno."
  - id: b
    text:
      es: "El Presidente, los Vicepresidentes y el Pleno, pero no la Junta de Gobierno."
  - id: c
    text:
      es: "El Presidente, el Pleno y la Comisión Especial de Sugerencias y Reclamaciones."
  - id: d
    text:
      es: "El Presidente, los Vicepresidentes, el Pleno y el Consejo de Alcaldes de la provincia."
  explanation:
    es: "El artículo 32.1 LBRL dice: «El Presidente, los Vicepresidentes, la Junta de Gobierno y el Pleno existen en todas las Diputaciones». La Junta de Gobierno es obligatoria en todas, a diferencia de lo que ocurre en los ayuntamientos. La Comisión Especial de Sugerencias y Reclamaciones es un órgano municipal (art. 20.1.d). La ley no prevé un Consejo de Alcaldes entre los órganos necesarios."
  citation: "art. 32.1 LBRL"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-5392-art-32
- id: m01-l10-q050
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la Junta de Gobierno es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Existe en todas las Diputaciones, mientras que en los ayuntamientos depende de la población, del reglamento orgánico o del acuerdo del Pleno."
  - id: b
    text:
      es: "Existe en todos los ayuntamientos y en todas las Diputaciones, cualquiera que sea su población."
  - id: c
    text:
      es: "Existe en los ayuntamientos de más de 5.000 habitantes y en las Diputaciones cuyo Pleno lo acuerde."
  - id: d
    text:
      es: "Existe solo en las Diputaciones de régimen común y en los municipios de gran población."
  explanation:
    es: "El artículo 32.1 LBRL dice que la Junta de Gobierno existe «en todas las Diputaciones». En los ayuntamientos, el artículo 20.1.b) la exige en los municipios de más de 5.000 habitantes y en los de menos si lo dispone su reglamento orgánico o lo acuerda el Pleno. No existe en todos los ayuntamientos. En las Diputaciones no depende de un acuerdo del Pleno. La ley no la limita a las Diputaciones de régimen común ni a los municipios de gran población."
  citation: "art. 32.1 LBRL"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-33
- id: m01-l10-q051
  prompt:
    es: "El Pleno de la Diputación Provincial, según la legislación básica estatal de régimen local, está constituido por:"
  options:
  - id: a
    text:
      es: "El Presidente, los Vicepresidentes y la Junta de Gobierno."
  - id: b
    text:
      es: "Los Alcaldes de todos los Municipios de la provincia."
  - id: c
    text:
      es: "El Presidente y los Diputados que ostenten delegaciones."
  - id: d
    correct: true
    text:
      es: "El Presidente y los Diputados."
  explanation:
    es: "El artículo 33.1 LBRL dice: «El Pleno de la Diputación está constituido por el Presidente y los Diputados». Lo forman todos los Diputados, no solo los que tienen delegaciones ni solo los miembros de la Junta de Gobierno. Los Alcaldes de la provincia no forman el Pleno por serlo."
  citation: "art. 33.1 LBRL"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1985-5392-art-35
- id: m01-l10-q052
  prompt:
    es: "De acuerdo con el artículo 35.4 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Vicepresidentes, que sustituyen al Presidente por el orden de su nombramiento, son designados:"
  options:
  - id: a
    text:
      es: "Por el Pleno, entre los Diputados, por mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Libremente por el Presidente entre los miembros de la Junta de Gobierno."
  - id: c
    text:
      es: "Libremente por el Presidente entre todos los Diputados, sean o no de la Junta de Gobierno."
  - id: d
    text:
      es: "Por la Junta de Gobierno, entre sus miembros, a propuesta del Presidente."
  explanation:
    es: "El artículo 35.4 LBRL dice que los Vicepresidentes son «libremente designados por éste», el Presidente, «entre los miembros de la Junta de Gobierno». No los elige el Pleno ni la Junta de Gobierno. A diferencia de los Tenientes de Alcalde, la ley no prevé designarlos entre todos los Diputados."
  citation: "art. 35.4 LBRL"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-36
- id: m01-l10-q053
  prompt:
    es: "¿En qué municipios garantiza en todo caso la Diputación la prestación de los servicios de secretaría e intervención?"
  options:
  - id: a
    text:
      es: "En los municipios de menos de 5.000 habitantes."
  - id: b
    correct: true
    text:
      es: "En los municipios de menos de 1.000 habitantes."
  - id: c
    text:
      es: "En los municipios de menos de 20.000 habitantes."
  - id: d
    text:
      es: "En los municipios de menos de 2.000 habitantes."
  explanation:
    es: "El artículo 36.1.b) LBRL dice que la Diputación «en todo caso garantizará en los municipios de menos de 1.000 habitantes la prestación de los servicios de secretaría e intervención». Cinco mil habitantes es el umbral de los servicios de tratamiento de residuos, y veinte mil el de prevención y extinción de incendios, ambos en el artículo 36.1.c). Dos mil no es la cifra que fija el 36.1.b): el apartado dice mil."
  citation: "art. 36.1.b LBRL"
  difficulty: 2
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-36
- id: m01-l10-q054
  prompt:
    es: "¿En qué municipios asume la Diputación el servicio de prevención y extinción de incendios cuando estos no proceden a su prestación?"
  options:
  - id: a
    text:
      es: "En los municipios de menos de 5.000 habitantes."
  - id: b
    text:
      es: "En los municipios de menos de 50.000 habitantes."
  - id: c
    correct: true
    text:
      es: "En los municipios de menos de 20.000 habitantes."
  - id: d
    text:
      es: "En los municipios de menos de 1.000 habitantes."
  explanation:
    es: "El artículo 36.1.c) LBRL dice que la Diputación asumirá la prestación de los servicios «de prevención y extinción de incendios en los de menos de 20.000 habitantes, cuando éstos no procedan a su prestación». Cinco mil habitantes es el umbral que la misma letra fija para el tratamiento de residuos. Mil habitantes es la cifra de secretaría e intervención, en la letra b). Cincuenta mil no es la cifra que fija la letra c): el texto dice veinte mil."
  citation: "art. 36.1.c LBRL"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-40
- id: m01-l10-q055
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las Comunidades Autónomas uniprovinciales y la Foral de Navarra:"
  options:
  - id: a
    correct: true
    text:
      es: "Asumen las competencias, medios y recursos que en el régimen ordinario corresponden a las Diputaciones Provinciales."
  - id: b
    text:
      es: "Mantienen una Diputación Provincial distinta de sus instituciones autonómicas."
  - id: c
    text:
      es: "Asumen las competencias de las Diputaciones, salvo la asistencia y cooperación a los Municipios."
  - id: d
    text:
      es: "Transfieren a sus Municipios las competencias que corresponden a las Diputaciones Provinciales."
  explanation:
    es: "El artículo 40 LBRL dice que estas Comunidades «asumen las competencias, medios y recursos que corresponden en el régimen ordinario a las Diputaciones Provinciales». No mantienen una Diputación aparte. La asunción no excluye la asistencia a los Municipios. Las competencias pasan a la Comunidad, no a los Municipios. La única excepción del artículo es la Comunidad Autónoma de las Islas Baleares."
  citation: "art. 40 LBRL"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-39
- id: m01-l10-q056
  prompt:
    es: "Según el artículo 39 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cómo se aplican sus disposiciones a los órganos forales de Álava, Guipúzcoa y Vizcaya?"
  options:
  - id: a
    text:
      es: "Con carácter preferente sobre su régimen foral, que solo rige en su defecto."
  - id: b
    correct: true
    text:
      es: "Con carácter supletorio, pues conservan su régimen peculiar en el marco del Estatuto vasco."
  - id: c
    text:
      es: "No se les aplican en ningún caso, por tener un régimen foral propio."
  - id: d
    text:
      es: "Solo en materia de organización, pues sus competencias se rigen por su Estatuto."
  explanation:
    es: "El artículo 39 LBRL dice que los órganos forales de Álava, Guipúzcoa y Vizcaya «conservan su régimen peculiar» en el marco del Estatuto vasco y que la Ley «les serán de aplicación con carácter supletorio». La Ley no prevalece sobre el régimen foral. Sí se aplica, como supletoria, así que «en ningún caso» es falso. El artículo no reparte su aplicación entre organización y competencias."
  citation: "art. 39 LBRL"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-5392-art-41
- id: m01-l10-q057
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Cabildos Insulares Canarios se rigen, supletoriamente, por las normas que regulan:"
  options:
  - id: a
    text:
      es: "La organización y funcionamiento de los municipios de gran población."
  - id: b
    text:
      es: "La organización y funcionamiento de las mancomunidades provinciales interinsulares."
  - id: c
    correct: true
    text:
      es: "La organización y funcionamiento de las Diputaciones provinciales."
  - id: d
    text:
      es: "La organización y funcionamiento de los Consejos Insulares de las Islas Baleares."
  explanation:
    es: "El artículo 41.1 LBRL dice que los Cabildos Insulares Canarios se rigen por la disposición adicional decimocuarta «y supletoriamente por las normas que regulan la organización y funcionamiento de las Diputaciones provinciales», cuyas competencias asumen. El régimen de gran población es municipal. Las mancomunidades provinciales interinsulares son solo órganos de representación (art. 41.2). Los Consejos Insulares de Baleares tienen su propia regla en el artículo 41.3."
  citation: "art. 41.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-42
- id: m01-l10-q058
  prompt:
    es: "Según el artículo 42.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, no podrá crearse la comarca si se oponen expresamente:"
  options:
  - id: a
    correct: true
    text:
      es: "Las dos quintas partes de los Municipios que debieran agruparse en ella, si representan al menos la mitad del censo electoral del territorio."
  - id: b
    text:
      es: "La mitad de los Municipios que debieran agruparse en ella, si representan al menos dos quintas partes del censo electoral."
  - id: c
    text:
      es: "Las dos terceras partes de los Municipios que debieran agruparse en ella, cualquiera que sea su censo electoral."
  - id: d
    text:
      es: "Las dos quintas partes de los Municipios que debieran agruparse en ella, si representan al menos un tercio del censo."
  explanation:
    es: "El artículo 42.2 LBRL dice que no podrá crearse la comarca si se oponen expresamente «las dos quintas partes de los Municipios que debieran agruparse en ella, siempre que, en este caso, tales Municipios representen al menos la mitad del censo electoral del territorio correspondiente». La opción que invierte las fracciones altera el texto. Las dos terceras partes sin requisito de censo y el tercio del censo tampoco son la regla."
  citation: "art. 42.2 LBRL"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1985-5392-art-42
- id: m01-l10-q059
  prompt:
    es: "¿Quién puede crear en su territorio comarcas u otras entidades que agrupen varios Municipios, según la legislación básica estatal de régimen local?"
  options:
  - id: a
    text:
      es: "Las Diputaciones Provinciales, por acuerdo de su Pleno y previo informe de los Municipios."
  - id: b
    text:
      es: "El Estado, mediante ley de las Cortes Generales."
  - id: c
    text:
      es: "Los Municipios interesados, mediante convenio entre sus Plenos."
  - id: d
    correct: true
    text:
      es: "Las Comunidades Autónomas, de acuerdo con sus respectivos Estatutos."
  explanation:
    es: "El artículo 42.1 LBRL dice que «las Comunidades Autónomas, de acuerdo con lo dispuesto en sus respectivos Estatutos, podrán crear en su territorio comarcas». Los Municipios interesados pueden tener la iniciativa (art. 42.2), pero no crean la comarca. Ni las Diputaciones ni el Estado tienen esa competencia en la LBRL."
  citation: "art. 42.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1985-5392-art-43
- id: m01-l10-q060
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las áreas metropolitanas son entidades locales integradas por:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Municipios de grandes aglomeraciones urbanas con vinculaciones económicas y sociales que hagan necesaria la planificación conjunta."
  - id: b
    text:
      es: "Los Municipios que se asocian voluntariamente para la ejecución en común de obras y servicios determinados."
  - id: c
    text:
      es: "Los Municipios de una misma provincia que demandan la prestación de servicios de ámbito comarcal."
  - id: d
    text:
      es: "Los Municipios capitales de provincia y los de más de 250.000 habitantes de una misma Comunidad Autónoma."
  explanation:
    es: "El artículo 43.2 LBRL define las áreas metropolitanas como entidades locales «integradas por los Municipios de grandes aglomeraciones urbanas entre cuyos núcleos de población existan vinculaciones económicas y sociales que hagan necesaria la planificación conjunta». La asociación voluntaria para obras y servicios es la mancomunidad (art. 44.1). Los servicios de ámbito comarcal son propios de la comarca (art. 42.1). Las capitales y los municipios de más de 250.000 habitantes son supuestos del régimen de gran población."
  citation: "art. 43.2 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-44
- id: m01-l10-q061
  prompt:
    es: "Señale la respuesta correcta sobre las mancomunidades de municipios en la legislación básica estatal de régimen local:"
  options:
  - id: a
    text:
      es: "Carecen de personalidad jurídica y se rigen por los acuerdos de los Plenos de los municipios mancomunados."
  - id: b
    text:
      es: "Tienen personalidad jurídica plena y se rigen por la ley de la Comunidad Autónoma que las crea."
  - id: c
    correct: true
    text:
      es: "Tienen personalidad y capacidad jurídicas para sus fines específicos y se rigen por sus Estatutos propios."
  - id: d
    text:
      es: "Tienen personalidad jurídica propia y se rigen por las normas de las Diputaciones provinciales."
  explanation:
    es: "El artículo 44.2 LBRL dice: «Las mancomunidades tienen personalidad y capacidad jurídicas para el cumplimiento de sus fines específicos y se rigen por sus Estatutos propios». Sí tienen personalidad jurídica. No las crea una ley autonómica: nacen del derecho de los municipios a asociarse (art. 44.1). Las normas de las Diputaciones rigen a los Cabildos y Consejos Insulares, no a las mancomunidades."
  citation: "art. 44.2 LBRL"
  difficulty: 2
  tags:
  - "concepto"
