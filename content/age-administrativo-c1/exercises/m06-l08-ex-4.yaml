  prompt:
    es: "¿Cuál de los siguientes medios permite resolver el nombre de equipo que se indica a ping en Windows 11, según la documentación?"
  options:
  - id: a
    text:
      es: "Solo mediante consultas del sistema de nombres de dominio"
