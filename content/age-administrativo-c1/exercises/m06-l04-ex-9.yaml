# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q363
  prompt:
    es: "Según la página de Opciones de Word (Guardar) en Word 365, ¿cuál de los siguientes archivos crea Word automáticamente en el intervalo especificado en el cuadro de minutos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un archivo de Autorrecuperación"
  - id: b
    text:
      es: "Una versión nueva en el historial de versiones"
  - id: c
    text:
      es: "Una copia del documento en OneDrive"
  - id: d
    text:
      es: "Un PDF del documento con las marcas de revisión"
  explanation:
    es: "Word crea un archivo de Autorrecuperación en el intervalo fijado. «Una versión nueva en el historial de versiones» la agrega el Autoguardado: «se agrega una nueva versión del archivo al historial de versiones» cuando se abre un archivo y se hacen los primeros cambios, y luego solo ocasionalmente. «Una copia del documento en OneDrive» no es lo que crea Word en el intervalo del cuadro de minutos, que es un archivo de Autorrecuperación. «Un PDF del documento con las marcas de revisión» es una salida de Guardar una copia, no de la Autorrecuperación."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q364
  prompt:
    es: "En Word 365, ¿cuál de los siguientes intervalos de minutos admite la opción Guardar información de Autorrecuperación cada?"
  options:
  - id: a
    text:
      es: "Un número positivo entre 1 y 60"
  - id: b
    text:
      es: "Un número positivo entre 5 y 120"
  - id: c
    correct: true
    text:
      es: "Un número positivo entre 1 y 120"
  - id: d
    text:
      es: "Un número positivo entre 1 y 1.440"
  explanation:
    es: "La página fija el intervalo: «El intervalo debe ser un número positivo entre 1 y 120». Por eso «entre 1 y 60» se queda corto, porque 120 también vale; «entre 5 y 120» excluye valores de 1 a 4 que la página admite; y «entre 1 y 1.440» sobrepasa el máximo de 120."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q365
  prompt:
    es: "Según la página de Microsoft, el archivo de Autorrecuperación de Word 365 se abre tras un fallo del equipo:"
  options:
  - id: a
    text:
      es: "Solo cuando se abre el documento original desde OneDrive"
  - id: b
    correct: true
    text:
      es: "La próxima vez que se inicia Word"
  - id: c
    text:
      es: "En el mismo momento del fallo, antes de cerrar Word"
  - id: d
    text:
      es: "Solo si antes se activó el Autoguardado del documento"
  explanation:
    es: "Según la página, Word crea el archivo de Autorrecuperación en el intervalo fijado en el cuadro de minutos y, si el equipo deja de responder o se queda sin energía, «el archivo de Autorrecuperación se abrirá la próxima vez que inicie Word». Decir que solo se abre si el documento original estaba en OneDrive añade una condición que esa frase no tiene: la opción se describe para cualquier documento. Abrirlo en el mismo momento del fallo choca con el propio caso de la frase, un equipo que ha dejado de responder o sin energía, donde el archivo solo puede abrirse al iniciar Word. Y condicionarlo al Autoguardado mezcla dos funciones: la página presenta Autorrecuperación como una opción con su propio intervalo."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q366
  prompt:
    es: "En Word 365, ¿puede la Autorrecuperación sustituir al comando Guardar al terminar de trabajar en un documento?"
  options:
  - id: a
    text:
      es: "Sí: con ella ya no hace falta guardar el documento"
  - id: b
    text:
      es: "Sí, pero solo si el intervalo es de 1 minuto"
  - id: c
    text:
      es: "Sí, pero solo para los documentos guardados en OneDrive"
  - id: d
    correct: true
    text:
      es: "No: hay que seguir guardando el documento al terminar"
  explanation:
    es: "La página dice: «Autorrecuperación no reemplaza el comando Guardar. Debe seguir guardando el documento cuando termine de trabajar en él». Que con ella ya no haga falta guardar contradice esa frase. El intervalo de 1 minuto es el mínimo que admite la página, entre 1 y 120, y solo fija cada cuánto se crea el archivo de Autorrecuperación: no cambia que siga siendo un archivo aparte, que puede contener información no guardada del documento original. Y OneDrive aparece en la página como uno de los lugares adicionales donde guardar, no como excepción a esa regla."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q367
  prompt:
    es: "En Word 365, ¿cuál de los siguientes datos puede contener el archivo de Autorrecuperación y, de lo contrario, se perdería del documento original?"
  options:
  - id: a
    correct: true
    text:
      es: "Información no guardada"
  - id: b
    text:
      es: "Los cambios ya guardados con Ctrl+S"
  - id: c
    text:
      es: "Solo el nombre y la ubicación del documento"
  - id: d
    text:
      es: "La configuración de las Opciones de Word"
  explanation:
    es: "La página dice que el archivo de Autorrecuperación «puede contener información no guardada que, de lo contrario, se perdería del documento original». Los «cambios ya guardados con Ctrl+S» ya están en el documento original, así que no se perderían; «solo el nombre y la ubicación del documento» y «la configuración de las Opciones de Word» no son información no guardada del documento, que es lo que la página atribuye al archivo."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q368
  prompt:
    es: "Según la página de Opciones de Word (Guardar) en Word 365, ¿qué ocurre con la opción de conservar la última versión de Autorrecuperación si se cierra sin guardar?"
  options:
  - id: a
    text:
      es: "Word elimina el archivo de Autorrecuperación al cerrar sin guardar"
  - id: b
    text:
      es: "Word guarda el documento original con los últimos cambios al cerrar"
  - id: c
    text:
      es: "Word pide guardar el documento cada vez que se abre de nuevo Word"
  - id: d
    correct: true
    text:
      es: "Word crea el archivo y lo conserva al cerrar; lo muestra al abrir"
  explanation:
    es: "Con la opción de conservar la última versión de Autorrecuperación, «Word creará un archivo de Autorrecuperación y lo conservará al cerrar Word. Se mostrará el archivo recuperado la próxima vez que abra Word». Eliminar el archivo al cerrar es lo contrario de «lo conservará». Guardar el documento original con los últimos cambios tampoco: la página dice que el archivo de Autorrecuperación puede contener información no guardada que se perdería del documento original, es decir, es un archivo aparte. Y pedir guardar el documento cada vez que se abre Word no es lo que dice la página: lo que se muestra al abrir es el archivo recuperado."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q369
  prompt:
    es: "En Word 365, ¿qué se escribe en el cuadro de texto de la opción Ubicación del archivo de Autorrecuperación?"
  options:
  - id: a
    text:
      es: "El intervalo en minutos entre cada archivo"
  - id: b
    correct: true
    text:
      es: "La ruta de acceso de la ubicación del archivo"
  - id: c
    text:
      es: "El nombre del documento que se va a recuperar"
  - id: d
    text:
      es: "El formato de archivo con el que se guarda"
  explanation:
    es: "La página indica: «En el cuadro de texto, escriba la ruta de acceso que desea usar como ubicación de archivo de Autorrecuperación». «El intervalo en minutos entre cada archivo» se fija en otro cuadro, Guardar información de Autorrecuperación cada, con un número entre 1 y 120. «El nombre del documento que se va a recuperar» no se escribe: el cuadro solo pide una ruta. «El formato de archivo con el que se guarda» corresponde a Guardar archivos en este formato, que establece el formato predeterminado al guardar."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q370
  prompt:
    es: "Según la página de Microsoft sobre el Autoguardado, ¿qué ocurre con la Autorrecuperación si el Autoguardado de un archivo de Word 365 está desactivado?"
  options:
  - id: a
    text:
      es: "Deja de funcionar hasta que se vuelva a activar el Autoguardado"
  - id: b
    text:
      es: "Solo funciona si el archivo está en OneDrive"
  - id: c
    correct: true
    text:
      es: "Sigue funcionando en un bloqueo mientras el archivo esté abierto"
  - id: d
    text:
      es: "Sustituye al Autoguardado y guarda cada pocos segundos"
  explanation:
    es: "La página dice: «Cuando Autoguardado está desactivado, Autorrecuperación sigue funcionando en caso de bloqueo del sistema mientras el archivo esté abierto». Por eso «deja de funcionar hasta que se vuelva a activar el Autoguardado» y «solo funciona si el archivo está en OneDrive» contradicen esa frase. «Sustituye al Autoguardado y guarda cada pocos segundos» confunde las dos funciones: quien guarda cada pocos segundos es el Autoguardado, no la Autorrecuperación."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué es el Autoguardado?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q371
  prompt:
    es: "Según la página de Microsoft, ¿cuál de las siguientes rutas guarda como PDF en Word 365 un archivo que ya se guardó antes?"
  options:
  - id: a
    correct: true
    text:
      es: "Archivo › Guardar una copia"
  - id: b
    text:
      es: "Archivo › Información › Proteger documento"
  - id: c
    text:
      es: "Archivo › Opciones › Revisión"
  - id: d
    text:
      es: "Archivo › Abrir, con la opción PDF"
  explanation:
    es: "La página dice: «Si el archivo se guardó anteriormente, seleccione Archivo>Guardar una copia». «Archivo › Información › Proteger documento» es la ruta de Marcar como final, según la página de Microsoft sobre coautoría, no la de guardar como PDF. «Archivo › Opciones › Revisión» abre las opciones de ortografía y gramática, según la página de Microsoft sobre ortografía. «Archivo › Abrir, con la opción PDF» sirve para abrir un PDF: «Vaya a Archivo>Abrir y busque el archivo PDF. Word abre el contenido del archivo PDF en un archivo nuevo»."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q372
  prompt:
    es: "En Word 365, ¿qué se elige tras seleccionar Crear marcadores con al guardar un PDF?"
  options:
  - id: a
    text:
      es: "Intervalo de páginas o Documento con marcas"
  - id: b
    text:
      es: "Documento o Propiedades del documento"
  - id: c
    text:
      es: "Etiquetas de la estructura o Cifrar el documento"
  - id: d
    correct: true
    text:
      es: "Encabezados o Marcadores de Word"
  explanation:
    es: "La página dice: «Para crear un conjunto de marcadores en el archivo PDF, seleccione Crear marcadores con. Después, elija Encabezados o, si ha agregado marcadores a su documento, Marcadores de Word». Por eso «Intervalo de páginas o Documento con marcas», «Documento o Propiedades del documento» y «Etiquetas de la estructura o Cifrar el documento» no son lo que se elige: la página reserva Propiedades del documento, las etiquetas de estructura y el cifrado para otras casillas de las opciones del PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q373
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF restringe el acceso de modo que solo las personas con una contraseña puedan abrirlo?"
  options:
  - id: a
    text:
      es: "Etiquetas de la estructura del documento para accesibilidad"
  - id: b
    text:
      es: "Propiedades del documento"
  - id: c
    correct: true
    text:
      es: "Cifrar el documento con una contraseña"
  - id: d
    text:
      es: "Texto de mapa de bits cuando es posible que las fuentes no se incrusten"
  explanation:
    es: "La página dice: «Para restringir el acceso de modo que solo las personas con la contraseña puedan abrir el PDF, seleccione esta opción», y Word abre el cuadro Cifrar documento PDF. «Etiquetas de la estructura del documento para accesibilidad» sirve «para facilitar la lectura del documento en un software de lectura de pantalla». «Propiedades del documento» sirve para incluirlas en el PDF. «Texto de mapa de bits cuando es posible que las fuentes no se incrusten» hace que el PDF use imágenes de mapa de bits del texto cuando las fuentes no se pueden incrustar; ninguna pide contraseña."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q375
  prompt:
    es: "En Word 365, ¿cómo se abre un archivo PDF para poder copiar su contenido al documento?"
  options:
  - id: a
    correct: true
    text:
      es: "Con Archivo › Abrir, buscando el archivo PDF"
  - id: b
    text:
      es: "Con Archivo › Guardar una copia, eligiendo PDF en la lista"
  - id: c
    text:
      es: "Con Insertar › Captura de pantalla sobre el visor de PDF"
  - id: d
    text:
      es: "Con Revisar › Traducir sobre el archivo PDF"
  explanation:
    es: "La página dice: «Vaya a Archivo>Abrir y busque el archivo PDF. Word abre el contenido del archivo PDF en un archivo nuevo». «Archivo › Guardar una copia, eligiendo PDF en la lista» crea un PDF a partir del documento, según la lista desplegable donde «seleccione PDF», pero no abre uno existente. «Insertar › Captura de pantalla sobre el visor de PDF» y «Revisar › Traducir sobre el archivo PDF» no son rutas que la página dé para abrir un PDF; la única que da es Archivo>Abrir."
  citation: "fuente: `ms-office-pdf.html`; «Abrir y copiar el contenido de un PDF con Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q376
  prompt:
    es: "Según la página de Microsoft sobre cómo imprimir en Word 365, ¿qué imprime el documento al seleccionar Imprimir documento con revisiones?"
  options:
  - id: a
    text:
      es: "Solo las propiedades del documento, en una página aparte"
  - id: b
    correct: true
    text:
      es: "El documento con comentarios y marcas de revisión"
  - id: c
    text:
      es: "Solo la página que se muestra en la vista previa"
  - id: d
    text:
      es: "El documento sin comentarios ni marcas de revisión"
  explanation:
    es: "La página dice: «En Configuración, seleccione Imprimir documento con revisiones», y añade que «el documento se imprimirá con comentarios». Por eso «el documento sin comentarios ni marcas de revisión» es lo contrario. «Solo las propiedades del documento, en una página aparte» corresponde a Imprimir propiedades del documento, otra opción. «Solo la página que se muestra en la vista previa» corresponde a Imprimir página actual: «Para imprimir la página que se muestra en la Vista previa, seleccione Imprimir página actual»."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q377
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones imprime solo la página que se muestra en la vista previa?"
  options:
  - id: a
    correct: true
    text:
      es: "Imprimir página actual"
  - id: b
    text:
      es: "Imprimir todas las páginas"
  - id: c
    text:
      es: "Impresión personalizada"
  - id: d
    text:
      es: "Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «Para imprimir la página que se muestra en la Vista previa, seleccione Imprimir página actual». «Imprimir todas las páginas» es la «opción predeterminada» de la lista de Configuración, la que imprime todo el documento. «Impresión personalizada» sirve para páginas concretas: «Para imprimir páginas consecutivas como de la 1 a la 3, seleccione Impresión personalizada». «Imprimir documento con revisiones» imprime con comentarios y marcas de revisión, no solo la página en vista previa."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir páginas determinadas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q378
  prompt:
    es: "Según la página de Microsoft sobre cómo imprimir en Word 365, ¿cuándo aparecen en Configuración las opciones de impresión en color, blanco y negro y escala de grises?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la impresora elegida admite esas opciones"
  - id: b
    text:
      es: "Siempre que el documento tenga imágenes de fondo"
  - id: c
    text:
      es: "Solo cuando el documento tiene comentarios"
  - id: d
    text:
      es: "Solo al activar Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «Si la impresora que ha elegido en Impresora admite las opciones de impresión de color, blanco y negro y escala de grises, dichas opciones aparecerán en la lista en Configuración». Por eso «siempre que el documento tenga imágenes de fondo», «solo cuando el documento tiene comentarios» y «solo al activar Imprimir documento con revisiones» no son la condición: la página la pone en la impresora elegida, no en el contenido del documento ni en otra opción de Configuración."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir un documento en Word para Windows»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q379
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a la opción Imprimir dibujos creados en Word de las Opciones de Word (Mostrar) en Word 365?"
  options:
  - id: a
    text:
      es: "Solo las imágenes insertadas desde un archivo"
  - id: b
    text:
      es: "Solo los colores e imágenes de fondo"
  - id: c
    text:
      es: "Solo las propiedades del documento, en una página aparte"
  - id: d
    correct: true
    text:
      es: "Todos los objetos de dibujo, como las formas"
  explanation:
    es: "La página dice: «Seleccione esta opción para imprimir todos los objetos de dibujo, como formas y cuadros de texto». «Solo las imágenes insertadas desde un archivo» no es lo que describe: la página habla de los objetos de dibujo creados en Word. «Solo los colores e imágenes de fondo» es Imprimir imágenes y colores de fondo, otra opción. «Solo las propiedades del documento, en una página aparte» es Imprimir propiedades del documento, que imprime el resumen «en una página independiente»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q380
  prompt:
    es: "Según la página de Opciones de Word (Mostrar), al desactivar la casilla Imprimir dibujos creados en Word en Word 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Word imprime un cuadro en blanco en lugar de cada objeto de dibujo"
  - id: b
    text:
      es: "Word imprime todos los objetos de dibujo en blanco y negro, sin color"
  - id: c
    text:
      es: "Word omite los cuadros de texto y las imágenes, pero imprime las formas"
  - id: d
    text:
      es: "Word imprime los objetos de dibujo en una página aparte, al final"
  explanation:
    es: "La página dice: «Desactivar esta casilla puede acelerar el proceso de impresión, ya que Word imprime un cuadro en blanco en lugar de cada objeto de dibujo». Por eso «todos los objetos de dibujo en blanco y negro, sin color» no es lo que ocurre, ni lo es «omite los cuadros de texto y las imágenes, pero imprime las formas»: lo que cambia es que cada objeto sale como un cuadro en blanco. «Imprime los objetos de dibujo en una página aparte, al final» tampoco consta: la página solo usa la página independiente para las propiedades del documento."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q381
  prompt:
    es: "Según la página de Opciones de Word (Mostrar), la opción Imprimir propiedades del documento de Word 365 imprime la información de resumen:"
  options:
  - id: a
    text:
      es: "En el encabezado de cada página del documento impreso"
  - id: b
    text:
      es: "En la primera página, antes del texto del documento impreso"
  - id: c
    text:
      es: "En el margen de cada página, junto a los comentarios impresos"
  - id: d
    correct: true
    text:
      es: "En una página independiente, después de imprimir el documento"
  explanation:
    es: "La página dice que Imprimir propiedades del documento imprime la información de resumen «en una página independiente después de imprimir el documento». En el encabezado de cada página no es una página independiente. En la primera página, antes del texto, contradice «después de imprimir el documento». Y en el margen junto a los comentarios impresos tampoco es una página aparte: la propiedad se imprime en su propia página, tras el documento."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q382
  prompt:
    es: "En Word 365, ¿qué actualiza la opción Actualizar campos antes de imprimir de las Opciones de Word (Mostrar) antes de imprimir el documento?"
  options:
  - id: a
    text:
      es: "Solo los campos de fecha del documento"
  - id: b
    correct: true
    text:
      es: "Todos los campos del documento"
  - id: c
    text:
      es: "Solo la información vinculada de otros documentos"
  - id: d
    text:
      es: "Solo los campos de entrada de índice"
  explanation:
    es: "La página dice: «Seleccione esta opción para actualizar todos los campos de un documento antes de imprimirlo». Por eso «solo los campos de fecha del documento» y «solo los campos de entrada de índice» se quedan cortos: la página dice todos los campos. «Solo la información vinculada de otros documentos» corresponde a otra opción, Actualizar los datos vinculados antes de imprimir, que actualiza «toda la información vinculada de un documento»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 1
