# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q034
  prompt:
    es: "Según la norma de la Comisión Electrotécnica Internacional que recoge el NIST para los múltiplos binarios, ¿qué factor corresponde al prefijo gibi (Gi)?"
  options:
  - id: a
    text:
      es: "10^9, es decir, (10^3)^3."
  - id: b
    correct: true
    text:
      es: "2^30, es decir, (2^10)^3."
  - id: c
    text:
      es: "2^20, es decir, (2^10)^2."
  - id: d
    text:
      es: "2^40, es decir, (2^10)^4."
  explanation:
    es: "En la tabla del NIST, gibi vale 2^30 = (2^10)^3, el «gigabinary». 10^9 es el factor del prefijo decimal giga, 2^20 es el de mebi y 2^40 el de tebi."
  citation: "fuente: `nist-prefijos-binarios.html`; «Prefixes for binary multiples»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q035
  prompt:
    es: "Señale la afirmación correcta sobre los prefijos para múltiplos binarios (kibi, mebi, gibi y siguientes) según la página del NIST que los recoge:"
  options:
  - id: a
    text:
      es: "Forman parte del Sistema Internacional desde que la IEC los aprobó en 1998."
  - id: b
    text:
      es: "Tienen el mismo valor que los prefijos decimales kilo, mega y giga."
  - id: c
    correct: true
    text:
      es: "No forman parte del Sistema Internacional, aunque se derivaron de sus prefijos decimales."
  - id: d
    text:
      es: "Su nombre se forma añadiendo «bi» al nombre completo del prefijo decimal."
  explanation:
    es: "El NIST dice que los nuevos prefijos binarios «no son parte del Sistema Internacional de Unidades», aunque se derivaron de los prefijos del SI. La IEC los aprobó en 1998 como norma de la IEC, no del SI; kibi vale 2^10 y kilo 10^3, así que no valen lo mismo; y el nombre conserva solo las dos primeras letras del prefijo decimal y añade «bi»."
  citation: "fuente: `nist-prefijos-binarios.html`; «Prefixes for binary multiples»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q036
  prompt:
    es: "Según el NIST, ¿cómo se forma el símbolo de cada prefijo para múltiplos binarios a partir del símbolo del prefijo decimal correspondiente?"
  options:
  - id: a
    text:
      es: "Añadiendo las letras «bi», que recuerdan la palabra binario."
  - id: b
    text:
      es: "Duplicando la letra del símbolo del prefijo decimal."
  - id: c
    text:
      es: "Escribiendo en minúscula el símbolo del prefijo decimal."
  - id: d
    correct: true
    text:
      es: "Añadiendo la letra «i», que recuerda la palabra binario."
  explanation:
    es: "El NIST dice que el símbolo de cada prefijo binario se obtiene del símbolo del prefijo del SI «añadiendo la letra \"i\"». Las letras «bi» se añaden al nombre, no al símbolo; no se duplica ninguna letra; y la minúscula tampoco es la regla: para 2^10 se usa Ki, con mayúscula, y no ki."
  citation: "fuente: `nist-prefijos-binarios.html`; «Prefixes for binary multiples»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q037
  prompt:
    es: "Según los ejemplos del NIST para los prefijos de múltiplos binarios, un mebibyte (1 MiB), es decir, 2^20 bytes, equivale exactamente a:"
  options:
  - id: a
    correct: true
    text:
      es: "1.048.576 bytes."
  - id: b
    text:
      es: "1.000.000 bytes."
  - id: c
    text:
      es: "1.024.000 bytes."
  - id: d
    text:
      es: "1.073.741.824 bytes."
  explanation:
    es: "El NIST da 1 MiB = 2^20 B = 1.048.576 B. 1.000.000 bytes es 1 MB, con el prefijo decimal; 1.024.000 bytes es el megabyte con que se formatea el disquete de «1,44 MB»; y 1.073.741.824 bytes es 1 GiB."
  citation: "fuente: `nist-prefijos-binarios.html`; «Examples and comparisons with SI prefixes»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q038
  prompt:
    es: "Según los ejemplos del NIST, que comparan los prefijos binarios con los del Sistema Internacional, ¿cuántos bits son un kibibit (1 Kibit)?"
  options:
  - id: a
    text:
      es: "1.000 bits."
  - id: b
    correct: true
    text:
      es: "1.024 bits."
  - id: c
    text:
      es: "8 bits."
  - id: d
    text:
      es: "1.048.576 bits."
  explanation:
    es: "El NIST da 1 Kibit = 2^10 bit = 1.024 bit. 1.000 bits es un kilobit (1 kbit), con el prefijo decimal; 8 bits son un byte; y 1.048.576 es 2^20, el factor de mebi."
  citation: "fuente: `nist-prefijos-binarios.html`; «Examples and comparisons with SI prefixes»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q039
  prompt:
    es: "¿Cuál de los siguientes valores dan normalmente al megabyte los fabricantes de dispositivos de almacenamiento, según el contexto histórico que recoge el NIST?"
  options:
  - id: a
    text:
      es: "1.048.576 bytes, es decir, 2^20 bytes."
  - id: b
    text:
      es: "1.024.000 bytes, como en el disquete."
  - id: c
    correct: true
    text:
      es: "1.000.000 bytes, es decir, 10^6 bytes."
  - id: d
    text:
      es: "1.024 bytes, como en el antiguo kilobyte."
  explanation:
    es: "El NIST cuenta que la mayoría de los fabricantes de memoria usan el megabyte como 2^20 = 1.048.576 bytes, pero que los fabricantes de dispositivos de almacenamiento «normalmente» lo usan como 1.000.000 bytes. 1.024.000 bytes es el megabyte del disquete de «1,44 MB» y 1.024 bytes es el kilobyte que usaban los profesionales de la informática."
  citation: "fuente: `nist-prefijos-binarios.html`; «Historical context»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q040
  prompt:
    es: "Según el NIST, ¿qué organismo aprobó en diciembre de 1998 los nombres y símbolos de los prefijos para múltiplos binarios como norma internacional?"
  options:
  - id: a
    text:
      es: "El Instituto de Ingenieros Eléctricos y Electrónicos (IEEE)."
  - id: b
    text:
      es: "El Comité Internacional de Pesas y Medidas (CIPM)."
  - id: c
    text:
      es: "El Instituto Nacional de Estándares y Tecnología (NIST)."
  - id: d
    correct: true
    text:
      es: "La Comisión Electrotécnica Internacional (IEC)."
  explanation:
    es: "El NIST dice que en diciembre de 1998 la IEC, la Comisión Electrotécnica Internacional, aprobó como norma internacional los nombres y símbolos de esos prefijos. El IEEE y el CIPM apoyaron su desarrollo, pero no los aprobaron, y el NIST solo publica la página que lo cuenta."
  citation: "fuente: `nist-prefijos-binarios.html`; «Prefixes for binary multiples»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q041
  prompt:
    es: "Según el contexto histórico que recoge el NIST, ¿por qué empezaron los profesionales de la informática a usar el prefijo «kilo» con el valor de 1.024?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque 2^10 está muy cerca de 1.000."
  - id: b
    text:
      es: "Porque el Sistema Internacional define kilo como 2^10."
  - id: c
    text:
      es: "Porque la IEC lo aprobó así como norma en 1998."
  - id: d
    text:
      es: "Porque un byte está formado por 1.024 bits."
  explanation:
    es: "El NIST cuenta que los profesionales de la informática vieron que 2^10 era «muy cercano a 1000» y empezaron a usar «kilo» para 1.024. En el SI kilo vale 10^3; lo que la IEC aprobó en 1998 fueron prefijos binarios distintos, como kibi; y un byte tiene 8 bits."
  citation: "fuente: `nist-prefijos-binarios.html`; «Historical context»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q042
  prompt:
    es: "¿Cuál de los siguientes procesadores exige como mínimo Windows 11, según los requisitos del sistema de Microsoft, además de figurar en su lista de CPU aprobadas?"
  options:
  - id: a
    text:
      es: "De 1 GHz o más rápido, con 1 o más núcleos."
  - id: b
    correct: true
    text:
      es: "De 1 GHz o más rápido, con 2 o más núcleos."
  - id: c
    text:
      es: "De 2 GHz o más rápido, con 4 o más núcleos."
  - id: d
    text:
      es: "De 1 GHz o más rápido, con 4 o más núcleos."
  explanation:
    es: "La página de requisitos pide un procesador de «1 GHz o más rápido con 2 o más núcleos y que aparece en nuestra lista de CPU aprobadas». Un solo núcleo se queda por debajo del mínimo, y 2 GHz o 4 núcleos no son el mínimo que fija la página."
  citation: "fuente: `ms-win11-requisitos.html`; «Procesadores/CPU (Unidades de procesamiento central)»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q043
  prompt:
    es: "En Windows 11, ¿cuánta memoria RAM exige como mínimo Microsoft en los requisitos mínimos del sistema que el equipo debe cumplir?"
  options:
  - id: a
    text:
      es: "2 GB."
  - id: b
    text:
      es: "8 GB."
  - id: c
    correct: true
    text:
      es: "4 GB."
  - id: d
    text:
      es: "16 GB."
  explanation:
    es: "La página da para la RAM «4 GB» y añade que, si el equipo tiene menos de 4 GB, a veces se puede ampliar. 2 GB queda por debajo de ese mínimo y 8 o 16 GB lo superan sin ser el mínimo exigido."
  citation: "fuente: `ms-win11-requisitos.html`; «RAM»"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q044
  prompt:
    es: "Según los requisitos mínimos del sistema que Microsoft publica para ejecutar Windows 11 en un equipo, el almacenamiento debe ser un dispositivo de:"
  options:
  - id: a
    text:
      es: "32 GB o más grande."
  - id: b
    text:
      es: "128 GB o más grande."
  - id: c
    text:
      es: "16 GB o más grande."
  - id: d
    correct: true
    text:
      es: "64 GB o más grande."
  explanation:
    es: "La página exige «64 GB o dispositivo de almacenamiento más grande». 32 y 16 GB quedan por debajo del mínimo y 128 GB no es el mínimo que fija la página."
  citation: "fuente: `ms-win11-requisitos.html`; «Almacenamiento»"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q045
  prompt:
    es: "¿Cuál de los siguientes es el requisito mínimo de tarjeta gráfica que establece Microsoft para ejecutar Windows 11 en un equipo?"
  options:
  - id: a
    correct: true
    text:
      es: "Compatible con DirectX 12 o posterior, con controlador WDDM 2.0."
  - id: b
    text:
      es: "Compatible con DirectX 9 o posterior, con controlador WDDM 1.0."
  - id: c
    text:
      es: "Compatible con DirectX 11 o posterior, con controlador WDDM 2.0."
  - id: d
    text:
      es: "Compatible con DirectX 12 o posterior, con controlador WDDM 1.0."
  explanation:
    es: "La página pide una tarjeta gráfica «compatible con DirectX 12 o posterior con controlador WDDM 2.0». DirectX 9 y 11 se quedan por debajo de DirectX 12, y WDDM 1.0 por debajo del controlador WDDM 2.0."
  citation: "fuente: `ms-win11-requisitos.html`; «Tarjeta gráfica»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q046
  prompt:
    es: "Según los requisitos mínimos de Windows 11 que publica Microsoft, ¿qué firmware del sistema debe tener el equipo para ejecutar el sistema operativo?"
  options:
  - id: a
    text:
      es: "BIOS, compatible con el arranque seguro."
  - id: b
    correct: true
    text:
      es: "UEFI, compatible con el arranque seguro."
  - id: c
    text:
      es: "UEFI, aunque no admita el arranque seguro."
  - id: d
    text:
      es: "BIOS o UEFI, con el arranque seguro desactivado."
  explanation:
    es: "La página exige «UEFI (…) y compatible con el arranque seguro» y añade que «el arranque seguro solo puede habilitarse con UEFI». Por eso no vale un BIOS, aunque se diga compatible con el arranque seguro, ni un UEFI que no lo admita, ni el arranque seguro desactivado."
  citation: "fuente: `ms-win11-requisitos.html`; «Firmware del sistema»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q047
  prompt:
    es: "¿Cuál de las siguientes descripciones de UEFI da la página de Microsoft con los requisitos mínimos del sistema para ejecutar Windows 11?"
  options:
  - id: a
    text:
      es: "Una versión moderna del módulo de plataforma segura."
  - id: b
    text:
      es: "Un controlador de pantalla compatible con DirectX 12."
  - id: c
    correct: true
    text:
      es: "Una versión moderna del BIOS del equipo."
  - id: d
    text:
      es: "Un sistema de archivos que sustituye a FAT32."
  explanation:
    es: "La página explica UEFI como «Unified Extensible Firmware Interface, una versión moderna del BIOS del equipo». El módulo de plataforma segura es el TPM, otro requisito aparte; el controlador de la tarjeta gráfica es WDDM 2.0; y los sistemas de archivos de Windows son NTFS, exFAT, UDF y FAT32, no UEFI."
  citation: "fuente: `ms-win11-requisitos.html`; «Firmware del sistema»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q048
  prompt:
    es: "¿Cuál de las siguientes versiones del módulo de plataforma segura (TPM) exige Microsoft como mínimo para ejecutar Windows 11 en un equipo?"
  options:
  - id: a
    text:
      es: "La versión 1.2."
  - id: b
    text:
      es: "La versión 1.0."
  - id: c
    text:
      es: "La versión 3.0."
  - id: d
    correct: true
    text:
      es: "La versión 2.0."
  explanation:
    es: "La página lista el «Módulo de plataforma segura (TPM) versión 2.0» entre los requisitos de Windows 11. La versión 1.2 y la 1.0 son números distintos del que fija la página, y la 3.0 tampoco es el que exige: el requisito es la 2.0 y ninguna otra cifra."
  citation: "fuente: `ms-win11-requisitos.html`; «TPM»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q049
  prompt:
    es: "¿Cuál de las siguientes es la pantalla mínima que exige Microsoft en los requisitos del sistema para ejecutar Windows 11 en un equipo?"
  options:
  - id: a
    correct: true
    text:
      es: "De alta definición (720p), de más de 9 pulgadas en diagonal y 8 bits por canal de color."
  - id: b
    text:
      es: "De alta definición (720p), de más de 7 pulgadas en diagonal y 8 bits por canal de color."
  - id: c
    text:
      es: "De alta definición (1080p), de más de 9 pulgadas en diagonal y 8 bits por canal de color."
  - id: d
    text:
      es: "De alta definición (720p), de más de 9 pulgadas en diagonal y 6 bits por canal de color."
  explanation:
    es: "La página pide una «pantalla de alta definición (720p) superior a 9\" diagonalmente, 8 bits por canal de color». Más de 7 pulgadas o 6 bits por canal se quedan por debajo de ese mínimo, y 1080p no es la resolución mínima que da la página."
  citation: "fuente: `ms-win11-requisitos.html`; «Mostrar»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q050
  prompt:
    es: "Según los requisitos de Windows 11, ¿qué requieren Windows 11 Home y Windows 11 Pro para uso personal durante la configuración inicial del dispositivo?"
  options:
  - id: a
    text:
      es: "Una cuenta local y ninguna conexión a Internet."
  - id: b
    correct: true
    text:
      es: "Conectividad a Internet y una cuenta de Microsoft."
  - id: c
    text:
      es: "Conectividad a Internet, pero ninguna cuenta de Microsoft."
  - id: d
    text:
      es: "Una cuenta de Microsoft, pero ninguna conexión a Internet."
  explanation:
    es: "La página dice que Windows 11 Pro para uso personal y Windows 11 Home «requieren conectividad a Internet y una cuenta de Microsoft durante la configuración inicial del dispositivo». Las otras tres quitan una de las dos cosas o las dos."
  citation: "fuente: `ms-win11-requisitos.html`; «Conectividad a Internet y cuentas de Microsoft»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q051
  prompt:
    es: "Según los requisitos de Windows 11, ¿qué versión de Windows debe ejecutar un dispositivo para actualizar a Windows 11 a través de Windows Update?"
  options:
  - id: a
    text:
      es: "Windows 10, versión 1903 o posterior."
  - id: b
    text:
      es: "Windows 10, versión 1809 o posterior."
  - id: c
    correct: true
    text:
      es: "Windows 10, versión 2004 o posterior."
  - id: d
    text:
      es: "Windows 10, versión 1607 o posterior."
  explanation:
    es: "La página dice: «El dispositivo debe ejecutar Windows 10, versión 2004 o posterior, para actualizar a través de Windows Update». Las versiones 1903, 1809 y 1607 son anteriores a la 2004, así que «posterior a» cualquiera de ellas no basta."
  citation: "fuente: `ms-win11-requisitos.html`; «Versión de Windows para actualización»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q052
  prompt:
    es: "Señale la afirmación correcta sobre el modo S al actualizar a Windows 11, según la página de Microsoft con los requisitos del sistema de Windows 11:"
  options:
  - id: a
    text:
      es: "Windows 10 Pro puede actualizar a Windows 11 Pro en modo S sin salir del modo S."
  - id: b
    text:
      es: "Windows 10 Enterprise conserva el modo S al actualizar a Windows 11 Enterprise."
  - id: c
    text:
      es: "Quien sale del modo S para actualizar a Windows 11 puede volver a él después."
  - id: d
    correct: true
    text:
      es: "Windows 10 Home puede actualizar a Windows 11 Home en modo S sin salir del modo S."
  explanation:
    es: "La página dice que «Windows 10 Home puede actualizar a Windows 11 Home en modo S sin tener que salir del modo S». Para Windows 10 Pro, Education y Enterprise el modo S «ya no está disponible en Windows 11», y quien sale del modo S para actualizar no tendrá «una opción para volver»."
  citation: "fuente: `ms-win11-requisitos.html`; «Actualizar a Windows 11 en modo S»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q053
  prompt:
    es: "¿Cuál de los siguientes elementos de los requisitos de Windows 11 considera Microsoft inherente al diseño del procesador y, por eso, no actualizable?"
  options:
  - id: a
    correct: true
    text:
      es: "El número de núcleos del procesador."
  - id: b
    text:
      es: "La cantidad de memoria RAM del equipo."
  - id: c
    text:
      es: "La unidad de almacenamiento del equipo."
  - id: d
    text:
      es: "La compatibilidad con el arranque seguro."
  explanation:
    es: "La página dice que la velocidad del reloj y el número de núcleos «son inherentes al diseño del procesador» y «no se consideran componentes actualizables». Para la RAM y para la unidad de almacenamiento dice que a veces hay opciones para actualizarlas, y para el arranque seguro remite a los pasos para habilitarlo."
  citation: "fuente: `ms-win11-requisitos.html`; «Procesadores/CPU (Unidades de procesamiento central)»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q054
  prompt:
    es: "¿Qué aplicación proporciona Microsoft a los equipos con Windows 10 para comprobar si cumplen los requisitos mínimos del sistema de Windows 11?"
  options:
  - id: a
    text:
      es: "Administrador de PC de Microsoft."
  - id: b
    correct: true
    text:
      es: "Comprobación de estado del equipo."
  - id: c
    text:
      es: "Herramienta de creación de Windows Media."
  - id: d
    text:
      es: "Kit de herramientas de rendimiento de Windows."
  explanation:
    es: "La página dice que Microsoft proporciona «la aplicación Comprobación de estado del equipo para Windows 10 equipos» para ver si el equipo cumple los requisitos. El Administrador de PC de Microsoft sirve, según la misma página, para proteger el equipo y mejorar su rendimiento; la herramienta de creación de Windows Media prepara soportes de instalación; y el Kit de herramientas de rendimiento de Windows analiza el rendimiento."
  citation: "fuente: `ms-win11-requisitos.html`; «Windows 11 elegibilidad para la actualización»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win11-requisitos-html
- id: m06-l01-q055
  prompt:
    es: "¿Cuál de las siguientes series recoge los tres principios rectores en los que se centró Microsoft al establecer los requisitos mínimos del sistema de Windows 11?"
  options:
  - id: a
    text:
      es: "Rendimiento, seguridad y compatibilidad."
  - id: b
    text:
      es: "Confiabilidad, rendimiento y accesibilidad."
  - id: c
    correct: true
    text:
      es: "Confiabilidad, seguridad y compatibilidad."
  - id: d
    text:
      es: "Seguridad, privacidad y compatibilidad."
  explanation:
    es: "La página dice que, al fijar los requisitos mínimos, Microsoft se centró en tres principios: confiabilidad, seguridad y compatibilidad. Las otras tres series cambian uno o dos de ellos por rendimiento, accesibilidad o privacidad."
  citation: "fuente: `ms-win11-requisitos.html`; «Windows 11 está diseñado para acercarte a lo que te gusta, iniciando en un momento en que los PC son más centrales que nunca en la forma en que nos conectamos, creamos y jugamos. Al establecer los requisitos mínimos del sistema para Windows 11, nos centramos en tres principios rectores para garantizar una gran experiencia del usuario:»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-win-uefi-html
- id: m06-l01-q056
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe, según Microsoft, lo que hace la interfaz del firmware del equipo cuando se inicia un dispositivo?"
  options:
  - id: a
    text:
      es: "Reconoce el hardware nuevo y carga los controladores adecuados sin configuración manual."
  - id: b
    text:
      es: "Guarda temporalmente los datos que la CPU usa mientras el equipo está encendido."
  - id: c
    text:
      es: "Reparte el tiempo del procesador entre los subprocesos según su prioridad."
  - id: d
    correct: true
    text:
      es: "Controla el proceso de arranque y después pasa el control a Windows u otro sistema operativo."
  explanation:
    es: "La página dice que, cuando se inician los dispositivos, «la interfaz del firmware controla el proceso de arranque del equipo y, a continuación, pasa el control a Windows u otro sistema operativo». Reconocer hardware y cargar controladores es Plug and Play, guardar temporalmente los datos de la CPU es la RAM y repartir el tiempo entre subprocesos es el distribuidor de Windows."
  citation: "fuente: `ms-win-uefi.html`; «Requisitos de firmware de United Extensible Firmware Interface (UEFI)»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-uefi-html
- id: m06-l01-q057
  prompt:
    es: "Según la documentación de Microsoft sobre los requisitos de firmware, ¿qué reemplaza la interfaz UEFI en los equipos que la incorporan?"
  options:
  - id: a
    correct: true
    text:
      es: "La antigua interfaz de firmware del BIOS y las especificaciones EFI 1.10."
  - id: b
    text:
      es: "El módulo de plataforma segura (TPM) y la función de arranque seguro."
  - id: c
    text:
      es: "El administrador de Plug and Play y los controladores de cada dispositivo."
  - id: d
    text:
      es: "El controlador WDDM y la compatibilidad con DirectX de la tarjeta gráfica."
  explanation:
    es: "La página dice: «UEFI es lo que reemplaza a la antigua interfaz de firmware del BIOS y a las especificaciones de Extensible Firmware Interface (EFI) 1.10». El TPM y el arranque seguro son requisitos de Windows 11 que conviven con UEFI (el arranque seguro solo se habilita con UEFI); el administrador de PnP es parte de Windows; y WDDM y DirectX son requisitos de la tarjeta gráfica."
  citation: "fuente: `ms-win-uefi.html`; «Requisitos de firmware de United Extensible Firmware Interface (UEFI)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-uefi-html
- id: m06-l01-q058
  prompt:
    es: "¿Cuál de las siguientes es una de las ventajas que Microsoft atribuye a todo firmware que cumpla las especificaciones de UEFI 2.3.1?"
  options:
  - id: a
    text:
      es: "Admitir más fácilmente discos de más de 2 terabytes, pero solo hasta cuatro particiones."
  - id: b
    correct: true
    text:
      es: "Admitir más fácilmente discos de más de 2 terabytes y más de cuatro particiones."
  - id: c
    text:
      es: "Admitir más fácilmente discos de más de 2 gigabytes y más de dos particiones."
  - id: d
    text:
      es: "Tiempos de arranque y reanudación más lentos a cambio de más seguridad."
  explanation:
    es: "Entre las ventajas de UEFI, la página cita la «capacidad de admitir más fácilmente unidades de disco duro grandes (más de 2 terabytes) y unidades con más de cuatro particiones». Limitar a cuatro particiones o hablar de 2 gigabytes y dos particiones cambia esas cifras, y la página habla de tiempos de arranque y reanudación más rápidos, no más lentos."
  citation: "fuente: `ms-win-uefi.html`; «Ventajas de UEFI»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
