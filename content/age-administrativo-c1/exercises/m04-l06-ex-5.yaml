# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q177
  prompt:
    es: "Según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la falta de rendimiento que afecte al normal funcionamiento de los servicios es falta grave siempre que:"
  options:
  - id: a
    text:
      es: "No haya sido objeto de apercibimiento previo."
  - id: b
    correct: true
    text:
      es: "No constituya falta muy grave."
  - id: c
    text:
      es: "No sea imputable a una enfermedad del funcionario."
  - id: d
    text:
      es: "No se haya repetido en el último año natural."
  explanation:
    es: "La letra i) del artículo 7.1 añade solo que la falta de rendimiento «no constituya falta muy grave». No exige un apercibimiento previo, ni excluye las causas de enfermedad, ni mira si se ha repetido en el último año."
  citation: "art. 7.1.i) RD 33/1986"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1986-1216-art-8
- id: m04-l06-q178
  prompt:
    es: "¿Cuál de las siguientes conductas es falta leve según el artículo 8 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La falta de asistencia injustificada de un día."
  - id: b
    text:
      es: "El incumplimiento injustificado de la jornada que acumulado suponga diez horas al mes."
  - id: c
    text:
      es: "La grave perturbación del servicio."
  - id: d
    text:
      es: "La tercera falta injustificada de asistencia en tres meses, tras dos sancionadas como leves."
  explanation:
    es: "La falta de asistencia injustificada de un día es la falta leve de la letra b) del artículo 8. El incumplimiento de la jornada de diez horas al mes, la grave perturbación del servicio y la tercera falta de asistencia en tres meses son faltas graves del artículo 7.1."
  citation: "art. 8.b) RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
