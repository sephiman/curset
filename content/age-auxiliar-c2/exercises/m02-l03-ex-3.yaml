# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q022
  prompt:
    es: "Un registro recibe a las 9:10 un escrito dirigido a una Comunidad Autónoma y a las 9:30 otro dirigido a un Ministerio. ¿En qué orden se anotan sus asientos?"
  options:
  - id: a
    correct: true
    text:
      es: "Primero el recibido a las 9:10, por el orden temporal de recepción."
  - id: b
    text:
      es: "Primero el dirigido al Ministerio, por ser de la Administración General del Estado."
  - id: c
    text:
      es: "En libros separados, según la Administración a la que se dirija cada uno."
  - id: d
    text:
      es: "Con un mismo número de asiento, por haberse recibido el mismo día."
  explanation:
    es: "El artículo 16.2 de la Ley 39/2015 manda anotar los asientos «respetando el orden temporal de recepción o salida de los documentos». El escrito de las 9:10 va antes. La Administración destinataria no da preferencia ni obliga a llevar libros separados. Cada asiento lleva su propio número (artículo 16.3), aunque los escritos lleguen el mismo día."
  citation: "art. 16.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q025
  prompt:
    es: "Conforme al artículo 16.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recibo que se emite automáticamente al registrar un documento consiste en:"
  options:
  - id: a
    correct: true
    text:
      es: "Una copia autenticada del documento, con la fecha y hora de presentación y el número de entrada."
  - id: b
    text:
      es: "Una copia simple del documento, con la fecha de presentación y el órgano destinatario."
  - id: c
    text:
      es: "Un justificante sin copia del documento, con la hora de presentación y el número de entrada."
  - id: d
    text:
      es: "Una copia autenticada del documento, con la fecha prevista de resolución del procedimiento."
  explanation:
    es: "El artículo 16.3 dice que se emite automáticamente «un recibo consistente en una copia autenticada del documento de que se trate, incluyendo la fecha y hora de presentación y el número de entrada de registro». No es una copia simple ni un justificante sin copia del documento. El recibo no fija la fecha de resolución del procedimiento."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q026
  prompt:
    es: "Una vecina presenta en el registro electrónico de su Ayuntamiento un escrito dirigido a un órgano de la Administración General del Estado. ¿Es válida esa presentación?"
  options:
  - id: a
    text:
      es: "Sí, pero solo si el Ayuntamiento ha suscrito antes un convenio de colaboración con la Administración General del Estado."
  - id: b
    text:
      es: "Sí, pero solo si lo presenta en papel en la oficina de asistencia del Ayuntamiento."
  - id: c
    correct: true
    text:
      es: "Sí, porque cabe en el registro electrónico de cualquiera de los sujetos del artículo 2.1 de la Ley 39/2015."
  - id: d
    text:
      es: "No, salvo que el escrito se refiera a una competencia delegada en la Entidad Local."
  explanation:
    es: "El artículo 16.4.a) de la Ley 39/2015 permite presentar los documentos «en el registro electrónico de la Administración u Organismo al que se dirijan, así como en los restantes registros electrónicos de cualquiera de los sujetos a los que se refiere el artículo 2.1». El artículo 2.1 incluye a las Entidades que integran la Administración Local. La ley no exige convenio. No obliga a usar el papel ni la oficina de asistencia. No limita la presentación a las competencias delegadas."
  citation: "art. 16.4.a) LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q028
  prompt:
    es: "Conforme al artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quien resida fuera de España puede presentar los documentos que dirija a una Administración española:"
  options:
  - id: a
    text:
      es: "Solo en el registro electrónico, porque no hay oficinas de registro fuera de España."
  - id: b
    text:
      es: "En las oficinas de correos del país en que resida, por correo certificado internacional."
  - id: c
    text:
      es: "En las representaciones diplomáticas en España del Estado en que resida."
  - id: d
    correct: true
    text:
      es: "En las representaciones diplomáticas u oficinas consulares de España en el extranjero."
  explanation:
    es: "El artículo 16.4.c) admite la presentación «En las representaciones diplomáticas u oficinas consulares de España en el extranjero». Por eso es falso que solo quepa el registro electrónico. El artículo 16.4.b) se refiere a las oficinas de Correos, no a las de correos de otro país. Las representaciones de otro Estado en España no están en la lista."
  citation: "art. 16.4.c) LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q029
  prompt:
    es: "Un interesado quiere presentar una solicitud en el registro electrónico de un Ministerio un domingo a las 23:40. ¿Puede hacerlo?"
  options:
  - id: a
    text:
      es: "No, porque fuera del horario de las oficinas de asistencia el registro no admite documentos."
  - id: b
    text:
      es: "Sí, pero solo si es una persona obligada a relacionarse electrónicamente con la Administración."
  - id: c
    correct: true
    text:
      es: "Sí, porque el registro electrónico admite documentos todos los días del año, las veinticuatro horas."
  - id: d
    text:
      es: "No, salvo que el Ministerio haya habilitado ese día por resolución publicada en su sede."
  explanation:
    es: "El artículo 31.2.a) de la Ley 39/2015 dice que el registro electrónico «Permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». El horario de las oficinas de asistencia no limita el registro electrónico. La regla vale para cualquier interesado, esté o no obligado a relacionarse electrónicamente. No hace falta habilitar el domingo."
  citation: "art. 31.2.a) LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q032
  prompt:
    es: "Según el artículo 16.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, una vez digitalizados los documentos presentados de manera presencial, los originales:"
  options:
  - id: a
    text:
      es: "Se remiten al archivo de oficina o de gestión del órgano destinatario."
  - id: b
    text:
      es: "Se destruyen, salvo que el interesado pida su devolución dentro del plazo de un mes desde la presentación."
  - id: c
    text:
      es: "Se conservan en la oficina de asistencia hasta que finalice el procedimiento."
  - id: d
    correct: true
    text:
      es: "Se devuelven al interesado, salvo que la norma determine su custodia por la Administración."
  explanation:
    es: "El artículo 16.5 dice que se digitalizan «devolviéndose los originales al interesado, sin perjuicio de aquellos supuestos en que la norma determine la custodia por la Administración». No se envían al archivo de oficina del destinatario. No se destruyen ni hay plazo de un mes para pedirlos. La oficina no los retiene hasta que termine el procedimiento."
  citation: "art. 16.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2021-5032-art-53
- id: m02-l03-q034
  prompt:
    es: "Si un documento presentado en papel no puede devolverse al interesado en el momento de su presentación, ¿durante cuánto tiempo se conserva a su disposición una vez digitalizado?"
  options:
  - id: a
    text:
      es: "Durante tres meses, salvo que reglamentariamente se establezca un plazo mayor."
  - id: b
    text:
      es: "Durante un año, sin que quepa establecer un plazo distinto."
  - id: c
    text:
      es: "Hasta que finalice el procedimiento al que se haya incorporado."
  - id: d
    correct: true
    text:
      es: "Durante seis meses, salvo que reglamentariamente se establezca un plazo mayor."
  explanation:
    es: "El artículo 53.1 del Real Decreto 203/2021 dice que esos documentos, «una vez digitalizados serán conservados a su disposición durante seis meses», salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor. No son tres meses ni un año. El plazo corre con independencia del procedimiento al que se incorporen."
  citation: "art. 53.1 RD 203/2021"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2021-5032-art-53
- id: m02-l03-q035
  prompt:
    es: "El plazo de seis meses durante el que se conservan, una vez digitalizados, los documentos en papel que no pudieron devolverse al interesado puede ser mayor:"
  options:
  - id: a
    text:
      es: "Si el interesado lo solicita antes de que venza el plazo."
  - id: b
    text:
      es: "Si el procedimiento al que se incorporan sigue en tramitación."
  - id: c
    text:
      es: "Si la oficina de asistencia lo acuerda por resolución motivada."
  - id: d
    correct: true
    text:
      es: "Si reglamentariamente lo establece la Administración correspondiente."
  explanation:
    es: "El artículo 53.1 del Real Decreto 203/2021 fija los seis meses «salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor». No lo amplía una petición del interesado. Tampoco que el procedimiento siga abierto: el plazo corre «independientemente del procedimiento administrativo al que se incorporen». La oficina de asistencia no puede ampliarlo por resolución."
  citation: "art. 53.1 RD 203/2021"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q036
  prompt:
    es: "Conforme al artículo 16.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas harán pública y mantendrán actualizada una relación de las oficinas en las que se prestará:"
  options:
  - id: a
    text:
      es: "Información sobre el estado de tramitación de los procedimientos."
  - id: b
    text:
      es: "Servicio de compulsa de copias en papel de documentos originales."
  - id: c
    text:
      es: "Asistencia para la práctica de notificaciones en papel a domicilio."
  - id: d
    correct: true
    text:
      es: "Asistencia para la presentación electrónica de documentos."
  explanation:
    es: "El artículo 16.7 dice que las Administraciones «deberán hacer pública y mantener actualizada una relación de las oficinas en las que se prestará asistencia para la presentación electrónica de documentos». La relación no se refiere a la información sobre el estado de tramitación. Tampoco a la compulsa de copias en papel ni a las notificaciones a domicilio."
  citation: "art. 16.7 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-40
- id: m02-l03-q038
  prompt:
    es: "¿Qué naturaleza tienen las Oficinas de asistencia en materia de registros en el ámbito de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen naturaleza de órgano administrativo."
  - id: b
    text:
      es: "Son unidades administrativas sin naturaleza de órgano."
  - id: c
    text:
      es: "Son organismos públicos con personalidad jurídica propia."
  - id: d
    text:
      es: "Son órganos colegiados de carácter interministerial."
  explanation:
    es: "El artículo 40.1 del Real Decreto 203/2021 dice que esas Oficinas «tienen naturaleza de órgano administrativo de acuerdo con lo dispuesto en el artículo 5 de la Ley 40/2015». No son meras unidades sin naturaleza de órgano. No tienen personalidad jurídica propia como un organismo público. No son órganos colegiados."
  citation: "art. 40.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q063
  prompt:
    es: "El registro electrónico de cada Administración u Organismo, en cuanto a los días y horas en que admite la presentación de documentos, permitirá presentarlos:"
  options:
  - id: a
    correct: true
    text:
      es: "Todos los días del año durante las veinticuatro horas."
  - id: b
    text:
      es: "Todos los días hábiles durante las veinticuatro horas."
  - id: c
    text:
      es: "Todos los días del año, en el horario de su sede electrónica."
  - id: d
    text:
      es: "Los días hábiles, en el horario de las oficinas de asistencia."
  explanation:
    es: "El artículo 31.2.a) de la Ley 39/2015 dice que el registro electrónico «Permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». No se limita a los días hábiles. La sede electrónica no impone un horario de presentación. El horario de las oficinas de asistencia rige para la atención presencial, no para el registro electrónico."
  citation: "art. 31.2.a) LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2021-20477-art-4
- id: m02-l03-q084
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, concluido el trámite de registro en el REG-AGE, los documentos serán cursados sin dilación a sus destinatarios y a:"
  options:
  - id: a
    correct: true
    text:
      es: "Las unidades administrativas correspondientes."
  - id: b
    text:
      es: "Las personas delegadas del REG-AGE de cada Ministerio."
  - id: c
    text:
      es: "Las oficinas de asistencia en materia de registros."
  - id: d
    text:
      es: "Los archivos de gestión de cada Ministerio."
  explanation:
    es: "Los documentos se cursan a los destinatarios y a las unidades administrativas correspondientes. Las oficinas de asistencia reciben y digitalizan, pero no son destino del trámite. Los archivos de gestión custodian documentos en tramitación. Las personas delegadas vigilan el funcionamiento del REG-AGE sin recibir los documentos."
  citation: "art. 4.1 Orden PCM/1382/2021"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2021-20477-art-4
- id: m02-l03-q085
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, concluido el trámite de registro en el REG-AGE, los documentos se cursan sin dilación desde:"
  options:
  - id: a
    text:
      es: "La oficina de asistencia más próxima al domicilio del interesado."
  - id: b
    correct: true
    text:
      es: "El registro en que hubieran sido recibidos."
  - id: c
    text:
      es: "El Archivo General de la Administración."
  - id: d
    text:
      es: "La unidad que ejerce la gobernanza y gestión funcional del REG-AGE."
  explanation:
    es: "El precepto fija como punto de salida el registro en que se recibieron. El Archivo General de la Administración no interviene en el trámite. La proximidad al domicilio del interesado solo importa para el directorio de oficinas. La gobernanza funcional del REG-AGE no cursa documentos."
  citation: "art. 4.1 Orden PCM/1382/2021"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q086
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el registro electrónico de cada Administración garantizará la constancia, en cada asiento, de un número, un epígrafe expresivo de su naturaleza y:"
  options:
  - id: a
    text:
      es: "El plazo máximo para resolver y notificar."
  - id: b
    correct: true
    text:
      es: "La fecha y hora de su presentación."
  - id: c
    text:
      es: "La fecha de resolución del procedimiento."
  - id: d
    text:
      es: "La firma electrónica del titular del órgano remitente."
  explanation:
    es: "Tras el número y el epígrafe, el asiento recoge la fecha y hora de presentación. La resolución, la firma del titular del órgano remitente y el plazo para resolver no son datos del asiento."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q087
  prompt:
    es: "Entre los datos que la ley exige en cada asiento del registro electrónico, ¿qué se hace constar, en su caso, sobre el documento que se registra?"
  options:
  - id: a
    text:
      es: "El plazo de conservación fijado en el calendario."
  - id: b
    correct: true
    text:
      es: "Una referencia a su contenido."
  - id: c
    text:
      es: "Su valoración documental previa a la transferencia."
  - id: d
    text:
      es: "Una copia íntegra en soporte papel del documento."
  explanation:
    es: "El asiento incluye, en su caso, la referencia al contenido del documento. La copia en papel, la valoración y el plazo de conservación son operaciones de archivo, no datos del asiento."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q088
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recibo acreditativo de los documentos que acompañen al presentado, emitido por el registro electrónico, garantiza su integridad y:"
  options:
  - id: a
    text:
      es: "La disponibilidad permanente."
  - id: b
    text:
      es: "La trazabilidad de su custodia."
  - id: c
    text:
      es: "La confidencialidad de su contenido."
  - id: d
    correct: true
    text:
      es: "El no repudio."
  explanation:
    es: "El recibo de los documentos acompañantes garantiza la integridad y el no repudio. La confidencialidad, la disponibilidad y la trazabilidad se citan en otros preceptos sobre seguridad, no aquí."
  citation: "art. 16.3 LPAC"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2021-20477-art-6
- id: m02-l03-q089
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, independientemente del sistema de acceso al REG-AGE, se emitirá automáticamente un recibo:"
  options:
  - id: a
    text:
      es: "Firmado de forma manuscrita por el empleado de la oficina que lo registra."
  - id: b
    text:
      es: "Emitido solo cuando lo solicite expresamente la persona interesada."
  - id: c
    correct: true
    text:
      es: "Firmado electrónicamente con uno de los sistemas de firma de la Ley 40/2015."
  - id: d
    text:
      es: "Sellado en papel por la unidad administrativa de destino de cada documento."
  explanation:
    es: "El recibo se emite siempre, de forma automática, y va firmado electrónicamente. Ni la firma manuscrita ni el sello en papel se prevén, y la emisión no depende de que el interesado lo pida."
  citation: "art. 6.1 Orden PCM/1382/2021"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2021-20477-art-6
- id: m02-l03-q090
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, el recibo del REG-AGE incluirá la copia autenticada del escrito presentado y, en su caso, la enumeración y denominación de los documentos adjuntos seguida de:"
  options:
  - id: a
    text:
      es: "El número de registro de salida de cada adjunto."
  - id: b
    correct: true
    text:
      es: "La huella electrónica de cada uno de ellos."
  - id: c
    text:
      es: "El sello de tiempo del órgano de destino."
  - id: d
    text:
      es: "La firma manuscrita escaneada del interesado."
  explanation:
    es: "Cada documento adjunto se identifica con su huella electrónica. El sello de tiempo del destino, la firma manuscrita escaneada y un número de salida por adjunto no figuran en el contenido del recibo."
  citation: "art. 6.1 Orden PCM/1382/2021"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2021-20477-art-8
- id: m02-l03-q091
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, el acceso por internet al REG-AGE permite presentar solicitudes, escritos y comunicaciones todos los días del año, las 24 horas del día, sin perjuicio de:"
  options:
  - id: a
    text:
      es: "Las limitaciones que fije cada Ministerio, sin necesidad de anunciarlas."
  - id: b
    text:
      es: "El horario de apertura de las oficinas de asistencia."
  - id: c
    text:
      es: "Los días declarados inhábiles por la Administración destinataria."
  - id: d
    correct: true
    text:
      es: "Las interrupciones de mantenimiento técnico u operativo."
  explanation:
    es: "La única salvedad son las interrupciones de mantenimiento técnico u operativo. Los días inhábiles no cierran el registro electrónico, el horario de las oficinas no le afecta y las limitaciones ministeriales no existen en el texto."
  citation: "art. 8.1 Orden PCM/1382/2021"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q092
  prompt:
    es: "¿Dónde pueden presentar los interesados los documentos dirigidos a la Administración, además de en los registros electrónicos, en Correos y en las representaciones diplomáticas?"
  options:
  - id: a
    correct: true
    text:
      es: "En las oficinas de asistencia en materia de registros."
  - id: b
    text:
      es: "En las oficinas del Archivo General de la Administración."
  - id: c
    text:
      es: "En las delegaciones del Consejo de Cooperación Archivística."
  - id: d
    text:
      es: "En las sedes de los Patronatos de los Archivos Históricos."
  explanation:
    es: "Las oficinas de asistencia en materia de registros son uno de los lugares de presentación de la letra d). Los archivos, los patronatos y el consejo son organismos de archivo y no reciben documentos de los interesados."
  citation: "art. 16.4 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q093
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los registros electrónicos de todas y cada una de las Administraciones deben ser plenamente interoperables, de modo que se garantice su compatibilidad informática e interconexión, así como la transmisión telemática de:"
  options:
  - id: a
    text:
      es: "Los expedientes electrónicos de los procedimientos finalizados de cada Administración."
  - id: b
    text:
      es: "Las copias auténticas expedidas por los funcionarios habilitados de cada Administración."
  - id: c
    text:
      es: "Las relaciones actualizadas de las oficinas de asistencia de cada Administración Pública."
  - id: d
    correct: true
    text:
      es: "Los asientos registrales y de los documentos que se presenten en cualquiera de los registros."
  explanation:
    es: "La interoperabilidad se completa con la transmisión telemática de los asientos y de los documentos presentados en cualquier registro. Los expedientes finalizados pasan al archivo, no al circuito del registro. Las copias auténticas y la relación de oficinas se rigen por otros apartados."
  citation: "art. 16.4 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q094
  prompt:
    es: "¿Qué garantiza la plena interoperabilidad que la ley exige a los registros electrónicos de todas y cada una de las Administraciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Su compatibilidad informática e interconexión."
  - id: b
    text:
      es: "Su gestión por un único Ministerio de la Administración."
  - id: c
    text:
      es: "La custodia de los originales en papel presentados."
  - id: d
    text:
      es: "El acceso gratuito de todos los ciudadanos al sistema."
  explanation:
    es: "La plena interoperabilidad asegura la compatibilidad informática y la interconexión. La gestión única, la custodia de originales y la gratuidad no se derivan de ella."
  citation: "art. 16.4 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q095
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos presentados de manera presencial ante las Administraciones Públicas deberán ser digitalizados por:"
  options:
  - id: a
    text:
      es: "El archivo central del órgano administrativo al que se dirige el documento."
  - id: b
    text:
      es: "El interesado, antes de entregarlos en la oficina de asistencia que elija."
  - id: c
    correct: true
    text:
      es: "La oficina de asistencia en materia de registros en la que hayan sido presentados."
  - id: d
    text:
      es: "La oficina de asistencia más próxima al órgano al que se dirige el documento."
  explanation:
    es: "Digitaliza la misma oficina de asistencia en la que se presentó el documento, para incorporarlo al expediente electrónico. El archivo central actúa después, con documentos ya tramitados. Exigir al interesado que digitalice contradice el precepto, y la cercanía al órgano destinatario no cuenta."
  citation: "art. 16.5 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-da-cuarta
- id: m02-l03-q096
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas mantendrán permanentemente actualizado en la correspondiente sede electrónica un directorio geográfico que permita al interesado identificar:"
  options:
  - id: a
    text:
      es: "El registro electrónico del Organismo público competente para su procedimiento."
  - id: b
    text:
      es: "La oficina de Correos más cercana a su domicilio, con su horario de apertura."
  - id: c
    correct: true
    text:
      es: "La oficina de asistencia en materia de registros más próxima a su domicilio."
  - id: d
    text:
      es: "El archivo histórico que custodia el documento que el interesado solicita."
  explanation:
    es: "El directorio geográfico sirve para encontrar la oficina de asistencia en materia de registros más próxima al domicilio. No identifica registros de Organismos, archivos históricos ni oficinas de Correos."
  citation: "disposición adicional cuarta LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-da-cuarta
- id: m02-l03-q097
  prompt:
    es: "Para que el interesado identifique la oficina más próxima a su domicilio, ¿dónde mantienen actualizado las Administraciones Públicas el directorio geográfico de las oficinas de asistencia en materia de registros?"
  options:
  - id: a
    correct: true
    text:
      es: "En la correspondiente sede electrónica."
  - id: b
    text:
      es: "En el Registro Electrónico General de cada Administración."
  - id: c
    text:
      es: "En el tablón de anuncios de cada oficina."
  - id: d
    text:
      es: "En el diario oficial correspondiente."
  explanation:
    es: "El directorio se mantiene en la sede electrónica correspondiente. El diario oficial publica las disposiciones de creación de registros, no el directorio. El Registro Electrónico General anota documentos. El tablón de cada oficina no está previsto."
  citation: "disposición adicional cuarta LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
