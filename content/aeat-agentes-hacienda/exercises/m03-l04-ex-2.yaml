# anchor: boe-a-2007-15984-art-17
- id: m03-l04-q0078
  prompt:
    es: "La sociedad Aceites Montoro, S.L. cambia su domicilio fiscal el 10 de junio de 2025. Según el Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿hasta qué día debe comunicar el cambio a la Administración tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el 10 de julio de 2025."
  - id: b
    text:
      es: "Hasta el 10 de septiembre de 2025."
  - id: c
    text:
      es: "Hasta el 10 de diciembre de 2025."
  - id: d
    text:
      es: "Hasta el 10 de agosto de 2025."
  explanation:
    es: "Las personas jurídicas y demás entidades comunican el cambio de domicilio fiscal en el plazo de un mes desde que se produzca (art. 17.1). Contado de fecha a fecha desde el 10 de junio, termina el 10 de julio. Tres meses (10 de septiembre) es el plazo de las personas físicas que no deben figurar en el censo, y las otras fechas no corresponden a ningún plazo del precepto."
  citation: "art. 17.1 RGAT"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2007-15984-art-17
- id: m03-l04-q0079
  prompt:
    es: "Elvira Nogales, jubilada que no debe figurar en el Censo de Empresarios, Profesionales y Retenedores, cambia de domicilio fiscal el 15 de enero de 2025. Ningún plazo de presentación de una autoliquidación termina antes de que venza el plazo general de comunicación. Conforme al Real Decreto 1065/2007, de 27 de julio, del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿hasta qué día debe comunicarlo?"
  options:
  - id: a
    text:
      es: "Hasta el 15 de febrero de 2025."
  - id: b
    text:
      es: "Hasta el 15 de julio de 2025."
  - id: c
    correct: true
    text:
      es: "Hasta el 15 de abril de 2025."
  - id: d
    text:
      es: "Hasta el 15 de enero de 2026."
  explanation:
    es: "Las personas físicas que no deben figurar en el censo comunican el cambio en el plazo de tres meses desde que se produzca (art. 17.2). Como ningún plazo de autoliquidación termina antes, no entra la excepción, y el 15 de enero más tres meses da el 15 de abril. El 15 de febrero es el plazo de un mes de las personas físicas del censo, y las otras fechas no corresponden a plazos del precepto."
  citation: "art. 17.2 RGAT"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2007-15984-art-59
- id: m03-l04-q0082
  prompt:
    es: "El 3 de marzo de 2025 la Administración tributaria inició de oficio un procedimiento contra Silvia Pardo. El 10 de marzo ella comunicó su nuevo domicilio fiscal y, dentro del mes siguiente, la Administración inició un procedimiento de comprobación de la procedencia del cambio. Conforme al Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por Real Decreto 1065/2007, de 27 de julio, ¿qué órgano continúa el procedimiento iniciado el 3 de marzo?"
  options:
  - id: a
    text:
      es: "El órgano competente por razón del nuevo domicilio, desde la presentación de la comunicación."
  - id: b
    correct: true
    text:
      es: "El órgano que lo venía tramitando, mientras no se resuelva el expediente de comprobación."
  - id: c
    text:
      es: "El órgano competente por razón del nuevo domicilio, desde que finalice el plazo de un mes."
  - id: d
    text:
      es: "Cualquiera de los dos órganos, a elección del obligado tributario."
  explanation:
    es: "Si la Administración inicia dentro del mes un procedimiento de comprobación de la procedencia del cambio, los procedimientos iniciados de oficio antes de la comunicación continúan y finalizan por el órgano que los tramitaba mientras no se resuelva ese expediente (art. 59.2). El nuevo domicilio no desplaza la competencia ni desde la presentación ni desde el vencimiento del mes, y el obligado no elige órgano."
  citation: "art. 59.2 RGAT"
  difficulty: 2
  tags:
  - "órgano"
  - "efecto"
# anchor: boe-a-2007-15984-art-113
- id: m03-l04-q0083
  prompt:
    es: "¿Qué se entiende por actividades económicas a efectos del artículo 113 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, sobre el domicilio fiscal de las personas físicas que las desarrollan principalmente?"
  options:
  - id: a
    text:
      es: "Las realizadas por quienes obtienen rendimientos del trabajo y del capital mobiliario, según la Ley del Impuesto sobre la Renta de las Personas Físicas."
  - id: b
    text:
      es: "Las realizadas por empresarios y profesionales con ánimo de lucro, según el Código de Comercio."
  - id: c
    text:
      es: "Las realizadas por quienes están dados de alta en el Censo de Obligados Tributarios."
  - id: d
    correct: true
    text:
      es: "Las realizadas por los empresarios y profesionales en los términos de la Ley del Impuesto sobre el Valor Añadido."
  explanation:
    es: "El artículo 113 remite al concepto de actividad económica de la Ley del IVA: las realizadas por empresarios y profesionales en esos términos. No se define por los rendimientos del trabajo o del capital, ni por el Código de Comercio, ni por el alta en el Censo de Obligados Tributarios, que incluye a quien deba tener número fiscal."
  citation: "art. 113 RGAT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0084
  prompt:
    es: "La comunidad de bienes Hermanos Olmedo, C.B., carente de personalidad jurídica, constituye una unidad económica susceptible de imposición. Fija su sede en Cuenca, pero su gestión administrativa y la dirección de sus negocios se llevan efectivamente desde Albacete. Según la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es su domicilio fiscal?"
  options:
  - id: a
    correct: true
    text:
      es: "Albacete, donde se lleva a cabo la gestión y la dirección de sus negocios."
  - id: b
    text:
      es: "Cuenca, donde fija su sede, por ser su domicilio social."
  - id: c
    text:
      es: "El domicilio fiscal de cada comunero, según su residencia habitual, de forma independiente."
  - id: d
    text:
      es: "Cualquiera de los dos lugares, a elección de los comuneros."
  explanation:
    es: "Para los entes del artículo 35.4 el domicilio es el que resulte de las reglas aplicables a las personas jurídicas (art. 48.2.c). El domicilio social solo vale si allí está centralizada la gestión; en otro caso se atiende al lugar donde se lleva a cabo (art. 48.2.b), aquí Albacete. La residencia de cada comunero es el criterio de las personas físicas, y los comuneros no eligen."
  citation: "art. 48.2 LGT"
  difficulty: 3
  tags:
  - "sujeto"
  - "condición"
