# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0198
  prompt:
    es: "Fallecido cualquier obligado al pago de la deuda tributaria, el artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que el procedimiento de recaudación continúa con sus herederos y, en su caso, legatarios, sin más requisitos que:"
  options:
  - id: a
    correct: true
    text:
      es: "la constancia del fallecimiento y la notificación a los sucesores, con requerimiento del pago de la deuda tributaria y costas pendientes del causante."
  - id: b
    text:
      es: "la aceptación expresa de la herencia por los sucesores y la inscripción de la declaración de herederos en el registro correspondiente al domicilio del causante."
  - id: c
    text:
      es: "la constancia del fallecimiento y la apertura de un nuevo procedimiento de apremio frente a cada sucesor, con nueva providencia."
  - id: d
    text:
      es: "la declaración de herederos por el notario y la notificación a los sucesores de una nueva liquidación de la deuda pendiente."
  explanation:
    es: "Basta que conste el fallecimiento y que se notifique a los sucesores el requerimiento de pago de la deuda y las costas pendientes (art. 177.1 LGT). No se exige aceptación expresa ni declaración notarial de herederos, ni una nueva liquidación. Tampoco se abre un apremio nuevo con otra providencia, porque el procedimiento continúa."
  citation: "art. 177.1 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0199
  prompt:
    es: "Cuando el heredero alega haber hecho uso del derecho a deliberar, el artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que se suspende el procedimiento de recaudación hasta que transcurra el plazo concedido para ello, durante el cual el heredero puede solicitar:"
  options:
  - id: a
    text:
      es: "la declaración de prescripción de las deudas tributarias pendientes del causante, si no consta su reclamación."
  - id: b
    correct: true
    text:
      es: "la relación de las deudas tributarias pendientes del causante, con efectos meramente informativos."
  - id: c
    text:
      es: "una certificación de deudas del causante con efectos vinculantes para la Administración tributaria, en todo caso."
  - id: d
    text:
      es: "un aplazamiento extraordinario de las deudas tributarias pendientes del causante durante el plazo de deliberación."
  explanation:
    es: "Durante la deliberación se suspende el procedimiento y el heredero puede pedir la relación de deudas pendientes, con efectos meramente informativos (art. 177.1 LGT). La relación no vincula a la Administración. El aplazamiento extraordinario y la declaración de prescripción no son lo que prevé el artículo."
  citation: "art. 177.1 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0200
  prompt:
    es: "Según el artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, mientras la herencia se encuentra yacente, ¿cómo continúa el procedimiento de recaudación de las deudas tributarias pendientes?"
  options:
  - id: a
    text:
      es: "Se dirige contra los bienes personales de los presuntos herederos, que responden solidariamente de la deuda."
  - id: b
    text:
      es: "Se archiva provisionalmente y se reanuda cuando se haya declarado la condición de heredero del causante."
  - id: c
    correct: true
    text:
      es: "Puede continuar dirigiéndose contra sus bienes y derechos, entendiéndose las actuaciones con quien ostente su administración o representación."
  - id: d
    text:
      es: "Queda en suspenso hasta que los herederos acepten la herencia y se les notifique el requerimiento de pago."
  explanation:
    es: "La herencia yacente no paraliza el cobro: se sigue contra sus bienes y derechos con quien la administre o represente (art. 177.1 LGT). No queda en suspenso hasta la aceptación. Los bienes personales de los presuntos herederos no responden mientras no lo sean, y el archivo provisional no está previsto."
  citation: "art. 177.1 LGT"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0201
  prompt:
    es: "Falleció el 5 de junio de 2026 Gaspar Roda, obligado al pago de una deuda de 15.000 euros. Nadie ha aceptado todavía la herencia, que se encuentra yacente, y hay una persona que la administra. Conforme al artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo puede proceder la Administración?"
  options:
  - id: a
    correct: true
    text:
      es: "Continuar el procedimiento de recaudación contra los bienes y derechos de la herencia, entendiendo las actuaciones con quien ostente su administración."
  - id: b
    text:
      es: "Declarar fallida la deuda por haber fallecido el obligado, y dar de baja el crédito sin dirigirse contra la herencia."
  - id: c
    text:
      es: "Suspender el procedimiento de recaudación hasta que algún heredero acepte la herencia y reciba el requerimiento de pago."
  - id: d
    text:
      es: "Dirigirse contra el patrimonio personal del administrador de la herencia, que responde de la deuda con sus propios bienes."
  explanation:
    es: "La herencia yacente no impide continuar contra sus bienes y derechos, con quien ostente su administración o representación (art. 177.1 LGT). No hay suspensión hasta que alguien acepte. El fallecimiento no convierte la deuda en fallida ni obliga a darla de baja. Y el administrador de la herencia no responde con su patrimonio personal."
  citation: "art. 177.1 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "procedimiento"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0202
  prompt:
    es: "Fallecida Irene Bote, deudora de 8.000 euros, su heredero Tomás alega que está haciendo uso del derecho a deliberar. Según el artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre con el procedimiento de recaudación?"
  options:
  - id: a
    text:
      es: "Se suspende hasta que Tomás acepte la herencia, y la Administración debe esperar sin límite de tiempo."
  - id: b
    text:
      es: "Continúa sin interrupción, y Tomás debe pagar las deudas que figuren en la relación que le facilite la Administración."
  - id: c
    correct: true
    text:
      es: "Se suspende hasta que transcurra el plazo concedido para deliberar, y Tomás puede pedir la relación de deudas pendientes con efectos informativos."
  - id: d
    text:
      es: "Se suspende, pero solo respecto de las deudas de importe superior a 6.000 euros del causante."
  explanation:
    es: "Si el heredero alega haber hecho uso del derecho a deliberar, se suspende el procedimiento hasta que termine el plazo concedido, y puede pedir la relación de deudas con efectos meramente informativos (art. 177.1 LGT). No continúa sin interrupción. La suspensión llega hasta el fin del plazo, no hasta la aceptación. Y no existe un umbral de 6.000 euros."
  citation: "art. 177.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0203
  prompt:
    es: "Disuelta y liquidada una sociedad o entidad, el artículo 177.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria establece que el procedimiento de recaudación continúa con sus socios, partícipes o cotitulares:"
  options:
  - id: a
    text:
      es: "desde la fecha en que se presenta la declaración de liquidación en el Registro Mercantil."
  - id: b
    text:
      es: "en el momento en que se acuerda la disolución de la sociedad o entidad."
  - id: c
    text:
      es: "cuando el liquidador comunica a la Administración la existencia de deudas pendientes."
  - id: d
    correct: true
    text:
      es: "una vez constatada la extinción de la personalidad jurídica."
  explanation:
    es: "Los socios, partícipes o cotitulares sucesores entran cuando consta la extinción de la personalidad jurídica (art. 177.2 LGT). No basta el acuerdo de disolución. La inscripción de la liquidación y la comunicación del liquidador no son el momento que fija el artículo."
  citation: "art. 177.2 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0205
  prompt:
    es: "Según el artículo 177.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria puede dirigirse, para requerirles el pago de la deuda tributaria y costas pendientes, contra cualquiera de los socios, partícipes, cotitulares o destinatarios, o:"
  options:
  - id: a
    text:
      es: "contra el socio de mayor participación y, solo subsidiariamente, contra los demás."
  - id: b
    text:
      es: "contra todos ellos, pero únicamente de forma simultánea y por partes iguales."
  - id: c
    correct: true
    text:
      es: "contra todos ellos simultánea o sucesivamente."
  - id: d
    text:
      es: "solo contra los que hayan percibido bienes o derechos de la sociedad en la liquidación."
  explanation:
    es: "Puede reclamar a cualquiera de ellos o a todos, simultánea o sucesivamente (art. 177.2 LGT). No se limita a quienes hayan recibido bienes en la liquidación, ni exige actuar a la vez y por partes iguales, ni impone un orden de mayor a menor participación."
  citation: "art. 177.2 LGT"
  difficulty: 3
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0206
  prompt:
    es: "Disuelta y liquidada Cerámicas Valle, S.L., con una deuda pendiente de 60.000 euros, consta la extinción de su personalidad jurídica. Los tres socios, Ana, Beto y Clara, no pagan. Conforme al artículo 177.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿contra quién puede dirigirse la Administración tributaria?"
  options:
  - id: a
    text:
      es: "Solo contra el socio que ejercía la administración, y subsidiariamente contra los otros dos socios."
  - id: b
    text:
      es: "Contra los tres socios simultáneamente, y cada uno responde de 20.000 euros, sin posibilidad de reclamar a uno solo."
  - id: c
    correct: true
    text:
      es: "Contra cualquiera de los tres socios, o contra todos ellos simultánea o sucesivamente, para requerirles el pago de la deuda y las costas pendientes."
  - id: d
    text:
      es: "Contra ninguno, porque extinguida la sociedad se extingue también la deuda pendiente."
  explanation:
    es: "Constatada la extinción, los socios son sucesores y la Administración puede dirigirse contra cualquiera o contra todos, simultánea o sucesivamente (art. 177.2 LGT). No hay un orden con el administrador primero. No está obligada a reclamar a la vez ni por partes iguales. Y la extinción de la sociedad no extingue la deuda."
  citation: "art. 177.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "sujeto"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0207
  prompt:
    es: "Si el obligado al pago fallece dentro del período voluntario, el artículo 127.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se requiere al sucesor para que realice el pago:"
  options:
  - id: a
    correct: true
    text:
      es: "dentro del plazo del artículo 62.2 de la Ley General Tributaria."
  - id: b
    text:
      es: "una vez notificada al sucesor la providencia de apremio, con el recargo de apremio ordinario del 20 por ciento."
  - id: c
    text:
      es: "dentro del plazo del artículo 62.5 de la Ley General Tributaria, con el recargo ejecutivo del 5 por ciento."
  - id: d
    text:
      es: "en el plazo de un mes desde la constancia del fallecimiento, con el recargo reducido del 10 por ciento."
  explanation:
    es: "Si el obligado muere en voluntaria, el sucesor paga en el plazo del artículo 62.2 LGT, el del período voluntario (art. 127.1.a RGR). El artículo 62.5 es el plazo del período ejecutivo. El mes con recargo reducido y la providencia con recargo del 20 por ciento no son reglas de este supuesto."
  citation: "art. 127.1.a RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0208
  prompt:
    es: "Si el obligado fallece antes de notificarse la providencia de apremio, el artículo 127.1.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se notifica al sucesor dicha providencia y que, si paga antes de esa notificación, se le exige:"
  options:
  - id: a
    text:
      es: "los intereses de demora y las costas, sin ningún recargo del período ejecutivo."
  - id: b
    correct: true
    text:
      es: "el recargo ejecutivo."
  - id: c
    text:
      es: "el recargo de apremio ordinario del 20 por ciento, desde el día del fallecimiento del obligado."
  - id: d
    text:
      es: "el recargo de apremio reducido del 10 por ciento, aunque la providencia no se haya notificado."
  explanation:
    es: "Antes de la providencia, si el sucesor paga se le exige el recargo ejecutivo (art. 127.1.b RGR). Los recargos reducido y ordinario corresponden a fallecimientos posteriores a la notificación de la providencia (letras c y d). No se exige solo interés y costas sin recargo."
  citation: "art. 127.1.b RGR"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0210
  prompt:
    es: "A Rafael Ortiz se le notifica la providencia de apremio por una deuda de 10.000 euros. Rafael fallece antes de que termine el plazo del artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria. Conforme al artículo 127.1.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué importe se requiere a su sucesora para que pague en ese plazo?"
  options:
  - id: a
    text:
      es: "12.000 euros: la deuda de 10.000 más el recargo de apremio ordinario del 20 por ciento, que son 2.000 euros."
  - id: b
    text:
      es: "10.500 euros: la deuda de 10.000 más el recargo ejecutivo del 5 por ciento, que son 500 euros."
  - id: c
    text:
      es: "10.000 euros: solo la deuda, porque el recargo se extingue con el fallecimiento del obligado."
  - id: d
    correct: true
    text:
      es: "11.000 euros: la deuda de 10.000 más el recargo de apremio reducido del 10 por ciento, que son 1.000 euros."
  explanation:
    es: "El fallecimiento tras la providencia y antes del fin del plazo del artículo 62.5 lleva a requerir deuda más recargo de apremio reducido del 10 por ciento: 10.000 × 0,10 = 1.000 euros, es decir, 11.000 (art. 127.1.c RGR). El 20 por ciento es el recargo que se incluiría en el embargo si la sucesora no paga en ese plazo. El 5 por ciento es el recargo ejecutivo del pago anterior a la providencia. Y el recargo no se extingue con el fallecimiento."
  citation: "art. 127.1.c RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0211
  prompt:
    es: "Si el obligado falleció tras notificarse la providencia y antes de finalizar el plazo del artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué recargo se incluye si el sucesor no ingresa el total, según el artículo 127.1.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El recargo ejecutivo del 5 por ciento, con embargo de sus bienes o ejecución de las garantías existentes para el cobro."
  - id: b
    text:
      es: "El recargo de apremio del 15 por ciento, con advertencia de declaración de responsabilidad."
  - id: c
    text:
      es: "El recargo de apremio reducido del 10 por ciento, con embargo de sus bienes únicamente."
  - id: d
    correct: true
    text:
      es: "El recargo de apremio del 20 por ciento, con embargo de sus bienes o ejecución de las garantías."
  explanation:
    es: "Si no ingresa en ese plazo el importe total, incluido el recargo reducido del 10 por ciento, se procede al embargo de sus bienes o a la ejecución de garantías con el recargo de apremio del 20 por ciento (art. 127.1.c RGR). El 5 por ciento es el recargo ejecutivo. El reducido del 10 por ciento es el que debía pagar en plazo. El 15 por ciento no figura entre los recargos de este artículo."
  citation: "art. 127.1.c RGR"
  difficulty: 3
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0213
  prompt:
    es: "De acuerdo con el artículo 127.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre la herencia yacente y el derecho a deliberar del heredero:"
  options:
  - id: a
    text:
      es: "Las actuaciones frente a la herencia yacente se entienden siempre con el heredero que haya alegado el derecho a deliberar."
  - id: b
    text:
      es: "La suspensión por el derecho a deliberar del heredero alcanza también a las actuaciones frente a la herencia yacente."
  - id: c
    correct: true
    text:
      es: "La suspensión por el derecho a deliberar del heredero no afecta a las actuaciones recaudatorias frente a la herencia yacente."
  - id: d
    text:
      es: "Las actuaciones frente a la herencia yacente solo pueden iniciarse después de que haya terminado el plazo de deliberación del heredero."
  explanation:
    es: "La suspensión por deliberar no afecta a las actuaciones contra la herencia yacente, que sigue su curso (art. 127.2 RGR). La suspensión no se extiende a ella, ni se espera al fin de la deliberación, y las actuaciones se entienden con quien administre o represente la herencia, no con el heredero que delibera."
  citation: "art. 127.2 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0214
  prompt:
    es: "Disuelta una sociedad, entidad o fundación, el artículo 127.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que sus socios, partícipes, cotitulares o destinatarios se subrogan en la misma posición en que se encontraba la sociedad, entidad o fundación:"
  options:
  - id: a
    text:
      es: "en el momento de la notificación del requerimiento de pago al sucesor."
  - id: b
    text:
      es: "en el momento de la inscripción de la liquidación en el registro."
  - id: c
    text:
      es: "en el momento del acuerdo de disolución de la sociedad."
  - id: d
    correct: true
    text:
      es: "en el momento de la extinción de la personalidad jurídica."
  explanation:
    es: "La subrogación se produce respecto de la posición que la entidad tenía cuando se extinguió su personalidad jurídica (art. 127.4 RGR). No es la fecha del acuerdo de disolución, ni la de la inscripción, ni la de la notificación del requerimiento."
  citation: "art. 127.4 RGR"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0215
  prompt:
    es: "Conforme al artículo 127.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el requerimiento de pago a los sucesores de una sociedad disuelta:"
  options:
  - id: a
    correct: true
    text:
      es: "Se les requiere el pago por las mismas cuatro reglas que para los herederos, tomando el momento de la extinción de la personalidad jurídica en lugar del fallecimiento."
  - id: b
    text:
      es: "Se les requiere siempre el pago en el plazo del artículo 62.2, sea cual sea el momento de la extinción de la personalidad jurídica."
  - id: c
    text:
      es: "Se les requiere el pago con el recargo de apremio del 20 por ciento, sin distinguir el momento de la extinción."
  - id: d
    text:
      es: "Se les requiere el pago por las mismas cuatro reglas, tomando como referencia la fecha del acuerdo de disolución."
  explanation:
    es: "Los sucesores de la sociedad se rigen por las cuatro reglas del fallecimiento, con la extinción de la personalidad jurídica como momento de referencia (art. 127.4 RGR). El plazo no es siempre el del artículo 62.2. La fecha de referencia no es la del acuerdo de disolución. Y el recargo del 20 por ciento no se aplica sin distinguir el momento."
  citation: "art. 127.4 RGR"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0217
  prompt:
    es: "¿Qué debe exigirse al sucesor si el obligado fallece antes de la notificación de la providencia de apremio, según el artículo 127.1.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Se le notifica la providencia de apremio, y si paga antes de esa notificación, se le exige el recargo ejecutivo."
  - id: b
    text:
      es: "Se le requiere el pago en el plazo del artículo 62.2, sin notificarle ninguna providencia de apremio."
  - id: c
    text:
      es: "Se le notifica la providencia de apremio, y si paga antes de esa notificación, se le exige el recargo de apremio ordinario."
  - id: d
    text:
      es: "Se le requiere el pago con el recargo de apremio reducido del 10 por ciento, sin notificarle la providencia."
  explanation:
    es: "Si el obligado muere antes de la providencia, esta se notifica al sucesor, y si paga antes de la notificación se le exige el recargo ejecutivo (art. 127.1.b RGR). El requerimiento en el plazo del artículo 62.2 es del fallecimiento en voluntaria. El recargo reducido corresponde al fallecimiento posterior a la providencia, y el ordinario al posterior al plazo del artículo 62.5."
  citation: "art. 127.1 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0218
  prompt:
    es: "¿Cuál de los siguientes momentos del fallecimiento del obligado al pago determina que se requiera al sucesor que pague la deuda dentro del plazo del artículo 62.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, según el artículo 127.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El fallecimiento una vez notificada la providencia y antes de finalizar el plazo del artículo 62.5."
  - id: b
    correct: true
    text:
      es: "El fallecimiento dentro del período voluntario."
  - id: c
    text:
      es: "El fallecimiento después de la finalización del plazo del artículo 62.5."
  - id: d
    text:
      es: "El fallecimiento antes de la notificación de la providencia de apremio."
  explanation:
    es: "Solo el fallecimiento en período voluntario remite al plazo del artículo 62.2 (art. 127.1.a RGR). Antes de la providencia se notifica esta al sucesor (letra b). Tras la providencia y antes del fin del plazo del artículo 62.5 se exige el recargo reducido del 10 por ciento (letra c). Después de ese plazo, el recargo ordinario (letra d)."
  citation: "art. 127.1 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-127
- id: m03-l12-q0281
  prompt:
    es: "Conforme al artículo 127.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el requerimiento al sucesor del obligado fallecido según el momento del fallecimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro del período voluntario se exige el pago en el plazo del artículo 62.2; antes de la providencia se le notifica esta; después del plazo del artículo 62.5 se exige el recargo de apremio ordinario."
  - id: b
    text:
      es: "En ningún momento se requiere el pago al sucesor, que solo responde si acepta la herencia pura y simplemente."
  - id: c
    text:
      es: "Dentro del período voluntario se exige el pago en el plazo del artículo 62.5; antes de la providencia se le exige directamente el recargo de apremio ordinario."
  - id: d
    text:
      es: "Dentro del período voluntario se exige el pago con el recargo ejecutivo del 5 por ciento; después del plazo del artículo 62.5 se exige el recargo reducido del 10 por ciento."
  explanation:
    es: "Las cuatro reglas del artículo 127.1 RGR son: fallecimiento en voluntaria, pago en el plazo del artículo 62.2; antes de la providencia, se notifica esta; entre la providencia y el fin del plazo del artículo 62.5, recargo reducido del 10 por ciento; y después, recargo ordinario. Las otras opciones confunden plazos y recargos o niegan el requerimiento al sucesor."
