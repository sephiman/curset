  citation: jep-505#History; jep-525#History; jep-533#History
- id: m03-l03-q17
  prompt:
    en: Virtual threads are scheduled by the Java runtime onto a small set of carrier threads. According to the
      `Thread` Javadoc, which workload suits them?
  options:
  - id: a
    text:
      en: Long running CPU intensive operations that keep a core busy for minutes
  - id: b
    correct: true
    text:
      en: Tasks that spend most of the time blocked, often waiting for I/O operations
  - id: c
    text:
      en: Tasks that must change their own thread priority at run time
  - id: d
    text:
      en: Background work that must keep the JVM running after `main` returns
  explanation:
    en: Virtual threads are suitable for executing tasks that spend most of the time blocked, often waiting for
      I/O operations to complete. CPU intensive work is wrong because virtual threads are not intended for long
      running CPU intensive operations. Changing the priority is wrong because virtual threads have a fixed thread
      priority that cannot be changed. Keeping the JVM alive is wrong because virtual threads are daemon threads
      and do not prevent the shutdown sequence from beginning.
  citation: javadoc-thread#virtual-threads
