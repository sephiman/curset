# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0099
  prompt:
    es: "Según el artículo 82.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la unidad familiar de los cónyuges no separados legalmente incluye, si los hubiera, a los hijos menores, con excepción de los que:"
  options:
  - id: a
    text:
      es: "hayan cumplido dieciséis años."
  - id: b
    correct: true
    text:
      es: "con el consentimiento de los padres, vivan independientes de estos."
  - id: c
    text:
      es: "tengan rentas propias superiores a 8.000 euros."
  - id: d
    text:
      es: "cursen estudios fuera del domicilio familiar."
  explanation:
    es: "Quedan fuera de la unidad los hijos menores que, con el consentimiento de los padres, vivan independientes de estos (art. 82.1.1.ª, letra a). Los dieciséis años, las rentas propias y los estudios fuera del domicilio no son excepciones del artículo."
  citation: "art. 82.1.1.ª LIRPF"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0100
  prompt:
    es: "De acuerdo con el artículo 82.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los hijos mayores de edad se integran en la unidad familiar de los cónyuges no separados legalmente cuando estén incapacitados judicialmente y sujetos a:"
  options:
  - id: a
    text:
      es: "tutela ejercida por una entidad pública."
  - id: b
    correct: true
    text:
      es: "patria potestad prorrogada o rehabilitada."
  - id: c
    text:
      es: "curatela de un familiar, sin patria potestad."
  - id: d
    text:
      es: "guarda de hecho de cualquiera de los padres."
  explanation:
    es: "El mayor de edad se integra si está incapacitado judicialmente y sujeto a patria potestad prorrogada o rehabilitada (art. 82.1.1.ª, letra b). La tutela pública, la curatela sin patria potestad y la guarda de hecho no son las situaciones que menciona la ley."
  citation: "art. 82.1.1.ª LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0102
  prompt:
    es: "De acuerdo con el artículo 82.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la determinación de los miembros de la unidad familiar se realiza atendiendo a la situación existente:"
  options:
  - id: a
    text:
      es: "a 1 de enero de cada año."
  - id: b
    text:
      es: "en la fecha de presentación de la declaración."
  - id: c
    text:
      es: "en la fecha en que se ejerce la opción por la tributación conjunta."
  - id: d
    correct: true
    text:
      es: "a 31 de diciembre de cada año."
  explanation:
    es: "Los miembros de la unidad familiar se determinan según la situación a 31 de diciembre de cada año (art. 82.3). El 1 de enero, la fecha de presentación y la del ejercicio de la opción no son el momento que fija el precepto."
  citation: "art. 82.3 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0103
  prompt:
    es: "Gonzalo y Rita son cónyuges no separados legalmente. Su hijo Dani cumple 18 años el 15 de enero de 2026 y no está incapacitado judicialmente. Según el artículo 82 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede Dani formar parte de su unidad familiar a efectos de la tributación conjunta del período impositivo 2025?"
  options:
  - id: a
    text:
      es: "No, porque cumple la mayoría de edad antes de que termine el plazo de declaración."
  - id: b
    text:
      es: "Sí, pero solo en proporción a los días de 2025 en que fue menor de edad."
  - id: c
    correct: true
    text:
      es: "Sí, porque a 31 de diciembre de 2025 era menor de edad."
  - id: d
    text:
      es: "No, porque la situación se determina en la fecha de presentación de la declaración, cuando ya es mayor de edad."
  explanation:
    es: "La pertenencia a la unidad familiar se determina por la situación a 31 de diciembre de cada año (art. 82.3). A 31 de diciembre de 2025 Dani era menor, de modo que forma parte de la unidad de ese período. El plazo de declaración y la fecha de presentación no son el momento de referencia. Y la ley no prorratea la condición por días."
  citation: "art. 82.3 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0104
  prompt:
    es: "Conforme al artículo 82.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, respecto de la pertenencia a unidades familiares:"
  options:
  - id: a
    text:
      es: "una persona puede formar parte de dos unidades familiares si una es de cada modalidad."
  - id: b
    text:
      es: "los hijos de padres separados forman parte de la unidad familiar de ambos progenitores."
  - id: c
    correct: true
    text:
      es: "nadie puede formar parte de dos unidades familiares al mismo tiempo."
  - id: d
    text:
      es: "los hijos mayores incapacitados forman parte de dos unidades familiares si sus padres están separados."
  explanation:
    es: "El artículo 82.2 impide formar parte de dos unidades familiares al mismo tiempo, sea cual sea la modalidad. Los hijos de padres separados se integran en una sola, la del progenitor con quien conviven, y lo mismo vale para los mayores incapacitados."
  citation: "art. 82.2–3 LIRPF"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-83
- id: m03-l16-q0105
  prompt:
    es: "De acuerdo con el artículo 83.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la opción por la tributación conjunta:"
  options:
  - id: a
    text:
      es: "vincula durante los cuatro períodos impositivos siguientes."
  - id: b
    correct: true
    text:
      es: "no vincula para períodos sucesivos."
  - id: c
    text:
      es: "vincula durante el período impositivo siguiente."
  - id: d
    text:
      es: "solo puede ejercerse en el primer período en que exista unidad familiar."
  explanation:
    es: "La opción no vincula para períodos sucesivos y puede ejercerse en cualquier período impositivo (art. 83.1). Vincular durante uno o cuatro períodos siguientes, o limitarla al primer período en que exista unidad familiar, contradice el texto."
  citation: "art. 83.1 LIRPF"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-83
- id: m03-l16-q0106
  prompt:
    es: "Según el artículo 83.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las personas físicas integradas en una unidad familiar pueden optar por tributar conjuntamente siempre que:"
  options:
  - id: a
    correct: true
    text:
      es: "todos sus miembros sean contribuyentes por el impuesto."
  - id: b
    text:
      es: "al menos uno de sus miembros sea contribuyente por el impuesto."
  - id: c
    text:
      es: "todos sus miembros obtengan rentas en el período impositivo."
  - id: d
    text:
      es: "todos sus miembros residan en el mismo municipio."
  explanation:
    es: "La opción exige que todos los miembros de la unidad sean contribuyentes por el impuesto (art. 83.1). Bastar con uno, exigir rentas a todos o la residencia en el mismo municipio son condiciones que el artículo no contiene."
  citation: "art. 83.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-83
- id: m03-l16-q0107
  prompt:
    es: "Conforme al artículo 83.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la opción por la tributación conjunta:"
  options:
  - id: a
    text:
      es: "La opción puede limitarse a los cónyuges, sin incluir a los hijos que formen parte de la unidad familiar."
  - id: b
    text:
      es: "Cada miembro de la unidad familiar puede optar por un régimen distinto."
  - id: c
    text:
      es: "Si uno de los miembros presenta declaración individual, los restantes pueden optar por la tributación conjunta."
  - id: d
    correct: true
    text:
      es: "Si uno de los miembros de la unidad familiar presenta declaración individual, los restantes deben utilizar el mismo régimen."
  explanation:
    es: "La opción debe abarcar a la totalidad de los miembros, y si uno presenta declaración individual, los demás deben usar el mismo régimen (art. 83.2). No cabe excluir a los hijos, ni que cada miembro elija un régimen distinto, ni que los restantes tributen conjuntamente cuando uno lo hace de forma individual."
  citation: "art. 83.2 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-83
- id: m03-l16-q0108
  prompt:
    es: "De acuerdo con el artículo 83.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la opción ejercitada para un período impositivo no puede modificarse una vez:"
  options:
  - id: a
    text:
      es: "presentada la declaración por cualquier miembro de la unidad familiar."
  - id: b
    text:
      es: "transcurridos seis meses desde la presentación de la declaración."
  - id: c
    text:
      es: "transcurridos cuatro años desde el fin del período impositivo."
  - id: d
    correct: true
    text:
      es: "finalizado el plazo reglamentario de declaración."
  explanation:
    es: "La opción solo puede modificarse hasta que termine el plazo reglamentario de declaración (art. 83.2). No es la presentación por un miembro lo que la cierra, ni valen plazos de seis meses o cuatro años desde otros hechos."
  citation: "art. 83.2 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-83
- id: m03-l16-q0109
  prompt:
    es: "Según el artículo 83.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en caso de falta de declaración los contribuyentes tributan individualmente, salvo que manifiesten expresamente su opción por la tributación conjunta en el plazo de:"
  options:
  - id: a
    text:
      es: "15 días a partir del requerimiento de la Administración tributaria."
  - id: b
    text:
      es: "un mes a partir del requerimiento de la Administración tributaria."
  - id: c
    correct: true
    text:
      es: "10 días a partir del requerimiento de la Administración tributaria."
  - id: d
    text:
      es: "20 días a partir del requerimiento de la Administración tributaria."
  explanation:
    es: "En falta de declaración, la opción debe manifestarse expresamente en el plazo de 10 días a partir del requerimiento de la Administración (art. 83.2). Quince días, un mes y veinte días no son el plazo de este artículo."
  citation: "art. 83.2 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0110
  prompt:
    es: "Conforme al artículo 84.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en la tributación conjunta los importes y límites cuantitativos de la tributación individual se aplican en idéntica cuantía:"
  options:
  - id: a
    text:
      es: "multiplicados por el número de miembros de la unidad familiar."
  - id: b
    correct: true
    text:
      es: "sin que proceda su elevación o multiplicación en función del número de miembros de la unidad familiar."
  - id: c
    text:
      es: "elevados al doble en la primera modalidad de unidad familiar."
  - id: d
    text:
      es: "multiplicados por el número de hijos menores de la unidad familiar."
  explanation:
    es: "Los importes y límites se aplican en idéntica cuantía, sin elevación ni multiplicación según el número de miembros (art. 84.2). Multiplicarlos por miembros o por hijos, o duplicarlos en la primera modalidad, contradice la regla general."
  citation: "art. 84.2 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0111
  prompt:
    es: "De acuerdo con el artículo 84.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en la tributación conjunta los límites máximos de reducción de los artículos 52, 53 y 54 y de la disposición adicional undécima se aplican:"
  options:
  - id: a
    correct: true
    text:
      es: "individualmente por cada partícipe o mutualista integrado en la unidad familiar."
  - id: b
    text:
      es: "una sola vez para el conjunto de la unidad familiar."
  - id: c
    text:
      es: "multiplicados por el número de miembros de la unidad familiar."
  - id: d
    text:
      es: "solo al miembro de la unidad familiar con mayores rentas."
  explanation:
    es: "Esos límites se aplican individualmente por cada partícipe o mutualista integrado en la unidad (art. 84.2). Aplicarlos una sola vez a la unidad, multiplicarlos por miembros o limitarlos al de mayores rentas no es lo que dice el artículo."
  citation: "art. 84.2 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0112
  prompt:
    es: "Según el artículo 84.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en la primera modalidad de unidad familiar la base imponible, con carácter previo a las reducciones de los artículos 51, 53 y 54 y de la disposición adicional undécima, se reduce en:"
  options:
  - id: a
    correct: true
    text:
      es: "una cantidad de 3.400 euros anuales."
  - id: b
    text:
      es: "una cantidad de 2.150 euros anuales."
  - id: c
    text:
      es: "una cantidad de 5.550 euros anuales."
  - id: d
    text:
      es: "una cantidad de 2.400 euros anuales."
  explanation:
    es: "En la primera modalidad la reducción previa es de 3.400 euros anuales (art. 84.2, regla 3.º). Los 2.150 euros son la reducción de la segunda modalidad, los 5.550 euros el mínimo del contribuyente y los 2.400 euros, la cuantía por el primer descendiente."
  citation: "art. 84.2.3.º LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0113
  prompt:
    es: "De acuerdo con el artículo 84.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en la segunda modalidad de unidad familiar la base imponible, con carácter previo a las reducciones, se reduce en:"
  options:
  - id: a
    text:
      es: "una cantidad de 3.400 euros anuales."
  - id: b
    text:
      es: "una cantidad de 1.150 euros anuales."
  - id: c
    text:
      es: "una cantidad de 2.700 euros anuales."
  - id: d
    correct: true
    text:
      es: "una cantidad de 2.150 euros anuales."
  explanation:
    es: "En la segunda modalidad la reducción previa es de 2.150 euros anuales (art. 84.2, regla 4.º). Los 3.400 euros son los de la primera modalidad, los 1.150 euros el aumento del mínimo por edad o la cuantía por ascendiente y los 2.700 euros la cuantía por el segundo descendiente."
  citation: "art. 84.2.4.º LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0114
  prompt:
    es: "Laura Ríos, soltera, convive con su hija de 5 años y con Andrés, padre de la niña. Laura declara con su hija como unidad familiar de la segunda modalidad. Según el artículo 84.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede aplicar la reducción de 2.150 euros anuales?"
  options:
  - id: a
    text:
      es: "Sí, porque forma una unidad familiar de la segunda modalidad."
  - id: b
    text:
      es: "Sí, pero reducida a la mitad por la convivencia con el padre de la niña."
  - id: c
    correct: true
    text:
      es: "No, porque convive con el padre de una de las hijas que forman parte de su unidad familiar."
  - id: d
    text:
      es: "Sí, y además la reducción de 3.400 euros de la primera modalidad."
  explanation:
    es: "La reducción de la segunda modalidad no se aplica cuando el contribuyente conviva con el padre o la madre de alguno de los hijos de su unidad familiar (art. 84.2, regla 4.º). Formar una unidad familiar de la segunda modalidad no basta: hace falta además que no exista esa convivencia. La ley no prevé aplicarla reducida a la mitad. Y la reducción de 3.400 euros pertenece a la primera modalidad, que exige cónyuges no separados."
  citation: "art. 84.2.4.º LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-84
- id: m03-l16-q0116
  prompt:
    es: "Según el artículo 84.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, todos los miembros de la unidad familiar que tributan conjuntamente:"
  options:
  - id: a
    text:
      es: "responden únicamente de la parte de la deuda que corresponda a su renta, de forma mancomunada, sin perjuicio de que la Administración pueda exigir a los demás miembros la parte no satisfecha por cada uno."
  - id: b
    correct: true
    text:
      es: "quedan conjunta y solidariamente sometidos al impuesto, sin perjuicio del derecho a prorratear entre sí la deuda según la parte de renta sujeta que corresponda a cada uno."
  - id: c
    text:
      es: "quedan sometidos al impuesto de forma subsidiaria, respondiendo primero el miembro de mayor renta."
  - id: d
    text:
      es: "quedan conjunta y solidariamente sometidos al impuesto, sin derecho a prorratear entre sí la deuda."
  explanation:
    es: "La responsabilidad es conjunta y solidaria, y cada miembro conserva el derecho a prorratear la deuda según la renta sujeta que le corresponda (art. 84.6). La responsabilidad mancomunada o subsidiaria no es la que fija la ley, y negar el derecho de prorrateo omite el final del precepto."
  citation: "art. 84.6 LIRPF"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-82
- id: m03-l16-q0195
  prompt:
    es: "Según el artículo 82.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las modalidades de unidad familiar que pueden tributar conjuntamente:"
  options:
  - id: a
    text:
      es: "Son tres: la de los cónyuges, la de los padres separados y la de las parejas de hecho con hijos."
  - id: b
    correct: true
    text:
      es: "Son dos: la de los cónyuges no separados legalmente con sus hijos, y la del padre o la madre con los hijos en casos de separación legal o sin vínculo matrimonial."
  - id: c
    text:
      es: "Es una sola: la de los cónyuges no separados legalmente con sus hijos menores, y en separación o sin vínculo matrimonial cada progenitor tributa siempre de forma individual, sin posibilidad de opción conjunta con los hijos."
  - id: d
    text:
      es: "Son dos: la de los cónyuges con hijos menores y la de los ascendientes con sus descendientes mayores de edad."
  explanation:
    es: "El artículo 82.1 recoge dos modalidades: los cónyuges no separados legalmente con los hijos que cumplan los requisitos, y el padre o la madre con los hijos en separación legal o sin vínculo matrimonial. La ley no crea una tercera modalidad para parejas de hecho, ni reduce todo a una, ni incluye a ascendientes con descendientes mayores de edad."
  citation: "art. 82.1 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
