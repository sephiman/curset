  citation: "erickson-dynamic-programming#p9"
- id: g-greedy-algorithm
  term: {en: greedy algorithm}
  definition: {en: "An algorithm that constructs a solution through a series of decisions, like a backtracking algorithm, but makes those decisions directly, without solving any recursive subproblems."}
  origin: m02-l05
  citation: "erickson-dynamic-programming#p11"
- id: g-edit-distance
  term: {en: edit distance}
  definition: {en: "The minimum number of letter insertions, letter deletions and letter substitutions required to transform one string into the other."}
