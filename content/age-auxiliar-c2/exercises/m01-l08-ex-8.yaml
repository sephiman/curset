# anchor: boe-a-2015-10566-art-54
- id: m01-l08-q002
  prompt:
    es: "De acuerdo con el artículo 54.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado se organiza según los principios del artículo 3 y, además, los de:"
  options:
  - id: a
    text:
      es: "Descentralización política y desconcentración funcional y territorial."
  - id: b
    correct: true
    text:
      es: "Descentralización funcional y desconcentración funcional y territorial."
  - id: c
    text:
      es: "Descentralización territorial y desconcentración funcional y orgánica."
  - id: d
    text:
      es: "Autonomía funcional y desconcentración territorial y orgánica."
  explanation:
    es: "El artículo 54.1 añade a los principios del artículo 3 «los de descentralización funcional y desconcentración funcional y territorial». La descentralización que nombra es funcional, no territorial ni política. La ley no habla de autonomía funcional ni de desconcentración orgánica."
  citation: "art. 54.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q003
  prompt:
    es: "De acuerdo con el artículo 55.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado comprende:"
  options:
  - id: a
    text:
      es: "La Organización Central, la Organización Periférica y el sector público institucional estatal."
  - id: b
    text:
      es: "Los Ministerios, las Delegaciones del Gobierno y los Organismos públicos vinculados o dependientes de ellos."
  - id: c
    text:
      es: "La Organización Central, la Organización Territorial y el sector público institucional estatal."
  - id: d
    correct: true
    text:
      es: "La Organización Central, la Organización Territorial y la Administración General del Estado en el exterior."
  explanation:
    es: "El artículo 55.2 enumera tres partes: «La Organización Central», «La Organización Territorial» y «La Administración General del Estado en el exterior». El sector público institucional se regula en el título II de la ley y no forma parte de esa enumeración. La ley no usa «Organización Periférica» en este artículo, y los Ministerios y las Delegaciones son piezas de dos de esas partes, no la enumeración."
  citation: "art. 55.2 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q006
  prompt:
    es: "De acuerdo con el artículo 55.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la organización central son órganos directivos:"
  options:
  - id: a
    text:
      es: "Los Secretarios generales técnicos, los Directores generales, los Subdirectores generales y los jefes de servicio."
  - id: b
    correct: true
    text:
      es: "Los Subsecretarios y Secretarios generales, los Secretarios generales técnicos y Directores generales y los Subdirectores generales."
  - id: c
    text:
      es: "Los Secretarios de Estado, los Subsecretarios, los Secretarios generales técnicos y los Directores generales."
  - id: d
    text:
      es: "Solo los Subsecretarios, los Secretarios generales técnicos y los Directores generales, pero no los Subdirectores generales."
  explanation:
    es: "El artículo 55.3.b enumera como órganos directivos a «los Subsecretarios y Secretarios generales», «los Secretarios generales técnicos y Directores generales» y «los Subdirectores generales». Los Secretarios de Estado son órganos superiores. Los Subdirectores generales sí son órganos directivos. Los jefes de servicio no figuran en la lista."
  citation: "art. 55.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q007
  prompt:
    es: "Según el artículo 55.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la organización territorial de la Administración General del Estado son órganos directivos:"
  options:
  - id: a
    text:
      es: "Los Delegados del Gobierno y los Presidentes de las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas y los Subdelegados del Gobierno en las provincias."
  - id: c
    text:
      es: "Solo los Delegados del Gobierno en las Comunidades Autónomas, con rango de Subsecretario."
  - id: d
    text:
      es: "Los Subdelegados del Gobierno en las provincias y los Secretarios generales de las Delegaciones."
  explanation:
    es: "El artículo 55.4 nombra como órganos directivos territoriales «tanto los Delegados del Gobierno en las Comunidades Autónomas» «como los Subdelegados del Gobierno en las provincias». La opción de «solo los Delegados» deja fuera a los Subdelegados. Los Secretarios generales de las Delegaciones y los Presidentes autonómicos no figuran en el artículo; los Presidentes ni siquiera son órganos del Estado."
  citation: "art. 55.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q008
  prompt:
    es: "En la organización territorial de la Administración General del Estado, los Subdelegados del Gobierno en las provincias son órganos directivos que tienen:"
  options:
  - id: a
    correct: true
    text:
      es: "Nivel de Subdirector general, mientras que los Delegados tienen rango de Subsecretario."
  - id: b
    text:
      es: "Nivel de Director general, mientras que los Delegados tienen rango de Subsecretario."
  - id: c
    text:
      es: "Rango de Subsecretario, igual que los Delegados del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Nivel de Subdirector general, mientras que los Delegados tienen rango de Secretario de Estado."
  explanation:
    es: "El artículo 55.4 da a los Delegados del Gobierno «rango de Subsecretario» y a los Subdelegados «nivel de Subdirector general». La opción de «nivel de Director general» sube a los Subdelegados un nivel. Otra les da el rango de los Delegados. Otra acierta con los Subdelegados, pero sube a los Delegados al rango de Secretario de Estado."
  citation: "art. 55.4 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q011
  prompt:
    es: "Según el artículo 57.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado se organiza en Presidencia del Gobierno y en Ministerios, comprendiendo cada uno de ellos:"
  options:
  - id: a
    text:
      es: "Un único sector de actividad administrativa, sin excepción posible."
  - id: b
    text:
      es: "Una o varias áreas territoriales de gestión integrada."
  - id: c
    text:
      es: "Uno o varios servicios comunes de gestión compartida."
  - id: d
    correct: true
    text:
      es: "Uno o varios sectores funcionalmente homogéneos de actividad administrativa."
  explanation:
    es: "El artículo 57.1 dice que cada Ministerio comprende «uno o varios sectores funcionalmente homogéneos de actividad administrativa». No se limita a un único sector. La gestión territorial integrada corresponde a las Delegaciones del Gobierno (art. 55.1), y los servicios comunes son una parte de cada Ministerio, no lo que lo define."
  citation: "art. 57.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q012
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la organización de la Administración General del Estado es correcta, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Se organiza en Ministerios y en Secretarías de Estado."
  - id: b
    text:
      es: "Se organiza en Vicepresidencias del Gobierno y en Ministerios."
  - id: c
    text:
      es: "Se organiza en Ministerios y en Organismos públicos dependientes."
  - id: d
    correct: true
    text:
      es: "Se organiza en Presidencia del Gobierno y en Ministerios."
  explanation:
    es: "El artículo 57.1 dice: «La Administración General del Estado se organiza en Presidencia del Gobierno y en Ministerios». Las Secretarías de Estado existen dentro de los Ministerios (art. 58.1). Las Vicepresidencias no aparecen en el artículo. Los Organismos públicos forman el sector público institucional, no esta organización."
  citation: "art. 57.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2023-23537-art-1
- id: m01-l08-q014
  prompt:
    es: "¿En cuántos departamentos ministeriales estructura la Administración General del Estado el Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    correct: true
    text:
      es: "En un total de veintidós departamentos ministeriales."
  - id: b
    text:
      es: "En un total de veinte departamentos ministeriales."
  - id: c
    text:
      es: "En un total de veintiún departamentos ministeriales."
  - id: d
    text:
      es: "En un total de veintitrés departamentos ministeriales."
  explanation:
    es: "El artículo 1 del Real Decreto 829/2023 enumera veintidós departamentos, del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación al Ministerio de Juventud e Infancia. No son veinte, veintiuno ni veintitrés."
  citation: "art. 1 RD 829/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q015
  prompt:
    es: "De acuerdo con el artículo 58.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, para la gestión de los servicios comunes, los Ministerios contarán en todo caso con:"
  options:
  - id: a
    correct: true
    text:
      es: "Una Subsecretaría y, dependiendo de ella, una Secretaría General Técnica."
  - id: b
    text:
      es: "Una Secretaría de Estado y, dependiendo de ella, una Subsecretaría."
  - id: c
    text:
      es: "Una Subsecretaría y, dependiendo de ella, una Secretaría General."
  - id: d
    text:
      es: "Una Secretaría General y, dependiendo de ella, una Secretaría General Técnica."
  explanation:
    es: "El artículo 58.2 dice que los Ministerios «contarán, en todo caso, con una Subsecretaría, y dependiendo de ella una Secretaría General Técnica». Las Secretarías de Estado y las Secretarías Generales pueden existir o no (art. 58.1) y gestionan un sector de actividad, no los servicios comunes."
  citation: "art. 58.2 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q016
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos de los Ministerios son los órganos de gestión de una o varias áreas funcionalmente homogéneas?"
  options:
  - id: a
    text:
      es: "Las Secretarías de Estado del Ministerio."
  - id: b
    correct: true
    text:
      es: "Las Direcciones Generales del Ministerio."
  - id: c
    text:
      es: "Las Secretarías Generales Técnicas del Ministerio."
  - id: d
    text:
      es: "Las Subdirecciones Generales del Ministerio."
  explanation:
    es: "El artículo 58.3 dice: «Las Direcciones Generales son los órganos de gestión de una o varias áreas funcionalmente homogéneas». Las Secretarías Generales Técnicas gestionan servicios comunes (art. 58.2). Las Subdirecciones Generales son la división interna de las Direcciones Generales (art. 58.4). Las Secretarías de Estado gestionan un sector de actividad (art. 58.1)."
  citation: "art. 58.3 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q017
  prompt:
    es: "Según el artículo 58.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, además de organizarse dentro de las Direcciones Generales, las Subdirecciones Generales:"
  options:
  - id: a
    correct: true
    text:
      es: "Podrán adscribirse directamente a otros órganos directivos de mayor nivel o a órganos superiores del Ministerio."
  - id: b
    text:
      es: "Podrán adscribirse directamente a los Organismos públicos vinculados o dependientes del Ministerio."
  - id: c
    text:
      es: "Podrán adscribirse directamente a las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "No podrán depender de ningún órgano distinto de la Dirección General en la que se integren."
  explanation:
    es: "El artículo 58.4 permite que se adscriban «directamente Subdirecciones Generales a otros órganos directivos de mayor nivel o a órganos superiores del Ministerio». La adscripción es a órganos del propio Ministerio, no a Organismos públicos ni a Delegaciones del Gobierno. La opción «no podrán depender» niega lo que el artículo permite."
  citation: "art. 58.4 LRJSP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q019
  prompt:
    es: "Según el artículo 60.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Ministros son los jefes superiores del Departamento y superiores jerárquicos directos de:"
  options:
  - id: a
    text:
      es: "Los Secretarios de Estado y Directores generales."
  - id: b
    text:
      es: "Los Subsecretarios y Secretarios generales técnicos."
  - id: c
    text:
      es: "Los Secretarios generales técnicos y Directores generales."
  - id: d
    correct: true
    text:
      es: "Los Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 60.1 hace a los Ministros «superiores jerárquicos directos de los Secretarios de Estado y Subsecretarios». Los Directores generales dependen de alguno de ellos (art. 60.2). Los Secretarios generales técnicos dependen del Subsecretario (art. 65.1)."
  citation: "art. 60.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
