# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q001
  prompt:
    es: "En Access 365, ¿cuál de las siguientes listas recoge los objetos de una base de datos tal como los enumera la ayuda de Microsoft sobre dividir una base?"
  options:
  - id: a
    text:
      es: "Tablas, consultas, hojas de cálculo, informes, macros y módulos"
  - id: b
    correct: true
    text:
      es: "Tablas, consultas, formularios, informes, macros y módulos"
  - id: c
    text:
      es: "Tablas, consultas, formularios, diapositivas, macros y módulos"
  - id: d
    text:
      es: "Tablas, consultas, formularios, informes, plantillas y módulos"
  explanation:
    es: "La página enumera «los objetos de base de datos en sí (tablas, consultas, formularios, informes, macros y módulos)». Las listas con hojas de cálculo, con diapositivas o con plantillas cambian uno de esos objetos por algo que la lista no incluye: las hojas de cálculo son de Excel y las diapositivas, de PowerPoint."
  citation: "fuente: `ms-access-dividir.html`; «Ventajas de dividir las bases de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q002
  prompt:
    es: "En Access 365, el tamaño total de una base de datos de Access, incluidos todos los objetos de base de datos y los datos, es como máximo de:"
  options:
  - id: a
    text:
      es: "4 gigabytes, menos el espacio necesario para los objetos del sistema"
  - id: b
    text:
      es: "1 gigabyte, menos el espacio necesario para los objetos del sistema"
  - id: c
    text:
      es: "8 gigabytes, menos el espacio necesario para los objetos del sistema"
  - id: d
    correct: true
    text:
      es: "2 gigabytes, menos el espacio necesario para los objetos del sistema"
  explanation:
    es: "La tabla de especificaciones fija el tamaño total en «2 gigabytes, menos el espacio necesario para los objetos del sistema». Las cifras de 4, 1 y 8 gigabytes no son el límite de la base de datos; 1 gigabyte es, en la misma página, el tamaño de un campo Objeto OLE."
  citation: "fuente: `ms-access-especificaciones.html`; «General»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q003
  prompt:
    es: "En Access 365, ¿cuál de las siguientes es la forma que indica Microsoft para solucionar la limitación de tamaño de una base de datos de Access?"
  options:
  - id: a
    correct: true
    text:
      es: "Crear vínculos a tablas de otras bases de datos de Access, de hasta 2 GB cada una"
  - id: b
    text:
      es: "Activar la compresión de los datos al ejecutar Compactar y reparar base de datos"
  - id: c
    text:
      es: "Guardar la base de datos como un archivo binario compilado con extensión .accde"
  - id: d
    text:
      es: "Mover los informes y formularios a una base de datos front-end para cada usuario"
  explanation:
    es: "La nota de la tabla dice que la limitación de tamaño se soluciona «mediante vínculos a tablas de otras bases de datos de Access», cada una de hasta 2 gigabytes. Compactar no comprime los datos: elimina el espacio no utilizado. El archivo .accde compila el código VBA e impide cambiar el diseño, no amplía el límite. La front-end no guarda las tablas, que son las que ocupan los datos."
  citation: "fuente: `ms-access-especificaciones.html`; «General»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q004
  prompt:
    es: "En Access 365, ¿cuál de las siguientes afirmaciones sobre el número máximo de caracteres de los nombres de tabla y de campo es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta 64 caracteres en el nombre de una tabla y también 64 en el de un campo"
  - id: b
    text:
      es: "Hasta 64 caracteres en el nombre de una tabla y hasta 20 en el de un campo"
  - id: c
    text:
      es: "Hasta 20 caracteres en el nombre de una tabla y hasta 64 en el de un campo"
  - id: d
    text:
      es: "Hasta 14 caracteres en el nombre de una tabla y hasta 64 en el de un campo"
  explanation:
    es: "La tabla de especificaciones da 64 caracteres al nombre de tabla y 64 al nombre de campo, igual que al nombre de cualquier objeto. Los 20 caracteres son el límite de un nombre de usuario o de grupo y los 14, el de una contraseña; no se aplican a tablas ni a campos."
  citation: "fuente: `ms-access-especificaciones.html`; «Tabla»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q005
  prompt:
    es: "En Access 365, ¿cuál es el número máximo de campos que puede tener una tabla según las especificaciones de Access?"
  options:
  - id: a
    text:
      es: "64 campos por tabla"
  - id: b
    correct: true
    text:
      es: "255 campos por tabla"
  - id: c
    text:
      es: "32 campos por tabla"
  - id: d
    text:
      es: "512 campos por tabla"
  explanation:
    es: "La tabla de especificaciones fija el «Número de campos en una tabla» en 255. 64 es el máximo de caracteres de un nombre de tabla o de campo, 32 el número de índices de una tabla y 512 el número de conexiones disponibles en Access de Microsoft 365."
  citation: "fuente: `ms-access-especificaciones.html`; «Tabla»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q006
  prompt:
    es: "En Access 365, ¿cuál de las siguientes afirmaciones describe el número máximo de caracteres de un campo Texto largo según las especificaciones de Access?"
  options:
  - id: a
    text:
      es: "255 al introducir datos por la interfaz de usuario y 65.535 al escribirlos mediante programación"
  - id: b
    correct: true
    text:
      es: "65.535 al introducir datos por la interfaz de usuario y 1 gigabyte al escribirlos mediante programación"
  - id: c
    text:
      es: "65.535 tanto al introducir datos por la interfaz de usuario como al escribirlos mediante programación"
  - id: d
    text:
      es: "1 gigabyte al introducir datos por la interfaz de usuario y 65.535 al escribirlos mediante programación"
  explanation:
    es: "Las especificaciones dan al campo Texto largo «65.535 al introducir datos a través de la interfaz de usuario» y «1 gigabyte de almacenamiento de caracteres al escribir datos mediante programación». La opción de 255 confunde el límite con el de Texto corto. La que da 65.535 en los dos casos borra la diferencia que hace la página, y la que da 1 gigabyte por la interfaz invierte las dos cifras."
  citation: "fuente: `ms-access-especificaciones.html`; «Tabla»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q007
  prompt:
    es: "En Access para Microsoft 365, ¿cuántas tablas abiertas admite como máximo, incluidas las tablas vinculadas y las que Access abre internamente?"
  options:
  - id: a
    text:
      es: "2048 tablas abiertas"
  - id: b
    text:
      es: "512 tablas abiertas"
  - id: c
    correct: true
    text:
      es: "4096 tablas abiertas"
  - id: d
    text:
      es: "255 tablas abiertas"
  explanation:
    es: "Para las versiones de Access de Microsoft 365 la página da 4096 tablas abiertas. Las 2048 son el límite de las versiones de Access que no son de Microsoft 365. 512 es el número de conexiones disponibles y 255, el de campos en una tabla."
  citation: "fuente: `ms-access-especificaciones.html`; «Tabla»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q008
  prompt:
    es: "En Access 365, ¿cuál de las siguientes afirmaciones describe lo que hace el proceso de compactar una base de datos?"
  options:
  - id: a
    text:
      es: "Comprime los datos de las tablas para que el archivo ocupe menos espacio"
  - id: b
    text:
      es: "Mueve las tablas a una base de datos back-end y deja el resto de objetos"
  - id: c
    correct: true
    text:
      es: "Reduce el archivo eliminando el espacio no utilizado, sin comprimir los datos"
  - id: d
    text:
      es: "Mueve los registros antiguos a otra base de datos para reducir el archivo"
  explanation:
    es: "La página dice que «el proceso de compactar no comprime los datos, sino que reduce el archivo de base de datos eliminando el espacio no utilizado». Comprimir los datos es justo lo que la página niega. Mover las tablas a una back-end es dividir la base de datos, y mover registros antiguos a otra base es archivar los datos, según la página sobre dividir."
  citation: "fuente: `ms-access-compactar.html`; «Compactar y reparar una base de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q009
  prompt:
    es: "En Access 365, para compactar y reparar una base de datos que no está abierta, el comando Compactar y reparar base de datos se selecciona en:"
  options:
  - id: a
    text:
      es: "La pestaña Datos externos"
  - id: b
    text:
      es: "La pestaña Crear"
  - id: c
    text:
      es: "La pestaña Campos de tabla"
  - id: d
    correct: true
    text:
      es: "La pestaña Herramientas de base de datos"
  explanation:
    es: "Con la base de datos cerrada, la página indica seleccionar «Herramientas de base de datos» y el comando «Compactar y Reparar base de datos». Datos externos es la pestaña donde la página sitúa el grupo Importar & vincular, con las importaciones y el Administrador de tablas vinculadas. Campos de tabla es la pestaña de comandos que se usa al abrir una tabla para añadir reglas de validación a sus campos. Y la pestaña Crear no es la que la página nombra para este comando."
  citation: "fuente: `ms-access-compactar.html`; «Compactar y reparar manualmente una base de datos que no está abierta»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q011
  prompt:
    es: "Señale la afirmación correcta sobre la opción Compactar al cerrar de las bases de datos de Access 365:"
  options:
  - id: a
    text:
      es: "Afecta a todas las bases de datos que se abran en el equipo desde que se activa"
  - id: b
    text:
      es: "Afecta a la base de datos abierta y a todas las bases de datos back-end vinculadas"
  - id: c
    correct: true
    text:
      es: "Solo afecta a la base de datos que está abierta y se establece por separado en cada una"
  - id: d
    text:
      es: "Se recomienda activarla en las bases de datos multiusuario para que estén siempre disponibles"
  explanation:
    es: "La página dice que configurar la opción «solo afecta a la base de datos que está abierta actualmente» y que se establece «por separado para cada base de datos». Por eso no afecta a todas las bases del equipo ni a las back-end vinculadas. Tampoco se recomienda activarla en las bases multiusuario: la página dice que puede que no convenga."
  citation: "fuente: `ms-access-compactar.html`; «Compactar y reparar automáticamente una base de datos cuando se cierre»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q012
  prompt:
    es: "En Access 365, ¿por qué puede no convenir activar Compactar al cerrar en una base de datos multiusuario?"
  options:
  - id: a
    text:
      es: "Porque comprime los datos y hace más lentas las consultas de los demás"
  - id: b
    correct: true
    text:
      es: "Porque interrumpe durante un tiempo la disponibilidad de la base de datos"
  - id: c
    text:
      es: "Porque borra los cambios que los demás usuarios todavía no han guardado en la base"
  - id: d
    text:
      es: "Porque divide la base de datos en una parte back-end y otra front-end"
  explanation:
    es: "Según la página, en las bases de datos multiusuario «puede que no convenga establecer esta opción, porque interrumpe durante un tiempo la disponibilidad de la base de datos»; la operación «requiere acceso exclusivo al archivo de base de datos, ya que la operación puede perturbar a otros usuarios». Comprimir los datos y ralentizar las consultas contradice la página: «El proceso de compactar no comprime los datos, sino que reduce el archivo de base de datos eliminando el espacio no utilizado», y el comando «puede ayudar a mejorar el rendimiento de su base de datos». Borrar los cambios de los demás choca con esa misma definición: lo que se elimina es el espacio no utilizado, no el trabajo de nadie. Dividir la base en back-end y front-end es otra medida: la página la trata aparte, como forma de evitar daños manteniendo los datos en un archivo independiente."
  citation: "fuente: `ms-access-compactar.html`; «Compactar y reparar automáticamente una base de datos cuando se cierre»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q013
  prompt:
    es: "En Access 365, ¿cuál de las siguientes acciones indica la ayuda de Microsoft como requisito antes de una operación de compactación y reparación?"
  options:
  - id: a
    text:
      es: "Dividir la base de datos en back-end y front-end"
  - id: b
    text:
      es: "Convertir la base de datos al formato de archivo .mdb"
  - id: c
    correct: true
    text:
      es: "Obtener acceso exclusivo al archivo de base de datos"
  - id: d
    text:
      es: "Guardar la base como archivo compilado .accde"
  explanation:
    es: "La página pide, antes de compactar y reparar, una copia de seguridad, permisos suficientes y «acceso exclusivo al archivo de base de datos, ya que la operación puede perturbar a otros usuarios». Dividir la base, convertirla a .mdb o guardarla como .accde no figuran entre esos pasos previos."
  citation: "fuente: `ms-access-compactar.html`; «Antes de comenzar»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q015
  prompt:
    es: "En Access 365, si al compactar y reparar un archivo dañado la reparación solo se completa en parte, ¿dónde registra Access los objetos que no pudo reparar?"
  options:
  - id: a
    correct: true
    text:
      es: "En una tabla del sistema llamada MSysCompactErrors"
  - id: b
    text:
      es: "En un informe llamado MSysCompactErrors"
  - id: c
    text:
      es: "En el registro de eventos del sistema de Windows"
  - id: d
    text:
      es: "En un archivo de texto guardado junto a la base"
  explanation:
    es: "La página dice que, si la reparación solo se completa en parte, Access «realiza un seguimiento de los objetos de base de datos que no pudo reparar en una tabla del sistema denominada MSysCompactErrors» y abre esa tabla en la vista Hoja de datos. Un informe no es una tabla del sistema. Y el registro de eventos de Windows y un archivo de texto junto a la base no son el lugar que nombra la página: el resultado se consulta dentro de Access, en la tabla abierta."
  citation: "fuente: `ms-access-compactar.html`; «Compactar y reparar una base de datos dañada cuando Access se lo pida»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q016
  prompt:
    es: "En Access 365, al eliminar un objeto de base de datos, ¿qué ocurre con el espacio en disco que ocupaba ese objeto?"
  options:
  - id: a
    text:
      es: "Se recupera automáticamente en el momento de eliminar el objeto"
  - id: b
    text:
      es: "Se recupera automáticamente la próxima vez que se abre la base"
  - id: c
    correct: true
    text:
      es: "No se recupera automáticamente y el archivo sigue usando ese espacio"
  - id: d
    text:
      es: "Pasa a la base de datos back-end hasta que se compacta y repara el archivo"
  explanation:
    es: "La página dice que «el espacio en disco que ocupaba el objeto no se recupera automáticamente (el archivo de base de datos sigue usando ese espacio en disco, incluso después de eliminar el objeto)». Recuperarlo al eliminar el objeto contradice ese «no se recupera». Recuperarlo al volver a abrir la base también: lo que reduce el archivo, según la página, es el comando Compactar y reparar, que elimina el espacio no utilizado. Y pasar a la base back-end no tiene que ver: el back-end es la parte con las tablas en una base dividida, tema de otra página."
  citation: "fuente: `ms-access-compactar.html`; «Los archivos de base de datos aumentan de tamaño con el uso»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-compactar-html
- id: m06-l06-q017
  prompt:
    es: "En Access 365, ¿cuál de las siguientes es a menudo la causa de un daño del archivo de base de datos que no supone riesgo de pérdida de datos?"
  options:
  - id: a
    text:
      es: "Un índice con valores duplicados en el campo de la clave principal de la tabla"
  - id: b
    text:
      es: "Una regla de validación mal escrita en un campo de una tabla"
  - id: c
    correct: true
    text:
      es: "Un problema con un módulo de Visual Basic para Aplicaciones (VBA)"
  - id: d
    text:
      es: "Un campo Datos adjuntos con más de un archivo en un registro"
  explanation:
    es: "La página dice que este tipo de daños son a menudo «el resultado de un problema con un módulo de Visual Basic para Aplicaciones (VBA)» y que «no supone un riesgo de pérdida de datos», aunque sí de daños en el diseño. Ni los índices, ni las reglas de validación, ni los campos Datos adjuntos aparecen en la página como causa de daños; un campo Datos adjuntos admite varios archivos por registro."
  citation: "fuente: `ms-access-compactar.html`; «Los archivos de base de datos pueden dañarse»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q019
  prompt:
    es: "En Access 365, al dividir una base de datos en dos archivos, ¿cuál de los siguientes contenidos corresponde a la base de datos back-end?"
  options:
  - id: a
    text:
      es: "Las consultas, los formularios y los informes"
  - id: b
    correct: true
    text:
      es: "Solo las tablas de datos de la base"
  - id: c
    text:
      es: "Las tablas, las consultas y los formularios"
  - id: d
    text:
      es: "Los formularios, los informes y los módulos"
  explanation:
    es: "La página explica que la base de datos back-end «contiene las tablas de datos» y la front-end, «todos los demás objetos de base de datos, como consultas, formularios e informes». Las consultas, formularios, informes y módulos están en la front-end, y una back-end con consultas y formularios mezcla las dos partes."
  citation: "fuente: `ms-access-dividir.html`; «Información general»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q020
  prompt:
    es: "En Access 365, una vez dividida la base de datos, ¿mediante qué interactúa cada usuario con los datos?"
  options:
  - id: a
    text:
      es: "Mediante una copia local de la base de datos back-end"
  - id: b
    correct: true
    text:
      es: "Mediante una copia local de la base de datos front-end"
  - id: c
    text:
      es: "Abriendo directamente la base de datos back-end en la red"
  - id: d
    text:
      es: "Mediante la base de datos original que queda guardada en la red"
  explanation:
    es: "La página dice que «cada usuario interactúa con los datos mediante una copia local de la base de datos front-end». La back-end no se copia a cada usuario, y la página añade que el usuario accede a ella solo mediante tablas vinculadas, no abriéndola directamente. La base original no queda en la red: la copia con la que se empezó pasa a ser la front-end."
  citation: "fuente: `ms-access-dividir.html`; «Información general»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q021
  prompt:
    es: "En Access 365, cuando termina el asistente que divide la base de datos, el archivo con el que se comenzó (la copia de la base de datos compartida original) pasa a ser:"
  options:
  - id: a
    text:
      es: "La base de datos back-end, con las tablas de datos"
  - id: b
    text:
      es: "Una copia de seguridad con _be en el nombre del archivo"
  - id: c
    correct: true
    text:
      es: "La base de datos front-end, sin las tablas de datos"
  - id: d
    text:
      es: "Un archivo binario compilado con extensión .accde"
  explanation:
    es: "La página dice que «la base de datos front-end es el archivo con el que comenzó (la copia de la base de datos compartida original)» y que la back-end se crea en la ubicación indicada. Las tablas quedan en la back-end, que es un archivo nuevo. El sufijo _be lo sugiere Access para el nombre de la back-end, no de una copia de seguridad, y el .accde se crea aparte con Guardar como."
  citation: "fuente: `ms-access-dividir.html`; «Dividir la base de datos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q022
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas inicia el Asistente para el separador de base de datos?"
  options:
  - id: a
    text:
      es: "Datos externos › Mover datos › Base de datos de Access"
  - id: b
    correct: true
    text:
      es: "Herramientas de base de datos › Mover datos › Base de datos de Access"
  - id: c
    text:
      es: "Herramientas de base de datos › Herramientas › Base de datos de Access"
  - id: d
    text:
      es: "Crear › Mover datos › Base de datos de Access"
  explanation:
    es: "La página indica: «En la pestaña Herramientas de base de datos, en el grupo Mover datos, haga clic en Base de datos de Access. Se inicia el Asistente para el separador de base de datos». Las otras rutas ponen el grupo Mover datos en la pestaña Datos externos o Crear, o el botón en otro grupo de la pestaña correcta."
  citation: "fuente: `ms-access-dividir.html`; «Dividir la base de datos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q023
  prompt:
    es: "En Access 365, al dividir una base de datos, ¿qué nombre sugiere Access para el archivo de la base de datos back-end?"
  options:
  - id: a
    correct: true
    text:
      es: "El nombre original con _be insertado justo antes de la extensión"
  - id: b
    text:
      es: "El nombre original con _fe insertado justo antes de la extensión"
  - id: c
    text:
      es: "El nombre original con _be añadido detrás de la extensión"
  - id: d
    text:
      es: "El nombre original con _be insertado delante del nombre"
  explanation:
    es: "La página dice que el nombre que Access sugiere «conserva el nombre de archivo original» e indica que es una back-end «insertando _be en el nombre, justo antes de la extensión del nombre de archivo». Las otras opciones cambian el sufijo o el lugar donde se inserta."
  citation: "fuente: `ms-access-dividir.html`; «Dividir la base de datos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q024
  prompt:
    es: "En Access 365, al indicar la ubicación de red de la base de datos back-end, ¿cuál de las siguientes recomendaciones da la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Especificar una letra de unidad asignada en lugar de la ruta de acceso UNC"
  - id: b
    text:
      es: "Guardar la base de datos back-end en el disco duro local de cada usuario"
  - id: c
    text:
      es: "Guardar la base de datos back-end en la carpeta de la copia front-end"
  - id: d
    correct: true
    text:
      es: "Especificar la ruta de acceso UNC en lugar de una letra de unidad asignada"
  explanation:
    es: "Como las asignaciones de unidad pueden variar, la página dice que «debe especificar la ruta de acceso UNC de la ubicación en lugar de usar una letra de unidad asignada». La opción de la letra de unidad invierte la recomendación. La ubicación «debe estar disponible para todos los usuarios», así que no vale el disco local de cada uno ni la carpeta de la copia front-end, que es local."
  citation: "fuente: `ms-access-dividir.html`; «Dividir la base de datos»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q025
  prompt:
    es: "En Access 365, si un usuario cambia los datos mientras se divide la base de datos, ¿qué ocurre con esos cambios?"
  options:
  - id: a
    text:
      es: "Se copian a la back-end al terminar el asistente"
  - id: b
    text:
      es: "Se reflejan en la back-end y en la front-end"
  - id: c
    text:
      es: "Access los bloquea hasta que acaba el asistente"
  - id: d
    correct: true
    text:
      es: "No se reflejan en la base de datos back-end"
  explanation:
    es: "La página dice que, si un usuario cambia los datos mientras se divide la base, «los cambios no se reflejarán en la base de datos back-end», y recomienda importarlos después. Por eso no se copian solos al terminar, no llegan a la back-end, y la página pide avisar a los usuarios en lugar de decir que Access bloquee la edición."
  citation: "fuente: `ms-access-dividir.html`; «Antes de empezar»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q026
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas permite cambiar la base de datos back-end que usa una base de datos dividida?"
  options:
  - id: a
    text:
      es: "El Administrador de tablas vinculadas, en Herramientas de base de datos › Mover datos"
  - id: b
    text:
      es: "El Asistente para el separador de base de datos, en Datos externos › Importar & vincular"
  - id: c
    correct: true
    text:
      es: "El Administrador de tablas vinculadas, en Datos externos › Importar & vincular"
  - id: d
    text:
      es: "El comando Compactar y reparar base de datos, en Herramientas de base de datos"
  explanation:
    es: "La página indica: «En la pestaña Datos externos, en el grupo Importar & vincular, haga clic en Administrador de tablas vinculadas». El Administrador no está en Mover datos, que es donde se inicia el asistente que divide la base. Ese asistente no está en Importar & vincular y no cambia la back-end. Compactar y reparar no cambia de back-end."
  citation: "fuente: `ms-access-dividir.html`; «Cambiar la base de datos back-end que usa»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q027
  prompt:
    es: "En Access 365, ¿por qué suele mejorar el rendimiento al dividir una base de datos compartida a través de una red?"
  options:
  - id: a
    text:
      es: "Porque los datos se comprimen al enviarse por la red"
  - id: b
    text:
      es: "Porque cada usuario guarda una copia local de las tablas"
  - id: c
    correct: true
    text:
      es: "Porque solo se envían los datos a través de la red"
  - id: d
    text:
      es: "Porque las consultas se ejecutan en el servidor de archivos"
  explanation:
    es: "La página dice que el rendimiento mejora «porque solo se envían los datos a través de la red»; en una base compartida sin dividir viajan también los objetos: tablas, consultas, formularios, informes, macros y módulos. Comprimir los datos no es lo que dice la página: lo que se evita es enviar los objetos. Cada usuario guarda una copia local de la base front-end, que contiene consultas, formularios e informes, no de las tablas, que se quedan en el back-end. Y por eso las consultas no se ejecutan en el servidor de archivos: son objetos del front-end que cada usuario tiene en su copia."
  citation: "fuente: `ms-access-dividir.html`; «Ventajas de dividir las bases de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q028
  prompt:
    es: "En Access 365, en una base de datos dividida, si la base se cierra inesperadamente a un usuario, ¿cuál de las siguientes partes suele recibir el daño?"
  options:
  - id: a
    correct: true
    text:
      es: "La copia de la base de datos front-end que el usuario tenía abierta"
  - id: b
    text:
      es: "La base de datos back-end con las tablas de datos compartidas"
  - id: c
    text:
      es: "Las tablas vinculadas de todos los usuarios conectados a esa red compartida"
  - id: d
    text:
      es: "La copia de seguridad que se hizo antes de dividir la base de datos"
  explanation:
    es: "La página dice que el daño «generalmente se limita a la copia de la base de datos front-end que el usuario tenía abierta»; cada usuario trabaja con su propia copia local. El back-end con las tablas compartidas es mucho menos probable que se dañe, porque se accede a él solo mediante tablas vinculadas. Las tablas vinculadas de todos los usuarios no se ven afectadas: cada uno tiene su copia del front-end. Y la copia de seguridad es un archivo aparte que la página manda hacer antes de dividir la base, no algo que se use al trabajar."
  citation: "fuente: `ms-access-dividir.html`; «Ventajas de dividir las bases de datos»"
  difficulty: 2
  tags:
  - "comportamiento"
