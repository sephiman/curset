# anchor: boe-a-2015-11719-art-94
- id: m04-l06-q261
  prompt:
    es: "Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se suspende la tramitación del procedimiento disciplinario cuando los indicios fundados de criminalidad resultan:"
  options:
  - id: a
    text:
      es: "De la denuncia que motivó la incoación del procedimiento."
  - id: b
    text:
      es: "De la resolución por la que se incoa el procedimiento."
  - id: c
    correct: true
    text:
      es: "De la instrucción del propio procedimiento disciplinario."
  - id: d
    text:
      es: "De la resolución sancionadora del órgano competente."
  explanation:
    es: "El artículo 94.3 parte de que «de la instrucción de un procedimiento disciplinario resulte» la existencia de indicios fundados de criminalidad. La denuncia y la resolución de incoación son anteriores a la instrucción, y la resolución sancionadora es posterior a ella."
  citation: "art. 94.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1986-1216-art-30
- id: m04-l06-q262
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, nombrar Instructor a un funcionario de un cuerpo o escala de grupo inferior al del inculpado:"
  options:
  - id: a
    correct: true
    text:
      es: "Incumple el requisito de ser de un cuerpo o escala de igual o superior grupo."
  - id: b
    text:
      es: "Es válido, porque el Instructor solo debe depender del mismo Departamento que el inculpado."
  - id: c
    text:
      es: "Es válido si el inculpado no recusa al Instructor en el plazo de tres días."
  - id: d
    text:
      es: "Es válido si el Instructor cuenta con más años de servicio que el inculpado."
  explanation:
    es: "El artículo 30 exige un Instructor «de igual o superior grupo al del inculpado», así que un grupo inferior incumple el requisito. Depender del mismo Departamento no es lo que se exige: si depende de otro, basta la autorización de su Subsecretario. La falta de recusación y la antigüedad no sustituyen al grupo."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-30
- id: m04-l06-q263
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿puede ser nombrado Instructor un funcionario de un cuerpo o escala del mismo grupo que el del inculpado?"
  options:
  - id: a
    text:
      es: "No, el Instructor debe pertenecer siempre a un grupo superior al del inculpado."
  - id: b
    text:
      es: "No, salvo que el inculpado consienta expresamente ese nombramiento."
  - id: c
    text:
      es: "Sí, pero solo si depende del mismo Departamento que el inculpado."
  - id: d
    correct: true
    text:
      es: "Sí, porque el artículo exige un grupo igual o superior al del inculpado."
  explanation:
    es: "El artículo 30 admite al Instructor de «igual o superior grupo», y el mismo grupo es el caso de igualdad. No se exige un grupo estrictamente superior, ni el consentimiento del inculpado. Tampoco se limita a los funcionarios del mismo Departamento: el que depende de otro necesita la autorización del Subsecretario de éste."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-30
- id: m04-l06-q266
  prompt:
    es: "Un Subsecretario incoa un expediente disciplinario por unos hechos sencillos y no nombra Secretario. Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, esa decisión:"
  options:
  - id: a
    text:
      es: "Es incorrecta, porque en todo expediente deben nombrarse Instructor y Secretario."
  - id: b
    text:
      es: "Es incorrecta, porque el Secretario se nombra siempre en las faltas graves y muy graves."
  - id: c
    text:
      es: "Es correcta, porque el Secretario solo se nombra si lo solicita el funcionario inculpado."
  - id: d
    correct: true
    text:
      es: "Es correcta, porque el Secretario solo se nombra cuando lo exige la complejidad o trascendencia de los hechos."
  explanation:
    es: "El artículo 30 manda nombrar Secretario únicamente «cuando la complejidad o trascendencia de los hechos a investigar así lo exija», por lo que no nombrarlo en un caso sencillo es correcto. No se nombra en todo expediente, ni depende de la gravedad de la falta, ni de que el inculpado lo pida."
  citation: "art. 30 RD 33/1986"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q268
  prompt:
    es: "De acuerdo con el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, es falta muy grave el notorio incumplimiento de:"
  options:
  - id: a
    text:
      es: "Cualquier función del puesto de trabajo, sea o no esencial para el servicio."
  - id: b
    text:
      es: "La jornada de trabajo y el horario fijados para el puesto."
  - id: c
    correct: true
    text:
      es: "Las funciones esenciales inherentes al puesto de trabajo o funciones encomendadas."
  - id: d
    text:
      es: "Los objetivos de rendimiento fijados en la evaluación del desempeño."
  explanation:
    es: "La letra g) del artículo 95.2 tipifica como muy grave «el notorio incumplimiento de las funciones esenciales inherentes al puesto de trabajo o funciones encomendadas». El precepto se limita a las funciones esenciales, así que el incumplimiento de cualquier función, esencial o no, no es lo que tipifica. Ninguna letra del artículo 95.2 menciona la jornada y el horario ni los objetivos de la evaluación del desempeño."
  citation: "art. 95.2.g) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-97
- id: m04-l06-q269
  prompt:
    es: "¿Cuál de los siguientes aspectos de la prescripción de las faltas regula el artículo 97 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "El plazo de cada clase de falta y el día desde el que se cuenta."
  - id: b
    text:
      es: "Los actos que interrumpen el plazo y el momento en que se reanuda."
  - id: c
    text:
      es: "La suspensión del plazo mientras se tramita un proceso penal."
  - id: d
    text:
      es: "El registro de la incoación como requisito para interrumpir el plazo."
  explanation:
    es: "El artículo 97 fija los plazos de prescripción de faltas y sanciones (apartado 1) y el día en que empiezan a contarse: para las faltas, desde que se cometieron, y desde el cese de su comisión en las continuadas (apartado 2). No dice qué actos interrumpen el plazo ni cuándo vuelve a correr, no prevé que se suspenda durante un proceso penal y no menciona el registro de la incoación. La interrupción y el registro de la resolución de incoación están en el artículo 20.2 del Real Decreto 33/1986."
  citation: "art. 97 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-21
- id: m04-l06-q270
  prompt:
    es: "Según el artículo 21.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en qué plazo prescriben las sanciones impuestas por faltas graves?"
  options:
  - id: a
    text:
      es: "Al año."
  - id: b
    text:
      es: "A los seis años."
  - id: c
    text:
      es: "Al mes."
  - id: d
    correct: true
    text:
      es: "A los dos años."
  explanation:
    es: "El artículo 21.1 RD 33/1986 dice que las sanciones por faltas muy graves prescriben a los seis años, las impuestas por faltas graves «a los dos años» y las impuestas por faltas leves al mes. Seis años es el plazo de las muy graves y un mes el de las leves. Un año no es ninguno de los tres plazos del apartado: es el plazo que el artículo 97.1 TREBEP da a las sanciones por faltas leves."
  citation: "art. 21.1 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-20
- id: m04-l06-q271
  prompt:
    es: "Una falta leve se cometió el lunes, 1 de febrero de 2027. Según el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en cuál de estas fechas podía aún incoarse el expediente sin que la falta hubiera prescrito?"
  options:
  - id: a
    text:
      es: "El lunes, 15 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 25 de febrero de 2027."
  - id: c
    text:
      es: "El viernes, 30 de julio de 2027."
  - id: d
    text:
      es: "El lunes, 10 de enero de 2028."
  explanation:
    es: "El artículo 20.1 dice que las faltas leves prescriben «al mes» y que el plazo se cuenta «desde que la falta se hubiere cometido». Un mes desde el lunes, 1 de febrero de 2027, termina el lunes, 1 de marzo de 2027, así que el jueves, 25 de febrero, cae dentro del plazo. El lunes, 15 de marzo, ya queda fuera. El viernes, 30 de julio, solo entraría con los seis meses que el artículo 97.1 del texto refundido da a las faltas leves, y el lunes, 10 de enero de 2028, ni siquiera con ese plazo."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-97
- id: m04-l06-q272
  prompt:
    es: "De acuerdo con el artículo 97.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los plazos de prescripción de una falta muy grave y de la sanción impuesta por ella son:"
  options:
  - id: a
    correct: true
    text:
      es: "De tres años para la falta y de tres años para la sanción."
  - id: b
    text:
      es: "De seis años para la falta y de seis años para la sanción."
  - id: c
    text:
      es: "De tres años para la falta y de seis años para la sanción."
  - id: d
    text:
      es: "De seis años para la falta y de tres años para la sanción."
  explanation:
    es: "El artículo 97.1 dice que «las infracciones muy graves prescribirán a los tres años» y que «las sanciones impuestas por faltas muy graves prescribirán a los tres años». El texto refundido no da seis años ni a la falta ni a la sanción. Seis años es el plazo que el Real Decreto 33/1986 da a las faltas muy graves y a sus sanciones (artículos 20.1 y 21.1)."
  citation: "art. 97.1 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-96
- id: m04-l06-q273
  prompt:
    es: "Un funcionario interino publica indebidamente documentación conocida por razón de su cargo. Según el artículo 96.1.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, si se le impone la separación del servicio, esta:"
  options:
  - id: a
    text:
      es: "Comporta la inhabilitación para un nuevo nombramiento como interino."
  - id: b
    text:
      es: "Exige que la publicación se haya repetido en el último año."
  - id: c
    text:
      es: "Se sustituye por la suspensión firme de funciones durante seis años."
  - id: d
    correct: true
    text:
      es: "Comporta la revocación de su nombramiento como funcionario interino."
  explanation:
    es: "El artículo 96.1.a) regula la «separación del servicio de los funcionarios, que en el caso de los funcionarios interinos comportará la revocación de su nombramiento». La publicación indebida de documentación conocida por razón del cargo es falta muy grave (artículo 95.2.e)), y la separación sanciona faltas muy graves sin pedir que la conducta se repita. El artículo no sustituye la separación del interino por la suspensión firme de funciones, que es otra sanción de la letra c). La inhabilitación para un nuevo contrato con funciones similares es el efecto que la letra b) da al despido disciplinario del personal laboral; la letra a) no prevé inhabilitación alguna para el interino."
  citation: "art. 96.1.a) TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q274
  prompt:
    es: "Según el artículo 7.1.h) del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿qué conducta es falta grave cuando cause perjuicio a la Administración o a los ciudadanos y no constituya falta muy grave?"
  options:
  - id: a
    text:
      es: "La emisión de informes fuera del plazo establecido."
  - id: b
    correct: true
    text:
      es: "La emisión de informes manifiestamente ilegales."
  - id: c
    text:
      es: "La emisión de informes con errores materiales o de cálculo."
  - id: d
    text:
      es: "La emisión de informes anulables por defectos de forma."
  explanation:
    es: "La letra h) del artículo 7.1 tipifica como grave «la emisión de informes y la adopción de acuerdos manifiestamente ilegales cuando causen perjuicio, a la Administración o a los ciudadanos y no constituyan falta muy grave». La letra exige que el informe sea manifiestamente ilegal. Un informe emitido fuera de plazo, con errores materiales o de cálculo o anulable por un defecto de forma no reúne ese requisito, y ninguna otra letra del artículo 7.1 lo tipifica."
  citation: "art. 7.1.h) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-94
- id: m04-l06-q275
  prompt:
    es: "Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se suspende la tramitación de un procedimiento disciplinario cuando de su instrucción resultan indicios fundados:"
  options:
  - id: a
    text:
      es: "De responsabilidad patrimonial del funcionario expedientado."
  - id: b
    text:
      es: "De responsabilidad contable del funcionario expedientado."
  - id: c
    correct: true
    text:
      es: "De criminalidad en los hechos investigados."
  - id: d
    text:
      es: "De una falta más grave que la imputada al incoar."
  explanation:
    es: "El artículo 94.3 dice: «Cuando de la instrucción de un procedimiento disciplinario resulte la existencia de indicios fundados de criminalidad, se suspenderá su tramitación». La responsabilidad patrimonial la deja a salvo el artículo 94.1 («sin perjuicio de la responsabilidad patrimonial o penal»), sin suspender el procedimiento. El artículo 94 no menciona la responsabilidad contable, y tampoco hace de una falta más grave que la imputada una causa de suspensión."
  citation: "art. 94.3 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1986-1216-art-30
- id: m04-l06-q276
  prompt:
    es: "Un Director general acuerda incoar expediente disciplinario a un funcionario de la Administración del Estado que depende de su Dirección General. ¿Quién nombra al Instructor del procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "El propio Director general, en la resolución de incoación."
  - id: b
    text:
      es: "El Subsecretario del Departamento, en una resolución posterior."
  - id: c
    text:
      es: "El Jefe del centro o dependencia, al proponer la incoación."
  - id: d
    text:
      es: "La Dirección General de la Función Pública, a petición del Director general."
  explanation:
    es: "El artículo 30 del Real Decreto 33/1986 dice: «En la resolución por la que se incoe el procedimiento se nombrará Instructor». Si incoa el Director general, como le permite el artículo 29.1 respecto del personal de su Dirección General, el nombramiento va en su resolución. Ningún artículo da al Subsecretario el nombramiento del Instructor en un expediente que incoa otro órgano; el artículo 30 solo exige la previa autorización del Subsecretario de otro Departamento cuando el Instructor depende de él. El Jefe del centro o dependencia puede proponer la incoación (artículo 29.2), no nombrar al Instructor. La Dirección General de la Función Pública no aparece en estos artículos."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1995-8730-art-21
- id: m04-l06-q277
  prompt:
    es: "Según el artículo 21.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿qué parte de la prestación económica por hijo a cargo percibe el suspenso provisional que comparece y no paraliza el expediente?"
  options:
  - id: a
    text:
      es: "El 75 por 100 de la prestación."
  - id: b
    text:
      es: "La mitad de la prestación."
  - id: c
    text:
      es: "Ninguna parte de la prestación."
  - id: d
    correct: true
    text:
      es: "La totalidad de la prestación."
  explanation:
    es: "El artículo 21.4 RD 365/1995 reconoce al suspenso provisional «el 75 por 100 de su sueldo, trienios y pagas extraordinarias, así como la totalidad de la prestación económica por hijo a cargo». El 75 por 100 se aplica al sueldo, a los trienios y a las pagas, y la prestación por hijo se cobra entera. La mitad no corresponde a ninguna de las dos cifras del apartado, que son el 75 por 100 y la totalidad. No cobrar nada llega con la paralización del expediente imputable al interesado o con la incomparecencia, dos supuestos que el enunciado descarta."
  citation: "art. 21.4 RD 365/1995"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-1986-1216-art-35
- id: m04-l06-q278
  prompt:
    es: "Según el artículo 35.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿qué formula el Instructor, a la vista de las actuaciones practicadas, en un plazo no superior a un mes desde la incoación?"
  options:
  - id: a
    text:
      es: "La propuesta de resolución, con la sanción que estime procedente."
  - id: b
    correct: true
    text:
      es: "El pliego de cargos, con los hechos imputados al funcionario."
  - id: c
    text:
      es: "La resolución que pone fin al procedimiento disciplinario."
  - id: d
    text:
      es: "El acuerdo de suspensión provisional del funcionario inculpado."
  explanation:
    es: "El artículo 35.1 dice que, «a la vista de las actuaciones practicadas y en un plazo no superior a un mes, contados a partir de la incoación del procedimiento, el Instructor formulará el correspondiente pliego de cargos», con los hechos imputados. La propuesta de resolución llega después de las pruebas y de la vista del expediente (artículos 41 y 42). La resolución no la dicta el Instructor sino el órgano competente para sancionar (artículo 47). Al formular el pliego, el Instructor solo propone mantener o levantar la suspensión provisional que se hubiera adoptado (artículo 35.2); no la acuerda."
  citation: "art. 35.1 RD 33/1986"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1986-1216-art-47
- id: m04-l06-q279
  prompt:
    es: "De acuerdo con el artículo 47.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, un Director general puede imponer la sanción de apercibimiento:"
  options:
  - id: a
    text:
      es: "A cualquier funcionario destinado en su Departamento."
  - id: b
    text:
      es: "A los funcionarios destinados en su ámbito territorial."
  - id: c
    correct: true
    text:
      es: "Al personal dependiente de su Dirección General."
  - id: d
    text:
      es: "Al personal de su Dirección General, previa autorización del Subsecretario."
  explanation:
    es: "El artículo 47.3 atribuye las sanciones de los apartados d) y e) del artículo 14, entre ellas el apercibimiento, al «Subsecretario del Departamento, en todo caso», a «los Directores generales respecto del personal dependiente de su Dirección General» y a los Delegados del Gobierno y Gobernadores civiles «respecto a los funcionarios destinados en su correspondiente ámbito territorial». Cualquier funcionario del Departamento es el alcance del Subsecretario, y el ámbito territorial es el de los Delegados del Gobierno. El artículo no pide al Director general autorización previa del Subsecretario."
  citation: "art. 47.3 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
