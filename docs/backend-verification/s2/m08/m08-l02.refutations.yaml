m08-l02-q01:
  key:
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: then writes that specify acks=all will succeed.
  wrong:
  - option: The write fails, because `acks=all` requires every assigned replica to acknowledge it
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: does not guarantee that the full set of assigned replicas have received the message
  - option: The write fails with `NotEnoughReplicas`, because the default `min.insync.replicas` is 2
    anchor: kafka-topic-configs#min.insync.replicas
    sentence: 'Default: 1 Valid Values: [1,...]'
  - option: The write succeeds only once the failed replica has caught up and rejoined the ISR
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: By default, when acks=all, acknowledgement happens as soon as all the current in-sync replicas have received the message.
m08-l02-q02:
  key:
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: This setting offers a trade-off between consistency and availability.
  wrong:
  - option: It trades consistency for availability, because fewer replicas have to acknowledge each write
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: A higher setting for minimum ISR size guarantees better consistency since the message is guaranteed to be written to more replicas
  - option: It also applies to producers that use `acks=1`, so their writes wait for the minimum ISR size
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: This setting only takes effect if the producer uses acks=all
  - option: It makes the producer wait for every assigned replica, including replicas outside the ISR
    anchor: kafka-design#availability-and-durability-guarantees
    sentence: does not guarantee that the full set of assigned replicas have received the message
