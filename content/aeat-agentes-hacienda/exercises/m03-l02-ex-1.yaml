# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0001
  prompt:
    es: "De acuerdo con el artículo 103.Uno.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, la Agencia Estatal de Administración Tributaria se crea integrada en las:"
  options:
  - id: a
    text:
      es: "Entidades Gestoras de la Seguridad Social."
  - id: b
    correct: true
    text:
      es: "Administraciones Públicas Centrales."
  - id: c
    text:
      es: "Administraciones de las Comunidades Autónomas y Entes Locales."
  - id: d
    text:
      es: "Administraciones Públicas Territoriales del Estado."
  explanation:
    es: "El artículo 103.Uno.1 crea la Agencia integrada en las Administraciones Públicas Centrales. Las Administraciones territoriales del Estado no figuran en el precepto. Tampoco la integra en las Comunidades Autónomas ni en los Entes Locales, que tienen sus propias Haciendas. Y las Entidades Gestoras de la Seguridad Social son otro tipo de entidad, ajeno a la creación de la Agencia."
  citation: "art. 103.Uno.1 Ley 31/1990"
  difficulty: 1
  tags:
  - "naturaleza"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0002
  prompt:
    es: "Conforme al artículo 103.Uno.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre la naturaleza jurídica de la Agencia Estatal de Administración Tributaria:"
  options:
  - id: a
    text:
      es: "Es un organismo autónomo sin personalidad jurídica propia, integrado en la Secretaría de Estado de Hacienda."
  - id: b
    correct: true
    text:
      es: "Es un Ente de Derecho Público, con personalidad jurídica propia y plena capacidad pública y privada."
  - id: c
    text:
      es: "Es una sociedad mercantil estatal, con plena capacidad privada y capacidad pública limitada."
  - id: d
    text:
      es: "Es un órgano directivo del Estado con personalidad jurídica propia, pero sin capacidad privada."
  explanation:
    es: "El artículo 103.Uno.1 define la Agencia como Ente de Derecho Público de los previstos en el artículo 6.5 de la Ley General Presupuestaria, con personalidad jurídica propia y plena capacidad pública y privada. No es un organismo autónomo sin personalidad: la ley le da personalidad propia. Tampoco es una sociedad mercantil: la ley la configura como ente de Derecho Público con plena capacidad pública. Y su capacidad no se limita a lo público: es plena, pública y privada."
  citation: "art. 103.Uno.1 Ley 31/1990"
  difficulty: 1
  tags:
  - "naturaleza"
  - "capacidad"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0003
  prompt:
    es: "¿Cuál de las siguientes responsabilidades atribuye a la Agencia Estatal de Administración Tributaria el artículo 103.Uno.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991?"
  options:
  - id: a
    text:
      es: "La elaboración y aprobación de las normas del sistema tributario estatal y del aduanero."
  - id: b
    text:
      es: "La aplicación efectiva del sistema tributario autonómico y local, en nombre y por cuenta de las Comunidades Autónomas."
  - id: c
    text:
      es: "La aplicación efectiva del sistema tributario estatal, con exclusión del sistema aduanero."
  - id: d
    correct: true
    text:
      es: "La aplicación efectiva del sistema tributario estatal y del aduanero, en nombre y por cuenta del Estado."
  explanation:
    es: "El artículo 103.Uno.2 hace a la Agencia responsable, en nombre y por cuenta del Estado, de la aplicación efectiva del sistema tributario estatal y del aduanero. No actúa por cuenta de las Comunidades Autónomas ni aplica su sistema tributario propio. Tampoco dicta las normas: las aplica. Y el sistema aduanero está incluido, no excluido."
  citation: "art. 103.Uno.2 Ley 31/1990"
  difficulty: 1
  tags:
  - "funciones"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0004
  prompt:
    es: "Según el artículo 103.Uno.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, la Agencia es responsable, además, de los recursos de otras Administraciones y Entes Públicos nacionales o de las Comunidades Europeas cuya gestión se le encomiende:"
  options:
  - id: a
    text:
      es: "por Ley, sin que quepa hacerlo por Convenio."
  - id: b
    text:
      es: "por Real Decreto o por Orden ministerial."
  - id: c
    correct: true
    text:
      es: "por Ley o por Convenio."
  - id: d
    text:
      es: "por Resolución de la Presidencia o por acuerdo del Director General."
  explanation:
    es: "El artículo 103.Uno.2 permite encomendar la gestión de esos recursos por Ley o por Convenio. Un Real Decreto o una Orden ministerial no son los cauces que el precepto prevé. Una resolución de la Presidencia o un acuerdo del Director General tampoco, porque son actos internos de la propia Agencia. Y la ley no excluye el Convenio: lo menciona junto a la Ley."
  citation: "art. 103.Uno.2 Ley 31/1990"
  difficulty: 1
  tags:
  - "gestión encomendada"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0096
  prompt:
    es: "Conforme al artículo 103.Uno.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, la Agencia Estatal de Administración Tributaria es la organización administrativa responsable de la aplicación efectiva del sistema tributario estatal y del aduanero, actuando:"
  options:
  - id: a
    text:
      es: "en nombre del Estado y por cuenta propia."
  - id: b
    text:
      es: "en nombre propio y por cuenta del Estado."
  - id: c
    correct: true
    text:
      es: "en nombre y por cuenta del Estado."
  - id: d
    text:
      es: "en nombre propio y por cuenta de las Comunidades Autónomas."
  explanation:
    es: "La Agencia aplica el sistema tributario en nombre y por cuenta del Estado. No actúa en nombre propio, aunque tenga personalidad jurídica propia. Tampoco por cuenta propia: la titularidad del sistema es del Estado. Y no lo hace por cuenta de las Comunidades Autónomas, cuyos tributos cedidos gestiona solo cuando la ley de cesión se lo atribuye."
  citation: "art. 103.Uno.2 Ley 31/1990"
  difficulty: 2
  tags:
  - "funciones"
  - "naturaleza"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0005
  prompt:
    es: "De acuerdo con el artículo 103.Uno.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, la Agencia hace que el sistema tributario estatal y el aduanero se apliquen con generalidad y eficacia mediante los procedimientos de:"
  options:
  - id: a
    text:
      es: "gestión, inspección y recaudación, solo en su vertiente formal."
  - id: b
    text:
      es: "gestión y recaudación, sin incluir la inspección, tanto formal como material."
  - id: c
    correct: true
    text:
      es: "gestión, inspección y recaudación, tanto formal como material."
  - id: d
    text:
      es: "gestión, inspección y sanción, tanto formal como material."
  explanation:
    es: "El artículo 103.Uno.3 enumera gestión, inspección y recaudación, tanto formal como material. La sanción no figura en esa lista. Limitar la recaudación a su vertiente formal contradice el «tanto formal como material». Y la inspección es uno de los tres procedimientos, no queda fuera."
  citation: "art. 103.Uno.3 Ley 31/1990"
  difficulty: 2
  tags:
  - "procedimientos"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0006
  prompt:
    es: "Conforme al artículo 103.Uno.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre los procedimientos de gestión, inspección y recaudación de la Agencia:"
  options:
  - id: a
    text:
      es: "Deben eliminar todas las exigencias formales necesarias para el cumplimiento de las obligaciones tributarias."
  - id: b
    correct: true
    text:
      es: "Deben minimizar los costes indirectos derivados de las exigencias formales necesarias para el cumplimiento de las obligaciones tributarias."
  - id: c
    text:
      es: "Deben maximizar la recaudación, aunque aumenten los costes indirectos derivados de las exigencias formales."
  - id: d
    text:
      es: "Deben minimizar los costes directos de la Agencia derivados de la gestión de los tributos cedidos."
  explanation:
    es: "El precepto exige procedimientos que minimicen los costes indirectos derivados de las exigencias formales del cumplimiento. No ordena maximizar la recaudación a costa de esos costes. Tampoco manda eliminar las exigencias formales, sino reducir su coste indirecto. Y habla de costes indirectos para los obligados, no de costes directos de la Agencia por los tributos cedidos."
  citation: "art. 103.Uno.3 Ley 31/1990"
  difficulty: 2
  tags:
  - "procedimientos"
  - "costes"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0007
  prompt:
    es: "Según el artículo 103.Uno.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, los órganos de la Agencia y las entidades de crédito que actúen como colaboradoras en la recaudación ingresan los fondos obtenidos directamente en:"
  options:
  - id: a
    text:
      es: "una cuenta de la propia Agencia abierta en la entidad de crédito colaboradora."
  - id: b
    text:
      es: "la caja de la Dirección General de la Agencia, que después ingresa en el Tesoro."
  - id: c
    correct: true
    text:
      es: "la cuenta corriente del Tesoro Público en el Banco de España."
  - id: d
    text:
      es: "una cuenta restringida de recaudación de la Agencia en el Banco de España."
  explanation:
    es: "Los fondos se ingresan directamente en la cuenta corriente del Tesoro Público en el Banco de España. La Agencia no los retiene en una cuenta propia ni en la de la entidad colaboradora. Una cuenta restringida de la Agencia en el Banco de España no es la que nombra el precepto: la cuenta es la del Tesoro. Y el ingreso es directo: no pasa por la caja de la Dirección General."
  citation: "art. 103.Uno.3 Ley 31/1990"
  difficulty: 2
  tags:
  - "recaudación"
  - "Tesoro"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0008
  prompt:
    es: "De acuerdo con el artículo 103.Uno.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre los créditos y la recaudación derivados de los tributos del Estado que gestiona la Agencia:"
  options:
  - id: a
    text:
      es: "Se integran en el presupuesto de ingresos de la Agencia para financiar su funcionamiento ordinario."
  - id: b
    text:
      es: "Se reparten entre el Tesoro Público y la Agencia en la proporción que fije cada año la Ley de Presupuestos."
  - id: c
    text:
      es: "Forman parte del patrimonio propio de la Agencia, que los gestiona con autonomía presupuestaria."
  - id: d
    correct: true
    text:
      es: "Forman parte del Tesoro Público."
  explanation:
    es: "El precepto dice que los créditos y la recaudación de los tributos o recursos de Derecho Público del Estado o de sus Organismos Autónomos gestionados por la Agencia forman parte del Tesoro Público. No son patrimonio propio de la Agencia. Tampoco se integran en un presupuesto de ingresos de la Agencia. Y la ley no prevé ningún reparto anual entre el Tesoro y la Agencia."
  citation: "art. 103.Uno.3 Ley 31/1990"
  difficulty: 1
  tags:
  - "Tesoro"
  - "recaudación"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0009
  prompt:
    es: "Una ley de cesión atribuye a la Administración del Estado la gestión de un tributo cedido a una Comunidad Autónoma, y la Agencia Estatal de Administración Tributaria lo gestiona durante 2027. Según el artículo 103.Uno.4 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿qué se hace con la recaudación obtenida?"
  options:
  - id: a
    text:
      es: "Se reparte entre la Comunidad Autónoma y el Estado en la proporción que fije la ley de cesión."
  - id: b
    text:
      es: "Se ingresa en el Tesoro Público como recurso del Estado, sin que la Comunidad Autónoma participe en ella."
  - id: c
    text:
      es: "Se queda en la Agencia para financiar su presupuesto de gastos de ese ejercicio."
  - id: d
    correct: true
    text:
      es: "Se entrega a la Hacienda Autónoma titular del rendimiento de los tributos cedidos."
  explanation:
    es: "Cuando la ley de cesión atribuye la gestión al Estado, la recaudación obtenida se entrega a la Hacienda Autónoma titular del rendimiento del tributo cedido. No es recurso del Estado: el rendimiento es de la Comunidad. La Agencia tampoco se queda con ella para financiarse. Y el artículo 103.Uno.4 no prevé reparto alguno: la entrega es de toda la recaudación obtenida."
  citation: "art. 103.Uno.4 Ley 31/1990"
  difficulty: 2
  tags:
  - "tributos cedidos"
  - "supuesto"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0010
  prompt:
    es: "Según el artículo 103.Uno.4 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿en qué supuesto gestiona la Agencia los tributos cedidos a las Comunidades Autónomas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando las correspondientes leyes de cesión atribuyan esa competencia a la Administración del Estado."
  - id: b
    text:
      es: "Solo cuando la Comunidad Autónoma carezca de una administración tributaria propia."
  - id: c
    text:
      es: "Cuando lo disponga una Orden ministerial a petición de la Comunidad Autónoma interesada."
  - id: d
    text:
      es: "Siempre, porque los tributos cedidos forman parte del sistema tributario estatal."
  explanation:
    es: "La Agencia gestiona los tributos cedidos cuando las leyes de cesión atribuyen esa competencia a la Administración del Estado. No los gestiona siempre: depende de lo que diga cada ley de cesión. Tampoco hay un criterio de carencia de administración propia en la Comunidad. Y una Orden ministerial a petición de la Comunidad no es el título que prevé el precepto."
  citation: "art. 103.Uno.4 Ley 31/1990"
  difficulty: 2
  tags:
  - "tributos cedidos"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0011
  prompt:
    es: "De acuerdo con el artículo 103.Uno.5 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, corresponde a la Agencia, en el ámbito de sus competencias, desarrollar los mecanismos de coordinación y colaboración necesarios con:"
  options:
  - id: a
    text:
      es: "solo las Instituciones Comunitarias y las Administraciones Tributarias de los países miembros de la Comunidad."
  - id: b
    text:
      es: "las Instituciones Comunitarias y el Tribunal de Cuentas Europeo, con exclusión de las demás Administraciones Tributarias."
  - id: c
    correct: true
    text:
      es: "las Instituciones Comunitarias, las Administraciones Tributarias de los países miembros y otras Administraciones Tributarias nacionales o extranjeras."
  - id: d
    text:
      es: "únicamente las Administraciones Tributarias nacionales, quedando las extranjeras fuera de su ámbito."
  explanation:
    es: "El artículo 103.Uno.5 abarca tres grupos: las Instituciones Comunitarias, las Administraciones Tributarias de los países miembros y las otras Administraciones Tributarias nacionales o extranjeras. Dejar fuera a estas últimas recorta la lista. Limitarla a las nacionales excluye a las comunitarias y a las extranjeras. Y el precepto no cita al Tribunal de Cuentas Europeo ni excluye a las Administraciones Tributarias."
  citation: "art. 103.Uno.5 Ley 31/1990"
  difficulty: 3
  tags:
  - "coordinación"
  - "colaboración"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0012
  prompt:
    es: "Según el artículo 103.Uno.6 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, corresponde especialmente a la Agencia el auxilio a los Juzgados y Tribunales de Justicia y al Ministerio Fiscal en la investigación, enjuiciamiento y represión de:"
  options:
  - id: a
    correct: true
    text:
      es: "delitos públicos, dentro de las competencias que el ordenamiento jurídico le atribuye."
  - id: b
    text:
      es: "cualquier delito, con independencia de las competencias que el ordenamiento jurídico le atribuya."
  - id: c
    text:
      es: "delitos contra la Hacienda Pública, y solo cuando lo requiera expresamente el Juez."
  - id: d
    text:
      es: "delitos privados y públicos de contenido económico, con los medios de los Juzgados."
  explanation:
    es: "El auxilio se presta en delitos públicos, dentro de las competencias que el ordenamiento atribuye a la Agencia. No alcanza a cualquier delito sin límite de competencias. Tampoco se restringe a los delitos contra la Hacienda Pública ni a lo que pida el Juez. Y no incluye los delitos privados: el precepto habla de delitos públicos."
  citation: "art. 103.Uno.6 Ley 31/1990"
  difficulty: 2
  tags:
  - "auxilio judicial"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0013
  prompt:
    es: "Un Juzgado de lo Penal solicita en 2027 auxilio a la Agencia Estatal de Administración Tributaria para investigar un delito público de su competencia. Conforme al artículo 103.Uno.6 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿cómo establece la Agencia los medios para esa función de auxilio?"
  options:
  - id: a
    text:
      es: "Los aporta el propio Juzgado, que los cede a la Agencia mientras dure la investigación."
  - id: b
    correct: true
    text:
      es: "Los establece en el marco de los correspondientes convenios de colaboración, con medios humanos y materiales."
  - id: c
    text:
      es: "Los establece mediante convenios de colaboración, pero sin medios humanos ni materiales propios."
  - id: d
    text:
      es: "Los pone a disposición del Juzgado sin convenio alguno, con cargo al presupuesto del Ministerio Fiscal."
  explanation:
    es: "El artículo 103.Uno.6 dice que la Agencia establece medios humanos y materiales, en el marco de los convenios de colaboración, para ejercer el auxilio. No se presta al margen de los convenios ni con cargo al Ministerio Fiscal. Tampoco los aporta el Juzgado: son medios de la Agencia. Y un convenio sin medios propios vaciaría la función, que exige medios humanos y materiales."
  citation: "art. 103.Uno.6 Ley 31/1990"
  difficulty: 2
  tags:
  - "auxilio judicial"
  - "supuesto"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0097
  prompt:
    es: "De acuerdo con el artículo 103.Uno.5 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale cuál de los siguientes NO es un sujeto con el que la Agencia desarrolla mecanismos de coordinación y colaboración:"
  options:
  - id: a
    text:
      es: "Las Instituciones Comunitarias."
  - id: b
    text:
      es: "Las otras Administraciones Tributarias nacionales o extranjeras."
  - id: c
    correct: true
    text:
      es: "Los Tribunales Económico-Administrativos del Estado."
  - id: d
    text:
      es: "Las Administraciones Tributarias de los países miembros de la Comunidad."
  explanation:
    es: "El artículo 103.Uno.5 cita tres grupos: las Instituciones Comunitarias, las Administraciones Tributarias de los países miembros y las otras Administraciones Tributarias nacionales o extranjeras. Los Tribunales Económico-Administrativos no figuran entre ellos."
  citation: "art. 103.Uno.5 Ley 31/1990"
  difficulty: 3
  tags:
  - "coordinación"
  - "negativa"
