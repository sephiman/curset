# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q001
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado abre directamente la aplicación Configuración?"
  options:
  - id: a
    text:
      es: "Windows+A"
  - id: b
    text:
      es: "Windows+N"
  - id: c
    correct: true
    text:
      es: "Windows+I"
  - id: d
    text:
      es: "Windows+W"
  explanation:
    es: "La tabla de Microsoft asigna a Windows+I «Abrir configuración». Windows+A abre lo que esa misma tabla llama el Centro de actividades de Windows 11, Windows+N abre el centro de notificaciones y el calendario, y Windows+W abre los widgets."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q002
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones realiza el método abreviado de teclado Windows+U?"
  options:
  - id: a
    correct: true
    text:
      es: "Abre la aplicación Configuración en la sección Accesibilidad."
  - id: b
    text:
      es: "Abre la aplicación Configuración en la página Acerca de."
  - id: c
    text:
      es: "Abre el historial del Portapapeles de Windows."
  - id: d
    text:
      es: "Abre el centro de notificaciones junto con el calendario de Windows."
  explanation:
    es: "Windows+U abre la aplicación Configuración en la sección Accesibilidad. La página Acerca de se abre con Windows+Pausa, el historial del Portapapeles con Windows+V y el centro de notificaciones y el calendario con Windows+N."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q003
  prompt:
    es: "En la aplicación Configuración de Windows 11, ¿qué hace la tecla Retroceso cuando se navega por ella con el teclado?"
  options:
  - id: a
    text:
      es: "Avanza a través de las regiones de la página actual."
  - id: b
    text:
      es: "Retrocede por las regiones de la página actual."
  - id: c
    text:
      es: "Selecciona el elemento que tiene el foco en ese momento."
  - id: d
    correct: true
    text:
      es: "Navega hacia atrás dentro de la aplicación Configuración."
  explanation:
    es: "En la tabla de la aplicación Configuración, Retroceso sirve para «Navegar hacia atrás». Avanzar por las regiones corresponde a Tab, retroceder por ellas a Mayús+Tab, y seleccionar el elemento con el foco a Entrar o Barra espaciadora."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de la configuración»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q004
  prompt:
    es: "En Windows 11, ¿qué abre el método abreviado de teclado Windows+Pausa, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "La aplicación Configuración en la sección Accesibilidad."
  - id: b
    correct: true
    text:
      es: "La aplicación Configuración en la página Acerca de."
  - id: c
    text:
      es: "El cuadro de diálogo Ejecutar de Windows."
  - id: d
    text:
      es: "La configuración de proyección para elegir un modo de presentación."
  explanation:
    es: "La tabla asigna a Windows+Pausa abrir la aplicación Configuración en la página Acerca de, la que muestra edición, versión y compilación. La sección Accesibilidad se abre con Windows+U, el cuadro de diálogo Ejecutar con Windows+R y la elección del modo de presentación con Windows+P."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q005
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas de la aplicación Configuración lleva a las Opciones de inicio de sesión del dispositivo?"
  options:
  - id: a
    text:
      es: "Configuración › Personalización › Opciones de inicio de sesión"
  - id: b
    correct: true
    text:
      es: "Configuración › Cuentas › Opciones de inicio de sesión"
  - id: c
    text:
      es: "Configuración › Accesibilidad › Opciones de inicio de sesión"
  - id: d
    text:
      es: "Configuración › Hora & idioma › Opciones de inicio de sesión"
  explanation:
    es: "Las Opciones de inicio de sesión están en Cuentas: «Configuración › Cuentas › Opciones de inicio de sesión». Personalización, Accesibilidad y Hora & idioma son apartados reales de Configuración, pero ninguno contiene esas opciones."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Formas de iniciar sesión en Windows 11»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q006
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes formas de iniciar sesión, en lugar de una contraseña, permite configurar Windows Hello?"
  options:
  - id: a
    text:
      es: "Mediante reconocimiento de voz, huella digital o PIN"
  - id: b
    text:
      es: "Mediante reconocimiento facial, reconocimiento de voz o patrón"
  - id: c
    text:
      es: "Mediante huella digital, tarjeta inteligente o reconocimiento de voz"
  - id: d
    correct: true
    text:
      es: "Mediante reconocimiento facial, huella digital o PIN"
  explanation:
    es: "Según la página, Windows Hello permite «el inicio de sesión mediante reconocimiento facial, una huella digital o un PIN, en lugar de una contraseña». La opción con voz, huella y PIN falla en el reconocimiento de voz, que no está en esa frase. La de reconocimiento facial, voz y patrón falla en la voz y en el patrón. Y la de huella, tarjeta inteligente y voz falla en la tarjeta y en la voz. Los tres métodos de la frase son los únicos que la página asigna a Windows Hello."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Formas de iniciar sesión»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q007
  prompt:
    es: "Entre las opciones de inicio de sesión de Windows 11, ¿qué permite configurar Windows Hello?"
  options:
  - id: a
    correct: true
    text:
      es: "Iniciar sesión con el rostro, la huella digital o un PIN, sin contraseña."
  - id: b
    text:
      es: "Bloquear el dispositivo cuando el teléfono emparejado por Bluetooth se aleja."
  - id: c
    text:
      es: "Mostrar la dirección de correo de la cuenta en la pantalla de inicio de sesión."
  - id: d
    text:
      es: "Iniciar sesión en la cuenta con una clave de seguridad física."
  explanation:
    es: "Windows Hello es el inicio de sesión mediante reconocimiento facial, huella digital o PIN en lugar de contraseña. Bloquear el dispositivo al alejarse el teléfono es el bloqueo dinámico; mostrar el correo en la pantalla de inicio de sesión es la opción «Mostrar detalles de la cuenta»; la clave de seguridad física es otra forma de iniciar sesión que la página cita aparte."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Formas de iniciar sesión»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q008
  prompt:
    es: "En las opciones de inicio de sesión de Windows 11, ¿qué ocurre si se activa iniciar sesión con una cámara externa o un lector de huellas digitales?"
  options:
  - id: a
    text:
      es: "Se deshabilita el uso de contraseñas para la cuenta de Microsoft."
  - id: b
    text:
      es: "Se activa el bloqueo dinámico del dispositivo mediante Bluetooth."
  - id: c
    correct: true
    text:
      es: "Se deshabilita la seguridad de inicio de sesión mejorada de Windows Hello."
  - id: d
    text:
      es: "Se muestra la dirección de correo de la cuenta en la pantalla de inicio de sesión."
  explanation:
    es: "La página dice que, si se activa el inicio de sesión con una cámara externa o un lector de huellas, «se deshabilita la seguridad de inicio de sesión mejorada», una característica de Windows Hello. Deshabilitar las contraseñas de la cuenta de Microsoft es el efecto de «Solo permitir el inicio de sesión con Windows Hello»; el bloqueo dinámico y mostrar el correo en la pantalla de inicio de sesión son otras opciones que se activan por separado."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Otras configuraciones»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q009
  prompt:
    es: "En Windows 11, ¿qué efecto tiene activar la opción «Solo permitir el inicio de sesión con Windows Hello para las cuentas de Microsoft en este dispositivo»?"
  options:
  - id: a
    text:
      es: "Deshabilita la seguridad de inicio de sesión mejorada de Windows Hello."
  - id: b
    text:
      es: "Bloquea el dispositivo cuando el teléfono emparejado se aleja."
  - id: c
    text:
      es: "Muestra la dirección de correo de la cuenta al iniciar sesión."
  - id: d
    correct: true
    text:
      es: "Deshabilita el uso de contraseñas para la cuenta de Microsoft."
  explanation:
    es: "Según la página, esa opción, «si está activada, deshabilita el uso de contraseñas para su cuenta de Microsoft». La seguridad de inicio de sesión mejorada se deshabilita al permitir una cámara externa o un lector de huellas; bloquear el dispositivo al alejarse el teléfono es el bloqueo dinámico; mostrar el correo es la opción «Mostrar detalles de la cuenta en la pantalla de inicio de sesión»."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Otras configuraciones»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q010
  prompt:
    es: "Señale cuál de las siguientes afirmaciones sobre el bloqueo dinámico de las opciones de inicio de sesión de Windows 11 es correcta:"
  options:
  - id: a
    text:
      es: "Usa la cámara para detectar al usuario y bloquea el dispositivo cuando el usuario se aleja."
  - id: b
    correct: true
    text:
      es: "Usa Bluetooth para emparejarse con un teléfono y bloquea el dispositivo cuando el usuario se aleja."
  - id: c
    text:
      es: "Usa Bluetooth para emparejarse con un teléfono y apaga el dispositivo cuando el usuario se aleja."
  - id: d
    text:
      es: "Usa Bluetooth para emparejarse con un teléfono y desbloquea el dispositivo cuando el usuario se acerca."
  explanation:
    es: "La página dice que el bloqueo dinámico «usa Bluetooth para emparejarse con un teléfono y bloquea el dispositivo cuando la señal Bluetooth cae por debajo de un cierto nivel», lo que indica que ya no estás cerca. Detectar al usuario con la cámara contradice que lo que se mide es la señal Bluetooth del teléfono. Apagar el dispositivo contradice «bloquea»: el equipo queda bloqueado, no apagado. Y desbloquearlo al acercarse contradice la finalidad que da la página, evitar el acceso no autorizado si olvidas bloquearlo al alejarte."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Otras configuraciones»"
  difficulty: 2
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q011
  prompt:
    es: "En Windows 11, con el bloqueo dinámico activado, ¿cuál de los siguientes plazos describe cuándo se bloquea el dispositivo después de que el usuario salga del alcance de Bluetooth?"
  options:
  - id: a
    text:
      es: "Automáticamente, cinco minutos después de salir del alcance"
  - id: b
    text:
      es: "Automáticamente, treinta segundos después de salir del alcance"
  - id: c
    correct: true
    text:
      es: "Automáticamente, un minuto después de salir del alcance"
  - id: d
    text:
      es: "Automáticamente, quince minutos después de salir del alcance"
  explanation:
    es: "La página dice que Windows «se bloqueará automáticamente en un minuto después de que salgas fuera del alcance de Bluetooth». Treinta segundos, cinco minutos y quince minutos no son el plazo que da."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Otras configuraciones»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-opciones-inicio-sesion-html
- id: m06-l02-q012
  prompt:
    es: "En las opciones de inicio de sesión de Windows 11, la opción «Mostrar detalles de la cuenta en la pantalla de inicio de sesión», cuando está activada:"
  options:
  - id: a
    correct: true
    text:
      es: "Muestra la dirección de correo electrónico de la cuenta."
  - id: b
    text:
      es: "Bloquea el dispositivo cuando el usuario se aleja con el teléfono."
  - id: c
    text:
      es: "Deshabilita el uso de contraseñas para la cuenta de Microsoft."
  - id: d
    text:
      es: "Muestra en esa pantalla la contraseña que se está escribiendo."
  explanation:
    es: "Esa opción «muestra la dirección de correo electrónico de tu cuenta de usuario en la pantalla de inicio de sesión». Bloquear el dispositivo al alejarse es el bloqueo dinámico, deshabilitar las contraseñas es la opción de solo permitir Windows Hello, y mostrar la contraseña en la pantalla de inicio de sesión es lo que hace Alt+F8 según la tabla de métodos abreviados."
  citation: "fuente: `ms-win-opciones-inicio-sesion.html`; «Otras configuraciones»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-version-html
- id: m06-l02-q014
  prompt:
    es: "En Windows 11, ¿en qué apartado de la aplicación Configuración está la página Acerca de, que muestra la versión del sistema operativo?"
  options:
  - id: a
    correct: true
    text:
      es: "Sistema"
  - id: b
    text:
      es: "Accesibilidad"
  - id: c
    text:
      es: "Hora & idioma"
  - id: d
    text:
      es: "Privacidad & seguridad"
  explanation:
    es: "La página indica «Iniciar › Configuración › Sistema y luego Acerca de». Accesibilidad, Hora & idioma y Privacidad & seguridad son otros apartados de Configuración, y ninguno contiene la página Acerca de."
  citation: "fuente: `ms-win-version.html`; «Propiedades del sistema»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-version-html
- id: m06-l02-q015
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones permite ver los detalles de la versión del dispositivo, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "Pulsar Windows+U y entrar en la sección Accesibilidad."
  - id: b
    text:
      es: "Pulsar Windows+N y abrir el centro de notificaciones."
  - id: c
    correct: true
    text:
      es: "Escribir winver en la barra de búsqueda y presionar Entrar."
  - id: d
    text:
      es: "Pulsar Windows+Tab y abrir la Vista de tareas."
  explanation:
    es: "La página dice que se puede escribir «winver» en la barra de búsqueda y presionar Entrar para ver los detalles de la versión del dispositivo. Windows+U abre Configuración en Accesibilidad, Windows+N el centro de notificaciones y Windows+Tab la Vista de tareas; ninguno muestra la versión."
  citation: "fuente: `ms-win-version.html`; «Uso de la búsqueda de palabras clave»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-version-html
- id: m06-l02-q016
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes herramientas se abre al escribir msinfo32 en la barra de búsqueda y presionar Entrar?"
  options:
  - id: a
    text:
      es: "Editor del Registro"
  - id: b
    correct: true
    text:
      es: "Información del sistema"
  - id: c
    text:
      es: "Visor de eventos"
  - id: d
    text:
      es: "Administrador de tareas"
  explanation:
    es: "La página dice que «msinfo» o «msinfo32» abre Información del sistema. El Editor del Registro, el Visor de eventos y el Administrador de tareas son otras herramientas de Windows que ese comando no abre."
  citation: "fuente: `ms-win-version.html`; «Uso de la búsqueda de palabras clave»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-version-html
- id: m06-l02-q017
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos, escrito en PowerShell o en el símbolo del sistema, muestra la información detallada sobre la licencia?"
  options:
  - id: a
    text:
      es: "winver"
  - id: b
    correct: true
    text:
      es: "slmgr /dlv"
  - id: c
    text:
      es: "msinfo32"
  - id: d
    text:
      es: "systeminfo"
  explanation:
    es: "La página dice que «el comando /dlv muestra la información detallada sobre la licencia» al escribir slmgr /dlv. winver y msinfo32 muestran los detalles de la versión e Información del sistema, y systeminfo, filtrado con findstr, da el nombre y la versión del sistema operativo."
  citation: "fuente: `ms-win-version.html`; «Usar un símbolo del sistema o PowerShell»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-version-html
- id: m06-l02-q018
  prompt:
    es: "Según la documentación de Microsoft sobre las versiones de Windows 11, el modelo del Canal de mantenimiento a largo plazo (LTSC) está pensado principalmente:"
  options:
  - id: a
    text:
      es: "Para implementaciones piloto y pruebas de actualizaciones de características."
  - id: b
    text:
      es: "Para desarrolladores que necesitan las características más recientes de inmediato."
  - id: c
    correct: true
    text:
      es: "Para dispositivos especializados, sin muchas aplicaciones integradas."
  - id: d
    text:
      es: "Para equipos domésticos que necesitan todas las aplicaciones integradas."
  explanation:
    es: "La página dice que «el modelo LTSC es principalmente para dispositivos especializados» y que no contiene muchas aplicaciones integradas. Las implementaciones piloto y los desarrolladores que necesitan las novedades de inmediato son los usuarios para los que la página describe el Canal de disponibilidad general; y LTSC no trae muchas aplicaciones integradas."
  citation: "fuente: `ms-win-version.html`; «¿Qué versión de Windows estoy ejecutando?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-narrador-html
- id: m06-l02-q019
  prompt:
    es: "En Windows 11, ¿qué función cumple el Narrador para las personas invidentes o con visión reducida?"
  options:
  - id: a
    correct: true
    text:
      es: "Lee e interactúa con elementos de la pantalla, como texto y botones."
  - id: b
    text:
      es: "Amplía toda la pantalla o parte de ella para ver mejor palabras e imágenes."
  - id: c
    text:
      es: "Controla el PC y escribe texto mediante comandos de voz."
  - id: d
    text:
      es: "Invierte los colores de la pantalla para reducir la fatiga visual."
  explanation:
    es: "El Narrador permite usar el PC sin ratón si eres invidente o tienes visión reducida: «lee e interactúa con elementos en la pantalla, como texto y botones». Ampliar la pantalla e invertir sus colores son funciones de la Lupa, y controlar el PC con la voz es Acceso por voz."
  citation: "fuente: `ms-win-narrador.html`; «Capítulo 1: Introducción al Narrador»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-narrador-html
- id: m06-l02-q020
  prompt:
    es: "En Windows 11, ¿qué método abreviado de teclado inicia el Narrador y, al pulsarlo de nuevo, lo detiene?"
  options:
  - id: a
    text:
      es: "Windows+Ctrl+N"
  - id: b
    text:
      es: "Windows+Ctrl+M"
  - id: c
    text:
      es: "Windows+Ctrl+C"
  - id: d
    correct: true
    text:
      es: "Windows+Ctrl+Entrar"
  explanation:
    es: "La página dice que el Narrador se inicia con Windows+Ctrl+Entrar y se detiene pulsando de nuevo esas teclas. Windows+Ctrl+N abre la configuración del Narrador, Windows+Ctrl+M la vista de configuración de la Lupa y Windows+Ctrl+C activa o desactiva los filtros de color."
  citation: "fuente: `ms-win-narrador.html`; «Dos maneras de iniciar y detener el Narrador»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-narrador-html
- id: m06-l02-q021
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado abre la configuración del Narrador, donde está el botón de alternancia Usar Narrador?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Ctrl+N"
  - id: b
    text:
      es: "Windows+Ctrl+Entrar"
  - id: c
    text:
      es: "Windows+Ctrl+M"
  - id: d
    text:
      es: "Windows+Ctrl+Q"
  explanation:
    es: "Según la página, Windows+Ctrl+N abre la configuración del Narrador, donde se cambia el botón de alternancia a Usar Narrador. Windows+Ctrl+Entrar inicia y detiene el Narrador sin abrir su configuración, Windows+Ctrl+M abre la vista de configuración de la Lupa y Windows+Ctrl+Q abre Asistencia rápida."
  citation: "fuente: `ms-win-narrador.html`; «Dos maneras de iniciar y detener el Narrador»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-narrador-html
- id: m06-l02-q022
  prompt:
    es: "En Windows 11, ¿adónde lleva cada activación del Narrador, si no se ha cambiado su configuración?"
  options:
  - id: a
    text:
      es: "A la vista de configuración de la Lupa, con los niveles de zoom."
  - id: b
    correct: true
    text:
      es: "A Inicio del Narrador, con vínculos como Inicio rápido."
  - id: c
    text:
      es: "A la sección Accesibilidad de la aplicación Configuración."
  - id: d
    text:
      es: "Al cuadro de diálogo Ejecutar, para escribir un comando de voz."
  explanation:
    es: "La página dice: «Cada vez que actives el Narrador, irás a Inicio del Narrador», cuyos vínculos incluyen Inicio rápido, Guía del Narrador, Novedades, Configuración y Comentarios. La vista de configuración de la Lupa se abre con Windows+Ctrl+M, la sección Accesibilidad con Windows+U y el cuadro Ejecutar con Windows+R."
  citation: "fuente: `ms-win-narrador.html`; «Página principal del Narrador»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-narrador-html
- id: m06-l02-q024
  prompt:
    es: "En Windows 11, ¿cómo se consigue que el Narrador se inicie automáticamente antes del inicio de sesión para todos los usuarios?"
  options:
  - id: a
    text:
      es: "Marcando «Iniciar el Narrador después de iniciar sesión» en su configuración."
  - id: b
    text:
      es: "Marcando «Iniciar Lupa antes de iniciar sesión» en la configuración de la Lupa."
  - id: c
    correct: true
    text:
      es: "Marcando «Iniciar el Narrador antes del inicio de sesión» en su configuración."
  - id: d
    text:
      es: "Desmarcando la casilla de la Página principal del Narrador en su configuración."
  explanation:
    es: "Para iniciar el Narrador antes del inicio de sesión para todos los usuarios se marca la casilla «Iniciar el Narrador antes del inicio de sesión», en la configuración que abre Windows+Ctrl+N. La casilla de después de iniciar sesión lo arranca tras entrar; la opción de la Lupa arranca la Lupa, no el Narrador; y la casilla de la Página principal solo decide si esa página se abre al iniciar el Narrador."
  citation: "fuente: `ms-win-narrador.html`; «Inicia el Narrador automáticamente antes o después de que inicies sesión en el equipo»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-narrador-html
