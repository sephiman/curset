  - id: d
    correct: true
    text:
      es: "El lunes, 28 de junio de 2027."
  explanation:
    es: "El plazo no puede ser superior a quince días, que son hábiles (art. 30.2 LPAC), y se cuentan desde el martes 8 de junio. Excluidos sábados y domingos, y sin festivos en el periodo, el decimoquinto día hábil es el lunes, 28 de junio de 2027. La fecha del martes 22 cuenta quince días naturales. La del viernes 25 cuenta el día de la notificación como primero. La del lunes 21 aplica diez días, el mínimo de la audiencia, y no el máximo de esta cuestión."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
