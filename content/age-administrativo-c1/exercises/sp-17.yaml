type: case
title:
  es: "La reforma de un archivo"
scenario:
  es: "La Delegación Especial de Economía y Hacienda en Murcia forma parte del Ministerio de Hacienda, un departamento ministerial. Entre el lunes, 5 de abril de 2027, y el viernes, 30 de abril de 2027, no cae en Murcia ningún festivo, y en los plazos por días hábiles solo son inhábiles los sábados y los domingos. Los plazos por meses que cuentan las cuestiones terminan en día hábil.\n\nDoña Pilar Almagro Sandoval, funcionaria de carrera del Cuerpo General Administrativo, Subgrupo C1, presenta en papel una solicitud de permiso. Industrias Abellán Guirao S.L. entrega en papel una solicitud de autorización el martes, 6 de abril de 2027, y, requerida por la Delegación, la presenta por vía electrónica el jueves, 15 de abril de 2027. La empresa aporta por el registro electrónico un documento que la Delegación le pidió con un plazo de diez días hábiles. En otro expediente, tramitado de urgencia, se notifica a un interesado un trámite de audiencia de diez días hábiles en el procedimiento ordinario. La Subsecretaria de Hacienda deniega la reducción de jornada de Doña Inmaculada Ródenas Pardo, funcionaria de carrera del mismo Cuerpo y Subgrupo, en una resolución de personal, que pone fin a la vía administrativa.\n\nPara reformar el archivo, la Delegación tramita un contrato de obras de valor estimado 70.000 euros, IVA excluido, por el procedimiento abierto simplificado del artículo 159.6 de la Ley de Contratos del Sector Público, con ofertas electrónicas. El anuncio se publica en el perfil de contratante el lunes, 5 de abril de 2027. Obras Hondón Segura S.L. resulta adjudicataria por 62.000 euros, IVA excluido, con IVA del 21 por ciento. Debía terminar el lunes, 14 de junio de 2027, y entrega el lunes, 28 de junio de 2027, con demora imputable a ella.\n\nDon Anselmo Valcárcel Ruiz, funcionario de carrera del mismo Cuerpo y Subgrupo, obtiene por concurso un puesto en otra unidad en Murcia, sin cambio de residencia; la resolución se publica en el «Boletín Oficial del Estado» el jueves, 8 de abril de 2027, y tiene concedido un permiso por asuntos particulares del miércoles, 14 de abril, al viernes, 16 de abril de 2027. Doña Fuensanta Marín Belmonte, funcionaria de carrera del mismo Cuerpo y Subgrupo, en excedencia voluntaria por interés particular, reingresa por concurso al servicio activo. Doña Nuria Cascales Meroño es nombrada funcionaria interina por exceso de tareas. La Subsecretaria incoa un expediente disciplinario a Don Bonifacio Ibáñez Cánovas, funcionario de carrera del mismo Cuerpo y Subgrupo, y acuerda su suspensión provisional. Don Gaspar Alcaraz Tudela, funcionario de carrera del Cuerpo Superior de Administradores Civiles del Estado, Subgrupo A1, con residencia oficial en Murcia, sale en comisión de servicio con derecho a indemnización a Valencia, donde pernocta el martes, 20 de abril de 2027, en un hotel sin concierto, por 71,40 euros.\n\nLa Delegación, que tiene establecido el sistema de anticipos de caja fija, recibe de Suministros Cañete Mulero S.L. una factura de 480 euros por material de oficina no inventariable. Vende equipos informáticos retirados, que el comprador pagará en mayo de 2027, y mobiliario retirado, por el que ingresa 3.000 euros en noviembre de 2027.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-14
- id: q01
  lesson: m02-l03
  prompt:
    es: "Según el artículo 14.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿está obligada Doña Pilar a presentar por medios electrónicos su solicitud de permiso, que entrega en papel?"
  options:
  - id: a
    text:
      es: "No, porque las personas físicas pueden elegir en todo momento si se relacionan por medios electrónicos o no."
  - id: b
    correct: true
    text:
      es: "Sí, porque como empleada pública debe relacionarse electrónicamente en los trámites que realice por razón de su condición."
  - id: c
    text:
      es: "Sí, pero solo si ejerce una actividad profesional para la que se exige la colegiación obligatoria."
  - id: d
    text:
      es: "No, porque la obligación alcanza a las personas jurídicas y a las entidades sin personalidad jurídica, no a las empleadas."
  explanation:
    es: "Los empleados de las Administraciones Públicas están obligados a relacionarse electrónicamente con ellas para los trámites que realicen por razón de su condición de empleado público, en la forma que determine cada Administración (art. 14.2.e) LPAC). Doña Pilar es funcionaria y su solicitud de permiso es un trámite de esa condición. La libertad de elegir es la regla de las personas físicas no obligadas (art. 14.1 LPAC), y ella sí lo está. La colegiación obligatoria es otro supuesto, el de quienes actúan en ejercicio de su profesión (art. 14.2.c) LPAC). Las personas jurídicas y las entidades sin personalidad son otros dos supuestos, y la lista no excluye a las empleadas."
  citation: "art. 14.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-68
- id: q02
  lesson: m03-l03
  prompt:
    es: "Industrias Abellán Guirao S.L. presenta su solicitud en papel y, requerida por la Delegación, la subsana por vía electrónica. ¿Qué fecha se considera la de presentación de la solicitud?"
  options:
  - id: a
    text:
      es: "El martes, 6 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 16 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 15 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 12 de abril de 2027."
  explanation:
    es: "Es una persona jurídica y está obligada a relacionarse por medios electrónicos (art. 14.2.a) LPAC). Si presenta su solicitud en papel, la Administración la requiere para que la subsane por vía electrónica, y se considera fecha de presentación aquella en que se hizo la subsanación (art. 68.4 LPAC). Esa fecha es jueves, 15 de abril de 2027. La fecha del martes, 6 de abril de 2027, es la de la entrega en papel, que la norma no toma. La del viernes, 16 de abril de 2027, es el día siguiente, primero de los plazos que corran. La del lunes, 12 de abril de 2027, es la de la notificación de otra resolución, que no tiene relación con la solicitud."
  citation: "art. 68.4 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-33
- id: q03
  lesson: m03-l03
  prompt:
    es: "Si el trámite de audiencia se notifica al interesado el martes, 13 de abril de 2027, señale hasta qué fecha puede presentar alegaciones, teniendo en cuenta la tramitación de urgencia del expediente:"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 20 de abril de 2027."
  - id: b
    text:
      es: "El martes, 27 de abril de 2027."
  - id: c
    text:
      es: "El domingo, 18 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 19 de abril de 2027."
  explanation:
    es: "La tramitación de urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (art. 33.1 LPAC). El plazo de audiencia no es de esos dos, y queda en cinco días hábiles. Desde el día siguiente a la notificación, del miércoles 14 al martes, 20 de abril de 2027, sin sábados ni domingos. La fecha del martes, 27 de abril de 2027, cuenta los diez días hábiles del procedimiento ordinario. La del domingo, 18 de abril de 2027, suma cinco días naturales. La del lunes, 19 de abril de 2027, cuenta como primero el día de la notificación."
  citation: "art. 33.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-31
- id: q04
  lesson: m03-l03
  prompt:
    es: "Según el artículo 31.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué fecha se entiende presentado el documento que la empresa aporta por el registro electrónico el sábado, 24 de abril de 2027?"
  options:
  - id: a
    text:
      es: "El sábado, 24 de abril de 2027."
  - id: b
    text:
      es: "El domingo, 25 de abril de 2027."
  - id: c
    text:
      es: "El martes, 27 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 26 de abril de 2027."
  explanation:
    es: "El registro electrónico admite documentos todos los días del año. Para el cómputo de un plazo en días hábiles, y en cuanto al cumplimiento de los plazos por los interesados, la presentación en un día inhábil se entiende realizada a primera hora del primer día hábil siguiente (art. 31.2.b) LPAC). El sábado, 24 de abril de 2027, es inhábil, y el domingo también. El primer día hábil es el lunes, 26 de abril de 2027. La fecha del sábado, 24 de abril de 2027, es la del envío, que no cuenta en un plazo de días hábiles. La del domingo, 25 de abril de 2027, es otro día inhábil. La del martes, 27 de abril de 2027, es el segundo día hábil, no el primero."
  citation: "art. 31.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-124
- id: q05
  lesson: m03-l03
  prompt:
    es: "Contra la resolución de personal que pone fin a la vía administrativa y se le notifica el lunes, 12 de abril de 2027, Doña Inmaculada interpone recurso potestativo de reposición. ¿Hasta qué fecha puede hacerlo?"
  options:
  - id: a
    text:
      es: "El lunes, 26 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 12 de mayo de 2027."
  - id: c
    text:
      es: "El martes, 11 de mayo de 2027."
  - id: d
    text:
      es: "El lunes, 14 de junio de 2027."
  explanation:
    es: "El plazo de reposición es de un mes si el acto es expreso (art. 124.1 LPAC). Los meses se cuentan desde el día siguiente a la notificación y acaban el mismo día del mes de vencimiento (art. 30.4 LPAC): el miércoles, 12 de mayo de 2027, día hábil. La fecha del martes, 11 de mayo de 2027, cuenta el día de la notificación como primero. La del lunes, 26 de abril de 2027, aplica diez días hábiles. La del lunes, 14 de junio de 2027, es el plazo de dos meses del contencioso-administrativo (art. 46.1 LJCA), que acaba el sábado 12 de junio y pasa al lunes."
  citation: "art. 124.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-159
- id: q21
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué fecha pueden presentar proposiciones los licitadores del contrato de obras para reformar el archivo, si el órgano de contratación aplica el plazo mínimo que fija la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El jueves, 15 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 16 de abril de 2027."
  - id: c
    text:
      es: "El martes, 20 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 19 de abril de 2027."
  explanation:
    es: "Un contrato de obras de valor estimado inferior a 80.000 euros puede seguir la tramitación del artículo 159.6, con un plazo de proposiciones no inferior a diez días hábiles desde el siguiente a la publicación del anuncio en el perfil de contratante (art. 159.6.a) LCSP). Del martes 6 al lunes, 19 de abril de 2027, sin sábados ni domingos. La fecha del jueves, 15 de abril de 2027, cuenta diez días naturales. La del viernes, 16 de abril de 2027, cuenta el día de la publicación como primero. La del martes, 20 de abril de 2027, cuenta quince días naturales, el plazo general del abierto simplificado, que en las obras sube a veinte (art. 159.3 LCSP) y que esta tramitación sustituye por diez días hábiles."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-159
- id: q22
  lesson: m03-l04
  prompt:
    es: "En el contrato de obras para reformar el archivo, ¿puede el pliego incluir criterios de adjudicación evaluables mediante juicio de valor, según el artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque en esa tramitación la oferta se evalúa solo con criterios cuantificables mediante la mera aplicación de fórmulas."
  - id: b
    text:
      es: "Sí, siempre que su ponderación no supere el veinticinco por ciento del total de los criterios."
  - id: c
    text:
      es: "Sí, hasta el cuarenta y cinco por ciento del total, por tratarse de un contrato de obras."
  - id: d
    text:
      es: "Sí, pero los servicios técnicos deben valorarlo en un plazo no superior a siete días."
  explanation:
    es: "El contrato es de obras y su valor estimado, 70.000 euros, es inferior a 80.000, de modo que sigue la tramitación del artículo 159.6, en la que la oferta se entrega en un único sobre y se evalúa, en todo caso, con criterios cuantificables mediante la mera aplicación de fórmulas (art. 159.6.c) LCSP). El veinticinco por ciento es el límite de los criterios de juicio de valor en el abierto simplificado ordinario (art. 159.1.b) LCSP), que aquí no rige. El cuarenta y cinco por ciento solo vale para prestaciones intelectuales, y las obras no lo son. La valoración por los servicios técnicos en siete días es la del procedimiento ordinario, cuando hay criterios de juicio de valor (art. 159.4.e) LCSP)."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-326
- id: q08
  lesson: m03-l04
  prompt:
    es: "En el contrato de obras para reformar el archivo, que se tramita por el procedimiento abierto simplificado, la constitución de la mesa de contratación es:"
  options:
  - id: a
    text:
      es: "Obligatoria, porque en el procedimiento abierto simplificado el órgano de contratación está siempre asistido por una mesa."
  - id: b
    text:
      es: "Obligatoria, porque la mesa asiste a todo órgano de contratación en los contratos de obras de cualquier valor."
  - id: c
    correct: true
    text:
      es: "Potestativa para el órgano de contratación, porque el contrato sigue la tramitación del artículo 159.6."
  - id: d
    text:
      es: "Obligatoria, porque el valor estimado del contrato supera el umbral del contrato menor de obras."
  explanation:
    es: "En los procedimientos abierto simplificado, los órganos de contratación de las Administraciones Públicas están asistidos por una mesa, pero en los del artículo 159.6 la constitución de la mesa es potestativa (art. 326.1 LCSP). Este contrato sigue esa tramitación. Las dos opciones de la mesa obligatoria por el procedimiento o por el tipo de contrato ignoran la excepción. La del umbral del contrato menor confunde el valor del contrato con la regla de la mesa: superar ese umbral no la hace obligatoria."
  citation: "art. 326.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2017-12902-art-193
- id: q09
  lesson: m03-l04
  prompt:
    es: "Según el artículo 193.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el pliego no fija otras penalidades, las diarias que corresponden a Obras Hondón Segura S.L. por su demora, contando los días naturales, suman:"
  options:
  - id: a
    text:
      es: "630,17 euros, por 14 días de demora sobre el precio con el IVA incluido."
  - id: b
    correct: true
    text:
      es: "520,80 euros, por 14 días de demora sobre el precio de 62.000 euros, IVA excluido."
  - id: c
    text:
      es: "588,00 euros, por 14 días de demora sobre el valor estimado de 70.000 euros."
  - id: d
    text:
      es: "558,00 euros, por 15 días de demora, contando también el día del vencimiento."
  explanation:
    es: "La penalidad diaria es de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido (art. 193.3 LCSP). La demora va del martes 15 al lunes 28 de junio: 14 días naturales. Son 0,60 por 62 por 14, es decir, 520,80 euros. La cifra de 630,17 euros parte del precio con IVA, 75.020 euros, y la norma lo excluye. La de 588,00 euros usa el valor estimado, que no es el precio del contrato. La de 558,00 euros suma un día, el 14 de junio, en que la empresa aún estaba en plazo."
  citation: "art. 193.3 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2015-11719-art-10
- id: q26
  lesson: m04-l03
  prompt:
    es: "En la Delegación, Don Rubén Egea Paredes es interino en una plaza vacante desde hace treinta y ocho meses. Su convocatoria, publicada a los veinte meses, se resuelve conforme al artículo 70. ¿Qué ocurre con su nombramiento, según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Cesa al cumplirse los tres años, porque la vacante solo puede ocuparla un funcionario de carrera."
  - id: b
    correct: true
    text:
      es: "Permanece en la plaza hasta que se resuelva la convocatoria, y su cese no da derecho a compensación."
  - id: c
    text:
      es: "Cesa al cumplirse los tres años y cobra veinte días de retribuciones fijas por año de servicio."
  - id: d
    text:
      es: "Adquiere la condición de funcionario de carrera, porque la convocatoria se publicó dentro de los tres años."
  explanation:
    es: "La interinidad por plaza vacante termina a los tres años, pero el interino permanece en la plaza si la convocatoria se publicó dentro de esos tres años y se resuelve conforme al artículo 70; permanece hasta la resolución, sin compensación por su cese (art. 10.4 TREBEP). Aquí la convocatoria se publicó a los veinte meses, dentro del plazo, y por eso sigue en la plaza hasta que se resuelva y su cese no da derecho a compensación. El cese a los tres años, con la vacante reservada al funcionario de carrera, es la regla general, que la excepción desplaza. La compensación de veinte días por año corresponde al incumplimiento del plazo máximo, y aquí el plazo se cumple. La condición de funcionario de carrera no se adquiere por la interinidad (art. 10.2 TREBEP)."
  citation: "art. 10.4 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "interinos"
# anchor: boe-a-1995-8729-art-48
- id: q11
  lesson: m04-l05
  prompt:
    es: "Con la publicación de la resolución del concurso, ¿hasta qué fecha debe cesar Don Anselmo en su puesto actual, según el artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, que regula la provisión de puestos de trabajo de los funcionarios civiles de la Administración general del Estado?"
  options:
  - id: a
    text:
      es: "El viernes, 9 de abril de 2027."
  - id: b
    text:
      es: "El domingo, 11 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 13 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 12 de abril de 2027."
  explanation:
    es: "El cese debe efectuarse dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el «Boletín Oficial del Estado» (art. 48.1 RD 364/1995). Desde el viernes 9 de abril, los tres días hábiles son el viernes 9, el lunes 12 y el martes, 13 de abril de 2027. La fecha del domingo, 11 de abril de 2027, suma tres días naturales. La del lunes, 12 de abril de 2027, cuenta el día de la publicación como primero. La del viernes, 9 de abril de 2027, es el día siguiente, en que el plazo apenas empieza."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-48
- id: q23
  lesson: m04-l05
  prompt:
    es: "Don Anselmo cesa el martes, 13 de abril de 2027, y disfruta después el permiso por asuntos particulares que tiene concedido. ¿Cuál es el último día en que puede tomar posesión en su nuevo puesto?"
  options:
  - id: a
    text:
      es: "El viernes, 16 de abril de 2027."
  - id: b
    text:
      es: "El lunes, 19 de abril de 2027."
  - id: c
    text:
      es: "El jueves, 22 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 21 de abril de 2027."
  explanation:
    es: "Sin cambio de residencia, el plazo posesorio es de tres días hábiles (art. 48.1 RD 364/1995), y su cómputo se inicia cuando terminan los permisos concedidos (art. 48.3 RD 364/1995). El permiso acaba el viernes 16 de abril. Los tres días hábiles son el lunes 19, el martes 20 y el miércoles, 21 de abril de 2027. La fecha del viernes, 16 de abril de 2027, los cuenta desde el cese e ignora el permiso. La del lunes, 19 de abril de 2027, solo cuenta el primer día hábil. La del jueves, 22 de abril de 2027, empieza a contar un día más tarde, el martes."
  citation: "art. 48.3 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-48
- id: q13
  lesson: m04-l05
  prompt:
    es: "La resolución del concurso con la que Doña Fuensanta reingresa al servicio activo se publica el miércoles, 14 de abril de 2027. ¿Hasta qué fecha puede tomar posesión de su puesto en la Delegación?"
  options:
  - id: a
    text:
      es: "El lunes, 19 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 14 de mayo de 2027."
  - id: c
    text:
      es: "El jueves, 13 de mayo de 2027."
  - id: d
    text:
      es: "El miércoles, 19 de mayo de 2027."
  explanation:
    es: "El plazo de toma de posesión es de un mes si comporta el reingreso al servicio activo, y en el reingreso se computa desde la publicación de la resolución, no desde el cese (art. 48.1 RD 364/1995). El mes empieza el jueves 15 de abril y acaba el viernes, 14 de mayo de 2027 (art. 30.4 LPAC), día hábil. La fecha del jueves, 13 de mayo de 2027, cuenta el día de la publicación como primero. La del lunes, 19 de abril de 2027, aplica los tres días hábiles del puesto sin reingreso. La del miércoles, 19 de mayo de 2027, cuenta el mes desde el cese, que se produce el lunes 19 de abril como muy tarde."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-98
- id: q14
  lesson: m04-l06
  prompt:
    es: "El expediente de Don Bonifacio se incoa el miércoles, 7 de abril de 2027, y su suspensión provisional se acuerda el miércoles, 14 de abril de 2027. ¿Hasta qué fecha puede mantenerse esta como máximo, si el procedimiento no se paraliza por causa imputable a él?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves, 14 de octubre de 2027."
  - id: b
    text:
      es: "El miércoles, 14 de julio de 2027."
  - id: c
    text:
      es: "El jueves, 7 de octubre de 2027."
  - id: d
    text:
      es: "El miércoles, 13 de octubre de 2027."
  explanation:
    es: "La suspensión provisional como medida cautelar en un expediente disciplinario no puede exceder de seis meses, salvo paralización imputable al interesado (art. 98.3 TREBEP). Los seis meses corren desde que se acuerda, el miércoles 14 de abril, y acaban el jueves, 14 de octubre de 2027. La fecha del jueves, 7 de octubre de 2027, cuenta los seis meses desde la incoación, y la medida se acuerda una semana después. La del miércoles, 13 de octubre de 2027, cuenta el día en que se acuerda como primero. La del miércoles, 14 de julio de 2027, aplica tres meses."
  citation: "art. 98.3 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1986-1216-art-35
- id: q15
  lesson: m04-l06
  prompt:
    es: "Con la incoación el miércoles, 7 de abril de 2027, ¿hasta qué fecha debe formular el Instructor el pliego de cargos, salvo ampliación, según el Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "El miércoles, 28 de abril de 2027."
  - id: b
    text:
      es: "El jueves, 6 de mayo de 2027."
  - id: c
    text:
      es: "El lunes, 7 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes, 7 de mayo de 2027."
  explanation:
    es: "El Instructor formula el pliego de cargos en un plazo no superior a un mes, contado a partir de la incoación del procedimiento, y puede pedir su ampliación por causas justificadas (art. 35.1 RD 33/1986). Con la incoación el miércoles 7 de abril, el mes acaba el viernes, 7 de mayo de 2027 (art. 30.4 LPAC). La fecha del jueves, 6 de mayo de 2027, cuenta el día de la incoación como primero. La del miércoles, 28 de abril de 2027, aplica quince días hábiles. La del lunes, 7 de junio de 2027, aplica dos meses."
  citation: "art. 35.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2002-10337-art-10
- id: q16
  lesson: m05-l04
  prompt:
    es: "¿Qué importe puede percibir Don Gaspar por el alojamiento de esa noche, según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio?"
  options:
  - id: a
    text:
      es: "71,40 euros, lo realmente gastado y justificado."
  - id: b
    text:
      es: "103,37 euros, la dieta entera del grupo 2 por alojamiento y manutención."
  - id: c
    correct: true
    text:
      es: "65,97 euros, el máximo del grupo 2, porque lo gastado lo supera."
  - id: d
    text:
      es: "48,92 euros, el máximo del grupo 3 por alojamiento."
  explanation:
    es: "Don Gaspar es del Subgrupo A1, de los grupos A y B, es decir, del grupo 2 (anexo I RD 462/2002), con 65,97 euros como máximo por alojamiento (anexo II). Sin sistema de concierto, el alojamiento se paga por lo realmente gastado y justificado, sin exceder esa cuantía (art. 10.3 RD 462/2002). Gasta 71,40 euros, por encima del máximo, y cobra 65,97 euros. Los 71,40 euros ignoran el tope. Los 103,37 euros son la dieta entera del grupo 2, que suma alojamiento y manutención. Los 48,92 euros aplican el máximo del grupo 3, que es el del Subgrupo C1."
  citation: "art. 10.3 RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-1996-2627-regla-77
- id: q17
  lesson: m05-l03
  prompt:
    es: "Señale el documento contable que expide el Servicio gestor al formalizarse el contrato de obras, según la Orden de 1 de febrero de 1996 por la que se aprueba la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado:"
  options:
  - id: a
    text:
      es: "Un documento RC de ejercicio corriente, que certifica la existencia de crédito para el contrato."
  - id: b
    correct: true
    text:
      es: "Un documento D por el importe que corresponda al presupuesto corriente."
  - id: c
    text:
      es: "Un documento A por el importe del expediente de gasto aprobado, con cargo al presupuesto en curso."
  - id: d
    text:
      es: "Un documento ADOK, que aprueba, compromete y reconoce el gasto de la obra en un solo acto."
  explanation:
    es: "La Delegación forma parte de un departamento ministerial, y la IOC rige la ejecución del gasto de sus servicios. Cuando se formalizan los contratos, el Servicio gestor expide el documento D por el importe que corresponda al presupuesto corriente (regla 77.2 IOC). El documento RC se expide al inicio del expediente, para certificar el crédito (regla 77.1 IOC). El documento A se expide cuando se aprueba el expediente de gasto, antes de la adjudicación. El documento ADOK reúne las cuatro operaciones en un acto y no es el de la formalización de un contrato de obras."
  citation: "regla 77.2 IOC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1989-14441-art-6
- id: q24
  lesson: m05-l05
  prompt:
    es: "Si la Delegación paga con cargo al anticipo la factura de Suministros Cañete Mulero S.L., ¿cómo se dispone de los fondos de la cuenta de la Caja pagadora, según el artículo 6.1 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija?"
  options:
  - id: a
    correct: true
    text:
      es: "Con cheque nominativo o transferencia, con las firmas mancomunadas del Cajero pagador y de otro funcionario designado."
  - id: b
    text:
      es: "Con tarjeta bancaria, que es el medio ordinario de disposición de fondos de la Caja pagadora."
  - id: c
    text:
      es: "Con cheque nominativo o transferencia autorizados solo por el Cajero pagador, que responde de los fondos."
  - id: d
    text:
      es: "Con cheque nominativo o transferencia firmados por el Cajero pagador y por el Interventor Delegado."
  explanation:
    es: "Los fondos de las cuentas de la Caja pagadora se disponen mediante cheques nominativos o transferencias bancarias, con las firmas mancomunadas del Cajero pagador y del funcionario que designe el Jefe de la Unidad Administrativa a la que esté adscrita (art. 6.1 RD 725/1989). La tarjeta bancaria solo cabe de manera excepcional, cuando no son aplicables los medios ordinarios (art. 6.3 RD 725/1989). La firma única del Cajero pagador no basta, porque la norma exige dos firmas. Y el Interventor Delegado informa y examina las cuentas, pero no firma las disposiciones de fondos."
  citation: "art. 6.1 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2003-21614-art-53
- id: q19
  lesson: m05-l02
  prompt:
    es: "El ingreso de 3.000 euros que la Delegación obtiene en noviembre de 2027 por la venta de mobiliario retirado, ¿puede generar crédito en el presupuesto de 2028?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, excepcionalmente, porque se ha realizado en el último trimestre del ejercicio anterior."
  - id: b
    text:
      es: "No, porque solo generan crédito los ingresos realizados en el propio ejercicio del presupuesto."
  - id: c
    text:
      es: "Sí, porque cualquier ingreso por ventas genera crédito en el presupuesto del año siguiente."
  - id: d
    text:
      es: "No, porque esos ingresos deben incorporarse como remanente de crédito al ejercicio siguiente."
  explanation:
    es: "La venta de bienes del inmovilizado es un supuesto de generación (art. 53.2.c) LGP). Pueden generar crédito los ingresos realizados en el propio ejercicio, y con carácter excepcional también los del último trimestre del ejercicio anterior (art. 53.5 LGP). El ingreso es de noviembre de 2027, cuarto trimestre, así que puede generar crédito en 2028. La opción de la regla del propio ejercicio ignora esa excepción. La del ingreso por ventas sin más límite ignora que solo es excepcional el ejercicio anterior y solo su último trimestre. La del remanente confunde la generación con la incorporación de remanentes, que la ley limita a otros supuestos."
  citation: "art. 53.5 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2003-21614-art-53
- id: q20
  lesson: m05-l02
  prompt:
    es: "La generación de crédito por la venta de los equipos informáticos retirados de la Delegación, que el comprador pagará en mayo de 2027, solo podrá tramitarse:"
  options:
  - id: a
    text:
      es: "Desde que se acuerda la venta, aunque el comprador vaya a ingresar el precio en mayo."
  - id: b
    text:
      es: "Desde que se reconoce el derecho al cobro, como en las aportaciones a organismos autónomos."
  - id: c
    correct: true
    text:
      es: "Cuando el comprador haya efectuado el ingreso del precio."
  - id: d
    text:
      es: "Cuando el comprador asuma un compromiso firme de pago dentro del propio ejercicio."
  explanation:
    es: "La venta de bienes del inmovilizado es un supuesto de generación (art. 53.2.c) LGP), y la generación solo puede realizarse cuando se han efectuado los ingresos que la justifican (art. 53.3 LGP). Mientras el comprador no ingrese el precio, la Delegación no puede tramitarla. Bastaría el reconocimiento del derecho o un compromiso firme de aportación solo en las aportaciones a organismos autónomos y a la Seguridad Social, y la venta no es ese caso. Acordar la venta tampoco genera crédito."
  citation: "art. 53.3 LGP"
  difficulty: 1
  tags:
  - "requisito"
