# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q001
  prompt:
    es: "¿Cuál es el orden de las fases de la gestión del Presupuesto de gastos del Estado en la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Aprobación del gasto, compromiso de gasto, ordenación del pago, reconocimiento de la obligación y pago material."
  - id: b
    correct: true
    text:
      es: "Aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  - id: c
    text:
      es: "Aprobación del gasto, reconocimiento de la obligación, compromiso de gasto, ordenación del pago y pago material."
  - id: d
    text:
      es: "Compromiso de gasto, aprobación del gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  explanation:
    es: "El artículo 73.1 enumera las fases en este orden: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. La opción que adelanta la ordenación del pago la coloca antes del reconocimiento de la obligación, que es lo que la origina. La que sitúa el reconocimiento antes del compromiso reconocería una obligación sin gasto comprometido. La que empieza por el compromiso comprometería un gasto que aún no se ha aprobado."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q002
  prompt:
    es: "¿Cómo denomina la Ley 47/2003, de 26 de noviembre, General Presupuestaria a la primera fase de la gestión del Presupuesto de gastos del Estado?"
  options:
  - id: a
    text:
      es: "Autorización del gasto, antes de su compromiso con terceros."
  - id: b
    correct: true
    text:
      es: "Aprobación del gasto, antes de su compromiso con terceros."
  - id: c
    text:
      es: "Retención de crédito, antes de la aprobación del gasto."
  - id: d
    text:
      es: "Propuesta de gasto, antes de la aprobación del crédito."
  explanation:
    es: "El artículo 73.1 dice que la gestión del Presupuesto de gastos del Estado «se realizará a través de las siguientes fases: a) Aprobación del gasto. b) Compromiso de gasto. c) Reconocimiento de la obligación. d) Ordenación del pago. e) Pago material.»; la primera es la aprobación del gasto. La autorización del gasto no es el nombre que la Ley da a esa fase: el artículo 73.2 dice: «La aprobación es el acto mediante el cual se autoriza la realización de un gasto determinado», de modo que autorizar es lo que hace la aprobación. La retención de crédito no es ninguna de las cinco fases de esa lista; la Instrucción de operatoria contable dice que se solicita «Al inicio de la tramitación de un expediente de gasto» (regla 14.1). La propuesta de gasto tampoco es ninguna de las cinco fases que enumera el artículo 73.1."
  citation: "art. 73.1 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q003
  prompt:
    es: "Además del Estado, el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria aplica la gestión del Presupuesto de gastos por fases a sus organismos autónomos y a:"
  options:
  - id: a
    text:
      es: "las sociedades mercantiles estatales y las fundaciones del sector público estatal con presupuesto estimativo."
  - id: b
    correct: true
    text:
      es: "las entidades estatales con presupuesto limitativo y las entidades gestoras y servicios comunes de la Seguridad Social."
  - id: c
    text:
      es: "las entidades locales y las comunidades autónomas que reciban transferencias del Estado."
  - id: d
    text:
      es: "los consorcios participados por el Estado y las entidades gestoras de la Seguridad Social, sin sus servicios comunes."
  explanation:
    es: "El artículo 73.1 aplica las fases al Presupuesto de gastos del Estado, de sus organismos autónomos y de las entidades integrantes del sector público estatal con presupuesto limitativo, así como de las entidades gestoras y servicios comunes de la Seguridad Social. Las sociedades y fundaciones con presupuesto estimativo no están en esa lista. Las entidades locales y las comunidades autónomas tienen su propio presupuesto, no el del Estado. Los consorcios no figuran, y la Seguridad Social entra con sus entidades gestoras y también con sus servicios comunes."
  citation: "art. 73.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1996-2627-regla-20
- id: m05-l03-q004
  prompt:
    es: "Según la regla 20.1 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, la ejecución de los gastos presupuestarios se realiza en las fases de autorización del gasto, compromiso del gasto y:"
  options:
  - id: a
    text:
      es: "la ordenación del pago de las obligaciones, que cierra la ejecución del gasto."
  - id: b
    correct: true
    text:
      es: "el reconocimiento de la obligación, que cierra la ejecución del gasto."
  - id: c
    text:
      es: "el pago material, que cierra la ejecución del gasto."
  - id: d
    text:
      es: "la propuesta de pago, que cierra la ejecución del gasto."
  explanation:
    es: "La regla 20.1 divide la ejecución de los gastos presupuestarios en tres fases: autorización del gasto, compromiso del gasto y reconocimiento de la obligación. La ordenación del pago y el pago material figuran en el artículo 73.1 de la Ley General Presupuestaria, no entre las fases de la regla 20.1. La propuesta de pago no es una fase: va implícita en el reconocimiento de la obligación."
  citation: "regla 20.1 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q006
  prompt:
    es: "Según el artículo 73.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la aprobación es el acto por el que se autoriza la realización de un gasto determinado por una cuantía:"
  options:
  - id: a
    text:
      es: "cierta, nunca aproximada, reservando la totalidad de un crédito presupuestario."
  - id: b
    correct: true
    text:
      es: "cierta o aproximada, reservando la totalidad o parte de un crédito presupuestario."
  - id: c
    text:
      es: "determinada o determinable, reservando la totalidad o parte de un crédito presupuestario."
  - id: d
    text:
      es: "máxima o mínima, reservando una parte del crédito del ejercicio corriente."
  explanation:
    es: "El artículo 73.2 dice que la aprobación autoriza un gasto «determinado por una cuantía cierta o aproximada, reservando a tal fin la totalidad o parte de un crédito presupuestario». La cuantía puede ser aproximada, así que exigir una cuantía cierta es falso. «Determinado o determinable» es la fórmula del compromiso, no de la aprobación. La Ley no habla de cuantía máxima o mínima ni limita la reserva al ejercicio corriente."
  citation: "art. 73.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q007
  prompt:
    es: "¿Con quién genera relaciones la aprobación del gasto, cuando inicia el procedimiento de ejecución, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Con el contratista, que queda vinculado a la cuantía y condiciones del gasto."
  - id: b
    text:
      es: "Con el acreedor, que adquiere un crédito exigible contra la Hacienda Pública."
  - id: c
    text:
      es: "Con las entidades financieras que ejecutarán después el pago material del gasto."
  - id: d
    correct: true
    text:
      es: "Con ningún tercero ajeno a la Hacienda Pública estatal ni a la Seguridad Social."
  explanation:
    es: "Según el artículo 73.2, la aprobación inicia el procedimiento de ejecución del gasto «sin que implique relaciones con terceros ajenos a la Hacienda Pública estatal o a la Seguridad Social». Vincular al contratista es el efecto del compromiso, que tiene relevancia jurídica para con terceros. El crédito exigible del acreedor nace con el reconocimiento de la obligación. Las entidades financieras intervienen en el pago, que es una fase posterior."
  citation: "art. 73.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q009
  prompt:
    es: "De acuerdo con el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el compromiso es el acto por el que se acuerda, tras cumplir los trámites legales, la realización de gastos previamente aprobados, por un importe:"
  options:
  - id: a
    correct: true
    text:
      es: "determinado o determinable."
  - id: b
    text:
      es: "cierto o aproximado."
  - id: c
    text:
      es: "máximo o mínimo."
  - id: d
    text:
      es: "provisional o definitivo."
  explanation:
    es: "El artículo 73.3 define el compromiso como el acto que acuerda gastos previamente aprobados «por un importe determinado o determinable». «Cierta o aproximada» es la cuantía de la aprobación en el artículo 73.2. Los importes máximo o mínimo y provisional o definitivo no figuran en el artículo."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q010
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el compromiso de gasto es correcta según el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Inicia el procedimiento de ejecución del gasto sin que implique relaciones con terceros ajenos a la Hacienda Pública estatal."
  - id: b
    text:
      es: "Declara la existencia de un crédito exigible contra la Hacienda Pública estatal y comporta la propuesta de pago correspondiente."
  - id: c
    correct: true
    text:
      es: "Tiene relevancia jurídica para con terceros y vincula a la Hacienda Pública estatal a la realización del gasto."
  - id: d
    text:
      es: "Reserva la totalidad o parte de un crédito presupuestario para un gasto de cuantía cierta o aproximada, sin vincular a terceros."
  explanation:
    es: "El artículo 73.3 dice que el compromiso es un acto con relevancia jurídica para con terceros y que vincula a la Hacienda Pública estatal a realizar el gasto en la cuantía y condiciones establecidas. Iniciar el procedimiento sin relaciones con terceros es lo propio de la aprobación. Declarar un crédito exigible con propuesta de pago es el reconocimiento de la obligación. Reservar crédito para un gasto de cuantía cierta o aproximada vuelve a ser la aprobación."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q011
  prompt:
    es: "Según el artículo 73.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué exige el reconocimiento de obligaciones con cargo a la Hacienda Pública estatal?"
  options:
  - id: a
    text:
      es: "Obtener el informe previo de la Intervención General de la Administración del Estado sobre el gasto aprobado y comprometido."
  - id: b
    correct: true
    text:
      es: "Acreditar documentalmente ante el órgano competente la realización de la prestación o el derecho del acreedor."
  - id: c
    text:
      es: "Haber ordenado el pago material al acreedor con anterioridad al reconocimiento."
  - id: d
    text:
      es: "Acreditar que el crédito presupuestario correspondiente ha sido objeto de retención previa."
  explanation:
    es: "El artículo 73.4 exige la acreditación documental previa ante el órgano competente de la realización de la prestación o del derecho del acreedor, conforme a los acuerdos que aprobaron y comprometieron el gasto. El informe previo de la Intervención General no es un requisito de ese apartado. El pago material es la fase final, posterior al reconocimiento. La retención previa del crédito es un trámite de inicio del expediente y el artículo no la exige para reconocer."
  citation: "art. 73.4 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q012
  prompt:
    es: "¿Qué acto declara la existencia de un crédito exigible contra la Hacienda Pública estatal o contra la Seguridad Social, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "La fase de aprobación del gasto."
  - id: b
    text:
      es: "La fase de compromiso de gasto."
  - id: c
    text:
      es: "La fase de ordenación del pago."
  - id: d
    correct: true
    text:
      es: "La fase de reconocimiento de la obligación."
  explanation:
    es: "El artículo 73.4 define el reconocimiento de la obligación como el acto que declara la existencia de un crédito exigible, derivado de un gasto aprobado y comprometido. La aprobación solo reserva crédito y no genera relaciones con terceros. El compromiso vincula a la Hacienda a realizar el gasto, pero no declara un crédito exigible. La ordenación del pago es posterior a la obligación reconocida."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-34
- id: m05-l03-q013
  prompt:
    es: "Según el artículo 34.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, al ejercicio presupuestario se imputan las obligaciones económicas reconocidas hasta:"
  options:
  - id: a
    text:
      es: "el fin del mes de enero siguiente, aunque el gasto se hubiera realizado en el ejercicio anterior."
  - id: b
    text:
      es: "el fin del mes de noviembre, si corresponden a gastos realizados dentro del ejercicio."
  - id: c
    text:
      es: "la fecha del pago material, si el gasto se realizó dentro del ejercicio."
  - id: d
    correct: true
    text:
      es: "el fin del mes de diciembre, si corresponden a gastos realizados dentro del ejercicio."
  explanation:
    es: "El artículo 34.1.b) imputa al ejercicio las obligaciones reconocidas hasta el fin del mes de diciembre, siempre que correspondan a gastos realizados dentro del ejercicio y con cargo a los respectivos créditos. Ampliar el plazo a enero no está en el texto. Cerrarlo en noviembre tampoco. Lo que cuenta es la fecha del reconocimiento y no la del pago material."
  citation: "art. 34.1.b) LGP"
  difficulty: 2
  tags:
  - "fecha"
  - "concepto"
# anchor: boe-a-2003-21614-art-34
- id: m05-l03-q014
  prompt:
    es: "¿Con qué período coincide el ejercicio presupuestario según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Con el año natural, ampliado un mes para reconocer obligaciones pendientes."
  - id: b
    text:
      es: "Con el período que fije cada año la Ley de Presupuestos Generales del Estado."
  - id: c
    text:
      es: "Con el año natural, salvo para los organismos autónomos del Estado."
  - id: d
    correct: true
    text:
      es: "Con el año natural, de enero a diciembre."
  explanation:
    es: "El artículo 34.1 dice que el ejercicio presupuestario coincide con el año natural. Las obligaciones se imputan si se reconocen hasta el fin de diciembre, así que no hay ampliación de un mes. La Ley de Presupuestos no fija un período distinto cada año. La regla no tiene excepción para los organismos autónomos."
  citation: "art. 34.1.b) LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "fecha"
