# anchor: fuente-rfc1459-irc-txt
- id: m02-l12-q191
  prompt:
    es: "Según el RFC 1459, ¿cómo se describe el protocolo IRC, pensado para la conferencia entre usuarios de Internet?"
  options:
  - id: a
    correct: true
    text:
      es: "Como un protocolo basado en texto, con arquitectura cliente-servidor"
  - id: b
    text:
      es: "Como un protocolo de resolución de nombres de dominio en direcciones IP"
  - id: c
    text:
      es: "Como un protocolo de envío de correo entre servidores"
  - id: d
    text:
      es: "Como un protocolo de transferencia de ficheros entre un cliente y un servidor"
  explanation:
    es: "El RFC 1459 define IRC como un protocolo basado en texto y como un sistema de teleconferencia con arquitectura cliente-servidor. «Como un protocolo de transferencia de ficheros entre un cliente y un servidor» es la descripción de FTP, que transfiere ficheros por una red, según INCIBE. «Como un protocolo de envío de correo entre servidores» es la descripción de SMTP, usado para enviar correo, según INCIBE. «Como un protocolo de resolución de nombres de dominio en direcciones IP» es la función del DNS, según INCIBE."
  citation: "fuente: `rfc1459-irc.txt`; «Abstract»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc1459-irc-txt
- id: m02-l12-q193
  prompt:
    es: "Según el RFC 1459, ¿con qué carácter debe empezar el nombre de un canal de IRC?"
  options:
  - id: a
    text:
      es: "Con «,», el separador de elementos de lista"
  - id: b
    correct: true
    text:
      es: "Con «&» o con «#»"
  - id: c
    text:
      es: "Con «@», el símbolo del operador del canal"
  - id: d
    text:
      es: "Con «+», el indicador de un modo del canal"
  explanation:
    es: "Los nombres de canal son cadenas que empiezan por «&» o por «#», de hasta 200 caracteres. «Con «@», el símbolo del operador del canal»: «@» aparece junto al apodo para identificar a un operador del canal, no al principio del nombre del canal. «Con «+», el indicador de un modo del canal»: «+» se usa en los modos del canal, como +i para solo invitados. «Con «,», el separador de elementos de lista»: la coma ni siquiera puede formar parte del nombre de un canal, porque separa los elementos de una lista."
  citation: "fuente: `rfc1459-irc.txt`; «1.3 Channels»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc1459-irc-txt
- id: m02-l12-q194
  prompt:
    es: "Según el RFC 1459, ¿cuál es la longitud máxima del apodo (nickname) que distingue a cada cliente IRC?"
  options:
  - id: a
    text:
      es: "Doce caracteres"
  - id: b
    text:
      es: "Veinte caracteres"
  - id: c
    correct: true
    text:
      es: "Nueve caracteres"
  - id: d
    text:
      es: "Doscientos caracteres"
  explanation:
    es: "El RFC fija en nueve caracteres la longitud máxima del apodo único de cada cliente. «Doce caracteres» son tres caracteres más de los nueve que permite el RFC. «Veinte caracteres» más que duplica el máximo de nueve caracteres del apodo. «Doscientos caracteres» es el límite de longitud de un nombre de canal, no de un apodo."
  citation: "fuente: `rfc1459-irc.txt`; «1.2 Clients»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-rfc1459-irc-txt
- id: m02-l12-q196
  prompt:
    es: "¿Cuál de los siguientes comandos de IRC reserva el RFC 1459 a los operadores de canal?"
  options:
  - id: a
    text:
      es: "JOIN, que une a un usuario a un canal"
  - id: b
    text:
      es: "NICK, que establece el apodo del cliente"
  - id: c
    text:
      es: "SQUIT, que desconecta servidores de la red"
  - id: d
    correct: true
    text:
      es: "KICK, que expulsa a un cliente del canal"
  explanation:
    es: "El RFC 1459 reserva a los operadores de canal KICK, MODE, INVITE y TOPIC; KICK expulsa a un cliente del canal. «JOIN, que une a un usuario a un canal»: cualquier usuario puede unirse a un canal con JOIN; solo la entrada depende de los modos del canal. «SQUIT, que desconecta servidores de la red»: SQUIT y CONNECT son poderes de los operadores de IRC, que mantienen la red, no de los operadores de canal. «NICK, que establece el apodo del cliente»: NICK lo usa cada cliente al registrarse en la red para fijar su apodo."
  citation: "fuente: `rfc1459-irc.txt`; «1.3.1 Channel Operators»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-w3c-about-html
- id: m02-l12-q206
  prompt:
    es: "Según su página «About us», ¿qué tipo de organización es el World Wide Web Consortium (W3C)?"
  options:
  - id: a
    text:
      es: "Una empresa comercial que vende licencias de sus estándares"
  - id: b
    correct: true
    text:
      es: "Una organización internacional sin ánimo de lucro, de interés público"
  - id: c
    text:
      es: "Un registro que asigna dominios de primer nivel y direcciones IP"
  - id: d
    text:
      es: "Una agencia del Gobierno de Estados Unidos que financia redes de investigación"
  explanation:
    es: "El W3C se define como una organización internacional sin ánimo de lucro, de interés público, que desarrolla estándares web. «Una empresa comercial que vende licencias de sus estándares» contradice la página: los estándares del W3C se pueden usar sin coste, porque son libres de derechos. «Un registro que asigna dominios de primer nivel y direcciones IP» es la labor de la IANA y de los registros, según el RFC 1591, no la del W3C. «Una agencia del Gobierno de Estados Unidos que financia redes de investigación»: el W3C es una organización internacional de miembros, personal y público; la financiación de redes en EE. UU. la hacen agencias como DARPA o NSF, según la historia de Internet."
  citation: "fuente: `w3c-about.html`; «Who we are»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-w3c-about-html
- id: m02-l12-q207
  prompt:
    es: "¿Quién fundó el World Wide Web Consortium (W3C) y en qué año lo hizo, según su página «About us»?"
  options:
  - id: a
    text:
      es: "Bob Kahn, en 1972, con el programa de redes abiertas"
  - id: b
    text:
      es: "Vint Cerf, en 1991, con la Internet Society"
  - id: c
    correct: true
    text:
      es: "Tim Berners-Lee, en 1994"
  - id: d
    text:
      es: "Jon Postel, en 1969, con la serie de las RFC"
  explanation:
    es: "Tim Berners-Lee, inventor de la Web, fundó el W3C en 1994 para asegurar el crecimiento de la Web a largo plazo. «Vint Cerf, en 1991, con la Internet Society»: según la historia de Internet, la Internet Society se formó en 1991 con liderazgo de Cerf; no fundó el W3C. «Jon Postel, en 1969, con la serie de las RFC»: la serie de las RFC la estableció S. Crocker en 1969, con Postel como editor; no tiene que ver con el W3C. «Bob Kahn, en 1972, con el programa de redes abiertas»: Kahn introdujo en 1972 la idea de arquitectura de red abierta en DARPA; no fundó el W3C."
  citation: "fuente: `w3c-about.html`; «W3C's history»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-w3c-about-html
- id: m02-l12-q209
  prompt:
    es: "¿Cómo se toman las decisiones en el proceso de desarrollo de estándares del W3C, según su página «About us»?"
  options:
  - id: a
    correct: true
    text:
      es: "Por consenso, y las Recomendaciones requieren la revisión de los miembros"
  - id: b
    text:
      es: "Por votación de mayoría simple entre los desarrolladores"
  - id: c
    text:
      es: "Por voto ponderado según la cuota que paga cada miembro"
  - id: d
    text:
      es: "Por decisión del presidente, sin revisión de los miembros"
  explanation:
    es: "La página dice que las decisiones se toman por consenso y que la dirección técnica y los estándares requieren la revisión de los miembros. «Por votación de mayoría simple entre los desarrolladores» contradice la página: se decide por consenso, no por mayoría. «Por decisión del presidente, sin revisión de los miembros»: la página exige la revisión de los miembros para la dirección técnica y las Recomendaciones. «Por voto ponderado según la cuota que paga cada miembro»: la página no establece votos ponderados; las decisiones se toman por consenso."
  citation: "fuente: `w3c-about.html`; «Technical direction and standards (W3C Recommendations) require review by W3C Members – large and small.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-w3c-about-html
- id: m02-l12-q210
  prompt:
    es: "Según su página «About us», ¿qué condición de uso tienen los estándares web que desarrolla el W3C?"
  options:
  - id: a
    text:
      es: "Solo pueden usarlos los organismos públicos sin ánimo de lucro"
  - id: b
    text:
      es: "Requieren una licencia de pago por cada sitio web que los aplique"
  - id: c
    text:
      es: "Solo pueden usarlos las organizaciones miembro del consorcio"
  - id: d
    correct: true
    text:
      es: "Pueden usarse sin coste, porque son libres de derechos"
  explanation:
    es: "Los estándares del W3C son libres de derechos y cualquiera puede usarlos sin coste. «Requieren una licencia de pago por cada sitio web que los aplique» contradice la página: son libres de derechos. «Solo pueden usarlos las organizaciones miembro del consorcio»: la página dice que pueden usarlos todos, no solo los miembros. «Solo pueden usarlos los organismos públicos sin ánimo de lucro»: la página dice que cualquiera puede usarlos, sin limitar el uso a organismos públicos."
  citation: "fuente: `w3c-about.html`; «W3C standards may be used by anyone at no cost: if they were not free, developers would ignore them.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q211
  prompt:
    es: "¿Qué nombre reciben los estándares web del W3C, según la página de la Iniciativa de Accesibilidad Web sobre estándares?"
  options:
  - id: a
    text:
      es: "Directrices de la IANA para delegar dominios"
  - id: b
    text:
      es: "Notas de grupo de trabajo, que no son estándares"
  - id: c
    correct: true
    text:
      es: "Recomendaciones del W3C (W3C Recommendations)"
  - id: d
    text:
      es: "RFC, los memorandos de petición de comentarios"
  explanation:
    es: "La página dice que los estándares web del W3C se llaman W3C Recommendations. «RFC, los memorandos de petición de comentarios»: las RFC son la serie de memorandos que comenzó S. Crocker en 1969, según la historia de Internet. «Notas de grupo de trabajo, que no son estándares»: la página distingue los estándares del W3C de las notas de grupo de trabajo, que no lo son. «Directrices de la IANA para delegar dominios»: la IANA delega los dominios de primer nivel, según el RFC 1591, y no publica los estándares del W3C."
  citation: "fuente: `w3c-wai-estandares.html`; «Introduction»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q212
  prompt:
    es: "¿Cuál es el objetivo de la Iniciativa de Accesibilidad Web (WAI) del W3C, según su página sobre estándares de accesibilidad?"
  options:
  - id: a
    text:
      es: "Asignar los dominios de primer nivel a las organizaciones de cada país"
  - id: b
    correct: true
    text:
      es: "Ofrecer recursos y estándares para una Web accesible a personas con discapacidad"
  - id: c
    text:
      es: "Cifrar el tráfico entre el navegador y el servidor en toda la Web y autenticar a los usuarios"
  - id: d
    text:
      es: "Desarrollar el lenguaje de marcado HTML y las hojas de estilo CSS"
  explanation:
    es: "La WAI se presenta como estrategias, estándares y recursos para hacer la Web accesible a personas con discapacidad. «Cifrar el tráfico entre el navegador y el servidor en toda la Web y autenticar a los usuarios»: el cifrado del tráfico lo proporciona HTTPS, según INCIBE, y no la WAI. «Desarrollar el lenguaje de marcado HTML y las hojas de estilo CSS» es el trabajo general del W3C, que desarrolla estándares como HTML y CSS; la WAI se ocupa de la accesibilidad. «Asignar los dominios de primer nivel a las organizaciones de cada país» es la labor de la IANA y de los administradores de cada dominio, según el RFC 1591."
  citation: "fuente: `w3c-wai-estandares.html`; «Page Contents»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q214
  prompt:
    es: "¿Cuál de las siguientes pautas de accesibilidad del W3C se aplica, entre otras herramientas, a los editores HTML y a los sistemas de gestión de contenidos (CMS)?"
  options:
  - id: a
    correct: true
    text:
      es: "ATAG (Authoring Tool Accessibility Guidelines)"
  - id: b
    text:
      es: "WCAG (Web Content Accessibility Guidelines) para navegadores"
  - id: c
    text:
      es: "EARL (Evaluation and Report Language)"
  - id: d
    text:
      es: "UAAG (User Agent Accessibility Guidelines)"
  explanation:
    es: "Las herramientas de creación son el software y los servicios con los que se produce contenido web, como los editores HTML y los CMS, y sus pautas son las ATAG. «UAAG (User Agent Accessibility Guidelines)» se aplican a navegadores, extensiones y reproductores multimedia. «WCAG (Web Content Accessibility Guidelines) para navegadores» se aplican al contenido web mismo: texto, imágenes, sonidos y código. «EARL (Evaluation and Report Language)» es un formato legible por máquina para expresar los resultados de las pruebas de accesibilidad."
  citation: "fuente: `w3c-wai-estandares.html`; «Authoring Tool Accessibility Guidelines (ATAG)»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q216
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a WebVTT, según la página del W3C sobre estándares de accesibilidad?"
  options:
  - id: a
    text:
      es: "Una especificación para que los lectores de pantalla pronuncien bien el contenido con sintetizador de voz"
  - id: b
    correct: true
    text:
      es: "Un formato para subtítulos y descripciones alineados en el tiempo con el audio o el vídeo"
  - id: c
    text:
      es: "Un formato legible por máquina para expresar los resultados de las pruebas"
  - id: d
    text:
      es: "Una metodología para evaluar cuánto cumple un sitio las pautas WCAG"
  explanation:
    es: "WebVTT es el formato para subtítulos, descripciones de vídeo y otros metadatos alineados en el tiempo con el audio o el vídeo. «Un formato legible por máquina para expresar los resultados de las pruebas» es EARL, el lenguaje de informes de evaluación. «Una metodología para evaluar cuánto cumple un sitio las pautas WCAG» es WCAG-EM, la metodología de evaluación de la conformidad con WCAG. «Una especificación para que los lectores de pantalla pronuncien bien el contenido con sintetizador de voz» es el ámbito de Pronunciation, la tecnología de síntesis de voz."
  citation: "fuente: `w3c-wai-estandares.html`; «Audio and Video»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q217
  prompt:
    es: "¿Qué grupo de trabajo revisa, según el W3C, que todos sus estándares tengan soporte de accesibilidad?"
  options:
  - id: a
    text:
      es: "El grupo de trabajo de Educación y Divulgación (EOWG)"
  - id: b
    text:
      es: "El Technical Architecture Group (TAG)"
  - id: c
    text:
      es: "El Advisory Board, que guía la mejora del documento de proceso"
  - id: d
    correct: true
    text:
      es: "El grupo de trabajo Accessible Platform Architectures (APA)"
  explanation:
    es: "Todos los estándares del W3C los revisa en cuanto a soporte de accesibilidad el grupo de trabajo APA. «El grupo de trabajo de Educación y Divulgación (EOWG)»: colaboró en el desarrollo de la propia página con aportaciones de educación y divulgación; no revisa los estándares. «El Technical Architecture Group (TAG)» es la máxima autoridad del W3C en asuntos técnicos, según su página «About us». «El Advisory Board, que guía la mejora del documento de proceso»: guía la mejora del documento de proceso de la comunidad, según su página «About us»."
  citation: "fuente: `w3c-wai-estandares.html`; «All W3C standards are reviewed for accessibility support by the Accessible Platform Architectures (APA) Working Group.»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-w3c-wai-estandares-html
- id: m02-l12-q218
  prompt:
    es: "¿Qué es WCAG 3, según la página del W3C sobre estándares de accesibilidad, frente a WCAG 2.2?"
  options:
  - id: a
    correct: true
    text:
      es: "Un borrador de trabajo que se prevé convertir en estándar del W3C"
  - id: b
    text:
      es: "Un formato de informes para expresar resultados de pruebas"
  - id: c
    text:
      es: "Un estándar ya completado que sustituye a WCAG 2.2"
  - id: d
    text:
      es: "Una nota de grupo de trabajo sobre accesibilidad móvil"
  explanation:
    es: "WCAG 3 es un borrador temprano que se pretende convertir en un estándar del W3C. «Un estándar ya completado que sustituye a WCAG 2.2» contradice la página: WCAG 2.2 es un estándar vigente y WCAG 3 es solo un borrador. «Una nota de grupo de trabajo sobre accesibilidad móvil»: la accesibilidad móvil es un área de trabajo distinta de la WAI, no WCAG 3. «Un formato de informes para expresar resultados de pruebas» es EARL, no WCAG 3."
  citation: "fuente: `w3c-wai-estandares.html`; «W3C Accessibility Guidelines (WCAG) 3 Working Draft»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q219
  prompt:
    es: "Según Microsoft, ¿qué método de acceso al correo electrónico es el recomendado cuando hay que comprobar los mensajes desde varios dispositivos?"
  options:
  - id: a
    text:
      es: "SMTP"
  - id: b
    text:
      es: "POP"
  - id: c
    correct: true
    text:
      es: "IMAP"
  - id: d
    text:
      es: "FTP"
  explanation:
    es: "Microsoft recomienda IMAP cuando se necesita comprobar el correo desde varios dispositivos, como un teléfono, un portátil y una tableta. «POP»: descarga los mensajes al equipo y los elimina del servicio, de modo que solo se puede acceder a ellos desde ese equipo. «SMTP» es el protocolo para enviar correo, según INCIBE, no un método de acceso para varios dispositivos. «FTP» es un servicio de transferencia de ficheros, según INCIBE, y no un método de acceso al correo."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q220
  prompt:
    es: "Según Microsoft, ¿qué ocurre con un mensaje de correo electrónico cuando se lee mediante el protocolo IMAP?"
  options:
  - id: a
    text:
      es: "Se descarga en el equipo y se elimina del servicio de correo"
  - id: b
    correct: true
    text:
      es: "No se descarga ni se almacena en el equipo: se lee en el servicio"
  - id: c
    text:
      es: "Se descarga en cada dispositivo, que guarda su propia copia"
  - id: d
    text:
      es: "Se almacena en el equipo y sus datos adjuntos se descargan automáticamente"
  explanation:
    es: "Con IMAP el mensaje no se descarga ni se almacena en el equipo, sino que se lee en el servicio de correo. «Se descarga en el equipo y se elimina del servicio de correo» es el funcionamiento de POP: descarga los mensajes y los elimina del servicio. «Se descarga en cada dispositivo, que guarda su propia copia» contradice la página: el mensaje no se almacena en el equipo, y por eso se puede leer desde varios dispositivos. «Se almacena en el equipo y sus datos adjuntos se descargan automáticamente»: IMAP no descarga automáticamente los datos adjuntos; solo descarga un mensaje cuando se hace clic en él."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q221
  prompt:
    es: "¿Qué consecuencia tiene, según Microsoft, que POP elimine del servicio de correo los mensajes ya descargados?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo se puede acceder a ellos desde el mismo equipo"
  - id: b
    text:
      es: "Se reenvían automáticamente a los demás dispositivos del usuario"
  - id: c
    text:
      es: "Se conservan en el servicio para el resto de dispositivos"
  - id: d
    text:
      es: "Pueden leerse desde cualquier dispositivo del usuario"
  explanation:
    es: "Con POP, tras descargar el correo en el equipo, solo se puede acceder a él desde ese mismo equipo. «Pueden leerse desde cualquier dispositivo del usuario» es la ventaja de IMAP, que deja los mensajes en el servicio. «Se conservan en el servicio para el resto de dispositivos» contradice la página: POP los elimina del servicio de correo. «Se reenvían automáticamente a los demás dispositivos del usuario»: la página dice que, desde otro dispositivo, los mensajes descargados antes no estarán disponibles."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q222
  prompt:
    es: "Según la página de Microsoft sobre IMAP y POP, ¿dónde se almacena el correo enviado cuando se usa POP?"
  options:
  - id: a
    text:
      es: "En el equipo y en el servidor a la vez, para leerlo desde otros dispositivos"
  - id: b
    correct: true
    text:
      es: "Localmente en el PC o el Mac, no en el servidor de correo"
  - id: c
    text:
      es: "En el servicio de correo, accesible desde cualquier dispositivo"
  - id: d
    text:
      es: "En el servidor SMTP del proveedor hasta que lo lee el destinatario"
  explanation:
    es: "Con POP el correo enviado se guarda localmente en el PC o Mac, y no en el servidor de correo. «En el servicio de correo, accesible desde cualquier dispositivo» contradice la página: el correo enviado no está en el servidor de correo. «En el servidor SMTP del proveedor hasta que lo lee el destinatario»: SMTP es el protocolo para enviar correo, según INCIBE; la página no dice que el servidor guarde los enviados hasta su lectura. «En el equipo y en el servidor a la vez, para leerlo desde otros dispositivos»: la página dice que se almacena localmente, no en el servidor."
  citation: "fuente: `ms-outlook-imap-pop.html`; «El correo enviado se almacena localmente en su PC o Mac, no en el servidor de correo electrónico.»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q223
  prompt:
    es: "¿Qué protocolo se usa para enviar los mensajes en una cuenta de correo configurada con IMAP o con POP, según Microsoft?"
  options:
  - id: a
    text:
      es: "FTP, con un servidor de ficheros"
  - id: b
    text:
      es: "DNS, con un servidor de nombres"
  - id: c
    correct: true
    text:
      es: "SMTP, con un servidor de correo saliente"
  - id: d
    text:
      es: "HTTP, con un servidor web"
  explanation:
    es: "Microsoft indica un servidor de correo saliente (SMTP) junto al entrante (IMAP o POP). «FTP, con un servidor de ficheros» es un servicio de transferencia de ficheros, según INCIBE. «HTTP, con un servidor web» es el protocolo de navegación web, según INCIBE. «DNS, con un servidor de nombres»: traduce nombres en direcciones IP, según INCIBE."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q224
  prompt:
    es: "Según Microsoft, ¿a qué se debe normalmente que una aplicación de correo tenga dificultades para agregar una cuenta de forma automática?"
  options:
  - id: a
    text:
      es: "A que la cuenta es de correo web, que no admite aplicaciones de correo"
  - id: b
    text:
      es: "A que el proveedor solo permite el envío por SMTP, sin recepción"
  - id: c
    text:
      es: "A que la cuenta está configurada para el acceso IMAP"
  - id: d
    correct: true
    text:
      es: "A que la cuenta está configurada para el acceso POP"
  explanation:
    es: "La aplicación intenta configurar la cuenta con IMAP sin pedir nada, y las dificultades se deben normalmente a que la cuenta usa POP. «A que la cuenta está configurada para el acceso IMAP» es lo que la aplicación intenta por defecto, así que no suele causar el problema. «A que la cuenta es de correo web, que no admite aplicaciones de correo»: la página dice que se pueden agregar cuentas de correo web, como Gmail u Outlook.com, a la aplicación. «A que el proveedor solo permite el envío por SMTP, sin recepción»: SMTP sirve para enviar, y POP o IMAP para recibir; la página no atribuye el problema a SMTP."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q225
  prompt:
    es: "Si una cuenta de correo usa POP, ¿qué datos debe pedirse al proveedor para configurarla a mano en la aplicación de correo, según Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Los nombres del servidor POP y del servidor SMTP"
  - id: b
    text:
      es: "Los nombres del servidor DNS y del servidor DHCP"
  - id: c
    text:
      es: "Los nombres del servidor web y del servidor proxy"
  - id: d
    text:
      es: "Los nombres del servidor IMAP y del servidor FTP"
  explanation:
    es: "Microsoft indica averiguar el nombre del servidor POP y del servidor SMTP del proveedor. «Los nombres del servidor DNS y del servidor DHCP» no son servidores de correo: DNS traduce nombres y DHCP asigna direcciones. «Los nombres del servidor IMAP y del servidor FTP»: la cuenta usa POP y no IMAP, y FTP es un servicio de transferencia de ficheros, no de correo. «Los nombres del servidor web y del servidor proxy» no son servidores de correo: el servidor web atiende la navegación y el proxy hace de intermediario hacia Internet."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q226
  prompt:
    es: "Según la página de Microsoft sobre IMAP y POP, ¿cuándo descarga IMAP un mensaje de correo a un equipo?"
  options:
  - id: a
    text:
      es: "Al llegar al servicio, junto con todos sus datos adjuntos"
  - id: b
    text:
      es: "Al cerrar la sesión, de golpe, eliminándolo después del servicio"
  - id: c
    correct: true
    text:
      es: "Solo al hacer clic en él; los adjuntos no se descargan automáticamente"
  - id: d
    text:
      es: "Al abrir la aplicación, descargando todos los mensajes nuevos de una vez"
  explanation:
    es: "IMAP solo descarga un mensaje cuando se hace clic en él, y los datos adjuntos no se descargan automáticamente. «Al llegar al servicio, junto con todos sus datos adjuntos» contradice la página: los datos adjuntos no se descargan automáticamente. «Al cerrar la sesión, de golpe, eliminándolo después del servicio»: los mensajes descargados y eliminados del servicio son los de POP. «Al abrir la aplicación, descargando todos los mensajes nuevos de una vez»: descargar todos los mensajes nuevos desde el servicio es el funcionamiento de POP."
  citation: "fuente: `ms-outlook-imap-pop.html`; «IMAP solo descarga un mensaje cuando hace clic en él y los datos adjuntos no se descargan automáticamente.»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m02-l12-q228
  prompt:
    es: "Según la página de Microsoft sobre IMAP y POP, ¿qué son Outlook clásico, Apple Mail y Spark?"
  options:
  - id: a
    text:
      es: "Protocolos que descargan los mensajes y los eliminan del servicio"
  - id: b
    text:
      es: "Servidores que almacenan los mensajes de forma centralizada"
  - id: c
    text:
      es: "Servicios de correo web, a los que se accede iniciando sesión en un navegador"
  - id: d
    correct: true
    text:
      es: "Aplicaciones de correo instaladas en el equipo que usan un servicio de correo"
  explanation:
    es: "Son aplicaciones de correo, programas que se instalan en el equipo y se comunican con un servicio de correo como Gmail u Outlook.com. «Servicios de correo web, a los que se accede iniciando sesión en un navegador» son servicios de correo web como Gmail, Outlook.com, Hotmail.com o iCloud. «Servidores que almacenan los mensajes de forma centralizada»: el servidor es el equipo del servicio de correo, no la aplicación instalada en el equipo del usuario. «Protocolos que descargan los mensajes y los eliminan del servicio»: POP es el protocolo que descarga los mensajes y los elimina del servicio; las aplicaciones no son protocolos."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Cuentas de correo web frente a aplicaciones de correo electrónico»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-apache-httpd-about-html
- id: m02-l12-q229
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al proyecto Apache HTTP Server, según su página oficial «About the Apache HTTP Server Project»?"
  options:
  - id: a
    text:
      es: "Un protocolo seguro para transferir hipertexto con cifrado"
  - id: b
    correct: true
    text:
      es: "Una implementación de código fuente libre de un servidor HTTP (web)"
  - id: c
    text:
      es: "Un navegador web gratuito que pide los recursos a los servidores"
  - id: d
    text:
      es: "Un sistema de gestión de contenidos para publicar blogs"
  explanation:
    es: "El proyecto Apache HTTP Server crea una implementación de código fuente libre de un servidor HTTP, es decir, un servidor web. «Un navegador web gratuito que pide los recursos a los servidores»: el navegador hace las peticiones y el servidor envía los recursos, según INCIBE; Apache es el servidor. «Un sistema de gestión de contenidos para publicar blogs»: la página oficial de WordPress es la que se presenta como herramienta de blog y CMS. «Un protocolo seguro para transferir hipertexto con cifrado» es HTTPS, según INCIBE, un protocolo y no un programa de servidor."
  citation: "fuente: `apache-httpd-about.html`; «What is the Apache HTTP Server Project?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-apache-httpd-about-html
- id: m02-l12-q230
  prompt:
    es: "Según la página oficial del proyecto, ¿a qué fundación pertenece el proyecto Apache HTTP Server, el servidor web de código libre?"
  options:
  - id: a
    text:
      es: "A la Internet Society, creada en 1991"
  - id: b
    text:
      es: "A la WordPress Foundation, propietaria de la marca WordPress"
  - id: c
    text:
      es: "Al World Wide Web Consortium, fundado en 1994"
  - id: d
    correct: true
    text:
      es: "A la Apache Software Foundation, creada en 1999"
  explanation:
    es: "El proyecto forma parte de la Apache Software Foundation, que miembros del grupo Apache formaron en 1999. «A la Internet Society, creada en 1991»: la Internet Society se formó en 1991 con Cerf, según la historia de Internet, y no gestiona Apache. «Al World Wide Web Consortium, fundado en 1994»: el W3C lo fundó Tim Berners-Lee en 1994 y desarrolla estándares web, no servidores. «A la WordPress Foundation, propietaria de la marca WordPress»: la WordPress Foundation es propietaria de la marca WordPress, según la página oficial de WordPress."
  citation: "fuente: `apache-httpd-about.html`; «What is the Apache HTTP Server Project?»"
  difficulty: 1
  tags:
  - "concepto"
