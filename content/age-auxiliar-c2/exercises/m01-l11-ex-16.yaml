# anchor: boe-a-2015-10565-art-124
- id: m01-l11-q332
  prompt:
    es: "Contra la resolución de personal que pone fin a la vía administrativa y se le notifica el lunes, 12 de abril de 2027, Doña Inmaculada interpone recurso potestativo de reposición. ¿Hasta qué fecha puede hacerlo?"
  options:
  - id: a
    text:
      es: "El lunes, 26 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 12 de mayo de 2027."
  - id: c
    text:
      es: "El martes, 11 de mayo de 2027."
  - id: d
    text:
      es: "El lunes, 14 de junio de 2027."
  explanation:
    es: "El plazo de reposición es de un mes si el acto es expreso (art. 124.1 LPAC). Los meses se cuentan desde el día siguiente a la notificación y acaban el mismo día del mes de vencimiento (art. 30.4 LPAC): el miércoles, 12 de mayo de 2027, día hábil. La fecha del martes, 11 de mayo de 2027, cuenta el día de la notificación como primero. La del lunes, 26 de abril de 2027, aplica diez días hábiles. La del lunes, 14 de junio de 2027, es el plazo de dos meses del contencioso-administrativo (art. 46.1 LJCA), que acaba el sábado 12 de junio y pasa al lunes."
  citation: "art. 124.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-66
- id: m01-l11-q338
  prompt:
    es: "¿Qué debe identificar la solicitud de Doña Leocadia, además de sus datos y de la petición, en cuanto al modo de recibir las notificaciones?"
  options:
  - id: a
    text:
      es: "El lugar físico o, en su defecto, el medio electrónico en que desea que se le notifique."
  - id: b
    correct: true
    text:
      es: "El medio electrónico o, en su defecto, el lugar físico en que desea que se le notifique."
  - id: c
    text:
      es: "El medio electrónico únicamente, porque las personas físicas no pueden señalar un lugar físico."
  - id: d
    text:
      es: "El órgano que dictará la resolución y el plazo máximo en que deberá notificársela."
  explanation:
    es: "La solicitud debe contener la identificación del medio electrónico o, en su defecto, del lugar físico en que el interesado desea que se practique la notificación (art. 66.1.b LPAC). Doña Leocadia, que prefiere el papel, indica su domicilio. La opción que invierte el orden pone el lugar físico como regla y el medio electrónico como subsidiario. La que excluye el lugar físico para las personas físicas contradice el texto, porque no están obligadas a la vía electrónica. La del órgano y el plazo mezcla contenidos de otros apartados y de la notificación."
  citation: "art. 66.1.b) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-62
- id: m01-l11-q340
  prompt:
    es: "¿Adquiere Sistemas Forenses Duero, S.L. la condición de interesada en el procedimiento que se inicie, por haber presentado su denuncia sobre la adjudicación del mantenimiento?"
  options:
  - id: a
    text:
      es: "Sí, porque cualquier persona que denuncia un hecho pasa a ser interesada en el procedimiento que se inicie."
  - id: b
    text:
      es: "Sí, siempre que la denuncia exprese su identidad y el relato de los hechos denunciados."
  - id: c
    correct: true
    text:
      es: "No, porque la presentación de la denuncia no confiere, por sí sola, la condición de interesado."
  - id: d
    text:
      es: "Sí, pero solo si la denuncia invoca un perjuicio en el patrimonio de las Administraciones Públicas."
  explanation:
    es: "La denuncia pone en conocimiento del órgano un hecho que puede justificar la iniciación de oficio, y presentarla no confiere por sí sola la condición de interesado (art. 62.5 LPAC). Que la denuncia exprese la identidad del denunciante y el relato de los hechos es un contenido exigido por el artículo 62.2, y no otorga esa condición. Invocar un perjuicio en el patrimonio de las Administraciones obliga a motivar la no iniciación y a notificar la decisión (art. 62.3 LPAC), pero tampoco hace interesado al denunciante. La opción que concede la condición a cualquiera que denuncia contradice el texto."
  citation: "art. 62.5 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-99
- id: m01-l11-q352
  prompt:
    es: "Conforme al artículo 99 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones pueden proceder a la ejecución forzosa de los actos administrativos, salvo cuando la Constitución o la Ley exijan:"
  options:
  - id: a
    text:
      es: "El dictamen del Consejo de Estado."
  - id: b
    text:
      es: "La conformidad expresa del interesado."
  - id: c
    correct: true
    text:
      es: "La intervención de un órgano judicial."
  - id: d
    text:
      es: "La autorización del superior jerárquico."
  explanation:
    es: "El artículo 99 excluye la ejecución forzosa por la propia Administración cuando la Constitución o la Ley exijan la intervención de un órgano judicial. El dictamen del Consejo de Estado, la conformidad del interesado y la autorización del superior no figuran como límites."
  citation: "art. 99 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-48
- id: m01-l11-q356
  prompt:
    es: "Conforme al artículo 48.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la realización de actuaciones administrativas fuera del tiempo establecido para ellas solo implicará la anulabilidad del acto cuando:"
  options:
  - id: a
    text:
      es: "El interesado lo alegue en el plazo de diez días."
  - id: b
    correct: true
    text:
      es: "Así lo imponga la naturaleza del término o plazo."
  - id: c
    text:
      es: "El acto resulte desfavorable para el interesado."
  - id: d
    text:
      es: "Lo disponga la resolución que ponga fin al procedimiento."
  explanation:
    es: "El artículo 48.3 limita la anulabilidad por actuar fuera de plazo a los casos en que lo imponga la naturaleza del término o plazo. La alegación del interesado, el carácter desfavorable del acto y lo que diga la resolución final no son criterios de ese apartado."
  citation: "art. 48.3 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-112
- id: m01-l11-q357
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra las disposiciones administrativas de carácter general:"
  options:
  - id: a
    text:
      es: "Cabrá recurso de alzada ante el órgano superior jerárquico."
  - id: b
    text:
      es: "Cabrá solo reposición."
  - id: c
    text:
      es: "Cabrá el recurso extraordinario de revisión en cualquier momento."
  - id: d
    correct: true
    text:
      es: "No cabrá recurso en vía administrativa."
  explanation:
    es: "El artículo 112.3 excluye el recurso en vía administrativa contra las disposiciones de carácter general. La alzada, la reposición y el recurso extraordinario de revisión son recursos administrativos y no proceden contra ellas."
  citation: "art. 112.3 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q359
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el silencio administrativo tiene efecto desestimatorio en los procedimientos relativos al derecho de petición, en los de responsabilidad patrimonial y en los de:"
  options:
  - id: a
    correct: true
    text:
      es: "Impugnación de actos y disposiciones."
  - id: b
    text:
      es: "Iniciación de oficio por denuncia."
  - id: c
    text:
      es: "Terminación convencional."
  - id: d
    text:
      es: "Ejecución forzosa de los actos."
  explanation:
    es: "El artículo 24.1 añade a los procedimientos de petición y de responsabilidad patrimonial los de impugnación de actos y disposiciones. La iniciación por denuncia, la terminación convencional y la ejecución forzosa no aparecen en esa lista."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q360
  prompt:
    es: "Según el artículo 24.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la desestimación por silencio administrativo tiene los solos efectos de permitir a los interesados:"
  options:
  - id: a
    text:
      es: "Dar por finalizado el procedimiento con un acto administrativo."
  - id: b
    text:
      es: "Obtener una resolución expresa posterior vinculada al sentido del silencio."
  - id: c
    text:
      es: "Hacer valer el acto presunto ante cualquier persona física o jurídica, pública o privada."
  - id: d
    correct: true
    text:
      es: "Interponer el recurso administrativo o contencioso-administrativo que resulte procedente."
  explanation:
    es: "El artículo 24.2 reduce la desestimación por silencio a una consecuencia: abrir la vía del recurso administrativo o contencioso-administrativo procedente. Dar por terminado el procedimiento es efecto de la estimación por silencio. La resolución expresa posterior a la desestimación no queda vinculada al silencio, y hacer valer el acto ante terceros corresponde a los actos producidos por silencio positivo."
  citation: "art. 24.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-62
- id: m01-l11-q361
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la denuncia pone en conocimiento de un órgano administrativo un hecho que pudiera justificar:"
  options:
  - id: a
    text:
      es: "La iniciación a solicitud del interesado de un procedimiento."
  - id: b
    text:
      es: "La declaración de caducidad de un procedimiento en curso."
  - id: c
    correct: true
    text:
      es: "La iniciación de oficio de un procedimiento administrativo."
  - id: d
    text:
      es: "La apertura de un procedimiento judicial penal."
  explanation:
    es: "El artículo 62.1 define la denuncia como el acto que pone en conocimiento de un órgano un hecho que pudiera justificar la iniciación de oficio de un procedimiento. No inicia un procedimiento a solicitud del interesado, no declara la caducidad de uno en curso y no abre un proceso penal."
  citation: "art. 62.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-62
- id: m01-l11-q362
  prompt:
    es: "Conforme al artículo 62.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las denuncias deberán expresar la identidad de la persona o personas que las presentan y:"
  options:
  - id: a
    text:
      es: "La calificación jurídica de los hechos denunciados y de las infracciones que constituyan."
  - id: b
    text:
      es: "La prueba suficiente de los hechos denunciados."
  - id: c
    text:
      es: "La identificación del órgano competente para resolver."
  - id: d
    correct: true
    text:
      es: "El relato de los hechos que se ponen en conocimiento de la Administración."
  explanation:
    es: "El artículo 62.2 exige la identidad de quien denuncia y el relato de los hechos. La calificación jurídica, la prueba suficiente y la identificación del órgano competente no son contenido obligatorio de la denuncia."
  citation: "art. 62.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-62
- id: m01-l11-q363
  prompt:
    es: "Conforme al artículo 62.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la denuncia invoque un perjuicio en el patrimonio de las Administraciones Públicas, la no iniciación del procedimiento deberá ser:"
  options:
  - id: a
    correct: true
    text:
      es: "Motivada, y se notificará a los denunciantes la decisión de si se ha iniciado o no."
  - id: b
    text:
      es: "Comunicada solo al presunto responsable."
  - id: c
    text:
      es: "Confirmada por el superior jerárquico antes del archivo."
  - id: d
    text:
      es: "Publicada en el Boletín Oficial del Estado."
  explanation:
    es: "El artículo 62.3 exige motivar la no iniciación y notificar a los denunciantes si el procedimiento se ha iniciado o no. No se comunica solo al presunto responsable, no exige confirmación del superior jerárquico y no se publica en el Boletín Oficial del Estado."
  citation: "art. 62.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-70
- id: m01-l11-q365
  prompt:
    es: "¿Cuál de las siguientes informaciones NO forma parte del expediente administrativo, según el artículo 70.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los informes preceptivos solicitados antes de la resolución."
  - id: b
    text:
      es: "Los informes facultativos solicitados antes de la resolución."
  - id: c
    correct: true
    text:
      es: "Las notas, los borradores y los resúmenes."
  - id: d
    text:
      es: "Las diligencias de ejecución."
  explanation:
    es: "El artículo 70.4 deja fuera del expediente la información de carácter auxiliar o de apoyo, como notas, borradores, opiniones y resúmenes. Sí forman parte de él los informes, preceptivos y facultativos, solicitados antes de la resolución, y las diligencias de ejecución del artículo 70.1."
  citation: "art. 70.4 LPAC"
  difficulty: 3
  tags:
  - "excepción"
