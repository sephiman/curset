# anchor: boe-a-1992-28740-art-68
- id: m03-l18-q0112
  prompt:
    es: "Según el artículo 68.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las entregas de bienes que no sean objeto de expedición o transporte se entienden realizadas en el territorio de aplicación del impuesto cuando los bienes:"
  options:
  - id: a
    text:
      es: "se inscriban a nombre del adquirente en un registro público español."
  - id: b
    text:
      es: "se pongan a disposición del transmitente en dicho territorio."
  - id: c
    text:
      es: "sean pagados por el adquirente desde una cuenta abierta en España."
  - id: d
    correct: true
    text:
      es: "se pongan a disposición del adquirente en dicho territorio."
  explanation:
    es: "Sin expedición ni transporte, lo que decide es dónde se ponen los bienes a disposición del adquirente. La inscripción registral, el origen del pago y la puesta a disposición del transmitente no son el criterio del apartado."
  citation: "art. 68.Uno LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "entregas de bienes"
# anchor: boe-a-1992-28740-art-68
- id: m03-l18-q0113
  prompt:
    es: "¿Cuándo se entienden realizadas en el territorio de aplicación del impuesto las entregas de bienes muebles corporales que deban ser objeto de expedición o transporte con destino al adquirente, según el artículo 68.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Cuando el adquirente esté establecido en dicho territorio."
  - id: b
    correct: true
    text:
      es: "Cuando la expedición o el transporte se inicien en dicho territorio."
  - id: c
    text:
      es: "Cuando el transmitente tenga en dicho territorio la sede de su actividad económica."
  - id: d
    text:
      es: "Cuando la expedición o el transporte finalicen en dicho territorio."
  explanation:
    es: "Con expedición o transporte, la entrega se localiza donde se inicia el envío. No importa dónde termine, dónde esté establecido el adquirente ni dónde tenga la sede el transmitente."
  citation: "art. 68.Dos.1.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "expedición o transporte"
# anchor: boe-a-1992-28740-art-68
- id: m03-l18-q0114
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de bienes que han de ser objeto de instalación o montaje antes de su puesta a disposición, según el artículo 68.Dos.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se entienden realizadas en el territorio de aplicación del impuesto cuando la instalación se inicie en él, aunque no inmovilice los bienes entregados al adquirente."
  - id: b
    text:
      es: "Se entienden realizadas en el territorio de aplicación del impuesto cuando el adquirente tenga su domicilio en él y asuma el montaje."
  - id: c
    correct: true
    text:
      es: "Se entienden realizadas en el territorio de aplicación del impuesto cuando la instalación se ultime en él y implique la inmovilización de los bienes entregados."
  - id: d
    text:
      es: "Se entienden realizadas en el territorio de aplicación del impuesto cuando los bienes se fabriquen en él, sea cual sea el lugar de la instalación."
  explanation:
    es: "La entrega con instalación o montaje se localiza donde se ultima la instalación, siempre que implique la inmovilización de los bienes. No cuenta el lugar donde se inicia, el de fabricación ni el domicilio del adquirente."
  citation: "art. 68.Dos.2.º LIVA"
  difficulty: 2
  tags:
  - "lugar de realización"
  - "instalación o montaje"
# anchor: boe-a-1992-28740-art-68
- id: m03-l18-q0115
  prompt:
    es: "De acuerdo con el artículo 68.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se entienden realizadas en el territorio de aplicación del impuesto las entregas de bienes inmuebles que:"
  options:
  - id: a
    text:
      es: "se inscriban en un registro público de la propiedad español."
  - id: b
    text:
      es: "se formalicen ante un fedatario público español."
  - id: c
    text:
      es: "se transmitan a un adquirente establecido en dicho territorio."
  - id: d
    correct: true
    text:
      es: "radiquen en dicho territorio."
  explanation:
    es: "Las entregas de inmuebles se localizan donde radican. El lugar de establecimiento del adquirente, el registro público y el fedatario ante el que se formalicen no son el criterio."
  citation: "art. 68.Dos.3.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "bienes inmuebles"
# anchor: boe-a-1992-28740-art-69
- id: m03-l18-q0118
  prompt:
    es: "Conforme al artículo 69.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las prestaciones de servicios se entienden realizadas en el territorio de aplicación del impuesto cuando el destinatario sea un empresario o profesional que actúe como tal y radique en dicho territorio:"
  options:
  - id: a
    text:
      es: "el lugar de establecimiento del prestador de los servicios o el lugar desde el que los preste."
  - id: b
    correct: true
    text:
      es: "la sede de su actividad económica, o tenga en él un establecimiento permanente o, en su defecto, el lugar de su domicilio o residencia habitual."
  - id: c
    text:
      es: "el establecimiento permanente del prestador, con independencia de dónde esté establecido el destinatario."
  - id: d
    text:
      es: "la sede de su actividad económica, aunque los servicios se destinen a un establecimiento permanente situado en otro Estado miembro distinto del de su sede."
  explanation:
    es: "Con destinatario empresario que actúa como tal, cuenta dónde radica su sede, su establecimiento permanente o, en su defecto, su domicilio o residencia habitual, siempre que los servicios se destinen a ellos. No vale un servicio destinado a un establecimiento de otro Estado y el criterio es el destinatario, no el establecimiento del prestador."
  citation: "art. 69.Uno.1.º LIVA"
  difficulty: 2
  tags:
  - "lugar de realización"
  - "servicios"
  - "regla general"
# anchor: boe-a-1992-28740-art-69
- id: m03-l18-q0119
  prompt:
    es: "Señale la respuesta CORRECTA sobre los servicios cuyo destinatario es un empresario o profesional que actúa como tal con sede en el territorio de aplicación, según el artículo 69.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se entienden realizados en ese territorio solo si el prestador también está establecido en él."
  - id: b
    text:
      es: "Se entienden realizados en ese territorio solo si se prestan materialmente dentro del mismo."
  - id: c
    correct: true
    text:
      es: "Se entienden realizados en ese territorio con independencia de dónde se encuentre establecido el prestador y del lugar desde el que los preste."
  - id: d
    text:
      es: "Se entienden realizados en el lugar donde esté establecido el prestador de los servicios."
  explanation:
    es: "Cuando el destinatario es empresario con sede en el territorio, el establecimiento del prestador y el lugar desde el que presta son irrelevantes. No se localiza donde está el prestador ni se exige que este se establezca en el territorio o que preste materialmente en él."
  citation: "art. 69.Uno.1.º LIVA"
  difficulty: 2
  tags:
  - "lugar de realización"
  - "servicios"
  - "destinatario empresario"
# anchor: boe-a-1992-28740-art-69
- id: m03-l18-q0121
  prompt:
    es: "Según el artículo 69.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, determinados servicios no se entienden realizados en el territorio de aplicación cuando el destinatario, no empresario, esté establecido fuera de la Comunidad, salvo que lo esté en:"
  options:
  - id: a
    text:
      es: "las Islas Baleares, Ceuta o Melilla."
  - id: b
    correct: true
    text:
      es: "las Islas Canarias, Ceuta o Melilla."
  - id: c
    text:
      es: "cualquier otro Estado miembro de la Comunidad."
  - id: d
    text:
      es: "el Principado de Andorra o en Gibraltar."
  explanation:
    es: "La excepción no opera si el destinatario está establecido en las Islas Canarias, Ceuta o Melilla. Las Baleares son territorio de aplicación del impuesto, Andorra y Gibraltar son países terceros que no se salvan, y otro Estado miembro está dentro de la Comunidad, no fuera."
  citation: "art. 69.Dos LIVA"
  difficulty: 3
  tags:
  - "lugar de realización"
  - "servicios"
  - "excepción del artículo 69.Dos"
# anchor: boe-a-1992-28740-art-69
- id: m03-l18-q0124
  prompt:
    es: "Según el artículo 69.Tres.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, sede de la actividad económica es el lugar en el que los empresarios o profesionales centralicen:"
  options:
  - id: a
    text:
      es: "la residencia habitual de sus socios o de sus administradores."
  - id: b
    text:
      es: "la titularidad de sus bienes inmuebles y de sus registros contables."
  - id: c
    correct: true
    text:
      es: "la gestión y el ejercicio habitual de su actividad empresarial o profesional."
  - id: d
    text:
      es: "el almacenamiento de sus existencias y la facturación de sus operaciones a los clientes."
  explanation:
    es: "La sede es el lugar donde se centraliza la gestión y el ejercicio habitual de la actividad. El almacén, la titularidad de inmuebles y la residencia de los socios no la definen."
  citation: "art. 69.Tres.1.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "sede de la actividad"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0126
  prompt:
    es: "Conforme al artículo 70.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se entienden prestados en el territorio de aplicación del impuesto los servicios relacionados con bienes inmuebles que:"
  options:
  - id: a
    correct: true
    text:
      es: "radiquen en el citado territorio."
  - id: b
    text:
      es: "el destinatario haya adquirido a un transmitente establecido en España."
  - id: c
    text:
      es: "estén afectos a una actividad empresarial del destinatario en España."
  - id: d
    text:
      es: "el prestador haya inscrito en un registro público español."
  explanation:
    es: "Los servicios relacionados con inmuebles se localizan donde radican los inmuebles. La inscripción por el prestador, el origen de la adquisición y la afectación a una actividad del destinatario no son el criterio."
  citation: "art. 70.Uno.1.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "servicios relacionados con inmuebles"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0128
  prompt:
    es: "Señale la respuesta CORRECTA sobre los servicios de transporte de pasajeros, según el artículo 70.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se entienden prestados donde esté establecido el transportista, cualquiera que sea el trayecto."
  - id: b
    correct: true
    text:
      es: "Se entienden prestados en el territorio de aplicación por la parte de trayecto que discurra por él, cualquiera que sea su destinatario."
  - id: c
    text:
      es: "Se entienden prestados en ese territorio solo cuando el destinatario sea un empresario o profesional actuando como tal y la parte del trayecto discurra por él."
  - id: d
    text:
      es: "Se entienden prestados en la totalidad del trayecto cuando el inicio se produzca en dicho territorio."
  explanation:
    es: "El transporte de pasajeros se localiza por la parte del trayecto que discurre por el territorio de aplicación, sea cual sea el destinatario. No cuenta el establecimiento del transportista, no se limita a destinatarios empresarios y no se atribuye todo el trayecto al lugar de inicio."
  citation: "art. 70.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "lugar de realización"
  - "transporte de pasajeros"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0129
  prompt:
    es: "Señale la respuesta CORRECTA sobre el acceso a manifestaciones culturales, artísticas, deportivas o similares, según el artículo 70.Uno.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se entiende prestado en el territorio de aplicación si su destinatario es empresario, aunque la manifestación tenga lugar fuera de él."
  - id: b
    text:
      es: "Se entiende prestado en el territorio de aplicación si su prestador está establecido en él, aunque la manifestación se celebre en otro Estado."
  - id: c
    text:
      es: "Se entiende prestado en el territorio de aplicación si su destinatario no es empresario ni profesional y la entrada se emite en él."
  - id: d
    correct: true
    text:
      es: "Se entiende prestado en el territorio de aplicación si su destinatario es un empresario o profesional actuando como tal y la manifestación tiene lugar efectivamente en él."
  explanation:
    es: "Con destinatario empresario que actúa como tal, el acceso a la manifestación se localiza donde esta tiene lugar efectivamente. No basta la emisión de la entrada, el establecimiento del prestador ni la condición de empresario del destinatario si la manifestación se celebra fuera."
  citation: "art. 70.Uno.3.º LIVA"
  difficulty: 3
  tags:
  - "lugar de realización"
  - "manifestaciones culturales"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0130
  prompt:
    es: "De acuerdo con el artículo 70.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la restauración y el catering a bordo de un buque, avión o tren se entienden prestados en el territorio de aplicación en un transporte de pasajeros dentro de la Comunidad cuyo lugar de inicio:"
  options:
  - id: a
    text:
      es: "se encuentre en otro Estado miembro de la Comunidad."
  - id: b
    text:
      es: "se encuentre en un país tercero con destino a algún punto del territorio de aplicación del impuesto."
  - id: c
    correct: true
    text:
      es: "se encuentre en el territorio de aplicación del impuesto."
  - id: d
    text:
      es: "coincida con el lugar de llegada del transporte."
  explanation:
    es: "La restauración a bordo se localiza en el territorio si el transporte de pasajeros dentro de la Comunidad se inicia en él. Un inicio en otro Estado miembro o en un país tercero, o un trayecto cuyo inicio coincide con su llegada, no cumple la regla."
  citation: "art. 70.Uno.5.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "restauración a bordo"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0131
  prompt:
    es: "¿Cuándo se entienden prestados en el territorio de aplicación del impuesto los restantes servicios de restauración y catering, distintos de los prestados a bordo, según el artículo 70.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Cuando el prestador esté establecido en dicho territorio."
  - id: b
    correct: true
    text:
      es: "Cuando se presten materialmente en dicho territorio."
  - id: c
    text:
      es: "Cuando el destinatario tenga su sede de actividad en dicho territorio."
  - id: d
    text:
      es: "Cuando los alimentos se adquieran a un proveedor establecido en dicho territorio."
  explanation:
    es: "Los demás servicios de restauración y catering se localizan donde se prestan materialmente. No importan la sede del destinatario, el establecimiento del prestador ni el del proveedor de los alimentos."
  citation: "art. 70.Uno.5.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "restauración"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0132
  prompt:
    es: "Conforme al artículo 70.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran prestados en el territorio de aplicación los servicios del artículo 69.Dos con destinatario no empresario que no se entiendan realizados en la Comunidad, Canarias, Ceuta o Melilla, si su utilización o explotación efectivas se realizan:"
  options:
  - id: a
    correct: true
    text:
      es: "en dicho territorio."
  - id: b
    text:
      es: "en cualquier Estado miembro de la Comunidad."
  - id: c
    text:
      es: "en el lugar donde se abone el precio."
  - id: d
    text:
      es: "en el Estado miembro del prestador."
  explanation:
    es: "Si la regla de lugar no los localiza en la Comunidad ni en Canarias, Ceuta o Melilla, el servicio se entiende prestado en el territorio de aplicación cuando su utilización o explotación efectivas se realizan allí. El Estado del prestador, cualquier Estado miembro y el lugar de pago no son el criterio."
  citation: "art. 70.Dos LIVA"
  difficulty: 3
  tags:
  - "lugar de realización"
  - "utilización efectiva"
# anchor: boe-a-1992-28740-art-70
- id: m03-l18-q0161
  prompt:
    es: "De acuerdo con el artículo 70.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, entre los servicios relacionados con bienes inmuebles están el arrendamiento o cesión de uso de dichos bienes y los de alojamiento en establecimientos de:"
  options:
  - id: a
    correct: true
    text:
      es: "hostelería, acampamento y balneario."
  - id: b
    text:
      es: "restauración, catering y transporte de pasajeros."
  - id: c
    text:
      es: "hospitalización, clínicas y centros sanitarios."
  - id: d
    text:
      es: "agencias de viajes y organización de congresos."
  explanation:
    es: "El alojamiento en establecimientos de hostelería, acampamento y balneario es un servicio relacionado con inmuebles y se localiza donde radica el inmueble. La restauración, las agencias de viajes y la hospitalización tienen otras reglas."
  citation: "art. 70.Uno.1.º LIVA"
  difficulty: 1
  tags:
  - "lugar de realización"
  - "alojamiento"
