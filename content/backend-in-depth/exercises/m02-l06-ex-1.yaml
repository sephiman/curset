- id: m02-l06-q01
  prompt:
    en: An access-ordered `LinkedHashMap` evicts its eldest entry beyond 3 entries and receives puts of a, b, c,
      a `get` of a, then a put of d. An insertion-ordered map receives a, b, c, then a again. What is printed?
  options:
  - id: a
    text:
      en: 'access-ordered [b, c, d]

        insertion-ordered [a, b, c]'
  - id: b
    correct: true
    text:
      en: 'access-ordered [c, a, d]

        insertion-ordered [a, b, c]'
  - id: c
    text:
      en: 'access-ordered [c, a, d]

        insertion-ordered [b, c, a]'
  - id: d
    text:
      en: 'access-ordered [b, c, a]

        insertion-ordered [a, b, c]'
  explanation:
    en: The `get` of a makes b the eldest entry, so the put of d removes b and the map prints `access-ordered [c,
      a, d]`, and the second map keeps `insertion-ordered [a, b, c]`. The list `access-ordered [b, c, d]` ignores
      the read of a, but an access moves the entry to the youngest position. The list `insertion-ordered [b, c,
      a]` moves a to the end on re-insertion, but a re-inserted key keeps its place. The list `access-ordered [b,
      c, a]` removes the youngest entry, but the policy removes the eldest.
  citation: javadoc-linkedhashmap#class-linkedhashmap-k-v; javadoc-linkedhashmap#removeEldestEntry(java.util.Map.Entry)
  snippet: m02-l06/LruCache.java
- id: m02-l06-q02
  prompt:
    en: A `PriorityQueue<Integer>` with natural ordering receives 5, then 1, then 3. The program prints the queue
      with its `toString` and then the values removed one by one with `poll`. What is printed?
  options:
  - id: a
    text:
      en: 'queue as printed [1, 3, 5]

        queue polled [1, 3, 5]'
  - id: b
    correct: true
    text:
      en: 'queue as printed [1, 5, 3]

        queue polled [1, 3, 5]'
  - id: c
    text:
      en: 'queue as printed [5, 1, 3]

        queue polled [1, 3, 5]'
  - id: d
    text:
      en: 'queue as printed [1, 5, 3]

        queue polled [5, 3, 1]'
  explanation:
    en: The printed queue follows the heap layout, `queue as printed [1, 5, 3]`, and `poll` returns the least element
      each time, so it prints `queue polled [1, 3, 5]`. The line `queue as printed [1, 3, 5]` assumes a sorted print,
      but the iterator is not guaranteed to traverse the elements in any particular order. The line `queue as printed
      [5, 1, 3]` is the insertion order, but the head of the queue is its least element. The line `queue polled
      [5, 3, 1]` removes the largest first, but with natural ordering the head is the least element.
  citation: javadoc-priorityqueue#class-priorityqueue-e
  snippet: m02-l06/PriorityQueueOrder.java
- id: m02-l06-q04
  prompt:
    en: An iterator flattens the list of lists `[[1, 2], [], [3], []]` by skipping empty inner lists, and another
      iterator flattens `[[], []]`. The program prints the values each one yields. What is printed?
  options:
  - id: a
    text:
      en: 'values [1, 2]

        values of two empty lists []'
  - id: b
    text:
      en: 'values [1, 2, null, 3, null]

        values of two empty lists [null, null]'
  - id: c
    text:
      en: 'values [1, 2, 3]

        values of two empty lists [null]'
  - id: d
    correct: true
    text:
      en: 'values [1, 2, 3]

        values of two empty lists []'
  explanation:
    en: The iterator skips the empty inner lists, so it prints `values [1, 2, 3]` and an empty list for two empty
      inner lists. The list `values [1, 2]` stops at the first empty list, but `hasNext` keeps moving to the next
      inner list while the current one is exhausted. The lists with `null` yield a value for every empty list, but
      an empty list holds no element to yield. The `[null]` result adds an element at the end, but when both iterators
      are exhausted `hasNext` returns false.
  citation: javadoc-iterator#interface-iterator-e
  snippet: m02-l06/NestedIterator.java
- id: m02-l06-q05
  prompt:
    en: In an access-ordered `LinkedHashMap`, which call counts as an access of its entry, so that the entry moves
      in the encounter order?
  options:
  - id: a
    text:
      en: '`containsKey(key)`'
  - id: b
    text:
      en: '`putFirst(key, value)`'
  - id: c
    text:
      en: '`keySet().contains(key)`'
  - id: d
    correct: true
    text:
      en: '`getOrDefault(key, fallback)`'
  explanation:
    en: '`getOrDefault` is one of the methods whose invocation results in an access to the entry. `containsKey`
      is not one of them, because no other methods generate entry accesses. `putFirst` positions the entry explicitly
      and does not generate an access. `keySet().contains(key)` works on a view, and operations on the views do
      not affect the encounter order of the backing map.'
  citation: javadoc-linkedhashmap#class-linkedhashmap-k-v
- id: m02-l06-q06
  prompt:
    en: Which `PriorityQueue` method takes linear time, rather than O(log(n)) time or constant time, in the Java
      implementation note?
  options:
  - id: a
    text:
      en: '`poll()`'
  - id: b
    text:
      en: '`offer(E)`'
  - id: c
    correct: true
    text:
      en: '`contains(Object)`'
  - id: d
    text:
      en: '`peek()`'
  explanation:
    en: '`contains(Object)` is one of the methods with linear time. `poll()` is a dequeuing method with O(log(n))
      time. `offer(E)` is an enqueuing method with O(log(n)) time. `peek()` is a retrieval method with constant
      time.'
  citation: javadoc-priorityqueue#class-priorityqueue-e
- id: m02-l06-q09
  prompt:
    en: In Java 25, an access-ordered `LinkedHashMap` is used as an LRU cache. Which call on it does NOT generate
      an entry access, so the encounter order stays the same?
  options:
  - id: a
    correct: true
    text:
      en: '`lastEntry()`'
  - id: b
    text:
      en: '`get(key)` for a key that is present'
  - id: c
    text:
      en: '`putAll(otherMap)`, for each mapping it copies'
  - id: d
    text:
      en: '`replace(key, newValue)` when the key is present and its value is replaced'
  explanation:
    en: Explicit-positioning methods such as `lastEntry()` do not generate entry accesses. A `get(key)` on a present
      key is wrong, because in an access-ordered map merely querying with `get` is a structural modification. A
      `putAll` call is wrong, because it generates one entry access for each mapping in the specified map. A `replace`
      call that replaces the value is wrong, because the replace methods result in an access of the entry when the
      value is replaced.
  citation: javadoc-linkedhashmap#class-linkedhashmap-k-v
- id: m02-l06-q11
  prompt:
    en: In Redis with LFU eviction, the policy decays the access counter of a key by default. After how much time
      does it decay the counter, unless the user changes the configuration?
  options:
  - id: a
    text:
      en: every ten seconds
  - id: b
    text:
      en: every ten minutes
  - id: c
    correct: true
    text:
      en: every one minute
  - id: d
    text:
      en: every one hour
  explanation:
    en: Redis decays the LFU counter every one minute by default, so the options every ten seconds, every ten minutes
      and every one hour are wrong, because the documentation gives one minute as the default decay period.
  citation: redis-eviction#lfu-eviction
  extract:
    en: Decay the counter every one minute.
