  tags:
  - "concepto"
# anchor: fuente-ms-word-combinar-correspondencia-html
- id: m06-l04-q135
  prompt:
    es: "Según la página de Microsoft sobre la combinación de correspondencia de Word 365, ¿cuál es el primer paso para configurarla?"
  options:
  - id: a
    text:
      es: "Insertar los campos de combinación en el documento principal de Word"
  - id: b
    text:
      es: "Imprimir una vista previa de cada documento combinado"
  - id: c
    correct: true
    text:
      es: "Seleccionar el origen de datos que se usará para la información personalizada"
  - id: d
    text:
      es: "Elegir el tipo de documento que se va a combinar y enviar"
  explanation:
    es: "La página dice: «El primer paso para configurar la combinación de correspondencia consiste en seleccionar el origen de datos que usará para la información personalizada». Insertar los campos de combinación en el documento principal es lo que la página describe después, al trabajar en el documento principal con un origen ya asociado. Imprimir una vista previa no es un paso de configuración que la página cite al empezar. Y elegir el tipo de documento figura en una sección posterior de la página, «Tipos de documentos», que sigue a «Orígenes de datos»."
  citation: "fuente: `ms-word-combinar-correspondencia.html`; «Orígenes de datos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-combinar-correspondencia-html
- id: m06-l04-q136
  prompt:
    es: "¿Qué admite Word 365 como origen de datos de una combinación de correspondencia, además de hojas de Excel y contactos de Outlook?"
  options:
  - id: a
    text:
      es: "Únicamente las bases de datos creadas con Microsoft Access"
  - id: b
    text:
      es: "Solo documentos de Word que ya se hayan combinado antes"
  - id: c
    text:
      es: "Ninguna base de datos, solo listas de contactos de Outlook"
  - id: d
    correct: true
    text:
      es: "Cualquier base de datos que se pueda conectar a Word"
  explanation:
    es: "La página dice que las hojas de Excel y los contactos de Outlook son los orígenes más comunes, «pero se puede usar cualquier base de datos que se pueda conectar a Word». Limitarlo a las bases de datos de Access contradice ese «cualquier». Limitarlo a documentos de Word ya combinados tampoco cabe: la página habla de listas, hojas de cálculo o bases de datos como orígenes asociados al documento. Y decir que ninguna base de datos, solo contactos de Outlook, contradice la misma frase, que cita Excel como origen más común junto a Outlook y admite bases de datos."
  citation: "fuente: `ms-word-combinar-correspondencia.html`; «Orígenes de datos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-combinar-correspondencia-html
- id: m06-l04-q137
  prompt:
    es: "En la combinación de correspondencia de Word 365, ¿cuál de los siguientes tipos de documento envía el correo directamente desde Word, con la dirección de cada destinatario como única en la línea Para?"
  options:
  - id: a
    correct: true
    text:
      es: "Correo electrónico"
  - id: b
    text:
      es: "Cartas"
  - id: c
    text:
      es: "Sobres o etiquetas"
  - id: d
    text:
      es: "Directorio"
  explanation:
    es: "La página dice: «Correo electrónico en el que la dirección de cada destinatario es la única dirección en la línea Para. Se enviará el correo electrónico directamente desde Word». En las cartas, cada una se imprime en una hoja de papel separada. En los sobres o etiquetas, los nombres y las direcciones provienen del origen de datos. El directorio muestra un lote de información para cada elemento del origen de datos."
  citation: "fuente: `ms-word-combinar-correspondencia.html`; «Tipos de documentos»"
  difficulty: 2
  tags:
  - "concepto"
