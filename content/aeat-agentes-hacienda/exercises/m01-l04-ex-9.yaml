# anchor: celex-12016m-txt-art-14
- id: m01-l04-q0176
  prompt:
    es: "¿Cuál de los siguientes cargos elige el Parlamento Europeo, que además ejerce con el Consejo la función legislativa y la presupuestaria, según el artículo 14.1 del Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Presidente de la Comisión."
  - id: b
    text:
      es: "Presidente del Consejo Europeo."
  - id: c
    text:
      es: "Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad."
  - id: d
    text:
      es: "Presidente del Tribunal de Justicia."
  explanation:
    es: "El Parlamento Europeo elige al Presidente de la Comisión. El Presidente del Consejo Europeo lo elige el propio Consejo Europeo. El Alto Representante lo nombra el Consejo Europeo y el Presidente del Tribunal de Justicia lo eligen los jueces."
  citation: "art. 14.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-231
- id: m01-l04-q0179
  prompt:
    es: "Según el artículo 231 del Tratado de Funcionamiento de la Unión Europea, salvo disposición en contrario de los Tratados, el Parlamento Europeo decidirá por mayoría de los votos emitidos, y su reglamento interno fijará:"
  options:
  - id: a
    text:
      es: "La sede de sus períodos de sesiones."
  - id: b
    correct: true
    text:
      es: "El quórum."
  - id: c
    text:
      es: "El número de sus diputados."
  - id: d
    text:
      es: "La mayoría para aprobar una moción de censura."
  explanation:
    es: "El reglamento interno del Parlamento fija el quórum. La sede la establece el Protocolo sobre las sedes de las instituciones. El número de diputados lo fija una decisión del Consejo Europeo conforme al artículo 14.2 del Tratado de la Unión Europea. La mayoría de la moción de censura la fija el propio artículo 234."
  citation: "art. 231 TFUE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: celex-12016e-txt-art-250
- id: m01-l04-q0186
  prompt:
    es: "Según el artículo 250 del Tratado de Funcionamiento de la Unión Europea, ¿por qué mayoría se adoptan los acuerdos de la Comisión?"
  options:
  - id: a
    text:
      es: "Por mayoría de los votos emitidos."
  - id: b
    text:
      es: "Por mayoría cualificada de sus miembros."
  - id: c
    correct: true
    text:
      es: "Por mayoría de sus miembros."
  - id: d
    text:
      es: "Por consenso de todos sus miembros."
  explanation:
    es: "El artículo 250 TFUE dice que «los acuerdos de la Comisión se adoptarán por mayoría de sus miembros» y que su reglamento interno fija el quórum. La mayoría de los votos emitidos es la regla del Parlamento Europeo (art. 231 TFUE). La mayoría cualificada es la del Consejo (art. 16.3 TUE) y el consenso la del Consejo Europeo (art. 15.4 TUE)."
  citation: "art. 250 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016m-txt-art-17
- id: m01-l04-q0188
  prompt:
    es: "Señale la función que corresponde a la Comisión, de acuerdo con el artículo 17.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Garantizar el respeto del Derecho en la interpretación y aplicación de los Tratados."
  - id: b
    text:
      es: "Definir las orientaciones y prioridades políticas generales de la Unión."
  - id: c
    text:
      es: "Ejercer la función legislativa conjuntamente con el Parlamento Europeo."
  - id: d
    correct: true
    text:
      es: "Ejecutar el presupuesto y gestionar los programas."
  explanation:
    es: "La Comisión ejecuta el presupuesto y gestiona los programas. Garantizar el respeto del Derecho en la interpretación de los Tratados es función del Tribunal de Justicia. Definir las orientaciones y prioridades políticas generales corresponde al Consejo Europeo. La función legislativa la ejerce conjuntamente con el Parlamento el Consejo."
  citation: "art. 17.1 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-244
- id: m01-l04-q0192
  prompt:
    es: "Señale quién establece el sistema de rotación por el que se eligen los miembros de la Comisión, de acuerdo con el artículo 244 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Consejo, por mayoría cualificada."
  - id: b
    text:
      es: "El Parlamento Europeo, por mayoría de los miembros que lo componen."
  - id: c
    correct: true
    text:
      es: "El Consejo Europeo, por unanimidad."
  - id: d
    text:
      es: "La Comisión, por mayoría de sus miembros."
  explanation:
    es: "El sistema de rotación lo establece el Consejo Europeo por unanimidad. No lo fijan el Consejo por mayoría cualificada, ni el Parlamento por mayoría de sus miembros, ni la Comisión por mayoría de sus miembros."
  citation: "art. 244 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: celex-12016m-txt-art-17
- id: m01-l04-q0193
  prompt:
    es: "Según el artículo 17.5 del Tratado de la Unión Europea, los miembros de la Comisión serán seleccionados de entre los nacionales de los Estados miembros mediante un sistema de:"
  options:
  - id: a
    text:
      es: "Elección por el Parlamento Europeo entre los candidatos de cada Estado."
  - id: b
    correct: true
    text:
      es: "Rotación estrictamente igual entre los Estados miembros."
  - id: c
    text:
      es: "Designación libre por el Presidente de la Comisión."
  - id: d
    text:
      es: "Sorteo entre los Estados que no hayan tenido comisario."
  explanation:
    es: "La selección sigue un sistema de rotación estrictamente igual entre los Estados miembros. El Parlamento no elige a cada miembro, solo aprueba colegiadamente la Comisión. El Presidente tampoco los designa libremente y el artículo no prevé sorteo alguno."
  citation: "art. 17.5 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: celex-12016m-txt-art-17
- id: m01-l04-q0195
  prompt:
    es: "Conforme al artículo 17.6 del Tratado de la Unión Europea, un miembro de la Comisión presentará su dimisión si se lo pide:"
  options:
  - id: a
    text:
      es: "El Parlamento Europeo."
  - id: b
    text:
      es: "El Consejo Europeo."
  - id: c
    text:
      es: "El Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad."
  - id: d
    correct: true
    text:
      es: "El Presidente de la Comisión."
  explanation:
    es: "La dimisión individual la pide el Presidente de la Comisión. El Parlamento solo puede votar una moción de censura contra toda la Comisión. El Consejo Europeo y el Alto Representante no tienen esa facultad."
  citation: "art. 17.6 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: celex-12016m-txt-art-19
- id: m01-l04-q0200
  prompt:
    es: "¿Cuál de las siguientes recoge los órganos que comprende el Tribunal de Justicia de la Unión Europea según el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "El Tribunal de Justicia, el Tribunal General y los tribunales especializados."
  - id: b
    text:
      es: "El Tribunal de Justicia, el Tribunal General y el Tribunal de Cuentas."
  - id: c
    text:
      es: "El Tribunal de Justicia y el Tribunal General, sin tribunales especializados."
  - id: d
    text:
      es: "El Tribunal de Justicia, el Tribunal General y los tribunales constitucionales nacionales."
  explanation:
    es: "El artículo 19.1 TUE dice que el Tribunal de Justicia de la Unión Europea «comprenderá el Tribunal de Justicia, el Tribunal General y los tribunales especializados». El Tribunal de Cuentas es otra institución (art. 13.1 TUE). Los tribunales especializados sí forman parte. Los tribunales nacionales no forman parte de la institución."
  citation: "art. 19.1 TUE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: fuente-curia-tribunal-de-justicia-html
- id: m01-l04-q0202
  prompt:
    es: "A fecha de 16 de octubre de 2026, ¿con cuántos jueces y abogados generales cuenta el Tribunal de Justicia, según su página de presentación en la web de la Curia?"
  options:
  - id: a
    text:
      es: "Con 27 jueces y 8 abogados generales."
  - id: b
    text:
      es: "Con 54 jueces y 11 abogados generales."
  - id: c
    text:
      es: "Con 28 jueces y 11 abogados generales."
  - id: d
    correct: true
    text:
      es: "Con 27 jueces y 11 abogados generales."
  explanation:
    es: "La página de presentación del Tribunal de Justicia en la Curia, consultada el 16-10-2026, dice que «cuenta con 27 Jueces y 11 Abogados Generales». Ocho es el número de abogados generales que fija el artículo 252 TFUE, no la cifra de la página. Cincuenta y cuatro son los jueces del Tribunal General. Veintiocho no es la cifra de la página."
  citation: "fuente: `curia-tribunal-de-justicia.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016e-txt-art-253
- id: m01-l04-q0203
  prompt:
    es: "De acuerdo con el artículo 253 del Tratado de Funcionamiento de la Unión Europea, los jueces y abogados generales del Tribunal de Justicia serán designados de común acuerdo por los Gobiernos de los Estados miembros:"
  options:
  - id: a
    correct: true
    text:
      es: "Por un período de seis años, con una renovación parcial cada tres años."
  - id: b
    text:
      es: "Por un período de seis años, con una renovación total al término de ese período."
  - id: c
    text:
      es: "Por un período de nueve años, con una renovación parcial cada tres años."
  - id: d
    text:
      es: "Por un período de cinco años, coincidente con la legislatura del Parlamento Europeo."
  explanation:
    es: "El artículo 253 TFUE dice que se designan «por un período de seis años» y que «cada tres años tendrá lugar una renovación parcial de los jueces y abogados generales». La renovación no es total. Nueve años cambia el período. Cinco años es el mandato de los diputados (art. 14.3 TUE) y de la Comisión (art. 17.3 TUE)."
  citation: "art. 253 TFUE"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: fuente-curia-tribunal-general-html
- id: m01-l04-q0204
  prompt:
    es: "A fecha de 16 de octubre de 2026, según su página de presentación en la web de la Curia, el Tribunal General cuenta con:"
  options:
  - id: a
    text:
      es: "27 jueces, uno por cada Estado miembro."
  - id: b
    correct: true
    text:
      es: "54 jueces, dos por cada Estado miembro."
  - id: c
    text:
      es: "81 jueces, tres por cada Estado miembro."
  - id: d
    text:
      es: "28 jueces, uno por cada Estado miembro más su Presidente."
  explanation:
    es: "La página de presentación del Tribunal General en la Curia, consultada el 16-10-2026, dice que «cuenta con 54 Jueces, dos por cada Estado miembro». Veintisiete jueces, uno por Estado, es la composición del Tribunal de Justicia y el mínimo que exige el artículo 19.2 TUE para el Tribunal General. Ochenta y uno y veintiocho no son cifras de la página."
  citation: "fuente: `curia-tribunal-general.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016e-pro-03-art-50-ter
- id: m01-l04-q0205
  prompt:
    es: "De acuerdo con el artículo 50 ter del Estatuto del Tribunal de Justicia de la Unión Europea, el Tribunal General conoce de las peticiones de decisión prejudicial comprendidas exclusivamente en materias como:"
  options:
  - id: a
    text:
      es: "La interpretación de la Carta de los Derechos Fundamentales de la Unión Europea."
  - id: b
    text:
      es: "Los principios generales del Derecho de la Unión y el Derecho internacional público."
  - id: c
    correct: true
    text:
      es: "El sistema común del impuesto sobre el valor añadido y el código aduanero."
  - id: d
    text:
      es: "La interpretación del Derecho primario de la Unión."
  explanation:
    es: "El artículo 50 ter del Estatuto enumera, entre las materias del Tribunal General, «el sistema común del impuesto sobre el valor añadido» y «el código aduanero». La Carta, los principios generales, el Derecho internacional público y el Derecho primario son justo las cuestiones independientes de interpretación para las que «el Tribunal de Justicia seguirá siendo competente»."
  citation: "art. 50 ter Estatuto del Tribunal de Justicia de la Unión Europea, Protocolo n.º 3"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: celex-12016e-txt-art-258
- id: m01-l04-q0206
  prompt:
    es: "De acuerdo con el artículo 258 del Tratado de Funcionamiento de la Unión Europea, si la Comisión estima que un Estado miembro ha incumplido una de las obligaciones que le incumben en virtud de los Tratados:"
  options:
  - id: a
    text:
      es: "Podrá imponerle directamente una multa coercitiva, sin necesidad de recurrir al Tribunal de Justicia de la Unión Europea."
  - id: b
    text:
      es: "Emitirá una recomendación y, si el Estado no la sigue en tres meses, el Consejo podrá recurrir al Tribunal de Justicia."
  - id: c
    text:
      es: "Deberá someter el asunto al Consejo Europeo, que decidirá por unanimidad sobre el incumplimiento."
  - id: d
    correct: true
    text:
      es: "Emitirá un dictamen motivado y, si el Estado no se atiene a él en el plazo que determine, podrá recurrir al Tribunal de Justicia de la Unión Europea."
  explanation:
    es: "El artículo 258 TFUE dice que la Comisión «emitirá un dictamen motivado» y que, si el Estado «no se atuviere a este dictamen en el plazo determinado por la Comisión, ésta podrá recurrir al Tribunal de Justicia de la Unión Europea». La Comisión no impone multas por sí misma: solo propone su importe en el procedimiento del artículo 260.2 TFUE. Lo que emite es un dictamen, no una recomendación, y recurre ella, no el Consejo. El Consejo Europeo no interviene."
  citation: "art. 258 TFUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-263
- id: m01-l04-q0207
  prompt:
    es: "Según el artículo 263 del Tratado de Funcionamiento de la Unión Europea, ¿en qué plazo deberá interponerse el recurso de anulación?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de dos meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: b
    text:
      es: "En el plazo de un mes desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: c
    text:
      es: "En el plazo de tres meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: d
    text:
      es: "En el plazo de seis meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  explanation:
    es: "El artículo 263 TFUE dice que los recursos «deberán interponerse en el plazo de dos meses a partir, según los casos, de la publicación del acto, de su notificación al recurrente o, a falta de ello, desde el día en que éste haya tenido conocimiento del mismo». Uno, tres y seis meses no son el plazo del artículo. Tres meses es el plazo de la Comisión para emitir dictamen en el recurso entre Estados (art. 259 TFUE)."
  citation: "art. 263 TFUE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-12016m-txt-art-19
- id: m01-l04-q0209
  prompt:
    es: "Según el artículo 19.2 del Tratado de la Unión Europea, el Tribunal de Justicia estará compuesto, y estará asistido por abogados generales, por:"
  options:
  - id: a
    correct: true
    text:
      es: "Un juez por Estado miembro."
  - id: b
    text:
      es: "Dos jueces por Estado miembro."
  - id: c
    text:
      es: "Un juez por cada dos Estados miembros."
  - id: d
    text:
      es: "Un número de jueces fijado por el Consejo Europeo."
  explanation:
    es: "El Tribunal de Justicia se compone de un juez por Estado miembro. Los dos jueces por Estado no son la regla del Tribunal de Justicia, ni un juez por cada dos Estados, ni un número que fije el Consejo Europeo."
  citation: "art. 19.2 TUE"
  difficulty: 2
  tags:
  - "composición"
# anchor: celex-12016m-txt-art-19
- id: m01-l04-q0210
  prompt:
    es: "De acuerdo con el artículo 19.2 del Tratado de la Unión Europea, el Tribunal General, que forma parte del Tribunal de Justicia de la Unión Europea, dispondrá de jueces en la siguiente proporción:"
  options:
  - id: a
    text:
      es: "Como máximo un juez por Estado miembro."
  - id: b
    text:
      es: "Un juez por cada dos Estados miembros."
  - id: c
    text:
      es: "Un número de jueces fijado cada tres años por el Consejo."
  - id: d
    correct: true
    text:
      es: "Al menos un juez por Estado miembro."
  explanation:
    es: "El Tribunal General dispone al menos de un juez por Estado miembro. El número exacto lo fija el Estatuto del Tribunal de Justicia, según el artículo 254 del Tratado de Funcionamiento. Un máximo de un juez, un juez por cada dos Estados o un número fijado por el Consejo cada tres años no figuran en el artículo."
  citation: "art. 19.2 TUE"
  difficulty: 2
  tags:
  - "composición"
# anchor: celex-12016e-txt-art-253
- id: m01-l04-q0212
  prompt:
    es: "Según el artículo 253 del Tratado de Funcionamiento de la Unión Europea, los jueces y los abogados generales salientes del Tribunal de Justicia podrán ser:"
  options:
  - id: a
    text:
      es: "Designados de nuevo solo una vez."
  - id: b
    correct: true
    text:
      es: "Nuevamente designados."
  - id: c
    text:
      es: "Designados de nuevo solo tras un período de seis años."
  - id: d
    text:
      es: "Excluidos de toda nueva designación."
  explanation:
    es: "Los salientes pueden ser nuevamente designados, sin límite de veces ni plazo de espera. La opción de una sola vez, la de esperar seis años y la de exclusión añaden restricciones que el artículo no establece."
  citation: "art. 253 TFUE"
  difficulty: 3
  tags:
  - "plazo"
# anchor: celex-12016e-txt-art-253
- id: m01-l04-q0213
  prompt:
    es: "Según el Tratado de Funcionamiento de la Unión Europea, ¿quién elige al Presidente del Tribunal de Justicia de la Unión Europea por un período de tres años, renovable?"
  options:
  - id: a
    correct: true
    text:
      es: "Los jueces, de entre ellos."
  - id: b
    text:
      es: "Los Gobiernos de los Estados miembros, de común acuerdo."
  - id: c
    text:
      es: "El Consejo Europeo, por mayoría cualificada."
  - id: d
    text:
      es: "El Parlamento Europeo, por mayoría de los votos emitidos."
  explanation:
    es: "Los jueces eligen de entre ellos al Presidente, por tres años renovables. Los Gobiernos de los Estados miembros designan a los jueces, pero no eligen al Presidente. El Consejo Europeo y el Parlamento tampoco intervienen."
  citation: "art. 253 TFUE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: celex-12016e-txt-art-254
- id: m01-l04-q0215
  prompt:
    es: "Señale quién fija el número de jueces del Tribunal General, de acuerdo con el artículo 254 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad."
  - id: b
    text:
      es: "Los Gobiernos de los Estados miembros, de común acuerdo."
  - id: c
    correct: true
    text:
      es: "El Estatuto del Tribunal de Justicia de la Unión Europea."
  - id: d
    text:
      es: "El Reglamento de Procedimiento del Tribunal General."
  explanation:
    es: "El número de jueces del Tribunal General lo fija el Estatuto del Tribunal de Justicia de la Unión Europea. No lo fijan el Consejo Europeo, ni los Gobiernos, que solo designan a los jueces, ni el Reglamento de Procedimiento del propio Tribunal."
  citation: "art. 254 TFUE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: celex-12016e-txt-art-254
- id: m01-l04-q0216
  prompt:
    es: "Conforme al artículo 254 del Tratado de Funcionamiento de la Unión Europea, los miembros del Tribunal General serán designados por un período de seis años y, cada tres años, tendrá lugar:"
  options:
  - id: a
    text:
      es: "Una renovación total."
  - id: b
    correct: true
    text:
      es: "Una renovación parcial."
  - id: c
    text:
      es: "Una elección de su Presidente por los Gobiernos."
  - id: d
    text:
      es: "Una ampliación del número de jueces."
  explanation:
    es: "Cada tres años hay una renovación parcial del Tribunal General. No se renueva entero, su Presidente lo eligen los jueces y el número de jueces lo fija el Estatuto."
  citation: "art. 254 TFUE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-12016e-txt-art-256
- id: m01-l04-q0219
  prompt:
    es: "¿Cuál de las siguientes normas determina las materias específicas en las que el Tribunal General conoce de cuestiones prejudiciales planteadas en virtud del artículo 267, según el artículo 256.3 del Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Reglamento interno del Consejo."
  - id: b
    text:
      es: "El Reglamento del Parlamento."
  - id: c
    correct: true
    text:
      es: "El Estatuto del Tribunal de Justicia."
  - id: d
    text:
      es: "El Reglamento de la Comisión."
  explanation:
    es: "Las materias específicas las determina el Estatuto del Tribunal de Justicia de la Unión Europea. No las fijan el reglamento interno del Consejo, el del Parlamento ni el de la Comisión, que regulan el funcionamiento de cada una de esas instituciones."
  citation: "art. 256.3 TFUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016e-pro-03-art-50-ter
- id: m01-l04-q0220
  prompt:
    es: "Según el artículo 50 ter del Estatuto del Tribunal de Justicia de la Unión Europea, ¿cuál de las siguientes materias es una de aquellas en las que el Tribunal General conoce de peticiones de decisión prejudicial?"
  options:
  - id: a
    text:
      es: "La protección de los datos personales."
  - id: b
    correct: true
    text:
      es: "El régimen de comercio de derechos de emisión de gases de efecto invernadero."
  - id: c
    text:
      es: "El derecho de asilo."
  - id: d
    text:
      es: "La libre circulación de trabajadores."
  explanation:
    es: "El régimen de comercio de derechos de emisión de gases de efecto invernadero figura entre las materias del artículo 50 ter. La protección de datos, el derecho de asilo y la libre circulación de trabajadores no están en la lista."
