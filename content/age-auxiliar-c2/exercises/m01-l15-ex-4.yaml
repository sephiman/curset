# anchor: boe-a-2003-21614-art-38
- id: m01-l15-q009
  prompt:
    es: "De acuerdo con el artículo 38.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, si la Ley de Presupuestos Generales del Estado no se aprobara antes del primer día del ejercicio económico correspondiente, se prorrogan automáticamente:"
  options:
  - id: a
    text:
      es: "Los presupuestos definitivos del ejercicio anterior, con sus modificaciones, hasta la aprobación y publicación de los nuevos en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, durante un máximo de seis meses desde el primer día del ejercicio."
  - id: c
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, hasta que el Consejo de Ministros apruebe un presupuesto provisional."
  - id: d
    correct: true
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, hasta la aprobación y publicación de los nuevos en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 38.1 LGP dice que, si la Ley de Presupuestos no se aprueba antes del primer día del ejercicio, «se considerarán automáticamente prorrogados los presupuestos iniciales del ejercicio anterior hasta la aprobación y publicación de los nuevos en el \"Boletín Oficial del Estado\"». Los presupuestos definitivos con sus modificaciones no son los prorrogados: el apartado dice «iniciales». El tope de seis meses contradice «hasta la aprobación y publicación de los nuevos». El presupuesto provisional del Consejo de Ministros tampoco: según el apartado 4, el Consejo solo acuerda, a propuesta de Hacienda, los criterios para instrumentar la prórroga."
  citation: "art. 38.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-38
- id: m01-l15-q011
  prompt:
    es: "Según el artículo 38.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la estructura orgánica del presupuesto prorrogado se adaptará:"
  options:
  - id: a
    text:
      es: "Con una reducción de la cuantía total fijada por el Gobierno, a la organización administrativa vigente en el ejercicio anterior."
  - id: b
    text:
      es: "Sin alteración de la cuantía total, a la organización administrativa que tuviera el ejercicio cuyos presupuestos se prorrogan."
  - id: c
    text:
      es: "Con un incremento de la cuantía total igual al crecimiento del producto interior bruto, a la organización en vigor."
  - id: d
    correct: true
    text:
      es: "Sin alteración de la cuantía total, a la organización administrativa en vigor en el ejercicio en que deba ejecutarse."
  explanation:
    es: "El artículo 38.3 adapta la estructura orgánica a la organización administrativa en vigor en el ejercicio de ejecución, sin alterar la cuantía total. Reducir la cuantía o incrementarla con el producto interior bruto altera el total, y el artículo lo prohíbe. La opción que conserva la organización del ejercicio prorrogado mantiene la cuantía, pero fija la organización de otro ejercicio y no la del ejercicio de ejecución."
  citation: "art. 38.3 LGP"
  difficulty: 3
  tags:
  - "efecto"
  - "estructura"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q029
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿mediante qué instrumento se establece el procedimiento por el cual se regirá la elaboración de los Presupuestos Generales del Estado?"
  options:
  - id: a
    text:
      es: "Mediante acuerdo de la Comisión de Políticas de Gasto."
  - id: b
    text:
      es: "Mediante instrucción de la Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "Mediante orden del Ministro de Hacienda."
  - id: d
    text:
      es: "Mediante circular de la Subsecretaría de Hacienda."
  explanation:
    es: "El artículo 36.2 establece el procedimiento de elaboración por orden del Ministro de Hacienda. La Comisión de Políticas de Gasto, la Dirección General de Presupuestos y la Subsecretaría intervienen en el proceso, pero ninguna fija el procedimiento mediante acuerdo, instrucción o circular."
  citation: "art. 36.2 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q030
  prompt:
    es: "Según el artículo 36.2, norma primera, de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién determina las directrices para la distribución del gasto en la elaboración de los presupuestos?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "El Ministro de Hacienda."
  - id: d
    text:
      es: "La Subsecretaría de Hacienda."
  explanation:
    es: "La norma primera del artículo 36.2 dice que las directrices, con los criterios de elaboración de las propuestas y sus límites cuantitativos, las determina el Ministro de Hacienda. El Consejo de Ministros es un órgano de nivel superior que no las fija, y la Dirección General de Presupuestos y la Subsecretaría son órganos inferiores."
  citation: "art. 36.2, norma primera, LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q031
  prompt:
    es: "De acuerdo con el artículo 36.2, norma primera, de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la composición de la Comisión de Políticas de Gasto se determinará:"
  options:
  - id: a
    text:
      es: "Por acuerdo del Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "Por orden del Ministro de Hacienda."
  - id: c
    text:
      es: "Por instrucción de la Subsecretaría de Hacienda."
  - id: d
    text:
      es: "Por la Ley de Presupuestos Generales del Estado de cada año."
  explanation:
    es: "La norma primera del artículo 36.2 dice que se constituirá la Comisión de Políticas de Gasto, «cuya composición se determinará por orden del Ministro de Hacienda». El acuerdo del Consejo de Ministros no es el instrumento que fija esa frase, que encarga la composición a una orden del Ministro de Hacienda. La Ley de Presupuestos Generales del Estado de cada año tampoco: el propio apartado 2 dice que el procedimiento de elaboración de los Presupuestos «se establecerá por orden del Ministro de Hacienda». Una instrucción de la Subsecretaría de Hacienda no es la orden del Ministro de Hacienda que exige la norma primera."
  citation: "art. 36.2, norma primera, LGP"
  difficulty: 3
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q032
  prompt:
    es: "¿Qué comisión se constituye, conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria, para determinar las directrices de distribución del gasto en la elaboración del presupuesto?"
  options:
  - id: a
    correct: true
    text:
      es: "La Comisión de Políticas de Gasto."
  - id: b
    text:
      es: "La Comisión de Análisis de Programas."
  - id: c
    text:
      es: "La Comisión Delegada del Gobierno para Asuntos Económicos."
  - id: d
    text:
      es: "La Comisión de Presupuestos del Congreso de los Diputados."
  explanation:
    es: "Para las directrices de distribución del gasto se constituye la Comisión de Políticas de Gasto. La Comisión de Análisis de Programas estudia los programas de gasto con cada departamento (art. 4.2 de la Orden HAC/557/2026). La Comisión Delegada del Gobierno y la Comisión de Presupuestos del Congreso son órganos ajenos al procedimiento de elaboración que regula ese artículo."
  citation: "art. 36.2, norma primera, LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q033
  prompt:
    es: "Según el artículo 36.2, norma tercera, de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las propuestas de presupuesto de gastos se acompañarán, para cada programa, de:"
  options:
  - id: a
    text:
      es: "Un balance de resultados y un informe de gestión."
  - id: b
    text:
      es: "Un informe de impacto de género del programa."
  - id: c
    text:
      es: "Un anexo plurianual con su clasificación territorial."
  - id: d
    correct: true
    text:
      es: "Su correspondiente memoria de objetivos anuales."
  explanation:
    es: "La norma tercera exige acompañar cada programa de su memoria de objetivos anuales, fijados conforme al programa plurianual. El balance de resultados y el informe de gestión se formulan al cerrar el ejercicio (art. 71). El informe de impacto de género y el anexo de inversión con su clasificación territorial acompañan al proyecto de ley (art. 37.2), no a cada programa."
  citation: "art. 36.2, norma tercera, LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q034
  prompt:
    es: "Según el artículo 36.5 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde al Ministro de Hacienda, respecto del anteproyecto de la Ley de Presupuestos Generales del Estado:"
  options:
  - id: a
    text:
      es: "Remitirlo directamente al Congreso de los Diputados."
  - id: b
    text:
      es: "Someterlo a dictamen del Consejo de Estado."
  - id: c
    text:
      es: "Presentarlo al Pleno del Congreso para su enmienda."
  - id: d
    correct: true
    text:
      es: "Elevarlo al acuerdo del Gobierno."
  explanation:
    es: "El artículo 36.5 LGP dice: «Corresponderá al Ministro de Hacienda elevar al acuerdo del Gobierno el anteproyecto de la Ley de Presupuestos Generales del Estado». Remitirlo directamente al Congreso se salta ese acuerdo, y el artículo 134.3 CE dice que es el Gobierno quien presenta los Presupuestos ante el Congreso. Presentarlo al Pleno del Congreso para su enmienda también es un paso posterior a la presentación por el Gobierno, y no es de un Ministro. El dictamen del Consejo de Estado no es el paso que el apartado asigna al Ministro: el apartado dice elevar al acuerdo del Gobierno."
  citation: "art. 36.5 LGP"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q035
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién eleva al acuerdo del Gobierno el anteproyecto de la Ley de Presupuestos Generales del Estado?"
  options:
  - id: a
    text:
      es: "El Director General de Presupuestos."
  - id: b
    correct: true
    text:
      es: "El Ministro de Hacienda."
  - id: c
    text:
      es: "El Subsecretario de Hacienda."
  - id: d
    text:
      es: "El Director General del Tesoro y Política Financiera."
  explanation:
    es: "El artículo 36.5 atribuye esa tarea al Ministro de Hacienda. El Director General de Presupuestos, el Subsecretario y el Director General del Tesoro son cargos inferiores a los que el artículo no atribuye esa función."
  citation: "art. 36.5 LGP"
  difficulty: 1
  tags:
  - "órgano"
