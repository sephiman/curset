# anchor: boe-a-2017-12902-art-158
- id: m03-l04-q116
  prompt:
    es: "Según el artículo 158.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en cuánto se amplían los plazos de adjudicación del procedimiento abierto si hay que seguir el trámite de ofertas anormalmente bajas?"
  options:
  - id: a
