  - id: d
    text:
      es: "La Secretaría General de Administración Digital."
  explanation:
    es: "La creación exige informe favorable de la Comisión Ministerial de Administración Digital respectiva y posterior comunicación a dos ministerios. La Secretaría General de Administración Digital, la Subsecretaría y el Consejo de Ministros no intervienen con ese informe."
