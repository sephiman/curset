# anchor: boe-a-2006-20764-art-39
- id: m03-l15-q0234
  prompt:
    es: "En 2026 la Administración descubre que Javier Sola es titular de un depósito de 20.000 euros que no se corresponde con la renta ni el patrimonio declarados. Javier prueba suficientemente que es titular del depósito desde una fecha anterior a la del período de prescripción. Según el artículo 39 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se trata?"
  options:
  - id: a
    correct: true
    text:
      es: "No se integra como ganancia patrimonial no justificada, por la prueba aportada sobre la titularidad anterior al período de prescripción."
  - id: b
    text:
      es: "Se integra en la base liquidable del ahorro de 2026, porque se descubre ese año."
  - id: c
    text:
      es: "Se integra en el período impositivo en que se adquirió el depósito, porque es el de la titularidad."
  - id: d
    text:
      es: "Se integra en la base liquidable general de 2026, porque no se admite prueba de titularidad anterior."
  explanation:
    es: "La regla de integración cede si el contribuyente prueba suficientemente que es titular desde una fecha anterior a la del período de prescripción (art. 39 LIRPF). Se admite prueba, y por eso no se integra. Si no la hubiera, iría a la base general, no a la del ahorro, y no al período de adquisición."
  citation: "art. 39 LIRPF"
  difficulty: 3
  tags:
  - "supuesto"
  - "no justificadas"
# anchor: boe-a-2006-20764-art-21
- id: m03-l15-q0238
  prompt:
    es: "¿Cómo tributa, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la renta derivada de la transmisión de la titularidad de unas acciones que el contribuyente poseía, salvo que la ley la califique como rendimiento del capital?"
  options:
  - id: a
    correct: true
    text:
      es: "Como ganancia o pérdida patrimonial."
  - id: b
    text:
      es: "Como rendimiento del capital mobiliario."
  - id: c
    text:
      es: "Como renta no sujeta al impuesto."
  - id: d
    text:
      es: "Como rendimiento del trabajo."
  explanation:
    es: "Las rentas de la transmisión de la titularidad de elementos patrimoniales tributan como ganancias o pérdidas patrimoniales (art. 21.1 LIRPF). No son capital mobiliario salvo que la ley lo establezca, ni trabajo, y no quedan fuera del impuesto."
  citation: "art. 21.1 LIRPF"
  difficulty: 1
  tags:
  - "ganancias y pérdidas"
  - "calificación"
# anchor: boe-a-2006-20764-art-39
