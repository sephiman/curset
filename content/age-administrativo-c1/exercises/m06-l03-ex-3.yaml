# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q052
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué combinación de teclas crea una carpeta nueva, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Ctrl+U"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+N"
  - id: c
    text:
      es: "Ctrl+Mayús+E"
  - id: d
    text:
      es: "Ctrl+T"
  explanation:
    es: "La tabla del Explorador asigna a Ctrl+Mayús+N «Cree una carpeta nueva». Ctrl+U abre una nueva ventana, Ctrl+T abre una pestaña nueva y Ctrl+Mayús+E expande todas las carpetas del árbol del panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
