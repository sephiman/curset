# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0176
  prompt:
    es: "Según el artículo 174.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién corresponde la competencia para iniciar el procedimiento de declaración de responsabilidad y para dictar el acto administrativo de declaración de responsabilidad?"
  options:
  - id: a
    text:
      es: "Al Tribunal Económico-Administrativo Regional."
  - id: b
    text:
      es: "Al órgano de gestión tributaria competente para la liquidación."
  - id: c
    text:
      es: "Al órgano de inspección que practicó la liquidación."
  - id: d
    correct: true
    text:
      es: "Al órgano de recaudación."
  explanation:
    es: "La competencia es del órgano de recaudación, tanto para iniciar el procedimiento como para dictar el acto de declaración (art. 174.2 LGT). No es la del órgano que liquidó, ya sea de inspección o de gestión, ni la de un tribunal económico-administrativo, que resuelve las reclamaciones contra el acto."
  citation: "art. 174.2 LGT"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-124
- id: m03-l12-q0177
  prompt:
    es: "De acuerdo con el artículo 124.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el procedimiento de declaración de responsabilidad se inicia mediante acuerdo dictado por el órgano de recaudación competente, que debe ser notificado:"
  options:
  - id: a
    text:
      es: "al Tribunal Económico-Administrativo Regional competente."
  - id: b
    text:
      es: "al Registro Mercantil del domicilio de la sociedad deudora."
  - id: c
    correct: true
    text:
      es: "al interesado a quien se pretende declarar responsable."
  - id: d
    text:
      es: "al deudor principal de la deuda que se pretende derivar."
  explanation:
    es: "El acuerdo de inicio se notifica al interesado, que es quien puede resultar responsable (art. 124.1 RGR). No se notifica al deudor principal, al tribunal económico-administrativo ni al Registro Mercantil como destinatarios del inicio."
  citation: "art. 124.1 RGR"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-124
- id: m03-l12-q0178
  prompt:
    es: "Conforme al artículo 124.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en el procedimiento de declaración de responsabilidad el trámite de audiencia es de:"
  options:
  - id: a
    correct: true
    text:
      es: "15 días contados a partir del día siguiente al de la notificación de la apertura de dicho plazo."
  - id: b
    text:
      es: "15 días contados a partir de la fecha del acuerdo de inicio del procedimiento."
  - id: c
    text:
      es: "un mes contado a partir del día siguiente al de la notificación de la apertura de dicho plazo."
  - id: d
    text:
      es: "10 días contados a partir del día siguiente al de la notificación de la apertura de dicho plazo."
  explanation:
    es: "La audiencia dura 15 días desde el día siguiente a la notificación de su apertura (art. 124.1 RGR). No son 10 días ni un mes, y el cómputo no arranca en la fecha del acuerdo de inicio sino en la notificación de la apertura del trámite."
  citation: "art. 124.1 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0181
  prompt:
    es: "¿Cuál de los siguientes contenidos debe tener la notificación del acto de declaración de responsabilidad, según el artículo 174.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los medios de impugnación que pueden ejercitarse contra el acto, el órgano ante el que han de presentarse y el plazo para interponerlos."
  - id: b
    text:
      es: "La relación de los bienes y derechos del responsable que se embargarán de forma preferente."
  - id: c
    text:
      es: "El plazo máximo de seis meses que tiene el responsable para pagar la deuda derivada."
  - id: d
    text:
      es: "La declaración de fallido del deudor principal y de los demás responsables solidarios."
  explanation:
    es: "La notificación incluye el texto íntegro del acuerdo, los medios de impugnación con órgano y plazo, y el lugar, plazo y forma de pago (art. 174.4 LGT). La relación de bienes a embargar y la declaración de fallido no son contenido necesario. Y el plazo de seis meses es el de resolución del procedimiento, no el de pago del responsable."
  citation: "art. 174.4 LGT"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0182
  prompt:
    es: "El acto de declaración de responsabilidad se notifica a los responsables con un contenido que incluye, según el artículo 174.4.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, el texto íntegro del acuerdo, con indicación:"
  options:
  - id: a
    correct: true
    text:
      es: "del presupuesto de hecho habilitante y de las liquidaciones a las que alcanza dicho presupuesto."
  - id: b
    text:
      es: "del importe de las sanciones impuestas al deudor principal y de su fecha de firmeza."
  - id: c
    text:
      es: "del órgano de inspección que practicó la liquidación y de la fecha de inicio de las actuaciones."
  - id: d
    text:
      es: "de los bienes y derechos del deudor principal sobre los que se ha trabado embargo."
  explanation:
    es: "El acuerdo íntegro debe indicar el presupuesto de hecho habilitante y las liquidaciones a las que alcanza (art. 174.4.a LGT). Las sanciones del deudor principal, los bienes embargados y el órgano de inspección no son parte de ese contenido."
  citation: "art. 174.4 LGT"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0184
  prompt:
    es: "A la sociedad Frigoríficos Llano, S.L. se le liquidan 90.000 euros, que adquieren firmeza. Se declara responsable a Andrés Gil, que recurre la derivación. Si la resolución del recurso estima su pretensión, según el artículo 174.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto tiene sobre la liquidación firme de la sociedad?"
  options:
  - id: a
    text:
      es: "Se reabre el plazo de impugnación de la liquidación para la sociedad, que puede recurrirla de nuevo."
  - id: b
    text:
      es: "Se reduce la liquidación de la sociedad en la misma proporción en que se reduce la obligación del responsable."
  - id: c
    correct: true
    text:
      es: "Ninguno: la resolución solo puede afectar al importe de la obligación de Andrés Gil, no a las liquidaciones firmes para otros obligados."
  - id: d
    text:
      es: "Se anula la liquidación de la sociedad, porque la resolución revisa las liquidaciones a las que alcanza el presupuesto de hecho habilitante."
  explanation:
    es: "La resolución del recurso del responsable no puede revisar liquidaciones que han adquirido firmeza para otros obligados, y solo modifica la obligación del propio responsable (art. 174.5 LGT; art. 124.3 RGR). Por eso no se anula la liquidación de la sociedad ni se reduce con proporción alguna, y tampoco se reabre su plazo de impugnación."
  citation: "art. 174.5 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2005-14803-art-124
- id: m03-l12-q0185
  prompt:
    es: "De acuerdo con el artículo 124.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre las solicitudes de aplazamiento, fraccionamiento o suspensión formuladas por un responsable:"
  options:
  - id: a
    text:
      es: "Obligan al órgano de recaudación a acumular los procedimientos de todos los responsables."
  - id: b
    text:
      es: "Suspenden el procedimiento de recaudación frente a todos los responsables de las mismas deudas."
  - id: c
    correct: true
    text:
      es: "No afectan al procedimiento de recaudación iniciado frente a los demás responsables de las deudas a las que se refieran."
  - id: d
    text:
      es: "Solo producen efectos frente a los responsables solidarios, no frente a los subsidiarios."
  explanation:
    es: "Lo que pide un responsable no frena el procedimiento frente a los demás responsables de esas deudas (art. 124.2 RGR). No suspende el cobro frente a todos, no distingue entre solidarios y subsidiarios y no obliga a acumular procedimientos."
  citation: "art. 124.2 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0186
  prompt:
    es: "Según el artículo 174.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo concedido al responsable para efectuar el pago en período voluntario es:"
  options:
  - id: a
    correct: true
    text:
      es: "el establecido en el apartado 2 del artículo 62 de esa ley."
  - id: b
    text:
      es: "el establecido en el apartado 5 del artículo 62 de esa ley."
  - id: c
    text:
      es: "de quince días desde la notificación del acto de declaración de responsabilidad."
  - id: d
    text:
      es: "de un mes desde la firmeza del acto de declaración de responsabilidad."
  explanation:
    es: "El responsable paga en el plazo de pago en período voluntario del artículo 62.2 LGT (art. 174.6 LGT). El apartado 5 del artículo 62 es el plazo del período ejecutivo, tras la providencia de apremio. Los quince días desde la notificación y el mes desde la firmeza no son plazos del artículo."
  citation: "art. 174.6 LGT"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0187
  prompt:
    es: "Si el responsable no realiza el pago en el plazo concedido en período voluntario, el artículo 174.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que la deuda le será exigida:"
  options:
  - id: a
    correct: true
    text:
      es: "en vía de apremio, extendiéndose al recargo del período ejecutivo que proceda según el artículo 28 de esa ley."
  - id: b
    text:
      es: "en vía de apremio, sin recargo alguno, porque el recargo corresponde solo al deudor principal."
  - id: c
    text:
      es: "mediante un nuevo acto de declaración de responsabilidad, con el recargo de apremio del 20 por ciento sobre la deuda derivada."
  - id: d
    text:
      es: "mediante requerimiento de pago y, si no lo atiende, con el interés de demora del artículo 26."
  explanation:
    es: "El responsable que no paga en voluntaria sufre el apremio y el recargo del período ejecutivo que proceda según el artículo 28 LGT (art. 174.6 LGT). El recargo no es solo del deudor principal. No hace falta un nuevo acto de declaración, y el porcentaje no es siempre el del 20 por ciento. El interés de demora no sustituye a ese recargo."
  citation: "art. 174.6 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0188
  prompt:
    es: "Cuando la responsabilidad solidaria ha sido declarada y notificada al responsable en cualquier momento anterior al vencimiento del período voluntario de pago original de la deuda que se deriva, el artículo 175.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que:"
  options:
  - id: a
    text:
      es: "debe notificársele la providencia de apremio con el recargo del período ejecutivo del 20 por ciento."
  - id: b
    correct: true
    text:
      es: "basta con requerirle el pago una vez transcurrido dicho período."
  - id: c
    text:
      es: "debe esperarse a que se declare fallido al deudor principal antes de requerirle el pago."
  - id: d
    text:
      es: "debe dictarse un nuevo acto de declaración de responsabilidad una vez transcurrido dicho período."
  explanation:
    es: "Si la responsabilidad solidaria ya estaba declarada y notificada antes del fin de la voluntaria del deudor, basta requerir el pago cuando ese período termina (art. 175.1.a LGT). No hace falta otro acto, ni la providencia con recargo, ni la declaración de fallido, que es propia de la responsabilidad subsidiaria."
  citation: "art. 175.1 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0189
  prompt:
    es: "Conforme al artículo 175.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la responsabilidad solidaria no declarada antes del vencimiento del período voluntario de pago original de la deuda:"
  options:
  - id: a
    text:
      es: "El acto de declaración de responsabilidad se dicta antes de que transcurra el período voluntario de pago."
  - id: b
    text:
      es: "Debe declararse fallido antes al deudor principal para dictar el acto de declaración de responsabilidad."
  - id: c
    correct: true
    text:
      es: "Una vez transcurrido ese período, el órgano competente dicta acto de declaración de responsabilidad, que se notifica al responsable."
  - id: d
    text:
      es: "Basta con requerir el pago al responsable una vez transcurrido ese período."
  explanation:
    es: "En los demás casos, pasado el período voluntario original, el órgano competente dicta el acto de declaración y lo notifica (art. 175.1.b LGT). Basta con requerir el pago solo cuando la declaración ya se había notificado antes. La declaración de fallido es presupuesto de la responsabilidad subsidiaria. Y el acto no se dicta antes de que termine el período voluntario en este supuesto."
  citation: "art. 175.1 LGT"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0190
  prompt:
    es: "El 3 de marzo de 2027 se notifica a Mónica Ruiz el acto que la declara responsable solidaria de una deuda de Imprentas Alba, S.L. cuyo período voluntario de pago original termina el 20 de marzo de 2027. Conforme al artículo 175.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe hacer la Administración una vez transcurrido ese período?"
  options:
  - id: a
    text:
      es: "Esperar a que se notifique la providencia de apremio a la sociedad deudora."
  - id: b
    correct: true
    text:
      es: "Requerirle el pago, porque la responsabilidad se declaró y notificó antes del vencimiento del período voluntario original."
  - id: c
    text:
      es: "Dictar un nuevo acto de declaración de responsabilidad y notificárselo."
  - id: d
    text:
      es: "Declarar fallida a la sociedad deudora y derivar después la deuda a la responsable."
  explanation:
    es: "La declaración se notificó antes de terminar el período voluntario original, así que basta con requerir el pago a la responsable al transcurrir ese período (art. 175.1.a LGT). Un nuevo acto solo se dicta cuando la declaración no se hizo antes. La declaración de fallido es propia de la responsabilidad subsidiaria. Y el requerimiento no depende de la providencia de apremio a la sociedad."
  citation: "art. 175.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "procedimiento"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0191
  prompt:
    es: "Para limitar la responsabilidad solidaria del artículo 42.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, el que pretende adquirir la titularidad de explotaciones y actividades económicas tiene derecho, según el artículo 175.2, previa la conformidad del titular actual, a solicitar de la Administración:"
  options:
  - id: a
    text:
      es: "autorización previa de la transmisión de la titularidad de la explotación."
  - id: b
    text:
      es: "certificación de hallarse al corriente de las obligaciones tributarias del titular actual."
  - id: c
    text:
      es: "informe vinculante sobre el valor de la explotación a efectos de la transmisión."
  - id: d
    correct: true
    text:
      es: "certificación detallada de las deudas, sanciones y responsabilidades tributarias derivadas de su ejercicio."
  explanation:
    es: "El futuro adquirente puede pedir, con la conformidad del titular, certificación detallada de deudas, sanciones y responsabilidades derivadas de la actividad (art. 175.2 LGT). No es una certificación de estar al corriente, ni un informe sobre el valor, ni una autorización de la transmisión."
  citation: "art. 175.2 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0192
  prompt:
    es: "Según el artículo 175.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué plazo debe expedir la Administración tributaria la certificación de deudas, sanciones y responsabilidades de una explotación o actividad económica?"
  options:
  - id: a
    text:
      es: "En el plazo de seis meses desde la solicitud."
  - id: b
    text:
      es: "En el plazo de un mes desde la conformidad del titular actual."
  - id: c
    text:
      es: "En el plazo de quince días desde la solicitud."
  - id: d
    correct: true
    text:
      es: "En el plazo de tres meses desde la solicitud."
  explanation:
    es: "La certificación se expide en tres meses desde la solicitud (art. 175.2 LGT). Los seis meses son el plazo de la resolución de la tercería y de la declaración de responsabilidad. Los quince días y el mes desde la conformidad no figuran en el artículo."
  citation: "art. 175.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0193
  prompt:
    es: "Señale la respuesta CORRECTA sobre el efecto de la certificación solicitada por quien pretende adquirir una explotación o actividad económica, según el artículo 175.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "La responsabilidad del adquirente se extiende a todas las deudas de la explotación, aunque no figuren en la certificación."
  - id: b
    text:
      es: "Si la certificación no se facilita en el plazo señalado, el solicitante responde de todas las deudas de la explotación."
  - id: c
    correct: true
    text:
      es: "Si la certificación se expide sin mencionar deudas o no se facilita en el plazo señalado, el solicitante queda exento de la responsabilidad del artículo 42.1.c."
  - id: d
    text:
      es: "Si la certificación se expide sin mencionar deudas, el solicitante queda obligado a abonar las que resulten después."
  explanation:
    es: "Con la certificación, la responsabilidad del adquirente se limita a lo que esta contiene; si no menciona deudas o no se facilita en el plazo, el solicitante queda exento (art. 175.2 LGT). Por eso no responde de todas las deudas si no hay certificación a tiempo, ni de las que no figuran, ni de las que resulten después."
  citation: "art. 175.2 LGT"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-176
- id: m03-l12-q0194
  prompt:
    es: "De acuerdo con el artículo 176 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria dicta el acto de declaración de responsabilidad subsidiaria, que se notifica al responsable subsidiario, una vez declarados fallidos:"
  options:
  - id: a
    correct: true
    text:
      es: "el deudor principal y, en su caso, los responsables solidarios."
  - id: b
    text:
      es: "el deudor principal, sin que importe la situación de los responsables solidarios."
  - id: c
    text:
      es: "los responsables solidarios y los sucesores del deudor principal."
  - id: d
    text:
      es: "el deudor principal y todos los demás responsables subsidiarios."
  explanation:
    es: "La responsabilidad subsidiaria exige que hayan sido declarados fallidos el deudor principal y, en su caso, los responsables solidarios (art. 176 LGT). No basta el fallido del deudor principal si hay solidarios. Los sucesores y los demás subsidiarios no son el presupuesto."
  citation: "art. 176 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-176
- id: m03-l12-q0195
  prompt:
    es: "¿Cuál es el presupuesto para dictar el acto de declaración de responsabilidad frente al responsable subsidiario, según el artículo 176 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Que hayan sido declarados fallidos el deudor principal y, en su caso, los responsables solidarios."
  - id: b
    text:
      es: "Que se haya trabado embargo sobre los bienes del deudor principal."
  - id: c
    text:
      es: "Que se haya notificado la providencia de apremio al deudor principal."
  - id: d
    text:
      es: "Que haya transcurrido el período voluntario de pago original de la deuda que se deriva del deudor principal."
  explanation:
    es: "Para el responsable subsidiario hace falta la declaración de fallido del deudor principal y de los solidarios (art. 176 LGT). El fin del período voluntario es el presupuesto de la responsabilidad solidaria no declarada antes (art. 175.1.b). La providencia de apremio y el embargo del deudor principal no bastan."
  citation: "art. 176 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-124
- id: m03-l12-q0196
  prompt:
    es: "Si el deudor principal o los responsables solidarios son declarados insolventes por la parte no derivada a los responsables subsidiarios, el artículo 124.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que puede procederse, tras la declaración de fallido por insolvencia total, a:"
  options:
  - id: a
    text:
      es: "la devolución del expediente al órgano de inspección para nueva liquidación."
  - id: b
    text:
      es: "la extinción de la deuda no derivada por insolvencia del deudor principal."
  - id: c
    correct: true
    text:
      es: "la derivación a dichos responsables subsidiarios del resto de la deuda pendiente de cobro."
  - id: d
    text:
      es: "la declaración de responsabilidad solidaria de los responsables subsidiarios, con efectos desde la declaración de fallido."
  explanation:
    es: "Tras el fallido por insolvencia total, puede derivarse a los subsidiarios el resto de la deuda pendiente (art. 124.5 RGR). La insolvencia no extingue la deuda no derivada. Los subsidiarios no pasan a ser solidarios, y el expediente no vuelve a la inspección."
  citation: "art. 124.5 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0197
  prompt:
    es: "¿Qué indicaciones sobre el pago debe contener la notificación del acto de declaración de responsabilidad, según el artículo 174.4.c de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Solo el plazo en que deba ser satisfecho el importe exigido al responsable."
  - id: b
    text:
      es: "El número de cuenta del deudor principal y el importe de la deuda derivada."
  - id: c
    text:
      es: "El lugar y la forma de pago, sin plazo, que se fija en la providencia de apremio del deudor principal."
  - id: d
    correct: true
    text:
      es: "El lugar, el plazo y la forma en que deba ser satisfecho el importe exigido al responsable."
  explanation:
    es: "La notificación indica lugar, plazo y forma de pago del importe exigido al responsable (art. 174.4.c LGT). No se limita al plazo ni omite el plazo, y no incluye la cuenta del deudor principal."
  citation: "art. 174.4 LGT"
