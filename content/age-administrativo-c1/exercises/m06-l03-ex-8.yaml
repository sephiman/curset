# anchor: fuente-ms-win-bloc-notas-html
- id: m06-l03-q266
  prompt:
    es: "En el Bloc de notas de Windows 11, ¿cuál es la configuración predeterminada del encabezado y del pie de página al imprimir?"
  options:
  - id: a
    text:
      es: "&p en el encabezado y «página &f» en el pie"
  - id: b
    text:
      es: "&d en el encabezado y &t en el pie"
  - id: c
    correct: true
    text:
      es: "&f en el encabezado y «página &p» en el pie"
  - id: d
    text:
      es: "&l en el encabezado y &r en el pie"
  explanation:
    es: "La página dice que el encabezado predeterminado es &f y el pie es «página &p», es decir, el título del documento arriba y el número de página abajo. Intercambiar los comandos o poner la fecha y la hora, o los de alineación, no es esa configuración."
  citation: "fuente: `ms-win-bloc-notas.html`; «Cómo cambio el encabezado y el pie de página en el Bloc de notas»"
  difficulty: 1
  tags:
  - "configuración"
