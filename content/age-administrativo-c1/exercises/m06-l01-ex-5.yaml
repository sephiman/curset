# anchor: fuente-ms-mineria-datos-html
- id: m06-l01-q135
  prompt:
    es: "¿Por qué los patrones que detecta la minería de datos normalmente no se pueden detectar mediante la exploración de datos tradicional?"
  options:
  - id: a
    text:
      es: "Porque los datos están cifrados y la exploración tradicional no los lee."
  - id: b
    correct: true
    text:
      es: "Porque las relaciones son demasiado complejas o porque hay demasiados datos."
  - id: c
    text:
      es: "Porque los datos deben estar en un cubo OLAP y no en una base relacional."
  - id: d
    text:
      es: "Porque la exploración tradicional solo admite datos de libros de Excel."
  explanation:
    es: "La página dice que estos patrones normalmente no se pueden detectar con la exploración de datos tradicional porque las relaciones son demasiado complejas o porque hay demasiados datos. No habla de cifrado, y añade que los datos de la minería no necesitan estar en un cubo OLAP ni en una base relacional y que pueden venir de libros de Excel."
  citation: "fuente: `ms-mineria-datos.html`; «Conceptos de minería de datos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q144
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las unidades de estado sólido (SSD) es correcta, según Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "No tienen partes móviles y almacenan los datos en circuitos pequeños."
  - id: b
    text:
      es: "Usan discos magnetizados que giran rápido y un brazo con una cabeza lectora."
  - id: c
    text:
      es: "Necesitan energía para conservar los datos que almacenan."
  - id: d
    text:
      es: "Almacenan los datos en una cinta magnética que se rebobina."
  explanation:
    es: "La página dice que las SSD no tienen partes móviles y almacenan datos en circuitos pequeños en lugar de discos magnetizados. Los discos que giran con un brazo y una cabeza son la unidad de disco duro; la cinta que se rebobina es el almacenamiento de los primeros equipos; y el almacenamiento a largo plazo guarda datos sin necesitar energía."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de estado sólido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q145
  prompt:
    es: "¿Cómo lee y escribe la información una unidad de disco duro (HDD), uno de los tipos de almacenamiento a largo plazo?"
  options:
  - id: a
    text:
      es: "Con circuitos pequeños, sin ninguna parte móvil en la unidad."
  - id: b
    text:
      es: "Con una cinta magnética que debe rebobinarse o avanzarse."
  - id: c
    text:
      es: "Con memoria de acceso aleatorio, que se borra al apagar el equipo."
  - id: d
    correct: true
    text:
      es: "Con discos que giran rápido y un brazo con una cabeza."
  explanation:
    es: "La página describe el HDD como discos que giran rápido y usan un brazo y una cabeza para leer y escribir información, «algo así como un tocadiscos». Los circuitos sin partes móviles son la SSD, la cinta que se rebobina es el soporte anterior y la RAM es memoria a corto plazo, no almacenamiento."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de disco duro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q147
  prompt:
    es: "¿Cuál de las siguientes ventajas atribuye Microsoft a las unidades de estado sólido (SSD) por no tener partes móviles?"
  options:
  - id: a
    text:
      es: "Tienden a romperse más, aunque son más ligeras y más pequeñas."
  - id: b
    text:
      es: "Pesan más, pero son más pequeñas y se rompen menos."
  - id: c
    correct: true
    text:
      es: "Tienden a romperse menos, son más ligeras y más pequeñas."
  - id: d
    text:
      es: "Son más grandes, pero tienden a romperse menos y pesan menos."
  explanation:
    es: "La página dice que, como no tienen partes móviles, las SSD tienden a romperse menos, son más ligeras y tienden a ser más pequeñas. Cada distractor cambia uno de esos tres rasgos: que se rompan más, que pesen más o que sean más grandes."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de estado sólido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q148
  prompt:
    es: "¿Qué tienen en común las unidades de disco duro (HDD) y las unidades de estado sólido (SSD), según Microsoft?"
  options:
  - id: a
    text:
      es: "Usan discos que giran y un brazo con una cabeza para leer y escribir."
  - id: b
    correct: true
    text:
      es: "Pueden contener mucha información y se conectan al equipo de maneras similares."
  - id: c
    text:
      es: "Solo conservan los datos mientras el equipo permanece encendido."
  - id: d
    text:
      es: "No tienen partes móviles y almacenan los datos en circuitos pequeños."
  explanation:
    es: "En «Similitudes», la página dice que las dos pueden contener mucha información, hasta terabytes, y que se conectan al equipo de maneras similares. Los discos que giran son solo del HDD, los circuitos sin partes móviles solo de la SSD, y las dos guardan datos sin necesitar energía."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Tanto las unidades de disco duro como las unidades de estado sólido pueden contener mucha información.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q149
  prompt:
    es: "Comparadas con las unidades de disco duro (HDD), muchas unidades de estado sólido (SSD), según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Son más lentas, duran menos y tienden a usar más potencia."
  - id: b
    text:
      es: "Son más rápidas, pero duran menos y tienden a usar más potencia."
  - id: c
    correct: true
    text:
      es: "Son más rápidas, duran más y tienden a usar menos potencia."
  - id: d
    text:
      es: "Son igual de rápidas, pero duran menos y usan la misma potencia."
  explanation:
    es: "La página dice que muchas SSD son más rápidas y duran más que los discos duros, y que tienden a usar menos potencia. Los distractores invierten uno o varios de esos rasgos."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de estado sólido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q150
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el almacenamiento a largo plazo, como el HDD o la SSD, es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Almacena datos sin necesitar energía, a diferencia de la memoria RAM."
  - id: b
    text:
      es: "Solo está activo con el equipo encendido, como la memoria RAM."
  - id: c
    text:
      es: "Pierde los datos cuando la batería del equipo se queda sin carga."
  - id: d
    text:
      es: "También se denomina memoria a corto plazo o de acceso aleatorio."
  explanation:
    es: "La página dice que el almacenamiento a largo plazo guarda datos sobre cosas que no necesitan energía, a diferencia de la RAM, que solo está activa con el equipo encendido y pierde lo que contiene al apagarlo o al agotarse la batería. «Memoria a corto plazo» es el otro nombre que la página da a la RAM."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «El almacenamiento a largo plazo es diferente, almacenando datos sobre cosas que no necesitan energía.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q151
  prompt:
    es: "¿Por qué los usuarios usan cada vez menos las unidades de disco duro (HDD), según la página de Microsoft sobre el almacenamiento?"
  options:
  - id: a
    text:
      es: "Porque los HDD ya no pueden contener terabytes de datos."
  - id: b
    correct: true
    text:
      es: "Porque las SSD han bajado de tamaño y de coste y almacenan más."
  - id: c
    text:
      es: "Porque los HDD solo acceden a los datos en orden, como la cinta."
  - id: d
    text:
      es: "Porque los HDD se conectan al equipo de forma distinta a las SSD."
  explanation:
    es: "La página dice que los discos duros se usan menos porque el tamaño físico y el coste de las SSD han bajado mientras su capacidad ha aumentado. Según la misma página, los HDD pueden contener terabytes, obtienen la información esté donde esté en el disco y se conectan al equipo de maneras similares a las SSD."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de disco duro»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q152
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los discos duros (HDD), comparados con la cinta magnética, es correcta?"
  options:
  - id: a
    text:
      es: "Son más lentos que la cinta, pero se rompen menos que ella."
  - id: b
    text:
      es: "Igual que la cinta, deben rebobinarse para llegar a un dato."
  - id: c
    text:
      es: "A diferencia de la cinta, no usan imanes para guardar los datos."
  - id: d
    correct: true
    text:
      es: "Son más rápidos y obtienen la información esté donde esté en el disco."
  explanation:
    es: "La página dice que, a diferencia de la cinta, los HDD son mucho más rápidos, no se rompen tanto y permiten obtener la información rápidamente, independientemente de dónde se encuentre en el disco. También dice que los HDD usan pequeños imanes, como la cinta, y rebobinar era la desventaja de la cinta."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Unidades de disco duro»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q153
  prompt:
    es: "Señale la afirmación correcta sobre el sistema de archivos NTFS en Windows 11, según la documentación de Microsoft:"
  options:
  - id: a
    text:
      es: "Solo admite volúmenes de hasta 256 TB en las versiones actuales de Windows."
  - id: b
    correct: true
    text:
      es: "Es el sistema de archivos predeterminado del sistema operativo moderno basado en Windows."
  - id: c
    text:
      es: "Solo permite montar un volumen en una carpeta que ya contenga archivos."
  - id: d
    text:
      es: "Necesita desconectar el volumen para reparar cualquier daño del sistema de archivos, aunque sea menor."
  explanation:
    es: "La página dice que NTFS es el sistema de archivos predeterminado para el sistema operativo moderno basado en Windows, y se aplica a Windows 11. Los 256 TB son el límite de versiones anteriores de Windows; un volumen se monta en una carpeta vacía; y NTFS de recuperación automática repara daños menores sin desconectar el volumen."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q154
  prompt:
    es: "En Windows 11, ¿cuál es el sistema de archivos predeterminado, que asigna permisos a archivos y carpetas mediante listas de control de acceso (ACL)?"
  options:
  - id: a
    text:
      es: "UDF"
  - id: b
    text:
      es: "FAT"
  - id: c
    text:
      es: "CSV"
  - id: d
    correct: true
    text:
      es: "NTFS"
  explanation:
    es: "La página dice que NTFS es el sistema de archivos predeterminado de Windows y que permite asignar permisos detallados a archivos y carpetas mediante listas de control de acceso (ACL). UDF y FAT son otros sistemas de archivos, y CSV es el sistema de volúmenes compartidos de clúster con el que NTFS se integra; ninguno es el predeterminado."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor seguridad»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q155
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los permisos del sistema de archivos NTFS en Windows 11 es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Indican qué usuarios y grupos tienen acceso y el tipo de acceso, como lectura o escritura."
  - id: b
    text:
      es: "Se asignan a las carpetas, pero no a cada archivo por separado."
  - id: c
    text:
      es: "Se asignan a cada usuario por separado, pero nunca a grupos de usuarios."
  - id: d
    text:
      es: "Se asignan con el cifrado de unidad BitLocker, no con listas de control de acceso (ACL)."
  explanation:
    es: "La página dice que NTFS permite asignar permisos detallados a archivos y carpetas mediante listas de control de acceso (ACL), indicando qué usuarios y grupos tienen acceso y el tipo de acceso, como lectura, escritura o modificación. BitLocker cifra los volúmenes; no es el mecanismo de los permisos."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor seguridad»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q156
  prompt:
    es: "¿Cuál de las siguientes características de seguridad basadas en hardware aplica BitLocker, el cifrado de unidad que funciona con NTFS en Windows 11?"
  options:
  - id: a
    text:
      es: "La memoria caché de nivel 2 o 3."
  - id: b
    text:
      es: "La tarjeta gráfica con DirectX 12."
  - id: c
    correct: true
    text:
      es: "El módulo de plataforma segura (TPM)."
  - id: d
    text:
      es: "El controlador de dispositivo WDDM 2.0."
  explanation:
    es: "La página dice que BitLocker aplica características de seguridad basadas en hardware como el módulo de plataforma segura (TPM) para cifrar los dispositivos. La caché de nivel 2 o 3 es una propiedad del procesador, y la tarjeta gráfica con DirectX 12 y el controlador WDDM 2.0 son requisitos gráficos de Windows 11; ninguno es una función de BitLocker."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor seguridad»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q157
  prompt:
    es: "En Windows 11, si se produce un error del sistema, ¿cómo restaura NTFS la coherencia del sistema de archivos?"
  options:
  - id: a
    text:
      es: "Reasigna el clúster afectado a otro y lo marca como inutilizable."
  - id: b
    text:
      es: "Ejecuta chkdsk con el volumen desconectado hasta acabar la reparación."
  - id: c
    text:
      es: "Restaura la versión anterior de cada archivo desde el Historial de versiones de Office."
  - id: d
    correct: true
    text:
      es: "Usa su archivo de registro basado en transacciones durante el siguiente inicio."
  explanation:
    es: "La página dice que NTFS mantiene un archivo de registro basado en transacciones y, si se produce un error del sistema, lo usa para restaurar automáticamente la coherencia durante el siguiente inicio. Reasignar el clúster es lo que hace ante un sector incorrecto; chkdsk repara manteniendo el volumen en línea; el Historial de versiones es la herramienta de Office para recuperar versiones de un archivo."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor confiabilidad»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q158
  prompt:
    es: "¿Qué hace el sistema de archivos NTFS de Windows 11 cuando detecta un sector incorrecto en el disco?"
  options:
  - id: a
    text:
      es: "Desconecta el volumen hasta que chkdsk termina de repararlo."
  - id: b
    correct: true
    text:
      es: "Reasigna el clúster afectado a uno correcto y marca el original como inutilizable."
  - id: c
    text:
      es: "Borra el clúster afectado junto con los datos que contiene."
  - id: d
    text:
      es: "Reproduce su registro de transacciones en el siguiente inicio del equipo y del volumen."
  explanation:
    es: "La página dice que, cuando se detecta un sector incorrecto, NTFS reasigna dinámicamente el clúster afectado a uno correcto, marca el original como inutilizable y conserva los datos. No borra esos datos ni desconecta el volumen, y reproducir el registro de transacciones es lo que hace tras un bloqueo del sistema."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor confiabilidad»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q159
  prompt:
    es: "En Windows 11, la característica del sistema de archivos NTFS denominada «NTFS de recuperación automática»:"
  options:
  - id: a
    text:
      es: "Repara daños menores, pero solo después de desconectar el volumen."
  - id: b
    text:
      es: "Restaura una versión anterior del volumen desde una instantánea del servicio VSS."
  - id: c
    correct: true
    text:
      es: "Detecta y repara daños menores en segundo plano, sin desconectar el volumen."
  - id: d
    text:
      es: "Cifra el volumen con BitLocker en cuanto detecta un daño menor."
  explanation:
    es: "La página dice que NTFS de recuperación automática detecta y repara automáticamente daños menores del sistema de archivos en segundo plano, sin necesidad de que el volumen se desconecte. No restaura versiones desde instantáneas ni cifra el volumen; BitLocker es el cifrado de unidad."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor confiabilidad»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q160
  prompt:
    es: "Para daños más significativos en un volumen NTFS de Windows 11, ¿cuál de las siguientes acciones realiza la utilidad chkdsk?"
  options:
  - id: a
    correct: true
    text:
      es: "Examina y repara el volumen mientras lo mantiene en línea."
  - id: b
    text:
      es: "Examina el volumen, pero solo lo repara después de formatearlo."
  - id: c
    text:
      es: "Mantiene el volumen desconectado durante todo el examen y la reparación."
  - id: d
    text:
      es: "Traslada todos los clústeres del volumen a otro disco del equipo."
  explanation:
    es: "La página dice que, para daños más significativos, chkdsk puede examinar y reparar volúmenes NTFS mientras los mantiene en línea; el único período en que el volumen podría no estar disponible es la fase de restaurar la coherencia de los datos. No formatea el volumen, no lo mantiene desconectado todo el tiempo y no traslada clústeres a otro disco."
  citation: "fuente: `ms-win-ntfs.html`; «Mayor confiabilidad»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q161
  prompt:
    es: "En un volumen NTFS con un tamaño de clúster de 64 KB, ¿cuál es el mayor tamaño de volumen y de archivo que admite, según Microsoft?"
  options:
  - id: a
    text:
      es: "16 TB"
  - id: b
    text:
      es: "128 TB"
  - id: c
    text:
      es: "8 PB"
  - id: d
    correct: true
    text:
      es: "256 TB"
  explanation:
    es: "La tabla de la página da, para un clúster de 64 KB (el máximo anterior), un volumen y un archivo de hasta 256 TB. Los 16 TB corresponden al clúster de 4 KB, los 128 TB al de 32 KB y los 8 PB al de 2048 KB, el tamaño máximo."
  citation: "fuente: `ms-win-ntfs.html`; «64 KB (máx. anterior) — 256 TB»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q162
  prompt:
    es: "¿Cuál es el tamaño de clúster predeterminado de un volumen NTFS, según la tabla de tamaños de volumen y archivo de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "4 KB"
  - id: b
    text:
      es: "8 KB"
  - id: c
    text:
      es: "64 KB"
  - id: d
    text:
      es: "2048 KB"
  explanation:
    es: "La tabla de la página marca 4 KB como «tamaño predeterminado», con un volumen y un archivo de hasta 16 TB. Los 8 KB son otra fila de la tabla, 64 KB es el «máx. anterior» y 2048 KB el «tamaño máx.»."
  citation: "fuente: `ms-win-ntfs.html`; «Compatibilidad con volúmenes grandes»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q164
  prompt:
    es: "¿Cómo mantiene NTFS la compatibilidad con los sistemas de archivos que imponen un límite 8.3 en los nombres de archivo y las extensiones?"
  options:
  - id: a
    text:
      es: "Recorta los nombres largos a ocho caracteres y tres de extensión, sin conservarlos."
  - id: b
    correct: true
    text:
      es: "Almacena en el disco un alias 8.3, en Unicode, de cada nombre largo."
  - id: c
    text:
      es: "Impide crear nombres de archivo de más de ocho caracteres."
  - id: d
    text:
      es: "Guarda los nombres largos en la nube y los cortos en el disco."
  explanation:
    es: "La página dice que NTFS admite nombres de archivo largos y almacena en el disco un alias 8.3, en Unicode, para ser compatible con los sistemas que imponen ese límite. Recortar los nombres a ocho caracteres sin conservarlos contradice «admite nombres de archivo largos»: el nombre largo se mantiene y el alias va aparte. Impedir los nombres de más de ocho caracteres contradice lo mismo. Y el alias se almacena «en el disco», no en la nube."
  citation: "fuente: `ms-win-ntfs.html`; «Nombre y ruta de acceso máximos de un archivo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q166
  prompt:
    es: "¿Cuál de las siguientes formas de trabajar con la capacidad de almacenamiento ofrece NTFS cuando el espacio de un volumen está limitado?"
  options:
  - id: a
    correct: true
    text:
      es: "Montar un volumen en cualquier carpeta vacía de un volumen NTFS local."
  - id: b
    text:
      es: "Montar un volumen solo en la raíz de una unidad con letra asignada."
  - id: c
    text:
      es: "Aumentar el volumen solo con espacio sin asignar de otro disco distinto."
  - id: d
    text:
      es: "Reducir automáticamente el tamaño de los archivos de usuario más antiguos."
  explanation:
    es: "Entre las formas de trabajar con la capacidad, la página cita montar un volumen en cualquier carpeta vacía de un volumen NTFS local, por ejemplo si se agotan las letras de unidad. También cita aumentar un volumen con espacio sin asignar del mismo disco o de otro, no solo de otro. No habla de reducir archivos antiguos."
  citation: "fuente: `ms-win-ntfs.html`; «Asignación flexible de capacidad»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q167
  prompt:
    es: "En el sistema de archivos NTFS de Windows 11, ¿para qué sirven las cuotas de disco de un volumen?"
  options:
  - id: a
    text:
      es: "Para cifrar con BitLocker los datos confidenciales guardados en el volumen."
  - id: b
    correct: true
    text:
      es: "Para seguir y controlar el uso del espacio de disco de cada usuario."
  - id: c
    text:
      es: "Para comprimir los datos y almacenar más en el mismo volumen."
  - id: d
    text:
      es: "Para asignar permisos de lectura y escritura a los grupos."
  explanation:
    es: "La página dice que las cuotas de disco sirven para realizar el seguimiento y controlar el uso del espacio de disco en volúmenes NTFS para usuarios individuales. El cifrado es BitLocker, almacenar más datos es la compresión del sistema de archivos y los permisos se asignan con listas de control de acceso."
  citation: "fuente: `ms-win-ntfs.html`; «Asignación flexible de capacidad»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q168
  prompt:
    es: "¿Cuál de las siguientes funciones tiene la compresión del sistema de archivos NTFS cuando el espacio de un volumen está limitado?"
  options:
  - id: a
    text:
      es: "Controlar el uso del espacio de disco que hace cada usuario."
  - id: b
    text:
      es: "Montar el volumen en una carpeta vacía de otro volumen NTFS local."
  - id: c
    text:
      es: "Agregar espacio sin asignar del mismo disco o de otro disco al volumen."
  - id: d
    correct: true
    text:
      es: "Maximizar la cantidad de datos que se pueden almacenar en el volumen."
  explanation:
    es: "La página dice que la compresión del sistema de archivos sirve para maximizar la cantidad de datos que se pueden almacenar. Las otras tres son formas distintas de trabajar con la capacidad que cita la misma lista: las cuotas de disco controlan el uso por usuario, el montaje en carpeta vacía da acceso a espacio desde una carpeta y agregar espacio sin asignar aumenta el tamaño del volumen."
  citation: "fuente: `ms-win-ntfs.html`; «Asignación flexible de capacidad»"
  difficulty: 2
  tags:
  - "concepto"
