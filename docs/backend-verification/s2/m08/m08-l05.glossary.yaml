- id: g-election-timeout
  term: {en: election timeout}
  definition: {en: "The period of time without communication after which a follower assumes there is no viable leader and begins an election to choose a new leader."}
  origin: m08-l05
  citation: "paper-raft-dissertation#p34"
- id: g-joint-consensus
  term: {en: joint consensus}
  definition: {en: "A transitional configuration to which the cluster first switches when its configuration changes. It combines both the old and new configurations."}
  origin: m08-l05
  citation: "paper-raft-dissertation#p62"
- id: g-herd-effect
  term: {en: herd effect}
  definition: {en: "Releasing a \"herd\" of waiting clients when in fact only a single or a small number of machines can proceed."}
  origin: m08-l05
  citation: "zk-recipes#Shared+Locks"
- id: g-fencing-token
  term: {en: fencing token}
  definition: {en: "A number that increases every time a client acquires the lock, included with every write request to the storage service."}
  origin: m08-l05
  citation: "kleppmann-distributed-locking#making-the-lock-safe-with-fencing"
