  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-numeros-pagina-html
- id: m02-l08-q115
  prompt:
    es: "¿Dónde se cambian en Word 365 la familia, el estilo, el tamaño y el color de la fuente de un número de página?"
  options:
  - id: a
    text:
      es: "En el cuadro Escala del cuadro de diálogo Fuente, pestaña Avanzadas"
  - id: b
    text:
      es: "En el estilo de la tabla de contenido"
  - id: c
    text:
      es: "En el botón Posición actual de Numeración de páginas"
  - id: d
    correct: true
    text:
      es: "En las opciones de Fuente principal o en el cuadro Fuente"
  explanation:
    es: "La página dice que se selecciona el número de página y se usan «las opciones de Fuente principal y el cuadro de diálogo Fuente para cambiar la familia, el estilo, el tamaño y el color de la fuente». El cuadro Escala, de la pestaña Avanzadas del cuadro Fuente, estira o comprime el texto horizontalmente según otra página, no cambia la familia ni el color. El estilo de la tabla de contenido no interviene: el cambio se hace sobre el número seleccionado. Y Posición actual es el botón que la página usa al agregar el número, para elegir dónde se coloca."
  citation: "fuente: `ms-word-numeros-pagina.html`; «Cambiar la apariencia del número de página»"
  difficulty: 3
  tags:
  - "configuración"
