type: quiz
variants:
- id: m07-l07-qa01
  prompt:
    en: 'According to Google in AIP-100: API Design Review FAQ, which statement about precedent in API design does
      the FAQ make?'
  options:
  - id: a
    text:
      en: Precedent covers naming only and does not extend to patterns like pagination
  - id: b
    text:
      en: Each API should choose its own approach to long-running operations
  - id: c
    text:
      en: A second Google API is no easier to learn than the first
  - id: d
    correct: true
    text:
      en: Decisions of previous APIs generally bind newer APIs in similar situations
  explanation:
    en: Google writes in AIP-100 that precedent means decisions already made by previous APIs, which generally should
      be binding upon newer APIs in similar situations. It writes that precedent also applies to patterns, which
      contradicts a precedent limited to naming. It writes that the same holds for long-running operations, import
      and export, which contradicts each API choosing its own approach. It writes that once customers learn their
      first Google API the second should be easier to learn, which contradicts equal difficulty.
  citation: google-aip-100#what-is-precedent
  extract:
    en: decisions that have already been made by previous APIs, which generally should be binding upon newer APIs
      in similar situations
- id: m07-l07-qa02
  prompt:
    en: 'According to Google in AIP-100: API Design Review FAQ, what does the FAQ say to do when an API needs to
      violate a design standard?'
  options:
  - id: a
    correct: true
    text:
      en: Document the violation and its rationale in an internal proto comment
  - id: b
    text:
      en: Prefix a proto comment with `aip.dev/precedent` to mark the exception
  - id: c
    text:
      en: Give any rationale, whether or not it matches an enumerated AIP-200 reason
  - id: d
    text:
      en: Decide the violation within the team, without involving the API reviewer
  explanation:
    en: Google writes in AIP-100 that you should clearly document, in an internal comment in the proto, that you
      are violating a guideline and why. It writes that the comment must be prefixed with `aip.dev/not-precedent`,
      which contradicts the `aip.dev/precedent` prefix. It writes that the rationale should accord with one of the
      enumerated reasons in AIP-200, which contradicts giving any rationale. It writes that you should work together
      with your API reviewer when it does not, which contradicts deciding without the reviewer.
  citation: google-aip-100#if-my-api-needs-to-violate-a-standard
  extract:
    en: Clearly document (using an internal comment in the proto) that you are violating an API design guideline
      and your rationale for doing so.
- id: m07-l07-qa03
  prompt:
    en: 'According to Google in AIP-100: API Design Review FAQ, which statement about which APIs need a design review
      does the FAQ make?'
  options:
  - id: a
    correct: true
    text:
      en: Review is only expected for APIs that users code directly against
  - id: b
    text:
      en: An API called only by an executable Google releases still needs review
  - id: c
    text:
      en: A design review is mandatory before any alpha launch of an API
  - id: d
    text:
      en: Exposure of the service on the public network decides whether review applies
  explanation:
    en: Google writes in AIP-100 that design review is only expected for APIs that users code directly against.
      It lists an API only ever called by an executable program released by Google among the situations that do
      not require design review, which contradicts a required review there. It writes that for alpha, design review
      is optional but recommended, which contradicts a mandatory review. It writes that it does not care whether
      the service is exposed on the public network, which contradicts that exposure deciding the matter.
  citation: google-aip-100#do-i-need-api-design-approval; google-aip-100#who-should-code-directly-against-it; google-aip-100#alpha
  extract:
    en: is only expected for APIs that users code directly against
- id: m07-l07-qa04
  prompt:
    en: 'According to Google in AIP-100: API Design Review FAQ, which statement about the API design review process
      does the FAQ make?'
  options:
  - id: a
    text:
      en: Reviewers approach an API as its implementers do, focusing on the code
  - id: b
    correct: true
    text:
      en: Its purpose is to make customer-facing APIs simple, intuitive and consistent
  - id: c
    text:
      en: A reviewer evaluates an API alone, without checking its fit with other APIs
  - id: d
    text:
      en: A reviewer's questions are best answered in the code review conversation
  explanation:
    en: Google writes in AIP-100 that the design review process exists to ensure that the APIs presented to customers
      are simple, intuitive and consistent. It writes that reviewers approach an API the way its users will, focusing
      on the API surface and its documentation, which contradicts approaching it as implementers. It writes that
      the reviewer also checks consistency with Google's existing corpus of APIs, which contradicts evaluating the
      API alone. It writes that explanations asked for by a reviewer belong in the proto comments rather than the
      code review conversation, which contradicts answering there.
  citation: google-aip-100#why-is-design-review-important; google-aip-100#how-do-reviewers-approach-my-api; google-aip-100#to-make-my-review-go-faster
  extract:
    en: Our design review process exists to ensure that the APIs that we present to customers are simple, intuitive,
      and consistent.
- id: m07-l07-qa05
  prompt:
    en: 'According to Google in AIP-1: AIP Purpose and Guidelines, which statement about API Improvement Proposals
      and the process around them does the page make?'
  options:
  - id: a
    text:
      en: An approved AIP is considered an experimental proposal, not a practice
  - id: b
    text:
      en: AIP editors are chosen by open election among all Googlers
  - id: c
    correct: true
    text:
      en: They are maintained as Markdown files in the AIP GitHub repository
  - id: d
    text:
      en: One approver other than the author can advance an AIP to approved
  explanation:
    en: Google writes in AIP-1 that AIPs are maintained as Markdown files in the AIP GitHub repository. It writes
      that an approved AIP is considered best current practice, which contradicts calling it an experimental proposal.
      It writes that AIP editorship is by invitation of the current editors, which contradicts an open election.
      It writes that two approvers other than the author must sign off to advance an AIP to approved, which contradicts
      a single approver.
  citation: google-aip-1#what-is-an-aip; google-aip-1#approved; google-aip-1#editors
  extract:
    en: AIPs are maintained as Markdown files in the AIP GitHub repository.
- id: m07-l07-qa06
  prompt:
    en: 'According to Google in AIP-190: Naming conventions, which statement about naming the interfaces, resources
      and methods of an API does the guidance make?'
  options:
  - id: a
    text:
      en: '`erase` is preferred over `delete` for removing and destroying a resource'
  - id: b
    correct: true
    text:
      en: Names used in APIs should be in correct American English
  - id: c
    text:
      en: Different concepts may share one name to keep the vocabulary small
  - id: d
    text:
      en: A name that conflicts with a language keyword is forbidden
  explanation:
    en: Google writes in AIP-190 that names used in APIs should be in correct American English. It writes that when
      describing removing and destroying a resource, `delete` is preferred over `erase`, which contradicts the reverse.
      It writes that name overloading should be avoided and different concepts given different names, which contradicts
      sharing one name. It writes that names conflicting with programming language keywords may be used but trigger
      additional scrutiny, which contradicts forbidding them.
  citation: google-aip-190#guidance
  extract:
    en: Names used in APIs should be in correct American English.
