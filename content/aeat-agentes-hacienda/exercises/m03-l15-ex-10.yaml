# anchor: boe-a-2006-20764-art-85
- id: m03-l15-q0212
  prompt:
    es: "De acuerdo con el artículo 85.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las rentas inmobiliarias imputadas se atribuyen a los titulares de los bienes inmuebles conforme al artículo 11.3 y, cuando existen derechos reales de disfrute, la renta computable en el titular del derecho es:"
  options:
  - id: a
    correct: true
    text:
      es: "la que correspondería al propietario."
  - id: b
    text:
      es: "la mitad de la que correspondería al propietario."
  - id: c
    text:
      es: "la proporcional al valor del derecho de disfrute en el mercado."
  - id: d
    text:
      es: "ninguna, porque solo se imputa al propietario del inmueble."
  explanation:
    es: "Si existen derechos reales de disfrute, la renta computable en su titular es la que correspondería al propietario (art. 85.2 LIRPF). No se reparte por mitades ni se calcula con el valor del derecho. Y no se imputa solo al propietario: el titular del derecho de disfrute sí computa la renta."
  citation: "art. 85.2 LIRPF"
  difficulty: 2
  tags:
  - "imputación de rentas"
  - "derechos reales"
# anchor: boe-a-2006-20764-art-85
- id: m03-l15-q0213
  prompt:
    es: "Señale la respuesta CORRECTA sobre los derechos de aprovechamiento por turno de bienes inmuebles, de acuerdo con el artículo 85.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "La imputación se efectúa al titular del derecho real, prorrateando el valor catastral en función del número de titulares del inmueble."
  - id: b
    text:
      es: "La imputación se efectúa al titular del derecho real, aplicando el valor catastral íntegro del inmueble."
  - id: c
    text:
      es: "La imputación se efectúa al propietario del inmueble, sin prorrateo del valor catastral."
  - id: d
    correct: true
    text:
      es: "La imputación se efectúa al titular del derecho real, prorrateando el valor catastral en función de la duración anual del período de aprovechamiento."
  explanation:
    es: "En los derechos de aprovechamiento por turno la imputación es al titular del derecho real y el valor catastral se prorratea por la duración anual del período (art. 85.3 LIRPF). No se imputa al propietario sin prorrateo ni con el valor íntegro. Y el criterio de prorrateo no es el número de titulares, sino la duración del aprovechamiento."
  citation: "art. 85.3 LIRPF"
  difficulty: 2
  tags:
  - "imputación de rentas"
  - "aprovechamiento por turno"
# anchor: boe-a-2006-20764-art-85
- id: m03-l15-q0214
  prompt:
    es: "Señale la respuesta CORRECTA sobre la imputación de renta inmobiliaria a los titulares de derechos de aprovechamiento por turno de bienes inmuebles, según el artículo 85.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "No procede la imputación cuando la duración del aprovechamiento no exceda de un mes por año."
  - id: b
    text:
      es: "No procede la imputación cuando la duración del aprovechamiento no exceda de una semana por año."
  - id: c
    text:
      es: "No procede la imputación cuando la duración del aprovechamiento no exceda de tres semanas por año."
  - id: d
    correct: true
    text:
      es: "No procede la imputación cuando la duración del aprovechamiento no exceda de dos semanas por año."
  explanation:
    es: "No hay imputación si el aprovechamiento por turno no excede de dos semanas por año (art. 85.3 LIRPF). Una, tres semanas o un mes son umbrales que el precepto no recoge."
  citation: "art. 85.3 LIRPF"
  difficulty: 1
  tags:
  - "imputación de rentas"
  - "plazo"
# anchor: boe-a-2006-20764-art-85
- id: m03-l15-q0215
  prompt:
    es: "Conforme al artículo 85.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿procede imputar renta inmobiliaria al titular de un derecho de aprovechamiento por turno de un apartamento durante diez días al año?"
  options:
  - id: a
    text:
      es: "No, porque los derechos de aprovechamiento por turno nunca generan renta imputada."
  - id: b
    correct: true
    text:
      es: "No, porque la duración del aprovechamiento no excede de dos semanas por año."
  - id: c
    text:
      es: "Sí, prorrateando el valor catastral en función de la duración anual del aprovechamiento."
  - id: d
    text:
      es: "Sí, imputándole el valor catastral íntegro, porque es titular de un derecho real."
  explanation:
    es: "Diez días son menos de dos semanas, y por debajo de ese límite no procede la imputación (art. 85.3 LIRPF). La imputación prorrateada es la regla para los turnos más largos. El valor íntegro no se imputa, y tampoco están excluidos todos los turnos: solo los de dos semanas por año o menos."
  citation: "art. 85.3 LIRPF"
  difficulty: 2
  tags:
  - "aprovechamiento por turno"
# anchor: boe-a-2006-20764-art-85
- id: m03-l15-q0216
  prompt:
    es: "De acuerdo con el artículo 85.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la atribución de las rentas inmobiliarias imputadas a los titulares de los bienes inmuebles:"
  options:
  - id: a
    text:
      es: "Se atribuyen conforme a la regla de los rendimientos de actividades económicas, a quien ordene los medios de producción."
  - id: b
    text:
      es: "Se atribuyen siempre por mitad a cada cónyuge, cualquiera que sea la titularidad jurídica de los bienes."
  - id: c
    correct: true
    text:
      es: "Se atribuyen conforme a la regla de los rendimientos del capital, que sigue la titularidad jurídica de los bienes y las pruebas aportadas."
  - id: d
    text:
      es: "Se atribuyen conforme a la regla de los rendimientos del trabajo, a quien haya generado el derecho a su percepción."
  explanation:
    es: "Las rentas imputadas se atribuyen a los titulares conforme al apartado 3 del artículo 11, la regla de los rendimientos del capital, que atiende a la titularidad jurídica y a las pruebas (art. 85.2 LIRPF). La del trabajo y la de actividades económicas son los apartados 2 y 4 del mismo artículo. Y el reparto por mitad solo opera con los bienes comunes del régimen matrimonial, salvo que se justifique otra cuota."
  citation: "art. 85.2 LIRPF"
  difficulty: 3
  tags:
  - "imputación de rentas"
  - "remisión"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0217
  prompt:
    es: "De acuerdo con el artículo 33.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son ganancias y pérdidas patrimoniales las variaciones en el valor del patrimonio del contribuyente que se pongan de manifiesto con ocasión de cualquier alteración en la composición de aquel, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "la ley las califique como rendimientos."
  - id: b
    text:
      es: "hayan transcurrido más de cuatro años desde la alteración."
  - id: c
    text:
      es: "no excedan del mínimo personal y familiar."
  - id: d
    text:
      es: "la ley las califique como rentas exentas."
  explanation:
    es: "Las variaciones patrimoniales son ganancias o pérdidas, salvo que la ley las califique como rendimientos (art. 33.1 LIRPF). Que sean exentas no excluye la categoría. Ni el paso de cuatro años ni el mínimo personal y familiar son excepciones."
  citation: "art. 33.1 LIRPF"
  difficulty: 1
  tags:
  - "ganancias y pérdidas"
  - "concepto"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0218
  prompt:
    es: "Señale la respuesta CORRECTA sobre los supuestos en que se estima que no existe alteración en la composición del patrimonio, según el artículo 33.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se estima que existe alteración en la disolución de la sociedad de gananciales, pero no en la extinción del régimen de participación."
  - id: b
    correct: true
    text:
      es: "Se estima que no existe alteración en la disolución de la sociedad de gananciales y en la extinción del régimen económico matrimonial de participación."
  - id: c
    text:
      es: "Se estima que no existe alteración en la transmisión onerosa de los bienes gananciales a un tercero."
  - id: d
    text:
      es: "Se estima que existe alteración en la división de la cosa común, que genera una ganancia o pérdida patrimonial."
  explanation:
    es: "La disolución de la sociedad de gananciales y la extinción del régimen de participación no alteran la composición del patrimonio (art. 33.2.b) LIRPF). Tampoco la división de la cosa común, que figura en la letra a). La transmisión onerosa a un tercero sí es una alteración."
  citation: "art. 33.2 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "no alteración"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0220
  prompt:
    es: "De acuerdo con el artículo 33.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los supuestos en que se estima que no existe ganancia o pérdida patrimonial:"
  options:
  - id: a
    correct: true
    text:
      es: "No existe en las reducciones del capital y con ocasión de las aportaciones a los patrimonios protegidos constituidos a favor de personas con discapacidad."
  - id: b
    text:
      es: "No existe en las ampliaciones de capital y con ocasión de las donaciones a favor de personas con discapacidad."
  - id: c
    text:
      es: "No existe en las reducciones del capital, pero sí con ocasión de las aportaciones a los patrimonios protegidos de personas con discapacidad."
  - id: d
    text:
      es: "No existe con ocasión de las aportaciones a patrimonios protegidos, pero sí en las reducciones del capital."
  explanation:
    es: "El artículo 33.3 LIRPF incluye las reducciones del capital (letra a) y las aportaciones a los patrimonios protegidos constituidos a favor de personas con discapacidad (letra e) entre los supuestos en que no existe ganancia ni pérdida. Las ampliaciones de capital y las donaciones no figuran. Y ambos supuestos están en la lista, no solo uno de ellos."
  citation: "art. 33.3 LIRPF"
  difficulty: 3
  tags:
  - "ganancias y pérdidas"
  - "no ganancia"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0221
  prompt:
    es: "Conforme al artículo 33.4.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las ganancias patrimoniales que se pongan de manifiesto con ocasión de la transmisión de la vivienda habitual por:"
  options:
  - id: a
    text:
      es: "personas con una discapacidad reconocida igual o superior al 33 por ciento."
  - id: b
    correct: true
    text:
      es: "mayores de 65 años o por personas en situación de dependencia severa o de gran dependencia."
  - id: c
    text:
      es: "mayores de 65 años exclusivamente, sin que la situación de dependencia sea relevante."
  - id: d
    text:
      es: "mayores de 60 años o por personas en situación de dependencia severa o de gran dependencia."
  explanation:
    es: "La exención alcanza a los mayores de 65 años y a las personas en situación de dependencia severa o de gran dependencia (art. 33.4.b) LIRPF). Los sesenta años no son el umbral, y limitarla a la edad omite el segundo grupo. La discapacidad del 33 por ciento no figura en la letra."
  citation: "art. 33.4 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "exención"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0222
  prompt:
    es: "Según el artículo 33.4.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la dación en pago de la vivienda habitual está exenta, y en todo caso es necesario que el propietario de la vivienda habitual no disponga de:"
  options:
  - id: a
    correct: true
    text:
      es: "otros bienes o derechos en cuantía suficiente para satisfacer la totalidad de la deuda y evitar la enajenación de la vivienda."
  - id: b
    text:
      es: "otros bienes inmuebles, cualquiera que sea su valor en relación con la deuda."
  - id: c
    text:
      es: "otra vivienda en propiedad situada en el mismo municipio que la vivienda habitual."
  - id: d
    text:
      es: "ingresos anuales superiores a tres veces el indicador público de renta de efectos múltiples."
  explanation:
    es: "El propietario no debe disponer de otros bienes o derechos en cuantía suficiente para satisfacer la totalidad de la deuda y evitar la enajenación de la vivienda (art. 33.4.d) LIRPF). Tener otra vivienda en el mismo municipio o ingresos superiores no son el criterio, y la tenencia de otros inmuebles solo importa si cubre la deuda, no cualquiera que sea su valor."
  citation: "art. 33.4 LIRPF"
  difficulty: 3
  tags:
  - "ganancias y pérdidas"
  - "dación en pago"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0224
  prompt:
    es: "De acuerdo con el artículo 33.4.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la dación en pago de la vivienda habitual está exenta cuando sirva para cancelar deudas garantizadas con hipoteca sobre ella, contraídas con entidades de crédito o con cualquier otra entidad que:"
  options:
  - id: a
    text:
      es: "pertenezca al mismo grupo familiar que el deudor."
  - id: b
    correct: true
    text:
      es: "de manera profesional realice la actividad de concesión de préstamos o créditos hipotecarios."
  - id: c
    text:
      es: "realice de forma ocasional la concesión de préstamos entre particulares."
  - id: d
    text:
      es: "sea una Administración Pública con competencias en materia de vivienda."
  explanation:
    es: "El acreedor puede ser una entidad de crédito u otra entidad que realice de manera profesional la concesión de préstamos o créditos hipotecarios (art. 33.4.d) LIRPF). El préstamo ocasional entre particulares, la Administración y los familiares no cumplen esa condición."
  citation: "art. 33.4 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "dación en pago"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0225
  prompt:
    es: "Conforme al artículo 33.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las pérdidas patrimoniales excluidas del cómputo:"
  options:
  - id: a
    text:
      es: "No se computan las debidas a pérdidas en el juego que excedan de las ganancias obtenidas en el juego durante los cuatro períodos anteriores."
  - id: b
    text:
      es: "No se computan las debidas a pérdidas en el juego obtenidas en el período impositivo, aunque no excedan de las ganancias obtenidas en el juego."
  - id: c
    correct: true
    text:
      es: "No se computan las debidas a pérdidas en el juego obtenidas en el período impositivo que excedan de las ganancias obtenidas en el juego en el mismo período."
  - id: d
    text:
      es: "No se computan las debidas a pérdidas en el juego que excedan del 50 por ciento de las ganancias patrimoniales del período."
  explanation:
    es: "Las pérdidas en el juego solo se descuentan hasta las ganancias en el juego del mismo período, y el exceso no se computa (art. 33.5.d) LIRPF). No quedan excluidas todas las pérdidas. Y el límite no se mide con períodos anteriores ni con las ganancias patrimoniales en general."
  citation: "art. 33.5 LIRPF"
  difficulty: 3
  tags:
  - "ganancias y pérdidas"
  - "pérdidas no computables"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0226
  prompt:
    es: "Según el artículo 33.5.e) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la pérdida derivada de la transmisión de un elemento patrimonial no se computa cuando el transmitente lo vuelva a adquirir dentro del año siguiente a la transmisión, y esa pérdida se integra cuando se produzca:"
  options:
  - id: a
    text:
      es: "el transcurso de un año desde la readquisición."
  - id: b
    text:
      es: "la readquisición del elemento patrimonial."
  - id: c
    correct: true
    text:
      es: "la posterior transmisión del elemento patrimonial."
  - id: d
    text:
      es: "la declaración del período impositivo siguiente a la readquisición."
  explanation:
    es: "La pérdida diferida se integra cuando se produce la posterior transmisión del elemento patrimonial (art. 33.5.e) LIRPF). La readquisición es lo que la difiere, no lo que la integra, y el paso de un año o la declaración siguiente no son el momento que fija el precepto."
  citation: "art. 33.5 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "pérdidas no computables"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0228
  prompt:
    es: "Berta Ríos vende el 15 de marzo de 2026 unas participaciones con una pérdida de 5.000 euros y las vuelve a adquirir el 20 de abril de 2027. Conforme al artículo 33.5.e) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿computa la pérdida patrimonial de 2026?"
  options:
  - id: a
    text:
      es: "No, porque vuelve a adquirirlas en un período impositivo posterior al de la transmisión."
  - id: b
    text:
      es: "No, porque la pérdida se integra cuando se produzca la posterior transmisión de las participaciones."
  - id: c
    text:
      es: "Sí, pero solo en la mitad de su importe, por haberlas readquirido."
  - id: d
    correct: true
    text:
      es: "Sí, porque la readquisición se produce pasado más de un año desde la transmisión."
  explanation:
    es: "El año siguiente a la transmisión del 15 de marzo de 2026 termina el 15 de marzo de 2027, y la readquisición del 20 de abril de 2027 llega después. La pérdida se computa íntegra en 2026 (art. 33.5.e) LIRPF). La integración diferida solo opera si se readquiere dentro del año, y no existe cómputo parcial."
  citation: "art. 33.5 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "pérdidas no computables"
# anchor: boe-a-2006-20764-art-34
- id: m03-l15-q0229
  prompt:
    es: "De conformidad con el artículo 34.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el importe de las ganancias o pérdidas patrimoniales es, en el supuesto de transmisión onerosa o lucrativa:"
  options:
  - id: a
    text:
      es: "el valor de mercado de los elementos patrimoniales o de sus partes proporcionales."
  - id: b
    text:
      es: "la diferencia entre el valor catastral y el valor de adquisición de los elementos patrimoniales."
  - id: c
    text:
      es: "el valor de transmisión de los elementos patrimoniales, minorado en el mínimo personal y familiar."
  - id: d
    correct: true
    text:
      es: "la diferencia entre los valores de adquisición y transmisión de los elementos patrimoniales."
  explanation:
    es: "En las transmisiones, onerosas o lucrativas, el importe es la diferencia entre los valores de adquisición y de transmisión (art. 34.1.a) LIRPF). El valor de mercado es el criterio de los demás supuestos. El valor catastral no interviene, y el mínimo personal y familiar no reduce la ganancia."
  citation: "art. 34.1 LIRPF"
  difficulty: 1
  tags:
  - "ganancias y pérdidas"
  - "importe"
# anchor: boe-a-2006-20764-art-34
- id: m03-l15-q0230
  prompt:
    es: "Señale la respuesta CORRECTA sobre el importe de las ganancias o pérdidas patrimoniales en los supuestos distintos de la transmisión onerosa o lucrativa, de acuerdo con el artículo 34.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Es la diferencia entre el valor de mercado y el valor catastral de los elementos patrimoniales."
  - id: b
    text:
      es: "Es el coste de adquisición de los elementos patrimoniales, actualizado por el índice de precios al consumo."
  - id: c
    text:
      es: "Es la diferencia entre los valores de adquisición y transmisión de los elementos patrimoniales."
  - id: d
    correct: true
    text:
      es: "Es el valor de mercado de los elementos patrimoniales o de sus partes proporcionales, en su caso."
  explanation:
    es: "En los supuestos distintos de la transmisión, el importe es el valor de mercado de los elementos o de sus partes proporcionales (art. 34.1.b) LIRPF). La diferencia entre adquisición y transmisión es la regla de la transmisión. Ni el valor catastral ni la actualización por índices son el criterio."
  citation: "art. 34.1 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "importe"
# anchor: boe-a-2006-20764-art-39
- id: m03-l15-q0232
  prompt:
    es: "Conforme al artículo 39 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son ganancias de patrimonio no justificadas los bienes cuya tenencia, declaración o adquisición no se corresponda con la renta o patrimonio declarados y la inclusión de deudas inexistentes en declaraciones de este impuesto o del:"
  options:
  - id: a
    text:
      es: "Impuesto sobre Sociedades, o su registro en los libros o registros oficiales."
  - id: b
    correct: true
    text:
      es: "Impuesto sobre el Patrimonio, o su registro en los libros o registros oficiales."
  - id: c
    text:
      es: "Impuesto sobre el Valor Añadido, o su registro en los libros o registros oficiales."
  - id: d
    text:
      es: "Impuesto sobre Sucesiones y Donaciones, o su registro en los libros o registros oficiales."
  explanation:
    es: "La inclusión de deudas inexistentes en declaraciones del IRPF o del Impuesto sobre el Patrimonio, o su registro en libros o registros oficiales, genera ganancias no justificadas (art. 39 LIRPF). Sociedades, Sucesiones y Donaciones y el IVA no figuran como impuestos de referencia."
  citation: "art. 39 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "no justificadas"
# anchor: boe-a-2006-20764-art-39
- id: m03-l15-q0233
  prompt:
    es: "De acuerdo con el artículo 39 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la integración de las ganancias patrimoniales no justificadas:"
  options:
  - id: a
    text:
      es: "Se integran en la base liquidable general del período impositivo en que se adquirieron los bienes, salvo prueba suficiente de titularidad desde fecha anterior a la del período de prescripción."
  - id: b
    text:
      es: "Se integran en la base liquidable del ahorro del período impositivo respecto del que se descubran, salvo prueba suficiente de titularidad desde fecha anterior a la del período de prescripción."
  - id: c
    text:
      es: "Se integran en la base liquidable general del período impositivo respecto del que se descubran, sin que se admita prueba de titularidad anterior."
  - id: d
    correct: true
    text:
      es: "Se integran en la base liquidable general del período impositivo respecto del que se descubran, salvo prueba suficiente de titularidad desde fecha anterior a la del período de prescripción."
  explanation:
    es: "Las ganancias no justificadas van a la base liquidable general del período en que se descubren, salvo prueba de titularidad desde antes del período de prescripción (art. 39 LIRPF). La base del ahorro no es la que corresponde. El período de adquisición no es el de integración, y la prueba en contrario sí se admite."
  citation: "art. 39 LIRPF"
  difficulty: 3
  tags:
