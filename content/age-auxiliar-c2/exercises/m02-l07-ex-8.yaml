- id: m02-l07-q162
  prompt:
    es: "En Windows 11, ¿cómo se imprime un recorte de imagen que ya se ha guardado con la herramienta Recortes?"
  options:
  - id: a
    text:
      es: "Con Ver más › Compartir, desde la ventana de Recortes"
  - id: b
    text:
      es: "Con Alt+D, desde la ventana de la herramienta Recortes"
  - id: c
    text:
      es: "Con Editar › Editar con Paint, en un recorte de vídeo"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en el recorte guardado y la opción Imprimir"
  explanation:
    es: "La página dice que, en la carpeta donde se haya guardado el recorte, se hace clic con el botón derecho en él y se selecciona Imprimir. Ver más › Compartir envía el recorte, Alt+D retrasa la captura y Editar con Paint se usa con una captura de imagen."
