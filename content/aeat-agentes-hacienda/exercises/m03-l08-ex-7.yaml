# anchor: boe-a-2007-15984-art-189
- id: m03-l08-q0217
  prompt:
    es: "De acuerdo con el artículo 189.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el procedimiento inspector terminará mediante liquidación del órgano competente para liquidar, por el acto de alteración catastral o por:"
  options:
  - id: a
    text:
      es: "La firma de las actas por el obligado tributario y el actuario."
  - id: b
    text:
      es: "La conclusión del trámite de audiencia ante el órgano de inspección."
  - id: c
    correct: true
    text:
      es: "Las demás formas previstas en ese mismo artículo."
  - id: d
    text:
      es: "El transcurso del plazo máximo de duración del procedimiento inspector."
  explanation:
    es: "El artículo 189.1 enumera la liquidación, el acto de alteración catastral y las demás formas que prevé el propio artículo. La firma de las actas y el fin de la audiencia son trámites previos, y vencer el plazo no determina la caducidad, de modo que el procedimiento sigue (art. 150.6 LGT)."
  citation: "art. 189.1 RGAT"
  difficulty: 1
  tags:
  - "terminación"
# anchor: boe-a-2007-15984-art-189
- id: m03-l08-q0219
  prompt:
    es: "Según el artículo 189.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actuaciones de comprobación de obligaciones formales terminarán mediante diligencia o informe, salvo que:"
  options:
  - id: a
    text:
      es: "El obligado tributario solicite que terminen mediante acta."
  - id: b
    text:
      es: "El órgano competente para liquidar acuerde su terminación mediante liquidación."
  - id: c
    correct: true
    text:
      es: "La normativa tributaria establezca otra cosa."
  - id: d
    text:
      es: "Se aprecien infracciones tributarias en la conducta del obligado."
  explanation:
    es: "La comprobación de obligaciones formales termina por diligencia o informe salvo que la normativa tributaria disponga otra cosa (art. 189.5). La petición del obligado, la decisión del órgano que liquida y la apreciación de infracciones no cambian la forma de terminación."
  citation: "art. 189.5 RGAT"
  difficulty: 1
  tags:
  - "terminación"
  - "obligaciones formales"
# anchor: boe-a-2007-15984-art-185
- id: m03-l08-q0221
  prompt:
    es: "Conforme al artículo 185.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, concluido, en su caso, el trámite de audiencia, el resultado de las actuaciones de comprobación e investigación se documenta en:"
  options:
  - id: a
    text:
      es: "Las diligencias de inspección, firmadas por el funcionario y por el obligado tributario."
  - id: b
    correct: true
    text:
      es: "Las actas de inspección, firmadas por el funcionario y por el obligado tributario."
  - id: c
    text:
      es: "Los informes del actuario, firmados por el funcionario y notificados al obligado tributario."
  - id: d
    text:
      es: "Las comunicaciones de resultado, firmadas por el funcionario y notificadas al obligado tributario."
  explanation:
    es: "Concluida la audiencia, el resultado se documenta en actas de inspección (art. 185.1). Las diligencias hacen constar hechos y manifestaciones, los informes completan la información del acta y las comunicaciones notifican el inicio u otros hechos."
  citation: "art. 185.1 RGAT"
  difficulty: 1
  tags:
  - "actas"
  - "formalización"
# anchor: boe-a-2007-15984-art-185
- id: m03-l08-q0222
  prompt:
    es: "De acuerdo con el artículo 185.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la firma de las actas de inspección:"
  options:
  - id: a
    text:
      es: "Si el obligado no sabe o no puede firmar, no comparece o se niega a suscribirlas, el acta carece de validez hasta su nueva citación."
  - id: b
    correct: true
    text:
      es: "Si el obligado no sabe o no puede firmar, no comparece o se niega a suscribirlas, las firma solo el funcionario y se hace constar la circunstancia."
  - id: c
    text:
      es: "Si el obligado se niega a suscribirlas, las firma un testigo designado por la inspección junto con el funcionario."
  - id: d
    text:
      es: "Si el obligado no comparece en el lugar y fecha señalados, el acta se firma por su representante o por el órgano que liquida."
  explanation:
    es: "En esos casos las actas las firma solo el funcionario y se hace constar la circunstancia (art. 185.2). No pierden validez, no se exige testigo y no las firma el representante ni el órgano que liquida."
  citation: "art. 185.2 RGAT"
  difficulty: 2
  tags:
  - "actas"
  - "firma"
# anchor: boe-a-2003-23186-art-154
- id: m03-l08-q0223
  prompt:
    es: "Según el artículo 154.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a efectos de su tramitación, las actas de inspección pueden ser:"
  options:
  - id: a
    text:
      es: "Con acuerdo, de conformidad, de disconformidad o de comprobado y conforme."
  - id: b
    text:
      es: "De conformidad, de disconformidad o de infracción, según el contenido de la propuesta."
  - id: c
    correct: true
    text:
      es: "Con acuerdo, de conformidad o de disconformidad."
  - id: d
    text:
      es: "Previas, definitivas o complementarias, según el momento de su formalización."
  explanation:
    es: "El artículo 154.1 distingue tres clases: con acuerdo, de conformidad y de disconformidad. No existe la de comprobado y conforme en la Ley, ni las de infracción, ni las previas, definitivas o complementarias."
  citation: "art. 154.1 LGT"
  difficulty: 1
  tags:
  - "actas"
  - "clases"
# anchor: boe-a-2003-23186-art-154
- id: m03-l08-q0224
  prompt:
    es: "¿Cómo se tramita el acta cuando el obligado tributario o su representante se niegan a recibirla o a suscribirla, según el artículo 154.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Como de conformidad, por silencio del obligado."
  - id: b
    text:
      es: "Como con acuerdo, por aceptación tácita de la propuesta."
  - id: c
    text:
      es: "Como de infracción, remitida al órgano sancionador."
  - id: d
    correct: true
    text:
      es: "Como de disconformidad."
  explanation:
    es: "Si el obligado o su representante se niega a recibir o suscribir el acta, se tramita como de disconformidad (art. 154.2). El silencio no equivale a conformidad ni a acuerdo, y no se remite como acta de infracción."
  citation: "art. 154.2 LGT"
  difficulty: 1
  tags:
  - "actas"
  - "disconformidad"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0226
  prompt:
    es: "De acuerdo con el artículo 155.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración podrá concretar la aplicación de conceptos jurídicos indeterminados, la apreciación de hechos o la estimación, valoración o medición mediante un acuerdo con el obligado, con carácter previo:"
  options:
  - id: a
    text:
      es: "A la comunicación de inicio del procedimiento inspector."
  - id: b
    correct: true
    text:
      es: "A la liquidación de la deuda tributaria."
  - id: c
    text:
      es: "A la apertura del trámite de audiencia ante la inspección."
  - id: d
    text:
      es: "A la formalización de las actas de conformidad o disconformidad."
  explanation:
    es: "El acuerdo se concreta con carácter previo a la liquidación de la deuda tributaria (art. 155.1). No se concluye antes de iniciar el procedimiento ni antes de la audiencia, y puede alcanzarse cuando ya se han examinado los hechos."
  citation: "art. 155.1 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "momento"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0228
  prompt:
    es: "Según el artículo 155.2.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, el acta con acuerdo incluirá necesariamente la manifestación expresa de la conformidad del obligado tributario:"
  options:
  - id: a
    text:
      es: "Con la propuesta de regularización, pero no con la propuesta de sanción."
  - id: b
    text:
      es: "Con los hechos y su valoración, pero no con la cuantificación de la deuda."
  - id: c
    correct: true
    text:
      es: "Con la totalidad del contenido a que se refieren los párrafos anteriores."
  - id: d
    text:
      es: "Con el fundamento de la estimación o medición, pero no con la propuesta de regularización."
  explanation:
    es: "La conformidad se refiere a la totalidad del contenido de las letras anteriores: fundamento, propuesta de regularización y propuesta de sanción (art. 155.2.d). Las demás opciones la limitan a una parte."
  citation: "art. 155.2 LGT"
  difficulty: 2
  tags:
  - "actas con acuerdo"
  - "contenido"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0232
  prompt:
    es: "De acuerdo con el artículo 155.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el acuerdo se perfeccionará mediante la suscripción del acta por:"
  options:
  - id: a
    text:
      es: "El obligado tributario o su representante y el órgano competente para liquidar."
  - id: b
    text:
      es: "El obligado tributario o su representante, una vez notificada la liquidación."
  - id: c
    correct: true
    text:
      es: "El obligado tributario o su representante y la inspección de los tributos."
  - id: d
    text:
      es: "El actuario y el jefe de la dependencia, tras la autorización del acuerdo."
  explanation:
    es: "El acuerdo se perfecciona con la suscripción del acta por el obligado o su representante y por la inspección (art. 155.4). El órgano que liquida autoriza, no suscribe, y la liquidación llega después. Tampoco basta la firma de dos funcionarios."
  citation: "art. 155.4 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "perfección"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0233
  prompt:
    es: "Conforme al artículo 155.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se entenderá producida y notificada la liquidación, y en su caso la sanción, en los términos de las propuestas, si transcurridos diez días desde el siguiente a la fecha del acta no se ha notificado:"
  options:
  - id: a
    correct: true
    text:
      es: "Acuerdo del órgano competente para liquidar rectificando los errores materiales que pudiera contener el acta con acuerdo."
  - id: b
    text:
      es: "Acuerdo del órgano competente para liquidar ordenando completar el expediente mediante las actuaciones que procedan."
  - id: c
    text:
      es: "Acuerdo del órgano competente para liquidar estimando error en la apreciación de los hechos o indebida aplicación de las normas."
  - id: d
    text:
      es: "Acuerdo del órgano competente para liquidar confirmando la liquidación propuesta en el acta con acuerdo."
  explanation:
    es: "En el acta con acuerdo solo cabe notificar, en diez días, un acuerdo que rectifique errores materiales (art. 155.5). Completar el expediente, estimar error en la apreciación de los hechos o confirmar son contenidos del acuerdo posterior al acta de conformidad (art. 156.3), no del acta con acuerdo."
  citation: "art. 155.5 LGT"
  difficulty: 3
  tags:
  - "actas con acuerdo"
  - "plazo"
  - "10 días"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0234
  prompt:
    es: "De acuerdo con el artículo 186.7 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el plazo que tiene el órgano competente para liquidar, una vez firmada el acta con acuerdo, para notificar una liquidación que rectifique los errores materiales:"
  options:
  - id: a
    correct: true
    text:
      es: "Es de 10 días hábiles, contados a partir del día siguiente al de la fecha del acta."
  - id: b
    text:
      es: "Es de 10 días naturales, contados a partir del día siguiente al de la fecha del acta."
  - id: c
    text:
      es: "Es de un mes, contado a partir del día siguiente al de la fecha del acta."
  - id: d
    text:
      es: "Es de 15 días hábiles, contados a partir del día siguiente al de la notificación del acta."
  explanation:
    es: "El reglamento precisa que son diez días hábiles desde el día siguiente a la fecha del acta (art. 186.7). La ley habla de diez días a secas, no naturales. Un mes es el plazo de las actas de conformidad, y quince días el de alegaciones en la de disconformidad."
  citation: "art. 186.7 RGAT"
  difficulty: 3
  tags:
  - "actas con acuerdo"
  - "plazo"
  - "10 días"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0235
  prompt:
    es: "Según el artículo 155.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la liquidación y la sanción derivadas del acuerdo solo podrán ser objeto de impugnación o revisión en vía administrativa por el procedimiento de:"
  options:
  - id: a
    text:
      es: "Revisión de actos nulos o de recurso de reposición, sin perjuicio de la reclamación económico-administrativa por vicios en el consentimiento."
  - id: b
    text:
      es: "Recurso de reposición, sin perjuicio de la reclamación económico-administrativa por vicios en el consentimiento."
  - id: c
    text:
      es: "Rectificación de errores materiales, sin perjuicio del recurso contencioso-administrativo por error de hecho."
  - id: d
    correct: true
    text:
      es: "Declaración de nulidad de pleno derecho, sin perjuicio del recurso contencioso-administrativo por vicios en el consentimiento."
  explanation:
    es: "El contenido del acta con acuerdo se entiende íntegramente aceptado, y la liquidación y la sanción solo se impugnan en vía administrativa por nulidad de pleno derecho (art. 155.6), sin perjuicio del recurso contencioso-administrativo por vicios en el consentimiento. La reposición y la reclamación económico-administrativa no están abiertas."
  citation: "art. 155.6 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "recursos"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0236
  prompt:
    es: "Conforme al artículo 155.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la falta de suscripción de un acta con acuerdo en un procedimiento inspector:"
  options:
  - id: a
    text:
      es: "Puede ser motivo de recurso contra las liquidaciones derivadas de actas de conformidad, pero no contra las derivadas de actas de disconformidad."
  - id: b
    text:
      es: "Puede ser motivo de reclamación económico-administrativa contra la liquidación que ponga fin al procedimiento."
  - id: c
    correct: true
    text:
      es: "No puede ser motivo de recurso o reclamación contra las liquidaciones derivadas de actas de conformidad o de disconformidad."
  - id: d
    text:
      es: "Determina la nulidad de las actas de conformidad o de disconformidad que se formalicen después en el procedimiento."
  explanation:
    es: "La falta de suscripción del acta con acuerdo no puede alegarse contra las liquidaciones de actas de conformidad o de disconformidad (art. 155.7). No sirve de motivo en ninguna de ellas ni hace nulas las actas posteriores."
  citation: "art. 155.7 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "recursos"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0237
  prompt:
    es: "Según el artículo 186.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando el órgano inspector entienda que puede proceder un acuerdo, ¿qué puede hacer el obligado tributario tras la comunicación que se le dirige?"
  options:
  - id: a
    text:
      es: "Exigir al órgano inspector la suscripción del acuerdo en el plazo de diez días."
  - id: b
    correct: true
    text:
      es: "Formular una propuesta con el fin de alcanzar un acuerdo."
  - id: c
    text:
      es: "Solicitar al órgano competente para liquidar la autorización del acuerdo."
  - id: d
    text:
      es: "Renunciar al trámite de audiencia y a la tramitación separada de la sanción."
  explanation:
    es: "Tras la comunicación del órgano inspector, el obligado puede formular una propuesta para alcanzar el acuerdo (art. 186.1). No puede exigir la suscripción, la autorización se solicita por el órgano inspector (art. 186.2) y la renuncia a la tramitación separada es contenido del acta."
  citation: "art. 186.1 RGAT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "tramitación"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0238
  prompt:
    es: "De acuerdo con el artículo 186.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la autorización del órgano competente para liquidar deberá ser expresa y anterior o simultánea a la suscripción del acta, y:"
  options:
  - id: a
    text:
      es: "Se notificará al obligado por separado, antes de la suscripción del acta."
  - id: b
    text:
      es: "Se incorporará a la liquidación que se dicte con posterioridad al acta."
  - id: c
    text:
      es: "Se archivará en el expediente de la dependencia, sin incorporarse al acta."
  - id: d
    correct: true
    text:
      es: "Se adjuntará a esta, como parte del acta suscrita."
  explanation:
    es: "La autorización debe ser expresa, anterior o simultánea a la firma, y se adjunta al acta (art. 186.4). No se notifica por separado, no se incorpora a la liquidación posterior ni se archiva aparte."
  citation: "art. 186.4 RGAT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "autorización"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0239
  prompt:
    es: "Conforme al artículo 186.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la garantía que debe acreditar el obligado antes de firmar el acta con acuerdo:"
  options:
  - id: a
    text:
      es: "El depósito cubre el importe total de la deuda y de la sanción más el 20 por ciento, y el aval o seguro de caución cubre solo ese importe."
  - id: b
    correct: true
    text:
      es: "El depósito cubre el importe total de la deuda y de la sanción, y el aval o seguro de caución cubre ese importe más el 20 por ciento de ambas cantidades."
  - id: c
    text:
      es: "El depósito y el aval cubren el importe total de la deuda tributaria, sin incluir la sanción, más el 20 por ciento."
  - id: d
    text:
      es: "El depósito y el aval cubren el importe total de la deuda y de la sanción, y el seguro de caución el 50 por ciento."
  explanation:
    es: "El depósito cubre deuda y sanción; el aval o el seguro de caución, deuda, sanción y el 20 por ciento de ambas (art. 186.5). No se invierten los porcentajes entre depósito y aval, la sanción forma parte de la cobertura y el seguro de caución no tiene un 50 por ciento propio."
  citation: "art. 186.5 RGAT"
  difficulty: 2
  tags:
  - "actas con acuerdo"
  - "garantía"
  - "20 por ciento"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0241
  prompt:
    es: "Según el artículo 186.6 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si en el momento señalado para la firma del acta no se hubiese aportado el justificante de la constitución del depósito o garantía, se entenderá que el obligado:"
  options:
  - id: a
    text:
      es: "Ha renunciado a todos los recursos contra la liquidación."
  - id: b
    text:
      es: "Ha prestado su conformidad con la propuesta de regularización."
  - id: c
    correct: true
    text:
      es: "Ha desistido de la formalización del acta con acuerdo."
  - id: d
    text:
      es: "Ha aplazado la firma del acta con acuerdo hasta la liquidación."
  explanation:
    es: "La falta del justificante al firmar equivale a desistir de formalizar el acta con acuerdo (art. 186.6). No implica renunciar a recursos, prestar conformidad ni aplazar la firma."
  citation: "art. 186.6 RGAT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "desistimiento"
# anchor: boe-a-2003-23186-art-156
- id: m03-l08-q0246
  prompt:
    es: "Según el artículo 156.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, con carácter previo a la firma del acta de conformidad se concederá al interesado:"
  options:
  - id: a
    text:
      es: "Plazo de diez días para que acredite la constitución del depósito o garantía."
  - id: b
    correct: true
    text:
      es: "Trámite de audiencia para que alegue lo que convenga a su derecho."
  - id: c
    text:
      es: "Plazo de quince días para que formule alegaciones ante el órgano que liquida."
  - id: d
    text:
      es: "Trámite de conformidad para que manifieste si acepta la propuesta de sanción."
  explanation:
    es: "Antes de firmar el acta de conformidad se concede trámite de audiencia (art. 156.1). El depósito o garantía es requisito del acta con acuerdo, las alegaciones de quince días son propias del acta de disconformidad y no existe un trámite de conformidad sobre la sanción."
  citation: "art. 156.1 LGT"
  difficulty: 1
  tags:
  - "actas de conformidad"
  - "audiencia"
# anchor: boe-a-2003-23186-art-156
- id: m03-l08-q0247
  prompt:
    es: "De acuerdo con el artículo 156.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a los hechos y elementos determinantes de la deuda respecto de los que el obligado prestó su conformidad en el acta se les aplica:"
  options:
  - id: a
    text:
      es: "La presunción de certeza de los hechos aceptados en las actas, que pueden rectificarse mediante simple manifestación posterior del obligado."
  - id: b
    text:
      es: "La exigencia de que el órgano competente para liquidar ratifique la conformidad en el plazo de un mes desde la fecha del acta."
  - id: c
    correct: true
    text:
      es: "La presunción de certeza de los hechos aceptados en las actas, que solo pueden rectificarse mediante prueba de error de hecho."
  - id: d
    text:
      es: "La prohibición de impugnar la liquidación resultante en vía administrativa y en vía contencioso-administrativa."
  explanation:
    es: "El artículo 156.5 remite al artículo 144.2: los hechos aceptados se presumen ciertos y solo se rectifican con prueba de error de hecho. No basta una manifestación posterior, no hay ratificación de la conformidad y la liquidación resultante sí puede recurrirse (art. 187.4 RGAT)."
  citation: "art. 156.5 LGT"
  difficulty: 2
  tags:
  - "actas de conformidad"
  - "hechos aceptados"
# anchor: boe-a-2007-15984-art-187
- id: m03-l08-q0248
  prompt:
    es: "Conforme al artículo 187.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la conformidad manifestada por el obligado en un acta de conformidad:"
  options:
  - id: a
    text:
      es: "El obligado puede revocarla dentro del plazo de un mes desde la fecha del acta, sin necesidad de justificación."
  - id: b
    text:
      es: "El obligado no puede revocarla ni recurrir contra la liquidación resultante, que queda aceptada íntegramente."
  - id: c
    text:
      es: "El obligado puede revocarla ante el órgano competente para liquidar, que decide con carácter definitivo."
  - id: d
    correct: true
    text:
      es: "El obligado no puede revocarla, sin perjuicio de su derecho a recurrir contra la liquidación resultante."
  explanation:
    es: "El obligado no puede revocar la conformidad, pero conserva el derecho a recurrir contra la liquidación resultante (art. 187.4). La aceptación íntegra sin posibilidad de recurso es el régimen del acta con acuerdo (art. 155.6)."
  citation: "art. 187.4 RGAT"
  difficulty: 2
  tags:
  - "actas de conformidad"
  - "revocación"
# anchor: boe-a-2007-15984-art-187
- id: m03-l08-q0249
  prompt:
    es: "Conforme al artículo 187.3.b del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si se notifica un acuerdo de rectificación por error en la apreciación de los hechos o indebida aplicación de las normas, el obligado dispone para alegar de:"
  options:
  - id: a
    correct: true
    text:
      es: "Quince días, contados desde el día siguiente al de la notificación de la apertura de dicho plazo."
  - id: b
    text:
      es: "Diez días hábiles, contados desde el día siguiente al de la notificación de la apertura de dicho plazo."
  - id: c
    text:
      es: "Quince días, contados desde el día siguiente a la fecha del acta de conformidad."
  - id: d
    text:
      es: "Un mes, contado desde el día siguiente al de la notificación del acuerdo de rectificación."
  explanation:
    es: "El plazo es de quince días desde el día siguiente a la notificación de la apertura (art. 187.3.b). Diez días es el del acta con acuerdo, y no se cuenta desde la fecha del acta ni es de un mes, que es el plazo del órgano que liquida."
  citation: "art. 187.3 RGAT"
  difficulty: 2
  tags:
  - "actas de conformidad"
  - "plazo"
  - "15 días"
# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0251
  prompt:
    es: "Conforme al artículo 157.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el informe del actuario en las actas de disconformidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Se podrá acompañar un informe del actuario cuando sea preciso completar la información recogida en el acta."
  - id: b
    text:
      es: "Se acompañará en todo caso un informe del actuario para completar la información recogida en el acta."
  - id: c
    text:
      es: "Se acompañará un informe razonado sobre las causas determinantes de la aplicación del método de estimación indirecta."
  - id: d
    text:
      es: "Se podrá acompañar un informe del órgano competente para liquidar sobre las alegaciones que presente el obligado."
  explanation:
    es: "En la disconformidad el informe del actuario es facultativo: se podrá acompañar cuando sea preciso completar la información del acta (art. 157.2). El informe razonado es obligatorio solo con estimación indirecta (art. 158.1), y el informe lo emite el actuario, no el órgano que liquida."
  citation: "art. 157.2 LGT"
  difficulty: 1
  tags:
  - "actas de disconformidad"
  - "informe"
# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0252
  prompt:
    es: "De acuerdo con el artículo 157.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el acta de disconformidad el obligado podrá formular alegaciones ante el órgano competente para liquidar en el plazo de 15 días desde la fecha en que se haya extendido el acta o:"
  options:
  - id: a
    text:
      es: "Desde la apertura del trámite de audiencia."
  - id: b
    text:
      es: "Desde la notificación de la propuesta de liquidación."
  - id: c
    text:
      es: "Desde la remisión del acta al órgano que liquida."
  - id: d
    correct: true
    text:
      es: "Desde la notificación de la misma."
  explanation:
    es: "El plazo de quince días corre desde la fecha del acta o desde su notificación (art. 157.3). No desde la apertura de la audiencia, que es previa, ni desde otras notificaciones o remisiones internas."
  citation: "art. 157.3 LGT"
  difficulty: 1
  tags:
  - "actas de disconformidad"
  - "plazo"
  - "15 días"
# anchor: boe-a-2007-15984-art-188
- id: m03-l08-q0253
  prompt:
    es: "Según el artículo 188.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿en qué supuestos se formaliza un acta de disconformidad?"
  options:
  - id: a
    text:
      es: "Cuando el obligado se niega a suscribir el acta o la suscribe sin prestar conformidad, pero no cuando deja de comparecer en la fecha señalada."
  - id: b
    correct: true
    text:
      es: "Cuando el obligado se niega a suscribir el acta, la suscribe sin prestar conformidad o no comparece en la fecha señalada para la firma."
  - id: c
    text:
      es: "Cuando el obligado no comparece en la fecha señalada, pero no cuando se niega a suscribir el acta que se le presenta."
  - id: d
    text:
      es: "Cuando el obligado suscribe el acta con acuerdo y no constituye el depósito o la garantía exigidos."
  explanation:
    es: "Se formaliza en tres casos: negativa a suscribir, suscripción sin conformidad y falta de comparecencia en la fecha señalada (art. 188.1). Las opciones que excluyen un supuesto lo recortan, y la falta de garantía en el acta con acuerdo lleva a entender desistida su formalización (art. 186.6)."
  citation: "art. 188.1 RGAT"
  difficulty: 2
  tags:
  - "actas de disconformidad"
  - "supuestos"
# anchor: boe-a-2007-15984-art-188
- id: m03-l08-q0255
  prompt:
    es: "Conforme al artículo 188.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en el acta de disconformidad la información recogida en el acta que sea necesario completar podrá ser objeto de desarrollo en un informe ampliatorio:"
  options:
  - id: a
    text:
      es: "Que se notificará al obligado tributario tras el vencimiento del plazo de alegaciones."
  - id: b
    text:
      es: "Que se remitirá al órgano competente para liquidar sin entregarse al obligado."
  - id: c
    text:
      es: "Que se incorporará a la liquidación cuando esta sea notificada al obligado."
  - id: d
    correct: true
    text:
      es: "Que se entregará al obligado tributario de forma conjunta con el acta."
  explanation:
    es: "El informe ampliatorio se entrega al obligado junto con el acta (art. 188.2). No se notifica después del plazo de alegaciones, no se reserva al órgano que liquida y no espera a la liquidación."
  citation: "art. 188.2 RGAT"
  difficulty: 1
  tags:
  - "actas de disconformidad"
  - "informe"
