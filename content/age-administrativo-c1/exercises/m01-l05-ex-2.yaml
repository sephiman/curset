# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q013
  prompt:
    es: "De acuerdo con el artículo 18.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en las reuniones del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Director del Secretariado del Gobierno."
  - id: b
    correct: true
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  - id: c
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Subsecretario de la Presidencia."
  - id: d
    text:
      es: "El Vicepresidente primero las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  explanation:
    es: "El artículo 18.1 dice: «El Presidente del Gobierno convoca y preside las reuniones del Consejo de Ministros, actuando como Secretario el Ministro de la Presidencia». El Director del Secretariado del Gobierno suple al Secretario de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.3). El Subsecretario de la Presidencia es el Secretario de esa Comisión, no del Consejo. El Consejo lo convoca y preside el Presidente, no un Vicepresidente."
  citation: "art. 18.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q014
  prompt:
    es: "¿Qué carácter podrán tener las reuniones del Consejo de Ministros que convoca y preside el Presidente del Gobierno?"
  options:
  - id: a
    text:
      es: "Podrán tener carácter ordinario o extraordinario."
  - id: b
    text:
      es: "Podrán tener carácter público o reservado."
  - id: c
    correct: true
    text:
      es: "Podrán tener carácter decisorio o deliberante."
  - id: d
    text:
      es: "Podrán tener carácter decisorio, consultivo o informativo."
  explanation:
    es: "El artículo 18.2 dice que las reuniones «podrán tener carácter decisorio o deliberante». La ley no las clasifica en ordinarias y extraordinarias. No son públicas: sus deliberaciones son secretas (art. 5.3). La ley no prevé reuniones consultivas ni informativas."
  citation: "art. 18.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q015
  prompt:
    es: "¿Qué carácter tienen las deliberaciones del Consejo de Ministros, a cuyas reuniones pueden asistir los Secretarios de Estado cuando sean convocados?"
  options:
  - id: a
    text:
      es: "Las deliberaciones del Consejo son reservadas."
  - id: b
    text:
      es: "Las deliberaciones del Consejo son públicas."
  - id: c
    text:
      es: "Las deliberaciones del Consejo constan íntegras en el acta."
  - id: d
    correct: true
    text:
      es: "Las deliberaciones del Consejo son secretas."
  explanation:
    es: "El artículo 5.3 dice: «Las deliberaciones del Consejo de Ministros serán secretas». Reservadas son las de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.4), no las del Consejo. No son públicas. El acta recoge exclusivamente el tiempo y lugar, los asistentes, los acuerdos y los informes presentados (art. 18.4), no las deliberaciones."
  citation: "art. 5.3 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q017
  prompt:
    es: "De acuerdo con el artículo 18.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en el acta de las sesiones del Consejo de Ministros figurarán, exclusivamente:"
  options:
  - id: a
    correct: true
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados."
  - id: b
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y el sentido de las deliberaciones."
  - id: c
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los votos particulares formulados."
  - id: d
    text:
      es: "La relación de asistentes, el orden del día, las deliberaciones mantenidas y los acuerdos adoptados."
  explanation:
    es: "El artículo 18.4 dice que en el acta figurarán, exclusivamente, «las circunstancias relativas al tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados». Las deliberaciones son secretas (art. 5.3) y no constan en el acta, ni su sentido ni su contenido. Los votos particulares no figuran en la lista."
  citation: "art. 18.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q018
  prompt:
    es: "De acuerdo con el artículo 6.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la creación, modificación y supresión de las Comisiones Delegadas del Gobierno será acordada:"
  options:
  - id: a
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Por el Consejo de Ministros mediante Acuerdo, a propuesta del Ministro de la Presidencia."
  - id: c
    correct: true
    text:
      es: "Por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, a propuesta del Ministro de la Presidencia."
  explanation:
    es: "El artículo 6.1 dice que la creación, modificación y supresión «será acordada por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno». No la acuerda el Presidente, sino el Consejo. La forma es el Real Decreto, no el Acuerdo. La propuesta es del Presidente, no del Ministro de la Presidencia."
  citation: "art. 6.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q019
  prompt:
    es: "¿Qué asuntos resuelven las Comisiones Delegadas del Gobierno en su condición de órganos colegiados del Gobierno?"
  options:
  - id: a
    text:
      es: "Los que, afectando a un solo Ministerio, no requieran ser elevados al Consejo de Ministros."
  - id: b
    text:
      es: "Todos los que vayan a someterse a aprobación del Consejo de Ministros, excepto los nombramientos."
  - id: c
    text:
      es: "Los que les encomiende el Presidente, aunque deban ser elevados al Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Los que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros."
  explanation:
    es: "El artículo 6.4.c) les atribuye «resolver los asuntos que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros». Los asuntos de un solo Ministerio no son los de esta letra. Examinar todos los asuntos que van al Consejo, salvo los nombramientos, es función de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.5.a). Los asuntos que deben elevarse al Consejo no los resuelven las Comisiones Delegadas."
  citation: "art. 6.4 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-7
- id: m01-l05-q020
  prompt:
    es: "De acuerdo con el artículo 7.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los Secretarios de Estado son:"
  options:
  - id: a
    text:
      es: "Órganos directivos de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica."
  - id: b
    correct: true
    text:
      es: "Órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica."
  - id: c
    text:
      es: "Miembros del Gobierno, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica de un Departamento."
  - id: d
    text:
      es: "Órganos superiores de la Administración General del Estado, responsables de la dirección de los servicios comunes de un Departamento."
  explanation:
    es: "El artículo 7.1 dice que los Secretarios de Estado son «órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica». No son órganos directivos, sino superiores. No son miembros del Gobierno, que se compone del Presidente, los Vicepresidentes y los Ministros (art. 1.2). La ley no les atribuye la dirección de los servicios comunes."
  citation: "art. 7.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-1997-25336-art-15
- id: m01-l05-q021
  prompt:
    es: "Según el artículo 15.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿cómo son nombrados y separados los Secretarios de Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan."
  - id: b
    text:
      es: "Por acuerdo de la Comisión General de Secretarios de Estado y Subsecretarios, a propuesta del Ministro del Departamento."
  - id: c
    text:
      es: "Por Orden del Ministro del Departamento al que pertenezcan, previo conocimiento del Consejo de Ministros."
  - id: d
    text:
      es: "Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro del Departamento al que pertenezcan."
  explanation:
    es: "El artículo 15.1 dice que los Secretarios de Estado «son nombrados y separados por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan». La Comisión General no nombra a nadie y no puede adoptar acuerdos por delegación del Gobierno (art. 8.4). La Orden Ministerial previo conocimiento del Consejo es la forma de nombrar a los Directores de Gabinete de los Secretarios de Estado (art. 16.2). El Real Decreto es del Consejo de Ministros, no del Presidente."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q022
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la composición de la Comisión General de Secretarios de Estado y Subsecretarios es correcta?"
  options:
  - id: a
    text:
      es: "La integran los Ministros y los titulares de las Secretarías de Estado, y asiste también el Abogado General del Estado."
  - id: b
    text:
      es: "La integran los titulares de las Secretarías de Estado y los Directores Generales, y asiste también el Fiscal General del Estado."
  - id: c
    correct: true
    text:
      es: "La integran los titulares de las Secretarías de Estado y los Subsecretarios, y asiste también el Abogado General del Estado."
  - id: d
    text:
      es: "La integran los Subsecretarios de los Departamentos, y asiste también el Director del Gabinete del Presidente."
  explanation:
    es: "El artículo 8.1 dice que la Comisión «estará integrada por los titulares de las Secretarías de Estado y por los Subsecretarios de los distintos Departamentos Ministeriales» y que «asistirá igualmente el Abogado General del Estado». Los Ministros no la integran. Tampoco los Directores Generales, y quien asiste es el Abogado General del Estado, no el Fiscal General. Los Secretarios de Estado sí la integran, junto a los Subsecretarios."
  citation: "art. 8.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q023
  prompt:
    es: "De acuerdo con el artículo 8.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la Presidencia de la Comisión General de Secretarios de Estado y Subsecretarios corresponde:"
  options:
  - id: a
    text:
      es: "Al Presidente del Gobierno o, en su defecto, a un Vicepresidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "A un Vicepresidente del Gobierno o, en su defecto, al Ministro de la Presidencia."
  - id: c
    text:
      es: "Al Ministro de la Presidencia o, en su defecto, al Subsecretario de la Presidencia."
  - id: d
    text:
      es: "Al Subsecretario de la Presidencia o, en su defecto, al Director del Secretariado del Gobierno."
  explanation:
    es: "El artículo 8.2 dice que la Presidencia «corresponde a un Vicepresidente del Gobierno o, en su defecto, al Ministro de la Presidencia». El Presidente del Gobierno no preside esta Comisión. El Subsecretario de la Presidencia ejerce la Secretaría, no la Presidencia, y el Director del Secretariado del Gobierno lo suple como Secretario (art. 8.3)."
  citation: "art. 8.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q024
  prompt:
    es: "Según el artículo 8.3 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿quién ejerce la Secretaría de la Comisión General de Secretarios de Estado y Subsecretarios?"
  options:
  - id: a
    text:
      es: "El Ministro de la Presidencia y, en caso de ausencia, vacante o enfermedad, el Subsecretario de la Presidencia."
  - id: b
    text:
      es: "El Director del Secretariado del Gobierno y, en caso de ausencia, vacante o enfermedad, el Subsecretario de la Presidencia."
  - id: c
    correct: true
    text:
      es: "El Subsecretario de la Presidencia y, en caso de ausencia, vacante o enfermedad, el Director del Secretariado del Gobierno."
  - id: d
    text:
      es: "El Abogado General del Estado y, en caso de ausencia, vacante o enfermedad, el Director del Secretariado del Gobierno."
  explanation:
    es: "El artículo 8.3 dice que la Secretaría «será ejercida por el Subsecretario de la Presidencia» y que, en caso de ausencia, vacante o enfermedad, «actuará como Secretario el Director del Secretariado del Gobierno». El Ministro de la Presidencia preside la Comisión en defecto de un Vicepresidente (art. 8.2), no es su Secretario. La opción que invierte el orden es incorrecta: el Director del Secretariado es el suplente. El Abogado General del Estado asiste a la Comisión (art. 8.1), pero no ejerce la Secretaría."
  citation: "art. 8.3 Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q025
  prompt:
    es: "De acuerdo con el artículo 8.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las deliberaciones de la Comisión General de Secretarios de Estado y Subsecretarios:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán reservadas, y en ningún caso podrá adoptar decisiones o acuerdos por delegación del Gobierno."
  - id: b
    text:
      es: "Serán secretas, y solo podrá adoptar decisiones por delegación expresa del Consejo de Ministros."
  - id: c
    text:
      es: "Serán reservadas, y podrá adoptar acuerdos por delegación del Gobierno en los asuntos de trámite."
  - id: d
    text:
      es: "Serán públicas, salvo acuerdo en contrario, y no podrá adoptar decisiones por delegación del Gobierno."
  explanation:
    es: "El artículo 8.4 dice que sus deliberaciones «serán reservadas» y que «en ningún caso la Comisión podrá adoptar decisiones o acuerdos por delegación del Gobierno». Secretas son las del Consejo de Ministros y las de las Comisiones Delegadas (arts. 5.3 y 6.5). La prohibición de actuar por delegación no admite excepciones, ni por delegación expresa ni en asuntos de trámite. Las deliberaciones no son públicas."
  citation: "art. 8.4 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q026
  prompt:
    es: "Señale la respuesta correcta sobre los asuntos que examina la Comisión General de Secretarios de Estado y Subsecretarios antes de que se sometan al Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "Examina todos los asuntos sin excepción, incluidos los nombramientos y los ceses."
  - id: b
    correct: true
    text:
      es: "Quedan excluidos de su examen, entre otros, los nombramientos y los ceses."
  - id: c
    text:
      es: "Solo examina los proyectos de ley y los proyectos de reglamento del Gobierno."
  - id: d
    text:
      es: "Quedan excluidos de su examen los proyectos de ley, que van directamente al Consejo de Ministros."
  explanation:
    es: "El artículo 8.5.a) le atribuye el examen de todos los asuntos que vayan a someterse al Consejo de Ministros, «excepto los nombramientos, ceses, ascensos a cualquiera de los empleos de la categoría de oficiales generales» y los que deban ir directamente al Consejo por urgencia. Por eso no examina los asuntos sin excepción. Su examen no se limita a proyectos de ley y de reglamento. Los proyectos de ley no figuran entre las excepciones."
  citation: "art. 8.5 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1997-25336-art-9
- id: m01-l05-q027
  prompt:
    es: "¿Cuál de las siguientes es una función del Secretariado del Gobierno como órgano de apoyo del Consejo de Ministros, de las Comisiones Delegadas y de la Comisión General de Secretarios de Estado y Subsecretarios?"
  options:
  - id: a
    correct: true
    text:
      es: "El archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones."
  - id: b
    text:
      es: "La convocatoria de las reuniones del Consejo de Ministros y la fijación de su orden del día."
  - id: c
    text:
      es: "La adopción de programas, planes y directrices vinculantes para la Administración General del Estado."
  - id: d
    text:
      es: "La presidencia de la Comisión General de Secretarios de Estado y Subsecretarios en ausencia de su Presidente."
  explanation:
    es: "El artículo 9.1.d) atribuye al Secretariado «el archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones». Convocar el Consejo y fijar su orden del día corresponde al Presidente del Gobierno (arts. 2.2.g y 18.3). Adoptar programas, planes y directrices vinculantes es función del Consejo de Ministros (art. 5.1.j). En ausencia del Presidente de la Comisión General, la presidencia recae en el Ministro que corresponda por orden de precedencia (art. 8.2)."
  citation: "art. 9.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-9
- id: m01-l05-q028
  prompt:
    es: "De acuerdo con el artículo 9.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Secretariado del Gobierno, como órgano de asistencia al Ministro de la Presidencia, ejercerá:"
  options:
  - id: a
    text:
      es: "La presidencia de la Comisión General de Secretarios de Estado y Subsecretarios en ausencia del Ministro de la Presidencia."
  - id: b
    text:
      es: "La aprobación de las instrucciones que han de seguirse para la tramitación de asuntos ante los órganos colegiados del Gobierno."
  - id: c
    text:
      es: "La interposición del recurso de inconstitucionalidad contra las leyes aprobadas por las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "La tramitación de la sanción y promulgación real de las leyes y de la expedición de los Reales Decretos."
  explanation:
    es: "El artículo 9.2.a) atribuye al Secretariado, como órgano de asistencia al Ministro de la Presidencia, «los trámites relativos a la sanción y promulgación real de las leyes aprobadas por las Cortes Generales y la expedición de los Reales Decretos». No preside la Comisión General (art. 8.2). Interponer el recurso de inconstitucionalidad es función del Presidente del Gobierno (art. 2.2.i). Las instrucciones de tramitación las propone el Secretariado, pero las aprueba el Ministro de la Presidencia (art. 9.4)."
  citation: "art. 9.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-10
- id: m01-l05-q029
  prompt:
    es: "Los Gabinetes, cuyos miembros realizan tareas de confianza y asesoramiento especial, son órganos de apoyo político y técnico:"
  options:
  - id: a
    correct: true
    text:
      es: "Del Presidente del Gobierno, de los Vicepresidentes, de los Ministros y de los Secretarios de Estado."
  - id: b
    text:
      es: "Del Presidente del Gobierno, de los Vicepresidentes y de los Ministros, pero no de los Secretarios de Estado."
  - id: c
    text:
      es: "Del Presidente del Gobierno, de los Ministros, de los Secretarios de Estado y de los Subsecretarios."
  - id: d
    text:
      es: "Exclusivamente del Presidente del Gobierno y de los Vicepresidentes."
  explanation:
    es: "El artículo 10.1 dice que los Gabinetes son órganos de apoyo político y técnico «del Presidente del Gobierno, de los Vicepresidentes, de los Ministros y de los Secretarios de Estado». Los Secretarios de Estado sí tienen Gabinete. Los Subsecretarios no figuran en la lista. Los Ministros también tienen Gabinete, así que no es exclusivo del Presidente y los Vicepresidentes."
  citation: "art. 10.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
