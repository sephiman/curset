- id: g-tracking-token
  term: {en: tracking token}
  definition: {en: "A position on the event stream that accompanies each message a streaming processor receives. The processor uses it to open the stream at the desired position on start-up."}
  origin: m08-l06
  citation: "axon-event-processors-streaming#tracking_tokens"
- id: g-consistency-marker
  term: {en: consistency marker}
  definition: {en: "A marker returned as the final entry when sourcing events from an event store. It tracks the logical grouping of sourced events and is attached to the append condition."}
  origin: m08-l06
  citation: "axon-event-store-internals#consistency_marker"
- id: g-dynamic-consistency-boundary
  term: {en: dynamic consistency boundary}
  definition: {en: "A flexible boundary to what should be appended consistently with other existing event streams in the event store. It replaces the focus on the aggregate identifier with user defined tags."}
  origin: m08-l06
  citation: "axon-event-store-internals#dynamic_consistency_boundaries_dcb"
- id: g-saga
  term: {en: saga}
  definition: {en: "A coordination of a process through event handlers and persisted fields. Association values route events to the right instance."}
  origin: m08-l06
  citation: "axon-migration-sagas-to-workflows#sagas-and-workflows"
- id: g-replay
  term: {en: replay}
  definition: {en: "Handling events again by adjusting the position on the stream. It is a feature supported by the streaming event processor."}
  origin: m08-l06
  citation: "axon-event-processors-streaming#replaying-events"
