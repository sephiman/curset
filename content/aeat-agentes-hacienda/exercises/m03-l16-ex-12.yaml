# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0182
  prompt:
    es: "Conforme al artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre quién puede solicitar la suspensión del ingreso de la deuda tributaria:"
  options:
  - id: a
    text:
      es: "También el contribuyente separado legalmente cuya autoliquidación resulte a ingresar."
  - id: b
    text:
      es: "El contribuyente casado cuya autoliquidación resulte a devolver, respecto de la deuda de su cónyuge."
  - id: c
    text:
      es: "Cualquier contribuyente con deuda a ingresar, aunque no esté casado, si otro contribuyente con devolución lo acepta."
  - id: d
    correct: true
    text:
      es: "El contribuyente casado y no separado legalmente que esté obligado a declarar y cuya autoliquidación resulte a ingresar."
  explanation:
    es: "La suspensión corresponde al contribuyente casado y no separado legalmente, obligado a declarar y con autoliquidación a ingresar (art. 97.6). El separado legalmente queda fuera. El cónyuge con devolución no pide la suspensión: renuncia a su cobro. Y la figura no se extiende a contribuyentes no casados."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0183
  prompt:
    es: "De acuerdo con el artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los intereses de demora en la suspensión del ingreso de la deuda tributaria del cónyuge:"
  options:
  - id: a
    text:
      es: "La suspensión devenga interés de demora desde el día siguiente al término del plazo de declaración."
  - id: b
    text:
      es: "La suspensión devenga el interés legal del dinero sobre la cuantía suspendida."
  - id: c
    correct: true
    text:
      es: "La suspensión se solicita sin intereses de demora, en una cuantía igual o inferior a la devolución a la que tenga derecho el cónyuge."
  - id: d
    text:
      es: "La suspensión se concede sin intereses solo por el 50 por ciento de la devolución del cónyuge."
  explanation:
    es: "La solicitud se hace sin intereses de demora y por una cuantía igual o inferior a la devolución del cónyuge (art. 97.6). Devengar interés de demora o interés legal contradice la expresión \"sin intereses\". Y limitarla al 50 por ciento de la devolución recorta una cuantía que la ley no fija."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0184
  prompt:
    es: "¿Cuál es la cantidad fija, en euros anuales, que forma parte de la menor de las dos cantidades del límite máximo conjunto de las reducciones por previsión social del artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Es de 8.500 euros anuales."
  - id: b
    text:
      es: "Es de 4.250 euros anuales."
  - id: c
    correct: true
    text:
      es: "Es de 1.500 euros anuales."
  - id: d
    text:
      es: "Es de 5.000 euros anuales."
  explanation:
    es: "La letra b) del artículo 52.1 fija 1.500 euros anuales como la cantidad que compite con el 30 por 100 de los rendimientos. Los 8.500 y los 4.250 euros son incrementos del límite y los 5.000 euros un límite adicional para primas de seguros colectivos de dependencia de la empresa."
  citation: "art. 52.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0185
  prompt:
    es: "Según el artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el importe anual del mínimo por descendientes por el segundo descendiente que cumpla los requisitos?"
  options:
  - id: a
    text:
      es: "Es de 2.400 euros anuales."
  - id: b
    correct: true
    text:
      es: "Es de 2.700 euros anuales."
  - id: c
    text:
      es: "Es de 4.000 euros anuales."
  - id: d
    text:
      es: "Es de 4.500 euros anuales."
  explanation:
    es: "Por el segundo descendiente el mínimo es de 2.700 euros anuales (art. 58.1). Los 2.400 euros corresponden al primero, los 4.000 euros al tercero y los 4.500 euros al cuarto y siguientes."
  citation: "art. 58.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0188
  prompt:
    es: "¿Hasta cuántos euros anuales llega la deducción por el cónyuge no separado legalmente con discapacidad que cumple los requisitos, según el artículo 81 bis.1.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Hasta 600 euros anuales por el cónyuge."
  - id: b
    text:
      es: "Hasta 2.400 euros anuales por el cónyuge."
  - id: c
    text:
      es: "Hasta 3.000 euros anuales por el cónyuge."
  - id: d
    correct: true
    text:
      es: "Hasta 1.200 euros anuales por el cónyuge."
  explanation:
    es: "La deducción por cónyuge con discapacidad es de hasta 1.200 euros anuales (art. 81 bis.1.d). Los 600 euros son el incremento por hijo de familia numerosa, los 2.400 euros resultan de duplicar la cifra, cosa que solo ocurre en las familias numerosas de categoría especial, y los 3.000 euros son el mínimo por discapacidad."
  citation: "art. 81 bis.1.d) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0189
  prompt:
    es: "De acuerdo con el artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las mujeres con derecho a la deducción por maternidad pueden minorar la cuota diferencial por cada hijo menor de tres años hasta que el menor alcance:"
  options:
  - id: a
    text:
      es: "los seis años de edad."
  - id: b
    text:
      es: "los cinco años de edad."
  - id: c
    correct: true
    text:
      es: "los tres años de edad."
  - id: d
    text:
      es: "la mayoría de edad."
  explanation:
    es: "La deducción se disfruta por cada hijo menor de tres años hasta que el menor alcance los tres años (art. 81.1). Los cinco y seis años y la mayoría de edad prolongan un derecho que la ley limita a esa edad, salvo en adopción y acogimiento, que tienen su propio plazo de tres años desde la inscripción."
  citation: "art. 81.1 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-59
- id: m03-l16-q0190
  prompt:
    es: "Conforme al artículo 59 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo por ascendientes es de 1.150 euros anuales por cada ascendiente que conviva con el contribuyente y no tenga rentas anuales, excluidas las exentas, superiores a:"
  options:
  - id: a
    text:
      es: "la cifra de 1.800 euros anuales."
  - id: b
    correct: true
    text:
      es: "la cifra de 8.000 euros anuales."
  - id: c
    text:
      es: "la cifra de 5.550 euros anuales."
  - id: d
    text:
      es: "la cifra de 22.000 euros anuales."
  explanation:
    es: "El ascendiente no puede tener rentas anuales superiores a 8.000 euros, excluidas las exentas (art. 59.1). Los 1.800 euros son el umbral de la regla 2.ª del artículo 61, los 5.550 euros el mínimo del contribuyente y los 22.000 euros el límite de obligación de declarar por rendimientos del trabajo."
  citation: "art. 59 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-57
- id: m03-l16-q0191
  prompt:
    es: "De acuerdo con el artículo 57 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el mínimo del contribuyente:"
  options:
  - id: a
    correct: true
    text:
      es: "Con carácter general es de 5.550 euros anuales y se aumenta en 1.150 euros anuales cuando el contribuyente tiene más de 65 años."
  - id: b
    text:
      es: "Con carácter general es de 5.550 euros anuales y se aumenta en 1.400 euros anuales cuando el contribuyente tiene más de 65 años."
  - id: c
    text:
      es: "Con carácter general es de 5.550 euros anuales y no se aumenta por razón de la edad del contribuyente."
  - id: d
    text:
      es: "Con carácter general es de 2.400 euros anuales y se aumenta en 1.150 euros anuales cuando el contribuyente tiene más de 65 años."
  explanation:
    es: "El mínimo general es de 5.550 euros y supera en 1.150 euros anuales cuando el contribuyente tiene más de 65 años (art. 57). Los 1.400 euros son un aumento adicional que exige superar los 75 años. La edad sí aumenta el mínimo. Y los 2.400 euros son la cuantía por el primer descendiente, no el mínimo del contribuyente."
  citation: "art. 57 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0192
  prompt:
    es: "Conforme al artículo 58.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el aumento del mínimo por descendientes en los supuestos de adopción o acogimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Se produce, con independencia de la edad del menor, en el período en que se inscriba en el Registro Civil y en los dos siguientes."
  - id: b
    text:
      es: "Solo se produce si el menor es menor de tres años en el período de la inscripción en el Registro Civil."
  - id: c
    text:
      es: "Se produce durante los tres períodos siguientes a la inscripción, excluido el de la propia inscripción."
  - id: d
    text:
      es: "Se produce únicamente en el período impositivo en que se inscriba en el Registro Civil."
  explanation:
    es: "En adopción o acogimiento, preadoptivo o permanente, el aumento de 2.800 euros se aplica con independencia de la edad del menor en el período de la inscripción y en los dos siguientes (art. 58.2). Exigir ser menor de tres años contradice la independencia de la edad. Excluir el período de la inscripción o limitarlo a este cambia el cómputo."
  citation: "art. 58.2 LIRPF"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0194
  prompt:
    es: "De acuerdo con el artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el incremento de 4.250 euros anuales del límite de las reducciones por previsión social:"
  options:
  - id: a
    text:
      es: "Procede cuando provenga de contribuciones empresariales a favor de los trabajadores por cuenta ajena o de aportaciones de estos al mismo instrumento de previsión social."
  - id: b
    text:
      es: "Procede cuando provenga de primas a seguros colectivos de dependencia satisfechas por la empresa."
  - id: c
    correct: true
    text:
      es: "Procede cuando provenga de aportaciones de trabajadores por cuenta propia o autónomos y empresarios o profesionales a los instrumentos que el artículo enumera."
  - id: d
    text:
      es: "Procede cuando provenga de aportaciones a patrimonios protegidos de personas con discapacidad."
  explanation:
    es: "El incremento de 4.250 euros es para aportaciones de autónomos, empresarios o profesionales a planes sectoriales, de empleo simplificados, de empleo propios, mutualidades, planes de previsión social empresarial o seguros colectivos de dependencia (art. 52.1, número 2.º). Las contribuciones empresariales dan el incremento de 8.500 euros. Las primas de la empresa a seguros colectivos de dependencia tienen un límite adicional de 5.000 euros. Y los patrimonios protegidos se rigen por el artículo 54."
  citation: "art. 52.1 LIRPF"
  difficulty: 3
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0197
  prompt:
    es: "De acuerdo con el artículo 103.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el plazo de seis meses para practicar la liquidación provisional cuando la declaración se presenta dentro del plazo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se cuenta desde el término del plazo establecido para la presentación de la declaración."
  - id: b
    text:
      es: "Se cuenta desde la fecha en que el contribuyente presenta la declaración."
  - id: c
    text:
      es: "Se cuenta desde la fecha de devengo del impuesto."
  - id: d
    text:
      es: "Se cuenta desde la fecha en que la Administración recibe la información de los pagadores."
  explanation:
    es: "Con declaración presentada en plazo, los seis meses se cuentan desde el término del plazo de presentación (art. 103.1). Contarlos desde la presentación es la regla de la declaración fuera de plazo. Ni el devengo ni la recepción de la información de los pagadores son el punto de partida."
  citation: "art. 103.1 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-56
- id: m03-l16-q0198
  prompt:
    es: "Según el artículo 56.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el mínimo personal y familiar:"
  options:
  - id: a
    text:
      es: "Es la parte de la cuota íntegra estatal que se destina a satisfacer las necesidades básicas del contribuyente y su familia y que no se somete a tributación en ese impuesto."
  - id: b
    text:
      es: "Es la parte de la base imponible que se somete a un tipo reducido por destinarse a las necesidades básicas."
  - id: c
    text:
      es: "Es el importe que se deduce de la cuota líquida total para obtener la cuota diferencial."
  - id: d
    correct: true
    text:
      es: "Es la parte de la base liquidable que, por destinarse a satisfacer las necesidades básicas del contribuyente y su familia, no se somete a tributación."
  explanation:
    es: "El mínimo personal y familiar es la parte de la base liquidable que no se somete a tributación por destinarse a las necesidades básicas personales y familiares (art. 56.1). No es una parte de la cuota íntegra, ni de la base imponible con tipo reducido, ni una deducción de la cuota líquida total."
  citation: "art. 56.1 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-60
- id: m03-l16-q0199
  prompt:
    es: "Según el artículo 60.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en cuántos euros anuales se aumenta, en concepto de gastos de asistencia, el mínimo por discapacidad del contribuyente que acredita un grado de discapacidad igual o superior al 65 por ciento?"
  options:
  - id: a
    text:
      es: "Se aumenta en 1.150 euros anuales."
  - id: b
    text:
      es: "Se aumenta en 1.400 euros anuales."
  - id: c
    correct: true
    text:
      es: "Se aumenta en 3.000 euros anuales."
  - id: d
    text:
      es: "Se aumenta en 2.800 euros anuales."
  explanation:
    es: "Quien acredita un grado igual o superior al 65 por ciento suma a su mínimo de 9.000 euros un aumento de 3.000 euros anuales por gastos de asistencia (art. 60.1). Los 1.150 euros son el aumento del mínimo del contribuyente por superar los 65 años y los 1.400 euros el adicional por superar los 75. Los 2.800 euros son el aumento por descendiente menor de tres años."
  citation: "art. 60.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
