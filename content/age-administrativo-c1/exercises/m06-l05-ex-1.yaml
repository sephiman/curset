# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q001
  prompt:
    es: "En Excel 365, ¿qué tecla, además de Alt, selecciona la pestaña activa de la cinta de opciones y activa las teclas de acceso?"
  options:
  - id: a
    text:
      es: "F8"
  - id: b
    text:
      es: "F2"
  - id: c
    correct: true
    text:
      es: "F10"
  - id: d
    text:
      es: "F7"
  explanation:
    es: "La tabla de la cinta da «Alt o F10» para seleccionar la pestaña activa y activar las teclas de acceso. F8 activa el modo extendido de selección, F2 edita la celda activa y F7 abre el cuadro de diálogo Ortografía."
  citation: "fuente: `ms-excel-atajos.html`; «Trabajar en la cinta de opciones con el teclado»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q002
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe las Sugerencias de teclas de la cinta de opciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Son letras en imágenes pequeñas junto a pestañas y opciones, que aparecen al presionar Alt."
  - id: b
    text:
      es: "Son descripciones emergentes del comando que tiene el foco, que aparecen al presionar Ctrl+Mayús+F10."
  - id: c
    text:
      es: "Son los comandos del menú contextual del elemento seleccionado, que aparecen al presionar Mayús+F10."
  - id: d
    text:
      es: "Son las combinaciones con Ctrl de la tabla de métodos abreviados más usados, como Ctrl+1 o Ctrl+9."
  explanation:
    es: "La página dice que Alt muestra los métodos abreviados de la cinta, «denominados Sugerencias de teclas», como letras en imágenes pequeñas junto a pestañas y opciones. Ctrl+Mayús+F10 muestra, según la tabla de la cinta, la información sobre herramientas del elemento con el foco, y Mayús+F10 abre un menú contextual. Las combinaciones con Ctrl son métodos abreviados de otras tablas de la página, no las Sugerencias de teclas."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado de la cinta»"
  difficulty: 2
  tags:
  - "concepto"
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q003
  prompt:
    es: "En Excel 365, ¿qué tecla de acceso abre la pestaña Revisar, desde la que se protegen libros y hojas?"
  options:
  - id: a
    text:
      es: "Alt+M"
  - id: b
    correct: true
    text:
      es: "Alt+R"
  - id: c
    text:
      es: "Alt+P"
  - id: d
    text:
      es: "Alt+H"
  explanation:
    es: "La tabla de teclas de acceso asigna Alt+R a la pestaña Revisar («revisar la ortografía, agregar notas y comentarios y proteger libros y hojas»). Alt+M abre Fórmulas, Alt+P abre Diseño de página y Alt+H abre Inicio."
  citation: "fuente: `ms-excel-atajos.html`; «Usar las teclas de acceso para las pestañas de la cinta de opciones»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q004
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes pestañas de la cinta de opciones se abre al presionar la tecla de acceso Alt+H?"
  options:
  - id: a
    text:
      es: "La pestaña Fórmulas"
  - id: b
    text:
      es: "La pestaña Revisar"
  - id: c
    correct: true
    text:
      es: "La pestaña Inicio"
  - id: d
    text:
      es: "La pestaña Diseño de página"
  explanation:
    es: "La página pone el ejemplo «presione Alt+H para abrir la pestaña Inicio». Fórmulas se abre con Alt+M, Revisar con Alt+R y Diseño de página con Alt+P."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado de la cinta»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q006
  prompt:
    es: "En Excel 365, ¿qué método abreviado de teclado abre el cuadro de diálogo Formato de celdas?"
  options:
  - id: a
    text:
      es: "Ctrl+9"
  - id: b
    text:
      es: "Ctrl+0"
  - id: c
    text:
      es: "Ctrl+F1"
  - id: d
    correct: true
    text:
      es: "Ctrl+1"
  explanation:
    es: "La página da Ctrl+1 para abrir el cuadro de diálogo Formato de celdas. En la misma página, Ctrl+9 oculta las filas seleccionadas, Ctrl+0 oculta las columnas seleccionadas y Ctrl+F1 expande o contrae la cinta."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q007
  prompt:
    es: "En un libro de Excel 365, ¿cuál de las siguientes afirmaciones describe qué es una tabla dinámica?"
  options:
  - id: a
    text:
      es: "Una lista desplegable que limita a un rango de origen los valores que se pueden escribir en una celda."
  - id: b
    text:
      es: "Una función de Power Query que pone en una sola columna los valores de varias columnas similares."
  - id: c
    correct: true
    text:
      es: "Una herramienta para calcular, resumir y analizar datos y ver en ellos comparaciones, patrones y tendencias."
  - id: d
    text:
      es: "Una vista que mantiene fijas las filas superiores de la hoja mientras se desplaza el resto."
  explanation:
    es: "La página define la tabla dinámica como «una herramienta avanzada para calcular, resumir y analizar datos» que permite ver comparaciones, patrones y tendencias. La lista desplegable es Validación de datos, poner valores similares en una columna es Anular dinamización de columnas y fijar filas es Inmovilizar paneles."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Crear una tabla dinámica para analizar datos de una hoja de cálculo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q008
  prompt:
    es: "En Excel 365 para Windows, tras seleccionar las celdas con los datos de origen, ¿qué ruta de la cinta crea una tabla dinámica?"
  options:
  - id: a
    text:
      es: "Datos › Tabla dinámica"
  - id: b
    correct: true
    text:
      es: "Insertar › Tabla dinámica"
  - id: c
    text:
      es: "Inicio › Tabla dinámica"
  - id: d
    text:
      es: "Vista › Tabla dinámica"
  explanation:
    es: "Los pasos para Windows dicen «Seleccione Insertar>tabla dinámica». La tabla dinámica está en la pestaña Insertar, no en Datos, Inicio ni Vista; la página de atajos también sitúa las tablas dinámicas en la pestaña Insertar."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Crear una tabla dinámica en Excel para Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q009
  prompt:
    es: "En Excel 365, al marcar la casilla de un campo numérico en el panel Campos de tabla dinámica, ¿a qué área se agrega de forma predeterminada?"
  options:
  - id: a
    text:
      es: "Al área Filas"
  - id: b
    text:
      es: "Al área Columnas"
  - id: c
    text:
      es: "Al área Filtros"
  - id: d
    correct: true
    text:
      es: "Al área Valores"
  explanation:
    es: "La página dice que los campos seleccionados van a sus áreas predeterminadas: los no numéricos a Filas, las jerarquías de fecha y hora a Columnas y los numéricos a Valores. Ningún campo va por defecto a Filtros."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Creación de la tabla dinámica»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q010
  prompt:
    es: "En una tabla dinámica de Excel 365, si Excel interpreta como texto los datos de un campo del área Valores, ¿cómo los muestra por defecto?"
  options:
  - id: a
    correct: true
    text:
      es: "Como un recuento de los datos del campo"
  - id: b
    text:
      es: "Como una suma de los datos del campo"
  - id: c
    text:
      es: "Como un máximo de los datos del campo"
  - id: d
    text:
      es: "Como un porcentaje del total general"
  explanation:
    es: "Según la página, los campos del área Valores se muestran por defecto como suma, pero «si Excel interpreta los datos como texto, los datos se mostrarán como un RECUENTO». La suma es el cálculo por defecto de los números; el máximo y el porcentaje del total general solo aparecen si se cambian en la configuración del campo."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Trabajar con valores de tabla dinámica»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q011
  prompt:
    es: "En Excel 365, tras añadir datos al origen de una tabla dinámica, ¿cuál de las siguientes acciones actualiza solo esa tabla dinámica?"
  options:
  - id: a
    text:
      es: "Volver a seleccionar Insertar › Tabla dinámica con el mismo rango de origen seleccionado."
  - id: b
    text:
      es: "Hacer clic con el botón derecho en la pestaña de su hoja y elegir Cambiar nombre."
  - id: c
    text:
      es: "Seleccionar cualquier celda de su rango y presionar Ctrl+1 para darle formato."
  - id: d
    correct: true
    text:
      es: "Hacer clic con el botón derecho en cualquier parte de su rango y seleccionar Actualizar."
  explanation:
    es: "La página dice que, para actualizar solo una tabla dinámica, se hace clic con el botón derecho en cualquier parte de su rango y se selecciona Actualizar. Insertar › Tabla dinámica crea una tabla dinámica nueva, Cambiar nombre renombra la hoja y Ctrl+1 abre el cuadro Formato de celdas."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Actualización de las tablas dinámicas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "comportamiento"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q012
  prompt:
    es: "En una tabla dinámica de Excel 365, ¿desde qué opción se cambia el cálculo predeterminado de un campo del área Valores, en la sección Resumir valores por?"
  options:
  - id: a
    text:
      es: "Formato de celdas"
  - id: b
    text:
      es: "Validación de datos"
  - id: c
    correct: true
    text:
      es: "Configuración de campo de valor"
  - id: d
    text:
      es: "Opciones de Excel"
  explanation:
    es: "La página indica seleccionar la flecha a la derecha del nombre del campo y, después, «la opción Configuración de campo de valor», donde se cambia el cálculo en Resumir valores por. Formato de celdas da formato a las celdas, Validación de datos limita lo que se escribe y Opciones de Excel configura el programa."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Trabajar con valores de tabla dinámica»"
  difficulty: 2
  tags:
  - "configuración"
  - "ofimática-menú"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q013
  prompt:
    es: "En una tabla dinámica de Excel 365, para mostrar unos importes como porcentaje del total general en lugar de su suma, se usa:"
  options:
  - id: a
    text:
      es: "La sección Resumir valores por del cuadro Configuración del campo de valor."
  - id: b
    correct: true
    text:
      es: "La pestaña Mostrar valores como, en Configuración del campo de valor."
  - id: c
    text:
      es: "La pestaña Protección del cuadro de diálogo Formato de celdas de la hoja."
  - id: d
    text:
      es: "La ruta Datos › Validación de datos, con Permitir: Lista y su Origen."
  explanation:
    es: "La página explica que, en lugar de un cálculo, los datos pueden mostrarse como porcentaje de un campo, por ejemplo «% del total general», desde la pestaña Mostrar valores como del cuadro Configuración del campo de valor. Resumir valores por cambia el cálculo (suma, recuento), la pestaña Protección bloquea celdas y Validación de datos limita las entradas."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Una vez que haya abierto el cuadro de diálogo Configuración del campo de valor , puede realizar las selecciones desde la pestaña Mostrar valores como .»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-excel-tabla-dinamica-html
- id: m06-l05-q014
  prompt:
    es: "Para crear una tabla dinámica en Excel 365, ¿cuál de los siguientes formatos de los datos de origen recomienda evitar la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Los datos organizados en columnas con una sola fila de encabezado."
  - id: b
    text:
      es: "Los datos con formato de tabla de Excel, desde Insertar › Tabla."
  - id: c
    correct: true
    text:
      es: "Las filas dobles de encabezados o las celdas combinadas."
  - id: d
    text:
      es: "Las etiquetas únicas y no vacías en el encabezado de cada columna."
  explanation:
    es: "Las sugerencias de la página dicen «Evite usar filas dobles de encabezados o celdas combinadas». Organizar los datos en columnas con una sola fila de encabezado, darles formato de tabla de Excel y poner etiquetas únicas no vacías son, en la misma lista, lo que se recomienda hacer."
  citation: "fuente: `ms-excel-tabla-dinamica.html`; «Sugerencias y trucos sobre el formato de datos»"
  difficulty: 2
  tags:
  - "requisito"
