- id: m12-l03-qa02
  prompt:
    en: According to Martin Fowler in Yagni, what does he mean by the cost of carry of a presumptive feature?
  options:
  - id: a
    text:
      en: The effort spent building and testing a feature that turns out to be useless
  - id: b
    correct: true
    text:
      en: The unused feature's complexity makes the software harder to modify and debug
  - id: c
    text:
      en: The revenue lost because the effort went into that feature instead of another
  - id: d
    text:
      en: The work of repairing a feature that was built wrong and must be reworked
  explanation:
    en: Fowler writes that the code for a presumptive feature adds complexity, which makes the software harder to
      modify and debug and raises the cost of other features. He describes the cost of build as the effort spent
      analyzing, programming and testing the now useless feature, which is a different cost. He describes the cost
      of delay as the revenue lost because effort went to the presumptive feature, which is a different cost. He
      describes the cost of repair as what a feature built wrong costs to fix or work around, which is a different
      cost.
  citation: fowler-yagni#banner
- id: m12-l03-qa03
  prompt:
    en: According to Andrew Stribblehill in Managing Incidents, how can engineers keep their incident management
      skills up to date?
  options:
  - id: a
    correct: true
    text:
      en: By applying the framework to other operational changes that span teams or time zones
  - id: b
    text:
      en: By saving the framework for real incidents, since the skills stay sharp once they are learned
  - id: c
    text:
      en: By role-playing only responses to on-call issues that are still unsolved
  - id: d
    text:
      en: By keeping incident management out of disaster-recovery tests so they stay focused
  explanation:
    en: Stribblehill writes that the incident management framework can apply to other operational changes that need
      to span time zones or teams. He writes that incident management proficiency atrophies quickly when it is not
      in constant use, which rules out saving the framework for real incidents. He writes that his team role-plays
      the response to an on-call issue that has already been solved, which rules out role-playing only unsolved
      ones. He writes that incident management should be part of disaster-recovery testing, which rules out keeping
      it out of those tests.
  citation: sre-book-managing-incidents#when-to-declare-an-incident
  extract:
    en: the incident management framework can apply to other operational changes that need to span time zones and/or
      teams
