- id: m06-l04-q025
  prompt:
    es: "En Word 365, ¿cuál de las siguientes teclas se mantiene presionada para seleccionar varios objetos del documento haciendo clic en ellos?"
  options:
  - id: a
    text:
      es: "La tecla Tab o la tecla Alt"
  - id: b
    text:
      es: "La tecla Alt o la tecla Ctrl"
  - id: c
    correct: true
    text:
      es: "La tecla Mayús o la tecla Ctrl"
  - id: d
    text:
      es: "La tecla Alt o la tecla Mayús"
  explanation:
    es: "La tabla de consejos dice: «Seleccionar varios objetos. | Mantenga presionada la tecla Mayús o Ctrl mientras selecciona los objetos». Las demás opciones cambian una o las dos teclas por Alt o Tab. Tab, además, sirve para recorrer la pila de objetos, no para sumar objetos a la selección."
  citation: "fuente: `ms-word-seleccionar-objetos.html`; «Consejos para seleccionar formas y objetos»"
