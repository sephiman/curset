    es: "Conforme al artículo 72.5 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en caso de ausencia, vacante o enfermedad del titular de la Delegación del Gobierno, será suplido por:"
  options:
  - id: a
    correct: true
    text:
      es: "El Subdelegado que el Delegado designe y, en su defecto, el de la provincia en que tenga su sede."
  - id: b
    text:
      es: "El Secretario General de la Delegación en todo caso."
  - id: c
    text:
      es: "El Subdelegado de mayor antigüedad en el cargo."
  - id: d
    text:
      es: "El Director Insular de mayor nivel."
