# anchor: boe-a-1985-12666-art-582
- id: m01-l04-q092
  prompt:
    es: "De acuerdo con el artículo 582.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la renuncia de un Vocal del Consejo General del Poder Judicial surte efecto una vez aceptada por:"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente del Tribunal Supremo y del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "El Pleno del Consejo por mayoría absoluta."
  - id: c
    text:
      es: "La Cámara que lo designó."
  - id: d
    text:
      es: "El Rey, mediante Real Decreto."
  explanation:
    es: "El artículo 582.1 habla de «renuncia aceptada por el Presidente del Tribunal Supremo y del Consejo General del Poder Judicial». No la acepta el Pleno, ni la Cámara que lo designó, ni el Rey."
  citation: "art. 582.1 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q093
  prompt:
    es: "¿Cuál de las siguientes antigüedades profesionales debe superar un jurista de reconocida competencia para ser elegido Presidente del Tribunal Supremo, según el artículo 586.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Quince años de antigüedad en el ejercicio de su profesión."
  - id: b
    text:
      es: "Veinte años de antigüedad en el ejercicio de su profesión."
  - id: c
    text:
      es: "Treinta años de antigüedad en el ejercicio de su profesión."
  - id: d
    correct: true
    text:
      es: "Veinticinco años de antigüedad en el ejercicio de su profesión."
  explanation:
    es: "El artículo 586.1 pide «más de veinticinco años de antigüedad en el ejercicio de su profesión». Quince años es la exigencia para los Vocales juristas (artículo 567.2), y veinte y treinta no figuran en la ley."
  citation: "art. 586.1 LOPJ"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q094
  prompt:
    es: "Según el artículo 586.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, para ser elegido Presidente del Tribunal Supremo y del Consejo el miembro de la carrera judicial debe tener la categoría de:"
  options:
  - id: a
    correct: true
    text:
      es: "Magistrado del Tribunal Supremo y reunir las condiciones para ser Presidente de Sala."
  - id: b
    text:
      es: "Presidente de la Audiencia Nacional, con cinco años en el cargo."
  - id: c
    text:
      es: "Presidente de un Tribunal Superior de Justicia."
  - id: d
    text:
      es: "Magistrado del Tribunal Constitucional."
  explanation:
    es: "El artículo 586.1 pide la categoría de «Magistrado del Tribunal Supremo» y reunir las condiciones exigidas para ser Presidente de Sala. El Presidente de la Audiencia Nacional o de un Tribunal Superior no cumple por ese cargo, y el Tribunal Constitucional no pertenece a la carrera judicial."
  citation: "art. 586.1 LOPJ"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1985-12666-art-587
- id: m01-l04-q096
  prompt:
    es: "Señale la opción correcta. De acuerdo con el artículo 587 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Presidente del Tribunal Supremo y del Consejo podrá ser reelegido y nombrado para un nuevo mandato:"
  options:
  - id: a
    text:
      es: "Sin límite de mandatos."
  - id: b
    correct: true
    text:
      es: "Por una sola vez."
  - id: c
    text:
      es: "Por dos veces consecutivas."
  - id: d
    text:
      es: "Solo si lo propone el Gobierno."
  explanation:
    es: "El artículo 587 permite la reelección «por una sola vez». No hay reelección ilimitada, ni hasta dos veces, y el Gobierno no propone al Presidente: lo elige el Pleno."
  citation: "art. 587 LOPJ"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-588
- id: m01-l04-q097
  prompt:
    es: "¿Cuál de las siguientes es una causa de cese del Presidente del Tribunal Supremo y del Consejo, según el artículo 588.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "La decisión del Pleno, por tres quintos de sus miembros, a causa de notoria incapacidad o incumplimiento grave de los deberes del cargo."
  - id: b
    text:
      es: "La decisión del Presidente del Gobierno, a causa de pérdida de confianza."
  - id: c
    text:
      es: "La decisión del Rey, a propuesta del Ministro de Justicia."
  - id: d
    text:
      es: "La falta de renovación del Pleno del Tribunal Supremo."
  explanation:
    es: "El artículo 588.1 prevé el cese por expirar el mandato, por renuncia o por decisión del Pleno del Consejo, «apreciados por tres quintos de sus miembros». El Presidente del Gobierno, el Rey a propuesta del Ministro y la falta de renovación del Pleno del Supremo no figuran como causas."
  citation: "art. 588.1 LOPJ"
  difficulty: 3
  tags:
  - "efecto"
  - "mayoría"
# anchor: boe-a-1985-12666-art-589
- id: m01-l04-q098
  prompt:
    es: "Según el artículo 589.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Vicepresidente del Tribunal Supremo es nombrado por el Pleno del Consejo por mayoría de tres quintos, a propuesta de:"
  options:
  - id: a
    text:
      es: "La Comisión Permanente del Consejo."
  - id: b
    text:
      es: "El Rey."
  - id: c
    correct: true
    text:
      es: "El Presidente del Tribunal Supremo y del Consejo."
  - id: d
    text:
      es: "El Pleno del Tribunal Supremo."
  explanation:
    es: "El artículo 589.2 dice que será nombrado por el Pleno del Consejo «a propuesta del Presidente». Ni la Comisión Permanente, ni el Rey, ni el Pleno del Supremo proponen."
  citation: "art. 589.2 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1985-12666-art-595
- id: m01-l04-q099
  prompt:
    es: "¿Cuál de las siguientes es una de las Comisiones que existen en el Consejo General del Poder Judicial, según el artículo 595.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Comisión de Nombramientos."
  - id: b
    correct: true
    text:
      es: "La Comisión de Igualdad."
  - id: c
    text:
      es: "La Comisión de Régimen Interior."
  - id: d
    text:
      es: "La Comisión de Transparencia."
  explanation:
    es: "El artículo 595.2 enumera las Comisiones Permanente, de Calificación, Disciplinaria, de Asuntos Económicos, de Igualdad y de Supervisión y Control de Protección de Datos. Las de Nombramientos, de Régimen Interior y de Transparencia no son del Consejo."
  citation: "art. 595.2 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
  - "órgano"
# anchor: boe-a-1985-12666-art-595
- id: m01-l04-q100
  prompt:
    es: "Conforme al artículo 595.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, además de las funciones encomendadas a la Presidencia, el Consejo General del Poder Judicial ejerce sus atribuciones:"
  options:
  - id: a
    text:
      es: "Solo en Pleno, sin posibilidad de actuar por Comisiones."
  - id: b
    text:
      es: "En Pleno o a través de las Salas de Gobierno de los Tribunales."
  - id: c
    text:
      es: "A través de la Presidencia y de la Comisión Permanente únicamente."
  - id: d
    correct: true
    text:
      es: "En Pleno o a través de las Comisiones previstas en la ley."
  explanation:
    es: "El artículo 595.1 dice que ejerce sus atribuciones «en Pleno o a través de las Comisiones». No actúa solo en Pleno, ni por medio de las Salas de Gobierno, que son órganos de los Tribunales, ni queda reducido a la Presidencia y a la Permanente."
  citation: "art. 595.1 LOPJ"
  difficulty: 2
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-1985-12666-art-600
- id: m01-l04-q101
  prompt:
    es: "¿Cuál de las siguientes periodicidades corresponde a la sesión ordinaria del Pleno del Consejo General del Poder Judicial, conforme al artículo 600.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Cada quince días."
  - id: b
    text:
      es: "Una vez al trimestre."
  - id: c
    text:
      es: "Cada seis meses."
  - id: d
    correct: true
    text:
      es: "Una vez al mes."
  explanation:
    es: "El artículo 600.1 dice que se reunirá en sesión ordinaria «una vez al mes». Cada quince días, cada trimestre y cada seis meses son periodicidades que la ley no establece."
  citation: "art. 600.1 LOPJ"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-600
- id: m01-l04-q102
  prompt:
    es: "¿Cuál de las siguientes presencias mínimas basta para constituir válidamente el Pleno del Consejo, salvo en la elección del Presidente, según el artículo 600.4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "Diez Vocales y el Presidente."
  - id: b
    text:
      es: "Doce Vocales como mínimo."
  - id: c
    text:
      es: "Quince Vocales y el Presidente."
  - id: d
    text:
      es: "La mitad más uno de los Vocales."
  explanation:
    es: "El artículo 600.4 pide «como mínimo, la presencia de diez Vocales y el Presidente». Los doce miembros son la exigencia para elegir al Presidente (artículo 600.3), y quince o la mitad más uno no figuran."
  citation: "art. 600.4 LOPJ"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12666-art-599
- id: m01-l04-q103
  prompt:
    es: "¿Cuál de las siguientes mayorías exige el artículo 599.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial para que el Pleno proponga a los dos Magistrados del Tribunal Constitucional que corresponden al Consejo?"
  options:
  - id: a
    text:
      es: "Dos tercios."
  - id: b
    text:
      es: "Mayoría absoluta."
  - id: c
    correct: true
    text:
      es: "Tres quintos."
  - id: d
    text:
      es: "Mayoría simple."
  explanation:
    es: "El artículo 599.1 dice «por mayoría de tres quintos». Los dos tercios, la mayoría absoluta y la simple no son la mayoría de esta propuesta."
  citation: "art. 599.1 LOPJ"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-560
- id: m01-l04-q104
  prompt:
    es: "¿Cuál de las siguientes atribuciones corresponde al Consejo General del Poder Judicial, según el artículo 560.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Nombrar a los Magistrados del Tribunal Supremo."
  - id: b
    correct: true
    text:
      es: "Proponer el nombramiento de dos Magistrados del Tribunal Constitucional."
  - id: c
    text:
      es: "Nombrar al Fiscal General del Estado."
  - id: d
    text:
      es: "Proponer el nombramiento de los Fiscales de Sala."
  explanation:
    es: "El artículo 560.1 le atribuye proponer el nombramiento de dos Magistrados del Tribunal Constitucional. Para los Magistrados del Supremo solo propone, no nombra, y el Fiscal General lo nombra el Rey a propuesta del Gobierno, con el Consejo solo oído. Proponer Fiscales de Sala no figura entre sus atribuciones."
  citation: "art. 560.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-560
- id: m01-l04-q105
  prompt:
    es: "Conforme al artículo 560.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, entre las atribuciones del Consejo General del Poder Judicial figura ejercer:"
  options:
  - id: a
    text:
      es: "La alta dirección de la Fiscalía."
  - id: b
    text:
      es: "La potestad jurisdiccional en segunda instancia."
  - id: c
    text:
      es: "La potestad legislativa en materia procesal."
  - id: d
    correct: true
    text:
      es: "La alta inspección de Tribunales."
  explanation:
    es: "El artículo 560.1 incluye «ejercer la alta inspección de Tribunales». La Fiscalía no depende del Consejo, no ejerce potestad jurisdiccional y no tiene potestad legislativa."
  citation: "art. 560.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q107
  prompt:
    es: "De acuerdo con el artículo 630.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, salvo que la ley disponga otra cosa, los acuerdos de los órganos colegiados del Consejo se adoptan por:"
  options:
  - id: a
    text:
      es: "Mayoría de tres quintos de los miembros presentes."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta de los miembros presentes."
  - id: c
    text:
      es: "Mayoría simple de los miembros presentes."
  - id: d
    text:
      es: "Mayoría absoluta de los miembros del Consejo."
  explanation:
    es: "El artículo 630.1 fija «mayoría absoluta de los miembros presentes». Los tres quintos solo valen para los nombramientos que el propio artículo enumera. La mayoría simple es insuficiente y la mayoría absoluta de todos los miembros del Consejo cambia la base de cómputo."
  citation: "art. 630.1 LOPJ"
  difficulty: 2
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q108
  prompt:
    es: "Según el artículo 630.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el nombramiento de Presidentes de Sala y Magistrados del Tribunal Supremo exige en los órganos colegiados del Consejo:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de los miembros presentes."
  - id: b
    text:
      es: "Dos tercios de los miembros presentes."
  - id: c
    correct: true
    text:
      es: "Tres quintos de los miembros presentes."
  - id: d
    text:
      es: "Tres quintos de los miembros del Pleno."
  explanation:
    es: "El artículo 630.1 exige «una mayoría de tres quintos de los miembros presentes» para esos nombramientos. La mayoría absoluta es la regla general, no la de este caso. Los dos tercios no figuran y los tres quintos del Pleno son la mayoría de otros acuerdos, como la elección del Presidente."
  citation: "art. 630.1 LOPJ"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q109
  prompt:
    es: "¿Cuál de los siguientes nombramientos exige tres quintos de los miembros presentes en los órganos colegiados del Consejo, conforme al artículo 630.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El de los Jueces de Paz y sus sustitutos."
  - id: b
    text:
      es: "El del Fiscal General del Estado."
  - id: c
    text:
      es: "El de los Vocales del turno judicial."
  - id: d
    correct: true
    text:
      es: "El del Magistrado del Tribunal Supremo competente para conocer de las actividades del Centro Nacional de Inteligencia que afecten a derechos fundamentales."
  explanation:
    es: "El artículo 630.1 exige tres quintos para el Magistrado del Tribunal Supremo, y su sustituto, competentes para conocer de las actividades del Centro Nacional de Inteligencia que afecten a los derechos fundamentales del artículo 18, apartados 2 y 3. Los Jueces de Paz los nombra la Sala de Gobierno del Tribunal Superior, el Fiscal General lo nombra el Rey y los Vocales del turno judicial los eligen las Cámaras."
  citation: "art. 630.1 LOPJ"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q140
  prompt:
    es: "Conforme al artículo 122.2 de la Constitución Española de 1978, el órgano de gobierno del Poder Judicial, cuyo estatuto establece la ley orgánica, es:"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  - id: b
    text:
      es: "El Ministerio Fiscal."
  - id: c
    text:
      es: "El Tribunal Constitucional."
  - id: d
    text:
      es: "El Consejo de Estado."
  explanation:
    es: "El artículo 122.2 dice que el Consejo General del Poder Judicial es el órgano de gobierno del Poder Judicial. El Ministerio Fiscal tiene la misión del artículo 124.1, que es promover la acción de la justicia en defensa de la legalidad. El Tribunal Constitucional y el Consejo de Estado no gobiernan el Poder Judicial: ese gobierno lo atribuye el artículo 122.2 al Consejo."
  citation: "art. 122.2 CE"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q141
  prompt:
    es: "Según el artículo 122.3 de la Constitución Española de 1978, el Rey nombra miembros del Consejo General del Poder Judicial a propuesta del Congreso de los Diputados y, en igual número, a propuesta de:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "El Senado."
  - id: c
    text:
      es: "El Pleno del propio Consejo."
  - id: d
    text:
      es: "El Presidente del Tribunal Supremo."
  explanation:
    es: "El artículo 122.3 reparte los veinte miembros así: doce entre Jueces y Magistrados, cuatro a propuesta del Congreso y cuatro a propuesta del Senado. El Consejo de Ministros no propone a ninguno. El Presidente del Tribunal Supremo preside el Consejo, pero no propone miembros. Tampoco los propone el Pleno del propio Consejo."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1985-12666-art-568
- id: m01-l04-q142
  prompt:
    es: "Según el artículo 568.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, un Consejo General del Poder Judicial constituido el 12 de marzo de 2026 se renueva en su totalidad el:"
  options:
  - id: a
    text:
      es: "12 de marzo de 2033."
  - id: b
    text:
      es: "31 de diciembre de 2030."
  - id: c
    correct: true
    text:
      es: "12 de marzo de 2031."
  - id: d
    text:
      es: "12 de marzo de 2029."
  explanation:
    es: "El plazo es de cinco años, contados desde la fecha de constitución. Constituido el 12 de marzo de 2026, vence el 12 de marzo de 2031: cinco años completos, 1.826 días, con el 29 de febrero de 2028 dentro del cómputo. El 12 de marzo de 2029 son solo tres años y el 12 de marzo de 2033 son siete. El 31 de diciembre de 2030 cierra el quinto año natural (2026 a 2030), pero la ley cuenta desde la fecha de constitución y no por años naturales."
  citation: "art. 568.1 LOPJ"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1985-12666-art-587
- id: m01-l04-q143
  prompt:
    es: "Conforme al artículo 587 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el mandato del Presidente del Tribunal Supremo y del Consejo General del Poder Judicial:"
  options:
  - id: a
    text:
      es: "Dura seis años y puede renovarse sin límite de veces."
  - id: b
    text:
      es: "Coincide con el de la Legislatura de las Cortes Generales que designó a los Vocales."
  - id: c
    text:
      es: "Dura cinco años desde su nombramiento por el Rey, aunque el Consejo cese antes."
  - id: d
    correct: true
    text:
      es: "Coincide con el del Consejo que lo haya elegido."
  explanation:
    es: "El artículo 587 dice que la duración del mandato coincide con la del Consejo que lo haya elegido. No cuenta aparte desde el Real Decreto de nombramiento: termina cuando termina el del Consejo. Tampoco lo marca la Legislatura de las Cortes Generales, que designan a los Vocales pero no fijan el mandato. La duración de seis años no existe, y el mismo artículo permite una sola reelección, no una renovación sin límite."
  citation: "art. 587 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1985-12666-art-560
- id: m01-l04-q144
  prompt:
    es: "Conforme al artículo 560.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial resuelve lo que proceda en materia de provisión de destinos, ascensos y régimen disciplinario de:"
  options:
  - id: a
    correct: true
    text:
      es: "Jueces y Magistrados."
  - id: b
    text:
      es: "Jueces, Magistrados y Fiscales."
  - id: c
    text:
      es: "Jueces, Magistrados y Letrados de la Administración de Justicia."
  - id: d
    text:
      es: "Únicamente los Magistrados del Tribunal Supremo."
  explanation:
    es: "El artículo 560.1 atribuye al Consejo resolver en materia de formación, provisión de destinos, ascensos, situaciones administrativas y régimen disciplinario de Jueces y Magistrados. La atribución se refiere solo a ellos: no incluye a los Fiscales ni a los Letrados de la Administración de Justicia, y tampoco se limita a los Magistrados del Tribunal Supremo."
  citation: "art. 560.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
