- id: g-sum-of-pauses
  term:
    en: sum of pauses
  definition:
    en: The Sum of Pauses is the total amount of time that the application was paused during a GC.
  origin: m11-l03
  citation: jdk-troubleshoot-jfr#JSTGD-GUID-E9C795D6-3D7A-4CD8-84DD-4F7DE3200614
- id: g-chained-exception-facility
  term:
    en: chained exception facility
  definition:
    en: The recording of this causal information is referred to as the chained exception facility, as the cause can, itself, have a cause, and so on, leading to a "chain" of exceptions, each caused by another.
  origin: m11-l03
  citation: javadoc-throwable#class-throwable
