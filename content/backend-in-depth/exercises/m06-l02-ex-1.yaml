- id: m06-l02-q28
  prompt:
    en: In PostgreSQL 18, an `UPDATE` at Read Committed finds a row that a concurrent transaction has updated and
      then committed. What does the `UPDATE` do?
  options:
  - id: a
    correct: true
    text:
      en: It re-evaluates `WHERE` on the updated row and proceeds if it still matches
  - id: b
    text:
      en: It is rolled back with the error could not serialize access due to concurrent update
  - id: c
    text:
      en: It applies its change to the original version of the row it first found
  - id: d
    text:
      en: It always ignores the row because another transaction changed it
  explanation:
    en: The `WHERE` clause is re-evaluated on the updated version of the row. The serialization error is what a
      Repeatable Read transaction gets. The second updater attempts to apply its operation to the updated version,
      not the original. It ignores the row only if the first updater deleted it.
  citation: pg-transaction-iso#XACT-READ-COMMITTED; pg-transaction-iso#XACT-REPEATABLE-READ
  extract:
    en: The search condition of the command (the WHERE clause) is re-evaluated to see if the updated version of
      the row still matches the search condition
