- id: m04-l05-q228
  prompt:
    es: "Una funcionaria del Subgrupo A2 con grado 22 consolidado obtiene por concurso un puesto de nivel 25 y lo desempeña cuatro años continuados. ¿Qué grado tendrá consolidado?"
  options:
  - id: a
    text:
      es: "El grado 26, dos niveles más por cada dos años de servicios."
  - id: b
    correct: true
    text:
      es: "El grado 25, porque no puede superar el nivel del puesto."
  - id: c
    text:
      es: "El grado 24, porque solo sube dos niveles en ese tiempo."
  - id: d
    text:
      es: "El grado 26, el máximo del intervalo del Subgrupo A2."
  explanation:
    es: "El puesto supera el grado 22 en tres niveles, así que a los dos años consolida el 24 (artículo 70.2 del Real Decreto 364/1995). Desde el 24, el puesto de nivel 25 solo le supera en uno: rige la regla general y a los dos años siguientes consolida el 25. El 26 está prohibido porque el grado no puede «superar el correspondiente al del puesto desempeñado», aunque el intervalo del Subgrupo A2 llegue al 26. Quedarse en el 24 ignora los dos últimos años."
  citation: "art. 70.2 RD 364/1995"
