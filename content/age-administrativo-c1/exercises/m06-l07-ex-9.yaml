# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q258
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se limita la búsqueda del cuadro de búsqueda a solo la carpeta Archivo?"
  options:
  - id: a
    text:
      es: "Pulsando Ctrl+Alt+Z para incluir las subcarpetas"
  - id: b
    text:
      es: "Seleccionando Todos los elementos de Outlook"
  - id: c
    correct: true
    text:
      es: "Seleccionando primero la carpeta Archivo"
  - id: d
    text:
      es: "Seleccionando Buzón actual en el cuadro de búsqueda"
  explanation:
    es: "Para limitar el alcance a la carpeta Archivo se selecciona primero esa carpeta y el cuadro de búsqueda busca solo en ella. Buzón actual busca en todo el buzón. Todos los elementos de Outlook sirve para hallar convocatorias aceptadas del calendario. Ctrl+Alt+Z amplía la búsqueda a las subcarpetas."
  citation: "fuente: `ms-outlook-archivar.html`; «¿Cómo buscar la carpeta Archivo?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q260
  prompt:
    es: "En Outlook 365, con una cuenta de Exchange o Exchange Online, ¿qué ocurre con las directivas de retención respecto a la carpeta Archivo?"
  options:
  - id: a
    text:
      es: "Se aplican solo a la carpeta Archivo de las cuentas POP e IMAP"
  - id: b
    correct: true
    text:
      es: "Se aplican a la carpeta Archivo de esa cuenta"
  - id: c
    text:
      es: "No se pueden aplicar a la carpeta Archivo"
  - id: d
    text:
      es: "Se aplican solo a la carpeta Elementos eliminados"
  explanation:
    es: "La ayuda dice que, con una cuenta de Exchange o Exchange Online, las directivas de carpeta como las de retención se aplican a la carpeta Archivo. Que no se puedan aplicar la contradice. Que se apliquen solo a las cuentas POP e IMAP contradice que se citen Exchange y Exchange Online. Que se apliquen solo a Elementos eliminados contradice que se apliquen a Archivo."
  citation: "fuente: `ms-outlook-archivar.html`; «Todas las cuentas tienen acceso a una carpeta Archivo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q261
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los datos adjuntos de un mensaje original cuando se usa Reenviar?"
  options:
  - id: a
    correct: true
    text:
      es: "Se incluyen todos y se pueden agregar más archivos"
  - id: b
    text:
      es: "Se incluyen solo si se activa una casilla en Opciones"
  - id: c
    text:
      es: "Se incluyen, pero no se pueden agregar más archivos"
  - id: d
    text:
      es: "No se incluyen, y hay que añadirlos a mano"
  explanation:
    es: "Al reenviar, el mensaje incluye todos los datos adjuntos del original y se pueden agregar archivos adicionales. Que no se incluyan es lo que ocurre al responder. Que no se puedan agregar más contradice que se pueden agregar archivos adjuntos adicionales. Que dependa de una casilla contradice que se incluyan automáticamente."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Datos adjuntos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q262
  prompt:
    es: "En Outlook 365 clásico, tras enviar una solicitud de recuperación, ¿cuánto tarda normalmente en llegar la notificación por correo con el informe de recuperación?"
  options:
  - id: a
    text:
      es: "Hasta 24 horas"
  - id: b
    text:
      es: "Hasta cinco minutos"
  - id: c
    text:
      es: "Hasta treinta minutos"
  - id: d
    correct: true
    text:
      es: "Menos de 30 segundos"
  explanation:
    es: "Después de enviar la solicitud, normalmente menos de 30 segundos después, se recibe una notificación con el asunto Informe de recuperación de mensajes. Cinco minutos es lo que pueden tardar las actualizaciones de estado con unos cientos de destinatarios. Treinta minutos es lo que puede tardar el estado con decenas de miles de destinatarios. Veinticuatro horas es el tiempo máximo de reintento antes de marcar la recuperación como errónea."
  citation: "fuente: `ms-outlook-recuperar.html`; «Para comprobar los recuerdos en Outlook clásico»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q264
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se envía de inmediato un mensaje con entrega retrasada que espera en la Bandeja de salida?"
  options:
  - id: a
    text:
      es: "Abriéndolo y seleccionando Recuperar este mensaje en Elementos enviados"
  - id: b
    text:
      es: "Abriéndolo en Borrador y seleccionando Programar envío en el menú junto a Enviar"
  - id: c
    correct: true
    text:
      es: "Abriéndolo, desactivando No entregar antes y seleccionando Cerrar y Enviar"
  - id: d
    text:
      es: "Abriéndolo y seleccionando Cancelar envío, y luego Enviar el mensaje"
  explanation:
    es: "En Outlook clásico se cambia a la Bandeja de salida, se abre el mensaje, se desactiva la casilla No entregar antes y se selecciona Cerrar y luego Enviar. Cancelar envío es la opción del nuevo Outlook. Programar envío es el comando del nuevo Outlook que deja el mensaje en Borrador. Recuperar este mensaje retira un mensaje ya enviado."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Enviar el mensaje inmediatamente en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q265
  prompt:
    es: "En Outlook 365 clásico con la cinta simplificada, ¿dónde se encuentran las opciones de mensaje para retrasar la entrega, si no aparece la flecha Opciones de mensaje?"
  options:
  - id: a
    correct: true
    text:
      es: "Pestaña Opciones › Más comandos"
  - id: b
    text:
      es: "Pestaña Inicio › Más comandos"
  - id: c
    text:
      es: "Pestaña Mensaje › Más comandos"
  - id: d
    text:
      es: "Pestaña Archivo › Más comandos"
  explanation:
    es: "Con la cinta simplificada, la ayuda indica la pestaña Opciones y Más comandos. La pestaña Mensaje es donde, con la cinta simplificada, se halla Más comandos para recuperar un mensaje. Las pestañas Inicio y Archivo contradicen que sea la pestaña Opciones."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
