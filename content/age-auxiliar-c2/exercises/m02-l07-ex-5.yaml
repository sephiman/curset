# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q116
  prompt:
    es: "En Windows 11, si se activa la configuración de la cuenta de Microsoft para la búsqueda de contenido en la nube, ¿qué resultados muestra Windows Search?"
  options:
  - id: a
    text:
      es: "Solo los archivos indexados en el propio dispositivo"
  - id: b
    text:
      es: "Elementos de OneDrive para la Empresa y de SharePoint"
  - id: c
    text:
      es: "Archivos que los demás equipos de la red local comparten con el usuario"
  - id: d
    correct: true
    text:
      es: "Elementos de OneDrive personal, Outlook y otros servicios Microsoft"
  explanation:
    es: "La página dice que, si se activa la configuración de la cuenta de Microsoft para la búsqueda de contenido en la nube, Windows Search muestra resultados de OneDrive personal, Outlook y otros servicios Microsoft. Limitarse al dispositivo es lo contrario de esa opción. OneDrive para la Empresa y SharePoint son los resultados de la cuenta profesional o educativa. Las carpetas compartidas en la red local no forman parte de esa configuración."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda de contenido en la nube»"
  difficulty: 1
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q117
  prompt:
    es: "En Windows 11, si se activa la configuración de la cuenta profesional o educativa para la búsqueda de contenido en la nube, ¿cuál de los siguientes resultados muestra Windows Search?"
  options:
  - id: a
    text:
      es: "Solo OneDrive personal y Outlook de la cuenta de Microsoft"
  - id: b
    text:
      es: "Solo los archivos del dispositivo indexados con el modo de indexación Mejorado"
  - id: c
    correct: true
    text:
      es: "OneDrive para la Empresa, Outlook, SharePoint y más de Búsqueda de Microsoft"
  - id: d
    text:
      es: "Solo los equipos de la red de la organización que tienen carpetas compartidas"
  explanation:
    es: "La página dice que, con la cuenta profesional o educativa activada para la búsqueda de contenido en la nube, Windows Search muestra resultados de OneDrive para la Empresa, Outlook, SharePoint y más de Búsqueda de Microsoft. OneDrive personal es el resultado de la cuenta de Microsoft. El modo Mejorado amplía la indexación local, no la búsqueda en la nube. Los equipos con carpetas compartidas se ven en Red, no en esta configuración."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda de contenido en la nube»"
