# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0097
  prompt:
    es: "Señale la respuesta CORRECTA sobre la prueba del grado de utilización de los bienes de inversión, según el artículo 95.Tres.4.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "La declaración-liquidación presentada por el sujeto pasivo es medio de prueba suficiente del grado de utilización, si los bienes figuran en los registros oficiales de la actividad."
  - id: b
    text:
      es: "La inclusión de los bienes en los registros oficiales de la actividad es medio de prueba suficiente del grado de utilización, aunque no se presente declaración-liquidación."
  - id: c
    text:
      es: "Solo es medio de prueba suficiente del grado de utilización el informe pericial emitido por un tercero independiente designado por la Administración."
  - id: d
    correct: true
    text:
      es: "La declaración-liquidación presentada por el sujeto pasivo no es medio de prueba suficiente del grado de utilización, ni lo es la inclusión de los bienes en los registros oficiales de la actividad."
  explanation:
    es: "Ni la declaración-liquidación del sujeto pasivo ni la contabilización o inclusión en los registros oficiales bastan para probar el grado de utilización. El precepto no convierte en prueba suficiente a ninguno de los dos ni exige un informe pericial designado por la Administración."
  citation: "art. 95.Tres.4.ª LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "vehículos"
  - "prueba"
