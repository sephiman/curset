# anchor: celex-32016r0679-art-12
- id: m02-l04-q015
  prompt:
    es: "Un ministerio recibe el lunes 18 de enero de 2027 una solicitud de acceso a datos personales y no prorroga el plazo. Según el artículo 12.3 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿hasta qué fecha, como máximo, debe informar al interesado de sus actuaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el jueves 18 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el lunes 1 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el lunes 8 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el jueves 18 de marzo de 2027."
  explanation:
    es: "El artículo 12.3 obliga a informar «en cualquier caso, en el plazo de un mes a partir de la recepción de la solicitud». Contado de fecha a fecha desde el lunes 18 de enero de 2027, el mes vence el jueves 18 de febrero de 2027, día laborable sin festivo en el intervalo. El lunes 1 de febrero son diez días hábiles y el lunes 8 de febrero son quince. El jueves 18 de marzo son dos meses, y el enunciado dice que el plazo no se prorroga."
  citation: "art. 12.3 RGPD"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: celex-32016r0679-art-12
- id: m02-l04-q016
  prompt:
    es: "De acuerdo con el artículo 12.3 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el plazo de un mes del responsable para informar al interesado de sus actuaciones podrá prorrogarse en caso necesario:"
  options:
  - id: a
    text:
      es: "Otro mes, teniendo en cuenta la complejidad y el número de solicitudes."
  - id: b
    text:
      es: "Otros dos meses, previa autorización de la autoridad de control competente."
  - id: c
    text:
      es: "Otros tres meses, teniendo en cuenta la complejidad y el número de solicitudes."
  - id: d
    correct: true
    text:
      es: "Otros dos meses, teniendo en cuenta la complejidad y el número de solicitudes."
  explanation:
    es: "El artículo 12.3 dice que el plazo «podrá prorrogarse otros dos meses en caso necesario, teniendo en cuenta la complejidad y el número de solicitudes». La prórroga no es de un mes ni de tres. Tampoco necesita autorización de la autoridad de control: la decide el responsable y la comunica al interesado."
  citation: "art. 12.3 RGPD"
  difficulty: 1
  tags:
  - "plazo"
# anchor: celex-32016r0679-art-12
- id: m02-l04-q017
  prompt:
    es: "Si el responsable del tratamiento decide prorrogar el plazo para atender una solicitud de ejercicio de derechos, ¿cuándo debe informar de la prórroga al interesado según el Reglamento general de protección de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de un mes desde la recepción de la solicitud, indicando los motivos de la dilación."
  - id: b
    text:
      es: "En el plazo de diez días desde la recepción de la solicitud, indicando los motivos de la dilación."
  - id: c
    text:
      es: "Antes de que venza el plazo ya prorrogado, indicando los motivos de la dilación."
  - id: d
    text:
      es: "En el plazo de un mes desde la recepción de la solicitud, sin necesidad de indicar motivos."
  explanation:
    es: "El artículo 12.3 dice que el responsable informará de la prórroga «en el plazo de un mes a partir de la recepción de la solicitud, indicando los motivos de la dilación». No es un plazo de diez días. El aviso no puede esperar al final del plazo prorrogado. Los motivos de la dilación sí hay que indicarlos."
  citation: "art. 12.3 RGPD"
  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-32016r0679-art-15
- id: m02-l04-q018
  prompt:
    es: "Según el artículo 15.4 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el derecho del interesado a obtener copia de los datos personales objeto de tratamiento:"
  options:
  - id: a
    text:
      es: "Solo podrá ejercerse una vez en cada período de seis meses."
  - id: b
    text:
      es: "Exige que el interesado acredite un interés legítimo en la copia."
  - id: c
    text:
      es: "Se limita a los datos que el propio interesado haya facilitado."
  - id: d
    correct: true
    text:
      es: "No afectará negativamente a los derechos y libertades de otros."
  explanation:
    es: "El artículo 15.4 dice que el derecho a obtener copia «no afectará negativamente a los derechos y libertades de otros». No hay un límite de una copia cada seis meses: la LOPDGDD solo permite considerar repetitivo el acceso en esos casos. El interesado no tiene que acreditar un interés legítimo. Limitarse a los datos facilitados por el interesado es propio de la portabilidad, no de la copia."
  citation: "art. 15.4 RGPD"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2018-16673-art-13
- id: m02-l04-q019
  prompt:
    es: "De acuerdo con el artículo 13.3 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, se podrá considerar repetitivo el ejercicio del derecho de acceso:"
  options:
  - id: a
    correct: true
    text:
      es: "En más de una ocasión durante el plazo de seis meses, salvo causa legítima para ello."
  - id: b
    text:
      es: "En más de una ocasión durante el plazo de un año, salvo causa legítima para ello."
  - id: c
    text:
      es: "En más de dos ocasiones durante el plazo de seis meses, salvo causa legítima para ello."
  - id: d
    text:
      es: "En más de una ocasión durante el plazo de tres meses, aunque exista causa legítima."
  explanation:
    es: "El artículo 13.3 permite considerar repetitivo el acceso «en más de una ocasión durante el plazo de seis meses, a menos que exista causa legítima para ello». El periodo no es de un año ni de tres meses. Basta más de una ocasión, no más de dos. La causa legítima impide calificarlo de repetitivo."
  citation: "art. 13.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2018-16673-art-14
- id: m02-l04-q020
  prompt:
    es: "Según el artículo 14 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, quien ejerce el derecho de rectificación aportará la documentación justificativa de la inexactitud de los datos:"
  options:
  - id: a
    correct: true
    text:
      es: "Acompañándola a la solicitud cuando sea preciso."
  - id: b
    text:
      es: "Dentro de los diez días siguientes a la solicitud."
  - id: c
    text:
      es: "Solo cuando se lo requiera la autoridad de control."
  - id: d
    text:
      es: "Solo cuando los datos procedan de un registro público."
  explanation:
    es: "El artículo 14 dice que el afectado «deberá acompañar, cuando sea preciso, la documentación justificativa de la inexactitud o carácter incompleto de los datos». Se acompaña a la solicitud, sin un plazo posterior de diez días. No depende de un requerimiento de la autoridad de control. Tampoco de que los datos procedan de un registro público."
  citation: "art. 14 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-14
- id: m02-l04-q021
  prompt:
    es: "Doña Marta Ruiz pide al responsable del tratamiento que corrija su domicilio, que figura de forma errónea. En su solicitud de rectificación deberá indicar:"
  options:
  - id: a
    text:
      es: "A qué datos se refiere y el fin para el que fueron recogidos."
  - id: b
    text:
      es: "La corrección que haya de realizarse y la causa de la inexactitud."
  - id: c
    text:
      es: "A qué datos se refiere y quién se los comunicó al responsable."
  - id: d
    correct: true
    text:
      es: "A qué datos se refiere y la corrección que haya de realizarse."
  explanation:
    es: "El artículo 14 de la LOPDGDD dice que el afectado «deberá indicar en su solicitud a qué datos se refiere y la corrección que haya de realizarse». El fin de la recogida, la causa de la inexactitud y quién comunicó los datos al responsable no forman parte de lo que debe indicar."
  citation: "art. 14 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-17
- id: m02-l04-q022
  prompt:
    es: "Según el artículo 17.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿en cuál de los siguientes casos debe el responsable suprimir sin dilación indebida los datos personales del interesado?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el interesado retire el consentimiento y el tratamiento no se base en otro fundamento jurídico."
  - id: b
    text:
      es: "Cuando el interesado retire el consentimiento, aunque el tratamiento tenga otro fundamento jurídico."
  - id: c
    text:
      es: "Cuando los datos sean necesarios para la formulación, el ejercicio o la defensa de reclamaciones."
  - id: d
    text:
      es: "Cuando el interesado lo pida, sin que sea preciso que concurra ninguna otra circunstancia."
  explanation:
    es: "El artículo 17.1.b) obliga a suprimir cuando el interesado retire el consentimiento «y este no se base en otro fundamento jurídico». Si existe otro fundamento, la retirada no obliga a suprimir. La formulación, el ejercicio o la defensa de reclamaciones es una excepción al derecho de supresión (artículo 17.3). La petición sola no basta: tiene que concurrir alguna de las circunstancias del apartado 1."
  citation: "art. 17.1 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-17
- id: m02-l04-q023
  prompt:
    es: "Según el Reglamento (UE) 2016/679, ¿cuál de los siguientes supuestos excluye la aplicación del derecho de supresión?"
  options:
  - id: a
    text:
      es: "Que el interesado haya retirado el consentimiento en que se basaba el tratamiento de sus datos personales."
  - id: b
    text:
      es: "Que los datos personales hayan sido tratados ilícitamente por el responsable."
  - id: c
    correct: true
    text:
      es: "Que el tratamiento sea necesario para ejercer el derecho a la libertad de expresión e información."
  - id: d
    text:
      es: "Que los datos ya no sean necesarios para los fines para los que fueron recogidos."
  explanation:
    es: "El artículo 17.3.a) dice que el derecho de supresión no se aplica cuando el tratamiento sea necesario «para ejercer el derecho a la libertad de expresión e información». La retirada del consentimiento, el tratamiento ilícito y que los datos ya no sean necesarios son, al revés, casos en que el responsable debe suprimir (artículo 17.1)."
  citation: "art. 17.3 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: celex-32016r0679-art-20
- id: m02-l04-q024
  prompt:
    es: "Según el artículo 20.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el derecho a la portabilidad existe cuando el tratamiento se efectúa por medios automatizados y está basado:"
  options:
  - id: a
    correct: true
    text:
      es: "En el consentimiento o en un contrato."
  - id: b
    text:
      es: "En una obligación legal o en un contrato."
  - id: c
    text:
      es: "En el consentimiento o en el interés público."
  - id: d
    text:
      es: "En intereses legítimos o en un contrato."
  explanation:
    es: "El artículo 20.1 exige que el tratamiento «esté basado en el consentimiento […] o en un contrato» y que se efectúe por medios automatizados. La obligación legal, el interés público y los intereses legítimos son otras bases de licitud del artículo 6.1 que no dan derecho a la portabilidad."
  citation: "art. 20.1 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-20
- id: m02-l04-q025
  prompt:
    es: "Al ejercer el derecho a la portabilidad, el interesado tiene derecho a recibir los datos personales que haya facilitado a un responsable del tratamiento:"
  options:
  - id: a
    text:
      es: "En papel, mediante una copia certificada por el responsable."
  - id: b
    text:
      es: "En el formato que elija libremente el responsable del tratamiento."
  - id: c
    text:
      es: "En formato electrónico, previo pago de un canon razonable."
  - id: d
    correct: true
    text:
      es: "En un formato estructurado, de uso común y lectura mecánica."
  explanation:
    es: "El artículo 20.1 del RGPD reconoce el derecho a recibir los datos «en un formato estructurado, de uso común y lectura mecánica». No es una copia certificada en papel. El formato no lo elige libremente el responsable. El Reglamento no condiciona la portabilidad al pago de un canon."
  citation: "art. 20.1 RGPD"
  difficulty: 1
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-21
- id: m02-l04-q027
  prompt:
    es: "Según el artículo 21.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿a qué tratamientos puede oponerse el interesado en cualquier momento por motivos relacionados con su situación particular?"
  options:
  - id: a
    correct: true
    text:
      es: "A los basados en una misión de interés público o en intereses legítimos del responsable o de un tercero."
  - id: b
    text:
      es: "A los basados en el consentimiento del interesado o en la ejecución de un contrato."
  - id: c
    text:
      es: "A los basados en una obligación legal aplicable al responsable o en la protección de intereses vitales del interesado."
  - id: d
    text:
      es: "A los basados en una obligación legal o en una misión realizada en interés público."
  explanation:
    es: "El artículo 21.1 reconoce la oposición frente al tratamiento basado en el artículo 6.1, «letras e) o f)»: la misión realizada en interés público y los intereses legítimos del responsable o de un tercero. El consentimiento, el contrato, la obligación legal y los intereses vitales son los artículos 6.1.a) a 6.1.d), a los que el artículo 21.1 no se refiere."
  citation: "art. 21.1 RGPD"
  difficulty: 3
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-21
- id: m02-l04-q028
  prompt:
    es: "¿En qué momento puede el interesado oponerse, según el Reglamento general de protección de datos, al tratamiento de sus datos que tenga por objeto la mercadotecnia directa?"
  options:
  - id: a
    text:
      es: "Solo en el momento de la recogida de los datos."
  - id: b
    text:
      es: "En el mes siguiente a la primera comunicación comercial."
  - id: c
    text:
      es: "Solo si acredita motivos de su situación particular."
  - id: d
    correct: true
    text:
      es: "En todo momento."
  explanation:
    es: "El artículo 21.2 dice que, frente a la mercadotecnia directa, el interesado «tendrá derecho a oponerse en todo momento». No se limita al momento de la recogida ni a un mes desde la primera comunicación. Los motivos de la situación particular se exigen en la oposición del artículo 21.1, no en esta."
  citation: "art. 21.2 RGPD"
  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-32016r0679-art-22
- id: m02-l04-q029
  prompt:
    es: "¿Cuál de los siguientes supuestos permite, según el Reglamento (UE) 2016/679, que el interesado sea objeto de una decisión basada únicamente en el tratamiento automatizado que produzca efectos jurídicos en él?"
  options:
  - id: a
    text:
      es: "Que la decisión se base en los intereses legítimos del responsable."
  - id: b
    text:
      es: "Que la decisión se haya notificado al interesado con un mes de antelación."
  - id: c
    text:
      es: "Que la decisión cuente con el informe previo del delegado de protección de datos."
  - id: d
    correct: true
    text:
      es: "Que la decisión se base en el consentimiento explícito del interesado."
  explanation:
    es: "El artículo 22.2 excluye el derecho del apartado 1 cuando la decisión es necesaria para un contrato, está autorizada por el Derecho de la Unión o de los Estados miembros o «se basa en el consentimiento explícito del interesado». Los intereses legítimos del responsable no están entre esos casos. Un preaviso de un mes o un informe del delegado tampoco."
  citation: "art. 22.2 RGPD"
  difficulty: 2
  tags:
  - "excepción"
