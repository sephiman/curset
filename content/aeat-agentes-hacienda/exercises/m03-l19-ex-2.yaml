    es: "¿Dónde debe haber quedado reflejada la circunstancia para que un crédito se considere incobrable, según el artículo 80.Cuatro.A.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
