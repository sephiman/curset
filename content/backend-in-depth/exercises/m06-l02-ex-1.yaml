- id: m06-l02-q17
  prompt:
    en: In Hibernate 7.4, what does the version property mapped with `@Version` let the entity manager do?
  options:
  - id: a
    text:
      en: Let the last committer silently overwrite the work of the other conversation
  - id: b
    text:
      en: Replace the database locking with in-memory locks on the entity objects
  - id: c
    correct: true
    text:
      en: Detect conflicting updates and prevent lost updates under last-commit-wins
  - id: d
    text:
      en: Let the application raise the version number by hand to flag a conflict
  explanation:
    en: The version property detects conflicting updates and prevents lost updates under last-commit-wins. With
      versioning, the last to commit is informed of the conflict and does not override the other conversation's
      work. Hibernate never locks objects in memory. The application is forbidden from altering the version number
      set by Hibernate.
  citation: hibernate-user-guide#locking-optimistic-version-number; hibernate-user-guide#locking-optimistic; hibernate-user-guide#locking-pessimistic
- id: m06-l02-q18
  prompt:
    en: In Hibernate 7.4, an application needs exclusive pessimistic locks on entities it loads. How does Hibernate
      handle the locking itself?
  options:
  - id: a
    correct: true
    text:
      en: It always uses the database's own locking mechanism and never locks objects in memory
  - id: b
    text:
      en: It locks the entity objects in memory and releases those locks at flush time
  - id: c
    text:
      en: It leaves locking to the application, because the database offers no exclusive locks
  - id: d
    text:
      en: It ignores the JDBC isolation level and takes its own locks for every query
  explanation:
    en: Hibernate always uses the database locking mechanism and never locks objects in memory. It gives you the
      tools to obtain exclusive pessimistic locks, so the application does not take over locking. Typically you
      only need to specify an isolation level for the JDBC connections and let the database handle locking issues.
  citation: hibernate-user-guide#locking-pessimistic
- id: m06-l02-q19
  prompt:
    en: In PostgreSQL 18, a transaction holds `FOR UPDATE` locks on rows. What happens to a plain `SELECT` of those
      rows by another transaction?
  options:
  - id: a
    text:
      en: It waits until the lock holder's transaction ends, then reads the row
  - id: b
    correct: true
    text:
      en: It is not blocked, because row-level locks block only writers and lockers
  - id: c
    text:
      en: It sees the uncommitted version of the rows that are locked by the holder
  - id: d
    text:
      en: It is blocked only when the reading transaction runs at the Serializable level
  explanation:
    en: Row-level locks do not affect data querying, so a plain `SELECT` is not blocked. A Read Committed `SELECT`
      never sees uncommitted data. Serializable monitoring does not introduce any blocking beyond that present in
      Repeatable Read.
  citation: pg-explicit-locking#LOCKING-ROWS; pg-transaction-iso#XACT-READ-COMMITTED; pg-transaction-iso#XACT-SERIALIZABLE
  extract:
    en: Row-level locks do not affect data querying; they block only writers and lockers to the same row.
- id: m06-l02-q20
  prompt:
    en: In PostgreSQL 18, a `SELECT ... FOR UPDATE NOWAIT` selects a row that another transaction has locked. What
      does the statement do?
  options:
  - id: a
    correct: true
    text:
      en: It reports an error rather than waiting
  - id: b
    text:
      en: It skips the row and returns the other rows
  - id: c
    text:
      en: It waits until a lock timeout and then skips the row
  - id: d
    text:
      en: It locks the row anyway and returns the version it last saw
  explanation:
    en: With `NOWAIT` the statement reports an error rather than waiting. Skipping rows is what `SKIP LOCKED` does.
      Waiting is what `NOWAIT` and `SKIP LOCKED` exist to prevent. Two transactions can never hold conflicting locks
      on the same row.
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE; pg-explicit-locking#LOCKING-ROWS
  extract:
    en: With NOWAIT, the statement reports an error, rather than waiting, if a selected row cannot be locked immediately.
- id: m06-l02-q21
  prompt:
    en: According to the PostgreSQL 18 documentation, for what can `SKIP LOCKED` be used, even though it provides
      an inconsistent view of the data?
  options:
  - id: a
    text:
      en: General purpose reporting queries that need a consistent view of the table
  - id: b
    text:
      en: Aggregations that must lock every row that they read
  - id: c
    text:
