- id: m11-l02-v-optional-chain-001
  prompt:
    en: |-
      What does this program print, line by line? The first two lines are the results of the two `Optional` chains and the third is the value of `calls`.

      ```java
      import java.util.Optional;

      public class Main {
          static int calls = 0;

          static String fallback() {
              calls++;
              return "none";
          }

          static String pick(String value) {
              return Optional.ofNullable(value).map(String::toUpperCase).filter(s -> s.startsWith("L")).orElse(fallback());
          }

          public static void main(String[] args) {
              System.out.println(pick("linus"));
              System.out.println(pick("ruby"));
              System.out.println(calls);
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`LINUS`, `none`, `2`'
    correct: true
  - id: b
    text:
      en: '`LINUS`, `none`, `1`'
  - id: c
    text:
      en: '`none`, `RUBY`, `2`'
  - id: d
    text:
      en: '`none`, `none`, `2`'
  explanation:
    en: 'The first chain starts from `Optional.ofNullable("linus")`: `map` gives `LINUS` and `filter` keeps it because it
      starts with `L`, so it gives `LINUS`. The second chain starts from `Optional.ofNullable("ruby")`: `map` gives `RUBY`
      and `filter` drops it because it does not start with `L`, so it gives `none`. Each `orElse(fallback())` evaluates `fallback()`
      as its argument before `orElse` runs, so `calls` is `2` whether or not a value is present. The program prints `LINUS`,
      `none`, `2`. `LINUS`, `none`, `1` comes from this mistake: evaluating `fallback()` only when the chain is empty. The
      argument expressions of a method invocation are evaluated before control reaches the method code, so `fallback()` runs
      even when `orElse` returns the value. `none`, `RUBY`, `2` comes from this mistake: reading `filter` as dropping the
      values that start with the letter. `filter` returns an `Optional` describing the value if it matches the predicate,
      and an empty `Optional` otherwise. `none`, `none`, `2` comes from this mistake: checking the end of the text instead
      of its start. `startsWith` tests the first characters of the text, not the last.'
