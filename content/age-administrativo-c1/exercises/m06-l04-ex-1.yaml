- id: m06-l04-q026
  prompt:
    es: "En Word 365, con varios objetos seleccionados a la vez, ¿cómo se cancela la selección de uno de ellos sin perder la de los demás?"
  options:
  - id: a
    text:
      es: "Presionando Mayús+Tab hasta que ese objeto quede seleccionado"
  - id: b
    text:
      es: "Haciendo clic con el botón derecho en el objeto y eligiendo Agrupar"
  - id: c
    text:
      es: "Presionando la tecla Esc con el puntero situado sobre ese objeto"
  - id: d
    correct: true
    text:
      es: "Manteniendo presionada Mayús o Ctrl mientras se hace clic en ese objeto"
  explanation:
    es: "La tabla dice: «Cancelar la selección de un objeto por vez. | Mantenga presionada la tecla Mayús o Ctrl mientras hace clic o pulsa en cada objeto». Mayús+Tab recorre la pila de objetos hacia atrás. Agrupar, en el menú del botón derecho, une los objetos seleccionados en un grupo. Según la página de atajos de Word, Esc sirve para salir de la navegación por formas flotantes, no para quitar un objeto de la selección."
  citation: "fuente: `ms-word-seleccionar-objetos.html`; «Consejos para seleccionar formas y objetos»"
  difficulty: 3
  tags:
