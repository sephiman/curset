# anchor: boe-a-2011-18541-art-11
- id: m02-l03-q133
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Archivo General de la Administración lleva a cabo las transferencias preceptivas y periódicas de documentos al Archivo histórico, acompañadas de:"
  options:
  - id: a
    text:
      es: "Un informe previo de la Comisión de Archivos de la Administración General del Estado."
  - id: b
    text:
      es: "Una copia en soporte alternativo de cada documento transferido."
  - id: c
    text:
      es: "El calendario de conservación aprobado por el Ministerio de origen."
  - id: d
    correct: true
    text:
      es: "Los correspondientes instrumentos de descripción elaborados."
  explanation:
    es: "Las transferencias al archivo histórico llevan los instrumentos de descripción elaborados. Un informe de la Comisión de Archivos, una copia en soporte alternativo o el calendario del Ministerio no se exigen en esa función."
  citation: "art. 11 RD 1708/2011"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q134
  prompt:
    es: "Como archivo histórico de la Administración General del Estado, ¿para qué aplica el Archivo Histórico Nacional programas de reproducción de documentos en soportes alternativos?"
  options:
  - id: a
    text:
      es: "Para sustituir los originales, que se eliminan una vez reproducidos todos."
  - id: b
    text:
      es: "Para facilitar la transferencia de los documentos desde el archivo intermedio."
  - id: c
    correct: true
    text:
      es: "Para garantizar la conservación de los originales y fomentar su difusión."
  - id: d
    text:
      es: "Para impedir el acceso de los ciudadanos a los originales conservados."
  explanation:
    es: "La reproducción en soportes alternativos protege los originales y favorece su difusión. No sustituye a los originales ni los elimina, no sirve para transferirlos al intermedio, que es una fase anterior, y no busca impedir el acceso."
  citation: "art. 12.2.b) RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q135
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Archivo Histórico Nacional impulsa programas de difusión y gestión cultural del:"
  options:
  - id: a
    correct: true
    text:
      es: "Patrimonio documental custodiado."
  - id: b
    text:
      es: "Patrimonio histórico de las Delegaciones del Gobierno."
  - id: c
    text:
      es: "Patrimonio documental de los archivos privados."
  - id: d
    text:
      es: "Patrimonio bibliográfico de las bibliotecas públicas."
  explanation:
    es: "Los programas de difusión y gestión cultural se refieren al patrimonio documental que el propio Archivo Histórico Nacional custodia. Las bibliotecas, las Delegaciones y los archivos privados quedan fuera."
  citation: "art. 12.2.e) RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q136
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, en el ámbito de los servicios periféricos del Estado desempeñan idénticas funciones a las de los archivos intermedio e histórico:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Archivos Históricos Provinciales o los que se creen en las Delegaciones de Gobierno."
  - id: b
    text:
      es: "Los archivos de oficina de las Subdelegaciones del Gobierno y de sus unidades."
  - id: c
    text:
      es: "Los Archivos Centrales de cada Ministerio y de sus organismos públicos."
  - id: d
    text:
      es: "Los Patronatos de los Archivos Históricos de carácter nacional y los órganos colegiados."
  explanation:
    es: "En los servicios periféricos, esas funciones las ejercen los Archivos Históricos Provinciales o los que se creen en las Delegaciones de Gobierno. Los archivos de oficina y los Archivos Centrales cumplen funciones de otras fases, y los patronatos son de cooperación."
  citation: "art. 12.2 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-9
- id: m02-l03-q163
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, los archivos de oficina custodian los documentos en tramitación o sometidos a:"
  options:
  - id: a
    text:
      es: "Consulta restringida a la unidad productora."
  - id: b
    text:
      es: "Un plazo mínimo de conservación de cinco años."
  - id: c
    correct: true
    text:
      es: "Continua utilización y consulta administrativa."
  - id: d
    text:
      es: "Valoración documental periódica por el archivo intermedio."
  explanation:
    es: "Los archivos de oficina custodian documentos en tramitación o sometidos a continua utilización y consulta administrativa. La valoración la hace el Archivo Central. La consulta no se restringe a la unidad productora y el artículo no fija ningún plazo mínimo de cinco años."
  citation: "art. 9 RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q165
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, los archivos centrales custodian documentos tras su tramitación y los plazos fijados por:"
  options:
  - id: a
    text:
      es: "La Comisión de Archivos de la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "La normativa vigente o los calendarios de conservación."
  - id: c
    text:
      es: "El órgano que haya producido los documentos."
  - id: d
    text:
      es: "El archivo intermedio de cada Departamento."
  explanation:
    es: "El artículo fija los plazos por la normativa vigente o los calendarios de conservación. Ni la Comisión de Archivos, ni el archivo intermedio, ni el órgano productor los establecen según el texto."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2011-18541-art-10
- id: m02-l03-q166
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, el Archivo Central transfiere al archivo intermedio con su correspondiente:"
  options:
  - id: a
    text:
      es: "Calendario de conservación."
  - id: b
    correct: true
    text:
      es: "Relación de entrega."
  - id: c
    text:
      es: "Dictamen de la Comisión Calificadora."
  - id: d
    text:
      es: "Informe de valoración."
  explanation:
    es: "Las transferencias al archivo intermedio van acompañadas de su correspondiente relación de entrega. El informe de valoración, el calendario de conservación y el dictamen de la Comisión Calificadora son otros instrumentos del tratamiento archivístico que el apartado no asocia a la transferencia."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q168
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, los archivos históricos son responsables de la custodia, conservación y:"
  options:
  - id: a
    correct: true
    text:
      es: "Tratamiento de los fondos pertenecientes al patrimonio histórico documental español."
  - id: b
    text:
      es: "Valoración de los documentos en fase de tramitación."
  - id: c
    text:
      es: "Eliminación de los fondos transferidos desde el archivo intermedio."
  - id: d
    text:
      es: "Coordinación de los archivos de gestión de cada Departamento."
  explanation:
    es: "Los archivos históricos custodian, conservan y tratan los fondos del patrimonio histórico documental español. La eliminación y la valoración de documentos en tramitación son funciones de los archivos de gestión, central o intermedio. Coordinar los archivos de gestión corresponde al Archivo Central."
  citation: "art. 12.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-12
- id: m02-l03-q169
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos y se regula el Sistema de Archivos de la Administración General del Estado y de sus Organismos Públicos y su régimen de acceso, los archivos históricos custodian fondos de valor histórico, singular importancia o:"
  options:
  - id: a
    text:
      es: "Antigüedad superior a los cien años."
  - id: b
    text:
      es: "Interés para la gestión administrativa."
  - id: c
    correct: true
    text:
      es: "Proyección internacional."
  - id: d
    text:
      es: "Tamaño y volumen documental."
  explanation:
    es: "El artículo enumera tres razones de relevancia: valor histórico, singular importancia y proyección internacional. La antigüedad de cien años es un criterio de la ley de Patrimonio Histórico y no de este artículo. El volumen y el interés para la gestión administrativa tampoco se citan."
  citation: "art. 12.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "requisito"
