type: case
title:
  es: "La autorización de vertido"
scenario:
  es: "La Confederación Hidrográfica del Tajo, organismo autónomo con sede en Madrid, tramita varios asuntos. En los plazos por días hábiles que cuentan las cuestiones solo son inhábiles sábados y domingos, y el lunes, 9 de agosto de 2027, es hábil.\n\nLa empresa «Industrias Lácteas Ribereñas, S.L.» solicita una autorización de vertido al río Henares. El Comisario de Aguas publica el anuncio de información pública en el «Boletín Oficial del Estado» el miércoles, 3 de febrero de 2027. El Comisario de Aguas dicta el jueves, 4 de marzo de 2027, una resolución que no pone fin a la vía administrativa, y el lunes, 8 de marzo de 2027, la pone a su disposición en la sede electrónica. La empresa, obligada a relacionarse electrónicamente con la Administración, no accede a ella. El jueves, 8 de abril de 2027, interpone recurso de alzada. Otro expediente, iniciado a solicitud de «Áridos del Jarama, S.L.», queda paralizado por culpa de la empresa. El viernes, 7 de mayo de 2027, la Confederación le notifica que, transcurridos tres meses, se producirá la caducidad del procedimiento.\n\nLa Confederación licita por el procedimiento abierto simplificado la reparación de la escollera del Tajo, con un presupuesto base de licitación de 1.200.000 euros sin IVA, que es del 21 %. Lo adjudica a «Escolleras y Defensas Tajuña, S.A.» por 1.080.000 euros, IVA excluido. El miércoles, 21 de julio de 2027, la mesa le envía la comunicación electrónica que le requiere la garantía definitiva; el lunes, 2 de agosto de 2027, se formaliza el contrato. El pliego prevé la revisión periódica de precios y fija el viernes, 14 de enero de 2028, como fecha de terminación. La empresa entrega la obra el miércoles, 9 de febrero de 2028, 26 días naturales tarde, por causas imputables a ella. El lunes, 7 de febrero de 2028, la Confederación aprueba la última certificación de obra.\n\nEl martes, 12 de enero de 2027, el «Boletín Oficial del Estado» publica la convocatoria de un concurso del Ministerio de Hacienda en el que participa Doña Beatriz Lorente Cuesta. Don Mateo Arjona Pardo, funcionario de carrera de la Confederación, tiene una hija nacida el miércoles, 17 de febrero de 2027, y solicita excedencia por cuidado de hijos desde el lunes, 3 de abril de 2028, por el tiempo máximo legal. Doña Irene Cobos Marín, funcionaria, solicita excedencia para cuidar a su madre, que está a su cargo, no puede valerse por sí misma por enfermedad y no trabaja. El Presidente de la Confederación incoa expediente disciplinario a Don Rubén Salcedo Ibáñez, Jefe de Negociado, por usar en febrero de 2027 el vehículo oficial para fines particulares, y acuerda su suspensión provisional. Su sueldo mensual es de 1.100 euros y sus trienios suman 60 euros.\n\nUn gasto inaplazable por una crecida del Tajo corresponde al capítulo 2, de crédito inicial no ampliable, 6.200.000 euros, agotado; no hay crédito en otras partidas. Faltan 640.000 euros y se tramita un suplemento de crédito. Este año el Presidente ya ha autorizado en ese capítulo suplementos por 300.000 euros, financiados con remanente de tesorería. La Intervención Delegada formula reparo al expediente por insuficiencia de crédito y el órgano gestor no lo acepta. El Estado se compromete firmemente a aportar 150.000 euros este año, aún sin ingresar.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-83
- id: q21
  lesson: m03-l03
  prompt:
    es: "Según el artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál es la fecha más temprana en que puede concluir el plazo de alegaciones de la información pública del vertido?"
  options:
  - id: a
    text:
      es: "Martes, 23 de febrero de 2027."
  - id: b
    text:
      es: "Miércoles, 24 de febrero de 2027."
  - id: c
    text:
      es: "Martes, 2 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "Miércoles, 3 de marzo de 2027."
  explanation:
    es: "El anuncio determina el plazo para formular alegaciones, que en ningún caso puede ser inferior a veinte días (art. 83.2 LPAC), y los días son hábiles salvo que la ley diga otra cosa (art. 30.2 LPAC). Se cuentan desde el día siguiente a la publicación (art. 30.3 LPAC): el primero es el jueves 4 de febrero y el vigésimo hábil, el miércoles 3 de marzo, porque solo se excluyen sábados y domingos. La fecha del 23 de febrero cuenta veinte días naturales. La del 24 de febrero aplica los quince días hábiles máximos de la audiencia. La del 2 de marzo cuenta como primer día el de la publicación."
  citation: "art. 83.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-121
- id: q41
  lesson: m03-l03
  prompt:
    es: "Según el artículo 121.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la empresa presentó la alzada ante el propio Comisario de Aguas, ¿hasta qué fecha debe remitirla este al órgano competente para resolverla?"
  options:
  - id: a
    text:
      es: "Domingo, 18 de abril de 2027."
  - id: b
    text:
      es: "Miércoles, 21 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "Jueves, 22 de abril de 2027."
  - id: d
    text:
      es: "Sábado, 8 de mayo de 2027."
  explanation:
    es: "Si el recurso de alzada se interpone ante el órgano que dictó el acto, este debe remitirlo al competente en el plazo de diez días, con su informe y una copia del expediente (art. 121.2 LPAC). Los plazos por días son hábiles (art. 30.2 LPAC) y empiezan el día siguiente a la presentación, el jueves 8 de abril de 2027. Sin sábados ni domingos, el primer día es el viernes 9 de abril y el décimo, el jueves 22 de abril. La fecha del miércoles 21 de abril cuenta como primer día el de la presentación. La del domingo 18 de abril cuenta diez días naturales. La del sábado 8 de mayo aplica el plazo de un mes, que es el que tiene la empresa para interponer la alzada y no el que tiene el órgano para remitirla."
  citation: "art. 121.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-43
- id: q43
  lesson: m03-l02
  prompt:
    es: "Según el artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué fecha se entiende rechazada la notificación electrónica de la resolución del vertido?"
  options:
  - id: a
    text:
      es: "Miércoles, 17 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "Jueves, 18 de marzo de 2027."
  - id: c
    text:
      es: "Martes, 23 de marzo de 2027."
  - id: d
    text:
      es: "Jueves, 8 de abril de 2027."
  explanation:
    es: "Si la notificación electrónica es obligatoria, se entiende rechazada cuando han transcurrido diez días naturales desde la puesta a disposición sin acceder a su contenido (art. 43.2 LPAC). Los días naturales se cuentan desde el día siguiente (art. 30.3 LPAC): el primero es el martes 9 de marzo y el décimo, el jueves 18 de marzo. La fecha del 17 de marzo cuenta como primer día el de la puesta a disposición. La del 23 de marzo cuenta diez días hábiles, sin contar el viernes 19 de marzo, festivo en Madrid. La del 8 de abril cuenta un mes."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-122
- id: q24
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 122.2 de la Ley 39/2015, de 1 de octubre, ¿hasta qué fecha puede el órgano competente dictar y notificar la resolución del recurso de alzada, pasada la cual cabe entenderlo desestimado?"
  options:
  - id: a
    text:
      es: "Martes, 8 de junio de 2027."
  - id: b
    text:
      es: "Viernes, 18 de junio de 2027."
  - id: c
    text:
      es: "Miércoles, 7 de julio de 2027."
  - id: d
    correct: true
    text:
      es: "Jueves, 8 de julio de 2027."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución de la alzada es de tres meses, y transcurrido sin resolución se puede entender desestimado el recurso (art. 122.2 LPAC). Los meses se cuentan de fecha a fecha, desde el día siguiente a la interposición (art. 30.4 LPAC): terminan el jueves 8 de julio. La fecha del 8 de junio cuenta dos meses. La del 7 de julio cuenta noventa días naturales, que no equivalen a tres meses. La del 18 de junio parte de la fecha en que se tiene por rechazada la notificación, cuando el cómputo arranca con la interposición del recurso."
  citation: "art. 122.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-95
- id: q25
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 95.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál es el último día del plazo de que dispone «Áridos del Jarama, S.L.» para reanudar la tramitación antes de que se acuerde el archivo?"
  options:
  - id: a
    text:
      es: "Jueves, 5 de agosto de 2027."
  - id: b
    text:
      es: "Viernes, 6 de agosto de 2027."
  - id: c
    text:
      es: "Sábado, 7 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "Lunes, 9 de agosto de 2027."
  explanation:
    es: "Cuando el procedimiento iniciado a solicitud se paraliza por causa imputable al interesado, la Administración le advierte de que, transcurridos tres meses, se producirá la caducidad (art. 95.1 LPAC). El plazo de tres meses se cuenta de fecha a fecha desde el día siguiente a la notificación y termina el sábado 7 de agosto (art. 30.4 LPAC). Como es inhábil, se prorroga al primer día hábil siguiente, el lunes 9 de agosto (art. 30.5 LPAC). La fecha del sábado 7 de agosto olvida esa prórroga. La del jueves 5 de agosto cuenta noventa días naturales. La del viernes 6 de agosto cuenta como primer día el de la notificación."
  citation: "art. 95.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-159
- id: q26
  lesson: m03-l04
  prompt:
    es: "Según el artículo 159.4.f) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿hasta qué fecha puede la empresa adjudicataria constituir la garantía definitiva del contrato de obras de la escollera?"
  options:
  - id: a
    text:
      es: "Miércoles, 28 de julio de 2027."
  - id: b
    text:
      es: "Jueves, 29 de julio de 2027."
  - id: c
    correct: true
    text:
      es: "Viernes, 30 de julio de 2027."
  - id: d
    text:
      es: "Miércoles, 4 de agosto de 2027."
  explanation:
    es: "En el abierto simplificado, la mesa requiere a la empresa con la mejor puntuación mediante comunicación electrónica para que constituya la garantía definitiva en siete días hábiles a contar desde el envío (art. 159.4.f) LCSP). Los días hábiles se cuentan desde el día siguiente y excluyen sábados y domingos: el primero es el jueves 22 de julio y el séptimo, el viernes 30 de julio. La fecha del 28 de julio cuenta siete días naturales. La del 29 de julio cuenta como primer día el del envío. La del 4 de agosto aplica los diez días hábiles del requerimiento ordinario del artículo 150.2."
  citation: "art. 159.4.f) LCSP"
  difficulty: 2
  tags:
  - "plazo"
