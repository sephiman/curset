- id: m02-l11-q068
  prompt:
    es: "En Outlook 365, ¿sobre qué correo actúan automáticamente las reglas, según la ayuda de Microsoft sobre administrar mensajes con reglas?"
  options:
  - id: a
    text:
      es: "Solo sobre el correo que el usuario selecciona a mano"
  - id: b
    correct: true
    text:
      es: "Sobre el correo que llega a la bandeja de entrada"
  - id: c
    text:
      es: "Sobre el correo ya guardado en Elementos enviados"
  - id: d
    text:
      es: "Sobre el correo de los grupos de Microsoft 365 únicamente"
  explanation:
    es: "Las reglas realizan automáticamente acciones específicas en el correo que llega a la bandeja de entrada. El correo de Elementos enviados contradice esa frase. Actuar solo sobre lo que el usuario selecciona a mano contradice que sean automáticas. Limitarlas a los grupos de Microsoft 365 contradice que actúen sobre el correo que llega a su bandeja."
  citation: "fuente: `ms-outlook-reglas.html`; «Reglas de mensaje»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-reglas-html
- id: m02-l11-q234
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones describe cómo se cambia el orden de aplicación de las reglas de bandeja de entrada a los mensajes entrantes?"
  options:
  - id: a
    text:
      es: "Activando la casilla Detener el procesamiento de más reglas."
  - id: b
    text:
      es: "Seleccionando Más acciones y Editar regla."
  - id: c
    correct: true
    text:
      es: "Con la flecha arriba o abajo, tras seleccionar una regla."
  - id: d
    text:
      es: "Usando el botón de alternancia junto al nombre de la regla."
  explanation:
    es: "El orden se cambia seleccionando una regla de la lista de reglas de bandeja de entrada y usando la flecha arriba o abajo. La casilla Detener el procesamiento de más reglas hace que no se ejecute ninguna regla después de la que se crea, pero no reordena. El botón de alternancia pausa o reanuda una regla sin eliminarla. Más acciones › Editar regla abre la regla para editarla, y se guarda con Guardar."
  citation: "fuente: `ms-outlook-reglas.html`; «Seleccione una regla y, luego, use la flecha arriba o la flecha abajo para cambiar el orden en el que se aplicará a los mensajes entrantes.»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-reglas-html
- id: m02-l11-q235
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes capacidades actúa sola sobre el correo que llega, para cambiar su importancia, moverlo a otra carpeta o eliminarlo según criterios?"
  options:
  - id: a
    text:
      es: "Un grupo de contactos"
  - id: b
    text:
      es: "Limpiar conversación"
  - id: c
    text:
      es: "Ignorar conversación"
  - id: d
    correct: true
    text:
      es: "Una regla"
  explanation:
    es: "Una regla actúa automáticamente sobre el correo que llega a la bandeja de entrada: cambia su importancia, lo mueve o lo elimina según criterios. Ignorar conversación solo mueve a Elementos eliminados los mensajes de una conversación elegida, sin criterios. Limpiar conversación elimina mensajes redundantes de la conversación actual. Un grupo de contactos reúne contactos para escribir a varias personas y no procesa correo entrante."
  citation: "fuente: `ms-outlook-reglas.html`; «Use reglas para realizar automáticamente acciones específicas en el correo electrónico que llega a su bandeja de entrada»"
  difficulty: 1
  tags:
  - "concepto"
