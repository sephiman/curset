# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q043
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes descripciones corresponde al Registro, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Un registro de los eventos del sistema, la seguridad y las aplicaciones"
  - id: b
    text:
      es: "Una copia de seguridad de los archivos de sistema en una unidad USB"
  - id: c
    text:
      es: "Una lista de los programas que se ejecutan al iniciar Windows y su impacto"
  - id: d
    correct: true
    text:
      es: "Una base de datos con la configuración de bajo nivel de Windows y sus aplicaciones"
  explanation:
    es: "La página dice que el Registro es una base de datos que almacena la configuración de bajo nivel para Windows y para las aplicaciones que optan por usarlo. El registro de eventos es el Visor de eventos, la copia de los archivos de sistema en USB es la Unidad de recuperación y la lista de programas de inicio se administra en el Administrador de tareas."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Editor del Registro»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q044
  prompt:
    es: "En Windows 11, ¿qué hay que seleccionar para habilitar el Historial de archivos, una vez en su configuración del Panel de control?"
  options:
  - id: a
    text:
      es: "Seleccionar unidad"
  - id: b
    text:
      es: "Restaurar"
  - id: c
    correct: true
    text:
      es: "Activar"
  - id: d
    text:
      es: "Aceptar"
  explanation:
    es: "La página dice que se selecciona Activar para habilitar el Historial de archivos. Seleccionar unidad permite elegir otra unidad de copia, Restaurar recupera una versión anterior y Aceptar confirma la unidad elegida."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q045
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft, el Historial de archivos guarda las copias periódicas de las bibliotecas:"
  options:
  - id: a
    text:
      es: "en una carpeta oculta de la unidad C del propio equipo"
  - id: b
    text:
      es: "en la Papelera de reciclaje, hasta que se vacía"
  - id: c
    correct: true
    text:
      es: "en una unidad externa o en una ubicación de red"
  - id: d
    text:
      es: "en una unidad USB de recuperación creada con Recovery Drive"
  explanation:
    es: "La página dice que el Historial de archivos realiza copias de seguridad periódicas en una unidad externa o ubicación de red, y que hay que conectar la unidad o configurar la ubicación de red. Una carpeta oculta de la unidad C o la Papelera no son esos destinos, y la unidad USB de recuperación se crea con la Unidad de recuperación para reinstalar Windows."
  citation: "fuente: `ms-win-historial-archivos.html`; «Historial de archivos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q046
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones permite incluir en las copias del Historial de archivos una carpeta que está fuera de las bibliotecas?"
  options:
  - id: a
    correct: true
    text:
      es: "Agregarla a una biblioteca existente o a una nueva"
  - id: b
    text:
      es: "Anclarla a Acceso rápido con el clic derecho en la carpeta"
  - id: c
    text:
      es: "Anclarla al menú Inicio con el clic derecho en la carpeta"
  - id: d
    text:
      es: "Compartirla con Conceder acceso a › Personas específicas"
  explanation:
    es: "La página dice que las carpetas de otra ubicación se pueden agregar a una biblioteca existente o a una biblioteca nueva, por ejemplo con el clic derecho en la carpeta y Mostrar más opciones › Incluir en biblioteca. Anclar a Acceso rápido o a Inicio solo cambia dónde aparece la carpeta y Conceder acceso a sirve para compartirla en la red."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q047
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones del menú contextual de una carpeta permite restaurar un archivo o una carpeta a un estado anterior con el Historial de archivos?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Incluir en biblioteca"
  - id: b
    text:
      es: "Abrir en el Historial de archivos"
  - id: c
    text:
      es: "Anclar a acceso rápido"
  - id: d
    correct: true
    text:
      es: "Restaurar versiones anteriores"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en el nombre de la carpeta y se selecciona Restaurar versiones anteriores. Incluir en biblioteca agrega la carpeta a una biblioteca, Abrir en el Historial de archivos solo muestra una vista previa de la versión elegida y Anclar a acceso rápido ancla la carpeta."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q048
  prompt:
    es: "En Windows 11, ¿qué enumera la pestaña Versiones anteriores de un archivo o carpeta, en la restauración con el Historial de archivos?"
  options:
  - id: a
    text:
      es: "Las unidades externas y ubicaciones de red conectadas"
  - id: b
    correct: true
    text:
      es: "Las versiones anteriores disponibles del elemento"
  - id: c
    text:
      es: "Los eventos de recuperación del sistema y de la seguridad"
  - id: d
    text:
      es: "Los archivos que están en la Papelera de reciclaje"
  explanation:
    es: "La página dice que la pestaña Versiones anteriores enumera las versiones anteriores disponibles del archivo o carpeta. Las unidades y ubicaciones de red se eligen al configurar el Historial, los eventos se ven en el Visor de eventos y la Papelera guarda temporalmente lo eliminado."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q049
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones permite obtener una vista previa del contenido de la versión seleccionada en el Historial de archivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir y, después, Abrir en el Historial de archivos"
  - id: b
    text:
      es: "Restaurar y, después, Restaurar en..."
  - id: c
    text:
      es: "Seleccionar unidad y, después, Aceptar"
  - id: d
    text:
      es: "Activar y, después, Seleccionar unidad"
  explanation:
    es: "La página dice que, para obtener una vista previa del contenido de la versión seleccionada, se expande Abrir y se selecciona Abrir en el Historial de archivos. Restaurar en... restaura a otra ubicación y las demás parejas pertenecen a la configuración de la unidad de copia."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q050
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones restaura una versión del Historial de archivos a otra ubicación, para no sobrescribir la versión actual?"
  options:
  - id: a
    correct: true
    text:
      es: "Restaurar en..."
  - id: b
    text:
      es: "Restaurar"
  - id: c
    text:
      es: "Abrir en el Historial de archivos"
  - id: d
    text:
      es: "Seleccionar unidad"
  explanation:
    es: "La página dice que, para evitar sobrescribir la versión actual, se puede restaurar a otra ubicación expandiendo Restaurar y seleccionando Restaurar en.... Restaurar reemplaza la versión actual, Abrir en el Historial de archivos solo la muestra y Seleccionar unidad elige dónde se guardan las copias."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q051
  prompt:
    es: "Señale la afirmación correcta sobre la restauración de una versión con el botón Restaurar del Historial de archivos de Windows 11:"
  options:
  - id: a
    text:
      es: "El archivo o carpeta se guarda junto a la versión actual y se puede deshacer"
  - id: b
    text:
      es: "El archivo o carpeta se restaura solo a una unidad externa, sin tocar el equipo"
  - id: c
    text:
      es: "El archivo o carpeta se envía a la Papelera de reciclaje y se pierde la versión"
  - id: d
    correct: true
    text:
      es: "El archivo o carpeta reemplaza la versión actual y no se puede deshacer"
  explanation:
    es: "La advertencia de la página dice que el archivo o carpeta reemplaza la versión actual guardada en el equipo y que esta operación no se puede deshacer. Las otras afirmaciones hablan de guardar junto a la actual, de restaurar solo a una unidad externa o de enviar a la Papelera."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q171
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre el Administrador de tareas en Windows 11, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Ctrl+Esc"
  - id: b
    text:
      es: "Ctrl+Mayús"
  - id: c
    text:
      es: "Alt+Esc"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+Esc"
  explanation:
    es: "La página indica que el Administrador de tareas se abre con Ctrl+Mayús+Esc. Según la tabla de métodos abreviados, Ctrl+Esc abre el menú Inicio, Ctrl+Mayús cambia la distribución del teclado y Alt+Esc se desplaza por las ventanas en el orden en que se abrieron."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Use el método abreviado de teclado CTRL+MAYÚS+ESC.»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q172
  prompt:
    es: "¿Qué es el Administrador de tareas de Windows 11, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Un complemento de MMC que registra los eventos del sistema, la seguridad y las aplicaciones"
  - id: b
    text:
      es: "Una utilidad que crea un medio USB para restaurar el equipo a su configuración de fábrica"
  - id: c
    correct: true
    text:
      es: "Un monitor del sistema y administrador de inicio que informa del rendimiento"
  - id: d
    text:
      es: "Una base de datos con la configuración de bajo nivel de Windows y de las aplicaciones"
  explanation:
    es: "La página dice que el Administrador de tareas es un monitor del sistema y administrador de inicio que informa del rendimiento y del consumo de recursos del dispositivo. El complemento de MMC que registra eventos es el Visor de eventos, el medio USB es la Unidad de recuperación y la base de datos de bajo nivel es el Registro."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Administrador de tareas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q173
  prompt:
    es: "En Windows 11, ¿qué permite evaluar el Administrador de tareas, además de ver y administrar las aplicaciones en ejecución?"
  options:
  - id: a
    text:
      es: "El origen, la fecha y la hora de cada evento y su código de error"
  - id: b
    correct: true
    text:
      es: "La carga de la CPU, la memoria, el disco y la red"
  - id: c
    text:
      es: "Las versiones anteriores de los archivos y las carpetas del usuario"
  - id: d
    text:
      es: "Las unidades de red y las ubicaciones asignadas a cada letra"
  explanation:
    es: "La página dice que el Administrador de tareas permite ver y administrar aplicaciones en ejecución y evaluar la carga de la CPU, el uso de memoria, la actividad del disco y el uso de la red. El origen, la fecha y el código de error de cada evento son del Visor de eventos, las versiones anteriores son del Historial de archivos y las unidades de red son de Asignar unidad de red."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Administrador de tareas»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q174
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones con el ratón abre el Administrador de tareas, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Hacer clic con el botón derecho en Inicio y seleccionar Visor de eventos"
  - id: b
    correct: true
    text:
      es: "Hacer clic con el botón derecho en Inicio y seleccionar Administrador de tareas"
  - id: c
    text:
      es: "Hacer clic con el botón derecho en Inicio y seleccionar Administración de equipos"
  - id: d
    text:
      es: "Hacer clic derecho en Inicio y seleccionar Configuración"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en Inicio y se selecciona Administrador de tareas. Los mismos pasos con Visor de eventos, Administración de equipos o Configuración abren esas otras herramientas."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Administrador de tareas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q175
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al Visor de eventos de Windows 11, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Un complemento de MMC para ver y administrar registros de eventos"
  - id: b
    text:
      es: "Un monitor del sistema y administrador de inicio para Windows, con datos de rendimiento"
  - id: c
    text:
      es: "Una utilidad que muestra una vista completa del hardware y los componentes del sistema"
  - id: d
    text:
      es: "Un editor que permite ver y modificar la configuración de bajo nivel del sistema"
  explanation:
    es: "La página dice que el Visor de eventos es un complemento de Microsoft Management Console (MMC) que se usa para ver y administrar registros de eventos. El monitor del sistema es el Administrador de tareas, la vista del hardware y los componentes es Información del sistema y el editor de bajo nivel es el Editor del Registro."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q176
  prompt:
    es: "En Windows 11, ¿qué registra de forma detallada el Visor de eventos, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Los programas que se inician con Windows y su impacto en el arranque"
  - id: b
    text:
      es: "El consumo de CPU, memoria y disco en tiempo real"
  - id: c
    text:
      es: "Las copias de las bibliotecas guardadas en una unidad externa"
  - id: d
    correct: true
    text:
      es: "Los eventos del sistema, de la seguridad y de las aplicaciones"
  explanation:
    es: "La página dice que el Visor de eventos proporciona un registro detallado de los eventos del sistema, la seguridad y las aplicaciones. Los programas de inicio y el consumo de recursos son del Administrador de tareas y las copias de las bibliotecas son del Historial de archivos."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q177
  prompt:
    es: "¿Cuál de las siguientes informaciones puede mostrar el Visor de eventos de Windows 11 sobre un evento?"
  options:
  - id: a
    text:
      es: "La edición de Windows, la versión y la compilación del sistema"
  - id: b
    text:
      es: "El tipo de procesador, la RAM instalada y la arquitectura de 32 o 64 bits del equipo"
  - id: c
    correct: true
    text:
      es: "El origen del evento, la fecha y hora y cualquier código de error o mensaje"
  - id: d
    text:
      es: "Las letras de unidad, la ruta de la carpeta y la unidad de red asignada"
  explanation:
    es: "La página dice que el Visor de eventos puede mostrar el origen de un evento, la fecha y hora en que se produjo y cualquier código de error o mensaje asociado. La edición y la versión de Windows están en Especificaciones de Windows, el procesador y la RAM en Especificaciones del dispositivo y la letra de unidad y la carpeta son de Asignar unidad de red."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q178
  prompt:
    es: "En Windows 11, ¿en qué categorías está organizado el Visor de eventos, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Registros de usuario, registros de red y registros de hardware del equipo"
  - id: b
    text:
      es: "Registros de Windows, registros de dispositivos y copias de seguridad"
  - id: c
    correct: true
    text:
      es: "Registros de Windows, de aplicaciones y servicios, y suscripciones"
  - id: d
    text:
      es: "Registros de aplicaciones, suscripciones y versiones anteriores de archivos"
  explanation:
    es: "La página dice que el Visor de eventos está organizado en categorías como registros de Windows, registros de aplicaciones y servicios y suscripciones. Las otras opciones cambian alguna de ellas por registros de usuario, de red, de hardware, de dispositivos, copias de seguridad o versiones anteriores."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q179
  prompt:
    es: "¿Cuál de los siguientes comandos abre el Visor de eventos de Windows 11 desde el cuadro Ejecutar, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "compmgmt.msc"
  - id: b
    correct: true
    text:
      es: "eventvwr.msc"
  - id: c
    text:
      es: "gpedit.msc"
  - id: d
    text:
      es: "msinfo32"
  explanation:
    es: "La página indica que se usa la tecla Windows y R, se escribe eventvwr.msc y se presiona Entrar. compmgmt.msc abre Administración de equipos, gpedit.msc abre el Editor de directivas de grupo local y msinfo32 abre Información del sistema."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q180
  prompt:
    es: "¿Cuál de los siguientes comandos abre el Editor del Registro de Windows 11 desde el cuadro Ejecutar?"
  options:
  - id: a
    correct: true
    text:
      es: "regedit"
  - id: b
    text:
      es: "msconfig"
  - id: c
    text:
      es: "control"
  - id: d
    text:
      es: "eventvwr.msc"
  explanation:
    es: "La página indica que se usa la tecla Windows y R, se escribe regedit y se presiona Entrar. msconfig abre la Configuración del sistema, control abre el Panel de control y eventvwr.msc abre el Visor de eventos."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Editor del Registro»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q181
  prompt:
    es: "¿Qué permite cambiar el Editor del Registro de Windows 11 que no se expone en la interfaz de usuario?"
  options:
  - id: a
    text:
      es: "El nombre del dispositivo y el de su modelo, que se ven en Acerca de"
  - id: b
    text:
      es: "Las letras de las unidades de red asignadas con Asignar unidad de red"
  - id: c
    text:
      es: "Las alarmas y los temporizadores que ofrece la aplicación Reloj"
  - id: d
    correct: true
    text:
      es: "Las directivas del sistema y los tipos de archivo de ciertas aplicaciones"
  explanation:
    es: "La página dice que el Editor del Registro permite cambiar la configuración que no se expone en la interfaz de usuario, incluidas las directivas del sistema, las aplicaciones instaladas y los tipos de archivos que pueden abrir determinadas aplicaciones. El nombre y el modelo se ven en Acerca de, las letras de unidad se eligen al asignar la unidad de red y las alarmas se gestionan en el Reloj."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Editor del Registro»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q182
  prompt:
    es: "¿Cuál de las siguientes rutas lleva a la configuración del Historial de archivos en Windows 11?"
  options:
  - id: a
    text:
      es: "Panel de control › Sistema y seguridad › Herramientas de Windows"
  - id: b
    text:
      es: "Configuración › Sistema › Almacenamiento › Historial de archivos"
  - id: c
    text:
      es: "Configuración › Cuentas › Copias de seguridad de Windows"
  - id: d
    correct: true
    text:
      es: "Panel de control › Sistema y seguridad › Guardar copias de seguridad de los archivos con Historial de archivos"
  explanation:
    es: "La página dice que, en el Panel de control, en Sistema y seguridad, se selecciona Guardar copias de seguridad de los archivos con Historial de archivos. Herramientas de Windows es una carpeta con herramientas para administradores, y Almacenamiento muestra el espacio en disco. Copias de seguridad de Windows es otra herramienta de copia, distinta del Historial de archivos."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q183
  prompt:
    es: "¿Qué copia automáticamente el Historial de archivos de Windows 11, según la ayuda de Microsoft sobre esta función?"
  options:
  - id: a
    text:
      es: "Solo la biblioteca Documentos del usuario"
  - id: b
    correct: true
    text:
      es: "Todas las bibliotecas, incluidas las personalizadas"
  - id: c
    text:
      es: "Todo el contenido de la unidad C del equipo"
  - id: d
    text:
      es: "Solo las carpetas ancladas a Acceso rápido del Explorador"
  explanation:
    es: "La página dice que el Historial de archivos realiza automáticamente una copia de todas las bibliotecas, incluidas las predeterminadas, como Documentos, Imágenes, Vídeos y Música, y las personalizadas. Limitarlo a Documentos, a las carpetas de Acceso rápido o ampliarlo a toda la unidad C contradice esa frase."
  citation: "fuente: `ms-win-historial-archivos.html`; «Historial de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q184
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes tareas se puede hacer desde el Administrador de tareas, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Restaurar versiones anteriores de una carpeta"
  - id: b
    text:
      es: "Descomprimir una carpeta comprimida en zip"
  - id: c
    text:
      es: "Programar la copia de seguridad de las bibliotecas"
  - id: d
    correct: true
    text:
      es: "Finalizar programas que no responden"
  explanation:
    es: "El Administrador de tareas finaliza programas que no responden. Descomprimir en zip se hace con Extraer todo, la copia de las bibliotecas la gestiona el Historial de archivos y las versiones anteriores se restauran desde el menú contextual de la carpeta."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Administrador de tareas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q186
  prompt:
    es: "En la utilidad Configuración del sistema de Windows 11, que se abre con MSConfig, ¿qué ocurre con la pestaña Inicio, que sirve para administrar los programas que se inician con el sistema?"
  options:
  - id: a
    text:
      es: "Abre el Visor de eventos"
  - id: b
    text:
      es: "Abre el Editor del Registro"
  - id: c
    correct: true
    text:
      es: "Redirige al Administrador de tareas"
  - id: d
    text:
      es: "Abre la carpeta Herramientas de Windows"
  explanation:
    es: "La pestaña Inicio de Configuración del sistema redirige al Administrador de tareas en las versiones recientes. El Editor del Registro, la carpeta Herramientas de Windows y el Visor de eventos son otras herramientas, con su propio comando de apertura."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Configuración del sistema»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q187
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones recoge los criterios de filtrado de registros que cita como ejemplo la página de Microsoft sobre el Visor de eventos?"
  options:
  - id: a
    text:
      es: "Por el nivel de evento, la fecha y el nombre de usuario"
  - id: b
    text:
      es: "Por la fecha, las palabras clave y el tamaño del evento"
  - id: c
    correct: true
    text:
      es: "Por el nivel de evento, la fecha y las palabras clave"
  - id: d
    text:
      es: "Por el nivel de evento y el código de error, pero no por la fecha"
  explanation:
    es: "La página cita como ejemplo el nivel de evento, la fecha y las palabras clave. Cada alternativa sustituye o quita alguno: nombre de usuario y tamaño del evento no son los que cita, y la fecha sí es uno de ellos."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Visor de eventos»"
  difficulty: 3
  tags:
