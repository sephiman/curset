# anchor: boe-a-2015-10566-art-68
- id: m01-l08-q093
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde a los servicios comunes de los Ministerios, según el artículo 68.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Ejercer la potestad reglamentaria en las materias propias del Departamento."
  - id: b
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  - id: c
    correct: true
    text:
      es: "Prestar asesoramiento y apoyo técnico en materia de asistencia jurídica."
  - id: d
