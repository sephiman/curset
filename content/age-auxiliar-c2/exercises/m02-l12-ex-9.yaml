# anchor: fuente-ms-edge-privacidad-html
- id: m02-l12-q139
  prompt:
    es: "¿Cuál de las siguientes cosas elimina Microsoft Edge, en Windows 11, al cerrar todas las ventanas de InPrivate?"
  options:
  - id: a
    text:
      es: "Los favoritos y los archivos descargados durante la exploración"
  - id: b
    text:
      es: "Solo el historial de exploración, sin las cookies ni las contraseñas guardadas en el perfil de Edge"
  - id: c
    text:
      es: "Nada, hasta que se cierra la sesión de Windows del usuario o se apaga el equipo"
  - id: d
    correct: true
    text:
      es: "Historial, cookies y datos del sitio, contraseñas y datos de formulario"
  explanation:
    es: "Al cerrar todas las ventanas de InPrivate, Edge elimina el historial de exploración, las cookies y los datos del sitio, las contraseñas, las direcciones y los datos de formulario. Elimina también las cookies, los datos del sitio, las contraseñas y los datos de formulario, no solo el historial. Los favoritos y los archivos descargados no figuran entre lo que se elimina; la página de InPrivate de Edge dice que permite «guardar descargas y favoritos». La eliminación se produce al cerrar todas las ventanas de InPrivate, no al cerrar la sesión de Windows."
  citation: "fuente: `ms-edge-privacidad.html`; «Microsoft Edge eliminará el historial de exploración, las cookies y los datos del sitio, así como las contraseñas, las direcciones y los datos de formulario al cerrar todas las ventanas de InPrivate.»"
  difficulty: 2
  tags:
  - "comportamiento"
