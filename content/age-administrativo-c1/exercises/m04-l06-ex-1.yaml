# anchor: boe-a-1985-151-art-7
- id: m04-l06-q012
  prompt:
    es: "Según el artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿cuál es el máximo por ambos puestos en el grupo C con un principal de 26.000 euros anuales?"
  options:
  - id: a
    text:
      es: "Hasta 33.800 euros anuales por ambos puestos."
  - id: b
    correct: true
    text:
      es: "Hasta 36.400 euros anuales por ambos puestos."
  - id: c
    text:
      es: "Hasta 35.100 euros anuales por ambos puestos."
  - id: d
    text:
      es: "Hasta 37.700 euros anuales por ambos puestos."
  explanation:
    es: "Para el grupo C el artículo 7.1 incrementa el principal «Un 40 por 100». 26.000 euros por 1,40 dan 36.400 euros, muy por debajo de la remuneración de un Director General. La cifra de 33.800 euros aplica el 30 por 100 del grupo A. La de 35.100 euros, el 35 por 100 del grupo B. La de 37.700 euros, el 45 por 100 del grupo D."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-1985-151-art-7
- id: m04-l06-q013
  prompt:
    es: "Según el artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿hasta cuánto cobra en el segundo puesto un funcionario del grupo A con 40.000 euros anuales de principal?"
  options:
  - id: a
    text:
      es: "Hasta 14.000 euros anuales, sin acuerdo expreso del Gobierno."
  - id: b
    correct: true
    text:
      es: "Hasta 12.000 euros anuales, sin acuerdo expreso del Gobierno."
  - id: c
    text:
      es: "Hasta 16.000 euros anuales, sin acuerdo expreso del Gobierno."
  - id: d
    text:
      es: "Hasta 20.000 euros anuales, sin acuerdo expreso del Gobierno."
  explanation:
    es: "Para el grupo A el límite es el principal «incrementada en […] Un 30 por 100»: 40.000 euros por 1,30 dan 52.000 euros por ambos puestos. Restados los 40.000 del principal, el segundo puesto admite 12.000 euros. 52.000 euros no alcanzan la remuneración de un Director General. La cifra de 14.000 euros sale del 35 por 100 del grupo B, la de 16.000 euros del 40 por 100 del grupo C y la de 20.000 euros del 50 por 100 del grupo E. Superar el límite requiere acuerdo expreso del Gobierno."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-1985-151-art-7
- id: m04-l06-q014
  prompt:
    es: "Conforme al artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, en el Estado la superación anual de los límites retributivos de la compatibilidad requiere en cada caso:"
  options:
  - id: a
    correct: true
    text:
      es: "Acuerdo expreso del Gobierno, en base a razones de especial interés para el servicio."
  - id: b
    text:
      es: "Resolución del Subsecretario del Departamento, por razones de especial interés para el servicio."
  - id: c
    text:
      es: "Informe favorable de la Subsecretaría del segundo puesto, por razones de interés público."
  - id: d
    text:
      es: "Orden del Ministro del Departamento, por razones de especial interés."
  explanation:
    es: "El artículo 7.1 dice que la superación de los límites «requiere en cada caso acuerdo expreso del Gobierno, órgano competente de las Comunidades Autónomas o Pleno de las Corporaciones Locales en base a razones de especial interés para el servicio». En el Estado decide, por tanto, el Gobierno. Ni el Subsecretario, ni un informe de la Subsecretaría del segundo puesto, ni una orden del Ministro sustituyen ese acuerdo."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-1985-151-art-7
- id: m04-l06-q015
