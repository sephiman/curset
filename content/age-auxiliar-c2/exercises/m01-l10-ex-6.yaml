    text:
      es: "Una elección de su Presidente por los Gobiernos."
  - id: d
    text:
      es: "Una ampliación del número de jueces."
  explanation:
    es: "Cada tres años hay una renovación parcial del Tribunal General. No se renueva entero, su Presidente lo eligen los jueces y el número de jueces lo fija el Estatuto."
