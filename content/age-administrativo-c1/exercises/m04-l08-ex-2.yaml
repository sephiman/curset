# anchor: boe-a-2015-11719-art-14
- id: m04-l08-q023
  prompt:
    es: "Según el artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos tienen los derechos de carácter individual que enumera:"
  options:
  - id: a
    text:
      es: "En los mismos términos para funcionarios y personal laboral, sin distinción."
  - id: b
    text:
      es: "Solo si son funcionarios; el personal laboral tiene los del Estatuto de los Trabajadores."
  - id: c
    correct: true
    text:
      es: "En correspondencia con la naturaleza jurídica de su relación de servicio."
  - id: d
    text:
      es: "En la medida en que los recoja el convenio colectivo o el acuerdo aplicable."
  explanation:
    es: "El artículo 14 reconoce esos derechos «en correspondencia con la naturaleza jurídica de su relación de servicio». No son idénticos para todos: la inamovilidad de su letra a) es del funcionario de carrera. El artículo habla de «los empleados públicos», clase que incluye al personal laboral (art. 8.2.c). Y no condiciona los derechos a lo que recoja el convenio."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11430-art-4
- id: m04-l08-q024
  prompt:
    es: "¿Cuál de los siguientes es un derecho básico de los trabajadores según el artículo 4.1 del texto refundido de la Ley del Estatuto de los Trabajadores?"
  options:
  - id: a
    correct: true
    text:
      es: "La información, consulta y participación en la empresa."
  - id: b
    text:
      es: "La contribución a la mejora de la productividad."
  - id: c
    text:
      es: "La no concurrencia con la actividad de la empresa."
  - id: d
    text:
      es: "La observancia de las medidas de prevención de riesgos laborales."
  explanation:
    es: "El artículo 4.1 enumera como derechos básicos, entre otros, la «g) Información, consulta y participación en la empresa». Contribuir a la mejora de la productividad, no concurrir con la actividad de la empresa y observar las medidas de prevención de riesgos laborales son deberes básicos del artículo 5, no derechos."
  citation: "art. 4.1 ET"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11430-art-5
- id: m04-l08-q025
  prompt:
    es: "Según el artículo 5 del texto refundido de la Ley del Estatuto de los Trabajadores, es deber básico de los trabajadores cumplir las órdenes e instrucciones del empresario:"
  options:
  - id: a
    text:
      es: "En todo caso, sin perjuicio de su impugnación posterior."
  - id: b
    correct: true
    text:
      es: "En el ejercicio regular de sus facultades directivas."
  - id: c
    text:
      es: "Solo cuando consten por escrito y estén motivadas."
  - id: d
    text:
      es: "Siempre que las haya informado el comité de empresa."
  explanation:
    es: "El artículo 5.c) dice: «Cumplir las órdenes e instrucciones del empresario en el ejercicio regular de sus facultades directivas». El deber no alcanza a cualquier orden «en todo caso», solo a las dadas en ese ejercicio regular. El artículo no exige forma escrita ni motivación, ni un informe del comité de empresa."
  citation: "art. 5 ET"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11430-art-68
- id: m04-l08-q026
  prompt:
    es: "De acuerdo con el artículo 68.e) del texto refundido de la Ley del Estatuto de los Trabajadores, salvo lo que dispongan los convenios colectivos, el crédito de horas mensuales retribuidas para funciones de representación corresponde:"
  options:
  - id: a
    text:
      es: "Al comité de empresa en su conjunto, que lo reparte después entre sus miembros."
  - id: b
    text:
      es: "Solo a quienes ocupan la presidencia y la secretaría del comité de empresa."
  - id: c
    correct: true
    text:
      es: "A cada miembro del comité o delegado de personal, en cada centro de trabajo."
  - id: d
    text:
      es: "A cada delegado sindical, en proporción a la afiliación de su sindicato en el centro."
  explanation:
    es: "El artículo 68.e) da el crédito a «cada uno de los miembros del comité o delegado de personal en cada centro de trabajo». No se asigna al comité en su conjunto: la acumulación en uno o varios miembros requiere pacto en convenio. Tampoco se limita a la presidencia y la secretaría. Los delegados sindicales no son los representantes a los que se refiere esta garantía."
  citation: "art. 68.e) ET"
  difficulty: 2
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2019-7414-art-86
- id: m04-l08-q027
  prompt:
    es: "En un ámbito con 600 trabajadores y trabajadoras, ¿de cuántas horas mensuales retribuidas dispone cada miembro del Comité de Empresa según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "De treinta horas mensuales retribuidas."
  - id: b
    correct: true
    text:
      es: "De treinta y cinco horas mensuales retribuidas."
  - id: c
    text:
      es: "De cuarenta horas mensuales retribuidas."
  - id: d
    text:
      es: "De cuarenta y cinco horas mensuales retribuidas."
  explanation:
    es: "La escala del artículo 86.1.d) dice: «De 501 a 750 trabajadores y/o trabajadoras, treinta y cinco horas», y un ámbito de 600 cae en ese tramo. Treinta horas es el tramo de 251 a 500. Cuarenta horas es el tramo de 751 en adelante. Cuarenta y cinco horas supera el último tramo de la escala, que se queda en cuarenta."
  citation: "art. 86.1.d) Convenio único"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2015-11430-art-34
- id: m04-l08-q028
  prompt:
    es: "Según el artículo 34.1 del texto refundido de la Ley del Estatuto de los Trabajadores, ¿cuál es la duración máxima de la jornada ordinaria de trabajo?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuarenta horas semanales de trabajo efectivo de promedio en cómputo anual."
  - id: b
    text:
      es: "Treinta y siete horas y media semanales de trabajo efectivo de promedio en cómputo anual."
  - id: c
    text:
      es: "Treinta y cinco horas semanales de trabajo efectivo de promedio en cómputo anual."
  - id: d
    text:
      es: "Cuarenta horas semanales de trabajo efectivo, computadas semana a semana."
  explanation:
    es: "El artículo 34.1 dice: «La duración máxima de la jornada ordinaria de trabajo será de cuarenta horas semanales de trabajo efectivo de promedio en cómputo anual». Las treinta y siete horas y media son la jornada general máxima del Convenio único (art. 64.1). Las treinta y cinco son la jornada general de la Resolución de 14 de abril de 2026 (apartado 2.4.a). El cómputo es anual, de promedio, no semana a semana."
  citation: "art. 34.1 ET"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2019-7414-art-64
- id: m04-l08-q029
  prompt:
    es: "De acuerdo con el artículo 64.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, la jornada general máxima de treinta y siete horas y media semanales de promedio en cómputo anual equivale a:"
  options:
  - id: a
    text:
      es: "Mil quinientas treinta y dos horas anuales."
  - id: b
    text:
      es: "Mil seiscientas veinticuatro horas anuales."
  - id: c
    correct: true
    text:
      es: "Mil seiscientas cuarenta y dos horas anuales."
  - id: d
    text:
      es: "Mil setecientas veinte horas anuales."
  explanation:
    es: "El artículo 64.1 fija la jornada general máxima en treinta y siete horas y media semanales, «equivalente a mil seiscientas cuarenta y dos horas anuales». Las otras tres cifras no aparecen en el artículo."
  citation: "art. 64.1 Convenio único"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2026-8287-apartado-1
- id: m04-l08-q031
  prompt:
    es: "Según el apartado 1.1 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios de trabajo en la Administración General del Estado, sus instrucciones son de aplicación:"
  options:
  - id: a
    text:
      es: "Solo al personal funcionario al servicio de la Administración General del Estado."
  - id: b
    text:
      es: "Solo al personal laboral no incluido en el IV Convenio único."
  - id: c
    text:
      es: "También al personal de las Fuerzas Armadas y de las Fuerzas y Cuerpos de Seguridad."
  - id: d
    correct: true
    text:
      es: "A todos los empleados y empleadas públicos al servicio de la Administración General del Estado."
  explanation:
    es: "El apartado 1.1 aplica las instrucciones «a todos los empleados y empleadas públicos al servicio de» la Administración General del Estado, entre otros. No distingue entre funcionarios y laborales, y no excluye al personal del Convenio único. El apartado 1.2 deja fuera al personal militar de las Fuerzas Armadas y al de las Fuerzas y Cuerpos de Seguridad del Estado."
  citation: "apartado 1.1 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q032
  prompt:
    es: "Según el artículo 72.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, tienen la consideración de horas extraordinarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Las que excedan de 37,5 horas semanales o, en su caso, de la jornada de hasta cuarenta horas del Convenio."
  - id: b
    text:
      es: "Las que excedan de 35 horas semanales, que es la jornada general de trabajo fijada por el propio Convenio."
  - id: c
    text:
      es: "Las que excedan de cuarenta horas semanales en todo caso, conforme a la legislación laboral común."
  - id: d
    text:
      es: "Las que excedan de la jornada diaria fijada en el calendario laboral aprobado para cada centro de trabajo."
  explanation:
    es: "El artículo 72.1 considera extraordinarias las horas «que excedan de 37,5 horas semanales o, en su caso, las que excedan de la jornada contemplada en el artículo 64.3», que es la jornada superior de hasta cuarenta horas. El Convenio no fija una jornada general de 35 horas. Las cuarenta horas solo son el umbral cuando se aplica esa jornada superior, no en todo caso. El artículo mide el exceso por semana, no sobre la jornada diaria del calendario."
  citation: "art. 72.1 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q033
  prompt:
    es: "Un trabajador del ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado realiza tres horas extraordinarias en un día festivo. Si se compensan con descanso, ¿cuántas horas le corresponden?"
  options:
  - id: a
    text:
      es: "Cuatro horas y media de descanso."
  - id: b
    text:
      es: "Seis horas de descanso."
  - id: c
    correct: true
    text:
      es: "Siete horas y media de descanso."
  - id: d
    text:
      es: "Nueve horas de descanso."
  explanation:
    es: "El artículo 72.2 compensa cada hora extraordinaria con dos horas de descanso, «salvo en los casos de horas nocturnas o en días festivos cuya compensación será de dos horas y media». Tres horas en festivo por dos y media dan siete horas y media. Seis horas aplica la regla general de dos por una, que no rige en festivo. Cuatro horas y media sale de multiplicar por uno y medio, y nueve de multiplicar por tres."
  citation: "art. 72.2 Convenio único"
  difficulty: 1
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q034
  prompt:
    es: "Una trabajadora del ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado realiza cuatro horas extraordinarias diurnas en días laborables y dos nocturnas. Compensadas con descanso, ¿cuántas horas le corresponden?"
  options:
  - id: a
    text:
      es: "Once horas de descanso."
  - id: b
    text:
      es: "Doce horas de descanso."
  - id: c
    correct: true
    text:
      es: "Trece horas de descanso."
  - id: d
    text:
      es: "Quince horas de descanso."
  explanation:
    es: "El artículo 72.2 da dos horas de descanso por cada hora extraordinaria y dos y media por las nocturnas o en festivos. Cuatro horas diurnas por dos son ocho; dos nocturnas por dos y media son cinco; en total, trece. Doce aplica a todas el dos por una. Quince aplica a todas el dos y medio. Once compensa las nocturnas a razón de una y media."
  citation: "art. 72.2 Convenio único"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q035
  prompt:
    es: "Un trabajador del ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado realiza horas extraordinarias el martes 3 de marzo de 2026, que se compensan con descanso. ¿En cuál de estas fechas puede disfrutarlo todavía dentro del plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes 26 de junio de 2026."
  - id: b
    text:
      es: "El lunes 3 de agosto de 2026."
  - id: c
    text:
      es: "El martes 15 de septiembre de 2026."
  - id: d
    text:
      es: "El lunes 4 de enero de 2027."
  explanation:
    es: "El artículo 72.2 exige que el descanso se produzca «en el plazo de los cuatro meses siguientes a la realización de las horas extraordinarias». Desde el martes 3 de marzo de 2026, cuatro meses llegan a principios de julio de 2026. El viernes 26 de junio está dentro. El lunes 3 de agosto ya está fuera, a cinco meses. El martes 15 de septiembre y el lunes 4 de enero de 2027 quedan aún más lejos."
  citation: "art. 72.2 Convenio único"
  difficulty: 3
  tags:
  - "plazo"
  - "fecha"
  - "cómputo"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q036
  prompt:
    es: "Según el artículo 72.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿cuándo se retribuyen en metálico las horas extraordinarias?"
  options:
  - id: a
    correct: true
    text:
      es: "Si así se pacta, conforme a lo establecido en el propio Convenio."
  - id: b
    text:
      es: "En todo caso, a elección de la persona trabajadora que las realiza."
  - id: c
    text:
      es: "Solo si no pueden compensarse con descanso en los cuatro meses siguientes."
  - id: d
    text:
      es: "Solo si son nocturnas o se realizan en días festivos."
  explanation:
    es: "El artículo 72.2 dice: «Si así se pacta se retribuirán en metálico conforme a lo establecido en el artículo 59 del Convenio». La opción de cualquier caso a elección del trabajador contradice la preferencia por el descanso. El abono no se supedita a que el descanso sea imposible en los cuatro meses. Las nocturnas y festivas tienen una compensación en descanso mayor, no un abono obligado."
  citation: "art. 72.2 Convenio único"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q037
  prompt:
    es: "Según el artículo 72.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, la compensación de las horas extraordinarias con tiempo de descanso acumulable es:"
  options:
  - id: a
    text:
      es: "La única forma admitida; su retribución en metálico está excluida."
  - id: b
    correct: true
    text:
      es: "La forma preferente; su retribución en metálico requiere que así se pacte."
  - id: c
    text:
      es: "Una forma excepcional; la ordinaria es su abono en la nómina del mes siguiente."
  - id: d
    text:
      es: "Obligatoria solo para las horas nocturnas o realizadas en días festivos."
  explanation:
    es: "El artículo 72.2 dice que las horas extraordinarias «se compensarán preferentemente con tiempo de descanso acumulable» y que «si así se pacta» se retribuirán en metálico. El abono en metálico no está excluido, solo exige pacto. El descanso no es excepcional, es la forma preferente. Y la preferencia vale para todas las horas extraordinarias, no solo para las nocturnas o festivas."
  citation: "art. 72.2 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-72
- id: m04-l08-q038
  prompt:
    es: "Salvo las razones justificadas que admite el Estatuto de los Trabajadores, ¿cuántas horas extraordinarias puede realizar como máximo al año el personal del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Un máximo de cuarenta horas anuales."
  - id: b
    correct: true
    text:
      es: "Un máximo de sesenta horas anuales."
  - id: c
    text:
      es: "Un máximo de ochenta horas anuales."
  - id: d
    text:
      es: "Un máximo de cien horas anuales."
  explanation:
    es: "El artículo 72.3 dice que «en ningún caso las mismas podrán exceder de sesenta horas anuales», salvo las razones justificadas del artículo 35.3 del Estatuto de los Trabajadores. Ochenta horas es el límite general del Estatuto de los Trabajadores (art. 35.2), que el Convenio rebaja. Cuarenta y cien no figuran en el artículo."
  citation: "art. 72.3 Convenio único"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11430-art-35
- id: m04-l08-q039
  prompt:
    es: "Según el artículo 35.1 del texto refundido de la Ley del Estatuto de los Trabajadores, en ausencia de pacto, las horas extraordinarias realizadas deberán ser compensadas:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante descanso dentro de los cuatro meses siguientes a su realización."
  - id: b
    text:
      es: "Mediante abono en cuantía no inferior al valor de la hora ordinaria."
  - id: c
    text:
      es: "Mediante descanso dentro de los seis meses siguientes a su realización."
  - id: d
    text:
      es: "Mediante abono incrementado en un setenta y cinco por ciento."
  explanation:
    es: "El artículo 35.1 dice que, «en ausencia de pacto al respecto», las horas extraordinarias «deberán ser compensadas mediante descanso dentro de los cuatro meses siguientes a su realización». El abono no inferior al valor de la hora ordinaria es una opción que se fija por convenio o contrato, no la regla sin pacto. Seis meses no es el plazo del artículo. El recargo del setenta y cinco por ciento no aparece en él."
  citation: "art. 35.1 ET"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2019-7414-art-73
- id: m04-l08-q040
  prompt:
    es: "¿Cuántos días de vacaciones anuales retribuidas corresponden al personal del IV Convenio colectivo único para el personal laboral de la Administración General del Estado por año completo de servicios?"
  options:
  - id: a
    text:
      es: "Veintidós días naturales por año completo de servicios."
  - id: b
    text:
      es: "Treinta días naturales por año completo de servicios."
  - id: c
    text:
      es: "Veinticinco días hábiles por año completo de servicios."
  - id: d
    correct: true
    text:
      es: "Veintidós días hábiles por año completo de servicios."
  explanation:
    es: "El artículo 73.1 dice que las vacaciones anuales retribuidas «serán de veintidós días hábiles por año completo de servicios». Los días son hábiles, no naturales. Treinta días naturales no es la regla del Convenio. Veinticinco días hábiles corresponden solo a quien ha completado veinticinco años de servicios."
  citation: "art. 73.1 Convenio único"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2019-7414-art-73
- id: m04-l08-q041
  prompt:
    es: "De acuerdo con el artículo 73.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el personal laboral disfruta las vacaciones de forma obligatoria dentro del año natural y hasta:"
  options:
  - id: a
    text:
      es: "El 15 de enero del año siguiente."
  - id: b
    correct: true
    text:
      es: "El 31 de enero del año siguiente."
  - id: c
    text:
      es: "El 28 de febrero del año siguiente."
  - id: d
    text:
      es: "El 31 de marzo del año siguiente."
  explanation:
    es: "El artículo 73.1 dice que las vacaciones se disfrutarán «de forma obligatoria dentro del año natural y hasta el 31 de enero del año siguiente». Las otras tres fechas no figuran en el artículo."
  citation: "art. 73.1 Convenio único"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2019-7414-art-73
- id: m04-l08-q042
  prompt:
    es: "Un trabajador del ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado cumple veinte años de servicios el lunes 9 de marzo de 2026. ¿A qué vacaciones anuales tiene derecho y desde cuándo?"
  options:
  - id: a
    text:
      es: "A veinticuatro días hábiles, desde el viernes 1 de enero de 2027."
  - id: b
    text:
      es: "A veintitrés días hábiles, desde el martes 10 de marzo de 2026."
  - id: c
    text:
      es: "A veinticinco días hábiles, desde el lunes 9 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "A veinticuatro días hábiles, desde el martes 10 de marzo de 2026."
  explanation:
    es: "El artículo 73.1 da «Veinte años de servicios: Veinticuatro días hábiles» y añade que el derecho «se hará efectivo a partir del día siguiente al cumplimiento de la antigüedad referenciada». El día siguiente al lunes 9 de marzo de 2026 es el martes 10. No hay que esperar al año siguiente. Veintitrés días corresponden a quince años y veinticinco a veinticinco años; además, el derecho no nace el mismo día del cumplimiento."
  citation: "art. 73.1 Convenio único"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2019-7414-art-73
- id: m04-l08-q043
  prompt:
    es: "Según el artículo 73.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿qué consideración tienen los sábados a efectos de las vacaciones anuales?"
  options:
  - id: a
    text:
      es: "Son considerados días hábiles, salvo en los horarios especiales."
  - id: b
    text:
      es: "No son considerados días hábiles en ningún caso."
  - id: c
    correct: true
    text:
      es: "No son considerados días hábiles, salvo en los horarios especiales."
  - id: d
    text:
      es: "Son considerados días hábiles solo durante la jornada intensiva de verano."
  explanation:
    es: "El artículo 73.1 dice: «A estos efectos, los sábados no son considerados días hábiles, salvo en los horarios especiales». La opción que los da por hábiles invierte la regla. La que los excluye en todo caso olvida la salvedad de los horarios especiales. La jornada intensiva de verano no es la salvedad del artículo."
  citation: "art. 73.1 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2019-7414-art-70
- id: m04-l08-q044
  prompt:
    es: "Conforme al artículo 70 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, en la baja por incapacidad temporal legalmente declarada, la Administración complementa la prestación económica reglamentaria de la Seguridad Social hasta alcanzar:"
  options:
  - id: a
    correct: true
    text:
      es: "El 100 % del salario establecido en el Convenio."
  - id: b
    text:
      es: "El 75 % del salario establecido en el Convenio."
  - id: c
    text:
      es: "El 100 % de la base reguladora de la prestación."
  - id: d
    text:
      es: "El 90 % del salario establecido en el Convenio."
  explanation:
    es: "El artículo 70 dice que la Administración complementará la prestación «hasta alcanzar el 100 % del salario establecido en el presente convenio». La referencia es el salario del Convenio, no la base reguladora de la prestación. El 75 % y el 90 % no aparecen en el artículo."
  citation: "art. 70 Convenio único"
  difficulty: 1
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2019-7414-da-undecima
- id: m04-l08-q045
  prompt:
    es: "En el IV Convenio colectivo único para el personal laboral de la Administración General del Estado, antes de acogerse a la jubilación parcial se constituirá:"
  options:
  - id: a
    text:
      es: "Una comisión mixta con la Seguridad Social para fijar la cuantía de la pensión parcial."
  - id: b
    text:
      es: "Una Subcomisión Paritaria en cada Departamento para aprobar las solicitudes individuales."
  - id: c
    text:
      es: "Un grupo de trabajo en la Comisión Negociadora para fijar el modelo de contrato de relevo."
  - id: d
    correct: true
    text:
      es: "Un grupo de trabajo en el seno de la Comisión Paritaria para acordar las condiciones de acceso."
  explanation:
    es: "La disposición adicional undécima dice: «Previamente se constituirá a estos efectos un grupo de trabajo en el seno de la Comisión Paritaria para acordar las condiciones de acceso a dicha modalidad de jubilación». No prevé una comisión mixta con la Seguridad Social ni una Subcomisión por Departamento. El grupo de trabajo se constituye en la Comisión Paritaria, no en la Negociadora."
  citation: "disposición adicional undécima Convenio único"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-11719-art-93
- id: m04-l08-q046
  prompt:
    es: "Según el artículo 93.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en materia de responsabilidad disciplinaria, el personal laboral queda sujeto:"
  options:
  - id: a
    text:
      es: "Solo al régimen disciplinario del Estatuto de los Trabajadores y del convenio aplicable."
  - id: b
    correct: true
    text:
      es: "Al régimen disciplinario del título VII del Estatuto y de las leyes de Función Pública que lo desarrollen."
  - id: c
    text:
      es: "Al régimen disciplinario del reglamento aprobado para los funcionarios de la Administración del Estado."
  - id: d
    text:
      es: "Al régimen disciplinario del título VII del Estatuto, pero solo cuando cometa faltas muy graves."
  explanation:
    es: "El artículo 93.1 sujeta a los funcionarios públicos y al personal laboral «al régimen disciplinario establecido en el presente título y en las normas que las leyes de Función Pública dicten en desarrollo de este Estatuto». La legislación laboral rige solo en lo no previsto en ese título (art. 93.4). El reglamento disciplinario de los funcionarios del Estado no es el régimen que el artículo aplica al personal laboral. El título VII no se limita a las faltas muy graves."
  citation: "art. 93.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-93
- id: m04-l08-q047
  prompt:
    es: "Según el artículo 93.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿por qué se rige el régimen disciplinario del personal laboral en lo no previsto en el título de régimen disciplinario?"
  options:
  - id: a
    text:
      es: "Por el reglamento disciplinario de los funcionarios del Estado."
  - id: b
    text:
      es: "Por lo que acuerde la Comisión Paritaria del convenio."
  - id: c
    correct: true
    text:
      es: "Por lo dispuesto en la legislación laboral."
  - id: d
    text:
      es: "Por la normativa general de procedimiento administrativo común."
  explanation:
    es: "El artículo 93.4 dice: «El régimen disciplinario del personal laboral se regirá, en lo no previsto en el presente título, por la legislación laboral». No remite al reglamento disciplinario de los funcionarios, a la Comisión Paritaria ni a la normativa de procedimiento administrativo común."
  citation: "art. 93.4 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-96
- id: m04-l08-q048
  prompt:
    es: "Según el artículo 96.1.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué faltas puede sancionar el despido disciplinario del personal laboral y qué comporta?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo puede sancionar faltas muy graves y comporta la inhabilitación para un nuevo contrato con funciones similares."
  - id: b
    text:
      es: "Puede sancionar faltas graves y muy graves y comporta la inhabilitación para un nuevo contrato con funciones similares."
  - id: c
    text:
      es: "Solo puede sancionar faltas muy graves y comporta la inhabilitación para cualquier empleo público."
  - id: d
    text:
      es: "Solo puede sancionar faltas muy graves y no impide un nuevo contrato con funciones similares."
  explanation:
    es: "El artículo 96.1.b) dice que el despido disciplinario «sólo podrá sancionar la comisión de faltas muy graves y comportará la inhabilitación para ser titular de un nuevo contrato de trabajo con funciones similares a las que desempeñaban». No sanciona faltas graves. La inhabilitación alcanza a contratos con funciones similares, no a cualquier empleo público, y sí impide un nuevo contrato de ese tipo."
  citation: "art. 96.1.b) TREBEP"
  difficulty: 2
  tags:
  - "efecto"
