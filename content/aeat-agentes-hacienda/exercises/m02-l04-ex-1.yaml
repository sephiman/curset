# anchor: boe-a-2015-10565-art-58
- id: m02-l04-q0001
  prompt:
    es: "De acuerdo con el artículo 58 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos se iniciarán de oficio por acuerdo del órgano competente:"
  options:
  - id: a
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o a solicitud del interesado."
  - id: b
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, o por denuncia, pero nunca a petición de otros órganos."
  - id: c
    correct: true
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia."
  - id: d
    text:
      es: "Solo por propia iniciativa o por denuncia, que obliga en todo caso a iniciar el procedimiento."
  explanation:
    es: "El artículo 58 dice que la iniciación de oficio se acuerda «bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia». La solicitud del interesado abre la iniciación a solicitud, no la de oficio. La petición razonada de otros órganos sí está en la lista, y la orden superior también."
  citation: "art. 58 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0002
  prompt:
    es: "Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo se dicta el acuerdo de iniciación que se pronuncia sobre medidas provisionales adoptadas antes del procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los quince días siguientes a su adopción."
  - id: b
    text:
      es: "Dentro de los diez días siguientes a su adopción."
  - id: c
    text:
      es: "Dentro del mes siguiente a su adopción."
  - id: d
    text:
      es: "Dentro de los tres días siguientes a su adopción."
  explanation:
    es: "El artículo 56.2 dice que las medidas se confirman, modifican o levantan en el acuerdo de iniciación, «que deberá efectuarse dentro de los quince días siguientes a su adopción». El plazo no es de diez días, ni de tres, ni de un mes. Si no se inicia el procedimiento en ese plazo, las medidas quedan sin efecto."
  citation: "art. 56.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m02-l04-q0004
  prompt:
    es: "Según el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de naturaleza sancionadora, ¿a quién se encomiendan la fase instructora y la sancionadora?"
  options:
  - id: a
    text:
      es: "A un mismo órgano, que instruye y después resuelve el procedimiento."
  - id: b
    correct: true
    text:
      es: "A órganos distintos, con la debida separación entre ambas fases."
  - id: c
    text:
      es: "Al órgano que resuelve la instructora, y a su superior jerárquico la sancionadora."
  - id: d
    text:
      es: "A órganos distintos solo cuando la infracción imputada sea muy grave."
  explanation:
    es: "El artículo 63.1 exige «la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos». Un mismo órgano no puede hacer las dos. La ley no atribuye la instrucción al órgano que resuelve, y la separación rige en todo procedimiento sancionador, no solo en las infracciones muy graves."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-66
- id: m02-l04-q0031
  prompt:
    es: "Según el artículo 66.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo debe indicar la solicitud un lugar físico para practicar la notificación?"
  options:
  - id: a
    text:
      es: "Siempre, además del medio electrónico que se identifique."
  - id: b
    correct: true
    text:
      es: "En defecto de la identificación de un medio electrónico."
  - id: c
    text:
      es: "Solo cuando el solicitante sea una persona jurídica."
  - id: d
    text:
      es: "Nunca, porque la solicitud solo puede designar un medio electrónico."
  explanation:
    es: "El artículo 66.1.b) exige identificar «el medio electrónico, o en su defecto, lugar físico en que desea que se practique la notificación». El lugar físico es subsidiario: no se exige siempre junto al medio electrónico, pero tampoco está excluido. La ley no lo reserva a las personas jurídicas."
  citation: "art. 66.1.b) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-62
- id: m02-l04-q0041
  prompt:
    es: "Conforme al artículo 62.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la denuncia invoque un perjuicio en el patrimonio de las Administraciones Públicas, la no iniciación del procedimiento deberá ser:"
  options:
  - id: a
    correct: true
    text:
      es: "Motivada, y se notificará a los denunciantes la decisión de si se ha iniciado o no."
  - id: b
    text:
      es: "Comunicada solo al presunto responsable."
  - id: c
    text:
      es: "Confirmada por el superior jerárquico antes del archivo."
  - id: d
    text:
      es: "Publicada en el Boletín Oficial del Estado."
  explanation:
    es: "El artículo 62.3 exige motivar la no iniciación y notificar a los denunciantes si el procedimiento se ha iniciado o no. No se comunica solo al presunto responsable, no exige confirmación del superior jerárquico y no se publica en el Boletín Oficial del Estado."
  citation: "art. 62.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-63
- id: m02-l04-q0051
  prompt:
    es: "De acuerdo con el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos de naturaleza sancionadora se inician:"
  options:
  - id: a
    correct: true
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo de órganos distintos."
  - id: b
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo del mismo órgano."
  - id: c
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y quien denuncia los hechos adquiere por ello la condición de interesado."
  - id: d
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y el denunciante que participó en la infracción queda exento de la multa en todo caso."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente» y que la fase instructora y la sancionadora «se encomendará a órganos distintos». Reunir las dos fases en el mismo órgano contradice esa separación. Que quien denuncia los hechos adquiera la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el denunciante que participó en la infracción quede exento de la multa en todo caso contradice el artículo 62.4, que lo condiciona: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-63
- id: m02-l04-q0052
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el procedimiento sancionador es correcta según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La presentación de una denuncia confiere por sí sola la condición de interesado en el procedimiento."
  - id: b
    text:
      es: "La fase instructora y la sancionadora pueden encomendarse al mismo órgano."
  - id: c
    correct: true
    text:
      es: "El procedimiento sancionador se inicia siempre de oficio, por acuerdo del órgano competente."
  - id: d
    text:
      es: "El denunciante que participó en la infracción queda siempre exento de la multa que le correspondería."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente». Que una denuncia confiera por sí sola la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el mismo órgano pueda llevar la fase instructora y la sancionadora contradice el artículo 63.1, que las separa y dice que se «encomendará a órganos distintos». Que el denunciante que participó en la infracción quede siempre exento de la multa contradice el artículo 62.4, que condiciona la exención: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0053
  prompt:
    es: "Conforme al artículo 56.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre las medidas provisionales que se adoptan una vez iniciado el procedimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Las adopta el órgano competente para resolver, de oficio o a instancia de parte, de forma motivada y si existen elementos de juicio suficientes."
  - id: b
    text:
      es: "Las adopta el órgano instructor, solo a instancia de parte, y sin necesidad de motivación expresa."
  - id: c
    text:
      es: "Las adopta el órgano competente para resolver, solo de oficio, de forma motivada y aunque no existan elementos de juicio suficientes."
  - id: d
    text:
      es: "Las adopta el superior jerárquico del instructor, de oficio o a instancia de parte, de forma motivada, previa audiencia a los interesados y si existen elementos de juicio suficientes."
  explanation:
    es: "El artículo 56.1 atribuye la adopción al órgano competente para resolver, de oficio o a instancia de parte, de forma motivada y si hay elementos de juicio suficientes. No es el instructor, ni basta la iniciativa de oficio, ni se adoptan sin elementos de juicio, ni corresponden al superior jerárquico previa audiencia, trámite que la ley no prevé."
  citation: "art. 56.1 LPAC"
  difficulty: 3
  tags:
  - "medidas provisionales"
  - "órgano"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0054
  prompt:
    es: "Una Administración adopta el jueves 5 de febrero de 2026, por urgencia inaplazable, medidas provisionales antes de iniciar un procedimiento. No hay festivos en febrero ni en marzo. Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta cuándo debe dictarse el acuerdo de iniciación para que no queden sin efecto?"
  options:
  - id: a
    text:
      es: "Hasta el viernes 20 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el miércoles 25 de febrero de 2026."
  - id: c
    text:
      es: "Hasta el viernes 6 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "Hasta el jueves 26 de febrero de 2026."
  explanation:
    es: "El acuerdo debe dictarse dentro de los quince días siguientes a la adopción, y son hábiles (artículo 30.2) y se cuentan desde el día siguiente (artículo 30.3): el viernes 6 es el primero, del 9 al 13 son cinco más, del 16 al 20 otros cinco y del 23 al 26 los cuatro últimos, luego vence el jueves 26. El viernes 20 sale de contar quince días naturales. El miércoles 25 resulta de contar el día de adopción como primero. Y el viernes 6 de marzo equivale a un mes."
  citation: "art. 56.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "medidas provisionales"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0055
  prompt:
    es: "De acuerdo con el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las medidas provisionales adoptadas antes de la iniciación del procedimiento quedan sin efecto, en todo caso, cuando el acuerdo de iniciación:"
  options:
  - id: a
    text:
      es: "no se notifique a los interesados en el plazo de diez días."
  - id: b
    text:
      es: "no las ratifique el órgano competente para resolver el procedimiento."
  - id: c
    correct: true
    text:
      es: "no contenga un pronunciamiento expreso acerca de ellas."
  - id: d
    text:
      es: "no se publique en el diario oficial correspondiente."
  explanation:
    es: "El artículo 56.2 dice que las medidas quedan sin efecto si no se inicia el procedimiento en el plazo de quince días o si el acuerdo de iniciación no contiene un pronunciamiento expreso sobre ellas. No se exige notificar en diez días, ni una ratificación del órgano que resuelve, ni su publicación."
  citation: "art. 56.2 LPAC"
  difficulty: 2
  tags:
  - "medidas provisionales"
  - "efectos"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0056
  prompt:
    es: "Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el acuerdo de iniciación que confirma, modifica o levanta las medidas provisionales adoptadas antes del procedimiento podrá ser objeto:"
  options:
  - id: a
    text:
      es: "de ningún recurso, por ser un acto de trámite no cualificado."
  - id: b
    correct: true
    text:
      es: "del recurso que proceda."
  - id: c
    text:
      es: "de recurso únicamente junto con el que se interponga contra la resolución final."
  - id: d
    text:
      es: "de recurso de reposición exclusivamente, en el plazo de diez días."
  explanation:
    es: "El artículo 56.2 dice que el acuerdo de iniciación podrá ser objeto del recurso que proceda. No es irrecurrible, ni se difiere el recurso a la resolución final, ni se limita a la reposición ni a un plazo de diez días."
  citation: "art. 56.2 LPAC"
  difficulty: 2
  tags:
  - "medidas provisionales"
  - "recursos"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0057
  prompt:
    es: "Conforme al artículo 56.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, no se podrán adoptar medidas provisionales que puedan causar:"
  options:
  - id: a
    text:
      es: "perjuicio económico a los interesados, salvo que estos presten garantía suficiente."
  - id: b
    correct: true
    text:
      es: "perjuicio de difícil o imposible reparación a los interesados o que impliquen violación de derechos amparados por las leyes."
  - id: c
    text:
      es: "cualquier perjuicio a los interesados, aunque sea de fácil reparación."
  - id: d
    text:
      es: "perjuicio a terceros ajenos al procedimiento, aunque respeten los derechos amparados por las leyes."
  explanation:
    es: "El artículo 56.4 prohíbe las medidas que puedan causar perjuicio de difícil o imposible reparación a los interesados o que violen derechos amparados por las leyes. No basta un perjuicio económico con garantía, ni se prohíbe cualquier perjuicio de fácil reparación, ni se refiere a terceros ajenos al procedimiento."
  citation: "art. 56.4 LPAC"
  difficulty: 2
  tags:
  - "medidas provisionales"
  - "límites"
# anchor: boe-a-2015-10565-art-57
- id: m02-l04-q0059
  prompt:
    es: "De acuerdo con el artículo 57 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano que inicie o tramite un procedimiento puede acordar su acumulación a otros con los que guarde identidad sustancial o íntima conexión, siempre que:"
  options:
  - id: a
    text:
      es: "los procedimientos se hayan iniciado a solicitud de los mismos interesados."
  - id: b
    text:
      es: "los procedimientos se encuentren en la misma fase de tramitación."
  - id: c
    text:
      es: "consienta la acumulación cada uno de los interesados en los procedimientos."
  - id: d
    correct: true
    text:
      es: "sea el mismo órgano quien deba tramitar y resolver el procedimiento."
  explanation:
    es: "El artículo 57 exige que sea el mismo órgano quien deba tramitar y resolver los procedimientos que se acumulan. No se condiciona a que tengan los mismos interesados, estén en la misma fase ni a que todos consientan."
  citation: "art. 57 LPAC"
  difficulty: 2
  tags:
  - "acumulación"
  - "condición"
# anchor: boe-a-2015-10565-art-58
- id: m02-l04-q0061
  prompt:
    es: "Cuando la Dirección General emite una orden dirigida a un servicio jerárquicamente dependiente que es el órgano competente para iniciar un procedimiento, ¿cómo se inicia este de oficio, según el artículo 58 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Por resolución de la Dirección General que emitió la orden, sin acuerdo del servicio competente."
  - id: b
    text:
      es: "Por acuerdo del órgano competente, pero solo si la orden se ha publicado en el diario oficial."
  - id: c
    correct: true
    text:
      es: "Por acuerdo del órgano competente, como consecuencia de orden superior."
  - id: d
    text:
      es: "Por denuncia del servicio ante la Dirección General que emitió la orden."
  explanation:
    es: "Según el artículo 58 los procedimientos se inician de oficio por acuerdo del órgano competente, bien por propia iniciativa o como consecuencia de orden superior, de modo que quien acuerda es el órgano competente, aquí el servicio. No inicia la Dirección General por sí misma, ni se exige publicar la orden, ni la orden es una denuncia."
  citation: "art. 58 LPAC"
  difficulty: 2
  tags:
  - "iniciación"
# anchor: boe-a-2015-10565-art-60
- id: m02-l04-q0062
  prompt:
    es: "Según el artículo 60.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se entiende por orden superior:"
  options:
  - id: a
    text:
      es: "la emitida por el órgano superior jerárquico del instructor, sea o no el competente para iniciar."
  - id: b
    correct: true
    text:
      es: "la emitida por un órgano administrativo superior jerárquico del competente para la iniciación del procedimiento."
  - id: c
    text:
      es: "la emitida por un órgano con funciones de inspección, aunque no sea superior jerárquico del competente."
  - id: d
    text:
      es: "la emitida por el órgano competente para resolver, dirigida al competente para instruir."
  explanation:
    es: "El artículo 60.1 define la orden superior como la que emite un órgano superior jerárquico del competente para iniciar el procedimiento. No basta ser superior del instructor, ni tener funciones de inspección sin ser superior jerárquico, ni emitirla el órgano que resuelve."
  citation: "art. 60.1 LPAC"
  difficulty: 2
  tags:
  - "iniciación"
  - "orden superior"
# anchor: boe-a-2015-10565-art-61
- id: m02-l04-q0063
  prompt:
    es: "De acuerdo con el artículo 61.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la petición razonada de otros órganos respecto del órgano competente para iniciar el procedimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "no le vincula, si bien debe comunicar al órgano que la formuló los motivos por los que, en su caso, no procede la iniciación."
  - id: b
    text:
      es: "le vincula, salvo que el órgano competente motive su decisión en el plazo de quince días."
  - id: c
    text:
      es: "no le vincula, y no tiene que comunicar al órgano que la formuló los motivos de su decisión."
  - id: d
    text:
      es: "le vincula cuando procede de un órgano con funciones de inspección, averiguación o investigación."
  explanation:
    es: "El artículo 61.2 dice que la petición no vincula al órgano competente, que debe comunicar los motivos si no procede la iniciación. No vincula ni siquiera cuando la formula un órgano con funciones de inspección, y la comunicación de los motivos es obligatoria, sin plazo de quince días."
  citation: "art. 61.2 LPAC"
  difficulty: 2
  tags:
  - "iniciación"
  - "petición razonada"
# anchor: boe-a-2015-10565-art-62
- id: m02-l04-q0064
  prompt:
    es: "Conforme al artículo 62.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se entiende por denuncia el acto por el que cualquier persona, en cumplimiento o no de una obligación legal:"
  options:
  - id: a
    text:
      es: "solicita a un órgano administrativo la iniciación de un procedimiento, adquiriendo por ello la condición de interesada."
  - id: b
    text:
      es: "comunica a un órgano administrativo su disconformidad con un acto, para que lo revise de oficio."
  - id: c
    text:
      es: "propone a un órgano administrativo la iniciación de un procedimiento por un hecho de otra Administración."
  - id: d
    correct: true
    text:
      es: "pone en conocimiento de un órgano administrativo la existencia de un hecho que pudiera justificar la iniciación de oficio de un procedimiento."
  explanation:
    es: "El artículo 62.1 define la denuncia como el acto por el que cualquier persona pone en conocimiento de un órgano la existencia de un hecho que pudiera justificar la iniciación de oficio de un procedimiento. No supone solicitar la iniciación ni adquirir la condición de interesada, ni es una impugnación de un acto, ni la propuesta de un órgano sin competencia, que es la petición razonada."
  citation: "art. 62.1 LPAC"
  difficulty: 2
  tags:
  - "denuncia"
  - "concepto"
# anchor: boe-a-2015-10565-art-62
- id: m02-l04-q0065
  prompt:
    es: "De acuerdo con el artículo 62.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los hechos denunciados pudieran constituir una infracción administrativa, la denuncia recogerá la fecha de su comisión y:"
  options:
  - id: a
    text:
      es: "la calificación jurídica de la infracción que haga el denunciante."
  - id: b
    text:
      es: "las pruebas que acrediten los hechos denunciados."
  - id: c
    text:
      es: "el importe de la sanción que correspondería imponer."
  - id: d
    correct: true
    text:
      es: "cuando sea posible, la identificación de los presuntos responsables."
  explanation:
    es: "El artículo 62.2 añade la fecha de comisión y, cuando sea posible, la identificación de los presuntos responsables. No exige que el denunciante califique jurídicamente la infracción, aporte pruebas ni cuantifique la sanción."
  citation: "art. 62.2 LPAC"
  difficulty: 1
  tags:
  - "denuncia"
  - "contenido"
# anchor: boe-a-2015-10565-art-68
- id: m02-l04-q0069
  prompt:
    es: "El lunes 16 de febrero de 2026 se notifica a una sociedad un requerimiento para subsanar su solicitud, con el plazo del artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en febrero ni en marzo. ¿Cuándo vence el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes 2 de marzo de 2026."
  - id: b
    text:
      es: "El viernes 27 de febrero de 2026."
  - id: c
    text:
      es: "El jueves 26 de febrero de 2026."
  - id: d
    text:
      es: "El lunes 9 de marzo de 2026."
  explanation:
    es: "El plazo es de diez días hábiles contados desde el día siguiente a la notificación: del martes 17 al viernes 20 son cuatro, del 23 al 27 cinco más y el lunes 2 de marzo el décimo. El viernes 27 resulta de contar el día de la notificación como primero. El jueves 26 sale de contar diez días naturales. Y el lunes 9 de marzo suma los cinco días de la ampliación del artículo 68.2, que solo procede si se concede."
  citation: "art. 68.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "subsanación"
# anchor: boe-a-2015-10565-art-68
- id: m02-l04-q0070
  prompt:
    es: "El lunes 9 de marzo de 2026 se notifica a don Julián un requerimiento de subsanación de diez días. La aportación de los documentos presenta dificultades especiales, y a su petición se le concede la ampliación máxima del artículo 68.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en marzo. ¿Cuándo vence el plazo ampliado?"
  options:
  - id: a
    text:
      es: "El lunes 23 de marzo de 2026."
  - id: b
    text:
      es: "El viernes 20 de marzo de 2026."
  - id: c
    text:
      es: "El martes 31 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 30 de marzo de 2026."
  explanation:
    es: "Los diez días hábiles vencen el lunes 23 de marzo, y la ampliación máxima es de cinco días hábiles más: del 24 al 27 son cuatro y el lunes 30 el quinto. El lunes 23 olvida la ampliación. El viernes 20 resulta de contar el día de la notificación como primero y no ampliar. Y el martes 31 supone ampliar seis días, más de los cinco que permite el precepto."
  citation: "art. 68.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "ampliación"
  - "subsanación"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0118
  prompt:
    es: "¿Con arreglo a qué principios adopta el órgano competente para resolver las medidas provisionales una vez iniciado el procedimiento, según el artículo 56.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Legalidad, proporcionalidad y seguridad jurídica."
  - id: b
    text:
      es: "Eficacia, celeridad y menor onerosidad."
  - id: c
    text:
      es: "Proporcionalidad, oportunidad y economía procesal."
  - id: d
    correct: true
    text:
      es: "Proporcionalidad, efectividad y menor onerosidad."
  explanation:
    es: "El artículo 56.1 manda adoptarlas de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad. Las otras combinaciones sustituyen alguno de ellos por principios que el precepto no cita, como la legalidad, la seguridad jurídica, la celeridad, la oportunidad o la economía procesal."
  citation: "art. 56.1 LPAC"
  difficulty: 1
  tags:
  - "medidas provisionales"
  - "principios"
# anchor: boe-a-2015-10565-art-56
- id: m02-l04-q0119
  prompt:
    es: "De acuerdo con el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre las medidas provisionales anteriores a la iniciación del procedimiento:"
  options:
  - id: a
    text:
      es: "Las puede adoptar, de forma motivada, el órgano competente para resolver el procedimiento en cualquier caso en que lo estime oportuno para proteger los intereses implicados."
  - id: b
    text:
      es: "Las puede adoptar el órgano competente para iniciar o instruir el procedimiento sin necesidad de motivación, siempre que existan casos de urgencia inaplazable."
  - id: c
    correct: true
    text:
      es: "Las puede adoptar, de forma motivada, el órgano competente para iniciar o instruir el procedimiento en casos de urgencia inaplazable y para la protección provisional de los intereses implicados."
  - id: d
    text:
      es: "Las puede adoptar el superior jerárquico del órgano competente para iniciar el procedimiento, solo a instancia de los interesados y en casos de urgencia inaplazable."
  explanation:
    es: "El artículo 56.2 permite que el órgano competente para iniciar o instruir adopte, de oficio o a instancia de parte, en casos de urgencia inaplazable y para la protección provisional de los intereses implicados, medidas necesarias y proporcionadas, de forma motivada. No corresponde al órgano que resuelve en cualquier caso, ni se prescinde de la motivación, ni es competente el superior jerárquico solo a instancia de los interesados."
  citation: "art. 56.2 LPAC"
  difficulty: 3
  tags:
  - "medidas provisionales"
  - "órgano"
# anchor: boe-a-2015-10565-art-63
- id: m02-l04-q0120
  prompt:
    es: "¿Cuándo se considera que un órgano es competente para iniciar un procedimiento de naturaleza sancionadora, según el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cuando así lo acuerde el órgano superior jerárquico mediante orden."
  - id: b
    correct: true
    text:
      es: "Cuando así lo determinen las normas reguladoras del procedimiento."
  - id: c
    text:
      es: "Cuando sea el órgano que haya recibido la denuncia de los hechos."
  - id: d
    text:
      es: "Cuando sea el mismo órgano que deba dictar la sanción."
  explanation:
    es: "El artículo 63.1 dice que un órgano es competente para iniciar el procedimiento sancionador cuando así lo determinen las normas reguladoras del mismo. No lo es por la orden de un superior, ni por recibir la denuncia, ni por ser el que sanciona, ya que la ley separa las fases instructora y sancionadora en órganos distintos."
  citation: "art. 63.1 LPAC"
  difficulty: 1
  tags:
  - "iniciación"
  - "sanción"
  - "órgano"
