type: quiz
variants:
- id: m03-l04-q01
  prompt:
    en: In JDK Flight Recorder, which category of event occurs instantly and is logged immediately, for example
      when a thread gets blocked?
  options:
  - id: a
    text:
      en: Duration events
  - id: b
    correct: true
    text:
      en: Instant events
  - id: c
    text:
      en: Sample events
  - id: d
    text:
      en: Custom events
  explanation:
    en: Instant events occur instantly and get logged immediately. Duration events are wrong because they occur
      at a particular duration with specific start time and stop time. Sample events are wrong because they occur
      at regular intervals to check the overall health of the system. Custom events are wrong because they are user
      defined events created using JMC or APIs.
  citation: jdk-troubleshoot-tools#JSTGD-GUID-D38849B6-61C7-4ED6-A395-EA4BC32A9FD6
- id: m03-l04-q02
  prompt:
    en: A continuous Flight Recorder recording is always on, and its global buffer fills up. What happens to the
      data that is already in the buffer?
  options:
  - id: a
    correct: true
    text:
      en: The oldest data is discarded
  - id: b
    text:
      en: The recording stops and keeps the buffer as it is
  - id: c
    text:
      en: The buffer is written to the specified file every time it fills up
  - id: d
    text:
      en: The newest events are dropped while the oldest stay in the buffer
  explanation:
    en: When the global buffer fills up, the oldest data is discarded. Stopping is wrong because a continuous recording
      is always on. Writing at every fill is wrong because the buffer is written to the file only when you request
      a dump or a rule triggers it. Dropping the newest events is wrong because it is the oldest data that is discarded.
  citation: jdk-troubleshoot-tools#JSTGD-GUID-D38849B6-61C7-4ED6-A395-EA4BC32A9FD6
- id: m03-l04-q03
  prompt:
    en: What overhead does the JDK troubleshooting guide give for a standard time fixed recording with Flight Recorder's
      default settings, for most applications?
  options:
  - id: a
    correct: true
    text:
      en: Less than two percent
  - id: b
    text:
      en: About ten percent
  - id: c
    text:
      en: About twenty-five percent
  - id: d
    text:
      en: About fifty percent
  explanation:
    en: The overhead of a standard time fixed recording with default settings is less than two percent for most
      applications. Ten, twenty-five and fifty percent are wrong because the guide puts the overhead below two percent.
  citation: jdk-troubleshoot-jfr#JSTGD-GUID-85F8E796-5FEC-451F-885D-2A4518A5FE68
- id: m03-l04-q04
  prompt:
    en: In the Start Flight Recording wizard of JMC, the default Threshold collects synchronization events above
      which duration, for a thread waiting for a lock?
  options:
  - id: a
    text:
      en: 1 ms
  - id: b
    text:
      en: 100 ms
  - id: c
    correct: true
    text:
      en: 10 ms
  - id: d
    text:
      en: 1 s
  explanation:
    en: By default, synchronization events above 10 ms are collected. 1 ms, 100 ms and 1 s are wrong because the
      default threshold is 10 ms.
  citation: jdk-troubleshoot-tools#JSTGD-GUID-88CC453C-0CED-45D6-9E93-28A03F3752F2
- id: m03-l04-q05
  prompt:
    en: In Java 25, this snippet commits three events of a custom Flight Recorder event class in two recordings,
      with a threshold of zero and of one hour, and counts the recorded events. What does it print?
  options:
  - id: a
    text:
      en: 'threshold 0 ns: 3 events

        threshold 1 h: 3 events'
  - id: b
    correct: true
    text:
      en: 'threshold 0 ns: 3 events

        threshold 1 h: 0 events'
  - id: c
    text:
      en: 'threshold 0 ns: 0 events

        threshold 1 h: 3 events'
  - id: d
    text:
      en: 'threshold 0 ns: 2 events

        threshold 1 h: 0 events'
  explanation:
    en: With a threshold of zero all three events are recorded, and with a threshold of one hour the short events
      fall below it and none is recorded. The output with three events at one hour is wrong because the threshold
      is the duration below which an event is not recorded. The output that swaps the two thresholds is wrong for
      the same reason, since the zero threshold records everything. The output with two events is wrong because
      the loop commits three events.
  citation: jdk-jfr-api-package#package-jdk-jfr
  snippet: m03-l04/JfrEvents.java
- id: m03-l04-q07
  prompt:
    en: In JMH sample 10, which source of inputs prevents the benchmarked computation from being constant folded
      by the JVM?
  options:
  - id: a
    text:
      en: A constant such as `Math.PI` passed directly to the computation
  - id: b
    correct: true
    text:
      en: Non-final instance fields of `@State` objects
  - id: c
    text:
      en: Local variables, as an IDE suggests when it flags the field
  - id: d
    text:
      en: Fields declared `final`, as an IDE suggests
  explanation:
    en: Constant folding can be prevented by always reading the inputs from non-final instance fields of `@State`
      objects. A predictable constant is wrong because the sample marks it as wrong, since the source is predictable
      and the computation is foldable. Local variables are wrong because the sample tells you not to trust the IDE's
      advice to convert the field to a local variable. `final` fields are wrong because the sample tells you not
      to trust the IDE's advice that the field could be final.
  citation: jmh-sample-constantfold#_R_7lcpala9lik5_
- id: m03-l04-q08
  prompt:
    en: How does wrk2 compute the latency of a request, so that it avoids the Coordinated Omission effect that wrk's
      own model shows?
  options:
  - id: a
    correct: true
    text:
      en: From the time the transmission should have occurred under the configured constant throughput
  - id: b
    text:
      en: From the first byte of the request sent to the complete response received
  - id: c
    text:
      en: From individual request samples kept in a separate buffer per request
  - id: d
    text:
      en: By sending requests without waiting for earlier responses, which works for every protocol
  explanation:
    en: wrk2 measures response latency from the time the transmission should have occurred according to the constant
      throughput configured for the run. Measuring from the first byte sent is wrong because that is wrk's model,
      which exhibits a strong Coordinated Omission effect. Per-request sample buffers are wrong because wrk2 replaces
      them with `HdrHistogram` histograms. Sending without waiting is wrong because that asynchronous technique
      is normally only effective with non-blocking protocols or single-request-per-connection workloads.
  citation: wrk2-readme#acknowledgements; wrk2-readme#wrk2
  extract:
    en: wrk2 measures response latency from the time the transmission should have occurred according to the constant
      throughput configured for the run
- id: m03-l04-q09
  prompt:
    en: Which parameter sets the constant throughput of a wrk2 run, and what unit and default value does the README
      give for it?
  options:
  - id: a
    text:
      en: '`--rate` or `-R`, in requests per second per connection, with a default of 1000'
  - id: b
    text:
      en: '`--rate` or `-R`, in total requests per second, with a default of 100'
  - id: c
    correct: true
    text:
      en: '`--rate` or `-R`, in total requests per second, with a default of 1000'
  - id: d
    text:
      en: '`--rate` or `-R`, in total requests per second, with a default of 10000'
  explanation:
    en: wrk2 takes a throughput argument in total requests per second via the `--rate` or `-R` parameters, and the
      default is 1000. The per-connection unit, the default of 100 and the default of 10000 are wrong because the
      README gives total requests per second with a default of 1000.
  citation: wrk2-readme#wrk2
  extract:
    en: (in total requests per second) via either the --rate or -R parameters (default is 1000)
- id: m03-l04-q10
  prompt:
    en: According to the `HdrHistogram` documentation, which statement about recording values in a `Histogram` is
      correct?
  options:
  - id: a
    text:
      en: The memory footprint grows with the number of samples recorded
  - id: b
    text:
      en: Recording a value searches the stored values, so its cost grows with the sample count
  - id: c
    text:
      en: Value precision is expressed as the number of decimal places of the largest value
  - id: d
    correct: true
    text:
      en: Recording a value involves no allocation operations
  explanation:
    en: A Histogram's memory footprint is constant, with no allocation operations involved in recording data values.
      Growth with the number of samples is wrong because the memory footprint is fixed regardless of the number
      of samples recorded. A growing search cost is wrong because the amount of work to record a sample is constant
      and involves no iteration or searching. Decimal places are wrong because value precision is expressed as the
      number of significant digits.
  citation: hdrhistogram-readme#untitled
  extract:
    en: A Histogram's memory footprint is constant, with no allocation operations involved in recording data values
      or in iterating through them.
- id: m03-l04-q11
  prompt:
    en: In Java 25, this snippet applies the correction rule of the `HdrHistogram` README to 10,000 samples of 1
      msec followed by one pause sample of 100 seconds, with an expected interval of 10 msec. What does it print?
  options:
  - id: a
    text:
      en: 'raw samples=10001

        raw percent at or below 1 ms=99.99

        added samples=9999

        corrected samples=20000

        corrected percent at or below 1 ms=50.00'
  - id: b
    text:
      en: 'raw samples=10001

        raw percent at or below 1 ms=99.99

        added samples=0

        corrected samples=10001

        corrected percent at or below 1 ms=99.99'
  - id: c
    text:
      en: 'raw samples=10001

        raw percent at or below 1 ms=99.99

        added samples=99998

        corrected samples=109999

        corrected percent at or below 1 ms=9.09'
  - id: d
    correct: true
    text:
      en: 'raw samples=10001

        raw percent at or below 1 ms=99.99

        added samples=9998

        corrected samples=19999

        corrected percent at or below 1 ms=50.00'
  explanation:
    en: The correction adds one sample at each step of 10 msec from 99,990 msec down to 20 msec, which makes 9,998
      added samples, 19,999 in total and about 50.00% at or below 1 msec. The output with 9,999 added samples is
      wrong because the last value must still be higher than the interval, so 10 msec is not added. The output with
      no added samples is wrong because the pause sample exceeds the expected interval and so triggers the correction.
      The output with 99,998 added samples is wrong because the steps are of 10 msec, not 1 msec.
  citation: hdrhistogram-readme#corrected-vs-raw-value-recording-calls
  extract:
    en: Only ~50% of results will be at 1 msec or below
