- id: g-safety-property
  term: {en: safety property}
  definition: {en: "A safety property is one that states nothing bad ever happens. It requires that at every point in every execution, the property holds."}
  origin: m08-l01
  citation: "paper-gilbert-lynch-cap#p3"
- id: g-liveness-property
  term: {en: liveness property}
  definition: {en: "A liveness property is one that states that eventually something good happens. It says nothing about the state at any instant in time."}
  origin: m08-l01
  citation: "paper-gilbert-lynch-cap#p3"
- id: g-linearizability
  term: {en: linearizability}
  definition: {en: "Linearizability provides the illusion that each operation applied by concurrent processes takes effect instantaneously at some point between its invocation and its response."}
  origin: m08-l01
  citation: "etcd-api-guarantees#linearizability"
- id: g-stratum
  term: {en: stratum}
  definition: {en: "The level of a server in the NTP hierarchy. Primary servers are assigned stratum one, and secondary servers at each lower level are assigned stratum numbers one greater than the preceding level."}
  origin: m08-l01
  citation: "rfc5905#top"
