# anchor: boe-a-2015-11724-art-207
- id: m04-l09-q071
  prompt:
    es: "Conforme al artículo 207.1 del texto refundido de la Ley General de la Seguridad Social, en el cese por despido colectivo o por causas objetivas el trabajador debe acreditar haber percibido la indemnización correspondiente o:"
  options:
  - id: a
    text:
      es: "haber interpuesto recurso de alzada ante la entidad gestora de la prestación contra la decisión extintiva de la empresa."
  - id: b
    text:
      es: "haber solicitado la prestación por desempleo y no haberla agotado todavía en su totalidad."
  - id: c
    correct: true
    text:
      es: "haber interpuesto demanda judicial en reclamación de la indemnización o de impugnación de la decisión extintiva."
  - id: d
    text:
      es: "haber suscrito un convenio especial con la Seguridad Social durante, al menos, seis meses."
  explanation:
    es: "El artículo 207.1.d), en los casos de despido colectivo, despido por causas objetivas y extinción por voluntad del trabajador por ciertas causas, exige acreditar «haber percibido la indemnización correspondiente» o «haber interpuesto demanda judicial en reclamación de dicha indemnización o de impugnación de la decisión extintiva». El recurso de alzada ante la entidad gestora, la solicitud de desempleo y el convenio especial no son una alternativa que el artículo prevea."
  citation: "art. 207.1 LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q072
  prompt:
    es: "Conforme al artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, la jubilación anticipada por voluntad del interesado exige una edad inferior, como máximo, a la del artículo 205.1.a) en:"
  options:
  - id: a
    correct: true
    text:
      es: "dos años."
  - id: b
    text:
      es: "un año."
  - id: c
    text:
      es: "tres años."
  - id: d
    text:
      es: "cuatro años."
  explanation:
    es: "El artículo 208.1.a) exige «una edad que sea inferior en dos años, como máximo» a la que resulte del artículo 205.1.a). Los cuatro años son el margen de la jubilación anticipada por causa no imputable al trabajador, del artículo 207.1. Uno y tres años no figuran en el artículo."
  citation: "art. 208.1 LGSS"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q073
  prompt:
    es: "Según el artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, el acceso a la jubilación anticipada por voluntad del interesado exige acreditar un período mínimo de cotización efectiva de:"
  options:
  - id: a
    text:
      es: "treinta y tres años, sin contar la parte proporcional por pagas extraordinarias."
  - id: b
    text:
      es: "treinta y cinco años, contando la parte proporcional por las pagas extraordinarias."
  - id: c
    correct: true
    text:
      es: "treinta y cinco años, sin contar la parte proporcional por pagas extraordinarias."
  - id: d
    text:
      es: "treinta años, sin contar la parte proporcional por pagas extraordinarias."
  explanation:
    es: "El artículo 208.1.b) pide «un período mínimo de cotización efectiva de treinta y cinco años, sin que, a tales efectos, se tenga en cuenta la parte proporcional por pagas extraordinarias». Los treinta y tres años son la cifra de la modalidad por causa no imputable al trabajador, del artículo 207.1. Contar la parte proporcional contradice el artículo, y treinta años no figura en él."
  citation: "art. 208.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q074
  prompt:
    es: "De acuerdo con el artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, la pensión de la jubilación anticipada por voluntad del interesado debe superar la mínima que correspondería por su situación familiar al cumplir:"
  options:
  - id: a
    text:
      es: "sesenta años."
  - id: b
    text:
      es: "sesenta y tres años."
  - id: c
    text:
      es: "sesenta y siete años."
  - id: d
    correct: true
    text:
      es: "sesenta y cinco años."
  explanation:
    es: "El artículo 208.1.c) exige que el importe de la pensión resulte superior a la pensión mínima que correspondería al interesado «por su situación familiar al cumplimiento de los sesenta y cinco años de edad». Sesenta años, sesenta y tres y sesenta y siete no son la edad de referencia del artículo, aunque sesenta y siete sea la edad de jubilación ordinaria."
  citation: "art. 208.1 LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-dt-vigesimosexta
- id: m04-l09-q075
  prompt:
    es: "Según la disposición transitoria vigesimosexta del texto refundido de la Ley General de la Seguridad Social, hasta que se desarrolle reglamentariamente el artículo 194, el grado de incapacidad permanente total se denomina:"
  options:
  - id: a
    text:
      es: "incapacidad permanente total para todo trabajo."
  - id: b
    correct: true
    text:
      es: "incapacidad permanente total para la profesión habitual."
  - id: c
    text:
      es: "incapacidad permanente total para cualquier profesión u oficio."
  - id: d
    text:
      es: "incapacidad permanente total revisable por mejoría."
  explanation:
    es: "La disposición transitoria vigesimosexta da hasta entonces al artículo 194 una redacción que llama al grado b) «incapacidad permanente total para la profesión habitual». «Para todo trabajo» es el nombre del grado absoluto. «Para cualquier profesión u oficio» describe ese mismo grado absoluto, no el total. «Revisable por mejoría» no es una denominación de la disposición."
  citation: "disposición transitoria vigesimosexta LGSS"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-11724-dt-vigesimosexta
- id: m04-l09-q076
  prompt:
    es: "Conforme a la disposición transitoria vigesimosexta del texto refundido de la Ley General de la Seguridad Social, lo dispuesto en el artículo 194 solo se aplica a partir de:"
  options:
  - id: a
    text:
      es: "el 1 de enero de 2027, fecha desde la que rigen las nuevas edades de jubilación."
  - id: b
    text:
      es: "la fecha en que se apruebe el siguiente convenio único de la Administración General del Estado."
  - id: c
    correct: true
    text:
      es: "la fecha en que entren en vigor las disposiciones reglamentarias a que se refiere su apartado 3."
  - id: d
    text:
      es: "el momento en que el Instituto Nacional de la Seguridad Social unifique sus criterios de valoración."
  explanation:
    es: "La disposición dice que el artículo 194 «únicamente será de aplicación a partir de la fecha en que entren en vigor las disposiciones reglamentarias a que se refiere el apartado 3». El 1 de enero de 2027 es la fecha de las nuevas edades de jubilación, de la disposición transitoria séptima, y no tiene que ver con este artículo. Un convenio único o unos criterios del Instituto Nacional de la Seguridad Social no son condición que la disposición fije."
  citation: "disposición transitoria vigesimosexta LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "fecha"
