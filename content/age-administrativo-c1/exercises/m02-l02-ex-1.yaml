# anchor: boe-a-1985-12534-art-49
- id: m02-l02-q001
  prompt:
    es: "De acuerdo con el artículo 49.1 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, quedan excluidos del concepto de documento a los efectos de esa ley:"
  options:
  - id: a
    text:
      es: "Las expresiones recogidas en soportes informáticos."
  - id: b
    text:
      es: "Las expresiones gráficas, sonoras o en imagen."
  - id: c
    correct: true
    text:
      es: "Los ejemplares no originales de ediciones."
  - id: d
    text:
      es: "Las expresiones hechas en lenguaje convencional."
  explanation:
    es: "El artículo 49.1 define el documento como toda expresión en lenguaje natural o convencional y cualquier otra expresión gráfica, sonora o en imagen, recogida en cualquier soporte material, «incluso los soportes informáticos». Después añade: «Se excluyen los ejemplares no originales de ediciones». Los soportes informáticos están incluidos de forma expresa. Las expresiones gráficas, sonoras o en imagen forman parte de la definición. El lenguaje convencional también, junto al natural."
  citation: "art. 49.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1985-12534-art-49
- id: m02-l02-q003
  prompt:
    es: "Según el artículo 49.3 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, ¿con qué antigüedad forman parte del Patrimonio Documental los documentos de un sindicato o de un partido político?"
  options:
  - id: a
    correct: true
    text:
      es: "Con una antigüedad superior a los cuarenta años."
  - id: b
    text:
      es: "Con una antigüedad superior a los cien años."
  - id: c
    text:
      es: "Con una antigüedad superior a los cincuenta años."
  - id: d
    text:
      es: "Con cualquier antigüedad, desde que se producen."
  explanation:
    es: "El artículo 49.3 exige «una antigüedad superior a los cuarenta años» a los documentos de las entidades y asociaciones de carácter político, sindical o religioso. Los cien años son el requisito del artículo 49.4 para otras entidades particulares y personas físicas. Los cincuenta años no figuran en el artículo. Sin requisito de antigüedad solo entran los documentos públicos del artículo 49.2."
  citation: "art. 49.3 Ley 16/1985"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12534-art-49
- id: m02-l02-q004
  prompt:
    es: "Un particular conserva documentos que él mismo generó hace setenta años. Según el artículo 49 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, ¿forman parte del Patrimonio Documental?"
  options:
  - id: a
    text:
      es: "Sí, porque superan la antigüedad de cuarenta años que exige la ley."
  - id: b
    correct: true
    text:
      es: "No, salvo que la Administración del Estado los declare constitutivos de ese Patrimonio."
  - id: c
    text:
      es: "Sí, porque los documentos de cualquier época forman parte de él."
  - id: d
    text:
      es: "No, y la Administración del Estado no puede declararlos hasta que cumplan los cien años exigidos."
  explanation:
    es: "A los documentos de personas físicas el artículo 49.4 les exige «una antigüedad superior a los cien años», y setenta no llegan. El artículo 49.5 permite a la Administración del Estado declarar constitutivos del Patrimonio Documental documentos que, «sin alcanzar la antigüedad indicada», merezcan esa consideración. Los cuarenta años son el requisito de las entidades políticas, sindicales, religiosas y culturales privadas, no de los particulares. «De cualquier época» solo se aplica a los documentos públicos del artículo 49.2. La declaración no tiene que esperar a los cien años: es justo la vía para los que no los alcanzan."
  citation: "art. 49.5 Ley 16/1985"
  difficulty: 3
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-1985-12534-art-49
- id: m02-l02-q005
  prompt:
    es: "De acuerdo con el artículo 49.5 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, los documentos que, sin alcanzar la antigüedad exigida, merezcan esa consideración pueden ser declarados constitutivos del Patrimonio Documental por:"
  options:
  - id: a
    text:
      es: "El Archivo Histórico Nacional, a propuesta de su dirección."
  - id: b
    correct: true
    text:
      es: "La Administración del Estado."
  - id: c
    text:
      es: "Las Cortes Generales, mediante ley."
  - id: d
    text:
      es: "Sus propietarios o poseedores, mediante declaración formal."
  explanation:
    es: "El artículo 49.5 dice que «La Administración del Estado podrá declarar constitutivos del Patrimonio Documental» esos documentos. El Archivo Histórico Nacional conserva documentos con valor histórico, pero no hace esta declaración. La ley no exige una ley de las Cortes Generales para cada declaración. Los propietarios o poseedores no pueden declarar por sí mismos que sus documentos forman parte del Patrimonio Documental."
  citation: "art. 49.5 Ley 16/1985"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12534-art-49
- id: m02-l02-q006
  prompt:
    es: "¿Cuáles de los siguientes documentos forman parte del Patrimonio Documental cualquiera que sea su época, según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de una empresa privada gestora de un servicio público, en lo relacionado con esa gestión."
  - id: b
    text:
      es: "Los de una fundación cultural privada, generados, conservados o reunidos en el ejercicio de sus actividades."
  - id: c
    text:
      es: "Los de un sindicato, generados en el ejercicio de sus actividades propias."
  - id: d
    text:
      es: "Los de una persona física particular, reunidos a lo largo de su vida."
  explanation:
    es: "El artículo 49.2 incluye los documentos «de cualquier época» de las personas privadas, físicas o jurídicas, «gestoras de servicios públicos en lo relacionado con la gestión de dichos servicios». Los de una fundación cultural privada y los de un sindicato necesitan una antigüedad superior a cuarenta años (artículo 49.3). Los de una persona física particular necesitan más de cien años (artículo 49.4)."
  citation: "art. 49.2 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2011-18541-art-2
- id: m02-l02-q007
  prompt:
    es: "Según el artículo 2.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿qué se entiende por documento de archivo?"
  options:
  - id: a
    correct: true
    text:
      es: "Ejemplar en cualquier tipo de soporte, testimonio de las actividades y funciones de las personas físicas y jurídicas, públicas o privadas."
  - id: b
    text:
      es: "Ejemplar en soporte papel, testimonio de las actividades y funciones de las personas jurídicas públicas."
  - id: c
    text:
      es: "Ejemplar en cualquier tipo de soporte, testimonio de las actividades y funciones de los órganos de las Administraciones Públicas y sus organismos."
  - id: d
    text:
      es: "Conjunto orgánico de documentos reunidos por las personas físicas o jurídicas, públicas o privadas, en sus actividades."
  explanation:
    es: "El artículo 2.2.b) define el documento de archivo como «Ejemplar en cualquier tipo de soporte, testimonio de las actividades y funciones de las personas físicas y jurídicas, públicas o privadas». No se limita al papel ni a las personas jurídicas públicas. Tampoco se limita a los órganos de las Administraciones Públicas. El conjunto orgánico de documentos es la definición de archivo, no de documento de archivo."
  citation: "art. 2.2.b) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l02-q008
  prompt:
    es: "Según el artículo 2.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, documento electrónico es la información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico:"
  options:
  - id: a
    text:
      es: "En cualquier formato, siempre que incorpore la firma electrónica de su autor."
  - id: b
    text:
      es: "Según un formato determinado y generada solo por los órganos de las Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "Según un formato determinado y susceptible de identificación y tratamiento diferenciado."
  - id: d
    text:
      es: "Según un formato abierto y con una referencia temporal del momento de su emisión."
  explanation:
    es: "El artículo 2.2.c) termina la definición con «según un formato determinado y susceptible de identificación y tratamiento diferenciado». No exige firma electrónica ni admite cualquier formato. No limita el documento electrónico a los generados por órganos administrativos. Tampoco pide formato abierto ni referencia temporal."
  citation: "art. 2.2.c) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l02-q009
  prompt:
    es: "Conforme al artículo 2.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el expediente electrónico es el conjunto de documentos electrónicos:"
  options:
  - id: a
    text:
      es: "Correspondientes a un procedimiento administrativo, siempre que solo contengan información de carácter textual."
  - id: b
    text:
      es: "Reunidos por una persona física o jurídica, cualquiera que sea el procedimiento de origen."
  - id: c
    text:
      es: "Correspondientes a los procedimientos ya finalizados de un mismo órgano, ordenados por fecha de resolución."
  - id: d
    correct: true
    text:
      es: "Correspondientes a un procedimiento administrativo, cualquiera que sea el tipo de información que contengan."
  explanation:
    es: "El artículo 2.2.d) define el expediente electrónico como «el conjunto de documentos electrónicos correspondientes a un procedimiento administrativo, cualquiera que sea el tipo de información que contengan». No se limita a la información textual. Es un solo procedimiento, no lo que reúne una persona con independencia del procedimiento. Tampoco agrupa varios procedimientos finalizados de un órgano."
  citation: "art. 2.2.d) RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-26
- id: m02-l02-q010
  prompt:
    es: "Según el artículo 26.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se entiende por documentos públicos administrativos:"
  options:
  - id: a
    text:
      es: "Los presentados por los interesados en el registro de cualquier Administración."
  - id: b
    text:
      es: "Los que obren en los archivos públicos, cualquiera que sea su autor."
  - id: c
    correct: true
    text:
      es: "Los válidamente emitidos por los órganos de las Administraciones Públicas."
  - id: d
    text:
      es: "Los emitidos en soporte papel por los órganos de las Administraciones Públicas."
  explanation:
    es: "El artículo 26.1 dice: «Se entiende por documentos públicos administrativos los válidamente emitidos por los órganos de las Administraciones Públicas». Lo que presenta un interesado en el registro no lo emite un órgano administrativo. Estar en un archivo público no convierte en documento público administrativo lo que otro autor produjo. Tampoco se exige el papel: la regla es emitirlos por medios electrónicos."
  citation: "art. 26.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-26
- id: m02-l02-q011
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo emiten las Administraciones Públicas los documentos administrativos?"
  options:
  - id: a
    correct: true
    text:
      es: "Por escrito, a través de medios electrónicos, salvo que su naturaleza exija otra forma más adecuada."
  - id: b
    text:
      es: "Por escrito en papel, salvo que el interesado elija recibirlos a través de medios electrónicos."
  - id: c
    text:
      es: "Por escrito, a través de medios electrónicos, en todo caso y sin excepción por razón de su naturaleza."
  - id: d
    text:
      es: "En la forma que elija en cada caso el órgano emisor, en papel o a través de medios electrónicos."
  explanation:
    es: "El artículo 26.1 manda emitir los documentos administrativos «por escrito, a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia». La regla es el medio electrónico, no el papel. Hay excepción, así que «en todo caso» es falso. El órgano tampoco elige libremente la forma."
  citation: "art. 26.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-46
- id: m02-l02-q012
  prompt:
    es: "Según el artículo 46.1 del Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, el documento administrativo electrónico ha de haber sido generado, recibido o incorporado por las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "En el ejercicio de sus funciones sujetas a Derecho administrativo."
  - id: b
    text:
      es: "En el ejercicio de cualquiera de sus actividades, públicas o privadas."
  - id: c
    text:
      es: "Dentro de un procedimiento administrativo que ya haya finalizado."
  - id: d
    text:
      es: "Con la firma electrónica cualificada del titular del órgano emisor."
  explanation:
    es: "El artículo 46.1 exige que la información haya sido «generada, recibida o incorporada por las Administraciones Públicas en el ejercicio de sus funciones sujetas a Derecho administrativo». No basta cualquier actividad. No hace falta que el procedimiento haya terminado. La definición no menciona la firma electrónica cualificada."
  citation: "art. 46.1 RD 203/2021"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q013
  prompt:
    es: "Según el artículo 16.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿pueden los Organismos públicos vinculados o dependientes de una Administración tener registro electrónico propio?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, plenamente interoperable e interconectado con el Registro Electrónico General de su Administración."
  - id: b
    text:
      es: "No, todos sus documentos se asientan en el Registro Electrónico General de su Administración."
  - id: c
    text:
      es: "Sí, pero como registro independiente, sin conexión alguna con el Registro Electrónico General de su Administración."
  - id: d
    text:
      es: "No, salvo que una ley les atribuya de forma expresa un registro propio."
  explanation:
    es: "El artículo 16.1 dice que esos Organismos públicos «podrán disponer de su propio registro electrónico plenamente interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende». Pueden tenerlo, así que las dos respuestas negativas son falsas: la ley no exige una ley específica ni concentra todo en el Registro General. El registro propio no es independiente: tiene que estar interconectado."
  citation: "art. 16.1 LPAC"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q014
  prompt:
    es: "¿Cuál de los siguientes extremos especificarán en todo caso las disposiciones de creación de registros electrónicos, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La relación de empleados públicos habilitados para asistir a los interesados."
  - id: b
    text:
      es: "El número de oficinas de asistencia en materia de registros adheridas."
  - id: c
    text:
      es: "El número máximo de documentos que admite cada presentación."
  - id: d
    correct: true
    text:
      es: "El órgano o unidad responsable de la gestión del registro."
  explanation:
    es: "El artículo 16.1 dice que las disposiciones de creación de registros electrónicos «especificarán el órgano o unidad responsable de su gestión, así como la fecha y hora oficial y los días declarados como inhábiles». Los empleados públicos habilitados, el número de oficinas adheridas y un número máximo de documentos por presentación no están en esa lista."
  citation: "art. 16.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q015
  prompt:
    es: "Junto al órgano o unidad responsable de su gestión, las disposiciones de creación de registros electrónicos especificarán, en todo caso:"
  options:
  - id: a
    text:
      es: "El horario de apertura y los días de atención de las oficinas presenciales."
  - id: b
    correct: true
    text:
      es: "La fecha y hora oficial y los días declarados como inhábiles."
  - id: c
    text:
      es: "El nombre de los empleados públicos que practicarán los asientos."
  - id: d
    text:
      es: "La fecha de entrada en funcionamiento y la relación de oficinas adheridas."
  explanation:
    es: "El artículo 16.1 de la Ley 39/2015 manda que las disposiciones de creación especifiquen el órgano o unidad responsable de su gestión, «así como la fecha y hora oficial y los días declarados como inhábiles». El horario y los días de las oficinas los publica cada Administración por otra vía (artículo 31.1), no la disposición de creación. El nombre de los empleados que asientan y la relación de oficinas adheridas no están en la lista."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q016
  prompt:
    es: "¿De qué documentos se hace el correspondiente asiento en el Registro Electrónico General de cada Administración Pública?"
  options:
  - id: a
    text:
      es: "Solo de los documentos que inician un procedimiento administrativo a solicitud del interesado, no de los escritos posteriores."
  - id: b
    text:
      es: "Solo de los documentos presentados por personas no obligadas a relacionarse electrónicamente."
  - id: c
    correct: true
    text:
      es: "De todo documento presentado o recibido en cualquier órgano, Organismo público o Entidad vinculado o dependiente."
  - id: d
    text:
      es: "Solo de los documentos dirigidos a órganos de la Administración titular del registro."
  explanation:
    es: "El artículo 16.1 de la Ley 39/2015 dice que en el Registro Electrónico General «se hará el correspondiente asiento de todo documento que sea presentado o que se reciba en cualquier órgano administrativo, Organismo público o Entidad vinculado o dependiente a éstos». No se limita a los escritos que inician un procedimiento ni a los de personas no obligadas a relacionarse electrónicamente. Tampoco a los dirigidos a la propia Administración: el artículo 16.4.a) permite presentar en un registro escritos dirigidos a otras Administraciones."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-38
- id: m02-l02-q017
  prompt:
    es: "Según el artículo 38.2 del Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, las anotaciones en el Registro General de la Administración General del Estado tendrán plena eficacia y validez:"
  options:
  - id: a
    text:
      es: "Solo para los órganos de la Administración General del Estado."
  - id: b
    text:
      es: "Para la Administración General del Estado y su sector público institucional."
  - id: c
    correct: true
    text:
      es: "Para todas las Administraciones Públicas."
  - id: d
    text:
      es: "Para las Administraciones que se hayan adherido mediante convenio."
  explanation:
    es: "El artículo 38.2 dice que esas anotaciones «tendrán plena eficacia y validez para todas las Administraciones Públicas». No se limitan a la Administración General del Estado ni a su sector público institucional. No hace falta convenio de adhesión."
  citation: "art. 38.2 RD 203/2021"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-df-septima
- id: m02-l02-q018
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde qué día producen efectos sus previsiones relativas al registro electrónico y al archivo único electrónico?"
  options:
  - id: a
    text:
      es: "Desde el 2 de octubre de 2016."
  - id: b
    text:
      es: "Desde el 1 de enero de 2020."
  - id: c
    correct: true
    text:
      es: "Desde el 2 de abril de 2021."
  - id: d
    text:
      es: "Desde el 1 de enero de 2023."
  explanation:
    es: "La disposición final séptima dice que las previsiones relativas al registro electrónico y al archivo único electrónico «producirán efectos a partir del día 2 de abril de 2021». El 2 de octubre de 2016 es la entrada en vigor general de la ley, al año de su publicación, que no alcanza a esas previsiones. El 1 de enero de 2020 y el 1 de enero de 2023 no aparecen en la disposición."
  citation: "disposición final séptima LPAC"
  difficulty: 2
  tags:
  - "fecha"
