m04-l02-q01:
  key:
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: by marking an object declaration with the data modifier, you can instruct the compiler to return the actual name of the object when calling toString()
  wrong:
  - option: It returns the properties of the object in the form `Name(a=1)`
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: toString() returns the name of the data object
  - option: It still returns the name of the object followed by its hash
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: by marking an object declaration with the data modifier, you can instruct the compiler to return the actual name of the object when calling toString()
  - option: It makes `equals()` compare references, so two instances are different
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: The equals() function for a data object ensures that all objects that have the type of your data object are considered equal.
m04-l02-q02:
  key:
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: Make sure that you only compare data objects structurally (using the == operator) and never by reference (using the === operator).
  wrong:
  - option: By reference with `===`, because a data object is a singleton
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: Make sure that you only compare data objects structurally (using the == operator) and never by reference (using the === operator).
  - option: With a custom `equals` implementation that compares an identifier
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: You can't provide a custom equals or hashCode implementation for a data object.
  - option: By comparing `hashCode()` values, which differ for each instance
    anchor: kotlin-docs-object-declarations#data-objects
    sentence: The generated hashCode() function has a behavior that is consistent with the equals() function, so that all runtime instances of a data object have the same hash code.
m04-l02-q03:
  key:
    anchor: kotlin-docs-inline-classes#inline-classes.md
    sentence: They don't have an identity and can only hold values.
  wrong:
  - option: It has an identity, so two wrappers of the same value are different objects
    anchor: kotlin-docs-inline-classes#inline-classes.md
    sentence: They don't have an identity and can only hold values.
  - option: It is represented at runtime by an instance with a field for each property
    anchor: kotlin-docs-inline-classes#inline-classes.md
    sentence: At runtime, instances of the inline class will be represented using this single property
  - option: It can hold any number of properties initialized in the primary constructor
    anchor: kotlin-docs-inline-classes#inline-classes.md
    sentence: An inline class must have a single property initialized in the primary constructor.
m04-l02-q04:
  key:
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: Unlike statements, when expressions must cover all cases.
  wrong:
  - option: It requires nothing, because when no condition matches, no code is run
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: Since when statements don't need to cover all cases, using guard conditions in when statements without an else branch means that if no conditions match, no code is run.
  - option: It requires the conditions of each branch to be separated by commas
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: You can't use guard conditions when you have multiple conditions separated by a comma.
  - option: It requires the `when` to have no subject
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: You can use guard conditions with when as long as it has a subject.
m04-l02-q05:
  key:
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: If the primary condition doesn't match, the guard condition isn't evaluated.
  wrong:
  - option: Always, even when the primary condition does not match
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: If the primary condition doesn't match, the guard condition isn't evaluated.
  - option: Before the primary condition, so the type check can use its result
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: Place a guard condition after the primary condition in the same branch, separated by if
  - option: Only when the `when` has no subject
    anchor: kotlin-docs-control-flow#guard-conditions-in-when-expressions
    sentence: You can use guard conditions with when as long as it has a subject.
