- id: m09-l05-qa03
  prompt:
    en: According to Microsoft in Understand data models, which statement about document data stores does the article
      make?
  options:
  - id: a
    correct: true
    text:
      en: Document stores hold semi-structured documents, often in JSON format
  - id: b
    text:
      en: Per-document schema flexibility makes gradual schema evolution harder
  - id: c
    text:
      en: Transactions in a document store always span every document
  - id: d
    text:
      en: A document store cannot index more than one field
  explanation:
    en: Microsoft writes that document data stores hold semi-structured documents, often in JSON format, where each
      document includes named fields and data. It writes that per-document schema flexibility enables gradual evolution,
      which contradicts making evolution harder. It lists selective transactional scope as a consideration, which
      contradicts transactions always spanning every document. It lists multi-field indexing as a strength, which
      contradicts indexing only one field.
  citation: azure-data-store-models#document-data-stores-
- id: m09-l05-qa04
  prompt:
    en: According to Microsoft in Understand data models, which statement about time-series data stores does the
      article make?
  options:
  - id: a
    text:
      en: Time-series stores are typically update-in-place databases
  - id: b
    text:
      en: Time-series stores lack support for time-based queries and aggregations
  - id: c
    correct: true
    text:
      en: Time-series stores ingest and analyze large volumes in near real time
  - id: d
    text:
      en: Tag cardinality is not a consideration for a time-series store
  explanation:
    en: Microsoft writes that time-series data stores are optimized to ingest and analyze large volumes of data
      in near real time. It writes that they are typically append-only databases, which contradicts update-in-place
      databases. It writes that they support time-based queries and aggregations, which contradicts a lack of such
      support. It lists tag cardinality management as a consideration, which contradicts tag cardinality not being
      one.
  citation: azure-data-store-models#time-series-data-stores-
- id: m09-l05-qa05
  prompt:
    en: According to Microsoft in Understand data models, which statement about combining data models and avoiding
      premature fragmentation does the article make?
  options:
  - id: a
    text:
      en: A search index is a sound primary data store when search dominates
  - id: b
    correct: true
    text:
      en: Keep one service while it meets performance, scale and governance objectives
  - id: c
    text:
      en: Sharing one database across several microservices removes coupling between them
  - id: d
    text:
      en: A new data model can be added before monitoring and backups are in place
  explanation:
    en: Microsoft writes that you should use one service when it still meets performance, scale and governance objectives.
      It lists a search index that becomes the primary data store as an antipattern that leads to misuse, which
      contradicts treating it as a sound primary store. It lists multiple microservices sharing one database as
      an antipattern that creates coupling, which contradicts it removing coupling. It lists teams adding another
      model without operational maturity such as monitoring or backups as an antipattern, which contradicts adding
      one before they exist.
  citation: azure-data-store-models#combine-models-and-avoid-pitfalls
