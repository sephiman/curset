# anchor: fuente-ms-excel-formato-fecha-html
- id: m02-l09-q221
  prompt:
    es: "En un formato de fecha personalizado de Excel 365 configurado en español con valores de hora, el código «m» aparece justo después de «h». ¿Qué muestra Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "Los minutos en lugar del mes"
  - id: b
    text:
      es: "El mes en lugar de los minutos"
  - id: c
    text:
      es: "Las horas con dos cifras"
  - id: d
    text:
      es: "Un error de formato"
  explanation:
    es: "La página dice que, si «m» va justo después de «h» o «hh», o justo antes de «ss», Excel muestra los minutos y no el mes. «El mes en lugar de los minutos»: la página dice que, tras h o hh, Excel muestra los minutos. «Un error de formato»: la página describe un comportamiento concreto: se muestran los minutos. «Las horas con dos cifras»: el código hh controla las horas; la m que le sigue se interpreta como minutos."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Crear un formato de fecha personalizado»"
