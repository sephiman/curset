# anchor: fuente-ms-excel-formato-fecha-html
- id: m02-l09-q057
  prompt:
    es: "En Excel 365, con una celda de fecha seleccionada, ¿cuál de los siguientes métodos abreviados le aplica rápidamente el formato de fecha predeterminado?"
  options:
  - id: a
    text:
      es: "Ctrl+1"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+#"
  - id: c
    text:
      es: "Ctrl+Mayús+F"
  - id: d
    text:
      es: "Ctrl+punto y coma (;)"
  explanation:
    es: "Ctrl+Mayús+# aplica rápidamente el formato de fecha predeterminado. Ctrl+1 abre Formato de celdas, Ctrl+Mayús+F da formato a fuentes en ese cuadro y Ctrl+punto y coma (;) inserta la fecha actual."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Sugerencias para mostrar fechas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m02-l09-q058
  prompt:
    es: "En una hoja de Excel 365 en idioma español, se escribe 2/2 en una celda sin formato. ¿Cuál de las siguientes opciones describe cómo la trata Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "Asume que es una fecha y le aplica el formato de fecha predeterminado del Panel de control"
  - id: b
    text:
      es: "Asume que es una fracción y la muestra como número decimal en la celda"
  - id: c
    text:
      es: "La deja como texto, sin aplicar ningún formato de fecha ni de número"
  - id: d
    text:
      es: "Asume que es una fecha y le aplica el formato elegido en Archivo › Opciones › Avanzadas"
  explanation:
    es: "La página dice que, al escribir 2/2, Excel asume que es una fecha y le aplica el formato según la configuración de fecha predeterminada del Panel de control. Por eso no es una fracción ni texto, y el formato no sale de Opciones avanzadas."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Aplicar formato a una fecha como quiera en Excel»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m02-l09-q060
  prompt:
    es: "En Excel 365, tras seleccionar las celdas y pulsar Ctrl+1, ¿cuál de las siguientes secuencias elige un formato de fecha de la lista?"
  options:
  - id: a
    text:
      es: "Pestaña Número, categoría Fecha y, en Muestra, el formato deseado"
  - id: b
    text:
      es: "Pestaña Protección, categoría Fecha y, en Tipo, el formato deseado"
  - id: c
    correct: true
    text:
      es: "Pestaña Número, categoría Fecha y, en Tipo, el formato deseado"
  - id: d
    text:
      es: "Pestaña Alineación, categoría Fecha y, en Tipo, el formato deseado"
  explanation:
    es: "En Formato de celdas se elige la pestaña Número, la categoría Fecha y, en Tipo, un formato de fecha. El cuadro Muestra solo enseña la vista previa con una fecha de los datos, y la pestaña Número es la que contiene las categorías de formato."
  citation: "fuente: `ms-excel-formato-fecha.html`; «En Tipo, elija un formato de fecha. Se verá una vista previa de su formato en el cuadro Muestra, con la primera fecha de sus datos.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m02-l09-q063
  prompt:
    es: "En Excel 365, con la configuración predeterminada, el 1 de enero de 2008 es el número de serie 39448. ¿Qué número de serie tiene el 2 de enero de 2008?"
  options:
  - id: a
    text:
      es: "39447"
  - id: b
    text:
      es: "39450"
  - id: c
    text:
      es: "39458"
  - id: d
    correct: true
    text:
      es: "39449"
  explanation:
    es: "Los números de serie son secuenciales y el 1 de enero de 2008 es el 39448, así que el día siguiente es el 39449. El 39447 sería el día anterior y el 39450 el 3 de enero; el 39458 está diez días después del 1 de enero."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
  - "cantidad"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m02-l09-q064
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes entradas inserta una fecha que se actualiza a la fecha actual cada vez que se reabre la hoja?"
  options:
  - id: a
    text:
      es: "=DIA(A1)"
  - id: b
    correct: true
    text:
      es: "=HOY()"
  - id: c
    text:
      es: "=DIA(HOY())"
  - id: d
    text:
      es: "=FECHA(2026;2;2)"
  explanation:
    es: "Para una fecha que se actualiza al reabrir la hoja o recalcular se escribe =HOY(). DIA devuelve solo el día, un entero de 1 a 31, y FECHA da la fecha concreta que indican sus argumentos."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Para introducir una fecha que se actualizará a la fecha actual cada vez que vuelva a abrir una hoja de cálculo o vuelva a calcular una fórmula, escriba =HOY() en una celda vacía y, a continuación, presione ENTRAR.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-formato-fecha-html
