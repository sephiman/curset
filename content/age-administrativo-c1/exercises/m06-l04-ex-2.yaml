# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q027
  prompt:
    es: "En Word 365, ¿con qué marca señala la revisión automática un posible error ortográfico mientras se escribe?"
  options:
  - id: a
    text:
      es: "Con un doble subrayado de color rojo bajo la palabra"
  - id: b
    correct: true
    text:
      es: "Con una línea ondulada de color rojo bajo la palabra"
  - id: c
    text:
      es: "Con una línea ondulada de color verde bajo la palabra"
  - id: d
    text:
      es: "Con una línea ondulada de color azul bajo la palabra"
  explanation:
    es: "La sección de Windows de la página dice: «Office marca los posibles errores ortográficos con una línea ondulada de color rojo y los posibles errores gramaticales se marcan con una línea ondulada de color azul». La línea azul es, por tanto, la de la gramática. La verde es la de la gramática en Word para Mac. El doble subrayado no es una marca de la revisión."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q028
  prompt:
    es: "En Word 365, una frase del documento aparece marcada con una línea ondulada de color azul. ¿Qué indica esa marca?"
  options:
  - id: a
    text:
      es: "Un comentario sin publicar sobre la frase"
  - id: b
    correct: true
    text:
      es: "Un posible error gramatical en la frase"
  - id: c
    text:
      es: "Una frase escrita en otro idioma de corrección"
  - id: d
    text:
      es: "Un posible error ortográfico en la frase"
  explanation:
    es: "La página dice que Office marca «los posibles errores gramaticales» con «una línea ondulada de color azul», y los ortográficos con una roja. Un comentario no se marca con una línea ondulada: aparece en el panel Comentarios. La página tampoco usa ese color para el texto en otro idioma."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q029
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones hace que Office no vuelva a marcar como incorrecta una palabra escrita como se quiere?"
  options:
  - id: a
    text:
      es: "Revisar ortografía mientras escribe"
  - id: b
    text:
      es: "Omitir una vez"
  - id: c
    text:
      es: "Volver a comprobar documento"
  - id: d
    correct: true
    text:
      es: "Agregar al diccionario"
  explanation:
    es: "La página dice: «Si Office marca como incorrectas palabras que están escritas de la manera que usted quiere, seleccione Agregar al diccionario para que Office no las vuelva a marcar como incorrectas». Omitir una vez solo pasa por alto esa aparición. Volver a comprobar documento hace lo contrario: revisa otra vez lo que se ignoró. Revisar ortografía mientras escribe es la casilla que activa o desactiva la revisión automática."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q030
  prompt:
    es: "En Word 365, ¿qué tecla se presiona para iniciar la revisión ortográfica y gramatical del documento?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+F7"
  - id: b
    correct: true
    text:
      es: "F7"
  - id: c
    text:
      es: "Mayús+F7"
  - id: d
    text:
      es: "F9"
  explanation:
    es: "La página dice: «Para iniciar la revisión ortográfica y gramatical en el documento, presione F7». En la página de atajos de Word, Mayús+F7 muestra el panel del diccionario de sinónimos, Ctrl+Mayús+F7 actualiza la información vinculada de un documento de origen y F9 actualiza los campos seleccionados."
  citation: "fuente: `ms-office-ortografia.html`; «Ejecutar la revisión ortográfica y gramatical»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q031
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones realiza la tecla F7 pulsada sola, según la tabla de teclas de función?"
  options:
  - id: a
    text:
      es: "Muestra el panel de tareas Mostrar formato del texto seleccionado."
  - id: b
    text:
      es: "Muestra el panel de tareas Traductor para traducir el texto."
  - id: c
    correct: true
    text:
      es: "Muestra el panel de tareas del Editor, que revisa el texto."
  - id: d
    text:
      es: "Muestra el panel de tareas del diccionario de sinónimos del texto."
  explanation:
    es: "La tabla dice: «Solo F7: muestra el panel de tareas del Editor para revisar la ortografía y la gramática del documento o del texto seleccionado». El diccionario de sinónimos se abre con Mayús+F7, el panel Traductor con Alt+Mayús+F7 y el panel Mostrar formato con Mayús+F1."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q032
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados busca el siguiente error gramatical u ortográfico del documento?"
  options:
  - id: a
    text:
      es: "Mayús+F7"
  - id: b
    correct: true
    text:
      es: "Alt+F7"
  - id: c
    text:
      es: "Alt+Mayús+F7"
  - id: d
    text:
      es: "Alt+F8"
  explanation:
    es: "En la fila de F7, «Alt+F7: busca el siguiente error gramatical u ortográfico». Mayús+F7 muestra el panel del diccionario de sinónimos, Alt+Mayús+F7 muestra el panel de tareas Traductor y Alt+F8 muestra el cuadro de diálogo Macro."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q033
  prompt:
    es: "¿Cuál de las siguientes aplicaciones de Microsoft 365 carece de revisión ortográfica automática mientras se escribe, de modo que el corrector se inicia a mano con F7?"
  options:
  - id: a
    text:
      es: "PowerPoint"
  - id: b
    text:
      es: "Outlook"
  - id: c
    correct: true
    text:
      es: "Excel"
  - id: d
    text:
      es: "Word"
  explanation:
    es: "La nota de la página dice: «La revisión ortográfica y gramatical automática no está disponible en Access, Excel ni Project. Puede iniciar manualmente el corrector ortográfico presionando F7». Word, Outlook y PowerPoint sí la tienen: son, además, las únicas con revisión gramatical automática."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q034
  prompt:
    es: "Señale en qué aplicaciones de Microsoft 365 está disponible la revisión gramatical automática mientras se escribe, según la página de Microsoft sobre ortografía:"
  options:
  - id: a
    text:
      es: "Solo en Word, Excel y Outlook."
  - id: b
    text:
      es: "Solo en Word, Access y Outlook."
  - id: c
    correct: true
    text:
      es: "Solo en Outlook, Word y PowerPoint."
  - id: d
    text:
      es: "Solo en Word, Excel y PowerPoint."
  explanation:
    es: "La página dice: «La revisión gramatical automática solo está disponible en Outlook, Word y PowerPoint». Las otras opciones meten Excel o Access, que según la misma nota no tienen ni siquiera la revisión ortográfica automática."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q035
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas lleva a la casilla Revisar ortografía mientras escribe, para desactivar el subrayado de errores?"
  options:
  - id: a
    text:
      es: "Archivo › Opciones › Idioma"
  - id: b
    text:
      es: "Archivo › Opciones › Guardar"
  - id: c
    correct: true
    text:
      es: "Archivo › Opciones › Revisión"
  - id: d
    text:
      es: "Archivo › Opciones › General"
  explanation:
    es: "La página dice que, en Word, se abre «el menú Archivo», se selecciona «Opciones» y se elige «Revisión», donde se activa o desactiva la casilla Revisar ortografía mientras escribe. General y Guardar son otras categorías de Opciones, y en Idioma se cambia, según la página de traducción, el idioma de destino de la traducción."
  citation: "fuente: `ms-office-ortografia.html`; «Activar o desactivar el subrayado multicolor»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q036
  prompt:
    es: "En Word 365, ¿qué casillas de Archivo › Opciones › Revisión se desactivan para que no se revise la gramática, ni al revisar la ortografía ni mientras se escribe?"
  options:
  - id: a
    text:
      es: "Ocultar errores de gramática solo en este documento y Revisar gramática con ortografía"
  - id: b
    text:
      es: "Revisar ortografía mientras escribe y Marcar errores gramaticales mientras escribe"
  - id: c
    correct: true
    text:
      es: "Marcar errores gramaticales mientras escribe y Revisar gramática con ortografía"
  - id: d
    text:
      es: "Revisar ortografía mientras escribe y Ocultar errores de gramática solo en este documento"
  explanation:
    es: "Para desactivar por completo la revisión gramatical, la página dice: «Desactive las casillas Marcar errores gramaticales mientras escribe y Revisar gramática con ortografía». Revisar ortografía mientras escribe afecta a la ortografía, no a la gramática. Ocultar errores de gramática solo en este documento se limita al documento abierto, así que no la desactiva por completo."
  citation: "fuente: `ms-office-ortografia.html`; «Desactivar por completo la revisión gramatical»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q037
  prompt:
    es: "En Word 365, ¿cómo se ocultan los errores de ortografía solo en el documento con el que se está trabajando, sin cambiar la revisión de los demás?"
  options:
  - id: a
    text:
      es: "Desactivando la casilla Revisar ortografía mientras escribe, sin tocar nada más"
  - id: b
    text:
      es: "Agregando al diccionario cada una de las palabras marcadas en el documento"
  - id: c
    text:
      es: "Eligiendo Volver a comprobar documento en la categoría Revisión de Opciones"
  - id: d
    correct: true
    text:
      es: "Con Excepciones para y Ocultar errores de ortografía solo en este documento"
  explanation:
    es: "La nota de la página dice que en Word se elige una opción de «la lista Excepciones para» y se activan las casillas «Ocultar errores de ortografía solo en este documento» y la de gramática. Desactivar Revisar ortografía mientras escribe, por sí solo, afecta a la revisión automática en general. Volver a comprobar documento revisa otra vez lo ignorado. Agregar palabras al diccionario hace que Office no las vuelva a marcar."
  citation: "fuente: `ms-office-ortografia.html`; «Activar o desactivar el subrayado multicolor»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q038
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Archivo › Opciones › Revisión fuerza una nueva revisión de la ortografía y la gramática que se ignoraron antes?"
  options:
  - id: a
    text:
      es: "Marcar errores gramaticales mientras escribe"
  - id: b
    text:
      es: "Agregar al diccionario"
  - id: c
    correct: true
    text:
      es: "Volver a comprobar documento"
  - id: d
    text:
      es: "Revisar gramática con ortografía"
  explanation:
    es: "La página dice: «Seleccione Revisión y elija Volver a comprobar documento», tras lo cual Word avisa del restablecimiento de la revisión. Agregar al diccionario hace que una palabra deje de marcarse. Revisar gramática con ortografía y Marcar errores gramaticales mientras escribe son casillas que activan la revisión gramatical."
  citation: "fuente: `ms-office-ortografia.html`; «Volver a revisar ortografía y gramática que ignoró previamente»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-ortografia-html
- id: m06-l04-q039
  prompt:
    es: "En Word 365, ¿cómo se corrige una palabra o frase que la revisión automática ha subrayado como posible error?"
  options:
  - id: a
    correct: true
    text:
      es: "Con clic derecho en ella y eligiendo una de las opciones"
  - id: b
    text:
      es: "Presionando Mayús+F7 con la palabra o la frase seleccionada"
  - id: c
    text:
      es: "Con doble clic en ella para abrir el cuadro de diálogo Fuente"
  - id: d
    text:
      es: "Presionando F8 con la palabra o la frase seleccionada"
  explanation:
    es: "La página dice: «haga clic con el botón derecho en la palabra o frase subrayada y elija una de las opciones para corregir el error». Mayús+F7 abre el panel del diccionario de sinónimos y F8 extiende la selección. El cuadro Fuente es un cuadro de formato, no de corrección."
  citation: "fuente: `ms-office-ortografia.html`; «Mostrar errores automáticamente mientras trabaja»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q040
  prompt:
    es: "En Word 365, ¿qué hace el método abreviado Mayús+F7, según la tabla de teclas de función de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Muestra el panel de tareas del diccionario de sinónimos."
  - id: b
    text:
      es: "Muestra el panel de tareas Traductor para traducir el texto."
  - id: c
    text:
      es: "Actualiza la información vinculada de un documento de origen."
  - id: d
    text:
      es: "Muestra el panel de tareas del Editor para revisar el texto."
  explanation:
    es: "La tabla dice: «Mayús+F7: muestra el panel de tareas del diccionario de sinónimos». El panel del Editor se abre con F7 sola, el panel Traductor con Alt+Mayús+F7, y Ctrl+Mayús+F7 actualiza la información vinculada en un documento de origen de Word."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q041
  prompt:
    es: "En Word 365, ¿qué hace el método abreviado Mayús+F3 con el texto que está seleccionado?"
  options:
  - id: a
    text:
      es: "Pega en su lugar el contenido que se guardó en Especial."
  - id: b
    text:
      es: "Crea con él un nuevo bloque de creación reutilizable."
  - id: c
    text:
      es: "Lo corta y lo guarda en Especial para pegarlo después."
  - id: d
    correct: true
    text:
      es: "Lo cambia entre mayúsculas, minúsculas y tipo título."
  explanation:
    es: "La tabla dice: «Mayús+F3: cambia el texto seleccionado entre mayúsculas, minúsculas y tipo título». En la misma fila, Ctrl+F3 corta el contenido seleccionado en Especial, Ctrl+Mayús+F3 pega el contenido de Especial y Alt+F3 crea un nuevo bloque de creación."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q042
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado inserta un comentario en el documento?"
  options:
  - id: a
    text:
      es: "Ctrl+Alt+I"
  - id: b
    correct: true
    text:
      es: "Ctrl+Alt+M"
  - id: c
    text:
      es: "Alt+Mayús+C"
  - id: d
    text:
      es: "Ctrl+Alt+Z"
  explanation:
    es: "La tabla «Revisar un documento» dice: «Insertar un comentario. | Ctrl+Alt+M»; la página de comentarios lo repite. En la misma página de atajos, Alt+Mayús+C cierra el Panel de revisión, Ctrl+Alt+Z recorre las ubicaciones de los cuatro cambios anteriores y Ctrl+Alt+I cambia a la vista previa de impresión."
  citation: "fuente: `ms-word-atajos.html`; «Revisar un documento»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q043
  prompt:
    es: "En Word 365, con los comentarios modernos, ¿cuál de los siguientes métodos abreviados publica el comentario que se está escribiendo?"
  options:
  - id: a
    text:
      es: "Entrar"
  - id: b
    text:
      es: "Ctrl+Mayús+Entrar"
  - id: c
    text:
      es: "Mayús+Entrar"
  - id: d
    correct: true
    text:
      es: "Ctrl+Entrar"
  explanation:
    es: "La página dice: «Para publicar un comentario con el teclado, presione Ctrl + Entrar». Entrar solo publicaba el comentario con el modelo anterior. Mayús+Entrar inserta un salto de línea y Ctrl+Mayús+Entrar un salto de columna, según la página de atajos de Word."
  citation: "fuente: `ms-word-comentarios.html`; «Publicar comentarios»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q045
  prompt:
    es: "En Word 365, ¿qué comentarios se ven al agregar un comentario con la vista Contextual, en el panel Comentarios del margen derecho?"
  options:
  - id: a
    correct: true
    text:
      es: "Los activos, en su contexto, y con los resueltos ocultos"
  - id: b
    text:
      es: "Solo los resueltos, para revisarlos antes de borrarlos"
  - id: c
    text:
      es: "Los activos y los resueltos, todos juntos en una lista"
  - id: d
    text:
      es: "Solo los que mencionan al usuario con una @mención"
  explanation:
    es: "La página dice que, en la vista Contextual, «todos los comentarios activos están visibles en contexto y los comentarios resueltos están ocultos». Ver juntos los activos y los resueltos es la vista Lista. Ninguna de las dos vistas filtra por resueltos solamente ni por @menciones."
  citation: "fuente: `ms-word-comentarios.html`; «Dos formas de ver comentarios»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q046
  prompt:
    es: "En Word 365, ¿cuál de las siguientes vistas abre el panel Comentarios con todos los comentarios, tanto activos como resueltos?"
  options:
  - id: a
    text:
      es: "El modo Lectura"
  - id: b
    text:
      es: "La vista Esquema"
  - id: c
    text:
      es: "La vista Contextual"
  - id: d
    correct: true
    text:
      es: "La vista Lista"
  explanation:
    es: "La página dice: «La vista Lista abre el panel Comentarios en el extremo derecho e incluye todos los comentarios activos y resueltos». La vista Contextual oculta los resueltos. El modo Lectura y la vista Esquema son vistas del documento, no del panel Comentarios."
  citation: "fuente: `ms-word-comentarios.html`; «Dos formas de ver comentarios»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q047
  prompt:
    es: "En Word 365, ¿dónde se cambia en cualquier momento entre la vista Contextual y la vista Lista de los comentarios?"
  options:
  - id: a
    text:
      es: "En Más acciones de subproceso (...), en la tarjeta del comentario"
  - id: b
    correct: true
    text:
      es: "En el botón Comentarios, en la esquina superior derecha de la cinta"
  - id: c
    text:
      es: "En Revisar › Panel de revisiones, en la pestaña de la cinta"
  - id: d
    text:
      es: "En Revisar › Mostrar marcas › Globos, en el área Seguimiento"
  explanation:
    es: "La página dice que se cambia de vista «seleccionando el botón Comentarios en la esquina superior derecha de la cinta de opciones». Panel de revisiones abre el panel con las revisiones del documento. Globos, en Mostrar marcas, sirve para mostrar las revisiones en línea. Más acciones de subproceso sirve para eliminar, obtener un vínculo o resolver un hilo."
  citation: "fuente: `ms-word-comentarios.html`; «Dos formas de ver comentarios»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q048
  prompt:
    es: "En Word 365, ¿qué se selecciona en la tarjeta de un comentario moderno para resolver su hilo de comentarios?"
  options:
  - id: a
    correct: true
    text:
      es: "Más acciones de subproceso (...)"
  - id: b
    text:
      es: "El icono de lápiz de la tarjeta"
  - id: c
    text:
      es: "El botón Comentario de la tarjeta"
  - id: d
    text:
      es: "La casilla Asignar a del comentario"
  explanation:
    es: "La página dice: «Para eliminar, obtener un vínculo o resolver un hilo de comentarios, seleccione Más acciones de subproceso (...)». El icono de lápiz sirve para editar el comentario; la casilla Asignar a convierte el comentario en una tarea; y el botón Comentario publica el comentario que se está escribiendo."
  citation: "fuente: `ms-word-comentarios.html`; «Para editar, eliminar o resolver un comentario»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q049
  prompt:
    es: "En Word 365, ¿cuál de los siguientes formatos se puede aplicar al texto de un comentario moderno desde la pestaña Inicio?"
  options:
  - id: a
    text:
      es: "La configuración de párrafo"
  - id: b
    text:
      es: "Un estilo de fuente"
  - id: c
    text:
      es: "El tamaño de la fuente"
  - id: d
    correct: true
    text:
      es: "El resaltado del texto"
  explanation:
    es: "La página enumera lo que admiten: negrita, cursiva, subrayado y tachado, colores de fuente y «Resaltado». Añade que «los comentarios modernos no admiten cambiar el tamaño de fuente, los estilos de fuente o la configuración de párrafo», que son las otras tres opciones."
  citation: "fuente: `ms-word-comentarios.html`; «No puedo agregar o no ver algunos tipos de formato en los comentarios modernos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q050
  prompt:
    es: "En Word 365 para Windows, en el cuadro de un comentario moderno se puede agregar:"
  options:
  - id: a
    text:
      es: "Texto y formas, pero no imágenes."
  - id: b
    text:
      es: "Texto y tablas, pero no imágenes."
  - id: c
    correct: true
    text:
      es: "Texto e imágenes, pero no tablas."
  - id: d
    text:
      es: "Texto y ecuaciones, pero no imágenes."
  explanation:
    es: "La página dice: «En comentarios modernos, puede agregar texto e imágenes (solo Windows). En el cuadro de comentarios no se admiten otros objetos, como tablas, ecuaciones, formas o campos». Las tres opciones restantes admiten justo uno de esos objetos no admitidos y excluyen las imágenes."
  citation: "fuente: `ms-word-comentarios.html`; «No puedo agregar o no ver algunos objetos existentes al usar comentarios modernos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q051
  prompt:
    es: "Señale la respuesta correcta sobre la revisión del texto de los comentarios modernos en Word 365:"
  options:
  - id: a
    text:
      es: "No revisan la ortografía ni la gramática del texto escrito."
  - id: b
    correct: true
    text:
      es: "Revisan la ortografía, pero no ofrecen sugerencias gramaticales."
  - id: c
    text:
      es: "Ofrecen sugerencias gramaticales, pero no revisan la ortografía."
  - id: d
    text:
      es: "Revisan la ortografía y la gramática, igual que el documento."
  explanation:
    es: "La página dice: «Los comentarios modernos revisan la ortografía, pero no admiten otras herramientas avanzadas de corrección, como las sugerencias gramaticales, en este momento». Las demás opciones cambian una de las dos mitades de esa frase."
  citation: "fuente: `ms-word-comentarios.html`; «No veo herramientas avanzadas de corrección como sugerencias gramaticales en comentarios modernos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q052
  prompt:
    es: "En Word 365, con los comentarios modernos, ¿dónde se pueden seguir editando los comentarios escritos por otros usuarios?"
  options:
  - id: a
    text:
      es: "En la vista Contextual del comentario"
  - id: b
    correct: true
    text:
      es: "En el Panel de revisiones"
  - id: c
    text:
      es: "En la barra de herramientas del modo Lectura"
  - id: d
    text:
      es: "En la tarjeta, con el icono de lápiz"
  explanation:
    es: "La página dice que no se pueden editar los comentarios de otros usuarios en un comentario moderno, pero que «aún puede editar los comentarios de otros usuarios en el panel Revisiones», que la misma página llama Panel de revisiones. El icono de lápiz y la vista Contextual pertenecen a la experiencia moderna, que no lo permite. La barra del modo Lectura es para herramientas de lectura."
  citation: "fuente: `ms-word-comentarios.html`; «¿Por qué no puedo editar los comentarios de otros usuarios?»"
  difficulty: 3
  tags:
  - "comportamiento"
