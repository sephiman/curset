type: quiz
variants:
- id: m10-l05-q01
  prompt:
    en: A Pod runs one container with liveness, readiness and startup probes configured. Which statement about how
      Kubernetes uses these probes is correct?
  options:
  - id: a
    text:
      en: A failed readiness probe makes the kubelet restart the container
  - id: b
    correct: true
    text:
      en: A liveness probe does not wait for the readiness probe to succeed
  - id: c
    text:
      en: A startup probe keeps running periodically for the whole life of the container
  - id: d
    text:
      en: A failed startup probe only removes the Pod from the Service endpoints
  explanation:
    en: A liveness probe does not wait for readiness probes to succeed. Restarting on a failed readiness probe is
      ruled out because a failed readiness probe makes the `EndpointSlice` controller remove the Pod's IP address
      from the `EndpointSlices` of matching Services. A periodic startup probe is ruled out because it is only executed
      at startup, unlike liveness and readiness probes. Only removing the Pod from endpoints after a failed startup
      probe is ruled out because the kubelet kills the container, which is subjected to its restart policy.
  citation: k8s-pod-lifecycle#liveness-probe; k8s-pod-lifecycle#readiness-probe; k8s-pod-lifecycle#startup-probe
  extract:
    en: Liveness probes do not wait for readiness probes to succeed.
- id: m10-l05-q02
  prompt:
    en: A Spring Boot application on Kubernetes exposes liveness and readiness health groups through Actuator. Which
      statement about these probes in the Spring Boot documentation is correct?
  options:
  - id: a
    text:
      en: The readiness group includes custom health indicators by default
  - id: b
    text:
      en: A Service whose instances are all unready answers with HTTP `503` for a `ClusterIP` type
  - id: c
    text:
      en: A `startupProbe` is always required because readiness passes before the startup tasks finish
  - id: d
    correct: true
    text:
      en: The liveness probe should not depend on health checks for external systems
  explanation:
    en: The liveness probe should not depend on health checks for external systems, because a failing external system
      could make Kubernetes restart all application instances. Custom indicators in the readiness group by default
      are ruled out because Spring Boot does not add other health indicators to these groups. An HTTP `503` from
      a `ClusterIP` Service is ruled out because there is no HTTP error response when all instances are unready,
      since there is no connection. A mandatory `startupProbe` is ruled out because the `readinessProbe` fails until
      all startup tasks are done.
  citation: spring-boot-actuator-endpoints#actuator.endpoints.kubernetes-probes.external-state; spring-boot-actuator-endpoints#actuator.endpoints.kubernetes-probes
- id: m10-l05-q03
  prompt:
    en: A Pod is deleted with the default grace period while one container keeps running after receiving `SIGTERM`.
      Which statement about what Kubernetes does during Pod termination is correct?
  options:
  - id: a
    text:
      en: A `preStop` hook still running at expiry gets an extension of 30 seconds
  - id: b
    correct: true
    text:
      en: Once the grace period has expired, the kubelet sends the KILL signal to the remaining processes
  - id: c
    text:
      en: Container runtimes always send TERM, whatever `STOPSIGNAL` the image defines
  - id: d
    text:
      en: Hooks are delivered exactly once, so a hook handler never needs to expect repeats
  explanation:
    en: Once the grace period has expired, the KILL signal is sent to any remaining processes and the Pod is deleted
      from the API Server. A 30-second extension for a `preStop` hook is ruled out because the kubelet requests
      only a one-off extension of 2 seconds. Always sending TERM is ruled out because many container runtimes respect
      the `STOPSIGNAL` value defined in the container image. Exactly-once hook delivery is ruled out because hook
      delivery is intended to be at least once, so a hook may be called multiple times.
  citation: k8s-pod-lifecycle#pod-termination; k8s-pod-lifecycle#pod-termination-flow; k8s-container-lifecycle-hooks#hook-delivery-guarantees
  extract:
    en: Once the grace period has expired, the KILL signal is sent to any remaining processes, and the Pod is then
      deleted from the API Server.
- id: m10-l05-q04
  prompt:
    en: Which statement about Pods that are shutting down in Kubernetes, and about the endpoints and nodes involved,
      is correct?
  options:
  - id: a
    text:
      en: Service proxies never route to terminating endpoints, even when all endpoints are terminating
  - id: b
    correct: true
    text:
      en: The terminating condition of an endpoint is set when its Pod is first deleted
  - id: c
    text:
      en: During node shutdown the kubelet still accepts new Pods that are already bound to the node
  - id: d
    text:
      en: During node shutdown the kubelet skips the normal Pod termination process to save time
  explanation:
    en: The terminating condition of an endpoint backed by a Pod is set when the Pod is first deleted, most likely
      before its containers exit. Never routing to terminating endpoints is ruled out because proxies may route
      traffic to endpoints that are both serving and terminating if all available endpoints are terminating. Accepting
      bound Pods during node shutdown is ruled out because the kubelet does not accept new Pods, even those already
      bound to the node. Skipping Pod termination is ruled out because the kubelet ensures that Pods follow the
      normal Pod termination process during node shutdown.
  citation: k8s-endpoint-slices#terminating; k8s-kubelet-graceful-shutdown#graceful-node-shutdown
  extract:
    en: For endpoints backed by a Pod, this condition is set when the Pod is first deleted (that is, when it receives
      a deletion timestamp, but most likely before the Pod's containers exit).
- id: m10-l05-q06
  prompt:
    en: A Kafka consumer with auto-commit enabled is closed with `close()` during application shutdown. Which statement
      about what `close()` does, according to the Kafka Javadoc, is correct?
  options:
  - id: a
    text:
      en: A call to `wakeup()` from another thread interrupts it
  - id: b
    text:
      en: It stops at the first failing shutdown step and skips the remaining ones
  - id: c
    correct: true
    text:
      en: It commits the current offsets if possible within the default timeout
  - id: d
    text:
      en: It waits up to 5 seconds by default for any needed cleanup
  explanation:
    en: With auto-commit enabled, `close()` commits the current offsets if possible within the default timeout.
      Interrupting it with `wakeup()` is ruled out because `wakeup()` cannot be used to interrupt `close()`. Stopping
      at the first failing step is ruled out because the operation attempts all shutdown steps even if one of them
      fails. A 5-second wait is ruled out because it waits for up to the default timeout of 30 seconds for any needed
      cleanup.
  citation: kafka-javadoc-kafkaconsumer#close()
  extract:
    en: If auto-commit is enabled, this will commit the current offsets if possible within the default timeout.
- id: m10-l05-q07
  prompt:
    en: A Deployment with 10 desired Pods uses the `RollingUpdate` strategy with the default `maxUnavailable` and
      `maxSurge` values. During the update, what are the minimum number of available Pods and the maximum total
      number of Pods?
  options:
  - id: a
    text:
      en: At least 7 available and at most 13 in total
  - id: b
    text:
      en: At least 8 available and at most 12 in total
  - id: c
    correct: true
    text:
      en: At least 8 available and at most 13 in total
  - id: d
    text:
      en: At least 8 available and at most 10 in total
  explanation:
    en: Both defaults are 25%, so `maxUnavailable` rounds down from 2.5 to 2 and `maxSurge` rounds up from 2.5 to
      3, which gives at least 8 available and at most 13 in total. Seven available Pods is ruled out because the
      absolute number for `maxUnavailable` is calculated from the percentage by rounding down. A total of 12 is
      ruled out because the absolute number for `maxSurge` is calculated from the percentage by rounding up. A total
      of 10 is ruled out because the default value of `maxSurge` is 25%, not 0.
  citation: k8s-deployment#max-unavailable; k8s-deployment#max-surge
  extract:
    en: The absolute number is calculated from percentage by rounding down.
- id: m10-l05-q09
  prompt:
    en: A platform team compares release techniques on Kubernetes. Which statement about blue-green deployment,
      canary deployment, progressive delivery and Deployment rollbacks is correct?
  options:
  - id: a
    text:
      en: In a canary deployment the new version receives all traffic as soon as it is deployed
  - id: b
    text:
      en: Progressive delivery releases to all users at once and analyzes metrics afterwards
  - id: c
    text:
      en: A Deployment cannot be rolled back once its update completes because the history is discarded
  - id: d
    correct: true
    text:
      en: In a blue-green deployment only the old version receives production traffic while both versions run
  explanation:
    en: In a blue-green deployment both versions are deployed at the same time and only the old version receives
      production traffic. Full traffic to a canary is ruled out because a canary exposes a subset of users to the
      new version while the rest of the traffic goes to the old one. A release to all users at once is ruled out
      because progressive delivery limits the exposure of the new version to a subset of users and increases it
      progressively. A discarded history is ruled out because by default all of the Deployment's rollout history
      is kept so you can roll back at any time.
  citation: argo-rollouts-concepts#blue-green; argo-rollouts-concepts#canary; argo-rollouts-concepts#progressive-delivery;
    k8s-deployment#rolling-back-a-deployment
  extract:
    en: has both the new and old version of the application deployed at the same time. During this time, only the
      old version of the application will receive production traffic.
- id: m10-l05-q10
  prompt:
    en: According to the OpenGitOps principles, which statement about how a GitOps-managed system reaches and keeps
      its desired state is correct?
  options:
  - id: a
    text:
      en: The desired state is kept in a mutable store so that operators can edit it in place
  - id: b
    text:
      en: A CI pipeline pushes the desired state into the system whenever a commit is merged
  - id: c
    text:
      en: The desired state is expressed as imperative scripts that the agents run in order
  - id: d
    correct: true
    text:
      en: Software agents continuously observe the actual state and attempt to apply the desired state
  explanation:
    en: Software agents continuously observe actual system state and attempt to apply the desired state. A mutable
      store is ruled out because desired state is stored in a way that enforces immutability, versioning and a complete
      version history. A pipeline that pushes the state is ruled out because software agents automatically pull
      the desired state declarations from the source. Imperative scripts are ruled out because the desired state
      must be expressed declaratively.
  citation: opengitops-principles#continuously-reconciled
- id: m10-l05-q11
  prompt:
    en: In Argo CD terminology, what does the sync status of an application tell you about it?
  options:
  - id: a
    correct: true
    text:
      en: Whether the live state matches the target state
  - id: b
    text:
      en: Whether the last sync operation succeeded
  - id: c
    text:
      en: Whether the application is running correctly and can serve requests
  - id: d
    text:
      en: What is different between the latest code in Git and the live state
  explanation:
    en: The sync status tells whether or not the live state matches the target state. Success of the last sync is
      ruled out because the sync operation status is whether or not a sync succeeded. Running correctly and serving
      requests is ruled out because that is the health of the application. The difference between Git and the live
      state is ruled out because a refresh compares the latest code in Git with the live state and figures out what
      is different.
  citation: argocd-core-concepts#core-concepts
  extract:
    en: Sync status Whether or not the live state matches the target state.
- id: m10-l05-q12
  prompt:
    en: According to DORA's capabilities guidance, which statement about trunk-based development and continuous
      integration is correct?
  options:
  - id: a
    correct: true
    text:
      en: Developers merge their work in small batches into trunk at least once a day
  - id: b
    text:
      en: Branches in trunk-based development typically take days or even weeks of work
  - id: c
    text:
      en: Teams perform better when they schedule code freezes to stabilize the release
  - id: d
    text:
      en: Continuous integration means feature branches plus a nightly build of each branch
  explanation:
    en: In trunk-based development each developer divides their work into small batches and merges it into trunk
      at least once a day. Branches that take days or weeks are ruled out because branches in trunk-based development
      typically last no more than a few hours. Scheduled code freezes are ruled out because DORA data points to
      having no code freezes and no integration phases. Feature branches with a nightly build are ruled out because
      continuous integration is trunk-based development plus a suite of fast automated tests after each commit to
      trunk.
  citation: dora-capabilities-trunk#searchLinkMobile; dora-capabilities-trunk#how-to-implement-trunk-based-development
  extract:
    en: The second pattern is known as trunk-based development, where each developer divides their own work into
      small batches and merges that work into trunk at least once (and potentially several times) a day.
- id: m10-l05-q13
  prompt:
    en: A team runs database migrations with Flyway or Liquibase as part of every deployment. Which statement about
      how these tools apply changes, according to their documentation, is correct?
  options:
  - id: a
    text:
      en: Flyway reruns every migration on each start so the schema always matches the scripts
  - id: b
    text:
      en: Flyway keeps its record of applied migrations only in the scripts folder, not in the database
  - id: c
    correct: true
    text:
      en: Flyway wraps each migration script in a single transaction by default
  - id: d
    text:
      en: Liquibase reruns a changeset on every update unless told otherwise
  explanation:
    en: By default Flyway wraps the execution of each migration script in a single transaction and applies them
      in order. Rerunning every migration is ruled out because Migrate compares the available migrations with those
      applied to the database and migrates only to close the gap. A record kept only in the scripts folder is ruled
      out because Flyway adds a schema history table to your schema. Rerunning a changeset on every update is ruled
      out because Liquibase does not re-run a changeset unless `runAlways` or `runOnChange` is specified.
  citation: flyway-migrations#Migrations-Transactionhandling
- id: m10-l05-q14
  prompt:
    en: According to DORA's software delivery performance metrics, which statement about throughput and instability
      is correct?
  options:
  - id: a
    correct: true
    text:
      en: Throughput is measured with change lead time, deployment frequency and failed deployment recovery time
  - id: b
    text:
      en: DORA currently defines four metrics, the original four keys
  - id: c
    text:
      en: Instability is measured with change lead time and deployment frequency
  - id: d
    text:
      en: Change fail rate is the ratio of deployments that are unplanned because of a production incident
  explanation:
    en: 'DORA uses three factors to measure throughput: change lead time, deployment frequency and failed deployment
      recovery time. Four current metrics is ruled out because the metrics shifted from the original four keys to
      the current five-metric model. Lead time and deployment frequency as instability factors is ruled out because
      DORA measures instability with change fail rate and deployment rework rate. The unplanned-incident ratio is
      ruled out as the change fail rate because that definition belongs to the deployment rework rate, while change
      fail rate is the ratio of deployments that require immediate intervention.'
  citation: dora-metrics#throughput; dora-metrics#instability; dora-metrics#by-nathen-harvey
  extract:
    en: 'DORA uses three factors to measure software delivery throughput:'
