# anchor: fuente-ms-word-sobres-html
- id: m02-l08-q293
  prompt:
    es: "En Word 365, ¿dónde coloca Word el sobre cuando se selecciona Agregar al documento en el cuadro Sobres?"
  options:
  - id: a
    correct: true
    text:
      es: "En el documento actual, como Página 1"
  - id: b
    text:
      es: "En un documento nuevo e independiente"
  - id: c
    text:
      es: "Al final del documento actual, como última página"
  - id: d
    text:
      es: "En el encabezado de todas las páginas del documento"
  explanation:
    es: "La página dice que Word agrega el sobre al documento actual como Página 1, y que el resto del documento puede usarse para escribir la correspondencia que se almacena con el sobre. Un documento nuevo e independiente contradice la página, que habla del documento actual. Al final del documento contradice que sea la Página 1. El encabezado de las páginas no interviene: el sobre ocupa la página 1."
  citation: "fuente: `ms-word-sobres.html`; «Crear e imprimir un solo sobre en Word»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-sobres-html
- id: m02-l08-q294
  prompt:
    es: "¿Cuál de los siguientes botones del cuadro Sobres de Word 365 permite usar una dirección de la libreta de direcciones electrónica instalada en el equipo?"
  options:
  - id: a
    text:
      es: "Agregar al documento"
  - id: b
    text:
      es: "Propiedades de envío electrónico"
  - id: c
    text:
      es: "Opciones"
  - id: d
    correct: true
    text:
      es: "Insertar de dirección"
  explanation:
    es: "La página dice que, para usar una dirección de la libreta de direcciones electrónica instalada en el equipo, se selecciona Insertar de dirección. Agregar al documento guarda el sobre en el documento para volver a usarlo. Propiedades de envío electrónico establece opciones para los programas de envío electrónico instalados. Opciones abre el cuadro de opciones del sobre, con el tamaño del sobre y las opciones de impresión."
  citation: "fuente: `ms-word-sobres.html`; «Crear e imprimir un solo sobre en Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-origenes-datos-html
- id: m02-l08-q295
  prompt:
    es: "En Word 365, si el origen de datos de una combinación de correspondencia es una base de datos de Access, ¿qué datos pueden seleccionarse, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Solo los de las tablas de la base de datos, no los de las consultas"
  - id: b
    text:
      es: "Solo los de los formularios y los informes definidos en la base de datos"
  - id: c
    text:
      es: "Solo los de una única tabla elegida en la base de datos"
  - id: d
    correct: true
    text:
      es: "Los de cualquier tabla o consulta definida en la base de datos"
  explanation:
    es: "La página dice que con Access se pueden seleccionar datos de cualquier tabla o consulta definida en la base de datos. Limitarse a las tablas contradice que también valgan las consultas. Los formularios y los informes no son tablas ni consultas, que son los orígenes que da la página. Limitarse a una única tabla contradice que sirva cualquier tabla."
  citation: "fuente: `ms-word-origenes-datos.html`; «Orígenes de datos que puede usar para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-origenes-datos-html
- id: m02-l08-q296
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones se elige para usar la lista de contactos de Outlook como origen de datos de una combinación de correspondencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Elegir de los contactos de Outlook"
  - id: b
    text:
      es: "Usar una lista existente en Word"
  - id: c
    text:
      es: "Escribir una lista nueva en Word"
  - id: d
    text:
      es: "Nuevo origen con el asistente"
  explanation:
    es: "La página dice que, para usar la lista de contactos de Outlook como origen de datos, se elige «elegir de los contactos de Outlook». Usar una lista existente es la opción para una hoja de Excel, una base de datos de Access u otro tipo de base de datos. Escribir una lista nueva es la opción cuando aún no hay un origen de datos. Nuevo origen abre el Asistente para la conexión de datos, que sirve para otros archivos de base de datos."
  citation: "fuente: `ms-word-origenes-datos.html`; «Orígenes de datos que puede usar para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-notas-html
- id: m02-l08-q038
  prompt:
    es: "En Word 365, las notas al pie que se insertan desde la pestaña Referencias aparecen:"
  options:
  - id: a
    correct: true
    text:
      es: "en la parte inferior de la página."
  - id: b
    text:
      es: "al final del documento y no en cada página."
  - id: c
    text:
      es: "en la parte superior de la página."
  - id: d
    text:
      es: "en un panel lateral junto al texto."
  explanation:
    es: "La página dice: «Las notas al pie aparecen en la parte inferior de la página». «Al final del documento» es donde se muestran las notas al final, que según la misma frase son otra cosa. «En la parte superior de la página» cambia la posición que fija la página. La página no sitúa ninguna nota en un panel lateral: solo habla de la parte inferior de la página y del final del documento."
  citation: "fuente: `ms-word-notas.html`; «Las notas al pie aparecen en la parte inferior de la página y las notas al final se muestran al final del documento.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-atajos-html
- id: m02-l08-q039
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado pasa a la celda anterior de la fila de una tabla y selecciona su contenido?"
  options:
  - id: a
    text:
      es: "Tab"
  - id: b
    text:
      es: "Alt+Fin"
  - id: c
    correct: true
    text:
      es: "Mayús+Tab"
  - id: d
    text:
      es: "Alt+Inicio"
  explanation:
    es: "La tabla de desplazamiento dice: «Ir a la celda anterior de la fila y seleccionar su contenido. Mayús+TAB». Tab pasa a la celda siguiente de la fila y selecciona su contenido. Alt+Fin va a la última celda de la fila. Alt+Inicio va a la primera celda de la fila."
  citation: "fuente: `ms-word-atajos.html`; «Ir a la celda anterior de la fila y seleccionar su contenido.»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-salto-seccion-html
- id: m02-l08-q040
  prompt:
    es: "Señale qué hace en Word 365 un salto de sección de tipo Página impar al insertarlo en el documento:"
  options:
  - id: a
    text:
      es: "Inicia la nueva sección en la misma página."
  - id: b
    text:
      es: "Inicia la nueva sección en la siguiente página par."
  - id: c
    text:
      es: "Inicia la nueva sección en la página siguiente."
  - id: d
    correct: true
    text:
      es: "Inicia la nueva sección en la siguiente página impar."
  explanation:
    es: "La página dice del salto Página impar: «inicia una nueva sección en la siguiente página impar». Continuo es el que inicia la nueva sección en la misma página. Página par la inicia en la siguiente página par. Página siguiente la inicia en la página siguiente."
  citation: "fuente: `ms-word-salto-seccion.html`; «El salto de sección inicia una nueva sección en la siguiente página impar.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-salto-seccion-html
- id: m02-l08-q042
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones indica dónde inicia la nueva sección un salto de sección de tipo Página siguiente?"
  options:
  - id: a
    text:
      es: "En la misma página que el salto."
  - id: b
    text:
      es: "En la siguiente página impar."
  - id: c
    text:
      es: "En la siguiente página par."
  - id: d
    correct: true
    text:
      es: "En la página siguiente al salto."
  explanation:
    es: "La página dice del salto Página siguiente: «inicia la nueva sección en la página siguiente». Continuo la inicia en la misma página. Página impar la inicia en la siguiente página impar y Página par, en la siguiente página par."
  citation: "fuente: `ms-word-salto-seccion.html`; «El salto de sección inicia la nueva sección en la página siguiente.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-tabla-contenido-html
- id: m02-l08-q087
  prompt:
    es: "Según la página de Microsoft, una tabla de contenido de Word 365 se basa en:"
  options:
  - id: a
    text:
      es: "Las entradas marcadas con campos XE"
  - id: b
    text:
      es: "Las notas al pie y al final"
  - id: c
    text:
      es: "Los campos de combinación del documento principal"
  - id: d
    correct: true
    text:
      es: "Los títulos del documento"
  explanation:
    es: "La página abre con la frase: «Una tabla de contenido en Word se basa en los títulos del documento». Los campos XE son las entradas marcadas de un índice. Las notas al pie y al final son otra cosa: se muestran en la página y al final del documento. Los campos de combinación indican dónde va la información del origen de datos."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Crear una tabla de contenido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-tabla-contenido-html
- id: m02-l08-q088
  prompt:
    es: "En Word 365, ¿qué hay que hacer con un texto para que aparezca en la tabla de contenido?"
  options:
  - id: a
    correct: true
    text:
      es: "Aplicarle un estilo de título, como Título 1"
  - id: b
    text:
      es: "Marcarlo como entrada con Marcar entrada"
  - id: c
    text:
      es: "Insertarle una nota al final del documento"
  - id: d
    text:
      es: "Insertarlo como campo de combinación de datos"
  explanation:
    es: "La página dice: «Para cada título que desee en la tabla de contenido, seleccione el texto del título, vaya a Inicio › Estilos y elija Título 1, 2 o 3». Marcar entrada sirve para el índice, con el campo XE. Insertar nota al final crea una nota al final del documento. Los campos de combinación llevan información del origen de datos."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Agregar estilos de título»"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: fuente-ms-word-tabla-contenido-html
- id: m02-l08-q089
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas de la cinta inserta una tabla de contenido automática?"
  options:
  - id: a
    text:
      es: "Insertar › Tablas › Tabla de contenido"
  - id: b
    text:
      es: "Inicio › Estilos › Tabla de contenido"
  - id: c
    text:
      es: "Revisar › Revisión › Tabla de contenido"
  - id: d
    correct: true
    text:
      es: "Referencias › Tabla de contenido"
  explanation:
    es: "La página dice: «Vaya a Referencias › Tabla de contenido y elija Tabla automática 1 o Tabla automática 2, o elija Tabla de contenido personalizada para crear su propio estilo». La página llega a Tabla de contenido desde Referencias, no desde Insertar. La página llega a Tabla de contenido desde Referencias, no desde Inicio. La página llega a Tabla de contenido desde Referencias, no desde Revisar."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Crear la tabla de contenido»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tabla-contenido-html
- id: m02-l08-q090
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Tabla de contenido permite crear un estilo propio?"
  options:
  - id: a
    text:
      es: "Tabla automática 1, ya preparada"
  - id: b
    correct: true
    text:
      es: "Tabla de contenido personalizada"
  - id: c
    text:
      es: "Tabla automática 2, ya preparada"
  - id: d
    text:
      es: "Actualizar campo de la tabla"
  explanation:
    es: "La página dice: «elija Tabla de contenido personalizada para crear su propio estilo». Tabla automática 1 y Tabla automática 2 son las dos opciones que la misma frase da como estilos ya preparados, por contraste con crear uno propio. Y Actualizar campo no crea ningún estilo: la página lo usa, con clic derecho en la tabla, para actualizarla cuando los cambios en el documento la afectan."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Crear la tabla de contenido»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tabla-contenido-html
- id: m02-l08-q091
  prompt:
    es: "Tras hacer cambios que afectan a la tabla de contenido de Word 365, ¿cómo se actualiza esta?"
  options:
  - id: a
    text:
      es: "Con Ctrl+F9, con el cursor en la tabla de contenido"
  - id: b
    text:
      es: "Con Mayús+F9, con el cursor en la tabla de contenido"
  - id: c
    correct: true
    text:
      es: "Con clic derecho en la tabla y Actualizar campo"
  - id: d
    text:
      es: "Con F11, con el cursor en la tabla de contenido"
  explanation:
    es: "La página dice: «actualice la tabla de contenido haciendo clic con el botón derecho en la tabla de contenido y seleccionando Actualizar campo». Ctrl+F9 inserta un campo vacío. Mayús+F9 cambia entre un código de campo y su resultado. F11 va al campo siguiente."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Crear la tabla de contenido»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q092
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas de la cinta inserta el índice una vez marcadas las entradas?"
  options:
  - id: a
    text:
      es: "Referencias › Marcar entrada"
  - id: b
    correct: true
    text:
      es: "Referencias › Insertar índice"
  - id: c
    text:
      es: "Insertar › Índice"
  - id: d
    text:
      es: "Referencias › Tabla de contenido"
  explanation:
    es: "La página dice: «Vaya a Referencias › Insertar índice». Marcar entrada marca una entrada concreta, no inserta el índice. La página lleva a Insertar índice desde Referencias. Tabla de contenido inserta la tabla de contenido."
  citation: "fuente: `ms-word-indice.html`; «Crear el índice»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q093
  prompt:
    es: "Al marcar una entrada de índice en Word 365, ¿cuál de los siguientes campos especiales agrega Word al texto?"
  options:
  - id: a
    text:
      es: "Un campo PÁGINA"
  - id: b
    text:
      es: "Un campo FECHA"
  - id: c
    correct: true
    text:
      es: "Un campo XE, de entrada de índice"
  - id: d
    text:
      es: "Un campo LISTNUM"
  explanation:
    es: "La página dice que Word agrega «un campo XE (entrada de índice) especial». El campo PÁGINA es el que se inserta con Alt+Mayús+P, no el de entrada de índice. El campo FECHA inserta la fecha. El campo LISTNUM es otro campo, que se inserta con Ctrl+Alt+L."
  citation: "fuente: `ms-word-indice.html`; «Marcar las entradas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q094
  prompt:
    es: "En el cuadro Marcar entrada de índice de Word 365, ¿cuál de los siguientes botones marca el texto en cualquier lugar del documento?"
  options:
  - id: a
    correct: true
    text:
      es: "Marcar todo"
  - id: b
    text:
      es: "Marcar"
  - id: c
    text:
      es: "Subentrada"
  - id: d
    text:
      es: "Referencia cruzada"
  explanation:
    es: "La página dice: «Para marcar este texto en cualquier lugar del documento, seleccione Marcar todo». Marcar marca la entrada seleccionada; Marcar todo la marca en cualquier lugar del documento. Subentrada es el cuadro donde se agrega un segundo nivel. Referencia cruzada se elige en Opciones para remitir a otra entrada."
  citation: "fuente: `ms-word-indice.html`; «Marcar las entradas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q095
  prompt:
    es: "En Word 365, ¿cuál de las siguientes teclas actualiza el índice con el cursor sobre él?"
  options:
  - id: a
    text:
      es: "Mayús+F9"
  - id: b
    text:
      es: "Ctrl+F9"
  - id: c
    correct: true
    text:
      es: "F9"
  - id: d
    text:
      es: "F11"
  explanation:
    es: "La página dice: «Para actualizar el índice, haga clic en el índice y, a continuación, presione F9». Mayús+F9 cambia entre un código de campo y su resultado. Ctrl+F9 inserta un campo vacío. F11 va al campo siguiente."
  citation: "fuente: `ms-word-indice.html`; «Editar o dar formato a una entrada de índice y actualizar el índice»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q097
  prompt:
    es: "Para eliminar una entrada de índice en Word 365, ¿qué hay que seleccionar antes de presionar suprimir?"
  options:
  - id: a
    text:
      es: "Solo el texto entre comillas del campo de la entrada"
  - id: b
    text:
      es: "Solo la palabra marcada en el cuerpo del documento"
  - id: c
    text:
      es: "El número de página que aparece en el índice terminado"
  - id: d
    correct: true
    text:
      es: "Todo el campo de entrada de índice, llaves incluidas"
  explanation:
    es: "La página dice: «Seleccione todo el campo de entrada de índice, incluidas las llaves ({}) y, después, presione suprimir». Seleccionar solo el texto entre comillas sirve para otra operación: la página dice que para editar o dar formato a una entrada se cambia ese texto. Seleccionar solo la palabra marcada deja el campo XE sin tocar: la página explica que Word agrega un campo XE aparte al marcar el texto. Y el número de página del índice terminado no es lo que se borra: la página trata el índice como algo que se actualiza con F9 tras cambiar la entrada."
  citation: "fuente: `ms-word-indice.html`; «Eliminar una entrada de índice y actualizar el índice»"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q098
  prompt:
    es: "Según la página de Microsoft, al crear el índice Word 365 ordena las entradas y quita las duplicadas. ¿Cómo las ordena?"
  options:
  - id: a
    correct: true
    text:
      es: "Alfabéticamente"
  - id: b
    text:
      es: "Por orden de aparición en el documento"
  - id: c
    text:
      es: "Por número de página, de menor a mayor"
  - id: d
    text:
      es: "Por nivel, de la subentrada a la entrada principal"
  explanation:
    es: "La página dice que Word «recopila las entradas de índice, las ordena alfabéticamente, hace referencia a sus números de página, busca y quita entradas duplicadas de la misma página». El orden de aparición en el documento y el número de página de menor a mayor no son el criterio de la frase: los números de página son lo que el índice referencia, no por lo que ordena. Y el nivel de subentrada a entrada principal tampoco: la subentrada es un segundo nivel que se añade dentro de una entrada, no un criterio de orden."
  citation: "fuente: `ms-word-indice.html`; «Marcar las entradas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-notas-html
- id: m02-l08-q099
  prompt:
    es: "En Word 365, ¿cuál de las siguientes pestañas de la cinta inserta una nota al pie o una nota al final?"
  options:
  - id: a
    text:
      es: "Inicio"
  - id: b
    correct: true
    text:
      es: "Referencias"
  - id: c
    text:
      es: "Insertar"
  - id: d
    text:
      es: "Revisar"
  explanation:
    es: "La página dice: «En la pestaña Referencias, haga clic en Insertar nota al pie o Insertar nota al final». Inicio es la pestaña de los estilos de título en la página de la tabla de contenido y de Mostrar u ocultar en la del índice. Insertar es donde la página de capturas de pantalla sitúa Captura de pantalla. Y Revisar es donde otra página de la formación sitúa Lectura en voz alta. Ninguna es la que la página de notas indica."
  citation: "fuente: `ms-word-notas.html`; «Insertar notas al pie y notas al final en Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m02-l08-q100
  prompt:
    es: "En Word 365, ¿qué indica el anclaje de una imagen con un ajuste de texto distinto de En línea con el texto?"
  options:
  - id: a
    text:
      es: "La página en la que se imprimirá la imagen"
  - id: b
    correct: true
    text:
      es: "El párrafo al que está asociada la imagen"
  - id: c
    text:
      es: "El tamaño original de la imagen insertada"
  - id: d
    text:
      es: "El estilo de ajuste que se aplicó a la imagen"
  explanation:
    es: "La página dice que, con los ajustes distintos de En línea con el texto, «se anclan a una ubicación específica del documento; el anclaje indica el párrafo al que está asociado el objeto». La página en la que se imprime no es esa ubicación: el anclaje se asocia a un párrafo. El tamaño original de la imagen no tiene que ver con el anclaje, que habla de la posición en el texto. Y el estilo de ajuste es lo que decide si hay anclaje (En línea con el texto no lo tiene), no lo que el anclaje indica."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m02-l08-q101
