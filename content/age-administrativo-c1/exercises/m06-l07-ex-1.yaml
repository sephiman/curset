# anchor: fuente-ms-outlook-agregar-cuenta-html
- id: m06-l07-q002
  prompt:
    es: "En Outlook 365, ¿qué se muestra al abrir Outlook si nunca se había abierto antes, según los pasos para agregar una cuenta?"
  options:
  - id: a
    correct: true
    text:
      es: "La pantalla principal, para escribir la dirección y seleccionar Conectar."
  - id: b
    text:
      es: "La ventana Delegar el acceso, donde se agrega a la persona que lo usará."
  - id: c
    text:
      es: "El Centro de confianza, donde se elige el certificado para cifrar los mensajes."
  - id: d
    text:
      es: "El panel de carpetas, con el nodo Compartido conmigo ya desplegado."
  explanation:
    es: "Los pasos dicen que, si nunca se abrió Outlook, se muestra la pantalla principal: se escribe la dirección de correo y se selecciona Conectar. El Centro de confianza es donde Outlook clásico configura el cifrado S/MIME. Delegar el acceso sirve para conceder acceso delegado, no para agregar la propia cuenta. Compartido conmigo es el nodo donde el invitado agrega carpetas que otros comparten con él."
  citation: "fuente: `ms-outlook-agregar-cuenta.html`; «Agregar una cuenta de correo electrónico»"
  difficulty: 1
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-outlook-agregar-cuenta-html
- id: m06-l07-q003
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes rutas se usa para agregar una cuenta de correo electrónico a Outlook?"
  options:
  - id: a
    text:
      es: "Archivo › Configuración de la cuenta › Delegar el acceso"
  - id: b
    correct: true
    text:
      es: "Archivo › Agregar cuenta"
  - id: c
    text:
      es: "Configuración › Correo › S/MIME"
  - id: d
    text:
      es: "Archivo › Opciones › Centro de confianza"
  explanation:
    es: "La página de inicio rápido indica abrir Outlook y seleccionar Archivo › Agregar cuenta. Delegar el acceso concede a otra persona acceso delegado al buzón. Archivo › Opciones › Centro de confianza lleva a la configuración de seguridad, como el cifrado S/MIME de Outlook clásico. Configuración › Correo › S/MIME es la ruta del nuevo Outlook para cifrar o firmar todos los mensajes."
  citation: "fuente: `ms-outlook-agregar-cuenta.html`; «Agregar una cuenta de correo electrónico»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-agregar-cuenta-html
- id: m06-l07-q004
  prompt:
    es: "En Outlook 365, al agregar una cuenta de correo, ¿qué se hace si la pantalla tiene un aspecto distinto de la pantalla principal?"
  options:
  - id: a
    text:
      es: "Se escriben el nombre, la dirección de correo y la contraseña, y se selecciona Conectar."
  - id: b
    text:
      es: "Se escriben solo la dirección de correo electrónico y la contraseña, y se selecciona Finalizar."
  - id: c
    correct: true
    text:
      es: "Se escriben el nombre, la dirección de correo y la contraseña, y se selecciona Siguiente."
  - id: d
    text:
      es: "Se escriben los servidores de correo entrante y saliente, y se selecciona Aceptar."
  explanation:
    es: "Los pasos dicen que, si la pantalla tiene un aspecto distinto, se escriben el nombre, la dirección de correo y la contraseña y después se selecciona Siguiente. Conectar es el botón de la pantalla principal, donde solo se escribe la dirección. Finalizar es el último paso, no el que sigue a esos datos, y la opción omite el nombre. Los nombres de los servidores no forman parte de estos pasos."
  citation: "fuente: `ms-outlook-agregar-cuenta.html`; «Agregar una cuenta de correo electrónico»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m06-l07-q005
  prompt:
    es: "¿Cuál de las siguientes describe la forma de una dirección de correo electrónico de Internet según el RFC 5322?"
  options:
  - id: a
    text:
      es: "El nombre del destinatario entre paréntesis, el signo @ y un dominio."
  - id: b
    text:
      es: "Una cadena que se interpreta localmente, un punto y un dominio de Internet."
  - id: c
    text:
      es: "Un dominio de Internet, el signo @ y una cadena que se interpreta localmente."
  - id: d
    correct: true
    text:
      es: "Una cadena que se interpreta localmente, el signo @ y después un dominio de Internet."
  explanation:
    es: "El RFC 5322 define la dirección como una cadena interpretada localmente, seguida del signo @ y de un dominio de Internet. La opción que pone el dominio delante invierte el orden de la norma. La que cambia el @ por un punto quita el carácter que separa las dos partes. El nombre del destinatario entre paréntesis es una forma antigua de comentario que el RFC desaconseja, y no sustituye a la parte local."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «3.4.1. Addr-Spec Specification»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m06-l07-q006
  prompt:
    es: "Según el RFC 5322, ¿qué identifica la parte de una dirección de correo electrónico que va detrás del signo @?"
  options:
  - id: a
    text:
      es: "El nombre de un buzón concreto, que se interpreta en el host de destino."
  - id: b
    correct: true
    text:
      es: "El punto al que se entrega el correo, por ejemplo un nombre de dominio de Internet."
  - id: c
    text:
      es: "El grupo de destinatarios al que pertenece el buzón, sin sus direcciones."
  - id: d
    text:
      es: "El nombre para mostrar del destinatario, que ve el usuario del programa."
  explanation:
    es: "El RFC dice que la parte del dominio identifica el punto al que se entrega el correo; en la forma de átomos con puntos se interpreta como un nombre de dominio de Internet. El nombre de un buzón interpretado en el host es la parte local, la que va delante del @. El nombre para mostrar es opcional y va fuera de la dirección. El grupo es otra construcción del RFC, un nombre seguido de una lista de buzones."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «3.4.1. Addr-Spec Specification»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m06-l07-q007
  prompt:
    es: "Señale la afirmación correcta sobre la parte local de una dirección de correo electrónico, la que va delante del signo @, según el RFC 5322:"
  options:
  - id: a
    correct: true
    text:
      es: "Depende del dominio y el host la interpreta como el nombre de un buzón concreto."
  - id: b
    text:
      es: "No depende del dominio y todos los hosts la interpretan siempre del mismo modo."
  - id: c
    text:
      es: "Se escribe siempre entre comillas dobles, aunque solo tenga letras y puntos."
  - id: d
    text:
      es: "Identifica el punto al que se entrega el correo, como un nombre de host."
  explanation:
    es: "El RFC llama a la parte local una cadena que depende del dominio y que el host interpreta como el nombre de un buzón concreto. Decir que no depende del dominio invierte la norma. El punto de entrega es lo que identifica el dominio, no la parte local. Las comillas no son obligatorias: el RFC indica que, si la cadena solo tiene caracteres permitidos y puntos, debería usarse la forma sin comillas y no la entrecomillada."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «3.4.1. Addr-Spec Specification»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m06-l07-q008
  prompt:
    es: "Según el RFC 5322, cuando un buzón se escribe con el nombre para mostrar del destinatario, la dirección de correo va:"
  options:
  - id: a
    text:
      es: "entre corchetes ([ y ]), delante del nombre para mostrar."
  - id: b
    text:
      es: "entre comillas dobles, delante del nombre para mostrar."
  - id: c
    correct: true
    text:
      es: "entre los signos menor que y mayor que (< y >), detrás del nombre."
  - id: d
    text:
      es: "separada del nombre para mostrar por dos puntos y terminada en punto y coma."
  explanation:
    es: "El RFC describe el buzón con dos partes: un nombre para mostrar opcional y la dirección entre los signos < y >. Los dos puntos y el punto y coma son la sintaxis del grupo, que reúne varios buzones bajo un nombre. Los corchetes encierran el literal de dominio, una forma de la parte del dominio. Las comillas dobles marcan una cadena entrecomillada de la parte local, no la dirección entera."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «3.4. Address Specification»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m06-l07-q009
  prompt:
    es: "Según el RFC 5322, si la parte local de una dirección solo tiene caracteres permitidos y puntos entre ellos, ¿qué forma indica que debería usarse?"
  options:
  - id: a
    text:
      es: "Entre comillas dobles, como cadena entrecomillada."
  - id: b
    text:
      es: "Entre los signos < y >, sin la parte del dominio."
  - id: c
    correct: true
    text:
      es: "Sin comillas, como átomos separados por puntos."
  - id: d
    text:
      es: "Entre corchetes, como un literal de dominio."
  explanation:
    es: "El RFC dice que, si la cadena puede escribirse como átomos con puntos, debería usarse esa forma y no debería usarse la cadena entrecomillada. Las comillas dobles son justo la forma que el RFC desaconseja en ese caso. Los signos < y > encierran la dirección completa cuando lleva nombre para mostrar. Los corchetes son el literal de dominio, que va detrás del @."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «3.4.1. Addr-Spec Specification»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q010
  prompt:
    es: "¿Cuál de los siguientes métodos de acceso al correo electrónico recomienda Microsoft para consultar el correo desde varios dispositivos, como un teléfono, un portátil y una tableta?"
  options:
  - id: a
    text:
      es: "SMTP"
  - id: b
    text:
      es: "S/MIME"
  - id: c
    text:
      es: "POP"
  - id: d
    correct: true
    text:
      es: "IMAP"
  explanation:
    es: "La página dice que IMAP es el método recomendado para comprobar el correo desde varios dispositivos. POP descarga los mensajes y los elimina del servicio, así que después solo se leen en el mismo equipo. SMTP es el servidor de correo saliente. S/MIME cifra y firma mensajes, no es un método de acceso al buzón."
  citation: "fuente: `ms-outlook-imap-pop.html`; «¿Qué son IMAP y POP?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q011
  prompt:
    es: "Señale la afirmación correcta sobre los mensajes que se descargan al PC mediante POP, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "Se quedan en el servicio de correo y se leen desde cualquier dispositivo."
  - id: b
    correct: true
    text:
      es: "Se eliminan del servicio de correo y solo se leen desde el mismo equipo."
  - id: c
    text:
      es: "Se guardan en el servidor de correo saliente y se borran del equipo."
  - id: d
    text:
      es: "Se descargan solo al hacer clic en ellos, sin los datos adjuntos."
  explanation:
    es: "La página dice que POP descarga los mensajes nuevos y que, una vez descargados, se eliminan del servicio de correo; después solo se accede a ellos con el mismo equipo. Quedarse en el servicio y leerse desde cualquier dispositivo es lo que hace IMAP. Descargar solo al hacer clic, sin adjuntos, también es IMAP. El servidor saliente (SMTP) envía el correo, no guarda los mensajes descargados."
  citation: "fuente: `ms-outlook-imap-pop.html`; «POP»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q012
  prompt:
    es: "Cuando se lee un mensaje mediante IMAP, ¿dónde se está leyendo realmente, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "En el servicio de correo, sin descargarlo ni guardarlo en el equipo."
  - id: b
    text:
      es: "En el equipo, después de descargarlo y eliminarlo del servicio de correo."
  - id: c
    text:
      es: "En una copia local que se sincroniza con el servicio al cerrar Outlook."
  - id: d
    text:
      es: "En el servidor de correo saliente, que lo guarda hasta que se responde."
  explanation:
    es: "La página explica que con IMAP el mensaje no se descarga ni se almacena en el equipo: se lee en el servicio de correo electrónico. Descargarlo y eliminarlo del servicio es lo que hace POP. El servidor saliente es el de SMTP, que envía el correo. La copia local sincronizada al cerrar contradice la página, que dice que el mensaje no se descarga."
  citation: "fuente: `ms-outlook-imap-pop.html`; «IMAP»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q013
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre IMAP y los datos adjuntos es correcta, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Descarga automáticamente los adjuntos de cada mensaje nuevo, aunque el mensaje no se abra nunca."
  - id: b
    text:
      es: "Descarga los mensajes y los adjuntos al iniciar Outlook, antes de que se abran."
  - id: c
    correct: true
    text:
      es: "Solo descarga un mensaje al hacer clic en él y no descarga los adjuntos automáticamente."
  - id: d
    text:
      es: "Descarga todos los mensajes nuevos con sus adjuntos y después los borra del servicio."
  explanation:
    es: "La página dice que IMAP solo descarga un mensaje cuando se hace clic en él y que los adjuntos no se descargan automáticamente; por eso se comprueba el correo más rápido que con POP. Descargar todo lo nuevo y borrarlo del servicio describe POP. Las otras dos opciones contradicen la frase de la página: ni los adjuntos se descargan solos ni los mensajes se descargan antes de abrirlos."
  citation: "fuente: `ms-outlook-imap-pop.html`; «IMAP»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q014
  prompt:
    es: "Con una cuenta de correo configurada con POP, ¿dónde se almacena el correo enviado, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "En el servicio de correo y en todos los dispositivos de la cuenta."
  - id: b
    correct: true
    text:
      es: "Localmente, en el PC o Mac, y no en el servidor de correo."
  - id: c
    text:
      es: "En el servidor de correo saliente, hasta que se descarga."
  - id: d
    text:
      es: "En el servidor de correo, en la carpeta de elementos enviados."
  explanation:
    es: "La página dice que con POP el correo enviado se almacena localmente en el PC o Mac, no en el servidor de correo electrónico. Las dos opciones que lo dejan en un servidor contradicen esa frase. Tenerlo en el servicio y en todos los dispositivos es lo propio de IMAP, que deja los mensajes en el servicio de correo."
  citation: "fuente: `ms-outlook-imap-pop.html`; «POP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q015
  prompt:
    es: "¿Cuál de los siguientes protocolos corresponde al servidor de correo saliente cuyo nombre da el proveedor al configurar una cuenta de correo?"
  options:
  - id: a
    correct: true
    text:
      es: "SMTP"
  - id: b
    text:
      es: "POP"
  - id: c
    text:
      es: "IMAP"
  - id: d
    text:
      es: "S/MIME"
  explanation:
    es: "La página da los tres nombres de servidor que suele facilitar el proveedor: el entrante IMAP, el entrante POP y el de correo saliente, SMTP. IMAP y POP son los dos servidores de correo entrante. S/MIME es un estándar para cifrar y firmar mensajes, no un servidor."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Agregar cuentas de correo web a aplicaciones de correo electrónico como Outlook clásico, Apple Mail y Spark»"
  difficulty: 1
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q016
  prompt:
    es: "Según la ayuda de Microsoft, si una aplicación de correo tiene dificultades para agregar una cuenta de correo electrónico, ¿cuál es normalmente la causa?"
  options:
  - id: a
    text:
      es: "Que la cuenta de correo electrónico pertenece a un grupo de Microsoft 365."
  - id: b
    text:
      es: "Que la cuenta de correo electrónico está configurada para el acceso IMAP."
  - id: c
    text:
      es: "Que la cuenta de correo electrónico no tiene un certificado S/MIME."
  - id: d
    correct: true
    text:
      es: "Que la cuenta de correo electrónico está configurada para el acceso POP."
  explanation:
    es: "La página dice que esas dificultades se deben normalmente a que la cuenta está configurada para el acceso POP; entonces hay que pedir al proveedor el nombre de sus servidores POP y SMTP. IMAP es el acceso que la aplicación intenta configurar sola, sin que el usuario intervenga. El certificado S/MIME sirve para cifrar, y pertenecer a un grupo no aparece como causa en la página."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Agregar cuentas de correo web a aplicaciones de correo electrónico como Outlook clásico, Apple Mail y Spark»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q017
  prompt:
    es: "Según la ayuda de Microsoft, al agregar una cuenta de correo electrónico a una aplicación de correo, la aplicación intenta por lo general configurarla:"
  options:
  - id: a
    correct: true
    text:
      es: "con acceso IMAP, sin ninguna entrada del usuario."
  - id: b
    text:
      es: "con acceso IMAP, tras pedir el servidor SMTP al usuario."
  - id: c
    text:
      es: "con acceso POP, tras pedir el servidor POP al usuario."
  - id: d
    text:
      es: "con acceso POP, sin ninguna entrada del usuario."
  explanation:
    es: "La página dice que la aplicación intentará por lo general configurar la cuenta con acceso IMAP, sin ninguna entrada del usuario. Las opciones con POP cambian el método de acceso. Pedir el nombre de un servidor es lo que toca cuando la cuenta está configurada para POP y la aplicación tiene dificultades, no el comportamiento general."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Agregar cuentas de correo web a aplicaciones de correo electrónico como Outlook clásico, Apple Mail y Spark»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q018
  prompt:
    es: "Según la ayuda de Microsoft, cuando la cuenta de correo está configurada para el acceso POP, ¿cuál de los siguientes datos hay que pedir al proveedor?"
  options:
  - id: a
    text:
      es: "El nombre de su servidor IMAP y el de su servidor POP."
  - id: b
    text:
      es: "El certificado del destinatario y su clave privada."
  - id: c
    text:
      es: "La dirección de correo del grupo y su alias en Outlook."
  - id: d
    correct: true
    text:
      es: "El nombre de su servidor POP y el nombre de su servidor SMTP."
  explanation:
    es: "La página dice que, si la cuenta está configurada para el acceso POP, hay que averiguar con el proveedor el nombre de su servidor POP y SMTP para escribirlo en la aplicación. La pareja IMAP y POP junta dos servidores de entrada y deja fuera el de salida. El certificado y la clave privada pertenecen al cifrado S/MIME. La dirección y el alias de un grupo no intervienen en la configuración de la cuenta."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Agregar cuentas de correo web a aplicaciones de correo electrónico como Outlook clásico, Apple Mail y Spark»"
  difficulty: 2
  tags:
  - "configuración"
  - "requisito"
# anchor: fuente-ms-outlook-imap-pop-html
- id: m06-l07-q019
  prompt:
    es: "Según la ayuda de Microsoft, ¿cuál de los siguientes es una aplicación de correo electrónico instalada en el equipo y no una cuenta de correo web?"
  options:
  - id: a
    text:
      es: "Hotmail.com"
  - id: b
    correct: true
    text:
      es: "Apple Mail"
  - id: c
    text:
      es: "Gmail"
  - id: d
    text:
      es: "Outlook.com"
  explanation:
    es: "La página llama aplicaciones de correo electrónico a los programas que se instalan en el equipo para administrar el correo, como Outlook clásico, Apple Mail o Spark. Gmail, Outlook.com y Hotmail.com son los ejemplos que da de correo web, al que se accede por Internet iniciando sesión en la cuenta."
  citation: "fuente: `ms-outlook-imap-pop.html`; «Cuentas de correo web frente a aplicaciones de correo electrónico»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q020
  prompt:
    es: "En Outlook 365, ¿qué necesita el destinatario para abrir un mensaje que se le ha enviado cifrado con S/MIME?"
  options:
  - id: a
    text:
      es: "Leerlo en el nuevo Outlook o en Outlook en la Web, sin certificado."
  - id: b
    text:
      es: "Pertenecer al mismo grupo de Microsoft 365 que el remitente."
  - id: c
    correct: true
    text:
      es: "Desbloquear el mensaje con un certificado que tenga en su equipo."
  - id: d
    text:
      es: "Seguir las instrucciones de un mensaje que recibe por separado."
  explanation:
    es: "La página dice que S/MIME requiere que el destinatario desbloquee el mensaje con un certificado en su equipo. Leerlo directamente en el nuevo Outlook o en Outlook en la Web es lo que la página dice del Cifrado de mensajes de Microsoft Purview. Las instrucciones para abrirlo también son de Purview, cuando el destinatario usa otro servicio de correo. Ser del mismo grupo no figura como requisito."
  citation: "fuente: `ms-outlook-smime.html`; «Elegir el tipo de cifrado que se va a usar»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q021
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes afirmaciones sobre quién puede descifrar un mensaje cifrado es correcta?"
  options:
  - id: a
    text:
      es: "Solo el remitente, con la clave privada que coincide con su propia clave pública."
  - id: b
    text:
      es: "Cualquier destinatario de la organización, aunque no tenga la clave privada correspondiente."
  - id: c
    text:
      es: "Cualquier destinatario que tenga la clave pública con la que se cifró el mensaje."
  - id: d
    correct: true
    text:
      es: "Solo el destinatario con la clave privada que coincide con la clave pública usada."
  explanation:
    es: "La página dice que solo puede descifrar el mensaje el destinatario que tenga la clave privada que coincide con la clave pública usada para cifrarlo; sin ella ve un texto indescifrable. La clave pública cifra, no descifra. El remitente no es quien lee el mensaje cifrado. Un destinatario sin la clave privada correspondiente ve un texto que no puede descifrar, sea o no de la organización."
  citation: "fuente: `ms-outlook-smime.html`; «Enviar correos electrónicos cifrados de S/MIME o Microsoft Purview en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q022
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes rutas de la cinta de un mensaje abre las opciones para cifrar ese único mensaje con S/MIME?"
  options:
  - id: a
    text:
      es: "Configuración › Cuentas › Firmas"
  - id: b
    correct: true
    text:
      es: "Opciones › Más opciones"
  - id: c
    text:
      es: "Archivo › Opciones › Centro de confianza"
  - id: d
    text:
      es: "Mensaje › Firma › Firmas"
  explanation:
    es: "Para un único mensaje en el nuevo Outlook, la página indica seleccionar en la cinta Opciones › Más opciones; en Opciones de mensaje está Cifrar este mensaje (S/MIME). Archivo › Opciones › Centro de confianza es el camino de Outlook clásico para cifrar todos los mensajes salientes. Mensaje › Firma › Firmas y Configuración › Cuentas › Firmas crean firmas de texto, no cifran."
  citation: "fuente: `ms-outlook-smime.html`; «Cifrar un único mensaje y solicitar confirmaciones con S/MIME en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q023
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes rutas permite cifrar el contenido y los datos adjuntos de todos los mensajes que se envían?"
  options:
  - id: a
    correct: true
    text:
      es: "Configuración › Correo › S/MIME"
  - id: b
    text:
      es: "Opciones › Más opciones"
  - id: c
    text:
      es: "Configuración › Cuentas › Firmas"
  - id: d
    text:
      es: "Configuración › Correo › Reglas"
  explanation:
    es: "Para cifrar todos los mensajes, la página indica Configuración › Correo › S/MIME y la opción Cifrar el contenido y los datos adjuntos de todos los mensajes que envío. Opciones › Más opciones actúa sobre el mensaje que se está redactando, no sobre todos. Configuración › Correo › Reglas administra las reglas de mensaje. Configuración › Cuentas › Firmas crea firmas de texto."
  citation: "fuente: `ms-outlook-smime.html`; «Cifrar todos los mensajes con S/MIME en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q024
  prompt:
    es: "En Outlook clásico, en Configuración del Centro de confianza › Seguridad de Email, ¿qué casilla de Correo electrónico cifrado cifra todos los mensajes salientes?"
  options:
  - id: a
    text:
      es: "Agregar firma digital a este mensaje"
  - id: b
    text:
      es: "Solicitar confirmación S/MIME para todos los mensajes firmados S/MIME"
  - id: c
    correct: true
    text:
      es: "Cifrar contenido y datos adjuntos de los mensajes salientes"
  - id: d
    text:
      es: "Firmar digitalmente este mensaje (S/MIME)"
  explanation:
    es: "La página indica activar, en Correo electrónico cifrado, la casilla Cifrar contenido y datos adjuntos de los mensajes salientes. La casilla de confirmación S/MIME para todos los mensajes firmados pide confirmaciones, no cifra. Agregar firma digital a este mensaje está en la configuración de seguridad de un mensaje abierto y firma, no cifra. Firmar digitalmente este mensaje (S/MIME) es la opción de un solo mensaje en el nuevo Outlook y en la web."
  citation: "fuente: `ms-outlook-smime.html`; «Cifrar todos los mensajes salientes con S/MIME en Outlook clásico»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q025
  prompt:
    es: "En el nuevo Outlook para Windows, si en Opciones de mensaje se solicita una confirmación de lectura o de entrega, también hay que activar la casilla:"
  options:
  - id: a
    text:
      es: "Cifrar el contenido y los datos adjuntos de todos los mensajes que envío."
  - id: b
    text:
      es: "Cifrar este mensaje (S/MIME)."
  - id: c
    correct: true
    text:
      es: "Firmar digitalmente este mensaje."
  - id: d
    text:
      es: "Elegir automáticamente el mejor certificado para la firma digital."
  explanation:
    es: "La página advierte que, si se solicita un recibo, también hay que activar la casilla Firmar digitalmente este mensaje; las confirmaciones S/MIME deben incluir una firma digital. Cifrar este mensaje (S/MIME) cifra, pero no es lo que exige el recibo. Las otras dos casillas están en Configuración › Correo › S/MIME y valen para todos los mensajes, no para el que se redacta."
  citation: "fuente: `ms-outlook-smime.html`; «Cifrar un único mensaje y solicitar confirmaciones con S/MIME en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "configuración"
  - "requisito"
# anchor: fuente-ms-outlook-smime-html
- id: m06-l07-q026
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes informaciones devuelve la confirmación cifrada S/MIME que se solicita al enviar un mensaje?"
  options:
  - id: a
    text:
      es: "Que el mensaje se cifró, qué certificado se usó y desde qué equipo."
  - id: b
    correct: true
    text:
      es: "Que el mensaje se recibió sin modificar, quién lo abrió y cuándo."
  - id: c
    text:
      es: "Que el mensaje se entregó, en qué carpeta quedó y su tamaño."
  - id: d
    text:
      es: "Que el destinatario reenvió el mensaje, a quién se lo reenvió y en qué fecha."
  explanation:
    es: "Según la página, la confirmación cifrada confirma que el mensaje se recibió sin modificar e incluye quién lo abrió y cuándo; llega como un mensaje en la bandeja de entrada. El certificado y el equipo, el reenvío o la carpeta y el tamaño no figuran entre los datos que la página atribuye a la confirmación."
  citation: "fuente: `ms-outlook-smime.html`; «Asegúrese de que el mensaje haya llegado sin modificaciones.»"
  difficulty: 2
  tags:
  - "comportamiento"
