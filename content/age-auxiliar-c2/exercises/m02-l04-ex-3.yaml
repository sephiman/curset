# anchor: boe-a-2018-12699-art-1
- id: m02-l04-q100
  prompt:
    es: "Según el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, por accesibilidad se entiende el conjunto de principios y técnicas que se deben respetar al diseñar, construir, mantener y actualizar los sitios web y aplicaciones móviles para garantizar:"
  options:
  - id: a
    text:
      es: "La conservación y la autenticidad de los contenidos publicados."
  - id: b
    text:
      es: "La gratuidad y la universalidad del acceso de los ciudadanos."
  - id: c
    text:
      es: "La interoperabilidad y la seguridad de los datos de los usuarios."
  - id: d
    correct: true
    text:
      es: "La igualdad y la no discriminación en el acceso de las personas usuarias."
  explanation:
    es: "La accesibilidad garantiza la igualdad y la no discriminación en el acceso. La gratuidad, la interoperabilidad y la conservación de contenidos son otros objetivos de la administración electrónica."
  citation: "art. 1.2 RD 1112/2018"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-12699-art-1
- id: m02-l04-q101
  prompt:
    es: "En la definición de accesibilidad de los sitios web del sector público, ¿a qué personas se refiere el texto en particular?"
  options:
  - id: a
    text:
      es: "A los profesionales colegiados y a los notarios."
  - id: b
    correct: true
    text:
      es: "A las personas con discapacidad y a las personas mayores."
  - id: c
    text:
      es: "A las personas jurídicas y a las entidades sin personalidad jurídica."
  - id: d
    text:
      es: "A los empleados públicos y a sus representantes legales."
  explanation:
    es: "La definición protege en particular a las personas con discapacidad y a las personas mayores. Las personas jurídicas, los empleados y los profesionales colegiados son los obligados a relacionarse electrónicamente, pero no el objeto de esta definición."
  citation: "art. 1.2 RD 1112/2018"
  difficulty: 2
  tags:
  - "concepto"
