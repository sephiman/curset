- id: m01-l04-q01
  prompt:
    en: In Spring Framework's default proxy mode, `a()` of a bean calls `this.b()`, and `b()` is annotated `@Transactional`.
      What does the Spring reference say about a transaction for `b()` in that call?
  options:
  - id: a
    text:
      en: The annotation on `b()` is enough to activate the transactional behavior, so a transaction starts
  - id: b
    correct: true
    text:
      en: Self-invocation does not lead to an actual transaction at runtime, even though `b()` is marked `@Transactional`
  - id: c
    text:
      en: The proxy intercepts the call that `a()` makes on its own bean, so a transaction starts for `b()`
  - id: d
    text:
      en: Spring rejects the call with an exception, because self-invocation of an annotated method is not allowed
  explanation:
    en: In proxy mode, self-invocation does not lead to an actual transaction even if the invoked method is marked
      `@Transactional`. The claim that the annotation alone starts a transaction is wrong, because the mere presence
      of `@Transactional` is not enough to activate transactional behavior. The claim that the proxy intercepts
      the call is wrong, because in proxy mode only external method calls coming in through the proxy are intercepted.
      The claim that Spring rejects the call is wrong, because a self invocation through `this` bypasses the advice
      and the call simply proceeds.
  citation: spring-fw-tx-declarative-annotations#using-transactional; spring-fw-aop-proxying#aop-understanding-aop-proxies
  extract:
    en: This means that self-invocation (in effect, a method within the target object calling another method of
      the target object) does not lead to an actual transaction at runtime even if the invoked method is marked
      with @Transactional.
- id: m01-l04-q02
  prompt:
    en: In Java 25, what happens to the common pool returned by `ForkJoinPool.commonPool()` and to its ongoing processing
      when the program calls `System.exit(int)`?
  options:
  - id: a
    text:
      en: The pool waits for its ongoing processing to complete before the program terminates
  - id: b
    text:
      en: The pool keeps running until `shutdownNow()` is called on it
  - id: c
    text:
      en: The pool keeps the program alive, because its worker threads are not daemon threads
  - id: d
    correct: true
    text:
      en: They are automatically terminated
  explanation:
    en: The common pool and any ongoing processing are automatically terminated upon `System.exit(int)`. The claim
      that the pool waits is wrong, because a program that needs asynchronous tasks to complete before termination
      should invoke `commonPool().awaitQuiescence` before exit. The claim that the pool runs until `shutdownNow()`
      is wrong, because its run state is unaffected by attempts to `shutdown()` or `shutdownNow()`. The claim that
      the workers keep the program alive is wrong, because all worker threads are initialized with `Thread.isDaemon()`
      set to true.
  citation: javadoc-forkjoinpool#commonPool(); javadoc-forkjoinpool#class-forkjoinpool
- id: m01-l04-q03
  prompt:
    en: A JDK dynamic proxy handler records each intercepted method name, and the target's `foo()` calls `this.bar()`.
      The list is printed after `pojo.foo()` and printed again, after being cleared, following `pojo.bar()`. What
      is printed?
  options:
  - id: a
    text:
      en: '[foo, bar]

        [bar]'
  - id: b
    text:
      en: '[bar]

        [bar]'
  - id: c
    correct: true
    text:
      en: '[foo]

        [bar]'
  - id: d
    text:
      en: '[foo]

        []'
  explanation:
    en: The first list is `[foo]`, because `this.bar()` inside `foo` is invoked against the target and never reaches
      the handler. The second list is `[bar]`, because the direct call on the proxy is intercepted. The lines [foo,
      bar] [bar] are wrong because the inner call through `this` bypasses the proxy and never reaches the handler.
      The lines [bar] [bar] are wrong because the handler sees the outer call to `foo` made on the proxy. The lines
      [foo] [] are wrong because the call to `bar` made on the proxy is intercepted.
  citation: spring-fw-aop-proxying#aop-understanding-aop-proxies
  extract:
    en: In other words, self invocation via an explicit or implicit this reference will bypass the advice.
  snippet: m01-l04/SelfInvocation.java
- id: m01-l04-q05
  prompt:
    en: The main thread interrupts itself and prints `Thread.interrupted()` twice. It then sleeps while interrupted
      inside a catch block that ignores the exception, and again inside one that calls `interrupt()`. Each catch
      block prints the status. What is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'true

        false

        caught, status false

        caught, status true'
  - id: b
    text:
      en: 'true

        true

        caught, status true

        caught, status true'
  - id: c
    text:
      en: 'true

        false

        caught, status true

        caught, status true'
  - id: d
    text:
      en: 'true

        false

        caught, status false

        caught, status false'
  explanation:
    en: The first call returns `true` and clears the status, so the second returns `false`. The `InterruptedException`
      arrives with the status already cleared, so the catch block that ignores it prints `caught, status false`,
      and the one that calls `interrupt()` again prints `caught, status true`. The output true true caught, status
      true caught, status true is wrong because `Thread.interrupted()` clears the status on the first call. The
      output true false caught, status true caught, status true is wrong because the exception arrives with the
      status already cleared, so the ignoring block sees a cleared status. The output true false caught, status
      false caught, status false is wrong because the second block calls `interrupt()` again and sets the status.
  citation: javadoc-thread#interrupted()
  snippet: m01-l04/InterruptStatus.java
- id: m01-l04-q08
  prompt:
    en: In the Spring Framework reference's programmatic configuration examples for `@Transactional`, what switches
      on actual transaction management at runtime, given that the annotation is merely metadata?
  options:
  - id: a
    text:
      en: The `@Transactional` annotation itself, as soon as the bean is defined
  - id: b
    text:
      en: The `<tx:annotation-driven/>` element placed in the same programmatic configuration
  - id: c
    correct: true
    text:
      en: The `@EnableTransactionManagement` annotation
  - id: d
    text:
      en: A `DataSourceTransactionManager` bean declared in the configuration class and nothing else
  explanation:
    en: In programmatic configuration, the `@EnableTransactionManagement` annotation switches on actual transaction
      management at runtime. The claim that `@Transactional` alone does it is wrong, because the mere presence of
      the annotation is not enough. The claim about `<tx:annotation-driven/>` is wrong, because that element switches
      transactions on in the XML configuration, not in programmatic configuration. The claim about the manager bean
      alone is wrong, because the annotation is what switches transaction management on and then uses a `TransactionManager`
      bean.
  citation: spring-fw-tx-declarative-annotations#using-transactional
  extract:
    en: In the preceding examples that use programmatic configuration, the @EnableTransactionManagement annotation
      switches on actual transaction management at runtime.
- id: m01-l04-q09
  prompt:
    en: In Spring Framework 7 proxy mode, why does the reference advise against relying on `@Transactional` in initialization
      code, such as a `@PostConstruct` method?
  options:
  - id: a
    correct: true
    text:
      en: The proxy must be fully initialized to provide the expected behavior
  - id: b
    text:
      en: Only methods with `public` visibility can be made transactional, for any kind of proxy
  - id: c
    text:
      en: Only `jakarta.transaction.Transactional` is honored there, and Spring's own annotation is ignored
  - id: d
    text:
      en: The annotation applies only to interface definitions and never to methods of a class
  explanation:
    en: 'The reference gives the proxy as the reason: it must be fully initialized to provide the expected behavior.
      The claim that only `public` methods qualify is wrong, because since 6.0 protected or package-visible methods
      can be transactional for class-based proxies by default. The claim that only the jakarta annotation is honored
      is wrong, because `jakarta.transaction.Transactional` is supported as a drop-in replacement for Spring''s
      own annotation, not in place of it. The claim about interface definitions is wrong, because the annotation
      can be applied to a class definition or a method on a class.'
  citation: spring-fw-tx-declarative-annotations#using-transactional
  extract:
    en: the proxy must be fully initialized to provide the expected behavior
- id: m01-l04-q10
  prompt:
    en: A thread whose interrupted status is set calls the static method `Thread.interrupted()`. According to the
      Javadoc, which description of what the method does is correct?
  options:
  - id: a
    text:
      en: It leaves the interrupted status set, so two successive calls both return true
  - id: b
    correct: true
    text:
      en: It clears the interrupted status of the thread as part of testing it
  - id: c
    text:
      en: It tests whether a thread passed to it as an argument has been interrupted
  - id: d
    text:
      en: It sets the interrupted status again after testing it, restoring the value it read
  explanation:
    en: The method clears the interrupted status of the thread as part of testing it. The claim that the status
      stays set is wrong, because the second of two successive calls would return false. The claim that it takes
      a thread as an argument is wrong, because it tests whether the current thread has been interrupted. The claim
      that it restores the status is wrong, because the status is cleared by the method.
  citation: javadoc-thread#interrupted()
