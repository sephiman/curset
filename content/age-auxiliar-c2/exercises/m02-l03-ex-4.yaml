# anchor: boe-a-2021-5032-art-40
- id: m02-l03-q098
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, entre las funciones de las Oficinas de asistencia en materia de registros de la Administración General del Estado está emitir el recibo que acredite:"
  options:
  - id: a
    text:
      es: "El pago de las tasas que se devengan por la presentación de documentos."
  - id: b
    text:
      es: "La integridad del documento original que se devuelve al interesado."
  - id: c
    text:
      es: "La autenticidad de las copias custodiadas por el Archivo Central del Departamento."
  - id: d
    correct: true
    text:
      es: "La fecha y hora de presentación de solicitudes, comunicaciones y documentos."
  explanation:
    es: "El recibo de la oficina acredita la fecha y hora de presentación. No acredita la autenticidad de copias del Archivo Central, el pago de tasas ni la integridad de un original devuelto."
  citation: "art. 40.3.c) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2021-5032-art-40
- id: m02-l03-q099
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, entre las funciones de las Oficinas de asistencia en materia de registros está la digitalización de las solicitudes, escritos y comunicaciones en papel que se dirijan a:"
  options:
  - id: a
    text:
      es: "Solo los órganos del Ministerio al que pertenezca la oficina de asistencia."
  - id: b
    text:
      es: "Los órganos de la Administración Pública que haya creado la propia oficina."
  - id: c
    correct: true
    text:
      es: "Cualquier órgano, organismo público o entidad de derecho público de cualquier Administración Pública."
  - id: d
    text:
      es: "Únicamente los órganos de la Administración General del Estado y de sus organismos."
  explanation:
    es: "La oficina digitaliza los escritos dirigidos a cualquier órgano, organismo o entidad de cualquier Administración Pública. Los tres límites de las otras opciones, a la Administración General del Estado, a un Ministerio o a la Administración creadora, no figuran en el texto."
  citation: "art. 40.3.a) RD 203/2021"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q151
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los asientos del registro se anotarán respetando el orden temporal de:"
  options:
  - id: a
    correct: true
    text:
      es: "Recepción o salida de los documentos."
  - id: b
    text:
      es: "Prioridad que fije cada unidad administrativa."
  - id: c
    text:
      es: "Finalización de los trámites que inicien."
  - id: d
    text:
      es: "Presentación de los recursos que contengan."
  explanation:
    es: "Los asientos se anotan según el orden temporal de recepción o salida de los documentos. Ordenarlos por recursos, por la prioridad de cada unidad o por la finalización de trámites rompe esa regla."
  citation: "art. 16.2 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q153
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, concluido el trámite de registro, los documentos serán cursados sin dilación a sus destinatarios y a:"
  options:
  - id: a
    correct: true
    text:
      es: "Las unidades administrativas correspondientes, desde el registro en que hubieran sido recibidos."
  - id: b
    text:
      es: "Las oficinas de asistencia en materia de registros más próximas al domicilio del interesado."
  - id: c
    text:
      es: "El archivo central del Departamento, desde el archivo de gestión de la unidad."
  - id: d
    text:
      es: "La Secretaría General Técnica de cada Departamento, desde el registro electrónico general."
  explanation:
    es: "Tras el registro, los documentos se cursan sin dilación a sus destinatarios y a las unidades administrativas correspondientes, desde el registro en que se recibieron. La Secretaría General Técnica, las oficinas de asistencia y el archivo central no son los destinatarios que fija el apartado."
  citation: "art. 16.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q154
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recibo que se emite automáticamente al registrar un documento consiste en una copia autenticada del documento, que incluye la fecha y hora de presentación y:"
  options:
  - id: a
    text:
      es: "El plazo máximo de resolución del procedimiento."
  - id: b
    text:
      es: "La firma manuscrita del interesado o su representante."
  - id: c
    text:
      es: "El sello oficial del registro que lo recibe."
  - id: d
    correct: true
    text:
      es: "El número de entrada de registro."
  explanation:
    es: "La copia autenticada incluye la fecha y hora de presentación y el número de entrada de registro. El sello del registro, la firma del interesado y el plazo de resolución no se citan como parte del recibo."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q156
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos presentados de manera presencial deberán ser digitalizados por la oficina de asistencia en materia de registros en la que hayan sido presentados para su incorporación al:"
  options:
  - id: a
    text:
      es: "Libro de entradas de la oficina de asistencia."
  - id: b
    text:
      es: "Registro electrónico de la Administración destinataria."
  - id: c
    correct: true
    text:
      es: "Expediente administrativo electrónico."
  - id: d
    text:
      es: "Archivo electrónico único de la Administración."
  explanation:
    es: "La digitalización tiene por fin incorporar el documento al expediente administrativo electrónico. El archivo electrónico único recoge documentos de procedimientos finalizados, y el registro electrónico anota la presentación; ninguno es el destino de la digitalización. El libro de entradas no figura en el apartado."
  citation: "art. 16.5 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q157
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, una vez digitalizados los documentos presentados de manera presencial, se devuelven los originales al interesado, sin perjuicio de los supuestos en que la norma determine:"
  options:
  - id: a
    text:
      es: "El traslado del original al archivo histórico."
  - id: b
    correct: true
    text:
      es: "La custodia por la Administración de los documentos presentados."
  - id: c
    text:
      es: "La destrucción inmediata del original por la oficina."
  - id: d
    text:
      es: "La conservación del original durante tres años."
  explanation:
    es: "La excepción a la devolución es que la norma determine la custodia por la Administración de los documentos presentados. La destrucción, el traslado al archivo histórico y la conservación temporal no están en el apartado."
  citation: "art. 16.5 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q172
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los registros electrónicos de todas y cada una de las Administraciones deberán ser plenamente interoperables, de modo que se garantice su compatibilidad informática e interconexión, así como:"
  options:
  - id: a
    correct: true
    text:
      es: "La transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros."
  - id: b
    text:
      es: "La remisión de copias en papel a la oficina de asistencia más próxima."
  - id: c
    text:
      es: "La sustitución de los registros de los organismos por el de cada Ministerio."
  - id: d
    text:
      es: "La unificación de los asientos en un único registro general estatal."
  explanation:
    es: "Además de la compatibilidad informática y la interconexión, el apartado garantiza la transmisión telemática de los asientos y de los documentos presentados en cualquier registro. No prevé un registro único estatal, ni que el registro de cada Ministerio sustituya al de los organismos, ni el envío de copias en papel."
  citation: "art. 16.4 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q041
  prompt:
    es: "Según el artículo 2.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el ciclo vital de documentos son las etapas por las que atraviesan los documentos:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde que se producen hasta su eliminación o, en su caso, su conservación permanente."
  - id: b
    text:
      es: "Desde que ingresan en el archivo central hasta su transferencia al archivo histórico."
  - id: c
    text:
      es: "Desde que se registran hasta que finaliza el procedimiento al que se incorporan."
  - id: d
    text:
      es: "Desde que se producen hasta su transferencia al Archivo General de la Administración."
  explanation:
    es: "El artículo 2.2.e) define el ciclo vital como las etapas que atraviesan los documentos «desde que se producen hasta su eliminación conforme al procedimiento establecido, o en su caso, su conservación permanente». No empieza en el archivo central ni en el registro. No termina con la transferencia al Archivo General de la Administración ni con el fin del procedimiento."
  citation: "art. 2.2.e) RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l03-q042
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿qué instrumento, fruto de la valoración documental, recoge el plazo de permanencia de los documentos en cada fase del ciclo vital?"
  options:
  - id: a
    text:
      es: "Cuadro de clasificación."
  - id: b
    correct: true
    text:
      es: "Calendario de conservación."
  - id: c
    text:
      es: "Relación de entrega."
  - id: d
    text:
      es: "Catálogo de procedimientos."
  explanation:
    es: "El artículo 2.2.f) define el calendario de conservación como «el instrumento de trabajo fruto del proceso de valoración documental, en el que se recoge el plazo de permanencia de los documentos de archivo en cada una de las fases del ciclo vital». El cuadro de clasificación lo elabora el Archivo Central para clasificar las series. La relación de entrega acompaña cada transferencia. Un catálogo de procedimientos no recoge plazos de permanencia de documentos."
  citation: "art. 2.2.f) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-dt-primera
- id: m02-l03-q043
  prompt:
    es: "Según la disposición transitoria primera del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, las normas y plazos de transferencias al Archivo General de la Administración del Decreto 914/1969:"
  options:
  - id: a
    text:
      es: "Quedaron derogados en bloque con la entrada en vigor del Real Decreto 1708/2011."
  - id: b
    correct: true
    text:
      es: "Serán sustituidos progresivamente por los calendarios de conservación y normas técnicas de transferencia."
  - id: c
    text:
      es: "Se mantienen sin límite temporal como regulación supletoria de los calendarios."
  - id: d
    text:
      es: "Serán sustituidos por los plazos de transferencia, fijados en años, que establece el propio Real Decreto 1708/2011."
  explanation:
    es: "La disposición transitoria primera dice que esas normas y plazos «serán sustituidos progresivamente por los calendarios de conservación y normas técnicas de transferencia que se aprueben». No quedaron derogados de golpe. Tampoco siguen sin límite: se sustituyen a medida que se aprueban calendarios. El Real Decreto 1708/2011 no fija plazos de transferencia en años."
  citation: "disposición transitoria primera RD 1708/2011"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12534-art-58
- id: m02-l03-q044
  prompt:
    es: "¿A qué órgano corresponde el estudio y dictamen de las cuestiones relativas a la calificación y utilización de los documentos de la Administración del Estado y del sector público estatal?"
  options:
  - id: a
    text:
      es: "A la Comisión de Archivos de la Administración General del Estado."
  - id: b
    text:
      es: "Al Consejo del Patrimonio Histórico."
  - id: c
    text:
      es: "Al Archivo General de la Administración."
  - id: d
    correct: true
    text:
      es: "A la Comisión Superior Calificadora de Documentos Administrativos."
  explanation:
    es: "El artículo 58 de la Ley 16/1985 dice que ese estudio y dictamen «corresponderá a una Comisión Superior Calificadora de Documentos Administrativos». La Comisión de Archivos es el órgano al que esa Comisión se adscribe como órgano consultivo superior (artículo 13.6 del Real Decreto 1708/2011). El Consejo del Patrimonio Histórico es otro órgano de la Ley 16/1985. El Archivo General de la Administración aplica las resoluciones de la Comisión, no las dicta."
  citation: "art. 58 Ley 16/1985"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2011-18541-art-13
- id: m02-l03-q045
  prompt:
    es: "Según el artículo 13.6 del Real Decreto 1708/2011, de 18 de noviembre, la Comisión Superior Calificadora de Documentos Administrativos se adscribe a la Comisión de Archivos de la Administración General del Estado como:"
  options:
  - id: a
    correct: true
    text:
      es: "Su órgano consultivo superior."
  - id: b
    text:
      es: "Su órgano ejecutivo de gestión."
  - id: c
    text:
      es: "Su secretaría técnica permanente."
  - id: d
    text:
      es: "Su órgano de control de la eliminación."
  explanation:
    es: "El artículo 13.6 dice que la Comisión Superior Calificadora «se adscribe a la Comisión de Archivos de la Administración General del Estado como su órgano consultivo superior». No es un órgano ejecutivo ni una secretaría técnica. El artículo tampoco la configura como órgano de control de la eliminación."
  citation: "art. 13.6 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-14
- id: m02-l03-q101
  prompt:
    es: "Según el reglamento de archivos, ¿en qué fases del ciclo vital de los documentos desarrollan sus funciones generales los archivos que están integrados en el Sistema?"
  options:
  - id: a
    text:
      es: "Solo en la fase histórica de conservación permanente."
  - id: b
    text:
      es: "Solo desde la transferencia al archivo intermedio."
  - id: c
    correct: true
    text:
      es: "En todas las fases del ciclo vital."
  - id: d
    text:
      es: "Solo en la fase activa, mientras dura la tramitación."
  explanation:
    es: "Esas funciones se desarrollan en todas las fases del ciclo vital. Limitarlas a la fase activa, a la intermedia o a la histórica contradice el «en todas las fases»."
  citation: "art. 14.1 RD 1708/2011"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-23
- id: m02-l03-q102
  prompt:
    es: "¿Quién tiene derecho a acceder a los documentos conservados en los archivos de la Administración General del Estado incluidos en el ámbito de aplicación de la norma de archivos?"
  options:
  - id: a
    text:
      es: "Solo los investigadores que acrediten un interés histórico, científico o estadístico."
  - id: b
    text:
      es: "Solo los interesados en el procedimiento administrativo del que proceden los documentos."
  - id: c
    text:
      es: "Solo quienes acrediten un interés legítimo en el acceso a los documentos."
  - id: d
    correct: true
    text:
      es: "Toda persona, sin perjuicio de las exclusiones y limitaciones legales."
  explanation:
    es: "El derecho es de toda persona, con las exclusiones y limitaciones de la Constitución y las leyes. Restringirlo a interesados, a investigadores o a quien acredite un interés legítimo añade requisitos que el precepto general no contiene."
  citation: "art. 23.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-24
- id: m02-l03-q103
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, en la solicitud de acceso a documentos el solicitante podrá exponer los motivos de su petición, que:"
  options:
  - id: a
    text:
      es: "Serán obligatorios para que la solicitud se admita a trámite en el archivo."
  - id: b
    correct: true
    text:
      es: "Se tendrán en cuenta en la tramitación y resolución de la solicitud."
  - id: c
    text:
      es: "Determinarán qué órgano es competente para resolver la solicitud presentada."
  - id: d
    text:
      es: "Solo se valorarán si lo pide expresamente el responsable del archivo."
  explanation:
    es: "Exponer los motivos es voluntario, y si se exponen se tienen en cuenta al tramitar y resolver. No son requisito de admisión, no dependen de que lo pida el responsable y no fijan la competencia, que sigue otro criterio."
  citation: "art. 24.3 RD 1708/2011"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-24
- id: m02-l03-q104
  prompt:
    es: "Quien quiere consultar un documento conservado en un archivo de la Administración General del Estado, ¿tiene que motivar su solicitud de acceso a esos documentos?"
  options:
  - id: a
    text:
      es: "Sí, salvo que quien solicita sea un investigador debidamente acreditado."
  - id: b
    text:
      es: "Sí, siempre, y la falta de motivación determina la inadmisión de la solicitud."
  - id: c
    correct: true
    text:
      es: "No, aunque el solicitante puede exponer los motivos de su petición."
  - id: d
    text:
      es: "Sí, pero solo cuando los documentos solicitados contienen datos personales."
  explanation:
    es: "No será necesario motivar la solicitud, aunque se pueden exponer los motivos. Las demás opciones establecen una obligación de motivar, general o con excepciones, que el precepto no recoge."
  citation: "art. 24.3 RD 1708/2011"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-26
- id: m02-l03-q105
  prompt:
    es: "Con carácter general, ¿qué régimen de acceso tienen los documentos conservados en los archivos de la Administración General del Estado que regula la norma de archivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Son de libre acceso, salvo las limitaciones previstas en la Constitución y en las leyes."
  - id: b
    text:
      es: "Son de acceso restringido, salvo autorización previa del responsable del archivo que los custodia."
  - id: c
    text:
      es: "Son de libre acceso solo cuando han transcurrido veinticinco años desde que se produjeron."
  - id: d
    text:
      es: "Son de acceso libre únicamente para quien acredite un interés legítimo en la consulta."
  explanation:
    es: "La regla es el libre acceso, con las limitaciones de la Constitución y las leyes. La restricción como regla invierte el principio, y los veinticinco años y el interés legítimo pertenecen a los documentos con datos personales."
  citation: "art. 26.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-28
- id: m02-l03-q106
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el acceso a documentos con datos personales que puedan afectar a la intimidad o a la seguridad de las personas será posible siempre que medie:"
  options:
  - id: a
    text:
      es: "La autorización verbal del responsable del archivo."
  - id: b
    correct: true
    text:
      es: "El consentimiento expreso y por escrito de los afectados."
  - id: c
    text:
      es: "El consentimiento tácito de los afectados si no se oponen."
  - id: d
    text:
      es: "La autorización previa de la Comisión Superior Calificadora."
  explanation:
    es: "La regla general exige consentimiento expreso y por escrito de los afectados. Una autorización verbal del responsable o un consentimiento tácito no equivalen a él, y la Comisión Superior Calificadora no interviene en esta autorización."
  citation: "art. 28.2 RD 1708/2011"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2011-18541-art-28
- id: m02-l03-q107
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, serán accesibles los documentos con datos personales que puedan afectar a la seguridad o intimidad de las personas cuando hayan transcurrido veinticinco años desde:"
  options:
  - id: a
    text:
      es: "La transferencia al archivo histórico."
  - id: b
    text:
      es: "La presentación de la solicitud de acceso."
  - id: c
    correct: true
    text:
      es: "El fallecimiento de los afectados."
  - id: d
    text:
      es: "La producción del documento."
  explanation:
    es: "Los veinticinco años se cuentan desde el fallecimiento de los afectados. No corren desde que se produjo el documento, ni desde su transferencia, ni desde la solicitud."
  citation: "art. 28.2 RD 1708/2011"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2011-18541-art-28
- id: m02-l03-q108
  prompt:
    es: "¿Cuántos años han de transcurrir desde el fallecimiento de los afectados para que sean accesibles los documentos con datos personales que puedan afectar a su seguridad o intimidad?"
  options:
  - id: a
    text:
      es: "10 años."
  - id: b
    text:
      es: "30 años."
  - id: c
    text:
      es: "20 años."
  - id: d
    correct: true
    text:
      es: "25 años."
  explanation:
    es: "El plazo es de veinticinco años desde el fallecimiento. Diez, veinte y treinta años no son el plazo del precepto."
  citation: "art. 28.2 RD 1708/2011"
  difficulty: 1
  tags:
  - "plazo"
