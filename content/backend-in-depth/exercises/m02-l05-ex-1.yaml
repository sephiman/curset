        highest bit rotated left by one: 1

        floor division and floor modulus of -4 by 3: -1 -1

        set bits 1 3 5

        cardinality after the flip 2

        next set bit from 6: -1'
  - id: c
    text:
      en: 'lowest one-bit of 40: 8

        leading zeros of 40: 25

        floor of log base 2 of 40: 6

        highest bit rotated left by one: 1

        floor division and floor modulus of -4 by 3: -2 2

        set bits 1 3 5

        cardinality after the flip 2

        next set bit from 6: -1'
  - id: d
    correct: true
    text:
      en: 'lowest one-bit of 40: 8

