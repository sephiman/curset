# anchor: celex-32013r0952-art-240
- id: m03-l20-q0127
  prompt:
    es: "Industrias Mar, S. A., es titular de una autorización de depósito aduanero y almacena en él sus propias mercancías no pertenecientes a la Unión. El depósito no está a disposición de terceros. Según el artículo 240, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cómo se denomina ese depósito?"
  options:
  - id: a
    text:
      es: "Depósito aduanero público, por tratarse de un depósito aduanero autorizado por las autoridades aduaneras."
  - id: b
    text:
      es: "Depósito temporal, por almacenar mercancías no pertenecientes a la Unión bajo vigilancia aduanera."
  - id: c
    text:
      es: "Depósito aduanero público, porque todo depósito aduanero está a disposición de cualquier persona."
  - id: d
    correct: true
    text:
      es: "Depósito aduanero privado, por servir al almacenamiento de mercancías por el titular de la autorización."
  explanation:
    es: "El depósito destinado al almacenamiento de mercancías por el titular de la autorización es un depósito aduanero privado. Ser un depósito autorizado no lo hace público: lo es el que está a disposición de cualquier persona. El depósito temporal es otra situación, que va de la presentación en aduana a la inclusión en un régimen. Y no todo depósito aduanero está a disposición de cualquiera."
  citation: "art. 240.2 CAU"
  difficulty: 2
  tags:
  - "depósito aduanero"
  - "depósitos públicos y privados"
# anchor: celex-32013r0952-art-240
