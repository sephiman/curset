m04-l02-q07:
  key:
    anchor: kotlin-docs-delegation#delegation.md
    sentence: The by-clause in the supertype list for Derived indicates that b will be stored internally in objects of Derived and the compiler will generate all the methods of Base that forward to b.
  wrong:
