# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q059
  prompt:
    es: "De acuerdo con el artículo 118.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el informe del órgano de contratación en los contratos menores debe justificar de manera motivada:"
  options:
  - id: a
    correct: true
    text:
      es: "La necesidad del contrato y que no se altera su objeto para eludir los umbrales."
  - id: b
    text:
      es: "La urgencia del contrato y la existencia de crédito suficiente para atender el gasto."
  - id: c
    text:
      es: "La necesidad del contrato y la solvencia técnica o profesional del contratista elegido."
  - id: d
    text:
      es: "La elección del contratista y que no existen otras ofertas económicamente más ventajosas."
  explanation:
    es: "El artículo 118.2 LCSP pide justificar «la necesidad del contrato y que no se está alterando su objeto con el fin de evitar la aplicación de los umbrales». La solvencia del contratista, la ausencia de ofertas más ventajosas y la urgencia con existencia de crédito no forman parte de ese informe."
