  explanation:
    es: "El artículo 1 recoge el Ministerio de Hacienda con ese nombre. Las otras denominaciones añaden la función pública, la economía o los presupuestos, y no figuran en la relación. La función pública pertenece hoy al Ministerio para la Transformación Digital y de la Función Pública."
