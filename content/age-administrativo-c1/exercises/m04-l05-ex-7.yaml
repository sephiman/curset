  - id: c
    text:
      es: "El jueves 5 de octubre de 2028."
  - id: d
    correct: true
    text:
      es: "El jueves 5 de abril de 2029."
  explanation:
    es: "El puesto supera el grado en más de dos niveles, así que el artículo 70.2 del Real Decreto 364/1995 le hace consolidar «cada dos años de servicios continuados el grado superior en dos niveles». El grado 22 llega a los dos años: de fecha a fecha desde el lunes 5 de abril de 2027, el jueves 5 de abril de 2029. El miércoles 5 de abril de 2028 es un año. El jueves 5 de octubre de 2028 son dieciocho meses. El viernes 5 de abril de 2030 son tres años, que no exige esta regla."
