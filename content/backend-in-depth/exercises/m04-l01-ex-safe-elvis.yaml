- id: m04-l01-v-kotlin-safe-elvis-009
  prompt:
    en: |-
      What does this program print? The type of `users` is `Map<String, String?>`, so a lookup can give null.

      ```kotlin
      fun fallback(): String {
          println("fallback")
          return "guest"
      }

      fun main() {
          val users: Map<String, String?> = mapOf("ann" to "Ann Lee", "bo" to null, "cy" to "Cy Wu")
          val name: String? = users["bo"]
          println(name?.uppercase() ?: fallback())
      }
      ```
  options:
  - id: a
    text:
      en: '`fallback`, `guest`'
    correct: true
  - id: b
    text:
      en: '`null`'
  - id: c
    text:
      en: '`fallback`, `GUEST`'
  - id: d
    text:
      en: '`guest`'
  explanation:
    en: '`name` is `users["bo"]`. The map holds null under `bo`, so `name` is null: the safe call yields null and the Elvis
      operator evaluates `fallback()`, which prints its line and returns the default. The program prints `fallback`, `guest`.
      `null` comes from this mistake: dropping the Elvis operator and printing the nullable result. Without `?:` nothing replaces
      the null that the safe call returns, so the null is printed. `fallback`, `GUEST` comes from this mistake: applying the
      operation to the default as well. `?:` takes the whole safe-call expression as its left side, so `uppercase()` runs
      only on the value and the default comes back unchanged. `guest` comes from this mistake: printing the default text without
      calling the function. The right-hand side of `?:` is the call `fallback()`, and evaluating it prints its own line.'
  family: kotlin-safe-elvis
  code_reading: true
  citation: kotlin-docs-null-safety#elvis-operator
  difficulty: 2
  tags: *id001
