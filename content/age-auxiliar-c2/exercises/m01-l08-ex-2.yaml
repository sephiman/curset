# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q090
  prompt:
    es: "Conforme al artículo 58.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Secretarías de Estado y las Secretarías Generales que pueden existir en los Ministerios sirven para la gestión de:"
  options:
  - id: a
    text:
      es: "Los servicios comunes del Departamento."
  - id: b
    text:
      es: "Una Comunidad Autónoma determinada."
  - id: c
    text:
      es: "Los Organismos públicos adscritos al Ministerio."
  - id: d
    correct: true
    text:
      es: "Un sector de actividad administrativa."
  explanation:
    es: "El artículo 58.1 las prevé para la gestión de un sector de actividad administrativa. Los servicios comunes los gestionan la Subsecretaría y la Secretaría General Técnica según el artículo 58.2. No se organizan por Comunidades Autónomas ni por Organismos públicos."
  citation: "art. 58.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "estructura"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q091
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, de las Secretarías de Estado y de las Secretarías Generales de un Ministerio dependen jerárquicamente:"
  options:
  - id: a
    text:
      es: "Los Subsecretarios del Ministerio."
  - id: b
    correct: true
    text:
      es: "Los órganos directivos que se les adscriban."
  - id: c
    text:
      es: "La Subsecretaría y la Secretaría General Técnica."
  - id: d
    text:
      es: "Los Delegados del Gobierno."
  explanation:
    es: "El artículo 58.1 hace depender de ellas a los órganos directivos que se les adscriban. Los Subsecretarios dependen directamente del Ministro según el artículo 60.1, y los Delegados del Gobierno pertenecen a la organización territorial."
  citation: "art. 58.1 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
  - "órgano"
