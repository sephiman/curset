# anchor: fuente-ms-win-ping-html
- id: m06-l08-q101
  prompt:
    es: "En Windows 11, ¿qué tipo de mensajes envía el comando ping a otro equipo TCP/IP para comprobar la conectividad a nivel de IP?"
  options:
  - id: a
    text:
      es: "Mensajes de solicitud de conexión del protocolo TCP"
  - id: b
    text:
      es: "Mensajes de respuesta de eco del protocolo ICMP"
  - id: c
    correct: true
    text:
      es: "Mensajes de solicitud de eco del protocolo ICMP"
  - id: d
    text:
      es: "Mensajes de solicitud de eco del protocolo UDP"
  explanation:
    es: "ping comprueba la conectividad IP enviando mensajes de solicitud de eco del protocolo de mensajes de control de Internet (ICMP). Los mensajes de eco son de ICMP, no de UDP, según la descripción del comando. Las respuestas de eco son las que recibe y muestra ping, junto con los tiempos de ida y vuelta; lo que envía son solicitudes. ping no envía solicitudes de conexión TCP, sino solicitudes de eco ICMP."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m06-l08-q102
  prompt:
    es: "¿Cuál de las siguientes informaciones muestra el comando ping de Windows 11 sobre los mensajes de respuesta de eco que recibe del equipo de destino?"
  options:
  - id: a
    text:
      es: "Solo el número de saltos hasta el destino, sin los tiempos"
  - id: b
    correct: true
    text:
      es: "Su recepción, junto con los tiempos de ida y vuelta"
  - id: c
    text:
      es: "El contenido de los mensajes de solicitud de eco enviados"
  - id: d
    text:
      es: "La ruta completa de enrutadores, con la hora de cada salto"
  explanation:
    es: "ping muestra la recepción de los mensajes de respuesta de eco y los tiempos de ida y vuelta. Mostrar solo los saltos sin tiempos contradice que muestra los tiempos de ida y vuelta. Lo que muestra son las respuestas de eco recibidas, no el contenido de las solicitudes que envía. La ruta y la hora de cada salto solo se registran con los parámetros /r y /s, no por defecto."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m06-l08-q103
  prompt:
    es: "¿Cuál de las siguientes listas recoge los problemas que se solucionan con ping, el comando TCP/IP principal para ello, según la documentación de Windows 11?"
  options:
  - id: a
    text:
      es: "Problemas de disponibilidad, enrutamiento y asignación de direcciones"
  - id: b
    correct: true
    text:
      es: "Problemas de conectividad, disponibilidad y resolución de nombres"
  - id: c
    text:
      es: "Problemas de conectividad, fragmentación y autenticación del usuario"
  - id: d
    text:
      es: "Problemas de conectividad, cifrado y resolución de nombres"
  explanation:
    es: "ping es el comando TCP/IP principal para solucionar problemas de conectividad, disponibilidad y resolución de nombres. El cifrado no figura entre los problemas que ping ayuda a resolver. El enrutamiento y la asignación de direcciones no figuran en la lista de la página. La fragmentación (parámetro /f, útil para la PMTU) y la autenticación no son los problemas que cita como principales."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ping-html
- id: m06-l08-q104
  prompt:
    es: "En Windows 11, el parámetro /t del comando ping, que se usa para enviar solicitudes de eco a un destino:"
  options:
  - id: a
    text:
      es: "Envía las solicitudes con la marca No fragmentar establecida en 1"
  - id: b
    text:
      es: "Realiza la resolución inversa de nombres en la dirección IP de destino"
  - id: c
    text:
      es: "Fija el número de solicitudes de eco que se envían"
  - id: d
    correct: true
    text:
      es: "Sigue enviando solicitudes de eco al destino hasta que se interrumpa"
  explanation:
    es: "Con /t, ping continúa enviando solicitudes de eco al destino hasta que se interrumpa. La resolución inversa de nombres en la dirección de destino es el parámetro /a. El número de solicitudes de eco se fija con /n. La marca No fragmentar en 1 es lo que establece el parámetro /f."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 1
  tags:
  - "configuración"
  - "comportamiento"
