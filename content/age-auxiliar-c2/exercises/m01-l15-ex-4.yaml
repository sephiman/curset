# anchor: boe-a-2003-21614-art-37
- id: m01-l15-q036
  prompt:
    es: "Según el artículo 37.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el proyecto de Ley de Presupuestos Generales del Estado será remitido a las Cortes Generales antes del día:"
  options:
  - id: a
    text:
      es: "1 de septiembre del año anterior al que se refiera."
  - id: b
    text:
      es: "1 de noviembre del año anterior al que se refiera."
  - id: c
    correct: true
    text:
      es: "1 de octubre del año anterior al que se refiera."
  - id: d
    text:
      es: "1 de octubre del año al que se refiera."
  explanation:
    es: "El artículo 37.1 fija el 1 de octubre del año anterior al que se refiera el proyecto. El 1 de septiembre y el 1 de noviembre son fechas vecinas que el artículo no usa. El 1 de octubre del propio año del presupuesto llegaría cuando el ejercicio ya ha empezado."
  citation: "art. 37.1 LGP"
  difficulty: 1
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2003-21614-art-37
- id: m01-l15-q037
  prompt:
    es: "El Gobierno remite a las Cortes Generales el proyecto de Ley de Presupuestos Generales del Estado para 2027. ¿Antes de qué fecha debe hacerlo según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Antes del 1 de octubre de 2027."
  - id: b
    text:
      es: "Antes del 31 de octubre de 2026."
  - id: c
    text:
      es: "Antes del 1 de enero de 2027."
  - id: d
    correct: true
    text:
      es: "Antes del 1 de octubre de 2026."
  explanation:
    es: "El proyecto para 2027 se remite antes del 1 de octubre del año anterior, es decir, de 2026. El 1 de octubre de 2027 corresponde a un año demasiado tarde. El 31 de octubre es la fecha límite de la Cuenta General del Estado (art. 131.1), no la del proyecto. El 1 de enero de 2027 es el primer día del ejercicio, cuando ya debería estar aprobada la ley."
  citation: "art. 37.1 LGP"
  difficulty: 1
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2003-21614-art-131
- id: m01-l15-q039
  prompt:
    es: "De acuerdo con el artículo 131.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Cuenta General del Estado se elevará al Gobierno para su remisión al Tribunal de Cuentas antes del día:"
  options:
  - id: a
    correct: true
    text:
      es: "31 de octubre del año siguiente al que se refiera."
  - id: b
    text:
      es: "30 de junio del año siguiente al que se refiera."
  - id: c
    text:
      es: "31 de octubre del año al que se refiera."
  - id: d
    text:
      es: "31 de diciembre del año siguiente al que se refiera."
  explanation:
    es: "El artículo 131.1 LGP dice que la Cuenta General se elevará al Gobierno para su remisión al Tribunal de Cuentas «antes del día 31 de octubre del año siguiente al que se refiera». El 30 de junio y el 31 de diciembre no son esa fecha: el apartado dice 31 de octubre. El 31 de octubre del propio año de la cuenta es anterior al cierre del ejercicio al que la cuenta se refiere, y el apartado la sitúa en el año siguiente."
  citation: "art. 131.1 LGP"
  difficulty: 1
  tags:
  - "plazo"
  - "fecha"
