# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q075
  prompt:
    es: "Conforme al artículo 55.6 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de los siguientes órganos tiene además la condición de alto cargo?"
  options:
  - id: a
    text:
      es: "Los Subdelegados del Gobierno en las provincias."
  - id: b
    text:
      es: "Los Subdirectores generales."
  - id: c
    correct: true
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Los jefes de las unidades administrativas."
  explanation:
    es: "Los Delegados del Gobierno son órganos directivos y, por tanto, altos cargos. La excepción del artículo 55.6 alcanza a los Subdirectores generales y asimilados, entre ellos los Subdelegados, que tienen nivel de Subdirector general. Los jefes de las unidades administrativas ni siquiera son órganos superiores o directivos."
  citation: "art. 55.6 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
