# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q280
  prompt:
    es: "Según el artículo 7.1.j) del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿comete falta grave el funcionario que revela asuntos conocidos por razón del cargo, con perjuicio para la Administración pero sin provecho propio?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque basta con que la revelación cause perjuicio a la Administración."
  - id: b
    text:
      es: "No, porque además tiene que utilizar lo revelado en provecho propio."
  - id: c
    text:
      es: "No, porque la letra j) solo atiende al perjuicio causado a los ciudadanos."
  - id: d
    text:
      es: "Sí, siempre que antes haya sido sancionado por una falta leve."
  explanation:
    es: "La letra j) del artículo 7.1 tipifica como grave no guardar el debido sigilo sobre los asuntos conocidos por razón del cargo «cuando causen perjuicio a la Administración o se utilice en provecho propio». Las dos condiciones son alternativas y basta una, así que no hace falta además el provecho propio. La letra j) habla del perjuicio a la Administración, no a los ciudadanos, y no pide una sanción previa por falta leve; esa condición es de la letra m), sobre las faltas de asistencia reiteradas."
  citation: "art. 7.1.j) RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-6
- id: m04-l06-q281
  prompt:
    es: "Según el artículo 6 del Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta muy grave:"
  options:
  - id: a
    text:
      es: "La grave desconsideración con los superiores, compañeros o subordinados en el servicio."
  - id: b
    text:
      es: "Causar daños graves en los locales, material o documentos de los servicios de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "La notoria falta de rendimiento que comporte inhibición en el cumplimiento de las tareas encomendadas."
  - id: d
    text:
      es: "La grave perturbación del servicio, cuando afecte a su funcionamiento normal."
  explanation:
    es: "El artículo 6.f) tipifica como falta muy grave «la notoria falta de rendimiento que comporte inhibición en el cumplimiento de las tareas encomendadas». La grave desconsideración y los daños graves en locales, material o documentos son faltas graves del artículo 7.1, letras e) y f). La grave perturbación del servicio es también falta grave, de la letra n) del mismo artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-6
- id: m04-l06-q282
  prompt:
    es: "Conforme al artículo 6 del Real Decreto 33/1986, de 10 de enero, es falta muy grave haber sido sancionado por la comisión de tres faltas graves en un período de:"
  options:
  - id: a
    correct: true
    text:
      es: "un año."
  - id: b
    text:
      es: "tres meses."
  - id: c
    text:
      es: "seis meses."
  - id: d
    text:
      es: "dos años."
  explanation:
    es: "El artículo 6.n) tipifica como falta muy grave «haber sido sancionado por la comisión de tres faltas graves en un período de un año». Los tres meses recuerdan el período de la falta de asistencia injustificada del artículo 7.1.m), que es falta grave. Seis meses y dos años no figuran en el artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-6
- id: m04-l06-q283
  prompt:
    es: "¿Cuál de las siguientes conductas relacionadas con la huelga es falta muy grave según el artículo 6 del Real Decreto 33/1986, de 10 de enero?"
  options:
  - id: a
    text:
      es: "La difusión entre los compañeros de la convocatoria de una huelga legal."
  - id: b
    text:
      es: "La asistencia a una asamblea sindical autorizada durante la jornada de trabajo."
  - id: c
    text:
      es: "La solicitud de permiso sindical para asistir a un congreso de su organización sindical."
  - id: d
    correct: true
    text:
      es: "El incumplimiento de la obligación de atender los servicios esenciales en caso de huelga."
  explanation:
    es: "El artículo 6.l) tipifica como falta muy grave «el incumplimiento de la obligación de atender los servicios esenciales en caso de huelga». Difundir entre los compañeros la convocatoria de una huelga legal, asistir a una asamblea autorizada y pedir un permiso para un congreso sindical no figuran entre las faltas muy graves del artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-6
- id: m04-l06-q284
  prompt:
    es: "Según el artículo 6 del Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta muy grave:"
  options:
  - id: a
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: b
    correct: true
    text:
      es: "Los actos limitativos de la libre expresión de pensamiento, ideas y opiniones."
  - id: c
    text:
      es: "La grave falta de consideración con los administrados, si es reiterada."
  - id: d
    text:
      es: "La tolerancia de los superiores respecto de la comisión de faltas graves de sus subordinados."
  explanation:
    es: "El artículo 6.m) tipifica como falta muy grave «los actos limitativos de la libre expresión de pensamiento, ideas y opiniones». El atentado grave a la dignidad, la grave falta de consideración con los administrados y la tolerancia de los superiores son faltas graves del artículo 7.1, letras ñ), o) y d)."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-61
- id: m04-l06-q285
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de las siguientes funciones corresponde a los Ministros, como titulares del departamento?"
  options:
  - id: a
    text:
      es: "Imponer la sanción de despido disciplinario al personal laboral por faltas graves."
  - id: b
    text:
      es: "Aprobar la oferta de empleo público estatal."
  - id: c
    text:
      es: "Aprobar los estatutos de los organismos públicos dependientes de su Ministerio."
  - id: d
    correct: true
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  explanation:
    es: "El artículo 61.s) incluye entre las funciones de los Ministros «imponer la sanción de separación del servicio por faltas muy graves». Ninguna de las otras tres figura en el artículo 61: el despido disciplinario del personal laboral no es una de sus funciones, ni lo son la aprobación de la oferta de empleo público ni la de los estatutos de los organismos públicos, que el artículo 93.2 da al Consejo de Ministros."
  citation: "art. 61.s) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m04-l06-q286
  prompt:
    es: "De acuerdo con el artículo 61.s) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la sanción de separación del servicio que corresponde imponer a los Ministros lo es:"
  options:
  - id: a
    correct: true
    text:
      es: "por la comisión de faltas muy graves."
  - id: b
    text:
      es: "por la comisión de faltas graves o muy graves."
  - id: c
    text:
      es: "por la comisión de faltas graves reiteradas."
  - id: d
    text:
      es: "por la comisión de faltas leves acumuladas."
  explanation:
    es: "El artículo 61.s) LRJSP dice que corresponde a los Ministros «imponer la sanción de separación del servicio por faltas muy graves». Añadir las graves amplía la letra: el apartado dice solo muy graves. Las graves reiteradas y las leves acumuladas son tipos que la letra s) no contempla: la letra nombra una clase de falta, la muy grave, y no hace depender la separación de que otras faltas se repitan o se acumulen."
  citation: "art. 61.s) LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "requisito"
# anchor: boe-a-2015-10566-art-25
- id: m04-l06-q287
  prompt:
    es: "Según el artículo 25.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las disposiciones de su capítulo sobre la potestad sancionadora son extensivas al ejercicio por las Administraciones Públicas de su potestad:"
  options:
  - id: a
    text:
      es: "disciplinaria respecto de los funcionarios de carrera, con exclusión del personal laboral y del eventual."
  - id: b
    text:
      es: "sancionadora respecto de quienes estén vinculados a ellas por contratos del sector público o patrimoniales."
  - id: c
    correct: true
    text:
      es: "disciplinaria respecto del personal a su servicio, sea cual sea la naturaleza jurídica de la relación de empleo."
  - id: d
    text:
      es: "reglamentaria respecto del personal a su servicio, cualquiera que sea la naturaleza jurídica de su relación."
  explanation:
    es: "El artículo 25.3 extiende las disposiciones del capítulo a la potestad disciplinaria «respecto del personal a su servicio, cualquiera que sea la naturaleza jurídica de la relación de empleo». Por eso incluye al personal laboral y no solo a los funcionarios de carrera. La potestad sancionadora sobre quienes se vinculan por contratos del sector público está excluida por el artículo 25.4. La reglamentaria no es la potestad que el artículo menciona."
  citation: "art. 25.3 LRJSP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-10566-art-30
- id: m04-l06-q288
  prompt:
    es: "Conforme al artículo 30.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué requisito debe cumplir la iniciación de un procedimiento sancionador para interrumpir la prescripción de las infracciones?"
  options:
  - id: a
    text:
      es: "Que se anote la iniciación en el Registro Central de Personal."
  - id: b
    correct: true
    text:
      es: "Que la iniciación se produzca con conocimiento del interesado."
  - id: c
    text:
      es: "Que el instructor haya formulado ya el pliego de cargos al funcionario."
  - id: d
    text:
      es: "Que se notifique al interesado la propuesta de resolución del instructor."
  explanation:
    es: "El artículo 30.2 dice que interrumpe la prescripción «la iniciación, con conocimiento del interesado, de un procedimiento administrativo de naturaleza sancionadora». La exigencia es el conocimiento del interesado. El artículo no pide anotarla en el Registro de personal, ni que el instructor haya formulado el pliego de cargos, ni que se notifique la propuesta de resolución."
  citation: "art. 30.2 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10566-art-30
- id: m04-l06-q289
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 40/2015, de 1 de octubre, el plazo de prescripción de las infracciones se reinicia si el expediente sancionador está paralizado, por causa no imputable al presunto responsable, durante más de:"
  options:
  - id: a
    text:
      es: "quince días."
  - id: b
    text:
      es: "dos meses."
  - id: c
    text:
      es: "tres meses."
  - id: d
    correct: true
    text:
      es: "un mes."
  explanation:
    es: "El artículo 30.2 reinicia el plazo de prescripción «si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable». Quince días, dos meses y tres meses no son el plazo del artículo."
  citation: "art. 30.2 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m04-l06-q291
  prompt:
    es: "Conforme al artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, un plazo de un mes se cuenta desde la notificación del lunes 31 de agosto de 2026. ¿Cuándo concluye?"
  options:
  - id: a
    text:
      es: "El jueves 1 de octubre de 2026."
  - id: b
    text:
      es: "El martes 29 de septiembre de 2026."
  - id: c
    correct: true
    text:
      es: "El miércoles 30 de septiembre de 2026."
  - id: d
    text:
      es: "El viernes 2 de octubre de 2026."
  explanation:
    es: "El plazo de un mes empieza el día siguiente a la notificación, el martes 1 de septiembre de 2026. Concluye el mismo día de la notificación en el mes de vencimiento, pero septiembre no tiene día 31: «se entenderá que el plazo expira el último día del mes», el miércoles 30 de septiembre de 2026. Es día hábil y no hay que trasladarlo. El 1 y el 2 de octubre quedan fuera del plazo, y el 29 de septiembre lo cierra un día antes."
  citation: "art. 30.4 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10565-art-30
- id: m04-l06-q292
  prompt:
    es: "Según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo fijado en meses concluye, en el mes de vencimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "el mismo día en que se produjo la notificación."
  - id: b
    text:
      es: "el día anterior a aquel en que se produjo la notificación."
  - id: c
    text:
      es: "el último día de ese mes, en todo caso."
  - id: d
    text:
      es: "el primer día hábil del mes siguiente."
  explanation:
    es: "El artículo 30.4 dice que el plazo en meses «concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento». El último día del mes solo cuenta si en el mes de vencimiento no hay día equivalente. El día anterior y el primer día hábil del mes siguiente tampoco son la regla del artículo."
  citation: "art. 30.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
