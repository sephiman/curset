- id: g-insertion-point
  term:
    en: insertion point
  definition:
    en: 'The insertion point is defined as the point at which the key would be inserted into the array: the index of the first element greater than the key, or a.length if all elements in the array are less than the specified key.'
  origin: m02-l02
  citation: javadoc-arrays#binarySearch(int[],int)
