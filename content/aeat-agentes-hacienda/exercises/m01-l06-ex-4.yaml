# anchor: boe-a-2007-6115-da-primera
- id: m01-l06-q0014
  prompt:
    es: "Conforme a la disposición adicional primera de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, hay composición equilibrada cuando, en el conjunto a que se refiera, las personas de cada sexo:"
  options:
  - id: a
    text:
      es: "No superen el cincuenta y cinco por ciento ni sean menos del cuarenta y cinco"
  - id: b
    correct: true
    text:
      es: "No superen el sesenta por ciento ni sean menos del cuarenta por ciento"
  - id: c
    text:
      es: "No superen los dos tercios del total ni sean menos de un tercio"
  - id: d
    text:
      es: "No superen el setenta por ciento ni sean menos del treinta por ciento"
  explanation:
    es: "La disposición adicional primera dice que las personas de cada sexo «no superen el sesenta por ciento ni sean menos del cuarenta por ciento». El margen del cincuenta y cinco y el cuarenta y cinco por ciento es más estrecho que el de la ley. Los dos tercios y el tercio, y el setenta y el treinta por ciento, son más amplios."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2007-6115-da-primera
- id: m01-l06-q0015
  prompt:
    es: "Un órgano de nueve miembros debe tener composición equilibrada en el sentido de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres. ¿Cuántas mujeres ha de tener, como mínimo?"
  options:
  - id: a
    text:
      es: "Un mínimo de tres mujeres"
  - id: b
    correct: true
    text:
      es: "Un mínimo de cuatro mujeres"
  - id: c
    text:
      es: "Un mínimo de cinco mujeres"
  - id: d
    text:
      es: "Un mínimo de seis mujeres"
  explanation:
    es: "Cada sexo debe estar entre el cuarenta y el sesenta por ciento del total (disposición adicional primera). El cuarenta por ciento de nueve es 3,6, así que hacen falta al menos cuatro mujeres. Con cuatro mujeres y cinco hombres, los hombres son el 55,6 por ciento, dentro del límite. Con tres mujeres solo hay un 33,3 por ciento. Cinco mujeres cumplen la regla, pero no son el mínimo. Seis mujeres son el 66,7 por ciento y superan el sesenta."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2007-6115-art-53
- id: m01-l06-q0016
  prompt:
    es: "Según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, los tribunales y órganos de selección de la Administración General del Estado responderán a la presencia equilibrada:"
  options:
  - id: a
    text:
      es: "Sin excepción alguna, cualquiera que sea el cuerpo o escala convocado"
  - id: b
    correct: true
    text:
      es: "Salvo por razones fundadas y objetivas, debidamente motivadas"
  - id: c
    text:
      es: "Salvo en los procesos selectivos de promoción interna del personal"
  - id: d
    text:
      es: "Salvo cuando lo autorice la Dirección General de la Función Pública"
  explanation:
    es: "El artículo 53 admite apartarse de la presencia equilibrada solo «por razones fundadas y objetivas, debidamente motivadas». Por eso no es una regla sin excepción. La ley no exceptúa la promoción interna. Tampoco somete la excepción a la autorización de un órgano: exige motivarla."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "excepción"
  - "composición"
# anchor: boe-a-2007-6115-art-55
- id: m01-l06-q0017
  prompt:
    es: "¿Qué informe debe acompañar, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, a la aprobación de convocatorias de pruebas selectivas para el acceso al empleo público?"
  options:
  - id: a
    text:
      es: "Un informe de la Comisión Interministerial de Igualdad"
  - id: b
    text:
      es: "Un informe de la unidad de igualdad del Ministerio"
  - id: c
    text:
      es: "Un dictamen del Consejo de Participación de la Mujer"
  - id: d
    correct: true
    text:
      es: "Un informe de impacto de género"
  explanation:
    es: "El artículo 55 exige que la aprobación de esas convocatorias se acompañe «de un informe de impacto de género». La Comisión Interministerial de Igualdad coordina las políticas de los departamentos (art. 76), no informa cada convocatoria. Las unidades de igualdad asesoran en la elaboración del informe de impacto (art. 77), pero no es su informe el que exige la ley. El Consejo de Participación de la Mujer es un órgano de consulta (art. 78) que no interviene aquí."
  citation: "art. 55 LO 3/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-55
- id: m01-l06-q0018
  prompt:
    es: "Según el artículo 55 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la aprobación de convocatorias de pruebas selectivas debe acompañarse de un informe de impacto de género, salvo:"
  options:
  - id: a
    text:
      es: "En las convocatorias de promoción interna"
  - id: b
    correct: true
    text:
      es: "En los casos de urgencia"
  - id: c
    text:
      es: "Cuando se convoquen menos de cinco plazas"
  - id: d
    text:
      es: "En las convocatorias de personal laboral"
  explanation:
    es: "La única salvedad del artículo 55 son los «casos de urgencia», y siempre sin perjuicio de la prohibición de discriminación por razón de sexo. La ley no exceptúa la promoción interna ni las convocatorias de personal laboral. Tampoco fija un número mínimo de plazas."
  citation: "art. 55 LO 3/2007"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2007-6115-art-10
- id: m01-l06-q0024
  prompt:
    es: "Una cláusula de un contrato privado impone una condición que causa discriminación por razón de sexo. Según el artículo 10 de la Ley Orgánica 3/2007, de 22 de marzo, esa cláusula se considera:"
  options:
  - id: a
    text:
      es: "Válida mientras la persona afectada no la denuncie."
  - id: b
    text:
      es: "Válida salvo para la parte perjudicada por ella."
  - id: c
    text:
      es: "Válida si la persona afectada la acepta por escrito."
  - id: d
    correct: true
    text:
      es: "Nula y sin efecto."
  explanation:
    es: "La cláusula discriminatoria es nula y sin efecto desde el principio, según el artículo 10. No queda como válida a la espera de una denuncia, ni solo respecto de la parte perjudicada, ni se salva por la aceptación escrita de la persona afectada: el texto no admite ninguna de esas salvedades."
  citation: "art. 10 LO 3/2007"
  difficulty: 1
  tags:
  - "caso"
# anchor: boe-a-2007-6115-art-12
- id: m01-l06-q0026
  prompt:
    es: "Señale en qué procesos tienen capacidad y legitimación las personas con interés legítimo para defender el derecho a la igualdad, según el artículo 12.2 de la Ley Orgánica 3/2007, de 22 de marzo:"
  options:
  - id: a
    text:
      es: "En los procesos civiles y penales."
  - id: b
    text:
      es: "Solo en los procesos contencioso-administrativos."
  - id: c
    correct: true
    text:
      es: "En los procesos civiles, sociales y contencioso-administrativos."
  - id: d
    text:
      es: "En los procesos sociales y militares."
  explanation:
    es: "El artículo 12.2 nombra los procesos civiles, sociales y contencioso-administrativos. No cita los penales ni los militares, y no se limita a los contencioso-administrativos."
  citation: "art. 12.2 LO 3/2007"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2007-6115-art-12
- id: m01-l06-q0027
  prompt:
    es: "Una asociación con interés legítimo en la igualdad quiere intervenir en un litigio por acoso sexual. Conforme a la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, ¿puede hacerlo como parte legitimada?"
  options:
  - id: a
    text:
      es: "Sí, porque las personas jurídicas con interés legítimo están legitimadas en todos los litigios de igualdad."
  - id: b
    correct: true
    text:
      es: "No, porque la persona acosada es la única legitimada en esos litigios."
  - id: c
    text:
      es: "Sí, siempre que cuente con la autorización de la persona acosada."
  - id: d
    text:
      es: "Sí, si actúa en nombre del Ministerio Fiscal."
  explanation:
    es: "En los litigios sobre acoso sexual y acoso por razón de sexo, el artículo 12.3 deja como única legitimada a la persona acosada, así que la asociación no puede serlo. La regla general del apartado 2 sobre las personas jurídicas con interés legítimo cede ante esta excepción. Ni la autorización de la víctima ni actuar en nombre del Ministerio Fiscal amplían la legitimación."
  citation: "art. 12.3 LO 3/2007"
  difficulty: 3
  tags:
  - "caso"
# anchor: boe-a-2007-6115-art-12
- id: m01-l06-q0028
  prompt:
    es: "Señale en qué litigios la persona acosada es la única legitimada, según el artículo 12.3 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres:"
  options:
  - id: a
    correct: true
    text:
      es: "Los litigios sobre acoso sexual y acoso por razón de sexo."
  - id: b
    text:
      es: "Los litigios sobre discriminación directa por razón de sexo."
  - id: c
    text:
      es: "Los litigios sobre discriminación indirecta por razón de sexo."
  - id: d
    text:
      es: "Los litigios sobre la nulidad de cláusulas de negocios jurídicos discriminatorios."
  explanation:
    es: "La legitimación exclusiva de la persona acosada se limita a los litigios sobre acoso sexual y acoso por razón de sexo. En los de discriminación directa o indirecta y en los de nulidad de cláusulas rige la regla general del artículo 12.2, que alcanza a las personas físicas y jurídicas con interés legítimo."
  citation: "art. 12.3 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-53
- id: m01-l06-q0029
  prompt:
    es: "¿Cuál de los siguientes principios rige la representación de la Administración General del Estado y de sus organismos públicos en las comisiones de valoración de méritos, según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo?"
  options:
  - id: a
    text:
      es: "Paridad absoluta de ambos sexos."
  - id: b
    text:
      es: "Preferencia de las mujeres en la valoración de méritos."
  - id: c
    text:
      es: "Representación proporcional a la plantilla de cada departamento."
  - id: d
    correct: true
    text:
      es: "Composición equilibrada de ambos sexos."
  explanation:
    es: "Las comisiones de valoración de méritos para la provisión de puestos se ajustan a la composición equilibrada de ambos sexos. No se exige paridad absoluta, ni preferencia de las mujeres, ni una representación proporcional a la plantilla de cada departamento."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-da-primera
- id: m01-l06-q0034
  prompt:
    es: "Un tribunal de selección de diez personas debe tener composición equilibrada según la disposición adicional primera de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres. ¿Cuál de las siguientes composiciones lo cumple?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuatro mujeres y seis hombres."
  - id: b
    text:
      es: "Tres mujeres y siete hombres."
  - id: c
    text:
      es: "Dos mujeres y ocho hombres."
  - id: d
    text:
      es: "Una mujer y nueve hombres."
  explanation:
    es: "En un órgano de diez personas, cada sexo ha de estar entre el cuarenta y el sesenta por ciento, es decir, entre cuatro y seis personas. Cuatro y seis cumplen. Con siete hombres se superaría el sesenta por ciento, y con ocho o nueve la desproporción es mayor."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 2
  tags:
  - "caso"
  - "cómputo"
# anchor: boe-a-2007-6115-art-7
- id: m01-l06-q0035
  prompt:
    es: "Señale cómo ha de ser el comportamiento que constituye acoso sexual, según el artículo 7.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres:"
  options:
  - id: a
    text:
      es: "De naturaleza sexual, siempre que sea reiterado y de carácter físico."
  - id: b
    text:
      es: "Realizado en función del sexo de la persona, sin que sea de naturaleza sexual."
  - id: c
    text:
      es: "De naturaleza sexual, solo si produce un perjuicio profesional a la víctima."
  - id: d
    correct: true
    text:
      es: "De naturaleza sexual, verbal o físico, con el propósito o el efecto de atentar contra la dignidad de una persona."
  explanation:
    es: "El acoso sexual es cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de la persona. No exige reiteración ni limita el acoso al físico, ni requiere un perjuicio profesional. El comportamiento realizado en función del sexo, sin naturaleza sexual, es acoso por razón de sexo."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
