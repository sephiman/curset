# anchor: boe-a-2023-23537-art-1
- id: m01-l03-q0127
  prompt:
    es: "¿Cuál de los siguientes es un departamento ministerial de los que estructura la Administración General del Estado, según el artículo 1 del Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    text:
      es: "Ministerio de Juventud y Deportes."
  - id: b
    text:
      es: "Ministerio de Familia e Infancia."
  - id: c
    text:
      es: "Ministerio de Infancia y Asuntos Sociales."
  - id: d
    correct: true
    text:
      es: "Ministerio de Juventud e Infancia."
  explanation:
    es: "El artículo 1 del Real Decreto 829/2023 incluye el Ministerio de Juventud e Infancia. Los otros nombres cambian algún elemento y no figuran en la relación de departamentos."
  citation: "art. 1 RD 829/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2023-23537-art-1
- id: m01-l03-q0130
  prompt:
    es: "De acuerdo con el artículo 1 del Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales, entre los departamentos ministeriales en que se estructura la Administración General del Estado figura el:"
  options:
  - id: a
    correct: true
    text:
      es: "Ministerio de Inclusión, Seguridad Social y Migraciones."
  - id: b
    text:
      es: "Ministerio de Inclusión, Seguridad Social y Empleo."
  - id: c
    text:
      es: "Ministerio de Trabajo, Inclusión y Migraciones."
  - id: d
    text:
      es: "Ministerio de Inclusión, Migraciones y Bienestar Social."
  explanation:
    es: "El artículo 1 recoge el Ministerio de Inclusión, Seguridad Social y Migraciones. Las otras tres denominaciones combinan esas palabras de otra manera o las sustituyen por el empleo, el trabajo o el bienestar social, y no están en la relación."
  citation: "art. 1 RD 829/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2023-23537-art-1
- id: m01-l03-q0133
  prompt:
    es: "¿Cuál de los siguientes es un departamento ministerial de los que estructura la Administración General del Estado, según el artículo 1 del Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    text:
      es: "Ministerio de Política Territorial y Función Pública."
  - id: b
    text:
      es: "Ministerio de Política Territorial y Transparencia."
  - id: c
    correct: true
    text:
      es: "Ministerio de Política Territorial y Memoria Democrática."
  - id: d
    text:
      es: "Ministerio de Administración Territorial y Memoria Democrática."
  explanation:
    es: "El artículo 1 incluye el Ministerio de Política Territorial y Memoria Democrática. La función pública corresponde al Ministerio para la Transformación Digital y de la Función Pública. Las otras opciones inventan la transparencia o cambian política por administración."
  citation: "art. 1 RD 829/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-58
- id: m01-l03-q0134
  prompt:
    es: "Conforme al artículo 58.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Secretarías de Estado y las Secretarías Generales que pueden existir en los Ministerios sirven para la gestión de:"
  options:
  - id: a
    text:
      es: "Los servicios comunes del Departamento."
  - id: b
    text:
      es: "Una Comunidad Autónoma determinada."
  - id: c
    text:
      es: "Los Organismos públicos adscritos al Ministerio."
  - id: d
    correct: true
    text:
      es: "Un sector de actividad administrativa."
  explanation:
    es: "El artículo 58.1 las prevé para la gestión de un sector de actividad administrativa. Los servicios comunes los gestionan la Subsecretaría y la Secretaría General Técnica según el artículo 58.2. No se organizan por Comunidades Autónomas ni por Organismos públicos."
  citation: "art. 58.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "estructura"
# anchor: boe-a-2015-10566-art-68
- id: m01-l03-q0138
  prompt:
    es: "Según el artículo 68.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, corresponde a los servicios comunes de los Ministerios el asesoramiento, el apoyo técnico y, en su caso:"
  options:
  - id: a
    correct: true
    text:
      es: "La gestión directa de esas funciones."
  - id: b
    text:
      es: "La resolución de los recursos administrativos."
  - id: c
    text:
      es: "El ejercicio de la potestad sancionadora."
  - id: d
    text:
      es: "La dirección política del Departamento."
  explanation:
    es: "El artículo 68.1 completa la lista con la gestión directa, que se da en su caso. La resolución de recursos, la potestad sancionadora y la dirección política no son tareas de apoyo de los servicios comunes."
  citation: "art. 68.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-59
- id: m01-l03-q0140
  prompt:
    es: "¿Cuál de los siguientes órganos se crea, modifica y suprime por Real Decreto del Consejo de Ministros, según el artículo 59 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Un órgano de nivel inferior a Subdirección General."
  - id: b
    text:
      es: "Una unidad que no tiene la consideración de órgano."
  - id: c
    correct: true
    text:
      es: "Una Subdirección General."
  - id: d
    text:
      es: "Una Secretaría de Estado."
  explanation:
    es: "Las Subdirecciones Generales se crean por Real Decreto del Consejo de Ministros según el artículo 59.1. Los órganos de nivel inferior se crean por orden del Ministro según el artículo 59.2, las unidades que no son órganos mediante las relaciones de puestos de trabajo según el artículo 59.3, y el número y el ámbito de las Secretarías de Estado se fijan por Real Decreto del Presidente del Gobierno según el artículo 57.3."
  citation: "art. 59 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-60
- id: m01-l03-q0143
  prompt:
    es: "Conforme al artículo 60.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los órganos directivos ministeriales se ordenan jerárquicamente entre sí, de mayor a menor, de esta forma:"
  options:
  - id: a
    text:
      es: "Director general, Subsecretario y Subdirector general."
  - id: b
    text:
      es: "Subsecretario, Subdirector general y Director general."
  - id: c
    text:
      es: "Secretario de Estado, Director general y Subdirector general."
  - id: d
    correct: true
    text:
      es: "Subsecretario, Director general y Subdirector general."
  explanation:
    es: "El artículo 60.2 ordena a los órganos directivos así: Subsecretario, Director general y Subdirector general. Poner al Director general por encima del Subsecretario, o al Subdirector general por encima del Director general, invierte el orden. Empezar por el Secretario de Estado tampoco sirve: es un órgano superior y no directivo."
  citation: "art. 60.2 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l03-q0146
  prompt:
    es: "Conforme al artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Ministros, como titulares del departamento, dirigen los sectores de actividad administrativa integrados en su Ministerio y asumen:"
  options:
  - id: a
    text:
      es: "La responsabilidad subsidiaria del Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "La responsabilidad inherente a dicha dirección."
  - id: c
    text:
      es: "La responsabilidad solidaria con los Secretarios de Estado."
  - id: d
    text:
      es: "La representación ordinaria del Ministerio."
  explanation:
    es: "El artículo 61 les atribuye la responsabilidad inherente a esa dirección. No es subsidiaria del Consejo de Ministros ni solidaria con los Secretarios de Estado. La representación ordinaria del Ministerio corresponde a los Subsecretarios según el artículo 63.1."
  citation: "art. 61 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-61
- id: m01-l03-q0149
  prompt:
    es: "De acuerdo con el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, entre las funciones de los Ministros está declarar la lesividad de los actos administrativos cuando les corresponda y también:"
  options:
  - id: a
    text:
      es: "Nombrar a los Subdelegados del Gobierno en las provincias."
  - id: b
    correct: true
    text:
      es: "Resolver los recursos administrativos."
  - id: c
    text:
      es: "Ejercer la jefatura de las Fuerzas y Cuerpos de Seguridad del Estado en la Comunidad."
  - id: d
    text:
      es: "Elevar al Gobierno un informe anual sobre los servicios públicos estatales."
  explanation:
    es: "El artículo 61.ñ une la resolución de los recursos administrativos y la declaración de lesividad. Nombrar a los Subdelegados, dirigir las Fuerzas y Cuerpos de Seguridad en la Comunidad y elevar el informe anual son competencias de los Delegados del Gobierno según el artículo 73."
  citation: "art. 61.ñ LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-57
- id: m01-l03-q0162
  prompt:
    es: "Conforme al artículo 57.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, mediante Real Decreto del Presidente del Gobierno se efectúa:"
  options:
  - id: a
    text:
      es: "La creación y supresión de las Direcciones Generales y de las Subdirecciones Generales."
  - id: b
    correct: true
    text:
      es: "La determinación del número, la denominación y el ámbito de competencia de los Ministerios y de las Secretarías de Estado."
  - id: c
    text:
      es: "La creación y supresión de los órganos de nivel inferior a Subdirección General."
  - id: d
    text:
      es: "La determinación de la estructura de las Delegaciones y Subdelegaciones del Gobierno."
  explanation:
    es: "El artículo 57.3 reserva al Real Decreto del Presidente del Gobierno el número, la denominación y el ámbito de competencia de los Ministerios y de las Secretarías de Estado. Las Direcciones Generales y las Subdirecciones Generales se crean y suprimen por Real Decreto del Consejo de Ministros, según el artículo 59.1. Los órganos de nivel inferior a Subdirección General se crean y suprimen por orden del Ministro respectivo, según el artículo 59.2. La estructura de las Delegaciones y Subdelegaciones del Gobierno se fija por Real Decreto del Consejo de Ministros, según el artículo 76.1."
  citation: "art. 57.3 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-62
- id: m01-l03-q0165
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios de Estado dirigen y coordinan las Secretarías y las Direcciones Generales bajo su dependencia y responden:"
  options:
  - id: a
    correct: true
    text:
      es: "Ante el Ministro."
  - id: b
    text:
      es: "Ante el Subsecretario del Departamento."
  - id: c
    text:
      es: "Ante el Consejo de Ministros."
  - id: d
    text:
      es: "Ante el Secretario general técnico."
  explanation:
    es: "El artículo 62.2 dice que responden ante el Ministro. No responden ante el Subsecretario, que depende igual que ellos del Ministro, ni ante el Consejo de Ministros, ni ante el Secretario general técnico, que está bajo el Subsecretario."
  citation: "art. 62.2 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-7
- id: m01-l03-q0166
  prompt:
    es: "Conforme al artículo 7.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los Secretarios de Estado adscritos a la Presidencia del Gobierno actúan bajo la dirección:"
  options:
  - id: a
    text:
      es: "Del Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: b
    text:
      es: "Del Subsecretario de la Presidencia."
  - id: c
    correct: true
    text:
      es: "Del Presidente del Gobierno."
  - id: d
    text:
      es: "Del Consejo de Ministros."
  explanation:
    es: "El artículo 7.2 dice que, cuando están adscritos a la Presidencia del Gobierno, actúan bajo la dirección del Presidente. No actúan bajo la de otro Ministro, ni la de un Subsecretario, ni la del Consejo de Ministros."
  citation: "art. 7.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
