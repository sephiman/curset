# SPDX-License-Identifier: AGPL-3.0-only
# aeat-agentes-hacienda glossary. Same rules as content/crypto-futures/glossary.yaml: the glossary refers, it does
# not teach; ids are permanent; origin names the lesson that teaches the term; the glossary never coins.
# Round R2, common part (2026-11-11): entries copied from age-auxiliar-c2 or age-administrativo-c1 under R2.3 (same
# term, definition, citations and cited-file sha256); provenance in docs/age-verification/aeat/r2/glossary.md.
terms:
- id: g-consejo-general-del-poder-judicial
  es: Consejo General del Poder Judicial
  origin: m01-l01
  definition:
    es: Órgano de gobierno del Poder Judicial. Lo integran el Presidente del Tribunal Supremo, que lo preside, y veinte Vocales
      nombrados por el Rey por un período de cinco años (art. 122 CE).
- id: g-cuestion-de-inconstitucionalidad
  es: cuestión de inconstitucionalidad
  origin: m01-l01
  definition:
    es: La que plantea un órgano judicial ante el Tribunal Constitucional cuando una norma con rango de ley aplicable al caso,
      de cuya validez dependa el fallo, puede ser contraria a la Constitución (art. 163 CE).
- id: g-defensor-del-pueblo
  es: Defensor del Pueblo
  origin: m01-l01
  definition:
    es: Alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos del título I de la Constitución,
      que puede supervisar la actividad de la Administración (art. 54 CE). Se elige para cinco años (art. 2.1 LO 3/1981).
- id: g-derecho-de-gracia
  es: derecho de gracia
  origin: m01-l01
  definition:
    es: Función del Rey que ejerce con arreglo a la ley. Esa ley no puede autorizar indultos generales (art. 62.i CE).
- id: g-estado-de-excepcion
  es: estado de excepción
  origin: m01-l01
  definition:
    es: Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso. Su duración
      no puede exceder de treinta días, prorrogables por otro plazo igual (art. 116.3 CE).
- id: g-iniciativa-popular
  es: iniciativa popular
  origin: m01-l01
  definition:
    es: Presentación de proposiciones de ley por los ciudadanos, con no menos de 500.000 firmas acreditadas. No procede en
      materias propias de ley orgánica, tributarias o de carácter internacional, ni en la prerrogativa de gracia (art. 87.3
      CE).
- id: g-investidura
  es: investidura
  origin: m01-l01
  definition:
    es: 'Votación en la que el Congreso otorga su confianza al candidato a Presidente del Gobierno: mayoría absoluta en la
      primera votación o mayoría simple en otra cuarenta y ocho horas después (art. 99 CE).'
- id: g-inviolabilidad-parlamentaria
  es: inviolabilidad
  origin: m01-l02
  definition:
    es: Prerrogativa de Diputados y Senadores por las opiniones manifestadas en el ejercicio de sus funciones (art. 71.1 CE).
      Dura aun después de haber cesado en el mandato (art. 10 Reglamento del Congreso).
  link_except:
  - m01-l01
- id: g-ley-organica
  es: ley orgánica
  origin: m01-l01
  definition:
    es: Ley relativa al desarrollo de los derechos fundamentales y de las libertades públicas, la que aprueba los Estatutos
      de Autonomía y el régimen electoral general y las demás previstas en la Constitución. Su aprobación, modificación o
      derogación exige mayoría absoluta del Congreso en una votación final (art. 81 CE).
- id: g-ministerio-fiscal
  es: Ministerio Fiscal
  origin: m01-l01
  definition:
    es: Órgano que promueve la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés
      público tutelado por la ley. Actúa conforme a los principios de unidad de actuación y dependencia jerárquica (art. 124
      CE).
- id: g-mocion-de-censura
  es: moción de censura
  origin: m01-l01
  definition:
    es: Instrumento con el que el Congreso exige la responsabilidad política del Gobierno. La proponen al menos la décima
      parte de los Diputados con un candidato a la Presidencia y se adopta por mayoría absoluta (art. 113 CE).
  link_except:
  - m01-l04
- id: g-monarquia-parlamentaria
  es: Monarquía parlamentaria
  origin: m01-l01
  definition:
    es: La forma política del Estado español (art. 1.3 CE). El Rey es el Jefe del Estado y sus actos necesitan refrendo.
- id: g-personas-con-discapacidad
  es: personas con discapacidad
  origin: m01-l01
  definition:
    es: Aquellas que presentan deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes que,
      al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en la sociedad, en igualdad de
      condiciones con los demás (art. 4.1 RDL 1/2013).
- id: g-principios-rectores
  es: principios rectores de la política social y económica
  origin: m01-l01
  definition:
    es: Los del capítulo tercero del título I de la Constitución. Informan la legislación, la práctica judicial y la actuación
      de los poderes públicos, y solo pueden alegarse ante la Jurisdicción ordinaria según las leyes que los desarrollen (art.
      53.3 CE).
- id: g-recurso-de-amparo
  es: recurso de amparo
  origin: m01-l01
  definition:
    es: Recurso ante el Tribunal Constitucional contra la violación de los derechos de los artículos 14 a 29 y de la objeción
      de conciencia del artículo 30 de la Constitución (art. 53.2 CE; art. 41.1 LOTC).
- id: g-recurso-de-inconstitucionalidad
  es: recurso de inconstitucionalidad
  origin: m01-l01
  definition:
    es: Recurso ante el Tribunal Constitucional contra leyes y disposiciones normativas con fuerza de ley. Se formula en tres
      meses desde la publicación de la norma (art. 161.1.a CE; art. 33.1 LOTC).
- id: g-referendum-consultivo
  es: referéndum consultivo
  origin: m01-l01
  definition:
    es: Consulta a todos los ciudadanos sobre decisiones políticas de especial trascendencia. Lo convoca el Rey, mediante
      propuesta del Presidente del Gobierno, previamente autorizada por el Congreso (art. 92 CE).
- id: g-refrendo
  es: refrendo
  origin: m01-l01
  definition:
    es: Requisito de los actos del Rey, que refrendan el Presidente del Gobierno y, en su caso, los Ministros competentes,
      o el Presidente del Congreso en los casos del artículo 64.1; de esos actos responden quienes los refrendan. Sin refrendo,
      el acto del Rey carece de validez, salvo lo dispuesto en el artículo 65.2 (arts. 56.3 y 64 CE).
- id: g-regencia
  es: Regencia
  origin: m01-l01
  definition:
    es: Institución que se ejerce por mandato constitucional y siempre en nombre del Rey cuando este es menor de edad o cuando
      las Cortes Generales reconocen su inhabilitación. Para ejercerla es preciso ser español y mayor de edad (art. 59 CE).
- id: g-comision-mixta
  es: Comisión Mixta
  origin: m01-l02
  definition:
    es: Comisión de igual número de Diputados y Senadores que busca el acuerdo entre las dos Cámaras en las decisiones del
      artículo 74.2. Si su texto no se aprueba, decide el Congreso por mayoría absoluta (art. 74.2 CE).
- id: g-comisiones-delegadas
  es: Comisiones Delegadas del Gobierno
  origin: m01-l02
  definition:
    es: Órganos colegiados del Gobierno creados por Real Decreto del Consejo de Ministros, a propuesta del Presidente, para
      los asuntos que afectan a varios Ministerios (art. 6 Ley 50/1997).
- id: g-cuestion-de-confianza
  es: cuestión de confianza
  origin: m01-l02
  definition:
    es: Votación que el Presidente del Gobierno plantea ante el Congreso, previa deliberación del Consejo de Ministros, sobre
      su programa o sobre una declaración de política general. La confianza se entiende otorgada con la mayoría simple de
      los Diputados (art. 112 CE).
  link_except:
  - m01-l04
- id: g-diputacion-permanente
  es: Diputación Permanente
  origin: m01-l02
  definition:
    es: Órgano de cada Cámara, presidido por su Presidente y con un mínimo de veintiún miembros, que vela por sus poderes
      cuando no está reunida y sigue en funciones tras la disolución hasta la constitución de las nuevas Cortes Generales
      (art. 78 CE).
- id: g-fondo-de-compensacion
  es: Fondo de Compensación
  origin: m01-l02
  definition:
    es: Fondo con destino a gastos de inversión, creado para corregir desequilibrios económicos interterritoriales y hacer
      efectivo el principio de solidaridad. Sus recursos los distribuyen las Cortes Generales entre las Comunidades Autónomas
      y provincias, en su caso (art. 158.2 CE).
- id: g-grupo-mixto
  es: Grupo Mixto
  origin: m01-l02
  definition:
    es: Grupo al que quedan incorporados los miembros de la Cámara que no se integran en otro Grupo Parlamentario en el plazo
      señalado (art. 25.1 Reglamento del Congreso).
- id: g-grupo-parlamentario
  es: Grupo Parlamentario
  origin: m01-l02
  definition:
    es: Agrupación de los miembros de una Cámara. En el Congreso exige quince diputados, o cinco escaños con determinados
      porcentajes de voto (art. 23.1 Reglamento del Congreso); en el Senado, al menos diez Senadores (art. 27.1 Reglamento
      del Senado).
- id: g-inmunidad-parlamentaria
  es: inmunidad
  origin: m01-l02
  definition:
    es: 'Prerrogativa de Diputados y Senadores durante su mandato: solo pueden ser detenidos en caso de flagrante delito y
      no pueden ser inculpados ni procesados sin la previa autorización de su Cámara (art. 71.2 CE).'
- id: g-interesado
  es: interesado
  origin: m02-l03
  definition:
    es: En el procedimiento administrativo, quien lo promueve como titular de derechos o intereses legítimos individuales
      o colectivos; quien, sin haberlo iniciado, tiene derechos que puedan resultar afectados por la decisión que en él se
      adopte; y quien tiene intereses legítimos, individuales o colectivos, que puedan resultar afectados por la resolución
      y se persona en el procedimiento en tanto no haya recaído resolución definitiva (art. 4.1 LPAC).
- id: g-juez-de-paz
  es: juez de paz
  origin: m01-l02
  definition:
    es: Juez que existe en cada municipio donde no hay Tribunal de Instancia. Lo elige el Pleno del Ayuntamiento y lo nombra
      por cuatro años la Sala de Gobierno del Tribunal Superior de Justicia (arts. 99 y 101 LOPJ).
- id: g-junta-de-portavoces
  es: Junta de Portavoces
  origin: m01-l02
  definition:
    es: Órgano formado por los portavoces de los grupos parlamentarios y presidido por el Presidente de la Cámara. En el Congreso
      decide siempre por voto ponderado (art. 39 Reglamento del Congreso).
- id: g-ley-de-bases
  es: ley de bases
  origin: m01-l02
  definition:
    es: Ley con la que las Cortes Generales delegan en el Gobierno la formación de textos articulados (art. 82.2 CE).
- id: g-mandato-imperativo
  es: mandato imperativo
  origin: m01-l02
  definition:
    es: 'Vínculo que la Constitución excluye para los parlamentarios: los miembros de las Cortes Generales no están ligados
      por mandato imperativo (art. 67.2 CE).'
- id: g-municipio
  es: municipio
  origin: m01-l02
  definition:
    es: Entidad local básica de la organización territorial del Estado, con personalidad jurídica y plena capacidad para cumplir
      sus fines. Sus elementos son el territorio, la población y la organización (art. 11 LBRL).
- id: g-partido-judicial
  es: partido judicial
  origin: m01-l02
  definition:
    es: Unidad territorial integrada por uno o más municipios limítrofes de una misma provincia. En cada uno hay un Tribunal
      de Instancia (arts. 32.1 y 84.1 LOPJ).
- id: g-potestad-jurisdiccional
  es: potestad jurisdiccional
  origin: m01-l02
  definition:
    es: Juzgar y hacer ejecutar lo juzgado en todo tipo de procesos. Corresponde exclusivamente a los Juzgados y Tribunales
      determinados por las leyes (art. 117.3 CE).
- id: g-presupuestos-generales-del-estado
  es: Presupuestos Generales del Estado
  origin: m01-l02
  definition:
    es: Expresión cifrada, conjunta y sistemática de los derechos y obligaciones a liquidar durante el ejercicio por cada
      uno de los órganos y entidades que forman parte del sector público estatal (art. 32 LGP).
- id: g-provincia
  es: provincia
  origin: m01-l02
  definition:
    es: Entidad local con personalidad jurídica propia, determinada por la agrupación de municipios y división territorial
      para el cumplimiento de las actividades del Estado (art. 141.1 CE). La gobierna la Diputación u otra Corporación de
      carácter representativo.
- id: g-servicio-activo
  es: servicio activo
  origin: m01-l02
  definition:
    es: Situación administrativa de quien presta servicios en su condición de funcionario público, cualquiera que sea la Administración
      u organismo público o entidad en que esté destinado, y no le corresponda quedar en otra situación (art. 86.1 TREBEP).
- id: g-sesion-conjunta
  es: sesión conjunta
  origin: m01-l02
  definition:
    es: Reunión del Congreso y el Senado juntos. Se usa para las competencias no legislativas que el título II de la Constitución
      atribuye expresamente a las Cortes Generales (art. 74.1 CE).
- id: g-suplicatorio
  es: suplicatorio
  origin: m01-l02
  definition:
    es: Solicitud de la autorización de la Cámara para inculpar o procesar a uno de sus miembros. En el Congreso se entiende
      denegado si la Cámara no se pronuncia en sesenta días naturales, computados durante el período de sesiones a partir
      del día siguiente al de su recibo (arts. 13.1 y 14.2 Reglamento del Congreso).
- id: g-tribunal-de-instancia
  es: Tribunal de Instancia
  origin: m01-l02
  definition:
    es: Órgano judicial que existe en cada partido judicial, con sede en su capital, y que se organiza en Secciones (art.
      84 LOPJ). Se constituyó transformando los antiguos Juzgados en esas Secciones (disposición transitoria primera LO 1/2025).
- id: g-tribunal-superior-de-justicia
  es: Tribunal Superior de Justicia
  origin: m01-l02
  definition:
    es: Órgano judicial que culmina la organización judicial en el ámbito territorial de la Comunidad Autónoma, sin perjuicio
      de la jurisdicción que corresponde al Tribunal Supremo (art. 152.1 CE).
- id: g-veto
  es: veto
  origin: m01-l02
  definition:
    es: Oposición del Senado, mediante mensaje motivado y por mayoría absoluta, a un proyecto aprobado por el Congreso. El
      Congreso la levanta ratificando el texto inicial por mayoría absoluta, o por mayoría simple pasados dos meses (art.
      90.2 CE).
- id: g-autoridad-administrativa-independiente
  es: autoridad administrativa independiente
  origin: m01-l03
  definition:
    es: Entidad de derecho público de ámbito estatal, con personalidad jurídica propia y vinculada a la Administración General
      del Estado, con funciones de regulación o supervisión de carácter externo sobre sectores económicos o actividades determinadas
      que requieren independencia funcional o una especial autonomía respecto de ella, lo que determina una norma con rango
      de ley (art. 109.1 LRJSP).
- id: g-consejo-de-estado
  es: Consejo de Estado
  origin: m01-l03
  definition:
    es: Supremo órgano consultivo del Gobierno (art. 107 CE; art. 1.1 LO 3/1980).
- id: g-decreto-legislativo
  es: decreto legislativo
  origin: m01-l03
  definition:
    es: Disposición del Gobierno que contiene legislación delegada por las Cortes Generales, mediante una ley de bases para
      formar textos articulados o una ley ordinaria para refundir varios textos legales en uno solo (arts. 82.1, 82.2 y 85
      CE).
- id: g-delegado-del-gobierno
  es: Delegado del Gobierno
  origin: m01-l03
  match:
    es:
    - Delegado del Gobierno
    - Delegados del Gobierno
  definition:
    es: Órgano directivo con rango de Subsecretario que representa al Gobierno de la Nación en una Comunidad Autónoma y dirige
      allí la Administración General del Estado. Lo nombra el Consejo de Ministros a propuesta del Presidente del Gobierno
      (art. 72 LRJSP).
- id: g-entidad-local
  es: entidades locales
  origin: m01-l03
  definition:
    es: Son Entidades Locales territoriales el Municipio, la Provincia y la Isla en los archipiélagos balear y canario; tienen
      también esa condición las comarcas, las áreas metropolitanas y las mancomunidades de municipios (art. 3 LBRL).
- id: g-estado-de-sitio
  es: estado de sitio
  origin: m01-l03
  definition:
    es: Lo declara la mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno. El Congreso determina su ámbito territorial,
      duración y condiciones (art. 116.4 CE).
- id: g-funcionario-de-carrera
  es: funcionario de carrera
  origin: m01-l03
  match:
    es:
    - funcionario de carrera
    - funcionarios de carrera
  definition:
    es: Quien, en virtud de nombramiento legal, está vinculado a una Administración Pública por una relación estatutaria regulada
      por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente (art.
      9.1 TREBEP).
- id: g-gobierno-en-funciones
  es: Gobierno en funciones
  origin: m01-l03
  definition:
    es: El Gobierno cesante, que continúa hasta la toma de posesión del nuevo y limita su gestión al despacho ordinario de
      los asuntos públicos (art. 101.2 CE; art. 21 Ley 50/1997).
- id: g-libre-designacion
  es: libre designación
  origin: m01-l03
  definition:
    es: Procedimiento de provisión de puestos que consiste en la apreciación discrecional por el órgano competente de la idoneidad
      de los candidatos en relación con los requisitos exigidos para el desempeño del puesto. Sus titulares pueden ser cesados
      discrecionalmente (art. 80.1 y 80.4 TREBEP).
- id: g-ministro-sin-cartera
  es: Ministros sin cartera
  origin: m01-l03
  definition:
    es: Ministros que no son titulares de un Departamento y a los que se atribuye la responsabilidad de determinadas funciones
      gubernamentales (art. 4.2 Ley 50/1997).
- id: g-normalizacion
  es: normalización
  origin: m01-l03
  definition:
    es: Principio en virtud del cual las personas con discapacidad deben poder llevar una vida en igualdad de condiciones,
      accediendo a los mismos lugares, ámbitos, bienes y servicios que están a disposición de cualquier otra persona (art.
      2.i) RDL 1/2013).
- id: g-organo-colegiado
  es: órgano colegiado
  origin: m01-l03
  definition:
    es: Órgano que se crea formalmente, está integrado por tres o más personas, tiene atribuidas funciones administrativas
      de decisión, propuesta, asesoramiento, seguimiento o control y actúa integrado en la Administración General del Estado
      o en alguno de sus Organismos públicos (art. 20.1 LRJSP).
- id: g-organos-directivos
  es: órganos directivos
  origin: m01-l03
  definition:
    es: Los Subsecretarios, Secretarios generales, Secretarios generales técnicos, Directores generales y Subdirectores generales;
      en el territorio, los Delegados y Subdelegados del Gobierno, y en el exterior, los embajadores y representantes permanentes
      ante Organizaciones internacionales. Desarrollan y ejecutan los planes de los órganos superiores (art. 55 LRJSP).
- id: g-organos-superiores
  es: órganos superiores
  origin: m01-l03
  definition:
    es: En la organización central de la Administración General del Estado, los Ministros y los Secretarios de Estado. Establecen
      los planes de actuación de la organización a su cargo (art. 55.3 y 55.9 LRJSP).
- id: g-personal-eventual
  es: personal eventual
  origin: m01-l03
  definition:
    es: El que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como
      de confianza o asesoramiento especial, retribuido con cargo a los créditos presupuestarios consignados para este fin
      (art. 12.1 TREBEP).
- id: g-potestad-reglamentaria
  es: potestad reglamentaria
  origin: m01-l03
  definition:
    es: Potestad para dictar reglamentos y otras disposiciones (título VI LPAC). Su ejercicio corresponde al Gobierno de la
      Nación, a los órganos de Gobierno de las Comunidades Autónomas, de conformidad con sus respectivos Estatutos, y a los
      órganos de gobierno locales, de acuerdo con la Constitución, los Estatutos de Autonomía y la Ley 7/1985 (art. 128.1
      LPAC). El Gobierno la ejerce de acuerdo con la Constitución y las leyes (art. 97 CE).
- id: g-recusacion
  es: recusación
  origin: m01-l03
  definition:
    es: Petición que los interesados pueden plantear por escrito, en cualquier momento de la tramitación del procedimiento,
      para que se sustituya a la autoridad o al personal al servicio de las Administraciones en quien concurra alguna de las
      circunstancias de abstención del artículo 23 (art. 24.1–3 LRJSP).
- id: g-separacion-del-servicio
  es: separación del servicio
  origin: m01-l03
  definition:
    es: Sanción disciplinaria que solo puede imponerse por faltas muy graves; en los funcionarios interinos comporta la revocación
      de su nombramiento (art. 96.1.a) TREBEP).
- id: g-servicios-comunes
  es: servicios comunes
  origin: m01-l03
  definition:
    es: Órganos de cada Ministerio que asisten a los demás en funciones como la planificación y presupuestación, los recursos
      humanos, la producción normativa, la asistencia jurídica, la gestión financiera y la inspección de servicios. Los dirige
      el Subsecretario (arts. 63.1 y 68.1 LRJSP).
  link_except:
  - m01-l05
  - m01-l07
- id: g-subdelegado-del-gobierno
  es: Subdelegado del Gobierno
  origin: m01-l03
  match:
    es:
    - Subdelegado del Gobierno
    - Subdelegados del Gobierno
  definition:
    es: Órgano directivo con nivel de Subdirector General que existe en cada provincia bajo la inmediata dependencia del Delegado
      del Gobierno. Lo nombra el Delegado por libre designación entre funcionarios de carrera del Subgrupo A1 (art. 74 LRJSP).
- id: g-accesibilidad-universal
  es: accesibilidad universal
  origin: m01-l04
  definition:
    es: Condición que deben cumplir los entornos, procesos, bienes, productos y servicios, así como los objetos, instrumentos,
      herramientas y dispositivos, para ser comprensibles, utilizables y practicables por todas las personas en condiciones
      de seguridad y comodidad y de la forma más autónoma y natural posible (art. 2.k) RDL 1/2013).
- id: g-area-metropolitana
  es: áreas metropolitanas
  origin: m01-l04
  definition:
    es: Entidades locales integradas por los municipios de grandes aglomeraciones urbanas cuyos núcleos tienen vinculaciones
      económicas y sociales que exigen planificación conjunta y coordinación de servicios y obras (art. 43.2 LBRL).
- id: g-concejo-abierto
  es: Concejo Abierto
  origin: m01-l04
  definition:
    es: Régimen de gobierno municipal en el que el gobierno y la administración corresponden a un Alcalde y a una asamblea
      vecinal de la que forman parte todos los electores (art. 29.3 LBRL).
- id: g-declaracion-de-lesividad
  es: declaración de lesividad
  origin: m01-l04
  definition:
    es: Declaración, previa a su impugnación por la Administración ante el orden jurisdiccional contencioso-administrativo,
      de que un acto favorable para los interesados y anulable conforme al artículo 48 es lesivo para el interés público (art.
      107.1 LPAC).
- id: g-directiva
  es: directiva
  origin: m02-l01
  definition:
    es: Acto de la Unión que obliga al Estado miembro destinatario en cuanto al resultado y deja a las autoridades nacionales
      la elección de la forma y de los medios (art. 288 TFUE).
  link_except:
  - m01-l01
- id: g-estatuto-de-autonomia
  es: Estatuto de Autonomía
  origin: m01-l04
  definition:
    es: La norma institucional básica de cada Comunidad Autónoma, que el Estado reconoce y ampara como parte integrante de
      su ordenamiento jurídico. Se aprueba por ley orgánica y su reforma requiere en todo caso la aprobación de las Cortes
      Generales mediante ley orgánica (arts. 81.1, 147.1 y 147.3 CE).
- id: g-junta-de-gobierno-local
  es: Junta de Gobierno Local
  origin: m01-l04
  definition:
    es: Órgano municipal formado por el Alcalde y Concejales en número no superior al tercio del número legal, que asiste
      al Alcalde. Existe en los municipios de más de 5.000 habitantes y en los de menos si lo prevé el reglamento orgánico
      o lo acuerda el Pleno (arts. 20.1.b y 23 LBRL).
- id: g-ley-marco
  es: ley marco
  origin: m01-l04
  definition:
    es: Ley estatal por la que las Cortes Generales atribuyen a todas o a alguna de las Comunidades Autónomas la facultad
      de dictar normas legislativas en materias de competencia estatal, en el marco de los principios, bases y directrices
      que fija. Cada ley marco establece el control de las Cortes sobre esas normas (art. 150.1 CE).
- id: g-mancomunidad
  es: mancomunidades
  origin: m01-l04
  definition:
    es: Asociaciones de municipios para la ejecución en común de obras y servicios determinados de su competencia, con personalidad
      jurídica y Estatutos propios (art. 44 LBRL).
- id: g-mayoria-cualificada-consejo
  es: mayoría cualificada
  origin: m01-l04
  definition:
    es: En el Consejo de la Unión, desde el 1 de noviembre de 2014, un mínimo del 55 % de sus miembros que incluya al menos
      a quince de ellos y represente como mínimo el 65 % de la población de la Unión (art. 16.4 TUE). Si el Consejo no actúa
      a propuesta de la Comisión o del Alto Representante, el mínimo es el 72 % de los miembros (art. 238.2 TFUE).
- id: g-minoria-de-bloqueo
  es: minoría de bloqueo
  origin: m01-l04
  definition:
    es: En el Consejo de la Unión, al menos cuatro miembros; a falta de ella, la mayoría cualificada se considera alcanzada
      (art. 16.4 TUE).
- id: g-municipio-gran-poblacion
  es: municipios de gran población
  origin: m01-l04
  definition:
    es: 'Municipios a los que se aplica el régimen de organización del título X de la LBRL: los de más de 250.000 habitantes
      y las capitales de provincia de más de 175.000 y, si lo decide la Asamblea Legislativa a iniciativa del ayuntamiento,
      las capitales de provincia, las capitales autonómicas, las sedes de las instituciones autonómicas y los de más de 75.000
      con circunstancias económicas, sociales, históricas o culturales especiales (art. 121.1 LBRL).'
- id: g-padron-municipal
  es: Padrón municipal
  origin: m01-l04
  definition:
    es: Registro administrativo donde constan los vecinos de un municipio. Sus datos prueban la residencia y el domicilio
      habitual, y sus certificaciones son documento público y fehaciente (art. 16.1 LBRL).
- id: g-termino-municipal
  es: término municipal
  origin: m01-l04
  definition:
    es: Territorio en que el ayuntamiento ejerce sus competencias. Cada municipio pertenece a una sola provincia (art. 12
      LBRL).
- id: g-tribunal-de-cuentas
  es: Tribunal de Cuentas
  origin: m01-l04
  definition:
    es: Supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado y del sector público; depende directamente
      de las Cortes Generales (art. 136.1 CE).
- id: g-vecino
  es: vecinos
  origin: m01-l04
  definition:
    es: Las personas inscritas en el Padrón municipal. La condición de vecino se adquiere en el momento de la inscripción
      (art. 15 LBRL).
- id: g-agencia-espanola-de-proteccion-de-datos
  es: Agencia Española de Protección de Datos
  origin: m01-l05
  definition:
    es: Autoridad administrativa independiente de ámbito estatal, con personalidad jurídica y plena capacidad pública y privada,
      que actúa con plena independencia de los poderes públicos en el ejercicio de sus funciones (art. 44.1 LOPDGDD).
- id: g-archivo-electronico-unico
  es: archivo electrónico único
  origin: m01-l05
  definition:
    es: Conjunto de sistemas y servicios de cada Administración que sustenta la gestión, custodia y recuperación de los documentos
      y expedientes electrónicos una vez finalizados los procedimientos administrativos o actuaciones correspondientes (art.
      17.1 LPAC; art. 55.1 RD 203/2021).
- id: g-carpeta-ciudadana
  es: Carpeta Ciudadana
  origin: m01-l05
  definition:
    es: Área personalizada de las personas interesadas en su relación con el sector público estatal, accesible a través de
      la sede electrónica del Punto de Acceso General electrónico (art. 8.1 y 8.2 RD 203/2021).
- id: g-categorias-especiales-de-datos
  es: categorías especiales de datos
  origin: m01-l05
  definition:
    es: Datos personales que revelan el origen étnico o racial, las opiniones políticas, las convicciones religiosas o filosóficas
      o la afiliación sindical, y los datos genéticos, biométricos dirigidos a identificar de manera unívoca a una persona,
      relativos a la salud o a la vida u orientación sexual, cuyo tratamiento está prohibido salvo en los casos del artículo
      9.2 (art. 9 RGPD).
- id: g-certificado-electronico
  es: certificado electrónico
  origin: m01-l05
  definition:
    es: Documento emitido y firmado por la Autoridad de Certificación que identifica una clave pública con su propietario
      (anexo RD 203/2021).
- id: g-consentimiento-del-interesado
  es: consentimiento del interesado
  origin: m01-l05
  definition:
    es: Toda manifestación de voluntad libre, específica, informada e inequívoca por la que el interesado acepta, mediante
      una declaración o una clara acción afirmativa, el tratamiento de los datos personales que le conciernen (art. 4.11 RGPD;
      art. 6.1 LOPDGDD).
- id: g-consulta-publica
  es: consulta pública
  origin: m01-l05
  definition:
    es: Trámite previo a la elaboración de un proyecto o anteproyecto de ley o de reglamento, en el portal web de la Administración
      competente, que recaba la opinión de los sujetos y de las organizaciones más representativas potencialmente afectados
      por la futura norma (art. 133.1 LPAC).
- id: g-convenio
  es: convenio
  origin: m01-l03
  definition:
    es: Acuerdo con efectos jurídicos adoptado por las Administraciones Públicas, los organismos públicos y entidades de derecho
      público vinculados o dependientes o las Universidades públicas entre sí o con sujetos de derecho privado para un fin
      común (art. 47.1 LRJSP).
  link_except:
  - m01-l07
  - m03-l01
- id: g-datos-personales
  es: datos personales
  origin: m01-l05
  definition:
    es: Toda información sobre una persona física identificada o identificable, a la que el RGPD llama «el interesado» (art.
      4.1 RGPD).
- id: g-derecho-de-acceso-a-la-informacion-publica
  es: derecho de acceso a la información pública
  origin: m01-l05
  definition:
    es: El derecho de todas las personas a acceder a la información pública, en los términos del artículo 105.b) de la Constitución,
      sin obligación de motivar la solicitud (arts. 12 y 17.3 Ley 19/2013).
- id: g-empleado-publico
  es: empleado público
  origin: m01-l05
  match:
    es:
    - empleado público
    - empleados públicos
  definition:
    es: Quien desempeña funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales (art.
      8.1 TREBEP).
- id: g-encargado-del-tratamiento
  es: encargado del tratamiento
  origin: m01-l05
  definition:
    es: Persona física o jurídica, autoridad pública, servicio u otro organismo que trata datos personales por cuenta del
      responsable del tratamiento (art. 4.8 RGPD).
- id: g-informacion-publica
  es: información pública
  origin: m01-l05
  definition:
    es: Los contenidos o documentos, cualquiera que sea su formato o soporte, que obren en poder de un sujeto obligado por
      la Ley 19/2013 y que haya elaborado o adquirido en el ejercicio de sus funciones (art. 13 Ley 19/2013).
  link_except:
  - m02-l01
  - m02-l04
- id: g-limitacion-del-tratamiento
  es: limitación del tratamiento
  origin: m01-l05
  definition:
    es: Marcado de los datos de carácter personal conservados con el fin de limitar su tratamiento en el futuro (art. 4.3
      RGPD).
- id: g-oposicion
  es: oposición
  origin: m00-l01
  definition:
    es: Sistema selectivo que consiste en la celebración de una o más pruebas para determinar la capacidad de los aspirantes
      y fijar su orden de prelación (art. 114.5 RDL 6/2023).
  link_except:
  - m01-l05
  - m02-l03
  - m02-l04
- id: g-portal-de-internet
  es: portal de internet
  origin: m01-l05
  definition:
    es: Punto de acceso electrónico cuya titularidad corresponde a una Administración Pública, organismo público o entidad
      de Derecho Público y que permite el acceso a través de internet a la información publicada y, en su caso, a la sede
      electrónica correspondiente (art. 39 LRJSP).
- id: g-publicidad-activa
  es: publicidad activa
  origin: m01-l05
  definition:
    es: La información relevante para garantizar la transparencia de su actividad que los sujetos obligados por la Ley 19/2013
      publican de forma periódica y actualizada en sus sedes electrónicas o páginas web (arts. 5–8 Ley 19/2013).
- id: g-punto-de-acceso-general
  es: Punto de Acceso General
  origin: m01-l05
  definition:
    es: Portal de internet que facilita el acceso a los servicios, trámites e información de los órganos, organismos públicos
      y entidades de la Administración correspondiente y aglutina o conduce a sus sedes electrónicas (anexo RD 203/2021).
      El de la Administración General del Estado lo regula la Orden HAP/1949/2014.
- id: g-registro-electronico-general
  es: Registro Electrónico General
  origin: m01-l05
  definition:
    es: Registro de cada Administración en el que se hace el asiento de todo documento que sea presentado o que se reciba
      en cualquier órgano administrativo, Organismo público o Entidad vinculado o dependiente (art. 16.1 LPAC).
- id: g-responsabilidad-proactiva
  es: responsabilidad proactiva
  origin: m01-l05
  definition:
    es: Principio por el que el responsable del tratamiento responde del cumplimiento de los principios del artículo 5.1 del
      RGPD y debe ser capaz de demostrarlo (art. 5.2 RGPD).
- id: g-responsable-del-tratamiento
  es: responsable del tratamiento
  origin: m01-l05
  definition:
    es: Persona física o jurídica, autoridad pública, servicio u otro organismo que, solo o junto con otros, determina los
      fines y medios del tratamiento de datos personales (art. 4.7 RGPD).
- id: g-sede-electronica
  es: sede electrónica
  origin: m01-l05
  definition:
    es: Dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde
      a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público en el ejercicio
      de sus competencias (art. 38.1 LRJSP).
- id: g-sello-electronico
  es: sello electrónico
  origin: m01-l05
  definition:
    es: Datos en formato electrónico anejos a otros datos en formato electrónico, o asociados de manera lógica con ellos,
      para garantizar el origen y la integridad de estos últimos (anexo RD 203/2021).
- id: g-silencio-administrativo
  es: silencio administrativo
  origin: m01-l05
  definition:
    es: En el acceso a la información, la solicitud se entiende desestimada si transcurre el plazo máximo sin resolución expresa
      notificada, y la reclamación ante el Consejo de Transparencia se entiende desestimada pasados tres meses sin resolución
      (arts. 20.4 y 24.4 Ley 19/2013).
- id: g-acoso-por-razon-de-sexo
  es: acoso por razón de sexo
  origin: m01-l06
  definition:
    es: Cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de atentar contra
      su dignidad y de crear un entorno intimidatorio, degradante u ofensivo (art. 7.2 LO 3/2007).
- id: g-acoso-sexual
  es: acoso sexual
  origin: m01-l06
  definition:
    es: A los efectos de la LO 3/2007 y sin perjuicio del Código Penal, cualquier comportamiento, verbal o físico, de naturaleza
      sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando
      se crea un entorno intimidatorio, degradante u ofensivo (art. 7.1 LO 3/2007).
- id: g-composicion-equilibrada
  es: composición equilibrada
  origin: m01-l06
  definition:
    es: Presencia de mujeres y hombres de forma que, en el conjunto a que se refiera, las personas de cada sexo no superen
      el sesenta por ciento ni sean menos del cuarenta por ciento (disposición adicional primera LO 3/2007).
- id: g-discriminacion-directa-por-razon-de-sexo
  es: discriminación directa por razón de sexo
  origin: m01-l06
  definition:
    es: Situación en que se encuentra una persona que sea, haya sido o pudiera ser tratada, en atención a su sexo, de manera
      menos favorable que otra en situación comparable (art. 6.1 LO 3/2007).
- id: g-discriminacion-indirecta-por-razon-de-sexo
  es: discriminación indirecta por razón de sexo
  origin: m01-l06
  definition:
    es: Situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja
      particular con respecto a personas del otro, salvo que dicha disposición, criterio o práctica puedan justificarse objetivamente
      en atención a una finalidad legítima y que los medios para alcanzar dicha finalidad sean necesarios y adecuados (art.
      6.2 LO 3/2007).
- id: g-persona-trans
  es: persona trans
  origin: m01-l06
  definition:
    es: Persona cuya identidad sexual no se corresponde con el sexo asignado al nacer (art. 3.k) Ley 4/2023).
- id: g-adscripcion-provisional
  es: adscripción provisional
  origin: m01-l07
  definition:
    es: Forma de provisión temporal que solo procede por remoción o cese en un puesto obtenido por concurso o libre designación,
      por supresión del puesto o por reingreso al servicio activo sin reserva de puesto (art. 63 RD 364/1995).
- id: g-autorizacion-de-compatibilidad
  es: autorización de compatibilidad
  origin: m01-l07
  definition:
    es: Autorización previa y expresa que exige el desempeño de un segundo puesto o actividad en el sector público; no supone
      modificación de la jornada de trabajo y horario de los dos puestos y se efectúa en razón del interés público (art. 3.1
      Ley 53/1984).
- id: g-carrera-horizontal
  es: carrera horizontal
  origin: m01-l07
  definition:
    es: Reconocimiento del desarrollo profesional del funcionario de carrera mediante su progresión en un sistema de tramos,
      sin necesidad de cambiar de puesto de trabajo (art. 122.1 RDL 6/2023).
- id: g-comision-de-servicios
  es: comisión de servicios
  origin: m01-l07
  definition:
    es: 'Forma de provisión temporal de un puesto vacante: voluntaria, en caso de urgente e inaplazable necesidad, con un
      funcionario que reúna los requisitos establecidos para su desempeño; o forzosa, cuando el concurso se declara desierto
      y es urgente para el servicio su provisión. Las de los apartados 1 y 2 del artículo 64 tienen una duración máxima de
      un año, prorrogable por otro si el puesto no se ha cubierto con carácter definitivo (art. 64.1–3 RD 364/1995).'
- id: g-complemento-de-destino
  es: complemento de destino
  origin: m01-l07
  match:
    es:
    - complemento de destino
    - complementos de destino
  definition:
    es: Retribución complementaria correspondiente al nivel del puesto que se desempeñe (art. 23.3.a) Ley 30/1984).
- id: g-complemento-de-productividad
  es: complemento de productividad
  origin: m01-l07
  match:
    es:
    - complemento de productividad
    - complementos de productividad
  definition:
    es: Retribución complementaria destinada a retribuir el especial rendimiento, la actividad extraordinaria y el interés
      o iniciativa con que el funcionario desempeñe su trabajo (art. 23.3.c) Ley 30/1984).
- id: g-complemento-especifico
  es: complemento específico
  origin: m01-l07
  match:
    es:
    - complemento específico
    - complementos específicos
  definition:
    es: Retribución complementaria destinada a retribuir las condiciones particulares de algunos puestos en atención a su
      especial dificultad técnica, dedicación, responsabilidad, incompatibilidad, peligrosidad o penosidad. En ningún caso
      puede asignarse más de uno a cada puesto (art. 23.3.b) Ley 30/1984).
- id: g-decreto-ley
  es: decreto-ley
  origin: m01-l07
  definition:
    es: Disposición legislativa provisional que el Gobierno puede dictar en caso de extraordinaria y urgente necesidad. No
      puede afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título
      I, al régimen de las Comunidades Autónomas ni al Derecho electoral general (art. 86.1 CE).
- id: g-demerito
  es: demérito
  origin: m01-l07
  definition:
    es: Sanción disciplinaria que consiste en la penalización a efectos de carrera, promoción o movilidad voluntaria (art.
      96.1.e) TREBEP).
- id: g-desconexion-digital
  es: desconexión digital
  origin: m01-l07
  definition:
    es: Derecho de los trabajadores y los empleados públicos a que se respete, fuera del tiempo de trabajo legal o convencionalmente
      establecido, su tiempo de descanso, permisos y vacaciones y su intimidad personal y familiar (art. 88.1 LOPDGDD).
- id: g-despido-disciplinario
  es: despido disciplinario
  origin: m01-l07
  definition:
    es: Sanción del personal laboral que solo puede imponerse por faltas muy graves y comporta la inhabilitación para ser
      titular de un nuevo contrato de trabajo con funciones similares a las que desempeñaba (art. 96.1.b) TREBEP).
- id: g-expectativa-de-destino
  es: expectativa de destino
  origin: m01-l07
  definition:
    es: Situación de los funcionarios afectados por un procedimiento de reasignación de efectivos que no han obtenido puesto
      en sus dos primeras fases; dura un máximo de un año, tras el cual se pasa a la excedencia forzosa (arts. 12.1 y 12.2
      RD 365/1995).
- id: g-grado-personal
  es: grado personal
  origin: m01-l07
  definition:
    es: Nivel que adquiere el funcionario de carrera por el desempeño de uno o más puestos del nivel correspondiente durante
      dos años continuados o tres con interrupción, cualquiera que sea el sistema de provisión (art. 70.2 RD 364/1995).
- id: g-mutualismo-administrativo
  es: mutualismo administrativo
  origin: m01-l07
  definition:
    es: Mecanismo de cobertura del Régimen especial de la Seguridad Social de los Funcionarios Civiles del Estado, junto al
      Régimen de Clases Pasivas. Se gestiona y presta a través de la MUFACE (arts. 2.1.b) y 4.1 RDL 4/2000).
- id: g-mutualista
  es: mutualista
  origin: m01-l07
  definition:
    es: Funcionario incorporado a la MUFACE. El funcionario de carrera de la Administración Civil del Estado se incorpora
      obligatoriamente en el momento de la toma de posesión de su cargo, cuando adquiere la condición de funcionario, es rehabilitado
      en ella o reingresa al servicio activo (art. 7.1 RDL 4/2000).
- id: g-orden-jurisdiccional
  es: orden jurisdiccional
  origin: m01-l07
  definition:
    es: 'Cada uno de los ámbitos en que se reparte la jurisdicción: civil, penal, contencioso-administrativo y social, más
      la jurisdicción militar (art. 9 LOPJ).'
- id: g-personal-laboral
  es: personal laboral
  origin: m01-l07
  definition:
    es: El que, en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación
      de personal previstas en la legislación laboral, presta servicios retribuidos por las Administraciones Públicas; según
      la duración del contrato, puede ser fijo, por tiempo indefinido o temporal (art. 11.1 TREBEP).
- id: g-pliego-de-cargos
  es: pliego de cargos
  origin: m01-l07
  match:
    es:
    - pliego de cargos
  definition:
    es: Escrito del Instructor del expediente disciplinario con los hechos imputados y, en su caso, la falta presuntamente
      cometida y las sanciones aplicables; se formula en un plazo no superior a un mes desde la incoación, que el Instructor
      puede pedir ampliar por causas justificadas (art. 35.1 RD 33/1986).
- id: g-promocion-interna
  es: promoción interna
  origin: m01-l07
  definition:
    es: En la Administración del Estado, ascenso desde Cuerpos o Escalas de un Grupo de titulación a otro del inmediato superior
      o acceso a Cuerpos o Escalas del mismo Grupo de titulación (art. 73 RD 364/1995).
- id: g-reasignacion-de-efectivos
  es: reasignación de efectivos
  origin: m01-l07
  definition:
    es: Procedimiento por el que los funcionarios cuyo puesto se suprime como consecuencia de un Plan de Empleo pueden ser
      destinados a otro puesto, con criterios objetivos y carácter definitivo (art. 60.1 RD 364/1995).
- id: g-reconocimiento-de-compatibilidad
  es: reconocimiento de compatibilidad
  origin: m01-l07
  definition:
    es: Resolución previa que requiere el ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera
      de las Administraciones Públicas; no puede modificar la jornada de trabajo y horario (art. 14 Ley 53/1984).
- id: g-redistribucion-de-efectivos
  es: redistribución de efectivos
  origin: m01-l07
  definition:
    es: Adscripción, por necesidades del servicio, de los funcionarios que ocupen con carácter definitivo puestos no singularizados
      a otros de la misma naturaleza, nivel de complemento de destino y complemento específico, con el mismo procedimiento
      de provisión y sin cambio de municipio (art. 59.1 RD 364/1995).
- id: g-regimen-de-clases-pasivas
  es: Régimen de Clases Pasivas
  origin: m01-l07
  definition:
    es: Régimen por el que el Estado garantiza a los funcionarios de carrera civiles del Estado y al resto del personal del
      art. 2.1 TRLCPE la protección frente a los riesgos de vejez, incapacidad y muerte y supervivencia, con pensiones de
      jubilación o retiro, de viudedad, de orfandad y en favor de los padres (arts. 1.1 y 18.2 TRLCPE).
- id: g-servicio-en-otras-administraciones-publicas
  es: servicio en otras Administraciones Públicas
  origin: m01-l07
  definition:
    es: Situación administrativa del funcionario de carrera que, en virtud de los procesos de transferencias o por los procedimientos
      de provisión de puestos de trabajo, obtiene destino en una Administración Pública distinta (art. 88.1 TREBEP).
- id: g-suspension-firme
  es: suspensión firme
  origin: m01-l07
  definition:
    es: Suspensión de funciones impuesta en virtud de sentencia dictada en causa criminal o de sanción disciplinaria; la disciplinaria
      no puede exceder de seis años (art. 90.2 TREBEP; art. 22.1 RD 365/1995).
- id: g-suspension-provisional
  es: suspensión provisional
  origin: m01-l07
  definition:
    es: Suspensión de funciones acordada con ocasión de la tramitación de un procedimiento judicial o expediente disciplinario;
      como medida cautelar en el expediente disciplinario no puede exceder de 6 meses, salvo paralización imputable al interesado
      (arts. 90.4 y 98.3 TREBEP).
- id: g-trienio
  es: trienio
  origin: m01-l07
  match:
    es:
    - trienio
    - trienios
  definition:
    es: Retribución básica que consiste en una cantidad igual para cada Subgrupo, o Grupo si no tiene Subgrupo, por cada tres
      años de servicio (art. 23.b) TREBEP).
- id: g-costumbre
  es: costumbre
  origin: m02-l01
  definition:
    es: Fuente del ordenamiento jurídico que sólo rige en defecto de ley aplicable, siempre que no sea contraria a la moral
      o al orden público y que resulte probada (arts. 1.1 y 1.3 Código Civil).
- id: g-jurisprudencia
  es: jurisprudencia
  origin: m02-l01
  definition:
    es: Doctrina que, de modo reiterado, establece el Tribunal Supremo al interpretar y aplicar la ley, la costumbre y los
      principios generales del derecho. Complementa el ordenamiento jurídico (art. 1.6 Código Civil).
- id: g-anulabilidad
  es: anulabilidad
  origin: m02-l02
  definition:
    es: Invalidez de los actos de la Administración que incurren en cualquier infracción del ordenamiento jurídico, incluso
      la desviación de poder (art. 48.1 LPAC).
- id: g-comparecencia-en-la-sede-electronica
  es: comparecencia en la sede electrónica
  origin: m02-l02
  definition:
    es: Acceso por el interesado o su representante debidamente identificado al contenido de la notificación, a efectos de
      la notificación por medios electrónicos (art. 43.1 LPAC).
- id: g-desviacion-de-poder
  es: desviación de poder
  origin: m02-l02
  definition:
    es: Ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico (art. 70.2
      LJCA).
- id: g-direccion-electronica-habilitada-unica
  es: Dirección Electrónica Habilitada única
  origin: m02-l02
  definition:
    es: Sistema de información para la notificación electrónica, alojado en la sede electrónica del Punto de Acceso General
      electrónico de la Administración General del Estado (art. 44.1 y 44.2 RD 203/2021).
- id: g-inderogabilidad-singular
  es: inderogabilidad singular
  origin: m02-l02
  definition:
    es: Regla por la que las resoluciones administrativas de carácter particular no pueden vulnerar lo establecido en una
      disposición de carácter general, aunque procedan de un órgano de igual o superior jerarquía al que dictó la disposición
      general (art. 37.1 LPAC).
- id: g-recurso-extraordinario-de-revision
  es: recurso extraordinario de revisión
  origin: m02-l02
  definition:
    es: Recurso contra los actos firmes en vía administrativa, ante el órgano administrativo que los dictó, cuando concurre
      alguna de las circunstancias del artículo 125.1 (art. 125.1 LPAC).
- id: g-declaracion-responsable
  es: declaración responsable
  origin: m02-l03
  definition:
    es: Documento suscrito por un interesado en el que manifiesta, bajo su responsabilidad, que cumple los requisitos establecidos
      en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de
      la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida y que
      se compromete a mantener el cumplimiento de esas obligaciones durante el periodo inherente a dicho reconocimiento o
      ejercicio (art. 69.1 LPAC).
- id: g-recurso-de-alzada
  es: recurso de alzada
  origin: m02-l05
  definition:
    es: Recurso contra las resoluciones y actos del artículo 112.1 que no ponen fin a la vía administrativa, ante el órgano
      superior jerárquico del que los dictó (art. 121.1 LPAC).
- id: g-recurso-potestativo-de-reposicion
  es: recurso potestativo de reposición
  origin: m02-l05
  definition:
    es: Recurso que puede interponerse potestativamente, ante el mismo órgano que los hubiera dictado, contra los actos administrativos
      que pongan fin a la vía administrativa, que también pueden impugnarse directamente ante el orden jurisdiccional contencioso-administrativo
      (art. 123.1 LPAC).
