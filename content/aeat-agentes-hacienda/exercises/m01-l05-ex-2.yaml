variants:
# anchor: boe-a-2013-12887-art-1
- id: m01-l05-q0023
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, esta Ley tiene por objeto, entre otros fines:"
  options:
  - id: a
    text:
      es: "Regular la participación de los ciudadanos en la elaboración de normas con rango de ley."
  - id: b
    text:
      es: "Establecer los principios generales de actuación de las Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "Ampliar y reforzar la transparencia de la actividad pública."
  - id: d
    text:
      es: "Fijar las bases del régimen estatutario de los empleados públicos."
  explanation:
    es: "El artículo 1 fija tres objetos: ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información y establecer las obligaciones de buen gobierno. La participación en la elaboración de normas está en el artículo 133 de la Ley 39/2015. Los principios generales de actuación están en el artículo 3 de la Ley 40/2015. Las bases del régimen estatutario de los empleados públicos no son objeto de la Ley 19/2013."
  citation: "art. 1 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-133
- id: m01-l05-q0025
  prompt:
    es: "De acuerdo con el artículo 133.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la consulta pública previa a la elaboración de una ley o un reglamento se sustanciará:"
  options:
  - id: a
    text:
      es: "A través del Boletín Oficial del Estado y del diario oficial autonómico."
  - id: b
    correct: true
    text:
      es: "A través del portal web de la Administración competente."
  - id: c
    text:
      es: "A través del registro electrónico general de la Administración competente."
  - id: d
    text:
      es: "A través del Tablón Edictal Único del Boletín Oficial del Estado."
  explanation:
    es: "El artículo 133.1 dice que la consulta pública se sustancia «a través del portal web de la Administración competente». No prevé hacerla en los diarios oficiales, en el registro electrónico ni en el Tablón Edictal Único."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l05-q0026
  prompt:
    es: "¿Cuál de las siguientes cuestiones somete la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas a la consulta pública previa a la elaboración de una norma?"
  options:
  - id: a
    correct: true
    text:
      es: "La necesidad y oportunidad de su aprobación."
  - id: b
    text:
      es: "La adecuación de la norma al orden constitucional de distribución de competencias."
  - id: c
    text:
      es: "El impacto económico y presupuestario de la norma para la Administración competente."
  - id: d
    text:
      es: "El impacto de la norma por razón de género."
  explanation:
    es: "El artículo 133.1 recaba la opinión sobre cuatro cuestiones: los problemas que se pretenden solucionar, la necesidad y oportunidad de la aprobación, los objetivos de la norma y las soluciones alternativas regulatorias y no regulatorias. La adecuación al orden de competencias, el impacto presupuestario y el impacto de género no figuran en esa lista."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-3
- id: m01-l05-q0034
  prompt:
    es: "Según el artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de los siguientes principios deben respetar las Administraciones Públicas en su actuación y relaciones?"
  options:
  - id: a
    text:
      es: "Responsabilidad patrimonial por la gestión de los servicios públicos."
  - id: b
    text:
      es: "Rendición de cuentas ante el Consejo de Transparencia y Buen Gobierno."
  - id: c
    text:
      es: "Publicidad activa de la gestión de los fondos públicos."
  - id: d
    correct: true
    text:
      es: "Responsabilidad por la gestión pública."
  explanation:
    es: "La letra f) del artículo 3.1 recoge la «responsabilidad por la gestión pública». La responsabilidad patrimonial, la rendición de cuentas ante el Consejo de Transparencia y Buen Gobierno y la publicidad activa de los fondos públicos no están en la lista de principios del artículo 3.1."
  citation: "art. 3.1.f LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-1
- id: m01-l05-q0035
  prompt:
    es: "Según el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿quiénes deben cumplir las obligaciones de buen gobierno que la Ley establece?"
  options:
  - id: a
    text:
      es: "Todos los empleados públicos, sea cual sea su vínculo con la Administración."
  - id: b
    text:
      es: "Las personas que ejerzan el derecho de acceso a la información pública."
  - id: c
    correct: true
    text:
      es: "Los responsables públicos, con las consecuencias derivadas de su incumplimiento."
  - id: d
    text:
      es: "Las entidades privadas que perciban ayudas o subvenciones públicas."
  explanation:
    es: "El artículo 1 habla de «las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento». No las extiende a todos los empleados públicos, a quienes piden información ni a las entidades privadas que reciben ayudas."
  citation: "art. 1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-3
- id: m01-l05-q0038
  prompt:
    es: "Conforme al artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de los siguientes NO es un principio que las Administraciones Públicas deben respetar en su actuación y relaciones?"
  options:
  - id: a
    text:
      es: "Participación, objetividad y transparencia de la actuación administrativa."
  - id: b
    text:
      es: "Responsabilidad por la gestión pública."
  - id: c
    text:
      es: "Simplicidad, claridad y proximidad a los ciudadanos."
  - id: d
    correct: true
    text:
      es: "Gratuidad de los servicios administrativos."
  explanation:
    es: "El artículo 3.1 enumera, entre otros, la participación, objetividad y transparencia de la actuación administrativa, la responsabilidad por la gestión pública y la simplicidad, claridad y proximidad a los ciudadanos. La gratuidad de los servicios administrativos no figura en la lista."
  citation: "art. 3.1.c LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-2
- id: m01-l05-q0046
  prompt:
    es: "¿A qué actividades de la Casa de Su Majestad el Rey, el Congreso y el Senado se aplica el título I de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "A sus actividades sujetas a Derecho Administrativo"
  - id: b
    text:
      es: "A todas sus actividades, cualquiera que sea su naturaleza"
  - id: c
    text:
      es: "A sus actividades sujetas a Derecho privado y laboral"
  - id: d
    text:
      es: "A sus actividades institucionales y de representación del Estado"
  explanation:
    es: "El artículo 2.1.f) incluye a la Casa de Su Majestad el Rey, al Congreso y al Senado «en relación con sus actividades sujetas a Derecho Administrativo». La ley no los somete en todas sus actividades. Las actividades sujetas a Derecho privado o laboral quedan fuera de ese criterio. Las actividades institucionales y de representación tampoco son el criterio que fija la ley."
  citation: "art. 2.1.f) Ley 19/2013"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2013-12887-art-5
- id: m01-l05-q0048
  prompt:
    es: "¿Dónde se publica la información sujeta a las obligaciones de transparencia de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, y en qué formatos preferentemente?"
  options:
  - id: a
    correct: true
    text:
      es: "En las sedes electrónicas o páginas web, preferiblemente en formatos reutilizables"
  - id: b
    text:
      es: "En el Boletín Oficial del Estado, preferiblemente en formatos firmados electrónicamente"
  - id: c
    text:
      es: "En los tablones de anuncios de cada órgano, preferiblemente en formato papel"
  - id: d
    text:
      es: "En las sedes electrónicas o páginas web, preferiblemente en formatos no editables"
  explanation:
    es: "El artículo 5.4 dice que la información se publica «en las correspondientes sedes electrónicas o páginas web» y, «preferiblemente, en formatos reutilizables». La ley no remite al Boletín Oficial del Estado ni a los tablones de anuncios. Los formatos no editables van contra la preferencia por la reutilización."
  citation: "art. 5.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-9
- id: m01-l05-q0051
  prompt:
    es: "¿Qué órgano controla el cumplimiento por la Administración General del Estado de las obligaciones de publicidad activa de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El Defensor del Pueblo, como alto comisionado de las Cortes Generales"
  - id: b
    correct: true
    text:
      es: "El Consejo de Transparencia y Buen Gobierno"
  - id: c
    text:
      es: "El Tribunal de Cuentas, como supremo órgano fiscalizador"
  - id: d
    text:
      es: "La Agencia Española de Protección de Datos"
  explanation:
    es: "Según el artículo 9.1, el cumplimiento de la publicidad activa por la Administración General del Estado «será objeto de control por parte del Consejo de Transparencia y Buen Gobierno». El Defensor del Pueblo, el Tribunal de Cuentas y la Agencia Española de Protección de Datos tienen un representante en la Comisión del Consejo (art. 36.2), pero la ley no les da este control."
  citation: "art. 9.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-art-10
- id: m01-l05-q0052
  prompt:
    es: "De acuerdo con el artículo 10 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Portal de la Transparencia de la Administración General del Estado depende, según el texto legal:"
  options:
  - id: a
    text:
      es: "Del Ministerio de Hacienda y Administraciones Públicas"
  - id: b
    text:
      es: "Del Consejo de Transparencia y Buen Gobierno"
  - id: c
    correct: true
    text:
      es: "Del Ministerio de la Presidencia"
  - id: d
    text:
      es: "De la Secretaría de Estado de Administraciones Públicas"
  explanation:
    es: "El artículo 10.1 describe un Portal de la Transparencia «dependiente del Ministerio de la Presidencia». El Ministerio de Hacienda y Administraciones Públicas aparece en otros preceptos de la ley, como el artículo 37, no en este. El Consejo de Transparencia y Buen Gobierno controla la publicidad activa, pero el Portal no depende de él. La Secretaría de Estado de Administraciones Públicas solo aparece en la composición de la Comisión (art. 36.2)."
  citation: "art. 10.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-art-14
- id: m01-l05-q0055
  prompt:
    es: "¿Cuál de los siguientes supuestos permite limitar el derecho de acceso a la información pública, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Que acceder a la información suponga un perjuicio para la defensa"
  - id: b
    text:
      es: "Que atender la solicitud suponga una carga de trabajo excesiva para el órgano"
  - id: c
    text:
      es: "Que acceder a la información suponga un perjuicio para la reputación de un alto cargo"
  - id: d
    text:
      es: "Que el solicitante no acredite un interés legítimo en la información"
  explanation:
    es: "La defensa es el límite de la letra b) del artículo 14.1. La carga de trabajo del órgano y la reputación de un alto cargo no están en la lista de límites. La falta de un interés legítimo tampoco limita el acceso: el solicitante ni siquiera tiene que motivar su solicitud (art. 17.3)."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-15
- id: m01-l05-q0056
  prompt:
    es: "¿Qué se exige para autorizar el acceso a información pública que incluya datos personales relativos a la salud del afectado, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El consentimiento expreso y por escrito del afectado, en todo caso"
  - id: b
    correct: true
    text:
      es: "El consentimiento expreso del afectado o el amparo de una norma con rango de ley"
  - id: c
    text:
      es: "La ponderación del interés público, sin consentimiento del afectado"
  - id: d
    text:
      es: "La autorización judicial previa a solicitud del órgano"
  explanation:
    es: "Para los datos de salud, el segundo párrafo del artículo 15.1 permite el acceso si se cuenta con «el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley». El consentimiento expreso y por escrito, sin alternativa, es la regla de la ideología, la afiliación sindical, la religión y las creencias. La ley no se conforma con ponderar el interés público para estos datos, ni exige autorización judicial."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
