type: case
title:
  es: "Los reactivos urgentes del ISCIII"
scenario:
  es: "El Instituto de Salud Carlos III es un organismo autónomo con sede en Madrid.\n\nBioanálisis Cañada Real, S.L. presentó el miércoles, 24 de febrero de 2027, en el registro electrónico de otra Administración, una solicitud para que el Instituto le ceda un lote de cepas. La solicitud entró en el registro electrónico del Instituto el miércoles, 3 de marzo de 2027, y la norma de las cesiones no fija plazo para resolver. El lunes, 8 de marzo de 2027, el Instituto pidió el informe preceptivo de su Comité de Ética y lo comunicó a la empresa. El informe llegó el martes, 20 de julio de 2027, y también se comunicó a la empresa. El miércoles, 21 de julio de 2027, el Instituto abrió la audiencia por quince días hábiles, el máximo legal. La empresa pidió la ampliación antes de que venciera el plazo, y el Instituto la concedió por el máximo. El jueves, 26 de agosto de 2027, el Instituto dictó la resolución.\n\nEl Instituto licita el suministro de reactivos de diagnóstico por procedimiento abierto, con presentación electrónica de ofertas. El valor estimado es de 156.000 euros, IVA excluido. Hay varios criterios de adjudicación, todos evaluables mediante fórmulas, y cada oferta va en un único archivo electrónico. El órgano de contratación declara de forma motivada la tramitación urgente. El expediente de gasto llega a la Intervención Delegada el lunes, 20 de septiembre de 2027. La mesa abre las proposiciones el miércoles, 6 de octubre de 2027, y el pliego no fija otro plazo para adjudicar. El Instituto adjudica a Reactivos Ribera del Tajo, S.L. por 144.000 euros, IVA excluido, y remite la notificación el viernes, 5 de noviembre de 2027. El plazo total de entrega es el viernes, 24 de diciembre de 2027, y la empresa entrega el lunes, 3 de enero de 2028.\n\nDoña Leire Cuesta Arribas, funcionaria de carrera del Subgrupo A2, está en excedencia voluntaria por interés particular desde el lunes, 1 de septiembre de 2025. Acredita once años de servicios efectivos, y la resolución fijó en once años su duración máxima. Don Rodrigo Pardo Lasa, funcionario de carrera del Subgrupo A2 con grado personal 20, obtuvo por concurso, con carácter definitivo, un puesto de nivel 26 y tomó posesión el miércoles, 1 de marzo de 2023. Don Aurelio Marín Soto, funcionario de carrera, cometió una falta muy grave continuada, cuya comisión cesó el lunes, 18 de octubre de 2027.\n\nEl mantenimiento de los equipos de secuenciación empieza a ejecutarse en 2027 y se extiende a 2028 y 2029. El martes, 5 de octubre de 2027, el Cajero pagador recibe fondos a justificar para una campaña en una localidad donde el Instituto no tiene dependencia.\n\nSon inhábiles, además de sábados y domingos, el lunes, 16 de agosto de 2027, el martes, 12 de octubre de 2027, el lunes, 1 de noviembre de 2027 y el lunes, 6 de diciembre de 2027. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-21
- id: q01
  lesson: m03-l03
  prompt:
    es: "De no haberse suspendido el plazo, ¿hasta qué fecha podía el Instituto resolver y notificar la solicitud de Bioanálisis Cañada Real, S.L., conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El lunes, 24 de mayo de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 3 de junio de 2027."
  - id: c
    text:
      es: "El martes, 8 de junio de 2027."
  - id: d
    text:
      es: "El viernes, 3 de septiembre de 2027."
  explanation:
    es: "La norma no fija plazo, así que es de tres meses. En un procedimiento iniciado a solicitud cuenta desde que la solicitud entra en el registro electrónico del organismo competente para tramitarla (art. 21.3 LPAC): el miércoles 3 de marzo de 2027. Los tres meses acaban el jueves 3 de junio de 2027. La fecha de mayo cuenta desde la presentación en el registro de la otra Administración. La del 8 de junio parte de la petición del informe, y la de septiembre suma seis meses que la norma no da."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-22
- id: q02
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 22.1.d) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo para resolver la solicitud de Bioanálisis Cañada Real, S.L. puede mantenerse suspendido por el informe del Comité de Ética, como máximo:"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 8 de abril de 2027."
  - id: b
    text:
      es: "Hasta el jueves, 3 de junio de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el martes, 8 de junio de 2027."
  - id: d
    text:
      es: "Hasta el martes, 20 de julio de 2027."
  explanation:
    es: "El plazo se suspende por el tiempo que media entre la petición del informe y su recepción, sin exceder en ningún caso de tres meses (art. 22.1.d) LPAC). La petición fue el lunes 8 de marzo de 2027, y la recepción el martes 20 de julio de 2027, más de cuatro meses después. El tope de tres meses de fecha a fecha llega al martes 8 de junio de 2027, y desde ahí prosigue el procedimiento. La fecha de abril cuenta un solo mes. La del 3 de junio es el fin del plazo sin suspensión, y la de julio deja suspendido todo el tiempo hasta la recepción."
  citation: "art. 22.1.d) LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-76
- id: q03
  lesson: m03-l03
  prompt:
    es: "Señale la respuesta correcta sobre el escrito con documentos nuevos que la empresa presentó el lunes, 12 de julio de 2027, antes de la audiencia, conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "El Instituto debe tenerlo en cuenta al redactar la propuesta de resolución, porque se presentó antes de la audiencia."
  - id: b
    text:
      es: "El Instituto debe rechazarlo, porque la empresa solo puede alegar y aportar documentos durante la audiencia."
  - id: c
    text:
      es: "El Instituto solo puede admitirlo si antes lo ha pedido mediante un requerimiento de subsanación."
  - id: d
    text:
      es: "El Instituto debe archivarlo, porque las alegaciones solo caben en los diez días siguientes a la solicitud."
  explanation:
    es: "Los interesados pueden alegar y aportar documentos en cualquier momento anterior al trámite de audiencia, y el órgano los tiene en cuenta al redactar la propuesta de resolución (art. 76.1 LPAC). El escrito llegó el 12 de julio, antes de la audiencia del 21 de julio. Rechazarlo porque solo cabe alegar en la audiencia contradice el artículo. Condicionarlo a un requerimiento previo inventa un requisito, y los diez días siguientes a la solicitud no son un límite de la ley."
  citation: "art. 76.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-32
- id: q04
  lesson: m03-l03
  prompt:
    es: "Si el Instituto concede a la empresa la ampliación máxima que permite la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede alegar en la audiencia abierta el miércoles, 21 de julio de 2027?"
  options:
  - id: a
    text:
      es: "Hasta el miércoles, 18 de agosto de 2027."
  - id: b
    text:
      es: "Hasta el viernes, 20 de agosto de 2027."
  - id: c
    text:
      es: "Hasta el martes, 24 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el lunes, 23 de agosto de 2027."
  explanation:
    es: "Los quince días hábiles empiezan el jueves 22 de julio y acaban el miércoles 11 de agosto de 2027. La ampliación no puede exceder de la mitad del plazo (art. 32.1 LPAC): la mitad de quince es siete y medio, así que son siete días hábiles. Cuentan desde el jueves 12 de agosto, y el lunes 16 de agosto es festivo en Madrid. El séptimo día hábil es el lunes 23 de agosto de 2027. La fecha del miércoles 18 de agosto cuenta siete días naturales. La del viernes 20 ignora el festivo, y la del martes 24 redondea la mitad a ocho días."
  citation: "art. 32.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-40
- id: q21
  lesson: m03-l02
  prompt:
    es: "Conforme al artículo 40.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha podía el Instituto cursar la notificación de la resolución que dictó a Bioanálisis Cañada Real, S.L.?"
  options:
  - id: a
    text:
      es: "El domingo, 5 de septiembre de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 9 de septiembre de 2027."
  - id: c
    text:
      es: "El miércoles, 8 de septiembre de 2027."
  - id: d
    text:
      es: "El jueves, 16 de septiembre de 2027."
  explanation:
    es: "Toda notificación se cursa dentro de los diez días siguientes a la fecha en que el acto fue dictado (art. 40.2 LPAC), y los plazos por días son hábiles (art. 30.2 LPAC). Desde el viernes 27 de agosto de 2027, los diez días hábiles son el 27, 30 y 31 de agosto y el 1, 2, 3, 6, 7, 8 y 9 de septiembre, sin festivos: el jueves, 9 de septiembre de 2027. La fecha del domingo 5 de septiembre cuenta diez días naturales. La del miércoles 8 cuenta como primero el día en que se dictó la resolución. La del jueves 16 cuenta quince días hábiles, que no son el plazo de la notificación."
  citation: "art. 40.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-156
- id: q22
  lesson: m03-l04
  prompt:
    es: "Antes de cualquier reducción, ¿qué plazo mínimo de presentación de proposiciones rige para el contrato de suministro de reactivos del Instituto, según el artículo 156.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Quince días, desde el siguiente a la publicación del anuncio en el perfil de contratante."
  - id: b
    text:
      es: "Treinta días, desde el envío del anuncio a la Oficina de Publicaciones, propios de las concesiones."
  - id: c
    correct: true
    text:
      es: "Treinta y cinco días, desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: d
    text:
      es: "Veintiséis días, desde el siguiente a la publicación del anuncio en el perfil de contratante."
  explanation:
    es: "El suministro de 156.000 euros de valor estimado supera los 140.000 euros que rigen para un organismo autónomo, y está sujeto a regulación armonizada (arts. 19 y 21.1 LCSP). En el abierto armonizado, el plazo de proposiciones no es inferior a treinta y cinco días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea (art. 156.2 LCSP), sin perjuicio de las reducciones del apartado 3. Los quince días desde la publicación en el perfil son el plazo de los contratos no armonizados. Los treinta días desde el envío son los de las concesiones. Los veintiséis días son el mínimo de las obras no armonizadas."
  citation: "art. 156.2–3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-1996-1578-art-13
- id: q07
  lesson: m05-l03
  prompt:
    es: "Según el artículo 13.2 del Real Decreto 2188/1995, de 28 de diciembre, por el que se desarrolla el régimen del control interno ejercido por la Intervención General de la Administración del Estado, ¿hasta qué fecha debe fiscalizar la Intervención Delegada el expediente de gasto del contrato de reactivos?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 24 de septiembre de 2027."
  - id: b
    text:
      es: "Hasta el sábado, 25 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el lunes, 27 de septiembre de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 4 de octubre de 2027."
  explanation:
    es: "La Intervención fiscaliza en diez días desde el siguiente a la recepción, y en cinco, computados igual, si se ha declarado urgente la tramitación (art. 13.2 RD 2188/1995). El real decreto no fija otro cómputo, y los plazos por días son hábiles (art. 30.2 LPAC). Desde el martes 21 de septiembre, los cinco días hábiles son el 21, 22, 23, 24 y 27: el lunes 27 de septiembre de 2027. El lunes 4 de octubre son los diez días ordinarios. El viernes 24 cuenta la recepción como primer día, y el sábado 25 cuenta cinco días naturales."
  citation: "art. 13.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-122
- id: q23
  lesson: m03-l04
  prompt:
    es: "Anunciada la licitación de los reactivos, el Instituto quiere adelantar en el pliego de cláusulas administrativas particulares el plazo total de entrega. Según el artículo 122.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿puede modificarlo?"
  options:
  - id: a
    text:
      es: "Sí, mientras no se hayan abierto las proposiciones, con la aprobación del órgano de contratación."
  - id: b
    text:
      es: "Sí, porque la declaración de urgencia permite ajustar los plazos del pliego durante la licitación."
  - id: c
    text:
      es: "No, nunca, ni siquiera para corregir un error aritmético, porque el pliego es inmodificable tras el anuncio."
  - id: d
    correct: true
    text:
      es: "No, salvo error material, de hecho o aritmético; cualquier otro cambio exige retroacción de actuaciones."
  explanation:
    es: "Los pliegos solo pueden modificarse después de la licitación por error material, de hecho o aritmético; en otro caso, la modificación lleva la retroacción de actuaciones (art. 122.1 LCSP). Adelantar el plazo de entrega no es un error de esa clase, así que exige retrotraer el procedimiento. La opción de modificar hasta abrir las proposiciones inventa un límite que el artículo no recoge. La de que la urgencia permite ajustar el pliego confunde la reducción de plazos de la Ley con el contenido del pliego. La de prohibir incluso el error aritmético niega la excepción que el artículo prevé."
  citation: "art. 122.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-153
- id: q09
  lesson: m03-l04
  prompt:
    es: "Conforme a la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿desde qué fecha puede formalizarse el contrato con Reactivos Ribera del Tajo, S.L., pese a la tramitación urgente?"
  options:
  - id: a
    text:
      es: "Desde el viernes, 19 de noviembre de 2027."
  - id: b
    correct: true
    text:
      es: "Desde el martes, 30 de noviembre de 2027."
  - id: c
    text:
      es: "Desde el lunes, 29 de noviembre de 2027."
  - id: d
    text:
      es: "Desde el sábado, 20 de noviembre de 2027."
  explanation:
    es: "El contrato, de 156.000 euros de valor estimado, admite recurso especial. No puede formalizarse antes de que pasen quince días hábiles desde la remisión de la notificación (art. 153.3 LCSP), y la urgencia no reduce ese plazo (art. 119.2.b) LCSP). Desde el lunes 8 de noviembre, con el martes 9 festivo en Madrid, el decimoquinto día hábil es el lunes 29 de noviembre de 2027, y el contrato puede formalizarse desde el martes 30 de noviembre de 2027. La fecha del 19 reduce el plazo a ocho días por la urgencia. La del lunes 29 es el último día del plazo, no el siguiente, y la del sábado 20 cuenta quince días naturales."
  citation: "art. 153.3 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-193
- id: q10
  lesson: m03-l04
  prompt:
    es: "Si el Instituto opta por las penalidades diarias por demora de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué penalidad total corresponde a Reactivos Ribera del Tajo, S.L. por el retraso en la entrega, con un IVA del 21 por ciento?"
  options:
  - id: a
    correct: true
    text:
      es: "864,00 euros, calculados sobre el precio de adjudicación sin IVA."
  - id: b
    text:
      es: "936,00 euros, calculados sobre el valor estimado del contrato sin IVA."
  - id: c
    text:
      es: "1.045,44 euros, calculados sobre el precio de adjudicación con IVA."
  - id: d
    text:
      es: "8.640,00 euros, con 0,60 euros por cada 100 euros del precio."
  explanation:
    es: "La penalidad diaria es de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido (art. 193.3 LCSP). Son 144 × 0,60 = 86,40 euros al día. La demora va del sábado 25 de diciembre de 2027, primer día tras el plazo, al lunes 3 de enero de 2028, diez días: 864,00 euros. Los 936,00 euros usan el valor estimado, y los 1.045,44 euros, el precio con IVA. Los 8.640,00 euros aplican la proporción a cada 100 euros."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-1995-8730-art-16
- id: q11
  lesson: m04-l04
  prompt:
    es: "Según el artículo 16.3 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿desde qué fecha puede Doña Leire Cuesta Arribas, como pronto, volver al servicio activo?"
  options:
  - id: a
    text:
      es: "Desde el martes, 1 de septiembre de 2026."
  - id: b
    text:
      es: "Desde el martes, 31 de agosto de 2027."
  - id: c
    correct: true
    text:
      es: "Desde el miércoles, 1 de septiembre de 2027."
  - id: d
    text:
      es: "Desde el lunes, 1 de septiembre de 2036."
  explanation:
    es: "Cada periodo de excedencia por interés particular dura no menos de dos años continuados (art. 16.3 RD 365/1995). Desde el lunes 1 de septiembre de 2025, los dos años acaban el martes 31 de agosto de 2027, y el primer día en que puede volver es el miércoles 1 de septiembre de 2027. La fecha de 2026 cuenta un solo año. La del 31 de agosto vuelve antes de completar los dos años, y la de 2036 suma los once años de servicios, que son el tope y no el mínimo."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8730-art-16
- id: q12
  lesson: m04-l04
  prompt:
    es: "Según el Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, si Doña Leire Cuesta Arribas no pide el reingreso dentro del plazo máximo que fija su resolución de excedencia:"
  options:
  - id: a
    text:
      es: "pasa de oficio a la situación de excedencia forzosa."
  - id: b
    text:
      es: "queda en la situación de servicio activo en un puesto provisional."
  - id: c
    text:
      es: "pasa a la excedencia voluntaria por agrupación familiar."
  - id: d
    correct: true
    text:
      es: "pierde la condición de funcionaria de carrera."
  explanation:
    es: "La resolución que declara la excedencia por interés particular expresa su plazo máximo, y no pedir el reingreso dentro de él comporta la pérdida de la condición de funcionario (art. 16.4 RD 365/1995). La excedencia forzosa es otra situación, con otras causas. Quedar en servicio activo en un puesto provisional exigiría haber pedido el reingreso. La agrupación familiar es otra excedencia voluntaria, que no se declara de oficio por este motivo."
  citation: "art. 16.4 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1995-8729-art-72
- id: q13
  lesson: m04-l05
  prompt:
    es: "Doña Leire Cuesta Arribas reingresa sin reserva de puesto, por adscripción provisional, a un puesto vacante del Instituto. Conforme al Real Decreto 364/1995, de 10 de marzo, ¿qué obligación tiene respecto del puesto?"
  options:
  - id: a
    correct: true
    text:
      es: "Participar en la convocatoria que se haga para cubrirlo con carácter definitivo."
  - id: b
    text:
      es: "Dejarlo libre cuando se convoque para su cobertura definitiva, sin poder concursar a él."
  - id: c
    text:
      es: "Pedir cada año la prórroga de su adscripción provisional ante el órgano competente."
  - id: d
    text:
      es: "Permanecer en él dos años continuados antes de poder participar en un concurso."
  explanation:
    es: "Los puestos cubiertos mediante adscripción provisional se convocan para su cobertura con carácter definitivo, y quienes los desempeñan tienen la obligación de participar en las convocatorias (art. 72.2 RD 364/1995). No se les pide dejar el puesto sin concursar, ni prorrogar la adscripción cada año. Los dos años de permanencia son la regla del concurso para quien ocupa un destino definitivo, no una condición de la adscripción provisional."
  citation: "art. 72.2 RD 364/1995"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1995-8729-art-70
- id: q14
  lesson: m04-l05
  prompt:
    es: "Conforme al Real Decreto 364/1995, de 10 de marzo, ¿qué grado personal tiene consolidado Don Rodrigo Pardo Lasa el viernes, 30 de abril de 2027?"
  options:
  - id: a
    text:
      es: "Grado 20, el que tenía al obtener el puesto, sin consolidar ninguno."
  - id: b
    correct: true
    text:
      es: "Grado 24, tras consolidar dos escalones de dos niveles."
  - id: c
    text:
      es: "Grado 22, tras consolidar un solo escalón de dos niveles."
  - id: d
    text:
      es: "Grado 26, el nivel del puesto que desempeña desde 2023."
  explanation:
    es: "Quien obtiene un puesto superior en más de dos niveles a su grado consolida cada dos años de servicios continuados el grado superior en dos niveles, sin superar el nivel del puesto ni el intervalo de su Cuerpo (art. 70.2 RD 364/1995). El puesto es de nivel 26 y su grado, 20. Cumplió dos años el sábado 1 de marzo de 2025 (grado 22) y cuatro el lunes 1 de marzo de 2027 (grado 24). El grado 20 ignora ambos escalones, el 22 solo cuenta el primero, y el 26 es el nivel del puesto, que se alcanzaría en 2029."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2015-11719-art-97
- id: q15
  lesson: m04-l06
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué día termina el plazo de prescripción de la falta muy grave continuada de Don Aurelio Marín Soto?"
  options:
  - id: a
    text:
      es: "El martes, 18 de abril de 2028."
  - id: b
    text:
      es: "El jueves, 18 de octubre de 2029."
  - id: c
    correct: true
    text:
      es: "El viernes, 18 de octubre de 2030."
  - id: d
    text:
      es: "El martes, 18 de octubre de 2033."
  explanation:
    es: "Las faltas muy graves prescriben a los tres años, y en las continuadas el plazo corre desde el cese de su comisión (art. 97.1–2 TREBEP). Desde el lunes 18 de octubre de 2027, los tres años acaban el viernes 18 de octubre de 2030. La fecha de abril de 2028 es la de seis meses de las faltas leves, y la de octubre de 2029, la de dos años de las graves. La de 2033 aplica los seis años del Real Decreto 33/1986, que el Estatuto Básico ha sustituido por tres."
  citation: "art. 97.2 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-97
- id: q16
  lesson: m04-l06
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, la sanción de suspensión de funciones de Doña Sagrario Viñas Peña, por falta muy grave y firme el viernes, 2 de julio de 2027, prescribe:"
  options:
  - id: a
    text:
      es: "a los tres años, desde que se cometió la falta."
  - id: b
    text:
      es: "al año, desde que la resolución sancionadora es firme."
  - id: c
    text:
      es: "a los seis años, desde que la resolución sancionadora es firme."
  - id: d
    correct: true
    text:
      es: "a los tres años, desde que la resolución sancionadora es firme."
  explanation:
    es: "Las sanciones impuestas por faltas muy graves prescriben a los tres años, y el plazo corre desde la firmeza de la resolución sancionadora (art. 97 TREBEP). Contar desde que se cometió la falta es la regla de las faltas, no de las sanciones. Un año es el plazo de las sanciones por faltas leves, y seis años es el del Real Decreto 33/1986, que el Estatuto Básico no recoge."
  citation: "art. 97 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2003-21614-art-56
- id: q27
  lesson: m05-l02
  prompt:
    es: "El Instituto reconoce en 2028 una obligación de 2027, distinta del contrato de reactivos, para la que no anuló crédito en 2027, y necesita un suplemento de crédito. ¿Cómo se tramita según el artículo 56.7 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Con un proyecto de ley que el Gobierno remite a las Cortes Generales."
  - id: b
    text:
      es: "Por el Director del Instituto, si no supera el 10 por ciento del capítulo, dando cuenta al Ministro de Hacienda."
  - id: c
    text:
      es: "Por el Ministro de Hacienda, siempre que el suplemento no supere el millón de euros."
  - id: d
    text:
      es: "Por el Consejo de Ministros, con cargo a la baja en el Fondo de Contingencia."
  explanation:
    es: "Si el suplemento de crédito de un organismo autónomo atiende obligaciones de ejercicios anteriores para las que no se anuló crédito en el ejercicio de procedencia, se remite un proyecto de ley a las Cortes Generales (art. 56.7 LGP). Por eso no basta la autorización del Director dentro del 10 por ciento del capítulo, ni la del Ministro de Hacienda dentro del millón de euros, que son las reglas ordinarias de los suplementos del organismo (art. 56.3 LGP). Tampoco basta el acuerdo del Consejo de Ministros con baja en el Fondo de Contingencia, que es la vía del Estado para obligaciones de ejercicios anteriores con crédito anulado."
  citation: "art. 56.7 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-2003-21614-art-47
- id: q25
  lesson: m05-l02
  prompt:
    es: "¿Qué exige el artículo 47.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria para que el Instituto comprometa gasto de 2028 y 2029 en el contrato de mantenimiento de los equipos de secuenciación?"
  options:
  - id: a
    text:
      es: "Que el Consejo de Ministros autorice cada anualidad posterior antes de que el Instituto la comprometa."
  - id: b
    text:
      es: "Que su ejecución se inicie en 2029, último ejercicio de vigencia, cuando ya exista crédito suficiente."
  - id: c
    correct: true
    text:
      es: "Que su ejecución se inicie en 2027, el ejercicio de la autorización, sin superar los límites legales."
  - id: d
    text:
      es: "Que los presupuestos de 2028 y de 2029 recojan ya crédito suficiente para sus respectivas anualidades."
  explanation:
    es: "Pueden adquirirse compromisos de gasto para ejercicios posteriores siempre que su ejecución se inicie en el propio ejercicio en que se autorizan y que no superen los límites y anualidades legales (art. 47.1 LGP). El mantenimiento empieza a ejecutarse en 2027, así que cumple esa condición. El Consejo de Ministros solo interviene para modificar los límites en casos especialmente justificados. Iniciar la ejecución en 2029 incumple la condición. Y no se exige que los presupuestos futuros ya recojan crédito, que se concreta cada año."
  citation: "art. 47.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-47-bis
- id: q26
  lesson: m05-l02
  prompt:
    es: "Si la Ley de Presupuestos Generales del Estado no autoriza en 2029 créditos suficientes para el mantenimiento de los equipos de secuenciación, ¿cómo debe actuar el Instituto según el artículo 47 bis de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Seguir ejecutando el contrato y pagar las anualidades de 2029 con cargo al crédito inicial de 2027."
  - id: b
    text:
      es: "Resolver el contrato de inmediato, sin comunicarlo antes a la empresa ni fijar compensación alguna."
  - id: c
    text:
      es: "Exigir a la empresa que siga prestando el servicio gratis hasta que se apruebe un crédito extraordinario."
  - id: d
    correct: true
    text:
      es: "Comunicarlo a la empresa y, si el crédito lo permite, reprogramar anualidades; si no, resolver con compensaciones."
  explanation:
    es: "Si un ejercicio posterior no autoriza créditos suficientes, el órgano competente comunica la circunstancia al tercero en cuanto la conozca; si las disponibilidades lo permiten, se reprograman las obligaciones con reajuste de anualidades, y si no es posible se acuerda la resolución y se fijan las compensaciones que procedan (art. 47 bis LGP). La opción de pagar con el crédito de 2027 ignora que cada ejercicio tiene su propio crédito. La de resolver sin comunicar ni compensar se salta los dos primeros pasos. La de exigir el servicio gratis no está prevista y carga a la empresa con el fallo del presupuesto."
  citation: "art. 47 bis LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: q28
  lesson: m05-l05
  prompt:
    es: "El Director del Instituto autoriza el pago a justificar de la campaña y designa el órgano que ha de gestionarlo. Según el artículo 79.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué implica esa designación?"
  options:
  - id: a
    text:
      es: "Que ese órgano solo ejecuta los pagos, y el Director sigue formando, rindiendo y justificando las cuentas."
  - id: b
    correct: true
    text:
      es: "Que ese órgano asume la competencia para realizar los gastos y pagos y para formar, rendir y justificar las cuentas."
  - id: c
    text:
      es: "Que ese órgano gestiona los pagos, pero necesita la autorización de la Intervención Delegada para cada gasto."
  - id: d
    text:
      es: "Que el pago deja de ser a justificar y pasa a tramitarse por el sistema de anticipos de caja fija."
  explanation:
    es: "Los pagos para gastos en una localidad donde el organismo no tiene dependencia tienen carácter a justificar, y en un organismo autónomo los autoriza su director, que designa el órgano competente para gestionarlos (art. 79.2 LGP). Esa designación atribuye al órgano la competencia para realizar los gastos y pagos y para formar, rendir y justificar las cuentas. La opción que deja al órgano solo la ejecución de los pagos y al Director la rendición de cuentas separa lo que el artículo une. La que exige la autorización de la Intervención Delegada para cada gasto añade un requisito que la norma no contiene. La que convierte el pago en anticipo de caja fija confunde dos sistemas distintos."
  citation: "art. 79.2 LGP"
  difficulty: 2
  tags:
  - "efecto"
