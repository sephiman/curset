  prompt:
    es: "Señale la respuesta correcta sobre los servicios territoriales de la Administración General del Estado, de acuerdo con el artículo 71 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Los integrados dependen del órgano central competente en su sector, y los no integrados, del Delegado del Gobierno."
  - id: b
    text:
      es: "Los integrados y los no integrados dependen del Delegado del Gobierno."
  - id: c
