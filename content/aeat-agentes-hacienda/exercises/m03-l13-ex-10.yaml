  prompt:
    es: "De acuerdo con el artículo 210.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, concluidas las actuaciones del procedimiento sancionador, se formula propuesta de resolución en la que se recogen de forma motivada los hechos, su calificación jurídica y:"
  options:
  - id: a
    text:
      es: "La infracción que aquellos puedan constituir, sin que quepa declarar en ningún caso la inexistencia de infracción o responsabilidad."
  - id: b
    correct: true
    text:
      es: "La infracción que aquellos puedan constituir o la declaración, en su caso, de inexistencia de infracción o responsabilidad."
  - id: c
    text:
      es: "La sanción que se impone al obligado, con indicación de la reducción que proceda conforme al artículo 188."
  - id: d
    text:
      es: "El órgano ante el que puede interponerse recurso y el plazo para hacerlo contra la propuesta."
  explanation:
    es: "El artículo 210.4 LGT incluye en la propuesta la infracción que los hechos puedan constituir o, en su caso, la declaración de inexistencia de infracción o responsabilidad. La sanción con la reducción corresponde a la resolución del artículo 211.3, y la propuesta no es un acto recurrible."
