# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q226
  prompt:
    es: "En Microsoft Edge, en Windows 11, la combinación Ctrl+9, que actúa sobre las pestañas abiertas en la ventana:"
  options:
  - id: a
    text:
      es: "Pasa a la pestaña anterior"
  - id: b
    text:
      es: "Pasa a la pestaña siguiente"
  - id: c
    correct: true
    text:
      es: "Pasa a la última pestaña"
  - id: d
    text:
      es: "Abre una pestaña nueva y cambia a ella"
  explanation:
    es: "Ctrl+9 pasa a la pestaña final. Pasar a la pestaña siguiente es la función de Ctrl+Pestaña. Pasar a la pestaña anterior es la función de Ctrl+Mayús+Pestaña. Abrir una pestaña nueva es la función de Ctrl+T."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+9 — Pasar a la última pestaña»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q228
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre una nueva ventana de InPrivate en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+N"
  - id: b
    text:
      es: "Ctrl+Mayús+M"
  - id: c
    text:
      es: "Ctrl+N"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+Mayús+N abre una nueva ventana de InPrivate. Ctrl+N abre una nueva ventana normal, no de InPrivate. Ctrl+Mayús+M inicia sesión como usuario distinto o examina como invitado. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-privacidad-html
- id: m06-l08-q231
  prompt:
    es: "¿Cuál de las siguientes cosas elimina Microsoft Edge, en Windows 11, al cerrar todas las ventanas de InPrivate?"
  options:
  - id: a
    text:
      es: "Los favoritos y los archivos descargados durante la exploración"
  - id: b
    text:
      es: "Solo el historial de exploración, sin las cookies ni las contraseñas guardadas en el perfil de Edge"
  - id: c
    text:
      es: "Nada, hasta que se cierra la sesión de Windows del usuario o se apaga el equipo"
  - id: d
    correct: true
    text:
      es: "Historial, cookies y datos del sitio, contraseñas y datos de formulario"
  explanation:
    es: "Al cerrar todas las ventanas de InPrivate, Edge elimina el historial de exploración, las cookies y los datos del sitio, las contraseñas, las direcciones y los datos de formulario. Elimina también las cookies, los datos del sitio, las contraseñas y los datos de formulario, no solo el historial. Los favoritos y los archivos descargados no figuran entre lo que se elimina; la página de InPrivate de Edge dice que permite «guardar descargas y favoritos». La eliminación se produce al cerrar todas las ventanas de InPrivate, no al cerrar la sesión de Windows."
  citation: "fuente: `ms-edge-privacidad.html`; «Microsoft Edge eliminará el historial de exploración, las cookies y los datos del sitio, así como las contraseñas, las direcciones y los datos de formulario al cerrar todas las ventanas de InPrivate.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q240
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿dónde se encuentra el botón Extensiones, que da acceso a las extensiones del explorador?"
  options:
  - id: a
    correct: true
    text:
      es: "A la derecha de la barra de direcciones del explorador"
  - id: b
    text:
      es: "En la barra de tareas de Windows, junto al logotipo de Edge"
  - id: c
    text:
      es: "En la barra de favoritos, bajo la barra de direcciones"
  - id: d
    text:
      es: "A la izquierda de la barra de direcciones del explorador"
  explanation:
    es: "El botón Extensiones se encuentra a la derecha de la barra de direcciones del explorador. La página lo sitúa a la derecha de la barra de direcciones, no a la izquierda. La página lo sitúa a la derecha de la barra de direcciones, no en la barra de favoritos. La página lo sitúa en el propio explorador, a la derecha de la barra de direcciones, no en la barra de tareas de Windows."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q242
  prompt:
    es: "¿Cuál de las siguientes opciones se selecciona después de Extensiones, en Microsoft Edge, en Windows 11, para buscar una extensión nueva?"
  options:
  - id: a
    text:
      es: "Administrar extensiones"
  - id: b
    correct: true
    text:
      es: "Obtener extensiones para Microsoft Edge"
  - id: c
    text:
      es: "Más acciones"
  - id: d
    text:
      es: "Notificar abuso"
  explanation:
    es: "Tras seleccionar Extensiones se elige Obtener extensiones para Microsoft Edge. Administrar extensiones es la opción para desactivar una extensión. Más acciones es la opción para quitar una extensión, junto a la extensión que se quiere quitar. Notificar abuso es la opción para informar de una extensión en el sitio web de complementos."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q243
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué botón se selecciona, tras revisar los permisos que pide una extensión, para seguir con la instalación?"
  options:
  - id: a
    text:
      es: "Quitar la extensión"
  - id: b
    correct: true
    text:
      es: "Agregar extensión"
  - id: c
    text:
      es: "Obtener la extensión"
  - id: d
    text:
      es: "Permitir otros almacenes"
  explanation:
    es: "Tras revisar los permisos requeridos por la extensión se selecciona Agregar extensión para continuar. Obtener es el botón que se selecciona antes, junto a la extensión que se quiere agregar. Quitar es la opción para eliminar una extensión de Edge. Permitir es la opción del cuadro de diálogo para permitir extensiones de otros almacenes."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q244
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿pueden usarse en Microsoft Edge las extensiones diseñadas para Google Chrome?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, pueden usarse, por ejemplo agregándolas desde Chrome Web Store"
  - id: b
    text:
      es: "Sí, pero solo en una ventana de InPrivate de Microsoft Edge"
  - id: c
    text:
      es: "Sí, pero solo en Windows 10, no en Windows 11"
  - id: d
    text:
      es: "No, solo funcionan las extensiones del sitio de complementos de Microsoft Edge"
  explanation:
    es: "Las extensiones diseñadas para Google Chrome también pueden usarse en Microsoft Edge, por ejemplo desde Chrome Web Store. La página dice que las de Chrome también pueden usarse en Edge, no solo las de su propio sitio de complementos. No se limitan a InPrivate: pueden usarse en Edge, y en InPrivate solo se ejecutan las que tienen permiso concedido. La página se aplica a Windows 11 y Windows 10, sin limitar a Windows 10 las extensiones de Chrome."
  citation: "fuente: `ms-edge-extensiones.html`; «Agregar una extensión a Microsoft Edge desde Chrome Web Store»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q246
  prompt:
    es: "Señale cómo se desactiva una extensión, sin quitarla, en Microsoft Edge, en Windows 11, según la página de Microsoft sobre extensiones:"
  options:
  - id: a
    correct: true
    text:
      es: "Extensiones › Administrar extensiones y el botón de alternancia"
  - id: b
    text:
      es: "Extensiones › Más acciones junto a la extensión › Quitar de Microsoft Edge"
  - id: c
    text:
      es: "Clic derecho en el icono de la extensión › Quitar de Microsoft Edge › Quitar"
  - id: d
    text:
      es: "Extensiones › Obtener extensiones para Microsoft Edge, y el botón Obtener"
  explanation:
    es: "Para desactivar una extensión se selecciona Extensiones › Administrar extensiones y el botón de alternancia junto a la extensión. Extensiones › Más acciones › Quitar de Microsoft Edge es uno de los métodos para quitar la extensión, no para desactivarla. El clic derecho en el icono de la extensión y Quitar de Microsoft Edge › Quitar es el otro método para quitarla. Obtener extensiones para Microsoft Edge sirve para buscar y agregar extensiones nuevas."
  citation: "fuente: `ms-edge-extensiones.html`; «En Microsoft Edge, seleccione Extensiones situadas a la derecha de la barra de direcciones del explorador y, después, seleccione Administrar extensiones.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q247
  prompt:
    es: "¿Cuál de las siguientes secuencias de pasos permite quitar una extensión desde su icono, a la derecha de la barra de direcciones de Microsoft Edge?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en el icono › Quitar de Microsoft Edge › Quitar"
  - id: b
    text:
      es: "Clic derecho en el icono › Notificar abuso › Quitar"
  - id: c
    text:
      es: "Clic derecho en el icono › Obtener extensiones para Microsoft Edge"
  - id: d
    text:
      es: "Clic derecho en el icono › Administrar extensiones › Desactivar"
  explanation:
    es: "Con el botón derecho en el icono de la extensión se selecciona Quitar de Microsoft Edge y después Quitar. Administrar extensiones y el botón de alternancia es el método para desactivar, no para quitar. Obtener extensiones para Microsoft Edge sirve para agregar extensiones, no para quitarlas. Notificar abuso es la opción para informar al sitio web de complementos de una extensión que infringe sus directivas."
