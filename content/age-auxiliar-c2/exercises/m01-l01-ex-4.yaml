# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q094
  prompt:
    es: "Conforme al artículo 55.1 de la Constitución Española de 1978, el derecho de los españoles a elegir libremente su residencia y a circular por el territorio nacional puede suspenderse cuando se declare el estado de:"
  options:
  - id: a
    text:
      es: "Alarma o de excepción."
  - id: b
    text:
      es: "Alarma o de sitio."
  - id: c
    text:
      es: "Alarma, excepción o sitio, a elección del Gobierno."
  - id: d
    correct: true
    text:
      es: "Excepción o de sitio."
  explanation:
    es: "El artículo 55.1 permite suspender el derecho del artículo 19 cuando se acuerde la declaración del estado de excepción o de sitio. Esa lista de supuestos deja fuera el estado de alarma, que regula el artículo 116.2. Las tres combinaciones que incluyen la alarma son incorrectas, aunque dos de ellas citen además uno de los estados válidos."
  citation: "art. 55.1 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q095
  prompt:
    es: "¿Cuál de los siguientes derechos puede ser suspendido, según el artículo 55.1 de la Constitución Española de 1978, cuando se acuerde la declaración del estado de excepción o de sitio?"
  options:
  - id: a
    text:
      es: "El derecho a la vida y a la integridad física y moral."
  - id: b
    correct: true
    text:
      es: "El derecho de huelga de los trabajadores."
  - id: c
    text:
      es: "La igualdad de los españoles ante la ley."
  - id: d
    text:
      es: "El derecho a acceder a las funciones y cargos públicos."
  explanation:
    es: "El artículo 55.1 incluye entre los derechos suspendibles el de huelga, del artículo 28.2. La lista es cerrada: artículos 17, 18.2 y 3, 19, 20.1.a y d, 20.5, 21, 28.2 y 37.2. La vida y la integridad (artículo 15), la igualdad ante la ley (artículo 14) y el acceso a las funciones y cargos públicos (artículo 23.2) están fuera de ella."
  citation: "art. 55.1 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q096
  prompt:
    es: "Conforme al artículo 55.1 de la Constitución Española de 1978, cuando se acuerde el estado de excepción o de sitio puede suspenderse, entre otros, el derecho de los trabajadores y empresarios a:"
  options:
  - id: a
    text:
      es: "La negociación colectiva laboral y la fuerza vinculante de los convenios."
  - id: b
    text:
      es: "La libertad de empresa en el marco de la economía de mercado."
  - id: c
    text:
      es: "Constituir un sindicato y afiliarse al de su elección."
  - id: d
    correct: true
    text:
      es: "Adoptar medidas de conflicto colectivo."
  explanation:
    es: "El artículo 55.1 permite suspender el artículo 37.2, el derecho a adoptar medidas de conflicto colectivo. La negociación colectiva del artículo 37.1 queda fuera: el apartado 1 de ese artículo no está en la lista. La libertad de empresa del artículo 38 y la libertad sindical del artículo 28.1 tampoco se pueden suspender; de ese artículo solo el apartado 2, el derecho de huelga."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q097
  prompt:
    es: "¿Cuál de los siguientes pares de derechos puede suspenderse, conforme al artículo 55.1 de la Constitución Española de 1978, al declararse el estado de excepción o de sitio?"
  options:
  - id: a
    correct: true
    text:
      es: "La inviolabilidad del domicilio y el secreto de las comunicaciones."
  - id: b
    text:
      es: "El derecho de asociación y el derecho de petición."
  - id: c
    text:
      es: "El derecho a la educación y la libertad de empresa."
  - id: d
    text:
      es: "La vida y la integridad física y moral."
  explanation:
    es: "El artículo 55.1 permite suspender los apartados 2 y 3 del artículo 18, es decir, la inviolabilidad del domicilio y el secreto de las comunicaciones. La lista de derechos suspendibles es cerrada, y deja fuera la asociación (artículo 22), la petición (artículo 29), la educación (artículo 27), la libertad de empresa (artículo 38) y el derecho a la vida y a la integridad (artículo 15)."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q098
  prompt:
    es: "Señale la respuesta correcta sobre la norma que puede determinar la suspensión individual de determinados derechos para personas concretas, según el artículo 55.2 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Una ley ordinaria aprobada por mayoría simple."
  - id: b
    text:
      es: "Un real decreto-ley del Gobierno."
  - id: c
    correct: true
    text:
      es: "Una ley orgánica."
  - id: d
    text:
      es: "Un decreto acordado en Consejo de Ministros."
  explanation:
    es: "El artículo 55.2 dice que una ley orgánica podrá determinar la forma y los casos de esa suspensión. Una ley ordinaria, un real decreto-ley y un decreto del Consejo de Ministros son normas de menor exigencia: la materia queda reservada a la ley orgánica."
  citation: "art. 55.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q099
  prompt:
    es: "¿Con qué exigencias permite el artículo 55.2 de la Constitución Española de 1978 que una ley orgánica determine la suspensión individual de ciertos derechos para personas determinadas?"
  options:
  - id: a
    text:
      es: "Con la autorización del Congreso y el control del Defensor del Pueblo."
  - id: b
    text:
      es: "Con la declaración previa de un estado de excepción o de sitio."
  - id: c
    correct: true
    text:
      es: "Con la necesaria intervención judicial y el adecuado control parlamentario."
  - id: d
    text:
      es: "Con el informe del Tribunal Constitucional y del Consejo de Estado."
  explanation:
    es: "El artículo 55.2 exige la necesaria intervención judicial y el adecuado control parlamentario. La autorización del Congreso con control del Defensor del Pueblo y el informe del Tribunal Constitucional y del Consejo de Estado cambian el control judicial y parlamentario por otros órganos. La declaración previa de un estado de excepción o de sitio es el supuesto del apartado 1, distinto de la suspensión individual."
  citation: "art. 55.2 CE"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q100
  prompt:
    es: "Según el artículo 55.2 de la Constitución Española de 1978, la suspensión individual de derechos para personas determinadas se refiere a las investigaciones sobre la actuación de:"
  options:
  - id: a
    correct: true
    text:
      es: "Bandas armadas o elementos terroristas."
  - id: b
    text:
      es: "Organizaciones secretas o paramilitares."
  - id: c
    text:
      es: "Partidos políticos declarados ilegales."
  - id: d
    text:
      es: "Asociaciones que persigan fines delictivos."
  explanation:
    es: "El artículo 55.2 vincula la suspensión individual a las investigaciones sobre bandas armadas o elementos terroristas. Las asociaciones secretas o paramilitares están prohibidas por el artículo 22.5, pero eso es otra regla. Los partidos declarados ilegales y las asociaciones con fines delictivos son otros supuestos, ajenos a la referencia del apartado 2."
  citation: "art. 55.2 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q101
  prompt:
    es: "¿Cuál de los siguientes conjuntos de derechos puede suspenderse a título individual, conforme al artículo 55.2 de la Constitución Española de 1978, mediante la ley orgánica correspondiente?"
  options:
  - id: a
    text:
      es: "La libertad de expresión, el derecho de reunión y el derecho de huelga."
  - id: b
    text:
      es: "La libre residencia y circulación y el derecho de asociación."
  - id: c
    text:
      es: "El derecho de reunión y el secreto de las comunicaciones."
  - id: d
    correct: true
    text:
      es: "El plazo de la detención preventiva, la inviolabilidad del domicilio y el secreto de las comunicaciones."
  explanation:
    es: "El artículo 55.2 remite a los artículos 17.2 y 18.2 y 3: el plazo de la detención preventiva, la inviolabilidad del domicilio y el secreto de las comunicaciones. La expresión, la reunión y la huelga solo pueden suspenderse con el estado de excepción o de sitio del apartado 1, igual que la residencia y la circulación. El derecho de asociación no es suspendible. La opción que mezcla reunión con comunicaciones junta un derecho del apartado 1 con uno del apartado 2."
  citation: "art. 55.2 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q103
  prompt:
    es: "Conforme al artículo 116.2 de la Constitución Española de 1978, el plazo de quince días del estado de alarma no podrá prorrogarse sin la autorización de:"
  options:
  - id: a
    text:
      es: "Solo el Senado."
  - id: b
    text:
      es: "Las Cortes Generales reunidas en sesión conjunta."
  - id: c
    text:
      es: "El Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "El Congreso de los Diputados."
  explanation:
    es: "La prórroga del estado de alarma exige la autorización del Congreso de los Diputados, ante el que el Gobierno ha dado cuenta de la declaración. El Senado, solo o con el Congreso en sesión conjunta, queda fuera del trámite del artículo 116.2. El Consejo de Ministros acuerda el decreto de declaración, pero no puede prorrogar por sí solo."
  citation: "art. 116.2–4 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q104
  prompt:
    es: "Según el artículo 116.3 de la Constitución Española de 1978, que regula una de las tres situaciones de emergencia constitucional, el estado de excepción será declarado:"
  options:
  - id: a
    text:
      es: "Por el Congreso, por mayoría absoluta, a propuesta exclusiva del Gobierno."
  - id: b
    correct: true
    text:
      es: "Por el Gobierno, mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso."
  - id: c
    text:
      es: "Por el Gobierno, dando cuenta al Congreso, que autoriza solo su prórroga."
  - id: d
    text:
      es: "Por el Gobierno, previa autorización del Senado, por un plazo de quince días."
  explanation:
    es: "El artículo 116.3 atribuye la declaración del estado de excepción al Gobierno, mediante decreto del Consejo de Ministros y con autorización previa del Congreso. La declaración por el Congreso a propuesta del Gobierno es la del estado de sitio. Dar cuenta después, con autorización solo de la prórroga, es el régimen del estado de alarma. La autorización del Senado sustituye al Congreso, que es quien autoriza, y los quince días son el plazo del estado de alarma."
  citation: "art. 116.2–4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q105
  prompt:
    es: "Según la Constitución Española de 1978, y a diferencia de lo previsto para los estados de alarma y de excepción, el estado de sitio será declarado:"
  options:
  - id: a
    text:
      es: "Por el Gobierno, mediante decreto, previa autorización del Congreso."
  - id: b
    text:
      es: "Por mayoría de tres quintos del Congreso y del Senado, a propuesta del Rey."
  - id: c
    correct: true
    text:
      es: "Por la mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno."
  - id: d
    text:
      es: "Por el Rey, a propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 116.4 atribuye el estado de sitio a la mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno. La declaración por decreto del Consejo de Ministros con autorización del Congreso es la del estado de excepción. La mayoría de tres quintos de ambas Cámaras con propuesta del Rey, y el Rey a propuesta del Presidente del Gobierno, sustituyen el órgano y la mayoría del artículo."
  citation: "art. 116.2–4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q106
  prompt:
    es: "¿Cuál de los siguientes órganos determina la duración del estado de sitio, según el artículo 116.4 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Congreso de los Diputados."
  - id: b
    text:
      es: "El Gobierno, en el decreto de declaración."
  - id: c
    text:
      es: "El Senado, a propuesta del Gobierno."
  - id: d
    text:
      es: "El Rey, mediante real decreto."
  explanation:
    es: "El artículo 116.4 dice que el Congreso determina el ámbito territorial, la duración y las condiciones del estado de sitio, a diferencia de la alarma y la excepción, con plazos fijados en la Constitución. El Gobierno solo propone la declaración. El Senado y el Rey no determinan la duración: esa decisión es del Congreso."
  citation: "art. 116.2–4 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q107
  prompt:
    es: "Según la Constitución Española de 1978, y por lo que se refiere al Congreso, mientras estén declarados los estados de alarma, de excepción o de sitio:"
  options:
  - id: a
    correct: true
    text:
      es: "No puede procederse a la disolución del Congreso."
  - id: b
    text:
      es: "Debe disolverse el Congreso y convocar elecciones inmediatas."
  - id: c
    text:
      es: "Solo puede disolverse el Congreso con la autorización del Senado."
  - id: d
    text:
      es: "Puede disolverse el Congreso, pero no el Senado."
  explanation:
    es: "El artículo 116.5 prohíbe disolver el Congreso mientras esté declarado alguno de los tres estados. Las otras opciones imponen la disolución, la subordinan al Senado o la limitan a una Cámara: nada de eso figura en el texto."
  citation: "art. 116.5 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q108
  prompt:
    es: "Un estado de excepción se autoriza por el plazo máximo que fija la Constitución Española de 1978 y se prorroga una vez, por otro plazo igual. ¿Cuántos días puede durar en total, como máximo?"
  options:
  - id: a
    text:
      es: "Treinta días."
  - id: b
    text:
      es: "Cuarenta y cinco días."
  - id: c
    correct: true
    text:
      es: "Sesenta días."
  - id: d
    text:
      es: "Noventa días."
  explanation:
    es: "El artículo 116.3 limita la duración inicial a treinta días y admite una prórroga por otro plazo igual: 30 + 30 = 60 días. Treinta es solo la duración inicial. Cuarenta y cinco corresponde a un plazo de quince más treinta, que no encaja con ninguna regla del artículo. Noventa supondría una segunda prórroga."
  citation: "art. 116.2–4 CE"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
