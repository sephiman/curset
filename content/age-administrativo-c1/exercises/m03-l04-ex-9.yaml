# anchor: boe-a-2017-12902-art-39
- id: m03-l04-q254
  prompt:
    es: "Según el artículo 39.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuáles son causas de nulidad de derecho administrativo?"
  options:
  - id: a
    text:
      es: "Las causas de anulabilidad de la Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "Las causas de nulidad de la Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas."
  - id: c
    text:
      es: "Las causas de nulidad del Código Civil previstas para los contratos entre particulares."
  - id: d
    text:
      es: "Las causas de nulidad de la Ley 40/2015, de Régimen Jurídico del Sector Público."
  explanation:
    es: "El artículo 39.1 LCSP remite a las causas de nulidad «indicadas en el artículo 47 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas». Las de anulabilidad de esa Ley corresponden al artículo 40 LCSP. Las causas del derecho civil son invalidez de otra clase. La Ley 40/2015 no es la norma a la que remite el precepto."
  citation: "art. 39.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-39
- id: m03-l04-q255
  prompt:
    es: "Según el artículo 39.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál de las siguientes es causa de nulidad de los contratos celebrados por poderes adjudicadores?"
  options:
  - id: a
    text:
      es: "El incumplimiento de los requisitos legales para modificar el contrato."
  - id: b
    text:
      es: "La demora del contratista en el cumplimiento del plazo total de ejecución."
  - id: c
    correct: true
    text:
      es: "La falta de solvencia económica, financiera, técnica o profesional del adjudicatario."
  - id: d
    text:
      es: "El incumplimiento por el contratista de la obligación principal del contrato."
  explanation:
    es: "El artículo 39.2.a) LCSP declara nulos de pleno derecho los contratos en que concurra «la falta de capacidad de obrar o de solvencia económica, financiera, técnica o profesional» del adjudicatario. El incumplimiento de los requisitos para modificar el contrato es causa de anulabilidad (art. 40.a) LCSP). La demora del contratista y el incumplimiento de la obligación principal son causas de resolución (art. 211.1 LCSP), que operan sobre un contrato válido."
  citation: "art. 39.2.a) LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-39
- id: m03-l04-q256
  prompt:
    es: "Según el artículo 39.2.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la carencia o insuficiencia de crédito es causa de nulidad de los contratos celebrados por poderes adjudicadores:"
  options:
  - id: a
    text:
      es: "Salvo en los contratos menores de obras."
  - id: b
    text:
      es: "Salvo en la tramitación urgente del expediente."
  - id: c
    text:
      es: "Salvo en los contratos basados en un acuerdo marco."
  - id: d
    correct: true
    text:
      es: "Salvo en los supuestos de emergencia."
  explanation:
    es: "El artículo 39.2.b) LCSP hace nula la carencia o insuficiencia de crédito «salvo los supuestos de emergencia». La tramitación urgente es otra figura: acorta plazos, pero no exime del crédito. Los contratos menores y los basados en un acuerdo marco tampoco son excepciones a esta causa."
  citation: "art. 39.2.b) LCSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-40
- id: m03-l04-q257
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, las demás infracciones del ordenamiento jurídico que no son causa de nulidad de los contratos constituyen:"
  options:
  - id: a
    correct: true
    text:
      es: "Causas de anulabilidad de derecho administrativo."
  - id: b
    text:
      es: "Causas de resolución del contrato por incumplimiento."
  - id: c
    text:
      es: "Causas de invalidez de derecho civil."
  - id: d
    text:
      es: "Causas de revisión de oficio por nulidad de pleno derecho."
  explanation:
    es: "El artículo 40 LCSP dice: «Son causas de anulabilidad de derecho administrativo las demás infracciones del ordenamiento jurídico y, en especial, las de las reglas contenidas en la presente Ley». Las causas de resolución afectan a la ejecución de un contrato válido. Las causas de invalidez de derecho civil son otra categoría. Una infracción que no es causa de nulidad no puede llevar a una revisión de oficio por nulidad de pleno derecho."
  citation: "art. 40 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q258
  prompt:
    es: "Según el artículo 44.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en los contratos de las Administraciones Públicas, admiten recurso especial en materia de contratación los contratos de servicios con un valor estimado:"
  options:
  - id: a
    correct: true
    text:
      es: "Superior a cien mil euros."
  - id: b
    text:
      es: "Superior a quince mil euros."
  - id: c
    text:
      es: "Igual o superior a 140.000 euros."
  - id: d
    text:
      es: "Superior a tres millones de euros."
  explanation:
    es: "El artículo 44.1.a) LCSP incluye los contratos «de suministro y servicios, que tenga un valor estimado superior a cien mil euros». Quince mil euros es el límite del contrato menor de servicios (art. 118.1 LCSP). 140.000 euros es el umbral de regulación armonizada de los servicios que adjudica la Administración General del Estado. Tres millones es el umbral de las obras y de las concesiones para este recurso."
  citation: "art. 44.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q259
  prompt:
    es: "¿A partir de qué valor estimado son susceptibles de recurso especial en materia de contratación los contratos de obras que pretendan concertar las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Igual o superior a 5.404.000 euros."
  - id: b
    correct: true
    text:
      es: "Superior a tres millones de euros."
  - id: c
    text:
      es: "Superior a un millón de euros."
  - id: d
    text:
      es: "Superior a cuarenta mil euros."
  explanation:
    es: "El artículo 44.1.a) LCSP incluye los «contratos de obras cuyo valor estimado sea superior a tres millones de euros». 5.404.000 euros es el umbral de regulación armonizada de las obras, otra figura. Cuarenta mil euros es el límite del contrato menor de obras. Un millón no es ningún umbral de este recurso."
  citation: "art. 44.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q260
  prompt:
    es: "Según el artículo 44.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué concesiones son susceptibles de recurso especial en materia de contratación?"
  options:
  - id: a
    text:
      es: "Las concesiones de obras o de servicios cuyo valor estimado supere los cien mil euros."
  - id: b
    text:
      es: "Solo las concesiones de obras cuyo valor estimado supere los tres millones de euros."
  - id: c
    text:
      es: "Solo las concesiones de servicios cuyo valor estimado supere los cien mil euros."
  - id: d
    correct: true
    text:
      es: "Las concesiones de obras o de servicios cuyo valor estimado supere los tres millones de euros."
  explanation:
    es: "El artículo 44.1.c) LCSP incluye las «concesiones de obras o de servicios cuyo valor estimado supere los tres millones de euros». El umbral es el mismo para los dos tipos de concesión. Cien mil euros es el umbral de los contratos de suministro y servicios, no el de las concesiones."
  citation: "art. 44.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q261
  prompt:
    es: "Un ministerio licita un contrato de suministro con un valor estimado de 120.000 euros. Un licitador considera que el pliego restringe la competencia. ¿Puede interponer contra el pliego el recurso especial en materia de contratación?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque el valor estimado del contrato supera los cien mil euros."
  - id: b
    text:
      es: "No, porque el valor estimado no alcanza el umbral de 140.000 euros de la regulación armonizada."
  - id: c
    text:
      es: "No, porque el recurso especial solo cabe en los contratos de obras de más de tres millones."
  - id: d
    text:
      es: "No, porque contra los pliegos solo caben los recursos administrativos ordinarios."
  explanation:
    es: "El artículo 44.1.a) LCSP admite el recurso especial en los contratos de suministro de valor estimado superior a cien mil euros, y 120.000 euros lo supera. Los pliegos son recurribles (art. 44.2.a) LCSP). El recurso no exige que el contrato esté sujeto a regulación armonizada. No está limitado a las obras. Contra los actos que admiten recurso especial no proceden los recursos administrativos ordinarios (art. 44.5 LCSP)."
  citation: "art. 44.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q262
  prompt:
    es: "Un contrato de servicios de la Administración General del Estado tiene un valor estimado de 130.000 euros. ¿Cuál de las siguientes afirmaciones es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Admite recurso especial, aunque no está sujeto a regulación armonizada."
  - id: b
    text:
      es: "Está sujeto a regulación armonizada y admite recurso especial."
  - id: c
    text:
      es: "No está sujeto a regulación armonizada ni admite recurso especial."
  - id: d
    text:
      es: "Está sujeto a regulación armonizada, pero no admite recurso especial."
  explanation:
    es: "El recurso especial cabe en los servicios de valor estimado superior a cien mil euros (art. 44.1.a) LCSP), y 130.000 euros lo supera. La regulación armonizada de los servicios que adjudica la Administración General del Estado empieza en 140.000 euros (art. 22.1 LCSP y Orden HAC/1517/2025), y 130.000 euros no llega. Los dos umbrales son distintos y este contrato queda entre ellos. Las otras tres opciones aciertan como mucho en uno de los dos datos."
  citation: "art. 44.1 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q264
  prompt:
    es: "De acuerdo con el artículo 44.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, pueden ser objeto del recurso especial en materia de contratación, entre otras actuaciones:"
  options:
  - id: a
    text:
      es: "Los anuncios de licitación, los pliegos y las órdenes de pago del precio."
  - id: b
    text:
      es: "Los acuerdos de adjudicación y las certificaciones de obra aprobadas."
  - id: c
    text:
      es: "Los pliegos y las penalidades por demora impuestas durante la ejecución."
  - id: d
    correct: true
    text:
      es: "Los anuncios de licitación, los pliegos y los acuerdos de adjudicación."
  explanation:
    es: "El artículo 44.2 LCSP incluye, entre otras actuaciones, «los anuncios de licitación, los pliegos y los documentos contractuales» y «los acuerdos de adjudicación». Las órdenes de pago, las certificaciones de obra y las penalidades por demora son actos de la ejecución del contrato y no están en esa lista."
  citation: "art. 44.2 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q265
  prompt:
    es: "Según el artículo 44.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué procedimientos de adjudicación no se da el recurso especial en materia de contratación?"
  options:
  - id: a
    text:
      es: "En los que se sigan por el trámite de urgencia."
  - id: b
    correct: true
    text:
      es: "En los que se sigan por el trámite de emergencia."
  - id: c
    text:
      es: "En los procedimientos abiertos simplificados."
  - id: d
    text:
      es: "En los procedimientos negociados sin publicidad."
  explanation:
    es: "El artículo 44.4 LCSP dice: «No se dará este recurso en relación con los procedimientos de adjudicación que se sigan por el trámite de emergencia». La tramitación urgente es otra figura y no excluye el recurso. El procedimiento abierto simplificado y el negociado sin publicidad lo admiten si el contrato alcanza los umbrales del artículo 44.1."
  citation: "art. 44.4 LCSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-44
- id: m03-l04-q266
  prompt:
    es: "Según el artículo 44.5 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, contra las actuaciones susceptibles de ser impugnadas mediante el recurso especial en materia de contratación:"
  options:
  - id: a
    text:
      es: "Debe interponerse antes el recurso de alzada ante el órgano superior."
  - id: b
    correct: true
    text:
      es: "No procede la interposición de recursos administrativos ordinarios."
  - id: c
    text:
      es: "Cabe el recurso potestativo de reposición, que se resuelve antes que el especial."
  - id: d
    text:
      es: "Debe solicitarse antes la revisión de oficio al órgano de contratación."
  explanation:
    es: "El artículo 44.5 LCSP dice que contra esas actuaciones «no procederá la interposición de recursos administrativos ordinarios». La alzada y la reposición son recursos ordinarios, así que quedan excluidos. La Ley tampoco exige pedir antes la revisión de oficio."
  citation: "art. 44.5 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-49
- id: m03-l04-q268
  prompt:
    es: "Según el artículo 49.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, antes de interponer el recurso especial, las personas legitimadas para ello pueden solicitar la adopción de medidas cautelares ante:"
  options:
  - id: a
    text:
      es: "El órgano de contratación que dictó el acto."
  - id: b
    text:
      es: "El juzgado de lo contencioso-administrativo competente."
  - id: c
    correct: true
    text:
      es: "El órgano competente para resolver el recurso."
  - id: d
    text:
      es: "La mesa de contratación del procedimiento."
  explanation:
    es: "El artículo 49.1 LCSP dice que las personas legitimadas «podrán solicitar ante el órgano competente para resolver el recurso la adopción de medidas cautelares». No se piden al órgano de contratación ni a la mesa, que son parte del procedimiento recurrido. El juzgado de lo contencioso-administrativo no interviene en el recurso especial."
  citation: "art. 49.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2017-12902-art-49
- id: m03-l04-q269
  prompt:
    es: "¿En qué momento pueden las personas legitimadas solicitar al órgano competente para resolver el recurso especial en materia de contratación la adopción de medidas cautelares?"
  options:
  - id: a
    text:
      es: "Solo una vez interpuesto el recurso especial."
  - id: b
    text:
      es: "Solo una vez formalizado el contrato."
  - id: c
    text:
      es: "Solo tras la resolución desestimatoria del recurso."
  - id: d
    correct: true
    text:
      es: "Antes de interponer el recurso especial."
  explanation:
    es: "El artículo 49.1 LCSP empieza así: «Antes de interponer el recurso especial, las personas legitimadas para ello podrán solicitar […] la adopción de medidas cautelares». La opción que solo las admite una vez interpuesto el recurso niega lo que el precepto permite. Esperar a la formalización o a la desestimación del recurso vaciaría las medidas, cuyo fin es corregir infracciones o suspender el procedimiento."
  citation: "art. 49.1 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q271
  prompt:
    es: "La adjudicación de un contrato de servicios con un valor estimado de 300.000 euros se notifica a los licitadores el lunes 2 de febrero de 2026. Si no hay festivos en el periodo, ¿cuál es el último día para interponer contra ella el recurso especial?"
  options:
  - id: a
    text:
      es: "El martes 17 de febrero de 2026."
  - id: b
    text:
      es: "El viernes 20 de febrero de 2026."
  - id: c
    text:
      es: "El martes 24 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 23 de febrero de 2026."
  explanation:
    es: "El artículo 50.1 LCSP da quince días hábiles, contados contra la adjudicación desde el día siguiente a su notificación. El plazo empieza el martes 3 de febrero de 2026. Sin sábados ni domingos, del 3 al 6 de febrero van 4 días hábiles, del 9 al 13 llegan a 9 y del 16 al 20 llegan a 14. El día 15 es el lunes 23 de febrero. El martes 17 de febrero cuenta quince días naturales. El viernes 20 de febrero se queda en el día 14 y el martes 24 de febrero es ya el día 16."
  citation: "art. 50.1 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q272
  prompt:
    es: "La adjudicación de un contrato de obras con un valor estimado de 4.000.000 de euros se notifica a los licitadores el viernes 5 de febrero de 2027. Si no hay festivos en el periodo, ¿hasta qué día puede interponerse contra ella el recurso especial?"
  options:
  - id: a
    text:
      es: "Hasta el lunes 22 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el viernes 26 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el jueves 25 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el lunes 1 de marzo de 2027."
  explanation:
    es: "El artículo 50.1 LCSP da quince días hábiles desde el día siguiente a la notificación de la adjudicación. El día siguiente es sábado, así que el primer día hábil es el lunes 8 de febrero de 2027. Del 8 al 12 van 5 días hábiles, del 15 al 19 llegan a 10 y del 22 al 26 llegan a 15: el último día es el viernes 26 de febrero. El lunes 22 de febrero sale de contar quince días naturales, que acaban el sábado 20, y pasarlo al lunes. El jueves 25 cuenta como primer día el de la notificación. El lunes 1 de marzo es ya el día 16."
  citation: "art. 50.1 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q273
  prompt:
    es: "Según el artículo 50.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el recurso especial alega la nulidad del artículo 39.2.c) a f), el plazo desde la publicación de la formalización es de:"
  options:
  - id: a
    text:
      es: "Quince días hábiles a contar desde esa publicación."
  - id: b
    text:
      es: "Dos meses a contar desde esa publicación."
  - id: c
    text:
      es: "Un año a contar desde esa publicación."
  - id: d
    correct: true
    text:
      es: "Treinta días a contar desde esa publicación."
  explanation:
    es: "El artículo 50.2.a) LCSP fija «treinta días a contar desde la publicación de la formalización del contrato» o desde la notificación de los motivos del rechazo. Quince días hábiles es el plazo general del artículo 50.1, que este apartado desplaza. Dos meses y un año no son plazos del precepto. Cuando no se da ninguno de esos dos hechos, el límite es de seis meses desde la formalización."
  citation: "art. 50.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q274
  prompt:
    es: "Según el artículo 50.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el recurso especial alega la nulidad del artículo 39.2.c) a f), ¿qué plazo rige cuando no se aplica el de treinta días?"
  options:
  - id: a
    text:
      es: "Antes de que transcurra un año desde la formalización del contrato."
  - id: b
    correct: true
    text:
      es: "Antes de que transcurran seis meses desde la formalización del contrato."
  - id: c
    text:
      es: "Antes de que transcurran seis meses desde la adjudicación del contrato."
  - id: d
    text:
      es: "Quince días hábiles desde que se conozca la posible infracción."
  explanation:
    es: "El artículo 50.2.b) LCSP dice que, en los restantes casos, el recurso se interpone «antes de que transcurran seis meses a contar desde la formalización del contrato». La opción de un año cambia la duración. La de la adjudicación cambia el día de partida. Quince días hábiles desde el conocimiento de la infracción es el cómputo general del artículo 50.1 para los actos de trámite, que no rige en estos casos."
  citation: "art. 50.2 LCSP"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q275
  prompt:
    es: "Un licitador recibe el martes 3 de febrero de 2026 la notificación de los motivos del rechazo de su proposición y funda el recurso especial en la falta de publicación del anuncio de licitación. Contando desde el día siguiente, ¿cuál es el último día del plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves 5 de marzo de 2026."
  - id: b
    text:
      es: "El martes 3 de marzo de 2026."
  - id: c
    text:
      es: "El miércoles 4 de marzo de 2026."
  - id: d
    text:
      es: "El martes 17 de marzo de 2026."
  explanation:
    es: "La falta de publicación del anuncio de licitación es la causa de nulidad del artículo 39.2.c) LCSP, y el artículo 50.2.a) LCSP da treinta días desde la notificación de los motivos del rechazo. El precepto no dice hábiles, así que son naturales (disposición adicional duodécima LCSP). Desde el miércoles 4 de febrero de 2026, el 28 de febrero es el día 25 y el jueves 5 de marzo es el día 30, que es hábil. El martes 3 de marzo cuenta un mes de fecha a fecha. El miércoles 4 de marzo cuenta como primer día el de la notificación. El martes 17 de marzo cuenta treinta días hábiles."
  citation: "art. 50.2 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-53
- id: m03-l04-q276
  prompt:
    es: "De acuerdo con el artículo 53 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, una vez interpuesto el recurso especial, queda en suspenso la tramitación del procedimiento cuando el acto recurrido es:"
  options:
  - id: a
    text:
      es: "El anuncio de licitación del contrato."
  - id: b
    text:
      es: "El pliego de cláusulas administrativas particulares."
  - id: c
    correct: true
    text:
      es: "El acuerdo de adjudicación del contrato."
  - id: d
    text:
      es: "Cualquier acto de trámite de la mesa de contratación."
  explanation:
    es: "El artículo 53 LCSP suspende la tramitación «cuando el acto recurrido sea el de adjudicación». El recurso contra el anuncio, contra el pliego o contra un acto de trámite no suspende por sí solo el procedimiento. La suspensión en esos casos depende de que se pida y se acuerde como medida cautelar (art. 49.1 LCSP)."
  citation: "art. 53 LCSP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-53
- id: m03-l04-q277
  prompt:
    es: "Según el artículo 53 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué contratos la interposición del recurso especial contra la adjudicación no deja en suspenso la tramitación del procedimiento?"
  options:
  - id: a
    text:
      es: "En los contratos de obras con un valor estimado superior a tres millones de euros."
  - id: b
    text:
      es: "En los contratos sujetos a regulación armonizada adjudicados por el procedimiento abierto o por el restringido."
  - id: c
    correct: true
    text:
      es: "En los contratos basados en un acuerdo marco y en los específicos de un sistema dinámico de adquisición."
  - id: d
    text:
      es: "En los contratos de concesión de servicios cuyo valor estimado supere los tres millones."
  explanation:
    es: "El artículo 53 LCSP exceptúa de la suspensión «el supuesto de contratos basados en un acuerdo marco o de contratos específicos en el marco de un sistema dinámico de adquisición». Las obras de más de tres millones, los contratos sujetos a regulación armonizada y las concesiones de servicios de más de tres millones siguen la regla general: el recurso contra la adjudicación suspende la tramitación."
  citation: "art. 53 LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-45
- id: m03-l04-q278
  prompt:
    es: "Señale la respuesta correcta sobre el recurso especial en materia de contratación según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público:"
  options:
  - id: a
    text:
      es: "Cabe en los procedimientos de adjudicación que se tramitan por emergencia."
  - id: b
    correct: true
    text:
      es: "En el sector público estatal lo resuelve el Tribunal Administrativo Central de Recursos Contractuales."
  - id: c
    text:
      es: "Su interposición contra los pliegos suspende siempre la tramitación del procedimiento."
  - id: d
    text:
      es: "Puede interponerse a la vez que el recurso de alzada contra el mismo acto."
  explanation:
    es: "El artículo 45.1 LCSP encomienda estos recursos, en el sector público estatal, al Tribunal Administrativo Central de Recursos Contractuales. El recurso no se da en la tramitación de emergencia (art. 44.4 LCSP). La suspensión automática solo se produce cuando se recurre la adjudicación (art. 53 LCSP). Contra los actos que admiten recurso especial no proceden los recursos administrativos ordinarios, como la alzada (art. 44.5 LCSP)."
  citation: "art. 45.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2017-12902-art-50
- id: m03-l04-q280
  prompt:
    es: "La adjudicación de un contrato de servicios de 250.000 euros de valor estimado se notifica el miércoles 11 de noviembre de 2026. Un licitador presenta el recurso especial el martes 1 de diciembre de 2026. Sin festivos en el periodo, ¿está en plazo?"
  options:
  - id: a
    text:
      es: "No, porque los quince días se cuentan como naturales y vencieron el jueves 26 de noviembre."
  - id: b
    text:
      es: "No, porque el plazo se cuenta desde la fecha del acuerdo de adjudicación, no desde su notificación."
  - id: c
    text:
      es: "Sí, porque contra la adjudicación rige el plazo de treinta días desde la publicación de la formalización."
  - id: d
    correct: true
    text:
      es: "Sí, porque el plazo de quince días hábiles vence el miércoles 2 de diciembre de 2026."
  explanation:
    es: "El artículo 50.1 LCSP da quince días hábiles y, contra la adjudicación, el cómputo empieza el día siguiente a su notificación: el jueves 12 de noviembre de 2026. Sin sábados ni domingos, el 12 y el 13 son 2 días hábiles, del 16 al 20 llegan a 7, del 23 al 27 a 12, el lunes 30 es el 13, el martes 1 de diciembre el 14 y el miércoles 2 de diciembre el 15. El recurso del martes 1 de diciembre está en plazo. La opción de los días naturales olvida que el artículo dice hábiles, y con eso desplaza la regla general de la disposición adicional duodécima LCSP. El cómputo no parte del acuerdo, sino de la notificación. Los treinta días desde la publicación de la formalización son el plazo especial del artículo 50.2 para algunas causas de nulidad, no el de un recurso ordinario contra la adjudicación."
  citation: "art. 50.1 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-45
- id: m03-l04-q283
  prompt:
    es: "Un organismo autónomo de la Administración General del Estado licita un contrato de servicios con un valor estimado de 300.000 euros. ¿Qué órgano resuelve el recurso especial en materia de contratación contra sus pliegos?"
  options:
  - id: a
    text:
      es: "El titular del ministerio al que está adscrito el organismo autónomo."
  - id: b
    text:
      es: "El órgano de contratación del propio organismo autónomo."
  - id: c
    text:
      es: "La Junta Consultiva de Contratación Pública del Estado."
  - id: d
    correct: true
    text:
      es: "El Tribunal Administrativo Central de Recursos Contractuales."
  explanation:
    es: "Un organismo autónomo de la Administración General del Estado es un poder adjudicador del sector público estatal, y el contrato supera los cien mil euros que el artículo 44.1 LCSP exige a los servicios. El artículo 45.1 LCSP encomienda la resolución de estos recursos, en ese ámbito, «al Tribunal Administrativo Central de Recursos Contractuales». Ni el titular del ministerio de adscripción ni el órgano de contratación del organismo resuelven el recurso especial. La Junta Consultiva de Contratación Pública del Estado es un órgano consultivo."
  citation: "art. 45.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
