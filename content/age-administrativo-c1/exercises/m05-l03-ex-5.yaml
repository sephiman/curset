# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q122
  prompt:
    es: "Según el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el compromiso acuerda la realización de gastos previamente aprobados por un importe:"
  options:
  - id: a
    text:
      es: "cierto o aproximado, reservando parte de un crédito presupuestario."
  - id: b
    text:
      es: "máximo, que fija en cada caso el Consejo de Ministros."
  - id: c
    text:
      es: "indeterminado hasta que se reciba la prestación."
  - id: d
    correct: true
    text:
      es: "determinado o determinable, con relevancia jurídica para terceros."
  explanation:
    es: "El compromiso de gasto se refiere a gastos ya aprobados por un importe determinado o determinable. La cuantía cierta o aproximada es la de la aprobación; el Consejo de Ministros y la recepción de la prestación no fijan el importe del compromiso."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q125
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Ministros aprueban y comprometen los gastos propios de sus presupuestos, salvo los casos reservados por la ley a la competencia del:"
  options:
  - id: a
    text:
      es: "Congreso de los Diputados."
  - id: b
    text:
      es: "Tribunal de Cuentas."
  - id: c
    correct: true
    text:
      es: "Consejo de Ministros."
  - id: d
    text:
      es: "Consejo de Estado."
  explanation:
    es: "La salvedad del artículo 74.1 se refiere a los casos que la ley reserva al Consejo de Ministros. El Consejo de Estado, el Congreso de los Diputados y el Tribunal de Cuentas no tienen esa reserva de aprobación del gasto."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q126
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién ejerce las competencias de gasto de los Ministros por debajo de los límites que ellos mismos fijen, en su ámbito respectivo?"
  options:
  - id: a
    text:
      es: "Los Directores Generales y los Secretarios Generales Técnicos del departamento."
  - id: b
    text:
      es: "Los presidentes o directores de los organismos autónomos adscritos."
  - id: c
    correct: true
    text:
      es: "Los Secretarios de Estado y el Subsecretario del departamento."
  - id: d
    text:
      es: "Los interventores delegados destinados en el departamento."
  explanation:
    es: "Por debajo de los límites fijados por los Ministros, las competencias corresponden a los Secretarios de Estado y al Subsecretario del departamento. Los Directores Generales, los Secretarios Generales Técnicos, los interventores y los presidentes de organismos autónomos no son los previstos en el artículo."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q127
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, el pago de las obligaciones se efectúa, como regla general, mediante:"
  options:
  - id: a
    text:
      es: "transferencia desde la cuenta abierta por el órgano gestor."
  - id: b
    correct: true
    text:
      es: "transferencia bancaria contra la correspondiente cuenta del Tesoro."
  - id: c
    text:
      es: "cheque nominativo contra la cuenta del Tesoro en el Banco de España."
  - id: d
    text:
      es: "entrega de efectivo por las Cajas pagadoras del departamento."
  explanation:
    es: "La forma ordinaria de pago es la transferencia bancaria contra la cuenta del Tesoro. El cheque nominativo solo se autoriza con carácter excepcional, y ni el efectivo de las Cajas pagadoras ni una cuenta del órgano gestor son la regla del apartado."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q128
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, la cuenta del Tesoro contra la que se efectúa la transferencia bancaria está abierta en:"
  options:
  - id: a
    text:
      es: "exclusivamente el Banco de España, sin otras entidades."
  - id: b
    text:
      es: "la Oficina de Contabilidad correspondiente al órgano pagador."
  - id: c
    text:
      es: "cualquier Entidad de Crédito que designe el acreedor."
  - id: d
    correct: true
    text:
      es: "el Banco de España o en una Entidad de Crédito debidamente autorizada."
  explanation:
    es: "El apartado noveno.1 admite la cuenta del Tesoro en el Banco de España o en una Entidad de Crédito debidamente autorizada. No es exclusiva del Banco de España, no la elige el acreedor y una Oficina de Contabilidad no tiene cuentas bancarias."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q129
  prompt:
    es: "Conforme al apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, ¿quién puede autorizar, excepcionalmente, el pago mediante cheque nominativo no a la orden?"
  options:
  - id: a
    correct: true
    text:
      es: "El Director General del Tesoro y Política Financiera."
  - id: b
    text:
      es: "El Ministro de Economía, bajo cuya autoridad actúa."
  - id: c
    text:
      es: "El interventor delegado del departamento correspondiente."
  - id: d
    text:
      es: "El jefe de la Oficina de Contabilidad del departamento."
  explanation:
    es: "La autorización excepcional del cheque corresponde al Director General del Tesoro y Política Financiera. No la otorgan el Ministro, el interventor delegado ni el jefe de la Oficina de Contabilidad."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q130
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, el cheque nominativo no a la orden se puede autorizar, por circunstancias que lo justifiquen, solo para:"
  options:
  - id: a
    correct: true
    text:
      es: "pagos a favor de personas físicas."
  - id: b
    text:
      es: "pagos a favor de entidades públicas sin personalidad."
  - id: c
    text:
      es: "pagos a favor de agentes mediadores en el pago."
  - id: d
    text:
      es: "pagos a favor de personas jurídicas privadas."
  explanation:
    es: "El cheque excepcional solo se admite para las personas físicas. Las personas jurídicas privadas, las entidades sin personalidad y los agentes mediadores quedan fuera de esa vía."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q131
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, el cheque que puede autorizarse excepcionalmente para pagar obligaciones de la Administración General del Estado es:"
  options:
  - id: a
    correct: true
    text:
      es: "un cheque nominativo no a la orden."
  - id: b
    text:
      es: "un cheque conformado por el interventor delegado."
  - id: c
    text:
      es: "un cheque al portador de importe limitado."
  - id: d
    text:
      es: "un cheque nominativo a la orden y endosable."
  explanation:
    es: "La Orden autoriza solo el cheque nominativo no a la orden. Un cheque al portador o un cheque endosable permitirían circular el título a terceros, y la conformidad del interventor no figura entre los requisitos."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l03-q132
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, los pagos en formalización, con los que también se pueden cancelar las obligaciones, se caracterizan porque:"
  options:
  - id: a
    text:
      es: "reducen el saldo de la cuenta del Tesoro en el Banco de España."
  - id: b
    correct: true
    text:
      es: "no producen variaciones efectivas de tesorería."
  - id: c
    text:
      es: "se hacen siempre mediante cheque nominativo."
  - id: d
    text:
      es: "exigen una transferencia a la cuenta del acreedor directo."
  explanation:
    es: "Los pagos en formalización cancelan obligaciones sin variaciones efectivas de tesorería. Por eso no requieren cheque ni transferencia al acreedor, y no reducen el saldo de la cuenta del Tesoro."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q134
  prompt:
    es: "Según el apartado séptimo.1 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, las propuestas de pago se expiden, salvo las excepciones del séptimo.2, a favor de:"
  options:
  - id: a
    text:
      es: "las entidades colaboradoras de la subvención."
  - id: b
    correct: true
    text:
      es: "los acreedores directos de la Administración."
  - id: c
    text:
      es: "las Cajas pagadoras del departamento ministerial."
  - id: d
    text:
      es: "las Habilitaciones de cada Ministerio."
  explanation:
    es: "La regla general del apartado séptimo.1 es que las propuestas se expidan a favor de los acreedores directos. Las Cajas pagadoras, las Habilitaciones y las entidades colaboradoras son agentes mediadores, que solo reciben propuestas en los supuestos de excepción."
  citation: "apartado séptimo.1.1–1.2 Orden PRE/1576/2002"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q137
  prompt:
    es: "Según el apartado séptimo.1.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, son acreedores directos, en general, aquellos a cuyo favor se hubiesen contraído obligaciones de carácter:"
  options:
  - id: a
    text:
      es: "exclusivamente presupuestario, con exclusión de las demás."
  - id: b
    text:
      es: "sujeto a justificación posterior ante el órgano gestor."
  - id: c
    correct: true
    text:
      es: "tanto presupuestario como no presupuestario."
  - id: d
    text:
      es: "contractual, con exclusión de subvenciones y ayudas."
  explanation:
    es: "El apartado séptimo.1.2 incluye las obligaciones presupuestarias y las no presupuestarias. Limitarlo a las presupuestarias o a las contractuales, o a las sujetas a justificación posterior, estrecha la definición."
  citation: "apartado séptimo.1.1–1.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q138
  prompt:
    es: "Según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, las propuestas de pago de las prestaciones de clases pasivas del Estado se expiden a favor de:"
  options:
  - id: a
    text:
      es: "la Oficina de Contabilidad que registre la obligación."
  - id: b
    text:
      es: "los pensionistas, como acreedores directos del Estado."
  - id: c
    text:
      es: "las entidades colaboradoras de la Ley General de Subvenciones."
  - id: d
    correct: true
    text:
      es: "las Cajas pagadoras, Habilitaciones, Pagadurías y otros agentes mediadores en el pago."
  explanation:
    es: "Las prestaciones de clases pasivas son uno de los supuestos en que las propuestas de pago se expiden a favor de agentes mediadores. No se dirigen a los pensionistas como acreedores directos, ni a entidades colaboradoras de subvenciones ni a la Oficina de Contabilidad."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q139
  prompt:
    es: "¿En cuál de los siguientes supuestos se expiden las propuestas de pago a favor de agentes mediadores, según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "En el pago al beneficiario de una ayuda pública."
  - id: b
    correct: true
    text:
      es: "En el pago de las prestaciones de clases pasivas del Estado."
  - id: c
    text:
      es: "En el pago al contratista que ejecutó la prestación del contrato."
  - id: d
    text:
      es: "En el pago a quien se contrajo una obligación no presupuestaria."
  explanation:
    es: "Las clases pasivas figuran entre los supuestos de excepción del apartado séptimo.2. El contratista, el beneficiario de una ayuda pública y el titular de una obligación no presupuestaria son acreedores directos, a cuyo favor se expide la propuesta."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q140
  prompt:
    es: "Según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, ¿quién autoriza otros supuestos, además de los enumerados, de propuestas de pago a favor de agentes mediadores?"
  options:
  - id: a
    text:
      es: "La Subsecretaría del departamento gestor."
  - id: b
    text:
      es: "El Tribunal de Cuentas."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    correct: true
    text:
      es: "La Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "Los demás supuestos los autoriza expresamente la Dirección General del Tesoro y Política Financiera. La IGAE, la Subsecretaría y el Tribunal de Cuentas no tienen esa facultad en el apartado."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "excepción"
  - "órgano"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q141
  prompt:
    es: "Según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, las propuestas de pago de las retribuciones del personal se expiden a favor de:"
  options:
  - id: a
    text:
      es: "la Dirección General de la Función Pública, como órgano gestor de personal."
  - id: b
    correct: true
    text:
      es: "Cajas pagadoras, Habilitaciones, Pagadurías y otros agentes mediadores en el pago."
  - id: c
    text:
      es: "la Intervención General de la Administración del Estado, como órgano de control."
  - id: d
    text:
      es: "cada empleado público, como acreedor directo de su propia retribución mensual."
  explanation:
    es: "Las retribuciones del personal son un supuesto de excepción en el que se paga a través de agentes mediadores. No se expiden a favor de cada empleado como acreedor directo, de la Dirección General de la Función Pública ni de la IGAE."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q142
  prompt:
    es: "Según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, en el procedimiento de pagos a justificar las propuestas de pago se expiden a favor de:"
  options:
  - id: a
    correct: true
    text:
      es: "Cajas pagadoras, Habilitaciones, Pagadurías y otros agentes mediadores en el pago."
  - id: b
    text:
      es: "la Oficina de Contabilidad del departamento que registra el pago."
  - id: c
    text:
      es: "el proveedor al que se destinará finalmente cada fondo librado."
  - id: d
    text:
      es: "el órgano gestor que solicitó el pago a justificar y lo tramita."
  explanation:
    es: "Los pagos a justificar son uno de los supuestos de excepción y se pagan a agentes mediadores. El proveedor final, el órgano gestor y la Oficina de Contabilidad no son los destinatarios de la propuesta."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l03-q143
  prompt:
    es: "Según el apartado séptimo.2 de la Orden PRE/1576/2002, de 19 de junio, sobre el pago de obligaciones de la Administración General del Estado, ¿cuál de las siguientes figuras es un agente mediador en el pago?"
  options:
  - id: a
    text:
      es: "Los Servicios gestores del gasto."
  - id: b
    text:
      es: "Las Oficinas de Contabilidad del Sistema."
  - id: c
    text:
      es: "Las intervenciones delegadas de cada departamento."
  - id: d
    correct: true
    text:
      es: "Las Pagadurías de los departamentos ministeriales."
  explanation:
    es: "Las Pagadurías figuran junto a las Cajas pagadoras y las Habilitaciones entre los agentes mediadores. Las Oficinas de Contabilidad registran, los Servicios gestores tramitan el gasto y las intervenciones delegadas controlan."
  citation: "apartado séptimo.2 Orden PRE/1576/2002"
  difficulty: 3
  tags:
  - "excepción"
