- id: m06-l03-q34
  prompt:
    en: In PostgreSQL 18, an index on `orders (order_nr)` has the predicate `WHERE amount < 2`, and a prepared query
      filters `WHERE amount < ?` with a parameter. Why is the partial index not usable for that query?
  options:
  - id: a
    text:
      en: The predicate column `amount` differs from the indexed column `order_nr`, which a partial index does not
        allow
  - id: b
    text:
      en: Inequality predicates are never recognized, so only an `=` predicate can match a query clause
  - id: c
    correct: true
    text:
      en: Matching takes place at planning time, so the parameterized clause cannot be shown to imply the predicate
  - id: d
    text:
      en: The planner defers the match to run time, when the parameter is bound, and that check fails for values
        above 2
  explanation:
    en: 'Matching takes place at query planning time, so a parameterized clause such as `amount < ?` never implies
      `amount < 2` for all possible parameter values (`pg-indexes-partial#INDEXES-PARTIAL`). The indexed column
      and the predicate column do not need to match, since PostgreSQL supports partial indexes with arbitrary predicates
      over columns of the indexed table (`pg-indexes-partial#INDEXES-PARTIAL`). Inequalities are recognized: the
      system can recognize simple inequality implications, for example that `x < 1` implies `x < 2` (`pg-indexes-partial#INDEXES-PARTIAL`).
      A run-time match does not exist, because matching takes place at query planning time, not at run time (`pg-indexes-partial#INDEXES-PARTIAL`).'
  citation: pg-indexes-partial#INDEXES-PARTIAL
  extract:
    en: Matching takes place at query planning time, not at run time.
- id: m06-l03-q35
  prompt:
    en: In PostgreSQL 18, which reason does the documentation give for GIN indexes being unable to support index-only
      scans?
  options:
  - id: a
    text:
      en: A GIN index stores its entries inside the table's heap pages, mixed with the table rows
  - id: b
    text:
      en: GIN indexes cannot be defined on more than one column, so they never cover a query
  - id: c
    correct: true
    text:
      en: Each index entry typically holds only part of the original data value
  - id: d
    text:
      en: GIN index entries carry no visibility information, unlike the entries of every other index type
  explanation:
    en: GIN indexes cannot support index-only scans because each index entry typically holds only part of the original
      data value (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). Storage location is not the cause, since
      each index is stored separately from the table's main data area, the heap (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
      The column count is not the cause either, because the B-tree, GiST, GIN and BRIN index types all support multiple-key-column
      indexes (`pg-indexes-multicolumn#INDEXES-MULTICOLUMN`). Visibility is not specific to GIN, because visibility
      information is not stored in index entries of any type, only in heap entries (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS; pg-indexes-multicolumn#INDEXES-MULTICOLUMN
  extract:
    en: GIN indexes cannot support index-only scans because each index entry typically holds only part of the original
      data value
- id: m06-l03-q37
  prompt:
    en: In PostgreSQL 18, you add the `ANALYZE` option to a plain `EXPLAIN` of a `SELECT` statement. What does the
      server do with the statement?
  options:
  - id: a
    text:
      en: It only plans the query and shows more precise cost estimates, without executing it
  - id: b
    correct: true
    text:
      en: It actually executes the query and shows the true row counts and run times of each plan node
  - id: c
    text:
      en: Nothing changes, because the `ANALYZE` option defaults to `TRUE` and is already active
  - id: d
    text:
      en: It executes the query but leaves out buffer usage unless the `BUFFERS` option is also given
  explanation:
    en: With `ANALYZE`, `EXPLAIN` actually executes the query and then displays the true row counts and true run
      time accumulated within each plan node (`pg-using-explain#USING-EXPLAIN-ANALYZE`). Planning only is ruled
      out because the option is described as carrying out the command and showing actual run times and other statistics
      (`pg-sql-explain#id-1.9.3.148.8`). Being already active is ruled out because the `ANALYZE` parameter defaults
      to `FALSE` (`pg-sql-explain#id-1.9.3.148.8`). Missing buffer usage is ruled out because buffers information
      is automatically included when `ANALYZE` is used (`pg-sql-explain#id-1.9.3.148.8`).
  citation: pg-using-explain#USING-EXPLAIN-ANALYZE; pg-sql-explain#id-1.9.3.148.8
  extract:
    en: EXPLAIN actually executes the query, and then displays the true row counts and true run time accumulated
      within each plan node
- id: m06-l03-q38
  prompt:
    en: In PostgreSQL 18, a query combines `ORDER BY` with `LIMIT 20 OFFSET 100000`. Which statement from the documentation
      explains why it might be inefficient?
  options:
  - id: a
    text:
      en: '`OFFSET` rows are counted toward the `LIMIT`, so the server must fetch 100020 rows twice'
  - id: b
    correct: true
    text:
      en: The rows skipped by `OFFSET` still have to be computed inside the server
  - id: c
    text:
      en: '`OFFSET` makes the optimizer ignore `LIMIT`, so the plan is built for the whole result'
  - id: d
    text:
      en: '`OFFSET` makes the row order unpredictable even with `ORDER BY`, so a second sort is needed'
  explanation:
    en: The rows skipped by an `OFFSET` clause still have to be computed inside the server, so a large `OFFSET`
      might be inefficient (`pg-queries-limit#QUERIES-LIMIT`). Counting toward the limit is ruled out because `OFFSET`
      rows are skipped before starting to count the `LIMIT` rows that are returned (`pg-queries-limit#QUERIES-LIMIT`).
      Ignoring `LIMIT` is ruled out because the query optimizer takes `LIMIT` into account when generating query
      plans (`pg-queries-limit#QUERIES-LIMIT`). An unpredictable order is ruled out because it arises only without
      `ORDER BY`, and the ordering is unknown unless you specified `ORDER BY` (`pg-queries-limit#QUERIES-LIMIT`).
  citation: pg-queries-limit#QUERIES-LIMIT
  extract:
    en: The rows skipped by an OFFSET clause still have to be computed inside the server
- id: m06-l03-q39
  prompt:
    en: In PostgreSQL 18, when does an index-only scan on a B-tree index pay off compared with a standard index
      scan on the same index?
  options:
  - id: a
    text:
      en: Whenever the query references only columns stored in the index
  - id: b
    text:
      en: When most rows were modified recently, because fresh rows are visible to every transaction
  - id: c
    correct: true
    text:
      en: Only if a significant fraction of the table's heap pages have their all-visible map bits set
  - id: d
    text:
      en: Whenever the index has `INCLUDE` columns, whatever the table's rate of change
  explanation:
    en: An index-only scan will be a win only if a significant fraction of the table's heap pages have their all-visible
      map bits set (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). Referencing only index columns is ruled
      out because it makes the scan only physically possible, with the visibility requirement still pending (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
      Recent modification is ruled out because the heap access is still needed if the table row has been modified
      recently (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). `INCLUDE` columns are ruled out because
      there is little point in them unless the table changes slowly enough that an index-only scan is likely to
      not need to access the heap (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: it will be a win only if a significant fraction of the table's heap pages have their all-visible map bits
      set
- id: m06-l03-q43
  prompt:
    en: In PostgreSQL 18 `EXPLAIN` output, what does the estimated cost of an upper-level plan node include, besides
      the cost of the work of that node itself?
  options:
  - id: a
    correct: true
    text:
      en: The cost of all its child nodes
  - id: b
    text:
      en: Only the cost of the node itself, so that the costs of its children must be added separately
  - id: c
    text:
      en: The time spent converting output values to text form and transmitting them to the client
  - id: d
    text:
      en: The actual run time in milliseconds, which `EXPLAIN` measures even without `ANALYZE`
  explanation:
    en: The cost of an upper-level node includes the cost of all its child nodes. A cost counting only the node
      itself would contradict that sentence, so the children are never added separately. The estimate does not consider
      the time spent to convert output values to text form or to transmit them to the client. Run times in milliseconds
      are shown with `ANALYZE`, whereas the estimate uses arbitrary units.
  citation: pg-using-explain#USING-EXPLAIN-BASICS; pg-using-explain#USING-EXPLAIN-ANALYZE
  extract:
    en: the cost of an upper-level node includes the cost of all its child nodes
- id: m06-l03-q45
  prompt:
    en: In PostgreSQL 18, an `UPDATE` changes the partition key of a row in a partitioned table so that the row
      no longer satisfies the partition bounds of its partition. What happens?
  options:
  - id: a
    text:
      en: The row stays in its partition, which keeps the row even though its key is outside the bounds
  - id: b
    correct: true
    text:
      en: The row is moved into a different partition
  - id: c
    text:
      en: The row is stored in the partitioned table itself, which keeps rows that fit no partition
  - id: d
    text:
      en: The row is deleted, and the application must insert it again into the right partition
  explanation:
    en: Updating the partition key causes the row to be moved into a different partition. The partitioned table
      itself is a virtual table with no storage of its own, so it cannot keep the row. A partition holds the subset
      of data defined by its partition bounds, so the row cannot stay outside them. Rows are routed to a partition
      based on the values of the partition key columns, so no manual insert is needed.
  citation: pg-ddl-partitioning#DDL-PARTITIONING-DECLARATIVE
  extract:
    en: Updating the partition key of a row will cause it to be moved into a different partition
- id: m06-l03-q47
  prompt:
    en: In Hibernate ORM 7.4 HQL, which statement about `join fetch` and `left join fetch` on an association is
      correct?
  options:
  - id: a
    text:
      en: '`join fetch` returns all the base entities, including those with no associated entity'
  - id: b
    correct: true
    text:
      en: '`left join fetch` returns all the base entities, including those with no associated entity'
  - id: c
    text:
      en: '`join fetch` is allowed in subqueries, where it limits the rows that the outer query reads'
  - id: d
    text:
      en: Fetching several collections in parallel with `join fetch` avoids a Cartesian product at the database
        level
  explanation:
    en: A `left join fetch` returns all the base entities, including those with no associated joined entity. A `join
      fetch` returns only base entities with an associated entity. Fetch joins are disallowed in subqueries, where
      they would make no sense. Fetching multiple collections or to-many associations in parallel results in a Cartesian
      product at the database level.
  citation: hibernate-user-guide#hql-explicit-fetch-join
- id: m06-l03-q48
  prompt:
    en: In Spring Data JPA 4.1 keyset filtering, how does the keyset query mechanism make sure that each query result
      is unique?
  options:
  - id: a
    text:
      en: It requires every sort property in the `Sort` to be unique across all rows
  - id: b
    text:
      en: It adds an offset counter to the query and skips the rows that came before
  - id: c
    text:
      en: It rewrites the criteria clause to include only the last sort property of the `Sort`
  - id: d
    correct: true
    text:
      en: It amends the sort order by including the primary key
  explanation:
    en: The keyset query mechanism amends the sort order by including the primary key, or the remainder of a composite
      primary key. You do not need to ensure unique query results yourself, so sort properties need not be unique.
      Keyset filtering passes keys into the query instead of an offset counter, which belongs to offset scrolling.
      The criteria clause is rewritten to include all sort fields and the primary key, not only the last sort property.
  citation: spring-data-jpa-query-methods#repositories.scrolling.keyset; spring-data-jpa-query-methods#repositories.scrolling.offset
  extract:
    en: The keyset query mechanism amends your sort order by including the primary key
- id: m06-l03-q49
  prompt:
    en: Which of these is NOT possible in the `INCLUDE` clause of `CREATE INDEX` in PostgreSQL 18?
  options:
  - id: a
    text:
      en: Listing a column whose data type has no operator class for the index access method
  - id: b
    text:
      en: Listing a column that is not part of the search key and serves only as payload
  - id: c
    text:
      en: Listing a column in a unique index, without it being part of the uniqueness condition
  - id: d
    correct: true
    text:
      en: Listing an expression as an included column
  explanation:
    en: Expressions are not supported as included columns, since they cannot be used in index-only scans. Columns
      in `INCLUDE` do not need appropriate operator classes, so a type without one is allowed. The clause lists
      extra columns that are just payload and not part of the search key. In a unique index with an `INCLUDE` clause
      the uniqueness condition applies only to the key column, so such a column is allowed there.
  citation: pg-sql-createindex#id-1.9.3.69.6; pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: Expressions are not supported as included columns
- id: m06-l03-q50
  prompt:
    en: Which drawback does the PostgreSQL 18 `CREATE INDEX` documentation give for adding non-key columns to an
      index with the `INCLUDE` clause?
  options:
  - id: a
    correct: true
    text:
      en: They duplicate data from the table and bloat the index, potentially slowing searches
  - id: b
    text:
      en: They can no longer be returned by an index-only scan, so the heap has to be visited for them
  - id: c
    text:
      en: They make a unique index reject rows whose key column is unique but whose payload column repeats
  - id: d
    text:
      en: They are stored only in the heap, which makes every search on the key column visit the table
  explanation:
    en: Non-key columns duplicate data from the index's table and bloat the size of the index, thus potentially
      slowing searches. Included columns are what allow an index-only scan, since a column such as `y` can be obtained
      from the index without visiting the heap. In a unique index the uniqueness condition applies only to the key
      column, so repeated payload values are accepted. Included columns are stored in the index itself, which is
      why they bloat it.
  citation: pg-sql-createindex#id-1.9.3.69.6; pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: non-key columns duplicate data from the index's table and bloat the size of the index, thus potentially
      slowing searches
- id: m06-l03-q51
  prompt:
    en: In PostgreSQL 18 `EXPLAIN ANALYZE`, an Index Scan node executed several times shows an `Index Searches`
      line. What does that line report?
  options:
  - id: a
    correct: true
    text:
      en: The total number of searches across all executions of the node
  - id: b
    text:
      en: The average number of searches per execution, like the actual time and rows values
  - id: c
    text:
