# Tax-part course.yaml summaries staged for the blind check; m03-l01/l02 replaced after extras-verify.md.
m03-l01: El sistema tributario se inspira en los principios de igualdad y progresividad, y la potestad originaria para establecer
  los tributos corresponde exclusivamente al Estado, mediante ley. La ley de cada impuesto estatal dice qué grava y si es
  directo o indirecto. Las Haciendas autonómica y local se financian con los recursos que fijan la CE, la LOFCA, la Ley 22/2009
  y el TRLRHL.
m03-l02: La AEAT es un ente de derecho público creado por el artículo 103 de la Ley 31/1990; su Presidente tiene rango de
  Secretario de Estado y su Director General, de Subsecretario. Su organización central son los departamentos, con rango de
  dirección general, y los servicios y la Delegación Central de Grandes Contribuyentes, con rango de dirección adjunta. Su
  organización territorial son las Delegaciones Especiales, las Delegaciones y las Administraciones.
