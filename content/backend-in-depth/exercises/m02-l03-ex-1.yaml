- id: m02-l03-q12
  prompt:
    en: In Java 25, each insert, remove and examine method of the `Deque` interface exists in two forms. How do
      the two forms behave when the operation fails?
  options:
  - id: a
    text:
      en: One form blocks until the operation can succeed, and the other gives up after a timeout
  - id: b
    text:
      en: The exception form is the one that matters in practice, because insert operations fail often in most implementations
  - id: c
    correct: true
    text:
      en: One form throws an exception, and the other returns a special value, either null or false
  - id: d
    text:
      en: The special-value form of insert is meant for deques with no fixed size limit
  explanation:
    en: One form throws an exception and the other returns null or false. The claim of blocking and timeouts is
      wrong, because the two forms are an exception and a special value. The claim that inserts fail often is wrong,
      because in most implementations insert operations cannot fail. The claim about unbounded deques is wrong,
      because the special-value insert is designed specifically for capacity-restricted implementations.
