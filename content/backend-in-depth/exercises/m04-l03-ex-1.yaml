- id: m04-l03-q03
  prompt:
    en: According to the Kotlin specification, why must a function be explicitly marked `suspend`, a rule known
      as function colouring?
  options:
  - id: a
    correct: true
    text:
      en: The compiler has to know which function can potentially suspend, to turn it into a state machine
  - id: b
    text:
      en: The JVM requires every suspending function to run inside a coroutine scope
  - id: c
    text:
      en: It lets the runtime schedule each suspending function on its own thread
  - id: d
    text:
      en: It prevents suspending functions from calling non-suspending functions
  explanation:
    en: The compiler has to know which function can potentially suspend, to turn it into a state machine. A JVM
      requirement is wrong because Kotlin implements suspendable functions as state machines, which require no specific
      runtime support. A thread per function is wrong because the interleaving of suspending functions may happen
      on a single platform thread. Blocking those calls is wrong because suspending functions may call non-suspending
      functions without any limitations.
  citation: kotlin-spec-coroutines#coroutine-state-machine
  extract:
    en: 'This dictates the explicit suspend marking (function colouring) of Kotlin coroutines: the compiler has
      to know which function can potentially suspend, to turn it into a state machine.'
- id: m04-l03-q04
  prompt:
    en: In Kotlin structured concurrency, a parent coroutine reaches the end of its body while some of its child
      coroutines are still running. What does the parent do?
  options:
  - id: a
    text:
      en: It finishes at once, and its children keep running as root coroutines
  - id: b
    correct: true
    text:
      en: It waits for its children to complete before it finishes
  - id: c
    text:
      en: It cancels its children and then finishes
  - id: d
    text:
      en: It reports `isCompleted` as true while it waits for its children
  explanation:
    en: A parent coroutine waits for its children to complete before it finishes. Finishing at once is wrong because
      a parent coroutine waits for its children to complete before it finishes. Cancelling the children is wrong
      because they are cancelled when the parent fails or gets canceled, not when its body ends. Reporting completion
      is wrong because for an outside observer a completing job is still active while it waits for its children.
  citation: kotlin-docs-coroutines-basics#coroutine-scope-and-structured-concurrency
  extract:
    en: A parent coroutine waits for its children to complete before it finishes.
- id: m04-l03-q05
  prompt:
    en: Two root coroutines are created with `GlobalScope`, one with `launch` and one with `async`, and each throws
      an exception. How does each builder treat the exception?
  options:
  - id: a
    text:
      en: '`async` treats it as uncaught, while `launch` relies on the user to call `await`'
  - id: b
    text:
      en: Both treat it as uncaught, like `Thread.uncaughtExceptionHandler`
  - id: c
    text:
      en: Both drop it silently unless the parent coroutine handles it
  - id: d
    correct: true
    text:
      en: '`launch` treats it as uncaught, while `async` leaves it to `await`'
  explanation:
    en: 'Builders come in two flavors: `launch` propagates exceptions automatically and `async` exposes them to
      users. The swapped behaviour is wrong because `launch` is the builder that propagates exceptions automatically
      and `async` exposes them to users. Treating the two builders alike as uncaught is wrong because `async` relies
      on the user to consume the final exception, for example via `await`. Dropping the exception in each builder
      is wrong because a root coroutine has no parent, and `launch` treats its exceptions as uncaught exceptions.'
  citation: kotlin-docs-exception-handling#exception-propagation
  extract:
    en: 'Coroutine builders come in two flavors: propagating exceptions automatically (launch) or exposing them
      to users (async and produce).'
- id: m04-l03-q08
  prompt:
    en: In `kotlinx.coroutines`, a `Job` is in the cancelling state. What do `isActive`, `isCompleted` and `isCancelled`
      return, in that order?
  options:
  - id: a
    correct: true
    text:
      en: '`false`, `false`, `true`'
  - id: b
    text:
      en: '`true`, `false`, `false`'
  - id: c
    text:
      en: '`false`, `true`, `true`'
  - id: d
    text:
      en: '`false`, `true`, `false`'
  explanation:
    en: In the cancelling state, `isActive` and `isCompleted` are false and `isCancelled` is true. The values `true`,
      `false`, `false` are wrong because they belong to the active state. The values `false`, `true`, `true` are
      wrong because they belong to the cancelled final state. The values `false`, `true`, `false` are wrong because
      they belong to the completed final state.
  citation: coroutines-api-job#job-states
  extract:
    en: Cancelling (transient state) false false true
- id: m04-l03-q09
  prompt:
    en: In `kotlinx.coroutines`, an active `Job` fails with an exception. To which state does the job transition?
  options:
  - id: a
    text:
      en: The cancelled state, at once
  - id: b
    text:
      en: The completing state
  - id: c
    text:
      en: The new state
  - id: d
    correct: true
    text:
      en: The cancelling state
  explanation:
    en: Failure of an active job with an exception transitions the state to the cancelling state. The cancelled
      state at once is wrong because the job becomes cancelled when it finishes executing its work and all its children
      complete. The completing state is wrong because it is reached by the completion of the coroutine body or a
      call to `CompletableJob.complete`. The new state is wrong because it is an optional initial state, reached
      only for builders started with `CoroutineStart.LAZY`.
  citation: coroutines-api-job#job-states
  extract:
    en: Failure of an active job with an exception transitions the state to the cancelling state.
- id: m04-l03-q10
  prompt:
    en: A coroutine is started in a scope whose coroutine context includes no dispatcher. Which dispatcher do the
      coroutine builders use?
  options:
  - id: a
    correct: true
    text:
      en: '`Dispatchers.Default`'
  - id: b
    text:
      en: '`Dispatchers.IO`'
  - id: c
    text:
      en: '`Dispatchers.Main`'
  - id: d
    text:
      en: '`Dispatchers.Unconfined`'
  explanation:
    en: Coroutine builders use `Dispatchers.Default` when the context has no dispatcher. `Dispatchers.IO` is wrong
      because builders use `Dispatchers.Default` when the context has no dispatcher. `Dispatchers.Main` is wrong
      for the same reason. `Dispatchers.Unconfined` is wrong for the same reason.
  citation: kotlin-docs-coroutines-basics#coroutine-dispatchers
  extract:
    en: If the coroutine context doesn't include a dispatcher, coroutine builders use Dispatchers.Default.
- id: m04-l03-q11
  prompt:
    en: In `kotlinx.coroutines`, `withContext` is called with a `CoroutineDispatcher` that differs from the current
      one. What happens to the block and to the execution after it?
  options:
  - id: a
    text:
      en: The block runs on the new dispatcher, and the rest of the coroutine stays there
  - id: b
    text:
      en: The current thread blocks until the block finishes on the new dispatcher
  - id: c
    correct: true
    text:
      en: The block is scheduled on the new dispatcher, and execution returns to the original dispatcher once it
        finishes
  - id: d
    text:
      en: A new child coroutine is launched and a `Job` handle is returned
  explanation:
    en: With a different dispatcher, the block is scheduled on the new dispatcher and execution returns to the original
      one afterwards. Staying on the new dispatcher is wrong because once the block finishes, execution returns
      to the original dispatcher. Blocking the thread is wrong because `withContext` may suspend the current coroutine
      and switch to a new context. Returning a `Job` is wrong because `withContext` suspends until the block completes
      and returns the result.
  citation: kotlin-docs-coroutine-context-and-dispatchers#jumping-between-threads
  extract:
    en: 'if you specify a different CoroutineDispatcher, extra dispatches are required: the block is scheduled on
      the new dispatcher, and once it finishes, execution returns to the original dispatcher.'
- id: m04-l03-q13
  prompt:
    en: Which statement about a Kotlin `StateFlow` and its collectors is correct when a slow collector falls behind
      fast updates of the value?
  options:
  - id: a
    text:
      en: Every update is delivered to each collector, however slow the collector is
  - id: b
    correct: true
    text:
      en: A slow collector skips fast updates and collects the latest value
  - id: c
    text:
      en: Collecting it completes normally after the last update
  - id: d
    text:
      en: It has no value until the first update and exposes no `value` property
  explanation:
    en: Updates to the value of a state flow are always conflated, so a slow collector skips fast updates. Delivering
      every update is wrong because updates are always conflated and a slow collector skips fast updates. Normal
      completion is wrong because a state flow never completes. Having no value is wrong because a mutable state
      flow is created with an initial value, and its current value can be retrieved via the `value` property.
  citation: coroutines-api-state-flow#content
  extract:
    en: Updates to the value are always conflated. So a slow collector skips fast updates, but always collects the
      most recently emitted value.
- id: m04-l03-q14
  prompt:
    en: Which parameter of `MutableSharedFlow()` sets how many previous emissions a new subscriber of a Kotlin `SharedFlow`
      receives when it starts collecting?
  options:
  - id: a
    text:
      en: '`extraBufferCapacity`'
  - id: b
    text:
      en: '`onBufferOverflow`'
  - id: c
    text:
      en: '`initialValue`'
  - id: d
    correct: true
    text:
      en: '`replay`'
  explanation:
    en: The `replay` parameter sets how many previous emissions a new subscriber receives. `extraBufferCapacity`
      is wrong because it reserves additional buffer capacity beyond replay. `onBufferOverflow` is wrong because
      it configures the strategy on buffer overflow, one of the entries of the `BufferOverflow` enum. `initialValue`
      is wrong because the initial value belongs to `MutableStateFlow(value)`, which is created with an initial
      value.
  citation: kotlin-docs-flow#create-a-sharedflow
  extract:
    en: 'To set how many previous emissions a new subscriber receives, use the replay parameter in MutableSharedFlow():'
- id: m04-l03-q15
  prompt:
    en: What does the `buffer` operator do to a Kotlin `Flow` when it is placed between `onEach` and `collect`?
  options:
  - id: a
    text:
      en: It keeps all operators sequential in the coroutine that calls `collect`
  - id: b
    text:
      en: It turns the flow into a hot flow that emits without a collector
  - id: c
    correct: true
    text:
      en: It runs the code before it in a separate coroutine, concurrently with the collector
  - id: d
    text:
      en: It drops values by default when the collector is slower than the emitter
  explanation:
    en: The `buffer` operator creates a separate coroutine during execution for the flow it applies to. Keeping
      them sequential is wrong because that is the behaviour without `buffer`, where the code of all operators is
      executed in the same coroutine. Turning it hot is wrong because the flow returned by an intermediate operator
      is cold and does not start processing values until it is collected. Dropping by default is wrong because by
      default the emitter is suspended when the buffer overflows, to let the collector catch up.
  citation: coroutines-api-flow-buffer#content
  extract:
    en: The buffer operator creates a separate coroutine during execution for the flow it applies to.
- id: m04-l03-q16
  prompt:
    en: According to the Kotlin documentation, what happens to the thread that runs a coroutine at the moment when
      that coroutine suspends?
  options:
  - id: a
    text:
      en: The thread stays blocked until the coroutine resumes, as with `Thread.sleep()`
  - id: b
    text:
      en: The coroutine must resume on that same thread
  - id: c
    correct: true
    text:
      en: The thread is not blocked and remains free to run other tasks
  - id: d
    text:
      en: The operating system keeps a dedicated multi-megabyte stack for the coroutine
  explanation:
    en: When a coroutine suspends, the thread isn't blocked and remains free to run other tasks. A blocked thread
      is wrong because the thread is not blocked when a coroutine suspends. Resuming on the same thread is wrong
      because a coroutine can suspend on one thread and resume on another. A dedicated stack is wrong because coroutines
      are much lighter than threads, which are the ones that need a few megabytes each.
  citation: kotlin-docs-coroutines-basics#comparing-coroutines-and-jvm-threads
  extract:
    en: When a coroutine suspends, the thread isn't blocked and remains free to run other tasks.
