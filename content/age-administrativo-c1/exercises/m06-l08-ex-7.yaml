- id: m06-l08-q221
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué abre la combinación de teclas Ctrl+J, desde el teclado, mientras se explora?"
  options:
  - id: a
    correct: true
    text:
      es: "Descargas"
  - id: b
    text:
      es: "Colecciones"
  - id: c
    text:
      es: "Favoritos"
  - id: d
    text:
      es: "El historial"
  explanation:
    es: "Ctrl+J abre Descargas. El historial lo abre Ctrl+H. Favoritos lo abre Ctrl+Mayús+O. Colecciones lo abre Ctrl+Mayús+Y."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+J — Abrir Descargas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q222
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre una pestaña nueva y cambia a ella en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+N"
  - id: b
    correct: true
    text:
      es: "Ctrl+T"
  - id: c
    text:
      es: "Ctrl+Mayús+T"
  - id: d
    text:
      es: "Ctrl+N"
  explanation:
    es: "Ctrl+T abre una pestaña nueva y cambia a ella. Ctrl+N abre una nueva ventana. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente. Ctrl+Mayús+N abre una nueva ventana de InPrivate."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+T — Abrir una pestaña nueva y cambiar a ella»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q223
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué hace la combinación de teclas Ctrl+Mayús+T con las pestañas cerradas de la ventana?"
  options:
  - id: a
    text:
      es: "Duplica la pestaña actual en la ventana"
  - id: b
    text:
      es: "Abre una pestaña nueva y cambia a ella"
  - id: c
    text:
      es: "Cierra la ventana actual y sus pestañas"
  - id: d
    correct: true
    text:
      es: "Vuelve a abrir la última pestaña cerrada"
  explanation:
    es: "Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente y cambia a ella. Abrir una pestaña nueva es la función de Ctrl+T. Duplicar la pestaña actual es la función de Ctrl+Mayús+K. Cerrar la ventana actual es la función de Ctrl+Mayús+W."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q224
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas cierra la pestaña actual en Microsoft Edge, en Windows 11, sin cerrar la ventana?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+T"
  - id: b
    text:
      es: "Ctrl+T"
  - id: c
    correct: true
    text:
      es: "Ctrl+W"
  - id: d
    text:
      es: "Ctrl+Mayús+W"
  explanation:
    es: "Ctrl+W cierra la pestaña actual. Ctrl+Mayús+W cierra la ventana actual, no solo la pestaña. Ctrl+T abre una pestaña nueva. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+W — Cerrar la pestaña actual»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q225
  prompt:
    es: "En Microsoft Edge, en Windows 11, la combinación Ctrl+Mayús+K, que actúa sobre la pestaña que se está viendo:"
  options:
  - id: a
    text:
      es: "Silencia la pestaña actual"
  - id: b
    text:
      es: "Inicia sesión como usuario distinto"
  - id: c
    correct: true
    text:
      es: "Duplica la pestaña actual"
  - id: d
    text:
      es: "Abre una nueva ventana de InPrivate"
  explanation:
    es: "Ctrl+Mayús+K duplica la pestaña actual. Silenciar la pestaña actual es la función de Ctrl+M. Iniciar sesión como usuario distinto o examinar como invitado es la función de Ctrl+Mayús+M. Abrir una nueva ventana de InPrivate es la función de Ctrl+Mayús+N."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 2
  tags:
  - "atajo"
