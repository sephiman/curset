  prompt:
    es: "De acuerdo con el artículo 54.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la fracción incumplida incluía deudas en período ejecutivo en el momento de la solicitud, para las deudas que en ese momento estaban en período voluntario:"
  options:
  - id: a
    text:
      es: "El período ejecutivo se inicia al día siguiente del vencimiento del plazo de ingreso en período voluntario."
