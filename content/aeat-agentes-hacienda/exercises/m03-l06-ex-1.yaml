# anchor: boe-a-2003-23186-art-119
- id: m03-l06-q0003
  prompt:
    es: "Según el artículo 119.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué casos es admisible la declaración verbal o la realizada mediante cualquier otro acto de manifestación de conocimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "En los supuestos que se determinen reglamentariamente."
  - id: b
    text:
      es: "En todos los casos, siempre que el obligado tributario lo solicite a la Administración."
  - id: c
    text:
      es: "Solo en los supuestos que establezca una ley, sin posibilidad de desarrollo reglamentario."
  - id: d
    text:
      es: "En los supuestos que determine el órgano competente de la Administración en cada procedimiento."
  explanation:
    es: "El artículo 119.2 remite a la vía reglamentaria: reglamentariamente podrán determinarse los supuestos en que sea admisible la declaración verbal. No basta la solicitud del obligado, porque la admisibilidad depende de que el reglamento la prevea. Tampoco la fija el órgano en cada procedimiento, ya que la norma habilita un reglamento general y no una decisión caso por caso. Excluir el desarrollo reglamentario contradice la remisión expresa del apartado."
  citation: "art. 119.2 LGT"
  difficulty: 1
  tags:
  - "forma"
# anchor: boe-a-2003-23186-art-119
- id: m03-l06-q0006
  prompt:
    es: "Según el artículo 119.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en la liquidación resultante de un procedimiento de aplicación de los tributos podrán aplicarse las cantidades que el obligado tuviera pendientes de compensación o deducción, sin que sea posible modificarlas mediante declaraciones complementarias o solicitudes de rectificación presentadas:"
  options:
  - id: a
    text:
      es: "después de que la Administración abra el trámite de audiencia al obligado."
  - id: b
    correct: true
    text:
      es: "después del inicio del procedimiento de aplicación de los tributos."
  - id: c
    text:
      es: "después de transcurridos seis meses desde el inicio del procedimiento."
  - id: d
    text:
      es: "después de la notificación de la propuesta de liquidación al obligado tributario."
  explanation:
    es: "El artículo 119.4 fija el corte en el inicio del procedimiento: desde ese momento ya no se pueden modificar las cantidades pendientes de compensación o deducción. La propuesta de liquidación y el trámite de audiencia son momentos posteriores, y la norma no los menciona como límite. Un plazo de seis meses desde el inicio tampoco figura en el apartado, que no deja ventana alguna una vez iniciado el procedimiento."
  citation: "art. 119.4 LGT"
  difficulty: 3
  tags:
  - "compensación"
  - "plazo"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0008
  prompt:
    es: "Señale la respuesta CORRECTA sobre la naturaleza de las autoliquidaciones y de las comunicaciones de datos, según los artículos 120.1 y 121 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Las comunicaciones de datos son declaraciones, pero las autoliquidaciones son liquidaciones practicadas por la Administración."
  - id: b
    text:
      es: "Las autoliquidaciones son declaraciones, pero las comunicaciones de datos son liquidaciones provisionales."
  - id: c
    text:
      es: "Ni las autoliquidaciones ni las comunicaciones de datos son declaraciones, sino medios autónomos de iniciación."
  - id: d
    correct: true
    text:
      es: "Las autoliquidaciones y las comunicaciones de datos son declaraciones tributarias."
  explanation:
    es: "El artículo 120.1 define las autoliquidaciones como declaraciones y el artículo 121 define la comunicación de datos como la declaración presentada para que la Administración determine la devolución. Las dos son declaraciones. La comunicación no es una liquidación provisional: es el obligado quien la presenta, y la Administración solo después determina la cantidad. La autoliquidación tampoco la practica la Administración, porque el obligado realiza por sí mismo las operaciones de cuantificación. Negar a ambas el carácter de declaración contradice las dos definiciones."
  citation: "art. 120.1 LGT"
  difficulty: 1
  tags:
  - "clases"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0009
  prompt:
    es: "Según el artículo 120.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en las autoliquidaciones los obligados tributarios, además de comunicar a la Administración los datos necesarios para la liquidación del tributo, realizan por sí mismos las operaciones de:"
  options:
  - id: a
    correct: true
    text:
      es: "calificación y cuantificación necesarias para determinar e ingresar el importe de la deuda tributaria o, en su caso, la cantidad a devolver o a compensar."
  - id: b
    text:
      es: "verificación y cuantificación necesarias para ingresar el importe de la deuda tributaria, sin que puedan determinar en ningún caso cantidades a devolver ni a compensar."
  - id: c
    text:
      es: "calificación y cuantificación necesarias para proponer a la Administración el importe de la deuda tributaria que deba liquidarse y exigirse."
  - id: d
    text:
      es: "comprobación y valoración necesarias para determinar e ingresar el importe de la deuda tributaria o, en su caso, la cantidad a devolver o a compensar."
  explanation:
    es: "En la autoliquidación el obligado realiza por sí mismo la calificación y la cuantificación para determinar e ingresar la deuda o, en su caso, la cantidad a devolver o a compensar. Comprobar y valorar son operaciones de la Administración en sus procedimientos de gestión, no de quien autoliquida. Limitarse a proponer una cuantía a la Administración convertiría el documento en una simple comunicación de datos, lo contrario de autoliquidar. Excluir las cantidades a devolver contradice el final del apartado, que las incluye."
  citation: "art. 120.1 LGT"
  difficulty: 2
  tags:
  - "autoliquidación"
  - "concepto"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0010
  prompt:
    es: "Conforme a los artículos 120.1 y 121 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué clase de declaración presenta el obligado tributario que, además de comunicar sus datos, calcula por sí mismo la cuota y la ingresa?"
  options:
  - id: a
    text:
      es: "Una comunicación de datos, porque presenta los datos para que la Administración determine la cuantía."
  - id: b
    text:
      es: "Una solicitud de devolución, porque pretende que la Administración reconozca un importe a su favor."
  - id: c
    text:
      es: "Una declaración sustitutiva, porque reemplaza a una liquidación provisional practicada antes por la Administración tributaria competente."
  - id: d
    correct: true
    text:
      es: "Una autoliquidación, porque realiza por sí mismo las operaciones de calificación y cuantificación de la deuda."
  explanation:
    es: "Quien calcula la cuota y la ingresa presenta una autoliquidación, que el artículo 120.1 define por esas operaciones de cuantificación e ingreso realizadas por el propio obligado. La comunicación de datos del artículo 121 sirve para que sea la Administración la que determine la cantidad a devolver, y aquí el obligado ya la ha calculado. La declaración sustitutiva reemplaza otra declaración o comunicación presentada antes, no una liquidación de la Administración. No hay solicitud de devolución, porque el obligado ingresa en lugar de pedir cantidad alguna."
  citation: "art. 120.1 LGT"
  difficulty: 1
  tags:
  - "clases"
  - "autoliquidación"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0011
  prompt:
    es: "Señale la respuesta CORRECTA sobre las autoliquidaciones presentadas por los obligados tributarios, de acuerdo con el artículo 120.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Vinculan a la Administración, que solo puede modificarlas a instancia del obligado tributario."
  - id: b
    text:
      es: "Pueden ser comprobadas por la Administración, pero esta no puede practicar liquidación sobre ellas."
  - id: c
    text:
      es: "Solo pueden ser verificadas por la Administración cuando el obligado presenta una autoliquidación rectificativa."
  - id: d
    correct: true
    text:
      es: "Pueden ser objeto de verificación y comprobación por la Administración, que practicará, en su caso, la liquidación que proceda."
  explanation:
    es: "El artículo 120.2 permite a la Administración verificar y comprobar las autoliquidaciones y practicar la liquidación que proceda. Presentarlas no vincula a la Administración ni limita su actuación a la solicitud del obligado. Tampoco se le prohíbe liquidar tras comprobar: el apartado lo prevé expresamente. La verificación no depende de que se presente una autoliquidación rectificativa, que es una vía de corrección del obligado regulada en el apartado 4."
  citation: "art. 120.2 LGT"
  difficulty: 2
  tags:
  - "autoliquidación"
  - "comprobación"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0012
  prompt:
    es: "De acuerdo con el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando un obligado tributario considere que una autoliquidación ha perjudicado de cualquier modo sus intereses legítimos, podrá:"
  options:
  - id: a
    text:
      es: "solicitar su anulación directamente ante el Tribunal Económico-Administrativo competente, sin necesidad de seguir el procedimiento reglamentario."
  - id: b
    text:
      es: "presentar una autoliquidación complementaria con el importe que considere correcto en cualquier caso."
  - id: c
    correct: true
    text:
      es: "instar la rectificación de la autoliquidación de acuerdo con el procedimiento que se regule reglamentariamente."
  - id: d
    text:
      es: "presentar una declaración sustitutiva que anule la autoliquidación presentada anteriormente."
  explanation:
    es: "El obligado que considera perjudicados sus intereses legítimos puede instar la rectificación de la autoliquidación por el procedimiento que se regule reglamentariamente. El artículo 120.3 no le abre la vía directa ante el Tribunal Económico-Administrativo. La autoliquidación complementaria solo procede, según el artículo 122.2, cuando resulta un mayor ingreso o una menor devolución, no en cualquier caso. La declaración sustitutiva está prevista para declaraciones y comunicaciones, no para las autoliquidaciones."
  citation: "art. 120.3 LGT"
  difficulty: 2
  tags:
  - "rectificación"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0013
  prompt:
    es: "¿En qué caso debe el obligado tributario rectificar una autoliquidación mediante una autoliquidación rectificativa, según el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando lo establezca la normativa propia del tributo."
  - id: b
    text:
      es: "Siempre que la rectificación suponga una minoración del importe a ingresar."
  - id: c
    text:
      es: "Siempre que hayan transcurrido seis meses desde la finalización del plazo de presentación."
  - id: d
    text:
      es: "Cuando la Administración tributaria lo acuerde en un requerimiento previo al obligado."
  explanation:
    es: "El artículo 120.3 condiciona la autoliquidación rectificativa a que lo establezca la normativa propia del tributo. La minoración del importe a ingresar sí aparece en el apartado, pero para decir que se mantiene la obligación de pago hasta el nuevo importe, no para imponer ese modelo. Los seis meses son el plazo a partir del cual se abona interés de demora en las devoluciones, no un requisito de la rectificativa. El requerimiento previo de la Administración no es la causa que fija el apartado."
  citation: "art. 120.3 LGT"
  difficulty: 1
  tags:
  - "rectificación"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0015
  prompt:
    es: "Según el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la rectificación de una autoliquidación origine una devolución y pasen seis meses sin ordenarse el pago por causa imputable a la Administración, el plazo de seis meses se cuenta desde la finalización del plazo de presentación de la autoliquidación o, si este hubiese concluido, desde:"
  options:
  - id: a
    correct: true
    text:
      es: "la presentación de la solicitud de rectificación o de la autoliquidación rectificativa."
  - id: b
    text:
      es: "la notificación del acuerdo por el que se admite a trámite la rectificación solicitada."
  - id: c
    text:
      es: "la fecha en que se ingresó la cantidad cuya devolución se pretende."
  - id: d
    text:
      es: "el día siguiente a la finalización del plazo de prescripción del derecho a la devolución."
  explanation:
    es: "Si el plazo de presentación ya había concluido, los seis meses se cuentan desde la presentación de la solicitud de rectificación o de la autoliquidación rectificativa, según el artículo 120.3. La admisión a trámite no es el punto de partida que fija el apartado. Tampoco lo es la fecha del ingreso que se pretende recuperar, anterior a la rectificación. La prescripción del derecho a la devolución es un plazo distinto, de otra institución, que no marca el inicio del cómputo."
  citation: "art. 120.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "interés de demora"
# anchor: boe-a-2003-23186-art-120
- id: m03-l06-q0016
  prompt:
    es: "Doña Marta Gil presentó una autoliquidación con un importe a ingresar de 1.000 euros y no lo ingresó. Después presenta una autoliquidación rectificativa de la que resulta un importe a ingresar de 600 euros, sin cantidad a devolver. Según el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué importe se mantiene su obligación de pago?"
  options:
  - id: a
    text:
      es: "No se mantiene ninguna obligación de pago, porque la autoliquidación previa queda sin efecto."
  - id: b
    correct: true
    text:
      es: "Hasta el límite de 600 euros, importe a ingresar resultante de la rectificación."
  - id: c
    text:
      es: "Hasta el límite de 1.000 euros, importe a ingresar de la autoliquidación previa."
  - id: d
    text:
      es: "Hasta el límite de 400 euros, diferencia entre ambas autoliquidaciones."
  explanation:
    es: "Cuando la rectificación minora el importe a ingresar y no origina cantidad a devolver, el artículo 120.3 mantiene la obligación de pago hasta el límite del importe a ingresar resultante de la rectificación, que aquí son 600 euros. Los 1.000 euros eran el importe de la autoliquidación previa, que la rectificación sustituye como límite. Los 400 euros son la diferencia entre ambas cifras, que es lo que se minora y no lo que se debe. La obligación no desaparece: queda reducida, no extinguida."
  citation: "art. 120.3 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "rectificación"
# anchor: boe-a-2003-23186-art-121
- id: m03-l06-q0018
  prompt:
    es: "Según el artículo 121 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se considera comunicación de datos la declaración presentada por el obligado tributario ante la Administración para que esta determine:"
  options:
  - id: a
    text:
      es: "la base imponible del período impositivo que corresponda."
  - id: b
    text:
      es: "el importe de la deuda tributaria que deba ingresar el obligado."
  - id: c
    text:
      es: "la cuantía de la sanción que pueda imponerse al obligado."
  - id: d
    correct: true
    text:
      es: "la cantidad que, en su caso, resulte a devolver."
  explanation:
    es: "La comunicación de datos es la declaración presentada para que la Administración determine la cantidad que, en su caso, resulte a devolver (artículo 121). El importe a ingresar lo calcula el propio obligado cuando autoliquida, no la Administración a partir de una comunicación. La base imponible es un elemento de cualquier liquidación, no la finalidad que define esta declaración. La sanción pertenece al régimen de infracciones, que nada tiene que ver con la comunicación."
  citation: "art. 121 LGT"
  difficulty: 1
  tags:
  - "comunicación de datos"
  - "concepto"
# anchor: boe-a-2003-23186-art-121
- id: m03-l06-q0019
  prompt:
    es: "¿Qué se entiende, conforme al artículo 121 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando el obligado tributario presenta una comunicación de datos para que la Administración determine la cantidad que, en su caso, resulte a devolver?"
  options:
  - id: a
    correct: true
    text:
      es: "Que ha solicitado la devolución por el mero hecho de presentar la comunicación."
  - id: b
    text:
      es: "Que debe presentar, además, una solicitud de devolución en el modelo normalizado."
  - id: c
    text:
      es: "Que la devolución queda condicionada a que la Administración inicie un procedimiento de comprobación."
  - id: d
    text:
      es: "Que acepta la cantidad que la Administración determine, sin posibilidad de reclamar."
  explanation:
    es: "El artículo 121 dice que se entiende solicitada la devolución mediante la presentación de la comunicación. No hace falta una solicitud aparte. Tampoco hay aceptación anticipada de la cuantía que fije la Administración: el artículo no la menciona y presentar una declaración no supone reconocer nada. La devolución no depende de un procedimiento de comprobación, que el precepto no exige para que la solicitud se entienda hecha."
  citation: "art. 121 LGT"
  difficulty: 2
  tags:
  - "comunicación de datos"
  - "devolución"
