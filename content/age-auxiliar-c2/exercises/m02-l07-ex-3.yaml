# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q296
  prompt:
    es: "Señale la afirmación correcta sobre las extensiones de nombre de archivo en Windows 11, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "La extensión docx indica que el archivo está cifrado y solo se abre con contraseña"
  - id: b
    correct: true
    text:
      es: "La extensión docx indica al equipo que Word puede abrir el archivo y mostrar su icono"
  - id: c
    text:
      es: "La extensión pptx indica que el archivo es una hoja de cálculo de Excel"
  - id: d
    text:
      es: "La extensión xlsx se separa del nombre con una coma y no puede cambiarse"
  explanation:
    es: "La extensión docx indica al equipo que Word puede abrir el archivo y mostrar un icono de Word en el Explorador. La extensión se separa con un punto y puede cambiarse sin convertir el archivo, y pptx es de PowerPoint."
  citation: "fuente: `ms-win-extensiones.html`; «Introducción»"
  difficulty: 1
  tags:
  - "concepto"
