      y when x is odd. It counts calls. What is printed for 13 by 25 and 0 by 25?
  options:
  - id: a
    text:
      en: '13 x 25 = 325 in 4 calls

        0 x 25 = 0 in 1 call'
  - id: b
    text:
      en: '13 x 25 = 300 in 5 calls

        0 x 25 = 0 in 1 call'
  - id: c
    correct: true
    text:
      en: '13 x 25 = 325 in 5 calls

        0 x 25 = 0 in 1 call'
  - id: d
    text:
      en: '13 x 25 = 325 in 5 calls

        0 x 25 = 0 in 0 call'
  explanation:
    en: The program prints 325 after 5 calls, because x takes the values 13, 6, 3, 1 and 0, and one call for x equal
      to 0. Four calls is wrong because the call with x equal to 0 is counted too. A product of 300 is wrong because
      y is added once for each odd value of x, including the first one. Zero calls for 0 by 25 is wrong because
