  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones puede reemplazar varias instrucciones SI anidadas por una sola función?"
  options:
  - id: a
    text:
      es: "SI.ND"
  - id: b
    correct: true
    text:
      es: "SI.CONJUNTO"
  - id: c
    text:
      es: "BUSCARH"
  - id: d
    text:
      es: "SI.ERROR"
  explanation:
    es: "La página dice que la función SI.CONJUNTO puede reemplazar varias SI anidadas, y que solo está disponible con una suscripción a Microsoft 365. «SI.ERROR»: SI.ERROR devuelve un valor si la fórmula da error. «SI.ND»: SI.ND devuelve un valor si la expresión da #N/A. «BUSCARH»: BUSCARH busca en la fila superior de una matriz."
