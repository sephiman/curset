# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q062
  prompt:
    es: "Según el artículo 118.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuándo debe solicitarse en un contrato menor de obras el informe de las oficinas o unidades de supervisión?"
  options:
  - id: a
    text:
      es: "Cuando la obra requiera la redacción previa de un proyecto."
  - id: b
    text:
      es: "Cuando el valor estimado de la obra supere los 30.000 euros."
  - id: c
    text:
      es: "En todo contrato menor de obras, cualquiera que sea su objeto."
  - id: d
    correct: true
    text:
      es: "Cuando el trabajo afecte a la estabilidad, seguridad o estanqueidad de la obra."
  explanation:
    es: "El artículo 118.4 LCSP dice que el informe de las oficinas o unidades de supervisión debe solicitarse «cuando el trabajo afecte a la estabilidad, seguridad o estanqueidad de la obra». El criterio es el efecto del trabajo sobre la obra, no su valor: los 40.000 euros del artículo 118.1 definen cuándo una obra es contrato menor, y 30.000 no es cifra de ese artículo. Que la obra requiera proyecto es una cláusula distinta del mismo apartado, «sin perjuicio de que deba existir el correspondiente proyecto», y no activa el informe. «En todo contrato menor de obras» contradice «cuando el trabajo afecte»."
  citation: "art. 118.4 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q063
  prompt:
    es: "En un contrato menor de obras, ¿qué documento debe añadirse al expediente además de la aprobación del gasto y la factura?"
  options:
  - id: a
    correct: true
    text:
      es: "El presupuesto de las obras."
  - id: b
    text:
      es: "El acta de comprobación del replanteo."
  - id: c
    text:
      es: "El justificante de la garantía definitiva."
  - id: d
    text:
      es: "El pliego de cláusulas administrativas particulares."
  explanation:
    es: "El artículo 118.4 LCSP dice: «En el contrato menor de obras, deberá añadirse, además, el presupuesto de las obras», sin perjuicio del proyecto cuando sea requerido. El acta de comprobación del replanteo, el pliego de cláusulas administrativas particulares y la garantía definitiva no figuran entre los documentos que el artículo 118 exige al contrato menor."
  citation: "art. 118.4 LCSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-119
- id: m03-l04-q064
  prompt:
    es: "Según el artículo 119.2.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en la tramitación urgente los plazos de licitación, adjudicación y formalización del contrato:"
  options:
  - id: a
    text:
      es: "Se reducen a la tercera parte, salvo el plazo de quince días hábiles de espera antes de la formalización."
  - id: b
    text:
      es: "Se reducen a la mitad, sin excepción alguna, cualquiera que sea el procedimiento seguido."
  - id: c
    correct: true
    text:
      es: "Se reducen a la mitad, salvo algunos, como los quince días hábiles de espera antes de la formalización."
  - id: d
    text:
      es: "Se mantienen, y solo se acortan los plazos de los órganos para emitir sus informes."
  explanation:
    es: "El artículo 119.2.b) LCSP dice que los plazos de licitación, adjudicación y formalización «se reducirán a la mitad», salvo una lista que empieza por «el plazo de quince días hábiles establecido en el apartado 3 del artículo 153». La opción «sin excepción alguna» olvida esa lista. La reducción es a la mitad, no a la tercera parte. El acortamiento del plazo de los informes es otra especialidad (letra a) que no sustituye a la reducción de plazos."
  citation: "art. 119.2.b) LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-119
- id: m03-l04-q065
  prompt:
    es: "En la tramitación urgente de un expediente, ¿cuál de los siguientes plazos NO se reduce a la mitad según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El de presentación de la documentación previa a la adjudicación."
  - id: b
    correct: true
    text:
      es: "El de quince días hábiles de espera antes de formalizar el contrato."
  - id: c
    text:
      es: "El de formalización de un contrato no susceptible de recurso especial."
  - id: d
    text:
      es: "El plazo máximo para adjudicar cuando el único criterio es el precio."
  explanation:
    es: "El artículo 119.2.b) LCSP reduce a la mitad los plazos de licitación, adjudicación y formalización, salvo, en primer lugar, «el plazo de quince días hábiles establecido en el apartado 3 del artículo 153, como período de espera antes de la formalización del contrato». El plazo para presentar la documentación previa a la adjudicación es un plazo de adjudicación, y la lista de salvedades no lo recoge. El plazo máximo para adjudicar también es de adjudicación, y el de formalización de un contrato sin recurso especial es de formalización: ninguno está entre las salvedades, así que los tres se reducen a la mitad."
  citation: "art. 119.2.b) LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-120
- id: m03-l04-q066
  prompt:
    es: "En la contratación del sector público, procede la tramitación de emergencia cuando la Administración tenga que actuar de manera inmediata a causa de:"
  options:
  - id: a
    correct: true
    text:
      es: "Acontecimientos catastróficos, situaciones de grave peligro o necesidades de la defensa nacional."
  - id: b
    text:
      es: "Situaciones de grave peligro o la falta de crédito suficiente en el presupuesto."
  - id: c
    text:
      es: "Acontecimientos catastróficos o la próxima finalización del ejercicio presupuestario."
  - id: d
    text:
      es: "Una necesidad inaplazable o razones de interés público que obliguen a acelerar la adjudicación."
  explanation:
    es: "El artículo 120.1 LCSP prevé la emergencia «cuando la Administración tenga que actuar de manera inmediata a causa de acontecimientos catastróficos, de situaciones que supongan grave peligro o de necesidades que afecten a la defensa nacional». La necesidad inaplazable o la aceleración por interés público son los supuestos de la tramitación urgente (art. 119.1). El fin del ejercicio presupuestario no es causa de emergencia. La falta de crédito tampoco es causa: es algo que la emergencia permite superar."
  citation: "art. 120.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-120
- id: m03-l04-q067
  prompt:
    es: "Según el artículo 120.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en la tramitación de emergencia el órgano de contratación, sin obligación de tramitar expediente, puede contratar libremente su objeto:"
  options:
  - id: a
    text:
      es: "Previa autorización del Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "Incluso sin que exista crédito suficiente."
  - id: c
    text:
      es: "Si el valor no alcanza el umbral armonizado."
  - id: d
    text:
      es: "Previo informe favorable de la intervención."
  explanation:
    es: "El artículo 120.1.a) LCSP permite contratar libremente el objeto «sin sujetarse a los requisitos formales establecidos en la presente Ley, incluso el de la existencia de crédito suficiente». No hace falta autorización previa del Consejo de Ministros: en el ámbito estatal solo se le da cuenta en treinta días (art. 120.1.b). Tampoco se exige informe previo de la intervención. El régimen no depende del valor del contrato ni del umbral armonizado."
  citation: "art. 120.1.a) LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-120
- id: m03-l04-q068
  prompt:
    es: "Según el artículo 120.1.c) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué ocurre si la ejecución de las prestaciones de emergencia no se inicia dentro del mes siguiente al acuerdo?"
  options:
  - id: a
    correct: true
    text:
      es: "Su contratación requiere la tramitación de un procedimiento ordinario."
  - id: b
    text:
      es: "El acuerdo de emergencia se prorroga de forma automática por otro mes."
  - id: c
    text:
      es: "El contratista incurre en penalidades diarias por demora en la ejecución."
  - id: d
    text:
      es: "Su contratación pasa a tramitarse por el procedimiento de urgencia."
  explanation:
    es: "El artículo 120.1.c) LCSP dice: «Si se excediese este plazo, la contratación de dichas prestaciones requerirá la tramitación de un procedimiento ordinario». No hay prórroga automática del acuerdo. El precepto no impone penalidades por este retraso. Tampoco remite a la tramitación urgente: exige el procedimiento ordinario."
  citation: "art. 120.1.c) LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-120
- id: m03-l04-q069
  prompt:
    es: "Conforme al artículo 120.1.c) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en la tramitación de emergencia el plazo de inicio de la ejecución de las prestaciones no puede ser superior a:"
  options:
  - id: a
    text:
      es: "Quince días, contados desde la adopción del acuerdo."
  - id: b
    text:
      es: "Dos meses, contados desde la adopción del acuerdo."
  - id: c
    correct: true
    text:
      es: "Un mes, contado desde la adopción del acuerdo."
  - id: d
    text:
      es: "Un mes, contado desde la formalización del contrato."
  explanation:
    es: "El artículo 120.1.c) LCSP fija un plazo de inicio que «no podrá ser superior a un mes, contado desde la adopción del acuerdo previsto en la letra a)». Quince días y dos meses no son el plazo legal. El mes contado desde la formalización es el plazo de inicio de la tramitación urgente (art. 119.2.c), no el de la emergencia, en la que puede no haber formalización."
  citation: "art. 120.1.c) LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-37
- id: m03-l04-q070
  prompt:
    es: "En la contratación del sector público, ¿qué contratos pueden celebrar verbalmente las entidades del sector público?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo los que tengan carácter de emergencia."
  - id: b
    text:
      es: "Los contratos menores de valor estimado inferior a 5.000 euros."
  - id: c
    text:
      es: "Los tramitados por urgencia, si se ejecutan en un mes."
  - id: d
    text:
      es: "Los contratos menores pagados por anticipo de caja fija."
  explanation:
    es: "El artículo 37.1 LCSP dice: «Las entidades del sector público no podrán contratar verbalmente, salvo que el contrato tenga, conforme a lo señalado en el artículo 120.1, carácter de emergencia». Ni los contratos menores, cualquiera que sea su valor o su forma de pago, ni los tramitados por urgencia pueden celebrarse verbalmente."
  citation: "art. 37.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-106
- id: m03-l04-q072
  prompt:
    es: "Un ministerio exige, de forma excepcional y motivada, garantía provisional en un contrato con un presupuesto base de licitación de 200.000 euros, IVA excluido. ¿Cuál es su importe máximo?"
  options:
  - id: a
    correct: true
    text:
      es: "Una garantía provisional de 6.000 euros."
  - id: b
    text:
      es: "Una garantía provisional de 10.000 euros."
  - id: c
    text:
      es: "Una garantía provisional de 7.260 euros."
  - id: d
    text:
      es: "Una garantía provisional de 4.000 euros."
  explanation:
    es: "El artículo 106.2 LCSP dice que la garantía provisional «no podrá ser superior a un 3 por 100 del presupuesto base de licitación del contrato, excluido el Impuesto sobre el Valor Añadido»: el 3 por 100 de 200.000 euros son 6.000 euros. Los 4.000 euros aplican un 2 por 100. Los 10.000 euros aplican el 5 por 100 de la garantía definitiva. Los 7.260 euros calculan el 3 por 100 sobre el presupuesto con un IVA del 21 por ciento, que la ley excluye."
  citation: "art. 106.2 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q073
  prompt:
    es: "Según el artículo 107.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en los contratos de las Administraciones Públicas quien presente la mejor oferta debe constituir una garantía definitiva de:"
  options:
  - id: a
    text:
      es: "Un 5 por 100 del presupuesto base de licitación, incluido el Impuesto sobre el Valor Añadido."
  - id: b
    text:
      es: "Un 3 por 100 del precio final ofertado, excluido el Impuesto sobre el Valor Añadido."
  - id: c
    text:
      es: "Un 10 por 100 del precio final ofertado, incluido el Impuesto sobre el Valor Añadido."
  - id: d
    correct: true
    text:
      es: "Un 5 por 100 del precio final ofertado, excluido el Impuesto sobre el Valor Añadido."
  explanation:
    es: "El artículo 107.1 LCSP fija «una garantía de un 5 por 100 del precio final ofertado por aquellos, excluido el Impuesto sobre el Valor Añadido». La base es el precio ofertado sin IVA, no el presupuesto base de licitación con IVA. El 3 por 100 es el máximo de la garantía provisional (art. 106.2). El 10 por 100 es el total que puede alcanzarse con una garantía complementaria en casos especiales (art. 107.2), no la garantía ordinaria."
  citation: "art. 107.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q076
  prompt:
    es: "Según el artículo 107.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué contratos queda excluida la posibilidad de eximir al adjudicatario de constituir la garantía definitiva?"
  options:
  - id: a
    text:
      es: "En los contratos de servicios y en los de concesión de servicios."
  - id: b
    correct: true
    text:
      es: "En los contratos de obras y en los de concesión de obras."
  - id: c
    text:
      es: "En los contratos de servicios sociales y de inclusión social."
  - id: d
    text:
      es: "En los suministros de bienes consumibles entregados antes del pago."
  explanation:
    es: "El artículo 107.1 LCSP permite eximir de la garantía definitiva justificándolo en el pliego, pero añade: «Esta exención no será posible en el caso de contratos de obras, ni de concesión de obras». Los suministros de bienes consumibles entregados antes del pago y los servicios sociales o de inclusión social son, al contrario, casos que el mismo apartado menciona como especialmente aptos para la exención. Los servicios y la concesión de servicios no están entre las exclusiones."
  citation: "art. 107.1 LCSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q077
  prompt:
    es: "Conforme al artículo 107.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el órgano de contratación puede eximir al adjudicatario de la obligación de constituir la garantía definitiva:"
  options:
  - id: a
    correct: true
    text:
      es: "Justificándolo adecuadamente en el pliego que rige el contrato."
  - id: b
    text:
      es: "Previo informe favorable de la Abogacía del Estado en el departamento."
  - id: c
    text:
      es: "Mediante un acuerdo con el adjudicatario posterior a la formalización."
  - id: d
    text:
      es: "Solo cuando el adjudicatario sea una pequeña o mediana empresa."
  explanation:
    es: "El artículo 107.1 LCSP permite eximir de la garantía definitiva «justificándolo adecuadamente en el pliego de cláusulas administrativas particulares». No exige informe de la Abogacía del Estado. No limita la exención a las pequeñas y medianas empresas. Y la exención se decide en el pliego, antes de licitar, no por acuerdo con el adjudicatario tras la formalización."
  citation: "art. 107.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q078
  prompt:
    es: "¿Cuál de los siguientes contratos de una Administración Pública queda fuera de la regla general de la garantía definitiva del 5 por 100 del precio ofertado, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Un contrato de suministro de mobiliario."
  - id: b
    text:
      es: "Un contrato de servicios de limpieza."
  - id: c
    text:
      es: "Un contrato de obras de reforma."
  - id: d
    correct: true
    text:
      es: "Un contrato de concesión de servicios."
  explanation:
    es: "El artículo 107.1 LCSP fija el 5 por 100 «a salvo de lo dispuesto en los apartados 4 y 5», y el apartado 4 dice que en la concesión de obras y en la de servicios el importe de la garantía definitiva lo fija el órgano de contratación en el pliego para cada caso. Los contratos de suministro, de servicios y de obras siguen la regla del 5 por 100 del precio final ofertado, sin IVA."
  citation: "art. 107.4 LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-108
- id: m03-l04-q080
  prompt:
    es: "Según el artículo 108.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el pliego lo prevé, ¿en qué concesión puede constituirse la garantía definitiva mediante retención en el precio?"
  options:
  - id: a
    text:
      es: "En ninguna concesión, porque la retención solo cabe en los contratos de obras."
  - id: b
    correct: true
    text:
      es: "En la concesión de servicios, cuando las tarifas las abone la Administración contratante."
  - id: c
    text:
      es: "En la concesión de obras, cualquiera que sea quien abone las tarifas."
  - id: d
    text:
      es: "En la concesión de servicios, cuando las tarifas las abonen directamente los usuarios."
  explanation:
    es: "El artículo 108.2 LCSP permite la retención en el precio en la garantía definitiva de los contratos de obras, suministros y servicios, «así como en los de concesión de servicios cuando las tarifas las abone la administración contratante». Decir que solo cabe en obras contradice esa lista. La concesión de obras no figura en ella: el apartado distingue los contratos de obras de la concesión de servicios y solo añade esta última. Si los usuarios pagan las tarifas, falta la condición del apartado, que exige que las abone la administración contratante."
  citation: "art. 108.2 LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-108
- id: m03-l04-q081
  prompt:
    es: "En un contrato de suministro de una Administración Pública, la constitución de la garantía definitiva mediante retención en el precio:"
  options:
  - id: a
    text:
      es: "Es posible siempre que la solicite el adjudicatario, aunque el pliego no la prevea."
  - id: b
    text:
      es: "No es posible en los contratos de suministro, solo en los de obras."
  - id: c
    text:
      es: "Exige la conformidad previa de la intervención y del contratista."
  - id: d
    correct: true
    text:
      es: "Solo es posible si así lo prevé el pliego de cláusulas administrativas particulares."
  explanation:
    es: "El artículo 108.2 LCSP permite la retención en el precio en obras, suministros y servicios «cuando así se prevea en los pliegos de cláusulas administrativas particulares». Sin previsión en el pliego no cabe, aunque la pida el adjudicatario. El precepto no exige la conformidad de la intervención. Y el suministro está expresamente incluido."
  citation: "art. 108.2 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q082
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál de los siguientes contratos, todos con seis meses de duración, puede tramitarse como contrato menor?"
  options:
  - id: a
    text:
      es: "Un suministro de mobiliario con un valor estimado de 16.000 euros."
  - id: b
    text:
      es: "Un servicio de limpieza con un valor estimado de 15.500 euros."
  - id: c
    correct: true
    text:
      es: "Una obra de reparación con un valor estimado de 39.000 euros."
  - id: d
    text:
      es: "Una obra de reforma con un valor estimado de 41.000 euros."
  explanation:
    es: "El artículo 118.1 LCSP considera menores las obras de valor estimado «inferior a 40.000 euros» y los suministros y servicios de valor estimado inferior a 15.000 euros. La obra de 39.000 euros queda por debajo de su límite y dura menos de un año (art. 29.8). El suministro de 16.000 euros y el servicio de 15.500 euros superan los 15.000 euros. La obra de 41.000 euros supera los 40.000."
  citation: "art. 118.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q083
  prompt:
    es: "Un organismo autónomo estudia cuatro contratos, todos con seis meses de duración. ¿Cuál de ellos puede tramitarse como contrato menor?"
  options:
  - id: a
    text:
      es: "Un suministro de material de oficina de 15.000 euros de valor estimado."
  - id: b
    correct: true
    text:
      es: "Un suministro de material de oficina de 14.800 euros de valor estimado."
  - id: c
    text:
      es: "Un servicio de mensajería de 17.000 euros de valor estimado."
  - id: d
    text:
      es: "Una obra de pintura de 40.000 euros de valor estimado."
  explanation:
    es: "El artículo 118.1 LCSP exige un valor estimado «inferior» a 15.000 euros en suministros y servicios, e inferior a 40.000 euros en obras. El suministro de 14.800 euros cumple. El de 15.000 euros justos no es inferior a la cifra legal. El servicio de mensajería de 17.000 euros la supera. La obra de 40.000 euros justos tampoco es inferior a su límite."
  citation: "art. 118.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-99
- id: m03-l04-q084
  prompt:
    es: "El pliego de un contrato de servicios, aprobado antes de la licitación, fija un año de duración y un presupuesto con IVA, pero deja el objeto para concretarlo con el adjudicatario. ¿Qué exigencia legal incumple?"
  options:
  - id: a
    text:
      es: "La exigencia de que el presupuesto base de licitación incluya el IVA."
  - id: b
    text:
      es: "La exigencia de aprobar los pliegos antes de la licitación."
  - id: c
    text:
      es: "El límite de cinco años de los servicios de prestación sucesiva."
  - id: d
    correct: true
    text:
      es: "La exigencia de que el objeto del contrato sea determinado."
  explanation:
    es: "El artículo 99.1 LCSP dice: «El objeto de los contratos del sector público deberá ser determinado». Dejarlo para concretarlo con el adjudicatario lo incumple. El presupuesto se ha fijado con IVA, como pide el artículo 100.1. El pliego se aprobó antes de la licitación, como exige el artículo 122.1. Un año de duración está muy por debajo del máximo de cinco años del artículo 29.4."
  citation: "art. 99.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-101
- id: m03-l04-q085
  prompt:
    es: "Un suministro de un año, sin prórrogas ni modificaciones previstas, tiene un importe total estimado de 24.200 euros, IVA del 21 por ciento incluido. ¿Cuál es su valor estimado?"
  options:
  - id: a
    text:
      es: "Un valor estimado de 24.200 euros."
  - id: b
    text:
      es: "Un valor estimado de 19.118 euros."
  - id: c
    correct: true
    text:
      es: "Un valor estimado de 20.000 euros."
  - id: d
    text:
      es: "Un valor estimado de 29.282 euros."
  explanation:
    es: "El valor estimado es «el importe total, sin incluir el Impuesto sobre el Valor Añadido» (art. 101.1.a LCSP). Para quitar un IVA del 21 por ciento se divide entre 1,21: 24.200 entre 1,21 son 20.000 euros. Los 24.200 euros dejan el IVA dentro. Los 19.118 euros restan el 21 por ciento del importe con IVA, que no es la forma de quitarlo. Los 29.282 euros vuelven a sumar el IVA."
  citation: "art. 101.1.a) LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-106
- id: m03-l04-q086
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué condiciones puede el órgano de contratación exigir a los licitadores una garantía provisional?"
  options:
  - id: a
    correct: true
    text:
      es: "De forma excepcional, por interés público y justificándolo motivadamente en el expediente."
  - id: b
    text:
      es: "A petición de cualquier licitador, justificándolo en el anuncio de licitación del contrato."
  - id: c
    text:
      es: "Siempre que el contrato sea de obras, justificándolo en el pliego de prescripciones técnicas."
  - id: d
    text:
      es: "Por la complejidad técnica del objeto, previa autorización del Consejo de Ministros."
  explanation:
    es: "El artículo 106.1 LCSP solo admite la garantía provisional «cuando de forma excepcional el órgano de contratación, por motivos de interés público, lo considere necesario y lo justifique motivadamente en el expediente». No la piden los licitadores ni se justifica en el anuncio. No basta con que el contrato sea de obras, y la justificación va en el expediente, no en el pliego de prescripciones técnicas. La complejidad técnica no es el motivo legal, y no hace falta autorización del Consejo de Ministros."
  citation: "art. 106.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-108
- id: m03-l04-q087
  prompt:
    es: "Si el adjudicatario de un contrato celebrado con una Administración Pública presta la garantía definitiva en valores, esos valores han de ser:"
  options:
  - id: a
    text:
      es: "Acciones cotizadas en un mercado secundario oficial."
  - id: b
    text:
      es: "Participaciones en fondos de inversión armonizados."
  - id: c
    text:
      es: "Obligaciones de sociedades con buena calificación crediticia."
  - id: d
    correct: true
    text:
      es: "En todo caso, valores de Deuda Pública."
  explanation:
    es: "El artículo 108.1.a) LCSP admite la garantía «en efectivo o en valores, que en todo caso serán de Deuda Pública». Las acciones cotizadas, las participaciones en fondos de inversión y las obligaciones de sociedades privadas no son Deuda Pública, así que no sirven, por buena que sea su liquidez o su calificación."
  citation: "art. 108.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
