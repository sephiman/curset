m03-l03-q01:
  key:
    anchor: jep-444#Scheduling-virtual-threads
    sentence: The JDK's virtual thread scheduler is a work-stealing ForkJoinPool that operates in FIFO mode.
  wrong:
  - option: The operating system scheduler, which maps each virtual thread 1:1 to a kernel thread
    anchor: javadoc-thread#virtual-threads
    sentence: Virtual threads are typically user-mode threads scheduled by the Java runtime rather than the operating system.
  - option: The common `ForkJoinPool` used by parallel streams, which operates in LIFO mode
    anchor: jep-444#Scheduling-virtual-threads
    sentence: This ForkJoinPool is distinct from the common pool which is used, for example, in the implementation of parallel streams, and which operates in LIFO mode.
  - option: A time-sharing scheduler that preempts a virtual thread when it has used its allotted CPU time
    anchor: jep-444#Scheduling-virtual-threads
    sentence: The scheduler does not currently implement time sharing for virtual threads.
m03-l03-q02:
  key:
    anchor: jep-444#Executing-virtual-threads
    sentence: If a virtual thread performs a blocking operation such as I/O or BlockingQueue.take() while it is pinned, then its carrier and the underlying OS thread are blocked for the duration of the operation.
  wrong:
  - option: The virtual thread unmounts, and the carrier is free to run another virtual thread
    anchor: jep-491#Virtual-threads-are-pinned-in-synchronized-methods
    sentence: Pinning prevents the virtual thread from unmounting.
  - option: The scheduler adds a carrier thread to compensate for the blocked one
    anchor: jep-444#Executing-virtual-threads
    sentence: The scheduler does not compensate for pinning by expanding its parallelism.
  - option: The JVM throws an exception, because blocking inside `synchronized` makes the application incorrect
    anchor: jep-444#Executing-virtual-threads
    sentence: Pinning does not make an application incorrect, but it might hinder its scalability.
