# anchor: boe-a-2013-12887-art-16
- id: m01-l07-q084
  prompt:
    es: "Según el artículo 16 de la Ley 19/2013, de 9 de diciembre, cuando la aplicación de alguno de los límites del artículo 14 no afecte a la totalidad de la información, se concederá:"
  options:
  - id: a
    correct: true
    text:
      es: "El acceso parcial, previa omisión de la información afectada por el límite."
  - id: b
    text:
      es: "La inadmisión de la solicitud en su totalidad."
  - id: c
    text:
      es: "El acceso total, con advertencia al solicitante de la parte limitada."
  - id: d
    text:
      es: "El acceso parcial solo si el solicitante lo pide expresamente."
  explanation:
    es: "Si el límite no afecta a toda la información, el artículo 16 manda conceder el acceso parcial previa omisión de la parte afectada. No se inadmite toda la solicitud, ni se da acceso total, ni se condiciona el acceso parcial a que el solicitante lo pida."
  citation: "art. 16 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2013-12887-art-16
- id: m01-l07-q085
  prompt:
    es: "De acuerdo con el artículo 16 de la Ley 19/2013, de 9 de diciembre, no se concederá el acceso parcial cuando de la omisión de la información afectada por el límite resulte:"
  options:
  - id: a
    text:
      es: "Una información de mayor volumen que la solicitada."
  - id: b
    text:
      es: "Un retraso superior a un mes en la notificación de la resolución."
  - id: c
    correct: true
    text:
      es: "Una información distorsionada o que carezca de sentido."
  - id: d
    text:
      es: "La oposición de un tercero a la omisión."
  explanation:
    es: "El acceso parcial se concede salvo que de la omisión resulte una información distorsionada o que carezca de sentido. Un mayor volumen de información, un retraso en la resolución o la oposición de un tercero no figuran como excepción en el artículo 16."
  citation: "art. 16 Ley 19/2013"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q087
  prompt:
    es: "De acuerdo con el artículo 17.2 de la Ley 19/2013, de 9 de diciembre, la solicitud de acceso podrá presentarse por cualquier medio que permita tener constancia de la identidad del solicitante, de la información que se solicita y de:"
  options:
  - id: a
    text:
      es: "Los motivos de la solicitud y la dirección postal del solicitante."
  - id: b
    correct: true
    text:
      es: "Una dirección de contacto, preferentemente electrónica, y, en su caso, la modalidad de acceso que se prefiera."
  - id: c
    text:
      es: "El domicilio fiscal y una firma electrónica reconocida."
  - id: d
    text:
      es: "Una dirección de contacto postal y el consentimiento de los terceros."
  explanation:
    es: "El artículo 17.2 pide constancia de la identidad del solicitante, de la información solicitada, de una dirección de contacto, preferentemente electrónica, y, en su caso, de la modalidad de acceso preferida. Los motivos no se exigen, según el 17.3. Tampoco se exigen el domicilio fiscal, la firma electrónica reconocida o el consentimiento de los terceros."
  citation: "art. 17.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q089
  prompt:
    es: "De acuerdo con el artículo 18.1.c) de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, se inadmitirán a trámite las solicitudes relativas a información para cuya divulgación sea necesaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Una acción previa de reelaboración."
  - id: b
    text:
      es: "Una ponderación previa del interés público."
  - id: c
    text:
      es: "Una consulta previa a los terceros afectados."
  - id: d
    text:
      es: "Una autorización previa del Consejo de Transparencia y Buen Gobierno."
  explanation:
    es: "Se inadmite la solicitud si la divulgación exige una acción previa de reelaboración. La ponderación del interés público es el método del artículo 15.3 y la consulta a los terceros es un trámite del artículo 19.3: ninguna de las dos causa inadmisión. La autorización del Consejo no la exige la ley."
  citation: "art. 18.1.c) Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q090
  prompt:
    es: "Según el artículo 18.1 de la Ley 19/2013, de 9 de diciembre, se inadmitirán a trámite, mediante resolución motivada, las solicitudes dirigidas a un órgano en cuyo poder no obre la información cuando:"
  options:
  - id: a
    text:
      es: "Se conozca cuál es el órgano competente."
  - id: b
    text:
      es: "El solicitante no haya indicado una dirección electrónica."
  - id: c
    text:
      es: "El órgano competente esté en otra Comunidad Autónoma."
  - id: d
    correct: true
    text:
      es: "Se desconozca cuál es el órgano competente."
  explanation:
    es: "La causa de inadmisión de la letra d) exige que se desconozca el órgano competente. Si se conoce, el artículo 19.1 manda remitir la solicitud a ese órgano e informar al solicitante. La falta de dirección electrónica y que el competente esté en otra Comunidad no son causas de inadmisión."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q092
  prompt:
    es: "De acuerdo con el artículo 18.2 de la Ley 19/2013, de 9 de diciembre, cuando se inadmita la solicitud por no obrar la información en poder del órgano y desconocerse el competente, la resolución debe indicar:"
  options:
  - id: a
    text:
      es: "El órgano jerárquicamente superior al que inadmite la solicitud."
  - id: b
    text:
      es: "El Consejo de Transparencia y Buen Gobierno como órgano de reclamación."
  - id: c
    text:
      es: "La unidad de información de la Administración General del Estado."
  - id: d
    correct: true
    text:
      es: "El órgano que, a su juicio, es competente para conocer de la solicitud."
  explanation:
    es: "En el caso de la letra d), el órgano que inadmite debe indicar en la resolución el órgano que, a su juicio, es competente. El superior jerárquico, el Consejo y la unidad de información de la Administración General del Estado no son el destino que fija el artículo 18.2."
  citation: "art. 18.2 Ley 19/2013"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q093
  prompt:
    es: "Señale la respuesta correcta sobre los plazos de tramitación del artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "El solicitante dispone de quince días para concretar la solicitud y los terceros afectados de diez días para alegar."
  - id: b
    text:
      es: "El solicitante y los terceros afectados disponen de diez días para actuar."
  - id: c
    correct: true
    text:
      es: "El solicitante dispone de diez días para concretar la solicitud y los terceros afectados de quince días para alegar."
  - id: d
    text:
      es: "El solicitante dispone de un mes para concretar la solicitud y los terceros afectados de quince días para alegar."
  explanation:
    es: "Si la solicitud no identifica de forma suficiente la información, el solicitante tiene diez días para concretarla (artículo 19.2). Si puede afectar a terceros identificados, estos tienen quince días para alegar (19.3). La opción que invierte los plazos los intercambia, la que da diez días a ambos ignora el plazo de los terceros y la del mes para el solicitante lo alarga sin base en el artículo."
  citation: "art. 19 Ley 19/2013"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q094
  prompt:
    es: "¿Cuál de las siguientes opciones indica desde cuándo se cuenta el plazo máximo de un mes para notificar la resolución en materia de acceso, según la Ley 19/2013, de 9 de diciembre?"
  options:
  - id: a
    correct: true
    text:
      es: "La recepción de la solicitud por el órgano competente para resolver."
  - id: b
    text:
      es: "La presentación de la solicitud en el registro del órgano al que se dirige."
  - id: c
    text:
      es: "La admisión a trámite de la solicitud."
  - id: d
    text:
      es: "El día siguiente al fin del plazo de alegaciones de los terceros."
  explanation:
    es: "El mes se cuenta desde la recepción de la solicitud por el órgano competente para resolver, no desde que se presenta en el registro del órgano al que se dirige. Tampoco desde la admisión a trámite ni desde el fin de las alegaciones, que solo suspende el plazo."
  citation: "art. 20.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q095
  prompt:
    es: "De acuerdo con el artículo 20.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la resolución que conceda o deniegue el acceso deberá notificarse al solicitante y a:"
  options:
  - id: a
    text:
      es: "Todos los terceros identificados en el procedimiento."
  - id: b
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  - id: c
    text:
      es: "El Defensor del Pueblo."
  - id: d
    correct: true
    text:
      es: "Los terceros afectados que así lo hayan solicitado."
  explanation:
    es: "La resolución se notifica al solicitante y a los terceros afectados que así lo hayan solicitado. No a todos los terceros identificados por el mero hecho de serlo, ni al Consejo ni al Defensor del Pueblo, a quien el Presidente del Consejo comunica otras resoluciones, las del artículo 24."
  citation: "art. 20.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q097
  prompt:
    es: "¿Cuál de los siguientes incumplimientos tiene la consideración de infracción grave a efectos disciplinarios, según el artículo 20.6 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La ampliación del plazo de resolución con previa notificación al solicitante."
  - id: b
    correct: true
    text:
      es: "El incumplimiento reiterado de la obligación de resolver en plazo."
  - id: c
    text:
      es: "La resolución que concede el acceso con la oposición de un tercero."
  - id: d
    text:
      es: "La resolución que concede el acceso parcial."
  explanation:
    es: "El artículo 20.6 considera infracción grave el incumplimiento reiterado de la obligación de resolver en plazo. Ampliar el plazo un mes con previa notificación está previsto en el artículo 20.1, y conceder el acceso con oposición de un tercero o de forma parcial son resoluciones que el artículo 20.2 exige motivar, no infracciones."
  citation: "art. 20.6 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q100
  prompt:
    es: "Conforme al artículo 24.3 de la Ley 19/2013, de 9 de diciembre, cuando la denegación del acceso se fundamente en la protección de derechos o intereses de terceros, antes de resolver la reclamación:"
  options:
  - id: a
    text:
      es: "Se solicitará informe a la Agencia Española de Protección de Datos."
  - id: b
    correct: true
    text:
      es: "Se otorgará trámite de audiencia a las personas que pudieran resultar afectadas."
  - id: c
    text:
      es: "Se suspenderá el plazo hasta que resuelva la jurisdicción contencioso-administrativa."
  - id: d
    text:
      es: "Se dará traslado de la reclamación al Defensor del Pueblo."
  explanation:
    es: "Si la denegación se basa en derechos o intereses de terceros, el artículo 24.3 manda dar audiencia a las personas que pudieran resultar afectadas antes de resolver. El informe de la Agencia de Protección de Datos, la suspensión hasta una resolución judicial y el traslado al Defensor del Pueblo no son trámites que prevea el apartado."
  citation: "art. 24.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q101
  prompt:
    es: "De acuerdo con el artículo 24.5 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las resoluciones del Consejo de Transparencia y Buen Gobierno sobre las reclamaciones se publicarán:"
  options:
  - id: a
    text:
      es: "Íntegramente, con los datos de los reclamantes."
  - id: b
    text:
      es: "Solo cuando el reclamante lo solicite."
  - id: c
    correct: true
    text:
      es: "Previa disociación de los datos de carácter personal que contuvieran."
  - id: d
    text:
      es: "Únicamente en el Boletín Oficial del Estado."
  explanation:
    es: "Las resoluciones del Consejo se publican por medios electrónicos y previa disociación de los datos personales que contuvieran. No se publican con los datos de los reclamantes, ni solo a petición de estos, ni únicamente en el Boletín Oficial del Estado."
  citation: "art. 24.5 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
