# anchor: boe-a-1979-23709-art-1
- id: m01-l02-q073
  prompt:
    es: "Conforme al artículo 1.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Tribunal, como intérprete supremo de la Constitución, es independiente de los demás órganos constitucionales y se somete únicamente:"
  options:
  - id: a
    text:
      es: "A la Constitución y a la doctrina del Tribunal Supremo."
  - id: b
    text:
      es: "A la Constitución y a las leyes ordinarias."
  - id: c
    text:
      es: "A la Constitución, a su Ley Orgánica y a los criterios del Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "A la Constitución y a su propia Ley Orgánica."
  explanation:
    es: "El artículo 1.1 dice que el Tribunal «está sometido sólo a la Constitución y a la presente Ley Orgánica». La doctrina del Tribunal Supremo no lo vincula, porque el Tribunal es independiente de los demás órganos constitucionales. Las leyes ordinarias tampoco son su parámetro de sometimiento: lo es su propia Ley Orgánica. Añadir los criterios del Consejo General del Poder Judicial contradice esa independencia."
  citation: "art. 1.1 LOTC"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1979-23709-art-1
- id: m01-l02-q074
  prompt:
    es: "Señale la respuesta correcta sobre el Tribunal Constitucional, de acuerdo con el artículo 1.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional:"
  options:
  - id: a
    text:
      es: "Se organiza en Salas territoriales, una por cada Comunidad Autónoma, con jurisdicción limitada a su ámbito."
  - id: b
    correct: true
    text:
      es: "Es único en su orden y extiende su jurisdicción a todo el territorio nacional."
  - id: c
    text:
      es: "Está integrado en el Poder Judicial y sometido a la dirección del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Es un órgano consultivo del Gobierno que carece de jurisdicción propia."
  explanation:
    es: "El artículo 1.2 lo define como «único en su orden», con jurisdicción en todo el territorio nacional. Un Tribunal dividido en Salas territoriales choca con esa unidad. Tampoco forma parte del Poder Judicial ni depende del Consejo General del Poder Judicial: el artículo 1.1 lo declara independiente de los demás órganos constitucionales. Y ejerce jurisdicción propia, de modo que no es un órgano consultivo del Gobierno."
  citation: "art. 1.2 LOTC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q076
  prompt:
    es: "¿Cuál de las siguientes distribuciones de los doce miembros del Tribunal Constitucional según el órgano que los propone es la que establece el artículo 159.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Cuatro a propuesta del Congreso, cuatro del Senado, cuatro del Gobierno y ninguno del Poder Judicial."
  - id: b
    text:
      es: "Seis a propuesta del Congreso, tres del Senado, dos del Gobierno y uno del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Cuatro a propuesta del Congreso, cuatro del Senado, dos del Gobierno y dos del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Cuatro a propuesta del Congreso, dos del Senado, dos del Gobierno y cuatro del Poder Judicial."
  explanation:
    es: "El artículo 159.1 reparte los doce puestos así: cuatro a propuesta del Congreso, cuatro del Senado, dos del Gobierno y dos del Consejo General del Poder Judicial. El reparto con cuatro del Gobierno deja sin voz al Consejo General del Poder Judicial, que propone dos. Las cifras de seis, tres y uno no figuran en el artículo. Dos del Senado y cuatro del Consejo General del Poder Judicial invierte los números reales de ambos órganos."
  citation: "art. 159.1 CE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q077
  prompt:
    es: "¿Cuál de los siguientes órganos propone, además del Congreso, del Senado y del Gobierno, a dos de los doce miembros del Tribunal Constitucional, conforme al artículo 159.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo en Pleno."
  - id: b
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  - id: c
    text:
      es: "El Consejo de Estado en Pleno."
  - id: d
    text:
      es: "El Ministerio Fiscal, a través del Fiscal General del Estado."
  explanation:
    es: "Dos miembros se nombran «a propuesta del Consejo General del Poder Judicial» (artículo 159.1). El Tribunal Supremo, el Consejo de Estado y el Ministerio Fiscal no tienen propuesta alguna: el artículo solo menciona al Congreso, al Senado, al Gobierno y a ese Consejo."
  citation: "art. 159.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1979-23709-art-16
- id: m01-l02-q078
  prompt:
    es: "¿Cuál de los siguientes sujetos presenta las candidaturas entre las que se eligen los Magistrados que propone el Senado, según el artículo 16.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "Los Grupos Parlamentarios del propio Senado."
  - id: b
    text:
      es: "El Gobierno y el Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Las Asambleas Legislativas de las Comunidades Autónomas."
  - id: d
    text:
      es: "Las Corporaciones Locales de cada provincia."
  explanation:
    es: "El artículo 16.1 dice que los propuestos por el Senado se eligen «entre las candidaturas presentadas por las Asambleas Legislativas de las comunidades autónomas». Los Grupos del Senado, el Gobierno con el Consejo General del Poder Judicial (que proponen a sus propios cuatro) y las Corporaciones Locales no presentan esas candidaturas."
  citation: "art. 16.1 LOTC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q079
  prompt:
    es: "Según el artículo 159.2 de la Constitución Española de 1978, los miembros del Tribunal Constitucional se nombran entre Magistrados y Fiscales, Profesores de Universidad, funcionarios públicos y Abogados, que han de ser todos ellos:"
  options:
  - id: a
    text:
      es: "Doctores en Derecho con cátedra."
  - id: b
    text:
      es: "Letrados de las Cortes o del Consejo de Estado."
  - id: c
    text:
      es: "Magistrados del Supremo con diez años de carrera."
  - id: d
    correct: true
    text:
      es: "Juristas de reconocida competencia."
  explanation:
    es: "El artículo 159.2 exige que todos sean «juristas de reconocida competencia» con más de quince años de ejercicio profesional. Un doctorado con cátedra, la condición de Letrado de las Cortes o del Consejo de Estado y una antigüedad judicial de diez años son requisitos que el artículo no fija. Tampoco hay que ser Magistrado del Supremo."
  citation: "art. 159.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1979-23709-art-18
- id: m01-l02-q080
  prompt:
    es: "Señale la opción correcta. Además de lo que exige la Constitución, el artículo 18 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional dispone que los miembros del Tribunal Constitucional se nombran entre:"
  options:
  - id: a
    correct: true
    text:
      es: "Ciudadanos españoles que reúnan las condiciones profesionales exigidas."
  - id: b
    text:
      es: "Ciudadanos españoles de nacimiento, sin otra condición."
  - id: c
    text:
      es: "Ciudadanos de cualquier Estado miembro de la Unión Europea."
  - id: d
    text:
      es: "Residentes en España durante al menos diez años."
  explanation:
    es: "El artículo 18 dice que se nombran «entre ciudadanos españoles» que sean Magistrados, Fiscales, Profesores de Universidad, funcionarios públicos o Abogados con la competencia y los años exigidos. La nacionalidad española de nacimiento es la exigencia que la Constitución hace al tutor del Rey menor, no a los Magistrados. Un ciudadano de otro Estado de la Unión o un simple residente no cumple el artículo."
  citation: "art. 18 LOTC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q081
  prompt:
    es: "De acuerdo con el artículo 159.3 de la Constitución Española de 1978, los miembros del Tribunal Constitucional serán designados por un período de nueve años y se renovarán:"
  options:
  - id: a
    text:
      es: "Por mitades cada cuatro años."
  - id: b
    correct: true
    text:
      es: "Por terceras partes cada tres años."
  - id: c
    text:
      es: "Por cuartas partes cada tres años."
  - id: d
    text:
      es: "Todos a la vez a los nueve años."
  explanation:
    es: "Según el artículo 159.3 los miembros se renuevan «por terceras partes cada tres». La renovación por mitades cada cuatro años y por cuartas partes cada tres años son pautas inventadas. La renovación total a los nueve años tampoco existe: el Tribunal se renueva de manera escalonada."
  citation: "art. 159.3 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q082
  prompt:
    es: "¿Qué parte del Tribunal Constitucional se renueva cada tres años, conforme al artículo 159.3 de la Constitución Española de 1978, dado que sus miembros se designan por nueve años?"
  options:
  - id: a
    correct: true
    text:
      es: "Una tercera parte de sus miembros."
  - id: b
    text:
      es: "La mitad de sus miembros."
  - id: c
    text:
      es: "Una cuarta parte del Tribunal."
  - id: d
    text:
      es: "Todos sus miembros a la vez."
  explanation:
    es: "Con mandatos de nueve años y renovaciones cada tres, el artículo 159.3 dispone la renovación «por terceras partes»: cuatro de los doce miembros cada vez. La mitad y una cuarta parte no cuadran con ese ritmo, y renovarlos todos a la vez rompería el escalonamiento que busca el artículo."
  citation: "art. 159.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1979-23709-art-17
- id: m01-l02-q084
  prompt:
    es: "Según el artículo 17.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, los Magistrados del Tribunal Constitucional continuarán en el ejercicio de sus funciones una vez expirado su mandato:"
  options:
  - id: a
    text:
      es: "Hasta que el Rey nombre a sus sucesores mediante real decreto."
  - id: b
    text:
      es: "Durante los tres meses siguientes a la expiración del nombramiento."
  - id: c
    correct: true
    text:
      es: "Hasta que hayan tomado posesión quienes hubieren de sucederles."
  - id: d
    text:
      es: "Hasta que el Tribunal en Pleno acuerde su cese."
  explanation:
    es: "El artículo 17.2 prolonga las funciones «hasta que hayan tomado posesión quienes hubieren de sucederles». El momento no es el del nombramiento por el Rey, sino el de la toma de posesión. No hay un plazo fijo de tres meses ni un acuerdo del Pleno que ponga fin al cargo."
  citation: "art. 17.2 LOTC"
  difficulty: 3
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1979-23709-art-9
- id: m01-l02-q085
  prompt:
    es: "De acuerdo con el artículo 9 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Pleno elige a su Presidente por votación secreta y, en primera votación, se requiere:"
  options:
  - id: a
    text:
      es: "Dos tercios de sus miembros."
  - id: b
    text:
      es: "Tres quintos de sus miembros."
  - id: c
    text:
      es: "Mayoría simple de los presentes."
  - id: d
    correct: true
    text:
      es: "Mayoría absoluta de sus miembros."
  explanation:
    es: "En primera votación se requiere «la mayoría absoluta» (artículo 9.2). Si no se alcanza, hay una segunda votación en la que resulta elegido quien obtenga más votos. Ni los dos tercios ni los tres quintos se exigen en ninguna fase, y la mayoría simple de los presentes no es la de primera votación."
  citation: "art. 9.2 LOTC"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1979-23709-art-9
- id: m01-l02-q088
  prompt:
    es: "Señale la opción correcta. Según el artículo 9.4 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Pleno elige un Vicepresidente por el mismo procedimiento que el Presidente y para un período de:"
  options:
  - id: a
    text:
      es: "Seis años, el doble que el del Presidente."
  - id: b
    correct: true
    text:
      es: "Tres años, igual que el del Presidente."
  - id: c
    text:
      es: "Nueve años, igual que el de los Magistrados."
  - id: d
    text:
      es: "Un año, renovable por el Pleno."
  explanation:
    es: "El Vicepresidente se elige «por el mismo período de tres años» (artículo 9.4). Seis años duplican el del Presidente, nueve es el mandato de los Magistrados y un año renovable no figura en la ley."
  citation: "art. 9.4 LOTC"
  difficulty: 3
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1979-23709-art-41
- id: m01-l02-q091
  prompt:
    es: "Según el artículo 41.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el recurso de amparo protege los derechos de los artículos 14 a 29 de la Constitución y, además:"
  options:
  - id: a
    text:
      es: "La libertad de empresa en el marco de la economía de mercado."
  - id: b
    correct: true
    text:
      es: "La objeción de conciencia reconocida por la Constitución."
  - id: c
    text:
      es: "El derecho a la propiedad privada y a la herencia."
  - id: d
    text:
      es: "El derecho a la protección de la salud."
  explanation:
    es: "El artículo 41.1 suma a los artículos 14 a 29 «la objeción de conciencia reconocida en el artículo treinta». La libertad de empresa, la propiedad privada y la protección de la salud están fuera de ese tramo y no tienen amparo constitucional."
  citation: "art. 41.1 LOTC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-161
- id: m01-l02-q092
  prompt:
    es: "Señale la afirmación correcta sobre los conflictos de competencia de los que conoce el Tribunal Constitucional, de acuerdo con el artículo 161.1.c) de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Solo pueden enfrentar al Estado con una Comunidad Autónoma, nunca a dos de ellas entre sí."
  - id: b
    text:
      es: "Enfrentan a las Comunidades Autónomas con los Ayuntamientos de su territorio."
  - id: c
    text:
      es: "Los resuelve el Tribunal Supremo y el Tribunal Constitucional conoce solo de su revisión."
  - id: d
    correct: true
    text:
      es: "Pueden enfrentar al Estado con una Comunidad Autónoma o a dos Comunidades Autónomas entre sí."
  explanation:
    es: "El artículo 161.1.c) atribuye al Tribunal «los conflictos de competencia entre el Estado y las Comunidades Autónomas o de los de éstas entre sí». Excluir los conflictos entre dos Comunidades recorta ese texto. Los Ayuntamientos no son parte en estos conflictos, y es el propio Tribunal Constitucional, no el Supremo, quien los resuelve."
  citation: "art. 161.1 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-161
- id: m01-l02-q093
  prompt:
    es: "¿Cuál de las siguientes materias NO figura entre las que enumera el artículo 161.1 de la Constitución Española de 1978 como competencia del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "El recurso de amparo por violación de los derechos y libertades del artículo 53.2."
  - id: b
    text:
      es: "Los conflictos de competencia entre el Estado y las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "La revisión en casación de las sentencias dictadas por los Tribunales Superiores de Justicia."
  - id: d
    text:
      es: "El recurso de inconstitucionalidad contra leyes y disposiciones con fuerza de ley."
  explanation:
    es: "El artículo 161.1 enumera el recurso de inconstitucionalidad, el de amparo, los conflictos de competencia y las demás materias que atribuyan la Constitución o las leyes orgánicas. La casación contra sentencias de los Tribunales Superiores de Justicia no aparece en la lista. Las otras tres opciones son competencias que el artículo reconoce expresamente."
  citation: "art. 161.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-161
- id: m01-l02-q094
  prompt:
    es: "Señale la opción correcta. Conforme al artículo 161.2 de la Constitución Española de 1978, cuando el Gobierno impugna una disposición autonómica ante el Tribunal Constitucional, la impugnación produce:"
  options:
  - id: a
    text:
      es: "La anulación de la disposición."
  - id: b
    text:
      es: "La remisión previa del asunto al Consejo de Estado para dictamen."
  - id: c
    text:
      es: "Ningún efecto sobre la vigencia de la disposición hasta la sentencia."
  - id: d
    correct: true
    text:
      es: "La suspensión de la disposición recurrida."
  explanation:
    es: "El artículo 161.2 dice que la impugnación «producirá la suspensión de la disposición o resolución recurrida». No la anula: el Tribunal debe ratificar o levantar la suspensión. Tampoco hay trámite previo ante el Consejo de Estado. Y que no haya efecto sobre la vigencia contradice el texto, que prevé la suspensión desde la impugnación."
  citation: "art. 161.2 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-161
- id: m01-l02-q095
  prompt:
    es: "Según el artículo 161.2 de la Constitución Española de 1978, tras la impugnación del Gobierno, el Tribunal Constitucional debe ratificar o levantar la suspensión de la disposición en:"
  options:
  - id: a
    correct: true
    text:
      es: "Un plazo no superior a cinco meses."
  - id: b
    text:
      es: "Un plazo no superior a tres meses."
  - id: c
    text:
      es: "Un plazo no superior a dos meses."
  - id: d
    text:
      es: "Un plazo no superior a seis meses."
  explanation:
    es: "El artículo 161.2 fija «un plazo no superior a cinco meses». Dos meses es el plazo para que el Gobierno impugne (artículo 76 de la Ley Orgánica del Tribunal Constitucional) y tres meses el general del recurso de inconstitucionalidad (artículo 33.1). Seis meses no es plazo alguno del artículo."
  citation: "art. 161.2 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-162
- id: m01-l02-q096
  prompt:
    es: "¿Cuál de las siguientes instituciones está legitimada, según el artículo 162.1 de la Constitución Española de 1978, para interponer tanto el recurso de inconstitucionalidad como el recurso de amparo?"
  options:
  - id: a
    text:
      es: "El Ministerio Fiscal."
  - id: b
    correct: true
    text:
      es: "El Defensor del Pueblo."
  - id: c
    text:
      es: "El Consejo de Estado."
  - id: d
    text:
      es: "El Tribunal de Cuentas."
  explanation:
    es: "El Defensor del Pueblo figura en el artículo 162.1.a) para el recurso de inconstitucionalidad y en el 162.1.b) para el de amparo. El Ministerio Fiscal solo está legitimado para el amparo. El Consejo de Estado y el Tribunal de Cuentas no aparecen en ninguno de los dos supuestos."
  citation: "art. 162.1.a CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-162
- id: m01-l02-q097
  prompt:
    es: "Conforme al artículo 162.1.a) de la Constitución Española de 1978, para interponer el recurso de inconstitucionalidad están legitimados, entre otros, determinados parlamentarios en número de:"
  options:
  - id: a
    text:
      es: "Treinta Diputados o treinta Senadores."
  - id: b
    correct: true
    text:
      es: "Cincuenta Diputados o cincuenta Senadores."
  - id: c
    text:
      es: "Setenta y cinco Diputados o setenta y cinco Senadores."
  - id: d
    text:
      es: "Un décimo de los miembros de cualquiera de las Cámaras."
  explanation:
    es: "El artículo 162.1.a) habla de «50 Diputados, 50 Senadores». Treinta y setenta y cinco son cifras inventadas. La décima parte de los miembros de cualquiera de las Cámaras es la cifra que el artículo 167.3 exige para pedir el referéndum de reforma, no para este recurso."
  citation: "art. 162.1.a CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1978-31229-art-162
- id: m01-l02-q098
  prompt:
    es: "¿Cuál de los siguientes sujetos está legitimado para interponer el recurso de inconstitucionalidad, según el artículo 162.1.a) de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los Ayuntamientos de más de cien mil habitantes."
  - id: b
    text:
      es: "Los Presidentes de los Tribunales Superiores de Justicia."
  - id: c
    text:
      es: "El Consejo de Estado en Pleno."
  - id: d
    correct: true
    text:
      es: "Los órganos colegiados ejecutivos de las Comunidades Autónomas."
  explanation:
    es: "El artículo 162.1.a) incluye a los «órganos colegiados ejecutivos de las Comunidades Autónomas» y, en su caso, a sus Asambleas. Los Ayuntamientos, los Presidentes de los Tribunales Superiores de Justicia y el Consejo de Estado no están en la lista."
  citation: "art. 162.1.a CE"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-162
- id: m01-l02-q099
  prompt:
    es: "De acuerdo con el artículo 162.1.b) de la Constitución Española de 1978, toda persona natural o jurídica puede interponer el recurso de amparo siempre que invoque:"
  options:
  - id: a
    text:
      es: "Un derecho subjetivo reconocido por sentencia firme."
  - id: b
    text:
      es: "Un interés económico superior a la cuantía que fije la ley."
  - id: c
    correct: true
    text:
      es: "Un interés legítimo."
  - id: d
    text:
      es: "La representación de al menos cincuenta ciudadanos."
  explanation:
    es: "La persona natural o jurídica debe invocar «un interés legítimo» (artículo 162.1.b). No se exige sentencia previa que le reconozca un derecho, ni una cuantía mínima, ni respaldo de cincuenta ciudadanos."
  citation: "art. 162.1.b CE"
  difficulty: 2
  tags:
  - "requisito"
  - "competencia"
# anchor: boe-a-1978-31229-art-163
- id: m01-l02-q100
  prompt:
    es: "Conforme al artículo 163 de la Constitución Española de 1978, la cuestión de inconstitucionalidad ante el Tribunal Constitucional la plantea:"
  options:
  - id: a
    correct: true
    text:
      es: "Un órgano judicial que dude de la validez de una norma con rango de ley aplicable al caso."
  - id: b
    text:
      es: "Cualquiera de las partes del proceso, directamente ante el Tribunal Constitucional."
  - id: c
    text:
      es: "El Ministerio Fiscal, a petición de los ciudadanos afectados."
  - id: d
    text:
      es: "El Tribunal Supremo, solo en recursos de casación."
  explanation:
    es: "El artículo 163 atribuye el planteamiento al «órgano judicial» que considere, en algún proceso, que una norma con rango de ley aplicable al caso puede ser contraria a la Constitución. Las partes no acuden directamente, el Ministerio Fiscal no actúa a petición de los ciudadanos y no se limita a recursos de casación ni al Tribunal Supremo."
  citation: "art. 163 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-163
- id: m01-l02-q101
  prompt:
    es: "Señale la opción correcta. Según el artículo 163 de la Constitución Española de 1978, la norma con rango de ley que se somete al Tribunal Constitucional debe ser aplicable al caso y de ella debe depender:"
  options:
  - id: a
    text:
      es: "La competencia territorial del órgano judicial."
  - id: b
    text:
      es: "La admisión a trámite del recurso de amparo."
  - id: c
    text:
      es: "La vigencia de la norma hasta la sentencia."
  - id: d
    correct: true
    text:
      es: "El fallo del proceso en que se plantea la cuestión."
  explanation:
    es: "La norma ha de ser «aplicable al caso, de cuya validez dependa el fallo». No se pide que condicione la competencia territorial ni la admisión de un amparo. Tampoco su vigencia: los efectos de la cuestión no son en ningún caso suspensivos."
  citation: "art. 163 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1979-23709-art-49
- id: m01-l02-q103
  prompt:
    es: "Conforme al artículo 49.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, la demanda del recurso de amparo constitucional debe justificar en todo caso:"
  options:
  - id: a
    text:
      es: "La insuficiencia de recursos del demandante."
  - id: b
    text:
      es: "La urgencia del recurso para evitar un perjuicio irreparable."
  - id: c
    correct: true
    text:
      es: "La especial trascendencia constitucional del recurso."
  - id: d
    text:
      es: "La previa declaración de nulidad por el Tribunal Supremo."
  explanation:
    es: "El artículo 49.1 exige que la demanda «justificará la especial trascendencia constitucional del recurso». La falta de recursos del demandante, la urgencia y una nulidad previa del Supremo no son requisitos de la demanda."
  citation: "art. 49.1 LOTC"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1979-23709-art-42
- id: m01-l02-q104
  prompt:
    es: "Según el artículo 42 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, las decisiones o actos sin valor de ley de las Cortes o de las Asambleas autonómicas que violen derechos amparables pueden recurrirse en:"
  options:
  - id: a
    text:
      es: "Veinte días desde la notificación."
  - id: b
    correct: true
    text:
      es: "Tres meses desde que sean firmes."
  - id: c
    text:
      es: "Treinta días desde la notificación."
  - id: d
    text:
      es: "Tres meses desde su publicación."
  explanation:
    es: "El artículo 42 da «tres meses desde que (...) sean firmes». Los veinte días son los del amparo frente al Gobierno o la Administración agotada la vía judicial (artículo 43.2), los treinta días son los de la violación imputable a un órgano judicial (artículo 44.2), y los tres meses desde la publicación son los del recurso de inconstitucionalidad (artículo 33.1)."
  citation: "art. 42 LOTC"
  difficulty: 3
  tags:
  - "plazo"
