- id: g-virtual-thread
  term:
    en: virtual thread
  definition:
    en: A lightweight thread that dramatically reduces the effort of writing, maintaining, and observing high-throughput concurrent applications.
  origin: m03-l03
  citation: jep-444#Summary
- id: g-platform-thread
  term:
    en: platform thread
  definition:
    en: A thread that is typically mapped 1:1 to a kernel thread scheduled by the operating system.
  origin: m03-l03
  citation: javadoc-thread#platform-threads
- id: g-carrier-thread
  term:
    en: carrier
  definition:
    en: The platform thread to which the scheduler assigns a virtual thread.
  origin: m03-l03
  citation: jep-444#Scheduling-virtual-threads
- id: g-structured-concurrency
  term:
    en: structured concurrency
  definition:
    en: An approach that treats groups of related tasks running in different threads as single units of work, thereby streamlining error handling and cancellation, improving reliability, and enhancing observability.
  origin: m03-l03
  citation: jep-505#Summary
- id: g-scoped-value
  term:
    en: scoped value
  definition:
    en: A value that may be safely and efficiently shared to methods without using method parameters.
  origin: m03-l03
  citation: javadoc-scopedvalue#class-scopedvalue-t
- id: g-thread-local-variable
  term:
    en: thread-local variable
  definition:
    en: A variable of which each thread that accesses it has its own, independently initialized copy.
  origin: m03-l03
  citation: javadoc-threadlocal#class-threadlocal-t
