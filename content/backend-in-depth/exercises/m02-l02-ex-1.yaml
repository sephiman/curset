- id: m02-l02-q11
  prompt:
    en: A sorted `int[]` holds the value 4 at indexes 2, 3 and 5, and `Arrays.binarySearch(a, 4)` is called in Java
      25. Which statement about the returned index is correct?
  options:
  - id: a
    text:
      en: It is always the lowest index holding 4, so the result is index 2
  - id: b
    correct: true
    text:
      en: It is the index of one of the elements equal to 4, and there is no guarantee which one
  - id: c
    text:
      en: It is negative, because the array contains more than one element equal to the key
  - id: d
    text:
      en: It is the insertion point of 4, the index where a new 4 would be placed
  explanation:
    en: The result is the index of one element equal to 4, and no guarantee says which one. The claim of always
      the lowest index is wrong, because there is no guarantee which element will be found. The claim of a negative
      result is wrong, because the return value is >= 0 if and only if the key is found. The claim of the insertion
      point is wrong, because a key that is contained in the array gives its index and only a missing key gives
      the encoded insertion point.
  citation: javadoc-arrays#binarySearch(int[],int)
- id: m02-l02-q12
  prompt:
    en: According to Open Data Structures, how does its quicksort partition the array while it sorts it, and what
      does that mean for memory use?
  options:
  - id: a
    correct: true
    text:
      en: It partitions in place without extra space, sorting a subarray of the original array
  - id: b
    text:
      en: It copies each half into new arrays, as merge-sort does, and merges them back afterwards
  - id: c
    text:
      en: It partitions into a second array of the same length, and the result is copied back at the end
  - id: d
    text:
      en: It picks the median element as the pivot so that the two parts always have equal size
  explanation:
    en: The quicksort partitions in place, without extra space, and sorts a subarray of the original array. The
      claim of copied halves is wrong, because the method only sorts the subarray instead of making copies of the
      subarrays. The claim of a second array is wrong, because the partitioning algorithm swaps elements without
      using any extra space. The claim of a median pivot is wrong, because the algorithm picks a random pivot element.
  citation: ods-11-1-comparison-based-sorti#SECTION001412000000000000000
