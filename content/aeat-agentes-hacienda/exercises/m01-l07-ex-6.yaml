# anchor: boe-a-1995-8729-art-57
- id: m01-l07-q0241
  prompt:
    es: "Una funcionaria obtiene por libre designación un puesto en la misma localidad en la que reside. ¿De qué plazo dispone para tomar posesión, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "De un mes desde el día siguiente al cese, por tratarse de libre designación."
  - id: b
    correct: true
    text:
      es: "De tres días hábiles desde el día siguiente al cese, como en el concurso."
  - id: c
    text:
      es: "Del que fije en cada caso la resolución de nombramiento del puesto."
  - id: d
    text:
      es: "De tres días naturales desde la publicación del nombramiento en el BOE."
  explanation:
    es: "El artículo 57 RD 364/1995 dice que el régimen de toma de posesión en la libre designación «será el establecido en el artículo 48», el del concurso. Sin cambio de residencia son tres días hábiles desde el día siguiente al del cese (artículo 48.1). El mes es para el cambio de residencia o el reingreso, no para la libre designación como tal. El plazo no lo fija cada resolución, y los días son hábiles y se cuentan desde el cese."
  citation: "art. 57 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-72
- id: m01-l07-q0244
  prompt:
    es: "Doña Leire Cuesta Arribas reingresa sin reserva de puesto, por adscripción provisional, a un puesto vacante del Instituto. Conforme al Real Decreto 364/1995, de 10 de marzo, ¿qué obligación tiene respecto del puesto?"
  options:
  - id: a
    correct: true
    text:
      es: "Participar en la convocatoria que se haga para cubrirlo con carácter definitivo."
  - id: b
    text:
      es: "Dejarlo libre cuando se convoque para su cobertura definitiva, sin poder concursar a él."
  - id: c
    text:
      es: "Pedir cada año la prórroga de su adscripción provisional ante el órgano competente."
  - id: d
    text:
      es: "Permanecer en él dos años continuados antes de poder participar en un concurso."
  explanation:
    es: "Los puestos cubiertos mediante adscripción provisional se convocan para su cobertura con carácter definitivo, y quienes los desempeñan tienen la obligación de participar en las convocatorias (art. 72.2 RD 364/1995). No se les pide dejar el puesto sin concursar, ni prorrogar la adscripción cada año. Los dos años de permanencia son la regla del concurso para quien ocupa un destino definitivo, no una condición de la adscripción provisional."
  citation: "art. 72.2 RD 364/1995"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-11719-art-85
- id: m01-l07-q0245
  prompt:
    es: "Señale cuál de las siguientes situaciones administrativas NO figura en la enumeración del artículo 85.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "La situación de servicio en otras Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "La situación de expectativa de destino."
  - id: c
    text:
      es: "La situación de suspensión de funciones."
  - id: d
    text:
      es: "La situación de servicios especiales."
  explanation:
    es: "El artículo 85.1 enumera cinco situaciones: servicio activo, servicios especiales, servicio en otras Administraciones Públicas, excedencia y suspensión de funciones. La expectativa de destino no está en esa lista: la regula el Real Decreto 365/1995 para los afectados por una reasignación de efectivos. El servicio en otras Administraciones Públicas, la suspensión de funciones y los servicios especiales sí figuran en el artículo 85.1."
  citation: "art. 85.1 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-art-86
- id: m01-l07-q0247
  prompt:
    es: "De acuerdo con el artículo 86.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se hallan en servicio activo quienes presten servicios en su condición de funcionarios públicos:"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquiera que sea la Administración u organismo en que estén destinados."
  - id: b
    text:
      es: "Solo si están destinados en la Administración a la que pertenece su cuerpo."
  - id: c
    text:
      es: "Solo si ocupan un puesto obtenido con carácter definitivo por concurso."
  - id: d
    text:
      es: "Cualquiera que sea su destino, aunque les corresponda quedar en otra situación."
  explanation:
    es: "El artículo 86.1 declara en servicio activo a quienes presten servicios como funcionarios «cualquiera que sea la Administración u organismo público o entidad en el que se encuentren destinados y no les corresponda quedar en otra situación». No exige que el destino sea en la Administración del propio cuerpo ni que el puesto se haya obtenido por concurso. La opción que admite el servicio activo aunque corresponda otra situación contradice la condición con que cierra el artículo."
  citation: "art. 86.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8730-art-3
- id: m01-l07-q0248
  prompt:
    es: "Según el artículo 3 del Real Decreto 365/1995, de 10 de marzo, ¿en qué situación se halla el funcionario que desempeña un puesto adscrito, en la relación de puestos de trabajo, a funcionarios del ámbito de la Ley 30/1984?"
  options:
  - id: a
    text:
      es: "En la situación de servicios especiales."
  - id: b
    text:
      es: "En la situación de servicio en otras Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "En la situación de servicio activo."
  - id: d
    text:
      es: "En la situación de expectativa de destino."
  explanation:
    es: "El artículo 3.a) del Real Decreto 365/1995 sitúa en servicio activo a quienes «desempeñen un puesto que, conforme a la correspondiente relación de puestos de trabajo, esté adscrito a los funcionarios comprendidos en el ámbito de aplicación de la Ley 30/1984». Los servicios especiales responden a los supuestos de un cargo o una misión, el servicio en otras Administraciones Públicas exige destino en otra Administración y la expectativa de destino afecta a quien queda sin puesto tras una reasignación de efectivos."
  citation: "art. 3.a) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m01-l07-q0251
  prompt:
    es: "Según el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes misiones autorizadas en la OCDE determina el pase del funcionario a servicios especiales?"
  options:
  - id: a
    text:
      es: "Una misión del 1 de septiembre al 31 de diciembre de 2027."
  - id: b
    text:
      es: "Una misión del 1 de marzo al 31 de julio de 2027."
  - id: c
    text:
      es: "Una misión del 1 de enero al 30 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "Una misión del 1 de febrero al 30 de noviembre de 2027."
  explanation:
    es: "El artículo 87.1.b) exige una misión «por periodo determinado superior a seis meses» en organismos internacionales. Del 1 de febrero al 30 de noviembre de 2027 van diez meses. Del 1 de septiembre al 31 de diciembre van cuatro meses y del 1 de marzo al 31 de julio, cinco. Del 1 de enero al 30 de junio van seis meses exactos, que no son un periodo superior a seis meses."
  citation: "art. 87.1.b) TREBEP"
  difficulty: 3
  tags:
  - "requisito"
  - "cómputo"
# anchor: boe-a-1995-8730-art-8
- id: m01-l07-q0254
  prompt:
    es: "¿Qué efecto del tiempo en servicios especiales recoge el artículo 8.2 del Real Decreto 365/1995, de 10 de marzo, y falta en la lista del artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El reconocimiento de los trienios del funcionario."
  - id: b
    text:
      es: "Los ascensos en la carrera del funcionario."
  - id: c
    text:
      es: "La promoción interna del funcionario de carrera a otro cuerpo."
  - id: d
    correct: true
    text:
      es: "La consolidación del grado personal del funcionario."
  explanation:
    es: "El artículo 8.2 del Real Decreto 365/1995 computa el tiempo «a efectos de ascensos, consolidación de grado personal, trienios y derechos pasivos» y del periodo mínimo para la excedencia por interés particular. El artículo 87.2 TREBEP lo computa a efectos de ascensos, trienios, promoción interna y Seguridad Social, sin mencionar el grado personal. Los trienios y los ascensos están en las dos listas. La promoción interna está en el TREBEP y no en el reglamento."
  citation: "art. 8.2 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-16
- id: m01-l07-q0259
  prompt:
    es: "Una funcionaria acredita siete años de servicios en las Administraciones Públicas. Según el artículo 16.3 del Real Decreto 365/1995, de 10 de marzo, ¿cuál es la duración máxima de cada periodo de excedencia voluntaria por interés particular que puede obtener?"
  options:
  - id: a
    text:
      es: "Quince años, el máximo absoluto que fija el reglamento."
  - id: b
    text:
      es: "Dos años, la duración mínima de cada periodo de excedencia."
  - id: c
    text:
      es: "Cinco años, los del periodo mínimo de servicios exigido."
  - id: d
    correct: true
    text:
      es: "Siete años, los mismos que los servicios que acredita."
  explanation:
    es: "El artículo 16.3 fija cada periodo en no menos de dos años continuados «ni superior a un número de años equivalente a los que el funcionario acredite haber prestado en cualquiera de las Administraciones Públicas, con un máximo de quince». Con siete años acreditados el máximo es siete. Los quince años solo operan como tope para quien acredita más. Dos años es el mínimo, no el máximo, y cinco años es el periodo de servicios para pedirla."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1995-8730-art-17
- id: m01-l07-q0262
  prompt:
    es: "Según el artículo 17 del Real Decreto 365/1995, de 10 de marzo, la excedencia voluntaria por agrupación familiar puede concederse con una duración:"
  options:
  - id: a
    text:
      es: "Mínima de dos años y máxima de cinco."
  - id: b
    correct: true
    text:
      es: "Mínima de dos años y máxima de quince."
  - id: c
    text:
      es: "Mínima de un año y máxima de quince."
  - id: d
    text:
      es: "Sin mínimo y con una máxima de tres años."
  explanation:
    es: "El artículo 17.1 dice que podrá concederse «con una duración mínima de dos años y máxima de quince». Cinco años de máximo, un año de mínimo y la ausencia de mínimo con tres años de máximo no son las cifras del artículo. El artículo 89.3 TREBEP no fija duración; por eso la pregunta nombra el reglamento."
  citation: "art. 17 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-14
- id: m01-l07-q0263
  prompt:
    es: "Según el artículo 14.2 del Real Decreto 365/1995, de 10 de marzo, el funcionario en excedencia para el cuidado de hijos tiene derecho a la reserva del puesto de trabajo y al cómputo del tiempo a efectos de:"
  options:
  - id: a
    text:
      es: "Trienios y derechos pasivos, pero no de consolidación de grado."
  - id: b
    text:
      es: "Consolidación de grado personal, pero no de trienios."
  - id: c
    correct: true
    text:
      es: "Trienios, consolidación de grado personal y derechos pasivos."
  - id: d
    text:
      es: "Derechos pasivos, pero no de trienios ni de grado personal."
  explanation:
    es: "El artículo 14.2 reconoce «el derecho a la reserva del puesto de trabajo y a su cómputo a efectos de trienios, consolidación de grado personal, derechos pasivos y solicitud de excedencia voluntaria por interés particular». Las opciones que excluyen el grado personal, los trienios o ambos dejan fuera efectos que el artículo incluye."
  citation: "art. 14.2 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-12
- id: m01-l07-q0268
  prompt:
    es: "De acuerdo con el artículo 12.1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, pasan a expectativa de destino los funcionarios afectados por un procedimiento de reasignación de efectivos que:"
  options:
  - id: a
    text:
      es: "No hayan obtenido puesto en ninguna de las fases del procedimiento."
  - id: b
    correct: true
    text:
      es: "No hayan obtenido puesto en las dos primeras fases del procedimiento."
  - id: c
    text:
      es: "Hayan rechazado el puesto ofrecido en la primera fase del procedimiento."
  - id: d
    text:
      es: "No hayan obtenido puesto en la primera fase del procedimiento."
  explanation:
    es: "El artículo 12.1 lleva a la expectativa de destino a los afectados por la reasignación de efectivos «que no hayan obtenido puesto en las dos primeras fases». No basta con no obtenerlo en la primera fase. No obtenerlo en ninguna fase no es el supuesto: la situación se declara al terminar la segunda. El rechazo de un puesto ofrecido no es la causa que el artículo describe."
  citation: "art. 12.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-18
- id: m01-l07-q0274
  prompt:
    es: "De acuerdo con el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, durante la excedencia voluntaria incentivada el funcionario:"
  options:
  - id: a
    text:
      es: "Puede desempeñar puestos en el sector público si obtiene la oportuna compatibilidad."
  - id: b
    text:
      es: "No puede desempeñar puestos en la Administración General del Estado, pero sí en otras."
  - id: c
    correct: true
    text:
      es: "No puede desempeñar puestos en el sector público bajo ningún tipo de relación."
  - id: d
    text:
      es: "Puede desempeñar puestos en el sector público solo como personal laboral temporal."
  explanation:
    es: "El artículo 18.4 dice que la excedencia incentivada «impedirá desempeñar puestos de trabajo en el sector público, bajo ningún tipo de relación funcionarial o contractual, sea ésta de naturaleza laboral o administrativa». No hay excepción para el laboral temporal ni para quien obtenga compatibilidad. La prohibición alcanza a todo el sector público, no solo a la Administración General del Estado."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1995-8730-art-19
- id: m01-l07-q0277
  prompt:
    es: "De acuerdo con el artículo 19 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, las distintas modalidades de excedencia voluntaria:"
  options:
  - id: a
    correct: true
    text:
      es: "No producen, en ningún caso, reserva de puesto de trabajo."
  - id: b
    text:
      es: "Producen reserva de un puesto en la misma localidad y de igual retribución."
  - id: c
    text:
      es: "Producen reserva del puesto de trabajo durante los seis primeros meses."
  - id: d
    text:
      es: "Producen reserva del puesto de trabajo durante los dos primeros años."
  explanation:
    es: "El artículo 19: las modalidades de excedencia voluntaria «no producen, en ningún caso, reserva de puesto de trabajo». La reserva durante dos años y la posterior en la misma localidad y con igual retribución son de la excedencia por cuidado de familiares (art. 89.4 TREBEP). Los seis primeros meses de reserva son de la excedencia por violencia de género o sexual (art. 89.5 TREBEP). Ninguna de las dos es una excedencia voluntaria."
  citation: "art. 19 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
