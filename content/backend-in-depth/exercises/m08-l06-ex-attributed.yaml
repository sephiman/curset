variants:
- id: m08-l06-qa01
  prompt:
    en: According to Martin Fowler in CQRS, which statement about the models in CQRS does the article make?
  options:
  - id: a
    text:
      en: The command and query models must always use separate databases
  - id: b
    correct: true
    text:
      en: CQRS splits the conceptual model into separate update and display models
  - id: c
    text:
      en: Separate models remove any need to keep the models consistent
  - id: d
    text:
      en: Usually CQRS means one set of objects exposing different interfaces
  explanation:
    en: Fowler writes that the change CQRS introduces is to split the conceptual model into separate models for
      update and display. He writes that the in-memory models may share the same database, which contradicts always
      using separate databases. He writes that separate models raise questions about how hard to keep them consistent,
      which contradicts removing that need. He writes that when he hears of CQRS the models are usually clearly
      separate, which contradicts one set of objects with different interfaces.
  citation: fowler-cqrs#banner
- id: m08-l06-qa02
  prompt:
    en: According to Martin Fowler in CQRS, which statement about when to use CQRS does the article make?
  options:
  - id: a
    correct: true
    text:
      en: Use it on specific portions of a system, not on the system as a whole
  - id: b
    text:
      en: Most domains gain from it because the command and query sides barely overlap
  - id: c
    text:
      en: A domain unsuited to it with demanding queries should still adopt it
  - id: d
    text:
      en: Most of the cases the author has met were successful uses of it
  explanation:
    en: Fowler writes that CQRS should only be used on specific portions of a system, a bounded context, and not
      on the system as a whole. He writes that there is usually enough overlap between the command and query sides
      that sharing a model is easier, which contradicts most domains gaining from it. He writes that a domain unsuited
      to CQRS with demanding queries can still use a reporting database, which contradicts adopting CQRS there.
      He writes that the majority of the cases he has run into have not been so good, which contradicts most being
      successful.
  citation: fowler-cqrs#WhenToUseIt
- id: m08-l06-qa03
  prompt:
    en: According to Martin Fowler in CQRS, which statement about the benefits of CQRS in high performance applications
      does the article make?
  options:
  - id: a
    text:
      en: It pays off mainly when reads and writes are roughly balanced
  - id: b
    text:
      en: It requires the same optimization strategy on the read and update sides
  - id: c
    text:
      en: It adds no complexity when the domain does not match it
  - id: d
    correct: true
    text:
      en: It separates read load from write load so each can scale independently
  explanation:
    en: Fowler writes that CQRS allows you to separate the load from reads and writes so you can scale each independently.
      He writes that a big disparity between reads and writes makes this very handy, which contradicts a benefit
      mainly for balanced loads. He writes that you can apply different optimization strategies to the two sides,
      which contradicts requiring the same strategy. He writes that using CQRS on a domain that does not match it
      will add complexity, which contradicts adding none.
  citation: fowler-cqrs#WhenToUseIt
- id: m08-l06-qa04
  prompt:
    en: According to Martin Fowler in Event Sourcing, which statement about reversing events in Event Sourcing does
      the article make?
  options:
  - id: a
    text:
      en: Reversal is easiest when an event sets a value, like setting a balance
  - id: b
    text:
      en: Reversal is always required, since replaying cannot rebuild past state
  - id: c
    correct: true
    text:
      en: Reversal is easiest when an event is cast as a difference, like adding an amount
  - id: d
    text:
      en: Reversal is less efficient than replaying many events forward
  explanation:
    en: Fowler writes that reversal is the most straightforward when the event is cast in the form of a difference,
      such as adding an amount to an account. He writes that for an event that sets a value there is not enough
      information to recreate the past value, which contradicts setting a value as the easy case. He writes that
      all the capabilities of reversing events can instead be done by reverting to a past snapshot and replaying,
      which contradicts reversal being always required. He writes that reversing a few events can be much more efficient
      than forward play on a lot of events, which contradicts it being less efficient.
  citation: fowler-event-sourcing#ReversingEvents
- id: m08-l06-qa06
  prompt:
    en: According to Martin Fowler in Event Sourcing, which statement about code changes to an application that
      processes events does the article make?
  options:
  - id: a
    correct: true
    text:
      en: New features can be added pretty freely at any time
  - id: b
    text:
      en: A bug fix means hand-editing each affected past event
  - id: c
    text:
      en: Temporal logic stays tidy when written as conditional logic
  - id: d
    text:
      en: Reprocessing events for a bug fix leaves external gateways untouched
  explanation:
    en: Fowler writes that new features add new capabilities without invalidating earlier events and can be added
      pretty freely at any time. He writes that for a bug fix on internal state all you need to do is make the fix
      and reprocess the events, which contradicts hand-editing past events. He writes that conditional logic gets
      messy when there is much temporal logic, which contradicts it staying tidy. He writes that external gateways
      bring the complexity when reprocessing, which contradicts leaving them untouched.
  citation: fowler-event-sourcing#CodeChanges
