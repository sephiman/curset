# anchor: boe-a-2015-11719-art-50
- id: m01-l14-q066
  prompt:
    es: "Un funcionario toma posesión el miércoles 1 de julio de 2026 y presta servicios los seis meses restantes del año. ¿Cuántos días de vacaciones le corresponden en 2026?"
  options:
  - id: a
    correct: true
    text:
      es: "Once días hábiles, la parte proporcional de veintidós."
  - id: b
    text:
      es: "Quince días hábiles, el mínimo del periodo anual."
  - id: c
    text:
      es: "Veintidós días hábiles, por año natural de servicio."
  - id: d
    text:
      es: "Once días naturales, la parte proporcional de veintidós."
  explanation:
    es: "El artículo 50.1 da veintidós días hábiles «o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor». Con medio año de servicio corresponden once días, y siguen siendo hábiles. Los veintidós días son el año completo. No hay un mínimo de quince días."
  citation: "art. 50.1 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimocuarta
- id: m01-l14-q068
  prompt:
    es: "¿Cuál de las siguientes medidas puede establecer cada Administración Pública, en función del tiempo de servicios prestados, según la disposición adicional decimocuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Hasta un máximo de seis días adicionales de vacaciones."
  - id: b
    text:
      es: "Hasta un máximo de dos días adicionales de vacaciones."
  - id: c
    correct: true
    text:
      es: "Hasta un máximo de cuatro días adicionales de vacaciones."
  - id: d
    text:
      es: "Un día adicional de vacaciones por cada trienio cumplido."
  explanation:
    es: "La disposición permite «hasta un máximo de cuatro días adicionales de vacaciones en función del tiempo de servicios prestados». No son dos ni seis. Un día por trienio no es la regla: la referencia a los trienios está en la disposición decimotercera, la de asuntos particulares."
  citation: "disposición adicional decimocuarta TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2026-8287-apartado-9
- id: m01-l14-q069
  prompt:
    es: "De acuerdo con el apartado 9.1 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, ¿con cuántos años de servicio se alcanzan veintiséis días hábiles de vacaciones?"
  options:
  - id: a
    text:
      es: "Con veinticinco o más años de servicio."
  - id: b
    text:
      es: "Con treinta y cinco o más años de servicio."
  - id: c
    correct: true
    text:
      es: "Con treinta o más años de servicio."
  - id: d
    text:
      es: "Con veintiocho o más años de servicio."
  explanation:
    es: "El apartado 9.1 da «treinta o más años de servicio: veintiséis días hábiles». Con veinticinco años corresponden veinticinco días. Veintiocho y treinta y cinco años no son tramos del apartado."
  citation: "apartado 9.1 Resolución de 14-04-2026"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-50
- id: m01-l14-q070
  prompt:
    es: "¿Cuál de las siguientes situaciones permite, según el artículo 50.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, disfrutar las vacaciones después de terminado el año natural?"
  options:
  - id: a
    text:
      es: "Una comisión de servicios en otra localidad durante el último trimestre."
  - id: b
    text:
      es: "Un permiso por matrimonio que coincide con las fechas previstas de vacaciones."
  - id: c
    text:
      es: "Un permiso parental no retribuido que coincide con las vacaciones previstas."
  - id: d
    correct: true
    text:
      es: "Una incapacidad temporal que impide iniciar las vacaciones dentro del año."
  explanation:
    es: "El artículo 50.2 enumera el permiso de maternidad, la incapacidad temporal, el riesgo durante la lactancia y el riesgo durante el embarazo. La incapacidad temporal está en la lista. El permiso por matrimonio, el permiso parental y la comisión de servicios no están."
  citation: "art. 50.2 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-50
- id: m01-l14-q071
  prompt:
    es: "Según el artículo 50.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las vacaciones que un riesgo durante el embarazo impidió iniciar pueden disfrutarse siempre que no hayan transcurrido más de dieciocho meses desde:"
  options:
  - id: a
    text:
      es: "El inicio de la situación que impidió disfrutarlas."
  - id: b
    correct: true
    text:
      es: "El final del año en que se originaron."
  - id: c
    text:
      es: "La fecha en que se solicitaron las vacaciones."
  - id: d
    text:
      es: "El fin de la situación que impidió disfrutarlas."
  explanation:
    es: "El artículo 50.2 cuenta los dieciocho meses «a partir del final del año en que se hayan originado». No se cuentan desde el fin ni desde el inicio de la situación. Tampoco desde la solicitud de las vacaciones."
  citation: "art. 50.2 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-52
- id: m01-l14-q078
  prompt:
    es: "De acuerdo con el artículo 52 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos deberán desempeñar con diligencia las tareas que tengan asignadas y:"
  options:
  - id: a
    text:
      es: "Velar por los intereses de la unidad en que estén destinados con sujeción a las instrucciones de sus superiores jerárquicos."
  - id: b
    text:
      es: "Velar por los intereses del Departamento en que presten servicios con sujeción a su relación de puestos de trabajo."
  - id: c
    text:
      es: "Velar por los intereses de los ciudadanos de su ámbito territorial con sujeción a los acuerdos de su Administración."
  - id: d
    correct: true
    text:
      es: "Velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico."
  explanation:
    es: "El artículo 52 obliga a «velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico». El interés que se protege es el general, no el de la unidad, el del Departamento ni el de los ciudadanos de un territorio. La sujeción es a la Constitución y al ordenamiento, no a las instrucciones de los superiores, a la relación de puestos ni a los acuerdos de una Administración."
  citation: "art. 52 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-52
- id: m01-l14-q079
  prompt:
    es: "¿Cuáles de los siguientes son principios con arreglo a los cuales deben actuar los empleados públicos, según el artículo 52 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de objetividad, integridad, neutralidad e imparcialidad."
  - id: b
    text:
      es: "Los de jerarquía, descentralización, desconcentración y coordinación."
  - id: c
    text:
      es: "Los de subsidiariedad, proporcionalidad, cooperación y planificación."
  - id: d
    text:
      es: "Los de autonomía, suficiencia financiera, solidaridad y coordinación."
  explanation:
    es: "El artículo 52 enumera, entre otros, los principios de «objetividad, integridad, neutralidad, responsabilidad, imparcialidad». Jerarquía, descentralización, desconcentración y coordinación son principios de actuación de la Administración, no de la conducta del empleado. Subsidiariedad, proporcionalidad, cooperación y planificación, y autonomía, suficiencia financiera y solidaridad, no figuran en la lista del artículo 52."
  citation: "art. 52 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-52
- id: m01-l14-q080
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué inspiran los principios de objetividad, integridad, neutralidad e imparcialidad con arreglo a los cuales actúan los empleados públicos?"
  options:
  - id: a
    text:
      es: "Las cartas de servicios de los órganos administrativos."
  - id: b
    text:
      es: "Los criterios de valoración de los concursos de provisión."
  - id: c
    text:
      es: "Los planes de igualdad de cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "El Código de Conducta de los empleados públicos."
  explanation:
    es: "Según el artículo 52, esos principios «inspiran el Código de Conducta de los empleados públicos», configurado por los principios éticos y de conducta de los artículos 53 y 54. El precepto no los vincula a las cartas de servicios, a los criterios de valoración de los concursos ni a los planes de igualdad."
  citation: "art. 52 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-53
- id: m01-l14-q081
  prompt:
    es: "De acuerdo con el artículo 53.7 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos no aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada por parte de:"
  options:
  - id: a
    text:
      es: "Solo las entidades privadas que contraten con su Administración."
  - id: b
    text:
      es: "Solo las personas físicas interesadas en un procedimiento a su cargo."
  - id: c
    correct: true
    text:
      es: "Las personas físicas o las entidades privadas."
  - id: d
    text:
      es: "Solo otras Administraciones Públicas y sus entidades dependientes."
  explanation:
    es: "El artículo 53.7 dice: «No aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada, por parte de personas físicas o entidades privadas». La regla alcanza a cualquier persona física o entidad privada. Limitarla a los contratistas o a los interesados en un procedimiento la recorta. Las Administraciones Públicas no son personas físicas ni entidades privadas."
  citation: "art. 53.7 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m01-l14-q082
  prompt:
    es: "De acuerdo con el artículo 54.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el desempeño de las tareas correspondientes al puesto de trabajo se realizará:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma diligente y cumpliendo la jornada y el horario establecidos."
  - id: b
    text:
      es: "De forma diligente y cumpliendo los objetivos anuales fijados para la unidad."
  - id: c
    text:
      es: "De forma diligente, con la jornada y el horario que se acuerden con el superior."
  - id: d
    text:
      es: "Con plena dedicación, sin sujeción a una jornada ni a un horario determinados."
  explanation:
    es: "El artículo 54.2 dice que el desempeño se realizará «de forma diligente y cumpliendo la jornada y el horario establecidos». El precepto habla de la jornada y el horario establecidos, no de objetivos anuales de la unidad ni de un horario pactado con el superior. La dedicación sin jornada ni horario contradice el texto."
  citation: "art. 54.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m01-l14-q083
  prompt:
    es: "De acuerdo con el artículo 54.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos obedecerán las instrucciones y órdenes profesionales de los superiores:"
  options:
  - id: a
    text:
      es: "Salvo que las consideren contrarias a su criterio técnico o profesional debidamente fundado."
  - id: b
    correct: true
    text:
      es: "Salvo que constituyan una infracción manifiesta del ordenamiento jurídico."
  - id: c
    text:
      es: "Salvo que no se les comuniquen por escrito y de forma motivada."
  - id: d
    text:
      es: "Salvo que constituyan una infracción leve del ordenamiento jurídico."
  explanation:
    es: "El artículo 54.3 dice: «Obedecerán las instrucciones y órdenes profesionales de los superiores, salvo que constituyan una infracción manifiesta del ordenamiento jurídico». La única excepción es la infracción manifiesta. El desacuerdo técnico y la falta de forma escrita no eximen de obedecer. La infracción «leve» cambia el criterio del precepto, que atiende a que la infracción sea manifiesta."
  citation: "art. 54.3 TREBEP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-54
- id: m01-l14-q085
  prompt:
    es: "De acuerdo con el artículo 54.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos administrarán los recursos y bienes públicos:"
  options:
  - id: a
    text:
      es: "Con eficiencia, y podrán usarlos en provecho propio si lo autoriza su superior."
  - id: b
    text:
      es: "Con austeridad, y solo los usarán en provecho propio fuera de la jornada de trabajo."
  - id: c
    correct: true
    text:
      es: "Con austeridad, y no los utilizarán en provecho propio o de personas allegadas."
  - id: d
    text:
      es: "Con economía, y podrán cederlos a personas allegadas sin coste para la Administración."
  explanation:
    es: "El artículo 54.5 dice: «Administrarán los recursos y bienes públicos con austeridad, y no utilizarán los mismos en provecho propio o de personas allegadas». La prohibición del provecho propio no admite autorización del superior ni excepción fuera de la jornada. La cesión a personas allegadas es justo lo que el precepto prohíbe."
  citation: "art. 54.5 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m01-l14-q087
  prompt:
    es: "De acuerdo con el artículo 54.8 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en cuanto a su formación, los empleados públicos:"
  options:
  - id: a
    text:
      es: "Realizarán cada año las acciones formativas que fije su Departamento."
  - id: b
    text:
      es: "Seguirán la formación que la Administración les ofrezca en horario de trabajo."
  - id: c
    correct: true
    text:
      es: "Mantendrán actualizada su formación y cualificación."
  - id: d
    text:
      es: "Mantendrán actualizada su formación cuando lo exija el puesto que desempeñen."
  explanation:
    es: "El artículo 54.8 dice: «Mantendrán actualizada su formación y cualificación». El deber es permanente y propio del empleado. No depende de que el Departamento fije acciones anuales, de que la formación se ofrezca en horario de trabajo ni de que la exija el puesto."
  citation: "art. 54.8 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
