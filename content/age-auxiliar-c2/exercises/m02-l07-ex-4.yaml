# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q079
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ruta del menú contextual de un archivo crea una carpeta comprimida en zip?"
  options:
  - id: a
    text:
      es: "Extraer todo..."
  - id: b
    correct: true
    text:
      es: "Mostrar más opciones › Enviar a › Carpeta comprimida (en zip)"
  - id: c
    text:
      es: "Abrir con › Elegir otra aplicación"
  - id: d
    text:
      es: "Mostrar más opciones › Conceder acceso a › Personas específicas"
  explanation:
    es: "La página de compresión indica que se hace clic con el botón derecho en el archivo o carpeta y se selecciona «Mostrar más opciones>Enviar a>carpeta comprimida (en zip)». Extraer todo... hace lo contrario: descomprime el contenido de una carpeta comprimida. Abrir con › Elegir otra aplicación sirve para elegir con qué aplicación se abre el archivo, y Conceder acceso a › Personas específicas sirve para compartirlo en la red local."
  citation: "fuente: `ms-win-comprimir.html`; «Para comprimir (comprimir)»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q080
  prompt:
    es: "En Windows 11, al seleccionar Mostrar más opciones › Enviar a › Carpeta comprimida (en zip) sobre un archivo, la nueva carpeta comprimida se crea:"
  options:
  - id: a
    correct: true
    text:
      es: "Con el mismo nombre y en la misma ubicación que el archivo."
  - id: b
    text:
      es: "Con el mismo nombre, pero en la carpeta Documentos del usuario."
  - id: c
    text:
      es: "Con el nombre que pide Windows, en la misma ubicación del archivo."
  - id: d
    text:
      es: "Con el mismo nombre, pero en la carpeta Descargas del usuario."
  explanation:
    es: "La página dice: «Se crea una nueva carpeta comprimida con el mismo nombre en la misma ubicación». Si se quiere otro nombre, se cambia después con Cambiar nombre; Windows no lo pide al crearla. Tampoco la guarda en Documentos ni en Descargas."
  citation: "fuente: `ms-win-comprimir.html`; «Para comprimir (comprimir)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q081
  prompt:
    es: "En Windows 11, ¿qué opción del menú contextual de una carpeta comprimida descomprime todo su contenido?"
  options:
  - id: a
    text:
      es: "Compartir"
  - id: b
    correct: true
    text:
      es: "Extraer todo..."
  - id: c
    text:
      es: "Enviar a"
  - id: d
    text:
      es: "Cambiar nombre"
  explanation:
    es: "La página de compresión indica que, para descomprimir todo el contenido, se hace clic con el botón derecho en la carpeta comprimida y se selecciona «Extraer todo...». Enviar a lleva a destinos como Carpeta comprimida (en zip), que comprime; Cambiar nombre cambia el nombre de la carpeta y Compartir la comparte."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q082
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes formas descomprime un solo archivo de una carpeta comprimida, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir la carpeta comprimida y arrastrar el archivo a otra ubicación."
  - id: b
    text:
      es: "Seleccionar el archivo dentro de la carpeta comprimida y pulsar la tecla F2."
  - id: c
    text:
      es: "Abrir la carpeta comprimida y pulsar Mayús+Supr sobre el archivo."
  - id: d
    text:
      es: "Cambiar la extensión de la carpeta comprimida por la del archivo."
  explanation:
    es: "La página indica que, para descomprimir un solo archivo o carpeta, se abre la carpeta comprimida y se arrastra el elemento «desde la carpeta comprimida a una nueva ubicación». F2 cambia el nombre del elemento seleccionado; Mayús+Supr lo elimina sin moverlo a la Papelera, y cambiar una extensión no convierte ni extrae nada."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q083
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre añadir archivos cifrados a una carpeta comprimida en Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Quedan cifrados con la contraseña de la cuenta del usuario al descomprimirlos."
  - id: b
    correct: true
    text:
      es: "Quedan sin cifrar al descomprimirlos, por lo que se recomienda no comprimirlos."
  - id: c
    text:
      es: "Siguen cifrados al descomprimirlos, porque la carpeta comprimida conserva el cifrado."
  - id: d
    text:
      es: "No se pueden añadir a una carpeta comprimida, porque Windows lo impide siempre."
  explanation:
    es: "La nota de la página dice: «Si agregas archivos cifrados a una carpeta comprimida, estarán sin cifrar cuando se descompriman», y recomienda no comprimir archivos cifrados. Quedar cifrados con la contraseña de la cuenta y seguir cifrados porque la carpeta conserva el cifrado contradicen «sin cifrar». Y que Windows lo impida siempre contradice «si agregas archivos cifrados», que supone que se pueden añadir y advierte de la consecuencia."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q084
  prompt:
    es: "En Windows 11, si se comprimen varias imágenes JPEG en una carpeta comprimida, ¿qué tamaño total tendrá la carpeta, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Aproximadamente la mitad que la colección original"
  - id: b
    correct: true
    text:
      es: "Aproximadamente el mismo que la colección original"
  - id: c
    text:
      es: "Aproximadamente el doble que la colección original"
  - id: d
    text:
      es: "Aproximadamente la décima parte de la colección original"
  explanation:
    es: "La página explica que las imágenes JPEG ya están muy comprimidas y que, si se comprimen varias en una carpeta, «el tamaño total de la carpeta será aproximadamente el mismo que la colección original de imágenes». No baja a la mitad ni a la décima parte, ni sube al doble."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "cantidad"
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q085
  prompt:
    es: "En Windows 11, ¿cómo se agregan archivos o carpetas a una carpeta comprimida que se creó anteriormente, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Cambiando su extensión de nombre de archivo a zip"
  - id: b
    correct: true
    text:
      es: "Arrastrándolos hasta la carpeta comprimida"
  - id: c
    text:
      es: "Pulsando Ctrl+Mayús+N dentro de la carpeta comprimida"
  - id: d
    text:
      es: "Seleccionando Extraer todo... en la carpeta comprimida"
  explanation:
    es: "La nota de la página dice: «Para agregar archivos o carpetas a una carpeta que creaste anteriormente, arrástralos a la carpeta comprimida». Extraer todo... descomprime el contenido; cambiar la extensión no convierte el archivo a otro formato, según la página de extensiones, y Ctrl+Mayús+N crea una carpeta nueva."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q086
  prompt:
    es: "Según la ayuda de Microsoft sobre comprimir y descomprimir archivos, ¿cuál de los siguientes grupos de formatos admite Windows 11, versión 24H2?"
  options:
  - id: a
    text:
      es: "ZIP y RAR solamente"
  - id: b
    correct: true
    text:
      es: "ZIP, RAR, 7z y TAR"
  - id: c
    text:
      es: "ZIP, 7z y TAR solamente"
  - id: d
    text:
      es: "ZIP solamente"
  explanation:
    es: "La página de preguntas frecuentes dice que «Windows 11, versión 24H2 admite ZIP, RAR» y los formatos de archivo 7z y TAR. Los demás grupos dejan fuera alguno de esos cuatro. La misma página añade que la versión 24H2 no admite operaciones en archivos comprimidos cifrados."
  citation: "fuente: `ms-win-comprimir.html`; «Preguntas frecuentes»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-comprimir-html
- id: m02-l07-q087
  prompt:
    es: "¿Cuál de las siguientes es una ventaja de los archivos comprimidos en Windows 11, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Quedan cifrados y protegidos frente a cualquier acceso no autorizado."
  - id: b
    correct: true
    text:
      es: "Ocupan menos espacio y se transfieren a otros equipos más rápido."
  - id: c
    text:
      es: "Impiden abrir su contenido hasta extraerlo con Extraer todo..."
  - id: d
    text:
      es: "Agrupan los archivos sin cambiar el tamaño total que ocupan."
  explanation:
    es: "La página dice: «Los archivos comprimidos ocupan menos espacio de almacenamiento y se pueden transferir a otros equipos más rápidamente que los archivos sin comprimir». No cifran el contenido: la misma página avisa de que los archivos cifrados quedan sin cifrar al descomprimirlos. Tampoco agrupan sin reducir el tamaño, porque la página dice que lo reducen, ni impiden trabajar con su contenido: «se trabaja con las carpetas y archivos comprimidos de la misma manera que con los que están sin comprimir»."
  citation: "fuente: `ms-win-comprimir.html`; «Comprimir y descomprimir archivos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m02-l07-q088
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos del menú contextual de la Papelera de reciclaje devuelve los archivos seleccionados a su carpeta original?"
  options:
  - id: a
    correct: true
    text:
      es: "Restaurar"
  - id: b
    text:
      es: "Extraer todo..."
  - id: c
    text:
      es: "Anclar a acceso rápido"
  - id: d
    text:
      es: "Conceder acceso a"
  explanation:
    es: "La página indica que se abre la Papelera de reciclaje, se seleccionan los archivos, se hace clic con el botón derecho y se selecciona «Restaurar»; el archivo o la carpeta se restaura a su carpeta original. «Extraer todo...» descomprime una carpeta comprimida. «Anclar a acceso rápido» fija una carpeta en Acceso rápido. «Conceder acceso a» comparte en la red."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m02-l07-q092
  prompt:
    es: "Señale la afirmación correcta sobre la restauración de archivos eliminados de OneDrive, según la ayuda de Microsoft para Windows:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo se restauran archivos del propio OneDrive, no los que otra persona ha compartido"
  - id: b
    text:
      es: "También se restauran los archivos que otra persona ha compartido con el usuario"
  - id: c
    text:
      es: "Se restauran aunque se hayan eliminado permanentemente de la papelera de reciclaje de OneDrive"
  - id: d
    text:
      es: "Con una cuenta personal se restauran los eliminados en los últimos 93 días"
  explanation:
    es: "La página dice que solo se pueden restaurar archivos o carpetas del propio OneDrive, no archivos que otra persona haya compartido. También dice que no se pueden restaurar después de eliminarlos permanentemente de la papelera de reciclaje de OneDrive, y que con una cuenta personal el plazo es de 30 días; 93 días es el de las cuentas profesionales o educativas."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos eliminados de su OneDrive»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win-directivas-explorador-html
- id: m02-l07-q093
  prompt:
    es: "En Windows 11, con la directiva «No mover archivos eliminados a la papelera de reciclaje» habilitada, ¿qué ocurre con los archivos que se eliminan en el Explorador de archivos?"
  options:
  - id: a
    text:
      es: "Van a la Papelera de reciclaje tras aceptar un cuadro de diálogo de confirmación"
  - id: b
    correct: true
    text:
      es: "No van a la Papelera de reciclaje y se eliminan permanentemente"
  - id: c
    text:
      es: "Van a la Papelera de reciclaje hasta llenar su tamaño máximo"
  - id: d
    text:
      es: "Van a la papelera de reciclaje web de OneDrive en la nube"
  explanation:
    es: "La directiva dice que, si se habilita, los archivos y carpetas que se eliminan mediante el Explorador de archivos no se colocan en la Papelera de reciclaje y, por tanto, se eliminan permanentemente. El cuadro de confirmación es otra directiva, «Mostrar cuadro de diálogo de confirmación al eliminar archivos». El tamaño máximo lo fija «Tamaño máximo permitido de la papelera de reciclaje». La directiva no envía nada a OneDrive."
  citation: "fuente: `ms-win-directivas-explorador.html`; «No mover archivos eliminados a la papelera de reciclaje»"
  difficulty: 1
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-directivas-explorador-html
- id: m02-l07-q094
  prompt:
    es: "En Windows 11, si la directiva «No mover archivos eliminados a la papelera de reciclaje» está deshabilitada o no se ha establecido, ¿cuál de los siguientes es el comportamiento al eliminar en el Explorador de archivos?"
  options:
  - id: a
    text:
      es: "Los archivos y carpetas eliminados se eliminan siempre permanentemente"
  - id: b
    correct: true
    text:
      es: "Los archivos y carpetas eliminados se colocan en la Papelera de reciclaje"
  - id: c
    text:
      es: "Los archivos y carpetas eliminados se mueven al Historial de archivos de la unidad externa"
  - id: d
    text:
      es: "Los archivos y carpetas eliminados piden confirmación antes de borrarse"
  explanation:
    es: "La directiva dice que, si se deshabilita o no se establece, los archivos y carpetas eliminados mediante el Explorador de archivos se colocan en la Papelera de reciclaje. La eliminación permanente es el efecto de habilitarla. El Historial de archivos copia bibliotecas en una unidad externa; no recibe lo eliminado. El cuadro de confirmación depende de otra directiva y, si no se configura, no se muestra."
  citation: "fuente: `ms-win-directivas-explorador.html`; «No mover archivos eliminados a la papelera de reciclaje»"
  difficulty: 2
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q245
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Ctrl+D con un elemento seleccionado, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Selecciona la barra de direcciones para escribir una ruta"
  - id: b
    text:
      es: "Crea una carpeta nueva con el nombre del elemento"
  - id: c
    correct: true
    text:
      es: "Lo elimina y lo mueve a la Papelera de reciclaje"
  - id: d
    text:
      es: "Lo elimina de forma permanente, sin pasar por la Papelera"
  explanation:
    es: "Ctrl+D, igual que Supr, elimina el elemento y lo mueve a la Papelera de reciclaje. La eliminación permanente es Mayús+Supr, la barra de direcciones se selecciona con Alt+D y la carpeta nueva se crea con Ctrl+Mayús+N."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q246
  prompt:
    es: "En el Explorador de archivos de Windows 11, al arrastrar un archivo con el ratón y la tecla Mayús pulsada, ¿qué ocurre al soltarlo, según Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Se mueve a esa ubicación"
  - id: b
    text:
      es: "Se copia en esa ubicación"
  - id: c
    text:
      es: "Se crea un acceso directo al original en esa ubicación"
  - id: d
    text:
      es: "Se comprime en una carpeta zip en esa ubicación"
  explanation:
    es: "Con Mayús pulsada, al soltar el archivo se mueve. Con Ctrl se copia, con Alt se crea un acceso directo al original y comprimir en zip es la opción Enviar a › Carpeta comprimida."
  citation: "fuente: `ms-win-atajos.html`; «Mayús+arrastrar un archivo con el mouse — Cuando suelte el archivo, muévalo a esa ubicación.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q255
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al arrastrar un archivo con el ratón manteniendo pulsada la tecla Alt, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Al soltarlo se crea una copia en esa ubicación, igual que con Ctrl"
  - id: b
    text:
      es: "Al soltarlo se mueve a esa ubicación sin dejar copia en la de origen, igual que con Mayús"
  - id: c
    text:
      es: "Al soltarlo se abre con la aplicación asociada a su extensión en esa ubicación"
  - id: d
    correct: true
    text:
      es: "Al soltarlo se crea un acceso directo al archivo original en esa ubicación"
  explanation:
    es: "Con Alt pulsada, al soltar se crea un acceso directo al original. Mover es Mayús, copiar es Ctrl, y abrir con la aplicación asociada no es una acción de arrastrar."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "comportamiento"
