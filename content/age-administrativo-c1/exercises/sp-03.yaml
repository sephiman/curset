# anchor: boe-a-2015-10565-art-126
- id: q42
  lesson: m03-l03
  prompt:
    es: "Según el artículo 126.3 de la Ley 39/2015, de 1 de octubre, si Doña Noelia Barrantes Cifuentes interpone el recurso extraordinario de revisión el lunes, 12 de julio de 2027, ¿hasta qué fecha puede el INAP dictar y notificar la resolución sin que el recurso se entienda desestimado?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 11 de octubre de 2027."
  - id: b
    text:
      es: "Hasta el martes, 12 de octubre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el miércoles, 13 de octubre de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 13 de septiembre de 2027."
  explanation:
    es: "Transcurridos tres meses desde la interposición del recurso extraordinario de revisión sin haberse dictado y notificado la resolución, se entiende desestimado (art. 126.3 LPAC). Los meses se cuentan desde el día siguiente y acaban el mismo día del mes de vencimiento (art. 30.4 LPAC): desde el lunes, 12 de julio de 2027, el plazo acaba el martes, 12 de octubre de 2027, festivo. El último día inhábil pasa al primer día hábil siguiente, el miércoles, 13 de octubre de 2027 (art. 30.5 LPAC). El martes, 12 de octubre de 2027, no traslada el último día inhábil. El lunes, 11 de octubre de 2027, cuenta noventa días naturales, que acaban el domingo, 10 de octubre de 2027, y pasan al lunes. El lunes, 13 de septiembre de 2027, aplica dos meses, que acaban el domingo, 12 de septiembre de 2027, y pasan al lunes."
  citation: "art. 126.3 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-44
- id: q26
  lesson: m03-l04
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cabe recurso especial en materia de contratación contra la adjudicación del contrato de servicios de formación en línea que quiere interponer la licitadora excluida?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque el valor estimado de un contrato de servicios supera los cien mil euros."
  - id: b
    text:
      es: "No, porque el valor estimado no alcanza el umbral de 140.000 euros de la regulación armonizada."
  - id: c
    text:
      es: "No, porque contra la adjudicación del procedimiento abierto simplificado solo cabe recurso de alzada."
  - id: d
    text:
      es: "Sí, pero solo si el valor estimado supera los 216.000 euros de los demás entes del sector público."
  explanation:
    es: "El recurso especial cabe contra los actos de adjudicación de los contratos de servicios con un valor estimado superior a cien mil euros. El contrato de formación en línea tiene un valor estimado de 138.000 euros. El umbral de 140.000 euros es el de la regulación armonizada y no condiciona el recurso especial. Contra los actos que admiten recurso especial no proceden la alzada ni la reposición. Los 216.000 euros son el umbral de regulación armonizada de los demás entes del sector público, y no el del recurso especial."
  citation: "art. 44.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2017-12902-art-159
- id: q27
  lesson: m03-l04
  prompt:
    es: "Según el artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es la fecha más temprana en que puede terminar el plazo de presentación de proposiciones para la compra de los portátiles?"
  options:
  - id: a
    text:
      es: "El jueves, 14 de octubre de 2027."
  - id: b
    text:
      es: "El viernes, 22 de octubre de 2027."
  - id: c
    text:
      es: "El miércoles, 13 de octubre de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes, 15 de octubre de 2027."
  explanation:
    es: "La tramitación del artículo 159.6 fija para las proposiciones diez días hábiles desde el siguiente a la publicación del anuncio, y cinco en las compras corrientes de bienes disponibles en el mercado. Los portátiles de uso corriente valen 54.000 euros, menos de 60.000. Anunciada la compra el jueves, 7 de octubre de 2027, los cinco días hábiles son el viernes 8, el lunes 11, el miércoles 13, el jueves 14 y el viernes 15 de octubre, porque el martes 12 es festivo. El jueves, 14 de octubre de 2027, cuenta el 12 de octubre como hábil. El viernes, 22 de octubre de 2027, aplica los diez días hábiles de la regla general. El miércoles, 13 de octubre de 2027, cuenta cinco días naturales."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-193
- id: q28
  lesson: m03-l04
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el importe de las penalidades diarias que acumula la empresa adjudicataria de los portátiles por su demora en la entrega es de:"
  options:
  - id: a
    text:
      es: "Un total de 726 euros."
  - id: b
    correct: true
    text:
      es: "Un total de 600 euros."
  - id: c
    text:
      es: "Un total de 648 euros."
  - id: d
    text:
      es: "Un total de 6.000 euros."
  explanation:
    es: "Por la demora en el plazo total, imputable al contratista, la Administración puede imponer penalidades diarias de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido. El precio es de 50.000 euros, y 0,60 por 50 son 30 euros al día. En 20 días suman 600 euros. La cifra de 726 euros parte del precio con IVA, 60.500 euros. La de 648 euros toma el valor estimado de 54.000 euros y no el precio. La de 6.000 euros aplica 0,60 euros por cada 100 euros."
  citation: "art. 193.3 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2017-12902-art-159
- id: q29
  lesson: m03-l04
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿debe la empresa adjudicataria de la compra de los portátiles constituir garantía definitiva para responder de la ejecución del contrato?"
  options:
  - id: a
    text:
      es: "Sí, por el 5 % del precio final ofertado, IVA excluido, en siete días hábiles desde la comunicación."
  - id: b
    text:
      es: "Sí, por el 3 % del presupuesto base de licitación, IVA excluido, antes de formalizar el contrato."
  - id: c
    correct: true
    text:
      es: "No, porque en esta tramitación del procedimiento abierto simplificado no se requiere garantía definitiva."
  - id: d
    text:
      es: "Sí, pero solo si el pliego la exige de forma motivada."
  explanation:
    es: "En la tramitación del artículo 159.6, la letra f) dispone que no se requerirá la constitución de garantía definitiva. El INAP compra los portátiles con esa tramitación, por un valor estimado de 54.000 euros. El 5 % del precio final ofertado, en siete días hábiles desde la comunicación, es la regla del procedimiento abierto simplificado ordinario. El 3 % del presupuesto base de licitación es la penalidad por no formalizar el contrato por causa del adjudicatario, no una garantía. El pliego no tiene que exigirla ni eximirla, porque la tramitación especial la excluye."
  citation: "art. 159.6.f) LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-155
- id: q30
  lesson: m05-l03
  prompt:
    es: "Según el artículo 155 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién conoce de la discrepancia que plantea la Directora del INAP contra el reparo formulado al expediente de la compra de los portátiles?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, que adopta la resolución definitiva del reparo."
  - id: b
    text:
      es: "El Ministro de Hacienda, a propuesta de la Subsecretaría del Ministerio al que está adscrito el INAP."
  - id: c
    text:
      es: "La Subsecretaría del Ministerio al que está adscrito el INAP, por conducto de la Directora."
  - id: d
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado, cuya resolución es obligatoria para la Intervención Delegada."
  explanation:
    es: "El órgano gestor que no acepta el reparo plantea una discrepancia motivada a la Intervención General de la Administración del Estado, en los organismos por conducto de su Director. Si el reparo lo formuló una intervención delegada, la Intervención General de la Administración del Estado la resuelve y su resolución obliga a aquella. Aquí el reparo es de la Intervención Delegada. El Consejo de Ministros decide solo cuando el reparo viene de la Intervención General de la Administración del Estado o esta confirmó el de otra. La Subsecretaría del Ministerio canaliza la discrepancia solo en los ministerios, y el INAP es un organismo autónomo. El Ministro de Hacienda no resuelve este trámite."
  citation: "art. 155.a) LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-156
- id: q31
  lesson: m05-l03
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede el INAP reconocer la obligación de pago derivada de la factura del contrato de videoconferencia que acaba de recibir?"
  options:
  - id: a
    correct: true
    text:
      es: "No, hasta que se subsane la omisión de la función interventora."
  - id: b
    text:
      es: "Sí, porque la Directora aprueba y reconoce las obligaciones económicas del organismo."
  - id: c
    text:
      es: "Sí, siempre que la prestación se haya ejecutado conforme al contrato."
  - id: d
    text:
      es: "No, y el contrato queda anulado de pleno derecho por la omisión."
  explanation:
    es: "Si la función interventora era preceptiva y se omitió, no se puede reconocer la obligación, ni tramitar el pago, ni intervenir favorablemente, hasta que se subsane la omisión. El INAP aprobó el contrato de videoconferencia sin la fiscalización previa preceptiva. La Directora reconoce las obligaciones del organismo, pero no antes de esa subsanación. Que la prestación se ejecutara conforme al contrato no suple la fiscalización omitida. La norma no declara anulado el contrato: exige un informe de la Intervención General de la Administración del Estado."
  citation: "art. 156.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1995-8729-art-48
- id: q32
  lesson: m04-l05
  prompt:
    es: "Según el artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, ¿hasta qué fecha debía cesar Don Esteban Calleja Roldán en su puesto del Ministerio de Hacienda, sin que se difiriera el cese?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 13 de septiembre de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles, 15 de septiembre de 2027."
  - id: c
    text:
      es: "Hasta el martes, 14 de septiembre de 2027."
  - id: d
    text:
      es: "Hasta el viernes, 8 de octubre de 2027."
  explanation:
    es: "El cese se efectúa dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el «Boletín Oficial del Estado». Publicada el viernes, 10 de septiembre de 2027, los tres días hábiles son el lunes 13, el martes 14 y el miércoles 15 de septiembre. El lunes, 13 de septiembre de 2027, cuenta tres días naturales. El martes, 14 de septiembre de 2027, cuenta el día de la publicación como primero. El viernes, 8 de octubre de 2027, aplica los veinte días hábiles del diferimiento, que no se concede."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
