# anchor: fuente-ms-office-portapapeles-copiar-html
- id: m02-l08-q284
  prompt:
    es: "En Word 365, ¿cómo se pega un único elemento concreto desde el panel de tareas Portapapeles de Office?"
  options:
  - id: a
    text:
      es: "Con un clic en Pegar todo"
  - id: b
    text:
      es: "Con la flecha junto al elemento y la opción Eliminar"
  - id: c
    correct: true
    text:
      es: "Con doble clic en el elemento que se quiere pegar"
  - id: d
    text:
      es: "Con la opción Borrar todo del panel"
  explanation:
    es: "La página dice que, para pegar elementos de uno en uno, se hace doble clic en cada elemento del panel. Pegar todo pega todos los elementos copiados a la vez. La flecha junto al elemento con la opción Eliminar borra ese elemento del Portapapeles. Borrar todo elimina todos los elementos."
  citation: "fuente: `ms-office-portapapeles-copiar.html`; «Copiar y pegar con el Portapapeles de Office»"
  difficulty: 1
  tags:
