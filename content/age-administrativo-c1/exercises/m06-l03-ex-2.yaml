# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q031
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes parejas recoge lo que hacen, respectivamente, Alt+D y Alt+Entrar?"
  options:
  - id: a
    text:
      es: "Seleccionar la barra de direcciones y mostrar el panel de detalles"
  - id: b
    text:
      es: "Ver las propiedades del elemento y seleccionar la barra de direcciones"
  - id: c
    text:
      es: "Mostrar el panel de vista previa y ver las propiedades del elemento"
  - id: d
    correct: true
    text:
      es: "Seleccionar la barra de direcciones y ver las propiedades del elemento"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones» y a Alt+Entrar «Ver las propiedades del elemento seleccionado». La pareja invertida cambia el orden; el panel de detalles se muestra u oculta con Alt+Mayús+P, y el panel de vista previa con Alt+P."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q032
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+Flecha arriba, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Se desplaza hasta la parte superior de la ventana"
  - id: b
    correct: true
    text:
      es: "Sube un nivel en la ruta de acceso de la carpeta"
  - id: c
    text:
      es: "Muestra la carpeta siguiente a la que se volvió"
  - id: d
    text:
      es: "Vuelve a la carpeta que se había abierto antes"
  explanation:
    es: "La tabla asigna a Alt+Flecha arriba «Subir un nivel en la ruta de acceso de la carpeta». Volver a la carpeta anterior es Alt+Flecha izquierda o Retroceso; ver la carpeta siguiente es Alt+Flecha derecha, y la tecla Inicio lleva a la parte superior de la ventana activa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q033
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones lleva a la carpeta anterior?"
  options:
  - id: a
    text:
      es: "Alt+Flecha arriba"
  - id: b
    text:
      es: "Alt+Flecha derecha"
  - id: c
    text:
      es: "Ctrl+Mayús+Tab"
  - id: d
    correct: true
    text:
      es: "Alt+Flecha izquierda"
  explanation:
    es: "La tabla asigna a Alt+Flecha izquierda y a Retroceso «Vaya a la carpeta anterior». Alt+Flecha arriba sube un nivel en la ruta, Alt+Flecha derecha muestra la carpeta siguiente y Ctrl+Mayús+Tab pasa a la pestaña anterior, no a la carpeta anterior."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q034
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Ctrl+Mayús+E, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Se cierra la pestaña activa o la ventana si solo hay una"
  - id: b
    text:
      es: "Se cambia el estilo de vista de la carpeta a Detalles"
  - id: c
    correct: true
    text:
      es: "Se expanden todas las carpetas del panel de navegación"
  - id: d
    text:
      es: "Se crea una carpeta nueva en la ubicación que está abierta"
  explanation:
    es: "La tabla asigna a Ctrl+Mayús+E «Expande todas las carpetas del árbol en el panel de navegación». Crear una carpeta nueva es Ctrl+Mayús+N; cerrar la pestaña activa es Ctrl+W, y la vista Detalles se pone con Ctrl+Mayús+6."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q035
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones abre una pestaña nueva y cambia a ella?"
  options:
  - id: a
    text:
      es: "Ctrl+Tab"
  - id: b
    text:
      es: "Ctrl+U"
  - id: c
    correct: true
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+W"
  explanation:
    es: "La tabla asigna a Ctrl+T «Abrir una pestaña nueva y cambiar a ella». Ctrl+W cierra la pestaña activa, Ctrl+Tab pasa a la pestaña siguiente y Ctrl+U abre una nueva ventana, no una pestaña."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q036
  prompt:
    es: "En el Explorador de archivos de Windows 11, si solo hay una pestaña abierta, la combinación Ctrl+W:"
  options:
  - id: a
    text:
      es: "No hace nada, porque solo cierra pestañas."
  - id: b
    text:
      es: "Abre una nueva ventana del Explorador."
  - id: c
    text:
      es: "Abre una pestaña nueva y cambia a ella."
  - id: d
    correct: true
    text:
      es: "Cierra la ventana del Explorador de archivos."
  explanation:
    es: "La tabla asigna a Ctrl+W «Cierra la pestaña activa. Cierra la ventana si solo hay una pestaña abierta». No queda sin efecto con una sola pestaña. Abrir una pestaña nueva es Ctrl+T y abrir una nueva ventana es Ctrl+U."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q037
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la tecla F4, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Selecciona la barra de direcciones para cambiar la ruta"
  - id: b
    text:
      es: "Actualiza el contenido de la ventana activa"
  - id: c
    text:
      es: "Cambia el nombre del elemento que está seleccionado"
  - id: d
    text:
      es: "Busca un archivo o una carpeta en la ubicación"
