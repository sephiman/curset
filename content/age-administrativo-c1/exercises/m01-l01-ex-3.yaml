# anchor: boe-a-1978-31229-art-160
- id: m01-l01-q038
  prompt:
    es: "Según el artículo 160 de la Constitución Española de 1978, el Presidente del Tribunal Constitucional será nombrado entre sus miembros por el Rey:"
  options:
  - id: a
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de nueve años."
  - id: b
    text:
      es: "A propuesta del Gobierno y por un período de tres años."
  - id: c
    correct: true
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de tres años."
  - id: d
    text:
      es: "A propuesta del Congreso de los Diputados y por un período de cinco años."
  explanation:
    es: "El artículo 160 dice que el Presidente será nombrado por el Rey «a propuesta del mismo Tribunal en pleno y por un período de tres años». Nueve años es el mandato de los Magistrados. Ni el Gobierno ni el Congreso proponen al Presidente."
  citation: "art. 160 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1979-23709-art-7
- id: m01-l01-q039
  prompt:
    es: "¿Cuántas Salas tiene el Tribunal Constitucional y cuántos Magistrados componen cada una, según la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "Dos Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: b
    text:
      es: "Tres Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: c
    text:
      es: "Cuatro Salas, compuestas cada una por tres Magistrados nombrados por el Presidente."
  - id: d
    correct: true
    text:
      es: "Dos Salas, compuestas cada una por seis Magistrados nombrados por el Tribunal en Pleno."
  explanation:
    es: "El artículo 7.1 de la LOTC dice que el Tribunal «consta de dos Salas» y que cada una «está compuesta por seis Magistrados nombrados por el Tribunal en Pleno». Las demás opciones cambian el número de Salas o de Magistrados. Las unidades de tres Magistrados son las Secciones (art. 8.1 LOTC), no las Salas."
  citation: "art. 7.1 LOTC"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1979-23709-art-76
- id: m01-l01-q040
  prompt:
    es: "Según el artículo 76 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿en qué plazo puede el Gobierno impugnar las disposiciones normativas sin fuerza de ley y resoluciones de cualquier órgano de las Comunidades Autónomas?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los dos meses siguientes a su publicación o, en defecto de esta, desde que llegue a su conocimiento."
  - id: b
    text:
      es: "Dentro de los tres meses siguientes a su publicación en el diario oficial correspondiente."
  - id: c
    text:
      es: "Dentro de los cinco meses siguientes a su publicación, sin otra forma de cómputo."
  - id: d
    text:
      es: "Dentro de los nueve meses siguientes a su publicación, previo acuerdo de la Comisión Bilateral."
  explanation:
    es: "El artículo 76 de la LOTC fija «los dos meses siguientes a la fecha de su publicación o, en defecto de la misma, desde que llegare a su conocimiento». Tres meses es el plazo general del recurso de inconstitucionalidad (art. 33.1). Cinco meses es el plazo del Tribunal para ratificar o levantar la suspensión (art. 161.2 CE). Nueve meses es el plazo especial del artículo 33.2."
  citation: "art. 76 LOTC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-162
- id: m01-l01-q041
  prompt:
    es: "¿Cuál de los siguientes está legitimado para interponer el recurso de inconstitucionalidad, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Un grupo de treinta Diputados."
  - id: b
    text:
      es: "Un grupo de veinticinco Senadores."
  - id: c
    correct: true
    text:
      es: "Un grupo de cincuenta Senadores."
  - id: d
    text:
      es: "Un grupo de cuarenta Diputados."
  explanation:
    es: "El artículo 162.1.a) legitima al Presidente del Gobierno, al Defensor del Pueblo, a 50 Diputados, a 50 Senadores y a los órganos colegiados ejecutivos y, en su caso, las Asambleas de las Comunidades Autónomas. Treinta o cuarenta Diputados y veinticinco Senadores no alcanzan la cifra de cincuenta."
  citation: "art. 162.1.a CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1979-23709-art-33
- id: m01-l01-q042
  prompt:
    es: "Conforme al artículo 33.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el recurso de inconstitucionalidad se formulará, con carácter general, dentro del plazo de:"
  options:
  - id: a
    text:
      es: "Dos meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  - id: b
    text:
      es: "Nueve meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  - id: c
    text:
      es: "Tres meses a partir de la entrada en vigor de la ley, disposición o acto con fuerza de ley impugnado."
  - id: d
    correct: true
    text:
      es: "Tres meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  explanation:
    es: "El artículo 33.1 de la LOTC fija «el plazo de tres meses a partir de la publicación de la Ley, disposición o acto con fuerza de Ley impugnado». Dos meses es el plazo del artículo 76 para las disposiciones sin fuerza de ley. Nueve meses es el plazo especial del artículo 33.2. El cómputo empieza con la publicación, no con la entrada en vigor."
  citation: "art. 33.1 LOTC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1979-23709-art-33
- id: m01-l01-q043
  prompt:
    es: "Conforme al artículo 33.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Presidente del Gobierno y los órganos colegiados ejecutivos autonómicos pueden recurrir en nueve meses cuando, para evitar el recurso:"
  options:
  - id: a
    correct: true
    text:
      es: "Se reúne la Comisión Bilateral de Cooperación y acuerda iniciar negociaciones para resolver las discrepancias."
  - id: b
    text:
      es: "Se reúne la Conferencia Sectorial competente y acuerda iniciar negociaciones para resolver las discrepancias."
  - id: c
    text:
      es: "Se reúne la Comisión General de las Comunidades Autónomas del Senado y propone una modificación del texto."
  - id: d
    text:
      es: "El Consejo de Estado emite dictamen favorable a la apertura de negociaciones entre ambas Administraciones."
  explanation:
    es: "El artículo 33.2 de la LOTC exige que se reúna «la Comisión Bilateral de Cooperación entre la Administración General del Estado y la respectiva Comunidad Autónoma» y que en ella se adopte «un acuerdo sobre iniciación de negociaciones para resolver las discrepancias». No menciona la Conferencia Sectorial, la Comisión General de las Comunidades Autónomas del Senado ni el Consejo de Estado."
  citation: "art. 33.2 LOTC"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1979-23709-art-35
- id: m01-l01-q044
  prompt:
    es: "De acuerdo con el artículo 35.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el órgano judicial solo podrá plantear la cuestión de inconstitucionalidad:"
  options:
  - id: a
    text:
      es: "En cualquier momento del procedimiento, siempre antes de la apertura del juicio oral."
  - id: b
    correct: true
    text:
      es: "Una vez concluso el procedimiento y dentro del plazo para dictar sentencia, o la resolución jurisdiccional que procediese."
  - id: c
    text:
      es: "Una vez dictada sentencia firme, dentro de los diez días siguientes a su notificación."
  - id: d
    text:
      es: "Antes de admitir a trámite la demanda, tras oír a las partes y al Ministerio Fiscal."
  explanation:
    es: "El artículo 35.2 de la LOTC dice que el órgano judicial «sólo podrá plantear la cuestión una vez concluso el procedimiento y dentro del plazo para dictar sentencia, o la resolución jurisdiccional que procediese». No puede plantearla en cualquier momento, tampoco antes de admitir la demanda, y después de la sentencia firme ya no cabe."
  citation: "art. 35.2 LOTC"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1979-23709-art-35
- id: m01-l01-q045
  prompt:
    es: "Antes de decidir si plantea la cuestión de inconstitucionalidad, ¿de qué plazo disponen las partes y el Ministerio Fiscal para alegar ante el órgano judicial?"
  options:
  - id: a
    text:
      es: "De un plazo común e improrrogable de 15 días."
  - id: b
    text:
      es: "De un plazo común y prorrogable de 10 días."
  - id: c
    text:
      es: "De un plazo sucesivo de 10 días para cada parte."
  - id: d
    correct: true
    text:
      es: "De un plazo común e improrrogable de 10 días."
  explanation:
    es: "El artículo 35.2 de la LOTC dice que el órgano judicial oirá a las partes y al Ministerio Fiscal «para que en el plazo común e improrrogable de 10 días puedan alegar». El plazo es de diez días, no de quince. Es común, no sucesivo, e improrrogable."
  citation: "art. 35.2 LOTC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1979-23709-art-44
- id: m01-l01-q046
  prompt:
    es: "Según la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿en qué plazo se interpone el recurso de amparo contra una violación de derechos con origen inmediato y directo en un acto u omisión de un órgano judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "En el de 30 días, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: b
    text:
      es: "En el de 20 días, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: c
    text:
      es: "En el de tres meses, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: d
    text:
      es: "En el de 30 días, a partir de que la resolución recaída en el proceso judicial sea firme."
  explanation:
    es: "El artículo 44.2 de la LOTC dice: «El plazo para interponer el recurso de amparo será de 30 días, a partir de la notificación de la resolución recaída en el proceso judicial». Veinte días es el plazo frente a actos del Gobierno o la Administración (art. 43.2). Tres meses es el plazo frente a actos sin valor de ley de las Cortes o las Asambleas (art. 42). El cómputo empieza con la notificación."
  citation: "art. 44.2 LOTC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-54
- id: m01-l01-q047
  prompt:
    es: "¿Cuál de las siguientes define correctamente la institución del Defensor del Pueblo, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Alto comisionado del Gobierno, designado por este para la defensa de los derechos comprendidos en el título I."
  - id: b
    correct: true
    text:
      es: "Alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos comprendidos en el título I."
  - id: c
    text:
      es: "Alto comisionado de las Cortes Generales, designado por el Rey para la defensa de los derechos fundamentales de la sección 1.ª."
  - id: d
    text:
      es: "Órgano consultivo del Congreso de los Diputados, designado por este para supervisar la actividad de los Tribunales."
  explanation:
    es: "El artículo 54 dice que una ley orgánica regulará el Defensor del Pueblo «como alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos comprendidos en este Título». No depende del Gobierno ni lo designa el Rey. Defiende todo el título I, no solo la sección 1.ª, y supervisa la Administración, no los Tribunales."
  citation: "art. 54 CE"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-1981-10325-art-2
- id: m01-l01-q048
  prompt:
    es: "De acuerdo con el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, el Defensor del Pueblo será elegido por las Cortes Generales para un periodo de:"
  options:
  - id: a
    text:
      es: "Cuatro años, y se dirigirá a ellas a través de los Presidentes del Congreso y del Senado."
  - id: b
    text:
      es: "Cinco años, y se dirigirá a ellas a través de la Mesa del Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Cinco años, y se dirigirá a ellas a través de los Presidentes del Congreso y del Senado."
  - id: d
    text:
      es: "Seis años, y se dirigirá a ellas a través del Presidente del Congreso de los Diputados."
  explanation:
    es: "El artículo 2.1 de la LO 3/1981 fija «un periodo de cinco años» y dice que el Defensor se dirigirá a las Cortes a través de los Presidentes del Congreso y del Senado. Cuatro y seis años no son el mandato. Tampoco se dirige a ellas a través de la Mesa del Congreso ni solo de su Presidente."
  citation: "art. 2.1 LO 3/1981"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1981-10325-art-2
- id: m01-l01-q049
  prompt:
    es: "Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué funciones tiene la Comisión Mixta Congreso-Senado que se designa en las Cortes Generales?"
  options:
  - id: a
    correct: true
    text:
      es: "Relacionarse con el Defensor del Pueblo e informar a los respectivos Plenos en cuantas ocasiones sea necesario."
  - id: b
    text:
      es: "Elegir al Defensor del Pueblo por mayoría de tres quintos de sus miembros."
  - id: c
    text:
      es: "Nombrar y separar a los Adjuntos del Defensor del Pueblo."
  - id: d
    text:
      es: "Tramitar las quejas que los ciudadanos dirijan a las Cortes Generales."
  explanation:
    es: "El artículo 2.2 de la LO 3/1981 crea una Comisión Mixta Congreso-Senado «encargada de relacionarse con el Defensor del Pueblo e informar a los respectivos Plenos en cuantas ocasiones sea necesario». La Comisión propone candidatos, pero eligen los Plenos (art. 2.4). Los Adjuntos los nombra y separa el Defensor (art. 8.2). Las quejas las tramita el Defensor."
  citation: "art. 2.2 LO 3/1981"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1981-10325-art-2
- id: m01-l01-q050
  prompt:
    es: "Conforme al artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, los acuerdos de la Comisión que propone a los Plenos el candidato o candidatos a Defensor del Pueblo se adoptarán por:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de la Comisión."
  - id: b
    correct: true
    text:
      es: "Mayoría simple de la Comisión."
  - id: c
    text:
      es: "Mayoría de tres quintos de la Comisión."
  - id: d
    text:
      es: "Mayoría de dos tercios de la Comisión."
  explanation:
    es: "El artículo 2.3 de la LO 3/1981 dice: «Los acuerdos de la Comisión se adoptarán por mayoría simple». Los tres quintos son la mayoría de la elección en el Pleno del Congreso y de la ratificación en el Senado (art. 2.4). La mayoría absoluta y la de dos tercios no aparecen para la Comisión."
  citation: "art. 2.3 LO 3/1981"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1981-10325-art-2
- id: m01-l01-q051
  prompt:
    es: "Según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué votación necesita el candidato propuesto en primer término para quedar designado Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de veinte días, ratificación por mayoría absoluta del Senado."
  - id: b
    text:
      es: "Mayoría absoluta del Congreso y, en un plazo máximo de veinte días, ratificación por esta misma mayoría del Senado."
  - id: c
    correct: true
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de veinte días, ratificación por esta misma mayoría del Senado."
  - id: d
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de diez días, ratificación por esta misma mayoría del Senado."
  explanation:
    es: "El artículo 2.4 de la LO 3/1981 exige «una votación favorable de las tres quintas partes de los miembros del Congreso» y, «en un plazo máximo de veinte días», la ratificación «por esta misma mayoría del Senado». La mayoría absoluta del Senado basta solo en las propuestas sucesivas del artículo 2.5. La mayoría absoluta del Congreso no es suficiente. Diez días es el término mínimo para convocar el Pleno del Congreso, no el plazo del Senado."
  citation: "art. 2.4 LO 3/1981"
  difficulty: 3
  tags:
  - "mayoría"
  - "plazo"
