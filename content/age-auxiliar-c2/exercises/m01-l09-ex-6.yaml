# anchor: boe-a-1985-5392-art-26
- id: m01-l09-q108
  prompt:
    es: "¿Cuál de las siguientes listas de servicios deben prestar todos los Municipios, en todo caso, según el artículo 26.1.a) de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "Alumbrado público, alcantarillado y parque público."
  - id: b
    correct: true
    text:
      es: "Alumbrado público, alcantarillado y acceso a los núcleos de población."
  - id: c
    text:
      es: "Cementerio, limpieza viaria y biblioteca pública."
  - id: d
    text:
      es: "Alcantarillado, limpieza viaria y protección civil."
  explanation:
    es: "El artículo 26.1.a) exige a todos los Municipios el alumbrado público, el alcantarillado y el acceso a los núcleos de población, entre otros servicios. El parque público y la biblioteca pública se exigen solo a partir de 5.000 habitantes, y la protección civil a partir de 20.000. Cada una de esas tres listas combina servicios generales con uno de un tramo superior."
  citation: "art. 26.1.a LBRL"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-26
- id: m01-l09-q109
  prompt:
    es: "De acuerdo con el artículo 26.1.c) de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el servicio de prevención y extinción de incendios deben prestarlo, en todo caso, los Municipios con población superior a:"
  options:
  - id: a
    text:
      es: "5.000 habitantes."
  - id: b
    text:
      es: "50.000 habitantes."
  - id: c
    correct: true
    text:
      es: "20.000 habitantes."
  - id: d
    text:
      es: "1.000 habitantes."
  explanation:
    es: "La prevención y extinción de incendios es un servicio obligatorio desde los 20.000 habitantes. Los 5.000 habitantes son el umbral de la biblioteca pública, del parque público y del tratamiento de residuos. Los 50.000 son el umbral del transporte colectivo urbano de viajeros y del medio ambiente urbano. Los 1.000 habitantes no marcan ningún tramo del artículo 26.1."
  citation: "art. 26.1.c LBRL"
  difficulty: 1
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-26
- id: m01-l09-q110
  prompt:
    es: "Señale la respuesta correcta sobre el servicio de transporte colectivo urbano de viajeros, de acuerdo con el artículo 26.1.d) de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local:"
  options:
  - id: a
    text:
      es: "Deben prestarlo todos los Municipios, cualquiera que sea su población."
  - id: b
    text:
      es: "Deben prestarlo los Municipios con población superior a 5.000 habitantes."
  - id: c
    text:
      es: "Deben prestarlo los Municipios con población superior a 20.000 habitantes."
  - id: d
    correct: true
    text:
      es: "Deben prestarlo los Municipios con población superior a 50.000 habitantes."
  explanation:
    es: "El transporte colectivo urbano de viajeros es un servicio del tramo de más de 50.000 habitantes, junto con el medio ambiente urbano. No está entre los servicios de todos los Municipios, que son el alumbrado, el cementerio, la recogida de residuos y los demás del artículo 26.1.a). Los umbrales de 5.000 y de 20.000 habitantes corresponden a otros servicios, como la biblioteca pública y la prevención de incendios."
  citation: "art. 26.1.d LBRL"
  difficulty: 2
  tags:
  - "competencia"
  - "cantidad"
# anchor: boe-a-1985-5392-art-12
- id: m01-l09-q141
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el término municipal es el territorio en que el ayuntamiento ejerce sus competencias y cada municipio pertenecerá:"
  options:
  - id: a
    text:
      es: "A la provincia que decida su Pleno."
  - id: b
    text:
      es: "A una o varias provincias, según su extensión."
  - id: c
    correct: true
    text:
      es: "A una sola provincia."
  - id: d
    text:
      es: "A la provincia en la que residan la mayoría de sus vecinos."
  explanation:
    es: "Cada municipio pertenece a una sola provincia, según el artículo 12.2. Su Pleno no elige la provincia. Un término que se extienda por varias provincias contradice la regla. El criterio de la residencia de la mayoría de los vecinos tampoco figura en el artículo."
  citation: "art. 12 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-15
- id: m01-l09-q142
  prompt:
    es: "De acuerdo con el artículo 15 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, quien viva en varios municipios deberá inscribirse en el Padrón únicamente del municipio:"
  options:
  - id: a
    text:
      es: "En el que tenga su domicilio fiscal."
  - id: b
    text:
      es: "En el que haya nacido."
  - id: c
    text:
      es: "En el que ejerza su actividad laboral principal."
  - id: d
    correct: true
    text:
      es: "En el que habite durante más tiempo al año."
  explanation:
    es: "Quien vive en varios municipios se inscribe solo en el que habita durante más tiempo al año. El domicilio fiscal, el lugar de nacimiento y el lugar de la actividad laboral principal no son criterios del artículo 15."
  citation: "art. 15 LBRL"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-5392-art-15
- id: m01-l09-q143
  prompt:
    es: "Según el artículo 15 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los inscritos en el Padrón municipal son los vecinos del municipio, y la condición de vecino se adquiere:"
  options:
  - id: a
    correct: true
    text:
      es: "En el mismo momento de su inscripción en el Padrón."
  - id: b
    text:
      es: "Transcurrido un año desde su inscripción en el Padrón."
  - id: c
    text:
      es: "Al cumplir dos años de residencia efectiva en el municipio."
  - id: d
    text:
      es: "Cuando el Pleno acuerda su inscripción en el Padrón."
  explanation:
    es: "La condición de vecino se adquiere en el mismo momento de la inscripción en el Padrón, sin espera. Ni el año desde la inscripción ni los dos años de residencia efectiva figuran en el artículo, y el Pleno no acuerda las inscripciones."
  citation: "art. 15 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-16
- id: m01-l09-q144
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿de qué constituyen prueba los datos del Padrón municipal, registro administrativo donde constan los vecinos de un municipio?"
  options:
  - id: a
    text:
      es: "De la nacionalidad y del estado civil de los vecinos."
  - id: b
    correct: true
    text:
      es: "De la residencia en el municipio y del domicilio habitual en el mismo."
  - id: c
    text:
      es: "De la residencia, pero no del domicilio habitual."
  - id: d
    text:
      es: "De la capacidad de obrar de los vecinos."
  explanation:
    es: "Los datos del Padrón prueban la residencia en el municipio y el domicilio habitual en el mismo. No prueban la nacionalidad ni el estado civil, ni la capacidad de obrar. Tampoco se limitan a la residencia: el artículo cita también el domicilio habitual."
  citation: "art. 16.1 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-20
- id: m01-l09-q145
  prompt:
    es: "De acuerdo con el artículo 20.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Comisión Especial de Cuentas existe:"
  options:
  - id: a
    text:
      es: "Solo en los municipios de gran población."
  - id: b
    text:
      es: "Solo en los municipios con población superior a 5.000 habitantes."
  - id: c
    correct: true
    text:
      es: "En todos los municipios."
  - id: d
    text:
      es: "En los municipios de más de 20.000 habitantes y en los de menos si así lo dispone su reglamento orgánico."
  explanation:
    es: "La Comisión Especial de Cuentas existe en todos los municipios, según el artículo 20.1.e). Los de gran población y los de más de 5.000 habitantes marcan el ámbito de otros órganos, como la Comisión Especial de Sugerencias y Reclamaciones y los órganos de estudio e informe. El umbral de 20.000 habitantes no figura en el artículo 20.1."
  citation: "art. 20.1.e LBRL"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-29
- id: m01-l09-q149
  prompt:
    es: "Según el artículo 29.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, funcionan en Concejo Abierto los municipios con ese régimen tradicional y voluntario y aquellos en que lo aconsejan:"
  options:
  - id: a
    text:
      es: "Su condición de capital de provincia o de isla."
  - id: b
    text:
      es: "La decisión del Gobierno de la Nación, previo dictamen del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Su localización geográfica, la mejor gestión de los intereses municipales u otras circunstancias."
  - id: d
    text:
      es: "El número de Concejales elegidos en las últimas elecciones."
  explanation:
    es: "Además de los que lo tienen por tradición y voluntariamente, funcionan en Concejo Abierto los municipios en que lo hagan aconsejable la localización geográfica, la mejor gestión de los intereses municipales u otras circunstancias. La condición de capital, la decisión del Gobierno de la Nación y el número de Concejales elegidos no son los motivos que el artículo recoge."
  citation: "art. 29.1 LBRL"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1985-5392-art-29
- id: m01-l09-q150
  prompt:
    es: "Señale la respuesta correcta sobre el gobierno y la administración municipales en el régimen de Concejo Abierto, según el artículo 29.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local:"
  options:
  - id: a
    text:
      es: "Corresponden a un Alcalde y a una Junta de Gobierno Local integrada por un tercio de los vecinos."
  - id: b
    text:
      es: "Corresponden al Pleno, integrado por todos los Concejales, y a un Alcalde nombrado por la Comunidad Autónoma."
  - id: c
    text:
      es: "Corresponden a una asamblea de Concejales presidida por el Presidente de la Diputación."
  - id: d
    correct: true
    text:
      es: "Corresponden a un Alcalde y una asamblea vecinal de la que forman parte todos los electores."
  explanation:
    es: "En el Concejo Abierto, el gobierno y la administración municipales corresponden a un Alcalde y a una asamblea vecinal en la que están todos los electores. No hay Junta de Gobierno Local de vecinos, ni Pleno de Concejales con Alcalde nombrado por la Comunidad, ni una asamblea de Concejales presidida por el Presidente de la Diputación."
  citation: "art. 29.3 LBRL"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-31
- id: m01-l09-q096
  prompt:
    es: "De acuerdo con el artículo 31.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Provincia es una entidad local determinada por la agrupación de Municipios:"
  options:
  - id: a
    text:
      es: "Sin personalidad jurídica propia, que actúa a través de la Diputación."
  - id: b
    correct: true
    text:
      es: "Con personalidad jurídica propia y plena capacidad para el cumplimiento de sus fines."
  - id: c
    text:
      es: "Con personalidad jurídica propia y capacidad limitada a la cooperación con los Municipios."
  - id: d
    text:
      es: "Con personalidad jurídica derivada de la Comunidad Autónoma en que se integra."
  explanation:
    es: "El artículo 31.1 LBRL dice que la Provincia es una entidad local «con personalidad jurídica propia y plena capacidad para el cumplimiento de sus fines». La personalidad es suya, no de la Diputación ni de la Comunidad Autónoma. Su capacidad es plena, no limitada a cooperar con los Municipios."
  citation: "art. 31.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-31
- id: m01-l09-q097
  prompt:
    es: "Según el artículo 31.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cuáles son los fines propios y específicos de la Provincia?"
  options:
  - id: a
    text:
      es: "Garantizar la autonomía financiera y tributaria de los Municipios de su territorio."
  - id: b
    text:
      es: "Garantizar la unidad de gobierno y gestión de los Municipios de su territorio."
  - id: c
    text:
      es: "Garantizar la representación de los Municipios de su territorio ante las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "Garantizar los principios de solidaridad y equilibrio intermunicipales."
  explanation:
    es: "El artículo 31.2 LBRL dice que son fines propios y específicos de la Provincia «garantizar los principios de solidaridad y equilibrio intermunicipales». La autonomía financiera de los Municipios, su unidad de gobierno y su representación ante las Cortes no son los fines que enumera el artículo."
  citation: "art. 31.2 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-32
- id: m01-l09-q099
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la Junta de Gobierno es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Existe en todas las Diputaciones, mientras que en los ayuntamientos depende de la población, del reglamento orgánico o del acuerdo del Pleno."
  - id: b
    text:
      es: "Existe en todos los ayuntamientos y en todas las Diputaciones, cualquiera que sea su población."
  - id: c
    text:
      es: "Existe en los ayuntamientos de más de 5.000 habitantes y en las Diputaciones cuyo Pleno lo acuerde."
  - id: d
    text:
      es: "Existe solo en las Diputaciones de régimen común y en los municipios de gran población."
  explanation:
    es: "El artículo 32.1 LBRL dice que la Junta de Gobierno existe «en todas las Diputaciones». En los ayuntamientos, el artículo 20.1.b) la exige en los municipios de más de 5.000 habitantes y en los de menos si lo dispone su reglamento orgánico o lo acuerda el Pleno. No existe en todos los ayuntamientos. En las Diputaciones no depende de un acuerdo del Pleno. La ley no la limita a las Diputaciones de régimen común ni a los municipios de gran población."
  citation: "art. 32.1 LBRL"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-35
- id: m01-l09-q101
  prompt:
    es: "De acuerdo con el artículo 35.4 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Vicepresidentes, que sustituyen al Presidente por el orden de su nombramiento, son designados:"
  options:
  - id: a
    text:
      es: "Por el Pleno, entre los Diputados, por mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Libremente por el Presidente entre los miembros de la Junta de Gobierno."
  - id: c
    text:
      es: "Libremente por el Presidente entre todos los Diputados, sean o no de la Junta de Gobierno."
  - id: d
    text:
      es: "Por la Junta de Gobierno, entre sus miembros, a propuesta del Presidente."
  explanation:
    es: "El artículo 35.4 LBRL dice que los Vicepresidentes son «libremente designados por éste», el Presidente, «entre los miembros de la Junta de Gobierno». No los elige el Pleno ni la Junta de Gobierno. A diferencia de los Tenientes de Alcalde, la ley no prevé designarlos entre todos los Diputados."
  citation: "art. 35.4 LBRL"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-36
- id: m01-l09-q103
  prompt:
    es: "¿En qué municipios asume la Diputación el servicio de prevención y extinción de incendios cuando estos no proceden a su prestación?"
  options:
  - id: a
    text:
      es: "En los municipios de menos de 5.000 habitantes."
  - id: b
    text:
      es: "En los municipios de menos de 50.000 habitantes."
  - id: c
    correct: true
    text:
      es: "En los municipios de menos de 20.000 habitantes."
  - id: d
    text:
      es: "En los municipios de menos de 1.000 habitantes."
  explanation:
    es: "El artículo 36.1.c) LBRL dice que la Diputación asumirá la prestación de los servicios «de prevención y extinción de incendios en los de menos de 20.000 habitantes, cuando éstos no procedan a su prestación». Cinco mil habitantes es el umbral que la misma letra fija para el tratamiento de residuos. Mil habitantes es la cifra de secretaría e intervención, en la letra b). Cincuenta mil no es la cifra que fija la letra c): el texto dice veinte mil."
  citation: "art. 36.1.c LBRL"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-40
- id: m01-l09-q104
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las Comunidades Autónomas uniprovinciales y la Foral de Navarra:"
  options:
  - id: a
    correct: true
    text:
      es: "Asumen las competencias, medios y recursos que en el régimen ordinario corresponden a las Diputaciones Provinciales."
  - id: b
    text:
      es: "Mantienen una Diputación Provincial distinta de sus instituciones autonómicas."
  - id: c
    text:
      es: "Asumen las competencias de las Diputaciones, salvo la asistencia y cooperación a los Municipios."
  - id: d
    text:
      es: "Transfieren a sus Municipios las competencias que corresponden a las Diputaciones Provinciales."
  explanation:
    es: "El artículo 40 LBRL dice que estas Comunidades «asumen las competencias, medios y recursos que corresponden en el régimen ordinario a las Diputaciones Provinciales». No mantienen una Diputación aparte. La asunción no excluye la asistencia a los Municipios. Las competencias pasan a la Comunidad, no a los Municipios. La única excepción del artículo es la Comunidad Autónoma de las Islas Baleares."
  citation: "art. 40 LBRL"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-39
- id: m01-l09-q105
  prompt:
    es: "Según el artículo 39 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cómo se aplican sus disposiciones a los órganos forales de Álava, Guipúzcoa y Vizcaya?"
  options:
  - id: a
    text:
      es: "Con carácter preferente sobre su régimen foral, que solo rige en su defecto."
  - id: b
    correct: true
    text:
      es: "Con carácter supletorio, pues conservan su régimen peculiar en el marco del Estatuto vasco."
  - id: c
    text:
      es: "No se les aplican en ningún caso, por tener un régimen foral propio."
  - id: d
    text:
      es: "Solo en materia de organización, pues sus competencias se rigen por su Estatuto."
  explanation:
    es: "El artículo 39 LBRL dice que los órganos forales de Álava, Guipúzcoa y Vizcaya «conservan su régimen peculiar» en el marco del Estatuto vasco y que la Ley «les serán de aplicación con carácter supletorio». La Ley no prevalece sobre el régimen foral. Sí se aplica, como supletoria, así que «en ningún caso» es falso. El artículo no reparte su aplicación entre organización y competencias."
  citation: "art. 39 LBRL"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-5392-art-33
- id: m01-l09-q151
  prompt:
    es: "El Pleno de la Diputación provincial, órgano que existe en todas las Diputaciones junto al Presidente, los Vicepresidentes y la Junta de Gobierno, está constituido por el Presidente y por:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Diputados."
  - id: b
    text:
      es: "Los Alcaldes de los municipios de la provincia."
  - id: c
    text:
      es: "Los Concejales de la capital de la provincia."
  - id: d
    text:
      es: "Los Presidentes de las mancomunidades."
  explanation:
    es: "El Pleno de la Diputación lo forman el Presidente y los Diputados, según el artículo 33.1. Los Alcaldes de la provincia, los Concejales de la capital y los Presidentes de las mancomunidades no son miembros del Pleno por esa condición."
  citation: "art. 33.1 LBRL"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1985-5392-art-35
- id: m01-l09-q152
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿qué número de Diputados puede integrar, junto con el Presidente, la Junta de Gobierno de la Diputación, nombrados y separados libremente por el Presidente?"
  options:
  - id: a
    text:
      es: "No superior a la mitad del número legal de Diputados."
  - id: b
    correct: true
    text:
      es: "No superior al tercio del número legal de Diputados."
  - id: c
    text:
      es: "No inferior al tercio del número legal de Diputados."
  - id: d
    text:
      es: "No superior a los dos tercios del número legal de Diputados."
  explanation:
    es: "La Junta de Gobierno se integra por el Presidente y un número de Diputados no superior al tercio del número legal. La mitad y los dos tercios son límites mayores que el de la ley. Un número no inferior al tercio fija un mínimo en vez de un máximo."
  citation: "art. 35.1 LBRL"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-5392-art-36
- id: m01-l09-q153
  prompt:
    es: "Según el artículo 36.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Diputación garantizará, en todo caso, la prestación de los servicios de secretaría e intervención en los municipios de:"
  options:
  - id: a
    text:
      es: "Menos de 5.000 habitantes."
  - id: b
    text:
      es: "Menos de 20.000 habitantes."
  - id: c
    correct: true
    text:
      es: "Menos de 1.000 habitantes."
  - id: d
    text:
      es: "Menos de 100 habitantes."
  explanation:
    es: "La Diputación garantiza los servicios de secretaría e intervención en los municipios de menos de 1.000 habitantes. Los 5.000 habitantes son el límite del tratamiento de residuos que asume la Diputación, y los 20.000 el de la prevención y extinción de incendios. Los 100 residentes se refieren al Concejo Abierto del artículo 29."
