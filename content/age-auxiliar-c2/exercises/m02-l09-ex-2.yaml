# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q023
  prompt:
    es: "En Excel 365, con el estilo de referencia A1, ¿cuál de las siguientes referencias abarca todas las celdas desde la columna H hasta la J?"
  options:
  - id: a
    text:
      es: "H1:J1"
  - id: b
    correct: true
    text:
      es: "H:J"
  - id: c
    text:
      es: "H1:J10"
  - id: d
    text:
      es: "H:H;J:J"
  explanation:
    es: "La tabla del estilo A1 da H:J para «todas las celdas desde la columna H hasta la J». H1:J1 abarca solo la fila 1 de esas columnas, H1:J10 solo las filas 1 a 10, y H:H;J:J une las columnas H y J sin la I."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q024
  prompt:
    es: "En una hoja de cálculo de Excel 365, con el estilo de referencia A1, la referencia 5:5 abarca:"
  options:
  - id: a
    correct: true
    text:
      es: "Todas las celdas de la fila 5 de la hoja."
  - id: b
    text:
      es: "Todas las celdas de la columna E de la hoja."
  - id: c
    text:
      es: "Solo la celda de la columna E y la fila 5."
  - id: d
    text:
      es: "Las cinco primeras filas de la hoja."
  explanation:
    es: "La tabla del estilo A1 da 5:5 para «todas las celdas de la fila 5». La columna E entera sería E:E, la celda de la columna E y la fila 5 sería E5, y las cinco primeras filas serían 1:5."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q025
  prompt:
    es: "En una hoja de cálculo de Excel 365, con el estilo de referencia A1, ¿qué celdas abarca la referencia B15:E15?"
  options:
  - id: a
    text:
      es: "Solo las celdas B15 y E15, sin las intermedias."
  - id: b
    text:
      es: "Las celdas de las filas 1 a 15 desde la columna B hasta la E."
  - id: c
    correct: true
    text:
      es: "Las celdas de la fila 15 desde la columna B hasta la E."
  - id: d
    text:
      es: "Las celdas de la columna B desde la fila 15 hasta la fila 5."
  explanation:
    es: "La tabla del estilo A1 da B15:E15 para «el rango de celdas de la fila 15 y de las columnas B a E». Solo B15 y E15 sería la unión B15;E15, las filas 1 a 15 serían B1:E15, y la otra opción describe un rango de la columna B que la referencia no abarca."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q026
  prompt:
    es: "En Excel 365, ¿qué método abreviado de teclado inserta una hoja de cálculo nueva en el libro activo?"
  options:
  - id: a
    correct: true
    text:
      es: "Mayús+F11"
  - id: b
    text:
      es: "Ctrl+Mayús+F1"
  - id: c
    text:
      es: "Alt+F11"
  - id: d
    text:
      es: "Alt+F1"
  explanation:
    es: "En las teclas de función, «Mayús+F11: inserta una hoja de cálculo nueva». Ctrl+Mayús+F1 alterna el modo de pantalla completa, Alt+F11 abre el Editor de Visual Basic para Aplicaciones y Alt+F1 crea un gráfico incrustado."
  citation: "fuente: `ms-excel-atajos.html`; «Teclas de función»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q027
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas de la cinta de opciones inserta una hoja de cálculo en el libro?"
  options:
  - id: a
    text:
      es: "Insertar › Tablas › Insertar hoja"
  - id: b
    text:
      es: "Revisar › Cambios › Insertar hoja"
  - id: c
    correct: true
    text:
      es: "Inicio › Insertar › Insertar hoja"
  - id: d
    text:
      es: "Datos › Herramientas de datos › Insertar hoja"
  explanation:
    es: "La página da, además del icono Nueva hoja, la ruta «Inicio>Insertar>Insertar Hoja». Insertar hoja no está en la pestaña Insertar, ni en Revisar, ni en Datos."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Insertar una hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q028
  prompt:
    es: "En Excel 365, ¿qué ocurre al hacer doble clic en el nombre de una hoja en su pestaña?"
  options:
  - id: a
    correct: true
    text:
      es: "Se puede escribir directamente un nombre nuevo para la hoja."
  - id: b
    text:
      es: "La hoja se oculta y sus datos dejan de estar visibles en el libro."
  - id: c
    text:
      es: "La hoja se mueve al final del libro, detrás de la última."
  - id: d
    text:
      es: "Se abre el cuadro de diálogo Mostrar con las hojas ocultas."
  explanation:
    es: "La página dice «Haga doble clic en el nombre de la hoja en la pestaña Hoja para cambiarle el nombre rápidamente». Ocultar se elige en el menú del botón derecho, mover se hace arrastrando la pestaña y el cuadro Mostrar sale al elegir Mostrar en ese menú."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Cambiar el nombre de una hoja de cálculo»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q029
  prompt:
    es: "Señale cómo se elimina una hoja de cálculo de un libro de Excel 365 desde su propia pestaña de hoja:"
  options:
  - id: a
    text:
      es: "Doble clic en la pestaña y seleccionar Eliminar."
  - id: b
    text:
      es: "Clic derecho en la pestaña y seleccionar Ocultar."
  - id: c
    text:
      es: "Arrastrar la pestaña hasta otra posición."
  - id: d
    correct: true
    text:
      es: "Clic derecho en la pestaña y seleccionar Eliminar."
  explanation:
    es: "La página dice «Haga clic con el botón derecho en la pestaña Hoja y seleccione Eliminar». El doble clic sirve para cambiar el nombre, Ocultar quita la hoja de la vista sin borrarla y arrastrar la pestaña la mueve."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Eliminar una hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q030
  prompt:
    es: "En Excel 365, ¿cómo se mueve con el ratón una hoja de cálculo a otra posición dentro del mismo libro?"
  options:
  - id: a
    correct: true
    text:
      es: "Haciendo clic en su pestaña y arrastrándola hasta el punto deseado."
  - id: b
    text:
      es: "Haciendo doble clic en su pestaña y escribiendo la nueva posición."
  - id: c
    text:
      es: "Seleccionando su pestaña y presionando Mayús+F11 en la nueva posición."
  - id: d
    text:
      es: "Haciendo clic con el botón derecho en su pestaña y seleccionando Mostrar."
  explanation:
    es: "La página dice que una hoja se mueve con «haga clic y arrastre la pestaña hasta cualquier punto». El doble clic cambia el nombre, Mayús+F11 inserta una hoja nueva y Mostrar abre la lista de hojas ocultas."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Mover una hoja de cálculo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q031
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes métodos abreviados de teclado lleva a la siguiente hoja del libro?"
  options:
  - id: a
    text:
      es: "Alt+Av Pág"
  - id: b
    text:
      es: "Ctrl+Re Pág"
  - id: c
    text:
      es: "Ctrl+Mayús+Av Pág"
  - id: d
    correct: true
    text:
      es: "Ctrl+Av Pág"
  explanation:
    es: "La tabla de navegación da Ctrl+Av Pág para «ir a la siguiente hoja de un libro». Alt+Av Pág mueve una pantalla a la derecha, Ctrl+Re Pág va a la hoja anterior y Ctrl+Mayús+Av Pág selecciona la hoja actual y la siguiente."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para navegar por celdas»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q032
  prompt:
    es: "En Excel 365 para Windows, ¿cuál de las siguientes rutas de la cinta de opciones protege la hoja de cálculo activa?"
  options:
  - id: a
    text:
      es: "Datos › Proteger hoja"
  - id: b
    text:
      es: "Vista › Proteger hoja"
  - id: c
    text:
      es: "Diseño de página › Proteger hoja"
  - id: d
    correct: true
    text:
      es: "Revisar › Proteger hoja"
  explanation:
    es: "La página dice «En la pestaña Revisar, seleccione Proteger hoja». El comando no está en las pestañas Datos, Vista ni Diseño de página; la página de atajos también sitúa la protección de libros y hojas en Revisar."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Paso 2: Proteger la hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q033
  prompt:
    es: "En Excel 365, ¿qué se hace primero para que, con la hoja protegida, los demás usuarios solo puedan editar ciertas celdas?"
  options:
  - id: a
    correct: true
    text:
      es: "Desbloquear esas celdas en Formato de celdas › Protección › Bloqueada."
  - id: b
    text:
      es: "Bloquear esas celdas en Formato de celdas › Protección › Bloqueada."
  - id: c
    text:
      es: "Proteger la estructura del libro desde Revisar › Proteger libro."
  - id: d
    text:
      es: "Ocultar con Ctrl+9 las filas de las demás celdas de la hoja."
  explanation:
    es: "La página describe la protección como un proceso de dos pasos: «el primer paso consiste en desbloquear las celdas que otros usuarios pueden editar», desactivando Bloqueada en la pestaña Protección de Formato de celdas. Bloquearlas es lo contrario, Proteger libro protege la estructura del libro y Ctrl+9 oculta filas."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Habilitar la protección de hojas de cálculo»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q035
  prompt:
    es: "En una hoja de cálculo protegida de Excel 365, con las opciones predeterminadas, ¿qué tecla desplaza entre las celdas desbloqueadas?"
  options:
  - id: a
    text:
      es: "Mayús+F8"
  - id: b
    correct: true
    text:
      es: "Tab"
  - id: c
    text:
      es: "F8"
  - id: d
    text:
      es: "Ctrl+Av Pág"
  explanation:
    es: "La página dice que, por defecto, los usuarios pueden seleccionar celdas desbloqueadas «y presionar la tecla TAB para desplazarse por las celdas desbloqueadas». Mayús+F8 agrega un rango no adyacente a la selección, F8 activa el modo extendido y Ctrl+Av Pág va a la siguiente hoja."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Paso 2: Proteger la hoja de cálculo»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q036
  prompt:
    es: "En una hoja de cálculo protegida de Excel 365, ¿cuál de las siguientes afirmaciones sobre el Autofiltro es correcta?"
  options:
  - id: a
    text:
      es: "Los usuarios pueden aplicarlo y quitarlo si se marca Usar Autofiltro al proteger la hoja."
  - id: b
    text:
      es: "Los usuarios pueden aplicarlo y quitarlo si la hoja se ha protegido sin ninguna contraseña."
  - id: c
    text:
      es: "Los usuarios pueden aplicarlo, pero no quitarlo, si se marca Ordenar al proteger la hoja."
  - id: d
    correct: true
    text:
      es: "Los usuarios no pueden aplicarlo ni quitarlo, sea cual sea la configuración de la protección."
  explanation:
    es: "La nota de Usar Autofiltro dice que los usuarios «no pueden aplicar ni quitar Autofiltro en una hoja de cálculo protegida, independientemente de esta configuración»: la opción solo deja usar las flechas de un autofiltro ya aplicado. La contraseña no cambia esa regla y Ordenar se refiere a los comandos de ordenación."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Paso 2: Proteger la hoja de cálculo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q037
  prompt:
    es: "En Excel 365 para Windows, ¿cuál de las siguientes señales indica que la hoja de cálculo activa está protegida?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Revisar, Proteger hoja ha cambiado a Desproteger hoja."
  - id: b
    text:
      es: "En la barra de título aparece la marca [Grupo] junto al nombre del libro."
  - id: c
    text:
      es: "La pestaña de la hoja desaparece de la parte inferior de la ventana del libro."
  - id: d
    text:
      es: "El cuadro de diálogo Mostrar incluye la hoja en su lista de hojas ocultas."
  explanation:
    es: "La página dice que, con la hoja protegida, «la opción Proteger hoja de la cinta cambia a Desproteger hoja». [Grupo] indica que hay varias hojas seleccionadas, y una pestaña que desaparece o una hoja en la lista de Mostrar indican una hoja oculta."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «¿Cómo saber si una hoja está protegida?»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q038
  prompt:
    es: "Señale la afirmación correcta sobre la protección de una hoja de cálculo en Excel 365:"
  options:
  - id: a
    text:
      es: "Es una característica de seguridad que cifra el contenido de la hoja con la contraseña."
  - id: b
    correct: true
    text:
      es: "No está pensada como medida de seguridad; impide modificar celdas bloqueadas."
  - id: c
    text:
      es: "Impide que abra el archivo de Excel quien no conozca la contraseña de la hoja."
  - id: d
    text:
      es: "Equivale a proteger el libro e impide además agregar o mover hojas del libro."
  explanation:
    es: "La página dice que la protección de hoja «no está pensada como una característica de seguridad» y que «simplemente impide que los usuarios modifiquen las celdas bloqueadas». No cifra nada, no impide abrir el archivo (eso es Proteger un archivo) y «no es lo mismo que proteger un libro»."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Proteger una hoja de cálculo»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q039
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones sobre los gráficos y segmentaciones de datos de una hoja de cálculo es correcta?"
  options:
  - id: a
    text:
      es: "Quedan desbloqueados al agregarlos y hay que bloquearlos antes de proteger la hoja."
  - id: b
    text:
      es: "Ya están bloqueados al agregarlos y el bloqueo actúa aunque la hoja no esté protegida."
  - id: c
    correct: true
    text:
      es: "Ya están bloqueados al agregarlos, pero el bloqueo solo actúa con la hoja protegida."
  - id: d
    text:
      es: "No admiten bloqueo, porque la protección de la hoja solo afecta a celdas."
  explanation:
    es: "La nota de la página dice que los gráficos, las segmentaciones de datos y otros objetos «ya están bloqueados cuando se agregan a una hoja de cálculo. Pero el bloqueo solo funcionará cuando se habilite la protección de la hoja». No quedan desbloqueados, el bloqueo no actúa sin proteger la hoja y sí admiten bloqueo."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Elegir qué elementos de celda se deben bloquear»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m02-l09-q041
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones sobre la contraseña al proteger la estructura de un libro es correcta?"
  options:
  - id: a
    text:
      es: "Es obligatoria; sin ella, Excel no activa la protección de la estructura."
  - id: b
    correct: true
    text:
      es: "Es opcional; sin ella, cualquier usuario puede desproteger el libro."
  - id: c
    text:
      es: "Es opcional; sin ella, solo el autor del libro puede desprotegerlo."
  - id: d
    text:
      es: "Es obligatoria, y Excel puede recuperarla si se pierde."
  explanation:
    es: "La página dice «La contraseña es opcional. Si no proporciona una contraseña, cualquier usuario puede desproteger y cambiar el libro», y añade que, si se pierde, Excel no podrá recuperarla. No es obligatoria ni reserva la desprotección al autor."
  citation: "fuente: `ms-excel-proteger-libro.html`; «Proteger un libro»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m02-l09-q042
  prompt:
    es: "En un libro de Excel 365 con la estructura protegida, ¿qué se observa al hacer clic en la parte inferior de una hoja, en sus pestañas?"
  options:
  - id: a
    text:
      es: "Las opciones de estructura están disponibles, pero piden la contraseña antes de aplicarse."
  - id: b
    text:
      es: "Solo la opción Desproteger hoja está disponible en el menú de la pestaña de la hoja."
  - id: c
    text:
      es: "Las opciones de estructura están disponibles, pero sus cambios se deshacen al cerrar el libro."
  - id: d
    correct: true
    text:
      es: "No están disponibles opciones como Insertar, Eliminar, Cambiar el nombre, Mover u Ocultar."
  explanation:
    es: "La página dice que, con el libro protegido, las opciones para cambiar su estructura, «como Insertar, Eliminar, Cambiar el nombre, Mover, Copiar, Ocultar y Mostrar hojas no están disponibles». No quedan disponibles a la espera de una contraseña, no se deshacen al cerrar y Desproteger hoja pertenece a la protección de la hoja."
  citation: "fuente: `ms-excel-proteger-libro.html`; «¿Cómo saber si un libro está protegido?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m02-l09-q043
  prompt:
    es: "En Excel 365, ¿qué protección corresponde usar para que otros usuarios no puedan abrir un archivo, según la ayuda de Proteger libro?"
  options:
  - id: a
    text:
      es: "Proteger la estructura del libro con una contraseña"
  - id: b
    correct: true
    text:
      es: "Proteger un archivo de Excel con una contraseña"
  - id: c
    text:
      es: "Proteger la hoja de cálculo con una contraseña"
  - id: d
    text:
      es: "Bloquear las celdas en Formato de celdas › Protección"
  explanation:
    es: "La nota de la página distingue las tres protecciones: «Para bloquear el archivo de modo que otros usuarios no pueden abrirlo, vea Proteger un archivo de Excel». Proteger la estructura del libro impide cambiar sus hojas, proteger la hoja protege áreas de datos y bloquear celdas solo actúa con la hoja protegida."
  citation: "fuente: `ms-excel-proteger-libro.html`; «Proteger un libro»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m02-l09-q044
  prompt:
    es: "En Excel 365, ¿qué filas y columnas fija el comando Inmovilizar paneles respecto de la celda seleccionada?"
  options:
  - id: a
    text:
      es: "Las filas inferiores y las columnas situadas a la derecha de la celda seleccionada."
  - id: b
    text:
      es: "Las filas superiores y las columnas a la derecha de la celda seleccionada."
  - id: c
    correct: true
    text:
      es: "Las filas superiores y las columnas a la izquierda de la celda seleccionada."
  - id: d
    text:
      es: "Solo la fila y la columna en las que está la celda seleccionada."
  explanation:
    es: "La página dice que «Inmovilizar paneles inmoviliza las filas superiores y las columnas a la izquierda de la celda seleccionada». Las demás opciones cambian la dirección de las filas o de las columnas, o reducen lo fijado a la fila y la columna de la celda."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m02-l09-q045
  prompt:
    es: "En Excel 365, ¿en cuál de las siguientes pestañas de la cinta de opciones está el comando Inmovilizar paneles?"
  options:
  - id: a
    text:
      es: "La pestaña Inicio"
  - id: b
    text:
      es: "La pestaña Diseño de página"
  - id: c
    text:
      es: "La pestaña Revisar"
  - id: d
    correct: true
    text:
      es: "La pestaña Vista"
  explanation:
    es: "La página indica ir a «la pestaña Vista, donde puede inmovilizar paneles para bloquear filas y columnas específicas». Inmovilizar paneles no está en Inicio, Diseño de página ni Revisar."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar paneles para bloquear filas y columnas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m02-l09-q046
  prompt:
    es: "En Excel 365, para inmovilizar las dos primeras columnas de la hoja con Inmovilizar paneles, ¿qué se selecciona antes?"
  options:
  - id: a
    text:
      es: "La segunda columna"
  - id: b
    text:
      es: "La primera y la segunda columna"
  - id: c
    text:
      es: "La celda A1"
  - id: d
    correct: true
    text:
      es: "La tercera columna"
  explanation:
    es: "Para inmovilizar las dos primeras columnas, la página manda seleccionar antes la columna siguiente (C). Inmovilizar paneles fija las columnas a la izquierda de la selección: con la columna B seleccionada solo quedaría fija la columna A, con las columnas A y B no queda ninguna a su izquierda, y con la celda A1 no queda nada a la izquierda ni encima."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m02-l09-q047
  prompt:
    es: "En una hoja de Excel 365 se quiere que las filas 1 y 2 y la columna A sigan visibles al desplazarse. ¿Cuál de las siguientes celdas se selecciona antes de Inmovilizar paneles?"
  options:
  - id: a
    text:
      es: "La celda A3"
  - id: b
    correct: true
    text:
      es: "La celda B3"
  - id: c
    text:
      es: "La celda B2"
  - id: d
    text:
      es: "La celda C3"
  explanation:
    es: "La página indica seleccionar «la celda que se encuentra debajo de las filas y a la derecha de las columnas» que se quieren mantener visibles: debajo de la fila 2 y a la derecha de la columna A está B3. A3 solo fija las filas 1 y 2, B2 fija la fila 1 y la columna A, y C3 fija también la columna B."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m02-l09-q048
  prompt:
    es: "Señale la afirmación correcta sobre los comandos de la pestaña Vista de Excel 365 que mantienen visible un área de la hoja:"
  options:
  - id: a
    text:
      es: "Dividir paneles bloquea en su lugar las filas superiores de la hoja de cálculo."
  - id: b
    correct: true
    text:
      es: "Dividir paneles crea ventanas independientes de la misma hoja de cálculo."
  - id: c
    text:
      es: "Inmovilizar paneles crea ventanas independientes de la misma hoja de cálculo."
  - id: d
    text:
      es: "Inmovilizar paneles oculta las filas y columnas que quedan fuera de la vista."
  explanation:
    es: "La página dice que en la pestaña Vista se pueden «inmovilizar paneles para bloquear filas y columnas específicas en su lugar, o puede dividir paneles para crear ventanas independientes de la misma hoja de cálculo». Las demás opciones intercambian lo que hace cada comando o atribuyen a Inmovilizar paneles una ocultación que no hace."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar paneles para bloquear filas y columnas»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q049
  prompt:
    es: "En Excel 365, ¿qué nombre recibe el punto y coma (;) usado en una referencia como C2:C7;E2:E7?"
  options:
  - id: a
    text:
      es: "Operador de rango"
  - id: b
    correct: true
    text:
      es: "Operador de unión"
  - id: c
    text:
      es: "Operador de intersección"
  - id: d
    text:
      es: "Operador de concatenación"
  explanation:
    es: "La tabla de operadores de referencia da «punto y coma (;) u operador de unión», con el rango C2:C7; E2:E7. Los dos puntos (:) son el operador de rango y el espacio es el operador de intersección; la concatenación une textos, no referencias."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Operadores de referencia»"
  difficulty: 2
  tags:
  - "concepto"
