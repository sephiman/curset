# anchor: boe-a-1985-5392-art-20
- id: m01-l10-q023
  prompt:
    es: "De acuerdo con el artículo 20.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Junta de Gobierno Local existe:"
  options:
  - id: a
    correct: true
    text:
      es: "En todos los municipios con población superior a 5.000 habitantes y en los de menos si lo dispone su reglamento orgánico o lo acuerda el Pleno."
  - id: b
    text:
      es: "En todos los municipios con población superior a 20.000 habitantes y en los de menos si lo acuerda el Pleno por mayoría absoluta."
  - id: c
    text:
      es: "En todos los municipios con población superior a 5.000 habitantes, sin que pueda existir en los de menos."
  - id: d
    text:
      es: "En todos los ayuntamientos, con independencia de su población, igual que el Pleno."
  explanation:
    es: "El artículo 20.1.b) LBRL dice que la Junta de Gobierno Local existe «en todos los municipios con población superior a 5.000 habitantes y en los de menos, cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento». El umbral es 5.000, no 20.000, y la ley no exige mayoría absoluta. Los municipios más pequeños pueden tenerla. No existe en todos los ayuntamientos: eso solo vale para el Alcalde, los Tenientes de Alcalde y el Pleno."
  citation: "art. 20.1.b LBRL"
  difficulty: 1
