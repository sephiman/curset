  explanation:
    es: "Los cuatro primeros ejes del IV Plan, por orden, son transparencia y rendición de cuentas, participación, integridad, y sensibilización y formación. La integridad ocupa el tercer lugar. El primero es la transparencia y rendición de cuentas, el segundo la participación y el cuarto la sensibilización y formación."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 1
  tags:
  - "estructura"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q072
