    es: "La regla 32.ª reserva al Estado la autorización para la convocatoria de consultas populares por vía de referéndum. Las elecciones autonómicas, las municipales y las sesiones extraordinarias del Senado no figuran en esa regla."
  citation: "art. 149.1.32.ª CE"
