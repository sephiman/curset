  prompt:
    es: "Conforme al artículo 55.9 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el desarrollo y la ejecución de los planes de actuación de la organización situada bajo su responsabilidad corresponde a:"
