# anchor: boe-a-1992-28740-art-108
- id: m03-l19-q0155
  prompt:
    es: "Según el artículo 108.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran bienes de inversión los bienes corporales, muebles, semovientes o inmuebles que, por su naturaleza y función, estén normalmente destinados a ser utilizados por un período de tiempo superior a un año como:"
  options:
  - id: a
    correct: true
    text:
      es: "instrumentos de trabajo o medios de explotación."
  - id: b
    text:
      es: "existencias o bienes destinados a la reventa en el curso de la actividad."
  - id: c
    text:
      es: "materias primas o elementos consumibles en el proceso de producción."
  - id: d
    text:
      es: "instrumentos financieros o medios de pago de la actividad empresarial."
  explanation:
    es: "Son bienes de inversión los destinados a usarse más de un año como instrumentos de trabajo o medios de explotación. Las existencias, las materias primas y los instrumentos financieros no cumplen esa función."
  citation: "art. 108.Uno LIVA"
  difficulty: 1
  tags:
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-108
- id: m03-l19-q0156
  prompt:
    es: "¿Cuál de los siguientes bienes queda excluido de la consideración de bien de inversión según el artículo 108.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Los vehículos destinados al transporte de mercancías por un período superior a un año."
  - id: b
    text:
      es: "Las máquinas destinadas a ser utilizadas durante más de un año como instrumentos de trabajo."
  - id: c
    correct: true
    text:
      es: "Las ejecuciones de obra para la reparación de otros bienes de inversión."
  - id: d
    text:
      es: "Los edificios destinados a ser utilizados durante más de un año como medios de explotación."
  explanation:
    es: "Las ejecuciones de obra para reparar bienes de inversión están excluidas (108.Dos.2.º). Los vehículos de transporte, los edificios y las máquinas que se usan más de un año como instrumentos o medios de explotación sí lo son."
  citation: "art. 108.Dos LIVA"
  difficulty: 2
  tags:
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-108
- id: m03-l19-q0157
  prompt:
    es: "Conforme al artículo 108.Dos.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, queda excluido de la consideración de bien de inversión cualquier otro bien cuyo valor de adquisición sea:"
  options:
  - id: a
    text:
      es: "inferior a un millón de pesetas."
  - id: b
    text:
      es: "superior a quinientas mil pesetas."
  - id: c
    correct: true
    text:
      es: "inferior a quinientas mil pesetas."
  - id: d
    text:
      es: "inferior a cien mil pesetas."
  explanation:
    es: "El umbral es el valor de adquisición inferior a quinientas mil pesetas. Un millón y cien mil pesetas son cifras que la ley no recoge, y los bienes de valor superior sí pueden ser de inversión."
  citation: "art. 108.Dos LIVA"
  difficulty: 1
  tags:
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0158
  prompt:
    es: "De acuerdo con el artículo 107.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿durante cuánto tiempo deben regularizarse las cuotas deducibles por la adquisición o importación de bienes de inversión?"
  options:
  - id: a
    text:
      es: "Los cinco años naturales siguientes a aquel en que se realicen las operaciones."
  - id: b
    text:
      es: "Los nueve años naturales siguientes a aquel en que se realicen las operaciones."
  - id: c
    correct: true
    text:
      es: "Los cuatro años naturales siguientes a aquel en que se realicen las operaciones."
  - id: d
    text:
      es: "Los cuatro años naturales siguientes a aquel en que se presente la primera declaración."
  explanation:
    es: "La regularización dura los cuatro años naturales siguientes al de la operación. Los cinco años son el divisor de la regla 109.3.º, y los nueve son el plazo de terrenos y edificaciones."
  citation: "art. 107.Uno LIVA"
  difficulty: 2
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0159
  prompt:
    es: "Conforme al artículo 107.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las regularizaciones de las deducciones por bienes de inversión solo se practican cuando, entre el porcentaje de deducción definitivo de cada año y el que prevaleció en el año en que se soportó la repercusión, exista una diferencia:"
  options:
  - id: a
    text:
      es: "igual o superior a diez puntos porcentuales."
  - id: b
    correct: true
    text:
      es: "superior a diez puntos porcentuales."
  - id: c
    text:
      es: "superior a cinco puntos porcentuales."
  - id: d
    text:
      es: "superior a veinte puntos porcentuales."
  explanation:
    es: "La diferencia debe ser superior a diez puntos: una diferencia exactamente de diez no basta. Las otras opciones cambian el umbral o la condición de igualdad."
  citation: "art. 107.Uno LIVA"
  difficulty: 1
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0160
  prompt:
    es: "Tejidos Orbe, S.L. adquiere en 2025 un telar por 50.000 euros más 10.500 euros de IVA y lo pone en funcionamiento ese año. Su porcentaje de deducción definitivo es del 70 % en 2025, del 80 % en 2026, del 65 % en 2027, del 82 % en 2028 y del 70 % en 2029. Según el artículo 107.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué años se regulariza la deducción?"
  options:
  - id: a
    text:
      es: "En 2026 y 2028, porque en ambos años el porcentaje supera al de 2025 en diez puntos o más."
  - id: b
    correct: true
    text:
      es: "Solo en 2028, porque es el único año en que la diferencia con el 70 % de 2025 es superior a diez puntos."
  - id: c
    text:
      es: "En 2028 y 2029, porque son los dos últimos años del período de regularización de cuatro años."
  - id: d
    text:
      es: "En 2026, 2027, 2028 y 2029, porque todos son años de regularización y deben practicarse."
  explanation:
    es: "El período abarca 2026 a 2029. Las diferencias con el 70 % son 10 en 2026, 5 en 2027, 12 en 2028 y 0 en 2029: solo 2028 supera diez puntos. 2026 queda fuera porque la diferencia es exactamente diez. Practicar todos los años ignora el umbral, y ser de los últimos años no es un criterio."
  citation: "art. 107.Uno LIVA"
  difficulty: 3
  tags:
  - "bienes de inversión"
  - "regularización"
  - "cómputo"
# anchor: boe-a-1992-28740-art-109
- id: m03-l19-q0161
  prompt:
    es: "Siguiendo el supuesto de Tejidos Orbe, S.L. (telar adquirido en 2025 por 50.000 euros más 10.500 euros de IVA, deducido al 70 %), el porcentaje definitivo de 2028 es del 82 %. Según el artículo 109 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué regularización practica por 2028?"
  options:
  - id: a
    correct: true
    text:
      es: "Una deducción complementaria de 252 euros."
  - id: b
    text:
      es: "Una deducción complementaria de 1.260 euros."
  - id: c
    text:
      es: "Un ingreso complementario de 252 euros."
  - id: d
    text:
      es: "Un ingreso complementario de 1.260 euros."
  explanation:
    es: "La deducción de 2025 fue 10.500 x 70 % = 7.350. Con el 82 % procedería 8.610. La resta es 7.350 - 8.610 = -1.260, y dividida por cinco da -252: la deducción efectuada fue inferior, así que la regularización es una deducción complementaria de 252. Un ingreso invierte el signo, y 1.260 olvida dividir por cinco."
  citation: "art. 109 LIVA"
  difficulty: 3
  tags:
  - "bienes de inversión"
  - "regularización"
  - "cómputo"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0162
  prompt:
    es: "Según el artículo 107.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿durante cuánto tiempo deben regularizarse las cuotas deducibles por la adquisición de terrenos o edificaciones?"
  options:
  - id: a
    text:
      es: "Los cinco años naturales siguientes a la correspondiente adquisición."
  - id: b
    correct: true
    text:
      es: "Los nueve años naturales siguientes a la correspondiente adquisición."
  - id: c
    text:
      es: "Los cuatro años naturales siguientes a la correspondiente adquisición."
  - id: d
    text:
      es: "Los diez años naturales siguientes a la correspondiente adquisición."
  explanation:
    es: "Para terrenos y edificaciones el período es de nueve años naturales siguientes a la adquisición. El de cuatro años es el general, y el divisor diez de la regla 109.3.º no es la duración del período."
  citation: "art. 107.Tres LIVA"
  difficulty: 1
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0163
  prompt:
    es: "De acuerdo con el artículo 107.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, cuando la utilización efectiva o la entrada en funcionamiento de los bienes de inversión se inicien con posterioridad a su adquisición, la regularización se efectúa:"
  options:
  - id: a
    correct: true
    text:
      es: "el año en que se produzcan dichas circunstancias y los cuatro siguientes."
  - id: b
    text:
      es: "el año siguiente a aquel en que se produzcan dichas circunstancias y los cuatro posteriores."
  - id: c
    text:
      es: "el año de la adquisición y los cuatro siguientes a la entrada en funcionamiento."
  - id: d
    text:
      es: "los cuatro años siguientes a la adquisición, con independencia de la fecha de utilización."
  explanation:
    es: "El período empieza en el año de la utilización efectiva o entrada en funcionamiento y suma los cuatro siguientes. No cuenta desde la adquisición ni desde el año posterior."
