# anchor: boe-a-1987-28404-art-34
- id: m05-l04-q060
  prompt:
    es: "Según el artículo 34 de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, las retribuciones fijas y mensuales se hacen efectivas por mensualidades completas según la situación del funcionario referida al:"
  options:
  - id: a
    text:
      es: "Último día hábil del mes anterior al que corresponden."
  - id: b
    text:
      es: "Primer día natural del mes siguiente al que corresponden."
  - id: c
    correct: true
    text:
      es: "Primer día hábil del mes a que corresponden."
  - id: d
    text:
      es: "Día 15 del mes a que corresponden."
  explanation:
    es: "El artículo 34 de la Ley 33/1987 dice que las retribuciones fijas y mensuales se harán efectivas por mensualidades completas, con la situación del funcionario referida «al primer día hábil del mes a que corresponden». El último día hábil del mes anterior es una fecha del mes anterior al que corresponden. El primer día natural del mes siguiente aparece en la letra d) del mismo artículo, pero para las pensiones de Clases Pasivas, que se devengan «desde el primer día del mes siguiente al del nacimiento del derecho», no para estas retribuciones. El día 15 no es la fecha de referencia del artículo."
  citation: "art. 34 Ley 33/1987"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-1987-28404-art-34
- id: m05-l04-q062
  prompt:
    es: "¿En cuál de los siguientes meses se liquidan por días las retribuciones fijas y mensuales de los funcionarios del Estado, según la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988?"
  options:
  - id: a
    text:
      es: "En el mes en que se disfrutan las vacaciones anuales."
  - id: b
    text:
      es: "En el mes en que se concede un permiso retribuido."
  - id: c
    correct: true
    text:
      es: "En el mes de reingreso al servicio activo."
  - id: d
    text:
      es: "En el mes en que se reconoce un nuevo trienio."
  explanation:
    es: "El artículo 34.a) liquida por días el mes de toma de posesión del primer destino, el de reingreso al servicio activo y el de incorporación por conclusión de licencias sin derecho a retribución. Las vacaciones, los permisos retribuidos y el reconocimiento de un trienio no alteran la situación del funcionario, y por eso no figuran entre los supuestos de liquidación por días."
  citation: "art. 34.a) Ley 33/1987"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q063
  prompt:
    es: "Según el artículo 33 de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, las pagas extraordinarias de los funcionarios del Estado se devengan, con carácter general:"
  options:
  - id: a
    text:
      es: "El último día hábil de los meses de junio y diciembre."
  - id: b
    text:
      es: "El primer día hábil de los meses de julio y enero."
  - id: c
    correct: true
    text:
      es: "El primer día hábil de los meses de junio y diciembre."
  - id: d
    text:
      es: "El día 15 de los meses de junio y diciembre."
  explanation:
    es: "El artículo 33 dispone que las pagas se devengan «el primer día hábil de los meses de junio y diciembre», con referencia a la situación y derecho del funcionario en esas fechas. El último día hábil de esos meses y el día 15 cambian el día de devengo. La opción de julio y enero cambia los meses."
  citation: "art. 33 Ley 33/1987"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q064
  prompt:
    es: "Según el artículo 33.a) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿entre cuántos días se divide la paga de seis meses para computar cada día de servicios, en la paga de diciembre?"
  options:
  - id: a
    text:
      es: "Entre ciento ochenta y dos días."
  - id: b
    text:
      es: "Entre ciento ochenta días, seis meses de treinta días."
  - id: c
    text:
      es: "Entre trescientos sesenta y cinco días."
  - id: d
    correct: true
    text:
      es: "Entre ciento ochenta y tres días."
  explanation:
    es: "El artículo 33.a) divide la paga de seis meses entre ciento ochenta y dos días (ciento ochenta y tres en años bisiestos) para la paga de junio y entre ciento ochenta y tres para la de diciembre. Los ciento ochenta y dos corresponden a la de junio en un año no bisiesto. Los ciento ochenta serían seis meses de treinta días, que la norma no usa. Los trescientos sesenta y cinco son el año completo, y la paga se calcula sobre seis meses."
  citation: "art. 33.a) Ley 33/1987"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q066
  prompt:
    es: "De acuerdo con el artículo 33.b) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿qué ocurre con la paga de quienes están en activo con licencia sin retribución en las fechas de devengo?"
  options:
  - id: a
    text:
      es: "No devengan la paga extraordinaria correspondiente a esa fecha."
  - id: b
    text:
      es: "Devengan la paga extraordinaria íntegra, sin reducción alguna."
  - id: c
    text:
      es: "Devengan la mitad de la paga extraordinaria, con independencia de la duración de la licencia."
  - id: d
    correct: true
    text:
      es: "Devengan la paga extraordinaria, pero su cuantía se reduce proporcionalmente."
  explanation:
    es: "El artículo 33.b) dice que estos funcionarios «devengarán la correspondiente paga extraordinaria, pero su cuantía experimentará la reducción proporcional» del párrafo a). La opción que niega el devengo contradice el texto. La paga íntegra omite la reducción. La mitad fija sustituye la reducción proporcional por una cuantía que la norma no establece."
  citation: "art. 33.b) Ley 33/1987"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1984-17387-art-24
- id: m05-l04-q070
  prompt:
    es: "Según el artículo 24.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿con el sueldo de qué grupo se compara el del grupo A para fijar su límite máximo?"
  options:
  - id: a
    text:
      es: "Con el sueldo de los funcionarios del grupo B."
  - id: b
    text:
      es: "Con el sueldo de los funcionarios del grupo C."
  - id: c
    correct: true
    text:
      es: "Con el sueldo de los funcionarios del grupo E."
  - id: d
    text:
      es: "Con el sueldo de los funcionarios del grupo D."
  explanation:
    es: "El artículo 24.1 limita el sueldo del grupo A en relación con el del grupo E: no puede exceder en más de tres veces al de ese grupo. Los grupos B, C y D son grupos intermedios que el artículo no toma como referencia del límite."
  citation: "art. 24.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q075
  prompt:
    es: "Según el artículo 33.d) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, si el cese es por jubilación de un funcionario del artículo 34.d), ¿cómo se computan los días del mes del cese?"
  options:
  - id: a
    correct: true
    text:
      es: "Como los de un mes completo, a efectos de la última paga extraordinaria."
  - id: b
    text:
      es: "Como los de medio mes, con independencia del día del cese."
  - id: c
    text:
      es: "Solo los días de servicio efectivamente prestados en ese mes."
  - id: d
    text:
      es: "No se computan, porque la paga se devenga el primer día hábil del mes."
  explanation:
    es: "El artículo 33.d) de la Ley 33/1987 dice que la última paga extraordinaria se devenga el día del cese en cuantía proporcional al tiempo de servicios efectivamente prestados, «salvo que el cese sea por jubilación, fallecimiento o retiro» de los funcionarios del artículo 34.d), «en cuyo caso los días del mes en que se produce dicho cese se computarán como de un mes completo». Contar solo los días de servicio prestados es la regla general de esa letra, de la que la jubilación queda exceptuada. La mitad de mes no es la cifra de la salvedad: la salvedad habla de mes completo. Decir que no se computan los días confunde el devengo ordinario de la paga, el primer día hábil de junio y diciembre, con el devengo en el día del cese."
  citation: "art. 33.d) Ley 33/1987"
  difficulty: 3
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-2002-10337-art-10
- id: m05-l04-q076
  prompt:
    es: "De acuerdo con el artículo 10.3 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, el alojamiento sin concierto ni contrato no puede exceder de los anexos II y III, salvo los importes autorizados por:"
  options:
  - id: a
    text:
      es: "El desayuno y la cena fuera de la residencia habitual."
  - id: b
    text:
      es: "El uso de vehículo particular y los peajes de autopista."
  - id: c
    text:
      es: "El traslado de equipaje y los gastos de representación."
  - id: d
    correct: true
    text:
      es: "El lavado o planchado de ropa y las llamadas oficiales de teléfono."
  explanation:
    es: "El artículo 10.3 admite superar las cuantías de los anexos II y III solo con los importes autorizados por lavado o planchado de ropa, en comisiones de más de cuatro días, y por llamadas oficiales de teléfono. El desayuno ya está comprendido en las cuantías del anexo. El vehículo particular y los peajes se indemnizan por otro concepto. El traslado de equipaje y la representación no son excepciones del artículo."
  citation: "art. 10.3 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "excepción"
# anchor: boe-a-2002-10337-df-cuarta
- id: m05-l04-q077
  prompt:
    es: "Según la disposición final cuarta del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿quién revisa anualmente la cuantía para indemnizar el uso de vehículo particular del artículo 18.1?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, mediante acuerdo publicado en el «Boletín Oficial del Estado»."
  - id: b
    correct: true
    text:
      es: "El Ministerio de Hacienda, mediante revisión anual."
  - id: c
    text:
      es: "La Dirección General de Presupuestos, cada dos años."
  - id: d
    text:
      es: "La Secretaría de Estado de Función Pública, a propuesta de los sindicatos."
  explanation:
    es: "La disposición final cuarta dice que la cuantía del uso de vehículo particular será revisada anualmente por el Ministerio de Hacienda. El acuerdo del Consejo de Ministros es el modo de revisar los anexos II y IV, no el vehículo. La Dirección General de Presupuestos y la Secretaría de Estado de Función Pública no figuran en la disposición, y el plazo de dos años contradice la revisión anual."
  citation: "disposición final cuarta RD 462/2002"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2002-10337-art-30
- id: m05-l04-q078
  prompt:
    es: "Un vocal de un tribunal de acceso al grupo E asiste a una sesión en sábado; su asistencia ordinaria es de 36,72 euros. Sin incremento excepcional autorizado, ¿qué importe percibe según el Real Decreto 462/2002, de 24 de mayo?"
  options:
  - id: a
    text:
      es: "Percibe un total de 36,72 euros."
  - id: b
    text:
      es: "Percibe un total de 59,67 euros."
  - id: c
    text:
      es: "Percibe un total de 73,44 euros."
  - id: d
    correct: true
    text:
      es: "Percibe un total de 55,08 euros."
  explanation:
    es: "Las cuantías del anexo IV se incrementan en el 50 por 100 de su importe en las sesiones de sábado o festivo: 36,72 más 18,36 son 55,08 euros. Los 36,72 euros omiten el incremento. Los 59,67 euros son el 150 por 100 de 39,78, la asistencia de otra categoría. Los 73,44 euros duplican la cuantía en vez de incrementarla en un 50 por 100."
  citation: "art. 30.2 RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2025-24445-art-2
- id: m05-l04-q079
  prompt:
    es: "Según el artículo 2.2 del Real Decreto-ley 14/2025, de 2 de diciembre, por el que se aprueban medidas urgentes en materia de retribuciones en el ámbito del sector público, ¿quién aprueba la aplicación del incremento adicional del 0,5 por ciento?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Ministros, mediante Acuerdo que se publicará en el Boletín Oficial del Estado."
  - id: b
    text:
      es: "El Ministerio de Hacienda, mediante orden que se publicará en el Boletín Oficial del Estado."
  - id: c
    text:
      es: "El Consejo de Ministros, mediante real decreto que se publicará en el Boletín Oficial del Estado."
  - id: d
    text:
      es: "El Instituto Nacional de Estadística, mediante resolución que se publicará en el Boletín Oficial del Estado."
  explanation:
    es: "El artículo 2.2 dice que, una vez publicados por el Instituto Nacional de Estadística los datos del IPC de 2026, «se aprobará la aplicación de este incremento mediante Acuerdo del Consejo de Ministros, que se publicará en el BOE». La opción del Ministerio de Hacienda cambia el órgano y el instrumento. La del real decreto mantiene el órgano, pero el artículo exige un Acuerdo. La del Instituto Nacional de Estadística confunde a quien publica los datos del IPC con quien aprueba el incremento."
  citation: "art. 2.2 RDL 14/2025"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2019-7414-art-62
- id: m05-l04-q080
  prompt:
    es: "Según el artículo 62 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿qué niveles profesionales forman, junto con el nivel E1, el grupo 3 a efectos de indemnización por razón del servicio?"
  options:
  - id: a
    text:
      es: "Los niveles M1 y E0."
  - id: b
    text:
      es: "Los niveles M1 y E2."
  - id: c
    correct: true
    text:
      es: "Los niveles E2 y E0."
  - id: d
    text:
      es: "Los niveles M2 y M1."
  explanation:
    es: "La tabla del artículo 62 sitúa en el grupo 3 los niveles «E2, E1 y E0», así que el nivel E1 comparte grupo con el E2 y el E0. Los niveles M3, M2 y M1 forman el grupo 2: por eso fallan la opción de los niveles M2 y M1 y las dos que juntan el M1 con un nivel E."
  citation: "art. 62 IV Convenio único"
  difficulty: 1
  tags:
  - "composición"
