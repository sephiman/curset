- id: g-structured-log
  term: {en: structured log}
  definition: {en: "A log with a defined, consistent schema or typed fields that downstream systems can reliably parse and interpret."}
  origin: m10-l01
  citation: "otel-logs#structured-logs"
- id: g-span
  term: {en: span}
  definition: {en: "A unit of work or operation. Spans are the building blocks of traces."}
  origin: m10-l01
  citation: "otel-traces#spans"
- id: g-span-context
  term: {en: span context}
  definition: {en: "An immutable object on every span that contains the trace ID, the span ID, the trace flags and the trace state."}
  origin: m10-l01
  citation: "otel-traces#span-context"
- id: g-propagation
  term: {en: propagation}
  definition: {en: "The mechanism that moves context between services and processes. It serializes or deserializes the context object and provides the relevant information to be propagated from one service to another."}
  origin: m10-l01
  citation: "otel-context-propagation#propagation"
- id: g-observability
  term: {en: observability}
  definition: {en: "The ability to observe the internal state of a running system from the outside. It consists of the three pillars: logging, metrics and traces."}
  origin: m10-l01
  citation: "spring-boot-actuator-observability#page-title"
- id: g-gauge
  term: {en: gauge}
  definition: {en: "A metric that represents a single numerical value that can arbitrarily go up and down."}
  origin: m10-l01
  citation: "prom-metric-types#gauge"
- id: g-quantile
  term: {en: φ-quantile}
  definition: {en: "The observation value that ranks at number φ*N among the N observations."}
  origin: m10-l01
  citation: "prom-histograms#quantiles"
