# anchor: boe-a-2003-23186-art-168
- id: m03-l11-q0107
  prompt:
    es: "Si la deuda tributaria está garantizada, ¿qué se hará en primer lugar conforme al artículo 168 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una vez iniciado el procedimiento de apremio?"
  options:
  - id: a
    text:
      es: "Se procederá al embargo de los bienes del obligado, reservando la garantía para el final."
  - id: b
    correct: true
    text:
      es: "Se procederá a ejecutar la garantía a través del procedimiento administrativo de apremio."
  - id: c
    text:
      es: "Se procederá a requerir al obligado para que sustituya la garantía por dinero en efectivo."
  - id: d
    text:
      es: "Se procederá a ejecutar la garantía a través del procedimiento judicial de ejecución."
  explanation:
    es: "Si la deuda está garantizada, se procede en primer lugar a ejecutar la garantía a través del procedimiento administrativo de apremio. Embargar otros bienes antes es una opción excepcional del párrafo segundo, no la regla. Tampoco se requiere sustituir la garantía por dinero, y la ejecución no es judicial."
  citation: "art. 168 LGT"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "apremio"
# anchor: boe-a-2003-23186-art-168
- id: m03-l11-q0108
  prompt:
    es: "Cuando la Administración opta por embargar y enajenar otros bienes antes de ejecutar la garantía, ¿qué ocurre con la garantía prestada según el artículo 168 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Queda sin efecto en su totalidad desde el acuerdo de embargo."
  - id: b
    text:
      es: "Se mantiene íntegra hasta que se ejecuten todos los bienes embargados."
  - id: c
    text:
      es: "Se devuelve al obligado una vez dictada la diligencia de embargo."
  - id: d
    correct: true
    text:
      es: "Queda sin efecto en la parte asegurada por los embargos."
  explanation:
    es: "La garantía prestada queda sin efecto en la parte asegurada por los embargos. No se cancela entera desde el acuerdo, ni se mantiene íntegra hasta ejecutar todos los bienes, ni se devuelve por la mera diligencia."
  citation: "art. 168 LGT"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "apremio"
# anchor: boe-a-2003-23186-art-168
- id: m03-l11-q0110
  prompt:
    es: "Según el artículo 168 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe hacer el obligado cuando solicita que se embarguen otros bienes con anterioridad a la ejecución de la garantía?"
  options:
  - id: a
    correct: true
    text:
      es: "Señalar bienes suficientes al efecto."
  - id: b
    text:
      es: "Prestar una garantía adicional por el importe de los recargos."
  - id: c
    text:
      es: "Renunciar a los recursos contra la providencia de apremio."
  - id: d
    text:
      es: "Acreditar que la garantía ha perdido valor desde su constitución."
  explanation:
    es: "Cuando el obligado lo solicita, debe señalar bienes suficientes al efecto. No se le exige una garantía adicional ni renunciar a los recursos, y el artículo no pide acreditar la pérdida de valor de la garantía."
  citation: "art. 168 LGT"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "apremio"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0112
  prompt:
    es: "Conforme al artículo 74.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA cuando la garantía consiste en aval, fianza, certificado de seguro de caución u otra garantía personal:"
  options:
  - id: a
    text:
      es: "Se requerirá al garante el ingreso de la deuda, con los recargos e intereses que correspondan, sin límite de importe."
  - id: b
    text:
      es: "Se requerirá al obligado el ingreso de la deuda, y solo después al garante por el importe restante."
  - id: c
    correct: true
    text:
      es: "Se requerirá al garante el ingreso de la deuda, con los recargos e intereses que correspondan, hasta el límite del importe garantizado."
  - id: d
    text:
      es: "Se enajenarán los bienes del garante por el procedimiento de enajenación de bienes embargados."
  explanation:
    es: "Frente a una garantía personal, se requiere al garante el ingreso de la deuda, incluidos recargos e intereses, hasta el límite del importe garantizado. El garante no responde sin límite. El requerimiento no se dirige primero al obligado, y la enajenación de bienes sirve para las garantías reales."
  citation: "art. 74.2 RGR"
  difficulty: 3
  tags:
  - "ejecución de garantías"
  - "garantía personal"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0113
  prompt:
    es: "Una deuda de 12.000 euros de Textiles Sandoval, S.L. está garantizada con un aval por 10.000 euros. Notificada la providencia de apremio, no se paga en el plazo del artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, y los recargos e intereses ascienden a 2.600 euros. Conforme al artículo 74.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué importe máximo puede reclamarse al avalista?"
  options:
  - id: a
    text:
      es: "12.000 euros, que es la deuda, sin recargos ni intereses, porque el aval garantiza solo el principal."
  - id: b
    text:
      es: "14.600 euros, que son la deuda, los recargos y los intereses, porque el aval no tiene límite."
  - id: c
    text:
      es: "2.600 euros, que son los recargos y los intereses, porque el principal se reclama al obligado."
  - id: d
    correct: true
    text:
      es: "10.000 euros, que es el límite del importe garantizado, incluidos los recargos e intereses que correspondan."
  explanation:
    es: "Al garante se le requiere el ingreso de la deuda, con recargos e intereses, hasta el límite del importe garantizado: 10.000 euros. Pedirle los 12.000 de la deuda o los 14.600 totales supera ese límite. Y el artículo no reparte el principal al obligado y los accesorios al garante."
  citation: "art. 74.2 RGR"
  difficulty: 3
  tags:
  - "ejecución de garantías"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0114
  prompt:
    es: "De acuerdo con el artículo 74.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el garante personal no ingresa lo requerido, se procederá contra sus bienes:"
  options:
  - id: a
    text:
      es: "En virtud de una nueva providencia de apremio dictada contra el garante y notificada a este."
  - id: b
    correct: true
    text:
      es: "En virtud de la providencia de apremio dictada en relación con el obligado al pago, sin necesidad de nueva notificación."
  - id: c
    text:
      es: "En virtud de la sentencia que declare la responsabilidad del garante, notificada al obligado."
  - id: d
    text:
      es: "En virtud del acuerdo de derivación de responsabilidad al garante, previa audiencia."
  explanation:
    es: "Se procede contra los bienes del garante en virtud de la providencia dictada contra el obligado, sin nueva notificación. No hace falta una nueva providencia, ni una sentencia, ni un acuerdo de derivación con audiencia."
  citation: "art. 74.2 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "garantía personal"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0115
  prompt:
    es: "Si la garantía consiste en hipoteca, prenda u otra de carácter real constituida sobre bienes del obligado al pago susceptibles de enajenación forzosa, ¿qué se hará según el artículo 74.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Se requerirá al obligado el ingreso de la deuda hasta el límite del valor de los bienes gravados."
  - id: b
    text:
      es: "Se procederá a enajenarlos por subasta judicial, a instancia del órgano de recaudación competente."
  - id: c
    correct: true
    text:
      es: "Se procederá a enajenarlos por el procedimiento del reglamento para los bienes embargados de naturaleza igual o similar."
  - id: d
    text:
      es: "Se requerirá a un tercero que ponga los bienes a disposición de la Administración."
  explanation:
    es: "Con una garantía real sobre bienes del obligado, se procede a enajenarlos por el procedimiento que el reglamento prevé para los bienes embargados de naturaleza igual o similar. El requerimiento de ingreso es propio de las garantías personales y del depósito, la subasta no es judicial y el requerimiento al tercero corresponde a la garantía sobre bienes ajenos."
  citation: "art. 74.3 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "garantía real"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0116
  prompt:
    es: "Según el artículo 74.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la garantía está constituida por o sobre bienes de persona distinta del obligado al pago, se le requerirá para que, en el plazo del artículo 62.5, ponga esos bienes a disposición del órgano de recaudación:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo que pague la cuantía debida."
  - id: b
    text:
      es: "Salvo que recurra la providencia de apremio dictada contra el obligado."
  - id: c
    text:
      es: "Sin que pueda evitarlo mediante el pago de la cuantía debida."
  - id: d
    text:
      es: "Salvo que renuncie a la garantía constituida sobre sus bienes."
  explanation:
    es: "Esa persona o entidad debe poner los bienes a disposición del órgano de recaudación, salvo que pague la cuantía debida. Pagar evita la entrega. No basta recurrir la providencia dictada contra otro, y no puede renunciar a la garantía ya constituida."
  citation: "art. 74.4 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "garantía de tercero"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0117
  prompt:
    es: "Marta Ibarra constituyó una hipoteca sobre su local para garantizar la deuda de la sociedad Textiles Quintana, S.L. La deuda no se paga en el plazo del artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria. Conforme al artículo 74.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cómo procede el órgano de recaudación?"
  options:
  - id: a
    text:
      es: "Procede directamente a enajenar el local, sin comunicación previa a Marta Ibarra."
  - id: b
    correct: true
    text:
      es: "Le comunica el impago y le requiere para que en ese plazo ponga el local a disposición del órgano, salvo que pague la cuantía debida."
  - id: c
    text:
      es: "Le notifica una nueva providencia de apremio, como obligada al pago, por el importe de la deuda."
  - id: d
    text:
      es: "Requiere a la sociedad que sustituya la garantía por un aval, y solo después ejecuta el local."
  explanation:
    es: "Es una garantía constituida sobre bienes de persona distinta del obligado: se comunica a esa persona el impago y se le requiere para que, en el plazo del artículo 62.5, ponga los bienes a disposición, salvo que pague. Solo transcurrido ese plazo sin pago ni entrega se enajenan. No se le dirige una nueva providencia, porque no es la obligada al pago, y el artículo no exige requerir a la sociedad para sustituir la garantía."
  citation: "art. 74.4 RGR"
  difficulty: 3
  tags:
  - "ejecución de garantías"
  - "garantía de tercero"
  - "supuesto"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0118
  prompt:
    es: "Según el artículo 74.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué ocurre si transcurre el plazo del artículo 62.5 sin que el tercero haya pagado ni entregado los bienes sobre los que recae la garantía?"
  options:
  - id: a
    text:
      es: "Se procederá a embargar el resto del patrimonio del tercero hasta cubrir la deuda."
  - id: b
    correct: true
    text:
      es: "Se procederá a enajenarlos de acuerdo con lo dispuesto para la enajenación de bienes embargados."
  - id: c
    text:
      es: "Se abrirá un nuevo plazo de igual duración para que los entregue sin recargo."
  - id: d
    text:
      es: "Se procederá a ejecutar la garantía personal que el obligado hubiera prestado."
  explanation:
    es: "Transcurrido el plazo sin pago ni entrega, se enajenan los bienes sobre los que recae la garantía. No se embarga el resto del patrimonio del tercero, no se abre otro plazo y no se ejecuta otra garantía personal."
  citation: "art. 74.4 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "garantía de tercero"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0119
  prompt:
    es: "Conforme al artículo 74.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la garantía consiste en depósito en efectivo, se requerirá al depositario el ingreso de la deuda, incluidos los recargos e intereses que correspondan:"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el límite del depósito constituido, en el plazo establecido en el artículo 62.5 de la Ley General Tributaria."
  - id: b
    text:
      es: "Hasta el límite del importe de la deuda principal, en el plazo establecido en el artículo 62.2 de la Ley General Tributaria."
  - id: c
    text:
      es: "Hasta el límite del depósito constituido, en el plazo de diez días desde el requerimiento."
  - id: d
    text:
      es: "Sin límite alguno, en el plazo establecido en el artículo 62.5 de la Ley General Tributaria."
  explanation:
    es: "Al depositario se le requiere el ingreso hasta el límite del depósito constituido, en el plazo del artículo 62.5. Cambiar el límite por la deuda principal, el plazo por el del artículo 62.2 o por diez días, o suprimir el límite, contradice el texto."
  citation: "art. 74.5 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "depósito"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0120
  prompt:
    es: "En la ejecución de una garantía consistente en depósito en efectivo, ¿qué ocurre según el artículo 74.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación si el depositario es la propia Administración?"
  options:
  - id: a
    text:
      es: "Se requiere el ingreso a la Administración depositaria en el plazo del artículo 62.5."
  - id: b
    correct: true
    text:
      es: "Se aplica el depósito a cancelar las cantidades adeudadas."
  - id: c
    text:
      es: "Se devuelve el depósito al obligado y se embargan otros bienes."
  - id: d
    text:
      es: "Se mantiene el depósito hasta que se resuelva el recurso contra la providencia."
  explanation:
    es: "Si el depositario es la propia Administración, no hay a quién requerir: se aplica el depósito a cancelar las cantidades. No se devuelve al obligado ni se mantiene a la espera de un recurso."
  citation: "art. 74.5 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "depósito"
# anchor: boe-a-2005-14803-art-74
- id: m03-l11-q0121
  prompt:
    es: "¿Cuál de las siguientes garantías se ejecuta, según el artículo 74 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, enajenando los bienes del obligado por el procedimiento previsto para los bienes embargados?"
  options:
  - id: a
    text:
      es: "El aval prestado por una entidad de crédito a favor del obligado."
  - id: b
    text:
      es: "El certificado de seguro de caución emitido a favor de la Hacienda pública."
  - id: c
    text:
      es: "El depósito en efectivo constituido en una entidad de crédito."
  - id: d
    correct: true
    text:
      es: "La hipoteca o la prenda constituida sobre bienes del obligado susceptibles de enajenación forzosa."
  explanation:
    es: "La hipoteca, la prenda u otras garantías reales sobre bienes del obligado se ejecutan enajenando los bienes. El aval y el certificado de seguro de caución son garantías personales, y se ejecutan requiriendo al garante. El depósito en efectivo se ejecuta requiriendo al depositario."
  citation: "art. 74.3 RGR"
  difficulty: 2
  tags:
  - "ejecución de garantías"
  - "garantía real"
