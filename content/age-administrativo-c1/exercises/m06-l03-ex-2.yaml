# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q041
  prompt:
    es: "Señale qué comandos sitúa Microsoft en la parte superior del nuevo menú contextual de un archivo en el Explorador de archivos de Windows 11:"
  options:
  - id: a
    text:
      es: "Abrir, Copiar, Pegar, Cambiar nombre, Propiedades y Eliminar."
  - id: b
    correct: true
    text:
      es: "Cortar, Copiar, Pegar, Cambiar nombre, Compartir y Eliminar."
  - id: c
    text:
      es: "Cortar, Copiar, Pegar, Enviar a, Compartir y Eliminar."
  - id: d
    text:
      es: "Cortar, Copiar, Pegar, Cambiar nombre, Conceder acceso a y Eliminar."
  explanation:
    es: "La ayuda del Explorador dice que Cortar, Copiar, Pegar, Cambiar nombre, Compartir y Eliminar están «en la parte superior del menú contextual». Enviar a está en Mostrar más opciones, como indica la página de compresión («Mostrar más opciones>Enviar a»); Abrir y Propiedades no están en esa lista, y Conceder acceso a está también en Mostrar más opciones."
  citation: "fuente: `ms-win-explorador.html`; «Buscar acciones comunes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q042
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué se selecciona en el menú contextual de un archivo para encontrar los comandos del menú contextual anterior de Windows 10?"
  options:
  - id: a
    text:
      es: "Compartir"
  - id: b
    text:
      es: "Abrir con"
  - id: c
    text:
      es: "Propiedades"
  - id: d
    correct: true
    text:
      es: "Mostrar más opciones"
  explanation:
    es: "La ayuda del Explorador indica que, para encontrar los comandos del menú contextual anterior de Windows 10, se hace clic con el botón derecho en el archivo o carpeta y se selecciona «Mostrar más opciones». Abrir con sirve para elegir la aplicación que abre el archivo, Propiedades muestra las del elemento y Compartir lo comparte."
  citation: "fuente: `ms-win-explorador.html`; «Buscar comandos en el menú contextual anterior de Windows 10»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q043
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las extensiones del menú contextual de Windows 10 en el Explorador de archivos de Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "No están en ningún menú contextual de Windows 11, porque se han retirado."
  - id: b
    text:
      es: "Están en el menú simplificado, pero ya no aparecen en Mostrar más opciones."
  - id: c
    correct: true
    text:
      es: "No todas están en el menú simplificado, pero siempre en Mostrar más opciones."
  - id: d
    text:
      es: "Todas están en el menú simplificado, por lo que Mostrar más opciones desaparece."
  explanation:
    es: "La nota de la página dice: «No todas las extensiones de Windows 10 estarán disponibles en el menú contextual de Windows 11 simplificado, pero siempre estarán disponibles al seleccionar Mostrar más opciones». Por eso no están todas en el menú simplificado, Mostrar más opciones sigue existiendo y las extensiones no se han retirado."
  citation: "fuente: `ms-win-explorador.html`; «Buscar comandos en el menú contextual anterior de Windows 10»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q044
  prompt:
    es: "Según la ayuda del Explorador de archivos de Windows 11, para mover un archivo o una carpeta a otra ubicación se selecciona el elemento y:"
  options:
  - id: a
    text:
      es: "Cambiar nombre; después se escribe la ruta completa de la nueva ubicación."
  - id: b
    text:
      es: "Copiar; después se va a la nueva ubicación y se selecciona Pegar."
  - id: c
    text:
      es: "Compartir; después se elige la nueva ubicación como destino del envío."
  - id: d
    correct: true
    text:
      es: "Cortar; después se va a la nueva ubicación y se selecciona Pegar."
  explanation:
    es: "La página indica: «Para mover la ubicación de un archivo o carpeta, selecciónelo y, a continuación, seleccione Cortar». Después se va a la nueva ubicación y se selecciona Pegar. Copiar deja el original donde estaba; Compartir sirve para compartir el archivo, y Cambiar nombre cambia el nombre, no la ubicación."
  citation: "fuente: `ms-win-explorador.html`; «Explorador de archivos en Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q045
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, en una ruta de acceso UNC, ¿qué precede al nombre del servidor o del host?"
  options:
  - id: a
    text:
      es: "Una letra de unidad seguida de dos puntos (C:)"
  - id: b
    correct: true
    text:
      es: "Dos barras diagonales inversas (\\\\)"
  - id: c
    text:
      es: "Dos barras inversas y un signo de interrogación (\\\\?\\)"
  - id: d
    text:
      es: "Una sola barra diagonal inversa (\\)"
  explanation:
    es: "La página dice que una ruta UNC empieza por «un servidor o un nombre de host, precedido por \\\\». Una sola barra inversa al principio da una ruta relativa a la raíz de la unidad actual; la letra de unidad con dos puntos es propia de las rutas DOS, y \\\\?\\ es el especificador de las rutas de acceso de dispositivo DOS."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q046
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, ¿cuál de las siguientes descripciones corresponde a la ruta UNC \\\\system07\\C$\\?"
  options:
  - id: a
    correct: true
    text:
      es: "El directorio raíz de la unidad C: en el equipo system07"
  - id: b
    text:
      es: "La unidad C: del equipo local con permisos de administrador"
  - id: c
    text:
      es: "Un archivo llamado C$ guardado en el servidor system07"
  - id: d
    text:
      es: "La carpeta system07 dentro de la unidad C: del equipo local"
  explanation:
    es: "La tabla de la página da para \\\\system07\\C$\\ «Directorio raíz de la unidad C: en system07». La página describe la ruta UNC como un servidor o nombre de host precedido por \\\\ y un recurso compartido separado por \\; por eso system07 es el equipo remoto, no una carpeta de C: del equipo local, y C$ es el recurso compartido que da la raíz de la unidad, no un archivo. Y que sea la unidad del equipo local con permisos de administrador contradice que la ruta UNC sirve «para acceder a los recursos de red»."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q047
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, en la ruta UNC \\\\Server2\\Share\\Test\\Foo.txt, el nombre del servidor y el del recurso compartido forman juntos:"
  options:
  - id: a
    correct: true
    text:
      es: "El volumen de la ruta de acceso."
  - id: b
    text:
      es: "El nombre de archivo de la ruta."
  - id: c
    text:
      es: "El directorio actual de la ruta."
  - id: d
    text:
      es: "El especificador de dispositivo de la ruta."
  explanation:
    es: "La página dice del recurso compartido que, «juntos, el nombre del servidor y el del recurso compartido forman el volumen»; su ejemplo describe Foo.txt como un archivo del volumen \\\\Server2\\Share. A las rutas UNC no se les aplica el directorio actual; el especificador de dispositivo (\\\\.\\ o \\\\?\\) es propio de las rutas de dispositivo DOS, y el nombre de archivo es aquí Foo.txt."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q048
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, ¿cuál de las siguientes afirmaciones sobre el nombre del servidor en una ruta UNC es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Puede ser un nombre NetBIOS o una dirección IP/FQDN, en IPv4 o v6."
  - id: b
    text:
      es: "Puede ser una dirección IP, pero solo en su versión IPv4, no en la v6."
  - id: c
    text:
      es: "Solo puede ser un nombre de equipo NetBIOS, nunca una dirección IP."
  - id: d
    text:
      es: "Debe ser una letra de unidad asignada seguida del carácter de dos puntos."
  explanation:
    es: "La página dice: «El nombre del servidor puede ser un nombre de equipo NetBIOS o una dirección IP/FQDN (se admiten IPv4, así como v6)». No se limita a NetBIOS ni a IPv4, y la letra de unidad con dos puntos es el primer componente de las rutas DOS, no el servidor de una ruta UNC."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q049
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, ¿cómo se pueden usar rutas de acceso relativas con una ruta UNC?"
  options:
  - id: a
    text:
      es: "Omitiendo el servidor y escribiendo solo el recurso compartido"
  - id: b
    text:
      es: "Empezando la ruta por dos separadores y un punto (\\\\.\\)"
  - id: c
    correct: true
    text:
      es: "Solo asignando la ruta UNC a una letra de unidad"
  - id: d
    text:
      es: "Empezando la ruta por un único separador (\\)"
  explanation:
    es: "La página dice que las rutas UNC «siempre deben ser completas» y que «solo puede usar rutas de acceso relativas mediante la asignación de una ruta de acceso UNC a una letra de unidad». Una ruta que empieza por un único separador es relativa a la raíz de la unidad actual, no a una ruta UNC; la que empieza por \\\\.\\ es una ruta de dispositivo, y una ruta UNC necesita el servidor delante del recurso compartido."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q050
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, ¿cuál de las siguientes rutas es una ruta UNC?"
  options:
  - id: a
    text:
      es: "\\\\?\\C:\\Test\\Foo.txt"
  - id: b
    correct: true
    text:
      es: "\\\\system07\\C$\\"
  - id: c
    text:
      es: "\\Program Files\\Custom Utilities\\StringFinder.exe"
  - id: d
    text:
      es: "C:\\Documents\\Newsletters\\Summer2018.pdf"
  explanation:
    es: "La página identifica las rutas UNC como las que «comienzan con dos separadores sin signo de interrogación o punto», como \\\\system07\\C$\\. La que empieza por C:\\ es una ruta DOS completa; la que empieza por \\\\?\\ es una ruta de acceso de dispositivo, y la que empieza por un único separador es relativa a la raíz de la unidad actual."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Identificación de la ruta de acceso»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-dotnet-rutas-unc-html
- id: m06-l03-q051
  prompt:
    es: "Según la documentación de Microsoft sobre formatos de ruta en Windows, ¿cuál de las siguientes afirmaciones sobre las rutas de acceso UNC es correcta?"
  options:
  - id: a
    text:
      es: "Pueden ser relativas al directorio actual, igual que las rutas de acceso DOS."
  - id: b
    text:
      es: "No pueden incluir nunca segmentos de directorio relativos (. y ..)."
  - id: c
    correct: true
    text:
      es: "Deben ser siempre completas, aunque pueden incluir segmentos relativos (. y ..)."
  - id: d
    text:
      es: "Se les aplica el último directorio actual de la unidad especificada."
  explanation:
    es: "La página dice que las rutas UNC «siempre deben ser completas» y que «pueden incluir segmentos de directorio relativos (. y ..), pero deben formar parte de una ruta completa». Por eso no son relativas al directorio actual y sí admiten esos segmentos. La misma página dice que a las rutas UNC no se les aplica el directorio actual."
  citation: "fuente: `ms-dotnet-rutas-unc.html`; «Rutas de acceso UNC»"
  difficulty: 3
  tags:
  - "concepto"
