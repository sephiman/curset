# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0278
  prompt:
    es: "Un contribuyente fallece en 2026 siendo titular de acciones adquiridas por 10.000 euros que valen 25.000 euros el día de su muerte, y las reciben sus herederos. Conforme al artículo 33.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo tributa su variación de valor?"
  options:
  - id: a
    text:
      es: "Existe una ganancia de 15.000 euros, diferencia entre el valor de transmisión y el de adquisición, que se integra en el último período impositivo del fallecido."
  - id: b
    text:
      es: "No existe ganancia para el fallecido, pero los herederos integran 15.000 euros como ganancia patrimonial en su período impositivo."
  - id: c
    text:
      es: "Existe una ganancia de 25.000 euros, valor de las acciones en la fecha del fallecimiento, que se imputa a los herederos en su período impositivo."
  - id: d
    correct: true
    text:
      es: "No existe ganancia patrimonial, porque se estima que no la hay en las transmisiones lucrativas por causa de muerte del contribuyente."
  explanation:
    es: "Se estima que no existe ganancia o pérdida patrimonial con ocasión de transmisiones lucrativas por causa de muerte del contribuyente (art. 33.3.b), así que la variación de 15.000 euros no se integra en la renta del fallecido. Calcular la ganancia como diferencia entre los valores de adquisición y transmisión (art. 34.1) no vale aquí, porque la regla del artículo 33.3 la excluye. Imputar los 25.000 euros a los herederos tampoco: la adquisición por herencia está sujeta al Impuesto sobre Sucesiones y Donaciones y no al impuesto sobre la renta (art. 6.4). Por la misma razón los herederos no integran los 15.000 euros como ganancia patrimonial."
  citation: "art. 33.3 LIRPF"
  difficulty: 2
  tags:
  - "ganancias patrimoniales"
  - "sucesiones"
