# SPDX-License-Identifier: AGPL-3.0-only
# aeat-agentes-hacienda course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/aeat-agentes-course-requirements.md v1.1 (a delta to the C1 and C2 requirements). Programme:
# sources/programa.md (Anexo I, BOE-A-2025-27056). Module mNN is part NN of the programme (01 = I, 02 = II, 03 = III;
# the BOE does not number its three epígrafes, the course does) and lesson mNN-lMM its tema MM, so ids follow the
# official numbering. Block «Proceso selectivo» sits before the programme: m00 is the two exercises.
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are placeholders until round R2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: aeat-agentes-hacienda
  title:
    es: Agentes de la Hacienda Pública (C1)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: AEAT · acceso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Administrativo de la Administración del Estado, especialidad de Agentes de la
      Hacienda Pública, acceso libre, resumido tema a tema.
  languages: [es]
  status: draft
  # Stage 2 brings the first-exercise bank (requirements R6.1); until then the course declares none (delta section M).
  exercise_types: []
  # «Por tema» instead of «Por lección» in results and stats.
  lesson_noun:
    es: tema
  option_labels: letters
  # The PDF exports theory only.
  pdf_exercises: false
  # glyph / color: left for the publication round (docs/identity.md; R2.2 of the course requirements), with a glyph
  # distinct from C1's and C2's in the same family. No figures: this course has no figures/ tree.
blocks:
- id: block-a
  title:
    es: Proceso selectivo
  modules:
  - id: m00
    title:
      es: Los ejercicios
    summary:
      es: Las reglas de los dos ejercicios de la convocatoria de acceso libre.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el proceso selectivo
      summary:
        es: El primer ejercicio es un test de 80 preguntas sobre todo el programa, con un cuarto de penalización por
          error. El segundo son diez supuestos prácticos de los temas tributarios, contestados por escrito. La lección
          explica cómo se puntúan y qué cubre el curso.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización del Estado y funcionamiento de la Administración General del Estado
    summary:
      es: 'La Constitución, las Cortes Generales, el Poder Judicial, el Gobierno y la Administración del Estado, la
        organización territorial y las instituciones de la Unión Europea. Siguen la administración electrónica, la
        transparencia y la protección de datos, las políticas de igualdad y el régimen del personal funcionario.'
    lessons:
    - id: m01-l01
      title:
        es: 'La Constitución Española de 1978: Estructura y contenido. Derechos y deberes fundamentales. Su garantía y
          suspensión. La Corona. El Tribunal Constitucional.'
      summary:
        es: 'La Constitución de 1978 tiene un preámbulo, un título preliminar, diez títulos y 169 artículos. Reconoce
          derechos y deberes fundamentales, con sus garantías y su suspensión, y regula la Corona y el Tribunal
          Constitucional. Se reforma por un procedimiento ordinario y otro agravado.'
    - id: m01-l02
      title:
        es: 'Las Cortes Generales: Composición, atribuciones y funcionamiento. El Defensor del Pueblo. El Poder Judicial.
          El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial española.'
      summary:
        es: 'Las Cortes Generales, formadas por el Congreso y el Senado, representan al pueblo español y ejercen la
          potestad legislativa. El Defensor del Pueblo es su alto comisionado para defender los derechos del título I.
          La justicia la administran Jueces y Magistrados independientes, con el Consejo General del Poder Judicial como
          órgano de gobierno y el Tribunal Supremo como órgano jurisdiccional superior en todos los órdenes, salvo en
          garantías constitucionales.'
    - id: m01-l03
      title:
        es: 'El Gobierno: Nombramiento y cese. Las funciones del Gobierno. La Administración Pública: Principios
          constitucionales informadores. La Administración central y periférica del Estado. Tipos de Entes
          Públicos.'
      summary:
        es: 'El Gobierno lo forman el Presidente, los Vicepresidentes, en su caso, y los Ministros; dirige la política
          interior y exterior, la Administración civil y militar y la defensa del Estado. La Administración General del
          Estado comprende la Organización Central, la Organización Territorial y la Administración General del Estado
          en el exterior. El sector público institucional estatal comprende organismos públicos, autoridades
          administrativas independientes, sociedades mercantiles estatales, consorcios, fundaciones del sector público,
          fondos sin personalidad jurídica y universidades públicas no transferidas.'
    - id: m01-l04
      title:
        es: 'La organización territorial del Estado. Comunidades y Ciudades Autónomas. Las Entidades Locales. Las
          Instituciones de la Unión Europea: El Consejo, el Parlamento Europeo, la Comisión, el Tribunal de
          Justicia.'
      summary:
        es: 'El Estado se organiza en municipios, provincias y Comunidades Autónomas; Ceuta y Melilla son Ciudades
          Autónomas con Estatuto propio. La Administración local tiene su ley básica en la LBRL, que regula el
          municipio, la provincia y la isla. La Unión Europea tiene siete instituciones, entre ellas el Consejo Europeo,
          el Consejo, el Parlamento Europeo, la Comisión y el Tribunal de Justicia.'
    - id: m01-l05
      title:
        es: 'El funcionamiento electrónico del sector público. Derecho y obligación de relacionarse electrónicamente con
          las Administraciones Públicas, registros y archivo electrónico. El Gobierno abierto, la
          transparencia, el acceso a la información pública, la participación en la rendición de cuentas y el
          buen gobierno. Normativa reguladora de la protección de datos personales: principios, derechos de
          las personas y ejercicios de los derechos.'
      summary:
        es: 'El sector público actúa por medios electrónicos: sede, registro, archivo, firma y relación con los
          interesados se regulan en la LRJSP, la LPAC y el RD 203/2021. La Ley 19/2013 obliga a publicar información y
          reconoce el derecho de acceso, con el Consejo de Transparencia y Buen Gobierno como órgano de control. El RGPD
          y la LOPDGDD fijan los principios y los derechos en protección de datos.'
    - id: m01-l06
      title:
        es: 'Políticas de igualdad de género, no discriminación y contra la violencia de género. Discapacidad y
          dependencia: régimen jurídico.'
      summary:
        es: 'La LO 3/2007 prohíbe la discriminación por razón de sexo y fija medidas de igualdad en el empleo público;
          la LO 1/2004 protege a las víctimas de violencia de género. La Ley 15/2022 y la Ley 4/2023 regulan la igualdad
          de trato y los derechos de las personas LGTBI. El RDL 1/2013 y la Ley 39/2006 regulan la discapacidad y la
          dependencia.'
    - id: m01-l07
      title:
        es: Régimen jurídico del personal al servicio de las Administraciones Públicas. El Estatuto Básico del Empleado
          Público. Derechos y deberes de los funcionarios. La provisión de puestos de trabajo y la carrera
          administrativa. Situaciones administrativas. Incompatibilidades y régimen disciplinario. El régimen
          de Seguridad Social de los funcionarios.
      summary:
        es: 'El TREBEP regula las clases de empleados públicos, sus derechos y deberes, la provisión de puestos, la
          carrera, las situaciones y el régimen disciplinario; en la AGE rigen además la Ley 30/1984 y sus reglamentos.
          Las incompatibilidades están en la Ley 53/1984. Los funcionarios civiles del Estado tienen un régimen especial
          de Seguridad Social con dos mecanismos: el mutualismo administrativo, que gestiona MUFACE, y las Clases
          Pasivas.'
  - id: m02
    title:
      es: Derecho Administrativo General
    summary:
      es: 'Las fuentes del derecho administrativo, el acto administrativo y su revisión de oficio, el procedimiento
        administrativo común y los recursos, administrativos y contencioso-administrativo.'
    lessons:
    - id: m02-l01
      title:
        es: Las fuentes del Derecho Administrativo. La jerarquía de las fuentes. La Constitución. La Ley. El Reglamento.
          El ordenamiento jurídico de la Unión Europea.
      summary:
        es: 'Las fuentes del ordenamiento son la ley, la costumbre y los principios generales del derecho, y una
          disposición que contradiga otra de rango superior carece de validez. El decreto legislativo, el decreto-ley y
          el reglamento tienen sus límites, y el reglamento sigue un procedimiento de elaboración propio. La Unión
          Europea se fundamenta en los Tratados y adopta reglamentos, directivas y decisiones por el procedimiento
          legislativo ordinario o por uno especial.'
    - id: m02-l02
      title:
        es: Los actos administrativos. Concepto y clases. Motivación, forma y eficacia de los actos administrativos.
          Notificación y publicación. Nulidad y anulabilidad. La revisión de oficio.
      summary:
        es: 'La LPAC fija la forma, la motivación, la eficacia, la notificación y la publicación de los actos
          administrativos. El acto nulo de pleno derecho y el anulable se distinguen por sus causas. La Administración
          puede revisar de oficio sus propios actos.'
    - id: m02-l03
      title:
        es: El procedimiento administrativo común. La capacidad de obrar y el concepto de interesado. Representación.
          Identificación y firma de los interesados. Derechos del interesado en el procedimiento
          administrativo. Obligación de resolver y silencio administrativo. Términos y plazos.
      summary:
        es: 'Los interesados actúan con capacidad de obrar, por sí o por representante, y tienen los derechos de los
          artículos 13 y 53 de la LPAC. La Administración debe resolver y notificar en plazo, y en los procedimientos
          iniciados a solicitud del interesado el silencio es estimatorio salvo las excepciones del artículo 24.1 de la
          LPAC. Los plazos en días se cuentan en días hábiles salvo que una ley o el derecho de la Unión digan otra
          cosa.'
    - id: m02-l04
      title:
        es: 'Las fases del procedimiento administrativo: Iniciación, ordenación, instrucción y finalización. La ejecución
          de los actos y resoluciones administrativas.'
      summary:
        es: 'El procedimiento se inicia de oficio o a solicitud del interesado, se ordena e instruye y termina por
          resolución, desistimiento, renuncia o caducidad. Los actos son ejecutivos, y la Administración puede
          ejecutarlos forzosamente por apremio, ejecución subsidiaria, multa coercitiva o compulsión sobre las
          personas.'
    - id: m02-l05
      title:
        es: 'Los recursos administrativos: concepto y clases. Recurso de alzada. Recurso potestativo de reposición.
          Recurso extraordinario de revisión. La jurisdicción contencioso-administrativa: objeto y plazos de
          interposición del recurso contencioso-administrativo.'
      summary:
        es: 'Los actos se recurren en alzada, en reposición o con el recurso extraordinario de revisión, cada uno con
          sus causas y plazos. El recurso contencioso-administrativo se interpone en dos meses contra el acto expreso y
          en seis contra el presunto. La LJCA fija qué actividad es impugnable y qué cuestiones quedan fuera de ese
          orden.'
  - id: m03
    title:
      es: Organización de la Hacienda Pública y Derecho Tributario
    summary:
      es: 'El módulo trata el sistema fiscal español y sus principios constitucionales, la Hacienda Pública estatal,
        autonómica y local y la Agencia Estatal de Administración Tributaria. De la Ley General Tributaria y sus
        reglamentos recoge, entre otras materias, los tributos, los obligados tributarios, la gestión, la inspección,
        la recaudación, las sanciones y la revisión. Siguen el IRPF, el Impuesto sobre Sociedades, el IVA y la
        Aduana.'
    lessons:
    - id: m03-l01
      title:
        es: El sistema fiscal español. Principios impositivos en la Constitución Española. Los impuestos de titularidad
          estatal y sus características. La Hacienda Pública Estatal, Autonómica y Local.
      summary:
        es: 'El sistema tributario se inspira en los principios de igualdad y progresividad, y la potestad originaria
          para establecer los tributos corresponde exclusivamente al Estado, mediante ley. La ley de cada impuesto
          estatal dice qué grava y si es directo o indirecto. Las Haciendas autonómica y local se financian con los
          recursos que fijan la CE, la LOFCA, la Ley 22/2009 y el TRLRHL.'
    - id: m03-l02
      title:
        es: 'La Agencia Estatal de Administración Tributaria: creación, naturaleza, objetivos, funciones y organización.'
      summary:
        es: 'La AEAT es un ente de derecho público creado por el artículo 103 de la Ley 31/1990; su Presidente tiene
          rango de Secretario de Estado y su Director General, de Subsecretario. Su organización central son los
          departamentos, con rango de dirección general, y los servicios y la Delegación Central de Grandes
          Contribuyentes, con rango de dirección adjunta. Su organización territorial son las Delegaciones Especiales,
          las Delegaciones y las Administraciones.'
    - id: m03-l03
      title:
        es: 'Derecho Tributario: concepto y contenido. Fuentes. Los tributos: concepto y clasificación. La obligación
          tributaria. Hecho imponible. Devengo. Base imponible y liquidable. Cuota y deuda tributaria.'
      summary:
        es: 'El derecho tributario de la LGT parte de sus principios y fuentes y define los tributos y sus clases:
          tasas, contribuciones especiales e impuestos. La obligación tributaria principal nace con el devengo del
          hecho imponible y se cuantifica con la base imponible, la base liquidable, el tipo de gravamen y las cuotas.
          La deuda tributaria la integra la cuota y, en su caso, el interés de demora y los recargos, entre ellos los
          del artículo 27 por declaración extemporánea.'
    - id: m03-l04
      title:
        es: Obligaciones tributarias formales. Derechos y garantías de los obligados tributarios. Los obligados
          tributarios. La capacidad de obrar en el orden tributario. Representación y domicilio fiscal. Plazos
          de prescripción.
      summary:
        es: 'Entre las obligaciones tributarias formales están las de presentar declaraciones censales, solicitar y
          utilizar el número de identificación fiscal, llevar y conservar libros de contabilidad y registros, y
          expedir y entregar facturas. La LGT reconoce los derechos y garantías de los obligados tributarios y regula
          los sujetos pasivos, los sucesores, los responsables, la capacidad de obrar, la representación y el
          domicilio fiscal. Los derechos del artículo 66 de la LGT prescriben a los cuatro años, con reglas propias de
          cómputo e interrupción.'
    - id: m03-l05
      title:
        es: 'Información y Asistencia a los obligados tributarios. La colaboración social en la aplicación de los
          tributos. Carácter reservado de los datos con trascendencia tributaria. Normas comunes sobre
          actuaciones y procedimientos tributarios: fases. Las liquidaciones tributarias. Obligación de
          resolver y plazos de resolución. Carga de la prueba. Las notificaciones.'
      summary:
        es: 'La Administración informa y asiste a los obligados tributarios mediante publicaciones, comunicaciones,
          contestaciones a consultas escritas, actuaciones previas de valoración y asistencia en sus declaraciones,
          entre otras actuaciones, y los datos con trascendencia tributaria tienen carácter reservado. Los
          procedimientos tributarios siguen normas comunes de iniciación, desarrollo y terminación, y su resolución se
          notifica en el plazo que fija la normativa de cada uno, que no puede exceder de seis meses salvo norma con
          rango de ley o normativa comunitaria europea y que es de seis meses si no se fija. Las notificaciones siguen
          las normas administrativas generales con las especialidades de los artículos 109 a 112 de la LGT.'
    - id: m03-l06
      title:
        es: 'Las declaraciones tributarias: concepto y clases. Las autoliquidaciones. Las comunicaciones de datos. Los
          pagos a cuenta.'
      summary:
        es: 'La declaración tributaria es todo documento presentado ante la Administración tributaria donde se reconozca
          o manifieste la realización de cualquier hecho relevante para la aplicación de los tributos. Las
          autoliquidaciones y las comunicaciones de datos son declaraciones, y caben autoliquidaciones complementarias
          y declaraciones o comunicaciones complementarias o sustitutivas. Los pagos a cuenta son las retenciones, los
          ingresos a cuenta y los pagos fraccionados; los del IRPF los regulan su ley y su reglamento, y los del IS,
          su ley.'
    - id: m03-l07
      title:
        es: 'Actuaciones y procedimiento de gestión tributaria. Los procedimientos de gestión tributaria: iniciación,
          trámites y terminación. El procedimiento de verificación de datos. El procedimiento de comprobación
          de valores. El procedimiento de comprobación limitada. Rectificación de autoliquidaciones,
          declaraciones, comunicaciones de datos e iniciación del procedimiento de devolución.'
      summary:
        es: 'Los procedimientos de gestión tributaria de la LGT y el RGAT son, entre otros, el de devolución, el
          iniciado mediante declaración, el de verificación de datos, el de comprobación de valores y el de
          comprobación limitada. Cada uno tiene sus supuestos de inicio, sus trámites y sus formas de terminación. La
          rectificación de autoliquidaciones y el procedimiento de devolución tienen reglas propias en el RGAT.'
    - id: m03-l08
      title:
        es: 'Actuaciones y procedimiento de inspección: funciones y facultades. Documentación de las actuaciones de
          inspección. La personación de la inspección en el domicilio o locales del contribuyente. El
          procedimiento de inspección: iniciación, desarrollo y terminación. Las medidas cautelares en el
          procedimiento inspector.'
      summary:
        es: 'La inspección de los tributos comprueba e investiga, con facultades de examen, entrada y requerimiento, y
          documenta sus actuaciones en comunicaciones, diligencias, informes y actas. Las actuaciones del
          procedimiento inspector deben concluir en 18 meses, o en 27 en los supuestos del artículo 150.1 de la LGT, y
          sus actas pueden ser con acuerdo, de conformidad o de disconformidad. Durante el procedimiento pueden
          adoptarse medidas cautelares.'
    - id: m03-l09
      title:
        es: 'La extinción de la deuda tributaria (I). Medios de extinción de la deuda. El pago o cumplimiento: forma,
          momento, plazos, imputación, consignación y medios de pago. Aplazamiento y fraccionamiento del
          pago.'
      summary:
        es: 'Las deudas tributarias pueden extinguirse por pago, prescripción, compensación o condonación, por los
          medios previstos en la normativa aduanera y por los demás medios previstos en las leyes. La LGT y el RGR
          regulan la forma, el momento, los plazos, la imputación y la consignación del pago. El aplazamiento y el
          fraccionamiento se conceden previa solicitud del obligado, devengan intereses de demora y deben
          garantizarse, aunque no se exigen garantías, entre otros casos, cuando la deuda en conjunto no excede de
          50.000 euros, límite que fija la Orden HFP/311/2023.'
    - id: m03-l10
      title:
        es: 'La extinción de la deuda tributaria (II). Otras formas de extinción de las deudas: la compensación, la
          extinción de deudas de las entidades de derecho público mediante deducciones sobre transferencias.
          La condonación. Baja provisional por insolvencia. Terminación del procedimiento de apremio.'
      summary:
        es: 'La deuda tributaria se extingue también por compensación, de oficio o a instancia del obligado, por
          deducciones sobre transferencias a las entidades de derecho público y por condonación, solo en virtud de
          ley. Si los obligados al pago resultan fallidos, el crédito se declara incobrable y se da de baja
          provisional. El procedimiento de apremio termina con el pago, con la declaración de crédito incobrable o con
          la extinción de la deuda por otra causa.'
    - id: m03-l11
      title:
        es: 'Las actuaciones y el procedimiento de recaudación tributaria: la recaudación en período ejecutivo.
          Iniciación. Efectos. Recargos del período ejecutivo. Procedimiento de apremio: características,
          concurrencia y suspensión del procedimiento. Providencia de apremio: concepto y plazos para el pago.
          Las garantías de la deuda tributaria: tipos y ejecución de garantías.'
      summary:
        es: 'El período ejecutivo se inicia, para las deudas liquidadas por la Administración, el día siguiente al del
          vencimiento del plazo de ingreso del artículo 62 de la LGT, y para las autoliquidadas sin ingreso, al día
          siguiente de la finalización del plazo de ingreso o, si este ya hubiera concluido, el día siguiente a la
          presentación de la autoliquidación. Sus recargos son del 5 %, del 10 % o del 20 %, según el momento del
          pago, y la deuda apremiada se paga en los plazos del artículo 62.5 de la LGT. Entre las garantías de la
          deuda tributaria están el derecho de prelación, la hipoteca legal tácita, la afección de bienes, el derecho
          de retención y las medidas cautelares.'
    - id: m03-l12
      title:
        es: 'El embargo. Facultades de la recaudación. Las diligencias de embargo: concepto y motivos de oposición.
          Práctica del embargo de bienes y derechos. Depósito y enajenación de los bienes embargados. El
          procedimiento frente a responsables. Procedimiento de recaudación frente a los sucesores.'
      summary:
        es: 'El embargo se practica sobre los bienes y derechos del obligado en cuantía suficiente para cubrir la deuda,
          los intereses, los recargos y las costas, atendiendo a la mayor facilidad de su enajenación y la menor
          onerosidad para el obligado, y por el orden del artículo 169.2 de la LGT cuando esos criterios son de
          imposible o muy difícil aplicación. Contra la diligencia de embargo solo caben los motivos de oposición del
          artículo 170.3 de la LGT. Los bienes embargados se enajenan por subasta, concurso o adjudicación directa, y
          la recaudación se dirige también contra los responsables y los sucesores.'
    - id: m03-l13
      title:
        es: 'La potestad sancionadora en materia tributaria. Principios. Sujetos responsables. Concepto y clases de
          infracciones y sanciones tributarias. Cuantificación de las sanciones tributarias pecuniarias.
          Extinción de la responsabilidad derivada de las infracciones tributarias y extinción de las
          sanciones tributarias. Procedimiento sancionador en materia tributaria: iniciación, instrucción y
          terminación.'
      summary:
        es: 'La potestad sancionadora tributaria se ejerce de acuerdo con los principios de la potestad sancionadora en
          materia administrativa, con las especialidades de la LGT, entre ellos el de no concurrencia de sanciones.
          Las infracciones son leves, graves o muy graves; las sanciones pecuniarias se gradúan por los criterios del
          artículo 187 de la LGT y se reducen por conformidad, por acta con acuerdo o por pronto pago. El
          procedimiento sancionador se tramita de forma separada, salvo renuncia, y debe concluir en seis meses desde
          la notificación de su inicio.'
    - id: m03-l14
      title:
        es: Revisión en vía administrativa. El recurso de reposición. Las reclamaciones económico-administrativas. Los
          Tribunales Económico-Administrativos.
      summary:
        es: 'Los actos tributarios se revisan por los procedimientos especiales de revisión, por el recurso de
          reposición, potestativo, y por las reclamaciones económico-administrativas. El recurso de reposición y la
          reclamación se interponen en el plazo de un mes. Los órganos económico-administrativos del Estado son el
          Tribunal Económico-Administrativo Central y los tribunales económico-administrativos regionales y locales, y
          tiene también esa consideración la Sala Especial para la Unificación de Doctrina.'
    - id: m03-l15
      title:
        es: 'El Impuesto sobre la Renta de las Personas Físicas (I). Naturaleza, objeto y ámbito de aplicación. Sujeción
          al impuesto: aspectos materiales, personales y temporales. Rendimientos del trabajo, rendimientos
          del capital mobiliario, rendimientos del capital inmobiliario, rendimientos de actividades
          económicas. Imputación de rentas inmobiliarias. Ganancias y pérdidas patrimoniales.'
      summary:
        es: 'El IRPF grava la renta de las personas físicas: los rendimientos del trabajo, del capital y de las
          actividades económicas, las ganancias y pérdidas patrimoniales y las imputaciones de renta. La LIRPF regula,
          entre otras materias, quién es contribuyente, las rentas exentas, el período impositivo y el devengo, y cómo
          se calcula cada clase de renta. El artículo 85 de la LIRPF imputa renta por los inmuebles urbanos, y por los
          rústicos con construcciones no indispensables para explotaciones agrícolas, ganaderas o forestales, no
          afectos a actividades económicas ni generadores de rendimientos del capital, excluida la vivienda habitual y
          el suelo no edificado; desde el 01-01-2027 rige una redacción nueva de su apartado 1 (Real Decreto-ley
          29/2026, convalidación pendiente).'
    - id: m03-l16
      title:
        es: 'El Impuesto sobre la Renta de las Personas Físicas (II): clases de Renta. Integración y compensación de
          rentas. Base liquidable general y del ahorro. Adecuación del impuesto a las circunstancias
          personales y familiares del contribuyente. Cálculo del impuesto estatal. Cuota diferencial.
          Tributación familiar. Gestión del Impuesto.'
      summary:
        es: 'La renta del IRPF se clasifica en general y del ahorro, y sus componentes se integran y compensan para
          formar la base imponible general y la del ahorro, de las que se obtienen las bases liquidables. La parte de
          la base liquidable que corresponde al mínimo personal y familiar no se somete a tributación. La LIRPF regula
          también el cálculo del impuesto estatal, la cuota diferencial, la tributación conjunta de la unidad familiar
          y la gestión del impuesto.'
    - id: m03-l17
      title:
        es: 'El Impuesto sobre Sociedades: naturaleza y ámbito de aplicación. Hecho imponible. Contribuyentes. Concepto y
          determinación de la base imponible. Reglas de imputación temporal. Reducciones en la base imponible.
          Período impositivo y devengo del impuesto. Tipo de gravamen y cuota íntegra. Deducciones para evitar
          la doble imposición internacional. Bonificaciones. Declaración, autoliquidación y liquidación
          provisional. Devolución.'
      summary:
        es: 'El Impuesto sobre Sociedades es un tributo de carácter directo y naturaleza personal que grava la renta de
          las sociedades y demás entidades jurídicas. En el método de estimación directa, su base imponible se calcula
          corrigiendo el resultado contable mediante los preceptos de la LIS, con reglas de imputación temporal y
          reducciones. El tipo general es del 25 por ciento, con los tipos especiales del artículo 29 de la LIS, y
          sobre la cuota íntegra se aplican las bonificaciones y deducciones que procedan, entre ellas las deducciones
          para evitar la doble imposición internacional.'
    - id: m03-l18
      title:
        es: 'El Impuesto sobre el Valor Añadido (I). Naturaleza y ámbito de aplicación. Entregas de bienes y prestaciones
          de servicios: hecho imponible. Exenciones. Lugar de realización del hecho imponible.'
      summary:
        es: 'El IVA es un tributo de naturaleza indirecta que recae sobre el consumo y grava las entregas de bienes y
          prestaciones de servicios de empresarios o profesionales, las adquisiciones intracomunitarias de bienes y
          las importaciones. La LIVA define el hecho imponible, las operaciones no sujetas y las asimiladas, como el
          autoconsumo. Regula también las exenciones, entre ellas las del artículo 20, y el lugar de realización de
          las entregas y de los servicios.'
    - id: m03-l19
      title:
        es: 'El Impuesto sobre el Valor Añadido (II). Sujetos pasivos. Repercusión del impuesto. Devengo del impuesto.
          Base imponible. Deducciones: requisitos subjetivos de la deducción y limitaciones del derecho a
          deducir. Régimen de deducciones en sectores diferenciados de la actividad empresarial o profesional.
          Regla de prorrata. Regularización de deducciones por bienes de inversión. Devoluciones.'
      summary:
        es: 'La LIVA regula los sujetos pasivos del impuesto, la repercusión, el devengo y la base imponible. Regula
          también los requisitos y las limitaciones del derecho a deducir, las deducciones en sectores diferenciados
          de la actividad empresarial o profesional, la regla de prorrata, la regularización de las deducciones por
          bienes de inversión y las devoluciones.'
    - id: m03-l20
      title:
        es: 'La Aduana: representación aduanera. Deuda aduanera de importación y deuda aduanera de exportación. Inclusión
          de mercancías en un régimen aduanero: disposiciones generales.'
      summary:
        es: 'El Código Aduanero de la Unión permite a toda persona nombrar un representante aduanero, con una
          representación que puede ser directa o indirecta. La deuda aduanera de importación nace, entre otros casos,
          al incluir mercancías no pertenecientes a la Unión sujetas a derechos de importación en el despacho a libre
          práctica, y la de exportación al incluir mercancías sujetas a derechos de exportación en el régimen de
          exportación o de perfeccionamiento pasivo. Las mercancías que vayan a incluirse en un régimen aduanero,
          salvo el de zona franca, son objeto de una declaración en aduana.'
