# anchor: boe-a-2003-23186-art-178
- id: m03-l13-q0001
  prompt:
    es: "¿Cuáles son los principios de la potestad sancionadora en materia tributaria que se aplican en particular, según el artículo 178 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Legalidad, audiencia, responsabilidad, proporcionalidad y no concurrencia."
  - id: b
    text:
      es: "Legalidad, tipicidad, culpabilidad, proporcionalidad y prescripción."
  - id: c
    correct: true
    text:
      es: "Legalidad, tipicidad, responsabilidad, proporcionalidad y no concurrencia."
  - id: d
    text:
      es: "Legalidad, tipicidad, responsabilidad, proporcionalidad y retroactividad."
  explanation:
    es: "El artículo 178 LGT nombra cinco principios: legalidad, tipicidad, responsabilidad, proporcionalidad y no concurrencia. La culpabilidad y la prescripción no están en esa lista. La audiencia es un derecho del procedimiento, no uno de los principios del artículo. Y la retroactividad no es un principio: el que recoge el artículo es el de irretroactividad, como regla general."
  citation: "art. 178 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "principio"
# anchor: boe-a-2003-23186-art-178
- id: m03-l13-q0002
  prompt:
    es: "Conforme al artículo 178 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el principio de irretroactividad en la potestad sancionadora tributaria:"
  options:
  - id: a
    text:
      es: "Se aplica con carácter general, sin que quepa tener en cuenta lo dispuesto en el artículo 10.2 de la propia ley."
  - id: b
    correct: true
    text:
      es: "Se aplica con carácter general, teniendo en consideración lo dispuesto en el artículo 10.2 de la propia ley."
  - id: c
    text:
      es: "Se aplica solo a las infracciones graves y muy graves, no a las leves."
  - id: d
    text:
      es: "No se aplica a las sanciones tributarias, que se rigen siempre por la norma vigente al tiempo de resolver."
  explanation:
    es: "El artículo 178 LGT dice que el principio de irretroactividad se aplica con carácter general y remite al artículo 10.2 para su alcance. Por eso no es cierto que las sanciones se rijan siempre por la norma vigente al resolver, ni que la regla afecte solo a infracciones graves y muy graves. Tampoco se aplica ignorando el artículo 10.2: el texto manda tenerlo en consideración."
  citation: "art. 178 LGT"
  difficulty: 3
  tags:
  - "principio"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0003
  prompt:
    es: "Según el artículo 179.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quiénes pueden ser sancionados por hechos constitutivos de infracción tributaria cuando resulten responsables de los mismos?"
  options:
  - id: a
    text:
      es: "Solo las personas físicas y jurídicas, sin que alcance a las entidades sin personalidad del artículo 35.4."
  - id: b
    text:
      es: "Solo quienes tengan la condición de contribuyente o de sustituto del contribuyente."
  - id: c
    correct: true
    text:
      es: "Las personas físicas o jurídicas y las entidades a las que se refiere el artículo 35.4 de la propia ley."
  - id: d
    text:
      es: "Las personas físicas o jurídicas, pero no las entidades del artículo 35.4, que responden solo de forma subsidiaria."
  explanation:
    es: "El artículo 179.1 LGT incluye a las personas físicas o jurídicas y a las entidades del artículo 35.4, es decir, las que sin personalidad jurídica constituyen una unidad económica o un patrimonio separado. Por eso no se excluye a esas entidades. Tampoco se limita a contribuyentes y sustitutos: el artículo 181.1 incluye también a retenedores, obligados a ingresos a cuenta y otros sujetos."
  citation: "art. 179.1 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0005
  prompt:
    es: "¿Cuál de las siguientes circunstancias excluye, según el artículo 179.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la responsabilidad por infracción tributaria?"
  options:
  - id: a
    text:
      es: "Que el obligado haya actuado sin ánimo de ocultar datos a la Administración tributaria."
  - id: b
    text:
      es: "Que la acción u omisión sea la primera que comete el obligado en los últimos cuatro años."
  - id: c
    correct: true
    text:
      es: "Que en la realización de la acción u omisión tipificada concurra fuerza mayor."
  - id: d
    text:
      es: "Que el obligado no haya sido requerido antes por la Administración tributaria para cumplir la obligación."
  explanation:
    es: "La fuerza mayor figura en la letra b del artículo 179.2 LGT como causa que excluye la responsabilidad. Los otros tres supuestos no están en esa lista cerrada: ni ser la primera infracción, ni la falta de requerimiento previo, ni la ausencia de ánimo de ocultación excluyen por sí solos la responsabilidad."
  citation: "art. 179.2 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0006
  prompt:
    es: "De acuerdo con el artículo 179.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las acciones u omisiones que deriven de una decisión colectiva no dan lugar a responsabilidad por infracción tributaria para quienes:"
  options:
  - id: a
    text:
      es: "Hubieran salvado su voto, sin que baste con no haber asistido a la reunión en que se adoptó."
  - id: b
    text:
      es: "Hubieran votado a favor de la decisión pero no hubieran ejecutado personalmente la acción u omisión."
  - id: c
    correct: true
    text:
      es: "Hubieran salvado su voto o no hubieran asistido a la reunión en que se adoptó la decisión."
  - id: d
    text:
      es: "Hubieran asistido a la reunión en que se adoptó la decisión, aunque no hubieran salvado su voto."
  explanation:
    es: "Según la letra c del artículo 179.2 LGT, quedan fuera de responsabilidad quienes salvaron su voto o no asistieron a la reunión. Asistir y no salvar el voto no exime. Votar a favor tampoco, aunque no se ejecute la acción. Y no es necesario haber salvado el voto: basta con no haber asistido."
  citation: "art. 179.2 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0007
  prompt:
    es: "Según el artículo 179.2.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre cuándo se entiende, entre otros supuestos, que el obligado ha puesto la diligencia necesaria en el cumplimiento de sus obligaciones tributarias:"
  options:
  - id: a
    text:
      es: "Cuando ha formulado una consulta a la Administración que esta no ha llegado a contestar."
  - id: b
    text:
      es: "Cuando ha actuado siguiendo el criterio de su asesor fiscal sobre la norma aplicable."
  - id: c
    text:
      es: "Cuando ha actuado según la práctica que aplica la mayoría de los obligados de su sector."
  - id: d
    correct: true
    text:
      es: "Cuando ha actuado amparándose en una interpretación razonable de la norma."
  explanation:
    es: "El artículo 179.2.d LGT cita como supuesto de diligencia necesaria haber actuado amparándose en una interpretación razonable de la norma. El texto no recoge el criterio del asesor, la práctica del sector ni la consulta sin contestar como supuestos que den por puesta la diligencia."
  citation: "art. 179.2.d LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0008
  prompt:
    es: "De acuerdo con el artículo 179.2.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, tampoco se exige responsabilidad si el obligado ajusta su actuación a los criterios manifestados en la contestación a una consulta formulada por otro obligado, siempre que:"
  options:
  - id: a
    correct: true
    text:
      es: "Entre sus circunstancias y las mencionadas en la contestación exista una igualdad sustancial y los criterios no hayan sido modificados."
  - id: b
    text:
      es: "Ambos obligados ejerzan la misma actividad económica y tengan su domicilio fiscal en el mismo municipio."
  - id: c
    text:
      es: "La contestación se haya publicado en el Boletín Oficial del Estado antes de cometerse la infracción."
  - id: d
    text:
      es: "El otro obligado haya autorizado por escrito que se utilice su consulta como criterio de actuación."
  explanation:
    es: "El artículo 179.2.d LGT pone dos condiciones: que exista una igualdad sustancial entre las circunstancias del obligado y las de la contestación, y que los criterios no se hayan modificado. La misma actividad y el mismo domicilio, la publicación en el BOE o la autorización del consultante no son condiciones que el texto exija."
  citation: "art. 179.2.d LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0009
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los obligados tributarios que regularizan voluntariamente su situación o subsanan declaraciones presentadas con anterioridad de forma defectuosa es CORRECTA, según el artículo 179.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Responden únicamente de las infracciones graves y muy graves cometidas con ocasión de aquellas."
  - id: b
    correct: true
    text:
      es: "No incurren en responsabilidad por las infracciones tributarias cometidas con ocasión de la presentación de aquellas."
  - id: c
    text:
      es: "Incurren en responsabilidad por infracción leve, pero se les reduce la sanción en un 50 por ciento."
  - id: d
    text:
      es: "No incurren en responsabilidad solo si ingresan además el interés de demora devengado antes de que prescriba la infracción."
  explanation:
    es: "El artículo 179.3 LGT dice que quien regulariza voluntariamente no incurre en responsabilidad por las infracciones cometidas al presentar las declaraciones anteriores. No se exige pagar interés de demora para ello, ni hay una responsabilidad residual por infracciones leves, graves o muy graves."
  citation: "art. 179.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0010
  prompt:
    es: "Conforme al artículo 179.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la regularización voluntaria de la situación tributaria:"
  options:
  - id: a
    text:
      es: "Excluye la aplicación del recargo del artículo 27, que se sustituye por el interés de demora."
  - id: b
    text:
      es: "Excluye también las infracciones que se cometan por la presentación tardía de las nuevas declaraciones."
  - id: c
    correct: true
    text:
      es: "No excluye las posibles infracciones que se cometan por la presentación tardía o incorrecta de las nuevas declaraciones."
  - id: d
    text:
      es: "Alcanza solo a las declaraciones presentadas incorrectamente, no a las autoliquidaciones, comunicaciones de datos ni solicitudes."
  explanation:
    es: "El artículo 179.3 LGT aclara que la exclusión de responsabilidad se entiende sin perjuicio del artículo 27 y de las infracciones que puedan cometerse por la presentación tardía o incorrecta de las nuevas declaraciones. Por eso no las excluye, y el recargo del artículo 27 sigue aplicándose. El texto abarca declaraciones, autoliquidaciones, comunicaciones de datos y solicitudes."
  citation: "art. 179.3 LGT"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-180
- id: m03-l13-q0013
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la acción u omisión que deba aplicarse como criterio de graduación o como circunstancia que determine la calificación de grave o muy grave es CORRECTA, según el artículo 180.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Solo podrá aplicarse como criterio de graduación, nunca como circunstancia que determine la calificación."
  - id: b
    correct: true
    text:
      es: "No podrá ser sancionada como infracción independiente."
  - id: c
    text:
      es: "Podrá ser sancionada como infracción independiente si la multa resultante es proporcional."
  - id: d
    text:
      es: "Se sancionará como infracción independiente con la multa fija que corresponda a la infracción leve."
  explanation:
    es: "El artículo 180.1 LGT impide sancionar como infracción independiente la acción u omisión que ya se ha usado para graduar la sanción o para calificar la infracción como grave o muy grave. La misma conducta puede cumplir cualquiera de las dos funciones, y ninguna permite una segunda sanción."
  citation: "art. 180.1 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "principio"
# anchor: boe-a-2003-23186-art-180
- id: m03-l13-q0014
  prompt:
    es: "Según el artículo 180.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la realización de varias acciones u omisiones constitutivas de varias infracciones:"
  options:
  - id: a
    text:
      es: "Permite imponer una única sanción incrementando en la mitad el porcentaje mínimo de la más grave."
  - id: b
    text:
      es: "Obliga a imponer solo la sanción que corresponda a la infracción más grave de las cometidas."
  - id: c
    correct: true
    text:
      es: "Posibilita la imposición de las sanciones que procedan por todas ellas."
  - id: d
    text:
      es: "Impide sancionarlas por separado cuando se hayan cometido en el mismo período impositivo."
  explanation:
    es: "El artículo 180.2 LGT permite imponer las sanciones que procedan por todas las infracciones cometidas. No limita la sanción a la infracción más grave, no prevé un incremento que las unifique y no exige separarlas por períodos impositivos."
  citation: "art. 180.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-180
- id: m03-l13-q0015
  prompt:
    es: "De acuerdo con el artículo 180.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción derivada de la infracción del artículo 198 es compatible con las que procedan, en su caso, por la aplicación de los artículos que tipifican:"
  options:
  - id: a
    text:
      es: "El incumplimiento de las obligaciones relativas al número de identificación fiscal y los sistemas informáticos que no cumplan las especificaciones exigidas."
  - id: b
    correct: true
    text:
      es: "La presentación incorrecta de autoliquidaciones o declaraciones sin perjuicio económico y la resistencia, obstrucción, excusa o negativa a las actuaciones de la Administración."
  - id: c
    text:
      es: "La presentación incorrecta de autoliquidaciones o declaraciones sin perjuicio económico y el incumplimiento del deber de sigilo de los retenedores."
  - id: d
    text:
      es: "El incumplimiento de obligaciones contables y registrales y el incumplimiento de obligaciones de facturación o documentación."
  explanation:
    es: "El artículo 180.2 LGT declara compatible la sanción del artículo 198 con las de los artículos 199 y 203: la presentación incorrecta de autoliquidaciones o declaraciones sin perjuicio económico y la resistencia, obstrucción, excusa o negativa. Las demás parejas son otras infracciones de los artículos 199 a 206, pero no las que ese precepto nombra."
  citation: "art. 180.2 LGT"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-180
- id: m03-l13-q0016
  prompt:
    es: "Tras una inspección, a Construcciones Ledesma, S.L. se le impone una sanción tributaria de 4.000 euros y se le exige, además, el interés de demora y, vencido el plazo voluntario, el recargo del período ejecutivo. La sociedad alega que la sanción excluye esas dos exigencias. Según el artículo 180.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿tiene razón?"
  options:
  - id: a
    text:
      es: "Sí, porque solo son compatibles con la sanción las exigencias que se notifiquen en la misma resolución."
  - id: b
    correct: true
    text:
      es: "No, porque las sanciones resultan compatibles con la exigencia del interés de demora y de los recargos del período ejecutivo."
  - id: c
    text:
      es: "Sí, porque la sanción tributaria sustituye al interés de demora y al recargo del período ejecutivo."
  - id: d
    text:
      es: "Solo si recurre la sanción, porque entonces se suspende toda exigencia accesoria de la deuda."
  explanation:
    es: "El artículo 180.3 LGT dice que las sanciones son compatibles con la exigencia del interés de demora y de los recargos del período ejecutivo. La sanción no sustituye a esas exigencias, no hace falta notificarlas en la misma resolución y recurrir la sanción no suspende por sí solo todo lo accesorio de la deuda."
  citation: "art. 180.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2003-23186-art-180
- id: m03-l13-q0017
  prompt:
    es: "¿Con qué exigencias resultan compatibles las sanciones derivadas de la comisión de infracciones tributarias, de acuerdo con el artículo 180.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, relativo al principio de no concurrencia?"
  options:
  - id: a
    text:
      es: "Con la exigencia de otra sanción por la misma acción u omisión, siempre que sea de distinta cuantía."
  - id: b
    text:
      es: "Con la exigencia de la deuda tributaria, pero no con la de ningún interés ni recargo posterior."
  - id: c
    text:
      es: "Con la exigencia del recargo por declaración extemporánea sin requerimiento previo del artículo 27."
  - id: d
    correct: true
    text:
      es: "Con la exigencia del interés de demora y de los recargos del período ejecutivo que correspondan."
  explanation:
    es: "El artículo 180.3 LGT declara compatibles las sanciones con el interés de demora y con los recargos del período ejecutivo. El recargo del artículo 27 es distinto: excluye las sanciones. Tampoco cabe sancionar dos veces la misma conducta, que es lo que impide el artículo 180.1, y la compatibilidad no se limita a la deuda sin intereses ni recargos."
  citation: "art. 180.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-179
- id: m03-l13-q0219
  prompt:
    es: "De acuerdo con el artículo 179.2.e de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las acciones u omisiones que no dan lugar a responsabilidad por infracción tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Quedan excluidas las imputables a una deficiencia técnica de los programas informáticos de asistencia facilitados por la Administración tributaria."
  - id: b
    text:
      es: "Quedan excluidas las imputables a un error en la aplicación informática de la Administración, siempre que el obligado lo comunique antes de su vencimiento."
  - id: c
    text:
      es: "Quedan excluidas las imputables a una deficiencia técnica de cualquier programa informático que utilice el obligado para cumplir sus obligaciones."
  - id: d
    text:
      es: "Quedan excluidas las imputables a una deficiencia en los programas facilitados por la Administración, salvo que el obligado sea una gran empresa."
  explanation:
    es: "La letra e del artículo 179.2 LGT excluye la responsabilidad cuando la acción u omisión es imputable a una deficiencia técnica de los programas informáticos de asistencia facilitados por la Administración tributaria. No alcanza al software que el obligado elija por su cuenta, no exige comunicar el error antes del vencimiento y no distingue por tamaño del obligado."
  citation: "art. 179.2 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-178
- id: m03-l13-q0220
  prompt:
    es: "¿Por qué principios se ejerce la potestad sancionadora en materia tributaria, además de las especialidades que establece el artículo 178 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Por los principios del procedimiento de inspección, con las especialidades del título IV."
  - id: b
    text:
      es: "Por los principios de la ley que regula cada tributo, sin remisión a otras normas."
  - id: c
    text:
      es: "Por los principios del derecho penal, con aplicación directa del Código Penal."
  - id: d
    correct: true
    text:
      es: "Por los principios reguladores de la potestad sancionadora en materia administrativa."
  explanation:
    es: "El artículo 178 LGT somete la potestad sancionadora tributaria a los principios de la potestad sancionadora administrativa, con las especialidades que establece la propia ley. No se aplica directamente el Código Penal, ni los principios de la ley de cada tributo, ni los del procedimiento de inspección."
  citation: "art. 178 LGT"
  difficulty: 2
  tags:
  - "principio"
