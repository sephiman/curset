# anchor: boe-a-2015-10565-art-74
- id: m02-l04-q0005
  prompt:
    es: "¿Cuál de las siguientes cuestiones incidentales suspende la tramitación del procedimiento, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La que se refiera a la nulidad de las actuaciones del propio procedimiento."
  - id: b
    correct: true
    text:
      es: "La recusación de la autoridad o del personal que interviene en el procedimiento."
  - id: c
    text:
      es: "La que plantee la falta de acreditación de la representación del interesado."
  - id: d
    text:
      es: "La que se suscite sobre la acumulación del procedimiento con otro conexo."
  explanation:
    es: "El artículo 74 dice que las cuestiones incidentales, «incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación». Solo la recusación suspende. La nulidad de actuaciones está nombrada como cuestión que no suspende. La representación y la acumulación no son excepciones."
  citation: "art. 74 LPAC"
  difficulty: 1
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-70
- id: m02-l04-q0073
  prompt:
    es: "Según el artículo 70.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los expedientes administrativos tendrán:"
  options:
  - id: a
    text:
      es: "formato en papel, salvo que el interesado opte por el electrónico."
  - id: b
    correct: true
    text:
      es: "formato electrónico."
  - id: c
    text:
      es: "formato electrónico o en papel, a elección del órgano que tramite."
  - id: d
    text:
      es: "formato electrónico, salvo en los procedimientos sancionadores."
  explanation:
    es: "El artículo 70.2 dispone que los expedientes tendrán formato electrónico, sin alternativas. No es el papel por defecto, ni se deja a elección del órgano, ni se exceptúan los procedimientos sancionadores."
  citation: "art. 70.2 LPAC"
  difficulty: 1
  tags:
  - "expediente"
  - "formato"
# anchor: boe-a-2015-10565-art-70
- id: m02-l04-q0074
  prompt:
    es: "Conforme al artículo 70.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, deberá constar en el expediente administrativo copia electrónica certificada de:"
  options:
  - id: a
    correct: true
    text:
      es: "la resolución adoptada."
  - id: b
    text:
      es: "la propuesta de resolución elevada."
  - id: c
    text:
      es: "el acuerdo de iniciación del procedimiento."
  - id: d
    text:
      es: "las alegaciones presentadas por los interesados."
  explanation:
    es: "El artículo 70.2 exige que conste en el expediente copia electrónica certificada de la resolución adoptada. No exige esa certificación para la propuesta de resolución, el acuerdo de iniciación ni las alegaciones, que se agregan sin ella."
  citation: "art. 70.2 LPAC"
  difficulty: 1
  tags:
  - "expediente"
  - "contenido"
# anchor: boe-a-2015-10565-art-70
- id: m02-l04-q0075
  prompt:
    es: "De acuerdo con el artículo 70.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando sea preciso remitir el expediente electrónico, se enviará completo, foliado, autentificado y acompañado de:"
  options:
  - id: a
    text:
      es: "una copia en papel de la resolución adoptada, debidamente cotejada."
  - id: b
    text:
      es: "un informe del órgano remitente sobre la integridad del expediente."
  - id: c
    text:
      es: "una certificación del secretario sobre la autenticidad de cada documento."
  - id: d
    correct: true
    text:
      es: "un índice, asimismo autentificado, de los documentos que contenga."
  explanation:
    es: "El artículo 70.3 exige enviar el expediente acompañado de un índice autentificado de los documentos, cuya autenticación garantiza su integridad e inmutabilidad. No se pide copia en papel, ni un informe del órgano remitente, ni certificar cada documento."
  citation: "art. 70.3 LPAC"
  difficulty: 1
  tags:
  - "expediente"
  - "remisión"
# anchor: boe-a-2015-10565-art-70
- id: m02-l04-q0076
  prompt:
    es: "Conforme al artículo 70.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre los expedientes electrónicos:"
  options:
  - id: a
    text:
      es: "Un mismo documento no puede formar parte de más de un expediente electrónico."
  - id: b
    text:
      es: "Un mismo documento puede formar parte de distintos expedientes solo si se incorpora en papel."
  - id: c
    correct: true
    text:
      es: "Es admisible que un mismo documento forme parte de distintos expedientes electrónicos."
  - id: d
    text:
      es: "Un mismo documento puede formar parte de distintos expedientes únicamente de la misma Administración."
  explanation:
    es: "El artículo 70.3 considera admisible que un mismo documento forme parte de distintos expedientes electrónicos. No se prohíbe, ni se exige incorporarlo en papel, ni se limita a expedientes de una misma Administración."
  citation: "art. 70.3 LPAC"
  difficulty: 2
  tags:
  - "expediente"
  - "documentos"
# anchor: boe-a-2015-10565-art-82
- id: m02-l04-q0011
  prompt:
    es: "¿En cuál de los siguientes casos se podrá prescindir del trámite de audiencia, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando no figuren ni se tengan en cuenta otros hechos, alegaciones y pruebas que los del interesado."
  - id: b
    text:
      es: "Cuando el interesado no haya presentado alegaciones ni documentos en ningún momento anterior del procedimiento."
  - id: c
    text:
      es: "Cuando se haya abierto en el mismo procedimiento un período de información pública de veinte días."
  - id: d
    text:
      es: "Cuando el plazo máximo para resolver esté próximo a vencer y el órgano competente así lo motive."
  explanation:
    es: "El artículo 82.4 permite prescindir de la audiencia «cuando no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado». No basta que el interesado no haya alegado antes. La información pública es otro trámite y no sustituye a la audiencia. La proximidad del vencimiento no es causa."
  citation: "art. 82.4 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-83
- id: m02-l04-q0012
  prompt:
    es: "De acuerdo con el artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el anuncio de un período de información pública determinará el plazo para formular alegaciones, que:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá ser inferior a veinte días."
  - id: b
    text:
      es: "En ningún caso podrá ser inferior a diez días."
  - id: c
    text:
      es: "En ningún caso podrá ser superior a veinte días."
  - id: d
    text:
      es: "En ningún caso podrá ser inferior a un mes."
  explanation:
    es: "El artículo 83.2 dice que el plazo de alegaciones de la información pública «en ningún caso podrá ser inferior a veinte días». Veinte días es un mínimo, no un máximo. No es de diez días, y nada exige un mes."
  citation: "art. 83.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m02-l04-q0032
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué trámite tiene lugar, instruido el procedimiento, inmediatamente antes de redactar la propuesta de resolución?"
  options:
  - id: a
    text:
      es: "El período de información pública del expediente."
  - id: b
    text:
      es: "La apertura del período de prueba ordinario."
  - id: c
    text:
      es: "Las actuaciones complementarias indispensables."
  - id: d
    correct: true
    text:
      es: "El trámite de audiencia a los interesados."
  explanation:
    es: "El artículo 82.1 dice: «Instruidos los procedimientos, e inmediatamente antes de redactar la propuesta de resolución, se pondrán de manifiesto a los interesados»: es el trámite de audiencia. La información pública la acuerda el órgano cuando la naturaleza del procedimiento lo requiere, sin ese lugar fijo. La prueba forma parte de la instrucción. Las actuaciones complementarias se acuerdan «antes de dictar resolución», no antes de la propuesta."
  citation: "art. 82.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: m02-l04-q0043
  prompt:
    es: "Señale quién emite el informe preceptivo en la responsabilidad patrimonial por funcionamiento anormal de la Administración de Justicia, según el artículo 81.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo, a través de su Sala de Gobierno."
  - id: b
    text:
      es: "El Ministerio Fiscal."
  - id: c
    text:
      es: "El Defensor del Pueblo."
  - id: d
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 81.3 exige el informe del Consejo General del Poder Judicial en esas reclamaciones, que se evacúa en dos meses. El Tribunal Supremo, el Ministerio Fiscal y el Defensor del Pueblo no emiten ese informe preceptivo."
  citation: "art. 81.3 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-75
- id: m02-l04-q0078
  prompt:
    es: "Según el artículo 75.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos de instrucción necesarios para la determinación, conocimiento y comprobación de los hechos se realizarán de oficio y a través de medios electrónicos, por:"
  options:
  - id: a
    text:
      es: "el órgano competente para resolver, aunque no tramite el procedimiento."
  - id: b
    correct: true
    text:
      es: "el órgano que tramite el procedimiento."
  - id: c
    text:
      es: "los propios interesados, que proponen y practican las actuaciones."
  - id: d
    text:
      es: "el órgano que designe cada vez el superior jerárquico del instructor."
  explanation:
    es: "El artículo 75.1 atribuye los actos de instrucción al órgano que tramite el procedimiento, de oficio y por medios electrónicos. No corresponden por defecto al órgano que resuelve, ni a los interesados, que solo tienen derecho a proponer actuaciones, ni a un órgano designado en cada caso por el superior."
  citation: "art. 75.1 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "órgano"
# anchor: boe-a-2015-10565-art-75
- id: m02-l04-q0079
  prompt:
    es: "De acuerdo con el artículo 75.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre los actos de instrucción:"
  options:
  - id: a
    correct: true
    text:
      es: "Se realizan de oficio y por medios electrónicos, sin perjuicio del derecho de los interesados a proponer actuaciones que requieran su intervención."
  - id: b
    text:
      es: "Se realizan solo a instancia de los interesados, que proponen las actuaciones que requieran su intervención."
  - id: c
    text:
      es: "Se realizan de oficio, preferentemente por escrito, sin que los interesados puedan proponer actuaciones."
  - id: d
    text:
      es: "Se realizan de oficio y por medios electrónicos, y los interesados solo pueden proponer los trámites no previstos legalmente."
  explanation:
    es: "El artículo 75.1 dice que se realizan de oficio y a través de medios electrónicos, sin perjuicio del derecho de los interesados a proponer actuaciones que requieran su intervención o constituyan trámites legal o reglamentariamente establecidos. No son solo a instancia de parte, ni prohíben proponer actuaciones, ni se limitan a los trámites no previstos."
  citation: "art. 75.1 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "actos"
# anchor: boe-a-2015-10565-art-76
- id: m02-l04-q0081
  prompt:
    es: "¿Qué debe hacer el órgano competente con las alegaciones y los documentos que un interesado aporta antes del trámite de audiencia, según el artículo 76.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Tenerlos en cuenta solo si el interesado los reitera durante el trámite de audiencia."
  - id: b
    text:
      es: "Incorporarlos al expediente sin valorarlos hasta que se dicte la resolución definitiva."
  - id: c
    text:
      es: "Rechazarlos, porque las alegaciones solo pueden presentarse en el trámite de audiencia."
  - id: d
    correct: true
    text:
      es: "Tenerlos en cuenta al redactar la propuesta de resolución."
  explanation:
    es: "El artículo 76.1 permite alegar y aportar documentos en cualquier momento anterior al trámite de audiencia, y el órgano competente debe tenerlos en cuenta al redactar la propuesta de resolución. No hay que reiterarlos en la audiencia, ni se difiere su valoración a la resolución definitiva, ni son extemporáneos antes de la audiencia."
  citation: "art. 76.1 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "alegaciones"
# anchor: boe-a-2015-10565-art-77
- id: m02-l04-q0083
  prompt:
    es: "De acuerdo con el artículo 77.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el instructor, a petición de los interesados y cuando lo considere necesario, podrá decidir la apertura de un período extraordinario de prueba, que tiene una duración de:"
  options:
  - id: a
    text:
      es: "un máximo de cinco días."
  - id: b
    correct: true
    text:
      es: "un máximo de diez días."
  - id: c
    text:
      es: "un máximo de quince días."
  - id: d
    text:
      es: "un máximo de treinta días."
  explanation:
    es: "El artículo 77.2 limita el período extraordinario de prueba a diez días. Cinco días no es el tope, y quince y treinta días son plazos de otros trámites, como la audiencia (quince días como máximo) o el período ordinario de prueba (treinta días como máximo)."
  citation: "art. 77.2 LPAC"
  difficulty: 1
  tags:
  - "instrucción"
  - "prueba"
  - "plazo"
# anchor: boe-a-2015-10565-art-77
- id: m02-l04-q0084
  prompt:
    es: "Conforme al artículo 77.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre la apertura del período de prueba:"
  options:
  - id: a
    correct: true
    text:
      es: "El instructor la acuerda cuando la Administración no tenga por ciertos los hechos alegados por los interesados o la naturaleza del procedimiento lo exija."
  - id: b
    text:
      es: "El instructor la acuerda en todo caso, aunque la Administración tenga por ciertos los hechos alegados por los interesados."
  - id: c
    text:
      es: "El órgano competente para resolver la acuerda cuando lo pida cualquier interesado, sin necesidad de otra condición."
  - id: d
    text:
      es: "El instructor la acuerda solo cuando la naturaleza del procedimiento lo exija, y no por la falta de certeza de los hechos."
  explanation:
    es: "Según el artículo 77.2, el instructor acuerda el período de prueba cuando no tenga por ciertos los hechos alegados o la naturaleza del procedimiento lo exija. No se abre en todo caso, ni lo acuerda el órgano que resuelve a petición de cualquier interesado, ni se limita a la naturaleza del procedimiento."
  citation: "art. 77.2 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "prueba"
# anchor: boe-a-2015-10565-art-80
- id: m02-l04-q0085
  prompt:
    es: "Según el artículo 80.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los informes serán emitidos a través de medios electrónicos y de acuerdo con los requisitos que señala el artículo 26, en el plazo de diez días, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "una disposición o el cumplimiento del resto de los plazos del procedimiento permita o exija otro plazo mayor o menor."
  - id: b
    text:
      es: "el órgano que los emita solicite una prórroga motivada de otros diez días."
  - id: c
    text:
      es: "el interesado renuncie expresamente a que se emitan en ese plazo."
  - id: d
    text:
      es: "el informe sea preceptivo, en cuyo caso el plazo será de un mes."
  explanation:
    es: "El artículo 80.2 fija diez días salvo que una disposición o el cumplimiento del resto de los plazos permita o exija otro mayor o menor. No hay prórroga automática de otros diez días, ni depende de la renuncia del interesado, ni los informes preceptivos tienen un plazo distinto de un mes."
  citation: "art. 80.2 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "informes"
  - "plazo"
# anchor: boe-a-2015-10565-art-81
- id: m02-l04-q0086
  prompt:
    es: "De acuerdo con el artículo 81.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el informe preceptivo del Consejo General del Poder Judicial en las reclamaciones por funcionamiento anormal de la Administración de Justicia se evacúa en un plazo de:"
  options:
  - id: a
    text:
      es: "diez días como máximo desde su solicitud."
  - id: b
    text:
      es: "un mes como máximo desde su solicitud."
  - id: c
    text:
      es: "tres meses como máximo desde su solicitud."
  - id: d
    correct: true
    text:
      es: "dos meses como máximo desde su solicitud."
  explanation:
    es: "El artículo 81.3 fija un plazo máximo de dos meses. Diez días es el plazo del informe del servicio en la responsabilidad patrimonial (artículo 81.1), y ni un mes ni tres meses son los de este precepto."
  citation: "art. 81.3 LPAC"
  difficulty: 1
  tags:
  - "instrucción"
  - "informes"
  - "plazo"
# anchor: boe-a-2015-10565-art-81
- id: m02-l04-q0087
  prompt:
    es: "Conforme al artículo 81.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en esas reclamaciones el plazo para dictar resolución queda suspendido por el tiempo que medie entre la solicitud del informe y su recepción, sin que pueda exceder de:"
  options:
  - id: a
    text:
      es: "un mes desde la solicitud del informe."
  - id: b
    text:
      es: "tres meses desde la solicitud del informe."
  - id: c
    correct: true
    text:
      es: "dos meses desde la solicitud del informe."
  - id: d
    text:
      es: "quince días desde la solicitud del informe."
  explanation:
    es: "El artículo 81.3 limita esa suspensión a los dos meses del plazo del informe. Tres meses es el tope de la suspensión por informes preceptivos del artículo 22.1.d), que es una regla general distinta. Un mes y quince días no figuran en el precepto."
  citation: "art. 81.3 LPAC"
  difficulty: 1
  tags:
  - "instrucción"
  - "suspensión"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m02-l04-q0088
  prompt:
    es: "Cuando el dictamen del Consejo de Estado forma parte del procedimiento, ¿cuándo se da audiencia a los interesados respecto de su solicitud, según el artículo 82.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Después de recibir el dictamen y antes de la resolución."
  - id: b
    correct: true
    text:
      es: "Antes de solicitar el dictamen."
  - id: c
    text:
      es: "Al mismo tiempo que se solicita el dictamen."
  - id: d
    text:
      es: "Solo si el dictamen es contrario a la propuesta de resolución."
  explanation:
    es: "El artículo 82.1 dice que la audiencia a los interesados será anterior a la solicitud del dictamen del Consejo de Estado, cuando forme parte del procedimiento. No se concede después de recibirlo, ni a la vez que se solicita, ni depende de que el dictamen sea contrario a la propuesta."
  citation: "art. 82.1 LPAC"
  difficulty: 2
  tags:
  - "instrucción"
  - "audiencia"
# anchor: boe-a-2015-10565-art-82
- id: m02-l04-q0089
  prompt:
    es: "Conforme al artículo 82.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el trámite de audiencia los interesados pueden alegar y presentar documentos en un plazo no inferior a diez días ni superior a:"
  options:
  - id: a
    text:
      es: "veinte días desde la notificación del trámite."
  - id: b
    correct: true
    text:
      es: "quince días desde la notificación del trámite."
  - id: c
    text:
      es: "treinta días desde la notificación del trámite."
  - id: d
    text:
      es: "cinco días desde la notificación del trámite."
  explanation:
    es: "El artículo 82.2 concede un plazo no inferior a diez días ni superior a quince. Veinte días es el mínimo de la información pública (artículo 83.2), treinta es el máximo del período de prueba, y cinco días no es el máximo de la audiencia."
  citation: "art. 82.2 LPAC"
  difficulty: 1
  tags:
  - "instrucción"
  - "audiencia"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m02-l04-q0090
  prompt:
    es: "El viernes 6 de marzo de 2026 se notifica a los interesados de un procedimiento el trámite de audiencia, y se les concede el plazo más amplio que permite el artículo 82.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en marzo. ¿Cuándo vence el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes 27 de marzo de 2026."
  - id: b
    text:
      es: "El viernes 20 de marzo de 2026."
  - id: c
