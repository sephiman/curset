- id: m08-l07-q12
  prompt:
    en: In Flink's distributed snapshots, how do stream barriers move relative to the records of the data stream?
  options:
  - id: a
    text:
      en: They overtake records so that the sinks learn about a snapshot first
  - id: b
    correct: true
    text:
      en: They flow strictly in line and never overtake records
  - id: c
    text:
      en: They pause the flow of the stream while the snapshot is taken
  - id: d
    text:
      en: They carry the timestamp of the latest record that they follow
  explanation:
    en: Barriers flow strictly in line and never overtake records. Overtaking records is wrong, because barriers
      never overtake records. Pausing the stream is wrong, because barriers do not interrupt the flow of the stream
      and are very lightweight. Carrying a timestamp is wrong, because each barrier carries the ID of the snapshot
      whose records it pushed in front of it.
  citation: flink-stateful-stream-processing#barriers
- id: m08-l07-q13
  prompt:
    en: In Flink, the stream alignment during a checkpoint is skipped, so an operator processes elements of checkpoint
      n+1 before the snapshot of checkpoint n. What follows on a restore?
  options:
  - id: a
    text:
      en: Those records are lost, because the snapshot of checkpoint n does not contain them
  - id: b
    text:
      en: A dataflow of only `map`, `flatMap` and `filter` operators loses its exactly once guarantee
  - id: c
    text:
      en: The checkpoint is discarded and the job restarts from scratch
  - id: d
    correct: true
    text:
      en: Those records occur as duplicates
  explanation:
    en: Those records occur as duplicates, because they are both in the state snapshot of checkpoint n and replayed
      after it. Records being lost is wrong, because the operator processes the elements of checkpoint n+1 before
      the state snapshot of checkpoint n is taken, so they are in the snapshot. Losing exactly once for a `map`,
      `flatMap` and `filter` dataflow is wrong, because such dataflows give exactly once guarantees even in at least
      once mode. Discarding the checkpoint is wrong, because checkpoint snapshots are still drawn once an operator
      has seen the barrier from each input.
  citation: flink-stateful-stream-processing#exactly-once-vs-at-least-once
- id: m08-l07-q14
  prompt:
    en: After the machine running a Kafka Streams task fails and the task restarts on another machine, how does
      Kafka Streams restore the task's state stores?
  options:
  - id: a
    text:
      en: By copying the local store files from the failed machine
  - id: b
    correct: true
    text:
      en: By replaying the corresponding changelog topics before processing resumes
  - id: c
    text:
      en: By re-reading the whole input topic from its first offset
  - id: d
    text:
      en: By reading a per-task `.checkpoint` file, in Kafka 4.3 and later
  explanation:
    en: Kafka Streams replays the corresponding changelog topics before it resumes processing. Copying local files
      is wrong, because the state is tracked in a replicated changelog Kafka topic per state store. Re-reading the
      whole input topic is wrong, because the cost of task initialization depends primarily on the time for replaying
      the changelog topics of the state stores. A `.checkpoint` file is wrong, because since Kafka 4.3 the changelog
      offset of each persistent store is stored inside `RocksDB` rather than in a per-task `.checkpoint` file.
  citation: kafka-streams-architecture#fault-tolerance
  extract:
    en: If tasks run on a machine that fails and are restarted on another machine, Kafka Streams guarantees to restore
      their associated state stores to the content before the failure by replaying the corresponding changelog topics
      prior to resuming the processing on the newly started tasks.
- id: m08-l07-q15
  prompt:
    en: In the Flink web interface, which share of the time must a subtask be back pressured for its back pressure
      status to be HIGH?
  options:
  - id: a
    text:
      en: Up to 10%
  - id: b
    text:
      en: More than 10% and up to 50%
  - id: c
    text:
      en: Exactly 100%, and never less
  - id: d
    correct: true
    text:
      en: More than 50% and up to 100%
  explanation:
    en: A subtask is HIGH when it is back pressured more than 50% and up to 100% of the time. Up to 10%, more than
      10% and up to 50%, and exactly 100% are all excluded, because the status definition gives more than 50% and
      up to 100% for HIGH.
  citation: flink-back-pressure#back-pressure-status
