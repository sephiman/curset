- id: m01-l04-q073
  prompt:
    es: "De los veinte miembros nombrados por el Rey para el Consejo General del Poder Judicial, el artículo 122.3 de la Constitución Española de 1978 dispone que se eligen entre Jueces y Magistrados de todas las categorías judiciales:"
  options:
  - id: a
    text:
      es: "Diez de ellos."
  - id: b
    correct: true
    text:
      es: "Doce de ellos."
  - id: c
    text:
      es: "Ocho de ellos."
  - id: d
    text:
      es: "Dieciséis de ellos."
  explanation:
    es: "El artículo 122.3 establece que doce de los veinte se eligen «entre Jueces y Magistrados de todas las categorías judiciales». Los ocho restantes son los cuatro del Congreso y los cuatro del Senado, y diez o dieciséis no corresponden a ninguna de las dos partes del reparto."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
