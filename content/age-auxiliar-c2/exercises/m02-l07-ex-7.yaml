# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q133
  prompt:
    es: "En el Explorador de archivos de Windows 11, para cortar y pegar un archivo o una carpeta que están en Acceso rápido, antes hay que seleccionar con el clic derecho la opción:"
  options:
  - id: a
    text:
      es: "Anclar a acceso rápido"
  - id: b
    text:
      es: "Desanclar del acceso rápido"
  - id: c
    text:
      es: "Mostrar más opciones"
  - id: d
    correct: true
    text:
      es: "Abrir"
  explanation:
    es: "La nota de la página dice que, para los archivos y carpetas en Acceso rápido, hay que hacer clic con el botón derecho y seleccionar Abrir para poder cortar y pegar. Anclar y desanclar solo cambian si el elemento aparece en Acceso rápido, y Mostrar más opciones abre el menú contextual anterior."
  citation: "fuente: `ms-win-explorador.html`; «Para los archivos y carpetas en Acceso rápido, tendrá que hacer clic con el botón derecho (o mantener presionado) y seleccionar Abrir para poder cortar y pegar.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q134
  prompt:
    es: "En Windows 11, ¿cómo se configura el Explorador de archivos para que se abra en Este equipo en lugar de en Inicio?"
  options:
  - id: a
    text:
      es: "Con Ver › Mostrar › Este equipo, en la barra de comandos"
  - id: b
    text:
      es: "Con clic derecho en una carpeta y Anclar a acceso rápido"
  - id: c
    correct: true
    text:
      es: "Con Ver más › Opciones y eligiendo Este equipo"
  - id: d
    text:
      es: "Con Ver › Mostrar › Panel de navegación"
  explanation:
    es: "La página dice que, para tener abierto el Explorador en Este equipo, se selecciona Ver más › Opciones, se elige abrir el Explorador en Este equipo y se aplica. Ver › Mostrar da acceso a las extensiones, los elementos ocultos y el panel de navegación, y Anclar a acceso rápido solo ancla una carpeta."
  citation: "fuente: `ms-win-explorador.html`; «Configure el Explorador de archivos para abrirlo en Este equipo»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
