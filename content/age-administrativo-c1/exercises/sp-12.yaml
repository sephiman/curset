# anchor: boe-a-2015-10565-art-81
- id: q05
  lesson: m03-l06
  prompt:
    es: "El lunes, 1 de febrero de 2027, el Instituto solicita el informe del servicio cuyo funcionamiento habría causado la lesión de Don Lorenzo Pastor Villalba. ¿Hasta qué fecha puede emitirse ese informe?"
  options:
  - id: a
    text:
      es: "El jueves, 11 de febrero de 2027."
  - id: b
    text:
      es: "El viernes, 12 de febrero de 2027."
