- id: m03-l02-q0093
  prompt:
    es: "¿De quién depende directamente el Delegado de la Agencia Tributaria, que ejerce la superior jefatura de las Delegaciones, según el apartado octavo.1 de la Resolución de 13 de enero de 2021, de la Presidencia de la Agencia Estatal de Administración Tributaria, por la que se establece la estructura y organización territorial de la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    text:
      es: "Del Director General de la Agencia Tributaria."
  - id: b
    text:
      es: "Del Delegado Especial Adjunto de mayor antigüedad."
  - id: c
    correct: true
    text:
      es: "Del Delegado Especial de la Agencia Tributaria."
  - id: d
    text:
      es: "Del Jefe de la Dependencia Regional correspondiente."
  explanation:
    es: "El Delegado de la Agencia Tributaria depende directamente del Delegado Especial. No depende del Director General, de quien depende el Delegado Especial. Tampoco de un Delegado Especial Adjunto. Y el Jefe de Dependencia Regional establece directrices en su ámbito, pero no es su superior directo."
  citation: "apartado octavo.1 Resolución de 13-01-2021 (estructura y organización territorial de la AEAT)"
  difficulty: 1
  tags:
  - "Delegaciones"
  - "jefatura"
