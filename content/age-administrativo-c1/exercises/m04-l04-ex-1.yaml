# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q001
  prompt:
    es: "Según el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el acto de acatamiento que se exige para adquirir la condición de funcionario de carrera comprende:"
  options:
  - id: a
    text:
      es: "La Constitución y las leyes aprobadas por las Cortes Generales, pero no el Estatuto de Autonomía correspondiente."
  - id: b
    text:
      es: "La Constitución, el Estatuto de Autonomía correspondiente y el código de conducta de los empleados públicos."
  - id: c
    correct: true
    text:
      es: "La Constitución y, en su caso, el Estatuto de Autonomía correspondiente y el resto del Ordenamiento Jurídico."
  - id: d
    text:
      es: "La Constitución y los tratados de la Unión Europea, pero no el resto del Ordenamiento Jurídico."
  explanation:
    es: "El artículo 62.1.c) exige el «acto de acatamiento de la Constitución y, en su caso, del Estatuto de Autonomía correspondiente y del resto del Ordenamiento Jurídico». Las leyes de las Cortes Generales sin el Estatuto dejan fuera el Estatuto, que la letra c) incluye «en su caso». Añadir el código de conducta cambia el objeto del acatamiento: la letra c) habla del Ordenamiento Jurídico, y el código de conducta es un conjunto de principios del Estatuto, no un objeto de acatamiento. Los tratados de la Unión Europea sin el resto del Ordenamiento contradicen «y del resto del Ordenamiento Jurídico»."
  citation: "art. 62.1.c) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q002
  prompt:
    es: "De acuerdo con el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la condición de funcionario de carrera se adquiere cumpliendo sus requisitos:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma sucesiva, en el orden en que el artículo los enumera."
  - id: b
    text:
      es: "De forma simultánea, en un único acto de nombramiento y toma de posesión."
  - id: c
    text:
      es: "En el orden que fije cada convocatoria, aunque altere el del artículo."
  - id: d
    text:
      es: "En cualquier orden, siempre que todos se cumplan dentro del mismo año."
  explanation:
    es: "El artículo 62.1 habla del «cumplimiento sucesivo» de cuatro requisitos: superación del proceso selectivo, nombramiento, acatamiento y toma de posesión. Se cumplen uno tras otro. La opción del acto único los hace simultáneos. La de la convocatoria deja el orden en manos de cada proceso, y el artículo no lo permite. La del mismo año admite cualquier orden y añade un límite que el artículo no fija."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q003
  prompt:
    es: "Según el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en el cumplimiento sucesivo de los requisitos, el acto de acatamiento de la Constitución se sitúa:"
  options:
  - id: a
    text:
      es: "Antes de la superación del proceso selectivo, al presentar la solicitud."
  - id: b
    text:
      es: "Entre la superación del proceso selectivo y el nombramiento."
  - id: c
    text:
      es: "Después de la toma de posesión, ya como funcionario de carrera."
  - id: d
    correct: true
    text:
      es: "Entre el nombramiento y la toma de posesión dentro de plazo."
  explanation:
    es: "El artículo 62.1 enumera los requisitos en este orden: superación del proceso selectivo, nombramiento, acto de acatamiento y toma de posesión. El acatamiento es el tercero, entre el nombramiento y la toma de posesión. La opción de la solicitud y la que lo sitúa antes del nombramiento lo adelantan. La que lo pone después de la toma de posesión lo retrasa, y la toma de posesión es el último requisito."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q004
  prompt:
    es: "De acuerdo con el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el nombramiento del funcionario de carrera lo hace:"
  options:
  - id: a
    text:
      es: "El órgano de selección que ha calificado las pruebas."
  - id: b
    correct: true
    text:
      es: "El órgano o autoridad competente para efectuarlo."
  - id: c
    text:
      es: "El presidente del órgano de selección, por delegación."
  - id: d
    text:
      es: "El órgano de selección, a propuesta del órgano convocante."
  explanation:
    es: "El artículo 62.1.b) pide el «Nombramiento por el órgano o autoridad competente». Las tres opciones restantes atribuyen el nombramiento al órgano de selección o a su presidente, y el artículo no les da esa función."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q005
  prompt:
    es: "El nombramiento por el órgano o autoridad competente, uno de los requisitos para adquirir la condición de funcionario de carrera, se publica:"
  options:
  - id: a
    text:
      es: "Solo en el tablón de anuncios del órgano que lo dicta."
  - id: b
    correct: true
    text:
      es: "En el Diario Oficial correspondiente."
  - id: c
    text:
      es: "Solo en la sede electrónica del órgano convocante."
  - id: d
