  prompt:
    es: "Según el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, entre los sujetos a los que se aplica, además de la Administración General del Estado y las Administraciones de las comunidades autónomas, se cuentan:"
