- id: m01-l04-q071
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las materias en las que, en particular, el artículo 122.2 de la Constitución Española de 1978 sitúa las funciones del Consejo General del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "Nombramientos, ascensos, inspección y régimen disciplinario."
  - id: b
    text:
      es: "Presupuestos, contratación, tributos y régimen penitenciario."
  - id: c
    text:
      es: "Legislación procesal, extranjería, indultos y régimen electoral."
  - id: d
    text:
      es: "Competencia, jurisdicción, casación y revisión de sentencias."
  explanation:
    es: "El artículo 122.2 cita «nombramientos, ascensos, inspección y régimen disciplinario». Las otras tres listas mezclan materias que no son funciones del Consejo (presupuestos, tributos, extranjería, indultos o la casación, propia de los Tribunales)."
  citation: "art. 122.2 CE"
  difficulty: 2
  tags:
  - "competencia"
