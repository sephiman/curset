caption:
  en: 'An order book ladder: bids on the left, asks on the right, and the spread in the middle. A market buy of 2,000 units eats through the lowest asks, lifting the average fill above the headline price.'
  es: 'Un libro de órdenes en escalera: compras a la izquierda, ventas a la derecha y el spread en medio. Una compra a mercado de 2.000 unidades consume las ventas más bajas, elevando el precio medio por encima del precio visible.'
svg: orderbook-depth
