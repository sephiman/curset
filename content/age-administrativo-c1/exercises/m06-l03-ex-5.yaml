    es: "En Windows 11, ¿qué ubicaciones indexa de forma predeterminada el modo Clásico de «Encontrar mis archivos» en la configuración de búsqueda?"
  options:
  - id: a
    text:
      es: "Todo el equipo, incluidas todas las carpetas y archivos de usuario"
  - id: b
