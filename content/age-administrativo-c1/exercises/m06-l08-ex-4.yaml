# anchor: fuente-ms-win-ping-html
- id: m06-l08-q116
  prompt:
    es: "En Windows 11, si el ping a una dirección IP funciona pero el ping al nombre del equipo no, ¿qué indica la documentación de ping?"
  options:
  - id: a
    text:
      es: "Es posible que haya un problema de conectividad IP con el destino"
  - id: b
    text:
      es: "Es seguro que el equipo de destino no está encendido"
  - id: c
    text:
      es: "Es posible que el protocolo ICMP esté desinstalado en el equipo local"
  - id: d
    correct: true
    text:
      es: "Es posible que haya un problema de resolución de nombres"
  explanation:
    es: "Si el ping a la IP funciona y el ping al nombre no, es posible que haya un problema de resolución de nombres. Un ping correcto a la IP demuestra la conectividad IP, que es lo que ping comprueba. Si el ping a la IP funciona, el equipo de destino responde, así que no puede estar apagado. ping funciona con la IP, así que el envío de solicitudes de eco ICMP está operativo en el equipo local."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
