# anchor: fuente-un-ods-objetivos-html
- id: m01-l06-q043
  prompt:
    es: "En la web de las Naciones Unidas en español, ¿qué Objetivo de Desarrollo Sostenible recibe el nombre abreviado de «Vida de ecosistemas terrestres»?"
  options:
  - id: a
    text:
      es: "El Objetivo de Desarrollo Sostenible 13."
  - id: b
    text:
      es: "El Objetivo de Desarrollo Sostenible 14."
  - id: c
    correct: true
    text:
      es: "El Objetivo de Desarrollo Sostenible 15."
  - id: d
    text:
      es: "El Objetivo de Desarrollo Sostenible 16."
  explanation:
    es: "«Vida de ecosistemas terrestres» es el Objetivo 15. El 13 es «Acción por el clima», el 14 «Vida submarina» y el 16 «Paz, justicia e instituciones sólidas»."
  citation: "fuente: `un-ods-objetivos.html`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q044
  prompt:
    es: "¿Qué número tiene la meta de la Agenda 2030 que consiste en promover la participación justa y equitativa en los beneficios derivados de la utilización de los recursos genéticos?"
  options:
  - id: a
    text:
      es: "La meta 12.6, del Objetivo 12."
  - id: b
    text:
      es: "La meta 14.6, del Objetivo 14."
  - id: c
    correct: true
    text:
      es: "La meta 15.6, del Objetivo 15."
  - id: d
    text:
      es: "La meta 16.6, del Objetivo 16."
  explanation:
    es: "Es la meta 15.6, del Objetivo 15. La 12.6 alienta a las empresas a adoptar prácticas sostenibles, la 14.6 trata de las subvenciones a la pesca y la 16.6 pide instituciones eficaces y transparentes que rindan cuentas."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q045
  prompt:
    es: "Entre las metas del Objetivo de Desarrollo Sostenible 15 de la Agenda 2030 para el Desarrollo Sostenible figura la de:"
  options:
  - id: a
    text:
      es: "Crear a todos los niveles instituciones eficaces y transparentes que rindan cuentas."
  - id: b
    correct: true
    text:
      es: "Promover la participación justa y equitativa en los beneficios derivados de la utilización de los recursos genéticos."
  - id: c
    text:
      es: "Garantizar el acceso público a la información y proteger las libertades fundamentales."
  - id: d
    text:
      es: "Garantizar la adopción en todos los niveles de decisiones inclusivas, participativas y representativas que respondan a las necesidades."
  explanation:
    es: "La participación justa y equitativa en los beneficios de los recursos genéticos es la meta 15.6. Las demás opciones son metas del Objetivo 16: la 16.6, la 16.10 y la 16.7."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-un-ods-objetivos-html
- id: m01-l06-q046
  prompt:
    es: "¿Qué nombre abreviado da la web de las Naciones Unidas en español al Objetivo de Desarrollo Sostenible 16 de la Agenda 2030?"
  options:
  - id: a
    text:
      es: "Paz, seguridad e instituciones eficaces."
  - id: b
    text:
      es: "Justicia, transparencia e instituciones abiertas."
  - id: c
    correct: true
    text:
      es: "Paz, justicia e instituciones sólidas."
  - id: d
    text:
      es: "Paz, justicia y rendición de cuentas."
  explanation:
    es: "La web de las Naciones Unidas llama al Objetivo 16 «Paz, justicia e instituciones sólidas». Las demás opciones cambian alguna de sus palabras."
  citation: "fuente: `un-ods-objetivos.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q096
  prompt:
    es: "Señale cómo considera los planes de Gobierno Abierto el Plan de Acción para la implementación de la Agenda 2030 del Gobierno de España, según lo recoge el Portal de la Transparencia:"
  options:
  - id: a
    text:
      es: "Un indicador de seguimiento de las metas del ODS 16."
  - id: b
    text:
      es: "Una política que contribuye únicamente al ODS 16."
  - id: c
    correct: true
    text:
      es: "Una política palanca para alcanzar los ODS, que contribuye al ODS 16 y acelera el resto."
  - id: d
    text:
      es: "Un instrumento de evaluación de los planes autonómicos."
  explanation:
    es: "El Plan de Acción considera los planes de Gobierno Abierto una política palanca para alcanzar los ODS, por su contribución al ODS 16 y porque aceleran el resto. No son un indicador de seguimiento. No contribuyen únicamente al ODS 16, porque aceleran los demás. Tampoco son un instrumento de evaluación de los planes autonómicos."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 3
  tags:
  - "concepto"
