# anchor: boe-a-1978-31229-art-97
- id: m03-l01-q033
  prompt:
    es: "Según el artículo 97 de la Constitución Española de 1978, ¿a quién corresponde ejercer la potestad reglamentaria?"
  options:
  - id: a
    text:
      es: "A las Cortes Generales, mediante leyes de bases."
  - id: b
    text:
      es: "Al Rey, a propuesta del Presidente del Gobierno."
  - id: c
    correct: true
    text:
      es: "Al Gobierno, de acuerdo con la Constitución y las leyes."
  - id: d
    text:
      es: "Al Consejo de Estado, mediante dictamen preceptivo."
  explanation:
    es: "El artículo 97 dice que el Gobierno «ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes». Las Cortes Generales ejercen la potestad legislativa, y la ley de bases sirve para delegarla. El Rey no ejerce la potestad reglamentaria. El Consejo de Estado es órgano consultivo: dictamina los reglamentos, no los dicta."
  citation: "art. 97 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q034
  prompt:
    es: "De acuerdo con el artículo 128.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el ejercicio de la potestad reglamentaria corresponde:"
  options:
  - id: a
    text:
      es: "Solo al Gobierno de la Nación y a los órganos de Gobierno de las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Al Gobierno de la Nación, a los órganos de Gobierno autonómicos y a los órganos de gobierno locales."
  - id: c
    text:
      es: "Al Gobierno de la Nación, a las Cortes Generales y a las Asambleas Legislativas autonómicas."
  - id: d
    text:
      es: "Al Gobierno de la Nación y a los órganos de gobierno locales, pero no a las Comunidades Autónomas."
  explanation:
    es: "El artículo 128.1 atribuye la potestad reglamentaria «al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas […] y a los órganos de gobierno locales». La opción que la limita al Estado y a las Comunidades Autónomas deja fuera a los entes locales; la que excluye a las Comunidades Autónomas deja fuera a sus Gobiernos. Las Cortes y las Asambleas Legislativas ejercen la potestad legislativa, no la reglamentaria."
  citation: "art. 128.1 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q035
  prompt:
    es: "¿De conformidad con qué ejercen la potestad reglamentaria los órganos de Gobierno de las Comunidades Autónomas, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "De conformidad con la Ley 7/1985, reguladora de las Bases del Régimen Local."
  - id: b
    text:
      es: "De conformidad con lo que disponga el Gobierno de la Nación."
  - id: c
    text:
      es: "De conformidad con las leyes de bases que aprueben las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "De conformidad con lo establecido en sus respectivos Estatutos."
  explanation:
    es: "El artículo 128.1 dice que la potestad reglamentaria corresponde a los órganos de Gobierno de las Comunidades Autónomas «de conformidad con lo establecido en sus respectivos Estatutos». La Ley 7/1985 es la referencia de los órganos de gobierno locales. El Gobierno de la Nación no fija el marco de la potestad autonómica, y las leyes de bases son leyes de delegación en el Gobierno de la Nación."
  citation: "art. 128.1 LPAC"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-129
- id: m03-l01-q036
  prompt:
    es: "Según el artículo 129.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las habilitaciones para el desarrollo reglamentario de una ley serán conferidas, con carácter general:"
  options:
  - id: a
    correct: true
    text:
      es: "Al Gobierno, y la atribución directa a los Ministros tendrá carácter excepcional."
  - id: b
    text:
      es: "A los titulares de los departamentos ministeriales competentes por razón de la materia."
  - id: c
    text:
      es: "A las Comisiones Delegadas del Gobierno competentes por razón de la materia."
  - id: d
    text:
      es: "A la Comisión General de Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 129.4 dice que las habilitaciones «serán conferidas, con carácter general, al Gobierno», y que la atribución directa a los titulares de los departamentos ministeriales «tendrá carácter excepcional». Los Ministros son, por tanto, la excepción y no la regla. Las Comisiones Delegadas y la Comisión General de Secretarios de Estado y Subsecretarios no son los destinatarios generales de la habilitación."
  citation: "art. 129.4 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-129
- id: m03-l01-q037
  prompt:
    es: "Según el artículo 129.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué carácter tiene la atribución directa de la habilitación reglamentaria a los Ministros?"
  options:
  - id: a
    text:
      es: "Ordinario, sin necesidad de justificación."
  - id: b
    correct: true
    text:
      es: "Excepcional, y deberá justificarse en la ley habilitante."
  - id: c
    text:
      es: "Excepcional, y deberá justificarse en el preámbulo del reglamento."
  - id: d
    text:
      es: "Subsidiario, para cuando el Gobierno no dicte el reglamento en plazo."
  explanation:
    es: "El artículo 129.4 dice que la atribución directa a los titulares de los departamentos ministeriales «tendrá carácter excepcional y deberá justificarse en la ley habilitante». No es ordinaria. La justificación va en la ley que habilita, no en el reglamento. El texto no la configura como subsidiaria de la inactividad del Gobierno."
  citation: "art. 129.4 LPAC"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1997-25336-art-24
- id: m03-l01-q038
  prompt:
    es: "De acuerdo con el artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, revisten la forma de Reales Decretos Legislativos y Reales Decretos-leyes:"
  options:
  - id: a
    text:
      es: "Las decisiones que aprueban normas reglamentarias de la competencia del Consejo de Ministros."
  - id: b
    text:
      es: "Las disposiciones y actos cuya adopción venga atribuida al Presidente del Gobierno."
  - id: c
    text:
      es: "Las decisiones del Consejo de Ministros que no deban adoptar la forma de Real Decreto."
  - id: d
    correct: true
    text:
      es: "Las decisiones que aprueban las normas previstas en los artículos 82 y 86 de la Constitución."
  explanation:
    es: "El artículo 24.1.a) dice que son Reales Decretos Legislativos y Reales Decretos-leyes «las decisiones que aprueban, respectivamente, las normas previstas en los artículos 82 y 86 de la Constitución». Las normas reglamentarias del Consejo de Ministros son Reales Decretos acordados en Consejo de Ministros. Los actos atribuidos al Presidente son Reales Decretos del Presidente. Las decisiones del Consejo que no deban ser Real Decreto son Acuerdos."
  citation: "art. 24.1.a) Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-24
- id: m03-l01-q039
  prompt:
    es: "Según el artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué forma revisten los acuerdos de una Comisión Delegada del Gobierno cuando la competencia corresponde a distintos Ministros?"
  options:
  - id: a
    text:
      es: "Real Decreto acordado en Consejo de Ministros, a propuesta de los Ministros interesados."
  - id: b
    text:
      es: "Orden conjunta de todos los Ministros competentes por razón de la materia."
  - id: c
    text:
      es: "Acuerdo de la Comisión Delegada, firmado por el Presidente del Gobierno."
  - id: d
    correct: true
    text:
      es: "Orden del Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  explanation:
    es: "El artículo 24.1.e) dice que esos acuerdos revisten «la forma de Orden del Ministro competente o del Ministro de la Presidencia, cuando la competencia corresponda a distintos Ministros». Hoy ese Ministro es el de la Presidencia, Justicia y Relaciones con las Cortes (art. 3.1 RD 829/2023). La ley no prevé una orden conjunta de varios Ministros, ni la forma de Real Decreto, ni un acuerdo firmado por el Presidente."
  citation: "art. 24.1.e) Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1980-8648-art-22
- id: m03-l01-q040
  prompt:
    es: "De acuerdo con el artículo 22.3 de la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, sobre los reglamentos que se dicten en ejecución de las Leyes deberá ser consultada:"
  options:
  - id: a
    correct: true
    text:
      es: "La Comisión Permanente del Consejo de Estado."
  - id: b
    text:
      es: "El Pleno del Consejo de Estado."
  - id: c
    text:
      es: "La Comisión de Estudios del Consejo de Estado."
  - id: d
    text:
      es: "La Secretaría General del Consejo de Estado."
  explanation:
    es: "El artículo 22 dice que «la Comisión Permanente del Consejo de Estado deberá ser consultada» en los asuntos que enumera, y el número tres son los «reglamentos o disposiciones de carácter general que se dicten en ejecución de las Leyes». El Pleno, la Comisión de Estudios y la Secretaría General son otros órganos del Consejo de Estado, y el artículo 22 no les atribuye esta consulta."
  citation: "art. 22.3 LO 3/1980"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1980-8648-art-22
- id: m03-l01-q041
  prompt:
    es: "Según el artículo 22.3 de la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, ¿sobre qué disposiciones deberá ser consultada la Comisión Permanente?"
  options:
  - id: a
    text:
      es: "Sobre los reglamentos que se dicten en ejecución de las Leyes, pero no sobre sus modificaciones."
  - id: b
    text:
      es: "Solo sobre los reglamentos aprobados por Real Decreto del Presidente del Gobierno."
  - id: c
    correct: true
    text:
      es: "Sobre los reglamentos que se dicten en ejecución de las Leyes, así como sus modificaciones."
  - id: d
    text:
      es: "Solo sobre los reglamentos autonómicos que desarrollen leyes estatales."
  explanation:
    es: "El número tres del artículo 22 incluye los «reglamentos o disposiciones de carácter general que se dicten en ejecución de las Leyes, así como sus modificaciones». Las modificaciones también se consultan. El texto no limita la consulta a los Reales Decretos del Presidente ni a los reglamentos autonómicos."
  citation: "art. 22.3 LO 3/1980"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q042
  prompt:
    es: "Según el artículo 128.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los reglamentos y disposiciones administrativas no podrán:"
  options:
  - id: a
    text:
      es: "Desarrollar las leyes que les sirven de habilitación."
  - id: b
    correct: true
    text:
      es: "Establecer tributos, exacciones parafiscales u otras prestaciones patrimoniales de carácter público."
  - id: c
    text:
      es: "Colaborar con la ley en la regulación de una materia."
  - id: d
    text:
      es: "Regular aspectos parciales de una materia ya regulada por ley."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos no podrán «establecer penas o sanciones, así como tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales de carácter público». El mismo apartado salva «su función de desarrollo o colaboración con respecto a la ley», así que desarrollar la ley, colaborar con ella y regular aspectos parciales dentro de ese marco son tareas propias del reglamento."
  citation: "art. 128.2 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q043
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los límites de los reglamentos es correcta según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Pueden establecer sanciones cuando la ley que desarrollan no las prevea."
  - id: b
    text:
      es: "Pueden tipificar infracciones administrativas si se aprueban por Real Decreto."
  - id: c
    text:
      es: "Pueden establecer tributos si lo autoriza una Orden Ministerial."
  - id: d
    correct: true
    text:
      es: "No pueden tipificar delitos, faltas o infracciones administrativas."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos «no podrán tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones, así como tributos». La prohibición no depende del rango: tampoco un Real Decreto puede tipificar infracciones. Que la ley no prevea sanciones no habilita al reglamento para crearlas, y una Orden Ministerial no puede autorizar tributos."
  citation: "art. 128.2 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q044
  prompt:
    es: "Según el artículo 128.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué materias quedan fuera del alcance de los reglamentos?"
  options:
  - id: a
    text:
      es: "Las que no hayan sido objeto de consulta pública previa."
  - id: b
    text:
      es: "Las que regulen solo aspectos parciales de una materia."
  - id: c
    correct: true
    text:
      es: "Las que la Constitución o los Estatutos reconocen de la competencia de los Parlamentos."
  - id: d
    text:
      es: "Las que no figuren en el Plan Anual Normativo del año en curso."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos no podrán «regular aquellas materias que la Constitución o los Estatutos de Autonomía reconocen de la competencia de las Cortes Generales o de las Asambleas Legislativas de las Comunidades Autónomas». La consulta pública puede omitirse en ciertos casos (art. 26.2 Ley 50/1997) y su falta no saca una materia del alcance del reglamento. Regular aspectos parciales de una materia solo permite omitir la consulta pública (art. 26.2.e Ley 50/1997). El Plan Anual Normativo no delimita qué puede regular un reglamento."
  citation: "art. 128.2 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-47
- id: m03-l01-q045
  prompt:
    es: "De acuerdo con el artículo 47.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán nulas de pleno derecho las disposiciones administrativas que establezcan:"
  options:
  - id: a
    text:
      es: "La retroactividad de disposiciones sancionadoras favorables a los interesados."
  - id: b
    correct: true
    text:
      es: "La retroactividad de disposiciones sancionadoras no favorables."
  - id: c
    text:
      es: "La irretroactividad de disposiciones restrictivas de derechos individuales."
  - id: d
    text:
      es: "La irretroactividad de sanciones desfavorables."
  explanation:
    es: "El artículo 47.2 declara nulas las disposiciones que establezcan «la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales». La retroactividad de las favorables no está en la lista. Las dos opciones que hablan de irretroactividad invierten el supuesto: la irretroactividad de esas disposiciones es justo lo que garantiza el artículo 9.3 CE."
  citation: "art. 47.2 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l01-q046
  prompt:
    es: "¿Cuál de las siguientes disposiciones administrativas es nula de pleno derecho según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La que regula materias reservadas a la Ley."
  - id: b
    text:
      es: "La que no figuraba en el Plan Anual Normativo."
  - id: c
    text:
      es: "La que reduce a diez días hábiles la audiencia pública por razones motivadas."
  - id: d
    text:
      es: "La que se tramita por urgencia sin consulta pública previa."
  explanation:
    es: "El artículo 47.2 declara nulas de pleno derecho las disposiciones administrativas que «regulen materias reservadas a la Ley». Las otras tres no son causa de nulidad. La audiencia puede reducirse hasta siete días hábiles por razones motivadas (art. 26.6 Ley 50/1997), y la consulta pública puede omitirse con tramitación urgente (art. 26.2.f). El artículo 47.2 no recoge la falta de inclusión en el Plan Anual Normativo."
  citation: "art. 47.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-37
- id: m03-l01-q047
  prompt:
    es: "Según el artículo 37.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las resoluciones administrativas de carácter particular no podrán vulnerar una disposición de carácter general:"
  options:
  - id: a
    text:
      es: "Salvo que procedan de un órgano de superior jerarquía al que dictó la disposición."
  - id: b
    text:
      es: "Salvo que procedan del mismo órgano que dictó la disposición general."
  - id: c
    text:
      es: "Salvo que las dicte el Consejo de Ministros mediante Real Decreto motivado."
  - id: d
    correct: true
    text:
      es: "Aunque procedan de un órgano de igual o superior jerarquía al que dictó la disposición."
  explanation:
    es: "El artículo 37.1 dice que no podrán vulnerarla «aunque aquéllas procedan de un órgano de igual o superior jerarquía al que dictó la disposición general». Ni el órgano superior, ni el mismo órgano, ni el Consejo de Ministros pueden dispensar de la disposición general en un caso particular."
  citation: "art. 37.1 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-129
- id: m03-l01-q048
  prompt:
    es: "De acuerdo con el artículo 129.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el ejercicio de la potestad reglamentaria las Administraciones actuarán conforme a los principios de:"
  options:
  - id: a
    text:
      es: "Necesidad, eficacia, proporcionalidad, seguridad jurídica, jerarquía y eficiencia."
  - id: b
    correct: true
    text:
      es: "Necesidad, eficacia, proporcionalidad, seguridad jurídica, transparencia y eficiencia."
  - id: c
    text:
      es: "Necesidad, eficacia, legalidad, seguridad jurídica, transparencia y economía."
  - id: d
    text:
      es: "Oportunidad, eficacia, proporcionalidad, publicidad, transparencia y eficiencia."
  explanation:
    es: "El artículo 129.1 enumera seis principios: «necesidad, eficacia, proporcionalidad, seguridad jurídica, transparencia, y eficiencia». Las otras opciones cambian alguno: jerarquía por transparencia, legalidad por proporcionalidad y economía por eficiencia, oportunidad por necesidad y publicidad por seguridad jurídica."
  citation: "art. 129.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-25
- id: m03-l01-q049
  prompt:
    es: "Según el artículo 25.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Plan Normativo que aprueba anualmente el Gobierno contendrá las iniciativas legislativas o reglamentarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Que vayan a ser elevadas para su aprobación en el año siguiente."
  - id: b
    text:
      es: "Que vayan a ser elevadas para su aprobación en los dos años siguientes."
  - id: c
    text:
      es: "Que se aprobaron el año anterior."
  - id: d
    text:
      es: "Que vayan a ser elevadas para su aprobación en la legislatura en curso."
  explanation:
    es: "El artículo 25.1 dice que el Plan contendrá las iniciativas «que vayan a ser elevadas para su aprobación en el año siguiente». Es un plan de un año, no de dos ni de toda la legislatura, y mira al futuro, no a lo aprobado el año anterior."
  citation: "art. 25.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-25
- id: m03-l01-q050
  prompt:
    es: "¿Antes de qué fecha se eleva el Plan Anual Normativo al Consejo de Ministros para su aprobación, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Antes del 31 de marzo de cada año."
  - id: b
    text:
      es: "Antes del 30 de junio de cada año."
  - id: c
    correct: true
    text:
      es: "Antes del 30 de abril de cada año."
  - id: d
    text:
      es: "Antes del 31 de diciembre de cada año."
  explanation:
    es: "El artículo 25.4 dice que el Ministro de la Presidencia «elevará el Plan al Consejo de Ministros para su aprobación antes del 30 de abril». El 31 de marzo, el 30 de junio y el 31 de diciembre no son fechas que fije la ley."
  citation: "art. 25.4 Ley 50/1997"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q051
  prompt:
    es: "Según el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, podrá prescindirse del trámite de consulta pública cuando la propuesta normativa:"
  options:
  - id: a
    text:
      es: "Regule de forma completa una materia que carecía de regulación."
  - id: b
    text:
      es: "Imponga obligaciones relevantes a sus destinatarios."
  - id: c
    text:
      es: "Afecte a los derechos e intereses legítimos de las personas."
  - id: d
    correct: true
    text:
      es: "Regule aspectos parciales de una materia."
  explanation:
    es: "El artículo 26.2.e) permite prescindir de la consulta «cuando la propuesta regule aspectos parciales de una materia». Regular una materia por completo no figura entre los supuestos. La ley permite prescindir cuando la propuesta «no imponga obligaciones relevantes», no cuando las imponga. Afectar a derechos e intereses legítimos es lo que obliga a la audiencia pública del artículo 26.6, no una causa para omitir la consulta."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q052
  prompt:
    es: "¿Cuál de las siguientes circunstancias permite prescindir de la consulta pública previa según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Que se trate de normas presupuestarias u organizativas de la Administración General del Estado."
  - id: b
    text:
      es: "Que la propuesta normativa afecte a las competencias de varios departamentos ministeriales."
  - id: c
    text:
      es: "Que la propuesta normativa desarrolle una ley orgánica aprobada por las Cortes Generales."
  - id: d
    text:
      es: "Que la propuesta normativa vaya a someterse después al dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 26.2.a) permite prescindir de la consulta «cuando se trate de normas presupuestarias u organizativas de la Administración General del Estado o de las organizaciones dependientes o vinculadas a éstas». Que la propuesta afecte a varios Ministerios, desarrolle una ley orgánica o vaya a pasar por el Consejo de Estado no está entre las seis circunstancias del artículo."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q053
  prompt:
    es: "En la elaboración de los reglamentos del Estado, podrá prescindirse del trámite de consulta pública previa cuando concurran:"
  options:
  - id: a
    text:
      es: "Razones de oportunidad del Ministro proponente."
  - id: b
    correct: true
    text:
      es: "Razones graves de interés público que lo justifiquen."
  - id: c
    text:
      es: "Razones de eficiencia en la gestión de los recursos públicos."
  - id: d
    text:
      es: "Razones de simplificación administrativa debidamente motivadas."
  explanation:
    es: "El artículo 26.2.b) de la Ley 50/1997 permite prescindir de la consulta «cuando concurran razones graves de interés público que lo justifiquen». La oportunidad apreciada por el Ministro, la eficiencia en la gestión y la simplificación administrativa no figuran entre las circunstancias del artículo."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q054
  prompt:
    es: "De acuerdo con el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la consulta pública deberá proporcionar un tiempo suficiente, que en ningún caso será inferior a:"
  options:
  - id: a
    text:
      es: "Un plazo de quince días hábiles."
  - id: b
    text:
      es: "Un plazo de siete días naturales."
  - id: c
    text:
      es: "Un plazo de treinta días naturales."
  - id: d
    correct: true
    text:
      es: "Un plazo de quince días naturales."
  explanation:
    es: "El artículo 26.2 exige un tiempo suficiente, «que en ningún caso será inferior a quince días naturales». Los quince días hábiles son el plazo mínimo de la audiencia e información públicas (art. 26.6), no de la consulta. Siete días es el mínimo al que puede reducirse esa audiencia, y en días hábiles. Treinta días no es un plazo del artículo."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q055
  prompt:
    es: "¿Qué órgano elabora con carácter preceptivo la Memoria del Análisis de Impacto Normativo, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "La elabora la Secretaría General Técnica del Ministerio proponente."
  - id: b
    correct: true
    text:
      es: "La elabora el centro directivo competente."
  - id: c
    text:
      es: "La elabora la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    text:
      es: "La elabora la Comisión Permanente del Consejo de Estado."
  explanation:
    es: "El artículo 26.3 dice: «El centro directivo competente elaborará con carácter preceptivo una Memoria del Análisis de Impacto Normativo». La Secretaría General Técnica informa los proyectos, la Comisión General de Secretarios de Estado y Subsecretarios los examina antes del Consejo de Ministros y la Comisión Permanente del Consejo de Estado dictamina; ninguno elabora la Memoria."
  citation: "art. 26.3 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q056
  prompt:
    es: "Según el artículo 26.6 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el plazo mínimo de la audiencia e información públicas será de:"
  options:
  - id: a
    text:
      es: "Quince días naturales, reducible hasta un mínimo de siete días naturales."
  - id: b
    text:
      es: "Diez días hábiles, reducible hasta un mínimo de cinco días hábiles."
  - id: c
    correct: true
    text:
      es: "Quince días hábiles, reducible hasta un mínimo de siete días hábiles."
  - id: d
    text:
      es: "Treinta días hábiles, reducible hasta un mínimo de quince días hábiles."
  explanation:
    es: "El artículo 26.6 dice que el plazo mínimo «será de 15 días hábiles, y podrá ser reducido hasta un mínimo de siete días hábiles». Los quince días naturales son el mínimo de la consulta pública previa (art. 26.2). Diez y cinco días, o treinta y quince, no son los plazos de este artículo."
  citation: "art. 26.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-26
- id: m03-l01-q057
  prompt:
    es: "¿En cuál de los siguientes casos puede reducirse a siete días hábiles la audiencia e información públicas, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Cuando la propuesta regule aspectos parciales de una materia."
  - id: b
    text:
      es: "Cuando el Consejo de Estado haya emitido ya su dictamen."
  - id: c
    text:
      es: "Cuando la norma vaya a entrar en vigor el día siguiente al de su publicación."
  - id: d
    correct: true
    text:
      es: "Cuando se aplique la tramitación urgente de iniciativas normativas."
  explanation:
    es: "El artículo 26.6 permite reducir el plazo hasta siete días hábiles «cuando razones debidamente motivadas así lo justifiquen; así como cuando se aplique la tramitación urgente de iniciativas normativas». Regular aspectos parciales de una materia permite prescindir de la consulta pública previa (art. 26.2.e), no reducir la audiencia. El dictamen del Consejo de Estado y la fecha de entrada en vigor no son causas de reducción."
  citation: "art. 26.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
