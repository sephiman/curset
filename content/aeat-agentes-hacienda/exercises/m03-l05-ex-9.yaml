# anchor: boe-a-2015-10565-art-43
- id: m03-l05-q0239
  prompt:
    es: "Conforme al artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones por medios electrónicos se entienden practicadas en el momento en que:"
  options:
  - id: a
    text:
      es: "se pone a disposición la notificación en la sede electrónica."
  - id: b
    correct: true
    text:
      es: "se produce el acceso a su contenido."
  - id: c
    text:
      es: "se envía el aviso de la notificación al dispositivo del interesado."
  - id: d
    text:
      es: "transcurren diez días naturales desde su envío al destinatario."
  explanation:
    es: "La notificación electrónica se entiende practicada cuando se accede a su contenido. La puesta a disposición, el aviso al dispositivo y el transcurso de diez días naturales no son, por sí solos, ese momento. A los diez días, la notificación obligatoria se entiende rechazada."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "notificaciones"
  - "medios electrónicos"
# anchor: boe-a-2015-10565-art-14
- id: m03-l05-q0241
  prompt:
    es: "¿Cuál de los siguientes sujetos está obligado a relacionarse a través de medios electrónicos con las Administraciones Públicas para cualquier trámite, según el artículo 14.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Las personas físicas que no ejerzan una actividad profesional con colegiación obligatoria."
  - id: b
    text:
      es: "Los ciudadanos que hayan solicitado por escrito la comunicación en papel."
  - id: c
    text:
      es: "Los obligados cuyo domicilio fiscal radique fuera de España."
  - id: d
    correct: true
    text:
      es: "Las personas jurídicas."
  explanation:
    es: "El artículo 14.2.a) obliga a las personas jurídicas. Las personas físicas pueden elegir (art. 14.1) salvo los supuestos del apartado 2, y ni la petición de comunicación en papel ni el domicilio en el extranjero figuran en esa lista."
  citation: "art. 14.2 LPAC"
  difficulty: 1
  tags:
  - "notificaciones"
  - "medios electrónicos"
# anchor: boe-a-2003-23186-art-110
- id: m03-l05-q0242
  prompt:
    es: "Conforme al artículo 110.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los procedimientos iniciados a solicitud del interesado, la notificación se practica en el lugar señalado a tal efecto por:"
  options:
  - id: a
    text:
      es: "el obligado tributario, pero nunca por su representante."
  - id: b
    text:
      es: "la Administración tributaria, tras consultar los datos del censo."
  - id: c
    text:
      es: "el órgano competente para la tramitación del procedimiento."
  - id: d
    correct: true
    text:
      es: "el obligado tributario o su representante."
  explanation:
    es: "Lugar señalado a tal efecto por el obligado tributario o su representante (art. 110.1). No se excluye al representante, ni lo fija la Administración con los datos del censo, ni el órgano tramitador."
  citation: "art. 110.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "lugar"
# anchor: boe-a-2003-23186-art-110
- id: m03-l05-q0243
  prompt:
    es: "Alicia Rueda presenta una solicitud que inicia un procedimiento tributario y no señala ningún lugar para las notificaciones. Su domicilio fiscal es distinto de su residencia habitual. Según el artículo 110.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿dónde debe practicarse la notificación?"
  options:
  - id: a
    correct: true
    text:
      es: "En su domicilio fiscal o en el de su representante, en defecto de lugar señalado."
  - id: b
    text:
      es: "En la sede de la Administración tributaria que tramita el procedimiento."
  - id: c
    text:
      es: "En su residencia habitual, aunque no coincida con su domicilio fiscal."
  - id: d
    text:
      es: "Mediante anuncio publicado directamente en el «Boletín Oficial del Estado», sin intentos previos."
  explanation:
    es: "A falta de lugar señalado, la notificación se practica en el domicilio fiscal del obligado o de su representante (art. 110.1). No se notifica en la sede de la Administración, ni en la residencia habitual si difiere del domicilio fiscal, ni por anuncio, que exige intentos previos fallidos."
  citation: "art. 110.1 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "lugar"
# anchor: boe-a-2003-23186-art-110
- id: m03-l05-q0244
  prompt:
    es: "En un procedimiento tributario iniciado de oficio, la Administración intenta notificar una liquidación a un empresario en el local donde desarrolla su actividad económica. Conforme al artículo 110.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede practicarse allí la notificación?"
  options:
  - id: a
    text:
      es: "No, porque en los procedimientos de oficio solo puede practicarse en el domicilio fiscal."
  - id: b
    correct: true
    text:
      es: "Sí, porque en los procedimientos de oficio puede practicarse en el lugar donde se desarrolle la actividad económica."
  - id: c
    text:
      es: "No, salvo que el empresario haya señalado ese lugar por escrito en el procedimiento."
  - id: d
    text:
      es: "Sí, pero solo si antes se intentó sin éxito la notificación en el domicilio fiscal."
  explanation:
    es: "En los procedimientos de oficio la notificación podrá practicarse en el domicilio fiscal, en el centro de trabajo, en el lugar donde se desarrolle la actividad económica o en cualquier otro adecuado (art. 110.2). No se limita al domicilio fiscal, no exige que el obligado señale el lugar y no impone un intento previo en el domicilio."
  citation: "art. 110.2 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "lugar"
# anchor: boe-a-2003-23186-art-110
- id: m03-l05-q0245
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el lugar de práctica de las notificaciones es CORRECTA, según el artículo 110 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "En los procedimientos de oficio debe practicarse en el lugar que señale el obligado, y en los iniciados a solicitud, en el centro de trabajo."
  - id: b
    text:
      es: "En ambos tipos de procedimientos solo puede practicarse en el domicilio fiscal del obligado tributario."
  - id: c
    correct: true
    text:
      es: "En los procedimientos de oficio puede practicarse además en el centro de trabajo, y en los iniciados a solicitud, en el lugar que señale el obligado o su representante."
  - id: d
    text:
      es: "En ambos tipos de procedimientos puede practicarse en el lugar donde se desarrolle la actividad económica."
  explanation:
    es: "El artículo 110.1 se aplica a los iniciados a solicitud (lugar señalado por el obligado o su representante) y el 110.2 a los de oficio (domicilio fiscal, centro de trabajo, lugar de la actividad económica u otro adecuado). Las demás opciones intercambian los procedimientos o igualan los lugares de ambos."
  citation: "art. 110 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "lugar"
# anchor: boe-a-2003-23186-art-111
- id: m03-l05-q0246
  prompt:
    es: "De acuerdo con el artículo 111.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, de no hallarse presentes el obligado ni su representante, podrá hacerse cargo de la notificación cualquier persona que se encuentre en el lugar o domicilio y:"
  options:
  - id: a
    text:
      es: "acredite ser familiar del obligado tributario."
  - id: b
    text:
      es: "sea mayor de edad y firme el acuse de recibo."
  - id: c
    text:
      es: "presente un poder suficiente del obligado tributario."
  - id: d
    correct: true
    text:
      es: "haga constar su identidad."
  explanation:
    es: "Basta que la persona que se encuentre en el lugar o domicilio haga constar su identidad (art. 111.1). No se exige parentesco, mayoría de edad con acuse firmado ni poder del obligado."
  citation: "art. 111.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "personas legitimadas"
# anchor: boe-a-2003-23186-art-111
- id: m03-l05-q0247
  prompt:
    es: "Según el artículo 111.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, también pueden hacerse cargo de la notificación, de no hallarse presentes el obligado ni su representante, los empleados de:"
  options:
  - id: a
    text:
      es: "las empresas de mensajería o reparto que operen en la zona del domicilio fiscal del obligado."
  - id: b
    text:
      es: "la Administración local del municipio donde radique el domicilio fiscal del obligado."
  - id: c
    text:
      es: "la comunidad de propietarios donde radique el domicilio de un familiar del obligado."
  - id: d
    correct: true
    text:
      es: "la comunidad de vecinos o de propietarios donde radique el lugar señalado a efectos de notificaciones o el domicilio fiscal."
  explanation:
    es: "Los empleados de la comunidad de vecinos o propietarios donde radique el lugar señalado o el domicilio fiscal pueden recibir la notificación (art. 111.1). Los de empresas de mensajería, los de la Administración local y los de la comunidad donde viva un familiar no están incluidos."
  citation: "art. 111.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "personas legitimadas"
# anchor: boe-a-2003-23186-art-111
- id: m03-l05-q0248
  prompt:
    es: "El destinatario de una notificación tributaria, que se encuentra en su domicilio fiscal, rechaza recibirla. Conforme al artículo 111.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto tiene el rechazo?"
  options:
  - id: a
    text:
      es: "Obliga a la Administración a intentar de nuevo la notificación en un plazo de tres días."
  - id: b
    correct: true
    text:
      es: "Implica que se tenga por efectuada la notificación."
  - id: c
    text:
      es: "Obliga a la Administración a citar al destinatario por comparecencia mediante anuncio."
  - id: d
    text:
      es: "Deja sin efecto la notificación hasta que el destinatario manifieste su voluntad de recibirla."
  explanation:
    es: "El rechazo realizado por el interesado o su representante implica que se tenga por efectuada la notificación (art. 111.2). No obliga a reintentarla, ni a citar por comparecencia ni la deja sin efecto."
  citation: "art. 111.2 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "rechazo"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0249
  prompt:
    es: "Según el artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando no sea posible notificar por causas no imputables a la Administración, e intentada al menos dos veces en el domicilio, será suficiente un solo intento cuando:"
  options:
  - id: a
    text:
      es: "el destinatario sea una persona jurídica con domicilio fiscal en España."
  - id: b
    text:
      es: "el domicilio fiscal del destinatario radique en el extranjero."
  - id: c
    text:
      es: "el destinatario haya rehusado una notificación anterior del mismo procedimiento."
  - id: d
    correct: true
    text:
      es: "el destinatario conste como desconocido en dicho domicilio o lugar."
  explanation:
    es: "Un solo intento basta cuando el destinatario consta como desconocido en el domicilio o lugar (art. 112.1). La condición de persona jurídica, el domicilio en el extranjero o el rechazo anterior no reducen los intentos."
  citation: "art. 112.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0251
  prompt:
    es: "Al intentar notificar una resolución en el domicilio fiscal de un obligado, el notificador comprueba que consta como desconocido en ese domicilio. Conforme al artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuántos intentos de notificación son necesarios antes de la citación por comparecencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Es suficiente un solo intento."
  - id: b
    text:
      es: "Son necesarios dos intentos en días distintos."
  - id: c
    text:
      es: "Son necesarios tres intentos con quince días de diferencia."
  - id: d
    text:
      es: "No es necesario ningún intento, porque se cita de inmediato."
  explanation:
    es: "Si el destinatario consta como desconocido en el domicilio, basta un intento (art. 112.1). La regla general de dos intentos cede, no se exigen tres y tampoco puede omitirse todo intento."
  citation: "art. 112.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0252
  prompt:
    es: "¿Qué días de la semana se publican en el «Boletín Oficial del Estado» los anuncios de citación por comparecencia, según el artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Martes y jueves de cada semana."
  - id: b
    correct: true
    text:
      es: "Lunes, miércoles y viernes de cada semana."
  - id: c
    text:
      es: "Lunes y jueves de cada semana."
  - id: d
    text:
      es: "Días hábiles de cada semana sin excepción."
  explanation:
    es: "La publicación se efectúa los lunes, miércoles y viernes de cada semana (art. 112.1). Martes y jueves, lunes y jueves o cualquier día hábil no son los días previstos."
  citation: "art. 112.1 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0253
  prompt:
    es: "¿Cuál de las siguientes fechas es un día en que, según el artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se efectúa la publicación en el «Boletín Oficial del Estado» de los anuncios de citación por comparecencia?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 11 de marzo de 2026."
  - id: b
    text:
      es: "El martes 10 de marzo de 2026."
  - id: c
    text:
      es: "El jueves 12 de marzo de 2026."
  - id: d
    text:
      es: "El sábado 14 de marzo de 2026."
  explanation:
    es: "La publicación se hace los lunes, miércoles y viernes. El 11 de marzo de 2026 es miércoles. El martes 10, el jueves 12 y el sábado 14 no son días de publicación."
