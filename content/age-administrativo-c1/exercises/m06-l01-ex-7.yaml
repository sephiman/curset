# anchor: fuente-azure-almacenamiento-nube-html
- id: m06-l01-q221
  prompt:
    es: "Según la página de Microsoft Azure sobre qué es el almacenamiento en la nube, este guarda los datos:"
  options:
  - id: a
    text:
      es: "en el disco duro del equipo, sincronizado con la red local."
  - id: b
    text:
      es: "en hardware local de la organización, con copia en Internet."
  - id: c
    correct: true
    text:
      es: "en servidores remotos a los que se accede online."
  - id: d
    text:
      es: "en unidades de memoria de la propia aplicación móvil."
  explanation:
    es: "La página define el almacenamiento en la nube como el que «guarda datos en servidores remotos a los que se accede online, en lugar de en hardware local». La página dice que se guardan en servidores remotos en lugar de en equipos locales o discos duros físicos. La página dice que se guardan en servidores remotos en lugar de en hardware local. La aplicación móvil solo es una vía de acceso mediante una API; los datos están en servidores remotos."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
