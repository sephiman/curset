m11-l06-q03:
  key:
    anchor: pitest-basic-concepts#equivalent-mutations
    sentence: PIT avoids generating this type of equivalent mutation by not generating mutations for lines that contain a call to common logging frameworks
  wrong:
  - option: It mutates the line and reports every surviving mutant as a gap in the tests
    anchor: pitest-basic-concepts#equivalent-mutations
    sentence: The resulting mutant behaves differently but in a way that is outside the scope of testing.
  - option: It mutates the line unless the `FLOGCALL` feature is enabled
    anchor: pitest-basic-concepts#equivalent-mutations
    sentence: to enable mutation of logging statements disable the feature FLOGCALL
  - option: It skips the line only for one fixed list of frameworks that cannot be changed
    anchor: pitest-basic-concepts#equivalent-mutations
    sentence: this list of frameworks is configurable
m11-l06-q04:
  key:
    anchor: pact-what-is-good-for#what-is-pact-good-for
    sentence: You (or your team/organisation/partner organisation) control the development of both the consumer and the provider.
  wrong:
  - option: One where the provider serves an open-ended crowd of unknown consumers
    anchor: pact-what-is-good-for#what-is-pact-good-for
    sentence: There is a small enough number of consumers for a given provider that the provider team can manage an individual relationship with each consumer team.
  - option: One where the provider is stable and no longer under active development
    anchor: pact-what-is-good-for#what-is-pact-good-for
    sentence: The consumer and provider are both under active development.
  - option: One where the provider team cannot control the data returned in its responses
    anchor: pact-what-is-good-for#what-is-pact-good-for
    sentence: The provider team can easily control the data returned in the provider's responses.
m11-l06-q05:
  key:
    anchor: pact-how-it-works#consumer-testing
    sentence: Instead of writing a test that says “create user 123, then log in”, you would write two separate interactions
  wrong:
  - option: As two interactions in one test, where the second depends on the first having run
    anchor: pact-how-it-works#consumer-testing
    sentence: In Pact, each interaction is considered to be independent.
  - option: As one test that sends both requests to the real provider and checks the final login
    anchor: pact-how-it-works#consumer-testing
    sentence: The consumer test code fires a real request to a mock provider
  - option: As one interaction whose provider state is created by the consumer's first request
    anchor: pact-how-it-works#consumer-testing
    sentence: Provider states allow you describe the preconditions on the provider required to generate the expected response
m11-l06-q06:
  key:
    anchor: pact-how-it-works#provider-verification
    sentence: Provider verification passes if each request generates a response that contains at least the data described in the minimal expected response.
  wrong:
  - option: The response equals the expected response exactly, field for field
    anchor: pact-how-it-works#provider-verification
    sentence: Provider verification passes if each request generates a response that contains at least the data described in the minimal expected response.
  - option: The consumer test code is run again against the real provider and passes
    anchor: pact-how-it-works#provider-verification
    sentence: In contrast to the consumer tests, provider verification is entirely driven by the Pact framework
  - option: A mock provider replays the pact file and its answer matches the consumer's expectation
    anchor: pact-how-it-works#provider-verification
    sentence: each request is sent to the provider, and the actual response it generates is compared with the minimal expected response described in the consumer test
m11-l06-q07:
  key:
    anchor: k6-open-vs-closed#drawbacks-of-using-the-closed-model
    sentence: Slower response times means longer iterations and a lower arrival rate of new iterations
  wrong:
  - option: It stays constant, because the arrival rate is set independently of the iteration duration
    anchor: k6-open-vs-closed#closed-model
    sentence: the start or arrival rate of new VU iterations is tightly coupled with the iteration duration
  - option: It rises, because iterations overlap while the slow requests are pending
    anchor: k6-open-vs-closed#closed-model
    sentence: The next iteration doesn’t start until the previous one finishes.
  - option: It rises, because the executor adds VUs to keep the response time constant
    anchor: k6-open-vs-closed#drawbacks-of-using-the-closed-model
    sentence: a closed model load test will wait, resulting in increased iteration durations and a tapering off of the arrival rate of new VU iterations
m11-l06-q08:
  key:
    anchor: k6-open-vs-closed#open-model
    sentence: The response times of the target system no longer influence the load on the target system.
  wrong:
  - option: It halves to 1 per 2 seconds, because each iteration waits for the previous one
    anchor: k6-open-vs-closed#open-model
    sentence: new VU iterations will start at a rate of 1 every second
    exclusive: true
  - option: It doubles to 2 per second, to make up for the slower responses
    anchor: k6-open-vs-closed#open-model
    sentence: new VU iterations will start at a rate of 1 every second
    exclusive: true
  - option: It falls, because k6 lowers the arrival rate to protect the stressed target
    anchor: k6-open-vs-closed#open-model
    sentence: Compared to the closed model, the open model decouples VU iterations from the iteration duration.
m11-l06-q09:
  key:
    anchor: k6-test-types#test-type-cheat-sheet
    sentence: Soak Average Long (hours)
  wrong:
  - option: Low load for a short duration, in seconds or minutes
    anchor: k6-test-types#test-type-cheat-sheet
    sentence: Smoke Low Short (seconds or minutes)
  - option: Very high load for a short duration, in a few minutes
    anchor: k6-test-types#test-type-cheat-sheet
    sentence: Spike Very high Short (a few minutes)
  - option: Load that increases until the system breaks, for as long as necessary
    anchor: k6-test-types#test-type-cheat-sheet
    sentence: Breakpoint Increases until break As long as necessary
