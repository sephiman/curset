exams:
- id: primer-ejercicio
  version: 1
  title:
    es: Primer ejercicio
  description:
    es: 80 preguntas con cuatro respuestas, en 90 minutos y sin pausa. Salen 8 del bloque I, 10 del II y 62 del III, como
      en el cuestionario de la OEP 2025. Cada error resta un cuarto de acierto y las respuestas en blanco no restan. La puntuación
      directa es aciertos menos errores entre cuatro. La base 6.2 califica el ejercicio de 0 a 10 y pide 5 para superarlo.
      La puntuación directa que vale 5 la fija el Tribunal después de cada examen. Aquí valen 5 los 40 puntos directos, el
      50 % del máximo que pedían los criterios del Tribunal de 2025 en el sistema general, y 80 valen 10. En 2025 el Tribunal
      fijó la nota de corte del sistema general en 41,00 puntos directos. Cada convocatoria fija la suya.
  time_limit_minutes: 90
  pause: never
  parts:
  - id: primer-ejercicio
    title:
      es: Primer ejercicio
    sources:
    - source:
        module: m01
      questions: 8
    - source:
        module: m02
      questions: 10
    - source:
        module: m03
      questions: 62
    penalty: 1/4
    blank: free
    scoring:
      max: 10
      pass_minimum: 5
      minimum_raw: 40
