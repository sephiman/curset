# anchor: boe-a-2023-5366-art-46
- id: m01-l06-q0108
  prompt:
    es: "Conforme al artículo 46.1 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, la resolución que acuerde la rectificación de la mención registral del sexo tendrá efectos constitutivos:"
  options:
  - id: a
    text:
      es: "Desde la fecha en que se presentó la solicitud de rectificación."
  - id: b
    text:
      es: "Desde que se notifique la resolución a la persona interesada."
  - id: c
    correct: true
    text:
      es: "A partir de su inscripción en el Registro Civil."
  - id: d
    text:
      es: "Con carácter retroactivo a la fecha de nacimiento de la persona."
  explanation:
    es: "El artículo 46.1 dota de efectos constitutivos a la resolución a partir de su inscripción en el Registro Civil. No se retrotraen a la solicitud, no bastan con la notificación al interesado, ni alcanzan a la fecha de nacimiento."
  citation: "art. 46 Ley 4/2023"
  difficulty: 1
  tags:
  - "rectificación registral"
# anchor: boe-a-2023-5366-art-43
- id: m01-l06-q0109
  prompt:
    es: "¿Cómo puede solicitar un joven español de quince años la rectificación de la mención registral relativa al sexo, según el artículo 43 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI?"
  options:
  - id: a
    text:
      es: "Solo pueden presentar la solicitud sus representantes legales en su nombre."
  - id: b
    text:
      es: "Debe esperar a cumplir dieciséis años para poder presentar la solicitud por sí mismo."
  - id: c
    text:
      es: "Debe solicitar previamente la autorización judicial para la modificación de la mención registral, de conformidad con la Ley de Jurisdicción Voluntaria."
  - id: d
    correct: true
    text:
      es: "Puede presentar la solicitud por sí mismo, asistido en el procedimiento por sus representantes legales."
  explanation:
    es: "Las personas mayores de catorce y menores de dieciséis años pueden presentar la solicitud por sí mismas, asistidas por sus representantes legales (art. 43.2). No hace falta que lo hagan estos en su nombre, ni esperar a los dieciséis, que es la edad para solicitarlo sin esa asistencia (art. 43.1). La autorización judicial del artículo 43.4 está prevista para los menores de catorce y mayores de doce."
  citation: "art. 43 Ley 4/2023"
  difficulty: 3
  tags:
  - "rectificación registral"
  - "menores"
# anchor: boe-a-2013-12632-art-3
- id: m01-l06-q0111
  prompt:
    es: "Según el artículo 3 del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, entre los principios de la ley figura el respeto por la diferencia y la aceptación de las personas con discapacidad como parte de:"
  options:
  - id: a
    correct: true
    text:
      es: "La diversidad y la condición humanas."
  - id: b
    text:
      es: "La sociedad y la cultura de cada territorio."
  - id: c
    text:
      es: "La plantilla y el entorno laboral de las empresas."
  - id: d
    text:
      es: "La política social de las Administraciones públicas."
  explanation:
    es: "El principio de la letra d) del artículo 3 exige aceptar a las personas con discapacidad como parte de la diversidad y la condición humanas. Las demás referencias no aparecen en ese principio."
  citation: "art. 3 RDL 1/2013"
  difficulty: 1
  tags:
  - "principios"
# anchor: boe-a-2013-12632-art-2
- id: m01-l06-q0112
  prompt:
    es: "Según el artículo 2.i) del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, ¿a qué lugares, ámbitos, bienes y servicios deben poder acceder las personas con discapacidad en virtud del principio de normalización?"
  options:
  - id: a
    text:
      es: "A lugares, ámbitos, bienes y servicios específicos, adaptados únicamente a las personas con discapacidad."
  - id: b
    correct: true
    text:
      es: "A los mismos que están a disposición de cualquier otra persona."
  - id: c
    text:
      es: "A los mismos lugares y ámbitos que los demás, pero no a los mismos bienes y servicios."
  - id: d
    text:
      es: "A los mismos que los demás, previa solicitud de un ajuste razonable en cada caso concreto y mediante resolución motivada."
  explanation:
    es: "Normalización es el principio en virtud del cual las personas con discapacidad deben poder llevar una vida en igualdad de condiciones, accediendo a los mismos lugares, ámbitos, bienes y servicios que están a disposición de cualquier otra persona (art. 2.i). No supone entornos segregados ni excluye bienes o servicios, ni condiciona el acceso a pedir un ajuste razonable."
  citation: "art. 2 RDL 1/2013"
  difficulty: 2
  tags:
  - "normalización"
# anchor: boe-a-2013-12632-art-2
- id: m01-l06-q0113
  prompt:
    es: "Señale la respuesta CORRECTA sobre la no realización de un ajuste razonable, de acuerdo con el artículo 2.m) del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social:"
  options:
  - id: a
    text:
      es: "Constituye solo un incumplimiento leve, sin carácter discriminatorio."
  - id: b
    text:
      es: "Solo supone discriminación si la persona obligada es una Administración pública."
  - id: c
    correct: true
    text:
      es: "Supone una discriminación por razón de discapacidad y la violación del derecho a la no discriminación."
  - id: d
    text:
      es: "No supone discriminación si no hubo una solicitud escrita de la persona con discapacidad."
  explanation:
    es: "La no realización de un ajuste razonable supone una discriminación por razón de discapacidad y la violación del derecho a la no discriminación (art. 2.m). La norma no la reduce a un incumplimiento leve, no limita la regla a las Administraciones públicas y no exige solicitud escrita."
  citation: "art. 2 RDL 1/2013"
  difficulty: 2
  tags:
  - "ajustes razonables"
# anchor: boe-a-2013-12632-art-42
- id: m01-l06-q0114
  prompt:
    es: "Según el artículo 42.2 del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, ¿en qué términos se reservará un cupo en las ofertas de empleo público para ser cubierto por personas con discapacidad?"
  options:
  - id: a
    correct: true
    text:
      es: "En los términos establecidos en la normativa reguladora de la materia."
  - id: b
    text:
      es: "Con un porcentaje fijado por la propia ley, que no admite desarrollo normativo."
  - id: c
    text:
      es: "Siempre que lo solicite el órgano de selección en cada convocatoria."
  - id: d
    text:
      es: "Solo cuando la plaza no pueda cubrirse por el turno libre."
  explanation:
    es: "El artículo 42.2 remite a la normativa reguladora de la materia para los términos del cupo. No fija un porcentaje cerrado en la ley ni lo condiciona a la petición del órgano de selección ni a que no se cubra por turno libre."
  citation: "art. 42 RDL 1/2013"
  difficulty: 2
  tags:
  - "cuota de reserva"
  - "empleo público"
# anchor: boe-a-2013-12632-art-95
- id: m01-l06-q0115
  prompt:
    es: "Señale la respuesta CORRECTA sobre las infracciones muy graves, de acuerdo con el artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social:"
  options:
  - id: a
    text:
      es: "Tiene la consideración de infracción muy grave la comisión de tres infracciones leves en el plazo de un año."
  - id: b
    correct: true
    text:
      es: "Tiene la consideración de infracción muy grave la comisión de tres infracciones graves en el plazo de un año."
  - id: c
    text:
      es: "Tiene la consideración de infracción muy grave la comisión de dos infracciones graves en el plazo de un año natural, contado desde la primera de ellas."
  - id: d
    text:
      es: "Tiene la consideración de infracción muy grave la comisión de tres infracciones graves en el plazo de tres meses."
  explanation:
    es: "Según el artículo 95.4.h), tres infracciones graves en un año constituyen una infracción muy grave. Tres infracciones leves no la producen, ni bastan dos graves, y el plazo de tres meses es el que el artículo 95.3.i) usa para convertir tres infracciones leves iguales en una infracción grave."
  citation: "art. 95 RDL 1/2013"
  difficulty: 2
  tags:
  - "infracciones"
  - "reincidencia"
# anchor: boe-a-2013-12632-art-95
- id: m01-l06-q0116
  prompt:
    es: "¿Cuál de las siguientes conductas es una infracción muy grave, según el artículo 95 del Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social?"
  options:
  - id: a
    text:
      es: "La negativa por parte de las personas obligadas a adoptar un ajuste razonable."
  - id: b
    text:
      es: "El incumplimiento de los requerimientos específicos que formulen las autoridades."
  - id: c
    text:
      es: "Obstaculizar la acción de los servicios de inspección."
  - id: d
    correct: true
    text:
      es: "Las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad."
  explanation:
    es: "El artículo 95.4.a) califica de muy graves las vejaciones a las personas en sus derechos fundamentales por razón de su discapacidad. La negativa a adoptar un ajuste razonable y el incumplimiento de requerimientos específicos son infracciones graves (95.3.f y c), y obstaculizar la acción de los servicios de inspección es una infracción leve (95.2.c)."
  citation: "art. 95 RDL 1/2013"
  difficulty: 2
  tags:
  - "infracciones"
# anchor: boe-a-2006-21990-art-5
- id: m01-l06-q0119
  prompt:
    es: "Según el artículo 5.1.c) de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, para los menores de cinco años el período de residencia exigido se exigirá:"
  options:
  - id: a
    correct: true
    text:
      es: "A quien ejerza su guarda y custodia."
  - id: b
    text:
      es: "A la propia persona menor, que debe haber residido durante cinco años."
  - id: c
    text:
      es: "A sus progenitores, aunque no ejerzan su guarda y custodia."
  - id: d
    text:
      es: "Al órgano de la Comunidad Autónoma de residencia del menor."
  explanation:
    es: "Para los menores de cinco años el artículo 5.1.c) exige el período de residencia a quien ejerza su guarda y custodia. No puede exigirse al menor, que no habría podido cumplirlo, ni a progenitores sin guarda y custodia, ni a un órgano autonómico."
  citation: "art. 5 Ley 39/2006"
  difficulty: 1
  tags:
  - "titulares"
  - "residencia"
# anchor: boe-a-2006-21990-art-7
- id: m01-l06-q0121
  prompt:
    es: "Señale la respuesta CORRECTA sobre los niveles de protección del Sistema para la Autonomía y Atención a la Dependencia, de acuerdo con el artículo 7 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia:"
  options:
  - id: a
    text:
      es: "Son el nivel mínimo establecido por cada Comunidad Autónoma, el que se acuerde entre estas y la Administración General del Estado y el adicional que establezca el Estado."
  - id: b
    correct: true
    text:
      es: "Son el nivel mínimo establecido por la Administración General del Estado, el que se acuerde entre esta y cada Comunidad Autónoma mediante convenios y el adicional que pueda establecer cada Comunidad Autónoma."
  - id: c
    text:
      es: "Son el nivel mínimo establecido por la Administración General del Estado y el adicional que establezca cada Entidad Local, sin nivel acordado mediante convenios."
  - id: d
    text:
      es: "Son el nivel mínimo que acuerde el Consejo Territorial, el establecido por las Comunidades Autónomas y el adicional que determine el Gobierno."
  explanation:
    es: "El artículo 7 prevé tres niveles: el mínimo, fijado por la Administración General del Estado; el acordado entre esta y cada Comunidad Autónoma mediante convenios; y el adicional, que puede establecer cada Comunidad Autónoma. Los distractores atribuyen el mínimo a las Comunidades Autónomas o al Consejo Territorial, el adicional al Estado o a las entidades locales, y suprimen el nivel convenido."
  citation: "art. 7 Ley 39/2006"
  difficulty: 3
  tags:
  - "niveles de protección"
# anchor: boe-a-2006-21990-art-9
- id: m01-l06-q0122
  prompt:
    es: "Conforme al artículo 9.2 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la financiación pública del nivel mínimo de protección correrá a cuenta de:"
  options:
  - id: a
    text:
      es: "Las Comunidades Autónomas."
  - id: b
    text:
      es: "Las Entidades Locales."
  - id: c
    text:
      es: "Las personas beneficiarias, según su capacidad económica."
  - id: d
    correct: true
    text:
      es: "La Administración General del Estado."
  explanation:
    es: "El artículo 9.2 atribuye a la Administración General del Estado la financiación pública del nivel mínimo de protección, con recursos que fija anualmente en la Ley de Presupuestos Generales del Estado. No corren a cargo de las Comunidades Autónomas, de las Entidades Locales ni de los beneficiarios."
  citation: "art. 9 Ley 39/2006"
  difficulty: 1
  tags:
  - "financiación"
  - "nivel mínimo"
# anchor: boe-a-2006-21990-art-26
- id: m01-l06-q0123
  prompt:
    es: "Una persona necesita ayuda para realizar varias actividades de la vida diaria al menos una vez al día y tiene necesidades de apoyo intermitente o limitado para su autonomía personal. De acuerdo con el artículo 26.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿en qué grado se clasifica su situación de dependencia?"
  options:
  - id: a
    text:
      es: "Grado II, dependencia severa, por la necesidad de ayuda dos o tres veces al día."
  - id: b
    text:
      es: "Grado III, gran dependencia, por la necesidad de apoyo indispensable y continuo de otra persona."
  - id: c
    correct: true
    text:
      es: "Grado I, dependencia moderada, por la necesidad de ayuda al menos una vez al día."
  - id: d
    text:
      es: "Ningún grado, porque el apoyo intermitente o limitado no basta para la situación de dependencia."
  explanation:
    es: "El artículo 26.1.a) define el grado I, dependencia moderada, por la necesidad de ayuda para varias actividades de la vida diaria al menos una vez al día o por necesidades de apoyo intermitente o limitado. El grado II exige ayuda dos o tres veces al día y el grado III, varias veces al día con apoyo indispensable y continuo, y la persona sí alcanza un grado."
  citation: "art. 26 Ley 39/2006"
  difficulty: 1
  tags:
  - "grados de dependencia"
# anchor: boe-a-2006-21990-art-26
- id: m01-l06-q0125
  prompt:
    es: "Señale la respuesta CORRECTA sobre el grado II, dependencia severa, de acuerdo con el artículo 26.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia:"
  options:
  - id: a
    text:
      es: "La persona necesita ayuda para realizar varias actividades de la vida diaria al menos una vez al día, o tiene necesidades de apoyo intermitente o limitado."
  - id: b
    text:
      es: "La persona necesita ayuda para realizar varias actividades de la vida diaria varias veces al día y requiere el apoyo indispensable y continuo de otra persona."
  - id: c
    text:
      es: "La persona necesita ayuda para realizar varias actividades de la vida diaria dos o tres veces al día y requiere el apoyo permanente de una persona cuidadora."
  - id: d
    correct: true
    text:
      es: "La persona necesita ayuda para realizar varias actividades de la vida diaria dos o tres veces al día, pero no requiere el apoyo permanente de una persona cuidadora, o tiene necesidades de apoyo extenso."
  explanation:
    es: "El grado II exige ayuda dos o tres veces al día sin apoyo permanente de una persona cuidadora, o necesidades de apoyo extenso (art. 26.1.b). Los distractores describen el grado I, el grado III o añaden un apoyo permanente de una persona cuidadora, que el grado II excluye."
  citation: "art. 26 Ley 39/2006"
  difficulty: 3
  tags:
  - "grados de dependencia"
# anchor: boe-a-2006-21990-art-28
- id: m01-l06-q0126
  prompt:
    es: "De acuerdo con el artículo 28.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el procedimiento para el reconocimiento de la situación de dependencia se iniciará a instancia de la persona afectada o de quien ostente su representación, estableciéndose para su resolución:"
  options:
  - id: a
    correct: true
    text:
      es: "Un plazo máximo de tres meses."
  - id: b
    text:
      es: "Un plazo máximo de seis meses."
  - id: c
    text:
      es: "Un plazo máximo de un mes."
  - id: d
    text:
      es: "Un plazo máximo de doce meses."
  explanation:
    es: "El artículo 28.1 fija un plazo máximo de tres meses para resolver. Seis meses, un mes y doce meses no son los plazos del precepto."
  citation: "art. 28 Ley 39/2006"
  difficulty: 1
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-2006-21990-art-28
- id: m01-l06-q0127
  prompt:
    es: "Señale la respuesta CORRECTA sobre el reconocimiento de la situación de dependencia, de acuerdo con el artículo 28.2 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia:"
  options:
  - id: a
    text:
      es: "Se efectúa mediante resolución expedida por la Administración Autonómica correspondiente a la residencia del solicitante y tiene validez únicamente en el territorio de esa Comunidad Autónoma."
  - id: b
    text:
      es: "Se efectúa mediante resolución expedida por el Consejo Territorial de Servicios Sociales y del Sistema para la Autonomía y Atención a la Dependencia, con validez en todo el territorio del Estado."
  - id: c
    correct: true
    text:
      es: "Se efectúa mediante resolución expedida por la Administración Autonómica correspondiente a la residencia del solicitante y tiene validez en todo el territorio del Estado."
  - id: d
    text:
      es: "Se efectúa mediante resolución expedida por la Administración Local correspondiente a la residencia del solicitante y tiene validez en todo el territorio del Estado."
  explanation:
    es: "El artículo 28.2 atribuye la resolución a la Administración Autonómica de la residencia del solicitante, con validez en todo el territorio del Estado. No es válida solo en la Comunidad Autónoma, no la expide el Consejo Territorial, que es un órgano de cooperación, ni la Administración Local."
  citation: "art. 28 Ley 39/2006"
  difficulty: 2
  tags:
  - "procedimiento"
  - "resolución"
