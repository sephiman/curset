# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q018
  prompt:
    es: "¿Qué duración máxima tiene, en el Régimen General de la Seguridad Social, la incapacidad temporal debida a enfermedad o accidente?"
  options:
  - id: a
    text:
      es: "Trescientos sesenta y cinco días, prorrogables por otros trescientos sesenta y cinco"
  - id: b
    correct: true
    text:
      es: "Trescientos sesenta y cinco días, prorrogables por otros ciento ochenta"
  - id: c
    text:
      es: "Ciento ochenta días, prorrogables por otros ciento ochenta días"
  - id: d
    text:
      es: "Trescientos sesenta y cinco días, sin posibilidad de prórroga"
  explanation:
    es: "El artículo 169.1.a) fija «una duración máxima de trescientos sesenta y cinco días, prorrogables por otros ciento ochenta días». La prórroga existe y es de ciento ochenta días, no de otros trescientos sesenta y cinco. Ciento ochenta más ciento ochenta es la duración de los períodos de observación por enfermedad profesional de la letra b)."
  citation: "art. 169.1.a) LGSS"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q019
  prompt:
    es: "Según el artículo 169.1.a) del texto refundido de la Ley General de la Seguridad Social, ¿cuándo cabe prorrogar por otros ciento ochenta días la incapacidad temporal debida a enfermedad o accidente?"
  options:
  - id: a
    text:
      es: "Cuando se presuma que durante ellos el trabajador puede ser declarado en incapacidad permanente"
  - id: b
    text:
      es: "Cuando lo solicite el trabajador y lo autorice la empresa en la que presta servicios"
  - id: c
    correct: true
    text:
      es: "Cuando se presuma que durante ellos el trabajador puede ser dado de alta médica por curación"
  - id: d
    text:
      es: "Cuando se estime necesario para el estudio y diagnóstico de la enfermedad del trabajador"
  explanation:
    es: "La prórroga procede «cuando se presuma que durante ellos puede el trabajador ser dado de alta médica por curación» (artículo 169.1.a). La previsión de una incapacidad permanente no es el motivo que da el artículo, y la prórroga no depende de la solicitud del trabajador ni de la empresa. El estudio y diagnóstico de la enfermedad es el motivo de prórroga de los períodos de observación de la letra b)."
  citation: "art. 169.1.a) LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q020
  prompt:
    es: "Según el texto refundido de la Ley General de la Seguridad Social, ¿qué se exige para que la enfermedad común o el accidente sean situación determinante de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Que el trabajador reciba asistencia sanitaria de la Seguridad Social, aunque pueda seguir trabajando"
  - id: b
    text:
      es: "Que el trabajador esté impedido para el trabajo, aunque no reciba asistencia sanitaria"
  - id: c
    text:
      es: "Que el trabajador esté impedido para el trabajo durante más de tres días consecutivos"
  - id: d
    correct: true
    text:
      es: "Que el trabajador reciba asistencia sanitaria de la Seguridad Social y esté impedido para el trabajo"
  explanation:
    es: "El artículo 169.1.a) considera situación de incapacidad temporal la debida a enfermedad o accidente «mientras el trabajador reciba asistencia sanitaria de la Seguridad Social y esté impedido para el trabajo». Los dos requisitos van juntos: no basta uno sin el otro. El artículo no exige una duración mínima de la baja; los tres días son el tiempo que tarda en pagarse el subsidio en enfermedad común (artículo 173.1)."
  citation: "art. 169.1.a) LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q021
  prompt:
    es: "Según el artículo 169.1.b) del texto refundido de la Ley General de la Seguridad Social, los períodos de observación por enfermedad profesional con baja en el trabajo tienen una duración máxima de:"
  options:
  - id: a
    correct: true
    text:
      es: "Ciento ochenta días, prorrogables por otros ciento ochenta"
  - id: b
    text:
      es: "Trescientos sesenta y cinco días, prorrogables por otros ciento ochenta"
  - id: c
    text:
      es: "Noventa días, prorrogables por otros noventa días"
  - id: d
    text:
      es: "Ciento ochenta días, sin posibilidad de prórroga"
  explanation:
    es: "La letra b) del artículo 169.1 fija para los períodos de observación «una duración máxima de ciento ochenta días, prorrogables por otros ciento ochenta días». Trescientos sesenta y cinco días prorrogables por ciento ochenta es la duración de la letra a), que se refiere a la enfermedad común o profesional con asistencia sanitaria, no a la observación. Noventa días prorrogables por otros noventa no es ninguna de las cifras del apartado. Ciento ochenta días sin prórroga contradice «prorrogables por otros ciento ochenta días»."
  citation: "art. 169.1.b) LGSS"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11724-art-172
- id: m04-l09-q022
  prompt:
    es: "De acuerdo con el artículo 172 del texto refundido de la Ley General de la Seguridad Social, con carácter general, el subsidio de incapacidad temporal por enfermedad común exige haber cotizado:"
  options:
  - id: a
    text:
      es: "Ciento ochenta días dentro de los siete años inmediatamente anteriores al hecho causante"
  - id: b
    text:
      es: "Noventa días dentro de los cinco años inmediatamente anteriores al hecho causante"
  - id: c
    correct: true
    text:
      es: "Ciento ochenta días dentro de los cinco años inmediatamente anteriores al hecho causante"
  - id: d
    text:
      es: "Trescientos sesenta días dentro de los cinco años inmediatamente anteriores al hecho causante"
  explanation:
    es: "El artículo 172.a) exige, en caso de enfermedad común, «ciento ochenta días dentro de los cinco años inmediatamente anteriores al hecho causante». Los siete años y los trescientos sesenta días son cifras del subsidio por nacimiento y cuidado de menor (artículo 178.1). Noventa días no es la cifra del artículo 172."
  citation: "art. 172 LGSS"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-172
- id: m04-l09-q023
  prompt:
    es: "Un trabajador del Régimen General causa baja por un accidente no laboral. ¿Qué período previo de cotización se le exige para el subsidio de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Ciento ochenta días dentro de los cinco años anteriores"
  - id: b
    correct: true
    text:
      es: "No se le exige ningún período previo de cotización"
  - id: c
    text:
      es: "Noventa días dentro de los cinco años anteriores al accidente"
  - id: d
    text:
      es: "El exigido en enfermedad común, reducido a la mitad"
  explanation:
    es: "El artículo 172.b) del texto refundido de la Ley General de la Seguridad Social dice que «en caso de accidente, sea o no de trabajo, y de enfermedad profesional, no se exigirá ningún período previo de cotización». Los ciento ochenta días en cinco años son el período de la enfermedad común. La ley no fija noventa días ni una reducción a la mitad para el accidente."
  citation: "art. 172 LGSS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-171
- id: m04-l09-q024
  prompt:
    es: "Según el artículo 171 del texto refundido de la Ley General de la Seguridad Social, en la situación especial de incapacidad temporal por donación de órganos o tejidos para su trasplante, el subsidio equivale:"
  options:
  - id: a
    text:
      es: "Al cien por ciento de la base reguladora de la incapacidad temporal por contingencias profesionales"
  - id: b
    text:
      es: "Al setenta y cinco por ciento de la base reguladora de la incapacidad temporal por contingencias comunes"
  - id: c
    text:
      es: "Al sesenta por ciento de la base reguladora de la incapacidad temporal por contingencias comunes"
  - id: d
    correct: true
    text:
      es: "Al cien por ciento de la base reguladora de la incapacidad temporal por contingencias comunes"
  explanation:
    es: "El artículo 171 fija para la donación de órganos o tejidos «un subsidio equivalente al cien por ciento de la base reguladora establecida para la prestación de incapacidad temporal derivada de contingencias comunes». La base de contingencias profesionales es la del riesgo durante el embarazo y la del cuidado de menores con cáncer, no esta. El setenta y cinco y el sesenta por ciento no son la cifra del artículo."
  citation: "art. 171 LGSS"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2015-11724-art-173
- id: m04-l09-q025
  prompt:
    es: "De acuerdo con el artículo 173.1 del texto refundido de la Ley General de la Seguridad Social, en caso de accidente de trabajo o enfermedad profesional, el subsidio de incapacidad temporal se abona:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el día siguiente al de la baja, y el empresario paga el salario íntegro del día de la baja"
  - id: b
    text:
      es: "Desde el mismo día de la baja, a cargo de la entidad gestora o de la mutua colaboradora"
  - id: c
    text:
      es: "A partir del cuarto día de baja, y el empresario paga el salario de los tres primeros días"
  - id: d
    text:
      es: "Desde el día siguiente al de la baja, y el empresario paga el subsidio hasta el decimoquinto día"
  explanation:
    es: "El artículo 173.1 dice que, en accidente de trabajo o enfermedad profesional, «el subsidio se abonará desde el día siguiente al de la baja en el trabajo, estando a cargo del empresario el salario íntegro correspondiente al día de la baja». El pago desde el mismo día de la baja es la regla de la menstruación incapacitante y de la donación de órganos. El cuarto día y el pago del empresario hasta el decimoquinto son la regla de la enfermedad común y del accidente no laboral."
  citation: "art. 173.1 LGSS"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2015-11724-art-173
- id: m04-l09-q026
  prompt:
    es: "Según el artículo 173.1 del texto refundido de la Ley General de la Seguridad Social, en caso de enfermedad común o accidente no laboral, ¿desde qué día se abona el subsidio de incapacidad temporal y quién lo paga al principio?"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al de la baja; del segundo al decimoquinto, ambos inclusive, lo paga el empresario"
  - id: b
    correct: true
    text:
      es: "Desde el cuarto día de baja; del cuarto al decimoquinto, ambos inclusive, lo paga el empresario"
  - id: c
    text:
      es: "Desde el cuarto día de baja; del cuarto al vigésimo, ambos inclusive, lo paga el empresario"
  - id: d
    text:
      es: "Desde el decimosexto día de baja, siempre a cargo de la entidad gestora o de la mutua"
  explanation:
    es: "El artículo 173.1 dice que el subsidio «se abonará a partir del cuarto día de baja en el trabajo, si bien desde el día cuarto al decimoquinto de baja, ambos inclusive, el subsidio estará a cargo del empresario». El pago desde el día siguiente al de la baja es la regla del accidente de trabajo. El tramo a cargo del empresario acaba el día decimoquinto, no el vigésimo, y el subsidio empieza el cuarto día, no el decimosexto."
  citation: "art. 173.1 LGSS"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11724-art-173
- id: m04-l09-q027
  prompt:
    es: "Un trabajador causa baja por enfermedad común el lunes 7 de junio de 2027. Contando el día de la baja como primero y por días naturales, ¿hasta qué día paga el empresario el subsidio de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Hasta el domingo 20 de junio de 2027 inclusive"
  - id: b
    text:
      es: "Hasta el martes 22 de junio de 2027 inclusive"
  - id: c
    correct: true
    text:
      es: "Hasta el lunes 21 de junio de 2027 inclusive"
  - id: d
    text:
      es: "Hasta el jueves 10 de junio de 2027 inclusive"
  explanation:
    es: "El artículo 173.1 pone a cargo del empresario el subsidio «desde el día cuarto al decimoquinto de baja, ambos inclusive». Con el lunes 7 de junio como primer día, el cuarto es el jueves 10 de junio, cuando empieza el pago, y el decimoquinto es el lunes 21 de junio, último día a cargo del empresario. El domingo 20 de junio es el día decimocuarto y el martes 22 de junio el decimosexto, que ya no paga el empresario. El jueves 10 de junio es el primer día del subsidio, no el último a cargo del empresario."
  citation: "art. 173.1 LGSS"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11724-art-173
- id: m04-l09-q028
  prompt:
    es: "Una trabajadora sufre un accidente de trabajo y causa baja el martes 11 de mayo de 2027. ¿Desde qué día se le abona el subsidio de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Desde el martes 11 de mayo de 2027"
  - id: b
    text:
      es: "Desde el viernes 14 de mayo de 2027"
  - id: c
    text:
      es: "Desde el miércoles 26 de mayo de 2027"
  - id: d
    correct: true
    text:
      es: "Desde el miércoles 12 de mayo de 2027"
  explanation:
    es: "En accidente de trabajo, el artículo 173.1 abona el subsidio «desde el día siguiente al de la baja en el trabajo», que es el miércoles 12 de mayo. El martes 11, día de la baja, no lleva subsidio: el empresario paga el salario íntegro de ese día. El viernes 14, cuarto día contando el de la baja, es el inicio del pago en enfermedad común o accidente no laboral. El miércoles 26 es el decimosexto día, cuando en enfermedad común el pago deja de estar a cargo del empresario."
  citation: "art. 173.1 LGSS"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11724-art-174
- id: m04-l09-q029
  prompt:
    es: "¿Por el transcurso de qué plazo máximo se extingue el derecho al subsidio de incapacidad temporal del Régimen General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Trescientos sesenta y cinco días naturales desde la baja médica"
  - id: b
    text:
      es: "Setecientos treinta días naturales desde la baja médica"
  - id: c
    correct: true
    text:
      es: "Quinientos cuarenta y cinco días naturales desde la baja médica"
  - id: d
    text:
      es: "Quinientos cuarenta y cinco días hábiles desde la baja médica"
  explanation:
    es: "El artículo 174.1 extingue el subsidio «por el transcurso del plazo máximo de quinientos cuarenta y cinco días naturales desde la baja médica». Los días son naturales, no hábiles. Trescientos sesenta y cinco días es la duración antes de la prórroga del artículo 169.1.a). Setecientos treinta días es el límite que el artículo 174.2 fija para demorar la calificación de la incapacidad permanente, no la duración del subsidio."
  citation: "art. 174.1 LGSS"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11724-art-174
- id: m04-l09-q030
  prompt:
    es: "¿Cuál de las siguientes es causa de extinción del derecho al subsidio de incapacidad temporal, según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    correct: true
    text:
      es: "El reconocimiento al trabajador de la pensión de jubilación"
  - id: b
    text:
      es: "La recaída del trabajador en el mismo proceso patológico"
  - id: c
    text:
      es: "El inicio de un expediente de incapacidad permanente"
  - id: d
    text:
      es: "El cumplimiento de trescientos sesenta y cinco días de baja"
  explanation:
    es: "El artículo 174.1 enumera, entre las causas de extinción, «el reconocimiento de la pensión de jubilación». La recaída no extingue el subsidio: sus períodos se computan para la duración máxima. Iniciar un expediente de incapacidad permanente tampoco lo extingue. A los trescientos sesenta y cinco días cabe la prórroga de ciento ochenta (artículo 169.1.a); el plazo que extingue el derecho es de quinientos cuarenta y cinco días."
  citation: "art. 174.1 LGSS"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11724-art-177
- id: m04-l09-q031
  prompt:
    es: "¿Cuál de las siguientes es situación protegida a efectos de la prestación por nacimiento y cuidado de menor, según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "La tutela de un menor, durante los períodos de descanso correspondientes"
  - id: b
    text:
      es: "El acogimiento residencial de un menor, durante los períodos de descanso"
  - id: c
    text:
      es: "La reducción de jornada por cuidado directo de un menor de doce años"
  - id: d
    correct: true
    text:
      es: "La guarda con fines de adopción, durante los períodos de descanso correspondientes"
  explanation:
    es: "El artículo 177 considera situaciones protegidas «el nacimiento, la adopción, la guarda con fines de adopción y el acogimiento familiar», durante los períodos de descanso que se disfruten. La tutela no está en la lista, y el acogimiento que protege es el familiar, no el residencial. La reducción de jornada por cuidado de un menor no es un período de descanso de los que menciona el artículo."
  citation: "art. 177 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-178
- id: m04-l09-q032
  prompt:
    es: "Una trabajadora del Régimen General de veinte años da a luz. ¿Qué período mínimo de cotización se le exige para el subsidio por nacimiento y cuidado de menor?"
  options:
  - id: a
    text:
      es: "Noventa días cotizados dentro de los siete años anteriores al descanso"
  - id: b
    correct: true
    text:
      es: "No se le exige ningún período mínimo de cotización"
  - id: c
    text:
      es: "Ciento ochenta días cotizados dentro de los siete años anteriores al descanso"
  - id: d
    text:
      es: "Noventa días cotizados dentro de los cinco años anteriores al parto"
  explanation:
    es: "El artículo 178.1.a) del texto refundido de la Ley General de la Seguridad Social dice que, si la persona trabajadora tiene menos de veintiún años, «no se exigirá período mínimo de cotización». Noventa días en siete años es el período entre veintiuno y veintiséis años, y ciento ochenta días en siete años el de veintiséis años cumplidos. Los cinco años no son el período de referencia de este subsidio."
  citation: "art. 178.1 LGSS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-178
- id: m04-l09-q033
  prompt:
    es: "Según el artículo 178.1 del texto refundido de la Ley General de la Seguridad Social, quien tenga cumplidos veintiún años y menos de veintiséis debe acreditar, para el subsidio por nacimiento y cuidado de menor:"
  options:
  - id: a
    correct: true
    text:
      es: "Noventa días cotizados en los siete años anteriores al descanso, o ciento ochenta en su vida laboral"
  - id: b
    text:
      es: "Ciento ochenta días cotizados en los siete años anteriores al descanso, o trescientos sesenta en su vida laboral"
  - id: c
    text:
      es: "Noventa días cotizados en los cinco años anteriores al descanso, o ciento ochenta en su vida laboral"
  - id: d
    text:
      es: "Noventa días cotizados en los siete años anteriores al descanso, sin otra alternativa"
  explanation:
    es: "El artículo 178.1.b) exige «noventa días cotizados dentro de los siete años inmediatamente anteriores al momento de inicio del descanso» y da por cumplido el requisito si, alternativamente, se acreditan «ciento ochenta días cotizados a lo largo de su vida laboral». Ciento ochenta o trescientos sesenta días son las cifras de los veintiséis años cumplidos. El período de referencia es de siete años, no de cinco, y la alternativa de la vida laboral existe."
  citation: "art. 178.1 LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-178
- id: m04-l09-q034
  prompt:
    es: "Según el artículo 178.1 del texto refundido de la Ley General de la Seguridad Social, ¿qué período mínimo de cotización debe acreditar un trabajador de treinta años para el subsidio por nacimiento y cuidado de menor?"
  options:
  - id: a
    text:
      es: "Noventa días en los siete años anteriores al descanso, o ciento ochenta en su vida laboral"
  - id: b
    text:
      es: "Ciento ochenta días en los cinco años anteriores al descanso, sin otra alternativa"
  - id: c
    correct: true
    text:
      es: "Ciento ochenta días en los siete años anteriores al descanso, o trescientos sesenta en su vida laboral"
  - id: d
    text:
      es: "Trescientos sesenta días en los siete años anteriores al descanso, o setecientos veinte en su vida laboral"
  explanation:
    es: "Con veintiséis años cumplidos, el artículo 178.1.c) exige «ciento ochenta días cotizados dentro de los siete años inmediatamente anteriores al momento de inicio del descanso», o, alternativamente, «trescientos sesenta días cotizados a lo largo de su vida laboral». Noventa o ciento ochenta días son las cifras de los veintiuno a veintiséis años. El período no es de cinco años y la alternativa de la vida laboral existe. La ley no menciona setecientos veinte días."
  citation: "art. 178.1 LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-179
- id: m04-l09-q035
  prompt:
    es: "La prestación económica por nacimiento y cuidado de menor del Régimen General de la Seguridad Social consiste en un subsidio equivalente:"
  options:
  - id: a
    text:
      es: "Al 75 por ciento de la base reguladora correspondiente"
  - id: b
    text:
      es: "Al 60 por ciento de la base reguladora correspondiente"
  - id: c
    text:
      es: "Al 100 por ciento del salario mínimo interprofesional vigente"
  - id: d
    correct: true
    text:
      es: "Al 100 por ciento de la base reguladora correspondiente"
  explanation:
    es: "El artículo 179.1 del texto refundido de la Ley General de la Seguridad Social fija «un subsidio equivalente al 100 por ciento de la base reguladora correspondiente». El setenta y cinco y el sesenta por ciento no son la cifra del artículo. El subsidio se calcula sobre la base reguladora, no sobre el salario mínimo interprofesional."
  citation: "art. 179.1 LGSS"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11724-art-186
- id: m04-l09-q036
  prompt:
    es: "De acuerdo con el artículo 186 del texto refundido de la Ley General de la Seguridad Social, en el riesgo durante el embarazo es situación protegida la suspensión del contrato cuando el cambio a un puesto compatible:"
  options:
  - id: a
    correct: true
    text:
      es: "No resulte técnica u objetivamente posible, o no pueda razonablemente exigirse por motivos justificados"
  - id: b
    text:
      es: "Haya sido rechazado por la trabajadora, aunque resulte técnica y objetivamente posible"
  - id: c
    text:
      es: "Suponga para la trabajadora una pérdida de retribuciones superior a la fijada en convenio"
  - id: d
    text:
      es: "No haya sido solicitado por la trabajadora antes del inicio de la semana trigésima novena"
  explanation:
    es: "El artículo 186 protege la suspensión del contrato cuando el cambio de puesto «no resulte técnica u objetivamente posible, o no pueda razonablemente exigirse por motivos justificados». El rechazo de la trabajadora a un cambio posible no es el supuesto del artículo. La pérdida de retribuciones y la semana trigésima novena no aparecen como condición de la situación protegida."
  citation: "art. 186 LGSS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-188
- id: m04-l09-q038
  prompt:
    es: "Según el artículo 188 del texto refundido de la Ley General de la Seguridad Social, en el riesgo durante la lactancia natural se considera situación protegida:"
  options:
  - id: a
    text:
      es: "El período de reducción de jornada por lactancia hasta que el hijo cumpla nueve meses"
  - id: b
    text:
      es: "El período de excedencia por cuidado de hijo hasta que este cumpla tres años"
  - id: c
    correct: true
    text:
      es: "El período de suspensión del contrato cuando no sea posible el cambio a un puesto compatible"
  - id: d
    text:
      es: "El período de baja por incapacidad temporal debida a una enfermedad del lactante"
  explanation:
    es: "El artículo 188 protege «el período de suspensión del contrato de trabajo» cuando la trabajadora debe cambiar a un puesto compatible y el cambio no resulta técnica u objetivamente posible o no puede razonablemente exigirse. La situación protegida no es una reducción de jornada ni una excedencia. Tampoco es una incapacidad temporal por la enfermedad del hijo."
  citation: "art. 188 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-190
- id: m04-l09-q039
  prompt:
    es: "¿Qué reducción de jornada protege la prestación del Régimen General por cuidado de menores afectados por cáncer u otra enfermedad grave?"
  options:
  - id: a
    text:
      es: "De, al menos, un 25 por ciento de la jornada"
  - id: b
    text:
      es: "De, al menos, un 33 por ciento de la jornada"
  - id: c
    text:
      es: "De, como máximo, un 50 por ciento de la jornada"
  - id: d
    correct: true
    text:
      es: "De, al menos, un 50 por ciento de la jornada"
  explanation:
    es: "El artículo 190.1 protege «la reducción de la jornada de trabajo de, al menos, un 50 por ciento». El cincuenta por ciento es un mínimo, no un máximo. El veinticinco y el treinta y tres por ciento no son la cifra del artículo."
  citation: "art. 190.1 LGSS"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11724-art-190
- id: m04-l09-q040
  prompt:
    es: "Según el artículo 190.1 del texto refundido de la Ley General de la Seguridad Social, ¿en qué caso protege a los progenitores la prestación por cuidado de menores afectados por cáncer u otra enfermedad grave?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando ambos trabajen, o cuando solo haya un progenitor por tratarse de familia monoparental"
  - id: b
    text:
      es: "Cuando el menor conviva con ellos, trabajen o no, y lo acredite el servicio público de salud"
  - id: c
    text:
      es: "Cuando ambos trabajen a jornada completa en la misma empresa o en la misma Administración"
  - id: d
    text:
      es: "Cuando ambos trabajen y el menor tenga reconocida una discapacidad igual o superior al 33 por ciento"
  explanation:
    es: "El artículo 190.1 protege la reducción de jornada de los progenitores, guardadores o acogedores «cuando ambos trabajen, o cuando solo haya un progenitor por tratarse de familias monoparentales». El artículo exige que trabajen, no basta la convivencia. No pide que sea a jornada completa ni en la misma empresa, y no exige un grado de discapacidad del menor."
  citation: "art. 190.1 LGSS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-190
- id: m04-l09-q041
  prompt:
    es: "Según el artículo 190.3 del texto refundido de la Ley General de la Seguridad Social, alcanzada la mayoría de edad, si persiste la enfermedad grave diagnosticada antes y subsiste la necesidad de hospitalización, tratamiento y cuidado, la prestación se mantiene:"
  options:
  - id: a
    text:
      es: "Hasta que el causante cumpla veintiún años"
  - id: b
    correct: true
    text:
      es: "Hasta que el causante cumpla veintitrés años"
  - id: c
    text:
      es: "Hasta que el causante cumpla veinticinco años"
  - id: d
    text:
      es: "Hasta que el causante cumpla veintiséis años en todo caso"
  explanation:
    es: "El artículo 190.3 dice que «se mantendrá la prestación económica hasta los 23 años» en ese caso. Veintiún y veinticinco años no son la cifra del artículo. Los veintiséis años solo se alcanzan si, antes de los veintitrés, se acredita además una discapacidad igual o superior al 65 por ciento; no rigen en todo caso."
  citation: "art. 190.3 LGSS"
  difficulty: 2
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-11724-art-190
- id: m04-l09-q042
  prompt:
    es: "Según el artículo 190.3 del texto refundido de la Ley General de la Seguridad Social, ¿qué debe acreditar el causante, antes de cumplir veintitrés años, para que la prestación se mantenga hasta que cumpla veintiséis?"
  options:
  - id: a
    text:
      es: "Un grado de discapacidad igual o superior al 33 por ciento"
  - id: b
    text:
      es: "Un grado de discapacidad igual o superior al 75 por ciento"
  - id: c
    correct: true
    text:
      es: "Un grado de discapacidad igual o superior al 65 por ciento"
  - id: d
    text:
      es: "Que sigue cursando estudios reglados en un centro educativo"
  explanation:
    es: "El artículo 190.3 mantiene la prestación «hasta que el causante cumpla 26 años si antes de alcanzar los 23 años acreditara, además, un grado de discapacidad igual o superior al 65 por ciento». El treinta y tres y el setenta y cinco por ciento no son la cifra del artículo, y los estudios no son el requisito que exige."
  citation: "art. 190.3 LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-190
- id: m04-l09-q043
  prompt:
    es: "Según el artículo 190.5 del texto refundido de la Ley General de la Seguridad Social, en la redacción de la Ley 4/2026, de 1 de octubre, la asistencia del menor enfermo al centro educativo, sea cual sea su modalidad:"
  options:
  - id: a
    text:
      es: "Constituye causa de suspensión de la prestación mientras dure la escolarización ordinaria"
  - id: b
    text:
      es: "Constituye causa de extinción de la prestación, salvo que la escolarización sea terapéutica"
  - id: c
    text:
      es: "Reduce la prestación en proporción a las horas de asistencia al centro educativo"
  - id: d
    correct: true
    text:
      es: "No constituye por sí misma causa de denegación, suspensión o extinción de la prestación"
  explanation:
    es: "El artículo 190.5, en la redacción de la Ley 4/2026, de 1 de octubre, vigente desde el 23 de octubre de 2026, dice que la asistencia al centro educativo, «ya sea ordinaria, parcial, adaptada, terapéutica o intermitente, no constituirá por sí misma causa de denegación, suspensión o extinción» de la prestación. No suspende ni extingue la prestación en ninguna modalidad. Tampoco la reduce: la proporción que fija el artículo 192.1 es la de la reducción de jornada."
  citation: "art. 190.5 LGSS"
  difficulty: 3
  tags:
  - "efecto"
