# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0195
  prompt:
    es: "Según el artículo 99.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en la declaración-liquidación referida a los hechos imponibles anteriores a la declaración de concurso se debe aplicar:"
  options:
  - id: a
    correct: true
    text:
      es: "la totalidad de los saldos acumulados a compensar de períodos de liquidación anteriores a dicha declaración."
  - id: b
    text:
      es: "la mitad de los saldos acumulados a compensar de períodos de liquidación anteriores a la fecha de dicha declaración."
  - id: c
    text:
      es: "los saldos a compensar solo del período de liquidación inmediatamente anterior a dicha declaración."
  - id: d
    text:
      es: "los saldos acumulados a compensar de los cuatro últimos años anteriores a dicha declaración."
  explanation:
    es: "En la declaración de los hechos anteriores al concurso se aplica la totalidad de los saldos acumulados a compensar. No se aplica solo la mitad, ni limitados a cuatro años ni al último período."
  citation: "art. 99.Cinco LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "compensación"
  - "concurso"
# anchor: boe-a-1992-28740-art-93
- id: m03-l19-q0198
  prompt:
    es: "De acuerdo con el artículo 93.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el criterio razonable y homogéneo de imputación de las cuotas de bienes destinados simultáneamente a operaciones sujetas y no sujetas debe mantenerse en el tiempo, salvo que:"
  options:
  - id: a
    text:
      es: "lo exija la prorrata especial aplicada en el ejercicio anterior."
  - id: b
    correct: true
    text:
      es: "por causas razonables haya de procederse a su modificación."
  - id: c
    text:
      es: "lo decida el sujeto pasivo libremente al inicio de cada ejercicio."
  - id: d
    text:
      es: "lo autorice la Administración tributaria mediante resolución expresa."
  explanation:
    es: "El criterio se mantiene salvo que causas razonables obliguen a modificarlo. No basta una decisión libre cada ejercicio, no hace falta autorización expresa y la prorrata especial no lo impone."
  citation: "art. 93.Cinco LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "operaciones no sujetas"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0203
  prompt:
    es: "¿Cuál de los siguientes vehículos se presume afecto a la actividad en la proporción del 100 por 100, según el artículo 95.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Los utilizados por los directivos de la empresa en sus desplazamientos al centro de trabajo."
  - id: b
    correct: true
    text:
      es: "Los utilizados en los desplazamientos profesionales de los representantes o agentes comerciales."
  - id: c
    text:
      es: "Los utilizados por el titular de la actividad para sus gestiones profesionales de carácter ocasional."
  - id: d
    text:
      es: "Los utilizados por los empleados de la empresa para sus desplazamientos particulares de fin de semana."
  explanation:
    es: "Los usados en los desplazamientos profesionales de representantes o agentes comerciales entran en la lista del 100 por 100. Los desplazamientos de directivos al trabajo, las gestiones ocasionales del titular y el uso particular de empleados no están en ella."
  citation: "art. 95.Tres.2.ª LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "vehículos"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0204
  prompt:
    es: "Señale la respuesta CORRECTA sobre los vehículos que se presumen afectados en la proporción del 100 por 100 según el artículo 95.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Los utilizados por sus distribuidores en la exposición permanente de los vehículos en el establecimiento."
  - id: b
    text:
      es: "Los utilizados por sus fabricantes exclusivamente en el transporte interno de materiales dentro de la fábrica."
  - id: c
    correct: true
    text:
      es: "Los utilizados por sus fabricantes en la realización de pruebas, ensayos, demostraciones o en la promoción de ventas."
  - id: d
    text:
      es: "Los utilizados por sus compradores en la realización de pruebas, ensayos, demostraciones o en la promoción de ventas."
  explanation:
    es: "La presunción del 100 por 100 alcanza a los vehículos que los fabricantes usan en pruebas, ensayos, demostraciones o promoción de ventas. No alcanza a los que usan los compradores, el transporte interno de la fábrica ni la exposición de los distribuidores."
  citation: "art. 95.Tres.2.ª LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "vehículos"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0205
  prompt:
    es: "Conforme al artículo 95.Tres.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las cuotas soportadas por bienes de inversión distintos de los vehículos de la regla 2.ª pueden deducirse en la medida en que vayan a utilizarse previsiblemente en el desarrollo de la actividad:"
  options:
  - id: a
    text:
      es: "de acuerdo con la declaración del sujeto pasivo."
  - id: b
    correct: true
    text:
      es: "de acuerdo con criterios fundados."
  - id: c
    text:
      es: "de acuerdo con el criterio de la Administración tributaria."
  - id: d
    text:
      es: "de acuerdo con su registro en la contabilidad oficial."
  explanation:
    es: "La deducción de estos bienes de inversión se mide por la utilización previsible según criterios fundados. La mera declaración del sujeto pasivo, el criterio de la Administración o el registro contable no son el parámetro de la regla."
  citation: "art. 95.Tres.1.ª LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-96
- id: m03-l19-q0206
  prompt:
    es: "Según el artículo 96.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, tampoco tienen la consideración de atenciones a clientes, a efectos de la exclusión de la deducción, los bienes destinados exclusivamente a ser objeto de entrega o cesión de uso, directamente o mediante transformación, a título oneroso, que:"
  options:
  - id: a
    text:
      es: "se hubiesen destinado a esas atenciones antes de su adquisición."
  - id: b
    text:
      es: "se hubiesen adquirido a título gratuito para esas atenciones."
  - id: c
    text:
      es: "se destinen a esas atenciones y a la actividad de manera simultánea, antes o después de su adquisición."
  - id: d
    correct: true
    text:
      es: "en un momento posterior a su adquisición se destinasen a esas atenciones."
  explanation:
    es: "Los bienes adquiridos para entregarse o cederse a título oneroso, aunque luego se destinen a atenciones, no se consideran atenciones a clientes. Los destinados antes a esas atenciones, los de destino simultáneo y los adquiridos a título gratuito no reciben esa salvedad."
  citation: "art. 96.Uno LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-92
- id: m03-l19-q0216
  prompt:
    es: "Conforme al artículo 92.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los sujetos pasivos pueden deducir las cuotas que hayan soportado por repercusión directa o correspondan a las entregas de bienes y prestaciones de servicios efectuadas por:"
  options:
  - id: a
    text:
      es: "un empresario o profesional que aplique el régimen general del impuesto, exclusivamente."
  - id: b
    correct: true
    text:
      es: "otro sujeto pasivo del impuesto."
  - id: c
    text:
      es: "cualquier persona o entidad, aunque no tenga la condición de sujeto pasivo."
  - id: d
    text:
      es: "otro sujeto pasivo del impuesto establecido en el mismo territorio, en todo caso."
  explanation:
    es: "El primer supuesto del artículo 92.Uno son las entregas y servicios efectuados por otro sujeto pasivo. No basta cualquier persona, y la ley no exige que sea del mismo territorio ni del régimen general."
  citation: "art. 92.Uno LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "cuotas deducibles"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0226
  prompt:
    es: "¿Cuál de los siguientes bienes queda fuera de la afectación directa y exclusiva a la actividad empresarial o profesional, de acuerdo con el artículo 95.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Los bienes que figuren en la contabilidad de la actividad y se destinen exclusivamente a ella."
  - id: b
    text:
      es: "Los bienes destinados al alojamiento gratuito en los locales de la empresa del personal de vigilancia y seguridad."
  - id: c
    correct: true
    text:
      es: "Los bienes y derechos adquiridos por el sujeto pasivo que no se integren en su patrimonio empresarial o profesional."
  - id: d
    text:
      es: "Los bienes destinados a los servicios económicos y socio-culturales del personal al servicio de la actividad."
  explanation:
    es: "No se entienden afectos directa y exclusivamente a la actividad los bienes y derechos adquiridos por el sujeto pasivo que no se integren en su patrimonio empresarial o profesional (art. 95.Dos.4.º). El alojamiento gratuito del personal de vigilancia y seguridad y los servicios económicos y socio-culturales del personal son, al contrario, excepciones a la regla de los bienes destinados a necesidades personales, de modo que sí se consideran afectos (art. 95.Dos.5.º). Los bienes que figuran en la contabilidad de la actividad y se destinan exclusivamente a ella cumplen el requisito en lugar de incumplirlo: la norma excluye, al contrario, los que no figuran en la contabilidad o registros oficiales (art. 95.Dos.3.º)."
  citation: "art. 95.Dos LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "afectación a la actividad"
# anchor: boe-a-1992-28740-art-96
- id: m03-l19-q0227
  prompt:
    es: "¿En qué proporción pueden deducirse las cuotas soportadas por la adquisición de alimentos, bebidas y tabaco, de acuerdo con el artículo 96.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "En la proporción que resulte del porcentaje de prorrata aplicable al sujeto pasivo."
  - id: b
    correct: true
    text:
      es: "En ninguna proporción, porque el precepto las excluye de la deducción."
  - id: c
    text:
      es: "En el 50 por 100, por presumirse afectos solo parcialmente a la actividad."
  - id: d
    text:
      es: "En la proporción de uso empresarial que acredite el sujeto pasivo, con el límite del 50 por 100."
  explanation:
    es: "Las cuotas soportadas por la adquisición de alimentos, bebidas y tabaco no pueden ser objeto de deducción en ninguna proporción (art. 96.Uno.3.º). El 50 por 100 es la proporción que se presume para los vehículos de turismo, no para estos bienes (art. 95.Tres.2.ª). La prorrata es un mecanismo para las cuotas deducibles, y el artículo 104.Uno deja fuera del impuesto soportado computable las no deducibles por el artículo 96. Y admitir la deducción en proporción al uso empresarial, aun con límite, contradice la exclusión en ninguna proporción."
  citation: "art. 96.Uno LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0121
  prompt:
    es: "Según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran sectores diferenciados de la actividad empresarial o profesional, entre otros, aquellos en los que:"
  options:
  - id: a
    text:
      es: "las actividades se realicen en establecimientos distintos de un mismo empresario o profesional."
  - id: b
    correct: true
    text:
      es: "las actividades económicas realizadas y los regímenes de deducción aplicables sean distintos."
  - id: c
    text:
      es: "las actividades económicas realizadas sean distintas, aunque el régimen de deducción aplicable sea el mismo."
  - id: d
    text:
      es: "los regímenes de deducción aplicables sean distintos, aunque las actividades realizadas sean las mismas."
  explanation:
    es: "El sector diferenciado exige que sean distintas tanto las actividades económicas como los regímenes de deducción. Una sola de las dos diferencias o la mera pluralidad de establecimientos no bastan."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 1
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0123
  prompt:
    es: "¿Cuál de las siguientes operaciones constituye por sí misma un sector diferenciado, según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Las operaciones de cesión de créditos o préstamos, incluidas también las realizadas en el marco de un contrato de factoring."
  - id: b
    text:
      es: "Las operaciones de arrendamiento de bienes inmuebles de uso comercial realizadas por el propio empresario."
  - id: c
    correct: true
    text:
      es: "Las operaciones de cesión de créditos o préstamos, con excepción de las realizadas en el marco de un contrato de factoring."
  - id: d
    text:
      es: "Las operaciones de venta de bienes de inversión utilizados por el empresario en su actividad."
  explanation:
    es: "La letra d') incluye la cesión de créditos o préstamos, salvo el factoring. Incluir el factoring contradice la excepción, y los arrendamientos de inmuebles o la venta de bienes de inversión no son sectores diferenciados por sí mismos."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0124
  prompt:
    es: "Conforme al artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué deben tener asignados las actividades económicas para considerarse distintas a efectos de los sectores diferenciados?"
  options:
  - id: a
    text:
      es: "Tipos impositivos diferentes en la normativa del Impuesto sobre el Valor Añadido."
  - id: b
    text:
      es: "Códigos diferentes en el censo de empresarios, profesionales y retenedores."
  - id: c
    text:
      es: "Epígrafes diferentes en las tarifas del Impuesto sobre Actividades Económicas."
  - id: d
    correct: true
    text:
      es: "Grupos diferentes en la Clasificación Nacional de Actividades Económicas."
  explanation:
    es: "El criterio es el grupo asignado en la Clasificación Nacional de Actividades Económicas. Los epígrafes del IAE, los códigos del censo y los tipos impositivos no son el referente de la ley."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0125
  prompt:
    es: "Talleres Pinilla, S.A. tiene una actividad principal con un volumen de operaciones de 1.000.000 de euros en 2025. Su actividad accesoria contribuye a la realización de la principal y tuvo en 2025 un volumen de operaciones de 150.000 euros. Según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿se reputa actividad distinta en 2026?"
  options:
  - id: a
    text:
      es: "No, porque la actividad accesoria nunca puede ser considerada una actividad distinta."
  - id: b
    correct: true
    text:
      es: "No, porque su volumen del año precedente no excede del 15 por 100 del de la actividad principal y contribuye a su realización."
  - id: c
    text:
      es: "Sí, porque su volumen del año precedente alcanza el 15 por 100 del de la actividad principal."
  - id: d
    text:
      es: "Sí, porque tiene un grupo distinto en la Clasificación Nacional de Actividades Económicas."
  explanation:
    es: "El 15 por 100 de 1.000.000 son 150.000 euros: la accesoria no excede de ese límite y contribuye a la principal, así que no se reputa distinta. Alcanzar el límite no es excederlo. El grupo del CNAE solo es el criterio inicial, y la regla se agota en cumplir las dos condiciones, no en una exención general de las accesorias."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 3
  tags:
  - "sectores diferenciados"
  - "cómputo"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0126
  prompt:
    es: "De acuerdo con el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los regímenes de deducción se consideran distintos si los porcentajes de deducción, determinados con arreglo al artículo 104, aplicables en la actividad distinta de la principal difirieran del de la actividad principal en más de:"
  options:
  - id: a
    text:
      es: "10 puntos porcentuales de diferencia con la actividad principal."
  - id: b
    text:
      es: "30 puntos porcentuales de diferencia con la actividad principal."
  - id: c
    correct: true
    text:
      es: "50 puntos porcentuales de diferencia con la actividad principal."
  - id: d
    text:
      es: "20 puntos porcentuales de diferencia con la actividad principal."
  explanation:
    es: "Los regímenes son distintos si los porcentajes difieren en más de 50 puntos porcentuales. Las otras cifras son próximas a otras reglas de la ley, como el límite del 10 por ciento de la prorrata o el 20 por 100 de la autorización del artículo 101.Dos."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0127
  prompt:
    es: "Distribuciones Rueda, S.L. tiene una actividad principal cuyo porcentaje de deducción conforme al artículo 104 es del 90 %. Otra actividad suya, no accesoria, tendría un porcentaje de deducción del 35 %. Según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿se consideran distintos los regímenes de deducción?"
  options:
  - id: a
    text:
      es: "Sí, porque el porcentaje de la otra actividad es inferior al 50 por 100."
  - id: b
    text:
      es: "No, porque los porcentajes difieren en 55 puntos, y el límite es de 60 puntos porcentuales."
  - id: c
    text:
      es: "No, porque la actividad con menor porcentaje debe ser la principal para que sean distintos."
  - id: d
    correct: true
    text:
      es: "Sí, porque los porcentajes difieren en 55 puntos porcentuales, más de 50."
  explanation:
    es: "90 - 35 = 55 puntos, más de 50: los regímenes son distintos. El límite no es 60, no importa cuál sea el porcentaje mayor ni basta que el de la otra actividad sea inferior al 50 por 100."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
  - "cómputo"
# anchor: boe-a-1992-28740-art-9
- id: m03-l19-q0128
  prompt:
    es: "¿Cuál es el criterio para determinar la actividad principal a efectos de los sectores diferenciados, según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Mayor porcentaje de deducción durante el año inmediato anterior."
  - id: b
    text:
      es: "Mayor número de empleados durante el año inmediato anterior."
  - id: c
    correct: true
    text:
      es: "Mayor volumen de operaciones durante el año inmediato anterior."
  - id: d
    text:
      es: "Mayor volumen de operaciones durante los dos años inmediatos anteriores."
  explanation:
    es: "La actividad principal es la de mayor volumen de operaciones del año inmediato anterior. El número de empleados, el porcentaje de deducción y un período de dos años no son el criterio."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 1
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0129
  prompt:
    es: "Según el artículo 101.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo deben aplicar el régimen de deducciones los sujetos pasivos que realicen actividades económicas en sectores diferenciados?"
  options:
  - id: a
    correct: true
    text:
      es: "Separadamente respecto de cada uno de ellos."
  - id: b
    text:
      es: "De forma opcional respecto de cada uno de ellos."
  - id: c
    text:
      es: "Solo respecto del sector de mayor volumen de operaciones."
  - id: d
    text:
      es: "Conjuntamente respecto de todos ellos."
  explanation:
    es: "Cada sector diferenciado tiene su propio régimen de deducciones, aplicado por separado. No se aplica conjuntamente, ni solo al sector principal, ni de forma opcional."
  citation: "art. 101.Uno LIVA"
  difficulty: 1
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0130
  prompt:
    es: "Señale la respuesta CORRECTA sobre la regla de prorrata especial en los sectores diferenciados, según el artículo 101.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede aplicarse independientemente respecto de cada uno de los sectores diferenciados determinados por aplicación de las letras a'), c') y d') del artículo 9.1.º c)."
  - id: b
    text:
      es: "Puede aplicarse independientemente respecto de cada uno de los sectores diferenciados determinados por aplicación de la letra b') del artículo 9.1.º c) de la Ley."
  - id: c
    text:
      es: "Puede aplicarse solo respecto del sector diferenciado que se haya determinado como actividad principal."
  - id: d
    text:
      es: "Debe aplicarse a todos los sectores diferenciados cuando se aplique a uno de ellos, sin posibilidad de independencia."
  explanation:
    es: "La prorrata especial puede aplicarse sector por sector en los determinados por las letras a'), c') y d'). Los de la letra b') son regímenes especiales que tienen su propia regla de deducción, y la ley no obliga a extender la especial ni la limita al sector principal."
  citation: "art. 101.Uno LIVA"
  difficulty: 3
  tags:
  - "sectores diferenciados"
  - "prorrata"
# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0131
  prompt:
    es: "De acuerdo con el artículo 101.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, cuando se efectúen adquisiciones o importaciones de bienes o servicios para su utilización en común en varios sectores diferenciados, se aplica el artículo 104, apartados dos y siguientes, para determinar el porcentaje de deducción, computando:"
  options:
  - id: a
    correct: true
    text:
      es: "las operaciones realizadas en los sectores diferenciados correspondientes."
  - id: b
    text:
      es: "las operaciones realizadas en el sector diferenciado del último año natural."
  - id: c
    text:
      es: "las operaciones realizadas en todos los sectores diferenciados del sujeto pasivo."
  - id: d
    text:
      es: "las operaciones realizadas únicamente en el sector diferenciado de mayor volumen."
  explanation:
    es: "Para los bienes de uso común se computan las operaciones de los sectores diferenciados correspondientes, no solo las del mayor sector ni las de todos los sectores sin distinción."
