- id: g-svid
  term: {en: SVID}
  definition: {en: "A short lived cryptographic identity document defined by the SPIFFE specifications. Workloads use it when authenticating to other workloads, for example by establishing a TLS connection or by signing and verifying a JWT token."}
  origin: m10-l02
  citation: "spiffe-overview#_top"
- id: g-authorization-grant
  term: {en: authorization grant}
  definition: {en: "A credential representing the resource owner's authorization (to access its protected resources) used by the client to obtain an access token."}
  origin: m10-l02
  citation: "rfc6749#section-1.3"
- id: g-id-token
  term: {en: ID Token}
  definition: {en: "A security token that contains Claims about the Authentication of an End-User by an Authorization Server when using a Client, and potentially other requested Claims. It is represented as a JSON Web Token (JWT)."}
  origin: m10-l02
  citation: "oidc-core#rfc.section.2"
- id: g-security-token-service
  term: {en: Security Token Service}
  definition: {en: "A service capable of validating security tokens provided to it and issuing new security tokens in response, which enables clients to obtain appropriate access credentials for resources in heterogeneous environments or across security domains."}
  origin: m10-l02
  citation: "rfc8693#section-1"
- id: g-role-based-access-control
  term: {en: Role-Based Access Control}
  definition: {en: "A model of access control in which access is granted or denied based upon the roles assigned to a user."}
  origin: m10-l02
  citation: "owasp-cs-authorization#prefer-attribute-and-relationship-based-access-control-over-rbac"
- id: g-relationship-based-access-control
  term: {en: Relationship-Based Access Control}
  definition: {en: "An access control model that grants access based on the relationships between resources."}
  origin: m10-l02
  citation: "owasp-cs-authorization#prefer-attribute-and-relationship-based-access-control-over-rbac"
