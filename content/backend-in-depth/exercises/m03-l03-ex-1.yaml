- id: m03-l03-q01
  prompt:
    en: Virtual threads are not scheduled by the operating system. Which component assigns them to platform threads
      for execution, and how does it work?
  options:
  - id: a
    text:
      en: The operating system scheduler, which maps each virtual thread 1:1 to a kernel thread
  - id: b
    correct: true
    text:
      en: A work-stealing `ForkJoinPool` in FIFO mode that the JDK runs itself
  - id: c
    text:
      en: The common `ForkJoinPool` used by parallel streams, which operates in LIFO mode
  - id: d
    text:
      en: A time-sharing scheduler that preempts a virtual thread when it has used its allotted CPU time
  explanation:
    en: The JDK's virtual thread scheduler is a work-stealing `ForkJoinPool` that operates in FIFO mode. The operating
      system scheduler is wrong because virtual threads are scheduled by the Java runtime rather than the operating
      system. The common pool of parallel streams is wrong because the scheduler's `ForkJoinPool` is distinct from
      it. The time-sharing scheduler is wrong because the scheduler does not currently implement time sharing for
      virtual threads.
  citation: jep-444#Scheduling-virtual-threads; javadoc-thread#virtual-threads
- id: m03-l03-q02
  prompt:
    en: In Java 21, a virtual thread blocks on socket I/O while it runs inside a `synchronized` method. What happens
      to its carrier and to the underlying OS thread?
  options:
  - id: a
    text:
      en: The virtual thread unmounts, and the carrier is free to run another virtual thread
  - id: b
    correct: true
    text:
      en: Both stay blocked for the duration of the operation, because the virtual thread is pinned
  - id: c
    text:
      en: The scheduler adds a carrier thread to compensate for the blocked one
  - id: d
    text:
      en: The JVM throws an exception, because blocking inside `synchronized` makes the application incorrect
  explanation:
    en: While it is pinned, a blocking operation blocks the carrier and the underlying OS thread for the duration
      of the operation. Unmounting is wrong because pinning prevents the virtual thread from unmounting. A compensating
      carrier is wrong because the scheduler does not compensate for pinning by expanding its parallelism. The exception
      is wrong because pinning does not make an application incorrect, it only might hinder its scalability.
  citation: jep-444#Executing-virtual-threads; jep-491#Virtual-threads-are-pinned-in-synchronized-methods
- id: m03-l03-q03
  prompt:
    en: JEP 491 stops virtual threads from being pinned when they block inside `synchronized` methods and statements.
      In which Java release was this JEP delivered?
  options:
  - id: a
    correct: true
    text:
      en: Java 24
  - id: b
    text:
      en: Java 21
  - id: c
    text:
      en: Java 23
  - id: d
    text:
      en: Java 25
  explanation:
    en: JEP 491 lists Java 24 as its release. Java 21 is wrong because JEP 444 for that release says pinning inside
      `synchronized` could only be removed in a future release. Java 23 and Java 25 are wrong because the release
      recorded in JEP 491 is 24.
  citation: jep-491#main; jep-444#Executing-virtual-threads
- id: m03-l03-q04
  prompt:
    en: HikariCP's pool sizing page gives the formula `((core_count * 2) + effective_spindle_count)`. How many connections
      does it compute for a 4-core server with one hard disk?
  options:
  - id: a
    text:
      en: 8 connections
  - id: b
    correct: true
    text:
      en: 9 connections
  - id: c
    text:
      en: 5 connections
  - id: d
    text:
      en: 100 connections
  explanation:
    en: The page computes 9 = ((4 * 2) + 1) for a 4-core i7 server with one hard disk. Eight and five connections
      are wrong because that same computation gives 9. A pool of 100 connections is wrong because the page calls
      even 100 connections overkill.
  citation: hikaricp-pool-sizing#connections--core_count--2--effective_spindle_count; hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections
  extract:
