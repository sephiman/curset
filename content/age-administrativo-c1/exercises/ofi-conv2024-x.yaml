  - id: d
    text:
      es: 'No será necesaria la expedición de ningún documento contable específico. SUPUESTO I El Ministerio para la Transformación
        Digital y de la Función Pública ha sido creado como consecuencia de la última reorganización ministerial, tras la
        supresión del Ministerio de Asuntos Económicos y Transformación Digital. El nuevo Ministerio tiene pensado trasladar
        su sede central a un edificio situado en el Parque Empresarial Madrid Río. El edificio necesita una serie de reformas
        con el objeto de poder acoger a la totalidad del personal destinado en el mismo. Una de las actuaciones a realizar
        es la sustitución de las ventanas, para lo cual se va a realizar un contrato de obras, por una cuantía de 810.000
        euros, con la siguiente distribución: ejercicio actual 75.000 euros, ejercicio inmediato siguiente, 250.000 euros
        y segundo ejercicio 485.000 euros. Una vez comenzadas las obras, el 15 de julio de 2024 se produce un accidente al
        precipitarse una ventana y caer sobre un vehículo aparcado en la calle, provocándole daños en el techo. El vehículo
        es propiedad de D. Faustino Menéndez, que posee una discapacidad del 35%. Al día siguiente, D. Faustino se dirige
        a la Oficina de Asistencia en materia de registros, situada en el interior del edificio y presenta una solicitud de
        indemnización por los daños sufridos. Posteriormente, se le pide subsanar la solicitud aportando parte de las lesiones
        producidas por el accidente, este trámite lo realiza a través de un representante, D. Julio Salcedo. Estado desde
        el 22 de septiembre de 2022. Ha sido destinada, mediante comisión de servicios, al Ministerio para la Transformación
        Digital y de la Función Pública y se está planteando compaginar su trabajo en el Ministerio con el ejercicio de una
        segunda actividad en el sector público. Además, está embarazada de su primer hijo. Una de las tareas que se le encomienda
        a la funcionaria es el pago de la factura de la luz, que asciende a 6.520 euros, y la compra de material de oficina
        destinado al nuevo personal, que asciende a 4.500 euros. En el presupuesto de gastos del Departamento para este ejercicio
        figura lo siguiente: PRESUPUESTO DE GASTOS 2024                                                          Crédito inicial
        2      Gastos corrientes en bienes y servicios                                             850.000 € 202    Arrendamientos
        de edificios y otras construcciones                                  800.000 € 220    Material de oficina                                                                 50.000
        € 3      Gastos financieros                                                                  820.000 € 6      Inversiones
        reales                                                                  800.000 € 62     Inversión nueva asociada
        al funcionamiento operativo de los servicios               400.000 € 63     Inversión de reposición asociada al funcionamiento
        operativo de los servicios       400.000 € En relación con el supuesto planteado, se formulan las siguientes preguntas:'
