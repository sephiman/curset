# anchor: fuente-ms-office-autoguardado-html
- id: m02-l06-q198
  prompt:
    es: "En Microsoft 365 para Windows, ¿en qué caso está habilitado Autoguardado de forma predeterminada para un archivo abierto?"
  options:
  - id: a
    text:
      es: "Cuando el archivo está en un servidor de archivos de la organización"
  - id: b
    text:
      es: "Cuando el archivo está en cualquier servicio de almacenamiento en la nube"
  - id: c
    text:
      es: "Cuando el archivo está guardado en una ruta local como C:\\"
  - id: d
    correct: true
    text:
      es: "Cuando el archivo está almacenado en OneDrive, OneDrive para la Empresa o SharePoint Online"
  explanation:
    es: "Autoguardado se habilita por defecto en archivos de OneDrive, OneDrive para la Empresa o SharePoint Online. Si el archivo está en otra ubicación, como una ruta local, un servidor de archivos o algún otro servicio en la nube, Autoguardado está desactivado."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué es el Autoguardado?»"
