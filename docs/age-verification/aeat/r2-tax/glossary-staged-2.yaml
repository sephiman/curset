# Tax-part glossary entries, batch 2 (III.3–III.6), staged for the blind check.
- id: g-hecho-imponible
  es: hecho imponible
  origin: m03-l03
  definition:
    es: Presupuesto fijado por la ley para configurar cada tributo y cuya realización origina el nacimiento de la obligación
      tributaria principal (art. 20.1 LGT).
- id: g-devengo
  es: devengo
  origin: m03-l03
  definition:
    es: Momento en el que se entiende realizado el hecho imponible y en el que se produce el nacimiento de la obligación tributaria
      principal (art. 21.1 LGT).
- id: g-base-liquidable
  es: base liquidable
  origin: m03-l03
  definition:
    es: Magnitud resultante de practicar, en su caso, en la base imponible las reducciones establecidas en la ley (art. 54
      LGT).
- id: g-tipo-de-gravamen
  es: tipo de gravamen
  origin: m03-l03
  definition:
    es: Cifra, coeficiente o porcentaje que se aplica a la base liquidable para obtener como resultado la cuota íntegra (art.
      55.1 LGT).
- id: g-cuota-liquida
  es: cuota líquida
  origin: m03-l03
  definition:
    es: Resultado de aplicar sobre la cuota íntegra las deducciones, bonificaciones, adiciones o coeficientes previstos, en
      su caso, en la ley de cada tributo (art. 56.5 LGT).
- id: g-cuota-diferencial
  es: cuota diferencial
  origin: m03-l03
  definition:
    es: Resultado de minorar la cuota líquida en el importe de las deducciones, pagos fraccionados, retenciones, ingresos
      a cuenta y cuotas, conforme a la normativa de cada tributo (art. 56.6 LGT).
- id: g-deuda-tributaria
  es: deuda tributaria
  origin: m03-l03
  definition:
    es: Cuota o cantidad a ingresar que resulte de la obligación tributaria principal o de las obligaciones de realizar pagos
      a cuenta; la integran además, en su caso, el interés de demora y los recargos (art. 58.1–2 LGT).
- id: g-obligado-tributario
  es: obligado tributario
  origin: m03-l04
  definition:
    es: Persona física o jurídica o entidad a la que la normativa tributaria impone el cumplimiento de obligaciones tributarias
      (art. 35.1 LGT).
- id: g-sujeto-pasivo
  es: sujeto pasivo
  origin: m03-l04
  definition:
    es: Obligado tributario que, según la ley, debe cumplir la obligación tributaria principal, así como las obligaciones
      formales inherentes a la misma, sea como contribuyente o como sustituto del mismo (art. 36.1 LGT).
- id: g-contribuyente
  es: contribuyente
  origin: m03-l04
  definition:
    es: Sujeto pasivo que realiza el hecho imponible (art. 36.2 LGT).
- id: g-sustituto-del-contribuyente
  es: sustituto
  origin: m03-l04
  definition:
    es: Sujeto pasivo que, por imposición de la ley y en lugar del contribuyente, está obligado a cumplir la obligación tributaria
      principal, así como las obligaciones formales inherentes a la misma (art. 36.3 LGT).
- id: g-retenedor
  es: retenedor
  origin: m03-l04
  definition:
    es: Persona o entidad a quien la ley de cada tributo impone la obligación de detraer e ingresar en la Administración tributaria,
      con ocasión de los pagos que deba realizar a otros obligados tributarios, una parte de su importe a cuenta del tributo
      que corresponda a estos (art. 37.2 LGT).
- id: g-domicilio-fiscal
  es: domicilio fiscal
  origin: m03-l04
  definition:
    es: Lugar de localización del obligado tributario en sus relaciones con la Administración tributaria (art. 48.1 LGT).
- id: g-obligaciones-tributarias-conexas
  es: obligaciones tributarias conexas
  origin: m03-l04
  definition:
    es: A efectos de la interrupción de la prescripción del artículo 68.9 LGT, aquellas en las que alguno de sus elementos
      resulten afectados o se determinen en función de los correspondientes a otra obligación o período distinto (art. 68.9
      LGT).
- id: g-liquidacion-tributaria
  es: liquidación tributaria
  origin: m03-l05
  definition:
    es: Acto resolutorio mediante el cual el órgano competente de la Administración realiza las operaciones de cuantificación
      necesarias y determina el importe de la deuda tributaria o de la cantidad que, en su caso, resulte a devolver o a compensar
      de acuerdo con la normativa tributaria (art. 101.1 LGT).
- id: g-certificado-tributario
  es: certificado tributario
  origin: m03-l05
  definition:
    es: Documento expedido por la Administración tributaria que acredita hechos relativos a la situación tributaria de un
      obligado tributario (art. 70.1 RGAT).
- id: g-diligencia
  es: diligencia
  origin: m03-l05
  definition:
    es: Documento público que se extiende para hacer constar hechos, así como las manifestaciones del obligado tributario
      o persona con la que se entiendan las actuaciones; no puede contener propuestas de liquidaciones tributarias (art. 99.7
      LGT).
- id: g-declaracion-tributaria
  es: declaración tributaria
  origin: m03-l06
  definition:
    es: Todo documento presentado ante la Administración tributaria donde se reconozca o manifieste la realización de cualquier
      hecho relevante para la aplicación de los tributos (art. 119.1 LGT).
- id: g-autoliquidacion
  es: autoliquidación
  origin: m03-l06
  definition:
    es: Declaración en la que el obligado tributario, además de comunicar a la Administración los datos necesarios para la
      liquidación del tributo y otros de contenido informativo, realiza por sí mismo las operaciones de calificación y cuantificación
      necesarias para determinar e ingresar el importe de la deuda tributaria o, en su caso, determinar la cantidad que resulte
      a devolver o a compensar (art. 120.1 LGT).
- id: g-comunicacion-de-datos
  es: comunicación de datos
  origin: m03-l06
  definition:
    es: Declaración presentada por el obligado tributario ante la Administración para que esta determine la cantidad que,
      en su caso, resulte a devolver (art. 121 LGT).
