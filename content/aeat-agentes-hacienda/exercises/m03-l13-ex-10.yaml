# anchor: boe-a-2003-23186-art-202
- id: m03-l13-q0231
  prompt:
    es: "¿Cuál de las siguientes conductas tipifica como infracción el artículo 202 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El incumplimiento de las obligaciones contables y registrales exigidas por la normativa tributaria."
  - id: b
    text:
      es: "El incumplimiento de las obligaciones de facturación o documentación, como la expedición y conservación de facturas."
  - id: c
    text:
      es: "El incumplimiento del deber de sigilo exigido a los retenedores y a los obligados a realizar ingresos a cuenta."
  - id: d
    correct: true
    text:
      es: "El incumplimiento de las obligaciones relativas a la utilización y a la solicitud del número de identificación fiscal o de otros números o códigos."
  explanation:
    es: "El artículo 202 LGT trata de la utilización y solicitud del número de identificación fiscal y de otros números o códigos. La facturación es el artículo 201, las obligaciones contables y registrales el 200 y el sigilo de retenedores el 204."
  citation: "art. 202 LGT"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-204
- id: m03-l13-q0232
  prompt:
    es: "¿Cuál de las siguientes conductas tipifica como infracción el artículo 204 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El incumplimiento del deber de sigilo exigido a los retenedores y a los obligados a realizar ingresos a cuenta."
  - id: b
    text:
      es: "El incumplimiento de la obligación de comunicar correctamente datos al pagador de rentas sometidas a retención."
  - id: c
    text:
      es: "El incumplimiento de la obligación de entregar el certificado de retenciones o ingresos a cuenta."
  - id: d
    text:
      es: "La resistencia, obstrucción, excusa o negativa a las actuaciones de la Administración tributaria."
  explanation:
    es: "El artículo 204 LGT sanciona el incumplimiento del deber de sigilo de retenedores y obligados a ingresos a cuenta. Comunicar datos al pagador es el artículo 205, entregar el certificado el 206 y la resistencia u obstrucción el 203."
  citation: "art. 204 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-206
- id: m03-l13-q0233
  prompt:
    es: "¿Cuál de las siguientes conductas tipifica como infracción el artículo 206 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El incumplimiento de la obligación de entregar el certificado de retenciones o ingresos a cuenta practicados a los perceptores de las rentas."
  - id: b
    text:
      es: "El incumplimiento de las obligaciones de facturación, como la expedición y rectificación de facturas."
  - id: c
    text:
      es: "El incumplimiento de la obligación de comunicar datos al pagador de rentas sometidas a retención o ingreso a cuenta."
  - id: d
    text:
      es: "El incumplimiento del deber de sigilo exigido a los retenedores y a los obligados a ingresos a cuenta."
  explanation:
    es: "El artículo 206 LGT castiga no entregar el certificado de retenciones o ingresos a cuenta a los perceptores de las rentas. Comunicar datos al pagador es el artículo 205, el sigilo el 204 y la facturación el 201."
  citation: "art. 206 LGT"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-199
- id: m03-l13-q0234
  prompt:
    es: "¿Qué conducta tipifica como infracción el artículo 199 de la Ley 58/2003, de 17 de diciembre, General Tributaria, junto con la contestación a requerimientos individualizados de información?"
  options:
  - id: a
    text:
      es: "La omisión de la comunicación del domicilio fiscal por las personas físicas que no realicen actividad económica."
  - id: b
    text:
      es: "La presentación incompleta o inexacta de autoliquidaciones de las que resulte perjuicio económico."
  - id: c
    correct: true
    text:
      es: "La presentación incorrecta de autoliquidaciones o declaraciones sin que se produzca perjuicio económico."
  - id: d
    text:
      es: "La falta de presentación en plazo de autoliquidaciones o declaraciones sin perjuicio económico."
  explanation:
    es: "El artículo 199 LGT tipifica la presentación incorrecta de autoliquidaciones o declaraciones sin perjuicio económico o la contestación incorrecta a requerimientos individualizados. No presentarlas en plazo es el artículo 198.1, el perjuicio económico lleva a los artículos 191 a 193 y el domicilio fiscal es el 198.5."
  citation: "art. 199 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-201
- id: m03-l13-q0235
  prompt:
    es: "¿Qué obligaciones tributarias, entre otras, tipifica como infracción el incumplimiento de las de facturación o documentación del artículo 201 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La de llevanza de contabilidad y de los libros registros de acuerdo con la normativa tributaria."
  - id: b
    text:
      es: "La de comunicar el domicilio fiscal y sus cambios a la Administración tributaria."
  - id: c
    text:
      es: "La de presentación en plazo de las autoliquidaciones periódicas de los tributos."
  - id: d
    correct: true
    text:
      es: "La de expedición, remisión, rectificación y conservación de facturas, justificantes o documentos sustitutivos."
  explanation:
    es: "El artículo 201.1 LGT incluye, entre las obligaciones de facturación, la expedición, remisión, rectificación y conservación de facturas, justificantes o documentos sustitutivos. La contabilidad y los registros son el artículo 200, la presentación en plazo el 198 y el domicilio fiscal el 198.5."
  citation: "art. 201 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0243
  prompt:
    es: "Ismael Duran obtuvo indebidamente una devolución de 4.000 euros y debía haber ingresado 2.000 euros en su autoliquidación. ¿Cuál es la cuantía no ingresada, según el artículo 191.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "6.000 euros, que resultan de sumar la devolución obtenida indebidamente y la cuantía que debió ingresarse."
  - id: b
    text:
      es: "4.000 euros, que es la devolución obtenida indebidamente, sin sumar la cuantía total que debió ingresarse en la autoliquidación."
  - id: c
    text:
      es: "2.000 euros, que es la cuantía que debió ingresarse en la autoliquidación del obligado."
  - id: d
    text:
      es: "2.000 euros, que es la diferencia entre la devolución obtenida y la que debió ingresarse."
  explanation:
    es: "El artículo 191.5 LGT suma la devolución indebida y la cuantía total que debió ingresarse en la autoliquidación: 4.000 + 2.000 = 6.000 euros. Tomar solo la devolución, solo lo que debió ingresarse o su diferencia no es la regla."
  citation: "art. 191.5 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "base"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0244
  prompt:
    es: "¿Cómo califica el artículo 198.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria la infracción de no presentar en plazo autoliquidaciones o declaraciones sin que se haya producido perjuicio económico?"
  options:
  - id: a
    text:
      es: "Como infracción leve, con multa pecuniaria proporcional del 50 por ciento."
  - id: b
    correct: true
    text:
      es: "Como infracción leve, con multa pecuniaria fija."
  - id: c
    text:
      es: "Como infracción grave, con multa pecuniaria fija."
  - id: d
    text:
      es: "Como infracción grave, con multa pecuniaria proporcional del 15 por ciento."
  explanation:
    es: "El artículo 198.1 LGT califica de leve la falta de presentación en plazo sin perjuicio económico y la sanciona con multa fija: 200, 400 euros o 20 por dato, según el caso. El 50 por ciento es la multa de las leves del artículo 191 y el 15 por ciento la del artículo 194.1, y no es una infracción grave."
  citation: "art. 198.1 LGT"
  difficulty: 1
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0246
  prompt:
    es: "De acuerdo con el artículo 191.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción por dejar de ingresar la deuda que debiera resultar de una autoliquidación es grave cuando la base de la sanción sea:"
  options:
  - id: a
    correct: true
    text:
      es: "Superior a 3.000 euros y exista ocultación."
  - id: b
    text:
      es: "Superior a 3.000 euros, aunque no exista ocultación."
  - id: c
    text:
      es: "Inferior o igual a 3.000 euros y exista ocultación."
  - id: d
    text:
      es: "Superior a 6.000 euros y exista ocultación."
  explanation:
    es: "El artículo 191.3 LGT califica de grave la infracción con base superior a 3.000 euros y ocultación. Sin ocultación es leve, el umbral no es de 6.000 euros, y con base de hasta 3.000 euros la infracción es leve aunque haya ocultación."
  citation: "art. 191.3 LGT"
  difficulty: 1
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-192
- id: m03-l13-q0247
  prompt:
    es: "De acuerdo con el artículo 192.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción de no presentar de forma completa y correcta las declaraciones necesarias para practicar liquidaciones se sanciona, cuando es grave, con:"
  options:
  - id: a
    text:
      es: "Multa pecuniaria fija de 300 euros, que se incrementa con los criterios del artículo 187.1."
  - id: b
    correct: true
    text:
      es: "Multa pecuniaria proporcional del 50 al 100 por ciento, con los incrementos del artículo 187.1.a y b."
  - id: c
    text:
      es: "Multa pecuniaria proporcional del 15 por ciento, con los incrementos del artículo 187.1.a y b."
  - id: d
    text:
      es: "Multa pecuniaria proporcional del 100 al 150 por ciento, con los incrementos del artículo 187.1.a, pero sin los del b."
  explanation:
    es: "El artículo 192.3 LGT impone a la infracción grave una multa proporcional del 50 al 100 por ciento, con los incrementos de los párrafos a) y b) del artículo 187.1. El 15 por ciento es del artículo 194.1, el tramo del 100 al 150 es el de la muy grave y la multa fija de 300 euros es la del 194.2."
  citation: "art. 192.3 LGT"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0250
  prompt:
    es: "De acuerdo con el artículo 191.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción por infracción muy grave por dejar de ingresar la deuda que debiera resultar de una autoliquidación consiste en una multa pecuniaria proporcional:"
  options:
  - id: a
    text:
      es: "Del 100 al 200 por ciento."
  - id: b
    text:
      es: "Del 50 al 100 por ciento."
  - id: c
    text:
      es: "Del 150 al 200 por ciento."
  - id: d
    correct: true
    text:
      es: "Del 100 al 150 por ciento."
  explanation:
    es: "La multa muy grave del artículo 191.4 LGT va del 100 al 150 por ciento. El tramo del 50 al 100 por ciento es el de la infracción grave. No existen los tramos del 100 al 200 ni del 150 al 200 por ciento."
  citation: "art. 191.4 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-207
- id: m03-l13-q0160
  prompt:
    es: "De acuerdo con el artículo 207 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento sancionador en materia tributaria se regula por las normas especiales del título IV y su normativa reglamentaria de desarrollo y, en su defecto, por:"
  options:
  - id: a
    text:
      es: "Las normas del procedimiento de inspección de los tributos del título III de la ley."
  - id: b
    correct: true
    text:
      es: "Las normas reguladoras del procedimiento sancionador en materia administrativa."
  - id: c
    text:
      es: "Las normas del procedimiento económico-administrativo del título V de la propia ley."
  - id: d
    text:
      es: "Las normas del procedimiento de apremio recogidas en el Reglamento General de Recaudación."
  explanation:
    es: "El artículo 207 LGT remite en defecto de normas tributarias especiales al procedimiento sancionador administrativo general. No se rige supletoriamente por la inspección, el apremio ni el procedimiento económico-administrativo."
  citation: "art. 207 LGT"
  difficulty: 1
  tags:
  - "remisión"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0162
  prompt:
    es: "A Pinturas Ortiz, S.L. se le inicia un procedimiento de inspección, y puede derivarse una sanción. La sociedad desea que las cuestiones sobre la infracción se resuelvan junto con la regularización. Según el artículo 208.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede hacer?"
  options:
  - id: a
    text:
      es: "Esperar a que finalice la inspección, momento en que el procedimiento se acumula de oficio."
  - id: b
    correct: true
    text:
      es: "Renunciar a la tramitación separada, y entonces el procedimiento sancionador se tramita conjuntamente."
  - id: c
    text:
      es: "Nada, porque el procedimiento sancionador se tramita siempre de forma separada."
  - id: d
    text:
      es: "Solicitar a la Administración que acuerde la tramitación conjunta, que debe concederla."
  explanation:
    es: "El artículo 208.1 LGT permite la renuncia del obligado a la tramitación separada, y en ese caso se tramita conjuntamente. No es una regla sin excepciones ni una solicitud que la Administración deba conceder. Tampoco hay acumulación de oficio al terminar la inspección."
  citation: "art. 208.1 LGT"
  difficulty: 1
  tags:
  - "supuesto"
  - "procedimiento"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0163
  prompt:
    es: "De acuerdo con el artículo 208.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los supuestos de actas con acuerdo y en aquellos en que el obligado haya renunciado a la tramitación separada, las cuestiones relativas a las infracciones se analizan:"
  options:
  - id: a
    correct: true
    text:
      es: "En el correspondiente procedimiento de aplicación de los tributos, de acuerdo con la normativa reguladora del mismo."
  - id: b
    text:
      es: "En el procedimiento sancionador, con carácter previo a la liquidación de la deuda tributaria que corresponda en cada caso."
  - id: c
    text:
      es: "En un procedimiento sancionador independiente, que se inicia al terminar el de aplicación de los tributos."
  - id: d
    text:
      es: "En el procedimiento económico-administrativo que se interponga contra la regularización practicada."
  explanation:
    es: "El artículo 208.2 LGT lleva las cuestiones de infracciones al procedimiento de aplicación de los tributos correspondiente. No se tramitan en un procedimiento independiente ni antes de la liquidación ni en la vía económico-administrativa."
  citation: "art. 208.2 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0164
  prompt:
    es: "De acuerdo con el artículo 208.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en las actas con acuerdo la renuncia al procedimiento separado se hace constar expresamente en ellas, y la propuesta de sanción debidamente motivada, con el contenido del artículo 210.4, se:"
  options:
  - id: a
    text:
      es: "Formula en un documento aparte, que el obligado firma con posterioridad."
  - id: b
    text:
      es: "Notifica al obligado después de firmada el acta con acuerdo."
  - id: c
    text:
      es: "Incorpora a la resolución de liquidación, sin figurar en el acta con acuerdo."
  - id: d
    correct: true
    text:
      es: "Incluye en el acta con acuerdo."
  explanation:
    es: "El artículo 208.2 LGT incluye en el acta con acuerdo la propuesta de sanción motivada, junto con la renuncia al procedimiento separado. No se notifica después, no va en un documento aparte y no se deja para la resolución de liquidación."
  citation: "art. 208.2 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0165
  prompt:
    es: "De acuerdo con el artículo 208.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los procedimientos sancionadores garantizan a los afectados, entre otros, el derecho a ser notificado de los hechos que se le imputen, de las infracciones que puedan constituir y de las sanciones que se les pudieran imponer, así como de:"
  options:
  - id: a
    text:
      es: "La identidad del instructor, pero no la de la autoridad competente para imponer la sanción."
  - id: b
    correct: true
    text:
      es: "La identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia."
  - id: c
    text:
      es: "La identidad del instructor y del secretario, y de las pruebas que haya practicado la Administración."
  - id: d
    text:
      es: "La identidad del órgano que haya acordado el inicio y del Interventor que haya fiscalizado la sanción."
  explanation:
    es: "El artículo 208.3.a LGT garantiza ser notificado también de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya la competencia. No se limita al instructor, y no menciona al Interventor ni al secretario ni la relación de pruebas."
  citation: "art. 208.3 LGT"
  difficulty: 2
  tags:
  - "derechos"
# anchor: boe-a-2003-23186-art-209
- id: m03-l13-q0167
  prompt:
    es: "¿Cómo se inicia el procedimiento sancionador en materia tributaria, de acuerdo con el artículo 209.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Siempre de oficio, mediante la comunicación de inicio del procedimiento de aplicación de los tributos."
  - id: b
    text:
      es: "De oficio, mediante la notificación de la propuesta de resolución que haya elaborado el instructor."
  - id: c
    correct: true
    text:
      es: "Siempre de oficio, mediante la notificación del acuerdo del órgano competente."
  - id: d
    text:
      es: "De oficio o a instancia del obligado tributario, mediante la notificación del acuerdo del órgano competente."
  explanation:
    es: "El artículo 209.1 LGT dice que el procedimiento se inicia siempre de oficio, mediante la notificación del acuerdo del órgano competente. No cabe iniciarlo a instancia del obligado, y el inicio no consiste en notificar la propuesta de resolución, que llega al concluir las actuaciones, ni en la comunicación de inicio del procedimiento tributario del que deriva."
  citation: "art. 209.1 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
  - "inicio"
# anchor: boe-a-2003-23186-art-209
- id: m03-l13-q0168
  prompt:
    es: "El 12 de febrero de 2026 se notifica a Distribuciones Roca, S.L. la liquidación que pone fin a un procedimiento de comprobación limitada. El 20 de agosto de 2026 se le notifica el acuerdo de inicio de un procedimiento sancionador derivado de aquella liquidación. Según el artículo 209.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿pudo iniciarse en esa fecha?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo para iniciar el procedimiento sancionador es de un año desde la notificación de la liquidación."
  - id: b
    correct: true
    text:
      es: "No, porque el 20 de agosto de 2026 habían transcurrido más de seis meses desde que se notificó la liquidación."
  - id: c
    text:
      es: "Sí, porque los seis meses se cuentan desde que la liquidación sea firme en vía administrativa."
  - id: d
    text:
      es: "Sí, porque el plazo de seis meses solo rige para las sanciones accesorias del artículo 186."
  explanation:
    es: "El artículo 209.2 LGT impide iniciar el procedimiento sancionador derivado de una comprobación una vez transcurridos seis meses desde que se notificó la liquidación. Del 12 de febrero al 12 de agosto de 2026 corren los seis meses, y el acuerdo se notifica después. El plazo no es de un año, no se cuenta desde la firmeza y el límite de seis meses para las sanciones del artículo 186 es otra regla paralela, no la única."
  citation: "art. 209.2 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-209
- id: m03-l13-q0169
  prompt:
    es: "¿En cuál de los siguientes casos deben iniciarse los procedimientos sancionadores en el plazo de seis meses desde que se hubiese notificado la sanción pecuniaria, según el artículo 209.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los que se incoen para imponer la sanción en los supuestos de actas con acuerdo del artículo 155."
  - id: b
    correct: true
    text:
      es: "Los que se incoen para imponer las sanciones accesorias a que se refiere el artículo 186."
  - id: c
    text:
      es: "Los que se incoen como consecuencia de un procedimiento de comprobación limitada."
  - id: d
    text:
      es: "Los que se incoen para imponer las sanciones por la infracción del artículo 194."
  explanation:
    es: "El artículo 209.2 LGT fija seis meses desde la notificación de la sanción pecuniaria para iniciar el procedimiento de las sanciones del artículo 186, las accesorias. Los procedimientos derivados de una comprobación limitada cuentan los seis meses desde la liquidación, no desde una sanción. Las sanciones del artículo 194 y de las actas con acuerdo no tienen esa regla específica."
  citation: "art. 209.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-209
- id: m03-l13-q0170
  prompt:
    es: "Según el artículo 209.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde cuándo se cuenta el plazo de seis meses para iniciar el procedimiento sancionador que se incoe para imponer las sanciones del artículo 186?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde que se hubiese notificado o se entendiese notificada la sanción pecuniaria a que se refiere ese precepto."
  - id: b
    text:
      es: "Desde que la sanción pecuniaria sea firme en vía administrativa o, en su caso, en la vía contencioso-administrativa."
  - id: c
    text:
