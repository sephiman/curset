# anchor: fuente-ms-win-recortes-html
- id: m02-l07-q145
  prompt:
    es: "En la herramienta Recortes de Windows 11, ¿cuál de los siguientes botones permite guardar una copia adicional del recorte capturado, eligiendo su ubicación y su nombre de archivo?"
  options:
  - id: a
    text:
      es: "Compartir"
  - id: b
    text:
      es: "Configuración"
  - id: c
    text:
      es: "Recorte de imagen"
  - id: d
    correct: true
    text:
      es: "Guardar como"
  explanation:
    es: "La página dice que se puede guardar una copia adicional del recorte seleccionando el botón Guardar como, eligiendo la ubicación y el nombre de archivo y guardando. Compartir envía el recorte, Configuración cambia el guardado automático y Recorte de imagen recorta la imagen."
