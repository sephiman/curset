- id: m01-l06-q093
  prompt:
    es: "Según el párrafo 55 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, cada gobierno decidirá la forma de incorporar las aspiraciones y metas mundiales en:"
  options:
  - id: a
    text:
      es: "Los presupuestos, las leyes y los tratados internacionales."
  - id: b
    text:
      es: "Los planes de la Asamblea General y los acuerdos de cooperación."
  - id: c
    correct: true
    text:
      es: "Los procesos de planificación, las políticas y las estrategias nacionales."
  - id: d
    text:
      es: "Los informes de seguimiento del foro político de alto nivel."
  explanation:
    es: "El párrafo 55 deja a cada gobierno decidir cómo incorporar las aspiraciones y metas mundiales en sus procesos de planificación, políticas y estrategias nacionales. Los presupuestos, las leyes y los tratados no son los instrumentos que nombra. Los planes de la Asamblea General y los informes del foro político de alto nivel pertenecen al plano mundial, no al nacional."
