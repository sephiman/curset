    text:
      es: 'Un mes. SUPUESTO II En el Ministerio de Hacienda y Función Pública se ha iniciado un expediente disciplinario a
        un funcionario por haber indicios de abuso de autoridad en el ejercicio de su cargo. Los agentes forestales del Parque
        Nacional de Sierra Nevada en Andalucía han localizado a un visitante, Juan López García, recolectando varios ejemplares
        de manzanilla (Artemisia granatensis). Dicha planta se encuentra incluida en el Listado de Especies Silvestres en
        Régimen de Protección Especial. Ante tal hecho, la administración competente inicia un procedimiento de naturaleza
        sancionadora comunicando el acuerdo de iniciación al instructor del procedimiento y notificándoselo al inculpado,
        el señor López García. Una norma con rango de ley establece el régimen jurídico básico de la conservación, uso sostenible,
        mejora y restauración del patrimonio natural y de la biodiversidad, tipificando las infracciones con las correspondientes
        sanciones. Por otro lado, la Secretaría de Estado de Medio Ambiente del Ministerio para la Transición Ecológica y
        el Reto Demográfico tiene previsto cambiar la sede de sus oficinas para el año 2024. En el edificio donde se alojarán
        las nuevas oficinas es necesario realizar trabajos de reforma a través de un contrato de obras por valor de 300.000
        €, excluido el Impuesto sobre el Valor Añadido. puesto de nivel 15. En enero de 2023 da a luz a su primer hijo y en
        junio del mismo año solicita, con comienzo el 1 de julio de 2023, una excedencia por cuidado de hijos regulada en
        el artículo 14 del Estatuto Básico del Empleado Público. la Subdirección General de Coordinación Económica del Ministerio
        de Transportes, Movilidad y Agenda Urbana, en la que surgen las siguientes cuestiones: -        En el Ministerio se
        está tramitando el expediente de gasto correspondiente a un contrato de suministro. -         Asimismo, se ha producido
        un derrumbamiento en una carretera que obliga a llevar a cabo una serie de obras. Se plantea la posibilidad de expedir
        una orden de pago a justificar. El Instituto Nacional de Estadística, INE, Organismo autónomo adscrito al Ministerio
        de Asuntos Económicos y Transformación Digital, tiene que abordar una serie de actuaciones tras un incendio en la
        sede situada en Cádiz. Una de las actuaciones a llevar a cabo es la reconstrucción del edificio, para lo cual se va
        a realizar un contrato de obras, cuyo gasto se imputará al artículo 63 “Inversión de reposición asociada al funcionamiento
        operativo de los servicios”, por una cuantía de 810.000 euros, con la siguiente distribución: ejercicio actual 75.000
        euros, ejercicio inmediato siguiente, 250.000 euros y segundo ejercicio 485.000 euros. Además, se va a necesitar instalar
        un equipo de aire acondicionado, de carácter inventariable, en una nueva sede del Organismo en Madrid. En el presupuesto
        de gastos del Organismo autónomo para este ejercicio figura lo siguiente: PRESUPUESTO DE GASTOS 2023                                                         Crédito
        inicial 2   Gastos corrientes en bienes y servicios                                              2.025.000 € 20   Arrendamiento
        y cánones                                                                450.000 € 21   Reparaciones, mantenimiento
        y conservación                                             800.000 € 22   Material, suministros y otros                                                          775.000
        € 6   Inversiones reales                                                                     800.000 € 62   Inversión
        nueva asociada al funcionamiento operativo de los servicios                  400.000 € 63   Inversión de reposición
        asociada al funcionamiento operativo de los servicios          400.000 € Además, el INE va a convocar la licitación
        de un contrato de arrendamiento de butacas para el salón de actos. antes ninguna vinculación con las Administraciones
        Públicas. En la unidad en la que trabaja se está preparando la documentación necesaria para los próximos presupuestos
        generales.'
    correct: false
