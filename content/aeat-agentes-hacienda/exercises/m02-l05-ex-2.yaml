# anchor: boe-a-2015-10565-art-121
- id: m02-l05-q0001
  prompt:
    es: "De acuerdo con el artículo 121.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos que no pongan fin a la vía administrativa podrán ser recurridos en alzada ante:"
  options:
  - id: a
    text:
      es: "El mismo órgano que dictó el acto recurrido."
  - id: b
    text:
      es: "El titular del departamento ministerial, en todo caso."
  - id: c
    correct: true
    text:
      es: "El órgano superior jerárquico del que los dictó."
  - id: d
    text:
      es: "El Consejo de Estado, previo informe del órgano autor."
  explanation:
    es: "El artículo 121.1 dice que esos actos «podrán ser recurridos en alzada ante el órgano superior jerárquico del que los dictó». El recurso ante el mismo órgano es la reposición, y procede contra actos que sí ponen fin a la vía (art. 123.1). La alzada no se resuelve siempre por el Ministro, sino por el superior inmediato, y el Consejo de Estado no resuelve recursos."
  citation: "art. 121.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-121
- id: m02-l05-q0054
  prompt:
    es: "De acuerdo con el artículo 121.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el recurso de alzada se ha interpuesto ante el órgano que dictó el acto impugnado, este debe remitirlo al competente en el plazo de:"
  options:
  - id: a
    text:
      es: "Un mes, con su informe y con una copia completa y ordenada del expediente."
  - id: b
    correct: true
    text:
      es: "Diez días, con su informe y con una copia completa y ordenada del expediente."
  - id: c
    text:
      es: "Cinco días, con su informe y con una copia completa y ordenada del expediente."
  - id: d
    text:
      es: "Tres meses, con su informe y con una copia completa y ordenada del expediente."
  explanation:
    es: "El artículo 121.2 fija diez días para la remisión, acompañada del informe y de una copia completa y ordenada del expediente. Un mes es el plazo de interposición de la alzada contra un acto expreso (art. 122.1) y tres meses el de resolución (art. 122.2); cinco días no figura en ese artículo."
  citation: "art. 121.2 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0057
  prompt:
    es: "De acuerdo con el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el acto no fuera expreso, el recurso de alzada podrá interponerse:"
  options:
  - id: a
    text:
      es: "En el plazo de un mes a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
  - id: b
    correct: true
    text:
      es: "En cualquier momento a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
  - id: c
    text:
      es: "En el plazo de tres meses a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
  - id: d
    text:
      es: "En el plazo de seis meses a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
  explanation:
    es: "Contra un acto presunto el artículo 122.1 no fija plazo de caducidad: el recurso de alzada puede interponerse en cualquier momento desde el día siguiente a aquel en que se producen los efectos del silencio. Un mes es el plazo contra el acto expreso, tres meses es el plazo para resolver la alzada, y seis meses es el plazo del recurso contencioso contra el acto presunto (art. 46.1 LJCA), no el de la alzada."
  citation: "art. 122.1 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "silencio administrativo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0059
  prompt:
    es: "¿Cuál es el único recurso administrativo que cabe contra la resolución de un recurso de alzada, según el artículo 122.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El recurso potestativo de reposición, ante el mismo órgano que resolvió la alzada."
  - id: b
    text:
      es: "Un segundo recurso de alzada, ante el órgano superior jerárquico del que resolvió."
  - id: c
    correct: true
    text:
      es: "El recurso extraordinario de revisión, en los casos del artículo 125.1."
  - id: d
    text:
      es: "El recurso de queja, ante el órgano al que corresponda la inspección de los servicios."
  explanation:
    es: "El artículo 122.3 excluye cualquier otro recurso administrativo contra la resolución de la alzada, salvo el extraordinario de revisión en los casos del artículo 125.1. La reposición se dirige contra actos que ponen fin a la vía administrativa, pero la resolución de la alzada ya agotó la vía y el precepto no la admite. Tampoco cabe repetir la alzada, y el recurso de queja no existe en la regulación del título V."
  citation: "art. 122.3 LPAC"
  difficulty: 2
  tags:
  - "alzada"
  - "extraordinario de revisión"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0104
  prompt:
    es: "Según el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo para la interposición del recurso de alzada, si el acto fuera expreso, será de:"
  options:
  - id: a
    text:
      es: "Dos meses, transcurridos los cuales sin haberse interpuesto el recurso la resolución será firme a todos los efectos."
  - id: b
    text:
      es: "Tres meses, transcurridos los cuales sin haberse interpuesto el recurso la resolución será firme a todos los efectos."
  - id: c
    text:
      es: "Quince días, transcurridos los cuales sin haberse interpuesto el recurso la resolución será firme a todos los efectos."
  - id: d
    correct: true
    text:
      es: "Un mes, transcurrido el cual sin haberse interpuesto el recurso la resolución será firme a todos los efectos."
  explanation:
    es: "El artículo 122.1 fija un mes para recurrir en alzada un acto expreso, y vencido ese plazo la resolución es firme. Dos meses es el plazo del recurso contencioso-administrativo (art. 46.1 LJCA), tres meses es el plazo máximo para resolver la alzada y quince días no es plazo de interposición del recurso en este artículo."
  citation: "art. 122.1 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0105
  prompt:
    es: "Doña Beatriz Ortiz interpuso un recurso de alzada hace cuatro meses y todavía no se le ha notificado resolución alguna. Según el artículo 122.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué puede entender, salvo el supuesto del artículo 24.1, tercer párrafo?"
  options:
  - id: a
    text:
      es: "Que el recurso está estimado, porque ha transcurrido el plazo máximo de tres meses."
  - id: b
    correct: true
    text:
      es: "Que el recurso está desestimado, porque ha transcurrido el plazo máximo de tres meses."
  - id: c
    text:
      es: "Que el recurso está desestimado, pero solo cuando haya transcurrido el plazo máximo de seis meses."
  - id: d
    text:
      es: "Que el recurso está inadmitido, porque el órgano no ha dictado resolución en plazo."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución de la alzada es de tres meses, y pasado sin resolución se puede entender desestimado el recurso (art. 122.2). Han pasado cuatro. No se entiende estimado, el plazo no es de seis meses, y el silencio no equivale a una inadmisión, que exige una resolución del órgano."
  citation: "art. 122.2 LPAC"
  difficulty: 2
  tags:
  - "alzada"
  - "silencio administrativo"
# anchor: boe-a-2015-10565-art-121
- id: m02-l05-q0115
  prompt:
    es: "Señale la respuesta CORRECTA sobre el objeto de los recursos administrativos, de acuerdo con los artículos 121.1, 123.1 y 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "La alzada se interpone contra actos que ponen fin a la vía administrativa, la reposición contra los que no la ponen y la revisión contra los firmes en vía administrativa."
  - id: b
    text:
      es: "La alzada se interpone contra actos que no ponen fin a la vía administrativa, la reposición contra los firmes en vía administrativa y la revisión contra los que la ponen."
  - id: c
    text:
      es: "La alzada se interpone contra actos que no ponen fin a la vía administrativa, la reposición contra cualquier acto y la revisión contra los que sí la ponen."
  - id: d
    correct: true
    text:
      es: "La alzada se interpone contra actos que no ponen fin a la vía administrativa, la reposición contra los que sí la ponen y la revisión contra los firmes en vía administrativa."
  explanation:
    es: "La alzada se dirige contra resoluciones y actos que no ponen fin a la vía administrativa (art. 121.1), la reposición contra los que sí la ponen (art. 123.1) y el extraordinario de revisión contra los actos firmes en vía administrativa (art. 125.1). Los distractores intercambian esos objetos o amplían la reposición a cualquier acto, cuando solo cabe contra los que cierran la vía."
  citation: "art. 121.1 LPAC"
  difficulty: 3
  tags:
  - "alzada"
  - "reposición"
  - "extraordinario de revisión"
# anchor: boe-a-2015-10565-art-124
- id: m02-l05-q0004
  prompt:
    es: "Según los artículos 123.1 y 124.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso potestativo de reposición contra un acto expreso se interpone:"
  options:
  - id: a
    text:
      es: "En el plazo de un mes, ante el superior jerárquico del que dictó el acto."
  - id: b
    text:
      es: "En el plazo de dos meses, ante el mismo órgano que dictó el acto."
  - id: c
    text:
      es: "En el plazo de tres meses, ante el superior jerárquico del que dictó el acto."
  - id: d
    correct: true
    text:
      es: "En el plazo de un mes, ante el mismo órgano que dictó el acto."
  explanation:
    es: "El artículo 124.1 fija para la reposición contra un acto expreso un plazo «de un mes», y el 123.1 dice que se interpone «ante el mismo órgano que los hubiera dictado». El superior jerárquico es el órgano de la alzada. Dos meses es el plazo del recurso contencioso-administrativo y tres meses, el de resolución de la alzada."
  citation: "art. 124.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-124
- id: m02-l05-q0006
  prompt:
    es: "Señale la respuesta correcta sobre el recurso potestativo de reposición, según el artículo 124 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "El plazo máximo para dictar y notificar la resolución del recurso de reposición es de tres meses."
  - id: b
    correct: true
    text:
      es: "Contra la resolución de un recurso de reposición no puede interponerse de nuevo dicho recurso."
  - id: c
    text:
      es: "Contra la resolución del recurso cabe alzada ante el órgano superior jerárquico del que la dictó."
  - id: d
    text:
      es: "Si el acto recurrido es expreso, el plazo de interposición es de dos meses."
  explanation:
    es: "El artículo 124.3 dice que «contra la resolución de un recurso de reposición no podrá interponerse de nuevo dicho recurso». El plazo para resolver es de un mes (art. 124.2), no de tres, que es el de la alzada. La reposición se dirige contra actos que ya agotan la vía, de modo que su resolución no admite alzada. El plazo de interposición contra un acto expreso es de un mes (art. 124.1)."
  citation: "art. 124.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-10565-art-123
- id: m02-l05-q0060
  prompt:
    es: "De acuerdo con el artículo 123.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra una resolución expresa de un Ministro que pone fin a la vía administrativa, la persona interesada puede:"
  options:
  - id: a
    text:
      es: "Interponer recurso de alzada ante el Presidente del Gobierno o impugnarla directamente ante el orden contencioso-administrativo."
  - id: b
    text:
      es: "Interponer necesariamente recurso de reposición ante el Ministro, antes de acudir al orden contencioso-administrativo."
  - id: c
    text:
      es: "Impugnarla solo ante el orden contencioso-administrativo, porque contra ella no cabe recurso administrativo alguno."
  - id: d
    correct: true
    text:
      es: "Interponer recurso potestativo de reposición ante el Ministro o impugnarla directamente ante el orden contencioso-administrativo."
  explanation:
    es: "Los actos que ponen fin a la vía administrativa pueden recurrirse en reposición, de forma potestativa, ante el mismo órgano que los dictó, o impugnarse directamente en el orden contencioso-administrativo (art. 123.1). La alzada se dirige contra actos que no ponen fin a la vía (art. 121.1), y el Presidente del Gobierno no es el superior del Ministro a estos efectos. La reposición no es obligatoria, y que sea posible excluye decir que no cabe recurso administrativo alguno."
  citation: "art. 123.1 LPAC"
  difficulty: 2
  tags:
  - "reposición"
  - "vía contencioso-administrativa"
# anchor: boe-a-2015-10565-art-124
- id: m02-l05-q0062
  prompt:
    es: "Según el artículo 124.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, transcurrido el plazo de un mes para interponer el recurso de reposición contra un acto expreso, únicamente podrá interponerse:"
  options:
  - id: a
    text:
      es: "Recurso de alzada, sin perjuicio de la procedencia del recurso extraordinario de revisión."
  - id: b
    correct: true
    text:
      es: "Recurso contencioso-administrativo, sin perjuicio de la procedencia del recurso extraordinario de revisión."
  - id: c
    text:
      es: "Recurso contencioso-administrativo, sin perjuicio de la procedencia de un nuevo recurso de reposición."
  - id: d
    text:
      es: "Recurso extraordinario de revisión, sin perjuicio de la procedencia del recurso contencioso-administrativo."
  explanation:
    es: "El artículo 124.1 dice que, pasado el mes, solo puede interponerse recurso contencioso-administrativo, salvo que proceda el extraordinario de revisión. La alzada no cabe contra actos que ya ponen fin a la vía administrativa. Contra la resolución de la reposición no puede interponerse de nuevo ese recurso (art. 124.3), y el extraordinario de revisión es la excepción, no la regla."
  citation: "art. 124.1 LPAC"
  difficulty: 1
  tags:
  - "reposición"
  - "plazo"
# anchor: boe-a-2015-10565-art-124
- id: m02-l05-q0064
  prompt:
    es: "¿Cuál de las siguientes parejas de plazos máximos para dictar y notificar la resolución es correcta, según los artículos 122.2 y 124.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Un mes para el recurso de alzada y tres meses para el recurso de reposición."
  - id: b
    text:
      es: "Tres meses para el recurso de alzada y tres meses para el recurso de reposición."
  - id: c
    text:
      es: "Seis meses para el recurso de alzada y un mes para el recurso de reposición."
  - id: d
    correct: true
    text:
      es: "Tres meses para el recurso de alzada y un mes para el recurso de reposición."
  explanation:
    es: "El plazo máximo para resolver la alzada es de tres meses (art. 122.2) y el de la reposición, de un mes (art. 124.2). Las demás parejas invierten los plazos, igualan los dos en tres meses o elevan el de la alzada a seis, cifra que ninguno de los dos artículos recoge."
  citation: "art. 124.2 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "reposición"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0107
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los plazos de interposición contra un acto expreso es correcta, según los artículos 122.1 y 124.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas y 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "El recurso de alzada, un mes; el de reposición y el contencioso-administrativo, dos meses."
  - id: b
    text:
      es: "El recurso de alzada y el de reposición, dos meses; el contencioso-administrativo, un mes."
  - id: c
    text:
      es: "El recurso de alzada, tres meses; el de reposición, un mes; el contencioso-administrativo, dos meses."
  - id: d
    correct: true
    text:
      es: "El recurso de alzada y el de reposición, un mes; el contencioso-administrativo, dos meses."
  explanation:
    es: "Contra un acto expreso, la alzada y la reposición se interponen en un mes (arts. 122.1 y 124.1 LPAC) y el recurso contencioso-administrativo en dos (art. 46.1 LJCA). Las demás combinaciones atribuyen dos meses a la reposición, invierten los plazos administrativo y judicial, o dan tres meses a la alzada, que es su plazo de resolución, no el de interposición."
  citation: "art. 122.1 LPAC"
  difficulty: 1
  tags:
  - "plazos"
  - "alzada"
  - "reposición"
# anchor: boe-a-2015-10565-art-122
- id: m02-l05-q0114
  prompt:
    es: "Señale la respuesta CORRECTA sobre la interposición de recursos contra un acto presunto, de acuerdo con los artículos 122.1 y 124.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas y 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa:"
  options:
  - id: a
    text:
      es: "El recurso de alzada y el de reposición deben interponerse en un mes desde el día siguiente al silencio, y el contencioso-administrativo en seis meses."
  - id: b
    correct: true
    text:
      es: "El recurso de alzada y el de reposición pueden interponerse en cualquier momento desde el día siguiente al silencio, y el contencioso-administrativo en seis meses."
  - id: c
    text:
      es: "El recurso de alzada y el de reposición pueden interponerse en cualquier momento desde el día siguiente al silencio, y el contencioso-administrativo también."
  - id: d
    text:
      es: "El recurso de alzada puede interponerse en cualquier momento desde el día siguiente al silencio, y los de reposición y contencioso-administrativo en seis meses."
  explanation:
    es: "Contra el acto presunto, la alzada (art. 122.1) y la reposición (art. 124.1) pueden interponerse en cualquier momento a partir del día siguiente a aquel en que se producen los efectos del silencio, mientras que el contencioso-administrativo tiene un plazo de seis meses (art. 46.1 LJCA). Los plazos de un mes son los del acto expreso, el contencioso no carece de plazo, y la reposición no tiene un plazo de seis meses."
  citation: "art. 122.1 LPAC"
  difficulty: 3
  tags:
  - "acto presunto"
  - "plazos"
