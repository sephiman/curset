      es: "exacta y definitiva, reservando siempre la totalidad del crédito presupuestario."
  explanation:
    es: "La aprobación autoriza un gasto de cuantía cierta o aproximada y reserva todo o parte de un crédito. La cuantía determinada o determinable es la del compromiso, y la aprobación precede al reconocimiento de la obligación, no lo sigue."
