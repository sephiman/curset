# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q230
  prompt:
    es: "Si el reparo lo formuló la IGAE, o esta confirmó el de otra Intervención, y la discrepancia subsiste, ¿quién adopta la resolución definitiva?"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas."
  - id: b
    text:
      es: "El Ministro de Hacienda."
  - id: c
    text:
      es: "La propia Intervención General, por resolución obligatoria."
  - id: d
    correct: true
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "El artículo 155.b) LGP dice que, cuando el reparo lo formula la Intervención General de la Administración del Estado o esta confirma el de otra Intervención y la discrepancia subsiste, «corresponderá al Consejo de Ministros adoptar resolución definitiva». La Intervención General resuelve solo las discrepancias sobre reparos de las intervenciones delegadas, según la letra a), y no puede resolver las de su propio reparo. El Tribunal de Cuentas y el Ministro de Hacienda no son los órganos que nombra la letra b): el órgano es el Consejo de Ministros."
  citation: "art. 155.b) LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q231
  prompt:
    es: "¿Cuál de las siguientes descripciones del procedimiento de discrepancias frente a los reparos de la Intervención es correcta?"
  options:
  - id: a
    text:
      es: "Si el reparo es de una intervención delegada, resuelve el Consejo de Ministros; si es de la IGAE, resuelve el Tribunal de Cuentas."
  - id: b
    text:
      es: "Si el reparo es de una intervención delegada, resuelve la Subsecretaría; si es de la IGAE, resuelve el Ministro de Hacienda."
  - id: c
    correct: true
    text:
      es: "Si el reparo es de una intervención delegada, resuelve la IGAE; si es de la IGAE, decide el Consejo de Ministros."
  - id: d
    text:
      es: "Cualquiera que sea el órgano que formuló el reparo, resuelve siempre la IGAE con carácter definitivo."
  explanation:
    es: "El artículo 155 escalona la resolución: la Intervención General de la Administración del Estado resuelve los reparos de las intervenciones delegadas, y el Consejo de Ministros decide en definitiva los de la propia Intervención General. Las demás opciones saltan un escalón, introducen al Tribunal de Cuentas, a la Subsecretaría o al Ministro de Hacienda, o dejan siempre el último escalón en manos de la Intervención General."
  citation: "art. 155 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-156
- id: m05-l03-q232
  prompt:
    es: "Si una función interventora preceptiva se hubiese omitido, el artículo 156.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria prohíbe reconocer la obligación, tramitar el pago e intervenir favorablemente estas actuaciones:"
  options:
  - id: a
    text:
      es: "Hasta que transcurran quince días desde la omisión."
  - id: b
    text:
      es: "Salvo que el órgano gestor asuma la responsabilidad del gasto."
  - id: c
    text:
      es: "Mientras el Tribunal de Cuentas no declare su regularidad."
  - id: d
    correct: true
    text:
      es: "Hasta que se subsane dicha omisión."
  explanation:
    es: "El artículo 156.1 mantiene la prohibición hasta que se subsane la omisión. No hay un plazo de quince días tras el cual caiga la prohibición. El órgano gestor no puede levantarla asumiendo la responsabilidad. El Tribunal de Cuentas no interviene en este trámite."
  citation: "art. 156.1 LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2003-21614-art-156
- id: m05-l03-q233
  prompt:
    es: "Un órgano gestor tramitó un gasto sin someterlo a la fiscalización previa que la ley exigía. Mientras no se subsane la omisión, ¿qué puede hacerse con ese gasto?"
  options:
  - id: a
    text:
      es: "Se puede reconocer la obligación, pero no tramitar el pago."
  - id: b
    text:
      es: "Se puede tramitar el pago, pero no reconocer la obligación."
  - id: c
    text:
      es: "Se pueden reconocer la obligación y tramitar el pago bajo la responsabilidad del gestor."
  - id: d
    correct: true
    text:
      es: "No se puede reconocer la obligación ni tramitar el pago."
  explanation:
    es: "Mientras la omisión no se subsane, el artículo 156.1 impide tanto reconocer la obligación como tramitar el pago. Las opciones que permiten una de las dos actuaciones, o ambas bajo responsabilidad del gestor, rebajan una prohibición que la ley formula de forma conjunta."
  citation: "art. 156.1 LGP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q235
  prompt:
    es: "Según el artículo 140 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado ejerce el control interno de la gestión económica y financiera del sector público estatal:"
  options:
  - id: a
    text:
      es: "Bajo la dirección del Tribunal de Cuentas en materia de fiscalización del gasto público."
  - id: b
    text:
      es: "Con sujeción a las instrucciones del titular del departamento controlado."
  - id: c
    text:
      es: "Con autonomía limitada a las entidades de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "Con plena autonomía respecto de las autoridades y entidades cuya gestión controle."
  explanation:
    es: "El artículo 140.2 le da plena autonomía respecto de las autoridades y entidades cuya gestión controla. Depender del Tribunal de Cuentas o recibir instrucciones del titular del departamento controlado anularía esa autonomía. Y la autonomía no se limita a la Seguridad Social."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-142
- id: m05-l03-q236
  prompt:
    es: "¿Mediante qué instrumentos se ejerce el control interno de la gestión económico-financiera del sector público estatal?"
  options:
  - id: a
    text:
      es: "La función interventora, el control de eficacia y la fiscalización consuntiva del gasto."
  - id: b
    text:
      es: "El control financiero permanente, la auditoría privada y la jurisdicción contable."
  - id: c
    text:
      es: "La fiscalización previa, el enjuiciamiento contable y la auditoría pública."
  - id: d
    correct: true
    text:
      es: "La función interventora, el control financiero permanente y la auditoría pública."
  explanation:
    es: "El artículo 142.2 enumera tres instrumentos: función interventora, control financiero permanente y auditoría pública. Las demás opciones sustituyen alguno por figuras que no pertenecen al control interno, como la fiscalización consuntiva, la auditoría privada, la jurisdicción contable o el enjuiciamiento contable, propios del Tribunal de Cuentas."
  citation: "art. 142.2 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1978-31229-art-136
- id: m05-l03-q239
  prompt:
    es: "Según el artículo 136.1 de la Constitución Española, el Tribunal de Cuentas ejerce sus funciones por delegación de las Cortes Generales en el examen y comprobación de:"
  options:
  - id: a
    correct: true
    text:
      es: "La Cuenta General del Estado."
  - id: b
    text:
      es: "Los Presupuestos Generales del Estado."
  - id: c
    text:
      es: "Las cuentas de los partidos políticos."
  - id: d
    text:
      es: "Los informes de auditoría pública de la IGAE."
  explanation:
    es: "La delegación del artículo 136.1 recae en el examen y comprobación de la Cuenta General del Estado. Los Presupuestos Generales los examinan y aprueban las propias Cortes. Las cuentas de los partidos las fiscaliza el Tribunal, pero no por esta delegación. Y los informes de auditoría pública son del control interno."
  citation: "art. 136.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1982-11584-art-2
- id: m05-l03-q240
  prompt:
    es: "Según el artículo 2 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, es función propia del Tribunal el enjuiciamiento de la responsabilidad contable en que incurran quienes:"
  options:
  - id: a
    correct: true
    text:
      es: "Tengan a su cargo el manejo de caudales o efectos públicos."
  - id: b
    text:
      es: "Ordenen gastos sin la fiscalización previa de la Intervención."
  - id: c
    text:
      es: "Hayan formulado reparos a actos del sector público estatal."
  - id: d
    text:
      es: "Ejerzan funciones de control interno sobre el sector público."
  explanation:
    es: "El artículo 2.b) atribuye al Tribunal de Cuentas el enjuiciamiento de la responsabilidad contable de quienes tengan a su cargo el manejo de caudales o efectos públicos. Ordenar gastos sin fiscalización, formular reparos o ejercer control interno son actuaciones de otra naturaleza, y quien interviene no responde por ello ante la jurisdicción contable."
  citation: "art. 2 LO 2/1982"
  difficulty: 1
  tags:
  - "competencia"
  - "concepto"
# anchor: boe-a-1982-11584-art-2
- id: m05-l03-q241
  prompt:
    es: "Según el artículo 2 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, la fiscalización externa, permanente y consuntiva que ejerce el Tribunal de Cuentas recae sobre:"
  options:
  - id: a
    text:
      es: "Los actos del sector público estatal antes de que sean aprobados."
  - id: b
    correct: true
    text:
      es: "La actividad económico-financiera del sector público."
  - id: c
    text:
      es: "La legalidad de las normas con rango de ley en materia presupuestaria."
  - id: d
    text:
      es: "La actividad de los particulares que no reciben fondos públicos."
  explanation:
    es: "El artículo 2.a) sitúa esta fiscalización sobre la actividad económico-financiera del sector público. El control de los actos antes de su aprobación es la función interventora. El control de constitucionalidad de las leyes corresponde al Tribunal Constitucional. Y la actividad de particulares sin fondos públicos queda fuera de su ámbito."
  citation: "art. 2 LO 2/1982"
  difficulty: 2
  tags:
  - "competencia"
  - "concepto"
# anchor: boe-a-2003-21614-art-131
- id: m05-l03-q252
  prompt:
    es: "Según el artículo 131.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Cuenta General del Estado se eleva al Gobierno para su remisión al Tribunal de Cuentas antes del día:"
  options:
  - id: a
    text:
      es: "31 de agosto del año siguiente al ejercicio al que se refiera."
  - id: b
    text:
      es: "30 de junio del año siguiente al ejercicio al que se refiera."
  - id: c
    correct: true
    text:
      es: "31 de octubre del año siguiente al que se refiera."
  - id: d
    text:
      es: "31 de diciembre del año al que se refiera."
  explanation:
    es: "El artículo 131.1 de la Ley General Presupuestaria fija el 31 de octubre del año siguiente. El 31 de agosto es la fecha en que, según la Ley 7/1988, se ultima la Cuenta General, que es otra norma y otro trámite. El 30 de junio y el 31 de diciembre del propio año no figuran en el artículo."
  citation: "art. 131.1 LGP"
  difficulty: 2
  tags:
  - "fecha"
  - "plazo"
# anchor: boe-a-1988-8678-art-33
- id: m05-l03-q253
  prompt:
    es: "Según el artículo 33.1 de la Ley 7/1988, de 5 de abril, de Funcionamiento del Tribunal de Cuentas, la Cuenta General del Estado que forma la Intervención General se ultimará antes del día:"
  options:
  - id: a
    correct: true
    text:
      es: "31 de agosto del año siguiente al que se refiera."
  - id: b
    text:
      es: "31 de octubre del año siguiente al que se refiera."
  - id: c
    text:
      es: "30 de septiembre del año siguiente al que se refiera."
  - id: d
    text:
      es: "30 de junio del año siguiente al que se refiera."
  explanation:
    es: "El artículo 33.1 de la Ley 7/1988 manda ultimar la Cuenta General antes del 31 de agosto del año siguiente. El 31 de octubre es la fecha de la Ley General Presupuestaria para elevarla al Gobierno, que es otra norma y otro trámite. El 30 de septiembre y el 30 de junio no figuran en el artículo."
  citation: "art. 33.1 Ley 7/1988"
  difficulty: 3
  tags:
  - "fecha"
  - "plazo"
# anchor: boe-a-1988-8678-art-33
- id: m05-l03-q254
  prompt:
    es: "Según el artículo 33.1 de la Ley 7/1988, de 5 de abril, de Funcionamiento del Tribunal de Cuentas, una vez ultimada, la Cuenta General del Estado se remite al Tribunal dentro de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los dos meses siguientes a su conclusión."
  - id: b
    text:
      es: "Los quince días siguientes a su conclusión."
  - id: c
    text:
      es: "Los seis meses siguientes a su conclusión."
  - id: d
    text:
      es: "El mes siguiente a la aprobación por el Gobierno."
  explanation:
    es: "El artículo 33.1 da dos meses desde la conclusión de la Cuenta General para remitirla al Tribunal. Los seis meses son el plazo del Tribunal para examinarla, no el de remisión. Los quince días y el mes desde la aprobación del Gobierno no figuran en el artículo."
  citation: "art. 33.1 Ley 7/1988"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1982-11584-art-10
- id: m05-l03-q255
  prompt:
    es: "Según el artículo 10 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, el plazo de seis meses para examinar la Cuenta General del Estado se cuenta a partir de la fecha en que:"
  options:
  - id: a
    text:
      es: "La Intervención General la ultime."
  - id: b
    text:
      es: "El Consejo de Ministros la apruebe."
  - id: c
    correct: true
    text:
      es: "Se haya rendido al Tribunal."
  - id: d
    text:
      es: "Concluya el ejercicio al que se refiere."
  explanation:
    es: "El artículo 10 cuenta los seis meses desde la fecha en que la Cuenta General se haya rendido al Tribunal. Ni su conclusión por la Intervención General, ni una aprobación del Consejo de Ministros que el artículo no exige, ni el fin del ejercicio abren el plazo."
  citation: "art. 10 LO 2/1982"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1982-11584-art-10
- id: m05-l03-q258
  prompt:
    es: "En el examen de la Cuenta General del Estado, ¿quién dicta la declaración definitiva, según el artículo 10 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas?"
  options:
  - id: a
    text:
      es: "La Comisión de Gobierno, oído el Fiscal."
  - id: b
    correct: true
    text:
      es: "El Pleno del Tribunal, oído el Fiscal."
  - id: c
    text:
      es: "La Sección de Fiscalización, sin intervención del Fiscal."
  - id: d
    text:
      es: "El Presidente del Tribunal, oída la IGAE."
  explanation:
    es: "El artículo 10 atribuye la declaración definitiva al Pleno, oído el Fiscal. La Comisión de Gobierno es otro órgano del Tribunal, con funciones de régimen interno. La Sección de Fiscalización prepara el expediente, pero no decide. El Presidente no dicta la declaración por sí solo."
  citation: "art. 10 LO 2/1982"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1982-11584-art-10
- id: m05-l03-q259
  prompt:
    es: "Según el artículo 10 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, el Pleno eleva la declaración definitiva sobre la Cuenta General del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "A las Cámaras con la oportuna propuesta, dando traslado al Gobierno."
  - id: b
    text:
      es: "Al Gobierno, que la somete a las Cámaras para su aprobación."
  - id: c
    text:
      es: "A la Intervención General, que la incorpora a la siguiente Cuenta."
  - id: d
    text:
      es: "A las Cámaras, sin dar traslado al Gobierno."
  explanation:
    es: "El Pleno eleva la declaración a las Cámaras con la oportuna propuesta y da traslado al Gobierno. La opción que la envía primero al Gobierno invierte el destinatario. La de la Intervención General la devuelve a quien formó la Cuenta. La que omite el traslado al Gobierno suprime un trámite que la ley prevé."
  citation: "art. 10 LO 2/1982"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
