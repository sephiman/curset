# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q301
  prompt:
    es: "En Outlook 365, ¿qué ve el destinatario en el campo Importancia de su bandeja de entrada cuando recibe un mensaje enviado con importancia alta?"
  options:
  - id: a
    text:
      es: "Un círculo rojo con una cruz"
  - id: b
    text:
      es: "Un signo de exclamación azul"
  - id: c
    correct: true
    text:
      es: "Un signo de exclamación rojo"
  - id: d
    text:
      es: "Una bandera roja de seguimiento"
  explanation:
    es: "El destinatario ve un signo de exclamación rojo en el campo Importancia. Un signo de exclamación azul contradice el color rojo que cita la ayuda. La bandera roja de seguimiento y el círculo rojo con una cruz contradicen esa frase, que habla de un signo de exclamación."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q302
  prompt:
    es: "En Outlook 365 clásico, ¿dónde se selecciona Importancia alta al redactar un mensaje nuevo o una respuesta?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Mensaje"
  - id: b
    text:
      es: "En la pestaña Inicio"
  - id: c
    text:
      es: "En la pestaña Revisar"
  - id: d
    text:
      es: "En la pestaña Opciones"
  explanation:
    es: "En Outlook clásico, Importancia alta se selecciona en la pestaña Mensaje. La pestaña Opciones es donde el nuevo Outlook ofrece Importancia. La pestaña Inicio y la pestaña Revisar contradicen la frase de la ayuda, que indica la pestaña Mensaje."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q303
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué ruta lleva a los niveles de importancia de un mensaje nuevo o de una respuesta?"
  options:
  - id: a
    text:
      es: "Mensaje › Importancia alta"
  - id: b
    text:
      es: "Mensaje › Etiquetas › Importancia"
  - id: c
    text:
      es: "Configuración › Correo › Importancia"
  - id: d
    correct: true
    text:
      es: "Opciones › Importancia"
  explanation:
    es: "En el nuevo Outlook, en la pestaña Opciones se selecciona Importancia y después el nivel. Mensaje › Importancia alta es la ruta de Outlook clásico. Configuración › Correo › Importancia contradice la ayuda, que indica la pestaña Opciones. Mensaje › Etiquetas es la sección a la que se llega en Outlook clásico con los puntos suspensivos."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q304
  prompt:
    es: "En Outlook 365 clásico, ¿qué debe hacerse si no aparece el comando Importancia alta en la pestaña Mensaje?"
  options:
  - id: a
    text:
      es: "Seleccionar la pestaña Opciones y elegir Importancia en el grupo Etiquetas"
  - id: b
    correct: true
    text:
      es: "Abrir los puntos suspensivos y elegir Importancia alta en Etiquetas"
  - id: c
    text:
      es: "Seleccionar Archivo › Opciones › Correo y activar Importancia alta"
  - id: d
    text:
      es: "Seleccionar Ver › Configuración de vista y elegir Importancia alta"
  explanation:
    es: "Si no se ve Importancia alta, se seleccionan los puntos suspensivos y se elige Importancia alta en la sección Etiquetas. La pestaña Opciones con Importancia es la ruta del nuevo Outlook. Archivo › Opciones › Correo sirve para opciones como Limpieza de conversación. Ver › Configuración de vista sirve para cambiar fuentes de la lista de mensajes."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q305
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál es la configuración de importancia predeterminada de un mensaje, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Alta"
  - id: b
    text:
      es: "Baja"
  - id: c
    correct: true
    text:
      es: "Normal"
  - id: d
    text:
      es: "La que se eligió en el último mensaje enviado"
  explanation:
    es: "La ayuda dice que la configuración de importancia predeterminada es Normal. Alta y Baja son niveles que se eligen a propósito: Baja, por ejemplo, para información de rutina. Que sea la del último mensaje enviado contradice que la predeterminada sea Normal."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-importancia-html
- id: m06-l07-q306
  prompt:
    es: "En Outlook 365 clásico, ¿qué se selecciona en la pestaña Mensaje para marcar un mensaje como de importancia baja, por ser información de rutina?"
  options:
