    es: "La orden entró en vigor el 15 de abril de 2023, como dice su disposición final única. El 31 de marzo de 2023 es la fecha de su publicación en el Boletín Oficial del Estado. El 1 de enero y el 1 de julio no son fechas de la disposición."
  citation: "disposición final única Orden HFP/311/2023"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
  - "límite exento"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0137
  prompt:
    es: "Conforme al artículo 48.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿se exige garantía en el aplazamiento o fraccionamiento solicitado por una Administración pública?"
  options:
  - id: a
    text:
      es: "Sí, aval solidario de entidad de crédito por el importe de la deuda."
  - id: b
    text:
      es: "Sí, una garantía del 25 por ciento de la deuda si está en período voluntario."
  - id: c
    text:
      es: "Solo si la deuda está en período ejecutivo, en cuyo caso se exige una garantía del 5 por ciento."
  - id: d
    correct: true
    text:
      es: "No, porque cuando el solicitante es una Administración pública no se exige garantía."
  explanation:
    es: "Cuando el solicitante es una Administración pública no se exige garantía (artículo 48.1), sea cual sea el importe o el período. Ni el límite exento ni los porcentajes de cobertura del apartado siguiente entran en juego."
  citation: "art. 48.1 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0138
  prompt:
    es: "De acuerdo con el artículo 48.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la garantía de una deuda aplazada que se encuentra en período voluntario cubrirá el importe de la deuda, los intereses de demora que genere el aplazamiento y:"
  options:
  - id: a
    correct: true
    text:
      es: "Un 25 por ciento de la suma de ambas partidas."
  - id: b
    text:
      es: "Un 5 por ciento de la suma de ambas partidas."
  - id: c
    text:
      es: "Un 20 por ciento de la suma de ambas partidas."
  - id: d
    text:
      es: "Un 10 por ciento de la suma de ambas partidas."
  explanation:
    es: "En período voluntario la garantía cubre la deuda, los intereses de demora y un 25 por ciento de la suma de ambas partidas (artículo 48.2). El 5 por ciento es el margen del período ejecutivo. El 20 y el 10 por ciento no figuran en el precepto."
  citation: "art. 48.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
  - "cobertura"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0143
  prompt:
    es: "Según el artículo 48.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en caso de solicitud de fraccionamiento podrá constituirse:"
  options:
  - id: a
    text:
      es: "Una única garantía para la totalidad de las fracciones, sin que quepan garantías parciales."
  - id: b
    text:
      es: "Una garantía por cada fracción, sin que quepa una única garantía para el conjunto."
  - id: c
    text:
      es: "Una garantía parcial para la primera fracción, y la dispensa para las demás."
  - id: d
    correct: true
    text:
      es: "Una única garantía para la totalidad de las fracciones, o garantías parciales e independientes para una o varias fracciones."
  explanation:
    es: "En el fraccionamiento puede constituirse una sola garantía para todas las fracciones o garantías parciales e independientes para una o varias (artículo 48.3). Limitarlo a una u otra modalidad no concuerda con el texto, y la dispensa de las demás fracciones no es una posibilidad que contemple el apartado."
  citation: "art. 48.3 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0144
  prompt:
    es: "¿Al vencimiento de qué debe exceder, al menos en seis meses, la vigencia de la garantía constituida mediante aval o certificado de seguro de caución, conforme al artículo 48.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Al vencimiento del plazo o plazos garantizados."
  - id: b
    text:
      es: "A la fecha de notificación del acuerdo de concesión."
  - id: c
    text:
      es: "Al plazo de ingreso en período voluntario de la deuda."
  - id: d
    text:
      es: "A la fecha de formalización de la garantía."
  explanation:
    es: "La vigencia del aval o del seguro de caución debe exceder en seis meses al vencimiento del plazo o plazos garantizados (artículo 48.5). La notificación del acuerdo, el plazo voluntario y la formalización de la garantía no son el punto de referencia."
  citation: "art. 48.5 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0147
  prompt:
    es: "En relación con la formalización de la garantía de un aplazamiento o fraccionamiento, conforme al artículo 48.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "El acuerdo de concesión es plenamente eficaz desde su notificación, aunque la garantía se formalice después."
  - id: b
    correct: true
    text:
      es: "La eficacia del acuerdo de concesión queda condicionada a la formalización de la garantía."
  - id: c
    text:
      es: "La eficacia del acuerdo de concesión queda condicionada a que el solicitante abone el primer plazo."
  - id: d
    text:
      es: "La garantía debe formalizarse antes de que se dicte el acuerdo de concesión."
  explanation:
    es: "El acuerdo de concesión queda condicionado en su eficacia a que se formalice la garantía en el plazo de dos meses (artículo 48.6). No es eficaz sin ella. No depende de abonar el primer plazo. La garantía se formaliza después de la notificación del acuerdo, no antes de dictarlo."
  citation: "art. 48.6 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0148
  prompt:
    es: "Conforme al artículo 48.7.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si transcurre el plazo de dos meses sin formalizarse las garantías y la solicitud se presentó en período voluntario, se iniciará el período ejecutivo:"
  options:
  - id: a
    text:
      es: "Al día siguiente al de la notificación del acuerdo de concesión."
  - id: b
    text:
      es: "Al día siguiente al del vencimiento del plazo de ingreso en período voluntario."
  - id: c
    correct: true
    text:
      es: "Al día siguiente de aquel en que finalizó el plazo para la formalización de las garantías."
  - id: d
    text:
      es: "Al día siguiente al del vencimiento del primer plazo concedido."
  explanation:
    es: "El período ejecutivo comienza al día siguiente de aquel en que acabó el plazo para formalizar las garantías (artículo 48.7.a). No se retrotrae a la notificación del acuerdo ni al vencimiento del plazo voluntario, y el primer plazo concedido no es la referencia."
  citation: "art. 48.7 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0149
  prompt:
    es: "Si pasan dos meses sin haberse formalizado las garantías y la solicitud se presentó en período ejecutivo, conforme al artículo 48.7 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se inicia un nuevo período voluntario de ingreso de dos meses."
  - id: b
    text:
      es: "Se concede un plazo adicional de diez días para formalizar las garantías."
  - id: c
    text:
      es: "Se inadmite la solicitud, con efectos desde la fecha en que se presentó."
  - id: d
    correct: true
    text:
      es: "Continúa el procedimiento de apremio."
  explanation:
    es: "Si la solicitud se presentó en período ejecutivo y no se formalizan las garantías, continúa el procedimiento de apremio (artículo 48.7.b). No se abre un nuevo período voluntario. No hay un plazo adicional de diez días. La solicitud ya fue concedida, de modo que no cabe inadmitirla."
  citation: "art. 48.7 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2005-14803-art-51
- id: m03-l09-q0150
  prompt:
    es: "De acuerdo con el artículo 51.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, durante la tramitación de la solicitud de aplazamiento o fraccionamiento el deudor deberá:"
  options:
  - id: a
    text:
      es: "Suspender todo pago hasta que se dicte la resolución sobre la solicitud."
  - id: b
    correct: true
    text:
      es: "Efectuar el pago del plazo, fracción o fracciones propuestos en la solicitud."
  - id: c
    text:
      es: "Ingresar la totalidad de la deuda, que se devolverá si se concede el aplazamiento."
  - id: d
    text:
      es: "Constituir la garantía ofrecida antes de que se dicte la resolución."
  explanation:
    es: "Mientras se tramita la solicitud, el deudor debe pagar el plazo, fracción o fracciones que propuso (artículo 51.2). No puede suspender sus pagos. Tampoco se le exige ingresar toda la deuda con derecho a devolución, ni constituir la garantía antes de la resolución."
  citation: "art. 51.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "tramitación"
# anchor: boe-a-2005-14803-art-51
- id: m03-l09-q0151
  prompt:
    es: "Según el artículo 51.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si en cualquier momento durante la tramitación del aplazamiento o fraccionamiento el interesado efectúa el ingreso de la deuda, la Administración liquidará intereses de demora por el período transcurrido:"
  options:
  - id: a
    text:
      es: "Desde el día de presentación de la solicitud hasta la fecha del ingreso."
  - id: b
    text:
      es: "Desde el día siguiente al de la notificación de la liquidación hasta el vencimiento del plazo de ingreso."
  - id: c
    correct: true
    text:
      es: "Desde el día siguiente al del vencimiento del plazo de ingreso en período voluntario hasta la fecha del ingreso."
  - id: d
    text:
      es: "Desde el día de la providencia de apremio hasta la fecha del ingreso."
  explanation:
    es: "Los intereses corren desde el día siguiente al del vencimiento del plazo voluntario hasta la fecha del ingreso (artículo 51.3). No arrancan con la presentación de la solicitud ni con la notificación de la liquidación, y no hace falta providencia de apremio porque el ingreso se hace durante la tramitación."
  citation: "art. 51.3 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "tramitación"
  - "intereses"
# anchor: boe-a-2005-14803-art-51
- id: m03-l09-q0152
  prompt:
    es: "El plazo de ingreso en período voluntario de una deuda acabó el martes 20 de abril de 2027. El obligado solicitó un aplazamiento dentro del plazo y, mientras se tramita, ingresa la deuda completa el lunes 31 de mayo de 2027. Conforme al artículo 51.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿desde qué fecha liquida la Administración los intereses de demora?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el 21 de abril de 2027, día siguiente al vencimiento del plazo voluntario, hasta el 31 de mayo de 2027."
  - id: b
    text:
      es: "Desde la fecha de presentación de la solicitud hasta el 31 de mayo de 2027."
  - id: c
    text:
      es: "No liquida intereses de demora, porque la solicitud impedía el período ejecutivo."
  - id: d
    text:
      es: "Desde el 1 de junio de 2027, día siguiente al ingreso, hasta la resolución de la solicitud."
  explanation:
    es: "Los intereses se liquidan desde el día siguiente al vencimiento del plazo voluntario hasta la fecha del ingreso (artículo 51.3): del 21 de abril al 31 de mayo. No se cuentan desde la presentación de la solicitud. La solicitud impide el período ejecutivo pero no el devengo del interés (artículo 65.5). Los intereses no corren después del ingreso."
  citation: "art. 51.3 RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "tramitación"
  - "intereses"
  - "cómputo"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0153
  prompt:
    es: "Conforme al artículo 52.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en todo caso el vencimiento de los plazos concedidos en un aplazamiento o fraccionamiento deberá coincidir con:"
  options:
  - id: a
    correct: true
    text:
      es: "Los días 5 o 20 del mes."
  - id: b
    text:
      es: "Los días 1 o 15 del mes."
  - id: c
    text:
      es: "El último día hábil del mes."
  - id: d
    text:
      es: "El día que designe el solicitante en su petición."
  explanation:
    es: "Los vencimientos deben coincidir con los días 5 o 20 del mes (artículo 52.1). Los días 1 y 15 no son los del precepto. El último día hábil del mes tampoco. El solicitante no elige el día, porque la resolución puede señalar plazos distintos de los solicitados."
  citation: "art. 52.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "resolución"
  - "plazos"
