# anchor: celex-32013r0952-art-144
- id: m03-l20-q0105
  prompt:
    es: "De acuerdo con el artículo 144 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, las mercancías no pertenecientes a la Unión se mantienen en depósito temporal a partir del momento de:"
  options:
  - id: a
    text:
      es: "Su entrada en el territorio aduanero de la Unión."
  - id: b
    text:
      es: "La admisión de la declaración sumaria de entrada."
  - id: c
    text:
      es: "El levante concedido por las autoridades aduaneras."
  - id: d
    correct: true
    text:
      es: "Su presentación en aduana."
  explanation:
    es: "El depósito temporal empieza con la presentación en aduana. No empieza con la mera entrada en el territorio, ni con la admisión de la declaración sumaria de entrada, que es anterior a la presentación, ni con el levante, que es posterior a la inclusión en un régimen."
  citation: "art. 144 CAU"
  difficulty: 1
  tags:
  - "depósito temporal"
  - "momento"
# anchor: celex-32013r0952-art-149
- id: m03-l20-q0106
  prompt:
    es: "Unas mercancías no pertenecientes a la Unión llevan 80 días en depósito temporal sin haberse incluido en un régimen aduanero ni reexportado. Según el artículo 149 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿de cuántos días más disponen, como máximo, para hacerlo?"
  options:
  - id: a
    text:
      es: "De 40 días, porque el plazo del depósito temporal es de 120 días."
  - id: b
    text:
      es: "De 100 días, porque el plazo del depósito temporal es de 180 días."
  - id: c
    text:
      es: "De un mes, porque el plazo del depósito temporal se cuenta por meses naturales."
  - id: d
    correct: true
    text:
      es: "De 10 días, porque deben incluirse en un régimen o reexportarse antes de que transcurran 90 días."
  explanation:
    es: "El plazo es de 90 días: si ya han pasado 80, quedan 10. Con 120 días de plazo quedarían 40, y con 180 días, 100, pero el artículo no fija esas cifras. Tampoco se cuenta por meses naturales: el texto habla de 90 días."
  citation: "art. 149 CAU"
  difficulty: 1
  tags:
  - "depósito temporal"
  - "plazo"
  - "cómputo"
# anchor: celex-32013r0952-art-149
- id: m03-l20-q0107
  prompt:
    es: "De acuerdo con el artículo 149 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el fin del depósito temporal:"
  options:
  - id: a
    text:
      es: "Las mercancías pueden permanecer en depósito temporal mientras no se solicite su levante, sin plazo máximo."
  - id: b
    text:
      es: "Las mercancías deben incluirse en un régimen aduanero antes de que transcurran 90 días, sin que la reexportación sea una alternativa."
  - id: c
    correct: true
    text:
      es: "Las mercancías deben incluirse en un régimen aduanero o reexportarse antes de que transcurran 90 días."
  - id: d
    text:
      es: "Las mercancías deben reexportarse antes de que transcurran 90 días, sin que puedan incluirse en un régimen aduanero."
  explanation:
    es: "Las mercancías en depósito temporal se incluyen en un régimen aduanero o se reexportan antes de que transcurran 90 días. Hay plazo máximo, que no depende del levante. Y ambas salidas son alternativas: no se excluye ni la reexportación ni la inclusión en un régimen."
  citation: "art. 149 CAU"
  difficulty: 2
  tags:
  - "depósito temporal"
  - "plazo"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0108
  prompt:
    es: "El 3 de mayo de 2027 se presentan en aduana unas mercancías no pertenecientes a la Unión, y el 20 de mayo de 2027 se incluyen en el régimen de despacho a libre práctica. Conforme al artículo 5, apartado 17, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿en qué período están en depósito temporal?"
  options:
  - id: a
    text:
      es: "Entre su entrada en el territorio aduanero y el 3 de mayo de 2027, hasta que se presentan en aduana."
  - id: b
    correct: true
    text:
      es: "Entre el 3 de mayo de 2027 y el 20 de mayo de 2027, desde su presentación en aduana hasta su inclusión en un régimen aduanero."
  - id: c
    text:
      es: "Desde el 20 de mayo de 2027, cuando se incluyen en el régimen, hasta que se concede el levante."
  - id: d
    text:
      es: "Entre el 3 de mayo de 2027 y la fecha en que se pague la deuda aduanera que haya nacido."
  explanation:
    es: "El depósito temporal va de la presentación en aduana a la inclusión en un régimen o la reexportación: aquí, del 3 al 20 de mayo de 2027. Antes de la presentación las mercancías aún no están en depósito temporal. Desde el 20 de mayo ya están incluidas en un régimen. Y el pago de la deuda no marca el fin de la situación."
  citation: "art. 5.17 CAU"
  difficulty: 2
  tags:
  - "depósito temporal"
  - "definiciones"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0109
  prompt:
    es: "De acuerdo con el artículo 158, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, todas las mercancías que vayan a incluirse en un régimen aduanero, salvo el régimen de zona franca, serán objeto de:"
  options:
  - id: a
    correct: true
    text:
      es: "Una declaración en aduana apropiada para el régimen concreto de que se trate."
  - id: b
    text:
      es: "Una declaración sumaria de entrada presentada antes de su llegada al territorio aduanero."
  - id: c
    text:
      es: "Una declaración de depósito temporal que contenga los datos necesarios para su inclusión."
  - id: d
    text:
      es: "Una autorización previa de las autoridades aduaneras para cada operación concreta."
  explanation:
    es: "Las mercancías que van a incluirse en un régimen, salvo en zona franca, son objeto de una declaración en aduana apropiada para el régimen. La declaración sumaria de entrada y la de depósito temporal son actos distintos, previos a esa inclusión. Y el artículo no exige una autorización previa para cada operación."
  citation: "art. 158.1 CAU"
  difficulty: 1
  tags:
  - "declaración en aduana"
  - "regímenes"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0110
  prompt:
    es: "De acuerdo con el artículo 158, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la declaración en aduana de las mercancías que vayan a incluirse en un régimen aduanero:"
  options:
  - id: a
    correct: true
    text:
      es: "Es obligatoria para todas las mercancías que vayan a incluirse en un régimen aduanero, salvo en el régimen de zona franca."
  - id: b
    text:
      es: "Es obligatoria para todas las mercancías que vayan a incluirse en un régimen aduanero, salvo en el régimen de tránsito de la Unión."
  - id: c
    text:
      es: "Es obligatoria para todas las mercancías que vayan a incluirse en un régimen aduanero, salvo en el régimen de exportación."
  - id: d
    text:
      es: "Es obligatoria para todas las mercancías que vayan a incluirse en un régimen aduanero, sin que exista ninguna excepción."
  explanation:
    es: "La única excepción del artículo 158.1 es el régimen de zona franca. Ni el tránsito de la Unión ni la exportación están exentos: el artículo 158.3 habla incluso de mercancías declaradas para la exportación o el tránsito. Y no es cierto que no exista ninguna excepción."
  citation: "art. 158.1 CAU"
  difficulty: 2
  tags:
  - "declaración en aduana"
  - "regímenes"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0111
  prompt:
    es: "De acuerdo con el artículo 158, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en casos específicos, distintos de los mencionados en el artículo 6, apartado 3, podrá presentarse una declaración en aduana utilizando:"
  options:
  - id: a
    text:
      es: "Exclusivamente técnicas de tratamiento electrónico de datos, sin excepción alguna."
  - id: b
    correct: true
    text:
      es: "Medios alternativos a las técnicas de tratamiento electrónico de datos."
  - id: c
    text:
      es: "Medios alternativos a las técnicas electrónicas, con autorización previa de la Comisión en cada declaración."
  - id: d
    text:
      es: "Un documento de transporte electrónico, que sustituye siempre a la declaración en aduana."
  explanation:
    es: "En casos específicos puede utilizarse un medio alternativo a las técnicas de tratamiento electrónico de datos. No se impone siempre el medio electrónico. No se exige autorización de la Comisión para cada declaración: la Comisión determina los casos mediante actos delegados. Y el documento de transporte electrónico es una simplificación del tránsito, no un sustituto general."
  citation: "art. 158.2 CAU"
  difficulty: 2
  tags:
  - "declaración en aduana"
  - "medios alternativos"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0112
  prompt:
    es: "Según el artículo 158, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿puede presentarse una declaración en aduana en papel en un caso específico distinto de los mencionados en el artículo 6, apartado 3?"
  options:
  - id: a
    text:
      es: "No, porque la declaración en aduana debe presentarse siempre mediante técnicas de tratamiento electrónico de datos."
  - id: b
    text:
      es: "Sí, pero solo si la Comisión lo autoriza mediante un acto delegado para esa declaración concreta."
  - id: c
    correct: true
    text:
      es: "Sí, porque en casos específicos, distintos de los del artículo 6, apartado 3, puede utilizarse un medio alternativo al tratamiento electrónico."
  - id: d
    text:
      es: "No, porque los medios alternativos solo se admiten para las mercancías de la Unión declaradas para la exportación."
  explanation:
    es: "El artículo 158.2 admite medios alternativos al tratamiento electrónico en casos específicos distintos de los del artículo 6.3. No es cierto que el medio electrónico sea siempre obligatorio. La Comisión determina los casos de forma general mediante actos delegados, no autoriza cada declaración. Y la regla no se limita a mercancías de la Unión declaradas para la exportación."
  citation: "art. 158.2 CAU"
  difficulty: 2
  tags:
  - "declaración en aduana"
  - "medios alternativos"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0113
  prompt:
    es: "Según el artículo 158, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, las mercancías de la Unión declaradas para exportación, tránsito interno o perfeccionamiento pasivo están sujetas a vigilancia aduanera desde la admisión de la declaración hasta que:"
  options:
  - id: a
    correct: true
    text:
      es: "Salgan del territorio aduanero de la Unión, sean abandonadas en beneficio del Estado o destruidas, o se invalide la declaración en aduana."
  - id: b
    text:
      es: "Se conceda el levante de las mercancías, momento en que cesa la vigilancia aduanera."
  - id: c
    text:
      es: "Se presenten en la aduana de salida, aunque todavía no hayan salido del territorio aduanero de la Unión."
  - id: d
    text:
      es: "Se pague la deuda aduanera de exportación nacida con la declaración en aduana."
  explanation:
    es: "La vigilancia dura hasta que las mercancías salen del territorio, se abandonan en beneficio del Estado, se destruyen o se invalida la declaración. No termina con el levante, ni con la presentación en la aduana de salida, ni con el pago de la deuda."
  citation: "art. 158.3 CAU"
  difficulty: 2
  tags:
  - "declaración en aduana"
  - "vigilancia aduanera"
# anchor: celex-32013r0952-art-158
- id: m03-l20-q0114
  prompt:
    es: "Se admite el 7 de mayo de 2027 una declaración en aduana de exportación de mercancías de la Unión, que salen del territorio aduanero de la Unión el 12 de mayo de 2027. Conforme al artículo 158, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿durante qué período están sujetas a vigilancia aduanera?"
  options:
  - id: a
    text:
      es: "Solo hasta que se presentan en la aduana de salida, en una fecha anterior al 12 de mayo de 2027."
  - id: b
    correct: true
    text:
      es: "Desde el 7 de mayo de 2027 hasta el 12 de mayo de 2027, cuando salen del territorio aduanero de la Unión."
  - id: c
    text:
      es: "Desde que entran en la aduana de salida, antes del 7 de mayo de 2027, hasta el 12 de mayo de 2027, cuando salen."
  - id: d
    text:
      es: "Desde el 7 de mayo de 2027 hasta que transcurran 90 días desde la admisión de la declaración."
  explanation:
    es: "La vigilancia comienza al admitirse la declaración, el 7 de mayo de 2027, y dura hasta que las mercancías salen del territorio, el 12 de mayo de 2027. No termina en la presentación en la aduana de salida, ni empieza antes de la admisión. Y los 90 días son el plazo del depósito temporal, no de esta vigilancia."
  citation: "art. 158.3 CAU"
  difficulty: 2
  tags:
  - "declaración en aduana"
  - "vigilancia aduanera"
  - "cómputo"
# anchor: celex-32013r0952-art-159
- id: m03-l20-q0115
  prompt:
    es: "De acuerdo con el artículo 159, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, salvo que la legislación de la Unión disponga lo contrario, los Estados miembros determinarán:"
  options:
  - id: a
    text:
      es: "Únicamente las competencias, y no la localización, de las aduanas situadas en su territorio."
  - id: b
    text:
      es: "La localización de las aduanas, que ejercerán las competencias que fije la Comisión."
  - id: c
    correct: true
    text:
      es: "La localización y las competencias de las distintas aduanas situadas en su territorio."
  - id: d
    text:
      es: "Los tipos de los derechos de importación que apliquen las aduanas situadas en su territorio."
  explanation:
    es: "Los Estados miembros determinan tanto la localización como las competencias de sus aduanas, salvo que la legislación de la Unión disponga lo contrario. No se limitan a las competencias. Tampoco las fija la Comisión. Y los tipos de los derechos no los fijan los Estados miembros en este artículo."
  citation: "art. 159.1 CAU"
  difficulty: 1
  tags:
  - "aduanas competentes"
  - "Estados miembros"
# anchor: celex-32013r0952-art-159
- id: m03-l20-q0116
  prompt:
    es: "De acuerdo con el artículo 159, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, los Estados miembros se asegurarán de que se asigne a las aduanas un horario:"
  options:
  - id: a
    text:
      es: "Continuo de veinticuatro horas, con independencia de la naturaleza del tráfico, de las mercancías y del régimen aduanero."
  - id: b
    text:
      es: "Uniforme para todas las aduanas de la Unión, fijado por la Comisión mediante actos de ejecución."
  - id: c
    text:
      es: "Oficial, que cada operador puede ampliar previo pago de una tasa por las horas adicionales."
  - id: d
    correct: true
    text:
      es: "Oficial, razonable y adecuado, teniendo en cuenta la naturaleza del tráfico y de las mercancías y el régimen aduanero."
  explanation:
    es: "El horario ha de ser oficial, razonable y adecuado, según la naturaleza del tráfico, de las mercancías y el régimen aduanero. No es continuo de veinticuatro horas, ni uniforme y fijado por la Comisión, ni ampliable por el operador mediante una tasa."
  citation: "art. 159.2 CAU"
  difficulty: 2
  tags:
  - "aduanas competentes"
  - "horario"
# anchor: celex-32013r0952-art-159
- id: m03-l20-q0117
  prompt:
    es: "De acuerdo con el artículo 159, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, salvo disposición contraria, la aduana competente para incluir las mercancías en un régimen aduanero es la responsable del lugar en que:"
  options:
  - id: a
    text:
      es: "Tenga su domicilio el declarante que presenta la declaración."
  - id: b
    text:
      es: "Se haya celebrado el contrato de venta de las mercancías."
  - id: c
    text:
      es: "Se encuentre el almacén del destinatario final de las mercancías."
  - id: d
    correct: true
    text:
      es: "Las mercancías se presenten en aduana."
  explanation:
    es: "La aduana competente es la responsable del lugar en que las mercancías se presentan en aduana. No lo es la del domicilio del declarante, ni la del lugar de celebración de la venta, ni la del almacén del destinatario."
  citation: "art. 159.3 CAU"
  difficulty: 1
  tags:
  - "aduanas competentes"
# anchor: celex-32013r0952-art-159
- id: m03-l20-q0118
  prompt:
    es: "Unas mercancías no pertenecientes a la Unión se presentan en aduana en el puerto de Algeciras. El declarante tiene su domicilio en Madrid y el destinatario final en Bilbao. Sin que se disponga otra cosa, según el artículo 159, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿qué aduana es competente para incluirlas en un régimen aduanero?"
  options:
  - id: a
    text:
      es: "La responsable de Madrid, por ser el lugar del domicilio del declarante."
  - id: b
    text:
      es: "La responsable de Bilbao, por ser el lugar del destinatario final de las mercancías."
  - id: c
    correct: true
    text:
      es: "La responsable de Algeciras, por ser el lugar en que se presentan en aduana."
  - id: d
    text:
      es: "La que elija libremente el declarante entre las aduanas de cualquier Estado miembro."
  explanation:
    es: "La aduana competente es la responsable del lugar en que las mercancías se presentan en aduana, Algeciras. No cuenta el domicilio del declarante ni el del destinatario. Y el declarante no puede elegir libremente cualquier aduana: la regla fija una aduana."
  citation: "art. 159.3 CAU"
  difficulty: 1
  tags:
  - "aduanas competentes"
# anchor: celex-32013r0952-art-160
- id: m03-l20-q0119
  prompt:
    es: "De acuerdo con el artículo 160 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, se otorgan a la Comisión los poderes para adoptar actos delegados con el fin de determinar:"
  options:
  - id: a
    text:
      es: "Las aduanas competentes distintas de la responsable del lugar de presentación de las mercancías, incluidas las aduanas de entrada y de salida de las mercancías."
  - id: b
    correct: true
    text:
      es: "Los casos en que puede presentarse una declaración en aduana utilizando medios alternativos a las técnicas de tratamiento electrónico de datos."
  - id: c
    text:
      es: "Las normas de procedimiento relativas a la presentación de la declaración en aduana mediante medios alternativos."
  - id: d
    text:
      es: "El horario oficial que debe asignarse a las aduanas situadas en el territorio de cada Estado miembro."
  explanation:
    es: "El artículo 160 delega en la Comisión la determinación de los casos en que puede usarse un medio alternativo al electrónico. Las aduanas competentes distintas y las normas de procedimiento corresponden al artículo 161 y se adoptan mediante actos de ejecución. El horario lo aseguran los Estados miembros, según el artículo 159.2."
  citation: "art. 160 CAU"
  difficulty: 2
  tags:
  - "aduanas competentes"
  - "actos delegados"
# anchor: celex-32013r0952-art-233
- id: m03-l20-q0121
  prompt:
    es: "¿Qué permite el estatuto de expedidor autorizado que las autoridades aduaneras conceden, previa solicitud, según el artículo 233, apartado 4, letra a), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión?"
  options:
  - id: a
    text:
      es: "Poner fin al régimen de tránsito de la Unión en un lugar autorizado, sin presentar las mercancías en la aduana de destino."
  - id: b
    text:
      es: "Emplear un documento de transporte electrónico como declaración en aduana de despacho a libre práctica."
  - id: c
    correct: true
    text:
      es: "Incluir mercancías en el régimen de tránsito de la Unión sin presentarlas en aduana."
  - id: d
    text:
      es: "Constituir la garantía del régimen de tránsito con una cuantía reducida respecto del importe de la deuda."
  explanation:
    es: "El estatuto de expedidor autorizado permite al titular incluir mercancías en el régimen de tránsito de la Unión sin presentarlas en aduana. Poner fin al régimen en un lugar autorizado es el contenido del estatuto de destinatario autorizado. El documento de transporte electrónico es otra simplificación, referida al tránsito, no al despacho a libre práctica. Y reducir la garantía no es una de las simplificaciones del artículo."
  citation: "art. 233.4.a) CAU"
  difficulty: 2
  tags:
  - "tránsito"
  - "expedidor autorizado"
# anchor: celex-32013r0952-art-233
- id: m03-l20-q0122
  prompt:
    es: "De acuerdo con el artículo 233, apartado 4, letra b), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el estatuto de destinatario autorizado permite al titular de la autorización:"
  options:
  - id: a
    text:
      es: "Incluir mercancías en el régimen de tránsito de la Unión sin presentarlas en aduana."
  - id: b
    correct: true
    text:
