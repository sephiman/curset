- id: m11-l06-q13
  prompt:
    en: The snippet applies the mutation `age >= 18` to `age > 18`, runs two test suites against it, and compares
      `i >= 1` with `i > 1` for two values. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: 'tests with ages 10 and 30: mutant survives = true

        tests with ages 10, 18 and 30: mutant survives = false

        i >= 1 and i > 1 agree for i = 2: true

        i >= 1 and i > 1 agree for i = 1: false'
  - id: b
    text:
      en: 'tests with ages 10 and 30: mutant survives = false

        tests with ages 10, 18 and 30: mutant survives = false

        i >= 1 and i > 1 agree for i = 2: true

        i >= 1 and i > 1 agree for i = 1: false'
  - id: c
    text:
      en: 'tests with ages 10 and 30: mutant survives = true

        tests with ages 10, 18 and 30: mutant survives = true

        i >= 1 and i > 1 agree for i = 2: true

        i >= 1 and i > 1 agree for i = 1: false'
  - id: d
    text:
      en: 'tests with ages 10 and 30: mutant survives = true

        tests with ages 10, 18 and 30: mutant survives = false

        i >= 1 and i > 1 agree for i = 2: true

        i >= 1 and i > 1 agree for i = 1: true'
  explanation:
    en: The ages `10` and `30` give the same answer for both versions, so the mutant survives, and adding `18` makes
      them differ, so it is killed. The output where the first suite kills the mutant is wrong because `10` and
      `30` are on the same side of the boundary. The output where the second suite does not kill it is wrong because
      `age >= 18` is true and `age > 18` is false for `18`. The output with `true` for `i = 1` is wrong because
      `1 >= 1` is true and `1 > 1` is false.
  citation: pitest-basic-concepts#equivalent-mutations
