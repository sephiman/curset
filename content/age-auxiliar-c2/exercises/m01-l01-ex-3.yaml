type: quiz
variants:
# anchor: boe-a-1978-31229-art-37
- id: m01-l01-q077
  prompt:
    es: "¿Cuál de los siguientes derechos corresponde a la sección 2.ª del capítulo segundo del título I de la Constitución Española de 1978, De los derechos y deberes de los ciudadanos?"
  options:
  - id: a
    text:
      es: "El derecho de reunión pacífica y sin armas."
  - id: b
    correct: true
    text:
      es: "El derecho a la negociación colectiva laboral."
  - id: c
    text:
      es: "El derecho de asociación."
  - id: d
    text:
      es: "El derecho de petición individual y colectiva."
  explanation:
    es: "La negociación colectiva laboral del artículo 37.1 está en la sección 2.ª, que va de los artículos 30 a 38. El derecho de reunión (artículo 21), el de asociación (artículo 22) y el de petición (artículo 29) son derechos fundamentales de la sección 1.ª, de los artículos 15 a 29."
  citation: "art. 37.1 CE"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-39
- id: m01-l01-q078
  prompt:
    es: "Conforme al artículo 39.1 de la Constitución Española de 1978, primero del capítulo tercero, los poderes públicos aseguran la protección de la familia en el plano:"
  options:
  - id: a
    text:
      es: "Social, sanitario y educativo."
  - id: b
    text:
      es: "Económico, fiscal y jurídico."
  - id: c
    text:
      es: "Social, económico y religioso."
  - id: d
    correct: true
    text:
      es: "Social, económico y jurídico."
  explanation:
    es: "El artículo 39.1 asegura la protección social, económica y jurídica de la familia. Las otras tres combinaciones sustituyen uno de esos tres planos por el sanitario y educativo, el fiscal o el religioso."
  citation: "art. 39.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-41
- id: m01-l01-q079
  prompt:
    es: "Conforme al artículo 41 de la Constitución Española de 1978, los poderes públicos mantendrán, para todos los ciudadanos, un régimen público de:"
  options:
  - id: a
    text:
      es: "Seguros sociales gestionados por entidades privadas."
  - id: b
    correct: true
    text:
      es: "Seguridad Social."
  - id: c
    text:
      es: "Asistencia sanitaria gratuita y universal."
  - id: d
    text:
      es: "Previsión social complementaria obligatoria."
  explanation:
    es: "El artículo 41 manda mantener un régimen público de Seguridad Social para todos los ciudadanos. Los seguros privados no son un régimen público. La asistencia sanitaria es materia del artículo 43, que reconoce el derecho a la protección de la salud. La asistencia y prestaciones complementarias, según el propio artículo 41, serán libres, no obligatorias."
  citation: "art. 41 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-43
- id: m01-l01-q080
  prompt:
    es: "¿Cuál de los siguientes derechos reconoce el artículo 43 del capítulo tercero del título I de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El derecho a disfrutar de una vivienda digna y adecuada."
  - id: b
    text:
      es: "El derecho a un medio ambiente adecuado para el desarrollo de la persona."
  - id: c
    text:
      es: "El derecho a la defensa de los consumidores y usuarios."
  - id: d
    correct: true
    text:
      es: "El derecho a la protección de la salud."
  explanation:
    es: "El artículo 43 reconoce el derecho a la protección de la salud. La vivienda es el artículo 47, el medio ambiente el 45 y la defensa de los consumidores y usuarios el 51: los tres son mandatos del mismo capítulo, pero de otros artículos."
  citation: "art. 43 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-45
- id: m01-l01-q081
  prompt:
    es: "Conforme al artículo 45 de la Constitución Española de 1978, todos tienen el derecho a disfrutar de un medio ambiente adecuado para:"
  options:
  - id: a
    correct: true
    text:
      es: "El desarrollo de la persona."
  - id: b
    text:
      es: "La actividad económica de las empresas."
  - id: c
    text:
      es: "La conservación del patrimonio histórico y cultural."
  - id: d
    text:
      es: "El progreso social y económico de los pueblos de España."
  explanation:
    es: "El artículo 45.1 vincula el medio ambiente adecuado con el desarrollo de la persona, y añade el deber de conservarlo. La actividad económica de las empresas, el patrimonio histórico y cultural y el progreso social y económico son fines distintos de los que el apartado asigna a ese derecho."
  citation: "art. 45 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-47
- id: m01-l01-q082
  prompt:
    es: "¿Cuál de los siguientes derechos recoge el artículo 47 del capítulo tercero del título I de la Constitución Española de 1978, De los principios rectores de la política social y económica?"
  options:
  - id: a
    text:
      es: "El derecho a la protección de la salud."
  - id: b
    text:
      es: "La protección social, económica y jurídica de la familia."
  - id: c
    correct: true
    text:
      es: "El derecho a disfrutar de una vivienda digna y adecuada."
  - id: d
    text:
      es: "El régimen público de Seguridad Social."
  explanation:
    es: "El artículo 47 reconoce a los españoles el derecho a disfrutar de una vivienda digna y adecuada. La salud es el artículo 43, la familia el 39 y la Seguridad Social el 41."
  citation: "art. 47 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-51
- id: m01-l01-q083
  prompt:
    es: "Conforme al artículo 51.1 de la Constitución Española de 1978, los poderes públicos garantizarán la defensa de los consumidores y usuarios protegiendo, mediante procedimientos eficaces, su:"
  options:
  - id: a
    text:
      es: "Seguridad jurídica, su salud y su patrimonio personal."
  - id: b
    text:
      es: "Privacidad, su salud y sus legítimos intereses económicos."
  - id: c
    correct: true
    text:
      es: "Seguridad, su salud y sus legítimos intereses económicos."
  - id: d
    text:
      es: "Seguridad, sus ingresos y la estabilidad de los precios."
  explanation:
    es: "El artículo 51.1 protege la seguridad, la salud y los legítimos intereses económicos de los consumidores y usuarios. La opción que cambia seguridad por seguridad jurídica y salud por patrimonio personal altera dos elementos. La de la privacidad sustituye la seguridad. La de los ingresos y la estabilidad de los precios sustituye dos de los tres intereses protegidos."
  citation: "art. 51 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-49
- id: m01-l01-q084
  prompt:
    es: "Conforme al artículo 49.1 de la Constitución Española de 1978, en la redacción de la reforma de 2024, las personas con discapacidad ejercen los derechos previstos en el título I en condiciones de:"
  options:
  - id: a
    correct: true
    text:
      es: "Libertad e igualdad reales y efectivas."
  - id: b
    text:
      es: "Igualdad formal y no discriminación."
  - id: c
    text:
      es: "Autonomía y tutela reforzada por los poderes públicos."
  - id: d
    text:
      es: "Subsidiariedad y proporcionalidad."
  explanation:
    es: "El artículo 49.1, en la redacción de la reforma de 2024, dice que las personas con discapacidad ejercen los derechos del título I en condiciones de libertad e igualdad reales y efectivas. La igualdad meramente formal, la tutela reforzada y la subsidiariedad con proporcionalidad son fórmulas distintas de la que usa el artículo."
  citation: "art. 49.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q085
  prompt:
    es: "¿Qué materia regula el capítulo primero del título I de la Constitución Española de 1978, uno de los cinco en que se divide el título I?"
  options:
  - id: a
    text:
      es: "Los principios rectores de la política social y económica."
  - id: b
    text:
      es: "Las garantías de las libertades y derechos fundamentales."
  - id: c
    text:
      es: "Los derechos y libertades de los ciudadanos."
  - id: d
    correct: true
    text:
      es: "La condición de los españoles y los extranjeros."
  explanation:
    es: "El capítulo primero se titula «De los españoles y los extranjeros» y comprende los artículos 11 a 13. Los principios rectores son el capítulo tercero, las garantías el cuarto y los derechos y libertades el segundo."
  citation: "art. 13.2 CE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q016
  prompt:
    es: "Según el artículo 53.1 de la Constitución Española de 1978, el ejercicio de los derechos y libertades reconocidos en el capítulo segundo del título I solo podrá regularse:"
  options:
  - id: a
    text:
      es: "Por ley o por reglamento, que en todo caso deberán respetar su contenido esencial."
  - id: b
    text:
      es: "Por ley, que podrá limitar su contenido esencial cuando lo exija el interés general."
  - id: c
    text:
      es: "Por ley, sin otro límite que el respeto a los tratados internacionales."
  - id: d
    correct: true
    text:
      es: "Por ley, que en todo caso deberá respetar su contenido esencial."
  explanation:
    es: "El artículo 53.1 dice: «Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades». El reglamento queda excluido. El contenido esencial es un límite absoluto para la ley, que no puede reducirlo ni por razones de interés general."
  citation: "art. 53.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q017
  prompt:
    es: "¿Cuál de los siguientes derechos, recogido en la sección 2.ª del capítulo segundo del título I, es también susceptible de recurso de amparo según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El derecho a la objeción de conciencia."
  - id: b
    text:
      es: "El derecho a la propiedad privada y a la herencia."
  - id: c
    text:
      es: "El derecho al trabajo y a la libre elección de profesión u oficio."
  - id: d
    text:
      es: "La libertad de empresa en el marco de la economía de mercado."
  explanation:
    es: "El artículo 53.2 limita el amparo al artículo 14 y a la sección 1.ª, y añade: «Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30». La propiedad privada, el derecho al trabajo y la libertad de empresa están en la sección 2.ª y no tienen amparo."
  citation: "art. 53.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-81
- id: m01-l01-q018
  prompt:
    es: "Según el artículo 81.2 de la Constitución Española de 1978, ¿qué exige la aprobación, modificación o derogación de las leyes orgánicas, como la que desarrolla un derecho fundamental?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de cada una de las Cámaras, en una votación final sobre el conjunto del proyecto."
  - id: b
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    text:
      es: "Mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto."
  explanation:
    es: "El artículo 81.2 exige «mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto». La mayoría absoluta se pide solo al Congreso, no a las dos Cámaras. Los tres quintos son la mayoría de la reforma constitucional ordinaria. La mayoría simple es la de las leyes ordinarias."
  citation: "art. 81.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q088
  prompt:
    es: "Conforme al artículo 53.2 de la Constitución Española de 1978, cualquier ciudadano puede recabar la tutela de los derechos del artículo 14 y de la sección 1.ª ante los Tribunales ordinarios por un procedimiento basado en los principios de:"
  options:
  - id: a
    text:
      es: "Celeridad y gratuidad."
  - id: b
    correct: true
    text:
      es: "Preferencia y sumariedad."
  - id: c
    text:
      es: "Oralidad e inmediación."
  - id: d
    text:
      es: "Preferencia y contradicción plena."
  explanation:
    es: "El artículo 53.2 habla de un procedimiento basado en los principios de preferencia y sumariedad. Celeridad y gratuidad, u oralidad e inmediación, son principios que el artículo no atribuye a este procedimiento. La mezcla de preferencia con contradicción plena cambia uno de los dos principios: la sumariedad implica justamente un debate reducido."
  citation: "art. 53.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q089
  prompt:
    es: "¿Qué derechos pueden tutelarse, según el artículo 53.2 de la Constitución Española de 1978, ante los Tribunales ordinarios por un procedimiento preferente y sumario y, en su caso, mediante recurso de amparo?"
  options:
  - id: a
    text:
      es: "Todos los del capítulo segundo, sin distinción entre secciones."
  - id: b
    text:
      es: "Los del capítulo segundo y los principios rectores del capítulo tercero."
  - id: c
    correct: true
    text:
      es: "Los del artículo 14 y los de la sección 1.ª del capítulo segundo."
  - id: d
    text:
      es: "Solo los de la sección 2.ª del capítulo segundo."
  explanation:
    es: "El artículo 53.2 limita esa vía al artículo 14 y a la sección 1.ª, es decir, a los artículos 14 a 29, más la objeción de conciencia del artículo 30 en el recurso de amparo. Esa vía deja fuera la sección 2.ª y, por tanto, el capítulo segundo entero. Los principios rectores del capítulo tercero tienen un régimen propio en el apartado 3: solo se alegan ante la Jurisdicción ordinaria según lo que dispongan las leyes."
  citation: "art. 53.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q091
  prompt:
    es: "Conforme al artículo 53.3 de la Constitución Española de 1978, los principios reconocidos en el capítulo tercero solo podrán ser alegados ante la Jurisdicción ordinaria:"
  options:
  - id: a
    correct: true
    text:
      es: "De acuerdo con lo que dispongan las leyes que los desarrollen."
  - id: b
    text:
      es: "Mediante recurso de amparo ante el Tribunal Constitucional."
  - id: c
    text:
      es: "Directamente, sin necesidad de ley que los desarrolle."
  - id: d
    text:
      es: "Con los requisitos que fije cada Comunidad Autónoma."
  explanation:
    es: "El artículo 53.3 condiciona la alegación ante la Jurisdicción ordinaria a lo que dispongan las leyes que desarrollan esos principios. El recurso de amparo no se aplica a ellos: el artículo 53.2 lo reserva al artículo 14, a la sección 1.ª y a la objeción de conciencia. Alegarlos sin ley contradice el «solo». Remitirlo a lo que fije cada Comunidad Autónoma sustituye la ley que los desarrolla por otra fuente."
  citation: "art. 53.3 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q092
  prompt:
    es: "¿Qué materia regula el capítulo cuarto del título I de la Constitución Española de 1978, uno de los cinco en que se divide el título I?"
  options:
  - id: a
    text:
      es: "Los principios rectores de la política social y económica."
  - id: b
    text:
      es: "La suspensión de los derechos y libertades."
  - id: c
    correct: true
    text:
      es: "Las garantías de las libertades y derechos fundamentales."
  - id: d
    text:
      es: "La condición de los españoles y los extranjeros."
  explanation:
    es: "El capítulo cuarto, De las garantías de las libertades y derechos fundamentales, comprende los artículos 53 y 54. Los principios rectores son el capítulo tercero, la suspensión de los derechos el quinto y la condición de españoles y extranjeros el primero."
  citation: "art. 53.1 CE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-81
- id: m01-l01-q093
  prompt:
    es: "El desarrollo de los derechos fundamentales y de las libertades públicas se hace, conforme al artículo 81.1 de la Constitución Española de 1978, mediante:"
  options:
  - id: a
    text:
      es: "Una ley ordinaria aprobada por mayoría simple."
  - id: b
    correct: true
    text:
      es: "Una ley orgánica."
  - id: c
    text:
      es: "Un decreto legislativo del Gobierno."
  - id: d
    text:
      es: "Un real decreto-ley convalidado por el Congreso."
  explanation:
    es: "El artículo 81.1 dice que son leyes orgánicas las relativas al desarrollo de los derechos fundamentales y de las libertades públicas. Una ley ordinaria con mayoría simple no cumple la exigencia. El decreto legislativo y el real decreto-ley son normas del Gobierno, y el desarrollo de estos derechos requiere una ley orgánica, con la mayoría absoluta del Congreso del artículo 81.2."
  citation: "art. 81.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q116
  prompt:
    es: "Conforme al artículo 53.1 de la Constitución Española de 1978, los derechos y libertades reconocidos en el capítulo segundo del título I vinculan:"
  options:
  - id: a
    text:
      es: "Solo a la Administración y a los Tribunales."
  - id: b
    correct: true
    text:
      es: "A todos los poderes públicos."
  - id: c
    text:
      es: "Únicamente a las Cortes Generales y al Gobierno."
  - id: d
    text:
      es: "Solo a los poderes públicos del Estado, no a los autonómicos."
  explanation:
    es: "El artículo 53.1 dice que esos derechos vinculan a todos los poderes públicos. Las demás opciones recortan el «todos»: dejan fuera a las Cortes, a la Administración o a los poderes de las Comunidades Autónomas."
  citation: "art. 53.1 CE"
  difficulty: 1
  tags:
  - "efecto"
