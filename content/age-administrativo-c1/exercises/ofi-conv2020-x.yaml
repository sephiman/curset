        Sección nivel 20 en la Subdirección General de Recursos Humanos del Ministerio de Agricultura, Pesca y Alimentación,
        siendo éste su primer puesto de trabajo en la Administración. El primer día de trabajo la Subdirectora General de
        Recursos Humanos le informa que, antes de asignarle unas tareas concretas, le gustaría que pasase una semana en cada
        uno de los servicios de la Subdirección para tener una visión general de la actividad que lleva a cabo la Unidad,
