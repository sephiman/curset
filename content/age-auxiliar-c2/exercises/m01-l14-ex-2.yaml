# anchor: boe-a-2015-11719-art-18
- id: m01-l14-q121
  prompt:
    es: "De acuerdo con el artículo 18.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, para la promoción interna los funcionarios deberán:"
  options:
  - id: a
    text:
      es: "Poseer los requisitos de ingreso, tener al menos cinco años de servicio activo en el inferior Subgrupo y superar las pruebas selectivas."
  - id: b
    correct: true
    text:
      es: "Poseer los requisitos de ingreso, tener al menos dos años de servicio activo en el inferior Subgrupo y superar las pruebas selectivas."
  - id: c
    text:
      es: "Poseer los requisitos de ingreso, tener al menos dos años de servicio activo en el inferior Subgrupo y superar un curso de formación."
  - id: d
    text:
      es: "Tener al menos dos años de servicio activo en el inferior Subgrupo y grado personal consolidado, sin superar pruebas selectivas."
  explanation:
    es: "El artículo 18.2 exige «poseer los requisitos exigidos para el ingreso, tener una antigüedad de, al menos, dos años de servicio activo en el inferior Subgrupo […] y superar las correspondientes pruebas selectivas». La antigüedad es de dos años, no de cinco. Lo que se supera son pruebas selectivas, no un curso de formación. El precepto no pide grado consolidado ni prescinde de las pruebas."
  citation: "art. 18.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-18
- id: m01-l14-q123
  prompt:
    es: "De acuerdo con el artículo 18.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de los requisitos de ingreso y de la antigüedad mínima, el funcionario que aspira a la promoción interna debe:"
  options:
  - id: a
    text:
      es: "Tener consolidado un grado personal dentro del intervalo del Cuerpo de destino."
  - id: b
    text:
      es: "Haber desempeñado un puesto de libre designación durante un año."
  - id: c
    correct: true
    text:
      es: "Superar las correspondientes pruebas selectivas."
  - id: d
    text:
      es: "Contar con informe favorable del Subsecretario de su Departamento."
  explanation:
    es: "El tercer requisito del artículo 18.2 es «superar las correspondientes pruebas selectivas». El precepto no exige grado personal consolidado, un puesto previo de libre designación ni un informe del Subsecretario."
  citation: "art. 18.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-73
- id: m01-l14-q124
  prompt:
    es: "De acuerdo con el artículo 73 del Real Decreto 364/1995, de 10 de marzo, la promoción interna consiste en el ascenso desde Cuerpos o Escalas de un Grupo de titulación:"
  options:
  - id: a
    correct: true
    text:
      es: "A otro del inmediato superior, o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  - id: b
    text:
      es: "A cualquier otro superior, o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  - id: c
    text:
      es: "A otro del inmediato superior, sin incluir el acceso a Cuerpos o Escalas del mismo Grupo."
  - id: d
    text:
      es: "A otro del inmediato superior, o en el acceso a puestos de nivel superior dentro del mismo Cuerpo."
  explanation:
    es: "El artículo 73 dice: «La promoción interna consiste en el ascenso desde Cuerpos o Escalas de un Grupo de titulación a otro del inmediato superior o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación». El ascenso es al Grupo inmediato superior, no a cualquiera. El acceso a otro Cuerpo del mismo Grupo sí está incluido. Subir a un puesto de nivel superior en el mismo Cuerpo es provisión, no promoción interna."
  citation: "art. 73 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-73
- id: m01-l14-q125
  prompt:
    es: "Un funcionario de un Cuerpo de un Grupo de titulación participa en pruebas para acceder a otro Cuerpo del mismo Grupo de titulación. ¿Es promoción interna en la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "No, porque solo es promoción interna el ascenso al Grupo inmediato superior."
  - id: b
    text:
      es: "No, porque el paso a otro Cuerpo del mismo Grupo se hace por concurso de provisión."
  - id: c
    text:
      es: "Sí, pero solo si el nuevo Cuerpo está adscrito al mismo Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Sí, porque incluye el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  explanation:
    es: "El artículo 73 del Real Decreto 364/1995 define la promoción interna como el ascenso al Grupo inmediato superior «o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación». El acceso a otro Cuerpo del mismo Grupo es promoción interna. El concurso de provisión adjudica puestos, no da acceso a otro Cuerpo. El precepto no exige que el nuevo Cuerpo esté en el mismo Departamento."
  citation: "art. 73 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-76
- id: m01-l14-q126
  prompt:
    es: "Según el artículo 76 del Real Decreto 364/1995, de 10 de marzo, ¿dónde debe tenerse la antigüedad mínima de dos años exigida para participar en pruebas de promoción interna?"
  options:
  - id: a
    text:
      es: "En el puesto de trabajo que desempeñe el funcionario."
  - id: b
    correct: true
    text:
      es: "En el Cuerpo o Escala a que pertenezca el funcionario."
  - id: c
    text:
      es: "En el Departamento que convoca las pruebas selectivas."
  - id: d
    text:
      es: "En cualquier Cuerpo de la Administración General del Estado."
  explanation:
    es: "El artículo 76 exige «una antigüedad de, al menos, dos años en el Cuerpo o Escala a que pertenezcan». La antigüedad se mide en el Cuerpo o Escala propio, no en el puesto, en el Departamento convocante ni en cualquier Cuerpo de la Administración."
  citation: "art. 76 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-76
- id: m01-l14-q127
  prompt:
    es: "De acuerdo con el artículo 76 del Real Decreto 364/1995, de 10 de marzo, la antigüedad de al menos dos años exigida para participar en pruebas de promoción interna debe tenerse:"
  options:
  - id: a
    text:
      es: "El día de la publicación de la convocatoria en el Boletín Oficial del Estado."
  - id: b
    correct: true
    text:
      es: "El día de la finalización del plazo de presentación de solicitudes."
  - id: c
    text:
      es: "El día de celebración del primer ejercicio de la fase de oposición."
  - id: d
    text:
      es: "El día de la toma de posesión en el Cuerpo o Escala de destino."
  explanation:
    es: "El artículo 76 fija la antigüedad «el día de la finalización del plazo de presentación de solicitudes de participación». La publicación de la convocatoria, el primer ejercicio y la toma de posesión son otros momentos del proceso que el precepto no utiliza."
  citation: "art. 76 RD 364/1995"
  difficulty: 1
  tags:
  - "fecha"
  - "requisito"
# anchor: boe-a-2015-11719-art-93
- id: m01-l14-q135
  prompt:
    es: "Según el artículo 93.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes es la responsabilidad de quienes inducen a otros a cometer una falta disciplinaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La misma responsabilidad en que incurren quienes realizan esos actos o conductas."
  - id: b
    text:
      es: "La de una falta de grado inmediatamente inferior al de la falta cometida."
  - id: c
    text:
      es: "Ninguna, salvo que participen ellos mismos en la ejecución de los actos."
  - id: d
    text:
      es: "La misma responsabilidad, pero solo si la falta inducida es muy grave."
  explanation:
    es: "Quienes inducen a otros a cometer una falta «incurrirán en la misma responsabilidad que éstos». El artículo no rebaja la falta un grado ni exige que el inductor participe en la ejecución. Tampoco limita la regla a las faltas muy graves: vale para cualquier falta disciplinaria."
  citation: "art. 93.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-93
- id: m01-l14-q136
  prompt:
    es: "De acuerdo con el artículo 93.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, incurren en responsabilidad quienes encubran:"
  options:
  - id: a
    correct: true
    text:
      es: "Las faltas consumadas muy graves o graves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: b
    text:
      es: "Las faltas consumadas de cualquier clase, incluidas las leves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: c
    text:
      es: "Las faltas consumadas muy graves o graves, aunque de ello no se derive daño alguno para la Administración."
  - id: d
    text:
      es: "Las faltas muy graves, consumadas o intentadas, cuando de ello se derive un daño para los ciudadanos."
  explanation:
    es: "El artículo 93.3 exige dos cosas: que la falta encubierta sea consumada y muy grave o grave, y que del encubrimiento «se derive daño grave para la Administración o los ciudadanos». Encubrir una falta leve no entra. Sin daño grave tampoco hay responsabilidad. La falta intentada no figura: el texto habla de faltas consumadas."
  citation: "art. 93.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-1
- id: m01-l14-q137
  prompt:
    es: "De acuerdo con su artículo 1, el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, aprobado por el Real Decreto 33/1986, de 10 de enero, se aplica:"
  options:
  - id: a
    text:
      es: "Al personal funcionario y laboral de todas las Administraciones públicas."
  - id: b
    correct: true
    text:
      es: "Al personal funcionario comprendido en el artículo 1.1 de la Ley 30/1984."
  - id: c
    text:
      es: "Al personal laboral de la Administración del Estado y de sus organismos."
  - id: d
    text:
      es: "Al personal funcionario y laboral comprendido en el artículo 1.1 de la Ley 30/1984."
  explanation:
    es: "El artículo 1 lo aplica «al personal funcionario comprendido en el artículo 1, 1, de la Ley 30/1984». El personal laboral queda fuera, tanto el de la Administración del Estado como el del mismo artículo 1.1. Tampoco alcanza a todas las Administraciones públicas: su título lo ciñe a los funcionarios de la Administración del Estado."
  citation: "art. 1 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q138
  prompt:
    es: "Un funcionario se niega abiertamente a cumplir la orden de su superior de firmar un acuerdo que constituye una infracción manifiesta del Ordenamiento jurídico. Según el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Comete la falta muy grave de desobediencia abierta, que no admite excepciones."
  - id: b
    text:
      es: "Comete la falta muy grave de desobediencia abierta, salvo que hubiera recurrido la orden."
  - id: c
    correct: true
    text:
      es: "No comete la falta muy grave de desobediencia abierta, que exceptúa esas órdenes."
  - id: d
    text:
      es: "Comete la falta muy grave de desobediencia abierta, salvo que avisara por escrito."
  explanation:
    es: "La desobediencia abierta a un superior es falta muy grave «salvo que constituyan infracción manifiesta del Ordenamiento jurídico». La orden del caso es de ese tipo, así que la negativa no encaja en esa falta. Decir que no admite excepciones contradice el propio precepto. Recurrir la orden o avisar por escrito no son condiciones que el artículo exija."
  citation: "art. 95.2.i) TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q139
  prompt:
    es: "De acuerdo con el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el incumplimiento de las normas sobre incompatibilidades es falta muy grave:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando ello dé lugar a una situación de incompatibilidad."
  - id: b
    text:
      es: "En todo caso, se produzca o no una situación de incompatibilidad."
  - id: c
    text:
      es: "Cuando se perciban retribuciones por los dos puestos o actividades."
  - id: d
    text:
      es: "Cuando persista después de un requerimiento de la Administración."
  explanation:
    es: "La letra n) del artículo 95.2 exige que el incumplimiento «dé lugar a una situación de incompatibilidad». No lo califica de muy grave en todo caso. Tampoco pide que se cobre por los dos puestos ni un requerimiento previo de la Administración."
  citation: "art. 95.2.n) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q140
  prompt:
    es: "Según el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la adopción de acuerdos manifiestamente ilegales es falta muy grave cuando:"
  options:
  - id: a
    text:
      es: "Se adopten en un órgano colegiado con el voto favorable del funcionario."
  - id: b
    text:
      es: "Causen cualquier perjuicio, aunque sea leve, a la Administración o a los ciudadanos."
  - id: c
    text:
      es: "Se repitan en un período de un año después de una advertencia."
  - id: d
    correct: true
    text:
      es: "Causen perjuicio grave a la Administración o a los ciudadanos."
  explanation:
    es: "La letra d) del artículo 95.2 exige que los acuerdos «causen perjuicio grave a la Administración o a los ciudadanos». Un perjuicio leve no basta. El precepto no habla de órganos colegiados ni de votos, y tampoco pide repetición ni advertencia previa."
  citation: "art. 95.2.d) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q142
  prompt:
    es: "¿En qué procesos electorales es falta muy grave violar la imparcialidad utilizando las facultades atribuidas al empleado público para influir en ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "En los de cualquier naturaleza y ámbito."
  - id: b
    text:
      es: "Solo en los de ámbito estatal o autonómico."
  - id: c
    text:
      es: "Solo en las elecciones a las Cortes Generales."
  - id: d
    text:
      es: "Solo en los políticos, no en los sindicales."
  explanation:
    es: "La letra h) del artículo 95.2 habla de influir «en procesos electorales de cualquier naturaleza y ámbito». No se limita a un ámbito territorial ni a las elecciones a las Cortes Generales. Tampoco excluye los procesos sindicales: cualquier naturaleza los incluye."
  citation: "art. 95.2.h) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q144
  prompt:
    es: "¿Cuál de las siguientes conductas es falta muy grave según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: b
    text:
      es: "Las conductas constitutivas de delito doloso relacionadas con el servicio."
  - id: c
    correct: true
    text:
      es: "El incumplimiento de la obligación de atender los servicios esenciales en caso de huelga."
  - id: d
    text:
      es: "La tolerancia de los superiores respecto de las faltas graves de sus subordinados."
  explanation:
    es: "La letra m) del artículo 95.2 tipifica como muy grave «el incumplimiento de la obligación de atender los servicios esenciales en caso de huelga». Las otras tres conductas no figuran en ese artículo. Son faltas graves del artículo 7.1 del Reglamento de Régimen Disciplinario de 1986: el atentado grave a la dignidad, el delito doloso relacionado con el servicio y la tolerancia de los superiores."
  citation: "art. 95.2.m) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m01-l14-q148
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave la tolerancia de los superiores respecto de la comisión, por sus subordinados, de:"
  options:
  - id: a
    correct: true
    text:
      es: "Faltas muy graves o graves."
  - id: b
    text:
      es: "Faltas de cualquier clase, también leves."
  - id: c
    text:
      es: "Faltas leves, cuando se repitan."
  - id: d
    text:
      es: "Faltas muy graves, pero no graves."
  explanation:
    es: "La letra d) del artículo 7.1 habla de la tolerancia «respecto de la comisión de faltas muy graves o graves de sus subordinados». No incluye las leves, ni siquiera cuando se repiten. Y no se limita a las muy graves: también cuentan las graves."
  citation: "art. 7.1.d) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m01-l14-q149
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave el incumplimiento injustificado de la jornada de trabajo que, acumulado, suponga un mínimo de:"
  options:
  - id: a
    text:
      es: "Cinco horas al mes."
  - id: b
    text:
      es: "Diez horas al trimestre."
  - id: c
    text:
      es: "Quince horas al mes."
  - id: d
    correct: true
    text:
      es: "Diez horas al mes."
  explanation:
    es: "La letra l) del artículo 7.1 fija el umbral en «un mínimo de diez horas al mes». Cinco o quince horas no son la cifra del texto, y el período de referencia es el mes, no el trimestre."
  citation: "art. 7.1.l) RD 33/1986"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1986-1216-art-8
- id: m01-l14-q150
  prompt:
    es: "En marzo de 2027, un funcionario de un ministerio acumula seis horas de incumplimiento injustificado de su horario, sin otra circunstancia. Según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado:"
  options:
  - id: a
    text:
      es: "Comete falta grave, porque todo incumplimiento injustificado de la jornada lo es."
  - id: b
    correct: true
    text:
      es: "Comete falta leve, porque no llega al mínimo de la falta grave."
  - id: c
    text:
      es: "No comete falta, porque el incumplimiento no llega a diez horas en el mes."
  - id: d
    text:
      es: "Comete falta muy grave, porque equivale al abandono del servicio público."
  explanation:
    es: "El incumplimiento injustificado de la jornada es falta grave cuando suma al menos diez horas al mes (artículo 7.1.l). Seis horas no llegan. Entonces se aplica la letra a) del artículo 8: es falta leve «el incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave». No queda sin falta por no llegar a diez horas. Tampoco equivale al abandono del servicio."
  citation: "art. 8.a) RD 33/1986"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-1986-1216-art-8
- id: m01-l14-q153
  prompt:
    es: "¿Cuál de las siguientes conductas es falta leve según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La grave desconsideración con los superiores, compañeros o subordinados."
  - id: b
    text:
      es: "La grave falta de consideración con los administrados."
  - id: c
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: d
    correct: true
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  explanation:
    es: "La letra c) del artículo 8 tipifica como leve «la incorrección con el público, superiores, compañeros o subordinados». La grave desconsideración con superiores, compañeros o subordinados, la grave falta de consideración con los administrados y el atentado grave a la dignidad son faltas graves del artículo 7.1, letras e), o) y ñ)."
  citation: "art. 8.c) RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-8
- id: m01-l14-q154
  prompt:
    es: "De acuerdo con el artículo 8 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, el incumplimiento de los deberes y obligaciones del funcionario es falta leve:"
  options:
  - id: a
    text:
      es: "En todo caso, sea cual sea la gravedad del incumplimiento."
  - id: b
    text:
      es: "Cuando se produzca por primera vez en un período de un año."
  - id: c
    correct: true
    text:
      es: "Siempre que no deba ser calificado como falta muy grave o grave."
  - id: d
    text:
      es: "Siempre que no cause perjuicio económico a la Administración."
  explanation:
    es: "La letra e) del artículo 8 es una cláusula residual: el incumplimiento de deberes es leve «siempre que no deban ser calificados como falta muy grave o grave». No es leve en todo caso. El artículo no cuenta las veces en un año ni mide el perjuicio económico."
  citation: "art. 8.e) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m01-l14-q185
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: b
    correct: true
    text:
      es: "El abuso de autoridad en el ejercicio del cargo."
  - id: c
    text:
      es: "El descuido o negligencia en el ejercicio de sus funciones."
  - id: d
    text:
      es: "La falta de asistencia injustificada de un día."
  explanation:
    es: "El abuso de autoridad en el ejercicio del cargo es la falta grave de la letra b) del artículo 7.1. La incorrección, el descuido o negligencia y la falta de asistencia de un día son faltas leves del artículo 8."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-20
- id: m01-l14-q186
  prompt:
    es: "Según el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en cuánto prescribe la falta de incumplir los plazos de procedimiento en materia de incompatibilidades sin mantener una situación de incompatibilidad?"
  options:
  - id: a
    text:
      es: "Al mes."
  - id: b
    text:
      es: "A los seis años."
  - id: c
    correct: true
    text:
      es: "A los dos años."
  - id: d
    text:
      es: "A los seis meses."
  explanation:
    es: "Esa conducta es falta grave según el artículo 7.1.k), y el artículo 20.1 dice que las faltas graves prescriben a los dos años. El mes es el plazo de las faltas leves y los seis años el de las muy graves. Los seis meses son el plazo del Estatuto Básico del Empleado Público para las leves, no el de este Reglamento."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-95
- id: m01-l14-q188
  prompt:
    es: "Según el artículo 95.2.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de toda actuación que suponga discriminación, es falta muy grave:"
  options:
  - id: a
    text:
      es: "La grave falta de consideración con los administrados."
  - id: b
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: c
    text:
      es: "La grave perturbación del servicio."
  - id: d
    correct: true
    text:
      es: "El acoso moral y sexual, y el acoso por razón de sexo o de origen racial o étnico."
  explanation:
    es: "La letra b) del artículo 95.2 incluye, junto a la discriminación, el acoso por razón de sexo, de origen racial o étnico y otras causas, y el acoso moral y sexual. La falta de consideración con los administrados y la perturbación del servicio son faltas graves del Reglamento de 1986, y la incorrección es una falta leve de ese mismo Reglamento."
  citation: "art. 95.2.b) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m01-l14-q190
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La falta de obediencia debida a los superiores y autoridades."
  - id: b
    text:
      es: "El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave."
  - id: c
    text:
      es: "El incumplimiento de los deberes del funcionario, si no es falta muy grave o grave."
  - id: d
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  explanation:
    es: "La falta de obediencia debida a los superiores y autoridades es la falta grave de la letra a) del artículo 7.1. Las otras tres conductas son faltas leves del artículo 8."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
