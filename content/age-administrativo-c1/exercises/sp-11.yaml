# anchor: boe-a-2003-21614-art-47
- id: q17
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.5 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede el Injuve comprometer las tres anualidades de la subvención a la Federación Brújula?"
  options:
  - id: a
    text:
      es: "Sí, con el 70, 60 y 50 por ciento del crédito inicial en los ejercicios siguientes."
  - id: b
    text:
      es: "Sí, siempre que su ejecución se inicie en el ejercicio de la autorización."
  - id: c
    correct: true
    text:
      es: "No, porque la subvención está prevista nominativamente en los Presupuestos Generales del Estado."
  - id: d
    text:
      es: "Sí, si el Gobierno acuerda aumentar el número de anualidades en un caso justificado."
  explanation:
    es: "No pueden adquirirse compromisos de gasto con cargo a ejercicios futuros en las subvenciones del artículo 22.2.a) de la Ley General de Subvenciones, entre ellas las previstas nominativamente en los Presupuestos (art. 47.5 LGP). La opción de los porcentajes aplica el límite general del artículo 47.2, que esta subvención no admite. La de la ejecución en el ejercicio es un requisito del artículo 47.1, necesario pero no suficiente aquí. La del Gobierno confunde la modificación de los límites del artículo 47.3 con una excepción a la prohibición."
  citation: "art. 47.5 LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-47
- id: q18
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué gasto máximo puede imputarse a 2029 en el contrato de mantenimiento del portal juvenil?"
  options:
  - id: a
    correct: true
    text:
      es: "Un gasto máximo de 90.000 euros."
  - id: b
    text:
      es: "Un gasto máximo de 105.000 euros."
  - id: c
    text:
      es: "Un gasto máximo de 75.000 euros."
  - id: d
    text:
      es: "Un gasto máximo de 63.000 euros."
  explanation:
    es: "El gasto de cada ejercicio posterior no puede exceder de un porcentaje del crédito inicial: 70 % el inmediato siguiente, 60 % el segundo y 50 % el tercero y el cuarto (art. 47.2 LGP). 2028 es el ejercicio inmediato y 2029 el segundo: 60 % de 150.000 son 90.000 euros. Los 105.000 euros aplican el 70 %. Los 75.000 euros aplican el 50 %. Los 63.000 euros calculan el 60 % sobre el límite de 2028 y no sobre el crédito inicial."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2003-21614-art-79
- id: q19
  lesson: m05-l05
  prompt:
    es: "Según el artículo 79.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿por qué puede el Injuve librar a justificar los fondos de la jornada de intercambio?"
  options:
  - id: a
    text:
      es: "Porque el gasto es periódico y repetitivo, como las dietas o el material no inventariable."
  - id: b
    text:
      es: "Porque ningún pago individualizado de la jornada va a superar 5.000 euros."
  - id: c
    text:
      es: "Porque los gastos de la jornada son de capital y no de bienes corrientes y servicios."
  - id: d
    correct: true
    text:
      es: "Porque los servicios y prestaciones tendrán lugar en el extranjero."
  explanation:
    es: "Pueden librarse fondos a justificar cuando los servicios y prestaciones hayan tenido o vayan a tener lugar en el extranjero (art. 79.1 LGP), como la jornada de Lisboa. La opción del gasto periódico y repetitivo describe los anticipos de caja fija. La del límite de 5.000 euros por pago es una regla de esos anticipos. La del gasto de capital no es causa de pagos a justificar."
  citation: "art. 79.1 LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-79
- id: q25
  lesson: m05-l05
  prompt:
    es: "Si la jornada de Lisboa se celebrase en el ejercicio siguiente al del libramiento, ¿puede el Injuve atender sus gastos con los fondos librados a justificar, según el artículo 79.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "No, en ningún caso, porque solo pueden imputarse obligaciones exigibles en el ejercicio del libramiento."
  - id: b
    text:
      es: "Sí, si lo autoriza la Dirección del Injuve, porque los fondos se libraron para gastos en el extranjero."
  - id: c
    text:
      es: "Sí, si la Intervención Delegada lo fiscaliza de conformidad al aprobar la cuenta justificativa."
  - id: d
    correct: true
    text:
      es: "Solo si el Consejo de Ministros lo acuerda, por ser gastos en el extranjero y relevantes para el interés general."
  explanation:
    es: "Con cargo a un libramiento a justificar solo se imputan las obligaciones de actuaciones realizadas y exigibles en el ejercicio al que corresponde el libramiento, pero el Consejo de Ministros puede acordar que, con los fondos librados para gastos en el extranjero, se atiendan gastos del ejercicio siguiente si lo considera relevante para el interés general (art. 79.3 LGP). Lisboa está en el extranjero, así que el Injuve solo puede hacerlo con ese acuerdo. La opción que lo niega en todo caso olvida la excepción. La que lo deja a la autorización de la Dirección del Injuve atribuye al organismo una competencia que la norma reserva al Consejo de Ministros. La que lo condiciona a la fiscalización de la Intervención Delegada no es el requisito que el artículo fija."
  citation: "art. 79.3 LGP"
  difficulty: 3
  tags:
  - "efecto"
