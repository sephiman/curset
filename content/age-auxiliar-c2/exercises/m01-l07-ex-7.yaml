type: quiz
variants:
# anchor: boe-a-2013-12887-art-25
- id: m01-l07-q104
  prompt:
    es: "Según el artículo 25.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el título II es de aplicación a los altos cargos o asimilados autonómicos y locales, incluidos:"
  options:
  - id: a
    text:
      es: "Los funcionarios con habilitación nacional de las Entidades Locales."
  - id: b
    text:
      es: "Los empleados laborales de las Entidades Locales."
  - id: c
    correct: true
    text:
      es: "Los miembros de las Juntas de Gobierno de las Entidades Locales."
  - id: d
    text:
      es: "Los vocales de los tribunales de selección de personal."
  explanation:
    es: "El artículo 25.2 incluye expresamente a los miembros de las Juntas de Gobierno de las Entidades Locales. Los funcionarios con habilitación nacional, los empleados laborales y los vocales de tribunales de selección no son altos cargos o asimilados."
  citation: "art. 25.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-art-25
- id: m01-l07-q105
  prompt:
    es: "Señale qué efecto tiene la aplicación del título II sobre la condición de cargo electo que pudieran ostentar los sujetos citados, conforme al artículo 25.3 de la Ley 19/2013, de 9 de diciembre:"
  options:
  - id: a
    correct: true
    text:
      es: "No la afecta en ningún caso."
  - id: b
    text:
      es: "La suspende mientras dure el procedimiento sancionador."
  - id: c
    text:
      es: "La extingue si se impone una sanción grave."
  - id: d
    text:
      es: "Exige la renuncia previa al cargo electo."
  explanation:
    es: "El artículo 25.3 dice que la aplicación del título II no afectará, en ningún caso, a la condición de cargo electo. No la suspende, no la extingue por una sanción grave ni exige renunciar a ella."
  citation: "art. 25.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-26
- id: m01-l07-q107
  prompt:
    es: "De acuerdo con el artículo 26.2.b) de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, entre los principios de actuación está no aceptar para sí regalos que superen:"
  options:
  - id: a
    text:
      es: "Un valor de cien euros por ocasión."
  - id: b
    correct: true
    text:
      es: "Los usos habituales, sociales o de cortesía."
  - id: c
    text:
      es: "El límite que fije el Consejo de Ministros."
  - id: d
    text:
      es: "Los límites de la normativa de contratación pública."
  explanation:
    es: "El principio de actuación de la letra b).6.º prohíbe aceptar regalos que superen los usos habituales, sociales o de cortesía. La ley no fija una cifra en euros ni remite a un límite del Consejo de Ministros o a la normativa de contratación."
  citation: "art. 26.2.b) Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-27
- id: m01-l07-q108
  prompt:
    es: "De acuerdo con el artículo 27 de la Ley 19/2013, de 9 de diciembre, el incumplimiento de las normas de incompatibilidades o de las que regulan las declaraciones de los altos cargos se sancionará:"
  options:
  - id: a
    text:
      es: "Siempre conforme al régimen disciplinario del título II de esta Ley."
  - id: b
    text:
      es: "Por el Consejo de Transparencia y Buen Gobierno en todas las Administraciones."
  - id: c
    text:
      es: "Como infracción grave en todo caso."
  - id: d
    correct: true
    text:
      es: "Conforme a la normativa en materia de conflictos de intereses de cada Administración."
  explanation:
    es: "El artículo 27 remite a la normativa de conflictos de intereses de la Administración General del Estado y, para las demás Administraciones, a su propia normativa. No aplica el título II de forma directa, no atribuye la sanción al Consejo y no califica la infracción como grave sin más."
  citation: "art. 27 Ley 19/2013"
  difficulty: 3
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-2013-12887-art-28
- id: m01-l07-q109
  prompt:
    es: "Según el artículo 28 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las conductas en materia de gestión económico-presupuestaria que enumera constituyen infracciones muy graves cuando sean:"
  options:
  - id: a
    correct: true
    text:
      es: "Culpables."
  - id: b
    text:
      es: "Reiteradas."
  - id: c
    text:
      es: "Causantes de perjuicio a la Hacienda Pública."
  - id: d
    text:
      es: "Cometidas por altos cargos del Estado."
  explanation:
    es: "El artículo 28 califica las conductas como infracciones muy graves cuando sean culpables. No exige reiteración, ni un perjuicio concreto a la Hacienda Pública, ni que el autor sea alto cargo del Estado."
  citation: "art. 28 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-28
- id: m01-l07-q110
  prompt:
    es: "¿Cuál de las siguientes conductas es infracción muy grave en materia de gestión económico-presupuestaria, según el artículo 28 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La concesión de subvenciones a entidades sin ánimo de lucro."
  - id: b
    text:
      es: "La contratación temporal de personal durante el periodo vacacional."
  - id: c
    correct: true
    text:
      es: "La omisión del trámite de intervención previa de los gastos, obligaciones o pagos, cuando resulte preceptiva."
  - id: d
    text:
      es: "La demora en la publicación del organigrama de la entidad."
  explanation:
    es: "La letra d) del artículo 28 tipifica la omisión del trámite de intervención previa cuando resulte preceptiva. Conceder subvenciones a entidades sin ánimo de lucro o contratar personal temporal son actuaciones lícitas, y la demora en publicar el organigrama es una cuestión de publicidad activa, no de gestión económico-presupuestaria."
  citation: "art. 28 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q112
  prompt:
    es: "¿Cuál de las siguientes conductas es una infracción disciplinaria muy grave, conforme al artículo 29.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La incorrección con los superiores, compañeros o subordinados."
  - id: b
    text:
      es: "El incumplimiento de los plazos u otras disposiciones de procedimiento en materia de incompatibilidades."
  - id: c
    text:
      es: "La emisión de informes manifiestamente ilegales que causen perjuicio."
  - id: d
    correct: true
    text:
      es: "El incumplimiento del deber de respeto a la Constitución y a los Estatutos de Autonomía."
  explanation:
    es: "La letra a) del artículo 29.1 califica como muy grave el incumplimiento del deber de respeto a la Constitución y a los Estatutos de Autonomía. La incorrección con superiores, compañeros o subordinados es leve. El incumplimiento de plazos en materia de incompatibilidades y la emisión de informes manifiestamente ilegales con perjuicio son graves."
  citation: "art. 29.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q113
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, la publicación o utilización indebida de la documentación o información a que se tiene acceso por razón del cargo o función es una infracción:"
  options:
  - id: a
    text:
      es: "Grave."
  - id: b
    text:
      es: "Leve."
  - id: c
    correct: true
    text:
      es: "Muy grave."
  - id: d
    text:
      es: "Grave, solo si causa perjuicio a la Administración."
  explanation:
    es: "El artículo 29.1.d) incluye la publicación o utilización indebida de la documentación o información entre las infracciones muy graves. No es solo grave ni leve. La gravedad condicionada al perjuicio a la Administración es la regla del artículo 29.2.d) para no guardar el debido sigilo, que es otra conducta."
  citation: "art. 29.1.d) Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q114
  prompt:
    es: "De acuerdo con el artículo 29.2.d) de la Ley 19/2013, de 9 de diciembre, no guardar el debido sigilo respecto a los asuntos conocidos por razón del cargo es infracción grave cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Cause perjuicio a la Administración o se utilice en provecho propio."
  - id: b
    text:
      es: "Se haya cometido otra infracción disciplinaria en el año anterior por el mismo autor."
  - id: c
    text:
      es: "Se refiera a secretos oficiales clasificados."
  - id: d
    text:
      es: "Cause perjuicio a un particular y no a la Administración."
  explanation:
    es: "No guardar el debido sigilo es infracción grave cuando cause perjuicio a la Administración o se utilice en provecho propio. La reiteración en el año anterior es el criterio de las faltas por acumulación, no de esta. La negligencia en la custodia de secretos oficiales es una infracción muy grave distinta. Y el perjuicio a un particular no es el que exige la letra d)."
  citation: "art. 29.2.d) Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q115
  prompt:
    es: "Según el artículo 29.2.f) de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la comisión de una infracción leve es grave cuando el autor hubiera sido sancionado por:"
  options:
  - id: a
    correct: true
    text:
      es: "Dos infracciones leves a lo largo del año anterior, contra las que no quepa recurso en vía administrativa."
  - id: b
    text:
      es: "Una infracción leve en los dos años anteriores."
  - id: c
    text:
      es: "Tres infracciones leves en los últimos cinco años."
  - id: d
    text:
      es: "Dos infracciones leves a lo largo de los tres años anteriores."
  explanation:
    es: "La letra f) del artículo 29.2 convierte en grave la infracción leve si el autor fue sancionado por dos infracciones leves a lo largo del año anterior, contra las que no quepa recurso en vía administrativa. Cambiar el número de infracciones o ampliar el periodo a tres o cinco años no es lo que dice la ley."
  citation: "art. 29.2.f) Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q116
  prompt:
    es: "¿Cuál de las siguientes conductas es una infracción disciplinaria leve, conforme al artículo 29.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La obstaculización al ejercicio de las libertades públicas y derechos sindicales."
  - id: b
    correct: true
    text:
      es: "La incorrección con los superiores, compañeros o subordinados."
  - id: c
    text:
      es: "El incumplimiento de los plazos en materia de incompatibilidades."
  - id: d
    text:
      es: "La adopción de acuerdos manifiestamente ilegales que causen perjuicio grave."
  explanation:
    es: "La letra a) del artículo 29.3 tipifica como leve la incorrección con los superiores, compañeros o subordinados. La obstaculización de las libertades públicas y la adopción de acuerdos manifiestamente ilegales con perjuicio grave son muy graves, y el incumplimiento de plazos en materia de incompatibilidades es grave."
  citation: "art. 29.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q117
  prompt:
    es: "Conforme al artículo 29.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el incumplimiento de los principios de actuación del artículo 26.2.b) es infracción leve cuando:"
  options:
  - id: a
    text:
      es: "Lo cometa un alto cargo autonómico o local."
  - id: b
    text:
      es: "No cause perjuicio económico a la Administración."
  - id: c
    correct: true
    text:
      es: "No constituya infracción grave o muy grave ni esté tipificado en otra norma."
  - id: d
    text:
      es: "Se haya subsanado en el plazo de un mes."
  explanation:
    es: "El incumplimiento de los principios de actuación es leve cuando no constituya infracción grave o muy grave o la conducta no se encuentre tipificada en otra norma. La condición de alto cargo autonómico o local, la ausencia de perjuicio económico y la subsanación en un mes no son el criterio del artículo."
  citation: "art. 29.3 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
