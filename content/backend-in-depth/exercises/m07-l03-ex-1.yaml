type: quiz
variants:
- id: m07-l03-q01
  prompt:
    en: 'In Kubernetes, which statement about a Service of `type: LoadBalancer` is correct on a cluster running
      at a cloud provider that supports external load balancers?'
  options:
  - id: a
    text:
      en: The load balancer is created synchronously before the Service is accepted
  - id: b
    correct: true
    text:
      en: The cloud provider decides how traffic from the external load balancer is balanced across the backend
        Pods
  - id: c
    text:
      en: The `kubelet` of each node configures the external load balancer
  - id: d
    text:
      en: The load balancer is provisioned on any cluster, whether or not the provider supports external load balancers
  explanation:
    en: The cloud provider decides how the traffic is load balanced across the backend Pods. A synchronous creation
      is wrong because the load balancer is created asynchronously. The `kubelet` is wrong because the cloud-controller-manager
      component configures the balancer. Provisioning on any cluster is wrong because the type provisions a balancer
      only on cloud providers that support external load balancers.
  citation: k8s-service#loadbalancer
  extract:
    en: Traffic from the external load balancer is directed at the backend Pods. The cloud provider decides how
      it is load balanced.
- id: m07-l03-q02
  prompt:
    en: In Kubernetes, how can you make sure that connections from a particular client are passed to the same Pod
      of a Service each time?
  options:
  - id: a
    text:
      en: Set `.spec.trafficDistribution` to `PreferSameNode`
  - id: b
    text:
      en: Mark the Pod as not ready so that the Service keeps the client on it
  - id: c
    correct: true
    text:
      en: Configure session affinity based on the client's IP address
  - id: d
    text:
      en: Mark the endpoint as terminating so that proxies keep routing to it
  explanation:
    en: Session affinity based on the client's IP address keeps a client on the same Pod. `PreferSameNode` is wrong
      because traffic distribution only expresses preferences, not a per-client guarantee. Marking the Pod not ready
      is wrong because such a Pod does not receive Service traffic. Marking the endpoint terminating is wrong because
      Service proxies normally ignore terminating endpoints.
  citation: k8s-service#session-stickiness
  extract:
    en: If you want to make sure that connections from a particular client are passed to the same Pod each time,
      you can configure session affinity based on the client's IP address.
- id: m07-l03-q03
  prompt:
    en: Which statement about a Pod whose containers report through their readiness probes that they are not ready
      is correct in Kubernetes?
  options:
  - id: a
    correct: true
    text:
      en: It does not receive traffic through Kubernetes Services
  - id: b
    text:
      en: The kubelet kills its containers so that they restart
  - id: c
    text:
      en: Its endpoint stays serving, because the serving condition ignores readiness
  - id: d
    text:
      en: It keeps receiving traffic until the Pod is deleted and becomes terminating
  explanation:
    en: A Pod that is not ready receives no traffic through Services. Killing its containers is wrong because readiness
      probes exist for cases where you do not want to kill the application. A serving endpoint is wrong because
      the serving condition maps to the Pod's Ready condition. Receiving traffic until deletion is wrong because
      a not-ready Pod already receives no Service traffic.
  citation: k8s-probes#define-readiness-probes
  extract:
    en: A pod with containers reporting that they are not ready does not receive traffic through Kubernetes Services.
- id: m07-l03-q04
  prompt:
    en: What is the default `terminationGracePeriodSeconds` of a Pod in Kubernetes, which the kubelet uses to shut
      the Pod down?
  options:
  - id: a
    text:
      en: 60 seconds
  - id: b
    text:
      en: 5 minutes
  - id: c
    correct: true
    text:
      en: 30 seconds
  - id: d
    text:
      en: 2 seconds
  explanation:
    en: The default is 30 seconds. A grace period of 60 seconds and one of 5 minutes are both excluded, because
      the default is 30 seconds. The value of 2 seconds is wrong because it is the one-off extension the kubelet
      requests when a `preStop` hook is still running after the grace period.
  citation: k8s-pod-lifecycle#pod-termination-flow
  extract:
    en: The default terminationGracePeriodSeconds setting is 30 seconds.
- id: m07-l03-q05
  prompt:
    en: A `preStop` hook is still running after the termination grace period of a Pod has expired. What does the
      kubelet do, according to the Kubernetes documentation?
  options:
  - id: a
    correct: true
    text:
      en: It requests a small, one-off grace period extension of 2 seconds
  - id: b
    text:
      en: It waits for the hook to finish, extending the grace period again as needed
  - id: c
    text:
      en: It kills the container at once without any extension
  - id: d
    text:
      en: It starts the hook only after the container has already exited
  explanation:
    en: The kubelet requests a small, one-off extension of 2 seconds. Waiting while extending again as needed and
      killing the container at once are both excluded, because the kubelet requests one extension of exactly 2 seconds.
      Running the hook after the container exits is wrong because the kubelet runs the hook inside of the container.
  citation: k8s-pod-lifecycle#pod-termination-flow
  extract:
    en: If the preStop hook is still running after the grace period expires, the kubelet requests a small, one-off
      grace period extension of 2 seconds.
- id: m07-l03-q06
  prompt:
    en: In RFC 9110, which kind of HTTP intermediary is a message-forwarding agent that is chosen by the client,
      usually through local configuration rules, to receive requests?
  options:
  - id: a
    text:
      en: A gateway
  - id: b
    text:
      en: A tunnel
  - id: c
    text:
      en: An interception proxy
  - id: d
    correct: true
    text:
      en: A proxy
  explanation:
    en: A proxy is chosen by the client. A gateway is wrong because it acts as an origin server for the outbound
      connection and forwards requests inbound. A tunnel is wrong because it is a blind relay between two connections.
      An interception proxy is wrong because it is not chosen by the client.
  citation: rfc9110#section-3.7
  extract:
    en: A "proxy" is a message-forwarding agent that is chosen by the client, usually via local configuration rules,
      to receive requests for some type(s) of absolute URI and attempt to satisfy those requests via translation
      through the HTTP interface.
- id: m07-l03-q07
  prompt:
    en: According to RFC 9110, what are gateways, also called reverse proxies, often used for in an HTTP deployment?
  options:
  - id: a
    text:
      en: Extending a virtual connection through a shared firewall proxy while TLS protects it
  - id: b
    correct: true
    text:
      en: Enabling partitioning or load balancing of HTTP services across multiple machines
  - id: c
    text:
      en: Enforcing account subscription on public network access points
  - id: d
    text:
      en: Letting each client choose through local configuration which URIs to send through them
  explanation:
    en: Gateways are often used to enable partitioning or load balancing of HTTP services across multiple machines.
      Extending a virtual connection through a firewall proxy is wrong because that is what tunnels are used for.
      Enforcing account subscription is wrong because interception proxies do that on public access points. Client-chosen
      configuration is wrong because that describes a proxy, which the client chooses.
  citation: rfc9110#section-3.7
  extract:
    en: Gateways are often used to encapsulate legacy or untrusted information services, to improve server performance
      through "accelerator" caching, and to enable partitioning or load balancing of HTTP services across multiple
      machines.
- id: m07-l03-q08
  prompt:
    en: In Kubernetes 1.37, what is the status of the Ingress API, according to the Kubernetes documentation?
  options:
  - id: a
    text:
      en: It is deprecated and scheduled for removal from Kubernetes
  - id: b
    text:
      en: It is still evolving, with new features added in each release
  - id: c
    correct: true
    text:
      en: It is frozen, and the Kubernetes project recommends using Gateway instead
  - id: d
    text:
      en: It can also expose arbitrary ports and protocols besides HTTP and HTTPS
  explanation:
    en: The Ingress API is frozen and the project recommends Gateway. Removal is wrong because the project has no
      plans to remove Ingress. New features in each release are wrong because the API is no longer being developed
      and gets no further changes. Exposing arbitrary ports is wrong because an Ingress does not expose arbitrary
      ports or protocols.
  citation: k8s-ingress#note
  extract:
    en: The Kubernetes project recommends using Gateway instead of Ingress. The Ingress API has been frozen.
- id: m07-l03-q09
  prompt:
    en: Which path type of a Kubernetes `Ingress` matches the URL path exactly and with case sensitivity?
  options:
  - id: a
    text:
      en: '`Prefix`'
  - id: b
    text:
      en: '`ImplementationSpecific`'
  - id: c
    text:
      en: '`Regex`'
  - id: d
    correct: true
    text:
      en: '`Exact`'
  explanation:
    en: '`Exact` matches the URL path exactly and with case sensitivity. `Prefix` is wrong because it matches a
      URL path prefix split by `/`. `ImplementationSpecific` is wrong because its matching is up to the `IngressClass`.
      `Regex` is wrong because only three path types are supported, and it is not one of them.'
  citation: k8s-ingress#path-types
  extract:
    en: 'Exact: Matches the URL path exactly and with case sensitivity.'
- id: m07-l03-q10
  prompt:
    en: Which Gateway API kind defines an instance of traffic handling infrastructure, such as a cloud load balancer?
  options:
  - id: a
    correct: true
    text:
      en: '`Gateway`'
  - id: b
    text:
      en: '`GatewayClass`'
  - id: c
    text:
      en: '`HTTPRoute`'
  - id: d
    text:
      en: '`GRPCRoute`'
  explanation:
    en: '`Gateway` defines an instance of traffic handling infrastructure. `GatewayClass` is wrong because it defines
      a set of gateways with common configuration managed by one controller. `HTTPRoute` is wrong because it defines
      HTTP-specific rules for mapping traffic from a listener. `GRPCRoute` is wrong because it defines the equivalent
      rules for gRPC.'
  citation: k8s-gateway-api-concept#resource-model
  extract:
    en: 'Gateway: Defines an instance of traffic handling infrastructure, such as cloud load balancer.'
- id: m07-l03-q11
  prompt:
    en: In Kubernetes Gateway API, which statement about the `GatewayClass` resource and the controllers that handle
      it is correct according to the documentation?
  options:
  - id: a
    text:
      en: A `Gateway` can reference several `GatewayClass` objects and combine their behaviour
  - id: b
    text:
      en: '`GatewayClass` is a namespaced resource, so each team defines its own'
  - id: c
    text:
      en: A cluster can run functional Gateways without defining any `GatewayClass`
  - id: d
    correct: true
    text:
      en: Each `GatewayClass` is handled by a single controller, although a controller may handle more than one
        `GatewayClass`
  explanation:
    en: A `GatewayClass` is handled by one controller, while a controller may handle several classes. Referencing
      several classes is wrong because a Gateway is associated with exactly one `GatewayClass`. A namespaced resource
      is wrong because `GatewayClass` is cluster-scoped. Running without any class is wrong because at least one
      `GatewayClass` must exist for Gateways to be functional.
  citation: gateway-api-concepts-api-overview#gatewayclass
  extract:
    en: Each GatewayClass will be handled by a single controller, although controllers may handle more than one
      GatewayClass.
- id: m07-l03-q12
  prompt:
    en: The Gateway API migration guide lists limitations of the Ingress API. Which one concerns how Ingress is
      extended by different implementations?
  options:
  - id: a
    correct: true
    text:
      en: Extensibility through annotations limits portability, because each implementation has its own extensions
        that may not translate to another
  - id: b
    text:
      en: Ingress cannot terminate TLS at all
  - id: c
    text:
      en: Few vendors support Ingress, so only a handful of controllers exist
  - id: d
    text:
      en: Ingress will be removed from Kubernetes in an upcoming release
  explanation:
    en: Annotation-based extensions differ per implementation and limit portability. The claim that Ingress cannot
      terminate TLS is wrong because the API supports TLS termination. The claim of few vendors is wrong because
      Ingress is well-supported by vendors with many controllers. The claim of removal is wrong because the Kubernetes
      project has no plans to remove Ingress.
  citation: gateway-api-migrating-from-ingress#reasons-to-switch-to-gateway-api
  extract:
    en: The annotations approach to extensibility leads to limited portability as every implementation has its own
      supported extensions that may not translate to any other implementation.
- id: m07-l03-q14
  prompt:
    en: Which statement about the `s-maxage` response directive of RFC 9111 is correct for a shared cache?
  options:
  - id: a
    text:
      en: A shared cache must never reuse a response to a request that carries an `Authorization` header field
  - id: b
    correct: true
    text:
      en: A shared cache must not reuse a stale response with `s-maxage` until the origin has successfully validated
        it
  - id: c
    text:
      en: Its value is written as a quoted string, such as `s-maxage="10"`
  - id: d
    text:
      en: A shared cache uses the larger of `s-maxage` and `max-age` as the maximum age
  explanation:
    en: A shared cache must validate a stale `s-maxage` response with the origin before reuse. Never reusing responses
      to `Authorization` requests is wrong because the directive permits that reuse. The quoted-string form is wrong
      because a sender must not generate it. Using the larger of the two values is wrong because `s-maxage` overrides
      the maximum age of `max-age` and `Expires`.
  citation: rfc9111#section-5.2.2.10
  extract:
    en: A shared cache MUST NOT reuse a stale response with s-maxage to satisfy another request until it has been
      successfully validated by the origin, as defined by Section 4.3.
