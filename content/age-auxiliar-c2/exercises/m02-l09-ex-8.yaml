# anchor: fuente-ms-excel-funcion-dias-html
- id: m02-l09-q230
  prompt:
    es: "En Excel 365, A2 contiene 31/12/2021 y A3 contiene 1/1/2021. ¿Qué muestra =DIAS(A3;A2) con formato Número?"
  options:
  - id: a
    text:
      es: "364"
  - id: b
    text:
      es: "365"
  - id: c
    text:
      es: "0"
  - id: d
    correct: true
    text:
      es: "-364"
  explanation:
    es: "La función resta la fecha final (A3) menos la inicial (A2): da -364, el signo contrario de =DIAS(A2;A3), que da 364. «364»: la fórmula resta fecha final menos inicial; aquí la final es A3, anterior a A2. «365»: la diferencia entre 1/1/2021 y 31/12/2021 es de 364 días. «0»: las fechas son distintas, y su diferencia no es cero."
  citation: "fuente: `ms-excel-funcion-dias.html`; «Si ambos argumentos de fecha son números, DIAS usa FechaFinal – FechaInicial para calcular el número de días entre ambas fechas.»"
