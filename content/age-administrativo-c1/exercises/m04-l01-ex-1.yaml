# anchor: boe-a-2015-11719-art-8
- id: m04-l01-q001
  prompt:
    es: "De acuerdo con el artículo 8.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, son empleados públicos quienes:"
  options:
  - id: a
    text:
      es: "Desempeñan funciones retribuidas u honoríficas en las Administraciones Públicas al servicio de los intereses generales."
  - id: b
    text:
      es: "Desempeñan, en virtud de nombramiento legal, servicios profesionales retribuidos de carácter permanente."
  - id: c
    text:
      es: "Prestan servicios retribuidos en las Administraciones Públicas en virtud de un contrato de trabajo."
  - id: d
    correct: true
    text:
      es: "Desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales."
  explanation:
    es: "El artículo 8.1 define a los empleados públicos como quienes «desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales». La versión que añade las funciones honoríficas altera el texto: el artículo sólo habla de funciones retribuidas. El nombramiento legal para servicios profesionales permanentes es la definición del funcionario de carrera (art. 9.1), una sola de las clases. El contrato de trabajo define al personal laboral (art. 11.1), otra clase."
  citation: "art. 8.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-8
- id: m04-l01-q002
  prompt:
    es: "Según el artículo 8.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos se clasifican en:"
  options:
  - id: a
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal directivo."
  - id: b
    text:
      es: "Funcionarios de carrera, funcionarios en prácticas, personal laboral y personal eventual."
  - id: c
    text:
      es: "Funcionarios de carrera, personal laboral, personal eventual y personal directivo profesional."
  - id: d
    correct: true
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual."
  explanation:
    es: "El artículo 8.2 enumera cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual. El personal directivo no es una clase de esa lista; el Estatuto lo regula aparte, en su artículo 13. Los funcionarios en prácticas tampoco figuran en la lista del artículo 8.2. La lista que suprime a los interinos y añade el personal directivo profesional altera dos elementos."
  citation: "art. 8.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11719-art-9
- id: m04-l01-q003
  prompt:
    es: "¿Qué empleados públicos están vinculados a una Administración Pública, en virtud de nombramiento legal, por una relación estatutaria para el desempeño de servicios profesionales retribuidos de carácter permanente?"
  options:
  - id: a
    text:
      es: "Los funcionarios interinos."
  - id: b
    text:
      es: "El personal eventual de los gabinetes."
  - id: c
    text:
      es: "El personal laboral fijo."
  - id: d
    correct: true
    text:
      es: "Los funcionarios de carrera."
  explanation:
    es: "Es la definición de funcionario de carrera del artículo 9.1 del texto refundido del Estatuto Básico del Empleado Público. Los funcionarios interinos se nombran por razones justificadas de necesidad y urgencia, no para servicios de carácter permanente. El personal eventual se nombra con carácter no permanente (art. 12.1). El personal laboral fijo presta servicios en virtud de contrato de trabajo, no de una relación estatutaria (art. 11.1)."
  citation: "art. 9.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-9
- id: m04-l01-q004
  prompt:
    es: "¿Por qué tipo de relación están vinculados los funcionarios de carrera a la Administración Pública en la que prestan sus servicios?"
  options:
  - id: a
    text:
      es: "Una relación laboral de carácter especial regulada por el Derecho del Trabajo."
  - id: b
    text:
      es: "Una relación contractual regulada por la legislación de contratos del sector público."
  - id: c
    correct: true
    text:
      es: "Una relación estatutaria regulada por el Derecho Administrativo."
  - id: d
    text:
      es: "Una relación estatutaria regulada por el convenio colectivo de cada Administración."
  explanation:
    es: "El artículo 9.1 del texto refundido del Estatuto Básico del Empleado Público dice que el funcionario de carrera está vinculado «por una relación estatutaria regulada por el Derecho Administrativo». La relación laboral de carácter especial no es la del funcionario; el Estatuto la nombra para el personal directivo que es personal laboral (art. 13). La relación contractual del sector público es la de los contratistas, no la de los empleados. La relación estatutaria no la regula un convenio colectivo sino el Derecho Administrativo."
  citation: "art. 9.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-11
- id: m04-l01-q005
  prompt:
    es: "De acuerdo con el artículo 11.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el personal laboral podrá ser fijo, por tiempo indefinido o temporal en función de:"
  options:
  - id: a
    text:
      es: "El sistema selectivo por el que haya accedido a su puesto."
  - id: b
    correct: true
    text:
      es: "La duración del contrato de trabajo que haya suscrito."
  - id: c
    text:
      es: "El grupo profesional en el que esté encuadrado."
  - id: d
    text:
      es: "La Administración Pública que lo haya contratado."
  explanation:
    es: "El artículo 11.1 dice: «En función de la duración del contrato éste podrá ser fijo, por tiempo indefinido o temporal». El criterio es la duración. El sistema selectivo, el grupo profesional y la Administración contratante no son el criterio que usa el artículo para esa clasificación."
  citation: "art. 11.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-11
- id: m04-l01-q006
  prompt:
    es: "Según el artículo 11.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, es personal laboral el que presta servicios retribuidos por las Administraciones Públicas en virtud de contrato de trabajo:"
  options:
  - id: a
    text:
      es: "Formalizado por escrito, sólo en las modalidades de contratación indefinida de la legislación laboral."
  - id: b
    correct: true
    text:
      es: "Formalizado por escrito, en cualquiera de las modalidades de contratación previstas en la legislación laboral."
  - id: c
    text:
      es: "Formalizado por escrito o de palabra, en cualquiera de las modalidades de la legislación laboral."
  - id: d
    text:
      es: "Formalizado en documento administrativo, en las modalidades que fije cada ley de Función Pública."
  explanation:
    es: "El artículo 11.1 exige un contrato de trabajo «formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral». No limita las modalidades a la contratación indefinida: el mismo apartado admite personal temporal. No admite el contrato de palabra. Tampoco remite a un documento administrativo ni a las leyes de Función Pública para fijar las modalidades."
  citation: "art. 11.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-11
- id: m04-l01-q007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el personal laboral recoge el artículo 11.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "En función de la duración del contrato, puede ser fijo, por tiempo indefinido o temporal."
  - id: b
    text:
      es: "En función de la duración del contrato, puede ser fijo o temporal, pero nunca por tiempo indefinido."
  - id: c
    text:
      es: "Presta servicios en virtud de nombramiento, con carácter fijo, por tiempo indefinido o temporal."
  - id: d
    text:
      es: "Su contrato puede formalizarse de palabra cuando su duración sea inferior a seis meses."
  explanation:
    es: "El artículo 11.1 TREBEP dice que, «en función de la duración del contrato», el personal laboral «podrá ser fijo, por tiempo indefinido o temporal». Excluir el tiempo indefinido contradice esa lista de tres. El personal laboral presta servicios «en virtud de contrato de trabajo», no de nombramiento: el nombramiento es el título de los funcionarios, según el artículo 9.1. El contrato es «formalizado por escrito» sin distinción por duración, así que un contrato de palabra de menos de seis meses contradice esa fórmula."
  citation: "art. 11.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q008
  prompt:
    es: "¿Qué personal, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial?"
  options:
  - id: a
    text:
      es: "El personal directivo profesional."
  - id: b
    correct: true
    text:
      es: "El personal eventual."
  - id: c
    text:
      es: "El funcionario interino."
  - id: d
    text:
      es: "El personal laboral temporal."
  explanation:
    es: "El artículo 12.1 del texto refundido del Estatuto Básico del Empleado Público define así al personal eventual. El personal directivo profesional desarrolla funciones directivas profesionales (art. 13.1), no de confianza. El funcionario interino desempeña funciones propias de funcionarios de carrera. El personal laboral temporal presta servicios en virtud de contrato de trabajo, no de nombramiento (art. 11.1)."
  citation: "art. 12.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q009
  prompt:
    es: "¿Con cargo a qué se retribuye al personal eventual que realiza funciones de confianza o asesoramiento especial en las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Con cargo a los créditos presupuestarios consignados para este fin."
  - id: b
    text:
      es: "Con cargo a los créditos del capítulo de personal laboral del departamento."
  - id: c
    text:
      es: "Con cargo a la asignación de la autoridad a la que asesora."
  - id: d
    text:
      es: "Con cargo a los fondos propios del gabinete en que trabaja."
  explanation:
    es: "El artículo 12.1 del texto refundido del Estatuto Básico del Empleado Público dice que el personal eventual es «retribuido con cargo a los créditos presupuestarios consignados para este fin». No se paga con los créditos del personal laboral, porque el eventual no es personal laboral. Tampoco con una asignación de la autoridad a la que asesora ni con fondos propios de un gabinete: el artículo exige créditos presupuestarios consignados para ese fin."
  citation: "art. 12.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q010
  prompt:
    es: "Las funciones que puede realizar el personal eventual al servicio de las Administraciones Públicas son:"
  options:
  - id: a
    text:
      es: "Funciones de confianza o asesoramiento especial y, cuando sea preciso, funciones directivas."
  - id: b
    text:
      es: "Funciones de confianza o asesoramiento especial y de gestión ordinaria del departamento."
  - id: c
    correct: true
    text:
      es: "Sólo funciones expresamente calificadas como de confianza o asesoramiento especial."
  - id: d
    text:
      es: "Funciones propias de los funcionarios de carrera, por razones justificadas de urgencia."
  explanation:
    es: "El artículo 12.1 del texto refundido del Estatuto Básico del Empleado Público dice que el personal eventual «sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial». El adverbio «sólo» excluye añadir funciones directivas o de gestión ordinaria. El artículo 20.2 de la Ley 30/1984 dice lo mismo («sólo ejercerá»). Desempeñar funciones de funcionarios de carrera por urgencia corresponde a los funcionarios interinos."
  citation: "art. 12.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q011
  prompt:
    es: "Según el artículo 12.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuándo tiene lugar, en todo caso, el cese del personal eventual?"
  options:
  - id: a
    text:
      es: "Cuando se agotan los créditos presupuestarios consignados para retribuir su puesto."
  - id: b
    text:
      es: "Cuando transcurren cuatro años desde la fecha de su nombramiento."
  - id: c
    correct: true
    text:
      es: "Cuando se produce el cese de la autoridad a la que presta la función de confianza o asesoramiento."
  - id: d
    text:
      es: "Cuando se aprueba una nueva relación de puestos de trabajo del departamento."
  explanation:
    es: "El artículo 12.3 dice: «El cese tendrá lugar, en todo caso, cuando se produzca el de la autoridad a la que se preste la función de confianza o asesoramiento». Los créditos presupuestarios fijan cómo se retribuye al eventual (art. 12.1), no una causa de cese. El artículo no fija un plazo de cuatro años. Una nueva relación de puestos de trabajo no figura como causa de cese."
  citation: "art. 12.3 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q012
  prompt:
    es: "Señale la respuesta correcta sobre el personal eventual, según el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Su nombramiento y su cese son libres, y cesa en todo caso cuando cesa la autoridad a la que asesora."
  - id: b
    text:
      es: "Su nombramiento y su cese son libres, pero no cesa cuando cesa la autoridad a la que asesora."
  - id: c
    text:
      es: "Su nombramiento y su cese son libres, y el puesto que ocupa tiene carácter permanente."
  - id: d
    text:
      es: "Su nombramiento y su cese son libres, y sólo cesa a petición propia o por jubilación."
  explanation:
    es: "El artículo 12.3 dice que «el nombramiento y cese serán libres» y que el cese tiene lugar, en todo caso, cuando se produce el de la autoridad a la que se presta la función de confianza o asesoramiento. La opción que niega ese cese automático contradice el mismo apartado. El carácter permanente choca con el artículo 12.1, que nombra al eventual «con carácter no permanente». Limitar el cese a la petición propia o la jubilación contradice que el cese sea libre."
  citation: "art. 12.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q013
  prompt:
    es: "¿Puede la condición de personal eventual constituir mérito para el acceso a la Función Pública o para la promoción interna?"
  options:
  - id: a
    text:
      es: "Sí para el acceso a la Función Pública, pero no para la promoción interna."
  - id: b
    text:
      es: "Sí, para el acceso, cuando se haya desempeñado durante dos años."
  - id: c
    correct: true
    text:
      es: "No, ni para el acceso a la Función Pública ni para la promoción interna."
  - id: d
    text:
      es: "Sí, para el acceso, si así lo prevé la ley de Función Pública respectiva."
  explanation:
    es: "El artículo 12.4 del texto refundido del Estatuto Básico del Empleado Público dice que la condición de personal eventual «no podrá constituir mérito para el acceso a la Función Pública o para la promoción interna». Las otras tres opciones admiten que sea mérito para el acceso, con o sin condiciones, y el artículo lo excluye sin excepción."
  citation: "art. 12.4 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-12
- id: m04-l01-q014
  prompt:
    es: "Según el artículo 12.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué régimen se aplica al personal eventual en lo que sea adecuado a la naturaleza de su condición?"
  options:
  - id: a
    correct: true
    text:
      es: "El régimen general de los funcionarios de carrera."
  - id: b
    text:
      es: "El régimen general del personal laboral temporal."
  - id: c
    text:
      es: "El régimen específico del personal directivo profesional."
  - id: d
    text:
      es: "El régimen general de los funcionarios interinos."
  explanation:
    es: "El artículo 12.5 dice: «Al personal eventual le será aplicable, en lo que sea adecuado a la naturaleza de su condición, el régimen general de los funcionarios de carrera». No remite al régimen del personal laboral, porque el eventual se nombra y no se contrata. Tampoco al del personal directivo, que regula el artículo 13. Ni al de los funcionarios interinos, que son otra clase de empleado público."
  citation: "art. 12.5 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-20
- id: m04-l01-q015
  prompt:
    es: "Según el artículo 20.2 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, el nombramiento y el cese del personal eventual corresponden exclusivamente, en la Administración del Estado:"
  options:
  - id: a
    text:
      es: "A los Ministros y a los Subsecretarios de cada departamento."
  - id: b
    text:
      es: "A los Secretarios de Estado y a los Directores Generales."
  - id: c
    text:
      es: "Al Consejo de Ministros, a propuesta del Ministro respectivo."
  - id: d
    correct: true
    text:
      es: "A los Ministros y a los Secretarios de Estado."
  explanation:
    es: "El artículo 20.2 de la Ley 30/1984 dice que el nombramiento y cese del personal eventual «corresponden exclusivamente a los Ministros y a los Secretarios de Estado» y, en su caso, a los Consejeros de Gobierno de las comunidades autónomas y a los Presidentes de las Corporaciones Locales. Los Subsecretarios y los Directores Generales están un nivel por debajo y no figuran. El Consejo de Ministros tampoco: el artículo atribuye la competencia a cada Ministro o Secretario de Estado. El apartado figura en la lista de la disposición derogatoria única b) del texto refundido del Estatuto Básico del Empleado Público."
  citation: "art. 20.2 Ley 30/1984"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1984-17387-art-20
- id: m04-l01-q016
  prompt:
    es: "De acuerdo con el artículo 20.2 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, en las Corporaciones Locales el nombramiento y el cese del personal eventual corresponden:"
  options:
  - id: a
    text:
      es: "Al Pleno de cada Corporación Local."
  - id: b
    correct: true
    text:
      es: "A los Presidentes de las Corporaciones Locales."
  - id: c
    text:
      es: "A la Junta de Gobierno Local de cada Corporación."
  - id: d
    text:
      es: "Al Secretario de cada Corporación Local, previo informe."
  explanation:
    es: "El artículo 20.2 de la Ley 30/1984 atribuye el nombramiento y el cese del personal eventual, en su caso, «a los Presidentes de las Corporaciones Locales». Al Pleno el mismo apartado le da otra función: determinar el número de puestos reservados a personal eventual. La Junta de Gobierno Local y el Secretario de la Corporación no figuran en el artículo."
  citation: "art. 20.2 Ley 30/1984"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-13
- id: m04-l01-q017
  prompt:
    es: "Según el artículo 13 del texto refundido de la Ley del Estatuto Básico del Empleado Público, es personal directivo el que desarrolla funciones directivas profesionales en las Administraciones Públicas, definidas como tales:"
  options:
  - id: a
    correct: true
    text:
      es: "En las normas específicas de cada Administración Pública."
  - id: b
    text:
      es: "En la relación de puestos de trabajo del departamento."
  - id: c
    text:
      es: "En el propio Estatuto, con carácter básico para todas las Administraciones."
  - id: d
    text:
      es: "En el acuerdo que alcance la Mesa General de Negociación."
  explanation:
    es: "El artículo 13.1 dice que las funciones directivas profesionales son las «definidas como tales en las normas específicas de cada Administración». No remite a la relación de puestos de trabajo. El Estatuto no las define: deja que lo haga cada Administración. Tampoco remite a la negociación colectiva; el artículo 13.4 excluye las condiciones de empleo del personal directivo de la negociación colectiva."
  citation: "art. 13.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-123
- id: m04-l01-q019
  prompt:
    es: "De acuerdo con el artículo 123.3 del Real Decreto-ley 6/2023, de 19 de diciembre, tienen la consideración de personal directivo público profesional en la Administración del Estado:"
  options:
  - id: a
    text:
      es: "Las personas titulares de las subdirecciones generales adjuntas."
  - id: b
    correct: true
    text:
      es: "Las personas titulares de las subdirecciones generales."
  - id: c
    text:
      es: "Las personas titulares de las jefaturas de servicio."
  - id: d
    text:
      es: "Las personas titulares de las direcciones de los gabinetes ministeriales."
  explanation:
    es: "El artículo 123.3 dice: «Tendrán la consideración de personal directivo público profesional las personas titulares de las subdirecciones generales». Los puestos de subdirección general adjunta son puestos predirectivos (art. 123.5). Las jefaturas de servicio están por debajo y el artículo no las nombra. Los directores de gabinete de los ministros no son personal directivo profesional; los gabinetes los regula el artículo 23 del Real Decreto 1009/2023 con su propio régimen."
  citation: "art. 123.3 RDL 6/2023"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2023-25758-art-123
- id: m04-l01-q020
  prompt:
    es: "¿Qué consideración tienen las personas titulares de las subdirecciones generales de la Administración del Estado según el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    text:
      es: "La de personal predirectivo de libre designación."
  - id: b
    correct: true
    text:
      es: "La de personal directivo público profesional."
  - id: c
    text:
      es: "La de alto cargo de la Administración del Estado."
  - id: d
    text:
      es: "La de personal eventual de confianza."
  explanation:
    es: "El artículo 123.3 del Real Decreto-ley 6/2023 da a los titulares de las subdirecciones generales la consideración de personal directivo público profesional. Predirectivos son los puestos de subdirección general adjunta y los que se les asimilen (art. 123.5). Los subdirectores generales no son altos cargos: el artículo los incluye en el personal directivo profesional. Tampoco son personal eventual, que sólo realiza funciones de confianza o asesoramiento especial."
  citation: "art. 123.3 RDL 6/2023"
  difficulty: 2
