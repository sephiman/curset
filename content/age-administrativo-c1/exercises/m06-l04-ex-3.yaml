# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q053
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones se realiza al activar la casilla Asignar a tras mencionar a alguien con @ en un comentario?"
  options:
  - id: a
    text:
      es: "Se abre el Panel de revisiones para editar el comentario."
  - id: b
    text:
      es: "Se publica el comentario sin necesidad de pulsar Ctrl+Entrar."
  - id: c
    text:
      es: "Se resuelve el hilo y se oculta en la vista Contextual."
  - id: d
    correct: true
    text:
      es: "Se asigna el comentario como tarea a la persona mencionada."
  explanation:
    es: "La página dice: «Solo @mention alguien y, a continuación, seleccione la casilla Asignar a para asignar el comentario como tarea». Resolver un hilo se hace con Más acciones de subproceso, y los resueltos se ocultan en la vista Contextual. El Panel de revisiones se abre desde la pestaña Revisar, y el comentario se publica con el botón Comentario o con Ctrl+Entrar."
  citation: "fuente: `ms-word-comentarios.html`; «Asignar tareas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-comentarios-html
- id: m06-l04-q054
  prompt:
    es: "Señale la respuesta correcta sobre los comentarios que se agregan con los comentarios modernos de Word 365 y los usuarios de versiones anteriores de Word:"
  options:
  - id: a
    text:
      es: "Solo pueden verlos en Word para la Web."
  - id: b
    text:
      es: "No pueden verlos en ninguna plataforma."
  - id: c
    correct: true
    text:
      es: "Pueden verlos en cualquier plataforma."
  - id: d
    text:
      es: "Solo pueden verlos si el autor lo permite."
  explanation:
    es: "La respuesta de la página es: «Sí. Los usuarios de versiones anteriores de Word en cualquier plataforma pueden ver sus comentarios». Las demás opciones restringen o niegan lo que la página afirma sin condiciones."
  citation: "fuente: `ms-word-comentarios.html`; «Preguntas frecuentes»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-traducir-html
- id: m06-l04-q057
  prompt:
    es: "En Word 365, ¿qué ocurre al usar Revisar › Traducir › Traducir documento, elegir el idioma y seleccionar Traducir?"
  options:
  - id: a
    text:
      es: "El texto traducido sustituye al original dentro del mismo documento."
  - id: b
    text:
      es: "Se abre el panel del diccionario de sinónimos en el otro idioma."
  - id: c
    text:
      es: "La traducción se agrega como una subpágina del documento original."
  - id: d
    correct: true
    text:
      es: "Se abre una copia del documento traducido en una ventana independiente."
  explanation:
    es: "La página dice: «Seleccione Traducir. Se abrirá una copia del documento traducido en una ventana independiente». Sustituir el texto por la traducción es lo que hace Insertar al traducir una palabra o frase resaltada. La subpágina es el resultado de traducir una página en OneNote. El diccionario de sinónimos se abre con Mayús+F7."
  citation: "fuente: `ms-office-traducir.html`; «Traducir un archivo completo en Word»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-traducir-html
- id: m06-l04-q058
  prompt:
    es: "En Word 365, tras resaltar una frase, elegir el idioma y ver su traducción, el botón Insertar:"
  options:
  - id: a
    text:
      es: "Guarda la traducción en Especial para pegarla después."
  - id: b
    text:
      es: "Abre una copia traducida del documento en otra ventana."
  - id: c
    text:
      es: "Agrega la traducción como comentario junto a la frase."
  - id: d
    correct: true
    text:
      es: "Sustituye el texto resaltado por el texto traducido."
  explanation:
    es: "La página dice: «Seleccione Insertar. El texto traducido reemplazará el que haya resaltado en el paso 1». La copia en otra ventana es el resultado de Traducir documento. Insertar no crea comentarios, y Especial es el espacio que usan Ctrl+F3 y Ctrl+Mayús+F3."
  citation: "fuente: `ms-office-traducir.html`; «Traducir palabras o frases en Word, Excel o PowerPoint»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-traducir-html
- id: m06-l04-q061
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones permite cambiar el idioma de destino para la traducción de documentos?"
  options:
  - id: a
    text:
      es: "Establecer el idioma de corrección, en el cuadro de diálogo Idioma"
  - id: b
    text:
      es: "Ocultar errores de ortografía solo en este documento, en Revisión"
  - id: c
    correct: true
    text:
      es: "Establecer idioma de traducción de documentos, en el menú Traducir"
  - id: d
    text:
      es: "Volver a comprobar documento, en la categoría Revisión de Opciones"
  explanation:
    es: "La página dice que se cambia el idioma de destino «seleccionando Establecer idioma de traducción de documentos o Preferencias de traducción en el menú Traducir» o desde Archivo › Opciones › Idioma. Las otras tres son opciones reales de Word con otro fin: ocultar errores en un documento, revisar otra vez lo ignorado y fijar el idioma con que se revisa la ortografía."
  citation: "fuente: `ms-office-traducir.html`; «Cambiar el idioma de traducción»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q062
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra el panel de tareas Traductor?"
  options:
  - id: a
    correct: true
    text:
      es: "Alt+Mayús+F7"
  - id: b
    text:
      es: "Ctrl+Mayús+F7"
  - id: c
    text:
      es: "Alt+F7"
  - id: d
    text:
      es: "Mayús+F7"
  explanation:
    es: "En la fila de F7 de la tabla, «Alt+Mayús+F7: muestra el panel de tareas Traductor». Mayús+F7 muestra el diccionario de sinónimos, Alt+F7 busca el siguiente error gramatical u ortográfico y Ctrl+Mayús+F7 actualiza la información vinculada de un documento de origen."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-office-traducir-html
- id: m06-l04-q063
  prompt:
    es: "En Word 365, al traducir una palabra resaltada aparece una lista con varias traducciones. ¿Qué se muestra al expandir uno de los elementos traducidos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un ejemplo de uso de esa palabra en los dos idiomas"
  - id: b
    text:
      es: "Una copia traducida del documento en otra ventana"
  - id: c
    text:
      es: "La lista de idiomas que admite Traductor de Microsoft"
  - id: d
    text:
      es: "Los sinónimos de la palabra en el idioma original"
  explanation:
    es: "La página dice: «Expanda el elemento traducido para mostrar un ejemplo de uso en los dos idiomas». Los sinónimos están en el panel del diccionario de sinónimos (Mayús+F7). La lista de idiomas admitidos es otra página de Microsoft, enlazada en «Vea también». La copia traducida en otra ventana es el resultado de Traducir documento."
  citation: "fuente: `ms-office-traducir.html`; «Traducir palabras o frases en Word, Excel o PowerPoint»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-lectura-voz-alta-html
- id: m06-l04-q101
  prompt:
    es: "En Word 365, ¿cuál de las siguientes pestañas de la cinta de opciones contiene el comando Lectura en voz alta?"
  options:
  - id: a
    correct: true
    text:
      es: "Revisar"
  - id: b
    text:
      es: "Correspondencia"
  - id: c
    text:
      es: "Referencias"
  - id: d
    text:
      es: "Insertar"
  explanation:
    es: "La página indica el camino: «Seleccione Revisar>lectura en voz alta». Correspondencia sirve para tareas de combinación de correspondencia, sobres y etiquetas. Referencias sirve para agregar tabla de contenido, notas al pie o una tabla de citas. Insertar sirve para tablas, imágenes, formas, encabezados o cuadros de texto."
  citation: "fuente: `ms-word-lectura-voz-alta.html`; «Escuchar los documentos de Word con Lectura en voz alta»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-lectura-voz-alta-html
- id: m06-l04-q102
  prompt:
    es: "¿Cuál de las siguientes acciones realiza Lectura en voz alta de Word 365 mientras lee el documento?"
  options:
  - id: a
    text:
      es: "Abre una copia del documento traducida a otro idioma"
  - id: b
    text:
      es: "Convierte la voz grabada en una transcripción de texto"
  - id: c
    correct: true
    text:
      es: "Resalta cada palabra a medida que la lee"
  - id: d
    text:
      es: "Revisa la ortografía y la gramática del texto leído"
  explanation:
    es: "La página abre con la descripción: «Lectura en voz alta resalta cada palabra a medida que lee el documento». Abrir una copia traducida es lo que hace Traducir, no Lectura en voz alta. Convertir la voz en una transcripción de texto es lo que hace Transcribir. Revisar la ortografía y la gramática es la función de F7, que muestra el panel del Editor."
  citation: "fuente: `ms-word-lectura-voz-alta.html`; «Escuchar los documentos de Word con Lectura en voz alta»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-lectura-voz-alta-html
- id: m06-l04-q105
  prompt:
    es: "En Word 365, ¿desde qué punto del documento empieza a leer Lectura en voz alta cuando se hace clic en un lugar concreto?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el lugar donde se ha hecho clic o pulsado"
  - id: b
    text:
      es: "Siempre al principio del documento, aunque se haya hecho clic en otro punto"
  - id: c
    text:
      es: "Siempre en la primera página, después de cualquier portada"
  - id: d
    text:
      es: "Siempre en el último párrafo que se ha editado"
  explanation:
    es: "La página dice: «Haz clic o pulsa en el lugar donde quieras que se empiece a reproducir Lectura en voz alta», y por eso la lectura arranca donde se ha hecho clic. Empezar siempre al principio contradice esa frase: solo se lee todo desde el principio si se coloca ahí el cursor, como dice la línea siguiente de la página. Empezar siempre en la primera página tras la portada tampoco se lee en la página: el punto de inicio lo marca el usuario. Y el último párrafo editado no es criterio de la página: el criterio es el clic o el cursor."
  citation: "fuente: `ms-word-lectura-voz-alta.html`; «Escuchar los documentos de Word con Lectura en voz alta»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-lectura-voz-alta-html
- id: m06-l04-q106
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Lectura en voz alta aumenta o disminuye la velocidad de lectura?"
  options:
  - id: a
    text:
      es: "Más (...) › Selección de voz"
  - id: b
    text:
      es: "La X de cierre del panel"
  - id: c
    text:
      es: "Inicio › Dictar › Transcripción"
  - id: d
    correct: true
    text:
      es: "Velocidad de reproducción"
  explanation:
    es: "La página dice: «Selecciona Velocidad de reproducción para aumentar o disminuir la velocidad de lectura». Selección de voz sirve para elegir una voz diferente. La X cierra Lectura en voz alta. Transcripción es la opción de Inicio › Dictar que abre el panel Transcribir."
  citation: "fuente: `ms-word-lectura-voz-alta.html`; «Escuchar los documentos de Word con Lectura en voz alta»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-lectura-voz-alta-html
- id: m06-l04-q107
  prompt:
    es: "En Word 365, ¿cómo se elige una voz diferente para que Lectura en voz alta lea el documento?"
  options:
  - id: a
    text:
      es: "Con Velocidad de reproducción"
  - id: b
    correct: true
    text:
      es: "Con Más (...) › Selección de voz"
  - id: c
    text:
      es: "Con la X de cierre de Lectura en voz alta"
  - id: d
    text:
      es: "Con Inicio › Dictar › Transcripción"
  explanation:
    es: "La página dice: «Selecciona Más (...)> Selección de voz para elegir una voz diferente para leer el documento». Velocidad de reproducción cambia la velocidad de lectura, no la voz. La X cierra Lectura en voz alta. Inicio › Dictar › Transcripción abre el panel Transcribir."
  citation: "fuente: `ms-word-lectura-voz-alta.html`; «Escuchar los documentos de Word con Lectura en voz alta»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q108
  prompt:
    es: "En Word 365, ¿cuál de las siguientes parejas recoge las dos maneras de transcribir la voz con la función Transcribir?"
  options:
  - id: a
    text:
      es: "Escribir en el panel Transcribir o cargar un archivo de audio"
  - id: b
    text:
      es: "Grabar directamente en Word o cargar un documento de texto"
  - id: c
    correct: true
    text:
      es: "Grabar directamente en Word o cargar un archivo de audio"
  - id: d
    text:
      es: "Dictar al micrófono o cargar un archivo de audio"
  explanation:
    es: "La página dice: «Puede transcribir la voz de dos maneras: Grabar directamente en Word, Cargar un archivo de audio». Escribir en el panel Transcribir no es una de ellas: el panel es donde se inicia la grabación o se elige cargar audio. Cargar un documento de texto no sirve: lo que se carga es «un archivo de audio pregrabado». Y dictar al micrófono es otra función: al grabar en Word, la página precisa que no verá texto en la página «como cuando dicta», es decir, dictar y transcribir son cosas distintas."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q109
  prompt:
    es: "Según la página de Microsoft, ¿cuál de las siguientes descripciones corresponde a la función Transcribir de Word 365?"
  options:
  - id: a
    correct: true
    text:
      es: "Convierte la voz en texto, con cada orador por separado"
  - id: b
    text:
      es: "Lee el documento en voz alta y resalta cada palabra"
  - id: c
    text:
      es: "Traduce el documento a otro idioma en una copia nueva"
  - id: d
    text:
      es: "Revisa la ortografía y la gramática de todo el documento"
  explanation:
    es: "La página dice: «La función Transcribir convierte la voz en una transcripción de texto con cada orador por separado». Resaltar cada palabra mientras se lee es lo que hace Lectura en voz alta. Traducir crea una copia del documento traducida automáticamente. Esa revisión se inicia con F7, que muestra el panel del Editor."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q110
  prompt:
    es: "¿Cuál de las siguientes cifras es el máximo de audio cargado que se puede transcribir al mes en Word 365 con una suscripción a Microsoft 365?"
  options:
  - id: a
    text:
      es: "30 000 minutos"
  - id: b
    correct: true
    text:
      es: "300 minutos"
  - id: c
    text:
      es: "3 000 minutos"
  - id: d
    text:
      es: "100 minutos"
  explanation:
    es: "La página dice: «Los usuarios con una suscripción a Microsoft 365 pueden transcribir un máximo de 300 minutos de audio cargado al mes». Los 30 000 minutos son la cifra de la línea siguiente, la de quien tiene una licencia de Microsoft Copilot. Los 3 000 y los 100 minutos no aparecen en la página como tope de ninguna de las dos modalidades: sus dos cifras son 300 y 30 000."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q111
  prompt:
    es: "¿Cuál de las siguientes cifras es el máximo de audio cargado que se puede transcribir al mes en Word 365 con una licencia de Microsoft Copilot?"
  options:
  - id: a
    text:
      es: "300 minutos"
  - id: b
    text:
      es: "3 000 minutos"
  - id: c
    correct: true
    text:
      es: "30 000 minutos"
  - id: d
    text:
      es: "60 000 minutos"
  explanation:
    es: "La página dice: «Los usuarios con una licencia de Microsoft Copilot pueden transcribir un máximo de 30 000 minutos de audio cargado al mes». Los 300 minutos son la cifra de la línea anterior, la de la suscripción a Microsoft 365. Los 3 000 y los 60 000 minutos no son el tope de ninguna de las dos modalidades de la página, que da solo 300 y 30 000."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q112
  prompt:
    es: "En Word para Microsoft 365 en Windows, ¿cuál de las siguientes rutas de la cinta abre la función Transcribir?"
  options:
  - id: a
    text:
      es: "Revisar › Dictar › Transcripción"
  - id: b
    text:
      es: "Insertar › Dictar › Transcripción"
  - id: c
    text:
      es: "Referencias › Transcripción"
  - id: d
    correct: true
    text:
      es: "Inicio › Dictar › Transcripción"
  explanation:
    es: "La página indica: «Ir a Inicio>Dictar>Transcripción». Dictar está en la pestaña Inicio, no en Revisar. Dictar está en la pestaña Inicio, no en Insertar. La página llega a Transcripción desde Inicio › Dictar, no desde Referencias."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q114
  prompt:
    es: "En el panel Transcribir de Word 365, ¿cuál de los siguientes botones permite transcribir un archivo de audio pregrabado?"
  options:
  - id: a
    text:
      es: "Iniciar grabación"
  - id: b
    text:
      es: "Agregar todo al documento"
  - id: c
    correct: true
    text:
      es: "Cargar audio"
  - id: d
    text:
      es: "Nueva transcripción"
  explanation:
    es: "La página indica: «En el panel Transcribir , seleccione Cargar audio». Después se elige el archivo en el selector de archivos. Iniciar grabación empieza a grabar la voz en Word. Agregar todo al documento pasa la transcripción al documento. Nueva transcripción elimina la transcripción actual o crea una nueva."
  citation: "fuente: `ms-word-transcribir.html`; «Cargar un archivo de audio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q115
  prompt:
    es: "En Word 365, al terminar de grabar con Transcribir, ¿qué hace el botón Guardar y transcribir ahora?"
  options:
  - id: a
    text:
      es: "Guarda la grabación en el disco local y cierra el panel Transcribir"
  - id: b
    correct: true
    text:
      es: "Guarda la grabación en OneDrive e inicia el proceso de transcripción"
  - id: c
    text:
      es: "Agrega la transcripción terminada al documento sin pasar por el panel"
  - id: d
    text:
      es: "Pausa la grabación para reanudarla después con el botón del micrófono"
  explanation:
    es: "La página dice: «Cuando hayas terminado, selecciona Guardar y transcribir ahora para guardar la grabación a OneDrive e iniciar el proceso de transcripción». La grabación se guarda en OneDrive, y el panel debe seguir abierto mientras se transcribe. El botón inicia el proceso de transcripción; agregar al documento es otro paso del panel. Pausar y reanudar se hace con el botón del micrófono."
  citation: "fuente: `ms-word-transcribir.html`; «Grabar en Word»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q117
  prompt:
    es: "¿Cuál de los siguientes conjuntos recoge los formatos de audio que admite la función Transcribir de Word 365?"
  options:
  - id: a
    correct: true
    text:
      es: ".wav, .mp4, .m4a y .mp3"
  - id: b
    text:
      es: ".wav, .mp3, .ogg y .flac"
  - id: c
    text:
      es: ".mp3, .aac, .wma y .avi"
  - id: d
    text:
      es: ".wav, .mp3, .m4a y .docx"
  explanation:
    es: "La página dice: «La función Transcribir admite actualmente los formatos .wav, .mp4, .m4a y .mp3». El conjunto con .ogg y .flac cambia dos de esos cuatro por formatos que la página no cita. El de .aac, .wma y .avi conserva solo .mp3 y añade tres que la página no da. Y el que termina en .docx mezcla tres formatos válidos con un formato de documento de Word, que no es de audio, cuando lo que se carga es «un archivo de audio»."
  citation: "fuente: `ms-word-transcribir.html`; «Cargar un archivo de audio»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q118
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones realiza el servicio de transcripción cuando en el audio hablan varias personas?"
  options:
  - id: a
    text:
      es: "Solo etiqueta al orador que grabó y deja el resto sin etiqueta"
  - id: b
    text:
