# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0085
  prompt:
    es: "A Moldes Barral, S.L. se le impone una sanción de 10.000 euros, tras suscribir un acta de conformidad. La resolución se le notifica el martes 10 de noviembre de 2026. La sociedad no recurre y ingresa el importe restante dentro del plazo del artículo 62.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria. Según el artículo 188 de esa ley, ¿cuánto ingresa y hasta qué día puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "4.200 euros, como muy tarde el lunes 21 de diciembre de 2026."
  - id: b
    text:
      es: "4.200 euros, como muy tarde el domingo 20 de diciembre de 2026."
  - id: c
    text:
      es: "3.000 euros, como muy tarde el lunes 21 de diciembre de 2026."
  - id: d
    text:
      es: "4.200 euros, como muy tarde el martes 5 de enero de 2027."
  explanation:
    es: "La sanción de 10.000 euros se reduce un 30 por ciento por conformidad (artículo 188.1.b LGT): 10.000 − 3.000 = 7.000. Sobre esos 7.000 se aplica el 40 por ciento (artículo 188.3): 7.000 − 2.800 = 4.200 euros. La notificación del día 10 está entre el 1 y el 15 del mes, y el plazo llega al 20 del mes posterior (artículo 62.2.a). El 20 de diciembre de 2026 es domingo y el plazo pasa al lunes 21. El resultado de 3.000 euros sale de restar los dos porcentajes sobre el importe inicial, y el 5 de enero aplica la regla de las notificaciones de la segunda quincena."
  citation: "art. 188.3 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-62
- id: m03-l13-q0087
  prompt:
    es: "A Beatriz Lara se le notifica el miércoles 3 de febrero de 2027 una sanción tributaria. No tiene conformidad ni acta con acuerdo y no piensa recurrir. Según el artículo 188.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria y el artículo 62.2 de la misma ley, ¿cuál es el último día para ingresarla y conservar la reducción del 40 por ciento?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes 22 de marzo de 2027, porque el día 20 es sábado y el plazo pasa al siguiente día hábil."
  - id: b
    text:
      es: "El lunes 5 de abril de 2027, porque es el día cinco del segundo mes posterior a la notificación."
  - id: c
    text:
      es: "El sábado 20 de marzo de 2027, porque es el día 20 del mes posterior a la notificación."
  - id: d
    text:
      es: "El viernes 19 de marzo de 2027, porque el plazo no puede acabar en un día inhábil."
  explanation:
    es: "La notificación del 3 de febrero está entre el 1 y el 15 del mes, así que el artículo 62.2.a LGT da plazo hasta el día 20 del mes posterior: el 20 de marzo de 2027. Es sábado, no hábil, y el plazo pasa al lunes 22. El 5 de abril sería la regla de las notificaciones de la segunda quincena. Y el plazo no se acorta al viernes: el artículo lo prolonga al siguiente día hábil."
  citation: "art. 62.2 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0089
  prompt:
    es: "De acuerdo con el artículo 188.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la reducción del 40 por ciento por pronto pago no es aplicable a las sanciones que procedan en los supuestos de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las actas con acuerdo del artículo 155."
  - id: b
    text:
      es: "Las declaraciones presentadas fuera de plazo sin requerimiento."
  - id: c
    text:
      es: "Las actas de conformidad del artículo 156."
  - id: d
    text:
      es: "Las actas de disconformidad firmadas por el obligado."
  explanation:
    es: "El artículo 188.3 LGT excluye de la reducción del 40 por ciento las sanciones de las actas con acuerdo, que ya tienen la del 65 por ciento. Las actas de conformidad sí la admiten, tras la reducción del 30 por ciento. Las de disconformidad y las declaraciones fuera de plazo no están excluidas por el texto."
  citation: "art. 188.3 LGT"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0090
  prompt:
    es: "Con Construcciones Vega, S.A. se suscribe un acta con acuerdo y se le impone una sanción de 20.000 euros. La sociedad no recurre y ingresa lo debido en plazo. Según el artículo 188 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué importe de sanción ingresa?"
  options:
  - id: a
    text:
      es: "14.000 euros, porque solo se aplica la reducción del 30 por ciento por conformidad."
  - id: b
    correct: true
    text:
      es: "7.000 euros, porque solo se aplica la reducción del 65 por ciento propia del acta con acuerdo."
  - id: c
    text:
      es: "12.000 euros, porque solo se aplica el 40 por ciento de reducción por pronto pago."
  - id: d
    text:
      es: "4.200 euros, porque se aplica el 65 por ciento y después el 40 por ciento por pronto pago del artículo 188.3."
  explanation:
    es: "En el acta con acuerdo se reduce el 65 por ciento (artículo 188.1.a LGT): 20.000 − 13.000 = 7.000 euros. El artículo 188.3 excluye el 40 por ciento para estas sanciones, así que no se aplica aunque se pague en plazo. Los 4.200 euros resultarían de acumularlo, los 14.000 de usar la reducción de conformidad y los 12.000 de usar solo el pronto pago."
  citation: "art. 188.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0091
  prompt:
    es: "Aurora Bernal suscribe un acta de conformidad y se le impone una sanción de 20.000 euros. Recurre solo la sanción y no la regularización. Según los artículos 188.3 y 212.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué reducciones conserva?"
  options:
  - id: a
    text:
      es: "Las dos, porque el 40 por ciento solo se pierde si se recurre la regularización."
  - id: b
    correct: true
    text:
      es: "La del 30 por ciento por conformidad, pero no la del 40 por ciento, porque ha recurrido la sanción."
  - id: c
    text:
      es: "Ninguna, porque recurrir la sanción hace perder tanto la reducción por conformidad como la del pronto pago."
  - id: d
    text:
      es: "La del 40 por ciento, pero no la del 30 por ciento, porque la conformidad se pierde al recurrir."
  explanation:
    es: "Según el artículo 212.2 LGT, recurrir la sanción sin impugnar la regularización no hace perder la reducción por conformidad del 30 por ciento. En cambio, el artículo 188.3.b exige no recurrir ni la liquidación ni la sanción para el 40 por ciento, y Aurora ha recurrido la sanción. La pérdida no alcanza a las dos reducciones, ni la conformidad es la que se pierde."
  citation: "art. 188.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0092
  prompt:
    es: "De acuerdo con el artículo 188.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se haya interpuesto recurso o reclamación en plazo contra la liquidación o la sanción, el importe de la reducción del 40 por ciento practicada:"
  options:
  - id: a
    correct: true
    text:
      es: "Se exige sin más requisito que la notificación al interesado."
  - id: b
    text:
      es: "Se mantiene hasta que el recurso o reclamación sea resuelto por el órgano competente."
  - id: c
    text:
      es: "Se pierde de forma definitiva, sin que pueda exigirse después ese importe."
  - id: d
    text:
      es: "Se exige tras un nuevo procedimiento en el que se dé audiencia al interesado."
  explanation:
    es: "El artículo 188.3 LGT permite exigir el importe de la reducción con la simple notificación al interesado, sin audiencia ni procedimiento nuevo, cuando se ha recurrido o reclamado en plazo. No se pierde sin más ni se mantiene hasta que se resuelva el recurso."
  citation: "art. 188.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0093
  prompt:
    es: "De acuerdo con el artículo 188.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se exija el importe de la reducción practicada y se hubiera interpuesto recurso contra la sanción reducida, se entiende que la cuantía a la que se refiere el recurso es:"
  options:
  - id: a
    text:
      es: "El importe de la sanción reducida, y los efectos suspensivos no alcanzan a la reducción exigida."
  - id: b
    text:
      es: "El importe total de la sanción, pero sin efectos suspensivos mientras dure el recurso."
  - id: c
    correct: true
    text:
      es: "El importe total de la sanción, y los efectos suspensivos se extienden a la reducción exigida."
  - id: d
    text:
      es: "El importe de la reducción exigida, que debe recurrirse de forma independiente."
  explanation:
    es: "El artículo 188.4 LGT dice que la cuantía recurrida es la de la sanción íntegra y que la suspensión del recurso se extiende a la reducción que se exija. No hace falta un recurso independiente contra la exigencia de la reducción si se había recurrido la sanción reducida."
  citation: "art. 188.4 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0222
  prompt:
    es: "Según el artículo 188.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las sanciones a las que se aplican las reducciones del 65 y del 30 por ciento:"
  options:
  - id: a
    text:
      es: "Se aplican solo a las sanciones pecuniarias impuestas según los artículos 191 a 193."
  - id: b
    correct: true
    text:
      es: "Se aplican a las sanciones pecuniarias impuestas según los artículos 191 a 197."
  - id: c
    text:
      es: "Se aplican a las sanciones pecuniarias y también a las sanciones no pecuniarias de carácter accesorio."
  - id: d
    text:
      es: "Se aplican a las sanciones pecuniarias impuestas según los artículos 191 a 206."
  explanation:
    es: "El artículo 188.1 LGT limita las reducciones a las sanciones pecuniarias de los artículos 191 a 197. No llegan hasta el artículo 206, no se reducen a los tres primeros artículos (incluyen la del 194) y no alcanzan a las sanciones accesorias del artículo 186."
  citation: "art. 188.1 LGT"
  difficulty: 2
  tags:
  - "alcance"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0224
  prompt:
    es: "Según el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las condiciones de la sanción anterior para que se entienda producida la comisión repetida:"
  options:
  - id: a
    text:
      es: "La sanción anterior debe ser por una infracción de la misma naturaleza, leve, grave o muy grave, aunque no sea firme."
  - id: b
    text:
      es: "La sanción anterior debe ser por una infracción de cualquier naturaleza, leve, grave o muy grave, y firme en vía administrativa."
  - id: c
    correct: true
    text:
      es: "La sanción anterior debe ser por una infracción de la misma naturaleza, leve, grave o muy grave, y firme en vía administrativa."
  - id: d
    text:
      es: "La sanción anterior debe ser por una infracción grave o muy grave de la misma naturaleza, y firme en vía administrativa."
  explanation:
    es: "El artículo 187.1.a LGT exige una sanción anterior firme en vía administrativa por una infracción de la misma naturaleza, de cualquier gravedad: la leve cuenta (con cinco puntos de incremento). No basta una sanción no firme y la naturaleza debe ser la misma, no cualquiera."
  citation: "art. 187.1.a LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0242
  prompt:
    es: "Según el artículo 188.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el aplazamiento o fraccionamiento de la sanción a efectos de la reducción del 40 por ciento:"
  options:
  - id: a
    correct: true
    text:
      es: "Sirve si se concede con garantía de aval o certificado de seguro de caución y se solicita antes de que finalice el plazo del artículo 62.2."
  - id: b
    text:
      es: "Sirve si se concede con garantía de aval o seguro de caución, aunque se solicite después de finalizado el plazo del artículo 62.2 de la ley."
  - id: c
    text:
      es: "Sirve si se concede sin garantía, siempre que se solicite antes de que finalice el plazo del artículo 62.2."
  - id: d
    text:
      es: "Sirve si se concede con cualquier garantía y se solicita en el mes siguiente a la finalización del plazo del artículo 62.2."
  explanation:
    es: "El artículo 188.3.a LGT admite el ingreso en los plazos de un aplazamiento o fraccionamiento concedido con garantía de aval o certificado de seguro de caución y solicitado antes de que finalice el plazo del artículo 62.2. No sirve cualquier garantía, la falta de garantía ni la solicitud tardía."
  citation: "art. 188.3 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "plazo"
# anchor: boe-a-2004-18398-art-7
- id: m03-l13-q0256
  prompt:
    es: "De acuerdo con el artículo 7.2 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, en los procedimientos de inspección se entenderá otorgada la conformidad cuando el obligado tributario que hubiese suscrito un acta de disconformidad:"
  options:
  - id: a
    text:
      es: "No interponga recurso o reclamación económico-administrativa contra la liquidación que se dicte."
  - id: b
    text:
      es: "Presente alegaciones al acta sin impugnar los hechos que en ella constan."
  - id: c
    text:
      es: "Ingrese la deuda resultante del acta dentro del plazo de ingreso en período voluntario."
  - id: d
    correct: true
    text:
      es: "Manifieste expresamente su conformidad antes de que se dicte el acto administrativo de liquidación."
  explanation:
    es: "En inspección también se entiende otorgada la conformidad cuando quien suscribió un acta de disconformidad manifiesta expresamente su conformidad antes de que se dicte el acto administrativo de liquidación (art. 7.2 RGRST). No recurrir la liquidación es la regla de los procedimientos de verificación de datos y comprobación limitada, no la de inspección (art. 7.1 RGRST). Ingresar la deuda o alegar sin impugnar los hechos no se recogen como forma de conformidad: la norma exige la manifestación expresa o la suscripción del acta de conformidad."
  citation: "art. 7.2 RGRST"
  difficulty: 3
  tags:
  - "conformidad"
  - "procedimiento de inspección"
# anchor: boe-a-2004-18398-art-5
- id: m03-l13-q0257
  prompt:
    es: "De acuerdo con el artículo 5.1 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, cuando el sujeto infractor hubiese sido sancionado por varias infracciones de la misma naturaleza en los cuatro años anteriores, de todas ellas se computará como único antecedente:"
  options:
  - id: a
    text:
      es: "La última infracción que se cometió antes de la nueva."
  - id: b
    correct: true
    text:
      es: "La infracción cuya calificación haya resultado más grave."
  - id: c
    text:
      es: "La primera infracción sancionada dentro de ese período de cuatro años."
  - id: d
    text:
      es: "La infracción por la que se impuso la sanción de mayor cuantía."
  explanation:
    es: "Cuando hay varias infracciones de la misma naturaleza sancionadas por resolución firme dentro de los cuatro años anteriores, se computa como único antecedente la infracción cuya calificación haya resultado más grave (art. 5.1 RGRST). El criterio es la calificación, no la fecha: ni la última ni la primera. Tampoco cuenta la cuantía de la sanción, porque dos infracciones de distinta calificación pueden tener sanciones de importe distinto sin que ese importe decida."
  citation: "art. 5.1 RGRST"
  difficulty: 2
  tags:
  - "graduación"
  - "comisión repetida"
