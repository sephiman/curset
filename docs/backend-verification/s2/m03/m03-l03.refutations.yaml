    anchor: jep-444#Observing-virtual-threads
    sentence: Accordingly, we will not extend traditional thread dumps to include virtual threads; we will, rather, introduce a new kind of thread dump in jcmd to present virtual threads alongside platform threads, all grouped in a meaningful way.
  - option: It pauses the application while it lists the threads
    anchor: jep-444#Observing-virtual-threads
    sentence: Moreover, because it might need to list a great many threads, generating a new thread dump does not pause the application.
  - option: It lists the object addresses and locks held by each thread
    anchor: jep-444#Observing-virtual-threads
    sentence: The new thread dump format does not include object addresses, locks, JNI statistics, heap statistics, and other information that appears in traditional thread dumps.
m03-l03-q19:
  key:
    anchor: jep-491#Choosing-between-synchronized-and-java-util-concurrent-locks
    sentence: 'If you are writing new code, we agree with the recommendation in Java Concurrency in Practice §13.4: Use synchronized where practical, since it is more convenient and less error prone, and use ReentrantLock and the other APIs in java.util.concurrent.locks when more flexibility is required.'
  wrong:
  - option: Migrate `synchronized` code to `ReentrantLock` before running it on virtual threads
    anchor: jep-491#Choosing-between-synchronized-and-java-util-concurrent-locks
    sentence: Once the synchronized keyword no longer pins virtual threads, such migration will no longer be necessary.
  - option: Convert every `ReentrantLock` back to `synchronized` in code that was already migrated
    anchor: jep-491#Choosing-between-synchronized-and-java-util-concurrent-locks
    sentence: You need not revert code that has been migrated to use ReentrantLock back to using synchronized.
  - option: 'Choose by thread type alone: `ReentrantLock` for virtual threads and `synchronized` for platform threads'
    anchor: jep-491#Choosing-between-synchronized-and-java-util-concurrent-locks
    sentence: Once the synchronized keyword no longer pins virtual threads, you can choose between synchronized and the APIs in the java.util.concurrent.locks package based solely upon which best solves the problem at hand.
