# anchor: boe-a-1996-4997-art-5
- id: m02-l01-q026
  prompt:
    es: "Según el artículo 5.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, en cada Ministerio el titular de la Subdirección General competente en información administrativa ostentará:"
  options:
  - id: a
    text:
      es: "La jefatura del Centro de Información Administrativa del Ministerio."
  - id: b
    text:
      es: "La dirección de la Inspección General de Servicios del departamento."
  - id: c
    correct: true
    text:
      es: "La jefatura de la unidad departamental de información administrativa."
  - id: d
    text:
      es: "La jefatura de las oficinas de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 5.1 dice que en cada Ministerio el titular de la Subdirección General que tenga encomendada la competencia sobre la información administrativa «ostentará la jefatura de la unidad departamental de información administrativa». El Centro de Información Administrativa es un órgano propio con nivel de Subdirección General (art. 6.1). La Inspección General de Servicios y las oficinas de las Delegaciones del Gobierno son otros órganos."
  citation: "art. 5.1 RD 208/1996"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-6
- id: m02-l01-q027
  prompt:
    es: "Según el artículo 6.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿qué nivel orgánico tiene el Centro de Información Administrativa?"
  options:
  - id: a
    correct: true
    text:
      es: "Nivel orgánico de Subdirección General."
  - id: b
    text:
      es: "Nivel orgánico de Dirección General."
  - id: c
    text:
      es: "Nivel orgánico de Secretaría General."
  - id: d
    text:
      es: "Nivel orgánico de Secretaría General Técnica."
  explanation:
    es: "El artículo 6.1 dice que el Centro de Información Administrativa está adscrito «con nivel orgánico de Subdirección General». Dirección General, Secretaría General y Secretaría General Técnica son niveles superiores."
  citation: "art. 6.1 RD 208/1996"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-6
- id: m02-l01-q028
  prompt:
    es: "Según el artículo 6.2.e) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿con quién colabora el Centro de Información Administrativa para organizar cursos de capacitación?"
  options:
  - id: a
    text:
      es: "Con el Centro de Investigaciones Sociológicas."
  - id: b
    correct: true
    text:
      es: "Con el Instituto Nacional de Administración Pública."
  - id: c
    text:
      es: "Con las organizaciones sindicales más representativas."
  - id: d
    text:
      es: "Con las universidades públicas de cada territorio."
  explanation:
    es: "El artículo 6.2.e) atribuye al Centro la función de «promover y organizar, en colaboración con el Instituto Nacional de Administración Pública, cursos de capacitación» en materias propias de las unidades de información administrativa. El Centro de Investigaciones Sociológicas, los sindicatos y las universidades no aparecen en esa letra."
  citation: "art. 6.2.e) RD 208/1996"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1996-4997-art-8
- id: m02-l01-q029
  prompt:
    es: "Según el artículo 8.a) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, las oficinas centrales de información y atención al ciudadano radicarán:"
  options:
  - id: a
    text:
      es: "En la sede de cada Delegación del Gobierno, salvo que circunstancias singulares aconsejen otro emplazamiento."
  - id: b
    text:
      es: "En la sede de cada Departamento ministerial, sin excepción alguna y sin oficinas delegadas."
  - id: c
    text:
      es: "En el edificio que determine en cada caso el Centro de Información Administrativa, según la demanda informativa."
  - id: d
    correct: true
    text:
      es: "En la sede de cada Departamento ministerial, salvo que circunstancias singulares aconsejen otro emplazamiento."
  explanation:
    es: "El artículo 8.a) dice que las oficinas centrales «radicarán en la sede de cada Departamento ministerial, salvo que circunstancias singulares aconsejen otro emplazamiento». El artículo regula los servicios centrales, no las Delegaciones del Gobierno. Admite la excepción de las circunstancias singulares y permite oficinas delegadas o puntos de información en otros edificios. No deja la ubicación al Centro de Información Administrativa."
  citation: "art. 8.a) RD 208/1996"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-9
- id: m02-l01-q030
  prompt:
    es: "Las oficinas de información y atención al ciudadano dependientes de las Delegaciones del Gobierno en las Comunidades Autónomas existen con el carácter de:"
  options:
  - id: a
    text:
      es: "Oficinas sectoriales de información y atención al ciudadano."
  - id: b
    correct: true
    text:
      es: "Oficinas centrales de información y atención al ciudadano."
  - id: c
    text:
      es: "Oficinas delegadas de las oficinas de los servicios centrales."
  - id: d
    text:
      es: "Oficinas integradas con las de la Comunidad Autónoma."
  explanation:
    es: "El artículo 9.1 RD 208/1996 dice que existirán, «con el carácter de oficinas centrales», las oficinas dependientes de las Delegaciones del Gobierno en las Comunidades Autónomas. Las sectoriales son las de los servicios provinciales de los departamentos (art. 9.2). Las oficinas delegadas dependen de las centrales de cada Departamento (art. 8.a). Las integradas exigen un convenio entre Administraciones (art. 10)."
  citation: "art. 9.1 RD 208/1996"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-10
- id: m02-l01-q031
  prompt:
    es: "Según el artículo 10 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿qué puede acordarse también mediante convenio de colaboración entre distintas Administraciones públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La creación de oficinas integradas de información con participación de varias Administraciones públicas."
  - id: b
    text:
      es: "La delegación en una de las Administraciones firmantes de las competencias de resolución de todas las demás."
  - id: c
    text:
      es: "El traspaso del personal de las oficinas de información entre las distintas Administraciones públicas firmantes."
  - id: d
    text:
      es: "La supresión de las oficinas de información de las Administraciones públicas que no lo hayan firmado."
  explanation:
    es: "El artículo 10 permite acordar por convenio que desde las oficinas de cada Administración se informe sobre las otras y, además, «la creación de oficinas integradas de información con participación de varias Administraciones públicas». El artículo se limita a la información: no prevé delegar competencias de resolución, traspasar personal ni suprimir oficinas de terceros."
  citation: "art. 10 RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-4997-art-2
- id: m02-l01-q032
  prompt:
    es: "¿Cuál de las siguientes es información general según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano?"
  options:
  - id: a
    text:
      es: "La concerniente al estado o contenido de los procedimientos administrativos que estén en tramitación."
  - id: b
    text:
      es: "La relativa a la identificación de las autoridades y del personal bajo cuya responsabilidad se tramita un procedimiento."
  - id: c
    correct: true
    text:
      es: "La relativa a los requisitos jurídicos o técnicos que las disposiciones impongan a los proyectos de los ciudadanos."
  - id: d
    text:
      es: "La referida a datos de carácter personal que afecten a la intimidad de las personas físicas."
  explanation:
    es: "El artículo 2.1 incluye en la información general la referida «a los requisitos jurídicos o técnicos que las disposiciones impongan a los proyectos, actuaciones o solicitudes que los ciudadanos se propongan realizar». El estado o contenido de los procedimientos en tramitación y la identificación del personal que los tramita son información particular (art. 3.1). Los datos personales que afectan a la intimidad también son información particular (art. 3.2)."
  citation: "art. 2.1 RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-2
- id: m02-l01-q033
  prompt:
    es: "Un ciudadano que no es interesado en ningún procedimiento pide en una oficina de información de un Ministerio los requisitos para solicitar una beca. ¿Qué clase de información es y cómo se le facilita?"
  options:
  - id: a
    correct: true
    text:
      es: "Información general; se le facilitará obligatoriamente, sin exigirle acreditar legitimación alguna."
  - id: b
    text:
      es: "Información general; se le facilitará solo si la pide por escrito y acredita su identidad."
  - id: c
    text:
      es: "Información general; se le facilitará previo pago de la tasa que corresponda por el servicio."
  - id: d
    text:
      es: "Información particular; se le facilitará en el plazo de diez días a contar desde su solicitud."
  explanation:
    es: "Los requisitos para solicitar una prestación son información general (art. 2.1 RD 208/1996), y el artículo 2.2 dice que «se facilitará obligatoriamente a los ciudadanos, sin exigir para ello la acreditación de legitimación alguna». Exigir que la pida por escrito y se identifique, o que pague una tasa, añade condiciones que el artículo excluye. No es información particular, que es la relativa al estado o contenido de procedimientos en tramitación (art. 3.1)."
  citation: "art. 2.2 RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l01-q034
  prompt:
    es: "Según el artículo 3.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información particular sólo podrá ser facilitada:"
  options:
  - id: a
    text:
      es: "A quienes acrediten un interés legítimo, aunque no sean interesados en el procedimiento."
  - id: b
    text:
      es: "A los interesados y a cualquier persona que autorice el órgano que tramita el procedimiento."
  - id: c
    text:
      es: "A los interesados en cada procedimiento, excluidos en todo caso sus representantes legales."
  - id: d
    correct: true
    text:
      es: "A quienes tengan la condición de interesados en cada procedimiento o a sus representantes legales."
  explanation:
    es: "El artículo 3.1 dice que la información particular «sólo podrá ser facilitada a las personas que tengan la condición de interesados en cada procedimiento o a sus representantes legales». No basta un interés legítimo sin ser interesado, el órgano no puede ampliar el círculo por autorización y los representantes legales sí están incluidos."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l01-q035
  prompt:
    es: "¿A quién está reservada, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información sobre documentos con datos personales que afecten a la intimidad?"
  options:
  - id: a
    text:
      es: "A los interesados en el procedimiento en que consten."
  - id: b
    correct: true
    text:
      es: "A las personas a que se refieran esos datos."
  - id: c
    text:
      es: "A cualquier ciudadano que acredite un interés legítimo."
  - id: d
    text:
      es: "A los órganos judiciales y al Ministerio Fiscal."
  explanation:
    es: "El artículo 3.2 dice que la información sobre documentos con datos de esta naturaleza «estará reservada a las personas a que se refieran», con las limitaciones de la legislación que cita. Los interesados en el procedimiento no tienen por ello acceso a los datos íntimos de otra persona. El interés legítimo no basta. El artículo no reserva esa información a jueces y fiscales."
  citation: "art. 3.2 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q036
  prompt:
    es: "Según el artículo 4.d) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿quiénes pueden formular las iniciativas o sugerencias para mejorar la calidad de los servicios?"
  options:
  - id: a
    text:
      es: "Solo los ciudadanos interesados en un procedimiento."
  - id: b
    text:
      es: "Solo las asociaciones de usuarios inscritas."
  - id: c
    correct: true
    text:
      es: "Los ciudadanos o los propios empleados públicos."
  - id: d
    text:
      es: "Solo los empleados públicos del servicio afectado."
  explanation:
    es: "El artículo 4.d) se refiere a las iniciativas o sugerencias «formuladas por los ciudadanos, o por los propios empleados públicos». No exige ser interesado en un procedimiento ni formar parte de una asociación inscrita, y no las reserva a los empleados del servicio afectado."
  citation: "art. 4.d) RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-14
- id: m02-l01-q037
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la unidad responsable de la gestión de las quejas y sugerencias en la Administración General del Estado es correcta?"
  options:
  - id: a
    text:
      es: "Recoge las manifestaciones de insatisfacción con los servicios, pero no las iniciativas para mejorar su calidad."
  - id: b
    correct: true
    text:
      es: "Recoge y tramita tanto las manifestaciones de insatisfacción con los servicios como las iniciativas para mejorar su calidad."
  - id: c
    text:
      es: "Recoge las iniciativas para mejorar la calidad y remite las quejas a la Inspección General de Servicios para su tramitación."
  - id: d
    text:
      es: "Recoge y tramita las quejas, y solo responde a las sugerencias que los usuarios presentan presencialmente en la unidad."
  explanation:
    es: "El artículo 14 RD 951/2005 crea la unidad para «recoger y tramitar tanto las manifestaciones de insatisfacción de los usuarios con los servicios como las iniciativas para mejorar su calidad», y le encarga dar respuesta a las quejas y sugerencias. Excluir las iniciativas, remitir las quejas a la Inspección en lugar de tramitarlas o responder solo a las sugerencias presenciales contradice ese artículo."
  citation: "art. 14 RD 951/2005"
  difficulty: 2
  tags:
  - "competencia"
