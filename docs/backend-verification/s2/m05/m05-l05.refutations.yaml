m05-l05-q11:
  key:
    anchor: spring-fw-webmvc-handlermapping-interceptor#page-title
    sentence: Interceptors are not ideally suited as a security layer due to the potential for a mismatch with annotated controller path matching.
  wrong:
  - option: They run only after the handler has already been invoked
    anchor: spring-fw-webmvc-dispatcher-special-beans#page-title
    sentence: Map a request to a handler along with a list of interceptors for pre- and post-processing.
  - option: They cannot stop a request before a view is rendered
    anchor: spring-fw-webmvc-dispatcher-sequence#page-title
    sentence: If no model is returned (maybe due to a preprocessor or postprocessor intercepting the request, perhaps for security reasons), no view is rendered, because the request could already have been fulfilled.
  - option: They can only be registered through XML configuration
    anchor: spring-fw-webmvc-handlermapping-interceptor#page-title
    sentence: By contrast, the Java config passes interceptors only to the HandlerMapping beans it manages.
m05-l05-q12:
