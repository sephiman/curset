# anchor: fuente-ms-win-recortes-html
- id: m02-l07-q147
  prompt:
    es: "En la herramienta Recortes de Windows 11, tras capturar una imagen, ¿qué botones permiten escribir o dibujar sobre ella o alrededor de ella?"
  options:
  - id: a
    text:
      es: "Borrador y Formas"
  - id: b
    text:
      es: "Deshacer y Rehacer"
  - id: c
    correct: true
    text:
      es: "Lápiz y Resaltador"
  - id: d
    text:
      es: "Acciones de texto y Recorte de imagen"
  explanation:
    es: "La página dice que se escribe o dibuja sobre el recorte con los botones Lápiz o Resaltador. Borrador quita las líneas o formas agregadas, Formas añade formas o emojis, Deshacer y Rehacer revierten anotaciones, Acciones de texto extrae texto y Recorte de imagen recorta la imagen."
  citation: "fuente: `ms-win-recortes.html`; «Anotar un recorte»"
