# SPDX-License-Identifier: AGPL-3.0-only
# The course glossary (content/README.md, "The glossary"). Empty until S2: a term is added only after a lesson
# uses it, in the wording of its cited source, and the loader rejects one that does not appear in the prose.
terms:

# pg-mvcc-intro#MVCC-INTRO
- id: g-mvcc
  en: Multiversion Concurrency Control (MVCC)
  origin: m06-l01
  definition:
    en: Data consistency is maintained by using a multiversion model, so that each SQL statement sees a snapshot
      of data as it was some time ago, regardless of the current state of the underlying data.

# pg-wal-intro#WAL-INTRO
- id: g-write-ahead-logging
  en: Write-Ahead Logging (WAL)
  origin: m06-l01
  definition:
    en: 'A standard method for ensuring data integrity: changes to data files must be written only after those changes
      have been logged, that is, after WAL records describing the changes have been flushed to permanent storage.'

# pg-routine-vacuuming#VACUUM-FOR-WRAPAROUND
- id: g-transaction-id-wraparound
  en: transaction ID wraparound
  origin: m06-l01
  definition:
    en: Since transaction IDs have a limited size of 32 bits, a cluster that runs for more than 4 billion transactions
      would see the XID counter wrap around to zero, and transactions that were in the past appear to be in the
      future.

# pg-transaction-iso#TRANSACTION-ISO
- id: g-phantom-read
  en: phantom read
  origin: m06-l01
  definition:
    en: A transaction re-executes a query returning a set of rows that satisfy a search condition and finds that
      the set of rows satisfying the condition has changed due to another recently committed transaction.

# pg-transaction-iso#TRANSACTION-ISO
- id: g-dirty-read
  en: dirty read
  origin: m06-l01
  definition:
    en: A transaction reads data written by a concurrent uncommitted transaction.

# pg-transaction-iso#XACT-SERIALIZABLE
- id: g-predicate-locking
  en: predicate locking
  origin: m06-l01
  definition:
    en: Keeping locks that allow the database to determine when a write would have had an impact on the result of
      a previous read from a concurrent transaction, had it run first.

# pg-transaction-iso#TRANSACTION-ISO
- id: g-nonrepeatable-read
  en: nonrepeatable read
  origin: m06-l02
  definition:
    en: A transaction re-reads data it has previously read and finds that data has been modified by another transaction
      (that committed since the initial read).

# pg-transaction-iso#TRANSACTION-ISO
- id: g-serialization-anomaly
  en: serialization anomaly
  origin: m06-l02
  definition:
    en: The result of successfully committing a group of transactions is inconsistent with all possible orderings
      of running those transactions one at a time.

# jakarta-persistence-spec#a2056
- id: g-optimistic-locking
  en: optimistic locking
  origin: m06-l02
  definition:
    en: A system of concurrency control where each revision of an item of data is assigned a version number or timestamp.

# pg-indexes-partial#INDEXES-PARTIAL
- id: g-partial-index
  en: partial index
  origin: m06-l03
  definition:
    en: An index built over a subset of a table; the subset is defined by a conditional expression, called the predicate
      of the partial index. The index contains entries only for those table rows that satisfy the predicate.

# pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
- id: g-covering-index
  en: covering index
  origin: m06-l03
  definition:
    en: An index specifically designed to include the columns needed by a particular type of query that you run
      frequently, so that index-only scans can be used.

# pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
- id: g-index-only-scan
  en: index-only scan
  origin: m06-l03
  definition:
    en: A scan that can answer a query from an index alone, without any heap access, by returning values directly
      out of each index entry instead of consulting the associated heap entry.

# pg-ddl-partitioning#DDL-PARTITION-PRUNING
- id: g-partition-pruning
  en: partition pruning
  origin: m06-l03
  definition:
    en: 'A query optimization technique that improves performance for declaratively partitioned tables: when the
      planner can prove that a partition could not contain any rows meeting the query''s WHERE clause, it excludes
      the partition from the query plan.'

# pg-indexes-types#INDEXES-TYPES-GIN
- id: g-inverted-index
  en: inverted index
  origin: m06-l03
  definition:
    en: An index that contains a separate entry for each component value of a data value that holds multiple component
      values, such as an array, and can efficiently handle queries that test for the presence of specific component
      values.

# liquibase-changeset#main-header
- id: g-changeset
  en: changeset
  origin: m06-l04
  definition:
    en: The basic unit of change in Liquibase. Changesets are stored in the changelog and contain change types that
      specify what each change does, like creating a new table or adding a column to an existing table.

# flyway-migrations#migrations
- id: g-migrations
  en: migrations
  origin: m06-l04
  definition:
    en: SQL scripts that capture incremental changes to a development database, schema and data changes alike. The
      same scripts are run in the same order on each environment, which gives a repeatable deployment process.
  link_except: [m00-l01, m08-l05]  # leadership sense in m00-l01, virtual machine migrations in m08-l05

# jls-8-records#jls-8.10
- id: g-record-class
  en: record class
  origin: m01-l01
  definition:
    en: A restricted kind of class that defines a simple aggregate of values.

# jls-14-statements#jls-14.30.1
- id: g-record-pattern
  en: record pattern
  origin: m01-l01
  definition:
    en: A pattern used to test whether a value is an instance of a record class type and, if it is, to recursively
      perform pattern matching on the record component values.

# jls-14-statements#jls-14.30.2
- id: g-pattern-matching
  en: pattern matching
  origin: m01-l01
  link_except: [m09-l01, m09-l05, m10-l04]  # SQL LIKE operators and exact-string matching, not Java pattern matching
  definition:
    en: The process of testing a value against a pattern at run time.

# javadoc-proxy#class-proxy
- id: g-proxy-class
  en: proxy class
  origin: m01-l02
  definition:
    en: A class created at runtime that implements a specified list of interfaces, known as proxy interfaces.

# javadoc-proxy#class-proxy
- id: g-invocation-handler
  en: invocation handler
  origin: m01-l02
  definition:
    en: The object associated with each proxy instance, which implements the interface InvocationHandler and to
      which method invocations on the proxy instance are dispatched.

# spring-fw-aop-proxying#proxying-mechanisms
- id: g-cglib
  en: CGLIB
  origin: m01-l02
  definition:
    en: A common open-source class definition library, repackaged into spring-core, that Spring AOP uses to create
      a runtime-generated subclass of the target type.

# spring-modulith-fundamentals#modules
- id: g-application-module
  en: application module
  origin: m01-l03
  definition:
    en: In a Spring Boot application, an application module is a unit of functionality that exposes an API to other
      modules and keeps internal implementation components that other modules are not supposed to access.

# spring-data-commons-domain-events#page-title
- id: g-aggregate-root
  en: aggregate root
  origin: m01-l03
  definition:
    en: An entity managed by a repository. In a Domain-Driven Design application, aggregate roots usually publish
      domain events.

# spring-fw-tx-declarative-annotations#using-transactional
- id: g-self-invocation
  en: self invocation
  origin: m01-l04
  definition:
    en: A method within the target object calling another method of the target object, which in proxy mode does
      not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.

# javadoc-forkjoinpool#class-forkjoinpool
- id: g-common-pool
  en: common pool
  origin: m01-l04
  definition:
    en: The static ForkJoinPool returned by ForkJoinPool.commonPool(), used by any ForkJoinTask that is not explicitly
      submitted to a specified pool.

# javadoc-forkjoinpool#class-forkjoinpool
- id: g-work-stealing
  en: work-stealing
  origin: m01-l04
  definition:
    en: 'The way a ForkJoinPool runs tasks: all threads in the pool attempt to find and execute tasks submitted
      to the pool and/or created by other active tasks.'

# jdk-troubleshoot-memleaks#JSTGD-GUID-4B841E7E-C533-447B-B093-58CEE13B962A
- id: g-heap-dump
  en: heap dump
  origin: m03-l01
  definition:
    en: The most important data to troubleshoot memory leaks; it can be collected using jcmd, jmap, JConsole tools,
      and the -XX:+HeapDumpOnOutOfMemoryError Java option.

# jdk-troubleshoot-tools#JSTGD-GUID-489BB790-A7C7-4CF0-9A6B-63FA12230238
- id: g-thread-dump
  en: thread dump
  origin: m03-l01
  definition:
    en: The thread stack, including the thread state, for all Java threads in the virtual machine. It does not terminate
      the application.

# jdk-troubleshoot-memleaks#JSTGD-GUID-2A57EA14-3A39-4E6D-90FA-95788A9C3605
- id: g-memory-leak
  en: memory leak
  origin: m03-l01
  definition:
    en: A memory leak occurs when an application unintentionally holds references to Java objects or classes, preventing
      them from being garbage collected.

# jdk-troubleshoot-memleaks#JSTGD-GUID-2A57EA14-3A39-4E6D-90FA-95788A9C3605
- id: g-live-set
  en: live set
  origin: m03-l01
  definition:
    en: The amount of Java heap space or Metaspace being used after a full garbage collection.

# jdk-troubleshoot-memleaks#JSTGD-GUID-19F6D28E-75A1-4480-9879-D0932B2F305B
- id: g-metaspace
  en: Metaspace
  origin: m03-l01
  definition:
    en: Native memory in which Java class metadata is allocated.

# jdk-troubleshoot-jfr#JSTGD-GUID-3839D694-F0F7-4E43-93BE-3BF13F4D2102
- id: g-tlab
  en: TLAB
  origin: m03-l01
  definition:
    en: A small memory area where new objects are allocated. Once a TLAB is full, the thread gets a new one.

# jdk-tool-java#ahead-of-time-cache
- id: g-ahead-of-time-cache
  en: AOT cache
  origin: m03-l01
  definition:
    en: A container, introduced in JDK 24, for storing artifacts produced by ahead-of-time optimizations.

# graalvm-native-image-basics#static-analysis
- id: g-closed-world-assumption
  en: closed-world assumption
  origin: m03-l01
  definition:
    en: The constraint that once a native image is built, no new elements can be added at run time, for example
      through class loading.

# jls-17#jls-17.4.5
- id: g-happens-before
  en: happens-before
  origin: m03-l02
  definition:
    en: If one action happens-before another, then the first is visible to and ordered before the second.

# jls-17#jls-17.4.5
- id: g-data-race
  en: data race
  origin: m03-l02
  definition:
    en: When a program contains two conflicting accesses that are not ordered by a happens-before relationship,
      it is said to contain a data race.

# javadoc-semaphore#class-semaphore
- id: g-binary-semaphore
  en: binary semaphore
  origin: m03-l02
  definition:
    en: 'A semaphore initialized to one and used such that it only has at most one permit available, so it only
      has two states: one permit available, or zero permits available.'

# jls-17#jls-17.4.5
- id: g-correctly-synchronized
  en: correctly synchronized
  origin: m03-l02
  definition:
    en: A program is correctly synchronized if and only if all sequentially consistent executions are free of data
      races.

# jls-17#jls-17.4.3
- id: g-sequential-consistency
  en: sequentially consistent
  origin: m03-l02
  definition:
    en: A set of actions is sequentially consistent if all actions occur in a total order that is consistent with
      program order, and each read of a variable sees the value written by the latest preceding write to it in that
      order.

# jep-444#Summary
- id: g-virtual-thread
  en: virtual thread
  origin: m03-l03
  definition:
    en: A lightweight thread that dramatically reduces the effort of writing, maintaining, and observing high-throughput
      concurrent applications.

# javadoc-thread#platform-threads
- id: g-platform-thread
  en: platform thread
  origin: m03-l03
  definition:
    en: A thread that is typically mapped 1:1 to a kernel thread scheduled by the operating system.

# jep-444#Scheduling-virtual-threads
- id: g-carrier-thread
  en: carrier
  origin: m03-l03
  link_except: [m01-l01, m04-l02]  # there "carrier" is a record as a data carrier, a false friend
  definition:
    en: The platform thread to which the scheduler assigns a virtual thread.

# jep-505#Summary
- id: g-structured-concurrency
  en: structured concurrency
  origin: m03-l03
  definition:
    en: An approach that treats groups of related tasks running in different threads as single units of work, thereby
      streamlining error handling and cancellation, improving reliability, and enhancing observability.

# javadoc-scopedvalue#class-scopedvalue-t
- id: g-scoped-value
  en: scoped value
  origin: m03-l03
  definition:
    en: A value that may be safely and efficiently shared to methods without using method parameters.

# javadoc-threadlocal#class-threadlocal-t
- id: g-thread-local-variable
  en: thread-local variable
  origin: m03-l03
  definition:
    en: A variable of which each thread that accesses it has its own, independently initialized copy.

# jdk-troubleshoot-tools#JSTGD-GUID-D38849B6-61C7-4ED6-A395-EA4BC32A9FD6
- id: g-flight-recorder
  en: Flight Recorder
  origin: m03-l04
  definition:
    en: A profiling and event collection framework built into the JDK.

# jdk-troubleshoot-tools#JSTGD-GUID-47A98C88-95B1-4842-9B0D-67BBDB266214
- id: g-jdk-mission-control
  en: JDK Mission Control
  origin: m03-l04
  definition:
    en: A production-time profiling and diagnostics tool that includes tools to monitor and manage your Java application
      with a very small performance overhead.

# jmh-sample-deadcode#_R_7lcpala9lik5_
- id: g-dead-code-elimination
  en: dead-code elimination
  origin: m03-l04
  definition:
    en: The optimization in which compilers deduce that some computations are redundant and eliminate them completely.

# jmh-sample-constantfold#_R_7lcpala9lik5_
- id: g-constant-folding
  en: constant folding
  origin: m03-l04
  definition:
    en: The optimization in which, if the JVM realizes the result of the computation is the same no matter what,
      it can cleverly optimize it, for example by moving the computation outside of the internal loop.

# wrk2-readme#acknowledgements
- id: g-coordinated-omission
  en: Coordinated Omission
  origin: m03-l04
  definition:
    en: An effect in a load generator through which most of the high latency artifacts exhibited by the measured
      server are ignored, because each connection only begins to send a request after receiving a response.

# javadoc-hashmap#class-hashmap-k-v
- id: g-load-factor
  en: load factor
  origin: m02-l01
  definition:
    en: The load factor is a measure of how full the hash table is allowed to get before its capacity is automatically
      increased.

# erickson-hashing#p4
- id: g-chained-hash-table
  en: chained hash table
  origin: m02-l01
  definition:
    en: In a chained hash table, each entry T [i] is not just a single item, but rather (a pointer to) a linked
      list of all the items that hash to T [i].

# javadoc-arrays#binarySearch(int[],int)
- id: g-insertion-point
  en: insertion point
  origin: m02-l02
  definition:
    en: 'The insertion point is defined as the point at which the key would be inserted into the array: the index
      of the first element greater than the key, or a.length if all elements in the array are less than the specified
      key.'

# javadoc-deque#interface-deque-e
- id: g-deque
  en: deque
  origin: m02-l03
  definition:
    en: A linear collection that supports element insertion and removal at both ends.

# ods-6-1-binarytree-basic-binary#SECTION00912000000000000000
- id: g-breadth-first-traversal
  en: breadth-first traversal
  origin: m02-l03
  definition:
    en: In a breadth-first traversal, the nodes are visited level-by-level starting at the root and moving down,
      visiting the nodes at each level from left to right

# ods-12-1-adjacencymatrix-repres#SECTION001510000000000000000
- id: g-adjacency-matrix
  en: adjacency matrix
  origin: m02-l04
  definition:
    en: A way of representing a graph with n vertices by an n by n matrix whose entries are boolean values.

# ods-12-3-graph-traversal#SECTION001531000000000000000
- id: g-breadth-first-search
  en: breadth-first search
  origin: m02-l04
  definition:
    en: An algorithm that starts at a vertex and visits first the neighbours of that vertex, then the neighbours
      of the neighbours, and so on.

# ods-12-3-graph-traversal#SECTION001532000000000000000
- id: g-depth-first-search
  en: depth-first search
  origin: m02-l04
  definition:
    en: An algorithm similar to breadth-first search except that it uses a stack instead of a queue.

# erickson-dfs#p7
- id: g-directed-acyclic-graph
  en: directed acyclic graph
  origin: m02-l04
  definition:
    en: A directed graph with no directed cycles, also called a dag.

# erickson-union-find#p4
- id: g-path-compression
  en: path compression
  origin: m02-l04
  definition:
    en: A modification to Find that, once the leader of an object x is determined, redirects the parent pointer
      of x directly to that leader.

# erickson-backtracking#p9
- id: g-backtracking
  en: backtracking
  origin: m02-l05
  definition:
    en: A recursive technique commonly used to make a sequence of decisions, with the goal of building a recursively
      defined structure satisfying certain constraints.

# erickson-dynamic-programming#p3
- id: g-memoization
  en: memoisation
  origin: m02-l05
  definition:
    en: Writing down the results of recursive calls and looking them up again if they are needed later.

# erickson-dynamic-programming#p9
- id: g-dynamic-programming
  en: dynamic programming
  origin: m02-l05
  definition:
    en: 'Recursion without repetition: the algorithm stores the solutions of intermediate subproblems, often but
      not always in some kind of array or table.'

# erickson-dynamic-programming#p11
- id: g-greedy-algorithm
  en: greedy algorithm
  origin: m02-l05
  definition:
    en: An algorithm that constructs a solution through a series of decisions, like a backtracking algorithm, but
      makes those decisions directly, without solving any recursive subproblems.

# erickson-dynamic-programming#p15
- id: g-edit-distance
  en: edit distance
  origin: m02-l05
  definition:
    en: The minimum number of letter insertions, letter deletions and letter substitutions required to transform
      one string into the other.

# javadoc-iterator#interface-iterator-e
- id: g-iterator
  en: iterator
  origin: m02-l06
  definition:
    en: An iterator over a collection; iterators allow the caller to remove elements from the underlying collection
      during the iteration with well-defined semantics.

# ods-10-1-binaryheap-implicit-bi#SECTION001310000000000000000
- id: g-binary-heap
  en: binary heap
  origin: m02-l06
  definition:
    en: A structure that implicitly represents a complete binary tree in which the elements are heap-ordered.

# kotlin-docs-java-interop#null-safety-and-platform-types
- id: g-platform-type
  en: platform type
  origin: m04-l01
  definition:
    en: Types of Java declarations are treated in Kotlin as non-denotable and called platform types.

# kotlin-docs-typecasts#smart-casts
- id: g-smart-cast
  en: smart cast
  origin: m04-l01
  definition:
    en: The compiler tracks the type checks and explicit casts for immutable values and inserts implicit (safe)
      casts automatically.

# kotlin-docs-null-safety#elvis-operator
- id: g-elvis-operator
  en: Elvis operator
  origin: m04-l01
  definition:
    en: 'If the expression to the left of ?: is not null, the Elvis operator returns it. Otherwise, the Elvis operator
      returns the expression to the right.'

# kotlin-docs-generics#declaration-site-variance
- id: g-declaration-site-variance
  en: declaration-site variance
  origin: m04-l01
  definition:
    en: The out modifier is called a variance annotation, and since it is provided at the type parameter declaration
      site, it provides declaration-site variance.

# kotlin-docs-generics#type-erasure
- id: g-type-erasure
  en: type erasure
  origin: m04-l01
  definition:
    en: At runtime, the instances of generic types do not hold any information about their actual type arguments.
      The type information is said to be erased.

# kotlin-docs-data-classes#data-classes.md
- id: g-data-class
  en: data class
  origin: m04-l02
  definition:
    en: Data classes in Kotlin are primarily used to hold data.

# jep-409#Summary
- id: g-sealed-class
  en: sealed class
  origin: m04-l02
  definition:
    en: Sealed classes and interfaces restrict which other classes or interfaces may extend or implement them.

# kotlin-docs-object-declarations#object-declarations-overview
- id: g-object-declaration
  en: object declaration
  origin: m04-l02
  definition:
    en: You can create single instances of objects in Kotlin using object declarations, which always have a name
      following the object keyword.

# kotlin-docs-inline-classes#inline-classes.md
- id: g-inline-class
  en: inline class
  origin: m04-l02
  definition:
    en: Inline classes are a subset of value-based classes. They don't have an identity and can only hold values.

# kotlin-docs-control-flow#guard-conditions-in-when-expressions
- id: g-guard-condition
  en: guard condition
  origin: m04-l02
  definition:
    en: Guard conditions allow you to include more than one condition to the branches of a when expression or statement,
      making complex control flow more explicit and concise.

# coroutines-api-supervisor-job#content
- id: g-supervisor-job
  en: SupervisorJob
  origin: m04-l03
  definition:
    en: Children of a supervisor job can fail independently of each other.

# kotlin-docs-coroutines-basics#coroutine-dispatchers
- id: g-coroutine-dispatcher
  en: coroutine dispatcher
  origin: m04-l03
  definition:
    en: A coroutine dispatcher controls which thread or thread pool coroutines use for their execution.

# kotlin-docs-flow#hot-flows
- id: g-hot-flow
  en: hot flow
  origin: m04-l03
  definition:
    en: Hot flows are shared streams that emit values independently of collectors.

# mockk-docs#relaxed-mock
- id: g-relaxed-mock
  en: relaxed mock
  origin: m04-l04
  definition:
    en: A relaxed mock is the mock that returns some simple value for all functions. This allows you to skip specifying
      behavior for each case, while still stubbing things you need.

# coroutines-api-test-scheduler#content
- id: g-test-coroutine-scheduler
  en: TestCoroutineScheduler
  origin: m04-l04
  definition:
    en: A scheduler for coroutines used in tests, providing the delay-skipping behavior.

# spring-fw-beans-factory-extension#beans-factory-extension-bpp
- id: g-bean-post-processor
  en: BeanPostProcessor
  origin: m05-l01
  definition:
    en: The BeanPostProcessor interface defines callback methods that you can implement to provide your own (or
      override the container’s default) instantiation logic, dependency resolution logic, and so forth.

# spring-fw-beans-factory-scopes#beans-factory-scopes-prototype
- id: g-prototype-scope
  en: prototype scope
  origin: m05-l01
  definition:
    en: The non-singleton prototype scope of bean deployment results in the creation of a new bean instance every
      time a request for that specific bean is made.

# spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
- id: g-circular-dependency
  en: circular dependency
  origin: m05-l01
  definition:
    en: A circular dependency between bean A and bean B forces one of the beans to be injected into the other prior
      to being fully initialized itself.

# spring-boot-using-auto-configuration#page-title
- id: g-auto-configuration
  en: auto-configuration
  origin: m05-l02
  definition:
    en: Spring Boot auto-configuration attempts to automatically configure your Spring application based on the
      jar dependencies that you have added.

# spring-boot-using-build-systems#using.build-systems.starters
- id: g-starter
  en: starter
  origin: m05-l02
  link_except: [m12-l01]  # there the word means conversation starters
  definition:
    en: Starters are a set of convenient dependency descriptors that you can include in your application.

# spring-fw-aop-proxying#proxying-mechanisms
- id: g-jdk-dynamic-proxy
  en: JDK dynamic proxy
  origin: m05-l03
  definition:
    en: If the target object to be proxied implements at least one interface, a JDK dynamic proxy is used, and all
      of the interfaces implemented by the target type are proxied.

# spring-fw-aop-proxying#proxying-mechanisms
- id: g-cglib-proxy
  en: CGLIB proxy
  origin: m05-l03
  definition:
    en: If the target object does not implement any interfaces, a CGLIB proxy is created which is a runtime-generated
      subclass of the target type.

# spring-fw-tx-declarative-rolling-back#page-title
- id: g-rollback-rule
  en: rollback rule
  origin: m05-l04
  definition:
    en: Rollback rules determine if a transaction should be rolled back when a given exception is thrown, and the
      rules are based on exception types or exception patterns.

