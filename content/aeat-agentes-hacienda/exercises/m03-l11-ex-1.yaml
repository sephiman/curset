# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0001
  prompt:
    es: "De acuerdo con el artículo 28 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los recargos del período ejecutivo se devengan:"
  options:
  - id: a
    text:
      es: "Con la notificación de la providencia de apremio al obligado tributario, conforme al artículo 167 de la misma ley."
  - id: b
    text:
      es: "Con la finalización del plazo de pago de las deudas apremiadas, conforme al artículo 62.5 de la misma ley."
  - id: c
    text:
      es: "Con la práctica de la diligencia de embargo de los bienes del obligado, conforme al artículo 169 de la misma ley."
  - id: d
    correct: true
    text:
      es: "Con el inicio del período ejecutivo, conforme a lo establecido en el artículo 161 de la misma ley."
  explanation:
    es: "Los recargos se devengan con el inicio del período ejecutivo, que fija el artículo 161. La providencia de apremio no es el momento del devengo: sirve para liquidar el recargo que corresponda y para requerir el pago. El fin del plazo del artículo 62.5 decide si se aplica el recargo reducido o el ordinario, pero no el devengo. El embargo es un trámite posterior del apremio y tampoco devenga nada."
  citation: "art. 28.1 LGT"
  difficulty: 2
  tags:
  - "recargos"
  - "devengo"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0002
  prompt:
    es: "En relación con los recargos del período ejecutivo regulados en el artículo 28 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Son de tres tipos: recargo ejecutivo, recargo de apremio reducido y recargo por declaración extemporánea."
  - id: b
    text:
      es: "Son de dos tipos: recargo ejecutivo y recargo de apremio, que se gradúa según la fecha de pago."
  - id: c
    text:
      es: "Son de cuatro tipos, porque el recargo de apremio ordinario se divide en dos según el importe de la deuda."
  - id: d
    correct: true
    text:
      es: "Son de tres tipos: recargo ejecutivo, recargo de apremio reducido y recargo de apremio ordinario."
  explanation:
    es: "El artículo 28.1 cierra la lista en tres: ejecutivo, de apremio reducido y de apremio ordinario. El recargo por declaración extemporánea es otra figura, la del artículo 27, que se paga cuando se presenta fuera de plazo sin requerimiento y no pertenece al período ejecutivo. Tampoco hay solo dos tipos, ni cuatro: el apremio tiene dos tipos, reducido y ordinario, y no se divide por el importe de la deuda."
  citation: "art. 28.1 LGT"
  difficulty: 1
  tags:
  - "recargos"
  - "tipos"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0003
  prompt:
    es: "Según el artículo 28.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué relación existe entre los tres recargos del período ejecutivo?"
  options:
  - id: a
    correct: true
    text:
      es: "Son incompatibles entre sí y se calculan sobre la totalidad de la deuda no ingresada en período voluntario."
  - id: b
    text:
      es: "Son acumulables entre sí y se calculan sobre la totalidad de la deuda no ingresada en período voluntario."
  - id: c
    text:
      es: "Son incompatibles entre sí y se calculan solo sobre la cuota no ingresada en período voluntario."
  - id: d
    text:
      es: "Son acumulables cuando el obligado paga fuera de plazo y se calculan sobre la deuda pendiente en cada momento."
  explanation:
    es: "El artículo 28.1 dice que los recargos son incompatibles entre sí y que se calculan sobre la totalidad de la deuda no ingresada en período voluntario. Por eso en un mismo caso se aplica uno solo. Acumularlos contradice la incompatibilidad. Limitar la base a la cuota deja fuera parte de la deuda que el artículo incluye. Y la base no es la deuda pendiente en cada momento, sino la no ingresada en período voluntario."
  citation: "art. 28.1 LGT"
  difficulty: 1
  tags:
  - "recargos"
  - "incompatibilidad"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0005
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el recargo de apremio reducido es la que recoge el artículo 28.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Será del 10 por ciento y se aplicará si se satisface la totalidad de la deuda, sin el recargo, antes de que acabe el plazo del artículo 62.5 para las deudas apremiadas."
  - id: b
    text:
      es: "Será del 5 por ciento y se aplicará si se satisface la totalidad de la deuda y el propio recargo antes de que acabe el plazo del artículo 62.5."
  - id: c
    correct: true
    text:
      es: "Será del 10 por ciento y se aplicará si se satisface la totalidad de la deuda y el propio recargo antes de que acabe el plazo del artículo 62.5."
  - id: d
    text:
      es: "Será del 10 por ciento y se aplicará si se satisface la totalidad de la deuda y el propio recargo antes de la notificación de la providencia."
  explanation:
    es: "El reducido es del diez por ciento y exige pagar la deuda y el propio recargo antes de que termine el plazo del artículo 62.5 para las deudas apremiadas. Sin pagar el recargo no se cumple la condición. El cinco por ciento es el tipo del recargo ejecutivo. Pagar antes de la notificación de la providencia es la condición del recargo ejecutivo, no del reducido."
  citation: "art. 28.3 LGT"
  difficulty: 2
  tags:
  - "recargos"
  - "apremio reducido"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0006
  prompt:
    es: "Según el artículo 28.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recargo de apremio ordinario será del 20 por ciento y será aplicable:"
  options:
  - id: a
    text:
      es: "Cuando el obligado haya ingresado la deuda después de que se le notifique la providencia de embargo."
  - id: b
    text:
      es: "Cuando el obligado haya pagado la deuda pero no los intereses de demora del período voluntario."
  - id: c
    text:
      es: "Cuando la deuda supere el importe que fije reglamentariamente la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Cuando no concurran las circunstancias a las que se refieren los apartados 2 y 3 del mismo artículo."
  explanation:
    es: "El ordinario es el recargo residual: se aplica cuando no se dan las circunstancias del recargo ejecutivo ni las del reducido, y es del 20 por ciento. El artículo no hace depender el recargo de una providencia de embargo, de los intereses del período voluntario ni de un importe de la deuda."
  citation: "art. 28.4 LGT"
  difficulty: 1
  tags:
  - "recargos"
  - "apremio ordinario"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0010
  prompt:
    es: "Almacenes Roldán, S.L. no ingresó en voluntaria una liquidación de 8.000 euros. Le notifican la providencia de apremio el lunes 5 de octubre de 2026 y ingresa la deuda y el propio recargo el martes 20 de octubre de 2026. Conforme a los artículos 28 y 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuánto ingresa en total?"
  options:
  - id: a
    correct: true
    text:
      es: "8.800 euros, porque se aplica el recargo de apremio reducido del 10 por ciento, sin intereses de demora."
  - id: b
    text:
      es: "8.400 euros, porque se aplica el recargo ejecutivo del 5 por ciento, sin intereses de demora."
  - id: c
    text:
      es: "9.600 euros, porque se aplica el recargo de apremio ordinario del 20 por ciento, más intereses de demora."
  - id: d
    text:
      es: "8.800 euros, porque se aplica el recargo de apremio reducido del 10 por ciento, más intereses de demora."
  explanation:
    es: "La notificación es del día cinco, entre los días uno y 15, así que el plazo del artículo 62.5.a llega hasta el día 20 del mes: el martes 20 de octubre de 2026, que es hábil. El ingreso de ese día, con el propio recargo, cumple el artículo 28.3: recargo del 10 por ciento, 800 euros, y total de 8.800 euros. Con el reducido no se exigen intereses (artículo 28.5), de modo que sumarlos es un error. El cinco por ciento exigía pagar antes de la providencia. El veinte por ciento y los intereses son para el pago fuera de plazo."
  citation: "art. 28.3 LGT"
  difficulty: 3
  tags:
  - "recargos"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2005-14803-art-72
- id: m03-l11-q0012
  prompt:
    es: "Según el artículo 72.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las cantidades adeudadas devengarán interés de demora en el período ejecutivo:"
  options:
  - id: a
    text:
      es: "Desde la notificación de la providencia de apremio hasta la fecha de su ingreso."
  - id: b
    text:
      es: "Desde el inicio del período ejecutivo hasta la finalización del plazo del artículo 62.5 de la Ley General Tributaria."
  - id: c
    text:
      es: "Desde el vencimiento del plazo voluntario hasta la fecha de la diligencia de embargo."
  - id: d
    correct: true
    text:
      es: "Desde el inicio del período ejecutivo hasta la fecha de su ingreso."
  explanation:
    es: "El interés corre desde que empieza el período ejecutivo hasta el día del ingreso. No espera a la notificación de la providencia. Tampoco se detiene al acabar el plazo de pago de las deudas apremiadas ni al embargar: el límite es el ingreso de la deuda."
  citation: "art. 72.1 RGR"
  difficulty: 2
  tags:
  - "intereses de demora"
  - "recaudación"
# anchor: boe-a-2005-14803-art-72
- id: m03-l11-q0013
  prompt:
    es: "De acuerdo con el artículo 72.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre una deuda en período ejecutivo que se satisface sin mediar suspensión, aplazamiento ni fraccionamiento:"
  options:
  - id: a
    text:
      es: "Si se paga totalmente antes de que concluya el plazo del artículo 62.5, se exigen en todo caso los intereses devengados desde el inicio del período ejecutivo."
  - id: b
    text:
      es: "Si se paga totalmente en cualquier momento, no se exigen nunca los intereses devengados desde el inicio del período ejecutivo."
  - id: c
    text:
      es: "Si se paga después de notificada la providencia de apremio, no se exigen los intereses devengados hasta esa notificación."
  - id: d
    correct: true
    text:
      es: "Si se paga totalmente antes de que concluya el plazo del artículo 62.5, no se exigen los intereses devengados desde el inicio del período ejecutivo."
  explanation:
    es: "El reglamento excluye los intereses cuando la deuda se satisface por completo, sin suspensión, aplazamiento ni fraccionamiento, antes de que concluya el plazo del artículo 62.5. Después de ese plazo sí se exigen. La notificación de la providencia no marca ningún límite para los intereses: el factor es el fin del plazo del artículo 62.5."
  citation: "art. 72.1 RGR"
  difficulty: 3
  tags:
  - "intereses de demora"
  - "recaudación"
# anchor: boe-a-2005-14803-art-72
- id: m03-l11-q0014
  prompt:
    es: "Según el artículo 72.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué base se utiliza para aplicar el tipo de interés de demora del período ejecutivo?"
  options:
  - id: a
    text:
      es: "Una base que incluye el recargo de apremio que corresponda."
  - id: b
    text:
      es: "Una base que incluye las costas del procedimiento de apremio devengadas hasta el pago."
  - id: c
    text:
      es: "Una base formada por la deuda pendiente más el recargo ejecutivo, y no otros recargos."
  - id: d
    correct: true
    text:
      es: "Una base que no incluye el recargo de apremio."
  explanation:
    es: "El reglamento dice que la base del interés no incluye el recargo de apremio. Incluirlo contradice ese texto. El artículo tampoco menciona las costas ni limita la base a un recargo concreto: lo que fija es que el recargo de apremio queda fuera."
  citation: "art. 72.2 RGR"
  difficulty: 2
  tags:
  - "intereses de demora"
  - "recargo de apremio"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0122
  prompt:
    es: "¿Qué porcentaje tiene el recargo de apremio ordinario que se aplica, según el artículo 28.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando no concurren las circunstancias del recargo ejecutivo ni las del recargo de apremio reducido?"
  options:
  - id: a
    correct: true
    text:
      es: "El 20 por ciento de la deuda no ingresada en período voluntario."
  - id: b
    text:
      es: "El 15 por ciento de la deuda no ingresada en período voluntario."
  - id: c
    text:
      es: "El 10 por ciento de la deuda no ingresada en período voluntario."
  - id: d
    text:
      es: "El 25 por ciento de la deuda no ingresada en período voluntario."
  explanation:
    es: "El recargo de apremio ordinario es del 20 por ciento. El 10 por ciento es el del recargo reducido. El 15 por ciento no es un recargo del período ejecutivo: es un porcentaje del recargo por declaración extemporánea, que pertenece al artículo 27. El 25 por ciento no figura en el artículo 28."
  citation: "art. 28.4 LGT"
  difficulty: 2
  tags:
  - "recargos"
  - "apremio ordinario"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0125
  prompt:
    es: "¿Pueden exigirse a la vez el recargo ejecutivo y el recargo de apremio reducido sobre la misma deuda, conforme al artículo 28.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Sí, porque se calculan sobre bases distintas de la deuda no ingresada."
  - id: b
    text:
      es: "Sí, cuando el obligado pague la deuda después de que se le haya notificado la providencia de apremio."
  - id: c
    correct: true
    text:
      es: "No, porque los tres recargos del período ejecutivo son incompatibles entre sí."
  - id: d
    text:
      es: "No, salvo que el obligado haya solicitado un aplazamiento de la deuda."
  explanation:
    es: "Los tres recargos son incompatibles entre sí, de modo que sobre la misma deuda se aplica uno solo. No se calculan sobre bases distintas: todos se calculan sobre la totalidad de la deuda no ingresada. Pagar después de la providencia no los hace acumulables, y la solicitud de aplazamiento no es una salvedad que prevea el artículo."
  citation: "art. 28.1 LGT"
  difficulty: 2
  tags:
  - "recargos"
  - "incompatibilidad"
# anchor: boe-a-2003-23186-art-28
- id: m03-l11-q0129
  prompt:
    es: "Conforme al artículo 28 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el recargo ejecutivo y el recargo de apremio reducido:"
  options:
  - id: a
    text:
      es: "El ejecutivo es del 5 por ciento y el reducido del 10 por ciento, y con ambos se exigen los intereses desde el inicio del período ejecutivo."
  - id: b
    correct: true
    text:
      es: "El ejecutivo es del 5 por ciento y el reducido del 10 por ciento, y con ninguno se exigen los intereses desde el inicio del período ejecutivo."
  - id: c
    text:
      es: "El ejecutivo es del 10 por ciento y el reducido del 5 por ciento, y con ninguno se exigen los intereses desde el inicio del período ejecutivo."
  - id: d
    text:
      es: "El ejecutivo es del 5 por ciento y el reducido del 20 por ciento, y con ninguno se exigen los intereses desde el inicio del período ejecutivo."
  explanation:
    es: "El ejecutivo es del cinco por ciento y el reducido del diez, y con ambos se evita el interés de demora desde el inicio del período ejecutivo (artículo 28.5). Con los intereses se confundiría el ordinario, que sí los admite. Invertir los porcentajes o poner el 20 por ciento al reducido es una alteración: el 20 por ciento es el tipo del ordinario."
  citation: "art. 28.2 LGT"
  difficulty: 3
  tags:
  - "recargos"
  - "intereses de demora"
