# anchor: boe-a-2015-10565-art-14
- id: m01-l05-q0001
  prompt:
    es: "Según el artículo 14.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las personas físicas que no estén obligadas a relacionarse electrónicamente con las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "deberán mantener hasta el final del procedimiento el medio elegido al iniciarlo."
  - id: b
    correct: true
    text:
      es: "podrán elegir en todo momento si se comunican con ellas por medios electrónicos o no."
  - id: c
    text:
      es: "deberán comunicarse por medios electrónicos, salvo que acrediten no disponer de ellos."
  - id: d
    text:
      es: "solo podrán cambiar el medio de comunicación con autorización del órgano instructor."
  explanation:
    es: "El artículo 14.1 LPAC dice que las personas físicas «podrán elegir en todo momento» si se comunican por medios electrónicos o no, salvo que estén obligadas. Si la elección cabe en todo momento, no queda fijada al iniciar el procedimiento ni depende de una autorización del instructor. La regla para las personas físicas no obligadas es la libre elección, no el medio electrónico con una excepción por falta de medios."
  citation: "art. 14.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-14
- id: m01-l05-q0003
  prompt:
    es: "Conforme al artículo 14.2.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los empleados de las Administraciones Públicas están obligados a relacionarse con ellas a través de medios electrónicos:"
  options:
  - id: a
    correct: true
    text:
      es: "para los trámites que realicen con ellas por razón de su condición de empleado público."
  - id: b
    text:
      es: "para cualquier trámite, incluidos los que realicen con ellas como simples particulares."
  - id: c
    text:
      es: "solo cuando así lo disponga el convenio colectivo o el pacto que les resulte aplicable."
  - id: d
    text:
      es: "solo si pertenecen a cuerpos o escalas de los subgrupos A1 o A2 de clasificación."
  explanation:
    es: "El artículo 14.2.e) LPAC obliga a los empleados públicos «para los trámites y actuaciones que realicen con ellas por razón de su condición de empleado público», en la forma que determine cada Administración por reglamento. Fuera de esa condición son personas físicas y pueden elegir, así que la obligación no alcanza a lo que hagan como particulares. La ley no remite a un convenio o pacto ni distingue por subgrupos."
  citation: "art. 14.2.e) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-3
- id: m01-l05-q0224
  prompt:
    es: "De acuerdo con el artículo 3.2 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la comunicación de la persona física no obligada de que quiere relacionarse electrónicamente produce efectos a partir del:"
  options:
  - id: a
    text:
      es: "Día siguiente a aquel en que el órgano competente haya tenido constancia de ella."
  - id: b
    text:
      es: "Décimo día hábil siguiente a aquel en que la persona haya presentado la comunicación."
  - id: c
    text:
      es: "Quinto día natural siguiente a aquel en que la persona haya presentado la comunicación."
  - id: d
    correct: true
    text:
      es: "Quinto día hábil siguiente a aquel en que el órgano competente haya tenido constancia de ella."
  explanation:
    es: "El artículo 3.2 fija los efectos «a partir del quinto día hábil siguiente a aquel en que el órgano competente para tramitar el procedimiento haya tenido constancia» de la comunicación. No son inmediatos al día siguiente. El plazo no es de diez días ni se cuenta en días naturales, y su referencia es la constancia del órgano, no la presentación."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-16
- id: m01-l05-q0005
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los registros electrónicos recoge el artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cada Administración decide si su registro es interoperable con los de las demás."
  - id: b
    correct: true
    text:
      es: "Los de todas las Administraciones deben ser plenamente interoperables entre sí."
  - id: c
    text:
      es: "La interoperabilidad solo se exige entre registros de una misma Administración."
  - id: d
    text:
      es: "Solo deben ser interoperables los registros de la Administración General del Estado."
  explanation:
    es: "El artículo 16.4 LPAC dice que «los registros electrónicos de todas y cada una de las Administraciones» deberán ser plenamente interoperables. La ley impone un deber y no deja la decisión a cada Administración. Alcanza a todas las Administraciones y a la transmisión entre cualquiera de los registros, no solo a los de una misma Administración o a los del Estado."
  citation: "art. 16.4 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-17
- id: m01-l05-q0006
  prompt:
    es: "De acuerdo con el artículo 17.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos electrónicos deberán conservarse en un formato que permita garantizar:"
  options:
  - id: a
    text:
      es: "su autenticidad e integridad durante los cinco años siguientes a la fecha de su emisión."
  - id: b
    text:
      es: "su integridad, con la consulta limitada al órgano administrativo que emitió el documento."
  - id: c
    text:
      es: "su autenticidad e integridad mientras no haya finalizado el procedimiento al que pertenecen."
  - id: d
    correct: true
    text:
      es: "su autenticidad, integridad y conservación, y su consulta sin depender del tiempo transcurrido."
  explanation:
    es: "El artículo 17.2 LPAC pide un formato que garantice «la autenticidad, integridad y conservación del documento, así como su consulta con independencia del tiempo transcurrido desde su emisión». Al no depender del tiempo, la garantía no se acaba a los cinco años ni al finalizar el procedimiento. La ley tampoco limita la consulta al órgano emisor: exige que los datos puedan trasladarse a formatos que permitan el acceso desde diferentes aplicaciones."
  citation: "art. 17.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-31
- id: m01-l05-q0011
  prompt:
    es: "Un plazo de diez días hábiles para presentar alegaciones vence el viernes 20 de febrero de 2026. El interesado las presenta en el registro electrónico el sábado 21 a las 10:00. Si ninguna norma permite la recepción en día inhábil, ¿cuándo se entienden presentadas?"
  options:
  - id: a
    text:
      es: "El sábado 21 a las 10:00, dentro de plazo, porque el registro admite documentos ese día."
  - id: b
    text:
      es: "En la última hora del viernes 20 de febrero, dentro de plazo."
  - id: c
    text:
      es: "En la primera hora del lunes 23 de febrero, dentro de plazo por ser el siguiente día hábil."
  - id: d
    correct: true
    text:
      es: "En la primera hora del lunes 23 de febrero, fuera de plazo."
  explanation:
    es: "En un plazo por días hábiles, lo presentado en día inhábil «se entenderá realizada en la primera hora del primer día hábil siguiente» (art. 31.2.b): el lunes 23 de febrero de 2026. El plazo terminó el viernes 20, así que las alegaciones llegan fuera de plazo. Que el registro admita documentos el sábado no cambia la fecha a efectos del plazo. La ley no retrotrae la presentación al viernes. La prórroga al hábil siguiente solo opera cuando el último día del plazo es inhábil (art. 30.5), y aquí el último día, el viernes, era hábil."
  citation: "art. 31.2.b) LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "efecto"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l05-q0015
  prompt:
    es: "¿En qué fecha adoptó el Consejo de la Organización para la Cooperación y el Desarrollo Económicos (OCDE) su Recomendación sobre Gobierno Abierto?"
  options:
  - id: a
    text:
      es: "El 9 de diciembre de 2013."
  - id: b
    text:
      es: "El 25 de septiembre de 2015."
  - id: c
    correct: true
    text:
      es: "El 14 de diciembre de 2017."
  - id: d
    text:
      es: "El 29 de octubre de 2020."
  explanation:
    es: "El Consejo de la OCDE adoptó la Recomendación el 14 de diciembre de 2017. El 9 de diciembre de 2013 es la fecha de la Ley 19/2013. El 25 de septiembre de 2015 la Asamblea General de las Naciones Unidas aprobó la Agenda 2030. El 29 de octubre de 2020 el pleno del Foro de Gobierno Abierto aprobó el IV Plan."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 2
  tags:
  - "fecha"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l05-q0018
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los principios de Gobierno Abierto que nombra la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017?"
  options:
  - id: a
    correct: true
    text:
      es: "Transparencia, integridad, rendición de cuentas y participación de las partes interesadas."
  - id: b
    text:
      es: "Transparencia, colaboración, participación ciudadana y rendición de cuentas."
  - id: c
    text:
      es: "Publicidad activa, derecho de acceso, buen gobierno e integridad pública."
  - id: d
    text:
      es: "Transparencia, integridad, eficacia y participación de las partes interesadas."
  explanation:
    es: "La Recomendación nombra cuatro principios: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. Una opción cambia la integridad por la colaboración. Otra mezcla el contenido de la Ley 19/2013 (publicidad activa, acceso y buen gobierno). Otra pone la eficacia en lugar de la rendición de cuentas."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l05-q0019
  prompt:
    es: "¿Cuántos principios de Gobierno Abierto nombra la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, adoptada el 14 de diciembre de 2017?"
  options:
  - id: a
    text:
      es: "Tres principios de Gobierno Abierto."
  - id: b
    correct: true
    text:
      es: "Cuatro principios de Gobierno Abierto."
  - id: c
    text:
      es: "Cinco principios de Gobierno Abierto."
  - id: d
    text:
      es: "Diez principios de Gobierno Abierto."
  explanation:
    es: "La Recomendación nombra cuatro: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. No enumera tres, cinco ni diez."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l05-q0022
  prompt:
    es: "Señale cómo considera los planes de Gobierno Abierto el Plan de Acción para la implementación de la Agenda 2030 del Gobierno de España, según lo recoge el Portal de la Transparencia:"
  options:
  - id: a
    text:
      es: "Un indicador de seguimiento de las metas del ODS 16."
  - id: b
    text:
      es: "Una política que contribuye únicamente al ODS 16."
  - id: c
    correct: true
    text:
      es: "Una política palanca para alcanzar los ODS, que contribuye al ODS 16 y acelera el resto."
  - id: d
    text:
      es: "Un instrumento de evaluación de los planes autonómicos."
  explanation:
    es: "El Plan de Acción considera los planes de Gobierno Abierto una política palanca para alcanzar los ODS, por su contribución al ODS 16 y porque aceleran el resto. No son un indicador de seguimiento. No contribuyen únicamente al ODS 16, porque aceleran los demás. Tampoco son un instrumento de evaluación de los planes autonómicos."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-1
- id: m01-l05-q0181
  prompt:
    es: "Según el artículo 1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál es uno de los objetos de esa ley orgánica?"
  options:
  - id: a
    correct: true
    text:
      es: "Adaptar el ordenamiento jurídico español al Reglamento (UE) 2016/679 y completar sus disposiciones."
  - id: b
    text:
      es: "Transponer al Derecho español el Reglamento (UE) 2016/679 y desarrollar sus disposiciones."
  - id: c
    text:
      es: "Adaptar el ordenamiento jurídico español a la Directiva 95/46/CE y completar sus disposiciones."
  - id: d
    text:
      es: "Sustituir en el ordenamiento jurídico español las disposiciones del Reglamento (UE) 2016/679."
  explanation:
    es: "El artículo 1.a) fija como objeto «adaptar el ordenamiento jurídico español al Reglamento (UE) 2016/679 […] y completar sus disposiciones». Un reglamento de la Unión no se transpone: es directamente aplicable, y la ley lo adapta y lo completa. La Directiva 95/46/CE es la norma que el Reglamento deroga. La ley tampoco sustituye las disposiciones del Reglamento."
  citation: "art. 1.a) LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-3
- id: m01-l05-q0184
  prompt:
    es: "¿Cuál de los siguientes datos del causante pueden pedir sus herederos pese a su prohibición, según el artículo 3.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de carácter patrimonial."
  - id: b
    text:
      es: "Los relativos a su salud."
  - id: c
    text:
      es: "Los relativos a sus creencias."
  - id: d
    text:
      es: "Los de su vida privada."
  explanation:
    es: "El artículo 3.1 dice que la prohibición del fallecido no afecta al derecho de los herederos a acceder a los datos de carácter patrimonial del causante. Los datos de salud, de creencias o de vida privada quedan cubiertos por esa prohibición expresa."
  citation: "art. 3.1 LOPDGDD"
  difficulty: 1
  tags:
  - "concepto"
  - "excepción"
# anchor: celex-32016r0679-art-4
- id: m01-l05-q0203
  prompt:
    es: "¿Quién es el «responsable del tratamiento» según el Reglamento (UE) 2016/679, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales?"
  options:
  - id: a
    text:
      es: "Quien trate datos personales por cuenta de otro que determina los fines y medios."
  - id: b
    correct: true
    text:
      es: "Quien, solo o junto con otros, determine los fines y medios del tratamiento."
  - id: c
    text:
      es: "Quien supervise el cumplimiento de la normativa de protección de datos en la organización."
  - id: d
    text:
      es: "Quien realice materialmente las operaciones de tratamiento, automatizadas o no."
  explanation:
    es: "El artículo 4.7 define al responsable como quien, «solo o junto con otros, determine los fines y medios del tratamiento». Quien trata datos por cuenta del responsable es el encargado (artículo 4.8). Supervisar el cumplimiento es una función del delegado de protección de datos. La definición no atiende a quién realiza materialmente las operaciones."
  citation: "art. 4.7 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-12
- id: m01-l05-q0269
  prompt:
    es: "Una persona afirma que ejerció su derecho de acceso y que el responsable del tratamiento no le respondió, mientras que el responsable sostiene que sí lo hizo. Según el artículo 12.4 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿a quién corresponde probar que se cumplió el deber de responder?"
  options:
  - id: a
    text:
      es: "A la persona afectada que ejerció el derecho."
  - id: b
    text:
      es: "Al encargado del tratamiento, en todo caso."
  - id: c
    correct: true
    text:
      es: "Al responsable del tratamiento."
  - id: d
    text:
      es: "A la Agencia Española de Protección de Datos."
  explanation:
    es: "El artículo 12.4 dispone que la prueba del cumplimiento del deber de responder a la solicitud de ejercicio de los derechos recae sobre el responsable del tratamiento, no sobre el afectado. El encargado solo puede tramitar las solicitudes por cuenta del responsable si el contrato lo prevé (art. 12.3), y la Agencia Española de Protección de Datos no asume la carga de la prueba."
  citation: "art. 12.4 LOPDGDD"
  difficulty: 1
  tags:
  - "derechos"
  - "carga de la prueba"
