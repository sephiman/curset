# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q026
  prompt:
    es: "De acuerdo con el artículo 32.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en todo caso, el daño alegado habrá de ser:"
  options:
  - id: a
    text:
      es: "Efectivo, evaluable económicamente y causado por el funcionamiento anormal de los servicios públicos."
  - id: b
    text:
      es: "Efectivo o potencial, evaluable económicamente e individualizado con relación a una persona."
  - id: c
    text:
      es: "Efectivo, evaluable económicamente y de cuantía igual o superior a 50.000 euros."
  - id: d
    correct: true
    text:
      es: "Efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas."
  explanation:
    es: "El artículo 32.2 LRJSP exige que el daño sea «efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas». La opción del funcionamiento anormal cambia el tercer requisito y además contradice el artículo 32.1, que cubre también el funcionamiento normal. La opción del daño potencial admite un daño que no es efectivo. La opción de los 50.000 euros toma la cuantía que hace preceptivo el dictamen (art. 81.2 LPAC), que no es requisito del daño."
  citation: "art. 32.2 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q028
  prompt:
    es: "¿Cuál de los siguientes NO es un requisito del daño alegado según el artículo 32.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Que el daño alegado sea efectivo."
  - id: b
    text:
      es: "Que el daño alegado sea evaluable económicamente."
  - id: c
    correct: true
    text:
      es: "Que el daño alegado alcance los 50.000 euros."
  - id: d
    text:
      es: "Que el daño alegado esté individualizado con relación a una persona o grupo."
  explanation:
    es: "El artículo 32.2 LRJSP exige que el daño alegado sea «efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas»: las tres opciones que recogen esos requisitos son correctas como requisitos y no son la respuesta. Alcanzar los 50.000 euros no es un requisito del daño; es la cifra a partir de la cual el dictamen del Consejo de Estado es preceptivo (art. 81.2 LPAC)."
  citation: "art. 32.2 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q029
  prompt:
    es: "¿Cuál de las siguientes lesiones producidas al particular es indemnizable según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La proveniente de daños que el particular tenga el deber jurídico de soportar de acuerdo con la Ley."
  - id: b
    text:
      es: "La proveniente de daños causados por fuerza mayor, aunque intervenga un servicio público."
  - id: c
    text:
      es: "La proveniente de hechos que no se pudieron prever según el estado de la ciencia de su momento."
  - id: d
    correct: true
    text:
      es: "La proveniente de daños que el particular no tenga el deber jurídico de soportar de acuerdo con la Ley."
  explanation:
    es: "El artículo 34.1 LRJSP dice: «Sólo serán indemnizables las lesiones producidas al particular provenientes de daños que éste no tenga el deber jurídico de soportar de acuerdo con la Ley». La opción de los daños que el particular sí tiene el deber de soportar es la contraria. La fuerza mayor excluye la indemnización (art. 32.1 LRJSP). Los daños de hechos que no se pudieron prever según el estado de la ciencia de su momento tampoco son indemnizables, por la segunda frase del mismo apartado."
  citation: "art. 34.1 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q030
  prompt:
    es: "Según el artículo 34.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, no son indemnizables los daños de hechos imprevisibles o inevitables según el estado de la ciencia o de la técnica existente:"
  options:
  - id: a
    text:
      es: "En el momento de presentarse la reclamación."
  - id: b
    correct: true
    text:
      es: "En el momento de producción de aquéllos."
  - id: c
    text:
      es: "En el momento de dictarse la resolución."
  - id: d
    text:
      es: "En el momento de emitirse el dictamen."
  explanation:
    es: "El artículo 34.1 LRJSP mide la previsibilidad según «el estado de los conocimientos de la ciencia o de la técnica existentes en el momento de producción de aquéllos». La opción de la reclamación, la de la resolución y la del dictamen trasladan esa referencia a momentos posteriores del procedimiento, que el artículo no usa."
  citation: "art. 34.1 LRJSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q031
  prompt:
    es: "Los daños de hechos imprevisibles o inevitables según el estado de la ciencia o de la técnica no son indemnizables conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, aunque queda a salvo:"
  options:
  - id: a
    text:
      es: "La indemnización cuando haya funcionamiento anormal de los servicios públicos, que procede siempre."
  - id: b
    text:
      es: "La indemnización de los daños de carácter físico o psíquico a las personas, que procede siempre."
  - id: c
    correct: true
    text:
      es: "Lo que las leyes puedan establecer como prestaciones asistenciales o económicas para estos casos."
  - id: d
    text:
      es: "La indemnización de los daños de cuantía igual o superior a 50.000 euros, con dictamen previo."
  explanation:
    es: "El artículo 34.1 LRJSP excluye esos daños «sin perjuicio de las prestaciones asistenciales o económicas que las leyes puedan establecer para estos casos». El artículo no hace excepción por el funcionamiento anormal, ni por los daños físicos o psíquicos, ni por la cuantía. Los daños físicos o psíquicos solo cambian el inicio del plazo para reclamar (art. 67.1 LPAC), y los 50.000 euros solo hacen preceptivo el dictamen (art. 81.2 LPAC)."
  citation: "art. 34.1 LRJSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q032
  prompt:
    es: "De acuerdo con el artículo 67.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el derecho a reclamar en los procedimientos de responsabilidad patrimonial prescribirá:"
  options:
  - id: a
    correct: true
    text:
      es: "Al año de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo."
  - id: b
    text:
      es: "A los cuatro años de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo."
  - id: c
    text:
      es: "A los cinco años de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo."
  - id: d
    text:
      es: "Al año de dictarse el acto que motive la indemnización, aunque su efecto lesivo se manifieste después."
  explanation:
    es: "El artículo 67.1 LPAC dice que el derecho a reclamar «prescribirá al año de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo». Las opciones de cuatro y cinco años cambian la cifra. La opción que cuenta siempre desde que se dictó el acto suprime la alternativa de la manifestación del efecto lesivo."
  citation: "art. 67.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q033
  prompt:
    es: "Según el artículo 67.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en caso de daños de carácter físico o psíquico a las personas, el plazo para reclamar empezará a computarse:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde la curación o la determinación del alcance de las secuelas."
  - id: b
    text:
      es: "Desde la fecha en que se produjo el hecho que causó el daño."
  - id: c
    text:
      es: "Desde la primera asistencia sanitaria que haya recibido el lesionado."
  - id: d
    text:
      es: "Desde que se reconozca al lesionado una incapacidad permanente."
  explanation:
    es: "El artículo 67.1 LPAC dice que, en daños de carácter físico o psíquico a las personas, «el plazo empezará a computarse desde la curación o la determinación del alcance de las secuelas». El día del hecho dañoso es el inicio de la regla general, que el mismo apartado fija en el año desde el hecho que motive la indemnización o desde que se manifieste su efecto lesivo, y la regla especial para daños personales la sustituye. La primera asistencia sanitaria y el reconocimiento de una incapacidad permanente no son los momentos que el apartado fija: fija la curación o la determinación de las secuelas."
  citation: "art. 67.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q034
  prompt:
    es: "Conforme al artículo 67.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando proceda indemnizar por la anulación en vía administrativa o contencioso-administrativa de un acto, el derecho a reclamar prescribirá:"
  options:
  - id: a
    text:
      es: "Al año de haberse dictado el acto o la disposición que después se anularon."
  - id: b
    text:
      es: "A los seis meses de haberse notificado la resolución o la sentencia definitiva."
  - id: c
    correct: true
    text:
      es: "Al año de haberse notificado la resolución administrativa o la sentencia definitiva."
  - id: d
    text:
      es: "Al año de haberse publicado la sentencia en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 67.1 LPAC dice que, en esos casos, el derecho a reclamar «prescribirá al año de haberse notificado la resolución administrativa o la sentencia definitiva». La opción que cuenta desde que se dictó el acto o la disposición anulados usa un momento anterior. La opción de seis meses cambia la cifra. La publicación en el «Boletín Oficial del Estado» es el inicio del plazo en los casos de ley inconstitucional, no en los de anulación de un acto."
  citation: "art. 67.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q035
  prompt:
    es: "Según el artículo 67.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la lesión deriva de aplicar una norma con rango de ley declarada inconstitucional, ¿cuándo prescribe el derecho a reclamar?"
  options:
  - id: a
    text:
      es: "Al año de notificarse al particular la sentencia que declare la inconstitucionalidad de la norma."
  - id: b
    text:
      es: "Al año de la entrada en vigor de la norma con rango de ley que después se declaró inconstitucional."
  - id: c
    text:
      es: "A los cinco años de publicarse en el «Boletín Oficial del Estado» la sentencia que declare la inconstitucionalidad."
  - id: d
    correct: true
    text:
      es: "Al año de publicarse en el «Boletín Oficial del Estado» la sentencia que declare la inconstitucionalidad."
  explanation:
    es: "El artículo 67.1 LPAC dice que, en los casos del artículo 32.4 y 5 LRJSP, el derecho a reclamar «prescribirá al año de la publicación en el \"Boletín Oficial del Estado\" o en el \"Diario Oficial de la Unión Europea\", según el caso, de la sentencia que declare la inconstitucionalidad de la norma». La opción de la notificación al particular confunde este caso con el de anulación de un acto. La opción de la entrada en vigor de la norma cuenta desde un momento que el artículo no usa. La opción de cinco años cambia la cifra."
  citation: "art. 67.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q036
  prompt:
    es: "El jueves 17 de julio de 2025 un vehículo oficial daña el coche aparcado de una particular, que lo comprueba ese día. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo prescribe su derecho a reclamar?"
  options:
  - id: a
    text:
      es: "El lunes 20 de julio de 2026."
  - id: b
    correct: true
    text:
      es: "El viernes 17 de julio de 2026."
  - id: c
    text:
      es: "El jueves 16 de julio de 2026."
  - id: d
    text:
      es: "El lunes 19 de enero de 2026."
  explanation:
    es: "El artículo 67.1 LPAC fija la prescripción «al año de producido el hecho». Un plazo en años se cuenta de fecha a fecha y concluye el mismo día del año de vencimiento (art. 30.4 LPAC): el hecho es del jueves 17 de julio de 2025, así que el plazo termina el viernes 17 de julio de 2026, día hábil. El lunes 20 de julio solo sería el final si el 17 fuera inhábil (art. 30.5 LPAC). El jueves 16 de julio termina un día antes de la fecha equivalente. El lunes 19 de enero de 2026 sale de contar seis meses, que no es el plazo."
  citation: "art. 67.1 LPAC"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q037
  prompt:
    es: "Un particular se lesiona el lunes 3 de marzo de 2025 en una obra estatal y recibe el alta por curación el viernes 26 de septiembre de 2025. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué día puede reclamar?"
  options:
  - id: a
    text:
      es: "Hasta el sábado 26 de septiembre de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el lunes 28 de septiembre de 2026."
  - id: c
    text:
      es: "Hasta el martes 3 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el viernes 25 de septiembre de 2026."
  explanation:
    es: "En los daños físicos, el plazo de un año «empezará a computarse desde la curación» (art. 67.1 LPAC), aquí el viernes 26 de septiembre de 2025. Contado de fecha a fecha (art. 30.4 LPAC), el año vence el sábado 26 de septiembre de 2026. Como es inhábil, se prorroga al primer día hábil siguiente (art. 30.5 LPAC): el lunes 28 de septiembre de 2026. La opción del sábado olvida esa prórroga. La opción del martes 3 de marzo cuenta desde el accidente. La opción del viernes 25 adelanta el final en lugar de prorrogarlo."
  citation: "art. 67.1 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q038
  prompt:
    es: "Un acto notificado el lunes 24 de noviembre de 2025 es anulado por sentencia definitiva notificada el martes 14 de abril de 2026. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo prescribe el derecho a reclamar la indemnización?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 14 de abril de 2027."
  - id: b
    text:
      es: "El martes 24 de noviembre de 2026."
  - id: c
    text:
      es: "El miércoles 14 de octubre de 2026."
  - id: d
    text:
      es: "El jueves 15 de abril de 2027."
  explanation:
    es: "Cuando la indemnización procede por anulación, el derecho a reclamar «prescribirá al año de haberse notificado la resolución administrativa o la sentencia definitiva» (art. 67.1 LPAC). La sentencia se notificó el martes 14 de abril de 2026; contado de fecha a fecha (art. 30.4 LPAC), el año vence el miércoles 14 de abril de 2027, día hábil. La opción del 24 de noviembre de 2026 cuenta desde la notificación del acto anulado. La del 14 de octubre de 2026 cuenta seis meses. La del jueves 15 de abril añade un día que el cómputo de fecha a fecha no da."
  citation: "art. 67.1 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
