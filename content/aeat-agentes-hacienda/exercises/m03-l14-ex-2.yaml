# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0023
  prompt:
    es: "Conforme al artículo 217.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si transcurre el plazo máximo sin notificar resolución expresa en un procedimiento de nulidad iniciado a instancia del interesado, se produce:"
  options:
  - id: a
    correct: true
    text:
      es: "La desestimación por silencio administrativo de la solicitud."
  - id: b
    text:
      es: "La caducidad del procedimiento y el archivo de las actuaciones."
  - id: c
    text:
      es: "La inadmisión a trámite de la solicitud del interesado."
  - id: d
    text:
      es: "La estimación por silencio administrativo de la solicitud."
  explanation:
    es: "En los procedimientos a instancia del interesado, el silencio es desestimatorio (art. 217.6.b). La caducidad es el efecto en los iniciados de oficio. El silencio no es estimatorio. Y la inadmisión a trámite es un acuerdo expreso que se adopta al principio, no un efecto del vencimiento."
  citation: "art. 217.6 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "efectos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0024
  prompt:
    es: "La Administración tributaria notifica a Teresa Lara Gil el 16 de marzo de 2026 el acuerdo de iniciación de oficio de un procedimiento de nulidad de pleno derecho. Pasa el plazo máximo sin que se notifique resolución expresa. Conforme al artículo 217.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre?"
  options:
  - id: a
    text:
      es: "El procedimiento caduca y la Administración ya no puede iniciar otro sobre el mismo acto."
  - id: b
    text:
      es: "El acto queda confirmado y pasa a ser irrevisable en vía administrativa."
  - id: c
    text:
      es: "La solicitud se desestima por silencio administrativo y Teresa puede recurrir."
  - id: d
    correct: true
    text:
      es: "El procedimiento caduca, sin que ello impida iniciar de nuevo otro procedimiento con posterioridad."
  explanation:
    es: "En un procedimiento iniciado de oficio el vencimiento del plazo de un año produce la caducidad, pero el artículo 217.6.a permite iniciar otro después. El silencio desestimatorio es para solicitudes del interesado, y aquí no hay solicitud. Y el acto no queda confirmado: la caducidad no le da firmeza ni lo hace irrevisable."
  citation: "art. 217.6 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "nulidad"
  - "caducidad"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0025
  prompt:
    es: "Raúl Soto Calvo presenta el 9 de febrero de 2026 una solicitud de declaración de nulidad de pleno derecho de una liquidación. El plazo se cuenta de fecha a fecha según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin festivos que lo alteren. Conforme al artículo 217.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración puede notificar resolución expresa hasta el:"
  options:
  - id: a
    text:
      es: "9 de agosto de 2026."
  - id: b
    text:
      es: "9 de febrero de 2028."
  - id: c
    correct: true
    text:
      es: "9 de febrero de 2027."
  - id: d
    text:
      es: "9 de mayo de 2026."
  explanation:
    es: "El artículo 217.6 fija un año desde la presentación de la solicitud. El plazo empieza el 10 de febrero de 2026 y termina el mismo día del año siguiente, el martes 9 de febrero de 2027 (art. 30.4 LPAC). El 9 de agosto de 2026 sería a seis meses, que es el plazo de la revocación y la rectificación. El 9 de mayo de 2026 sería a tres meses, el de la lesividad. Y el 9 de febrero de 2028 doblaría el plazo."
  citation: "art. 217.6 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "nulidad"
