    en: A program prints `Math.floorMod(-4, 3)`, then the remainder `-4 % 3`, then the length and the number of
      set bits of a `BitSet` in which bits 1, 3 and 5 are set. What is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'floor modulus of -4 and 3: 2

        remainder of -4 and 3: -1

        bit set length 6, set bits 3'
  - id: b
