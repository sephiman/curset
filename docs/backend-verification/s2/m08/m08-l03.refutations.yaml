m08-l03-q11:
  key:
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
  wrong:
  - option: As soon as the `SELECT` statement has returned its rows
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
    exclusive: true
  - option: When the client connection that took them is closed, never earlier
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
    exclusive: true
  - option: At the next checkpoint or autovacuum run
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
    exclusive: true
m08-l03-q12:
  key:
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: SELECT FOR UPDATE modifies selected rows to mark them locked, and so will result in disk writes.
  wrong:
  - option: PostgreSQL keeps locked rows in a shared memory table that it flushes to disk when the table is full
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: PostgreSQL doesn't remember any information about modified rows in memory, so there is no limit on the number of rows locked at one time.
  - option: Row-level locks block concurrent readers, so queries wait while the lock record is written
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks do not affect data querying; they block only writers and lockers to the same row.
  - option: Each lock is released as soon as the row is returned, which rewrites the row
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
