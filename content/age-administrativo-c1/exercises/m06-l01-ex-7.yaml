# anchor: fuente-ms-win-sistemas-archivos-html
- id: m06-l01-q201
  prompt:
    es: "¿Cuál de los siguientes conjuntos recoge los cuatro sistemas de archivos principales de Windows que compara la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "NTFS, exFAT, ext4 y FAT32."
  - id: b
    text:
      es: "NTFS, HFS+, UDF y FAT32."
  - id: c
    text:
      es: "NTFS, APFS, exFAT y UDF."
  - id: d
    correct: true
    text:
      es: "NTFS, exFAT, UDF y FAT32."
  explanation:
    es: "La página compara «los cuatro sistemas de archivos principales de Windows, NTFS, exFAT, UDF y FAT32». Ext4, HFS+ y APFS no figuran en esa comparación, así que ninguna de las otras series coincide con los cuatro que da Microsoft."
