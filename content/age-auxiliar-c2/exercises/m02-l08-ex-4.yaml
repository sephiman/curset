# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q186
  prompt:
    es: "En Word 365, ¿qué puede seleccionarse en la barra de estado, con el botón derecho, para añadir un indicador de Control de cambios, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "La opción Control de cambios"
  - id: b
    text:
      es: "La opción Contar palabras"
  - id: c
    text:
      es: "La opción Revisión simple"
  - id: d
    text:
      es: "La opción Bloquear seguimiento"
  explanation:
    es: "La página recomienda clic derecho en la barra de estado y elegir Control de cambios. «La opción Contar palabras» es una función de la barra de estado para el recuento, no el indicador de seguimiento. «La opción Revisión simple» es una opción del grupo Marcado de la pestaña Revisar. «La opción Bloquear seguimiento» es una opción de Seguimiento que pide contraseña."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-comprobador-accesibilidad-html
- id: m02-l08-q194
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas abre el Comprobador de accesibilidad cuando una versión anterior de la aplicación no lo muestra en la pestaña Revisar, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Archivo › Información › Comprobar si hay problemas › Comprobar accesibilidad"
  - id: b
    text:
      es: "Archivo › Opciones › Accesibilidad › Comprobar accesibilidad"
  - id: c
    text:
      es: "Archivo › Información › Proteger documento › Restringir edición › Comprobar accesibilidad"
  - id: d
    text:
      es: "Archivo › Imprimir › Configuración › Comprobar accesibilidad"
  explanation:
    es: "La página da esa ruta para versiones anteriores sin el botón en Revisar. «Archivo › Opciones › Accesibilidad › Comprobar accesibilidad» Opciones › Accesibilidad configura el texto alternativo automático, no abre el comprobador. «Archivo › Información › Proteger documento › Restringir edición › Comprobar accesibilidad» Proteger documento no contiene el comprobador según la página. «Archivo › Imprimir › Configuración › Comprobar accesibilidad» la vista de impresión no contiene el comprobador según la página."
  citation: "fuente: `ms-office-comprobador-accesibilidad.html`; «Mejorar la accesibilidad con el Comprobador de accesibilidad»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q198
  prompt:
    es: "En Word 365, ¿qué debe hacerse con un borde estilístico que solo agrega interés visual y no información, según la página sobre texto alternativo?"
  options:
  - id: a
    text:
      es: "Escribirle un texto alternativo de cuatro frases"
  - id: b
    correct: true
    text:
      es: "Marcarlo como decorativo, sin escribir texto alternativo"
  - id: c
    text:
      es: "Eliminarlo para que el lector de pantalla no lo lea"
  - id: d
    text:
      es: "Aprobarlo con la casilla Aprobar texto alternativo"
  explanation:
    es: "La página indica marcarlo como decorativo sin escribir texto. «Escribirle un texto alternativo de cuatro frases» contradice la página, que no pide texto para objetos decorativos. «Eliminarlo para que el lector de pantalla no lo lea» no es lo que dice la página, que lo marca como decorativo. «Aprobarlo con la casilla Aprobar texto alternativo» esa casilla aprueba el texto generado automáticamente, no marca decorativos. Lo que dice la fuente: «puede marcarlos como tal, sin tener que escribir texto alternativo»."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q199
  prompt:
    es: "Señale en Word 365 qué ocurre con el campo de entrada de texto del panel Texto alternativo al seleccionar la casilla Marcar como decorativo, según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Se rellena con una descripción generada"
  - id: b
    correct: true
    text:
      es: "Queda atenuado"
  - id: c
    text:
      es: "Se amplía para admitir más frases"
  - id: d
    text:
      es: "Se bloquea con una contraseña"
  explanation:
    es: "La página dice que el campo de entrada de texto queda atenuado. «Se rellena con una descripción generada» no es lo que dice la página, que atenúa el campo. «Se amplía para admitir más frases» no es lo que dice la página, que atenúa el campo. «Se bloquea con una contraseña» no es lo que dice la página, que atenúa el campo. Lo que dice la fuente: «Seleccione la casilla Marcar como decorativo . El campo de entrada de texto está ahora atenuado»."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q200
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas desactiva la generación automática de texto alternativo con IA en las imágenes insertadas, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Archivo › Opciones › Revisión"
  - id: b
    text:
      es: "Archivo › Opciones › Avanzadas"
  - id: c
    text:
      es: "Archivo › Opciones › Mostrar"
  - id: d
    correct: true
    text:
      es: "Archivo › Opciones › Accesibilidad"
  explanation:
    es: "La página indica Archivo, Opciones y Accesibilidad. «Archivo › Opciones › Revisión» Revisión contiene las opciones de ortografía y autocorrección, no el texto alternativo. «Archivo › Opciones › Avanzadas» Avanzadas contiene la dirección postal, entre otras, no el texto alternativo. «Archivo › Opciones › Mostrar» Mostrar contiene las marcas de formato y de impresión, no el texto alternativo."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-word-combinar-reglas-html
- id: m02-l08-q203
  prompt:
    es: "En Word 365, ¿cuál de las siguientes reglas de combinar correspondencia excluye a destinatarios según la información del origen de datos, como los de una talla concreta?"
  options:
  - id: a
    text:
      es: "Siguiente registro si"
  - id: b
    correct: true
    text:
      es: "Saltar registro si"
  - id: c
    text:
      es: "Combinar registro #"
  - id: d
    text:
      es: "Preguntar"
  explanation:
    es: "La página describe la regla que excluye destinatarios según el origen de datos. «Siguiente registro si» sigue con el registro siguiente según una condición, no excluye destinatarios. «Combinar registro #» muestra la posición numerada del destinatario en la lista. «Preguntar» pide una respuesta una vez y la muestra en varios lugares."
  citation: "fuente: `ms-word-combinar-reglas.html`; «Establecer las reglas para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-combinar-reglas-html
- id: m02-l08-q206
  prompt:
    es: "En Word 365, ¿cuál de las siguientes reglas de combinar correspondencia indica a Word que continúe con el registro siguiente sin empezar una página nueva, como en una hoja de etiquetas postales?"
  options:
  - id: a
    text:
      es: "Próximo registro si"
  - id: b
    correct: true
    text:
      es: "Próximo registro"
  - id: c
    text:
      es: "Combinar registro #"
  - id: d
    text:
      es: "Saltar registro si"
  explanation:
    es: "La página usa Próximo registro en cada celda de la tabla de etiquetas. «Próximo registro si» solo pasa al registro siguiente cuando se cumple una condición. «Combinar registro #» muestra el número del registro, no avanza al siguiente. «Saltar registro si» excluye destinatarios, no continúa en la misma página."
  citation: "fuente: `ms-word-combinar-reglas.html`; «Establecer las reglas para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-combinar-reglas-html
- id: m02-l08-q207
  prompt:
    es: "En Word 365, ¿cuándo deben configurarse las reglas de combinar correspondencia, según la página de Microsoft sobre cómo establecerlas?"
  options:
  - id: a
    text:
      es: "Antes de seleccionar el documento principal y los destinatarios"
  - id: b
    text:
      es: "Solo después de finalizar y combinar los documentos individuales"
  - id: c
    correct: true
    text:
      es: "Después de seleccionar los destinatarios e insertar los campos de combinación"
  - id: d
    text:
      es: "En cualquier momento, sin elegir antes el origen de datos"
  explanation:
    es: "La página indica ese orden para configurar reglas. «Antes de seleccionar el documento principal y los destinatarios» invierte el orden que da la página. «Solo después de finalizar y combinar los documentos individuales» contradice la página, que las configura antes de combinar. «En cualquier momento, sin elegir antes el origen de datos» contradice la página, que exige elegir destinatarios antes."
  citation: "fuente: `ms-word-combinar-reglas.html`; «Establecer las reglas para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-word-texto-ejemplo-html
- id: m02-l08-q219
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones debe estar activada en Autocorrección para que funcione la inserción de texto de ejemplo con =rand(), según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Revisar ortografía mientras escribe"
  - id: b
    correct: true
    text:
      es: "Reemplazar texto mientras escribe"
  - id: c
    text:
      es: "Marcar errores gramaticales mientras escribe"
  - id: d
    text:
      es: "Mostrar automáticamente el Portapapeles"
  explanation:
    es: "La página dice que la función se deshabilita si esa opción está desactivada. «Revisar ortografía mientras escribe» es la opción de revisión automática de errores, no la que habilita el texto de ejemplo. «Marcar errores gramaticales mientras escribe» es la opción de revisión gramatical, no la que habilita el texto de ejemplo. «Mostrar automáticamente el Portapapeles» pertenece al Portapapeles de Office, no a la Autocorrección."
  citation: "fuente: `ms-word-texto-ejemplo.html`; «Cómo insertar texto de ejemplo en Microsoft Office Word»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q255
  prompt:
    es: "En Word 365, ¿cuál de las siguientes afirmaciones sobre los comentarios y la función Control de cambios es correcta, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Los comentarios se registran siempre como un tipo de marca de revisión."
  - id: b
    correct: true
    text:
      es: "Los comentarios ya no forman parte de la función Control de cambios."
  - id: c
    text:
      es: "Los comentarios se desactivan al desactivar el Control de cambios."
  - id: d
    text:
      es: "Los comentarios solo pueden verse en el Panel de revisión."
  explanation:
    es: "La página advierte de que los comentarios ya no forman parte del Control de cambios. «Los comentarios se registran siempre como un tipo de marca de revisión.» contradice la página, que los separa del Control de cambios. «Los comentarios se desactivan al desactivar el Control de cambios.» contradice la página, que los separa del Control de cambios. «Los comentarios solo pueden verse en el Panel de revisión.» contradice la página, que los muestra también en globos y en el documento."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-portapapeles-copiar-html
- id: m02-l08-q257
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones del panel Portapapeles elimina todos los elementos del Portapapeles de Office a la vez, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Borrar todo"
  - id: b
    text:
      es: "Pegar todo"
  - id: c
    text:
      es: "Eliminar este elemento"
  - id: d
    text:
      es: "Opciones"
  explanation:
    es: "La página indica Borrar todo para eliminar todos los elementos. «Pegar todo» pega todos los elementos copiados, no los elimina. «Eliminar este elemento» borra solo el elemento junto al que se elige. «Opciones» controla cómo se muestra el Portapapeles, no elimina elementos."
  citation: "fuente: `ms-office-portapapeles-copiar.html`; «Copiar y pegar con el Portapapeles de Office»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q258
  prompt:
    es: "En Word 365, ¿cuál de las siguientes casillas se activa para aceptar el texto alternativo que Microsoft 365 ha generado automáticamente para una imagen, si es correcto?"
  options:
  - id: a
    correct: true
    text:
      es: "Aprobar texto alternativo"
  - id: b
    text:
      es: "Marcar como decorativo"
  - id: c
    text:
      es: "Habilitar la opción para generar texto alternativo con IA"
  - id: d
    text:
      es: "Ver texto alternativo"
  explanation:
    es: "La página indica activar la casilla Aprobar texto alternativo. «Marcar como decorativo» declara que el objeto es decorativo y atenúa el campo de texto. «Habilitar la opción para generar texto alternativo con IA» activa o desactiva la generación automática, no aprueba el texto ya generado. «Ver texto alternativo» es la opción del menú contextual que abre el panel, no una casilla de aprobación."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-combinar-reglas-html
- id: m02-l08-q267
  prompt:
    es: "En Word 365, ¿qué ejemplo da la página de Microsoft para la regla de combinar correspondencia «Si... Entonces... De lo contrario»?"
  options:
  - id: a
    text:
      es: "Mostrar a cada destinatario su posición numerada en una lista de espera"
  - id: b
    correct: true
    text:
      es: "Un mensaje de llegada si País o región está en blanco y otro si no lo está"
  - id: c
    text:
      es: "Excluir a los clientes cuyo campo Tamaño coincide con un tamaño específico"
  - id: d
    text:
      es: "Escribir una vez la fecha de una reunión y mostrarla en varios lugares del documento"
  explanation:
    es: "La página presenta esta regla para mostrar texto diferente según el origen de datos: un mensaje de llegada cuando el campo País o región está en blanco y otro cuando no lo está. Mostrar al destinatario su posición en una lista de espera es el ejemplo de la regla Combinar registro n.º. Excluir a los clientes de una talla concreta es el ejemplo de Saltar registro si. Escribir una vez la fecha de una reunión y mostrarla en varios lugares es el ejemplo de la regla Preguntar."
  citation: "fuente: `ms-word-combinar-reglas.html`; «Establecer las reglas para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-combinar-reglas-html
- id: m02-l08-q268
  prompt:
    es: "¿Para qué recomienda la página de Microsoft usar en Word 365 la regla Combinar registro n.º junto al campo Fecha de impresión?"
  options:
  - id: a
    text:
      es: "Para excluir a los clientes que usan una talla específica"
  - id: b
    text:
      es: "Para mostrar una fecha de reunión escrita una sola vez en varios lugares"
  - id: c
    text:
      es: "Para pasar al registro siguiente sin empezar una página nueva"
  - id: d
    correct: true
    text:
      es: "Para crear números de factura únicos"
  explanation:
    es: "La página recomienda esta regla junto al campo Fecha de impresión para crear números de factura únicos. Excluir a los clientes de una talla es la función de Saltar registro si. Escribir una fecha una sola vez para mostrarla en varios lugares es la función de la regla Preguntar. Pasar al registro siguiente sin empezar una página nueva es la función de la regla Registro siguiente."
  citation: "fuente: `ms-word-combinar-reglas.html`; «Establecer las reglas para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-word-texto-ejemplo-html
- id: m02-l08-q270
  prompt:
    es: "En Word 365 configurado en español, ¿qué inserta =aleatorio(1) al escribirlo en una línea y pulsar Entrar, según el ejemplo de la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Tres párrafos con una línea de texto cada uno"
  - id: b
    text:
      es: "Un párrafo con una línea de texto"
  - id: c
    correct: true
    text:
      es: "Un párrafo con tres líneas de texto"
  - id: d
    text:
      es: "Diez párrafos con diez líneas de texto cada uno"
  explanation:
    es: "En la función, p es el número de párrafos y l el de líneas por párrafo, y si se omite l el valor predeterminado es tres. Por eso =aleatorio(1) inserta un párrafo con tres líneas. Tres párrafos de una línea invierte los dos parámetros. Un párrafo de una línea contradice el valor predeterminado de tres líneas. Diez párrafos de diez líneas es el resultado del otro ejemplo de la página, =aleatorio(10;10)."
  citation: "fuente: `ms-word-texto-ejemplo.html`; «Cómo insertar texto de ejemplo en Microsoft Office Word»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-texto-ejemplo-html
- id: m02-l08-q272
  prompt:
    es: "¿Cuál de las siguientes instrucciones inserta en Word 365 texto de muestra no localizado y seudolatino, como «Lorem ipsum dolor sit amet»?"
  options:
  - id: a
    text:
      es: "=rand()"
  - id: b
    text:
      es: "=aleatorio(10;10)"
  - id: c
    text:
      es: "=aleatorio(1)"
  - id: d
    correct: true
    text:
      es: "=lorem()"
  explanation:
    es: "La página explica que =lorem() inserta texto de muestra no localizado y seudolatino, y pone como ejemplo el texto «Lorem ipsum dolor sit amet». =rand() inserta texto de muestra localizado. =aleatorio(10;10) es un ejemplo de la función rand con parámetros, que inserta 10 párrafos de 10 líneas del mismo texto localizado. =aleatorio(1) también es la función rand, con un párrafo de tres líneas de texto localizado."
  citation: "fuente: `ms-word-texto-ejemplo.html`; «Cómo insertar texto de ejemplo en Microsoft Office Word»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q273
  prompt:
    es: "En Word 365, ¿qué escucha una persona que usa un lector de pantalla cuando encuentra en un documento una imagen que tiene texto alternativo?"
  options:
  - id: a
    text:
      es: "Solo que ha alcanzado una imagen, sin saber lo que muestra"
  - id: b
    correct: true
    text:
      es: "El texto alternativo, que describe la imagen"
  - id: c
    text:
      es: "Que el objeto es decorativo y no aporta información"
  - id: d
    text:
      es: "El nombre del archivo de la imagen"
  explanation:
    es: "La página dice que quien usa un lector de pantalla escucha el texto alternativo que describe la imagen. Saber solo que se ha alcanzado una imagen, sin saber qué muestra, es lo que ocurre cuando la imagen no tiene texto alternativo. Oír que el objeto es decorativo es lo que ocurre con los objetos marcados como decorativos, como los bordes estilísticos. El nombre del archivo no es lo que se escucha: la página dice que el lector lee el texto alternativo que describe la imagen."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-texto-alternativo-html
- id: m02-l08-q274
  prompt:
    es: "En Word 365, ¿cuántas frases recomienda la página de Microsoft escribir en el panel Texto alternativo para describir un objeto?"
  options:
  - id: a
    correct: true
    text:
      es: "Una o dos"
  - id: b
    text:
      es: "Tres o cuatro"
  - id: c
    text:
      es: "Cinco o seis"
  - id: d
    text:
      es: "Un párrafo completo de unas diez frases"
  explanation:
    es: "La página indica que en el panel Texto alternativo se escriben 1 o 2 frases para describir el objeto y el contexto a alguien que no pueda verlo. Tres o cuatro y cinco o seis superan lo que pide la página. Un párrafo de diez frases también, porque la página pide solo una o dos."
  citation: "fuente: `ms-office-texto-alternativo.html`; «Agregar texto alternativo a formas, imágenes, gráficos, gráficos SmartArt u otros objetos»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-office-portapapeles-copiar-html
- id: m02-l08-q282
  prompt:
    es: "En Word 365, ¿qué ocurre en el Portapapeles de Office cuando ya contiene 24 elementos y se copia uno más, el vigésimo quinto?"
  options:
  - id: a
    text:
      es: "Se rechaza la copia y el Portapapeles conserva los 24 elementos"
  - id: b
    text:
      es: "Se vacía todo el Portapapeles y queda solo el elemento nuevo"
  - id: c
    text:
      es: "Se cierra el panel de tareas Portapapeles y se detiene la recopilación"
  - id: d
    correct: true
    text:
      es: "Se elimina el primer elemento del Portapapeles de Office"
  explanation:
    es: "La página dice que el Portapapeles de Office puede contener hasta 24 elementos y que, si se copia un vigésimo quinto elemento, se elimina el primer elemento. Por eso la copia no se rechaza: el elemento nuevo entra y sale el primero. Tampoco se vacía todo el Portapapeles, porque solo se elimina un elemento. Seguir recopilando es justo lo que supone eliminar el primer elemento: el panel no se cierra ni la recopilación se detiene."
  citation: "fuente: `ms-office-portapapeles-copiar.html`; «Copiar y pegar con el Portapapeles de Office»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-portapapeles-copiar-html
- id: m02-l08-q283
  prompt:
    es: "En el panel Portapapeles de Word 365, ¿qué hace la opción Recopilar sin mostrar el Portapapeles de Office, del menú Opciones del panel de tareas?"
  options:
  - id: a
    correct: true
    text:
      es: "Copia automáticamente los elementos en el Portapapeles sin mostrar el panel de tareas"
  - id: b
    text:
      es: "Muestra el Portapapeles de Office automáticamente al copiar los elementos"
  - id: c
    text:
      es: "Muestra el Portapapeles de Office automáticamente al presionar Ctrl+C dos veces"
  - id: d
    text:
      es: "Muestra el mensaje de elementos recopilados al copiar elementos en el Portapapeles"
  explanation:
    es: "La tabla de la página describe esta opción como la que copia automáticamente elementos en el Portapapeles de Office sin mostrar el panel de tareas Portapapeles. Mostrar el Portapapeles automáticamente al copiar los elementos es la descripción de la opción Mostrar automáticamente el Portapapeles de Office. Mostrarlo al presionar Ctrl+C dos veces es la descripción de la opción que lleva ese nombre. Mostrar el mensaje de elementos recopilados es la descripción de Mostrar estado cerca de la barra de tareas al copiar."
  citation: "fuente: `ms-office-portapapeles-copiar.html`; «Copiar y pegar con el Portapapeles de Office»"
