    sentence: You can use the @IntroducedAt annotation or the @JvmOverloads annotation to generate overloads for optional parameters.
  - option: '`@Throws`'
    anchor: kotlin-docs-exceptions#exception-interoperability-with-java-swift-and-objective-c
    sentence: This annotation alerts callers about possible exceptions.
  - option: '`@IntroducedAt`'
    anchor: kotlin-docs-java-to-kotlin-interop#overloads-generation
    sentence: Use @IntroducedAt when you add new optional parameters to published APIs and want the generated overloads to reflect the version in which each parameter was introduced.
m04-l05-q02:
  key:
    anchor: kotlin-docs-java-to-kotlin-interop#checked-exceptions
    sentence: You get an error message from the Java compiler, because writeToFile() does not declare IOException.
  wrong:
