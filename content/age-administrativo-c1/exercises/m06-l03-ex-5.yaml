# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q141
  prompt:
    es: "En la configuración de búsqueda de Windows 11, ¿cuál de las siguientes afirmaciones describe el modo de indexación Mejorado de «Encontrar mis archivos»?"
  options:
  - id: a
    text:
      es: "Indexa Documentos, Imágenes y Música y usa menos recursos"
  - id: b
    correct: true
    text:
      es: "Indexa todo el equipo y puede usar más recursos del sistema"
  - id: c
    text:
      es: "Indexa todo el equipo y usa menos recursos que el Clásico"
  - id: d
    text:
      es: "Indexa solo las carpetas que se añaden con el botón Modificar"
  explanation:
    es: "La página dice que el modo Mejorado indexa todo el equipo, incluidas todas las carpetas y archivos de usuario, y que da resultados más completos pero puede usar más recursos del sistema. Documentos, Imágenes y Música son las carpetas del modo Clásico. La opción que dice que usa menos recursos invierte la advertencia. Añadir carpetas con «Modificar» es cómo se amplía el modo Clásico."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
  difficulty: 1
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q142
  prompt:
    es: "En Windows 11, con el modo Clásico de «Encontrar mis archivos», ¿qué se selecciona para agregar otra carpeta a las ubicaciones indexadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Personalizar ubicaciones de búsqueda y, después, Modificar"
  - id: b
    text:
      es: "Opciones de indexación, Avanzadas y Tipos de archivo"
  - id: c
    text:
      es: "Mostrar más opciones y, después, Conceder acceso a"
  - id: d
    text:
      es: "Anclar a acceso rápido en el menú contextual de la carpeta"
  explanation:
    es: "La página indica que, para agregar otra ubicación, se selecciona «Personalizar ubicaciones de búsqueda» y se elige «Modificar» para ver las ubicaciones indexadas y seleccionar las carpetas. «Avanzadas › Tipos de archivo» elige cómo se indexa cada tipo de archivo, no qué carpetas. «Conceder acceso a» comparte en la red. «Anclar a acceso rápido» fija la carpeta en Acceso rápido, pero no la indexa."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
