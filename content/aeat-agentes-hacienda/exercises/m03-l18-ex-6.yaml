# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0103
  prompt:
    es: "Conforme al artículo 20.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las exenciones relativas a los números 20.º y 22.º del apartado Uno pueden ser objeto de renuncia por:"
  options:
  - id: a
    text:
      es: "el adquirente, mediante comunicación previa a la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "cualquiera de las partes, de común acuerdo y por escrito, sin más requisitos."
  - id: c
    text:
      es: "el sujeto pasivo, en el plazo que fije cada año la Agencia Estatal de Administración Tributaria."
  - id: d
    correct: true
    text:
      es: "el sujeto pasivo, en la forma y con los requisitos que se determinen reglamentariamente."
  explanation:
    es: "Renuncia el sujeto pasivo, con la forma y los requisitos que fije un reglamento. No es el adquirente quien renuncia, la ley no remite a un plazo anual de la Agencia Tributaria y no basta el acuerdo escrito de las partes sin los requisitos reglamentarios."
  citation: "art. 20.Dos LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "renuncia"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0104
  prompt:
    es: "Hermanos Ríos, S.A. vende un terreno no edificable a Textil Sur, S.A., que realiza operaciones con derecho a deducción total y actúa como empresario. Según el artículo 20.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿puede el vendedor renunciar a la exención de la entrega?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque el adquirente es un sujeto pasivo que actúa como empresario y tiene derecho a deducir el IVA soportado."
  - id: b
    text:
      es: "No, porque la renuncia solo procede en las entregas de edificaciones y no en las de terrenos."
  - id: c
    text:
      es: "Sí, pero solo si el adquirente es una sociedad mercantil con derecho a deducir la totalidad del impuesto soportado."
  - id: d
    text:
      es: "No, porque el vendedor no puede renunciar a una exención establecida en favor del adquirente."
  explanation:
    es: "La renuncia a la exención de los números 20.º y 22.º procede cuando el adquirente es sujeto pasivo en el ejercicio de su actividad y tiene derecho a deducir el impuesto soportado, total o parcialmente. Los terrenos del número 20.º están incluidos, no se trata de una exención en favor del adquirente y no se exige que sea sociedad mercantil ni que deduzca la totalidad."
  citation: "art. 20.Dos LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "renuncia"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0106
  prompt:
    es: "¿A cuál de las siguientes exenciones del apartado Uno del artículo 20 se refiere la posibilidad de renuncia del artículo 20.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "A la de las operaciones de seguro, reaseguro y capitalización."
  - id: b
    text:
      es: "A la de las prestaciones de servicios de hospitalización y asistencia sanitaria de las entidades públicas."
  - id: c
    text:
      es: "A la de los depósitos en efectivo y las operaciones relacionadas con ellos."
  - id: d
    correct: true
    text:
      es: "A la de las entregas de terrenos rústicos y demás que no tengan la condición de edificables."
  explanation:
    es: "La renuncia se refiere a las exenciones de los números 20.º y 22.º, que son las de terrenos no edificables y las de segundas y ulteriores entregas de edificaciones. Los seguros, los depósitos y la hospitalización no son renunciables según este apartado."
  citation: "art. 20.Dos LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "renuncia"
# anchor: boe-a-1992-28740-art-21
- id: m03-l18-q0110
  prompt:
    es: "¿Cuál de las siguientes entregas de bienes está exenta según el artículo 21.2.º.B) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "La efectuada en una tienda libre de impuestos de un aeropuerto a quien sale inmediatamente con destino a territorios terceros."
  - id: b
    text:
      es: "La efectuada en una tienda libre de impuestos de un aeropuerto a quien viaja a otro Estado miembro."
  - id: c
    text:
      es: "La efectuada a bordo de un buque que navega entre dos puertos situados en la Comunidad."
  - id: d
    text:
      es: "La efectuada en una tienda del puerto sin control aduanero a quien viaja a un país tercero."
  explanation:
    es: "Las tiendas libres de impuestos de puertos y aeropuertos, bajo control aduanero, venden exentos a quienes salen de inmediato con destino a territorios terceros. Si el destino es otro Estado miembro o falta el control aduanero no se cumple el requisito, y el buque debe navegar con destino a puertos de territorios terceros."
  citation: "art. 21.2.º.B) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "tiendas libres de impuestos"
# anchor: boe-a-1992-28740-art-22
- id: m03-l18-q0111
  prompt:
    es: "Conforme al artículo 22 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están exentos los transportes de viajeros y sus equipajes por vía marítima o aérea procedentes de o con destino a:"
  options:
  - id: a
    text:
      es: "cualquier puerto, aeropuerto o estación, por vía marítima, aérea o terrestre."
  - id: b
    correct: true
    text:
      es: "un puerto o aeropuerto situado fuera del ámbito espacial del impuesto."
  - id: c
    text:
      es: "un puerto o aeropuerto situado fuera de la Comunidad, y no los de otros Estados miembros."
  - id: d
    text:
      es: "una estación de ferrocarril situada fuera del ámbito espacial del impuesto."
  explanation:
    es: "La referencia es el ámbito espacial del impuesto, no la Comunidad, y alcanza puertos y aeropuertos. Los transportes por ferrocarril o por tierra no están en el apartado, que se limita a las vías marítima y aérea."
  citation: "art. 22 LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "transporte de viajeros"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0156
  prompt:
    es: "Conforme al artículo 20.Uno.18.º.a) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la exención de los depósitos no se extiende a los servicios prestados al cedente en el marco de los contratos de factoring, con excepción de los de:"
  options:
  - id: a
    text:
      es: "garantía de insolvencia de los deudores cedidos."
  - id: b
    correct: true
    text:
      es: "anticipo de fondos que se puedan prestar en esos contratos."
  - id: c
    text:
      es: "asesoramiento financiero al cedente sobre su cartera de clientes."
  - id: d
    text:
      es: "gestión de cobro de los créditos cedidos al factor."
  explanation:
    es: "En el factoring, solo el anticipo de fondos queda dentro de la exención. La gestión de cobro, la garantía de insolvencia y el asesoramiento al cedente están excluidos de ella."
  citation: "art. 20.Uno.18.º.a) LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "factoring"
# anchor: boe-a-1992-28740-art-21
- id: m03-l18-q0157
  prompt:
    es: "De acuerdo con el artículo 21 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están exentas del impuesto las entregas de bienes expedidos o transportados fuera de la Comunidad por el transmitente, en las condiciones y con los requisitos que:"
  options:
  - id: a
    correct: true
    text:
      es: "se establezcan reglamentariamente."
  - id: b
    text:
      es: "fije cada año la ley de presupuestos generales."
  - id: c
    text:
      es: "determine la Administración tributaria en cada caso concreto."
  - id: d
    text:
      es: "acuerden entre sí el transmitente y el adquirente."
  explanation:
    es: "Las exenciones del artículo 21 se aplican con las condiciones y los requisitos que fije un reglamento. No los fija la ley de presupuestos, ni la Administración caso por caso, ni un pacto entre las partes."
  citation: "art. 21 LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "exportaciones"
# anchor: boe-a-1992-28740-art-23
- id: m03-l18-q0160
  prompt:
    es: "Los artículos 23, 24 y 25 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido regulan, respectivamente, las exenciones relativas a las situaciones de depósito temporal y otras situaciones, las relativas a regímenes aduaneros y fiscales y las:"
  options:
  - id: a
    text:
      es: "exenciones en las operaciones interiores a favor de los entes públicos y de las entidades sociales."
  - id: b
    correct: true
    text:
      es: "exenciones en las entregas de bienes destinados a otro Estado miembro."
  - id: c
    text:
      es: "exenciones en las adquisiciones intracomunitarias de bienes."
  - id: d
    text:
      es: "exenciones en las exportaciones de bienes a países terceros."
  explanation:
    es: "El artículo 25 regula las exenciones en las entregas de bienes destinados a otro Estado miembro. Las exportaciones están en el artículo 21 y las operaciones interiores en el 20, y las adquisiciones intracomunitarias no son objeto de ese artículo."
  citation: "arts. 23, 24 y 25 LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "estructura"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0165
  prompt:
    es: "Conforme al artículo 20.Uno.2.º.d) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la exención de las prestaciones de hospitalización y asistencia sanitaria no se extiende a los arrendamientos de bienes efectuados por:"
  options:
  - id: a
    text:
      es: "los pacientes a los establecimientos en los que reciben la asistencia sanitaria o la hospitalización."
  - id: b
    text:
      es: "las entidades sin ánimo de lucro de carácter social."
  - id: c
    text:
      es: "los profesionales médicos o sanitarios que ejercen por cuenta propia."
  - id: d
    correct: true
    text:
      es: "las entidades que prestan esos servicios de hospitalización o asistencia sanitaria."
  explanation:
    es: "Los arrendamientos de bienes que hacen las entidades de hospitalización y asistencia sanitaria quedan fuera de su exención. Los arrendamientos de los pacientes, de las entidades sociales y de los profesionales por cuenta propia no son los que excluye el número."
  citation: "art. 20.Uno.2.º.d) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "hospitalización"
  - "arrendamientos"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0166
  prompt:
    es: "Según el artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la exención del número 22.º no se aplica a las entregas de edificaciones para su rehabilitación por el adquirente, siempre que se cumplan los requisitos:"
  options:
  - id: a
    correct: true
    text:
      es: "que reglamentariamente se establezcan."
  - id: b
    text:
      es: "que la ley de presupuestos concrete cada año."
  - id: c
    text:
      es: "que fije el contrato de compraventa entre las partes."
  - id: d
    text:
      es: "que el ayuntamiento determine en la licencia de obras."
  explanation:
    es: "La excepción por rehabilitación exige los requisitos que se establezcan reglamentariamente. No los fija el contrato, la licencia municipal ni la ley de presupuestos."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "rehabilitación"
# anchor: boe-a-1992-28740-art-21
- id: m03-l18-q0172
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de bienes expedidos o transportados fuera de la Comunidad por el transmitente, según el artículo 21.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Están exentas solo cuando el adquirente es una persona jurídica que no actúa como empresario."
  - id: b
    text:
      es: "Están exentas solo cuando el transmitente es un empresario no establecido en el territorio de aplicación."
  - id: c
    correct: true
    text:
      es: "Están exentas cuando los bienes los transporta el transmitente o un tercero que actúe en nombre y por cuenta de este."
  - id: d
    text:
      es: "Están exentas cuando los bienes los transporta el adquirente establecido en el territorio de aplicación del impuesto."
  explanation:
    es: "El número 1.º exime las entregas con transporte fuera de la Comunidad por el transmitente o por un tercero que actúe por su cuenta. El transporte por un adquirente establecido en el territorio no está en esa regla, y no se exige que el adquirente sea persona jurídica ni que el transmitente no esté establecido."
  citation: "art. 21.1.º LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "exportaciones"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0178
  prompt:
    es: "Según el artículo 20.Uno.2.º.b) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué servicios de alimentación y alojamiento quedan fuera de la exención de la hospitalización y asistencia sanitaria?"
  options:
  - id: a
    text:
      es: "Los prestados a los acompañantes de los pacientes hospitalizados."
  - id: b
    correct: true
    text:
      es: "Los prestados a personas distintas de los destinatarios de esos servicios y de sus acompañantes."
  - id: c
    text:
      es: "Los prestados a los pacientes que ingresan por el servicio de urgencias."
  - id: d
    text:
      es: "Los prestados a los destinatarios de los servicios de asistencia sanitaria que se presten en el propio establecimiento."
  explanation:
    es: "Quedan fuera de la exención los servicios de alimentación y alojamiento prestados a personas que no son destinatarios de la hospitalización ni acompañantes. Los acompañantes, los destinatarios y los pacientes de urgencias sí están dentro."
  citation: "art. 20.Uno.2.º.b) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "hospitalización"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0184
  prompt:
    es: "¿Cuál de las siguientes operaciones financieras está exenta, de acuerdo con el artículo 20.Uno.18.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Los servicios de gestión de cobro de créditos, letras de cambio, recibos y otros documentos."
  - id: b
    text:
      es: "El asesoramiento financiero prestado a los depositantes por las entidades de crédito."
  - id: c
    text:
      es: "Los servicios prestados al cedente en el marco de contratos de factoring, salvo el anticipo de fondos."
  - id: d
    correct: true
    text:
      es: "La concesión de créditos y préstamos en dinero, cualquiera que sea la forma en que se instrumente."
  explanation:
    es: "Está exenta la concesión de créditos y préstamos en dinero, cualquiera que sea la forma en que se instrumente (art. 20.Uno.18.º.c). La exención de los depósitos no se extiende a los servicios de gestión de cobro de créditos, letras de cambio, recibos y otros documentos, ni a los servicios prestados al cedente en contratos de factoring, con excepción de los de anticipo de fondos (art. 20.Uno.18.º.a). El asesoramiento financiero no es una de las operaciones que enumera el número 18.º."
  citation: "art. 20.Uno.18.º.c) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "operaciones financieras"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0185
  prompt:
    es: "Señale la respuesta CORRECTA sobre la exención de las entregas de terrenos del artículo 20.Uno.20.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se extiende a las entregas de terrenos urbanizados o en curso de urbanización, siempre que no tengan la condición de edificables."
  - id: b
    correct: true
    text:
      es: "No se extiende a las entregas de terrenos urbanizados o en curso de urbanización, excepto los destinados exclusivamente a parques y jardines públicos o a superficies viales de uso público."
  - id: c
    text:
      es: "No se extiende a las entregas de terrenos destinados exclusivamente a parques y jardines públicos o a superficies viales de uso público."
  - id: d
    text:
      es: "No se extiende a las entregas de terrenos rústicos, aunque se hallen enclavadas en ellos construcciones indispensables para una explotación agraria."
  explanation:
    es: "La exención de las entregas de terrenos no se extiende a las de terrenos urbanizados o en curso de urbanización, excepto los destinados exclusivamente a parques y jardines públicos o a superficies viales de uso público (art. 20.Uno.20.º.a). Decir que sí se extiende a los terrenos urbanizados contradice la exclusión. Las entregas de terrenos rústicos, incluidas las construcciones enclavadas indispensables para una explotación agraria, sí están exentas. Y los terrenos destinados exclusivamente a parques y jardines públicos o a superficies viales de uso público son precisamente la excepción: están exentos."
  citation: "art. 20.Uno.20.º.a) LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "terrenos"
