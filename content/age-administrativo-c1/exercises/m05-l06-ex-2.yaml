# anchor: boe-a-2003-20977-art-5
- id: m05-l06-q026
  prompt:
    es: "De acuerdo con el artículo 5.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, en defecto de esa ley, de sus disposiciones de desarrollo y de las restantes normas de derecho administrativo, a las subvenciones se aplican:"
  options:
  - id: a
    text:
      es: "Las normas de la Ley de Contratos del Sector Público, por analogía."
  - id: b
    correct: true
    text:
      es: "Las normas de derecho privado."
  - id: c
    text:
      es: "Los principios generales del derecho, sin que quepa aplicar otras normas."
  - id: d
    text:
      es: "Las normas del derecho de la Unión Europea, siempre que exista cofinanciación."
  explanation:
    es: "El artículo 5.1 ordena las fuentes: la Ley General de Subvenciones y su desarrollo, las restantes normas de derecho administrativo y, «en su defecto», las normas de derecho privado. La Ley de Contratos, los principios generales y el derecho de la Unión no aparecen como norma supletoria en ese artículo."
  citation: "art. 5.1 LGS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-20977-art-8
- id: m05-l06-q028
  prompt:
    es: "Según el artículo 8.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿a qué se supedita en todo caso el plan estratégico de subvenciones?"
  options:
  - id: a
    text:
      es: "Al cumplimiento de los objetivos de eficacia y eficiencia en la asignación de recursos."
  - id: b
    text:
      es: "Al cumplimiento de los objetivos de publicidad, transparencia y concurrencia."
  - id: c
    text:
      es: "Al cumplimiento de los objetivos de política económica del Gobierno en cada legislatura."
  - id: d
    correct: true
    text:
      es: "Al cumplimiento de los objetivos de estabilidad presupuestaria."
  explanation:
    es: "El artículo 8.1 LGS dice que el plan estratégico de subvenciones se elabora «supeditándose en todo caso al cumplimiento de los objetivos de estabilidad presupuestaria». La eficacia y la eficiencia son principios de gestión del apartado 3, en las letras b) y c). La publicidad, la transparencia y la concurrencia son principios de gestión de la letra a) del mismo apartado 3. Los objetivos de política económica de cada legislatura no son aquello a lo que se supedita el plan según el apartado 1: el apartado dice estabilidad presupuestaria."
  citation: "art. 8.1 LGS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-9
- id: m05-l06-q031
  prompt:
    es: "¿Cuál de los siguientes NO es un requisito para el otorgamiento de una subvención según la Ley 38/2003, de 17 de noviembre, General de Subvenciones?"
  options:
  - id: a
    text:
      es: "La competencia del órgano administrativo concedente."
  - id: b
    correct: true
    text:
      es: "El informe previo favorable del Tribunal de Cuentas sobre el beneficiario."
  - id: c
    text:
      es: "La existencia de crédito adecuado y suficiente para atender las obligaciones económicas."
  - id: d
    text:
      es: "La aprobación del gasto por el órgano competente para ello."
  explanation:
    es: "El artículo 9.4 enumera la competencia del órgano concedente, el crédito adecuado y suficiente, la tramitación del procedimiento, la fiscalización previa y la aprobación del gasto por el órgano competente. El informe del Tribunal de Cuentas sobre el beneficiario no figura entre los requisitos, por lo que es la opción que no lo es."
  citation: "art. 9.4 LGS"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-20977-art-10
- id: m05-l06-q032
  prompt:
    es: "De acuerdo con el artículo 10.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, en la Administración General del Estado son órganos competentes para conceder subvenciones, en sus respectivos ámbitos:"
  options:
  - id: a
    text:
      es: "Los Ministros y los Subsecretarios."
  - id: b
    text:
      es: "Los Secretarios de Estado y los Directores Generales."
  - id: c
    text:
      es: "Los Subsecretarios y los Secretarios Generales Técnicos."
  - id: d
    correct: true
    text:
      es: "Los Ministros y los Secretarios de Estado."
  explanation:
    es: "El artículo 10.1 atribuye la concesión a «los Ministros y los Secretarios de Estado en la Administración General del Estado», cada uno en su ámbito, y a los presidentes o directores de los organismos y entidades públicas vinculados o dependientes. Subsecretarios, Directores Generales y Secretarios Generales Técnicos no figuran entre los órganos que concede el artículo."
  citation: "art. 10.1 LGS"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-20977-art-10
- id: m05-l06-q036
  prompt:
    es: "De acuerdo con el artículo 10.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, la autorización del Consejo de Ministros para conceder una subvención de cuantía superior a 12 millones de euros:"
  options:
  - id: a
    text:
      es: "Implica la aprobación del gasto, sin necesidad de ulterior acto del órgano concedente."
  - id: b
    correct: true
    text:
      es: "No implica la aprobación del gasto, que corresponde en todo caso al órgano competente."
  - id: c
    text:
      es: "Sustituye a la fiscalización previa de los actos administrativos de contenido económico."
  - id: d
    text:
      es: "Sustituye a la existencia de crédito adecuado y suficiente en el presupuesto."
  explanation:
    es: "El artículo 10.2 aclara que la autorización «no implicará la aprobación del gasto, que, en todo caso, corresponderá al órgano competente». No la contiene, y tampoco sustituye a la fiscalización previa ni al crédito, que siguen siendo requisitos del artículo 9.4."
  citation: "art. 10.2 LGS"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-20977-art-10
- id: m05-l06-q037
  prompt:
    es: "Según el artículo 10.3 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, las facultades para conceder subvenciones pueden ser objeto de desconcentración mediante:"
  options:
  - id: a
    text:
      es: "Orden ministerial del Ministro del departamento concedente."
  - id: b
    text:
      es: "Resolución del Secretario de Estado de Presupuestos y Gastos."
  - id: c
    text:
      es: "Acuerdo de la Comisión Delegada del Gobierno para Asuntos Económicos."
  - id: d
    correct: true
    text:
      es: "Real decreto acordado en Consejo de Ministros."
  explanation:
    es: "El artículo 10.3 LGS dice que las facultades para conceder subvenciones podrán ser objeto de desconcentración «mediante real decreto acordado en Consejo de Ministros». Una orden ministerial, una resolución del Secretario de Estado de Presupuestos y Gastos y un acuerdo de la Comisión Delegada del Gobierno para Asuntos Económicos son instrumentos distintos del que nombra el apartado: el apartado designa un único instrumento, el real decreto acordado en Consejo de Ministros."
  citation: "art. 10.3 LGS"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q039
  prompt:
    es: "De acuerdo con el artículo 34.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, en la concesión directa de una subvención la aprobación del gasto debe efectuarse:"
  options:
  - id: a
    text:
      es: "Con la resolución de concesión, que conlleva también la aprobación del gasto."
  - id: b
    text:
      es: "Una vez justificada la actividad por el beneficiario, antes de ordenar el pago."
  - id: c
    correct: true
    text:
      es: "Con carácter previo a la concesión directa, en los términos de la Ley General Presupuestaria."
  - id: d
    text:
      es: "Con posterioridad a la concesión, al reconocerse la obligación correspondiente."
  explanation:
    es: "El artículo 34.1 exige efectuar la aprobación del gasto «con carácter previo a la convocatoria de la subvención o a la concesión directa de la misma». La resolución de concesión conlleva el compromiso del gasto (artículo 34.2), no su aprobación. La justificación y el reconocimiento de la obligación son fases posteriores."
  citation: "art. 34.1 LGS"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q041
  prompt:
    es: "De acuerdo con el artículo 34.4 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, los pagos a cuenta de una subvención se abonan:"
  options:
  - id: a
    text:
      es: "Por la cuantía total concedida, antes de presentar justificación alguna."
  - id: b
    text:
      es: "Por un importe fijo del cincuenta por ciento de la subvención concedida."
  - id: c
    text:
      es: "Por la cuantía que el beneficiario solicite, con independencia de lo ejecutado."
  - id: d
    correct: true
    text:
      es: "Por cuantía equivalente a la justificación presentada."
  explanation:
    es: "Según el artículo 34.4, los pagos a cuenta responden al ritmo de ejecución y se abonan «por cuantía equivalente a la justificación presentada». Entregar toda la cuantía antes de justificar es un pago anticipado, y ni un porcentaje fijo del cincuenta por ciento ni la cuantía que pida el beneficiario figuran en el artículo."
  citation: "art. 34.4 LGS"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q042
  prompt:
    es: "Un beneficiario está declarado en concurso, pero en este ha adquirido eficacia un convenio, y no concurre otra causa impeditiva. ¿Pueden realizársele pagos anticipados de la subvención?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, si la normativa reguladora los prevé expresamente, junto con el régimen de garantías."
  - id: b
    text:
      es: "No, porque el concurso impide en todo caso los pagos anticipados al beneficiario."
  - id: c
    text:
      es: "No, salvo que el órgano concedente exija un aval por el importe íntegro anticipado."
  - id: d
    text:
      es: "Sí, aunque la normativa reguladora no los prevea expresamente."
  explanation:
    es: "El artículo 34.4 prohíbe los pagos anticipados al beneficiario declarado en concurso, «salvo que en éste haya adquirido la eficacia un convenio». Sin otra causa impeditiva, la prohibición no opera, pero el pago anticipado sigue exigiendo que la normativa reguladora lo prevea expresamente, con el régimen de garantías. Por eso fallan tanto la negativa absoluta o la salvedad del aval como la afirmación de que no hace falta previsión."
  citation: "art. 34.4 LGS"
  difficulty: 3
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q043
  prompt:
    es: "Según el artículo 34.4 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿dónde deben preverse expresamente la realización de pagos a cuenta o anticipados y el régimen de garantías?"
  options:
  - id: a
    text:
      es: "En la resolución de concesión de cada subvención individual."
  - id: b
    correct: true
    text:
      es: "En la normativa reguladora de la subvención."
  - id: c
    text:
      es: "En la Ley de Presupuestos Generales del Estado de cada ejercicio."
  - id: d
    text:
      es: "En el plan estratégico de subvenciones del departamento concedente."
  explanation:
    es: "El artículo 34.4 dispone que los pagos a cuenta o anticipados y el régimen de garantías «deberán preverse expresamente en la normativa reguladora de la subvención». La resolución de concesión aplica esa normativa pero no es donde se prevén, y ni la ley de presupuestos ni el plan estratégico son la sede que el artículo señala."
  citation: "art. 34.4 LGS"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q044
  prompt:
    es: "Según el artículo 34.5 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, no podrá realizarse el pago de la subvención mientras el beneficiario:"
  options:
  - id: a
    text:
      es: "No haya iniciado todavía la actividad que fundamenta la concesión, en el plazo previsto en las bases reguladoras."
  - id: b
    text:
      es: "Tenga pendiente un recurso contra la resolución de concesión."
  - id: c
    correct: true
    text:
      es: "No se halle al corriente de sus obligaciones tributarias y frente a la Seguridad Social."
  - id: d
    text:
      es: "No haya constituido garantía por los pagos a cuenta recibidos."
  explanation:
    es: "El artículo 34.5 impide el pago mientras el beneficiario no esté «al corriente en el cumplimiento de sus obligaciones tributarias y frente a la Seguridad Social» o sea deudor por resolución de procedencia de reintegro. No haber iniciado la actividad, un recurso pendiente o la falta de garantía de pagos a cuenta no son las causas que el artículo recoge."
  citation: "art. 34.5 LGS"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2006-13371-art-56
- id: m05-l06-q045
  prompt:
    es: "De acuerdo con el artículo 56.1 del Reglamento de la Ley General de Subvenciones (Real Decreto 887/2006), la convocatoria puede aprobarse en un ejercicio anterior si la ejecución del gasto se realiza:"
  options:
  - id: a
    text:
      es: "En el ejercicio en que se aprueba la convocatoria, antes de la concesión."
  - id: b
    text:
      es: "En la anualidad siguiente a aquella en que se produce la concesión."
  - id: c
    text:
      es: "En el ejercicio en que el beneficiario presente la justificación del gasto."
  - id: d
    correct: true
    text:
      es: "En la misma anualidad en que se produce la concesión."
  explanation:
    es: "El artículo 56.1 permite convocar en un ejercicio anterior «siempre que la ejecución del gasto se realice en la misma anualidad en que se produce la concesión». El gasto no se ejecuta en el ejercicio de la convocatoria ni en el siguiente al de la concesión, ni depende de cuándo se justifique."
  citation: "art. 56.1 RLGS"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2006-13371-art-56
- id: m05-l06-q046
  prompt:
    es: "Según el artículo 56.1.b) del Reglamento de la Ley General de Subvenciones (Real Decreto 887/2006), si el crédito solo figura en el proyecto de presupuestos sometido a las Cortes, el compromiso de gasto se adquiere:"
  options:
  - id: a
    text:
      es: "Al aprobarse la convocatoria en el ejercicio anterior."
  - id: b
    text:
      es: "Al publicarse la ley de presupuestos en el Boletín Oficial del Estado."
  - id: c
    correct: true
    text:
      es: "Al aprobarse la resolución de concesión."
  - id: d
    text:
      es: "Al presentarse las solicitudes de los beneficiarios."
  explanation:
    es: "El artículo 56.1.b) permite convocar con crédito en el proyecto de presupuestos remitido a las Cortes, «en el cual se adquirirá el compromiso de gasto como consecuencia de la aprobación de la resolución de concesión». El compromiso no nace con la convocatoria, ni con la publicación de la ley, ni con las solicitudes."
  citation: "art. 56.1 RLGS"
  difficulty: 3
  tags:
  - "procedimiento"
  - "fecha"
# anchor: boe-a-2006-13371-art-56
- id: m05-l06-q047
  prompt:
    es: "En la convocatoria de subvenciones aprobada en un ejercicio anterior al de su resolución, ¿a qué debe hacerse constar que queda condicionada la concesión?"
  options:
  - id: a
    correct: true
    text:
      es: "La existencia de crédito adecuado y suficiente en el momento de la resolución de concesión."
  - id: b
    text:
      es: "La publicación de los presupuestos en el Boletín Oficial del Estado antes de la convocatoria."
  - id: c
    text:
      es: "El informe favorable de la Intervención General sobre la cuantía máxima estimada."
  - id: d
    text:
      es: "La autorización del Consejo de Ministros del compromiso de gasto de la convocatoria."
  explanation:
    es: "El artículo 56.2 hace estimada la cuantía total máxima y obliga a hacer constar que la concesión «queda condicionada a la existencia de crédito adecuado y suficiente en el momento de la resolución de concesión». La publicación de los presupuestos, el informe de la Intervención General y la autorización del Consejo de Ministros no son esa condición."
  citation: "art. 56.2 RLGS"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1996-2749-anexo-i-nota-34
- id: m05-l06-q049
  prompt:
    es: "Según el anexo I de la Orden de 1 de febrero de 1996 sobre documentos contables de la Administración General del Estado, en una subvención en concurrencia aprobada la concesión, la fecha de gasto es aquella en que:"
  options:
  - id: a
    text:
      es: "Se aprueba el acuerdo de concesión de la subvención por el órgano competente."
  - id: b
    correct: true
    text:
      es: "Se tiene constancia documental de que el beneficiario ha cumplido las condiciones para el pago."
  - id: c
    text:
      es: "Finaliza el plazo establecido para presentar las solicitudes de la convocatoria."
  - id: d
    text:
      es: "Se publica la resolución de concesión en la Base de Datos Nacional de Subvenciones."
  explanation:
    es: "La nota 34.II.a.1 indica que, aprobado el acuerdo de concesión, la fecha de gasto es «la fecha en la que se tenga constancia documental de que el beneficiario ha cumplido las condiciones para el pago». Ni el propio acuerdo, ni el cierre del plazo de solicitudes, ni la publicación de la concesión fijan esa fecha."
  citation: "anexo I, nota 34.II.a.1, Orden de documentos contables"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-1996-2749-anexo-i-nota-34
- id: m05-l06-q050
  prompt:
    es: "Si en una subvención en concurrencia interviene una entidad intermediaria ante la que se presentan los justificantes, el anexo I de la Orden de 1 de febrero de 1996 sobre documentos contables fija como fecha de gasto la de:"
  options:
  - id: a
    text:
      es: "Pago de la subvención por la entidad intermediaria al beneficiario."
  - id: b
    text:
      es: "Entrada de la documentación justificativa en el órgano concedente."
  - id: c
    correct: true
    text:
      es: "Entrada de la documentación justificativa en esa entidad intermediaria."
  - id: d
    text:
      es: "Publicación del acuerdo de concesión por el órgano concedente."
  explanation:
    es: "La nota 34.II.a.1 añade que, si interviene una entidad intermediaria ante la que se presentan los justificantes, la fecha de gasto es «la fecha de entrada en dicha entidad intermediaria de la documentación justificativa». No es la del pago al beneficiario, ni la de entrada en el órgano concedente, ni la de publicación de la concesión."
  citation: "anexo I, nota 34.II.a.1, Orden de documentos contables"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-1996-2627-regla-86
- id: m05-l06-q051
  prompt:
    es: "Cuando se aprueba la concesión de subvenciones con convocatoria previa, ¿qué documento contable expide el Servicio gestor?"
  options:
  - id: a
    correct: true
    text:
      es: "Un documento D y, en su caso, un documento D para ejercicios posteriores."
  - id: b
    text:
      es: "Un documento A y, en su caso, un documento A de ejercicios posteriores."
  - id: c
    text:
      es: "Un documento RC y, en su caso, un documento RC de ejercicios posteriores."
  - id: d
    text:
      es: "Un documento OK, que se remite junto al acuerdo de reconocimiento de la obligación."
  explanation:
    es: "La regla 86.3 dispone que, «cuando se apruebe la concesión de las subvenciones», el Servicio gestor expida el documento D y, en su caso, un D para ejercicios posteriores. El A se expide antes, al aprobar el expediente de gasto; el RC, durante la tramitación del expediente, y el OK, cuando se cumplen las condiciones del acuerdo de concesión."
  citation: "regla 86.3 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-86
- id: m05-l06-q052
  prompt:
    es: "En una subvención con convocatoria previa, el documento A se expide una vez aprobado el expediente de gasto, aprobación que es:"
  options:
  - id: a
    text:
      es: "Simultánea a la resolución de concesión de las subvenciones convocadas."
  - id: b
    text:
      es: "Posterior al reconocimiento de la obligación y a la ordenación del pago."
  - id: c
    text:
      es: "Posterior a la formalización de los convenios con las entidades colaboradoras."
  - id: d
    correct: true
    text:
      es: "Previa a la publicación de la convocatoria en el Boletín Oficial del Estado."
  explanation:
    es: "La regla 86.3 sitúa el documento A «una vez aprobado el expediente de gasto, aprobación que será previa a la publicación de la convocatoria en el Boletín Oficial del Estado». Aprobar el gasto en la concesión, tras el pago o tras formalizar convenios invierte el orden de las fases."
  citation: "regla 86.3 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "fecha"
# anchor: boe-a-2003-20977-art-30
- id: m05-l06-q053
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, la justificación de las subvenciones puede revestir la forma de cuenta justificativa del gasto realizado, acreditarse por módulos o mediante:"
  options:
  - id: a
    text:
      es: "El informe de auditoría de las cuentas anuales del ejercicio anterior en todo caso."
  - id: b
    text:
      es: "La declaración responsable del beneficiario sobre la realización de la actividad."
  - id: c
    text:
      es: "El certificado del órgano concedente sobre la ejecución del proyecto subvencionado."
  - id: d
    correct: true
    text:
      es: "La presentación de estados contables, según se disponga en la normativa reguladora."
  explanation:
    es: "El artículo 30.1 admite la cuenta justificativa del gasto realizado, la acreditación del gasto por módulos o «la presentación de estados contables, según se disponga en la normativa reguladora». La auditoría de cuentas anuales, la declaración responsable y el certificado del concedente no son formas que el artículo prevea."
  citation: "art. 30.1 LGS"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-20977-art-30
- id: m05-l06-q055
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, a falta de previsión de las bases reguladoras, la cuenta justificativa se presenta, como máximo, en el plazo de:"
  options:
  - id: a
    text:
      es: "Un mes desde la finalización del plazo para la realización de la actividad."
  - id: b
    correct: true
    text:
      es: "Tres meses desde la finalización del plazo para la realización de la actividad."
  - id: c
    text:
      es: "Seis meses desde la finalización del plazo para la realización de la actividad."
  - id: d
    text:
      es: "Tres meses desde la notificación de la resolución de concesión de la subvención."
  explanation:
    es: "A falta de previsión en las bases, el artículo 30.2 fija «como máximo, en el plazo de tres meses desde la finalización del plazo para la realización de la actividad». Un mes y seis meses son otras cifras, y contar los tres meses desde la notificación de la concesión cambia el punto de partida."
  citation: "art. 30.2 LGS"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-13371-art-70
- id: m05-l06-q057
  prompt:
    es: "Según el artículo 70.3 del Reglamento de la Ley General de Subvenciones (Real Decreto 887/2006), transcurrido el plazo de justificación sin haberse presentado, el órgano competente requiere al beneficiario para que la presente en:"
  options:
  - id: a
    correct: true
    text:
      es: "Un plazo improrrogable de quince días."
  - id: b
    text:
      es: "Un plazo improrrogable de diez días."
  - id: c
    text:
      es: "Un plazo improrrogable de un mes."
  - id: d
    text:
      es: "Un plazo improrrogable de tres meses."
  explanation:
    es: "El artículo 70.3 concede al beneficiario requerido «el plazo improrrogable de quince días». Diez días y un mes son otras cifras, y los tres meses son el plazo supletorio del artículo 30.2 de la Ley General de Subvenciones para presentar la cuenta, no el del requerimiento."
  citation: "art. 70.3 RLGS"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-20977-art-37
- id: m05-l06-q059
  prompt:
    es: "Según el artículo 37.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, el interés de demora en el reintegro se exige desde el momento del pago de la subvención hasta la fecha:"
  options:
  - id: a
    text:
      es: "En que se notifique la resolución del procedimiento de reintegro, aunque el ingreso sea anterior."
  - id: b
    text:
      es: "En que finalice el plazo para presentar la justificación de la subvención."
  - id: c
    correct: true
    text:
      es: "En que se acuerde la procedencia del reintegro, o la del ingreso si es anterior."
  - id: d
    text:
      es: "En que prescriba el derecho de la Administración a liquidar el reintegro."
  explanation:
    es: "El artículo 37.1 exige el interés «desde el momento del pago de la subvención hasta la fecha en que se acuerde la procedencia del reintegro, o la fecha en que el deudor ingrese el reintegro si es anterior». No se espera a la notificación, ni termina con el plazo de justificación, ni con la prescripción."
  citation: "art. 37.1 LGS"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2003-20977-art-37
- id: m05-l06-q060
  prompt:
    es: "¿Cuál de los siguientes es una causa de reintegro de las cantidades percibidas en una subvención, con el interés de demora?"
  options:
  - id: a
    text:
      es: "Retraso de la Administración en abonar la subvención concedida, pese a haberse justificado la actividad en plazo."
  - id: b
    correct: true
    text:
      es: "Obtención de la subvención falseando las condiciones requeridas u ocultando las que lo hubieran impedido."
  - id: c
    text:
      es: "Modificación de las bases reguladoras con posterioridad a la concesión."
  - id: d
    text:
      es: "Renuncia del beneficiario antes de haber percibido cantidad alguna."
  explanation:
    es: "El artículo 37.1.a) recoge como causa de reintegro «la obtención de la subvención falseando las condiciones requeridas para ello u ocultando aquéllas que lo hubieran impedido». El retraso de la propia Administración, la modificación posterior de las bases y la renuncia sin cobro no son causas del artículo."
  citation: "art. 37.1 LGS"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2003-20977-art-39
- id: m05-l06-q061
  prompt:
    es: "Según el artículo 39.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, el derecho de la Administración a reconocer o liquidar el reintegro:"
  options:
  - id: a
    text:
      es: "Prescribe a los tres años."
  - id: b
    text:
      es: "Prescribe a los cinco años."
  - id: c
    text:
      es: "Prescribe a los seis años."
  - id: d
    correct: true
    text:
      es: "Prescribe a los cuatro años."
  explanation:
    es: "El artículo 39.1 LGS dice: «Prescribirá a los cuatro años el derecho de la Administración a reconocer o liquidar el reintegro». Tres, cinco y seis años no coinciden con la cifra del apartado, que es cuatro años."
  citation: "art. 39.1 LGS"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-20977-art-42
- id: m05-l06-q062
  prompt:
    es: "De acuerdo con el artículo 42.4 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, el plazo máximo para resolver y notificar el procedimiento de reintegro es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Doce meses desde la fecha del acuerdo de iniciación."
  - id: b
    text:
      es: "Seis meses desde la fecha del acuerdo de iniciación."
  - id: c
    text:
      es: "Dieciocho meses desde la fecha del acuerdo de iniciación."
  - id: d
    text:
      es: "Doce meses desde la presentación de la justificación por el beneficiario."
  explanation:
    es: "El artículo 42.4 fija «12 meses desde la fecha del acuerdo de iniciación» para resolver y notificar el reintegro. Seis y dieciocho meses son otras cifras, y partir de la justificación del beneficiario cambia el momento inicial del cómputo."
  citation: "art. 42.4 LGS"
  difficulty: 1
  tags:
  - "plazo"
