  prompt:
    es: "Conforme al artículo 88.1 de la Ley 39/2015, de 1 de octubre, el Instituto pone de manifiesto a Rutas del Norte Turismo, S.L. una cuestión conexa el lunes, 7 de junio de 2027. ¿Hasta qué fecha puede durar, como máximo, el plazo de alegaciones?"
  options:
