# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0178
  prompt:
    es: "Si en un aplazamiento solicitado en período voluntario no se efectúa el pago al vencimiento del plazo concedido, conforme al artículo 54.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre lo que se exige:"
  options:
  - id: a
    text:
      es: "El principal y el recargo del período ejecutivo sobre el principal, sin intereses de demora."
  - id: b
    text:
      es: "El principal y los intereses de demora hasta la fecha de la providencia de apremio, sin recargo."
  - id: c
    correct: true
    text:
      es: "El principal, los intereses de demora hasta el vencimiento del plazo concedido y el recargo del período ejecutivo sobre la suma de ambos conceptos."
  - id: d
    text:
      es: "El principal más un recargo del 25 por ciento, y los intereses solo desde el inicio del período ejecutivo."
  explanation:
    es: "Se exige el principal, los intereses devengados desde el día siguiente al vencimiento del plazo voluntario hasta el vencimiento del plazo concedido, y el recargo del período ejecutivo sobre la suma de ambos conceptos (artículo 54.1.a). Las otras opciones omiten los intereses o el recargo, calculan este solo sobre el principal o inventan un recargo del 25 por ciento."
  citation: "art. 54.1 RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "falta de pago"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0179
  prompt:
    es: "¿Qué ocurre si, vencido el plazo concedido en un aplazamiento solicitado en período ejecutivo, el obligado deja de pagar, conforme al artículo 54.1.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Se iniciará un nuevo período voluntario de ingreso."
  - id: b
    correct: true
    text:
      es: "Deberá continuar el procedimiento de apremio."
  - id: c
    text:
      es: "Se iniciará un procedimiento de apremio distinto del anterior."
  - id: d
    text:
      es: "Se concederá un plazo adicional de ingreso de diez días."
  explanation:
    es: "Si la solicitud se presentó en período ejecutivo, continúa el procedimiento de apremio (artículo 54.1.b). No hay nuevo período voluntario, ni un apremio distinto, ni un plazo adicional."
  citation: "art. 54.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "falta de pago"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0180
  prompt:
    es: "Conforme al artículo 54.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en un fraccionamiento con dispensa total de garantías, si no se ingresan las cantidades exigidas por una fracción incumplida que incluía deudas en período voluntario en el momento de la solicitud:"
  options:
  - id: a
    text:
      es: "Se mantendrán los plazos de las restantes fracciones, y el apremio se limitará a la fracción incumplida."
  - id: b
    text:
      es: "Se anulará el fraccionamiento, y las deudas volverán a período voluntario de ingreso."
  - id: c
    text:
      es: "Se ejecutará la garantía parcial de la fracción, y el resto de fracciones vencerán a los seis meses."
  - id: d
    correct: true
    text:
      es: "Se considerarán vencidas el resto de las fracciones pendientes, debiendo iniciarse el apremio respecto de todas las deudas."
  explanation:
    es: "Si no se ingresa lo exigido por la fracción incumplida, se consideran vencidas las demás fracciones pendientes y se inicia el apremio respecto de todas las deudas (artículo 54.2.b). No se limita a esa fracción. Las deudas no vuelven al período voluntario. Con dispensa total de garantías no hay garantía parcial que ejecutar."
  citation: "art. 54.2 RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "falta de pago"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0181
  prompt:
    es: "A una sociedad se le concede un fraccionamiento en tres fracciones, con dispensa total de garantías, de deudas que estaban en período voluntario al solicitarlo. No paga la primera fracción ni, tras el apremio de esta, lo exigido por ella. Conforme al artículo 54.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué sucede con las otras dos fracciones?"
  options:
  - id: a
    text:
      es: "Conservan sus plazos de vencimiento, porque solo se incumplió la primera fracción."
  - id: b
    text:
      es: "Quedan en suspenso hasta que se resuelva el recurso contra el apremio."
  - id: c
    text:
      es: "Se anulan junto con las deudas que incluyen, que se dan por extinguidas."
  - id: d
    correct: true
    text:
      es: "Se consideran vencidas, y debe iniciarse el apremio respecto de todas las deudas."
  explanation:
    es: "Tras no ingresar lo exigido por la fracción incumplida, se consideran vencidas las fracciones pendientes y se inicia el apremio respecto de todas las deudas (artículo 54.2.b). Las dos restantes no conservan su plazo ni quedan en suspenso. No se extinguen por el incumplimiento."
  citation: "art. 54.2 RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "falta de pago"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0182
  prompt:
    es: "Según el artículo 54.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en un fraccionamiento con dispensa total de garantías, si la fracción incumplida incluía deudas en período ejecutivo en el momento de la solicitud, para las deudas que estaban en período ejecutivo:"
  options:
  - id: a
    correct: true
    text:
      es: "Deberá continuarse el procedimiento de apremio."
  - id: b
    text:
      es: "Se iniciará un nuevo período voluntario de ingreso."
  - id: c
    text:
      es: "Se iniciará el período ejecutivo al día siguiente del vencimiento de la fracción."
  - id: d
    text:
      es: "Se considerarán vencidas las fracciones y se anulará el apremio ya iniciado."
  explanation:
    es: "Para las deudas que ya estaban en período ejecutivo al solicitar el fraccionamiento, debe continuarse el apremio (artículo 54.2.a). El nuevo período voluntario no existe. Iniciar el ejecutivo al día siguiente es la regla para las deudas que estaban en voluntario. El apremio ya iniciado no se anula."
  citation: "art. 54.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "falta de pago"
  - "fraccionamiento"
