# anchor: celex-32013r0952-art-237
- id: m03-l20-q0124
  prompt:
    es: "De acuerdo con el artículo 237, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en el marco de un régimen de depósito, las mercancías no pertenecientes a la Unión podrán ser almacenadas sin estar sujetas, entre otras, a:"
  options:
  - id: a
    correct: true
    text:
      es: "Medidas de política comercial, en la medida en que no prohíban la entrada de mercancías en el territorio aduanero de la Unión o su salida de él."
  - id: b
    text:
      es: "Medidas de política comercial de cualquier tipo, incluidas las que prohíban la entrada de mercancías en el territorio aduanero de la Unión o su salida de él."
  - id: c
    text:
      es: "Los derechos de importación, pero sí a los demás gravámenes prescritos por otras disposiciones pertinentes en vigor."
  - id: d
    text:
