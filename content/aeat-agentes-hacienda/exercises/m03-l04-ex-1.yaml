    es: "De acuerdo con el artículo 34.1.r) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios tienen derecho a presentar ante la Administración la documentación que estimen conveniente y que pueda ser relevante para:"
