      es: "Elegir un área predefinida de la galería Ventanas disponibles"
  explanation:
    es: "La página dice: «cuando la pantalla se vuelva blanca y el puntero se transforme en una cruz, mantenga presionado el botón primario del mouse y arrastre para seleccionar la parte de la pantalla que quiera capturar». Una miniatura inserta la ventana entera. La página pide arrastrar con el botón primario del mouse. La página pide arrastrar para seleccionar la parte de la pantalla."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 1
  tags:
