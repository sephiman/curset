  explanation:
    es: "La página dice que, al escribir una fecha directamente en la función, hay que incluirla entre comillas; ese ejemplo da 42. «Debe llevar el formato aaaa-mm-dd»: la página exige comillas al escribir la fecha como texto, como \"15-MAR-2021\". «Debe escribirse con la función FECHA»: la página usa texto entre comillas en el ejemplo. «Debe ir entre almohadillas (#)»: la página usa comillas."
