type: case
title:
  es: "La MUGEJU: ayudas y mantenimiento"
scenario:
  es: "La Mutualidad General Judicial (MUGEJU) es un organismo autónomo con sede en Madrid. El lunes, 14 de junio de 2027, el «Boletín Oficial del Estado» publica la convocatoria de sus ayudas de acción social, que da dos meses para presentar solicitudes y veinticinco días hábiles para resolver cada una desde su entrada en el registro de la Mutualidad. El lunes, 16 de agosto de 2027, es festivo en Madrid; no hay otros en los plazos por días de las cuestiones.\n\nDoña Leocadia Marcos Soria, mutualista jubilada, prefiere el papel. El viernes, 2 de julio de 2027, presenta su solicitud en la Mutualidad. Antes de resolver, la Mutualidad acuerda actuaciones complementarias, que terminan el jueves, 15 de julio de 2027. Después, la Mutualidad deniega la solicitud. El miércoles, 4 de agosto de 2027, a las 10:20 horas, se intenta entregar la resolución en el domicilio indicado en su solicitud, y nadie se hace cargo.\n\nEl lunes, 1 de marzo de 2027, Don Tadeo Vilches Ramos, mutualista, solicita el acceso a sus datos personales. La solicitud es compleja y la Mutualidad le comunica una prórroga en el primer mes.\n\nDesde el lunes, 1 de marzo de 2027, Tecnologías Procesales Llanes, S.L., que desarrolló el programa de gestión de prestaciones y es titular de sus derechos de propiedad intelectual, presta su mantenimiento. La Mutualidad se lo adjudicó sin anuncio de licitación, por dos años y con prórrogas anuales cuyo número no fija el pliego; el valor estimado, con las prórrogas, es de 240.000 euros, IVA excluido. Sistemas Forenses Duero, S.L. denuncia esa adjudicación. Para migrar el programa, la Mutualidad proyecta una licitación con negociación y quiere limitar las empresas invitadas.\n\nDoña Remedios Alarcón Vidal, del Cuerpo General Administrativo (grupo C, subgrupo C1) y con 28.500,00 euros de retribución anual en dedicación ordinaria, pide compatibilidad para un segundo puesto como profesora asociada. Doña Isaura Benavente Oliva, del mismo cuerpo y mutualista de la MUFACE, obtiene licencia por riesgo durante el embarazo; en el tercer mes sus retribuciones básicas, con la sexta parte de una paga extraordinaria, suman 1.480,00 euros y las complementarias, 1.118,40 euros. Doña Alba Fontán Rey gana un concurso para un puesto en Zaragoza, cesa el lunes, 7 de junio de 2027, y su plazo de un mes para tomar posesión termina el miércoles, 7 de julio de 2027. Don Leandro Cabrera Ruiz, con un hijo de tres años, pide un permiso parental. Don Ezequiel Lorca Marín renuncia por escrito a su condición de funcionario, y un juzgado dicta contra él auto de apertura de juicio oral por un delito.\n\nLa Mutualidad quiere pagar la cuota de mantenimiento del programa, que se imputa al capítulo 2, con un crédito de 60.000 euros del capítulo 6 para adquirir equipos. También ha vendido un local por 380.000 euros, ya ingresados. La Intervención Delegada repara el expediente de gasto de la migración; la Mutualidad plantea la discrepancia y la Intervención General de la Administración del Estado la recibe el martes, 7 de septiembre de 2027. Por último, concede una subvención a la Asociación de Mutualistas Jubilados Torre Blanca para unas charlas que terminan el jueves, 30 de septiembre de 2027; las bases no fijan plazo para rendir la cuenta.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-30
- id: q01
  lesson: m03-l03
  prompt:
    es: "Según los artículos 30.4 y 30.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué fecha termina el plazo de dos meses para presentar solicitudes de las ayudas de acción social?"
  options:
  - id: a
    text:
      es: "El sábado, 14 de agosto de 2027."
  - id: b
    text:
      es: "El lunes, 16 de agosto de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 17 de agosto de 2027."
  - id: d
    text:
      es: "El viernes, 13 de agosto de 2027."
  explanation:
    es: "Los plazos por meses se cuentan desde el día siguiente a la publicación y concluyen el mismo día del mes de vencimiento (art. 30.4 LPAC). La convocatoria se publica el lunes, 14 de junio de 2027, y los dos meses llegan al sábado, 14 de agosto de 2027. Ese día es inhábil, y el plazo se prorroga al primer día hábil siguiente (art. 30.5 LPAC). El lunes, 16 de agosto de 2027, es festivo en Madrid, así que el plazo termina el martes, 17 de agosto de 2027. La fecha del sábado, 14 de agosto de 2027, no prorroga el último día inhábil. La del lunes, 16 de agosto de 2027, ignora el festivo. La del viernes, 13 de agosto de 2027, retrocede al día hábil anterior en lugar de avanzar."
  citation: "arts. 30.4–5 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-56
- id: q25
  lesson: m03-l03
  prompt:
    es: "Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la Mutualidad adopta una medida provisional urgente el lunes, 19 de julio de 2027, ¿hasta qué fecha, contando días hábiles, debe dictar el acuerdo de iniciación?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 9 de agosto de 2027."
  - id: b
    text:
      es: "El martes, 3 de agosto de 2027."
  - id: c
    text:
      es: "El viernes, 6 de agosto de 2027."
  - id: d
    text:
      es: "El martes, 10 de agosto de 2027."
  explanation:
    es: "Las medidas provisionales adoptadas antes de iniciar el procedimiento se confirman, modifican o levantan en el acuerdo de iniciación, que debe dictarse dentro de los quince días siguientes a su adopción (art. 56.2 LPAC), y el enunciado manda contar días hábiles. La medida se adopta el lunes, 19 de julio de 2027, y el cómputo empieza el martes, 20 de julio de 2027. Con quince días hábiles, sin sábados, domingos ni festivos, el último es el lunes, 9 de agosto de 2027. La fecha del martes, 3 de agosto de 2027, cuenta quince días naturales. La del viernes, 6 de agosto de 2027, cuenta como primer día el de la adopción. La del martes, 10 de agosto de 2027, cuenta dieciséis días hábiles, uno más de los que da la ley."
  citation: "art. 56.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-66
- id: q03
  lesson: m03-l03
  prompt:
    es: "¿Qué debe identificar la solicitud de Doña Leocadia, además de sus datos y de la petición, en cuanto al modo de recibir las notificaciones?"
  options:
  - id: a
    text:
      es: "El lugar físico o, en su defecto, el medio electrónico en que desea que se le notifique."
  - id: b
    correct: true
    text:
      es: "El medio electrónico o, en su defecto, el lugar físico en que desea que se le notifique."
  - id: c
    text:
      es: "El medio electrónico únicamente, porque las personas físicas no pueden señalar un lugar físico."
  - id: d
    text:
      es: "El órgano que dictará la resolución y el plazo máximo en que deberá notificársela."
  explanation:
    es: "La solicitud debe contener la identificación del medio electrónico o, en su defecto, del lugar físico en que el interesado desea que se practique la notificación (art. 66.1.b LPAC). Doña Leocadia, que prefiere el papel, indica su domicilio. La opción que invierte el orden pone el lugar físico como regla y el medio electrónico como subsidiario. La que excluye el lugar físico para las personas físicas contradice el texto, porque no están obligadas a la vía electrónica. La del órgano y el plazo mezcla contenidos de otros apartados y de la notificación."
  citation: "art. 66.1.b) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-42
- id: q04
  lesson: m03-l02
  prompt:
    es: "¿Hasta qué día y a partir de qué hora puede repetirse, por una sola vez, el intento de entregar la resolución en el domicilio de Doña Leocadia, contando días hábiles?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes, 9 de agosto de 2027, y después de las 15:00 horas."
  - id: b
    text:
      es: "Hasta el sábado, 7 de agosto de 2027, y después de las 15:00 horas."
  - id: c
    text:
      es: "Hasta el lunes, 9 de agosto de 2027, y antes de las 15:00 horas."
  - id: d
    text:
      es: "Hasta el viernes, 6 de agosto de 2027, y después de las 15:00 horas."
  explanation:
    es: "Si nadie se hace cargo, el intento se repite por una sola vez y en una hora distinta dentro de los tres días siguientes. Si el primero fue antes de las quince horas, el segundo debe hacerse después (art. 42.2 LPAC). Los días son hábiles (art. 30.2 LPAC): el jueves 5, el viernes 6 y el lunes, 9 de agosto de 2027. El primer intento fue a las 10:20, y el segundo debe ser posterior a las 15:00 horas. La opción del sábado, 7 de agosto de 2027, cuenta tres días naturales. La que fija la hora antes de las 15:00 olvida que el segundo intento va a la otra mitad del día. La del viernes, 6 de agosto de 2027, cuenta como primer día el del primer intento."
  citation: "art. 42.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: celex-32016r0679-art-12
- id: q05
  lesson: m02-l04
  prompt:
    es: "Según el reglamento europeo de protección de datos personales, ¿hasta qué fecha, como máximo y con la prórroga por complejidad, debe la Mutualidad informar a Don Tadeo de sus actuaciones sobre la solicitud de acceso?"
  options:
  - id: a
    text:
      es: "El jueves, 1 de abril de 2027."
  - id: b
    text:
      es: "El sábado, 1 de mayo de 2027."
  - id: c
    text:
      es: "El domingo, 30 de mayo de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 1 de junio de 2027."
  explanation:
    es: "El responsable informa en un mes desde la recepción de la solicitud, y el plazo se prorroga otros dos meses cuando lo exigen la complejidad y el número de solicitudes (art. 12.3 RGPD). La solicitud llega el lunes, 1 de marzo de 2027, el primer mes termina el jueves, 1 de abril de 2027, y con la prórroga de dos meses el límite es el martes, 1 de junio de 2027. La fecha del jueves, 1 de abril de 2027, es el plazo sin prórroga. La del sábado, 1 de mayo de 2027, suma solo uno de los dos meses de prórroga. La del domingo, 30 de mayo de 2027, cuenta noventa días en lugar de tres meses."
  citation: "art. 12.3 RGPD"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-62
- id: q06
  lesson: m03-l03
  prompt:
    es: "¿Adquiere Sistemas Forenses Duero, S.L. la condición de interesada en el procedimiento que se inicie, por haber presentado su denuncia sobre la adjudicación del mantenimiento?"
  options:
  - id: a
    text:
      es: "Sí, porque cualquier persona que denuncia un hecho pasa a ser interesada en el procedimiento que se inicie."
  - id: b
    text:
      es: "Sí, siempre que la denuncia exprese su identidad y el relato de los hechos denunciados."
  - id: c
    correct: true
    text:
      es: "No, porque la presentación de la denuncia no confiere, por sí sola, la condición de interesado."
  - id: d
    text:
      es: "Sí, pero solo si la denuncia invoca un perjuicio en el patrimonio de las Administraciones Públicas."
  explanation:
    es: "La denuncia pone en conocimiento del órgano un hecho que puede justificar la iniciación de oficio, y presentarla no confiere por sí sola la condición de interesado (art. 62.5 LPAC). Que la denuncia exprese la identidad del denunciante y el relato de los hechos es un contenido exigido por el artículo 62.2, y no otorga esa condición. Invocar un perjuicio en el patrimonio de las Administraciones obliga a motivar la no iniciación y a notificar la decisión (art. 62.3 LPAC), pero tampoco hace interesado al denunciante. La opción que concede la condición a cualquiera que denuncia contradice el texto."
  citation: "art. 62.5 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-168
- id: q07
  lesson: m03-l04
  prompt:
    es: "¿Qué procedimiento permitía adjudicar el mantenimiento a Tecnologías Procesales Llanes, S.L. sin anuncio de licitación, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "El negociado sin publicidad, porque solo esa empresa puede prestarlo al proteger sus derechos de propiedad intelectual."
  - id: b
    text:
      es: "El abierto simplificado, porque el valor estimado del contrato es inferior a 140.000 euros."
  - id: c
    text:
      es: "El contrato menor, porque su valor estimado no llega al límite de los contratos menores."
  - id: d
    text:
      es: "El restringido, porque la exclusividad de la empresa permite invitar solo a ella sin publicar anuncio."
  explanation:
    es: "El negociado sin publicidad cabe cuando el servicio solo puede encomendarse a un empresario determinado por la protección de derechos exclusivos, incluidos los de propiedad intelectual (art. 168.a).2.º LCSP). La empresa desarrolló el programa y es titular de los derechos sobre su código. El abierto simplificado exige un valor estimado inferior a 140.000 euros en servicios, y el de 240.000 euros lo supera. El contrato menor tiene un límite de 15.000 euros en servicios, que el valor estimado supera. El restringido exige anuncio de licitación, así que no sirve para adjudicar sin él."
  citation: "art. 168 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-29
- id: q22
  lesson: m03-l04
  prompt:
    es: "Como el pliego no fija el número de prórrogas anuales, ¿desde qué fecha empieza la última prórroga que puede acordarse en el contrato de mantenimiento, conforme a la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El jueves, 1 de marzo de 2029."
  - id: b
    text:
      es: "El viernes, 1 de marzo de 2030."
  - id: c
    text:
      es: "El lunes, 1 de marzo de 2032."
  - id: d
    correct: true
    text:
      es: "El sábado, 1 de marzo de 2031."
  explanation:
    es: "Los contratos de servicios de prestación sucesiva duran como máximo cinco años, incluidas las prórrogas (art. 29.4 LCSP). El periodo inicial de dos años cubre desde el lunes, 1 de marzo de 2027, hasta el miércoles, 28 de febrero de 2029, y las prórrogas anuales empiezan el jueves, 1 de marzo de 2029, el viernes, 1 de marzo de 2030, y el sábado, 1 de marzo de 2031. Con la que empieza en 2031 se alcanzan los cinco años. Las fechas de 2029 y de 2030 dejarían sin usar uno o dos años que la ley permite. La del lunes, 1 de marzo de 2032, abriría un año más, con los cinco ya cumplidos."
  citation: "art. 29.4 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-169
- id: q09
  lesson: m03-l04
  prompt:
    es: "Señale la respuesta correcta sobre el número de empresas que la Mutualidad debe invitar a negociar la migración del programa, si decide limitar el número de invitadas:"
  options:
  - id: a
    text:
      es: "Al menos tres, y debe declarar desierto el procedimiento si cumplen los criterios de selección menos de tres."
  - id: b
    correct: true
    text:
      es: "Al menos tres, y puede continuar con las que reúnan las condiciones si cumplen los criterios menos de tres."
  - id: c
    text:
      es: "Al menos cinco, y puede invitar a empresas que no han solicitado participar si faltan candidatos."
  - id: d
    text:
      es: "Al menos dos, y puede continuar con las que reúnan las condiciones si cumplen los criterios menos de dos."
  explanation:
    es: "Si el órgano decide limitar las empresas invitadas a negociar, el número mínimo de candidatos invitados es tres. Si cumplen los criterios de selección menos de tres, puede continuar con los que reúnen las condiciones, sin invitar a quienes no hayan solicitado participar (art. 169.2 LCSP). La opción de declarar desierto el procedimiento añade una consecuencia que la ley no prevé. La de cinco fija un mínimo distinto del legal y permite invitar a quienes no se presentaron, lo que la ley prohíbe. La de dos baja el mínimo a una cifra que la ley no admite."
  citation: "art. 169.1–2 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11719-art-64
- id: q10
  lesson: m04-l04
  prompt:
    es: "Conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿puede la Administración aceptar la renuncia por escrito de Don Ezequiel a su condición de funcionario?"
  options:
  - id: a
    text:
      es: "Sí, porque la renuncia consta por escrito y la Administración debe aceptarla expresamente en todo caso."
  - id: b
    text:
      es: "No, porque solo cabe aceptar la renuncia una vez dictada sentencia firme en el procedimiento penal."
  - id: c
    correct: true
    text:
      es: "No, porque se ha dictado contra él auto de apertura de juicio oral por la comisión de un delito."
  - id: d
    text:
      es: "Sí, porque solo lo impide un expediente disciplinario, y contra él no se sigue ninguno."
  explanation:
    es: "La renuncia se manifiesta por escrito y la Administración la acepta expresamente, salvo que el funcionario esté sujeto a expediente disciplinario o se haya dictado en su contra auto de procesamiento o de apertura de juicio oral por algún delito (art. 64.2 TREBEP). El juzgado ha dictado ese auto contra Don Ezequiel. La opción que obliga a aceptarla en todo caso ignora la excepción. La que exige sentencia firme añade un requisito que el texto no pide. La que solo ve el expediente disciplinario deja fuera el auto de apertura de juicio oral."
  citation: "art. 64.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1995-8729-art-48
- id: q11
  lesson: m04-l05
  prompt:
    es: "¿Hasta qué fecha puede conceder el Subsecretario del Departamento de destino la prórroga de incorporación a Doña Alba, si la pide por razones justificadas y se cuentan días hábiles desde el final de su plazo de toma de posesión?"
  options:
  - id: a
    text:
      es: "El martes, 27 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 4 de agosto de 2027."
  - id: c
    text:
      es: "El martes, 3 de agosto de 2027."
  - id: d
    text:
      es: "El sábado, 7 de agosto de 2027."
  explanation:
    es: "Si el destino implica cambio de residencia y el interesado lo pide por razones justificadas, el Subsecretario del Departamento de destino puede conceder una prórroga de incorporación de hasta veinte días hábiles (art. 48.2 RD 364/1995). El plazo posesorio termina el miércoles, 7 de julio de 2027, y los veinte días hábiles empiezan el jueves, 8 de julio de 2027. Sin festivos, el último es el miércoles, 4 de agosto de 2027. La fecha del martes, 27 de julio de 2027, cuenta veinte días naturales. La del martes, 3 de agosto de 2027, cuenta como primer día el último del plazo posesorio. La del sábado, 7 de agosto de 2027, añade un mes en lugar de veinte días hábiles."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-49
- id: q12
  lesson: m04-l05
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, el permiso parental que pide Don Leandro Cabrera Ruiz para cuidar a su hijo de tres años, cuando las necesidades del servicio lo permitan:"
  options:
  - id: a
    text:
      es: "Es retribuido, dura como máximo ocho semanas, continuas o discontinuas, y se comunica con quince días de antelación."
  - id: b
    text:
      es: "No es retribuido, dura como máximo doce semanas, continuas o discontinuas, y se comunica con quince días de antelación."
  - id: c
    text:
      es: "No es retribuido, dura como máximo ocho semanas, continuas o discontinuas, y se comunica con un mes de antelación."
  - id: d
    correct: true
    text:
      es: "No es retribuido, dura como máximo ocho semanas, continuas o discontinuas, y se comunica con quince días de antelación."
  explanation:
    es: "El permiso parental para cuidar de un hijo hasta que cumpla ocho años no es retribuido y dura como máximo ocho semanas, continuas o discontinuas. Quien lo disfruta debe comunicar las fechas a la Administración con quince días de antelación y por semanas completas (art. 49.g) TREBEP). La opción retribuida cambia el carácter del permiso. La de doce semanas eleva el máximo. La del mes de antelación sustituye el preaviso legal de quince días."
  citation: "art. 49.g) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1985-151-art-7
- id: q13
  lesson: m04-l06
  prompt:
    es: "Conforme al artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del Personal al servicio de las Administraciones Públicas, y sin contar el límite del Director General, ¿hasta qué cantidad total anual puede percibir Doña Remedios por ambos puestos sin acuerdo expreso del Gobierno?"
  options:
  - id: a
    text:
      es: "Una cantidad total de 37.050,00 euros al año."
  - id: b
    text:
      es: "Una cantidad total de 38.475,00 euros al año."
  - id: c
    correct: true
    text:
      es: "Una cantidad total de 39.900,00 euros al año."
  - id: d
    text:
      es: "Una cantidad total de 41.325,00 euros al año."
  explanation:
    es: "La cantidad total percibida por ambos puestos no puede superar la del puesto principal, en dedicación ordinaria, incrementada en un 40 por 100 para el grupo C (art. 7.1 Ley 53/1984). Son 28.500,00 × 1,40 = 39.900,00 euros. La cifra de 37.050,00 euros aplica el 30 por 100 del grupo A. La de 38.475,00 euros aplica el 35 por 100 del grupo B. La de 41.325,00 euros aplica el 45 por 100 del grupo D. Superar el límite exige acuerdo expreso del Gobierno."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1985-151-art-7
- id: q14
  lesson: m04-l06
  prompt:
    es: "Si se autoriza la compatibilidad de Doña Remedios con el segundo puesto, conforme a la Ley de Incompatibilidades del Personal al servicio de las Administraciones Públicas, sus pagas extraordinarias y los trienios por los servicios del segundo puesto:"
  options:
  - id: a
    correct: true
    text:
      es: "Se perciben por uno solo de los puestos y los servicios del segundo no se computan para trienios."
  - id: b
    text:
      es: "Se perciben por ambos puestos y los servicios del segundo no se computan para trienios."
  - id: c
    text:
      es: "Se perciben por uno solo de los puestos y los servicios del segundo se computan para trienios."
  - id: d
    text:
      es: "Se perciben por mitades en cada puesto y los servicios del segundo se computan para trienios."
  explanation:
    es: "Los servicios prestados en el segundo puesto no se computan a efectos de trienios ni de derechos pasivos, y las pagas extraordinarias solo pueden percibirse por uno de los puestos, cualquiera que sea su naturaleza (art. 7.2 Ley 53/1984). La opción de las pagas por ambos puestos contradice el segundo supuesto. La que computa los servicios del segundo puesto para trienios contradice el primero. La de las pagas por mitades inventa un reparto que la ley no prevé."
  citation: "art. 7.2 Ley 53/1984"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-22
- id: q15
  lesson: m04-l07
  prompt:
    es: "Según el artículo 22.4 del Real Decreto Legislativo 4/2000, de 23 de junio, por el que se aprueba el texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿qué subsidio abona la MUFACE a Doña Isaura en su licencia por riesgo durante el embarazo?"
  options:
  - id: a
    text:
      es: "Un subsidio de 1.184,00 euros al mes."
  - id: b
    correct: true
    text:
      es: "Un subsidio de 1.118,40 euros al mes."
  - id: c
    text:
      es: "Un subsidio de 838,80 euros al mes."
  - id: d
    text:
      es: "Un subsidio de 1.480,00 euros al mes."
  explanation:
    es: "En el riesgo durante el embarazo, el subsidio a cargo de la MUFACE es el 100 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia (art. 22.4 RDL 4/2000). Son 1.118,40 euros. La cifra de 1.184,00 euros es el 80 por ciento de las básicas, la fórmula de la incapacidad temporal, que aquí no se aplica. La de 838,80 euros es el 75 por ciento de las complementarias, la otra fórmula de la incapacidad temporal. La de 1.480,00 euros son las retribuciones básicas, sin ningún porcentaje."
  citation: "art. 22.4 RDL 4/2000"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-42
- id: q16
  lesson: m05-l02
  prompt:
    es: "Señale la respuesta correcta sobre el pago de la cuota de mantenimiento del programa con el crédito de 60.000 euros del capítulo 6, destinado a adquirir equipos, sin tramitar ninguna modificación presupuestaria:"
  options:
  - id: a
    text:
      es: "Cabe, porque ambos gastos son de informática y se atienden con cualquier crédito del mismo programa."
  - id: b
    text:
      es: "Cabe, porque en un organismo autónomo la dirección decide libremente el destino de sus créditos."
  - id: c
    text:
      es: "Cabe, si la Intervención Delegada informa favorablemente la aplicación a otra finalidad."
  - id: d
    correct: true
    text:
      es: "No cabe, porque el crédito solo puede destinarse a la finalidad específica para la que fue autorizado."
  explanation:
    es: "Los créditos para gastos se destinan exclusivamente a la finalidad específica para la que fueron autorizados por la Ley de Presupuestos o a la que resulte de las modificaciones aprobadas conforme a la Ley General Presupuestaria (art. 42 LGP). Los equipos del capítulo 6 y el mantenimiento del capítulo 2 son finalidades distintas, y sin modificación no se pueden mezclar. Que ambos gastos sean de informática no cambia la finalidad autorizada. La libre disposición de la dirección contradice el artículo, también en un organismo autónomo. El informe de la Intervención Delegada no sustituye a la modificación presupuestaria."
  citation: "art. 42 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2003-21614-art-53
- id: q23
  lesson: m05-l02
  prompt:
    es: "Según el artículo 53.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede la Mutualidad generar crédito con los 380.000 euros que ingresó en 2027 por la venta de un local de su inmovilizado, y con qué fundamento?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque las enajenaciones de inmovilizado son un supuesto de generación y el ingreso es del propio ejercicio."
  - id: b
    text:
      es: "No, porque solo generan crédito las ventas de bienes y las prestaciones de servicios de su actividad ordinaria."
  - id: c
    text:
      es: "No, porque la generación por enajenación de inmovilizado solo cabe con ingresos del último trimestre del ejercicio anterior."
  - id: d
    text:
      es: "Sí, pero solo cuando la Mutualidad reconozca el derecho, aunque el comprador todavía no haya pagado el precio."
  explanation:
    es: "Pueden dar lugar a generaciones los ingresos realizados en el propio ejercicio por enajenaciones de inmovilizado (art. 53.2.c LGP), y el local vendido es inmovilizado ingresado ya en 2027. Las ventas de bienes y prestaciones de servicios son otro supuesto, distinto de este. El último trimestre del ejercicio anterior es una excepción para ingresos de ese periodo, que no es el caso. El reconocimiento del derecho sin cobro solo vale en los organismos autónomos para la aportación del Estado, y aquí el ingreso ya se efectuó."
  citation: "art. 53.2 LGP"
  difficulty: 1
  tags:
  - "generación"
  - "crédito"
# anchor: boe-a-1996-1578-art-16
- id: q18
  lesson: m05-l03
  prompt:
    es: "Conforme al Real Decreto 2188/1995, de 28 de diciembre, por el que se desarrolla el régimen del control interno ejercido por la Intervención General de la Administración del Estado, ¿hasta qué fecha puede esta resolver la discrepancia de la Mutualidad, contando días hábiles?"
  options:
  - id: a
    text:
      es: "El miércoles, 22 de septiembre de 2027."
  - id: b
    text:
      es: "El lunes, 27 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 28 de septiembre de 2027."
  - id: d
    text:
      es: "El martes, 21 de septiembre de 2027."
  explanation:
    es: "Si el reparo lo formuló una Intervención Delegada y el órgano gestor no lo acepta, la Intervención General de la Administración del Estado resuelve la discrepancia en quince días, con resolución obligatoria para aquella (art. 16.2 RD 2188/1995). Los días son hábiles y se cuentan desde el miércoles, 8 de septiembre de 2027. El decimoquinto día hábil es el martes, 28 de septiembre de 2027. La fecha del miércoles, 22 de septiembre de 2027, cuenta quince días naturales. La del lunes, 27 de septiembre de 2027, cuenta como primer día el de recepción. La del martes, 21 de septiembre de 2027, aplica diez días, el plazo de la Intervención para fiscalizar."
  citation: "art. 16.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-155
- id: q19
  lesson: m05-l03
  prompt:
    es: "Si la Intervención General de la Administración del Estado confirma el reparo de la Intervención Delegada y la discrepancia subsiste, ¿cuál de los siguientes órganos adopta la resolución definitiva, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "La propia Intervención General de la Administración del Estado, con resolución obligatoria para la Mutualidad."
  - id: b
    correct: true
    text:
      es: "El Consejo de Ministros, que adopta la resolución definitiva."
  - id: c
    text:
      es: "El titular del ministerio al que está adscrita la Mutualidad, previo informe de la Abogacía del Estado."
  - id: d
    text:
      es: "El Tribunal de Cuentas, previa remisión del expediente por la Intervención General."
  explanation:
    es: "Si el reparo lo formuló la Intervención General de la Administración del Estado, o esta confirmó el de otra Intervención, y la discrepancia subsiste, corresponde al Consejo de Ministros adoptar la resolución definitiva (art. 155.b LGP). La Intervención General ya resolvió y su criterio no cierra el caso. El titular del ministerio de adscripción no es el órgano que decide, porque es parte interesada en la discrepancia. El Tribunal de Cuentas ejerce el control externo y no resuelve discrepancias sobre reparos."
  citation: "art. 155.b) LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-20977-art-30
- id: q20
  lesson: m05-l06
  prompt:
    es: "Según el artículo 30.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿hasta qué fecha, como máximo, debe la Asociación Torre Blanca presentar la cuenta justificativa de la subvención?"
  options:
  - id: a
    text:
      es: "El viernes, 31 de diciembre de 2027."
  - id: b
    text:
      es: "El martes, 30 de noviembre de 2027."
  - id: c
    text:
      es: "El miércoles, 29 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El jueves, 30 de diciembre de 2027."
  explanation:
    es: "A falta de previsión de las bases reguladoras, la cuenta justificativa se presenta como máximo en el plazo de tres meses desde la finalización del plazo para realizar la actividad (art. 30.2 LGS). La actividad termina el jueves, 30 de septiembre de 2027, y tres meses después el plazo llega al jueves, 30 de diciembre de 2027. La fecha del viernes, 31 de diciembre de 2027, pasa al último día del mes sin motivo. La del martes, 30 de noviembre de 2027, cuenta solo dos meses. La del miércoles, 29 de diciembre de 2027, cuenta noventa días en lugar de tres meses."
  citation: "art. 30.2 LGS"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
