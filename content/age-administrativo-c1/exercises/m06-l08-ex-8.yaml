# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q238
  prompt:
    es: "Señale qué personas no pueden explorar en InPrivate en Microsoft Edge, en Windows 11, según la página de Microsoft sobre InPrivate:"
  options:
  - id: a
    text:
      es: "Los usuarios que usan una cuenta de Microsoft en el equipo"
  - id: b
    text:
      es: "Los usuarios que tienen instaladas extensiones en Edge"
  - id: c
    correct: true
    text:
      es: "Los niños con Informes de actividades o filtrado web en su grupo familiar"
  - id: d
    text:
      es: "Los usuarios que tienen activada la barra de favoritos"
  explanation:
    es: "Los niños con Informes de actividades o filtrado web habilitados a través de su grupo familiar no pueden explorar InPrivate; las organizaciones pueden impedirlo con la directiva de grupo. La barra de favoritos no condiciona la disponibilidad de InPrivate. Tener una cuenta de Microsoft no impide explorar InPrivate; lo impiden los informes de actividades o el filtrado web del grupo familiar. Las extensiones pueden ejecutarse en InPrivate si se les concede permiso; no impiden explorar."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Cuándo no está disponible la Exploración de InPrivate?»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q239
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿por qué pueden los sitios web personalizar contenido durante una sesión de exploración de InPrivate?"
  options:
  - id: a
    text:
      es: "Porque las cookies se eliminan al cerrar cada pestaña de la ventana de InPrivate del explorador"
  - id: b
    correct: true
    text:
      es: "Porque las cookies y permisos de sitios siguen hasta cerrar todas las ventanas InPrivate"
  - id: c
    text:
      es: "Porque los sitios web guardan sus datos en el perfil de Windows del usuario"
  - id: d
    text:
      es: "Porque InPrivate asocia el historial de exploración con la cuenta de Microsoft"
  explanation:
    es: "Los sitios pueden personalizar el contenido durante la sesión de InPrivate porque las cookies y otros permisos de sitios no se eliminan hasta que se cierran todas las ventanas de InPrivate. Las cookies no se eliminan al cerrar cada pestaña, sino al cerrar todas las ventanas de InPrivate. InPrivate no asocia el historial de exploración con una cuenta de Microsoft. La página atribuye la personalización a que las cookies y los permisos siguen hasta cerrar todas las ventanas de InPrivate, no a un perfil de Windows."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Es más seguro si exploro en InPrivate?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q240
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿dónde se encuentra el botón Extensiones, que da acceso a las extensiones del explorador?"
  options:
  - id: a
    correct: true
    text:
      es: "A la derecha de la barra de direcciones del explorador"
  - id: b
    text:
      es: "En la barra de tareas de Windows, junto al logotipo de Edge"
  - id: c
    text:
      es: "En la barra de favoritos, bajo la barra de direcciones"
  - id: d
    text:
      es: "A la izquierda de la barra de direcciones del explorador"
  explanation:
    es: "El botón Extensiones se encuentra a la derecha de la barra de direcciones del explorador. La página lo sitúa a la derecha de la barra de direcciones, no a la izquierda. La página lo sitúa a la derecha de la barra de direcciones, no en la barra de favoritos. La página lo sitúa en el propio explorador, a la derecha de la barra de direcciones, no en la barra de tareas de Windows."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
