# anchor: boe-a-2015-11719-df-cuarta
- id: m05-l04-q001
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los capítulos II y III de su título III, excepto el artículo 25.2, producen efectos:"
  options:
  - id: a
    text:
      es: "Desde la entrada en vigor del propio texto refundido, sin esperar a ninguna ley de desarrollo."
  - id: b
    text:
      es: "A partir de la entrada en vigor de la Ley de Presupuestos Generales del Estado de cada ejercicio."
  - id: c
    correct: true
    text:
      es: "A partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: d
    text:
      es: "Desde la publicación de las normas reglamentarias que desarrollen el Estatuto en cada Administración."
  explanation:
    es: "La disposición final cuarta.1 dice que lo establecido en esos capítulos, salvo el artículo 25.2, «producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo de este Estatuto». La opción de la entrada en vigor inmediata del texto refundido ignora esa condición. La de las leyes de presupuestos confunde estas leyes con las que fijan cada año las cuantías. La de las normas reglamentarias coloca el hito en el reglamento, cuando la norma habla de las leyes de Función Pública."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-df-cuarta
- id: m05-l04-q002
  prompt:
    es: "Según la disposición final cuarta.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública y sus normas de desarrollo se mantendrán en vigor en cada Administración:"
  options:
  - id: a
    text:
      es: "Las normas vigentes sobre ordenación, planificación y gestión de recursos humanos, incluso las que se opongan al Estatuto."
  - id: b
    text:
      es: "Solo las normas estatales vigentes sobre función pública, en tanto no se opongan al Estatuto."
  - id: c
    text:
      es: "Únicamente las normas reglamentarias sobre ordenación de recursos humanos, en tanto no se opongan al Estatuto."
  - id: d
    correct: true
    text:
      es: "Las normas vigentes sobre ordenación, planificación y gestión de recursos humanos, en tanto no se opongan al Estatuto."
  explanation:
    es: "La disposición final cuarta.2 mantiene en vigor «las normas vigentes sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan a lo establecido en este Estatuto». La opción que mantiene también las normas opuestas elimina el límite que fija la norma. La que reduce el alcance a las normas estatales y la que lo reduce a las reglamentarias recortan el texto, que habla de las normas vigentes «en cada Administración Pública» sin distinguir su rango."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2025-24445-art-2
- id: m05-l04-q004
  prompt:
    es: "Según el artículo 2.1 del Real Decreto-ley 14/2025, de 2 de diciembre, por el que se aprueban medidas urgentes en materia de retribuciones en el ámbito del sector público, ¿qué incremento global máximo pueden tener en 2026 las retribuciones?"
  options:
  - id: a
    text:
      es: "Un 2 por ciento sobre las retribuciones vigentes, incluido el incremento aprobado por el propio real decreto-ley."
  - id: b
    correct: true
    text:
      es: "Un 1,5 por ciento sobre las retribuciones vigentes, incluido el incremento aprobado por el propio real decreto-ley."
  - id: c
    text:
      es: "Un 1,5 por ciento sobre las retribuciones vigentes, sin incluir el incremento aprobado por el propio real decreto-ley."
  - id: d
    text:
      es: "Un 0,5 por ciento sobre las retribuciones vigentes, incluido el incremento aprobado por el propio real decreto-ley."
  explanation:
    es: "El artículo 2.1 RDL 14/2025 dice que en 2026 las retribuciones «podrán experimentar un incremento global máximo del 1,5 por ciento respecto a las vigentes a 31 de diciembre de 2025, incluido en estas últimas el incremento retributivo aprobado en este real decreto-ley». Un 2 por ciento no es la cifra del apartado 1, que es el 1,5. Excluir el incremento del propio real decreto-ley contradice «incluido en estas últimas». El 0,5 por ciento es el incremento adicional del apartado 2, que se aplica «en su caso» y no es el máximo global del apartado 1."
  citation: "art. 2.1 RDL 14/2025"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2025-24445-art-2
- id: m05-l04-q005
  prompt:
    es: "Según el artículo 2.2 del Real Decreto-ley 14/2025, de 2 de diciembre, de medidas urgentes en materia de retribuciones, ¿cuándo se abona el incremento adicional y consolidable del 0,5 por ciento, si procede?"
  options:
  - id: a
    correct: true
    text:
      es: "En el primer trimestre de 2027, con efectos económicos de 1 de enero de 2026."
  - id: b
    text:
      es: "En el último trimestre de 2026, con efectos económicos de 1 de enero de 2026."
  - id: c
    text:
      es: "En el primer trimestre de 2027, con efectos económicos de 1 de enero de 2027."
  - id: d
    text:
      es: "En el primer semestre de 2027, con efectos económicos de 1 de julio de 2026."
  explanation:
    es: "El artículo 2.2 aplica el incremento adicional y consolidable del 0,5 por ciento «con efectos de 1 de enero de 2026» si el IPC de 2026 es igual o superior al 1,5 por ciento, y «se abonará en el primer trimestre de 2027». La opción del último trimestre de 2026 adelanta el pago, que depende de que el INE publique antes los datos del IPC de 2026. La que fija efectos desde el 1 de enero de 2027 y la que los fija desde el 1 de julio de 2026 cambian la fecha de efectos económicos, que es el 1 de enero de 2026."
  citation: "art. 2.2 RDL 14/2025"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2015-11719-art-30
- id: m05-l04-q007
  prompt:
    es: "Señale la afirmación correcta sobre la deducción de haberes por la parte de jornada no realizada, conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Se aplica sin perjuicio de la sanción disciplinaria que pueda corresponder y no tiene carácter sancionador."
  - id: b
    text:
      es: "Excluye la sanción disciplinaria por esos mismos hechos, porque la propia deducción tiene carácter sancionador."
  - id: c
    text:
      es: "Solo procede cuando media sanción disciplinaria previa y, en ese caso, no tiene carácter sancionador."
  - id: d
    text:
      es: "Es proporcional a la jornada no realizada, pero tiene el carácter de sanción disciplinaria leve."
  explanation:
    es: "El artículo 30.1 dispone que, «sin perjuicio de la sanción disciplinaria que pueda corresponder», la parte de jornada no realizada da lugar a la deducción proporcional de haberes, «que no tendrá carácter sancionador». La opción que excluye la sanción y la que atribuye carácter de sanción leve a la deducción niegan ese carácter no sancionador. La que condiciona la deducción a una sanción previa invierte la relación: la deducción se aplica con independencia de que haya sanción."
  citation: "art. 30.1 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2019-7414-art-56
- id: m05-l04-q010
  prompt:
    es: "Entre las otras retribuciones de carácter personal que enumera el artículo 56.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, figura:"
  options:
  - id: a
    text:
      es: "El complemento de prolongación de jornada."
  - id: b
    text:
      es: "El complemento por cantidad o calidad de trabajo."
  - id: c
    correct: true
    text:
      es: "El complemento personal de encuadramiento."
  - id: d
    text:
      es: "El complemento de residencia del personal laboral."
  explanation:
    es: "Las otras retribuciones de carácter personal del artículo 56.1 son la antigüedad y los complementos personales de antigüedad, de unificación, absorbibles y de encuadramiento. El complemento de prolongación de jornada es un complemento de puesto de trabajo, el de cantidad o calidad de trabajo tiene su propio epígrafe y el de residencia figura entre los complementos salariales: los tres pertenecen a otro grupo de la estructura."
  citation: "art. 56.1 IV Convenio único"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2019-7414-art-59
- id: m05-l04-q011
  prompt:
    es: "Según el artículo 59.5.2.5 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el complemento de prolongación de jornada se asigna a puestos con jornada superior a la ordinaria, con el límite de:"
  options:
  - id: a
    text:
      es: "Cuarenta y dos horas semanales en cómputo anual."
  - id: b
    text:
      es: "Treinta y siete horas y media semanales en cómputo anual."
  - id: c
    correct: true
    text:
      es: "Cuarenta horas semanales en cómputo anual."
  - id: d
    text:
      es: "Cuarenta horas semanales en cómputo mensual."
  explanation:
    es: "El complemento de prolongación de jornada se asigna a los puestos con jornada superior a la ordinaria, «con el límite de cuarenta horas semanales en cómputo anual». Las cuarenta y dos horas son una cifra que el Convenio no recoge. Las treinta y siete horas y media son la jornada general ordinaria, no el límite de este complemento. El cómputo mensual cambia el periodo, que es anual."
  citation: "art. 59.5.2.5 IV Convenio único"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-art-1
- id: m05-l04-q015
  prompt:
    es: "¿Cuál de los siguientes supuestos da origen a indemnización o compensación según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio?"
  options:
  - id: a
    text:
      es: "El desplazamiento habitual desde el lugar donde se está autorizado a residir hasta el centro de trabajo."
  - id: b
    correct: true
    text:
      es: "Los traslados de residencia, en las condiciones y límites del propio real decreto."
  - id: c
    text:
      es: "Las vacaciones disfrutadas fuera del término municipal de la residencia oficial."
  - id: d
    text:
      es: "La realización de horas extraordinarias fuera del término municipal del puesto de trabajo."
  explanation:
    es: "El artículo 1.1 enumera los supuestos que dan origen a indemnización: comisiones de servicio, desplazamientos dentro del término municipal, traslados de residencia y asistencias a órganos colegiados, tribunales y centros de formación. El desplazamiento habitual entre el lugar de residencia autorizado y el centro de trabajo no es comisión de servicio, según el artículo 3.1. Las vacaciones y las horas extraordinarias no figuran en la lista."
  citation: "art. 1.1 RD 462/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-10337-art-3
- id: m05-l04-q016
  prompt:
    es: "Según el artículo 3.1 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿qué se entiende por residencia oficial a efectos de las comisiones de servicio con derecho a indemnización?"
  options:
  - id: a
    text:
      es: "El término municipal donde el empleado tiene su domicilio y está empadronado."
  - id: b
    text:
      es: "La provincia en la que radica la oficina o dependencia del puesto de trabajo habitual."
  - id: c
    text:
      es: "El término municipal de la sede central del Departamento del que depende el puesto de trabajo."
  - id: d
    correct: true
    text:
      es: "El término municipal de la oficina o dependencia en que se desarrollan las actividades del puesto de trabajo habitual."
  explanation:
    es: "El artículo 3.1 entiende por residencia oficial «el término municipal correspondiente a la oficina o dependencia en que se desarrollen las actividades del puesto de trabajo habitual». El domicilio no la define: la autorización para residir en otro término municipal no altera ese concepto. La provincia amplía el ámbito, que es el municipio. La sede central del Departamento no es el criterio: cuenta la dependencia del puesto habitual."
  citation: "art. 3.1 RD 462/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-10337-art-9
- id: m05-l04-q017
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a la «dieta» según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio?"
  options:
  - id: a
    text:
      es: "La cantidad que se abona por la utilización de cualquier medio de transporte por razón de servicio."
  - id: b
    correct: true
    text:
      es: "La cantidad que se devenga diariamente para satisfacer los gastos que origina la estancia fuera de la residencia oficial."
  - id: c
    text:
      es: "La cantidad que se devenga diariamente para satisfacer los gastos de estancia en los casos de residencia eventual."
  - id: d
    text:
      es: "La cantidad que se abona por cada sesión a la que asiste un miembro de un tribunal de oposiciones."
  explanation:
    es: "El artículo 9.1 define la dieta como «la cantidad que se devenga diariamente para satisfacer los gastos que origina la estancia fuera de la residencia oficial». La cantidad por el uso de un medio de transporte son los gastos de viaje. La que cubre la estancia en los casos de residencia eventual es la indemnización de residencia eventual, que define el apartado 2. La que se abona por sesión es la asistencia de los tribunales."
  citation: "art. 9.1 RD 462/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-10337-art-7
- id: m05-l04-q018
  prompt:
    es: "Según el artículo 7.1 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, la asistencia a cursos de perfeccionamiento convocados por las Administraciones públicas puede ser indemnizada si cuenta con:"
  options:
  - id: a
    text:
      es: "Autorización expresa, pero solo cuando el curso dura más de cinco días."
  - id: b
    text:
      es: "Autorización tácita, siempre que el curso se realice fuera del término municipal de la residencia oficial."
  - id: c
    text:
      es: "Autorización expresa y se realiza dentro del término municipal de la residencia oficial."
  - id: d
    correct: true
    text:
      es: "Autorización expresa y se realiza fuera del término municipal de la residencia oficial, cualquiera que sea su duración."
  explanation:
    es: "El artículo 7.1 exige «autorización expresa» y que el curso se lleve a efecto «fuera del término municipal donde radique su residencia oficial», «cualquiera que sea la duración de los mismos». La opción del curso de más de cinco días añade una duración mínima que el artículo excluye. La autorización tácita no basta, porque la autorización debe ser expresa. La opción del curso dentro del término municipal contradice el requisito del lugar."
  citation: "art. 7.1 RD 462/2002"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2002-10337-art-7
- id: m05-l04-q019
  prompt:
    es: "Una funcionaria del Subgrupo A2 asiste, con autorización expresa, a un curso de perfeccionamiento de la Administración en otro municipio, vuelve a dormir en su residencia oficial y almuerza en la localidad del curso. ¿Qué manutención percibe?"
  options:
  - id: a
    text:
      es: "37,40 euros, la manutención íntegra del grupo 2."
  - id: b
    correct: true
    text:
      es: "18,70 euros, el 50 por 100 de la manutención del grupo 2."
  - id: c
    text:
      es: "26,67 euros, el 50 por 100 de la manutención del grupo 1."
  - id: d
    text:
      es: "51,69 euros, el 50 por 100 de la dieta entera del grupo 2."
  explanation:
    es: "El Subgrupo A2 equivale al antiguo Grupo B y se clasifica en el grupo 2 del anexo I, con una manutención de 37,40 euros. Quien vuelve a pernoctar en su residencia no devenga indemnización, pero si por el horario tiene que almorzar en la localidad del curso percibe «el 50 por 100 de los gastos de manutención»: 18,70 euros. La manutención íntegra olvida ese porcentaje. Los 26,67 euros aplican el 50 por 100 a la manutención del grupo 1, que no es el suyo. Los 51,69 euros toman la mitad de la dieta entera, que incluye el alojamiento, cuando el porcentaje se aplica solo a la manutención."
  citation: "art. 7.1 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2002-10337-art-10
- id: m05-l04-q021
  prompt:
    es: "Conforme al artículo 10.1 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, las dietas en territorio nacional se perciben según las cuantías del anexo II. ¿Qué dieta entera corresponde al grupo 3?"
  options:
  - id: a
    text:
      es: "103,37 euros diarios, entre alojamiento y manutención."
  - id: b
    correct: true
    text:
      es: "77,13 euros diarios, entre alojamiento y manutención."
  - id: c
    text:
      es: "86,32 euros diarios, entre alojamiento y manutención."
  - id: d
    text:
      es: "155,90 euros diarios, entre alojamiento y manutención."
  explanation:
    es: "El anexo II fija para el grupo 3 un alojamiento de 48,92 euros, una manutención de 28,21 euros y una dieta entera de 77,13 euros. Los 103,37 euros son la dieta entera del grupo 2 y los 155,90 euros la del grupo 1. Los 86,32 euros mezclan el alojamiento del grupo 3 con la manutención del grupo 2."
  citation: "art. 10.1 RD 462/2002"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-anexo-i
- id: m05-l04-q022
  prompt:
    es: "A efectos de dietas, ¿en qué grupo del anexo I del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, se clasifica un Subdirector general?"
  options:
  - id: a
    correct: true
    text:
      es: "En el grupo 1, igual que los Rectores de Universidad."
  - id: b
    text:
      es: "En el grupo 2, igual que los funcionarios de los grupos A y B."
  - id: c
    text:
      es: "En el grupo 2, igual que los Cuerpos únicos de las Carreras Judicial y Fiscal."
  - id: d
    text:
      es: "En el grupo 3, igual que los funcionarios de los grupos C, D y E."
  explanation:
    es: "El anexo I incluye en el grupo 1 a los Subdirectores generales, junto a los Rectores de Universidad, los Embajadores y otros cargos. Los funcionarios de los grupos A y B y los Cuerpos únicos de las Carreras Judicial y Fiscal son del grupo 2. Los funcionarios de los grupos C, D y E son del grupo 3."
  citation: "anexo I RD 462/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-dt-tercera
- id: m05-l04-q023
  prompt:
    es: "Según la disposición transitoria tercera.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué equivalencia se establece para los Grupos de clasificación existentes antes de la Ley 7/2007?"
  options:
  - id: a
    text:
      es: "El Grupo C se integra en el Subgrupo C2."
  - id: b
    text:
      es: "El Grupo B se integra en el Subgrupo A1."
  - id: c
    correct: true
    text:
      es: "El Grupo C se integra en el Subgrupo C1."
  - id: d
    text:
      es: "El Grupo D se integra en el Subgrupo C1."
  explanation:
    es: "La disposición transitoria tercera.2 integra el Grupo A en el Subgrupo A1, el Grupo B en el A2, el Grupo C en el C1 y el Grupo D en el C2. El Grupo E pasa a las Agrupaciones Profesionales. El Subgrupo C2 corresponde al antiguo Grupo D, el A2 al antiguo Grupo B y el A1 al antiguo Grupo A."
  citation: "disposición transitoria tercera.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q024
  prompt:
    es: "De acuerdo con el artículo 12.1 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, en comisiones de hasta un día natural se percibe el 50 por 100 de la manutención si la comisión:"
  options:
  - id: a
    correct: true
    text:
      es: "Dura al menos cinco horas, empieza antes de las catorce horas y termina después de las dieciséis horas."
  - id: b
    text:
      es: "Dura al menos cuatro horas, empieza antes de las catorce horas y termina después de las dieciséis horas."
  - id: c
    text:
      es: "Dura al menos cinco horas, empieza antes de las quince horas y termina después de las dieciséis horas."
  - id: d
    text:
      es: "Dura al menos cinco horas, empieza antes de las catorce horas y termina después de las veintidós horas."
  explanation:
    es: "El artículo 12.1 exige una duración mínima de cinco horas, un inicio antes de las catorce horas y una finalización después de las dieciséis horas para percibir el 50 por 100 de la dieta por manutención. La opción de cuatro horas reduce la duración mínima. La que fija el inicio antes de las quince horas amplía el margen horario. La que exige terminar después de las veintidós horas confunde esta regla con la de la cena fuera de la residencia del apartado 4."
  citation: "art. 12.1 RD 462/2002"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q025
  prompt:
    es: "Un funcionario sale a las 15:00 en una comisión de servicio con derecho a indemnización a otra localidad y regresa a las 21:00 a su oficina habitual el mismo día. ¿Qué dietas percibe?"
  options:
  - id: a
    text:
      es: "El 50 por 100 de la dieta por manutención."
  - id: b
    correct: true
    text:
      es: "Ninguna indemnización por alojamiento ni por manutención."
  - id: c
    text:
      es: "El 100 por 100 de la dieta por manutención."
  - id: d
    text:
      es: "La dieta entera, porque la comisión dura más de cinco horas."
  explanation:
    es: "En una comisión de duración igual o inferior a un día natural, en general no se perciben gastos de alojamiento ni de manutención. La excepción exige una duración mínima de cinco horas y que la comisión se inicie antes de las catorce horas, y aquí empieza a las quince. El 50 por 100 y el 100 por 100 de la manutención suponen aplicar esa excepción o la regla de las comisiones de más de veinticuatro horas. La dieta entera olvida que la duración no basta por sí sola."
  citation: "art. 12.1 RD 462/2002"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q026
  prompt:
    es: "Conforme al artículo 12.2 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, en las comisiones de duración igual o menor a veinticuatro horas que comprenden parte de dos días naturales podrán percibirse:"
  options:
  - id: a
    text:
      es: "Gastos de alojamiento de dos días y manutención al 100 por 100 en ambos días."
  - id: b
    correct: true
    text:
      es: "Gastos de alojamiento de un solo día y gastos de manutención como en los días de salida y regreso."
  - id: c
    text:
      es: "Solo gastos de manutención, sin alojamiento, aunque se pernocte fuera de la residencia."
  - id: d
    text:
      es: "Gastos de alojamiento de un solo día y manutención al 100 por 100 el día de regreso."
  explanation:
    es: "El artículo 12.2 permite indemnizar «gastos de alojamiento correspondiente a un solo día» y la manutención «en las mismas condiciones fijadas» para los días de salida y regreso. El alojamiento de dos días excede de lo que la norma permite. La opción que excluye el alojamiento contradice el texto. La del 100 por 100 el día de regreso no se corresponde con la regla del día de regreso, que solo da el 50 por 100 de la manutención si la comisión concluye después de las catorce horas."
  citation: "art. 12.2 RD 462/2002"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q027
  prompt:
    es: "En una comisión de servicio con derecho a indemnización de más de veinticuatro horas, con salida antes de las catorce horas, ¿qué se percibe el día de salida?"
  options:
  - id: a
    correct: true
    text:
      es: "Alojamiento y el 100 por 100 de los gastos de manutención."
  - id: b
    text:
      es: "Alojamiento y el 50 por 100 de los gastos de manutención."
  - id: c
    text:
      es: "Solo el 100 por 100 de los gastos de manutención, sin alojamiento."
  - id: d
    text:
      es: "Alojamiento, pero ningún gasto de manutención."
  explanation:
    es: "Si la hora fijada para iniciar la comisión es anterior a las catorce horas, el día de salida se perciben gastos de alojamiento y «el 100 por 100» de los de manutención. El 50 por 100 corresponde a la salida posterior a las catorce horas y anterior a las veintidós. La opción sin alojamiento omite el gasto que la norma sí reconoce en el día de salida. La opción sin manutención corresponde a la salida a partir de las veintidós horas."
  citation: "art. 12.3.a) RD 462/2002"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q029
  prompt:
    es: "Según el artículo 12.4 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, si el regreso posterior a las veintidós horas obliga a cenar fuera, se abona otro 50 por 100 de la manutención cuando:"
  options:
  - id: a
    text:
      es: "Se comunica tras el regreso, sin necesidad de justificación documental."
  - id: b
    correct: true
    text:
      es: "Se hace constar en la orden de comisión y se justifica con factura o recibo."
  - id: c
    text:
      es: "Se hace constar en la orden de comisión, sin necesidad de justificar el gasto."
  - id: d
    text:
      es: "Se justifica con factura o recibo, aunque no conste en la orden de comisión."
  explanation:
    es: "El artículo 12.4 exige que la circunstancia «se hará constar en la Orden de comisión» y que el importe se abone «previa justificación con factura o recibo del correspondiente establecimiento». Las otras opciones prescinden de uno de los dos requisitos o de ambos: la comunicación posterior sin justificante, la mera constancia en la orden sin justificar el gasto y la justificación sin constancia previa en la orden."
  citation: "art. 12.4 RD 462/2002"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2002-10337-art-12
- id: m05-l04-q030
  prompt:
    es: "Una funcionaria del Subgrupo A2, en comisión con derecho a indemnización, sale el lunes a las 15:00 y regresa el miércoles a las 12:00; el hotel cuesta 70,00 euros por noche. ¿Qué dietas percibe con las cuantías del anexo II?"
  options:
  - id: a
    text:
      es: "Percibe un total de 169,34 euros."
  - id: b
    text:
      es: "Percibe un total de 196,10 euros."
  - id: c
    text:
      es: "Percibe un total de 206,74 euros."
  - id: d
    correct: true
    text:
      es: "Percibe un total de 188,04 euros."
  explanation:
    es: "Es del grupo 2: alojamiento máximo de 65,97 euros y manutención de 37,40. El lunes sale después de las catorce horas y antes de las veintidós: alojamiento y el 50 por 100 de la manutención, 65,97 más 18,70, es decir, 84,67 euros. El martes, día intermedio, dieta al 100 por 100: 103,37 euros. El miércoles regresa antes de las catorce horas y no percibe nada. El total es 188,04 euros. La cifra de 169,34 omite la manutención del lunes. La de 196,10 paga el hotel por su coste real, sin el máximo del anexo. La de 206,74 añade el 50 por 100 de la manutención el miércoles, aunque la comisión concluye antes de las catorce horas."
  citation: "art. 12.3 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2002-10337-art-18
- id: m05-l04-q031
  prompt:
    es: "Según el artículo 18.1 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, en las comisiones de servicio se podrán utilizar vehículos particulares cuando:"
  options:
  - id: a
    text:
      es: "El comisionado lo solicite, siempre que el recorrido supere los cien kilómetros."
  - id: b
    text:
      es: "No exista transporte regular, aunque no conste en la orden de comisión."
  - id: c
    correct: true
    text:
      es: "Excepcionalmente así se determine en la orden de comisión, en los casos que prevé la normativa vigente."
  - id: d
    text:
      es: "Lo autorice el responsable de la unidad, sin que deba constar en la orden de comisión."
  explanation:
    es: "El artículo 18.1 permite el vehículo particular cuando, «excepcionalmente, así se determine en la orden de comisión», en los casos previstos por la normativa vigente. La solicitud del comisionado con un mínimo de kilómetros es un requisito que la norma no contiene. Las opciones que dejan fuera la orden de comisión contradicen el texto, porque la determinación debe constar en ella."
  citation: "art. 18.1 RD 462/2002"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2023-16462-art-1
- id: m05-l04-q032
  prompt:
    es: "Un funcionario, autorizado en la orden de comisión a usar su motocicleta, recorre 250 kilómetros entre ida y vuelta. Según la Orden HFP/793/2023, de 12 de julio, ¿qué indemnización por uso de vehículo particular percibe?"
  options:
  - id: a
    text:
      es: "Percibe un total de 53,00 euros."
  - id: b
    text:
      es: "Percibe un total de 65,00 euros."
  - id: c
    text:
      es: "Percibe un total de 130,00 euros."
  - id: d
    correct: true
    text:
      es: "Percibe un total de 26,50 euros."
  explanation:
    es: "La Orden fija 0,106 euros por kilómetro en motocicleta. En 250 kilómetros resultan 26,50 euros. La cifra de 53,00 euros duplica el recorrido, como si los 250 kilómetros fueran solo de ida. La de 65,00 aplica la tarifa del automóvil, 0,26 euros por kilómetro. La de 130,00 combina la tarifa del automóvil con el recorrido duplicado."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2002-10337-art-11
- id: m05-l04-q035
  prompt:
    es: "Según el artículo 11.2 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿quién actualiza, al menos una vez al año, los importes del anexo III para las dietas en el extranjero?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro de Hacienda, en revisiones anuales."
  - id: b
    text:
      es: "El Consejo de Ministros, en revisiones anuales."
  - id: c
    text:
      es: "El Ministro de Asuntos Exteriores, Unión Europea y Cooperación, en revisiones anuales."
  - id: d
    text:
      es: "La Dirección General del Tesoro y Política Financiera, en revisiones anuales."
  explanation:
    es: "El artículo 11.2 atribuye al Ministro de Hacienda la actualización del anexo III, «en revisiones que deberán tener, al menos, carácter anual». El Consejo de Ministros solo aprueba la modificación cuando obedece a cambios de denominación o a la constitución de nuevos países. El Ministro de Asuntos Exteriores y la Dirección General del Tesoro no tienen esa competencia en el artículo."
  citation: "art. 11.2 RD 462/2002"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2022-22128-art-32
- id: m05-l04-q036
  prompt:
    es: "De acuerdo con el artículo 32.Tres de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, las indemnizaciones por razón del servicio seguirán percibiéndose:"
  options:
  - id: a
    text:
      es: "En las cuantías vigentes en 2021."
  - id: b
    text:
      es: "Con el incremento general de retribuciones previsto para 2023."
  - id: c
    correct: true
    text:
      es: "En las cuantías vigentes en 2022."
  - id: d
    text:
      es: "Actualizadas con la variación del IPC del año anterior."
  explanation:
    es: "El artículo 32.Tres dispone que las indemnizaciones por razón del servicio «seguirán percibiéndose en las cuantías vigentes en 2022». Las cuantías de 2021 son un año anterior al de la regla. El incremento general de retribuciones del artículo 19.dos no se aplica a las indemnizaciones. La actualización con el IPC no está prevista: las cuantías se mantienen."
  citation: "art. 32.Tres Ley 31/2022"
  difficulty: 2
  tags:
  - "cantidad"
