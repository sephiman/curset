# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q450
  prompt:
    es: "Según la ayuda de Access 365, ¿qué ocurre al exportar a un libro de Excel que ya existe una tabla o consulta con sus datos, pero sin formato?"
  options:
  - id: a
    correct: true
    text:
      es: "Se agrega una hoja nueva con el nombre del objeto"
  - id: b
    text:
      es: "Se sobrescribe el libro y se eliminan todas las hojas"
  - id: c
    text:
      es: "Se anexan los datos a la hoja activa del libro"
  - id: d
    text:
      es: "Se anexan los datos a un rango con nombre del libro"
  explanation:
    es: "La página dice: «El libro no se sobrescribe. Se agrega una nueva hoja de cálculo al libro y recibe el nombre del objeto del que se exportan los datos». «Se sobrescribe el libro y se eliminan todas las hojas» ocurre solo al exportar los datos con formato. «Se anexan los datos a la hoja activa del libro» y «se anexan los datos a un rango con nombre del libro» no son posibles: «No puede anexar los datos en una hoja de cálculo existente o en un rango con nombre»."
  citation: "fuente: `ms-access-exportar-excel.html`; «Prepararse para la operación de exportación»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q451
  prompt:
    es: "En Access 365, ¿qué se exporta a Excel cuando se exportan los datos de una tabla con formato y diseño?"
  options:
  - id: a
    text:
      es: "Todos los campos y registros del objeto subyacente"
  - id: b
    correct: true
    text:
      es: "Solo lo que se muestra en la vista actual"
  - id: c
    text:
      es: "Solo los registros, sin los nombres de campo"
  - id: d
    text:
      es: "Los registros filtrados y las columnas ocultas"
  explanation:
    es: "La página dice de la exportación con formato y diseño: «Solo se exportan campos y registros que se muestran en la vista o el objeto actual». Todos los campos y registros del objeto subyacente es lo que la página da para la exportación sin formato. Los registros filtrados y las columnas ocultas son justo lo que no se exporta: la frase siguiente los excluye. Y exportar solo los registros sin los campos no es lo que dice la página, que habla de exportar campos y registros mostrados."
  citation: "fuente: `ms-access-exportar-excel.html`; «Prepararse para la operación de exportación»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q452
  prompt:
    es: "Según la ayuda de Access 365, ¿qué se exporta al exportar un formulario que contiene subformularios a Excel?"
  options:
  - id: a
    text:
      es: "El formulario principal y todos sus subformularios"
  - id: b
    text:
      es: "Solo los subformularios"
  - id: c
    text:
      es: "El formulario principal y el primer subformulario"
  - id: d
    correct: true
    text:
      es: "Solo el formulario principal"
  explanation:
    es: "La página dice: «Al exportar formularios, informes u hojas de datos que contienen subformularios, subinformes u hojas secundarias de datos, solo se exporta el formulario, el informe o la hoja de datos principales. Debe repetir la operación de exportación para cada subformulario». Por eso «El formulario principal y todos sus subformularios», «Solo los subformularios» y «El formulario principal y el primer subformulario» son falsos."
  citation: "fuente: `ms-access-exportar-excel.html`; «Acerca de la exportación de datos a Excel»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q453
  prompt:
    es: "En Access 365, ¿qué se exporta a Excel de un campo calculado de una tabla o de una consulta?"
  options:
  - id: a
    correct: true
    text:
      es: "El resultado, pero no la expresión"
  - id: b
    text:
      es: "La expresión, pero no el resultado"
  - id: c
    text:
      es: "La expresión y el resultado, en celdas distintas"
  - id: d
    text:
      es: "Ni la expresión ni el resultado"
  explanation:
    es: "La página dice: «Los resultados de los campos calculados se exportan; las expresiones subyacentes que realizan los cálculos, no». Por eso «la expresión, pero no el resultado» es lo contrario. «La expresión y el resultado, en celdas distintas» y «ni la expresión ni el resultado» tampoco figuran en la página."
  citation: "fuente: `ms-access-exportar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q454
  prompt:
    es: "En Access 365, ¿cuál de los siguientes conjuntos de elementos de los datos de origen hay que agregar manualmente a la hoja de Excel tras exportar?"
  options:
  - id: a
    text:
      es: "Campos de hipervínculo y de texto enriquecido"
  - id: b
    correct: true
    text:
      es: "Logotipos, campos Objeto OLE y datos adjuntos"
  - id: c
    text:
      es: "Campos de búsqueda y campos Sí/No"
  - id: d
    text:
      es: "Campos multivalor y campos calculados"
  explanation:
    es: "La página dice: «No se exportan elementos gráficos (como logotipos, contenido de campos Objeto OLE y datos adjuntos que son parte de los datos de origen). Agréguelos manualmente a la hoja de cálculo». «Campos de hipervínculo y de texto enriquecido» sí se exportan: los hipervínculos como hipervínculos y del texto enriquecido «se exporta el texto pero no el formato». «Campos de búsqueda y campos Sí/No» también, y «campos multivalor y campos calculados» igualmente: los multivalor como lista separada por punto y coma y de los calculados, sus resultados."
  citation: "fuente: `ms-access-exportar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q455
  prompt:
    es: "En Access 365, ¿qué ocurre con los valores de fecha anteriores al 1 de enero de 1900 al exportarlos a Excel?"
  options:
  - id: a
    text:
      es: "Se exportan como el 1 de enero de 1900"
  - id: b
    text:
      es: "Se exportan como texto, sin formato de fecha"
  - id: c
    correct: true
    text:
      es: "No se exportan y las celdas contienen un valor nulo"
  - id: d
    text:
      es: "Se exportan con el sistema de fechas de 1904"
  explanation:
    es: "La página dice: «No se exportan los valores de fecha anteriores al 1 de enero de 1900. Las celdas correspondientes de la hoja de cálculo contendrán un valor nulo». «Se exportan como el 1 de enero de 1900», «como texto» y «con el sistema de fechas de 1904» no figuran en la página."
  citation: "fuente: `ms-access-exportar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m06-l06-q456
  prompt:
    es: "En Access 365, ¿cuál de las siguientes casillas del cuadro Exportar a una hoja de cálculo de Excel permite exportar solo los registros seleccionados en la vista?"
  options:
  - id: a
    text:
      es: "Exportar datos con formato y diseño"
  - id: b
    text:
      es: "Abrir el archivo de destino al finalizar la operación de exportación"
  - id: c
    text:
      es: "Guardar los pasos de exportación"
  - id: d
    correct: true
    text:
      es: "Exportar solo los registros seleccionados"
  explanation:
    es: "La página dice: «puede seleccionar Exportar solo los registros seleccionados». «Exportar datos con formato y diseño» exporta lo que muestra la vista con su formato. «Abrir el archivo de destino al finalizar» solo abre el libro en Excel al terminar. «Guardar los pasos de exportación» no es una casilla de ese cuadro: tras la operación, Access muestra un cuadro para crear una especificación."
  citation: "fuente: `ms-access-exportar-excel.html`; «Ejecutar la operación de exportación»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l06-q457
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite publicar una tabla o un informe como PDF?"
  options:
  - id: a
    correct: true
    text:
      es: "Datos externos › Exportar › PDF o XPS"
  - id: b
    text:
      es: "Archivo › Guardar una copia › PDF"
  - id: c
    text:
      es: "Crear › Informes › PDF o XPS"
  - id: d
    text:
      es: "Datos externos › Exportar › Excel"
  explanation:
    es: "La página dice del Access: «En la pestaña Datos externos, en el grupo Exportar, seleccione PDF o XPS». «Archivo › Guardar una copia» es la ruta de Word para guardar como PDF. «Crear › Informes» agrupa las herramientas para crear informes. «Datos externos › Exportar › Excel» exporta a un libro de Excel, no a PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-pdf-html
- id: m06-l06-q458
  prompt:
    es: "Según la ayuda de Microsoft sobre PDF, ¿cuál de las siguientes opciones de la lista Guardar como tipo hay que seleccionar en Access 365?"
  options:
  - id: a
    text:
      es: "XPS (*.xps)"
  - id: b
    correct: true
    text:
      es: "PDF (*.pdf)"
  - id: c
    text:
      es: "Libro de Excel (*.xlsx)"
  - id: d
    text:
      es: "Texto (*.txt)"
  explanation:
    es: "La página dice: «En la lista Guardar como tipo, seleccione PDF (*.pdf)». «XPS (*.xps)» es el otro formato del comando PDF o XPS, no el PDF. «Libro de Excel (*.xlsx)» y «Texto (*.txt)» no son tipos que la página cite para publicar como PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l06-q459
  prompt:
    es: "En Access 365, al publicar como PDF, ¿qué opción conviene elegir si se necesita una alta calidad de impresión?"
  options:
  - id: a
    text:
      es: "Tamaño mínimo (publicación en línea)"
  - id: b
    text:
      es: "Opciones, para definir la página que se imprimirá"
  - id: c
    correct: true
    text:
      es: "Standard (publicación en línea e impresión)"
  - id: d
    text:
      es: "Cualquiera, porque ambas tienen igual calidad"
  explanation:
    es: "La página dice: «Si necesita una alta calidad de impresión en el documento, seleccione Standard (publicación en línea e impresión)». «Tamaño mínimo (publicación en línea)» es para cuando «el tamaño del archivo es más importante que la calidad de impresión». «Opciones, para definir la página que se imprimirá» sirve para definir la página, las marcas y las opciones de impresión, no la calidad. «Cualquiera, porque ambas tienen igual calidad» contradice la distinción que hace la página entre las dos opciones."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l06-q460
  prompt:
    es: "En Access 365, al publicar como PDF, ¿qué opción conviene elegir si el tamaño del archivo es más importante que la calidad de impresión?"
  options:
  - id: a
    text:
      es: "Standard (publicación en línea e impresión)"
  - id: b
    text:
      es: "Opciones, para elegir si se imprimen las marcas"
  - id: c
    text:
      es: "Publicar, para guardar sin calidad de impresión"
  - id: d
    correct: true
    text:
      es: "Tamaño mínimo (publicación en línea)"
  explanation:
    es: "La página dice: «Si el tamaño del archivo es más importante que la calidad de impresión, seleccione Tamaño mínimo (publicación en línea)». «Standard (publicación en línea e impresión)» es la opción para una alta calidad de impresión. «Opciones, para elegir si se imprimen las marcas» define la página, las marcas y las opciones de impresión. «Publicar, para guardar sin calidad de impresión» es el último paso, que genera el archivo, y no elige la calidad."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
