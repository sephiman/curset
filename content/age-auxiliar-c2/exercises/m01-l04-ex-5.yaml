# anchor: boe-a-1978-31229-art-123
- id: m01-l04-q037
  prompt:
    es: "De acuerdo con el artículo 123 de la Constitución Española de 1978, el Tribunal Supremo, con jurisdicción en toda España, es el órgano jurisdiccional superior en todos los órdenes:"
  options:
  - id: a
    text:
      es: "Sin excepción alguna, incluidas las garantías constitucionales."
  - id: b
    text:
      es: "Salvo en el orden militar, que corresponde a sus propios tribunales."
  - id: c
    text:
      es: "Salvo lo dispuesto en materia de enjuiciamiento contable."
  - id: d
    correct: true
    text:
      es: "Salvo lo dispuesto en materia de garantías constitucionales."
  explanation:
    es: "El artículo 123.1 dice que el Tribunal Supremo es el órgano jurisdiccional superior en todos los órdenes, «salvo lo dispuesto en materia de garantías constitucionales». «Sin excepción alguna» borra esa salvedad. Con el orden militar, la salvedad es falsa: el artículo 55 LOPJ integra en el Tribunal Supremo la Sala Quinta, de lo Militar. El enjuiciamiento contable tampoco es salvedad: el artículo 49 de la LO 2/1982 hace las resoluciones del Tribunal de Cuentas susceptibles de recurso de casación y revisión ante el Tribunal Supremo."
  citation: "art. 123.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-12666-art-55
- id: m01-l04-q038
  prompt:
    es: "¿Cuántas Salas integran el Tribunal Supremo según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, y cuál es la Quinta?"
  options:
  - id: a
    text:
      es: "Cinco Salas, y la Quinta es la de lo Social."
  - id: b
    text:
      es: "Cuatro Salas, porque lo militar tiene sus propios tribunales."
  - id: c
    correct: true
    text:
      es: "Cinco Salas, y la Quinta es la de lo Militar."
  - id: d
    text:
      es: "Seis Salas, y la Quinta es la de lo Militar."
  explanation:
    es: "El artículo 55 LOPJ enumera cinco Salas: «Primera: De lo Civil. Segunda: De lo Penal. Tercera: De lo Contencioso-Administrativo. Cuarta: De lo Social. Quinta: De lo Militar». Una opción pone lo Social en la Quinta, cuando es la Cuarta. Otra niega la Sala de lo Militar. La de seis Salas da una Sala de más."
  citation: "art. 55 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-57
- id: m01-l04-q039
  prompt:
    es: "De acuerdo con el artículo 57 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la instrucción y enjuiciamiento de las causas contra los miembros del Gobierno y los Diputados y Senadores corresponde a:"
  options:
  - id: a
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: b
    text:
      es: "La Sala de Apelación de la Audiencia Nacional."
  - id: c
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia."
  - id: d
    text:
      es: "La Sala Segunda del Tribunal Constitucional."
  explanation:
    es: "El artículo 57.1 LOPJ atribuye a la Sala de lo Penal del Tribunal Supremo «la instrucción y enjuiciamiento de las causas contra el Presidente del Gobierno, Presidentes del Congreso y del Senado, [...] miembros del Gobierno, Diputados y Senadores». La Sala de Apelación de la Audiencia Nacional revisa resoluciones de su Sala de lo Penal (art. 64 bis). La Sala de lo Civil y Penal del Tribunal Superior de Justicia es un órgano autonómico. El Tribunal Constitucional no forma parte del Poder Judicial."
  citation: "art. 57.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-58
- id: m01-l04-q040
  prompt:
    es: "Según el artículo 58 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué Sala del Tribunal Supremo conoce en única instancia de los recursos contra actos y disposiciones del Consejo de Ministros?"
  options:
  - id: a
    text:
      es: "La Sala Primera, de lo Civil."
  - id: b
    correct: true
    text:
      es: "La Sala Tercera, de lo Contencioso-Administrativo."
  - id: c
    text:
      es: "La Sala Cuarta, de lo Social."
  - id: d
    text:
      es: "La Sala Segunda, de lo Penal."
  explanation:
    es: "El artículo 58 LOPJ dice que la Sala de lo Contencioso-administrativo del Tribunal Supremo conocerá «en única instancia, de los recursos contencioso-administrativos contra actos y disposiciones del Consejo de Ministros». El artículo 55 la numera como Sala Tercera. La Primera (Civil), la Cuarta (Social) y la Segunda (Penal) no conocen de recursos contra actos del Gobierno."
  citation: "art. 58 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-54
- id: m01-l04-q111
  prompt:
    es: "El Tribunal Supremo se compone de su Presidente, de los Presidentes de Sala y de los Magistrados que, para cada una de las Salas, determina:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "La ley."
  - id: c
    text:
      es: "El Consejo General del Poder Judicial."
  - id: d
    text:
      es: "La Sala de Gobierno del Tribunal Supremo."
  explanation:
    es: "El artículo 54 dice «los Magistrados que determine la ley para cada una de las Salas». Ni el Consejo de Ministros, ni el Consejo General del Poder Judicial, ni la Sala de Gobierno del propio Tribunal fijan la plantilla de cada Sala."
  citation: "art. 54 LOPJ"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1985-12666-art-55
- id: m01-l04-q112
  prompt:
    es: "Señale la opción correcta. Según el artículo 55 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la Sala Cuarta del Tribunal Supremo es la:"
  options:
  - id: a
    correct: true
    text:
      es: "De lo Social."
  - id: b
    text:
      es: "De lo Penal."
  - id: c
    text:
      es: "De lo Militar."
  - id: d
    text:
      es: "De lo Contencioso-Administrativo."
  explanation:
    es: "El artículo 55 numera Primera de lo Civil, Segunda de lo Penal, Tercera de lo Contencioso-Administrativo, Cuarta de lo Social y Quinta de lo Militar. Lo Penal corresponde a la Sala Segunda, lo Militar a la Quinta y lo Contencioso-Administrativo a la Sala Tercera."
  citation: "art. 55 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-55
- id: m01-l04-q113
  prompt:
    es: "¿Cuál de las siguientes Salas NO integra el Tribunal Supremo, según el artículo 55 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Sala de lo Militar."
  - id: b
    correct: true
    text:
      es: "La Sala de Apelación."
  - id: c
    text:
      es: "La Sala de lo Social."
  - id: d
    text:
      es: "La Sala de lo Penal."
  explanation:
    es: "El artículo 55 enumera las Salas de lo Civil, de lo Penal, de lo Contencioso-Administrativo, de lo Social y de lo Militar. La Sala de Apelación es una de las cuatro de la Audiencia Nacional (artículo 64.1)."
  citation: "art. 55 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-57
- id: m01-l04-q114
  prompt:
    es: "¿Cuál de las siguientes personas es instruida y enjuiciada por la Sala de lo Penal del Tribunal Supremo, según el artículo 57.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "Un Alcalde de una capital de provincia."
  - id: c
    text:
      es: "Un Magistrado de una Audiencia Provincial."
  - id: d
    text:
      es: "Un Presidente de Diputación Provincial."
  explanation:
    es: "El artículo 57.1 atribuye a la Sala de lo Penal la instrucción y el enjuiciamiento de las causas contra el Presidente del Gobierno, los Presidentes del Congreso y del Senado y los miembros del Gobierno, entre otros. Los Alcaldes, los Magistrados de Audiencia Provincial y los Presidentes de Diputación no están en esa lista."
  citation: "art. 57.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-57
- id: m01-l04-q115
  prompt:
    es: "Conforme al artículo 57.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la Sala de lo Penal del Tribunal Supremo instruye y enjuicia las causas contra el Presidente del Gobierno y también contra:"
  options:
  - id: a
    text:
      es: "Los Presidentes de las Audiencias Provinciales."
  - id: b
    text:
      es: "Los Alcaldes de los municipios de más de cien mil habitantes."
  - id: c
    correct: true
    text:
      es: "Los Presidentes del Congreso y del Senado."
  - id: d
    text:
      es: "Los Jueces de Paz."
  explanation:
    es: "El artículo 57.1 incluye a «los Presidentes del Congreso y del Senado». Los Presidentes de las Audiencias Provinciales, los Alcaldes y los Jueces de Paz no figuran entre los cargos que enumera."
  citation: "art. 57.1 LOPJ"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-58
- id: m01-l04-q116
  prompt:
    es: "¿Contra actos y disposiciones de cuál de los siguientes órganos conoce en única instancia la Sala de lo Contencioso-Administrativo del Tribunal Supremo, según el artículo 58 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Ayuntamientos de las capitales de provincia."
  - id: b
    text:
      es: "Las Audiencias Provinciales."
  - id: c
    text:
      es: "Los Tribunales Superiores de Justicia."
  - id: d
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 58 le atribuye los recursos en única instancia «contra actos y disposiciones del Consejo de Ministros, de las Comisiones Delegadas del Gobierno y del Consejo General del Poder Judicial». Los Ayuntamientos, las Audiencias Provinciales y los Tribunales Superiores de Justicia no están en esa lista."
  citation: "art. 58 LOPJ"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-53
- id: m01-l04-q145
  prompt:
    es: "Señale la respuesta correcta sobre quién puede tener el título de Supremo, de acuerdo con el artículo 53 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial:"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo y la Audiencia Nacional, que también tiene jurisdicción en toda España."
  - id: b
    correct: true
    text:
      es: "Solo el Tribunal Supremo, que tiene su sede en la villa de Madrid."
  - id: c
    text:
      es: "El Tribunal Supremo y el Tribunal Central de Instancia en el orden penal."
  - id: d
    text:
      es: "El Tribunal Supremo y los Tribunales Superiores de Justicia dentro de su Comunidad Autónoma."
  explanation:
    es: "El artículo 53 dice que el Tribunal Supremo tiene su sede en la villa de Madrid y que ningún otro órgano podrá tener el título de Supremo. La Audiencia Nacional también tiene jurisdicción en toda España, pero eso no le da el título. Los Tribunales Superiores de Justicia culminan la organización judicial en su Comunidad Autónoma y tampoco pueden llevarlo. Lo mismo vale para el Tribunal Central de Instancia en el orden penal."
  citation: "art. 53 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-1985-12666-art-30
- id: m01-l04-q041
  prompt:
    es: "De acuerdo con el artículo 30 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, a efectos judiciales el Estado se organiza territorialmente en:"
  options:
  - id: a
    text:
      es: "Municipios, Comarcas, Provincias y Comunidades Autónomas."
  - id: b
    text:
      es: "Partidos, Provincias, Comunidades Autónomas y Demarcaciones supraautonómicas."
  - id: c
    correct: true
    text:
      es: "Municipios, Partidos, Provincias y Comunidades Autónomas."
  - id: d
    text:
      es: "Municipios, Partidos y Provincias, sin otro nivel territorial superior."
  explanation:
    es: "El artículo 30 LOPJ dice: «El Estado se organiza territorialmente, a efectos judiciales, en Municipios, Partidos, Provincias y Comunidades Autónomas». Una opción cambia los Partidos por las Comarcas. Otra suprime el Municipio e inventa un nivel supraautonómico. Otra suprime la Comunidad Autónoma, que es el ámbito de los Tribunales Superiores de Justicia (art. 34)."
  citation: "art. 30 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-26
- id: m01-l04-q042
  prompt:
    es: "Señale la respuesta correcta sobre los Tribunales a los que la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, en su redacción vigente, atribuye el ejercicio de la potestad jurisdiccional:"
  options:
  - id: a
    text:
      es: "Entre ellos figuran los Juzgados de Primera Instancia e Instrucción."
  - id: b
    text:
      es: "Entre ellos figura el Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Entre ellos figura el Tribunal Central de Instancia."
  - id: d
    text:
      es: "Entre ellos figuran los Juzgados Centrales de Instrucción."
  explanation:
    es: "El artículo 26 LOPJ, en la redacción de la Ley Orgánica 1/2025, enumera: jueces y juezas de paz, Tribunales de Instancia, Audiencias Provinciales, Tribunales Superiores de Justicia, «Tribunal Central de Instancia», Audiencia Nacional y Tribunal Supremo. Los Juzgados de Primera Instancia e Instrucción y los Juzgados Centrales de Instrucción ya no figuran: se transformaron en Secciones de los Tribunales de Instancia y del Tribunal Central de Instancia. El Consejo General del Poder Judicial es el órgano de gobierno, no un Tribunal."
  citation: "art. 26 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1988-29622-art-1
- id: m01-l04-q043
  prompt:
    es: "¿Qué órganos tienen jurisdicción en toda España según la Ley 38/1988, de 28 de diciembre, de Demarcación y de Planta Judicial?"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo, la Audiencia Nacional y los Tribunales Superiores de Justicia."
  - id: b
    text:
      es: "El Tribunal Supremo y la Audiencia Nacional, y ningún otro órgano judicial."
  - id: c
    text:
      es: "El Tribunal Supremo, el Tribunal Central de Instancia y la Audiencia Provincial de Madrid."
  - id: d
    correct: true
    text:
      es: "El Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia."
  explanation:
    es: "El artículo 1 de la Ley 38/1988 dice: «El Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia tienen jurisdicción en toda España». Los Tribunales Superiores de Justicia la tienen en su Comunidad Autónoma (art. 2.1) y la Audiencia Provincial de Madrid en su provincia. La opción de «ningún otro órgano judicial» olvida el Tribunal Central de Instancia, que la Ley Orgánica 1/2025 añadió a esa lista."
  citation: "art. 1 Ley 38/1988"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-64
- id: m01-l04-q044
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las Salas que integran la Audiencia Nacional según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "De Apelación, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: b
    text:
      es: "De lo Civil, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: c
    text:
      es: "De lo Civil y Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: d
    text:
      es: "De Apelación, de lo Penal, de lo Contencioso-Administrativo y de lo Militar."
  explanation:
    es: "El artículo 64.1 LOPJ enumera las Salas de la Audiencia Nacional: «De Apelación. De lo Penal. De lo Contencioso-Administrativo. De lo Social». La opción con lo Civil y lo Penal por separado son cuatro de las Salas del Tribunal Supremo. La que une «lo Civil y Penal» son las tres Salas de un Tribunal Superior de Justicia (art. 72.1). Otra cambia lo Social por lo Militar, que solo tiene Sala en el Tribunal Supremo."
  citation: "art. 64.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-95
- id: m01-l04-q047
  prompt:
    es: "¿Cuál de las siguientes Secciones forma parte del Tribunal Central de Instancia según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Sección de lo Social."
  - id: b
    correct: true
    text:
      es: "La Sección de Vigilancia Penitenciaria."
  - id: c
    text:
      es: "La Sección de lo Mercantil."
  - id: d
    text:
      es: "La Sección de Familia, Infancia y Capacidad."
  explanation:
    es: "El artículo 95 LOPJ da al Tribunal Central de Instancia las Secciones de Instrucción, de lo Penal, de Menores, «de Vigilancia Penitenciaria» y de lo Contencioso-Administrativo. Las Secciones de lo Social, de lo Mercantil y de Familia, Infancia y Capacidad pueden existir en los Tribunales de Instancia (art. 84.2), pero no en el Tribunal Central."
  citation: "art. 95 LOPJ"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2025-76-dt-primera
- id: m01-l04-q048
  prompt:
    es: "Según la disposición transitoria primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, ¿qué día se transformaron en Secciones los Juzgados no comprendidos en las dos primeras fases?"
  options:
  - id: a
    text:
      es: "El 1 de julio de 2025."
  - id: b
    correct: true
    text:
      es: "El 31 de diciembre de 2025."
  - id: c
    text:
      es: "El 1 de octubre de 2025."
  - id: d
    text:
      es: "El 3 de abril de 2025."
  explanation:
    es: "La disposición transitoria primera de la Ley Orgánica 1/2025 fija tres fases: el 1 de julio de 2025, el 1 de octubre de 2025 y, para «los restantes Juzgados, no comprendidos en los supuestos anteriores», el 31 de diciembre de 2025. El 1 de julio y el 1 de octubre son las dos primeras fases. El 3 de abril de 2025 no es ninguna fase: es cuando entró en vigor la mayor parte de la ley, a los tres meses de su publicación (disposición final trigésima octava)."
  citation: "disposición transitoria primera LO 1/2025"
  difficulty: 3
  tags:
  - "fecha"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q049
  prompt:
    es: "Los Jueces de Paz y sus sustitutos, nombrados por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente, lo son por:"
  options:
  - id: a
    text:
      es: "Un periodo de tres años."
  - id: b
    text:
      es: "Un periodo de cinco años."
  - id: c
    text:
      es: "Un periodo de seis años."
  - id: d
    correct: true
    text:
      es: "Un periodo de cuatro años."
  explanation:
    es: "El artículo 101.1 LOPJ dice que los Jueces de Paz y sus sustitutos «serán nombrados para un periodo de cuatro años por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente». Tres, cinco y seis años no son el periodo del artículo; los cinco años son el mandato del Consejo General del Poder Judicial (art. 122.3 CE)."
  citation: "art. 101.1 LOPJ"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q050
  prompt:
    es: "¿Qué órgano nombra a los Jueces de Paz y a sus sustitutos según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El Pleno del Ayuntamiento respectivo."
  - id: b
    correct: true
    text:
      es: "La Sala de Gobierno del Tribunal Superior de Justicia correspondiente."
  - id: c
    text:
      es: "La Comisión Permanente del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "El Presidente de la Audiencia Provincial."
  explanation:
    es: "El artículo 101.1 LOPJ dice que serán nombrados «por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente». El Pleno del Ayuntamiento los elige (art. 101.2), pero no los nombra. Ni la Comisión Permanente del Consejo ni el Presidente de la Audiencia Provincial intervienen en el nombramiento."
  citation: "art. 101.1 LOPJ"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q055
  prompt:
    es: "Según el artículo 101 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué órgano municipal elige a los Jueces de Paz y a sus sustitutos, y con qué mayoría?"
  options:
  - id: a
    text:
      es: "La Junta de Gobierno Local, por mayoría absoluta de sus miembros, a propuesta del Alcalde."
  - id: b
    text:
      es: "El Pleno del Ayuntamiento, por mayoría simple de los concejales presentes en la sesión."
  - id: c
    correct: true
    text:
      es: "El Pleno, por mayoría absoluta de sus miembros."
  - id: d
    text:
      es: "El Pleno del Ayuntamiento, por mayoría de tres quintos de sus miembros de derecho."
  explanation:
    es: "El artículo 101.2 LOPJ dice que los Jueces de Paz y sus sustitutos «serán elegidos por el Pleno del Ayuntamiento, con el voto favorable de la mayoría absoluta de sus miembros». La elección no corresponde a la Junta de Gobierno Local. Las opciones de mayoría simple de los presentes y de tres quintos cambian la mayoría que fija el artículo. El nombramiento posterior es de la Sala de Gobierno del Tribunal Superior de Justicia (art. 101.1)."
  citation: "art. 101.2 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1985-12666-art-80
- id: m01-l04-q056
  prompt:
    es: "Según el artículo 80 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿dónde tienen su sede las Audiencias Provinciales?"
  options:
  - id: a
    text:
      es: "En la capital del partido judicial con mayor número de habitantes de la provincia."
  - id: b
    text:
      es: "En la capital del partido judicial que designe la Sala de Gobierno del Tribunal Superior de Justicia."
  - id: c
    text:
      es: "En la localidad de la provincia que fije el Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "En la capital de la provincia."
  explanation:
    es: "El artículo 80.1 LOPJ dice que las Audiencias Provinciales «tendrán su sede en la capital de la provincia, de la que tomarán su nombre». El artículo no atiende a la población del partido judicial ni deja la sede a una designación de la Sala de Gobierno del Tribunal Superior de Justicia o del Consejo General del Poder Judicial. Lo que permite fuera de la capital son Secciones de la Audiencia, a las que se adscriben uno o varios partidos judiciales (art. 80.2)."
  citation: "art. 80.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-63
- id: m01-l04-q117
  prompt:
    es: "Señale la opción correcta. De acuerdo con el artículo 63.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Presidente de la Audiencia Nacional tiene la consideración de:"
  options:
  - id: a
    text:
      es: "Magistrado del Tribunal Constitucional."
  - id: b
    text:
      es: "Presidente de un Tribunal Superior de Justicia."
  - id: c
    text:
      es: "Vocal del Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "Presidente de Sala del Tribunal Supremo."
  explanation:
    es: "El artículo 63.2 dice que «tendrá la consideración de Presidente de Sala del Tribunal Supremo». No equivale a Magistrado del Tribunal Constitucional, a Presidente de un Tribunal Superior ni a Vocal del Consejo."
  citation: "art. 63.2 LOPJ"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-1985-12666-art-65
- id: m01-l04-q118
  prompt:
    es: "Conforme al artículo 65.1.º de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué órgano enjuicia los delitos cometidos fuera del territorio nacional cuando conforme a las leyes o tratados corresponda a los Tribunales españoles?"
  options:
  - id: a
    correct: true
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  - id: b
    text:
      es: "La Sala Segunda del Tribunal Supremo."
  - id: c
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia de Madrid."
  - id: d
    text:
      es: "La Audiencia Provincial de Madrid."
  explanation:
    es: "El artículo 65.1.º atribuye a la Sala de lo Penal de la Audiencia Nacional el enjuiciamiento de los delitos cometidos fuera del territorio nacional, cuando conforme a las leyes o a los tratados corresponda su enjuiciamiento a los Tribunales españoles. La Sala Segunda del Supremo, la del Tribunal Superior de Madrid y la Audiencia Provincial de Madrid no tienen esa competencia."
  citation: "art. 65.1.º LOPJ"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-70
- id: m01-l04-q119
  prompt:
    es: "Señale la opción correcta. Conforme al artículo 70 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Tribunal Superior de Justicia culmina la organización judicial de su Comunidad Autónoma, sin perjuicio de la jurisdicción de:"
  options:
  - id: a
    text:
      es: "La Audiencia Nacional."
  - id: b
    correct: true
    text:
      es: "El Tribunal Supremo."
  - id: c
    text:
      es: "El Tribunal Constitucional."
  - id: d
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 70 dice «sin perjuicio de la jurisdicción que corresponde al Tribunal Supremo». La Audiencia Nacional y el Tribunal Constitucional no son el órgano que culmina la organización por encima de los Tribunales Superiores, y el Consejo General del Poder Judicial es el órgano de gobierno, no un órgano jurisdiccional."
  citation: "art. 70 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1985-12666-art-72
- id: m01-l04-q121
  prompt:
    es: "Señale la opción correcta. Conforme al artículo 72.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Presidente del Tribunal Superior de Justicia es también el Presidente de:"
  options:
  - id: a
    text:
      es: "Su Sala de lo Contencioso-Administrativo."
  - id: b
    correct: true
    text:
      es: "Su Sala de lo Civil y Penal."
  - id: c
    text:
      es: "Su Sala de lo Social."
  - id: d
    text:
      es: "La Audiencia Provincial de la capital de la Comunidad."
  explanation:
    es: "El artículo 72.2 dice que será Presidente «también de su Sala de lo Civil y Penal». No preside las Salas de lo Contencioso-Administrativo ni de lo Social, ni la Audiencia Provincial de la capital."
  citation: "art. 72.2 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
