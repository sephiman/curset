# anchor: boe-a-2017-12902-art-16
- id: m03-l04-q088
  prompt:
    es: "¿Cuál de las siguientes operaciones de un ministerio es un contrato de suministro según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El arrendamiento de un local para instalar una oficina de atención al público."
  - id: b
    correct: true
    text:
      es: "El arrendamiento, sin opción de compra, de vehículos para su parque móvil."
  - id: c
    text:
      es: "La reparación y el mantenimiento periódico de sus vehículos oficiales."
  - id: d
    text:
      es: "La adquisición de valores negociables emitidos por una sociedad."
  explanation:
    es: "El artículo 16.1 LCSP incluye en el suministro «el arrendamiento, con o sin opción de compra, de productos o bienes muebles», y los vehículos son bienes muebles. Un local es un bien inmueble, que el suministro no comprende. Reparar y mantener vehículos es una prestación de hacer, propia del contrato de servicios (art. 17). Los contratos relativos a valores negociables no son suministro (art. 16.2)."
  citation: "art. 16.1 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-101
- id: m03-l04-q089
  prompt:
    es: "Para que las modificaciones de un contrato de obras, suministros o servicios se tengan en cuenta en su valor estimado, deben estar previstas:"
  options:
  - id: a
    text:
      es: "En la oferta del adjudicatario, aunque el pliego no las recoja."
  - id: b
    text:
      es: "En el documento de formalización, una vez adjudicado el contrato."
  - id: c
    correct: true
    text:
      es: "En el pliego de cláusulas administrativas particulares o en el anuncio de licitación."
  - id: d
    text:
      es: "En los informes del responsable del contrato durante la ejecución."
  explanation:
    es: "El artículo 101.2.c) LCSP computa las modificaciones cuando «se haya previsto en el pliego de cláusulas administrativas particulares o en el anuncio de licitación la posibilidad de que el contrato sea modificado»; el valor estimado es entonces el importe máximo con todas las modificaciones al alza previstas. La oferta del adjudicatario, el documento de formalización y los informes del responsable del contrato llegan después de calcular el valor estimado, que se fija antes de licitar."
  citation: "art. 101.2 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q091
  prompt:
    es: "En los contratos que celebran las Administraciones Públicas, ¿quién debe constituir la garantía definitiva, salvo que el órgano de contratación le exima?"
  options:
  - id: a
    text:
      es: "Todos los licitadores cuyas ofertas hayan sido admitidas."
  - id: b
    correct: true
    text:
      es: "El licitador que haya presentado la mejor oferta."
  - id: c
    text:
      es: "Los tres licitadores con mayor puntuación."
  - id: d
    text:
      es: "Solo el licitador cuya oferta resulte anormal."
  explanation:
    es: "El artículo 107.1 LCSP obliga a los licitadores que «presenten las mejores ofertas de conformidad con lo dispuesto en el artículo 145» a constituir la garantía definitiva. No la constituyen todos los licitadores admitidos ni los tres mejor puntuados. La oferta en presunción de anormalidad solo puede justificar una garantía complementaria (art. 107.2), no desplaza la obligación al licitador que la presentó."
  citation: "art. 107.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-22
- id: m03-l04-q092
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿a qué entidades se aplica el umbral de regulación armonizada de 140.000 euros en los contratos de servicios?"
  options:
  - id: a
    text:
      es: "A todas las entidades del sector público que tengan la condición de poder adjudicador, sean o no Administración Pública."
  - id: b
    text:
      es: "A las comunidades autónomas, a las entidades locales y a los organismos públicos que dependen de unas y otras."
  - id: c
    correct: true
    text:
      es: "A la Administración General del Estado, sus organismos autónomos y las Entidades Gestoras y Servicios Comunes de la Seguridad Social."
  - id: d
    text:
      es: "A las entidades públicas empresariales y a las sociedades mercantiles del sector público estatal y autonómico."
  explanation:
    es: "El artículo 22.1.a) LCSP fija 140.000 euros «cuando los contratos hayan de ser adjudicados por la Administración General del Estado, sus Organismos Autónomos, o las Entidades Gestoras y Servicios Comunes de la Seguridad Social». Para las demás entidades del sector público el umbral es de 216.000 euros (art. 22.1.b), así que no rige para todos los poderes adjudicadores. Las comunidades autónomas, las entidades locales y sus organismos, y las entidades públicas empresariales y sociedades mercantiles, están entre esas demás entidades."
  citation: "art. 22.1.a) LCSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "órgano"
# anchor: boe-a-2017-12902-art-131
- id: m03-l04-q101
  prompt:
    es: "De acuerdo con el artículo 131.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la adjudicación de los contratos de las Administraciones Públicas se realizará, ordinariamente, utilizando:"
  options:
  - id: a
    correct: true
    text:
      es: "Una pluralidad de criterios basados en la mejor relación calidad-precio y el procedimiento abierto o el restringido."
  - id: b
    text:
      es: "Una pluralidad de criterios basados en la mejor relación calidad-precio y el procedimiento abierto o el negociado."
  - id: c
    text:
      es: "Una pluralidad de criterios basados en la mejor relación calidad-precio y el diálogo competitivo o la licitación con negociación."
  - id: d
    text:
      es: "Una pluralidad de criterios basados en la mejor relación coste-eficacia y el procedimiento abierto o el restringido."
  explanation:
    es: "El artículo 131.2 dice que la adjudicación se realizará «ordinariamente utilizando una pluralidad de criterios de adjudicación basados en el principio de mejor relación calidad-precio, y utilizando el procedimiento abierto o el procedimiento restringido». El procedimiento negociado, el diálogo competitivo y la licitación con negociación solo caben en los supuestos tasados de los artículos 167 y 168, no con carácter ordinario. La mejor relación coste-eficacia es la alternativa que el artículo 145.1 admite previa justificación en el expediente, no la regla ordinaria."
  citation: "art. 131.2 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "concepto"
# anchor: boe-a-2017-12902-art-131
- id: m03-l04-q102
  prompt:
    es: "¿Por qué procedimiento se adjudican, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos de concesión de servicios especiales del Anexo IV?"
  options:
  - id: a
    text:
      es: "Se adjudican mediante el procedimiento abierto."
  - id: b
    correct: true
    text:
      es: "Se adjudican mediante el procedimiento restringido."
  - id: c
    text:
      es: "Se adjudican mediante la licitación con negociación."
  - id: d
    text:
      es: "Se adjudican mediante el procedimiento abierto simplificado."
  explanation:
    es: "El artículo 131.2 fija como ordinarios el procedimiento abierto y el restringido, «salvo los contratos de concesión de servicios especiales del Anexo IV, que se adjudicarán mediante este último procedimiento», es decir, el restringido. El abierto es la otra vía ordinaria, que para estas concesiones queda excluida. La licitación con negociación exige alguno de los supuestos del artículo 167. El abierto simplificado solo cabe en obras, suministro y servicios (artículo 159.1), no en concesiones."
  citation: "art. 131.2 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2017-12902-art-145
- id: m03-l04-q103
  prompt:
    es: "Según el artículo 145.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, previa justificación en el expediente, los contratos se podrán adjudicar con arreglo a criterios basados en:"
  options:
  - id: a
    text:
      es: "La mejor relación calidad-precio, evaluada solo con criterios cualitativos de carácter medioambiental o social del contrato."
  - id: b
    text:
      es: "La oferta económicamente más ventajosa, sin necesidad de ponderar el precio ni el coste del contrato."
  - id: c
    correct: true
    text:
      es: "La mejor relación coste-eficacia, sobre la base del precio o coste, como el cálculo del coste del ciclo de vida."
  - id: d
    text:
      es: "El menor plazo de ejecución ofertado, sobre la base de la fecha de entrega de toda la prestación."
  explanation:
    es: "El párrafo segundo del artículo 145.1 dice: «Previa justificación en el expediente, los contratos se podrán adjudicar con arreglo a criterios basados en un planteamiento que atienda a la mejor relación coste-eficacia, sobre la base del precio o coste, como el cálculo del coste del ciclo de vida». La mejor relación calidad-precio es la regla general y no necesita esa justificación; además, el artículo 145.2 la evalúa con criterios económicos y cualitativos, no solo cualitativos. La opción de la oferta más ventajosa sin ponderar precio ni coste contradice el texto, que se basa precisamente en el precio o el coste. El menor plazo de ejecución no es el criterio que el artículo prevé para este supuesto."
  citation: "art. 145.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2017-12902-art-135
- id: m03-l04-q104
  prompt:
    es: "Según el artículo 135.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué procedimiento queda exceptuado de la publicación del anuncio de licitación en el perfil de contratante?"
  options:
  - id: a
    text:
      es: "Solo el procedimiento abierto simplificado."
  - id: b
    text:
      es: "Solo el procedimiento restringido no armonizado."
  - id: c
    text:
      es: "Solo la licitación con negociación."
  - id: d
    correct: true
    text:
      es: "Solo el procedimiento negociado sin publicidad."
  explanation:
    es: "El artículo 135.1 dice que el anuncio de licitación de los contratos de las Administraciones Públicas, «a excepción de los procedimientos negociados sin publicidad, se publicará en el perfil de contratante». El abierto simplificado publica su anuncio precisamente en el perfil de contratante (artículo 159.2). El restringido sigue la regla general del artículo 135.1. La licitación con negociación exige en todo caso anuncio de licitación en la forma del artículo 135 (artículo 169.1)."
  citation: "art. 135.1 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2017-12902-art-135
- id: m03-l04-q105
  prompt:
    es: "De acuerdo con el artículo 135.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el anuncio de un procedimiento abierto de la Administración General del Estado, no sujeto a regulación armonizada, se publicará:"
  options:
  - id: a
    correct: true
    text:
      es: "En el perfil de contratante y, además, en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "Únicamente en el perfil de contratante del órgano de contratación."
  - id: c
    text:
      es: "En el «Boletín Oficial del Estado» y en el boletín oficial de la provincia."
  - id: d
    text:
      es: "En el perfil de contratante y, además, en el «Diario Oficial de la Unión Europea»."
  explanation:
    es: "El artículo 135.1 manda publicar el anuncio en el perfil de contratante y añade que, en los contratos celebrados por la Administración General del Estado, «el anuncio de licitación se publicará además en el \"Boletín Oficial del Estado\"». Publicar solo en el perfil contradice ese «además». El boletín de la provincia no es la segunda publicación de la Administración General del Estado: la segunda es el «Boletín Oficial del Estado», y además omite el perfil. El «Diario Oficial de la Unión Europea» solo se añade cuando el contrato está sujeto a regulación armonizada, según el párrafo segundo, y el contrato de la pregunta no lo está."
  citation: "art. 135.1 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-157
- id: m03-l04-q107
  prompt:
    es: "Según el artículo 157.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando en el procedimiento abierto se utilice una pluralidad de criterios de adjudicación, los licitadores presentarán la proposición:"
  options:
  - id: a
    text:
      es: "En un único sobre o archivo electrónico."
  - id: b
    text:
      es: "En tres sobres o archivos electrónicos."
  - id: c
    correct: true
    text:
      es: "En dos sobres o archivos electrónicos distintos."
  - id: d
    text:
      es: "En tantos sobres como criterios haya."
  explanation:
    es: "El artículo 157.2 dice que, con una pluralidad de criterios, «los licitadores deberán presentar la proposición en dos sobres o archivos electrónicos»: uno con lo valorable por juicio de valor y otro con lo valorable mediante fórmulas. Un único sobre mezclaría los dos grupos de documentación que el apartado manda presentar por separado. Tres sobres, o uno por criterio, no corresponden a las dos categorías de criterios que el apartado distingue: juicio de valor y fórmulas."
  citation: "art. 157.2 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-156
- id: m03-l04-q108
  prompt:
    es: "De acuerdo con el artículo 156.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el procedimiento abierto de un contrato de obras sujeto a regulación armonizada, el plazo general de presentación de proposiciones:"
  options:
  - id: a
    text:
      es: "No será inferior a treinta días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: b
    text:
      es: "No será inferior a veintiséis días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: c
    text:
      es: "No será inferior a cuarenta días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: d
    correct: true
    text:
      es: "No será inferior a treinta y cinco días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  explanation:
    es: "El artículo 156.2 fija un plazo que «no será inferior a treinta y cinco días, para los contratos de obras, suministros y servicios», contado desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea. Los treinta días son el plazo de las concesiones de obras y servicios en el mismo apartado. Los veintiséis días son el mínimo de las obras no sujetas a regulación armonizada (artículo 156.6). Los cuarenta días no figuran en el artículo."
  citation: "art. 156.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-156
- id: m03-l04-q109
  prompt:
    es: "Según el artículo 156.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿desde cuándo se cuenta el plazo general de proposiciones en un procedimiento abierto de suministro sujeto a regulación armonizada?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea."
  - id: b
    text:
      es: "Desde la publicación del anuncio de licitación en el «Diario Oficial de la Unión Europea»."
  - id: c
    text:
      es: "Desde el día siguiente al de la publicación del anuncio de licitación en el perfil de contratante."
  - id: d
    text:
      es: "Desde el día siguiente a la publicación del anuncio de licitación en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 156.2 cuenta el plazo «desde la fecha de envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea». No se cuenta desde la publicación en el Diario Oficial, que es posterior al envío. El día siguiente a la publicación en el perfil es el inicio del cómputo en los contratos no sujetos a regulación armonizada (artículo 156.6). La publicación en el «Boletín Oficial del Estado» no marca el inicio de ningún plazo en este artículo."
  citation: "art. 156.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-156
- id: m03-l04-q110
  prompt:
    es: "Según el artículo 156.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en un contrato de servicios de una Administración Pública no sujeto a regulación armonizada, el plazo de proposiciones del procedimiento abierto:"
  options:
  - id: a
    text:
      es: "No será inferior a veintiséis días, contados desde el día siguiente al de la publicación del anuncio en el perfil de contratante."
  - id: b
    correct: true
    text:
      es: "No será inferior a quince días, contados desde el día siguiente al de la publicación del anuncio en el perfil de contratante."
  - id: c
    text:
      es: "No será inferior a diez días hábiles, contados desde el día siguiente al de la publicación del anuncio en el perfil de contratante."
  - id: d
    text:
      es: "No será inferior a quince días, contados desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  explanation:
    es: "El artículo 156.6 dice que el plazo «no será inferior a quince días, contados desde el día siguiente al de la publicación del anuncio de licitación del contrato en el perfil de contratante». Los veintiséis días son el mínimo de las obras y las concesiones, no de los servicios. Los diez días hábiles son el plazo de la tramitación del artículo 159.6. El envío a la Oficina de Publicaciones de la Unión Europea es el inicio del cómputo en los contratos sujetos a regulación armonizada."
  citation: "art. 156.6 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-156
- id: m03-l04-q111
  prompt:
    es: "En el procedimiento abierto de un contrato de obras de una Administración Pública no sujeto a regulación armonizada, el plazo de presentación de proposiciones será, como mínimo, de:"
  options:
  - id: a
    text:
      es: "Quince días desde el día siguiente al de la publicación en el perfil de contratante."
  - id: b
    text:
      es: "Veinte días desde el día siguiente al de la publicación en el perfil de contratante."
  - id: c
    correct: true
    text:
      es: "Veintiséis días desde el día siguiente al de la publicación en el perfil de contratante."
  - id: d
    text:
      es: "Treinta y cinco días desde el día siguiente al de la publicación en el perfil de contratante."
  explanation:
    es: "El artículo 156.6 fija con carácter general quince días y añade: «En los contratos de obras y de concesión de obras y concesión de servicios, el plazo será, como mínimo, de veintiséis días». Los quince días valen para suministros y servicios, no para obras. Los veinte días son el mínimo de las obras en el abierto simplificado (artículo 159.3). Los treinta y cinco días son el plazo de los contratos sujetos a regulación armonizada (artículo 156.2)."
  citation: "art. 156.6 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-156
- id: m03-l04-q112
  prompt:
    es: "Una Administración Pública publica en su perfil de contratante, el jueves 1 de octubre de 2026, un procedimiento abierto de obras no sujeto a regulación armonizada. Si fija el plazo mínimo legal, ¿cuál es el último día para presentar proposiciones?"
  options:
  - id: a
    text:
      es: "El viernes 16 de octubre de 2026."
  - id: b
    text:
      es: "El miércoles 21 de octubre de 2026."
  - id: c
    text:
      es: "El lunes 26 de octubre de 2026."
  - id: d
    correct: true
    text:
      es: "El martes 27 de octubre de 2026."
  explanation:
    es: "En obras no sujetas a regulación armonizada el plazo es, como mínimo, de veintiséis días desde el día siguiente al de la publicación (artículo 156.6). Son días naturales, porque la ley no dice que sean hábiles (disposición adicional duodécima). El cómputo empieza el viernes 2 de octubre; el vigésimo sexto día es el martes 27 de octubre, que es hábil. El lunes 12 de octubre, fiesta nacional, cuenta como un día más. El lunes 26 de octubre sale de contar desde el mismo día de la publicación. El viernes 16 de octubre aplica los quince días de suministros y servicios, y el miércoles 21 de octubre, los veinte días del abierto simplificado de obras."
  citation: "art. 156.6 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-158
- id: m03-l04-q113
  prompt:
    es: "En un procedimiento abierto cuyo único criterio de adjudicación es el precio, las proposiciones se abren el martes 3 de febrero de 2026. Sin ofertas anormalmente bajas, ¿hasta qué día puede adjudicarse el contrato?"
  options:
  - id: a
    text:
      es: "Hasta el martes 17 de febrero de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles 18 de febrero de 2026."
  - id: c
    text:
      es: "Hasta el martes 24 de febrero de 2026."
  - id: d
    text:
      es: "Hasta el martes 3 de marzo de 2026."
  explanation:
    es: "Con el precio como único criterio, la adjudicación debe recaer «en el plazo máximo de quince días a contar desde el siguiente al de apertura de las proposiciones» (artículo 158.1). Son días naturales (disposición adicional duodécima). El cómputo empieza el miércoles 4 de febrero y el decimoquinto día es el miércoles 18 de febrero. El martes 17 de febrero sale de contar desde el mismo día de la apertura. El martes 24 de febrero cuenta quince días hábiles, y el martes 3 de marzo aplica un mes."
  citation: "art. 158.1 LCSP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-158
- id: m03-l04-q114
  prompt:
    es: "De acuerdo con el artículo 158.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando en el procedimiento abierto deba tenerse en cuenta una pluralidad de criterios, el plazo máximo para adjudicar será:"
  options:
  - id: a
    text:
      es: "De quince días desde el siguiente al de la apertura de las proposiciones, sin excepción."
  - id: b
    correct: true
    text:
      es: "De dos meses desde la apertura de las proposiciones, salvo que el pliego establezca otro."
  - id: c
    text:
      es: "De un mes desde la apertura de las proposiciones, salvo que el pliego establezca otro."
  - id: d
    text:
      es: "De dos meses desde el fin del plazo de presentación, sin que el pliego pueda alterarlo."
  explanation:
    es: "El artículo 158.2 dice que, con una pluralidad de criterios, «el plazo máximo para efectuar la adjudicación será de dos meses a contar desde la apertura de las proposiciones, salvo que se hubiese establecido otro en el pliego de cláusulas administrativas particulares». Quince días es el plazo del artículo 158.1, cuando el único criterio es el precio, y «sin excepción» contradice la salvedad del pliego. Un mes no es el plazo que fija el apartado: el apartado dice dos. El cómputo empieza con la apertura, no con el fin del plazo de presentación, y «sin que el pliego pueda alterarlo» contradice «salvo que se hubiese establecido otro»."
  citation: "art. 158.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-158
- id: m03-l04-q115
  prompt:
    es: "Según el artículo 158.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué plazo debe adjudicarse un abierto con el solo criterio del menor coste del ciclo de vida, sin plazo en el pliego?"
  options:
  - id: a
    text:
      es: "Quince días desde el siguiente al de apertura de las proposiciones."
  - id: b
    text:
      es: "Un mes desde la apertura de las proposiciones."
  - id: c
    correct: true
    text:
      es: "Dos meses a contar desde la apertura de las proposiciones."
  - id: d
    text:
      es: "Quince días hábiles desde la apertura de las proposiciones."
  explanation:
    es: "El artículo 158.2 aplica los dos meses a contar desde la apertura de las proposiciones también cuando, «utilizándose un único criterio sea este el del menor coste del ciclo de vida». Quince días desde el siguiente a la apertura es el plazo del artículo 158.1, que exige que el único criterio sea el precio, y aquí el criterio es otro. Un mes no es el plazo del apartado: el apartado dice dos meses. Quince días hábiles es la ampliación del artículo 158.3 para el trámite del artículo 149.4, no un plazo de adjudicación propio."
  citation: "art. 158.2 LCSP"
  difficulty: 3
  tags:
