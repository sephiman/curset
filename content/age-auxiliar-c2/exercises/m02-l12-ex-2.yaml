# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q033
  prompt:
    es: "¿Quién desarrolló en 1973 en Xerox PARC la tecnología Ethernet, que es hoy probablemente la tecnología de red dominante en Internet?"
  options:
  - id: a
    text:
      es: "Ray Tomlinson, que escribió el software básico de correo"
  - id: b
    text:
      es: "David Clark, que implementó TCP para el Xerox Alto y el IBM PC"
  - id: c
    correct: true
    text:
      es: "Bob Metcalfe"
  - id: d
    text:
      es: "Vint Cerf, que dirigió el equipo de Stanford de la especificación de TCP"
  explanation:
    es: "Bob Metcalfe desarrolló Ethernet en Xerox PARC en 1973. Clark, del MIT, creó una implementación compacta de TCP para el Xerox Alto y el IBM PC. Tomlinson escribió en 1972 el software básico de correo electrónico. Cerf dirigió el equipo de Stanford que produjo la especificación de TCP."
  citation: "fuente: `isoc-historia-internet.html`; «Proving the Ideas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q034
  prompt:
    es: "¿Cuál de las siguientes decisiones críticas adoptó NSF en 1985, con Dennis Jennings al frente del programa NSFNET, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "Que cada red regional usaría el protocolo que prefiriera"
  - id: b
    text:
      es: "Que NCP seguiría siendo el protocolo del programa NSFNET"
  - id: c
    correct: true
    text:
      es: "Que TCP/IP sería obligatorio en el programa NSFNET"
  - id: d
    text:
      es: "Que ARPANET se desmantelaría ese mismo año"
  explanation:
    es: "NSF decidió que TCP/IP sería obligatorio en el programa NSFNET. NCP se había sustituido por TCP/IP en ARPANET en 1983, y NSF exigió TCP/IP. ARPANET no se desmanteló hasta 1990. La decisión fue justo la contraria: TCP/IP era obligatorio, no optativo."
  citation: "fuente: `isoc-historia-internet.html`; «He worked with the community to help NSF make a critical decision – that TCP/IP would be mandatory for the NSFNET program.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q035
  prompt:
    es: "¿Quién inventó el Sistema de Nombres de Dominio (DNS), que permitió resolver de forma escalable nombres de host jerárquicos en direcciones de Internet?"
  options:
  - id: a
    text:
      es: "Vint Cerf, de la Universidad de Stanford"
  - id: b
    text:
      es: "Elizabeth Feinler, del Network Information Center del SRI"
  - id: c
    correct: true
    text:
      es: "Paul Mockapetris, de USC/ISI"
  - id: d
    text:
      es: "Jon Postel, editor de las RFC"
  explanation:
    es: "Paul Mockapetris, de USC/ISI, inventó el DNS, que resolvía nombres de host jerárquicos en direcciones de Internet. Cerf dirigió el equipo de Stanford que especificó TCP. Feinler dirigía el centro del SRI que mantenía las tablas de nombres y direcciones, antes del DNS. Postel fue editor de las RFC."
  citation: "fuente: `isoc-historia-internet.html`; «and the Domain Name System (DNS) was invented by Paul Mockapetris of USC/ISI.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q036
  prompt:
    es: "¿Cuál de los siguientes cambios llevó a sustituir la tabla única de hosts, con sus nombres y direcciones, por el DNS, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "La primera demostración pública de ARPANET en 1972"
  - id: b
    correct: true
    text:
      es: "El paso a muchas redes (LAN) gestionadas de forma independiente"
  - id: c
    text:
      es: "La creación de MILNET para las necesidades operativas"
  - id: d
    text:
      es: "El paso de NCP a TCP/IP en ARPANET en 1983"
  explanation:
    es: "La historia dice que, con el crecimiento de Internet, los equipos recibieron nombres y que al principio era viable mantener una sola tabla con todos los hosts, nombres y direcciones; dejó de serlo cuando se pasó a tener «un gran número de redes (por ejemplo, LAN) gestionadas de forma independiente», y de ahí el DNS. La demostración pública de ARPANET en octubre de 1972 fue una exhibición de la nueva tecnología, no un cambio de escala. MILNET nace al dividir ARPANET en comunidades militar y civil, que la historia sitúa tras el paso a TCP/IP. Y el paso de NCP a TCP/IP el 1 de enero de 1983 es la transición del protocolo entre equipos, otro hito distinto."
  citation: "fuente: `isoc-historia-internet.html`; «The shift to having a large number of independently managed networks (e.g., LANs) meant that having a single table of hosts was no longer feasible, and the Domain Name System (DNS) was invented by Paul Mockapetris of USC/ISI.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q037
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a la web 4.0 según la Comunicación de la Comisión Europea de 2023 sobre la web 4.0 y los mundos virtuales?"
  options:
  - id: a
    text:
      es: "Entorno persistente e inmersivo, basado en 3D y realidad aumentada, que mezcla mundos físicos y digitales"
  - id: b
    text:
      es: "Capacidades semánticas que enlazan datos entre páginas web, aplicaciones y archivos de la tercera generación"
  - id: c
    correct: true
    text:
      es: "Cuarta generación prevista, con inteligencia artificial avanzada e internet de las cosas integrados con los entornos digitales y reales"
  - id: d
    text:
      es: "Tercera generación, abierta y descentralizada, en la que el usuario controla el valor económico de sus datos"
  explanation:
    es: "La web 4.0, generación prevista de la World Wide Web posterior a la web 3.0, integra plenamente la inteligencia artificial y ambiental avanzada, el internet de las cosas, la cadena de bloques, los mundos virtuales y los entornos digitales y reales. La descripción abierta y descentralizada con control de datos por el usuario es la de la web 3.0. El entorno persistente e inmersivo con 3D y realidad aumentada es la definición de los mundos virtuales, no de una generación de la web. Las capacidades semánticas que enlazan datos son un rasgo de la web 3.0, no de la web 4.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q038
  prompt:
    es: "¿Cuál de los siguientes rasgos atribuye la Comunicación de la Comisión Europea de 2023 a la web 3.0, tercera generación de la World Wide Web?"
  options:
  - id: a
    text:
      es: "Integra plenamente objetos digitales y reales en experiencias intuitivas e inmersivas para los usuarios"
  - id: b
    text:
      es: "Usa inteligencia artificial y ambiental avanzada integrada en el entorno físico"
  - id: c
    text:
      es: "Se basa en mundos virtuales persistentes con 3D y realidad aumentada"
  - id: d
    correct: true
    text:
      es: "Es abierta y descentralizada, y los usuarios controlan el valor económico de sus datos"
  explanation:
    es: "La web 3.0 se caracteriza por ser abierta y descentralizada, con usuarios que controlan y materializan el valor económico de sus datos. La inteligencia artificial y ambiental avanzada es un rasgo que la Comunicación da a la web 4.0. La integración plena de objetos y entornos digitales y reales corresponde a la web 4.0. Los mundos virtuales con 3D y realidad aumentada son una definición aparte, no el rasgo de la web 3.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q039
  prompt:
    es: "¿Cuál de las siguientes capacidades tienen los usuarios en la web 3.0, además de controlar el valor económico de sus datos, según la Comisión Europea?"
  options:
  - id: a
    text:
      es: "Ceder el valor económico de sus datos a las plataformas de la web"
  - id: b
    text:
      es: "Delegar la gestión de sus identidades en una autoridad central de la web"
  - id: c
    text:
      es: "Consultar páginas sin poder enlazar datos entre aplicaciones y archivos"
  - id: d
    correct: true
    text:
      es: "Gestionar sus identidades en línea y participar en el gobierno de la web"
  explanation:
    es: "En la web 3.0 los usuarios tienen capacidad plena para gestionar sus identidades en línea y participar en el gobierno de la web. Delegar la identidad en una autoridad central contradice la capacidad plena de los usuarios para gestionarla. Ceder el valor de los datos contradice que los usuarios puedan controlarlo y materializarlo. Las capacidades semánticas de la web 3.0 sí permiten enlazar datos entre páginas, aplicaciones y archivos."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q040
  prompt:
    es: "¿Cuál de las siguientes funciones tienen, según la Comisión Europea, las capacidades semánticas de la web que caracterizan a la web 3.0?"
  options:
  - id: a
    text:
      es: "Permiten que los objetos y entornos digitales y reales se comuniquen entre sí"
  - id: b
    text:
      es: "Permiten mezclar mundos físicos y digitales en tiempo real con 3D y realidad aumentada"
  - id: c
    correct: true
    text:
      es: "Permiten enlazar datos entre páginas web, aplicaciones y archivos"
  - id: d
    text:
      es: "Permiten combinar sin fisuras los mundos físico y digital en experiencias inmersivas"
  explanation:
    es: "Las capacidades semánticas de la web permiten enlazar datos entre páginas web, aplicaciones y archivos. Combinar sin fisuras lo físico y lo digital es lo que logra la web 4.0 con sus tecnologías integradas. Mezclar mundos físicos y digitales en tiempo real es la definición de los mundos virtuales. Que los objetos y entornos digitales y reales se comuniquen entre sí es una característica de la web 4.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q041
  prompt:
    es: "¿Cuál de las siguientes definiciones de los mundos virtuales ofrece la Comisión Europea en su Comunicación de 2023 sobre la web 4.0?"
  options:
  - id: a
    correct: true
    text:
      es: "Entornos persistentes e inmersivos, basados en 3D y realidad aumentada, que mezclan mundos físicos y digitales"
  - id: b
    text:
      es: "Cuarta generación prevista de la web, con inteligencia artificial y cadena de bloques"
  - id: c
    text:
      es: "Tercera generación de la web, abierta y descentralizada, controlada por sus usuarios"
  - id: d
    text:
      es: "Organizaciones autónomas descentralizadas que ofrecen una forma diferente de cooperación"
  explanation:
    es: "Los mundos virtuales son entornos persistentes e inmersivos, basados en tecnologías como la 3D y la realidad aumentada, que mezclan mundos físicos y digitales en tiempo real. Ser abierta y descentralizada, con usuarios que controlan sus datos, es lo que la Comisión atribuye a la web 3.0. Esa descripción, con inteligencia artificial y cadena de bloques, es la de la web 4.0. Las organizaciones autónomas descentralizadas son nuevas formas digitales de organización, no los mundos virtuales."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q042
  prompt:
    es: "¿Dónde se alojó primero la evolución de HTML durante sus cinco primeros años, de 1990 a 1995, según la introducción del estándar HTML de WHATWG?"
  options:
  - id: a
    text:
      es: "En el IETF y, después, en el CERN"
  - id: b
    text:
      es: "En el W3C y, después, en el WHATWG"
  - id: c
    text:
      es: "En Opera Software y, después, en el W3C"
  - id: d
    correct: true
    text:
      es: "En el CERN y, después, en el IETF"
  explanation:
    es: "En sus cinco primeros años (1990-1995), HTML tuvo varias revisiones y extensiones, alojadas primero en el CERN y después en el IETF. El orden inverso, IETF y luego CERN, cambia el orden que da el estándar. El W3C se creó después de esos cinco años y el WHATWG nació tras la propuesta rechazada en 2004. Opera solo aparece en 2003-2004, con la propuesta de extensión de formularios, no en los primeros años."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q043
  prompt:
    es: "¿Qué especificación de HTML completó el W3C en 1997, tras el intento fallido de extender HTML en 1995 conocido como HTML 3.0?"
  options:
  - id: a
    text:
      es: "XHTML 1.0, una reformulación de HTML4 en XML"
  - id: b
    correct: true
    text:
      es: "HTML 3.2, un enfoque más pragmático"
  - id: c
    text:
      es: "DOM Level 1, la API que publicaron los fabricantes de navegadores"
  - id: d
    text:
      es: "XForms, la tecnología de formularios de nueva generación"
  explanation:
    es: "Tras el intento abortado de HTML 3.0 en 1995, el W3C completó en 1997 HTML 3.2, un enfoque más pragmático. XHTML 1.0, la reformulación de HTML4 en XML, se completó en 2000. DOM Level 1 se publicó en 1998 y es una API, no una versión de HTML. XForms se publicó en 2003 y despertó el interés por evolucionar HTML."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q044
  prompt:
    es: "¿Qué tres empresas anunciaron conjuntamente que seguirían con la evolución de HTML bajo un nuevo foro llamado WHATWG, tras rechazar el W3C su propuesta en 2004?"
  options:
  - id: a
    text:
      es: "Mozilla, Opera y el W3C"
  - id: b
    text:
      es: "Apple, el IETF y el CERN"
  - id: c
    text:
      es: "Opera, Apple y el W3C"
  - id: d
    correct: true
    text:
      es: "Apple, Mozilla y Opera"
  explanation:
    es: "Apple, Mozilla y Opera anunciaron conjuntamente que continuarían el trabajo bajo el nuevo foro WHATWG. El W3C no es una empresa y fue quien rechazó la propuesta de Mozilla y Opera en 2004. El IETF y el CERN alojaron los primeros años de HTML, no se unieron al WHATWG. El W3C rechazó la propuesta, por lo que no anunció el WHATWG junto a Apple y Opera."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q290
  prompt:
    es: "¿Cuál de las siguientes agencias de investigación planificó la red ARPANET, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    text:
      es: "BBN, que ganó el contrato de los IMP"
  - id: b
    text:
      es: "La NSF, que dirigió el programa NSFNET"
  - id: c
    text:
      es: "RAND, que estudió las redes de voz segura para uso militar en el año 1964"
  - id: d
    correct: true
    text:
      es: "DARPA, la agencia de proyectos de investigación avanzada de defensa"
  explanation:
    es: "Roberts fue a DARPA a finales de 1966 para desarrollar el concepto de red y publicó en 1967 su plan para ARPANET. «La NSF, que dirigió el programa NSFNET»: el programa NSFNET llegó en 1985, después de ARPANET. «BBN, que ganó el contrato de los IMP»: BBN fue la empresa que ganó en diciembre de 1968 el desarrollo de los IMP. «RAND, que estudió las redes de voz segura para uso militar en el año 1964»: RAND escribió en 1964 un artículo sobre redes de conmutación de paquetes para voz segura militar, y no planificó ARPANET."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q291
  prompt:
    es: "¿Quién escribió en julio de 1972 el primer programa de correo que permitía listar, leer de forma selectiva, archivar, reenviar y responder mensajes?"
  options:
  - id: a
    text:
      es: "Ray Tomlinson, de BBN"
  - id: b
    correct: true
    text:
      es: "Roberts, que había planificado ARPANET"
  - id: c
    text:
      es: "Jon Postel, editor de las RFC"
  - id: d
    text:
      es: "Bob Kahn, de DARPA"
  explanation:
    es: "En julio de 1972 Roberts amplió la utilidad del correo con el primer programa para listar, leer, archivar, reenviar y responder mensajes. «Ray Tomlinson, de BBN»: escribió en marzo de 1972 el software básico de envío y lectura de mensajes, no el programa de julio. «Bob Kahn, de DARPA»: organizó en octubre de 1972 la demostración pública de ARPANET en la ICCC. «Jon Postel, editor de las RFC» fue el editor de las RFC, no el autor del programa de correo."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q292
  prompt:
    es: "¿Cuál de los siguientes conjuntos formó las tres primeras redes del experimento de Internet, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    text:
      es: "ARPANET, NSFNET y MILNET"
  - id: b
    text:
      es: "ARPANET, JANET y USENET, redes de comunidades académicas"
  - id: c
    correct: true
    text:
      es: "ARPANET, radio de paquetes y satélite de paquetes"
  - id: d
    text:
      es: "ARPANET, CSNET y BITNET"
  explanation:
    es: "El experimento empezó con tres redes: ARPANET, la de radio de paquetes y la de satélite de paquetes. «ARPANET, NSFNET y MILNET»: NSFNET es de 1985, y MILNET nació en 1983 al dividirse ARPANET. «ARPANET, CSNET y BITNET»: CSNET y BITNET son redes posteriores de comunidades concretas, no de las tres primeras. «ARPANET, JANET y USENET, redes de comunidades académicas»: JANET es de 1984 y USENET es otra red de comunidades, no de las tres primeras."
  citation: "fuente: `isoc-historia-internet.html`; «Beginning with the first three networks (ARPANET, Packet Radio, and Packet Satellite) and their initial research communities, the experimental environment has grown to incorporate essentially every form of network and a very broad-based research and development community.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q294
  prompt:
    es: "Según el modelo original de direcciones IP de 32 bits que describe la historia de Internet, ¿cuántos bits identificaban la red y cuántos el host?"
  options:
  - id: a
    text:
      es: "4 bits para la red y 28 para el host"
  - id: b
    correct: true
    text:
      es: "8 bits para la red y 24 para el host"
  - id: c
    text:
      es: "24 bits para la red y 8 para el host"
  - id: d
    text:
      es: "16 bits para la red y 16 para el host"
  explanation:
    es: "En el modelo original los 8 primeros bits de la dirección identificaban la red y los 24 restantes el host. «16 bits para la red y 16 para el host» no es el reparto original: los 8 primeros bits eran de red. «24 bits para la red y 8 para el host» invierte el reparto original: la red tenía 8 bits y el host 24. «4 bits para la red y 28 para el host» no es el reparto original, de 8 y 24 bits."
  citation: "fuente: `isoc-historia-internet.html`; «Thus a 32 bit IP address was used of which the first 8 bits signified the network and the remaining 24 bits designated the host on that network.»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q295
  prompt:
    es: "¿Cuál de los siguientes elementos sustituyó al algoritmo único de encaminamiento cuando se disparó el número de redes, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "El sistema de nombres de dominio, que resuelve nombres de host jerárquicos en direcciones de Internet"
  - id: b
    text:
      es: "El protocolo NCP con control de errores de extremo a extremo"
  - id: c
    correct: true
    text:
      es: "Un modelo jerárquico, con un protocolo interior en cada región y otro exterior que las une"
  - id: d
    text:
      es: "Una única tabla con todos los hosts, sus nombres y sus direcciones"
  explanation:
    es: "El algoritmo único se sustituyó por un modelo jerárquico, con un IGP dentro de cada región y un EGP para unirlas. «Una única tabla con todos los hosts, sus nombres y sus direcciones» es la tabla que el DNS sustituyó cuando hubo muchas redes gestionadas de forma independiente. «El protocolo NCP con control de errores de extremo a extremo»: NCP lo sustituyó TCP/IP en 1983, y no tenía control de errores de extremo a extremo. «El sistema de nombres de dominio, que resuelve nombres de host jerárquicos en direcciones de Internet»: el DNS resuelve nombres de host en direcciones; no sustituyó al encaminamiento."
  citation: "fuente: `isoc-historia-internet.html`; «As the number of networks in the Internet exploded, this initial design could not expand as necessary, so it was replaced by a hierarchical model of routing, with an Interior Gateway Protocol (IGP) used inside each region of the Internet, and an Exterior Gateway Protocol (EGP) used to tie the regions together.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q296
  prompt:
    es: "¿Cuál de las siguientes políticas de uso aplicó la NSF a la columna vertebral de NSFNET, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "El acceso reservado a las redes de la defensa de EE. UU."
  - id: b
    text:
      es: "La prohibición de que las redes regionales tuvieran clientes comerciales en ninguna circunstancia"
  - id: c
    text:
      es: "La obligación de usar NCP en lugar de TCP/IP"
  - id: d
    correct: true
    text:
      es: "Una política de uso aceptable que prohibía usos ajenos a la investigación y la educación"
  explanation:
    es: "La NSF aplicó en la columna vertebral una política de uso aceptable que prohibía los usos no destinados a la investigación y la educación. «La obligación de usar NCP en lugar de TCP/IP» contradice la historia: la NSF hizo obligatorio TCP/IP en el programa NSFNET. «La prohibición de que las redes regionales tuvieran clientes comerciales en ninguna circunstancia»: la NSF animó a las redes regionales a buscar clientes comerciales; la restricción era para el transporte nacional. «El acceso reservado a las redes de la defensa de EE. UU.»: la parte militar se separó en MILNET, y la columna vertebral de NSFNET atendía a la investigación y la educación."
  citation: "fuente: `isoc-historia-internet.html`; «On the NSFNET Backbone – the national-scale segment of the NSFNET – NSF enforced an “Acceptable Use Policy” (AUP) which prohibited Backbone usage for purposes “not in support of Research and Education.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q297
  prompt:
    es: "¿En qué año se formó la Internet Society, según la historia de Internet que ella misma publica?"
  options:
  - id: a
    text:
      es: "1995"
  - id: b
    text:
      es: "1985"
  - id: c
    correct: true
    text:
      es: "1991"
  - id: d
    text:
      es: "1969"
  explanation:
    es: "La historia dice que la necesidad de apoyo de la comunidad llevó a la formación de la Internet Society en 1991. «1969» es el año del primer nodo de ARPANET y del inicio de las RFC. «1985» es el año en que TCP/IP se hizo obligatorio en NSFNET y en que Kahn y Leiner dejaron DARPA. «1995» es el año en que se retiró la financiación de la columna vertebral de NSFNET."
  citation: "fuente: `isoc-historia-internet.html`; «Formation of the Broad Community»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q298
  prompt:
    es: "¿En qué año dejó de recibir financiación la columna vertebral de NSFNET, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "1985, cuando TCP/IP pasó a ser obligatorio en NSFNET"
  - id: b
    text:
      es: "1990, cuando se desmanteló ARPANET"
  - id: c
    text:
      es: "1983, cuando ARPANET adoptó TCP/IP"
  - id: d
    correct: true
    text:
      es: "1995, en abril"
  explanation:
    es: "La política de privatización de la NSF culminó en abril de 1995 con la retirada de fondos de la columna vertebral de NSFNET. «1990, cuando se desmanteló ARPANET» es el año del desmantelamiento de ARPANET, no del fin de la financiación de la columna vertebral. «1985, cuando TCP/IP pasó a ser obligatorio en NSFNET» es el año de la decisión de hacer obligatorio TCP/IP en NSFNET. «1983, cuando ARPANET adoptó TCP/IP» es el año de la transición de ARPANET de NCP a TCP/IP."
  citation: "fuente: `isoc-historia-internet.html`; «Transition to Widespread Infrastructure»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q299
  prompt:
    es: "¿Qué demostró el grupo de David Clark, en el MIT, con una implementación de TCP para el Xerox Alto y el IBM PC?"
  options:
  - id: a
    correct: true
    text:
      es: "Que los ordenadores personales también podían usar un TCP compacto"
  - id: b
    text:
      es: "Que TCP era demasiado grande y complejo para un ordenador personal"
  - id: c
    text:
      es: "Que solo los sistemas de tiempo compartido, como Tenex, admitían TCP"
  - id: d
    text:
      es: "Que NCP bastaba para conectar un IBM PC con ARPANET"
  explanation:
    es: "El MIT mostró que era posible una implementación compacta y sencilla de TCP, interoperable con otras, para estaciones de trabajo y PC. «Que TCP era demasiado grande y complejo para un ordenador personal»: era lo que pensaban algunos, y la implementación de Clark lo desmintió. «Que solo los sistemas de tiempo compartido, como Tenex, admitían TCP»: las primeras implementaciones fueron para sistemas de tiempo compartido, pero la del MIT mostró que no eran los únicos. «Que NCP bastaba para conectar un IBM PC con ARPANET»: ARPANET ya había pasado de NCP a TCP/IP; la implementación era de TCP."
  citation: "fuente: `isoc-historia-internet.html`; «That implementation was fully interoperable with other TCPs, but was tailored to the application suite and performance objectives of the personal computer, and showed that workstations, as well as large time-sharing systems, could be a part of the Internet.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m02-l12-q300
  prompt:
    es: "¿Cuál de las siguientes condiciones incluye también la definición de Internet que aprobó el FNC en 1995?"
  options:
  - id: a
    text:
      es: "Usar únicamente el protocolo NCP"
  - id: b
    correct: true
    text:
      es: "Poder soportar comunicaciones con el conjunto de protocolos TCP/IP"
  - id: c
    text:
      es: "Limitarse a la red ARPANET original"
  - id: d
    text:
      es: "Estar gestionado por una única agencia del Gobierno de EE. UU. que asigne las direcciones"
  explanation:
    es: "La definición del FNC pide un sistema enlazado por un espacio de direcciones único basado en IP y capaz de soportar comunicaciones con TCP/IP. «Estar gestionado por una única agencia del Gobierno de EE. UU. que asigne las direcciones» no figura en la definición, que habla de un sistema global. «Usar únicamente el protocolo NCP»: NCP lo sustituyó TCP/IP en 1983. «Limitarse a la red ARPANET original»: la ARPANET original creció hasta ser Internet y se desmanteló en 1990."
  citation: "fuente: `isoc-historia-internet.html`; «History of the Future»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q301
  prompt:
    es: "¿Cuál de las siguientes decisiones tomó el W3C en 1998 respecto a la evolución de HTML, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    text:
      es: "Completar HTML 3.2 con un enfoque más pragmático"
  - id: b
    correct: true
    text:
      es: "Dejar de evolucionar HTML y trabajar en un equivalente basado en XML, llamado XHTML"
  - id: c
    text:
      es: "Firmar un acuerdo con el WHATWG para mantener una sola versión de HTML a partir de entonces"
  - id: d
    text:
      es: "Reabrir la evolución de HTML tras la propuesta de Mozilla y Opera"
  explanation:
    es: "En 1998 la membresía del W3C decidió dejar de evolucionar HTML y trabajar en un equivalente basado en XML, llamado XHTML. «Reabrir la evolución de HTML tras la propuesta de Mozilla y Opera»: el W3C rechazó esa propuesta en 2004 y siguió con los reemplazos basados en XML. «Completar HTML 3.2 con un enfoque más pragmático»: HTML 3.2 se completó en 1997. «Firmar un acuerdo con el WHATWG para mantener una sola versión de HTML a partir de entonces»: el acuerdo con el WHATWG se firmó en 2019."
  citation: "fuente: `whatwg-html-introduccion.html`; «The following year, the W3C membership decided to stop evolving HTML and instead begin work on an XML-based equivalent, called XHTML.»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q302
  prompt:
    es: "¿Cuál de los siguientes acuerdos alcanzaron el WHATWG y el W3C en 2019, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    text:
      es: "Que el W3C publicara una versión terminada y el WHATWG un estándar vivo, por separado"
  - id: b
    text:
      es: "Que HTML se sustituyera por un lenguaje basado en XML"
  - id: c
    text:
      es: "Que el WHATWG dejara el desarrollo de HTML en manos del W3C"
  - id: d
    correct: true
    text:
      es: "Colaborar en una única versión de HTML a partir de entonces"
  explanation:
    es: "En 2019 firmaron un acuerdo para colaborar en una única versión de HTML. «Que el W3C publicara una versión terminada y el WHATWG un estándar vivo, por separado» fue lo que ocurrió desde 2011, cuando los dos grupos concluyeron que tenían objetivos distintos. «Que el WHATWG dejara el desarrollo de HTML en manos del W3C» contradice el acuerdo: ambos colaboran en una única versión. «Que HTML se sustituyera por un lenguaje basado en XML»: el W3C había abandonado esa vía tras XHTML, y el WHATWG nació para seguir evolucionando HTML."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q303
  prompt:
    es: "¿Cuál de los siguientes objetivos tenía el WHATWG con el Living Standard de HTML, lo que lo llevó a separarse del W3C en 2011?"
  options:
  - id: a
    correct: true
    text:
      es: "Mantener la especificación de forma continua, añadiendo funciones sin congelarla"
  - id: b
    text:
      es: "Publicar una versión terminada de HTML5"
  - id: c
    text:
      es: "Sustituir HTML por un lenguaje basado en XML"
  - id: d
    text:
      es: "Reservar el copyright de la especificación a una sola empresa fundadora del grupo"
  explanation:
    es: "El WHATWG quería seguir con un estándar vivo, mantenido continuamente y con nuevas funciones, en lugar de congelarlo. «Publicar una versión terminada de HTML5» es lo que quería el W3C, que buscaba publicar una versión terminada de HTML5. «Sustituir HTML por un lenguaje basado en XML» es lo que decidió el W3C en 1998 con XHTML. «Reservar el copyright de la especificación a una sola empresa fundadora del grupo»: el copyright se enmendó para que fuera de las tres empresas fundadoras y permitiera reutilizar la especificación."
  citation: "fuente: `whatwg-html-introduccion.html`; «In 2011, however, the groups came to the conclusion that they had different goals: the W3C wanted to publish a \"finished\" version of \"HTML5\", while the WHATWG wanted to continue working on a Living Standard for HTML, continuously maintaining the specification rather than freezing it in a state with known problems, and adding new features as needed to evolve the platform.»"
  difficulty: 2
  tags:
  - "concepto"
