m08-l04-q03:
  key:
    anchor: grpc-deadlines#deadline-propagation
    sentence: To address this gRPC converts the deadline to a timeout from which the already elapsed time is already deducted.
  wrong:
  - option: It forwards the absolute deadline unchanged, because both servers share a synchronized clock
    anchor: grpc-deadlines#deadline-propagation
    sentence: propagating it as-is to a server can be problematic as the clocks on the two servers might not be synchronized.
  - option: It resets the deadline to the full original timeout for every hop in the chain
    anchor: grpc-deadlines#deadline-propagation
    sentence: you would want to honor the deadline set by the original client.
  - option: It drops the deadline, because each server has to include its own deadline for each outgoing RPC
    anchor: grpc-deadlines#deadline-propagation
    sentence: Using this capability lets you avoid the error-prone approach of manually including the deadline for each outgoing RPC.
m08-l04-q04:
  key:
    anchor: kafka-design#enforcement
    sentence: Byte-rate and thread utilization are measured over multiple small windows (e.g. 30 windows of 1 second each) in order to detect and correct quota violations quickly.
  wrong:
  - option: Over a few large windows, for example 10 windows of 30 seconds each
    anchor: kafka-design#enforcement
    sentence: Typically, having large measurement windows (for e.g. 10 windows of 30 seconds each) leads to large bursts of traffic followed by long delays
  - option: At the cluster level, with a quota shared among all the brokers
    anchor: kafka-design#enforcement
    sentence: would require a mechanism to share client quota usage among all the brokers.
  - option: By the client alone, which counts its own requests and throttles itself
    anchor: kafka-design#enforcement
    sentence: the broker first computes the amount of delay needed to bring the violating client under its quota
