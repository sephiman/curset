  difficulty: 1
  tags:
  - "órgano"
# anchor: celex-12016e-txt-art-254
- id: m01-l10-q120
  prompt:
    es: "Según el artículo 254 del Tratado de Funcionamiento de la Unión Europea, los jueces del Tribunal General eligen de entre ellos al Presidente del Tribunal General por un período de:"
  options:
  - id: a
    text:
      es: "Seis años, renovable."
  - id: b
    text:
      es: "Dos años y medio, renovable una sola vez."
  - id: c
    text:
      es: "Tres años, no renovable."
  - id: d
    correct: true
    text:
      es: "Tres años, renovable."
  explanation:
    es: "El Presidente del Tribunal General se elige por tres años y su mandato es renovable. Seis años es el período de designación de los jueces. Dos años y medio, renovable una vez, es el mandato del Presidente del Consejo Europeo. La opción no renovable contradice el artículo."
  citation: "art. 254 TFUE"
  difficulty: 3
  tags:
  - "plazo"
# anchor: celex-12016e-txt-art-254
- id: m01-l10-q121
  prompt:
    es: "Señale quién fija el número de jueces del Tribunal General, de acuerdo con el artículo 254 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad."
  - id: b
    text:
      es: "Los Gobiernos de los Estados miembros, de común acuerdo."
  - id: c
