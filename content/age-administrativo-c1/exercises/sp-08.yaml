      es: "En situación de excedencia voluntaria por interés particular."
  - id: d
    text:
      es: "En situación de servicio en otras Administraciones Públicas."
  explanation:
    es: "Los funcionarios de carrera pasan a servicios especiales cuando desempeñan cargos electivos retribuidos y de dedicación exclusiva en las entidades locales, como el de concejala con dedicación exclusiva y retribución. El servicio activo con compatibilidad no recoge este supuesto. La excedencia voluntaria por interés particular exige solicitarla, y no es la situación que la ley asigna a este cargo. El servicio en otras Administraciones Públicas se declara a quien obtiene destino en otra Administración por transferencia o provisión de puestos, y no es el caso."
  citation: "art. 87.1.f) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-98
- id: q15
  lesson: m04-l06
  prompt:
    es: "Según el artículo 98.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la sanción por la falta leve de Don Alberto Ferrándiz se impondrá:"
  options:
  - id: a
    text:
      es: "Por el procedimiento general previo, con instructor y secretario designados."
  - id: b
    text:
      es: "Por procedimiento sumario, sin necesidad de audiencia al interesado."
  - id: c
    correct: true
    text:
      es: "Por procedimiento sumario con audiencia al interesado."
  - id: d
    text:
      es: "Por el procedimiento general previo, con pliego de cargos y propuesta de resolución."
  explanation:
    es: "La imposición de sanciones por faltas leves se lleva a cabo por procedimiento sumario con audiencia al interesado. Las faltas muy graves y graves exigen el procedimiento previamente establecido, con instructor, pliego de cargos y propuesta de resolución, y no es el de la falta leve de Don Alberto. La opción del procedimiento sumario sin audiencia suprime una garantía que el artículo mantiene."
  citation: "art. 98.1 TREBEP"
  difficulty: 1
  tags:
