# anchor: boe-a-2007-6115-art-3
- id: m01-l06-q0001
  prompt:
    es: "Según el artículo 3 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, el principio de igualdad de trato supone, en especial, la ausencia de las discriminaciones derivadas de:"
  options:
  - id: a
    correct: true
    text:
      es: "La maternidad, la asunción de obligaciones familiares y el estado civil"
  - id: b
    text:
      es: "La maternidad, la orientación sexual y la situación socioeconómica"
  - id: c
    text:
      es: "El embarazo, la lactancia y la reducción de jornada por cuidado"
  - id: d
    text:
      es: "La edad, la asunción de obligaciones familiares y la nacionalidad de la persona"
  explanation:
    es: "El artículo 3 nombra en especial las discriminaciones derivadas de «la maternidad, la asunción de obligaciones familiares y el estado civil». La orientación sexual y la situación socioeconómica no están en ese artículo. Tampoco el embarazo, la lactancia y la reducción de jornada, aunque la ley trate el embarazo en otro precepto. La edad y la nacionalidad tampoco figuran en la lista del artículo 3."
  citation: "art. 3 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m01-l06-q0003
  prompt:
    es: "¿Cuál de los siguientes comportamientos constituye acoso sexual a los efectos de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres?"
  options:
  - id: a
    text:
      es: "Cualquier comportamiento realizado en función del sexo de una persona que atente contra su dignidad"
  - id: b
    text:
      es: "Solo el comportamiento físico de naturaleza sexual reiterado en el tiempo contra una misma persona"
  - id: c
    text:
      es: "Solo el comportamiento verbal de naturaleza sexual de un superior jerárquico hacia un subordinado"
  - id: d
    correct: true
    text:
      es: "Cualquier comportamiento, verbal o físico, de naturaleza sexual que atente contra la dignidad de una persona"
  explanation:
    es: "El artículo 7.1 llama acoso sexual a «cualquier comportamiento, verbal o físico, de naturaleza sexual» que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona. El comportamiento realizado en función del sexo de la persona es el acoso por razón de sexo del artículo 7.2. La ley no exige que el comportamiento sea físico ni que se repita. Tampoco lo limita al trato verbal de un superior jerárquico."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m01-l06-q0004
  prompt:
    es: "Según el artículo 7.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la definición de acoso sexual que esta ley da a sus efectos se establece:"
  options:
  - id: a
    text:
      es: "Con exclusión de las conductas que tipifica el Código Penal"
  - id: b
    correct: true
    text:
      es: "Sin perjuicio de lo establecido en el Código Penal"
  - id: c
    text:
      es: "Solo para las relaciones laborales y de empleo público"
  - id: d
    text:
      es: "Sin perjuicio de lo que dispongan los convenios colectivos"
  explanation:
    es: "El artículo 7.1 abre la definición con la cláusula «sin perjuicio de lo establecido en el Código Penal». No excluye las conductas que sean delito: deja a salvo el Código Penal. La definición no se limita al empleo, porque la ley rige en todos los ámbitos. La salvedad que hace el artículo es la del Código Penal, no la de los convenios colectivos."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2007-6115-art-7
- id: m01-l06-q0005
  prompt:
    es: "Según el artículo 7.2 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, constituye acoso por razón de sexo cualquier comportamiento realizado en función del sexo de una persona:"
  options:
  - id: a
    correct: true
    text:
      es: "Con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo"
  - id: b
    text:
      es: "Con el propósito de atentar contra su dignidad, siempre que se repita durante un periodo continuado de tiempo"
  - id: c
    text:
      es: "Que, siendo de naturaleza sexual, verbal o física, atente contra su libertad e indemnidad sexuales"
  - id: d
    text:
      es: "Que suponga para ella un trato menos favorable que el que recibe otra persona en una situación comparable a la suya"
  explanation:
    es: "El artículo 7.2 exige «el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo». Basta el efecto, sin propósito, y la ley no pide que el comportamiento se repita. La naturaleza sexual es propia del acoso sexual del artículo 7.1. El trato menos favorable que otra persona en situación comparable define la discriminación directa del artículo 6.1."
  citation: "art. 7.2 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m01-l06-q0006
  prompt:
    es: "Conforme a la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, el acoso por razón de sexo es un comportamiento que atenta contra la dignidad de una persona y se realiza:"
  options:
  - id: a
    text:
      es: "Con una naturaleza sexual, verbal o física"
  - id: b
    text:
      es: "Por quien sea o haya sido cónyuge de la víctima"
  - id: c
    correct: true
    text:
      es: "En función del sexo de la persona afectada"
  - id: d
    text:
      es: "Por un superior jerárquico de la persona afectada"
  explanation:
    es: "El artículo 7.2 define el acoso por razón de sexo como el comportamiento «realizado en función del sexo de una persona». La naturaleza sexual, verbal o física, es la nota del acoso sexual (art. 7.1). La relación de cónyuge o expareja delimita la violencia de género de la Ley Orgánica 1/2004, no este acoso. La ley no exige que el autor sea un superior jerárquico."
  citation: "art. 7.2 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-11
- id: m01-l06-q0007
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, los Poderes Públicos adoptarán medidas específicas en favor de las mujeres para:"
  options:
  - id: a
    text:
      es: "Compensar la pérdida de retribuciones derivada de la maternidad y la lactancia"
  - id: b
    text:
      es: "Garantizar su presencia mayoritaria en los órganos de selección de personal"
  - id: c
    correct: true
    text:
      es: "Corregir situaciones patentes de desigualdad de hecho respecto de los hombres"
  - id: d
    text:
      es: "Sancionar las conductas de acoso sexual en el ámbito de las relaciones laborales"
  explanation:
    es: "El artículo 11.1 dice que las medidas se adoptan «para corregir situaciones patentes de desigualdad de hecho respecto de los hombres». No las vincula a compensar retribuciones. Los órganos de selección deben tener presencia equilibrada (art. 53), no mayoría de mujeres. Sancionar el acoso no es el fin de las acciones positivas."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-11
- id: m01-l06-q0008
  prompt:
    es: "¿Durante cuánto tiempo son aplicables, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las medidas específicas que adoptan los Poderes Públicos en favor de las mujeres?"
  options:
  - id: a
    correct: true
    text:
      es: "En tanto subsistan las situaciones de desigualdad de hecho que corrigen"
  - id: b
    text:
      es: "Durante un plazo máximo de cuatro años, prorrogable por otros cuatro"
  - id: c
    text:
      es: "Durante la legislatura en que las apruebe el Consejo de Ministros"
  - id: d
    text:
      es: "Con carácter indefinido, aunque desaparezcan las situaciones de desigualdad"
  explanation:
    es: "El artículo 11.1 dice que estas medidas «serán aplicables en tanto subsistan dichas situaciones» de desigualdad de hecho. La ley no fija un plazo de cuatro años ni lo liga a la legislatura. Tampoco son indefinidas: dejan de aplicarse cuando desaparece la desigualdad que corrigen."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6115-art-11
- id: m01-l06-q0009
  prompt:
    es: "¿Cuál de los siguientes requisitos deben cumplir, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las acciones positivas en relación con el objetivo perseguido en cada caso?"
  options:
  - id: a
    text:
      es: "Ser temporales y revisables cada año por el Gobierno"
  - id: b
    text:
      es: "Ser necesarias e imprescindibles para alcanzar ese objetivo"
  - id: c
    text:
      es: "Ser objetivas y motivadas en un informe de impacto de género"
  - id: d
    correct: true
    text:
      es: "Ser razonables y proporcionadas en relación con ese objetivo"
  explanation:
    es: "El artículo 11.1 dice que las medidas «habrán de ser razonables y proporcionadas en relación con el objetivo perseguido en cada caso». Son temporales porque duran mientras subsista la desigualdad, pero la ley no prevé una revisión anual. La ley no exige que sean imprescindibles. El informe de impacto de género acompaña a las convocatorias de pruebas selectivas (art. 55), no a estas medidas."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-45
- id: m01-l06-q0010
  prompt:
    es: "¿A partir de cuántos trabajadores deben las empresas, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, dirigir sus medidas de igualdad a elaborar y aplicar un plan de igualdad?"
  options:
  - id: a
    text:
      es: "A partir de veinticinco trabajadores en plantilla"
  - id: b
    correct: true
    text:
      es: "A partir de cincuenta trabajadores en plantilla"
  - id: c
    text:
      es: "A partir de cien trabajadores en plantilla"
  - id: d
    text:
      es: "A partir de doscientos cincuenta trabajadores en plantilla"
  explanation:
    es: "El artículo 45.2 impone el plan de igualdad a «las empresas de cincuenta o más trabajadores». Veinticinco trabajadores queda por debajo de ese umbral. Cien y doscientos cincuenta trabajadores son cifras más altas que la ley no usa en este apartado."
  citation: "art. 45.2 LO 3/2007"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2007-6115-art-45
- id: m01-l06-q0011
  prompt:
    es: "Según el artículo 45.2 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, en las empresas de cincuenta o más trabajadores las medidas de igualdad deberán dirigirse a:"
  options:
  - id: a
    text:
      es: "La obtención del distintivo empresarial en materia de igualdad"
  - id: b
    correct: true
    text:
      es: "La elaboración y aplicación de un plan de igualdad"
  - id: c
    text:
      es: "La creación de una unidad de igualdad en la dirección de la empresa"
  - id: d
    text:
      es: "La elaboración de un informe anual de impacto de género"
  explanation:
    es: "El artículo 45.2 dice que esas medidas «deberán dirigirse a la elaboración y aplicación de un plan de igualdad». El distintivo empresarial (art. 50) es voluntario y reconoce a las empresas que destacan en igualdad. Las unidades de igualdad son órganos de los Ministerios (art. 77). El informe de impacto de género acompaña a las convocatorias de pruebas selectivas (art. 55)."
  citation: "art. 45.2 LO 3/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-49
- id: m01-l06-q0012
  prompt:
    es: "De acuerdo con el artículo 49 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las medidas de fomento que el Gobierno establezca para impulsar la adopción voluntaria de planes de igualdad:"
  options:
  - id: a
    correct: true
    text:
      es: "Incluirán el apoyo técnico necesario"
  - id: b
    text:
      es: "Consistirán en reducciones de las cuotas empresariales a la Seguridad Social"
  - id: c
    text:
      es: "Requerirán que la empresa haya obtenido el distintivo en materia de igualdad"
  - id: d
    text:
      es: "Se dirigirán solo a las empresas obligadas por su convenio colectivo"
  explanation:
    es: "El artículo 49 dice que las medidas de fomento «incluirán el apoyo técnico necesario». No las concreta en reducciones de cuotas a la Seguridad Social. No exigen haber obtenido antes el distintivo del artículo 50. Van especialmente dirigidas a las pequeñas y medianas empresas, no solo a las obligadas por convenio, que además ya tendrían que elaborar el plan."
  citation: "art. 49 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-49
- id: m01-l06-q0013
  prompt:
    es: "¿A cuál de los siguientes grupos de empresas se dirigen especialmente las medidas de fomento de los planes de igualdad voluntarios, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres?"
  options:
  - id: a
    text:
      es: "A las empresas obligadas por convenio colectivo a tener plan"
  - id: b
    text:
      es: "A las empresas que ya hayan obtenido el distintivo de igualdad"
  - id: c
    correct: true
    text:
      es: "A las pequeñas y las medianas empresas"
  - id: d
    text:
      es: "A las empresas de trabajo temporal y a las cooperativas"
  explanation:
    es: "El artículo 49 dirige las medidas de fomento «especialmente» a «las pequeñas y las medianas empresas». Las empresas obligadas por convenio ya deben elaborar el plan (art. 45.3), de modo que su adopción no es voluntaria. El distintivo de igualdad es otra figura (art. 50) y no delimita a los destinatarios. La ley no menciona a las empresas de trabajo temporal ni a las cooperativas."
  citation: "art. 49 LO 3/2007"
  difficulty: 1
  tags:
  - "requisito"
