# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0081
  prompt:
    es: "Según el artículo 188.2.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la exigencia del importe de la reducción del 65 por ciento practicada en las actas con acuerdo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se exige sin más requisito que la notificación cuando se interpone contra la regularización o la sanción el recurso contencioso-administrativo."
  - id: b
    text:
      es: "Se exige tras requerir al obligado el pago de la reducción y transcurrir el plazo de diez días sin ingreso."
  - id: c
    text:
