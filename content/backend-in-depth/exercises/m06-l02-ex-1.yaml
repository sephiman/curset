- id: m06-l02-q23
  prompt:
    en: In HikariCP 7.1, the pool has reached `maximumPoolSize` and no idle connection is available. What does a
      call to `getConnection()` do?
  options:
  - id: a
    text:
      en: It opens an extra connection above the configured maximum of the pool
  - id: b
    correct: true
    text:
      en: It blocks up to `connectionTimeout` milliseconds, then throws a `SQLException`
  - id: c
    text:
