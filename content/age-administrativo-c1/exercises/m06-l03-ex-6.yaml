  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m06-l03-q217
  prompt:
    es: "En la página Acerca de de Windows 11, ¿en qué sección se comprueba qué edición y versión de Windows utiliza el dispositivo?"
  options:
  - id: a
    correct: true
    text:
      es: "En Especificaciones de Windows"
  - id: b
    text:
      es: "En Especificaciones del dispositivo"
  - id: c
    text:
      es: "En Almacenamiento usado en otras unidades"
  - id: d
    text:
      es: "En Configuración de almacenamiento avanzada"
  explanation:
    es: "La página dice que, en Especificaciones de Windows, se comprueba qué edición y versión de Windows utiliza el dispositivo. Especificaciones del dispositivo muestra el procesador, la RAM y si Windows es de 32 o 64 bits, y las otras dos opciones son de la parte de almacenamiento."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Qué versión de Windows tengo?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m06-l03-q219
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes datos del dispositivo se comprueba en Especificaciones del dispositivo de la página Acerca de?"
  options:
  - id: a
    text:
      es: "La edición de Windows del equipo"
  - id: b
    text:
      es: "La versión de Windows del equipo"
  - id: c
    correct: true
    text:
      es: "La cantidad de RAM instalada"
  - id: d
    text:
      es: "El nombre del modelo del equipo"
  explanation:
    es: "La página dice que Especificaciones del dispositivo incluye la cantidad de RAM instalada. La edición y la versión de Windows se comprueban en Especificaciones de Windows, y el nombre del modelo aparece justo debajo del nombre del dispositivo."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Cuáles son las especificaciones de mi dispositivo?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m06-l03-q220
  prompt:
    es: "En Windows 11, el espacio en disco que tiene el dispositivo se averigua en la ruta de Configuración:"
  options:
  - id: a
    text:
      es: "Configuración › Sistema › Acerca de"
  - id: b
    correct: true
    text:
      es: "Configuración › Sistema › Almacenamiento"
  - id: c
    text:
      es: "Configuración › Sistema › Multitarea"
  - id: d
    text:
