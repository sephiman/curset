# anchor: boe-a-1889-4763-art-918
- id: m03-l03-q032
  prompt:
    es: "Según el artículo 918 del Código Civil, ¿a cuántos grados de distancia está una persona de su primo hermano?"
  options:
  - id: a
    text:
      es: "A dos grados, en la línea colateral."
  - id: b
    text:
      es: "A tres grados, en la línea colateral."
  - id: c
    correct: true
    text:
      es: "A cuatro grados, en la línea colateral."
  - id: d
    text:
      es: "A cinco grados, en la línea colateral."
  explanation:
    es: "En la línea colateral «se sube hasta el tronco común y después se baja hasta la persona con quien se hace la computación». El artículo 918 del Código Civil lo aplica: el hermano dista dos grados del hermano, tres del tío y «cuatro del primo hermano». Dos grados es la distancia entre hermanos. Tres es la del tío. Cinco no corresponde al primo hermano. El primo hermano entra así en el cuarto grado de consanguinidad del artículo 23.2.b) LRJSP."
  citation: "art. 918 Código Civil"
  difficulty: 1
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q033
  prompt:
    es: "Un funcionario que forma parte de una comisión de valoración comprueba que uno de los solicitantes es hijo de su hermano. ¿Debe abstenerse?"
  options:
  - id: a
    text:
      es: "No, porque la abstención solo alcanza a la consanguinidad dentro del segundo grado."
  - id: b
    correct: true
    text:
      es: "Sí, porque es pariente por consanguinidad en tercer grado, dentro del cuarto."
  - id: c
    text:
      es: "No, porque el hijo de un hermano es pariente por afinidad, no por consanguinidad."
  - id: d
    text:
      es: "Sí, porque es pariente por consanguinidad en segundo grado, dentro del cuarto."
  explanation:
    es: "El hijo de un hermano es un sobrino. En la línea colateral se sube hasta el tronco común y se baja; el artículo 918 del Código Civil dice que el hermano dista «tres del tío», y la distancia es la misma en sentido inverso: tío y sobrino están en tercer grado. El artículo 23.2.b) LRJSP alcanza la consanguinidad «dentro del cuarto grado», así que el funcionario debe abstenerse. El segundo grado como límite es el de la afinidad. El sobrino es pariente por sangre, no por afinidad. El segundo grado es la distancia entre hermanos, no entre tío y sobrino."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q034
  prompt:
    es: "El instructor de un procedimiento tiene con un interesado un parentesco de afinidad de tercer grado, y no concurre ningún otro motivo. ¿Es motivo de abstención?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la afinidad solo es motivo de abstención dentro del segundo grado."
  - id: b
    text:
      es: "Sí, porque la afinidad es motivo de abstención dentro del tercer grado."
  - id: c
    text:
      es: "Sí, porque todo parentesco por afinidad es motivo de abstención."
  - id: d
    text:
      es: "Solo si el interesado lo alega mediante un escrito de recusación."
  explanation:
    es: "El artículo 23.2.b) LRJSP limita la afinidad a la que está «dentro del segundo», así que el tercer grado de afinidad queda fuera. No hay un límite de tercer grado para la afinidad, ni la ley incluye toda afinidad. La recusación (artículo 24.1) solo cabe en los casos del artículo 23: si no hay motivo de abstención, alegarlo no lo crea."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-1889-4763-art-918
- id: m03-l03-q035
  prompt:
    es: "De acuerdo con el artículo 918 del Código Civil, para computar los grados en la línea colateral:"
  options:
  - id: a
    text:
      es: "se sube únicamente hasta el tronco común, sin bajar después hasta la otra persona."
  - id: b
    text:
      es: "se cuentan solo las generaciones que separan a cada una de las dos personas de sus padres."
  - id: c
    text:
      es: "se baja desde el tronco común y se suma un grado más por cada matrimonio intermedio."
  - id: d
    correct: true
    text:
      es: "se sube hasta el tronco común y después se baja hasta la persona con quien se computa."
  explanation:
    es: "El artículo 918 del Código Civil dice: «En la colateral se sube hasta el tronco común y después se baja hasta la persona con quien se hace la computación». Subir solo hasta el tronco es la regla de la línea recta, no de la colateral. Contar solo las generaciones hasta los padres no llega al tronco común cuando este es un abuelo. Los matrimonios no suman grados de consanguinidad."
  citation: "art. 918 Código Civil"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q036
  prompt:
    es: "Un funcionario debe instruir un procedimiento administrativo en el que es interesada una empresa a la que prestó servicios profesionales hace dieciocho meses. ¿Debe abstenerse?"
  options:
  - id: a
    text:
      es: "No, porque solo cuentan los servicios prestados en el último año."
  - id: b
    text:
      es: "No, porque solo cuenta una relación de servicio que siga vigente."
  - id: c
    correct: true
    text:
      es: "Sí, porque le prestó servicios profesionales en los dos últimos años."
  - id: d
    text:
      es: "Sí, pero solo si los servicios se prestaron a cambio de retribución."
  explanation:
    es: "El artículo 23.2.e) LRJSP incluye «haberle prestado en los dos últimos años servicios profesionales de cualquier tipo». Dieciocho meses están dentro de los dos años, así que debe abstenerse. El periodo no es de un año. La relación de servicio vigente es otro supuesto de la misma letra, que no excluye este. La ley habla de servicios «de cualquier tipo», sin exigir que fueran retribuidos."
  citation: "art. 23.2.e) LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q037
  prompt:
    es: "¿Cuál de las siguientes circunstancias es motivo de abstención según el artículo 23.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Haber sido instructor de un procedimiento anterior del mismo interesado."
  - id: b
    correct: true
    text:
      es: "Haber intervenido como perito o como testigo en el procedimiento."
  - id: c
    text:
      es: "Pertenecer al mismo cuerpo de funcionarios que uno de los interesados."
  - id: d
    text:
      es: "Haber resuelto antes otro asunto promovido por el mismo interesado."
  explanation:
    es: "La letra d) del artículo 23.2 LRJSP recoge «haber intervenido como perito o como testigo en el procedimiento de que se trate». Haber instruido o resuelto antes otro asunto del mismo interesado no figura entre los motivos. Pertenecer al mismo cuerpo tampoco."
  citation: "art. 23.2.d) LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q038
  prompt:
    es: "Entre los motivos de abstención de las autoridades y el personal que intervienen en un procedimiento administrativo figura tener con un interesado:"
  options:
  - id: a
    correct: true
    text:
      es: "amistad íntima o enemistad manifiesta."
  - id: b
    text:
      es: "amistad o enemistad, sea cual sea su intensidad."
  - id: c
    text:
      es: "enemistad manifiesta, pero no amistad íntima."
  - id: d
    text:
      es: "amistad íntima, pero no enemistad manifiesta."
  explanation:
    es: "El artículo 23.2.c) LRJSP dice: «Tener amistad íntima o enemistad manifiesta». Los dos supuestos cuentan, así que las opciones que excluyen uno de ellos recortan la letra. Tampoco basta cualquier amistad o enemistad: la ley exige que la amistad sea íntima y la enemistad manifiesta."
  citation: "art. 23.2.c) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q039
  prompt:
    es: "¿Cuál de las siguientes circunstancias recoge el artículo 23.2.a) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público como motivo de abstención?"
  options:
  - id: a
    text:
      es: "Haber sido interesado en otro procedimiento ya concluido ante el mismo órgano."
  - id: b
    text:
      es: "Haber tenido con algún interesado una cuestión litigiosa ya resuelta."
  - id: c
    text:
      es: "Residir en el mismo municipio que alguno de los interesados."
  - id: d
    correct: true
    text:
      es: "Tener cuestión litigiosa pendiente con algún interesado."
  explanation:
    es: "La letra a) del artículo 23.2 LRJSP recoge el interés personal en el asunto, ser administrador de sociedad o entidad interesada y «tener cuestión litigiosa pendiente con algún interesado». La cuestión tiene que estar pendiente; una ya resuelta no está en la letra. Haber sido interesado en otro procedimiento concluido y residir en el mismo municipio no figuran entre los motivos."
  citation: "art. 23.2.a) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q040
  prompt:
    es: "Según el artículo 23.2.b) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, respecto de los asesores, representantes legales o mandatarios que intervengan en el procedimiento, también es motivo de abstención:"
  options:
  - id: a
    text:
      es: "haber compartido despacho profesional con ellos en los cuatro últimos años, aunque ya no lo compartan."
  - id: b
    correct: true
    text:
      es: "compartir despacho profesional o estar asociado con ellos para el asesoramiento, la representación o el mandato."
  - id: c
    text:
      es: "pertenecer al mismo colegio profesional que ellos, aunque no se comparta despacho ni se esté asociado."
  - id: d
    text:
      es: "haber coincidido con ellos como miembros de un mismo órgano colegiado de la Administración del Estado."
  explanation:
    es: "El artículo 23.2.b) LRJSP incluye «compartir despacho profesional o estar asociado con éstos para el asesoramiento, la representación o el mandato». Habla de compartir despacho ahora, no de haberlo compartido en un periodo anterior. La pertenencia al mismo colegio profesional y la coincidencia en un órgano colegiado no aparecen en la letra."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m03-l03-q041
  prompt:
    es: "Además del vínculo matrimonial con cualquiera de los interesados, el mismo motivo de abstención de la legislación de régimen jurídico del sector público incluye:"
  options:
  - id: a
    text:
      es: "el noviazgo, siempre que conste por escrito ante notario."
  - id: b
    text:
      es: "el vínculo matrimonial ya disuelto en los dos últimos años."
  - id: c
    correct: true
    text:
      es: "la situación de hecho asimilable al vínculo matrimonial."
  - id: d
    text:
      es: "la convivencia en el mismo domicilio por razones de trabajo."
  explanation:
    es: "El artículo 23.2.b) LRJSP habla de «un vínculo matrimonial o situación de hecho asimilable». La situación de hecho asimilable queda equiparada al matrimonio. El noviazgo ante notario, el matrimonio disuelto y la convivencia por trabajo no figuran en la letra."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q042
  prompt:
    es: "Según el artículo 24.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quién puede promover la recusación y en qué momento?"
  options:
  - id: a
    text:
      es: "Cualquier ciudadano, en cualquier momento de la tramitación del procedimiento."
  - id: b
    text:
      es: "Los interesados, dentro de los diez días siguientes a conocer la causa."
  - id: c
    text:
      es: "El superior jerárquico, en cuanto conozca la causa de abstención."
  - id: d
    correct: true
    text:
      es: "Los interesados, en cualquier momento de la tramitación del procedimiento."
  explanation:
    es: "El artículo 24.1 LRJSP dice que «podrá promoverse recusación por los interesados en cualquier momento de la tramitación del procedimiento». La pueden promover los interesados, no cualquier ciudadano. No hay plazo de diez días desde que se conoce la causa. El superior no recusa: puede ordenar que el afectado se abstenga, que es otra figura."
  citation: "art. 24.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q043
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las causas de recusación es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Son los mismos motivos que obligan a abstenerse."
  - id: b
    text:
      es: "Incluyen cualquier causa que afecte a la imparcialidad, aunque no obligue a abstenerse."
  - id: c
    text:
      es: "Solo pueden alegarse contra el órgano competente para resolver el procedimiento."
  - id: d
    text:
      es: "Solo pueden alegarse si antes el superior inmediato ha rechazado la abstención."
  explanation:
    es: "El artículo 24.1 LRJSP dice: «En los casos previstos en el artículo anterior, podrá promoverse recusación». Las causas de recusación son los motivos de abstención del artículo 23, no cualquier causa que afecte a la imparcialidad. La recusación no se limita a quien resuelve: alcanza a las autoridades y al personal que intervengan. No hace falta una abstención previa rechazada."
  citation: "art. 24.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q044
  prompt:
    es: "El viernes 13 de marzo de 2026 el instructor de un procedimiento administrativo recibe un escrito que lo recusa. No hay festivos en esos días. ¿Qué día debe manifestar a su inmediato superior si se da o no en él la causa alegada?"
  options:
  - id: a
    text:
      es: "El sábado 14 de marzo de 2026."
  - id: b
    correct: true
    text:
      es: "El lunes 16 de marzo de 2026."
  - id: c
    text:
      es: "El martes 17 de marzo de 2026."
  - id: d
    text:
      es: "El miércoles 18 de marzo de 2026."
  explanation:
    es: "El artículo 24.3 LRJSP dice que el recusado lo manifiesta «en el día siguiente». El plazo se señala por días, así que cuenta en días hábiles y excluye sábados y domingos (artículo 30.2 LPAC). El día siguiente hábil al viernes 13 es el lunes 16 de marzo de 2026. El sábado 14 es inhábil. El martes 17 sería un segundo día hábil, como si el plazo fuera de dos días. El miércoles 18 es el tercer día hábil, que corresponde al plazo del superior para resolver si el recusado niega la causa."
  citation: "art. 24.3 LRJSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q045
  prompt:
    es: "El jueves 5 de marzo de 2026 un funcionario recusado en un procedimiento administrativo niega ante su superior la causa alegada. No hay festivos en esos días. ¿Hasta qué día tiene el superior para resolver?"
  options:
  - id: a
    text:
      es: "Hasta el viernes 6 de marzo de 2026."
  - id: b
    text:
      es: "Hasta el lunes 9 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 10 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el jueves 12 de marzo de 2026."
  explanation:
    es: "Si el recusado niega la causa, «el superior resolverá en el plazo de tres días» (artículo 24.4 LRJSP). Los tres días son hábiles y se cuentan desde el día siguiente (artículo 30.2 LPAC): viernes 6, lunes 9 y martes 10. El último día es el martes 10 de marzo de 2026. El viernes 6 es el día siguiente, que es el plazo del recusado. El lunes 9 sale de contar tres días naturales, que acaban el domingo 8, y pasar al lunes. El jueves 12 corresponde a cinco días hábiles."
  citation: "art. 24.4 LRJSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q046
  prompt:
    es: "Según el artículo 24.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si el recusado niega la causa de recusación:"
  options:
  - id: a
    correct: true
    text:
      es: "el superior resolverá en el plazo de tres días."
  - id: b
    text:
      es: "el superior resolverá en el plazo de diez días."
  - id: c
    text:
      es: "el órgano que resuelve el procedimiento decidirá en un mes."
  - id: d
    text:
      es: "el recusado seguirá actuando sin necesidad de resolución."
  explanation:
    es: "El artículo 24.4 LRJSP dice: «Si el recusado niega la causa de recusación, el superior resolverá en el plazo de tres días». Diez días no es el plazo. No decide el órgano del procedimiento, sino el superior inmediato del recusado. La negativa no basta para que siga actuando: hace falta que el superior resuelva."
  citation: "art. 24.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q048
  prompt:
    es: "Según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si las leyes que establecen las infracciones no fijan plazos de prescripción, las infracciones prescribirán:"
  options:
  - id: a
    text:
      es: "las muy graves a los cinco años, las graves a los tres años y las leves al año."
  - id: b
    text:
      es: "las muy graves a los tres años, las graves a los dos años y las leves al año."
  - id: c
    text:
      es: "las muy graves a los cuatro años, las graves a los dos años y las leves a los seis meses."
  - id: d
    correct: true
    text:
      es: "las muy graves a los tres años, las graves a los dos años y las leves a los seis meses."
  explanation:
    es: "El artículo 30.1 LRJSP dice que, a falta de plazo en la ley, «las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses». La serie de cinco, tres y un año no es la de la ley. Poner las leves en un año confunde la infracción leve con la sanción por falta leve, que sí prescribe al año. Cuatro años no es el plazo de las muy graves."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q049
  prompt:
    es: "Conforme al artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si las leyes no fijan plazos de prescripción, las sanciones prescribirán:"
  options:
  - id: a
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves a los dos años y por leves a los seis meses."
  - id: b
    text:
      es: "las impuestas por faltas muy graves a los cinco años, por graves a los tres años y por leves al año."
  - id: c
    correct: true
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves a los dos años y por leves al año."
  - id: d
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves al año y por leves a los seis meses."
  explanation:
    es: "El artículo 30.1 LRJSP dice que «las sanciones impuestas por faltas muy graves prescribirán a los tres años, las impuestas por faltas graves a los dos años y las impuestas por faltas leves al año». Seis meses es el plazo de la infracción leve, no de la sanción leve. Cinco y tres años no son los plazos de la ley. Un año es el de la sanción leve, no el de la grave."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q050
  prompt:
    es: "Una ley tipifica una infracción leve sin fijar su plazo de prescripción. Conforme al régimen general del sector público, ¿en qué plazo prescribe la infracción?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de seis meses."
  - id: b
    text:
      es: "En el plazo de un año."
  - id: c
    text:
      es: "En el plazo de tres meses."
  - id: d
    text:
      es: "En el plazo de dos años."
  explanation:
    es: "El artículo 30.1 LRJSP dice que, si las leyes no fijan plazos, «las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses». Un año es el plazo de la sanción impuesta por falta leve, no el de la infracción. Dos años es el plazo de las infracciones graves. Tres meses no es ninguno de los tres plazos de infracciones del apartado, que son tres años, dos años y seis meses."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q051
  prompt:
    es: "Cuando la ley que las establece no fija plazos, ¿cuál de estas afirmaciones es correcta según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La infracción leve y la sanción por falta leve prescriben a los seis meses."
  - id: b
    correct: true
    text:
      es: "La infracción leve prescribe a los seis meses y la sanción por falta leve, al año."
  - id: c
    text:
      es: "La infracción leve prescribe al año y la sanción por falta leve, a los seis meses."
  - id: d
    text:
      es: "La infracción leve y la sanción por falta leve prescriben al año."
  explanation:
    es: "El artículo 30.1 LRJSP da plazos distintos a la infracción leve, «a los seis meses», y a la sanción impuesta por falta leve, «al año». Las opciones que igualan los dos plazos borran esa diferencia. La que da un año a la infracción y seis meses a la sanción los cambia de sitio."
  citation: "art. 30.1 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q052
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las infracciones y sanciones prescribirán:"
  options:
  - id: a
    text:
      es: "en los plazos de ese artículo, que prevalecen siempre sobre los que fijen las leyes sectoriales."
  - id: b
    text:
      es: "según disponga el reglamento que tipifique la infracción, sin que existan plazos supletorios."
  - id: c
    text:
      es: "en el plazo que fije en cada caso la resolución que imponga la sanción correspondiente."
  - id: d
    correct: true
    text:
      es: "según dispongan las leyes que las establezcan y, en su defecto, en los plazos de ese artículo."
  explanation:
    es: "El artículo 30.1 LRJSP empieza: «Las infracciones y sanciones prescribirán según lo dispuesto en las leyes que las establezcan. Si éstas no fijan plazos de prescripción», se aplican los del propio artículo. Los plazos de la LRJSP son supletorios, no prevalecen sobre los de la ley sectorial. Remiten a las leyes, no a un reglamento, y sí hay plazos supletorios. La resolución sancionadora no fija el plazo de prescripción."
  citation: "art. 30.1 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q053
  prompt:
    es: "Si la ley que las establece no fija plazos, señale la afirmación INCORRECTA sobre la prescripción según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Las infracciones leves prescriben al año."
  - id: b
    text:
      es: "Las infracciones graves prescriben a los dos años."
  - id: c
    text:
      es: "Las sanciones por faltas muy graves prescriben a los tres años."
  - id: d
    text:
      es: "Las sanciones por faltas graves prescriben a los dos años."
  explanation:
    es: "La afirmación incorrecta es la que da un año a las infracciones leves: el artículo 30.1 LRJSP dice que «las leves [prescriben] a los seis meses»; el año es el plazo de las sanciones impuestas por faltas leves. Las otras tres opciones copian el artículo: infracciones graves a los dos años, sanciones por faltas muy graves a los tres y sanciones por faltas graves a los dos."
  citation: "art. 30.1 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-47
- id: m03-l03-q054
  prompt:
    es: "Según el artículo 47.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, son convenios los acuerdos que adoptan las Administraciones Públicas entre sí o con sujetos de derecho privado:"
  options:
  - id: a
    text:
      es: "con efectos jurídicos, para prestaciones propias de los contratos."
  - id: b
    text:
      es: "sin compromisos jurídicos concretos ni exigibles, para un fin común."
  - id: c
    correct: true
    text:
      es: "con efectos jurídicos, para un fin común."
  - id: d
    text:
      es: "con efectos jurídicos, siempre que tengan contenido económico."
  explanation:
    es: "El artículo 47.1 LRJSP define los convenios como acuerdos con efectos jurídicos «para un fin común». Las prestaciones propias de los contratos no pueden ser objeto de convenio: se rigen por la legislación de contratos. Los acuerdos sin compromisos jurídicos concretos y exigibles son Protocolos Generales de Actuación, no convenios. La definición no exige contenido económico: lo que pide es un fin común."
  citation: "art. 47.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-47
- id: m03-l03-q055
  prompt:
    es: "Conforme al artículo 47.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Protocolos Generales de Actuación que no supongan la formalización de compromisos jurídicos concretos y exigibles:"
  options:
  - id: a
    text:
      es: "son convenios interadministrativos sin plazo de vigencia."
  - id: b
    correct: true
    text:
      es: "no tienen la consideración de convenios."
  - id: c
    text:
      es: "son convenios si los firman dos o más Administraciones."
  - id: d
    text:
      es: "son convenios si se publican en el Boletín Oficial del Estado."
  explanation:
    es: "El artículo 47.1 LRJSP dice: «No tienen la consideración de convenios, los Protocolos Generales de Actuación o instrumentos similares» que no supongan compromisos jurídicos concretos y exigibles. No pasan a ser convenios por el número de firmantes ni por su publicación, y no son convenios interadministrativos de ningún tipo."
  citation: "art. 47.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-49
- id: m03-l03-q056
  prompt:
    es: "Según el artículo 49.h) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en cualquier momento antes de la finalización del plazo de vigencia, los firmantes de un convenio podrán acordar su prórroga:"
  options:
  - id: a
    correct: true
    text:
      es: "de forma unánime, por un periodo de hasta cuatro años adicionales."
  - id: b
    text:
      es: "por mayoría de los firmantes, por un periodo de hasta cuatro años adicionales."
  - id: c
    text:
      es: "de forma unánime, por un periodo de hasta seis años adicionales."
  - id: d
    text:
      es: "de forma unánime, por un periodo igual al de su vigencia inicial."
  explanation:
    es: "El artículo 49.h) LRJSP dice que los firmantes «podrán acordar unánimemente su prórroga por un periodo de hasta cuatro años adicionales o su extinción». Hace falta unanimidad, no mayoría. El límite es de cuatro años, no de seis, y no depende de la vigencia inicial."
  citation: "art. 49.h) LRJSP"
  difficulty: 2
  tags:
  - "plazo"
  - "mayoría"
# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q058
  prompt:
    es: "Según la legislación de régimen jurídico del sector público, los convenios que suscriben las Administraciones Públicas se extinguen:"
  options:
  - id: a
    text:
      es: "únicamente por el transcurso del plazo de vigencia, sin que quepa extinguirlos antes de su fin."
  - id: b
    correct: true
    text:
      es: "por el cumplimiento de las actuaciones que constituyen su objeto o por incurrir en causa de resolución."
  - id: c
    text:
      es: "por el cumplimiento de su objeto o por el cambio de titular del órgano que firmó el convenio."
  - id: d
    text:
      es: "por la denuncia de cualquiera de los firmantes, comunicada a los demás con un mes de antelación."
  explanation:
    es: "El artículo 51.1 LRJSP dice que se extinguen «por el cumplimiento de las actuaciones que constituyen su objeto o por incurrir en causa de resolución». El fin de la vigencia sin prórroga es solo una de las causas de resolución del apartado 2. El cambio de titular del órgano firmante no aparece. La denuncia con un mes de antelación tampoco."
  citation: "art. 51.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
