- id: m04-l05-q229
  prompt:
    es: "¿Cuál de las siguientes reglas limita la consolidación del grado de dos en dos niveles cuando el puesto supera el grado personal en más de dos niveles?"
  options:
  - id: a
    text:
      es: "Puede superar el nivel del puesto desempeñado, pero no el intervalo de su Cuerpo o Escala."
  - id: b
    text:
      es: "No puede superar el nivel del puesto desempeñado, pero sí el intervalo de su Cuerpo o Escala."
  - id: c
    correct: true
    text:
      es: "No puede superar el nivel del puesto desempeñado ni el intervalo de su Cuerpo o Escala."
  - id: d
    text:
      es: "No puede superar en más de cuatro niveles el grado que tenía al obtener el puesto."
  explanation:
    es: "El artículo 70.2 del Real Decreto 364/1995 dice que esos funcionarios consolidan de dos en dos niveles «sin que en ningún caso puedan superar el correspondiente al del puesto desempeñado, ni el intervalo de niveles correspondiente a su Cuerpo o Escala». Los dos límites operan a la vez, así que las opciones que admiten superar uno de ellos son falsas. No hay un tope de cuatro niveles sobre el grado anterior."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
