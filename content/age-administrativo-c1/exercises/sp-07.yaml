# anchor: boe-a-2003-21614-art-53
- id: q16
  lesson: m05-l02
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre la generación de crédito con la aportación del Estado a la Mutualidad antes de que esta la ingrese?"
  options:
  - id: a
    text:
      es: "No cabe generar crédito, porque la generación solo puede realizarse cuando se hayan efectuado los ingresos que la justifican."
  - id: b
    correct: true
    text:
      es: "Cabe generar crédito, porque en un organismo autónomo basta un compromiso firme de aportación con ingreso previsto en el ejercicio."
  - id: c
    text:
      es: "No cabe generar crédito, porque la aportación del Estado a un organismo nunca da lugar a generaciones."
  - id: d
    text:
      es: "Cabe generar crédito, pero solo si el Consejo de Ministros autoriza la generación de crédito."
  explanation:
    es: "La generación solo puede hacerse cuando se han efectuado los ingresos que la justifican, pero en los organismos autónomos la que nace de una aportación del Estado puede hacerse una vez reconocido el derecho o cuando existe un compromiso firme de aportación, siempre que el ingreso se prevea en el propio ejercicio. El Estado se ha comprometido de forma firme a aportar 600.000 euros este año, así que la Mutualidad puede generar crédito antes de recibirlos. Exigir el ingreso previo aplica la regla general sin la excepción del organismo autónomo. Las aportaciones del Estado a un organismo sí dan lugar a generaciones, y la ley no pide autorización del Consejo de Ministros."
  citation: "art. 53.3 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-58
- id: q17
  lesson: m05-l02
  prompt:
    es: "Según el artículo 58 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con cargo a qué se financia la incorporación a 2027 del remanente del crédito extraordinario en el presupuesto de la Mutualidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo con la parte del remanente de tesorería no aplicada al presupuesto del organismo."
  - id: b
    text:
      es: "Con baja en el Fondo de Contingencia del presupuesto del Estado."
  - id: c
    text:
      es: "Con baja en otros créditos de operaciones no financieras del presupuesto."
  - id: d
    text:
      es: "Con mayores ingresos sobre los previstos inicialmente en el presupuesto del organismo."
  explanation:
    es: "Las incorporaciones de crédito en el presupuesto de un organismo autónomo solo pueden financiarse con la parte del remanente de tesorería que al fin del ejercicio anterior no se aplicó al presupuesto del organismo. La baja en el Fondo de Contingencia y la baja en otros créditos de operaciones no financieras financian las incorporaciones del presupuesto del Estado, no las de un organismo autónomo. Los mayores ingresos financian los suplementos y créditos extraordinarios del organismo, no sus incorporaciones."
  citation: "art. 58 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1996-1578-art-13
- id: q18
  lesson: m05-l03
  prompt:
    es: "¿Hasta qué fecha, contando días hábiles, debe fiscalizar la Intervención Delegada el expediente del contrato de suministro de la Mutualidad?"
  options:
  - id: a
    text:
      es: "El martes, 26 de octubre de 2027."
  - id: b
    text:
      es: "El jueves, 4 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 27 de octubre de 2027."
  - id: d
    text:
      es: "El lunes, 25 de octubre de 2027."
  explanation:
    es: "La Intervención fiscaliza el expediente en diez días desde el siguiente a la fecha de recepción, y en cinco si se declaró urgente la tramitación. El expediente entró el miércoles, 20 de octubre de 2027, y es urgente: los cinco días hábiles son jueves 21, viernes 22, lunes 25, martes 26 y miércoles 27, así que el plazo acaba el miércoles, 27 de octubre de 2027. La fecha del martes, 26 de octubre de 2027, cuenta el día de la recepción como primero. La del jueves, 4 de noviembre de 2027, aplica los diez días hábiles, con el 1 de noviembre festivo. La del lunes, 25 de octubre de 2027, cuenta cinco días naturales."
  citation: "art. 13.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1996-1578-art-16
