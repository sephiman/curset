# anchor: boe-a-1982-5196-art-30
- id: m01-l03-q047
  prompt:
    es: "De acuerdo con el artículo 30 del Reglamento del Congreso de 10 de febrero de 1982, la Mesa del Congreso está compuesta por:"
  options:
  - id: a
    text:
      es: "La Presidencia, dos Vicepresidencias y cuatro Secretarías."
  - id: b
    text:
      es: "La Presidencia, cuatro Vicepresidencias y dos Secretarías."
  - id: c
    correct: true
    text:
      es: "La Presidencia, cuatro Vicepresidencias y cuatro Secretarías."
  - id: d
    text:
      es: "La Presidencia, dos Vicepresidencias y dos Secretarías."
  explanation:
    es: "El artículo 30.2 del Reglamento dice: «La Mesa estará compuesta por la Presidencia del Congreso, cuatro Vicepresidencias y cuatro Secretarías». Dos Vicepresidencias y cuatro Secretarios es la Mesa del Senado (art. 5.1 del Reglamento del Senado). Dos Vicepresidencias y dos Secretarías es la Mesa de las Comisiones del Congreso (art. 41.1)."
  citation: "art. 30.2 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1982-5196-art-37
- id: m01-l03-q048
  prompt:
    es: "Según el artículo 37 del Reglamento del Congreso de 10 de febrero de 1982, ¿qué ocurre si en la elección de la Presidencia nadie obtiene en primera votación la mayoría absoluta?"
  options:
  - id: a
    text:
      es: "Se repite la elección entre las tres personas más votadas y se exige de nuevo la mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Se repite la elección entre quienes hayan alcanzado las dos mayores votaciones y se elige a quien obtenga más votos."
  - id: c
    text:
      es: "Se repite la elección entre quienes hayan alcanzado las dos mayores votaciones y se exige la mayoría absoluta."
  - id: d
    text:
      es: "Resulta elegida la persona de mayor edad entre las dos más votadas en la primera votación."
  explanation:
    es: "El artículo 37.1 dice: «Si nadie obtuviera en primera votación dicha mayoría, se repetirá la elección entre quienes hayan alcanzado las dos mayores votaciones y se elegirá a quien obtenga más votos». La repetición es entre dos, no entre tres. En la segunda votación no se exige mayoría absoluta. La edad no decide la elección."
  citation: "art. 37.1 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: boe-a-1982-5196-art-39
- id: m01-l03-q049
  prompt:
    es: "¿Con qué criterio adopta sus decisiones la Junta de Portavoces según el Reglamento del Congreso de 10 de febrero de 1982?"
  options:
  - id: a
    correct: true
    text:
      es: "Siempre en función del criterio de voto ponderado."
  - id: b
    text:
      es: "Por mayoría simple de los portavoces presentes."
  - id: c
    text:
      es: "Por unanimidad de los portavoces de los grupos."
  - id: d
    text:
      es: "Por mayoría absoluta de los grupos parlamentarios constituidos."
  explanation:
    es: "El artículo 39.4 del Reglamento dice: «Las decisiones de la Junta de Portavoces se adoptarán siempre en función del criterio de voto ponderado». Cada portavoz pesa según su grupo. Por eso no se decide por mayoría de portavoces, por unanimidad ni por mayoría de grupos."
  citation: "art. 39.4 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1982-5196-art-23
- id: m01-l03-q050
  prompt:
    es: "De acuerdo con el artículo 23 del Reglamento del Congreso de 10 de febrero de 1982, en su redacción para la XVI legislatura, pueden constituirse en Grupo Parlamentario, sin otro requisito, las diputadas y diputados en número no inferior a:"
  options:
  - id: a
    correct: true
    text:
      es: "Quince diputadas y diputados de la Cámara."
  - id: b
    text:
      es: "Diez diputadas y diputados de la Cámara."
  - id: c
    text:
      es: "Doce diputadas y diputados de la Cámara."
  - id: d
    text:
      es: "Veinte diputadas y diputados de la Cámara."
  explanation:
    es: "El artículo 23.1 del Reglamento, en la redacción que entra en vigor en la XVI legislatura, dice: «Las diputadas y los diputados, en número no inferior a quince, podrán constituirse en Grupo Parlamentario». Diez es el mínimo de un Grupo en el Senado (art. 27.1 del Reglamento del Senado). Doce y veinte no aparecen en el precepto."
  citation: "art. 23.1 Reglamento del Congreso"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
  - "cambio-pendiente"
# anchor: boe-a-1982-5196-art-23
- id: m01-l03-q051
  prompt:
    es: "¿Cuál de los siguientes requisitos permite constituir Grupo Parlamentario sin reunir quince diputados, según el Reglamento del Congreso de 10 de febrero de 1982 en su redacción para la XVI legislatura?"
  options:
  - id: a
    text:
      es: "Tres escaños y una media del 10 por 100 de los votos válidos en las circunscripciones con representación."
  - id: b
    text:
      es: "Cuatro escaños y el 3 por 100 de los votos válidos emitidos en el conjunto de la Nación."
  - id: c
    text:
      es: "Cinco escaños y una media del 5 por 100 de los votos válidos en las circunscripciones con representación."
  - id: d
    correct: true
    text:
      es: "Cinco escaños y una media del 10 por 100 de los votos válidos en las circunscripciones con representación."
  explanation:
    es: "El artículo 23.1 del Reglamento, en la redacción para la XVI legislatura, exige «un número de escaños no inferior a cinco y, al menos, una media del 10 por 100 de los votos válidos emitidos en el conjunto de las circunscripciones en que hubieren obtenido representación o el 3 por 100 de los votos válidos emitidos en el conjunto de la Nación». Tres y cuatro escaños no llegan al mínimo de cinco. Una media del 5 por 100 no alcanza el 10 por 100."
  citation: "art. 23.1 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
  - "cambio-pendiente"
# anchor: boe-a-1982-5196-art-24
- id: m01-l03-q052
  prompt:
    es: "De acuerdo con el artículo 24 del Reglamento del Congreso de 10 de febrero de 1982, la constitución de Grupos Parlamentarios se hará, mediante escrito dirigido a la Mesa de la Cámara:"
  options:
  - id: a
    text:
      es: "Dentro de los diez días siguientes a la sesión constitutiva del Congreso."
  - id: b
    correct: true
    text:
      es: "Dentro de los cinco días siguientes a la sesión constitutiva del Congreso."
  - id: c
    text:
      es: "Dentro de los cinco días hábiles siguientes a la celebración de las elecciones."
  - id: d
    text:
      es: "Dentro de los quince días siguientes a la sesión constitutiva del Congreso."
  explanation:
    es: "El artículo 24.1 del Reglamento dice que la constitución de Grupos se hará «dentro de los cinco días siguientes a la sesión constitutiva del Congreso, mediante escrito dirigido a la Mesa de la Cámara». Diez días es el plazo para constituir las Comisiones Permanentes. El plazo se cuenta desde la sesión constitutiva, no desde las elecciones. Quince días no aparece."
  citation: "art. 24.1 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1982-5196-art-41
- id: m01-l03-q053
  prompt:
    es: "De acuerdo con el artículo 41 del Reglamento del Congreso de 10 de febrero de 1982, las Comisiones, con las excepciones previstas en el Reglamento, eligen de entre sus miembros una Mesa compuesta por:"
  options:
  - id: a
    text:
      es: "Una Presidencia, cuatro Vicepresidencias y cuatro Secretarías."
  - id: b
    text:
      es: "Una Presidencia, una Vicepresidencia y una Secretaría."
  - id: c
    text:
      es: "Una Presidencia, dos Vicepresidencias y cuatro Secretarías."
  - id: d
    correct: true
    text:
      es: "Una Presidencia, dos Vicepresidencias y dos Secretarías."
  explanation:
    es: "El artículo 41.1 del Reglamento dice que las Comisiones eligen «una Mesa, compuesta por una Presidencia, dos Vicepresidencias y dos Secretarías». Cuatro Vicepresidencias y cuatro Secretarías son las de la Mesa del Congreso (art. 30.2). Dos Vicepresidentes y cuatro Secretarios forman la Mesa del Senado. Una sola Vicepresidencia y una sola Secretaría no aparecen."
  citation: "art. 41.1 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "composición"
# anchor: boe-a-1982-5196-art-46
- id: m01-l03-q054
  prompt:
    es: "Según el artículo 46 del Reglamento del Congreso de 10 de febrero de 1982, además de las Comisiones Permanentes Legislativas, ¿cuáles son también Comisiones Permanentes?"
  options:
  - id: a
    text:
      es: "Las de investigación y las de Reglamento, Estatuto y Peticiones."
  - id: b
    text:
      es: "Las que deban constituirse por disposición legal y las de investigación."
  - id: c
    correct: true
    text:
      es: "Las que deban constituirse por disposición legal y las de Reglamento, Estatuto y Peticiones."
  - id: d
    text:
      es: "Las de Reglamento, Estatuto y Peticiones, y las Ponencias de cada Comisión."
  explanation:
    es: "El artículo 46.2 del Reglamento dice: «Son también Comisiones Permanentes aquellas que deban constituirse por disposición legal y las siguientes: 1ª. Reglamento. 2ª. Estatuto. 3ª. Peticiones». Las Comisiones de investigación no están en esa lista. Las Ponencias no son Comisiones Permanentes."
  citation: "art. 46.2 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1982-5196-art-30
- id: m01-l03-q122
  prompt:
    es: "Conforme al artículo 30 del Reglamento del Congreso de 10 de febrero de 1982, la Mesa es el órgano rector de la Cámara y ostenta:"
  options:
  - id: a
    text:
      es: "La representación exclusiva del Congreso ante el Gobierno."
  - id: b
    text:
      es: "La potestad legislativa por delegación del Pleno."
  - id: c
    correct: true
    text:
      es: "La representación colegiada de esta en los actos a que asista."
  - id: d
    text:
      es: "La dirección de las sesiones plenarias sin intervención de la Presidencia."
  explanation:
    es: "El artículo 30.1 hace de la Mesa el órgano rector de la Cámara, con la representación colegiada de esta en los actos a que asista. La representación del artículo 30.1 es colegiada, no exclusiva ante el Gobierno, y la Mesa no ejerce la potestad legislativa, que corresponde a las Cortes. La Presidencia dirige y coordina la acción de la Mesa (apartado 3), de modo que la Mesa no actúa sin ella."
  citation: "art. 30 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1982-5196-art-37
- id: m01-l03-q123
  prompt:
    es: "Conforme al artículo 37 del Reglamento del Congreso de 10 de febrero de 1982, en la elección de la Presidencia del Congreso resulta elegida la persona que obtenga el voto de:"
  options:
  - id: a
    text:
      es: "La mayoría simple de los miembros presentes."
  - id: b
    text:
      es: "Las tres quintas partes de los miembros de la Cámara."
  - id: c
    correct: true
    text:
      es: "La mayoría absoluta de los miembros de la Cámara."
  - id: d
    text:
      es: "La mayoría absoluta de los miembros presentes."
  explanation:
    es: "El artículo 37.1 exige la mayoría absoluta de los miembros de la Cámara en primera votación. La mayoría simple de los presentes y la absoluta de los presentes cambian la base de cómputo o la mayoría. Los tres quintos son la mayoría de la reforma constitucional ordinaria, no la de la Presidencia del Congreso."
  citation: "art. 37 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1982-5196-art-39
- id: m01-l03-q124
  prompt:
    es: "¿Cuál de los siguientes cargos preside la Junta de Portavoces, formada por las personas designadas para las portavocías de los grupos, según el artículo 39.1 del Reglamento del Congreso de 10 de febrero de 1982?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente o Presidenta del Congreso."
  - id: b
    text:
      es: "El Secretario o Secretaria General del Congreso."
  - id: c
    text:
      es: "El portavoz del grupo parlamentario mayoritario."
  - id: d
    text:
      es: "Una de las Vicepresidencias de la Mesa."
  explanation:
    es: "La Junta de Portavoces se reúne bajo la presidencia del Presidente o Presidenta del Congreso, que la convoca. El Secretario General asiste a las reuniones pero no las preside. El portavoz mayoritario es un miembro de la Junta. Las Vicepresidencias asisten (apartado 3), sin presidir."
  citation: "art. 39.1 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1982-5196-art-43
- id: m01-l03-q128
  prompt:
    es: "En el Congreso de los Diputados, las Comisiones deben concluir la tramitación de cualquier asunto en un plazo máximo, salvo excepciones, de:"
  options:
  - id: a
    text:
      es: "Un mes, salvo que la Constitución o el Reglamento impongan otro plazo."
  - id: b
    correct: true
    text:
      es: "Dos meses, salvo que la Constitución o el Reglamento impongan otro plazo o la Mesa lo amplíe o reduzca."
  - id: c
    text:
      es: "Tres meses, sin posibilidad de ampliación."
  - id: d
    text:
      es: "Seis meses, ampliables por el Pleno de la Cámara."
  explanation:
    es: "El artículo 43.3 da dos meses, con dos excepciones: que la Constitución o el Reglamento impongan un plazo distinto y que la Mesa, por circunstancias excepcionales, lo amplíe o reduzca. Un mes y tres meses cambian la cifra. Los seis meses y la ampliación por el Pleno cambian el plazo y el órgano: es la Mesa la que puede ampliarlo o reducirlo."
  citation: "art. 43 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "plazo"
