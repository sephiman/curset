    text:
      es: "las cuotas soportadas en operaciones realizadas en el último trimestre del año."
  explanation:
    es: "La limitación de los artículos 95 y 96 se mantiene también en la prorrata especial. Las cuotas de bienes de inversión, de servicios de no establecidos o del último trimestre no están excluidas por el artículo 106.Dos."
