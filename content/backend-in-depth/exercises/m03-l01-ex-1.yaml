- id: m03-l01-q01
  prompt:
    en: In the Java Virtual Machine Specification, which run-time data area is private to each thread, created at
      the same time as the thread, and stores frames?
  options:
  - id: a
    correct: true
    text:
      en: The Java Virtual Machine stack
  - id: b
    text:
      en: The heap
  - id: c
    text:
      en: The method area
  - id: d
    text:
      en: The run-time constant pool
  explanation:
    en: The Java Virtual Machine stack is private to each thread and stores frames. The heap is not private, because
      it is shared among all Java Virtual Machine threads. The method area is not private either, because the specification
      makes it shared among all threads. The run-time constant pool belongs to a class or interface rather than
      to a thread, because it represents the `constant_pool` table of a class file.
  citation: jvms-2#jvms-2.5.2
  extract:
    en: Each Java Virtual Machine thread has a private Java Virtual Machine stack, created at the same time as the
      thread.
- id: m03-l01-q02
  prompt:
    en: In Java 25, a JVM runs without the `-XX:MaxMetaspaceSize` option. What limit applies by default to the native
      memory that can be allocated for class metadata?
  options:
  - id: a
    text:
      en: 256 MB
  - id: b
    text:
      en: 25 percent of the available memory
  - id: c
    correct: true
    text:
      en: No limit
  - id: d
    text:
      en: The maximum size of the Java heap
  explanation:
    en: By default the size of Metaspace isn't limited, so no limit applies. A limit of 256 MB is only the example
      value shown for the option, and the default size isn't limited. A limit of 25 percent of the available memory
      is wrong, because the default size isn't limited. A limit equal to the maximum size of the Java heap is wrong
      for the same reason, because the default size isn't limited.
  citation: jdk-tool-java#advanced-garbage-collection-options-for-java
- id: m03-l01-q03
  prompt:
    en: In Java 25, no heap size option is set and a container limits the memory. By default, what percentage of
      the maximum available memory does `-XX:MaxRAMPercentage` allow for the Java heap?
  options:
  - id: a
    text:
      en: 50 percent
  - id: b
    correct: true
    text:
      en: 25 percent
  - id: c
    text:
      en: 75 percent
  - id: d
    text:
      en: 10 percent
  explanation:
    en: The default value of `-XX:MaxRAMPercentage` is 25 percent. A default of 50 percent is the value of `-XX:MinRAMPercentage`,
      not of `-XX:MaxRAMPercentage`, which defaults to 25 percent. A default of 75 percent is only the example value
      in the documentation, because the default is 25 percent. A default of 10 percent is wrong, because the documented
      default is 25 percent.
  citation: jdk-tool-java#advanced-garbage-collection-options-for-java
- id: m03-l01-q04
  prompt:
    en: For the G1 collector in Java 25, what is the default value of the soft pause-time goal that `-XX:MaxGCPauseMillis`
      sets, when the option is not given?
  options:
  - id: a
    text:
      en: 50 milliseconds
  - id: b
    text:
      en: 500 milliseconds
  - id: c
    text:
      en: 1 second
  - id: d
    correct: true
    text:
      en: 200 milliseconds
  explanation:
    en: For G1 the default maximum pause time target is 200 milliseconds. A default of 50 milliseconds is wrong,
      because the documented G1 default is 200 milliseconds. The 500 milliseconds value is only the example in the
      documentation, because the G1 default is 200 milliseconds. A default of 1 second is wrong, because the G1
      default target is 200 milliseconds.
  citation: jdk-tool-java#advanced-garbage-collection-options-for-java
- id: m03-l01-q05
  prompt:
    en: Classes archived for application class-data sharing are stored in an optimized format. How does their size
      compare with the same classes stored in JAR files or in the JDK runtime image?
  options:
  - id: a
    text:
      en: About 2 to 5 times smaller
  - id: b
    text:
      en: About the same size
  - id: c
    correct: true
    text:
      en: About 2 to 5 times larger
  - id: d
    text:
      en: About 10 to 20 times larger
  explanation:
    en: Classes in the CDS archive are about 2 to 5 times larger than in JAR files or the JDK runtime image. Being
      2 to 5 times smaller is wrong, because the documentation gives the archived format as larger. Being about
      the same size is wrong, because the archived format is larger by a factor of 2 to 5. Being 10 to 20 times
      larger overstates the documented factor of 2 to 5.
  citation: jdk-tool-java#application-class-data-sharing
- id: m03-l01-q07
  prompt:
    en: According to the JDK garbage collection tuning guide for Java 25, how does the G1 collector organize the
      Java heap?
  options:
  - id: a
    text:
      en: As one contiguous young space followed by one contiguous old space
  - id: b
    correct: true
    text:
      en: As a set of equally sized heap regions
  - id: c
    text:
      en: As regions whose size is chosen per object by each allocation request
  - id: d
    text:
      en: As fixed young and old areas, with no region as the unit of reclamation
  explanation:
    en: G1 partitions the heap into a set of equally sized heap regions. A contiguous young space followed by a
      contiguous old space is wrong, because G1 typically lays its regions out in a noncontiguous pattern in memory.
      Regions sized per allocation request are wrong, because the regions are equally sized. Fixed areas with no
      region as the unit of reclamation are wrong, because a region is the unit of memory allocation and memory
      reclamation.
  citation: jdk-gctuning-g1#JSGCT-GUID-15921907-B297-43A4-8C48-DC88035BC7CF
- id: m03-l01-q08
  prompt:
    en: In Java 25, which statement about generations in ZGC is correct, given JEP 439, JEP 474 and the removal
      of the `ZGenerational` option from the JDK?
  options:
  - id: a
    text:
      en: ZGC is non-generational, and generational mode must be enabled with `-XX:+ZGenerational`
  - id: b
    text:
      en: ZGC is generational by default, and `-XX:-ZGenerational` still selects the non-generational mode
  - id: c
    text:
      en: ZGC is generational, but young and old objects share a single generation
  - id: d
    correct: true
    text:
      en: ZGC is a generational garbage collector
  explanation:
    en: As of JDK 24 ZGC is a generational garbage collector. The claim that ZGC is non-generational unless `-XX:+ZGenerational`
      is set is wrong, because ZGC is generational as of JDK 24. The claim that `-XX:-ZGenerational` still selects
      the non-generational mode is wrong, because the `ZGenerational` option has been removed. The claim of a single
      shared generation is wrong, because JEP 439 maintains separate generations for young and old objects.
  citation: jdk-gctuning-zgc#JSGCT-GUID-8637B158-4F35-4E2D-8E7B-9DAEF15BB3CD
- id: m03-l01-q09
  prompt:
    en: Which statement about the Z Garbage Collector in the JDK garbage collection tuning guide for Java 25 is
      correct?
  options:
  - id: a
    text:
      en: Its pause times grow in proportion to the heap size, so it suits only small heaps
  - id: b
    text:
      en: It supports heap sizes of up to 1TB
  - id: c
    correct: true
    text:
      en: Its pause times are independent of the heap size that is being used
  - id: d
    text:
      en: It does its expensive work in long stop-the-world pauses
  explanation:
    en: ZGC pause times are independent of the heap size that is being used. Pause times growing in proportion to
      the heap size is wrong, because they are independent of it. A limit of 1TB is wrong, because ZGC works well
      with heap sizes up to 16TB. Long stop-the-world pauses are wrong, because ZGC performs all expensive work
      concurrently, without stopping application threads for more than a millisecond.
  citation: jdk-gctuning-zgc#JSGCT-GUID-8637B158-4F35-4E2D-8E7B-9DAEF15BB3CD
- id: m03-l01-q11
  prompt:
    en: A service throws `java.lang.OutOfMemoryError` with the detail message `Java heap space`. According to the
      JDK troubleshooting guide for Java 25, what does this detail message indicate?
  options:
  - id: a
    text:
      en: The application certainly has a memory leak, whatever the heap size
  - id: b
    correct: true
    text:
      en: An object could not be allocated in the Java heap
  - id: c
    text:
      en: The Metaspace for class metadata has been exhausted
  - id: d
    text:
      en: An array larger than the VM implementation limit was requested
  explanation:
    en: The detail message `Java heap space` indicates that an object could not be allocated in the Java heap. A
      certain memory leak is wrong, because this error does not necessarily imply a leak. An exhausted Metaspace
      is wrong, because that case throws the detail message `Metaspace`. An oversized array request is wrong, because
      the detail message for it is `Requested array size exceeds VM limit`, which applies irrespective of how much
      heap is available.
  citation: jdk-troubleshoot-memleaks#JSTGD-GUID-19F6D28E-75A1-4480-9879-D0932B2F305B
- id: m03-l01-q12
  prompt:
    en: In Java 25, `jcmd <pid> GC.heap_dump` runs without the `-all` option. What does the command do before it
      writes the dump, according to the `jcmd` reference?
  options:
  - id: a
    correct: true
    text:
      en: It requests a full GC
  - id: b
    text:
      en: It dumps all objects, including unreachable objects
  - id: c
    text:
      en: It writes the dump in JSON format
  - id: d
    text:
      en: It writes the dump in gzipped format at the strongest compression
  explanation:
    en: Without the `-all` option, `GC.heap_dump` requests a full GC. Dumping all objects, including unreachable
      ones, is wrong, because `-all` is false by default. A JSON dump is wrong, because the command generates a
      HPROF format dump of the Java heap. A gzipped dump at the strongest compression is wrong, because the dump
      is gzipped only if `-gz` is specified.
  citation: jdk-tool-jcmd#commands-for-jcmd
- id: m03-l01-q13
  prompt:
    en: In Java 25, which `jcmd` command provides statistics about the Java heap usage, with the total size and
      the instance count of each class type?
  options:
  - id: a
    text:
      en: '`GC.heap_dump`'
  - id: b
    text:
      en: '`Thread.print`'
  - id: c
    correct: true
    text:
      en: '`GC.class_histogram`'
  - id: d
    text:
      en: '`GC.finalizer_info`'
  explanation:
    en: '`GC.class_histogram` provides statistics about the Java heap usage. `GC.heap_dump` is wrong, because it
      generates a HPROF format dump of the heap. `Thread.print` is wrong, because it prints all threads with stack
      traces. `GC.finalizer_info` is wrong, because it provides information about the Java finalization queue.'
  citation: jdk-tool-jcmd#commands-for-jcmd
- id: m03-l01-q14
  prompt:
    en: In a thread dump, which thread state describes a thread that is waiting indefinitely for another thread
      to perform a particular action?
  options:
  - id: a
    text:
      en: '`BLOCKED`'
  - id: b
    correct: true
    text:
      en: '`WAITING`'
  - id: c
    text:
      en: '`TIMED_WAITING`'
  - id: d
    text:
      en: '`RUNNABLE`'
  explanation:
    en: '`WAITING` is the state of a thread waiting indefinitely for another thread to perform a particular action.
      `BLOCKED` is wrong, because it describes a thread blocked and waiting for a monitor lock. `TIMED_WAITING`
      is wrong, because it describes a wait for up to a specified waiting time. `RUNNABLE` is wrong, because it
      describes a thread that is executing in the JVM.'
  citation: jdk-troubleshoot-tools#JSTGD-GUID-0110914C-4E91-4983-9CDB-412BC6C36AEA
- id: m03-l01-q16
  prompt:
    en: In Java 25, which `-XX:AOTMode` value performs the Assembly phase that writes the AOT cache, and does not
      run the application itself?
  options:
  - id: a
    text:
      en: '`record`'
  - id: b
    text:
      en: '`on`'
  - id: c
    text:
      en: '`off`'
  - id: d
    correct: true
    text:
      en: '`create`'
  explanation:
    en: '`create` performs the Assembly phase and does not execute the application. `record` is wrong, because it
      executes the application in the training phase. `on` is wrong, because it executes the application in the
      Production phase. `off` is wrong, because no AOT cache is used and the other AOT command line options are
      ignored.'
  citation: jdk-tool-java#ahead-of-time-cache
- id: m03-l01-q17
  prompt:
    en: A JVM in Java 25 cannot load the AOT cache because the JDK release differs. Which `-XX:AOTMode` value makes
      it print an error message and exit immediately?
  options:
  - id: a
    text:
      en: '`auto`'
  - id: b
    correct: true
    text:
      en: '`on`'
  - id: c
    text:
      en: '`off`'
  - id: d
    text:
      en: '`record`'
  explanation:
    en: With `on` the JVM prints an error message and exits immediately when the cache fails to load. `auto` is
      wrong, because the JVM then continues execution without using the AOT cache. `off` is wrong, because no AOT
      cache is used at all and the other AOT options are ignored. `record` is wrong, because it executes the application
      in the training phase.
  citation: jdk-tool-java#ahead-of-time-cache
- id: m03-l01-q18
  prompt:
    en: A team moves a container image to arm64 hosts and keeps the same JDK release and the same application. What
      must it do with an existing AOT cache, according to the JDK documentation?
  options:
  - id: a
    correct: true
    text:
      en: Recreate it, because an AOT cache is specific to an OS and CPU architecture
  - id: b
    text:
      en: Keep it, because only the JDK release makes an AOT cache specific
  - id: c
    text:
      en: Keep it, because the JVM rebuilds a stale cache automatically on the next run
  - id: d
    text:
      en: Keep it, because only the application class path matters
  explanation:
    en: An AOT cache is specific to the OS and CPU architecture, so a change to arm64 means the cache must be recreated.
      Keeping it because only the JDK release matters is wrong, because the cache is also specific to a particular
      OS and CPU architecture. Relying on an automatic rebuild is wrong, because if any of the combination changes
      you must recreate the AOT cache. Keeping it because only the class path matters is wrong, because the cache
      is specific to a particular JDK release as well.
  citation: jdk-tool-java#ahead-of-time-cache
- id: m03-l01-q19
  prompt:
    en: In Java 25, which single launcher option makes the JVM run a training run and then create the AOT cache,
      without separate record and create commands?
  options:
  - id: a
    correct: true
    text:
      en: '`-XX:AOTCacheOutput=app.aot`'
  - id: b
    text:
      en: '`-XX:AOTCache=app.aot`'
  - id: c
    text:
      en: '`-XX:AOTMode=create`'
  - id: d
    text:
      en: '`-XX:AOTMode=on`'
  explanation:
    en: '`-XX:AOTCacheOutput`, used alone, splits the launch into a training run and a cache creation. `-XX:AOTCache`
      is wrong, because it is how a production run that uses the AOT cache is started. `-XX:AOTMode=create` is wrong,
      because the application itself is not executed in the Assembly phase. `-XX:AOTMode=on` is wrong, because it
      executes the application in the Production phase.'
  citation: jep-514#Description
- id: m03-l01-q20
  prompt:
    en: In Java 25, what is the net effect of the method profiles that training runs store in the AOT cache on JIT
      compilation during production runs?
  options:
  - id: a
    correct: true
    text:
      en: The JIT runs earlier and with more accuracy
  - id: b
    text:
      en: The JIT is no longer needed, because the cached profiles replace online profiling
  - id: c
    text:
      en: Online profiling is switched off during production runs
  - id: d
    text:
      en: Production runs start slower, because the profiles must be loaded first
  explanation:
    en: The cached profiles make the JIT run earlier and with more accuracy. Dropping the JIT is wrong, because
      the JVM continues to profile and optimize the application as it runs. Switching off online profiling is wrong,
      because cached profiles do not prevent additional profiling during production runs. Slower start-up is wrong,
      because production runs are both faster to start and faster to achieve peak performance.
  citation: jep-515#Description
- id: m03-l01-q21
  prompt:
    en: Which restriction does Spring's ahead-of-time processing impose on an application, according to the Spring
      Framework 7 reference documentation?
  options:
  - id: a
    text:
      en: '`@Profile` configuration can still be chosen freely when the application starts'
  - id: b
    text:
      en: Environment properties still decide at runtime whether a `@Conditional` bean exists
  - id: c
    correct: true
    text:
      en: The beans defined in the application cannot change at runtime
  - id: d
    text:
      en: The classpath can still change at runtime, as long as the beans stay fixed
  explanation:
    en: Spring AOT requires that the beans defined in the application cannot change at runtime. Choosing `@Profile`
      at startup is wrong, because profile-specific configuration needs to be chosen at build time. Deciding a `@Conditional`
      bean from environment properties at runtime is wrong, because such properties are only considered at build
      time. A classpath that changes at runtime is wrong, because the classpath is fixed and fully defined at build
      time.
  citation: spring-fw-aot#aot.introduction
  extract:
    en: 'The beans defined in your application cannot change at runtime, meaning:'
- id: m03-l01-q22
  prompt:
    en: In a GraalVM native image built from a Spring Boot application, what happens to code that static analysis
      cannot reach from the main entry point of the application?
  options:
  - id: a
    text:
      en: It is kept and loaded lazily the first time it is used
  - id: b
    text:
      en: It is kept, and can still be added later through class loading
  - id: c
    text:
      en: It is kept in the image but never initialized
  - id: d
    correct: true
    text:
      en: It is removed and is not part of the executable
  explanation:
    en: Code that cannot be reached when the native image is created is removed and is not part of the executable.
      Lazy loading is wrong, because there is no lazy class loading in a native image. Adding it later through class
      loading is wrong, because no new elements can be added at run time. Keeping it uninitialized in the image
      is wrong, because only reachable elements are included in the final image.
  citation: spring-boot-native-intro#packaging.native-image.introducing-graalvm-native-images.key-differences-with-jvm-deployments
