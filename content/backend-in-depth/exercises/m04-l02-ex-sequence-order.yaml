- id: m04-l02-v-kotlin-sequence-order-001
  prompt:
    en: |-
      What does this program print? The first line is the `log` of every `filter` and `map` call in order, the second the resulting list.

      ```kotlin
      fun main() {
          val log = StringBuilder()
          val result = listOf(3, 8, 5, 6, 9, 4)
              .filter { log.append("f$it "); it % 2 == 0 }
              .map { log.append("m$it "); it * 10 }
              .take(1)
              .toList()
          println(log.toString().trim())
          println(result)
      }
      ```
  options:
  - id: a
    text:
      en: '`f3 f8 f5 f6 f9 f4 m8 m6 m4`, `[80]`'
    correct: true
  - id: b
    text:
      en: '`f3 f8 m8`, `[80]`'
  - id: c
    text:
      en: '`m3 m8 m5 m6 m9 m4 f30 f80 f50 f60 f90 f40`, `[30]`'
  - id: d
    text:
      en: '`f3 f8 f5 f6 f9 f4 m8 m6 m4`, `[60, 40]`'
  explanation:
    en: '`filter` keeps the even numbers of `3, 8, 5, 6, 9, 4`, `map` multiplies each by `10` and `take(1)` limits the result.
      A list runs `filter` for every element before `map` starts, so `map` runs only for the even numbers that are left. `take`
      then cuts the finished list, so it cannot remove any `filter` or `map` call from the log. The first line is the log
      and the second the list, so the program prints `f3 f8 f5 f6 f9 f4 m8 m6 m4`, `[80]`. `f3 f8 m8`, `[80]` comes from this
      mistake: believing the list pipeline is lazy like a sequence. A list runs `filter` for every element before `map` starts,
      and `take` cuts only the finished list. `m3 m8 m5 m6 m9 m4 f30 f80 f50 f60 f90 f40`, `[30]` comes from this mistake:
      putting `map` before `filter`. The pipeline calls `filter` first, so `map` receives only the even numbers. `f3 f8 f5
      f6 f9 f4 m8 m6 m4`, `[60, 40]` comes from this mistake: using `drop` where `take` was needed. `take(1)` keeps the results
      up to a size of `1`, and `drop(1)` would skip that many instead.'
  family: kotlin-sequence-order
  code_reading: true
  citation: kotlin-docs-sequences#iterable
  difficulty: 3
  tags: &id001
  - kotlin
  - sequences
