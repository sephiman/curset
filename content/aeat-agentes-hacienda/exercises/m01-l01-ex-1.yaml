type: quiz
variants:
# anchor: boe-a-1978-31229-art-2
- id: m01-l01-q0011
  prompt:
    es: "Según el artículo 2 de la Constitución Española de 1978, esta reconoce y garantiza a las nacionalidades y regiones que integran la Nación española:"
  options:
  - id: a
    correct: true
    text:
      es: "El derecho a la autonomía, y la solidaridad entre todas ellas."
  - id: b
    text:
      es: "El derecho a la libre determinación."
  - id: c
    text:
      es: "El derecho a la soberanía."
  - id: d
    text:
      es: "Un régimen fiscal propio sin solidaridad."
  explanation:
    es: "El artículo 2 reconoce y garantiza el derecho a la autonomía de las nacionalidades y regiones y la solidaridad entre todas ellas. La libre determinación excede ese derecho y choca con la indisoluble unidad de la Nación en la que el propio artículo funda la Constitución. La soberanía no es de las nacionalidades y regiones: reside en el pueblo español (artículo 1.2). El régimen fiscal propio sin solidaridad contradice la garantía expresa de la solidaridad entre todas ellas."
  citation: "art. 2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-7
- id: m01-l01-q0013
  prompt:
    es: "¿Cuál de las siguientes organizaciones debe tener, conforme al artículo 7 de la Constitución Española de 1978, una estructura interna y un funcionamiento democráticos?"
  options:
  - id: a
    text:
      es: "Las Fuerzas Armadas."
  - id: b
    correct: true
    text:
      es: "Los sindicatos de trabajadores y las asociaciones empresariales."
  - id: c
    text:
      es: "Las asociaciones de consumidores y usuarios."
  - id: d
    text:
      es: "Los municipios y las provincias."
  explanation:
    es: "El artículo 7 aplica ese requisito a los sindicatos de trabajadores y a las asociaciones empresariales, igual que el artículo 6 lo aplica a los partidos políticos. Las Fuerzas Armadas aparecen en el artículo 8.1 con otra función, la de defender la soberanía y el ordenamiento constitucional. Las asociaciones de consumidores y usuarios no son los sujetos del artículo 7, que habla de intereses económicos y sociales de trabajadores y empresarios. Los municipios y las provincias son entidades territoriales del artículo 137, no organizaciones de ese tipo."
  citation: "art. 7 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-8
- id: m01-l01-q0015
  prompt:
    es: "Conforme al artículo 8.1 de la Constitución Española de 1978, además de garantizar la soberanía e independencia de España, las Fuerzas Armadas tienen como misión:"
  options:
  - id: a
    correct: true
    text:
      es: "Defender su integridad territorial y el ordenamiento constitucional."
  - id: b
    text:
      es: "Mantener el orden público y garantizar la seguridad."
  - id: c
    text:
      es: "Proteger el libre ejercicio de los derechos y libertades."
  - id: d
    text:
      es: "Defender la unidad de la Nación y la forma política del Estado."
  explanation:
    es: "Junto a garantizar la soberanía e independencia, el artículo 8.1 les encomienda defender la integridad territorial de España y el ordenamiento constitucional. El orden público, la seguridad y la protección del libre ejercicio de los derechos son misiones de otro tipo: el artículo limita la misión de las Fuerzas Armadas a esos cuatro objetos. La defensa de la unidad de la Nación y de la forma política sustituye «integridad territorial» y «ordenamiento constitucional» por conceptos distintos."
  citation: "art. 8.1 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-10
- id: m01-l01-q0024
  prompt:
    es: "De acuerdo con el artículo 10.2 de la Constitución Española de 1978, las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con:"
  options:
  - id: a
    correct: true
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España."
  - id: b
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados sobre esas materias firmados por España, aunque no estén ratificados."
  - id: c
    text:
      es: "La Declaración Universal de Derechos Humanos y las leyes orgánicas que desarrollen esos derechos."
  - id: d
    text:
      es: "Los principios rectores de la política social y económica del capítulo tercero."
  explanation:
    es: "El artículo 10.2 remite a «la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España». Exige ratificación, no basta la firma. No remite a las leyes orgánicas de desarrollo ni a los principios rectores del capítulo tercero."
  citation: "art. 10.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-11
- id: m01-l01-q0026
  prompt:
    es: "Según el artículo 11.2 de la Constitución Española de 1978, dentro del capítulo primero del título I, De los españoles y los extranjeros, no podrá ser privado de su nacionalidad:"
  options:
  - id: a
    text:
      es: "Ningún español, aunque la haya adquirido por naturalización."
  - id: b
    correct: true
    text:
      es: "Ningún español de origen."
  - id: c
    text:
      es: "Ningún español condenado por delitos contra la seguridad del Estado."
  - id: d
    text:
      es: "Ningún español, salvo que lo disponga una ley orgánica."
  explanation:
    es: "El artículo 11.2 protege a «ningún español de origen». La protección no alcanza a quien adquirió la nacionalidad por otra vía, de modo que la opción que la extiende a los naturalizados es falsa. La regla no distingue por condenas ni admite salvedades por ley orgánica: protege a todo español de origen."
  citation: "art. 11.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-15
- id: m01-l01-q0029
  prompt:
    es: "Señale la respuesta correcta sobre la pena de muerte, según lo que dispone el artículo 15 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Queda abolida sin excepción alguna."
  - id: b
    text:
      es: "Queda abolida, salvo para los delitos de terrorismo que determine una ley orgánica."
  - id: c
    correct: true
    text:
      es: "Queda abolida, salvo lo que dispongan las leyes penales militares para tiempos de guerra."
  - id: d
    text:
      es: "Puede establecerla una ley orgánica para los delitos de mayor gravedad."
  explanation:
    es: "El artículo 15 abole la pena de muerte con una única salvedad: lo que dispongan las leyes penales militares para tiempos de guerra. La opción de la abolición sin excepción olvida esa salvedad. La del terrorismo y la de una ley orgánica para los delitos más graves introducen excepciones que el artículo no contiene."
  citation: "art. 15 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-30
- id: m01-l01-q0044
  prompt:
    es: "Conforme al artículo 30.1 de la Constitución Española de 1978, primero de la sección 2.ª del capítulo segundo, los españoles tienen, respecto de la defensa de España:"
  options:
  - id: a
    text:
      es: "El deber de defenderla, pero no el derecho."
  - id: b
    correct: true
    text:
      es: "El derecho y el deber de defenderla."
  - id: c
    text:
      es: "El derecho de defenderla, con carácter voluntario."
  - id: d
    text:
      es: "El deber de defenderla únicamente en tiempo de guerra."
  explanation:
    es: "El artículo 30.1 reconoce a los españoles «el derecho y el deber de defender a España». Quitar el derecho, quitar el deber o limitar el deber al tiempo de guerra recorta esa doble fórmula."
  citation: "art. 30 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-38
- id: m01-l01-q0048
  prompt:
    es: "La sección 2.ª del capítulo segundo del título I de la Constitución Española de 1978, De los derechos y deberes de los ciudadanos, comienza con el derecho y el deber de defender a España y termina con:"
  options:
  - id: a
    text:
      es: "El derecho a la negociación colectiva laboral."
  - id: b
    text:
      es: "El derecho a contraer matrimonio con plena igualdad jurídica."
  - id: c
    correct: true
    text:
      es: "La libertad de empresa."
  - id: d
    text:
      es: "El sistema tributario justo y no confiscatorio."
  explanation:
    es: "La sección 2.ª va del derecho y el deber de defender a España (artículo 30) a la libertad de empresa (artículo 38), que la cierra. La negociación colectiva laboral, el matrimonio y el sistema tributario son derechos y deberes de la misma sección, pero intermedios."
  citation: "art. 38 CE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q0058
  prompt:
    es: "Según el artículo 53.1 de la Constitución Española de 1978, el ejercicio de los derechos y libertades reconocidos en el capítulo segundo del título I solo podrá regularse:"
  options:
  - id: a
    text:
      es: "Por ley o por reglamento, que en todo caso deberán respetar su contenido esencial."
  - id: b
    text:
      es: "Por ley, que podrá limitar su contenido esencial cuando lo exija el interés general."
  - id: c
    text:
      es: "Por ley, sin otro límite que el respeto a los tratados internacionales."
  - id: d
    correct: true
    text:
      es: "Por ley, que en todo caso deberá respetar su contenido esencial."
  explanation:
    es: "El artículo 53.1 dice: «Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades». El reglamento queda excluido. El contenido esencial es un límite absoluto para la ley, que no puede reducirlo ni por razones de interés general."
  citation: "art. 53.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q0059
  prompt:
    es: "¿Cuál de los siguientes derechos, recogido en la sección 2.ª del capítulo segundo del título I, es también susceptible de recurso de amparo según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El derecho a la objeción de conciencia."
  - id: b
    text:
      es: "El derecho a la propiedad privada y a la herencia."
  - id: c
    text:
      es: "El derecho al trabajo y a la libre elección de profesión u oficio."
  - id: d
    text:
      es: "La libertad de empresa en el marco de la economía de mercado."
  explanation:
    es: "El artículo 53.2 limita el amparo al artículo 14 y a la sección 1.ª, y añade: «Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30». La propiedad privada, el derecho al trabajo y la libertad de empresa están en la sección 2.ª y no tienen amparo."
  citation: "art. 53.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q0068
  prompt:
    es: "¿Cuál de los siguientes derechos puede ser suspendido, según el artículo 55.1 de la Constitución Española de 1978, cuando se acuerde la declaración del estado de excepción o de sitio?"
  options:
  - id: a
    text:
      es: "El derecho a la vida y a la integridad física y moral."
  - id: b
    correct: true
    text:
      es: "El derecho de huelga de los trabajadores."
  - id: c
    text:
      es: "La igualdad de los españoles ante la ley."
  - id: d
    text:
      es: "El derecho a acceder a las funciones y cargos públicos."
  explanation:
    es: "El artículo 55.1 incluye entre los derechos suspendibles el de huelga, del artículo 28.2. La lista es cerrada: artículos 17, 18.2 y 3, 19, 20.1.a y d, 20.5, 21, 28.2 y 37.2. La vida y la integridad (artículo 15), la igualdad ante la ley (artículo 14) y el acceso a las funciones y cargos públicos (artículo 23.2) están fuera de ella."
  citation: "art. 55.1 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-14
- id: m01-l01-q0082
  prompt:
    es: "Según el artículo 14 de la Constitución Española de 1978, los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de:"
  options:
  - id: a
    correct: true
    text:
      es: "Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social."
  - id: b
    text:
      es: "Nacimiento, raza, sexo, religión u opinión, sin que la ley pueda añadir otras causas."
  - id: c
    text:
      es: "Raza, sexo, religión, opinión o nacionalidad, en los términos que establezca la ley."
  - id: d
    text:
      es: "Nacimiento, raza, sexo o religión, salvo lo que dispongan las leyes orgánicas."
  explanation:
    es: "El artículo 14 enumera «nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social». La lista es abierta, por eso es incorrecta la opción que la cierra. Las otras dos quitan causas del texto, añaden la nacionalidad o introducen salvedades que el artículo no contiene."
  citation: "art. 14 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-29
- id: m01-l01-q0089
  prompt:
    es: "¿Cómo pueden ejercer el derecho de petición los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Individual y colectivamente, como el resto de los españoles."
  - id: b
    text:
      es: "Solo colectivamente, a través de sus asociaciones profesionales."
  - id: c
    correct: true
    text:
      es: "Solo individualmente y con arreglo a lo dispuesto en su legislación específica."
  - id: d
    text:
      es: "Solo individualmente y previa autorización de su superior jerárquico."
  explanation:
    es: "El artículo 29.2 dice que podrán ejercer este derecho «sólo individualmente y con arreglo a lo dispuesto en su legislación específica». La petición colectiva es la regla general del artículo 29.1, que no les alcanza. El artículo no exige autorización del superior."
  citation: "art. 29.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
