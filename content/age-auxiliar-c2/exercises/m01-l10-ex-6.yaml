    text:
      es: "El Estatuto del Tribunal de Justicia."
  - id: d
    text:
      es: "El Reglamento de la Comisión."
  explanation:
    es: "Las materias específicas las determina el Estatuto del Tribunal de Justicia de la Unión Europea. No las fijan el reglamento interno del Consejo, el del Parlamento ni el de la Comisión, que regulan el funcionamiento de cada una de esas instituciones."
  citation: "art. 256.3 TFUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016e-pro-03-art-50-ter
- id: m01-l10-q126
  prompt:
    es: "Según el artículo 50 ter del Estatuto del Tribunal de Justicia de la Unión Europea, ¿cuál de las siguientes materias es una de aquellas en las que el Tribunal General conoce de peticiones de decisión prejudicial?"
  options:
  - id: a
    text:
      es: "La protección de los datos personales."
  - id: b
    correct: true
    text:
      es: "El régimen de comercio de derechos de emisión de gases de efecto invernadero."
  - id: c
    text:
      es: "El derecho de asilo."
  - id: d
    text:
      es: "La libre circulación de trabajadores."
  explanation:
    es: "El régimen de comercio de derechos de emisión de gases de efecto invernadero figura entre las materias del artículo 50 ter. La protección de datos, el derecho de asilo y la libre circulación de trabajadores no están en la lista."
  citation: "art. 50 ter Estatuto del Tribunal de Justicia de la Unión Europea, Protocolo n.º 3"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016e-pro-03-art-50-ter
- id: m01-l10-q127
  prompt:
    es: "Conforme al artículo 50 ter del Estatuto del Tribunal de Justicia de la Unión Europea, el Tribunal General conoce de peticiones de decisión prejudicial comprendidas exclusivamente en materias como la clasificación arancelaria de las mercancías y:"
  options:
  - id: a
    correct: true
    text:
      es: "La compensación y asistencia a los pasajeros en caso de denegación de embarque o de retraso o cancelación de los servicios de transporte."
  - id: b
    text:
      es: "La protección de los consumidores en los contratos celebrados a distancia."
