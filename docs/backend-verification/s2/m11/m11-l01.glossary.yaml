- id: g-mutable-reduction
  term:
    en: mutable reduction
  definition:
    en: A mutable reduction operation accumulates input elements into a mutable result container, such as a Collection or StringBuilder, as it processes the elements in the stream.
  origin: m11-l01
  citation: javadoc-stream-package#MutableReduction
- id: g-gatherer
  term:
    en: gatherer
  definition:
    en: An intermediate operation that transforms a stream of input elements into a stream of output elements, optionally applying a final action when the end of the upstream is reached.
  origin: m11-l01
  citation: javadoc-gatherer#interface-gatherer-t-a-r
- id: g-stateful-lambda
  term:
    en: stateful lambda
  definition:
    en: A stateful lambda is one whose result depends on any state which might change during the execution of the stream pipeline.
  origin: m11-l01
  citation: javadoc-stream-package#Statelessness
