# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0035
  prompt:
    es: "De acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán motivados los actos que se separen:"
  options:
  - id: a
    text:
      es: "Del criterio seguido en actuaciones precedentes, pero no del dictamen de órganos consultivos."
  - id: b
    text:
      es: "De las instrucciones del superior jerárquico o de las circulares de servicio."
  - id: c
    text:
      es: "De la práctica de otras Administraciones Públicas o de sus órganos consultivos."
  - id: d
    correct: true
    text:
      es: "Del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos."
  explanation:
    es: "El artículo 35.1.c) exige motivar los actos «que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos». Comprende los dos supuestos, así que la opción que deja fuera el dictamen de órganos consultivos es incorrecta. Las instrucciones del superior y la práctica de otras Administraciones no figuran en esa letra."
  citation: "art. 35.1.c) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0037
  prompt:
    es: "Según el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo han de motivarse los actos que enumera?"
  options:
  - id: a
    text:
      es: "Con exposición detallada de los hechos y de la jurisprudencia aplicable."
  - id: b
    text:
      es: "Con remisión a los informes y dictámenes que obren en el expediente."
  - id: c
    text:
      es: "Con sucinta referencia a la norma que atribuye la competencia al órgano."
  - id: d
    correct: true
    text:
      es: "Con sucinta referencia de hechos y fundamentos de derecho."
  explanation:
    es: "El artículo 35.1 dice: «Serán motivados, con sucinta referencia de hechos y fundamentos de derecho». La exposición detallada contradice «sucinta». La jurisprudencia no es uno de los dos contenidos que el apartado nombra: hechos y fundamentos de derecho. La referencia a la norma de competencia deja fuera los hechos, que el apartado exige. La remisión a informes no basta por sí sola: el artículo 88.6 dice que la aceptación de informes o dictámenes sirve de motivación cuando se incorporan al texto de la resolución."
  citation: "art. 35.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0038
  prompt:
    es: "En materia de prueba, ¿cuál de los siguientes actos debe motivarse según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El que acuerde la práctica de pruebas de oficio."
  - id: b
    text:
      es: "El que señale el lugar, fecha y hora de la prueba."
  - id: c
    text:
      es: "El que admita las pruebas propuestas por los interesados."
  - id: d
    correct: true
    text:
      es: "El que rechace pruebas propuestas por los interesados."
  explanation:
    es: "El artículo 35.1.f) exige motivar «los actos que rechacen pruebas propuestas por los interesados». La admisión de pruebas, su práctica de oficio y el señalamiento de lugar y fecha no figuran entre los actos del artículo 35.1."
  citation: "art. 35.1.f) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0042
  prompt:
    es: "Según el artículo 35.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará:"
  options:
  - id: a
    text:
      es: "Con sucinta referencia a la puntuación obtenida por cada uno de los aspirantes."
  - id: b
    correct: true
    text:
      es: "De conformidad con lo que dispongan las normas que regulen sus convocatorias."
  - id: c
    text:
      es: "Mediante un informe del órgano de selección que se unirá al expediente."
  - id: d
    text:
      es: "De conformidad con lo que acuerde en cada caso el órgano que resuelva."
  explanation:
    es: "El artículo 35.2 remite a «lo que dispongan las normas que regulen sus convocatorias». No fija la puntuación como contenido de la motivación ni exige un informe del órgano de selección. La remisión es a las normas de la convocatoria, no a lo que decida el órgano que resuelve."
  citation: "art. 35.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0043
  prompt:
    es: "Según el artículo 35.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe quedar acreditado en todo caso en un procedimiento selectivo o de concurrencia competitiva?"
  options:
  - id: a
    text:
      es: "La puntuación de cada uno de los aspirantes."
  - id: b
    correct: true
    text:
      es: "Los fundamentos de la resolución que se adopte."
  - id: c
    text:
      es: "La conformidad de los interesados con ella."
  - id: d
    text:
      es: "La identidad de quienes integran el órgano."
  explanation:
    es: "El artículo 35.2 añade que deben «en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte». Ni la puntuación de cada aspirante, ni la identidad de los miembros del órgano, ni la conformidad de los interesados figuran en el artículo."
  citation: "art. 35.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0127
  prompt:
    es: "De acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán motivados, con sucinta referencia de hechos y fundamentos de derecho, los actos que:"
  options:
  - id: a
    text:
      es: "Amplíen derechos subjetivos o intereses legítimos."
  - id: b
    text:
      es: "Reconozcan derechos subjetivos sin oposición de terceros."
  - id: c
    text:
      es: "Se dicten en procedimientos iniciados a solicitud del interesado."
  - id: d
    correct: true
    text:
      es: "Limiten derechos subjetivos o intereses legítimos."
  explanation:
    es: "El artículo 35.1.a) obliga a motivar los actos que limiten derechos subjetivos o intereses legítimos. La lista del precepto es cerrada y no incluye los actos que amplían o reconocen derechos, ni los que se dictan en procedimientos iniciados a solicitud, por esa sola razón."
  citation: "art. 35 LPAC"
  difficulty: 1
  tags:
  - "motivación"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0128
  prompt:
    es: "Señale la respuesta CORRECTA sobre los actos que resuelven procedimientos de revisión de oficio y recursos administrativos, de acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Serán motivados los actos que resuelvan procedimientos de revisión de oficio, recursos administrativos y procedimientos de arbitraje, pero no los que declaren su inadmisión."
  - id: b
    correct: true
    text:
      es: "Serán motivados los actos que resuelvan procedimientos de revisión de oficio, recursos administrativos y procedimientos de arbitraje, y los que declaren su inadmisión."
  - id: c
    text:
      es: "Serán motivados los actos que resuelvan recursos administrativos, pero no los que resuelvan procedimientos de revisión de oficio."
  - id: d
    text:
      es: "Serán motivados los actos que resuelvan procedimientos de revisión de oficio, siempre que se hayan iniciado a solicitud del interesado, y no los que resuelvan recursos administrativos."
  explanation:
    es: "El artículo 35.1.b) exige motivar los actos que resuelven la revisión de oficio, los recursos administrativos y los procedimientos de arbitraje, así como los que declaren su inadmisión. Excluir la inadmisión, la revisión de oficio o la que se inició de oficio contradice la letra b)."
  citation: "art. 35 LPAC"
  difficulty: 2
  tags:
  - "motivación"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0129
  prompt:
    es: "Señale la respuesta CORRECTA sobre los acuerdos de suspensión de actos, de acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán motivados los acuerdos de suspensión de actos, cualquiera que sea el motivo de esta, así como la adopción de medidas provisionales previstas en el artículo 56."
  - id: b
    text:
      es: "Serán motivados los acuerdos de suspensión de actos solo cuando se adopten de oficio, así como la adopción de medidas provisionales previstas en el artículo 56."
  - id: c
    text:
      es: "Serán motivados los acuerdos de suspensión de actos, cualquiera que sea el motivo de esta, pero no la adopción de medidas provisionales."
  - id: d
    text:
      es: "Serán motivados los acuerdos de suspensión de actos solo cuando causen perjuicios de imposible o difícil reparación."
  explanation:
    es: "El artículo 35.1.d) incluye los acuerdos de suspensión, sea cual sea el motivo, y la adopción de medidas provisionales del artículo 56. No se limita a las suspensiones de oficio, no deja fuera las medidas provisionales y no exige que la suspensión cause perjuicios de difícil reparación, que es la condición del artículo 108 para la revisión de oficio."
  citation: "art. 35 LPAC"
  difficulty: 3
  tags:
  - "motivación"
# anchor: boe-a-2015-10565-art-35
- id: m02-l02-q0130
  prompt:
    es: "¿Cuál de los siguientes acuerdos debe ser motivado, con sucinta referencia de hechos y fundamentos de derecho, según el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El acuerdo de abrir el trámite de audiencia."
  - id: b
    text:
      es: "El acuerdo de nombrar al instructor del procedimiento."
  - id: c
    correct: true
    text:
      es: "El acuerdo de ampliación de plazos."
  - id: d
    text:
      es: "El acuerdo de admitir las pruebas propuestas por los interesados."
  explanation:
    es: "El artículo 35.1.e) incluye entre los actos motivados los acuerdos de aplicación de la tramitación de urgencia, de ampliación de plazos y de realización de actuaciones complementarias. La lista es cerrada y no menciona la apertura de la audiencia ni el nombramiento del instructor, y lo que se motiva en materia de prueba es el rechazo de las pruebas propuestas (letra f), no su admisión."
  citation: "art. 35 LPAC"
  difficulty: 2
  tags:
  - "motivación"
# anchor: boe-a-2015-10565-art-38
- id: m02-l02-q0134
  prompt:
    es: "Según el artículo 38 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán ejecutivos:"
  options:
  - id: a
    correct: true
    text:
      es: "Con arreglo a lo dispuesto en esta Ley."
  - id: b
    text:
      es: "Solo cuando hayan ganado firmeza en vía administrativa."
  - id: c
    text:
      es: "Únicamente cuando el órgano lo declare expresamente en el acto."
  - id: d
    text:
      es: "Con arreglo a lo dispuesto por el órgano que los dicte."
  explanation:
    es: "El artículo 38 declara ejecutivos los actos sujetos al Derecho Administrativo con arreglo a lo dispuesto en la propia Ley, sin condicionarlo a su firmeza ni a una declaración expresa del órgano autor ni a lo que este disponga."
  citation: "art. 38 LPAC"
  difficulty: 1
  tags:
  - "ejecutividad"
# anchor: boe-a-2015-10565-art-39
- id: m02-l02-q0136
  prompt:
    es: "Un organismo de una Administración Pública dicta, en el ejercicio de su propia competencia, una resolución que afecta a la actuación de un órgano de otra Administración Pública distinta, sin relación de jerarquía entre ambos. Según el artículo 39.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿debe ese órgano observar la resolución?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque las normas y actos dictados en el ejercicio de la propia competencia deben ser observados por el resto de los órganos, aunque pertenezcan a otra Administración."
  - id: b
    text:
      es: "No, porque las normas y actos dictados en el ejercicio de la propia competencia solo deben ser observados por los órganos que dependan jerárquicamente del que los dictó."
  - id: c
    text:
      es: "Sí, pero únicamente si ambas Administraciones han suscrito previamente un convenio de colaboración que así lo establezca."
  - id: d
    text:
      es: "No, porque las normas y actos dictados en el ejercicio de la propia competencia solo deben ser observados por los órganos de rango jerárquico inferior al del órgano autor."
  explanation:
    es: "El artículo 39.4 obliga al resto de los órganos administrativos a observar las normas y actos dictados en el ejercicio de la propia competencia, aunque no dependan jerárquicamente entre sí o pertenezcan a otra Administración. No exige jerarquía, ni un convenio previo, ni inferioridad de rango."
  citation: "art. 39 LPAC"
  difficulty: 3
  tags:
  - "eficacia"
# anchor: boe-a-2015-10565-art-39
- id: m02-l02-q0137
  prompt:
    es: "Una Administración Pública dicta un acto favorable para doña Silvia Reyes y le da eficacia retroactiva a una fecha en la que ya existían los supuestos de hecho necesarios, pero con ello lesiona derechos legítimos de un tercero. De acuerdo con el artículo 39.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿es posible esa retroactividad?"
  options:
  - id: a
    text:
      es: "Sí, porque los actos favorables al interesado pueden tener eficacia retroactiva sin más requisito que la existencia de los supuestos de hecho."
  - id: b
    text:
      es: "Sí, si el tercero afectado es indemnizado por la Administración."
  - id: c
    text:
      es: "No, porque los actos favorables al interesado nunca pueden tener eficacia retroactiva."
  - id: d
    correct: true
    text:
      es: "No, porque la eficacia retroactiva no puede lesionar derechos o intereses legítimos de otras personas."
  explanation:
    es: "El artículo 39.3 permite excepcionalmente la eficacia retroactiva de los actos que produzcan efectos favorables al interesado, con dos condiciones: que los supuestos de hecho existieran ya en la fecha de retroacción y que no se lesionen derechos o intereses legítimos de otras personas. Aquí falla la segunda. La retroactividad no está prohibida en todo caso, y el precepto no la condiciona a una indemnización al tercero."
  citation: "art. 39 LPAC"
  difficulty: 3
  tags:
  - "eficacia retroactiva"
