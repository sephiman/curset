- id: m02-l05-q10
  prompt:
    en: Erickson analyses the naive recursive algorithm for the Fibonacci numbers and finds it slow. What does he
      give as the obvious reason for its lack of speed?
  options:
  - id: a
    text:
      en: Each call does an amount of work besides its recursive calls that grows with n
  - id: b
    text:
      en: The number of recursive calls grows only linearly with n, and the cost lies in the additions
  - id: c
    correct: true
    text:
      en: It computes the same Fibonacci numbers over and over and over
  - id: d
    text:
      en: It stores the result of every recursive call in a table that grows with n
  explanation:
    en: The naive algorithm recomputes the same Fibonacci numbers over and over. Work besides the recursive calls
      is not the cause, because it takes only a constant number of steps, one comparison and possibly one addition.
      A linear number of calls is wrong, because the running time is exponential in n. Storing results in a table
      is the remedy, not the cause, because writing down the results of recursive calls speeds the algorithm up
      considerably.
  citation: erickson-dynamic-programming#p3
  extract:
    en: The obvious reason for the recursive algorithm’s lack of speed is that it com- putes the same Fibonacci
      numbers over and over and over.
