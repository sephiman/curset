# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0097
  prompt:
    es: "Según el artículo 13 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son titulares de los derechos que reconoce en las relaciones con las Administraciones Públicas quienes, de conformidad con el artículo 3, tienen:"
  options:
  - id: a
    text:
      es: "la condición de interesados en un procedimiento."
  - id: b
    correct: true
    text:
      es: "capacidad de obrar ante las Administraciones Públicas."
  - id: c
    text:
      es: "capacidad jurídica según las normas civiles."
  - id: d
    text:
      es: "la condición de usuarios registrados en medios electrónicos."
  explanation:
    es: "El artículo 13 atribuye esos derechos a quienes tienen capacidad de obrar ante las Administraciones Públicas conforme al artículo 3. No los reserva a los interesados de un procedimiento, cuyos derechos regula el artículo 53, ni se basa en la capacidad jurídica civil ni en estar registrado como usuario de medios electrónicos."
  citation: "art. 13 LPAC"
  difficulty: 1
  tags:
  - "derechos"
  - "sujeto"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0098
  prompt:
    es: "¿A través de qué medio tienen derecho las personas a comunicarse con las Administraciones Públicas, según el artículo 13.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Un Punto de Acceso General electrónico de la Administración."
  - id: b
    text:
      es: "Exclusivamente la sede electrónica del órgano competente."
  - id: c
    text:
      es: "Un registro electrónico general de apoderamientos."
  - id: d
    text:
      es: "Solo los canales presenciales de las oficinas de asistencia."
  explanation:
    es: "El artículo 13.a) reconoce el derecho a comunicarse a través de un Punto de Acceso General electrónico. No lo limita a la sede del órgano competente, no se trata del registro de apoderamientos, que acredita representaciones, y tampoco se restringe a canales presenciales."
  citation: "art. 13 LPAC"
  difficulty: 1
  tags:
  - "derechos"
  - "medios"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0101
  prompt:
    es: "El artículo 13.d) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas reconoce el derecho de las personas al acceso a la información pública, archivos y registros, de acuerdo con lo previsto en:"
  options:
  - id: a
    text:
      es: "la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, y el resto del ordenamiento jurídico."
  - id: b
    text:
      es: "la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales."
  - id: c
    correct: true
    text:
      es: "la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, y el resto del ordenamiento jurídico."
  - id: d
    text:
      es: "la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, y el resto del ordenamiento jurídico."
  explanation:
    es: "El artículo 13.d) remite a la Ley 19/2013, de transparencia, acceso a la información pública y buen gobierno. Las otras tres leyes (de Régimen Jurídico del Sector Público, de Protección de Datos Personales y de Bases del Régimen Local) no son la que cita el precepto para este derecho."
  citation: "art. 13 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "norma"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0102
  prompt:
    es: "De acuerdo con el artículo 13.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las personas tienen derecho a ser tratadas con respeto y deferencia por las autoridades y empleados públicos, que habrán de facilitarles:"
  options:
  - id: a
    text:
      es: "la tramitación gratuita de sus solicitudes y recursos, sea cual sea su cuantía o naturaleza."
  - id: b
    correct: true
    text:
      es: "el ejercicio de sus derechos y el cumplimiento de sus obligaciones."
  - id: c
    text:
      es: "el acceso a todos los expedientes de la Administración."
  - id: d
    text:
      es: "la asistencia de un letrado en cualquier procedimiento."
  explanation:
    es: "El artículo 13.e) dice que las autoridades y empleados públicos habrán de facilitar el ejercicio de los derechos y el cumplimiento de las obligaciones. No se habla de gratuidad, ni de acceso a todos los expedientes, ni de asistencia letrada."
  citation: "art. 13 LPAC"
  difficulty: 1
  tags:
  - "derechos"
  - "trato"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0104
  prompt:
    es: "Conforme al artículo 13 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los derechos que enumera se entienden sin perjuicio de:"
  options:
  - id: a
    correct: true
    text:
      es: "los reconocidos en el artículo 53 a los interesados en el procedimiento administrativo."
  - id: b
    text:
      es: "los reconocidos en el artículo 28 a quienes aportan documentos al procedimiento."
  - id: c
    text:
      es: "los reconocidos en el artículo 14 a quienes están obligados a relacionarse electrónicamente."
  - id: d
    text:
      es: "los reconocidos en el artículo 21 a quienes esperan una resolución expresa."
  explanation:
    es: "El último párrafo del artículo 13 salva los derechos del artículo 53, que son los de los interesados en el procedimiento. Los artículos 28, 14 y 21 regulan otras materias (documentos aportados, relación electrónica y obligación de resolver) y no son los que el precepto menciona."
  citation: "art. 13 LPAC"
  difficulty: 1
  tags:
  - "derechos"
  - "remisión"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0105
  prompt:
    es: "¿Cuál de los siguientes derechos NO está recogido en el artículo 13 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, que regula los derechos de las personas en sus relaciones con las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "A comunicarse con las Administraciones Públicas a través de un Punto de Acceso General electrónico."
  - id: b
    text:
      es: "A exigir las responsabilidades de las Administraciones Públicas y autoridades, cuando así corresponda legalmente."
  - id: c
    text:
      es: "A la protección de datos de carácter personal, y en particular a la seguridad y confidencialidad de los datos."
  - id: d
    correct: true
    text:
      es: "A actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses."
  explanation:
    es: "El derecho a actuar asistido de asesor es de los interesados en el procedimiento, artículo 53.1.g), no del artículo 13. En cambio el artículo 13 recoge comunicarse a través del Punto de Acceso General (letra a), exigir responsabilidades (letra f) y la protección de datos personales (letra h)."
  citation: "art. 13 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "negativa"
# anchor: boe-a-2015-10565-art-15
- id: m02-l03-q0106
  prompt:
    es: "De acuerdo con el artículo 15.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados que se dirijan a los órganos de la Administración General del Estado con sede en el territorio de una Comunidad Autónoma podrán utilizar también:"
  options:
  - id: a
    text:
      es: "cualquier lengua oficial del Estado, aunque no sea cooficial en esa Comunidad Autónoma."
  - id: b
    text:
      es: "la lengua de su residencia habitual, sea cual sea la sede del órgano al que se dirijan."
  - id: c
    correct: true
    text:
      es: "la lengua que sea cooficial en esa Comunidad Autónoma."
  - id: d
    text:
      es: "una lengua extranjera, con traducción a cargo de la Administración instructora."
  explanation:
    es: "El artículo 15.1 permite utilizar la lengua que sea cooficial en la Comunidad Autónoma en que el órgano de la Administración General del Estado tenga su sede. No vale una lengua oficial que no sea cooficial allí, ni la de la residencia del interesado con independencia de la sede, ni una lengua extranjera."
  citation: "art. 15.1 LPAC"
  difficulty: 2
  tags:
  - "lengua"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-15
- id: m02-l03-q0107
  prompt:
    es: "Un interesado residente en Madrid se dirige en catalán a un órgano de la Administración General del Estado con sede en Barcelona, en un procedimiento tramitado por esa Administración. Según el artículo 15.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se tramita el procedimiento?"
  options:
  - id: a
    text:
      es: "No puede hacerlo, porque solo puede usar el catalán quien resida en Cataluña."
  - id: b
    text:
      es: "Puede hacerlo, pero el procedimiento se tramita siempre en castellano."
  - id: c
    correct: true
    text:
      es: "Puede hacerlo, y el procedimiento se tramita en catalán, la lengua elegida por el interesado."
  - id: d
    text:
      es: "No puede hacerlo, porque la lengua de los procedimientos de la Administración General del Estado es solo el castellano."
  explanation:
    es: "Lo decisivo es que el órgano tenga su sede en una Comunidad Autónoma con lengua cooficial, no el lugar de residencia del interesado: el artículo 15.1 le permite utilizarla y el procedimiento se tramita en la lengua que él elija. Por eso son falsas la exigencia de residir en Cataluña, la tramitación obligada en castellano y la prohibición absoluta de usar otra lengua ante la Administración General del Estado."
  citation: "art. 15.1 LPAC"
  difficulty: 2
  tags:
  - "lengua"
  - "supuesto"
# anchor: boe-a-2015-10565-art-15
- id: m02-l03-q0108
  prompt:
    es: "Conforme al artículo 15.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si concurren varios interesados en un procedimiento de la Administración General del Estado y discrepan en cuanto a la lengua, el procedimiento se tramita en:"
  options:
  - id: a
    text:
      es: "la lengua cooficial, si la prefiere la mayoría de los interesados, y los documentos que requieran en castellano en todo caso."
  - id: b
    correct: true
    text:
      es: "castellano, aunque los documentos o testimonios que requieran se expiden en la lengua que ellos elijan."
  - id: c
    text:
      es: "la lengua del interesado que haya iniciado el procedimiento, y los documentos en esa misma lengua."
  - id: d
    text:
      es: "la lengua que decida el órgano instructor, y los documentos en castellano."
  explanation:
    es: "Si hay discrepancia, el artículo 15.1 manda tramitar en castellano, pero los documentos o testimonios que pidan los interesados se expiden en la lengua que ellos elijan. No decide la mayoría, ni la lengua de quien inició el procedimiento, ni el instructor, y los documentos no se expiden necesariamente en castellano."
  citation: "art. 15.1 LPAC"
  difficulty: 2
  tags:
  - "lengua"
  - "pluralidad"
# anchor: boe-a-2015-10565-art-15
- id: m02-l03-q0109
  prompt:
    es: "Según el artículo 15.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos tramitados por las Administraciones de las Comunidades Autónomas y de las Entidades Locales, el uso de la lengua se ajusta a:"
  options:
  - id: a
    correct: true
    text:
      es: "lo previsto en la legislación autonómica correspondiente."
  - id: b
    text:
      es: "lo previsto en la legislación estatal del procedimiento administrativo común."
  - id: c
    text:
      es: "lo que decida en cada caso el órgano que tramite el procedimiento."
  - id: d
    text:
      es: "lo que determinen las ordenanzas de cada Entidad Local para sus procedimientos."
  explanation:
    es: "El artículo 15.2 remite a la legislación autonómica correspondiente. No remite a la legislación estatal de procedimiento común, ni a lo que decida cada órgano, ni a las ordenanzas locales."
  citation: "art. 15.2 LPAC"
  difficulty: 2
  tags:
  - "lengua"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-15
- id: m02-l03-q0110
  prompt:
    es: "De acuerdo con el artículo 15.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre la lengua de los procedimientos tramitados por la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "Es la que elijan los interesados, sea o no cooficial en el territorio donde tenga su sede el órgano."
  - id: b
    text:
      es: "Es el castellano, y los interesados pueden utilizar la lengua cooficial ante cualquier órgano, sea cual sea su sede."
  - id: c
    text:
      es: "Es el castellano o la lengua cooficial del territorio donde se inicie el procedimiento, a elección de la Administración."
  - id: d
    correct: true
    text:
      es: "Es el castellano, y los interesados pueden utilizar también la lengua cooficial al dirigirse a sus órganos con sede en la Comunidad Autónoma donde lo sea."
  explanation:
    es: "El artículo 15.1 fija el castellano como lengua de los procedimientos de la Administración General del Estado y permite utilizar también la cooficial a quien se dirija a órganos con sede en una Comunidad Autónoma donde lo sea. No elige libremente el interesado cualquier lengua, ni basta cualquier sede, y la elección de la lengua corresponde al interesado, no a la Administración."
  citation: "art. 15.1 LPAC"
  difficulty: 2
  tags:
  - "lengua"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-28
- id: m02-l03-q0137
  prompt:
    es: "Según el artículo 28.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados deben aportar los datos y documentos que exijan las Administraciones Públicas de acuerdo con la normativa aplicable y, además, pueden aportar:"
  options:
  - id: a
    text:
      es: "solo los documentos que la Administración acepte expresamente al admitir el escrito."
  - id: b
    text:
      es: "únicamente copias auténticas de los documentos que ya obren en su poder."
  - id: c
    text:
      es: "cualquier otro documento, previa autorización del órgano que instruya el procedimiento."
  - id: d
    correct: true
    text:
      es: "cualquier otro documento que estimen conveniente."
  explanation:
    es: "El artículo 28.1 permite aportar cualquier otro documento que se estime conveniente, sin necesidad de aceptación o autorización del órgano. No se limita a lo que la Administración acepte expresamente, ni a las copias auténticas, ni exige autorización previa del instructor."
  citation: "art. 28.1 LPAC"
  difficulty: 2
  tags:
  - "documentos"
  - "interesado"
# anchor: boe-a-2015-10565-art-28
- id: m02-l03-q0139
  prompt:
    es: "Cuando se trata de informes preceptivos ya elaborados por un órgano administrativo distinto del que tramita el procedimiento, ¿en qué plazo deben ser remitidos, según el artículo 28.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En el plazo de cinco días a contar desde su solicitud."
  - id: b
    text:
      es: "En el plazo de quince días a contar desde su solicitud."
  - id: c
    correct: true
    text:
      es: "En el plazo de diez días a contar desde su solicitud."
  - id: d
    text:
      es: "En el plazo de un mes a contar desde su solicitud."
  explanation:
    es: "El artículo 28.2 fija diez días desde la solicitud para remitir los informes preceptivos ya elaborados por otro órgano. No son cinco, quince días ni un mes."
  citation: "art. 28.2 LPAC"
  difficulty: 1
  tags:
  - "documentos"
  - "informes"
  - "plazo"
# anchor: boe-a-2015-10565-art-28
- id: m02-l03-q0141
  prompt:
    es: "Conforme al artículo 28.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones no exigirán a los interesados la presentación de documentos originales, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "con carácter excepcional, la normativa reguladora aplicable establezca lo contrario."
  - id: b
    text:
      es: "lo considere necesario el órgano instructor, aunque la normativa reguladora aplicable no lo prevea."
  - id: c
    text:
      es: "el interesado no disponga de una copia electrónica del documento original."
  - id: d
    text:
      es: "el documento haya sido emitido por una Administración extranjera."
  explanation:
    es: "El artículo 28.3 solo permite exigir originales cuando, con carácter excepcional, la normativa reguladora aplicable lo establezca. No basta que el instructor lo considere necesario, ni que falte la copia electrónica, ni que el documento proceda de una Administración extranjera."
  citation: "art. 28.3 LPAC"
  difficulty: 1
  tags:
  - "documentos"
  - "originales"
# anchor: boe-a-2015-10565-art-28
- id: m02-l03-q0142
  prompt:
    es: "Doña Pilar presentó el año pasado un certificado ante un órgano de una Administración. Ahora otro procedimiento ante esa misma Administración exige el mismo documento. Según el artículo 28.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe hacer ella?"
  options:
  - id: a
    text:
      es: "Aportarlo de nuevo, porque cada procedimiento exige documentos propios que no se reutilizan."
  - id: b
    text:
      es: "Nada, porque la Administración debe localizarlo de oficio sin necesidad de indicación alguna."
  - id: c
    text:
      es: "Indicar el órgano, pero la Administración puede exigirle siempre su nueva aportación."
  - id: d
    correct: true
    text:
      es: "Indicar en qué momento y ante qué órgano lo presentó, y la Administración debe recabarlo electrónicamente salvo oposición expresa."
  explanation:
    es: "El artículo 28.3 impide requerir documentos ya aportados a cualquier Administración: el interesado indica en qué momento y ante qué órgano los presentó y la Administración los recaba electrónicamente, salvo oposición expresa o consentimiento exigido por ley especial. No hay que aportarlos de nuevo, ni basta con no decir nada, ni cabe exigirlos siempre otra vez: solo excepcionalmente, si no pudieran recabarse."
  citation: "art. 28.3 LPAC"
  difficulty: 2
  tags:
  - "documentos"
  - "supuesto"
# anchor: boe-a-2015-10565-art-28
- id: m02-l03-q0143
  prompt:
    es: "De acuerdo con el artículo 28.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados se responsabilizan de:"
  options:
  - id: a
    text:
      es: "la conservación de los originales de los documentos presentados."
  - id: b
    text:
      es: "la validez jurídica de los informes que aporten al procedimiento."
  - id: c
    text:
      es: "la custodia de los documentos que la Administración les devuelva."
  - id: d
    correct: true
    text:
      es: "la veracidad de los documentos que presenten."
  explanation:
    es: "El artículo 28.7 hace responsables a los interesados de la veracidad de los documentos que presentan. No de conservar los originales, ni de la validez jurídica de los informes, ni de custodiar documentos devueltos, deberes que el precepto no recoge."
  citation: "art. 28.7 LPAC"
  difficulty: 1
  tags:
  - "documentos"
  - "responsabilidad"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0171
  prompt:
    es: "Conforme al artículo 53.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes se relacionan con las Administraciones Públicas por medios electrónicos tienen derecho a consultar la información sobre el estado de la tramitación en:"
  options:
  - id: a
    text:
      es: "la sede electrónica del órgano instructor, exclusivamente, que funciona como único portal de acceso a la información."
  - id: b
    text:
      es: "el registro electrónico general de cada Administración, mediante consulta con certificado."
  - id: c
    correct: true
    text:
      es: "el Punto de Acceso General electrónico de la Administración, que funciona como un portal de acceso."
  - id: d
    text:
      es: "el Registro Electrónico de Apoderamientos, que funciona como un portal de acceso."
  explanation:
    es: "El artículo 53.1.a) dice que consultan la información en el Punto de Acceso General electrónico, que funciona como un portal de acceso. No es solo la sede del órgano instructor, ni el registro electrónico general, ni el de apoderamientos, que sirve para acreditar representaciones."
  citation: "art. 53.1.a) LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "medios electrónicos"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0172
  prompt:
    es: "De acuerdo con el artículo 53.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre los derechos de los interesados en el procedimiento administrativo:"
  options:
  - id: a
    text:
      es: "Si excepcionalmente deben presentar un documento original, tienen derecho a que la Administración lo devuelva en diez días."
  - id: b
    correct: true
    text:
      es: "Si excepcionalmente deben presentar un documento original, tienen derecho a obtener una copia autenticada de este."
  - id: c
    text:
      es: "Tienen derecho a no presentar documentos originales en ningún caso, aunque la normativa reguladora aplicable disponga lo contrario."
  - id: d
    text:
      es: "Si deben presentar un documento original, tienen derecho a una compulsa gratuita, que sustituye a la presentación del original."
  explanation:
    es: "El artículo 53.1.c) reconoce el derecho a no presentar originales salvo que, de manera excepcional, la normativa lo establezca, y, si deben presentarlos, a obtener una copia autenticada. No contempla un plazo de devolución, ni un derecho absoluto a no presentarlos, ni una compulsa gratuita que sustituya al original."
  citation: "art. 53.1 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "originales"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0174
  prompt:
    es: "De acuerdo con el artículo 53.1.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados tienen derecho a formular alegaciones y aportar documentos en cualquier fase del procedimiento anterior:"
  options:
  - id: a
    text:
      es: "a la propuesta de resolución, y el órgano competente debe tenerlos en cuenta al dictar la resolución."
  - id: b
    text:
      es: "al período de prueba, y el órgano competente debe tenerlos en cuenta al valorar las pruebas."
  - id: c
    text:
      es: "a la notificación de la resolución, y el órgano competente debe tenerlos en cuenta al resolver los recursos que se interpongan."
  - id: d
    correct: true
    text:
      es: "al trámite de audiencia, y el órgano competente debe tenerlos en cuenta al redactar la propuesta de resolución."
  explanation:
    es: "El artículo 53.1.e) fija el límite en el trámite de audiencia y exige que se tengan en cuenta al redactar la propuesta de resolución. No es la propuesta de resolución, ni el período de prueba, ni la notificación de la resolución."
  citation: "art. 53.1.e) LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "alegaciones"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0176
  prompt:
    es: "Según el artículo 53.1.h) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados en un procedimiento administrativo tienen derecho a cumplir las obligaciones de pago a través de:"
  options:
  - id: a
    text:
      es: "los medios electrónicos previstos en el artículo 14.2 para quienes están obligados a relacionarse por esa vía."
  - id: b
    text:
      es: "los medios de pago que cada Administración fije para sus procedimientos, sean o no electrónicos."
  - id: c
    correct: true
    text:
      es: "los medios electrónicos previstos en el artículo 98.2."
  - id: d
    text:
      es: "los medios electrónicos previstos en el artículo 98.1 para las sanciones pecuniarias exclusivamente."
  explanation:
    es: "El artículo 53.1.h) reconoce el derecho a cumplir las obligaciones de pago por los medios electrónicos del artículo 98.2 (tarjeta, transferencia, domiciliación u otros que autorice el órgano competente en materia de Hacienda Pública). No remite al artículo 14.2, que enumera los sujetos obligados a relacionarse electrónicamente, ni a los medios que fije cada Administración sin limitarse a los electrónicos, ni al artículo 98.1, que trata de la ejecutoriedad de los actos y no de las sanciones pecuniarias exclusivamente."
  citation: "art. 53.1 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "pago"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0183
  prompt:
    es: "De acuerdo con el artículo 13 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale el derecho que se reconoce a las personas en sus relaciones con las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "A que las Administraciones Públicas respondan por cualquier daño derivado de sus actuaciones, sin necesidad de reclamación previa."
  - id: b
    correct: true
    text:
      es: "A la obtención y utilización de los medios de identificación y firma electrónica contemplados en esta Ley."
  - id: c
    text:
      es: "A elegir entre los medios de identificación y firma electrónica sin que la Administración pueda limitarlos."
  - id: d
    text:
      es: "A obtener de las Administraciones Públicas los medios de identificación y firma electrónica con carácter gratuito."
  explanation:
    es: "El artículo 13.g) reconoce el derecho a la obtención y utilización de los medios de identificación y firma electrónica que contempla la Ley. No reconoce una responsabilidad automática sin reclamación (la letra f habla de exigir las responsabilidades cuando corresponda legalmente), ni un derecho a elegir sin límites, ni la gratuidad."
  citation: "art. 13 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "firma"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0187
  prompt:
    es: "De acuerdo con el artículo 53.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre las copias de los documentos contenidos en un procedimiento:"
  options:
  - id: a
    text:
      es: "La obligación de facilitar copias solo se cumple entregando al interesado una copia en papel cuando la solicite."
  - id: b
    text:
      es: "La obligación de facilitar copias se entiende cumplida con su puesta a disposición en la oficina de asistencia en materia de registros."
  - id: c
    correct: true
    text:
      es: "La obligación de facilitar copias se entiende cumplida con su puesta a disposición en el Punto de Acceso General electrónico o en las sedes electrónicas competentes."
  - id: d
    text:
      es: "La obligación de facilitar copias no alcanza a los interesados que se relacionen con la Administración por medios electrónicos."
  explanation:
    es: "El artículo 53.1.a) dice que se entiende cumplida la obligación de facilitar copias con su puesta a disposición en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan. No se exige papel, ni se señala la oficina de asistencia como vía de cumplimiento, ni se excluye a quienes se relacionan por medios electrónicos, que además tienen derecho a consultar por esa vía."
  citation: "art. 53.1 LPAC"
  difficulty: 3
  tags:
  - "derechos"
  - "copias"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q0189
  prompt:
    es: "De acuerdo con el artículo 53.1.g) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre la asistencia de asesor a los interesados en el procedimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen derecho a actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses."
  - id: b
    text:
      es: "Tienen derecho a actuar asistidos de asesor solo cuando la Administración lo considere conveniente para el procedimiento."
  - id: c
    text:
      es: "Tienen derecho a que la Administración les proporcione un asesor cuando no puedan costearlo."
  - id: d
    text:
      es: "Tienen derecho a actuar asistidos de asesor, pero únicamente en los procedimientos de naturaleza sancionadora."
  explanation:
    es: "El artículo 53.1.g) reconoce el derecho a actuar asistidos de asesor cuando el propio interesado lo considere conveniente en defensa de sus intereses. No depende del criterio de la Administración, ni implica que esta proporcione un asesor, ni se limita a los sancionadores."
  citation: "art. 53.1 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "asesor"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q0192
  prompt:
    es: "Según el artículo 13.f) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué tienen derecho a exigir las personas en sus relaciones con las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La anulación automática de los actos de las Administraciones Públicas que consideren contrarios a Derecho."
  - id: b
    text:
      es: "La indemnización de cualquier perjuicio que les causen las Administraciones Públicas y sus empleados."
  - id: c
    correct: true
    text:
      es: "Las responsabilidades de las Administraciones Públicas y autoridades, cuando así corresponda legalmente."
  - id: d
    text:
      es: "La sanción disciplinaria inmediata de los empleados públicos que incumplan los plazos establecidos."
  explanation:
    es: "El artículo 13.f) reconoce el derecho a exigir las responsabilidades de las Administraciones Públicas y autoridades cuando así corresponda legalmente. No es una anulación automática de los actos, ni una indemnización por cualquier perjuicio, ni una sanción disciplinaria inmediata, que dependen de las leyes que las regulan."
  citation: "art. 13 LPAC"
  difficulty: 2
  tags:
  - "derechos"
  - "responsabilidad"
