# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q086
  prompt:
    es: "Conforme al artículo 47.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, podrán adquirirse compromisos de gasto que se extiendan a ejercicios posteriores siempre que su ejecución:"
  options:
  - id: a
    text:
      es: "Se inicie en el ejercicio siguiente al de su autorización, dentro de los límites legales."
  - id: b
    text:
      es: "Cuente con informe previo de la Dirección General de Presupuestos y acuerdo del Gobierno."
  - id: c
    text:
      es: "Se inicie en el propio ejercicio, aunque supere los límites cuando el centro gestor lo estime conveniente."
  - id: d
    correct: true
    text:
      es: "Se inicie en el propio ejercicio en que se autoricen y no supere los límites y anualidades legales."
  explanation:
    es: "La ejecución debe comenzar en el propio ejercicio en que se autoriza el compromiso, y las anualidades deben respetar los límites del apartado 2. Empezar al año siguiente incumple el primer requisito; el informe y el acuerdo del Gobierno son el trámite de excepción del apartado 3; y superar los límites por decisión del gestor incumple el segundo."
  citation: "art. 47.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q087
  prompt:
    es: "Según el artículo 47.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Gobierno puede autorizar, en casos especialmente justificados, compromisos de gasto para ejercicios posteriores aunque:"
  options:
  - id: a
    correct: true
    text:
      es: "No exista crédito inicial en el presupuesto."
  - id: b
    text:
      es: "No haya informe previo de la Dirección General de Presupuestos."
  - id: c
    text:
      es: "No haya propuesta del Ministro de Hacienda al Consejo de Ministros."
  - id: d
    text:
      es: "No lo haya solicitado el ministerio correspondiente."
  explanation:
    es: "El Gobierno puede autorizar compromisos para ejercicios posteriores en el caso de que no exista crédito inicial. El informe previo de la Dirección General de Presupuestos, la propuesta del Ministro de Hacienda al Consejo de Ministros y la iniciativa del ministerio correspondiente son trámites que el artículo exige y que no se pueden omitir."
  citation: "art. 47.3 LGP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q089
  prompt:
    es: "De acuerdo con el artículo 33.2.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán los derechos a reconocer durante el ejercicio por:"
  options:
  - id: a
    text:
      es: "Las entidades del artículo 33.1.b), de presupuesto estimativo."
  - id: b
    text:
      es: "Únicamente la Administración General del Estado, sin sus organismos autónomos."
  - id: c
    correct: true
    text:
      es: "Los sujetos del artículo 33.1.a), de presupuesto limitativo."
  - id: d
    text:
      es: "Las Comunidades Autónomas, por los tributos que el Estado les ceda."
  explanation:
    es: "El artículo 33.2.b) habla de los derechos que reconocerán los entes del párrafo anterior, es decir, los sujetos del 33.1.a). Las entidades de presupuesto estimativo aparecen en la letra c), con sus operaciones. El artículo no reduce los sujetos a la Administración General del Estado ni incluye a las Comunidades Autónomas."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-44
- id: m05-l02-q090
  prompt:
    es: "Según el artículo 44.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el presupuesto de los organismos autónomos se especifican a su concreta clasificación económica, entre otros, los créditos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Se establezcan, en su caso, en la Ley de Presupuestos de cada ejercicio."
  - id: b
    text:
      es: "Fije el titular de cada organismo al aprobar su presupuesto."
  - id: c
    text:
      es: "Sean objeto de transferencia entre programas del mismo organismo."
  - id: d
    text:
      es: "Declare no disponibles el Ministro de Hacienda por falta de ejecución."
  explanation:
    es: "El artículo 44.2.e) incluye los créditos que, en su caso, establezca la Ley de Presupuestos de cada ejercicio. Los que fije el titular del organismo, los transferidos entre programas y los declarados no disponibles no figuran en la lista."
  citation: "art. 44.2 LGP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-51
- id: m05-l02-q101
  prompt:
    es: "Según el artículo 51 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué enumeración recoge todas las modificaciones con las que durante el ejercicio puede variar la cuantía y finalidad de los créditos?"
  options:
  - id: a
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito, y anticipos de tesorería."
  - id: b
    text:
      es: "Transferencias, ampliaciones, créditos extraordinarios y suplementos de crédito, incorporaciones y prórrogas de crédito."
  - id: c
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito."
  - id: d
    correct: true
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito, e incorporaciones."
  explanation:
    es: "El artículo 51 enumera cinco clases: transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos, e incorporaciones. La opción con anticipos de tesorería cambia las incorporaciones por una figura que el artículo 60 regula aparte y que no modifica créditos. La opción con prórrogas de crédito añade una figura ajena al artículo y omite las generaciones. La que termina en suplementos de crédito deja fuera las incorporaciones."
  citation: "art. 51 LGP"
  difficulty: 1
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2003-21614-art-50
- id: m05-l02-q103
  prompt:
    es: "Según el artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué porcentaje del total de gastos para operaciones no financieras fija el importe de la sección «Fondo de Contingencia de ejecución presupuestaria»?"
  options:
  - id: a
    text:
      es: "El uno por ciento."
  - id: b
    correct: true
    text:
      es: "El dos por ciento."
  - id: c
    text:
      es: "El tres por ciento."
  - id: d
    text:
      es: "El cinco por ciento."
  explanation:
    es: "El artículo 50.1 LGP dice que el presupuesto del Estado incluirá la sección «Fondo de Contingencia de ejecución presupuestaria» «por importe del dos por ciento del total de gastos para operaciones no financieras». El uno, el tres y el cinco por ciento no son el porcentaje del apartado, que es el dos."
  citation: "art. 50.1 LGP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-50
- id: m05-l02-q104
  prompt:
    es: "Según el artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el presupuesto del Estado incluye el Fondo de Contingencia de ejecución presupuestaria para hacer frente durante el ejercicio a:"
  options:
  - id: a
    text:
      es: "Necesidades aplazables al ejercicio siguiente y de carácter discrecional, para las que se hizo una dotación insuficiente de crédito."
  - id: b
    text:
      es: "Gastos de la Administración decididos libremente durante el ejercicio, aunque carezcan de cobertura presupuestaria y de crédito."
  - id: c
    correct: true
    text:
      es: "Necesidades inaplazables y no discrecionales para las que no hubo, en todo o en parte, dotación adecuada de crédito."
  - id: d
    text:
      es: "Desviaciones de tesorería del ejercicio, siempre que las apruebe el Ministro de Hacienda mediante orden ministerial."
  explanation:
    es: "La finalidad del Fondo son las necesidades inaplazables y no discrecionales sin dotación adecuada de crédito. La opción de las necesidades aplazables y discrecionales invierte ambos requisitos. La de los gastos decididos libremente contradice la prohibición final del artículo 50.1. La de las desviaciones de tesorería mezcla el Fondo con los anticipos de tesorería, que son otra figura."
  citation: "art. 50.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-50
- id: m05-l02-q105
  prompt:
    es: "¿Cuál de las siguientes modificaciones de crédito puede financiar el Fondo de Contingencia, cuando proceda, conforme al artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Las incorporaciones de crédito."
  - id: b
    text:
      es: "Las generaciones de crédito por ingresos."
  - id: c
    text:
      es: "Las transferencias de crédito."
  - id: d
    text:
      es: "Los anticipos de tesorería."
  explanation:
    es: "El Fondo únicamente financia ampliaciones, créditos extraordinarios y suplementos, e incorporaciones. Las generaciones se financian con los ingresos que las originan, las transferencias con el traspaso de dotaciones entre créditos, y los anticipos de tesorería no son una modificación del artículo 51."
  citation: "art. 50.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-50
- id: m05-l02-q108
  prompt:
    es: "Un ministerio propone financiar con baja en el Fondo de Contingencia una transferencia de crédito entre dos de sus programas. ¿Lo permite el artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el Fondo solo financia ampliaciones, créditos extraordinarios y suplementos, e incorporaciones de crédito."
  - id: b
    text:
      es: "Sí, porque el Fondo puede financiar cualquier modificación de crédito del presupuesto del Estado cuando proceda."
  - id: c
    text:
      es: "Sí, siempre que la transferencia no afecte a gastos de personal ni a créditos de otras secciones."
  - id: d
    text:
      es: "No, porque el Fondo solo financia generaciones de crédito por ingresos de ventas de bienes."
  explanation:
    es: "El artículo 50.1 enumera tres clases de modificación que el Fondo puede financiar: ampliaciones, créditos extraordinarios y suplementos, e incorporaciones. La transferencia no está entre ellas, y se financia con el traspaso de dotaciones entre créditos. Las otras opciones amplían la lista a cualquier modificación o la sustituyen por las generaciones."
  citation: "art. 50.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q109
  prompt:
    es: "Un suplemento de crédito del presupuesto del Estado se financia con baja en los créditos del Fondo de Contingencia o en otros créditos no financieros. ¿A qué clase de necesidad atiende?"
  options:
  - id: a
    text:
      es: "A una necesidad surgida en operaciones financieras del presupuesto."
  - id: b
    text:
      es: "A un gasto que puede demorarse hasta el ejercicio siguiente."
  - id: c
    text:
      es: "A una obligación de un organismo autónomo cubierta con su remanente de tesorería."
  - id: d
    correct: true
    text:
      es: "A una necesidad surgida en operaciones no financieras del presupuesto."
  explanation:
    es: "El artículo 55.1.a) financia con el Fondo o con baja en otros créditos no financieros la necesidad que surge en operaciones no financieras. Las necesidades de operaciones financieras se financian con Deuda Pública o con baja en créditos de la misma naturaleza. Un gasto demorable no cumple el requisito del artículo 55.1, y el remanente de tesorería es la fuente de los organismos autónomos, no del Estado."
  citation: "art. 55.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q111
  prompt:
    es: "Entre las condiciones que el artículo 55.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria fija para tramitar un crédito extraordinario o suplementario del Estado figura que el gasto:"
  options:
  - id: a
    text:
      es: "Se haya comprometido en un contrato plurianual."
  - id: b
    text:
      es: "Derive de una norma que lo declare ampliable."
  - id: c
    text:
      es: "Afecte solo a operaciones financieras."
  - id: d
    correct: true
    text:
      es: "No pueda demorarse hasta el ejercicio siguiente."
  explanation:
    es: "El artículo exige un gasto que no pueda demorarse al ejercicio siguiente, sin crédito adecuado o con crédito insuficiente y no ampliable, y sin otra figura del artículo 51 que lo dote. Un gasto ampliable se atiende con ampliación, no con crédito extraordinario. El carácter financiero de la operación no es condición: el artículo prevé también operaciones no financieras."
  citation: "art. 55.1 LGP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q112
  prompt:
    es: "Según el artículo 55.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, procede remitir a las Cortes un proyecto de ley de crédito extraordinario o suplementario, entre otros casos, cuando este:"
  options:
  - id: a
    correct: true
    text:
      es: "Afecte a operaciones financieras del presupuesto del Estado."
  - id: b
    text:
      es: "Atienda obligaciones del propio ejercicio financiadas con el Fondo de Contingencia."
  - id: c
    text:
      es: "Atienda obligaciones de ejercicios con crédito anulado, financiadas con el Fondo."
  - id: d
    text:
      es: "Se financie con mayores ingresos sobre los previstos."
  explanation:
    es: "Hace falta ley cuando el crédito afecta a operaciones financieras. Las obligaciones del propio ejercicio o de ejercicios con crédito anulado, financiadas con el Fondo, las autoriza directamente el Consejo de Ministros (art. 55.3). Los mayores ingresos son una fuente de los organismos autónomos, no un supuesto del artículo 55.2."
  citation: "art. 55.2 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q113
  prompt:
    es: "Según el artículo 55.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el proyecto de ley de crédito extraordinario o suplementario se remite a las Cortes Generales previo informe de la Dirección General de Presupuestos y dictamen de:"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas."
  - id: b
    correct: true
    text:
      es: "El Consejo de Estado."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El Consejo Económico y Social."
  explanation:
    es: "El artículo 55.2 exige el informe de la Dirección General de Presupuestos y el dictamen del Consejo de Estado. El Tribunal de Cuentas, la Intervención General y el Consejo Económico y Social no intervienen en ese trámite."
  citation: "art. 55.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q115
  prompt:
    es: "El Estado debe atender una obligación del propio ejercicio con un crédito extraordinario financiado con cargo al Fondo de Contingencia. ¿Cuál de los siguientes órganos lo autoriza?"
  options:
  - id: a
    text:
      es: "Las Cortes Generales, mediante ley."
  - id: b
    correct: true
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: c
    text:
      es: "El Ministro de Hacienda, previo informe de la Dirección General de Presupuestos."
  - id: d
    text:
      es: "El titular del ministerio, previo informe favorable de la Intervención Delegada."
  explanation:
    es: "El Consejo de Ministros autoriza los créditos extraordinarios y suplementos para obligaciones del ejercicio corriente cuando se financian con el Fondo de Contingencia (arts. 55.3 y 61.d). Solo se necesita ley si se financian con baja en otros créditos. El Ministro de Hacienda y el titular del ministerio no tienen esa competencia."
  citation: "art. 55.3 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q116
  prompt:
    es: "Una obligación del propio ejercicio no tiene crédito y el Estado tramita un crédito extraordinario financiado con baja en otros créditos no financieros, sin usar el Fondo. ¿Cuál de los siguientes órganos lo autoriza?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: b
    text:
      es: "El Ministro de Hacienda, previo informe de la Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "Las Cortes Generales, mediante ley aprobada a partir de un proyecto del Gobierno."
  - id: d
    text:
      es: "El titular del ministerio, previo informe favorable de la Intervención Delegada."
  explanation:
    es: "Con baja en otros créditos, la obligación del propio ejercicio exige proyecto de ley a las Cortes Generales (art. 55.2.b). El Consejo de Ministros solo la autoriza si se financia con el Fondo. Ni el Ministro de Hacienda ni el titular del ministerio autorizan créditos extraordinarios del Estado."
  citation: "art. 55.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q117
  prompt:
    es: "El Estado debe pagar una obligación de un ejercicio anterior para la que no se anuló crédito en ese ejercicio. ¿Cuál de los siguientes órganos autoriza el crédito extraordinario, aunque se financie con el Fondo?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cortes Generales, mediante ley."
  - id: b
    text:
      es: "El Consejo de Ministros, por estar financiado con el Fondo."
  - id: c
    text:
      es: "El Ministro de Hacienda, a iniciativa del ministro afectado."
  - id: d
    text:
      es: "El Gobierno, previo informe del Consejo de Estado."
  explanation:
    es: "Si no se anuló crédito en el ejercicio de procedencia, el crédito va por ley de las Cortes Generales tanto con el Fondo de Contingencia como con baja en otros créditos (art. 55.2.a). La financiación con el Fondo solo traslada la competencia al Consejo de Ministros cuando el crédito sí se anuló."
  citation: "art. 55.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2003-21614-art-61
- id: m05-l02-q119
  prompt:
    es: "Según el artículo 61.d) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué créditos autoriza el Gobierno, a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados?"
  options:
  - id: a
    correct: true
    text:
      es: "Los créditos extraordinarios y suplementarios que cita el artículo 55.3 de la Ley."
  - id: b
    text:
      es: "Las generaciones de crédito por enajenaciones de inmovilizado del Estado."
  - id: c
    text:
      es: "Las ampliaciones de crédito de pensiones de Clases Pasivas del artículo 54.1."
  - id: d
    text:
      es: "Las incorporaciones de remanentes del ejercicio anterior del artículo 58."
  explanation:
    es: "El artículo 61.d) remite al artículo 55.3: los créditos extraordinarios y suplementos que se financian con el Fondo de Contingencia. Las generaciones por enajenaciones, las ampliaciones del 54.1 y las incorporaciones las autoriza el Ministro de Hacienda (art. 62.1.b, d y c)."
  citation: "art. 61.d) LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-55
- id: m05-l02-q120
  prompt:
    es: "Un departamento necesita atender un gasto inaplazable para el que no existe ninguna aplicación presupuestaria adecuada. No hay crédito ampliable ni otra figura que lo dote. ¿Qué modificación procede?"
  options:
  - id: a
    text:
      es: "Una ampliación de crédito."
  - id: b
    text:
      es: "Una generación de crédito."
  - id: c
    text:
      es: "Una incorporación de crédito."
  - id: d
    correct: true
    text:
      es: "Un crédito extraordinario."
  explanation:
    es: "Cuando el gasto no puede demorarse, no existe crédito adecuado y las demás figuras no sirven, el artículo 55.1 manda tramitar un crédito extraordinario, o un suplemento si el crédito existe pero es insuficiente. La ampliación exige un crédito declarado ampliable, la generación unos ingresos que la justifiquen y la incorporación un remanente del ejercicio anterior."
  citation: "art. 55.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q121
  prompt:
    es: "Según el artículo 56.3.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Presidente o Director de un organismo autónomo autoriza créditos extraordinarios o suplementarios hasta el 10 % del capítulo, cuando no supere:"
  options:
  - id: a
    text:
      es: "100.000 euros."
  - id: b
    text:
      es: "250.000 euros."
  - id: c
    correct: true
    text:
      es: "500.000 euros."
  - id: d
    text:
      es: "1.000.000 de euros."
  explanation:
    es: "El Presidente o Director autoriza hasta el diez por ciento del capítulo siempre que además no se supere la cuantía de 500.000 euros. El millón de euros es el límite que no debe superar el Ministro de Hacienda. Las otras dos cifras no figuran en el artículo."
  citation: "art. 56.3.a LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "órgano"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q122
  prompt:
    es: "De acuerdo con el artículo 56.3.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Ministro de Hacienda autoriza el crédito extraordinario o suplementario de un organismo autónomo cuando, superados los límites del Presidente, no se alcance:"
  options:
  - id: a
    text:
      es: "El 15 % del capítulo ni se supere 500.000 euros."
  - id: b
    correct: true
    text:
      es: "El 20 % del capítulo ni se supere 1.000.000 de euros."
  - id: c
    text:
      es: "El 25 % del capítulo ni se supere 1.500.000 euros."
  - id: d
    text:
      es: "El 30 % del capítulo ni se supere 2.000.000 de euros."
  explanation:
    es: "El artículo 56.3.b) LGP da al Ministro de Hacienda la autorización de los créditos extraordinarios o suplementarios de un organismo autónomo cuando, superándose los límites del Presidente (el 10 % del capítulo y 500.000 euros), «no se alcance el 20 % del correspondiente capítulo de su presupuesto inicial de gastos ni se supere la cuantía de 1.000.000 de euros». Las otras combinaciones, 15 % y 500.000 euros, 25 % y 1.500.000, 30 % y 2.000.000, no coinciden con el 20 % y el millón del apartado. A partir de ese límite, la letra c) reserva el caso al Consejo de Ministros."
  citation: "art. 56.3.b LGP"
