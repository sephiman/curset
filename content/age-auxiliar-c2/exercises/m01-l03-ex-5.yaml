# anchor: boe-a-1978-31229-art-54
- id: m01-l03-q145
  prompt:
    es: "Conforme al artículo 54 de la Constitución Española de 1978, el Defensor del Pueblo podrá supervisar la actividad de la Administración, dando cuenta a:"
  options:
  - id: a
    text:
      es: "El Consejo de Estado."
  - id: b
    text:
      es: "El Rey."
  - id: c
    correct: true
    text:
      es: "Las Cortes Generales."
  - id: d
    text:
      es: "El Senado."
  explanation:
    es: "El artículo 54 le permite supervisar la actividad de la Administración dando cuenta a las Cortes Generales, no a una sola Cámara. El Consejo de Estado y el Rey no reciben esa cuenta. El Senado es solo una de las dos Cámaras que forman las Cortes."
  citation: "art. 54 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q146
  prompt:
    es: "Conforme al artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, propuesto el candidato o candidatos, se convoca al Pleno del Congreso para su elección en un término no inferior a:"
  options:
  - id: a
    correct: true
    text:
      es: "Diez días."
  - id: b
    text:
      es: "Cinco días."
  - id: c
    text:
      es: "Quince días."
  - id: d
    text:
      es: "Veinte días."
  explanation:
    es: "El artículo 2.4 pide convocar al Pleno del Congreso en un término no inferior a diez días desde la propuesta. Veinte días es el plazo máximo para la ratificación del Senado, no el mínimo de convocatoria del Pleno. El mínimo es de diez días: cinco y quince son otras cifras."
  citation: "art. 2.4 LO 3/1981"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q147
  prompt:
    es: "Según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si no se alcanzan en el Congreso y el Senado las mayorías de la primera votación, la Comisión formula sucesivas propuestas en un plazo máximo de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un mes."
  - id: b
    text:
      es: "Diez días."
  - id: c
    text:
      es: "Veinte días."
  - id: d
    text:
      es: "Tres meses."
  explanation:
    es: "El artículo 2.5 da a la Comisión un mes, en nueva sesión, para formular sucesivas propuestas. Diez días es el mínimo de convocatoria del Pleno del Congreso y veinte días el plazo de ratificación del Senado, plazos de otros trámites del mismo artículo. El plazo máximo es de un mes, no de tres."
  citation: "art. 2.5 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q148
  prompt:
    es: "Conforme al artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si no se alcanzan las mayorías de la primera votación, la designación del Defensor del Pueblo queda hecha con:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta del Congreso y simple del Senado."
  - id: b
    text:
      es: "Tres quintos del Congreso y mayoría simple del Senado."
  - id: c
    correct: true
    text:
      es: "Tres quintos del Congreso y mayoría absoluta del Senado."
  - id: d
    text:
      es: "Mayoría absoluta de ambas Cámaras."
  explanation:
    es: "En el segundo intento basta con los tres quintos del Congreso y, después, la mayoría absoluta del Senado. La opción que rebaja el Congreso a mayoría absoluta y la que rebaja el Senado a mayoría simple cambian una de las dos mayorías. Pedir mayoría absoluta de ambas Cámaras rebaja también la del Congreso."
  citation: "art. 2.5 LO 3/1981"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1981-10325-art-3
- id: m01-l03-q149
  prompt:
    es: "¿Cuál de las siguientes condiciones debe cumplir un español para poder ser elegido Defensor del Pueblo, según el artículo 3 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Ser mayor de treinta y cinco años y licenciado en Derecho."
  - id: b
    correct: true
    text:
      es: "Ser mayor de edad y encontrarse en el pleno disfrute de sus derechos civiles y políticos."
  - id: c
    text:
      es: "Ser mayor de veinticinco años y no estar afiliado a ningún partido."
  - id: d
    text:
      es: "Ser mayor de edad y tener diez años de ejercicio de una profesión jurídica."
  explanation:
    es: "El artículo 3 solo pide ser español mayor de edad y estar en pleno disfrute de los derechos civiles y políticos. No exige una edad concreta, ni licenciatura en Derecho, ni años de ejercicio profesional. La no afiliación a un partido es una incompatibilidad del artículo 7, no un requisito de elegibilidad."
  citation: "art. 3 LO 3/1981"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1981-10325-art-5
- id: m01-l03-q150
  prompt:
    es: "Conforme al artículo 5.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, el Defensor del Pueblo cesa, entre otras causas, por:"
  options:
  - id: a
    text:
      es: "Cumplir los sesenta y cinco años de edad."
  - id: b
    text:
      es: "Perder la confianza del Gobierno."
  - id: c
    text:
      es: "Ser inculpado en un procedimiento penal."
  - id: d
    correct: true
    text:
      es: "Actuar con notoria negligencia en el cumplimiento de las obligaciones y deberes del cargo."
  explanation:
    es: "El artículo 5.1 incluye la notoria negligencia en el cumplimiento de las obligaciones y deberes del cargo, junto con la renuncia, la expiración del plazo, la muerte o incapacidad sobrevenida y la condena firme por delito doloso. Una edad de jubilación, la pérdida de confianza del Gobierno o una simple inculpación no son causas de cese: el Defensor responde ante las Cortes, y solo una condena firme por delito doloso lo hace cesar."
  citation: "art. 5.1 LO 3/1981"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1981-10325-art-5
- id: m01-l03-q151
  prompt:
    es: "Señale la respuesta correcta sobre quién decide la vacante del Defensor, salvo por muerte, renuncia o expiración del plazo, según el artículo 5.2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    text:
      es: "El Pleno del Congreso, por mayoría absoluta, previa audiencia del interesado."
  - id: b
    correct: true
    text:
      es: "Las Cámaras, por tres quintas partes de los componentes de cada una, mediante debate y previa audiencia del interesado."
  - id: c
    text:
      es: "La Comisión Mixta Congreso-Senado, por mayoría simple."
  - id: d
    text:
      es: "Las Cámaras, por mayoría absoluta de cada una, sin audiencia del interesado."
  explanation:
    es: "El artículo 5.2 reserva a las Cámaras esa decisión, por tres quintas partes de cada una, con debate y audiencia del interesado. El Pleno del Congreso por sí solo y la Comisión Mixta por mayoría simple no alcanzan, y la mayoría absoluta sin audiencia rebaja la mayoría y suprime una garantía."
  citation: "art. 5.2 LO 3/1981"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1981-10325-art-5
- id: m01-l03-q152
  prompt:
    es: "Según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, vacante el cargo de Defensor del Pueblo, el procedimiento para nombrar al nuevo se inicia en un plazo no superior a:"
  options:
  - id: a
    text:
      es: "Quince días."
  - id: b
    text:
      es: "Tres meses."
  - id: c
    text:
      es: "Seis meses."
  - id: d
    correct: true
    text:
      es: "Un mes."
  explanation:
    es: "El artículo 5.3 manda iniciar el procedimiento en un plazo no superior a un mes. Quince días, tres meses y seis meses cambian la cifra. Mientras tanto, los Adjuntos desempeñan las funciones, interinamente, por su orden."
  citation: "art. 5.3 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1981-10325-art-6
- id: m01-l03-q153
  prompt:
    es: "Señale la respuesta correcta sobre la independencia del Defensor del Pueblo respecto de mandatos e instrucciones, según el artículo 6.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    correct: true
    text:
      es: "No recibirá instrucciones de ninguna Autoridad."
  - id: b
    text:
      es: "Recibirá instrucciones de la Comisión Mixta Congreso-Senado."
  - id: c
    text:
      es: "Recibirá instrucciones de las Mesas de ambas Cámaras."
  - id: d
    text:
      es: "Informará al Gobierno antes de iniciar cualquier investigación."
  explanation:
    es: "El artículo 6.1 añade que no recibe instrucciones de ninguna Autoridad y que actúa con autonomía y según su criterio. La Comisión Mixta se relaciona con el Defensor e informa a los Plenos, sin darle instrucciones. Las Mesas de las Cámaras no dan instrucciones al Defensor. Informar al Gobierno antes de investigar contradice esa autonomía."
  citation: "art. 6.1 LO 3/1981"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1981-10325-art-8
- id: m01-l03-q155
  prompt:
    es: "¿Cuál de los siguientes requisitos condiciona el nombramiento y la separación de los Adjuntos por el Defensor del Pueblo, según el artículo 8.2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Previa propuesta de la Comisión Mixta Congreso-Senado."
  - id: b
    text:
      es: "Previa autorización del Gobierno."
  - id: c
    correct: true
    text:
      es: "Previa conformidad de las Cámaras."
  - id: d
    text:
      es: "Libremente, sin intervención de las Cámaras."
  explanation:
    es: "El artículo 8.2 condiciona el nombramiento y la separación de los Adjuntos a la conformidad previa de las Cámaras. La conformidad corresponde a las Cámaras: una propuesta de la Comisión Mixta o la autorización del Gobierno sustituyen a ese órgano, y la libre decisión suprime el control."
  citation: "art. 8.2 LO 3/1981"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1981-10325-art-10
- id: m01-l03-q156
  prompt:
    es: "Conforme al artículo 10.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, quien se dirige al Defensor del Pueblo debe invocar:"
  options:
  - id: a
    correct: true
    text:
      es: "Un interés legítimo."
  - id: b
    text:
      es: "Un derecho subjetivo lesionado."
  - id: c
    text:
      es: "La condición de interesado en un procedimiento administrativo."
  - id: d
    text:
      es: "Un perjuicio patrimonial efectivo."
  explanation:
    es: "El artículo 10.1 exige invocar un interés legítimo. No pide un derecho subjetivo lesionado, ni ser interesado en un procedimiento, ni acreditar un perjuicio patrimonial. Todas esas exigencias restringirían una vía que la ley abre «sin restricción alguna»."
  citation: "art. 10.1 LO 3/1981"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1981-10325-art-10
- id: m01-l03-q157
  prompt:
    es: "Conforme al artículo 10.3 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, no podrá presentar quejas ante el Defensor del Pueblo en asuntos de su competencia:"
  options:
  - id: a
    text:
      es: "Ninguna persona jurídica."
  - id: b
    text:
      es: "Ningún extranjero residente en España."
  - id: c
    text:
      es: "Ninguna persona menor de edad."
  - id: d
    correct: true
    text:
      es: "Ninguna autoridad administrativa."
  explanation:
    es: "El artículo 10.3 veta las quejas de las autoridades administrativas en asuntos de su competencia. Las personas jurídicas, los extranjeros residentes y los menores de edad pueden dirigirse al Defensor, porque el apartado 1 abre la vía a toda persona natural o jurídica con interés legítimo, sin restricción alguna."
  citation: "art. 10.3 LO 3/1981"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1981-10325-art-11
- id: m01-l03-q158
  prompt:
    es: "¿Cuál de los siguientes órganos recibe la comunicación del Defensor del Pueblo cuando las Cortes Generales no están reunidas o han sido disueltas, según el artículo 11 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "La Comisión Mixta Congreso-Senado."
  - id: b
    correct: true
    text:
      es: "Las Diputaciones Permanentes de las Cámaras."
  - id: c
    text:
      es: "Los Presidentes de las Cámaras."
  - id: d
    text:
      es: "El Gobierno."
  explanation:
    es: "El artículo 11.2 manda dirigirse a las Diputaciones Permanentes de las Cámaras, que velan por los poderes de estas cuando no están reunidas. La Comisión Mixta y los Presidentes no sustituyen a las Cortes en ese momento. El Gobierno es la Administración que el Defensor supervisa."
  citation: "art. 11 LO 3/1981"
  difficulty: 3
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1981-10325-art-15
- id: m01-l03-q159
  prompt:
    es: "Conforme al artículo 15.2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, todas las actuaciones del Defensor del Pueblo son gratuitas para el interesado y no es preceptiva la asistencia de:"
  options:
  - id: a
    text:
      es: "Letrado, pero sí de Procurador."
  - id: b
    text:
      es: "Procurador, pero sí de Letrado."
  - id: c
    text:
      es: "Notario ni de Procurador."
  - id: d
    correct: true
    text:
      es: "Letrado ni de Procurador."
  explanation:
    es: "El artículo 15.2 dispensa de Letrado y de Procurador. Las opciones que exigen uno de los dos mantienen una asistencia que el artículo suprime. La del Notario introduce una figura que el artículo no menciona."
  citation: "art. 15.2 LO 3/1981"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1981-10325-art-17
- id: m01-l03-q160
  prompt:
    es: "Señale la respuesta correcta sobre el régimen de recurso de las decisiones del Defensor del Pueblo, conforme al artículo 17.3 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    text:
      es: "Cabe recurso ante el Tribunal Supremo."
  - id: b
    correct: true
    text:
      es: "No serán susceptibles de recurso."
  - id: c
    text:
      es: "Cabe recurso ante la Comisión Mixta Congreso-Senado."
  - id: d
    text:
      es: "Cabe recurso de alzada ante la Mesa del Congreso."
  explanation:
    es: "El artículo 17.3 dice que las decisiones del Defensor del Pueblo no son susceptibles de recurso. Ni el Tribunal Supremo, ni la Comisión Mixta, ni la Mesa del Congreso son vías de recurso frente a esas decisiones."
  citation: "art. 17.3 LO 3/1981"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1981-10325-art-18
- id: m01-l03-q161
  prompt:
    es: "Conforme al artículo 18.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, admitida la queja, el jefe del organismo afectado debe remitir un informe escrito en el plazo máximo de:"
  options:
  - id: a
    text:
      es: "Diez días."
  - id: b
    text:
      es: "Veinte días."
  - id: c
    correct: true
    text:
      es: "Quince días."
  - id: d
    text:
      es: "Un mes."
  explanation:
    es: "El artículo 18.1 da quince días al jefe del organismo para remitir el informe escrito, ampliables si concurren circunstancias que lo aconsejen a juicio del Defensor. El plazo es de quince días: diez, veinte y un mes son otras cifras."
  citation: "art. 18.1 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1981-10325-art-32
- id: m01-l03-q162
  prompt:
    es: "Conforme al artículo 32.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, el Defensor del Pueblo da cuenta anualmente a las Cortes de su gestión en un informe que presenta cuando estas se hallan reunidas:"
  options:
  - id: a
    correct: true
    text:
      es: "En período ordinario de sesiones."
  - id: b
    text:
      es: "En sesión conjunta extraordinaria."
  - id: c
    text:
      es: "En el primer mes de cada legislatura."
  - id: d
    text:
      es: "En el mes de enero de cada año."
  explanation:
    es: "El artículo 32.1 manda presentar el informe anual ante las Cortes cuando se hallen reunidas en período ordinario de sesiones. No exige una sesión conjunta extraordinaria ni fija un mes concreto: los períodos son los del artículo 73.1 de la Constitución."
  citation: "art. 32 LO 3/1981"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1981-10325-art-32
- id: m01-l03-q163
  prompt:
    es: "Conforme al artículo 32.2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, el informe extraordinario por gravedad o urgencia se dirige a las Diputaciones Permanentes de las Cámaras si:"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cámaras no están reunidas."
  - id: b
    text:
      es: "Las Cámaras están reunidas en sesión extraordinaria."
  - id: c
    text:
      es: "El Gobierno lo solicita."
  - id: d
    text:
      es: "La Comisión Mixta Congreso-Senado lo aprueba."
  explanation:
    es: "El artículo 32.2 dirige el informe extraordinario a las Diputaciones Permanentes cuando las Cámaras no están reunidas. Si lo están, incluida una sesión extraordinaria, el informe va a las Cortes. El Gobierno y la Comisión Mixta no determinan el destinatario."
  citation: "art. 32 LO 3/1981"
  difficulty: 3
  tags:
  - "procedimiento"
