# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q017
  prompt:
    es: "De acuerdo con el artículo 6.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la creación, modificación y supresión de las Comisiones Delegadas del Gobierno será acordada:"
  options:
  - id: a
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Por el Consejo de Ministros mediante Acuerdo, a propuesta del Ministro de la Presidencia."
  - id: c
    correct: true
    text:
      es: "Por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, a propuesta del Ministro de la Presidencia."
  explanation:
    es: "El artículo 6.1 dice que la creación, modificación y supresión «será acordada por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno». No la acuerda el Presidente, sino el Consejo. La forma es el Real Decreto, no el Acuerdo. La propuesta es del Presidente, no del Ministro de la Presidencia."
  citation: "art. 6.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q078
  prompt:
    es: "¿Cuál de los siguientes cargos puede integrar, junto con miembros del Gobierno, las Comisiones Delegadas del Gobierno, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Delegados del Gobierno en las Comunidades Autónomas."
  - id: b
    text:
      es: "Presidentes de las Comunidades Autónomas."
  - id: c
    text:
      es: "Consejeros del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Secretarios de Estado."
  explanation:
    es: "El artículo 6.2.b menciona a los miembros del Gobierno y, en su caso, a los Secretarios de Estado. Los Delegados del Gobierno, los Presidentes autonómicos y los Consejeros de Estado no forman parte de las Comisiones Delegadas."
  citation: "art. 6.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q079
  prompt:
    es: "Conforme a la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde a las Comisiones Delegadas, como órganos colegiados del Gobierno, examinar las cuestiones de carácter general que tengan relación con:"
  options:
  - id: a
    correct: true
    text:
      es: "Varios de los Departamentos Ministeriales que integren la Comisión."
  - id: b
    text:
      es: "Todos los Departamentos Ministeriales del Gobierno."
  - id: c
    text:
      es: "Un solo Departamento Ministerial, el de su Presidente."
  - id: d
    text:
      es: "Las Comunidades Autónomas cuyos Presidentes participen en la Comisión."
  explanation:
    es: "El artículo 6.4.a les encomienda las cuestiones generales que afectan a varios de los Departamentos que integran la Comisión. No abarcan a todos los Departamentos del Gobierno ni a uno solo, y no tienen relación con las Comunidades Autónomas."
  citation: "art. 6.4 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q080
  prompt:
    es: "De acuerdo con el artículo 6.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las Comisiones Delegadas resuelven los asuntos que, afectando a más de un Ministerio, no requieran:"
  options:
  - id: a
    text:
      es: "Un dictamen del Consejo de Estado."
  - id: b
    text:
      es: "La autorización del Presidente."
  - id: c
    correct: true
    text:
      es: "Ser elevados al Consejo de Ministros."
  - id: d
    text:
      es: "Un Real Decreto del Presidente."
  explanation:
    es: "El artículo 6.4.c les permite resolver los asuntos que afectan a más de un Ministerio y no hay que elevar al Consejo de Ministros. El dictamen del Consejo de Estado, la autorización del Presidente y un Real Decreto del Presidente no son el criterio del artículo."
  citation: "art. 6.4 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-6
- id: m01-l05-q113
  prompt:
    es: "Según el artículo 6.5 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las deliberaciones de las Comisiones Delegadas del Gobierno serán:"
  options:
  - id: a
    text:
      es: "Públicas."
  - id: b
    text:
      es: "Públicas, salvo que el Presidente del Gobierno disponga otra cosa."
  - id: c
    text:
      es: "Secretas, salvo que el Presidente del Gobierno disponga otra cosa."
  - id: d
    correct: true
    text:
      es: "Secretas."
  explanation:
    es: "El artículo 6.5 dice que las deliberaciones de las Comisiones Delegadas son secretas. La opción de deliberaciones públicas lo contradice. Las dos opciones que dejan la decisión al Presidente del Gobierno añaden una excepción que el artículo no recoge: una abre al público lo que es secreto y la otra permite levantar un secreto que el artículo fija sin salvedad."
  citation: "art. 6.5 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-25
- id: m01-l05-q082
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno aprobará anualmente un Plan Normativo que contendrá las iniciativas legislativas o reglamentarias que vayan a ser elevadas para su aprobación:"
  options:
  - id: a
    correct: true
    text:
      es: "En el año siguiente."
  - id: b
    text:
      es: "En el trimestre siguiente."
  - id: c
    text:
      es: "En el mismo año."
  - id: d
    text:
      es: "En la legislatura siguiente."
  explanation:
    es: "El artículo 25.1 dice que el Plan recoge las iniciativas que se elevarán para su aprobación en el año siguiente. El trimestre, el mismo año y la legislatura son periodos distintos."
  citation: "art. 25.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-25
- id: m01-l05-q083
  prompt:
    es: "Señale la opción correcta sobre quién eleva el Plan Anual Normativo al Consejo de Ministros para su aprobación y cuándo, según el artículo 25.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "El Ministro de la Presidencia, antes del 30 de junio."
  - id: b
    correct: true
    text:
      es: "El Ministro de la Presidencia, antes del 30 de abril."
  - id: c
    text:
      es: "El Ministro de Hacienda, antes del 30 de abril."
  - id: d
    text:
      es: "El Presidente del Gobierno, antes del 31 de marzo."
  explanation:
    es: "El artículo 25.4 dice que el Ministro de la Presidencia (hoy, de la Presidencia, Justicia y Relaciones con las Cortes) eleva el Plan al Consejo de Ministros antes del 30 de abril. La opción del 30 de junio cambia la fecha. La del Ministro de Hacienda cambia el órgano. La del Presidente del Gobierno cambia el órgano y la fecha."
  citation: "art. 25.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1997-25336-art-7
- id: m01-l05-q019
  prompt:
    es: "De acuerdo con el artículo 7.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los Secretarios de Estado son:"
  options:
  - id: a
    text:
      es: "Órganos directivos de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica."
  - id: b
    correct: true
    text:
      es: "Órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica."
  - id: c
    text:
      es: "Miembros del Gobierno, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica de un Departamento."
  - id: d
    text:
      es: "Órganos superiores de la Administración General del Estado, responsables de la dirección de los servicios comunes de un Departamento."
  explanation:
    es: "El artículo 7.1 dice que los Secretarios de Estado son «órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica». No son órganos directivos, sino superiores. No son miembros del Gobierno, que se compone del Presidente, los Vicepresidentes y los Ministros (art. 1.2). La ley no les atribuye la dirección de los servicios comunes."
  citation: "art. 7.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q021
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la composición de la Comisión General de Secretarios de Estado y Subsecretarios es correcta?"
  options:
  - id: a
    text:
      es: "La integran los Ministros y los titulares de las Secretarías de Estado, y asiste también el Abogado General del Estado."
  - id: b
    text:
      es: "La integran los titulares de las Secretarías de Estado y los Directores Generales, y asiste también el Fiscal General del Estado."
  - id: c
    correct: true
    text:
      es: "La integran los titulares de las Secretarías de Estado y los Subsecretarios, y asiste también el Abogado General del Estado."
  - id: d
    text:
      es: "La integran los Subsecretarios de los Departamentos, y asiste también el Director del Gabinete del Presidente."
  explanation:
    es: "El artículo 8.1 dice que la Comisión «estará integrada por los titulares de las Secretarías de Estado y por los Subsecretarios de los distintos Departamentos Ministeriales» y que «asistirá igualmente el Abogado General del Estado». Los Ministros no la integran. Tampoco los Directores Generales, y quien asiste es el Abogado General del Estado, no el Fiscal General. Los Secretarios de Estado sí la integran, junto a los Subsecretarios."
  citation: "art. 8.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q023
  prompt:
    es: "Según el artículo 8.3 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿quién ejerce la Secretaría de la Comisión General de Secretarios de Estado y Subsecretarios?"
  options:
  - id: a
    text:
      es: "El Ministro de la Presidencia y, en caso de ausencia, vacante o enfermedad, el Subsecretario de la Presidencia."
  - id: b
    text:
      es: "El Director del Secretariado del Gobierno y, en caso de ausencia, vacante o enfermedad, el Subsecretario de la Presidencia."
  - id: c
    correct: true
    text:
      es: "El Subsecretario de la Presidencia y, en caso de ausencia, vacante o enfermedad, el Director del Secretariado del Gobierno."
  - id: d
    text:
      es: "El Abogado General del Estado y, en caso de ausencia, vacante o enfermedad, el Director del Secretariado del Gobierno."
  explanation:
    es: "El artículo 8.3 dice que la Secretaría «será ejercida por el Subsecretario de la Presidencia» y que, en caso de ausencia, vacante o enfermedad, «actuará como Secretario el Director del Secretariado del Gobierno». El Ministro de la Presidencia preside la Comisión en defecto de un Vicepresidente (art. 8.2), no es su Secretario. La opción que invierte el orden es incorrecta: el Director del Secretariado es el suplente. El Abogado General del Estado asiste a la Comisión (art. 8.1), pero no ejerce la Secretaría."
  citation: "art. 8.3 Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q024
  prompt:
    es: "De acuerdo con el artículo 8.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las deliberaciones de la Comisión General de Secretarios de Estado y Subsecretarios:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán reservadas, y en ningún caso podrá adoptar decisiones o acuerdos por delegación del Gobierno."
  - id: b
    text:
      es: "Serán secretas, y solo podrá adoptar decisiones por delegación expresa del Consejo de Ministros."
  - id: c
    text:
      es: "Serán reservadas, y podrá adoptar acuerdos por delegación del Gobierno en los asuntos de trámite."
  - id: d
    text:
      es: "Serán públicas, salvo acuerdo en contrario, y no podrá adoptar decisiones por delegación del Gobierno."
  explanation:
    es: "El artículo 8.4 dice que sus deliberaciones «serán reservadas» y que «en ningún caso la Comisión podrá adoptar decisiones o acuerdos por delegación del Gobierno». Secretas son las del Consejo de Ministros y las de las Comisiones Delegadas (arts. 5.3 y 6.5). La prohibición de actuar por delegación no admite excepciones, ni por delegación expresa ni en asuntos de trámite. Las deliberaciones no son públicas."
  citation: "art. 8.4 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q025
  prompt:
    es: "Señale la respuesta correcta sobre los asuntos que examina la Comisión General de Secretarios de Estado y Subsecretarios antes de que se sometan al Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "Examina todos los asuntos sin excepción, incluidos los nombramientos y los ceses."
  - id: b
    correct: true
    text:
      es: "Quedan excluidos de su examen, entre otros, los nombramientos y los ceses."
  - id: c
    text:
      es: "Solo examina los proyectos de ley y los proyectos de reglamento del Gobierno."
  - id: d
    text:
      es: "Quedan excluidos de su examen los proyectos de ley, que van directamente al Consejo de Ministros."
  explanation:
    es: "El artículo 8.5.a) le atribuye el examen de todos los asuntos que vayan a someterse al Consejo de Ministros, «excepto los nombramientos, ceses, ascensos a cualquiera de los empleos de la categoría de oficiales generales» y los que deban ir directamente al Consejo por urgencia. Por eso no examina los asuntos sin excepción. Su examen no se limita a proyectos de ley y de reglamento. Los proyectos de ley no figuran entre las excepciones."
  citation: "art. 8.5 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1997-25336-art-8
- id: m01-l05-q085
  prompt:
    es: "¿Cuál de las siguientes autoridades preside la Comisión General de Secretarios de Estado y Subsecretarios cuando no la preside un Vicepresidente del Gobierno, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro de la Presidencia."
  - id: b
    text:
      es: "El Ministro del Interior."
  - id: c
    text:
      es: "El Abogado General del Estado."
  - id: d
    text:
      es: "El Director del Secretariado del Gobierno."
  explanation:
    es: "El artículo 8.2 dice que, en defecto de Vicepresidente, preside el Ministro de la Presidencia. El Ministro del Interior no tiene esa función. El Abogado General del Estado asiste a la Comisión pero no la preside. El Director del Secretariado del Gobierno solo hace de Secretario si el Subsecretario de la Presidencia falta."
  citation: "art. 8.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-15
- id: m01-l05-q114
  prompt:
    es: "Según el artículo 15.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, además del Presidente del Gobierno, ¿quién puede proponer al Consejo de Ministros el nombramiento de un Secretario de Estado?"
  options:
  - id: a
    text:
      es: "El Subsecretario del Departamento."
  - id: b
    text:
      es: "El Presidente del Congreso de los Diputados."
  - id: c
    text:
      es: "El Abogado General del Estado."
  - id: d
    correct: true
    text:
      es: "El miembro del Gobierno a cuyo Departamento pertenezca el Secretario de Estado."
  explanation:
    es: "El artículo 15.1 recoge dos proponentes: el Presidente del Gobierno y el miembro del Gobierno a cuyo Departamento pertenezcan los Secretarios de Estado. El Subsecretario es un órgano directivo del Departamento y no propone el nombramiento. El Presidente del Congreso interviene en la investidura, no en estos nombramientos. El Abogado General del Estado asiste a la Comisión General de Secretarios de Estado y Subsecretarios, pero no propone."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
