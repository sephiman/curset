- id: m01-l04-q068
  prompt:
    es: "Señale la respuesta correcta sobre el estatuto jurídico de los Jueces y Magistrados de carrera, de acuerdo con el artículo 122.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Forman dos Cuerpos, uno de Jueces y otro de Magistrados, con estatuto fijado por ley ordinaria."
  - id: b
    correct: true
    text:
      es: "Forman un Cuerpo único y su estatuto lo determina la ley orgánica del poder judicial."
  - id: c
    text:
      es: "Forman un Cuerpo único cuyo estatuto fija el Consejo General del Poder Judicial mediante reglamento."
  - id: d
    text:
      es: "Forman un Cuerpo por cada orden jurisdiccional, con estatuto fijado por el Gobierno."
  explanation:
    es: "El artículo 122.1 dice que los Jueces y Magistrados de carrera «formarán un Cuerpo único» y que su estatuto lo determina la ley orgánica del poder judicial. Dos Cuerpos o uno por orden jurisdiccional rompen la unidad. Y el estatuto lo fija esa ley orgánica, no una ley ordinaria, un reglamento del Consejo o el Gobierno."
  citation: "art. 122.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q070
  prompt:
    es: "Señale la opción correcta. De acuerdo con el artículo 122.2 de la Constitución Española de 1978, el estatuto del Consejo General del Poder Judicial y sus funciones los establece:"
  options:
  - id: a
    text:
      es: "Un reglamento del propio Consejo."
  - id: b
    text:
      es: "Un real decreto del Gobierno."
  - id: c
    text:
      es: "La ley ordinaria de cada legislatura."
  - id: d
    correct: true
    text:
      es: "La ley orgánica."
  explanation:
    es: "El artículo 122.2 dice que «la ley orgánica establecerá su estatuto y el régimen de incompatibilidades de sus miembros y sus funciones». No se delega en un reglamento propio, en el Gobierno ni en una ley ordinaria."
  citation: "art. 122.2 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
