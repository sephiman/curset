type: case
title:
  en: URL shortener and distributed ID generation
scenario:
  en: 'A company runs a public URL shortener. A short link such as `sho.rt/Xk3pQ9` maps to a long URL, and the service
    creates about 5,000 new links per second while serving 50 times as many redirects. Links must never collide,
    and the identifier of a new link must be created on any of 20 stateless nodes without asking a central allocator.


    The team is comparing how to generate the identifiers and how to store the mapping:


    - A central auto-increment sequence is easy to reason about, but every node would have to coordinate with it
    for each new link.

    - UUIDs avoid coordination. Some are random, some embed a timestamp, and the team has to choose a version that
    suits an indexed link table.

    - The mapping is held in Redis Cluster, which splits the key space into hash slots. Related keys, such as the
    click counters of one link, should land in the same slot.

    - Other designs in the team''s reading list place keys on a consistent hashing ring with virtual nodes, as Dynamo
    does, so the effect of adding or removing a node is limited.'
questions:
- id: m09-case-e-q01
  lesson: m09-l04
  prompt:
    en: A URL shortener runs on 20 nodes that all mint identifiers for new short links. According to RFC 9562, which
      statement about UUIDs in distributed systems is correct?
  options:
  - id: a
    text:
      en: Coordinating sequential identifiers across the network is cheap
  - id: b
    correct: true
    text:
      en: UUIDs give unique, reasonably short values without coordination
  - id: c
    text:
      en: UUIDv4 values have good database-index locality
  - id: d
    text:
      en: UUIDv1 timestamps use the familiar Unix Epoch
  explanation:
    en: UUIDs can be used to create unique, reasonably short values in distributed systems without requiring coordination.
      Cheap coordination is wrong, because the effort to coordinate sequential numeric identifiers across a network
      can easily become a burden. Good index locality is wrong, because UUID versions that are not time ordered,
      such as UUIDv4, have poor database-index locality. A Unix Epoch for UUIDv1 is wrong, because its 100-nanosecond
      Gregorian Epoch is uncommon and difficult to represent accurately.
  citation: rfc9562#section-2.1
- id: m09-case-e-q02
  lesson: m09-l04
  prompt:
    en: A link table uses a random UUIDv4 as its primary key and receives thousands of inserts per second in a B-tree
      index. What problem does RFC 9562 describe for such identifiers?
  options:
  - id: a
    text:
      en: Their node field exposes MAC addresses that locate network interfaces
  - id: b
    text:
      en: Their time-ordered value field makes every insert hit the newest page
  - id: c
    correct: true
    text:
      en: New values are not close to each other, so inserts land at random index locations
  - id: d
    text:
      en: Their Gregorian Epoch timestamp is hard to represent accurately
  explanation:
    en: 'UUID versions that are not time ordered, such as UUIDv4, have poor database-index locality: new values
      are not close to each other, so inserts happen at random locations. Exposed MAC addresses is wrong for UUIDv4,
      because the exposed MAC address problem belongs to the node field of UUIDv1. A time-ordered value field is
      wrong for UUIDv4, because the time-ordered field is a feature of UUIDv7 and UUIDv4 is not time ordered. A
      Gregorian Epoch timestamp is wrong for UUIDv4, because the Gregorian Epoch is used by UUIDv1 timestamps.'
  citation: rfc9562#section-2.1
- id: m09-case-e-q04
  lesson: m09-l04
  prompt:
    en: A team needs time-ordered identifiers for a link table and may pick any UUID version, with no custom epoch
      required. According to RFC 9562, which version SHOULD implementations use if possible?
  options:
  - id: a
    text:
      en: UUIDv1
  - id: b
    text:
      en: UUIDv6
  - id: c
    correct: true
    text:
      en: UUIDv7
  - id: d
    text:
      en: UUIDv8
  explanation:
    en: Implementations SHOULD utilize UUIDv7 instead of UUIDv1 and UUIDv6 if possible. UUIDv1 is wrong, because
      implementations SHOULD use UUIDv7 instead of UUIDv1 and UUIDv6. UUIDv6 is wrong, because implementations SHOULD
      use UUIDv7 instead of UUIDv1 and UUIDv6. UUIDv8 is wrong, because it MUST be used only if other timestamp
      sources or a custom timestamp Epoch are required.
  citation: rfc9562#section-5.7
- id: m09-case-e-q06
  lesson: m09-l04
  prompt:
    en: A short-link service plans to keep UUIDv7 identifiers for decades. According to RFC 9562, until which year
      is the 48-bit timestamp of a UUIDv7 valid?
  options:
  - id: a
    text:
      en: The year 2038 AD
  - id: b
    correct: true
    text:
      en: The year 10889 AD
  - id: c
    text:
      en: The year 2106 AD
  - id: d
    text:
      en: The year 5138 AD
  explanation:
    en: UUIDv7 features a 48-bit timestamp valid until the year 10889 AD. The year 2038 is wrong, because the 48-bit
      timestamp is valid until the year 10889 AD. The year 2106 is wrong, because the 48-bit timestamp is valid
      until the year 10889 AD. The year 5138 is wrong, because the 48-bit timestamp is valid until the year 10889
      AD.
  citation: rfc9562#section-6.1
- id: m09-case-e-q09
  lesson: m09-l02
  prompt:
    en: A short-link store is sharded over several Redis Cluster nodes. According to the Redis documentation, how
      does Redis Cluster map each key to a node?
  options:
  - id: a
    correct: true
    text:
      en: Each key belongs to a hash slot, not to a consistent hashing ring
  - id: b
    text:
      en: It places keys on a consistent hashing ring with virtual nodes
  - id: c
    text:
      en: It assigns keys to range partitions with explicit bounds
  - id: d
    text:
      en: It assigns keys to list partitions naming the key values
  explanation:
    en: Redis Cluster does not use consistent hashing, but a form of sharding where every key is conceptually part
      of a hash slot. A consistent hashing ring is wrong, because Redis Cluster does not use consistent hashing.
      Range partitions are wrong, because Redis Cluster uses a form of sharding in which every key is part of a
      hash slot. List partitions are wrong, because every key is conceptually part of a hash slot.
  citation: redis-scaling#redis-cluster-data-sharding
- id: m09-case-e-q10
  lesson: m09-l02
  prompt:
    en: A short-link store on Redis Cluster uses the key `{user1000}.following`. According to the Redis documentation,
      which part of that key is hashed to obtain its hash slot?
  options:
  - id: a
    correct: true
    text:
      en: Only `user1000`, the substring between the braces
  - id: b
    text:
      en: The whole string `{user1000}.following`
  - id: c
    text:
      en: Only `.following`, the part after the braces
  - id: d
    text:
      en: Only `following`, without the dot
  explanation:
    en: If the key contains a `{...}` pattern, only the substring between `{` and `}` is hashed to obtain the hash
      slot. The whole string is wrong, because when the key has a `{...}` pattern only the substring between `{`
      and `}` is hashed. The part after the braces is wrong, because only the substring between `{` and `}` is hashed.
      The word `following` is wrong, because only the substring between `{` and `}` is hashed.
  citation: redis-cluster-spec#hash-tags
- id: m09-case-e-q11
  lesson: m09-l02
  prompt:
    en: Dynamo-style consistent hashing places each node at a random point on the ring, which leaves data and load
      unevenly spread. How does Dynamo address that problem?
  options:
  - id: a
    text:
      en: It maps each node to exactly one point on the ring
  - id: b
    correct: true
    text:
      en: It assigns each node to multiple points on the ring as virtual nodes
  - id: c
    text:
      en: It replaces the ring with a fixed set of 16384 hash slots
  - id: d
    text:
      en: It gives every node the same number of virtual nodes whatever its capacity
  explanation:
    en: Each node in Dynamo gets assigned to multiple points in the ring, using the concept of virtual nodes. One
      point per node is wrong, because instead of mapping a node to a single point each node gets multiple points
      on the ring. Replacing the ring with 16384 hash slots is wrong, because that is the Redis Cluster scheme,
      which does not use consistent hashing, while Dynamo relies on it. An equal number of virtual nodes is wrong,
      because the number of virtual nodes can be decided based on the capacity of a node.
  citation: paper-dynamo#p6
- id: m09-case-e-q12
  lesson: m09-l02
  prompt:
    en: A short-link service uses a consistent hashing ring to place its keys, and one node leaves the ring. According
      to the Dynamo paper, whom does the departure of a node affect?
  options:
  - id: a
    correct: true
    text:
      en: Only its immediate neighbours on the ring
  - id: b
    text:
      en: Every node on the ring, which all remap their keys
  - id: c
    text:
      en: Only the nodes on the opposite side of the ring
  - id: d
    text:
      en: No node at all, because the keys are lost
  explanation:
    en: The principal advantage of consistent hashing is that departure or arrival of a node only affects its immediate
      neighbours. Every node is wrong, because departure or arrival of a node only affects its immediate neighbours
      and other nodes remain unaffected. The opposite side is wrong, because only the immediate neighbours are affected.
      No effect is wrong, because the immediate neighbours of the departing node are affected.
  citation: paper-dynamo#p6
- id: m09-case-e-q14
  lesson: m09-l04
  prompt:
    en: A short-link store runs a stable Redis Cluster with no resharding in progress. According to the Redis Cluster
      specification, how many nodes serve a given hash slot?
  options:
  - id: a
    text:
      en: Every node of the cluster
  - id: b
    text:
      en: Exactly two nodes sharing the load
  - id: c
    text:
      en: Three nodes chosen by majority
  - id: d
    correct: true
    text:
      en: A single node
  explanation:
    en: When the cluster is stable, a single hash slot is served by a single node. Every node is wrong, because
      a single hash slot is served by a single node when the cluster is stable. Two nodes is wrong, because a single
      hash slot is served by a single node when the cluster is stable. Three nodes is wrong, because a single hash
      slot is served by a single node when the cluster is stable.
  citation: redis-cluster-spec#key-distribution-model
- id: m09-case-e-q15
  lesson: m09-l04
  prompt:
    en: In the Redis Cluster formula that maps a key to a hash slot, the CRC16 value is reduced modulo 16384. How
      many of the 16 CRC16 output bits does Redis Cluster use?
  options:
  - id: a
    text:
      en: '16'
  - id: b
    text:
      en: '12'
  - id: c
    text:
      en: '10'
  - id: d
    correct: true
    text:
      en: '14'
  explanation:
    en: 14 out of 16 CRC16 output bits are used, which is why the formula has a modulo 16384 operation. Using all
      16 bits is wrong, because only 14 out of 16 CRC16 output bits are used. Using 12 bits is wrong, because the
      specification counts 14 bits. Using 10 bits is wrong, because the specification counts 14 bits.
  citation: redis-cluster-spec#key-distribution-model
