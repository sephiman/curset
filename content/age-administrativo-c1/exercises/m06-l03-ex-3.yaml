# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q062
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ruta del menú contextual de un archivo crea una carpeta comprimida en zip?"
  options:
  - id: a
    text:
      es: "Extraer todo..."
  - id: b
    correct: true
    text:
      es: "Mostrar más opciones › Enviar a › Carpeta comprimida (en zip)"
  - id: c
    text:
      es: "Abrir con › Elegir otra aplicación"
  - id: d
    text:
      es: "Mostrar más opciones › Conceder acceso a › Personas específicas"
  explanation:
    es: "La página de compresión indica que se hace clic con el botón derecho en el archivo o carpeta y se selecciona «Mostrar más opciones>Enviar a>carpeta comprimida (en zip)». Extraer todo... hace lo contrario: descomprime el contenido de una carpeta comprimida. Abrir con › Elegir otra aplicación sirve para elegir con qué aplicación se abre el archivo, y Conceder acceso a › Personas específicas sirve para compartirlo en la red local."
  citation: "fuente: `ms-win-comprimir.html`; «Para comprimir (comprimir)»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q063
  prompt:
    es: "En Windows 11, al seleccionar Mostrar más opciones › Enviar a › Carpeta comprimida (en zip) sobre un archivo, la nueva carpeta comprimida se crea:"
  options:
  - id: a
    correct: true
    text:
      es: "Con el mismo nombre y en la misma ubicación que el archivo."
  - id: b
    text:
      es: "Con el mismo nombre, pero en la carpeta Documentos del usuario."
  - id: c
    text:
      es: "Con el nombre que pide Windows, en la misma ubicación del archivo."
  - id: d
    text:
      es: "Con el mismo nombre, pero en la carpeta Descargas del usuario."
  explanation:
    es: "La página dice: «Se crea una nueva carpeta comprimida con el mismo nombre en la misma ubicación». Si se quiere otro nombre, se cambia después con Cambiar nombre; Windows no lo pide al crearla. Tampoco la guarda en Documentos ni en Descargas."
  citation: "fuente: `ms-win-comprimir.html`; «Para comprimir (comprimir)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q064
  prompt:
    es: "En Windows 11, ¿qué opción del menú contextual de una carpeta comprimida descomprime todo su contenido?"
  options:
  - id: a
    text:
      es: "Compartir"
  - id: b
    correct: true
    text:
      es: "Extraer todo..."
  - id: c
    text:
      es: "Enviar a"
  - id: d
    text:
      es: "Cambiar nombre"
  explanation:
    es: "La página de compresión indica que, para descomprimir todo el contenido, se hace clic con el botón derecho en la carpeta comprimida y se selecciona «Extraer todo...». Enviar a lleva a destinos como Carpeta comprimida (en zip), que comprime; Cambiar nombre cambia el nombre de la carpeta y Compartir la comparte."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q065
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes formas descomprime un solo archivo de una carpeta comprimida, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir la carpeta comprimida y arrastrar el archivo a otra ubicación."
  - id: b
    text:
      es: "Seleccionar el archivo dentro de la carpeta comprimida y pulsar la tecla F2."
  - id: c
    text:
      es: "Abrir la carpeta comprimida y pulsar Mayús+Supr sobre el archivo."
  - id: d
    text:
      es: "Cambiar la extensión de la carpeta comprimida por la del archivo."
  explanation:
    es: "La página indica que, para descomprimir un solo archivo o carpeta, se abre la carpeta comprimida y se arrastra el elemento «desde la carpeta comprimida a una nueva ubicación». F2 cambia el nombre del elemento seleccionado; Mayús+Supr lo elimina sin moverlo a la Papelera, y cambiar una extensión no convierte ni extrae nada."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q066
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre añadir archivos cifrados a una carpeta comprimida en Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Quedan cifrados con la contraseña de la cuenta del usuario al descomprimirlos."
  - id: b
    correct: true
    text:
      es: "Quedan sin cifrar al descomprimirlos, por lo que se recomienda no comprimirlos."
  - id: c
    text:
      es: "Siguen cifrados al descomprimirlos, porque la carpeta comprimida conserva el cifrado."
  - id: d
    text:
      es: "No se pueden añadir a una carpeta comprimida, porque Windows lo impide siempre."
  explanation:
    es: "La nota de la página dice: «Si agregas archivos cifrados a una carpeta comprimida, estarán sin cifrar cuando se descompriman», y recomienda no comprimir archivos cifrados. Quedar cifrados con la contraseña de la cuenta y seguir cifrados porque la carpeta conserva el cifrado contradicen «sin cifrar». Y que Windows lo impida siempre contradice «si agregas archivos cifrados», que supone que se pueden añadir y advierte de la consecuencia."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q067
  prompt:
    es: "En Windows 11, si se comprimen varias imágenes JPEG en una carpeta comprimida, ¿qué tamaño total tendrá la carpeta, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Aproximadamente la mitad que la colección original"
  - id: b
    correct: true
    text:
      es: "Aproximadamente el mismo que la colección original"
  - id: c
    text:
      es: "Aproximadamente el doble que la colección original"
  - id: d
    text:
      es: "Aproximadamente la décima parte de la colección original"
  explanation:
    es: "La página explica que las imágenes JPEG ya están muy comprimidas y que, si se comprimen varias en una carpeta, «el tamaño total de la carpeta será aproximadamente el mismo que la colección original de imágenes». No baja a la mitad ni a la décima parte, ni sube al doble."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "cantidad"
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q068
  prompt:
    es: "En Windows 11, ¿cómo se agregan archivos o carpetas a una carpeta comprimida que se creó anteriormente, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Cambiando su extensión de nombre de archivo a zip"
  - id: b
    correct: true
    text:
      es: "Arrastrándolos hasta la carpeta comprimida"
  - id: c
    text:
      es: "Pulsando Ctrl+Mayús+N dentro de la carpeta comprimida"
  - id: d
    text:
      es: "Seleccionando Extraer todo... en la carpeta comprimida"
  explanation:
    es: "La nota de la página dice: «Para agregar archivos o carpetas a una carpeta que creaste anteriormente, arrástralos a la carpeta comprimida». Extraer todo... descomprime el contenido; cambiar la extensión no convierte el archivo a otro formato, según la página de extensiones, y Ctrl+Mayús+N crea una carpeta nueva."
  citation: "fuente: `ms-win-comprimir.html`; «Para descomprimir (extraer)»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q069
  prompt:
    es: "Según la ayuda de Microsoft sobre comprimir y descomprimir archivos, ¿cuál de los siguientes grupos de formatos admite Windows 11, versión 24H2?"
  options:
  - id: a
    text:
      es: "ZIP y RAR solamente"
  - id: b
    correct: true
    text:
      es: "ZIP, RAR, 7z y TAR"
  - id: c
    text:
      es: "ZIP, 7z y TAR solamente"
  - id: d
    text:
      es: "ZIP solamente"
  explanation:
    es: "La página de preguntas frecuentes dice que «Windows 11, versión 24H2 admite ZIP, RAR» y los formatos de archivo 7z y TAR. Los demás grupos dejan fuera alguno de esos cuatro. La misma página añade que la versión 24H2 no admite operaciones en archivos comprimidos cifrados."
  citation: "fuente: `ms-win-comprimir.html`; «Preguntas frecuentes»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-comprimir-html
- id: m06-l03-q070
  prompt:
    es: "¿Cuál de las siguientes es una ventaja de los archivos comprimidos en Windows 11, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Quedan cifrados y protegidos frente a cualquier acceso no autorizado."
  - id: b
    correct: true
    text:
      es: "Ocupan menos espacio y se transfieren a otros equipos más rápido."
  - id: c
    text:
      es: "Impiden abrir su contenido hasta extraerlo con Extraer todo..."
  - id: d
    text:
      es: "Agrupan los archivos sin cambiar el tamaño total que ocupan."
  explanation:
    es: "La página dice: «Los archivos comprimidos ocupan menos espacio de almacenamiento y se pueden transferir a otros equipos más rápidamente que los archivos sin comprimir». No cifran el contenido: la misma página avisa de que los archivos cifrados quedan sin cifrar al descomprimirlos. Tampoco agrupan sin reducir el tamaño, porque la página dice que lo reducen, ni impiden trabajar con su contenido: «se trabaja con las carpetas y archivos comprimidos de la misma manera que con los que están sin comprimir»."
  citation: "fuente: `ms-win-comprimir.html`; «Comprimir y descomprimir archivos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q101
  prompt:
    es: "En el Explorador de archivos de Windows 11, tras pulsar «Mostrar más opciones» sobre una carpeta, ¿cuál de los siguientes comandos lleva a «Personas específicas» para compartirla en la red local?"
  options:
  - id: a
    correct: true
    text:
      es: "Conceder acceso a"
  - id: b
    text:
      es: "Quitar acceso"
  - id: c
    text:
      es: "Anclar a acceso rápido"
  - id: d
    text:
      es: "Asignar unidad de red"
  explanation:
    es: "La página de Microsoft indica que, en el menú «Mostrar más opciones», se selecciona «Conceder acceso a» y se elige «Personas específicas». «Quitar acceso» es la opción de ese mismo submenú que deja de compartir. «Anclar a acceso rápido» fija la carpeta en Acceso rápido. «Asignar unidad de red» conecta una letra de unidad a una carpeta de otro equipo; no comparte la carpeta propia."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo compartir carpetas a través de una red?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q102
  prompt:
    es: "En Windows 11, al compartir un archivo en la red local con «Conceder acceso a › Personas específicas», ¿qué se selecciona para dar acceso a todos los usuarios de la red?"
  options:
  - id: a
    text:
      es: "La opción Todas las redes"
  - id: b
    correct: true
    text:
      es: "La opción Todos"
  - id: c
    text:
      es: "La opción Redes privadas"
  - id: d
    text:
      es: "La opción Usuarios específicos"
  explanation:
    es: "Según la página, se selecciona un usuario de la red con quien compartir el archivo «o seleccione Todos» para dar acceso a todos los usuarios de la red. «Todas las redes» y «Redes privadas» son apartados de la ventana «Configuración de uso compartido avanzado», donde se activan o desactivan opciones de uso compartido. «Usuarios específicos» es la opción de la pestaña Compartir de Windows 10, y sirve para elegir usuarios concretos, no a todos."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo compartir carpetas a través de una red?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q103
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones, elegida dentro de «Conceder acceso a» en el menú «Mostrar más opciones», deja de compartir una carpeta en la red local?"
  options:
  - id: a
    text:
      es: "Personas específicas"
  - id: b
    text:
      es: "Desanclar del acceso rápido"
  - id: c
    correct: true
    text:
      es: "Quitar acceso"
  - id: d
    text:
      es: "Extraer todo..."
  explanation:
    es: "La página indica que, para dejar de compartir, se pulsa «Mostrar más opciones», se selecciona «Conceder acceso a» y se elige «Quitar acceso». «Personas específicas» es la opción del mismo submenú que comparte la carpeta. «Desanclar del acceso rápido» quita la carpeta de Acceso rápido. «Extraer todo...» descomprime una carpeta comprimida."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo dejar de compartir carpetas?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q104
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿en qué carpetas aparece la opción «Quitar acceso» del submenú «Conceder acceso a»?"
  options:
  - id: a
    text:
      es: "Solo en las carpetas compartidas antes con Personas específicas"
  - id: b
    text:
      es: "Solo en las carpetas compartidas con Todos los usuarios de la red"
  - id: c
    text:
      es: "Solo en las carpetas compartidas con la detección de redes activada"
  - id: d
    correct: true
    text:
      es: "En todas las carpetas, incluso en las que no se comparten a través de una red"
  explanation:
    es: "La página responde a por qué aparece «Quitar acceso» en carpetas que no se han compartido: el Explorador de archivos muestra esa opción para todas las carpetas, incluso las que no se comparten a través de una red. Las tres opciones que la limitan a carpetas ya compartidas, con Personas específicas, con Todos o con la detección de redes activada, contradicen esa frase."
  citation: "fuente: `ms-win-compartir-red.html`; «Quitar acceso»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q105
  prompt:
    es: "En Windows 11, ¿qué se escribe en la barra de direcciones del Explorador de archivos para saber qué carpetas se han compartido en la red?"
  options:
  - id: a
    text:
      es: "services.msc"
  - id: b
    correct: true
    text:
      es: "\\\\localhost"
  - id: c
    text:
      es: "\\\\system07\\C$\\"
  - id: d
    text:
      es: "Este equipo"
  explanation:
    es: "La página indica que, para saber qué carpetas se han compartido, se abre el Explorador de archivos y se escribe \\\\localhost en la barra de direcciones. services.msc se escribe en el cuadro Ejecutar para abrir los servicios. \\\\system07\\C$\\ es, según la página de rutas UNC, el directorio raíz de la unidad C: en system07. Este equipo proporciona acceso a las unidades del equipo y a los dispositivos conectados, no muestra las carpetas compartidas."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo saber qué carpetas he compartido por una red?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q106
  prompt:
    es: "En Windows 11, se comparte una carpeta del perfil de usuario y, al ir a \\\\localhost, aparece el perfil con todos sus archivos. ¿Cuál de las siguientes afirmaciones explica lo que se ve?"
  options:
  - id: a
    correct: true
    text:
      es: "El usuario tiene acceso a sus propios archivos; no están todos compartidos"
  - id: b
    text:
      es: "Todos los archivos del perfil de usuario han quedado compartidos en la red local"
  - id: c
    text:
      es: "La carpeta compartida se ha movido a la raíz del perfil de usuario"
  - id: d
    text:
      es: "La detección de redes está desactivada y se muestra todo el perfil"
  explanation:
    es: "La nota de la página dice que, tras compartir una carpeta del perfil e ir a \\\\localhost, se ve el perfil con todos sus archivos, y que eso no significa que todos estén compartidos, solo que el usuario tiene acceso a todos sus propios archivos. La opción de que todo el perfil se ha compartido es lo que la nota niega. Compartir no mueve la carpeta. La detección de redes sirve para ver los dispositivos de la red y no explica lo que aparece en \\\\localhost."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo saber qué carpetas he compartido por una red?»"
  difficulty: 3
  tags:
  - "comportamiento"
