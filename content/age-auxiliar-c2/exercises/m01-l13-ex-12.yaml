# anchor: boe-a-1995-8729-art-64
- id: m01-l13-q357
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuándo puede destinarse con carácter forzoso a un funcionario en comisión de servicios?"
  options:
  - id: a
    text:
      es: "Cuando el puesto quede vacante y ningún funcionario solicite la comisión voluntaria."
  - id: b
    text:
      es: "Cuando el puesto del funcionario se suprima como consecuencia de un Plan de Empleo."
  - id: c
    text:
      es: "Cuando el funcionario haya sido removido del puesto que había obtenido por concurso de méritos."
  - id: d
    correct: true
    text:
      es: "Cuando, celebrado concurso, la vacante se declare desierta y sea urgente su provisión."
  explanation:
    es: "El artículo 64.2 dispone que, «cuando, celebrado concurso para la provisión de una vacante, ésta se declare desierta y sea urgente para el servicio su provisión», podrá destinarse con carácter forzoso a un funcionario. No basta que nadie pida la comisión voluntaria: hace falta un concurso celebrado y declarado desierto. La supresión del puesto por un Plan de Empleo lleva a la reasignación de efectivos (artículo 60.1), y la remoción del puesto obtenido por concurso lleva a la adscripción provisional (artículo 63)."
  citation: "art. 64.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1995-8729-art-63
- id: m01-l13-q359
  prompt:
    es: "De acuerdo con el artículo 63 del Real Decreto 364/1995, de 10 de marzo, los puestos de trabajo pueden proveerse por adscripción provisional en el supuesto de:"
  options:
  - id: a
    correct: true
    text:
      es: "reingreso al servicio activo de un funcionario sin reserva de puesto de trabajo."
  - id: b
    text:
      es: "vacante no cubierta en el concurso convocado para su provisión definitiva."
  - id: c
    text:
      es: "solicitud del funcionario por motivos de salud o de rehabilitación propios."
  - id: d
    text:
      es: "aumento temporal de las tareas de una unidad que sus titulares no puedan atender a tiempo."
  explanation:
    es: "El artículo 63 admite la adscripción provisional «únicamente» en tres supuestos: la remoción o el cese en un puesto obtenido por concurso o libre designación, la supresión del puesto y el «reingreso al servicio activo de los funcionarios sin reserva de puesto de trabajo». La vacante que el concurso deja sin cubrir se cubre, si es urgente, por comisión de servicios forzosa (artículo 64.2). Los motivos de salud o de rehabilitación llevan a la movilidad del artículo 66 bis. El aumento temporal de tareas no es ninguno de los tres supuestos del artículo 63."
  citation: "art. 63 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-1995-8729-art-59
- id: m01-l13-q361
  prompt:
    es: "Conforme al artículo 59.1 del Real Decreto 364/1995, de 10 de marzo, el funcionario que ocupa con carácter definitivo un puesto no singularizado puede ser adscrito por redistribución de efectivos a otro puesto:"
  options:
  - id: a
    text:
      es: "de la misma naturaleza y nivel de complemento de destino, aunque suponga un cambio de municipio."
  - id: b
    correct: true
    text:
      es: "de la misma naturaleza, nivel de complemento de destino y complemento específico, sin cambio de municipio."
  - id: c
    text:
      es: "de cualquier naturaleza o nivel, siempre que para su provisión esté previsto el mismo procedimiento."
  - id: d
    text:
      es: "de nivel de complemento de destino superior en no más de dos niveles, y sin cambio de municipio alguno."
  explanation:
    es: "El artículo 59.1 permite adscribir a esos funcionarios «a otros de la misma naturaleza, nivel de complemento de destino y complemento específico, siempre que para la provisión de los referidos puestos esté previsto el mismo procedimiento y sin que ello suponga cambio de municipio». La redistribución nunca implica cambio de municipio. El mismo procedimiento de provisión es un requisito más, que no sustituye a la misma naturaleza. El nivel tiene que ser el mismo, no uno superior."
  citation: "art. 59.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-59
- id: m01-l13-q362
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿con qué carácter se ocupa el puesto de trabajo al que se accede por redistribución de efectivos?"
  options:
  - id: a
    text:
      es: "Con carácter provisional, hasta que el puesto se convoque a concurso."
  - id: b
    text:
      es: "Con carácter provisional, por un año prorrogable por otro año más."
  - id: c
    text:
      es: "Con carácter definitivo, pero solo tras dos años de permanencia."
  - id: d
    correct: true
    text:
      es: "Con carácter definitivo, igual que el puesto que se desempeñaba."
  explanation:
    es: "El artículo 59.1 dice que «el puesto de trabajo al que se acceda a través de la redistribución de efectivos tendrá asimismo carácter definitivo». El carácter definitivo es inmediato, no espera a dos años de permanencia. La provisionalidad hasta la convocatoria es propia de la adscripción provisional (artículo 72.2). El año prorrogable por otro es la duración de la comisión de servicios (artículo 64.3)."
  citation: "art. 59.1 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-1995-8729-art-60
- id: m01-l13-q363
  prompt:
    es: "De acuerdo con el artículo 60.3 del Real Decreto 364/1995, de 10 de marzo, en la primera fase de la reasignación de efectivos, el funcionario puede ser reasignado en su Departamento en el plazo máximo de:"
  options:
  - id: a
    text:
      es: "tres meses desde la supresión del puesto de trabajo."
  - id: b
    correct: true
    text:
      es: "seis meses desde la supresión del puesto de trabajo."
  - id: c
    text:
      es: "seis meses desde la aprobación del Plan de Empleo."
  - id: d
    text:
      es: "un año desde la aprobación del Plan de Empleo."
  explanation:
    es: "Según el artículo 60.3, en la fase 1.ª, «en el plazo máximo de seis meses desde la supresión del puesto de trabajo», el funcionario puede ser reasignado en el ámbito del mismo Departamento. Tres meses es el plazo de la fase 2.ª, para un puesto en otro Departamento. El plazo se cuenta desde la supresión del puesto, no desde la aprobación del Plan de Empleo, y no llega al año."
  citation: "art. 60.3 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-60
- id: m01-l13-q364
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál es la situación del funcionario que no obtiene puesto en las dos primeras fases de la reasignación de efectivos?"
  options:
  - id: a
    correct: true
    text:
      es: "La situación administrativa de expectativa de destino."
  - id: b
    text:
      es: "La situación administrativa de excedencia forzosa."
  - id: c
    text:
      es: "La situación administrativa de servicios especiales."
  - id: d
    text:
      es: "La de servicio activo, con un puesto en adscripción provisional."
  explanation:
    es: "El artículo 60.3, fase 3.ª, dice que los funcionarios que tras las fases anteriores no hayan obtenido un puesto «serán adscritos […] a través de relaciones específicas de puestos en reasignación, siendo declarados en la situación administrativa de expectativa de destino». No pasan a excedencia forzosa ni a servicios especiales. Tampoco siguen en servicio activo con adscripción provisional: el mismo apartado dice que su reasignación posterior «conllevará el reingreso al servicio activo»."
  citation: "art. 60.3 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-66-bis
- id: m01-l13-q365
  prompt:
    es: "Según el artículo 66 bis del Real Decreto 364/1995, de 10 de marzo, la movilidad por razones de salud o de rehabilitación puede pedirse por motivos del propio funcionario o de:"
  options:
  - id: a
    text:
      es: "sus parientes hasta el segundo grado."
  - id: b
    text:
      es: "cualquier persona que conviva con él."
  - id: c
    correct: true
    text:
      es: "su cónyuge o los hijos a su cargo."
  - id: d
    text:
      es: "sus padres, si dependen de su cuidado."
  explanation:
    es: "El artículo 66 bis.1 exige una «solicitud basada en motivos de salud o rehabilitación del funcionario, su cónyuge, o los hijos a su cargo», con informe previo del servicio médico oficial. No incluye a los parientes hasta el segundo grado, a otros convivientes ni a los padres: esos círculos de personas aparecen en otros derechos, como los permisos del artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público, pero no en esta movilidad."
  citation: "art. 66 bis RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-66-bis
- id: m01-l13-q366
  prompt:
    es: "En la movilidad por razones de salud o de rehabilitación del funcionario de la Administración General del Estado, el puesto de destino debe estar vacante, dotado presupuestariamente, ser de necesaria provisión y tener:"
  options:
  - id: a
    text:
      es: "complementos de destino y específico exactamente iguales a los del puesto de origen."
  - id: b
    text:
      es: "un nivel de complemento de destino no inferior al de su grado personal."
  - id: c
    text:
      es: "complementos no superiores en más de dos niveles a los del puesto de origen."
  - id: d
    correct: true
    text:
      es: "complementos de destino y específico no superiores a los del puesto de origen."
  explanation:
    es: "El artículo 66 bis.2 del Real Decreto 364/1995 condiciona la adscripción a que exista un puesto vacante, dotado presupuestariamente, «cuyo nivel de complemento de destino y específico no sea superior al del puesto de origen, y que sea de necesaria provisión». Basta con que no sean superiores: no se exige que sean iguales. El grado personal no es el límite que fija el artículo. Tampoco se admite un puesto hasta dos niveles por encima: el límite es el nivel del puesto de origen."
  citation: "art. 66 bis RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-66-ter
- id: m01-l13-q367
  prompt:
    es: "Según el artículo 66 ter del Real Decreto 364/1995, de 10 de marzo, ¿en qué plazo deben producirse el cese y la toma de posesión de la funcionaria víctima de violencia de género que obtiene el traslado?"
  options:
  - id: a
    correct: true
    text:
      es: "En tres días hábiles sin cambio de residencia, o en un mes con cambio de residencia."
  - id: b
    text:
      es: "En tres días hábiles sin cambio de residencia, o en ocho días con cambio de residencia."
  - id: c
    text:
      es: "En ocho días hábiles sin cambio de residencia, o en un mes con cambio de residencia."
  - id: d
    text:
      es: "En tres días hábiles sin cambio de residencia, o en dos meses con cambio de residencia."
  explanation:
    es: "El artículo 66 ter.2 dice que el cese y la toma de posesión «deberán producirse en el plazo de tres días hábiles si no implica cambio de residencia de la funcionaria, o de un mes si comporta cambio de residencia». Los ocho días son el plazo de la comisión de servicios voluntaria con cambio de residencia (artículo 64.4), no el de este traslado. Sin cambio de residencia el plazo es de tres días hábiles, no de ocho, y con cambio de residencia es de un mes, no de dos."
  citation: "art. 66 ter RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-82
- id: m01-l13-q368
  prompt:
    es: "De acuerdo con el artículo 82.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las funcionarias víctimas de violencia de género o sexual tienen derecho al traslado si se ven obligadas a dejar su puesto:"
  options:
  - id: a
    text:
      es: "para atender el cuidado directo de hijos o de familiares a su cargo."
  - id: b
    correct: true
    text:
      es: "para hacer efectiva su protección o el derecho a la asistencia social integral."
  - id: c
    text:
      es: "por motivos de salud o rehabilitación acreditados por el servicio médico."
  - id: d
    text:
      es: "para acompañar a su cónyuge, destinado de forma definitiva en otra localidad."
  explanation:
    es: "El artículo 82.1 reconoce el derecho al traslado a las mujeres víctimas de violencia de género o de violencia sexual que se vean obligadas a abandonar su puesto «para hacer efectiva su protección o el derecho a la asistencia social integral». El cuidado de hijos o familiares no es la finalidad de este traslado. Los motivos de salud o rehabilitación con informe médico son los de la movilidad del artículo 66 bis del Real Decreto 364/1995. El destino del cónyuge en otra localidad tampoco es la causa que fija el artículo."
  citation: "art. 82.1 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-80
- id: m01-l13-q371
  prompt:
    es: "Según el artículo 80.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la libre designación con convocatoria pública consiste en:"
  options:
  - id: a
    correct: true
    text:
      es: "la apreciación discrecional por el órgano competente de la idoneidad de los candidatos en relación con los requisitos del puesto."
  - id: b
    text:
      es: "la valoración por una comisión de los méritos de los candidatos, con arreglo al baremo fijado en la convocatoria."
  - id: c
    text:
      es: "la apreciación reglada por el órgano competente de la idoneidad de los candidatos, conforme a un baremo público."
  - id: d
    text:
      es: "la elección por el órgano competente del candidato con mayor antigüedad entre los que reúnan los requisitos."
  explanation:
    es: "El artículo 80.1 TREBEP define la libre designación con convocatoria pública como «la apreciación discrecional por el órgano competente de la idoneidad de los candidatos en relación con los requisitos exigidos para el desempeño del puesto». La valoración de méritos por una comisión con baremo es el concurso. La apreciación no es reglada sino discrecional. No se elige por antigüedad."
  citation: "art. 80.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-51
- id: m01-l13-q372
  prompt:
    es: "Según el artículo 51.2 del Real Decreto 364/1995, de 10 de marzo, ¿cuál de los siguientes puestos nombra expresamente entre los que pueden cubrirse por libre designación?"
  options:
  - id: a
    text:
      es: "El puesto de Jefe de Área."
  - id: b
    text:
      es: "El puesto de Jefe de Servicio."
  - id: c
    text:
      es: "El puesto de Consejero Técnico."
  - id: d
    correct: true
    text:
      es: "El puesto de Subdirector general."
  explanation:
    es: "El artículo 51.2 RD 364/1995 enumera «los puestos de Subdirector general, Delegados y Directores territoriales, provinciales o Comisionados […], Secretarías de Altos Cargos de la Administración», y añade los de carácter directivo o de especial responsabilidad que determinen las relaciones de puestos de trabajo. Jefe de Área, Jefe de Servicio y Consejero Técnico no están en la enumeración: solo irán por libre designación si la relación de puestos de trabajo lo determina."
  citation: "art. 51.2 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-51
- id: m01-l13-q373
  prompt:
    es: "Según el artículo 51.2 del Real Decreto 364/1995, de 10 de marzo, además de los puestos que enumera, podrán cubrirse por libre designación:"
  options:
  - id: a
    text:
      es: "los que hayan quedado desiertos en un concurso anterior, si su provisión es urgente para el servicio."
  - id: b
    text:
      es: "los que el Subsecretario de cada Departamento califique de confianza mediante una resolución motivada."
  - id: c
    correct: true
    text:
      es: "los de carácter directivo o de especial responsabilidad para los que así se determine en las relaciones de puestos de trabajo."
  - id: d
    text:
      es: "los de nivel de complemento de destino 28 o superior, cualquiera que sea el contenido concreto de sus funciones."
  explanation:
    es: "El artículo 51.2 RD 364/1995 cierra su lista con «aquellos otros de carácter directivo o de especial responsabilidad para los que así se determine en las relaciones de puestos de trabajo». El concurso desierto con provisión urgente lleva a la comisión de servicios forzosa, no a la libre designación. El artículo no deja la calificación al Subsecretario. Tampoco fija un nivel mínimo: atiende al carácter directivo o a la especial responsabilidad."
  citation: "art. 51.2 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1995-8729-art-54
- id: m01-l13-q375
  prompt:
    es: "Según el artículo 54.1 del Real Decreto 364/1995, de 10 de marzo, si el nombramiento por libre designación va a recaer en un funcionario de otro Departamento y este deja pasar quince días naturales sin emitir su informe, el informe:"
  options:
  - id: a
    correct: true
    text:
      es: "se considerará favorable a efectos del nombramiento."
  - id: b
    text:
      es: "se considerará desfavorable a todos los efectos."
  - id: c
    text:
      es: "se reclamará de nuevo con un plazo adicional."
  - id: d
    text:
      es: "dejará de ser necesario por haber caducado el trámite."
  explanation:
    es: "El artículo 54.1 RD 364/1995 exige informe favorable del Departamento donde está destinado el funcionario y dice: «De no emitirse en el plazo de quince días naturales se considerará favorable». El silencio no se considera desfavorable. Reclamar el informe de nuevo con más plazo sustituye el efecto que fija la propia frase por otro trámite. El trámite no caduca ni deja de ser necesario: el informe se considera emitido y favorable, y el nombramiento puede seguir."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-67
- id: m01-l13-q378
  prompt:
    es: "Según el artículo 67 del Real Decreto 364/1995, de 10 de marzo, para obtener por libre designación un destino en una Comunidad Autónoma, el funcionario de la Administración General del Estado necesita:"
  options:
  - id: a
    text:
      es: "el informe favorable del Departamento donde presta servicios, que se considera desfavorable si no se emite en quince días naturales."
  - id: b
    correct: true
    text:
      es: "el informe favorable del Departamento donde presta servicios, que se considera favorable si no se emite en quince días naturales."
  - id: c
    text:
      es: "la autorización previa de la Secretaría de Estado de Función Pública, sin que el Departamento deba informar sobre el nombramiento."
  - id: d
    text:
      es: "el informe favorable de la Comunidad Autónoma convocante, en el plazo que fije la propia convocatoria del puesto."
  explanation:
    es: "El artículo 67 RD 364/1995 exige para la libre designación «el informe favorable del Departamento donde preste servicios» y añade: «De no emitirse dicho informe en el plazo de quince días naturales, éste se considerará favorable». El silencio cuenta como favorable, no como desfavorable. El artículo no pide una autorización de la Secretaría de Estado en lugar del informe. Tampoco da el informe a la Comunidad Autónoma convocante."
  citation: "art. 67 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1995-8729-art-56
- id: m01-l13-q379
  prompt:
    es: "Según el artículo 56.1 del Real Decreto 364/1995, de 10 de marzo, en la libre designación los nombramientos deberán efectuarse:"
  options:
  - id: a
    correct: true
    text:
      es: "en el plazo máximo de un mes desde la finalización del de presentación de solicitudes, prorrogable un mes más."
  - id: b
    text:
      es: "en el plazo máximo de dos meses contados desde la finalización del de solicitudes, salvo que la convocatoria fije otro."
  - id: c
    text:
      es: "en el plazo máximo de un mes contado desde la publicación de la convocatoria, sin posibilidad de prórroga alguna."
  - id: d
    text:
      es: "en el plazo máximo de un mes contado desde la finalización del de solicitudes, prorrogable hasta dos meses más."
  explanation:
    es: "El artículo 56.1 RD 364/1995 dice que los nombramientos «deberán efectuarse en el plazo máximo de un mes contado desde la finalización del de presentación de solicitudes. Dicho plazo podrá prorrogarse hasta un mes más». Los dos meses salvo otro de la convocatoria son el plazo para resolver el concurso (artículo 47.1). El mes no se cuenta desde la publicación de la convocatoria, y la prórroga existe y es de un mes, no de dos."
  citation: "art. 56.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-58
- id: m01-l13-q380
  prompt:
    es: "Según el artículo 58.1 del Real Decreto 364/1995, de 10 de marzo, los funcionarios nombrados para puestos de trabajo de libre designación:"
  options:
  - id: a
    text:
      es: "solo podrán ser cesados por las causas de remoción del concurso."
  - id: b
    text:
      es: "solo podrán ser cesados tras un expediente disciplinario."
  - id: c
    text:
      es: "solo podrán ser cesados a petición propia o por supresión del puesto."
  - id: d
    correct: true
    text:
      es: "podrán ser cesados con carácter discrecional."
  explanation:
    es: "El artículo 58.1 RD 364/1995 dice que estos funcionarios «podrán ser cesados con carácter discrecional», y el artículo 80.4 TREBEP dice lo mismo. Las causas sobrevenidas de remoción son las del puesto obtenido por concurso (artículo 50.1). El cese no exige expediente disciplinario ni se limita a la petición propia o a la supresión del puesto."
  citation: "art. 58.1 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-58
- id: m01-l13-q381
  prompt:
    es: "Según el artículo 58.2 del Real Decreto 364/1995, de 10 de marzo, el requisito de que el puesto atribuido al funcionario cesado en libre designación esté en el mismo municipio solo se exceptúa:"
  options:
  - id: a
    text:
      es: "cuando el funcionario lo pida por razones de convivencia familiar."
  - id: b
    text:
      es: "cuando en el municipio no haya un puesto vacante de su Cuerpo o Escala."
  - id: c
    correct: true
    text:
      es: "cuando se trate del cese de funcionarios destinados en el exterior."
  - id: d
    text:
      es: "cuando el cese se deba a la supresión del puesto en la relación."
  explanation:
    es: "El artículo 58.2 RD 364/1995 dice que «la necesidad de que el nuevo puesto que se atribuye al funcionario sea en el mismo municipio no será de aplicación cuando se trate del cese de funcionarios destinados en el exterior». Es la única excepción. El artículo no la extiende a la petición por convivencia familiar, a la falta de vacantes en el municipio ni a la supresión del puesto."
  citation: "art. 58.2 RD 364/1995"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-58
- id: m01-l13-q382
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre el funcionario cesado en un puesto de libre designación es correcta?"
  options:
  - id: a
    text:
      es: "Pasa a la situación de expectativa de destino hasta que obtenga otro puesto con carácter definitivo."
  - id: b
    correct: true
    text:
      es: "Queda adscrito provisionalmente a un puesto de su Cuerpo o Escala hasta que obtenga otro con carácter definitivo."
  - id: c
    text:
      es: "Conserva el nivel y las retribuciones del puesto de libre designación durante el plazo de un año."
  - id: d
    text:
      es: "Vuelve en todo caso al puesto que ocupaba con carácter definitivo antes de su nombramiento."
  explanation:
    es: "El artículo 58.2 RD 364/1995 dice que los cesados en un puesto de libre designación «serán adscritos provisionalmente a un puesto de trabajo correspondiente a su Cuerpo o Escala […] en tanto no obtengan otro con carácter definitivo». No pasan a expectativa de destino, que es una fase de la reasignación de efectivos. El artículo no les mantiene un año el nivel y las retribuciones del puesto. Tampoco los devuelve a su puesto anterior."
  citation: "art. 58.2 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-57
- id: m01-l13-q386
  prompt:
    es: "Una funcionaria obtiene por libre designación un puesto en la misma localidad en la que reside. ¿De qué plazo dispone para tomar posesión, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "De un mes desde el día siguiente al cese, por tratarse de libre designación."
  - id: b
    correct: true
    text:
      es: "De tres días hábiles desde el día siguiente al cese, como en el concurso."
  - id: c
    text:
      es: "Del que fije en cada caso la resolución de nombramiento del puesto."
  - id: d
    text:
      es: "De tres días naturales desde la publicación del nombramiento en el BOE."
  explanation:
    es: "El artículo 57 RD 364/1995 dice que el régimen de toma de posesión en la libre designación «será el establecido en el artículo 48», el del concurso. Sin cambio de residencia son tres días hábiles desde el día siguiente al del cese (artículo 48.1). El mes es para el cambio de residencia o el reingreso, no para la libre designación como tal. El plazo no lo fija cada resolución, y los días son hábiles y se cuentan desde el cese."
  citation: "art. 57 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-42
- id: m01-l13-q394
  prompt:
    es: "La convocatoria de un concurso de la Administración General del Estado se publica en el «Boletín Oficial del Estado» el jueves, 22 de enero de 2026. Sin festivos en el periodo, ¿cuál es el último día para presentar la solicitud?"
  options:
  - id: a
    text:
      es: "El viernes, 6 de febrero de 2026."
  - id: b
    text:
      es: "El miércoles, 11 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El jueves, 12 de febrero de 2026."
  - id: d
    text:
      es: "El viernes, 13 de febrero de 2026."
  explanation:
    es: "El artículo 42.2 RD 364/1995 da «quince días hábiles, contados a partir del siguiente al de la publicación de la convocatoria». El cómputo empieza el viernes 23 de enero. Sin sábados, domingos ni festivos, los días hábiles 1 a 15 van del viernes 23 de enero al jueves 12 de febrero de 2026. El viernes 6 de febrero sale de contar quince días naturales. El miércoles 11 de febrero sale de contar el propio día de publicación. El viernes 13 de febrero añade un día hábil de más."
  citation: "art. 42.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-47
- id: m01-l13-q431
  prompt:
    es: "Si la convocatoria del concurso para el puesto de Jefe de Sección no fija otro plazo y el de solicitudes termina el martes, 28 de septiembre de 2027, ¿hasta qué fecha debe resolverse el concurso?"
  options:
  - id: a
    text:
      es: "El domingo, 28 de noviembre de 2027."
  - id: b
    text:
      es: "El martes, 30 de noviembre de 2027."
  - id: c
    text:
      es: "El martes, 28 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 29 de noviembre de 2027."
  explanation:
    es: "El concurso se resuelve en dos meses contados desde el día siguiente al de la finalización del plazo de solicitudes, salvo que la convocatoria fije otro. El plazo de solicitudes termina el martes, 28 de septiembre de 2027; los dos meses terminan el mismo día del mes de vencimiento, el domingo, 28 de noviembre de 2027, inhábil, y pasan al primer día hábil, el lunes, 29 de noviembre de 2027. La fecha del domingo, 28 de noviembre de 2027, no pasa al día hábil. La del martes, 30 de noviembre de 2027, suma un día. La del martes, 28 de diciembre de 2027, aplica tres meses."
  citation: "art. 47.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-72
- id: m01-l13-q452
  prompt:
    es: "Doña Leire Cuesta Arribas reingresa sin reserva de puesto, por adscripción provisional, a un puesto vacante del Instituto. Conforme al Real Decreto 364/1995, de 10 de marzo, ¿qué obligación tiene respecto del puesto?"
  options:
  - id: a
    correct: true
    text:
      es: "Participar en la convocatoria que se haga para cubrirlo con carácter definitivo."
  - id: b
    text:
      es: "Dejarlo libre cuando se convoque para su cobertura definitiva, sin poder concursar a él."
  - id: c
    text:
      es: "Pedir cada año la prórroga de su adscripción provisional ante el órgano competente."
  - id: d
    text:
      es: "Permanecer en él dos años continuados antes de poder participar en un concurso."
  explanation:
    es: "Los puestos cubiertos mediante adscripción provisional se convocan para su cobertura con carácter definitivo, y quienes los desempeñan tienen la obligación de participar en las convocatorias (art. 72.2 RD 364/1995). No se les pide dejar el puesto sin concursar, ni prorrogar la adscripción cada año. Los dos años de permanencia son la regla del concurso para quien ocupa un destino definitivo, no una condición de la adscripción provisional."
  citation: "art. 72.2 RD 364/1995"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
