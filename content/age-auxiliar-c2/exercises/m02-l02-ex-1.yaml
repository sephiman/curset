# anchor: boe-a-1996-4997-art-5
- id: m02-l02-q007
  prompt:
    es: "Según el artículo 5.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, en cada Ministerio el titular de la Subdirección General competente en información administrativa ostentará:"
  options:
  - id: a
    text:
      es: "La jefatura del Centro de Información Administrativa del Ministerio."
  - id: b
    text:
      es: "La dirección de la Inspección General de Servicios del departamento."
  - id: c
    correct: true
    text:
      es: "La jefatura de la unidad departamental de información administrativa."
  - id: d
    text:
      es: "La jefatura de las oficinas de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 5.1 dice que en cada Ministerio el titular de la Subdirección General que tenga encomendada la competencia sobre la información administrativa «ostentará la jefatura de la unidad departamental de información administrativa». El Centro de Información Administrativa es un órgano propio con nivel de Subdirección General (art. 6.1). La Inspección General de Servicios y las oficinas de las Delegaciones del Gobierno son otros órganos."
  citation: "art. 5.1 RD 208/1996"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-8
- id: m02-l02-q010
  prompt:
    es: "Según el artículo 8.a) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, las oficinas centrales de información y atención al ciudadano radicarán:"
  options:
  - id: a
    text:
      es: "En la sede de cada Delegación del Gobierno, salvo que circunstancias singulares aconsejen otro emplazamiento."
  - id: b
    text:
      es: "En la sede de cada Departamento ministerial, sin excepción alguna y sin oficinas delegadas."
  - id: c
    text:
      es: "En el edificio que determine en cada caso el Centro de Información Administrativa, según la demanda informativa."
  - id: d
    correct: true
    text:
      es: "En la sede de cada Departamento ministerial, salvo que circunstancias singulares aconsejen otro emplazamiento."
  explanation:
    es: "El artículo 8.a) dice que las oficinas centrales «radicarán en la sede de cada Departamento ministerial, salvo que circunstancias singulares aconsejen otro emplazamiento». El artículo regula los servicios centrales, no las Delegaciones del Gobierno. Admite la excepción de las circunstancias singulares y permite oficinas delegadas o puntos de información en otros edificios. No deja la ubicación al Centro de Información Administrativa."
  citation: "art. 8.a) RD 208/1996"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-10
- id: m02-l02-q012
  prompt:
    es: "Según el artículo 10 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿qué puede acordarse también mediante convenio de colaboración entre distintas Administraciones públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La creación de oficinas integradas de información con participación de varias Administraciones públicas."
  - id: b
    text:
      es: "La delegación en una de las Administraciones firmantes de las competencias de resolución de todas las demás."
  - id: c
    text:
      es: "El traspaso del personal de las oficinas de información entre las distintas Administraciones públicas firmantes."
  - id: d
    text:
      es: "La supresión de las oficinas de información de las Administraciones públicas que no lo hayan firmado."
  explanation:
    es: "El artículo 10 permite acordar por convenio que desde las oficinas de cada Administración se informe sobre las otras y, además, «la creación de oficinas integradas de información con participación de varias Administraciones públicas». El artículo se limita a la información: no prevé delegar competencias de resolución, traspasar personal ni suprimir oficinas de terceros."
  citation: "art. 10 RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-23537-art-22
- id: m02-l02-q047
  prompt:
    es: "¿En qué departamento ministerial se integra hoy el Centro de Información Administrativa, que antes estaba adscrito al Ministerio para las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Ministerio de Hacienda."
  - id: b
    text:
      es: "Ministerio de Política Territorial y Memoria Democrática."
  - id: c
    text:
      es: "Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    correct: true
    text:
      es: "Ministerio para la Transformación Digital y de la Función Pública."
  explanation:
    es: "El artículo 22.2 del Real Decreto 829/2023 atribuye al Ministerio para la Transformación Digital y de la Función Pública la administración pública, la función pública y la gobernanza pública, materias del antiguo Ministerio para las Administraciones Públicas. Hacienda, Política Territorial y Presidencia tienen otras competencias."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-6
- id: m02-l02-q049
  prompt:
    es: "El sistema de información administrativa al ciudadano que sostiene el Centro de Información Administrativa versa, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, sobre los servicios públicos y trámites de:"
  options:
  - id: a
    text:
      es: "Los departamentos ministeriales y sus organismos."
  - id: b
    correct: true
    text:
      es: "Toda la Administración General del Estado."
  - id: c
    text:
      es: "Todas las Administraciones públicas."
  - id: d
    text:
      es: "La Administración periférica del Estado."
  explanation:
    es: "El artículo 6.2.b) abarca los servicios y trámites de toda la Administración General del Estado. No se limita a los departamentos y sus organismos ni a la Administración periférica, y no llega a todas las Administraciones públicas, incluidas las autonómicas y locales."
  citation: "art. 6.2.b) RD 208/1996"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2024-3796-art-11
- id: m02-l02-q051
  prompt:
    es: "¿Qué órgano administrativo gestiona la Dirección General de Gobernanza Pública del Ministerio para la Transformación Digital y de la Función Pública, además de ejercer la gobernanza del teléfono 060?"
  options:
  - id: a
    text:
      es: "La Comisión Interministerial de Información Administrativa."
  - id: b
    text:
      es: "Las Comisiones Ministeriales de Información Administrativa."
  - id: c
    text:
      es: "La unidad departamental de información administrativa de cada Ministerio."
  - id: d
    correct: true
    text:
      es: "El Centro de Información Administrativa."
  explanation:
    es: "El artículo 11.1.h) del Real Decreto 210/2024 pone la gestión del Centro de Información Administrativa en la Dirección General de Gobernanza Pública. La Comisión Interministerial fue suprimida, las Comisiones Ministeriales están derogadas y la unidad departamental de cada Ministerio la dirige el titular de una Subdirección General."
  citation: "art. 11.1.h) RD 210/2024"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2024-3796-art-11
- id: m02-l02-q052
  prompt:
    es: "¿Cuál es el teléfono de información administrativa de la Administración General del Estado cuya gobernanza corresponde a la Dirección General de Gobernanza Pública?"
  options:
  - id: a
    correct: true
    text:
      es: "El teléfono 060."
  - id: b
    text:
      es: "El teléfono 112."
  - id: c
    text:
      es: "El teléfono 016."
  - id: d
    text:
      es: "El teléfono 091."
  explanation:
    es: "El artículo 11.1.h) del Real Decreto 210/2024 se refiere a la gobernanza del teléfono 060. Los números 112, 016 y 091 son teléfonos de otros servicios, no el de información administrativa."
  citation: "art. 11.1.h) RD 210/2024"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-8
- id: m02-l02-q053
  prompt:
    es: "En los servicios centrales, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, existen oficinas de entidades de derecho público, centros directivos y demás servicios cuando su entidad y especialidad justifiquen una información:"
  options:
  - id: a
    text:
      es: "General o personalizada."
  - id: b
    correct: true
    text:
      es: "Especializada o sectorial."
  - id: c
    text:
      es: "Territorial o periférica."
  - id: d
    text:
      es: "Complementaria o subsidiaria."
  explanation:
    es: "El artículo 8.b) las justifica cuando la entidad y especialidad del servicio requieran información especializada o sectorial. La información general o personalizada, la territorial o periférica y la complementaria o subsidiaria no son los términos que usa."
  citation: "art. 8 RD 208/1996"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1996-4997-art-8
- id: m02-l02-q054
  prompt:
    es: "En los servicios centrales, el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, prevé la existencia de:"
  options:
  - id: a
    text:
      es: "Tres tipos: las oficinas centrales, las sectoriales y las delegadas de cada Departamento."
  - id: b
    text:
      es: "Dos tipos: las oficinas centrales y las sectoriales de ámbito provincial de los Departamentos."
  - id: c
    correct: true
    text:
      es: "Dos tipos: las oficinas centrales y las de entidades de derecho público, centros directivos y demás servicios."
  - id: d
    text:
      es: "Un solo tipo: las oficinas centrales radicadas en la sede de cada Departamento ministerial."
  explanation:
    es: "El artículo 8 distingue dos tipos: las oficinas centrales, en la sede de cada Departamento, y las de entidades de derecho público, centros directivos y demás servicios con información especializada o sectorial. Las sectoriales provinciales son oficinas de los servicios territoriales del artículo 9.2, y las delegadas son oficinas dependientes de las centrales, no un tipo aparte; tampoco existe un solo tipo."
  citation: "art. 8 RD 208/1996"
  difficulty: 2
  tags:
  - "estructura"
  - "cantidad"
# anchor: boe-a-1996-4997-art-9
- id: m02-l02-q056
  prompt:
    es: "Una oficina de información y atención al ciudadano depende de la Delegación del Gobierno en una Comunidad Autónoma. ¿Qué carácter tiene esa oficina?"
  options:
  - id: a
    text:
      es: "Es una oficina delegada."
  - id: b
    correct: true
    text:
      es: "Es una oficina central."
  - id: c
    text:
      es: "Es una oficina integrada."
  - id: d
    text:
      es: "Es una oficina itinerante."
  explanation:
    es: "El artículo 9.1 da carácter de oficinas centrales a las dependientes de las Delegaciones del Gobierno en las Comunidades Autónomas. Oficina delegada es la que puede tener la oficina central de un Departamento en otros edificios, oficina integrada la que crean varias Administraciones por convenio, y la itinerante no es una categoría del real decreto."
  citation: "art. 9.1 RD 208/1996"
  difficulty: 1
  tags:
  - "estructura"
  - "órgano"
# anchor: boe-a-1996-4997-art-9
- id: m02-l02-q057
  prompt:
    es: "¿Cuándo podrán existir oficinas sectoriales en los servicios y dependencias provinciales de los Departamentos ministeriales y de las entidades de derecho público vinculadas o dependientes de ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el volumen y la especialidad de la demanda informativa justifiquen su existencia."
  - id: b
    text:
      es: "Cuando así lo disponga el Delegado del Gobierno en la Comunidad Autónoma."
  - id: c
    text:
      es: "Cuando el Centro de Información Administrativa lo autorice expresamente."
  - id: d
    text:
      es: "Cuando la oficina central de la provincia carezca de medios suficientes."
  explanation:
    es: "El artículo 9.2 las admite cuando el volumen y la especialidad de la demanda informativa justifiquen su existencia. No depende de una disposición del Delegado del Gobierno, de una autorización expresa del Centro de Información Administrativa ni de la falta de medios de la oficina central."
  citation: "art. 9.2 RD 208/1996"
  difficulty: 2
  tags:
  - "estructura"
  - "requisito"
# anchor: boe-a-1996-4997-art-9
- id: m02-l02-q058
  prompt:
    es: "Respecto de las demás oficinas que existan en su ámbito territorial, las oficinas de carácter central asumen, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, las funciones de:"
  options:
  - id: a
    text:
      es: "Dirección, control y sanción propias de las unidades informativas departamentales."
  - id: b
    text:
      es: "Coordinación, apoyo y representación propias del Centro de Información Administrativa."
  - id: c
    text:
      es: "Planificación, ejecución y evaluación propias de las Comisiones Ministeriales."
  - id: d
    correct: true
    text:
      es: "Coordinación, apoyo y tutela propias de las unidades informativas departamentales."
  explanation:
    es: "El artículo 9.3 les atribuye coordinación, apoyo y tutela propias de las unidades informativas departamentales. La dirección, control y sanción, la representación propia del Centro de Información Administrativa y las funciones de las Comisiones Ministeriales, que están derogadas, no figuran en el precepto."
  citation: "art. 9.3 RD 208/1996"
  difficulty: 2
  tags:
  - "competencia"
  - "estructura"
# anchor: boe-a-1996-4997-art-10
- id: m02-l02-q059
  prompt:
    es: "Mediante convenio de colaboración, suscrito por distintas Administraciones públicas, el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, permite acordar que desde las oficinas de cualquiera de ellas pueda ofrecerse a los ciudadanos:"
  options:
  - id: a
    text:
      es: "La tramitación de los procedimientos de las otras."
  - id: b
    text:
      es: "La resolución de las quejas y reclamaciones de las otras."
  - id: c
    correct: true
    text:
      es: "La información administrativa de las otras."
  - id: d
    text:
      es: "La gestión de la documentación inicial de las otras."
  explanation:
    es: "El artículo 10 permite que cada oficina ofrezca la información administrativa de las otras Administraciones. No permite tramitar los procedimientos de otras, resolver sus quejas ni recibir su documentación inicial."
  citation: "art. 10 RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-dd-unica
- id: m02-l02-q061
  prompt:
    es: "El capítulo III del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, que regulaba el Libro de Quejas y Sugerencias, quedó derogado por la disposición derogatoria única del:"
  options:
  - id: a
    text:
      es: "Real Decreto 776/2011, de 3 de junio."
  - id: b
    text:
      es: "Real Decreto 366/2007, de 16 de marzo."
  - id: c
    text:
      es: "Real Decreto 1259/1999, de 16 de julio."
  - id: d
    correct: true
    text:
      es: "Real Decreto 951/2005, de 29 de julio."
  explanation:
    es: "La disposición derogatoria única del Real Decreto 951/2005 deroga el capítulo III. El Real Decreto 776/2011 suprimió órganos colegiados y derogó el artículo 13, el 366/2007 trata de accesibilidad y el 1259/1999 sobre cartas de servicios fue derogado por el propio 951/2005."
  citation: "disposición derogatoria única.b) RD 951/2005"
  difficulty: 3
  tags:
  - "norma-anterior"
  - "estructura"
# anchor: boe-a-1996-4997-art-5
- id: m02-l02-q121
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, en cada Ministerio ostenta la jefatura de la unidad departamental de información administrativa el titular de:"
  options:
  - id: a
    text:
      es: "La Secretaría General Técnica, por su competencia sobre los servicios comunes del Departamento."
  - id: b
    text:
      es: "La Dirección General que tenga encomendada la gestión de los servicios de atención al público."
  - id: c
    correct: true
    text:
      es: "La Subdirección General que tenga encomendada la competencia sobre la información administrativa."
  - id: d
    text:
      es: "La Subsecretaría del Departamento, como responsable de la información al ciudadano."
  explanation:
    es: "El artículo 5.1 atribuye la jefatura de la unidad departamental al titular de la Subdirección General con la competencia sobre la información administrativa. La Secretaría General Técnica y la Subsecretaría son órganos de nivel superior o de otro tipo que el apartado no menciona para esa jefatura. La Dirección General sube un nivel: el texto habla de una Subdirección General, y lo que determina la jefatura es la competencia sobre la información administrativa, no sobre la atención al público en general."
  citation: "art. 5.1 RD 208/1996"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-4997-art-6
- id: m02-l02-q133
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, el Centro de Información Administrativa promueve y organiza, en colaboración con el Instituto Nacional de Administración Pública, cursos de capacitación en materias relacionadas con:"
  options:
  - id: a
    text:
      es: "El régimen jurídico del personal al servicio de la Administración General del Estado."
  - id: b
    text:
      es: "La tramitación electrónica de los procedimientos administrativos de los ministerios."
  - id: c
    correct: true
    text:
      es: "Las funciones propias de las unidades de información administrativa."
  - id: d
    text:
      es: "La gestión de los registros y archivos de las oficinas de cada Departamento."
  explanation:
    es: "El artículo 6.2.e) limita esos cursos a las materias relacionadas con las funciones propias de las unidades de información administrativa. El régimen del personal, la tramitación electrónica y los registros y archivos son materias de otras funciones que el apartado no incluye entre las que el Centro promueve y organiza con el Instituto."
  citation: "art. 6.2.e) RD 208/1996"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1996-4997-art-10
- id: m02-l02-q135
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, los convenios de colaboración suscritos por distintas Administraciones públicas pueden acordar también la creación de oficinas:"
  options:
  - id: a
    correct: true
    text:
      es: "Integradas de información, con participación de varias Administraciones públicas."
  - id: b
    text:
      es: "Delegadas de información, en edificios distintos de cada sede ministerial."
  - id: c
    text:
      es: "Sectoriales de información, en las dependencias provinciales de cada Departamento."
  - id: d
    text:
      es: "Centrales de información, dependientes de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 10 habla de la creación de oficinas integradas de información con participación de varias Administraciones públicas. Las delegadas son de los servicios centrales, del artículo 8.a). Las sectoriales de los servicios provinciales son del artículo 9.2. Las centrales dependientes de las Delegaciones del Gobierno son del artículo 9.1. Las tres son oficinas de la Administración General del Estado, sin participación de otras Administraciones."
  citation: "art. 10 RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
