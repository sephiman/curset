# anchor: fuente-ms-word-salto-seccion-html
- id: m02-l08-q106
  prompt:
    es: "Según la página de Microsoft sobre cómo insertar un salto de sección, los saltos de sección de Word 365 sirven:"
  options:
  - id: a
    text:
      es: "Para que el documento tenga una sola sección con un único formato"
  - id: b
    text:
      es: "Para insertar una nota al final de cada capítulo del documento"
  - id: c
    correct: true
    text:
      es: "Para dividir el documento en secciones con formato propio, como columnas, encabezados y pies"
  - id: d
    text:
      es: "Para marcar las entradas que formarán el índice del documento"
  explanation:
    es: "La página dice: «Use los saltos de secciones para dividir y dar formato a documentos de todos los tamaños», con formato propio en cada sección, como columnas, encabezados y pies de página y bordes de página. Una sola sección con un único formato es lo contrario de dividir. La nota al final de cada capítulo es otra función, de la pestaña Referencias según la página de notas: las notas al final aparecen al final del documento. Y marcar entradas de índice es otra función de Referencias, la de Marcar entrada, según la página del índice."
  citation: "fuente: `ms-word-salto-seccion.html`; «Agregar un salto de sección»"
  difficulty: 1
  tags:
  - "concepto"
