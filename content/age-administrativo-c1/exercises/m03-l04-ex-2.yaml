  prompt:
    es: "¿Cuál de los siguientes trámites exige la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público en la tramitación de todos los contratos menores?"
  options:
  - id: a
    correct: true
    text:
      es: "La aprobación del gasto y la incorporación de la factura correspondiente."
  - id: b
    text:
      es: "La publicación previa de un anuncio de licitación en el perfil de contratante."
  - id: c
    text:
      es: "La formalización del contrato en documento administrativo."
  - id: d
    text:
      es: "La constitución de una garantía definitiva del 5 por 100 del precio."
  explanation:
    es: "El artículo 118.3 LCSP dice: «Asimismo se requerirá la aprobación del gasto y la incorporación al mismo de la factura correspondiente». El anuncio de licitación previo, la garantía definitiva y la formalización en documento administrativo son trámites de los contratos ordinarios que el artículo 118 no exige al contrato menor."
  citation: "art. 118.3 LCSP"
  difficulty: 2
