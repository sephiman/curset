# anchor: boe-a-1985-12666-art-566
- id: m01-l02-q0188
  prompt:
    es: "Según el artículo 566 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial lo integran su Presidente y veinte Vocales: doce Jueces o Magistrados en servicio activo y ocho:"
  options:
  - id: a
    text:
      es: "Letrados de la Administración de Justicia."
  - id: b
    text:
      es: "Fiscales de Sala del Tribunal Supremo."
  - id: c
    text:
      es: "Catedráticos de Derecho de universidades públicas."
  - id: d
    correct: true
    text:
      es: "Juristas de reconocida competencia."
  explanation:
    es: "El artículo 566 dice «doce serán Jueces o Magistrados en servicio activo en la carrera judicial y ocho juristas de reconocida competencia». Los Letrados de la Administración de Justicia, los Fiscales de Sala y los catedráticos no tienen reservado ese turno."
  citation: "art. 566 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-92
- id: m01-l02-q0071
  prompt:
    es: "Según el artículo 92 de la Constitución Española de 1978, ¿cómo se convoca el referéndum consultivo sobre decisiones políticas de especial trascendencia?"
  options:
  - id: a
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por las Cortes Generales."
  - id: b
    text:
      es: "Lo convoca el Presidente del Gobierno, previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Lo convoca el Rey, mediante propuesta del Congreso de los Diputados, previamente autorizada por el Senado."
  - id: d
    correct: true
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados."
  explanation:
    es: "El artículo 92.2 dice: «El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados». La autorización es solo del Congreso, no de las Cortes Generales ni del Senado. Lo convoca el Rey, no el Presidente del Gobierno, que hace la propuesta."
  citation: "art. 92.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1985-12666-art-4
- id: m01-l02-q0158
  prompt:
    es: "Según el artículo 4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿a qué se extiende la jurisdicción?"
  options:
  - id: a
    text:
      es: "A todas las personas y materias, salvo las reservadas a la jurisdicción militar."
  - id: b
    text:
      es: "A las personas de nacionalidad española, en todo el territorio nacional."
  - id: c
    correct: true
    text:
      es: "A todas las personas, a todas las materias y a todo el territorio español."
  - id: d
    text:
      es: "A las materias que le atribuyan las leyes, en el territorio que fije el Gobierno."
  explanation:
    es: "El artículo 4 LOPJ dice: «La jurisdicción se extiende a todas las personas, a todas las materias y a todo el territorio español». Una opción excluye la jurisdicción militar, que el artículo 3.2 LOPJ integra en el Poder Judicial. Otra deja fuera a quienes no tienen nacionalidad española, cuando el artículo dice «todas las personas». Otra deja el territorio en manos del Gobierno."
  citation: "art. 4 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-9
- id: m01-l02-q0159
  prompt:
    es: "¿Cuál de los siguientes órdenes jurisdiccionales conoce, además de las materias que le son propias, de todas las que no estén atribuidas a otro orden, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Tribunales del orden penal."
  - id: b
    correct: true
    text:
      es: "Los Tribunales del orden civil."
  - id: c
    text:
      es: "Los Tribunales del orden contencioso-administrativo."
  - id: d
    text:
      es: "Los Tribunales del orden social."
  explanation:
    es: "El artículo 9.2 LOPJ dice que los Tribunales del orden civil conocerán, «además de las materias que les son propias, de todas aquellas que no estén atribuidas a otro orden jurisdiccional»: el civil hace de orden residual. El penal conoce de las causas y juicios criminales (art. 9.3), el contencioso-administrativo de la actuación administrativa (art. 9.4) y el social de la rama social del derecho (art. 9.5)."
  citation: "art. 9.2 LOPJ"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-558
- id: m01-l02-q0170
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el Consejo General del Poder Judicial es correcta según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Ejerce sus competencias solo sobre los órganos judiciales con jurisdicción en toda España."
  - id: b
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y su sede la fija el Pleno cada cinco años."
  - id: c
    correct: true
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y tiene su sede en la villa de Madrid."
  - id: d
    text:
      es: "Tiene su sede en la villa de Madrid y delegaciones con competencias propias en cada Comunidad Autónoma."
  explanation:
    es: "El artículo 558 LOPJ dice que el Consejo «ejerce sus competencias en todo el territorio nacional» (apartado 1) y que «tiene su sede en la villa de Madrid» (apartado 2). Una opción limita sus competencias a los órganos centrales. Otra deja la sede a una decisión del Pleno, cuando la fija la ley. Otra inventa delegaciones con competencias propias."
  citation: "art. 558 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-123
- id: m01-l02-q0216
  prompt:
    es: "De acuerdo con el artículo 123 de la Constitución Española de 1978, el Tribunal Supremo, con jurisdicción en toda España, es el órgano jurisdiccional superior en todos los órdenes:"
  options:
  - id: a
    text:
      es: "Sin excepción alguna, incluidas las garantías constitucionales."
  - id: b
    text:
      es: "Salvo en el orden militar, que corresponde a sus propios tribunales."
  - id: c
    text:
      es: "Salvo lo dispuesto en materia de enjuiciamiento contable."
  - id: d
    correct: true
    text:
      es: "Salvo lo dispuesto en materia de garantías constitucionales."
  explanation:
    es: "El artículo 123.1 dice que el Tribunal Supremo es el órgano jurisdiccional superior en todos los órdenes, «salvo lo dispuesto en materia de garantías constitucionales». «Sin excepción alguna» borra esa salvedad. Con el orden militar, la salvedad es falsa: el artículo 55 LOPJ integra en el Tribunal Supremo la Sala Quinta, de lo Militar. El enjuiciamiento contable tampoco es salvedad: el artículo 49 de la LO 2/1982 hace las resoluciones del Tribunal de Cuentas susceptibles de recurso de casación y revisión ante el Tribunal Supremo."
  citation: "art. 123.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-12666-art-55
- id: m01-l02-q0217
  prompt:
    es: "¿Cuántas Salas integran el Tribunal Supremo según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, y cuál es la Quinta?"
  options:
  - id: a
    text:
      es: "Cinco Salas, y la Quinta es la de lo Social."
  - id: b
    text:
      es: "Cuatro Salas, porque lo militar tiene sus propios tribunales."
  - id: c
    correct: true
    text:
      es: "Cinco Salas, y la Quinta es la de lo Militar."
  - id: d
    text:
      es: "Seis Salas, y la Quinta es la de lo Militar."
  explanation:
    es: "El artículo 55 LOPJ enumera cinco Salas: «Primera: De lo Civil. Segunda: De lo Penal. Tercera: De lo Contencioso-Administrativo. Cuarta: De lo Social. Quinta: De lo Militar». Una opción pone lo Social en la Quinta, cuando es la Cuarta. Otra niega la Sala de lo Militar. La de seis Salas da una Sala de más."
  citation: "art. 55 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-57
- id: m01-l02-q0218
  prompt:
    es: "De acuerdo con el artículo 57 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la instrucción y enjuiciamiento de las causas contra los miembros del Gobierno y los Diputados y Senadores corresponde a:"
  options:
  - id: a
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: b
    text:
      es: "La Sala de Apelación de la Audiencia Nacional."
  - id: c
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia."
  - id: d
    text:
      es: "La Sala Segunda del Tribunal Constitucional."
  explanation:
    es: "El artículo 57.1 LOPJ atribuye a la Sala de lo Penal del Tribunal Supremo «la instrucción y enjuiciamiento de las causas contra el Presidente del Gobierno, Presidentes del Congreso y del Senado, [...] miembros del Gobierno, Diputados y Senadores». La Sala de Apelación de la Audiencia Nacional revisa resoluciones de su Sala de lo Penal (art. 64 bis). La Sala de lo Civil y Penal del Tribunal Superior de Justicia es un órgano autonómico. El Tribunal Constitucional no forma parte del Poder Judicial."
  citation: "art. 57.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-53
- id: m01-l02-q0226
  prompt:
    es: "Señale la respuesta correcta sobre quién puede tener el título de Supremo, de acuerdo con el artículo 53 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial:"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo y la Audiencia Nacional, que también tiene jurisdicción en toda España."
  - id: b
    correct: true
    text:
      es: "Solo el Tribunal Supremo, que tiene su sede en la villa de Madrid."
  - id: c
    text:
      es: "El Tribunal Supremo y el Tribunal Central de Instancia en el orden penal."
  - id: d
    text:
      es: "El Tribunal Supremo y los Tribunales Superiores de Justicia dentro de su Comunidad Autónoma."
  explanation:
    es: "El artículo 53 dice que el Tribunal Supremo tiene su sede en la villa de Madrid y que ningún otro órgano podrá tener el título de Supremo. La Audiencia Nacional también tiene jurisdicción en toda España, pero eso no le da el título. Los Tribunales Superiores de Justicia culminan la organización judicial en su Comunidad Autónoma y tampoco pueden llevarlo. Lo mismo vale para el Tribunal Central de Instancia en el orden penal."
  citation: "art. 53 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-1982-5196-art-22
- id: m01-l02-q0027
  prompt:
    es: "Conforme al artículo 22 del Reglamento del Congreso de 10 de febrero de 1982, el Diputado pierde su condición por fallecimiento o incapacitación, y esta última debe estar declarada por:"
  options:
  - id: a
    correct: true
    text:
      es: "Decisión judicial firme."
  - id: b
    text:
      es: "Resolución de la Mesa del Congreso."
  - id: c
    text:
      es: "Acuerdo del Pleno de la Cámara."
  - id: d
    text:
      es: "Informe médico del servicio de salud de la Cámara."
  explanation:
    es: "El artículo 22.2.º exige que la incapacitación esté declarada por decisión judicial firme. La Mesa, el Pleno o un informe médico de la Cámara no la declaran: la incapacitación es una declaración judicial."
  citation: "art. 22 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-76
- id: m01-l02-q0041
  prompt:
    es: "Señale la respuesta correcta sobre las conclusiones de las Comisiones de investigación que nombren las Cámaras, según el artículo 76.1 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "No son vinculantes para los Tribunales ni afectan a las resoluciones judiciales."
  - id: b
    text:
      es: "Son vinculantes para los Tribunales, que deben ejecutarlas."
  - id: c
    text:
      es: "Son vinculantes para el Gobierno, pero no para los Tribunales."
  - id: d
    text:
      es: "Afectan a las resoluciones judiciales cuando las apruebe el Pleno."
  explanation:
    es: "El artículo 76.1 niega a las conclusiones valor vinculante para los Tribunales y efecto sobre las resoluciones judiciales. Las opciones que las hacen vinculantes para los Tribunales o para el Gobierno, o que les dan efecto sobre las resoluciones con la aprobación del Pleno, contradicen ese texto."
  citation: "art. 76.1 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1982-5196-art-23
- id: m01-l02-q0050
  prompt:
    es: "De acuerdo con el artículo 23 del Reglamento del Congreso de 10 de febrero de 1982, en su redacción para la XVI legislatura, pueden constituirse en Grupo Parlamentario, sin otro requisito, las diputadas y diputados en número no inferior a:"
  options:
  - id: a
    correct: true
    text:
      es: "Quince diputadas y diputados de la Cámara."
  - id: b
    text:
      es: "Diez diputadas y diputados de la Cámara."
  - id: c
    text:
      es: "Doce diputadas y diputados de la Cámara."
  - id: d
    text:
      es: "Veinte diputadas y diputados de la Cámara."
  explanation:
    es: "El artículo 23.1 del Reglamento, en la redacción que entra en vigor en la XVI legislatura, dice: «Las diputadas y los diputados, en número no inferior a quince, podrán constituirse en Grupo Parlamentario». Diez es el mínimo de un Grupo en el Senado (art. 27.1 del Reglamento del Senado). Doce y veinte no aparecen en el precepto."
  citation: "art. 23.1 Reglamento del Congreso"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
  - "cambio-pendiente"
