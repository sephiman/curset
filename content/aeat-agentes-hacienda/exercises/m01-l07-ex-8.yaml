# anchor: boe-a-2015-11719-da-decimocuarta
- id: m01-l07-q0335
  prompt:
    es: "¿Cuál de las siguientes medidas puede establecer cada Administración Pública, en función del tiempo de servicios prestados, según la disposición adicional decimocuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Hasta un máximo de seis días adicionales de vacaciones."
  - id: b
    text:
      es: "Hasta un máximo de dos días adicionales de vacaciones."
  - id: c
    correct: true
    text:
      es: "Hasta un máximo de cuatro días adicionales de vacaciones."
  - id: d
    text:
      es: "Un día adicional de vacaciones por cada trienio cumplido."
  explanation:
    es: "La disposición permite «hasta un máximo de cuatro días adicionales de vacaciones en función del tiempo de servicios prestados». No son dos ni seis. Un día por trienio no es la regla: la referencia a los trienios está en la disposición decimotercera, la de asuntos particulares."
  citation: "disposición adicional decimocuarta TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2026-8287-apartado-9
- id: m01-l07-q0336
  prompt:
    es: "De acuerdo con el apartado 9.1 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, ¿con cuántos años de servicio se alcanzan veintiséis días hábiles de vacaciones?"
  options:
  - id: a
    text:
      es: "Con veinticinco o más años de servicio."
  - id: b
    text:
      es: "Con treinta y cinco o más años de servicio."
  - id: c
    correct: true
    text:
      es: "Con treinta o más años de servicio."
  - id: d
    text:
      es: "Con veintiocho o más años de servicio."
  explanation:
    es: "El apartado 9.1 da «treinta o más años de servicio: veintiséis días hábiles». Con veinticinco años corresponden veinticinco días. Veintiocho y treinta y cinco años no son tramos del apartado."
  citation: "apartado 9.1 Resolución de 14-04-2026"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-52
- id: m01-l07-q0339
  prompt:
    es: "De acuerdo con el artículo 52 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos deberán desempeñar con diligencia las tareas que tengan asignadas y:"
  options:
  - id: a
    text:
      es: "Velar por los intereses de la unidad en que estén destinados con sujeción a las instrucciones de sus superiores jerárquicos."
  - id: b
    text:
      es: "Velar por los intereses del Departamento en que presten servicios con sujeción a su relación de puestos de trabajo."
  - id: c
    text:
      es: "Velar por los intereses de los ciudadanos de su ámbito territorial con sujeción a los acuerdos de su Administración."
  - id: d
    correct: true
    text:
      es: "Velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico."
  explanation:
    es: "El artículo 52 obliga a «velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico». El interés que se protege es el general, no el de la unidad, el del Departamento ni el de los ciudadanos de un territorio. La sujeción es a la Constitución y al ordenamiento, no a las instrucciones de los superiores, a la relación de puestos ni a los acuerdos de una Administración."
  citation: "art. 52 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-53
- id: m01-l07-q0342
  prompt:
    es: "De acuerdo con el artículo 53.7 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos no aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada por parte de:"
  options:
  - id: a
    text:
      es: "Solo las entidades privadas que contraten con su Administración."
  - id: b
    text:
      es: "Solo las personas físicas interesadas en un procedimiento a su cargo."
  - id: c
    correct: true
    text:
      es: "Las personas físicas o las entidades privadas."
  - id: d
    text:
      es: "Solo otras Administraciones Públicas y sus entidades dependientes."
  explanation:
    es: "El artículo 53.7 dice: «No aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada, por parte de personas físicas o entidades privadas». La regla alcanza a cualquier persona física o entidad privada. Limitarla a los contratistas o a los interesados en un procedimiento la recorta. Las Administraciones Públicas no son personas físicas ni entidades privadas."
  citation: "art. 53.7 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m01-l07-q0343
  prompt:
    es: "De acuerdo con el artículo 54.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el desempeño de las tareas correspondientes al puesto de trabajo se realizará:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma diligente y cumpliendo la jornada y el horario establecidos."
  - id: b
    text:
      es: "De forma diligente y cumpliendo los objetivos anuales fijados para la unidad."
  - id: c
    text:
      es: "De forma diligente, con la jornada y el horario que se acuerden con el superior."
  - id: d
    text:
      es: "Con plena dedicación, sin sujeción a una jornada ni a un horario determinados."
  explanation:
    es: "El artículo 54.2 dice que el desempeño se realizará «de forma diligente y cumpliendo la jornada y el horario establecidos». El precepto habla de la jornada y el horario establecidos, no de objetivos anuales de la unidad ni de un horario pactado con el superior. La dedicación sin jornada ni horario contradice el texto."
  citation: "art. 54.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-preambulo
- id: m01-l07-q0358
  prompt:
    es: "Según el preámbulo del Real Decreto Legislativo 4/2000, de 23 de junio, por el que se aprueba el texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿qué ley estableció ese Régimen especial?"
  options:
  - id: a
    text:
      es: "La Ley 193/1963, de 28 de diciembre, de bases de la Seguridad Social"
  - id: b
    text:
      es: "La Ley 50/1998, de 30 de diciembre, de Medidas fiscales, administrativas y del orden social"
  - id: c
    correct: true
    text:
      es: "La Ley 29/1975, de 27 de junio, sobre Seguridad Social de los Funcionarios Civiles del Estado"
  - id: d
    text:
      es: "La Ley 55/1999, de 29 de diciembre, de Medidas fiscales, administrativas y del orden social"
  explanation:
    es: "El preámbulo dice que el Régimen especial «fue establecido por la Ley 29/1975, de 27 de junio». La Ley 193/1963 de bases de la Seguridad Social aparece en el mismo preámbulo solo como origen de los criterios que inspiran el Régimen. La Ley 50/1998 facultó al Gobierno para elaborar el texto refundido. La Ley 55/1999 prorrogó esa delegación hasta el 30 de junio de 2000."
  citation: "preámbulo RDL 4/2000"
  difficulty: 1
  tags:
  - "concepto"
  - "fecha"
# anchor: boe-a-2000-12140-dd-unica
- id: m01-l07-q0359
  prompt:
    es: "¿En qué situación está hoy la Ley 29/1975, de 27 de junio, sobre Seguridad Social de los Funcionarios Civiles del Estado?"
  options:
  - id: a
    text:
      es: "Sigue vigente en lo que no se oponga al Real Decreto Legislativo 4/2000"
  - id: b
    correct: true
    text:
      es: "Está derogada en su totalidad por el Real Decreto Legislativo 4/2000"
  - id: c
    text:
      es: "Está derogada solo en lo que regulaba el Régimen de Clases Pasivas"
  - id: d
    text:
      es: "Sigue vigente como norma de desarrollo del texto refundido de 2000"
  explanation:
    es: "La disposición derogatoria única del Real Decreto Legislativo 4/2000 deroga «en su totalidad» la Ley 29/1975. No queda vigente en lo que no se oponga, porque la derogación es total. No se limita a las Clases Pasivas. Una ley derogada no puede seguir como norma de desarrollo."
  citation: "disposición derogatoria única a).1 RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-19
- id: m01-l07-q0379
  prompt:
    es: "¿Cuál de los siguientes es requisito, según el artículo 19.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, para que un funcionario esté en situación de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Acreditar un período previo de cotización a la MUFACE de al menos seis meses"
  - id: b
    correct: true
    text:
      es: "Recibir la asistencia sanitaria de la MUFACE y haber obtenido licencia por enfermedad"
  - id: c
    text:
      es: "Llevar más de tres meses de ausencia continuada a su puesto de trabajo habitual"
  - id: d
    text:
      es: "Contar con un dictamen de las Unidades Médicas de Seguimiento de la MUFACE"
  explanation:
    es: "El artículo 19.1 exige que el funcionario reciba «la asistencia sanitaria necesaria para su recuperación facilitada por la Mutualidad» y que haya «obtenido licencia por enfermedad». Los seis meses de cotización son requisito del subsidio, no de la situación (artículo 95.1 del Reglamento). Los tres meses marcan el paso al subsidio, no el inicio de la situación. El seguimiento de las Unidades Médicas es potestativo."
  citation: "art. 19.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1987-12636-art-28
- id: m01-l07-q0394
  prompt:
    es: "Según el artículo 28.2.a) del texto refundido de Ley de Clases Pasivas del Estado, ¿cómo se declara la jubilación forzosa?"
  options:
  - id: a
    correct: true
    text:
      es: "Automáticamente, al cumplir la edad legalmente señalada"
  - id: b
    text:
      es: "A instancia del funcionario, al cumplir la edad legalmente señalada"
  - id: c
    text:
      es: "De oficio, previo dictamen preceptivo y vinculante del órgano médico"
  - id: d
    text:
      es: "A instancia de parte, con sesenta años de edad y treinta de servicios"
  explanation:
    es: "El artículo 28.2.a) dice que la jubilación forzosa «se declarará automáticamente al cumplir dicho personal la edad legalmente señalada». No depende de una solicitud. El dictamen del órgano médico es de la jubilación por incapacidad permanente. La solicitud con sesenta años y treinta de servicios es la jubilación voluntaria."
  citation: "art. 28.2.a) TRLCPE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12636-art-29
- id: m01-l07-q0397
  prompt:
    es: "Según el artículo 29 del texto refundido de Ley de Clases Pasivas del Estado, ¿cuántos años de servicios efectivos al Estado exige la pensión ordinaria de jubilación o retiro?"
  options:
  - id: a
    text:
      es: "Doce años de servicios efectivos al Estado"
  - id: b
    text:
      es: "Treinta años de servicios efectivos al Estado"
  - id: c
    text:
      es: "Veinte años de servicios efectivos al Estado"
  - id: d
    correct: true
    text:
      es: "Quince años de servicios efectivos al Estado"
  explanation:
    es: "El artículo 29 exige «haber completado quince años de servicios efectivos al Estado». Doce años son los que permiten pedir la prórroga del artículo 28.2.a). Treinta años son el requisito de la jubilación voluntaria. Veinte años no aparecen en estos artículos."
  citation: "art. 29 TRLCPE"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1987-12636-art-45
- id: m01-l07-q0404
  prompt:
    es: "Según el artículo 45.2 del texto refundido de Ley de Clases Pasivas del Estado, ¿qué porcentaje fijo se aplica, con carácter general, a la base reguladora de cada pensión en favor de los padres?"
  options:
  - id: a
    correct: true
    text:
      es: "El 15 por 100 de la base reguladora"
  - id: b
    text:
      es: "El 25 por 100 de la base reguladora"
  - id: c
    text:
      es: "El 10 por 100 de la base reguladora"
  - id: d
    text:
      es: "El 20 por 100 de la base reguladora"
  explanation:
    es: "El artículo 45.2 aplica «el porcentaje fijo del 15 por 100 para la determinación de cada una de las pensiones». El 25 por 100 es la orfandad de un solo hijo y el 10 por 100 la de cada hijo cuando hay varios. El 20 por 100 no aparece."
  citation: "art. 45.2 TRLCPE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2026-8287-apartado-14
- id: m01-l07-q0417
  prompt:
    es: "Según el apartado 14.2 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, los permisos cuya duración se fija en días hábiles se computan atendiendo:"
  options:
  - id: a
    text:
      es: "Al horario general de apertura al público de las oficinas de su centro."
  - id: b
    text:
      es: "Al calendario de días inhábiles para los procedimientos administrativos."
  - id: c
    text:
      es: "Al calendario de días hábiles de la localidad donde ocurra el hecho causante."
  - id: d
    correct: true
    text:
      es: "Al régimen de jornada y horario que corresponda al titular del permiso."
  explanation:
    es: "El apartado 14.2 dice que «se atenderá al régimen de jornada y horario que corresponda al titular del permiso». No cuenta el calendario del lugar del hecho causante ni el horario de apertura de las oficinas. El calendario de días inhábiles del procedimiento administrativo tampoco rige para los permisos."
  citation: "apartado 14.2 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "cómputo"
