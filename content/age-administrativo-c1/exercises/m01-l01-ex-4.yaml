# anchor: boe-a-1981-10325-art-5
- id: m01-l01-q052
  prompt:
    es: "Señale la respuesta correcta sobre las causas de cese del Defensor del Pueblo previstas en la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    text:
      es: "Cesa por haber sido condenado, mediante sentencia firme, por cualquier delito, doloso o imprudente."
  - id: b
    text:
      es: "Cesa por la disolución de las Cortes Generales que lo eligieron."
  - id: c
    text:
      es: "Cesa por la pérdida de la confianza de la Comisión Mixta Congreso-Senado."
  - id: d
    correct: true
    text:
      es: "Cesa por haber sido condenado, mediante sentencia firme, por delito doloso."
  explanation:
    es: "El artículo 5.1 de la LO 3/1981 recoge como causa de cese «haber sido condenado, mediante sentencia firme, por delito doloso». El delito imprudente no es causa de cese. La disolución de las Cortes no interrumpe su actividad (art. 11.1). La pérdida de confianza de la Comisión no figura entre las causas."
  citation: "art. 5.1 LO 3/1981"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1981-10325-art-5
- id: m01-l01-q053
  prompt:
    es: "De acuerdo con el artículo 5 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, la vacante del Defensor del Pueblo en los casos de muerte, renuncia y expiración del mandato se declarará por:"
  options:
  - id: a
    text:
      es: "Los Presidentes del Congreso y del Senado, conjuntamente."
  - id: b
    correct: true
    text:
      es: "El Presidente del Congreso de los Diputados."
  - id: c
    text:
      es: "Las Cámaras, por mayoría de tres quintos de los componentes de cada una."
  - id: d
    text:
      es: "La Comisión Mixta Congreso-Senado, por mayoría simple."
  explanation:
    es: "El artículo 5.2 de la LO 3/1981 dice que la vacante «se declarará por el Presidente del Congreso en los casos de muerte, renuncia y expiración del plazo del mandato». La decisión de las Cámaras por tres quintos se reserva a los demás casos. Ni los dos Presidentes juntos ni la Comisión Mixta declaran la vacante."
  citation: "art. 5.2 LO 3/1981"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1981-10325-art-6
- id: m01-l01-q054
  prompt:
    es: "Conforme al artículo 6 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, la decisión sobre la inculpación, prisión, procesamiento y juicio del Defensor del Pueblo corresponde exclusivamente a:"
  options:
  - id: a
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  - id: b
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia de Madrid."
  - id: c
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: d
    text:
      es: "El Pleno del Tribunal Constitucional."
  explanation:
    es: "El artículo 6.3 de la LO 3/1981 atribuye esa decisión «exclusivamente a la Sala de lo Penal del Tribunal Supremo». La Audiencia Nacional y el Tribunal Superior de Justicia de Madrid son órganos de nivel inferior. El Tribunal Constitucional no tiene jurisdicción penal."
  citation: "art. 6.3 LO 3/1981"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1981-10325-art-7
- id: m01-l01-q055
  prompt:
    es: "Según el artículo 7 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué ocurre si el Defensor del Pueblo no cesa en su situación de incompatibilidad dentro de los diez días siguientes a su nombramiento?"
  options:
  - id: a
    text:
      es: "Se entiende que renuncia al cargo en la fecha en que se produjo la incompatibilidad."
  - id: b
    text:
      es: "Las Cámaras declaran la vacante por mayoría de tres quintos, previa audiencia del interesado."
  - id: c
    text:
      es: "Se le concede un nuevo plazo de diez días para que cese en la incompatibilidad."
  - id: d
    correct: true
    text:
      es: "Se entiende que no acepta el nombramiento."
  explanation:
    es: "El artículo 7.2 de la LO 3/1981 dice que, si no cesa en ese plazo, se entiende «en caso contrario que no acepta el nombramiento». La renuncia en la fecha de la incompatibilidad es la consecuencia de la incompatibilidad sobrevenida tras la toma de posesión (art. 7.3). La ley no prevé declaración de vacante por las Cámaras para este caso ni un nuevo plazo."
  citation: "art. 7.2 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1981-10325-art-10
- id: m01-l01-q056
  prompt:
    es: "De acuerdo con el artículo 10 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, podrá dirigirse al Defensor del Pueblo:"
  options:
  - id: a
    correct: true
    text:
      es: "Toda persona natural o jurídica que invoque un interés legítimo, sin restricción alguna."
  - id: b
    text:
      es: "Toda persona natural o jurídica de nacionalidad española que invoque un interés legítimo."
  - id: c
    text:
      es: "Toda persona física mayor de edad que invoque un interés legítimo."
  - id: d
    text:
      es: "Toda persona natural o jurídica, salvo las internadas en un centro penitenciario."
  explanation:
    es: "El artículo 10.1 de la LO 3/1981 dice que podrá dirigirse al Defensor «toda persona natural o jurídica que invoque un interés legítimo, sin restricción alguna». Añade que no pueden ser impedimento la nacionalidad, la minoría de edad ni el internamiento en un centro penitenciario."
  citation: "art. 10.1 LO 3/1981"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1981-10325-art-15
- id: m01-l01-q057
  prompt:
    es: "¿En qué plazo máximo debe presentarse una queja ante el Defensor del Pueblo, según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Tres meses, contados a partir del momento en que el interesado tuvo conocimiento de los hechos."
  - id: b
    text:
      es: "Un año, contado a partir del momento en que se produjeron los hechos objeto de la queja."
  - id: c
    correct: true
    text:
      es: "Un año, contado a partir del momento en que el interesado tuvo conocimiento de los hechos."
  - id: d
    text:
      es: "Seis meses, contados a partir de la notificación del acto administrativo que se discute."
  explanation:
    es: "El artículo 15.1 de la LO 3/1981 exige presentar la queja «en el plazo máximo de un año, contado a partir del momento en que tuviera conocimiento de los hechos objeto de la misma». Tres y seis meses no son el plazo. El año se cuenta desde que el interesado conoce los hechos, no desde que ocurrieron."
  citation: "art. 15.1 LO 3/1981"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-166
- id: m01-l01-q058
  prompt:
    es: "La iniciativa de reforma constitucional corresponde, entre otros sujetos y en los términos previstos para la iniciativa legislativa, a:"
  options:
  - id: a
    text:
      es: "Los ciudadanos, mediante una iniciativa popular de 500.000 firmas."
  - id: b
    text:
      es: "El Tribunal Constitucional, reunido en Pleno."
  - id: c
    text:
      es: "El Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "Las Asambleas de las Comunidades Autónomas."
  explanation:
    es: "El artículo 166 remite a los apartados 1 y 2 del artículo 87, que dan la iniciativa al Gobierno, al Congreso, al Senado y a las Asambleas de las Comunidades Autónomas. No remite al apartado 3, la iniciativa popular. Ni el Tribunal Constitucional ni el Consejo General del Poder Judicial tienen iniciativa de reforma."
  citation: "art. 166 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-169
- id: m01-l01-q059
  prompt:
    es: "¿En qué circunstancias no puede iniciarse la reforma constitucional, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "En tiempo de guerra o de vigencia de alguno de los estados de alarma, de excepción o de sitio."
  - id: b
    text:
      es: "En tiempo de guerra o de vigencia del estado de sitio, aunque sí durante los de alarma y de excepción."
  - id: c
    text:
      es: "Durante los seis meses anteriores a la celebración de elecciones generales."
  - id: d
    text:
      es: "Durante el primer año siguiente a la aprobación de una reforma anterior."
  explanation:
    es: "El artículo 169 dice: «No podrá iniciarse la reforma constitucional en tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116». «Alguno» abarca los tres estados del artículo 116: alarma, excepción y sitio. La opción que deja libre la reforma durante la alarma y la excepción contradice la palabra «alguno». Las dos limitaciones por calendario, los seis meses antes de elecciones y el año tras una reforma, no están entre las circunstancias que el artículo enumera: el artículo 169 se agota en la guerra y en los estados del artículo 116."
  citation: "art. 169 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q060
  prompt:
    es: "¿Qué mayoría exige la Constitución Española de 1978 para aprobar un proyecto de reforma que no afecte al título preliminar, a la sección 1.ª del capítulo segundo del título I ni al título II?"
  options:
  - id: a
    text:
      es: "Dos tercios de cada una de las Cámaras."
  - id: b
    correct: true
    text:
      es: "Tres quintos de cada una de las Cámaras."
  - id: c
    text:
      es: "Mayoría absoluta del Congreso y tres quintos del Senado."
  - id: d
    text:
      es: "Tres quintos del Congreso y mayoría absoluta del Senado."
  explanation:
    es: "Esa reforma sigue el procedimiento ordinario, y el artículo 167.1 dice que los proyectos «deberán ser aprobados por una mayoría de tres quintos de cada una de las Cámaras». Los dos tercios de cada Cámara son la mayoría del procedimiento agravado (art. 168). Las combinaciones de mayoría absoluta en una Cámara y tres quintos en la otra no aparecen en el artículo. La vía alternativa del artículo 167.2 exige dos tercios del Congreso y mayoría absoluta del Senado."
  citation: "art. 167.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q061
  prompt:
    es: "De acuerdo con el artículo 167.2 de la Constitución Española de 1978, de no lograrse la aprobación con la Comisión paritaria, el Congreso, por mayoría de dos tercios, podrá aprobar la reforma siempre que el texto haya obtenido:"
  options:
  - id: a
    text:
      es: "El voto favorable de tres quintos del Senado."
  - id: b
    text:
      es: "El voto favorable de la mayoría simple del Senado."
  - id: c
    text:
      es: "El voto favorable de dos tercios del Senado."
  - id: d
    correct: true
    text:
      es: "El voto favorable de la mayoría absoluta del Senado."
  explanation:
    es: "El artículo 167.2 exige que el texto haya obtenido «el voto favorable de la mayoría absoluta del Senado». Los tres quintos del Senado son la mayoría inicial del artículo 167.1, que aquí no se ha alcanzado. La mayoría simple y la de dos tercios no son las del artículo."
  citation: "art. 167.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q062
  prompt:
    es: "De acuerdo con el artículo 167.3 de la Constitución Española de 1978, la reforma aprobada por las Cortes se somete a referéndum para su ratificación cuando, dentro de los quince días siguientes a su aprobación, lo solicite:"
  options:
  - id: a
    correct: true
    text:
      es: "Una décima parte de los miembros de cualquiera de las Cámaras."
  - id: b
    text:
      es: "Una décima parte de los miembros de cada una de las Cámaras."
  - id: c
    text:
      es: "Una quinta parte de los miembros de cualquiera de las Cámaras."
  - id: d
    text:
      es: "La mayoría absoluta de los miembros del Congreso de los Diputados."
  explanation:
    es: "El artículo 167.3 exige que lo soliciten «una décima parte de los miembros de cualquiera de las Cámaras». Basta una Cámara, no hace falta que la décima parte se reúna en las dos. Una quinta parte y la mayoría absoluta del Congreso no son las del artículo."
  citation: "art. 167.3 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q063
  prompt:
    es: "Se sigue el procedimiento agravado, con aprobación del principio por dos tercios de cada Cámara y disolución inmediata de las Cortes, para la reforma parcial que afecte:"
  options:
  - id: a
    text:
      es: "Al título III, De las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Al título II, De la Corona."
  - id: c
    text:
      es: "A la sección 2.ª del capítulo segundo del título I."
  - id: d
    text:
      es: "Al título VIII, De la Organización Territorial del Estado."
  explanation:
    es: "El artículo 168.1 reserva el procedimiento agravado a la revisión total y a la parcial que afecte «al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II». El título III, la sección 2.ª del capítulo segundo del título I y el título VIII se reforman por el procedimiento ordinario del artículo 167."
  citation: "art. 168.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q064
  prompt:
    es: "En el procedimiento agravado de reforma constitucional, una vez aprobado el nuevo texto por las Cortes Generales, el referéndum de ratificación:"
  options:
  - id: a
    text:
      es: "Solo se celebra si lo solicita una décima parte de los miembros de cualquiera de las Cámaras."
  - id: b
    text:
      es: "Solo se celebra si la reforma afecta al título II, De la Corona."
  - id: c
    correct: true
    text:
      es: "Se celebra siempre, sin necesidad de solicitud."
  - id: d
    text:
      es: "Se celebra antes de la disolución de las Cortes, sobre el principio aprobado."
  explanation:
    es: "El artículo 168.3 dice que, aprobada la reforma, «será sometida a referéndum para su ratificación», sin condición alguna. La solicitud de una décima parte de los miembros de una Cámara es el requisito del procedimiento ordinario (art. 167.3). El referéndum no depende de la materia y llega al final del procedimiento, no antes de la disolución."
  citation: "art. 168.3 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q065
  prompt:
    es: "Según el artículo 13.2 de la Constitución Española de 1978, dejando aparte lo que pueda establecerse por tratado o ley para las elecciones municipales, son titulares de los derechos reconocidos en el artículo 23:"
  options:
  - id: a
    text:
      es: "Los españoles y los extranjeros con residencia legal en España durante más de cinco años."
  - id: b
    text:
      es: "Los españoles y los extranjeros nacidos en España, aunque no hayan adquirido la nacionalidad."
  - id: c
    correct: true
    text:
      es: "Solamente quienes tienen la nacionalidad española."
  - id: d
    text:
      es: "Todas las personas, en los términos que establezcan los tratados y la ley."
  explanation:
    es: "El artículo 13.2 dice: «Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23», con la única salvedad del sufragio en las elecciones municipales. La residencia legal, por larga que sea, no da a un extranjero esos derechos. Haber nacido en España tampoco, si no se tiene la nacionalidad. La fórmula «en los términos que establezcan los tratados y la ley» es la del artículo 13.1, que se refiere a las libertades públicas del título I, no a los derechos del artículo 23."
  citation: "art. 13.2 CE"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
