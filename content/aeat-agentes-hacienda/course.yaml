    - id: m03-l07
      title:
        es: 'Actuaciones y procedimiento de gestión tributaria. Los procedimientos de gestión tributaria: iniciación,
          trámites y terminación. El procedimiento de verificación de datos. El procedimiento de comprobación
          de valores. El procedimiento de comprobación limitada. Rectificación de autoliquidaciones,
          declaraciones, comunicaciones de datos e iniciación del procedimiento de devolución.'
      summary:
        es: 'La LGT enumera, entre otros, estos procedimientos de gestión tributaria: el de devolución iniciado
          mediante autoliquidación, solicitud o comunicación de datos, el iniciado mediante declaración, el de
          verificación de datos, el de comprobación de valores y el de comprobación limitada. La lección trata también
          la tasación pericial contradictoria y la rectificación de autoliquidaciones, declaraciones, comunicaciones de
          datos y solicitudes de devolución. El título IV del RGAT regula además la gestión censal, el control de la
          presentación de declaraciones y de otras obligaciones formales y los beneficios fiscales de carácter rogado.'
