type: quiz
variants:
- id: m12-l04-qa01
  prompt:
    en: According to Vivek Rau in Eliminating Toil, which kind of work does he say counts as toil?
  options:
  - id: a
    correct: true
    text:
      en: Work tied to running a production service that tends to be manual and repetitive
  - id: b
    text:
      en: Any administrative chore that has to get done, such as HR paperwork or team meetings
  - id: c
    text:
      en: Any work a person dislikes, since preference decides what counts as toil
  - id: d
    text:
      en: Grungy cleanup work, even when it leaves the service better for the long term
  explanation:
    en: Rau writes that toil is the kind of work tied to running a production service that tends to be manual and
      repetitive, among other attributes. He writes that administrative chores that have to get done should not
      be categorized as toil and are overhead, which rules out any administrative chore. He writes that toil is
      not just work a person does not like to do, which rules out work a person dislikes. He writes that grungy
      work with long-term value is not toil, which rules out grungy cleanup that improves the service.
  citation: sre-book-eliminating-toil#toil-defined
  extract:
    en: Toil is the kind of work tied to running a production service that tends to be manual, repetitive
- id: m12-l04-qa02
  prompt:
    en: According to Vivek Rau in Eliminating Toil, how much of each SRE's time should operational work take at
      Google?
  options:
  - id: a
    text:
      en: None at all, because toil must be eliminated completely before other work
  - id: b
    correct: true
    text:
      en: Below 50% of each SRE's time, as an advertised goal of the organization
  - id: c
    text:
      en: Below 50% for the organization as a whole, while subteams may exceed it
  - id: d
    text:
      en: Whatever it takes, because toil shrinks on its own as the service matures
  explanation:
    en: Rau writes that the SRE organization has an advertised goal of keeping operational work below 50% of each
      SRE's time. He writes that we may never be able to eliminate toil completely but must keep working to minimize
      it, which rules out eliminating it entirely first. He writes that the organization must not let any subteam
      devolve into an Ops team, which rules out subteams exceeding the goal. He writes that toil tends to expand
      if left unchecked and can fill 100% of everyone's time, which rules out toil shrinking on its own.
  citation: sre-book-eliminating-toil#why-less-toil-is-better; sre-book-eliminating-toil#toil-defined
  extract:
    en: has an advertised goal of keeping operational work (i.e., toil) below 50% of each SRE’s time
- id: m12-l04-qa04
  prompt:
    en: According to Andrew Stribblehill in Managing Incidents, which of these does he recommend as a best practice
      for incident management?
  options:
  - id: a
    text:
      en: Keep one person as incident commander so the role is mastered
  - id: b
    text:
      en: Have the commander direct each participant's actions in detail
  - id: c
    correct: true
    text:
      en: Use the process routinely so that it becomes second nature
  - id: d
    text:
      en: Write the procedures after an incident, once what worked is known
  explanation:
    en: Stribblehill lists using the process routinely so that it becomes second nature. He suggests that whoever
      was incident commander last time takes a different role this time, which rules out keeping one person as commander.
      He lists giving full autonomy within the assigned role to all incident participants, which rules out the commander
      directing each action in detail. He lists developing and documenting the procedures in advance, which rules
      out writing them after an incident.
  citation: sre-book-managing-incidents#best-practices-for-incident-management
  extract:
    en: Use the process routinely so it becomes second nature
