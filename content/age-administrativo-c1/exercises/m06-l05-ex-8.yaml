  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-ordenar-html
- id: m06-l05-q301
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones indica dónde están los comandos Ordenar de la A a la Z y Ordenar de la Z a la A?"
  options:
  - id: a
    text:
      es: "Pestaña Datos, grupo Esquema"
  - id: b
    text:
      es: "Pestaña Datos, grupo Herramientas de datos"
  - id: c
    correct: true
    text:
      es: "Pestaña Datos, grupo Ordenar y filtrar"
  - id: d
    text:
      es: "Pestaña Inicio, grupo Estilos"
  explanation:
    es: "Los comandos de ordenación rápida, ascendente y descendente, están en la pestaña Datos, grupo Ordenar y filtrar. El grupo Esquema contiene Subtotal, Herramientas de datos contiene Quitar duplicados y el grupo Estilos de Inicio contiene Formato condicional."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar texto»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-ordenar-html
- id: m06-l05-q305
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes acciones hay que hacer antes de ordenar de izquierda a derecha los datos de una tabla de Excel?"
  options:
  - id: a
    text:
      es: "Activar la casilla Mis datos tienen encabezados"
  - id: b
    correct: true
    text:
      es: "Convertir la tabla en un rango"
  - id: c
    text:
      es: "Crear antes una lista personalizada con los valores"
  - id: d
    text:
      es: "Aplicar un filtro a la fila de encabezado"
  explanation:
    es: "Las tablas no admiten la ordenación de izquierda a derecha, por lo que primero hay que convertir la tabla en un rango. Los encabezados, las listas personalizadas y los filtros no son el requisito que indica la página."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar de izquierda a derecha»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-excel-filtrar-html
- id: m06-l05-q307
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe lo que hace un filtro aplicado a un rango de datos?"
  options:
  - id: a
    text:
      es: "Elimina de forma permanente las filas que no cumplen los criterios indicados"
  - id: b
    text:
      es: "Reorganiza las filas en un nuevo orden según los criterios"
  - id: c
    correct: true
    text:
      es: "Muestra solo las filas que cumplen los criterios y oculta las demás"
  - id: d
    text:
      es: "Agrupa las filas y calcula un subtotal por cada grupo de valores"
  explanation:
    es: "Los datos filtrados muestran solo las filas que cumplen los criterios y ocultan las demás. Eliminar permanentemente es lo que hace Quitar duplicados, reorganizar es ordenar y los subtotales los inserta el comando Subtotal."
  citation: "fuente: `ms-excel-filtrar.html`; «Más información sobre el filtrado»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-filtrar-html
- id: m06-l05-q308
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe qué ocurre al aplicar un filtro adicional a otra columna de un rango ya filtrado?"
  options:
  - id: a
    correct: true
    text:
      es: "Se basa en el filtro actual y reduce aún más el subconjunto de datos"
  - id: b
    text:
      es: "Reemplaza el filtro anterior por el nuevo"
  - id: c
    text:
      es: "Se ignora el filtro anterior hasta que se borra"
  - id: d
    text:
      es: "Solo se aplica si se desactiva antes el filtro anterior"
  explanation:
    es: "Los filtros son aditivos: cada filtro adicional se basa en el filtro actual y reduce aún más el subconjunto de datos. Por tanto no sustituye al anterior ni lo ignora, y la página señala que se puede filtrar por más de una columna."
  citation: "fuente: `ms-excel-filtrar.html`; «Esto significa que cada filtro adicional se basa en el filtro actual y reduce aún más el subconjunto de datos.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q312
  prompt:
    es: "En Excel 365, ¿en qué grupo de la pestaña Datos está el comando para filtrar valores únicos con un filtro avanzado?"
  options:
  - id: a
    text:
      es: "Herramientas de datos"
  - id: b
    text:
      es: "Esquema"
  - id: c
    correct: true
    text:
      es: "Ordenar y filtrar"
  - id: d
    text:
      es: "Estilos"
  explanation:
    es: "El filtro avanzado se abre desde el grupo Ordenar y filtrar de la pestaña Datos. Herramientas de datos contiene Quitar duplicados, Esquema contiene Subtotal y Estilos pertenece a la pestaña Inicio."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Filtrar por valores únicos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q315
  prompt:
    es: "En Excel 365, al quitar duplicados se seleccionan Columna1 y Columna2 pero no Columna3. Si hay un duplicado en esas dos columnas, ¿cuál de las siguientes opciones indica qué se elimina?"
  options:
  - id: a
    text:
      es: "Solo los valores duplicados de Columna1 y Columna2"
  - id: b
    text:
      es: "Solo la celda duplicada de Columna1"
  - id: c
    text:
      es: "Nada, porque Columna3 no está seleccionada"
  - id: d
    correct: true
    text:
      es: "Toda la fila, incluidos los datos de Columna3"
  explanation:
    es: "La clave para buscar duplicados es el valor de ambas columnas seleccionadas, y cuando se encuentra un duplicado se quita toda la fila, incluidas las otras columnas de la tabla o rango. Los datos se quitan de todas las columnas aunque no se seleccionen todas."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Quitar valores duplicados»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q316
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas resalta, sin eliminarlos, los valores duplicados de un rango?"
  options:
  - id: a
    correct: true
    text:
      es: "Inicio › Formato condicional › Resaltar reglas de celdas › Duplicar valores"
  - id: b
    text:
      es: "Datos › Herramientas de datos › Quitar duplicados"
  - id: c
    text:
      es: "Datos › Ordenar y filtrar › Filtro avanzado"
  - id: d
    text:
      es: "Insertar › Tabla dinámica"
  explanation:
    es: "Para resaltar duplicados se usa en Inicio el comando Formato condicional, Resaltar reglas de celdas y Duplicar valores. Quitar duplicados los elimina, el filtro avanzado los oculta y la tabla dinámica resume datos."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Formato rápido»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q317
