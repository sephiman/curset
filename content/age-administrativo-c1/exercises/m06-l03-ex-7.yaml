# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q248
  prompt:
    es: "En la herramienta Recortes de Windows 11, ¿qué permite hacer el botón Acciones de texto de un recorte de imagen?"
  options:
  - id: a
    correct: true
    text:
      es: "Extraer y copiar el texto del recorte mediante OCR"
  - id: b
    text:
      es: "Escribir o dibujar sobre el recorte con el lápiz o el resaltador"
  - id: c
    text:
      es: "Añadir formas o emojis a la imagen del recorte"
  - id: d
    text:
      es: "Recortar la imagen para quitar partes no deseadas"
  explanation:
    es: "La página dice que Acciones de texto extrae y copia el texto deseado del recorte, activando el reconocimiento óptico de caracteres (OCR). Escribir o dibujar es de Lápiz y Resaltador, las formas y los emojis son de Formas y recortar la imagen es del botón Recorte de imagen."
  citation: "fuente: `ms-win-recortes.html`; «Anotar un recorte»"
  difficulty: 3
  tags:
