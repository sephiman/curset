# anchor: boe-a-2003-23186-art-234
- id: m03-l14-q0168
  prompt:
    es: "De acuerdo con el artículo 234.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento económico-administrativo se impulsa de oficio con sujeción a los plazos establecidos, que no son susceptibles de prórroga ni precisan que se declare:"
  options:
  - id: a
    text:
      es: "Su admisión a trámite por el tribunal."
  - id: b
    text:
      es: "Su suspensión cautelar durante el trámite."
  - id: c
    text:
      es: "Su caducidad por inactividad del reclamante."
  - id: d
    correct: true
    text:
      es: "Su finalización."
  explanation:
    es: "Los plazos del procedimiento económico-administrativo no admiten prórroga ni necesitan declaración de finalización (art. 234.3). La admisión, la suspensión cautelar y la caducidad por inactividad no son lo que dice ese apartado."
  citation: "art. 234.3 LGT"
  difficulty: 1
  tags:
  - "procedimiento"
  - "impulso"
# anchor: boe-a-2003-23186-art-234
- id: m03-l14-q0172
  prompt:
    es: "Conforme al artículo 234.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento económico-administrativo es, en cuanto a su coste para quien reclama:"
  options:
  - id: a
    text:
      es: "De pago, mediante una tasa fijada por cada tribunal."
  - id: b
    correct: true
    text:
      es: "Gratuito, sin perjuicio de las costas en caso de temeridad o mala fe."
  - id: c
    text:
      es: "Gratuito solo en las reclamaciones de cuantía inferior a seis mil euros."
  - id: d
    text:
      es: "Gratuito en todo caso, incluso si hay temeridad o mala fe."
  explanation:
    es: "El procedimiento es gratuito, pero si la reclamación o el recurso resulta desestimado o inadmitido y se aprecia temeridad o mala fe pueden exigirse las costas (art. 234.5). No es gratuito «en todo caso». No hay tasa. Y la gratuidad no depende de la cuantía."
  citation: "art. 234.5 LGT"
  difficulty: 1
  tags:
  - "procedimiento"
  - "gratuidad"
# anchor: boe-a-2003-23186-art-234
- id: m03-l14-q0173
  prompt:
    es: "Respecto a las costas del procedimiento económico-administrativo, conforme al artículo 234.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Si la reclamación resulta estimada y se aprecia temeridad de la Administración, se impone una multa al funcionario responsable."
  - id: b
    correct: true
    text:
      es: "Si la reclamación resulta desestimada o inadmitida y se aprecia temeridad o mala fe, puede exigirse a la persona a la que resulte imputable que sufrague las costas."
  - id: c
    text:
      es: "Si la reclamación resulta desestimada, deben abonarse siempre las costas del procedimiento por el reclamante."
  - id: d
    text:
      es: "Si la reclamación resulta inadmitida, se exigen costas únicamente cuando el reclamante sea una persona jurídica."
  explanation:
    es: "Las costas dependen de que la reclamación o el recurso se desestime o inadmita y de que se aprecie temeridad o mala fe (art. 234.5). No se imponen siempre por desestimar. No hay multa al funcionario en este artículo. Y no depende de que el reclamante sea persona jurídica."
  citation: "art. 234.5 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
  - "costas"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0174
  prompt:
    es: "¿En qué plazo se interpone la reclamación económico-administrativa en única o primera instancia, de acuerdo con el artículo 235.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Tres meses a contar desde el día siguiente al de la notificación del acto impugnado."
  - id: b
    text:
      es: "Dos meses a contar desde el día siguiente al de la notificación del acto impugnado."
  - id: c
    text:
      es: "Quince días a contar desde el día siguiente al de la notificación del acto impugnado."
  - id: d
    correct: true
    text:
      es: "Un mes a contar desde el día siguiente al de la notificación del acto impugnado."
  explanation:
    es: "El plazo es de un mes desde el día siguiente al de la notificación (art. 235.1), el mismo que el de la reposición. Quince días es el del recurso de anulación y tres meses el de los recursos extraordinarios. Dos meses no es plazo de ninguno de ellos."
  citation: "art. 235.1 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "plazo"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0175
  prompt:
    es: "A Carmen Orellana Gil se le notifica el martes 14 de abril de 2026 una liquidación definitiva, y no interpone reposición. El plazo se cuenta según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. Conforme al artículo 235.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo para interponer la reclamación económico-administrativa termina el:"
  options:
  - id: a
    correct: true
    text:
      es: "Jueves 14 de mayo de 2026."
  - id: b
    text:
      es: "Martes 14 de julio de 2026."
  - id: c
    text:
      es: "Miércoles 29 de abril de 2026."
  - id: d
    text:
      es: "Viernes 15 de mayo de 2026."
  explanation:
    es: "El plazo es de un mes desde el día siguiente a la notificación, de modo que empieza el 15 de abril y termina el mismo día del mes siguiente, el jueves 14 de mayo de 2026 (art. 30.4 LPAC). El 15 de mayo ya excede el plazo. El 14 de julio sería a tres meses. Y el 29 de abril se quedaría en quince días."
  citation: "art. 235.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "reclamación"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0176
  prompt:
    es: "De acuerdo con el artículo 235.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en las reclamaciones relativas a retenciones, ingresos a cuenta o repercusiones, el plazo de un mes se cuenta desde el día siguiente a aquel en que quede constancia de la realización u omisión de:"
  options:
  - id: a
    correct: true
    text:
      es: "La retención, el ingreso a cuenta o la repercusión motivo de la reclamación."
  - id: b
    text:
      es: "La declaración informativa correspondiente al ejercicio."
  - id: c
    text:
      es: "La notificación de la liquidación al retenedor."
  - id: d
    text:
      es: "El requerimiento formal del cumplimiento de la obligación."
  explanation:
    es: "En las reclamaciones sobre actuaciones de particulares el plazo se cuenta desde que quede constancia de la realización u omisión de la retención, el ingreso a cuenta o la repercusión (art. 235.1). No parte de una declaración informativa ni de una liquidación notificada. Y el requerimiento formal es el hito de las facturas."
  citation: "art. 235.1 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "retenciones"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0177
  prompt:
    es: "Conforme al artículo 235.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tratándose de reclamaciones relativas a la obligación de expedir y entregar factura, el plazo de un mes empieza a contarse:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al del requerimiento formal del cumplimiento de la obligación de expedir."
  - id: b
    text:
      es: "Desde el día siguiente a aquel en que se debió expedir la factura."
  - id: c
    text:
      es: "Transcurridos tres meses desde que se haya requerido formalmente el cumplimiento."
  - id: d
    correct: true
    text:
      es: "Transcurrido un mes desde que se haya requerido formalmente el cumplimiento de dicha obligación."
  explanation:
    es: "El plazo de un mes empieza a contarse una vez transcurrido un mes desde el requerimiento formal (art. 235.1). No arranca al día siguiente de la fecha en que debió expedirse, ni al día siguiente del requerimiento, ni a los tres meses."
  citation: "art. 235.1 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "factura"
  - "plazo"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0178
  prompt:
    es: "Según el artículo 235.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el supuesto de deudas de vencimiento periódico y notificación colectiva, el plazo de interposición de la reclamación se computa a partir del día siguiente al de finalización del período:"
  options:
  - id: a
    correct: true
    text:
      es: "Voluntario de pago."
  - id: b
    text:
      es: "De exposición pública del padrón."
  - id: c
    text:
      es: "Ejecutivo de pago."
  - id: d
    text:
      es: "De presentación de la autoliquidación."
  explanation:
    es: "Para las deudas de vencimiento periódico y notificación colectiva el plazo arranca al terminar el período voluntario de pago (art. 235.1). El ejecutivo es posterior, y la exposición del padrón y la presentación de la autoliquidación no son el hito."
  citation: "art. 235.1 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "deudas periódicas"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0180
  prompt:
    es: "Lola Vega Pons interpone una reclamación económico-administrativa contra una liquidación que dictó una Dependencia Regional de Gestión Tributaria, sin que concurra ninguna circunstancia especial. Conforme al artículo 235.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién se dirige el escrito de interposición y qué hace ese órgano?"
  options:
  - id: a
    text:
      es: "Se dirige al superior jerárquico del órgano que dictó el acto, que resuelve si lo remite al tribunal."
  - id: b
    correct: true
    text:
      es: "Se dirige al órgano administrativo que dictó el acto, que lo remite al tribunal competente en el plazo de un mes junto con el expediente."
  - id: c
    text:
      es: "Se dirige al tribunal económico-administrativo, que reclama el expediente al órgano que dictó el acto en el plazo de un mes, con el escrito de interposición."
  - id: d
    text:
      es: "Se dirige al órgano que dictó el acto, que lo remite al tribunal competente en el plazo de dos meses con el expediente."
  explanation:
    es: "El escrito se dirige al órgano administrativo que dictó el acto reclamable y este lo remite al tribunal competente en el plazo de un mes, junto con el expediente (art. 235.3). La dirección directa al tribunal es la excepción del apartado 4. El plazo de remisión no es de dos meses. Y el superior jerárquico no decide si se remite."
  citation: "art. 235.3 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "reclamación"
  - "órgano"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0181
  prompt:
    es: "Un empresario reclama contra la repercusión de un impuesto que le ha hecho otro empresario, es decir, una actuación de un particular. Según el artículo 235.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién se dirige el escrito de interposición?"
  options:
  - id: a
    correct: true
    text:
      es: "Al tribunal económico-administrativo competente para resolver la reclamación."
  - id: b
    text:
      es: "A la Delegación de la Agencia del domicilio del reclamante."
  - id: c
    text:
      es: "Al órgano de gestión de la Agencia que gestiona el impuesto repercutido, que lo remite al tribunal."
  - id: d
    text:
      es: "Al particular que repercutió el impuesto, que lo remite al tribunal."
  explanation:
    es: "En las reclamaciones sobre retenciones, ingresos a cuenta, repercusiones, obligación de expedir y entregar factura y relaciones entre el sustituto y el contribuyente, el escrito se dirige al tribunal competente para resolver (art. 235.4). No pasa por un órgano de gestión ni por el particular reclamado. Y no se presenta en la Delegación de la Agencia."
  citation: "art. 235.4 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "reclamación"
  - "retenciones"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0182
  prompt:
    es: "De acuerdo con el artículo 235.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la interposición de la reclamación se realiza obligatoriamente a través de la sede electrónica del órgano que haya dictado el acto cuando los reclamantes estén obligados:"
  options:
  - id: a
    correct: true
    text:
      es: "A recibir por medios electrónicos las comunicaciones y notificaciones."
  - id: b
    text:
      es: "A presentar sus declaraciones tributarias de forma telemática ante la Agencia."
  - id: c
    text:
      es: "A tributar en el régimen de grandes empresas."
  - id: d
    text:
      es: "A tener un representante con apoderamiento electrónico."
  explanation:
    es: "El artículo 235.5 impone la sede electrónica a quienes estén obligados a recibir por medios electrónicos las comunicaciones y notificaciones. La obligación de presentar declaraciones telemáticas, tener representante electrónico o ser gran empresa no es el criterio."
  citation: "art. 235.5 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "sede electrónica"
# anchor: boe-a-2003-23186-art-236
- id: m03-l14-q0183
  prompt:
    es: "Según el artículo 236.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el tribunal puede solicitar informe al órgano que dictó el acto impugnado, y debe dar traslado del informe al reclamante para que pueda:"
  options:
  - id: a
    text:
      es: "Desistir de la reclamación sin costas."
  - id: b
    correct: true
    text:
      es: "Presentar alegaciones al mismo."
  - id: c
    text:
      es: "Recusar a los vocales del tribunal."
  - id: d
    text:
      es: "Solicitar la suspensión del procedimiento."
  explanation:
    es: "El informe del órgano que dictó el acto se traslada al reclamante para que alegue sobre él (art. 236.3). No se trata de desistir, suspender ni recusar."
  citation: "art. 236.3 LGT"
  difficulty: 1
  tags:
  - "tramitación"
  - "informe"
