# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q311
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF permite crear un archivo con solo algunas de las páginas del documento?"
  options:
  - id: a
    text:
      es: "Documento con marcas"
  - id: b
    text:
      es: "Crear marcadores con"
  - id: c
    correct: true
    text:
      es: "Intervalo de páginas"
  - id: d
    text:
      es: "Propiedades del documento"
  explanation:
    es: "La página dice: «Para crear un archivo PDF solo con algunas de las páginas de su documento, elija una opción en Intervalo de páginas». Documento con marcas incluye las marcas de revisión. Crear marcadores con crea un conjunto de marcadores en el PDF. Propiedades del documento incluye las propiedades en el PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q313
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF facilita la lectura del documento con un software de lectura de pantalla?"
  options:
  - id: a
    correct: true
    text:
      es: "Etiquetas de la estructura del documento para accesibilidad"
  - id: b
    text:
      es: "Cifrar el documento con una contraseña"
  - id: c
    text:
      es: "Crear marcadores con Encabezados"
  - id: d
    text:
      es: "Documento con marcas"
  explanation:
    es: "La página dice: «Para facilitar la lectura del documento en un software de lectura de pantalla, seleccione Etiquetas de la estructura del documento para accesibilidad». Cifrar restringe el acceso al PDF con una contraseña. Crear marcadores crea un conjunto de marcadores en el PDF. Documento con marcas incluye las marcas de revisión."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m06-l04-q315
  prompt:
    es: "Según la página de Microsoft, ¿cuándo conviene usar el formato PDF para un archivo de Word 365?"
  options:
  - id: a
    text:
      es: "Cuando se quiere que el destinatario pueda editarlo con facilidad"
  - id: b
    correct: true
    text:
      es: "Cuando se quiere la misma apariencia en la mayoría de los equipos"
  - id: c
    text:
      es: "Cuando se quiere que tenga un tamaño de archivo mayor"
  - id: d
    text:
      es: "Cuando se quiere que solo se pueda abrir con Microsoft Word"
  explanation:
    es: "La página dice: «Use el formato PDF cuando quiera que un archivo: Tenga la misma apariencia en la mayoría de los equipos». La página avisa de que compartir como PDF no garantiza que el destinatario no pueda editarlo; no es su razón de uso. La página lo recomienda para un tamaño de archivo más pequeño. La página dice que muchos programas, incluido Word, pueden abrir PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q318
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Configuración imprime el documento con sus comentarios y marcas de revisión?"
  options:
  - id: a
    text:
      es: "Imprimir página actual"
  - id: b
    text:
      es: "Impresión personalizada"
  - id: c
    text:
      es: "Personas específicas"
  - id: d
    correct: true
    text:
      es: "Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «En Configuración, seleccione Imprimir documento con revisiones» y «El documento se imprimirá con comentarios». Imprimir página actual imprime la página que se muestra en la vista previa. Impresión personalizada permite elegir páginas concretas. Personas específicas sirve para imprimir los comentarios de un revisor concreto."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q320
  prompt:
    es: "Según la página de Microsoft, ¿qué se hace en la pestaña Revisar de Word 365 para imprimir un documento sin comentarios?"
  options:
  - id: a
    text:
      es: "Elegir Comentarios en Mostrar marcas, y luego imprimir"
  - id: b
    text:
      es: "Elegir un revisor en Personas específicas, y luego imprimir el documento"
  - id: c
    correct: true
    text:
      es: "Elegir Ninguna revisión en Mostrar para revisión, y luego imprimir"
  - id: d
    text:
      es: "Elegir Imprimir documento con revisiones en Configuración, y luego imprimir"
  explanation:
    es: "La página dice: «Si desea imprimir el documento sin comentarios, vaya a la pestaña Revisar. A continuación, en el grupo Revisión, seleccione la lista desplegable Mostrar para revisión, Ninguna revisión y, a continuación, imprima el documento». Mostrar marcas con Comentarios sirve para ver los comentarios. Personas específicas sirve para imprimir los comentarios de un revisor concreto. Imprimir documento con revisiones imprime el documento con comentarios."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q322
  prompt:
    es: "En Word 365, ¿cómo se imprimen páginas consecutivas, como de la 1 a la 3?"
  options:
  - id: a
    text:
      es: "Con Imprimir página actual, repitiendo el comando tres veces"
  - id: b
    correct: true
    text:
      es: "Con Impresión personalizada, escribiendo la primera y la última página"
  - id: c
    text:
      es: "Con Imprimir todas las páginas, y desmarcando la página 4 después"
  - id: d
    text:
      es: "Con Imprimir documento con revisiones, escribiendo el intervalo"
  explanation:
    es: "La página dice: «Para imprimir páginas consecutivas como de la 1 a la 3, seleccione Impresión personalizada e introduzca el primer y el último número de página en el cuadro Páginas». Imprimir página actual imprime la página que se muestra en la vista previa. Imprimir todas las páginas es la opción predeterminada de Configuración. Imprimir documento con revisiones imprime el documento con comentarios."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir páginas determinadas»"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: fuente-ms-word-imprimir-html
- id: m06-l04-q323
  prompt:
    es: "En Word 365, ¿cuál de los siguientes controles de la vista previa de impresión amplía un texto difícil de leer por ser muy pequeño?"
  options:
  - id: a
    text:
      es: "Las flechas hacia delante y hacia atrás de la parte inferior"
  - id: b
    text:
      es: "El botón Imprimir, con el número de copias elegido"
  - id: c
    correct: true
    text:
      es: "El control deslizante del zoom, en la parte inferior"
  - id: d
    text:
      es: "La lista Personas específicas de Configuración"
  explanation:
    es: "La página dice: «Si es difícil leer el texto porque es muy pequeño, use el control deslizante del zoom en la parte inferior de la página para ampliarlo». Las flechas sirven para ver cada página de la vista previa. El botón Imprimir lanza la impresión. Personas específicas sirve para elegir los comentarios de un revisor."
  citation: "fuente: `ms-word-imprimir.html`; «Obtener una vista previa del documento»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q326
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra la pestaña Imprimir en la vista Backstage?"
  options:
  - id: a
    text:
      es: "Mayús+F12"
  - id: b
    text:
      es: "Ctrl+F12"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+F12"
  - id: d
    text:
      es: "Alt+Mayús+F12"
  explanation:
    es: "La tabla de teclas de función dice: «Ctrl+Mayús+F12: muestra la pestaña Imprimir en la vista Backstage». Mayús+F12 guarda el documento. Ctrl+F12 muestra el cuadro de diálogo Abrir. Alt+Mayús+F12 selecciona el botón Tabla de contenido en su contenedor."
  citation: "fuente: `ms-word-atajos.html`; «Obtener una vista previa e imprimir documentos»"
  difficulty: 2
  tags:
  - "atajo"
