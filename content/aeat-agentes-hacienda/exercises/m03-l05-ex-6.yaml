# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0165
  prompt:
    es: "Según el artículo 91.6 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el acuerdo de concesión o la denegación de la ampliación o del aplazamiento de los plazos:"
  options:
  - id: a
    text:
      es: "puede recurrirse en reposición en el plazo de un mes."
  - id: b
    correct: true
    text:
      es: "no es susceptible de recurso o reclamación económico-administrativa."
  - id: c
    text:
      es: "puede ser objeto de reclamación económico-administrativa en el plazo de un mes."
  - id: d
    text:
      es: "solo puede recurrirse cuando haya sido denegado, no cuando se conceda."
  explanation:
    es: "El acuerdo de concesión o denegación no admite recurso ni reclamación económico-administrativa. No cabe reposición, ni reclamación, ni distinción entre concesión y denegación."
  citation: "art. 91.6 RGAT"
  difficulty: 1
  tags:
  - "ampliación de plazos"
  - "recurso"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0166
  prompt:
    es: "Según el artículo 91.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿quién puede conceder, a petición de los obligados tributarios, la ampliación de los plazos establecidos para el cumplimiento de trámites?"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano a quien corresponda la tramitación del procedimiento."
  - id: b
    text:
      es: "El superior jerárquico del órgano que tramita el procedimiento."
  - id: c
    text:
      es: "El Director General de la Agencia Estatal de Administración Tributaria."
  - id: d
    text:
      es: "El tribunal económico-administrativo competente por razón del territorio."
  explanation:
    es: "La competencia es del órgano que tramita el procedimiento. No corresponde a su superior jerárquico, al Director General ni a los tribunales económico-administrativos."
  citation: "art. 91.1 RGAT"
  difficulty: 1
  tags:
  - "ampliación de plazos"
  - "órgano"
# anchor: boe-a-2003-23186-art-100
- id: m03-l05-q0167
  prompt:
    es: "¿Cuál de los siguientes supuestos pone fin a los procedimientos tributarios, según el artículo 100.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La interposición de un recurso por el obligado tributario contra el acuerdo de inicio del procedimiento."
  - id: b
    text:
      es: "La notificación del acuerdo de inicio del procedimiento."
  - id: c
    text:
      es: "La solicitud de ampliación del plazo de alegaciones."
  - id: d
    correct: true
    text:
      es: "El cumplimiento de la obligación que hubiera sido objeto de requerimiento."
  explanation:
    es: "El artículo 100.1 enumera, entre las causas de terminación, el cumplimiento de la obligación requerida. Recurrir, notificar el inicio o pedir una ampliación de plazo son actos de la tramitación que no ponen fin al procedimiento."
  citation: "art. 100.1 LGT"
  difficulty: 2
  tags:
  - "terminación"
  - "causas"
# anchor: boe-a-2003-23186-art-100
- id: m03-l05-q0168
  prompt:
    es: "Una sociedad presenta una solicitud en un procedimiento tributario y, antes de que se resuelva, renuncia al derecho en que se fundamentaba. De acuerdo con el artículo 100.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto tiene la renuncia?"
  options:
  - id: a
    correct: true
    text:
      es: "Pone fin al procedimiento tributario."
  - id: b
    text:
      es: "Suspende el procedimiento durante tres meses."
  - id: c
    text:
      es: "Obliga a la Administración a dictar resolución desestimatoria."
  - id: d
    text:
      es: "Solo pone fin al procedimiento si la Administración la acepta expresamente."
  explanation:
    es: "La renuncia al derecho en que se fundamenta la solicitud figura entre las causas que ponen fin a los procedimientos tributarios. No lo suspende, no obliga a resolver en sentido desestimatorio y no necesita aceptación expresa."
  citation: "art. 100.1 LGT"
  difficulty: 1
  tags:
  - "terminación"
  - "renuncia"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0268
  prompt:
    es: "Según el artículo 91 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre la ampliación de los plazos de trámite solicitada por el obligado:"
  options:
  - id: a
    text:
      es: "Puede alcanzar la totalidad del plazo y se concede una ampliación por cada solicitud justificada."
  - id: b
    text:
      es: "No puede exceder de la mitad del plazo, pero se conceden las ampliaciones sucesivas que se justifiquen."
  - id: c
    correct: true
    text:
      es: "No puede exceder de la mitad del plazo y no se concede más de una ampliación del plazo respectivo."
  - id: d
    text:
      es: "Puede alcanzar un tercio del plazo y no se concede más de una ampliación, salvo causa de fuerza mayor."
  explanation:
    es: "La ampliación no puede exceder de la mitad del plazo y no se concede más de una (arts. 91.1 y 91.2). No alcanza el plazo entero, no admite ampliaciones sucesivas y no se mide en un tercio ni tiene excepción de fuerza mayor."
  citation: "art. 91 RGAT"
  difficulty: 2
  tags:
  - "ampliación de plazos"
  - "límite"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0280
  prompt:
    es: "Conforme al artículo 99 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los derechos de los obligados tributarios en el desarrollo de las actuaciones y procedimientos:"
  options:
  - id: a
    text:
      es: "Deben presentar siempre los documentos que la Administración les requiera, aunque no sean exigibles por la normativa tributaria."
  - id: b
    text:
      es: "Pueden rehusar presentar los documentos que no sean exigibles, pero no tienen derecho a certificación de lo que hayan presentado."
  - id: c
    text:
      es: "Tienen derecho a copia gratuita de todos los documentos del expediente, incluso los que afecten a la intimidad de otras personas."
  - id: d
    correct: true
    text:
      es: "Pueden rehusar presentar los documentos que no sean exigibles y tienen derecho a que se les expida certificación de las autoliquidaciones y declaraciones que hayan presentado."
  explanation:
    es: "El artículo 99 permite rehusar los documentos no exigibles (99.2) y reconoce el derecho a la certificación de lo presentado (99.3). No hay deber de presentar todo lo requerido, el derecho a certificación existe y las copias son a costa del obligado y con límites de intimidad de terceros (99.4)."
  citation: "art. 99.3 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "derechos"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0170
  prompt:
    es: "Según el artículo 101.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la liquidación tributaria es el acto resolutorio mediante el cual el órgano competente de la Administración:"
  options:
  - id: a
    text:
      es: "reconoce el derecho del obligado a una devolución, sin determinar el importe que le corresponde."
  - id: b
    text:
      es: "comprueba los hechos declarados por el obligado y propone la regularización de su situación tributaria."
  - id: c
    correct: true
    text:
      es: "realiza las operaciones de cuantificación necesarias y determina el importe de la deuda tributaria o de la cantidad a devolver o compensar."
  - id: d
    text:
      es: "exige el pago de la deuda tributaria no ingresada en período voluntario mediante la providencia de apremio."
  explanation:
    es: "La liquidación cuantifica y determina el importe de la deuda o de la cantidad a devolver o compensar. Reconocer una devolución sin importe, proponer una regularización o exigir el pago en apremio son otros actos: la propuesta, el reconocimiento y la providencia de apremio."
  citation: "art. 101.1 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "concepto"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0171
  prompt:
    es: "Según el artículo 101.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿está obligada la Administración a ajustar la liquidación a la base declarada en la autoliquidación cuando, tras comprobarla, practica otra con base mayor y motivada?"
  options:
  - id: a
    text:
      es: "Sí, porque la Administración solo puede apartarse de los datos del obligado con su conformidad."
  - id: b
    correct: true
    text:
      es: "No, porque la Administración no está obligada a ajustar las liquidaciones a los datos consignados por el obligado."
  - id: c
    text:
      es: "Sí, porque la Administración debe ajustarse a los datos declarados salvo que actúe la inspección de los tributos y, en todo caso, a sus declaraciones."
  - id: d
    text:
      es: "No, aunque la Administración debe pedir antes autorización al órgano superior."
  explanation:
    es: "El artículo 101.1 dice que la Administración no está obligada a ajustar las liquidaciones a los datos consignados por el obligado en autoliquidaciones, declaraciones u otros documentos. No necesita su conformidad, no hay excepción limitada a la inspección y no requiere autorización de un órgano superior."
  citation: "art. 101.1 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "datos del obligado"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0172
  prompt:
    es: "De acuerdo con el artículo 101.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las clases de liquidaciones tributarias:"
  options:
  - id: a
    text:
      es: "Las liquidaciones tributarias serán ordinarias o extraordinarias."
  - id: b
    text:
      es: "Las liquidaciones tributarias serán parciales o totales."
  - id: c
    correct: true
    text:
      es: "Las liquidaciones tributarias serán provisionales o definitivas."
  - id: d
    text:
      es: "Las liquidaciones tributarias serán firmes o recurribles."
  explanation:
    es: "El artículo 101.2 distingue liquidaciones provisionales y definitivas. Las clases ordinarias y extraordinarias, parciales y totales o firmes y recurribles no figuran en la ley."
  citation: "art. 101.2 LGT"
  difficulty: 1
  tags:
  - "liquidación"
  - "clases"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0174
  prompt:
    es: "De acuerdo con el artículo 101.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, además de las practicadas en el procedimiento inspector previa comprobación completa, tienen la consideración de definitivas:"
  options:
  - id: a
    text:
      es: "las que dicte el órgano competente tras el trámite de alegaciones del obligado."
  - id: b
    text:
      es: "las que no sean recurridas por el obligado en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "las demás a las que la normativa tributaria otorgue tal carácter."
  - id: d
    text:
      es: "las que se notifiquen dentro del plazo máximo de resolución del procedimiento."
  explanation:
    es: "La letra b) del artículo 101.3 remite a la normativa tributaria: son definitivas las demás a las que esta atribuya tal carácter. Haber alegado, no recurrir o notificar a tiempo no convierte una liquidación en definitiva."
  citation: "art. 101.3 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "definitivas"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0175
  prompt:
    es: "Conforme al artículo 101.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el carácter de las liquidaciones tributarias distintas de las definitivas del apartado 3:"
  options:
  - id: a
    text:
      es: "En los demás casos, las liquidaciones tributarias tendrán el carácter de definitivas si no se recurren."
  - id: b
    text:
      es: "En los demás casos, las liquidaciones tributarias tendrán el carácter de definitivas salvo que se dicten en gestión."
  - id: c
    text:
      es: "En los demás casos, las liquidaciones tributarias no tendrán carácter provisional ni definitivo."
  - id: d
    correct: true
    text:
      es: "En los demás casos, las liquidaciones tributarias tendrán el carácter de provisionales."
  explanation:
    es: "Todo lo que no sea definitivo conforme al apartado 3 es provisional (art. 101.4). La falta de recurso no las hace definitivas, la excepción de los procedimientos de gestión no existe y no hay una tercera categoría."
  citation: "art. 101.4 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "provisionales"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0176
  prompt:
    es: "Según el artículo 101.4.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, podrán dictarse liquidaciones provisionales en el procedimiento de inspección cuando alguno de los elementos de la obligación tributaria se determine en función de los de otras obligaciones que:"
  options:
  - id: a
    text:
      es: "hubieran prescrito o hubieran sido regularizadas mediante liquidación definitiva firme."
  - id: b
    text:
      es: "hubieran sido comprobadas por el mismo órgano en un procedimiento anterior ya concluido."
  - id: c
    correct: true
    text:
      es: "no hubieran sido comprobadas o hubieran sido regularizadas mediante liquidación provisional o definitiva que no fuera firme."
  - id: d
    text:
      es: "no hubieran sido declaradas por el obligado tributario en el plazo reglamentario."
  explanation:
    es: "El supuesto de la letra a) es que el elemento dependa de otras obligaciones no comprobadas o regularizadas mediante liquidación provisional o definitiva no firme. Una liquidación firme, una obligación ya comprobada o la falta de declaración no son el caso."
  citation: "art. 101.4 LGT"
  difficulty: 1
  tags:
  - "liquidación"
  - "provisionales"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0177
  prompt:
    es: "De acuerdo con el artículo 101.4.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, se entiende que procede formular distintas propuestas de liquidación en relación con una misma obligación tributaria cuando:"
  options:
  - id: a
    text:
      es: "el acuerdo del artículo 155 incluya todos los elementos de la obligación tributaria y el obligado preste su conformidad."
  - id: b
    text:
      es: "la conformidad del obligado se refiera a toda la propuesta de regularización."
  - id: c
    text:
      es: "se realice una comprobación de valor y sea el objeto único de la regularización."
  - id: d
    correct: true
    text:
      es: "el acuerdo del artículo 155 no incluya todos los elementos de la obligación tributaria."
  explanation:
    es: "Se entiende que concurre cuando el acuerdo del artículo 155 no incluye todos los elementos de la obligación. Si los incluye, o si la conformidad cubre toda la propuesta, o si la comprobación de valor es el objeto único de la regularización, no hay varias propuestas."
  citation: "art. 101.4 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "provisionales"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0179
  prompt:
    es: "La inspección de los tributos comprueba e investiga todos los elementos de la obligación tributaria de una empresa en un ejercicio y practica la liquidación, sin que concurra ninguno de los supuestos del artículo 101.4. Según el artículo 101.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué carácter tiene?"
  options:
  - id: a
    text:
      es: "Provisional, porque toda liquidación de la inspección es provisional hasta que transcurra la prescripción."
  - id: b
    text:
      es: "Provisional, porque solo se consideran definitivas las que el obligado acepte expresamente."
  - id: c
    correct: true
    text:
      es: "Definitiva, porque se practica en el procedimiento inspector previa comprobación e investigación de la totalidad de los elementos."
  - id: d
    text:
      es: "Definitiva, aunque quedaran elementos sin comprobar por depender de otras obligaciones."
  explanation:
    es: "Comprobados e investigados todos los elementos y sin supuesto de liquidación provisional, la liquidación inspectora es definitiva (art. 101.3.a). No es provisional por defecto, no depende de la aceptación del obligado y quedar elementos pendientes por depender de otras obligaciones sí la haría provisional."
  citation: "art. 101.3 LGT"
  difficulty: 1
  tags:
  - "liquidación"
  - "definitivas"
# anchor: boe-a-2003-23186-art-101
- id: m03-l05-q0180
  prompt:
    es: "Conforme al artículo 101.4.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las liquidaciones dictadas al amparo del artículo 250.2 de esa ley:"
  options:
  - id: a
    text:
      es: "Tendrán carácter definitivo si se dictan en el procedimiento inspector."
  - id: b
    text:
      es: "Tendrán carácter definitivo una vez notificadas al obligado tributario."
  - id: c
    text:
      es: "Tendrán carácter provisional solo si el obligado no las recurre."
  - id: d
    correct: true
    text:
      es: "Tendrán en todo caso el carácter de provisionales."
  explanation:
    es: "La letra c) del artículo 101.4 declara provisionales, en todo caso, las liquidaciones dictadas al amparo del artículo 250.2. Ni el procedimiento inspector ni la notificación las hacen definitivas, y su carácter no depende de que se recurran."
  citation: "art. 101.4 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "provisionales"
# anchor: boe-a-2003-23186-art-102
- id: m03-l05-q0181
  prompt:
    es: "¿Cuál de los siguientes elementos debe expresar la notificación de una liquidación tributaria según el artículo 102.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El nombre y apellidos del funcionario que haya practicado las actuaciones de comprobación."
  - id: b
    text:
      es: "La relación de los bienes del obligado que puedan ser objeto de embargo en caso de impago."
  - id: c
    correct: true
    text:
      es: "Los medios de impugnación que puedan ser ejercidos, el órgano ante el que presentarlos y el plazo para su interposición."
  - id: d
    text:
      es: "El plazo de prescripción del derecho de la Administración a exigir el pago de la deuda."
  explanation:
    es: "La letra d) del artículo 102.2 exige indicar los medios de impugnación, el órgano y el plazo. El funcionario actuante, los bienes embargables y el plazo de prescripción no figuran entre las menciones."
  citation: "art. 102.2 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "notificación"
# anchor: boe-a-2003-23186-art-102
- id: m03-l05-q0183
  prompt:
    es: "Según el artículo 102.2.e) de la Ley 58/2003, de 17 de diciembre, General Tributaria, las liquidaciones se notifican con expresión del lugar, plazo y forma en que:"
  options:
  - id: a
    correct: true
    text:
      es: "debe ser satisfecha la deuda tributaria."
  - id: b
    text:
      es: "debe presentarse la autoliquidación complementaria."
  - id: c
    text:
      es: "deben formularse las alegaciones por el obligado."
  - id: d
    text:
      es: "deben ejecutarse los embargos en caso de impago."
  explanation:
    es: "La letra e) exige indicar el lugar, plazo y forma de pago de la deuda. No se refiere a autoliquidaciones complementarias, a alegaciones ni a embargos."
  citation: "art. 102.2 LGT"
  difficulty: 1
  tags:
  - "liquidación"
  - "notificación"
# anchor: boe-a-2003-23186-art-102
- id: m03-l05-q0184
  prompt:
    es: "Un ayuntamiento notifica a un contribuyente la liquidación correspondiente al alta en el padrón de un tributo de cobro periódico por recibo. Según el artículo 102.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo pueden notificarse después las sucesivas liquidaciones?"
  options:
  - id: a
    text:
      es: "Individualmente cada año, mediante notificación personal al contribuyente."
  - id: b
    text:
      es: "Mediante anuncio en el «Boletín Oficial del Estado» sin advertencia previa."
  - id: c
    text:
      es: "Mediante comparecencia obligatoria en la sede de la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Colectivamente, mediante edictos que así lo adviertan."
  explanation:
    es: "En los tributos de cobro periódico por recibo, notificada la liquidación del alta, las sucesivas pueden notificarse colectivamente por edictos que así lo adviertan (art. 102.3). No hace falta notificación personal anual, el anuncio debe advertirlo y la comparecencia obligatoria no es el sistema."
  citation: "art. 102.3 LGT"
  difficulty: 2
  tags:
  - "liquidación"
  - "notificación colectiva"
# anchor: boe-a-2003-23186-art-102
- id: m03-l05-q0185
  prompt:
    es: "Conforme al artículo 102.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, reglamentariamente podrán establecerse los supuestos en los que no será preceptiva la notificación expresa de la liquidación, siempre que:"
  options:
  - id: a
    text:
      es: "el obligado tributario lo solicite expresamente y lo justifique por escrito."
  - id: b
    text:
      es: "la liquidación se publique en el «Boletín Oficial del Estado» con carácter general y sin advertencia."
  - id: c
    text:
      es: "el importe de la liquidación no supere la cuantía que fije la normativa."
  - id: d
    correct: true
    text:
      es: "la Administración así lo advierta por escrito al obligado tributario o a su representante."
  explanation:
    es: "La condición es que la Administración advierta por escrito al obligado o a su representante. No depende de la solicitud del obligado, de una publicación general ni de un importe máximo."
  citation: "art. 102.4 LGT"
  difficulty: 1
  tags:
  - "liquidación"
  - "notificación"
