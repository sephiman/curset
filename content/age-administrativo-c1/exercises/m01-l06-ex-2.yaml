# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q029
  prompt:
    es: "El pleno del Foro de Gobierno Abierto alcanzó el acuerdo final sobre el IV Plan de Gobierno Abierto de España 2020-2024 en la sesión celebrada:"
  options:
  - id: a
    text:
      es: "El 26 de febrero de 2020."
  - id: b
    text:
      es: "El 28 de septiembre de 2020."
  - id: c
    text:
      es: "El 16 de octubre de 2020."
  - id: d
    correct: true
    text:
      es: "El 29 de octubre de 2020."
  explanation:
    es: "El acuerdo final del pleno del Foro se produjo «en la sesión celebrada el 29 de octubre de 2020». El 26 de febrero de 2020 la Comisión Permanente del Foro decidió que el Plan durara cuatro años. Entre el 28 de septiembre y el 16 de octubre de 2020 el borrador estuvo en consulta pública."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 1
  tags:
  - "fecha"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q030
  prompt:
    es: "¿Cuántos compromisos contiene el IV Plan de Gobierno Abierto de España 2020-2024, aprobado el 29 de octubre de 2020?"
  options:
  - id: a
    correct: true
    text:
      es: "Un total de diez compromisos."
  - id: b
    text:
      es: "Un total de doce compromisos."
  - id: c
    text:
      es: "Un total de veinte compromisos."
  - id: d
    text:
      es: "Un total de cincuenta y tres compromisos."
  explanation:
    es: "El IV Plan «contiene diez compromisos». Veinte eran los compromisos del III Plan. Cincuenta y tres es el número de iniciativas autonómicas y locales del quinto eje, no de compromisos. El Plan no menciona doce."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q031
  prompt:
    es: "Según el IV Plan de Gobierno Abierto de España 2020-2024, sus diez compromisos se distribuyen:"
  options:
  - id: a
    text:
      es: "En cuatro ejes temáticos, sin un bloque propio para las iniciativas autonómicas y locales."
  - id: b
    correct: true
    text:
      es: "En cinco ejes: cuatro temáticos y un quinto con las iniciativas autonómicas y locales."
  - id: c
    text:
      es: "En diez ejes, uno por cada compromiso del Plan."
  - id: d
    text:
      es: "En dos ejes transversales: los Objetivos de Desarrollo Sostenible y la inclusión social."
  explanation:
    es: "El IV Plan agrupa los nueve primeros compromisos en cuatro grandes ejes y añade un quinto bloque, el eje 5, con las iniciativas de las Comunidades y Ciudades Autónomas y de la FEMP. No hay un eje por compromiso. Los dos ejes transversales del Plan acompañan a los ejes; no son donde se reparten los compromisos."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 1
  tags:
  - "estructura"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q032
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los cuatro primeros ejes del IV Plan de Gobierno Abierto de España 2020-2024?"
  options:
  - id: a
    correct: true
    text:
      es: "Transparencia y rendición de cuentas; participación; integridad; sensibilización y formación."
  - id: b
    text:
      es: "Transparencia; integridad; rendición de cuentas; participación de las partes interesadas."
  - id: c
    text:
      es: "Participación y espacio cívico; transparencia y acceso a la información; integridad; administración abierta."
  - id: d
    text:
      es: "Colaboración; participación; transparencia y rendición de cuentas; formación y sensibilización social."
  explanation:
    es: "Los cuatro primeros ejes del IV Plan son transparencia y rendición de cuentas, participación, integridad, y sensibilización y formación. Una opción son los cuatro principios de la Recomendación de la OCDE. Otra toma nombres de compromisos del V Plan. Otra incluye la colaboración, que no es eje del IV Plan."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 3
  tags:
  - "estructura"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q033
  prompt:
    es: "¿Cuál de los siguientes contenidos reúne el quinto eje del IV Plan de Gobierno Abierto de España 2020-2024?"
  options:
  - id: a
    text:
      es: "Los compromisos de educación y comunicación sobre Gobierno Abierto."
  - id: b
    text:
      es: "Los compromisos de integridad y de protección de denunciantes."
  - id: c
    correct: true
    text:
      es: "Las iniciativas de las Comunidades y Ciudades Autónomas y de la FEMP."
  - id: d
    text:
      es: "Los compromisos de reforma del marco regulatorio."
  explanation:
    es: "El eje 5 reúne las iniciativas de las Comunidades y Ciudades Autónomas y de la Federación Española de Municipios y Provincias, en el compromiso diez. La educación y la comunicación son compromisos del eje de sensibilización y formación. La integridad y la protección de denunciantes forman el eje de integridad. La reforma del marco regulatorio está en el eje de transparencia y rendición de cuentas."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 2
  tags:
  - "estructura"
# anchor: fuente-transparencia-v-plan-html
- id: m01-l06-q034
  prompt:
    es: "¿En qué fecha aprobó el pleno del Foro de Gobierno Abierto el V Plan de Gobierno Abierto de España 2025-2029?"
  options:
  - id: a
    text:
      es: "El 29 de octubre de 2020."
  - id: b
    text:
      es: "El 9 de febrero de 2024."
  - id: c
    text:
      es: "El 17 de junio de 2025."
  - id: d
    correct: true
    text:
      es: "El 6 de octubre de 2025."
  explanation:
    es: "El pleno del Foro aprobó el V Plan en su reunión del 6 de octubre de 2025. El 9 de febrero de 2024 la Comisión Sectorial y el Foro aprobaron el Documento Marco y la Hoja de Ruta. El 17 de junio de 2025 terminó la información pública del borrador. El 29 de octubre de 2020 se aprobó el IV Plan."
  citation: "fuente: `transparencia-v-plan.html`"
  difficulty: 1
  tags:
  - "fecha"
# anchor: fuente-transparencia-v-plan-html
- id: m01-l06-q035
  prompt:
    es: "¿Qué órgano aprobó el V Plan de Gobierno Abierto de España 2025-2029 en su reunión del 6 de octubre de 2025?"
  options:
  - id: a
    correct: true
    text:
      es: "El pleno del Foro de Gobierno Abierto."
  - id: b
    text:
      es: "La Comisión Sectorial de Gobierno Abierto."
  - id: c
    text:
      es: "El grupo interministerial de Gobierno Abierto."
  - id: d
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  explanation:
    es: "El V Plan «fue aprobado en la reunión del pleno del Foro de 6 de octubre de 2025». La Comisión Sectorial coordina a las Administraciones y, con el Foro, aprobó el Documento Marco del Plan, no el Plan. El grupo interministerial reúne a las unidades de los ministerios. El Consejo de Transparencia y Buen Gobierno no aprueba los planes."
  citation: "fuente: `transparencia-v-plan.html`"
  difficulty: 1
  tags:
  - "órgano"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q036
  prompt:
    es: "¿Cuántos compromisos e iniciativas contiene el V Plan de Gobierno Abierto de España 2025-2029, aprobado en octubre de 2025?"
  options:
  - id: a
    text:
      es: "Diez compromisos que agrupan 123 iniciativas."
  - id: b
    correct: true
    text:
      es: "Diez compromisos que agrupan 218 iniciativas."
  - id: c
    text:
      es: "Nueve compromisos que agrupan 218 iniciativas."
  - id: d
    text:
      es: "Diez compromisos que agrupan 424 iniciativas."
  explanation:
    es: "El V Plan «contiene 10 compromisos en los que se agrupan las 218 iniciativas». 123 son solo las de la Administración General del Estado. 424 fueron las propuestas de la ciudadanía y la sociedad civil en la consulta pública. Los nueve primeros compromisos recogen las iniciativas de la AGE, pero hay un décimo."
  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q037
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la estructura del V Plan de Gobierno Abierto de España 2025-2029 es correcta?"
  options:
  - id: a
    text:
      es: "Mantiene los cinco ejes del IV Plan y añade uno de gobernanza digital."
  - id: b
    text:
      es: "Agrupa sus compromisos en cuatro ejes temáticos, como hizo el IV Plan."
  - id: c
    text:
      es: "Sustituye los compromisos por ejes, que agrupan directamente las iniciativas."
  - id: d
    correct: true
    text:
      es: "Respecto del IV Plan, suprime los ejes, que quedan integrados en los compromisos."
  explanation:
    es: "El V Plan dice: «Con respecto al IV Plan, se suprimen los ejes, que quedan integrados en los compromisos». No mantiene ni añade ejes, y lo que desaparece son los ejes, no los compromisos."
  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 1
  tags:
  - "estructura"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q038
  prompt:
    es: "¿Cuál de los siguientes repartos de las 218 iniciativas del V Plan de Gobierno Abierto de España 2025-2029 es el correcto?"
  options:
  - id: a
    text:
      es: "82 de la Administración General del Estado, 123 autonómicas y 13 locales."
  - id: b
    text:
      es: "113 de la Administración General del Estado, 82 autonómicas y 23 locales."
  - id: c
    text:
      es: "123 de la Administración General del Estado, 13 autonómicas y 82 locales."
  - id: d
    correct: true
    text:
      es: "123 de la Administración General del Estado, 82 autonómicas y 13 locales."
  explanation:
    es: "El V Plan reparte las 218 iniciativas así: 123 del ámbito central (AGE), 82 del autonómico y 13 del local, presentadas a través de la FEMP. Dos opciones intercambian cifras. La de 113 de la Administración General del Estado no corresponde a ningún dato del Plan."
  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q039
  prompt:
    es: "¿A través de qué entidad se presentaron las 13 iniciativas del ámbito local que recoge el V Plan de Gobierno Abierto de España 2025-2029?"
  options:
  - id: a
    correct: true
    text:
      es: "A través de la Federación Española de Municipios y Provincias."
  - id: b
    text:
      es: "A través de la Comisión Sectorial de Gobierno Abierto."
  - id: c
    text:
      es: "A través del Foro de Gobierno Abierto y de sus vocales locales."
