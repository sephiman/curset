# anchor: boe-a-2015-10565-art-9
- id: m02-l04-q076
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, durante los dos meses previos a la eficacia jurídica de un sistema de identificación de la letra c), el órgano estatal competente por motivos de seguridad pública podrá acudir a:"
  options:
  - id: a
    text:
      es: "El dictamen del Consejo de Estado."
  - id: b
    text:
      es: "Un procedimiento sancionador de urgencia."
  - id: c
    text:
      es: "La vía administrativa de revisión de oficio."
  - id: d
    correct: true
    text:
      es: "La vía jurisdiccional."
  explanation:
    es: "En esos dos meses el órgano de seguridad pública puede acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad. La revisión de oficio, el dictamen del Consejo de Estado y el procedimiento sancionador no están previstos."
  citation: "art. 9.2.c) LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-26
- id: m02-l04-q077
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, entre los sistemas de identificación electrónica admitidos, junto a cualquier otro que las Administraciones consideren válido, figuran los sistemas de:"
  options:
  - id: a
    text:
      es: "Firma manuscrita digitalizada."
  - id: b
    text:
      es: "Código seguro de verificación."
  - id: c
    text:
      es: "Autenticación biométrica obligatoria."
  - id: d
    correct: true
    text:
      es: "Clave concertada."
  explanation:
    es: "La letra c) incluye de forma expresa los sistemas de clave concertada. La autenticación biométrica obligatoria, la firma manuscrita digitalizada y el código seguro de verificación no son sistemas de identificación de ese precepto."
  citation: "art. 26.2.c) RD 203/2021"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-10
- id: m02-l04-q078
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados podrán firmar a través de cualquier medio que permita acreditar la autenticidad de la expresión de su voluntad y consentimiento, así como:"
  options:
  - id: a
    correct: true
    text:
      es: "La integridad e inalterabilidad del documento."
  - id: b
    text:
      es: "La identidad y el domicilio de la persona firmante."
  - id: c
    text:
      es: "La confidencialidad e interoperabilidad del expediente."
  - id: d
    text:
      es: "La disponibilidad y la trazabilidad de la firma."
  explanation:
    es: "El medio de firma ha de acreditar la autenticidad de la voluntad y la integridad e inalterabilidad del documento. La confidencialidad, el domicilio y la trazabilidad no son lo que el apartado exige acreditar."
  citation: "art. 10.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-11
- id: m02-l04-q080
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas solo requerirán a los interesados el uso obligatorio de firma para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y:"
  options:
  - id: a
    correct: true
    text:
      es: "Renunciar a derechos."
  - id: b
    text:
      es: "Aportar documentos al expediente."
  - id: c
    text:
      es: "Consultar el estado de tramitación del procedimiento."
  - id: d
    text:
      es: "Formular alegaciones en el trámite de audiencia."
  explanation:
    es: "La lista cierra con renunciar a derechos. Aportar documentos, formular alegaciones y consultar el estado de tramitación no exigen firma obligatoria."
  citation: "art. 11.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-11
- id: m02-l04-q081
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas solo requerirán a los interesados el uso obligatorio de firma para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, y:"
  options:
  - id: a
    text:
      es: "Personarse en el procedimiento y designar a un representante."
  - id: b
    text:
      es: "Aportar pruebas y renunciar a los trámites de audiencia."
  - id: c
    correct: true
    text:
      es: "Desistir de acciones y renunciar a derechos."
  - id: d
    text:
      es: "Desistir de recursos y allanarse a las pretensiones de la Administración."
  explanation:
    es: "Las dos últimas letras son desistir de acciones y renunciar a derechos. Las otras combinaciones mezclan actos que la lista no recoge, como allanarse, aportar pruebas o personarse."
  citation: "art. 11.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-11
- id: m02-l04-q082
  prompt:
    es: "Un interesado quiere interponer un recurso contra una resolución administrativa que le afecta. ¿Pueden las Administraciones exigirle en ese caso el uso obligatorio de firma?"
  options:
  - id: a
    text:
      es: "No, porque los recursos se interponen siempre mediante representante habilitado."
  - id: b
    text:
      es: "No, porque basta acreditar la identidad en cualquier actuación del procedimiento."
  - id: c
    correct: true
    text:
      es: "Sí, porque interponer recursos es uno de los supuestos en que se exige firma."
  - id: d
    text:
      es: "Sí, pero solo cuando se interpone por medios electrónicos y no presencialmente."
  explanation:
    es: "Interponer recursos figura entre los casos en que las Administraciones pueden exigir firma obligatoria. La regla general de acreditar la identidad cede ante esa lista, y el precepto no distingue entre medios electrónicos y presenciales."
  citation: "art. 11.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-12
- id: m02-l04-q083
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones asistirán en el uso de medios electrónicos a los interesados no obligados que lo soliciten, especialmente en la identificación y firma electrónica, la presentación de solicitudes a través del registro electrónico general y:"
  options:
  - id: a
    text:
      es: "La inscripción en el Registro de Funcionarios Habilitados."
  - id: b
    text:
      es: "La interposición de recursos contencioso-administrativos."
  - id: c
    correct: true
    text:
      es: "La obtención de copias auténticas."
  - id: d
    text:
      es: "La obtención de certificados de autenticación de sitio web."
  explanation:
    es: "La asistencia se extiende a la identificación y firma, a la presentación por el registro electrónico general y a la obtención de copias auténticas. Los recursos contenciosos, los certificados de sitio web y la inscripción de funcionarios no figuran."
  citation: "art. 12.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: fuente-clave-que-es-html
- id: m02-l04-q084
  prompt:
    es: "Según la página «¿Qué es Cl@ve?» del portal de Cl@ve, ¿cómo se define esta herramienta de acceso electrónico a los servicios públicos?"
  options:
  - id: a
    text:
      es: "Una dirección electrónica habilitada para recibir notificaciones de las Administraciones."
  - id: b
    correct: true
    text:
      es: "Una plataforma común para la identificación, autenticación y firma electrónica."
  - id: c
    text:
      es: "Un registro de los funcionarios habilitados para firmar en nombre de los interesados."
  - id: d
    text:
      es: "Una sede electrónica desde la que se accede a todas las sedes asociadas."
  explanation:
    es: "La página describe Cl@ve como una plataforma común para la identificación, autenticación y firma electrónica. El registro de funcionarios, la dirección habilitada y la sede de acceso a las sedes asociadas son otros servicios."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l04-q085
  prompt:
    es: "Según la página «¿Qué es Cl@ve?», ¿mediante qué se identifica el ciudadano ante la Administración con Cl@ve, además de los sistemas de DNI-e y certificado electrónico?"
  options:
  - id: a
    text:
      es: "Mediante firma manuscrita escaneada y enviada por correo."
  - id: b
    correct: true
    text:
      es: "Mediante claves concertadas, esto es, usuario más contraseña."
  - id: c
    text:
      es: "Mediante tarjeta criptográfica con certificado físico en exclusiva."
  - id: d
    text:
      es: "Mediante huella dactilar tomada en la oficina de registro."
  explanation:
    es: "Cl@ve permite identificarse con claves concertadas (usuario más contraseña) y complementa el DNI-e y el certificado. La tarjeta en exclusiva, la huella en oficina y la firma manuscrita escaneada no son sus medios."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l04-q086
  prompt:
    es: "Según la página «¿Qué es Cl@ve?» del portal de Cl@ve, ¿de qué dos formas accede el ciudadano a los servicios electrónicos una vez que se ha registrado?"
  options:
  - id: a
    text:
      es: "Con Cl@ve Sede o con Cl@ve Registro."
  - id: b
    text:
      es: "Con Cl@ve Electrónica o con Cl@ve Digital."
  - id: c
    correct: true
    text:
      es: "Con Cl@ve Móvil o con Cl@ve Permanente."
  - id: d
    text:
      es: "Con Cl@ve Notificaciones o con Cl@ve Carpeta."
  explanation:
    es: "Tras registrarse se accede con Cl@ve Móvil o con Cl@ve Permanente. Las otras denominaciones no corresponden a ningún modo de acceso de esa plataforma."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-40
- id: m02-l04-q087
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, se entenderá identificada la Administración Pública respecto de la información que se publique como propia en su:"
  options:
  - id: a
    text:
      es: "Registro electrónico general."
  - id: b
    correct: true
    text:
      es: "Portal de internet."
  - id: c
    text:
      es: "Sede electrónica asociada."
  - id: d
    text:
      es: "Archivo electrónico único."
  explanation:
    es: "La Administración queda identificada por la información que publica como propia en su portal de internet. La sede asociada, el registro y el archivo son otras piezas de la administración electrónica."
  citation: "art. 40.2 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-40
- id: m02-l04-q088
  prompt:
    es: "Entre las formas de identificación de las Administraciones Públicas, ¿respecto de qué información se entiende identificada la Administración a través de su portal de internet?"
  options:
  - id: a
    correct: true
    text:
      es: "La que publique como propia en ese portal."
  - id: b
    text:
      es: "La que se haya incorporado a cualquiera de sus sedes asociadas."
  - id: c
    text:
      es: "La que conste en el Punto de Acceso General de la Administración."
  - id: d
    text:
      es: "La que publiquen en él otras Administraciones colaboradoras."
  explanation:
    es: "La identificación alcanza a la información que la Administración publica como propia en su portal. La de otras Administraciones colaboradoras, la de las sedes asociadas y la del Punto de Acceso General no son el criterio del precepto."
  citation: "art. 40.2 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
