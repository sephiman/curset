# anchor: boe-a-2003-23186-art-36
- id: m03-l04-q0309
  prompt:
    es: "¿Qué sujeto pasivo es el contribuyente, según el artículo 36.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El sujeto pasivo que, por imposición de la ley y en lugar del contribuyente, cumple la obligación tributaria principal."
  - id: b
    text:
      es: "El sujeto pasivo a quien la ley impone la obligación de ingresar cantidades a cuenta antes de que la obligación principal resulte exigible."
  - id: c
    correct: true
    text:
      es: "El sujeto pasivo que realiza el hecho imponible."
  - id: d
    text:
      es: "El sujeto pasivo que debe repercutir la cuota tributaria a otras personas o entidades."
  explanation:
    es: "El artículo 36.2 define al contribuyente como el sujeto pasivo que realiza el hecho imponible. Quien cumple la obligación en su lugar por imposición de la ley es el sustituto, quien ingresa cantidades a cuenta es el obligado a pagos fraccionados y quien repercute la cuota es el obligado a repercutir."
  citation: "art. 36.2 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-38
- id: m03-l04-q0311
  prompt:
    es: "¿Con quién coincide, salvo que la ley disponga otra cosa, la persona o entidad que debe repercutir la cuota tributaria a otras personas o entidades, según el artículo 38.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Con el destinatario de las operaciones gravadas."
  - id: b
    text:
      es: "Con la persona perceptora de las cantidades sujetas a retención."
  - id: c
    text:
      es: "Con el contribuyente que soporta finalmente la carga del tributo."
  - id: d
    correct: true
    text:
      es: "Con aquel que realiza las operaciones gravadas."
  explanation:
    es: "El artículo 38.1 identifica al obligado a repercutir, salvo disposición legal distinta, con quien realiza las operaciones gravadas. El destinatario de esas operaciones es el obligado a soportar la repercusión. El perceptor de rentas sujetas a retención soporta la retención."
  citation: "art. 38.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-38
- id: m03-l04-q0312
  prompt:
    es: "¿Con quién coincide, salvo que la ley disponga otra cosa, la persona o entidad a quien se debe repercutir la cuota tributaria, según el artículo 38.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Con aquel que realiza las operaciones gravadas."
  - id: b
    text:
      es: "Con el sujeto pasivo que ingresa la cuota en la Administración tributaria."
  - id: c
    text:
      es: "Con la persona que satisface las rentas sujetas a retención."
  - id: d
    correct: true
    text:
      es: "Con el destinatario de las operaciones gravadas."
  explanation:
    es: "El artículo 38.2 identifica al obligado a soportar la repercusión, salvo disposición legal distinta, con el destinatario de las operaciones gravadas. Quien realiza las operaciones es el obligado a repercutir. Quien ingresa la cuota es el sujeto pasivo y quien satisface rentas sujetas a retención es el retenedor."
  citation: "art. 38.2 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-40
- id: m03-l04-q0314
  prompt:
    es: "De acuerdo con el artículo 40.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la regla de transmisión de las obligaciones pendientes en los supuestos de extinción o disolución sin liquidación de sociedades se aplica también a:"
  options:
  - id: a
    text:
      es: "cualquier transmisión de elementos aislados del activo de la sociedad."
  - id: b
    correct: true
    text:
      es: "cualquier supuesto de cesión global del activo y pasivo de la sociedad."
  - id: c
    text:
      es: "la reducción del capital social acordada por la junta general."
  - id: d
    text:
      es: "la transformación de la sociedad en otra de distinta forma jurídica con liquidación."
  explanation:
    es: "El artículo 40.3 extiende la transmisión a las personas o entidades que sucedan o sean beneficiarias a cualquier supuesto de cesión global del activo y pasivo. La venta de elementos aislados, la reducción de capital y la transformación con liquidación no son cesiones globales."
  citation: "art. 40.3 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-40
- id: m03-l04-q0315
  prompt:
    es: "¿A quiénes se transmiten las obligaciones tributarias pendientes de las fundaciones disueltas, según el artículo 40.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "A los destinatarios de los bienes y derechos de las fundaciones."
  - id: b
    text:
      es: "A los patronos de la fundación, con responsabilidad personal e ilimitada."
  - id: c
    text:
      es: "Al protectorado que supervisaba la actividad de la fundación."
  - id: d
    text:
      es: "A los fundadores que aportaron la dotación inicial de la fundación."
  explanation:
    es: "El artículo 40.4 transmite las obligaciones pendientes de las fundaciones disueltas a los destinatarios de sus bienes y derechos. No se transmiten a los patronos, al protectorado ni a los fundadores por ese solo título."
  citation: "art. 40.4 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-42
- id: m03-l04-q0317
  prompt:
    es: "De acuerdo con el artículo 42.1.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las obligaciones a las que se extiende la responsabilidad solidaria de quienes suceden en la titularidad de explotaciones o actividades económicas:"
  options:
  - id: a
    text:
      es: "Se limita a las obligaciones tributarias del anterior titular que ya estuvieran liquidadas al producirse la sucesión."
  - id: b
    text:
      es: "Se extiende a las obligaciones que contraiga el nuevo titular en el ejercicio de la actividad después de la sucesión."
  - id: c
    text:
      es: "No comprende las retenciones e ingresos a cuenta que el anterior titular hubiera debido practicar."
  - id: d
    correct: true
    text:
      es: "Se extiende a las obligaciones derivadas de la falta de ingreso de las retenciones e ingresos a cuenta practicadas o que se hubieran debido practicar."
  explanation:
    es: "El artículo 42.1.c) responsabiliza de las obligaciones contraídas por el anterior titular y derivadas de la actividad, y las extiende a la falta de ingreso de retenciones e ingresos a cuenta practicadas o que se debieron practicar. No se limita a las liquidadas, no cubre las obligaciones del nuevo titular posteriores a la sucesión y sí comprende las retenciones."
  citation: "art. 42.1 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0324
  prompt:
    es: "De acuerdo con el artículo 43.1.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los integrantes de la administración concursal y los liquidadores responden de las obligaciones tributarias devengadas con anterioridad a la situación concursal o de liquidación cuando:"
  options:
  - id: a
    text:
      es: "no hubiesen comunicado la situación concursal a la Administración tributaria."
  - id: b
    text:
      es: "hubiesen cobrado sus honorarios antes de pagar esas obligaciones tributarias."
  - id: c
    correct: true
    text:
      es: "no hubiesen realizado las gestiones necesarias para su íntegro cumplimiento."
  - id: d
    text:
      es: "hubiesen sido nombrados después de vencer el plazo voluntario de pago."
  explanation:
    es: "Para las obligaciones anteriores a la situación concursal o de liquidación, el artículo 43.1.c) exige que los integrantes de la administración concursal y los liquidadores no hayan realizado las gestiones necesarias para su íntegro cumplimiento. La falta de comunicación, el cobro de honorarios y la fecha de nombramiento no son los criterios del precepto."
  citation: "art. 43.1 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-45
- id: m03-l04-q0331
  prompt:
    es: "Según el artículo 45.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quién se considera representante de una entidad sin personalidad jurídica del artículo 35.4 si no se ha designado representante ni hay quien aparentemente ejerza la gestión o dirección?"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquiera de sus miembros o partícipes."
  - id: b
    text:
      es: "El miembro o partícipe de mayor edad."
  - id: c
    text:
      es: "El miembro o partícipe con mayor cuota de participación."
  - id: d
    text:
      es: "La persona que designe la Administración tributaria."
  explanation:
    es: "El artículo 45.3 acude, en defecto de quien aparentemente ejerza la gestión o dirección, a cualquiera de los miembros o partícipes de la entidad. No fija un criterio de edad ni de cuota, ni atribuye la designación a la Administración."
  citation: "art. 45.3 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0334
  prompt:
    es: "De acuerdo con el artículo 111.2.e) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, a efectos del artículo 46.2 de la Ley General Tributaria se entiende otorgada la representación cuando conste en un documento emitido por medios electrónicos, informáticos o telemáticos:"
  options:
  - id: a
    text:
      es: "con firma manuscrita escaneada del representado y del representante."
  - id: b
    text:
      es: "con la sola indicación del número de identificación fiscal del representante."
  - id: c
    text:
      es: "con el visto bueno del Registro Mercantil del domicilio del representado."
  - id: d
    correct: true
    text:
      es: "con las garantías y requisitos que establezca la Administración tributaria."
  explanation:
    es: "La letra e) del artículo 111.2 admite el documento electrónico, informático o telemático que reúna las garantías y requisitos que establezca la Administración tributaria. No basta una firma escaneada, el número de identificación fiscal del representante ni el visto bueno del Registro Mercantil."
  citation: "art. 111.2 RGAT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-47
- id: m03-l04-q0337
  prompt:
    es: "De acuerdo con el artículo 47 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios que no residan en España y deban designar un representante comunican esa designación a la Administración tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "en los términos que la normativa señale."
  - id: b
    text:
      es: "dentro del mes siguiente a la designación."
  - id: c
    text:
      es: "en el momento de presentar la primera declaración tributaria."
  - id: d
    text:
      es: "a través de un notario con residencia en España."
  explanation:
    es: "El artículo 47 remite a la normativa para los términos en que debe comunicarse la designación. No fija un plazo de un mes, ni el momento de la primera declaración, ni la intervención de un notario."
  citation: "art. 47 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0346
  prompt:
    es: "Calzados Prieto, S.L. realizó un ingreso indebido el jueves 12 de octubre de 2023, cuando ya había terminado el plazo de presentación de la autoliquidación, el 30 de junio de 2023. Según el artículo 67.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día comienza a contarse el plazo de prescripción del derecho a solicitar su devolución?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el 13 de octubre de 2023, día siguiente a aquel en que se realizó el ingreso indebido."
  - id: b
    text:
      es: "Desde el 1 de julio de 2023, día siguiente a la finalización del plazo para presentar la autoliquidación."
  - id: c
    text:
      es: "Desde el 12 de octubre de 2023, el mismo día en que se realizó el ingreso indebido."
  - id: d
    text:
      es: "Desde el 1 de enero de 2024, primer día del año siguiente al del ingreso indebido."
  explanation:
    es: "Si el ingreso indebido se realiza fuera del plazo de la autoliquidación, el artículo 67.1.c) cuenta desde el día siguiente a aquel en que se realizó, aquí el 13 de octubre de 2023. El día siguiente a la finalización del plazo de presentación solo vale cuando el ingreso se hizo dentro de ese plazo. El mismo día del ingreso no cuenta y el año siguiente no figura en el artículo."
  citation: "art. 67.1 LGT"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0353
  prompt:
    es: "Vicente Mora realizó un ingreso indebido el 16 de marzo de 2020, fuera del plazo de presentación de la autoliquidación. El 20 de diciembre de 2023 presentó un escrito solicitando la rectificación de su autoliquidación y la devolución. Sin más actuaciones, y según el artículo 68.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿ha prescrito el 10 de abril de 2024 su derecho a solicitar la devolución?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la solicitud es una actuación fehaciente que interrumpió el plazo el 20 de diciembre de 2023 y el cómputo se inició de nuevo."
  - id: b
    text:
      es: "Sí, porque desde el 17 de marzo de 2020 han pasado más de cuatro años."
  - id: c
    text:
      es: "Sí, porque solo interrumpe el plazo la resolución de la Administración y no la solicitud del obligado."
  - id: d
    text:
      es: "No, porque el derecho a solicitar devoluciones de ingresos indebidos no prescribe."
  explanation:
    es: "El artículo 68.3 interrumpe el plazo del derecho a solicitar devoluciones por cualquier actuación fehaciente del obligado que pretenda la devolución o la rectificación de su autoliquidación. La solicitud del 20 de diciembre de 2023 se presentó antes de cumplirse los cuatro años desde el 17 de marzo de 2020 y reinició el cómputo. La solicitud del obligado sí interrumpe y el derecho sí prescribe, a los cuatro años, según el artículo 66."
  citation: "art. 68.3 LGT"
  difficulty: 3
  tags:
  - "cómputo"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0354
  prompt:
    es: "De acuerdo con el artículo 68.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo del derecho a obtener las devoluciones se interrumpe, entre otras causas, por cualquier actuación fehaciente del obligado tributario por la que:"
  options:
  - id: a
    text:
      es: "pretenda la rectificación de su autoliquidación."
  - id: b
    text:
      es: "solicite por primera vez la devolución de un ingreso indebido."
  - id: c
    text:
      es: "renuncie a la devolución de la cuota soportada."
  - id: d
    correct: true
    text:
      es: "exija el pago de la devolución o el reembolso."
  explanation:
    es: "El plazo del derecho a obtener las devoluciones, que es el del artículo 66.d), se interrumpe por la actuación del obligado que exige el pago de la devolución o del reembolso. Pretender la rectificación y solicitar la devolución son actuaciones que interrumpen el plazo del derecho a solicitarlas, el del artículo 66.c), y renunciar a la devolución no figura entre las causas."
  citation: "art. 68.4 LGT"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0356
  prompt:
    es: "De acuerdo con el artículo 68.1.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho a determinar la deuda se interrumpe por la recepción de la comunicación de un órgano jurisdiccional en la que se ordene:"
  options:
  - id: a
    text:
      es: "la suspensión de la ejecución del acto impugnado."
  - id: b
    text:
      es: "la remisión del expediente al Ministerio Fiscal."
  - id: c
    correct: true
    text:
      es: "la paralización del procedimiento administrativo en curso."
  - id: d
    text:
      es: "la devolución de las actuaciones a la Administración tributaria."
  explanation:
    es: "El artículo 68.1.b) lista como causa de interrupción la comunicación judicial que ordena la paralización del procedimiento administrativo en curso. La suspensión de la ejecución del acto, la remisión del expediente al Ministerio Fiscal y la devolución de las actuaciones no son esa causa."
  citation: "art. 68.1 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0357
  prompt:
    es: "De acuerdo con el artículo 68.1.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo del derecho a determinar la deuda se interrumpe por cualquier acción de la Administración, con conocimiento formal del obligado, conducente al reconocimiento, regularización, comprobación, inspección, aseguramiento y:"
  options:
  - id: a
    text:
      es: "recaudación de todos o parte de los elementos de la obligación tributaria que proceda."
  - id: b
    correct: true
    text:
      es: "liquidación de todos o parte de los elementos de la obligación tributaria que proceda."
  - id: c
    text:
      es: "sanción de todas o parte de las infracciones cometidas en la obligación tributaria."
  - id: d
    text:
      es: "devolución de todos o parte de los ingresos realizados por la obligación tributaria."
  explanation:
    es: "La lista del artículo 68.1.a) termina en la liquidación de todos o parte de los elementos de la obligación tributaria. La recaudación es la acción que interrumpe el plazo para exigir el pago, en el artículo 68.2, y la sanción y la devolución no figuran en esta letra."
  citation: "art. 68.1 LGT"
  difficulty: 3
  tags:
  - "requisito"
