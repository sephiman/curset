# anchor: boe-a-2024-15944-art-17
- id: m01-l07-q134
  prompt:
    es: "Conforme al artículo 17.1.f) del Real Decreto 615/2024, de 2 de julio, la vocalía de la Comisión que propone el Ministerio para la Transformación Digital y de la Función Pública es de un representante de la:"
  options:
  - id: a
    correct: true
    text:
      es: "Secretaría de Estado de Función Pública."
  - id: b
    text:
      es: "Secretaría de Estado de Presupuestos y Gastos."
  - id: c
    text:
      es: "Secretaría General de Administración Digital."
  - id: d
    text:
      es: "Subsecretaría del Ministerio para la Transformación Digital y de la Función Pública."
  explanation:
    es: "El Estatuto atribuye esa vocalía a un representante de la Secretaría de Estado de Función Pública. La Secretaría de Estado de Presupuestos y Gastos, la Secretaría General de Administración Digital y la Subsecretaría del propio Ministerio son otras unidades que el Estatuto no menciona para esa vocalía."
  citation: "art. 17.1.f) Estatuto RD 615/2024"
  difficulty: 3
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q135
  prompt:
    es: "¿Cuál de los siguientes NO forma parte de la Comisión de Transparencia y Buen Gobierno, según el artículo 36.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Un representante del Consejo de Estado."
  - id: b
    text:
      es: "Un Senador."
  - id: c
    text:
      es: "Un representante del Defensor del Pueblo."
  - id: d
    text:
      es: "Un representante de la Autoridad Independiente de Responsabilidad Fiscal."
  explanation:
    es: "La Comisión incluye al Presidente, un Diputado, un Senador y representantes del Tribunal de Cuentas, del Defensor del Pueblo, de la Agencia Española de Protección de Datos, de la Secretaría de Estado de Administraciones Públicas y de la Autoridad Independiente de Responsabilidad Fiscal. Entre ellos no hay un representante del Consejo de Estado."
  citation: "art. 36.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q136
  prompt:
    es: "De acuerdo con el artículo 37.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Presidente del Consejo de Transparencia y Buen Gobierno será nombrado entre:"
  options:
  - id: a
    text:
      es: "Funcionarios del subgrupo A1 con diez años de antigüedad."
  - id: b
    text:
      es: "Miembros de la Comisión de Transparencia y Buen Gobierno con más de cinco años de mandato."
  - id: c
    correct: true
    text:
      es: "Personas de reconocido prestigio y competencia profesional."
  - id: d
    text:
      es: "Altos cargos con rango de Director General."
  explanation:
    es: "El artículo 37.1 exige personas de reconocido prestigio y competencia profesional. No se limita a funcionarios del subgrupo A1 con una antigüedad determinada, a miembros de la Comisión ni a altos cargos con rango de Director General."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q138
  prompt:
    es: "¿Cuál de las siguientes es causa de separación del Presidente del Consejo de Transparencia y Buen Gobierno acordada por el Gobierno, conforme al artículo 37.2 de la Ley 19/2013, de 9 de diciembre?"
  options:
  - id: a
    text:
      es: "La pérdida de confianza del Gobierno que lo propuso."
  - id: b
    text:
      es: "La falta de refrendo posterior del Senado."
  - id: c
    text:
      es: "El cambio de la mayoría parlamentaria."
  - id: d
    correct: true
    text:
      es: "La condena por delito doloso."
  explanation:
    es: "El artículo 37.2 prevé la separación por incumplimiento grave de sus obligaciones, incapacidad permanente, incompatibilidad sobrevenida o condena por delito doloso. La pérdida de confianza del Gobierno, la falta de refrendo del Senado, que no interviene en el nombramiento, y el cambio de mayoría parlamentaria no son causas de separación."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2024-15944-art-12
- id: m01-l07-q140
  prompt:
    es: "De acuerdo con el artículo 12.1 del Real Decreto 615/2024, de 2 de julio, la Presidencia del Consejo tiene la consideración de alto cargo, con rango de:"
  options:
  - id: a
    correct: true
    text:
      es: "Subsecretario."
  - id: b
    text:
      es: "Secretario de Estado."
  - id: c
    text:
      es: "Director General."
  - id: d
    text:
      es: "Subdirector General."
  explanation:
    es: "La Presidencia del Consejo tiene la consideración de alto cargo con rango de Subsecretario. El de Secretario de Estado es superior, y los de Director General y Subdirector General, inferiores."
  citation: "art. 12.1 Estatuto RD 615/2024"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2024-15944-art-12
- id: m01-l07-q141
  prompt:
    es: "Según el Real Decreto 615/2024, de 2 de julio, por el que se aprueba el Estatuto del Consejo de Transparencia y Buen Gobierno, A.A.I., la Presidencia del Consejo se desempeñará:"
  options:
  - id: a
    text:
      es: "Con dedicación parcial, compatible con la actividad privada."
  - id: b
    text:
      es: "Con dedicación preferente, sin régimen de incompatibilidades."
  - id: c
    text:
      es: "En régimen de servicios especiales, sin retribución."
  - id: d
    correct: true
    text:
      es: "Con dedicación exclusiva."
  explanation:
    es: "La Presidencia se desempeña con dedicación exclusiva y sujeta al régimen de incompatibilidades de los altos cargos de la Administración General del Estado. La dedicación parcial o preferente y la falta de incompatibilidades son lo contrario, y el Presidente percibe retribuciones."
  citation: "art. 12.2 Estatuto RD 615/2024"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-38
- id: m01-l07-q143
  prompt:
    es: "De acuerdo con el artículo 38.1 de la Ley 19/2013, de 9 de diciembre, la memoria anual en la que el Consejo de Transparencia y Buen Gobierno evalúa el grado de aplicación de la Ley se presenta ante:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros."
  - id: b
    text:
      es: "El Defensor del Pueblo."
  - id: c
    text:
      es: "El Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "Las Cortes Generales."
  explanation:
    es: "La memoria anual sobre el grado de aplicación de la Ley se presenta ante las Cortes Generales. No se presenta ante el Consejo de Ministros, ni ante el Defensor del Pueblo, a quien el Presidente comunica otras resoluciones, ni ante el Tribunal de Cuentas."
  citation: "art. 38.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-art-38
- id: m01-l07-q144
  prompt:
    es: "Según el artículo 38.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, entre las funciones que corresponden al Presidente del Consejo de Transparencia y Buen Gobierno está:"
  options:
  - id: a
    text:
      es: "Aprobar el Estatuto del Consejo."
  - id: b
    correct: true
    text:
      es: "Aprobar el anteproyecto de presupuesto."
  - id: c
    text:
      es: "Nombrar a los miembros de la Comisión."
  - id: d
    text:
      es: "Imponer las sanciones a los altos cargos."
  explanation:
    es: "Al Presidente le corresponde aprobar el anteproyecto de presupuesto. El Estatuto lo aprueba el Consejo de Ministros mediante Real Decreto, los miembros de la Comisión los nombra el Gobierno y las sanciones a los altos cargos las impone el Consejo de Ministros o el ministro competente, no el Presidente."
  citation: "art. 38.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2013-12887-art-38
- id: m01-l07-q145
  prompt:
    es: "De acuerdo con el artículo 38.2.e) de la Ley 19/2013, de 9 de diciembre, si el órgano competente decide no incoar el procedimiento sancionador cuyo inicio ha instado el Presidente del Consejo, deberá:"
  options:
  - id: a
    text:
      es: "Remitir el expediente al Tribunal de Cuentas."
  - id: b
    text:
      es: "Comunicarlo al Defensor del Pueblo."
  - id: c
    correct: true
    text:
      es: "Motivar su decisión."
  - id: d
    text:
      es: "Solicitar la autorización de la Comisión de Transparencia y Buen Gobierno."
  explanation:
    es: "El Presidente puede instar el inicio del procedimiento sancionador y el órgano competente debe motivar, en su caso, su decisión de no incoarlo. No debe remitir el expediente al Tribunal de Cuentas, comunicarlo al Defensor del Pueblo ni pedir autorización a la Comisión."
  citation: "art. 38.2.e) Ley 19/2013"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2013-12887-art-38
- id: m01-l07-q146
  prompt:
    es: "Según el artículo 38.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿de qué conoce el Presidente del Consejo de Transparencia y Buen Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Las reclamaciones que se presenten en aplicación del artículo 24."
  - id: b
    text:
      es: "Los recursos contra las resoluciones del Tribunal de Cuentas."
  - id: c
    text:
      es: "Las solicitudes de acceso dirigidas a la Administración General del Estado."
  - id: d
    text:
      es: "Las denuncias de los ciudadanos contra altos cargos."
  explanation:
    es: "La letra c) del artículo 38.2 atribuye al Presidente conocer de las reclamaciones del artículo 24. Las solicitudes de acceso las resuelve el órgano que posea la información, y las denuncias contra altos cargos son una vía de inicio del procedimiento sancionador, que no resuelve el Consejo. Los recursos contra resoluciones del Tribunal de Cuentas no son de su competencia."
  citation: "art. 38.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2013-12887-art-40
- id: m01-l07-q147
  prompt:
    es: "Según el artículo 40 de la Ley 19/2013, de 9 de diciembre, el Presidente del Consejo de Transparencia y Buen Gobierno comparecerá, para dar cuenta de la memoria anual y cuantas veces sea requerido, ante:"
  options:
  - id: a
    text:
      es: "El Pleno del Congreso de los Diputados y el del Senado, de forma conjunta."
  - id: b
    text:
      es: "La Comisión de Transparencia y Buen Gobierno."
  - id: c
    correct: true
    text:
      es: "La Comisión correspondiente de las Cortes Generales."
  - id: d
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "El artículo 40 dice que el Presidente comparecerá ante la Comisión correspondiente para dar cuenta de la memoria, así como cuantas veces sea requerido. No ante el Pleno del Congreso, ni ante la Comisión del propio Consejo, ni ante el Consejo de Ministros."
  citation: "art. 40 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q148
  prompt:
    es: "De acuerdo con el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para los intereses:"
  options:
  - id: a
    correct: true
    text:
      es: "Económicos y comerciales."
  - id: b
    text:
      es: "Patrimoniales del solicitante."
  - id: c
    text:
      es: "Políticos de los partidos con representación parlamentaria."
  - id: d
    text:
      es: "Sociales de los colectivos afectados."
  explanation:
    es: "El artículo 14.1.h) habla de los intereses económicos y comerciales. Los intereses patrimoniales del solicitante, los políticos de los partidos y los sociales de los colectivos afectados no figuran en la lista de límites."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q149
  prompt:
    es: "Según el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para las relaciones:"
  options:
  - id: a
    text:
      es: "Laborales."
  - id: b
    text:
      es: "Institucionales con las Cortes Generales."
  - id: c
    text:
      es: "Con los medios de comunicación."
  - id: d
    correct: true
    text:
      es: "Exteriores."
  explanation:
    es: "El artículo 14.1.c) menciona las relaciones exteriores. Las laborales, las institucionales con las Cortes Generales y las que se mantienen con los medios de comunicación no figuran entre los límites."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
