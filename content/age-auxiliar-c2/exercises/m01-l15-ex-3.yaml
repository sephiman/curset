# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q132
  prompt:
    es: "Según el artículo 73.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la aprobación del gasto inicia el procedimiento de ejecución del gasto y:"
  options:
  - id: a
    text:
      es: "vincula a la Hacienda Pública frente a terceros desde ese momento."
  - id: b
    text:
      es: "declara la existencia de un crédito exigible contra la Hacienda Pública."
  - id: c
    correct: true
    text:
      es: "no implica relaciones con terceros ajenos a la Hacienda Pública estatal."
  - id: d
    text:
      es: "exige acreditar documentalmente la prestación realizada por el acreedor."
  explanation:
    es: "La aprobación inicia la ejecución sin implicar relaciones con terceros ajenos a la Hacienda Pública estatal ni a la Seguridad Social. El crédito exigible nace con el reconocimiento de la obligación, la vinculación frente a terceros con el compromiso, y la acreditación de la prestación se exige para reconocer la obligación."
  citation: "art. 73.2 LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q133
  prompt:
    es: "Según el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué efecto tiene el compromiso de gasto?"
  options:
  - id: a
    correct: true
    text:
      es: "Vincula a la Hacienda Pública estatal a realizar el gasto en la cuantía y condiciones establecidas."
  - id: b
    text:
      es: "Reserva parte de un crédito presupuestario, sin relevancia jurídica para terceros."
  - id: c
    text:
      es: "Declara exigible el crédito del acreedor y comporta la propuesta de pago."
  - id: d
    text:
      es: "No vincula a la Hacienda Pública estatal frente a terceros hasta que se reconozca la obligación correspondiente."
  explanation:
    es: "El compromiso es un acto con relevancia jurídica para con terceros que vincula a la Hacienda Pública estatal en la cuantía y condiciones establecidas. La opción que le niega efectos frente a terceros y la que lo reduce a una reserva de crédito describen la aprobación, y la que declara exigible el crédito describe el reconocimiento de la obligación."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q134
  prompt:
    es: "Según el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el compromiso acuerda la realización de gastos previamente aprobados por un importe:"
  options:
  - id: a
    text:
      es: "cierto o aproximado, reservando parte de un crédito presupuestario."
  - id: b
    text:
      es: "máximo, que fija en cada caso el Consejo de Ministros."
  - id: c
    text:
      es: "indeterminado hasta que se reciba la prestación."
  - id: d
    correct: true
    text:
      es: "determinado o determinable, con relevancia jurídica para terceros."
  explanation:
    es: "El compromiso de gasto se refiere a gastos ya aprobados por un importe determinado o determinable. La cuantía cierta o aproximada es la de la aprobación; el Consejo de Ministros y la recepción de la prestación no fijan el importe del compromiso."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q137
  prompt:
    es: "Según el artículo 140.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde el control externo del sector público estatal:"
  options:
  - id: a
    correct: true
    text:
      es: "al Tribunal de Cuentas, en los términos que fijan la Constitución y su ley orgánica."
  - id: b
    text:
      es: "al Defensor del Pueblo, en los términos de su ley orgánica."
  - id: c
    text:
      es: "a la Intervención General de la Administración del Estado, en los términos de esta ley."
  - id: d
    text:
      es: "al Consejo de Estado, en los términos de su ley orgánica."
  explanation:
    es: "El control externo del sector público estatal es del Tribunal de Cuentas. La IGAE ejerce el control interno, y el Consejo de Estado y el Defensor del Pueblo no tienen esa función según el artículo 140.1."
  citation: "art. 140 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q138
  prompt:
    es: "Según el artículo 140.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién ejerce el control interno de la gestión económica y financiera del sector público estatal?"
  options:
  - id: a
    text:
      es: "La Dirección General del Tesoro y Política Financiera."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El Tribunal de Cuentas, por delegación de las Cortes Generales."
  explanation:
    es: "El control interno lo ejerce la IGAE en los términos de la ley. El Tribunal de Cuentas ejerce el control externo, y las direcciones generales del Tesoro y de Presupuestos no tienen esa función de control."
  citation: "art. 140 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q139
  prompt:
    es: "Según el artículo 140.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado ejerce el control interno con plena autonomía respecto de:"
  options:
  - id: a
    text:
      es: "las Comunidades Autónomas y las entidades locales."
  - id: b
    text:
      es: "los órganos jurisdiccionales y el Ministerio Fiscal."
  - id: c
    correct: true
    text:
      es: "las autoridades y demás entidades cuya gestión controle."
  - id: d
    text:
      es: "las Cortes Generales y el Tribunal de Cuentas."
  explanation:
    es: "La autonomía de la IGAE se predica respecto de las autoridades y entidades cuya gestión controla. Las Cortes, el Tribunal de Cuentas, los órganos judiciales, las Comunidades Autónomas y las entidades locales no son el término de esa autonomía."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q140
  prompt:
    es: "Sobre el control del sector público estatal, el artículo 140 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria establece que:"
  options:
  - id: a
    text:
      es: "el control externo corresponde a la Intervención General y el control interno al Tribunal de Cuentas."
  - id: b
    text:
      es: "ambos controles corresponden al Tribunal de Cuentas, que delega el interno en la Intervención General."
  - id: c
    correct: true
    text:
      es: "el control externo corresponde al Tribunal de Cuentas y el control interno a la Intervención General."
  - id: d
    text:
      es: "ambos controles, externo e interno, corresponden a la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 140 reparte los controles: el externo es del Tribunal de Cuentas y el interno de la IGAE. Las demás opciones invierten el reparto, concentran ambos controles en la IGAE o inventan una delegación del Tribunal de Cuentas."
  citation: "art. 140 LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q141
  prompt:
    es: "Según el artículo 140.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Tribunal de Cuentas ejerce el control externo del sector público estatal en los términos establecidos en:"
  options:
  - id: a
    text:
      es: "la Constitución y esta ley, con exclusión de su ley orgánica."
  - id: b
    text:
      es: "las normas de auditoría que apruebe el Consejo de Ministros."
  - id: c
    text:
      es: "su ley orgánica y las instrucciones que dicte la Intervención General."
  - id: d
    correct: true
    text:
      es: "la Constitución, su ley orgánica y las demás leyes que regulen su competencia."
  explanation:
    es: "El artículo 140.1 remite a la Constitución, a la ley orgánica del Tribunal y a las demás leyes que regulen su competencia. Las instrucciones de la IGAE y las normas del Consejo de Ministros no son fuente de esa competencia."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-140
- id: m01-l15-q155
  prompt:
    es: "Según el artículo 140 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado ejerce el control interno de la gestión económica y financiera del sector público estatal:"
  options:
  - id: a
    text:
      es: "Bajo la dirección del Tribunal de Cuentas en materia de fiscalización del gasto público."
  - id: b
    text:
      es: "Con sujeción a las instrucciones del titular del departamento controlado."
  - id: c
    text:
      es: "Con autonomía limitada a las entidades de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "Con plena autonomía respecto de las autoridades y entidades cuya gestión controle."
  explanation:
    es: "El artículo 140.2 le da plena autonomía respecto de las autoridades y entidades cuya gestión controla. Depender del Tribunal de Cuentas o recibir instrucciones del titular del departamento controlado anularía esa autonomía. Y la autonomía no se limita a la Seguridad Social."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q166
  prompt:
    es: "Para que el Instituto reconozca la obligación a favor de Publicidad Meridiana, S.A., por un gasto ya aprobado y comprometido, la ley exige previamente:"
  options:
  - id: a
    correct: true
    text:
      es: "La acreditación documental ante el órgano competente de la realización de la prestación."
  - id: b
    text:
      es: "La ordenación del pago por el Director General del Tesoro y Política Financiera."
  - id: c
    text:
      es: "El pago material de la factura, que solo se reconoce una vez abonada."
  - id: d
    text:
      es: "El informe favorable del Tribunal de Cuentas sobre el gasto aprobado y comprometido."
  explanation:
    es: "El reconocimiento de obligaciones se produce previa acreditación documental ante el órgano competente de la realización de la prestación o del derecho del acreedor (art. 73.4 LGP). La ordenación del pago es una fase posterior. El pago material cierra la secuencia. El Tribunal de Cuentas ejerce un control externo y no interviene en el reconocimiento."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q167
  prompt:
    es: "Una vez que la empresa del trabajo de campo entrega el informe final y la factura, ¿qué debe acreditarse documentalmente ante el órgano competente del CIS para reconocer la obligación?"
  options:
  - id: a
    text:
      es: "La orden de pago expedida a favor de la empresa por el Ordenador de pagos."
  - id: b
    text:
      es: "El informe favorable de la Intervención General sobre la propuesta de pago de la factura."
  - id: c
    text:
      es: "Los fondos disponibles en la tesorería del CIS para atender el pago en el ejercicio."
  - id: d
    correct: true
    text:
      es: "La realización de la prestación por la empresa, conforme a los acuerdos que aprobaron y comprometieron el gasto."
  explanation:
    es: "El reconocimiento de la obligación exige la acreditación documental previa, ante el órgano competente, de la realización de la prestación o del derecho del acreedor, conforme a los acuerdos que aprobaron y comprometieron el gasto (art. 73.4 LGP). La opción de la orden de pago describe la fase siguiente, la ordenación del pago, que es posterior al reconocimiento. La del informe de la Intervención General confunde el reconocimiento con el control. La de los fondos en tesorería se refiere al pago material, no al reconocimiento."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-36
- id: m01-l15-q181
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los ministerios y los demás órganos del Estado con dotaciones diferenciadas remiten al Ministerio de Hacienda sus propuestas de presupuesto, ajustadas a:"
  options:
  - id: a
    text:
      es: "Los plazos que fije cada Comisión de Análisis de Programas."
  - id: b
    text:
      es: "Las cuantías que aprobaron las Cortes Generales el ejercicio anterior."
  - id: c
    text:
      es: "Los objetivos que cada centro gestor haya fijado libremente."
  - id: d
    correct: true
    text:
      es: "Los límites que las directrices hayan establecido."
  explanation:
    es: "Las propuestas se ajustan a los límites que fijan las directrices que determina el Ministro de Hacienda. El artículo no ata las propuestas a plazos de las Comisiones de Análisis de Programas, ni a las cuantías aprobadas el ejercicio anterior, ni a objetivos que cada centro gestor fije libremente."
  citation: "art. 36.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: m01-l15-q182
  prompt:
    es: "Señale con qué carácter pueden librarse fondos cuando, excepcionalmente, no pueda aportarse la documentación justificativa de las obligaciones, según el artículo 79.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "Con el carácter de reintegrables en el ejercicio siguiente."
  - id: b
    correct: true
    text:
      es: "Con el carácter de a justificar."
  - id: c
    text:
      es: "Con el carácter de anticipo a cuenta del acreedor."
  - id: d
    text:
      es: "Con el carácter de pago extrapresupuestario."
  explanation:
    es: "El artículo 79.1 permite tramitar pagos presupuestarios y librar fondos con el carácter de a justificar. No se habla de fondos reintegrables en el ejercicio siguiente ni de anticipos a cuenta del acreedor, y se trata de pagos presupuestarios, no de pagos extrapresupuestarios."
  citation: "art. 79.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-149
- id: m01-l15-q183
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los sujetos cuyos actos controla la función interventora, según el artículo 149.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración General del Estado, sus organismos autónomos y las entidades gestoras y servicios comunes de la Seguridad Social."
  - id: b
    text:
      es: "La Administración General del Estado, sus organismos autónomos y las entidades públicas empresariales."
  - id: c
    text:
      es: "La Administración General del Estado, las sociedades mercantiles estatales y las entidades gestoras de la Seguridad Social."
  - id: d
    text:
      es: "Los organismos autónomos, las agencias estatales y los servicios comunes de la Seguridad Social."
  explanation:
    es: "El artículo 149.1 somete a la función interventora los actos de la Administración General del Estado, sus organismos autónomos y las entidades gestoras y servicios comunes de la Seguridad Social. Las entidades públicas empresariales, las sociedades mercantiles estatales y las agencias estatales no figuran en ese ámbito."
  citation: "art. 149.1 LGP"
  difficulty: 3
  tags:
  - "lista"
  - "organo"
# anchor: boe-a-2003-21614-art-149
- id: m01-l15-q184
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la función interventora se ejerce, respecto de los actos de la Administración General del Estado y de sus organismos autónomos, por:"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas y sus delegados territoriales."
  - id: b
    text:
      es: "El Ordenador general de pagos del Estado y sus delegados."
  - id: c
    text:
      es: "La Dirección General de Presupuestos y los centros gestores."
  - id: d
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado y sus interventores delegados."
  explanation:
    es: "La función interventora la ejerce la Intervención General de la Administración del Estado junto con sus interventores delegados. El Tribunal de Cuentas ejerce el control externo, el Ordenador general de pagos del Estado recibe las peticiones de pago de los Ministros y la Dirección General de Presupuestos y los centros gestores intervienen en la elaboración y gestión del presupuesto, no en su control interno."
  citation: "art. 149.1 LGP"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q187
  prompt:
    es: "Señale cuál de las siguientes denominaciones corresponde a una fase de la gestión del presupuesto de gastos del Estado, según el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "La ordenación del gasto."
  - id: b
    correct: true
    text:
      es: "La ordenación del pago."
  - id: c
    text:
      es: "La liquidación de la obligación."
  - id: d
    text:
      es: "La retención del crédito."
  explanation:
    es: "El artículo 73.1 recoge la ordenación del pago como cuarta fase, tras el reconocimiento de la obligación. La ley no tiene una fase de ordenación del gasto, ni de liquidación de la obligación, ni de retención del crédito: sus cinco fases son la aprobación, el compromiso, el reconocimiento, la ordenación del pago y el pago material."
  citation: "art. 73.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "lista"
