# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q207
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones con el ratón abre el panel de widgets desde la barra de tareas?"
  options:
  - id: a
    text:
      es: "Mantener el puntero sobre el icono de Vista de tareas"
  - id: b
    text:
      es: "Hacer clic con el botón derecho en el reloj de la barra de tareas"
  - id: c
    text:
      es: "Seleccionar la esquina más alejada de la barra de tareas"
  - id: d
    correct: true
    text:
      es: "Mantener el puntero sobre el botón Widgets o seleccionarlo"
  explanation:
    es: "La página dice que el panel de widgets se abre manteniendo el ratón sobre el botón Widgets de la barra de tareas o seleccionándolo. El puntero sobre Vista de tareas sirve para crear un nuevo escritorio, el clic derecho en el reloj ofrece Ajustar fecha y hora, y la esquina más alejada muestra el escritorio."
  citation: "fuente: `ms-win-barra-tareas.html`; «Widgets»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q208
  prompt:
    es: "En Windows 11, ¿qué son los widgets de la barra de tareas, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Iconos que representan las aplicaciones en segundo plano y las herramientas del sistema"
  - id: b
    text:
      es: "Botones para cambiar con rapidez el volumen, el brillo y la red Wi-Fi del dispositivo"
  - id: c
    correct: true
    text:
      es: "Elementos interactivos con contenido dinámico y acceso rápido a aplicaciones y características"
  - id: d
    text:
      es: "Alertas sobre correos entrantes, actualizaciones y otras actividades del sistema"
  explanation:
    es: "La página define los widgets como elementos interactivos que muestran contenido dinámico y dan acceso rápido a aplicaciones y características. Los iconos de aplicaciones en segundo plano son de la bandeja del sistema, los ajustes de volumen, brillo y Wi-Fi son de la Configuración rápida y las alertas de correos y actualizaciones son del centro de notificaciones."
  citation: "fuente: `ms-win-barra-tareas.html`; «Widgets»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q209
  prompt:
    es: "En Windows 11, ¿dónde se cambia el interruptor que muestra u oculta el botón de widgets en la barra de tareas?"
  options:
  - id: a
    text:
      es: "En Configuración › Sistema › Notificaciones, en cada aplicación"
  - id: b
    text:
      es: "En Configuración › Sistema › Multitarea, en la sección Escritorios"
  - id: c
    correct: true
    text:
      es: "En Configuración de la barra de tareas, en los elementos de la barra de tareas"
  - id: d
    text:
      es: "En Configuración › Cuentas › Opciones de inicio de sesión, en Windows Hello"
  explanation:
    es: "La página indica que se hace clic con el botón derecho en la barra de tareas, se selecciona Configuración de la barra de tareas y, en los elementos de la barra de tareas, se cambia el interruptor de los widgets. Las otras rutas sirven, respectivamente, para configurar las notificaciones, la presencia de las ventanas en los escritorios y el inicio de sesión."
  citation: "fuente: `ms-win-barra-tareas.html`; «Widgets»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q210
  prompt:
    es: "Según la página de Microsoft sobre la barra de tareas de Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la Configuración rápida?"
  options:
  - id: a
    text:
      es: "Windows+W"
  - id: b
    correct: true
    text:
      es: "Windows+A"
  - id: c
    text:
      es: "Windows+N"
  - id: d
    text:
      es: "Windows+P"
  explanation:
    es: "La página de la barra de tareas dice que, para abrir la Configuración rápida, se presiona la tecla Windows y A. Windows+W abre los widgets, Windows+N abre el centro de notificaciones y Windows+P abre la configuración del proyecto para elegir un modo de presentación."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q211
  prompt:
    es: "¿Cuál de los siguientes grupos de iconos forma el área Configuración rápida de la barra de tareas de Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Red, volumen y batería"
  - id: b
    text:
      es: "Reloj, campana de notificación y calendario"
  - id: c
    text:
      es: "Widgets, Inicio, Buscar y Vista de tareas"
  - id: d
    text:
      es: "Menú del lápiz, teclado táctil y panel táctil virtual"
  explanation:
    es: "La página dice que el área Configuración rápida consta del icono de red, el de volumen y el de batería. El reloj y la campana pertenecen al área de calendario y notificación, Widgets, Inicio, Buscar y Vista de tareas son componentes de la barra y el menú del lápiz, el teclado táctil y el panel táctil virtual son iconos de la bandeja del sistema."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q212
  prompt:
    es: "En la Configuración rápida de la barra de tareas de Windows 11, ¿qué representa el icono de batería?"
  options:
  - id: a
    text:
      es: "La conexión Wi-Fi o Ethernet del dispositivo"
  - id: b
    text:
      es: "La configuración de sonido del dispositivo"
  - id: c
    text:
      es: "La actividad de la cámara y el micrófono en tiempo real"
  - id: d
    correct: true
    text:
      es: "El estado de la batería en portátiles y tabletas"
  explanation:
    es: "La página dice que el icono de batería representa el estado de la batería en portátiles y tabletas. El icono de red representa la conexión Wi-Fi o Ethernet y el de volumen la configuración de sonido. Los indicadores de cámara y micrófono son los de privacidad de la bandeja del sistema."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q213
  prompt:
    es: "¿Para qué sirve la Configuración rápida de la barra de tareas de Windows 11, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Para mostrar alertas de correos electrónicos entrantes y actualizaciones"
  - id: b
    text:
      es: "Para organizar las aplicaciones ancladas en carpetas y grupos del menú"
  - id: c
    text:
      es: "Para mostrar contenido dinámico de aplicaciones en el panel de widgets"
  - id: d
    correct: true
    text:
      es: "Para ajustar con rapidez el volumen, el brillo, la red Wi-Fi o la accesibilidad"
  explanation:
    es: "La página dice que la Configuración rápida permite acceder a la configuración de uso frecuente sin navegar por los menús, como ajustar el volumen, cambiar el brillo, cambiar de red Wi-Fi o activar las herramientas de accesibilidad. Las alertas de correos y actualizaciones son del centro de notificaciones, las carpetas de aplicaciones ancladas son del menú Inicio y el contenido dinámico pertenece a los widgets."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q214
  prompt:
    es: "Señale la afirmación correcta sobre la Configuración rápida de la barra de tareas de Windows 11:"
  options:
  - id: a
    text:
      es: "Se puede quitar de la barra de tareas con el interruptor de Configuración de la barra de tareas"
  - id: b
    text:
      es: "Solo se puede abrir seleccionando su área en la barra de tareas, sin combinación de teclas"
  - id: c
    correct: true
    text:
      es: "No se puede quitar, pero se puede personalizar moviendo y organizando sus elementos"
  - id: d
    text:
      es: "Sus elementos tienen un orden fijo que no se puede cambiar desde la barra de tareas"
  explanation:
    es: "La página dice que la Configuración rápida no se puede quitar de la barra de tareas, pero sí se puede personalizar moviendo y organizando los elementos. Además indica que se abre seleccionando su área, con Windows y A, o deslizando el dedo, por lo que la apertura no se limita al ratón."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q215
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones con el ratón abre la Configuración rápida desde la barra de tareas?"
  options:
  - id: a
    text:
      es: "Seleccionar el icono del reloj o de la campana de notificación"
  - id: b
    correct: true
    text:
      es: "Seleccionar el área de Configuración rápida de la barra de tareas"
  - id: c
    text:
      es: "Mantener el puntero sobre el botón Widgets de la barra de tareas"
  - id: d
    text:
      es: "Hacer clic con el botón derecho en un espacio vacío de la barra de tareas"
  explanation:
    es: "La página indica que la Configuración rápida se abre seleccionando su área en la barra de tareas. El reloj y la campana abren el centro de notificaciones y el calendario, el puntero sobre Widgets abre ese panel y el clic derecho en la barra ofrece Configuración de la barra de tareas."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configuración rápida»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q216
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes elementos de la barra de tareas abre el centro de notificaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "El icono del reloj o el de la campana de notificación"
  - id: b
    text:
      es: "El icono de red, el de volumen o el de batería del equipo"
  - id: c
    text:
      es: "El botón de Vista de tareas de la barra de tareas"
  - id: d
    text:
      es: "El botón de Widgets, situado en la barra de tareas"
  explanation:
    es: "La página indica que el centro de notificaciones se abre seleccionando el icono del reloj o de la campana de notificación en la barra de tareas. Los iconos de red, volumen y batería forman la Configuración rápida, Vista de tareas gestiona ventanas y escritorios, y Widgets abre el panel de widgets."
  citation: "fuente: `ms-win-notificaciones.html`; «Cómo funcionan las notificaciones»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q217
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre el centro de notificaciones y el calendario, según la tabla de métodos abreviados?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+N"
  - id: b
    text:
      es: "Windows+Mayús+V"
  - id: c
    text:
      es: "Windows+B"
  - id: d
    text:
      es: "Windows+W"
  explanation:
    es: "La página de notificaciones indica que se presiona la tecla Windows y N para abrir el centro de notificaciones. Según la tabla de métodos abreviados, Windows+Mayús+V permite desplazarse por las notificaciones, Windows+B pone el foco en el primer icono del área de notificación y Windows+W abre los widgets."
  citation: "fuente: `ms-win-notificaciones.html`; «Cómo funcionan las notificaciones»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q218
  prompt:
    es: "En Windows 11, ¿qué permiten hacer los botones de acción rápida de un banner de notificación?"
  options:
  - id: a
    text:
      es: "Cambiar el volumen y el brillo del dispositivo desde el propio banner"
  - id: b
    text:
      es: "Anclar la aplicación a la barra de tareas"
  - id: c
    text:
      es: "Borrar todas las notificaciones del centro de notificaciones"
  - id: d
    correct: true
    text:
      es: "Realizar tareas como descartar un aviso o posponer una alarma"
  explanation:
    es: "La página dice que, en las notificaciones que se muestran como banners, los botones de acción rápida sirven para tareas como descartar un aviso o posponer una alarma. El volumen y el brillo se ajustan en la Configuración rápida, el anclado se hace con el clic derecho en la aplicación y Borrar todo es un botón del centro de notificaciones."
  citation: "fuente: `ms-win-notificaciones.html`; «Cómo funcionan las notificaciones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q219
  prompt:
    es: "En el centro de notificaciones de Windows 11, ¿cuál de las siguientes acciones realiza el botón cerrar situado junto al nombre de una aplicación?"
  options:
  - id: a
    text:
      es: "Desactiva todas las notificaciones futuras de esa aplicación"
  - id: b
    text:
      es: "Quita todas las notificaciones del centro de notificaciones"
  - id: c
    correct: true
    text:
      es: "Borra todas las notificaciones de esa aplicación"
  - id: d
    text:
      es: "Expande la notificación para mostrar más acciones"
  explanation:
    es: "La página dice que el botón cerrar junto al nombre de la aplicación borra todas las notificaciones de esa aplicación. Desactivarlas hacia el futuro exige Más › Desactivar todas las notificaciones, Borrar todo quita todas las del centro y la flecha junto a la hora expande una notificación."
  citation: "fuente: `ms-win-notificaciones.html`; «Acciones sobre las notificaciones en el centro de notificaciones»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q220
  prompt:
    es: "En el centro de notificaciones de Windows 11, ¿cuál de los siguientes botones quita a la vez todas las notificaciones que contiene?"
  options:
  - id: a
    text:
      es: "Desactivar todas las notificaciones"
  - id: b
    correct: true
    text:
      es: "Borrar todo"
  - id: c
    text:
      es: "Posponer"
  - id: d
    text:
      es: "No molestar"
  explanation:
    es: "La página dice que el botón Borrar todo quita todas las notificaciones del centro de notificaciones. Desactivar todas las notificaciones se aplica a una aplicación concreta, Posponer retrasa una alarma y No molestar silencia las notificaciones, no las borra."
  citation: "fuente: `ms-win-notificaciones.html`; «Acciones sobre las notificaciones en el centro de notificaciones»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q221
  prompt:
    es: "En Windows 11, ¿cómo se desactivan todas las notificaciones de una aplicación específica desde el centro de notificaciones?"
  options:
  - id: a
    text:
      es: "Seleccionando el botón cerrar junto al nombre de la aplicación"
  - id: b
    correct: true
    text:
      es: "Seleccionando el botón Más y, después, Desactivar todas las notificaciones"
  - id: c
    text:
      es: "Seleccionando el botón Borrar todo del centro de notificaciones"
  - id: d
    text:
      es: "Seleccionando la campana con zZ del centro de notificaciones"
  explanation:
    es: "La página indica que, para desactivar todas las notificaciones de una aplicación, se selecciona Más y después Desactivar todas las notificaciones. El botón cerrar junto al nombre solo borra las existentes, Borrar todo limpia el centro y la campana con zZ activa No molestar para todas las notificaciones."
  citation: "fuente: `ms-win-notificaciones.html`; «Acciones sobre las notificaciones en el centro de notificaciones»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q222
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas de la aplicación Configuración lleva a las opciones para activar o desactivar las notificaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Configuración › Sistema › Notificaciones"
  - id: b
    text:
      es: "Configuración › Sistema › Multitarea"
  - id: c
    text:
      es: "Configuración › Sistema › Acerca de"
  - id: d
    text:
      es: "Configuración › Cuentas › Opciones de inicio de sesión"
  explanation:
    es: "La página indica que las notificaciones se activan o desactivan en Inicio › Configuración › Sistema › Notificaciones. Multitarea contiene las opciones de ajuste de ventanas y escritorios, Acerca de muestra la edición y la versión del sistema y Opciones de inicio de sesión contiene Windows Hello."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q223
  prompt:
    es: "En la configuración de notificaciones de una aplicación en Windows 11, ¿cuál de las siguientes opciones evita que se muestren notificaciones confidenciales en la pantalla de bloqueo?"
  options:
  - id: a
    text:
      es: "Mostrar banners de notificación"
  - id: b
    text:
      es: "Mostrar notificaciones en el centro de notificaciones"
  - id: c
    text:
      es: "Mostrar la experiencia de bienvenida de Windows"
  - id: d
    correct: true
    text:
      es: "Ocultar contenido cuando las notificaciones están en la pantalla de bloqueo"
  explanation:
    es: "La página dice que Ocultar contenido cuando las notificaciones están en la pantalla de bloqueo evita que se muestren notificaciones confidenciales ahí. Mostrar banners habilita o deshabilita los banners emergentes, Mostrar notificaciones en el centro elige si aparecen en el centro y la experiencia de bienvenida muestra una pantalla con novedades y sugerencias tras las actualizaciones."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q224
  prompt:
    es: "En la configuración de notificaciones de una aplicación en Windows 11, ¿qué hace la opción Mostrar banners de notificación?"
  options:
  - id: a
    text:
      es: "Elige si las notificaciones aparecen en el centro de notificaciones"
  - id: b
    text:
      es: "Alterna el sonido de las notificaciones entrantes"
  - id: c
    correct: true
    text:
      es: "Habilita o deshabilita los banners emergentes de esa aplicación"
  - id: d
    text:
      es: "Establece la prioridad de las notificaciones de esa aplicación"
  explanation:
    es: "La página dice que Mostrar banners de notificación habilita o deshabilita los banners emergentes. Elegir si las notificaciones aparecen en el centro corresponde a Mostrar notificaciones en el centro de notificaciones, el sonido a Reproducir un sonido y la prioridad a Prioridad de las notificaciones."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q225
  prompt:
    es: "¿Cuántas aplicaciones puede haber en Windows 11 con la prioridad de notificaciones más alta, Superior?"
  options:
  - id: a
    text:
      es: "Hasta tres"
  - id: b
    text:
      es: "Una por escritorio"
  - id: c
    correct: true
    text:
      es: "Solo una aplicación"
  - id: d
    text:
      es: "Todas ellas"
  explanation:
    es: "La página dice que solo se puede establecer una aplicación como de máxima prioridad. Por tanto, hasta tres, una por escritorio o todas las aplicaciones contradicen esa limitación."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q226
  prompt:
    es: "¿Cuál de las siguientes opciones recoge los niveles de prioridad que Windows 11 permite asignar a las notificaciones de una aplicación?"
  options:
  - id: a
    text:
      es: "Superior, Alta, Media o Baja"
  - id: b
    correct: true
    text:
      es: "Superior, Alta o Normal"
  - id: c
    text:
      es: "Alta, Normal o Baja"
  - id: d
    text:
      es: "Crítica, Alta o Normal"
  explanation:
    es: "La página dice que la prioridad se establece en Superior, Alta o Normal. Las demás combinaciones cambian algún nivel por Media, Baja o Crítica, o añaden un cuarto nivel, y contradicen esa lista de tres."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q227
  prompt:
    es: "Señale la afirmación correcta sobre la prioridad de las notificaciones de las aplicaciones en Windows 11:"
  options:
  - id: a
    correct: true
    text:
      es: "Las notificaciones de prioridad alta aparecen encima de las normales en el centro de notificaciones"
  - id: b
    text:
      es: "Las notificaciones de prioridad alta aparecen debajo de las normales en el centro de notificaciones"
  - id: c
    text:
      es: "Varias aplicaciones pueden tener a la vez la prioridad Superior en el centro de notificaciones"
  - id: d
    text:
      es: "La prioridad de una aplicación se elige entre cuatro niveles distintos en la configuración"
  explanation:
    es: "La página dice que las notificaciones de prioridad alta aparecerán encima de las normales en el centro de notificaciones, que solo una aplicación puede tener la máxima prioridad y que los niveles son Superior, Alta o Normal, es decir, tres y no cuatro."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q228
  prompt:
    es: "En la configuración de notificaciones de Windows 11, ¿cuál de las siguientes opciones muestra una pantalla de bienvenida con novedades y sugerencias tras las actualizaciones?"
  options:
  - id: a
    text:
      es: "Mostrar banners de notificación"
  - id: b
    text:
      es: "Ocultar contenido cuando las notificaciones están en la pantalla de bloqueo"
  - id: c
    text:
      es: "Mostrar notificaciones en el centro de notificaciones"
  - id: d
    correct: true
    text:
      es: "Mostrar la experiencia de bienvenida de Windows"
  explanation:
    es: "La página dice que la casilla de la experiencia de bienvenida de Windows da una pantalla de bienvenida con nuevas características y sugerencias después de las actualizaciones o al iniciar sesión. Mostrar banners habilita los banners emergentes, Ocultar contenido evita notificaciones confidenciales en la pantalla de bloqueo y Mostrar notificaciones en el centro elige si aparecen en él."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q229
  prompt:
    es: "En Windows 11, ¿cómo se activa manualmente la opción No molestar desde el centro de notificaciones, tras abrirlo?"
  options:
  - id: a
    text:
      es: "Seleccionando el botón Borrar todo"
  - id: b
    text:
      es: "Seleccionando el botón Más junto a una aplicación"
  - id: c
    text:
      es: "Seleccionando la flecha junto a la hora de una notificación"
  - id: d
    correct: true
    text:
      es: "Seleccionando el icono de campana con zZ"
  explanation:
    es: "La página indica que, para activar manualmente No molestar, se abre el centro de notificaciones y se selecciona el icono de campana con zZ. Borrar todo quita las notificaciones, Más permite desactivar las de una aplicación y la flecha junto a la hora expande una notificación."
  citation: "fuente: `ms-win-notificaciones.html`; «No molestar»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q230
  prompt:
    es: "En Windows 11, con No molestar activado, siguen mostrándose en pantalla, según la ayuda de Microsoft, los banners de notificación:"
  options:
  - id: a
    text:
      es: "los de las aplicaciones con prioridad Alta o Superior"
  - id: b
    text:
      es: "solo los del correo electrónico y los mensajes"
  - id: c
    correct: true
    text:
      es: "los de alarmas, recordatorios y las aplicaciones elegidas"
  - id: d
    text:
      es: "ninguno, porque se silencian todos sin excepción"
  explanation:
    es: "La página dice que, con No molestar activado, solo se reciben banners de alarmas, recordatorios y aplicaciones elegidas, y que las demás notificaciones van directamente al centro de notificaciones. Por eso ni la prioridad Alta ni el correo se citan como excepción, y tampoco se silencian todos."
  citation: "fuente: `ms-win-notificaciones.html`; «No molestar»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m06-l02-q231
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes botones permite elegir las aplicaciones que pueden enviar notificaciones mientras No molestar está activado?"
  options:
  - id: a
    text:
      es: "Desactivar todas las notificaciones"
  - id: b
    correct: true
    text:
      es: "Agregar aplicaciones"
  - id: c
    text:
      es: "Borrar todo"
  - id: d
    text:
      es: "Mostrar banners de notificación"
  explanation:
    es: "La página dice que, en Aplicaciones, se elige qué aplicaciones pueden enviar notificaciones con No molestar activado seleccionando el botón Agregar aplicaciones. Desactivar todas las notificaciones se aplica a una aplicación, Borrar todo limpia el centro y Mostrar banners es una opción por aplicación."
  citation: "fuente: `ms-win-notificaciones.html`; «No molestar»"
  difficulty: 2
  tags:
  - "configuración"
