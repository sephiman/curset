# anchor: celex-32013r0952-art-77
- id: m03-l20-q0050
  prompt:
    es: "De acuerdo con el artículo 77, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, una deuda aduanera de importación nacerá al incluirse las mercancías no pertenecientes a la Unión sujetas a derechos de importación en el régimen de:"
  options:
  - id: a
    text:
      es: "Despacho a libre práctica o en el de importación temporal con exención total de derechos de importación."
  - id: b
    correct: true
    text:
      es: "Despacho a libre práctica, incluso con arreglo a las disposiciones del destino final, o en el de importación temporal con exención parcial de derechos."
  - id: c
    text:
      es: "Tránsito de la Unión o en el de depósito aduanero, cuando las mercancías estén sujetas a derechos de importación."
  - id: d
    text:
      es: "Perfeccionamiento pasivo o en el de exportación, cuando las mercancías estén sujetas a derechos de importación."
  explanation:
    es: "La deuda de importación nace por la inclusión en el despacho a libre práctica, incluso con arreglo a las disposiciones del destino final, o en la importación temporal con exención parcial. Con exención total no hay derechos que cobrar y el artículo no recoge ese caso. El tránsito y el depósito aduanero no figuran en la lista. Y el perfeccionamiento pasivo y la exportación son regímenes de los que nace la deuda de exportación."
  citation: "art. 77.1 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "regímenes"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0051
  prompt:
    es: "De acuerdo con el artículo 77, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el nacimiento de la deuda aduanera de importación por inclusión en un régimen:"
  options:
  - id: a
    text:
      es: "Nace también cuando se incluyen mercancías de la Unión en el régimen de exportación, aunque no estén sujetas a derechos."
  - id: b
    text:
      es: "Nace cuando se incluyen mercancías sujetas a derechos de exportación en el régimen de perfeccionamiento pasivo."
  - id: c
    correct: true
    text:
      es: "Nace cuando se incluyen mercancías no pertenecientes a la Unión sujetas a derechos de importación en la importación temporal con exención parcial."
  - id: d
    text:
      es: "Nace cuando se incluyen mercancías no pertenecientes a la Unión en una zona franca, aunque estén exentas de derechos."
  explanation:
    es: "La importación temporal con exención parcial de derechos es uno de los dos regímenes del artículo 77.1 de los que nace la deuda de importación. La exportación y el perfeccionamiento pasivo dan lugar a la deuda de exportación, regulada en el artículo 81. Y la inclusión en una zona franca no figura entre los regímenes que enumera el artículo 77.1."
  citation: "art. 77.1 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "regímenes"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0052
  prompt:
    es: "De acuerdo con el artículo 77, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera de importación se originará en el momento de:"
  options:
  - id: a
    text:
      es: "La presentación en aduana de las mercancías no pertenecientes a la Unión."
  - id: b
    text:
      es: "El levante de las mercancías por las autoridades aduaneras competentes."
  - id: c
    text:
      es: "El pago de los derechos de importación por parte del declarante."
  - id: d
    correct: true
    text:
      es: "La admisión de la declaración en aduana."
  explanation:
    es: "La deuda se origina en el momento de la admisión de la declaración en aduana. La presentación en aduana es anterior, y el levante y el pago son posteriores: ninguno fija el nacimiento de la deuda."
  citation: "art. 77.2 CAU"
  difficulty: 1
  tags:
  - "deuda de importación"
  - "momento"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0053
  prompt:
    es: "Alfa Textil, S. L., presenta el 4 de febrero de 2027 una declaración en aduana de despacho a libre práctica de mercancías no pertenecientes a la Unión sujetas a derechos de importación. Las autoridades aduaneras la admiten el 5 de febrero de 2027 y conceden el levante el 8 de febrero de 2027. Según el artículo 77, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuándo nace la deuda aduanera de importación?"
  options:
  - id: a
    text:
      es: "El 4 de febrero de 2027, al presentarse la declaración en aduana."
  - id: b
    text:
      es: "El 8 de febrero de 2027, al concederse el levante de las mercancías."
  - id: c
    text:
      es: "En la fecha en que las mercancías entraron en el territorio aduanero de la Unión, anterior al 4 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El 5 de febrero de 2027, en el momento de la admisión de la declaración en aduana."
  explanation:
    es: "La deuda se origina en la admisión de la declaración, que es el 5 de febrero de 2027. La presentación de la declaración, el 4 de febrero, no basta si todavía no se ha admitido. El levante, el 8 de febrero, es posterior a la admisión. Y la entrada de las mercancías en el territorio no es el hecho que el artículo toma como momento del nacimiento."
  citation: "art. 77.2 CAU"
  difficulty: 1
  tags:
  - "deuda de importación"
  - "momento"
  - "cómputo"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0054
  prompt:
    es: "De acuerdo con el artículo 77, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el declarante será el deudor y, en caso de representación indirecta, será también deudora:"
  options:
  - id: a
    text:
      es: "La persona que haya transportado las mercancías hasta la aduana de despacho."
  - id: b
    text:
      es: "La persona que haya vendido las mercancías al declarante para su exportación a la Unión."
  - id: c
    correct: true
    text:
      es: "La persona por cuya cuenta se haga la declaración en aduana."
  - id: d
    text:
      es: "La persona que haya almacenado las mercancías en depósito temporal antes de la declaración."
  explanation:
    es: "En la representación indirecta es también deudora la persona por cuya cuenta se hace la declaración. Ni el transportista, ni el vendedor, ni quien almacenó las mercancías en depósito temporal figuran como deudores en este artículo por esa sola condición."
  citation: "art. 77.3 CAU"
  difficulty: 1
  tags:
  - "deuda de importación"
  - "deudor"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0055
  prompt:
    es: "Gestoría Levante presenta, en su propio nombre pero por cuenta de Alfa Textil, S. L., una declaración en aduana de despacho a libre práctica de mercancías sujetas a derechos de importación. Conforme al artículo 77, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿quiénes son deudores de la deuda aduanera de importación?"
  options:
  - id: a
    text:
      es: "Solo Gestoría Levante, porque el declarante es el único deudor incluso en la representación indirecta."
  - id: b
    correct: true
    text:
      es: "Gestoría Levante, como declarante, y Alfa Textil, S. L., como persona por cuya cuenta se hace la declaración."
  - id: c
    text:
      es: "Solo Alfa Textil, S. L., porque la persona representada asume la deuda en lugar del representante."
  - id: d
    text:
      es: "Gestoría Levante y Alfa Textil, S. L., pero únicamente a partir del momento en que se conceda el levante de las mercancías."
  explanation:
    es: "El declarante es deudor y, en la representación indirecta, también lo es la persona por cuya cuenta se hace la declaración. Gestoría Levante actúa en su propio nombre, es la declarante, y Alfa Textil, S. L., es la persona por cuya cuenta actúa: ambas son deudoras. No es solo la gestoría, porque el artículo añade a la persona representada. Tampoco solo Alfa, porque el declarante sigue siendo deudor. Y la deuda no nace con el levante, sino con la admisión de la declaración."
  citation: "art. 77.3 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "deudor"
  - "representación indirecta"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0056
  prompt:
    es: "De acuerdo con el artículo 77, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la persona que suministra la información para formular la declaración en aduana:"
  options:
  - id: a
    correct: true
    text:
      es: "Es también deudor si supo o debió razonablemente haber sabido que la información era falsa y llevó a no percibir parte de los derechos exigibles."
  - id: b
    text:
      es: "Es también deudor aunque ignorase razonablemente la falsedad de la información, si con ella se dejaron de percibir derechos exigibles en el despacho."
  - id: c
    text:
      es: "Solo es deudor el declarante; quien suministró la información falsa responde únicamente de las sanciones aduaneras."
  - id: d
    text:
      es: "Es también deudor, pero solo cuando la declaración se haya presentado en representación directa y con información falsa."
  explanation:
    es: "Es también deudor quien suministró la información requerida y supo o debió razonablemente haber sabido que era falsa, cuando ello lleva a no percibir parte de los derechos. Si ignoraba razonablemente la falsedad, no se cumple el requisito. No es cierto que solo sea deudor el declarante. Y el artículo no limita esta regla a la representación directa."
  citation: "art. 77.3 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
  - "deudor"
  - "información falsa"
# anchor: celex-32013r0952-art-77
- id: m03-l20-q0057
  prompt:
    es: "Conforme al artículo 77, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿qué condición tiene quien facilita al declarante datos falsos, sabiéndolo, y así se dejan de percibir parte de los derechos?"
  options:
  - id: a
    text:
      es: "No es deudor, porque solo lo es quien presenta la declaración en aduana o la persona por cuya cuenta se presenta."
  - id: b
    text:
      es: "Es deudor únicamente si la declaración se hubiera presentado mediante representación indirecta."
  - id: c
    correct: true
    text:
      es: "Es deudor, junto con el declarante, por haber suministrado la información sabiendo que era falsa."
  - id: d
    text:
      es: "Es deudor subsidiario, y responde solo si el declarante no paga los derechos exigibles."
  explanation:
    es: "Quien suministra la información requerida sabiendo que es falsa es también deudor cuando ello lleva a no percibir parte de los derechos. No es cierto que solo lo sean el declarante y la persona por cuya cuenta se declara. La regla no depende de la representación indirecta. Y el artículo no lo configura como un deudor subsidiario: es deudor, junto con el declarante."
  citation: "art. 77.3 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "deudor"
  - "información falsa"
# anchor: celex-32013r0952-art-78
- id: m03-l20-q0058
  prompt:
    es: "Según el artículo 78, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿mediante la admisión de qué declaración nace la deuda aduanera de importación de las mercancías no originarias sujetas a prohibición de devolución o de exención?"
  options:
  - id: a
    text:
      es: "La declaración en aduana de despacho a libre práctica de los productos en cuestión."
  - id: b
    correct: true
    text:
      es: "La declaración de reexportación relativa a los productos en cuestión."
  - id: c
    text:
      es: "La declaración sumaria de entrada de las mercancías no originarias utilizadas."
  - id: d
    text:
      es: "La declaración de depósito temporal de las mercancías no originarias utilizadas."
  explanation:
    es: "En ese caso la deuda de importación nace mediante la admisión de la declaración de reexportación de los productos. No nace con la declaración de despacho a libre práctica de los productos, ni con la declaración sumaria de entrada, ni con la de depósito temporal, que son declaraciones distintas."
  citation: "art. 78.1 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
  - "mercancías no originarias"
# anchor: celex-32013r0952-art-78
- id: m03-l20-q0060
  prompt:
    es: "De acuerdo con el artículo 78, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en el caso de las mercancías no pertenecientes a la Unión mencionadas en el artículo 270, el deudor será:"
  options:
  - id: a
    correct: true
    text:
      es: "La persona que presente la declaración de reexportación y, en caso de representación indirecta, también la persona por cuya cuenta se presente."
  - id: b
    text:
      es: "El declarante de la declaración en aduana de despacho a libre práctica, y nunca la persona por cuya cuenta se presente dicha declaración en aduana."
  - id: c
    text:
      es: "La persona que haya fabricado los productos con las mercancías no originarias y la que los haya vendido al exportador."
  - id: d
    text:
      es: "La persona que presente la declaración de reexportación, sin que alcance a la persona por cuya cuenta se presente."
  explanation:
    es: "El deudor es quien presenta la declaración de reexportación y, en la representación indirecta, también la persona por cuya cuenta se presenta. No es el declarante de una declaración de despacho a libre práctica. Tampoco el fabricante o el vendedor, que no figuran. Y limitar la deuda a quien presenta la declaración omite la regla de la representación indirecta."
  citation: "art. 78.3 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
