- id: g-happens-before
  term:
    en: happens-before
  definition:
    en: If one action happens-before another, then the first is visible to and ordered before the second.
  origin: m03-l02
  citation: jls-17#jls-17.4.5
- id: g-data-race
  term:
    en: data race
  definition:
    en: When a program contains two conflicting accesses that are not ordered by a happens-before relationship, it is said to contain a data race.
  origin: m03-l02
  citation: jls-17#jls-17.4.5
- id: g-binary-semaphore
  term:
    en: binary semaphore
  definition:
    en: 'A semaphore initialized to one and used such that it only has at most one permit available, so it only has two states: one permit available, or zero permits available.'
  origin: m03-l02
  citation: javadoc-semaphore#class-semaphore
- id: g-correctly-synchronized
  term:
    en: correctly synchronized
  definition:
    en: A program is correctly synchronized if and only if all sequentially consistent executions are free of data races.
  origin: m03-l02
  citation: jls-17#jls-17.4.5
- id: g-sequential-consistency
  term:
    en: sequentially consistent
  definition:
    en: A set of actions is sequentially consistent if all actions occur in a total order that is consistent with program order, and each read of a variable sees the value written by the latest preceding write to it in that order.
  origin: m03-l02
  citation: jls-17#jls-17.4.3
