# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q294
  prompt:
    es: "Según el artículo 52.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la restricción de transferir entre créditos de distintas secciones presupuestarias no afecta a los créditos:"
  options:
  - id: a
    text:
      es: "ampliables de las entidades de la Seguridad Social."
  - id: b
    text:
      es: "de la sección 06 Deuda Pública."
  - id: c
    correct: true
    text:
      es: "del programa de contratación centralizada."
  - id: d
    text:
      es: "extraordinarios concedidos durante el ejercicio."
  explanation:
    es: "El artículo 52.1.b) prohíbe las transferencias entre créditos de distintas secciones y añade que la restricción no afecta a los créditos del programa de contratación centralizada. Los créditos ampliables de la Seguridad Social y los de la sección 06 Deuda Pública son las salvedades de la letra c), que trata de minorar créditos extraordinarios, suplementados o ampliados. Los créditos extraordinarios del ejercicio no son una salvedad: la letra c) prohíbe minorarlos."
  citation: "art. 52.1.b) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1996-2627-regla-6
- id: m05-l02-q295
  prompt:
    es: "Se va a tramitar un expediente de transferencia de 18.000 euros desde la aplicación A, con 50.000 euros de crédito disponible, a la aplicación B. ¿Qué debe hacerse con carácter previo a su tramitación?"
  options:
  - id: a
    text:
      es: "Retener 50.000 euros, todo el crédito disponible, en la aplicación A."
  - id: b
    text:
      es: "Retener 18.000 euros, el importe de la transferencia, en la aplicación B."
  - id: c
    text:
      es: "Retener 32.000 euros, el crédito que quedará disponible, en la aplicación A."
  - id: d
    correct: true
    text:
      es: "Retener 18.000 euros, el importe de la transferencia, en la aplicación A."
  explanation:
    es: "La regla 6.1 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado manda retener, antes de tramitar el expediente, «su importe», el de la transferencia, «en las aplicaciones presupuestarias que vayan a ser minoradas»: 18.000 euros en la aplicación A. No se retiene todo el crédito disponible ni el saldo que quedará, sino el importe que se transfiere. La aplicación B recibe el crédito y no se minora."
  citation: "regla 6.1 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "cantidad"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q296
  prompt:
    es: "El Ministro de Hacienda autoriza una transferencia entre créditos del capítulo 2 de programas de distintos servicios de un ministerio. Según el artículo 62.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿por qué le corresponde?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque no está reservada al Consejo de Ministros y el titular del ministerio no puede acordarla."
  - id: b
    text:
      es: "Porque toda transferencia entre servicios distintos exige informe de la Dirección General de Presupuestos."
  - id: c
    text:
      es: "Porque afecta a gastos de personal y el titular del ministerio no puede acordar esas transferencias."
  - id: d
    text:
      es: "Porque la Ley de Presupuestos reserva al Ministro de Hacienda todas las transferencias del capítulo 2."
  explanation:
    es: "El artículo 62.1.a) da al Ministro de Hacienda las transferencias no reservadas al Consejo de Ministros que, conforme al artículo 63, no puedan acordar los titulares de los ministerios, y el artículo 63.1.a) solo les deja las de un mismo programa o entre programas de un mismo servicio: esta es entre programas de servicios distintos. El artículo 62.1.a) no pide ningún informe de la Dirección General de Presupuestos. Los créditos del capítulo 2 no son de personal, que es el capítulo 1, así que ese no es el motivo. La Ley 31/2022 reserva al Ministro de Hacienda algunos créditos concretos del capítulo 2, como el 202, el 221.09 o el 225.02 (art. 9.Dos.1), no todo el capítulo."
  citation: "art. 62.1.a) LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q297
  prompt:
    es: "Según el artículo 9.Siete de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿cuál de las siguientes transferencias del capítulo 1 puede autorizar el titular de un ministerio?"
  options:
  - id: a
    text:
      es: "Entre créditos de incentivos al rendimiento de dos programas distintos del ministerio."
  - id: b
    correct: true
    text:
      es: "Entre créditos de retribuciones básicas de funcionarios de dos servicios distintos del ministerio."
  - id: c
    text:
      es: "Entre créditos de gastos sociales del personal de dos servicios distintos del ministerio."
  - id: d
    text:
      es: "Desde retribuciones básicas del capítulo 1 a gastos corrientes en bienes y servicios del capítulo 2 de otro programa."
  explanation:
    es: "El artículo 9.Siete permite al titular del ministerio autorizar las transferencias entre créditos del capítulo 1, aunque afecten a distintos servicios o programas, excluidos los créditos destinados a incentivos al rendimiento o a gastos sociales del personal. Las retribuciones básicas de funcionarios no están excluidas. Los incentivos al rendimiento y los gastos sociales del personal son las dos exclusiones del apartado. La transferencia al capítulo 2 no se hace entre créditos del capítulo 1, así que el apartado no la cubre."
  citation: "art. 9.Siete Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-61
- id: m05-l02-q298
  prompt:
    es: "Según el artículo 61.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde al Gobierno, a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados, autorizar las transferencias:"
  options:
  - id: a
    text:
      es: "entre programas de distintos servicios de un mismo ministerio, sin afectar a personal."
  - id: b
    correct: true
    text:
      es: "entre distintas secciones presupuestarias como consecuencia de reorganizaciones administrativas."
  - id: c
    text:
      es: "desde créditos para operaciones de capital a créditos para operaciones corrientes del Estado."
  - id: d
    text:
      es: "que incrementen el concepto 202 «Arrendamientos de edificios y otras construcciones»."
  explanation:
    es: "El artículo 61.a) atribuye al Gobierno las transferencias entre distintas secciones presupuestarias como consecuencia de reorganizaciones administrativas. Las transferencias entre programas de distintos servicios de un ministerio las autoriza el Ministro de Hacienda, porque el titular no puede acordarlas (arts. 62.1.a y 63.1.a). Las de capital a corrientes y las que afectan al concepto 202 son también del Ministro de Hacienda según la Ley 31/2022 (art. 9.Dos.6 y 9.Dos.1)."
  citation: "art. 61.a) LGP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q299
  prompt:
    es: "Los créditos autorizados al Estado por la Ley de Presupuestos suman 400.000 millones de euros, y este ejercicio ya se han concedido anticipos de Tesorería por 3.000 millones. ¿Cuánto pueden sumar como máximo los nuevos anticipos del ejercicio?"
  options:
  - id: a
    correct: true
    text:
      es: "1.000 millones de euros."
  - id: b
    text:
      es: "3.000 millones de euros."
  - id: c
    text:
      es: "4.000 millones de euros."
  - id: d
    text:
      es: "7.000 millones de euros."
  explanation:
    es: "El artículo 60.1 fija un límite máximo en cada ejercicio del uno por ciento de los créditos autorizados al Estado: 4.000 millones de euros. Es un límite para el ejercicio, no para cada anticipo, así que se descuentan los 3.000 millones ya concedidos: quedan 1.000 millones. La cifra de 4.000 millones es el límite entero, sin descontar lo concedido; la de 3.000 millones repite lo ya concedido, y la de 7.000 millones suma lo concedido al límite."
  citation: "art. 60.1 LGP"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q300
  prompt:
    es: "Según el artículo 60.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Gobierno puede conceder, con carácter excepcional, anticipos de Tesorería para atender:"
  options:
  - id: a
    text:
      es: "cualquier gasto del ejercicio, con el límite anual del artículo y sin más requisitos."
  - id: b
    text:
      es: "gastos discrecionales sin cobertura presupuestaria, con el límite anual del artículo."
  - id: c
    text:
      es: "gastos inaplazables, sin límite anual, cuando el Consejo de Ministros los considere urgentes."
  - id: d
    correct: true
    text:
      es: "gastos inaplazables, con el límite anual del artículo y solo en los casos que enumera."
  explanation:
    es: "El artículo 60.1 permite los anticipos de Tesorería para atender gastos inaplazables, con el límite máximo en cada ejercicio del uno por ciento de los créditos autorizados al Estado, y solo en sus dos casos: iniciada la tramitación de un crédito extraordinario o suplemento con dictamen favorable del Consejo de Estado, o promulgada una ley cuyas obligaciones exijan conceder uno. No cubre cualquier gasto ni prescinde de esos casos. Habla de gastos inaplazables, no de gastos discrecionales. Y el límite anual del uno por ciento rige siempre."
  citation: "art. 60.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q301
  prompt:
    es: "Un organismo autónomo transfiere crédito del capítulo 2 al capítulo 6 de su mismo programa, con informe favorable de la Intervención Delegada. Según el artículo 63.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién la autoriza?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, porque pasa de operaciones corrientes a operaciones de capital."
  - id: b
    correct: true
    text:
      es: "Su presidente o director, sin perjuicio de que el ministro de adscripción pueda avocarla."
  - id: c
    text:
      es: "El Consejo de Ministros, porque la transferencia afecta a créditos de dos capítulos distintos."
  - id: d
    text:
      es: "La Intervención Delegada en el organismo, a propuesta de su presidente o de su director."
  explanation:
    es: "El artículo 63.1.a) da a los ministros las transferencias entre créditos de un mismo programa, y el artículo 63.2 atribuye esas competencias a los presidentes y directores de los organismos autónomos en sus presupuestos; los ministros pueden avocarlas en todo o en parte. Pasar de corrientes a capital no lleva la transferencia al Ministro de Hacienda: la Ley 31/2022 le reserva el paso inverso, de capital a corrientes (art. 9.Dos.6). El artículo 61.a) reserva al Gobierno las transferencias entre secciones por reorganizaciones, no las de un mismo programa. La Intervención Delegada informa la transferencia, pero no la autoriza."
  citation: "art. 63.2 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2026-12037-anexo-i
- id: m05-l02-q302
  prompt:
    es: "Según el anexo I de la Orden HAC/557/2026, de 3 de junio, ¿cómo se denomina el programa 921O de la aplicación 33.101.921O.227.06 del Instituto Nacional de Administración Pública?"
  options:
  - id: a
    text:
      es: "«Dirección y Servicios Generales de Política Territorial y Memoria Democrática»."
  - id: b
    text:
      es: "«Administración General del Estado en el Territorio»."
  - id: c
    text:
      es: "«Asesoramiento y defensa de los intereses del Estado»."
  - id: d
    correct: true
    text:
      es: "«Formación del personal de las Administraciones Públicas»."
  explanation:
    es: "El anexo I recoge el programa 921O como «Formación del personal de las Administraciones Públicas». Las otras denominaciones son de programas vecinos del mismo grupo 921 «Administración General»: dirección y servicios generales de política territorial y memoria democrática es el 921M, la Administración General del Estado en el Territorio es el 921P y el asesoramiento y defensa de los intereses del Estado es el 921S."
  citation: "anexo I Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q303
  prompt:
    es: "Conforme al artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones de capital se distinguirán:"
  options:
  - id: a
    text:
      es: "las inversiones reales y los activos financieros."
  - id: b
    correct: true
    text:
      es: "las inversiones reales y las transferencias de capital."
  - id: c
    text:
      es: "los gastos financieros y las transferencias de capital."
  - id: d
    text:
      es: "las transferencias de capital y los pasivos financieros."
  explanation:
    es: "Las operaciones de capital comprenden las inversiones reales y las transferencias de capital, los capítulos 6 y 7. Los activos y los pasivos financieros son las operaciones financieras, y los gastos financieros son operaciones corrientes."
  citation: "art. 40.1.c) LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q304
  prompt:
    es: "Según el artículo 56.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, un suplemento de crédito de un organismo autónomo puede financiarse con la parte no aplicada del remanente de tesorería al fin del ejercicio anterior o con:"
  options:
  - id: a
    text:
      es: "los ingresos del último trimestre del ejercicio anterior no aplicados."
  - id: b
    text:
      es: "operaciones de endeudamiento formalizadas por el organismo en el ejercicio."
  - id: c
    correct: true
    text:
      es: "mayores ingresos de los que el organismo obtenga sobre los previstos inicialmente."
  - id: d
    text:
      es: "remanentes de crédito del ejercicio anterior que no se hayan incorporado."
  explanation:
    es: "El artículo 56.2 LGP dice que la financiación de los créditos extraordinarios o suplementarios «únicamente podrá realizarse» con cargo a la parte del remanente de tesorería no aplicada «o con mayores ingresos sobre los previstos inicialmente». Ese «únicamente» deja fuera cualquier otra fuente: los ingresos del último trimestre del ejercicio anterior no aplicados, las operaciones de endeudamiento del organismo y los remanentes de crédito no incorporados no son ninguna de las dos fuentes del apartado."
  citation: "art. 56.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q305
  prompt:
    es: "Según el artículo 62.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la autorización de una incorporación de remanentes de crédito al presupuesto de un ministerio corresponde:"
  options:
  - id: a
    correct: true
    text:
      es: "al Ministro de Hacienda, como las demás incorporaciones del artículo 58."
  - id: b
    text:
      es: "al Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: c
    text:
      es: "al titular del ministerio, previo informe de la Intervención Delegada."
  - id: d
    text:
      es: "al Ministro de Economía, Comercio y Empresa, a propuesta del ministerio."
  explanation:
    es: "El artículo 62.1.c) atribuye al Ministro de Hacienda las incorporaciones de remanentes reguladas en el artículo 58. El Consejo de Ministros autoriza otras modificaciones (arts. 55.3 y 61), no las incorporaciones. El titular del ministerio, con informe de la Intervención Delegada, autoriza transferencias y generaciones del artículo 63.1, no incorporaciones. El Ministro de Economía interviene en los anticipos de Tesorería, como proponente (art. 60.1), y no autoriza modificaciones de crédito."
  citation: "art. 62.1.c) LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q306
  prompt:
    es: "Según el artículo 58 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las incorporaciones de crédito en el presupuesto de los organismos autónomos únicamente podrán realizarse con cargo a la parte del remanente de tesorería:"
  options:
  - id: a
    text:
      es: "que al fin del ejercicio anterior ya haya sido aplicada al presupuesto del organismo."
  - id: b
    text:
      es: "que al fin del ejercicio en curso no vaya a aplicarse al presupuesto del organismo."
  - id: c
    text:
      es: "que al fin del ejercicio anterior no haya sido aplicada al presupuesto del Estado."
  - id: d
    correct: true
    text:
      es: "que al fin del ejercicio anterior no haya sido aplicada al presupuesto del organismo."
  explanation:
    es: "El artículo 58 limita la financiación de las incorporaciones en los organismos autónomos a la parte del remanente de tesorería que al fin del ejercicio anterior no haya sido aplicada al presupuesto del organismo. El remanente ya aplicado no está disponible para financiar nada nuevo. El remanente se mide al fin del ejercicio anterior, no del ejercicio en curso. Y la parte que cuenta es la no aplicada al presupuesto del propio organismo, no al del Estado, que financia sus incorporaciones con baja en el Fondo de Contingencia o en otros créditos no financieros."
  citation: "art. 58 LGP"
  difficulty: 2
  tags:
  - "requisito"
