# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q145
  prompt:
    es: "De acuerdo con el artículo 72.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos representan al Gobierno de la Nación en el territorio de la respectiva Comunidad Autónoma?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Delegados del Gobierno."
  - id: b
    text:
      es: "Los Subdelegados del Gobierno."
  - id: c
    text:
      es: "Los Directores Insulares."
  - id: d
    text:
      es: "Los Secretarios Generales de las Delegaciones."
  explanation:
    es: "Los Delegados del Gobierno representan al Gobierno de la Nación en el territorio de la Comunidad Autónoma según el artículo 72.1. Los Subdelegados actúan en las provincias, y los Directores Insulares y los Secretarios Generales son órganos de apoyo o de gestión, no representantes del Gobierno."
  citation: "art. 72.1 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q146
  prompt:
    es: "¿Cuál de las siguientes opciones recoge lo que dirigen y supervisan los Delegados del Gobierno, según el artículo 72.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La Administración propia de cada Comunidad Autónoma."
  - id: b
    correct: true
    text:
      es: "La Administración General del Estado en el territorio de la Comunidad Autónoma."
  - id: c
    text:
      es: "La Administración de las Entidades locales radicadas en la Comunidad."
  - id: d
    text:
      es: "Únicamente los servicios territoriales no integrados en la Delegación."
  explanation:
    es: "El artículo 72.2 les encomienda dirigir y supervisar la Administración General del Estado en el territorio de la Comunidad. La Administración autonómica y la local no están bajo su dirección: solo las coordinan. Tampoco se limita a los servicios no integrados."
  citation: "art. 72.2 LRJSP"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-72
