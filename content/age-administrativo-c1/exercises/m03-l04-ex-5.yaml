# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q125
  prompt:
    es: "¿En cuál de los siguientes procedimientos el anuncio de licitación de un contrato de la Administración General del Estado se publica únicamente en el perfil de contratante?"
  options:
  - id: a
    correct: true
    text:
      es: "En el procedimiento abierto simplificado."
  - id: b
    text:
      es: "En el procedimiento abierto no armonizado."
  - id: c
    text:
      es: "En el procedimiento restringido no armonizado."
  - id: d
    text:
      es: "En la licitación con negociación."
  explanation:
    es: "El artículo 159.2 dice que en el abierto simplificado «el anuncio de licitación del contrato únicamente precisará de publicación en el perfil de contratante del órgano de contratación». En el abierto, el restringido y la licitación con negociación rige el artículo 135.1: en la Administración General del Estado el anuncio se publica además en el «Boletín Oficial del Estado»."
  citation: "art. 159.2 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q126
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el plazo de proposiciones del procedimiento abierto simplificado es correcta, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "En obras es como mínimo de treinta y cinco días; en los demás contratos, no inferior a quince días."
  - id: b
    correct: true
    text:
      es: "En obras es como mínimo de veinte días; en los demás contratos, no inferior a quince días."
  - id: c
    text:
      es: "Es como mínimo de quince días en todos los contratos, incluidos los de obras."
  - id: d
    text:
      es: "En obras es como mínimo de veinte días; en los demás contratos, no inferior a diez días hábiles."
  explanation:
    es: "El artículo 159.3 dice que el plazo «no podrá ser inferior a quince días» desde el siguiente a la publicación en el perfil de contratante, y que «en los contratos de obras el plazo será como mínimo de veinte días». Los treinta y cinco días son el plazo del abierto sujeto a regulación armonizada. Las obras no siguen la regla de los quince días. Los diez días hábiles son el plazo de la tramitación del artículo 159.6, no del simplificado general."
  citation: "art. 159.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q128
  prompt:
    es: "Un organismo autónomo publica en su perfil de contratante, el lunes 2 de febrero de 2026, un procedimiento abierto simplificado de obras con el plazo mínimo legal. ¿Cuál es el último día para presentar proposiciones?"
  options:
  - id: a
    text:
      es: "El martes 17 de febrero de 2026."
  - id: b
    text:
      es: "El viernes 20 de febrero de 2026."
  - id: c
    text:
      es: "El domingo 22 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 23 de febrero de 2026."
  explanation:
    es: "En obras, el plazo del abierto simplificado es como mínimo de veinte días desde el siguiente a la publicación (artículo 159.3), y son días naturales (disposición adicional duodécima). El cómputo empieza el martes 3 de febrero y el vigésimo día es el domingo 22 de febrero. Como el último día es inhábil, el plazo se prorroga al primer día hábil siguiente, el lunes 23 de febrero. El domingo 22 omite esa prórroga. El viernes 20 adelanta el fin al último día hábil anterior, cuando la regla lo lleva al siguiente. El martes 17 aplica los quince días de suministros y servicios."
  citation: "art. 159.3 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q129
  prompt:
    es: "De acuerdo con el artículo 159.4.f) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el abierto simplificado, la empresa con la mejor puntuación debe constituir la garantía definitiva:"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de siete días hábiles a contar desde el envío de la comunicación."
  - id: b
    text:
      es: "En diez días hábiles a contar desde el siguiente al requerimiento."
  - id: c
    text:
      es: "En quince días hábiles desde la notificación de la adjudicación."
  - id: d
    text:
      es: "En diez días naturales a contar desde el envío de la comunicación."
  explanation:
    es: "El artículo 159.4.f) manda requerir a la empresa con la mejor puntuación, mediante comunicación electrónica, para que constituya la garantía definitiva «en el plazo de siete días hábiles a contar desde el envío de la comunicación». Los diez días hábiles desde el siguiente al requerimiento son el plazo general del artículo 150.2, que el simplificado acorta. Los quince días hábiles desde la notificación de la adjudicación son la espera para formalizar del artículo 153.3. Los diez días naturales no figuran en el artículo."
  citation: "art. 159.4.f) LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q131
  prompt:
    es: "Según el artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué contratos de suministros y servicios de valor estimado inferior a 60.000 euros quedan excluidos de la tramitación de ese apartado?"
  options:
  - id: a
    text:
      es: "Los que sean compras corrientes de bienes disponibles en el mercado."
  - id: b
    text:
      es: "Los que se valoren solo mediante la aplicación de fórmulas."
  - id: c
    correct: true
    text:
      es: "Los que tengan por objeto prestaciones de carácter intelectual."
  - id: d
    text:
      es: "Los que adjudique la Administración General del Estado."
  explanation:
    es: "El artículo 159.6 se aplica a suministros y servicios de menos de 60.000 euros, «excepto los que tengan por objeto prestaciones de carácter intelectual a los que no será de aplicación este apartado». Las compras corrientes de bienes disponibles en el mercado no quedan excluidas: tienen un plazo de cinco días hábiles (artículo 159.6.a). Los criterios cuantificables mediante fórmulas son precisamente los que esa tramitación usa (artículo 159.6.c). El artículo no excluye los contratos de la Administración General del Estado."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q132
  prompt:
    es: "Según el artículo 159.6.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando la tramitación de ese apartado se aplique a compras corrientes de bienes disponibles en el mercado, el plazo de proposiciones será de:"
  options:
  - id: a
    text:
      es: "Diez días hábiles desde el siguiente a la publicación del anuncio."
  - id: b
    text:
      es: "Siete días hábiles desde el siguiente a la publicación del anuncio."
  - id: c
    text:
      es: "Quince días naturales desde el siguiente a la publicación del anuncio."
  - id: d
    correct: true
    text:
      es: "Cinco días hábiles desde el siguiente a la publicación del anuncio."
  explanation:
    es: "El artículo 159.6.a) fija un plazo no inferior a diez días hábiles y añade: «cuando se trate de compras corrientes de bienes disponibles en el mercado el plazo será de 5 días hábiles». Los diez días hábiles son la regla general del apartado, no la de las compras corrientes. Los siete días hábiles son el plazo para constituir la garantía definitiva en el simplificado (artículo 159.4.f). Los quince días naturales son el mínimo del simplificado general (artículo 159.3)."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q133
  prompt:
    es: "El miércoles 4 de febrero de 2026 se publica en el perfil de contratante un servicio de limpieza de 30.000 euros tramitado por el artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público. Sin festivos, ¿cuál es el último día del plazo mínimo?"
  options:
  - id: a
    text:
      es: "El lunes 16 de febrero de 2026."
  - id: b
    text:
      es: "El martes 17 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El miércoles 18 de febrero de 2026."
  - id: d
    text:
      es: "El miércoles 25 de febrero de 2026."
  explanation:
    es: "El artículo 159.6.a) fija un plazo no inferior a «diez días hábiles, a contar desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante». Se excluyen sábados y domingos. Desde el jueves 5 de febrero, los días hábiles son el 5 y el 6, del 9 al 13 y del 16 al 18: el décimo es el miércoles 18 de febrero. El martes 17 sale de contar desde el mismo día de la publicación. El lunes 16 cuenta diez días naturales, que acaban el sábado 14 y pasan al lunes. El miércoles 25 cuenta quince días hábiles."
  citation: "art. 159.6 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q134
  prompt:
    es: "¿Cuál de las siguientes es una de las especialidades de la tramitación del artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Se exige al adjudicatario una garantía definitiva del 5 por 100 del precio final ofertado."
  - id: b
    correct: true
    text:
      es: "Se exime a los licitadores de acreditar la solvencia económica, financiera y técnica."
  - id: c
    text:
      es: "La oferta se presenta en dos sobres, uno de ellos con los criterios de juicio de valor."
  - id: d
    text:
      es: "El plazo de proposiciones no puede ser inferior a quince días naturales en ningún caso."
  explanation:
    es: "El artículo 159.6.b) dice: «Se eximirá a los licitadores de la acreditación de la solvencia económica y financiera y técnica o profesional». En esa tramitación no se requiere garantía definitiva (letra f). La oferta va en un único sobre y se valora solo con fórmulas (letra c). El plazo de proposiciones es de diez días hábiles, o de cinco en compras corrientes (letra a), no de quince días naturales."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q135
  prompt:
    es: "De acuerdo con el artículo 159.6.c) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en la tramitación de ese apartado la oferta se entregará:"
  options:
  - id: a
    text:
      es: "En dos sobres o archivos electrónicos, uno de ellos con los criterios de juicio de valor."
  - id: b
    text:
      es: "En un único sobre y se evaluará con criterios dependientes de un juicio de valor."
  - id: c
    correct: true
    text:
      es: "En un único sobre y se evaluará con criterios cuantificables mediante fórmulas."
  - id: d
    text:
      es: "En tres sobres: documentación, criterios de juicio de valor y criterios evaluables con fórmulas."
  explanation:
    es: "El artículo 159.6.c) dice: «La oferta se entregará en un único sobre o archivo electrónico y se evaluará, en todo caso, con arreglo a criterios de adjudicación cuantificables mediante la mera aplicación de fórmulas establecidas en los pliegos». Los dos sobres son la regla del abierto con varios criterios (artículo 157.2). El juicio de valor está excluido en esta tramitación. Los tres sobres no figuran en el artículo."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q136
  prompt:
    es: "En un contrato de servicios de 50.000 euros, sin prestaciones de carácter intelectual, tramitado conforme al artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la garantía definitiva:"
  options:
  - id: a
    text:
      es: "Es del 5 por 100 del precio final ofertado, IVA excluido."
  - id: b
    text:
      es: "Se constituye en siete días hábiles desde el envío de la comunicación."
  - id: c
    text:
      es: "Es del 3 por 100 del presupuesto base de licitación, IVA excluido."
  - id: d
    correct: true
    text:
      es: "No se requiere al adjudicatario la constitución de esa garantía."
  explanation:
    es: "El artículo 159.6.f) dice: «No se requerirá la constitución de garantía definitiva». El 5 por 100 del precio final ofertado es la garantía definitiva general (artículo 107.1), que aquí no se exige. Los siete días hábiles son el plazo para constituirla en el simplificado general (artículo 159.4.f). El 3 por 100 del presupuesto base de licitación es la penalidad por no formalizar (artículo 153.4), no una garantía."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-160
- id: m03-l04-q137
  prompt:
    es: "Según el artículo 160.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el procedimiento restringido solo podrán presentar proposiciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Los empresarios que, a su solicitud y en atención a su solvencia, sean seleccionados por el órgano de contratación."
  - id: b
    text:
      es: "Los empresarios inscritos en el Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público."
  - id: c
    text:
      es: "Los empresarios que el órgano de contratación invite directamente, aunque no hayan solicitado participar."
  - id: d
    text:
      es: "Los empresarios elegidos por sorteo entre todos los que hayan presentado en plazo su solicitud de participación."
  explanation:
    es: "El artículo 160.2 dice: «Solo podrán presentar proposiciones aquellos empresarios que, a su solicitud y en atención a su solvencia, sean seleccionados por el órgano de contratación». La inscripción en el Registro Oficial de Licitadores es un requisito del abierto simplificado, no del restringido. El órgano no puede invitar a quien no ha solicitado participar (artículo 162.2). La selección se hace por solvencia, no por sorteo."
  citation: "art. 160.2 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-160
- id: m03-l04-q138
  prompt:
    es: "Señale la afirmación correcta sobre la negociación en el procedimiento restringido de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público:"
  options:
  - id: a
    text:
      es: "Los términos del contrato pueden negociarse con los candidatos seleccionados por su solvencia."
  - id: b
    correct: true
    text:
      es: "Está prohibida toda negociación de los términos del contrato con los solicitantes o candidatos."
  - id: c
    text:
      es: "Puede negociarse el precio con los candidatos, pero no los requisitos mínimos de la prestación."
  - id: d
    text:
      es: "Una mesa especial dirige un diálogo con los candidatos para desarrollar las soluciones."
  explanation:
    es: "El artículo 160.3 dice: «En este procedimiento estará prohibida toda negociación de los términos del contrato con los solicitantes o candidatos». No cabe negociar con los seleccionados ni negociar solo el precio; la negociación es propia de los procedimientos con negociación. El diálogo dirigido por una mesa especial es el rasgo del diálogo competitivo (artículo 172.1)."
  citation: "art. 160.3 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-162
- id: m03-l04-q139
  prompt:
    es: "Según el artículo 162.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es el número mínimo de empresarios a los que el órgano de contratación invitará en el procedimiento restringido?"
  options:
  - id: a
    text:
      es: "No podrá ser inferior a tres empresarios."
  - id: b
    text:
      es: "No podrá ser inferior a seis empresarios."
  - id: c
    correct: true
    text:
      es: "No podrá ser inferior a cinco empresarios."
  - id: d
    text:
      es: "No podrá ser inferior a diez empresarios."
  explanation:
    es: "El artículo 162.2 dice que el órgano de contratación señalará el número mínimo de empresarios a los que invitará, «que no podrá ser inferior a cinco». Tres es el mínimo de la licitación con negociación cuando se limita el número de invitados (artículo 169.2). Seis y diez no figuran en el artículo."
  citation: "art. 162.2 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-162
- id: m03-l04-q140
  prompt:
    es: "De acuerdo con el artículo 162.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si en el restringido menos candidatos de los fijados cumplen los criterios de selección, el órgano de contratación:"
  options:
  - id: a
    text:
      es: "Deberá declarar desierta la licitación y convocar un nuevo procedimiento."
  - id: b
    text:
      es: "Podrá invitar a empresarios que no hayan solicitado participar, hasta completar el mínimo."
  - id: c
    text:
      es: "Deberá continuar por el procedimiento negociado sin publicidad con esos candidatos."
  - id: d
    correct: true
    text:
      es: "Podrá continuar el procedimiento con los que reúnan las condiciones exigidas."
  explanation:
    es: "El artículo 162.2 dice que, en ese caso, «el órgano de contratación podrá continuar el procedimiento con los que reúnan las condiciones exigidas, sin que pueda invitarse a empresarios que no hayan solicitado participar en el mismo». No obliga a declarar desierta la licitación. Prohíbe invitar a quien no lo ha solicitado. Tener pocos candidatos no está entre los supuestos del negociado sin publicidad del artículo 168."
  citation: "art. 162.2 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2017-12902-art-161
- id: m03-l04-q141
  prompt:
    es: "Según el artículo 161.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el procedimiento restringido de un contrato sujeto a regulación armonizada, el plazo general de solicitudes de participación:"
  options:
  - id: a
    correct: true
    text:
      es: "No podrá ser inferior a treinta días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: b
    text:
      es: "No podrá ser inferior a treinta y cinco días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea."
  - id: c
    text:
      es: "No podrá ser inferior a quince días desde la publicación del anuncio de licitación en el perfil de contratante."
  - id: d
    text:
      es: "No podrá ser inferior a treinta días desde el envío de la invitación escrita a los candidatos."
  explanation:
    es: "El artículo 161.1 dice que el plazo de solicitudes «no podrá ser inferior a treinta días, contados a partir de la fecha del envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea». Los treinta y cinco días son el plazo de proposiciones del abierto armonizado (artículo 156.2). Los quince días desde la publicación son el mínimo de los contratos no armonizados (artículo 161.3). En la fase de solicitudes aún no hay invitación: el envío de la invitación inicia el plazo de proposiciones (artículo 164.1)."
  citation: "art. 161.1 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-161
- id: m03-l04-q142
  prompt:
    es: "Según el artículo 161.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en un restringido de suministro armonizado, ¿qué plazo mínimo de solicitudes cabe si el general es impracticable por urgencia?"
  options:
  - id: a
    text:
      es: "Diez días desde el envío del anuncio de licitación."
  - id: b
    correct: true
    text:
      es: "Quince días desde el envío del anuncio de licitación."
  - id: c
    text:
      es: "Veinte días desde el envío del anuncio de licitación."
  - id: d
    text:
      es: "Treinta días desde el envío del anuncio de licitación."
  explanation:
    es: "El artículo 161.1 permite, en obras, suministros y servicios, cuando el plazo general sea impracticable por urgencia, fijar «otro plazo que no será inferior a quince días contados desde la fecha del envío del anuncio de licitación». Treinta días es el plazo general, que la urgencia permite acortar. Diez y veinte días no son el mínimo que el artículo fija para las solicitudes."
  citation: "art. 161.1 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-164
- id: m03-l04-q143
  prompt:
    es: "De acuerdo con el artículo 164.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en los restringidos sujetos a regulación armonizada, el plazo general de presentación de proposiciones:"
  options:
  - id: a
    text:
      es: "No será inferior a treinta y cinco días, contados desde la fecha de envío de la invitación escrita."
  - id: b
    text:
      es: "No será inferior a treinta días, contados desde la publicación del anuncio de licitación."
  - id: c
    correct: true
    text:
      es: "No será inferior a treinta días, contados desde la fecha de envío de la invitación escrita."
  - id: d
    text:
      es: "No será inferior a diez días, contados desde la fecha de envío de la invitación escrita."
  explanation:
    es: "El artículo 164.1 dice que el plazo general de proposiciones «no será inferior a treinta días, contados a partir de la fecha de envío de la invitación escrita». Los treinta y cinco días son el plazo del abierto armonizado (artículo 156.2). El plazo de proposiciones se cuenta desde la invitación, no desde el anuncio. Los diez días son el mínimo de los restringidos no armonizados (artículo 164.2) y no el plazo general de los armonizados."
  citation: "art. 164.1 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-161
- id: m03-l04-q144
  prompt:
    es: "En el procedimiento restringido de un contrato no sujeto a regulación armonizada, el plazo de presentación de solicitudes de participación será, como mínimo, de:"
  options:
  - id: a
    text:
      es: "Diez días, contados desde la publicación del anuncio de licitación."
  - id: b
    text:
      es: "Quince días, contados desde el envío de la invitación escrita."
  - id: c
    text:
      es: "Treinta días, contados desde la publicación del anuncio de licitación."
  - id: d
    correct: true
    text:
      es: "Quince días, contados desde la publicación del anuncio de licitación."
  explanation:
    es: "El artículo 161.3 dice que, si se trata de contratos no sujetos a regulación armonizada, el plazo de solicitudes «será, como mínimo, de quince días, contados desde la publicación del anuncio de licitación». Los diez días son el mínimo de las proposiciones en esos contratos (artículo 164.2). Las solicitudes se cuentan desde el anuncio, no desde una invitación que todavía no existe. Los treinta días son el plazo de los contratos armonizados (artículo 161.1)."
  citation: "art. 161.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-164
- id: m03-l04-q145
  prompt:
    es: "Según el artículo 164.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué plazo mínimo tienen las proposiciones en los procedimientos restringidos no sujetos a regulación armonizada?"
  options:
  - id: a
    correct: true
    text:
      es: "Diez días, contados desde la fecha de envío de la invitación."
  - id: b
    text:
      es: "Quince días, contados desde la fecha de envío de la invitación."
  - id: c
    text:
      es: "Diez días, contados desde la publicación del anuncio de licitación."
  - id: d
    text:
      es: "Treinta días, contados desde la fecha de envío de la invitación."
  explanation:
    es: "El artículo 164.2 dice que el plazo de proposiciones «no será inferior a diez días, contados desde la fecha de envío de la invitación». Los quince días son el mínimo de las solicitudes de participación en esos contratos (artículo 161.3). Las proposiciones se cuentan desde la invitación, no desde el anuncio. Los treinta días son el plazo general de los restringidos armonizados (artículo 164.1)."
  citation: "art. 164.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-164
- id: m03-l04-q146
  prompt:
    es: "¿Cuál de los siguientes plazos mínimos de presentación se cuenta desde el envío de la invitación, y no desde el anuncio de licitación?"
  options:
  - id: a
    text:
      es: "El de solicitudes de participación en el restringido."
  - id: b
    correct: true
    text:
      es: "El de proposiciones en el procedimiento restringido."
  - id: c
    text:
      es: "El de proposiciones en el abierto simplificado."
  - id: d
    text:
      es: "El de proposiciones en el abierto no armonizado."
  explanation:
    es: "En el restringido, el plazo de proposiciones se cuenta desde el envío de la invitación, tanto en los contratos no armonizados («contados desde la fecha de envío de la invitación», artículo 164.2) como en los armonizados (artículo 164.1). Las solicitudes de participación se cuentan desde el anuncio o desde su envío a la Oficina de Publicaciones de la Unión Europea (artículo 161). En el abierto simplificado y en el abierto no armonizado el plazo corre desde el día siguiente a la publicación en el perfil de contratante (artículos 159.3 y 156.6)."
  citation: "art. 164.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-167
- id: m03-l04-q147
  prompt:
    es: "¿Cuál de los siguientes es uno de los supuestos en que la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público permite la licitación con negociación?"
  options:
  - id: a
    text:
      es: "Que el contrato haya sido declarado secreto o reservado por el órgano competente."
  - id: b
    text:
      es: "Que el objeto sea una obra de arte única no integrante del Patrimonio Histórico español."
  - id: c
    correct: true
    text:
      es: "Que la prestación objeto del contrato incluya un proyecto o soluciones innovadoras."
  - id: d
    text:
      es: "Que una imperiosa urgencia no pueda atenderse con la tramitación urgente del expediente."
  explanation:
    es: "El artículo 167.b) permite la licitación con negociación «cuando la prestación objeto del contrato incluya un proyecto o soluciones innovadoras». El contrato secreto o reservado, la obra de arte única y la imperiosa urgencia no están en el artículo 167: son supuestos del negociado sin publicidad del artículo 168."
  citation: "art. 167 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-167
- id: m03-l04-q148
  prompt:
    es: "Según el artículo 167.e) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cabe la licitación con negociación cuando en los procedimientos abiertos o restringidos seguidos previamente:"
  options:
  - id: a
    text:
      es: "No se haya presentado ninguna oferta ni solicitud de participación."
  - id: b
    text:
      es: "Se hayan presentado menos de tres ofertas admisibles en total."
  - id: c
    text:
      es: "Solo se haya presentado una oferta, aunque fuera adecuada."
  - id: d
    correct: true
    text:
      es: "Solo se hayan presentado ofertas irregulares o inaceptables."
  explanation:
    es: "El artículo 167.e) recoge el caso de que «en los procedimientos abiertos o restringidos seguidos previamente solo se hubieren presentado ofertas irregulares o inaceptables». Que no se haya presentado ninguna oferta o solicitud es un supuesto del negociado sin publicidad (artículo 168.a). El artículo no fija un número mínimo de ofertas admisibles. Una única oferta adecuada no abre la negociación."
  citation: "art. 167 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-167
- id: m03-l04-q149
  prompt:
    es: "¿Qué exige la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público para acudir a la licitación con negociación en contratos de servicios sociales personalísimos?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el arraigo en el entorno sea determinante y se dé continuidad a quienes ya eran beneficiarios."
  - id: b
    text:
      es: "Que el valor estimado del contrato sea inferior a 750.000 euros, sin incluir el IVA."
  - id: c
    text:
      es: "Que el servicio se preste a personas que no fueran beneficiarias de él hasta ese momento."
  - id: d
    text:
      es: "Que el contrato se haya declarado previamente de emergencia por el órgano de contratación."
  explanation:
    es: "El artículo 167.f) exige que se trate de servicios sociales personalísimos «que tengan por una de sus características determinantes el arraigo de la persona en el entorno de atención social, siempre que el objeto del contrato consista en dotar de continuidad en la atención a las personas que ya eran beneficiarias de dicho servicio». El artículo no fija un valor estimado. Los nuevos beneficiarios quedan fuera, porque el supuesto busca la continuidad. La declaración de emergencia no figura entre los requisitos."
  citation: "art. 167 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-167
- id: m03-l04-q150
  prompt:
    es: "En obras, suministros o servicios puede acudirse a la licitación con negociación cuando el órgano de contratación no pueda establecer con la suficiente precisión:"
  options:
  - id: a
    text:
      es: "El número de licitadores que concurrirán."
  - id: b
    correct: true
    text:
      es: "Las especificaciones técnicas del contrato."
  - id: c
    text:
      es: "El plazo de ejecución de la prestación."
  - id: d
    text:
      es: "La solvencia exigible a los licitadores."
  explanation:
    es: "El artículo 167.d) recoge el caso de que «el órgano de contratación no pueda establecer con la suficiente precisión las especificaciones técnicas por referencia a una norma, evaluación técnica europea, especificación técnica común o referencia técnica». No poder prever el número de licitadores, el plazo de ejecución o la solvencia exigible no está entre los supuestos del artículo 167."
  citation: "art. 167 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-169
- id: m03-l04-q151
  prompt:
    es: "De acuerdo con el artículo 169.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando se acuda a la licitación con negociación por darse las circunstancias del artículo 167, el órgano de contratación:"
  options:
  - id: a
    text:
      es: "Podrá prescindir del anuncio si invita al menos a tres empresas."
  - id: b
    text:
      es: "Solo publicará anuncio si el contrato está sujeto a regulación armonizada."
  - id: c
    correct: true
    text:
      es: "Deberá publicar en todo caso un anuncio de licitación en la forma del artículo 135."
  - id: d
    text:
      es: "Podrá sustituir el anuncio por invitaciones directas a cinco empresas."
  explanation:
    es: "El artículo 169.1 dice que el órgano de contratación, «en todo caso, deberá publicar un anuncio de licitación en la forma prevista en el artículo 135». Las tres empresas son el mínimo de invitados cuando se limita su número (artículo 169.2), no una alternativa al anuncio. El anuncio no depende de la regulación armonizada. Las cinco invitaciones son el mínimo del restringido, que también exige anuncio."
  citation: "art. 169.1 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
