# anchor: boe-a-1985-151-art-16
- id: m04-l06-q048
  prompt:
    es: "Según el artículo 16.4 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿cabe compatibilidad para actividades privadas con 18.400 euros de retribución básica (trienios: 2.400) y 5.000 de complemento específico?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque 5.000 euros superan el 30 por 100 de 16.000 euros."
  - id: b
    text:
      es: "Sí, porque 5.000 euros no superan el 30 por 100 de 18.400 euros."
  - id: c
    text:
      es: "Sí, porque 5.000 euros no superan el 35 por 100 de 16.000 euros."
  - id: d
    text:
      es: "No, porque quien percibe complemento específico nunca obtiene compatibilidad."
  explanation:
    es: "El artículo 16.4 compara el complemento con «el 30 por 100 de su retribución básica, excluidos los conceptos que tengan su origen en la antigüedad». Sin los trienios, la base es 16.000 euros y su 30 por 100 son 4.800 euros: los 5.000 euros del complemento lo superan. Calcular sobre 18.400 euros mete los trienios, que el artículo excluye. El 35 por 100 no es el porcentaje de la Ley. Decir que nunca cabe compatibilidad ignora la excepción del propio artículo 16.4."
  citation: "art. 16.4 Ley 53/1984"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-1985-151-art-16
- id: m04-l06-q049
  prompt:
    es: "Según el artículo 16.4 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿para qué actividades cabe reconocer compatibilidad a quien percibe complementos específicos dentro del límite de ese apartado?"
  options:
  - id: a
    text:
      es: "Para un segundo puesto laboral en el sector público."
  - id: b
    correct: true
    text:
      es: "Para el ejercicio de actividades privadas."
  - id: c
    text:
      es: "Para cualquier actividad, pública o privada, sin más límites."
  - id: d
    text:
      es: "Para pertenecer al Consejo de Administración de cualquier empresa privada."
  explanation:
    es: "El artículo 16.4 permite reconocer compatibilidad «para el ejercicio de actividades privadas», y lo hace «sin perjuicio de las limitaciones establecidas en los artículos 1º.3, 11, 12 y 13». No abre la puerta a un segundo puesto público. Tampoco elimina límites: las prohibiciones del artículo 12 siguen en pie, entre ellas la pertenencia a Consejos de empresas relacionadas con el Departamento."
  citation: "art. 16.4 Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q050
  prompt:
    es: "Una funcionaria del Estado es nombrada vocal del tribunal calificador de unas pruebas selectivas para ingreso en la Administración. ¿Qué necesita, en materia de incompatibilidades, para esa participación?"
  options:
  - id: a
    text:
      es: "El previo reconocimiento de compatibilidad, que se resuelve en el plazo de dos meses."
  - id: b
    text:
      es: "La previa y expresa autorización de compatibilidad para un segundo puesto público."
  - id: c
    correct: true
    text:
      es: "Ninguna autorización ni reconocimiento, porque está exceptuada del régimen de incompatibilidades."
  - id: d
    text:
      es: "La autorización de compatibilidad, solo si su dedicación supera setenta y cinco horas al año."
  explanation:
    es: "El artículo 19.c) de la Ley 53/1984 exceptúa del régimen de incompatibilidades «La participación en Tribunales calificadores de pruebas selectivas para ingreso en las Administraciones Públicas». Al quedar fuera del régimen, no hace falta el reconocimiento del artículo 14 ni la autorización del artículo 3.1. El límite de setenta y cinco horas al año es de la letra b), para cursos y conferencias en centros de formación, no para los tribunales."
  citation: "art. 19.c) Ley 53/1984"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q051
  prompt:
    es: "De acuerdo con el artículo 19.c) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la participación en Tribunales calificadores de pruebas selectivas para ingreso en las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Queda exceptuada del régimen de incompatibilidades solo si no es retribuida."
  - id: b
    correct: true
    text:
      es: "Queda exceptuada del régimen de incompatibilidades, sin condiciones añadidas."
  - id: c
    text:
      es: "Queda exceptuada solo si no tiene carácter permanente o habitual."
  - id: d
    text:
      es: "Queda exceptuada solo en la forma que se establezca reglamentariamente."
  explanation:
    es: "La letra c) del artículo 19 exceptúa «La participación en Tribunales calificadores de pruebas selectivas para ingreso en las Administraciones Públicas» sin añadir condición. La falta de retribución es la condición de la letra e), para las Juntas rectoras de Mutualidades. El carácter no permanente ni habitual es de la letra b). La forma reglamentaria es de la letra d), para el personal docente."
  citation: "art. 19.c) Ley 53/1984"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q052
  prompt:
    es: "Según el artículo 19.b) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, los cursos en Centros oficiales de formación de funcionarios están exceptuados si no son habituales ni superan:"
  options:
  - id: a
    text:
      es: "Un total de cincuenta horas al año."
  - id: b
    text:
      es: "Un total de cien horas al año."
  - id: c
    text:
      es: "Un total de ciento cincuenta horas al año."
  - id: d
    correct: true
    text:
      es: "Un total de setenta y cinco horas al año."
  explanation:
    es: "El artículo 19.b) exceptúa esos cursos «cuando no tenga carácter permanente o habitual ni supongan más de setenta y cinco horas al año». Cincuenta, cien y ciento cincuenta horas no son la cifra de la Ley."
  citation: "art. 19.b) Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q053
  prompt:
    es: "Un funcionario imparte de forma no habitual, en un centro oficial de formación de funcionarios, tres cursos de 20, 25 y 30 horas en un año. A efectos de incompatibilidades, esa actividad:"
  options:
  - id: a
    correct: true
    text:
      es: "Está exceptuada, porque no supone más de setenta y cinco horas al año."
  - id: b
    text:
      es: "No está exceptuada, porque alcanza las setenta y cinco horas al año."
  - id: c
    text:
      es: "No está exceptuada, porque supera las sesenta horas al año."
  - id: d
    text:
      es: "Está exceptuada solo si los cursos no se retribuyen."
  explanation:
    es: "Los tres cursos suman 20 + 25 + 30 = 75 horas. El artículo 19.b) de la Ley 53/1984 solo pide que la actividad no tenga carácter permanente o habitual «ni supongan más de setenta y cinco horas al año». Setenta y cinco no es más de setenta y cinco, así que la actividad queda exceptuada. La opción que la excluye por alcanzar las setenta y cinco horas confunde «más de» con «hasta». Sesenta horas no es el límite. La falta de retribución es la condición de la letra e), no de esta."
  citation: "art. 19.b) Ley 53/1984"
  difficulty: 3
  tags:
  - "cómputo"
  - "excepción"
