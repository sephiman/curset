# anchor: boe-a-1985-5392-art-31
- id: m01-l04-q0109
  prompt:
    es: "Según el artículo 31.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cuáles son los fines propios y específicos de la Provincia?"
  options:
  - id: a
    text:
      es: "Garantizar la autonomía financiera y tributaria de los Municipios de su territorio."
  - id: b
    text:
      es: "Garantizar la unidad de gobierno y gestión de los Municipios de su territorio."
  - id: c
    text:
      es: "Garantizar la representación de los Municipios de su territorio ante las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "Garantizar los principios de solidaridad y equilibrio intermunicipales."
  explanation:
    es: "El artículo 31.2 LBRL dice que son fines propios y específicos de la Provincia «garantizar los principios de solidaridad y equilibrio intermunicipales». La autonomía financiera de los Municipios, su unidad de gobierno y su representación ante las Cortes no son los fines que enumera el artículo."
  citation: "art. 31.2 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-32
- id: m01-l04-q0110
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la Junta de Gobierno es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Existe en todas las Diputaciones, mientras que en los ayuntamientos depende de la población, del reglamento orgánico o del acuerdo del Pleno."
  - id: b
    text:
      es: "Existe en todos los ayuntamientos y en todas las Diputaciones, cualquiera que sea su población."
  - id: c
    text:
      es: "Existe en los ayuntamientos de más de 5.000 habitantes y en las Diputaciones cuyo Pleno lo acuerde."
  - id: d
    text:
      es: "Existe solo en las Diputaciones de régimen común y en los municipios de gran población."
  explanation:
    es: "El artículo 32.1 LBRL dice que la Junta de Gobierno existe «en todas las Diputaciones». En los ayuntamientos, el artículo 20.1.b) la exige en los municipios de más de 5.000 habitantes y en los de menos si lo dispone su reglamento orgánico o lo acuerda el Pleno. No existe en todos los ayuntamientos. En las Diputaciones no depende de un acuerdo del Pleno. La ley no la limita a las Diputaciones de régimen común ni a los municipios de gran población."
  citation: "art. 32.1 LBRL"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-35
- id: m01-l04-q0111
  prompt:
    es: "De acuerdo con el artículo 35.4 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Vicepresidentes, que sustituyen al Presidente por el orden de su nombramiento, son designados:"
  options:
  - id: a
    text:
      es: "Por el Pleno, entre los Diputados, por mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Libremente por el Presidente entre los miembros de la Junta de Gobierno."
  - id: c
    text:
      es: "Libremente por el Presidente entre todos los Diputados, sean o no de la Junta de Gobierno."
  - id: d
    text:
      es: "Por la Junta de Gobierno, entre sus miembros, a propuesta del Presidente."
  explanation:
    es: "El artículo 35.4 LBRL dice que los Vicepresidentes son «libremente designados por éste», el Presidente, «entre los miembros de la Junta de Gobierno». No los elige el Pleno ni la Junta de Gobierno. A diferencia de los Tenientes de Alcalde, la ley no prevé designarlos entre todos los Diputados."
  citation: "art. 35.4 LBRL"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-40
- id: m01-l04-q0113
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las Comunidades Autónomas uniprovinciales y la Foral de Navarra:"
  options:
  - id: a
    correct: true
    text:
      es: "Asumen las competencias, medios y recursos que en el régimen ordinario corresponden a las Diputaciones Provinciales."
  - id: b
    text:
      es: "Mantienen una Diputación Provincial distinta de sus instituciones autonómicas."
  - id: c
    text:
      es: "Asumen las competencias de las Diputaciones, salvo la asistencia y cooperación a los Municipios."
  - id: d
    text:
      es: "Transfieren a sus Municipios las competencias que corresponden a las Diputaciones Provinciales."
  explanation:
    es: "El artículo 40 LBRL dice que estas Comunidades «asumen las competencias, medios y recursos que corresponden en el régimen ordinario a las Diputaciones Provinciales». No mantienen una Diputación aparte. La asunción no excluye la asistencia a los Municipios. Las competencias pasan a la Comunidad, no a los Municipios. La única excepción del artículo es la Comunidad Autónoma de las Islas Baleares."
  citation: "art. 40 LBRL"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-39
- id: m01-l04-q0114
  prompt:
    es: "Según el artículo 39 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cómo se aplican sus disposiciones a los órganos forales de Álava, Guipúzcoa y Vizcaya?"
  options:
  - id: a
    text:
      es: "Con carácter preferente sobre su régimen foral, que solo rige en su defecto."
  - id: b
    correct: true
    text:
      es: "Con carácter supletorio, pues conservan su régimen peculiar en el marco del Estatuto vasco."
  - id: c
    text:
      es: "No se les aplican en ningún caso, por tener un régimen foral propio."
  - id: d
    text:
      es: "Solo en materia de organización, pues sus competencias se rigen por su Estatuto."
  explanation:
    es: "El artículo 39 LBRL dice que los órganos forales de Álava, Guipúzcoa y Vizcaya «conservan su régimen peculiar» en el marco del Estatuto vasco y que la Ley «les serán de aplicación con carácter supletorio». La Ley no prevalece sobre el régimen foral. Sí se aplica, como supletoria, así que «en ningún caso» es falso. El artículo no reparte su aplicación entre organización y competencias."
  citation: "art. 39 LBRL"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-5392-art-35
- id: m01-l04-q0116
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿qué número de Diputados puede integrar, junto con el Presidente, la Junta de Gobierno de la Diputación, nombrados y separados libremente por el Presidente?"
  options:
  - id: a
    text:
      es: "No superior a la mitad del número legal de Diputados."
  - id: b
    correct: true
    text:
      es: "No superior al tercio del número legal de Diputados."
  - id: c
    text:
      es: "No inferior al tercio del número legal de Diputados."
  - id: d
    text:
      es: "No superior a los dos tercios del número legal de Diputados."
  explanation:
    es: "La Junta de Gobierno se integra por el Presidente y un número de Diputados no superior al tercio del número legal. La mitad y los dos tercios son límites mayores que el de la ley. Un número no inferior al tercio fija un mínimo en vez de un máximo."
  citation: "art. 35.1 LBRL"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-137
- id: m01-l04-q0121
  prompt:
    es: "De acuerdo con el artículo 157.2 de la Constitución Española de 1978, las Comunidades Autónomas no podrán en ningún caso adoptar medidas tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios."
  - id: b
    text:
      es: "Sobre bienes situados en su territorio que pertenezcan a personas residentes en otra Comunidad."
  - id: c
    text:
      es: "Sobre bienes situados fuera de su territorio, salvo autorización de las Cortes Generales."
  - id: d
    text:
      es: "Que consistan en recargos sobre impuestos estatales."
  explanation:
    es: "El artículo 157.2 prohíbe medidas tributarias «sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios». Los bienes situados en su territorio sí pueden gravarse, sea quien sea su titular. La prohibición es «en ningún caso», sin autorización posible. Los recargos sobre impuestos estatales son un recurso de las Comunidades (art. 157.1.a)."
  citation: "art. 157.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1978-31229-art-158
- id: m01-l04-q0122
  prompt:
    es: "¿Con qué fin se constituye, según la Constitución Española de 1978, un Fondo de Compensación con destino a gastos de inversión?"
  options:
  - id: a
    text:
      es: "Para garantizar un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio."
  - id: b
    correct: true
    text:
      es: "Para corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad."
  - id: c
    text:
      es: "Para financiar los servicios y actividades estatales que hayan asumido las Comunidades Autónomas."
  - id: d
    text:
      es: "Para compensar a las Comunidades Autónomas por los impuestos cedidos total o parcialmente por el Estado."
  explanation:
    es: "El artículo 158.2 constituye el Fondo «con el fin de corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad». La garantía de un nivel mínimo en los servicios públicos fundamentales y el volumen de los servicios estatales asumidos son los criterios de la asignación del artículo 158.1, no el fin del Fondo. Los impuestos cedidos son un recurso del artículo 157.1.a), no algo que el Fondo compense."
  citation: "art. 158.2 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-158
- id: m01-l04-q0123
  prompt:
    es: "Según el artículo 158.1 de la Constitución Española de 1978, ¿en función de qué podrá establecerse en los Presupuestos Generales del Estado una asignación a las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "De la población y la superficie de cada Comunidad Autónoma y de las circunstancias del hecho insular."
  - id: b
    text:
      es: "De la corrección de desequilibrios económicos interterritoriales, con destino exclusivo a gastos de inversión."
  - id: c
    text:
      es: "Del esfuerzo fiscal de cada Comunidad Autónoma en la recaudación de sus propios impuestos."
  - id: d
    correct: true
    text:
      es: "Del volumen de los servicios y actividades estatales asumidos y de la garantía de un nivel mínimo en los servicios públicos fundamentales."
  explanation:
    es: "El artículo 158.1 prevé una asignación «en función del volumen de los servicios y actividades estatales que hayan asumido y de la garantía de un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio español». La población, la superficie y el esfuerzo fiscal no son criterios del artículo. La corrección de desequilibrios con destino a inversión es el fin del Fondo de Compensación del 158.2."
  citation: "art. 158.1 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: celex-32009d0937-art-1
- id: m01-l04-q0142
  prompt:
    es: "De acuerdo con el artículo 1 del Reglamento interno del Consejo, aprobado por la Decisión 2009/937/UE del Consejo, de 1 de diciembre de 2009:"
  options:
  - id: a
    text:
      es: "El Consejo tendrá su sede en Luxemburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: b
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Estrasburgo."
  - id: c
    text:
      es: "El Consejo tendrá su sede en Estrasburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: d
    correct: true
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Luxemburgo."
  explanation:
    es: "El artículo 1.3 del Reglamento interno dice: «El Consejo tendrá su sede en Bruselas. Durante los meses de abril, junio y octubre, el Consejo celebrará sus sesiones en Luxemburgo». Las otras opciones invierten las ciudades o ponen Estrasburgo, que es la sede del Parlamento Europeo."
  citation: "art. 1.3 Reglamento interno del Consejo"
  difficulty: 1
  tags:
  - "fecha"
  - "estructura"
# anchor: celex-12016e-txt-art-238
- id: m01-l04-q0144
  prompt:
    es: "De acuerdo con el artículo 238 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo no actúe a propuesta de la Comisión o del Alto Representante, la mayoría cualificada se definirá como un mínimo:"
  options:
  - id: a
    text:
      es: "Del 55 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: b
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 55 % de la población de la Unión."
  - id: c
    correct: true
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: d
    text:
      es: "Del 65 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 72 % de la población de la Unión."
  explanation:
    es: "El artículo 238.2 TFUE, «no obstante lo dispuesto en el apartado 4 del artículo 16» TUE, fija para este caso «un mínimo del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión». El 55 % de miembros es la regla general del artículo 16.4 TUE, que aquí no se aplica. Las otras dos opciones alteran o intercambian los porcentajes."
  citation: "art. 238.2 TFUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "excepción"
  - "cantidad"
# anchor: celex-12016e-txt-art-236
- id: m01-l04-q0145
  prompt:
    es: "De acuerdo con el artículo 236 del Tratado de Funcionamiento de la Unión Europea, la decisión que establece la lista de las formaciones del Consejo distintas de la de Asuntos Generales y la de Asuntos Exteriores la adopta:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad de sus miembros."
  - id: b
    correct: true
    text:
      es: "El Consejo Europeo, por mayoría cualificada."
  - id: c
    text:
      es: "El Consejo, por mayoría simple de sus miembros."
  - id: d
    text:
      es: "El Consejo, por mayoría cualificada, a propuesta de la Comisión."
  explanation:
    es: "La opción correcta es el Consejo Europeo por mayoría cualificada: el artículo 236 TFUE dice que «el Consejo Europeo adoptará por mayoría cualificada» la decisión con la lista de las formaciones del Consejo distintas de Asuntos Generales y Asuntos Exteriores. El artículo no exige unanimidad. La decisión no la adopta el propio Consejo, ni por mayoría simple ni a propuesta de la Comisión."
  citation: "art. 236 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
