template: |
  sealed interface Command {
      data class Deposit(val amount: Int) : Command
      data class Withdraw(val amount: Int) : Command
      data object Close : Command
  }

  fun large(amount: Int): Boolean {
      println("guard")
      return amount > @@limit@@
  }

  fun describe(command: Command): String = when (command) {
      is Command.Deposit if large(command.amount) -> "@@big@@ deposit"
      is Command.Withdraw if large(command.amount) -> "@@big@@ withdrawal"
      is Command.Deposit -> "@@small@@ deposit"
      is Command.Withdraw -> "@@small@@ withdrawal"
      Command.Close -> "closed"
  }

  fun main() {
      println(describe(@@first@@))
      println(describe(@@second@@))
  }
explanation: The branches are tried in order and a guard is evaluated only after its primary condition matches. @@why1@@ @@why2@@ The program prints @@key@@.
mistakes:
- name: putting the plain branches before the guarded ones
  replace:
  - |2
        is Command.Deposit if large(command.amount) -> "@@big@@ deposit"
        is Command.Withdraw if large(command.amount) -> "@@big@@ withdrawal"
        is Command.Deposit -> "@@small@@ deposit"
        is Command.Withdraw -> "@@small@@ withdrawal"
  - |2
        is Command.Deposit -> "@@small@@ deposit"
        is Command.Withdraw -> "@@small@@ withdrawal"
        is Command.Deposit if large(command.amount) -> "@@big@@ deposit"
        is Command.Withdraw if large(command.amount) -> "@@big@@ withdrawal"
  why: '`when` tries the branches in order, so a guarded branch written first is tried before the plain branch of the same type.'
- name: negating both guards
  replace:
  - |2
        is Command.Deposit if large(command.amount) -> "@@big@@ deposit"
        is Command.Withdraw if large(command.amount) -> "@@big@@ withdrawal"
  - |2
        is Command.Deposit if !large(command.amount) -> "@@big@@ deposit"
        is Command.Withdraw if !large(command.amount) -> "@@big@@ withdrawal"
  why: A guarded branch runs when its guard returns `true`, and `large` returns `true` only for an amount above `@@limit@@`.
- name: treating both guards as always true
  replace:
  - |2
        is Command.Deposit if large(command.amount) -> "@@big@@ deposit"
        is Command.Withdraw if large(command.amount) -> "@@big@@ withdrawal"
  - |2
        is Command.Deposit if large(command.amount) || true -> "@@big@@ deposit"
        is Command.Withdraw if large(command.amount) || true -> "@@big@@ withdrawal"
  why: When a guard returns `false` the branch is skipped and `when` goes on to the next branch.
- name: negating only the `Deposit` guard
  replace:
  - is Command.Deposit if large
  - is Command.Deposit if !large
  why: The `Deposit` guard is `large(command.amount)`, which holds for an amount above `@@limit@@`.
- name: negating only the `Withdraw` guard
  replace:
  - is Command.Withdraw if large
  - is Command.Withdraw if !large
  why: The `Withdraw` guard is `large(command.amount)`, which holds for an amount above `@@limit@@`.
