# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0165
  prompt:
    es: "De acuerdo con el artículo 103.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando la suma de retenciones, ingresos a cuenta y pagos fraccionados es superior a la cuota de la autoliquidación, la Administración practica, si procede, liquidación provisional dentro de:"
  options:
  - id: a
    correct: true
    text:
      es: "los seis meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: b
    text:
      es: "los tres meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: c
    text:
      es: "los doce meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: d
    text:
      es: "los seis meses siguientes a la fecha de presentación de la declaración presentada en plazo."
  explanation:
    es: "El plazo es de seis meses siguientes al término del plazo de presentación (art. 103.1). Tres y doce meses son otras duraciones. Y el cómputo desde la fecha de presentación solo vale cuando la declaración se presenta fuera de plazo."
  citation: "art. 103.1 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0166
  prompt:
    es: "Según el artículo 103.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando la declaración se ha presentado fuera de plazo, los seis meses para practicar la liquidación provisional se computan desde:"
  options:
  - id: a
    text:
      es: "el término del plazo establecido para presentarla."
  - id: b
    text:
      es: "la fecha en que la Administración requiera al contribuyente."
  - id: c
    text:
      es: "la fecha de devengo del impuesto."
  - id: d
    correct: true
    text:
      es: "la fecha de su presentación."
  explanation:
    es: "Con declaración extemporánea, los seis meses se cuentan desde la fecha de su presentación (art. 103.1). Contarlos desde el término del plazo es la regla de la declaración presentada en plazo. El requerimiento y el devengo no son el punto de partida de este plazo."
  citation: "art. 103.1 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0167
  prompt:
    es: "Ana Pons presenta fuera de plazo, el 10 de agosto de 2026, su declaración del IRPF con resultado a devolver. Conforme al artículo 103.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas y contando los meses de fecha a fecha, ¿hasta qué fecha puede la Administración practicar liquidación provisional antes de tener que devolver de oficio el exceso?"
  options:
  - id: a
    text:
      es: "Hasta el 10 de septiembre de 2026."
  - id: b
    text:
      es: "Hasta el 10 de diciembre de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el 10 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el 10 de agosto de 2027."
  explanation:
    es: "Con declaración fuera de plazo, los seis meses se cuentan desde la fecha de su presentación (art. 103.1). El cómputo empieza el 11 de agosto de 2026 y, de fecha a fecha, concluye el 10 de febrero de 2027 (art. 30 de la Ley 39/2015). El 10 de septiembre sería un mes, el 10 de diciembre cuatro meses y el 10 de agosto de 2027 un año."
  citation: "art. 103.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0168
  prompt:
    es: "De acuerdo con el artículo 103.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las cantidades que se comparan con la cuota resultante de la autoliquidación para practicar, si procede, liquidación provisional:"
  options:
  - id: a
    text:
      es: "Solo se suman las retenciones y los ingresos a cuenta, sin pagos fraccionados, sin las cuotas del Impuesto sobre la Renta de no Residentes de la letra d) del artículo 79 de esa ley y sin las deducciones de los artículos 81 y 81 bis de esa ley."
  - id: b
    text:
      es: "Se suman las retenciones, los ingresos a cuenta y los pagos fraccionados, sin las deducciones de los artículos 81 y 81 bis."
  - id: c
    correct: true
    text:
      es: "Se suman las retenciones, ingresos a cuenta y pagos fraccionados, las cuotas del Impuesto sobre la Renta de no Residentes de la letra d) del artículo 79 y, en su caso, las deducciones de los artículos 81 y 81 bis."
  - id: d
    text:
      es: "Se suman únicamente los pagos fraccionados y las deducciones de los artículos 81 y 81 bis."
  explanation:
    es: "La comparación incluye retenciones, ingresos a cuenta y pagos fraccionados, las cuotas del Impuesto sobre la Renta de no Residentes de la letra d) del artículo 79 y, en su caso, las deducciones de los artículos 81 y 81 bis (art. 103.1). Omitir los pagos fraccionados o las deducciones, o reducir la suma a estas últimas, deja fuera partidas que la ley incluye."
  citation: "art. 103.1 LIRPF"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0169
  prompt:
    es: "Conforme al artículo 103.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si la liquidación provisional no se hubiera practicado en el plazo del apartado 1, la Administración tributaria:"
  options:
  - id: a
    text:
      es: "debe esperar a que el contribuyente solicite la devolución y, hasta entonces, no devenga interés alguno a favor de este, aunque haya transcurrido el plazo sin ordenar el pago."
  - id: b
    correct: true
    text:
      es: "devuelve de oficio el exceso sobre la cuota autoliquidada, sin perjuicio de las liquidaciones provisionales o definitivas ulteriores que procedan."
  - id: c
    text:
      es: "queda impedida para practicar liquidaciones posteriores sobre ese período."
  - id: d
    text:
      es: "practica de oficio una liquidación definitiva por el exceso."
  explanation:
    es: "Si no practica liquidación provisional en plazo, la Administración devuelve de oficio el exceso sobre la cuota autoliquidada, sin perjuicio de liquidaciones ulteriores (art. 103.3). No espera a una solicitud, no pierde la posibilidad de liquidar después y no practica una liquidación definitiva por ese motivo."
  citation: "art. 103.3 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-103
- id: m03-l16-q0170
  prompt:
    es: "Según el artículo 103.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, transcurrido el plazo sin que se haya ordenado el pago de la devolución por causa no imputable al contribuyente, a la cantidad pendiente de devolución se aplica:"
  options:
  - id: a
    correct: true
    text:
      es: "el interés de demora en la cuantía y forma previstas en los artículos 26.6 y 31 de la Ley General Tributaria."
  - id: b
    text:
      es: "el interés legal del dinero, sin el incremento del interés de demora."
  - id: c
    text:
      es: "un recargo del 5 por ciento sobre la cantidad pendiente."
  - id: d
    text:
      es: "ningún interés, hasta que el contribuyente lo reclame expresamente."
  explanation:
    es: "La devolución no pagada en plazo por causa no imputable al contribuyente devenga el interés de demora en la cuantía y forma de los artículos 26.6 y 31 de la Ley General Tributaria (art. 103.4). El interés legal sin incremento, el recargo del 5 por ciento y la ausencia de interés hasta la reclamación no figuran en el precepto."
  citation: "art. 103.4 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-49
- id: m03-l16-q0172
  prompt:
    es: "Según el artículo 49.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la integración de rentas en la base imponible del ahorro:"
  options:
  - id: a
    text:
      es: "Los rendimientos del artículo 46 se integran con los rendimientos del trabajo del artículo 45 sin limitación alguna."
  - id: b
    text:
      es: "Las pérdidas patrimoniales del artículo 46 se compensan con rendimientos del trabajo, con el límite del 25 por ciento."
  - id: c
    text:
      es: "Los rendimientos y las ganancias del artículo 46 se compensan entre sí sin límite, y el saldo negativo se arrastra seis años."
  - id: d
    correct: true
    text:
      es: "Los rendimientos del artículo 46 se integran y compensan exclusivamente entre sí, y lo mismo las ganancias y pérdidas patrimoniales del artículo 46."
  explanation:
    es: "En la base del ahorro, los rendimientos del artículo 46 se integran y compensan exclusivamente entre sí, y las ganancias y pérdidas del artículo 46, también (art. 49.1). Después, el saldo negativo de una letra se compensa con el positivo de la otra con el límite del 25 por ciento. No se mezclan con rendimientos del trabajo, y el arrastre es de cuatro años, no seis."
  citation: "art. 49.1 LIRPF"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-61
- id: m03-l16-q0174
  prompt:
    es: "Según la regla 1.ª del artículo 61 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando varios contribuyentes tienen derecho al mínimo por los mismos descendientes y distinto grado de parentesco, ¿a quién corresponde aplicarlo?"
  options:
  - id: a
    text:
      es: "A los de grado más lejano, salvo que tengan rentas anuales superiores a 8.000 euros, en cuyo caso corresponde a los del grado más cercano, aunque no convivan con el descendiente."
  - id: b
    correct: true
    text:
      es: "A los de grado más cercano, salvo que no tengan rentas anuales superiores a 8.000 euros, en cuyo caso corresponde a los del siguiente grado."
  - id: c
    text:
      es: "A los de mayores rentas anuales, sea cual sea su grado de parentesco."
  - id: d
    text:
      es: "A los de grado más cercano, sin excepción por razón de sus rentas."
  explanation:
    es: "La regla da el mínimo a los de grado más cercano, salvo que estos no tengan rentas anuales superiores a 8.000 euros, y entonces pasa a los del siguiente grado (art. 61, regla 1.ª). Preferir el grado más lejano o a quien tenga más renta invierte el criterio. Y negar la excepción de los 8.000 euros ignora la segunda parte de la regla."
  citation: "art. 61 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-59
- id: m03-l16-q0175
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué requisitos debe cumplir un ascendiente para generar el mínimo por ascendientes?"
  options:
  - id: a
    correct: true
    text:
      es: "Ser mayor de 65 años o tener discapacidad cualquiera que sea su edad, convivir con el contribuyente y no tener rentas anuales, excluidas las exentas, superiores a 8.000 euros."
  - id: b
    text:
      es: "Ser mayor de 65 años y tener discapacidad, convivir con el contribuyente y no tener rentas anuales superiores a 8.000 euros."
  - id: c
    text:
      es: "Ser mayor de 75 años o tener discapacidad, convivir con el contribuyente y no tener rentas anuales superiores a 8.000 euros."
  - id: d
    text:
      es: "Ser mayor de 65 años o tener discapacidad, sin que sea necesario convivir con el contribuyente, y no tener rentas anuales superiores a 8.000 euros."
  explanation:
    es: "El ascendiente debe ser mayor de 65 años o tener discapacidad cualquiera que sea su edad, convivir con el contribuyente y no tener rentas anuales superiores a 8.000 euros, excluidas las exentas (art. 59.1). Exigir edad y discapacidad a la vez, subir la edad a 75 años o prescindir de la convivencia cambia los requisitos. Solo el aumento de 1.400 euros depende de superar los 75 años."
  citation: "art. 59.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0176
  prompt:
    es: "Conforme al artículo 81.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿ante qué organismo se puede solicitar el abono anticipado de la deducción por maternidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "Ante la Tesorería General de la Seguridad Social."
  - id: c
    text:
      es: "Ante el Instituto Nacional de la Seguridad Social."
  - id: d
    text:
      es: "Ante el Servicio Público de Empleo Estatal."
  explanation:
    es: "La solicitud del abono anticipado de la deducción por maternidad se dirige a la Agencia Estatal de Administración Tributaria (art. 81.4). La Tesorería General, el Instituto Nacional de la Seguridad Social y el Servicio Público de Empleo Estatal gestionan cotizaciones, pensiones y prestaciones, pero no este abono."
  citation: "art. 81.4 LIRPF"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0177
  prompt:
    es: "Según el artículo 96.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué rentas se computan en el límite conjunto de 1.600 euros anuales para no estar obligado a declarar?"
  options:
  - id: a
    text:
      es: "Los rendimientos íntegros del capital mobiliario y las ganancias patrimoniales no sometidos a retención ni ingreso a cuenta."
  - id: b
    text:
      es: "Los rendimientos íntegros del trabajo y las ganancias patrimoniales sometidos a retención o ingreso a cuenta."
  - id: c
    text:
      es: "Los rendimientos íntegros del capital inmobiliario y las imputaciones de rentas inmobiliarias sometidos a retención."
  - id: d
    correct: true
    text:
      es: "Los rendimientos íntegros del capital mobiliario y las ganancias patrimoniales sometidos a retención o ingreso a cuenta."
  explanation:
    es: "El límite de 1.600 euros agrupa los rendimientos del capital mobiliario y las ganancias patrimoniales sometidos a retención o ingreso a cuenta (art. 96.2.b). Si no están sometidos a retención, solo entran en el límite de la letra c) cuando son letras del Tesoro o ayudas públicas. Los rendimientos del trabajo tienen su límite propio de 22.000 euros, y el capital inmobiliario no figura en esta letra."
  citation: "art. 96.2.b) LIRPF"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0180
  prompt:
    es: "De acuerdo con el artículo 81 bis.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la deducción por ascendiente con discapacidad:"
  options:
  - id: a
    text:
      es: "Se aplica por cada ascendiente con discapacidad, aunque no tenga derecho al mínimo por ascendientes, hasta 1.200 euros anuales."
  - id: b
    correct: true
    text:
      es: "Se aplica por cada ascendiente con discapacidad con derecho a la aplicación del mínimo por ascendientes, hasta 1.200 euros anuales."
  - id: c
    text:
      es: "Se aplica por cada ascendiente con discapacidad con derecho al mínimo por ascendientes, hasta 600 euros anuales."
  - id: d
    text:
      es: "Se aplica por cada ascendiente con discapacidad con derecho al mínimo por ascendientes, hasta 3.000 euros anuales."
  explanation:
    es: "La deducción de la letra b) exige que el ascendiente con discapacidad dé derecho al mínimo por ascendientes y alcanza hasta 1.200 euros anuales (art. 81 bis.1.b). Prescindir de ese derecho amplía el supuesto. Los 600 euros son el incremento por hijo de familia numerosa y los 3.000 euros, el mínimo por discapacidad."
  citation: "art. 81 bis.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
