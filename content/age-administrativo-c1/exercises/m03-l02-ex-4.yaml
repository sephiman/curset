# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q065
  prompt:
    es: "¿Qué se entiende por comparecencia en la sede electrónica a efectos de la notificación electrónica, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "El acceso por el interesado o su representante debidamente identificado al contenido de la notificación."
  - id: b
    text:
      es: "La presencia física del interesado en la oficina de asistencia en materia de registro del órgano."
  - id: c
    text:
      es: "La puesta a disposición de la notificación en la sede electrónica de la Administración actuante."
  - id: d
    text:
      es: "La recepción en el dispositivo del interesado del aviso de puesta a disposición de la notificación."
  explanation:
    es: "El artículo 43.1 dice: «se entiende por comparecencia en la sede electrónica, el acceso por el interesado o su representante debidamente identificado al contenido de la notificación». Recibir el aviso no es acceder al contenido. La presencia en una oficina de registro es el supuesto de notificación no electrónica del artículo 41.1.a). La puesta a disposición es el paso previo al acceso, no la comparecencia."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q066
  prompt:
    es: "Una notificación electrónica se pone a disposición el martes 13 de octubre de 2026 y el interesado accede a su contenido el miércoles 21. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo se entiende practicada?"
  options:
  - id: a
    text:
      es: "El martes 13 de octubre de 2026."
  - id: b
    correct: true
    text:
      es: "El miércoles 21 de octubre de 2026."
  - id: c
    text:
      es: "El jueves 22 de octubre de 2026."
  - id: d
    text:
      es: "El viernes 23 de octubre de 2026."
  explanation:
    es: "El artículo 43.2 dice: «Las notificaciones por medios electrónicos se entenderán practicadas en el momento en que se produzca el acceso a su contenido». El acceso fue el miércoles 21. La puesta a disposición del martes 13 no es la práctica. El jueves 22 es sólo el día siguiente al acceso. El viernes 23 cierra los diez días naturales tras la puesta a disposición, que cuentan para el rechazo cuando nadie accede; aquí hubo acceso antes."
  citation: "art. 43.2 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q067
  prompt:
    es: "Una notificación electrónica obligatoria se pone a disposición el lunes 16 de noviembre de 2026. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál es el último día en que puede accederse a ella sin que se entienda rechazada?"
  options:
  - id: a
    text:
      es: "El lunes 23 de noviembre de 2026."
  - id: b
    correct: true
    text:
      es: "El jueves 26 de noviembre de 2026."
  - id: c
    text:
      es: "El lunes 30 de noviembre de 2026."
  - id: d
    text:
      es: "El martes 1 de diciembre de 2026."
  explanation:
    es: "El artículo 43.2 entiende rechazada la notificación obligatoria «cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido». Los días naturales incluyen sábados y domingos. Contados desde el día siguiente, martes 17, el décimo es el jueves 26 de noviembre. El lunes 30 resulta de contar diez días hábiles. El lunes 23 corresponde a cinco días hábiles y el martes 1 de diciembre, a quince naturales."
  citation: "art. 43.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q068
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la notificación electrónica se entiende rechazada a los diez días naturales sin acceso cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Sea de carácter obligatorio o haya sido expresamente elegida por el interesado."
  - id: b
    text:
      es: "Se haya enviado al interesado el aviso de su puesta a disposición en la sede electrónica."
  - id: c
    text:
      es: "Se haya intentado antes, sin éxito, la notificación en papel."
  - id: d
    text:
      es: "Contenga un acto de gravamen o desfavorable para el interesado o su representante."
  explanation:
    es: "El artículo 43.2 aplica el rechazo «cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado». El aviso no es requisito: su falta no impide la validez de la notificación (art. 41.6). El contenido del acto no cuenta. El artículo no exige un intento previo en papel."
  citation: "art. 43.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q069
  prompt:
    es: "Según el artículo 43.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, a efectos de las notificaciones, el Punto de Acceso General electrónico de la Administración funcionará como:"
  options:
  - id: a
    text:
      es: "Una sede electrónica."
  - id: b
    text:
      es: "Un registro electrónico general."
  - id: c
    text:
      es: "Una dirección electrónica habilitada única."
  - id: d
    correct: true
    text:
      es: "Un portal de acceso."
  explanation:
    es: "El artículo 43.4 dice que los interesados «podrán acceder a las notificaciones desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso». No lo define como sede electrónica, registro ni dirección electrónica habilitada única. La notificación se practica en la sede o en la dirección habilitada (art. 43.1)."
  citation: "art. 43.4 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-44
- id: m03-l02-q070
  prompt:
    es: "¿En cuál de los siguientes casos se hará la notificación por medio de un anuncio en el «Boletín Oficial del Estado», según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando, intentada la notificación, no se hubiese podido practicar."
  - id: b
    text:
      es: "Cuando la notificación contenga medios de pago a favor del interesado."
  - id: c
    text:
      es: "Cuando el interesado no haya comunicado un dispositivo para avisos."
  - id: d
    text:
      es: "Cuando el interesado o su representante rechace la notificación."
  explanation:
    es: "El artículo 44 prevé el anuncio en el «Boletín Oficial del Estado» cuando los interesados sean desconocidos, se ignore el lugar de la notificación o, «intentada ésta, no se hubiese podido practicar». El rechazo da por efectuado el trámite (art. 41.5). No comunicar un dispositivo sólo impide enviar el aviso. Los medios de pago obligan a notificar por medios no electrónicos (art. 41.2.b), no por anuncio."
  citation: "art. 44 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-45
- id: m03-l02-q071
  prompt:
    es: "De acuerdo con el artículo 45.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos integrantes de un procedimiento selectivo o de concurrencia competitiva:"
  options:
  - id: a
    text:
      es: "Se publicarán sólo cuando el número de aspirantes impida la notificación individual."
  - id: b
    correct: true
    text:
      es: "Serán objeto de publicación en todo caso, y esta surtirá los efectos de la notificación."
  - id: c
    text:
      es: "Serán objeto de publicación en todo caso, pero esta no sustituirá a la notificación."
  - id: d
    text:
      es: "Se publicarán sólo si lo prevén las bases, como complemento de la notificación individual."
  explanation:
    es: "El artículo 45.1 dice que, «en todo caso, los actos administrativos serán objeto de publicación, surtiendo ésta los efectos de la notificación», entre otros supuestos, cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva (letra b). La publicación no depende de las bases ni del número de aspirantes. Sustituye a la notificación, porque surte sus efectos."
  citation: "art. 45.1.b) LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-45
- id: m03-l02-q072
  prompt:
    es: "Según el artículo 45.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en cuál de los siguientes casos serán objeto de publicación en todo caso los actos administrativos?"
  options:
  - id: a
    text:
      es: "Cuando el acto sea de gravamen o desfavorable para más de un interesado."
  - id: b
    correct: true
    text:
      es: "Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas."
  - id: c
    text:
      es: "Cuando el acto ponga fin a la vía administrativa en un procedimiento iniciado de oficio."
  - id: d
    text:
      es: "Cuando el acto tenga por destinatarios a varios interesados identificados en el expediente."
  explanation:
    es: "El artículo 45.1.a) exige publicar «cuando el acto tenga por destinatario a una pluralidad indeterminada de personas». Varios interesados identificados no son una pluralidad indeterminada. Poner fin a la vía administrativa o ser un acto de gravamen no obliga a publicar."
  citation: "art. 45.1.a) LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q073
  prompt:
    es: "Según el artículo 41.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando el interesado o su representante rechace la notificación, se hará constar en el expediente:"
  options:
  - id: a
    text:
      es: "Y se dará traslado del rechazo al superior jerárquico del órgano que dictó el acto."
  - id: b
    correct: true
    text:
      es: "Especificando las circunstancias del intento de notificación y el medio empleado."
  - id: c
    text:
      es: "Y se suspenderá el plazo para resolver hasta que la notificación se practique."
  - id: d
    text:
      es: "Junto con la firma de dos testigos que hayan presenciado el rechazo del interesado."
  explanation:
    es: "El artículo 41.5 dice que el rechazo «se hará constar en el expediente, especificándose las circunstancias del intento de notificación y el medio, dando por efectuado el trámite y siguiéndose el procedimiento». No exige testigos ni traslado al superior. El procedimiento sigue: el rechazo no suspende el plazo para resolver."
  citation: "art. 41.5 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-45
- id: m03-l02-q074
  prompt:
    es: "¿Cuál de los siguientes actos será objeto de publicación en todo caso, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La resolución que concede una autorización a un solo interesado."
  - id: b
    correct: true
    text:
      es: "La relación de aspirantes admitidos en un procedimiento selectivo de ingreso."
  - id: c
    text:
      es: "El acuerdo que amplía el plazo de un procedimiento iniciado a solicitud."
  - id: d
    text:
      es: "La resolución del recurso de alzada interpuesto por un particular."
  explanation:
    es: "El artículo 45.1.b) exige publicar en todo caso los «actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo», y la relación de admitidos es uno de ellos. Una autorización para un solo interesado, la resolución de un recurso de un particular y la ampliación de plazo en un procedimiento a solicitud no están en el artículo 45.1 y se notifican."
  citation: "art. 45.1.b) LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q075
  prompt:
    es: "El representante de un interesado rechaza la notificación de un acto de trámite. Según el artículo 41.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene ese rechazo?"
  options:
  - id: a
    text:
      es: "El trámite sólo se da por efectuado si rechaza el propio interesado."
  - id: b
    text:
      es: "El plazo máximo para resolver queda suspendido hasta que se notifique al interesado."
  - id: c
    correct: true
    text:
      es: "El trámite se da por efectuado y el procedimiento sigue su curso."
  - id: d
    text:
      es: "El trámite se da por efectuado, pero el procedimiento queda en suspenso."
  explanation:
    es: "El artículo 41.5 se aplica «cuando el interesado o su representante rechace la notificación» y dice que se hará constar en el expediente, «dando por efectuado el trámite y siguiéndose el procedimiento». El rechazo del representante produce el mismo efecto que el del interesado. El artículo no suspende el plazo para resolver. Tampoco deja el procedimiento en suspenso: manda seguirlo."
  citation: "art. 41.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-98
- id: m03-l02-q076
  prompt:
    es: "Según el artículo 98.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál de las siguientes resoluciones queda exceptuada de la ejecutividad inmediata?"
  options:
  - id: a
    text:
      es: "La resolución sancionadora que ya es firme en vía administrativa."
  - id: b
    text:
      es: "La resolución que deniega una licencia solicitada por el interesado."
  - id: c
    text:
      es: "La resolución que pone fin a un procedimiento de responsabilidad patrimonial."
  - id: d
    correct: true
    text:
      es: "La resolución sancionadora contra la que aún cabe recurso potestativo de reposición."
  explanation:
    es: "El artículo 98.1.b) exceptúa de la ejecutividad inmediata la resolución de un procedimiento de naturaleza sancionadora «contra la que quepa algún recurso en vía administrativa, incluido el potestativo de reposición». La resolución sancionadora ya firme en vía administrativa no admite ese recurso ordinario y es inmediatamente ejecutiva. La denegación de una licencia y la resolución de responsabilidad patrimonial no son sancionadoras, y el artículo 98.1 no las exceptúa."
  citation: "art. 98.1.b) LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
