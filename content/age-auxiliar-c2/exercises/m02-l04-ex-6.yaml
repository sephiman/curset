# anchor: boe-a-2015-10565-art-43
- id: m02-l04-q042
  prompt:
    es: "Según el artículo 43.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo funcionará el Punto de Acceso General electrónico de la Administración respecto de las notificaciones?"
  options:
  - id: a
    text:
      es: "Como la única vía para practicar las notificaciones por medios electrónicos."
  - id: b
    text:
      es: "Como un registro en el que se anotan las notificaciones rechazadas."
  - id: c
    text:
      es: "Como la sede en la que se entienden practicadas todas las notificaciones."
  - id: d
    correct: true
    text:
      es: "Como un portal de acceso desde el que los interesados podrán acceder a ellas."
  explanation:
    es: "El artículo 43.4 dice que los interesados podrán acceder a las notificaciones desde el Punto de Acceso General, «que funcionará como un portal de acceso». Las notificaciones se practican en la sede o en la dirección electrónica habilitada única (art. 43.1), así que el Punto de Acceso General no es la única vía ni la sede donde se practican. Tampoco es un registro de notificaciones rechazadas."
  citation: "art. 43.4 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-7
- id: m02-l04-q044
  prompt:
    es: "De acuerdo con el artículo 7.4 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la Dirección Electrónica Habilitada única está alojada en la sede electrónica del Punto de Acceso General de:"
  options:
  - id: a
    text:
      es: "Cada una de las comunidades autónomas."
  - id: b
    correct: true
    text:
      es: "La Administración General del Estado."
  - id: c
    text:
      es: "Cada uno de los departamentos ministeriales."
  - id: d
    text:
      es: "Cada una de las entidades locales."
  explanation:
    es: "El artículo 7.4 se refiere al PAGe «de la Administración General del Estado» y dice que «en dicha sede electrónica está alojada la Dirección Electrónica Habilitada única». Cada Administración tiene su propio PAGe (art. 7.1), pero la Dirección Electrónica Habilitada única está alojada solo en la sede del estatal. No hay un PAGe por departamento ministerial."
  citation: "art. 7.4 RD 203/2021"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2014-10908-art-7
- id: m02-l04-q047
  prompt:
    es: "De acuerdo con el artículo 7.3 de la Orden HAP/1949/2014, de 13 de octubre, por la que se regula el Punto de Acceso General de la Administración General del Estado y se crea su sede electrónica, esta sede se considerará:"
  options:
  - id: a
    text:
      es: "Una sede electrónica asociada de cada departamento ministerial."
  - id: b
    text:
      es: "Una sede electrónica asociada de cada Delegación del Gobierno."
  - id: c
    correct: true
    text:
      es: "La sede central de la Administración General del Estado."
  - id: d
    text:
      es: "La sede de referencia de todas las Administraciones Públicas."
  explanation:
    es: "El artículo 7.3 dice que la sede electrónica del PAG «se considerará como la sede central de la Administración General del Estado». No es una sede asociada de los ministerios ni de las Delegaciones del Gobierno. Su ámbito es la Administración General del Estado y sus organismos (art. 7.2), no todas las Administraciones."
  citation: "art. 7.3 Orden HAP/1949/2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-pag-quienes-somos-html
- id: m02-l04-q049
  prompt:
    es: "Según la página «¿Quiénes somos?» del Punto de Acceso General, consultada el 16 de octubre de 2026, la gestión del Punto de Acceso General electrónico corresponde a:"
  options:
  - id: a
    text:
      es: "La Dirección General de la Función Pública."
  - id: b
    text:
      es: "La Dirección General del Patrimonio del Estado."
  - id: c
    correct: true
    text:
      es: "La Dirección General de Gobernanza Pública."
  - id: d
    text:
      es: "La Dirección General de Presupuestos."
  explanation:
    es: "La página dice que la gestión del PAGe «corresponde a la Dirección General de Gobernanza Pública», a través de la Subdirección General de Transparencia y Atención al Ciudadano. La Dirección General de la Función Pública, la del Patrimonio del Estado y la de Presupuestos no aparecen en la página como gestoras."
  citation: "fuente: `pag-quienes-somos.html`"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-13
- id: m02-l04-q132
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes tienen capacidad de obrar ante las Administraciones Públicas son titulares del derecho a comunicarse con ellas a través de:"
  options:
  - id: a
    text:
      es: "Una dirección electrónica habilitada única."
  - id: b
    text:
      es: "Una sede electrónica asociada de cada Ministerio."
  - id: c
    correct: true
    text:
      es: "Un Punto de Acceso General electrónico de la Administración."
  - id: d
    text:
      es: "Un registro electrónico único de ámbito estatal."
  explanation:
    es: "El derecho de la letra a) es comunicarse a través de un Punto de Acceso General electrónico de la Administración. El registro único, la dirección habilitada y las sedes asociadas no son el medio que fija ese derecho."
  citation: "art. 13.a) LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-53
- id: m02-l04-q133
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes se relacionan con las Administraciones por medios electrónicos tienen derecho a consultar en el Punto de Acceso General electrónico el estado de la tramitación, el órgano competente, los actos de trámite dictados y:"
  options:
  - id: a
    text:
      es: "Los recursos que procedan contra cada acto de trámite dictado por el órgano instructor."
  - id: b
    correct: true
    text:
      es: "El sentido del silencio administrativo que corresponda si no se dicta ni notifica resolución en plazo."
  - id: c
    text:
      es: "El plazo máximo de duración de la fase de instrucción del procedimiento y sus ampliaciones."
  - id: d
    text:
      es: "La identidad de los demás interesados que consten en el expediente administrativo."
  explanation:
    es: "El Punto de Acceso General permite consultar también el sentido del silencio administrativo que corresponda. Los plazos de instrucción, los recursos contra actos de trámite y la identidad de los demás interesados no figuran en esa lista."
  citation: "art. 53.1.a) LPAC"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-53
- id: m02-l04-q134
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se entiende cumplida la obligación de facilitar copias de los documentos de un procedimiento con su puesta a disposición en el Punto de Acceso General electrónico de la Administración competente o en:"
  options:
