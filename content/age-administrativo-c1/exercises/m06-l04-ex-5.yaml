    correct: true
    text:
      es: "En línea con el texto"
  - id: d
    text:
      es: "Arriba y abajo"
  explanation:
    es: "La página dice: «Los anclajes no aparecen para las imágenes incorporadas», las que están «en línea con el texto» y se tratan como cualquier carácter de texto. Cuadrado, Detrás del texto y Arriba y abajo aparecen en la lista de ajustes que la página dice que «se anclan a una ubicación específica del documento», así que en las tres hay anclaje."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q212
  prompt:
    es: "Señale cómo se comporta una imagen en línea con el texto en Word 365, según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Se ancla al párrafo anterior y se puede bloquear su anclaje"
  - id: b
    text:
      es: "Se coloca en una posición absoluta de la página, en centímetros"
  - id: c
    text:
      es: "Se ancla a una ubicación específica sin asociarse a un párrafo"
  - id: d
    correct: true
    text:
      es: "Se considera un carácter de texto, vinculado a donde se insertó"
  explanation:
    es: "La página dice: «los objetos alineados están vinculados a la ubicación del texto donde se insertaron y se consideran como cualquier carácter de texto». El bloqueo del anclaje no está disponible para imágenes alineadas con el texto. Está vinculada a la ubicación del texto donde se insertó. Las imágenes con otros ajustes se anclan y el anclaje indica el párrafo asociado."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q213
  prompt:
    es: "En Word 365, ¿qué hace la opción Mover con texto, tras seleccionar Cuadrado en Con ajuste de texto?"
  options:
  - id: a
    correct: true
    text:
      es: "La imagen sube o baja al agregar o quitar texto"
  - id: b
    text:
      es: "La imagen permanece en un punto fijo de la página"
  - id: c
    text:
      es: "La imagen pasa a estar en línea con el texto"
  - id: d
    text:
      es: "La imagen se agrupa con las demás imágenes de la página"
  explanation:
    es: "La página dice: «Para ajustar el texto alrededor de la imagen, pero hacer que la imagen se mueva hacia arriba o hacia abajo a medida que se agrega o elimina texto, seleccione Cuadrado y, después, seleccione Mover con texto». Mantener la imagen en un punto determinado de la página es Corregir posición en la página. La imagen sigue ajustada con Cuadrado y se mueve con el texto. Mover con texto hace que la imagen suba o baje con el texto."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Cambiar las opciones de diseño de imagen»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q216
  prompt:
    es: "Según la página de Microsoft sobre imágenes, ¿para qué se bloquea el anclaje de una imagen en Word 365?"
  options:
  - id: a
    text:
      es: "Para poder eliminar el anclaje cuando ya no se necesite en el documento"
  - id: b
    text:
      es: "Para que se pueda agrupar con otras imágenes que estén en línea con el texto"
  - id: c
    text:
      es: "Para que se mueva con el texto al agregar o quitar párrafos del documento"
  - id: d
    correct: true
    text:
      es: "Para que permanezca en la misma ubicación aunque se elimine el texto a su alrededor"
  explanation:
    es: "La página dice: «Para asegurarse de que una imagen permanezca en la misma ubicación, aunque se elimine el texto a su alrededor, puede bloquear su anclaje». Los anclajes no se pueden quitar; bloquearlos sirve para mantener la imagen en su ubicación. El bloqueo del anclaje no está disponible para imágenes en línea con el texto. Moverse con el texto es lo que hace Mover con texto."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q217
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas de la cinta de opciones da acceso a Captura de pantalla?"
  options:
  - id: a
    correct: true
    text:
      es: "Insertar › Ilustraciones › Captura de pantalla"
  - id: b
    text:
      es: "Inicio › Ilustraciones › Captura de pantalla"
  - id: c
    text:
      es: "Insertar › Grupo Imágenes › Captura de pantalla"
  - id: d
    text:
      es: "Revisar › Ilustraciones › Captura de pantalla"
  explanation:
    es: "La página dice: «En Excel, Outlook y Word: En la pestaña Insertar, en el grupo Ilustraciones, haga clic en Captura de pantalla». Inicio y Revisar son otras pestañas, y no son las que la página nombra para Word. Y Insertar con el grupo Imágenes es la ruta de PowerPoint, que la página da en una frase aparte: «En PowerPoint: En la pestaña Insertar, en el grupo Imágenes»."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 2
  tags:
  - "ofimática-menú"
