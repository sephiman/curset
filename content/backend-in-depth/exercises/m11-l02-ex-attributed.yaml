type: quiz
variants:
- id: m11-l02-qa01
  prompt:
    en: According to Martin Fowler in Code Smell, which description of a code smell does he give in the quick definition
      that opens the page?
  options:
  - id: a
    correct: true
    text:
      en: A surface indication that usually corresponds to a deeper problem
  - id: b
    text:
      en: A confirmed defect in the code that always calls for refactoring
  - id: c
    text:
      en: A subtle flaw in the code that takes a long analysis by experts to notice
  - id: d
    text:
      en: The underlying design problem itself, such as a long method
  explanation:
    en: Fowler defines a code smell as a surface indication that usually corresponds to a deeper problem in the
      system. Fowler rules out a confirmed defect that always calls for refactoring, because he writes that smells
      do not always indicate a problem. He rules out a flaw that takes long analysis to notice, because he writes
      that a smell is by definition something quick to spot. He rules out the underlying design problem itself,
      because he writes that smells are often an indicator of a problem rather than the problem itself.
  citation: fowler-code-smell#banner
- id: m11-l02-qa02
  prompt:
    en: According to Google in What to look for in a code review, what should a reviewer do when the change shows
      over-engineering, a particular type of complexity?
  options:
  - id: a
    text:
      en: Encourage developers to make the code generic enough for future needs
  - id: b
    correct: true
    text:
      en: Encourage developers to solve the problem known to need solving now
  - id: c
    text:
      en: Encourage developers to solve the future problem as early as they can
  - id: d
    text:
      en: Treat over-engineering as a minor concern that needs no special attention
  explanation:
    en: The page tells reviewers to encourage developers to solve the problem they know needs to be solved now,
      not the one they speculate might need solving in the future. The page rules out making the code generic enough
      for future needs, because it describes over-engineering as code made more generic than it needs to be or given
      functionality not presently needed. It rules out solving the future problem as early as possible, because
      it says that problem should be solved once it arrives and its actual shape and requirements can be seen. It
      rules out treating over-engineering as a minor concern, because it says reviewers should be especially vigilant
      about it.
  citation: google-eng-practices-looking-for#complexity
  extract:
    en: Encourage developers to solve the problem they know needs to be solved now, not the problem that the developer
      speculates might need to be solved in the future.
