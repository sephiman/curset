# anchor: fuente-apache-httpd-about-html
- id: m02-l12-q231
  prompt:
    es: "¿Cuál de los siguientes años es el del lanzamiento de Apache 1.0, según la página oficial del proyecto?"
  options:
  - id: a
    text:
      es: "1996, año en que superó al httpd de NCSA como servidor número uno"
  - id: b
    text:
      es: "1994, año en que Rob McCool dejó el NCSA"
  - id: c
    correct: true
    text:
      es: "1995, el 1 de diciembre"
  - id: d
    text:
      es: "1999, año en que se formó la Apache Software Foundation"
  explanation:
    es: "La página dice que Apache 1.0 se publicó el 1 de diciembre de 1995. «1996, año en que superó al httpd de NCSA como servidor número uno» es el año de la encuesta de Netcraft en que Apache superó al httpd del NCSA, menos de un año después de formarse el grupo. «1999, año en que se formó la Apache Software Foundation» es el año en que miembros del grupo Apache formaron la fundación. «1994, año en que Rob McCool dejó el NCSA» es el año de mediados de 1994 en que Rob McCool dejó el NCSA y se estancó su httpd."
  citation: "fuente: `apache-httpd-about.html`; «How Apache Came to Be»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-apache-httpd-about-html
- id: m02-l12-q232
  prompt:
    es: "Señale quién gestiona conjuntamente el proyecto Apache HTTP Server, el servidor web de código libre, según su página oficial:"
  options:
  - id: a
    correct: true
    text:
      es: "Un grupo de voluntarios repartidos por el mundo, que se comunican por Internet"
  - id: b
    text:
      es: "El W3C, con sus miembros y su personal"
  - id: c
    text:
      es: "Un organismo público de Estados Unidos que financia el desarrollo del servidor web"
  - id: d
    text:
      es: "Una empresa comercial que vende licencias del servidor"
  explanation:
    es: "El proyecto lo gestiona conjuntamente un grupo de voluntarios del mundo, que usan Internet y la Web para comunicarse y planificar. «Una empresa comercial que vende licencias del servidor» contradice la página, que habla de una implementación de código fuente libre y disponible gratuitamente. «El W3C, con sus miembros y su personal»: el W3C desarrolla estándares web; Apache forma parte de la Apache Software Foundation. «Un organismo público de Estados Unidos que financia el desarrollo del servidor web»: la página habla de un grupo de voluntarios, no de un organismo público."
  citation: "fuente: `apache-httpd-about.html`; «What is the Apache HTTP Server Project?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-wordpress-cms-html
- id: m02-l12-q233
  prompt:
    es: "Según su página oficial en español, ¿cómo se presenta WordPress, uno de los sistemas de gestión de contenidos más conocidos?"
  options:
  - id: a
    correct: true
    text:
      es: "Como herramienta de blog, plataforma de publicación y CMS"
  - id: b
    text:
      es: "Como buscador que rastrea e indexa las páginas de Internet"
  - id: c
    text:
      es: "Como servidor web de código fuente libre para HTTP"
  - id: d
    text:
      es: "Como navegador con extensiones y ventanas InPrivate"
  explanation:
    es: "La página oficial de WordPress en español lo presenta como herramienta de blog, plataforma de publicación y CMS. «Como servidor web de código fuente libre para HTTP» es la descripción de Apache HTTP Server, según su página oficial. «Como navegador con extensiones y ventanas InPrivate» es el modo de presentarse de Microsoft Edge, no de WordPress. «Como buscador que rastrea e indexa las páginas de Internet» corresponde a la Búsqueda de Google, según su guía de funcionamiento."
  citation: "fuente: `wordpress-cms.html`; «Herramienta de blog, plataforma de publicación y CMS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-wordpress-cms-html
- id: m02-l12-q234
  prompt:
    es: "Según su página oficial en español, ¿cómo describe WordPress su carácter como plataforma de publicación?"
  options:
  - id: a
    text:
      es: "Exclusiva para blogs, sin posibilidad de añadir una tienda"
  - id: b
    text:
      es: "Propietaria, con licencia de pago para cada sitio"
  - id: c
    text:
      es: "Dirigida solo a desarrolladores que programan el diseño a mano de cada sitio"
  - id: d
    correct: true
    text:
      es: "De código abierto, elegida por millones de webs de todo el mundo"
  explanation:
    es: "La página la define como plataforma de código abierto elegida por millones de webs, desde creadores y pequeños negocios hasta grandes empresas. «Propietaria, con licencia de pago para cada sitio» contradice la página: es de código abierto. «Exclusiva para blogs, sin posibilidad de añadir una tienda»: la página dice que se puede añadir una tienda, analítica o boletines con plugins. «Dirigida solo a desarrolladores que programan el diseño a mano de cada sitio»: la página dice que se puede diseñar cualquier web sin programar."
  citation: "fuente: `wordpress-cms.html`; «Herramienta de blog, plataforma de publicación y CMS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q276
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a una LAN, o red de área local, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Una extensión segura de una red local sobre una red pública como Internet mediante autentificación y cifrado"
  - id: b
    correct: true
    text:
      es: "Una red informática de pequeña amplitud geográfica, limitada a una oficina o un edificio"
  - id: c
    text:
      es: "Una familia de protocolos sobre los que funciona Internet"
  - id: d
    text:
      es: "Un dispositivo que distribuye el tráfico entre dos o más redes distintas"
  explanation:
    es: "INCIBE define la LAN como una red informática de pequeña amplitud geográfica, limitada a una oficina, una vivienda o un edificio. «Una extensión segura de una red local sobre una red pública como Internet mediante autentificación y cifrado» es la definición de una red privada virtual (VPN). «Un dispositivo que distribuye el tráfico entre dos o más redes distintas» es la definición de un router. «Una familia de protocolos sobre los que funciona Internet» es la definición de TCP/IP."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.12.1. LAN»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q277
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe la diferencia entre las redes de área local cableadas y las inalámbricas, según el glosario de INCIBE?"
  options:
  - id: a
    text:
      es: "Las cableadas permiten la movilidad total, a costa de una menor velocidad"
  - id: b
    text:
      es: "Las inalámbricas suelen ser más rápidas y seguras, pero impiden la movilidad"
  - id: c
    text:
      es: "Ambas ofrecen la misma velocidad y seguridad; solo cambia el alcance geográfico"
  - id: d
    correct: true
    text:
      es: "Las cableadas suelen ser más rápidas y seguras, pero impiden la movilidad"
  explanation:
    es: "INCIBE indica que, por lo general, las redes cableadas son más rápidas y seguras, pero impiden la movilidad de los dispositivos. «Las inalámbricas suelen ser más rápidas y seguras, pero impiden la movilidad» invierte lo que dice el glosario: la mayor velocidad y seguridad es de las cableadas. «Las cableadas permiten la movilidad total, a costa de una menor velocidad» contradice el glosario: las cableadas impiden la movilidad. «Ambas ofrecen la misma velocidad y seguridad; solo cambia el alcance geográfico»: el glosario distingue ambas redes por velocidad, seguridad y movilidad, no por el alcance."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.12.1. LAN»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q278
  prompt:
    es: "Según el glosario de INCIBE, ¿con qué se protegen la integridad y la confidencialidad de los datos en una red privada virtual (VPN)?"
  options:
  - id: a
    text:
      es: "Con el envío de la información en texto claro"
  - id: b
    text:
      es: "Con la retransmisión desde el origen de los paquetes perdidos"
  - id: c
    correct: true
    text:
      es: "Con la autentificación y el cifrado"
  - id: d
    text:
      es: "Con la traducción de los nombres de dominio en direcciones IP"
  explanation:
    es: "Al establecer una VPN, la integridad y la confidencialidad se protegen mediante la autentificación y el cifrado. «Con el envío de la información en texto claro» es lo que hace HTTP, y por eso cualquiera que intercepte el tráfico puede leerlo. «Con la retransmisión desde el origen de los paquetes perdidos» es el modo de trabajar de la red por el principio de mejor esfuerzo, no una protección de los datos. «Con la traducción de los nombres de dominio en direcciones IP» es la función más importante del DNS, no una protección de la VPN."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.17.3. Red privada virtual»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q279
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a una red privada virtual (VPN) entre dos redes LAN, según el glosario de INCIBE?"
  options:
  - id: a
    text:
      es: "Una conexión física dedicada entre las dos redes, sin pasar por Internet"
  - id: b
    correct: true
    text:
      es: "Una conexión virtual punto a punto sobre una red pública, segura gracias al cifrado"
  - id: c
    text:
      es: "Una conexión sin autenticación en la que cualquiera puede leer los datos"
  - id: d
    text:
      es: "Una conexión que traduce los nombres de dominio de una red en direcciones IP de la otra"
  explanation:
    es: "Según INCIBE, es una conexión virtual punto a punto entre dos redes LAN que usa una red pública como Internet y se hace segura con el cifrado. «Una conexión física dedicada entre las dos redes, sin pasar por Internet» contradice el glosario: la conexión es virtual y usa una red pública como Internet. «Una conexión sin autenticación en la que cualquiera puede leer los datos» contradice el glosario: la VPN protege la confidencialidad con autentificación y cifrado. «Una conexión que traduce los nombres de dominio de una red en direcciones IP de la otra»: traducir nombres en direcciones IP es la función del DNS, no la de una VPN."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.17.3. Red privada virtual»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q280
  prompt:
    es: "Según el glosario de INCIBE, ¿qué técnica, muy usada en las redes privadas virtuales, encapsula un protocolo de red sobre otro?"
  options:
  - id: a
    correct: true
    text:
      es: "El túnel de comunicación"
  - id: b
    text:
      es: "La fragmentación de datagramas"
  - id: c
    text:
      es: "El proxy intermediario de la red local"
  - id: d
    text:
      es: "El sniffer que captura paquetes de la red"
  explanation:
    es: "El túnel es la técnica que encapsula un protocolo de red sobre otro, y destaca en las redes privadas virtuales. «La fragmentación de datagramas» divide los datagramas cuando cruzan una red que limita el tamaño de los paquetes, según el RFC 791. «El proxy intermediario de la red local» es el equipo o programa que hace de intermediario en las peticiones de la red local hacia Internet. «El sniffer que captura paquetes de la red» es un programa que monitoriza la información que circula por la red para capturarla."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.6. Túnel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q281
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al término B2C, abreviatura de «Business to Consumer», según el glosario de INCIBE?"
  options:
  - id: a
    text:
      es: "La que identifica con un número único a todo sistema conectado a una red"
  - id: b
    text:
      es: "La que traduce nombres inteligibles para las personas en direcciones IP"
  - id: c
    correct: true
    text:
      es: "La de las empresas para llegar directamente al consumidor final"
  - id: d
    text:
      es: "La que distingue si el usuario es un humano o un bot"
  explanation:
    es: "B2C es la estrategia de las empresas para llegar directamente al cliente o consumidor final, y designa también las transacciones sin intermediario. «La que distingue si el usuario es un humano o un bot» es la función de un CAPTCHA. «La que identifica con un número único a todo sistema conectado a una red» es la función de una dirección IP. «La que traduce nombres inteligibles para las personas en direcciones IP» es la función más importante del DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.2.2. B2C»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q282
  prompt:
    es: "Según el glosario de términos de ciberseguridad de INCIBE, ¿qué significa en español el acrónimo CAPTCHA, una medida de seguridad?"
  options:
  - id: a
    correct: true
    text:
      es: "Prueba de Turing completamente automática y pública para diferenciar ordenadores de humanos"
  - id: b
    text:
      es: "Localizador uniforme de recursos que identifica un contenido en Internet"
  - id: c
    text:
      es: "Protocolo seguro de transferencia de hipertexto para proteger los datos"
  - id: d
    text:
      es: "Servicio de nombres de dominio que localiza los sistemas de la red"
  explanation:
    es: "CAPTCHA es la prueba de Turing completamente automática y pública para diferenciar ordenadores de humanos. «Protocolo seguro de transferencia de hipertexto para proteger los datos» es la definición de HTTPS. «Servicio de nombres de dominio que localiza los sistemas de la red» es la definición del DNS. «Localizador uniforme de recursos que identifica un contenido en Internet» es la definición de una URL."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.3.2. Captcha»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q283
  prompt:
    es: "Según el glosario de INCIBE, ¿qué servicio permite localizar la dirección IP del contenido al que apunta una URL?"
  options:
  - id: a
    text:
      es: "El SMTP, servicio de envío de correo"
  - id: b
    correct: true
    text:
      es: "El DNS, servicio de nombres de dominio"
  - id: c
    text:
      es: "El DHCP, servicio de configuración automática"
  - id: d
    text:
      es: "El FTP, servicio de transferencia de ficheros"
  explanation:
    es: "Una URL da acceso a un recurso gracias a su dirección única y al servicio DNS, que localiza la dirección IP del contenido. «El FTP, servicio de transferencia de ficheros» sirve para descargar archivos de un servidor o enviárselos, según el glosario. «El SMTP, servicio de envío de correo» es el protocolo para enviar correo, según el glosario. «El DHCP, servicio de configuración automática»: proporciona automáticamente a cada host su dirección IP y su configuración de red, según Microsoft."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.20.1. URL»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q284
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe la diferencia entre una dirección IP pública y una privada, según el glosario de INCIBE?"
  options:
  - id: a
    text:
      es: "La pública se escribe con puntos y la privada con dos puntos"
  - id: b
    text:
      es: "La pública usa la versión v4 y la privada usa la versión v6"
  - id: c
    text:
      es: "La pública identifica a un solo sistema y la privada a varios a la vez, aunque ambas sean números únicos"
  - id: d
    correct: true
    text:
      es: "La pública es accesible desde cualquier sistema conectado a Internet; la privada, solo desde su red LAN"
  explanation:
    es: "INCIBE llama públicas a las direcciones accesibles desde cualquier sistema conectado a Internet y privadas a las internas de una red LAN. «La pública usa la versión v4 y la privada usa la versión v6»: la versión (v4 o v6) no distingue la dirección pública de la privada. «La pública identifica a un solo sistema y la privada a varios a la vez, aunque ambas sean números únicos»: el glosario dice que la IP es un número único e irrepetible que identifica a todo sistema conectado a una red, sea pública o privada. «La pública se escribe con puntos y la privada con dos puntos»: los puntos de la v4 y los dos puntos de la v6 dependen de la versión de la dirección, no de si es pública o privada."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q285
  prompt:
    es: "Según el glosario de INCIBE, ¿entre qué valores va cada uno de los cuatro números de una dirección IP en su versión v4?"
  options:
  - id: a
    text:
      es: "Del 0 al 127"
  - id: b
    text:
      es: "Del 0 al 1023"
  - id: c
    correct: true
    text:
      es: "Del 0 al 255"
  - id: d
    text:
      es: "Del 1 al 254"
  explanation:
    es: "INCIBE describe la dirección v4 como cuatro números del 0 al 255 separados por puntos. «Del 1 al 254» deja fuera el 0 y el 255, que el glosario incluye. «Del 0 al 127» es la mitad del rango que indica el glosario. «Del 0 al 1023» supera el máximo de 255 que indica el glosario."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q287
  prompt:
    es: "Según el glosario de INCIBE, ¿qué usa SSL para garantizar la autenticación y la seguridad de su clave simétrica?"
  options:
  - id: a
    text:
      es: "Una cookie guardada en el equipo del usuario"
  - id: b
    correct: true
    text:
      es: "Algoritmos de cifrado asimétrico y certificados X.509"
  - id: c
    text:
      es: "Una prueba de desafío-respuesta controlada por máquinas"
  - id: d
    text:
      es: "Un segundo algoritmo simétrico con una clave de mayor longitud"
  explanation:
    es: "SSL cifra con una clave simétrica y garantiza su autenticación y seguridad con algoritmos asimétricos y certificados X.509. «Un segundo algoritmo simétrico con una clave de mayor longitud»: el glosario reserva el cifrado simétrico para la confidencialidad y usa el asimétrico para la clave. «Una cookie guardada en el equipo del usuario»: una cookie es un pequeño fichero que el sitio guarda en el equipo para consultar la actividad previa, sin relación con SSL. «Una prueba de desafío-respuesta controlada por máquinas» es el CAPTCHA, que determina si el usuario es un humano o un bot."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.18.24. SSL»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q288
  prompt:
    es: "Señale para qué tipo de servicios resulta adecuado usar el protocolo HTTPS, según el glosario de INCIBE:"
  options:
  - id: a
    text:
      es: "Solo las páginas estáticas sin ningún dato del usuario"
  - id: b
    text:
      es: "Solo el envío de correo entre servidores, mediante SMTP"
  - id: c
    text:
      es: "Únicamente la transferencia de ficheros entre cliente y servidor FTP de cualquier sistema operativo"
  - id: d
    correct: true
    text:
      es: "Los que requieren datos personales o contraseñas, como bancos y tiendas en línea"
  explanation:
    es: "HTTPS se usa en cualquier servicio que requiera datos personales o contraseñas, como entidades bancarias, tiendas en línea o pago seguro. «Solo el envío de correo entre servidores, mediante SMTP»: SMTP es el protocolo de envío de correo; HTTPS lo usa cualquier servicio con datos personales o contraseñas. «Solo las páginas estáticas sin ningún dato del usuario» contradice el glosario, que lo asocia a servicios con datos personales y contraseñas. «Únicamente la transferencia de ficheros entre cliente y servidor FTP de cualquier sistema operativo»: FTP es un servicio de transferencia de ficheros distinto, y HTTPS no se limita a él."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.9. HTTPS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q289
  prompt:
    es: "Según el glosario de INCIBE, ¿cuál de los siguientes protocolos forma parte de la familia TCP/IP, junto a ICMP, DNS, HTTP y FTP?"
  options:
  - id: a
    correct: true
    text:
      es: "UDP"
  - id: b
    text:
      es: "NCP"
  - id: c
    text:
      es: "IMP"
  - id: d
    text:
      es: "NSFNET"
  explanation:
    es: "El glosario cita entre los protocolos de la familia TCP/IP el ICMP, el UDP, el DNS, el HTTP y el FTP. «NCP» fue el protocolo de host a host de ARPANET que TCP/IP sustituyó el 1 de enero de 1983. «IMP» no es un protocolo: los IMP eran los conmutadores de paquetes de ARPANET. «NSFNET» no es un protocolo: es el programa de la NSF que hizo obligatorio TCP/IP."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.2. TCP/IP»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q305
  prompt:
    es: "¿Cuál de las siguientes consecuencias tiene un error de sintaxis menor en un documento transmitido con un tipo MIME de XML, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    text:
      es: "Se ignora, igual que en la sintaxis HTML"
  - id: b
    text:
      es: "Se procesa como si fuera un documento text/html"
  - id: c
    text:
      es: "El navegador lo corrige y avisa al autor"
  - id: d
    correct: true
    text:
      es: "Impide que el documento se muestre por completo"
  explanation:
    es: "En un documento etiquetado como XML, incluso un error de sintaxis menor impide que se represente por completo. «Se ignora, igual que en la sintaxis HTML» es lo que ocurre en la sintaxis HTML, no en la XML. «El navegador lo corrige y avisa al autor»: el estándar no dice que el navegador corrija y avise; dice que el documento no se representa por completo. «Se procesa como si fuera un documento text/html»: un documento transmitido con tipo MIME de XML se procesa como XML; text/html es el tipo de la sintaxis HTML."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.10 A quick introduction to HTML»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q306
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde al DOM de HTML, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    correct: true
    text:
      es: "La representación en memoria de un documento, organizada como un árbol"
  - id: b
    text:
      es: "El lenguaje de marcado principal de la World Wide Web"
  - id: c
    text:
      es: "El esquema de petición y respuesta entre navegador y servidor"
  - id: d
    text:
      es: "Un pequeño programa que se inserta con el elemento script"
  explanation:
    es: "El DOM es la representación en memoria de un documento HTML, un árbol de nodos que construyen los navegadores al leer el marcado. «El lenguaje de marcado principal de la World Wide Web» es HTML, el lenguaje de marcado principal de la Web. «Un pequeño programa que se inserta con el elemento script» es un script, que puede manipular el árbol DOM. «El esquema de petición y respuesta entre navegador y servidor» es el esquema de HTTP, según INCIBE."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.10 A quick introduction to HTML»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q307
  prompt:
    es: "¿Cuál es el elemento raíz del árbol DOM de un documento HTML, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    text:
      es: "El elemento script"
  - id: b
    text:
      es: "El elemento head"
  - id: c
    correct: true
    text:
      es: "El elemento html"
  - id: d
    text:
      es: "El elemento body"
  explanation:
    es: "El elemento de documento del árbol es el elemento html, que siempre ocupa esa posición y contiene head y body. «El elemento body» es hijo de html, no la raíz. «El elemento head» es hijo de html, no la raíz. «El elemento script» es un elemento que va dentro del documento, no su raíz."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.10 A quick introduction to HTML»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q308
  prompt:
    es: "Según la sección sobre scripting del estándar HTML, ¿para qué sirven los scripts que se añaden a un documento?"
  options:
  - id: a
    text:
      es: "Para cifrar la comunicación entre el navegador y el servidor"
  - id: b
    correct: true
    text:
      es: "Para añadir interactividad a los documentos"
  - id: c
    text:
      es: "Para traducir los nombres de dominio en direcciones IP"
  - id: d
    text:
      es: "Para describir semánticamente documentos científicos"
  explanation:
    es: "Los scripts permiten a los autores añadir interactividad a sus documentos. «Para describir semánticamente documentos científicos» es el propósito original de HTML como lenguaje de marcado, no de los scripts. «Para cifrar la comunicación entre el navegador y el servidor»: el cifrado lo aporta HTTPS, según INCIBE. «Para traducir los nombres de dominio en direcciones IP» es la función del DNS, según INCIBE."
  citation: "fuente: `whatwg-html-scripting.html`; «4.12 Scripting»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q309
  prompt:
    es: "¿Cuál de las siguientes pautas recomienda el estándar HTML para las aplicaciones cuando falta el soporte de scripts o el usuario los ha desactivado?"
  options:
  - id: a
    text:
      es: "Que muestren una página de error hasta que se activen los scripts en el navegador del usuario"
  - id: b
    text:
      es: "Que oculten todo el contenido que dependa de un script"
  - id: c
    text:
      es: "Que usen siempre scripts en lugar de alternativas declarativas"
  - id: d
    correct: true
    text:
      es: "Que se degraden con elegancia, con enlaces que funcionen pidiendo datos al servidor"
  explanation:
    es: "El estándar anima a que las aplicaciones se degraden con elegancia en ausencia de scripts, y pone el ejemplo del enlace que pide al servidor la tabla ordenada. «Que muestren una página de error hasta que se activen los scripts en el navegador del usuario» contradice el estándar, que pide funcionar de forma degradada y no dejar de funcionar. «Que usen siempre scripts en lugar de alternativas declarativas»: el estándar anima a usar alternativas declarativas siempre que sea posible, porque son más fáciles de mantener y muchos usuarios desactivan los scripts. «Que oculten todo el contenido que dependa de un script»: el estándar pide que el contenido siga siendo utilizable sin scripts, no que se oculte."
  citation: "fuente: `whatwg-html-scripting.html`; «4.12 Scripting»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q310
  prompt:
    es: "Según el estándar HTML, ¿qué representa el elemento noscript cuando el navegador tiene el scripting activado?"
  options:
  - id: a
    correct: true
    text:
      es: "No representa nada"
  - id: b
    text:
      es: "Un botón para hacer el cálculo en el servidor"
  - id: c
    text:
      es: "Sus elementos hijos, igual que cuando está desactivado"
  - id: d
    text:
      es: "El código del script que se ejecutará"
  explanation:
    es: "Con el scripting activado, noscript no representa nada; con el scripting desactivado representa a sus hijos. «Sus elementos hijos, igual que cuando está desactivado» es lo que representa cuando el scripting está desactivado. «El código del script que se ejecutará»: el código del script lo contiene el elemento script, no noscript. «Un botón para hacer el cálculo en el servidor» es el contenido del ejemplo del estándar, que solo aparece cuando los scripts están desactivados."
  citation: "fuente: `whatwg-html-scripting.html`; «4.12.2 The noscript element»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q311
  prompt:
    es: "¿Qué atributo del elemento script hace que el script se ejecute en cuanto esté disponible, sin bloquear mientras se descarga?"
  options:
  - id: a
    text:
      es: "defer"
  - id: b
    correct: true
    text:
      es: "async"
  - id: c
    text:
      es: "src"
  - id: d
    text:
      es: "nomodule"
  explanation:
    es: "El atributo async ejecuta el script cuando está disponible, sin bloquear mientras se obtiene. «defer»: aplaza la ejecución del script. «src» indica la dirección del recurso del script. «nomodule»: impide la ejecución en los agentes de usuario que admiten scripts de módulo."
  citation: "fuente: `whatwg-html-scripting.html`; «4.12.1 The script element»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q315
  prompt:
    es: "¿Cuál de las siguientes ventajas tiene el diseño adaptable para el posicionamiento en buscadores, según el Servicio Web del Gobierno Vasco?"
  options:
  - id: a
    correct: true
    text:
      es: "Evita duplicar contenidos y las penalizaciones de SEO, y Google da relevancia a los sitios adaptados"
  - id: b
    text:
      es: "Elimina la necesidad de usar estándares web como HTML5 y CSS3"
  - id: c
    text:
      es: "Garantiza el primer puesto en los resultados de los buscadores"
  - id: d
    text:
      es: "Obliga a mantener una versión del sitio para cada dispositivo, cada una con su posición en los buscadores"
  explanation:
    es: "Al evitar duplicidades de contenido se evitan penalizaciones de SEO, y Google da relevancia a los sitios adaptados a distintos dispositivos. «Obliga a mantener una versión del sitio para cada dispositivo, cada una con su posición en los buscadores» contradice la definición de diseño adaptable, que evita duplicar sitios para dispositivos concretos. «Garantiza el primer puesto en los resultados de los buscadores»: la guía de Google dice que no garantiza rastrear, indexar ni servir una página, y menos un primer puesto. «Elimina la necesidad de usar estándares web como HTML5 y CSS3»: la página basa la adaptabilidad de sus portales en estándares web como HTML5 y CSS3."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 2
  tags:
  - "concepto"
