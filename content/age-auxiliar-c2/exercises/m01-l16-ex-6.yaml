# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q098
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las acciones que deliberadamente generen un grave perjuicio económico o profesional para las personas con discapacidad constituyen infracción:"
  options:
  - id: a
    text:
      es: "Grave."
  - id: b
    text:
      es: "Leve."
  - id: c
    correct: true
    text:
      es: "Muy grave."
  - id: d
    text:
      es: "Grave, salvo que haya reincidencia."
  explanation:
    es: "El artículo 95.4.b) tipifica esas acciones como infracción muy grave. No son graves ni leves, y la ley no condiciona su gravedad a la reincidencia."
  citation: "art. 95.4.b) RDL 1/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q101
  prompt:
    es: "Según el artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, generar deliberadamente situaciones de riesgo o grave daño para la integridad física o psíquica o la salud de las personas con discapacidad es una infracción:"
  options:
  - id: a
    text:
      es: "Grave."
  - id: b
    text:
      es: "Leve."
  - id: c
    text:
      es: "Grave, si el daño no llega a producirse."
  - id: d
    correct: true
    text:
      es: "Muy grave."
  explanation:
    es: "El artículo 95.4.d) la incluye entre las infracciones muy graves. No es grave ni leve, y el texto no distingue según que el daño llegue o no a producirse: basta generar deliberadamente la situación de riesgo."
  citation: "art. 95.4.d) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q102
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las conductas calificadas como graves se consideran muy graves cuando sus autores hayan actuado movidos, además, por:"
  options:
  - id: a
    text:
      es: "Ánimo de lucro o de obtener una ventaja económica."
  - id: b
    text:
      es: "Reiteración de la conducta durante más de un año."
  - id: c
    text:
      es: "Conocimiento de la prohibición por parte de la persona obligada."
  - id: d
    correct: true
    text:
      es: "Odio o desprecio racial o étnico, de género, orientación sexual, edad, discapacidad severa o no posibilidad de representarse a sí mismo."
  explanation:
    es: "Una conducta grave pasa a muy grave si el autor actúa, además, por odio o desprecio racial o étnico, de género, de orientación sexual, de edad, de discapacidad severa o de no posibilidad de representarse a sí mismo. El ánimo de lucro, la reiteración durante un año y el conocimiento de la prohibición no son ese agravante del artículo 95.4.e); la reiteración tiene su propio supuesto, la comisión de tres infracciones graves en un año."
  citation: "art. 95.4.e) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q104
  prompt:
    es: "Según el artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, es infracción muy grave incumplir las normas legales sobre accesibilidad cuando ese incumplimiento impida o dificulte gravemente el ejercicio de:"
  options:
  - id: a
    text:
      es: "Derechos económicos y sociales de carácter prestacional."
  - id: b
    correct: true
    text:
      es: "Derechos fundamentales y el disfrute de libertades públicas."
  - id: c
    text:
      es: "Derechos laborales reconocidos en convenio colectivo."
  - id: d
    text:
      es: "Derechos de participación en los procedimientos de contratación pública."
  explanation:
    es: "El artículo 95.4.g) se refiere al ejercicio de derechos fundamentales y al disfrute de libertades públicas. Los derechos prestacionales, los laborales de convenio y los de participación en la contratación pública no son el objeto de esa infracción muy grave."
  citation: "art. 95.4.g) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q105
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, la comisión de tres infracciones graves en el plazo de un año tiene la consideración de infracción:"
  options:
  - id: a
    correct: true
    text:
      es: "Muy grave."
  - id: b
    text:
      es: "Grave."
  - id: c
    text:
      es: "Leve."
  - id: d
    text:
      es: "Grave, con la sanción en su grado máximo."
  explanation:
    es: "Tres infracciones graves en un año se consideran en conjunto infracción muy grave, según el artículo 95.4.h). No quedan como graves ni como leves, y la ley no la define como una grave con sanción en grado máximo."
  citation: "art. 95.4.h) RDL 1/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q106
  prompt:
    es: "En los supuestos de exención excepcional de la cuota de reserva del artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las medidas alternativas aplicables se determinan:"
  options:
  - id: a
    correct: true
    text:
      es: "Reglamentariamente."
  - id: b
    text:
      es: "Mediante convenio colectivo de empresa."
  - id: c
    text:
      es: "Caso por caso, por la autoridad laboral."
  - id: d
    text:
      es: "Libremente por el empresario."
  explanation:
    es: "El artículo 42.1 condiciona la exención a que se apliquen las medidas alternativas que se determinen reglamentariamente. No las fija el convenio colectivo de empresa ni la autoridad laboral caso por caso, y el empresario no puede elegirlas libremente."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q107
  prompt:
    es: "Si el empresario opta voluntariamente por la exención de la cuota de reserva del artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, debe comunicar su opción debidamente a:"
  options:
  - id: a
    text:
      es: "La Inspección General de Servicios."
  - id: b
    text:
      es: "El Servicio Público de Empleo Estatal."
  - id: c
    text:
      es: "La representación legal de los trabajadores."
  - id: d
    correct: true
    text:
      es: "La autoridad laboral."
  explanation:
    es: "La opción voluntaria del empresario se comunica a la autoridad laboral. La Inspección General de Servicios actúa en el empleo público, el Servicio Público de Empleo Estatal no es el destinatario que fija el artículo y la representación de los trabajadores no recibe esa comunicación."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2006-21990-art-7
- id: m01-l16-q108
  prompt:
    es: "Según el artículo 7 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el nivel de protección mínimo de la situación de dependencia lo establece:"
  options:
  - id: a
    text:
      es: "Cada Comunidad Autónoma."
  - id: b
    text:
      es: "Cada entidad local."
  - id: c
    correct: true
    text:
      es: "La Administración General del Estado."
  - id: d
    text:
      es: "El Consejo Territorial de Servicios Sociales y del Sistema para la Autonomía y Atención a la Dependencia."
  explanation:
    es: "El primer nivel es el mínimo, que establece la Administración General del Estado. Las Comunidades Autónomas fijan un nivel adicional, las entidades locales no figuran entre los niveles, y el Consejo Territorial es oído por el Gobierno, pero no establece el nivel mínimo."
  citation: "art. 7 Ley 39/2006"
  difficulty: 1
  tags:
  - "organo"
# anchor: boe-a-2006-21990-art-7
- id: m01-l16-q109
  prompt:
    es: "Conforme a la Ley 39/2006, de 14 de diciembre, el nivel de protección que se acuerda entre la Administración General del Estado y cada Comunidad Autónoma se instrumenta mediante:"
  options:
  - id: a
    text:
      es: "Una ley de presupuestos."
  - id: b
    correct: true
    text:
      es: "Convenios."
  - id: c
    text:
      es: "Un real decreto del Consejo de Ministros."
  - id: d
    text:
      es: "Resoluciones del Consejo Territorial."
  explanation:
    es: "El nivel acordado entre el Estado y cada Comunidad Autónoma se concreta a través de convenios. No se fija por una ley de presupuestos, ni por un real decreto, ni por resoluciones del Consejo Territorial."
  citation: "art. 7 Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-7
- id: m01-l16-q110
  prompt:
    es: "¿Cuál de los siguientes sujetos puede establecer el nivel adicional de protección de la situación de dependencia, según el artículo 7 de la Ley 39/2006, de 14 de diciembre?"
  options:
  - id: a
    text:
      es: "La Administración General del Estado mediante reglamento."
  - id: b
    correct: true
    text:
      es: "Cada Comunidad Autónoma."
  - id: c
    text:
      es: "Cada ayuntamiento mediante ordenanza."
  - id: d
    text:
      es: "El Consejo Territorial mediante acuerdo."
  explanation:
    es: "El tercer nivel, el adicional, lo puede establecer cada Comunidad Autónoma. El Estado fija el mínimo, y ni los ayuntamientos ni el Consejo Territorial figuran en el artículo como competentes para el nivel adicional."
  citation: "art. 7 Ley 39/2006"
  difficulty: 1
  tags:
  - "organo"
# anchor: boe-a-2006-21990-art-7
- id: m01-l16-q111
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge, por este orden, los tres niveles de protección de la dependencia del artículo 7 de la Ley 39/2006, de 14 de diciembre?"
  options:
  - id: a
    correct: true
    text:
      es: "El mínimo de la Administración General del Estado, el acordado entre ella y cada Comunidad Autónoma por convenio y el adicional de cada Comunidad Autónoma."
  - id: b
    text:
      es: "El de cada Comunidad Autónoma, el mínimo de la Administración General del Estado y el acordado entre ambas por convenio."
  - id: c
    text:
      es: "El acordado por convenio, el adicional de cada Comunidad Autónoma y el mínimo de cada entidad local."
  - id: d
    text:
      es: "El mínimo de la Administración General del Estado, el adicional de cada entidad local y el acordado por el Consejo Territorial."
  explanation:
    es: "Los niveles son tres: el mínimo, que establece el Estado, el que se acuerda entre el Estado y cada Comunidad Autónoma a través de convenios y el adicional de cada Comunidad Autónoma. Las demás enumeraciones alteran el orden o sustituyen un nivel por otro inexistente, como un nivel de las entidades locales o uno acordado por el Consejo Territorial."
  citation: "art. 7 Ley 39/2006"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2006-21990-art-9
- id: m01-l16-q113
  prompt:
    es: "Conforme a la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el nivel mínimo de protección garantizado para cada beneficiario del Sistema se determina según:"
  options:
  - id: a
    text:
      es: "Los recursos económicos de la persona beneficiaria."
  - id: b
    text:
      es: "La edad de la persona beneficiaria."
  - id: c
    correct: true
    text:
      es: "El grado de su dependencia."
  - id: d
    text:
      es: "La Comunidad Autónoma de su residencia."
  explanation:
    es: "El nivel mínimo se determina según el grado de dependencia de cada beneficiario. La renta, la edad y la Comunidad Autónoma de residencia no son el criterio que fija el artículo 9.1."
  citation: "art. 9.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m01-l16-q115
  prompt:
    es: "Según el artículo 26.1.a) de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿cuál de las siguientes descripciones corresponde al Grado I, dependencia moderada?"
  options:
  - id: a
    text:
      es: "La persona necesita ayuda para varias actividades dos o tres veces al día, sin requerir apoyo permanente de una persona cuidadora."
  - id: b
    correct: true
    text:
      es: "La persona necesita ayuda para varias actividades de la vida diaria, al menos una vez al día, o tiene necesidades de apoyo intermitente o limitado."
  - id: c
    text:
      es: "La persona necesita ayuda varias veces al día y el apoyo indispensable y continuo de otra persona."
  - id: d
    text:
      es: "La persona necesita ayuda solo de forma ocasional, sin relación con las actividades de la vida diaria."
  explanation:
    es: "El Grado I corresponde a quien necesita ayuda para varias actividades de la vida diaria al menos una vez al día o tiene necesidades de apoyo intermitente o limitado. Ayuda dos o tres veces al día sin apoyo permanente describe el Grado II, el apoyo indispensable y continuo describe el Grado III, y la ayuda ocasional ajena a la vida diaria no es un supuesto del artículo 26.1."
  citation: "art. 26.1.a) Ley 39/2006"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m01-l16-q116
  prompt:
    es: "Conforme a la Ley 39/2006, de 14 de diciembre, en el Grado I de dependencia la persona tiene necesidades de apoyo para su autonomía personal de carácter:"
  options:
  - id: a
    correct: true
    text:
      es: "Intermitente o limitado."
  - id: b
    text:
      es: "Extenso."
  - id: c
    text:
      es: "Generalizado."
  - id: d
    text:
      es: "Indispensable y continuo."
  explanation:
    es: "El Grado I se asocia con necesidades de apoyo intermitente o limitado. El apoyo extenso es el del Grado II y el generalizado es el del Grado III, que además requiere el apoyo indispensable y continuo de otra persona."
  citation: "art. 26.1.a) Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-28
- id: m01-l16-q117
  prompt:
    es: "¿Cuál de los siguientes sujetos expide la resolución de reconocimiento de la situación de dependencia, según el artículo 28.2 de la Ley 39/2006, de 14 de diciembre?"
  options:
  - id: a
    text:
      es: "La Administración General del Estado, a través del departamento competente."
  - id: b
    text:
      es: "La Administración Local del municipio de residencia del solicitante."
  - id: c
    text:
      es: "El Gobierno, oído el Consejo Territorial de Servicios Sociales y del Sistema para la Autonomía y Atención a la Dependencia."
  - id: d
    correct: true
    text:
      es: "La Administración Autonómica correspondiente a la residencia del solicitante."
  explanation:
    es: "La resolución la expide la Administración Autonómica correspondiente a la residencia del solicitante, y vale en todo el territorio del Estado. No la dicta la Administración General del Estado ni el ayuntamiento, y el Gobierno oye al Consejo Territorial para fijar el nivel mínimo, no para resolver cada solicitud."
  citation: "art. 28.2 Ley 39/2006"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q120
  prompt:
    es: "Una empresa privada tiene 150 trabajadores. Conforme al artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, ¿cuántos de ellos deben ser, al menos, trabajadores con discapacidad?"
  options:
  - id: a
    text:
      es: "Dos."
  - id: b
    correct: true
    text:
      es: "Tres."
  - id: c
    text:
      es: "Cuatro."
  - id: d
    text:
      es: "Seis."
  explanation:
    es: "La reserva es del 2 por 100 de la plantilla, y el 2 por 100 de 150 son 3 trabajadores. Dos corresponde a unos 100 trabajadores, cuatro a unos 200 y seis equivale al 4 por 100 de la plantilla."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q121
  prompt:
    es: "Una empresa privada tiene 49 trabajadores. Según el artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, ¿está obligada a que el 2 por 100 de su plantilla sean trabajadores con discapacidad?"
  options:
  - id: a
    correct: true
    text:
      es: "No, la obligación alcanza a las empresas con 50 o más trabajadores."
  - id: b
    text:
      es: "Sí, porque la obligación alcanza a toda empresa privada."
  - id: c
    text:
      es: "No, porque la obligación solo alcanza a las empresas públicas."
  - id: d
    text:
      es: "Sí, si la autoridad laboral lo exige expresamente."
  explanation:
    es: "La cuota de reserva alcanza a las empresas públicas y privadas con 50 o más trabajadores, y con 49 no se llega al umbral. No se aplica a toda empresa privada, no se limita a las públicas y no depende de una exigencia expresa de la autoridad laboral."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q127
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad constituyen:"
  options:
  - id: a
    correct: true
    text:
      es: "Una infracción muy grave."
  - id: b
    text:
      es: "Una infracción grave."
  - id: c
    text:
      es: "Una infracción leve."
  - id: d
    text:
      es: "Una infracción grave, que solo es muy grave si se comete tres veces en un año."
  explanation:
    es: "El artículo 95.4.a) incluye entre las infracciones muy graves las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad. No son una infracción grave ni leve, y tampoco una infracción grave que dependa de la reiteración: la comisión de tres infracciones graves en un año es otra causa de infracción muy grave (artículo 95.4.h), distinta de esta."
  citation: "art. 95.4 RDL 1/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q128
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, es infracción muy grave conculcar deliberadamente la dignidad de las personas con discapacidad imponiendo condiciones o cargas humillantes para el acceso a:"
  options:
  - id: a
    text:
      es: "Los puestos reservados en las ofertas de empleo público."
  - id: b
    correct: true
    text:
      es: "Los bienes, productos y servicios a disposición del público."
  - id: c
    text:
      es: "Los procedimientos de reconocimiento del grado de discapacidad."
  - id: d
    text:
      es: "Los puestos de trabajo de las empresas de cincuenta o más trabajadores."
  explanation:
    es: "El artículo 95.4.c) refiere la infracción al acceso a los bienes, productos y servicios a disposición del público. Los puestos reservados en las ofertas de empleo público, los procedimientos de reconocimiento del grado de discapacidad y los puestos de trabajo de las empresas obligadas a la cuota de reserva no son el objeto de esa letra."
  citation: "art. 95.4 RDL 1/2013"
  difficulty: 2
  tags:
  - "fact:95-4-c"
# anchor: boe-a-2006-21990-art-9
- id: m01-l16-q129
  prompt:
    es: "Según el artículo 9.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el Gobierno determina el nivel mínimo de protección garantizado oyendo previamente a:"
  options:
  - id: a
    text:
      es: "El Consejo Interterritorial del Sistema Nacional de Salud."
  - id: b
    correct: true
    text:
      es: "El Consejo Territorial de Servicios Sociales y del Sistema para la Autonomía y Atención a la Dependencia."
  - id: c
    text:
      es: "El Consejo de Políticas Fiscales y Financieras."
  - id: d
    text:
      es: "La Conferencia de Presidentes."
  explanation:
    es: "El artículo 9.1 manda al Gobierno oír al Consejo Territorial de Servicios Sociales y del Sistema para la Autonomía y Atención a la Dependencia antes de fijar el nivel mínimo. El Consejo Interterritorial del Sistema Nacional de Salud, el Consejo de Políticas Fiscales y Financieras y la Conferencia de Presidentes son órganos de cooperación territorial que ese artículo no menciona."
  citation: "art. 9.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "fact:9-1-gobierno"
# anchor: boe-a-2013-12632-art-2
- id: m01-l16-q130
  prompt:
    es: "Según el artículo 2.j) del Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión es un presupuesto irrenunciable para:"
  options:
  - id: a
    correct: true
    text:
      es: "Hacer efectivos los derechos humanos."
  - id: b
    text:
      es: "Garantizar la accesibilidad universal de los entornos."
  - id: c
    text:
      es: "Reconocer el grado de discapacidad igual o superior al 33 por ciento."
  - id: d
    text:
      es: "Cumplir la cuota de reserva del 2 por 100 de la plantilla."
  explanation:
    es: "La definición presenta la inclusión como presupuesto irrenunciable para hacer efectivos los derechos humanos. No la vincula con la accesibilidad universal de los entornos, con el reconocimiento del grado de discapacidad del 33 por ciento (artículo 4.2) ni con la cuota de reserva del 2 por 100 de las empresas de cincuenta o más trabajadores (artículo 42.1)."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "fact:2-j-presupuesto"
