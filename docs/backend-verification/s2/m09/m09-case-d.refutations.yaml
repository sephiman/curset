m09-case-d-q02:
  key:
    anchor: kafka-design#dont-fear-the-filesystem
    sentence: All data is immediately written to a persistent log on the filesystem without necessarily flushing to disk.
  wrong:
  - option: It stays in an in-process cache in the broker that remains warm across restarts
    anchor: kafka-design#dont-fear-the-filesystem
    sentence: this cache will stay warm even if the service is restarted, whereas the in-process cache will need to be rebuilt in memory
  - option: It stays on the JVM heap of the broker, where garbage collection cost stays flat as data grows
    anchor: kafka-design#dont-fear-the-filesystem
    sentence: Java garbage collection becomes increasingly fiddly and slow as the in-heap data increases.
  - option: It is buffered in memory first, because disks are always far slower than the network
    anchor: kafka-design#dont-fear-the-filesystem
    sentence: a properly designed disk structure can often be as fast as the network.
