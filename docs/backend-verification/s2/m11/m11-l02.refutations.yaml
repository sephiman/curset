m11-l02-q08:
  key:
    anchor: javadoc-concurrent-package#MemoryVisibility
    sentence: A write to a volatile field happens-before every subsequent read of that same field.
  wrong:
  - option: A write to a plain field happens-before any read of it by another thread, with no further synchronization
    anchor: jls-17#jls-17.4.5
    sentence: Writes in one thread that are in a data race with reads in another thread may, for example, appear to occur out of order to those reads.
  - option: A call to `join()` on a thread happens-before every action performed by the joined thread
    anchor: javadoc-concurrent-package#MemoryVisibility
    sentence: All actions in a thread happen-before any other thread successfully returns from a join on that thread.
  - option: Exiting a `synchronized` block happens-before the next lock of any monitor
    anchor: javadoc-concurrent-package#MemoryVisibility
    sentence: An unlock (synchronized block or method exit) of a monitor happens-before every subsequent lock (synchronized block or method entry) of that same monitor.
m11-l02-q09:
  key:
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: The @Transactional annotation is merely metadata that can be consumed by corresponding runtime infrastructure which uses that metadata to configure the appropriate beans with transactional behavior.
  wrong:
  - option: Putting the annotation on a bean is enough to start a transaction for each call
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: However, the mere presence of the @Transactional annotation is not enough to activate the transactional behavior.
  - option: A `@PostConstruct` method of the bean runs inside a transaction when it carries the annotation
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Also, the proxy must be fully initialized to provide the expected behavior, so you should not rely on this feature in your initialization code — for example, in a @PostConstruct method.
  - option: In proxy mode, a method that calls another `@Transactional` method of the same bean starts a transaction for that call
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: This means that self-invocation (in effect, a method within the target object calling another method of the target object) does not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.
