# anchor: boe-a-2003-23186-art-71
- id: m03-l10-q0001
  prompt:
    es: "De acuerdo con el artículo 71.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias de un obligado tributario podrán extinguirse total o parcialmente por compensación con:"
  options:
  - id: a
    text:
      es: "Créditos que el obligado alegue frente a la Hacienda pública, aunque ningún acto los haya reconocido."
  - id: b
    correct: true
    text:
      es: "Créditos reconocidos por acto administrativo a favor del mismo obligado."
  - id: c
    text:
      es: "Créditos reconocidos por acto administrativo a favor de otro obligado tributario distinto."
  - id: d
    text:
      es: "Créditos reconocidos únicamente por sentencia judicial firme a favor del mismo obligado."
  explanation:
    es: "El artículo 71.1 exige créditos reconocidos por acto administrativo y a favor del mismo obligado cuya deuda se compensa. Un crédito solo alegado, sin acto que lo reconozca, no vale. Tampoco sirve el crédito de otro obligado, porque la compensación opera entre las dos posiciones de una misma persona. La sentencia firme no es el único título posible: basta el acto administrativo."
  citation: "art. 71.1 LGT"
  difficulty: 1
  tags:
  - "compensación"
  - "créditos"
# anchor: boe-a-2003-23186-art-72
- id: m03-l10-q0004
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las deudas cuya compensación puede solicitar el obligado tributario es conforme con el artículo 72.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Puede solicitar la compensación tanto de las deudas en período voluntario como de las que estén en período ejecutivo."
  - id: b
    text:
      es: "Puede solicitar la compensación de las deudas en período ejecutivo, pero no de las que estén todavía en período voluntario."
  - id: c
    text:
      es: "Puede solicitar la compensación de cualquier deuda, salvo la que haya sido determinada mediante autoliquidación."
  - id: d
    text:
      es: "Puede solicitar la compensación solo de las deudas cuyo importe sea igual o inferior al del crédito que ofrece."
  explanation:
    es: "El artículo 72.1 permite pedir la compensación en período voluntario y en ejecutivo. La deuda en ejecutivo se puede compensar, y la que sigue en voluntario también. La autoliquidación no es una excepción: el artículo 56.2.a del Reglamento de Recaudación prevé justamente la solicitud sobre deuda autoliquidada. Y el crédito puede ser inferior a la deuda, caso que regula el artículo 59.2."
  citation: "art. 72.1 LGT"
  difficulty: 2
  tags:
  - "compensación"
  - "instancia"
# anchor: boe-a-2003-23186-art-72
- id: m03-l10-q0005
  prompt:
    es: "En relación con la solicitud de compensación presentada en período voluntario, y de acuerdo con el artículo 72.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Impide que comience el período ejecutivo de cualquier deuda del obligado, concurra o no con el crédito ofrecido."
  - id: b
    text:
      es: "Suspende el plazo de ingreso en período voluntario de todas las deudas pendientes del obligado."
  - id: c
    correct: true
    text:
      es: "Impide que comience el período ejecutivo de la deuda concurrente con el crédito ofrecido."
  - id: d
    text:
      es: "Obliga a la Administración a declarar extinguida la deuda al día siguiente de la presentación."
  explanation:
    es: "El artículo 72.2 limita el efecto a la deuda concurrente con el crédito ofrecido: solo esa deuda queda sin período ejecutivo. Las demás deudas del obligado siguen su curso y su plazo de ingreso no se suspende. Y la extinción no se produce por el mero paso de un día, sino en el momento que fija el artículo 72.3."
  citation: "art. 72.2 LGT"
  difficulty: 3
  tags:
  - "compensación"
  - "período ejecutivo"
# anchor: boe-a-2003-23186-art-72
- id: m03-l10-q0006
  prompt:
    es: "Según el artículo 72.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la solicitud de compensación presentada en período voluntario no impide el devengo del interés de demora que pueda proceder hasta:"
  options:
  - id: a
    text:
      es: "La fecha de presentación de la solicitud de compensación."
  - id: b
    text:
      es: "La fecha de notificación del acuerdo de compensación."
  - id: c
    correct: true
    text:
      es: "La fecha de reconocimiento del crédito."
  - id: d
    text:
      es: "La fecha en que finaliza el plazo de ingreso en período voluntario."
  explanation:
    es: "El artículo 72.2 fija como límite del devengo la fecha de reconocimiento del crédito. La presentación de la solicitud no corta el interés, y tampoco lo hace la notificación del acuerdo, que es posterior. El fin del plazo voluntario marca el inicio del ejecutivo en las deudas no compensadas, pero no es el hito que señala este artículo."
  citation: "art. 72.2 LGT"
  difficulty: 2
  tags:
  - "compensación"
  - "interés de demora"
# anchor: boe-a-2003-23186-art-72
- id: m03-l10-q0007
  prompt:
    es: "De acuerdo con el artículo 72.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en la compensación a instancia del obligado tributario el acuerdo de compensación:"
  options:
  - id: a
    text:
      es: "Produce la extinción de la deuda en el momento en que se dicta, sin retroacción a la fecha de la solicitud."
  - id: b
    text:
      es: "Declara la extinción de la deuda desde el día siguiente al del vencimiento del plazo de ingreso en período voluntario."
  - id: c
    correct: true
    text:
      es: "Declara la extinción de la deuda, que se produce desde la presentación de la solicitud o, si fuera posterior, desde que se cumplen los requisitos."
  - id: d
    text:
      es: "Declara la extinción de la deuda cuando el interesado ingresa la diferencia entre la deuda y el crédito."
  explanation:
    es: "Según el artículo 72.3 la extinción se produce al presentar la solicitud o, si es posterior, cuando se cumplen los requisitos de deudas y créditos; el acuerdo solo la declara. Por tanto no extingue desde la fecha en que se dicta, ni desde el vencimiento del plazo voluntario, ni depende de que el interesado ingrese diferencia alguna."
  citation: "art. 72.3 LGT"
  difficulty: 3
  tags:
  - "compensación"
  - "extinción"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0009
  prompt:
    es: "¿Cuál de los siguientes datos debe contener la solicitud de compensación que dirige el obligado al pago al órgano competente, según el artículo 56.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "La identificación del crédito reconocido por la Hacienda pública a favor del solicitante, indicando al menos su importe, concepto y órgano gestor."
  - id: b
    text:
      es: "La identificación de la deuda cuya compensación se solicita, indicando al menos su importe y el número de la providencia de apremio."
  - id: c
    text:
      es: "El ofrecimiento de una garantía suficiente que cubra la parte de la deuda que exceda del crédito ofrecido."
  - id: d
    text:
      es: "El importe de los intereses de demora devengados hasta la fecha de la solicitud."
  explanation:
    es: "La solicitud debe identificar el crédito ofrecido con al menos importe, concepto y órgano gestor. La deuda se identifica con importe, concepto y fecha de vencimiento del plazo voluntario, no con una providencia de apremio, que ni siquiera existe cuando la deuda está en voluntario. La garantía no se pide en este procedimiento. Los intereses de demora no son un dato que deba constar en la solicitud."
  citation: "art. 56.1 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "solicitud"
  - "contenido"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0010
  prompt:
    es: "Si la deuda cuya compensación se solicita se determinó mediante autoliquidación, señale la respuesta CORRECTA sobre los documentos que acompañan a la solicitud según el artículo 56.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Se acompaña el modelo oficial de la autoliquidación, que en todo caso debe presentarse de nuevo aunque ya obre en poder de la Administración."
  - id: b
    correct: true
    text:
      es: "Se acompaña el modelo oficial de la autoliquidación debidamente cumplimentado, salvo que ya obre en poder de la Administración."
  - id: c
    text:
      es: "Se acompaña copia de la sentencia que reconozca el crédito, con independencia del origen del crédito ofrecido."
  - id: d
    text:
      es: "Se acompaña justificante del ingreso de la parte de la deuda que exceda del importe del crédito ofrecido."
  explanation:
    es: "Para la deuda autoliquidada se acompaña el modelo oficial cumplimentado, salvo que el interesado no esté obligado a presentarlo por constar ya en poder de la Administración; en ese caso señala el día y el procedimiento en que lo presentó. La obligación de repetirlo siempre contradice esa excepción. La copia de la sentencia solo se pide si el crédito deriva de una devolución tributaria y, aun así, junto con el acto o la resolución que lo reconozca, en su caso. El ingreso previo del exceso no figura entre los documentos del artículo."
  citation: "art. 56.2 RGR"
  difficulty: 3
  tags:
  - "compensación"
  - "documentos"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0011
  prompt:
    es: "De acuerdo con el artículo 56.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, junto con la solicitud de compensación debe presentarse, salvo que el crédito derive de una devolución tributaria, la justificación de haber solicitado un certificado de:"
  options:
  - id: a
    correct: true
    text:
      es: "La oficina de contabilidad del órgano u organismo gestor del gasto o del pago."
  - id: b
    text:
      es: "La Intervención General de la Administración del Estado, sobre la deuda que se pretende compensar."
  - id: c
    text:
      es: "La unidad de recaudación de la Agencia Estatal de Administración Tributaria, sobre el estado de la deuda."
  - id: d
    text:
      es: "El Tribunal Económico-Administrativo competente, sobre la firmeza del crédito que se ofrece."
  explanation:
    es: "El certificado lo expide la oficina de contabilidad del órgano u organismo gestor del gasto o del pago, y refleja el crédito reconocido pendiente de pago, la fecha de su reconocimiento y la suspensión de los trámites para su abono. La Intervención General, la unidad de recaudación y el tribunal económico-administrativo no intervienen en esa certificación."
  citation: "art. 56.2 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "certificado"
  - "órgano"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0012
  prompt:
    es: "Según el artículo 56.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué debe reflejar el certificado cuya solicitud se justifica al pedir la compensación de un crédito que no deriva de una devolución tributaria?"
  options:
  - id: a
    text:
      es: "La existencia del crédito reconocido pendiente de pago y la fecha de vencimiento del plazo de ingreso de la deuda."
  - id: b
    correct: true
    text:
      es: "La existencia del crédito reconocido pendiente de pago, la fecha de su reconocimiento y la suspensión de los trámites para su abono."
  - id: c
    text:
      es: "La cuantía de la deuda compensable y la fecha de inicio del período ejecutivo de la deuda."
  - id: d
    text:
      es: "La firmeza del acto que reconoce el crédito y el importe de los intereses de demora devengados."
  explanation:
    es: "El certificado recoge tres cosas: que el crédito existe y está pendiente de pago, cuándo se reconoció y que los trámites para abonarlo quedan suspendidos mientras no se comunique la resolución. La deuda, su vencimiento o su período ejecutivo son datos de la solicitud, no del certificado. La firmeza y los intereses de demora tampoco figuran en el contenido que fija el artículo."
  citation: "art. 56.2 RGR"
  difficulty: 3
  tags:
  - "compensación"
  - "certificado"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0013
  prompt:
    es: "Según el artículo 56.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la solicitud de compensación no reúne los requisitos, el órgano competente requerirá al solicitante para que subsane en el plazo de:"
  options:
  - id: a
    text:
      es: "10 días contados a partir del día siguiente al de la presentación de la solicitud."
  - id: b
    text:
      es: "15 días contados a partir del día siguiente al de la notificación del requerimiento."
  - id: c
    text:
      es: "Un mes contado a partir del día siguiente al de la notificación del requerimiento."
  - id: d
    correct: true
    text:
      es: "10 días contados a partir del día siguiente al de la notificación del requerimiento."
  explanation:
    es: "El plazo de subsanación es de 10 días contados desde el día siguiente al de la notificación del requerimiento. Contarlo desde la presentación de la solicitud cambia el inicio del cómputo. Los 15 días son el plazo de alegaciones del procedimiento de deducción sobre transferencias del artículo 60, y el mes no es el plazo de este requerimiento."
  citation: "art. 56.3 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "subsanación"
  - "plazo"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0014
  prompt:
    es: "De acuerdo con el artículo 56.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el solicitante de una compensación no atiende el requerimiento de subsanación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se deniega la solicitud mediante resolución motivada que se notifica al interesado."
  - id: b
    text:
      es: "Se concede un segundo plazo de 10 días para subsanar los defectos advertidos."
  - id: c
    text:
      es: "Se entiende estimada la solicitud, aunque los defectos subsistan, y se dicta el acuerdo."
  - id: d
    correct: true
    text:
      es: "Se tiene por no presentada la solicitud y se archiva sin más trámite."
  explanation:
    es: "El requerimiento advierte de que, si no se atiende, se tiene por no presentada la solicitud y se archiva sin más trámite. La denegación se reserva para el caso distinto de quien contesta en plazo y no subsana del todo. No se prevé un segundo plazo, y el silencio ante el requerimiento nunca equivale a estimación."
  citation: "art. 56.3 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "subsanación"
  - "archivo"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0016
  prompt:
    es: "El lunes 1 de marzo de 2027 se notifica a Hermanos Ibáñez, S.L. un requerimiento para que subsane la solicitud de compensación de una deuda tributaria. Según el artículo 56.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el plazo es de 10 días a partir del día siguiente al de la notificación. Se cuentan los días hábiles, sin festivos nacionales en ese período. ¿Cuándo termina el plazo?"
  options:
  - id: a
    text:
      es: "El jueves 11 de marzo de 2027."
  - id: b
    text:
      es: "El viernes 12 de marzo de 2027."
  - id: c
    text:
      es: "El jueves 1 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 15 de marzo de 2027."
  explanation:
    es: "El día 1 de marzo es el de la notificación y el cómputo empieza el 2 de marzo. Los diez días hábiles, de martes a viernes la primera semana (2, 3, 4 y 5), de lunes a viernes la segunda (8 a 12) y el lunes 15, acaban el 15 de marzo. El 11 de marzo sale de contar diez días naturales. El 12 de marzo es el noveno día hábil, uno antes de que acabe el plazo. El 1 de abril es un mes después, plazo que el artículo no prevé."
  citation: "art. 56.3 RGR"
  difficulty: 3
  tags:
  - "compensación"
  - "subsanación"
  - "cómputo"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0017
  prompt:
    es: "De acuerdo con el artículo 56.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando la solicitud de compensación se presenta en período ejecutivo:"
  options:
  - id: a
    text:
      es: "Se suspende automáticamente todo el procedimiento de apremio contra el obligado."
  - id: b
    text:
      es: "Quedan anulados los embargos practicados sobre los bienes o derechos del obligado."
  - id: c
    text:
      es: "Debe suspenderse siempre la providencia de apremio hasta que se resuelva la solicitud."
  - id: d
    correct: true
    text:
      es: "Podrán suspenderse las actuaciones de enajenación de los bienes o derechos."
  explanation:
    es: "En período ejecutivo la solicitud permite, no obliga, a suspender las actuaciones de enajenación de los bienes o derechos. No suspende por sí sola todo el apremio, no anula embargos y no obliga a suspender la providencia de apremio."
  citation: "art. 56.4 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "período ejecutivo"
  - "suspensión"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0018
  prompt:
    es: "Respecto del acuerdo de compensación a instancia del obligado, y de acuerdo con el artículo 56.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "El órgano competente acuerda la compensación siempre que el crédito ofrecido sea igual o superior a la deuda, sin otro requisito."
  - id: b
    text:
      es: "El órgano competente acuerda la compensación solo cuando concurren los requisitos de la normativa civil, con exclusión de la tributaria."
  - id: c
    text:
      es: "El órgano competente acuerda la compensación únicamente tras el ingreso de los recargos que correspondan por el período ejecutivo."
  - id: d
    correct: true
    text:
      es: "El órgano competente acuerda la compensación cuando concurren los requisitos de la normativa tributaria y civil o, en su caso, de la legislación específica aplicable."
  explanation:
    es: "El acuerdo procede cuando concurren los requisitos generales de la normativa tributaria y civil o los de la legislación específica. No basta que el crédito cubra la deuda ni se limita a la normativa civil. El ingreso previo de recargos no es condición de la compensación."
  citation: "art. 56.5 RGR"
  difficulty: 3
  tags:
  - "compensación"
  - "acuerdo"
  - "requisitos"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0019
  prompt:
    es: "Según el artículo 56.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si se deniega una compensación solicitada en período voluntario, ¿qué se inicia con la notificación del acuerdo denegatorio?"
  options:
  - id: a
    text:
      es: "Un nuevo plazo de diez días para presentar otra solicitud de compensación."
  - id: b
    text:
      es: "El período ejecutivo de la deuda, con efectos desde el día siguiente a la notificación."
  - id: c
    text:
      es: "El plazo de seis meses para que la Administración dicte la providencia de apremio."
  - id: d
    correct: true
    text:
      es: "El plazo de ingreso del artículo 62.2 de la Ley General Tributaria."
  explanation:
    es: "La denegación en período voluntario abre el plazo de ingreso del artículo 62.2 de la Ley General Tributaria. El período ejecutivo no empieza con la notificación: solo comienza si no se ingresa en ese plazo. Tampoco se abre un plazo para repetir la solicitud, ni un plazo de seis meses para la providencia, que es el plazo de resolución del artículo 56.7."
  citation: "art. 56.5 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "denegación"
  - "plazo de ingreso"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0020
  prompt:
    es: "De acuerdo con el artículo 56.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la compensación se solicitó en período voluntario, se denegó y no se ingresa la deuda en el plazo abierto con la notificación de la denegación:"
  options:
  - id: a
    text:
      es: "Se archiva la deuda hasta que el obligado presente una nueva solicitud de compensación."
  - id: b
    correct: true
    text:
      es: "Comienza el período ejecutivo y debe iniciarse el procedimiento de apremio."
  - id: c
    text:
      es: "Se aplaza de oficio el pago de la deuda hasta que se resuelva el recurso que pueda interponerse."
  - id: d
    text:
      es: "Se inicia un procedimiento de deducción sobre transferencias contra el obligado."
  explanation:
    es: "Si no se ingresa en el plazo abierto por la denegación, comienza el período ejecutivo y debe iniciarse el apremio. La deuda no se archiva, no se aplaza de oficio mientras se recurre y el procedimiento de deducción sobre transferencias es propio de las deudas de entidades públicas, no de este obligado."
  citation: "art. 56.5 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "denegación"
  - "apremio"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0022
  prompt:
    es: "¿En qué plazo debe notificarse la resolución de una solicitud de compensación a instancia del obligado, según el artículo 56.7 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El plazo de tres meses."
  - id: b
    correct: true
    text:
      es: "El plazo de seis meses."
  - id: c
    text:
      es: "El plazo de cuatro meses."
  - id: d
    text:
      es: "El plazo de un mes."
  explanation:
    es: "El artículo 56.7 fija seis meses para notificar la resolución. Tres meses, cuatro meses y un mes no figuran en el precepto."
  citation: "art. 56.7 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "plazo de resolución"
# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0023
  prompt:
    es: "Según el artículo 73.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué cantidades se compensan de oficio durante el plazo de ingreso en período voluntario?"
  options:
  - id: a
    correct: true
    text:
      es: "Las cantidades a ingresar y a devolver que resulten de un mismo procedimiento de comprobación limitada o inspección."
  - id: b
    text:
      es: "Las deudas vencidas, líquidas y exigibles que las comunidades autónomas tengan con el Estado."
  - id: c
    text:
      es: "La deuda de cualquier deudor y los recargos del período ejecutivo, con el crédito que tenga reconocido."
  - id: d
    text:
      es: "Las deudas tributarias de las entidades locales, con los créditos que se les reconozcan a su favor."
  explanation:
    es: "Durante el plazo de ingreso en período voluntario solo se compensan de oficio las cantidades a ingresar y a devolver de un mismo procedimiento de comprobación limitada o inspección, además de las otras que enumera el artículo. Las deudas de las comunidades autónomas y de las entidades locales se compensan de oficio una vez transcurrido ese plazo, según el apartado 2. La deuda de un deudor cualquiera con sus recargos se compensa también después del período voluntario, según el artículo 58.1 del Reglamento de Recaudación."
  citation: "art. 73.1 LGT"
  difficulty: 2
  tags:
  - "compensación de oficio"
  - "voluntario"
# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0024
  prompt:
    es: "De acuerdo con el artículo 73.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, durante el plazo de ingreso en período voluntario se compensan de oficio las cantidades a ingresar y a devolver que resulten de un mismo procedimiento de comprobación limitada o inspección o de:"
  options:
  - id: a
    text:
      es: "La práctica de una liquidación por la presentación de una declaración extemporánea sin requerimiento previo."
  - id: b
    text:
      es: "La práctica de una liquidación provisional tras un procedimiento de verificación de datos."
  - id: c
    correct: true
    text:
      es: "La práctica de una nueva liquidación por haber sido anulada otra anterior."
  - id: d
    text:
      es: "La práctica de una nueva liquidación por haber sido modificada la normativa del tributo."
  explanation:
    es: "El segundo párrafo del artículo 73.1 junta el procedimiento de comprobación limitada o inspección con la nueva liquidación practicada por anulación de otra anterior. Las liquidaciones tras una declaración extemporánea, tras una verificación de datos o por un cambio normativo no figuran en ese párrafo, que enumera los casos de compensación de oficio durante el plazo voluntario."
  citation: "art. 73.1 LGT"
  difficulty: 2
  tags:
  - "compensación de oficio"
  - "nueva liquidación"
# anchor: boe-a-2005-14803-art-58
- id: m03-l10-q0025
  prompt:
    es: "Según el artículo 58.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, durante el plazo de ingreso en período voluntario se compensan de oficio, además, las cantidades a ingresar y a devolver relativas a obligaciones tributarias conexas que resulten de la ejecución de:"
  options:
  - id: a
    text:
      es: "Una sentencia firme del Tribunal Supremo dictada en casación."
  - id: b
    text:
      es: "Un acuerdo de aplazamiento o fraccionamiento concedido al obligado."
  - id: c
    correct: true
    text:
      es: "La resolución del recurso o de la reclamación económico-administrativa."
  - id: d
    text:
      es: "Una resolución de condonación aprobada por ley a favor de los obligados insolventes."
  explanation:
    es: "Las obligaciones tributarias conexas se compensan cuando resultan de ejecutar la resolución de un recurso o reclamación económico-administrativa. La sentencia del Tribunal Supremo, el aplazamiento y la condonación no son el origen que señala el artículo. La condonación, además, solo cabe por ley y no genera cantidades a devolver."
  citation: "art. 58.2 RGR"
  difficulty: 2
  tags:
  - "compensación de oficio"
  - "obligaciones conexas"
# anchor: boe-a-2005-14803-art-58
- id: m03-l10-q0026
  prompt:
    es: "¿Cuál de las siguientes cantidades se compensa de oficio durante el plazo de ingreso en período voluntario, según el artículo 58.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Las deudas vencidas, líquidas y exigibles de un organismo autónomo con la Hacienda pública estatal."
  - id: b
    text:
      es: "La deuda de un deudor no incluido entre las entidades públicas y los recargos del período ejecutivo que procedan."
  - id: c
    correct: true
    text:
      es: "Las cantidades a ingresar y a devolver de una nueva liquidación practicada por haber sido anulada otra anterior."
  - id: d
    text:
      es: "Las deudas vencidas, líquidas y exigibles de una entidad local con el Estado, con independencia del plazo."
  explanation:
    es: "El artículo 58.2 admite la compensación durante el plazo voluntario para las cantidades de una nueva liquidación por anulación. Las deudas de organismos autónomos y entes territoriales solo se compensan de oficio una vez transcurrido el plazo voluntario (artículo 57.1 y artículo 73.2 de la Ley General Tributaria). Lo mismo ocurre con la deuda de un deudor común y sus recargos del período ejecutivo, que según el artículo 58.1 solo se compensan pasado el período voluntario."
  citation: "art. 58.2 RGR"
  difficulty: 3
  tags:
  - "compensación de oficio"
  - "voluntario"
# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0027
  prompt:
    es: "Según el artículo 73.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué deudas son compensables de oficio una vez transcurrido el plazo de ingreso en período voluntario?"
  options:
  - id: a
    text:
      es: "Las deudas tributarias vencidas, líquidas y exigibles que las comunidades autónomas tengan con el Estado, con exclusión de las entidades locales."
  - id: b
    text:
      es: "Las deudas tributarias vencidas, líquidas y exigibles que el Estado tenga con las comunidades autónomas, entidades locales y demás entidades de derecho público a las que transfiere fondos."
  - id: c
    correct: true
    text:
      es: "Las deudas tributarias vencidas, líquidas y exigibles que las comunidades autónomas, entidades locales y demás entidades de derecho público tengan con el Estado."
  - id: d
    text:
      es: "Las deudas tributarias vencidas, líquidas y exigibles que los particulares tengan con las comunidades autónomas y las entidades locales."
  explanation:
    es: "El artículo 73.2 se refiere a las deudas que comunidades autónomas, entidades locales y demás entidades de derecho público tienen con el Estado. No excluye a las entidades locales. Invertir el sentido (deudas del Estado con ellas) o sustituir al Estado por las entidades como acreedoras cambia la relación que regula el precepto."
  citation: "art. 73.2 LGT"
  difficulty: 3
  tags:
  - "compensación de oficio"
  - "entidades públicas"
# anchor: boe-a-2005-14803-art-57
- id: m03-l10-q0029
  prompt:
    es: "Conforme al artículo 57.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las deudas vencidas, líquidas y exigibles a favor de la Hacienda pública estatal que deba satisfacer un ente territorial, un organismo autónomo, la Seguridad Social o una entidad de derecho público serán compensables de oficio:"
  options:
  - id: a
    text:
      es: "Desde que se notifica la providencia de apremio a la entidad deudora."
  - id: b
    correct: true
    text:
      es: "Una vez transcurrido el plazo de ingreso en período voluntario."
  - id: c
    text:
      es: "En cualquier momento, incluso durante el plazo de ingreso en período voluntario."
  - id: d
    text:
      es: "Cuando la entidad deudora presente la correspondiente solicitud de compensación."
  explanation:
    es: "El artículo 57.1 sitúa la compensación de oficio después del plazo de ingreso en período voluntario. No exige providencia de apremio, no la permite durante el voluntario y no depende de una solicitud de la entidad, porque es de oficio."
  citation: "art. 57.1 RGR"
  difficulty: 1
  tags:
  - "compensación de oficio"
  - "entidades públicas"
# anchor: boe-a-2005-14803-art-58
- id: m03-l10-q0031
  prompt:
    es: "De acuerdo con el artículo 58.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando un deudor a la Hacienda pública no comprendido en el artículo anterior es a su vez acreedor de ella por un crédito reconocido, una vez transcurrido el período voluntario se compensa de oficio:"
  options:
  - id: a
    text:
      es: "Solo la deuda, sin los recargos del período ejecutivo, con el crédito."
  - id: b
    correct: true
    text:
      es: "La deuda y los recargos del período ejecutivo que procedan, con el crédito."
  - id: c
    text:
      es: "La deuda y los intereses de demora, pero sin los recargos del período ejecutivo."
  - id: d
    text:
      es: "La deuda y los recargos del período ejecutivo, solo si el deudor lo solicita."
  explanation:
    es: "El artículo 58.1 compensa de oficio la deuda y los recargos del período ejecutivo que procedan. Excluir los recargos o sustituirlos por intereses altera el texto. Pedir que el deudor lo solicite choca con el carácter de oficio de esta compensación."
  citation: "art. 58.1 RGR"
  difficulty: 2
  tags:
  - "compensación de oficio"
  - "recargos"
# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0033
  prompt:
    es: "En la compensación de oficio de una deuda en período ejecutivo, señale la respuesta CORRECTA sobre el momento de la extinción según el artículo 73.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Se produce en el momento de inicio del período ejecutivo o, si fuera posterior, cuando se cumplan los requisitos exigidos para las deudas y los créditos."
  - id: b
    text:
      es: "Se produce en el momento de la notificación del acuerdo de compensación, cualquiera que sea la fecha en que se cumplan los requisitos."
  - id: c
    text:
      es: "Se produce en el momento en que se dicta la providencia de apremio sobre la deuda concurrente con el crédito."
  - id: d
    text:
      es: "Se produce en el momento del ingreso de la diferencia, cuando el crédito es inferior a la deuda."
  explanation:
    es: "El artículo 73.3 liga la extinción al inicio del período ejecutivo o al cumplimiento posterior de los requisitos. Ni la notificación del acuerdo, ni la providencia de apremio, ni el ingreso de una diferencia fijan ese momento. El acuerdo de compensación solo declara la extinción."
  citation: "art. 73.3 LGT"
  difficulty: 3
  tags:
  - "compensación de oficio"
  - "extinción"
