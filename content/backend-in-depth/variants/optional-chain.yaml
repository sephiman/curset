template: |
  import java.util.Optional;

  public class Main {
      static int calls = 0;

      static String fallback() {
          calls++;
          return "none";
      }

      static String pick(String value) {
          return Optional.ofNullable(value)@@chain@@.orElse(fallback());
      }

      public static void main(String[] args) {
          System.out.println(pick(@@v@@));
          System.out.println(pick(@@w@@));
          System.out.println(calls);
      }
  }
explanation: '@@why@@ The program prints @@key@@.'
mistakes:
- name: evaluating `fallback()` only when the chain is empty
  replace:
  - .orElse(fallback())
  - .orElseGet(() -> fallback())
  why: The argument expressions of a method invocation are evaluated before control reaches the method code, so `fallback()` runs even when `orElse` returns the value.
- name: reading `filter` as dropping the values that match
  replace:
  - s.length() > @@n@@)
  - s.length() <= @@n@@)
  why: '`filter` returns an `Optional` describing the value if it matches the predicate, and an empty `Optional` otherwise.'
- name: treating a `null` result of `map` as the unchanged value
  replace:
  - ': null)'
  - ': s)'
  why: If the mapping function of `map` returns a null result, `map` returns an empty `Optional`.
- name: reading the length check as `>=`
  replace:
  - s.length() > @@n@@
  - s.length() >= @@n@@
  why: The check `s.length() > @@n@@` is false for a text of exactly `@@n@@` characters.
- name: returning the value instead of an empty `Optional` from the `flatMap` function
  replace:
  - ': Optional.<String>empty())'
  - ': Optional.of(s))'
  why: '`flatMap` returns the result of its function when a value is present, so an empty `Optional` from the function gives an empty result.'
- name: ignoring the supplier of `or`
  replace:
  - .or(() -> Optional.of("backup"))
  - ''
  why: '`or` returns an `Optional` produced by the supplying function when no value is present.'
- name: treating `or` as a replacement that applies even when a value is present
  replace:
  - .or(() -> Optional.of("backup"))
  - .map(s -> "backup")
  why: '`or` returns an `Optional` describing the value if one is present.'
- name: reading `filter` as dropping the values that start with the letter
  replace:
  - s.startsWith("@@c@@"))
  - '!s.startsWith("@@c@@"))'
  why: '`filter` returns an `Optional` describing the value if it matches the predicate, and an empty `Optional` otherwise.'
- name: checking the end of the text instead of its start
  replace:
  - s.startsWith(
  - s.endsWith(
  why: '`startsWith` tests the first characters of the text, not the last.'
- name: skipping `map(String::toUpperCase)` before the `filter`
  replace:
  - .map(String::toUpperCase)
  - ''
  why: '`map` applies the function to the value, so the `filter` sees the upper-case text.'
- name: requiring one more character in the length check
  replace:
  - s.length() > @@n@@
  - s.length() > @@n@@ + 1
  why: The check `s.length() > @@n@@` is true as soon as the text has more than `@@n@@` characters.
