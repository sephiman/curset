# anchor: boe-a-2006-20764-art-21
- id: m03-l15-q0151
  prompt:
    es: "Conforme al artículo 21.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se consideran rendimientos íntegros del capital las utilidades o contraprestaciones que provengan de elementos patrimoniales, bienes o derechos cuya titularidad corresponda al contribuyente y que:"
  options:
  - id: a
    correct: true
    text:
      es: "no se hallen afectos a actividades económicas realizadas por este."
  - id: b
    text:
      es: "no procedan de la transmisión de elementos patrimoniales, sea cual fuere su naturaleza."
  - id: c
    text:
      es: "no estén sometidos a retención o ingreso a cuenta en el momento de su pago."
  - id: d
    text:
      es: "se hallen afectos a actividades económicas realizadas por este."
  explanation:
    es: "Son rendimientos del capital los de elementos patrimoniales cuya titularidad es del contribuyente y que no están afectos a actividades económicas (art. 21.1 LIRPF). Los afectos producen rendimientos de actividades económicas. La retención no define la categoría, y las rentas de la transmisión tributan como ganancias salvo que la ley las califique como rendimientos del capital."
  citation: "art. 21.1 LIRPF"
  difficulty: 1
  tags:
  - "capital"
  - "concepto"
# anchor: boe-a-2006-20764-art-21
- id: m03-l15-q0152
  prompt:
    es: "Señale la respuesta CORRECTA sobre las rentas derivadas de la transmisión de la titularidad de los elementos patrimoniales, de acuerdo con el artículo 21.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Tributan como rendimientos del capital cuando exista pacto de reserva de dominio, y como ganancias en los demás casos."
  - id: b
    text:
      es: "Tributan como rendimientos del capital, salvo que la ley las califique como ganancias o pérdidas patrimoniales."
  - id: c
    text:
      es: "Tributan siempre como rendimientos del capital inmobiliario cuando el elemento transmitido es un inmueble."
  - id: d
    correct: true
    text:
      es: "Tributan como ganancias o pérdidas patrimoniales, salvo que la ley las califique como rendimientos del capital."
  explanation:
    es: "Las rentas de la transmisión tributan como ganancias o pérdidas patrimoniales, con la excepción de los casos en que la ley las califica como rendimientos del capital (art. 21.1 LIRPF). La regla no se invierte. La transmisión de un inmueble no genera capital inmobiliario, y el pacto de reserva de dominio no cambia la calificación: el precepto lo menciona precisamente para mantenerla."
  citation: "art. 21.1 LIRPF"
  difficulty: 2
  tags:
  - "capital"
  - "ganancias"
# anchor: boe-a-2006-20764-art-22
- id: m03-l15-q0153
  prompt:
    es: "De acuerdo con el artículo 22.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos íntegros procedentes de la titularidad de bienes inmuebles rústicos y urbanos o de derechos reales sobre ellos todos los que se deriven del arrendamiento o de:"
  options:
  - id: a
    correct: true
    text:
      es: "la constitución o cesión de derechos o facultades de uso o disfrute sobre aquellos, cualquiera que sea su denominación o naturaleza."
  - id: b
    text:
      es: "la constitución de derechos de uso o disfrute sobre aquellos, pero no su cesión posterior a terceros."
  - id: c
    text:
      es: "la explotación de aquellos como actividad económica, cualquiera que sea su denominación o naturaleza."
  - id: d
    text:
      es: "la transmisión de la titularidad de aquellos, cualquiera que sea su denominación o naturaleza."
  explanation:
    es: "Son rendimientos del capital inmobiliario los del arrendamiento y de la constitución o cesión de derechos o facultades de uso o disfrute del inmueble (art. 22.1 LIRPF). La transmisión de la titularidad genera ganancias o pérdidas. Excluir la cesión recorta la letra de la ley, y la explotación como actividad económica da lugar a otra categoría."
  citation: "art. 22.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
# anchor: boe-a-2006-20764-art-22
- id: m03-l15-q0154
  prompt:
    es: "De acuerdo con el artículo 22.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el rendimiento íntegro del capital inmobiliario:"
  options:
  - id: a
    text:
      es: "Se computa el importe que por todos los conceptos deba satisfacer el arrendatario, incluido el Impuesto sobre el Valor Añadido o, en su caso, el Impuesto General Indirecto Canario."
  - id: b
    text:
      es: "Se computa el importe que deba satisfacer el arrendatario, excluidos los tributos locales y el Impuesto sobre el Valor Añadido."
  - id: c
    correct: true
    text:
      es: "Se computa el importe que por todos los conceptos deba satisfacer el arrendatario, excluido el Impuesto sobre el Valor Añadido o, en su caso, el Impuesto General Indirecto Canario."
  - id: d
    text:
      es: "Se computa solo la renta pactada en el contrato, con exclusión de los demás conceptos que satisfaga el arrendatario."
  explanation:
    es: "El rendimiento íntegro es el importe que el arrendatario debe satisfacer por todos los conceptos, sin el IVA ni el IGIC (art. 22.2 LIRPF). Incluir el impuesto indirecto contradice el texto. Limitarse a la renta pactada ignora la expresión por todos los conceptos, y los tributos locales no se excluyen."
  citation: "art. 22.2 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "rendimiento íntegro"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0156
  prompt:
    es: "Señale la respuesta CORRECTA sobre los gastos deducibles del rendimiento neto del capital inmobiliario, de acuerdo con el artículo 23.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se deducen todos los gastos necesarios para la obtención, salvo los intereses de los capitales ajenos invertidos en la adquisición del bien."
  - id: b
    correct: true
    text:
      es: "Se deducen todos los gastos necesarios para la obtención de los rendimientos, entre otros los que el propio precepto enumera."
  - id: c
    text:
      es: "Se deducen exclusivamente los gastos que el propio precepto enumera, sin que quepan otros."
  - id: d
    text:
      es: "Se deducen los gastos necesarios para la obtención hasta el 50 por ciento de los rendimientos íntegros."
  explanation:
    es: "En el capital inmobiliario se deducen todos los gastos necesarios para obtener los rendimientos, y la enumeración del artículo 23.1.a) LIRPF es solo ejemplificativa: dice entre otros. La lista exclusiva es la del rendimiento del trabajo. Los intereses de capitales ajenos sí figuran como gasto necesario, y no hay un tope del 50 por ciento de los ingresos."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0157
  prompt:
    es: "Conforme al artículo 23.1.a).1.º de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el límite de los intereses de capitales ajenos y los gastos de reparación y conservación del inmueble:"
  options:
  - id: a
    text:
      es: "El importe total a deducir por estos gastos no puede exceder, para cada bien o derecho, del 50 por ciento de los rendimientos íntegros obtenidos."
  - id: b
    text:
      es: "El importe total a deducir por estos gastos no puede exceder, para el conjunto de los bienes, de la cuantía del rendimiento neto."
  - id: c
    text:
      es: "El importe total a deducir por estos gastos no puede exceder, para cada bien o derecho, del 3 por ciento del valor catastral."
  - id: d
    correct: true
    text:
      es: "El importe total a deducir por estos gastos no puede exceder, para cada bien o derecho, de la cuantía de los rendimientos íntegros obtenidos."
  explanation:
    es: "El tope se calcula para cada bien o derecho y es la cuantía de los rendimientos íntegros que produce (art. 23.1.a).1.º LIRPF). El 3 por ciento del valor catastral es el criterio de la amortización, no el de estos gastos. El 50 por ciento no figura, y el límite no se aplica al conjunto de bienes ni sobre el rendimiento neto."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "límite"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0158
  prompt:
    es: "Según el artículo 23.1.a).1.º de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el exceso de los intereses y gastos de reparación y conservación sobre los rendimientos íntegros del bien se puede deducir:"
  options:
  - id: a
    text:
      es: "en los tres años siguientes, como máximo."
  - id: b
    text:
      es: "en los cinco años siguientes, sin otro límite."
  - id: c
    text:
      es: "en los dos años siguientes."
  - id: d
    correct: true
    text:
      es: "en los cuatro años siguientes."
  explanation:
    es: "El exceso se puede deducir en los cuatro años siguientes (art. 23.1.a).1.º LIRPF). Dos, tres y cinco años son plazos próximos que el precepto no recoge."
  citation: "art. 23.1 LIRPF"
  difficulty: 1
  tags:
  - "capital inmobiliario"
  - "plazo"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0159
  prompt:
    es: "Carla Ruiz obtiene en 2026 rendimientos íntegros de 8.000 euros por el alquiler de una vivienda. Ese año paga 6.000 euros de intereses del préstamo con que adquirió el inmueble y 4.000 euros de reparación y conservación. Conforme al artículo 23.1.a).1.º de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo deduce esos gastos?"
  options:
  - id: a
    text:
      es: "Deduce 8.000 euros en 2026 y pierde los 2.000 euros restantes."
  - id: b
    text:
      es: "Deduce 8.000 euros en 2026 y puede deducir los 2.000 euros restantes en los dos años siguientes a 2026."
  - id: c
    text:
      es: "Deduce 10.000 euros en 2026, porque el límite se aplica al rendimiento neto."
  - id: d
    correct: true
    text:
      es: "Deduce 8.000 euros en 2026 y puede deducir los 2.000 euros restantes en los cuatro años siguientes."
  explanation:
    es: "Los gastos suman 10.000 euros y el límite es la cuantía de los rendimientos íntegros, 8.000 euros. El exceso de 2.000 euros se puede deducir en los cuatro años siguientes (art. 23.1.a).1.º LIRPF). No se pierde, no se deduce entero en 2026 y el plazo no es de dos años."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "capital inmobiliario"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0160
  prompt:
    es: "De acuerdo con el artículo 23.1.a).2.º de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son gasto necesario los tributos y recargos no estatales y las tasas y recargos estatales que incidan sobre los rendimientos computados o sobre el bien o derecho productor de aquellos, siempre que:"
  options:
  - id: a
    text:
      es: "tengan carácter estatal y no hayan sido repercutidos al arrendatario."
  - id: b
    text:
      es: "no excedan del 3 por ciento del valor catastral del inmueble."
  - id: c
    correct: true
    text:
      es: "no tengan carácter sancionador."
  - id: d
    text:
      es: "se hayan satisfecho mediante domiciliación bancaria."
  explanation:
    es: "Los tributos y tasas son deducibles si inciden sobre los rendimientos o sobre el bien productor y no tienen carácter sancionador (art. 23.1.a).2.º LIRPF). La forma de pago, un tope sobre el valor catastral o el carácter estatal no son requisitos del precepto."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0161
  prompt:
    es: "Según el artículo 23.1.a).3.º de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son gasto necesario para obtener los rendimientos del capital inmobiliario los saldos de dudoso cobro en las condiciones que se establezcan:"
  options:
  - id: a
    text:
      es: "en el contrato de arrendamiento suscrito entre las partes."
  - id: b
    text:
      es: "por orden ministerial, para cada ejercicio."
  - id: c
    correct: true
    text:
      es: "reglamentariamente."
  - id: d
    text:
      es: "por la Administración tributaria en cada caso concreto."
  explanation:
    es: "Las condiciones de los saldos de dudoso cobro las fija el reglamento (art. 23.1.a).3.º LIRPF). No se remiten a una orden anual, a la decisión de la Administración caso por caso ni a lo pactado por las partes."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0162
  prompt:
    es: "¿Cuál de los siguientes gastos se considera necesario para la obtención de los rendimientos del capital inmobiliario, según el artículo 23.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las cuotas satisfechas a sindicatos y colegios profesionales cuando la colegiación sea obligatoria."
  - id: b
    correct: true
    text:
      es: "Las cantidades devengadas por terceros como consecuencia de servicios personales."
  - id: c
    text:
      es: "El gasto de manutención del propio contribuyente en establecimientos de restauración y hostelería."
  - id: d
    text:
      es: "Los gastos de administración y depósito de valores negociables."
  explanation:
    es: "Las cantidades devengadas por terceros por servicios personales son gasto necesario del capital inmobiliario (art. 23.1.a).4.º LIRPF). Las cuotas de sindicatos y colegios son gasto del rendimiento del trabajo (art. 19.2.d). Los gastos de administración y depósito de valores son del capital mobiliario (art. 26.1). Y la manutención del propio contribuyente es una regla de las actividades económicas (art. 30.2.5.ª)."
  citation: "art. 23.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0163
  prompt:
    es: "De acuerdo con el artículo 23.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en el rendimiento neto del capital inmobiliario se deducen las cantidades destinadas a la amortización del inmueble y de los demás bienes cedidos con este, siempre que respondan a su:"
  options:
  - id: a
    text:
      es: "valor catastral en cada período."
  - id: b
    text:
      es: "uso real durante el período impositivo."
  - id: c
    text:
      es: "coste de adquisición satisfecho por el contribuyente."
  - id: d
    correct: true
    text:
      es: "depreciación efectiva."
  explanation:
    es: "La amortización es deducible si responde a la depreciación efectiva (art. 23.1.b) LIRPF). El valor catastral y el coste de adquisición intervienen en el cálculo del límite del 3 por ciento, no como condición de fondo, y el uso real no es el criterio."
  citation: "art. 23.1 LIRPF"
  difficulty: 1
  tags:
  - "capital inmobiliario"
  - "amortización"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0164
  prompt:
    es: "Vera Nieto alquila durante todo 2026 un piso adquirido por 200.000 euros, de los que 50.000 corresponden al suelo. Su valor catastral es de 160.000 euros, de los que 40.000 corresponden al suelo. Según el artículo 23.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el importe máximo de amortización del inmueble que cumple el requisito de efectividad en 2026?"
  options:
  - id: a
    text:
      es: "4.800 euros, que es el 3 por ciento del valor catastral incluido el suelo."
  - id: b
    correct: true
    text:
      es: "4.500 euros, que es el 3 por ciento del mayor de los dos valores sin incluir el suelo."
  - id: c
    text:
      es: "6.000 euros, que es el 3 por ciento del coste de adquisición total incluido el suelo."
  - id: d
    text:
      es: "3.600 euros, que es el 3 por ciento del valor catastral sin incluir el suelo."
  explanation:
    es: "Sin el suelo, el coste de adquisición es 150.000 euros y el valor catastral, 120.000 euros. El mayor es 150.000, y el 3 por ciento de esa cifra son 4.500 euros (art. 23.1.b) LIRPF). Aplicarlo al valor catastral da 3.600 euros, y el 6.000 y el 4.800 incluyen el valor del suelo, que el precepto excluye."
  citation: "art. 23.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "supuesto"
  - "amortización"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0165
  prompt:
    es: "Señale la respuesta CORRECTA sobre la reducción de los rendimientos netos del capital inmobiliario con período de generación superior a dos años, de acuerdo con el artículo 23.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se reducen en un 20 por ciento cuando se imputen en un único período impositivo, con un máximo de 300.000 euros anuales de rendimiento neto sobre el que se aplica."
  - id: b
    text:
      es: "Se reducen en un 30 por ciento cuando se imputen en un único período impositivo, con un máximo de 100.000 euros anuales de rendimiento neto."
  - id: c
    correct: true
    text:
      es: "Se reducen en un 30 por ciento cuando se imputen en un único período impositivo, con un máximo de 300.000 euros anuales de rendimiento neto sobre el que se aplica."
  - id: d
    text:
      es: "Se reducen en un 30 por ciento aunque se imputen en varios períodos impositivos, con un máximo de 300.000 euros anuales de rendimiento neto."
  explanation:
    es: "El rendimiento neto se reduce en un 30 por ciento si se imputa en un único período, y la cuantía sobre la que se aplica no puede superar 300.000 euros anuales (art. 23.3 LIRPF). El 20 por ciento es el de la reducción por inicio de actividad, y los 100.000 euros, el tope de esa misma reducción. Y la imputación en varios períodos no cumple el requisito."
  citation: "art. 23.3 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "reducción"
# anchor: boe-a-2006-20764-art-22
- id: m03-l15-q0166
  prompt:
    es: "¿Cuál de los siguientes rendimientos es capital inmobiliario, de acuerdo con el artículo 22.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "El que deriva del arrendamiento de bienes muebles que no constituya actividad económica."
  - id: b
    text:
      es: "El que deriva de los dividendos de una sociedad mercantil."
  - id: c
    text:
      es: "El que deriva de los intereses de la cesión a terceros de capitales propios."
  - id: d
    correct: true
    text:
      es: "El que deriva de la cesión de facultades de uso o disfrute sobre un inmueble urbano."
  explanation:
    es: "La cesión de facultades de uso o disfrute de un inmueble urbano da capital inmobiliario (art. 22.1 LIRPF). Los dividendos, el arrendamiento de bienes muebles y los intereses de capitales cedidos son capital mobiliario (art. 25)."
  citation: "art. 22.1 LIRPF"
  difficulty: 1
  tags:
  - "capital inmobiliario"
  - "clasificación"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0167
  prompt:
    es: "Conforme al artículo 25.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos íntegros del capital mobiliario los obtenidos por la participación en los fondos propios de cualquier tipo de entidad, entre ellos:"
  options:
  - id: a
    text:
      es: "las retribuciones de los administradores y miembros de los consejos de administración."
  - id: b
    text:
      es: "los intereses y demás contraprestaciones por la cesión a terceros de capitales propios."
  - id: c
    text:
      es: "las contraprestaciones por el arrendamiento de bienes muebles, negocios o minas."
  - id: d
    correct: true
    text:
      es: "los dividendos, las primas de asistencia a juntas y las participaciones en los beneficios de cualquier tipo de entidad."
  explanation:
    es: "Los dividendos, las primas de asistencia a juntas y las participaciones en beneficios son rendimientos por la participación en fondos propios (art. 25.1.a) LIRPF). Los intereses derivan de la cesión de capitales (art. 25.2), y las retribuciones de administradores son rendimientos del trabajo (art. 17.2.e). El arrendamiento de bienes muebles pertenece al apartado 4."
  citation: "art. 25.1 LIRPF"
  difficulty: 1
  tags:
  - "capital mobiliario"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0168
  prompt:
    es: "Según el artículo 25.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿de qué capitales son representativos los activos cuya transmisión, reembolso, amortización, canje o conversión genera rendimientos del capital mobiliario?"
  options:
  - id: a
    text:
      es: "De la cesión a terceros de capitales propios exclusivamente."
  - id: b
    text:
      es: "De la participación en los fondos propios de las entidades."
  - id: c
    correct: true
    text:
      es: "De la captación y utilización de capitales ajenos."
  - id: d
    text:
      es: "De la ordenación de medios de producción y recursos humanos."
  explanation:
    es: "Los activos de este apartado son los representativos de la captación y utilización de capitales ajenos: la renta es de quien cedió capitales propios al emisor (art. 25.2 LIRPF). Los fondos propios corresponden a la participación en entidades del apartado 1, y los medios de producción y los recursos humanos, a las actividades económicas. Y limitar la regla a la cesión de capitales propios deja fuera la transmisión de esos activos."
  citation: "art. 25.2 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0169
  prompt:
    es: "Según el artículo 25.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué otras rentas, además de las operaciones de capitalización y los contratos de seguro de vida o invalidez, son rendimientos íntegros del capital mobiliario?"
  options:
  - id: a
    text:
      es: "Las rentas derivadas de la cesión de bienes inmuebles."
  - id: b
    correct: true
    text:
      es: "Las rentas derivadas de la imposición de capitales."
  - id: c
    text:
      es: "Las rentas derivadas de la titularidad de derechos reales sobre inmuebles."
  - id: d
    text:
      es: "Las rentas derivadas de la constitución de sociedades mercantiles."
  explanation:
    es: "El apartado 3 agrupa las operaciones de capitalización, los seguros de vida o invalidez y las rentas derivadas de la imposición de capitales (art. 25.3 LIRPF). La cesión de inmuebles y los derechos reales sobre ellos dan capital inmobiliario (art. 22.1), y la constitución de sociedades no genera rendimiento alguno de esta categoría."
  citation: "art. 25.3 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0173
  prompt:
    es: "Según el artículo 25.4.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos del capital mobiliario los procedentes del arrendamiento de bienes muebles, negocios o minas, así como del subarrendamiento percibidos por el subarrendador, que:"
  options:
  - id: a
    text:
      es: "no excedan del 3 por ciento del valor de los bienes arrendados."
  - id: b
    correct: true
    text:
      es: "no constituyan actividades económicas."
  - id: c
    text:
      es: "constituyan actividades económicas."
  - id: d
    text:
      es: "se perciban de personas vinculadas con el contribuyente."
  explanation:
    es: "Si el arrendamiento de bienes muebles, negocios o minas no constituye una actividad económica, el rendimiento es de capital mobiliario (art. 25.4.c) LIRPF). Si la constituye, es de actividades económicas. El 3 por ciento es el criterio de la amortización de inmuebles, y la vinculación no es requisito."
  citation: "art. 25.4 LIRPF"
  difficulty: 1
  tags:
  - "capital mobiliario"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0174
  prompt:
    es: "Señale la respuesta CORRECTA sobre la contraprestación obtenida por el contribuyente por el aplazamiento o fraccionamiento del precio de las operaciones realizadas en desarrollo de su actividad económica habitual, según el artículo 25.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "No tiene la consideración de renta alguna a efectos del impuesto, por no suponer cesión de capitales."
  - id: b
    text:
      es: "Tiene la consideración de rendimiento del capital inmobiliario cuando el aplazamiento afecte a un inmueble."
  - id: c
    text:
      es: "Tiene la consideración de rendimiento del capital mobiliario por la cesión a terceros de capitales propios."
  - id: d
    correct: true
    text:
      es: "No tiene la consideración de rendimiento del capital mobiliario, sin perjuicio de su tributación por el concepto que corresponda."
  explanation:
    es: "El interés del aplazamiento en operaciones de la actividad económica habitual no es capital mobiliario, y tributa por el concepto que corresponda (art. 25.5 LIRPF). No se asimila a la cesión de capitales, ni cambia a capital inmobiliario por el objeto vendido. Y no queda fuera del impuesto: sigue tributando por otro concepto."
  citation: "art. 25.5 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "exclusión"
# anchor: boe-a-2006-20764-art-26
- id: m03-l15-q0175
  prompt:
    es: "De acuerdo con el artículo 26.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los gastos deducibles del rendimiento neto del capital mobiliario con carácter general:"
  options:
  - id: a
    text:
      es: "Se deducen los gastos de administración y depósito de valores negociables y los de gestión discrecional e individualizada de carteras."
  - id: b
    correct: true
    text:
      es: "Se deducen exclusivamente los gastos de administración y depósito de valores negociables."
  - id: c
    text:
      es: "Se deducen los gastos de administración y depósito de valores negociables con el límite del 3 por ciento del valor de los títulos."
  - id: d
    text:
      es: "Se deducen todos los gastos necesarios para la obtención de los rendimientos, entre otros los de administración y depósito."
  explanation:
    es: "El artículo 26.1 LIRPF fija una lista exclusiva, que con carácter general se limita a los gastos de administración y depósito de valores negociables. Los gastos necesarios en general son la regla del capital inmobiliario. La gestión discrecional e individualizada de carteras no es deducible, y el 3 por ciento no limita estos gastos."
  citation: "art. 26.1 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-26
- id: m03-l15-q0176
  prompt:
    es: "Según el artículo 26.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, no son deducibles del rendimiento neto del capital mobiliario las cuantías que supongan la contraprestación de:"
  options:
  - id: a
    text:
      es: "la administración de valores representados en anotaciones en cuenta."
  - id: b
    correct: true
    text:
      es: "una gestión discrecional e individualizada de carteras de inversión."
  - id: c
    text:
      es: "el depósito de valores negociables representados en forma de títulos."
  - id: d
    text:
      es: "los servicios de asistencia técnica prestados fuera de una actividad económica."
  explanation:
    es: "La gestión discrecional e individualizada de carteras queda fuera de los gastos de administración y depósito deducibles (art. 26.1.a) LIRPF). La administración de anotaciones en cuenta y el depósito de títulos sí son deducibles. Y en la asistencia técnica los gastos necesarios se deducen conforme a la letra b)."
  citation: "art. 26.1 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-26
- id: m03-l15-q0177
  prompt:
    es: "Conforme al artículo 26.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en los rendimientos de asistencia técnica, arrendamiento de bienes muebles, negocios o minas o subarrendamientos se deducen los gastos necesarios para su obtención y, en su caso, el importe del:"
  options:
  - id: a
    text:
      es: "interés legal del dinero aplicado a los bienes o derechos de que los ingresos procedan."
  - id: b
    text:
      es: "valor catastral de los bienes o derechos de que los ingresos procedan."
  - id: c
    correct: true
    text:
      es: "deterioro sufrido por los bienes o derechos de que los ingresos procedan."
  - id: d
    text:
      es: "coste de adquisición de los bienes o derechos de que los ingresos procedan."
  explanation:
    es: "Además de los gastos necesarios se deduce el deterioro sufrido por los bienes o derechos (art. 26.1.b) LIRPF). El coste de adquisición entero no se deduce de una vez, el valor catastral es una magnitud de inmuebles y el interés legal no figura entre los conceptos."
  citation: "art. 26.1 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0178
  prompt:
    es: "¿Cómo se califican, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los rendimientos procedentes de la cesión del derecho a la explotación de la imagen cuando dicha cesión no tiene lugar en el ámbito de una actividad económica?"
  options:
  - id: a
    text:
      es: "Como ganancias patrimoniales, por ser la cesión de un derecho de la persona."
  - id: b
    correct: true
    text:
      es: "Como rendimientos del capital mobiliario."
  - id: c
    text:
      es: "Como rendimientos del trabajo, porque derivan de la persona que cede la imagen."
  - id: d
    text:
      es: "Como rendimientos de actividades económicas, aunque no se ordenen medios de producción."
  explanation:
    es: "La cesión del derecho a la explotación de la imagen fuera de una actividad económica produce capital mobiliario (art. 25.4.d) LIRPF). No es trabajo, no es una ganancia por la simple cesión, y solo sería actividad económica si la cesión tuviera lugar en ese ámbito."
  citation: "art. 25.4 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0179
  prompt:
    es: "Según el artículo 25.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué rendimientos se incluyen entre los obtenidos por la participación en los fondos propios de cualquier tipo de entidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Los dividendos, las primas de asistencia a juntas y las participaciones en los beneficios de cualquier tipo de entidad."
  - id: b
    text:
      es: "Los intereses de cuentas, depósitos y activos de renta fija emitidos por la entidad."
  - id: c
    text:
      es: "Los sueldos y salarios que la entidad abone a sus socios por su trabajo personal."
  - id: d
    text:
      es: "Las retribuciones de los administradores de la entidad por su cargo."
  explanation:
    es: "El artículo 25.1.a) LIRPF incluye los dividendos, las primas de asistencia a juntas y las participaciones en beneficios. Los intereses retribuyen la cesión de capitales propios (apartado 2), y sueldos y retribuciones de administradores son rendimientos del trabajo."
  citation: "art. 25.1 LIRPF"
  difficulty: 1
  tags:
  - "capital mobiliario"
