# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0288
  prompt:
    es: "¿Qué documento debe incluir la notificación del acto de declaración de responsabilidad respecto del acuerdo, según el artículo 174.4.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El texto íntegro del acuerdo de declaración de responsabilidad."
  - id: b
    text:
      es: "La propuesta de resolución del órgano de recaudación."
  - id: c
    text:
      es: "El informe del órgano de inspección sobre la responsabilidad del obligado."
  - id: d
    text:
      es: "Un extracto del acuerdo con la parte dispositiva."
  explanation:
    es: "La notificación incluye el texto íntegro del acuerdo (art. 174.4.a LGT), no un extracto. La propuesta de resolución y el informe del órgano de inspección no son contenido que el artículo exija."
  citation: "art. 174.4 LGT"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0292
  prompt:
    es: "¿Qué efecto tiene que la certificación solicitada por quien pretende adquirir una explotación económica deje de facilitarse en el plazo de tres meses, según el artículo 175.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El solicitante queda exento de la responsabilidad del artículo 42.1.c."
  - id: b
    text:
      es: "El solicitante responde únicamente de las deudas conocidas por él en el momento de la adquisición."
  - id: c
    text:
      es: "El solicitante debe reiterar su petición, con un nuevo plazo de tres meses para la Administración."
  - id: d
    text:
      es: "El solicitante responde de todas las deudas de la explotación, con independencia de su origen."
  explanation:
    es: "Si la certificación no llega a tiempo, el solicitante queda exento de la responsabilidad solidaria del artículo 42.1.c (art. 175.2 LGT). No responde de todas las deudas ni solo de las que conozca, y no debe reiterar la petición."
  citation: "art. 175.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-174
- id: m03-l12-q0296
  prompt:
    es: "De acuerdo con el artículo 174.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el pago por el responsable de la deuda que se le deriva:"
  options:
  - id: a
    correct: true
    text:
      es: "Dispone para el pago en período voluntario del plazo del artículo 62.2 y, si no paga, se le exige en vía de apremio con el recargo del período ejecutivo del artículo 28."
  - id: b
    text:
      es: "Dispone para el pago en período voluntario de un plazo de quince días y, si no paga, se le exige con el recargo ejecutivo del 5 por ciento en todo caso."
  - id: c
    text:
      es: "Dispone para el pago del plazo del artículo 62.2 y, si no paga, el apremio se dirige contra el deudor principal y no contra el responsable."
  - id: d
    text:
      es: "Dispone para el pago en período voluntario del plazo del artículo 62.5 y, si no paga, se le exige en vía de apremio con el recargo del artículo 27."
  explanation:
    es: "El responsable paga en el plazo del artículo 62.2 y, si no lo hace, se le exige en apremio con el recargo del período ejecutivo del artículo 28 (art. 174.6 LGT). El artículo 62.5 es el plazo del período ejecutivo y el artículo 27 regula los recargos por declaración extemporánea. No hay un plazo de quince días ni un recargo fijo del 5 por ciento, y el apremio sí se dirige al responsable."
  citation: "art. 174.6 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "porcentaje"
