# anchor: boe-a-2011-18541-art-14
- id: m02-l02-q042
  prompt:
    es: "¿Cuál de las siguientes funciones desarrollan los archivos integrados en el Sistema en todas las fases del ciclo vital, según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Facilitar a las unidades productoras el acceso a sus documentos."
  - id: b
    text:
      es: "Eliminar los documentos de apoyo informativo antes de su transferencia."
  - id: c
    text:
      es: "Elaborar el cuadro de clasificación de las series documentales."
  - id: d
    text:
      es: "Conservar los documentos transferidos desde los Archivos Centrales."
  explanation:
    es: "El artículo 14.1 enumera funciones que todos los archivos del Sistema desarrollan «en todas las fases del ciclo vital». Entre ellas: «Facilitar a las unidades productoras el acceso a sus documentos». Eliminar los documentos de apoyo informativo es función de los archivos de oficina o de gestión (artículo 9). Elaborar el cuadro de clasificación es del Archivo Central (artículo 10.1). Conservar lo transferido desde los Archivos Centrales es del Archivo General de la Administración (artículo 11)."
  citation: "art. 14.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-2
- id: m02-l02-q043
  prompt:
    es: "Según el artículo 2.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el ciclo vital de documentos son las etapas por las que atraviesan los documentos:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde que se producen hasta su eliminación o, en su caso, su conservación permanente."
  - id: b
    text:
      es: "Desde que ingresan en el archivo central hasta su transferencia al archivo histórico."
  - id: c
    text:
      es: "Desde que se registran hasta que finaliza el procedimiento al que se incorporan."
  - id: d
    text:
      es: "Desde que se producen hasta su transferencia al Archivo General de la Administración."
  explanation:
    es: "El artículo 2.2.e) define el ciclo vital como las etapas que atraviesan los documentos «desde que se producen hasta su eliminación conforme al procedimiento establecido, o en su caso, su conservación permanente». No empieza en el archivo central ni en el registro. No termina con la transferencia al Archivo General de la Administración ni con el fin del procedimiento."
  citation: "art. 2.2.e) RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-2
- id: m02-l02-q044
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿qué instrumento, fruto de la valoración documental, recoge el plazo de permanencia de los documentos en cada fase del ciclo vital?"
  options:
  - id: a
    text:
      es: "Cuadro de clasificación."
  - id: b
    correct: true
    text:
      es: "Calendario de conservación."
  - id: c
    text:
      es: "Relación de entrega."
  - id: d
    text:
      es: "Catálogo de procedimientos."
  explanation:
    es: "El artículo 2.2.f) define el calendario de conservación como «el instrumento de trabajo fruto del proceso de valoración documental, en el que se recoge el plazo de permanencia de los documentos de archivo en cada una de las fases del ciclo vital». El cuadro de clasificación lo elabora el Archivo Central para clasificar las series. La relación de entrega acompaña cada transferencia. Un catálogo de procedimientos no recoge plazos de permanencia de documentos."
  citation: "art. 2.2.f) RD 1708/2011"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-dt-primera
- id: m02-l02-q045
  prompt:
    es: "Según la disposición transitoria primera del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, las normas y plazos de transferencias al Archivo General de la Administración del Decreto 914/1969:"
  options:
  - id: a
    text:
      es: "Quedaron derogados en bloque con la entrada en vigor del Real Decreto 1708/2011."
  - id: b
    correct: true
    text:
      es: "Serán sustituidos progresivamente por los calendarios de conservación y normas técnicas de transferencia."
  - id: c
    text:
      es: "Se mantienen sin límite temporal como regulación supletoria de los calendarios."
  - id: d
    text:
      es: "Serán sustituidos por los plazos de transferencia, fijados en años, que establece el propio Real Decreto 1708/2011."
  explanation:
    es: "La disposición transitoria primera dice que esas normas y plazos «serán sustituidos progresivamente por los calendarios de conservación y normas técnicas de transferencia que se aprueben». No quedaron derogados de golpe. Tampoco siguen sin límite: se sustituyen a medida que se aprueban calendarios. El Real Decreto 1708/2011 no fija plazos de transferencia en años."
  citation: "disposición transitoria primera RD 1708/2011"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12534-art-55
- id: m02-l02-q046
  prompt:
    es: "Conforme al artículo 55.1 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, la exclusión o eliminación de los documentos de titularidad pública:"
  options:
  - id: a
    text:
      es: "Podrá acordarla libremente el órgano que los custodie."
  - id: b
    text:
      es: "Requerirá una autorización por ley de las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Deberá ser autorizada por la Administración competente."
  - id: d
    text:
      es: "Deberá ser autorizada en todo caso por el Archivo Histórico Nacional."
  explanation:
    es: "El artículo 55.1 dice que la exclusión o eliminación de esos bienes «deberá ser autorizada por la Administración competente». El órgano que los custodia no decide por sí solo. No hace falta una ley. El Archivo Histórico Nacional no es quien autoriza."
  citation: "art. 55.1 Ley 16/1985"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12534-art-55
- id: m02-l02-q047
  prompt:
    es: "Según el artículo 55.2 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, ¿hasta cuándo se prohíbe en todo caso destruir los documentos de titularidad pública?"
  options:
  - id: a
    correct: true
    text:
      es: "Mientras subsista su valor probatorio de derechos y obligaciones de las personas o los entes públicos."
  - id: b
    text:
      es: "Mientras no hayan transcurrido cuarenta años desde su producción por el órgano que los generó."
  - id: c
    text:
      es: "Mientras permanezcan en el archivo de oficina o de gestión de la unidad productora."
  - id: d
    text:
      es: "Mientras el archivo central de su Ministerio no los haya descrito conforme a las normas."
  explanation:
    es: "El artículo 55.2 dice: «En ningún caso se podrán destruir tales documentos en tanto subsista su valor probatorio de derechos y obligaciones de las personas o los entes públicos». No fija un plazo de cuarenta años. La prohibición no depende de que sigan en el archivo de oficina ni de que el archivo central los describa."
  citation: "art. 55.2 Ley 16/1985"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1985-12534-art-58
- id: m02-l02-q048
  prompt:
    es: "¿A qué órgano corresponde el estudio y dictamen de las cuestiones relativas a la calificación y utilización de los documentos de la Administración del Estado y del sector público estatal?"
  options:
  - id: a
    text:
      es: "A la Comisión de Archivos de la Administración General del Estado."
  - id: b
    text:
      es: "Al Consejo del Patrimonio Histórico."
  - id: c
    text:
      es: "Al Archivo General de la Administración."
  - id: d
    correct: true
    text:
      es: "A la Comisión Superior Calificadora de Documentos Administrativos."
  explanation:
    es: "El artículo 58 de la Ley 16/1985 dice que ese estudio y dictamen «corresponderá a una Comisión Superior Calificadora de Documentos Administrativos». La Comisión de Archivos es el órgano al que esa Comisión se adscribe como órgano consultivo superior (artículo 13.6 del Real Decreto 1708/2011). El Consejo del Patrimonio Histórico es otro órgano de la Ley 16/1985. El Archivo General de la Administración aplica las resoluciones de la Comisión, no las dicta."
  citation: "art. 58 Ley 16/1985"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2011-18541-art-13
- id: m02-l02-q049
  prompt:
    es: "Según el artículo 13.6 del Real Decreto 1708/2011, de 18 de noviembre, la Comisión Superior Calificadora de Documentos Administrativos se adscribe a la Comisión de Archivos de la Administración General del Estado como:"
  options:
  - id: a
    correct: true
    text:
      es: "Su órgano consultivo superior."
  - id: b
    text:
      es: "Su órgano ejecutivo de gestión."
  - id: c
    text:
      es: "Su secretaría técnica permanente."
  - id: d
    text:
      es: "Su órgano de control de la eliminación."
  explanation:
    es: "El artículo 13.6 dice que la Comisión Superior Calificadora «se adscribe a la Comisión de Archivos de la Administración General del Estado como su órgano consultivo superior». No es un órgano ejecutivo ni una secretaría técnica. El artículo tampoco la configura como órgano de control de la eliminación."
  citation: "art. 13.6 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-8
- id: m02-l02-q050
  prompt:
    es: "¿Cuál de las siguientes es la clasificación de los Archivos del Sistema de Archivos de la Administración General del Estado según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Archivos de oficina o de gestión, archivos generales o centrales, archivos provinciales y archivos históricos."
  - id: b
    correct: true
    text:
      es: "Archivos de oficina o de gestión, archivos generales o centrales, archivo intermedio y archivos históricos."
  - id: c
    text:
      es: "Archivos de oficina o de gestión, archivo intermedio, archivos históricos y archivo electrónico único."
  - id: d
    text:
      es: "Archivos administrativos, archivos generales o centrales, archivo intermedio y archivos de conservación permanente."
  explanation:
    es: "El artículo 8 clasifica los Archivos, atendiendo al ciclo vital de los documentos, en archivos de oficina o de gestión, archivos generales o centrales de los Ministerios y de los organismos públicos dependientes de los mismos, archivo intermedio y archivos históricos. Los archivos provinciales no son una clase del artículo 8. El archivo electrónico único es una figura de la Ley 39/2015, no una clase del artículo 8, y esa lista además omite los archivos centrales. Los archivos administrativos y los de conservación permanente no aparecen en la lista."
  citation: "art. 8 RD 1708/2011"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2011-18541-art-9
- id: m02-l02-q052
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde a los archivos de oficina o de gestión según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Elaborar el cuadro de clasificación de las series de su Ministerio."
  - id: b
    text:
      es: "Realizar transferencias periódicas al archivo intermedio con su relación de entrega."
  - id: c
    text:
      es: "Completar las descripciones de las agrupaciones documentales recibidas del Archivo Central."
  - id: d
    correct: true
    text:
      es: "Acreditar las actuaciones y actividades de la unidad productora."
  explanation:
    es: "El artículo 9 atribuye a los archivos de oficina o de gestión la función de «Acreditar las actuaciones y actividades de la unidad productora». Elaborar el cuadro de clasificación y transferir al archivo intermedio con la relación de entrega son funciones del Archivo Central (artículo 10.1). Completar las descripciones del Archivo Central es función del Archivo General de la Administración (artículo 11)."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-9
- id: m02-l02-q053
  prompt:
    es: "Según el artículo 9 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los documentos de los archivos de oficina, concluida su tramitación, se transfieren al archivo central del Departamento:"
  options:
  - id: a
    text:
      es: "Al cumplirse cinco años desde la finalización del procedimiento."
  - id: b
    correct: true
    text:
      es: "De acuerdo con los plazos establecidos durante el proceso de valoración."
  - id: c
    text:
      es: "Cuando lo acuerde la Comisión de Archivos de la Administración General del Estado."
  - id: d
    text:
      es: "Una vez prescritas las acciones derivadas del procedimiento."
  explanation:
    es: "El artículo 9 dice que esos documentos «serán objeto de transferencia al archivo central del Departamento respectivo, de acuerdo con los plazos establecidos durante el proceso de valoración». El Real Decreto no fija cinco años. La transferencia no depende de un acuerdo de la Comisión de Archivos. Tampoco de la prescripción de las acciones."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2011-18541-art-10
- id: m02-l02-q054
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde al Archivo Central según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Eliminar los documentos de apoyo informativo antes de la transferencia al Archivo central."
  - id: b
    correct: true
    text:
      es: "Llevar a cabo el proceso de identificación de series y elaborar el cuadro de clasificación."
  - id: c
    text:
      es: "Acreditar las actuaciones y actividades de la unidad productora de los documentos."
  - id: d
    text:
      es: "Custodiar los documentos en fase de tramitación o de continua consulta administrativa."
  explanation:
    es: "El artículo 10.1 incluye entre las funciones del Archivo Central «Llevar a cabo el proceso de identificación de series y elaborar el cuadro de clasificación». Eliminar los documentos de apoyo informativo y acreditar las actuaciones de la unidad productora son funciones de los archivos de oficina o de gestión (artículo 9). Custodiar los documentos en tramitación o de continua consulta también es propio de esos archivos de oficina."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-10
- id: m02-l02-q055
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los archivos generales o centrales custodian los documentos:"
  options:
  - id: a
    text:
      es: "Mientras están en fase de tramitación o sometidos a continua utilización y consulta administrativa por su unidad productora."
  - id: b
    text:
      es: "Desde que se producen, para apoyar la gestión administrativa de cada unidad productora."
  - id: c
    correct: true
    text:
      es: "Una vez finalizada su tramitación y transcurridos los plazos de la normativa o de los calendarios de conservación."
  - id: d
    text:
      es: "Una vez finalizada su tramitación, sin sujeción a plazo alguno de permanencia previa."
  explanation:
    es: "El artículo 10.1 dice que estos archivos custodian los documentos «una vez finalizada su tramitación y transcurridos los plazos establecidos por la normativa vigente o en los calendarios de conservación». La fase de tramitación y de continua consulta corresponde a los archivos de oficina o de gestión (artículo 9). Apoyar la gestión desde la producción también es función de esos archivos. No basta que termine la tramitación: deben transcurrir los plazos."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-10
- id: m02-l02-q056
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Archivo Central realiza las transferencias preceptivas y periódicas de documentos, con su relación de entrega:"
  options:
  - id: a
    text:
      es: "Al Archivo Histórico Nacional, directamente."
  - id: b
    text:
      es: "A los archivos de oficina o de gestión."
  - id: c
    correct: true
    text:
      es: "Al archivo intermedio."
  - id: d
    text:
      es: "Al archivo electrónico único de su Ministerio."
  explanation:
    es: "El artículo 10.1 atribuye al Archivo Central «Realizar las transferencias preceptivas y periódicas de documentos al archivo intermedio, acompañadas de su correspondiente relación de entrega». Al Archivo Histórico Nacional los documentos llegan desde el Archivo General de la Administración, no desde el Archivo Central. Los archivos de oficina transfieren al Archivo Central, no al revés. El archivo electrónico único no es el destino que fija el artículo."
  citation: "art. 10.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2011-18541-art-11
- id: m02-l02-q057
  prompt:
    es: "¿Qué archivo es el archivo intermedio de la Administración General del Estado, adscrito al Ministerio de Cultura?"
  options:
  - id: a
    correct: true
    text:
      es: "El Archivo General de la Administración."
  - id: b
    text:
      es: "El Archivo Histórico Nacional."
  - id: c
    text:
      es: "El Archivo General de Simancas."
  - id: d
    text:
      es: "El Archivo Central del Ministerio de Cultura."
  explanation:
    es: "El artículo 11 del Real Decreto 1708/2011 dice: «El Archivo General de la Administración, es el archivo intermedio de la Administración General del Estado». El Archivo Histórico Nacional ejerce las funciones de archivo histórico (artículo 12.2). El Archivo General de Simancas es un archivo histórico. El archivo central de un Ministerio es un archivo general o central, no el intermedio."
  citation: "art. 11 RD 1708/2011"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-11
- id: m02-l02-q058
  prompt:
    es: "Según el artículo 11 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el archivo intermedio custodia los documentos de los Departamentos ministeriales y sus organismos públicos:"
  options:
  - id: a
    text:
      es: "Mientras se encuentran en fase de tramitación o de continua utilización administrativa."
  - id: b
    text:
      es: "Una vez declarado su valor histórico por la Comisión Superior Calificadora."
  - id: c
    correct: true
    text:
      es: "Una vez finalizada su fase activa conforme a lo establecido en los calendarios de conservación."
  - id: d
    text:
      es: "Desde su producción hasta su eliminación o su conservación permanente."
  explanation:
    es: "El artículo 11 define el archivo intermedio como responsable de la custodia de esos documentos «una vez finalizada su fase activa conforme a lo establecido en los calendarios de conservación». La fase de tramitación es la de los archivos de oficina. Los documentos con valor histórico van al archivo histórico. Desde la producción hasta la eliminación o conservación permanente es todo el ciclo vital, no la fase del archivo intermedio."
  citation: "art. 11 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-11
- id: m02-l02-q059
  prompt:
    es: "¿Cuál de las siguientes es una función del Archivo General de la Administración según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Coordinar y controlar el funcionamiento de los archivos de gestión de cada Ministerio."
  - id: b
    text:
      es: "Organizar los documentos producidos por cada una de las unidades administrativas."
  - id: c
    text:
      es: "Custodiar los documentos en fase de tramitación de cada unidad administrativa."
  - id: d
    correct: true
    text:
      es: "Conservar los documentos que son transferidos desde los Archivos Centrales de los Ministerios."
  explanation:
    es: "El artículo 11 da al Archivo General de la Administración, como primera función, «Conservar los documentos que son transferidos desde los Archivos Centrales de los Ministerios». Coordinar y controlar los archivos de gestión es función del Archivo Central (artículo 10.1). Organizar los documentos de cada unidad y custodiar los que están en tramitación corresponde a los archivos de oficina o de gestión (artículo 9)."
  citation: "art. 11 RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2011-18541-art-11
- id: m02-l02-q060
  prompt:
    es: "Según el artículo 11 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿a qué Ministerio está adscrito el Archivo General de la Administración?"
  options:
  - id: a
    text:
      es: "Al Ministerio para la Transformación Digital y de la Función Pública."
  - id: b
    correct: true
    text:
      es: "Al Ministerio de Cultura."
  - id: c
    text:
      es: "Al Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    text:
      es: "Al Ministerio de Hacienda."
  explanation:
    es: "El artículo 11 habla del Archivo General de la Administración «como archivo intermedio de la Administración General del Estado y adscrito al Ministerio de Cultura». No está adscrito al Ministerio para la Transformación Digital y de la Función Pública, que gestiona el Registro Electrónico General. Tampoco al de la Presidencia, Justicia y Relaciones con las Cortes ni al de Hacienda."
  citation: "art. 11 RD 1708/2011"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-12
- id: m02-l02-q061
  prompt:
    es: "Según el artículo 12.1 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, los archivos históricos custodian, conservan y tratan los fondos del patrimonio histórico documental español:"
  options:
  - id: a
    text:
      es: "Que tengan una antigüedad superior a cien años, cualquiera que sea la persona física o jurídica que los produjo."
  - id: b
    text:
      es: "Que hayan finalizado su fase activa conforme a lo establecido en los calendarios de conservación de cada Ministerio."
  - id: c
    text:
      es: "Que generen o reúnan las Comunidades Autónomas y las Entidades Locales en su ámbito."
  - id: d
    correct: true
    text:
      es: "Que reflejen la trayectoria de la administración estatal o resulten altamente significativos por su valor histórico."
  explanation:
    es: "El artículo 12.1 se refiere a los fondos «que sean reflejo de la trayectoria de la administración estatal a lo largo de la historia o que en todo caso resulten altamente significativos por su valor histórico, su singular importancia o su proyección internacional». Los cien años son un requisito del artículo 49.4 de la Ley 16/1985 para los particulares. La fase activa finalizada define lo que custodia el archivo intermedio (artículo 11). Los fondos de las Comunidades Autónomas y Entidades Locales no son el criterio del artículo."
  citation: "art. 12.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-12
- id: m02-l02-q062
  prompt:
    es: "Fuera del ámbito de los servicios periféricos, ¿qué archivo ejerce las funciones de archivo histórico de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El Archivo General de la Administración."
  - id: b
    text:
      es: "El Archivo Central del Ministerio de Cultura."
  - id: c
    text:
      es: "El archivo central de cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "El Archivo Histórico Nacional."
  explanation:
    es: "El artículo 12.2 del Real Decreto 1708/2011 dice: «El Archivo Histórico Nacional ejerce las funciones de archivo histórico de la Administración General del Estado». El Archivo General de la Administración es el archivo intermedio (artículo 11). El archivo central de cualquier Ministerio, el de Cultura incluido, es un archivo general o central (artículo 10)."
  citation: "art. 12.2 RD 1708/2011"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-12
- id: m02-l02-q063
  prompt:
    es: "Según el artículo 12.2 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, ¿desde qué archivo recibe el Archivo Histórico Nacional los documentos con valor histórico que conserva?"
  options:
  - id: a
    text:
      es: "Directamente desde los archivos centrales de los Ministerios."
  - id: b
    text:
      es: "Desde los archivos de oficina o de gestión."
  - id: c
    correct: true
    text:
      es: "Desde el Archivo General de la Administración."
  - id: d
    text:
      es: "Desde los Archivos Históricos Provinciales."
  explanation:
    es: "Entre las funciones del Archivo Histórico Nacional, el artículo 12.2.a) recoge «Conservar los documentos con valor histórico que le son transferidos desde el Archivo General de la Administración». Los archivos centrales transfieren al archivo intermedio, no al histórico. Los archivos de oficina transfieren al archivo central. Los Archivos Históricos Provinciales ejercen las funciones de archivo intermedio e histórico en los servicios periféricos; el artículo no los señala como origen de esas transferencias."
  citation: "art. 12.2.a) RD 1708/2011"
  difficulty: 3
  tags:
  - "procedimiento"
