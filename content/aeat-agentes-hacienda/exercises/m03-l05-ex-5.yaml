  explanation:
    es: "Con solicitud en plazo y sin denegación expresa antes de que acabe el plazo, la ampliación se entiende concedida por la mitad del plazo inicial: 10 días. No hay denegación presunta, no se concede el plazo entero y no hace falta informe."
