# anchor: boe-a-2006-20764-art-53
- id: m03-l16-q0031
  prompt:
    es: "De acuerdo con el artículo 53.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las aportaciones a planes de pensiones a favor de personas con discapacidad dan derecho a reducción si el grado de minusvalía psíquica es igual o superior al:"
  options:
  - id: a
    correct: true
    text:
      es: "33 por 100, o si existe incapacidad declarada judicialmente con independencia de su grado."
  - id: b
    text:
      es: "65 por 100, o si existe incapacidad declarada judicialmente con independencia de su grado."
  - id: c
    text:
      es: "33 por 100, siempre que además la incapacidad esté declarada judicialmente y alcance el 65 por 100."
  - id: d
    text:
      es: "50 por 100, sin necesidad de declaración judicial de incapacidad."
  explanation:
    es: "Para la minusvalía psíquica basta el 33 por 100, y también sirve la incapacidad declarada judicialmente con independencia de su grado (art. 53.1). El 65 por 100 es el umbral para la minusvalía física o sensorial. Exigir a la vez declaración judicial y el 65 por 100 mezcla requisitos que la ley presenta como alternativos. Y el 50 por 100 no es una cifra del precepto."
  citation: "art. 53.1 LIRPF"
  difficulty: 3
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-53
- id: m03-l16-q0032
  prompt:
    es: "Según el artículo 53.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el límite anual de las aportaciones a planes de pensiones realizadas por las propias personas con discapacidad partícipes que dan derecho a reducción?"
  options:
  - id: a
    correct: true
    text:
      es: "Es de 24.250 euros anuales."
  - id: b
    text:
      es: "Es de 10.000 euros anuales."
  - id: c
    text:
      es: "Es de 8.500 euros anuales."
  - id: d
    text:
      es: "Es de 5.000 euros anuales."
  explanation:
    es: "Las aportaciones de las propias personas con discapacidad tienen un límite de 24.250 euros anuales (art. 53.1.b). Los 10.000 euros son el límite de las aportaciones de quienes tienen parentesco o tutoría. Los 8.500 y los 5.000 euros son cifras del artículo 52.1, ajenas a este límite."
  citation: "art. 53.1 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-53
- id: m03-l16-q0033
  prompt:
    es: "Conforme al artículo 53.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las aportaciones anuales a planes de pensiones a favor de personas con discapacidad realizadas por quienes tienen con ellas relación de parentesco o tutoría se reducen con el límite de:"
  options:
  - id: a
    text:
      es: "una cuantía de 24.250 euros anuales."
  - id: b
    text:
      es: "una cuantía de 8.500 euros anuales."
  - id: c
    text:
      es: "una cuantía de 4.250 euros anuales."
  - id: d
    correct: true
    text:
      es: "una cuantía de 10.000 euros anuales."
  explanation:
    es: "Quienes tienen parentesco o tutoría con la persona con discapacidad reducen hasta 10.000 euros anuales (art. 53.1.a). Los 24.250 euros son el límite de las aportaciones de la propia persona con discapacidad y el tope conjunto de todos los aportantes. Los 8.500 y los 4.250 euros son incrementos del límite de previsión social del artículo 52."
  citation: "art. 53.1 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-53
- id: m03-l16-q0034
  prompt:
    es: "De acuerdo con el artículo 53.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las reducciones por aportaciones a favor de una misma persona con discapacidad:"
  options:
  - id: a
    text:
      es: "El conjunto de las reducciones practicadas por todas las personas que aporten a su favor, incluida ella misma, no puede exceder de 10.000 euros anuales."
  - id: b
    text:
      es: "Cada aportante puede reducir hasta 24.250 euros anuales, sin que exista un límite conjunto."
  - id: c
    correct: true
    text:
      es: "El conjunto de las reducciones practicadas por todas las personas que aporten a su favor, incluida ella misma, no puede exceder de 24.250 euros anuales."
  - id: d
    text:
      es: "Las reducciones de las aportaciones de la propia persona con discapacidad no computan para el límite conjunto."
  explanation:
    es: "El tope conjunto es de 24.250 euros anuales para todas las personas que aporten a favor de la misma persona con discapacidad, incluidas las aportaciones de ella (art. 53.1). Los 10.000 euros son el límite individual de parientes y tutores. Negar el tope conjunto o excluir las aportaciones de la propia persona contradice el texto, que las menciona expresamente."
  citation: "art. 53.1 LIRPF"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-54
- id: m03-l16-q0035
  prompt:
    es: "Según el artículo 54.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, dan derecho a reducir la base imponible del aportante las aportaciones al patrimonio protegido de la persona con discapacidad efectuadas por quienes tengan con ella una relación de parentesco en línea directa o colateral hasta el:"
  options:
  - id: a
    text:
      es: "segundo grado inclusive, además del cónyuge."
  - id: b
    correct: true
    text:
      es: "tercer grado inclusive, además del cónyuge."
  - id: c
    text:
      es: "cuarto grado inclusive, además del cónyuge."
  - id: d
    text:
      es: "primer grado, con exclusión del cónyuge."
  explanation:
    es: "La reducción alcanza a los parientes en línea directa o colateral hasta el tercer grado inclusive, además de al cónyuge y a quienes tengan a la persona a su cargo en tutela o acogimiento (art. 54.1). Segundo y cuarto grado fijan otro límite. Y el cónyuge no queda excluido: se menciona expresamente."
  citation: "art. 54.1 LIRPF"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-54
- id: m03-l16-q0036
  prompt:
    es: "De acuerdo con el artículo 54.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el límite máximo anual de reducción de la base imponible del aportante por las aportaciones a un patrimonio protegido de una persona con discapacidad?"
  options:
  - id: a
    text:
      es: "24.250 euros anuales por aportante, sin que exista un límite para el conjunto de las reducciones."
  - id: b
    correct: true
    text:
      es: "10.000 euros anuales por aportante, sin que el conjunto de las reducciones por un mismo patrimonio pueda exceder de 24.250 euros anuales."
  - id: c
    text:
      es: "10.000 euros anuales para el conjunto de las reducciones por un mismo patrimonio protegido."
  - id: d
    text:
      es: "8.500 euros anuales por aportante, sin que el conjunto de las reducciones por un mismo patrimonio pueda exceder de 24.250 euros anuales."
  explanation:
    es: "Cada aportante reduce con el límite de 10.000 euros anuales, y el conjunto de las reducciones por un mismo patrimonio protegido no puede exceder de 24.250 euros anuales (art. 54.1). Invertir las cifras o eliminar el tope conjunto contradice el artículo. Los 8.500 euros pertenecen al artículo 52.1."
  citation: "art. 54.1 LIRPF"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-55
- id: m03-l16-q0037
  prompt:
    es: "Según el artículo 55 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué pensiones y anualidades pueden ser objeto de reducción en la base imponible?"
  options:
  - id: a
    correct: true
    text:
      es: "Las pensiones compensatorias a favor del cónyuge y las anualidades por alimentos, salvo las fijadas en favor de los hijos del contribuyente, satisfechas ambas por decisión judicial."
  - id: b
    text:
      es: "Las pensiones compensatorias a favor del cónyuge y las anualidades por alimentos, incluidas las fijadas en favor de los hijos del contribuyente, satisfechas ambas por decisión judicial."
  - id: c
    text:
      es: "Las pensiones compensatorias a favor del cónyuge y las anualidades por alimentos, salvo las fijadas en favor de los hijos del contribuyente, aunque se satisfagan por acuerdo privado."
  - id: d
    text:
      es: "Solo las pensiones compensatorias a favor del cónyuge, sin las anualidades por alimentos."
  explanation:
    es: "Se reducen las pensiones compensatorias a favor del cónyuge y las anualidades por alimentos, con excepción de las fijadas en favor de los hijos, siempre que se satisfagan por decisión judicial (art. 55). Incluir a los hijos desvirtúa la excepción. El acuerdo privado no basta: la ley exige decisión judicial. Y las anualidades por alimentos que no sean a favor de los hijos también reducen."
  citation: "art. 55 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-56
- id: m03-l16-q0038
  prompt:
    es: "De acuerdo con el artículo 56.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo personal y familiar constituye la parte de la base liquidable que, por destinarse a satisfacer las necesidades básicas personales y familiares del contribuyente:"
  options:
  - id: a
    text:
      es: "se somete a tributación a un tipo reducido del 9,50 por ciento."
  - id: b
    text:
      es: "se deduce directamente de la cuota líquida estatal."
  - id: c
    text:
      es: "se grava únicamente en la base liquidable del ahorro."
  - id: d
    correct: true
    text:
      es: "no se somete a tributación por el impuesto."
  explanation:
    es: "El mínimo personal y familiar es la parte de la base liquidable que no se somete a tributación (art. 56.1). La ley no le aplica un tipo reducido: la escala se aplica a toda la base y luego se minora la cuantía en el importe que resulta de aplicarla al mínimo. No se deduce de la cuota líquida ni se grava solo en la base del ahorro."
  citation: "art. 56.1 LIRPF"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-56
- id: m03-l16-q0040
  prompt:
    es: "Según el artículo 56.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la parte de la base liquidable de la que forma parte el mínimo personal y familiar:"
  options:
  - id: a
    text:
      es: "Cuando la base liquidable general sea superior al mínimo, este forma parte de la base liquidable del ahorro."
  - id: b
    text:
      es: "Cuando la base liquidable general sea inferior al mínimo, forma parte de ella por el importe del mínimo y deja la general negativa."
  - id: c
    correct: true
    text:
      es: "Cuando no exista base liquidable general, forma parte de la base liquidable del ahorro."
  - id: d
    text:
      es: "Cuando no exista base liquidable general, no se tiene en cuenta el mínimo."
  explanation:
    es: "Si no hay base liquidable general, el mínimo forma parte de la del ahorro (art. 56.2). Si la general supera el mínimo, este forma parte de ella, no de la del ahorro. Si es inferior, el mínimo forma parte de la general por el importe de esta y de la del ahorro por el resto, sin dejarla negativa. Y la ausencia de base general no anula el mínimo, que pasa a la base del ahorro."
  citation: "art. 56.2 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-56
- id: m03-l16-q0041
  prompt:
    es: "El mínimo personal y familiar de Rafael Prieto es de 5.550 euros. Su base liquidable general es de 3.000 euros y su base liquidable del ahorro de 10.000 euros. Según el artículo 56.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿de qué parte de cada base forma parte su mínimo?"
  options:
  - id: a
    text:
      es: "5.550 euros de la base liquidable general y ninguno de la del ahorro."
  - id: b
    correct: true
    text:
      es: "3.000 euros de la base liquidable general y 2.550 euros de la base liquidable del ahorro."
  - id: c
    text:
      es: "2.550 euros de la base liquidable general y 3.000 euros de la base liquidable del ahorro."
  - id: d
    text:
      es: "Ninguno de la base liquidable general y 5.550 euros de la base liquidable del ahorro."
  explanation:
    es: "La base general (3.000 euros) es inferior al mínimo (5.550 euros). El mínimo forma parte de la general por el importe de esta, 3.000 euros, y de la del ahorro por el resto: 5.550 - 3.000 = 2.550 euros (art. 56.2). Asignar todo a la general supera la base disponible. Invertir los importes los reparte al revés. Y llevarlo todo al ahorro solo procede si no existe base general, que aquí existe."
  citation: "art. 56.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2006-20764-art-57
- id: m03-l16-q0042
  prompt:
    es: "Según el artículo 57.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el mínimo del contribuyente con carácter general?"
  options:
  - id: a
    correct: true
    text:
      es: "Es de 5.550 euros anuales."
  - id: b
    text:
      es: "Es de 8.100 euros anuales."
  - id: c
    text:
      es: "Es de 2.400 euros anuales."
  - id: d
    text:
      es: "Es de 1.150 euros anuales."
  explanation:
    es: "El mínimo del contribuyente es, con carácter general, de 5.550 euros anuales (art. 57.1). Los 8.100 euros son el total que alcanza con más de 75 años. Los 2.400 euros son la cuantía por el primer descendiente y los 1.150 euros el aumento por superar los 65 años."
  citation: "art. 57.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-57
- id: m03-l16-q0043
  prompt:
    es: "Marcos Gil tiene 70 años a la fecha de devengo del impuesto y no tiene discapacidad. Conforme al artículo 57 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su mínimo del contribuyente?"
  options:
  - id: a
    text:
      es: "Su mínimo del contribuyente es de 5.550 euros anuales."
  - id: b
    text:
      es: "Su mínimo del contribuyente es de 8.100 euros anuales."
  - id: c
    text:
      es: "Su mínimo del contribuyente es de 6.950 euros anuales."
  - id: d
    correct: true
    text:
      es: "Su mínimo del contribuyente es de 6.700 euros anuales."
  explanation:
    es: "Con más de 65 años el mínimo se aumenta en 1.150 euros: 5.550 + 1.150 = 6.700 euros (art. 57). Los 5.550 euros olvidan el aumento por edad. Los 8.100 euros incluyen el aumento de 1.400 euros, que exige superar los 75 años. Y 6.950 euros sale de sumar solo los 1.400 euros, sin los 1.150."
  citation: "art. 57 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2006-20764-art-57
- id: m03-l16-q0044
  prompt:
    es: "Elvira Navas tiene 80 años a la fecha de devengo del impuesto y no tiene discapacidad. Aplicando el artículo 57 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su mínimo del contribuyente?"
  options:
  - id: a
    text:
      es: "Su mínimo del contribuyente es de 6.700 euros anuales."
  - id: b
    text:
      es: "Su mínimo del contribuyente es de 6.950 euros anuales."
  - id: c
    text:
      es: "Su mínimo del contribuyente es de 9.250 euros anuales."
  - id: d
    correct: true
    text:
      es: "Su mínimo del contribuyente es de 8.100 euros anuales."
  explanation:
    es: "Con más de 75 años se suman el aumento de 1.150 euros por superar los 65 y el adicional de 1.400 euros: 5.550 + 1.150 + 1.400 = 8.100 euros (art. 57). Los 6.700 euros omiten el aumento adicional. Los 6.950 euros omiten el de 1.150. Los 9.250 euros cuentan dos veces el aumento por superar los 65 años. En el examen 2022 extraordinario (pregunta 88) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 57 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
