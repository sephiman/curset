- id: g-back-pressure
  term: {en: back pressure}
  definition: {en: "A task producing data faster than the downstream operators can consume it. Records flow downstream, and back pressure is propagated in the opposite direction, up the stream."}
  origin: m08-l04
  citation: "flink-back-pressure#back-pressure"
- id: g-deadline-propagation-grpc
  term: {en: deadline propagation}
  definition: {en: "Automatically propagating the deadline from an incoming RPC to an outgoing one, so that a server that also acts as a client honors the deadline set by the original client."}
  origin: m08-l04
  citation: "grpc-deadlines#deadline-propagation"
