# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q386
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos restablece la caché de Microsoft Store, según las preguntas frecuentes de la Asistencia rápida?"
  options:
  - id: a
    correct: true
    text:
      es: "wsreset.exe"
  - id: b
    text:
      es: "regedit"
  - id: c
    text:
      es: "eventvwr.msc"
  - id: d
    text:
      es: "recoverydrive.exe"
  explanation:
    es: "La página dice que se restablece la caché de Microsoft Store con la tecla Windows y R, escribiendo wsreset.exe y seleccionando Aceptar. regedit abre el Editor del Registro, eventvwr.msc abre el Visor de eventos y recoverydrive.exe abre la Unidad de recuperación."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Preguntas frecuentes»"
  difficulty: 2
  tags:
  - "configuración"
