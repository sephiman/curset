# anchor: boe-a-2015-10565-art-81
- id: q21
  lesson: m03-l06
  prompt:
    es: "Según el artículo 81.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si Doña Mercedes reclama 62.000 euros y su audiencia termina el martes, 23 de noviembre de 2027, ¿hasta qué fecha debe el instructor remitir la propuesta de resolución?"
  options:
  - id: a
    text:
      es: "El viernes, 3 de diciembre de 2027."
  - id: b
    text:
      es: "El martes, 7 de diciembre de 2027."
  - id: c
    text:
      es: "El jueves, 16 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El jueves, 9 de diciembre de 2027."
  explanation:
    es: "El dictamen del Consejo de Estado es preceptivo cuando se reclaman 50.000 euros o más, y entonces el instructor remite la propuesta de resolución en diez días desde que termina la audiencia (art. 81.2 LPAC). Doña Mercedes reclama 62.000 euros, así que el plazo corre. Los días son hábiles y se cuentan desde el miércoles, 24 de noviembre de 2027: del miércoles 24 al viernes 26 van 3, del lunes 29 de noviembre al viernes 3 de diciembre van 8, el martes 7 de diciembre es el 9 y el jueves 9 es el 10, porque el lunes 6 y el miércoles 8 de diciembre son festivos. Termina el jueves, 9 de diciembre de 2027. La fecha del viernes, 3 de diciembre de 2027, cuenta diez días naturales. La del martes, 7 de diciembre de 2027, no excluye los dos festivos. La del jueves, 16 de diciembre de 2027, cuenta quince días hábiles, el máximo de la audiencia del artículo 82.2."
  citation: "art. 81.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-213
- id: q22
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 213.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el SEPE resuelve el contrato de atención telefónica por incumplimiento culpable de la empresa, cuya garantía definitiva ya está constituida, ¿qué ocurre con esa garantía?"
  options:
  - id: a
    correct: true
    text:
      es: "Se le incauta la garantía y debe indemnizar además los daños y perjuicios que excedan de su importe."
  - id: b
    text:
      es: "Se le incauta la garantía y queda libre de cualquier otra indemnización a la Administración."
  - id: c
    text:
      es: "Se le devuelve la garantía, porque los doce días de demora no justifican incautarla."
  - id: d
    text:
      es: "Se le incauta la garantía solo si el SEPE antes impuso penalidades diarias por la demora."
  explanation:
    es: "Cuando el contrato se resuelve por incumplimiento culpable del contratista, se le incauta la garantía y debe además indemnizar a la Administración los daños y perjuicios que excedan del importe de la garantía incautada (art. 213.3 LCSP). La empresa del servicio telefónico, si el SEPE resolviera por su culpa, perdería la garantía definitiva y respondería del exceso. La opción que la libera de toda otra indemnización ignora ese exceso. La devolución de la garantía contradice la incautación, y la duración de la demora no la evita cuando el incumplimiento es culpable. Condicionar la incautación a unas penalidades previas añade un requisito que la norma no exige."
  citation: "art. 213.3 LCSP"
  difficulty: 2
  tags:
  - "efecto"
