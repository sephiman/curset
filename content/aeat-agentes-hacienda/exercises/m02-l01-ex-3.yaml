# anchor: boe-a-1997-25336-art-24
- id: m02-l01-q0098
  prompt:
    es: "De acuerdo con el artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, revisten la forma de Reales Decretos del Presidente del Gobierno:"
  options:
  - id: a
    text:
      es: "Las decisiones que aprueben normas reglamentarias de la competencia del Consejo de Ministros."
  - id: b
    text:
      es: "Las decisiones del Consejo de Ministros que no deban adoptar la forma de Real Decreto."
  - id: c
    correct: true
    text:
      es: "Las disposiciones y actos cuya adopción venga atribuida al Presidente."
  - id: d
    text:
      es: "Las disposiciones y resoluciones de los Ministros."
  explanation:
    es: "Los Reales Decretos del Presidente del Gobierno recogen las disposiciones y actos cuya adopción venga atribuida al Presidente (art. 24.1.b). Las normas reglamentarias del Consejo de Ministros adoptan la forma de Reales Decretos acordados en Consejo de Ministros (letra c), las decisiones residuales del Consejo son Acuerdos (letra d) y las disposiciones y resoluciones de los Ministros son Órdenes Ministeriales (letra f)."
  citation: "art. 24.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "formas de las decisiones del Gobierno"
# anchor: boe-a-1997-25336-art-24
- id: m02-l01-q0099
  prompt:
    es: "Según el artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las decisiones que aprueben normas reglamentarias de la competencia del Consejo de Ministros revisten la forma de:"
  options:
  - id: a
    text:
      es: "Acuerdos del Consejo de Ministros."
  - id: b
    text:
      es: "Reales Decretos del Presidente del Gobierno."
  - id: c
    text:
      es: "Órdenes del Ministro competente."
  - id: d
    correct: true
    text:
      es: "Reales Decretos acordados en Consejo de Ministros."
  explanation:
    es: "Las normas reglamentarias de la competencia del Consejo de Ministros se aprueban mediante Reales Decretos acordados en Consejo de Ministros (art. 24.1.c). Los Acuerdos del Consejo de Ministros recogen las decisiones que no deban adoptar la forma de Real Decreto, los Reales Decretos del Presidente corresponden a lo atribuido a este, y las Órdenes son la forma de las decisiones de los Ministros."
  citation: "art. 24.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "formas de las decisiones del Gobierno"
# anchor: boe-a-1997-25336-art-24
- id: m02-l01-q0101
  prompt:
    es: "Conforme al artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las disposiciones y resoluciones de los Ministros revisten la forma de:"
  options:
  - id: a
    text:
      es: "Reales Decretos acordados en Consejo de Ministros."
  - id: b
    text:
      es: "Acuerdos del Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "Órdenes Ministeriales."
  - id: d
    text:
      es: "Reales Decretos del Presidente del Gobierno."
  explanation:
    es: "Las disposiciones y resoluciones de los Ministros se dictan como Órdenes Ministeriales (art. 24.1.f). Los Reales Decretos acordados en Consejo de Ministros y los Acuerdos del Consejo son decisiones del órgano colegiado, y los Reales Decretos del Presidente son los que este tiene atribuidos."
  citation: "art. 24.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "formas de las decisiones del Gobierno"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0103
  prompt:
    es: "Según el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿a través de qué medio se sustancia la consulta pública previa a la elaboración del texto de una norma con rango de ley o de un reglamento?"
  options:
  - id: a
    text:
      es: "A través del Boletín Oficial del Estado."
  - id: b
    text:
      es: "A través de la sede electrónica de la Presidencia del Gobierno."
  - id: c
    text:
      es: "A través del portal web del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "A través del portal web del departamento competente."
  explanation:
    es: "La consulta pública previa del artículo 26.2 se sustancia a través del portal web del departamento competente. No se hace en el Boletín Oficial del Estado, en la sede electrónica de la Presidencia ni en el portal del Consejo de Estado, que no son los medios previstos."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "consulta pública"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0105
  prompt:
    es: "De acuerdo con el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, podrá prescindirse del trámite de consulta pública previa cuando concurran razones:"
  options:
  - id: a
    correct: true
    text:
      es: "Graves de interés público que lo justifiquen."
  - id: b
    text:
      es: "Menores de interés público que lo justifiquen."
  - id: c
    text:
      es: "Presupuestarias que lo justifiquen, a juicio del Ministerio de Hacienda."
  - id: d
    text:
      es: "De urgencia declaradas por el Consejo de Estado."
  explanation:
    es: "Entre las circunstancias que permiten prescindir de la consulta pública, el artículo 26.2.b) recoge las razones graves de interés público que lo justifiquen. Unas razones menores no bastan, el texto no habla de razones presupuestarias valoradas por un Ministerio, y la urgencia que permite prescindir de la consulta es la tramitación urgente que acuerde el Gobierno (letra f), no una declaración del Consejo de Estado."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "consulta pública"
# anchor: boe-a-1997-25336-art-26
- id: m02-l01-q0106
  prompt:
    es: "¿En cuál de las siguientes circunstancias puede prescindirse del trámite de consulta pública previa, según el artículo 26.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Cuando la propuesta imponga obligaciones relevantes a los destinatarios, pero de forma temporal."
  - id: b
    correct: true
    text:
      es: "Cuando la propuesta no imponga obligaciones relevantes a los destinatarios."
  - id: c
    text:
      es: "Cuando la norma tenga un impacto significativo en la actividad económica, pero sea de carácter técnico."
  - id: d
    text:
      es: "Cuando la propuesta sea un anteproyecto de ley orgánica."
  explanation:
    es: "El artículo 26.2.d) permite prescindir de la consulta cuando la propuesta no imponga obligaciones relevantes a los destinatarios. Imponerlas, aunque sea de forma temporal, no basta, igual que un impacto significativo en la actividad económica, que sería lo contrario de la letra c). La naturaleza orgánica del anteproyecto no figura entre las circunstancias."
  citation: "art. 26.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "consulta pública"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0110
  prompt:
    es: "Según el artículo 128.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el ejercicio de la potestad reglamentaria corresponde también a los órganos de gobierno locales, de acuerdo con lo previsto en:"
  options:
  - id: a
    text:
      es: "La Constitución, los Estatutos de Autonomía y la legislación sectorial de cada Comunidad Autónoma."
  - id: b
    text:
      es: "La Constitución, la Ley 7/1985, de 2 de abril, y las ordenanzas fiscales de cada entidad local."
  - id: c
    correct: true
    text:
      es: "La Constitución, los Estatutos de Autonomía y la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local."
  - id: d
    text:
      es: "Los Estatutos de Autonomía y los reglamentos aprobados por el Gobierno de la Nación."
  explanation:
    es: "Los órganos de gobierno locales ejercen la potestad reglamentaria de acuerdo con la Constitución, los Estatutos de Autonomía y la Ley 7/1985, reguladora de las Bases del Régimen Local (art. 128.1). La legislación sectorial autonómica, las ordenanzas fiscales y los reglamentos del Gobierno no son el marco que fija el precepto."
  citation: "art. 128.1 LPAC"
  difficulty: 2
  tags:
  - "potestad reglamentaria"
# anchor: boe-a-2015-10565-art-47
- id: m02-l01-q0112
  prompt:
    es: "Una Orden Ministerial establece una regulación que contradice lo dispuesto en un Real Decreto del Gobierno sobre la misma materia. De acuerdo con el artículo 47.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué consecuencia tiene esa contradicción para la Orden?"
  options:
  - id: a
    text:
      es: "Es anulable, y se mantiene en vigor mientras no se anule."
  - id: b
    text:
      es: "Es válida, porque es posterior y más específica que el Real Decreto."
  - id: c
    text:
      es: "Es válida, siempre que se haya publicado en el diario oficial correspondiente."
  - id: d
    correct: true
    text:
      es: "Es nula de pleno derecho, por vulnerar una disposición administrativa de rango superior."
  explanation:
    es: "El artículo 47.2 declara nulas de pleno derecho las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior, y el Real Decreto tiene rango superior a la Orden Ministerial (art. 24.2 de la Ley del Gobierno). No es una anulabilidad, la posterioridad o la especialidad no la salvan y la publicación es requisito de eficacia, no un remedio de la contradicción."
  citation: "art. 47.2 LPAC"
  difficulty: 2
  tags:
  - "nulidad de pleno derecho"
  - "jerarquía normativa"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0087
  prompt:
    es: "Conforme al artículo 1.3 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, la costumbre solo regirá:"
  options:
  - id: a
    text:
      es: "En defecto de ley aplicable, aunque sea contraria a la moral o al orden público, siempre que resulte probada."
  - id: b
    correct: true
    text:
      es: "En defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público y que resulte probada."
  - id: c
    text:
      es: "En defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público, sin necesidad de prueba."
  - id: d
    text:
      es: "En defecto de principios generales del derecho, siempre que no sea contraria a la moral o al orden público y que resulte probada."
  explanation:
    es: "La costumbre rige, según el artículo 1.3, en defecto de ley aplicable, con tres condiciones: que no sea contraria a la moral ni al orden público y que resulte probada. Admitir una costumbre contraria a la moral o prescindir de la prueba suprime una de ellas, y los principios generales del derecho se aplican en defecto de ley o costumbre (art. 1.4), no antes que ella."
  citation: "art. 1.3 Código Civil"
  difficulty: 3
  tags:
  - "costumbre"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0089
  prompt:
    es: "Según el artículo 1.4 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, los principios generales del derecho se aplicarán:"
  options:
  - id: a
    correct: true
    text:
      es: "En defecto de ley o costumbre, sin perjuicio de su carácter informador del ordenamiento jurídico."
  - id: b
    text:
      es: "En defecto de ley, aunque exista costumbre aplicable, sin perjuicio de su carácter informador del ordenamiento jurídico."
  - id: c
    text:
      es: "En defecto de ley o costumbre, y sin carácter informador del ordenamiento jurídico."
  - id: d
    text:
      es: "Con preferencia sobre la ley y la costumbre, por su carácter informador del ordenamiento jurídico."
  explanation:
    es: "Los principios generales del derecho se aplican en defecto de ley o costumbre, y además informan el ordenamiento jurídico (art. 1.4). No se aplican aunque haya costumbre, ni carecen de esa función informadora, ni tienen preferencia sobre la ley."
  citation: "art. 1.4 Código Civil"
  difficulty: 1
  tags:
  - "principios generales del derecho"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0090
  prompt:
    es: "Según el artículo 1.5 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, ¿en qué debe publicarse íntegramente un tratado internacional para que sus normas sean de aplicación directa en España?"
  options:
  - id: a
    text:
      es: "El «Diario Oficial de la Unión Europea»."
  - id: b
    text:
      es: "El «Boletín Oficial de las Cortes Generales»."
  - id: c
    text:
      es: "El Registro de Tratados del Ministerio de Asuntos Exteriores."
  - id: d
    correct: true
    text:
      es: "El «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 1.5 exige la publicación íntegra del tratado en el «Boletín Oficial del Estado» para que sus normas sean de aplicación directa. El «Diario Oficial de la Unión Europea» publica el Derecho de la Unión, el boletín de las Cortes recoge su actividad parlamentaria, y la inscripción en un registro ministerial no sustituye a la publicación."
  citation: "art. 1.5 Código Civil"
  difficulty: 2
  tags:
  - "tratados internacionales"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0092
  prompt:
    es: "Conforme al artículo 1.6 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, ¿quién establece, de modo reiterado, la doctrina con la que la jurisprudencia complementa el ordenamiento jurídico?"
  options:
  - id: a
    text:
      es: "El Tribunal Constitucional al interpretar y aplicar la ley, la costumbre y los principios generales del derecho."
  - id: b
    text:
      es: "El Tribunal Supremo al interpretar y aplicar la ley, la costumbre y los tratados internacionales."
  - id: c
    text:
      es: "Los Tribunales Superiores de Justicia al interpretar y aplicar la ley, la costumbre y los principios generales del derecho."
  - id: d
    correct: true
    text:
      es: "El Tribunal Supremo al interpretar y aplicar la ley, la costumbre y los principios generales del derecho."
  explanation:
    es: "La jurisprudencia del artículo 1.6 es la doctrina reiterada del Tribunal Supremo sobre la ley, la costumbre y los principios generales del derecho. No es la del Tribunal Constitucional ni la de los Tribunales Superiores de Justicia, y el objeto de interpretación no incluye los tratados internacionales."
  citation: "art. 1.6 Código Civil"
  difficulty: 2
  tags:
  - "jurisprudencia"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0093
  prompt:
    es: "Señale la respuesta CORRECTA sobre la jurisprudencia, de acuerdo con el artículo 1.6 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil:"
  options:
  - id: a
    text:
      es: "Es una de las fuentes del ordenamiento jurídico, junto con la ley y la costumbre."
  - id: b
    text:
      es: "Sustituye a la ley cuando esta no es aplicable, igual que la costumbre."
  - id: c
    correct: true
    text:
      es: "Complementa el ordenamiento jurídico, pero no figura entre las fuentes que enumera el artículo 1.1."
  - id: d
    text:
      es: "Se aplica con carácter informador, igual que los principios generales del derecho."
  explanation:
    es: "El artículo 1.6 asigna a la jurisprudencia la función de complementar el ordenamiento, y el artículo 1.1 enumera como fuentes la ley, la costumbre y los principios generales del derecho, sin incluirla. No sustituye a la ley en defecto de esta, que es el papel de la costumbre (art. 1.3), ni tiene el carácter informador que el artículo 1.4 atribuye a los principios generales."
  citation: "art. 1.6 Código Civil"
  difficulty: 3
  tags:
  - "jurisprudencia"
  - "fuentes"
