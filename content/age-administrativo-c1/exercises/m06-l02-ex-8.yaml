# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l02-q324
  prompt:
    es: "Señale la afirmación correcta sobre los resultados que Windows Search puede dar en Windows 11 al buscar desde la barra de tareas:"
  options:
  - id: a
    text:
      es: "Solo pueden venir de los archivos y aplicaciones del propio dispositivo"
  - id: b
    text:
      es: "Las búsquedas en la web las resuelve un servicio de terceros que no pertenece a Microsoft"
  - id: c
    correct: true
    text:
      es: "Pueden venir del dispositivo, de las cuentas Microsoft conectadas y de la web con Bing"
  - id: d
    text:
      es: "Las cuentas profesionales o educativas se excluyen y solo cuenta la cuenta personal"
  explanation:
    es: "La página dice que Windows Search permite buscar en el dispositivo, en la nube y en la web, con resultados de elementos del dispositivo, de la cuenta personal de Microsoft y de la cuenta profesional o educativa, y que las búsquedas web usan la tecnología de Bing. Las otras tres afirmaciones recortan ese alcance o cambian el proveedor."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Windows Search»"
