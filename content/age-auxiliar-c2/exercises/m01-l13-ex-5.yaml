# anchor: boe-a-2015-11719-art-98
- id: m01-l13-q331
  prompt:
    es: "Según el artículo 98.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la suspensión provisional acordada durante la tramitación de un procedimiento judicial se mantiene por el tiempo a que se extienda:"
  options:
  - id: a
    correct: true
    text:
      es: "la prisión provisional u otras medidas decretadas por el juez que impidan desempeñar el puesto."
  - id: b
    text:
      es: "la instrucción completa de la causa penal, sin que pueda exceder en ningún caso de seis meses."
  - id: c
    text:
      es: "el procedimiento disciplinario que se incoe contra el funcionario por esos mismos hechos."
  - id: d
    text:
      es: "el plazo de seis meses, prorrogable una sola vez por decisión motivada del juez."
  explanation:
    es: "El artículo 98.3 dice que, durante un procedimiento judicial, la suspensión provisional «se mantendrá por el tiempo a que se extienda la prisión provisional u otras medidas decretadas por el juez que determinen la imposibilidad de desempeñar el puesto de trabajo». El tope de seis meses es el de la suspensión provisional en el expediente disciplinario, no el de la judicial. Tampoco depende de la instrucción de la causa ni de un procedimiento disciplinario por los mismos hechos."
  citation: "art. 98.3 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-98
- id: m01-l13-q332
  prompt:
    es: "Conforme al artículo 98.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, si la suspensión provisional acordada durante un procedimiento judicial excede de seis meses:"
  options:
  - id: a
    text:
      es: "supone la pérdida del puesto de trabajo."
  - id: b
    text:
      es: "se eleva a suspensión firme por el tiempo restante."
  - id: c
    correct: true
    text:
      es: "no supone pérdida del puesto de trabajo."
  - id: d
    text:
      es: "supone el pase a la excedencia voluntaria por interés particular."
  explanation:
    es: "El artículo 98.3 dice que, en la suspensión provisional por procedimiento judicial, si excede de seis meses «no supondrá pérdida del puesto de trabajo». La pérdida del puesto a los seis meses es la regla de la suspensión firme del artículo 90.1, no la de este caso. El artículo no eleva la provisional a firme por el paso del tiempo, ni la convierte en excedencia voluntaria."
  citation: "art. 98.3 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-art-2
- id: m01-l13-q008
  prompt:
    es: "Según el artículo 2.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, este se aplica al personal funcionario y, en lo que proceda, al personal laboral al servicio de, entre otros:"
  options:
  - id: a
    text:
      es: "Las Cortes Generales y las asambleas legislativas de las comunidades autónomas."
  - id: b
    text:
      es: "Los órganos constitucionales del Estado y los órganos estatutarios de las comunidades autónomas."
  - id: c
    correct: true
    text:
      es: "Los organismos públicos, agencias y entidades de derecho público vinculados o dependientes de las Administraciones."
  - id: d
    text:
      es: "Las sociedades mercantiles estatales y las fundaciones del sector público."
  explanation:
    es: "El artículo 2.1.d) incluye a «los organismos públicos, agencias y demás entidades de derecho público con personalidad jurídica propia, vinculadas o dependientes de cualquiera de las Administraciones Públicas». El personal de las Cortes Generales, de las asambleas legislativas y de los órganos constitucionales y estatutarios no está en esa lista: el Estatuto sólo se le aplica cuando lo disponga su legislación específica (art. 4). Las sociedades mercantiles y las fundaciones no son Administraciones Públicas de la lista del artículo 2.1."
  citation: "art. 2.1 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11719-art-7
- id: m01-l13-q011
  prompt:
    es: "En materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral de las Administraciones públicas:"
  options:
  - id: a
    text:
      es: "Se rige por el Estatuto de los Trabajadores, y el Estatuto Básico sólo se le aplica con carácter supletorio."
  - id: b
    text:
      es: "Se rige por el convenio colectivo aplicable, que puede apartarse de lo previsto en ambos Estatutos."
  - id: c
    correct: true
    text:
      es: "Se rige por el Estatuto Básico del Empleado Público, sin que se le apliquen las suspensiones del contrato del Estatuto de los Trabajadores."
  - id: d
    text:
      es: "Puede optar entre el régimen del Estatuto Básico y la suspensión del contrato del Estatuto de los Trabajadores."
  explanation:
    es: "El artículo 7 del texto refundido del Estatuto Básico del Empleado Público dice que en esas materias el personal laboral «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del Estatuto de los Trabajadores sobre las suspensiones de los contratos por los mismos supuestos. No se rige por el Estatuto de los Trabajadores, ni por el convenio colectivo en lugar del Estatuto. Tampoco hay opción: el artículo excluye la suspensión del contrato."
  citation: "art. 7 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-11719-dd-unica
- id: m01-l13-q013
  prompt:
    es: "¿Cuál de los siguientes preceptos de la Ley 30/1984, de 2 de agosto, figura en la lista de la disposición derogatoria única b) del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El que establece la dependencia orgánica de todo el personal al servicio de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "El que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado."
  - id: c
    text:
      es: "El que atribuye al Gobierno la dirección de la política de personal y la potestad reglamentaria."
  - id: d
    text:
      es: "El que crea el Registro Central en el que se inscribe a todo el personal de la Administración del Estado."
  explanation:
    es: "La lista de la disposición derogatoria única b) incluye el artículo 20.2 de la Ley 30/1984, que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado. Quedan fuera de la lista los artículos 2 (dependencia orgánica), 3.1 (el Gobierno dirige la política de personal y ejerce la potestad reglamentaria) y 13.1 (Registro Central de Personal)."
  citation: "disposición derogatoria única b) TREBEP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1995-8730-art-1
- id: m01-l13-q019
  prompt:
    es: "Según el artículo 1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, aprobado por el Real Decreto 365/1995, de 10 de marzo, este se aplica a:"
  options:
  - id: a
    correct: true
    text:
      es: "Los funcionarios de la Administración general del Estado y sus Organismos autónomos comprendidos en la Ley 30/1984."
  - id: b
    text:
      es: "Todo el personal, funcionario y laboral, de la Administración general del Estado y sus Organismos autónomos."
  - id: c
    text:
      es: "Los funcionarios de todas las Administraciones Públicas, con carácter básico y de aplicación directa."
  - id: d
    text:
      es: "Los funcionarios de la Administración general del Estado, con exclusión de los de sus Organismos autónomos."
  explanation:
    es: "El artículo 1 aplica el Reglamento «a los funcionarios de la Administración general del Estado y sus Organismos autónomos comprendidos en el ámbito de aplicación de la Ley 30/1984». No incluye al personal laboral. No es una norma básica para todas las Administraciones. Y no excluye a los funcionarios de los Organismos autónomos: los nombra."
  citation: "art. 1 RD 365/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-1
- id: m01-l13-q020
  prompt:
    es: "Según su artículo 1, el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, aprobado por el Real Decreto 33/1986, de 10 de enero, se aplica:"
  options:
  - id: a
    text:
      es: "A todo el personal, funcionario y laboral, comprendido en el artículo 1.1 de la Ley 30/1984."
  - id: b
    correct: true
    text:
      es: "Al personal funcionario comprendido en el artículo 1.1 de la Ley 30/1984, de 2 de agosto."
  - id: c
    text:
      es: "Al personal funcionario de todas las Administraciones Públicas, con carácter básico."
  - id: d
    text:
      es: "Al personal funcionario y eventual de la Administración del Estado y de las entidades locales."
  explanation:
    es: "El artículo 1 dice que el Reglamento «será de aplicación al personal funcionario comprendido en el artículo 1, 1, de la Ley 30/1984». No incluye al personal laboral. No es una norma básica para todas las Administraciones: para los funcionarios no incluidos es sólo supletorio (art. 3). Y no se extiende a las entidades locales."
  citation: "art. 1 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-1
- id: m01-l13-q042
  prompt:
    es: "Según el artículo 1.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, de 10 de marzo, el Reglamento se aplica a los procedimientos de ingreso del personal:"
  options:
  - id: a
    correct: true
    text:
      es: "De la Administración General del Estado y sus Organismos autónomos"
  - id: b
    text:
      es: "De la Administración General del Estado, excluidos sus Organismos autónomos"
  - id: c
    text:
      es: "De todas las Administraciones Públicas, con carácter básico"
  - id: d
    text:
      es: "De las comunidades autónomas y de las entidades locales"
  explanation:
    es: "El artículo 1.1 aplica el Reglamento «a los procedimientos de ingreso del personal de la Administración General del Estado y sus Organismos autónomos». No tiene carácter básico para todas las Administraciones ni se dirige a las comunidades autónomas y entidades locales. La opción que excluye a los Organismos autónomos contradice el texto, que los incluye expresamente."
  citation: "art. 1.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-105
- id: m01-l13-q043
  prompt:
    es: "Según el artículo 105.5 del Real Decreto-ley 6/2023, de 19 de diciembre, ¿qué se entiende por Administración del Estado a efectos de lo dispuesto en ese texto?"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración General del Estado y sus organismos y entidades vinculados o dependientes"
  - id: b
    text:
      es: "Todas las Administraciones Públicas incluidas en el ámbito del Estatuto Básico"
  - id: c
    text:
      es: "Solo la Administración General del Estado, sin sus organismos públicos"
  - id: d
    text:
      es: "La Administración General del Estado y las Administraciones de las comunidades autónomas"
  explanation:
    es: "El artículo 105.5 entiende por Administración del Estado «la Administración General del Estado, sus organismos y entidades vinculados o dependientes» y las demás entidades de ámbito estatal de su ámbito de aplicación. La opción que deja fuera a los organismos contradice ese texto. Las comunidades autónomas y el conjunto de Administraciones del Estatuto Básico no son Administración del Estado."
  citation: "art. 105.5 RDL 6/2023"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m01-l13-q044
  prompt:
    es: "Según el apartado 2 de la disposición final cuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo:"
  options:
  - id: a
    text:
      es: "Quedan derogadas todas las normas anteriores sobre ordenación, planificación y gestión de recursos humanos"
  - id: b
    text:
      es: "Siguen en vigor las normas vigentes sobre ordenación, planificación y gestión de recursos humanos, aunque se opongan al Estatuto"
  - id: c
    text:
      es: "Cada Administración aplica las normas estatales sobre gestión de recursos humanos, aunque tenga normas propias"
  - id: d
    correct: true
    text:
      es: "Siguen en vigor las normas vigentes sobre ordenación, planificación y gestión de recursos humanos que no se opongan al Estatuto"
  explanation:
    es: "La disposición final cuarta.2 mantiene en vigor «en cada Administración Pública las normas vigentes sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan a lo establecido en este Estatuto». No las deroga todas. Tampoco las mantiene cuando se oponen al Estatuto. Y habla de las normas vigentes en cada Administración, no de imponer las estatales."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-70
- id: m01-l13-q046
  prompt:
    es: "Según el artículo 70.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué obligación comporta la Oferta de empleo público?"
  options:
  - id: a
    correct: true
    text:
      es: "Convocar los procesos selectivos para las plazas comprometidas y hasta un diez por cien adicional"
  - id: b
    text:
      es: "Convocar los procesos selectivos solo para las plazas comprometidas, sin ningún margen adicional"
  - id: c
    text:
      es: "Convocar los procesos selectivos para las plazas comprometidas y hasta un veinte por cien adicional"
  - id: d
    text:
      es: "Nombrar funcionarios en todas las plazas comprometidas dentro del mismo año natural"
  explanation:
    es: "La Oferta comporta «la obligación de convocar los correspondientes procesos selectivos para las plazas comprometidas y hasta un diez por cien adicional» (artículo 70.1). La opción sin margen adicional y la del veinte por cien alteran esa cifra. La obligación es convocar, no nombrar funcionarios en el mismo año: el artículo da a la ejecución de la oferta un plazo de tres años."
  citation: "art. 70.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-2015-11719-art-70
- id: m01-l13-q047
  prompt:
    es: "Conforme al artículo 70.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la ejecución de la oferta de empleo público debe desarrollarse dentro de un plazo de tres años que:"
  options:
  - id: a
    correct: true
    text:
      es: "No admite prórroga en ningún caso"
  - id: b
    text:
      es: "Puede ampliarlo el órgano de Gobierno que aprobó la oferta"
  - id: c
    text:
      es: "Puede prorrogarse un año más por causa justificada"
  - id: d
    text:
      es: "Se suspende mientras haya recursos contra las convocatorias"
  explanation:
    es: "El artículo 70.1 dice que «en todo caso, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años». Un plazo improrrogable no se prorroga por causa justificada ni lo amplía el órgano que aprobó la oferta. El artículo tampoco prevé que se suspenda por los recursos contra las convocatorias."
  citation: "art. 70.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2023-25758-art-108
- id: m01-l13-q049
  prompt:
    es: "Según el artículo 108.3 del Real Decreto-ley 6/2023, de 19 de diciembre, la oferta de empleo público incluirá para promoción interna un porcentaje no inferior al treinta por ciento:"
  options:
  - id: a
    text:
      es: "De las vacantes de cada cuerpo o escala que se convoque"
  - id: b
    correct: true
    text:
      es: "De las plazas de acceso libre"
  - id: c
    text:
      es: "Del total de plazas de la oferta, incluidas las de promoción"
  - id: d
    text:
      es: "De las plazas reservadas a personas con discapacidad"
  explanation:
    es: "El artículo 108.3 fija el porcentaje sobre «las plazas de acceso libre». No se calcula sobre el total de la oferta ni sobre las vacantes de cada cuerpo o escala. Las plazas reservadas a personas con discapacidad son otra reserva, la del artículo 108.4."
  citation: "art. 108.3 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-art-108
- id: m01-l13-q050
  prompt:
    es: "La oferta de empleo público de la Administración del Estado incluye un porcentaje no inferior al treinta por ciento de las plazas de acceso libre:"
  options:
  - id: a
    text:
      es: "Para la estabilización del personal interino"
  - id: b
    text:
      es: "Para la selección de personal laboral fijo"
  - id: c
    correct: true
    text:
      es: "Para el turno de promoción interna"
  - id: d
    text:
      es: "Para el turno de personas con discapacidad"
  explanation:
    es: "El artículo 108.3 del Real Decreto-ley 6/2023 destina ese porcentaje «para promoción interna». La reserva por discapacidad es otra, del diez por ciento de las plazas convocadas (artículo 108.4). Ninguna norma destina ese treinta por ciento a estabilizar interinos ni a seleccionar personal laboral fijo."
  citation: "art. 108.3 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-1984-17387-art-18
- id: m01-l13-q051
  prompt:
    es: "Según el artículo 18.6 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿quién aprueba la Oferta de Empleo Público, a propuesta del que el artículo llama “Ministerio para las Administraciones Públicas”?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno"
  - id: b
    text:
      es: "La Comisión Superior de Personal"
  - id: c
    text:
      es: "Las Cortes Generales"
  - id: d
    text:
      es: "La Dirección General de la Función Pública"
  explanation:
    es: "El artículo 18.6 dice que «la Oferta de Empleo Público será aprobada por el Gobierno a propuesta del Ministerio para las Administraciones Públicas» (hoy, el Ministerio para la Transformación Digital y de la Función Pública). Las Cortes Generales no la aprueban. La Comisión Superior de Personal y la Dirección General de la Función Pública son órganos de nivel inferior al Gobierno y el artículo no les da esa aprobación."
  citation: "art. 18.6 Ley 30/1984"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2023-23537-art-22
- id: m01-l13-q052
  prompt:
    es: "Con la estructura ministerial vigente, ¿a qué ministerio corresponde la propuesta y ejecución de la política del Gobierno en materia de función pública?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Ministerio para la Transformación Digital y de la Función Pública"
  - id: b
    text:
      es: "Al Ministerio de Política Territorial y Memoria Democrática"
  - id: c
    text:
      es: "Al Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  - id: d
    text:
      es: "Al Ministerio de Hacienda"
  explanation:
    es: "El artículo 22.2 del Real Decreto 829/2023, de 20 de noviembre, atribuye al Ministerio para la Transformación Digital y de la Función Pública «la propuesta y ejecución de la política del Gobierno en materia de administración pública, función pública, y gobernanza pública». El Ministerio de Hacienda tiene la hacienda pública, los presupuestos y los gastos (artículo 5). El de la Presidencia, Justicia y Relaciones con las Cortes tiene los asuntos de relevancia constitucional y el programa legislativo (artículo 3). El de Política Territorial y Memoria Democrática tiene la política territorial y la memoria democrática (artículo 12)."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-9
- id: m01-l13-q054
  prompt:
    es: "Según el artículo 9 del Real Decreto 364/1995, de 10 de marzo, aprobada la oferta de empleo público, ¿quién convoca los procedimientos selectivos de acceso a un Cuerpo o Escala de funcionarios?"
  options:
  - id: a
    text:
      es: "La Comisión Permanente de Selección del Cuerpo o Escala"
  - id: b
    text:
      es: "La Dirección General de la Función Pública, para todos los Cuerpos"
  - id: c
    text:
      es: "El Gobierno, en el mismo real decreto que aprueba la oferta"
  - id: d
    correct: true
    text:
      es: "El Departamento al que figure adscrito el Cuerpo o Escala"
  explanation:
    es: "El artículo 9 dice que «los Departamentos a los que figuren adscritos los correspondientes Cuerpos y Escalas de funcionarios procederán a la convocatoria». La Dirección General de la Función Pública solo emite el informe favorable previo. El Gobierno aprueba la oferta, pero no convoca. La Comisión Permanente de Selección desarrolla y califica las pruebas (artículo 12.1), no las convoca."
  citation: "art. 9 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2023-25758-art-108
- id: m01-l13-q055
  prompt:
    es: "¿Cuándo deben publicarse las convocatorias de las plazas incluidas en la oferta de empleo público de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Dentro del primer trimestre del año siguiente al de la publicación de la oferta"
  - id: b
    text:
      es: "En el año natural siguiente al de la publicación de la oferta en el «Boletín Oficial del Estado»"
  - id: c
    correct: true
    text:
      es: "En el mismo año natural de la publicación de la oferta en el «Boletín Oficial del Estado»"
  - id: d
    text:
      es: "En cualquier momento dentro del plazo de tres años de ejecución de la oferta"
  explanation:
    es: "El artículo 108.2 del Real Decreto-ley 6/2023 dice que «las convocatorias deberán publicarse en el mismo año natural de la publicación en el “Boletín Oficial del Estado” de la oferta de empleo público». Las opciones del año siguiente y del primer trimestre del año siguiente contradicen esa regla. Los tres años son el plazo de ejecución de la oferta (artículo 70.1 del Estatuto Básico), no el de publicación de las convocatorias."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
