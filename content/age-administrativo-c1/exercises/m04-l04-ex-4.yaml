# anchor: boe-a-2015-11719-art-85
- id: m04-l04-q101
  prompt:
    es: "Señale cuál de las siguientes situaciones administrativas NO figura en la enumeración del artículo 85.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "La situación de servicio en otras Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "La situación de expectativa de destino."
  - id: c
    text:
      es: "La situación de suspensión de funciones."
  - id: d
    text:
      es: "La situación de servicios especiales."
  explanation:
    es: "El artículo 85.1 enumera cinco situaciones: servicio activo, servicios especiales, servicio en otras Administraciones Públicas, excedencia y suspensión de funciones. La expectativa de destino no está en esa lista: la regula el Real Decreto 365/1995 para los afectados por una reasignación de efectivos. El servicio en otras Administraciones Públicas, la suspensión de funciones y los servicios especiales sí figuran en el artículo 85.1."
  citation: "art. 85.1 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-art-85
- id: m04-l04-q102
  prompt:
    es: "De acuerdo con el artículo 85.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las leyes de Función Pública que se dicten en desarrollo del Estatuto:"
  options:
  - id: a
    text:
      es: "Podrán suprimir alguna de las situaciones administrativas que enumera el Estatuto."
  - id: b
    text:
      es: "Podrán regular otras situaciones administrativas, pero solo para el personal laboral."
  - id: c
    correct: true
    text:
      es: "Podrán regular otras situaciones administrativas de los funcionarios de carrera."
  - id: d
    text:
      es: "Deberán limitarse a desarrollar las cinco situaciones administrativas del Estatuto."
  explanation:
    es: "El artículo 85.2 dice que las leyes de Función Pública «podrán regular otras situaciones administrativas de los funcionarios de carrera». No les permite suprimir ninguna de las del apartado 1, y la habilitación se refiere a los funcionarios de carrera, no al personal laboral. Tampoco las limita a desarrollar las cinco existentes: el artículo les deja crear otras."
  citation: "art. 85.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l04-q103
  prompt:
    es: "Según el apartado 2 de la disposición final cuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública, las normas vigentes sobre gestión de recursos humanos:"
  options:
  - id: a
    text:
      es: "Quedarán derogadas desde el mismo día de la entrada en vigor del Estatuto."
  - id: b
    correct: true
    text:
      es: "Se mantendrán en vigor en tanto no se opongan a lo establecido en el Estatuto."
  - id: c
    text:
      es: "Se mantendrán en vigor aunque se opongan a lo establecido en el Estatuto."
  - id: d
    text:
      es: "Se mantendrán en vigor durante un plazo máximo de dos años desde el Estatuto."
  explanation:
    es: "La disposición final cuarta.2 dice que «se mantendrán en vigor en cada Administración Pública las normas vigentes sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan a lo establecido en este Estatuto». No quedan derogadas en bloque, no siguen en vigor si se oponen al Estatuto y la disposición no fija un plazo de dos años: rigen hasta que se dicten las leyes de Función Pública."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-dd-unica
- id: m04-l04-q104
  prompt:
    es: "De acuerdo con la letra b) de la disposición derogatoria única del texto refundido de la Ley del Estatuto Básico del Empleado Público, del artículo 29 de la Ley 30/1984 se exceptúa de la derogación:"
  options:
  - id: a
    text:
      es: "El último párrafo de sus apartados 2, 3 y 4."
  - id: b
    text:
      es: "El apartado 3 completo, sobre la excedencia voluntaria."
  - id: c
    text:
      es: "El primer párrafo de sus apartados 5, 6 y 7."
  - id: d
    correct: true
    text:
      es: "El último párrafo de sus apartados 5, 6 y 7."
  explanation:
    es: "La letra b) deroga de la Ley 30/1984 el artículo 29 «a excepción del último párrafo de sus apartados 5, 6 y 7». No salva los apartados 2, 3 y 4, ni el apartado 3 entero, ni el primer párrafo de los apartados 5, 6 y 7. La derogación tiene el alcance de la disposición final cuarta.2, y la nota del BOE mantiene el artículo vigente en tanto no se oponga al Estatuto."
  citation: "disposición derogatoria única TREBEP"
  difficulty: 3
  tags:
  - "excepción"
  - "estructura"
# anchor: boe-a-2015-11719-art-86
- id: m04-l04-q105
  prompt:
    es: "De acuerdo con el artículo 86.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se hallan en servicio activo quienes presten servicios en su condición de funcionarios públicos:"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquiera que sea la Administración u organismo en que estén destinados."
  - id: b
    text:
      es: "Solo si están destinados en la Administración a la que pertenece su cuerpo."
  - id: c
    text:
      es: "Solo si ocupan un puesto obtenido con carácter definitivo por concurso."
  - id: d
    text:
      es: "Cualquiera que sea su destino, aunque les corresponda quedar en otra situación."
  explanation:
    es: "El artículo 86.1 declara en servicio activo a quienes presten servicios como funcionarios «cualquiera que sea la Administración u organismo público o entidad en el que se encuentren destinados y no les corresponda quedar en otra situación». No exige que el destino sea en la Administración del propio cuerpo ni que el puesto se haya obtenido por concurso. La opción que admite el servicio activo aunque corresponda otra situación contradice la condición con que cierra el artículo."
  citation: "art. 86.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8730-art-3
- id: m04-l04-q106
  prompt:
    es: "Según el artículo 3 del Real Decreto 365/1995, de 10 de marzo, ¿en qué situación se halla el funcionario que desempeña un puesto adscrito, en la relación de puestos de trabajo, a funcionarios del ámbito de la Ley 30/1984?"
  options:
  - id: a
    text:
      es: "En la situación de servicios especiales."
  - id: b
    text:
      es: "En la situación de servicio en otras Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "En la situación de servicio activo."
  - id: d
    text:
      es: "En la situación de expectativa de destino."
  explanation:
    es: "El artículo 3.a) del Real Decreto 365/1995 sitúa en servicio activo a quienes «desempeñen un puesto que, conforme a la correspondiente relación de puestos de trabajo, esté adscrito a los funcionarios comprendidos en el ámbito de aplicación de la Ley 30/1984». Los servicios especiales responden a los supuestos de un cargo o una misión, el servicio en otras Administraciones Públicas exige destino en otra Administración y la expectativa de destino afecta a quien queda sin puesto tras una reasignación de efectivos."
  citation: "art. 3.a) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8730-art-3
- id: m04-l04-q107
  prompt:
    es: "Un funcionario de carrera de la Administración General del Estado pasa a desempeñar temporalmente otro puesto en comisión de servicios. ¿En qué situación administrativa se halla mientras dura la comisión?"
  options:
  - id: a
    text:
      es: "En la situación de servicios especiales."
  - id: b
    correct: true
    text:
      es: "En la situación de servicio activo."
  - id: c
    text:
      es: "En la situación de suspensión provisional de funciones."
  - id: d
    text:
      es: "En la situación de excedencia voluntaria por interés particular."
  explanation:
    es: "El artículo 3.c) del Real Decreto 365/1995 declara en servicio activo a los funcionarios «cuando se encuentren en comisión de servicios». La comisión no es un supuesto de servicios especiales, no priva de funciones como la suspensión y no supone dejar de prestar servicios, como la excedencia voluntaria por interés particular."
  citation: "art. 3.c) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8730-art-3
- id: m04-l04-q108
  prompt:
    es: "De acuerdo con el artículo 3.i) del Real Decreto 365/1995, de 10 de marzo, se hallan en servicio activo los funcionarios que cesen en un puesto por haber obtenido otro mediante procedimientos de provisión:"
  options:
  - id: a
    correct: true
    text:
      es: "Durante el plazo posesorio que les corresponda."
  - id: b
    text:
      es: "Solo hasta que se publique la resolución del procedimiento."
  - id: c
    text:
      es: "Solo si el nuevo puesto está en la misma localidad."
  - id: d
    text:
      es: "Solo si toman posesión el mismo día del cese."
  explanation:
    es: "El artículo 3.i) declara en servicio activo a quienes «cesen en un puesto de trabajo por haber obtenido otro mediante procedimientos de provisión de puestos de trabajo, durante el plazo posesorio». La situación cubre todo el plazo posesorio: no termina con la publicación de la resolución, no depende de que el nuevo puesto esté en la misma localidad y no exige tomar posesión el mismo día del cese."
  citation: "art. 3.i) RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q109
  prompt:
    es: "Según el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes misiones autorizadas en la OCDE determina el pase del funcionario a servicios especiales?"
  options:
  - id: a
    text:
      es: "Una misión del 1 de septiembre al 31 de diciembre de 2027."
  - id: b
    text:
      es: "Una misión del 1 de marzo al 31 de julio de 2027."
  - id: c
    text:
      es: "Una misión del 1 de enero al 30 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "Una misión del 1 de febrero al 30 de noviembre de 2027."
  explanation:
    es: "El artículo 87.1.b) exige una misión «por periodo determinado superior a seis meses» en organismos internacionales. Del 1 de febrero al 30 de noviembre de 2027 van diez meses. Del 1 de septiembre al 31 de diciembre van cuatro meses y del 1 de marzo al 31 de julio, cinco. Del 1 de enero al 30 de junio van seis meses exactos, que no son un periodo superior a seis meses."
  citation: "art. 87.1.b) TREBEP"
  difficulty: 3
  tags:
  - "requisito"
  - "cómputo"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q110
  prompt:
    es: "Según el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes funcionarios de carrera es declarado en situación de servicios especiales?"
  options:
  - id: a
    text:
      es: "El que pasa a desempeñar un puesto en comisión de servicios en otro ministerio."
  - id: b
    text:
      es: "El que obtiene por un procedimiento de provisión un puesto en otra Administración."
  - id: c
    text:
      es: "El que cesa en su puesto por obtener otro, durante el plazo posesorio."
  - id: d
    correct: true
    text:
      es: "El que es adscrito a los servicios del Tribunal Constitucional."
  explanation:
    es: "El artículo 87.1.d) declara en servicios especiales a quienes «sean adscritos a los servicios del Tribunal Constitucional o del Defensor del Pueblo». La comisión de servicios y el plazo posesorio tras obtener otro puesto son supuestos de servicio activo (artículo 3.c) e i) del Real Decreto 365/1995). Obtener por provisión un puesto en otra Administración lleva al servicio en otras Administraciones Públicas (artículo 88.1 TREBEP)."
  citation: "art. 87.1.d) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q111
  prompt:
    es: "De acuerdo con el artículo 87.1.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario que accede a la condición de miembro de una asamblea legislativa autonómica pasa a servicios especiales:"
  options:
  - id: a
    text:
      es: "En todo caso, perciba o no retribuciones por la realización de la función."
  - id: b
    text:
      es: "Solo si la asamblea le exige dedicación exclusiva durante todo el mandato."
  - id: c
    correct: true
    text:
      es: "Si percibe retribuciones periódicas por la realización de la función."
  - id: d
    text:
      es: "Solo si renuncia a percibir los trienios que tenga reconocidos."
  explanation:
    es: "El artículo 87.1.e) incluye a los miembros de las asambleas legislativas de las comunidades autónomas «si perciben retribuciones periódicas por la realización de la función». Sin esas retribuciones el supuesto no se da, así que no procede en todo caso. La dedicación exclusiva es la condición de los cargos electivos locales de la letra f), no de esta. Nada obliga a renunciar a los trienios: el artículo 87.2 los mantiene."
  citation: "art. 87.1.e) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q112
  prompt:
    es: "Un Diputado funcionario no es reelegido. Las Cortes se disuelven el lunes 1 de marzo de 2027 y las nuevas Cámaras se constituyen el martes 20 de abril de 2027. Según el artículo 87.1.e) del Estatuto Básico del Empleado Público, ¿hasta cuándo puede seguir en servicios especiales?"
  options:
  - id: a
    text:
      es: "Hasta el lunes 1 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el miércoles 1 de septiembre de 2027."
  - id: c
    text:
      es: "Hasta el miércoles 1 de marzo de 2028."
  - id: d
    correct: true
    text:
      es: "Hasta el martes 20 de abril de 2027."
  explanation:
    es: "El artículo 87.1.e) dice que quienes pierdan la condición de Diputado o Senador por disolución de las cámaras «podrán permanecer en la situación de servicios especiales hasta su nueva constitución». Las nuevas Cámaras se constituyen el martes 20 de abril de 2027, y esa es la fecha. El lunes 1 de marzo de 2027 es el día de la disolución, que el artículo no toma como límite. El miércoles 1 de septiembre de 2027 (seis meses) y el miércoles 1 de marzo de 2028 (un año) son plazos que el artículo no fija."
  citation: "art. 87.1.e) TREBEP"
  difficulty: 3
  tags:
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q113
  prompt:
    es: "Según el artículo 87.1.i) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué funciones deben estar expresamente calificadas en el puesto de personal eventual para que el funcionario designado pase a servicios especiales?"
  options:
  - id: a
    text:
      es: "Funciones directivas o de gestión de personal."
  - id: b
    correct: true
    text:
      es: "Funciones de confianza o de asesoramiento político."
  - id: c
    text:
      es: "Funciones de inspección o de control financiero."
  - id: d
    text:
      es: "Funciones de representación o de asistencia jurídica."
  explanation:
    es: "El artículo 87.1.i) se refiere a los designados personal eventual «por ocupar puestos de trabajo con funciones expresamente calificadas como de confianza o asesoramiento político», y que no opten por permanecer en servicio activo. Las funciones directivas, las de inspección o control financiero y las de representación o asistencia jurídica no son las que el artículo exige."
  citation: "art. 87.1.i) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q115
  prompt:
    es: "De acuerdo con el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes supuestos determina la declaración del funcionario de carrera en servicios especiales?"
  options:
  - id: a
    text:
      es: "Su adscripción en comisión de servicios a otro departamento ministerial."
  - id: b
    text:
      es: "La obtención por concurso de un puesto en otra Administración Pública."
  - id: c
    correct: true
    text:
      es: "Su designación como asesor de un grupo parlamentario de las Cortes Generales."
  - id: d
    text:
      es: "La autorización para una misión internacional de cuatro meses de duración."
  explanation:
    es: "El artículo 87.1.k) declara en servicios especiales a quienes «sean designados asesores de los grupos parlamentarios de las Cortes Generales». La comisión de servicios es servicio activo (artículo 3.c) del Real Decreto 365/1995). El concurso que da destino en otra Administración lleva al servicio en otras Administraciones Públicas (artículo 88.1 TREBEP). La misión internacional solo da lugar a servicios especiales si dura más de seis meses (artículo 87.1.b))."
  citation: "art. 87.1.k) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q116
  prompt:
    es: "Conforme al artículo 87.1.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, pasan a servicios especiales los nombrados para puestos o cargos en organismos públicos o entidades dependientes o vinculados a las Administraciones Públicas que:"
  options:
  - id: a
    text:
      es: "Estén asimilados en su rango administrativo a Subdirección General."
  - id: b
    text:
      es: "Tengan atribuidas funciones de control financiero o de auditoría."
  - id: c
    correct: true
    text:
      es: "Estén asimilados en su rango administrativo a altos cargos."
  - id: d
    text:
      es: "Tengan un presupuesto superior al de su departamento de adscripción."
  explanation:
    es: "El artículo 87.1.c) se refiere a puestos o cargos en organismos o entidades que, según establezca cada Administración, «estén asimilados en su rango administrativo a altos cargos». La asimilación a Subdirección General no es la que pide el artículo, que no atiende a las funciones de control ni al presupuesto del organismo."
  citation: "art. 87.1.c) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q117
  prompt:
    es: "Según el artículo 87.1.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, se declara en servicios especiales al funcionario de carrera que sea designado miembro:"
  options:
  - id: a
    text:
      es: "De un órgano de selección de un proceso selectivo de su Ministerio."
  - id: b
    correct: true
    text:
      es: "Del Gobierno o de los órganos de gobierno de las comunidades autónomas."
  - id: c
    text:
      es: "De una comisión de valoración de un concurso de provisión de puestos."
  - id: d
    text:
      es: "De un órgano colegiado de carácter consultivo de su propio departamento."
  explanation:
    es: "El artículo 87.1.a) incluye a quienes «sean designados miembros del Gobierno o de los órganos de gobierno de las comunidades autónomas y ciudades de Ceuta y Melilla». Formar parte de un órgano de selección, de una comisión de valoración o de un órgano consultivo del propio departamento no figura entre los supuestos del artículo 87.1: el funcionario sigue en servicio activo."
  citation: "art. 87.1.a) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q118
  prompt:
    es: "El funcionario de carrera de la Administración General del Estado que es designado para formar parte del Consejo General del Poder Judicial:"
  options:
  - id: a
    text:
      es: "Permanece en servicio activo en su cuerpo de origen."
  - id: b
    text:
      es: "Pasa a la situación de servicio en otras Administraciones Públicas."
  - id: c
    text:
      es: "Pasa a la situación de excedencia voluntaria por interés particular."
  - id: d
    correct: true
    text:
      es: "Es declarado en la situación de servicios especiales."
  explanation:
    es: "El artículo 87.1.g) TREBEP declara en servicios especiales a quienes «sean designados para formar parte del Consejo General del Poder Judicial». No sigue en servicio activo, porque le corresponde otra situación. El Consejo no es otra Administración a la que se acceda por transferencia o provisión, y la designación no es un supuesto de excedencia."
  citation: "art. 87.1.g) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q119
  prompt:
    es: "De acuerdo con el artículo 87.1.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario que desempeña un cargo electivo en una entidad local pasa a servicios especiales cuando el cargo es:"
  options:
  - id: a
    text:
      es: "Un cargo retribuido, aunque sea de dedicación parcial."
  - id: b
    correct: true
    text:
      es: "Un cargo retribuido y de dedicación exclusiva."
  - id: c
    text:
      es: "Un cargo de dedicación exclusiva, aunque no sea retribuido."
  - id: d
    text:
      es: "Un cargo de cualquier clase, desde la toma de posesión."
  explanation:
    es: "El artículo 87.1.f) exige que se desempeñen «cargos electivos retribuidos y de dedicación exclusiva» en las entidades locales. Hacen falta las dos condiciones: no basta la retribución con dedicación parcial ni la dedicación exclusiva sin retribución, y no vale cualquier cargo."
  citation: "art. 87.1.f) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q120
  prompt:
    es: "Según el artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué retribuciones perciben los funcionarios en situación de servicios especiales?"
  options:
  - id: a
    text:
      es: "Las de funcionario de carrera, más un complemento por el puesto o cargo que desempeñen."
  - id: b
    correct: true
    text:
      es: "Las del puesto o cargo que desempeñen, sin perjuicio de los trienios reconocidos."
  - id: c
    text:
      es: "Las del puesto o cargo que desempeñen, con pérdida de los trienios reconocidos."
  - id: d
    text:
      es: "Las de funcionario de carrera, sin derecho a percibir los trienios reconocidos."
  explanation:
    es: "El artículo 87.2 dice que «percibirán las retribuciones del puesto o cargo que desempeñen y no las que les correspondan como funcionarios de carrera, sin perjuicio del derecho a percibir los trienios que tengan reconocidos». No cobran las de funcionario de carrera, con o sin complemento, y no pierden los trienios."
  citation: "art. 87.2 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q121
  prompt:
    es: "Conforme al artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el tiempo de permanencia en servicios especiales se computa:"
  options:
  - id: a
    correct: true
    text:
      es: "A efectos de ascensos, trienios, promoción interna y derechos de Seguridad Social."
  - id: b
    text:
      es: "Solo a efectos de reconocimiento de trienios y de derechos de Seguridad Social."
  - id: c
    text:
      es: "A efectos de trienios y Seguridad Social, pero no de ascensos ni promoción interna."
  - id: d
    text:
      es: "Solo a efectos de derechos de Seguridad Social, sin reconocimiento de trienios."
  explanation:
    es: "El artículo 87.2 computa el tiempo «a efectos de ascensos, reconocimiento de trienios, promoción interna y derechos en el régimen de Seguridad Social». Las opciones que lo reducen a trienios y Seguridad Social, o solo a Seguridad Social, o que excluyen ascensos y promoción interna, dejan fuera efectos que el artículo incluye."
  citation: "art. 87.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q122
  prompt:
    es: "Según el artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el cómputo del tiempo en servicios especiales no es de aplicación a los funcionarios que:"
  options:
  - id: a
    correct: true
    text:
      es: "Ingresaron en las instituciones comunitarias europeas y ejercen el derecho de transferencia."
  - id: b
    text:
      es: "Fueron nombrados altos cargos de los órganos de gobierno de una comunidad autónoma."
  - id: c
    text:
      es: "Accedieron a la condición de Diputado o Senador de las Cortes Generales."
  - id: d
    text:
      es: "Fueron activados como reservistas voluntarios para servir en las Fuerzas Armadas."
  explanation:
    es: "El artículo 87.2 excluye del cómputo a quienes, «habiendo ingresado al servicio de las instituciones comunitarias europeas, o al de entidades y organismos asimilados, ejerciten el derecho de transferencia». Los altos cargos autonómicos, los Diputados y Senadores y los reservistas activados son supuestos de servicios especiales del artículo 87.1 a los que el cómputo sí se aplica."
  citation: "art. 87.2 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1995-8730-art-8
- id: m04-l04-q123
  prompt:
    es: "Una funcionaria toma posesión el miércoles 1 de septiembre de 2021 y pasa a servicios especiales el viernes 1 de septiembre de 2023. Según el Real Decreto 365/1995, de 10 de marzo, ¿cuándo cumple los cinco años de servicios exigidos para la excedencia por interés particular?"
  options:
  - id: a
    text:
      es: "Los cumple el lunes 1 de septiembre de 2025."
  - id: b
    correct: true
    text:
      es: "Los cumple el martes 1 de septiembre de 2026."
  - id: c
    text:
      es: "Los cumple el viernes 1 de septiembre de 2028."
  - id: d
    text:
      es: "No los cumple mientras siga en servicios especiales."
  explanation:
    es: "El artículo 8.2 del Real Decreto 365/1995 computa el tiempo en servicios especiales «a efectos del cómputo del período mínimo de servicios efectivos para solicitar el pase a la situación de excedencia voluntaria por interés particular». Cuentan los dos años de servicio activo y los de servicios especiales, sin corte: del miércoles 1 de septiembre de 2021 al martes 1 de septiembre de 2026 van cinco años. El lunes 1 de septiembre de 2025 da solo cuatro. El viernes 1 de septiembre de 2028 cuenta los cinco años desde el pase a servicios especiales y pierde los dos anteriores. Decir que no los cumple supone que ese tiempo no computa, lo contrario de lo que dice el artículo."
  citation: "art. 8.2 RD 365/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8730-art-8
- id: m04-l04-q124
  prompt:
    es: "¿Qué efecto del tiempo en servicios especiales recoge el artículo 8.2 del Real Decreto 365/1995, de 10 de marzo, y falta en la lista del artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El reconocimiento de los trienios del funcionario."
  - id: b
    text:
      es: "Los ascensos en la carrera del funcionario."
  - id: c
    text:
      es: "La promoción interna del funcionario de carrera a otro cuerpo."
  - id: d
    correct: true
    text:
      es: "La consolidación del grado personal del funcionario."
  explanation:
    es: "El artículo 8.2 del Real Decreto 365/1995 computa el tiempo «a efectos de ascensos, consolidación de grado personal, trienios y derechos pasivos» y del periodo mínimo para la excedencia por interés particular. El artículo 87.2 TREBEP lo computa a efectos de ascensos, trienios, promoción interna y Seguridad Social, sin mencionar el grado personal. Los trienios y los ascensos están en las dos listas. La promoción interna está en el TREBEP y no en el reglamento."
  citation: "art. 8.2 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-87
- id: m04-l04-q125
  prompt:
    es: "De acuerdo con el artículo 87.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, quienes se encuentren en servicios especiales tienen derecho, al menos, a reingresar al servicio activo:"
  options:
  - id: a
    text:
      es: "En el mismo puesto de trabajo que ocupaban antes de pasar a esa situación."
  - id: b
    text:
      es: "En cualquier localidad, con las retribuciones del último cargo desempeñado."
  - id: c
    correct: true
    text:
      es: "En la misma localidad, con las retribuciones de la carrera consolidada."
  - id: d
    text:
      es: "En la misma localidad, con las retribuciones del cargo que causó la situación."
  explanation:
    es: "El artículo 87.3 da derecho, al menos, «a reingresar al servicio activo en la misma localidad, en las condiciones y con las retribuciones correspondientes a la categoría, nivel o escalón de la carrera consolidados». No garantiza el mismo puesto, no permite cualquier localidad y las retribuciones son las de la carrera consolidada, no las del cargo que se desempeñó en servicios especiales."
  citation: "art. 87.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-7
- id: m04-l04-q126
  prompt:
    es: "Según el artículo 7.1 del Real Decreto 365/1995, de 10 de marzo, al funcionario en servicios especiales procedente del servicio activo cuyo puesto anterior era de libre designación se le adjudica, al reingresar:"
  options:
  - id: a
    correct: true
    text:
      es: "Con carácter provisional, un puesto de igual nivel y similares retribuciones en el mismo municipio."
  - id: b
    text:
      es: "Con carácter definitivo, un puesto de igual nivel en el mismo Ministerio y en el mismo municipio."
  - id: c
    text:
      es: "Con carácter definitivo, el mismo puesto de libre designación que ocupaba antes de esa situación."
  - id: d
    text:
      es: "Con carácter provisional, un puesto de nivel inferior en cualquier municipio."
  explanation:
    es: "El artículo 7.1.a) dice que, si el puesto anterior se obtuvo por libre designación, «se les adjudicará, con carácter provisional, en tanto no obtengan otro con carácter definitivo, un puesto de igual nivel y similares retribuciones en el mismo municipio». La adjudicación definitiva en el mismo Ministerio y municipio es la de la letra b), para los demás casos. No se devuelve el mismo puesto de libre designación, y el nivel no es inferior ni el municipio cualquiera."
  citation: "art. 7.1 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
