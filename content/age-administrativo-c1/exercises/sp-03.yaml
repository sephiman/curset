# anchor: boe-a-1995-8729-art-50
- id: q34
  lesson: m04-l05
  prompt:
    es: "¿Cuál es el nivel más bajo que puede tener el puesto que se atribuya con carácter provisional a Don Ramiro Peña Ortiz, si es removido de su puesto, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "Un puesto de nivel 22, el mismo de su grado personal."
  - id: b
    text:
      es: "Un puesto de nivel 21, un nivel por debajo de su grado personal."
  - id: c
    text:
      es: "Un puesto de nivel 19, tres niveles por debajo de su grado personal."
  - id: d
    correct: true
    text:
      es: "Un puesto de nivel 20, dos niveles por debajo de su grado personal."
  explanation:
    es: "El funcionario removido desempeña provisionalmente un puesto de su Cuerpo o Escala, en el mismo municipio, no inferior en más de dos niveles al de su grado personal. Con grado personal 22, el nivel más bajo permitido es el 20. El nivel 22 exigiría igualar el grado, y la norma permite bajar. El nivel 21 baja un solo nivel y es válido, pero no es el más bajo. El nivel 19 baja tres niveles y excede el límite."
  citation: "art. 50.5 RD 364/1995"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: q35
  lesson: m04-l03
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la compensación económica que corresponde a Doña Natalia Bermejo Sanz si cesa de forma efectiva el viernes, 4 de agosto de 2028, es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un total de 5.600 euros."
  - id: b
    text:
      es: "Un total de 4.800 euros."
  - id: c
    text:
      es: "Un total de 6.400 euros."
  - id: d
    text:
      es: "Un total de 8.400 euros."
  explanation:
    es: "A los tres años del nombramiento se produce el fin de la interinidad en una vacante sin convocatoria publicada, y seguir más allá incumple el plazo máximo de permanencia. La compensación es de veinte días de retribuciones fijas por año de servicio, con los períodos inferiores a un año prorrateados por meses. Doña Natalia sirve desde el martes, 4 de febrero de 2025, hasta el viernes, 4 de agosto de 2028: tres años y seis meses. El cálculo es 3 × 20 + 6/12 × 20 = 70 días, y a 80 euros por día suman 5.600 euros, por debajo del máximo de doce mensualidades. La cifra de 4.800 euros cuenta solo los tres años completos. La de 6.400 euros redondea a cuatro años. La de 8.400 euros aplica treinta días por año."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-1995-8730-art-16
- id: q36
  lesson: m04-l04
  prompt:
    es: "Según el Real Decreto 365/1995, de 10 de marzo, ¿de cuántos años puede ser como máximo el período de la excedencia voluntaria por interés particular que solicita Don Álvaro Casal Peña?"
  options:
  - id: a
    text:
      es: "De quince años, el máximo general de esta excedencia."
  - id: b
    correct: true
    text:
      es: "De once años, los que acredita de servicios efectivos."
  - id: c
    text:
      es: "De cinco años, el mínimo de servicios exigido para solicitarla."
  - id: d
    text:
      es: "De tres años, como en la excedencia por cuidado de familiares."
  explanation:
    es: "Cada período de esta excedencia dura al menos dos años continuados y como máximo los años de servicios que el funcionario acredite en las Administraciones Públicas, con tope de quince. Don Álvaro acredita once, por debajo del tope, y once es su máximo. Quince años es el máximo general y solo lo alcanza quien acredita quince o más. Cinco años son los servicios previos que exige solicitar la excedencia, no su duración. Tres años es la duración de la excedencia por cuidado de familiares."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2003-21614-art-56
- id: q37
  lesson: m05-l02
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿hasta qué importe puede autorizar por sí sola la Directora del INAP el suplemento de crédito que necesita el capítulo 2?"
  options:
  - id: a
    text:
      es: "Un importe máximo de 500.000 euros."
  - id: b
    text:
      es: "Un importe máximo de 680.000 euros."
  - id: c
    correct: true
    text:
      es: "Un importe máximo de 340.000 euros."
  - id: d
    text:
      es: "Un importe máximo de 1.000.000 euros."
  explanation:
    es: "Los Directores de los organismos autónomos autorizan suplementos de crédito hasta el 10 % del capítulo de su presupuesto inicial de gastos, siempre que no superen 500.000 euros. El capítulo 2 del INAP suma 3.400.000 euros, sin otras modificaciones, y el 10 % son 340.000 euros, menos de 500.000. La cifra de 500.000 euros es el tope en euros, que la Directora no alcanza porque el 10 % la limita antes. La de 680.000 euros es el 20 % del capítulo, que el Ministro de Hacienda no puede alcanzar. La de 1.000.000 euros es el otro límite del Ministro de Hacienda."
  citation: "art. 56.3.a LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2003-21614-art-53
- id: q38
  lesson: m05-l02
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿por qué importe puede el INAP generar crédito en 2027 con la aportación que el Estado ha comprometido con firmeza?"
  options:
  - id: a
    text:
      es: "Por un importe de 200.000 euros."
  - id: b
    text:
      es: "Por un importe de 50.000 euros."
  - id: c
    text:
      es: "Por ningún importe, hasta que el Estado efectúe el ingreso."
  - id: d
    correct: true
    text:
      es: "Por un importe de 150.000 euros."
  explanation:
    es: "En los organismos autónomos, la generación por aportaciones del Estado cabe cuando existe un compromiso firme de aportación, siempre que el ingreso se prevea realizar en el propio ejercicio. De los 200.000 euros comprometidos, 150.000 se ingresan en diciembre de 2027 y pueden generar crédito. Los 50.000 euros de febrero de 2028 se ingresan en otro ejercicio. La cifra de 200.000 euros cuenta todo el compromiso. La de 50.000 euros toma solo la parte del ejercicio siguiente. Esperar al ingreso efectivo es la regla general, y la norma exceptúa estas aportaciones."
  citation: "art. 53.3 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2003-21614-art-47
- id: q39
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la respuesta correcta sobre el gasto plurianual de las aulas del INAP que se imputa a 2028:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede comprometerse la renta íntegra, porque los límites porcentuales no se aplican a los arrendamientos de inmuebles."
  - id: b
    text:
      es: "Solo puede comprometerse el 70 % del crédito inicial de 2027, porque 2028 es el ejercicio inmediato siguiente."
  - id: c
    text:
      es: "Solo puede comprometerse el 60 % del crédito inicial de 2027, porque 2028 es el segundo ejercicio."
  - id: d
    text:
      es: "Solo puede comprometerse el 50 % del crédito inicial de 2027, porque 2028 es el tercer ejercicio."
  explanation:
    es: "Los límites del 70 % para el ejercicio inmediato siguiente y del 60 % para el segundo no se aplican a los compromisos derivados de los arrendamientos de inmuebles. El local de las aulas es un inmueble alquilado, y el INAP puede comprometer en 2028 la renta íntegra de 55.000 euros. El 70 %, que daría 42.000 euros, sería el límite de 2028 si la norma se aplicara. El 60 % corresponde al segundo ejercicio, 2029, y tampoco se aplica. El 50 % corresponde a los ejercicios tercero y cuarto, 2030 y 2031, y tampoco se aplica."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "cantidad"
# anchor: boe-a-1989-14441-art-2
- id: q40
  lesson: m05-l05
  prompt:
    es: "Según el Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, ¿cuánto puede aumentar como máximo el INAP la cuantía global de los anticipos que tiene establecidos?"
  options:
  - id: a
    text:
      es: "Un máximo de 238.000 euros adicionales."
  - id: b
    correct: true
    text:
      es: "Un máximo de 63.000 euros adicionales."
  - id: c
    text:
      es: "Un máximo de 165.000 euros adicionales."
  - id: d
    text:
      es: "Un máximo de 301.000 euros adicionales."
  explanation:
    es: "La cuantía global de los anticipos de caja fija de un organismo autónomo no puede exceder del 7 % de los créditos del capítulo de gastos corrientes en bienes y servicios del presupuesto vigente. El 7 % de 3.400.000 euros son 238.000 euros. Con 175.000 euros ya establecidos, quedan 63.000 euros. La cifra de 238.000 euros olvida los anticipos existentes. La de 165.000 euros parte del 10 %, tope del artículo 23 del programa 222A del Ministerio del Interior. La de 301.000 euros parte del 14 %, tope de la Agencia Española de Cooperación Internacional."
  citation: "art. 2.2 RD 725/1989"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
