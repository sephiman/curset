# anchor: boe-a-2017-12902-art-169
- id: m03-l04-q152
  prompt:
    es: "Según el artículo 169.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si en la licitación con negociación se limita el número de empresas invitadas, ¿cuál es el mínimo de candidatos invitados?"
  options:
  - id: a
    text:
      es: "El número mínimo de candidatos invitados será de cinco."
  - id: b
    text:
      es: "El número mínimo de candidatos invitados será de dos."
  - id: c
    text:
      es: "El número mínimo de candidatos invitados será de seis."
  - id: d
    correct: true
    text:
      es: "El número mínimo de candidatos invitados será de tres."
  explanation:
    es: "El artículo 169.2 dice que, si se limita el número de empresas invitadas a negociar, se asegurará «de que el número mínimo de candidatos invitados será de tres». Cinco es el mínimo del procedimiento restringido (artículo 162.2). Dos y seis no figuran en el artículo."
  citation: "art. 169.2 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-168
- id: m03-l04-q153
  prompt:
    es: "Según el artículo 168 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cabe el negociado sin publicidad si no se presentó ninguna oferta adecuada en un procedimiento abierto, siempre que:"
  options:
  - id: a
    correct: true
    text:
      es: "No se modifiquen sustancialmente las condiciones iniciales ni se incremente el presupuesto base de licitación."
  - id: b
    text:
      es: "El presupuesto base de licitación no se incremente en más de un 10 por ciento sobre el inicial."
  - id: c
    text:
      es: "Se modifiquen las condiciones iniciales para hacer el contrato más atractivo a los licitadores."
  - id: d
    text:
      es: "Se invite a negociar, como mínimo, a cinco empresarios con la solvencia acreditada en el expediente."
  explanation:
    es: "El artículo 168.a).1.º lo permite «siempre que las condiciones iniciales del contrato no se modifiquen sustancialmente, sin que en ningún caso se pueda incrementar el presupuesto base de licitación ni modificar el sistema de retribución». No se admite ningún incremento del presupuesto, ni del 10 por ciento. Las condiciones iniciales no pueden modificarse sustancialmente. Las cinco invitaciones son el mínimo del restringido, no un requisito de este supuesto."
  citation: "art. 168 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-168
- id: m03-l04-q154
  prompt:
    es: "¿En cuál de los siguientes casos permite la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público el negociado sin publicidad porque solo un empresario puede ejecutar la prestación?"
  options:
  - id: a
    text:
      es: "Cuando el objeto sea una obra de arte única integrante del Patrimonio Histórico español."
  - id: b
    correct: true
    text:
      es: "Cuando el objeto sea una obra de arte única no integrante del Patrimonio Histórico español."
  - id: c
    text:
      es: "Cuando el empresario haya ejecutado contratos similares para el órgano en los últimos años."
  - id: d
    text:
      es: "Cuando el empresario sea el único inscrito en el Registro Oficial de Licitadores en esa actividad."
  explanation:
    es: "El artículo 168.a).2.º admite que la prestación solo pueda encomendarse a un empresario determinado porque el contrato tenga por objeto «la creación o adquisición de una obra de arte única no integrante del Patrimonio Histórico español o actuación artística única», por falta de competencia por razones técnicas o por derechos exclusivos. La obra integrante del Patrimonio Histórico español queda fuera por el propio texto. Haber ejecutado contratos similares o ser el único inscrito en un registro no son causas del artículo."
  citation: "art. 168 LCSP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-168
- id: m03-l04-q155
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, un contrato de servicios de una Administración Pública declarado secreto o reservado puede adjudicarse mediante:"
  options:
  - id: a
    text:
      es: "La licitación con negociación, sin publicar anuncio."
  - id: b
    text:
      es: "El diálogo competitivo, sin publicar anuncio."
  - id: c
    correct: true
    text:
      es: "El procedimiento negociado sin publicidad."
  - id: d
    text:
      es: "Un contrato menor, sea cual sea su valor estimado."
  explanation:
    es: "El artículo 168.a).3.º permite el negociado sin publicidad «cuando el contrato haya sido declarado secreto o reservado». La licitación con negociación exige en todo caso anuncio de licitación (artículo 169.1). El diálogo competitivo también debe ir precedido de anuncio (artículo 172.3). El contrato menor depende del valor estimado (artículo 118.1), no del carácter secreto."
  citation: "art. 168 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2017-12902-art-168
- id: m03-l04-q156
  prompt:
    es: "De acuerdo con el artículo 168 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en obras, suministros y servicios cabe el negociado sin publicidad por una imperiosa urgencia que resulte de acontecimientos:"
  options:
  - id: a
    text:
      es: "Imprevisibles, aunque sean imputables al órgano de contratación, si no cabe la tramitación de emergencia."
  - id: b
    text:
      es: "Previsibles pero inevitables, cuando la tramitación ordinaria del expediente supere los seis meses."
  - id: c
    text:
      es: "Imprevisibles y no imputables al órgano de contratación, aunque pueda atenderse con la tramitación urgente."
  - id: d
    correct: true
    text:
      es: "Imprevisibles y no imputables al órgano de contratación, si no puede atenderse con la tramitación de urgencia."
  explanation:
    es: "El artículo 168.b).1.º exige «una imperiosa urgencia resultante de acontecimientos imprevisibles para el órgano de contratación y no imputables al mismo», que demande una pronta ejecución «que no pueda lograrse mediante la aplicación de la tramitación de urgencia regulada en el artículo 119». Los acontecimientos imputables al órgano quedan fuera, y la referencia es a la tramitación urgente, no a la de emergencia. Los acontecimientos previsibles no sirven, y el artículo no fija plazo de seis meses. Si la tramitación urgente basta, no cabe este supuesto."
  citation: "art. 168 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-168
- id: m03-l04-q157
  prompt:
    es: "¿En qué contratos permite la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público invocar una imperiosa urgencia para seguir el procedimiento negociado sin publicidad?"
  options:
  - id: a
    correct: true
    text:
      es: "En los contratos de obras, suministros y servicios."
  - id: b
    text:
      es: "En los de obras, suministros, servicios y concesiones de obras y de servicios."
  - id: c
    text:
      es: "Solo en los contratos de suministros y de servicios."
  - id: d
    text:
      es: "Solo en los de concesión de obras y de concesión de servicios."
  explanation:
    es: "El artículo 168 separa los supuestos por tipo de contrato. La imperiosa urgencia está en la letra b), que se refiere a «los contratos de obras, suministros y servicios». Las concesiones de obras y de servicios aparecen en el primer grupo de casos del artículo, pero no en el de la imperiosa urgencia, así que quedan fuera de este supuesto. Las obras no están excluidas."
  citation: "art. 168 LCSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2017-12902-art-172
- id: m03-l04-q158
  prompt:
    es: "Según el artículo 172.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿quién dirige el diálogo con los candidatos seleccionados en el diálogo competitivo?"
  options:
  - id: a
    text:
      es: "La mesa de contratación del órgano."
  - id: b
    correct: true
    text:
      es: "La mesa especial de diálogo competitivo."
  - id: c
    text:
      es: "El responsable del contrato designado."
  - id: d
    text:
      es: "La Junta Consultiva de Contratación Pública."
  explanation:
    es: "El artículo 172.1 dice: «En el diálogo competitivo, la mesa especial de diálogo competitivo dirige un diálogo con los candidatos seleccionados». No lo dirige la mesa de contratación ordinaria ni el responsable del contrato, que actúa en la ejecución. La Junta Consultiva de Contratación Pública del Estado es un órgano consultivo y no interviene en el procedimiento."
  citation: "art. 172.1 LCSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2017-12902-art-172
- id: m03-l04-q159
  prompt:
    es: "En el diálogo competitivo, el diálogo que la mesa especial dirige con los candidatos seleccionados, previa solicitud de estos, tiene por objeto:"
  options:
  - id: a
    text:
      es: "Negociar el precio final del contrato una vez presentadas las ofertas definitivas."
  - id: b
    text:
      es: "Seleccionar como mínimo a cinco candidatos atendiendo a su solvencia técnica."
  - id: c
    correct: true
    text:
      es: "Desarrollar una o varias soluciones que sirvan de base a las ofertas de los candidatos."
  - id: d
    text:
      es: "Fijar el presupuesto base de licitación antes de publicar el anuncio del contrato."
  explanation:
    es: "El artículo 172.1 dice que el diálogo se dirige «a fin de desarrollar una o varias soluciones susceptibles de satisfacer sus necesidades y que servirán de base para que los candidatos elegidos presenten una oferta». No es una negociación del precio tras las ofertas definitivas. La selección de al menos cinco candidatos es la regla del restringido (artículo 162.2). El diálogo es posterior al anuncio, no previo a él."
  citation: "art. 172.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-326
- id: m03-l04-q160
  prompt:
    es: "¿En cuál de los siguientes procedimientos es potestativa la constitución de la mesa de contratación, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "En el procedimiento restringido no sujeto a regulación armonizada."
  - id: b
    text:
      es: "En la licitación con negociación de un contrato no armonizado."
  - id: c
    text:
      es: "En el diálogo competitivo, si el pliego de cláusulas así lo prevé."
  - id: d
    correct: true
    text:
      es: "En el negociado sin publicidad no basado en imperiosa urgencia."
  explanation:
    es: "El artículo 326.1 dice que en los procedimientos negociados sin anuncio «la constitución de la mesa será potestativa para el órgano de contratación, salvo cuando se fundamente en la existencia de una imperiosa urgencia». El restringido, la licitación con negociación y el diálogo competitivo están en la lista de procedimientos en que la mesa asiste al órgano de contratación, sin excepción ligada a los pliegos."
  citation: "art. 326.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-326
- id: m03-l04-q161
  prompt:
    es: "De acuerdo con el artículo 326.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el negociado sin publicidad fundado en una imperiosa urgencia, la constitución de la mesa de contratación:"
  options:
  - id: a
    correct: true
    text:
      es: "Es obligatoria para el órgano de contratación."
  - id: b
    text:
      es: "Es potestativa para el órgano de contratación."
  - id: c
    text:
      es: "Solo es obligatoria si el contrato es armonizado."
  - id: d
    text:
      es: "Se sustituye por la intervención de la Junta Consultiva."
  explanation:
    es: "El artículo 326.1 hace potestativa la mesa en los negociados sin anuncio, «salvo cuando se fundamente en la existencia de una imperiosa urgencia prevista en la letra b) 1.º del artículo 168, en el que será obligatoria la constitución de la mesa». La potestad es la regla de los demás negociados sin publicidad, no de este. La obligación no depende de la regulación armonizada. La Junta Consultiva no sustituye a la mesa."
  citation: "art. 326.1 LCSP"
  difficulty: 3
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2017-12902-art-326
- id: m03-l04-q162
  prompt:
    es: "En un procedimiento abierto simplificado tramitado conforme al artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿es obligatoria la mesa de contratación?"
  options:
  - id: a
    text:
      es: "Sí, como en cualquier procedimiento abierto simplificado."
  - id: b
    correct: true
    text:
      es: "No, es potestativa para el órgano de contratación."
  - id: c
    text:
      es: "Sí, salvo que se trate de un contrato de suministro."
  - id: d
    text:
      es: "No, porque en esa tramitación la mesa está prohibida."
  explanation:
    es: "El artículo 326.1 dice: «En los procedimientos a los que se refiere el artículo 159.6 será igualmente potestativa la constitución de la mesa». La obligación del simplificado general no alcanza a esta tramitación. El artículo no distingue entre suministros y otros contratos. La mesa no está prohibida: el órgano puede constituirla si quiere."
  citation: "art. 326.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2017-12902-art-326
- id: m03-l04-q163
  prompt:
    es: "Según el artículo 326.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los órganos de contratación de las Administraciones Públicas estarán asistidos por una mesa en el procedimiento abierto, salvo que:"
  options:
  - id: a
    text:
      es: "El contrato no esté sujeto a regulación armonizada por su valor."
  - id: b
    text:
      es: "El único criterio de adjudicación sea el precio más bajo."
  - id: c
    correct: true
    text:
      es: "La competencia corresponda a una Junta de Contratación."
  - id: d
    text:
      es: "El valor estimado sea inferior a 140.000 euros, IVA excluido."
  explanation:
    es: "El artículo 326.1 empieza: «Salvo en el caso en que la competencia para contratar corresponda a una Junta de Contratación», los órganos de contratación estarán asistidos por una mesa en los procedimientos que enumera, entre ellos el abierto. La regulación armonizada, el precio como único criterio y el valor estimado no son excepciones a esa regla."
  citation: "art. 326.1 LCSP"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2017-12902-art-326
- id: m03-l04-q164
  prompt:
    es: "De acuerdo con el artículo 326.5 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, entre los vocales de la mesa de contratación deben figurar necesariamente:"
  options:
  - id: a
    text:
      es: "Un funcionario del asesoramiento jurídico y un representante de los licitadores."
  - id: b
    text:
      es: "Un interventor y un cargo público representativo del departamento ministerial."
  - id: c
    text:
      es: "Un interventor y la persona que redactó la documentación técnica del contrato."
  - id: d
    correct: true
    text:
      es: "Un funcionario del asesoramiento jurídico del órgano y un interventor."
  explanation:
    es: "El artículo 326.5 dice que «entre los vocales deberán figurar necesariamente un funcionario de entre quienes tengan atribuido legal o reglamentariamente el asesoramiento jurídico del órgano de contratación y un interventor», o quienes tengan esas funciones. Los licitadores no forman parte de la mesa. El mismo apartado prohíbe que formen parte de ella los cargos públicos representativos y el personal que haya redactado la documentación técnica del contrato, salvo los supuestos de la disposición adicional segunda."
  citation: "art. 326.5 LCSP"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2017-12902-art-150
- id: m03-l04-q165
  prompt:
    es: "Según el artículo 150.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el licitador con la mejor oferta debe presentar la documentación justificativa y la garantía definitiva:"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de diez días hábiles, a contar desde el siguiente a aquel en que recibió el requerimiento."
  - id: b
    text:
      es: "Dentro de siete días hábiles, a contar desde el envío de la comunicación del requerimiento."
  - id: c
    text:
      es: "Dentro de diez días naturales, a contar desde el siguiente a aquel en que recibió el requerimiento."
  - id: d
    text:
      es: "Dentro de quince días hábiles, a contar desde la notificación de la adjudicación del contrato."
  explanation:
    es: "El artículo 150.2 da al licitador con la mejor oferta un plazo «de diez días hábiles, a contar desde el siguiente a aquel en que hubiera recibido el requerimiento», para presentar la documentación y la garantía definitiva. Los siete días hábiles desde el envío son el plazo del abierto simplificado (artículo 159.4.f). La ley dice expresamente «hábiles», así que no son naturales. Los quince días hábiles desde la notificación de la adjudicación son la espera para formalizar (artículo 153.3)."
  citation: "art. 150.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-150
- id: m03-l04-q166
  prompt:
    es: "En un procedimiento abierto, el licitador con la mejor oferta recibe el lunes 9 de febrero de 2026 el requerimiento de documentación y garantía definitiva. Sin festivos en el periodo, ¿cuál es el último día para atenderlo?"
  options:
  - id: a
    text:
      es: "El miércoles 18 de febrero de 2026."
  - id: b
    text:
      es: "El jueves 19 de febrero de 2026."
  - id: c
    text:
      es: "El viernes 20 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 23 de febrero de 2026."
  explanation:
    es: "El artículo 150.2 da «diez días hábiles, a contar desde el siguiente a aquel en que hubiera recibido el requerimiento». Se excluyen sábados y domingos. Desde el martes 10 de febrero, los días hábiles son del 10 al 13 y del 16 al 20, y el décimo es el lunes 23 de febrero. El viernes 20 sale de contar desde el mismo día de recepción. El jueves 19 cuenta diez días naturales. El miércoles 18 aplica los siete días hábiles del abierto simplificado."
  citation: "art. 150.2 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-153
- id: m03-l04-q167
  prompt:
    es: "De acuerdo con el artículo 153.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el contrato es susceptible de recurso especial en materia de contratación, la formalización:"
  options:
  - id: a
    text:
      es: "Deberá efectuarse no más tarde de los quince días hábiles siguientes a la notificación de la adjudicación."
  - id: b
    text:
      es: "No podrá efectuarse antes de que transcurra un mes desde la publicación de la adjudicación en el perfil."
  - id: c
    correct: true
    text:
      es: "No podrá hacerse antes de que transcurran quince días hábiles desde que se remita la notificación."
  - id: d
    text:
      es: "Podrá efectuarse en cuanto el adjudicatario constituya la garantía definitiva, sin plazo de espera."
  explanation:
    es: "El artículo 153.3 dice que, si el contrato es susceptible de recurso especial, «la formalización no podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación a los licitadores y candidatos». El límite de «no más tarde de los quince días hábiles» rige en los contratos no susceptibles de recurso especial. El mes es el máximo hasta el que las comunidades autónomas pueden ampliar el plazo, y no se cuenta desde la publicación en el perfil. La garantía definitiva no elimina la espera."
  citation: "art. 153.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-153
- id: m03-l04-q168
  prompt:
    es: "Un ministerio remite el lunes 2 de febrero de 2026 la notificación de la adjudicación de un contrato susceptible de recurso especial. Sin recurso ni festivos en el periodo, ¿en cuál de estas fechas podría ya formalizarse?"
  options:
  - id: a
    text:
      es: "El martes 17 de febrero de 2026."
  - id: b
    text:
      es: "El miércoles 18 de febrero de 2026."
  - id: c
    text:
      es: "El viernes 20 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "El miércoles 25 de febrero de 2026."
  explanation:
    es: "La formalización no puede efectuarse antes de que transcurran quince días hábiles desde la remisión de la notificación (artículo 153.3). Se excluyen sábados y domingos. Desde el martes 3 de febrero, los días hábiles son del 3 al 6, del 9 al 13, del 16 al 20 y el 23: el decimoquinto es el lunes 23 de febrero. Solo el miércoles 25 de febrero queda después. El martes 17 es el decimoquinto día natural, y el miércoles 18 es el día siguiente: los dos cuentan días naturales donde la ley dice hábiles. El viernes 20 es solo el decimocuarto día hábil."
  citation: "art. 153.3 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-153
- id: m03-l04-q170
  prompt:
    es: "Según el artículo 153.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la penalidad por no formalizar el contrato por causa imputable al adjudicatario se calcula sobre:"
  options:
  - id: a
    text:
      es: "El precio de adjudicación del contrato, IVA excluido."
  - id: b
    correct: true
    text:
      es: "El presupuesto base de licitación, IVA excluido."
  - id: c
    text:
      es: "El presupuesto base de licitación, IVA incluido."
  - id: d
    text:
      es: "El valor estimado del contrato, con sus prórrogas."
  explanation:
    es: "El artículo 153.4 exige «el importe del 3 por ciento del presupuesto base de licitación, IVA excluido». La base no es el precio de adjudicación ni el valor estimado, y el IVA queda fuera del cálculo."
  citation: "art. 153.4 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-219
- id: m03-l04-q171
  prompt:
    es: "De acuerdo con el artículo 219.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la duración de un acuerdo marco:"
  options:
  - id: a
    text:
      es: "No excederá de cuatro años en ningún caso, ni siquiera en casos excepcionales."
  - id: b
    text:
      es: "No podrá exceder de cinco años, incluidas todas sus posibles prórrogas."
  - id: c
    correct: true
    text:
      es: "No excederá de cuatro años, salvo casos excepcionales debidamente justificados."
  - id: d
    text:
      es: "Será la que fije libremente el pliego, sin un límite máximo legal."
  explanation:
    es: "El artículo 219.2 dice: «La duración de un acuerdo marco no podrá exceder de cuatro años, salvo en casos excepcionales, debidamente justificados». El límite admite excepciones justificadas. Los cinco años con prórrogas son el límite de los contratos de suministros y servicios de prestación sucesiva (artículo 29.4), no de los acuerdos marco. La ley sí fija un límite."
  citation: "art. 219.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-221
- id: m03-l04-q173
  prompt:
    es: "En un acuerdo marco celebrado con varias empresas que establece todos los términos, ¿qué determina si los contratos basados se adjudican con nueva licitación o sin ella?"
  options:
  - id: a
    correct: true
    text:
      es: "Lo que prevea el pliego regulador del acuerdo marco."
  - id: b
    text:
      es: "La decisión del órgano en cada caso, sin previsión previa."
  - id: c
    text:
      es: "El valor estimado de cada uno de los contratos basados."
  - id: d
    text:
      es: "El acuerdo entre las empresas parte del acuerdo marco."
  explanation:
    es: "El artículo 221.4.a) dice que, cuando el acuerdo marco establece todos los términos, los contratos basados se adjudican «bien sin nueva licitación, bien con nueva licitación», y que esa posibilidad «deberá estar prevista en el pliego regulador del acuerdo marco», que determinará los supuestos de cada sistema. El órgano no decide sin previsión previa. El artículo no hace depender la elección del valor estimado ni de un acuerdo entre las empresas."
  citation: "art. 221.4.a) LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-223
- id: m03-l04-q175
  prompt:
    es: "Señale la afirmación correcta sobre el sistema dinámico de adquisición regulado en la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público:"
  options:
  - id: a
    text:
      es: "Es un proceso que admite ofertas en papel, con una duración limitada y determinada en los pliegos."
  - id: b
    text:
      es: "Es un proceso totalmente electrónico, de duración indefinida mientras haya crédito disponible."
  - id: c
    correct: true
    text:
      es: "Es un proceso totalmente electrónico, con una duración limitada y determinada en los pliegos."
  - id: d
    text:
      es: "Es un proceso totalmente electrónico, reservado a las empresas que integran un acuerdo marco."
  explanation:
    es: "El artículo 223.2 dice: «El sistema dinámico de adquisición es un proceso totalmente electrónico, con una duración limitada y determinada en los pliegos». No admite ofertas en papel. Su duración no es indefinida. No está reservado a empresas de un acuerdo marco: debe estar abierto a cualquier empresa interesada que cumpla los criterios de selección."
  citation: "art. 223.2 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q176
  prompt:
    es: "Un ministerio licita unas obras con un valor estimado de 2.000.000 de euros exactos y sin criterios evaluables mediante juicio de valor. ¿Puede seguir el procedimiento abierto simplificado?"
  options:
  - id: a
    text:
      es: "No, porque en obras el valor estimado debe ser inferior a 2.000.000 de euros."
  - id: b
    text:
      es: "No, porque supera los 140.000 euros, límite del simplificado en todos los contratos."
  - id: c
    correct: true
    text:
      es: "Sí, porque en obras el límite es un valor estimado igual o inferior a 2.000.000 de euros."
  - id: d
    text:
      es: "No, porque en obras el simplificado solo cabe por debajo de 80.000 euros."
  explanation:
    es: "El artículo 159.1.a) admite el simplificado en obras cuyo valor estimado sea «igual o inferior a 2.000.000 de euros», así que un valor de 2.000.000 exactos entra. Sin criterios de juicio de valor, también se cumple la segunda condición. El límite no exige un valor inferior a esa cifra: la incluye. Los 140.000 euros son el límite de suministro y servicios, no de obras. Los 80.000 euros marcan la tramitación del artículo 159.6, no el simplificado general."
  citation: "art. 159.1.a) LCSP"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q177
  prompt:
    es: "Según el artículo 159.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué límite de valor estimado deben respetar los contratos de suministros y de servicios para seguir la tramitación de ese apartado?"
  options:
  - id: a
    correct: true
    text:
      es: "Un valor estimado inferior a 60.000 euros."
  - id: b
    text:
      es: "Un valor estimado inferior a 80.000 euros."
  - id: c
    text:
      es: "Un valor estimado igual o inferior a 60.000 euros."
  - id: d
    text:
      es: "Un valor estimado inferior a 140.000 euros."
  explanation:
    es: "El artículo 159.6 se aplica a los «contratos de suministros y de servicios de valor estimado inferior a 60.000 euros». La cifra de 80.000 euros es el límite de las obras en esa misma tramitación. El texto dice «inferior», así que un valor de 60.000 euros exactos queda fuera. Los 140.000 euros son el límite del simplificado general en suministro y servicios."
  citation: "art. 159.6 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-153
- id: m03-l04-q178
  prompt:
    es: "Según el artículo 153.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué caso se exige al adjudicatario el 3 por ciento del presupuesto base de licitación, IVA excluido?"
  options:
  - id: a
    text:
      es: "Cuando incurra en demora respecto del plazo total de ejecución del contrato."
  - id: b
    text:
      es: "Cuando ceda el contrato a un tercero sin autorización del órgano de contratación."
  - id: c
    text:
      es: "Cuando no se formalice el contrato en plazo por causas imputables a la Administración."
  - id: d
    correct: true
    text:
      es: "Cuando no se formalice el contrato en plazo por causas imputables a él."
  explanation:
    es: "El artículo 153.4 dice: «Cuando por causas imputables al adjudicatario no se hubiese formalizado el contrato dentro del plazo indicado se le exigirá el importe del 3 por ciento del presupuesto base de licitación, IVA excluido». La demora en la ejecución se castiga con penalidades diarias de 0,60 euros por cada 1.000 euros del precio (artículo 193.3), no con ese porcentaje. La cesión del contrato no está en este artículo. Si la falta de formalización es imputable a la Administración, es ella la que indemniza al contratista (artículo 153.5)."
  citation: "art. 153.4 LCSP"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
