# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q257
  prompt:
    es: "En una consulta de Access 365, ¿qué función muestra el primer carácter del valor del campo NombreDeProducto en un campo calculado?"
  options:
  - id: a
    correct: true
    text:
      es: "Izq"
  - id: b
    text:
      es: "Der"
  - id: c
    text:
      es: "Medio"
  - id: d
    text:
      es: "Longitud"
  explanation:
    es: "La ayuda dice que «ProductInitial: Left([ProductName], 1)» usa la función Izq «para mostrar [...] el primer carácter». Der muestra los últimos caracteres, Medio los que empiezan en una posición dada y Longitud cuenta los caracteres del texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q258
  prompt:
    es: "En una consulta de Access 365, ¿con qué se pueden agrupar los datos por valores de campo?"
  options:
  - id: a
    text:
      es: "Con la fila Total de la hoja de datos"
  - id: b
    correct: true
    text:
      es: "Con la fila Totales de la cuadrícula de diseño"
  - id: c
    text:
      es: "Con la fila Criterios de la cuadrícula de diseño"
  - id: d
    text:
      es: "Con la fila Anexar a de la cuadrícula de diseño"
  explanation:
    es: "La ayuda dice que, aunque tienen nombres parecidos, «puede agrupar datos por valores de campo con la fila Totales en la cuadrícula de diseño», mientras que la fila Total de una hoja de datos se agrega a los resultados de una consulta de totales. La fila Criterios limita registros y Anexar a es de las consultas de datos anexados."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de totales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q301
  prompt:
    es: "En Access 365, ¿cuál de las siguientes descripciones corresponde a un subformulario, según la ayuda de Microsoft sobre cómo crear un formulario que contiene un subformulario?"
  options:
  - id: a
    correct: true
    text:
      es: "Un formulario que se inserta en otro formulario"
  - id: b
    text:
      es: "Una tabla que se muestra dentro de un informe"
  - id: c
    text:
      es: "Un formulario que sustituye al principal al abrirlo"
  - id: d
    text:
      es: "Un informe que se imprime con los datos del formulario"
  explanation:
    es: "La ayuda dice: «Un subformulario es un formulario que se inserta en otro formulario». «Una tabla que se muestra dentro de un informe» no lo es: el subformulario es un formulario, no una tabla. «Un formulario que sustituye al principal al abrirlo» tampoco: el subformulario se inserta en el principal, que sigue mostrándose. «Un informe que se imprime con los datos del formulario» describe otro objeto, el informe, y no un subformulario."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q302
  prompt:
    es: "En un formulario de Access 365 con subformulario basado en una relación de uno a varios, ¿cuál de las siguientes opciones recoge los datos que muestra el subformulario?"
  options:
  - id: a
    text:
      es: "Los datos del lado «uno» de la relación"
  - id: b
    correct: true
    text:
      es: "Los datos del lado «varios» de la relación"
  - id: c
    text:
      es: "Los datos de todas las tablas de la base de datos"
  - id: d
    text:
      es: "Solo los campos calculados del formulario principal"
  explanation:
    es: "La ayuda dice: «El subformulario muestra los datos del lado \"varios\" de la relación». «Los datos del lado «uno» de la relación» son los del formulario principal: «El formulario principal muestra datos del lado \"uno\" de la relación». «Los datos de todas las tablas de la base de datos» no los muestra: están vinculados y solo aparecen los registros relacionados con el registro actual del principal. «Solo los campos calculados del formulario principal» tampoco: la ayuda no le atribuye esa función."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q303
  prompt:
    es: "En Access 365, si un formulario y su subformulario estuvieran desvinculados, ¿qué mostraría el subformulario al ver un empleado en el formulario principal?"
  options:
  - id: a
    text:
      es: "Solo los pedidos del empleado que se muestra"
  - id: b
    text:
      es: "Ningún pedido hasta que se vincule"
  - id: c
    correct: true
    text:
      es: "Todos los pedidos, no solo los del empleado"
  - id: d
    text:
      es: "Solo los pedidos del último empleado consultado"
  explanation:
    es: "La ayuda dice: «Si el formulario y el subformulario estuvieran desvinculados, el subformulario mostraría todos los pedidos, no solo el de Nancy». «Solo los pedidos del empleado que se muestra» es lo que ocurre con los formularios vinculados: «en el subformulario solo se muestran los registros relacionados con el registro actual del formulario principal». «Ningún pedido hasta que se vincule» y «solo los pedidos del último empleado consultado» no figuran en la ayuda, que solo habla de mostrar todos los pedidos."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q304
  prompt:
    es: "En Access 365, ¿qué propiedad del control de subformulario determina el objeto que se muestra en el control?"
  options:
  - id: a
    text:
      es: "Vincular campos principales"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Vista predeterminada"
  - id: d
    correct: true
    text:
      es: "Objeto origen"
  explanation:
    es: "La ayuda define la «Propiedad Objeto origen» como la «Propiedad del control de subformulario que determina el objeto que se muestra en el control». «Vincular campos principales» y «Vincular campos secundarios» especifican los campos que vinculan el subformulario con el formulario principal, no el objeto mostrado. «Vista predeterminada» determina cómo se muestra el subformulario (la propiedad Default View), no cuál es el objeto."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q305
  prompt:
    es: "En Access 365, ¿qué propiedad del control de subformulario especifica qué campos del formulario principal lo vinculan al subformulario?"
  options:
  - id: a
    correct: true
    text:
      es: "Vincular campos principales"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Objeto origen"
  - id: d
    text:
      es: "Vista predeterminada"
  explanation:
    es: "La ayuda define la «Propiedad Vincular campos principales» como «La propiedad del control de subformulario que especifica qué campo o campos del formulario principal lo vinculan al subformulario». «Vincular campos secundarios» especifica los campos del subformulario, no los del principal: «qué campo o campos del subformulario lo vinculan al formulario principal». «Objeto origen» determina el objeto que se muestra. «Vista predeterminada» fija cómo se muestra el subformulario."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q306
  prompt:
    es: "El control de subformulario de Access 365 muestra una hoja de datos cuando su objeto de origen es:"
  options:
  - id: a
    text:
      es: "una macro o un módulo"
  - id: b
    correct: true
    text:
      es: "una tabla o una consulta"
  - id: c
    text:
      es: "un informe de varias páginas"
  - id: d
    text:
      es: "una expresión de control calculado"
  explanation:
    es: "La ayuda dice: «El control de subformulario muestra una hoja de datos cuando su objeto de origen es una tabla o consulta, o cuando su objeto de origen es un formulario cuya Default View propiedad está establecida en Datasheet». «Una macro o un módulo», «un informe de varias páginas» y «una expresión de control calculado» no son objetos de origen que la ayuda cite para el control de subformulario: solo cita otro formulario, una tabla o una consulta."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q307
  prompt:
    es: "En Access 365, ¿qué ventaja ofrece basar un subformulario en un objeto de formulario y no en una tabla o consulta?"
  options:
  - id: a
    text:
      es: "Se pueden omitir las relaciones entre tablas"
  - id: b
    text:
      es: "Se muestra siempre como una hoja de datos"
  - id: c
    correct: true
    text:
      es: "Se pueden agregar campos calculados al subformulario"
  - id: d
    text:
      es: "Se vincula solo con el último registro del principal"
  explanation:
    es: "La ayuda dice: «Una ventaja de basar un subformulario en un objeto de formulario es que puede agregar campos calculados al subformulario, como [Quantity] * [Unit price]». «Se pueden omitir las relaciones entre tablas» es falso: la nota recomienda «establezca relaciones entre tablas antes de seguir los procedimientos» para que Access cree los vínculos. «Se muestra siempre como una hoja de datos» también: puede verse como un único formulario, un formulario continuo o una hoja de datos. «Se vincula solo con el último registro del principal» no consta: el subformulario muestra los registros relacionados con el registro actual."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q308
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de los siguientes procedimientos sirve para que Access cree un formulario principal y un subformulario y los vincule?"
  options:
  - id: a
    text:
      es: "Arrastrar un formulario hasta otro formulario"
  - id: b
    text:
      es: "Usar el Asistente para subformularios en un formulario existente"
  - id: c
    text:
      es: "Abrir el subformulario en una ventana nueva"
  - id: d
    correct: true
    text:
      es: "Crear el formulario con el Asistente para formularios"
  explanation:
    es: "La ayuda lo recomienda para quien «desea que Access cree un formulario principal y un subformulario, y que vincule el subformulario al formulario principal»: crear el formulario con el Asistente para formularios. «Arrastrar un formulario hasta otro formulario» es el procedimiento para usar formularios ya existentes como principal y subformulario. «Usar el Asistente para subformularios en un formulario existente» sirve cuando ya hay un formulario principal y Access solo crea el subformulario. «Abrir el subformulario en una ventana nueva» sirve para cambiar su diseño desde la vista Diseño."
  citation: "fuente: `ms-access-subformulario.html`; «Crear o agregar un subformulario»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q309
  prompt:
    es: "En Access 365, se quiere usar un formulario existente como principal y que Access cree un subformulario nuevo y lo agregue. ¿Qué procedimiento recomienda la ayuda?"
  options:
  - id: a
    correct: true
    text:
      es: "El Asistente para subformularios en un formulario existente"
  - id: b
    text:
      es: "El Asistente para formularios desde la pestaña Crear"
  - id: c
    text:
      es: "Arrastrar un formulario existente hasta el principal"
  - id: d
    text:
      es: "La herramienta Formulario dividido de la pestaña Crear"
  explanation:
    es: "La ayuda lo recomienda para quien «desea usar un formulario existente como formulario principal, pero desea que Access cree un nuevo subformulario y lo agregue al formulario principal»: «Agregar uno o varios subformularios a un formulario existente con el Asistente para subformularios». «El Asistente para formularios desde la pestaña Crear» crea el principal y el subformulario a la vez. «Arrastrar un formulario existente hasta el principal» sirve cuando el subformulario también existe ya. «Formulario dividido» es otra herramienta de la pestaña Crear que no crea subformularios."
  citation: "fuente: `ms-access-subformulario.html`; «Crear o agregar un subformulario»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q310
  prompt:
    es: "En Access 365, ¿cómo se agrega a un formulario principal un formulario ya existente para que haga de subformulario, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Con el botón Subformulario en ventana nueva del grupo Herramientas"
  - id: b
    correct: true
    text:
      es: "Arrastrándolo desde el panel de navegación hasta el principal"
  - id: c
    text:
      es: "Con el Asistente para formularios, eligiendo otra tabla"
  - id: d
    text:
      es: "Cambiando la propiedad Vista predeterminada del principal"
  explanation:
    es: "La ayuda dice: «Arrastre el formulario que quiera usar como el subformulario desde el panel de navegación hasta el formulario principal». «Subformulario en ventana nueva» solo abre el subformulario en su propia ventana para cambiar su diseño. El «Asistente para formularios» crea formularios nuevos, no incorpora uno existente. «Vista predeterminada» solo fija cómo se muestra el subformulario, y no lo agrega."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un subformulario arrastrando un formulario hasta otro»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q311
  prompt:
    es: "Señale qué ocurre en Access 365 si el Asistente para formularios no muestra la pregunta ¿Cómo desea ver los datos? al elegir dos tablas:"
  options:
  - id: a
    text:
      es: "Access agrega el subformulario con los campos de vínculo en blanco"
  - id: b
    text:
      es: "Access crea el subformulario con la tabla elegida en segundo lugar"
  - id: c
    correct: true
    text:
      es: "Access no halló una relación uno a varios y no agrega subformulario"
  - id: d
    text:
      es: "El asistente se cancela y no crea ningún formulario"
  explanation:
    es: "La ayuda dice: si no se muestra esa pregunta, «quiere decir que Access no encontró una relación uno a varios entre las tablas o consultas seleccionadas. El asistente continuará, pero Access no agregará un subformulario al formulario». «Access agrega el subformulario con los campos de vínculo en blanco» y «Access crea el subformulario con la tabla elegida en segundo lugar» son falsos: no se agrega subformulario. «El asistente se cancela y no crea ningún formulario» también lo es: «El asistente continuará»."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un formulario que contenga un subformulario mediante el Asistente para formularios»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q312
  prompt:
    es: "En Access 365, al terminar el Asistente para formularios con la opción Formulario con subformularios, ¿cuántos formularios crea Access?"
  options:
  - id: a
    text:
      es: "Uno solo, con el subformulario como sección interna"
  - id: b
    text:
      es: "Tres: el principal, el subformulario y un informe resumen"
  - id: c
    text:
      es: "Uno por cada campo elegido en las dos tablas"
  - id: d
    correct: true
    text:
      es: "Dos: el principal y el propio subformulario"
  explanation:
    es: "La ayuda dice: «Access crea dos formularios: uno para el formulario principal que contiene el control del subformulario y otro para el propio subformulario». Por eso «uno solo, con el subformulario como sección interna» es falso. «Tres: el principal, el subformulario y un informe resumen» y «uno por cada campo elegido» tampoco figuran en la ayuda."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un formulario que contenga un subformulario mediante el Asistente para formularios»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q313
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta abre un subformulario en su propia ventana desde la vista Diseño del formulario principal?"
  options:
  - id: a
    text:
      es: "Diseño de formulario › Controles › Subformulario/Subinforme"
  - id: b
    correct: true
    text:
      es: "Diseño de formulario › Herramientas › Subformulario en ventana nueva"
  - id: c
    text:
      es: "Diseño de formulario › Herramientas › Orden de tabulación"
  - id: d
    text:
      es: "Inicio › Vistas › Ver › Vista Formulario"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de formulario, en el grupo Herramientas, haga clic en Subformulario en ventana nueva». «Controles › Subformulario/Subinforme» inserta un subformulario con el asistente en un formulario existente. «Herramientas › Orden de tabulación» abre el cuadro de diálogo Orden de tabulación. «Inicio › Vistas › Ver › Vista Formulario» cambia a la vista Formulario, la que se usa para comprobar el vínculo."
  citation: "fuente: `ms-access-subformulario.html`; «Abrir un subformulario en una nueva ventana de la vista Diseño»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q314
  prompt:
    es: "En Access 365, ¿cuál de los siguientes valores de la propiedad Vista predeterminada de un subformulario lo muestra como una hoja de datos en el formulario principal?"
  options:
  - id: a
    text:
      es: "Formularios continuos"
  - id: b
    text:
      es: "Un único formulario"
  - id: c
    correct: true
    text:
      es: "Hoja de datos"
  - id: d
    text:
      es: "Formulario dividido"
  explanation:
    es: "La ayuda dice: «si establece la Default View propiedad de un subformulario en Datasheet, el subformulario se muestra como una hoja de datos en el formulario principal». «Formularios continuos», «Un único formulario» y «Formulario dividido» son los otros tres valores de la lista de la propiedad (Un único formulario, Formularios continuos, Hoja de datos y Formulario dividido), y ninguno muestra una hoja de datos."
  citation: "fuente: `ms-access-subformulario.html`; «Cambiar la vista predeterminada de un subformulario»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q315
  prompt:
    es: "Señale qué propiedad debe estar establecida en Sí si Hoja de datos no aparece en la lista Vista predeterminada de un subformulario de Access 365:"
  options:
  - id: a
    text:
      es: "Permitir vista Formulario"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Objeto origen"
  - id: d
    correct: true
    text:
      es: "Permitir vista Hoja de datos"
  explanation:
    es: "La ayuda dice: «si desea especificar Hoja de datos como la vista predeterminada para el formulario, asegúrese de que la propiedad Permitir vista Hoja de datos esté establecida en Sí». «Permitir vista Formulario» corresponde a la vista Formulario, no a la de hoja de datos. «Vincular campos secundarios» y «Objeto origen» no controlan las vistas disponibles: vinculan campos y determinan el objeto mostrado."
  citation: "fuente: `ms-access-subformulario.html`; «Cambiar la vista predeterminada de un subformulario»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q316
  prompt:
    es: "En el Enlazador de campos de subformulario de Access 365, ¿cuál de los siguientes botones hace que Access intente determinar los campos vinculantes?"
  options:
  - id: a
    correct: true
    text:
      es: "Sugerir"
  - id: b
    text:
      es: "Crear"
  - id: c
    text:
      es: "Aceptar"
  - id: d
    text:
      es: "Finalizar"
  explanation:
    es: "La ayuda dice: «haga clic en Sugerir para que Access intente determinar los campos vinculantes». «Crear» es el botón junto al cuadro de propiedad Link Child Fields, que abre el cuadro de diálogo Enlazador de campos de subformulario. «Aceptar» confirma los campos elegidos en las listas Campos principales y Campos secundarios. «Finalizar» es el botón de la última página de un asistente."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un subformulario arrastrando un formulario hasta otro»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q317
  prompt:
    es: "En Access 365, ¿qué crea Access al arrastrar una tabla o consulta desde el panel de navegación hasta un formulario abierto en la vista Presentación?"
  options:
  - id: a
    text:
      es: "Un formulario nuevo independiente de la tabla"
  - id: b
    correct: true
    text:
      es: "Un control de subformulario o subinforme"
  - id: c
    text:
      es: "Una consulta de datos anexados con esa tabla"
  - id: d
    text:
      es: "Una relación nueva en la ventana Relaciones"
  explanation:
    es: "La ayuda dice: «si trabaja en un formulario en la vista Presentación o en la vista Diseño y arrastra una tabla o consulta desde el panel de navegación hasta el formulario, Access creará un control de subformulario o subinforme y se mostrarán los datos en ese objeto». «Un formulario nuevo independiente de la tabla» no se crea: el control se coloca en el formulario abierto. «Una consulta de datos anexados» agrega registros a otra tabla, no muestra datos. «Una relación nueva en la ventana Relaciones» no consta en la ayuda."
  citation: "fuente: `ms-access-subformulario.html`; «Agregar datos relacionados a un formulario sin crear un subformulario»"
  difficulty: 2
  tags:
