    anchor: axon-message-transformation#_when_to_reach_for_a_transformation
    sentence: 'Payload conversion at handling time: each handler declares the type it wants, and the converter produces it from the stored payload.'
m08-l06-q13:
  key:
    anchor: axon-event-processors-streaming#tracking_tokens
    sentence: If a token claim is not extended for a configurable amount of time, other processor threads can "steal" the claim.
  wrong:
  - option: As soon as the owning thread finishes handling a batch of events
    anchor: axon-event-processors-streaming#tracking_tokens
    sentence: The processor will update this claim every time it has finished handling a batch of events.
  - option: Never, because a claim is held until the processor shuts down
    anchor: axon-event-processors-streaming#token_claim_config
    sentence: There are several scenarios where a processor may keep the claim for too long.
  - option: Whenever the event stream has no new events to deliver
    anchor: axon-event-processors-streaming#token_claim_config
    sentence: 'claimExtensionThreshold: Threshold to extend the claim in the absence of events.'
