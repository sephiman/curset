# anchor: boe-a-2015-2671-preambulo
- id: m02-l03-q046
  prompt:
    es: "¿Qué aprobó el Acuerdo del Consejo de Ministros de 15 de julio de 2005, publicado por Resolución de 19 de julio de 2005?"
  options:
  - id: a
    correct: true
    text:
      es: "La implantación de una Red de Oficinas Integradas de Atención al Ciudadano."
  - id: b
    text:
      es: "La creación del Punto de Acceso General de la Administración General del Estado."
  - id: c
    text:
      es: "La integración de las ventanillas únicas empresariales en los Puntos de Atención al Emprendedor."
  - id: d
    text:
      es: "La creación del sistema de tramitación telemática para constituir empresas."
  explanation:
    es: "El preámbulo del Real Decreto 127/2015 recuerda que se aprobó «el Acuerdo del Consejo de Ministros de 15 de julio de 2005, para la implantación de una Red de Oficinas Integradas de Atención al Ciudadano». El Punto de Acceso General lo regula la Orden HAP/1949/2014. La integración de las ventanillas en los Puntos de Atención al Emprendedor la hace el propio Real Decreto 127/2015. El sistema CIRCE se creó en 2003, según el portal del PAE."
  citation: "preámbulo RD 127/2015"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-10908-da-segunda
- id: m02-l03-q047
  prompt:
    es: "De acuerdo con la disposición adicional segunda de la Orden HAP/1949/2014, de 13 de octubre, las referencias al portal 060 de los convenios para la implantación de oficinas integradas se entenderán hechas:"
  options:
  - id: a
    text:
      es: "A la sede de cada Delegación del Gobierno."
  - id: b
    correct: true
    text:
      es: "Al Punto de Acceso General."
  - id: c
    text:
      es: "A la Carpeta Ciudadana del sector público estatal."
  - id: d
    text:
      es: "Al teléfono 060 de información administrativa."
  explanation:
    es: "La disposición adicional segunda dice que esas referencias «se entenderán realizadas al PAG», el Punto de Acceso General. No se entienden hechas a la sede de las Delegaciones del Gobierno, a la Carpeta Ciudadana ni al teléfono 060, que es un canal de acceso al PAG."
  citation: "disposición adicional segunda Orden HAP/1949/2014"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-2671-art-3
- id: m02-l03-q051
  prompt:
    es: "¿Qué sistema de tramitación telemática deben utilizar los Puntos de Atención al Emprendedor de la red estatal de apoyo a los emprendedores?"
  options:
  - id: a
    text:
      es: "El sistema de registro virtual ORVE."
  - id: b
    correct: true
    text:
      es: "El sistema de tramitación telemática CIRCE."
  - id: c
    text:
      es: "La plataforma de identificación electrónica Cl@ve."
  - id: d
    text:
      es: "La plataforma de la Carpeta Ciudadana."
  explanation:
    es: "El artículo 3.2 del Real Decreto 127/2015 dice que los PAE «utilizarán el sistema de tramitación telemática» CIRCE, lo mismo que el artículo 13.3 de la Ley 14/2013. ORVE es una aplicación de registro. Cl@ve sirve para identificarse y firmar. La Carpeta Ciudadana es el área personalizada del interesado ante el sector público estatal. Ninguna de las tres es el sistema de tramitación de los PAE."
  citation: "art. 3.2 RD 127/2015"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-2671-art-4
- id: m02-l03-q053
  prompt:
    es: "¿Cuál de los siguientes es un servicio que prestan los Puntos de Atención al Emprendedor según el Real Decreto 127/2015, de 27 de febrero?"
  options:
  - id: a
    text:
      es: "Conceder ayudas y subvenciones a los emprendedores."
  - id: b
    text:
      es: "Resolver las licencias municipales de actividad."
  - id: c
    text:
      es: "Expedir certificados electrónicos cualificados de firma."
  - id: d
    correct: true
    text:
      es: "Facilitar la tramitación del cese de la actividad."
  explanation:
    es: "El artículo 4.1.g) incluye entre los servicios de los PAE «facilitar la tramitación del cese de la actividad». Los PAE informan sobre ayudas (letra e), pero no las conceden. No resuelven licencias municipales ni expiden certificados electrónicos: facilitan trámites que resuelven otros órganos."
  citation: "art. 4.1.g) RD 127/2015"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-2671-art-6
- id: m02-l03-q054
  prompt:
    es: "Señale la respuesta correcta sobre la integración de las ventanillas electrónicas prevista en el Real Decreto 127/2015, de 27 de febrero:"
  options:
  - id: a
    correct: true
    text:
      es: "La VUDS queda integrada en el PAE electrónico, sin perjuicio de la identidad definida en el marco de la Unión Europea."
  - id: b
    text:
      es: "La VUDS queda suprimida y sus servicios pasan a prestarse a través del Punto de Acceso General."
  - id: c
    text:
      es: "La VUDS queda integrada en el PAE electrónico y pierde la identidad definida en el marco de la Unión Europea."
  - id: d
    text:
      es: "La plataforma «Emprende en 3» queda integrada en el Punto de Acceso General, no en el PAE electrónico."
  explanation:
    es: "El artículo 6.1 dice que, «sin perjuicio de la identidad definida en el marco de la Unión Europea, la VUDS quedará integrada en el PAE electrónico». La VUDS no se suprime, ni pierde esa identidad. Sus servicios no pasan al Punto de Acceso General. La plataforma «Emprende en 3» queda integrada en el PAE electrónico (art. 6.3), no en el Punto de Acceso General."
  citation: "art. 6.1 RD 127/2015"
  difficulty: 3
  tags:
  - "estructura"
# anchor: fuente-pae-circe-html
- id: m02-l03-q055
  prompt:
    es: "Según la página «CIRCE» del portal del PAE electrónico, consultada el 16 de octubre de 2026, el Documento Único Electrónico unifica:"
  options:
  - id: a
    text:
      es: "Más de 10 formularios administrativos."
  - id: b
    correct: true
    text:
      es: "Más de 25 formularios administrativos."
  - id: c
    text:
      es: "Más de 50 formularios administrativos."
  - id: d
    text:
      es: "Más de 100 formularios administrativos."
  explanation:
    es: "La página dice que el DUE «unifica más de 25 formularios administrativos». Las cifras de 10, 50 y 100 formularios no son las que da el portal."
  citation: "fuente: `pae-circe.html`"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-13
- id: m02-l03-q056
  prompt:
    es: "De acuerdo con el artículo 13 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes tienen capacidad de obrar ante las Administraciones Públicas son titulares, en sus relaciones con ellas, del derecho:"
  options:
  - id: a
    text:
      es: "A comunicarse con ellas exclusivamente a través de la sede electrónica de cada órgano competente."
  - id: b
    text:
      es: "A que la Administración les facilite gratuitamente un dispositivo de firma electrónica cualificada."
  - id: c
    correct: true
    text:
      es: "A comunicarse con ellas a través de un Punto de Acceso General electrónico de la Administración."
  - id: d
    text:
      es: "A comunicarse a través de un Punto de Acceso General, solo si son personas jurídicas."
  explanation:
    es: "La letra a) del artículo 13 reconoce el derecho «a comunicarse con las Administraciones Públicas a través de un Punto de Acceso General electrónico de la Administración». El precepto no limita la comunicación a la sede de cada órgano. No reconoce el derecho a un dispositivo de firma gratuito. Los titulares son todos los que tienen capacidad de obrar, no solo las personas jurídicas."
  citation: "art. 13.a) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-43
- id: m02-l03-q057
  prompt:
    es: "Según el artículo 43.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo funcionará el Punto de Acceso General electrónico de la Administración respecto de las notificaciones?"
  options:
  - id: a
    text:
      es: "Como la única vía para practicar las notificaciones por medios electrónicos."
  - id: b
    text:
      es: "Como un registro en el que se anotan las notificaciones rechazadas."
  - id: c
    text:
      es: "Como la sede en la que se entienden practicadas todas las notificaciones."
  - id: d
    correct: true
    text:
      es: "Como un portal de acceso desde el que los interesados podrán acceder a ellas."
  explanation:
    es: "El artículo 43.4 dice que los interesados podrán acceder a las notificaciones desde el Punto de Acceso General, «que funcionará como un portal de acceso». Las notificaciones se practican en la sede o en la dirección electrónica habilitada única (art. 43.1), así que el Punto de Acceso General no es la única vía ni la sede donde se practican. Tampoco es un registro de notificaciones rechazadas."
  citation: "art. 43.4 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-53
- id: m02-l03-q058
  prompt:
    es: "¿Cuál de las siguientes informaciones tiene derecho a consultar en el Punto de Acceso General electrónico el interesado que se relaciona electrónicamente con la Administración?"
  options:
  - id: a
    correct: true
    text:
      es: "El sentido del silencio que corresponda si no se dicta ni notifica resolución expresa en plazo."
  - id: b
    text:
      es: "Los datos personales de los demás interesados que intervienen en su mismo procedimiento."
  - id: c
    text:
      es: "El estado de tramitación de los procedimientos en los que no tenga la condición de interesado."
  - id: d
    text:
      es: "Las deliberaciones internas del órgano colegiado que haya de resolver su procedimiento."
  explanation:
    es: "El artículo 53.1.a) LPAC da a quien se relaciona electrónicamente el derecho a consultar en el Punto de Acceso General la información del párrafo anterior. Entre ella figura «el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo». El derecho se refiere a los procedimientos en los que se es interesado, no a los ajenos. No incluye los datos personales de otros interesados ni las deliberaciones internas del órgano."
  citation: "art. 53.1.a) LPAC"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-7
- id: m02-l03-q059
  prompt:
    es: "De acuerdo con el artículo 7.4 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la Dirección Electrónica Habilitada única está alojada en la sede electrónica del Punto de Acceso General de:"
  options:
  - id: a
    text:
      es: "Cada una de las comunidades autónomas."
  - id: b
    correct: true
    text:
      es: "La Administración General del Estado."
  - id: c
    text:
      es: "Cada uno de los departamentos ministeriales."
  - id: d
    text:
      es: "Cada una de las entidades locales."
  explanation:
    es: "El artículo 7.4 se refiere al PAGe «de la Administración General del Estado» y dice que «en dicha sede electrónica está alojada la Dirección Electrónica Habilitada única». Cada Administración tiene su propio PAGe (art. 7.1), pero la Dirección Electrónica Habilitada única está alojada solo en la sede del estatal. No hay un PAGe por departamento ministerial."
  citation: "art. 7.4 RD 203/2021"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2021-5032-art-8
- id: m02-l03-q060
  prompt:
    es: "¿Cuál de las siguientes funcionalidades puede ofrecer la Carpeta Ciudadana del sector público estatal al interesado?"
  options:
  - id: a
    correct: true
    text:
      es: "Conocer qué datos suyos obran en poder del sector público estatal."
  - id: b
    text:
      es: "Modificar los datos suyos que constan en el padrón municipal."
  - id: c
    text:
      es: "Interponer recursos contencioso-administrativos ante los juzgados."
  - id: d
    text:
      es: "Consultar los datos de otros interesados en su procedimiento."
  explanation:
    es: "El artículo 8.2.c) del Reglamento aprobado por el Real Decreto 203/2021 incluye la funcionalidad de «conocer qué datos suyos obran en poder del sector público estatal, sin perjuicio de las limitaciones que establezca la normativa vigente». La Carpeta no modifica el padrón, que gestionan los ayuntamientos. No sirve para interponer recursos judiciales. No da acceso a datos de otros interesados."
  citation: "art. 8.2.c) RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-8
- id: m02-l03-q061
  prompt:
    es: "Según la normativa estatal de actuación por medios electrónicos, ¿qué es la Carpeta Ciudadana del sector público estatal?"
  options:
  - id: a
    text:
      es: "El registro en el que se inscriben los poderes generales otorgados por los interesados."
  - id: b
    correct: true
    text:
      es: "El área personalizada de las personas interesadas en su relación con el sector público estatal."
  - id: c
    text:
      es: "La dirección electrónica en la que se ponen a disposición las notificaciones estatales."
  - id: d
    text:
      es: "El portal de internet que da acceso a la información de todas las Administraciones."
  explanation:
    es: "El artículo 8.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que «la Carpeta Ciudadana es el área personalizada de las personas interesadas a que se refiere el artículo 7.3 en su relación con el sector público estatal». Los poderes se inscriben en el Registro Electrónico de Apoderamientos. Las notificaciones estatales se ponen a disposición en la Dirección Electrónica Habilitada única. El portal que da acceso a la información de las Administraciones es el Punto de Acceso General."
  citation: "art. 8.1 RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-10908-art-7
- id: m02-l03-q062
  prompt:
    es: "De acuerdo con el artículo 7.3 de la Orden HAP/1949/2014, de 13 de octubre, por la que se regula el Punto de Acceso General de la Administración General del Estado y se crea su sede electrónica, esta sede se considerará:"
  options:
  - id: a
    text:
      es: "Una sede electrónica asociada de cada departamento ministerial."
  - id: b
    text:
      es: "Una sede electrónica asociada de cada Delegación del Gobierno."
  - id: c
    correct: true
    text:
      es: "La sede central de la Administración General del Estado."
  - id: d
    text:
      es: "La sede de referencia de todas las Administraciones Públicas."
  explanation:
    es: "El artículo 7.3 dice que la sede electrónica del PAG «se considerará como la sede central de la Administración General del Estado». No es una sede asociada de los ministerios ni de las Delegaciones del Gobierno. Su ámbito es la Administración General del Estado y sus organismos (art. 7.2), no todas las Administraciones."
  citation: "art. 7.3 Orden HAP/1949/2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-10908-art-4
- id: m02-l03-q063
  prompt:
    es: "Según el artículo 4 de la Orden HAP/1949/2014, de 13 de octubre, que regula el Punto de Acceso General, ¿cuál es un canal de acceso a sus servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "La atención telefónica de los servicios de información departamental, en el teléfono 060."
  - id: b
    text:
      es: "La atención telefónica de los servicios de información departamental, en el teléfono 012."
  - id: c
    text:
      es: "La atención por videoconferencia a través de la Carpeta Ciudadana del interesado."
  - id: d
    text:
      es: "La atención presencial, solo en la sede central del ministerio titular del Punto."
  explanation:
    es: "El artículo 4 enumera tres canales: Internet, la atención presencial y, «para la atención telefónica, los servicios de información departamental, en el teléfono 060». El número no es el 012. La orden no prevé la videoconferencia. La atención presencial no se limita a la sede del ministerio: incluye la oficina 060 de calle María de Molina, las Oficinas 060 de Delegaciones y Subdelegaciones y otras oficinas con convenio."
  citation: "art. 4 Orden HAP/1949/2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-pag-quienes-somos-html
- id: m02-l03-q065
  prompt:
    es: "Según la página «¿Quiénes somos?» del Punto de Acceso General, consultada el 16 de octubre de 2026, la gestión del Punto de Acceso General electrónico corresponde a:"
  options:
  - id: a
    text:
      es: "La Dirección General de la Función Pública."
  - id: b
    text:
      es: "La Dirección General del Patrimonio del Estado."
  - id: c
    correct: true
    text:
      es: "La Dirección General de Gobernanza Pública."
  - id: d
    text:
      es: "La Dirección General de Presupuestos."
  explanation:
    es: "La página dice que la gestión del PAGe «corresponde a la Dirección General de Gobernanza Pública», a través de la Subdirección General de Transparencia y Atención al Ciudadano. La Dirección General de la Función Pública, la del Patrimonio del Estado y la de Presupuestos no aparecen en la página como gestoras."
  citation: "fuente: `pag-quienes-somos.html`"
  difficulty: 2
  tags:
  - "órgano"
# anchor: fuente-pag-quienes-somos-html
- id: m02-l03-q066
  prompt:
    es: "Según la página «¿Quiénes somos?» del Punto de Acceso General, consultada el 16 de octubre de 2026, ¿a qué administraciones da un punto único de acceso el PAGe?"
  options:
  - id: a
    text:
      es: "Solo a la Administración General del Estado y a sus organismos públicos."
  - id: b
    text:
      es: "A las administraciones estatal y autonómica, pero no a la local."
  - id: c
    text:
      es: "A las administraciones estatal, autonómica y local, pero no a la europea."
  - id: d
    correct: true
    text:
      es: "A las administraciones estatal, autonómica, local y de la Unión Europea."
  explanation:
    es: "La página dice que el PAGe «constituye un punto único de acceso para la ciudadanía a todas las administraciones públicas: Estatal, Autonómica, Local y de la Unión Europea (UE)». No se limita a la Administración General del Estado. Incluye la Administración local y la de la Unión Europea."
  citation: "fuente: `pag-quienes-somos.html`"
  difficulty: 2
  tags:
  - "estructura"
# anchor: fuente-pag-telefono-060-html
- id: m02-l03-q067
  prompt:
    es: "Según la página del Punto de Acceso General sobre el teléfono 060, consultada el 16 de octubre de 2026, este teléfono ofrece:"
  options:
  - id: a
    correct: true
    text:
      es: "Información administrativa general sobre los servicios públicos y trámites de la Administración General del Estado."
  - id: b
    text:
      es: "El registro por vía telefónica de solicitudes y escritos dirigidos a cualquier Administración Pública."
  - id: c
    text:
      es: "Información sobre los trámites de las comunidades autónomas y de las entidades locales, de forma exclusiva."
  - id: d
    text:
      es: "Asesoramiento jurídico gratuito sobre la interposición de recursos administrativos contra actos estatales."
  explanation:
    es: "La página dice que el 060 «te ofrece información administrativa general sobre los servicios públicos y trámites de la Administración General del Estado». No es un canal de registro de solicitudes. No se limita a comunidades autónomas y entidades locales. No presta asesoramiento jurídico sobre recursos."
  citation: "fuente: `pag-telefono-060.html`"
  difficulty: 2
  tags:
  - "concepto"
