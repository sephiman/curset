m03-l03-q17:
  key:
    anchor: javadoc-thread#virtual-threads
    sentence: Virtual threads are suitable for executing tasks that spend most of the time blocked, often waiting for I/O operations to complete.
  wrong:
  - option: Long running CPU intensive operations that keep a core busy for minutes
    anchor: javadoc-thread#virtual-threads
    sentence: Virtual threads are not intended for long running CPU intensive operations.
  - option: Tasks that must change their own thread priority at run time
    anchor: javadoc-thread#virtual-threads
    sentence: Virtual threads have a fixed thread priority that cannot be changed.
  - option: Background work that must keep the JVM running after `main` returns
    anchor: javadoc-thread#virtual-threads
    sentence: Virtual threads are daemon threads and so do not prevent the shutdown sequence from beginning.
m03-l03-q18:
  key:
    anchor: jep-444#Observing-virtual-threads
    sentence: 'Because visualizing and analyzing a great many threads can benefit from tooling, jcmd can emit the new thread dump in JSON format in addition to plain text:'
  wrong:
