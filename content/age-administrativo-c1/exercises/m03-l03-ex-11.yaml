# anchor: boe-a-2015-10565-art-108
- id: m03-l03-q277
  prompt:
    es: "Según el artículo 108 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento de declaración de lesividad de un acto favorable, ¿qué órgano puede acordar la suspensión de su ejecución?"
  options:
  - id: a
    text:
      es: "El juez de lo contencioso-administrativo, solo tras admitir el recurso."
  - id: b
    correct: true
    text:
      es: "El órgano competente para declarar la lesividad del acto."
  - id: c
    text:
      es: "El Consejo de Estado, al emitir su dictamen sobre el acto."
  - id: d
    text:
      es: "Ninguno, porque un acto favorable no se suspende antes de la sentencia."
  explanation:
    es: "El artículo 108 se aplica a los dos procedimientos de los artículos 106 y 107, la nulidad y la lesividad, y atribuye la suspensión al «órgano competente para declarar la nulidad o lesividad». En la lesividad, ese órgano puede suspender el acto favorable antes de que se impugne ante los tribunales. No hace falta esperar al juez ni a la sentencia. El Consejo de Estado emite dictámenes en la nulidad de oficio y no suspende actos."
  citation: "art. 108 LPAC"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q278
  prompt:
    es: "Según el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene la resolución del procedimiento complementario en materia sancionadora del artículo 90.4?"
  options:
  - id: a
    text:
      es: "No pone fin a la vía y es recurrible en alzada."
  - id: b
    correct: true
    text:
      es: "Pone fin a la vía administrativa por sí misma."
  - id: c
    text:
      es: "Solo pone fin a la vía si la dicta un Ministro."
  - id: d
    text:
      es: "Es un acto de trámite sin recurso propio."
  explanation:
    es: "El artículo 114.1.f) incluye entre los actos que ponen fin a la vía administrativa «la resolución de los procedimientos complementarios en materia sancionadora a los que se refiere el artículo 90.4». No necesita que la dicte un Ministro, y como agota la vía no cabe alzada contra ella. Tampoco es un acto de trámite: resuelve el procedimiento complementario."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q280
  prompt:
    es: "Un recurso de alzada contra una resolución expresa entra en el registro del órgano competente para resolverlo el miércoles, 4 de febrero de 2026. ¿Desde qué día puede el recurrente entenderlo desestimado si no se le notifica resolución?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el martes, 5 de mayo de 2026."
  - id: b
    text:
      es: "Desde el jueves, 5 de marzo de 2026."
  - id: c
    text:
      es: "Desde el lunes, 4 de mayo de 2026."
  - id: d
    text:
      es: "Desde el miércoles, 5 de agosto de 2026."
  explanation:
    es: "El plazo para dictar y notificar la resolución de la alzada es de tres meses (art. 122.2 de la Ley 39/2015), contados desde la entrada en el registro del órgano competente (art. 21.3). Concluye el mismo día del tercer mes, el lunes 4 de mayo de 2026, día hábil (art. 30.4); el 1 y el 2 de mayo caen antes y no cuentan en un plazo por meses. Hasta el final de ese día el órgano aún puede notificar, así que la desestimación presunta opera desde el martes 5 de mayo. El 4 de mayo es todavía el último día del plazo. El 5 de marzo resulta de aplicar un mes, el plazo de la reposición, y el 5 de agosto, seis meses."
  citation: "art. 122.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "efecto"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q305
  prompt:
    es: "De acuerdo con el artículo 24.5 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la exclusión de todo recurso en materia de recusación alcanza:"
  options:
  - id: a
    text:
      es: "solo a la resolución del superior que rechaza la causa alegada por el interesado."
  - id: b
    correct: true
    text:
      es: "a las resoluciones del superior, tanto si aprecia la causa como si la rechaza."
  - id: c
    text:
      es: "solo a la resolución del superior que aprecia la causa y acuerda la sustitución."
  - id: d
    text:
      es: "a las resoluciones del superior, salvo la que rechaza la causa sin pedir informes."
  explanation:
    es: "El artículo 24.5 dice «Contra las resoluciones adoptadas en esta materia no cabrá recurso», sin distinguir su sentido. La resolución que aprecia la causa y acuerda la sustitución (artículo 24.3) y la que la rechaza (artículo 24.4) son resoluciones adoptadas en esta materia. Las opciones que limitan la regla a una sola de las dos dejan fuera a la otra. El artículo 24.4 deja los informes y comprobaciones a lo que el superior «considere oportunos», y el apartado 5 no hace excepción alguna para la resolución dictada sin ellos."
  citation: "art. 24.5 LRJSP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q306
  prompt:
    es: "Según el artículo 24.5 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿en el recurso contra qué acto puede alegarse la recusación ya resuelta por el superior?"
  options:
  - id: a
    text:
      es: "La propuesta de resolución que formule el instructor."
  - id: b
    text:
      es: "El acuerdo que abra el período de prueba."
  - id: c
    text:
      es: "El acuerdo que amplíe el plazo máximo para resolver."
  - id: d
    correct: true
    text:
      es: "El acto que ponga fin al procedimiento."
  explanation:
    es: "El artículo 24.5 permite «alegar la recusación al interponer el recurso que proceda contra el acto que ponga fin al procedimiento». Ese es el único acto que nombra. La propuesta de resolución, el acuerdo que abre el período de prueba y el que amplía el plazo para resolver se dictan durante la tramitación y no ponen fin al procedimiento."
  citation: "art. 24.5 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10566-art-24
- id: m03-l03-q307
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la recusación se ajusta a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Si el superior la rechaza, puede alegarse al recurrir el acto que ponga fin al procedimiento."
  - id: b
    text:
      es: "Solo puede promoverla el órgano superior de la autoridad o el empleado que intervenga."
  - id: c
    text:
      es: "El recusado dispone de diez días para manifestar a su inmediato superior si se da en él la causa."
  - id: d
    text:
      es: "Si el recusado niega la causa, el superior resuelve en el plazo de quince días."
  explanation:
    es: "Contra lo resuelto sobre la recusación no cabe recurso, «sin perjuicio de la posibilidad de alegar la recusación al interponer el recurso que proceda contra el acto que ponga fin al procedimiento» (artículo 24.5). La recusación la promueven «los interesados», no el superior de quien interviene (artículo 24.1). El recusado se manifiesta «En el día siguiente», no en diez días (artículo 24.3). Si niega la causa, el superior resuelve «en el plazo de tres días», no en quince (artículo 24.4)."
  citation: "art. 24.5 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10566-art-13
- id: m03-l03-q308
  prompt:
    es: "De acuerdo con el artículo 13.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los titulares de los órganos administrativos podrán ser suplidos temporalmente en los supuestos de:"
  options:
  - id: a
    text:
      es: "vacante, ausencia o enfermedad, así como cuando se haya abierto contra ellos un expediente disciplinario."
  - id: b
    correct: true
    text:
      es: "vacante, ausencia o enfermedad, así como cuando se haya declarado su abstención o recusación."
  - id: c
    text:
      es: "vacante o ausencia, así como cuando se haya declarado su abstención o recusación, no por enfermedad."
  - id: d
    text:
      es: "ausencia o enfermedad, así como cuando se haya declarado su abstención o recusación, no por vacante."
  explanation:
    es: "El artículo 13.1 permite la suplencia temporal «en los supuestos de vacante, ausencia o enfermedad, así como en los casos en que haya sido declarada su abstención o recusación». Un procedimiento disciplinario no es un supuesto del artículo. Las otras dos opciones quitan la enfermedad o la vacante, que el artículo lista junto con la ausencia."
  citation: "art. 13.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-13
- id: m03-l03-q309
  prompt:
    es: "Conforme al artículo 13.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la suplencia no implica alteración de la competencia y, para su validez:"
  options:
  - id: a
    text:
      es: "es necesaria su publicación en el boletín oficial correspondiente."
  - id: b
    text:
      es: "es necesaria su comunicación al órgano superior."
  - id: c
    text:
      es: "es necesaria su inscripción en un registro oficial."
  - id: d
    correct: true
    text:
      es: "no es necesaria su publicación en diario oficial alguno."
  explanation:
    es: "El artículo 13.2 dice que la suplencia «no implicará alteración de la competencia y para su validez no será necesaria su publicación». Ni la publicación ni la comunicación al superior ni la inscripción en un registro son requisitos de validez en ese apartado."
  citation: "art. 13.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q310
  prompt:
    es: "Según el artículo 30.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿desde cuándo corre el plazo de prescripción de una infracción continuada o permanente?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el momento en que finalizó la conducta infractora."
  - id: b
    text:
      es: "Desde el día en que se cometió la primera acción."
  - id: c
    text:
      es: "Desde que la Administración tuvo conocimiento de la infracción."
  - id: d
    text:
      es: "Desde que sea ejecutable la resolución sancionadora."
  explanation:
    es: "El artículo 30.2 fija la regla general («desde el día en que la infracción se hubiera cometido») y, para las continuadas o permanentes, dice que el plazo «comenzará a correr desde que finalizó la conducta infractora». Contar desde el día de la comisión es la regla general y no vale para estas infracciones. El conocimiento de la Administración no cuenta en el artículo. La ejecutabilidad de la resolución es el inicio de la prescripción de las sanciones (art. 30.3)."
  citation: "art. 30.2 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l03-q311
  prompt:
    es: "Conforme al artículo 30.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el plazo de prescripción de las sanciones comienza a contarse:"
  options:
  - id: a
    text:
      es: "desde el día en que se cometió la infracción, o desde que cesó si esta fue continuada o permanente."
  - id: b
    text:
      es: "desde el día siguiente a aquel en que se dicta la resolución que impone la sanción al infractor."
  - id: c
    correct: true
    text:
      es: "desde el día siguiente a aquel en que sea ejecutable la resolución que la impone o haya transcurrido el plazo para recurrirla."
  - id: d
    text:
      es: "desde el día siguiente a aquel en que se inicia, con conocimiento del interesado, el procedimiento de ejecución."
  explanation:
    es: "El artículo 30.3 hace empezar el plazo «desde el día siguiente a aquel en que sea ejecutable la resolución por la que se impone la sanción o haya transcurrido el plazo para recurrirla». Contar desde la comisión de la infracción es la regla del artículo 30.2, para las infracciones. Desde que se dicta la resolución no basta: tiene que ser ejecutable. El inicio del procedimiento de ejecución interrumpe la prescripción y no la hace empezar."
  citation: "art. 30.3 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-95
- id: m03-l03-q312
  prompt:
    es: "Según el artículo 95.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si tras la caducidad cabe iniciar un nuevo procedimiento por no haber prescrito, podrán incorporarse a él:"
  options:
  - id: a
    correct: true
    text:
      es: "los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad."
  - id: b
    text:
      es: "todos los actos y trámites del procedimiento caducado, sin excepción alguna."
  - id: c
    text:
      es: "solo los actos de iniciación y los informes preceptivos que ya se hubieran emitido en aquel."
  - id: d
    text:
      es: "los actos y trámites que el interesado acepte expresamente conservar en el nuevo procedimiento."
  explanation:
    es: "El artículo 95.3 permite incorporar al nuevo procedimiento «los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad». No se incorporan todos sin excepción, ni solo los de iniciación y los informes. La aceptación del interesado no es condición del artículo."
  citation: "art. 95.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-95
- id: m03-l03-q313
  prompt:
    es: "¿Qué trámites deben cumplimentarse en todo caso en el nuevo procedimiento que se inicia por la misma infracción tras la caducidad del anterior?"
  options:
  - id: a
    text:
      es: "Los de alegaciones, informe del servicio jurídico y audiencia al interesado."
  - id: b
    text:
      es: "Los de información pública, proposición de prueba y audiencia al interesado."
  - id: c
    correct: true
    text:
      es: "Los de alegaciones, proposición de prueba y audiencia al interesado."
  - id: d
    text:
      es: "Los de alegaciones, proposición de prueba y propuesta de resolución."
  explanation:
    es: "El artículo 95.3 dice que en el nuevo procedimiento «deberán cumplimentarse los trámites de alegaciones, proposición de prueba y audiencia al interesado». Cada una de las otras opciones cambia un trámite: el informe del servicio jurídico, la información pública o la propuesta de resolución no figuran en esa lista."
  citation: "art. 95.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-96
- id: m03-l03-q314
  prompt:
    es: "Según el artículo 96.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos sancionadores cabe la tramitación simplificada si hay elementos suficientes para calificar la infracción como:"
  options:
  - id: a
    text:
      es: "leve, siempre que el interesado consienta expresamente."
  - id: b
    text:
      es: "grave, sin que quepa la oposición expresa del interesado."
  - id: c
    text:
      es: "leve o grave, salvo que el interesado se oponga a ella."
  - id: d
    correct: true
    text:
      es: "leve, sin que quepa la oposición expresa del interesado."
  explanation:
    es: "El artículo 96.5 permite la tramitación simplificada en los procedimientos sancionadores cuando haya elementos para calificar la infracción «como leve, sin que quepa la oposición expresa por parte del interesado». No se exige su consentimiento, no vale para infracciones graves y la oposición expresa del apartado 2 no se aplica aquí."
  citation: "art. 96.5 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-96
- id: m03-l03-q315
  prompt:
    es: "Según el artículo 96.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento sancionador, ¿quién valora si la infracción es leve para adoptar la tramitación simplificada?"
  options:
  - id: a
    text:
      es: "El instructor, tras la notificación del acuerdo de iniciación."
  - id: b
    correct: true
    text:
      es: "El órgano competente para iniciar el procedimiento."
  - id: c
    text:
      es: "El órgano competente para resolver."
  - id: d
    text:
      es: "El interesado, mediante solicitud dirigida al órgano instructor."
  explanation:
    es: "El artículo 96.5 atribuye esa valoración al «órgano competente para iniciar el procedimiento». El instructor y el órgano que resuelve no figuran en el apartado. El interesado puede solicitar la tramitación simplificada en el procedimiento común (art. 96.3), pero no es quien aprecia la calificación de la infracción como leve."
  citation: "art. 96.5 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q316
  prompt:
    es: "En la revisión de oficio, según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano competente puede inadmitir a trámite, motivadamente y sin recabar dictamen, la solicitud que:"
  options:
  - id: a
    correct: true
    text:
      es: "carezca de manera manifiesta de fundamento."
  - id: b
    text:
      es: "se presente pasados cuatro años desde que se dictó el acto."
  - id: c
    text:
      es: "no vaya acompañada de informe de la Abogacía del Estado."
  - id: d
    text:
      es: "repita otra desestimada solo por motivos de forma."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite, sin dictamen, las solicitudes que «carezcan manifiestamente de fundamento», que no se basen en una causa del artículo 47.1 o que repitan otras «desestimadas en cuanto al fondo». Pasados cuatro años no es causa: el artículo 106.1 admite la revisión de nulidad «en cualquier momento». El informe de la Abogacía del Estado no es un requisito: el órgano consultivo que interviene es el Consejo de Estado o el equivalente autonómico, según los apartados 1 y 3. La desestimación anterior debe ser «en cuanto al fondo»: si fue por motivos de forma, no hay una solicitud sustancialmente igual ya resuelta."
  citation: "art. 106.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q317
  prompt:
    es: "Se pide la revisión de oficio de un acto y otra solicitud sustancialmente igual ya se desestimó en cuanto al fondo. Según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, el órgano competente puede:"
  options:
  - id: a
    text:
      es: "declarar la nulidad del acto, sin recabar dictamen del Consejo de Estado."
  - id: b
    text:
      es: "inadmitir la solicitud sin motivar, por tratarse de una petición repetida."
  - id: c
    correct: true
    text:
      es: "acordar motivadamente la inadmisión a trámite, sin recabar dictamen del Consejo de Estado."
  - id: d
    text:
      es: "inadmitir la solicitud solo previo dictamen favorable del Consejo de Estado."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite «motivadamente» y «sin necesidad de recabar Dictamen» cuando se hubieran desestimado en cuanto al fondo otras solicitudes sustancialmente iguales. Declarar la nulidad exige dictamen favorable (art. 106.1). La inadmisión tiene que ser motivada, y el dictamen no es previo a ella."
  citation: "art. 106.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1998-16718-art-6
- id: m03-l03-q318
  prompt:
    es: "Según el artículo 6 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cuál de los siguientes órganos integra el orden jurisdiccional contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Los Tribunales Económico-Administrativos Regionales del Estado."
  - id: b
    correct: true
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: c
    text:
      es: "Los Juzgados de lo Social de cada provincia."
  - id: d
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  explanation:
    es: "El artículo 6 integra en el orden contencioso-administrativo los Juzgados de lo Contencioso-administrativo, los Juzgados Centrales, las Salas de los Tribunales Superiores de Justicia, la Sala de la Audiencia Nacional y la del Tribunal Supremo. Los Tribunales Económico-Administrativos son órganos administrativos, y los Juzgados de lo Social y la Sala de lo Penal son de otros órdenes o salas."
  citation: "art. 6 LJCA"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-128
- id: m03-l03-q319
  prompt:
    es: "Conforme al artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, durante el mes de agosto el plazo para interponer el recurso contencioso-administrativo:"
  options:
  - id: a
    text:
      es: "corre con normalidad, pues agosto es hábil en toda la jurisdicción contencioso-administrativa."
  - id: b
    text:
      es: "queda suspendido solo para las partes que lo soliciten al órgano jurisdiccional."
  - id: c
    text:
      es: "no corre en ningún procedimiento de la Ley, tampoco en el de protección de derechos fundamentales."
  - id: d
    correct: true
    text:
      es: "no corre, salvo en el procedimiento para la protección de los derechos fundamentales."
  explanation:
    es: "El artículo 128.2 dice que en agosto «no correrá el plazo para interponer el recurso contencioso-administrativo ni ningún otro plazo» de la Ley, salvo en el procedimiento para la protección de los derechos fundamentales. Agosto no es hábil con carácter general, la suspensión no depende de que las partes la pidan y la excepción de los derechos fundamentales existe."
  citation: "art. 128.2 LJCA"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1998-16718-art-128
- id: m03-l03-q320
  prompt:
    es: "Según el artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en el procedimiento para la protección de los derechos fundamentales el mes de agosto tiene carácter:"
  options:
  - id: a
    correct: true
    text:
      es: "hábil, de manera que en él corren los plazos."
  - id: b
    text:
      es: "inhábil, como en el resto de procedimientos."
  - id: c
    text:
      es: "hábil solo para presentar el recurso, no para otros plazos."
  - id: d
    text:
      es: "inhábil, salvo que el órgano lo habilite por urgencia."
  explanation:
    es: "El artículo 128.2 excluye ese procedimiento de la regla de agosto: «el mes de agosto tendrá carácter de hábil». Por tanto no es inhábil, ni lo es salvo habilitación, y no es hábil solo para el recurso: lo es para todos sus plazos."
  citation: "art. 128.2 LJCA"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1985-12666-art-185
- id: m03-l03-q321
  prompt:
    es: "De acuerdo con el artículo 185.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿con arreglo a qué se computan los plazos procesales?"
  options:
  - id: a
    text:
      es: "Con arreglo a lo dispuesto en la Ley de Procedimiento Administrativo Común."
  - id: b
    text:
      es: "Con arreglo a lo dispuesto en la Ley de la Jurisdicción Contencioso-administrativa."
  - id: c
    correct: true
    text:
      es: "Con arreglo a lo dispuesto en el Código Civil."
  - id: d
    text:
      es: "Con arreglo a lo dispuesto en la Ley de Enjuiciamiento Civil."
  explanation:
    es: "El artículo 185.1 dice que «los plazos procesales se computarán con arreglo a lo dispuesto en el Código Civil». Las otras tres son leyes procesales o de procedimiento, pero el artículo remite al Código Civil."
  citation: "art. 185.1 LOPJ"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1889-4763-art-5
- id: m03-l03-q322
  prompt:
    es: "Según el artículo 5.1 del Código Civil, cuando un plazo fijado por meses vence en un mes que no tiene día equivalente al inicial del cómputo, el plazo expira:"
  options:
  - id: a
    text:
      es: "el primer día del mes siguiente."
  - id: b
    correct: true
    text:
      es: "el último día del mes de vencimiento."
  - id: c
    text:
      es: "el penúltimo día del mes."
  - id: d
    text:
      es: "el último día hábil del mes anterior."
  explanation:
    es: "El artículo 5.1 fija que «cuando en el mes del vencimiento no hubiera día equivalente al inicial del cómputo, se entenderá que el plazo expira el último del mes». No pasa al mes siguiente, no se detiene en el penúltimo día y no retrocede al mes anterior."
  citation: "art. 5.1 Código Civil"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q323
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la norma reguladora de un procedimiento sancionador iniciado de oficio no fije el plazo máximo, este será:"
  options:
  - id: a
    text:
      es: "de dos meses, contados desde que el acuerdo de iniciación se notifique al presunto responsable."
  - id: b
    text:
      es: "de un mes, contado desde la fecha de la propuesta de resolución."
  - id: c
    correct: true
    text:
      es: "de tres meses, contados desde la fecha del acuerdo de iniciación."
  - id: d
    text:
      es: "de tres meses, contados desde que concluya la instrucción del procedimiento."
  explanation:
    es: "El artículo 21.3 fija tres meses cuando la norma reguladora no señala plazo, y en los procedimientos iniciados de oficio se cuentan «desde la fecha del acuerdo de iniciación». Contar desde la notificación del acuerdo, desde la propuesta de resolución o desde el fin de la instrucción no es el inicio que marca el artículo, y dos meses o un mes no son el plazo supletorio."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q325
  prompt:
    es: "Salvo que una ley o el Derecho de la Unión Europea dispongan otro cómputo, ¿cómo se cuentan en el procedimiento administrativo común los plazos señalados por horas?"
  options:
  - id: a
    text:
      es: "Por horas completas, desde las cero horas del día hábil siguiente a la notificación del acto."
  - id: b
    correct: true
    text:
      es: "De hora en hora y de minuto en minuto, desde la hora y minuto de la notificación o publicación del acto."
  - id: c
    text:
      es: "De hora en hora, incluidas las de sábados, domingos y festivos posteriores a la notificación."
  - id: d
    text:
      es: "Por jornadas laborales de ocho horas, desde el primer día hábil posterior a la publicación."
  explanation:
    es: "El artículo 30.1 manda contar los plazos por horas «de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación», y solo son hábiles las horas de un día hábil. Empezar a las cero horas del día siguiente, contar las horas de días inhábiles o medir por jornadas de ocho horas no es lo que el artículo establece."
  citation: "art. 30.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m03-l03-q326
  prompt:
    es: "De acuerdo con el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos de naturaleza sancionadora se inician:"
  options:
  - id: a
    correct: true
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo de órganos distintos."
  - id: b
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo del mismo órgano."
  - id: c
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y quien denuncia los hechos adquiere por ello la condición de interesado."
  - id: d
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y el denunciante que participó en la infracción queda exento de la multa en todo caso."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente» y que la fase instructora y la sancionadora «se encomendará a órganos distintos». Reunir las dos fases en el mismo órgano contradice esa separación. Que quien denuncia los hechos adquiera la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el denunciante que participó en la infracción quede exento de la multa en todo caso contradice el artículo 62.4, que lo condiciona: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-63
- id: m03-l03-q327
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el procedimiento sancionador es correcta según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La presentación de una denuncia confiere por sí sola la condición de interesado en el procedimiento."
  - id: b
    text:
      es: "La fase instructora y la sancionadora pueden encomendarse al mismo órgano."
  - id: c
    correct: true
    text:
      es: "El procedimiento sancionador se inicia siempre de oficio, por acuerdo del órgano competente."
  - id: d
    text:
      es: "El denunciante que participó en la infracción queda siempre exento de la multa que le correspondería."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente». Que una denuncia confiera por sí sola la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el mismo órgano pueda llevar la fase instructora y la sancionadora contradice el artículo 63.1, que las separa y dice que se «encomendará a órganos distintos». Que el denunciante que participó en la infracción quede siempre exento de la multa contradice el artículo 62.4, que condiciona la exención: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
