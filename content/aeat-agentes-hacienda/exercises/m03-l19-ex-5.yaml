# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0093
  prompt:
    es: "Alba Ríos, abogada, adquiere en 2026 un automóvil de turismo por 30.000 euros más 6.300 euros de IVA para su despacho y no acredita un grado de utilización distinto del presumido. Según el artículo 95.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué cuota puede deducir?"
  options:
  - id: a
    text:
      es: "6.300 euros, que es la totalidad de la cuota soportada."
  - id: b
    text:
      es: "Ninguna cantidad, porque un turismo no es un bien de inversión."
  - id: c
    correct: true
    text:
      es: "3.150 euros, que es el 50 por 100 de la cuota soportada."
  - id: d
    text:
      es: "1.575 euros, que es el 25 por 100 de la cuota soportada."
  explanation:
    es: "Los turismos se presumen afectados en el 50 por 100: 6.300 x 50 % = 3.150 euros. El 100 por 100 corresponde a los supuestos del segundo párrafo, que no se dan aquí, y no existe una presunción del 25 por 100. El turismo es un bien de inversión (art. 95.Tres)."
  citation: "art. 95.Tres.2.ª LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "vehículos"
  - "cómputo"
# anchor: boe-a-1992-28740-art-95
