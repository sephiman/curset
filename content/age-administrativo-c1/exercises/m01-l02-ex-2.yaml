# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q016
  prompt:
    es: "Conforme al artículo 62 de la Constitución Española de 1978, en relación con las leyes aprobadas por las Cortes Generales, corresponde al Rey:"
  options:
  - id: a
    text:
      es: "Aprobar y sancionar las leyes."
  - id: b
    text:
      es: "Promulgar las leyes que sancionen las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Sancionar y promulgar las leyes."
  - id: d
    text:
      es: "Sancionar las leyes y refrendar su publicación."
  explanation:
    es: "El artículo 62.a atribuye al Rey «sancionar y promulgar las leyes». Aprobar las leyes no es función del Rey: las aprueban las Cortes Generales. La sanción es del Rey, no de las Cortes. El Rey no refrenda: sus actos son los que se refrendan (art. 64.1)."
  citation: "art. 62.a CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-91
- id: m01-l02-q017
  prompt:
    es: "Según el artículo 91 de la Constitución Española de 1978, ¿en qué plazo sancionará el Rey las leyes aprobadas por las Cortes Generales?"
  options:
  - id: a
    text:
      es: "En el plazo de diez días."
  - id: b
    correct: true
    text:
      es: "En el plazo de quince días."
  - id: c
    text:
      es: "En el plazo de veinte días naturales."
  - id: d
    text:
      es: "En el plazo de un mes."
  explanation:
    es: "El artículo 91 dice: «El Rey sancionará en el plazo de quince días las leyes aprobadas por las Cortes Generales». Diez días y un mes no son el plazo de la sanción. Veinte días naturales es el plazo del Senado para vetar o enmendar los proyectos urgentes (art. 90.3)."
  citation: "art. 91 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q018
  prompt:
    es: "¿Cuál de las siguientes funciones relativas a las Cortes Generales corresponde al Rey según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Presidir las Cortes Generales cuando se reúnan en sesión conjunta."
  - id: b
    text:
      es: "Aprobar el Reglamento de las Cortes Generales a propuesta de las Mesas."
  - id: c
    correct: true
    text:
      es: "Convocar y disolver las Cortes Generales y convocar elecciones en los términos previstos en la Constitución."
  - id: d
    text:
      es: "Convocar elecciones cuando lo estime oportuno, sin intervención de otro órgano."
  explanation:
    es: "El artículo 62.b atribuye al Rey «convocar y disolver las Cortes Generales y convocar elecciones en los términos previstos en la Constitución». El Rey no preside las Cortes ni aprueba sus reglamentos. Tampoco convoca elecciones a su criterio: lo hace «en los términos previstos en la Constitución»."
  citation: "art. 62.b CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q019
  prompt:
    es: "De acuerdo con el artículo 62 de la Constitución Española de 1978, corresponde al Rey convocar a referéndum:"
  options:
  - id: a
    text:
      es: "En los casos que acuerde el Consejo de Ministros."
  - id: b
    text:
      es: "Cuando lo considere oportuno, oído el Gobierno."
  - id: c
    text:
      es: "En los casos que acuerden las Cortes Generales por mayoría absoluta."
  - id: d
    correct: true
    text:
      es: "En los casos previstos en la Constitución."
  explanation:
    es: "El artículo 62.c atribuye al Rey «convocar a referéndum en los casos previstos en la Constitución». Los casos no los fija el Consejo de Ministros, ni el Rey a su criterio, ni las Cortes por mayoría absoluta."
  citation: "art. 62.c CE"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-92
- id: m01-l02-q020
  prompt:
    es: "De acuerdo con el artículo 92.2 de la Constitución Española de 1978, el referéndum consultivo será convocado por el Rey:"
  options:
  - id: a
    text:
      es: "Mediante propuesta del Presidente del Gobierno, previamente autorizada por las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados."
  - id: c
    text:
      es: "Mediante propuesta del Congreso de los Diputados, previamente autorizada por el Senado."
  - id: d
    text:
      es: "Mediante propuesta del Consejo de Ministros, sin necesidad de autorización parlamentaria."
  explanation:
    es: "El artículo 92.2 dice: «El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados». La autorización es del Congreso, no de las Cortes Generales ni del Senado. La propuesta es del Presidente del Gobierno, y sí necesita autorización."
  citation: "art. 92.2 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q021
  prompt:
    es: "En relación con el Presidente del Gobierno, ¿cuál de las siguientes funciones atribuye al Rey la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Elegir libremente al candidato y nombrarlo sin intervención del Congreso de los Diputados."
  - id: b
    text:
      es: "Proponer el candidato que le presente el Consejo de Ministros saliente."
  - id: c
    correct: true
    text:
      es: "Proponer el candidato y, en su caso, nombrarlo, así como poner fin a sus funciones en los términos previstos en la Constitución."
  - id: d
    text:
      es: "Destituirlo cuando pierda la confianza del Rey, con el refrendo del Presidente del Congreso."
  explanation:
    es: "El artículo 62.d atribuye al Rey «proponer el candidato a Presidente del Gobierno y, en su caso, nombrarlo, así como poner fin a sus funciones en los términos previstos en la Constitución». El nombramiento exige la confianza del Congreso (art. 99.3), así que no es libre. La propuesta no viene del Consejo de Ministros saliente. El Rey no destituye al Presidente por perder su confianza: pone fin a sus funciones en los términos de la Constitución."
  citation: "art. 62.d CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-100
- id: m01-l02-q022
  prompt:
    es: "¿A propuesta de quién nombra y separa el Rey a los demás miembros del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "A propuesta del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Congreso de los Diputados."
  - id: c
    text:
      es: "A propuesta del Consejo de Ministros."
  - id: d
    text:
      es: "A propuesta del Presidente, previa autorización del Congreso."
  explanation:
    es: "El artículo 100 dice: «Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente». El artículo 62.e lo repite. No proponen el Congreso ni el Consejo de Ministros, y el texto no exige autorización del Congreso."
  citation: "art. 100 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q023
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los decretos acordados en el Consejo de Ministros es correcta, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Rey aprueba los decretos acordados en el Consejo de Ministros."
  - id: b
    text:
      es: "El Rey sanciona y promulga los decretos acordados en el Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "El Rey expide los decretos acordados en el Consejo de Ministros."
  - id: d
    text:
      es: "El Rey delibera y aprueba los decretos en el Consejo de Ministros cuando lo preside."
  explanation:
    es: "El artículo 62.f atribuye al Rey «expedir los decretos acordados en el Consejo de Ministros». Los decretos los acuerda el Consejo de Ministros, no el Rey. Sancionar y promulgar es lo que hace el Rey con las leyes (art. 62.a). Cuando preside el Consejo, lo hace a efectos de ser informado (art. 62.g), no para aprobar decretos."
  citation: "art. 62.f CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q024
  prompt:
    es: "Según el artículo 62 de la Constitución Española de 1978, ¿cuándo preside el Rey las sesiones del Consejo de Ministros?"
  options:
  - id: a
    text:
      es: "Siempre que lo estime oportuno, sin necesidad de petición alguna."
  - id: b
    correct: true
    text:
      es: "Cuando lo estime oportuno, a petición del Presidente del Gobierno."
  - id: c
    text:
      es: "Cuando lo solicite la mayoría de los miembros del Gobierno."
  - id: d
    text:
      es: "Una vez al mes, a efectos de ser informado de los asuntos de Estado."
  explanation:
    es: "El artículo 62.g dice que el Rey preside las sesiones del Consejo de Ministros «cuando lo estime oportuno, a petición del Presidente del Gobierno». Hace falta la petición del Presidente, no basta la voluntad del Rey. La petición no es de la mayoría del Gobierno. El texto no fija ninguna periodicidad."
  citation: "art. 62.g CE"
  difficulty: 2
  tags:
  - "competencia"
  - "requisito"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q025
  prompt:
    es: "Cuando el Rey preside, a petición del Presidente del Gobierno, las sesiones del Consejo de Ministros, lo hace:"
  options:
  - id: a
    text:
      es: "A efectos de dirigir la política interior y exterior."
  - id: b
    text:
      es: "Con voto de calidad en caso de empate."
  - id: c
    text:
      es: "A efectos de aprobar los decretos que deba expedir."
  - id: d
    correct: true
    text:
      es: "A efectos de ser informado de los asuntos de Estado."
  explanation:
    es: "El artículo 62.g atribuye al Rey «ser informado de los asuntos de Estado y presidir, a estos efectos, las sesiones del Consejo de Ministros». Dirigir la política interior y exterior es función del Gobierno, no del Rey. El texto no le da voto. Los decretos los acuerda el Consejo de Ministros y el Rey los expide (art. 62.f)."
  citation: "art. 62.g CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q026
  prompt:
    es: "¿A quién atribuye la Constitución Española de 1978 el mando supremo de las Fuerzas Armadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Rey, como Jefe del Estado."
  - id: b
    text:
      es: "Al Presidente del Gobierno, que dirige la defensa del Estado."
  - id: c
    text:
      es: "Al Ministro de Defensa, bajo la dirección del Gobierno."
  - id: d
    text:
      es: "Al Jefe de Estado Mayor de la Defensa."
  explanation:
    es: "El artículo 62.h atribuye al Rey «el mando supremo de las Fuerzas Armadas». El Presidente del Gobierno, el Ministro de Defensa y el Jefe de Estado Mayor de la Defensa no tienen el mando supremo en la Constitución."
  citation: "art. 62.h CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q028
  prompt:
    es: "¿Qué función relativa a las Reales Academias atribuye al Rey la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El nombramiento de los directores de las Reales Academias."
  - id: b
    text:
      es: "La aprobación de los estatutos de las Reales Academias."
  - id: c
    correct: true
    text:
      es: "El Alto Patronazgo de las Reales Academias."
  - id: d
    text:
      es: "La presidencia efectiva de las sesiones de las Reales Academias."
  explanation:
    es: "El artículo 62.j atribuye al Rey «el Alto Patronazgo de las Reales Academias». La Constitución no le da el nombramiento de sus directores, la aprobación de sus estatutos ni la presidencia de sus sesiones."
  citation: "art. 62.j CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-63
- id: m01-l02-q030
  prompt:
    es: "Conforme al artículo 63.3 de la Constitución Española de 1978, declarar la guerra y hacer la paz:"
  options:
  - id: a
    correct: true
    text:
      es: "Corresponde al Rey, previa autorización de las Cortes Generales."
  - id: b
    text:
      es: "Corresponde al Gobierno, previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Corresponde al Rey, a propuesta del Consejo de Ministros y sin autorización parlamentaria."
  - id: d
    text:
      es: "Corresponde a las Cortes Generales, en sesión conjunta, a propuesta del Rey."
  explanation:
    es: "El artículo 63.3 dice: «Al Rey corresponde, previa autorización de las Cortes Generales, declarar la guerra y hacer la paz». No corresponde al Gobierno ni a las Cortes: estas autorizan. La autorización parlamentaria es obligatoria, y es de las Cortes Generales, no del Congreso solo."
  citation: "art. 63.3 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-90
- id: m01-l02-q031
  prompt:
    es: "De acuerdo con el artículo 90.2 de la Constitución Española de 1978, un proyecto de ley vetado por el Senado no podrá ser sometido al Rey para sanción sin que:"
  options:
  - id: a
    correct: true
    text:
      es: "El Congreso ratifique el texto inicial."
  - id: b
    text:
      es: "El Senado retire el veto en un nuevo mensaje motivado."
  - id: c
    text:
      es: "El Gobierno ratifique el texto inicial en Consejo de Ministros."
  - id: d
    text:
      es: "Las Cortes Generales ratifiquen el texto en sesión conjunta."
  explanation:
    es: "El artículo 90.2 dice que el proyecto no podrá ser sometido al Rey para sanción «sin que el Congreso ratifique por mayoría absoluta, en caso de veto, el texto inicial». El Senado es quien opone el veto mediante mensaje motivado, y el artículo condiciona el paso al Rey a lo que haga el Congreso, no a un segundo mensaje del Senado. El Gobierno y las Cortes Generales reunidas no aparecen como sujeto de la ratificación: la frase atribuye la decisión a una sola Cámara, la que aprobó el proyecto."
  citation: "art. 90.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-99
- id: m01-l02-q032
  prompt:
    es: "Según el artículo 99.1 de la Constitución Española de 1978, después de cada renovación del Congreso, el Rey propondrá un candidato a la Presidencia del Gobierno:"
  options:
  - id: a
    correct: true
    text:
      es: "Previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, y a través del Presidente del Congreso."
  - id: b
    text:
      es: "Previa consulta con los Presidentes del Congreso y del Senado, y a través del Presidente del Congreso."
  - id: c
    text:
      es: "Previa consulta con los representantes de los Grupos políticos, y a través del Presidente del Gobierno saliente."
  - id: d
    text:
      es: "Previa consulta con el Consejo de Estado, y a través del Presidente del Congreso de los Diputados."
  explanation:
    es: "El artículo 99.1 dice que el Rey propone el candidato «previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, y a través del Presidente del Congreso». Los consultados no son los Presidentes de las Cámaras ni el Consejo de Estado. La propuesta no se hace a través del Presidente del Gobierno saliente."
  citation: "art. 99.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-99
- id: m01-l02-q033
  prompt:
    es: "Según el artículo 99.5 de la Constitución Española de 1978, ¿qué ocurre si, pasados dos meses desde la primera votación de investidura, ningún candidato ha obtenido la confianza del Congreso?"
  options:
  - id: a
    text:
      es: "El Rey disuelve el Congreso y convoca nuevas elecciones con el refrendo del Presidente del Gobierno en funciones."
  - id: b
    text:
      es: "El Rey nombra Presidente del Gobierno al candidato que haya obtenido más votos."
  - id: c
    correct: true
    text:
      es: "El Rey disuelve ambas Cámaras y convoca nuevas elecciones con el refrendo del Presidente del Congreso."
  - id: d
    text:
      es: "El Rey disuelve ambas Cámaras con el refrendo del Presidente del Senado."
  explanation:
    es: "El artículo 99.5 dice que, pasados dos meses desde la primera votación de investidura sin confianza para ningún candidato, «el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso». Disolver solo el Congreso contradice «ambas Cámaras». El refrendo del Presidente del Gobierno en funciones o del Presidente del Senado contradice «el Presidente del Congreso», que es quien refrenda en este caso. Nombrar al candidato más votado no encaja con el artículo 99.3, que reserva el nombramiento a quien obtiene la confianza del Congreso, y aquí ningún candidato la ha obtenido."
  citation: "art. 99.5 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-114
- id: m01-l02-q034
  prompt:
    es: "Conforme al artículo 114.2 de la Constitución Española de 1978, si el Congreso adopta una moción de censura, el candidato incluido en ella:"
  options:
  - id: a
    text:
      es: "Deberá someterse a una votación de investidura antes de ser nombrado por el Rey."
  - id: b
    correct: true
    text:
      es: "Se entenderá investido de la confianza de la Cámara, y el Rey le nombrará Presidente del Gobierno."
  - id: c
    text:
      es: "Será propuesto por el Rey al Congreso tras consultar a los Grupos políticos."
  - id: d
    text:
      es: "Será nombrado Presidente del Gobierno por el Presidente del Congreso."
  explanation:
    es: "El artículo 114.2 dice que el candidato «se entenderá investido de la confianza de la Cámara a los efectos previstos en el artículo 99. El Rey le nombrará Presidente del Gobierno». No hay una votación de investidura aparte ni una nueva ronda de consultas del Rey. El nombramiento es del Rey; el Presidente del Congreso lo refrenda (art. 64.1)."
  citation: "art. 114.2 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-115
- id: m01-l02-q035
  prompt:
    es: "De acuerdo con el artículo 115.1 de la Constitución Española de 1978, la disolución del Congreso, del Senado o de las Cortes Generales:"
  options:
  - id: a
    text:
      es: "La propone el Consejo de Ministros y la decreta el Presidente del Gobierno."
  - id: b
    text:
      es: "La propone el Presidente del Gobierno, previa autorización del Congreso, y la decreta el Rey."
  - id: c
    correct: true
    text:
      es: "La propone el Presidente del Gobierno, previa deliberación del Consejo de Ministros, y la decreta el Rey."
  - id: d
    text:
      es: "La decreta el Rey por propia iniciativa, oído el Presidente del Gobierno."
  explanation:
    es: "El artículo 115.1 dice que el Presidente del Gobierno, «previa deliberación del Consejo de Ministros, y bajo su exclusiva responsabilidad, podrá proponer la disolución», «que será decretada por el Rey». La propuesta es del Presidente, no del Consejo, y el decreto es del Rey. No hace falta autorización del Congreso. El Rey no disuelve por propia iniciativa."
  citation: "art. 115.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
