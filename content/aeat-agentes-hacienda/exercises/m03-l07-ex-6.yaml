      es: "El obligado tributario, porque la diferencia de 50.000 euros supera el 10 por ciento de la tasación."
  - id: c
    text:
      es: "La Administración tributaria, porque la diferencia de 50.000 euros no supera los 120.000 euros."
  - id: d
    text:
      es: "La Administración tributaria, porque la diferencia de 50.000 euros no supera el 10 por ciento del valor declarado."
  explanation:
    es: "La diferencia entre la tasación del perito tercero y el valor declarado es de 50.000 euros, el 25 por ciento de 200.000. Como supera el 20 por ciento del valor declarado, los gastos del tercer perito corren a cargo del obligado (art. 135.3). El umbral de 120.000 euros y el 10 por ciento son los de la elección del perito tercero (art. 135.2), no los de los gastos."
