# anchor: boe-a-2015-10566-art-59
- id: m01-l08-q096
  prompt:
    es: "¿Cuál de los siguientes órganos se crea, modifica y suprime por Real Decreto del Consejo de Ministros, según el artículo 59 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Un órgano de nivel inferior a Subdirección General."
  - id: b
    text:
      es: "Una unidad que no tiene la consideración de órgano."
  - id: c
    correct: true
    text:
      es: "Una Subdirección General."
  - id: d
    text:
      es: "Una Secretaría de Estado."
  explanation:
    es: "Las Subdirecciones Generales se crean por Real Decreto del Consejo de Ministros según el artículo 59.1. Los órganos de nivel inferior se crean por orden del Ministro según el artículo 59.2, las unidades que no son órganos mediante las relaciones de puestos de trabajo según el artículo 59.3, y el número y el ámbito de las Secretarías de Estado se fijan por Real Decreto del Presidente del Gobierno según el artículo 57.3."
  citation: "art. 59 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-59
- id: m01-l08-q097
  prompt:
    es: "Conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las unidades que no tengan la consideración de órganos se crean, modifican y suprimen:"
  options:
  - id: a
    text:
      es: "Por Real Decreto del Consejo de Ministros."
  - id: b
    text:
      es: "Por orden del Ministro respectivo."
  - id: c
    text:
      es: "Por resolución del Subsecretario del Departamento."
  - id: d
    correct: true
    text:
      es: "A través de las relaciones de puestos de trabajo."
  explanation:
    es: "El artículo 59.3 remite a las relaciones de puestos de trabajo. El Real Decreto del Consejo de Ministros se reserva a Subsecretarías, Direcciones Generales y órganos similares, y la orden del Ministro, a los órganos inferiores a Subdirección General. Una resolución del Subsecretario no es el cauce que prevé el artículo."
  citation: "art. 59.3 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q098
  prompt:
    es: "Según el artículo 60.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quiénes son los jefes superiores del Departamento ministerial?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Ministros."
  - id: b
    text:
      es: "Los Secretarios de Estado."
  - id: c
    text:
      es: "Los Subsecretarios."
  - id: d
    text:
      es: "Los Secretarios generales."
  explanation:
    es: "El artículo 60.1 declara a los Ministros jefes superiores del Departamento y superiores jerárquicos directos de los Secretarios de Estado y Subsecretarios. Los Secretarios generales tienen categoría de Subsecretario, así que también están por debajo."
  citation: "art. 60.1 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q099
  prompt:
    es: "Conforme al artículo 60.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los órganos directivos ministeriales se ordenan jerárquicamente entre sí, de mayor a menor, de esta forma:"
  options:
  - id: a
    text:
      es: "Director general, Subsecretario y Subdirector general."
  - id: b
    text:
      es: "Subsecretario, Subdirector general y Director general."
  - id: c
    text:
      es: "Secretario de Estado, Director general y Subdirector general."
  - id: d
    correct: true
    text:
      es: "Subsecretario, Director general y Subdirector general."
  explanation:
    es: "El artículo 60.2 ordena a los órganos directivos así: Subsecretario, Director general y Subdirector general. Poner al Director general por encima del Subsecretario, o al Subdirector general por encima del Director general, invierte el orden. Empezar por el Secretario de Estado tampoco sirve: es un órgano superior y no directivo."
  citation: "art. 60.2 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
  - "órgano"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q100
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales de un Ministerio tienen categoría de:"
  options:
  - id: a
    correct: true
    text:
      es: "Subsecretario."
  - id: b
    text:
      es: "Director general."
  - id: c
    text:
      es: "Secretario de Estado."
  - id: d
    text:
      es: "Subdirector general."
  explanation:
    es: "El artículo 60.2 dice que los Secretarios generales tienen categoría de Subsecretario. La de Director general es la de los Secretarios Generales Técnicos. Un Secretario de Estado es un órgano superior, y la de Subdirector general queda por debajo."
  citation: "art. 60.2 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q101
  prompt:
    es: "De acuerdo con la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios Generales Técnicos de un Ministerio tienen categoría de:"
  options:
  - id: a
    text:
      es: "Subsecretario."
  - id: b
    text:
      es: "Subdirector general."
  - id: c
    correct: true
    text:
      es: "Director general."
  - id: d
    text:
      es: "Secretario de Estado."
  explanation:
    es: "El artículo 60.2 asigna a los Secretarios Generales Técnicos la categoría de Director general. La de Subsecretario corresponde a los Secretarios generales, la de Subdirector general queda por debajo y la de Secretario de Estado es la de un órgano superior."
  citation: "art. 60.2 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q102
  prompt:
    es: "Conforme al artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Ministros, como titulares del departamento, dirigen los sectores de actividad administrativa integrados en su Ministerio y asumen:"
  options:
  - id: a
    text:
      es: "La responsabilidad subsidiaria del Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "La responsabilidad inherente a dicha dirección."
  - id: c
    text:
      es: "La responsabilidad solidaria con los Secretarios de Estado."
  - id: d
    text:
      es: "La representación ordinaria del Ministerio."
  explanation:
    es: "El artículo 61 les atribuye la responsabilidad inherente a esa dirección. No es subsidiaria del Consejo de Ministros ni solidaria con los Secretarios de Estado. La representación ordinaria del Ministerio corresponde a los Subsecretarios según el artículo 63.1."
  citation: "art. 61 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q103
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, entre las funciones de los Ministros figura imponer la sanción de separación del servicio por faltas:"
  options:
  - id: a
    correct: true
    text:
      es: "Muy graves."
  - id: b
    text:
      es: "Graves."
  - id: c
    text:
      es: "Leves."
  - id: d
    text:
      es: "Graves o muy graves."
  explanation:
    es: "El artículo 61.s la limita a las faltas muy graves. No alcanza a las graves ni a las leves. Las faltas graves o muy graves son el ámbito disciplinario de los Subsecretarios según el artículo 63.1.ñ, pero ellos no pueden imponer la separación del servicio."
  citation: "art. 61.s LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q104
  prompt:
    es: "Conforme al artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano ministerial impone la sanción de separación del servicio por faltas muy graves?"
  options:
  - id: a
    text:
      es: "El Subsecretario del Departamento."
  - id: b
    text:
      es: "El Secretario de Estado."
  - id: c
    correct: true
    text:
      es: "El Ministro."
  - id: d
    text:
      es: "El Director general."
  explanation:
    es: "El artículo 61.s atribuye esa sanción al Ministro. El Subsecretario ejerce la potestad disciplinaria por faltas graves o muy graves, pero con la excepción expresa de la separación del servicio según el artículo 63.1.ñ. Los Secretarios de Estado y los Directores generales no la tienen atribuida."
  citation: "art. 61.s LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q105
  prompt:
    es: "De acuerdo con el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, entre las funciones de los Ministros está declarar la lesividad de los actos administrativos cuando les corresponda y también:"
  options:
  - id: a
    text:
      es: "Nombrar a los Subdelegados del Gobierno en las provincias."
  - id: b
    correct: true
    text:
      es: "Resolver los recursos administrativos."
  - id: c
    text:
      es: "Ejercer la jefatura de las Fuerzas y Cuerpos de Seguridad del Estado en la Comunidad."
  - id: d
    text:
      es: "Elevar al Gobierno un informe anual sobre los servicios públicos estatales."
  explanation:
    es: "El artículo 61.ñ une la resolución de los recursos administrativos y la declaración de lesividad. Nombrar a los Subdelegados, dirigir las Fuerzas y Cuerpos de Seguridad en la Comunidad y elevar el informe anual son competencias de los Delegados del Gobierno según el artículo 73."
  citation: "art. 61.ñ LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q106
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos ministeriales otorgan los premios y recompensas propios del Departamento?"
  options:
  - id: a
    text:
      es: "Los Subsecretarios."
  - id: b
    text:
      es: "Los Secretarios de Estado."
  - id: c
    text:
      es: "Los Secretarios generales técnicos."
  - id: d
    correct: true
    text:
      es: "Los Ministros."
  explanation:
    es: "El artículo 61.o atribuye a los Ministros otorgar los premios y recompensas propios del Departamento. Ninguna de las funciones que el texto da a Subsecretarios, Secretarios de Estado o Secretarios generales técnicos es esa."
  citation: "art. 61.o LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q107
  prompt:
    es: "Conforme al artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Ministros otorgan los premios y recompensas propios del Departamento y además:"
  options:
  - id: a
    text:
      es: "Conceden las que fije el Consejo de Ministros por Real Decreto."
  - id: b
    text:
      es: "Autorizan las que propongan los Subsecretarios."
  - id: c
    text:
      es: "Ejecutan las que les encomiende el Presidente del Gobierno."
  - id: d
    correct: true
    text:
      es: "Proponen las que correspondan según sus normas reguladoras."
  explanation:
    es: "El artículo 61.o añade que los Ministros proponen las que correspondan según sus normas reguladoras. Las otras alternativas inventan un reparto con el Consejo de Ministros, con los Subsecretarios o con el Presidente del Gobierno que el artículo no recoge."
  citation: "art. 61.o LRJSP"
  difficulty: 1
  tags:
  - "competencia"
