# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q208
  prompt:
    es: "En Access 365, se quiere usar un formulario existente como principal y que Access cree un subformulario nuevo y lo agregue. ¿Qué procedimiento recomienda la ayuda?"
  options:
  - id: a
    correct: true
    text:
      es: "El Asistente para subformularios en un formulario existente"
  - id: b
    text:
      es: "El Asistente para formularios desde la pestaña Crear"
  - id: c
    text:
      es: "Arrastrar un formulario existente hasta el principal"
  - id: d
    text:
      es: "La herramienta Formulario dividido de la pestaña Crear"
  explanation:
    es: "La ayuda lo recomienda para quien «desea usar un formulario existente como formulario principal, pero desea que Access cree un nuevo subformulario y lo agregue al formulario principal»: «Agregar uno o varios subformularios a un formulario existente con el Asistente para subformularios». «El Asistente para formularios desde la pestaña Crear» crea el principal y el subformulario a la vez. «Arrastrar un formulario existente hasta el principal» sirve cuando el subformulario también existe ya. «Formulario dividido» es otra herramienta de la pestaña Crear que no crea subformularios."
  citation: "fuente: `ms-access-subformulario.html`; «Crear o agregar un subformulario»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q209
  prompt:
    es: "En Access 365, ¿cómo se agrega a un formulario principal un formulario ya existente para que haga de subformulario, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Con el botón Subformulario en ventana nueva del grupo Herramientas"
  - id: b
    correct: true
    text:
      es: "Arrastrándolo desde el panel de navegación hasta el principal"
  - id: c
    text:
      es: "Con el Asistente para formularios, eligiendo otra tabla"
  - id: d
    text:
      es: "Cambiando la propiedad Vista predeterminada del principal"
  explanation:
    es: "La ayuda dice: «Arrastre el formulario que quiera usar como el subformulario desde el panel de navegación hasta el formulario principal». «Subformulario en ventana nueva» solo abre el subformulario en su propia ventana para cambiar su diseño. El «Asistente para formularios» crea formularios nuevos, no incorpora uno existente. «Vista predeterminada» solo fija cómo se muestra el subformulario, y no lo agrega."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un subformulario arrastrando un formulario hasta otro»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q210
  prompt:
    es: "Señale qué ocurre en Access 365 si el Asistente para formularios no muestra la pregunta ¿Cómo desea ver los datos? al elegir dos tablas:"
  options:
  - id: a
    text:
      es: "Access agrega el subformulario con los campos de vínculo en blanco"
  - id: b
    text:
      es: "Access crea el subformulario con la tabla elegida en segundo lugar"
  - id: c
    correct: true
    text:
      es: "Access no halló una relación uno a varios y no agrega subformulario"
  - id: d
    text:
      es: "El asistente se cancela y no crea ningún formulario"
  explanation:
    es: "La ayuda dice: si no se muestra esa pregunta, «quiere decir que Access no encontró una relación uno a varios entre las tablas o consultas seleccionadas. El asistente continuará, pero Access no agregará un subformulario al formulario». «Access agrega el subformulario con los campos de vínculo en blanco» y «Access crea el subformulario con la tabla elegida en segundo lugar» son falsos: no se agrega subformulario. «El asistente se cancela y no crea ningún formulario» también lo es: «El asistente continuará»."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un formulario que contenga un subformulario mediante el Asistente para formularios»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q211
  prompt:
    es: "En Access 365, al terminar el Asistente para formularios con la opción Formulario con subformularios, ¿cuántos formularios crea Access?"
  options:
  - id: a
    text:
      es: "Uno solo, con el subformulario como sección interna"
  - id: b
    text:
      es: "Tres: el principal, el subformulario y un informe resumen"
  - id: c
    text:
      es: "Uno por cada campo elegido en las dos tablas"
  - id: d
    correct: true
    text:
      es: "Dos: el principal y el propio subformulario"
  explanation:
    es: "La ayuda dice: «Access crea dos formularios: uno para el formulario principal que contiene el control del subformulario y otro para el propio subformulario». Por eso «uno solo, con el subformulario como sección interna» es falso. «Tres: el principal, el subformulario y un informe resumen» y «uno por cada campo elegido» tampoco figuran en la ayuda."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un formulario que contenga un subformulario mediante el Asistente para formularios»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q212
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta abre un subformulario en su propia ventana desde la vista Diseño del formulario principal?"
  options:
  - id: a
    text:
      es: "Diseño de formulario › Controles › Subformulario/Subinforme"
  - id: b
    correct: true
    text:
      es: "Diseño de formulario › Herramientas › Subformulario en ventana nueva"
  - id: c
    text:
      es: "Diseño de formulario › Herramientas › Orden de tabulación"
  - id: d
    text:
      es: "Inicio › Vistas › Ver › Vista Formulario"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de formulario, en el grupo Herramientas, haga clic en Subformulario en ventana nueva». «Controles › Subformulario/Subinforme» inserta un subformulario con el asistente en un formulario existente. «Herramientas › Orden de tabulación» abre el cuadro de diálogo Orden de tabulación. «Inicio › Vistas › Ver › Vista Formulario» cambia a la vista Formulario, la que se usa para comprobar el vínculo."
  citation: "fuente: `ms-access-subformulario.html`; «Abrir un subformulario en una nueva ventana de la vista Diseño»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q213
  prompt:
    es: "En Access 365, ¿cuál de los siguientes valores de la propiedad Vista predeterminada de un subformulario lo muestra como una hoja de datos en el formulario principal?"
  options:
  - id: a
    text:
      es: "Formularios continuos"
  - id: b
    text:
      es: "Un único formulario"
  - id: c
    correct: true
    text:
      es: "Hoja de datos"
  - id: d
    text:
      es: "Formulario dividido"
  explanation:
    es: "La ayuda dice: «si establece la Default View propiedad de un subformulario en Datasheet, el subformulario se muestra como una hoja de datos en el formulario principal». «Formularios continuos», «Un único formulario» y «Formulario dividido» son los otros tres valores de la lista de la propiedad (Un único formulario, Formularios continuos, Hoja de datos y Formulario dividido), y ninguno muestra una hoja de datos."
  citation: "fuente: `ms-access-subformulario.html`; «Cambiar la vista predeterminada de un subformulario»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q214
  prompt:
    es: "Señale qué propiedad debe estar establecida en Sí si Hoja de datos no aparece en la lista Vista predeterminada de un subformulario de Access 365:"
  options:
  - id: a
    text:
      es: "Permitir vista Formulario"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Objeto origen"
  - id: d
    correct: true
    text:
      es: "Permitir vista Hoja de datos"
  explanation:
    es: "La ayuda dice: «si desea especificar Hoja de datos como la vista predeterminada para el formulario, asegúrese de que la propiedad Permitir vista Hoja de datos esté establecida en Sí». «Permitir vista Formulario» corresponde a la vista Formulario, no a la de hoja de datos. «Vincular campos secundarios» y «Objeto origen» no controlan las vistas disponibles: vinculan campos y determinan el objeto mostrado."
  citation: "fuente: `ms-access-subformulario.html`; «Cambiar la vista predeterminada de un subformulario»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q215
  prompt:
    es: "En el Enlazador de campos de subformulario de Access 365, ¿cuál de los siguientes botones hace que Access intente determinar los campos vinculantes?"
  options:
  - id: a
    correct: true
    text:
      es: "Sugerir"
  - id: b
    text:
      es: "Crear"
  - id: c
    text:
      es: "Aceptar"
  - id: d
    text:
      es: "Finalizar"
  explanation:
    es: "La ayuda dice: «haga clic en Sugerir para que Access intente determinar los campos vinculantes». «Crear» es el botón junto al cuadro de propiedad Link Child Fields, que abre el cuadro de diálogo Enlazador de campos de subformulario. «Aceptar» confirma los campos elegidos en las listas Campos principales y Campos secundarios. «Finalizar» es el botón de la última página de un asistente."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un subformulario arrastrando un formulario hasta otro»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q217
  prompt:
    es: "En Access 365, ¿cuál de los siguientes nombres recibe a veces una combinación de formulario y subformulario?"
  options:
  - id: a
    text:
      es: "Formulario dividido"
  - id: b
    text:
      es: "Formulario independiente"
  - id: c
    correct: true
    text:
      es: "Formulario jerárquico"
  - id: d
    text:
      es: "Formulario en blanco"
  explanation:
    es: "La ayuda dice: «Una combinación de formulario y subformulario a veces se denomina formulario jerárquico, formulario principal/detallado o formulario primario/secundario». «Formulario dividido» es una herramienta de la pestaña Crear que muestra dos vistas conectadas. «Formulario independiente» es el que no está vinculado a un origen de datos. «Formulario en blanco» es la herramienta que abre un formulario vacío en vista Presentación. Ninguno designa la combinación."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q245
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta cambia un formulario abierto a la Vista Formulario?"
  options:
  - id: a
    text:
      es: "Herramientas de base de datos › Relaciones › Relaciones"
  - id: b
    text:
      es: "Datos externos › Exportar › Excel"
  - id: c
    correct: true
    text:
      es: "Inicio › Vistas › Ver"
  - id: d
    text:
      es: "Crear › Formularios › Formulario"
  explanation:
    es: "En el grupo Vistas de la pestaña Inicio se hace clic en Ver y se elige Vista Formulario. Crear › Formularios › Formulario crea un formulario nuevo con todos los campos del origen y lo abre en vista Presentación. Datos externos › Exportar › Excel exporta un objeto a una hoja de Excel. Herramientas de base de datos › Relaciones abre la ventana Relaciones."
  citation: "fuente: `ms-access-subformulario.html`; «Comprobar que la vinculación se haya realizado correctamente»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q026
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones indica dónde se escribe la expresión para crear un control calculado en un formulario o un informe?"
  options:
  - id: a
    text:
      es: "En un campo de la tabla de origen"
  - id: b
    text:
      es: "En un campo de la consulta de origen"
  - id: c
    correct: true
    text:
      es: "En la propiedad ControlSource del control"
  - id: d
    text:
      es: "En la propiedad Formato del control"
  explanation:
    es: "La ayuda dice: «Para crear control calculado, escriba una expresión en la ControlSource propiedad del control en lugar de en un campo de tabla o consulta». Por eso «en un campo de la tabla de origen» y «en un campo de la consulta de origen» son lo que la ayuda descarta expresamente. «En la propiedad Formato del control» no figura: Format sirve para el formato de presentación, por ejemplo Percent."
  citation: "fuente: `ms-access-expresiones.html`; «Formularios e informes»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q027
  prompt:
    es: "En Access 365, ¿cuándo están disponibles las propiedades Page y Pages para mostrar números de página en formularios o informes?"
  options:
  - id: a
    text:
      es: "Siempre, desde la hoja de propiedades del informe"
  - id: b
    text:
      es: "Solo en la vista Diseño del informe"
  - id: c
    text:
      es: "Solo cuando el informe tiene un encabezado de grupo"
  - id: d
    correct: true
    text:
      es: "Solo al imprimir o en la vista previa de impresión"
  explanation:
    es: "La ayuda dice: «Estas propiedades solo están disponibles durante la impresión o la vista previa de impresión, por lo que no aparecen en la hoja de propiedades del formulario o informe». Por eso no se ven siempre desde la hoja de propiedades y tampoco solo en la vista Diseño, que no es impresión ni vista previa. Y que dependan de un encabezado de grupo no está en la página: la sitúa en un cuadro de texto del encabezado o pie de página del informe, y las limita por el momento, la impresión o su vista previa."
  citation: "fuente: `ms-access-expresiones.html`; «Encabezados y pies de página»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q029
  prompt:
    es: "En Access 365, si uno de los controles de una expresión aritmética (+, -, * o /) es nulo, ¿qué resultado devuelve toda la expresión?"
  options:
  - id: a
    text:
      es: "Cero"
  - id: b
    correct: true
    text:
      es: "Nulo"
  - id: c
    text:
      es: "El valor del control que no es nulo"
  - id: d
    text:
      es: "Un error en tiempo de ejecución"
  explanation:
    es: "La ayuda dice: «Cuando se usa un operador aritmético (+, -, * o /) en una expresión y uno de los controles es nulo, el resultado de toda la expresión es nulo. Esto se conoce como propagación de valores nulos». Cero no es el resultado: solo se obtiene si se convierte el nulo con la función Nz. El valor del control que no es nulo contradice «el resultado de toda la expresión es nulo». Y un error en tiempo de ejecución tampoco: el resultado es un nulo, no un error."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones aritméticas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q030
  prompt:
    es: "En Access 365, ¿cuál de las siguientes funciones permite evitar la propagación de valores nulos al convertir un valor nulo en cero?"
  options:
  - id: a
    text:
      es: "Año"
  - id: b
    text:
      es: "Longitud"
  - id: c
    correct: true
    text:
      es: "Nz"
  - id: d
    text:
      es: "Suma"
  explanation:
    es: "La ayuda dice: «puede evitar la propagación de valores nulos utilizando la función Nz para convertir el valor nulo en cero. Por ejemplo, use =Nz([Subtotal])+Nz([Freight])». «Año» devuelve el año de una fecha. «Longitud» devuelve el número de caracteres de un texto. «Suma» devuelve la suma de los valores de un control; ninguna convierte nulos en cero."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones aritméticas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q031
  prompt:
    es: "En un control de un informe de Access 365 con la expresión =[Price]*1.06, ¿qué valor se muestra, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "El valor de Precio reducido en un 6 %"
  - id: b
    text:
      es: "El 6 % del valor de Precio"
  - id: c
    text:
      es: "El valor de Precio con seis decimales"
  - id: d
    correct: true
    text:
      es: "El valor de Precio más un 6 %"
  explanation:
    es: "La ayuda dice de =[Price]*1.06: «El producto del valor del campo o control Precio y 1,06 (suma un 6 % al valor Precio)». Reducirlo un 6 % es lo contrario, porque multiplicar por 1,06 aumenta. El 6 % del valor sería multiplicar por 0,06. Y los seis decimales no salen de ninguna parte de la expresión: la página la describe como un producto por 1,06, sin ninguna instrucción de formato."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones aritméticas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q032
  prompt:
    es: "En un control de un informe de Access 365, ¿qué muestra la expresión =Sum([Quantity]*[Price]), según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "La suma del producto de los valores de Cantidad y Precio"
  - id: b
    text:
      es: "El producto de la suma de Cantidad por la suma de Precio"
  - id: c
    text:
      es: "El número de registros del control Cantidad"
  - id: d
    text:
      es: "La media de los valores de Cantidad y Precio"
  explanation:
    es: "La ayuda dice de =Sum([Quantity]*[Price]): «Usa la función Suma para mostrar la suma del producto de los valores de los controles Cantidad y Precio». «El producto de la suma de Cantidad por la suma de Precio» invierte el orden de las operaciones. «El número de registros» lo muestra la función Contar, como en =Count([OrderID]). «La media» la muestra la función Prom, como en =Avg([Freight])."
  citation: "fuente: `ms-access-expresiones.html`; «Cuenta, suma y promedio de valores»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q033
  prompt:
    es: "En un control de un informe de Access 365, ¿qué muestra la expresión =[InvoiceDate] + 30, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "La fecha 30 días antes de la fecha de la factura"
  - id: b
    text:
      es: "El número 30 sumado al mes de la factura"
  - id: c
    correct: true
    text:
      es: "La fecha 30 días después de la fecha de la factura"
  - id: d
    text:
      es: "La diferencia en días respecto a la fecha actual"
  explanation:
    es: "La ayuda dice de =[InvoiceDate] + 30: «Usa operaciones aritméticas en fechas para calcular la fecha 30 días después de la fecha del campo o control FechaDeFactura». «30 días antes» sería =[InvoiceDate] - 30. «El número 30 sumado al mes» no es lo que hace la suma, que cuenta días. «La diferencia en días respecto a la fecha actual» la calcula DifFecha, no esta suma."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de fecha»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q218
  prompt:
    es: "En Access 365, ¿cuál de los siguientes propósitos tiene un informe, según la ayuda de Microsoft sobre informes?"
  options:
  - id: a
    text:
      es: "Introducir registros nuevos uno a uno"
  - id: b
    correct: true
    text:
      es: "Mostrar o distribuir un resumen de los datos"
  - id: c
    text:
      es: "Definir relaciones entre las tablas"
  - id: d
    text:
      es: "Importar datos desde una hoja de Excel"
  explanation:
    es: "La ayuda dice: un informe resulta útil para «Mostrar o distribuir un resumen de los datos», entre otros propósitos (archivar instantáneas de los datos, aportar detalles sobre un registro concreto, crear etiquetas). «Introducir registros nuevos uno a uno» no figura entre ellos: es la función de la vista Formulario, que sirve «para que pueda ver o introducir información». «Definir relaciones entre las tablas» se hace en la ventana Relaciones, y «importar datos desde una hoja de Excel» con el asistente de la pestaña Datos externos; la ayuda no los cita como propósitos de un informe."
  citation: "fuente: `ms-access-informes.html`; «¿Qué se puede hacer con un informe?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q220
  prompt:
    es: "En Access 365, si se coloca en el encabezado del informe un control calculado con la función de agregado Suma, ¿para qué conjunto de datos se calcula el resultado?"
  options:
  - id: a
    text:
      es: "Para la página actual"
  - id: b
    text:
      es: "Para el grupo de registros actual"
  - id: c
    text:
      es: "Para cada fila del origen de registros"
  - id: d
    correct: true
    text:
      es: "Para todo el informe"
  explanation:
    es: "La ayuda dice: «Cuando se coloca un control calculado que usa la función de agregado de suma en el encabezado del informe, el resultado de la suma se calcula para todo el informe». «Para el grupo de registros actual» es lo que ocurre en el encabezado de grupo: «la suma se calcula para el grupo actual». «Para la página actual» y «para cada fila del origen de registros» no se citan en la ayuda: la sección Detalle aparece una vez por cada fila, pero no es donde la ayuda ejemplifica la suma."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q221
  prompt:
    es: "En Access 365, ¿cuál de las siguientes secciones de un informe se imprime antes del encabezado de página?"
  options:
  - id: a
    correct: true
    text:
      es: "El encabezado del informe"
  - id: b
    text:
