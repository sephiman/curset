- id: m09-l02-q06
  prompt:
    en: In Java 25, the snippet computes Redis Cluster hash slots with CRC16 (XMODEM) modulo 16384 and the hash
      tag rule, then runs six checks. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: 'crc16 of 123456789: 31C3

        slot of 123456789: 12739

        {user1000}.following and {user1000}.followers share a slot: true

        foo{}{bar} is hashed as a whole key: true

        foo{{bar}}zap hashes {bar: true

        foo{bar}{zap} hashes bar: true'
  - id: b
    text:
      en: 'crc16 of 123456789: 31C3

        slot of 123456789: 12739

        {user1000}.following and {user1000}.followers share a slot: false

        foo{}{bar} is hashed as a whole key: true

        foo{{bar}}zap hashes {bar: false

        foo{bar}{zap} hashes bar: false'
  - id: c
    text:
      en: 'crc16 of 123456789: 31C3

        slot of 123456789: 12739

        {user1000}.following and {user1000}.followers share a slot: true

        foo{}{bar} is hashed as a whole key: false

        foo{{bar}}zap hashes {bar: false

        foo{bar}{zap} hashes bar: false'
  - id: d
    text:
      en: 'crc16 of 123456789: 29B1

        slot of 123456789: 10673

        {user1000}.following and {user1000}.followers share a slot: true

        foo{}{bar} is hashed as a whole key: true

        foo{{bar}}zap hashes {bar: true

        foo{bar}{zap} hashes bar: true'
  explanation:
    en: The snippet hashes only the substring between the first `{` and the first `}` when it is not empty, which
      gives the recorded output. The output with `false` on the shared slot check is wrong because both keys hash
      only `user1000`. The output with `false` for `foo{}{bar}` is wrong because the empty first pair makes the
      whole key hashed. The output starting with `29B1` is wrong because the XMODEM CRC16 of `123456789` is `31C3`.
  citation: redis-cluster-spec#hash-tags
  extract:
    en: If the key contains a "{...}" pattern only the substring between { and } is hashed in order to obtain the
      hash slot.
  snippet: m09-l02/HashSlot.java
- id: m09-l02-q07
  prompt:
    en: According to the Redis Cluster documentation, into how many hash slots is the key space divided, with the
      slot of a key computed as the CRC16 of the key modulo that number?
  options:
  - id: a
    text:
      en: '4096'
  - id: b
    text:
      en: '65536'
  - id: c
    correct: true
    text:
      en: '16384'
  - id: d
    text:
      en: '1024'
  explanation:
    en: Redis Cluster has 16384 hash slots, and the slot of a key is the CRC16 of the key modulo 16384. The numbers
      4096, 65536 and 1024 are other slot counts than the 16384 the documentation states.
  citation: redis-scaling#redis-cluster-data-sharding
  extract:
    en: There are 16384 hash slots in Redis Cluster, and to compute the hash slot for a given key, we simply take
      the CRC16 of the key modulo 16384.
- id: m09-l02-q08
  prompt:
    en: According to the Redis documentation on data sharding, what does adding a new node D to a running Redis
      Cluster require?
  options:
  - id: a
    text:
      en: Stopping all operations until every key is rehashed onto the new node
  - id: b
    text:
      en: Recomputing every key's slot with the new node count as the modulus
  - id: c
    correct: true
    text:
      en: Moving some hash slots from the existing nodes to the new node
  - id: d
    text:
      en: Waiting for `redis-cli` to rebalance the cluster automatically
  explanation:
    en: Adding node D means moving some hash slots from the existing nodes to D. Stopping all operations is wrong
      because hash slots move from one node to another while operations continue, so adding a node causes no downtime.
      Recomputing slots is wrong because the slot of a key is always the CRC16 of the key modulo 16384, whatever
      the node count. Waiting for `redis-cli` is wrong because it cannot check the distribution of keys and move
      slots by itself, so slots are moved by an explicit reshard.
  citation: redis-scaling#redis-cluster-data-sharding; redis-scaling#reshard-the-cluster
  extract:
    en: if I want to add a new node D, I need to move some hash slots from nodes A, B, C to D.
- id: m09-l02-q09
  prompt:
    en: In the Elasticsearch basic write model, when does the primary shard acknowledge the successful completion
      of an indexing request to the client?
  options:
  - id: a
    text:
      en: As soon as the primary has executed the operation locally
  - id: b
    text:
      en: Once a majority of all replica copies have responded
  - id: c
    correct: true
    text:
      en: Once all in-sync replicas have performed the operation and responded to the primary
  - id: d
    text:
      en: Once the coordinating node has forwarded the operation to the primary shard
  explanation:
    en: The primary acknowledges once all in-sync replicas have performed the operation and responded. Acknowledging
      after the local execution is wrong because the primary stage does not complete until the in-sync replicas
      have finished indexing. A majority of replicas is wrong because the primary has to replicate all operations
      to each copy in the in-sync set. Acknowledging after forwarding is wrong because the coordinating stage is
      not complete until each primary stage has completed.
  citation: es-reading-and-writing-documents#basic-write-model
- id: m09-l02-q11
  prompt:
    en: In PostgreSQL synchronous replication, which of these operations must wait for confirmation from the synchronous
      standby before it completes?
  options:
  - id: a
    text:
      en: A read-only transaction
  - id: b
    text:
      en: The commit of a subtransaction
  - id: c
    correct: true
    text:
      en: The commit of a top-level write transaction
  - id: d
    text:
      en: Each statement of a long data load, before its final commit
  explanation:
    en: The commit of a top-level write transaction waits until the commit is written to the write-ahead log of
      both the primary and the standby. A read-only transaction is wrong because read-only transactions need not
      wait for replies from standby servers. A subtransaction commit is wrong because subtransaction commits do
      not wait, only top-level commits. A data load statement is wrong because long running actions do not wait
      until the very final commit message.
  citation: pg-warm-standby#SYNCHRONOUS-REPLICATION
  extract:
    en: each commit of a write transaction will wait until confirmation is received that the commit has been written
      to the write-ahead log on disk of both the primary and standby server
- id: m09-l02-q12
  prompt:
    en: According to the Redis replication documentation, which statement about full resynchronization between a
      master and a replica is correct?
  options:
  - id: a
    correct: true
    text:
      en: It happens when the master has not enough backlog in its buffers, or the replica refers to a replication
        ID the master no longer knows
  - id: b
    text:
      en: It happens at every reconnection, because the replica always asks for a copy of the dataset
  - id: c
    text:
      en: It uses the `SYNC` command, which newer Redis instances prefer over `PSYNC`
  - id: d
    text:
      en: It makes the master run a separate background save for each replica that requests it
  explanation:
    en: A full resynchronization happens when the master lacks enough backlog or the replica refers to an unknown
      replication ID. Resynchronizing at every reconnection is wrong because the master can send just the incremental
      part needed. Using `SYNC` is wrong because it is an old protocol no longer used by newer Redis instances.
      A separate background save per replica is wrong because the master performs a single background save for concurrent
      requests.
  citation: redis-replication#how-redis-replication-works
  extract:
    en: However if there is not enough backlog in the master buffers, or if the replica is referring to an history
      (replication ID) which is no longer known, then a full resynchronization happens
- id: m09-l02-q14
  prompt:
    en: In Redis client-side caching, what does the server do when any client writes new data to a key that other
      clients have previously read?
  options:
  - id: a
    text:
      en: It pushes the new value to every client so that each cache is overwritten
  - id: b
    correct: true
    text:
      en: It sends an invalidation message to all clients that have accessed that key previously
  - id: c
    text:
      en: It sends an invalidation message to every connected client, whether or not it read the key
  - id: d
    text:
      en: It sends nothing, and each client keeps its cached copy until one of its connections is disconnected
  explanation:
    en: The server sends an invalidation message to all clients that have accessed the key previously. Pushing the
      new value is wrong because the message only warns that cached copies are no longer valid, and the clients
      evict the stale data. Messaging every connected client is wrong because the server tracks the set of keys
      that each client connection has read. Sending nothing is wrong because the server sends an invalidation message
      on every write to a tracked key.
  citation: redis-client-side-caching#tracking
  extract:
    en: When any client writes new data to a tracked key, the server sends an invalidation message to all clients
      that have accessed that key previously.
- id: m09-l02-q15
  prompt:
    en: In Redis, which `maxmemory-policy` returns an error when you try to execute commands that cache new data
      once the `maxmemory` limit is reached?
  options:
  - id: a
    text:
      en: '`allkeys-lru`'
  - id: b
    correct: true
    text:
      en: '`noeviction`'
  - id: c
    text:
      en: '`volatile-ttl`'
  - id: d
    text:
      en: '`allkeys-random`'
  explanation:
    en: The `noeviction` policy does not evict keys and returns an error instead. The `allkeys-lru` policy evicts
      the least recently used keys. The `volatile-ttl` policy evicts keys with the shortest remaining TTL. The `allkeys-random`
      policy evicts keys at random.
  citation: redis-eviction#eviction-policies
  extract:
    en: 'noeviction: Keys are not evicted but the server will return an error when you try to execute commands that
      cache new data.'
- id: m09-l02-q16
  prompt:
    en: In Redis LFU eviction, which default configuration describes when the frequency counter saturates and how
      often the counter is decayed?
  options:
  - id: a
    text:
      en: It saturates at around one thousand requests and decays every one minute
  - id: b
    correct: true
    text:
      en: It saturates at around one million requests and decays every one minute
  - id: c
    text:
      en: It saturates at around one million requests and decays every one hour
  - id: d
    text:
      en: It saturates at around one hundred thousand requests and decays every ten minutes
  explanation:
    en: Redis saturates the counter at around one million requests and decays it every one minute. The saturation
      points of one thousand requests and of one hundred thousand requests are other values than the one million
      that the configuration sets. A decay of one hour is wrong because the counter is decayed every one minute.
  citation: redis-eviction#lfu-eviction
  extract:
    en: Saturate the counter at, around, one million requests. Decay the counter every one minute.
