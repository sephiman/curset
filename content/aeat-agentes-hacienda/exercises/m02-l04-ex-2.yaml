# anchor: boe-a-2015-10565-art-83
- id: m02-l04-q0121
  prompt:
    es: "Conforme al artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre el anuncio del trámite de información pública:"
  options:
  - id: a
    text:
      es: "Señala el lugar de exhibición, que solo debe estar a disposición de los interesados en las dependencias del órgano que tramita el procedimiento, sin más medios de consulta."
  - id: b
    correct: true
    text:
      es: "Señala el lugar de exhibición, que debe estar a disposición de quienes lo soliciten por medios electrónicos en la sede electrónica correspondiente."
  - id: c
    text:
      es: "No señala el lugar de exhibición, porque el expediente se examina únicamente a través del Punto de Acceso General electrónico."
  - id: d
    text:
      es: "Señala el lugar de exhibición y determina un plazo de alegaciones, que puede ser inferior a veinte días si el órgano lo motiva."
  explanation:
    es: "El artículo 83.2 exige que el anuncio señale el lugar de exhibición, que debe estar a disposición por medios electrónicos en la sede electrónica, y que determine un plazo de alegaciones que en ningún caso puede ser inferior a veinte días. No se limita a las dependencias del órgano, ni omite el lugar, ni admite un plazo menor aunque se motive."
  citation: "art. 83.2 LPAC"
