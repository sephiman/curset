# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q001
  prompt:
    es: "Según la Constitución Española, ¿qué corresponde a las Cortes Generales en relación con los Presupuestos Generales del Estado?"
  options:
  - id: a
    text:
      es: "Su elaboración, examen y aprobación."
  - id: b
    text:
      es: "Su elaboración y su presentación al Congreso."
  - id: c
    text:
      es: "Su examen y aprobación, pero no su enmienda."
  - id: d
    correct: true
    text:
      es: "Su examen, enmienda y aprobación."
  explanation:
    es: "El artículo 134.1 reparte la tarea: al Gobierno, la elaboración; a las Cortes Generales, el examen, la enmienda y la aprobación. La opción que añade la elaboración a las Cortes atribuye al Parlamento lo que es del Gobierno. La opción de la presentación al Congreso les atribuye también una tarea del Gobierno, que es quien presenta el proyecto. La opción que excluye la enmienda recorta las facultades que el artículo reconoce."
  citation: "art. 134.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q002
  prompt:
    es: "Según la Constitución Española, ¿a quién corresponde la elaboración de los Presupuestos Generales del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Gobierno de la Nación."
  - id: b
    text:
      es: "A las Cortes Generales."
  - id: c
    text:
      es: "Al Congreso de los Diputados."
  - id: d
    text:
      es: "Al Consejo de Estado."
  explanation:
    es: "El artículo 134.1 atribuye la elaboración al Gobierno. Las Cortes Generales y el Congreso de los Diputados intervienen después, para el examen, la enmienda y la aprobación. El Consejo de Estado no tiene ninguna función en la elaboración del presupuesto según ese artículo."
  citation: "art. 134.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q003
  prompt:
    es: "De acuerdo con el artículo 134.2 de la Constitución Española, los Presupuestos Generales del Estado:"
  options:
  - id: a
    text:
      es: "Tendrán carácter plurianual e incluirán la totalidad de los gastos e ingresos del sector público estatal."
  - id: b
    correct: true
    text:
      es: "Tendrán carácter anual e incluirán la totalidad de los gastos e ingresos del sector público estatal."
  - id: c
    text:
      es: "Tendrán carácter anual e incluirán solo los gastos e ingresos de la Administración General del Estado."
  - id: d
    text:
      es: "Tendrán carácter anual e incluirán los gastos del sector público estatal, pero no los ingresos."
  explanation:
    es: "El artículo 134.2 fija el carácter anual y la inclusión de la totalidad de los gastos e ingresos del sector público estatal. La opción plurianual contradice el carácter anual; la plurianualidad es un marco de programación, no el carácter del presupuesto. La opción limitada a la Administración General del Estado reduce el ámbito: el artículo habla del sector público estatal. La opción que deja fuera los ingresos omite la mitad de lo que el texto exige incluir."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q004
  prompt:
    es: "Según el artículo 134.2 de la Constitución Española, ¿qué importe se consignará en los Presupuestos Generales del Estado, además de los gastos e ingresos?"
  options:
  - id: a
    correct: true
    text:
      es: "El importe de los beneficios fiscales que afecten a los tributos del Estado."
  - id: b
    text:
      es: "El importe de los beneficios fiscales que afecten a los tributos del Estado y a los de las Comunidades Autónomas."
  - id: c
    text:
      es: "El importe de los tributos que se vayan a crear durante el ejercicio."
  - id: d
    text:
      es: "El importe de la deuda pública que se vaya a emitir durante el ejercicio."
  explanation:
    es: "El artículo 134.2 manda consignar el importe de los beneficios fiscales que afecten a los tributos del Estado. La opción que suma los tributos autonómicos amplía el ámbito más allá de lo que el texto dice. La Ley de Presupuestos no puede crear tributos (art. 134.7), así que no consigna los que se creen. La emisión de deuda pública no figura entre los extremos que el artículo 134.2 ordena consignar."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q005
  prompt:
    es: "Los Presupuestos Generales del Estado incluirán, según la Constitución Española, la totalidad de los gastos e ingresos del:"
  options:
  - id: a
    text:
      es: "Sector público en su conjunto, incluidas las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Sector público estatal."
  - id: c
    text:
      es: "Estado y de sus organismos autónomos, con exclusión del resto de entidades."
  - id: d
    text:
      es: "Sector público de las Administraciones Públicas territoriales."
  explanation:
    es: "El artículo 134.2 habla de la totalidad de los gastos e ingresos del sector público estatal. Incluir a las Comunidades Autónomas ensancha el ámbito más allá del Estado. Limitarlo al Estado y a sus organismos autónomos lo estrecha, porque el artículo dice sector público estatal. El sector de las Administraciones territoriales no es el que el artículo delimita."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q006
  prompt:
    es: "Según el artículo 134.3 de la Constitución Española, el Gobierno deberá presentar ante el Congreso de los Diputados los Presupuestos Generales del Estado:"
  options:
  - id: a
    text:
      es: "Al menos dos meses antes de la expiración de los del año anterior."
  - id: b
    text:
      es: "Antes del último día del primer mes del ejercicio siguiente."
  - id: c
    text:
      es: "Dentro de los tres meses siguientes a la expiración de los del año anterior."
  - id: d
    correct: true
    text:
      es: "Al menos tres meses antes de la expiración de los del año anterior."
  explanation:
    es: "El artículo 134.3 exige la presentación al menos tres meses antes de la expiración de los presupuestos del año anterior. Dos meses es una antelación inferior a la exigida. La presentación en el primer mes del ejercicio llega cuando los presupuestos anteriores ya han expirado. Hacerlo después de la expiración invierte el sentido del plazo: el artículo exige antelación, no demora."
  citation: "art. 134.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la tramitación de los Presupuestos Generales del Estado es correcta según la Constitución Española?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno los presenta ante el Congreso de los Diputados y las Cortes Generales los examinan, enmiendan y aprueban."
  - id: b
    text:
      es: "El Gobierno los presenta ante el Senado y las Cortes Generales los examinan, enmiendan y aprueban."
  - id: c
    text:
      es: "El Gobierno los presenta ante el Congreso de los Diputados y este los aprueba sin intervención del Senado."
  - id: d
    text:
      es: "El Gobierno los presenta ante las Cortes Generales y él mismo los aprueba tras su examen y enmienda."
  explanation:
    es: "El Gobierno presenta los presupuestos ante el Congreso de los Diputados (art. 134.3), y su examen, enmienda y aprobación corresponden a las Cortes Generales (art. 134.1). Presentarlos ante el Senado cambia la Cámara a la que se dirigen. Atribuir la aprobación solo al Congreso deja fuera a las Cortes Generales como titulares de esa función. Que el Gobierno los apruebe a sí mismo invierte el reparto: él los elabora y las Cortes los aprueban."
  citation: "art. 134.3 CE"
  difficulty: 1
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-1978-31229-art-134
- id: m05-l01-q008
  prompt:
    es: "Según el artículo 134.4 de la Constitución Española, si la Ley de Presupuestos no se aprobara antes del primer día del ejercicio económico correspondiente, se considerarán automáticamente:"
  options:
  - id: a
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior durante seis meses como máximo."
  - id: b
    correct: true
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior hasta la aprobación de los nuevos."
  - id: c
    text:
      es: "Sustituidos por un presupuesto provisional que fijará el Gobierno por decreto-ley."
  - id: d
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior, previo acuerdo del Consejo de Ministros."
  explanation:
    es: "El artículo 134.4 prevé la prórroga automática de los presupuestos del ejercicio anterior hasta la aprobación de los nuevos. La opción de seis meses inventa un tope temporal que el artículo no fija. El presupuesto provisional por decreto-ley tampoco existe en el texto. Exigir un acuerdo del Consejo de Ministros contradice la palabra «automáticamente»."
  citation: "art. 134.4 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-38
- id: m05-l01-q010
  prompt:
    es: "De acuerdo con el artículo 38.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, si la Ley de Presupuestos Generales del Estado no se aprobara antes del primer día del ejercicio económico correspondiente, se prorrogan automáticamente:"
  options:
  - id: a
    text:
      es: "Los presupuestos definitivos del ejercicio anterior, con sus modificaciones, hasta la aprobación y publicación de los nuevos en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, durante un máximo de seis meses desde el primer día del ejercicio."
  - id: c
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, hasta que el Consejo de Ministros apruebe un presupuesto provisional."
  - id: d
    correct: true
    text:
      es: "Los presupuestos iniciales del ejercicio anterior, hasta la aprobación y publicación de los nuevos en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 38.1 LGP dice que, si la Ley de Presupuestos no se aprueba antes del primer día del ejercicio, «se considerarán automáticamente prorrogados los presupuestos iniciales del ejercicio anterior hasta la aprobación y publicación de los nuevos en el \"Boletín Oficial del Estado\"». Los presupuestos definitivos con sus modificaciones no son los prorrogados: el apartado dice «iniciales». El tope de seis meses contradice «hasta la aprobación y publicación de los nuevos». El presupuesto provisional del Consejo de Ministros tampoco: según el apartado 4, el Consejo solo acuerda, a propuesta de Hacienda, los criterios para instrumentar la prórroga."
  citation: "art. 38.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-38
- id: m05-l01-q011
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué créditos deja fuera la prórroga de los presupuestos?"
  options:
  - id: a
    text:
      es: "Los créditos para gastos de programas o actuaciones que comiencen en el ejercicio cuyos presupuestos se prorrogan."
  - id: b
    text:
      es: "Los créditos para gastos de personal del ejercicio cuyos presupuestos se prorrogan."
  - id: c
    correct: true
    text:
      es: "Los créditos para gastos de programas o actuaciones que terminen en el ejercicio cuyos presupuestos se prorrogan."
  - id: d
    text:
      es: "Los créditos para gastos de programas plurianuales con más de dos ejercicios por delante."
  explanation:
    es: "El artículo 38.2 excluye de la prórroga los créditos de programas o actuaciones que terminen en el ejercicio cuyos presupuestos se prorrogan y los de obligaciones que se extingan en él. Los programas que comienzan en ese ejercicio no están excluidos. Los gastos de personal tampoco aparecen como excepción. Los programas plurianuales largos tampoco: el criterio es que el programa termine en el ejercicio, no su duración."
  citation: "art. 38.2 LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2003-21614-art-38
- id: m05-l01-q012
  prompt:
    es: "Según el artículo 38.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la estructura orgánica del presupuesto prorrogado se adaptará:"
  options:
  - id: a
    text:
      es: "Con una reducción de la cuantía total fijada por el Gobierno, a la organización administrativa vigente en el ejercicio anterior."
  - id: b
    text:
      es: "Sin alteración de la cuantía total, a la organización administrativa que tuviera el ejercicio cuyos presupuestos se prorrogan."
  - id: c
    text:
      es: "Con un incremento de la cuantía total igual al crecimiento del producto interior bruto, a la organización en vigor."
  - id: d
    correct: true
    text:
      es: "Sin alteración de la cuantía total, a la organización administrativa en vigor en el ejercicio en que deba ejecutarse."
  explanation:
    es: "El artículo 38.3 adapta la estructura orgánica a la organización administrativa en vigor en el ejercicio de ejecución, sin alterar la cuantía total. Reducir la cuantía o incrementarla con el producto interior bruto altera el total, y el artículo lo prohíbe. La opción que conserva la organización del ejercicio prorrogado mantiene la cuantía, pero fija la organización de otro ejercicio y no la del ejercicio de ejecución."
  citation: "art. 38.3 LGP"
  difficulty: 3
  tags:
  - "efecto"
  - "estructura"
# anchor: boe-a-2003-21614-art-32
- id: m05-l01-q013
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado constituyen la expresión cifrada, conjunta y sistemática de:"
  options:
  - id: a
    text:
      es: "Los derechos y obligaciones a liquidar durante el ejercicio solo por la Administración General del Estado."
  - id: b
    text:
      es: "Los ingresos y gastos previstos cada ejercicio por el Estado y por las Administraciones territoriales."
  - id: c
    correct: true
    text:
      es: "Los derechos y obligaciones a liquidar durante el ejercicio por cada órgano y entidad del sector público estatal."
  - id: d
    text:
      es: "Las obligaciones reconocidas y los pagos realizados durante el ejercicio por los órganos del sector público estatal."
  explanation:
    es: "El artículo 32 define los presupuestos como la expresión cifrada de los derechos y obligaciones a liquidar durante el ejercicio por cada órgano y entidad del sector público estatal. Limitarlos a la Administración General del Estado reduce el sujeto. Incluir a las Administraciones territoriales lo amplía. Las obligaciones ya reconocidas y los pagos realizados describen la ejecución, no la expresión cifrada de lo que se prevé liquidar."
  citation: "art. 32 LGP"
  difficulty: 2
  tags:
  - "concepto"
