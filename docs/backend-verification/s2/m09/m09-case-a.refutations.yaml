m09-case-a-q01:
  key:
    anchor: redis-rate-limiter#why-the-problem-is-hard
    sentence: The rate limiter needs a centralized store fast enough to sit on the request path without adding meaningful latency.
  wrong:
  - option: Hold counters for the client IP address only, never for API keys or tenants
    anchor: redis-rate-limiter#how-redis-supports-the-solution
    sentence: Counters live behind keys scoped to the dimension you are limiting on (user, IP, API key, tenant, model)
  - option: Remove expired counters only through a cleanup job that the team schedules
    anchor: redis-rate-limiter#how-redis-supports-the-solution
    sentence: INCR and EXPIRE give you atomic fixed-window counters with automatic time-window cleanup.
  - option: Keep one counter per instance so that instances never need to coordinate
    anchor: redis-rate-limiter#why-the-problem-is-hard
    sentence: 'Local per-process counters break behind load balancers: the same client bypasses limits by hitting different instances.'
