# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q377
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones describe para qué se usa la aplicación Asistencia rápida?"
  options:
  - id: a
    text:
      es: "Para restaurar el equipo a su configuración de fábrica desde una unidad USB de recuperación"
  - id: b
    correct: true
    text:
      es: "Para obtener o dar ayuda con un problema informático mediante una conexión remota"
  - id: c
    text:
      es: "Para copiar las bibliotecas en una unidad externa de forma periódica"
  - id: d
    text:
      es: "Para consultar el registro detallado de los eventos del sistema y la seguridad"
  explanation:
    es: "La página dice que Asistencia rápida sirve para obtener ayuda con un problema informático de familiares o amigos, o para ayudarles, mediante una conexión remota. Restaurar el equipo desde USB es de la Unidad de recuperación, copiar bibliotecas es del Historial de archivos y el registro de eventos es del Visor de eventos."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Asistencia rápida»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q379
  prompt:
    es: "En la Asistencia rápida de Windows 11, ¿qué hace quien ayuda a otra persona para iniciar la sesión?"
  options:
  - id: a
    text:
      es: "Introducir el código de 6 dígitos en el cuadro Código del asistente"
  - id: b
    text:
      es: "Seleccionar Permitir para empezar a compartir su pantalla"
  - id: c
    correct: true
    text:
      es: "Seleccionar Ayudar a alguien y compartir el código de 6 dígitos"
  - id: d
    text:
      es: "Seleccionar Solicitar control antes de que la otra persona se conecte"
  explanation:
    es: "La página dice que quien ayuda abre Asistencia rápida, selecciona Ayudar a alguien y comparte el código de 6 dígitos con la persona a la que ayuda. Escribir el código en Código del asistente y seleccionar Permitir lo hace quien recibe la ayuda, y Solicitar control se usa una vez conectados."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Ayudar a alguien que conozca con la Asistencia rápida»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q380
  prompt:
    es: "El código que se comparte en la Asistencia rápida de Windows 11 para conectar con la persona a la que se ayuda tiene:"
  options:
  - id: a
    text:
      es: "cuatro dígitos"
  - id: b
    text:
      es: "ocho dígitos"
  - id: c
    correct: true
    text:
      es: "seis dígitos"
  - id: d
    text:
      es: "diez dígitos"
  explanation:
    es: "La página dice que el código es de 6 dígitos. Cuatro, ocho o diez no coinciden con esa cifra."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Ayudar a alguien que conozca con la Asistencia rápida»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q381
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes botones de la Asistencia rápida pide el control total del equipo de la persona a la que se ayuda?"
  options:
  - id: a
    text:
      es: "Abandonar"
  - id: b
    correct: true
    text:
      es: "Solicitar control"
  - id: c
    text:
      es: "Permitir"
  - id: d
    text:
      es: "Cancelar control"
  explanation:
    es: "La página dice que, para solicitar el control total del equipo, se selecciona Solicitar control y se espera a que se permita. Abandonar finaliza la ayuda, Permitir lo usa quien recibe ayuda para aceptar la conexión o el control y Cancelar control lo usa para dejar de permitirlo."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Ayudar a alguien que conozca con la Asistencia rápida»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m06-l03-q382
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes botones de la Asistencia rápida se selecciona cuando se ha terminado de ayudar a la otra persona?"
  options:
  - id: a
    correct: true
    text:
      es: "Abandonar"
  - id: b
    text:
      es: "Cancelar control"
  - id: c
    text:
      es: "Enviar"
  - id: d
    text:
      es: "Permitir"
  explanation:
    es: "La página dice que, cuando se ha terminado de ayudar, se selecciona Abandonar. Cancelar control sirve para dejar de permitir el control total, Enviar es el botón con el que se envía el código y Permitir acepta la conexión."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Ayudar a alguien que conozca con la Asistencia rápida»"
  difficulty: 2
  tags:
  - "ofimática-menú"
