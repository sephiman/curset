- id: m02-l09-q317
  prompt:
    es: "En Excel 365, ¿qué hay que hacer primero para ordenar de izquierda a derecha los datos de una tabla de Excel?"
  options:
  - id: a
    text:
      es: "Activar la fila de encabezado"
  - id: b
    correct: true
    text:
      es: "Convertir la tabla en un rango"
  - id: c
    text:
      es: "Proteger la hoja"
  - id: d
    text:
      es: "Aplicar un filtro a las columnas"
  explanation:
    es: "La página dice que las tablas no admiten la ordenación de izquierda a derecha y que primero hay que convertirlas en rango. «Activar la fila de encabezado»: la página pide convertir la tabla en rango, porque las tablas no admiten ordenar de izquierda a derecha. «Aplicar un filtro a las columnas»: el filtro no sirve para ordenar de izquierda a derecha. «Proteger la hoja»: la protección no interviene en la orientación de la ordenación."
  citation: "fuente: `ms-excel-ordenar.html`; «Para ello, primero debe convertir la tabla en un rango, seleccionando cualquier celda de la tabla y, a continuación, seleccionando Herramientas> de tablaConvertir en rango.»"
