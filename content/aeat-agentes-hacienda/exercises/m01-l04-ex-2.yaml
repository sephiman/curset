# anchor: celex-12016m-txt-art-15
- id: m01-l04-q0131
  prompt:
    es: "Según el artículo 15 del Tratado de la Unión Europea, ¿qué debe hacer el Presidente del Consejo Europeo al término de cada reunión del Consejo Europeo?"
  options:
  - id: a
    correct: true
    text:
      es: "Presentar un informe al Parlamento Europeo."
  - id: b
    text:
      es: "Presentar un informe al Consejo de Asuntos Generales."
  - id: c
    text:
      es: "Presentar un informe a los Parlamentos nacionales."
  - id: d
    text:
      es: "Comparecer ante la Comisión para dar cuenta de los acuerdos."
  explanation:
    es: "La opción correcta es presentar un informe al Parlamento Europeo: el artículo 15.6.d) TUE dice que el Presidente, «al término de cada reunión del Consejo Europeo, presentará un informe al Parlamento Europeo». Con el Consejo de Asuntos Generales se apoya para preparar los trabajos, pero el informe no va a esa formación. Los Parlamentos nacionales no lo reciben. Con el Presidente de la Comisión coopera, pero no comparece ante la Comisión."
  citation: "art. 15.6 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: celex-12016m-txt-art-15
- id: m01-l04-q0132
  prompt:
    es: "De acuerdo con el artículo 15 del Tratado de la Unión Europea, el Consejo Europeo se reunirá con carácter ordinario:"
  options:
  - id: a
    text:
      es: "Una vez por semestre, por convocatoria conjunta de su Presidente y del Presidente de la Comisión."
  - id: b
    correct: true
    text:
      es: "Dos veces por semestre, convocado por su Presidente."
  - id: c
    text:
      es: "Una vez al mes, por convocatoria de su Presidente o a petición de un tercio de sus miembros."
  - id: d
    text:
      es: "Dos veces por semestre, por convocatoria del Presidente de la Comisión y del Alto Representante."
  explanation:
    es: "La opción correcta es dos veces por semestre, convocado por su Presidente: el artículo 15.3 TUE dice que el Consejo Europeo «se reunirá dos veces por semestre por convocatoria de su Presidente». Una vez por semestre y una vez al mes cambian la frecuencia. La convocatoria es solo de su Presidente: no es conjunta con el Presidente de la Comisión, no la hacen el Presidente de la Comisión y el Alto Representante y no la pide un tercio de los miembros."
  citation: "art. 15.3 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "cantidad"
# anchor: celex-12016m-txt-art-15
- id: m01-l04-q0134
  prompt:
    es: "Señale la afirmación correcta sobre el Consejo Europeo, de acuerdo con el artículo 15.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    correct: true
    text:
      es: "No ejerce función legislativa alguna."
  - id: b
    text:
      es: "Ejerce conjuntamente con el Parlamento Europeo la función legislativa."
  - id: c
    text:
      es: "Ejerce la función legislativa cuando los Tratados lo prevén."
  - id: d
    text:
      es: "Ejerce la función legislativa por consenso de sus miembros."
  explanation:
    es: "El artículo 15.1 dice que el Consejo Europeo no ejercerá función legislativa alguna. La función legislativa conjunta con el Parlamento corresponde al Consejo, según el artículo 16.1. Tampoco la ejerce en ningún caso previsto por los Tratados ni por consenso: el artículo no deja excepción."
  citation: "art. 15.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-138
- id: m01-l04-q0001
  prompt:
    es: "Según el artículo 138.1 de la Constitución Española de 1978, ¿a qué circunstancias atiende en particular el Estado al velar por el equilibrio económico entre las diversas partes del territorio?"
  options:
  - id: a
    text:
      es: "A las circunstancias de las zonas de montaña."
  - id: b
    correct: true
    text:
      es: "A las circunstancias del hecho insular."
  - id: c
    text:
      es: "A las circunstancias de las regiones con menor renta."
  - id: d
    text:
      es: "A las circunstancias de las ciudades de Ceuta y Melilla."
  explanation:
    es: "El artículo 138.1 dice que el Estado vela por ese equilibrio «atendiendo en particular a las circunstancias del hecho insular». Las zonas de montaña, las regiones con menor renta y las ciudades de Ceuta y Melilla no aparecen en el artículo."
  citation: "art. 138.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-138
- id: m01-l04-q0002
  prompt:
    es: "De acuerdo con el artículo 138.2 de la Constitución Española de 1978, las diferencias entre los Estatutos de las distintas Comunidades Autónomas:"
  options:
  - id: a
    text:
      es: "No podrán implicar, salvo autorización de las Cortes Generales, privilegios económicos o sociales."
  - id: b
    text:
      es: "No podrán implicar, en ningún caso, diferencias en el nivel de competencias asumidas."
  - id: c
    correct: true
    text:
      es: "No podrán implicar, en ningún caso, privilegios económicos o sociales."
  - id: d
    text:
      es: "Deberán compensarse con cargo al Fondo de Compensación interterritorial."
  explanation:
    es: "El artículo 138.2 dice que esas diferencias «no podrán implicar, en ningún caso, privilegios económicos o sociales». No hay excepción por autorización de las Cortes. Las competencias sí pueden ser distintas de un Estatuto a otro: cada uno recoge las que asume (art. 147.2.d). El Fondo de Compensación corrige desequilibrios económicos (art. 158.2), no las diferencias entre Estatutos."
  citation: "art. 138.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-139
- id: m01-l04-q0004
  prompt:
    es: "De acuerdo con el artículo 139.1 de la Constitución Española de 1978, todos los españoles tienen los mismos derechos y obligaciones:"
  options:
  - id: a
    text:
      es: "En el territorio de la Comunidad Autónoma en la que residan."
  - id: b
    text:
      es: "En las Comunidades Autónomas cuyos Estatutos los reconozcan."
  - id: c
    correct: true
    text:
      es: "En cualquier parte del territorio del Estado."
  - id: d
    text:
      es: "Mientras residan en su Comunidad Autónoma de origen."
  explanation:
    es: "El artículo 139.1 iguala los derechos y obligaciones de los españoles en cualquier parte del territorio del Estado. Las otras opciones los ligan a la Comunidad de residencia, a lo que reconozca cada Estatuto o a la Comunidad de origen, y ese vínculo territorial es justo lo que el artículo excluye."
  citation: "art. 139.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-143
- id: m01-l04-q0005
  prompt:
    es: "¿Cuál de las siguientes entidades puede acceder a su autogobierno y constituirse en Comunidad Autónoma, en el ejercicio del derecho a la autonomía reconocido en la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Las agrupaciones de municipios con identidad lingüística propia."
  - id: b
    correct: true
    text:
      es: "Las provincias con entidad regional histórica."
  - id: c
    text:
      es: "Las comarcas con características culturales y económicas comunes."
  - id: d
    text:
      es: "Las mancomunidades de municipios limítrofes de distintas provincias."
  explanation:
    es: "El artículo 143.1 permite acceder al autogobierno a «las provincias limítrofes con características históricas, culturales y económicas comunes, los territorios insulares y las provincias con entidad regional histórica». Las agrupaciones de municipios, las comarcas y las mancomunidades no están en esa lista: el artículo habla siempre de provincias o de territorios insulares."
  citation: "art. 143.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-151
- id: m01-l04-q0009
  prompt:
    es: "Según el artículo 151.1 de la Constitución Española de 1978, ¿qué mayoría exige el referéndum de ratificación de la iniciativa del proceso autonómico?"
  options:
  - id: a
    text:
      es: "El voto afirmativo de la mayoría absoluta de los votantes de cada provincia."
  - id: b
    text:
      es: "La mayoría de los votos válidamente emitidos en cada provincia."
  - id: c
    correct: true
    text:
      es: "El voto afirmativo de la mayoría absoluta de los electores de cada provincia."
  - id: d
    text:
      es: "El voto afirmativo de las tres quintas partes de los electores del conjunto del territorio."
  explanation:
    es: "El artículo 151.1 exige la ratificación «mediante referéndum por el voto afirmativo de la mayoría absoluta de los electores de cada provincia». Cuentan los electores, no los votantes. La mayoría de los votos válidamente emitidos es la que pide el artículo 151.2 para aprobar el proyecto de Estatuto en referéndum, no para ratificar la iniciativa. Tres quintos del conjunto del territorio no aparecen en el artículo."
  citation: "art. 151.1 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-151
- id: m01-l04-q0011
  prompt:
    es: "De acuerdo con el artículo 151.2 de la Constitución Española de 1978, el proyecto de Estatuto aprobado por la Asamblea de Parlamentarios se remite a la Comisión Constitucional del Congreso, que lo examinará:"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro del plazo de dos meses, con el concurso y asistencia de una delegación de la Asamblea proponente."
  - id: b
    text:
      es: "Dentro del plazo de tres meses, con el concurso y asistencia de una delegación de la Asamblea proponente."
  - id: c
    text:
      es: "Dentro del plazo de dos meses, con el concurso y asistencia de una delegación del órgano preautonómico."
  - id: d
    text:
      es: "Dentro del plazo de un mes, previo dictamen del Consejo de Estado sobre su adecuación constitucional."
  explanation:
    es: "El artículo 151.2, regla 2.ª, dice que la Comisión Constitucional del Congreso, «dentro del plazo de dos meses, lo examinará con el concurso y asistencia de una delegación de la Asamblea proponente». El plazo es de dos meses, no de uno ni de tres. La delegación es la de la Asamblea de Parlamentarios que aprobó el proyecto, no la de un órgano preautonómico. El procedimiento de ese apartado va de la Asamblea a la Comisión Constitucional y de ahí al referéndum, sin un dictamen del Consejo de Estado entre medias."
  citation: "art. 151.2 CE"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-151
- id: m01-l04-q0014
  prompt:
    es: "Según el artículo 151.3 de la Constitución Española de 1978, ¿qué ocurre si una o varias provincias no aprueban en referéndum el proyecto de Estatuto?"
  options:
  - id: a
    correct: true
    text:
      es: "No se impide la constitución entre las restantes de la Comunidad Autónoma proyectada."
  - id: b
    text:
      es: "Se impide la constitución de la Comunidad Autónoma proyectada en todas las provincias."
  - id: c
    text:
      es: "Las provincias que lo rechazaron quedan integradas en la Comunidad si lo acuerdan sus Diputaciones."
  - id: d
    text:
      es: "Debe repetirse el referéndum en esas provincias en el plazo de seis meses."
  explanation:
    es: "El artículo 151.3 dice que la no aprobación del proyecto por una o varias provincias «no impedirá la constitución entre las restantes de la Comunidad Autónoma proyectada». El apartado dice «entre las restantes», así que la negativa de unas no bloquea a las demás. Quedan fuera las provincias que lo rechazaron: el artículo 151.2, regla 4.ª, exige la aprobación «en cada provincia» para elevar el texto a las Cortes, y el 151.3 no las integra por un acuerdo de sus Diputaciones. El apartado resuelve el caso con la constitución entre las restantes, sin una segunda votación en seis meses."
  citation: "art. 151.3 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-144
- id: m01-l04-q0015
  prompt:
    es: "De acuerdo con el artículo 144 de la Constitución Española de 1978, autorizar o acordar un Estatuto de autonomía para territorios que no estén integrados en la organización provincial corresponde:"
  options:
  - id: a
    text:
      es: "A las Cortes Generales, mediante ley ordinaria, por motivos de interés general."
  - id: b
    text:
      es: "Al Gobierno, mediante real decreto, previa audiencia de las Cortes Generales."
  - id: c
    text:
      es: "Al Congreso de los Diputados, por mayoría absoluta, por motivos de interés nacional."
  - id: d
    correct: true
    text:
      es: "A las Cortes Generales, mediante ley orgánica, por motivos de interés nacional."
  explanation:
    es: "El artículo 144 dice que «las Cortes Generales, mediante ley orgánica, podrán, por motivos de interés nacional» autorizar o acordar ese Estatuto (letra b). No basta una ley ordinaria y el motivo es el interés nacional, no el general. No decide el Gobierno por real decreto ni el Congreso solo: decide el conjunto de las Cortes mediante ley orgánica."
  citation: "art. 144.b) CE"
  difficulty: 1
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-146
- id: m01-l04-q0019
  prompt:
    es: "Conforme al artículo 146 de la Constitución Española de 1978, el proyecto de Estatuto será elaborado por una asamblea compuesta por los miembros de la Diputación u órgano interinsular de las provincias afectadas y por:"
  options:
  - id: a
    text:
      es: "Los Alcaldes de los municipios de las provincias afectadas."
  - id: b
    text:
      es: "Los Delegados del Gobierno y los Subdelegados de las provincias afectadas."
  - id: c
    correct: true
    text:
      es: "Los Diputados y Senadores elegidos en ellas."
  - id: d
    text:
      es: "Los representantes designados por los Grupos políticos de las Cortes Generales."
  explanation:
    es: "La asamblea que elabora el proyecto de Estatuto reúne a los miembros de las Diputaciones y a los Diputados y Senadores elegidos en las provincias afectadas. Los Alcaldes no la integran. Tampoco los Delegados del Gobierno y los Subdelegados, que representan a la Administración del Estado y no son miembros de la Diputación ni parlamentarios elegidos en la provincia. Los representantes de los Grupos políticos de las Cortes Generales tampoco forman parte de esta asamblea."
  citation: "art. 146 CE"
  difficulty: 3
  tags:
  - "composición"
