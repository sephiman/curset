# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q052
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué ocurre con un usuario que tiene el nivel de permisos Ninguno en una carpeta compartida?"
  options:
  - id: a
    text:
      es: "Sale de la lista de permisos y deja de ver la carpeta compartida."
  - id: b
    correct: true
    text:
      es: "Sigue en la lista de permisos, pero no abre la carpeta."
  - id: c
    text:
      es: "Puede abrir la carpeta, pero no ver los elementos."
  - id: d
    text:
      es: "Puede leer los elementos, pero no crear ninguno."
  explanation:
    es: "La tabla dice que con Ninguno no se puede realizar ninguna actividad: el usuario permanece en la lista de permisos, pero no tiene permiso y no puede abrir la carpeta. No sale de la lista. Tampoco puede abrirla. Leer elementos es lo que permite Revisor."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Comprender los permisos de uso compartido»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q053
  prompt:
    es: "En Outlook clásico, ¿cuál de las siguientes rutas permite conceder permisos sobre una carpeta a otro usuario?"
  options:
  - id: a
    correct: true
    text:
      es: "Botón derecho en la carpeta › Propiedades › pestaña Permisos"
  - id: b
    text:
      es: "Archivo › Opciones › Centro de confianza › Configuración del Centro de confianza"
  - id: c
    text:
      es: "Carpeta › Nuevo › Nueva carpeta de búsqueda"
  - id: d
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  explanation:
    es: "En Outlook clásico, la página indica hacer clic con el botón derecho en la carpeta, seleccionar Propiedades y, en la pestaña Permisos, agregar a los usuarios y elegir el nivel. El Centro de confianza reúne la configuración de seguridad, como el cifrado. Nueva carpeta de búsqueda crea una carpeta virtual con los mensajes que cumplen unos criterios. Limpieza de buzón muestra el tamaño del buzón y ayuda a reducirlo."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Propietario de una carpeta o buzón: Conceder permisos a una carpeta»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q054
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué opción se elige al hacer clic con el botón derecho en una carpeta para compartirla con otra persona?"
  options:
  - id: a
    text:
      es: "Agregar carpeta compartida o buzón de correo"
  - id: b
    correct: true
    text:
      es: "Uso compartido y permisos"
  - id: c
    text:
      es: "Quitar carpeta compartida"
  - id: d
    text:
      es: "Delegar el acceso"
  explanation:
    es: "El propietario, en el nuevo Outlook, hace clic con el botón derecho en la carpeta y elige Uso compartido y permisos. Agregar carpeta compartida o buzón de correo es el paso del invitado para ver lo que otros le comparten. Quitar carpeta compartida lo quita del panel del invitado. Delegar el acceso se concede en Outlook clásico, desde Archivo."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Cómo seleccionar y compartir la carpeta o el buzón con otros usuarios»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q055
  prompt:
    es: "En el nuevo Outlook para Windows, al compartir una subcarpeta cuyas carpetas principales no tienen permisos, ¿cuál de los siguientes permisos les asigna Outlook?"
  options:
  - id: a
    text:
      es: "Colaborador, que deja crear elementos en las carpetas principales."
  - id: b
    text:
      es: "Revisor, que deja leer los elementos de las carpetas principales."
  - id: c
    text:
      es: "Ninguno, que impide al destinatario navegar hasta la carpeta compartida."
  - id: d
    correct: true
    text:
      es: "Carpeta visible, que solo deja navegar hasta la carpeta compartida."
  explanation:
    es: "La página dice que, si las carpetas principales no tienen permisos, Outlook les asigna automáticamente el mínimo necesario, Carpeta visible, que solo permite navegar hasta la carpeta compartida, sin ver el contenido de las principales. Revisor y Colaborador darían acceso al contenido de esas carpetas. Ninguno no deja abrir la carpeta y no es el permiso que Outlook asigna."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Cómo funcionan los permisos de la carpeta principal»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q056
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué hace el invitado para acceder a una carpeta que otra persona ha compartido con él?"
  options:
  - id: a
    text:
      es: "La abre desde Archivo › Configuración de la cuenta › Delegar el acceso."
  - id: b
    text:
      es: "Nada, porque la carpeta aparece sola en su lista de carpetas al cabo de unas horas."
  - id: c
    correct: true
    text:
      es: "La agrega en Compartido conmigo › Agregar carpeta compartida o buzón de correo."
  - id: d
    text:
      es: "La abre desde el botón derecho en su Bandeja de entrada › Propiedades."
  explanation:
    es: "En el nuevo Outlook el invitado hace clic con el botón derecho en Compartido conmigo, en el panel de carpetas, y selecciona Agregar carpeta compartida o buzón de correo. Que el buzón aparezca solo en la lista de carpetas es lo que la página describe para Outlook clásico. Delegar el acceso lo usa el propietario para conceder acceso delegado. Propiedades es donde el propietario concede permisos en Outlook clásico."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «En el panel de carpetas, haga clic con el botón derecho en Compartido conmigo.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "comportamiento"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q059
  prompt:
    es: "En Outlook 365, ¿con cuál de las siguientes cuentas de correo electrónico está disponible el acceso delegado?"
  options:
  - id: a
    text:
      es: "Cualquier cuenta de correo web, como una de Gmail o de Outlook.com."
  - id: b
    correct: true
    text:
      es: "Una cuenta profesional o educativa en Microsoft 365 o con Exchange Online."
  - id: c
    text:
      es: "Cualquier cuenta de correo configurada con acceso POP en el equipo."
  - id: d
    text:
      es: "Una cuenta personal de Outlook.com configurada con acceso IMAP."
  explanation:
    es: "La nota de la página dice que el acceso delegado solo está disponible con una cuenta profesional o educativa en Microsoft 365 o con Exchange Online. Las cuentas de correo web y las cuentas personales quedan fuera, y el método de acceso, IMAP o POP, no cambia ese requisito."
  citation: "fuente: `ms-outlook-delegados.html`; «Permitir el envío de mensajes en su nombre al compartir una carpeta o un buzón»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q060
  prompt:
    es: "En Outlook clásico, ¿cuál de las siguientes rutas se usa para conceder acceso delegado a otra persona?"
  options:
  - id: a
    correct: true
    text:
      es: "Archivo › Configuración de la cuenta › Delegar el acceso"
  - id: b
    text:
      es: "Botón derecho en la carpeta › Propiedades › Permisos"
  - id: c
    text:
      es: "Archivo › Agregar cuenta"
  - id: d
    text:
      es: "Archivo › Opciones › Centro de confianza › Configuración del Centro de confianza"
  explanation:
    es: "La página indica, en Outlook clásico, Archivo › Configuración de la cuenta › Delegar el acceso y después Agregar. Propiedades › Permisos comparte una carpeta sin acceso delegado: las respuestas salen de la cuenta del invitado. El Centro de confianza reúne la seguridad, como el cifrado. Agregar cuenta añade una cuenta de correo propia."
  citation: "fuente: `ms-outlook-delegados.html`; «Primera persona: Conceder acceso delegado a otra persona»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q061
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes afirmaciones sobre los permisos de delegado en las carpetas de correo es correcta?"
  options:
  - id: a
    text:
      es: "No existen: el nuevo Outlook no admite delegados en ninguna carpeta."
  - id: b
    correct: true
    text:
      es: "Solo están en parte disponibles y se asignan primero en Outlook clásico."
  - id: c
    text:
      es: "Se asignan desde Configuración › Cuentas, igual que en Outlook clásico."
  - id: d
    text:
      es: "Se asignan con el botón derecho en la carpeta › Uso compartido y permisos."
  explanation:
    es: "La página dice que en el nuevo Outlook la asignación de permisos de delegado a carpetas de correo solo está parcialmente disponible: se pueden tener delegados, pero hay que usar Outlook clásico para asignar esos permisos en primer lugar. En Outlook clásico se asignan desde Archivo › Configuración de la cuenta › Delegar el acceso, no desde Configuración › Cuentas. Uso compartido y permisos comparte una carpeta, sin acceso delegado. Decir que no admite delegados contradice la página."
  citation: "fuente: `ms-outlook-delegados.html`; «Acerca de la delegación en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q062
  prompt:
    es: "En Outlook 365, ¿qué puede hacer un delegado con el nivel de permisos Editor que no puede hacer uno con el nivel Autor?"
  options:
  - id: a
    text:
      es: "Modificar y eliminar los elementos que el propio delegado creó."
  - id: b
    text:
      es: "Crear elementos nuevos en la carpeta del propietario de la cuenta."
  - id: c
    text:
      es: "Leer los elementos de la carpeta del propietario de la cuenta."
  - id: d
    correct: true
    text:
      es: "Modificar y eliminar los elementos creados por el propietario."
  explanation:
    es: "La tabla de opciones de delegado da a Editor leer, crear y modificar elementos, incluidos los creados por el propietario de la cuenta, que puede modificar y eliminar. Autor lee y crea, y modifica y elimina solo los que él cree. Leer, crear y gestionar lo propio lo pueden hacer los dos niveles."
  citation: "fuente: `ms-outlook-delegados.html`; «Opciones para delegar una carpeta»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q063
  prompt:
    es: "En Outlook 365, ¿cuál de los siguientes niveles de permisos de delegado permite crear convocatorias de reunión en el calendario del propietario y responderlas en su nombre?"
  options:
  - id: a
    correct: true
    text:
      es: "Editor"
  - id: b
    text:
      es: "Ninguno"
  - id: c
    text:
      es: "Autor"
  - id: d
    text:
      es: "Revisor"
  explanation:
    es: "La tabla pone como ejemplo que un delegado con permisos de Editor puede crear convocatorias de reunión directamente en el calendario del propietario y responder a ellas en su nombre. Revisor solo lee elementos. Autor lee, crea y gestiona solo lo que crea. Con Ninguno en todas las carpetas, el delegado solo envía mensajes en nombre del propietario."
  citation: "fuente: `ms-outlook-delegados.html`; «Opciones para delegar una carpeta»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q064
  prompt:
    es: "En Outlook clásico, si al agregar un delegado se establecen en Ninguno Calendar, Tareas, Bandeja de entrada, Contactos y Notas, ¿qué podrá hacer?"
  options:
  - id: a
    text:
      es: "Solo leer la bandeja de entrada del propietario, y nada más."
  - id: b
    text:
      es: "Solo responder a las convocatorias de reunión del propietario."
  - id: c
    correct: true
    text:
      es: "Solo enviar mensajes en nombre del propietario, y nada más."
  - id: d
    text:
      es: "Nada, porque se queda sin ningún permiso sobre el buzón."
  explanation:
    es: "La página dice que, con Ninguno en cada una de esas cinco opciones, el delegado tiene la capacidad básica de enviar mensajes en nombre del propietario, pero nada más. Leer la bandeja de entrada exige darle además Revisor, Autor o Editor en ella. No se queda sin nada, porque conserva el envío. Responder convocatorias es un ejemplo de lo que permite Editor."
  citation: "fuente: `ms-outlook-delegados.html`; «Primera persona: Conceder acceso delegado a otra persona»"
  difficulty: 3
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q065
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de los siguientes pasos sigue el delegado para enviar un correo electrónico en nombre de otra persona?"
  options:
  - id: a
    text:
      es: "Reenviar el mensaje desde la bandeja de entrada de esa persona."
  - id: b
    text:
      es: "Escribir el alias de esa persona en la línea Para del mensaje nuevo."
  - id: c
    correct: true
    text:
      es: "Seleccionar De, encima de la línea Para, y elegir el buzón de esa persona."
  - id: d
    text:
      es: "Seleccionar CC, encima de la línea Para, y elegir el buzón de esa persona."
  explanation:
    es: "La página indica abrir un mensaje nuevo, seleccionar De encima de la línea Para y elegir el buzón de la otra persona. CC añade destinatarios en copia, no cambia el remitente. Escribir a esa persona en Para la convierte en destinataria. Reenviar desde su bandeja no es el paso que la página describe para enviar en su nombre."
  citation: "fuente: `ms-outlook-delegados.html`; «Delegado: Enviar correo electrónico en nombre de la otra persona»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q066
  prompt:
    es: "En Outlook 365, cuando un delegado envía un correo electrónico en nombre de otra persona, ¿qué ven los destinatarios del mensaje?"
  options:
  - id: a
    text:
      es: "Que lo envía la otra persona, sin rastro del delegado."
  - id: b
    correct: true
    text:
      es: "Que el mensaje lo envía el delegado en nombre de la otra persona."
  - id: c
    text:
      es: "Que lo envía el delegado desde su propia cuenta, sin más."
  - id: d
    text:
      es: "Que lo envía la otra persona con el delegado en copia."
  explanation:
    es: "La página termina los pasos así: los destinatarios del mensaje verán que lo envía el delegado en nombre de la otra persona. No ocultan al delegado ni lo ponen en copia. Que la respuesta salga solo desde la cuenta de quien la escribe es lo que ocurre al compartir una carpeta sin acceso delegado."
  citation: "fuente: `ms-outlook-delegados.html`; «Delegado: Enviar correo electrónico en nombre de la otra persona»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-delegados-html
- id: m06-l07-q068
  prompt:
    es: "Señale qué requiere, según la ayuda de Outlook 365, el envío de correo electrónico en nombre de otra persona:"
  options:
  - id: a
    correct: true
    text:
      es: "Que una persona dé acceso delegado y el delegado agregue ese buzón a su perfil."
  - id: b
    text:
      es: "Que el administrador active el cifrado S/MIME en las dos cuentas."
  - id: c
    text:
      es: "Que una persona comparta su carpeta con nivel Editor, sin ningún paso más."
  - id: d
    text:
      es: "Que una persona cree un grupo de Microsoft 365 y añada a él al delegado como miembro."
  explanation:
    es: "La página dice que enviar en nombre de otra persona requiere acciones de dos personas: una da acceso delegado y después el delegado agrega el buzón de la otra a su propio perfil. Compartir una carpeta, aunque sea con Editor, no da acceso delegado: las respuestas salen de la cuenta del invitado. Un grupo de Microsoft 365 tiene su propia dirección. El cifrado S/MIME no interviene."
  citation: "fuente: `ms-outlook-delegados.html`; «Opciones para delegar una carpeta»"
  difficulty: 2
  tags:
  - "requisito"
