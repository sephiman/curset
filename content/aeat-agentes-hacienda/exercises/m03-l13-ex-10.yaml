  prompt:
    es: "¿De qué plazo dispone el interesado para alegar y presentar documentos, justificantes y pruebas desde la notificación de la propuesta de resolución con la puesta de manifiesto del expediente, según el artículo 210.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
