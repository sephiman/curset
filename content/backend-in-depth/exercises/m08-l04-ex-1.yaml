type: quiz
variants:
- id: m08-l04-q01
  prompt:
    en: In Resilience4j, a `CircuitBreaker` is `OPEN` and the configured wait duration has elapsed. What happens
      next to the `CircuitBreaker`?
  options:
  - id: a
    text:
      en: It changes to `CLOSED` at once, because the elapsed wait duration shows that the backend has recovered
  - id: b
    correct: true
    text:
      en: It changes to `HALF_OPEN` and permits a configurable number of calls to see whether the backend has recovered
  - id: c
    text:
      en: It changes to `HALF_OPEN` and permits every call, because `HALF_OPEN` allows access as `CLOSED` does
  - id: d
    text:
      en: It stays `OPEN` and rejects every call until someone resets it manually
  explanation:
    en: After the wait time duration, the `CircuitBreaker` changes from `OPEN` to `HALF_OPEN` and permits a configurable
      number of calls to see whether the backend has recovered. Changing straight to `CLOSED` is wrong, because
      the state changes back to `CLOSED` only if the failure rate and slow call rate are below the threshold after
      the permitted calls. Permitting every call in `HALF_OPEN` is wrong, because further calls are rejected with
      a `CallNotPermittedException` until all permitted calls have completed. Staying `OPEN` until a manual reset
      is wrong, because the state changes from `OPEN` to `HALF_OPEN` after the wait time duration has elapsed.
  citation: resilience4j-circuitbreaker#failure-rate-and-slow-call-rate-thresholds
- id: m08-l04-q02
  prompt:
    en: In Kafka 4, a producer retries failed requests to a broker with `retry.backoff.max.ms` set. In which range
      does each computed backoff fall after the randomized jitter is applied?
  options:
  - id: a
    text:
      en: Between zero and the computed value
  - id: b
    correct: true
    text:
      en: Between 20% below and 20% above the computed value
  - id: c
    text:
      en: Between the computed value and twice the computed value
  - id: d
    text:
      en: Exactly the computed value, because the jitter applies only once the maximum is reached
  explanation:
    en: A randomized jitter with a factor of 0.2 puts the backoff within a range between 20% below and 20% above
      the computed value. A range from zero to the computed value is wrong, because the jitter keeps the backoff
      within 20% below and 20% above that value. A range from the computed value to twice that value is wrong, because
      the jitter also lowers the backoff below the computed value, by up to 20%. Exactly the computed value is wrong,
      because the jitter is applied to the backoff of every retry to keep clients from being synchronized, not only
      at the maximum.
  citation: kafka-producer-configs#retry.backoff.max.ms
  extract:
    en: a randomized jitter with a factor of 0.2 will be applied to the backoff
- id: m08-l04-q04
  prompt:
    en: How does a Kafka broker measure byte-rate and thread utilization to detect quota violations and correct
      them quickly?
  options:
  - id: a
    text:
      en: Over a few large windows, for example 10 windows of 30 seconds each
  - id: b
    text:
      en: At the cluster level, with a quota shared among all the brokers
  - id: c
    text:
      en: By the client alone, which counts its own requests and throttles itself
  - id: d
    correct: true
    text:
      en: Over multiple small windows, for example 30 windows of 1 second each
  explanation:
    en: Byte-rate and thread utilization are measured over multiple small windows, for example 30 windows of 1 second
      each. A few large windows are wrong, because large measurement windows lead to large bursts of traffic followed
      by long delays. A cluster-wide shared quota is wrong, because Kafka defines quotas per broker, as sharing
      client quota usage among all the brokers would require a mechanism harder to get right than the quota implementation
      itself. Client-only throttling is wrong, because the broker first computes the delay needed to bring the violating
      client under its quota.
  citation: kafka-design#enforcement
  extract:
    en: Byte-rate and thread utilization are measured over multiple small windows (e.g. 30 windows of 1 second each)
      in order to detect and correct quota violations quickly.
- id: m08-l04-q05
  prompt:
    en: In Resilience4j, a `CircuitBreaker` is `CLOSED` with a sliding window size of 15. Twenty concurrent threads
      ask permission to execute a function. How many of them are allowed to invoke it?
  options:
  - id: a
    text:
      en: Fifteen, because the sliding window size caps the number of concurrent calls
  - id: b
    text:
      en: One at a time, because the `CircuitBreaker` synchronizes the function call
  - id: c
    correct: true
    text:
      en: All twenty, because the sliding window does not limit concurrency
  - id: d
    text:
      en: None, because the `CircuitBreaker` rejects calls until the window is full
  explanation:
    en: When the `CircuitBreaker` is closed, all twenty threads are allowed to invoke the function, because the
      sliding window does not limit concurrency. A cap of fifteen is wrong, because the sliding window does not
      mean that only 15 calls are allowed to run concurrently. One at a time is wrong, because the `CircuitBreaker`
      does not synchronize the function call. Rejecting all calls is wrong, because the `CircuitBreaker` rejects
      calls with a `CallNotPermittedException` only when it is `OPEN`.
  citation: resilience4j-circuitbreaker#failure-rate-and-slow-call-rate-thresholds
- id: m08-l04-q06
  prompt:
    en: The program computes six waits of a capped exponential backoff with an initial wait of 1000 ms, a multiplier
      of 2 and a maximum of 10000 ms, then a 0.2 jitter range around the maximum. What does it print?
  options:
  - id: a
    text:
      en: '1000, 2000, 4000, 8000, 16000, 32000

        8000 to 12000'
  - id: b
    text:
      en: '1000, 2000, 3000, 4000, 5000, 6000

        8000 to 12000'
  - id: c
    text:
      en: '1000, 2000, 4000, 8000, 10000, 10000

        0 to 10000'
  - id: d
    correct: true
    text:
      en: '1000, 2000, 4000, 8000, 10000, 10000

        8000 to 12000'
  explanation:
    en: The waits double from 1000 ms and stop growing at the maximum, so the six retries wait 1000, 2000, 4000,
      8000, 10000 and 10000 ms. The jitter factor of 0.2 puts the maximum wait of 10000 ms in the range 8000 to
      12000. The waits 16000 and 32000 are wrong because the multiplier of 2 is capped at the maximum of 10000 ms.
      The waits 3000 to 6000 are wrong because each wait is the previous one times the multiplier, not the previous
      one plus the initial wait. The range 0 to 10000 is wrong because the factor of 0.2 gives 20% below and 20%
      above the computed wait, not zero up to it.
  citation: kafka-producer-configs#retry.backoff.max.ms; resilience4j-retry#use-a-custom-intervalfunction
  extract:
    en: resulting in the backoff falling within a range between 20% below and 20% above the computed value
  snippet: m08-l04/BackoffSchedule.java
- id: m08-l04-q07
  prompt:
    en: In Resilience4j, besides the failure rate reaching its configurable threshold, which condition also changes
      a `CircuitBreaker` from `CLOSED` to `OPEN`?
  options:
  - id: a
    text:
      en: The number of concurrent calls exceeding the sliding window size
  - id: b
    text:
      en: A call being rejected with a `CallNotPermittedException`
  - id: c
    correct: true
    text:
      en: The percentage of slow calls reaching a configurable threshold
  - id: d
    text:
      en: The wait duration elapsing while the `CircuitBreaker` is `CLOSED`
  explanation:
    en: A `CircuitBreaker` also changes from `CLOSED` to `OPEN` when the percentage of slow calls reaches a configurable
      threshold. Concurrent calls above the window size are wrong, because the sliding window does not limit how
      many calls run concurrently. A rejected call is wrong, because the `CircuitBreaker` rejects calls with a `CallNotPermittedException`
      only once it is `OPEN`. An elapsed wait duration is wrong, because it moves the state from `OPEN` to `HALF_OPEN`.
  citation: resilience4j-circuitbreaker#failure-rate-and-slow-call-rate-thresholds
- id: m08-l04-q08
  prompt:
    en: In Resilience4j, a `CircuitBreaker` uses a time-based sliding window of size 10. What does the window aggregate?
  options:
  - id: a
    correct: true
    text:
      en: The outcomes of the calls of the last 10 seconds
  - id: b
    text:
      en: The outcome of the last 10 calls
  - id: c
    text:
      en: The outcome of every call, stored individually for the last 10 seconds
  - id: d
    text:
      en: The outcomes of the calls of the last 10 milliseconds
  explanation:
    en: The time-based sliding window aggregates the outcome of the calls of the last N seconds. The last 10 calls
      is wrong, because that is what the count-based sliding window aggregates. Storing every outcome individually
      is wrong, because the sliding window does not store call outcomes individually. Milliseconds are wrong, because
      every bucket aggregates the outcome of all calls which happen in a certain epoch second.
  citation: resilience4j-circuitbreaker#introduction; resilience4j-circuitbreaker#time-based-sliding-window
- id: m08-l04-q09
  prompt:
    en: In Kafka 4, over which scope is a client quota defined on a broker by default?
  options:
  - id: a
    correct: true
    text:
      en: Per broker, for each unique client group
  - id: b
    text:
      en: Cluster-wide, with the usage shared among all the brokers
  - id: c
    text:
      en: Per topic partition that the client writes to
  - id: d
    text:
      en: Per client, with no grouping of clients that share a quota
  explanation:
    en: The quota is defined on a per-broker basis, for each unique client group. A cluster-wide quota is wrong,
      because Kafka decided that per-broker quotas are much better than a fixed cluster wide bandwidth per client.
      A per-partition quota is wrong, because each unique client group receives a fixed quota as configured by the
      cluster. A per-client quota without grouping is wrong, because quotas are enforced for each group of clients
      sharing a quota.
  citation: kafka-design#enforcement; kafka-design#quotas
  extract:
    en: This quota is defined on a per-broker basis.
