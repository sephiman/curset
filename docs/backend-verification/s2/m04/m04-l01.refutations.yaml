    anchor: kotlin-docs-null-safety#elvis-operator
    sentence: 'If the expression to the left of ?: is not null, the Elvis operator returns it.'
  - option: It is always evaluated first, and its result is dropped when the left-hand side is not null
    anchor: kotlin-docs-null-safety#elvis-operator
    sentence: The expression on the right-hand side is evaluated only if the left-hand side is null.
  - option: It must be a `throw` or `return` expression and never a plain value
    anchor: kotlin-docs-null-safety#elvis-operator
    sentence: Since throw and return are expressions in Kotlin, you can also use them on the right-hand side of the Elvis operator.
