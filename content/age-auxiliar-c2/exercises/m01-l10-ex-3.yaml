    text:
      es: "Por mayoría simple."
  - id: b
    text:
      es: "Por mayoría cualificada."
  - id: c
    correct: true
    text:
      es: "Por unanimidad."
  - id: d
    text:
      es: "Por mayoría de dos tercios."
  explanation:
    es: "La decisión de celebrar una sesión fuera de Bruselas o Luxemburgo, en circunstancias excepcionales y por causas justificadas, requiere unanimidad. La mayoría simple, la cualificada y la de dos tercios no bastan."
  citation: "art. 1.3 Reglamento interno del Consejo"
  difficulty: 3
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: celex-12016m-txt-art-16
