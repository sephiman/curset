  - id: d
    correct: true
    text:
      es: "En el recurso extraordinario de alzada para la unificación de criterio."
  explanation:
    es: "El recurso de unificación de criterio se resuelve en tres meses (art. 242.3). La unificación de doctrina y la revisión tienen seis meses (arts. 243.4 y 244.6). Y el de anulación se resuelve en un mes (art. 241 bis.4)."
