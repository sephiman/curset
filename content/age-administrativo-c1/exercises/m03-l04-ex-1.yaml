    es: "Según el artículo 22.1.c) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos de servicios sociales y otros servicios específicos del anexo IV están sujetos a regulación armonizada desde:"
  options:
  - id: a
    text:
      es: "1.000.000 de euros de valor estimado."
  - id: b
    text:
      es: "216.000 euros de valor estimado."
  - id: c
    text:
      es: "5.404.000 euros de valor estimado."
  - id: d
    correct: true
    text:
      es: "750.000 euros de valor estimado."
  explanation:
    es: "El artículo 22.1.c) LCSP fija «750.000 euros, cuando se trate de contratos que tengan por objeto los servicios sociales y otros servicios específicos enumerados en el anexo IV». Los 216.000 euros son el umbral de la letra b), para los servicios de entidades distintas de la Administración General del Estado. Los 5.404.000 euros son el umbral de obras y concesiones en el artículo 20.1. El apartado 1 del artículo 22 solo fija tres cifras, 140.000, 216.000 y 750.000, y un millón no es ninguna de ellas."
