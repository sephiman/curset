# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0054
  prompt:
    es: "Según el artículo 84.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué personas físicas o jurídicas con la condición de empresarios o profesionales son sujetos pasivos, salvo lo dispuesto en los números siguientes?"
  options:
  - id: a
    text:
      es: "Sean destinatarias de las entregas de bienes o de los servicios sujetos al impuesto."
  - id: b
    text:
      es: "Soporten la repercusión del impuesto en las entregas de bienes o los servicios prestados."
  - id: c
    text:
      es: "Presenten las declaraciones-liquidaciones de las operaciones sujetas al impuesto."
  - id: d
    correct: true
    text:
      es: "Realicen las entregas de bienes o presten los servicios sujetos al impuesto."
  explanation:
    es: "La regla general hace sujeto pasivo al empresario o profesional que realiza la entrega o presta el servicio. Ser destinatario es el supuesto excepcional de los números siguientes, y soportar la repercusión o presentar las declaraciones no define al sujeto pasivo."
  citation: "art. 84.Uno LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0055
  prompt:
    es: "¿En qué entregas de bienes inmuebles es sujeto pasivo el empresario o profesional destinatario, según el artículo 84.Uno.2.º.e) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Como consecuencia de un contrato de arrendamiento con opción de compra."
  - id: b
    text:
      es: "Como consecuencia de un proceso de segregación de la sociedad transmitente."
  - id: c
    correct: true
    text:
      es: "Como consecuencia de un proceso concursal."
  - id: d
    text:
      es: "Como consecuencia de una venta entre empresarios establecidos en España."
  explanation:
    es: "En las entregas de inmuebles efectuadas como consecuencia de un proceso concursal, el sujeto pasivo es el empresario o profesional destinatario. Una venta ordinaria entre empresarios, un arrendamiento con opción de compra o una segregación no figuran en la letra e)."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0056
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de bienes inmuebles en las que, según el artículo 84.Uno.2.º.e) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el sujeto pasivo es el empresario destinatario:"
  options:
  - id: a
    text:
      es: "Las entregas exentas de los apartados 20.º y 22.º del artículo 20.Uno en las que el sujeto pasivo no hubiera renunciado a la exención."
  - id: b
    text:
      es: "Las entregas de inmuebles efectuadas entre personas físicas que no tengan la condición de empresarios o profesionales."
  - id: c
    text:
      es: "Las entregas de inmuebles sujetas y no exentas realizadas por empresarios no establecidos en el territorio de aplicación."
  - id: d
    correct: true
    text:
      es: "Las entregas exentas de los apartados 20.º y 22.º del artículo 20.Uno en las que el sujeto pasivo hubiera renunciado a la exención."
  explanation:
    es: "La inversión alcanza a las entregas exentas de los números 20.º y 22.º del artículo 20.Uno cuando el sujeto pasivo ha renunciado a la exención. Si no renunció, la entrega queda exenta y no hay IVA que ingresar. Las otras dos opciones no son supuestos de la letra e)."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 3
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0057
  prompt:
    es: "Conforme al artículo 84.Uno.2.º.e) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, es también sujeto pasivo el empresario o profesional destinatario en las entregas de bienes inmuebles efectuadas:"
  options:
  - id: a
    correct: true
    text:
      es: "en ejecución de la garantía constituida sobre los bienes inmuebles."
  - id: b
    text:
      es: "en ejecución de una sentencia judicial que condene al transmitente a escriturar."
  - id: c
    text:
      es: "en liquidación de la sociedad conyugal, por adjudicación a uno de los cónyuges."
  - id: d
    text:
      es: "en cumplimiento de una opción de compra pactada en el contrato de arrendamiento."
  explanation:
    es: "La tercera vía de la letra e) son las entregas hechas en ejecución de la garantía constituida sobre el inmueble. La ejecución de una sentencia que ordene escriturar, el ejercicio de una opción de compra y la adjudicación en la liquidación de la sociedad conyugal no están en la lista."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0059
  prompt:
    es: "¿De qué ley debe ser el oro sin elaborar o los productos semielaborados de oro para que el destinatario empresario sea sujeto pasivo, según el artículo 84.Uno.2.º.b) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Igual o superior a 999 milésimas."
  - id: b
    correct: true
    text:
      es: "Igual o superior a 325 milésimas."
  - id: c
    text:
      es: "Igual o superior a 750 milésimas."
  - id: d
    text:
      es: "Inferior a 325 milésimas."
  explanation:
    es: "La inversión afecta al oro sin elaborar o semielaborado de ley igual o superior a 325 milésimas. Las otras leyes son cifras próximas que no recoge la letra b)."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0060
  prompt:
    es: "Conforme al artículo 84.Uno.2.º.d) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, es sujeto pasivo el empresario destinatario en las prestaciones de servicios que tengan por objeto:"
  options:
  - id: a
    correct: true
    text:
      es: "derechos de emisión, reducciones certificadas de emisiones y unidades de reducción de emisiones de gases de efecto invernadero."
  - id: b
    text:
      es: "derechos de aprovechamiento de aguas, concesiones administrativas y autorizaciones de vertido."
  - id: c
    text:
      es: "derechos de propiedad industrial, licencias de patentes y cesiones de marcas registradas."
  - id: d
    text:
      es: "derechos de autor, cesiones de obras audiovisuales y licencias de programas informáticos."
  explanation:
    es: "La letra d) cubre los servicios sobre derechos de emisión, reducciones certificadas y unidades de reducción de emisiones de gases de efecto invernadero. Los derechos de propiedad industrial, de autor o de aprovechamiento de aguas no figuran en ella."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0061
  prompt:
    es: "Según el artículo 84.Uno.2.º.f) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, es sujeto pasivo el empresario destinatario en las ejecuciones de obra, con o sin aportación de materiales, consecuencia de contratos directamente formalizados entre el promotor y el contratista que tengan por objeto:"
  options:
  - id: a
    text:
      es: "la reparación o el mantenimiento de instalaciones de edificaciones ya construidas."
  - id: b
    text:
      es: "la demolición de edificaciones para su sustitución por zonas verdes públicas."
  - id: c
    correct: true
    text:
      es: "la urbanización de terrenos o la construcción o rehabilitación de edificaciones."
  - id: d
    text:
      es: "la adquisición de terrenos o edificaciones destinadas a su posterior reventa."
  explanation:
    es: "La inversión de la letra f) se limita a los contratos entre promotor y contratista de urbanización de terrenos o de construcción o rehabilitación de edificaciones. La reparación de instalaciones, la compra de terrenos para revender y la demolición no están incluidas."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0062
  prompt:
    es: "Conforme al artículo 84.Uno.2.º.g) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en las entregas de teléfonos móviles a un empresario que no sea revendedor, es sujeto pasivo el destinatario cuando el importe total de las entregas efectuadas al mismo, documentadas en la misma factura, exceda de:"
  options:
  - id: a
    correct: true
    text:
      es: "10.000 euros, excluido el Impuesto sobre el Valor Añadido."
  - id: b
    text:
      es: "1.000 euros, excluido el Impuesto sobre el Valor Añadido."
  - id: c
    text:
      es: "10.000 euros, incluido el Impuesto sobre el Valor Añadido."
  - id: d
    text:
      es: "100.000 euros, excluido el Impuesto sobre el Valor Añadido."
  explanation:
    es: "Para el destinatario que no es revendedor, el umbral es 10.000 euros por factura, con el IVA excluido. Con el IVA incluido, o con 1.000 o 100.000 euros, el texto cambia. Si es revendedor, es sujeto pasivo con cualquier importe."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0063
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de consolas de videojuegos, ordenadores portátiles y tabletas digitales según el artículo 84.Uno.2.º.g) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Es sujeto pasivo el destinatario que sea empresario o profesional revendedor de estos bienes, solo si la entrega documentada en una factura supera los 10.000 euros."
  - id: b
    text:
      es: "Es sujeto pasivo el empresario que realiza la entrega, siempre que su destinatario sea un empresario revendedor de estos bienes."
  - id: c
    correct: true
    text:
      es: "Es sujeto pasivo el destinatario que sea empresario o profesional revendedor de estos bienes, cualquiera que sea el importe de la entrega."
  - id: d
    text:
      es: "Es sujeto pasivo el destinatario que no sea empresario ni profesional, si la entrega documentada en una factura supera los 10.000 euros."
  explanation:
    es: "Para el revendedor no hay umbral: es sujeto pasivo cualquiera que sea el importe. El límite de 10.000 euros se aplica al destinatario empresario que no es revendedor. Un destinatario que no sea empresario no puede ser sujeto pasivo por inversión, y en estas entregas el transmitente no es sujeto pasivo."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 3
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0065
  prompt:
    es: "Según el artículo 84.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran establecidos en el territorio de aplicación del impuesto los sujetos pasivos que tengan en el mismo la sede de su actividad económica, su domicilio fiscal o:"
  options:
  - id: a
    text:
      es: "un almacén de bienes en depósito, sin que tenga la condición de establecimiento permanente."
  - id: b
    correct: true
    text:
      es: "un establecimiento permanente que intervenga en la realización de las entregas de bienes y prestaciones de servicios sujetas al impuesto."
  - id: c
    text:
      es: "un establecimiento permanente, aunque no intervenga en la realización de las entregas de bienes o prestaciones de servicios sujetas."
  - id: d
    text:
      es: "un representante nombrado ante la Administración tributaria, aunque carezca de sede, domicilio o establecimiento permanente."
  explanation:
    es: "Además de la sede de la actividad y el domicilio fiscal, basta un establecimiento permanente que intervenga en la realización de las operaciones sujetas. Un establecimiento que no interviene, un representante o un almacén sin carácter de establecimiento permanente no establecen al sujeto pasivo."
  citation: "art. 84.Dos LIVA"
  difficulty: 2
  tags:
  - "sujetos pasivos"
  - "establecimiento"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0066
  prompt:
    es: "Conforme al artículo 84.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, tienen la consideración de sujetos pasivos las herencias yacentes, comunidades de bienes y demás entidades que, careciendo de personalidad jurídica, constituyan una unidad económica o un patrimonio separado susceptible de imposición, cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "realicen operaciones sujetas al impuesto."
  - id: b
    text:
      es: "sean destinatarias de operaciones sujetas realizadas por empresarios no establecidos."
  - id: c
    text:
      es: "hayan comunicado a la Administración tributaria su número de identificación fiscal."
  - id: d
    text:
      es: "superen el volumen de operaciones que fija la ley para ser sujetos pasivos."
  explanation:
    es: "Estas entidades sin personalidad jurídica son sujetos pasivos cuando realizan operaciones sujetas. El precepto no impone un volumen mínimo ni una comunicación previa, y ser destinatarias de operaciones de empresarios no establecidos es otro supuesto."
  citation: "art. 84.Tres LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "entidades sin personalidad"
# anchor: boe-a-1992-28740-art-86
- id: m03-l19-q0067
  prompt:
    es: "Según los artículos 85 y 86.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en las adquisiciones intracomunitarias de bienes y en las importaciones, son sujetos pasivos:"
  options:
  - id: a
    text:
      es: "quienes entreguen los bienes en el Estado de origen."
  - id: b
    correct: true
    text:
      es: "quienes las realicen."
  - id: c
    text:
      es: "quienes los transporten hasta el territorio de aplicación."
  - id: d
    text:
      es: "quienes presenten la declaración de aduanas, en todo caso."
  explanation:
    es: "En ambos casos el sujeto pasivo es quien realiza la adquisición intracomunitaria o la importación. No lo es el transmitente en origen, ni el transportista, ni necesariamente quien presenta la declaración de aduanas."
  citation: "art. 86.Uno LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "importaciones"
# anchor: boe-a-1992-28740-art-87
- id: m03-l19-q0068
  prompt:
    es: "De acuerdo con el artículo 87.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los destinatarios de las operaciones que, mediante acción u omisión culposa o dolosa, eludan la correcta repercusión del impuesto son responsables:"
  options:
  - id: a
    text:
      es: "solidarios de la deuda tributaria que corresponda satisfacer al sujeto pasivo, sin que alcance a la sanción."
  - id: b
    text:
      es: "subsidiarios de la deuda tributaria que corresponda satisfacer al sujeto pasivo, y de la sanción que proceda."
  - id: c
    correct: true
    text:
      es: "solidarios de la deuda tributaria que corresponda satisfacer al sujeto pasivo, y la responsabilidad alcanza a la sanción que pueda proceder."
  - id: d
    text:
      es: "subsidiarios de la deuda tributaria que corresponda satisfacer al sujeto pasivo, sin que alcance a la sanción."
  explanation:
    es: "La responsabilidad es solidaria y alcanza a la sanción que pueda proceder. Las combinaciones con responsabilidad subsidiaria o sin sanción cambian uno de los dos elementos del texto."
  citation: "art. 87.Uno LIVA"
  difficulty: 2
  tags:
  - "responsables"
  - "repercusión"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0120
  prompt:
    es: "De acuerdo con el artículo 84.Uno.2.º.a) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, es sujeto pasivo el empresario o profesional para quien se realicen las operaciones sujetas cuando estas se efectúen por personas o entidades:"
  options:
  - id: a
    text:
      es: "establecidas en el territorio de aplicación del impuesto, salvo en los casos que el propio precepto expresamente enumera."
  - id: b
    text:
      es: "no establecidas en la Comunidad, aunque estén establecidas en el territorio de aplicación del impuesto."
  - id: c
    correct: true
    text:
      es: "no establecidas en el territorio de aplicación del impuesto, salvo en los casos que el propio precepto enumera."
  - id: d
    text:
      es: "no establecidas en el territorio de aplicación del impuesto, sin excepción alguna en ningún caso."
  explanation:
    es: "La inversión se da cuando las operaciones las hacen personas o entidades no establecidas en el territorio de aplicación, con las excepciones que enumera la letra a). Si el transmitente está establecido rige la regla general, y la letra sí prevé excepciones, entre ellas los arrendamientos de inmuebles sujetos y no exentos."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0181
  prompt:
    es: "Conforme al artículo 84.Uno.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, son sujetos pasivos los destinatarios de entregas de gas, electricidad, calor o frío por redes hechas por un empresario no establecido, siempre que le hayan comunicado:"
  options:
  - id: a
    correct: true
    text:
      es: "el número de identificación que, a efectos del IVA, tengan asignado por la Administración española."
  - id: b
    text:
      es: "el volumen de operaciones que hayan realizado durante el año natural inmediato anterior."
  - id: c
    text:
      es: "el número de identificación que, a efectos del IVA, tengan asignado por la Administración de su Estado de establecimiento."
  - id: d
    text:
      es: "el domicilio fiscal que tengan en el territorio de aplicación del impuesto a la fecha de la entrega."
  explanation:
    es: "El destinatario es sujeto pasivo si ha comunicado el número de identificación asignado por la Administración española. Un número de otro Estado, el domicilio fiscal o el volumen de operaciones no son la condición que exige el número 4.º."
  citation: "art. 84.Uno.4.º LIVA"
  difficulty: 3
  tags:
  - "sujetos pasivos"
  - "gas y electricidad"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0196
  prompt:
    es: "Conforme al artículo 84.Uno.2.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, es sujeto pasivo el empresario destinatario en las entregas de desechos nuevos de la industria, desperdicios y desechos de fundición, residuos y demás materiales de recuperación constituidos por:"
  options:
  - id: a
    correct: true
    text:
      es: "metales férricos y no férricos, y otros materiales que enumera la propia letra."
  - id: b
    text:
      es: "metales preciosos y piedras preciosas, y otros materiales que enumera la propia letra."
  - id: c
    text:
      es: "productos agrícolas y ganaderos, y otros materiales que enumera la propia letra."
  - id: d
    text:
      es: "productos textiles y de calzado, y otros materiales que enumera la propia letra."
  explanation:
    es: "La letra c) alcanza a desechos, desperdicios y materiales de recuperación de metales férricos y no férricos y otros que enumera. Los productos agrícolas, los metales y piedras preciosas o los textiles no son su objeto principal."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
# anchor: boe-a-1992-28740-art-84
- id: m03-l19-q0197
  prompt:
    es: "Informática Duero, S.L., empresaria establecida en España, adquiere a un comerciante mayorista, también establecido en España, 30 tabletas digitales para revenderlas por 8.000 euros, IVA excluido, documentadas en una factura. Según el artículo 84.Uno.2.º.g) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿quién es el sujeto pasivo de esa entrega?"
  options:
  - id: a
    text:
      es: "El comerciante mayorista, porque las tabletas no se entregan a un destinatario no establecido."
  - id: b
    text:
      es: "El comerciante mayorista, porque el importe de la entrega no excede de 10.000 euros."
  - id: c
    text:
      es: "Informática Duero, S.L., solo si el importe de la entrega excediera de 10.000 euros."
  - id: d
    correct: true
    text:
      es: "Informática Duero, S.L., porque es un empresario revendedor y no importa el importe de la entrega."
  explanation:
    es: "Para las tabletas, el destinatario revendedor es sujeto pasivo cualquiera que sea el importe, así que los 8.000 euros no impiden la inversión. El límite de 10.000 euros se aplica al destinatario no revendedor, y el establecimiento del transmitente no es el criterio de la letra g)."
  citation: "art. 84.Uno.2.º LIVA"
  difficulty: 3
  tags:
  - "sujetos pasivos"
  - "inversión del sujeto pasivo"
  - "cómputo"
