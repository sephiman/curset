- id: m02-l03-v-deque-ends-001
  prompt:
    en: |-
      What does this program print? The `ArrayDeque` is printed from its first element to its last.

      ```java
      import java.util.ArrayDeque;
      import java.util.Deque;

      public class Main {
          public static void main(String[] args) {
              Deque<Integer> d = new ArrayDeque<>();
              d.push(4);
              d.push(7);
              d.offer(9);
              System.out.println(d.pop() + " " + d);
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`7 [4, 9]`'
    correct: true
  - id: b
    text:
      en: '`9 [7, 4]`'
  - id: c
    text:
      en: '`7 [7, 4, 9]`'
  - id: d
    text:
      en: '`4 [7, 9]`'
  explanation:
    en: 'In this program `push` inserts 4 at the beginning of the deque, `push` inserts 7 at the beginning and `offer` inserts
      9 at the end, which leaves the deque in the order that `pop` then reads. Removing and reading differ: `pop` and `pollLast`
      remove the first and the last element, and `peek` returns the first element and leaves it in place. The program prints
      `7 [4, 9]`. `9 [7, 4]` comes from this mistake: assuming `offer` adds at the beginning of the deque. `offer` inserts
      at the end of the deque. `7 [7, 4, 9]` comes from this mistake: forgetting that `pop` removes the element it returns.
      `pop` removes the first element from the deque. `4 [7, 9]` comes from this mistake: treating the second call as an insertion
      at the end. `push` inserts at the beginning of the deque.'
  family: deque-ends
  code_reading: true
  citation: javadoc-deque#interface-deque-e
  difficulty: 2
  tags: &id001
