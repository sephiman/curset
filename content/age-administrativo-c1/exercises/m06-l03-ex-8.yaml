# anchor: fuente-ms-win-bloc-notas-html
- id: m06-l03-q273
  prompt:
    es: "Señale la afirmación correcta sobre la configuración del encabezado y del pie de página del Bloc de notas de Windows 11:"
  options:
  - id: a
    correct: true
    text:
      es: "No se guarda: hay que indicarla de nuevo cada vez que se imprime un documento"
  - id: b
    text:
      es: "Se guarda y se aplica a todos los documentos que se impriman después"
  - id: c
    text:
      es: "Se guarda solo junto con el archivo de texto en el que se configuró"
  - id: d
    text:
      es: "Se guarda hasta que se cierra el Bloc de notas y después se borra"
  explanation:
    es: "La nota de la página dice que no es posible guardar esta configuración, por lo que hay que especificarla manualmente cada vez que se desea imprimir un documento. Las otras afirmaciones la hacen persistir de algún modo."
  citation: "fuente: `ms-win-bloc-notas.html`; «Cómo cambio el encabezado y el pie de página en el Bloc de notas»"
