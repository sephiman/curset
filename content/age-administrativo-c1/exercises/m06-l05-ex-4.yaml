  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m06-l05-q116
  prompt:
    es: "En Excel 365, con la configuración predeterminada, el 1 de enero de 2008 es el número de serie 39448. ¿Qué número de serie tiene el 2 de enero de 2008?"
  options:
  - id: a
    text:
      es: "39447"
  - id: b
    text:
      es: "39450"
  - id: c
    text:
      es: "39458"
  - id: d
    correct: true
    text:
      es: "39449"
  explanation:
    es: "Los números de serie son secuenciales y el 1 de enero de 2008 es el 39448, así que el día siguiente es el 39449. El 39447 sería el día anterior y el 39450 el 3 de enero; el 39458 está diez días después del 1 de enero."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
  - "cantidad"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q117
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes entradas inserta una fecha que se actualiza a la fecha actual cada vez que se reabre la hoja?"
  options:
  - id: a
    text:
      es: "=DIA(A1)"
  - id: b
    correct: true
    text:
      es: "=HOY()"
  - id: c
    text:
      es: "=DIA(HOY())"
  - id: d
    text:
      es: "=FECHA(2026;2;2)"
  explanation:
    es: "Para una fecha que se actualiza al reabrir la hoja o recalcular se escribe =HOY(). DIA devuelve solo el día, un entero de 1 a 31, y FECHA da la fecha concreta que indican sus argumentos."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Para introducir una fecha que se actualizará a la fecha actual cada vez que vuelva a abrir una hoja de cálculo o vuelva a calcular una fórmula, escriba =HOY() en una celda vacía y, a continuación, presione ENTRAR.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q118
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes códigos de formato personalizado muestra los meses como ene-dic?"
  options:
  - id: a
    text:
      es: "mm"
  - id: b
    text:
      es: "mmmm"
  - id: c
    text:
      es: "mmmmm"
  - id: d
    correct: true
    text:
      es: "mmm"
  explanation:
    es: "El código mmm muestra los meses como ene-dic. mm los muestra como 01-12, mmmm como enero-diciembre y mmmmm como la inicial de cada mes."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Los meses como ene-dic — mmm»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q119
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes códigos de formato personalizado muestra los años con dos cifras, de 00 a 99?"
  options:
  - id: a
    correct: true
    text:
      es: "aa"
  - id: b
    text:
      es: "aaaa"
  - id: c
    text:
      es: "dd"
  - id: d
    text:
      es: "mm"
  explanation:
    es: "El código aa muestra los años como 00-99, mientras que aaaa los muestra como 1900-9999. dd da los días como 01-31 y mm los meses como 01-12."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Crear un formato de fecha personalizado»"
  difficulty: 1
  tags:
  - "concepto"
