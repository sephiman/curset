# anchor: boe-a-1982-5196-art-22
- id: m01-l03-q098
  prompt:
    es: "Conforme al artículo 22 del Reglamento del Congreso de 10 de febrero de 1982, el Diputado pierde su condición por renuncia presentada ante:"
  options:
  - id: a
    correct: true
    text:
      es: "La Mesa del Congreso."
  - id: b
    text:
      es: "La Junta de Portavoces."
  - id: c
    text:
      es: "La Junta Electoral Central."
  - id: d
    text:
      es: "El Pleno de la Cámara."
  explanation:
    es: "La renuncia se presenta ante la Mesa del Congreso, que es el órgano rector de la Cámara. La Junta de Portavoces reúne a los portavoces de los grupos, la Junta Electoral Central es un órgano electoral ajeno al Congreso y el Pleno no recibe la renuncia: ante él no se presenta."
  citation: "art. 22 Reglamento del Congreso"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1982-5196-art-22
- id: m01-l03-q099
  prompt:
    es: "Conforme al artículo 22 del Reglamento del Congreso de 10 de febrero de 1982, el Diputado pierde su condición por fallecimiento o incapacitación, y esta última debe estar declarada por:"
  options:
  - id: a
    correct: true
    text:
      es: "Decisión judicial firme."
  - id: b
    text:
      es: "Resolución de la Mesa del Congreso."
  - id: c
    text:
      es: "Acuerdo del Pleno de la Cámara."
  - id: d
    text:
      es: "Informe médico del servicio de salud de la Cámara."
  explanation:
    es: "El artículo 22.2.º exige que la incapacitación esté declarada por decisión judicial firme. La Mesa, el Pleno o un informe médico de la Cámara no la declaran: la incapacitación es una declaración judicial."
  citation: "art. 22 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-72
- id: m01-l03-q100
  prompt:
    es: "Según la Constitución Española de 1978, los Reglamentos de las Cámaras y su reforma serán sometidos a una votación final sobre su totalidad, que requerirá:"
  options:
  - id: a
    text:
      es: "La mayoría simple de la Cámara."
  - id: b
    text:
      es: "Las tres quintas partes de la Cámara."
  - id: c
    correct: true
    text:
      es: "La mayoría absoluta de la Cámara."
  - id: d
    text:
      es: "Las dos terceras partes de la Cámara."
  explanation:
    es: "El artículo 72.1 exige mayoría absoluta en la votación final sobre la totalidad del Reglamento y de su reforma. La simple no basta, y los tres quintos y los dos tercios son mayorías que la Constitución reserva a otros acuerdos, como la reforma constitucional del artículo 167."
  citation: "art. 72.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-72
- id: m01-l03-q101
  prompt:
    es: "Según el artículo 72.1 de la Constitución Española de 1978, las Cámaras establecen sus propios Reglamentos, aprueban autónomamente sus presupuestos y, de común acuerdo, regulan:"
  options:
  - id: a
    text:
      es: "El Reglamento de las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "El Estatuto del Personal de las Cortes Generales."
  - id: c
    text:
      es: "El régimen de las sesiones extraordinarias."
  - id: d
    text:
      es: "El régimen electoral general."
  explanation:
    es: "El artículo 72.1 distingue lo que cada Cámara hace por separado de lo que regulan de común acuerdo: el Estatuto del Personal de las Cortes Generales. El Reglamento de las Cortes Generales se aprueba por mayoría absoluta de cada Cámara (artículo 72.2), el de las sesiones extraordinarias lo fija el artículo 73.2 y el régimen electoral general es materia de ley orgánica."
  citation: "art. 72.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-72
- id: m01-l03-q102
  prompt:
    es: "¿Cuál de los siguientes cargos preside las sesiones conjuntas de las Cámaras de las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Presidente del Senado."
  - id: b
    text:
      es: "El Presidente del Gobierno."
  - id: c
    text:
      es: "El Presidente de la Diputación Permanente."
  - id: d
    correct: true
    text:
      es: "El Presidente del Congreso."
  explanation:
    es: "El artículo 72.2 reserva la presidencia de las sesiones conjuntas al Presidente del Congreso. El del Senado preside su propia Cámara. El Presidente del Gobierno y el de la Diputación Permanente no presiden esas sesiones."
  citation: "art. 72.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-72
- id: m01-l03-q103
  prompt:
    es: "Conforme al artículo 72.2 de la Constitución Española de 1978, las sesiones conjuntas se regirán por un Reglamento de las Cortes Generales aprobado por:"
  options:
  - id: a
    text:
      es: "Mayoría simple de cada Cámara."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta de cada Cámara."
  - id: c
    text:
      es: "Mayoría absoluta del Congreso."
  - id: d
    text:
      es: "Dos tercios de ambas Cámaras en sesión conjunta."
  explanation:
    es: "El artículo 72.2 exige mayoría absoluta de cada Cámara. La simple no alcanza, y la absoluta solo del Congreso ignora al Senado. Los dos tercios en sesión conjunta cambian la mayoría y el modo de votar: el Reglamento se aprueba en cada Cámara por separado."
  citation: "art. 72.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-72
- id: m01-l03-q104
  prompt:
    es: "¿Cuál de las siguientes facultades ejercen los Presidentes de las Cámaras, en nombre de estas y en el interior de sus sedes, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Solo los poderes administrativos, sin facultades de policía."
  - id: b
    text:
      es: "Las facultades de policía, mientras que los poderes administrativos corresponden a la Mesa."
  - id: c
    text:
      es: "Los poderes administrativos y las facultades de policía, con autorización del Gobierno."
  - id: d
    correct: true
    text:
      es: "Todos los poderes administrativos y facultades de policía."
  explanation:
    es: "El artículo 72.3 les atribuye todos los poderes administrativos y las facultades de policía en el interior de las sedes, en nombre de la Cámara. La opción que excluye la policía y la que reparte los poderes con la Mesa recortan el texto. La autorización del Gobierno contradice la autonomía de las Cámaras."
  citation: "art. 72.3 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-73
- id: m01-l03-q105
  prompt:
    es: "Conforme al artículo 73.1 de la Constitución Española de 1978, el primero de los dos períodos ordinarios de sesiones de las Cámaras va:"
  options:
  - id: a
    correct: true
    text:
      es: "De septiembre a diciembre."
  - id: b
    text:
      es: "De octubre a diciembre."
  - id: c
    text:
      es: "De septiembre a enero."
  - id: d
    text:
      es: "De septiembre a noviembre."
  explanation:
    es: "El artículo 73.1 fija el primer período ordinario de septiembre a diciembre. Las otras tres opciones acortan o alargan el período en un mes por cada extremo."
  citation: "art. 73.1 CE"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-1978-31229-art-73
- id: m01-l03-q106
  prompt:
    es: "¿En cuál de los siguientes meses NO se reúnen las Cámaras de las Cortes Generales en período ordinario de sesiones, dentro del calendario anual de sesiones?"
  options:
  - id: a
    text:
      es: "Octubre."
  - id: b
    text:
      es: "Marzo."
  - id: c
    correct: true
    text:
      es: "Enero."
  - id: d
    text:
      es: "Junio."
  explanation:
    es: "Los períodos ordinarios van de septiembre a diciembre y de febrero a junio, de modo que enero queda entre los dos y no pertenece a ninguno. Octubre cae dentro del primero, y marzo y junio dentro del segundo."
  citation: "art. 73.1 CE"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-1978-31229-art-73
- id: m01-l03-q107
  prompt:
    es: "¿Cuál de las siguientes combinaciones de solicitantes puede pedir que las Cámaras se reúnan en sesiones extraordinarias, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Gobierno, el Rey o la mayoría absoluta de los miembros del Congreso."
  - id: b
    text:
      es: "El Presidente de la Cámara, el Gobierno o una quinta parte de sus miembros."
  - id: c
    correct: true
    text:
      es: "El Gobierno, la Diputación Permanente o la mayoría absoluta de los miembros de cualquiera de las Cámaras."
  - id: d
    text:
      es: "La Diputación Permanente, la Junta de Portavoces o dos grupos parlamentarios."
  explanation:
    es: "El artículo 73.2 legitima al Gobierno, a la Diputación Permanente y a la mayoría absoluta de los miembros de cualquiera de las Cámaras. El Rey no pide sesiones extraordinarias. La quinta parte de los miembros, la Junta de Portavoces y los dos grupos parlamentarios son cifras y órganos del Reglamento del Congreso, no los peticionarios que fija el artículo 73.2."
  citation: "art. 73.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-73
- id: m01-l03-q108
  prompt:
    es: "Conforme al artículo 73.2 de la Constitución Española de 1978, las sesiones extraordinarias deberán convocarse sobre un orden del día determinado y serán clausuradas:"
  options:
  - id: a
    correct: true
    text:
      es: "Una vez que este haya sido agotado."
  - id: b
    text:
      es: "Al cumplirse un mes desde su apertura."
  - id: c
    text:
      es: "Cuando lo decida el Gobierno."
  - id: d
    text:
      es: "Al iniciarse el siguiente período ordinario."
  explanation:
    es: "El artículo 73.2 liga el fin de la sesión extraordinaria a que se agote el orden del día. No hay un plazo de un mes. La decisión del Gobierno no la cierra: el Gobierno puede pedirla, no clausurarla. Tampoco el inicio del siguiente período ordinario."
  citation: "art. 73.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-74
- id: m01-l03-q110
  prompt:
    es: "¿Cuál de los siguientes órganos inicia el procedimiento de la decisión de las Cortes Generales sobre los tratados que exigen su autorización previa, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Senado."
  - id: b
    correct: true
    text:
      es: "El Congreso de los Diputados."
  - id: c
    text:
      es: "El Gobierno."
  - id: d
    text:
      es: "La Comisión Mixta Congreso-Senado."
  explanation:
    es: "Para los tratados del artículo 94.1 el procedimiento empieza en el Congreso, y para los acuerdos de cooperación entre Comunidades Autónomas y el Fondo de Compensación empieza en el Senado. El Gobierno no inicia el procedimiento de esa decisión. La Comisión Mixta solo interviene si Senado y Congreso no se ponen de acuerdo."
  citation: "art. 74.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-74
- id: m01-l03-q111
  prompt:
    es: "Conforme al artículo 74.2 de la Constitución Española de 1978, si el texto de la Comisión Mixta no se aprueba en la forma establecida por ambas Cámaras, decidirá:"
  options:
  - id: a
    text:
      es: "El Senado, por mayoría absoluta."
  - id: b
    text:
      es: "El Congreso, por mayoría simple."
  - id: c
    text:
      es: "Las Cortes Generales, en sesión conjunta."
  - id: d
    correct: true
    text:
      es: "El Congreso, por mayoría absoluta."
  explanation:
    es: "El artículo 74.2 atribuye la decisión final al Congreso, por mayoría absoluta. El Senado no decide en ese caso. La mayoría simple rebaja la exigencia, y la sesión conjunta no es el cauce del precepto."
  citation: "art. 74.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-75
- id: m01-l03-q112
  prompt:
    es: "Conforme al artículo 75.1 de la Constitución Española de 1978, las Cámaras funcionan en Pleno y, además, de otra de las siguientes formas:"
  options:
  - id: a
    text:
      es: "Por Ponencias."
  - id: b
    correct: true
    text:
      es: "Por Comisiones."
  - id: c
    text:
      es: "Por Delegaciones."
  - id: d
    text:
      es: "Por Grupos de trabajo."
  explanation:
    es: "El artículo 75.1 dice que las Cámaras funcionan en Pleno y por Comisiones. Las Ponencias, las Delegaciones y los Grupos de trabajo no son la forma de funcionamiento que el artículo fija junto al Pleno."
  citation: "art. 75.1 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-75
- id: m01-l03-q113
  prompt:
    es: "Conforme al artículo 75.2 de la Constitución Española de 1978, las Cámaras podrán delegar en las Comisiones Legislativas Permanentes la aprobación de:"
  options:
  - id: a
    text:
      es: "Los Reglamentos de las Cámaras."
  - id: b
    text:
      es: "Los Presupuestos Generales del Estado."
  - id: c
    correct: true
    text:
      es: "Proyectos o proposiciones de ley."
  - id: d
    text:
      es: "Los tratados internacionales."
  explanation:
    es: "El artículo 75.2 permite delegar la aprobación de proyectos o proposiciones de ley. Los Presupuestos Generales del Estado y las cuestiones internacionales quedan exceptuados de la delegación por el apartado 3. Los Reglamentos de las Cámaras se aprueban en votación final sobre su totalidad con mayoría absoluta (artículo 72.1)."
  citation: "art. 75.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-76
- id: m01-l03-q115
  prompt:
    es: "Señale la respuesta correcta sobre las conclusiones de las Comisiones de investigación que nombren las Cámaras, según el artículo 76.1 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "No son vinculantes para los Tribunales ni afectan a las resoluciones judiciales."
  - id: b
    text:
      es: "Son vinculantes para los Tribunales, que deben ejecutarlas."
  - id: c
    text:
      es: "Son vinculantes para el Gobierno, pero no para los Tribunales."
  - id: d
    text:
      es: "Afectan a las resoluciones judiciales cuando las apruebe el Pleno."
  explanation:
    es: "El artículo 76.1 niega a las conclusiones valor vinculante para los Tribunales y efecto sobre las resoluciones judiciales. Las opciones que las hacen vinculantes para los Tribunales o para el Gobierno, o que les dan efecto sobre las resoluciones con la aprobación del Pleno, contradicen ese texto."
  citation: "art. 76.1 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-76
- id: m01-l03-q116
  prompt:
    es: "Señale la respuesta correcta sobre quién puede nombrar Comisiones de investigación sobre cualquier asunto de interés público, según el artículo 76.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Solo el Congreso de los Diputados."
  - id: b
    text:
      es: "El Gobierno, previa autorización del Congreso."
  - id: c
    correct: true
    text:
      es: "El Congreso y el Senado, y, en su caso, ambas Cámaras conjuntamente."
  - id: d
    text:
      es: "El Defensor del Pueblo, a propuesta de la Comisión Mixta."
  explanation:
    es: "El artículo 76.1 faculta al Congreso, al Senado y, en su caso, a ambas Cámaras conjuntamente. No lo limita al Congreso. El Gobierno y el Defensor del Pueblo no nombran Comisiones de investigación: son las Cámaras quienes lo hacen."
  citation: "art. 76.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-77
- id: m01-l03-q117
  prompt:
    es: "Conforme al artículo 77.1 de la Constitución Española de 1978, las Cámaras pueden recibir peticiones individuales y colectivas, siempre por escrito, quedando prohibida:"
  options:
  - id: a
    text:
      es: "La presentación individual sin firma notarial."
  - id: b
    correct: true
    text:
      es: "La presentación directa por manifestaciones ciudadanas."
  - id: c
    text:
      es: "La presentación por medios electrónicos."
  - id: d
    text:
      es: "La presentación de peticiones colectivas de más de cien personas."
  explanation:
    es: "El artículo 77.1 prohíbe la presentación directa por manifestaciones ciudadanas. Admite peticiones individuales y colectivas, siempre por escrito, de modo que ninguna limitación por firma notarial, por medio electrónico o por número de firmantes está en el texto."
  citation: "art. 77.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q119
  prompt:
    es: "¿Cuál de las siguientes es una de las funciones de las Diputaciones Permanentes, conforme al artículo 78.2 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Aprobar los Presupuestos Generales del Estado en ausencia del Pleno."
  - id: b
    correct: true
    text:
      es: "Velar por los poderes de las Cámaras cuando no estén reunidas."
  - id: c
    text:
      es: "Disolver las Cámaras cuando lo pida el Gobierno."
  - id: d
    text:
      es: "Sancionar las leyes aprobadas por las Cortes Generales."
  explanation:
    es: "El artículo 78.2 encomienda a las Diputaciones Permanentes velar por los poderes de las Cámaras cuando no estén reunidas, además de pedir sesiones extraordinarias y asumir las facultades de los artículos 86 y 116 si las Cámaras han sido disueltas o ha expirado su mandato. Aprobar los Presupuestos es una función del Pleno de las Cortes, y el artículo 75.3 excluye esa materia incluso de la delegación en Comisiones. La disolución depende del Gobierno, no de ellas. La sanción de las leyes corresponde al Rey (artículo 91)."
  citation: "art. 78.2 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q120
  prompt:
    es: "Conforme al artículo 78.2 de la Constitución Española de 1978, las Diputaciones Permanentes asumen las facultades que correspondan a las Cámaras según los artículos 86 y 116 cuando estas:"
  options:
  - id: a
    text:
      es: "Estén celebrando un período ordinario de sesiones."
  - id: b
    text:
      es: "Hayan sido convocadas en sesión extraordinaria."
  - id: c
    text:
      es: "Hayan agotado el orden del día de la sesión en curso."
  - id: d
    correct: true
    text:
      es: "Hayan sido disueltas o haya expirado su mandato."
  explanation:
    es: "El artículo 78.2 limita esa asunción de facultades al supuesto de disolución de las Cámaras o expiración de su mandato. Mientras hay período ordinario o sesión extraordinaria, las Cámaras ejercen por sí mismas sus facultades. Agotar el orden del día solo cierra la sesión extraordinaria (artículo 73.2)."
  citation: "art. 78.2 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-1982-5196-art-85
- id: m01-l03-q121
  prompt:
    es: "Según el Reglamento del Congreso de 10 de febrero de 1982, las votaciones de investidura, de moción de censura y de cuestión de confianza son en todo caso:"
  options:
  - id: a
    correct: true
    text:
      es: "Públicas por llamamiento."
  - id: b
    text:
      es: "Secretas, por papeletas."
  - id: c
    text:
      es: "Públicas, a mano alzada."
  - id: d
    text:
      es: "Secretas, si lo piden dos grupos parlamentarios."
  explanation:
    es: "El artículo 85.2 manda que esas tres votaciones sean en todo caso públicas por llamamiento. La votación secreta por papeletas o a petición de dos grupos queda excluida para ellas. La votación a mano alzada no es la modalidad de llamamiento que el artículo establece."
  citation: "art. 85 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "procedimiento"
