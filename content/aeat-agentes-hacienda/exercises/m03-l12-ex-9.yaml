# anchor: boe-a-2003-23186-art-175
- id: m03-l12-q0257
  prompt:
    es: "Conforme al artículo 175.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la afirmación INCORRECTA sobre la certificación de deudas que puede solicitar quien pretende adquirir la titularidad de explotaciones y actividades económicas:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración debe expedirla en el plazo de seis meses desde la solicitud, sin necesidad de conformidad del titular actual."
  - id: b
    text:
      es: "La responsabilidad del adquirente queda limitada a las deudas, sanciones y responsabilidades contenidas en la certificación que expide la Administración."
  - id: c
    text:
      es: "Se solicita para limitar la responsabilidad solidaria del artículo 42.1.c, previa la conformidad del titular actual."
  - id: d
    text:
      es: "Si no se facilita en el plazo señalado, el solicitante queda exento de la responsabilidad del artículo 42.1.c."
  explanation:
    es: "El plazo es de tres meses y se exige la conformidad del titular actual, así que es incorrecta la opción que habla de seis meses sin esa conformidad (art. 175.2 LGT). Las otras tres afirmaciones son exactas."
  citation: "art. 175.2 LGT"
  difficulty: 2
  tags:
