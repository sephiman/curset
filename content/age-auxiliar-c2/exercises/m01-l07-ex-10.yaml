# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q150
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en el caso de las infracciones muy graves se impondrán, en todo caso:"
  options:
  - id: a
    text:
      es: "Las sanciones previstas para las infracciones leves, con carácter acumulativo."
  - id: b
    correct: true
    text:
      es: "Las sanciones previstas para las infracciones graves."
  - id: c
    text:
      es: "Únicamente la destitución del cargo."
  - id: d
    text:
      es: "La inhabilitación absoluta para cargo público."
  explanation:
    es: "Las infracciones muy graves llevan en todo caso las sanciones previstas para las graves, a las que el artículo 30.4 suma la destitución y la prohibición de ser nombrado alto cargo. La amonestación de las leves no es la base, la destitución no es la única sanción y la ley no prevé la inhabilitación absoluta."
  citation: "art. 30.3 Ley 19/2013"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-28
- id: m01-l07-q151
  prompt:
    es: "Conforme al artículo 28 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, es infracción muy grave en materia de gestión económico-presupuestaria, cuando sea culpable:"
  options:
  - id: a
    text:
      es: "El retraso en la aprobación del presupuesto anual."
  - id: b
    text:
      es: "La reclamación de intereses por pagos aplazados."
  - id: c
    correct: true
    text:
      es: "La incursión en alcance en la administración de los fondos públicos."
  - id: d
    text:
      es: "La elaboración tardía del inventario de bienes inmuebles de la Administración."
  explanation:
    es: "La letra a) del artículo 28 tipifica la incursión en alcance en la administración de los fondos públicos. Retrasar la aprobación del presupuesto, reclamar intereses por pagos aplazados o elaborar tarde el inventario de bienes inmuebles no figuran en la lista del artículo."
  citation: "art. 28 Ley 19/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-5
- id: m01-l07-q152
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los sujetos enumerados en el artículo 2.1 publicarán la información relevante:"
  options:
  - id: a
    text:
      es: "Solo a petición de los interesados."
  - id: b
    text:
      es: "Previa solicitud individual."
  - id: c
    correct: true
    text:
      es: "De forma periódica y actualizada."
  - id: d
    text:
      es: "Una sola vez, al constituirse el órgano."
  explanation:
    es: "El artículo 5.1 manda publicar la información relevante de forma periódica y actualizada. La publicidad activa se hace sin que nadie la pida: la publicación a petición de los interesados y la que exige una solicitud individual describen el derecho de acceso, que regula otro capítulo. Publicar una sola vez, al constituirse el órgano, tampoco cumple con la obligación de mantenerla al día."
  citation: "art. 5.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-5
- id: m01-l07-q153
  prompt:
    es: "Según el artículo 5.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué requisito previo exige la ley para publicar información que contenga datos especialmente protegidos?"
  options:
  - id: a
    correct: true
    text:
      es: "La disociación previa de esos datos."
  - id: b
    text:
      es: "Un informe previo del Consejo."
  - id: c
    text:
      es: "La autorización expresa de la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "La resolución motivada del titular del órgano competente."
  explanation:
    es: "El artículo 5.3 dice que, cuando la información contenga datos especialmente protegidos, la publicidad solo se llevará a cabo previa disociación de los datos. El informe del Consejo, la autorización de la Agencia Española de Protección de Datos y la resolución motivada del titular del órgano son trámites que ese apartado no prevé: lo que exige es separar los datos de la persona a la que se refieren."
  citation: "art. 5.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-8
- id: m01-l07-q154
  prompt:
    es: "Señale qué resoluciones sobre los empleados públicos deben hacer públicas, como información económica, los sujetos del título I según el artículo 8.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "Las de sanción disciplinaria impuestas en cada órgano."
  - id: b
    text:
      es: "Las de concesión de permisos y licencias solicitados."
  - id: c
    text:
      es: "Las de evaluación del desempeño de cada año natural."
  - id: d
    correct: true
    text:
      es: "Las de autorización o reconocimiento de compatibilidad."
  explanation:
    es: "El artículo 8.1.g) obliga a publicar las resoluciones de autorización o reconocimiento de compatibilidad que afecten a los empleados públicos. Las sanciones disciplinarias, los permisos y licencias y las evaluaciones del desempeño no figuran en la lista de información económica, presupuestaria y estadística del apartado."
  citation: "art. 8.1.g) Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-8
- id: m01-l07-q155
  prompt:
    es: "Conforme al artículo 8.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los sujetos del título I deben hacer públicas, respecto de los representantes locales:"
  options:
  - id: a
    text:
      es: "Las declaraciones trimestrales de ingresos y gastos."
  - id: b
    correct: true
    text:
      es: "Las declaraciones anuales de bienes y actividades."
  - id: c
    text:
      es: "Los informes anuales de gestión y de resultados."
  - id: d
    text:
      es: "Las memorias semestrales de actividad institucional."
  explanation:
    es: "La letra h) del artículo 8.1 incluye las declaraciones anuales de bienes y actividades de los representantes locales. Las declaraciones trimestrales de ingresos y gastos, los informes anuales de gestión y las memorias semestrales de actividad no aparecen en la lista de ese apartado."
  citation: "art. 8.1.h) Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-11
- id: m01-l07-q156
  prompt:
    es: "Señale los principios técnicos que, según el artículo 11 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, rigen las prescripciones del Portal de la Transparencia:"
  options:
  - id: a
    text:
      es: "Accesibilidad, publicidad y reutilización."
  - id: b
    text:
      es: "Interoperabilidad, gratuidad y reutilización."
  - id: c
    text:
      es: "Accesibilidad, interoperabilidad y universalidad."
  - id: d
    correct: true
    text:
      es: "Accesibilidad, interoperabilidad y reutilización."
  explanation:
    es: "El artículo 11 enumera tres principios técnicos: accesibilidad, interoperabilidad y reutilización. Cada una de las otras ternas cambia uno de ellos por un término ajeno al artículo: publicidad, gratuidad o universalidad."
  citation: "art. 11 Ley 19/2013"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2013-12887-art-12
- id: m01-l07-q157
  prompt:
    es: "Conforme al artículo 12 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho a acceder a la información pública corresponde a:"
  options:
  - id: a
    text:
      es: "Los interesados."
  - id: b
    correct: true
    text:
      es: "Todas las personas."
  - id: c
    text:
      es: "Los ciudadanos españoles mayores de edad que acrediten un interés legítimo."
  - id: d
    text:
      es: "Los solicitantes que motiven su petición ante el órgano competente."
  explanation:
    es: "El artículo 12 reconoce el derecho de acceso a todas las personas. No limita el derecho a los interesados, a los ciudadanos españoles con interés legítimo ni a quienes motiven la petición: el artículo 17.3 dice incluso que el solicitante no está obligado a motivarla."
  citation: "art. 12 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q158
  prompt:
    es: "Según el artículo 14.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿a qué debe ser proporcionada la aplicación de los límites al derecho de acceso?"
  options:
  - id: a
    correct: true
    text:
      es: "A su objeto y finalidad de protección."
  - id: b
    text:
      es: "Al volumen de información que se solicita."
  - id: c
    text:
      es: "Al coste que suponga la tramitación de cada solicitud."
  - id: d
    text:
      es: "Al número de solicitudes."
  explanation:
    es: "Según el artículo 14.2, la aplicación de los límites será justificada y proporcionada a su objeto y finalidad de protección. El volumen de la información solo cuenta para ampliar el plazo de resolución, en el artículo 20.1. El coste de tramitación y el número de solicitudes recibidas no figuran como criterio de proporcionalidad."
  citation: "art. 14.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q159
  prompt:
    es: "Conforme al artículo 17.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la solicitud de acceso debe permitir tener constancia de una dirección de contacto, preferentemente:"
  options:
  - id: a
    text:
      es: "Postal con acuse de recibo."
  - id: b
    text:
      es: "Telefónica."
  - id: c
    correct: true
    text:
      es: "Electrónica."
  - id: d
    text:
      es: "Presencial en la sede del órgano."
  explanation:
    es: "El artículo 17.2.c) pide una dirección de contacto, preferentemente electrónica, a efectos de comunicaciones. La dirección postal con acuse de recibo, el contacto telefónico y la presencia en la sede del órgano son medios que el artículo no prefiere."
  citation: "art. 17.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-23
- id: m01-l07-q162
  prompt:
    es: "Conforme al artículo 23.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, contra las resoluciones del Congreso o del Tribunal Constitucional en materia de acceso cabe:"
  options:
  - id: a
    text:
      es: "Una reclamación potestativa ante el Consejo."
  - id: b
    text:
      es: "El recurso de alzada ante el superior jerárquico."
  - id: c
    correct: true
    text:
      es: "Solo la interposición de recurso contencioso-administrativo."
  - id: d
    text:
      es: "La reclamación obligatoria ante el Consejo."
  explanation:
    es: "Para las resoluciones de los órganos del artículo 2.1.f), entre ellos el Congreso y el Tribunal Constitucional, el artículo 23.2 solo permite el recurso contencioso-administrativo. Excluye así la reclamación ante el Consejo, sea potestativa u obligatoria, y el recurso de alzada ante un superior jerárquico."
  citation: "art. 23.2 Ley 19/2013"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q163
  prompt:
    es: "Conforme al artículo 24.6 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la competencia para conocer de las reclamaciones corresponde al Consejo de Transparencia y Buen Gobierno, salvo que:"
  options:
  - id: a
    text:
      es: "El Defensor del Pueblo la reclame para sí por razón de la materia."
  - id: b
    correct: true
    text:
      es: "Una Comunidad Autónoma la atribuya a un órgano específico."
  - id: c
    text:
      es: "El solicitante renuncie por escrito a la vía contencioso-administrativa."
  - id: d
    text:
      es: "El Gobierno la reserve por Real Decreto a un ministerio."
  explanation:
    es: "El artículo 24.6 atribuye la competencia al Consejo, salvo en los supuestos en que las Comunidades Autónomas la atribuyan a un órgano específico, de acuerdo con la disposición adicional cuarta. La ley no deja que el Defensor del Pueblo, la renuncia del solicitante a la vía judicial o una reserva del Gobierno por Real Decreto desplacen esa competencia."
  citation: "art. 24.6 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2013-12887-art-25
- id: m01-l07-q164
  prompt:
    es: "Conforme al artículo 25.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el título II se aplica en la Administración General del Estado a:"
  options:
  - id: a
    text:
      es: "Los miembros del Gobierno, los Secretarios de Estado y todos los empleados públicos."
  - id: b
    text:
      es: "Solo los miembros del Gobierno y los Secretarios de Estado."
  - id: c
    text:
      es: "Los altos cargos y los funcionarios de los Cuerpos Superiores de la Administración."
  - id: d
    correct: true
    text:
      es: "Los miembros del Gobierno, los Secretarios de Estado y el resto de los altos cargos."
  explanation:
    es: "El título II se aplica a los miembros del Gobierno, a los Secretarios de Estado y al resto de los altos cargos de la Administración General del Estado y de las entidades del sector público estatal. Quedan fuera los empleados públicos en general y los funcionarios de los Cuerpos Superiores como tales. La opción que limita el título a los miembros del Gobierno y a los Secretarios de Estado deja sin cubrir al resto de los altos cargos."
  citation: "art. 25.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2013-12887-art-26
- id: m01-l07-q165
  prompt:
    es: "Conforme al artículo 26.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, quienes están en el ámbito del título II adecuarán su actividad a siete principios generales y a:"
  options:
  - id: a
    text:
      es: "Siete principios de actuación."
  - id: b
    text:
      es: "Seis principios de actuación."
  - id: c
    correct: true
    text:
      es: "Nueve principios de actuación."
  - id: d
    text:
      es: "Diez principios de actuación."
  explanation:
    es: "El artículo 26.2 enumera siete principios generales, en la letra a), y nueve principios de actuación, en la letra b). Siete, seis y diez principios de actuación son cifras cercanas que no coinciden con el número de apartados de la letra b)."
  citation: "art. 26.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "estructura"
# anchor: boe-a-2013-12887-art-28
- id: m01-l07-q166
  prompt:
    es: "Según el artículo 28 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, son infracciones muy graves, cuando sean culpables, los compromisos de gastos y la ordenación de pagos:"
  options:
  - id: a
    text:
      es: "Sin la autorización previa del Consejo de Ministros."
  - id: b
    text:
      es: "Sin aviso al Tribunal de Cuentas."
  - id: c
    text:
      es: "Sin consultar al Consejo de Transparencia y Buen Gobierno."
  - id: d
    correct: true
    text:
      es: "Sin crédito suficiente para realizarlos."
  explanation:
    es: "El artículo 28.c) tipifica como infracción muy grave los compromisos de gastos, el reconocimiento de obligaciones y la ordenación de pagos sin crédito suficiente para realizarlos. La falta de autorización del Consejo de Ministros, de aviso al Tribunal de Cuentas o de consulta al Consejo de Transparencia y Buen Gobierno no aparece en esa letra."
  citation: "art. 28 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q167
  prompt:
    es: "Según el artículo 36.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la Comisión de Transparencia y Buen Gobierno incluye a un representante del:"
  options:
  - id: a
    correct: true
    text:
      es: "Tribunal de Cuentas."
  - id: b
    text:
      es: "Tribunal Constitucional."
  - id: c
    text:
      es: "Consejo de Estado."
  - id: d
    text:
      es: "Consejo General del Poder Judicial."
  explanation:
    es: "La letra d) del artículo 36.2 incluye en la Comisión a un representante del Tribunal de Cuentas. El Tribunal Constitucional, el Consejo de Estado y el Consejo General del Poder Judicial no tienen vocal en ella."
  citation: "art. 36.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q168
  prompt:
    es: "¿Cuál de las siguientes agencias estatales cuenta con un representante en la Comisión de Transparencia y Buen Gobierno, según el artículo 36.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La Agencia Estatal de Administración Tributaria."
  - id: b
    correct: true
    text:
      es: "La Agencia Española de Protección de Datos."
  - id: c
    text:
      es: "La Agencia Española de Cooperación Internacional para el Desarrollo."
  - id: d
    text:
      es: "La Agencia Estatal de Meteorología."
  explanation:
    es: "La letra f) del artículo 36.2 da un puesto en la Comisión a un representante de la Agencia Española de Protección de Datos. La Agencia Estatal de Administración Tributaria, la de Cooperación Internacional para el Desarrollo y la de Meteorología no figuran entre sus miembros."
  citation: "art. 36.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q169
  prompt:
    es: "Conforme al artículo 37.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la persona propuesta para presidir el Consejo de Transparencia y Buen Gobierno comparece, antes de su nombramiento, ante:"
  options:
  - id: a
    text:
      es: "La Comisión correspondiente del Senado."
  - id: b
    text:
      es: "El Pleno del Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "La Comisión correspondiente del Congreso de los Diputados."
  - id: d
    text:
      es: "La Diputación Permanente de las Cortes Generales."
  explanation:
    es: "El artículo 37.1 exige la comparecencia previa ante la Comisión correspondiente del Congreso de los Diputados. Esa Comisión refrenda después el nombramiento por mayoría absoluta. El Senado no interviene, ni lo hace el Pleno del Congreso ni la Diputación Permanente de las Cortes Generales."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q170
  prompt:
    es: "Señale una causa de separación del Presidente del Consejo de Transparencia y Buen Gobierno, según el artículo 37.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    correct: true
    text:
      es: "La incapacidad permanente para el ejercicio de su función."
  - id: b
    text:
      es: "La pérdida de la confianza del Gobierno que lo propuso."
  - id: c
    text:
      es: "La condena por cualquier delito, aunque sea imprudente."
  - id: d
    text:
      es: "El rechazo de su memoria anual por las Cortes Generales."
  explanation:
    es: "El artículo 37.2 admite la separación, previa instrucción de un procedimiento, por incumplimiento grave de sus obligaciones, incapacidad permanente para el ejercicio de la función, incompatibilidad sobrevenida o condena por delito doloso. La pérdida de confianza del Gobierno no es causa. La condena solo cuenta si es por delito doloso, no por uno imprudente. Las Cortes Generales reciben la memoria anual, pero su rechazo no figura entre las causas."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2013-12887-art-38
- id: m01-l07-q171
  prompt:
    es: "Según el artículo 38.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Consejo de Transparencia y Buen Gobierno informa preceptivamente los proyectos normativos de carácter estatal:"
  options:
  - id: a
    text:
      es: "Que se tramiten por el procedimiento de urgencia."
  - id: b
    correct: true
    text:
      es: "Que desarrollen la ley o estén relacionados con su objeto."
  - id: c
    text:
      es: "Que sean aprobados por el Consejo de Ministros mediante Real Decreto."
  - id: d
    text:
      es: "Que le remitan las Cortes Generales para su valoración."
  explanation:
    es: "El artículo 38.1.c) encomienda al Consejo informar preceptivamente los proyectos normativos estatales que desarrollen la ley o estén relacionados con su objeto. La tramitación urgente, la aprobación por Real Decreto del Consejo de Ministros o la remisión desde las Cortes Generales no son el criterio del artículo."
  citation: "art. 38.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
