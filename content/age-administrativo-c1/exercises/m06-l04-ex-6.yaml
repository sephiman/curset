# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q218
  prompt:
    es: "En Word 365, ¿cuál de las siguientes herramientas de Captura de pantalla inserta solo la parte de la pantalla que se selecciona arrastrando?"
  options:
  - id: a
    text:
      es: "La imagen en miniatura de la ventana"
  - id: b
    text:
      es: "La galería Ventanas disponibles, con las miniaturas"
  - id: c
    text:
      es: "Las herramientas de la pestaña Herramientas de imagen"
  - id: d
    correct: true
    text:
      es: "Recorte de pantalla"
  explanation:
    es: "La página dice: puede insertarse «toda la ventana del programa» o usarse «la herramienta Recorte de pantalla para seleccionar parte de una ventana». Una miniatura de la galería inserta la ventana entera. La galería muestra las ventanas abiertas como miniaturas. Esas herramientas sirven para modificar y mejorar la captura ya insertada."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q219
  prompt:
    es: "Al elegir Recorte de pantalla en Word 365, ¿qué ocurre con la ventana mientras se selecciona la parte que se va a capturar?"
  options:
  - id: a
    text:
      es: "Se minimiza en la barra de tareas hasta terminar la selección"
  - id: b
    correct: true
    text:
      es: "Se vuelve temporalmente opaca, o congelada, y la selección se ve a través de esa opacidad"
  - id: c
    text:
      es: "Se inserta entera en el documento y después se recorta"
  - id: d
    text:
      es: "Se cierra la galería y se abre el panel Herramientas de imagen"
  explanation:
    es: "La página dice: «Al elegir Recorte de pantalla, toda la ventana se vuelve temporalmente opaca, o «congelada». Una vez seleccionada la parte de la ventana que quiere, la selección se muestra a través de esta opacidad». La ventana se vuelve temporalmente opaca; no se minimiza. Al elegir Recorte de pantalla se selecciona la parte antes de insertar. La ventana se vuelve temporalmente opaca."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q220
  prompt:
    es: "Según la página de Microsoft, ¿qué ventanas se pueden capturar en Word 365 con el botón Captura de pantalla?"
  options:
  - id: a
    text:
      es: "Todas las ventanas abiertas, incluidas las minimizadas"
  - id: b
    text:
      es: "Solo la ventana de Word en la que se está trabajando"
  - id: c
    correct: true
    text:
      es: "Solo las que no están minimizadas en la barra de tareas"
  - id: d
    text:
      es: "Solo las ventanas que están minimizadas en la barra de tareas"
  explanation:
    es: "La página dice: «Solo se pueden capturar las ventanas que no están minimizadas en la barra de tareas». Incluir las minimizadas contradice ese «solo». Limitarlo a la ventana de Word contradice la galería Ventanas disponibles, donde la página muestra como miniaturas las ventanas abiertas de los programas y permite elegir cualquiera. Y que solo se capturen las minimizadas es lo contrario de lo que dice la frase."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q221
  prompt:
    es: "¿Cuántas capturas de pantalla se pueden agregar a la vez a un documento de Word 365 con un único procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "Una sola"
  - id: b
    text:
      es: "Dos"
  - id: c
    text:
      es: "Tantas como ventanas haya en la galería"
  - id: d
    text:
      es: "Todas las ventanas abiertas, de una vez"
  explanation:
    es: "La página dice: «Solo puede agregarse una captura de pantalla a la vez. Para agregar varias capturas de pantalla, repita los pasos 2 y 3». Dos capturas con un solo procedimiento contradice esa limitación de una captura a la vez. Tantas como ventanas haya en la galería y todas las ventanas abiertas de una vez tampoco: la galería muestra las ventanas como miniaturas entre las que se hace clic en una, la que se inserta."
  citation: "fuente: `ms-office-recorte-pantalla.html`; «Insertar una captura de pantalla o un recorte de pantalla»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-office-recorte-pantalla-html
- id: m06-l04-q222
  prompt:
    es: "En Word 365, tras hacer clic en Recorte de pantalla, ¿qué se hace para capturar una parte de la pantalla?"
  options:
  - id: a
    text:
      es: "Hacer doble clic en la imagen en miniatura de la ventana"
  - id: b
    correct: true
    text:
      es: "Mantener presionado el botón primario del mouse y arrastrar para seleccionarla"
  - id: c
