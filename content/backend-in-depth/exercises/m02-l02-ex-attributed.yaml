type: quiz
variants:
- id: m02-l02-qa01
  prompt:
    en: According to Robert Sedgewick and Kevin Wayne in 6.3 Geometric Intersections, which treatment of degenerate
      cases does their vertical-horizontal line intersection sweep line algorithm adopt?
  options:
  - id: a
    correct: true
    text:
      en: It looks only for intersections between a horizontal and a vertical segment
  - id: b
    text:
      en: It also reports intersections between two horizontal segments that cross each other
  - id: c
    text:
      en: It does not detect improper intersections that occur at an endpoint of one of the segments
  - id: d
    text:
      en: It accepts duplicated horizontal and vertical segments and counts every copy separately
  explanation:
    en: Sedgewick and Wayne write that the algorithm only looks for intersections between a horizontal and a vertical
      segment. They rule out reporting intersections between two horizontal segments, because they write that two
      horizontal lines that intersect are not considered, which is why the segments were assumed to be disjoint.
      They rule out missing intersections at an endpoint of a segment, because they write that the algorithm does
      detect improper intersections that occur at an endpoint of one of the segments. They rule out accepting duplicated
      segments, because they write that they assume no duplicated h-v segments.
  citation: algs4-geometric-intersections#content
