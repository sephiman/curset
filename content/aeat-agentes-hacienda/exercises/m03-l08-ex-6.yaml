# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0204
  prompt:
    es: "Conforme al artículo 150.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los efectos del incumplimiento del plazo de duración del procedimiento de inspección respecto a las obligaciones pendientes de liquidar:"
  options:
  - id: a
    text:
      es: "Se considera interrumpida la prescripción por las actuaciones desarrolladas durante el plazo, y no por las realizadas después."
  - id: b
    text:
      es: "No se considera interrumpida la prescripción por ninguna actuación, ni durante el plazo ni después de que este termine."
  - id: c
    correct: true
    text:
      es: "No se considera interrumpida la prescripción por las actuaciones desarrolladas durante el plazo, y se entiende interrumpida por las realizadas después de que termine."
  - id: d
    text:
      es: "Se considera interrumpida la prescripción desde el inicio del procedimiento, que se anula si se supera el plazo."
  explanation:
    es: "Las actuaciones desarrolladas durante el plazo no interrumpen la prescripción, y sí las realizadas con posterioridad a su finalización (art. 150.6.a). Las otras opciones invierten la regla, la eliminan por completo o hacen perder la interrupción ya producida."
  citation: "art. 150.6 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "incumplimiento"
  - "prescripción"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0205
  prompt:
    es: "Según el artículo 150.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los ingresos realizados desde el inicio del procedimiento hasta la primera actuación posterior al incumplimiento del plazo, imputados por el obligado al tributo y período inspeccionados, tienen:"
  options:
  - id: a
    correct: true
    text:
      es: "El carácter de espontáneos a los efectos del artículo 27 de la Ley General Tributaria."
  - id: b
    text:
      es: "El carácter de ingresos a cuenta de la liquidación, sin efectos sobre los recargos del artículo 27."
  - id: c
    text:
      es: "El carácter de extemporáneos con requerimiento previo, con el recargo del 20 por ciento."
  - id: d
    text:
      es: "El carácter de pagos indebidos, que se devuelven al obligado con los intereses de demora."
  explanation:
    es: "Esos ingresos tienen carácter espontáneo a efectos del artículo 27, el de los recargos por declaración extemporánea (art. 150.6.b). No son simples ingresos a cuenta ni extemporáneos con requerimiento, y no son pagos indebidos."
  citation: "art. 150.6 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "incumplimiento"
  - "ingresos"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0206
  prompt:
    es: "¿Qué efecto produce el incumplimiento del plazo del procedimiento inspector sobre los intereses de demora, según el artículo 150.6.c de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "No se exigen intereses de demora desde que se produce el incumplimiento hasta la finalización del procedimiento."
  - id: b
    text:
      es: "No se exigen intereses de demora desde el inicio del procedimiento hasta la finalización del mismo."
  - id: c
    text:
      es: "Se exigen intereses de demora desde el incumplimiento, reducidos a la mitad hasta la finalización del procedimiento."
  - id: d
    text:
      es: "No se exigen intereses de demora desde el incumplimiento, pero se exigen desde la notificación de la liquidación."
  explanation:
    es: "Desde el incumplimiento hasta la finalización del procedimiento no se exigen intereses de demora (art. 150.6.c). Los devengados antes siguen exigibles, no se reducen a la mitad y no hay una exigencia especial desde la notificación de la liquidación."
  citation: "art. 150.6 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "incumplimiento"
  - "intereses"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0276
  prompt:
    es: "¿En qué momento debe haberse concedido el plazo para que su incumplimiento permita la extensión de tres meses del artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "En el primer requerimiento, cuando el obligado no aporta la documentación solicitada en diez días hábiles."
  - id: b
    text:
      es: "En la comunicación de inicio, cuando el obligado no comparece en el plazo que se le concede."
  - id: c
    correct: true
    text:
      es: "En el tercer requerimiento, cuando el obligado no aporta íntegramente la documentación solicitada."
  - id: d
    text:
      es: "En el trámite de audiencia, cuando el obligado no formula alegaciones sobre la propuesta."
  explanation:
    es: "La extensión se vincula al plazo concedido en el tercer requerimiento (art. 150.5). El primer requerimiento, la comunicación de inicio y el trámite de audiencia no son los momentos que el artículo toma como referencia."
  citation: "art. 150.5 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "extensión"
  - "tercer requerimiento"
# anchor: boe-a-2003-23186-art-148
- id: m03-l08-q0282
  prompt:
    es: "¿Qué dos clases de alcance pueden tener las actuaciones del procedimiento de inspección, según el artículo 148.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Carácter general o parcial, según afecten o no a la totalidad de los elementos de la obligación."
  - id: b
    text:
      es: "Carácter ordinario o extraordinario, según se inicien de oficio o a petición del obligado."
  - id: c
    text:
      es: "Carácter provisional o definitivo, según se haya comprobado o no la totalidad de los elementos de la obligación tributaria."
  - id: d
    text:
      es: "Carácter total o limitado, según se refieran o no a períodos no prescritos del obligado."
  explanation:
    es: "Las actuaciones pueden tener carácter general o parcial (art. 148.1). Provisional o definitivo es el carácter de las liquidaciones, y las demás clasificaciones no figuran en la Ley."
  citation: "art. 148.1 LGT"
  difficulty: 1
  tags:
  - "alcance"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0283
  prompt:
    es: "Conforme al artículo 87.3.a del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué contenido indica la comunicación de inicio respecto del procedimiento al que da comienzo?"
  options:
  - id: a
    text:
      es: "El órgano que lo resolverá."
  - id: b
    correct: true
    text:
      es: "El procedimiento que se inicia."
  - id: c
    text:
      es: "El plazo de caducidad que le es aplicable."
  - id: d
    text:
      es: "El nombre del funcionario que lo tramitará."
  explanation:
    es: "La letra a) del artículo 87.3 incluye el procedimiento que se inicia. El órgano que resolverá, el plazo de caducidad y el funcionario que lo tramita no figuran en la lista, y el procedimiento inspector no caduca por superar el plazo (art. 150.6 LGT)."
  citation: "art. 87.3 RGAT"
  difficulty: 1
  tags:
  - "comunicación de inicio"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0284
  prompt:
    es: "De acuerdo con el artículo 178.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cuál de las siguientes decisiones puede acordar de forma motivada el órgano competente en el curso del procedimiento?"
  options:
  - id: a
    text:
      es: "La conversión de las actuaciones de alcance general en actuaciones de alcance parcial sin comunicarlo al obligado."
  - id: b
    text:
      es: "La sustitución del obligado inspeccionado por otro obligado vinculado con el inicialmente comunicado."
  - id: c
    correct: true
    text:
      es: "La ampliación o reducción del alcance de las actuaciones respecto de las obligaciones tributarias y períodos inicialmente señalados."
  - id: d
    text:
      es: "La ampliación del plazo máximo de duración de las actuaciones por decisión unilateral del órgano."
  explanation:
    es: "La letra b) del artículo 178.5 permite ampliar o reducir el alcance respecto de las obligaciones y períodos inicialmente señalados, de forma motivada. El acuerdo debe comunicarse (art. 178.2), no se cambia de obligado y el plazo solo se extiende por las causas del artículo 150."
  citation: "art. 178.5 RGAT"
  difficulty: 1
  tags:
  - "alcance"
  - "modificación"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0287
  prompt:
    es: "Conforme al artículo 150.6.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿por qué actuaciones se entiende interrumpida la prescripción una vez vencido el plazo de duración del procedimiento inspector?"
  options:
  - id: a
    text:
      es: "Por todas las actuaciones realizadas desde la notificación del inicio del procedimiento."
  - id: b
    text:
      es: "Por la formalización del acta de inspección, con independencia de la fecha en que se extienda."
  - id: c
    correct: true
    text:
      es: "Por la realización de actuaciones con posterioridad a la finalización del plazo."
  - id: d
    text:
      es: "Por ninguna actuación, porque el vencimiento del plazo extingue el derecho a liquidar."
  explanation:
    es: "Tras vencer el plazo, la prescripción se interrumpe por las actuaciones realizadas con posterioridad (art. 150.6.a). No por las desarrolladas durante el plazo, no por el acta con independencia de su fecha, y el vencimiento no extingue el derecho a liquidar ni produce caducidad."
  citation: "art. 150.6 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "incumplimiento"
  - "prescripción"
# anchor: boe-a-2003-23186-art-149
- id: m03-l08-q0289
  prompt:
    es: "De acuerdo con el artículo 149.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la solicitud de una inspección de carácter general formulada por quien está siendo objeto de actuaciones parciales:"
  options:
  - id: a
    text:
      es: "Puede referirse solo a los períodos afectados, y suspende las actuaciones en curso hasta que se resuelva la solicitud."
  - id: b
    correct: true
    text:
      es: "Puede referirse al tributo y, en su caso, a los períodos afectados, y no interrumpe las actuaciones en curso."
  - id: c
    text:
      es: "Puede referirse a cualquier tributo del obligado, y no interrumpe las actuaciones en curso."
  - id: d
    text:
      es: "Puede referirse al tributo y a los períodos afectados, y interrumpe las actuaciones en curso."
  explanation:
    es: "La solicitud se refiere al tributo y, en su caso, a los períodos afectados por las actuaciones parciales, sin interrumpirlas (art. 149.1). No se limita a los períodos, no abarca cualquier tributo y no las suspende ni las interrumpe."
  citation: "art. 149.1 LGT"
  difficulty: 2
  tags:
  - "solicitud"
  - "inspección general"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0290
  prompt:
    es: "Conforme al artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes circunstancias NO figura entre las que suspenden el cómputo del plazo del procedimiento inspector?"
  options:
  - id: a
    text:
      es: "La remisión del expediente al Ministerio Fiscal sin practicar la liquidación, conforme al artículo 251."
  - id: b
    text:
      es: "La recepción de una comunicación de un órgano jurisdiccional que ordene la paralización del procedimiento en curso."
  - id: c
    correct: true
    text:
      es: "La solicitud del obligado de un período sin actuaciones antes de la apertura del trámite de audiencia."
  - id: d
    text:
      es: "La concurrencia de una causa de fuerza mayor que obligue a suspender las actuaciones inspectoras."
  explanation:
    es: "El período sin actuaciones que pide el obligado no es una causa de suspensión del artículo 150.3: queda suspendido el plazo para atender requerimientos y supone una extensión del plazo máximo (art. 150.4). La remisión al Ministerio Fiscal, la comunicación judicial y la fuerza mayor son las letras a), b) y g) del apartado 3."
  citation: "art. 150.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "suspensión"
  - "extensión"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0292
  prompt:
    es: "Grupo Almazara, S.A. es la sociedad dominante de un grupo sometido al régimen de consolidación fiscal que está siendo objeto de comprobación inspectora. Su Cifra Anual de Negocios no alcanza el límite exigido para auditar sus cuentas. Conforme al artículo 150.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué plazo máximo rige para la inspección de alcance general que se le notifica y desde cuándo se cuenta?"
  options:
  - id: a
    correct: true
    text:
      es: "27 meses, contados desde la fecha de notificación de la comunicación de inicio."
  - id: b
    text:
      es: "18 meses, contados desde la fecha de notificación de la comunicación de inicio."
  - id: c
    text:
      es: "27 meses, contados desde la fecha del acuerdo del órgano competente por el que se ordena el inicio."
  - id: d
    text:
      es: "18 meses, contados desde la fecha del primer requerimiento de documentación dirigido al obligado."
  explanation:
    es: "Estar integrado en un grupo sometido al régimen de consolidación fiscal que esté siendo objeto de comprobación inspectora es una de las circunstancias que llevan el plazo a 27 meses (art. 150.1.b.2.º). El plazo se cuenta desde la fecha de notificación al obligado de su inicio (art. 150.2). Los 18 meses valen solo cuando no concurre ninguna de esas circunstancias, y aquí concurre una aunque la cifra de negocios no llegue al límite de auditoría. Ni el acuerdo interno que ordena el inicio ni el primer requerimiento de documentación marcan el origen del plazo: lo marca la notificación del inicio."
  citation: "art. 150.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "27 meses"
  - "grupo fiscal"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0297
  prompt:
    es: "A Distribuciones Mora, S.L. se le notificó el miércoles 11 de febrero de 2026 el inicio de una inspección de alcance general, con plazo de 18 meses. Antes de la apertura del trámite de audiencia solicita un único período de 20 días naturales sin actuaciones, y el órgano actuante lo concede. No hay otras extensiones ni suspensiones. Conforme al artículo 150.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo concluye como máximo el procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes 31 de agosto de 2027, a los 18 meses más los 20 días naturales del período solicitado."
  - id: b
    text:
      es: "El miércoles 11 de agosto de 2027, porque los períodos que pide el obligado no extienden el plazo máximo."
  - id: c
    text:
      es: "El jueves 11 de noviembre de 2027, a los 18 meses más una extensión de tres meses."
  - id: d
    text:
      es: "El viernes 11 de febrero de 2028, a los 18 meses más una extensión de seis meses."
  explanation:
    es: "El obligado puede pedir, antes de la apertura del trámite de audiencia, períodos en los que la inspección no actúe con él. No pueden exceder en conjunto de 60 días naturales y suponen una extensión del plazo máximo (art. 150.4). Los 20 días concedidos quedan por debajo del tope. Los 18 meses desde el 11 de febrero de 2026 acaban el 11 de agosto de 2027 (art. 30.4 de la Ley 39/2015), y 20 días naturales más dan el 31 de agosto de 2027. Dejar el 11 de agosto trata la solicitud como si no extendiera el plazo, y sí lo extiende. Tres y seis meses son las extensiones del artículo 150.5, que dependen de aportaciones tardías de documentación y no de esta solicitud."
  citation: "art. 150.4 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "extensión del plazo"
  - "60 días"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0298
  prompt:
    es: "A Maderas Ríos, S.L. se le notifica el lunes 14 de julio de 2025 el inicio de una inspección de alcance general con plazo de 18 meses. Después de manifestar que no iba a aportar cierta documentación, la entrega el 20 de mayo de 2026, tras el tercer requerimiento y sin que se haya formalizado ningún acta. Según el artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo concluye como máximo el procedimiento?"
  options:
  - id: a
    text:
      es: "El jueves 14 de enero de 2027, porque la aportación posterior no extiende el plazo."
  - id: b
    text:
      es: "El miércoles 14 de julio de 2027, por una extensión de seis meses."
  - id: c
    correct: true
    text:
      es: "El miércoles 14 de abril de 2027, por una extensión de tres meses."
  - id: d
    text:
      es: "El jueves 14 de octubre de 2027, por haber pasado a ser aplicable el plazo de 27 meses."
  explanation:
    es: "Si el obligado manifiesta que no va a aportar la documentación, o no la aporta íntegramente en el plazo del tercer requerimiento, su aportación posterior extiende el plazo máximo tres meses, siempre que se produzca al menos nueve meses después del inicio (art. 150.5). Los nueve meses desde el 14 de julio de 2025 se cumplieron el 14 de abril de 2026 y la entrega es del 20 de mayo. El plazo de 18 meses acababa el 14 de enero de 2027, y con tres meses más llega al 14 de abril de 2027 (art. 30.4 de la Ley 39/2015). Dejarlo en enero niega una extensión que sí procede. Los seis meses corresponden a la aportación posterior al acta que lleva a actuaciones complementarias, y aquí no hay acta. Los 27 meses dependen de las circunstancias del artículo 150.1.b, no de una aportación tardía."
  citation: "art. 150.5 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "extensión del plazo"
  - "aportación tardía"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0299
  prompt:
    es: "A Conservas Arlanza, S.A. se le notificó el lunes 5 de mayo de 2025 el inicio de una inspección de alcance general con plazo de 18 meses. Formalizada el acta, el obligado aporta el 15 de septiembre de 2026 documentación que había dicho que no entregaría, y el órgano competente para liquidar acuerda actuaciones complementarias. Según el artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo concluye como máximo el procedimiento?"
  options:
  - id: a
    text:
      es: "El viernes 5 de febrero de 2027, por una extensión de tres meses."
  - id: b
    text:
      es: "El jueves 5 de noviembre de 2026, porque la aportación posterior al acta no extiende el plazo."
  - id: c
    text:
      es: "El jueves 5 de agosto de 2027, por haber pasado a ser aplicable el plazo de 27 meses."
  - id: d
    correct: true
    text:
      es: "El miércoles 5 de mayo de 2027, por una extensión de seis meses."
  explanation:
    es: "Cuando la aportación se efectúa tras la formalización del acta y determina que el órgano competente para liquidar acuerde actuaciones complementarias, la extensión del plazo máximo es de seis meses (art. 150.5). Los 18 meses desde el 5 de mayo de 2025 acababan el 5 de noviembre de 2026, y seis meses más llevan al 5 de mayo de 2027 (art. 30.4 de la Ley 39/2015). Tres meses es la extensión de la aportación tardía en general, y aquí la aportación es posterior al acta y provoca actuaciones complementarias. Dejar el 5 de noviembre de 2026 niega toda extensión. Los 27 meses dependen de circunstancias del artículo 150.1.b que el caso no contiene."
  citation: "art. 150.5 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "extensión del plazo"
  - "actuaciones complementarias"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0307
  prompt:
    es: "Según el artículo 178.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, la inspección comprueba la solicitud de devolución del IVA de Cafés Mirador, S.L. y se limita a constatar que su contenido se ajusta formalmente a la contabilidad, los registros y los justificantes, sin perjuicio de comprobar después por completo su situación. ¿Qué carácter tienen esas actuaciones?"
  options:
  - id: a
    text:
      es: "General, porque toda comprobación de una solicitud de devolución afecta a la totalidad de la obligación tributaria."
  - id: b
    text:
      es: "Ni general ni parcial, porque son actuaciones de gestión tributaria y no de inspección."
  - id: c
    correct: true
    text:
      es: "Parcial, porque tienen por objeto comprobar una solicitud de devolución y se limitan a esa constatación formal."
  - id: d
    text:
      es: "Parcial, pero solo si el obligado lo solicita en el plazo de 15 días desde la notificación del inicio."
  explanation:
    es: "Las actuaciones que tienen por objeto comprobar una solicitud de devolución son parciales siempre que se limiten a constatar que su contenido se ajusta formalmente a lo anotado en la contabilidad, los registros y los justificantes del obligado, sin perjuicio de la posterior comprobación completa (art. 178.3.c). La inspección hace justo eso. Decir que son generales ignora esa regla expresa. Calificarlas de gestión tributaria cambia el órgano y el procedimiento, pero el caso describe actuaciones de inspección. Los 15 días son el plazo con que el obligado pide que unas actuaciones parciales pasen a ser generales (art. 149.2 LGT), no una condición para que sean parciales."
  citation: "art. 178.3 RGAT"
  difficulty: 1
  tags:
  - "alcance"
  - "actuaciones parciales"
  - "devolución"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0316
  prompt:
    es: "Conforme al artículo 87.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, la inspección inicia el procedimiento de Hostal Mirasierra, S.L. mediante comunicación notificada, que requiere documentación y concede un plazo de ocho días desde el día siguiente a la notificación para aportarla. ¿Es conforme a esa norma?"
  options:
  - id: a
    text:
      es: "Sí, porque el reglamento solo exige un plazo mínimo de cinco días para comparecer y aportar la documentación."
  - id: b
    correct: true
    text:
      es: "No, porque el plazo concedido no puede ser inferior a 10 días, contados desde el día siguiente al de la notificación."
  - id: c
    text:
      es: "Sí, porque el plazo se fija a criterio del actuario, sin que el reglamento establezca un mínimo."
  - id: d
    text:
      es: "No, porque el plazo debe ser de un mes contado desde la fecha de la comunicación de inicio."
  explanation:
    es: "Salvo cuando el procedimiento se inicia mediante personación, se concede al obligado un plazo no inferior a 10 días, contados desde el día siguiente al de la notificación de la comunicación de inicio, para que comparezca, aporte la documentación requerida y la que considere conveniente o efectúe las alegaciones oportunas (art. 87.4). Ocho días son menos que el mínimo. Por tanto, no es conforme. Un mínimo de cinco días no existe en la norma, y decir que no hay mínimo la contradice. Exigir un mes y contarlo desde la fecha de la comunicación tampoco coincide con lo que dice: diez días como mínimo y desde el día siguiente a la notificación."
  citation: "art. 87.4 RGAT"
  difficulty: 1
