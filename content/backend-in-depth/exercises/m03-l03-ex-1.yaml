- id: m03-l03-q12
  prompt:
    en: A task forks two redundant subtasks and needs only the result of whichever succeeds first, cancelling the
      other. Which Java 25 `Joiner` factory method fits this policy?
  options:
  - id: a
    text:
      en: '`Joiner.allSuccessfulOrThrow()`'
  - id: b
    text:
      en: '`Joiner.awaitAll()`'
  - id: c
    correct: true
    text:
      en: '`Joiner.anySuccessfulResultOrThrow()`'
  - id: d
    text:
      en: '`Joiner.awaitAllSuccessfulOrThrow()`'
  explanation:
    en: '`anySuccessfulResultOrThrow()` yields the result of the first subtask to succeed and makes `join` throw
      only if all subtasks fail. `allSuccessfulOrThrow()` is wrong because it yields a stream of the completed subtasks
      when all subtasks complete successfully. `awaitAll()` is wrong because it only waits for all subtasks. `awaitAllSuccessfulOrThrow()`
      is wrong because it waits for all successful subtasks.'
  citation: javadoc-structuredtaskscope-joiner#interface-structuredtaskscope-joiner-t-r
