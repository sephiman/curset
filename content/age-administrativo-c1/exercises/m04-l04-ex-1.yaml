  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q011
  prompt:
    es: "Según el artículo 114.12 del Real Decreto-ley 6/2023, de 19 de diciembre, ¿cuándo toma posesión el personal funcionario interino?"
  options:
  - id: a
    text:
      es: "Dentro de los quince días naturales siguientes al nombramiento."
  - id: b
    text:
      es: "Dentro del mes siguiente a la publicación del nombramiento."
  - id: c
    text:
      es: "El mismo día en que se dicta su nombramiento."
  - id: d
    correct: true
    text:
      es: "Al día siguiente al del nombramiento."
  explanation:
    es: "El artículo 114.12 dice que, para el personal funcionario interino y eventual, «la toma de posesión se producirá al día siguiente al del nombramiento». Los quince días naturales y el mes son los plazos del funcionario de carrera, sin cambio y con cambio de localidad. El mismo día del nombramiento adelanta la toma de posesión un día."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 1
  tags:
  - "plazo"
