# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q051
  prompt:
    es: "Según el artículo 79.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, tienen también carácter de a justificar las propuestas de pago para satisfacer gastos a realizar:"
  options:
  - id: a
    correct: true
    text:
      es: "En una localidad donde no exista dependencia del ministerio, organismo, entidad gestora o servicio común."
  - id: b
    text:
      es: "En una localidad distinta de aquella en la que se encuentre la sede del Cajero pagador del ministerio."
  - id: c
    text:
      es: "En una localidad donde exista más de una Caja pagadora del mismo ministerio u organismo autónomo."
  - id: d
    text:
      es: "Por un importe inferior a 600 euros en cada propuesta de pago, para atenciones de menor cuantía."
  explanation:
    es: "El artículo 79.2 da el mismo carácter a las propuestas de pago para gastos en una localidad donde no exista dependencia del ministerio, organismo, entidad gestora o servicio común. La sede del Cajero pagador y la existencia de varias Cajas no son el criterio. Y el importe inferior a 600 euros es un límite de los anticipos de Caja fija, no de los pagos a justificar."
  citation: "art. 79.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1987-12158-art-1
- id: m05-l05-q052
  prompt:
    es: "¿Quiénes establecen, previo informe del Interventor Delegado, las normas que regulan la expedición de órdenes de pago «a justificar»?"
  options:
  - id: a
    text:
      es: "El Director general del Tesoro y Política Financiera, para toda la Administración del Estado y sus organismos."
  - id: b
    text:
      es: "La Intervención General de la Administración del Estado, mediante circular dirigida a los Cajeros pagadores."
  - id: c
    correct: true
    text:
      es: "Los Ministros y los Presidentes o Directores de los Organismos autónomos, para sus presupuestos."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda, al aprobar cada ejercicio presupuestario."
  explanation:
    es: "El artículo 1.1 atribuye a los Ministros y a los Presidentes o Directores de los Organismos autónomos fijar esas normas para sus respectivos presupuestos, previo informe del Interventor Delegado. El plan de disposición de fondos del Tesoro es otra cosa: lo establece el Gobierno para cada ejercicio, según el artículo 1.2. Ni el Director general del Tesoro ni la Intervención General dictan esas normas."
  citation: "art. 1.1 RD 640/1987"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1987-12158-art-1
- id: m05-l05-q053
  prompt:
    es: "Según el artículo 1.3 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», no se expiden órdenes de pago «a justificar» a las Cajas pagadoras que, vencidos los plazos o su prórroga, no hayan:"
  options:
  - id: a
    text:
      es: "Designado un Cajero pagador con nombramiento expreso para su Caja."
  - id: b
    text:
      es: "Remitido a la Unidad Central el censo de sus Cajeros pagadores."
  - id: c
    text:
      es: "Formulado los estados de situación de Tesorería de las primeras quincenas."
  - id: d
    correct: true
    text:
      es: "Justificado la inversión de los fondos percibidos con anterioridad."
  explanation:
    es: "El artículo 1.3 impide librar nuevas órdenes a una Caja que, vencidos los plazos o su prórroga, no ha justificado la inversión de los fondos percibidos antes. El nombramiento expreso del Cajero, el censo de Cajeros que lleva la Unidad Central y los estados de situación de Tesorería son otras obligaciones del reglamento, pero no condicionan el libramiento."
  citation: "art. 1.3 RD 640/1987"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-2627-regla-33
- id: m05-l05-q054
  prompt:
    es: "Según la regla 33.2 de la Orden de 1 de febrero de 1996 por la que se aprueba la Instrucción de operatoria contable, la falta de presentación de la cuenta justificativa de los pagos a justificar para gastos de emergencia:"
  options:
  - id: a
    correct: true
    text:
      es: "No paraliza en ningún caso la emisión de nuevos libramientos a justificar a favor de la misma caja pagadora."
  - id: b
    text:
      es: "Paraliza nuevos libramientos a la misma caja hasta que presente la cuenta justificativa pendiente."
  - id: c
    text:
      es: "Paraliza nuevos libramientos a la misma caja una vez transcurridos seis meses sin presentar la cuenta."
  - id: d
    text:
      es: "Paraliza nuevos libramientos solo cuando el Ministro así lo acuerde por escrito y motivadamente."
  explanation:
    es: "Para los gastos de emergencia, la regla 33.2 dice que la falta de cuenta justificativa no paraliza en ningún caso nuevos libramientos a la misma caja, cualquiera que sea el tiempo transcurrido. Los seis meses solo sirven para que la oficina de contabilidad informe cada trimestre a los centros gestores. Y no depende de un acuerdo del Ministro. Es una excepción a la regla general del artículo 1.3 del Real Decreto 640/1987."
  citation: "regla 33 IOC"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1987-12158-art-3
- id: m05-l05-q055
  prompt:
    es: "Según el artículo 3.2 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», ¿qué dos extremos de la fiscalización de las órdenes de pago «a justificar» se justifican con certificado de la oficina de contabilidad?"
  options:
  - id: a
    correct: true
    text:
      es: "La existencia de crédito adecuado y la situación de la Caja pagadora respecto a fondos anteriores."
  - id: b
    text:
      es: "Que se base en orden o resolución de autoridad competente y que se adapte a las normas del artículo 1.1."
  - id: c
    text:
      es: "La existencia de crédito adecuado y que se adapte a las normas del artículo 1.1 de este Real Decreto."
  - id: d
    text:
      es: "Que se base en orden o resolución de autoridad competente y la situación de la Caja pagadora."
  explanation:
    es: "De los cuatro extremos que fiscaliza el artículo 3.2, los de las letras b) y d) se justifican con certificado de la oficina de contabilidad: existe crédito y es el adecuado, y la situación de la Caja pagadora respecto del artículo 1.3. La base en orden o resolución de autoridad competente (letra a) y la adaptación a las normas del artículo 1.1 (letra c) se comprueban sin ese certificado. Las otras combinaciones mezclan una letra de cada grupo."
  citation: "art. 3.2 RD 640/1987"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1996-2627-regla-29
- id: m05-l05-q056
  prompt:
    es: "¿A favor de quién se expide el documento ADOK u OK con el que se contabiliza la propuesta de pago a justificar?"
  options:
  - id: a
    text:
      es: "Los acreedores finales, a quienes se abona directamente el importe."
  - id: b
    text:
      es: "La Unidad Central de Caja a la que esté adscrita la caja pagadora."
  - id: c
    text:
      es: "La Dirección General del Tesoro y Política Financiera, que ordena el pago."
  - id: d
    correct: true
    text:
      es: "La Caja pagadora que deba efectuar el pago a los acreedores finales."
  explanation:
    es: "La regla 29.1 expide el documento ADOK u OK a favor de la Caja Pagadora que deba pagar a los acreedores finales, porque el libramiento a justificar se hace a la caja y no al acreedor. La Unidad Central coordina las Cajas y expide otro documento, el de control de pagos a justificar. La Dirección General del Tesoro ordena el pago, pero no es la destinataria del documento."
  citation: "regla 29.1 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q057
  prompt:
    es: "¿Quién puede acordar que, con fondos librados a justificar para gastos en el extranjero, se atiendan gastos realizados en el ejercicio siguiente?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, a propuesta de la Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "El titular del ministerio gestor, previo informe de su Intervención Delegada."
  - id: c
    correct: true
    text:
      es: "El Consejo de Ministros, si se considera relevante para el interés general."
  - id: d
    text:
      es: "La Dirección General del Tesoro y Política Financiera, a petición del Cajero pagador."
  explanation:
    es: "Con cargo a los libramientos a justificar solo se imputan obligaciones del ejercicio del libramiento. Para gastos en el extranjero el Consejo de Ministros puede acordar que se atiendan gastos del ejercicio siguiente, si lo considera relevante para el interés general. El Ministro de Hacienda, el titular del ministerio gestor y la Dirección General del Tesoro no tienen esa facultad."
  citation: "art. 79.3 LGP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q058
  prompt:
    es: "¿Qué debe incluirse obligatoriamente en toda propuesta de pago a justificar, cualquiera que sea su finalidad?"
  options:
  - id: a
    text:
      es: "Un presupuesto detallado firmado por cada proveedor de las actuaciones."
  - id: b
    text:
      es: "Un informe previo del Tribunal de Cuentas sobre la finalidad del gasto."
  - id: c
    text:
      es: "Una relación nominal de los perceptores finales de los fondos."
  - id: d
    correct: true
    text:
      es: "Un calendario de las actuaciones que se pretenda financiar con el libramiento."
  explanation:
    es: "El artículo 79.3 obliga a incluir un calendario de las actuaciones que se pretende financiar. Si de él se derivan gastos plurianuales, se tramita un expediente de gastos con las anualidades del ejercicio corriente y de los posteriores. El presupuesto firmado por cada proveedor, el informe previo del Tribunal de Cuentas y la relación nominal de perceptores no los exige el artículo."
  citation: "art. 79.3 LGP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q059
  prompt:
    es: "De acuerdo con el artículo 79.5 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los perceptores de las órdenes de pago a justificar son responsables de la custodia y uso de los fondos y de:"
  options:
  - id: a
    text:
      es: "La aprobación o reparo de la cuenta justificativa."
  - id: b
    correct: true
    text:
      es: "La rendición de la cuenta justificativa."
  - id: c
    text:
      es: "El examen de la cuenta y de sus justificantes."
  - id: d
    text:
      es: "El envío de la cuenta aprobada al Tribunal de Cuentas."
  explanation:
    es: "Los perceptores responden de la custodia y uso de los fondos y de la rendición de la cuenta. Aprobar o reparar la cuenta corresponde a la autoridad competente, examinarla a la Intervención Delegada y enviarla al Tribunal de Cuentas a la Unidad Central, según el Real Decreto 640/1987."
  citation: "art. 79.5 LGP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1987-12158-art-10
- id: m05-l05-q061
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», ¿quién puede ampliar excepcionalmente hasta seis meses el plazo de justificación de los Cajeros pagadores?"
  options:
  - id: a
    text:
      es: "La Intervención Delegada de cada ministerio, a propuesta del órgano gestor del crédito y de los propios Cajeros pagadores."
  - id: b
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda y con informe de la Intervención General."
  - id: c
    correct: true
    text:
      es: "El Director general del Tesoro y Política Financiera y, en su caso, los Presidentes o Directores de los Organismos autónomos."
  - id: d
    text:
      es: "El Jefe de la Unidad Administrativa a la que esté adscrita la Caja, previo informe del Cajero pagador."
  explanation:
    es: "El artículo 10.1 permite al Director general del Tesoro y Política Financiera y, en su caso, a los Presidentes o Directores de los Organismos autónomos ampliar el plazo, excepcionalmente, hasta seis meses. La Intervención Delegada solo informa las solicitudes de ampliación del apartado 2. El Consejo de Ministros no interviene, y el Jefe de la Unidad Administrativa solo cuida de que la justificación se haga en plazo."
  citation: "art. 10.1 RD 640/1987"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q064
  prompt:
    es: "Según el artículo 79.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la cantidad no invertida de los libramientos a justificar en el ejercicio en que se aprobaron se justifica mediante:"
  options:
  - id: a
    text:
      es: "Certificado de la oficina de contabilidad que acredite el saldo de la caja pagadora al cierre del ejercicio."
  - id: b
    text:
      es: "Nuevo libramiento a favor de la Unidad Central para aplicarlo al ejercicio presupuestario siguiente."
  - id: c
    text:
      es: "Informe de la Intervención Delegada que autorice mantener los fondos en la Caja pagadora durante el ejercicio siguiente."
  - id: d
    correct: true
    text:
      es: "Carta de pago demostrativa de su reintegro al Tesoro Público, hecho por el cajero pagador correspondiente."
  explanation:
    es: "El artículo 79.3 exige carta de pago demostrativa del reintegro al Tesoro Público por el cajero pagador de la cantidad no invertida en el ejercicio. El certificado del saldo, el nuevo libramiento a la Unidad Central y el informe que autorice conservar los fondos no son la forma de justificarla."
  citation: "art. 79.3 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12158-art-12
- id: m05-l05-q065
  prompt:
    es: "Según el artículo 12.1 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», en las cuentas justificativas de la inversión de los fondos figura:"
  options:
  - id: a
    correct: true
    text:
      es: "En el debe, el importe percibido, y en el haber, el de las obligaciones satisfechas con cargo a aquel."
  - id: b
    text:
      es: "En el haber, el importe percibido, y en el debe, el de las obligaciones satisfechas con cargo a aquel."
  - id: c
    text:
      es: "En el debe, el importe percibido, y en el haber, el de los pagos pendientes de justificar por la Caja."
  - id: d
    text:
      es: "En el debe, el importe de las obligaciones satisfechas, y en el haber, el saldo del libramiento recibido."
  explanation:
    es: "En las cuentas figura en el debe el importe percibido y en el haber el de las obligaciones satisfechas con cargo a él. La opción que cambia debe y haber invierte la cuenta. Los pagos pendientes de justificar no son lo que se anota en el haber, y el debe recoge lo percibido, no lo satisfecho."
  citation: "art. 12.1 RD 640/1987"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12158-art-12
- id: m05-l05-q067
  prompt:
    es: "De acuerdo con el artículo 12.4 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», la Intervención Delegada interviene la inversión examinando las cuentas y los documentos que las justifican:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante procedimientos de auditoría o de muestreo, y las devuelve a la Unidad Central con su informe."
  - id: b
    text:
      es: "Mediante una comprobación íntegra de cada justificante, y las remite al Tribunal de Cuentas con su informe."
  - id: c
    text:
      es: "Mediante procedimientos de auditoría o de muestreo, y las remite directamente al Tribunal de Cuentas."
  - id: d
    text:
      es: "Mediante la comprobación de los justificantes superiores a 5.000 euros, y las devuelve a la Caja pagadora."
  explanation:
    es: "La Intervención Delegada examina las cuentas y los documentos mediante procedimientos de auditoría o de muestreo y, examinadas, las devuelve a la Unidad Central con el informe correspondiente. No comprueba cada justificante, ni los remite ella misma al Tribunal de Cuentas (lo hace la Unidad Central, tras la aprobación), ni se limita a los de más de 5.000 euros, un umbral de los anticipos de Caja fija."
  citation: "art. 12.4 RD 640/1987"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12158-art-12
- id: m05-l05-q068
  prompt:
    es: "En los Organismos autónomos, ¿a elección de quién pueden las cuentas justificativas de pagos a justificar quedar en poder del Organismo?"
  options:
  - id: a
    text:
      es: "La Intervención Delegada del Organismo, en cada caso."
  - id: b
    text:
      es: "El Presidente o Director del Organismo, en cada caso."
  - id: c
    text:
      es: "La Unidad Central del Organismo, en cada caso."
  - id: d
    correct: true
    text:
      es: "El propio Tribunal de Cuentas, en cada caso."
  explanation:
    es: "En los Organismos autónomos las cuentas justificativas pueden, a elección del Tribunal de Cuentas, quedar en poder del Organismo a disposición del Tribunal o enviarse a este. La elección no corresponde a la Intervención Delegada, al Presidente o Director ni a la Unidad Central."
  citation: "art. 12.5 RD 640/1987"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1996-2627-regla-31
- id: m05-l05-q070
  prompt:
    es: "Si se autoriza una prórroga del plazo de justificación de un pago a justificar, ¿a quién remite la Unidad Central el documento de prórroga junto con el acuerdo del Ministro?"
  options:
  - id: a
    correct: true
    text:
      es: "A la oficina de contabilidad del Departamento ministerial."
  - id: b
    text:
      es: "A la Intervención Delegada del Departamento ministerial."
  - id: c
    text:
      es: "Al Tribunal de Cuentas, para su conocimiento."
  - id: d
    text:
      es: "A la Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "La Unidad Central de Caja expide el documento con la prórroga concedida y lo remite a la oficina de contabilidad, junto con el acuerdo del Ministro o de quien él delegue. La Intervención Delegada, el Tribunal de Cuentas y la Dirección General del Tesoro no son los destinatarios."
  citation: "regla 31 IOC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1996-2627-regla-32
- id: m05-l05-q071
  prompt:
    es: "¿Qué hace la oficina de contabilidad si han pasado los plazos y la prórroga sin que la cuenta justificativa haya llegado a la Intervención Delegada?"
  options:
  - id: a
    correct: true
    text:
      es: "Lo pone de manifiesto en un informe a la Unidad Central de Caja, que requiere la cuenta a la caja pagadora."
  - id: b
    text:
      es: "Requiere directamente la cuenta a la caja pagadora, sin informe previo a la Unidad Central de Caja."
  - id: c
    text:
      es: "Remite el expediente al Tribunal de Cuentas, para que este exija la cuenta a la caja pagadora, previo informe."
  - id: d
    text:
      es: "Archiva el expediente de la cuenta hasta que el Cajero pagador la presente voluntariamente en la Intervención."
  explanation:
    es: "La oficina de contabilidad no requiere ella misma la cuenta: lo pone de manifiesto en un informe a la Unidad Central de Caja del Departamento, que es la que requiere a la caja pagadora. Tampoco remite el expediente al Tribunal de Cuentas ni lo archiva a la espera de que el Cajero pagador presente la cuenta: el artículo 1.3 del Real Decreto 640/1987 solo impide expedir nuevas órdenes mientras no se justifique la inversión anterior."
  citation: "regla 32 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12158-art-10
- id: m05-l05-q072
  prompt:
    es: "Una Caja pagadora percibe fondos a justificar el lunes 5 de octubre de 2026 y los invierte el lunes 19 de octubre. Según el artículo 10.1 del Real Decreto 640/1987, de 8 de mayo, con meses de fecha a fecha, ¿cuándo vence el plazo sin ampliación?"
  options:
  - id: a
    text:
      es: "El martes 5 de enero de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves 19 de noviembre de 2026."
  - id: c
    text:
      es: "El jueves 5 de noviembre de 2026."
  - id: d
    text:
      es: "El sábado 19 de diciembre de 2026."
  explanation:
    es: "El Cajero pagador justifica dentro del mes siguiente a la inversión y, en todo caso, en tres meses desde la percepción, y vence el primero de los dos. El mes siguiente a la inversión del lunes 19 de octubre de 2026 termina el jueves 19 de noviembre de 2026, contando de fecha a fecha (artículo 30.4 de la Ley 39/2015). Los tres meses desde la percepción del lunes 5 de octubre de 2026 terminarían el martes 5 de enero de 2027: es el tope, no el plazo. El jueves 5 de noviembre de 2026 cuenta el mes desde la percepción, no desde la inversión, y el sábado 19 de diciembre de 2026 cuenta dos meses desde la inversión."
  citation: "art. 10.1 RD 640/1987"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1987-12158-art-10
- id: m05-l05-q073
  prompt:
    es: "Una Caja pagadora percibe fondos a justificar el martes 1 de septiembre de 2026 y los invierte el viernes 20 de noviembre. Según el artículo 10.1 del Real Decreto 640/1987, de 8 de mayo, con meses de fecha a fecha, ¿cuál de las siguientes es la fecha límite, sin ampliación?"
  options:
  - id: a
    text:
      es: "Hasta el domingo 20 de diciembre de 2026."
  - id: b
    text:
      es: "Hasta el jueves 1 de octubre de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 1 de diciembre de 2026."
  - id: d
    text:
      es: "Hasta el lunes 1 de marzo de 2027."
  explanation:
    es: "El plazo es el mes siguiente a la inversión y, en todo caso, tres meses desde la percepción. Un mes desde la inversión del viernes 20 de noviembre de 2026 llegaría al domingo 20 de diciembre de 2026, pero tres meses desde la percepción del martes 1 de septiembre de 2026 terminan antes, el martes 1 de diciembre de 2026: ese tope manda. El jueves 1 de octubre de 2026 es un mes desde la percepción, y el lunes 1 de marzo de 2027 son seis meses, que solo caben con ampliación excepcional."
  citation: "art. 10.1 RD 640/1987"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q074
  prompt:
    es: "Una Caja pagadora percibe el jueves 14 de enero de 2027 fondos a justificar para pagos en el extranjero. Según el artículo 79.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, con meses de fecha a fecha, ¿cuándo vence el plazo si se amplía excepcionalmente al máximo?"
  options:
  - id: a
    text:
      es: "El miércoles 14 de julio de 2027."
  - id: b
    text:
      es: "El jueves 14 de octubre de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 14 de enero de 2028."
  - id: d
    text:
      es: "El viernes 14 de julio de 2028."
  explanation:
    es: "El artículo 79.4 LGP fija para los pagos en el extranjero un plazo de rendición de seis meses y permite al Ministro ampliarlo excepcionalmente a doce. Doce meses de fecha a fecha desde el jueves 14 de enero de 2027 terminan el viernes 14 de enero de 2028. El miércoles 14 de julio de 2027 es el plazo ordinario de seis meses, sin ampliación. El jueves 14 de octubre de 2027, nueve meses, no coincide con ninguna de las dos cifras del apartado, que son seis y doce. El viernes 14 de julio de 2028, dieciocho meses, supera el máximo de doce."
  citation: "art. 79.4 LGP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q075
  prompt:
    es: "Los documentos justificativos de una cuenta se aportan el jueves 19 de noviembre de 2026. Según el artículo 79.6 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, con meses de fecha a fecha, ¿cuál de las siguientes fechas es el límite para aprobarla o repararla?"
  options:
  - id: a
    text:
      es: "Hasta el sábado 19 de diciembre de 2026."
  - id: b
    text:
      es: "Hasta el viernes 19 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el viernes 19 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el martes 19 de enero de 2027."
  explanation:
    es: "La aprobación o reparo de la cuenta se lleva a cabo en el curso de los dos meses siguientes a la fecha de aportación de los documentos justificativos. Dos meses desde el jueves 19 de noviembre de 2026 terminan el martes 19 de enero de 2027. El sábado 19 de diciembre de 2026 es un mes, el viernes 19 de febrero de 2027 tres meses y el viernes 19 de marzo de 2027 cuatro, plazos que el artículo no fija."
  citation: "art. 79.6 LGP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
