# anchor: fuente-ms-mixed-reality-cad-html
- id: m02-l05-q202
  prompt:
    es: "¿Cuál de los siguientes programas figura en la página de Microsoft sobre modelos 3D entre los programas CAD más populares, o de diseño asistido por ordenador?"
  options:
  - id: a
    text:
      es: "Blender"
  - id: b
    text:
      es: "Babylon.js"
  - id: c
    text:
      es: "Sketchfab"
  - id: d
    correct: true
    text:
      es: "AutoCAD"
  explanation:
    es: "La página incluye AutoCAD entre los programas CAD más populares. «Blender» la página lo presenta entre los programas de modelado 3D, no entre los CAD. «Babylon.js» es la herramienta de visor 3D que recomienda la página para comprobar modelos, no un programa CAD. «Sketchfab» es un sitio con modelos prefabricados, no un programa CAD."
