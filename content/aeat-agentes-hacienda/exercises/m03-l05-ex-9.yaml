# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0254
  prompt:
    es: "Conforme al artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los anuncios de citación por comparecencia se publican en el «Boletín Oficial del Estado»:"
  options:
  - id: a
    text:
      es: "dos veces para cada interesado, con quince días de diferencia."
  - id: b
    correct: true
    text:
      es: "por una sola vez para cada interesado."
  - id: c
    text:
      es: "tres veces consecutivas para cada interesado en semanas distintas."
  - id: d
    text:
      es: "por una sola vez para cada procedimiento, aunque haya varios interesados."
  explanation:
    es: "El artículo 112.1 dispone una sola publicación para cada interesado. No son dos publicaciones separadas por quince días, ni tres consecutivas, ni una sola por procedimiento con varios interesados."
  citation: "art. 112.1 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0255
  prompt:
    es: "Según el artículo 112.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los anuncios podrán exponerse también en la oficina de la Administración tributaria del último domicilio fiscal conocido y, si este radicara en el extranjero, en:"
  options:
  - id: a
    text:
      es: "el Ministerio de Asuntos Exteriores, en el tablón de la sede central."
  - id: b
    text:
      es: "el tablón de edictos del ayuntamiento del último domicilio conocido en España."
  - id: c
    text:
      es: "la Cámara de Comercio española con sede en el país correspondiente."
  - id: d
    correct: true
    text:
      es: "el consulado o sección consular de la embajada correspondiente."
  explanation:
    es: "Si el último domicilio estaba en el extranjero, el anuncio puede exponerse en el consulado o sección consular de la embajada correspondiente (art. 112.1). No se prevé el Ministerio de Asuntos Exteriores, un ayuntamiento español ni una Cámara de Comercio."
  citation: "art. 112.1 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0256
  prompt:
    es: "¿Cuál de los siguientes datos consta en la publicación de la relación de notificaciones pendientes por comparecencia, según el artículo 112.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El importe de la deuda tributaria que se notifica."
  - id: b
    text:
      es: "El nombre del funcionario que tramita el procedimiento."
  - id: c
    text:
      es: "La fecha de los intentos de notificación practicados."
  - id: d
    correct: true
    text:
      es: "El órgano competente de su tramitación."
  explanation:
    es: "La publicación incluye el obligado o su representante, el procedimiento que motiva la notificación, el órgano competente de su tramitación y el lugar y plazo para comparecer (art. 112.2). No incluye el importe de la deuda, el funcionario ni la fecha de los intentos, que se hacen constar en el expediente."
  citation: "art. 112.2 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0257
  prompt:
    es: "¿Desde cuándo se cuentan los 15 días naturales de que dispone el destinatario para comparecer, según el artículo 112.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Desde el mismo día de la publicación del anuncio en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "Desde el siguiente al del último intento de notificación en el domicilio fiscal."
  - id: c
    text:
      es: "Desde el siguiente a la exposición del anuncio en la oficina de la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Desde el siguiente al de la publicación del anuncio en el «Boletín Oficial del Estado»."
  explanation:
    es: "Los 15 días naturales se cuentan desde el siguiente al de la publicación en el Boletín Oficial del Estado (art. 112.2). No cuenta el día de la publicación, el último intento ni la exposición del anuncio en la oficina."
  citation: "art. 112.2 LGT"
  difficulty: 2
  tags:
  - "notificaciones"
  - "comparecencia"
  - "plazo"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0258
  prompt:
    es: "¿Cuándo se entiende producida la notificación por comparecencia si el destinatario no comparece dentro del plazo señalado, según el artículo 112.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El día siguiente al del vencimiento del plazo señalado."
  - id: b
    text:
      es: "El último día del plazo señalado para comparecer."
  - id: c
    text:
      es: "A los diez días naturales del vencimiento del plazo señalado para comparecer."
  - id: d
    text:
      es: "El mismo día de la publicación del anuncio."
  explanation:
    es: "Sin comparecencia, la notificación se entiende producida el día siguiente al del vencimiento del plazo (art. 112.2). No es el último día del plazo ni diez días después ni la fecha de la publicación."
  citation: "art. 112.2 LGT"
  difficulty: 1
  tags:
  - "notificaciones"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0259
  prompt:
    es: "El lunes 9 de marzo de 2026 se publica en el «Boletín Oficial del Estado» el anuncio para notificar por comparecencia una liquidación a Víctor Lago. Víctor no comparece. Según el artículo 112.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué día se entiende producida la notificación?"
  options:
  - id: a
    text:
      es: "El martes 24 de marzo de 2026."
  - id: b
    text:
      es: "El jueves 26 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "El miércoles 25 de marzo de 2026."
  - id: d
    text:
      es: "El lunes 9 de marzo de 2026."
  explanation:
    es: "Los 15 días naturales se cuentan desde el siguiente al de la publicación: del martes 10 al martes 24 de marzo de 2026. La notificación se entiende producida el día siguiente al del vencimiento: el miércoles 25 de marzo de 2026. El 24 de marzo es el último día del plazo, el 26 suma un día y el 9 es el día de la publicación."
  citation: "art. 112.2 LGT"
  difficulty: 3
  tags:
  - "notificaciones"
  - "comparecencia"
  - "cómputo"
# anchor: boe-a-2003-23186-art-112
- id: m03-l05-q0260
  prompt:
    es: "El inicio de un procedimiento se entiende notificado a una empresa por no haber comparecido tras la citación. Después la Administración dicta una liquidación y pretende tenerla por notificada por esa misma incomparecencia previa. Conforme al artículo 112.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque se tiene por notificada de las sucesivas actuaciones y diligencias del procedimiento."
  - id: b
    correct: true
    text:
      es: "No, porque las liquidaciones deben notificarse con arreglo a la sección 3.ª, aunque el inicio se haya entendido notificado."
  - id: c
    text:
      es: "Sí, salvo que la empresa comparezca antes del vencimiento del plazo de la liquidación."
  - id: d
    text:
      es: "No, porque tras la incomparecencia la empresa pierde el derecho a comparecer en el procedimiento."
  explanation:
