# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q077
  prompt:
    es: "En Outlook clásico, según la tabla de navegación básica de la ayuda de Microsoft, ¿qué hace el método abreviado Ctrl+Y?"
  options:
  - id: a
    text:
      es: "Abrir la Libreta de direcciones."
  - id: b
    text:
      es: "Cambiar a la vista People."
  - id: c
    text:
      es: "Ir al cuadro de búsqueda."
  - id: d
    correct: true
    text:
      es: "Ir a otra carpeta."
  explanation:
    es: "La tabla de navegación básica de Outlook clásico asigna Ctrl+Y a ir a otra carpeta. Ir al cuadro de búsqueda es F3 o Ctrl+E. Abrir la Libreta de direcciones es Ctrl+Mayús+B. Cambiar a la vista People es Ctrl+4."
  citation: "fuente: `ms-outlook-atajos.html`; «Ir a otra carpeta. — Ctrl+Y»"
  difficulty: 2
  tags:
  - "atajo"
