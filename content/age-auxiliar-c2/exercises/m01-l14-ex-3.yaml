# anchor: boe-a-1986-1216-art-6
- id: m01-l14-q260
  prompt:
    es: "Según el artículo 6 del Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta muy grave:"
  options:
  - id: a
    text:
      es: "La grave desconsideración con los superiores, compañeros o subordinados en el servicio."
  - id: b
    text:
      es: "Causar daños graves en los locales, material o documentos de los servicios de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "La notoria falta de rendimiento que comporte inhibición en el cumplimiento de las tareas encomendadas."
  - id: d
    text:
      es: "La grave perturbación del servicio, cuando afecte a su funcionamiento normal."
  explanation:
    es: "El artículo 6.f) tipifica como falta muy grave «la notoria falta de rendimiento que comporte inhibición en el cumplimiento de las tareas encomendadas». La grave desconsideración y los daños graves en locales, material o documentos son faltas graves del artículo 7.1, letras e) y f). La grave perturbación del servicio es también falta grave, de la letra n) del mismo artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-6
- id: m01-l14-q261
  prompt:
    es: "Conforme al artículo 6 del Real Decreto 33/1986, de 10 de enero, es falta muy grave haber sido sancionado por la comisión de tres faltas graves en un período de:"
  options:
  - id: a
    correct: true
    text:
      es: "un año."
  - id: b
    text:
      es: "tres meses."
  - id: c
    text:
      es: "seis meses."
  - id: d
    text:
      es: "dos años."
  explanation:
    es: "El artículo 6.n) tipifica como falta muy grave «haber sido sancionado por la comisión de tres faltas graves en un período de un año». Los tres meses recuerdan el período de la falta de asistencia injustificada del artículo 7.1.m), que es falta grave. Seis meses y dos años no figuran en el artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-6
- id: m01-l14-q262
  prompt:
    es: "¿Cuál de las siguientes conductas relacionadas con la huelga es falta muy grave según el artículo 6 del Real Decreto 33/1986, de 10 de enero?"
  options:
  - id: a
    text:
      es: "La difusión entre los compañeros de la convocatoria de una huelga legal."
  - id: b
    text:
      es: "La asistencia a una asamblea sindical autorizada durante la jornada de trabajo."
  - id: c
    text:
      es: "La solicitud de permiso sindical para asistir a un congreso de su organización sindical."
  - id: d
    correct: true
    text:
      es: "El incumplimiento de la obligación de atender los servicios esenciales en caso de huelga."
  explanation:
    es: "El artículo 6.l) tipifica como falta muy grave «el incumplimiento de la obligación de atender los servicios esenciales en caso de huelga». Difundir entre los compañeros la convocatoria de una huelga legal, asistir a una asamblea autorizada y pedir un permiso para un congreso sindical no figuran entre las faltas muy graves del artículo."
  citation: "art. 6 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-6
- id: m01-l14-q263
  prompt:
    es: "Según el artículo 6 del Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta muy grave:"
  options:
  - id: a
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
