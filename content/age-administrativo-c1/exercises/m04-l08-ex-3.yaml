# anchor: boe-a-2015-11719-art-96
- id: m04-l08-q049
  prompt:
    es: "Conforme al artículo 96.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando se declara improcedente el despido de personal laboral fijo acordado por la comisión de una falta muy grave:"
  options:
  - id: a
    text:
      es: "La Administración elige entre la readmisión y la indemnización."
  - id: b
    correct: true
    text:
      es: "Procede la readmisión del personal laboral fijo."
  - id: c
    text:
      es: "Procede solo la indemnización, sin readmisión."
  - id: d
    text:
      es: "Procede la readmisión si lo acuerda la Comisión Paritaria."
  explanation:
    es: "El artículo 96.2 dice: «Procederá la readmisión del personal laboral fijo cuando sea declarado improcedente el despido acordado como consecuencia de la incoación de un expediente disciplinario por la comisión de una falta muy grave». La readmisión es la consecuencia; la Administración no puede optar por la indemnización ni pagarla sin readmitir. Tampoco depende de un acuerdo de la Comisión Paritaria."
  citation: "art. 96.2 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1985-151-art-2
- id: m04-l08-q050
  prompt:
    es: "Según el artículo 2.2 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, en el ámbito que delimita se entiende incluido todo el personal:"
  options:
  - id: a
    text:
      es: "Funcionario, con exclusión del sujeto a contrato laboral."
  - id: b
    text:
      es: "Que ocupe un puesto con dedicación a tiempo completo."
  - id: c
    text:
      es: "Que perciba sus retribuciones con cargo a los Presupuestos Generales del Estado."
  - id: d
    correct: true
    text:
      es: "Cualquiera que sea la naturaleza jurídica de la relación de empleo."
  explanation:
    es: "El artículo 2.2 dice: «En el ámbito delimitado en el apartado anterior se entenderá incluido todo el personal, cualquiera que sea la naturaleza jurídica de la relación de empleo». El personal laboral no queda fuera. El artículo no limita la inclusión a la dedicación completa ni a quien cobra de los Presupuestos Generales del Estado."
  citation: "art. 2.2 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-92
- id: m04-l08-q051
  prompt:
    es: "Señale la respuesta correcta sobre el régimen de incompatibilidades del personal del IV Convenio colectivo único para el personal laboral de la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "Se le aplican solo las reglas sobre concurrencia con la actividad de la empresa del Estatuto de los Trabajadores."
  - id: b
    text:
      es: "Se le aplican las reglas propias que acuerde la Comisión Paritaria para cada colectivo profesional."
  - id: c
    correct: true
    text:
      es: "Se le aplican las normas de la legislación sobre incompatibilidades del personal al servicio de las Administraciones Públicas."
  - id: d
    text:
      es: "Se le aplican las normas sobre incompatibilidades solo si ocupa un puesto del grupo M3 o M2."
  explanation:
    es: "El artículo 92 dice: «Serán de aplicación al personal afectado por este Convenio las normas contenidas en la legislación sobre incompatibilidades del personal al servicio de las Administraciones Públicas». No se queda en el deber de no concurrencia del Estatuto de los Trabajadores. No remite a reglas de la Comisión Paritaria ni limita la aplicación a unos grupos profesionales."
  citation: "art. 92 Convenio único"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-2
- id: m04-l08-q052
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el personal laboral que presta servicios en el exterior es correcta según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Está excluido del ámbito de aplicación del Convenio."
  - id: b
    text:
      es: "Está incluido en el Convenio cuando es personal laboral fijo."
  - id: c
    text:
      es: "Está incluido en el Convenio solo en materia de clasificación profesional."
  - id: d
    text:
      es: "Está incluido en el Convenio si depende de un organismo autónomo."
  explanation:
    es: "El artículo 2 excluye del ámbito del Convenio, en su letra a), a «El personal laboral que presta servicios en el exterior». La exclusión no distingue entre fijo y temporal, no deja a salvo ninguna materia y no depende de que el personal sea de un organismo autónomo."
  citation: "art. 2 Convenio único"
  difficulty: 1
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2019-7414-art-1
- id: m04-l08-q053
  prompt:
    es: "¿Cuál de las siguientes entidades cita expresamente el artículo 1.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado entre aquellas cuyo personal laboral incluye en su ámbito?"
  options:
  - id: a
    text:
      es: "El Banco de España."
  - id: b
    text:
      es: "La Comisión Nacional de los Mercados y la Competencia."
  - id: c
    text:
      es: "El Museo Nacional del Prado."
  - id: d
    correct: true
    text:
      es: "El Consejo de Seguridad Nuclear."
  explanation:
    es: "El artículo 1.2 incluye al personal laboral que preste servicios en «c) El Consejo de Seguridad Nuclear». El Banco de España, la Comisión Nacional de los Mercados y la Competencia y el Museo Nacional del Prado no figuran en la lista. El artículo 1.2 cita otro museo, el Museo Nacional Centro de Arte Reina Sofía."
  citation: "art. 1.2 Convenio único"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-1
- id: m04-l08-q054
  prompt:
    es: "Una persona es contratada como personal laboral por la Agencia Española de Protección de Datos. ¿Se le aplica el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "No, porque el Convenio excluye a las autoridades administrativas independientes."
  - id: b
    text:
      es: "No, porque solo se aplica a la Administración General del Estado y sus organismos autónomos."
  - id: c
    correct: true
    text:
      es: "Sí, porque el artículo 1.2 del Convenio incluye expresamente a esa Agencia."
  - id: d
    text:
      es: "Sí, pero solo en materia de jornada, vacaciones y permisos."
  explanation:
    es: "El artículo 1.2 incluye «asimismo» al personal laboral que preste servicios en «d) La Agencia Española de Protección de Datos». El Convenio no excluye a las autoridades administrativas independientes como clase. El artículo 1.1 no agota el ámbito: el 1.2 lo amplía a las entidades que enumera. Y la inclusión es plena, no limitada a unas materias."
  citation: "art. 1.2 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-1
- id: m04-l08-q055
  prompt:
    es: "De acuerdo con el artículo 1.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, se incluye en su ámbito al personal laboral que preste servicios en:"
  options:
  - id: a
    text:
      es: "El Museo Nacional del Prado."
  - id: b
    correct: true
    text:
      es: "El Museo Nacional Centro de Arte Reina Sofía."
  - id: c
    text:
      es: "La Autoridad Independiente de Responsabilidad Fiscal."
  - id: d
    text:
      es: "El Consejo Económico y Social."
  explanation:
    es: "El artículo 1.2 cita, en su letra e), «El Museo Nacional Centro de Arte Reina Sofía». El Museo Nacional del Prado, la Autoridad Independiente de Responsabilidad Fiscal y el Consejo Económico y Social no figuran en él. El personal laboral de las entidades del sector público no citadas expresamente en el artículo 1 queda excluido (art. 2.g)."
  citation: "art. 1.2 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-1
- id: m04-l08-q056
  prompt:
    es: "Según el artículo 1.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, en el Instituto de Gestión Sanitaria (INGESA) se incluye en el Convenio al personal laboral que:"
  options:
  - id: a
    correct: true
    text:
      es: "Presta servicios en los Servicios Centrales y Direcciones Territoriales y/o Provinciales, con cargo a sus créditos."
  - id: b
    text:
      es: "Presta servicios en cualquier centro sanitario o administrativo de la entidad, sin distinción por su dependencia."
  - id: c
    text:
      es: "Presta servicios en los Servicios Centrales, con exclusión expresa de las Direcciones Territoriales y Provinciales."
  - id: d
    text:
      es: "Presta servicios en los centros sanitarios de la entidad y percibe sus retribuciones con cargo a esos centros."
  explanation:
    es: "El artículo 1.2.b) incluye en el INGESA al personal laboral «que presta servicios en las dependencias de los Servicios Centrales y de las Direcciones Territoriales y/o Provinciales de la entidad y percibe sus retribuciones con cargo a los créditos presupuestarios asignados a dichos centros». No incluye a todo el personal de la entidad ni excluye a las Direcciones Territoriales y Provinciales. Los centros sanitarios no son las dependencias que cita."
  citation: "art. 1.2 Convenio único"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2019-7414-art-2
- id: m04-l08-q057
  prompt:
    es: "Conforme al artículo 2.f) del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, las contrataciones de personal cuya relación se formalice expresamente fuera de Convenio se realizarán:"
  options:
  - id: a
    text:
      es: "De forma excepcional, previa autorización expresa de la Comisión Negociadora del Convenio en cada contratación."
  - id: b
    correct: true
    text:
      es: "De forma excepcional e informando a la Comisión Paritaria, donde haya personal del Convenio con idénticas funciones."
  - id: c
    text:
      es: "Libremente, informando después a la Subcomisión Paritaria del Departamento u organismo contratante."
  - id: d
    text:
      es: "De forma excepcional, solo para puestos de los grupos profesionales M3 y M2 sin equivalente en el Convenio."
  explanation:
    es: "El artículo 2.f) dice: «Estas contrataciones se realizarán de forma excepcional, e informando a la Comisión Paritaria, en aquellos ámbitos en los que exista personal laboral del ámbito del Convenio que realice idénticas funciones». No exige autorización de la Comisión Negociadora. No son libres, sino excepcionales, y la información va a la Comisión Paritaria. El artículo no las limita a los grupos M3 y M2."
  citation: "art. 2 Convenio único"
  difficulty: 3
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2019-7414-art-2
- id: m04-l08-q058
  prompt:
    es: "¿Cuál de los siguientes colectivos queda excluido del ámbito de aplicación del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El personal laboral temporal de los organismos autónomos."
  - id: b
    text:
      es: "El personal laboral de Trabajo Penitenciario y Formación para el Empleo."
  - id: c
    text:
      es: "El personal laboral de la Administración de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "El personal laboral de alta dirección."
  explanation:
    es: "El artículo 2.c) excluye a «El personal de alta dirección contemplado en el artículo 2.1.a) del texto refundido de la Ley del Estatuto de los Trabajadores». El personal laboral de los organismos autónomos está incluido por el artículo 1.1, sea fijo o temporal. Trabajo Penitenciario y Formación para el Empleo y la Administración de la Seguridad Social figuran entre las inclusiones del artículo 1.2."
  citation: "art. 2 Convenio único"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2019-7414-art-7
- id: m04-l08-q059
  prompt:
    es: "¿En qué se estructura el sistema de clasificación profesional del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Cuerpos, escalas y especialidades, como el de los funcionarios."
  - id: b
    text:
      es: "Categorías profesionales, niveles retributivos y especialidades."
  - id: c
    correct: true
    text:
      es: "Grupos profesionales, familias profesionales y/o especialidades."
  - id: d
    text:
      es: "Grupos profesionales, áreas funcionales y categorías profesionales."
  explanation:
    es: "El artículo 7.1 dice que el sistema «se estructura en grupos profesionales, familias profesionales y/o especialidades». Cuerpos y escalas son la organización de los funcionarios. Las categorías, los niveles retributivos y las áreas funcionales no son los elementos del sistema del Convenio."
  citation: "art. 7.1 Convenio único"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2019-7414-art-7
- id: m04-l08-q060
  prompt:
    es: "En el sistema de clasificación del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿qué determina el contenido concreto de la prestación laboral y establece el perfil profesional de cada puesto?"
  options:
  - id: a
    correct: true
    text:
      es: "La especialidad asignada al puesto."
  - id: b
    text:
      es: "El grupo profesional del puesto."
  - id: c
    text:
      es: "La familia profesional del puesto."
  - id: d
    text:
      es: "El nivel de titulación del puesto."
  explanation:
    es: "El artículo 7.5 dice: «La especialidad determina el contenido concreto de la prestación laboral y establece el perfil profesional de cada puesto». El grupo profesional agrupa aptitudes, titulaciones y el contenido general de la prestación (art. 7.3). La familia profesional agrupa titulaciones y ocupaciones afines (art. 7.4). El nivel de titulación sirve para encuadrar en un grupo (art. 8.1), no fija el perfil del puesto."
  citation: "art. 7.5 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-7
- id: m04-l08-q061
  prompt:
    es: "De acuerdo con el artículo 7.3 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el grupo profesional agrupa unitariamente:"
  options:
  - id: a
    text:
      es: "Las titulaciones, cualificaciones, profesiones, oficios y ocupaciones afines."
  - id: b
    correct: true
    text:
      es: "Las aptitudes profesionales, las titulaciones y el contenido general de la prestación."
  - id: c
    text:
      es: "Las tareas, funciones y actividades propias de un puesto de trabajo concreto."
  - id: d
    text:
      es: "Los puestos de un mismo centro de trabajo con un mismo nivel retributivo."
  explanation:
    es: "El artículo 7.3 dice: «El grupo profesional agrupa unitariamente las aptitudes profesionales, las titulaciones y el contenido general de la prestación laboral que se corresponde con las mismas». Agrupar titulaciones, cualificaciones, profesiones, oficios y ocupaciones afines es lo que hace la familia profesional (art. 7.4). Las tareas, funciones y actividades de un puesto son el contenido de la prestación laboral (art. 7.2). El centro y el nivel retributivo no definen el grupo."
  citation: "art. 7.3 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-7
- id: m04-l08-q062
  prompt:
    es: "Según el artículo 7.4 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿con qué criterio agrupan las familias profesionales titulaciones, cualificaciones, profesiones, oficios y ocupaciones?"
  options:
  - id: a
    text:
      es: "Nivel de la titulación académica exigida."
  - id: b
    text:
      es: "Antigüedad y experiencia en el puesto."
  - id: c
    text:
      es: "Proximidad territorial de los centros de trabajo."
  - id: d
    correct: true
    text:
      es: "Afinidad de la competencia profesional."
  explanation:
    es: "El artículo 7.4 dice que las familias profesionales agrupan esos elementos «atendiendo a criterios de afinidad de la competencia profesional». El nivel de titulación es el criterio de los grupos profesionales (art. 8.1). La antigüedad y la proximidad territorial no son criterios del artículo."
  citation: "art. 7.4 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-8
- id: m04-l08-q063
  prompt:
    es: "¿Cuál de las siguientes correspondencias entre grupo profesional y titulación exigida para el ingreso es correcta según el artículo 8.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Grupo M1: título del Nivel 2 del Marco Español de Cualificaciones para la Educación Superior."
  - id: b
    text:
      es: "Grupo M2: título del Nivel 3 del Marco Español de Cualificaciones para la Educación Superior."
  - id: c
    correct: true
    text:
      es: "Grupo E2: Título de Bachiller o Técnico o equivalentes."
  - id: d
    text:
      es: "Grupo M3: título del Nivel 2 del Marco Español de Cualificaciones para la Educación Superior."
  explanation:
    es: "El artículo 8.1.d) asigna al «Grupo profesional E2: Título de Bachiller o Técnico o equivalentes». En el Marco Español de Cualificaciones para la Educación Superior, el grupo M1 exige un título del Nivel 1, el M2 uno del Nivel 2 y el M3 uno del Nivel 3. Las otras tres correspondencias cambian el nivel."
  citation: "art. 8.1 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-8
- id: m04-l08-q064
  prompt:
    es: "¿En qué grupo profesional del IV Convenio colectivo único para el personal laboral de la Administración General del Estado se exige para el ingreso el Título de Graduado en Educación Secundaria Obligatoria o Título Profesional Básico?"
  options:
  - id: a
    text:
      es: "En el grupo profesional E0."
  - id: b
    correct: true
    text:
      es: "En el grupo profesional E1."
  - id: c
    text:
      es: "En el grupo profesional E2."
  - id: d
    text:
      es: "En el grupo profesional M1."
  explanation:
    es: "El artículo 8.1.e) dice: «Grupo profesional E1: Título de Graduado en Educación Secundaria Obligatoria o Título Profesional Básico o equivalentes». El E0 es el grupo sin titulación prevista en el sistema educativo. El E2 exige el Título de Bachiller o Técnico. El M1 exige un título del Nivel 1 del Marco Español de Cualificaciones para la Educación Superior."
  citation: "art. 8.1 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-8
- id: m04-l08-q065
  prompt:
    es: "Según el artículo 8.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿en qué nivel del Marco Español de Cualificaciones para la Educación Superior debe estar el título exigido para el grupo M3?"
  options:
  - id: a
    text:
      es: "En el Nivel 2, o equivalentes."
  - id: b
    text:
      es: "En el Nivel 1, o equivalentes."
  - id: c
    text:
      es: "En el Nivel 3, siempre que sea el título de Doctor."
  - id: d
    correct: true
    text:
      es: "En el Nivel 3, o equivalentes."
  explanation:
    es: "El artículo 8.1.a) dice: «Grupo profesional M3: Título clasificado en el Nivel 3 del Marco Español de Cualificaciones para la Educación Superior o equivalentes». El Nivel 2 es el del grupo M2 y el Nivel 1 el del M1. El título de Doctor no es la exigencia general del M3: el artículo 8.3 lo prevé solo para puestos altamente cualificados en que la convocatoria lo requiera."
  citation: "art. 8.1 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-8
- id: m04-l08-q066
  prompt:
    es: "Conforme al artículo 8.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, para el ingreso en el grupo profesional E0 se requiere:"
  options:
  - id: a
    text:
      es: "El certificado de escolaridad o equivalente."
  - id: b
    correct: true
    text:
      es: "Ninguna titulación prevista en el sistema educativo."
  - id: c
    text:
      es: "Un certificado de profesionalidad de nivel 1 o equivalente."
  - id: d
    text:
      es: "El título de Técnico Auxiliar o equivalente."
  explanation:
    es: "El artículo 8.1.f) dice: «Grupo profesional E0: Sin titulación prevista en el sistema educativo». El artículo no exige para el E0 un certificado de escolaridad, un certificado de profesionalidad ni un título de Técnico Auxiliar."
  citation: "art. 8.1 Convenio único"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-11
- id: m04-l08-q067
  prompt:
    es: "Según el artículo 11 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, ¿cuándo puede llevarse a efecto la modificación de la clasificación profesional de determinados colectivos de personal?"
  options:
  - id: a
    text:
      es: "Cuando lo aconseje la planificación de recursos humanos del Departamento u organismo en que presta servicios."
  - id: b
    text:
      es: "Cuando el colectivo acredite una antigüedad media superior a diez años en los puestos que ocupa."
  - id: c
    correct: true
    text:
      es: "Cuando un cambio en la prestación modifique las aptitudes profesionales y/o las titulaciones necesarias."
  - id: d
    text:
      es: "Cuando una reestructuración administrativa afecte al centro de trabajo en que presta servicios el colectivo."
  explanation:
    es: "El artículo 11.1 permite la modificación solo cuando, por un cambio en el contenido de la prestación laboral, «se entienda que se han modificado, a su vez, las aptitudes profesionales y/o las titulaciones necesarias para su desempeño». La planificación de recursos humanos, la antigüedad del colectivo y las reestructuraciones administrativas no son el supuesto del artículo."
  citation: "art. 11 Convenio único"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-11
- id: m04-l08-q068
  prompt:
    es: "La Subcomisión Paritaria de un Departamento propone modificar la clasificación profesional de un colectivo del IV Convenio colectivo único, y la Comisión Paritaria informa favorablemente. ¿Quién puede aprobar la modificación?"
  options:
  - id: a
    correct: true
    text:
      es: "La Comisión Negociadora del Convenio."
  - id: b
    text:
      es: "La Comisión Ejecutiva de la Comisión Interministerial de Retribuciones."
  - id: c
    text:
      es: "La Dirección General de la Función Pública."
  - id: d
    text:
      es: "El Consejo de Ministros, mediante real decreto."
  explanation:
    es: "El artículo 11.2 dice que la modificación «sólo podrá ser aprobada por la Comisión Negociadora del Convenio», a propuesta de la Subcomisión Paritaria y previo informe favorable de la Comisión Paritaria. La Comisión Ejecutiva de la Comisión Interministerial de Retribuciones crea especialidades en algunos grupos (art. 10), pero no aprueba esta modificación. La Dirección General de la Función Pública y el Consejo de Ministros no intervienen en ella."
  citation: "art. 11 Convenio único"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2019-7414-art-11
- id: m04-l08-q069
  prompt:
    es: "De acuerdo con el artículo 11 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, la modificación de la clasificación profesional de determinados colectivos se aprueba a propuesta de:"
  options:
  - id: a
    text:
      es: "La Comisión Paritaria, previo informe favorable de la Subcomisión Paritaria a la que pertenezca el colectivo."
  - id: b
    text:
      es: "El Departamento u organismo afectado, previo informe favorable de la Dirección General de la Función Pública."
  - id: c
    text:
      es: "La Comisión Negociadora, previo informe favorable de la Subcomisión Paritaria del colectivo."
  - id: d
    correct: true
    text:
      es: "La Subcomisión Paritaria a la que pertenezca el colectivo, previo informe favorable de la Comisión Paritaria."
  explanation:
    es: "El artículo 11.2 exige la propuesta de «la correspondiente Subcomisión Paritaria correspondiente a la que pertenezca ese colectivo» y el «previo informe favorable de la Comisión Paritaria». La opción que da la propuesta a la Comisión Paritaria y el informe a la Subcomisión invierte los papeles. El Departamento y la Dirección General de la Función Pública no intervienen. La Comisión Negociadora aprueba la modificación; no la propone."
  citation: "art. 11 Convenio único"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2019-7414-da-tercera
- id: m04-l08-q070
  prompt:
    es: "Conforme al IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el complemento personal de encuadramiento deja de percibirse:"
  options:
  - id: a
    text:
      es: "Al cumplirse cinco años desde la entrada en vigor del Convenio único."
  - id: b
    text:
      es: "Al aplicarse la primera actualización anual general de las retribuciones."
  - id: c
    correct: true
    text:
      es: "Al pasar a un puesto de distinto grupo profesional por un procedimiento del Convenio."
  - id: d
    text:
      es: "Al pasar a otro puesto del mismo grupo profesional mediante concurso."
  explanation:
    es: "La disposición adicional tercera dice que el complemento «tiene carácter personal y dejará de percibirse cuando se pase a ocupar un puesto de trabajo de distinto grupo profesional mediante alguno de los procedimientos previstos en el presente Convenio». No se extingue por el paso de cinco años. La actualización anual no lo extingue: lo actualiza (art. 56.2). Un puesto del mismo grupo no lo hace perder."
  citation: "disposición adicional tercera Convenio único"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2019-7414-da-tercera
- id: m04-l08-q071
  prompt:
    es: "Según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el complemento personal de encuadramiento se asigna al personal de los anteriores grupos profesionales 3, 4 y 5 encuadrado en los nuevos grupos:"
  options:
  - id: a
    text:
      es: "M1, E2 y E1, respectivamente."
  - id: b
    correct: true
    text:
      es: "E2, E1 y E0, respectivamente."
  - id: c
    text:
      es: "E1, E0 y E0, respectivamente."
  - id: d
    text:
      es: "M2, M1 y E2, respectivamente."
  explanation:
    es: "La disposición adicional tercera asigna el complemento al personal de los «anteriores grupos profesionales 3, 4 y 5 en aquellos casos en que los mismos, de acuerdo con el anexo I del presente Convenio, quedan encuadrados en los nuevos grupos E2, E1 y E0 respectivamente». Las otras tres series no coinciden con la disposición."
  citation: "disposición adicional tercera Convenio único"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-56
- id: m04-l08-q072
  prompt:
    es: "Según el artículo 56.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el complemento personal de encuadramiento se actualiza:"
  options:
  - id: a
    correct: true
    text:
      es: "Cada año, desde el 1 de enero, en el porcentaje de incremento general fijado para los empleados públicos de la Administración General del Estado."
  - id: b
    text:
      es: "Cada año, desde el 1 de enero, según la variación del índice de precios de consumo del año anterior en todo el territorio nacional."
  - id: c
    text:
      es: "Cada tres años, en el porcentaje que acuerde la Comisión Paritaria a propuesta de las Subcomisiones Paritarias departamentales."
  - id: d
    text:
      es: "No se actualiza, porque tiene carácter personal y se mantiene en la cuantía fijada a la entrada en vigor del Convenio."
  explanation:
    es: "El artículo 56.2 incluye el complemento personal de encuadramiento entre las retribuciones que «se actualizarán anualmente, y con efectos de 1 de enero, en el porcentaje de incremento general de retribuciones que se fije para todos los empleados públicos de la Administración General del Estado». La referencia no es el índice de precios de consumo. No se actualiza cada tres años ni lo fija la Comisión Paritaria. Su carácter personal no impide la actualización: la disposición adicional tercera la prevé."
  citation: "art. 56.2 Convenio único"
  difficulty: 2
  tags:
  - "efecto"
  - "fecha"
