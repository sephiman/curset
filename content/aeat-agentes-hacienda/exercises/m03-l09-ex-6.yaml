- id: m03-l09-q0175
  prompt:
    es: "¿Qué interés de demora del artículo 26.6 de la Ley 58/2003 fijó la disposición adicional cuadragésima segunda, apartado Dos, de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, para el año 2023?"
