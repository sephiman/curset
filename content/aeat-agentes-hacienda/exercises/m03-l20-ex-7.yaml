  prompt:
    es: "De acuerdo con el artículo 237, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre las mercancías no pertenecientes a la Unión en régimen de depósito:"
  options:
  - id: a
    text:
      es: "Pueden almacenarse sin estar sujetas a derechos de importación, pero sí a los demás gravámenes prescritos por otras disposiciones en vigor."
