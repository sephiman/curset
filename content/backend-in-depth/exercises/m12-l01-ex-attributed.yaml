type: quiz
variants:
- id: m12-l01-qa03
  prompt:
    en: According to Malte Ubl in Design Docs at Google, what does he name as the primary value that design reviews
      add?
  options:
  - id: a
    correct: true
    text:
      en: It brings the combined experience of the organization into a design
  - id: b
    text:
      en: It discovers design issues, whenever in the lifecycle the review happens
  - id: c
    text:
      en: It acts as a formal gate that must finish before implementation work starts
  - id: d
    text:
      en: It gives the author fast feedback through a formal design review meeting
  explanation:
    en: Ubl writes that the primary value of reviews is that they form an opportunity for the combined experience
      of the organization to be incorporated into a design. He writes that the primary value is not that issues
      get discovered per se but that this happens early, when changes are cheap, which rules out discovery at any
      point in the lifecycle. He writes that engineers can seek the most crucial feedback directly and not block
      progress on wider review, which rules out a gate before implementation. He writes that waiting for review
      meetings can significantly slow development, which rules out fast feedback from them.
  citation: industrialempathy-design-docs#review
