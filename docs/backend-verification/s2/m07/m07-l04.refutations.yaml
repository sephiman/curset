m07-l04-q01:
  key:
    anchor: rfc9110#section-9.2.2
    sentence: Of the request methods defined by this specification, PUT, DELETE, and safe request methods are idempotent.
  wrong:
  - option: '`GET`'
    anchor: rfc9110#section-9.2.1
    sentence: Of the request methods defined by this specification, the GET, HEAD, OPTIONS, and TRACE methods are defined to be safe.
    exclusive: true
  - option: '`OPTIONS`'
    anchor: rfc9110#section-9.2.1
    sentence: Of the request methods defined by this specification, the GET, HEAD, OPTIONS, and TRACE methods are defined to be safe.
    exclusive: true
  - option: '`POST`'
    anchor: rfc9110#section-9.2.2
    sentence: Of the request methods defined by this specification, PUT, DELETE, and safe request methods are idempotent.
m07-l04-q02:
  key:
    anchor: rfc9110#section-9.2.2
    sentence: A request method is considered "idempotent" if the intended effect on the server of multiple identical requests with that method is the same as the effect for a single such request.
  wrong:
  - option: Every identical request gets a byte-identical response from the server
    anchor: rfc9110#section-9.2.2
    sentence: It knows that repeating the request will have the same intended effect, even if the original request succeeded, though the response might differ.
  - option: The server does not log or record the repeated requests
    anchor: rfc9110#section-9.2.2
    sentence: Like the definition of safe, the idempotent property only applies to what has been requested by the user; a server is free to log each request separately, retain a revision control history, or implement other non-idempotent side effects for each idempotent request.
  - option: The client does not request or expect any state change on the origin server
    anchor: rfc9110#section-9.2.1
    sentence: Request methods are considered "safe" if their defined semantics are essentially read-only; i.e., the client does not request, and does not expect, any state change on the origin server as a result of applying a safe method to a target resource.
m07-l04-q03:
  key:
    anchor: rfc9110#section-9.2.2
    sentence: A proxy MUST NOT automatically retry non-idempotent requests.
  wrong:
  - option: A client can always retry a `POST` request after the connection closed, because the server never applied it
    anchor: rfc9110#section-9.2.2
    sentence: A client SHOULD NOT automatically retry a request with a non-idempotent method unless it has some means to know that the request semantics are actually idempotent, regardless of the method, or some means to detect that the original request was never applied.
  - option: A client should keep retrying a failed automatic retry until it succeeds
    anchor: rfc9110#section-9.2.2
    sentence: A client SHOULD NOT automatically retry a failed automatic retry.
  - option: Idempotent requests cannot be repeated automatically, because the first request may have succeeded
    anchor: rfc9110#section-9.2.2
    sentence: Idempotent methods are distinguished because the request can be repeated automatically if a communication failure occurs before the client is able to read the server's response.
m07-l04-q04:
  key:
    anchor: rfc9110#section-15.4
    sentence: 307 (Temporary Redirect) and 308 (Permanent Redirect) [RFC7538] were later added to unambiguously indicate method-preserving redirects, and status codes 301 and 302 have been adjusted to allow a POST request to be redirected as GET.
  wrong:
  - option: '`301` and `302`'
    anchor: rfc9110#section-15.4
    sentence: However, early user agents split on whether to redirect POST requests as POST (according to then-current specification) or as GET (the safer alternative when redirected to a different site).
  - option: '`303` alone'
    anchor: rfc9110#section-15.4
    sentence: 303 (See Other) was defined for a redirection that changed its method to GET.
  - option: '`300` and `304`'
    anchor: rfc9110#section-15.4
    sentence: Redirection to a previously stored result, as in the 304 (Not Modified) status code.
m07-l04-q05:
  key:
    anchor: rfc9110#section-15.1
    sentence: Responses with status codes that are defined as heuristically cacheable (e.g., 200, 203, 204, 206, 300, 301, 308, 404, 405, 410, 414, and 501 in this specification) can be reused by a cache with heuristic expiration unless otherwise indicated by the method definition or explicit cache controls [CACHING]; all other status codes are not heuristically cacheable.
  wrong:
  - option: '`201`'
    anchor: rfc9110#section-15.1
    sentence: all other status codes are not heuristically cacheable.
    exclusive: true
  - option: '`302`'
    anchor: rfc9110#section-15.1
    sentence: all other status codes are not heuristically cacheable.
    exclusive: true
  - option: '`500`'
    anchor: rfc9110#section-15.1
    sentence: all other status codes are not heuristically cacheable.
    exclusive: true
m07-l04-q06:
  key:
    anchor: rfc9111#section-5.2
    sentence: Cache directives are unidirectional, in that the presence of a directive in a request does not imply that the same directive is present or copied in the response.
  wrong:
  - option: A proxy that implements no cache may drop the directives it forwards, because nothing in it can use them
    anchor: rfc9111#section-5.2
    sentence: A proxy, whether or not it implements a cache, MUST pass cache directives through in forwarded messages, regardless of their significance to that application, since the directives might apply to all recipients along the request/response chain.
  - option: A directive can be addressed to one specific cache along the chain
    anchor: rfc9111#section-5.2
    sentence: It is not possible to target a directive to a specific cache.
  - option: Directive names are case-sensitive tokens
    anchor: rfc9111#section-5.2
    sentence: Cache directives are identified by a token, to be compared case-insensitively
m07-l04-q07:
