type: quiz
variants:
- id: m10-l01-q01
  prompt:
    en: In Spring Boot's default log output, Logback has no `FATAL` level of its own. Which level does a message
      logged at `FATAL` map to?
  options:
  - id: a
    correct: true
    text:
      en: '`ERROR`'
  - id: b
    text:
      en: '`WARN`'
  - id: c
    text:
      en: '`INFO`'
  - id: d
    text:
      en: '`TRACE`'
  explanation:
    en: '`FATAL` is mapped to `ERROR`. The levels `WARN`, `INFO` and `TRACE` are all excluded by that mapping, because
      Logback has no `FATAL` level and maps it to `ERROR` alone.'
  citation: spring-boot-features-logging#features.logging.log-format
- id: m10-l01-q02
  prompt:
    en: In the OpenTelemetry log data model, which statement about the `TraceId` and `SpanId` fields of a log record
      is correct?
  options:
  - id: a
    text:
      en: '`TraceId` is a required field of every log record'
  - id: b
    text:
      en: '`SpanId` is a required field of every log record'
  - id: c
    correct: true
    text:
      en: If `SpanId` is present, `TraceId` should also be present
  - id: d
    text:
      en: '`TraceId` is a vendor-specific identifier that W3C Trace Context does not define'
  explanation:
    en: If `SpanId` is present, `TraceId` should also be present. A required `TraceId` on every record is wrong
      because the field can be set only for logs that are part of request processing with an assigned trace ID.
      A required `SpanId` on every record is wrong because the data model marks the field as optional. A vendor-specific
      `TraceId` is wrong because the field is the request trace ID as defined in W3C Trace Context.
  citation: otel-spec-logs-data-model#field-spanid; otel-spec-logs-data-model#field-traceid
  extract:
    en: If SpanId is present TraceId SHOULD be also present.
- id: m10-l01-q04
  prompt:
    en: Which headers does the default propagator of OpenTelemetry use to move the context of a request between
      two services that exchange HTTP calls?
  options:
  - id: a
    text:
      en: The `b3` headers of the Zipkin B3 specification
  - id: b
    text:
      en: The `uber-trace-id` header of the Jaeger format
  - id: c
    text:
      en: The `X-Amzn-Trace-Id` header of AWS X-Ray
  - id: d
    correct: true
    text:
      en: The headers specified by the W3C `TraceContext` specification
  explanation:
    en: The default propagator uses the headers specified by the W3C `TraceContext` specification. The Zipkin `b3`
      headers, the Jaeger `uber-trace-id` header and the AWS `X-Amzn-Trace-Id` header are all excluded, because
      the default propagator uses the W3C `TraceContext` headers.
  citation: otel-context-propagation#propagation
  extract:
    en: The default propagator uses the headers specified by the W3C TraceContext specification.
- id: m10-l01-q05
  prompt:
    en: According to the W3C Trace Context specification, which fields does the `traceparent` HTTP header have?
  options:
  - id: a
    text:
      en: 'Two fields: trace-id and parent-id'
  - id: b
    text:
      en: 'Three fields: version, trace-id and trace-flags'
  - id: c
    correct: true
    text:
      en: 'Four fields: version, trace-id, parent-id and trace-flags'
  - id: d
    text:
      en: 'Five fields: version, trace-id, parent-id, trace-flags and trace-state'
  explanation:
    en: 'The header has four fields: version, trace-id, parent-id and trace-flags. The options with two, three and
      five fields are all excluded, because the header has exactly four and `trace-state` is not one of them.'
  citation: w3c-trace-context#x3-2-traceparent-header
  extract:
    en: 'It has four fields: version trace-id parent-id trace-flags'
- id: m10-l01-q06
  prompt:
    en: By default, Spring Boot does not reinstate `ThreadLocal` values in reactive operators. Which property, set
      to `auto`, turns on automatic context propagation there?
  options:
  - id: a
    text:
      en: '`spring.task.execution.propagate-context`'
  - id: b
    text:
      en: '`management.tracing.exemplars.include`'
  - id: c
    text:
      en: '`logging.structured.format.console`'
  - id: d
    correct: true
    text:
      en: '`spring.reactor.context-propagation`'
  explanation:
    en: Setting `spring.reactor.context-propagation` to `auto` enables automatic propagation in reactive operators.
      The property `spring.task.execution.propagate-context` is wrong because it is the opt-in for `@Async` methods.
      The property `management.tracing.exemplars.include` is wrong because it controls which traces are included
      as Prometheus exemplars. The property `logging.structured.format.console` is wrong because it selects the
      structured log format for console output.
  citation: spring-boot-actuator-observability#actuator.observability.context-propagation; spring-boot-actuator-metrics#actuator.metrics.export.prometheus;
    spring-boot-features-logging#features.logging.structured
- id: m10-l01-q08
  prompt:
    en: According to the Spring Boot documentation on observability, which three pillars does the ability to observe
      a running system from the outside consist of?
  options:
  - id: a
    correct: true
    text:
      en: Logging, metrics and traces
  - id: b
    text:
      en: Metrics, traces and profiles
  - id: c
    text:
      en: Logging, metrics and alerts
  - id: d
    text:
      en: Logging, tracing and health checks
  explanation:
    en: The three pillars are logging, metrics and traces. Metrics, traces and profiles, logging, metrics and alerts,
      and logging, tracing and health checks are all excluded, because the documentation names exactly logging,
      metrics and traces.
  citation: spring-boot-actuator-observability#page-title
- id: m10-l01-q09
  prompt:
    en: Which time series of a classic Prometheus histogram with the base metric name `<basename>` exposes the total
      sum of all observed values?
  options:
  - id: a
    text:
      en: '`<basename>_count`'
  - id: b
    correct: true
    text:
      en: '`<basename>_sum`'
  - id: c
    text:
      en: '`<basename>_bucket{le="+Inf"}`'
  - id: d
    text:
      en: '`<basename>{quantile="0.5"}`'
  explanation:
    en: The total sum of all observed values is exposed as `<basename>_sum`. The series `<basename>_count` is wrong
      because it exposes the count of events that have been observed. The series `<basename>_bucket{le="+Inf"}`
      is wrong because the `_bucket` series are cumulative counters for the observation buckets. The series `<basename>{quantile="0.5"}`
      is wrong because it belongs to a summary and exposes a streaming φ-quantile.
  citation: prom-metric-types#histogram; prom-metric-types#summary
  extract:
    en: the total sum of all observed values, exposed as <basename>_sum
- id: m10-l01-q10
  prompt:
    en: In a classic Prometheus histogram, which observations does the bucket series with the label `le="0.3"` count?
  options:
  - id: a
    correct: true
    text:
      en: All observations less than or equal to 0.3
  - id: b
    text:
      en: Only observations greater than 0.2 and at most 0.3
  - id: c
    text:
      en: Only observations equal to 0.3
  - id: d
    text:
      en: All observations greater than 0.3
  explanation:
    en: The bucket counts all observations less than or equal to 0.3. The band between 0.2 and 0.3, only the value
      0.3 and everything above 0.3 are all excluded, because every bucket is cumulative and counts all observations
      up to the upper boundary in its label.
  citation: prom-metric-types#histogram
  extract:
    en: these buckets are cumulative , i.e. every bucket counts all observations less than or equal to the upper
      boundary provided as a label
- id: m10-l01-q11
  prompt:
    en: Which metric name for the duration of HTTP requests follows the Prometheus guidance on base units and unit
      suffixes?
  options:
  - id: a
    text:
      en: '`http_request_duration_milliseconds`'
  - id: b
    correct: true
    text:
      en: '`http_request_duration_seconds`'
  - id: c
    text:
      en: '`http_request_duration`'
  - id: d
    text:
      en: '`http_request_size_and_duration_seconds`'
  explanation:
    en: The name `http_request_duration_seconds` uses a base unit as its suffix. The name `http_request_duration_milliseconds`
      is wrong because names should use base units, not milliseconds. The name `http_request_duration` is wrong
      because a name should have a suffix describing the unit, in plural form. The name `http_request_size_and_duration_seconds`
      is wrong because a name must refer to a single quantity and must not mix request size with request duration.
  citation: prom-naming#metric-names
  extract:
    en: SHOULD use base units (e.g. seconds, bytes, meters - not milliseconds, megabytes, kilometers)
- id: m10-l01-q12
  prompt:
    en: In Spring Boot, what is the default state of the `/actuator/prometheus` endpoint that presents a Prometheus
      scrape of one application instance?
  options:
  - id: a
    text:
      en: It is exposed over HTTP automatically
  - id: b
    text:
      en: It is exposed over JMX only
  - id: c
    correct: true
    text:
      en: It is not available until you expose it
  - id: d
    text:
      en: It is available once a Pushgateway dependency is present
  explanation:
    en: The endpoint is not available by default and must be exposed. Automatic exposure over HTTP, exposure over
      JMX only and availability once a Pushgateway dependency is present are all excluded, because by default the
      endpoint is not available at all until it is exposed.
  citation: spring-boot-actuator-metrics#actuator.metrics.export.prometheus
- id: m10-l01-q13
  prompt:
    en: In Spring Boot, with a `SpanContext` bean present so that Prometheus exemplars are enabled, which traces
      are included as exemplars by default?
  options:
  - id: a
    text:
      en: All traces, sampled or not
  - id: b
    correct: true
    text:
      en: Only sampled traces
  - id: c
    text:
      en: Only traces that ended with an error
  - id: d
    text:
      en: Only traces started by a scrape request
  explanation:
    en: By default, only sampled traces are included as exemplars. All traces, sampled or not, is wrong because
      the value `all` of `management.tracing.exemplars.include` is not supported with Prometheus. Traces that ended
      with an error only, and traces started by a scrape request only, are both excluded, because the default includes
      only sampled traces.
  citation: spring-boot-actuator-metrics#actuator.metrics.export.prometheus
- id: m10-l01-q14
  prompt:
    en: A service runs as several replicas and you want one overall 95th percentile of request duration. Which approach
      does the Prometheus documentation present as the working one?
  options:
  - id: a
    text:
      en: Average the `quantile="0.95"` series of the summaries of all replicas
  - id: b
    correct: true
    text:
      en: Sum the `_bucket` series by `le` of a classic histogram, then apply `histogram_quantile()`
  - id: c
    text:
      en: Configure a summary with a 0.95-quantile on every replica and add the results
  - id: d
    text:
      en: Publish client-side percentiles from every replica with `publishPercentiles` and combine them across tags
  explanation:
    en: Summing the `_bucket` series by `le` and then applying `histogram_quantile()` gives an aggregated percentile.
      Averaging the `quantile="0.95"` series is wrong because averaging the quantiles yields statistically nonsensical
      values. Adding the results of per-replica summaries is wrong because aggregating the precomputed quantiles
      from a summary rarely makes sense. Combining client-side percentiles across tags is wrong because it is not
      possible to aggregate percentile approximations across tags.
  citation: prom-histograms#quantiles; micrometer-concepts-histogram#page-title
  extract:
    en: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) // GOOD.
- id: m10-l01-q15
  prompt:
    en: Which Micrometer timer option publishes percentile values computed in the application, which cannot be aggregated
      across dimensions?
  options:
  - id: a
    correct: true
    text:
      en: '`publishPercentiles`'
  - id: b
    text:
      en: '`publishPercentileHistogram`'
  - id: c
    text:
      en: '`serviceLevelObjectives`'
  - id: d
    text:
      en: '`minimumExpectedValue`'
  explanation:
    en: The option `publishPercentiles` publishes percentile values computed in the application, and they are non-aggregable
      across dimensions. The option `publishPercentileHistogram` is wrong because it publishes a histogram suitable
      for aggregable percentile approximations. The option `serviceLevelObjectives` is wrong because it publishes
      a cumulative histogram with buckets defined by your SLOs. The option `minimumExpectedValue` is wrong because
      it controls the number of buckets shipped by `publishPercentileHistogram`.
  citation: micrometer-concepts-histogram#page-title
- id: m10-l01-q16
  prompt:
    en: Starting from which Micrometer version does the library provide the Observation API and a plugin mechanism
      that lets you add capabilities, including tracing?
  options:
  - id: a
    text:
      en: '1.5'
  - id: b
    text:
      en: '1.8'
  - id: c
    text:
      en: '1.14'
  - id: d
    correct: true
    text:
      en: '1.10'
  explanation:
    en: The Observation API starts with Micrometer 1.10. The versions 1.5, 1.8 and 1.14 are all excluded as starting
