      es: "Ctrl+1"
  explanation:
    es: "Ctrl+Mayús+dos puntos (:) inserta la hora actual. Ctrl+punto y coma (;) inserta la fecha, Ctrl+Mayús+# aplica el formato de fecha predeterminado y Ctrl+1 abre el cuadro Formato de celdas."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q110
  prompt:
    es: "En Excel 365, con una celda de fecha seleccionada, ¿cuál de los siguientes métodos abreviados le aplica rápidamente el formato de fecha predeterminado?"
  options:
  - id: a
    text:
      es: "Ctrl+1"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+#"
  - id: c
    text:
      es: "Ctrl+Mayús+F"
  - id: d
    text:
      es: "Ctrl+punto y coma (;)"
  explanation:
    es: "Ctrl+Mayús+# aplica rápidamente el formato de fecha predeterminado. Ctrl+1 abre Formato de celdas, Ctrl+Mayús+F da formato a fuentes en ese cuadro y Ctrl+punto y coma (;) inserta la fecha actual."
