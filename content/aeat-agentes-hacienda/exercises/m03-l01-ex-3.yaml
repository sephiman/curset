# anchor: boe-a-2003-21614-art-5
- id: m03-l01-q0048
  prompt:
    es: "De acuerdo con el artículo 5.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la respuesta CORRECTA sobre la clasificación de los derechos de la Hacienda Pública estatal:"
  options:
  - id: a
    correct: true
    text:
      es: "Se clasifican en derechos de naturaleza pública y de naturaleza privada."
  - id: b
    text:
      es: "Se clasifican en derechos de naturaleza tributaria y de naturaleza no tributaria."
  - id: c
    text:
      es: "Se clasifican en derechos de naturaleza estatal y de naturaleza autonómica."
  - id: d
    text:
      es: "Se clasifican en derechos de naturaleza ordinaria y de naturaleza extraordinaria."
  explanation:
    es: "Los derechos de la Hacienda Pública estatal se dividen en derechos de naturaleza pública y de naturaleza privada. La distinción entre tributarios y no tributarios no es la del artículo, que incluye los tributos dentro de los derechos públicos. Tampoco hay una división entre estatales y autonómicos, porque la Hacienda de la que se habla es solo la estatal. Ordinarios y extraordinarios es una clasificación que el precepto no usa."
  citation: "art. 5.2 LGP"
  difficulty: 1
  tags:
  - "lgp"
  - "derechos"
# anchor: boe-a-2003-21614-art-5
- id: m03-l01-q0049
  prompt:
    es: "Según el artículo 5.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué derechos de la Hacienda Pública estatal son de naturaleza pública?"
  options:
  - id: a
    text:
      es: "Solo los tributos, con exclusión de los demás derechos de contenido económico que deriven de potestades administrativas."
  - id: b
    text:
      es: "Los derechos económicos que derivan de la gestión del patrimonio de la Administración General del Estado."
  - id: c
    correct: true
    text:
      es: "Los tributos y los demás derechos de contenido económico que deriven del ejercicio de potestades administrativas."
  - id: d
    text:
      es: "Los tributos exigidos por la Administración General del Estado y por las Comunidades Autónomas."
  explanation:
    es: "Son públicos los tributos y los demás derechos de contenido económico derivados del ejercicio de potestades administrativas. Limitarlos a los tributos deja fuera esos otros derechos. Los que nacen de la gestión del patrimonio no derivan de potestades administrativas. Los tributos autonómicos no forman parte de la Hacienda Pública estatal."
  citation: "art. 5.2 LGP"
  difficulty: 2
  tags:
  - "lgp"
  - "derechos"
# anchor: boe-a-2003-21614-art-5
- id: m03-l01-q0109
  prompt:
    es: "¿Qué naturaleza tienen los tributos entre los derechos de la Hacienda Pública estatal, de acuerdo con el artículo 5.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Son derechos de naturaleza pública."
  - id: b
    text:
      es: "Son derechos de naturaleza privada."
  - id: c
    text:
      es: "Son derechos de naturaleza mixta, según la procedencia del ingreso."
  - id: d
    text:
      es: "Son derechos de naturaleza patrimonial, no tributaria."
  explanation:
    es: "Los tributos son derechos de naturaleza pública, según el artículo 5.2. La naturaleza privada es la otra clase de la clasificación y no es la de los tributos. La naturaleza mixta y la patrimonial no figuran en la clasificación del precepto."
  citation: "art. 5.2 LGP"
  difficulty: 2
  tags:
  - "lgp"
  - "derechos"
# anchor: boe-a-1978-31229-art-156
- id: m03-l01-q0050
  prompt:
    es: "De acuerdo con el artículo 156.1 de la Constitución Española, las Comunidades Autónomas gozan de autonomía financiera para el desarrollo y ejecución de sus competencias con arreglo a los principios de:"
  options:
  - id: a
    correct: true
    text:
      es: "Coordinación con la Hacienda estatal y de solidaridad entre todos los españoles."
  - id: b
    text:
      es: "Jerarquía respecto de la Hacienda estatal y de uniformidad entre todos los territorios."
  - id: c
    text:
      es: "Coordinación con la Hacienda estatal y de reciprocidad entre las Comunidades Autónomas."
  - id: d
    text:
      es: "Subordinación a la Hacienda estatal y de solidaridad entre las Comunidades Autónomas."
  explanation:
    es: "La autonomía financiera se ejerce con coordinación con la Hacienda estatal y solidaridad entre todos los españoles. La jerarquía y la uniformidad niegan la autonomía. La reciprocidad entre Comunidades sustituye a una solidaridad que el artículo extiende a todos los españoles. La subordinación a la Hacienda estatal contradice la coordinación que fija el precepto."
  citation: "art. 156.1 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "autonomía-financiera"
# anchor: boe-a-1978-31229-art-156
- id: m03-l01-q0051
  prompt:
    es: "Según el artículo 156.2 de la Constitución Española, ¿en qué condición pueden actuar las Comunidades Autónomas respecto de los recursos tributarios del Estado?"
  options:
  - id: a
    text:
      es: "Como titulares de la potestad originaria para establecerlos, de acuerdo con las leyes y los Estatutos."
  - id: b
    text:
      es: "Como delegados del Estado únicamente para su inspección, con independencia de lo que digan los Estatutos."
  - id: c
    text:
      es: "Como sustitutos del Estado en su recaudación, sin sujeción a las leyes estatales."
  - id: d
    correct: true
    text:
      es: "Como delegados o colaboradores del Estado para su recaudación, gestión y liquidación, de acuerdo con las leyes y los Estatutos."
  explanation:
    es: "Pueden ser delegados o colaboradores del Estado en la recaudación, la gestión y la liquidación de sus recursos tributarios, con arreglo a las leyes y los Estatutos. La potestad originaria es del Estado, según el artículo 133.1. La delegación del artículo no se limita a la inspección ni prescinde de los Estatutos. Actuar sin sujeción a las leyes estatales contradice la remisión que hace el precepto."
  citation: "art. 156.2 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "autonomía-financiera"
# anchor: boe-a-1978-31229-art-157
- id: m03-l01-q0052
  prompt:
    es: "De acuerdo con el artículo 157.1 de la Constitución Española, los recursos de las Comunidades Autónomas están constituidos por impuestos cedidos total o parcialmente por el Estado, recargos sobre impuestos estatales y:"
  options:
  - id: a
    text:
      es: "Otras participaciones en los ingresos de las Corporaciones locales."
  - id: b
    text:
      es: "Las participaciones en los tributos locales de su territorio."
  - id: c
    correct: true
    text:
      es: "Otras participaciones en los ingresos del Estado."
  - id: d
    text:
      es: "Los tributos que recauden las Diputaciones Forales."
  explanation:
    es: "Junto a los impuestos cedidos y los recargos, el primer recurso que cita el artículo incluye otras participaciones en los ingresos del Estado. Los ingresos de las Corporaciones locales, sus tributos y los de las Diputaciones Forales no son una fuente de las Comunidades Autónomas en ese apartado."
  citation: "art. 157.1 CE"
  difficulty: 1
  tags:
  - "constitución"
  - "recursos-ccaa"
# anchor: boe-a-1978-31229-art-157
- id: m03-l01-q0054
  prompt:
    es: "Una Comunidad Autónoma aprueba un impuesto sobre inmuebles situados en el territorio de otra Comunidad Autónoma. ¿Qué establece el artículo 157.2 de la Constitución Española sobre esa medida?"
  options:
  - id: a
    text:
      es: "Está permitida, porque la autonomía financiera les permite gravar bienes en todo el territorio español."
  - id: b
    text:
      es: "Está permitida, siempre que la apruebe el Consejo de Política Fiscal y Financiera."
  - id: c
    correct: true
    text:
      es: "Está prohibida, porque las Comunidades Autónomas no podrán en ningún caso adoptar medidas tributarias sobre bienes situados fuera de su territorio."
  - id: d
    text:
      es: "Está prohibida solo si la medida supone obstáculo para la libre circulación de mercancías o servicios."
  explanation:
    es: "El artículo 157.2 prohíbe en todo caso las medidas tributarias sobre bienes situados fuera del territorio de la Comunidad. La autonomía financiera no llega a gravar bienes de otro territorio. El Consejo de Política Fiscal y Financiera no puede autorizar lo que la Constitución prohíbe. El obstáculo a la libre circulación es un segundo supuesto de prohibición, distinto del primero, no una condición de este."
  citation: "art. 157.2 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "límites-ccaa"
# anchor: boe-a-1978-31229-art-158
- id: m03-l01-q0055
  prompt:
    es: "De acuerdo con el artículo 158.1 de la Constitución Española, en los Presupuestos Generales del Estado podrá establecerse una asignación a las Comunidades Autónomas en función del volumen de los servicios y actividades estatales que hayan asumido y de la garantía de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio español."
  - id: b
    text:
      es: "Un nivel máximo de endeudamiento autonómico en todo el territorio español."
  - id: c
    text:
      es: "Un nivel uniforme de tributación en todas las Comunidades Autónomas."
  - id: d
    text:
      es: "Un nivel equivalente de ingresos por habitante en cada Comunidad Autónoma."
  explanation:
    es: "La asignación atiende al volumen de servicios asumidos y a la garantía de un nivel mínimo de prestación de los servicios públicos fundamentales en todo el territorio. El endeudamiento máximo, la tributación uniforme y los ingresos equivalentes por habitante son garantías que el artículo no recoge."
  citation: "art. 158.1 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "asignaciones"
# anchor: boe-a-1980-21166-art-2
- id: m03-l01-q0058
  prompt:
    es: "De acuerdo con el artículo 2.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, entre los principios de la actividad financiera de las Comunidades Autónomas figura la garantía de un nivel base equivalente de financiación de:"
  options:
  - id: a
    text:
      es: "Todos los servicios públicos, con independencia de las competencias asumidas por cada Comunidad Autónoma."
  - id: b
    text:
      es: "Los servicios públicos fundamentales, en función de la capacidad fiscal de cada Comunidad Autónoma."
  - id: c
    text:
      es: "Los servicios públicos fundamentales, solo en las Comunidades Autónomas de régimen común."
  - id: d
    correct: true
    text:
      es: "Los servicios públicos fundamentales, independientemente de la Comunidad Autónoma de residencia."
  explanation:
    es: "El nivel base equivalente se garantiza para los servicios públicos fundamentales, con independencia de la Comunidad de residencia. Extenderlo a todos los servicios amplía el objeto de la garantía. Vincularlo a la capacidad fiscal de cada Comunidad contradice la equivalencia. Limitarlo a las Comunidades de régimen común restringe el alcance, cuando el precepto habla de la Comunidad de residencia sin distinguir."
  citation: "art. 2.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "principios"
# anchor: boe-a-1980-21166-art-2
- id: m03-l01-q0059
  prompt:
    es: "Según el artículo 2.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, ¿quién garantiza el equilibrio económico y a través de qué instrumento?"
  options:
  - id: a
    correct: true
    text:
      es: "El Estado, a través de la política económica general."
  - id: b
    text:
      es: "Las Comunidades Autónomas, a través de sus presupuestos anuales."
  - id: c
    text:
      es: "El Estado, a través del Consejo de Política Fiscal y Financiera."
  - id: d
    text:
      es: "Las Comunidades Autónomas, a través de la política económica de cada territorio."
  explanation:
    es: "El equilibrio económico lo garantiza el Estado a través de la política económica general. Atribuirlo a las Comunidades cambia el sujeto. El Consejo de Política Fiscal y Financiera sirve para la coordinación de la actividad financiera, según el artículo 3.1, no para garantizar el equilibrio. La política económica de cada territorio no es el instrumento que fija el precepto."
  citation: "art. 2.Uno LOFCA"
  difficulty: 1
  tags:
  - "lofca"
  - "principios"
# anchor: boe-a-1980-21166-art-2
- id: m03-l01-q0060
  prompt:
    es: "De acuerdo con el artículo 2.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, señale cuál de los siguientes principios NO rige la actividad financiera de las Comunidades Autónomas:"
  options:
  - id: a
    text:
      es: "La solidaridad entre las diversas nacionalidades y regiones."
  - id: b
    text:
      es: "El principio de lealtad institucional."
  - id: c
    correct: true
    text:
      es: "La competencia fiscal entre territorios para atraer actividad económica."
  - id: d
    text:
      es: "La suficiencia de recursos para las competencias propias."
  explanation:
    es: "La competencia fiscal entre territorios para atraer actividad no está entre los principios del artículo 2.Uno, de modo que es la respuesta. La solidaridad entre nacionalidades y regiones, la lealtad institucional y la suficiencia de recursos para las competencias propias sí figuran en la lista."
  citation: "art. 2.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "principios"
# anchor: boe-a-1980-21166-art-2
- id: m03-l01-q0061
  prompt:
    es: "Una Comunidad Autónoma crea un sistema de ingresos que impone barreras fiscales a los productos procedentes de otras Comunidades. ¿Qué principio del artículo 2.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas no respeta?"
  options:
  - id: a
    text:
      es: "El de corresponsabilidad de las Comunidades Autónomas y el Estado en materia de ingresos y gastos públicos."
  - id: b
    correct: true
    text:
      es: "El de un sistema de ingresos que no implique privilegios económicos o sociales ni barreras fiscales en el territorio español."
  - id: c
    text:
      es: "El de garantía del equilibrio económico por el Estado a través de la política económica general."
  - id: d
    text:
      es: "El de lealtad institucional entre las Comunidades Autónomas y el Estado en la gestión de sus recursos."
  explanation:
    es: "Las barreras fiscales en el territorio español chocan con el principio de un sistema de ingresos sin privilegios ni barreras. La corresponsabilidad se refiere a las competencias de ingresos y gastos, y el equilibrio económico es una garantía del Estado. La lealtad institucional es otro principio de la lista, y no es el que describe la situación del caso."
  citation: "art. 2.Uno LOFCA"
  difficulty: 3
  tags:
  - "lofca"
  - "principios"
# anchor: boe-a-1980-21166-art-3
- id: m03-l01-q0062
  prompt:
    es: "De acuerdo con el artículo 3.1 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, para la adecuada coordinación entre la actividad financiera de las Comunidades Autónomas y de la Hacienda del Estado se crea por esta Ley:"
  options:
  - id: a
    text:
      es: "La Conferencia de Presidentes de las Comunidades Autónomas."
  - id: b
    text:
      es: "La Comisión Mixta de Coordinación Tributaria autonómica."
  - id: c
    correct: true
    text:
      es: "El Consejo de Política Fiscal y Financiera de las Comunidades Autónomas."
  - id: d
    text:
      es: "El Consejo de Estado de Política Fiscal y Presupuestaria."
  explanation:
    es: "El órgano de coordinación es el Consejo de Política Fiscal y Financiera de las Comunidades Autónomas. La Conferencia de Presidentes es un foro de cooperación política y no es el que crea este artículo. Las otras dos denominaciones no corresponden a ningún órgano que el precepto establezca."
  citation: "art. 3.1 LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "coordinación"
# anchor: boe-a-1980-21166-art-4
- id: m03-l01-q0064
  prompt:
    es: "¿A quién corresponde, conforme al artículo 4.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, el producto de una multa que impone una Comunidad Autónoma a un particular por una infracción tipificada en una materia de su competencia?"
  options:
  - id: a
    text:
      es: "Al Estado, porque el producto de las multas y sanciones se ingresa en el Tesoro con carácter general."
  - id: b
    text:
      es: "A las Corporaciones locales del territorio donde se haya cometido la infracción."
  - id: c
    text:
      es: "Al Fondo de Garantía de Servicios Públicos Fundamentales, que lo reparte entre todas las Comunidades."
  - id: d
    correct: true
    text:
      es: "A la Comunidad Autónoma, porque el producto de las multas y sanciones en el ámbito de su competencia es uno de sus recursos."
  explanation:
    es: "El producto de las multas y sanciones en el ámbito de su competencia es un recurso de la Comunidad, según el artículo 4.Uno. El Tesoro estatal no es el destinatario de las multas impuestas por materias autonómicas. Las Corporaciones locales no figuran como beneficiarias. El Fondo de Garantía es otro recurso distinto, que se nutre por otras vías."
  citation: "art. 4.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "recursos-ccaa"
# anchor: boe-a-1980-21166-art-6
- id: m03-l01-q0065
  prompt:
    es: "Una Comunidad Autónoma aprueba por ley un tributo cuyo hecho imponible coincide con el de un impuesto que ya grava el Estado. ¿Qué dispone el artículo 6.Dos de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas sobre ese tributo?"
  options:
  - id: a
    text:
      es: "Puede establecerse, porque pueden establecer y exigir tributos propios de acuerdo con la Constitución y las leyes."
  - id: b
    text:
      es: "Puede establecerse, siempre que la Comunidad ceda al Estado la mitad de la recaudación."
  - id: c
    correct: true
    text:
      es: "No puede establecerse, porque los tributos de las Comunidades Autónomas no podrán recaer sobre hechos imponibles gravados por el Estado."
  - id: d
    text:
      es: "No puede establecerse, salvo que lo autorice el Consejo de Política Fiscal y Financiera."
  explanation:
    es: "Los tributos autonómicos no pueden recaer sobre hechos imponibles que ya grave el Estado. La potestad de establecer tributos propios existe, pero con ese límite expreso. La cesión de la mitad de la recaudación al Estado no es una condición que fije el artículo, y tampoco hay autorización del Consejo de Política Fiscal y Financiera que levante la prohibición."
  citation: "art. 6.Dos LOFCA"
  difficulty: 3
  tags:
  - "lofca"
  - "tributos-propios"
# anchor: boe-a-1980-21166-art-10
- id: m03-l01-q0067
  prompt:
    es: "Según el artículo 10.1 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, ¿qué se entiende por tributos cedidos?"
  options:
  - id: a
    text:
      es: "Los establecidos y regulados por la Comunidad Autónoma, cuyo producto corresponda al Estado."
  - id: b
    text:
      es: "Los establecidos por el Estado y regulados por la Comunidad Autónoma, cuyo producto corresponda a esta."
  - id: c
    correct: true
    text:
      es: "Los establecidos y regulados por el Estado, cuyo producto corresponda a la Comunidad Autónoma."
  - id: d
    text:
      es: "Los establecidos y regulados por el Estado, cuyo producto se reparta entre las Comunidades Autónomas y las Corporaciones locales."
  explanation:
    es: "Son tributos cedidos los que el Estado establece y regula y cuyo producto corresponde a la Comunidad. Invertir los papeles describe un tributo propio de la Comunidad que revierte al Estado. Que la Comunidad los regule contradice que los regule el Estado. Repartir el producto con las Corporaciones locales añade un destinatario que el precepto no menciona."
  citation: "art. 10.1 LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "tributos-cedidos"
# anchor: boe-a-1980-21166-art-10
- id: m03-l01-q0069
  prompt:
    es: "¿Cómo se califica, según el artículo 10.3 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, la cesión cuando el Estado cede a una Comunidad Autónoma la recaudación de uno solo de los dos hechos imponibles de un tributo estatal?"
  options:
  - id: a
    text:
      es: "Total, porque se ha cedido la recaudación de un hecho imponible completo."
  - id: b
    text:
      es: "Total, porque el tributo sigue siendo de titularidad estatal."
  - id: c
    correct: true
    text:
      es: "Parcial, porque se ha cedido la recaudación de uno solo de los hechos imponibles del tributo."
  - id: d
    text:
      es: "Parcial, pero solo si además se cede la gestión de los dos hechos imponibles."
  explanation:
    es: "La cesión es parcial si se ha cedido la recaudación de alguno de los hechos imponibles, y aquí solo se cede uno de dos. Es total únicamente cuando se ceden todos. La titularidad estatal del tributo no determina el carácter de la cesión. La cesión de la gestión no es requisito de la calificación parcial."
  citation: "art. 10.3 LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "tributos-cedidos"
# anchor: boe-a-1980-21166-art-11
- id: m03-l01-q0070
  prompt:
    es: "¿Con qué límite máximo puede cederse con carácter parcial el Impuesto sobre la Renta de las Personas Físicas según el artículo 11 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas?"
  options:
  - id: a
    correct: true
    text:
      es: "Con el límite máximo del 50 por ciento."
  - id: b
    text:
      es: "Con el límite máximo del 58 por ciento."
  - id: c
    text:
      es: "Con el límite máximo del 40 por ciento."
  - id: d
    text:
      es: "Sin límite máximo, porque se cede en su totalidad."
  explanation:
    es: "El IRPF se cede con carácter parcial con el límite máximo del 50 por ciento. El 58 por ciento es el límite de los impuestos especiales de fabricación, con las excepciones del precepto. El 40 por ciento no figura en el artículo. La cesión total no está prevista para este impuesto."
  citation: "art. 11 LOFCA"
  difficulty: 1
  tags:
  - "lofca"
  - "tributos-cedidos"
  - "cifras"
# anchor: boe-a-1980-21166-art-11
- id: m03-l01-q0071
  prompt:
    es: "De acuerdo con el artículo 11 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, los Impuestos Especiales de Fabricación pueden cederse con carácter parcial con el límite máximo del 58 por ciento de cada uno de ellos, excepto:"
  options:
  - id: a
    text:
      es: "El Impuesto sobre Hidrocarburos y el Impuesto sobre las Labores del Tabaco."
  - id: b
    text:
      es: "El Impuesto sobre la Electricidad y el Impuesto sobre el Alcohol y Bebidas Derivadas."
  - id: c
    text:
      es: "El Impuesto Especial sobre Determinados Medios de Transporte y el Impuesto sobre Hidrocarburos."
  - id: d
    correct: true
    text:
      es: "El Impuesto sobre la Electricidad y el Impuesto sobre Hidrocarburos."
  explanation:
