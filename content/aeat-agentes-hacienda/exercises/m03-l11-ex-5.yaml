# anchor: boe-a-2003-23186-art-163
- id: m03-l11-q0069
  prompt:
    es: "Según el artículo 163.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la competencia para entender del procedimiento de apremio y resolver todas sus incidencias corresponde:"
  options:
  - id: a
    text:
      es: "A la Administración tributaria y, en los casos de oposición, a los juzgados."
  - id: b
    correct: true
    text:
      es: "Únicamente a la Administración tributaria."
  - id: c
    text:
      es: "A los órganos jurisdiccionales, a instancia de la Administración tributaria."
  - id: d
    text:
      es: "A los órganos económico-administrativos, que resuelven las incidencias del apremio."
  explanation:
    es: "El procedimiento de apremio es exclusivamente administrativo y la competencia sobre él y sobre todas sus incidencias corresponde únicamente a la Administración tributaria. No comparte esa competencia con los juzgados, ni se tramita a instancia de la Administración ante ellos, ni se resuelven sus incidencias en la vía económico-administrativa."
  citation: "art. 163.1 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "competencia"
# anchor: boe-a-2003-23186-art-163
- id: m03-l11-q0071
  prompt:
    es: "Conforme al artículo 163.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento administrativo de apremio, respecto de los procedimientos judiciales y de otros procedimientos de ejecución:"
  options:
  - id: a
    text:
      es: "Será acumulable a los judiciales, pero no a otros procedimientos administrativos de ejecución."
  - id: b
    text:
      es: "Será acumulable a otros procedimientos de ejecución cuando concurran sobre los mismos bienes."
  - id: c
    text:
      es: "No será acumulable a los judiciales, pero sí a otros procedimientos administrativos de ejecución."
  - id: d
    correct: true
    text:
      es: "No será acumulable a los judiciales ni a otros procedimientos de ejecución."
  explanation:
    es: "El apremio no se acumula a los procedimientos judiciales ni a otros procedimientos de ejecución. Las demás versiones permiten una acumulación que el artículo excluye. La concurrencia sobre los mismos bienes se resuelve por las reglas de preferencia del artículo 164, no por acumulación."
  citation: "art. 163.2 LGT"
  difficulty: 1
  tags:
  - "apremio"
  - "acumulación"
# anchor: boe-a-2003-23186-art-163
- id: m03-l11-q0072
  prompt:
    es: "Según el artículo 163.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre con la iniciación o tramitación del procedimiento de apremio cuando se inician procedimientos judiciales de ejecución?"
  options:
  - id: a
    text:
      es: "Se suspende hasta que el órgano judicial resuelva sobre la preferencia de los bienes."
  - id: b
    correct: true
    text:
      es: "No se suspende, salvo lo establecido en la legislación de conflictos jurisdiccionales o en las normas del artículo 164."
  - id: c
    text:
      es: "Se suspende siempre que el procedimiento judicial se haya iniciado con anterioridad al apremio."
  - id: d
    text:
      es: "No se suspende en ningún caso, ni siquiera cuando proceda por la legislación de conflictos jurisdiccionales."
  explanation:
    es: "La iniciación o tramitación del apremio no se suspende por la iniciación de procedimientos judiciales, salvo cuando proceda conforme a la legislación de conflictos jurisdiccionales o a las normas del artículo 164. No se suspende por defecto ni por antigüedad del procedimiento judicial, y tampoco es cierto que no pueda suspenderse nunca: hay esas dos salvedades."
  citation: "art. 163.2 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2003-23186-art-163
- id: m03-l11-q0073
  prompt:
    es: "De acuerdo con el artículo 163.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de apremio se iniciará e impulsará:"
  options:
  - id: a
    correct: true
    text:
      es: "De oficio en todos sus trámites."
  - id: b
    text:
      es: "De oficio en su inicio y a instancia del obligado en los restantes trámites."
  - id: c
    text:
      es: "A instancia de la Administración acreedora ante el órgano de recaudación."
  - id: d
    text:
      es: "De oficio hasta la providencia de apremio y a instancia de parte después."
  explanation:
    es: "El apremio se inicia e impulsa de oficio en todos sus trámites. No se reparte entre oficio e instancia de parte ni requiere una petición de la Administración acreedora."
  citation: "art. 163.3 LGT"
  difficulty: 1
  tags:
  - "apremio"
  - "impulso de oficio"
# anchor: boe-a-2003-23186-art-163
- id: m03-l11-q0074
  prompt:
    es: "Según el artículo 163.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una vez iniciado el procedimiento de apremio, solo se suspenderá:"
  options:
  - id: a
    text:
      es: "En los casos y en la forma que acuerde el órgano judicial competente."
  - id: b
    text:
      es: "En los casos que solicite el obligado y apruebe el órgano de recaudación."
  - id: c
    correct: true
    text:
      es: "En los casos y en la forma prevista en la normativa tributaria."
  - id: d
    text:
      es: "En los casos y en la forma prevista en la legislación procesal civil."
  explanation:
    es: "El apremio solo se suspende en los casos y en la forma que prevea la normativa tributaria. No lo suspende un juez por su cuenta, ni basta la solicitud del obligado, ni rige la legislación procesal civil."
  citation: "art. 163.3 LGT"
  difficulty: 1
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2003-23186-art-164
- id: m03-l11-q0077
  prompt:
    es: "Según el artículo 164.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo es preferente el procedimiento de apremio frente a procesos o procedimientos concursales o universales de ejecución?"
  options:
  - id: a
    text:
      es: "Para todos los bienes del deudor, siempre que la providencia de apremio fuera anterior a la declaración del concurso."
  - id: b
    text:
      es: "Para los bienes o derechos embargados en él, aunque el embargo se hubiera efectuado después de la declaración del concurso."
  - id: c
    text:
      es: "Para los bienes o derechos embargados en él, siempre que el embargo sea el más antiguo de los practicados sobre ellos."
  - id: d
    correct: true
    text:
      es: "Para los bienes o derechos embargados en él, siempre que el embargo se hubiera efectuado con anterioridad a la fecha de declaración del concurso."
  explanation:
    es: "Frente a los procedimientos concursales o universales, el apremio es preferente para los bienes o derechos embargados en él, siempre que su embargo sea anterior a la declaración del concurso. No se extiende a todos los bienes del deudor, ni a embargos posteriores a la declaración. Y la regla del embargo más antiguo es la de los procedimientos singulares."
  citation: "art. 164.1 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "concurrencia"
  - "concurso"
# anchor: boe-a-2003-23186-art-164
- id: m03-l11-q0078
  prompt:
    es: "Conforme al artículo 164.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para determinar la preferencia en la ejecución de los bienes trabados, tanto frente a procedimientos singulares como frente a concursales o universales, se estará a la fecha:"
  options:
  - id: a
    correct: true
    text:
      es: "De la diligencia de embargo del bien o derecho."
  - id: b
    text:
      es: "De la providencia de apremio dictada contra el obligado."
  - id: c
    text:
      es: "De la anotación preventiva del embargo en el registro público."
  - id: d
    text:
      es: "De la notificación de la deuda al obligado tributario."
  explanation:
    es: "En ambos casos se estará a la fecha de la diligencia de embargo del bien o derecho. La providencia inicia el apremio, pero no fija la preferencia. La anotación en el registro y la notificación de la deuda tampoco son la fecha que el artículo señala."
  citation: "art. 164.1 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "concurrencia"
# anchor: boe-a-2005-14803-art-77
- id: m03-l11-q0079
  prompt:
    es: "Según el artículo 77.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando el procedimiento de apremio concurra con otros procesos o procedimientos singulares de ejecución, será preferente si el embargo efectuado en su curso es el más antiguo y, a estos efectos, se estará a la fecha:"
  options:
  - id: a
    correct: true
    text:
      es: "De la diligencia de embargo del bien o derecho."
  - id: b
    text:
      es: "De la providencia de apremio del obligado al pago."
  - id: c
    text:
      es: "De la inscripción del embargo en el Registro de la Propiedad."
  - id: d
    text:
      es: "De la presentación de la demanda ejecutiva por el acreedor."
  explanation:
    es: "El reglamento repite la regla de la ley: se estará a la fecha de la diligencia de embargo del bien o derecho. No cuenta la providencia, ni la inscripción registral, ni la demanda de otro acreedor."
  citation: "art. 77.1 RGR"
  difficulty: 2
  tags:
  - "apremio"
  - "concurrencia"
# anchor: boe-a-2003-23186-art-164
- id: m03-l11-q0081
  prompt:
    es: "De acuerdo con el artículo 164.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en caso de concurso de acreedores se aplicará la normativa concursal sin que ello impida que se dicte la providencia de apremio y se devenguen los recargos del período ejecutivo si:"
  options:
  - id: a
    text:
      es: "Se dieran las condiciones para ello con posterioridad a la fecha de declaración del concurso y se trate de créditos que tengan calificación concursal."
  - id: b
    text:
      es: "El administrador concursal lo autorice por considerar que el pago no perjudica a la masa."
  - id: c
    correct: true
    text:
      es: "Se dieran las condiciones para ello con anterioridad a la fecha de declaración del concurso o se trate de créditos contra la masa."
  - id: d
    text:
      es: "El juez del concurso lo autorice por resolución motivada, previa audiencia del deudor."
  explanation:
    es: "La providencia y los recargos son posibles si las condiciones se daban antes de declararse el concurso o si se trata de créditos contra la masa. No bastan condiciones posteriores en créditos concursales, y no hace falta autorización del administrador concursal ni del juez."
  citation: "art. 164.2 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "concurso"
# anchor: boe-a-2003-23186-art-165
- id: m03-l11-q0083
  prompt:
    es: "Según el artículo 165.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo suspenden los órganos de recaudación el procedimiento de apremio cuando el interesado demuestra que la deuda ha sido ingresada, condonada, compensada, aplazada o suspendida?"
  options:
  - id: a
    text:
      es: "De forma automática, pero con garantía suficiente por el importe de la deuda."
  - id: b
    text:
      es: "A solicitud del interesado, mediante resolución expresa del órgano competente para el recurso."
  - id: c
    text:
      es: "De forma automática, solo durante los seis meses siguientes a la solicitud."
  - id: d
    correct: true
    text:
      es: "De forma automática y sin necesidad de prestar garantía."
  explanation:
    es: "En esos casos la suspensión es automática y sin necesidad de prestar garantía. No se exige garantía, ni resolución expresa a solicitud, ni se limita a seis meses."
  citation: "art. 165.2 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2003-23186-art-165
- id: m03-l11-q0084
  prompt:
    es: "¿Cuál de las siguientes circunstancias, si el interesado la demuestra, suspende de forma automática el procedimiento de apremio conforme al artículo 165.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que la deuda ha sido recurrida mediante recurso contencioso-administrativo."
  - id: b
    correct: true
    text:
      es: "Que ha prescrito el derecho a exigir el pago."
  - id: c
    text:
      es: "Que el obligado carece de bienes suficientes para pagar la deuda."
  - id: d
    text:
      es: "Que el obligado ha cambiado de domicilio fiscal durante el procedimiento."
  explanation:
    es: "La prescripción del derecho a exigir el pago es una de las causas de suspensión automática del artículo 165.2, junto con el error material, aritmético o de hecho y el ingreso, condonación, compensación, aplazamiento o suspensión de la deuda. El recurso contencioso, la falta de bienes y el cambio de domicilio no figuran entre ellas."
  citation: "art. 165.2 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2005-14803-art-73
- id: m03-l11-q0085
  prompt:
    es: "De acuerdo con el artículo 73.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando el interesado demuestre la existencia de error material, aritmético o de hecho en la determinación de la deuda, se le notificará:"
  options:
  - id: a
    text:
      es: "El archivo definitivo de las actuaciones del procedimiento de apremio por extinción de la deuda."
  - id: b
    text:
      es: "La continuación del procedimiento de apremio con garantía por el importe de la deuda."
  - id: c
    correct: true
    text:
      es: "La suspensión de las actuaciones del procedimiento de apremio en tanto se dicte el acuerdo correspondiente."
  - id: d
    text:
      es: "La devolución de lo embargado hasta que se dicte el acuerdo que corresponda."
  explanation:
    es: "Al interesado se le notifica la suspensión de las actuaciones en tanto se dicte el acuerdo correspondiente. No hay archivo definitivo por la sola demostración del error, ni continuación con garantía, ni devolución de lo embargado."
  citation: "art. 73.2 RGR"
  difficulty: 2
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2005-14803-art-73
- id: m03-l11-q0086
  prompt:
    es: "Según el artículo 73.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cómo se tramita y resuelve la suspensión del procedimiento de apremio como consecuencia de un recurso o reclamación económico-administrativa?"
  options:
  - id: a
    text:
      es: "De acuerdo con las normas de la Ley de Enjuiciamiento Civil sobre ejecución provisional de las resoluciones."
  - id: b
    text:
      es: "De acuerdo con el criterio del órgano de recaudación, que decide en cada caso sin trámite específico."
  - id: c
    correct: true
    text:
      es: "De acuerdo con las normas de desarrollo de la Ley General Tributaria en materia de revisión en vía administrativa."
  - id: d
    text:
      es: "De acuerdo con las normas del procedimiento de apremio, sin aplicar las de revisión."
  explanation:
    es: "La suspensión por recurso o reclamación económico-administrativa se tramita y resuelve conforme a las normas de desarrollo de la Ley General Tributaria en materia de revisión en vía administrativa. No se rige por la Ley de Enjuiciamiento Civil, ni por un criterio libre del órgano de recaudación, ni por las normas del apremio con exclusión de las de revisión."
  citation: "art. 73.1 RGR"
  difficulty: 2
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2003-23186-art-166
- id: m03-l11-q0087
  prompt:
    es: "Conforme al artículo 166.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se declare la nulidad de determinadas actuaciones del procedimiento de apremio:"
  options:
  - id: a
    correct: true
    text:
      es: "Se dispondrá la conservación de las no afectadas por la causa de la nulidad."
  - id: b
    text:
      es: "Se dispondrá la anulación de todas las actuaciones posteriores a la providencia de apremio."
  - id: c
    text:
      es: "Se dispondrá la retroacción del procedimiento al momento de iniciarse el período ejecutivo."
  - id: d
    text:
      es: "Se conservarán solo las actuaciones de embargo practicadas antes de la declaración de nulidad."
  explanation:
    es: "La nulidad de unas actuaciones no arrastra a las demás: se conserva lo no afectado por la causa de nulidad. No se anula todo lo posterior a la providencia, ni se retrotrae el procedimiento al inicio del período ejecutivo, ni se conservan solo los embargos."
  citation: "art. 166.1 LGT"
  difficulty: 1
  tags:
  - "apremio"
  - "nulidad"
  - "conservación"
# anchor: boe-a-2003-23186-art-166
- id: m03-l11-q0088
  prompt:
    es: "Según el artículo 166.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la anulación de los recargos u otros componentes de la deuda tributaria distintos de la cuota o de las sanciones:"
  options:
  - id: a
    correct: true
    text:
      es: "No afectará a la validez de las actuaciones realizadas en el curso del procedimiento respecto a los componentes no anulados."
  - id: b
    text:
      es: "Afectará a la validez de todas las actuaciones realizadas en el curso del procedimiento de apremio."
  - id: c
    text:
      es: "Obligará a la Administración a iniciar un nuevo procedimiento respecto de la cuota y de las sanciones."
  - id: d
    text:
      es: "Afectará a la validez de las actuaciones relativas a la cuota, pero no a las relativas a las sanciones."
  explanation:
    es: "Anular recargos u otros componentes distintos de la cuota o de las sanciones no afecta a la validez de las actuaciones sobre los componentes o sanciones no anulados. No hay que empezar de nuevo, ni se arrastra la cuota o las sanciones."
  citation: "art. 166.2 LGT"
  difficulty: 2
  tags:
  - "apremio"
  - "nulidad"
  - "conservación"
# anchor: boe-a-2003-23186-art-165
- id: m03-l11-q0133
  prompt:
    es: "Conforme al artículo 165 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la suspensión del procedimiento de apremio por los órganos de recaudación sin necesidad de prestar garantía:"
  options:
  - id: a
    text:
      es: "Procede por la sola interposición de un recurso económico-administrativo contra la providencia de apremio dictada al obligado."
  - id: b
    text:
      es: "Procede cuando el interesado ofrece bienes suficientes para el embargo en sustitución de la garantía."
  - id: c
    correct: true
    text:
      es: "Procede cuando el interesado demuestra error material, aritmético o de hecho en la determinación de la deuda."
  - id: d
    text:
      es: "Procede cuando el interesado solicita el aplazamiento de la deuda una vez iniciado el procedimiento."
  explanation:
    es: "La suspensión automática y sin garantía procede cuando el interesado demuestra error material, aritmético o de hecho en la determinación de la deuda, entre los demás casos del artículo 165.2. El recurso económico-administrativo suspende en la forma y con los requisitos de su normativa (artículo 165.1), no por su sola interposición. Ofrecer bienes o solicitar un aplazamiento ya iniciado el apremio no figuran entre los casos del artículo 165.2."
  citation: "art. 165.2 LGT"
  difficulty: 3
  tags:
  - "apremio"
  - "suspensión"
# anchor: boe-a-2003-23186-art-165
- id: m03-l11-q0138
  prompt:
    es: "¿En qué forma y con qué requisitos se suspende el procedimiento de apremio por la interposición de un recurso o reclamación económico-administrativa, según el artículo 165.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Únicamente cuando el órgano judicial competente acuerde la suspensión en el recurso contencioso-administrativo."
  - id: b
    text:
      es: "De forma automática desde la interposición de cualquier recurso o reclamación, sin necesidad de requisito alguno."
  - id: c
    text:
      es: "Solo si el obligado aporta garantía suficiente que cubra la totalidad de la deuda y de los recargos del período ejecutivo."
  - id: d
    correct: true
    text:
      es: "En la forma y con los requisitos previstos en las disposiciones reguladoras de los recursos y reclamaciones económico-administrativas."
  explanation:
    es: "El procedimiento de apremio se suspende en la forma y con los requisitos previstos en las disposiciones reguladoras de los recursos y reclamaciones económico-administrativas y en los restantes supuestos de la normativa tributaria (art. 165.1). La suspensión no es automática por la mera interposición de cualquier recurso: se rige por esas disposiciones, y la automática por falta de garantía solo se da en los supuestos del apartado 2, como el error material, aritmético o de hecho. Exigir siempre una garantía que cubra todo contradice que la forma y los requisitos los fije la norma reguladora de cada recurso. Y condicionarla a una decisión judicial desconoce que el precepto remite a las normas de los recursos y reclamaciones económico-administrativas."
  citation: "art. 165.1 LGT"
  difficulty: 2
  tags:
  - "procedimiento de apremio"
  - "suspensión"
