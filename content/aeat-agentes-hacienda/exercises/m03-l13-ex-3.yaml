# anchor: boe-a-2003-23186-art-183
- id: m03-l13-q0031
  prompt:
    es: "De acuerdo con el artículo 183.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son infracciones tributarias las acciones u omisiones dolosas o culposas:"
  options:
  - id: a
    text:
      es: "Con cualquier grado de negligencia que estén tipificadas en esa ley, pero no en otras leyes que las sancionen."
  - id: b
    text:
      es: "Con grave negligencia que estén tipificadas y sancionadas como tales en esa u otra ley."
  - id: c
    correct: true
    text:
      es: "Con cualquier grado de negligencia que estén tipificadas y sancionadas como tales en esa u otra ley."
  - id: d
    text:
      es: "Con dolo o negligencia que hayan causado un perjuicio económico a la Hacienda Pública."
  explanation:
    es: "El artículo 183.1 LGT exige acciones u omisiones dolosas o culposas con cualquier grado de negligencia, tipificadas y sancionadas en la LGT o en otra ley. No basta la negligencia grave, no se limita a la LGT y no exige perjuicio económico."
  citation: "art. 183.1 LGT"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-23186-art-183
- id: m03-l13-q0032
  prompt:
    es: "Según el artículo 183.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo se clasifican las infracciones tributarias?"
  options:
  - id: a
    text:
      es: "En ordinarias, cualificadas y muy cualificadas, según la ocultación que concurra."
  - id: b
    text:
      es: "En formales, materiales y de resultado, según el perjuicio a la Hacienda Pública."
  - id: c
    text:
      es: "En leves y graves, que pueden agravarse si se cometen con medios fraudulentos."
  - id: d
    correct: true
    text:
      es: "En leves, graves y muy graves."
  explanation:
    es: "El artículo 183.2 LGT clasifica las infracciones en leves, graves y muy graves. Las clasificaciones en ordinarias y cualificadas, o en formales, materiales y de resultado, no existen en el texto. Los medios fraudulentos no crean una categoría aparte: determinan que la infracción sea muy grave."
  citation: "art. 183.2 LGT"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0033
  prompt:
    es: "Conforme al artículo 184.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la calificación de las infracciones tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Cada infracción se califica de forma unitaria como leve, grave o muy grave."
  - id: b
    text:
      es: "La calificación se fija en el reglamento de cada tributo y no en los artículos 191 a 206."
  - id: c
    text:
      es: "Cada infracción se califica por partes, según el importe de la base de la sanción que corresponda."
  - id: d
    text:
      es: "La calificación depende de los criterios de graduación del artículo 187, que se aplican a cada infracción."
  explanation:
    es: "El artículo 184.1 LGT dice que cada infracción se califica de forma unitaria y de acuerdo con los artículos 191 a 206. No se divide según tramos de la base. Los criterios de graduación del artículo 187 no califican: gradúan la sanción dentro de su porcentaje."
  citation: "art. 184.1 LGT"
  difficulty: 2
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0035
  prompt:
    es: "Cuando se omiten total o parcialmente operaciones, ingresos o rentas, ¿a partir de qué incidencia de la deuda derivada sobre la base de la sanción existe ocultación de datos, según el artículo 184.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Superior al 5 por ciento."
  - id: b
    correct: true
    text:
      es: "Superior al 10 por ciento."
  - id: c
    text:
      es: "Superior al 25 por ciento."
  - id: d
    text:
      es: "Igual o superior al 20 por ciento."
  explanation:
    es: "Según el artículo 184.2 LGT, hay ocultación si la incidencia de la deuda derivada de ella sobre la base de la sanción es superior al 10 por ciento. El 20 por ciento es el umbral del incumplimiento sustancial de facturación del artículo 187.1.c, y el 25 y el 50 por ciento son tramos del perjuicio económico y de la llevanza incorrecta de libros."
  citation: "art. 184.2 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
  - "ocultación"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0036
  prompt:
    es: "La base de una sanción es de 20.000 euros. Tras una inspección se constata que Hermanos Ibarra, S.A. omitió operaciones y que la deuda derivada de esa omisión equivale a 1.800 euros de esa base. Según el artículo 184.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿existe ocultación?"
  options:
  - id: a
    text:
      es: "No, porque para que exista ocultación la omisión debe afectar a más del 20 por ciento de la base."
  - id: b
    text:
      es: "Sí, porque la deuda derivada de la omisión es el 18 por ciento de la base y supera con creces el 10 por ciento."
  - id: c
    text:
      es: "Sí, porque se han omitido operaciones, y el porcentaje que representan sobre la base es irrelevante."
  - id: d
    correct: true
    text:
      es: "No, porque la deuda derivada de la omisión es el 9 por ciento de la base y no supera el 10 por ciento."
  explanation:
    es: "El artículo 184.2 LGT exige que la incidencia de la deuda derivada de la ocultación sobre la base de la sanción sea superior al 10 por ciento. Aquí es 1.800 / 20.000 = 9 por ciento, así que no hay ocultación. Omitir operaciones no basta por sí solo, el 18 por ciento es un cálculo equivocado y el 20 por ciento no es el umbral de este artículo."
  citation: "art. 184.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "ocultación"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0037
  prompt:
    es: "Según el artículo 184.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los medios fraudulentos:"
  options:
  - id: a
    text:
      es: "La utilización de personas interpuestas es medio fraudulento solo si el tercero ha dado su consentimiento."
  - id: b
    correct: true
    text:
      es: "El empleo de facturas o documentos falsos se considera medio fraudulento si su incidencia supera el 10 por ciento de la base de la sanción."
  - id: c
    text:
      es: "El empleo de facturas o documentos falsos se considera medio fraudulento si su incidencia supera el 50 por ciento."
  - id: d
    text:
      es: "El empleo de facturas o documentos falsos es siempre un medio fraudulento, cualquiera que sea su incidencia."
  explanation:
    es: "El artículo 184.3.b LGT considera medio fraudulento el empleo de documentos falsos o falseados cuando su incidencia sea superior al 10 por ciento de la base de la sanción. No lo es en todo caso ni al 50 por ciento. Y la letra c habla de personas interpuestas con o sin consentimiento del tercero."
  citation: "art. 184.3 LGT"
  difficulty: 3
  tags:
  - "porcentaje"
  - "medios fraudulentos"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0038
  prompt:
    es: "De acuerdo con el artículo 184.3.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, se considera medio fraudulento la utilización de personas o entidades interpuestas cuando el sujeto infractor, con la finalidad de ocultar su identidad, haya hecho figurar a nombre de un tercero:"
  options:
  - id: a
    correct: true
    text:
      es: "Con o sin su consentimiento, la titularidad de bienes o derechos, la obtención de rentas o la realización de operaciones con trascendencia tributaria."
  - id: b
    text:
      es: "Con o sin su consentimiento, únicamente la titularidad de bienes inmuebles o de valores mobiliarios."
  - id: c
    text:
      es: "Con su consentimiento por escrito, la titularidad de bienes o derechos y la obtención de rentas, pero no las operaciones."
  - id: d
    text:
      es: "Sin su conocimiento, la titularidad de los bienes o derechos de los que derive la obligación tributaria."
  explanation:
    es: "El artículo 184.3.c LGT no exige consentimiento del tercero: vale con o sin él. Abarca la titularidad de bienes o derechos, la obtención de rentas o ganancias y la realización de operaciones con trascendencia tributaria. No se limita a inmuebles y valores ni exige ausencia de conocimiento."
  citation: "art. 184.3 LGT"
  difficulty: 3
  tags:
  - "medios fraudulentos"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0039
  prompt:
    es: "¿Cuál de las siguientes conductas se considera anomalía sustancial en la contabilidad y en los libros o registros según el artículo 184.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El incumplimiento absoluto de la obligación de llevanza de la contabilidad o de los libros o registros establecidos por la normativa tributaria."
  - id: b
    text:
      es: "La llevanza de los libros registro con errores de transcripción que no alteren la determinación de la deuda."
  - id: c
    text:
      es: "El retraso de hasta dos meses en la legalización de los libros de contabilidad en el Registro Mercantil."
  - id: d
    text:
      es: "La llevanza de contabilidades distintas que, referidas a distintas actividades, permitan conocer la situación de la empresa."
  explanation:
    es: "El artículo 184.3.a.1.º LGT considera anomalía sustancial el incumplimiento absoluto de la obligación de llevar la contabilidad o los libros o registros. Un retraso en la legalización o unos errores de transcripción sin efecto no están en la lista. Y las contabilidades distintas solo son anomalía si, referidas a una misma actividad y ejercicio, no permiten conocer la verdadera situación de la empresa."
  citation: "art. 184.3.a LGT"
  difficulty: 3
  tags:
  - "anomalías sustanciales"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0040
  prompt:
    es: "De acuerdo con el artículo 184.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, la llevanza incorrecta de los libros de contabilidad o de los libros o registros mediante la falsedad de asientos es una anomalía sustancial siempre que su incidencia represente un porcentaje:"
  options:
  - id: a
    text:
      es: "Igual o superior al 20 por ciento del importe de la base de la sanción."
  - id: b
    text:
      es: "Superior al 10 por ciento del importe de la base de la sanción."
  - id: c
    text:
      es: "Superior al 75 por ciento del importe de la base de la sanción."
  - id: d
    correct: true
    text:
      es: "Superior al 50 por ciento del importe de la base de la sanción."
  explanation:
    es: "Para el artículo 184.3.a.3.º LGT, la llevanza incorrecta de libros es anomalía sustancial si su incidencia supera el 50 por ciento de la base de la sanción. El 10 por ciento es el umbral de la ocultación y de la letra b del mismo apartado. El 20 por ciento es el de la facturación y el 75 es un tramo del perjuicio económico."
  citation: "art. 184.3.a LGT"
  difficulty: 2
  tags:
  - "porcentaje"
  - "anomalías sustanciales"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0041
  prompt:
    es: "De acuerdo con el artículo 184 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ocultación de datos y los medios fraudulentos que define son circunstancias que determinan:"
  options:
  - id: a
    correct: true
    text:
      es: "La calificación de la infracción como grave o muy grave, según el caso."
  - id: b
    text:
      es: "La graduación de la sanción mediante incrementos sobre el porcentaje mínimo."
  - id: c
    text:
      es: "La imposición de sanciones accesorias en toda infracción grave o muy grave."
  - id: d
    text:
      es: "La reducción de la sanción cuando el obligado presta su conformidad."
  explanation:
    es: "La ocultación y los medios fraudulentos del artículo 184 LGT sirven para calificar la infracción como grave (ocultación) o muy grave (medios fraudulentos), en los artículos 191 a 193. La graduación depende de los criterios del artículo 187, la reducción del artículo 188 y las sanciones accesorias del artículo 186."
  citation: "art. 184 LGT"
  difficulty: 2
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-184
- id: m03-l13-q0227
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a una anomalía sustancial en la contabilidad según el artículo 184.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La llevanza de contabilidades distintas que, referidas a una misma actividad y ejercicio económico, no permitan conocer la verdadera situación de la empresa."
  - id: b
    text:
      es: "La llevanza de contabilidades distintas que, referidas a una misma actividad y ejercicio, estén legalizadas en el Registro Mercantil."
  - id: c
    text:
      es: "La llevanza de contabilidades distintas que, referidas a actividades distintas, no permitan conocer la verdadera situación de la empresa."
  - id: d
    text:
      es: "La llevanza de una contabilidad única que, referida a varios ejercicios económicos, permita conocer la situación de la empresa."
  explanation:
    es: "El artículo 184.3.a.2.º LGT exige contabilidades distintas referidas a una misma actividad y ejercicio económico y que no permitan conocer la verdadera situación de la empresa. Las otras tres versiones cambian la actividad, el número de contabilidades o convierten la legalización en el criterio, y no son la descripción del artículo."
  citation: "art. 184.3.a LGT"
  difficulty: 3
  tags:
  - "anomalías sustanciales"
# anchor: boe-a-2003-23186-art-183
- id: m03-l13-q0239
  prompt:
    es: "¿Con qué grado de negligencia han de realizarse las acciones u omisiones culposas para constituir infracciones tributarias, de acuerdo con el artículo 183.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Con negligencia simple, pero no con negligencia leve o levísima."
  - id: b
    correct: true
    text:
      es: "Con cualquier grado de negligencia."
  - id: c
    text:
      es: "Con la negligencia que determine el órgano sancionador en cada caso."
  - id: d
    text:
      es: "Solo con negligencia grave, que la distingue de la mera imprudencia."
  explanation:
    es: "El artículo 183.1 LGT exige acciones u omisiones dolosas o culposas con cualquier grado de negligencia. No se limita a la negligencia grave ni a la simple, y no es el órgano sancionador quien fija el grado."
  citation: "art. 183.1 LGT"
  difficulty: 1
  tags:
  - "concepto"
