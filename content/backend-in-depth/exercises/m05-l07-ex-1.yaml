- id: m05-l07-q11
  prompt:
    en: A Spring Data JPA repository method runs in a transaction configured as `readOnly`, and the JPA provider
      is Hibernate. Which Hibernate flush mode does Spring set for that transaction?
  options:
  - id: a
    correct: true
    text:
      en: '`MANUAL`'
  - id: b
    text:
      en: '`AUTO`'
  - id: c
    text:
      en: '`COMMIT`'
  - id: d
    text:
      en: '`ALWAYS`'
  explanation:
    en: With Hibernate, the flush mode is set to `MANUAL` when a transaction is configured as `readOnly`, which
      makes Hibernate skip dirty checks. `AUTO` is not set, because the documentation gives `MANUAL`, and `AUTO`
      is the Hibernate default. `COMMIT` is not set, because the same sentence gives `MANUAL` for a `readOnly` transaction.
      `ALWAYS` is not set, because the same sentence gives `MANUAL`, and `ALWAYS` would flush before every query,
      which skipping dirty checks does not do.
  citation: spring-data-jpa-transactions#transactional-query-methods
  extract:
    en: when used with Hibernate, the flush mode is set to MANUAL when you configure a transaction as readOnly,
      which causes Hibernate to skip dirty checks
- id: m05-l07-q15
  prompt:
    en: The Jakarta Persistence specification says what a provider does when an entity's version in the persistence
      context differs from the version in the database at write time. Which exception must it throw?
  options:
  - id: a
    text:
      en: '`PessimisticLockException`'
  - id: b
    text:
      en: '`EntityExistsException`'
  - id: c
    correct: true
    text:
      en: '`OptimisticLockException`'
  - id: d
    text:
      en: '`TransactionRequiredException`'
  explanation:
    en: If the versions do not match, the persistence provider must throw an `OptimisticLockException`. `PessimisticLockException`
      is not required, because the specification names `OptimisticLockException` for a version mismatch. `EntityExistsException`
      is not required, because the same sentence names `OptimisticLockException`. `TransactionRequiredException`
      is not required, because the same sentence names `OptimisticLockException`.
  citation: jakarta-persistence-spec#a2059
  extract:
    en: If the versions do not match, the persistence provider must thow an OptimisticLockException.
- id: m05-l07-q16
  prompt:
    en: In Hibernate, a bulk HQL `UPDATE` statement runs against a versioned entity, and the `VERSIONED` keyword
      is not used. What happens to the version value of the affected entities?
  options:
  - id: a
    text:
      en: It is incremented by one
  - id: b
    correct: true
    text:
      en: It is not changed
  - id: c
    text:
      en: It is reset to its initial value
  - id: d
    text:
      en: It is set to the current time
  explanation:
    en: By default, HQL `UPDATE` statements do not affect the version or timestamp property values of the affected
      entities. Incrementing by one is not the default, because the documentation says the default leaves the values
      alone. Resetting to the initial value is not the default, because that effect needs the `VERSIONED` keyword.
      Setting to the current time is not the default, because the default does not affect timestamp values either.
  citation: hibernate-user-guide#batch-bulk-hql-update-delete
