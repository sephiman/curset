m05-l01-q02:
  key:
    anchor: spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
    sentence: the Spring IoC container detects this circular reference at runtime, and throws a BeanCurrentlyInCreationException.
  wrong:
