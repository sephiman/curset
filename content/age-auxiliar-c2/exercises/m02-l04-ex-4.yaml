  - id: c
    text:
      es: "Los colegios profesionales y sus consejos generales de ámbito estatal o autonómico."
  - id: d
    text:
      es: "Las fundaciones privadas que reciban subvenciones de las Administraciones Públicas estatales."
  explanation:
    es: "El último sujeto de la lista son las asociaciones constituidas por las Administraciones y entidades del sector público. Las fundaciones privadas subvencionadas, los partidos y sindicatos y los colegios profesionales no figuran en ella."
