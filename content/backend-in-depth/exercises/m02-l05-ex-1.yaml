- id: m02-l05-q15
  prompt:
    en: In Java 25, for which int arguments do `Math.floorMod(x, y)` and the remainder `x % y` give different results?
  options:
  - id: a
    correct: true
    text:
      en: Only when neither result is zero and the signs of x and y differ
  - id: b
    text:
      en: Whenever x is negative, whatever the sign of y
  - id: c
    text:
      en: Whenever `x % y` is zero, because `floorMod` then returns y
  - id: d
    text:
      en: Whenever both x and y are positive
  explanation:
    en: The two results differ exactly when neither is zero and the signs of the arguments differ. A negative x
      with a negative y is wrong because `floorMod(-4, -3)` and `-4 % -3` are both -1. A zero remainder is wrong
      because `floorMod(x, y)` is zero exactly when `x % y` is zero. Two positive arguments are wrong because `floorMod(+4,
      +3)` and `+4 % +3` are both +1.
  citation: javadoc-math#floorMod(int,int)
