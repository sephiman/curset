# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q252
  prompt:
    es: "En el procedimiento administrativo común, ¿cuál de las siguientes circunstancias permite interponer el recurso extraordinario de revisión?"
  options:
  - id: a
    text:
      es: "Que la resolución se dictara por un órgano manifiestamente incompetente por razón de la materia o del territorio."
  - id: b
    text:
      es: "Que se haya denunciado un posible cohecho ante el juzgado, aunque aún no haya sentencia."
  - id: c
    correct: true
    text:
      es: "Que la resolución se dictara como consecuencia de cohecho declarado así por sentencia judicial firme."
  - id: d
    text:
      es: "Que la resolución incurra en desviación de poder, apreciada por el propio órgano que la dictó."
  explanation:
    es: "El artículo 125.1.d) de la Ley 39/2015 admite el recurso cuando la resolución se dictó «como consecuencia de prevaricación, cohecho, violencia, maquinación fraudulenta u otra conducta punible» y así se haya declarado «en virtud de sentencia judicial firme». Una denuncia sin sentencia no basta. La incompetencia manifiesta es una causa de nulidad (art. 47.1) y la desviación de poder, de anulabilidad (art. 48.1): se hacen valer por la revisión de oficio o por los recursos ordinarios, no por esta vía."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q253
  prompt:
    es: "Según el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión fundado en un error de hecho que resulte de los documentos del expediente se interpone:"
  options:
  - id: a
    text:
      es: "Dentro de los tres meses siguientes a la fecha de la notificación de la resolución impugnada."
  - id: b
    text:
      es: "Dentro de los cuatro años siguientes a aquel en que el interesado conoció el error."
  - id: c
    text:
      es: "En cualquier momento, sin sujeción a plazo, mientras el acto siga produciendo efectos."
  - id: d
    correct: true
    text:
      es: "Dentro de los cuatro años siguientes a la fecha de la notificación de la resolución impugnada."
  explanation:
    es: "Para la causa a), el artículo 125.2 fija «el plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada». Los tres meses son el plazo de las demás causas, y se cuentan desde el conocimiento de los documentos o desde la firmeza de la sentencia, no desde la notificación. Los cuatro años no se cuentan desde que se conoció el error. El recurso tiene plazo, de modo que no cabe en cualquier momento."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q254
  prompt:
    es: "Una resolución firme en vía administrativa se notificó el jueves, 16 de febrero de 2023, con un error de hecho que resulta de los documentos del expediente. ¿Hasta qué día cabe interponer recurso extraordinario de revisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el martes, 16 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el martes, 16 de mayo de 2023."
  - id: c
    text:
      es: "Hasta el viernes, 16 de febrero de 2024."
  - id: d
    text:
      es: "Hasta el lunes, 16 de febrero de 2026."
  explanation:
    es: "En la causa a) el plazo es de cuatro años desde la notificación (art. 125.2 de la Ley 39/2015). Contado de fecha a fecha (art. 30.4), concluye el martes 16 de febrero de 2027, día hábil. El 16 de mayo de 2023 aplica tres meses, el plazo de las demás causas. El 16 de febrero de 2024 aplica un año y el de 2026, tres años; ninguno es el plazo legal."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q255
  prompt:
    es: "El martes, 18 de noviembre de 2025, un interesado conoce documentos de valor esencial, posteriores a una resolución firme, que evidencian su error. ¿Hasta qué día puede interponer recurso extraordinario de revisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el miércoles, 18 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el jueves, 18 de diciembre de 2025."
  - id: c
    text:
      es: "Hasta el lunes, 19 de enero de 2026."
  - id: d
    text:
      es: "Hasta el lunes, 18 de mayo de 2026."
  explanation:
    es: "En la causa b) el plazo es de «tres meses a contar desde el conocimiento de los documentos» (art. 125.2 de la Ley 39/2015). Empieza el miércoles 19 de noviembre y concluye el mismo día del tercer mes: el miércoles 18 de febrero de 2026, día hábil (art. 30.4). En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 18 de diciembre aplica un mes; el 19 de enero, dos meses (el 18 es domingo); el 18 de mayo, seis meses."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q256
  prompt:
    es: "Según el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el martes, 16 de septiembre de 2025, queda firme la sentencia que declara falsos documentos decisivos de una resolución firme, ¿hasta qué día cabe el recurso extraordinario de revisión?"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 16 de octubre de 2025."
  - id: b
    text:
      es: "Hasta el lunes, 17 de noviembre de 2025."
  - id: c
    text:
      es: "Hasta el lunes, 16 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "Hasta el martes, 16 de diciembre de 2025."
  explanation:
    es: "En la causa c) el plazo es de tres meses «desde que la sentencia judicial quedó firme» (art. 125.2). Empieza el miércoles 17 de septiembre y concluye el martes 16 de diciembre de 2025, día hábil (art. 30.4). En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 16 de octubre aplica un mes; el 17 de noviembre, dos meses (el 16 es domingo); el 16 de marzo de 2026, seis meses."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-126
- id: m03-l03-q257
  prompt:
    es: "Según el artículo 126.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un recurso extraordinario de revisión se interpone el lunes, 2 de marzo de 2026, y no se resuelve, ¿qué puede entender el recurrente?"
  options:
  - id: a
    text:
      es: "Que está estimado, una vez vencido el martes, 2 de junio de 2026."
  - id: b
    text:
      es: "Que el procedimiento ha caducado, una vez vencido el martes, 2 de junio de 2026."
  - id: c
    correct: true
    text:
      es: "Que está desestimado, una vez vencido el martes, 2 de junio de 2026."
  - id: d
    text:
      es: "Que está desestimado, una vez vencido el miércoles, 2 de septiembre de 2026."
  explanation:
    es: "El artículo 126.3 dice que, pasados «tres meses desde la interposición del recurso extraordinario de revisión sin haberse dictado y notificado la resolución, se entenderá desestimado». Desde el lunes 2 de marzo de 2026, los tres meses vencen el martes 2 de junio de 2026, día hábil. El silencio es desestimatorio, no estimatorio, y no produce caducidad. El 2 de septiembre aplica seis meses."
  citation: "art. 126.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "cómputo"
  - "fecha"
# anchor: boe-a-2025-76-da-primera
- id: m03-l03-q258
  prompt:
    es: "Según la disposición adicional primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, implantados los Tribunales de Instancia, los Juzgados de lo Contencioso-administrativo se entienden referidos a:"
  options:
  - id: a
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: b
    text:
      es: "Las Secciones de lo Contencioso-administrativo del Tribunal Central de Instancia."
  - id: c
    text:
      es: "Las Salas de lo Contencioso-administrativo de las Audiencias Provinciales."
  - id: d
    correct: true
    text:
      es: "Las Secciones de lo Contencioso-administrativo de los Tribunales de Instancia."
  explanation:
    es: "La disposición adicional primera dice que las referencias a los Juzgados «de lo Contencioso-Administrativo» se entienden referidas «a las Secciones del orden jurisdiccional correspondiente de los Tribunales de Instancia». Las Salas de los Tribunales Superiores de Justicia siguen siendo órganos distintos. Las Secciones del Tribunal Central de Instancia sustituyen a los Juzgados Centrales, no a los Juzgados. Las Audiencias Provinciales no tienen Salas de lo contencioso-administrativo."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2025-76-da-primera
- id: m03-l03-q259
  prompt:
    es: "Implantados los Tribunales de Instancia, ¿a qué órgano se entienden hechas las referencias a los Juzgados Centrales de lo Contencioso-administrativo, según la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia?"
  options:
  - id: a
    text:
      es: "A la Sala de lo Contencioso-administrativo de la Audiencia Nacional."
  - id: b
    correct: true
    text:
      es: "A las Secciones correspondientes del Tribunal Central de Instancia."
  - id: c
    text:
      es: "A las Secciones de los Tribunales de Instancia de Madrid."
  - id: d
    text:
      es: "A la Sala de lo Contencioso-administrativo del Tribunal Supremo."
  explanation:
    es: "La disposición adicional primera de la Ley Orgánica 1/2025 dice que «la misma consideración tendrán las referencias a los Juzgados Centrales respecto de las correspondientes Secciones del Tribunal Central de Instancia». La Sala de la Audiencia Nacional y la del Tribunal Supremo son órganos colegiados distintos que la ley no toca. Las Secciones de los Tribunales de Instancia de Madrid sustituyen a los Juzgados de Madrid, no a los Centrales."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-46
- id: m03-l03-q260
  prompt:
    es: "Según el artículo 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cuál es el plazo para interponer el recurso contencioso-administrativo contra un acto expreso y contra uno presunto?"
  options:
  - id: a
    text:
      es: "Dos meses contra el acto expreso y tres meses contra el acto presunto."
  - id: b
    text:
      es: "Un mes contra el acto expreso y seis meses contra el acto presunto."
  - id: c
    text:
      es: "Dos meses en ambos casos, contados desde el día siguiente al de la notificación."
  - id: d
    correct: true
    text:
      es: "Dos meses contra el acto expreso y seis meses contra el acto presunto."
  explanation:
    es: "El artículo 46.1 fija «dos meses» contra la disposición o el acto expreso y, si el acto no es expreso, «el plazo será de seis meses». Tres meses no es el plazo del acto presunto. Un mes es el plazo de la alzada y de la reposición, no del contencioso. El acto presunto no se notifica, y su plazo se cuenta desde el día siguiente a aquel en que se produce."
  citation: "art. 46.1 LJCA"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1998-16718-art-46
- id: m03-l03-q261
  prompt:
    es: "Según el artículo 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, si una Orden ministerial que pone fin a la vía administrativa se notifica el martes, 13 de enero de 2026, ¿cuál es el último día para interponer recurso contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "El viernes, 13 de febrero de 2026."
  - id: b
    text:
      es: "El lunes, 13 de abril de 2026."
  - id: c
    correct: true
    text:
      es: "El viernes, 13 de marzo de 2026."
  - id: d
    text:
      es: "El lunes, 13 de julio de 2026."
  explanation:
    es: "El plazo es de dos meses «contados desde el día siguiente al [...] de la notificación» (art. 46.1). Empieza el miércoles 14 de enero y, contado de fecha a fecha, concluye el viernes 13 de marzo de 2026, día hábil. El periodo no incluye agosto, que en el contencioso es inhábil (art. 128.2 LJCA). El 13 de febrero aplica un mes, el plazo de la reposición. El 13 de abril aplica tres meses y el 13 de julio seis, que es el plazo contra el acto presunto."
  citation: "art. 46.1 LJCA"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-1998-16718-art-46
- id: m03-l03-q263
  prompt:
    es: "Una disposición administrativa de carácter general se publica en el «Boletín Oficial del Estado» el jueves, 15 de octubre de 2026. ¿Hasta qué día puede impugnarse directamente ante el orden contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 16 de noviembre de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el martes, 15 de diciembre de 2026."
  - id: c
    text:
      es: "Hasta el miércoles, 16 de diciembre de 2026."
  - id: d
    text:
      es: "Hasta el jueves, 15 de abril de 2027."
  explanation:
    es: "El plazo es de dos meses «contados desde el día siguiente al de la publicación de la disposición impugnada» (art. 46.1 de la Ley 29/1998). Empieza el viernes 16 de octubre y, contado de fecha a fecha, concluye el martes 15 de diciembre de 2026, día hábil. El periodo no incluye agosto, que en el contencioso es inhábil (art. 128.2 LJCA). El 16 de diciembre añade un día al cómputo. El 16 de noviembre aplica un mes (el 15 es domingo) y el 15 de abril de 2027, seis meses."
  citation: "art. 46.1 LJCA"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-124
- id: m03-l03-q264
  prompt:
    es: "La resolución de un Ministro, que pone fin a la vía administrativa, se publica en el «Boletín Oficial del Estado» el martes, 20 de enero de 2026. ¿Hasta qué día cabe reposición y hasta cuál, sin ella, recurso contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Reposición hasta el viernes 20 de febrero y contencioso hasta el lunes 20 de abril de 2026."
  - id: b
    text:
      es: "Reposición hasta el viernes 20 de marzo y contencioso hasta el lunes 20 de julio de 2026."
  - id: c
    text:
      es: "Reposición hasta el viernes 20 de marzo y contencioso también hasta el viernes 20 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "Reposición hasta el viernes 20 de febrero y contencioso hasta el viernes 20 de marzo de 2026."
  explanation:
    es: "Contra un acto que agota la vía caben reposición potestativa o contencioso directo (art. 123.1 de la Ley 39/2015). La reposición se interpone en un mes (art. 124.1): desde el miércoles 21 de enero, concluye el viernes 20 de febrero de 2026. El contencioso se interpone en dos meses (art. 46.1 de la Ley 29/1998): concluye el viernes 20 de marzo de 2026. Los dos días son hábiles y el periodo no incluye agosto, inhábil en el contencioso (art. 128.2 LJCA). Las demás opciones dan a la reposición dos meses o al contencioso tres o seis meses."
  citation: "art. 124.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
