type: quiz
variants:
- id: m08-l05-q01
  prompt:
    en: In the Raft consensus algorithm, how does each server choose its election timeout so that split votes stay
      rare and are resolved quickly when they do happen?
  options:
  - id: a
    correct: true
    text:
      en: Randomly, from a fixed interval such as 150 to 300 ms
  - id: b
    text:
      en: As a fixed value derived from the server's unique rank in the cluster
  - id: c
    text:
      en: As one identical value on every server, so that all of them time out together
  - id: d
    text:
      en: As a value doubled after every failed election until a leader emerges
  explanation:
    en: Raft chooses election timeouts randomly from a fixed interval such as 150 to 300 ms. A timeout derived from
      a unique server rank is wrong, because the authors dropped the ranking system and concluded that the randomized
      retry approach is more obvious and understandable. One identical value on every server is wrong, because randomness
      spreads the servers out so that in most cases only a single server times out. Doubling after each failed election
      is wrong, because each candidate restarts its randomized election timeout at the start of an election.
  citation: paper-raft-dissertation#p35
  extract:
    en: election timeouts are chosen randomly from a fixed interval (e.g., 150–300 ms).
- id: m08-l05-q02
  prompt:
    en: According to the Kafka documentation on `KRaft`, for the controller cluster to withstand N concurrent failures
      without losing availability, how many controllers must the cluster include?
  options:
  - id: a
    text:
      en: '`N + 1` controllers'
  - id: b
    text:
      en: '`2N` controllers'
  - id: c
    text:
      en: '`3N` controllers'
  - id: d
    correct: true
    text:
      en: '`2N + 1` controllers'
  explanation:
    en: The controller cluster must include `2N + 1` controllers to withstand N concurrent failures. `N + 1` controllers
      and `2N` controllers are both excluded, because the documentation fixes the count at `2N + 1`. `3N` controllers
      is wrong, because the documentation says 5 controllers already tolerate 2 controller failures, where `3N`
      would ask for 6.
  citation: kafka-operations-kraft#deploying-considerations
  extract:
    en: For the KRaft controller cluster to withstand N concurrent failures the controller cluster must include
      2N + 1 controllers.
- id: m08-l05-q03
  prompt:
    en: A 3-member etcd cluster has one unhealthy member. According to the etcd FAQ, what happens if the operator
      adds a replacement member before removing the unhealthy one?
  options:
  - id: a
    correct: true
    text:
      en: The quorum rises to 3, so the extra member adds no fault tolerance
  - id: b
    text:
      en: The quorum stays at 2, because the unhealthy member no longer counts as a member
  - id: c
    text:
      en: The cluster can now tolerate two failures instead of one
  - id: d
    text:
      en: A misconfigured new member can always be removed again by the remaining live members
  explanation:
    en: Adding a member to a 3-member cluster raises the quorum to 3 because 3 votes are required for a majority
      of 4 members. A quorum that stays at 2 is wrong, because the quorum model needs (n/2)+1 members, a majority
      of all members, to agree. Tolerating two failures is wrong, because the quorum rose and the cluster stays
      one node failure away from being unrecoverable. Removing a misconfigured member again is wrong, because with
      two members down and two up the cluster has no way to recover quorum to undo the addition.
  citation: etcd-faq#should-i-add-a-member-before-removing-an-unhealthy-member
  extract:
    en: However, adding a new member to a 3-member cluster will increase the quorum to 3 because 3 votes are required
      for a majority of 4 members.
- id: m08-l05-q04
  prompt:
    en: A Redis deployment runs just two Sentinels, one on the master's box and one on the replica's box. Which
      statement about this setup is correct?
  options:
  - id: a
    text:
      en: The remaining Sentinel can authorize the failover alone, because a majority is not needed to order failovers
  - id: b
    text:
      en: Letting the replica's Sentinel fail over without agreement is safe, because it leaves a single master
  - id: c
    correct: true
    text:
      en: If the master's box stops working, the remaining Sentinel cannot authorize a failover
  - id: d
    text:
      en: After a partition heals, Sentinel can tell which side holds the right configuration
  explanation:
    en: With two Sentinels, losing the master's box also stops one Sentinel, and the other cannot authorize a failover.
      Failing over without a majority is wrong, because a majority is needed to order different failovers and propagate
      the latest configuration. Failing over without agreement being safe is wrong, because it would create two
      masters in a perfectly symmetrical way. A healed partition being resolvable is wrong, because clients may
      write to both sides and there is no way to tell which configuration is the right one, which leaves a permanent
      split brain.
  citation: redis-sentinel#example-1-just-two-sentinels-dont-do-this
  extract:
    en: The Sentinel running in the other box S2 will not be able to authorize a failover, so the system will become
      not available.
- id: m08-l05-q05
  prompt:
    en: In etcd, a network partition divides the cluster into a side holding a member majority and a side holding
      a member minority. Which statement about availability is correct?
  options:
  - id: a
    text:
      en: Both sides stay available and reconcile their writes after the partition clears
  - id: b
    text:
      en: The side that holds the leader stays available, whatever its size
  - id: c
    correct: true
    text:
      en: The majority side becomes the available cluster and the minority side is unavailable
  - id: d
    text:
      en: Neither side stays available, because a partition fails the whole cluster
  explanation:
    en: The majority side becomes the available cluster and the minority side is unavailable. Both sides staying
      available is wrong, because etcd has no split-brain, as every membership change is approved by the current
      majority. Availability following the leader is wrong, because a leader on the minority side steps down and
      the majority side elects a new leader. A whole-cluster failure is wrong, because once a majority of members
      works, etcd elects a new leader automatically and returns to a healthy state.
  citation: etcd-failures#network-partition
  extract:
    en: The majority side becomes the available cluster and the minority side is unavailable.
- id: m08-l05-q07
  prompt:
    en: When a Raft server writes a snapshot for log compaction, which two values does it store to position the
      snapshot in the log?
  options:
  - id: a
    text:
      en: The index and term of the first entry that follows the snapshot
  - id: b
    correct: true
    text:
      en: The index and term of the last entry included in the snapshot
  - id: c
    text:
      en: The highest index the leader has committed and the leader's current term
  - id: d
    text:
      en: The index and term of the oldest entry the server still keeps in its log
  explanation:
    en: Raft stores the index and term of the last entry included in the snapshot. The first entry after the snapshot
      is wrong, because the saved index and term position the snapshot in the log preceding that entry. The leader's
      highest committed index is wrong, because each server takes snapshots independently, covering just the committed
      entries in its own log. The oldest entry still kept is wrong, because Raft discards the log prefix up through
      the last included index.
  citation: paper-raft-dissertation#p69
  extract:
    en: the index and term of the last entry included in the snapshot and the latest configuration as of that index.
- id: m08-l05-q08
  prompt:
    en: In the ZooKeeper two-phase commit recipe where every site watches the transaction nodes, what is the message
      complexity in the number of sites n?
  options:
  - id: a
    text:
      en: '`O(n)`'
  - id: b
    correct: true
    text:
      en: '`O(n²)`'
  - id: c
    text:
      en: '`O(log n)`'
  - id: d
    text:
      en: '`O(1)`'
  explanation:
    en: The message complexity of this recipe is `O(n²)`. `O(n)`, `O(log n)` and `O(1)` are all excluded, because
      the documentation states `O(n²)` as the message complexity of the approach.
  citation: zk-recipes#sc_recipes_twoPhasedCommit
- id: m08-l05-q09
  prompt:
    en: In etcd, the leader fails and the cluster starts electing a new one. According to the etcd documentation,
      which statement about that period is correct?
  options:
  - id: a
    text:
      en: The election happens instantly once the leader fails
  - id: b
    text:
      en: The cluster keeps processing writes through the election
  - id: c
    text:
      en: Writes that the old leader had already committed can be lost
  - id: d
    correct: true
    text:
      en: Electing a new leader takes about an election timeout, because failure detection is timeout based
  explanation:
    en: Electing a new leader takes about an election timeout, since the failure detection model is timeout based.
      An instant election is wrong, because the election does not happen instantly once the leader fails. Writes
      continuing through the election is wrong, because during the leader election the cluster cannot process any
      writes. Losing committed writes is wrong, because no committed writes are ever lost.
  citation: etcd-failures#leader-failure
  extract:
    en: It takes about an election timeout to elect a new leader since the failure detection model is timeout based.
- id: m08-l05-q10
  prompt:
    en: How does the Raft dissertation make an arbitrary change of the cluster configuration safe, given that servers
      cannot all switch to the new configuration at the same instant?
  options:
  - id: a
    correct: true
    text:
      en: The cluster first moves to a transitional joint consensus configuration and then to the new one
  - id: b
    text:
      en: All servers switch directly to the new configuration in one step
  - id: c
    text:
      en: Each server adopts the new configuration only once that configuration entry is committed
  - id: d
    text:
      en: Only servers of the old configuration may lead during the change, so the new servers never take part in
        elections
  explanation:
    en: Raft first switches to a transitional joint consensus configuration and, once that is committed, to the
      new configuration. A direct switch is wrong, because switching directly can be unsafe when different servers
      switch at different times. Adopting the new configuration only once committed is wrong, because each server
      starts using a new configuration as soon as it stores it in its log. Leadership limited to the old configuration
      is wrong, because under joint consensus any server from either configuration may serve as leader.
  citation: paper-raft-dissertation#p62
  extract:
    en: To ensure safety across arbitrary configuration changes, the cluster first switches to a transitional configuration
      we call joint consensus; once the joint consensus has been committed, the system then transitions to the new
      configuration.
