- id: g-translog
  term: {en: translog}
  definition: {en: "The transaction log in which each Elasticsearch shard copy writes index and delete operations, so that operations not yet included in the last Lucene commit can be recovered."}
  origin: m09-l05
  citation: "es-translog#elastic-docs-v3"
- id: g-append-only-file
  term: {en: append-only file}
  definition: {en: "An alternative, fully-durable persistence strategy for Redis, to which every command that changes the dataset is appended."}
