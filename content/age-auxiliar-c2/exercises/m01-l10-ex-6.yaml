# anchor: celex-12016e-txt-art-253
- id: m01-l10-q118
  prompt:
    es: "Según el artículo 253 del Tratado de Funcionamiento de la Unión Europea, los jueces y los abogados generales salientes del Tribunal de Justicia podrán ser:"
  options:
  - id: a
    text:
      es: "Designados de nuevo solo una vez."
  - id: b
    correct: true
    text:
      es: "Nuevamente designados."
  - id: c
    text:
      es: "Designados de nuevo solo tras un período de seis años."
  - id: d
    text:
      es: "Excluidos de toda nueva designación."
  explanation:
    es: "Los salientes pueden ser nuevamente designados, sin límite de veces ni plazo de espera. La opción de una sola vez, la de esperar seis años y la de exclusión añaden restricciones que el artículo no establece."
  citation: "art. 253 TFUE"
  difficulty: 3
  tags:
  - "plazo"
# anchor: celex-12016e-txt-art-253
- id: m01-l10-q119
  prompt:
    es: "Según el Tratado de Funcionamiento de la Unión Europea, ¿quién elige al Presidente del Tribunal de Justicia de la Unión Europea por un período de tres años, renovable?"
  options:
  - id: a
    correct: true
    text:
      es: "Los jueces, de entre ellos."
  - id: b
    text:
      es: "Los Gobiernos de los Estados miembros, de común acuerdo."
  - id: c
    text:
      es: "El Consejo Europeo, por mayoría cualificada."
  - id: d
    text:
      es: "El Parlamento Europeo, por mayoría de los votos emitidos."
  explanation:
    es: "Los jueces eligen de entre ellos al Presidente, por tres años renovables. Los Gobiernos de los Estados miembros designan a los jueces, pero no eligen al Presidente. El Consejo Europeo y el Parlamento tampoco intervienen."
