# anchor: boe-a-1997-25336-art-6
- id: m01-l03-q0017
  prompt:
    es: "De acuerdo con el artículo 6.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la creación, modificación y supresión de las Comisiones Delegadas del Gobierno será acordada:"
  options:
  - id: a
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Por el Consejo de Ministros mediante Acuerdo, a propuesta del Ministro de la Presidencia."
  - id: c
    correct: true
    text:
      es: "Por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "Por el Presidente del Gobierno mediante Real Decreto, a propuesta del Ministro de la Presidencia."
  explanation:
    es: "El artículo 6.1 dice que la creación, modificación y supresión «será acordada por el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente del Gobierno». No la acuerda el Presidente, sino el Consejo. La forma es el Real Decreto, no el Acuerdo. La propuesta es del Presidente, no del Ministro de la Presidencia."
  citation: "art. 6.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-6
- id: m01-l03-q0066
  prompt:
    es: "¿Cuál de los siguientes cargos puede integrar, junto con miembros del Gobierno, las Comisiones Delegadas del Gobierno, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Delegados del Gobierno en las Comunidades Autónomas."
  - id: b
    text:
      es: "Presidentes de las Comunidades Autónomas."
  - id: c
    text:
      es: "Consejeros del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Secretarios de Estado."
  explanation:
    es: "El artículo 6.2.b menciona a los miembros del Gobierno y, en su caso, a los Secretarios de Estado. Los Delegados del Gobierno, los Presidentes autonómicos y los Consejeros de Estado no forman parte de las Comisiones Delegadas."
  citation: "art. 6.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-6
- id: m01-l03-q0069
  prompt:
    es: "Según el artículo 6.5 de la Ley 50/1997, de 27 de noviembre, del Gobierno, las deliberaciones de las Comisiones Delegadas del Gobierno serán:"
  options:
  - id: a
    text:
      es: "Públicas."
  - id: b
    text:
      es: "Públicas, salvo que el Presidente del Gobierno disponga otra cosa."
  - id: c
    text:
      es: "Secretas, salvo que el Presidente del Gobierno disponga otra cosa."
  - id: d
    correct: true
    text:
      es: "Secretas."
  explanation:
    es: "El artículo 6.5 dice que las deliberaciones de las Comisiones Delegadas son secretas. La opción de deliberaciones públicas lo contradice. Las dos opciones que dejan la decisión al Presidente del Gobierno añaden una excepción que el artículo no recoge: una abre al público lo que es secreto y la otra permite levantar un secreto que el artículo fija sin salvedad."
  citation: "art. 6.5 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-21
- id: m01-l03-q0028
  prompt:
    es: "De acuerdo con el artículo 21.3 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno en funciones limitará su gestión:"
  options:
  - id: a
    text:
      es: "A la aprobación de Reales Decretos-leyes, absteniéndose de adoptar cualesquiera otras medidas sin autorización del Congreso."
  - id: b
    correct: true
    text:
      es: "Al despacho ordinario de los asuntos públicos, absteniéndose de adoptar otras medidas salvo urgencia debidamente acreditada o razones de interés general."
  - id: c
    text:
      es: "Al despacho ordinario de los asuntos públicos, sin excepción alguna aunque concurran razones de urgencia."
  - id: d
    text:
      es: "A los asuntos que le autorice expresamente la Diputación Permanente del Congreso de los Diputados."
  explanation:
    es: "El artículo 21.3 dice que el Gobierno en funciones limitará su gestión «al despacho ordinario de los asuntos públicos», absteniéndose de adoptar otras medidas «salvo casos de urgencia debidamente acreditados o por razones de interés general cuya acreditación expresa así lo justifique». La ley no reduce su gestión a los Reales Decretos-leyes. Sí admite excepciones por urgencia o interés general. No depende de autorizaciones de la Diputación Permanente."
  citation: "art. 21.3 Ley 50/1997"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1997-25336-art-21
- id: m01-l03-q0029
  prompt:
    es: "Según el artículo 21.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué facultad tiene vedada el Presidente del Gobierno en funciones?"
  options:
  - id: a
    text:
      es: "Convocar y presidir las reuniones del Consejo de Ministros."
  - id: b
    text:
      es: "Impartir instrucciones a los demás miembros del Gobierno."
  - id: c
    text:
      es: "Representar al Gobierno en el ejercicio de sus funciones."
  - id: d
    correct: true
    text:
      es: "Plantear la cuestión de confianza ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 21.4 dice que el Presidente del Gobierno en funciones no podrá proponer la disolución de las Cámaras, «plantear la cuestión de confianza» ni proponer un referéndum consultivo. Convocar y presidir el Consejo, impartir instrucciones y representar al Gobierno son funciones del artículo 2.2 que el artículo 21.4 no le retira."
  citation: "art. 21.4 Ley 50/1997"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-101
- id: m01-l03-q0079
  prompt:
    es: "Conforme al artículo 101.1 de la Constitución Española de 1978, además de tras elecciones generales y de la pérdida de la confianza parlamentaria, el Gobierno cesa por:"
  options:
  - id: a
    text:
      es: "Dimisión o fallecimiento de cualquiera de sus Ministros."
  - id: b
    correct: true
    text:
      es: "Dimisión o fallecimiento de su Presidente."
  - id: c
    text:
      es: "Pérdida de la mayoría en el Senado."
  - id: d
    text:
      es: "Disolución de las Cortes Generales por el Rey."
  explanation:
    es: "El artículo 101.1 incluye la dimisión o el fallecimiento del Presidente. La salida de un Ministro no hace cesar a todo el Gobierno. El Gobierno responde ante el Congreso, no ante el Senado. La disolución de las Cortes no lo hace cesar, porque cesa tras las elecciones generales."
  citation: "art. 101.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-21
- id: m01-l03-q0080
  prompt:
    es: "Conforme al artículo 21.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno cesa, entre otros casos, en los de pérdida de la confianza parlamentaria previstos en:"
  options:
  - id: a
    text:
      es: "La propia Ley del Gobierno."
  - id: b
    text:
      es: "El Reglamento del Congreso de los Diputados."
  - id: c
    text:
      es: "Una ley orgánica específica."
  - id: d
    correct: true
    text:
      es: "La Constitución."
  explanation:
    es: "El artículo 21.1 remite a los casos que prevé la Constitución, que son la cuestión de confianza y la moción de censura. La Ley del Gobierno, el Reglamento del Congreso y una ley orgánica no son la fuente que cita el artículo."
  citation: "art. 21.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-21
- id: m01-l03-q0085
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, las delegaciones legislativas otorgadas por las Cortes Generales quedan en suspenso mientras el Gobierno esté en funciones como consecuencia de:"
  options:
  - id: a
    text:
      es: "La dimisión del Presidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "La celebración de elecciones generales."
  - id: c
    text:
      es: "El fallecimiento del Presidente del Gobierno."
  - id: d
    text:
      es: "La aprobación de una moción de censura."
  explanation:
    es: "El artículo 21.6 limita la suspensión al caso del Gobierno en funciones por la celebración de elecciones generales. La dimisión o el fallecimiento del Presidente y la moción de censura son otras causas de cese, pero el artículo no suspende por ellas las delegaciones."
  citation: "art. 21.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-1997-25336-art-24
- id: m01-l03-q0031
  prompt:
    es: "De acuerdo con el artículo 24.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los reglamentos se ordenarán según la siguiente jerarquía:"
  options:
  - id: a
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto acordado en el Consejo de Ministros; después, las de Real Decreto del Presidente; y por último, las Órdenes Ministeriales."
  - id: b
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto del Presidente del Gobierno; después, las Órdenes Ministeriales; y por último, los Reales Decretos acordados en Consejo de Ministros."
  - id: c
    text:
      es: "Primero, las disposiciones aprobadas por Orden Ministerial; después, las aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros; después, las aprobadas por Orden Ministerial."
  explanation:
    es: "El artículo 24.2 fija dos escalones: «1.º Disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros» y «2.º Disposiciones aprobadas por Orden Ministerial». Los Reales Decretos del Presidente y los acordados en Consejo de Ministros comparten el primer escalón; ninguno está por encima del otro. Las Órdenes Ministeriales van siempre después de los Reales Decretos."
  citation: "art. 24.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-8
- id: m01-l03-q0234
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿puede un órgano administrativo renunciar a la competencia que tiene atribuida?"
  options:
  - id: a
    text:
      es: "Sí, a favor de su superior jerárquico inmediato."
  - id: b
    text:
      es: "Sí, con autorización del titular del departamento."
  - id: c
    correct: true
    text:
      es: "No, porque la competencia es irrenunciable."
  - id: d
    text:
      es: "Sí, cuando la norma de atribución no lo prohíba."
  explanation:
    es: "El artículo 8.1 LRJSP empieza: «La competencia es irrenunciable». No hay excepción a favor del superior, ni con autorización del titular del departamento, ni por silencio de la norma de atribución. Otra cosa es que se delegue o se avoque su ejercicio, que no es renunciar a ella."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-8
- id: m01-l03-q0235
  prompt:
    es: "De acuerdo con el artículo 8.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la delegación de competencias, las encomiendas de gestión, la delegación de firma y la suplencia:"
  options:
  - id: a
    text:
      es: "trasladan la titularidad de la competencia al órgano que la ejerce."
  - id: b
    correct: true
    text:
      es: "no suponen alteración de la titularidad de la competencia."
  - id: c
    text:
      es: "alteran la titularidad de la competencia, salvo la delegación de firma."
  - id: d
    text:
      es: "alteran la titularidad de la competencia cuando se publican en el BOE."
  explanation:
    es: "El artículo 8.1 LRJSP dice que esas cuatro figuras «no suponen alteración de la titularidad de la competencia, aunque sí de los elementos determinantes de su ejercicio». La titularidad sigue en el órgano que la tiene atribuida, sea cual sea la figura. No hay excepción para la delegación de firma. La publicación tampoco cambia la titularidad."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l03-q0236
  prompt:
    es: "Según el artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, cuando dos órganos de un mismo Ministerio no están relacionados jerárquicamente, ¿quién aprueba previamente la delegación de competencias entre ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "El superior común de ambos órganos."
  - id: b
    text:
      es: "El órgano superior del que dependa el órgano delegado."
  - id: c
    text:
      es: "El Subsecretario del Ministerio al que pertenecen."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro."
  explanation:
    es: "Para órganos no relacionados jerárquicamente, el artículo 9.1 LRJSP exige «la aprobación previa del superior común si ambos pertenecen al mismo Ministerio». El órgano superior del que dependa el órgano delegado es la regla para órganos de diferentes Ministerios. El Subsecretario y el Consejo de Ministros no aparecen en esta regla."
  citation: "art. 9.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l03-q0237
  prompt:
    es: "Conforme al artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si el órgano delegante y el delegado, no relacionados jerárquicamente, pertenecen a diferentes Ministerios, la delegación necesita la aprobación previa:"
  options:
  - id: a
    text:
      es: "del Consejo de Ministros, a propuesta de ambos Ministros."
  - id: b
    text:
      es: "de los Subsecretarios de los dos Ministerios, de forma conjunta."
  - id: c
    text:
      es: "de la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "del órgano superior de quien dependa el órgano delegado."
  explanation:
    es: "El artículo 9.1 LRJSP pide la aprobación previa «del órgano superior de quien dependa el órgano delegado, si el delegante y el delegado pertenecen a diferentes Ministerios». Decide el superior del lado que recibe la competencia. Ni el Consejo de Ministros, ni los dos Subsecretarios juntos, ni la Comisión General de Secretarios de Estado y Subsecretarios intervienen en esta aprobación."
  citation: "art. 9.1 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l03-q0239
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en ningún caso podrán ser objeto de delegación las competencias relativas a la resolución de recursos:"
  options:
  - id: a
    text:
      es: "en los órganos superiores jerárquicos de los que dictaron los actos recurridos."
  - id: b
    text:
      es: "en los organismos públicos vinculados o dependientes del órgano delegante."
  - id: c
    correct: true
    text:
      es: "en los órganos administrativos que hayan dictado los actos objeto de recurso."
  - id: d
    text:
      es: "en órganos de un Ministerio distinto de aquel al que pertenece el delegante."
  explanation:
    es: "El artículo 9.2.c) LRJSP prohíbe delegar «la resolución de recursos en los órganos administrativos que hayan dictado los actos objeto de recurso». El límite es que quien dictó el acto no resuelva el recurso contra él. La letra no habla del superior jerárquico, de los organismos públicos ni de órganos de otro Ministerio; el artículo 9.1 permite delegar en los dos últimos."
  citation: "art. 9.2.c) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-9
- id: m01-l03-q0240
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las resoluciones adoptadas por delegación es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Se consideran dictadas por el órgano delegante."
  - id: b
    text:
      es: "Se consideran dictadas por el órgano delegado que las firma."
  - id: c
    text:
      es: "Se consideran dictadas por el superior común de ambos órganos."
  - id: d
    text:
      es: "Se consideran dictadas por el órgano que aprobó la delegación."
  explanation:
    es: "El artículo 9.4 LRJSP dice que esas resoluciones «se considerarán dictadas por el órgano delegante». Firma el delegado, pero el acto se imputa al delegante, que sigue siendo el titular de la competencia (artículo 8.1). El superior común y el órgano que aprobó la delegación solo intervienen al aprobarla."
  citation: "art. 9.4 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10566-art-14
- id: m01-l03-q0241
  prompt:
    es: "Conforme al artículo 14.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el órgano administrativo que se estime incompetente para la resolución de un asunto:"
  options:
  - id: a
    text:
      es: "devolverá la solicitud al interesado y le indicará cuál es el órgano que considera competente."
  - id: b
    correct: true
    text:
      es: "remitirá directamente las actuaciones al órgano que considere competente y lo notificará a los interesados."
  - id: c
    text:
      es: "elevará las actuaciones a su superior jerárquico para que este decida qué órgano es el competente."
  - id: d
    text:
      es: "declarará inadmisible la solicitud y archivará las actuaciones, sin necesidad de notificarlo."
  explanation:
    es: "El artículo 14.1 LRJSP dice que ese órgano «remitirá directamente las actuaciones al órgano que considere competente, debiendo notificar esta circunstancia a los interesados». No devuelve la solicitud ni la inadmite: el interesado no tiene que empezar de nuevo. Tampoco eleva el asunto a su superior; la remisión es directa al órgano que considera competente."
  citation: "art. 14.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-14
- id: m01-l03-q0243
  prompt:
    es: "De acuerdo con el artículo 14.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los interesados que sean parte en el procedimiento podrán dirigirse al órgano que estimen competente para que:"
  options:
  - id: a
    correct: true
    text:
      es: "requiera de inhibición al órgano que esté conociendo del asunto."
  - id: b
    text:
      es: "avoque para sí el conocimiento del asunto que tramita el otro órgano."
  - id: c
    text:
      es: "declare la nulidad de lo actuado por el órgano que conoce del asunto."
  - id: d
    text:
      es: "delegue en el órgano que conoce del asunto la competencia para resolverlo."
  explanation:
    es: "El artículo 14.2 LRJSP dice que los interesados «podrán dirigirse al órgano que estimen competente para que requiera de inhibición al que esté conociendo del asunto». Avocar para sí el asunto es otra figura: según el artículo 10.1, la avocación la ejercen los órganos superiores sobre asuntos de sus órganos dependientes. Declarar la nulidad de lo actuado no figura en las dos peticiones que el artículo 14.2 permite: declinar competencia y requerir de inhibición. Delegar la competencia en el órgano que conoce del asunto no es una de ellas: lo que se pide al órgano que se estima competente es que reclame el asunto."
  citation: "art. 14.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-13
- id: m01-l03-q0244
  prompt:
    es: "De acuerdo con el artículo 13.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los titulares de los órganos administrativos podrán ser suplidos temporalmente en los supuestos de:"
  options:
  - id: a
    text:
      es: "vacante, ausencia o enfermedad, así como cuando se haya abierto contra ellos un expediente disciplinario."
  - id: b
    correct: true
    text:
      es: "vacante, ausencia o enfermedad, así como cuando se haya declarado su abstención o recusación."
  - id: c
    text:
      es: "vacante o ausencia, así como cuando se haya declarado su abstención o recusación, no por enfermedad."
  - id: d
    text:
      es: "ausencia o enfermedad, así como cuando se haya declarado su abstención o recusación, no por vacante."
  explanation:
    es: "El artículo 13.1 permite la suplencia temporal «en los supuestos de vacante, ausencia o enfermedad, así como en los casos en que haya sido declarada su abstención o recusación». Un procedimiento disciplinario no es un supuesto del artículo. Las otras dos opciones quitan la enfermedad o la vacante, que el artículo lista junto con la ausencia."
  citation: "art. 13.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-13
- id: m01-l03-q0245
  prompt:
    es: "Conforme al artículo 13.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la suplencia no implica alteración de la competencia y, para su validez:"
  options:
  - id: a
    text:
      es: "es necesaria su publicación en el boletín oficial correspondiente."
  - id: b
    text:
      es: "es necesaria su comunicación al órgano superior."
  - id: c
    text:
      es: "es necesaria su inscripción en un registro oficial."
  - id: d
    correct: true
    text:
      es: "no es necesaria su publicación en diario oficial alguno."
  explanation:
    es: "El artículo 13.2 dice que la suplencia «no implicará alteración de la competencia y para su validez no será necesaria su publicación». Ni la publicación ni la comunicación al superior ni la inscripción en un registro son requisitos de validez en ese apartado."
  citation: "art. 13.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
