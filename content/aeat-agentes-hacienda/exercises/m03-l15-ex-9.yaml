# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0197
  prompt:
    es: "Según el artículo 31.1.3.ª.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en el cómputo de las magnitudes de rendimientos íntegros se incluyen las operaciones del cónyuge, descendientes y ascendientes y de entidades en régimen de atribución de rentas en las que participen, cuando las actividades sean idénticas o similares y:"
  options:
  - id: a
    text:
      es: "los titulares convivan en el mismo domicilio."
  - id: b
    text:
      es: "exista vinculación en el capital de las entidades en más de un 50 por ciento."
  - id: c
    correct: true
    text:
      es: "exista una dirección común de tales actividades."
  - id: d
    text:
      es: "las actividades se desarrollen en el mismo municipio."
  explanation:
    es: "Se acumulan las operaciones de familiares y entidades en atribución cuando las actividades son idénticas o similares y existe dirección común (art. 31.1.3.ª.b) LIRPF). La convivencia, el municipio y el porcentaje de capital no son criterios del precepto."
  citation: "art. 31.1.3.ª LIRPF"
  difficulty: 3
  tags:
  - "estimación objetiva"
  - "cómputo de magnitudes"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0199
  prompt:
    es: "Según el artículo 32.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la reducción del 30 por ciento de los rendimientos netos de actividades económicas con período de generación superior a dos años no se aplica a los que procedan del ejercicio de una actividad económica que:"
  options:
  - id: a
    correct: true
    text:
      es: "de forma regular o habitual obtenga este tipo de rendimientos."
  - id: b
    text:
      es: "obtenga rendimientos netos superiores a 300.000 euros anuales."
  - id: c
    text:
      es: "se determine por el método de estimación objetiva."
  - id: d
    text:
      es: "se haya iniciado en los dos años anteriores."
  explanation:
    es: "La reducción no alcanza a los rendimientos de una actividad que de forma regular o habitual obtiene este tipo de rendimientos (art. 32.1 LIRPF). El inicio reciente y el método objetivo no son exclusiones del precepto. Y los 300.000 euros limitan la cuantía sobre la que se aplica, sin excluir la reducción."
  citation: "art. 32.1 LIRPF"
  difficulty: 3
  tags:
  - "actividades económicas"
  - "reducción"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0200
  prompt:
    es: "De acuerdo con el artículo 32.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la reducción de los rendimientos netos de actividades económicas con período de generación superior a dos años:"
  options:
  - id: a
    correct: true
    text:
      es: "Se reducen en un 30 por ciento cuando se imputen en un único período impositivo, con un máximo de 300.000 euros anuales de rendimiento neto."
  - id: b
    text:
      es: "Se reducen en un 30 por ciento cuando se imputen en un único período impositivo, con un máximo de 100.000 euros anuales de rendimiento neto."
  - id: c
    text:
      es: "Se reducen en un 20 por ciento cuando se imputen en un único período impositivo, con un máximo de 300.000 euros anuales de rendimiento neto."
  - id: d
    text:
      es: "Se reducen en un 20 por ciento cuando se imputen en un único período impositivo, con un máximo de 100.000 euros anuales de rendimiento neto."
  explanation:
    es: "La reducción por generación superior a dos años o irregularidad notoria es del 30 por ciento y el tope de rendimiento neto es de 300.000 euros anuales (art. 32.1 LIRPF). El 20 por ciento y los 100.000 euros pertenecen a la reducción por inicio de actividad del artículo 32.3, y las combinaciones cruzadas mezclan ambas reducciones."
  citation: "art. 32.1 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "reducción"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0201
  prompt:
    es: "Conforme al artículo 32.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los contribuyentes que inicien una actividad económica y determinen el rendimiento neto por estimación directa pueden reducir en un 20 por ciento el rendimiento neto positivo en el primer período impositivo en que sea positivo y en:"
  options:
  - id: a
    text:
      es: "los dos períodos impositivos siguientes."
  - id: b
    text:
      es: "los tres períodos impositivos siguientes."
  - id: c
    text:
      es: "los cuatro períodos impositivos siguientes."
  - id: d
    correct: true
    text:
      es: "el período impositivo siguiente."
  explanation:
    es: "La reducción del 20 por ciento se aplica al primer período con rendimiento positivo y al siguiente (art. 32.3 LIRPF). Dos, tres o cuatro períodos son plazos que el precepto no recoge."
  citation: "art. 32.3 LIRPF"
  difficulty: 1
  tags:
  - "actividades económicas"
  - "inicio de actividad"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0202
  prompt:
    es: "Señale la respuesta CORRECTA sobre la reducción por inicio de una actividad económica con estimación directa, según el artículo 32.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se reduce en un 20 por ciento el rendimiento neto positivo, y el rendimiento neto sobre el que se aplica no puede superar 50.000 euros anuales."
  - id: b
    text:
      es: "Se reduce en un 25 por ciento el rendimiento neto positivo, y el rendimiento neto sobre el que se aplica no puede superar 100.000 euros anuales."
  - id: c
    correct: true
    text:
      es: "Se reduce en un 20 por ciento el rendimiento neto positivo, y el rendimiento neto sobre el que se aplica no puede superar 100.000 euros anuales."
  - id: d
    text:
      es: "Se reduce en un 30 por ciento el rendimiento neto positivo, y el rendimiento neto sobre el que se aplica no puede superar 300.000 euros anuales."
  explanation:
    es: "El porcentaje es del 20 por ciento y el límite del rendimiento neto sobre el que se aplica, de 100.000 euros anuales (art. 32.3 LIRPF). El 30 por ciento y los 300.000 euros corresponden a la reducción del apartado 1. Cincuenta mil euros y el 25 por ciento no figuran en el precepto."
  citation: "art. 32.3 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "inicio de actividad"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0204
  prompt:
    es: "De acuerdo con el artículo 32.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la exclusión de la reducción por inicio de actividad en un período impositivo:"
  options:
  - id: a
    text:
      es: "Cuando más del 50 por ciento de los ingresos del período procedan de una persona o entidad con la que el contribuyente tuvo una relación mercantil en el año anterior al inicio."
  - id: b
    text:
      es: "Cuando más del 40 por ciento de los ingresos del período procedan de una persona o entidad de la que el contribuyente obtuvo rendimientos del trabajo en el año anterior al inicio."
  - id: c
    text:
      es: "Cuando más del 50 por ciento de los gastos del período correspondan a una persona o entidad de la que el contribuyente obtuvo rendimientos del trabajo."
  - id: d
    correct: true
    text:
      es: "Cuando más del 50 por ciento de los ingresos del período procedan de una persona o entidad de la que el contribuyente obtuvo rendimientos del trabajo en el año anterior al inicio."
  explanation:
    es: "La reducción no se aplica si más del 50 por ciento de los ingresos proceden de quien pagó al contribuyente rendimientos del trabajo el año anterior al inicio (art. 32.3 LIRPF). El 40 por ciento es un porcentaje que no figura. La relación mercantil previa no es el vínculo que exige el precepto, y se mide por ingresos, no por gastos."
  citation: "art. 32.3 LIRPF"
  difficulty: 3
  tags:
  - "actividades económicas"
  - "inicio de actividad"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0205
  prompt:
    es: "Laura Pons inicia en 2026 una actividad económica y determina el rendimiento neto por estimación directa. Declara un rendimiento neto de menos 3.000 euros en 2026, de 30.000 euros en 2027 y de 40.000 euros en 2028. Se cumplen todos los demás requisitos y no hay otras reducciones. Según el artículo 32.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué reducción corresponde?"
  options:
  - id: a
    text:
      es: "6.000 euros en 2027 y ninguna cantidad en 2028."
  - id: b
    text:
      es: "7.500 euros en 2027 y 10.000 euros en 2028."
  - id: c
    correct: true
    text:
      es: "6.000 euros en 2027 y 8.000 euros en 2028."
  - id: d
    text:
      es: "9.000 euros en 2027 y 12.000 euros en 2028."
  explanation:
    es: "El primer período con rendimiento positivo es 2027, y se reduce el 20 por ciento de 30.000 euros, 6.000 euros. También se reduce 2028, el período siguiente, con el 20 por ciento de 40.000 euros, 8.000 euros (art. 32.3 LIRPF). Con el 25 y el 30 por ciento se obtendrían otras cifras, y la reducción no termina en el primer período positivo."
  citation: "art. 32.3 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "inicio de actividad"
# anchor: boe-a-2006-20764-art-30
- id: m03-l15-q0207
  prompt:
    es: "Marta Gil ejerce una actividad económica de las que pueden determinarse por la modalidad simplificada de la estimación directa. Su importe neto de la cifra de negocios fue de 580.000 euros en 2025 y no renuncia a esa modalidad. Según el artículo 30.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede aplicarla en 2026?"
  options:
  - id: a
    text:
      es: "No, porque debe aplicar la modalidad normal cuando la cifra de negocios supera los 300.000 euros."
  - id: b
    text:
      es: "No, porque la modalidad simplificada solo se aplica a contribuyentes con rendimientos inferiores a 150.000 euros."
  - id: c
    text:
      es: "Sí, pero solo si la cifra de negocios del año en curso tampoco supera los 600.000 euros."
  - id: d
    correct: true
    text:
      es: "Sí, porque su cifra de negocios del año inmediato anterior no supera los 600.000 euros."
  explanation:
    es: "La modalidad simplificada se aplica si el importe neto de la cifra de negocios del año inmediato anterior no supera 600.000 euros, y Marta tuvo 580.000 (art. 30.1 LIRPF). Los 300.000 euros no son el límite. Los 150.000 euros son el límite de la estimación objetiva, otro método. Y la comparación se hace con el año anterior, no con el en curso."
  citation: "art. 30.1 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "estimación directa"
# anchor: boe-a-2026-23174-da-primera
- id: m03-l15-q0208
  prompt:
    es: "Según la disposición adicional primera de la Orden HAC/1161/2026, de 4 de noviembre, por la que se desarrollan para el año 2027 el método de estimación objetiva del Impuesto sobre la Renta de las Personas Físicas y el régimen especial simplificado del Impuesto sobre el Valor Añadido, ¿en qué porcentaje pueden reducir el rendimiento neto de módulos de 2027?"
  options:
  - id: a
    text:
      es: "En un 3 por ciento."
  - id: b
    text:
      es: "En un 15 por ciento."
  - id: c
    correct: true
    text:
      es: "En un 5 por ciento."
  - id: d
    text:
      es: "En un 10 por ciento."
  explanation:
    es: "Para 2027 los contribuyentes pueden reducir el rendimiento neto de módulos en un 5 por ciento (disposición adicional primera Orden HAC/1161/2026). El 10 por ciento fue la reducción de 2026 para las actividades del anexo I, y el 15 y el 3 por ciento no figuran en la orden."
  citation: "disposición adicional primera Orden HAC/1161/2026"
  difficulty: 2
  tags:
  - "estimación objetiva"
  - "módulos"
  - "cifra anual"
# anchor: boe-a-2026-23174-da-cuarta
- id: m03-l15-q0209
  prompt:
    es: "Conforme a la disposición adicional cuarta de la Orden HAC/1161/2026, de 4 de noviembre, por la que se desarrollan para el año 2027 el método de estimación objetiva del Impuesto sobre la Renta de las Personas Físicas y el régimen especial simplificado del Impuesto sobre el Valor Añadido, ¿qué reducción de 2026 corresponde a las actividades del anexo I?"
  options:
  - id: a
    text:
      es: "En un 20 por ciento."
  - id: b
    correct: true
    text:
      es: "En un 10 por ciento."
  - id: c
    text:
      es: "En un 15 por ciento."
  - id: d
    text:
      es: "En un 5 por ciento."
  explanation:
    es: "La Orden HAC/1161/2026 eleva al 10 por ciento, para las actividades del anexo I de la Orden HAC/1425/2025, la reducción de 2026 (disposición adicional cuarta, 2.ª). El 5 por ciento es el porcentaje general de la disposición adicional primera de la Orden HAC/1425/2025, y el 15 y el 20 por ciento no figuran."
  citation: "disposición adicional cuarta Orden HAC/1161/2026"
  difficulty: 3
  tags:
  - "estimación objetiva"
  - "módulos"
  - "cifra anual"
