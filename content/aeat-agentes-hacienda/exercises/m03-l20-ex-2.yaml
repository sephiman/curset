# anchor: celex-32013r0952-art-18
- id: m03-l20-q0014
  prompt:
    es: "Gestoría Levante presenta una declaración en aduana en su propio nombre, pero por cuenta de Alfa Textil, S. L., que le ha encargado la operación. Según el artículo 18, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿qué clase de representación aduanera ejerce Gestoría Levante?"
  options:
  - id: a
    text:
      es: "Directa, porque el representante actúa por cuenta de otra persona, aunque lo haga en su propio nombre."
  - id: b
    text:
      es: "Directa, porque el representante actúa en su propio nombre y la persona representada responde del pago de la deuda."
  - id: c
    text:
      es: "No es representación aduanera, porque quien actúa en su propio nombre no puede tener la condición de representante."
  - id: d
    correct: true
    text:
      es: "Indirecta, porque el representante actúa en su propio nombre pero por cuenta de otra persona."
  explanation:
    es: "Actuar en nombre propio pero por cuenta de otra persona es representación indirecta. Para que fuera directa, el representante tendría que actuar en nombre y por cuenta de otra persona, y aquí actúa en su propio nombre. Que la persona representada responda del pago no convierte la representación en directa: lo que distingue ambas clases es el nombre en que se actúa. Y actuar en nombre propio no excluye la representación aduanera, que el artículo prevé expresamente en su modalidad indirecta."
  citation: "art. 18.1 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "directa e indirecta"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0015
  prompt:
    es: "De acuerdo con el artículo 18, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la representación aduanera es indirecta cuando el representante aduanero actúa:"
  options:
  - id: a
    text:
      es: "En nombre de otra persona pero por cuenta propia, con el poder de representación que esta le haya otorgado."
  - id: b
    text:
      es: "En su propio nombre y por cuenta propia, con el poder de representación de la persona representada."
  - id: c
    correct: true
    text:
      es: "En su propio nombre pero por cuenta de otra persona."
  - id: d
    text:
      es: "En nombre de la autoridad aduanera pero por cuenta de la persona que le ha encargado la operación."
  explanation:
    es: "En la representación indirecta el representante actúa en su propio nombre pero por cuenta de otra persona. Actuar en nombre de otro pero por cuenta propia combina los términos al revés y no corresponde a ninguna clase del artículo. Actuar en nombre y por cuenta propia no es representar a nadie. Y el representante nunca actúa en nombre de la autoridad aduanera, que es la contraparte."
  citation: "art. 18.1 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "directa e indirecta"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0016
  prompt:
    es: "De acuerdo con el artículo 18, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el nombramiento de un representante aduanero:"
  options:
  - id: a
    text:
      es: "Solo pueden nombrar a un representante aduanero las personas que no estén establecidas en el territorio aduanero de la Unión."
  - id: b
    correct: true
    text:
      es: "Toda persona puede nombrar a un representante aduanero, y la representación puede ser directa o indirecta."
  - id: c
    text:
      es: "Toda persona puede nombrar a un representante aduanero, pero la representación debe ser siempre directa."
  - id: d
    text:
      es: "Solo las personas jurídicas pueden nombrar a un representante aduanero, y la representación debe ser siempre indirecta."
  explanation:
    es: "El artículo 18.1 permite que toda persona nombre a un representante aduanero y admite las dos clases de representación. No limita el nombramiento a quienes no están establecidos en la Unión, ni a las personas jurídicas, y no impone una sola clase de representación."
  citation: "art. 18.1 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "nombramiento"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0017
  prompt:
    es: "De acuerdo con el artículo 18, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, los representantes aduaneros deberán estar establecidos:"
  options:
  - id: a
    text:
      es: "En el Estado miembro en el que se presente la declaración en aduana."
  - id: b
    text:
      es: "En el Estado miembro del que sea nacional la persona representada."
  - id: c
    text:
      es: "En cualquier país con el que la Unión haya celebrado un acuerdo preferencial."
  - id: d
    correct: true
    text:
      es: "En el territorio aduanero de la Unión."
  explanation:
    es: "La regla es que el representante aduanero esté establecido en el territorio aduanero de la Unión. El artículo no exige que lo esté en el Estado miembro donde se presente la declaración ni en el de la nacionalidad de la persona representada, y no admite el establecimiento en un tercer país por el mero hecho de un acuerdo preferencial."
  citation: "art. 18.2 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "establecimiento"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0018
  prompt:
    es: "Según el artículo 18, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿puede actuar un representante aduanero no establecido en la Unión por cuenta de una persona que no tiene obligación de estar establecida en ella?"
  options:
  - id: a
    text:
      es: "No, porque todo representante aduanero debe estar establecido en el territorio aduanero de la Unión sin excepción alguna."
  - id: b
    text:
      es: "Sí, pero solo si ejerce una representación directa en nombre de la persona representada."
  - id: c
    correct: true
    text:
      es: "Sí, porque, salvo que se disponga lo contrario, está dispensado de estar establecido cuando actúa por cuenta de personas que no tienen obligación de estarlo."
  - id: d
    text:
      es: "No, porque solo se dispensa del requisito de establecimiento al representante que actúe por cuenta de personas establecidas en la Unión y no en terceros países."
  explanation:
    es: "El artículo 18.2 dispensa del requisito de establecimiento, salvo que se disponga lo contrario, a los representantes que actúan por cuenta de personas que no tienen obligación de estar establecidas en la Unión, y es el caso. Decir que la exigencia no admite excepciones ignora esa dispensa. Condicionarla a la representación directa añade un requisito que el texto no contiene. Y la dispensa no se refiere a personas establecidas en la Unión, sino a las que no tienen obligación de estarlo."
  citation: "art. 18.2 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "establecimiento"
  - "dispensa"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0019
  prompt:
    es: "De acuerdo con el artículo 18, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la prestación de servicios del representante aduanero:"
  options:
  - id: a
    text:
      es: "Las condiciones de prestación de servicios del representante aduanero las determina en exclusiva la Comisión, sin intervención de los Estados miembros."
  - id: b
    correct: true
    text:
      es: "Los Estados miembros pueden determinar, conforme al Derecho de la Unión, las condiciones en que un representante aduanero presta servicios en el Estado miembro en que esté establecido."
  - id: c
    text:
      es: "Los Estados miembros pueden determinar esas condiciones sin sujeción al Derecho de la Unión, siempre que sean más estrictas que las del código."
  - id: d
    text:
      es: "Los Estados miembros solo pueden determinar esas condiciones para los representantes establecidos en otro Estado miembro."
  explanation:
    es: "Los Estados miembros pueden fijar, de conformidad con el Derecho de la Unión, las condiciones de prestación de servicios del representante establecido en su territorio. La Comisión no las determina en exclusiva. Tampoco están libres del Derecho de la Unión, que acota esa facultad. Y se refieren al Estado miembro en que el representante está establecido, no a los establecidos en otro."
  citation: "art. 18.3 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "Estados miembros"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0020
  prompt:
    es: "De acuerdo con el artículo 18, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál de los siguientes representantes aduaneros está autorizado a prestar servicios en un Estado miembro distinto de aquel en que esté establecido?"
  options:
  - id: a
    correct: true
    text:
      es: "El que cumpla los criterios del artículo 39, letras a) a d), sin perjuicio de que los Estados miembros apliquen criterios menos estrictos."
  - id: b
    text:
      es: "El que cumpla los criterios del artículo 39, letras a) a d), pero solo si cada Estado miembro afectado lo autoriza expresamente en cada caso."
  - id: c
    text:
      es: "El que esté establecido en el territorio aduanero de la Unión, con independencia de los criterios que cumpla."
  - id: d
    text:
      es: "El que haya sido nombrado por una persona establecida en el Estado miembro en el que vaya a prestar los servicios."
  explanation:
    es: "El representante que cumple los criterios del artículo 39, letras a) a d), está autorizado a prestar servicios en otro Estado miembro por el propio código, sin perjuicio de criterios menos estrictos que apliquen los Estados miembros. No necesita una autorización expresa de cada Estado miembro. Estar establecido en la Unión no basta si no cumple esos criterios. Y el lugar donde esté establecida la persona que lo nombra no es el requisito que fija el texto."
  citation: "art. 18.3 CAU"
  difficulty: 3
  tags:
  - "representación"
  - "otro Estado miembro"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0021
  prompt:
    es: "De acuerdo con el artículo 18, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, los Estados miembros podrán aplicar las condiciones determinadas conforme al apartado 3 a los representantes aduaneros:"
  options:
  - id: a
    correct: true
    text:
      es: "Que no estén establecidos en el territorio aduanero de la Unión."
  - id: b
    text:
      es: "Que estén establecidos en otro Estado miembro y cumplan los criterios mínimos fijados por la Comisión."
  - id: c
    text:
      es: "Que actúen por cuenta de personas dispensadas de estar establecidas en el Estado miembro de que se trate."
  - id: d
    text:
      es: "Que hayan sido nombrados por una persona no establecida en el territorio aduanero de la Unión."
  explanation:
    es: "El artículo 18.4 permite aplicar las condiciones del apartado 3 a los representantes que no estén establecidos en el territorio aduanero de la Unión. Los establecidos en otro Estado miembro, los que actúan por cuenta de personas dispensadas y los nombrados por una persona no establecida son categorías distintas, y el texto no las menciona."
  citation: "art. 18.4 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "no establecidos"
# anchor: celex-32013r0952-art-19
- id: m03-l20-q0022
  prompt:
    es: "De acuerdo con el artículo 19, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el representante aduanero declarará estar actuando por cuenta de la persona representada e indicará:"
  options:
  - id: a
    text:
      es: "Si la persona representada está establecida en el territorio aduanero de la Unión."
  - id: b
    correct: true
    text:
      es: "Si la representación es directa o indirecta."
  - id: c
    text:
      es: "Si el poder de representación se otorgó por escrito o de forma verbal."
  - id: d
    text:
      es: "Si las mercancías están sujetas a derechos de importación o de exportación."
  explanation:
    es: "Ante las autoridades aduaneras, el representante declara actuar por cuenta de la persona representada e indica si la representación es directa o indirecta. El artículo no le impone declarar el establecimiento de la persona representada, la forma del poder ni la sujeción de las mercancías a derechos."
  citation: "art. 19.1 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "poder de representación"
# anchor: celex-32013r0952-art-19
- id: m03-l20-q0023
  prompt:
    es: "Conforme al artículo 19, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cómo se considera a quien presenta una declaración en aduana por encargo de otra persona sin declarar que actúa como representante aduanero?"
  options:
  - id: a
    text:
      es: "Como un representante aduanero indirecto, que actúa en su propio nombre pero por cuenta de la persona que se lo encargó."
  - id: b
    text:
      es: "Como un representante aduanero directo, que actúa en nombre y por cuenta de la persona que se lo encargó, aunque no lo haya declarado."
  - id: c
    correct: true
    text:
      es: "Como una persona que actúa en su propio nombre y por cuenta propia."
  - id: d
    text:
      es: "Como un representante aduanero provisional, hasta que las autoridades aduaneras le exijan la prueba del poder de representación."
  explanation:
    es: "Quien omite declarar que actúa como representante aduanero se considera que actúa en su propio nombre y por cuenta propia. Considerarlo representante indirecto o directo equivaldría a reconocerle una representación que no declaró. Y el artículo no prevé una representación provisional: la omisión tiene efecto inmediato, con independencia de que después se exija o no la prueba del poder."
  citation: "art. 19.1 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "poder de representación"
# anchor: celex-32013r0952-art-19
- id: m03-l20-q0024
  prompt:
    es: "De acuerdo con el artículo 19, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre quien declara actuar como representante aduanero sin poseer poder de representación:"
  options:
  - id: a
    text:
      es: "Se considera que actúa en nombre y por cuenta de la persona que dice representar, hasta que esta lo desautorice."
  - id: b
    text:
      es: "Queda dispensado de probar su poder, porque las autoridades aduaneras no pueden exigírselo en ningún caso."
  - id: c
    text:
      es: "Se considera que ejerce una representación indirecta, por cuenta de la persona que dice representar."
  - id: d
    correct: true
    text:
      es: "Se considera que actúa en su propio nombre y por cuenta propia."
  explanation:
    es: "Quien declara actuar como representante sin poder se considera que actúa en su propio nombre y por cuenta propia. No se le atribuye una representación ajena, ni directa ni indirecta, porque no tiene poder. Tampoco queda dispensado de probarlo: las autoridades pueden exigir la prueba, salvo en los casos específicos que el código prevé."
  citation: "art. 19.1 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "poder de representación"
# anchor: celex-32013r0952-art-19
- id: m03-l20-q0025
  prompt:
    es: "De acuerdo con el artículo 19, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, las autoridades aduaneras podrán exigir a cualquier persona que declare estar actuando como representante aduanero:"
  options:
  - id: a
    text:
      es: "Un aval bancario que garantice el pago de la deuda aduanera de la persona representada."
  - id: b
    correct: true
    text:
      es: "La presentación de la prueba del poder de representación que le haya otorgado la persona representada."
  - id: c
    text:
      es: "La acreditación de que está establecida en el Estado miembro en el que presente la declaración en aduana."
  - id: d
    text:
      es: "Una autorización previa de la Comisión para actuar como representante aduanero."
  explanation:
    es: "Las autoridades pueden exigir la prueba del poder que la persona representada otorgó al representante. El artículo no menciona un aval bancario, la acreditación de un establecimiento en un Estado miembro concreto ni una autorización previa de la Comisión."
  citation: "art. 19.2 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "poder de representación"
# anchor: celex-32013r0952-art-19
- id: m03-l20-q0026
  prompt:
    es: "De acuerdo con el artículo 19, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la prueba del poder de representación:"
  options:
  - id: a
    text:
      es: "Las autoridades aduaneras deben exigir siempre la prueba, sin que existan casos en que se dispense."
  - id: b
    text:
      es: "Las autoridades aduaneras solo pueden exigir la prueba cuando la representación declarada es indirecta."
  - id: c
    correct: true
    text:
      es: "Las autoridades aduaneras pueden exigir la prueba, pero en casos específicos no la exigen."
  - id: d
    text:
      es: "Las autoridades aduaneras no pueden exigir la prueba, que solo se presenta si el representante lo decide."
  explanation:
    es: "Las autoridades aduaneras pueden exigir la prueba del poder a quien declare ser representante, y en casos específicos no la exigen. No es una obligación sin excepciones. Tampoco depende de que la representación sea indirecta, ni es una facultad del representante: la exigencia corresponde a las autoridades."
  citation: "art. 19.2 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "poder de representación"
# anchor: celex-32013r0952-art-20
- id: m03-l20-q0027
  prompt:
    es: "De acuerdo con el artículo 20 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, se otorgan a la Comisión los poderes para adoptar actos delegados por los que se determinen:"
  options:
  - id: a
    text:
      es: "Las condiciones en que un representante aduanero puede prestar servicios en el Estado miembro en que esté establecido, que fijan los Estados miembros de acuerdo con el Derecho de la Unión."
  - id: b
    text:
      es: "Las normas de procedimiento relativas a la concesión y prueba de la autorización a que se refiere el artículo 18, apartado 3."
  - id: c
    text:
      es: "Los casos en que el representante aduanero queda obligado a constituir una garantía por la deuda aduanera de la persona representada."
  - id: d
    correct: true
    text:
      es: "Los casos en que no se aplica la dispensa del requisito de establecimiento del representante y aquellos en que no se exige la prueba del poder de representación."
  explanation:
    es: "El artículo 20 faculta a la Comisión para determinar, mediante actos delegados, los casos en que no se aplica la dispensa de establecimiento y aquellos en que no se exige la prueba del poder. Las condiciones de prestación de servicios las determinan los Estados miembros. Las normas de procedimiento sobre la autorización del artículo 18.3 corresponden al artículo 21 y se adoptan mediante actos de ejecución. La garantía por la deuda del representado no figura en la delegación."
  citation: "art. 20 CAU"
  difficulty: 3
  tags:
  - "representación"
  - "actos delegados"
# anchor: celex-32013r0952-art-21
- id: m03-l20-q0028
  prompt:
    es: "Según el artículo 21 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿quién especifica las normas de procedimiento relativas a la concesión y prueba de la autorización a que hace referencia el artículo 18, apartado 3, y mediante qué actos?"
  options:
  - id: a
    text:
      es: "La Comisión, mediante actos delegados."
  - id: b
    text:
      es: "Los Estados miembros, mediante disposiciones nacionales."
  - id: c
    text:
      es: "El Consejo, mediante reglamentos de ejecución."
  - id: d
    correct: true
    text:
      es: "La Comisión, mediante actos de ejecución."
  explanation:
    es: "El artículo 21 encomienda a la Comisión especificar esas normas mediante actos de ejecución. Los actos delegados son el instrumento del artículo 20, para otros contenidos. Los Estados miembros fijan las condiciones de prestación de servicios, pero no las normas de procedimiento de la autorización. Y el Consejo no interviene en el artículo 21."
  citation: "art. 21 CAU"
  difficulty: 2
  tags:
  - "representación"
  - "actos de ejecución"
# anchor: celex-32013r0952-art-18
- id: m03-l20-q0029
  prompt:
    es: "¿Qué diferencia a la representación aduanera directa de la indirecta, de acuerdo con el artículo 18, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión?"
  options:
  - id: a
    text:
      es: "En la directa el representante actúa por cuenta de otra persona; en la indirecta, por cuenta propia."
  - id: b
    text:
      es: "En la directa se exige poder de representación; en la indirecta no se exige en ningún caso."
  - id: c
    correct: true
    text:
      es: "En la directa el representante actúa en nombre de otra persona; en la indirecta, en su propio nombre."
  - id: d
    text:
      es: "En la directa el representante debe estar establecido en la Unión; en la indirecta no tiene que estarlo."
  explanation:
    es: "En ambas el representante actúa por cuenta de otra persona; la diferencia está en el nombre: en nombre ajeno en la directa y en el propio en la indirecta. Por eso no se distinguen por actuar por cuenta propia. Tampoco por el poder, porque el artículo 19 regula la prueba del poder para cualquier representante. Y el requisito de establecimiento del artículo 18.2 vale para ambas clases."
  citation: "art. 18.1 CAU"
  difficulty: 1
  tags:
  - "representación"
  - "directa e indirecta"
