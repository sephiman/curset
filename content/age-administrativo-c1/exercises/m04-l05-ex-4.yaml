# anchor: boe-a-2026-8287-apartado-14
- id: m04-l05-q117
  prompt:
    es: "Un funcionario cuya jornada se presta de lunes a sábado inicia el jueves 4 de marzo de 2027 el permiso de cinco días hábiles por la hospitalización de su cónyuge. Sin festivos en el periodo, ¿cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El lunes 8 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "El martes 9 de marzo de 2027."
  - id: c
    text:
      es: "El jueves 11 de marzo de 2027."
  - id: d
    text:
      es: "El miércoles 10 de marzo de 2027."
  explanation:
    es: "Los permisos en días hábiles se computan según la jornada del titular, y el sábado cuenta cuando forma parte de ella (apartado 14.2 de la Resolución de 14 de abril de 2026). Con jornada de lunes a sábado cuentan el jueves 4, el viernes 5, el sábado 6, el lunes 8 y el martes 9. El miércoles 10 sale de una jornada de lunes a viernes, que no es la de este funcionario. El lunes 8 sale de contar días naturales. El jueves 11 añade un día más con la jornada de lunes a viernes."
  citation: "apartado 14.2 Resolución de 14-04-2026"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q118
  prompt:
    es: "Una funcionaria con jornada de lunes a viernes inicia el jueves 30 de abril de 2026 el permiso por el fallecimiento de su cónyuge en otra localidad. El único festivo del periodo es el viernes 1 de mayo. ¿Cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El lunes 4 de mayo de 2026."
  - id: b
    text:
      es: "El martes 5 de mayo de 2026."
  - id: c
    text:
      es: "El miércoles 6 de mayo de 2026."
  - id: d
    correct: true
    text:
      es: "El jueves 7 de mayo de 2026."
  explanation:
    es: "El fallecimiento del cónyuge en distinta localidad da «cinco días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Cuentan el jueves 30, el lunes 4, el martes 5, el miércoles 6 y el jueves 7: el viernes 1 es festivo y el fin de semana no forma parte de la jornada. El miércoles 6 sale de contar el festivo. El martes 5 corresponde a tres días, los de la misma localidad. El lunes 4 sale de contar cinco días naturales."
  citation: "art. 48.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q119
  prompt:
    es: "Un funcionario con jornada de lunes a viernes inicia el lunes 4 de enero de 2027 el permiso por la hospitalización de su hermano, familiar de segundo grado. El único festivo del periodo es el miércoles 6 de enero. ¿Cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El jueves 7 de enero de 2027."
  - id: b
    text:
      es: "El lunes 11 de enero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 8 de enero de 2027."
  - id: d
    text:
      es: "El martes 5 de enero de 2027."
  explanation:
    es: "La hospitalización de un familiar de segundo grado da «cuatro días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Cuentan el lunes 4, el martes 5, el jueves 7 y el viernes 8: el miércoles 6 es festivo. El jueves 7 sale de contar el festivo como día del permiso. El martes 5 corresponde a dos días. El lunes 11 corresponde a cinco días, el permiso del primer grado."
  citation: "art. 48.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q121
  prompt:
    es: "¿Cuál de los siguientes permisos tiene, según el artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público, una duración de un día?"
  options:
  - id: a
    text:
      es: "El permiso por accidente grave de un familiar de segundo grado."
  - id: b
    text:
      es: "El permiso por fallecimiento de un familiar de segundo grado en la misma localidad."
  - id: c
    correct: true
    text:
      es: "El permiso por traslado de domicilio sin cambio de residencia."
  - id: d
    text:
      es: "El permiso por matrimonio o por registro de pareja de hecho."
  explanation:
    es: "La letra b) del artículo 48 da «un día» por traslado de domicilio sin cambio de residencia. El fallecimiento de un familiar de segundo grado en la misma localidad da dos días hábiles. El matrimonio o registro de pareja de hecho da quince días. El accidente grave de un familiar de segundo grado da cuatro días hábiles."
  citation: "art. 48.b) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q122
  prompt:
    es: "¿Cuál de las siguientes describe la duración del permiso para concurrir a exámenes finales y demás pruebas definitivas de aptitud del artículo 48.d) del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El día anterior y el día de celebración de cada examen."
  - id: b
    text:
      es: "El tiempo indispensable dentro de la jornada, sin días completos."
  - id: c
    text:
      es: "Un máximo de seis días al año, sea cual sea el número de pruebas."
  - id: d
    correct: true
    text:
      es: "Los días de celebración de los exámenes o pruebas."
  explanation:
    es: "La letra d) concede el permiso «durante los días de su celebración». No añade el día anterior. El «tiempo indispensable» es la fórmula de otras letras, como la de los exámenes prenatales. No hay tope de seis días al año: seis días es el permiso por asuntos particulares."
  citation: "art. 48.d) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q123
  prompt:
    es: "Las funcionarias embarazadas tienen permiso para la realización de exámenes prenatales y técnicas de preparación al parto:"
  options:
  - id: a
    text:
      es: "Por un máximo de dos horas por sesión, dentro o fuera de la jornada."
  - id: b
    correct: true
    text:
      es: "Por el tiempo indispensable, si deben realizarse dentro de la jornada de trabajo."
  - id: c
    text:
      es: "Por el tiempo indispensable, aunque se realicen fuera de la jornada de trabajo."
  - id: d
    text:
      es: "Por un día completo por cada examen o sesión de preparación."
  explanation:
    es: "La letra e) da permiso «por el tiempo indispensable» para los exámenes y técnicas «que deban realizarse dentro de la jornada de trabajo». No fija dos horas por sesión ni un día por examen. Si se hacen fuera de la jornada no hay nada que conceder."
  citation: "art. 48.e) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q124
  prompt:
    es: "De acuerdo con el artículo 48.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, por lactancia de un hijo menor de doce meses se tiene derecho a:"
  options:
  - id: a
    correct: true
    text:
      es: "Una hora de ausencia del trabajo, que puede dividirse en dos fracciones."
  - id: b
    text:
      es: "Una hora de ausencia del trabajo, que no puede dividirse en fracciones."
  - id: c
    text:
      es: "Dos horas de ausencia del trabajo, que pueden dividirse en dos fracciones."
  - id: d
    text:
      es: "Media hora de ausencia del trabajo, al inicio o al final de la jornada."
  explanation:
    es: "La letra f) da «una hora de ausencia del trabajo que podrá dividir en dos fracciones». Las dos horas son la cifra del permiso por hijo prematuro de la letra g). La hora sí puede dividirse. La media hora al inicio y al final es una forma de sustituir la hora, no el permiso en sí, y va en los dos extremos de la jornada."
  citation: "art. 48.f) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q125
  prompt:
    es: "Según el artículo 48.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, la hora de ausencia por lactancia puede sustituirse por una reducción de la jornada normal de:"
  options:
  - id: a
    text:
      es: "Dos horas al inicio o al final de la jornada, con disminución de retribuciones."
  - id: b
    text:
      es: "Una hora al inicio y otra hora al final de la jornada, con la misma finalidad."
  - id: c
    text:
      es: "Media hora al inicio o al final de la jornada, sin otra modalidad posible."
  - id: d
    correct: true
    text:
      es: "Media hora al inicio y al final de la jornada, o una hora al inicio o al final."
  explanation:
    es: "La letra f) permite sustituir la hora por una reducción «en media hora al inicio y al final de la jornada, o en una hora al inicio o al final de la jornada». La media hora va en los dos extremos, no en uno solo, y hay una segunda modalidad. Una hora en cada extremo duplica el permiso. Las dos horas con disminución de retribuciones son la reducción de la letra g)."
  citation: "art. 48.f) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q126
  prompt:
    es: "Conforme al artículo 48.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el permiso retribuido que acumula en jornadas completas el tiempo de lactancia puede disfrutarse:"
  options:
  - id: a
    correct: true
    text:
      es: "Únicamente desde la finalización del permiso por nacimiento, adopción, guarda o acogimiento."
  - id: b
    text:
      es: "Únicamente durante el permiso por nacimiento, adopción, guarda o acogimiento."
  - id: c
    text:
      es: "En cualquier momento, también durante el permiso por nacimiento, siempre antes de que el hijo cumpla doce meses."
  - id: d
    text:
      es: "Únicamente desde que el hijo cumpla seis meses, acabado o no el otro permiso."
  explanation:
    es: "La letra f) dice que esta modalidad «se podrá disfrutar únicamente a partir de la finalización del permiso por nacimiento, adopción, guarda, acogimiento o del progenitor diferente de la madre biológica respectivo». No cabe durante ese otro permiso ni en cualquier momento antes de los doce meses. La edad de seis meses no es el criterio."
  citation: "art. 48.f) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q127
  prompt:
    es: "Una funcionaria da a luz el martes 16 de febrero de 2027 y opta por la hora diaria de ausencia por lactancia. ¿Hasta cuándo puede ejercer ese derecho?"
  options:
  - id: a
    text:
      es: "Mientras el hijo sea menor de seis meses, es decir, hasta agosto de 2027."
  - id: b
    text:
      es: "Mientras el hijo sea menor de nueve meses, es decir, hasta noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "Mientras el hijo sea menor de doce meses, es decir, hasta febrero de 2028."
  - id: d
    text:
      es: "Mientras el hijo sea menor de quince meses, es decir, hasta mayo de 2028."
  explanation:
    es: "La letra f) da el permiso «por lactancia de un hijo menor de doce meses». Nacido el martes 16 de febrero de 2027, el hijo cumple doce meses el miércoles 16 de febrero de 2028, así que el derecho dura hasta febrero de 2028. Seis, nueve o quince meses no son la edad que fija el artículo."
  citation: "art. 48.f) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
