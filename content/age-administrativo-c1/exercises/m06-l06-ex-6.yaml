# anchor: fuente-ms-access-reglas-validacion-html
- id: m06-l06-q161
  prompt:
    es: "Según la ayuda de Microsoft para Access 365, una regla de validación es una forma de:"
  options:
  - id: a
    text:
      es: "asignar un valor inicial a cada campo cuando se agrega un registro."
  - id: b
    correct: true
    text:
      es: "limitar la información que se escribe en un campo de tabla o en un control de formulario."
  - id: c
    text:
      es: "relacionar los registros de una tabla con los de otra tabla."
  - id: d
    text:
      es: "ordenar los registros de una tabla según el valor de un campo."
  explanation:
    es: "La ayuda dice: «Una regla de validación es una forma de limitar la información que se escribe en un campo de tabla o en un control (como un cuadro de texto) de un formulario». Asignar un valor inicial es la función de Valor predeterminado, relacionar registros de dos tablas es la de las relaciones entre tablas y ordenar registros no se atribuye a las reglas de validación en la página."
  citation: "fuente: `ms-access-reglas-validacion.html`; «Información general»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-tipos-datos-html
- id: m06-l06-q162
  prompt:
    es: "En Access 365, ¿qué crea el valor Sí (se aceptan duplicados) de la propiedad Indexado de un campo?"
  options:
  - id: a
    text:
      es: "Un índice único en el campo"
  - id: b
    text:
      es: "La eliminación de cualquier índice del campo"
  - id: c
    correct: true
    text:
      es: "Un índice no único en el campo"
  - id: d
    text:
      es: "Un índice que abarca varios campos"
  explanation:
    es: "Según la ayuda, Sí (se aceptan duplicados) «crea un índice no único en el campo». El índice único lo crea Sí (sin duplicados), No «quita cualquier índice en el campo» y un índice de varios campos no se puede crear con esta propiedad."
  citation: "fuente: `ms-access-tipos-datos.html`; «Indexado»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q201
  prompt:
    es: "En Access 365, ¿cuál de las siguientes entradas en la fila Criterios hace que la consulta pida al usuario la ciudad al ejecutarse?"
  options:
  - id: a
    correct: true
    text:
      es: "[¿Qué ciudad?]"
  - id: b
    text:
      es: "¿Qué ciudad?"
  - id: c
    text:
      es: "\"¿Qué ciudad?\""
  - id: d
    text:
      es: "(¿Qué ciudad?)"
  explanation:
    es: "La ayuda dice: «La cadena [¿Qué ciudad?] es la petición de parámetros. Los corchetes indican que quiere que la consulta pida información». Sin corchetes, con comillas o con paréntesis no se cumple esa condición: la página solo da los corchetes como forma de pedir el valor."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q202
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de las siguientes acciones realiza una consulta de parámetros cuando se inicia?"
  options:
  - id: a
    text:
      es: "Agrega a otra tabla los datos que recupera"
  - id: b
    correct: true
    text:
      es: "Pide los valores de los campos y los usa como criterios"
  - id: c
    text:
      es: "Muestra solo los campos numéricos de las tablas de origen"
  - id: d
    text:
      es: "Elimina las filas que no cumplen los criterios"
  explanation:
    es: "La ayuda dice: «Cuando inicia una consulta de este tipo, la consulta pide los valores de los campos y, después, usa los valores especificados para crear los criterios de la consulta». Agregar datos a otra tabla es la consulta de datos anexados, eliminar filas es la de eliminación y mostrar solo campos numéricos no lo describe la página para ningún tipo de consulta."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q204
  prompt:
    es: "En Access 365, con el criterio Como [¿Qué ciudad?]&\"*\" en la columna Ciudad, ¿qué devuelve la consulta si el usuario escribe L?"
  options:
  - id: a
    text:
      es: "Todas las ciudades que contienen la letra L"
  - id: b
    text:
      es: "Solo la ciudad cuyo nombre es exactamente L"
  - id: c
    text:
      es: "Todas las ciudades que acaban en la letra L"
  - id: d
    correct: true
    text:
      es: "Todas las ciudades que empiezan por la letra L"
  explanation:
    es: "La ayuda dice que, con ese criterio, «si el usuario escribe L, la consulta devolverá todas las ciudades que empiecen por la letra «L»». Las que contienen la letra corresponden a escribir *s*, y un asterisco solo al final no selecciona ni una ciudad exacta ni las que acaban en la letra."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q205
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite especificar el tipo de datos de los parámetros de una consulta?"
  options:
  - id: a
    correct: true
    text:
      es: "Diseño de consulta › Mostrar u ocultar › Parámetros"
  - id: b
    text:
      es: "Diseño de consulta › Resultados › Parámetros"
  - id: c
    text:
      es: "Diseño de consulta › Tipo de consulta › Parámetros"
  - id: d
    text:
      es: "Diseño de consulta › Configuración de consulta › Parámetros"
  explanation:
    es: "La ayuda indica: «en la pestaña Diseño de la consulta, en el grupo Mostrar u ocultar, haga clic en Parámetros». Resultados contiene Ejecutar, Tipo de consulta contiene Crear tabla, Anexar, Actualizar y Eliminar, y Configuración de consulta contiene Agregar tablas."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q206
  prompt:
    es: "Si en Access 365 se establece un parámetro para que acepte datos de texto, ¿qué ocurre con la entrada del usuario?"
  options:
  - id: a
    text:
      es: "Se rechaza si contiene dígitos, con un mensaje de error"
  - id: b
    correct: true
    text:
      es: "Se interpreta como texto, sin ningún mensaje de error"
  - id: c
    text:
      es: "Se convierte en número siempre que sea posible"
  - id: d
    text:
      es: "Aparece un mensaje de error específico si no es una fecha"
  explanation:
    es: "La ayuda dice: «Si se establece un parámetro para que acepte datos de texto, cualquier entrada se interpreta como texto y no aparece ningún mensaje de error». Por eso no se rechazan los dígitos, no se convierte en número y no se exige una fecha; los mensajes más específicos aparecen con tipos numéricos, de moneda o de fecha y hora."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q207
  prompt:
    es: "En una consulta de Access 365, ¿cuál de los siguientes grupos de datos hace especialmente importante establecer el tipo de datos de un parámetro?"
  options:
  - id: a
    text:
      es: "Texto corto y Texto largo, entre otros"
  - id: b
    text:
      es: "Sí/No y Objeto OLE, entre otros"
  - id: c
    correct: true
    text:
      es: "Numéricos, de moneda y de fecha y hora"
  - id: d
    text:
      es: "Hipervínculo y Datos adjuntos, entre otros"
  explanation:
    es: "La ayuda dice que «es especialmente importante establecer el tipo de datos en los datos numéricos, de moneda o de fecha y hora». Para los de texto no hace falta, porque cualquier entrada se interpreta como texto sin error; Sí/No, Objeto OLE, Hipervínculo y Datos adjuntos no se citan en ese apartado."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-access-criterios-html
- id: m06-l06-q208
  prompt:
    es: "En Access 365, ¿cuál de los siguientes tipos de consulta conviene crear si los campos de criterios no cambian, pero sí los valores que se usan?"
  options:
  - id: a
    text:
      es: "Una consulta de eliminación"
  - id: b
    text:
      es: "Una consulta de totales"
  - id: c
    text:
      es: "Una consulta de creación de tabla"
  - id: d
    correct: true
    text:
      es: "Una consulta de parámetros"
  explanation:
    es: "La ayuda dice: «Si los campos de criterios no cambian pero los valores que quiere usar cambian a menudo, puede crear una consulta de parámetros», que pide los valores y crea con ellos los criterios. Una de eliminación borra filas, una de totales agrupa y resume datos y una de creación de tabla genera una tabla nueva."
  citation: "fuente: `ms-access-criterios.html`; «Introducción a los criterios de búsqueda»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q209
  prompt:
    es: "Según la ayuda de Access 365, ¿por qué no conviene almacenar en una tabla valores calculados, como la edad de una persona?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque dejan de estar actualizados si cambian los datos en que se basan"
  - id: b
    text:
      es: "Porque una tabla no admite expresiones en ninguno de sus campos"
  - id: c
    text:
      es: "Porque ocupan más de 2 GB en la base de datos de Access"
  - id: d
    text:
      es: "Porque solo se pueden guardar mediante consultas de acción y no en formularios"
  explanation:
    es: "La ayuda dice que normalmente las tablas no almacenan valores calculados «ya que los valores calculados dejan de estar actualizados si cambian los valores en los que están basados». Que no admita expresiones es falso, porque existen reglas de validación y el tipo Calculado; el límite de 2 GB es el tamaño total de la base de datos, y las consultas de acción no se citan como único modo de guardarlos."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m06-l06-q210
  prompt:
    es: "En Access 365, ¿cómo se escribe en la fila Campo la expresión de un campo calculado para que la columna se llame «Última actualización»?"
  options:
  - id: a
    text:
      es: "Precedida de Última actualización y de un signo igual"
  - id: b
    correct: true
    text:
      es: "Precedida de Última actualización y de dos puntos"
  - id: c
    text:
      es: "Seguida de Última actualización entre corchetes"
  - id: d
    text:
      es: "Precedida de Última actualización y de un punto y coma"
  explanation:
    es: "La ayuda dice: «Anteponga la expresión con el nombre que desea utilizar en la expresión de salida, seguido de dos puntos», y el ejemplo es «inicie la expresión con Última actualización:». El signo igual y el punto y coma no valen: la frase fija un único separador, los dos puntos. Y el nombre entre corchetes después de la expresión contradice el verbo «Anteponga»: el nombre va delante de la expresión, no detrás."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Usar una expresión como campo de salida»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q211
  prompt:
    es: "En la cuadrícula de diseño de una consulta de Access 365, ¿cuál de las siguientes formas abre el cuadro Zoom para escribir la expresión de un campo calculado?"
  options:
  - id: a
    text:
      es: "Con el botón derecho en la fila Criterios y la opción Generar"
  - id: b
    text:
      es: "Con doble clic en la fila Total de la columna"
  - id: c
    correct: true
    text:
      es: "Con el botón derecho en la fila Campo y la opción Zoom"
  - id: d
    text:
      es: "Con el botón Ejecutar del grupo Resultados de la cinta"
  explanation:
    es: "La ayuda indica: «haga clic con el botón derecho en la fila Campo y, después, haga clic en Zoom en el menú contextual». La fila Criterios recibe los criterios, no la expresión del campo; la fila Total sirve para elegir funciones de agregado y Ejecutar, del grupo Resultados, lanza la consulta."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m06-l06-q212
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes opciones describe lo que calcula el campo Subtotal: ([Cantidad]*[Precio unitario])-([Cantidad]*[Precio unitario]*[Descuento])?"
  options:
  - id: a
    text:
      es: "La suma de las cantidades de todos los productos pedidos"
  - id: b
    text:
      es: "El precio unitario con el descuento sumado al precio"
  - id: c
    text:
      es: "El descuento medio aplicado a cada pedido del cliente"
  - id: d
    correct: true
    text:
      es: "El precio total de cada producto menos el descuento total"
  explanation:
    es: "La ayuda describe esa expresión como la que multiplica la cantidad por el precio y la cantidad por el precio y el descuento para «restar el descuento total del precio total». No suma cantidades, no suma el descuento al precio unitario y no calcula ninguna media."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q213
  prompt:
    es: "Según la ayuda de Microsoft sobre expresiones, un campo calculado de una consulta de Access 365 es:"
  options:
  - id: a
    correct: true
    text:
      es: "una columna de la consulta que es el resultado de una expresión."
  - id: b
    text:
      es: "una columna de la tabla que guarda los datos de otra consulta."
  - id: c
    text:
      es: "una fila de la cuadrícula que limita los registros del resultado."
  - id: d
    text:
      es: "un campo de la tabla que se rellena con un valor aleatorio."
  explanation:
    es: "La ayuda dice: «Un campo calculado es una columna en una consulta que es el resultado de una expresión». No es una columna de tabla que guarde otra consulta, ni una fila de criterios, que es la que limita los registros, ni un valor aleatorio; este último se parece al valor Aleatorio de Autonumeración, que es otra cosa."
  citation: "fuente: `ms-access-expresiones.html`; «Consultas y filtros»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m06-l06-q214
  prompt:
    es: "Señale qué ocurre con los datos cuando se guarda una consulta de selección en Access 365:"
  options:
  - id: a
    text:
      es: "Se guarda una copia de los datos en una tabla oculta del archivo"
  - id: b
    correct: true
    text:
      es: "No se guarda una copia de los datos; la consulta muestra los de las tablas"
  - id: c
    text:
      es: "Se guardan solo los datos de los campos numéricos de la consulta"
  - id: d
    text:
      es: "Se guarda una copia de los datos solamente si el archivo es .accdb"
  explanation:
    es: "La nota de la ayuda dice: «Una consulta solo muestra datos, no los almacena. Al guardar una consulta, no se guarda una copia de los datos». Por eso no hay copia en una tabla oculta, ni de los campos numéricos, ni en el formato .accdb."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Ventajas de usar una consulta»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q215
  prompt:
    es: "En una expresión de Access 365, ¿cuál de las siguientes parejas de operadores se usa para combinar cadenas de texto?"
  options:
  - id: a
    text:
      es: "El punto y coma (;) y el signo igual (=)"
  - id: b
    text:
      es: "La barra (/) y la barra invertida (\\)"
  - id: c
    correct: true
    text:
      es: "El Y comercial (&) y el signo más (+)"
  - id: d
    text:
      es: "El asterisco (*) y el signo de porcentaje (%)"
  explanation:
    es: "La página dice que las expresiones «usan los & operadores (Y comercial) y + (signo más) para combinar cadenas de texto». La pareja con el signo igual falla porque el igual encabeza las expresiones de los controles, como =[Nombre] & \" \" & [Apellidos], y no une cadenas. La barra (/) y el asterisco (*) son, según la página, operadores aritméticos, junto con + y -. Y el signo de porcentaje es un comodín de criterios, otra función que unir texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q216
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes opciones muestra el campo calculado MenosTreinta: Fecha()-30?"
  options:
  - id: a
    text:
      es: "La fecha 30 días posterior a la fecha actual"
  - id: b
    text:
      es: "Los 30 últimos registros de la tabla"
  - id: c
    text:
      es: "La fecha del mes anterior con día 30"
  - id: d
    correct: true
    text:
      es: "La fecha 30 días anterior a la fecha actual"
  explanation:
    es: "La ayuda describe «MinusThirty: Date( )- 30» como un campo que usa la función Fecha «para mostrar la fecha 30 días anterior a la fecha actual». La fecha posterior exigiría sumar 30, y la expresión no cuenta registros ni calcula meses."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de fecha en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q217
  prompt:
    es: "En una consulta de Access 365, ¿qué muestra un campo calculado con la función Medio aplicada así: Medio([Teléfono],2,3)?"
  options:
  - id: a
    correct: true
    text:
      es: "Los tres caracteres a partir del segundo del teléfono"
  - id: b
    text:
      es: "Los tres primeros caracteres del valor del campo Teléfono"
  - id: c
    text:
      es: "Los dos últimos caracteres del valor del campo Teléfono"
  - id: d
    text:
      es: "Los tres últimos caracteres del valor del campo Teléfono"
  explanation:
    es: "La ayuda explica que Mid([Phone],2,3) usa la función Medio «para mostrar los tres caracteres a partir del segundo carácter del valor del campo Teléfono». Los primeros caracteres los devuelve la función Izq y los últimos, la función Der («los dos últimos caracteres», en el ejemplo de CódigoDeTipo)."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q218
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes funciones muestra los dos últimos caracteres del valor del campo CódigoDeActivo?"
  options:
  - id: a
    text:
      es: "Izq"
  - id: b
    correct: true
    text:
      es: "Der"
  - id: c
    text:
      es: "Medio"
  - id: d
    text:
      es: "Longitud"
  explanation:
    es: "La ayuda dice que «TypeCode: Right([AssetCode], 2)» usa la función Der «para mostrar los dos últimos caracteres». Izq muestra el primer carácter en el ejemplo de InicialDeProducto, Medio muestra caracteres desde una posición dada y Longitud cuenta los caracteres de un texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q219
  prompt:
    es: "En una consulta de Access 365, ¿qué muestra el campo calculado TiempoDeEspera: [FechaObligatoria] - [FechaDeEnvío]?"
  options:
  - id: a
    text:
      es: "La suma de los valores de los campos FechaObligatoria y FechaDeEnvío"
  - id: b
    text:
      es: "La fecha de envío incrementada en la fecha obligatoria"
  - id: c
    correct: true
    text:
      es: "La diferencia entre los valores de FechaObligatoria y FechaDeEnvío"
  - id: d
    text:
      es: "El número de registros con FechaObligatoria posterior a FechaDeEnvío"
  explanation:
    es: "La ayuda dice que LeadTime: [RequiredDate] - [ShippedDate] «muestra la diferencia entre los valores de los campos FechaObligatoria y FechaDeEnvío». No suma ni incrementa fechas, y la expresión opera fila a fila, sin contar registros."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones aritméticas en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q220
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones indica cuántos argumentos recibe la función SiInm y cuáles son?"
  options:
  - id: a
    text:
      es: "Dos: una expresión y el valor que se devuelve si es verdadera"
  - id: b
    text:
      es: "Tres: una expresión, un campo y un operador de comparación"
  - id: c
    text:
      es: "Cuatro: una expresión, dos valores y un valor para los campos nulos"
  - id: d
    correct: true
    text:
      es: "Tres: una expresión, el valor si es verdadera y el si es falsa"
  explanation:
    es: "La ayuda dice: «Se pasan tres argumentos a la función SiInm: el primer argumento es una expresión [...], el segundo es el valor que se devuelve si la expresión es verdadera y el tercero es el valor devuelto si la expresión es falsa». Por eso no son dos, ni incluyen un campo y un operador, ni existe un cuarto argumento para nulos."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q221
  prompt:
    es: "En una expresión SiInm de Access 365, ¿cuándo devuelve la función el valor del tercer argumento de la lista?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la expresión del primer argumento es falsa"
  - id: b
    text:
      es: "Cuando la expresión del primer argumento es verdadera"
  - id: c
    text:
      es: "Cuando algún campo de la expresión es nulo"
  - id: d
    text:
      es: "Siempre, después de evaluar el segundo argumento"
  explanation:
    es: "La ayuda dice: «El segundo argumento es el valor que se devuelve si la expresión es verdadera y el tercer argumento es el valor devuelto si la expresión es falsa». El valor del tercer argumento es el de la expresión falsa, no el de la verdadera, que corresponde al segundo. Los nulos no tienen argumento propio: en los ejemplos de la página, EsNulo va dentro de la expresión del primer argumento. Y devolver siempre el tercero tras evaluar el segundo contradice que la función «devuelva uno de dos valores posibles»."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m06-l06-q222
  prompt:
    es: "En un control de Access 365 con la expresión SiInm(EsNulo([País o región]); \" \"; [País]), ¿qué se muestra si el valor de País o región es nulo?"
  options:
  - id: a
    text:
      es: "El valor del control País"
  - id: b
    correct: true
    text:
      es: "Una cadena vacía"
  - id: c
    text:
      es: "Un mensaje de error de valor nulo"
  - id: d
    text:
      es: "El texto «Nulo»"
  explanation:
    es: "La ayuda dice que =IIf(IsNull([Country/region]), \" \", [Country]) muestra «una cadena vacía si el valor del control País o región es nulo; en caso contrario, se muestra el valor del control País o región». El valor de País solo se muestra si País o región no es nulo; la expresión no produce un mensaje de error ni escribe el texto «Nulo»."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-funcion-ano-html
- id: m06-l06-q223
  prompt:
    es: "En Access 365, ¿cuál de las siguientes descripciones corresponde a lo que devuelve la función Año aplicada a una fecha?"
  options:
  - id: a
    text:
      es: "Una fecha con el año actual y el día 1 de enero"
  - id: b
    text:
      es: "Un texto con las dos últimas cifras del año"
  - id: c
    correct: true
    text:
      es: "Un número entero que representa el año"
  - id: d
    text:
      es: "El número de años transcurridos desde esa fecha"
  explanation:
    es: "La página de la función dice que devuelve «un valor de tipo Variant (Integer) que contiene un número entero que representa el año». No devuelve una fecha, ni un texto con dos cifras, ni los años transcurridos: la sintaxis solo recibe la fecha y devuelve su año."
  citation: "fuente: `ms-access-funcion-ano.html`; «Función Año»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-access-funcion-ano-html
