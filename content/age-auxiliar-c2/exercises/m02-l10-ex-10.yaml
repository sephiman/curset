# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q068
  prompt:
    es: "En Access 365, ¿se pueden anexar datos de Excel a una tabla existente mediante una operación de vinculación?"
  options:
  - id: a
    text:
      es: "Sí, eligiendo Anexar una copia de los registros a la tabla"
  - id: b
    text:
      es: "Sí, siempre que la tabla existente tenga clave principal"
  - id: c
    correct: true
    text:
      es: "No: la vinculación siempre crea una tabla vinculada nueva"
  - id: d
    text:
      es: "Sí, pero solo si la tabla existente está vacía"
  explanation:
    es: "La página dice: «No puede vincular datos de Excel a una tabla existente en la base de datos. Esto significa que no puede anexar datos a una tabla existente realizando una operación de vinculación». La opción Anexar una copia de los registros a la tabla pertenece a la importación, que la página trata aparte y que sí admite tablas existentes. Y las dos opciones condicionadas, con clave principal o con la tabla vacía, contradicen la frase, que no admite la vinculación a una tabla existente en ningún caso."
  citation: "fuente: `ms-access-importar-excel.html`; «Si es la primera vez que se vincula a una hoja de Excel»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q069
  prompt:
    es: "Según la ayuda de Access 365, ¿qué se puede hacer con una tabla vinculada a una hoja de Excel una vez abierta en la vista Hoja de datos?"
  options:
  - id: a
    text:
      es: "Cambiar el tipo de datos de los campos"
  - id: b
    text:
      es: "Editar el contenido de los registros"
  - id: c
    text:
      es: "Cambiar el tamaño de los campos"
  - id: d
    correct: true
    text:
      es: "Ocultar campos y filtrar registros"
  explanation:
    es: "La página dice: «puede ocultar campos y filtrar registros abriendo la tabla vinculada en la vista Hoja de datos después de haberlos importado a Access». «Cambiar el tipo de datos» y «cambiar el tamaño de los campos» no se pueden: «No puede cambiar el tipo de datos o el tamaño de los campos en la tabla vinculada». «Editar el contenido» tampoco: la tabla vinculada es de solo lectura."
  citation: "fuente: `ms-access-importar-excel.html`; «Preparar los datos de Excel»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q071
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta inicia la exportación de un objeto a Excel?"
  options:
  - id: a
    text:
      es: "Datos externos › Importar & vínculo › Excel"
  - id: b
    correct: true
    text:
      es: "Datos externos › Exportar › Excel"
  - id: c
    text:
      es: "Archivo › Guardar como › Excel"
  - id: d
    text:
      es: "Crear › Informes › Excel"
  explanation:
    es: "La página dice: «En la pestaña Datos externos, en el grupo Exportar, haga clic en Excel». «Importar & vínculo › Excel» es el grupo de la importación o vinculación. «Archivo › Guardar como › Excel» no existe: «Access no incluye ningún comando \"Guardar como\" para el formato Excel». «Crear › Informes» agrupa las herramientas para crear informes."
  citation: "fuente: `ms-access-exportar-excel.html`; «Ejecutar la operación de exportación»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q072
  prompt:
    es: "En Access 365, ¿cuál de las siguientes listas recoge los objetos que se pueden exportar a Excel con el Asistente para exportación?"
  options:
  - id: a
    text:
      es: "Solo tablas y consultas de la base de datos"
  - id: b
    text:
      es: "Tablas, consultas y macros"
  - id: c
    correct: true
    text:
      es: "Tablas, consultas, formularios o informes"
  - id: d
    text:
      es: "Formularios, informes y módulos de VBA"
  explanation:
    es: "La página dice: «Puede exportar tablas, consultas, formularios o informes». «Solo tablas y consultas de la base de datos» es lo que permite el comando de importación de Excel, no la exportación de Access. «Tablas, consultas y macros» y «Formularios, informes y módulos de VBA» incluyen objetos que no se pueden exportar: «No puede exportar macros ni módulos a Excel»."
  citation: "fuente: `ms-access-exportar-excel.html`; «Acerca de la exportación de datos a Excel»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q073
  prompt:
    es: "En Access 365, ¿cuántos objetos de base de datos se pueden exportar a Excel en cada operación de exportación?"
  options:
  - id: a
    text:
      es: "Todos los del mismo tipo"
  - id: b
    text:
      es: "Hasta cinco"
  - id: c
    text:
      es: "Todos los seleccionados en el panel de navegación"
  - id: d
    correct: true
    text:
      es: "Solo uno"
  explanation:
    es: "La página dice: «Solo puede exportar un objeto de base de datos en cada operación de exportación. No obstante, puede combinar varias hojas de cálculo en Excel después de finalizar las operaciones individuales». «Todos los del mismo tipo», «hasta cinco» y «todos los seleccionados en el panel de navegación» exceden ese límite de uno."
  citation: "fuente: `ms-access-exportar-excel.html`; «Acerca de la exportación de datos a Excel»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q074
  prompt:
    es: "Según la ayuda de Access 365, ¿qué ocurre al exportar a un libro de Excel que ya existe una tabla o consulta con sus datos, pero sin formato?"
  options:
  - id: a
    correct: true
    text:
      es: "Se agrega una hoja nueva con el nombre del objeto"
  - id: b
    text:
      es: "Se sobrescribe el libro y se eliminan todas las hojas"
  - id: c
    text:
      es: "Se anexan los datos a la hoja activa del libro"
  - id: d
    text:
      es: "Se anexan los datos a un rango con nombre del libro"
  explanation:
    es: "La página dice: «El libro no se sobrescribe. Se agrega una nueva hoja de cálculo al libro y recibe el nombre del objeto del que se exportan los datos». «Se sobrescribe el libro y se eliminan todas las hojas» ocurre solo al exportar los datos con formato. «Se anexan los datos a la hoja activa del libro» y «se anexan los datos a un rango con nombre del libro» no son posibles: «No puede anexar los datos en una hoja de cálculo existente o en un rango con nombre»."
  citation: "fuente: `ms-access-exportar-excel.html`; «Prepararse para la operación de exportación»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q075
  prompt:
    es: "En Access 365, ¿qué se exporta a Excel cuando se exportan los datos de una tabla con formato y diseño?"
  options:
  - id: a
    text:
      es: "Todos los campos y registros del objeto subyacente"
  - id: b
    correct: true
    text:
      es: "Solo lo que se muestra en la vista actual"
  - id: c
    text:
      es: "Solo los registros, sin los nombres de campo"
  - id: d
    text:
      es: "Los registros filtrados y las columnas ocultas"
  explanation:
    es: "La página dice de la exportación con formato y diseño: «Solo se exportan campos y registros que se muestran en la vista o el objeto actual». Todos los campos y registros del objeto subyacente es lo que la página da para la exportación sin formato. Los registros filtrados y las columnas ocultas son justo lo que no se exporta: la frase siguiente los excluye. Y exportar solo los registros sin los campos no es lo que dice la página, que habla de exportar campos y registros mostrados."
  citation: "fuente: `ms-access-exportar-excel.html`; «Prepararse para la operación de exportación»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q076
  prompt:
    es: "Según la ayuda de Access 365, ¿qué se exporta al exportar un formulario que contiene subformularios a Excel?"
  options:
  - id: a
    text:
      es: "El formulario principal y todos sus subformularios"
  - id: b
    text:
      es: "Solo los subformularios"
  - id: c
    text:
      es: "El formulario principal y el primer subformulario"
  - id: d
    correct: true
    text:
      es: "Solo el formulario principal"
  explanation:
    es: "La página dice: «Al exportar formularios, informes u hojas de datos que contienen subformularios, subinformes u hojas secundarias de datos, solo se exporta el formulario, el informe o la hoja de datos principales. Debe repetir la operación de exportación para cada subformulario». Por eso «El formulario principal y todos sus subformularios», «Solo los subformularios» y «El formulario principal y el primer subformulario» son falsos."
  citation: "fuente: `ms-access-exportar-excel.html`; «Acerca de la exportación de datos a Excel»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q077
  prompt:
    es: "En Access 365, ¿qué se exporta a Excel de un campo calculado de una tabla o de una consulta?"
  options:
  - id: a
    correct: true
    text:
      es: "El resultado, pero no la expresión"
  - id: b
    text:
      es: "La expresión, pero no el resultado"
  - id: c
    text:
      es: "La expresión y el resultado, en celdas distintas"
  - id: d
    text:
      es: "Ni la expresión ni el resultado"
  explanation:
    es: "La página dice: «Los resultados de los campos calculados se exportan; las expresiones subyacentes que realizan los cálculos, no». Por eso «la expresión, pero no el resultado» es lo contrario. «La expresión y el resultado, en celdas distintas» y «ni la expresión ni el resultado» tampoco figuran en la página."
  citation: "fuente: `ms-access-exportar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q078
  prompt:
    es: "En Access 365, ¿cuál de los siguientes conjuntos de elementos de los datos de origen hay que agregar manualmente a la hoja de Excel tras exportar?"
  options:
  - id: a
    text:
      es: "Campos de hipervínculo y de texto enriquecido"
  - id: b
    correct: true
    text:
      es: "Logotipos, campos Objeto OLE y datos adjuntos"
  - id: c
    text:
      es: "Campos de búsqueda y campos Sí/No"
  - id: d
    text:
      es: "Campos multivalor y campos calculados"
  explanation:
    es: "La página dice: «No se exportan elementos gráficos (como logotipos, contenido de campos Objeto OLE y datos adjuntos que son parte de los datos de origen). Agréguelos manualmente a la hoja de cálculo». «Campos de hipervínculo y de texto enriquecido» sí se exportan: los hipervínculos como hipervínculos y del texto enriquecido «se exporta el texto pero no el formato». «Campos de búsqueda y campos Sí/No» también, y «campos multivalor y campos calculados» igualmente: los multivalor como lista separada por punto y coma y de los calculados, sus resultados."
  citation: "fuente: `ms-access-exportar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-exportar-excel-html
- id: m02-l10-q080
  prompt:
    es: "En Access 365, ¿cuál de las siguientes casillas del cuadro Exportar a una hoja de cálculo de Excel permite exportar solo los registros seleccionados en la vista?"
  options:
  - id: a
    text:
      es: "Exportar datos con formato y diseño"
  - id: b
    text:
      es: "Abrir el archivo de destino al finalizar la operación de exportación"
  - id: c
    text:
      es: "Guardar los pasos de exportación"
  - id: d
    correct: true
    text:
      es: "Exportar solo los registros seleccionados"
  explanation:
    es: "La página dice: «puede seleccionar Exportar solo los registros seleccionados». «Exportar datos con formato y diseño» exporta lo que muestra la vista con su formato. «Abrir el archivo de destino al finalizar» solo abre el libro en Excel al terminar. «Guardar los pasos de exportación» no es una casilla de ese cuadro: tras la operación, Access muestra un cuadro para crear una especificación."
  citation: "fuente: `ms-access-exportar-excel.html`; «Ejecutar la operación de exportación»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l10-q081
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite publicar una tabla o un informe como PDF?"
  options:
  - id: a
    correct: true
    text:
      es: "Datos externos › Exportar › PDF o XPS"
  - id: b
    text:
      es: "Archivo › Guardar una copia › PDF"
  - id: c
    text:
      es: "Crear › Informes › PDF o XPS"
  - id: d
    text:
      es: "Datos externos › Exportar › Excel"
  explanation:
    es: "La página dice del Access: «En la pestaña Datos externos, en el grupo Exportar, seleccione PDF o XPS». «Archivo › Guardar una copia» es la ruta de Word para guardar como PDF. «Crear › Informes» agrupa las herramientas para crear informes. «Datos externos › Exportar › Excel» exporta a un libro de Excel, no a PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-pdf-html
- id: m02-l10-q083
  prompt:
    es: "En Access 365, al publicar como PDF, ¿qué opción conviene elegir si se necesita una alta calidad de impresión?"
  options:
  - id: a
    text:
      es: "Tamaño mínimo (publicación en línea)"
  - id: b
    text:
      es: "Opciones, para definir la página que se imprimirá"
  - id: c
    correct: true
    text:
      es: "Standard (publicación en línea e impresión)"
  - id: d
    text:
      es: "Cualquiera, porque ambas tienen igual calidad"
  explanation:
    es: "La página dice: «Si necesita una alta calidad de impresión en el documento, seleccione Standard (publicación en línea e impresión)». «Tamaño mínimo (publicación en línea)» es para cuando «el tamaño del archivo es más importante que la calidad de impresión». «Opciones, para definir la página que se imprimirá» sirve para definir la página, las marcas y las opciones de impresión, no la calidad. «Cualquiera, porque ambas tienen igual calidad» contradice la distinción que hace la página entre las dos opciones."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l10-q084
  prompt:
    es: "En Access 365, al publicar como PDF, ¿qué opción conviene elegir si el tamaño del archivo es más importante que la calidad de impresión?"
  options:
  - id: a
    text:
      es: "Standard (publicación en línea e impresión)"
  - id: b
    text:
      es: "Opciones, para elegir si se imprimen las marcas"
  - id: c
    text:
      es: "Publicar, para guardar sin calidad de impresión"
  - id: d
    correct: true
    text:
      es: "Tamaño mínimo (publicación en línea)"
  explanation:
    es: "La página dice: «Si el tamaño del archivo es más importante que la calidad de impresión, seleccione Tamaño mínimo (publicación en línea)». «Standard (publicación en línea e impresión)» es la opción para una alta calidad de impresión. «Opciones, para elegir si se imprimen las marcas» define la página, las marcas y las opciones de impresión. «Publicar, para guardar sin calidad de impresión» es el último paso, que genera el archivo, y no elige la calidad."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-exportar-word-html
- id: m02-l10-q266
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones describe lo que ocurre al exportar una tabla a Word con Datos externos › Exportar › Word?"
  options:
  - id: a
    text:
      es: "Los datos se exportan a una hoja nueva de un libro de Excel."
  - id: b
    correct: true
    text:
      es: "Los datos se exportan siempre a un archivo nuevo de formato .rtf."
  - id: c
    text:
      es: "Los datos se exportan a un archivo .rtf, incluidas las columnas ocultas por filtros."
  - id: d
    text:
      es: "Los datos se anexan a un documento de Word existente que se elige."
  explanation:
    es: "Al exportar a Word, Access crea una copia de los datos en un archivo de texto enriquecido (.rtf) nuevo, y no se pueden anexar datos a un documento de Word existente. Anexar a un documento de Word existente contradice esa frase. Las columnas y registros ocultos por filtros no se exportan, porque el asistente exporta los datos con formato. La hoja nueva de un libro es el resultado de la exportación a Excel."
  citation: "fuente: `ms-access-exportar-word.html`; «Fusionar con un documento existente»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-tareas-basicas-html
- id: m02-l10-q267
  prompt:
    es: "¿Cuál de los siguientes orígenes de la tabla de orígenes de datos de Access 365 se puede importar, pero no vincular?"
  options:
  - id: a
    text:
      es: "Carpeta de Outlook"
  - id: b
    text:
      es: "Documento HTML"
  - id: c
    text:
      es: "Lista de SharePoint"
  - id: d
    correct: true
    text:
      es: "XML"
  explanation:
    es: "En la tabla, XML tiene Sí en Importar y nada en Vincular. Documento HTML tiene Sí en Importar y Sí en Vincular, por lo que también se puede vincular. Carpeta de Outlook tiene Sí en las dos columnas. Lista de SharePoint tiene igualmente Sí en las dos columnas."
  citation: "fuente: `ms-access-tareas-basicas.html`; «Importar o vincular datos de otros orígenes»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-reglas-validacion-html
- id: m02-l10-q241
  prompt:
    es: "En una tabla de Access 365, un campo tiene la regla de validación >=Fecha(). ¿Cuál de las siguientes propiedades hay que rellenar para que Access muestre un aviso propio al infringirla?"
  options:
  - id: a
    text:
      es: "Máscara de entrada"
  - id: b
    text:
      es: "Obligatorio"
  - id: c
    text:
      es: "Valor predeterminado"
  - id: d
    correct: true
    text:
      es: "Texto de validación"
  explanation:
    es: "Con la propiedad Regla de validación se limitan los datos, y con la propiedad Texto de validación se informa de errores a los usuarios con un mensaje propio. Valor predeterminado es el dato que se escribe solo en cada registro nuevo. Máscara de entrada define el formato de los caracteres que se escriben, pero no muestra el aviso de una regla. Obligatorio exige que el campo tenga datos, sin relación con el mensaje de la regla."
  citation: "fuente: `ms-access-reglas-validacion.html`; «Crear un mensaje que se abre cuando la entrada en el campo no es válida»"
  difficulty: 1
  tags:
  - "concepto"
