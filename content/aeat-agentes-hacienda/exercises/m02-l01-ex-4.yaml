variants:
# anchor: celex-12016m-txt-art-1
- id: m02-l01-q0117
  prompt:
    es: "Señale la respuesta CORRECTA sobre el valor jurídico de los dos Tratados en los que se funda la Unión, de acuerdo con el artículo 1 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Tratado de la Unión Europea tiene un valor jurídico superior al del Tratado de Funcionamiento."
  - id: b
    text:
      es: "El Tratado de Funcionamiento de la Unión Europea tiene un valor jurídico superior al del Tratado de la Unión Europea."
  - id: c
    correct: true
    text:
      es: "Ambos Tratados tienen el mismo valor jurídico."
  - id: d
    text:
      es: "Ambos Tratados tienen el mismo valor jurídico que las recomendaciones y los dictámenes."
  explanation:
    es: "El artículo 1 dice que ambos Tratados tienen el mismo valor jurídico, de modo que ninguno prevalece sobre el otro. Equipararlos a las recomendaciones y dictámenes, que no son vinculantes (art. 288 TFUE), sería privarles de su fuerza obligatoria."
  citation: "art. 1 TUE"
  difficulty: 1
  tags:
  - "Derecho originario"
# anchor: celex-12016m-txt-art-1
- id: m02-l01-q0118
  prompt:
    es: "Conforme al artículo 1 del Tratado de la Unión Europea, ¿en qué se fundamenta la Unión, a la que los Estados miembros atribuyen competencias para alcanzar sus objetivos comunes?"
  options:
  - id: a
    text:
      es: "En el Tratado de la Unión Europea y en la Carta de los Derechos Fundamentales de la Unión Europea."
  - id: b
    text:
      es: "En el Tratado de Funcionamiento de la Unión Europea y en el Tratado constitutivo de la Comunidad Europea."
  - id: c
    text:
      es: "En los Tratados constitutivos y en las constituciones de los Estados miembros."
  - id: d
    correct: true
    text:
      es: "En el Tratado de la Unión Europea y en el Tratado de Funcionamiento de la Unión Europea."
  explanation:
    es: "La Unión se fundamenta en el Tratado de la Unión Europea y en el Tratado de Funcionamiento de la Unión Europea (art. 1 TUE), que son «los Tratados». La Carta de los Derechos Fundamentales no es uno de ellos. El Tratado constitutivo de la Comunidad Europea no es su base, ya que la Unión sustituyó y sucedió a la Comunidad Europea, y las constituciones de los Estados miembros no son el fundamento de la Unión."
  citation: "art. 1 TUE"
  difficulty: 2
  tags:
  - "Derecho originario"
# anchor: celex-12016m-txt-art-4
- id: m02-l01-q0119
  prompt:
    es: "Según el artículo 4.3 del Tratado de la Unión Europea, los Estados miembros adoptarán todas las medidas generales o particulares apropiadas para asegurar el cumplimiento de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las obligaciones derivadas de los Tratados o resultantes de los actos de las instituciones de la Unión."
  - id: b
    text:
      es: "Las obligaciones derivadas de los Tratados, pero no las resultantes de los actos de las instituciones de la Unión."
  - id: c
    text:
      es: "Las obligaciones resultantes de los actos de las instituciones de la Unión, pero no las derivadas de los Tratados."
  - id: d
    text:
      es: "Las obligaciones derivadas de los Tratados o resultantes de su propio Derecho interno."
  explanation:
    es: "El principio de cooperación leal del artículo 4.3 obliga a los Estados miembros a asegurar el cumplimiento de las obligaciones derivadas de los Tratados y de las resultantes de los actos de las instituciones. Las variantes excluyen una de las dos fuentes o sustituyen los actos de las instituciones por el Derecho interno de los Estados."
  citation: "art. 4.3 TUE"
  difficulty: 1
  tags:
  - "cooperación leal"
# anchor: celex-12016e-txt-art-288
- id: m02-l01-q0120
  prompt:
    es: "De acuerdo con el artículo 288 del Tratado de Funcionamiento de la Unión Europea, para ejercer las competencias de la Unión, las instituciones adoptarán:"
  options:
  - id: a
    text:
      es: "Reglamentos, directivas, decisiones, resoluciones y dictámenes."
  - id: b
    text:
      es: "Leyes, directivas, decisiones, recomendaciones y dictámenes."
  - id: c
    text:
      es: "Reglamentos, directivas, decisiones, recomendaciones y conclusiones."
  - id: d
    correct: true
    text:
      es: "Reglamentos, directivas, decisiones, recomendaciones y dictámenes."
  explanation:
    es: "El artículo 288 enumera cinco tipos de actos: reglamentos, directivas, decisiones, recomendaciones y dictámenes. Las resoluciones, las leyes y las conclusiones no figuran en la lista."
  citation: "art. 288 TFUE"
  difficulty: 1
  tags:
  - "actos de la Unión"
# anchor: celex-12016e-txt-art-288
- id: m02-l01-q0121
  prompt:
    es: "Según el artículo 288 del Tratado de Funcionamiento de la Unión Europea, la directiva obligará al Estado miembro destinatario en cuanto al resultado que deba conseguirse, dejando a las autoridades nacionales:"
  options:
  - id: a
    text:
      es: "La elección del resultado y de los medios."
  - id: b
    correct: true
    text:
      es: "La elección de la forma y de los medios."
  - id: c
    text:
      es: "La elección de la forma, pero no de los medios."
  - id: d
    text:
      es: "La elección de los medios, pero no de la forma."
  explanation:
    es: "La directiva fija el resultado, y el artículo 288 deja a las autoridades nacionales la elección tanto de la forma como de los medios. Dejarles elegir el resultado desvirtúa la obligación, y limitar su libertad a la forma o a los medios la recorta respecto del texto."
  citation: "art. 288 TFUE"
  difficulty: 1
  tags:
  - "actos de la Unión"
  - "directiva"
# anchor: celex-12016e-txt-art-288
- id: m02-l01-q0123
  prompt:
    es: "Señale la respuesta CORRECTA sobre las recomendaciones y los dictámenes de las instituciones de la Unión, de acuerdo con el artículo 288 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Las recomendaciones y los dictámenes serán obligatorios solo en cuanto al resultado que deba conseguirse."
  - id: b
    text:
      es: "Las recomendaciones y los dictámenes serán obligatorios en todos sus elementos para sus destinatarios."
  - id: c
    text:
      es: "Las recomendaciones y los dictámenes serán directamente aplicables en cada Estado miembro."
  - id: d
    correct: true
    text:
      es: "Las recomendaciones y los dictámenes no serán vinculantes."
  explanation:
    es: "Las recomendaciones y los dictámenes no son vinculantes (art. 288). Obligar en cuanto al resultado es lo propio de la directiva, obligar en todos los elementos a los destinatarios es la decisión, y ser directamente aplicable en cada Estado miembro corresponde al reglamento."
  citation: "art. 288 TFUE"
  difficulty: 1
  tags:
  - "actos de la Unión"
# anchor: celex-12016e-txt-art-288
- id: m02-l01-q0124
  prompt:
    es: "Señale la respuesta CORRECTA sobre la directiva y la decisión, de acuerdo con el artículo 288 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    correct: true
    text:
      es: "La directiva obliga al Estado miembro destinatario en cuanto al resultado que deba conseguirse, y la decisión es obligatoria en todos sus elementos."
  - id: b
    text:
      es: "La directiva es obligatoria en todos sus elementos, y la decisión obliga solo en cuanto al resultado que deba conseguirse."
  - id: c
    text:
      es: "La directiva es directamente aplicable en cada Estado miembro, y la decisión no es vinculante."
  - id: d
    text:
      es: "La directiva no es vinculante, y la decisión obliga solo en cuanto al resultado que deba conseguirse."
  explanation:
    es: "La directiva obliga en cuanto al resultado y la decisión en todos sus elementos (art. 288). Los distractores invierten sus efectos, atribuyen a la directiva la aplicación directa que es propia del reglamento y niegan el carácter vinculante de la directiva o de la decisión, que sí lo tienen."
  citation: "art. 288 TFUE"
  difficulty: 2
  tags:
  - "actos de la Unión"
# anchor: celex-12016e-txt-art-289
- id: m02-l01-q0125
  prompt:
    es: "Según el artículo 289.1 del Tratado de Funcionamiento de la Unión Europea, ¿a propuesta de qué institución adoptan conjuntamente el Parlamento Europeo y el Consejo un reglamento, una directiva o una decisión en el procedimiento legislativo ordinario?"
  options:
  - id: a
    text:
      es: "A propuesta del Consejo Europeo."
  - id: b
    correct: true
    text:
      es: "A propuesta de la Comisión."
  - id: c
    text:
      es: "A propuesta del Tribunal de Justicia de la Unión Europea."
  - id: d
    text:
      es: "A propuesta del Comité de las Regiones."
  explanation:
    es: "En el procedimiento legislativo ordinario, el Parlamento Europeo y el Consejo adoptan el acto a propuesta de la Comisión (art. 289.1). El Consejo Europeo, el Tribunal de Justicia y el Comité de las Regiones no tienen esa función en el precepto, y el último solo emite dictámenes."
  citation: "art. 289.1 TFUE"
  difficulty: 2
  tags:
  - "procedimiento legislativo ordinario"
# anchor: celex-12016e-txt-art-289
- id: m02-l01-q0128
  prompt:
    es: "¿Qué carácter tienen los actos jurídicos que se adoptan mediante procedimiento legislativo, según el artículo 289.3 del Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Constituyen actos legislativos de la Unión."
  - id: b
    text:
      es: "Constituyen actos delegados de la Comisión."
  - id: c
    text:
      es: "Constituyen actos de ejecución de los Estados miembros."
  - id: d
    text:
      es: "Constituyen actos no vinculantes."
  explanation:
    es: "Los actos que se adoptan mediante procedimiento legislativo son actos legislativos (art. 289.3). Los actos delegados los adopta la Comisión por delegación (art. 290), los de ejecución se dictan para ejecutar actos vinculantes (art. 291), y los actos legislativos sí son vinculantes."
  citation: "art. 289.3 TFUE"
  difficulty: 1
  tags:
  - "actos legislativos"
# anchor: celex-12016e-txt-art-290
- id: m02-l01-q0131
  prompt:
    es: "De acuerdo con el artículo 290.3 del Tratado de Funcionamiento de la Unión Europea, ¿qué figurará en el título de los actos delegados que adopta la Comisión por delegación de un acto legislativo?"
  options:
  - id: a
    text:
      es: "La expresión «de ejecución»."
  - id: b
    text:
      es: "El adjetivo «legislativo» o «legislativa»."
  - id: c
    text:
      es: "La expresión «de desarrollo» o «de aplicación»."
  - id: d
    correct: true
    text:
      es: "El adjetivo «delegado» o «delegada»."
  explanation:
    es: "Los actos delegados llevan en su título el adjetivo «delegado» o «delegada» (art. 290.3). La expresión «de ejecución» identifica los actos de ejecución del artículo 291.4, y los demás términos no son los que exige el Tratado."
  citation: "art. 290.3 TFUE"
  difficulty: 1
  tags:
  - "actos delegados"
# anchor: celex-12016e-txt-art-291
- id: m02-l01-q0133
  prompt:
    es: "Conforme al artículo 291.2 del Tratado de Funcionamiento de la Unión Europea, cuando se requieran condiciones uniformes de ejecución, ¿a quién confieren competencias de ejecución los actos jurídicamente vinculantes de la Unión?"
  options:
  - id: a
    text:
      es: "Al Parlamento Europeo o, en casos específicos debidamente justificados y en los previstos en los artículos 24 y 26 del Tratado de la Unión Europea, al Consejo."
  - id: b
    text:
      es: "A los Estados miembros o, en casos específicos debidamente justificados y en los previstos en los artículos 24 y 26 del Tratado de la Unión Europea, al Consejo Europeo."
  - id: c
    correct: true
    text:
      es: "A la Comisión o, en casos específicos debidamente justificados y en los previstos en los artículos 24 y 26 del Tratado de la Unión Europea, al Consejo."
  - id: d
    text:
      es: "A la Comisión o, en casos específicos debidamente justificados y en los previstos en los artículos 24 y 26 del Tratado de la Unión Europea, al Tribunal de Justicia."
  explanation:
    es: "Las competencias de ejecución uniformes se confieren a la Comisión y, solo excepcionalmente, al Consejo (art. 291.2). No se atribuyen al Parlamento Europeo, ni al Consejo Europeo en lugar del Consejo, ni al Tribunal de Justicia, que no ejerce competencias de ejecución de este tipo."
  citation: "art. 291.2 TFUE"
  difficulty: 3
  tags:
  - "actos de ejecución"
# anchor: celex-12016e-txt-art-291
- id: m02-l01-q0134
  prompt:
    es: "¿Cuál de las siguientes expresiones debe figurar en el título de los actos de ejecución, según el artículo 291.4 del Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "La expresión «de ejecución»."
  - id: b
    text:
      es: "El adjetivo «delegado» o «delegada»."
  - id: c
    text:
      es: "La expresión «de aplicación directa»."
  - id: d
    text:
      es: "El adjetivo «legislativo» o «legislativa»."
  explanation:
    es: "Los actos de ejecución llevan en el título la expresión «de ejecución» (art. 291.4). El adjetivo «delegado» identifica los actos delegados del artículo 290.3, y las otras fórmulas no están previstas en el Tratado."
  citation: "art. 291.4 TFUE"
  difficulty: 1
  tags:
  - "actos de ejecución"
