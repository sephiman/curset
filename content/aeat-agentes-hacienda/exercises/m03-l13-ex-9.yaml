# anchor: boe-a-2003-23186-art-193
- id: m03-l13-q0136
  prompt:
    es: "Cuando se han solicitado indebidamente devoluciones con datos falsos y la devolución llega a obtenerse, ¿qué infracción corresponde, de acuerdo con el artículo 193.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La de presentar incorrectamente autoliquidaciones sin perjuicio económico, con multa fija."
  - id: b
    text:
      es: "La de solicitar indebidamente devoluciones, con multa proporcional del 15 por ciento."
  - id: c
    text:
      es: "Las dos, que se sancionan de forma acumulada con la suma de sus multas."
  - id: d
    correct: true
    text:
      es: "La de obtener indebidamente devoluciones, y no la de solicitarlas sin obtenerlas."
  explanation:
    es: "El artículo 193 LGT castiga la devolución obtenida indebidamente. La solicitud sin obtención, con el 15 por ciento, es solo para cuando la devolución no se ha obtenido (artículo 194.1). No se acumulan, porque la segunda conducta es la anterior sin resultado, y la presentación incorrecta sin perjuicio del artículo 199 requiere que no haya perjuicio económico."
  citation: "art. 193.1 LGT"
  difficulty: 2
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0137
  prompt:
    es: "Paula Mena solicita en su autoliquidación una devolución de 6.000 euros e incluye datos falsos, pero la Administración no llega a devolverle nada. No hay reducciones ni criterios de graduación aplicables. Según el artículo 194.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué sanción se le impone?"
  options:
  - id: a
    text:
      es: "3.000 euros, el 50 por ciento de la cantidad indebidamente solicitada."
  - id: b
    correct: true
    text:
      es: "900 euros, el 15 por ciento de la cantidad indebidamente solicitada."
  - id: c
    text:
      es: "300 euros, la multa fija prevista para solicitar beneficios fiscales indebidos."
  - id: d
    text:
      es: "6.000 euros, el cien por cien de la cantidad indebidamente solicitada."
  explanation:
    es: "Es la infracción grave del artículo 194.1 LGT: se solicita una devolución indebida con datos falsos y no se obtiene. La sanción es el 15 por ciento de lo solicitado: 6.000 × 0,15 = 900 euros. El 50 por ciento es el de la infracción leve de devolución obtenida, los 300 euros fijos son del artículo 194.2 y el cien por cien no es un porcentaje de este artículo."
  citation: "art. 194.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0139
  prompt:
    es: "De acuerdo con el artículo 194.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción de solicitar indebidamente beneficios o incentivos fiscales mediante la omisión de datos relevantes o la inclusión de datos falsos es grave y se sanciona con:"
  options:
  - id: a
    text:
      es: "Multa pecuniaria proporcional del 50 al 100 por ciento."
  - id: b
    text:
      es: "Multa pecuniaria fija de 200 euros."
  - id: c
    correct: true
    text:
      es: "Multa pecuniaria fija de 300 euros."
  - id: d
    text:
      es: "Multa pecuniaria proporcional del 15 por ciento."
  explanation:
    es: "La infracción del artículo 194.2 LGT es grave y se sanciona con una multa fija de 300 euros. El 15 por ciento es la multa proporcional del artículo 194.1. Los 200 euros son una multa fija del artículo 198.1 y el tramo del 50 al 100 es el de las infracciones graves del artículo 191."
  citation: "art. 194.2 LGT"
  difficulty: 1
  tags:
  - "importe"
# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0140
  prompt:
    es: "Según el artículo 194.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la infracción de solicitar indebidamente beneficios o incentivos fiscales:"
  options:
  - id: a
    text:
      es: "Existe además de las sanciones de los artículos 191, 192 o 195, con las que se acumula siempre."
  - id: b
    text:
      es: "Existe solo cuando el beneficio fiscal solicitado se hubiera llegado a aplicar en la autoliquidación."
  - id: c
    correct: true
    text:
      es: "Solo existe si no procede imponer al mismo sujeto sanción por infracciones de los artículos 191, 192 o 195, o del apartado primero del artículo 194."
  - id: d
    text:
      es: "Existe cuando se omiten datos relevantes, pero no cuando se incluyen datos falsos en la solicitud."
  explanation:
    es: "El artículo 194.2 LGT es residual: solo se aplica si no procede sancionar al mismo sujeto por los artículos 191, 192, 195 o 194.1. No se acumula con ellos. No exige que el beneficio llegue a aplicarse y alcanza tanto la omisión de datos relevantes como la inclusión de datos falsos."
  citation: "art. 194.2 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0141
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las infracciones del artículo 194 de la Ley 58/2003, de 17 de diciembre, General Tributaria es CORRECTA?"
  options:
  - id: a
    correct: true
    text:
      es: "Solicitar indebidamente devoluciones sin obtenerlas se sanciona con el 15 por ciento de lo solicitado, y solicitar beneficios fiscales indebidos con multa fija de 300 euros."
  - id: b
    text:
      es: "Solicitar indebidamente devoluciones sin obtenerlas es infracción leve, y solicitar beneficios fiscales indebidos es infracción muy grave."
  - id: c
    text:
      es: "Ambas infracciones se sancionan con multa proporcional del 15 por ciento de la base de la sanción que corresponda."
  - id: d
    text:
      es: "Solicitar indebidamente devoluciones sin obtenerlas se sanciona con multa fija de 300 euros, y solicitar beneficios fiscales indebidos con el 15 por ciento."
  explanation:
    es: "En el artículo 194 LGT, el apartado 1 impone el 15 por ciento de la cantidad indebidamente solicitada, y el apartado 2 una multa fija de 300 euros. Las dos infracciones son graves, y las otras opciones intercambian las sanciones o las califican mal."
  citation: "art. 194 LGT"
  difficulty: 3
  tags:
  - "comparación"
# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0142
  prompt:
    es: "Valeria Casas solicita en una comunicación de datos un incentivo fiscal al que no tiene derecho y omite datos relevantes. No procede sancionarla por los artículos 191, 192 ni 195, ni por el primer apartado del 194. Según el artículo 194.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué sanción se le impone?"
  options:
  - id: a
    text:
      es: "Ninguna sanción, porque el incentivo fiscal no llegó a aplicarse en una autoliquidación."
  - id: b
    text:
      es: "Multa pecuniaria fija de 300 euros, por infracción leve."
  - id: c
    text:
      es: "Multa pecuniaria proporcional del 15 por ciento del beneficio solicitado, por infracción grave."
  - id: d
    correct: true
    text:
      es: "Multa pecuniaria fija de 300 euros, por infracción grave."
  explanation:
    es: "Se cumplen los requisitos del artículo 194.2 LGT: se solicita un beneficio fiscal con omisión de datos relevantes y no procede otra sanción al mismo sujeto. La infracción es grave y la multa es fija, de 300 euros. No es proporcional, no es leve y no exige que el incentivo se haya aplicado."
  citation: "art. 194.2 LGT"
  difficulty: 1
  tags:
  - "supuesto"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0143
  prompt:
    es: "De acuerdo con el artículo 198.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción de no presentar en plazo autoliquidaciones o declaraciones sin que se haya producido perjuicio económico a la Hacienda Pública es leve y se sanciona, con carácter general, con:"
  options:
  - id: a
    text:
      es: "Multa pecuniaria fija de 100 euros."
  - id: b
    text:
      es: "Multa pecuniaria fija de 400 euros."
  - id: c
    text:
      es: "Multa pecuniaria proporcional del 50 por ciento."
  - id: d
    correct: true
    text:
      es: "Multa pecuniaria fija de 200 euros."
  explanation:
    es: "La regla general del artículo 198.1 LGT es una multa fija de 200 euros. Los 400 euros son para las declaraciones censales y la comunicación de la designación del representante, y los 100 euros para la comunicación del domicilio fiscal del artículo 198.5. El 50 por ciento es la multa proporcional de las infracciones leves del artículo 191."
  citation: "art. 198.1 LGT"
  difficulty: 1
  tags:
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0144
  prompt:
    es: "¿Cuál de las siguientes declaraciones presentadas fuera de plazo, sin perjuicio económico, se sanciona con multa fija de 400 euros según el artículo 198.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Las autoliquidaciones periódicas de los tributos cuyo plazo de presentación finaliza cada trimestre natural."
  - id: b
    correct: true
    text:
      es: "Las declaraciones censales y la comunicación de la designación del representante cuando así lo establezca la normativa."
  - id: c
    text:
      es: "Las declaraciones relacionadas con las formalidades aduaneras que no determinen una deuda aduanera."
  - id: d
    text:
      es: "Las declaraciones exigidas con carácter general en cumplimiento del suministro de información de los artículos 93 y 94."
  explanation:
    es: "El artículo 198.1 LGT fija 400 euros para las declaraciones censales y la comunicación del representante. Las declaraciones informativas de los artículos 93 y 94 se sancionan con 20 euros por dato, con mínimo de 300 y máximo de 20.000. Las autoliquidaciones comunes tienen 200 euros y las declaraciones aduaneras sin deuda se rigen por el apartado 4."
  citation: "art. 198.1 LGT"
  difficulty: 2
  tags:
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0145
  prompt:
    es: "Según el artículo 198.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la sanción por no presentar en plazo las declaraciones exigidas con carácter general en cumplimiento de la obligación de suministro de información de los artículos 93 y 94:"
  options:
  - id: a
    correct: true
    text:
      es: "Es una multa fija de 20 euros por cada dato o conjunto de datos referidos a una misma persona o entidad, con un mínimo de 300 y un máximo de 20.000 euros."
  - id: b
    text:
      es: "Es una multa proporcional del uno por 1.000 del valor de las operaciones, con un mínimo de 300 euros."
  - id: c
    text:
      es: "Es una multa fija de 200 euros por cada declaración, con un mínimo de 300 y un máximo de 20.000 euros."
  - id: d
    text:
      es: "Es una multa fija de 20 euros por cada dato o conjunto de datos, con un mínimo de 200 y un máximo de 6.000 euros."
  explanation:
    es: "Para las declaraciones informativas, el artículo 198.1 LGT impone 20 euros por dato o conjunto de datos de una misma persona o entidad, con mínimo de 300 y máximo de 20.000 euros. Los 200 euros por declaración son la multa general, el mínimo de 200 y el máximo de 6.000 no son sus límites (6.000 es el máximo del artículo 198.4) y el uno por 1.000 corresponde a las declaraciones aduaneras."
  citation: "art. 198.1 LGT"
  difficulty: 3
  tags:
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0146
  prompt:
    es: "Asesoría Mora, S.L. no presenta en plazo una declaración informativa exigida con carácter general por los artículos 93 y 94 de la Ley 58/2003, de 17 de diciembre, General Tributaria. La declaración habría debido incluir 8 datos referidos a personas distintas, y no ha habido requerimiento. Según el artículo 198.1 de esa ley, ¿qué multa le corresponde?"
  options:
  - id: a
    correct: true
    text:
      es: "300 euros, porque 8 datos por 20 euros son 160 euros y debe aplicarse el mínimo."
  - id: b
    text:
      es: "600 euros, porque se duplica el mínimo cuando no se presenta la declaración antes de un requerimiento."
  - id: c
    text:
      es: "200 euros, porque es la multa fija general por no presentar en plazo una declaración."
  - id: d
    text:
      es: "160 euros, porque la multa es de 20 euros por cada dato incluido en la declaración."
  explanation:
    es: "El artículo 198.1 LGT fija 20 euros por dato con un mínimo de 300 euros: 8 × 20 = 160, por debajo del mínimo, así que la multa es de 300 euros. Los 160 ignoran el mínimo. Los 200 euros son la multa de las declaraciones comunes y no hay duplicación del mínimo por faltar el requerimiento."
  citation: "art. 198.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0147
  prompt:
    es: "Gestorías Unidas, S.A. presenta fuera de plazo y sin requerimiento previo una declaración informativa de los artículos 93 y 94 de la Ley 58/2003, de 17 de diciembre, General Tributaria que incluye 2.500 datos referidos a personas distintas. Según el artículo 198 de esa ley, ¿cuál es el límite máximo de la multa que se le puede imponer?"
  options:
  - id: a
    text:
      es: "5.000 euros, porque la multa por dato se reduce a un cuarto cuando no hay requerimiento previo."
  - id: b
    correct: true
    text:
      es: "10.000 euros, porque con presentación espontánea fuera de plazo el límite máximo es la mitad de 20.000."
  - id: c
    text:
      es: "25.000 euros, que resultan de multiplicar 2.500 datos por 10 euros por dato sin límite máximo."
  - id: d
    text:
      es: "20.000 euros, porque el máximo del artículo 198.1 no se reduce aunque se presente espontáneamente y fuera de plazo."
  explanation:
    es: "Con presentación fuera de plazo y sin requerimiento previo, el artículo 198.2 LGT reduce a la mitad la sanción y sus límites. 2.500 datos por 10 euros dan 25.000, pero el máximo pasa de 20.000 a 10.000 euros. No se mantiene el máximo general, no hay ausencia de límite y la reducción es a la mitad, no a un cuarto."
  citation: "art. 198.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0148
  prompt:
    es: "De acuerdo con el artículo 198.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si las autoliquidaciones o declaraciones se presentan fuera de plazo sin requerimiento previo de la Administración tributaria, la sanción y sus límites mínimo y máximo serán:"
  options:
  - id: a
    text:
      es: "Los previstos en el apartado anterior, con el recargo del artículo 27."
  - id: b
    text:
      es: "El doble de los previstos en el apartado anterior, por no presentarlas en plazo."
  - id: c
    correct: true
    text:
      es: "La mitad de los previstos en el apartado anterior."
  - id: d
    text:
      es: "Un tercio de los previstos en el apartado anterior."
  explanation:
    es: "Según el artículo 198.2 LGT, la presentación fuera de plazo sin requerimiento previo reduce a la mitad la sanción y los límites del apartado 1. No es un tercio ni se suma el recargo del artículo 27, y tampoco se duplican."
  citation: "art. 198.2 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0149
  prompt:
    es: "Conforme al artículo 198.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA si se presentan en plazo autoliquidaciones incompletas o inexactas y luego, fuera de plazo y sin requerimiento previo, una autoliquidación complementaria:"
  options:
  - id: a
    text:
      es: "Se produce la infracción del artículo 194, y se sanciona con la mitad de la multa prevista en ese artículo."
  - id: b
    correct: true
    text:
      es: "No se produce la infracción de los artículos 194 o 199 por las presentadas en plazo, y se impone la sanción del propio artículo 198.2."
  - id: c
    text:
      es: "Se produce además la infracción del artículo 199 por las presentadas en plazo, que se acumula con la del artículo 198."
  - id: d
    text:
      es: "No se produce infracción alguna, porque la autoliquidación complementaria extingue toda responsabilidad."
  explanation:
    es: "El artículo 198.2 LGT dispone que no se produce la infracción de los artículos 194 o 199 por las autoliquidaciones presentadas en plazo y que se impone la sanción de ese apartado por lo declarado fuera de plazo. No se acumulan las infracciones y sí hay sanción, aunque más reducida. Tampoco se aplica el artículo 194 con su mitad."
  citation: "art. 198.2 LGT"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0150
  prompt:
    es: "De acuerdo con el artículo 198.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si se hubieran realizado requerimientos, la sanción por no presentar en plazo prevista en el apartado 1 es compatible con la establecida:"
  options:
  - id: a
    text:
      es: "Para la presentación incorrecta de declaraciones, que se acumula en todo caso con la del apartado 1."
  - id: b
    correct: true
    text:
      es: "Para la resistencia, obstrucción, excusa o negativa a las actuaciones de la Administración por desatender los requerimientos."
  - id: c
    text:
      es: "Para el incumplimiento de obligaciones contables y registrales por no atender los requerimientos."
  - id: d
    text:
      es: "Para la solicitud indebida de beneficios fiscales, siempre que se hayan notificado los requerimientos."
  explanation:
    es: "El artículo 198.3 LGT declara compatible la sanción por no presentar en plazo con la del artículo 203, que castiga la resistencia, obstrucción, excusa o negativa por desatender los requerimientos. Las demás infracciones no aparecen como compatibles en ese apartado."
  citation: "art. 198.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0151
  prompt:
    es: "De acuerdo con el artículo 198.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción por no presentar en plazo declaraciones y documentos relacionados con las formalidades aduaneras, cuando no determinen una deuda aduanera, es una multa proporcional:"
  options:
  - id: a
    text:
      es: "Del uno por 1.000 de la deuda aduanera, con un mínimo de 100 euros y un máximo de 6.000 euros."
  - id: b
    text:
      es: "Del uno por 1.000 del valor de las mercancías, con un mínimo de 600 euros y un máximo de 20.000 euros."
  - id: c
    text:
      es: "Del uno por 100 del valor de las mercancías, con un mínimo de 100 euros y un máximo de 6.000 euros."
  - id: d
    correct: true
    text:
      es: "Del uno por 1.000 del valor de las mercancías, con un mínimo de 100 euros y un máximo de 6.000 euros."
  explanation:
    es: "El artículo 198.4 LGT impone el uno por 1.000 del valor de las mercancías con mínimo de 100 y máximo de 6.000 euros. El uno por 100 es diez veces más, el mínimo de 600 euros es solo para la declaración sumaria de entrada y el máximo de 20.000 es el del artículo 198.1. La base es el valor de las mercancías, no una deuda aduanera que, por hipótesis, no se ha producido."
  citation: "art. 198.4 LGT"
  difficulty: 3
  tags:
  - "importe"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0152
  prompt:
    es: "Importaciones Soler, S.L. no presenta en plazo una declaración aduanera que no determina deuda aduanera. El valor de las mercancías a las que se refiere es de 20.000 euros. Según el artículo 198.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué sanción procede?"
  options:
  - id: a
    text:
      es: "20 euros, porque la multa es el uno por 1.000 del valor de las mercancías."
  - id: b
    correct: true
    text:
      es: "100 euros, porque el uno por 1.000 del valor, 20 euros, no alcanza el mínimo."
  - id: c
    text:
      es: "200 euros, porque la multa es el uno por 100 del valor de las mercancías."
  - id: d
    text:
      es: "600 euros, porque se aplica el mínimo previsto para las declaraciones aduaneras."
  explanation:
    es: "El uno por 1.000 de 20.000 euros son 20 euros, menos que el mínimo de 100 euros del artículo 198.4 LGT. La sanción es, por tanto, de 100 euros. El importe de 20 euros ignora el mínimo, el uno por 100 es otro porcentaje y los 600 euros solo se aplican a la declaración sumaria de entrada."
  citation: "art. 198.4 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0153
  prompt:
    es: "Logística Prieto, S.A. no presenta en plazo la declaración sumaria de entrada del artículo 127 del Reglamento (UE) n.º 952/2013 relativa a mercancías de 300.000 euros de valor, sin que nazca deuda aduanera. Según el artículo 198.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué multa corresponde?"
  options:
  - id: a
    text:
      es: "300 euros, porque el uno por 1.000 del valor son 300 euros y supera el mínimo de 100."
  - id: b
    text:
      es: "6.000 euros, porque el máximo se aplica a las declaraciones sumarias de entrada."
  - id: c
    correct: true
    text:
      es: "600 euros, porque el uno por 1.000 del valor son 300 euros y el mínimo se eleva a 600 euros."
  - id: d
    text:
      es: "100 euros, porque el mínimo general es el que se aplica cuando el uno por 1.000 no lo supera."
  explanation:
    es: "El uno por 1.000 de 300.000 euros es 300 euros. Como se trata de la declaración sumaria de entrada, el artículo 198.4 LGT eleva el mínimo a 600 euros, así que esa es la multa. Los 300 euros ignoran el mínimo especial, los 100 son el mínimo general y el máximo de 6.000 no se aplica de forma automática."
  citation: "art. 198.4 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-198
- id: m03-l13-q0154
  prompt:
    es: "Según el artículo 198.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué sanción corresponde a las personas físicas que no realicen actividades económicas por incumplir la obligación de comunicar el domicilio fiscal o su cambio?"
  options:
  - id: a
    text:
      es: "Multa pecuniaria fija de 200 euros, por infracción leve."
  - id: b
    correct: true
    text:
      es: "Multa pecuniaria fija de 100 euros, por infracción leve."
  - id: c
    text:
      es: "Multa pecuniaria fija de 400 euros, por infracción grave."
  - id: d
    text:
      es: "Multa pecuniaria fija de 300 euros, por infracción leve."
  explanation:
    es: "El artículo 198.5 LGT califica esa conducta de infracción leve con multa fija de 100 euros. Los 200 euros son la multa general del apartado 1, los 400 euros las declaraciones censales y los 300 euros el mínimo de las declaraciones informativas. Además, no es una infracción grave."
  citation: "art. 198.5 LGT"
  difficulty: 1
  tags:
