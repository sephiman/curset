- id: m06-l01-q34
  prompt:
    en: In PostgreSQL 18, `VACUUM FULL` compacts a table to remove all dead space. Which statement about running
      it is correct?
  options:
  - id: a
    text:
      en: It compacts the table file in place, so it needs no disk space beyond what the table already uses
  - id: b
    text:
      en: It lets `SELECT`, `INSERT`, `UPDATE` and `DELETE` run normally on the table while it works
  - id: c
    correct: true
    text:
      en: It needs extra disk space for a new copy of the table until the operation completes
  - id: d
    text:
      en: Autovacuum issues it automatically whenever a table has become bloated
  explanation:
    en: '`VACUUM FULL` requires extra disk space for the new copy of the table until the operation completes. Compacting
      in place is wrong because it works by writing a complete new version of the table file with no dead space.
      Normal concurrent use is wrong because `VACUUM FULL` requires an `ACCESS EXCLUSIVE` lock on the table and
      therefore cannot be done in parallel with other use of the table. Automatic runs are wrong because the autovacuum
      daemon will never issue `VACUUM FULL`.'
  citation: pg-routine-vacuuming#VACUUM-FOR-SPACE-RECOVERY; pg-routine-vacuuming#VACUUM-BASICS
  extract:
    en: It also requires extra disk space for the new copy of the table, until the operation completes
- id: m06-l01-q35
  prompt:
    en: In PostgreSQL 18, a table is partitioned and autovacuum is enabled with default settings. How does autovacuum
      treat the partitioned table and its partitions?
  options:
  - id: a
    text:
      en: It processes the partitioned table directly, because a partitioned table stores its own tuples
  - id: b
    text:
      en: It runs `ANALYZE` on the partitioned table, but never runs `VACUUM` on its partitions
  - id: c
    text:
      en: It processes the partitioned table as one unit and leaves its partitions to manual `VACUUM`
  - id: d
    correct: true
    text:
      en: It skips the partitioned table itself but processes each partition like any other table
  explanation:
    en: Partitioned tables do not directly store tuples and consequently are not processed by autovacuum, while
      autovacuum does process their partitions like other tables. The claim that a partitioned table stores its
      own tuples is wrong because partitioned tables do not directly store tuples. The `ANALYZE` claim is wrong
      because autovacuum does not run `ANALYZE` on partitioned tables. Leaving partitions to manual `VACUUM` is
      wrong because autovacuum does process table partitions just like other tables.
  citation: pg-routine-vacuuming#AUTOVACUUM
  extract:
    en: Partitioned tables do not directly store tuples and consequently are not processed by autovacuum
- id: m06-l01-q37
  prompt:
    en: In PostgreSQL 18, a cluster has run for a very long time. How does `VACUUM` protect a table against transaction
      ID wraparound?
  options:
  - id: a
    correct: true
    text:
      en: It marks old rows as frozen, so their inserting transaction counts as committed far enough in the past
        to be visible to everyone
  - id: b
    text:
      en: It resets the XID counter to zero after every run
  - id: c
    text:
      en: It rewrites each row's insertion XID to the current transaction's XID
  - id: d
    text:
      en: It deletes every row version older than two billion transactions
  explanation:
    en: '`VACUUM` marks rows as frozen, indicating they were inserted by a transaction that committed sufficiently
      far in the past to be visible to all current and future transactions. Resetting the counter is wrong because
      the counter wrapping around to zero is the failure itself, which makes past transactions appear to be in the
      future. Rewriting insertion XIDs is wrong because frozen row versions are treated as if the inserting XID
      were `FrozenTransactionId`. Deleting old rows is wrong because frozen row versions stay valid until deleted,
      no matter how long that is.'
  citation: pg-routine-vacuuming#VACUUM-FOR-WRAPAROUND
  extract:
    en: VACUUM will mark rows as frozen
- id: m06-l01-q38
  prompt:
    en: In PostgreSQL 18, how are normal transaction IDs (XIDs) compared with each other when a cluster runs for
      a very long time?
  options:
  - id: a
    text:
      en: As plain 64-bit numbers, so a larger XID is always newer
  - id: b
    text:
      en: As numbers on a line with a start and an endpoint, so older XIDs always sit below newer ones
  - id: c
    correct: true
    text:
      en: With modulo-2^32 arithmetic, so the XID space is circular and each XID has two billion older and two billion
        newer
  - id: d
    text:
      en: By the commit timestamp of the inserting transaction instead of by the XID value
  explanation:
    en: Normal XIDs are compared using modulo-2^32 arithmetic, so for every normal XID there are two billion that
      are older and two billion that are newer. The 64-bit claim is wrong because transaction IDs have limited size,
      32 bits. The line-with-endpoints claim is wrong because the normal XID space is circular with no endpoint.
      The timestamp claim is wrong because a row version whose insertion XID is greater than the current transaction's
      XID is in the future and not visible.
  citation: pg-routine-vacuuming#VACUUM-FOR-WRAPAROUND
  extract:
    en: there are two billion XIDs that are
- id: m06-l01-q39
  prompt:
    en: In PostgreSQL 18, a transaction runs at the Repeatable Read isolation level. At what point is the snapshot
      that all its queries see taken?
  options:
  - id: a
    correct: true
    text:
      en: At the start of the first non-transaction-control statement in the transaction
  - id: b
    text:
      en: At the start of each statement in the transaction, as at Read Committed
  - id: c
    text:
      en: At the moment the transaction commits, so it sees every concurrent commit
  - id: d
    text:
      en: At the first statement that modifies or locks a row of a table
  explanation:
    en: A Repeatable Read query sees a snapshot as of the start of the first non-transaction-control statement in
      the transaction. A snapshot per statement is wrong because successive `SELECT` commands within a single transaction
      see the same data. A snapshot at commit is wrong because the transaction only sees data committed before it
      began. A snapshot at the first modification is wrong because `UPDATE`, `DELETE`, `SELECT FOR UPDATE` and `SELECT
      FOR SHARE` only find target rows committed as of the transaction start time.
  citation: pg-transaction-iso#XACT-REPEATABLE-READ
  extract:
    en: a snapshot as of the start of the first non-transaction-control statement in the transaction
