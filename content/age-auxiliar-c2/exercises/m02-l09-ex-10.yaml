- id: m02-l09-q286
  prompt:
    es: "Señale la función de Microsoft Excel 365 que devuelve el rendimiento de un valor bursátil que paga intereses periódicos, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "INT.ACUM"
  - id: b
    text:
      es: "DISC"
  - id: c
    correct: true
    text:
      es: "RENDTO"
  - id: d
    text:
      es: "PRECIO"
  explanation:
    es: "La página dice que RENDTO devuelve el rendimiento de un valor bursátil que paga intereses periódicos. «DISC»: DISC devuelve la tasa de descuento de un valor bursátil. «INT.ACUM»: INT.ACUM devuelve el interés acumulado, no el rendimiento. «PRECIO»: PRECIO devuelve el precio por un valor nominal de 100 $."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «RENDTO — Devuelve el rendimiento de un valor bursátil que paga intereses periódicos.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q287
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuál de las siguientes afirmaciones describe lo que devuelve la función CUPON.DIAS.L1?"
  options:
  - id: a
    correct: true
    text:
      es: "El número de días desde el principio del período de un cupón hasta la fecha de liquidación"
  - id: b
    text:
      es: "El número de pagos de cupón que quedan entre la fecha de liquidación y la fecha de vencimiento"
  - id: c
    text:
      es: "El número de días del período donde se encuentra la fecha de liquidación"
  - id: d
    text:
      es: "El número de días desde la fecha de liquidación hasta el próximo cupón"
  explanation:
    es: "La página da CUPON.DIAS.L1 como el número de días desde el principio del período del cupón hasta la fecha de liquidación. «El número de días desde la fecha de liquidación hasta el próximo cupón»: esa descripción es la de CUPON.DIAS.L2. «El número de días del período donde se encuentra la fecha de liquidación»: esa descripción es la de la entrada impresa COUPDACUPON.DIAS. «El número de pagos de cupón que quedan entre la fecha de liquidación y la fecha de vencimiento»: esa descripción es la de CUPON.NUM."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «CUPON.DIAS.L1 — Devuelve el número de días desde el principio del período de un cupón hasta la fecha de liquidación.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q288
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuál de las siguientes afirmaciones describe lo que devuelve la función CUPON.DIAS.L2?"
  options:
  - id: a
    text:
      es: "La fecha del próximo cupón después de la liquidación"
  - id: b
    text:
      es: "La fecha de cupón anterior a la liquidación"
  - id: c
    text:
      es: "El número de días desde el principio del período del cupón hasta la liquidación"
  - id: d
    correct: true
    text:
      es: "El número de días desde la fecha de liquidación hasta la fecha del próximo cupón"
  explanation:
    es: "La página da CUPON.DIAS.L2 como el número de días desde la fecha de liquidación hasta el próximo cupón. «El número de días desde el principio del período del cupón hasta la liquidación»: esa descripción es la de CUPON.DIAS.L1. «La fecha del próximo cupón después de la liquidación»: esa descripción es la de CUPON.FECHA.L2. «La fecha de cupón anterior a la liquidación»: esa descripción es la de CUPON.FECHA.L1."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «CUPON.DIAS.L2 — Devuelve el número de días desde la fecha de liquidación hasta la fecha del próximo cupón.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q289
  prompt:
    es: "Señale la función de Microsoft Excel 365 que devuelve el valor neto actual de una inversión a partir de flujos periódicos y una tasa de descuento, según la ayuda de Microsoft:"
  options:
  - id: a
    correct: true
    text:
      es: "VNA"
  - id: b
    text:
      es: "VA"
  - id: c
    text:
      es: "TIR"
  - id: d
    text:
      es: "VF"
  explanation:
    es: "La página dice que VNA devuelve el valor neto actual a partir de una serie de flujos periódicos y una tasa de descuento. «TIR»: TIR devuelve la tasa interna de retorno de una serie de flujos. «VF»: VF devuelve el valor futuro de una inversión. «VA»: VA devuelve el valor presente de una inversión."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones financieras»"
  difficulty: 2
  tags:
  - "función"
