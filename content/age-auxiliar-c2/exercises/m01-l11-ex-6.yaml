# anchor: boe-a-2015-10565-art-48
- id: m01-l11-q029
  prompt:
    es: "¿Cuál de los siguientes vicios determina la anulabilidad, y no la nulidad de pleno derecho, de un acto administrativo según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La lesión de un derecho susceptible de amparo constitucional."
  - id: b
    text:
      es: "Una causa de nulidad que establezca expresamente una ley."
  - id: c
    text:
      es: "El contenido imposible del acto."
  - id: d
    correct: true
    text:
      es: "La desviación de poder."
  explanation:
    es: "El artículo 48.1 hace anulables los actos que incurran en cualquier infracción del ordenamiento jurídico, «incluso la desviación de poder», y el artículo 47.1 no la incluye entre los casos de nulidad. El contenido imposible es nulidad de pleno derecho (art. 47.1.c), igual que la lesión de derechos susceptibles de amparo (art. 47.1.a) y cualquier otro caso que establezca expresamente una disposición con rango de ley (art. 47.1.g)."
  citation: "art. 48.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-52
- id: m01-l11-q030
  prompt:
    es: "Conforme al artículo 52.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, puede convalidar el acto el órgano competente que sea superior jerárquico del que lo dictó cuando el vicio consista en:"
  options:
  - id: a
    text:
      es: "Un contenido imposible para la Administración."
  - id: b
    text:
      es: "La falta de alguna autorización preceptiva."
  - id: c
    text:
      es: "Incompetencia manifiesta por razón de la materia."
  - id: d
    correct: true
    text:
      es: "Incompetencia no determinante de nulidad."
  explanation:
    es: "El artículo 52.3 prevé esta convalidación «si el vicio consistiera en incompetencia no determinante de nulidad». La falta de autorización se convalida con el otorgamiento de la autorización por el órgano competente (art. 52.4). La incompetencia manifiesta por razón de la materia y el contenido imposible hacen el acto nulo de pleno derecho (art. 47.1.b y c), y los actos nulos no se convalidan."
  citation: "art. 52.3 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-98
- id: m01-l11-q058
  prompt:
    es: "Según el artículo 98.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál de las siguientes resoluciones queda exceptuada de la ejecutividad inmediata?"
  options:
  - id: a
    text:
      es: "La resolución sancionadora que ya es firme en vía administrativa."
  - id: b
    text:
      es: "La resolución que deniega una licencia solicitada por el interesado."
  - id: c
    text:
      es: "La resolución que pone fin a un procedimiento de responsabilidad patrimonial."
  - id: d
    correct: true
    text:
      es: "La resolución sancionadora contra la que aún cabe recurso potestativo de reposición."
  explanation:
    es: "El artículo 98.1.b) exceptúa de la ejecutividad inmediata la resolución de un procedimiento de naturaleza sancionadora «contra la que quepa algún recurso en vía administrativa, incluido el potestativo de reposición». La resolución sancionadora ya firme en vía administrativa no admite ese recurso ordinario y es inmediatamente ejecutiva. La denegación de una licencia y la resolución de responsabilidad patrimonial no son sancionadoras, y el artículo 98.1 no las exceptúa."
  citation: "art. 98.1.b) LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10566-art-8
- id: m01-l11-q061
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿puede un órgano administrativo renunciar a la competencia que tiene atribuida?"
  options:
  - id: a
    text:
      es: "Sí, a favor de su superior jerárquico inmediato."
  - id: b
    text:
      es: "Sí, con autorización del titular del departamento."
  - id: c
    correct: true
    text:
      es: "No, porque la competencia es irrenunciable."
  - id: d
    text:
      es: "Sí, cuando la norma de atribución no lo prohíba."
  explanation:
    es: "El artículo 8.1 LRJSP empieza: «La competencia es irrenunciable». No hay excepción a favor del superior, ni con autorización del titular del departamento, ni por silencio de la norma de atribución. Otra cosa es que se delegue o se avoque su ejercicio, que no es renunciar a ella."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-8
- id: m01-l11-q062
  prompt:
    es: "De acuerdo con el artículo 8.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la delegación de competencias, las encomiendas de gestión, la delegación de firma y la suplencia:"
  options:
  - id: a
    text:
      es: "trasladan la titularidad de la competencia al órgano que la ejerce."
  - id: b
    correct: true
    text:
      es: "no suponen alteración de la titularidad de la competencia."
  - id: c
    text:
      es: "alteran la titularidad de la competencia, salvo la delegación de firma."
  - id: d
    text:
      es: "alteran la titularidad de la competencia cuando se publican en el BOE."
  explanation:
    es: "El artículo 8.1 LRJSP dice que esas cuatro figuras «no suponen alteración de la titularidad de la competencia, aunque sí de los elementos determinantes de su ejercicio». La titularidad sigue en el órgano que la tiene atribuida, sea cual sea la figura. No hay excepción para la delegación de firma. La publicación tampoco cambia la titularidad."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l11-q063
  prompt:
    es: "Según el artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, cuando dos órganos de un mismo Ministerio no están relacionados jerárquicamente, ¿quién aprueba previamente la delegación de competencias entre ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "El superior común de ambos órganos."
  - id: b
    text:
      es: "El órgano superior del que dependa el órgano delegado."
  - id: c
    text:
      es: "El Subsecretario del Ministerio al que pertenecen."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro."
  explanation:
    es: "Para órganos no relacionados jerárquicamente, el artículo 9.1 LRJSP exige «la aprobación previa del superior común si ambos pertenecen al mismo Ministerio». El órgano superior del que dependa el órgano delegado es la regla para órganos de diferentes Ministerios. El Subsecretario y el Consejo de Ministros no aparecen en esta regla."
  citation: "art. 9.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l11-q064
  prompt:
    es: "Conforme al artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si el órgano delegante y el delegado, no relacionados jerárquicamente, pertenecen a diferentes Ministerios, la delegación necesita la aprobación previa:"
  options:
  - id: a
    text:
      es: "del Consejo de Ministros, a propuesta de ambos Ministros."
  - id: b
    text:
      es: "de los Subsecretarios de los dos Ministerios, de forma conjunta."
  - id: c
    text:
      es: "de la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "del órgano superior de quien dependa el órgano delegado."
  explanation:
    es: "El artículo 9.1 LRJSP pide la aprobación previa «del órgano superior de quien dependa el órgano delegado, si el delegante y el delegado pertenecen a diferentes Ministerios». Decide el superior del lado que recibe la competencia. Ni el Consejo de Ministros, ni los dos Subsecretarios juntos, ni la Comisión General de Secretarios de Estado y Subsecretarios intervienen en esta aprobación."
  citation: "art. 9.1 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l11-q065
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la delegación de competencias es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Solo cabe en órganos jerárquicamente dependientes del órgano delegante."
  - id: b
    correct: true
    text:
      es: "Cabe en otros órganos de la misma Administración aunque no sean jerárquicamente dependientes."
  - id: c
    text:
      es: "Solo cabe entre órganos que pertenezcan al mismo Ministerio."
  - id: d
    text:
      es: "Solo cabe entre órganos que tengan el mismo rango administrativo."
  explanation:
    es: "El artículo 9.1 LRJSP permite delegar en otros órganos de la misma Administración «aun cuando no sean jerárquicamente dependientes». La dependencia jerárquica no es requisito. El mismo artículo prevé la delegación entre órganos de diferentes Ministerios, así que no se limita a un Ministerio. Tampoco exige igual rango."
  citation: "art. 9.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m01-l11-q066
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en ningún caso podrán ser objeto de delegación las competencias relativas a la resolución de recursos:"
  options:
  - id: a
    text:
      es: "en los órganos superiores jerárquicos de los que dictaron los actos recurridos."
  - id: b
    text:
      es: "en los organismos públicos vinculados o dependientes del órgano delegante."
  - id: c
    correct: true
    text:
      es: "en los órganos administrativos que hayan dictado los actos objeto de recurso."
  - id: d
    text:
      es: "en órganos de un Ministerio distinto de aquel al que pertenece el delegante."
  explanation:
    es: "El artículo 9.2.c) LRJSP prohíbe delegar «la resolución de recursos en los órganos administrativos que hayan dictado los actos objeto de recurso». El límite es que quien dictó el acto no resuelva el recurso contra él. La letra no habla del superior jerárquico, de los organismos públicos ni de órganos de otro Ministerio; el artículo 9.1 permite delegar en los dos últimos."
  citation: "art. 9.2.c) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-9
- id: m01-l11-q067
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las resoluciones adoptadas por delegación es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Se consideran dictadas por el órgano delegante."
  - id: b
    text:
      es: "Se consideran dictadas por el órgano delegado que las firma."
  - id: c
    text:
      es: "Se consideran dictadas por el superior común de ambos órganos."
  - id: d
    text:
      es: "Se consideran dictadas por el órgano que aprobó la delegación."
  explanation:
    es: "El artículo 9.4 LRJSP dice que esas resoluciones «se considerarán dictadas por el órgano delegante». Firma el delegado, pero el acto se imputa al delegante, que sigue siendo el titular de la competencia (artículo 8.1). El superior común y el órgano que aprobó la delegación solo intervienen al aprobarla."
  citation: "art. 9.4 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10566-art-14
- id: m01-l11-q069
  prompt:
    es: "Conforme al artículo 14.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el órgano administrativo que se estime incompetente para la resolución de un asunto:"
  options:
  - id: a
    text:
      es: "devolverá la solicitud al interesado y le indicará cuál es el órgano que considera competente."
  - id: b
    correct: true
    text:
      es: "remitirá directamente las actuaciones al órgano que considere competente y lo notificará a los interesados."
  - id: c
    text:
      es: "elevará las actuaciones a su superior jerárquico para que este decida qué órgano es el competente."
  - id: d
    text:
      es: "declarará inadmisible la solicitud y archivará las actuaciones, sin necesidad de notificarlo."
  explanation:
    es: "El artículo 14.1 LRJSP dice que ese órgano «remitirá directamente las actuaciones al órgano que considere competente, debiendo notificar esta circunstancia a los interesados». No devuelve la solicitud ni la inadmite: el interesado no tiene que empezar de nuevo. Tampoco eleva el asunto a su superior; la remisión es directa al órgano que considera competente."
  citation: "art. 14.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-14
- id: m01-l11-q070
  prompt:
    es: "Según el artículo 14.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué pueden hacer los interesados que sean parte si creen que el órgano que conoce del asunto no es competente?"
  options:
  - id: a
    text:
      es: "Interponer recurso de alzada contra el acuerdo de iniciación dictado por ese órgano."
  - id: b
    text:
      es: "Plantear un conflicto de atribuciones entre los dos órganos ante el Consejo de Ministros."
  - id: c
    text:
      es: "Pedir la suspensión del procedimiento hasta que dictamine el Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Pedir a ese órgano que decline su competencia y remita las actuaciones al competente."
  explanation:
    es: "El artículo 14.2 LRJSP permite a los interesados «dirigirse al órgano que se encuentre conociendo de un asunto para que decline su competencia y remita las actuaciones al órgano competente», o al que estimen competente para que requiera de inhibición. El artículo no les da un recurso de alzada contra la iniciación, ni un conflicto de atribuciones ante el Consejo de Ministros, ni una suspensión pendiente de dictamen del Consejo de Estado."
  citation: "art. 14.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-14
- id: m01-l11-q071
  prompt:
    es: "De acuerdo con el artículo 14.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los interesados que sean parte en el procedimiento podrán dirigirse al órgano que estimen competente para que:"
  options:
  - id: a
    correct: true
    text:
      es: "requiera de inhibición al órgano que esté conociendo del asunto."
  - id: b
    text:
      es: "avoque para sí el conocimiento del asunto que tramita el otro órgano."
  - id: c
    text:
      es: "declare la nulidad de lo actuado por el órgano que conoce del asunto."
  - id: d
    text:
      es: "delegue en el órgano que conoce del asunto la competencia para resolverlo."
  explanation:
    es: "El artículo 14.2 LRJSP dice que los interesados «podrán dirigirse al órgano que estimen competente para que requiera de inhibición al que esté conociendo del asunto». Avocar para sí el asunto es otra figura: según el artículo 10.1, la avocación la ejercen los órganos superiores sobre asuntos de sus órganos dependientes. Declarar la nulidad de lo actuado no figura en las dos peticiones que el artículo 14.2 permite: declinar competencia y requerir de inhibición. Delegar la competencia en el órgano que conoce del asunto no es una de ellas: lo que se pide al órgano que se estima competente es que reclame el asunto."
  citation: "art. 14.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
