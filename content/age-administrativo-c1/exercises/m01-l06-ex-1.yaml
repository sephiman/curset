# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q001
  prompt:
    es: "¿Qué texto define el Gobierno Abierto como «una cultura de gobernanza que promueve los principios de transparencia, integridad, rendición de cuentas y participación de las partes interesadas»?"
  options:
  - id: a
    text:
      es: "La Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015."
  - id: b
    correct: true
    text:
      es: "La Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017."
  - id: c
    text:
      es: "La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno."
  - id: d
    text:
      es: "El IV Plan de Gobierno Abierto de España 2020-2024, aprobado en octubre de 2020."
  explanation:
    es: "La definición es de la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017, y el Portal de la Transparencia la recoge citándola. La Resolución 70/1 aprueba la Agenda 2030 y no define el Gobierno Abierto. La Ley 19/2013 regula la transparencia, el acceso a la información y el buen gobierno, pero no da esta definición. El IV Plan es un plan de acción de España, no la fuente de la definición."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q002
  prompt:
    es: "La Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017, define el Gobierno Abierto como una cultura de gobernanza que promueve sus principios:"
  options:
  - id: a
    text:
      es: "En apoyo de la eficacia administrativa y la estabilidad presupuestaria."
  - id: b
    text:
      es: "En apoyo del desarrollo sostenible y la cooperación internacional."
  - id: c
    text:
      es: "En apoyo de la seguridad jurídica y la simplificación administrativa."
  - id: d
    correct: true
    text:
      es: "En apoyo de la democracia y el crecimiento inclusivo."
  explanation:
    es: "La definición termina «en apoyo de la democracia y el crecimiento inclusivo». La eficacia administrativa, la estabilidad presupuestaria, el desarrollo sostenible, la cooperación internacional, la seguridad jurídica y la simplificación administrativa no aparecen en ella."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
