# anchor: boe-a-2003-23186-art-123
- id: m03-l07-q0006
  prompt:
    es: "¿Cuál de los siguientes es un procedimiento de gestión tributaria, según el artículo 123.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El procedimiento iniciado mediante declaración."
  - id: b
    text:
      es: "El procedimiento sancionador en materia tributaria."
  - id: c
    text:
      es: "El procedimiento de inspección de los tributos."
  - id: d
    text:
      es: "El procedimiento administrativo de apremio."
  explanation:
    es: "El artículo 123.1.b) cuenta entre los procedimientos de gestión el iniciado mediante declaración. El sancionador, el de apremio y el de inspección tienen su propio capítulo o título en la ley y no figuran en esa lista."
  citation: "art. 123.1 LGT"
  difficulty: 1
  tags:
  - "procedimientos"
# anchor: boe-a-2003-23186-art-123
- id: m03-l07-q0007
  prompt:
    es: "Según el artículo 123.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son procedimientos de gestión tributaria, entre otros, el de devolución iniciado mediante autoliquidación, solicitud o comunicación de datos, el de verificación de datos, el de comprobación limitada y:"
  options:
  - id: a
    text:
      es: "el procedimiento de rectificación de errores materiales de la inspección."
  - id: b
    text:
      es: "el procedimiento de comprobación de domicilio fiscal en el ámbito aduanero."
  - id: c
    correct: true
    text:
      es: "el procedimiento de comprobación de valores."
  - id: d
    text:
      es: "el procedimiento de cuenta corriente tributaria de oficio."
  explanation:
    es: "La comprobación de valores es el cuarto procedimiento que enumera el artículo 123.1.d). Los demás no figuran en esa lista: el artículo solo recoge cinco procedimientos y deja otros a lo que regule el reglamento."
  citation: "art. 123.1 LGT"
  difficulty: 2
  tags:
  - "procedimientos"
# anchor: boe-a-2003-23186-art-123
- id: m03-l07-q0082
  prompt:
    es: "De acuerdo con el artículo 123.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de devolución, como procedimiento de gestión tributaria, es el que se inicia mediante:"
  options:
  - id: a
    text:
      es: "autoliquidación, declaración complementaria o requerimiento."
  - id: b
    text:
      es: "solicitud, acta de inspección o comunicación de datos."
  - id: c
    correct: true
    text:
      es: "autoliquidación, solicitud o comunicación de datos."
  - id: d
    text:
      es: "requerimiento, propuesta de liquidación o comunicación de inicio."
  explanation:
    es: "El procedimiento de devolución se inicia por autoliquidación, solicitud o comunicación de datos (art. 123.1.a). Un requerimiento, una propuesta de liquidación o una comunicación de inicio no lo inician, y las declaraciones complementarias o las actas de inspección tampoco."
  citation: "art. 123.1 LGT"
  difficulty: 1
  tags:
  - "procedimientos"
  - "devoluciones"
# anchor: boe-a-2003-23186-art-31
- id: m03-l07-q0009
  prompt:
    es: "De acuerdo con el artículo 31.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son devoluciones derivadas de la normativa de cada tributo las correspondientes a cantidades ingresadas o soportadas debidamente como consecuencia de:"
  options:
  - id: a
    correct: true
    text:
      es: "la aplicación del tributo."
  - id: b
    text:
      es: "un ingreso duplicado o excesivo realizado por el obligado tributario."
  - id: c
    text:
      es: "la anulación de la deuda por una resolución estimatoria de un recurso."
  - id: d
    text:
      es: "un error de la Administración tributaria al practicar la liquidación."
  explanation:
    es: "El artículo 31.1 limita estas devoluciones a lo ingresado o soportado debidamente por aplicar el tributo. Lo ingresado indebidamente, como un pago duplicado o excesivo, sigue el régimen del artículo 32. El error de la Administración y la anulación por recurso tampoco son el supuesto del apartado 1."
  citation: "art. 31.1 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
# anchor: boe-a-2003-23186-art-31
- id: m03-l07-q0011
  prompt:
    es: "Según el artículo 31.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, transcurrido el plazo de la normativa del tributo y, en todo caso, el de seis meses sin ordenar el pago de la devolución por causa imputable a la Administración, el interés de demora se devenga hasta:"
  options:
  - id: a
    text:
      es: "la fecha en que se notifique al obligado tributario el acuerdo de devolución."
  - id: b
    text:
      es: "la fecha en que el obligado tributario reciba la transferencia bancaria."
  - id: c
    correct: true
    text:
      es: "la fecha en que se ordene el pago de la devolución."
  - id: d
    text:
      es: "la fecha en que el obligado tributario reclame por escrito el pago de la devolución."
  explanation:
    es: "El artículo 31.2 fija el final del devengo en la fecha en que se ordene el pago. La recepción de la transferencia y la notificación del acuerdo son hechos posteriores o distintos, y la ley no exige reclamación alguna del obligado: el interés se abona sin necesidad de que lo solicite."
  citation: "art. 31.2 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
# anchor: boe-a-2003-23186-art-31
- id: m03-l07-q0012
  prompt:
    es: "De acuerdo con el artículo 31.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el interés de demora de las devoluciones derivadas de la normativa del tributo:"
  options:
  - id: a
    text:
      es: "El obligado tributario debe solicitarlo expresamente tras el vencimiento del plazo para que se abone."
  - id: b
    correct: true
    text:
      es: "La Administración lo abona sin necesidad de que el obligado lo solicite, si no ordenó el pago en plazo por causa que le es imputable."
  - id: c
    text:
      es: "Se abona aunque la demora en ordenar el pago se deba a una causa no imputable a la Administración."
  - id: d
    text:
      es: "Se calcula desde la fecha de presentación de la autoliquidación, aunque el plazo para devolver no haya vencido."
  explanation:
    es: "El artículo 31.2 impone el abono del interés sin necesidad de solicitud cuando el pago no se ordena por causa imputable a la Administración. La causa no imputable no genera interés. Y el devengo empieza al terminar el plazo, no cuando se presenta la autoliquidación."
  citation: "art. 31.2 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
# anchor: boe-a-2003-23186-art-31
- id: m03-l07-q0013
  prompt:
    es: "Conforme al artículo 31.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a efectos del cálculo de los intereses de demora de una devolución derivada de la normativa del tributo, no se computarán:"
  options:
  - id: a
    text:
      es: "los días en que el obligado tributario no tenga a su disposición el importe devuelto."
  - id: b
    text:
      es: "los seis meses posteriores a la presentación de la autoliquidación o de la solicitud."
  - id: c
    correct: true
    text:
      es: "las dilaciones en el procedimiento por causa no imputable a la Administración."
  - id: d
    text:
      es: "las dilaciones en el procedimiento por causa imputable a la Administración tributaria."
  explanation:
    es: "Solo las dilaciones por causa no imputable a la Administración quedan fuera del cálculo del interés. Las que imputa a la Administración sí cuentan. Los seis meses son el plazo tras el cual nace el interés, no un periodo excluido de su cálculo, y el precepto no menciona la disponibilidad del importe por el obligado."
  citation: "art. 31.2 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
  - "dilaciones"
# anchor: boe-a-2003-23186-art-124
- id: m03-l07-q0014
  prompt:
    es: "De acuerdo con el artículo 124 de la Ley 58/2003, de 17 de diciembre, General Tributaria, según se establezca en la normativa reguladora de cada tributo, el procedimiento de devolución se iniciará mediante una autoliquidación de la que resulte cantidad a devolver, una solicitud de devolución o:"
  options:
  - id: a
    text:
      es: "un requerimiento de la Administración tributaria."
  - id: b
    text:
      es: "una declaración complementaria con resultado a ingresar."
  - id: c
    text:
      es: "una propuesta de liquidación notificada de oficio."
  - id: d
    correct: true
    text:
      es: "una comunicación de datos."
  explanation:
    es: "El artículo 124 prevé tres vías de inicio: autoliquidación con cantidad a devolver, solicitud de devolución y comunicación de datos. Un requerimiento, una propuesta de liquidación y una declaración complementaria con resultado a ingresar no inician el procedimiento de devolución."
  citation: "art. 124 LGT"
  difficulty: 1
  tags:
  - "devoluciones"
  - "iniciación"
# anchor: boe-a-2007-15984-art-123
- id: m03-l07-q0015
  prompt:
    es: "Según el artículo 123 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la iniciación del procedimiento para la práctica de devoluciones derivadas de la normativa de cada tributo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se inicia a instancia del obligado tributario, de acuerdo con lo dispuesto en la normativa reguladora de cada tributo."
  - id: b
    text:
      es: "Se inicia siempre de oficio por la Administración tributaria, que reconoce la devolución sin solicitud."
  - id: c
    text:
      es: "Se inicia a instancia del obligado tributario, solo mediante solicitud presentada en las oficinas."
  - id: d
    text:
      es: "Se inicia por acuerdo del órgano competente cuando existan datos suficientes en poder de la Administración tributaria y se notifica al obligado."
  explanation:
    es: "El artículo 123 sitúa el origen del procedimiento en el obligado tributario, por autoliquidación, solicitud o comunicación de datos según lo que disponga cada tributo. No es de oficio, y la solicitud no es la única vía ni se limita a las oficinas."
  citation: "art. 123 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "iniciación"
# anchor: boe-a-2003-23186-art-125
- id: m03-l07-q0016
  prompt:
    es: "Según el artículo 125.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando de una autoliquidación presentada dentro de plazo resulte cantidad a devolver, el plazo establecido para efectuar la devolución comenzará a contarse desde:"
  options:
  - id: a
    text:
      es: "el inicio del plazo previsto para la presentación de la autoliquidación por el obligado."
  - id: b
    correct: true
    text:
      es: "la finalización del plazo previsto para la presentación de la autoliquidación."
  - id: c
    text:
      es: "el día siguiente a la presentación efectiva de la autoliquidación."
  - id: d
    text:
      es: "la fecha del requerimiento de la Administración tributaria al obligado."
  explanation:
    es: "El plazo para devolver se cuenta desde que termina el plazo de presentación, no desde la presentación efectiva ni desde su inicio. Solo si la autoliquidación se presenta fuera de plazo se cuenta desde su presentación. Ningún requerimiento marca el comienzo."
  citation: "art. 125.2 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "cómputo"
# anchor: boe-a-2003-23186-art-125
- id: m03-l07-q0017
  prompt:
    es: "De acuerdo con el artículo 125.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los supuestos de presentación fuera de plazo de autoliquidaciones de las que resulte una cantidad a devolver, el plazo para devolver se contará a partir de:"
  options:
  - id: a
    text:
      es: "la finalización del plazo previsto para su presentación en periodo voluntario."
  - id: b
    correct: true
    text:
      es: "la presentación de la autoliquidación extemporánea."
  - id: c
    text:
      es: "el requerimiento que, en su caso, haga la Administración tributaria."
  - id: d
    text:
      es: "la notificación de la liquidación provisional que practique la Administración."
  explanation:
    es: "Si la autoliquidación es extemporánea, el plazo para devolver se cuenta desde su presentación. La finalización del plazo de presentación es el punto de partida solo para las presentadas en plazo. La liquidación provisional y el requerimiento no marcan el inicio."
  citation: "art. 125.2 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "cómputo"
# anchor: boe-a-2003-23186-art-126
- id: m03-l07-q0019
  prompt:
    es: "De acuerdo con el artículo 126.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando así lo señale la normativa tributaria, los obligados tributarios que no tengan obligación de presentar autoliquidación inician el procedimiento de devolución mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "la presentación de una comunicación de datos."
  - id: b
    text:
      es: "la presentación de una solicitud de rectificación."
  - id: c
    text:
      es: "la presentación de una autoliquidación complementaria."
  - id: d
    text:
      es: "la notificación de una propuesta de liquidación por la Administración."
  explanation:
    es: "Los obligados que no tienen que presentar autoliquidación usan la comunicación de datos. Los demás se presentan con solicitud ante la Administración. La autoliquidación complementaria, la solicitud de rectificación y la propuesta de liquidación son figuras distintas."
  citation: "art. 126.1 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "iniciación"
# anchor: boe-a-2003-23186-art-126
- id: m03-l07-q0020
  prompt:
    es: "Según el artículo 126.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de devolución iniciado mediante solicitud o comunicación de datos se regulará por:"
  options:
  - id: a
    text:
      es: "las normas que fije el obligado tributario en su solicitud."
  - id: b
    text:
      es: "las instrucciones que apruebe el órgano de gestión competente."
  - id: c
    correct: true
    text:
      es: "las normas propias de cada tributo."
  - id: d
    text:
      es: "las normas comunes de la Ley General Tributaria únicamente."
  explanation:
    es: "El artículo 126.3 remite a las normas propias de cada tributo. La ley no habla de instrucciones del órgano de gestión ni deja la regulación al criterio de la solicitud, y tampoco la limita a sus normas comunes."
  citation: "art. 126.3 LGT"
  difficulty: 1
  tags:
  - "devoluciones"
# anchor: boe-a-2007-15984-art-124
- id: m03-l07-q0021
  prompt:
    es: "De acuerdo con el artículo 124.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si la autoliquidación, solicitud o comunicación de datos fuese formalmente correcta, la Administración procederá sin más trámite y, en su caso, de manera automatizada, al:"
  options:
  - id: a
    text:
      es: "requerimiento de documentación complementaria al obligado tributario."
  - id: b
    text:
      es: "archivo de las actuaciones por falta de objeto."
  - id: c
    text:
      es: "inicio de un procedimiento de verificación de datos."
  - id: d
    correct: true
    text:
      es: "reconocimiento de la devolución solicitada."
  explanation:
    es: "Una documentación formalmente correcta, contrastada con los datos de la Administración, lleva al reconocimiento de la devolución sin más trámite y, si procede, de forma automatizada (art. 124.1). La verificación de datos y el requerimiento son pasos para cuando se aprecian defectos o discrepancias, y no hay archivo por falta de objeto."
  citation: "art. 124.1 RGAT"
  difficulty: 1
  tags:
  - "devoluciones"
  - "tramitación"
# anchor: boe-a-2007-15984-art-124
- id: m03-l07-q0022
  prompt:
    es: "Conforme al artículo 124.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando se aprecie un defecto formal, un error aritmético o una posible discrepancia en los datos de una autoliquidación con devolución, se podrá iniciar un procedimiento de:"
  options:
  - id: a
    text:
      es: "verificación de datos, de comprobación de valores o de inspección."
  - id: b
    correct: true
    text:
      es: "verificación de datos, de comprobación limitada o de inspección."
  - id: c
    text:
      es: "verificación de datos, de comprobación limitada o sancionador."
  - id: d
    text:
      es: "comprobación limitada, de tasación pericial contradictoria o de inspección."
  explanation:
    es: "El artículo 124.2 abre tres vías: verificación de datos, comprobación limitada o inspección. La comprobación de valores y la tasación pericial contradictoria atienden a la valoración de bienes, y el procedimiento sancionador no es un procedimiento de aplicación de los tributos para comprobar la devolución."
  citation: "art. 124.2 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "tramitación"
# anchor: boe-a-2003-23186-art-127
- id: m03-l07-q0024
  prompt:
    es: "De acuerdo con el artículo 127 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el interés de demora cuando el procedimiento de devolución termina por el inicio de otro procedimiento de comprobación:"
  options:
  - id: a
    correct: true
    text:
      es: "Se mantiene la obligación de satisfacer el interés de demora sobre la devolución que finalmente se pueda practicar, conforme al artículo 31."
  - id: b
    text:
      es: "El interés de demora solo se devenga si el obligado lo reclama antes de la terminación del nuevo procedimiento."
  - id: c
    text:
      es: "La obligación de satisfacer el interés de demora se extingue al iniciarse el nuevo procedimiento."
  - id: d
    text:
      es: "El interés de demora se calcula sobre el importe solicitado, aunque la devolución final sea menor."
  explanation:
    es: "El artículo 127 conserva el interés de demora sobre la devolución que finalmente pueda practicarse. No se extingue con el nuevo procedimiento, no se calcula sobre lo solicitado sino sobre lo devuelto, y no depende de reclamación alguna del obligado."
  citation: "art. 127 LGT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0025
  prompt:
    es: "¿Cuándo se entiende notificado el acuerdo que reconoce el derecho a la devolución solicitada, según el artículo 125.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Al día siguiente de dictarse el acuerdo por el órgano competente."
  - id: b
    correct: true
    text:
      es: "Con la recepción de la transferencia bancaria o, en su caso, del cheque."
  - id: c
    text:
      es: "Cuando el obligado comparece en las oficinas de la Administración para recogerlo."
  - id: d
    text:
      es: "Al publicarse el acuerdo en la sede electrónica de la Agencia Tributaria."
  explanation:
    es: "El acuerdo de devolución se entiende notificado por la recepción de la transferencia o, en su caso, del cheque (art. 125.1). No hay comparecencia ni publicación, y el simple dictado del acuerdo no lo notifica."
  citation: "art. 125.1 RGAT"
  difficulty: 1
  tags:
  - "devoluciones"
  - "notificación"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0026
  prompt:
    es: "Conforme al artículo 125.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el reconocimiento de la devolución solicitada:"
  options:
  - id: a
    correct: true
    text:
      es: "No impide la posterior comprobación de la obligación tributaria mediante los procedimientos de comprobación o investigación."
  - id: b
    text:
      es: "Solo permite una posterior comprobación mediante el procedimiento de inspección."
  - id: c
    text:
      es: "Convierte en definitiva la liquidación resultante del procedimiento de devolución."
  - id: d
    text:
      es: "Impide la posterior comprobación de la obligación tributaria, salvo que aparezcan nuevos hechos."
  explanation:
    es: "El reconocimiento de la devolución no impide comprobar después la obligación tributaria, ni por la inspección únicamente ni con efectos de liquidación definitiva. La salvedad de los nuevos hechos pertenece a otros preceptos, como el artículo 140.1 de la ley para la comprobación limitada."
  citation: "art. 125.1 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "comprobación posterior"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0027
  prompt:
    es: "De acuerdo con el artículo 125.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando se abonen intereses de demora conforme al artículo 31.2 de la Ley General Tributaria, la base sobre la que se aplica el tipo de interés tiene como límite:"
  options:
  - id: a
    text:
      es: "el importe de la devolución reconocida por la Administración tributaria."
  - id: b
    text:
      es: "el importe de la cuota líquida resultante de la autoliquidación presentada por el obligado en el periodo de liquidación."
  - id: c
    correct: true
    text:
      es: "el importe de la devolución solicitada en la autoliquidación, comunicación de datos o solicitud."
  - id: d
    text:
      es: "el importe de las retenciones e ingresos a cuenta soportados en el periodo."
  explanation:
    es: "El límite de la base del interés es lo que el obligado solicitó en su autoliquidación, comunicación de datos o solicitud. Lo reconocido por la Administración es el límite en la rectificación de autoliquidaciones, no aquí. La cuota líquida y las retenciones no marcan ese límite."
  citation: "art. 125.2 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0028
  prompt:
    es: "Según el artículo 125.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si el procedimiento de devolución termina por el inicio de otro procedimiento de comprobación, este determinará la procedencia e importe de la devolución y, en su caso:"
  options:
  - id: a
    text:
      es: "el carácter definitivo de la devolución acordada."
  - id: b
    text:
      es: "la sanción tributaria que corresponda por la solicitud presentada."
  - id: c
    text:
      es: "el interés legal del dinero aplicable a la devolución."
  - id: d
    correct: true
    text:
      es: "otros aspectos de la situación tributaria del obligado."
  explanation:
    es: "El procedimiento que sustituye al de devolución determina la procedencia y el importe de lo que se devuelve y, en su caso, otros aspectos de la situación tributaria del obligado (art. 125.3). La sanción, el interés legal y el carácter definitivo no los atribuye ese apartado."
  citation: "art. 125.3 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "terminación"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0029
  prompt:
    es: "De acuerdo con el artículo 125.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si se acuerda la devolución en un procedimiento de verificación de datos o de comprobación limitada, a efectos de los intereses de demora no se computarán:"
  options:
  - id: a
    text:
      es: "los meses transcurridos desde la presentación de la autoliquidación hasta el inicio de dichos procedimientos."
  - id: b
    correct: true
    text:
      es: "los periodos de dilación por causa no imputable a la Administración que se produzcan en el curso de dichos procedimientos."
  - id: c
    text:
      es: "los periodos de dilación por causa imputable a la Administración que se produzcan en el curso de dichos procedimientos o con anterioridad a su inicio."
  - id: d
    text:
      es: "los días en que dichos procedimientos permanezcan suspendidos por resolución de un recurso."
  explanation:
    es: "Solo se descuentan las dilaciones no imputables a la Administración que ocurren dentro del procedimiento de verificación o de comprobación limitada. Las imputables a ella cuentan. Los meses anteriores al inicio y la suspensión por recurso no se excluyen en este apartado."
  citation: "art. 125.4 RGAT"
  difficulty: 2
  tags:
  - "devoluciones"
  - "interés de demora"
  - "dilaciones"
# anchor: boe-a-2007-15984-art-125
- id: m03-l07-q0033
  prompt:
    es: "Rosa Calvo solicita en su autoliquidación del IRPF de 2024 una devolución de 400 euros. La Administración tramita una comprobación limitada y acuerda una devolución de 650 euros, con retraso imputable a ella, y el obligado reclama el interés de demora. Según el artículo 125.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿sobre qué importe se aplica el tipo de interés?"
  options:
  - id: a
    text:
      es: "Sobre 1.050 euros, que es la suma de lo solicitado y lo acordado."
  - id: b
    correct: true
    text:
      es: "Sobre 400 euros, que es el límite del importe solicitado en la autoliquidación."
  - id: c
    text:
      es: "Sobre 650 euros, que es la devolución finalmente acordada."
  - id: d
    text:
      es: "Sobre 250 euros, que es la diferencia entre lo acordado por la Administración y lo solicitado."
  explanation:
    es: "El interés no puede calcularse sobre más de lo solicitado: el límite es el importe pedido en la autoliquidación, 400 euros (art. 125.2 RGAT). Los 650 euros acordados lo superan. La diferencia de 250 euros y la suma de ambos importes no son base alguna del interés."
  citation: "art. 125.2 RGAT"
  difficulty: 3
  tags:
  - "devoluciones"
  - "interés de demora"
  - "cómputo"
# anchor: boe-a-2003-23186-art-31
- id: m03-l07-q0085
  prompt:
    es: "Según el artículo 31.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria devolverá las cantidades que procedan de acuerdo con lo previsto en:"
  options:
  - id: a
    correct: true
    text:
      es: "la normativa de cada tributo."
  - id: b
    text:
      es: "el acuerdo de la Dirección General de Tributos sobre cada caso."
  - id: c
    text:
      es: "la normativa de recaudación y su reglamento de desarrollo."
  - id: d
    text:
      es: "la solicitud que presente el obligado ante el órgano competente."
  explanation:
    es: "Las devoluciones se rigen por la normativa de cada tributo (art. 31.1). Ni la normativa de recaudación, ni la sola solicitud del obligado, ni un acuerdo de la Dirección General de Tributos las determinan."
  citation: "art. 31.1 LGT"
  difficulty: 1
  tags:
  - "devoluciones"
# anchor: boe-a-2007-15984-art-124
- id: m03-l07-q0100
  prompt:
    es: "¿Qué hace la Administración al recibir una autoliquidación, solicitud o comunicación de datos de la que resulta una devolución, según el artículo 124.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Reconoce la devolución sin examinar la documentación, que comprueba después de pagar."
  - id: b
    text:
      es: "Inicia siempre un procedimiento de verificación de datos antes de reconocer cualquier devolución solicitada."
  - id: c
    correct: true
    text:
      es: "Examina la documentación presentada y la contrasta con los datos y antecedentes que obren en su poder."
  - id: d
    text:
      es: "Notifica una propuesta de resolución para que el obligado alegue antes de cualquier examen."
  explanation:
    es: "La Administración examina la documentación y la contrasta con sus datos y antecedentes (art. 124.1 RGAT). No abre siempre una verificación, no paga sin examinar y no abre alegaciones antes de examinar."
  citation: "art. 124.1 RGAT"
  difficulty: 1
  tags:
  - "devoluciones"
  - "tramitación"
