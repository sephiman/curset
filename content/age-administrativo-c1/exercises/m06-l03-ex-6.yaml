  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m06-l03-q216
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas de Configuración muestra el nombre del dispositivo y, justo debajo, el nombre del modelo?"
  options:
  - id: a
    correct: true
    text:
      es: "Configuración › Sistema › Acerca de"
  - id: b
    text:
      es: "Configuración › Sistema › Almacenamiento"
  - id: c
    text:
      es: "Configuración › Sistema › Notificaciones"
  - id: d
    text:
      es: "Configuración › Accesibilidad › Lupa"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en Inicio, se elige Configuración de Windows, Sistema y Acerca de, y que el nombre del dispositivo aparece en la página con el nombre del modelo debajo. Almacenamiento muestra el espacio en disco, Notificaciones gestiona los avisos y Accesibilidad › Lupa sirve para ampliar la pantalla."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Cuál es el nombre y el modelo de mi dispositivo?»"
