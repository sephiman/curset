# anchor: fuente-transparencia-v-plan-html
- id: m01-l06-q028
  prompt:
    es: "¿Cuál de los siguientes Planes de Gobierno Abierto de España abarca el periodo 2025-2029, según el Portal de la Transparencia?"
  options:
