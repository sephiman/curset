# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0238
  prompt:
    es: "Señale la respuesta CORRECTA sobre los intereses en la devolución de ingresos indebidos, de acuerdo con el artículo 221.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "En la devolución de ingresos indebidos se liquidan intereses de demora."
  - id: b
    text:
      es: "En la devolución de ingresos indebidos se liquida un recargo del 5 por ciento sobre la cantidad devuelta."
  - id: c
    text:
      es: "En la devolución de ingresos indebidos se liquidan solo intereses legales del dinero, sin recargo alguno."
  - id: d
    text:
      es: "En la devolución de ingresos indebidos no se liquida interés alguno, pues solo se restituye la cantidad ingresada."
  explanation:
    es: "En la devolución de ingresos indebidos se liquidan intereses de demora, de acuerdo con el artículo 32.2 (art. 221.5). No es cierto que se restituya solo el principal, porque la norma manda liquidar intereses. Tampoco se liquidan solo intereses legales: el artículo habla de intereses de demora. Y el recargo del 5 por ciento es una figura del período ejecutivo y de la declaración extemporánea, no de la devolución de ingresos indebidos."
  citation: "art. 221.5 LGT"
  difficulty: 3
  tags:
  - "devolución de ingresos indebidos"
  - "intereses de demora"
# anchor: boe-a-2003-23186-art-222
- id: m03-l14-q0062
  prompt:
    es: "Según el artículo 222.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recurso de reposición contra los actos de la Administración tributaria susceptibles de reclamación económico-administrativa tiene carácter:"
  options:
  - id: a
    text:
      es: "Subsidiario respecto de la reclamación económico-administrativa."
  - id: b
    text:
      es: "Excepcional y de aplicación restringida."
  - id: c
    correct: true
    text:
      es: "Potestativo, de modo que el interesado puede elegir no interponerlo."
  - id: d
    text:
      es: "Obligatorio en todo caso, antes de cualquier otra vía."
  explanation:
    es: "El artículo 222.1 habla de recurso potestativo de reposición: el interesado puede elegirlo o ir directamente a la reclamación económico-administrativa. No es obligatorio, ni subsidiario de la reclamación, ni excepcional."
  citation: "art. 222.1 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "naturaleza"
# anchor: boe-a-2003-23186-art-222
- id: m03-l14-q0063
  prompt:
    es: "En relación con el recurso de reposición y el artículo 222.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Debe interponerse con carácter previo al recurso de alzada ordinario ante el Tribunal Económico-Administrativo Central."
  - id: b
    text:
      es: "Debe interponerse, en su caso, con carácter posterior a la reclamación económico-administrativa."
  - id: c
    correct: true
    text:
      es: "Debe interponerse, en su caso, con carácter previo a la reclamación económico-administrativa."
  - id: d
    text:
      es: "Debe interponerse siempre simultáneamente con la reclamación económico-administrativa."
  explanation:
    es: "La reposición, si el interesado la elige, va antes de la reclamación económico-administrativa (art. 222.2). No es posterior ni simultánea: la simultaneidad se resuelve tramitando solo el primero presentado. Y no condiciona el alzada ordinario, que se dirige contra resoluciones de tribunales regionales y locales."
  citation: "art. 222.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "orden"
# anchor: boe-a-2003-23186-art-222
- id: m03-l14-q0064
  prompt:
    es: "De acuerdo con el artículo 222.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el interesado interpone recurso de reposición, no puede promover la reclamación económico-administrativa hasta que el recurso se haya resuelto de forma expresa o hasta que pueda considerarlo desestimado por:"
  options:
  - id: a
    text:
      es: "Transcurso de un plazo de cuatro años."
  - id: b
    text:
      es: "Acuerdo del tribunal económico-administrativo competente."
  - id: c
    correct: true
    text:
      es: "Silencio administrativo, una vez transcurrido el plazo."
  - id: d
    text:
      es: "Renuncia del órgano que dictó el acto recurrido."
  explanation:
    es: "La espera termina con la resolución expresa o con la desestimación por silencio administrativo (art. 222.2). No hace falta acuerdo del tribunal, ni hay plazo de cuatro años, ni depende de una renuncia del órgano que dictó el acto."
  citation: "art. 222.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "reclamación"
# anchor: boe-a-2003-23186-art-222
- id: m03-l14-q0065
  prompt:
    es: "Si en el plazo para recurrir se interponen recurso de reposición y reclamación económico-administrativa contra el mismo acto, ¿qué se declara respecto del presentado en segundo lugar, según el artículo 222.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que se tramita con carácter subsidiario."
  - id: b
    text:
      es: "Que se acumula al presentado en primer lugar."
  - id: c
    text:
      es: "Que queda suspendido hasta que se resuelva el primero."
  - id: d
    correct: true
    text:
      es: "Que es inadmisible."
  explanation:
    es: "El artículo 222.2 dispone que se tramita el presentado en primer lugar y se declara inadmisible el segundo. No hay acumulación, ni suspensión a la espera del primero, ni tramitación subsidiaria."
  citation: "art. 222.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "simultaneidad"
# anchor: boe-a-2005-8662-art-21
- id: m03-l14-q0067
  prompt:
    es: "Conforme al artículo 21.1 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, al interponer el recurso de reposición el interesado hará constar que:"
  options:
  - id: a
    correct: true
    text:
      es: "No ha impugnado el mismo acto en la vía económico-administrativa."
  - id: b
    text:
      es: "No ha solicitado la suspensión de la ejecución del acto."
  - id: c
    text:
      es: "No ha instado la rectificación de errores del acto."
  - id: d
    text:
      es: "No ha impugnado el acto ante la jurisdicción contencioso-administrativa."
  explanation:
    es: "El artículo 21.1 exige declarar que no se ha impugnado el mismo acto en la vía económico-administrativa, para evitar la simultaneidad con la reclamación. La suspensión, la vía judicial y la rectificación de errores no son lo que debe hacerse constar."
  citation: "art. 21.1 RGRVA"
  difficulty: 3
  tags:
  - "reposición"
  - "simultaneidad"
# anchor: boe-a-2003-23186-art-222
- id: m03-l14-q0108
  prompt:
    es: "Según el artículo 222.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe ocurrir antes de que el interesado que interpuso reposición pueda promover la reclamación económico-administrativa?"
  options:
  - id: a
    text:
      es: "Que el recurso haya sido admitido a trámite por el superior jerárquico del órgano que dictó el acto."
  - id: b
    correct: true
    text:
      es: "Que el recurso se haya resuelto de forma expresa o pueda considerarse desestimado por silencio."
  - id: c
    text:
      es: "Que haya transcurrido un año desde la interposición del recurso de reposición."
  - id: d
    text:
      es: "Que el órgano que dictó el acto haya remitido el expediente al tribunal."
  explanation:
    es: "La reclamación solo puede promoverse tras la resolución expresa de la reposición o su desestimación por silencio, que se produce al vencer el mes sin resolución (art. 225.5). La remisión del expediente, la admisión por el superior y el plazo de un año no son los requisitos del artículo 222.2."
  citation: "art. 222.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "reclamación"
# anchor: boe-a-2003-23186-art-232
- id: m03-l14-q0224
  prompt:
    es: "Señale la respuesta CORRECTA sobre la legitimación para promover reclamaciones económico-administrativas, de acuerdo con el artículo 232 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Los funcionarios públicos no están legitimados para promover la reclamación en ningún caso."
  - id: b
    correct: true
    text:
      es: "Los denunciantes no están legitimados para promover la reclamación."
  - id: c
    text:
      es: "Los organismos que dictaron el acto impugnado están legitimados para promover la reclamación."
  - id: d
    text:
      es: "Los sujetos infractores no están legitimados para promover la reclamación."
  explanation:
    es: "No están legitimados los denunciantes (art. 232.2.c). Los sujetos infractores sí lo están, igual que los obligados tributarios (art. 232.1.a). Los funcionarios y empleados públicos tampoco lo están, salvo cuando se vulnere inmediata y directamente un derecho que les esté reconocido o resulten afectados sus intereses legítimos, de modo que no es cierto que sea «en ningún caso» (art. 232.2.a). Y los organismos que dictaron el acto impugnado están excluidos, no legitimados (art. 232.2.e)."
  citation: "art. 232 LGT"
  difficulty: 1
  tags:
  - "reclamación económico-administrativa"
  - "legitimación"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0225
  prompt:
    es: "Señale la respuesta CORRECTA sobre la duración de la suspensión de la ejecución del acto impugnado, de acuerdo con el artículo 233.10 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "La suspensión se mantiene solo durante la primera instancia y debe solicitarse de nuevo ante el Tribunal Económico-Administrativo Central en la alzada."
  - id: b
    text:
      es: "La suspensión producida en reposición se mantiene siempre en la vía económico-administrativa, sin condición alguna que deba cumplir el interesado."
  - id: c
    correct: true
    text:
      es: "La suspensión se mantiene durante la tramitación del procedimiento económico-administrativo en todas sus instancias."
  - id: d
    text:
      es: "La suspensión se levanta cuando el tribunal admite a trámite la reclamación, salvo que el interesado aporte una nueva garantía."
  explanation:
    es: "La suspensión de la ejecución del acto se mantiene durante la tramitación del procedimiento económico-administrativo en todas sus instancias (art. 233.10). No hay que pedirla de nuevo en la alzada, porque la norma la extiende a todas las instancias. La suspensión producida en reposición se puede mantener en la vía económico-administrativa, pero en las condiciones que se determinen reglamentariamente, no sin condición alguna. Y la admisión a trámite de la reclamación no la levanta: la norma no prevé que se extinga por ese motivo."
  citation: "art. 233.10 LGT"
  difficulty: 2
  tags:
  - "suspensión"
  - "reclamación económico-administrativa"
# anchor: boe-a-2003-23186-art-234
- id: m03-l14-q0226
  prompt:
    es: "Señale la respuesta CORRECTA sobre la notificación en el procedimiento económico-administrativo, de acuerdo con el artículo 234.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Se hace siempre en el domicilio señalado por el interesado, aunque esté obligado a la vía electrónica."
  - id: b
    text:
      es: "Se hace de forma electrónica solo cuando el interesado lo solicita expresamente en el escrito de interposición."
  - id: c
    text:
      es: "Se hace de forma electrónica obligatoriamente a todos los interesados, estén o no obligados a esa vía."
  - id: d
    correct: true
    text:
      es: "Se hace de forma electrónica obligatoriamente cuando la interposición de la reclamación sea obligatoria por esa vía."
  explanation:
    es: "Los actos y resoluciones se notifican por medios electrónicos o en el domicilio señalado, y la notificación es electrónica obligatoriamente para los interesados que, de acuerdo con el artículo 235.5, estén obligados a interponer la reclamación por esa vía (art. 234.4). Mantener el domicilio para quien está obligado a la vía electrónica contradice esa regla. Extender la obligación a todos los interesados la amplía más allá de los obligados. Y condicionarla a una solicitud expresa convierte en voluntario lo que la norma impone a los obligados."
  citation: "art. 234.4 LGT"
  difficulty: 2
  tags:
  - "notificación"
  - "reclamación económico-administrativa"
# anchor: boe-a-2003-23186-art-235
- id: m03-l14-q0227
  prompt:
    es: "Señale la respuesta CORRECTA sobre el escrito de iniciación de la reclamación económico-administrativa, de acuerdo con el artículo 235.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Debe incluir siempre las alegaciones y las pruebas en que se funda la reclamación, sin que pueda limitarse a solicitar que se tenga por interpuesta."
  - id: b
    correct: true
    text:
      es: "Puede limitarse a solicitar que se tenga por interpuesta, identificando al reclamante, el acto contra el que se reclama, el domicilio para notificaciones y el tribunal ante el que se interpone."
  - id: c
    text:
      es: "Puede limitarse a solicitar que se tenga por interpuesta, identificando al reclamante, el acto, el domicilio para notificaciones y la cuantía."
  - id: d
    text:
      es: "Puede limitarse a solicitar que se tenga por interpuesta, identificando al reclamante y el acto, sin necesidad de señalar domicilio ni tribunal."
  explanation:
    es: "El escrito puede limitarse a solicitar que se tenga por interpuesta, identificando al reclamante, el acto o actuación contra el que se reclama, el domicilio para notificaciones y el tribunal ante el que se interpone (art. 235.2). Exigir alegaciones y pruebas desde el primer momento contradice esa posibilidad. Prescindir del domicilio y del tribunal omite dos de los cuatro datos que debe contener. Y sustituir el tribunal por la cuantía cambia uno de los datos exigidos por otro que el artículo no menciona."
  citation: "art. 235.2 LGT"
  difficulty: 2
  tags:
  - "reclamación económico-administrativa"
  - "iniciación"
# anchor: boe-a-2003-23186-art-236
- id: m03-l14-q0228
  prompt:
    es: "En la tramitación de la reclamación económico-administrativa, ¿de qué plazo común disponen los interesados para presentar escrito de alegaciones cuando el tribunal les pone de manifiesto el expediente, según el artículo 236.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Un mes, en el que deben presentar el escrito de alegaciones con aportación de las pruebas oportunas."
  - id: b
    text:
      es: "Diez días, en los que deben presentar el escrito de alegaciones con aportación de las pruebas oportunas."
  - id: c
    text:
      es: "Dos meses, en los que deben presentar el escrito de alegaciones con aportación de las pruebas oportunas."
  - id: d
    text:
      es: "Quince días, en los que deben presentar el escrito de alegaciones con aportación de las pruebas oportunas."
  explanation:
    es: "El tribunal pone de manifiesto el expediente a los interesados comparecidos por plazo común de un mes, en el que deben presentar el escrito de alegaciones con aportación de las pruebas oportunas (art. 236.1). Los quince días son el plazo del recurso de anulación (art. 241 bis.1). Los dos meses no son el plazo de este trámite: es el límite de los períodos que no cuentan en el plazo de la reposición (art. 225.4). Los diez días no aparecen en la regulación de esta fase."
  citation: "art. 236.1 LGT"
  difficulty: 1
  tags:
  - "reclamación económico-administrativa"
  - "plazos"
# anchor: boe-a-2003-23186-art-240
- id: m03-l14-q0229
  prompt:
    es: "Señale la respuesta CORRECTA sobre la resolución de la reclamación económico-administrativa tras vencer el plazo de un año, de acuerdo con el artículo 240.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "El tribunal debe resolver expresamente solo si el interesado lo pide, y los plazos para recurrir no se ven afectados por esa resolución."
  - id: b
    text:
      es: "El tribunal queda liberado de resolver expresamente, y los plazos para recurrir se cuentan desde el día siguiente al vencimiento del año."
  - id: c
    correct: true
    text:
      es: "El tribunal debe resolver expresamente en todo caso, y los plazos para recurrir se cuentan desde el día siguiente al de la notificación de la resolución expresa."
  - id: d
    text:
      es: "El tribunal debe resolver expresamente en todo caso, pero los plazos para recurrir se cuentan desde que se interpuso la reclamación."
  explanation:
    es: "Transcurrido el año el interesado puede entender desestimada la reclamación, pero el tribunal debe resolver expresamente en todo caso, y los plazos para interponer los recursos comienzan a contarse desde el día siguiente al de la notificación de la resolución expresa (art. 240.1). Liberar al tribunal de resolver contradice «en todo caso». Contar los plazos desde la interposición de la reclamación o desde el vencimiento del año los adelanta respecto del momento que fija la norma. Y condicionar la resolución a una petición del interesado añade un requisito que no existe."
  citation: "art. 240.1 LGT"
  difficulty: 3
  tags:
  - "reclamación económico-administrativa"
  - "plazo de resolución"
# anchor: boe-a-2003-23186-art-241
- id: m03-l14-q0230
  prompt:
    es: "¿Cuál de las siguientes personas está legitimada para interponer el recurso de alzada ordinario, según el artículo 241.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los denunciantes cuyos intereses se vean afectados por la resolución dictada en primera instancia."
  - id: b
    correct: true
    text:
      es: "Los Directores de Departamento de la Agencia Estatal de Administración Tributaria, en las materias de su competencia."
  - id: c
    text:
      es: "Los vocales del tribunal económico-administrativo regional que dictó la resolución, en las materias de su competencia."
  - id: d
    text:
      es: "Los funcionarios que intervinieron en el acto reclamado, en las materias de su competencia."
  explanation:
    es: "Están legitimados para interponer el recurso de alzada ordinario los interesados, los Directores Generales del Ministerio de Hacienda y los Directores de Departamento de la Agencia Estatal de Administración Tributaria en las materias de su competencia, y los órganos equivalentes de las Comunidades Autónomas (art. 241.3). Los vocales del tribunal que dictó la resolución no figuran entre ellos. Los denunciantes tampoco: no están legitimados para promover reclamaciones (art. 232.2.c). Y los funcionarios que intervinieron en el acto solo lo están en los casos que fija el artículo 232.2.a), no por esa condición."
  citation: "art. 241.3 LGT"
  difficulty: 2
  tags:
  - "recurso de alzada ordinario"
  - "legitimación"
# anchor: boe-a-2003-23186-art-241-bis
- id: m03-l14-q0231
  prompt:
    es: "Señale la respuesta CORRECTA sobre la resolución del recurso de anulación, de acuerdo con el artículo 241 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "El tribunal resuelve sin más trámite en el plazo de quince días, y se entiende estimado en caso contrario."
  - id: b
    text:
      es: "El tribunal resuelve sin más trámite en el plazo de un mes, y se entiende estimado en caso contrario."
  - id: c
    correct: true
    text:
      es: "El tribunal resuelve sin más trámite en el plazo de un mes, y se entiende desestimado en caso contrario."
  - id: d
    text:
      es: "El tribunal resuelve sin más trámite en el plazo de tres meses, y se entiende desestimado en caso contrario."
  explanation:
    es: "El tribunal resuelve el recurso de anulación sin más trámite en el plazo de un mes, entendiéndose desestimado en caso contrario (art. 241 bis.4). Los quince días son el plazo para interponerlo (art. 241 bis.1), no para resolverlo. Los tres meses son el plazo del recurso extraordinario de alzada para la unificación de criterio (art. 242.3). Y la opción que lo da por estimado invierte el efecto del silencio, que es desestimatorio."
  citation: "art. 241 bis.4 LGT"
  difficulty: 1
  tags:
  - "recurso de anulación"
  - "plazos"
# anchor: boe-a-2003-23186-art-241-bis
- id: m03-l14-q0233
  prompt:
    es: "Señale la respuesta CORRECTA sobre los límites del recurso de anulación, de acuerdo con el artículo 241 bis.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Se interpone ante el Tribunal Económico-Administrativo Central en todo caso, cualquiera que sea el tribunal que dictó la resolución."
  - id: b
    text:
      es: "Procede frente a la resolución del recurso extraordinario de revisión, en el plazo de quince días."
  - id: c
    text:
      es: "Puede deducirse de nuevo frente a su resolución, por una sola vez."
  - id: d
    correct: true
    text:
      es: "No procede frente a la resolución del recurso extraordinario de revisión."
  explanation:
    es: "El recurso de anulación no procede frente a la resolución del recurso extraordinario de revisión, y tampoco puede deducirse nuevamente frente a su propia resolución (art. 241 bis.3). La opción que lo admite contra el recurso extraordinario de revisión lo contradice, y la que permite repetirlo contradice la prohibición de deducirlo de nuevo. Se interpone ante el tribunal que hubiera dictado la resolución que se impugna, no ante el Tribunal Económico-Administrativo Central en todo caso (art. 241 bis.1)."
  citation: "art. 241 bis.3 LGT"
  difficulty: 2
  tags:
  - "recurso de anulación"
  - "límites"
# anchor: boe-a-2003-23186-art-243
- id: m03-l14-q0234
  prompt:
    es: "¿Qué órgano es competente para resolver el recurso extraordinario para la unificación de doctrina y en qué plazo debe dictar su resolución, según el artículo 243 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El Pleno del Tribunal Económico-Administrativo Central, en el plazo de seis meses."
  - id: b
    correct: true
    text:
      es: "La Sala Especial para la Unificación de Doctrina, en el plazo de seis meses."
  - id: c
    text:
      es: "El Pleno del Tribunal Económico-Administrativo Central, en el plazo de tres meses."
  - id: d
    text:
      es: "La Sala Especial para la Unificación de Doctrina, en el plazo de tres meses."
  explanation:
    es: "Es competente para resolver el recurso la Sala Especial para la Unificación de Doctrina (art. 243.2), y la resolución debe dictarse en el plazo de seis meses (art. 243.4). Los tres meses son el plazo de resolución del recurso extraordinario de alzada para la unificación de criterio (art. 242.3). El Pleno del Tribunal Económico-Administrativo Central no es el órgano que resuelve este recurso: la Sala Especial es un órgano económico-administrativo distinto (art. 228.3)."
  citation: "art. 243 LGT"
  difficulty: 3
  tags:
  - "recurso extraordinario"
  - "unificación de doctrina"
# anchor: boe-a-2003-23186-art-245
- id: m03-l14-q0236
  prompt:
    es: "Señale la respuesta CORRECTA sobre las reclamaciones tramitadas por el procedimiento abreviado, de acuerdo con el artículo 245.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Se resuelven en primera instancia por los tribunales económico-administrativos y cabe recurso de alzada ordinario ante el Tribunal Central."
  - id: b
    text:
      es: "Se resuelven en única instancia por los órganos que dictaron el acto reclamado, que pueden actuar de forma unipersonal."
  - id: c
    text:
      es: "Se resuelven en única instancia por los tribunales económico-administrativos, que deben actuar siempre en Pleno o en Salas."
  - id: d
    correct: true
    text:
      es: "Se resuelven en única instancia por los tribunales económico-administrativos, que pueden actuar de forma unipersonal."
  explanation:
    es: "Las reclamaciones tramitadas por el procedimiento abreviado se resuelven en única instancia por los tribunales económico-administrativos, que para resolver pueden actuar de forma unipersonal (art. 245.2). Hablar de primera instancia y alzada ordinario contradice la única instancia y el artículo 248, que excluye la alzada ordinario. Exigir que actúen siempre en Pleno contradice la posibilidad de actuar de forma unipersonal. Y atribuir la resolución a los órganos que dictaron el acto confunde al tribunal con el órgano al que se dirige el escrito de interposición."
  citation: "art. 245.2 LGT"
  difficulty: 2
  tags:
  - "procedimiento abreviado"
  - "tribunales económico-administrativos"
# anchor: boe-a-2005-8662-art-29
- id: m03-l14-q0240
  prompt:
    es: "De acuerdo con el artículo 29.2 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, ¿cómo se nombra al Presidente del Tribunal Económico-Administrativo Central?"
  options:
  - id: a
    text:
      es: "Por el Pleno del propio Tribunal, entre los vocales que lo integran y por mayoría de sus miembros."
  - id: b
    correct: true
    text:
      es: "Por real decreto del Consejo de Ministros, entre funcionarios de reconocido prestigio en el ámbito tributario."
  - id: c
    text:
      es: "Por orden del Ministro de Hacienda, entre funcionarios de los cuerpos que se indiquen en la relación de puestos de trabajo."
  - id: d
    text:
      es: "Por resolución del Director General de Tributos, entre funcionarios de reconocido prestigio en el ámbito tributario."
  explanation:
    es: "El Presidente del Tribunal Económico-Administrativo Central es nombrado y separado por real decreto del Consejo de Ministros, entre funcionarios de reconocido prestigio en el ámbito tributario (art. 29.2 RGRVA). El nombramiento por orden ministerial entre funcionarios de los cuerpos de la relación de puestos de trabajo es el de los presidentes y vocales de los tribunales regionales y locales (art. 30.2 RGRVA). La elección por el Pleno entre los vocales no está prevista. Y el Director General de Tributos no nombra al Presidente: el nombramiento es por real decreto."
  citation: "art. 29.2 RGRVA"
  difficulty: 1
  tags:
  - "Tribunal Económico-Administrativo Central"
  - "nombramiento"
