# anchor: boe-a-2015-10565-art-83
- id: m03-l03-q170
  prompt:
    es: "De acuerdo con el artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el anuncio de un período de información pública determinará el plazo para formular alegaciones, que:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá ser inferior a veinte días."
  - id: b
    text:
      es: "En ningún caso podrá ser inferior a diez días."
  - id: c
    text:
      es: "En ningún caso podrá ser superior a veinte días."
  - id: d
    text:
      es: "En ningún caso podrá ser inferior a un mes."
  explanation:
    es: "El artículo 83.2 dice que el plazo de alegaciones de la información pública «en ningún caso podrá ser inferior a veinte días». Veinte días es un mínimo, no un máximo. No es de diez días, y nada exige un mes."
  citation: "art. 83.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-83
- id: m03-l03-q171
  prompt:
    es: "El anuncio de información pública de un procedimiento se publica en el «Boletín Oficial del Estado» el lunes 19 de enero de 2026 y fija el plazo mínimo de alegaciones. Sin festivos en el periodo, ¿cuál es su último día?"
  options:
  - id: a
    text:
      es: "El lunes 2 de febrero de 2026."
  - id: b
    text:
      es: "El lunes 9 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 16 de febrero de 2026."
  - id: d
    text:
      es: "El jueves 19 de febrero de 2026."
  explanation:
    es: "El plazo de alegaciones de la información pública no puede ser inferior a veinte días (art. 83.2). Son hábiles (art. 30.2) y se cuentan desde el día siguiente a la publicación (art. 30.3), el martes 20 de enero. Excluidos sábados y domingos, el vigésimo día hábil es el lunes 16 de febrero de 2026. El lunes 2 de febrero cuenta diez días hábiles. El lunes 9 sale de contar veinte días naturales, hasta el domingo 8, y prorrogar. El jueves 19 cuenta veintitrés días hábiles."
  citation: "art. 83.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-83
- id: m03-l03-q172
  prompt:
    es: "Un anuncio de información pública se publica el lunes 4 de enero de 2027 con el plazo mínimo de alegaciones. El miércoles 6 de enero es festivo nacional y no hay otros. ¿Cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El lunes 25 de enero de 2027."
  - id: b
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El martes 2 de febrero de 2027."
  - id: d
    text:
      es: "El miércoles 3 de febrero de 2027."
  explanation:
    es: "El mínimo es de veinte días (art. 83.2), hábiles: se excluyen sábados, domingos y festivos (art. 30.2). El cómputo empieza el martes 5 de enero (art. 30.3). El miércoles 6 es festivo y no cuenta. El vigésimo día hábil es el martes 2 de febrero de 2027. El lunes 1 de febrero olvida excluir el festivo del 6 de enero. El lunes 25 de enero sale de contar veinte días naturales, hasta el domingo 24, y prorrogar. El miércoles 3 de febrero añade un día de más."
  citation: "art. 83.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-84
- id: m03-l03-q173
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los modos de poner fin al procedimiento del artículo 84.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la prescripción."
  - id: b
    correct: true
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la declaración de caducidad."
  - id: c
    text:
      es: "La resolución, el desistimiento y la declaración de caducidad, sin que quepa en ningún caso la renuncia al derecho."
  - id: d
    text:
      es: "La resolución, la suspensión del procedimiento, la renuncia al derecho no prohibida y la declaración de caducidad."
  explanation:
    es: "El artículo 84.1 dice: «Pondrán fin al procedimiento la resolución, el desistimiento, la renuncia al derecho en que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico, y la declaración de caducidad». La prescripción no está en la lista. La renuncia sí, cuando no esté prohibida. La suspensión no pone fin al procedimiento."
  citation: "art. 84.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m03-l03-q174
  prompt:
    es: "De acuerdo con el artículo 85.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento sancionador, si el infractor reconoce su responsabilidad:"
  options:
  - id: a
    text:
      es: "Deberá archivarse el procedimiento sin imponer sanción alguna."
  - id: b
    text:
      es: "Deberá abrirse en todo caso un período de prueba sobre los hechos."
  - id: c
    text:
      es: "Se suspenderá el procedimiento hasta que el infractor abone la sanción."
  - id: d
    correct: true
    text:
      es: "Podrá resolverse el procedimiento imponiendo la sanción que proceda."
  explanation:
    es: "El artículo 85.1 dice que, si el infractor reconoce su responsabilidad, «se podrá resolver el procedimiento con la imposición de la sanción que proceda». El reconocimiento no lleva al archivo sin sanción, no obliga a abrir prueba y no suspende el procedimiento."
  citation: "art. 85.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m03-l03-q175
  prompt:
    es: "Según el artículo 85.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo implica la terminación del procedimiento sancionador el pago voluntario por el presunto responsable?"
  options:
  - id: a
    correct: true
    text:
      es: "Si la sanción es solo pecuniaria, o se justificó la improcedencia de la otra, y se paga antes de resolver."
  - id: b
    text:
      es: "Si la sanción es pecuniaria o no pecuniaria, siempre que se pague antes de la propuesta de resolución."
  - id: c
    text:
      es: "Si la sanción es solo pecuniaria y se paga dentro de los diez días siguientes a la notificación de la iniciación."
  - id: d
    text:
      es: "Si la sanción es solo pecuniaria y se paga una vez notificada la resolución sancionadora, en periodo voluntario."
  explanation:
    es: "El artículo 85.2 exige que la sanción tenga «únicamente carácter pecuniario» o que, pudiendo imponerse otra no pecuniaria, «se ha justificado la improcedencia de la segunda», y que el pago se haga «en cualquier momento anterior a la resolución». No vale para cualquier sanción no pecuniaria. El límite es la resolución, no la propuesta ni diez días desde la iniciación. Pagar después de la resolución no termina un procedimiento que ya terminó."
  citation: "art. 85.2 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m03-l03-q176
  prompt:
    es: "De acuerdo con el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la sanción es solo pecuniaria y el infractor reconoce su responsabilidad o paga voluntariamente, se aplicarán reducciones:"
  options:
  - id: a
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, no acumulables entre sí."
  - id: b
    correct: true
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: c
    text:
      es: "De, al menos, el 30 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: d
    text:
      es: "De, como máximo, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  explanation:
    es: "El artículo 85.3 dice que se aplicarán «reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí». El 20 % es un mínimo, no un máximo, y el porcentaje legal no es el 30 %. Las dos reducciones, por reconocimiento y por pago, sí se acumulan."
  citation: "art. 85.3 LPAC"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-85
- id: m03-l03-q177
  prompt:
    es: "Según el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿a qué está condicionada la efectividad de las reducciones sobre el importe de la sanción propuesta?"
  options:
  - id: a
    text:
      es: "Al desistimiento o renuncia de cualquier recurso contencioso-administrativo contra la sanción."
  - id: b
    text:
      es: "A que el infractor no haya sido sancionado en el año anterior por una infracción de la misma naturaleza."
  - id: c
    text:
      es: "A que el pago se realice dentro de los diez días siguientes a la notificación de la resolución."
  - id: d
    correct: true
    text:
      es: "Al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción."
  explanation:
    es: "El artículo 85.3 dice que la efectividad de las reducciones «estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción». La renuncia se refiere a la vía administrativa, no a la contencioso-administrativa. La ley no exige falta de sanciones previas ni un pago en diez días tras la resolución."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m03-l03-q178
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las reducciones de la sanción pecuniaria por reconocimiento o pago voluntario es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Deben figurar en la propuesta de resolución, y su porcentaje podrá incrementarse reglamentariamente."
  - id: b
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje solo podrá incrementarse por ley."
  - id: c
    text:
      es: "Las acuerda el instructor a petición del interesado, y su porcentaje es fijo e invariable."
  - id: d
    correct: true
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje podrá incrementarse reglamentariamente."
  explanation:
    es: "El artículo 85.3 dice que las reducciones «deberán estar determinadas en la notificación de iniciación del procedimiento» y que el porcentaje «podrá ser incrementado reglamentariamente». No se fijan en la propuesta de resolución. Un reglamento basta para subir el porcentaje. Las aplica el órgano competente para resolver, no el instructor, y el porcentaje no es invariable."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-87
- id: m03-l03-q181
  prompt:
    es: "Terminadas las actuaciones complementarias de un procedimiento, su finalización se notifica a los interesados el martes 3 de marzo de 2026. Sin festivos en el periodo, ¿cuál es el último día para formular alegaciones?"
  options:
  - id: a
    text:
      es: "El martes 10 de marzo de 2026."
  - id: b
    correct: true
    text:
      es: "El jueves 12 de marzo de 2026."
  - id: c
    text:
      es: "El martes 17 de marzo de 2026."
  - id: d
    text:
      es: "El martes 24 de marzo de 2026."
  explanation:
    es: "El plazo de alegaciones tras las actuaciones complementarias es de siete días (art. 87), hábiles (art. 30.2), desde el miércoles 4 de marzo (art. 30.3). Excluidos sábados y domingos, el séptimo día hábil es el jueves 12 de marzo de 2026. El martes 10 de marzo sale de contar siete días naturales. El martes 17 cuenta diez días hábiles. El martes 24 cuenta quince, el plazo máximo para practicar las actuaciones."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-88
- id: m03-l03-q183
  prompt:
    es: "El órgano competente pone de manifiesto a los interesados una cuestión conexa no planteada, por notificación del martes 2 de febrero de 2027 y con el plazo máximo legal. Sin festivos en el periodo, ¿cuál es el último día para alegar?"
  options:
  - id: a
    text:
      es: "El martes 16 de febrero de 2027."
  - id: b
    text:
      es: "El miércoles 17 de febrero de 2027."
  - id: c
    text:
      es: "El lunes 22 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El martes 23 de febrero de 2027."
  explanation:
    es: "El plazo para las cuestiones conexas es no superior a quince días (art. 88.1); el máximo son quince días hábiles (art. 30.2), desde el miércoles 3 de febrero (art. 30.3). Excluidos sábados y domingos, el decimoquinto día hábil es el martes 23 de febrero de 2027. El martes 16 es el décimo día hábil. El miércoles 17 sale de contar quince días naturales. El lunes 22 cuenta el día de la notificación como primero."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-94
- id: m03-l03-q184
  prompt:
    es: "Según el artículo 94.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la solicitud la formularon varios interesados y uno desiste, ¿a quién afecta el desistimiento?"
  options:
  - id: a
    text:
      es: "A todos los que formularon el escrito."
  - id: b
    correct: true
    text:
      es: "Solo a aquel que lo haya formulado."
  - id: c
    text:
      es: "A todos, salvo que los demás ratifiquen la solicitud."
  - id: d
    text:
      es: "Solo a quien lo formuló, si los demás lo aceptan."
  explanation:
    es: "El artículo 94.2 dice que, si el escrito se formuló por dos o más interesados, «el desistimiento o la renuncia sólo afectará a aquellos que la hubiesen formulado». No alcanza a los demás, que no tienen que ratificar nada ni aceptar el desistimiento."
  citation: "art. 94.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-94
- id: m03-l03-q185
  prompt:
    es: "De acuerdo con el artículo 94.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración aceptará de plano el desistimiento o la renuncia y declarará concluso el procedimiento, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "Terceros interesados personados insten su continuación en diez días desde que se les notificó."
  - id: b
    text:
      es: "Terceros interesados personados insten su continuación en quince días desde que se les notificó."
  - id: c
    text:
      es: "El órgano instructor proponga su continuación en diez días desde que recibió el escrito."
  - id: d
    text:
      es: "Cualquier persona, aunque no esté personada, inste su continuación en diez días."
  explanation:
    es: "El artículo 94.4 exceptúa el caso de que, «habiéndose personado en el mismo terceros interesados, instasen éstos su continuación en el plazo de diez días desde que fueron notificados». El plazo no es de quince días. Pueden instarla los terceros personados, no cualquier persona ni el instructor."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-94
- id: m03-l03-q186
  prompt:
    es: "El viernes 5 de febrero de 2027 se notifica a los terceros interesados personados en un procedimiento el desistimiento del solicitante. Sin festivos en el periodo, el último día para instar la continuación es:"
  options:
  - id: a
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: b
    text:
      es: "El jueves 18 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 19 de febrero de 2027."
  - id: d
    text:
      es: "El viernes 26 de febrero de 2027."
  explanation:
    es: "Los terceros personados pueden instar la continuación en diez días desde que se les notificó el desistimiento (art. 94.4 de la Ley 39/2015). Son hábiles (art. 30.2): el sábado 6 y el domingo 7 no cuentan, y el primer día es el lunes 8 de febrero. El décimo día hábil es el viernes 19 de febrero de 2027. El lunes 15 sale de contar diez días naturales. El jueves 18 cuenta el viernes de la notificación como primer día. El viernes 26 cuenta quince días hábiles."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-95
- id: m03-l03-q187
  prompt:
    es: "De acuerdo con el artículo 95.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ante la paralización por causa imputable al solicitante, la Administración le advertirá de que la caducidad se producirá:"
  options:
  - id: a
    text:
      es: "Transcurridos seis meses, y consumido ese plazo sin reanudar la tramitación, acordará el archivo de las actuaciones."
  - id: b
    correct: true
    text:
      es: "Transcurridos tres meses, y consumido ese plazo sin reanudar la tramitación, acordará el archivo de las actuaciones."
  - id: c
    text:
      es: "Transcurrido un mes, y consumido ese plazo sin reanudar la tramitación, acordará el archivo de las actuaciones."
  - id: d
    text:
      es: "Transcurridos tres meses, y consumido ese plazo, el interesado podrá entender desestimada su solicitud."
  explanation:
    es: "El artículo 95.1 dice que la Administración advertirá de que, «transcurridos tres meses, se producirá la caducidad», y que, consumido el plazo sin que el interesado reanude la tramitación, «acordará el archivo de las actuaciones». El plazo no es de un mes ni de seis. El efecto es la caducidad y el archivo, no la desestimación por silencio."
  citation: "art. 95.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-95
- id: m03-l03-q188
  prompt:
    es: "Un procedimiento iniciado a solicitud queda paralizado por causa imputable al interesado, y el viernes 30 de octubre de 2026 se le notifica la advertencia de caducidad. ¿Qué día concluye el plazo de la advertencia?"
  options:
  - id: a
    text:
      es: "El viernes 29 de enero de 2027."
  - id: b
    text:
      es: "El sábado 30 de enero de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: d
    text:
      es: "El viernes 30 de abril de 2027."
  explanation:
    es: "La advertencia anuncia la caducidad transcurridos tres meses (art. 95.1). Los meses se cuentan de fecha a fecha desde el día siguiente a la notificación (art. 30.4): el plazo concluye el sábado 30 de enero de 2027. Ese día es inhábil y se prorroga al primer día hábil siguiente (art. 30.5): el lunes 1 de febrero de 2027. El sábado 30 olvida la prórroga. El viernes 29 adelanta el vencimiento, que la ley no prevé. El viernes 30 de abril aplica seis meses."
  citation: "art. 95.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-95
- id: m03-l03-q189
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los procedimientos caducados y el plazo de prescripción es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "No interrumpen el plazo de prescripción de las acciones."
  - id: b
    text:
      es: "Interrumpen el plazo de prescripción, que vuelve a correr desde el archivo."
  - id: c
    text:
      es: "Suspenden el plazo de prescripción mientras estuvieron en tramitación."
  - id: d
    text:
      es: "Producen por sí solos la prescripción de las acciones del particular."
  explanation:
    es: "El artículo 95.3 dice que «los procedimientos caducados no interrumpirán el plazo de prescripción». No lo interrumpen ni lo suspenden. La caducidad tampoco «producirá por sí sola la prescripción de las acciones del particular o de la Administración»."
  citation: "art. 95.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-96
- id: m03-l03-q190
  prompt:
    es: "De acuerdo con el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos simplificados se resolverán en treinta días desde el siguiente a la notificación del acuerdo:"
  options:
  - id: a
    text:
      es: "Salvo que reste más para su tramitación ordinaria."
  - id: b
    text:
      es: "Salvo que el órgano acuerde ampliarlo hasta sesenta días."
  - id: c
    correct: true
    text:
      es: "Salvo que reste menos para su tramitación ordinaria."
  - id: d
    text:
      es: "Salvo que se trate de un procedimiento sancionador."
  explanation:
    es: "El artículo 96.6 fija los treinta días «salvo que reste menos para su tramitación ordinaria». Si resta más, rigen los treinta días. La ley no prevé una ampliación a sesenta días. Los procedimientos sancionadores pueden tramitarse de forma simplificada (art. 96.5) y también se rigen por los treinta días."
  citation: "art. 96.6 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-96
- id: m03-l03-q191
  prompt:
    es: "El acuerdo de tramitación simplificada de un procedimiento se notifica al interesado el martes 12 de enero de 2027, y no resta menos para la ordinaria. Sin festivos en el periodo, ¿cuándo vence el plazo para resolver?"
  options:
  - id: a
    text:
      es: "El jueves 11 de febrero de 2027."
  - id: b
    text:
      es: "El viernes 12 de febrero de 2027."
  - id: c
    text:
      es: "El lunes 22 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El martes 23 de febrero de 2027."
  explanation:
    es: "El procedimiento simplificado se resuelve en treinta días, «a contar desde el siguiente al que se notifique» el acuerdo (art. 96.6). Son hábiles (art. 30.2), desde el miércoles 13 de enero. Sin festivos en el periodo y excluidos sábados y domingos, el trigésimo día hábil es el martes 23 de febrero de 2027. El jueves 11 de febrero sale de contar treinta días naturales. El viernes 12 trata el plazo como de un mes. El lunes 22 cuenta desde el mismo día de la notificación."
  citation: "art. 96.6 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-68
- id: m03-l03-q192
  prompt:
    es: "Según el artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el interesado no atiende en plazo el requerimiento de subsanación de su solicitud, ¿cómo se le tiene por desistido?"
  options:
  - id: a
    text:
      es: "Automáticamente al vencer el plazo, sin necesidad de dictar resolución alguna."
  - id: b
    text:
      es: "Mediante un nuevo requerimiento que le conceda un plazo adicional de cinco días."
  - id: c
    correct: true
    text:
      es: "Mediante resolución dictada en los términos del artículo 21, que declare el desistimiento."
  - id: d
    text:
      es: "Mediante acuerdo del órgano instructor, contra el que no cabe recurso alguno."
  explanation:
    es: "El artículo 68.1 advierte de que, si no se subsana, «se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21». El desistimiento no opera solo al vencer el plazo: hace falta resolución. La ampliación de hasta cinco días del artículo 68.2 se pide o se acuerda dentro del plazo; no es un segundo requerimiento tras el vencimiento. La ley no atribuye esa decisión a un acuerdo irrecurrible del instructor."
  citation: "art. 68.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-68
- id: m03-l03-q193
  prompt:
    es: "El plazo de diez días que se dio a un interesado para subsanar su solicitud vence el viernes 19 de febrero de 2027. Si el requerimiento se notificó en día hábil y no hubo festivos, ¿qué día se notificó?"
  options:
  - id: a
    text:
      es: "El viernes 29 de enero de 2027."
  - id: b
    text:
      es: "El jueves 4 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 5 de febrero de 2027."
  - id: d
    text:
      es: "El martes 9 de febrero de 2027."
  explanation:
    es: "El plazo de subsanación es de diez días (art. 68.1), hábiles (art. 30.2), y empieza el día siguiente a la notificación (art. 30.3). Contando hacia atrás desde el viernes 19 de febrero de 2027, sin sábados ni domingos, el primer día hábil del plazo es el lunes 8 de febrero. La notificación, en día hábil, fue el viernes 5 de febrero de 2027. Con notificación el jueves 4, el plazo habría vencido el jueves 18. El martes 9 sale de contar diez días naturales. El viernes 29 de enero da quince días hábiles, como si el plazo se hubiera ampliado cinco días."
  citation: "art. 68.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-87
- id: m03-l03-q194
  prompt:
    es: "El órgano competente para resolver acuerda actuaciones complementarias indispensables y fija dieciocho días para practicarlas. ¿Se ajusta ese plazo a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Sí, porque deben practicarse en un plazo no superior a un mes."
  - id: b
    text:
      es: "Sí, porque la ley solo limita el plazo de alegaciones posterior, no el de su práctica."
  - id: c
    text:
      es: "Sí, porque el plazo de práctica lo fija libremente el acuerdo que las ordena."
  - id: d
    correct: true
    text:
      es: "No, porque deben practicarse en un plazo no superior a quince días."
  explanation:
    es: "El artículo 87 dice que las actuaciones complementarias «deberán practicarse en un plazo no superior a quince días». Dieciocho días lo superan. El límite no es de un mes. La ley fija a la vez el plazo de práctica y el de alegaciones posterior, de siete días, y el acuerdo no puede fijar libremente un plazo mayor."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m03-l03-q195
  prompt:
    es: "¿En cuál de los siguientes casos se suspende necesariamente, y no solo de forma potestativa, el plazo máximo para resolver, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el órgano competente decide realizar actuaciones complementarias."
  - id: b
    text:
      es: "Cuando se requiere al interesado para que subsane deficiencias de su solicitud."
  - id: c
    text:
      es: "Cuando se solicita un informe preceptivo a un órgano de otra Administración."
  - id: d
    text:
      es: "Cuando el instructor acuerda la apertura de un período de prueba ordinario."
  explanation:
    es: "El artículo 22.2 enumera los casos en que el plazo «se suspenderá», y entre ellos está la decisión de realizar actuaciones complementarias del artículo 87; el propio artículo 87 dice que el plazo «quedará suspendido». El requerimiento de subsanación y el informe preceptivo están en el artículo 22.1, donde el plazo «se podrá suspender». La apertura de un período de prueba ordinario no figura entre las causas de suspensión."
  citation: "art. 22.2.b) LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q196
  prompt:
    es: "¿En cuál de los siguientes casos permite el vencimiento del plazo sin resolución expresa entender desestimada la pretensión del interesado, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En una solicitud del interesado cuando ninguna norma con rango de ley, europea o internacional dispone otra cosa."
  - id: b
    correct: true
    text:
      es: "En un recurso de alzada interpuesto contra la resolución expresa que deniega una solicitud."
  - id: c
    text:
      es: "En una alzada contra la desestimación por silencio de una solicitud sobre materia no excluida por el artículo 24.1."
  - id: d
    text:
      es: "En un procedimiento sancionador iniciado de oficio por el órgano competente."
  explanation:
    es: "El artículo 24.1 dice que el silencio será desestimatorio «en los procedimientos de impugnación de actos y disposiciones», y la alzada contra una denegación expresa lo es. La solicitud sin norma que disponga otra cosa sigue la regla general: silencio estimatorio. La alzada contra la desestimación por silencio de una solicitud se entiende estimada si no versa sobre las materias del párrafo segundo del artículo 24.1. En el procedimiento sancionador de oficio el vencimiento produce la caducidad (art. 25.1.b)."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-91
- id: m03-l03-q198
  prompt:
    es: "¿En cuál de los siguientes casos puede el particular entender que la resolución de su reclamación de responsabilidad patrimonial es contraria a la indemnización, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando pasan seis meses desde el inicio sin resolución notificada ni acuerdo formalizado."
  - id: b
    text:
      es: "Cuando pasan seis meses desde el inicio, aunque en ese tiempo se haya formalizado el acuerdo."
  - id: c
    text:
      es: "Cuando el órgano no expide de oficio el certificado del silencio en quince días."
  - id: d
    text:
      es: "Cuando el órgano pide un informe preceptivo y lo recibe pasado más de un mes."
  explanation:
    es: "El artículo 91.3 permite entender contraria la resolución cuando transcurren seis meses desde el inicio «sin que haya recaído y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo». Si el acuerdo se formalizó, el procedimiento terminó por esa vía. La falta del certificado del silencio no crea el efecto: el certificado solo lo acredita (art. 24.4). La demora de un informe preceptivo puede suspender el plazo (art. 22.1.d), no producir el silencio."
  citation: "art. 91.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
