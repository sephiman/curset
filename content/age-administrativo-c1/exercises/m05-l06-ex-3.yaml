# anchor: boe-a-2003-20977-art-42
- id: m05-l06-q063
  prompt:
    es: "Si en un procedimiento de reintegro de subvenciones transcurre el plazo para resolver sin notificarse resolución expresa, ¿qué se produce?"
  options:
  - id: a
    text:
      es: "El silencio positivo, que obliga a la Administración a reconocer la subvención."
  - id: b
    text:
      es: "El silencio negativo, que permite al beneficiario acudir directamente a la vía contencioso-administrativa."
  - id: c
    correct: true
    text:
      es: "La caducidad del procedimiento, sin perjuicio de continuar las actuaciones hasta su terminación."
  - id: d
    text:
      es: "La prescripción inmediata del derecho de la Administración a exigir el reintegro."
  explanation:
    es: "El artículo 42.4 prevé que, sin resolución expresa notificada en plazo, «se producirá la caducidad del procedimiento, sin perjuicio de continuar las actuaciones hasta su terminación» y sin que se considere interrumpida la prescripción por lo actuado hasta ese momento. No hay silencio, positivo ni negativo, y la prescripción no es inmediata."
  citation: "art. 42.4 LGS"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2003-20977-art-42
- id: m05-l06-q064
  prompt:
    es: "El acuerdo de iniciación de un procedimiento de reintegro se adopta el martes 3 de noviembre de 2026, sin suspensión. De fecha a fecha, ¿hasta qué día puede notificarse la resolución sin que caduque el procedimiento?"
  options:
  - id: a
    text:
      es: "Hasta el martes 2 de noviembre de 2027, contando el día del acuerdo como primer día."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles 3 de noviembre de 2027."
  - id: c
    text:
      es: "Hasta el jueves 4 de noviembre de 2027, contando desde el día siguiente al del acuerdo."
  - id: d
    text:
      es: "Hasta el viernes 3 de diciembre de 2027, contando doce meses completos desde el mes siguiente."
  explanation:
    es: "El plazo es de 12 meses desde la fecha del acuerdo de iniciación (artículo 42.4). Contado de fecha a fecha, acaba el mismo día del mes doce meses después: el miércoles 3 de noviembre de 2027, que es hábil. El día del acuerdo no se cuenta como primer día, ni se añade un día más, ni se empieza a contar en el mes siguiente."
  citation: "art. 42.4 LGS"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-20977-art-44
- id: m05-l06-q065
  prompt:
    es: "De acuerdo con el artículo 44.3 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, la competencia para el ejercicio del control financiero de subvenciones corresponde a:"
  options:
  - id: a
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "La Dirección General de Presupuestos del Ministerio de Hacienda."
  - id: c
    text:
      es: "El Tribunal de Cuentas, con carácter exclusivo."
  - id: d
    text:
      es: "La Intervención Delegada del departamento que concede la subvención."
  explanation:
    es: "El artículo 44.3 atribuye el control financiero de subvenciones a «la Intervención General de la Administración del Estado», sin perjuicio de las funciones del Tribunal de Cuentas, que por eso no lo ejerce con carácter exclusivo. Ni la Dirección General de Presupuestos ni la Intervención Delegada de un departamento son los órganos que el artículo designa."
  citation: "art. 44.3 LGS"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2017-12902-art-118
- id: m05-l06-q067
  prompt:
    es: "Según el artículo 118.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué establece los requisitos que debe reunir la factura de un contrato menor?"
  options:
  - id: a
    correct: true
    text:
      es: "Las normas de desarrollo de esa Ley."
  - id: b
    text:
      es: "El órgano de contratación, al aprobar el gasto."
  - id: c
    text:
      es: "El pliego de cláusulas administrativas particulares."
  - id: d
    text:
      es: "La Junta Consultiva de Contratación Pública del Estado."
  explanation:
    es: "El artículo 118.3 LCSP dice que, además de la aprobación del gasto, se requerirá la incorporación de la factura, «que deberá reunir los requisitos que las normas de desarrollo de esta Ley establezcan». El órgano de contratación aprueba el gasto, que es otro requisito de la misma frase, y no fija los requisitos de la factura. El pliego de cláusulas administrativas particulares no es el instrumento que nombra el apartado: remite a las normas de desarrollo de la Ley. La Junta Consultiva de Contratación Pública del Estado tampoco: el apartado atribuye los requisitos de la factura a las normas de desarrollo."
  citation: "art. 118.3 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2003-20977-art-8
- id: m05-l06-q068
  prompt:
    es: "Según la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿cuándo deben concretar en un plan estratégico de subvenciones sus objetivos, plazo, costes y fuentes de financiación quienes propongan establecer subvenciones?"
  options:
  - id: a
    text:
      es: "Al aprobar las bases reguladoras de cada línea de ayudas."
  - id: b
    text:
      es: "Con la publicación de cada convocatoria en el diario oficial."
  - id: c
    correct: true
    text:
      es: "Con carácter previo al establecimiento de las subvenciones."
  - id: d
    text:
      es: "Una vez concedidas las primeras subvenciones del ejercicio."
  explanation:
    es: "Según el artículo 8.1, quienes propongan establecer subvenciones deben concretar «con carácter previo» el plan estratégico con los objetivos y efectos, el plazo, los costes previsibles y las fuentes de financiación. Hacerlo al aprobar las bases, al publicar cada convocatoria o después de las primeras concesiones llegaría tarde: el plan precede al establecimiento de las subvenciones."
  citation: "art. 8.1 LGS"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-20977-art-9
- id: m05-l06-q070
  prompt:
    es: "¿Cuál de los siguientes debe aprobarse, según la Ley 38/2003, de 17 de noviembre, General de Subvenciones, con carácter previo al otorgamiento de las subvenciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Las normas que establezcan las bases reguladoras de la concesión."
  - id: b
    text:
      es: "La resolución definitiva de concesión de cada subvención."
  - id: c
    text:
      es: "La cuenta justificativa presentada por cada beneficiario."
  - id: d
    text:
      es: "Los pagos a cuenta previstos para el primer ejercicio."
  explanation:
    es: "El artículo 9.2 exige que, antes de otorgar las subvenciones, se aprueben «las normas que establezcan las bases reguladoras de concesión». La resolución de concesión es el otorgamiento mismo, la cuenta justificativa llega después del gasto y los pagos a cuenta son posteriores a la concesión."
  citation: "art. 9.2 LGS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-9
- id: m05-l06-q077
  prompt:
    es: "De acuerdo con el artículo 9.4 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, además de la competencia del órgano concedente, el otorgamiento de una subvención debe cumplir este requisito:"
  options:
  - id: a
    text:
      es: "El informe previo del Tribunal de Cuentas sobre cada concesión, cualquiera que sea su cuantía."
  - id: b
    text:
      es: "La autorización previa del Consejo de Ministros para toda concesión, cualquiera que sea su cuantía."
  - id: c
    text:
      es: "La publicación previa de cada concesión en el Boletín Oficial del Estado, antes de su resolución."
  - id: d
    correct: true
    text:
      es: "La fiscalización previa de los actos administrativos de contenido económico, en los términos previstos en las leyes."
  explanation:
    es: "El artículo 9.4 exige, entre los requisitos del otorgamiento, «la fiscalización previa de los actos administrativos de contenido económico, en los términos previstos en las leyes». El informe previo del Tribunal de Cuentas no figura entre esos requisitos. La autorización del Consejo de Ministros solo se exige a las concesiones de más de 12 millones de euros (artículo 10.2), no a todas. La publicación previa de cada concesión tampoco es un requisito del artículo 9.4."
  citation: "art. 9.4 LGS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-10
- id: m05-l06-q078
  prompt:
    es: "El director de un organismo público vinculado a la Administración General del Estado concede una subvención de dos millones de euros. ¿Qué exige el artículo 10.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, con carácter previo?"
  options:
  - id: a
    correct: true
    text:
      es: "Que exista consignación presupuestaria para este fin."
  - id: b
    text:
      es: "Que el Consejo de Ministros autorice la concesión, cualquiera que sea la cuantía."
  - id: c
    text:
      es: "Que se haya desconcentrado la facultad de conceder."
  - id: d
    text:
      es: "Que la Intervención General informe la concesión."
  explanation:
    es: "El artículo 10.1 atribuye la concesión a los presidentes o directores de los organismos vinculados o dependientes de la Administración General del Estado «previa consignación presupuestaria para este fin». La autorización del Consejo de Ministros solo se exige por encima de 12 millones de euros (artículo 10.2), y dos millones no llegan a esa cuantía. La desconcentración por real decreto es una facultad que prevé el artículo 10.3, no un requisito previo. El artículo 10.1 no prevé informe de la Intervención General."
  citation: "art. 10.1 LGS"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2003-20977-art-34
- id: m05-l06-q083
  prompt:
    es: "Según el artículo 34.3 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿qué debe justificar el beneficiario para que se le pague la subvención?"
  options:
  - id: a
    text:
      es: "La aprobación del gasto de la subvención por el órgano competente."
  - id: b
    text:
      es: "La existencia de crédito adecuado y suficiente en el ejercicio de la concesión."
  - id: c
    text:
      es: "La tramitación del procedimiento de concesión conforme a las normas aplicables."
  - id: d
    correct: true
    text:
      es: "La realización de la actividad, proyecto, objetivo o adopción del comportamiento para el que se concedió."
  explanation:
    es: "El artículo 34.3 dispone que el pago se realiza «previa justificación, por el beneficiario, de la realización de la actividad, proyecto, objetivo o adopción del comportamiento para el que se concedió». La aprobación del gasto, la existencia de crédito y la tramitación del procedimiento son requisitos del otorgamiento (artículo 9.4) que corresponde cumplir al órgano concedente, no cosas que justifique el beneficiario para cobrar."
  citation: "art. 34.3 LGS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-37
- id: m05-l06-q086
  prompt:
    es: "Un beneficiario presenta la cuenta justificativa, pero los justificantes no cubren todo el gasto subvencionado. Según el artículo 37.1 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿qué procede?"
  options:
  - id: a
    text:
      es: "La pérdida del derecho a futuras subvenciones, sin devolver lo percibido."
  - id: b
    text:
      es: "La compensación del defecto con la subvención de la siguiente convocatoria."
  - id: c
    correct: true
    text:
      es: "El reintegro de las cantidades percibidas, con el interés de demora."
  - id: d
    text:
      es: "La devolución de lo percibido sin interés de demora, por no mediar falseamiento."
  explanation:
    es: "El artículo 37.1.c) incluye entre las causas de reintegro la «justificación insuficiente», y el reintegro de las cantidades percibidas lleva «la exigencia del interés de demora correspondiente» desde el pago. La pérdida de futuras subvenciones sin devolución, la compensación con la siguiente convocatoria y la devolución sin interés por falta de falseamiento no están en el artículo: el interés se exige también cuando no hay falseamiento."
  citation: "art. 37.1 LGS"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1996-2627-regla-42
- id: m05-l06-q087
  prompt:
    es: "En la tramitación anticipada de un expediente de contratación, ¿qué expide el Servicio gestor y remite a la oficina de contabilidad para obtener el certificado de cumplimiento de los límites o importes autorizados?"
  options:
  - id: a
    text:
      es: "Un documento A de «tramitación anticipada» con el importe de cada ejercicio posterior afectado."
  - id: b
    text:
      es: "Un documento AD de «tramitación anticipada» con el importe de cada ejercicio posterior afectado."
  - id: c
    correct: true
    text:
      es: "Un documento RC de «tramitación anticipada» con el importe de cada ejercicio posterior afectado."
  - id: d
    text:
      es: "Un documento D de «tramitación anticipada» con el importe de cada ejercicio posterior afectado."
  explanation:
    es: "La regla 42.2.b) de la Instrucción de operatoria contable pide, para obtener ese certificado, que el Servicio gestor expida y remita a la oficina de contabilidad «un documento RC de \"tramitación anticipada\"» con el importe que corresponde a cada uno de los ejercicios posteriores afectados. El documento A de «tramitación anticipada» se expide después, una vez autorizado el gasto, y el D o el AD de «tramitación anticipada» cuando se adjudica y formaliza el contrato o se acumulan las fases (regla 42.3); ninguno sirve para obtener el certificado."
  citation: "regla 42.2.b) IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q088
  prompt:
    es: "En un contrato de la Administración General del Estado, ¿a partir de qué demora en el pago del precio tiene el contratista derecho a resolver el contrato y al resarcimiento de los perjuicios?"
  options:
  - id: a
    text:
      es: "Una demora de la Administración superior a cuatro meses."
  - id: b
    correct: true
    text:
      es: "Una demora de la Administración superior a seis meses."
  - id: c
    text:
      es: "Una demora de la Administración superior a tres meses."
  - id: d
    text:
      es: "Una demora de la Administración superior a ocho meses."
  explanation:
    es: "El artículo 198.6 da ese derecho «si la demora de la Administración fuese superior a seis meses». Con más de cuatro meses el artículo 198.5 permite al contratista suspender el cumplimiento del contrato, pero todavía no resolverlo. Tres meses no es ningún umbral del artículo 198. Ocho meses llega tarde: con siete meses de demora el derecho ya existe."
  citation: "art. 198.6 LCSP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2003-20977-art-10
- id: m05-l06-q089
  prompt:
    es: "La normativa reguladora de una subvención estatal de 20 millones de euros no dice nada sobre su autorización. Según el artículo 10.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, la concesión requiere la previa autorización de:"
  options:
  - id: a
    text:
      es: "La Comisión Delegada del Gobierno para Asuntos Económicos."
  - id: b
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios."
  - id: c
    text:
      es: "El Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "Por encima de 12 millones de euros, el artículo 10.2 exige «la previa autorización del Consejo de Ministros». La Comisión Delegada del Gobierno para Asuntos Económicos solo autoriza «en el caso de que así lo establezca la normativa reguladora de la subvención», y aquí no lo establece. La Comisión General de Secretarios de Estado y Subsecretarios y el Ministro de Hacienda no aparecen en el artículo como órganos de autorización."
  citation: "art. 10.2 LGS"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2006-13371-art-56
- id: m05-l06-q090
  prompt:
    es: "Según el artículo 56.3 del Real Decreto 887/2006, de 21 de julio, para la convocatoria aprobada en el ejercicio anterior al de su resolución, el certificado de existencia de crédito se sustituye por otro de la oficina presupuestaria que acredita:"
  options:
  - id: a
    correct: true
    text:
      es: "La concurrencia de alguna de las circunstancias que enumera el apartado 1 del artículo."
  - id: b
    text:
      es: "La fiscalización previa de conformidad del gasto por la Intervención Delegada competente."
  - id: c
    text:
      es: "La aprobación del gasto por el órgano competente para conceder la subvención."
  - id: d
    text:
      es: "La retención del crédito en el presupuesto del ejercicio en que se convoca."
  explanation:
    es: "En el expediente de gasto previo a la convocatoria tramitada anticipadamente, el artículo 56.3 sustituye el certificado de existencia de crédito por uno de la oficina presupuestaria del Departamento ministerial «en el que se haga constar que concurre alguna de las circunstancias mencionadas en el apartado 1»: que exista normalmente crédito en los Presupuestos Generales del Estado o que exista en el proyecto del ejercicio siguiente. El certificado no acredita la fiscalización de la Intervención ni la aprobación del gasto, y no puede acreditar una retención en el ejercicio de la convocatoria, porque el gasto se ejecuta en el ejercicio de la concesión."
  citation: "art. 56.3 RLGS"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-20977-art-30
- id: m05-l06-q091
  prompt:
    es: "Las bases reguladoras de una subvención fijan dos meses para rendir la cuenta justificativa. Según el artículo 30.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿qué plazo rige?"
  options:
  - id: a
    text:
      es: "El de tres meses que fija la ley, porque prevalece sobre el plazo de las bases."
  - id: b
    correct: true
    text:
      es: "El de dos meses, porque el plazo de rendición lo determinan las bases reguladoras."
  - id: c
    text:
      es: "El de tres meses, porque las bases no pueden fijar un plazo más breve que el legal."
  - id: d
    text:
      es: "El de dos meses, pero solo si la convocatoria lo reproduce de forma expresa."
  explanation:
    es: "El artículo 30.2 dice que «la forma de la cuenta justificativa y el plazo de rendición de la misma vendrán determinados por las correspondientes bases reguladoras». Los tres meses solo se aplican «a falta de previsión de las bases reguladoras», así que no prevalecen sobre un plazo fijado en ellas ni funcionan como plazo mínimo. El artículo no exige que la convocatoria repita el plazo de las bases."
  citation: "art. 30.2 LGS"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2003-20977-art-30
- id: m05-l06-q092
  prompt:
    es: "El plazo para realizar la actividad subvencionada finaliza el miércoles 14 de abril de 2027 y las bases no prevén plazo de justificación. Según el artículo 30.2 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, contando de fecha a fecha, ¿hasta qué día cabe presentar la cuenta?"
  options:
  - id: a
    text:
      es: "El viernes 14 de mayo de 2027."
  - id: b
    text:
      es: "El lunes 14 de junio de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles 14 de julio de 2027."
  - id: d
    text:
      es: "El jueves 14 de octubre de 2027."
  explanation:
    es: "A falta de previsión de las bases, el artículo 30.2 da como máximo «tres meses desde la finalización del plazo para la realización de la actividad». Ese plazo finaliza el miércoles 14 de abril de 2027; tres meses de fecha a fecha llevan al miércoles 14 de julio de 2027, día laborable, así que no hay traslado. El viernes 14 de mayo cuenta un mes y el lunes 14 de junio dos. El jueves 14 de octubre cuenta seis meses, el doble del plazo legal."
  citation: "art. 30.2 LGS"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2017-12902-art-118
- id: m05-l06-q093
  prompt:
    es: "Según el artículo 118.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, a la aprobación del gasto de un contrato menor se incorpora la factura, que deberá reunir los requisitos que:"
  options:
  - id: a
    text:
      es: "fije el órgano de contratación en su informe de necesidad."
  - id: b
    text:
      es: "fije el pliego de cláusulas administrativas del contrato."
  - id: c
    correct: true
    text:
      es: "las normas de desarrollo de esa Ley establezcan."
  - id: d
    text:
      es: "señale la Intervención al fiscalizar el gasto."
  explanation:
    es: "El artículo 118.3 dice que la factura incorporada al expediente «deberá reunir los requisitos que las normas de desarrollo de esta Ley establezcan». No los fija el informe del órgano de contratación, que justifica la necesidad del contrato; el contrato menor no lleva pliego de cláusulas administrativas particulares en este artículo, y la Intervención tampoco los señala, porque los contratos menores no están sometidos a fiscalización previa."
  citation: "art. 118.3 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-118
- id: m05-l06-q094
  prompt:
    es: "¿Qué se requiere en el expediente de un contrato menor, además del informe sobre la necesidad del contrato, según el artículo 118.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "La aprobación del gasto y la incorporación de la factura correspondiente."
  - id: b
    text:
      es: "La aprobación del gasto y la formalización del contrato por escrito."
  - id: c
    text:
      es: "La retención del crédito y la constitución de la garantía definitiva."
  - id: d
    text:
      es: "La fiscalización previa de la Intervención y la incorporación de la factura."
  explanation:
    es: "El artículo 118.3 requiere «la aprobación del gasto y la incorporación al mismo de la factura correspondiente». La formalización por escrito y la garantía definitiva no son exigencias del contrato menor, y la fiscalización previa de la Intervención tampoco: el artículo 151.a) de la Ley 47/2003 excluye de ella a los contratos menores."
  citation: "art. 118.3 LCSP"
