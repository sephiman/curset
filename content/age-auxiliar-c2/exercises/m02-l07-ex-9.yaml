# anchor: fuente-ms-win-recortes-html
- id: m02-l07-q164
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿qué hace la característica Captura de pantalla perfecta de la herramienta Recortes?"
  options:
  - id: a
    text:
      es: "Captura valores de color exactos desde cualquier lugar de la pantalla elegido"
  - id: b
    correct: true
    text:
      es: "Ajusta el área de captura para encuadrar el contenido de la pantalla"
  - id: c
    text:
      es: "Extrae y copia el texto del recorte con reconocimiento óptico de caracteres"
  - id: d
    text:
      es: "Retrasa la captura entre 1 y 5 segundos, según el modo elegido"
  explanation:
    es: "La página dice que Perfect screenshot ajusta automáticamente el área de captura para encuadrar el contenido en pantalla, lo que reduce la necesidad de recortar después. Capturar valores de color es el Selector de color, extraer texto es Acciones de texto y retrasar la captura es Alt+D."
  citation: "fuente: `ms-win-recortes.html`; «Usar las características de Copilot+ PC en la herramienta Recortes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-recortes-html
- id: m02-l07-q165
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿qué captura la característica Selector de color de la herramienta Recortes?"
  options:
  - id: a
    correct: true
    text:
      es: "Valores de color exactos de cualquier lugar de la pantalla"
  - id: b
    text:
      es: "Una forma libre dibujada alrededor de un objeto"
  - id: c
    text:
      es: "El texto de una imagen mediante reconocimiento óptico"
  - id: d
    text:
      es: "Un clip de vídeo de una selección rectangular"
  explanation:
    es: "La página dice que el Selector de color captura valores de color exactos desde cualquier lugar de la pantalla. Dibujar una forma libre es un tipo de recorte, extraer texto es Acciones de texto y el clip de vídeo es el recorte de vídeo."
  citation: "fuente: `ms-win-recortes.html`; «Usar las características de Copilot+ PC en la herramienta Recortes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q166
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a Paint en Windows 11, según la página de Microsoft sobre esta aplicación?"
  options:
  - id: a
    correct: true
    text:
      es: "Una aplicación de edición gráfica para crear y editar imágenes y dibujos"
  - id: b
    text:
      es: "Una aplicación para capturar la pantalla y compartir las capturas con otras personas"
  - id: c
    text:
      es: "Un editor de texto sin formato para archivos con extensión .txt"
  - id: d
    text:
      es: "Una aplicación de cálculo con modos científico y de gráficos"
  explanation:
    es: "La página dice que Paint es una app de edición gráfica versátil y fácil de usar para crear, editar y manipular imágenes y dibujos. Capturar la pantalla es lo que hace Recortes, el texto sin formato es del Bloc de notas y los modos científico y de gráficos son de la Calculadora."
  citation: "fuente: `ms-win-paint.html`; «¿Qué es Paint?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q167
  prompt:
    es: "¿Cuál de las siguientes tareas es propia de Paint, según la página de Microsoft sobre esta aplicación de Windows 11?"
  options:
  - id: a
    text:
      es: "Calcular diferencias entre dos fechas y convertir unidades y monedas"
  - id: b
    text:
      es: "Programar alarmas y temporizadores que suenan con la aplicación cerrada"
  - id: c
    text:
      es: "Grabar un vídeo de una selección rectangular de la pantalla y editarlo en Clipchamp"
  - id: d
    correct: true
    text:
      es: "Recortar y cambiar el tamaño de imágenes, dibujar y añadir formas y texto"
  explanation:
    es: "La página dice que Paint es ideal para el recorte, el cambio de tamaño y el dibujo sencillos, así como para añadir formas básicas y texto a las imágenes. Calcular fechas y convertir monedas es de la Calculadora, las alarmas y los temporizadores son del Reloj y grabar un recorte de vídeo es de Recortes."
  citation: "fuente: `ms-win-paint.html`; «¿Qué es Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q168
  prompt:
    es: "Señale la afirmación correcta sobre Paint en Windows 11, según la página de Microsoft sobre esta aplicación:"
  options:
  - id: a
    text:
      es: "Se compra por separado en Microsoft Store con licencia"
  - id: b
    correct: true
    text:
      es: "Se incluye en Windows, sin necesidad de comprarla por separado"
  - id: c
    text:
      es: "Es una función de la herramienta Recortes y no una aplicación"
  - id: d
    text:
      es: "Solo se incluye en las ediciones de Windows para administradores"
  explanation:
    es: "La página dice que Paint se incluye en Windows. Comprarlo por separado, que sea una función de Recortes o que solo venga en ediciones para administradores contradice esa frase, y la propia página lo presenta como una app de edición gráfica de Windows."
  citation: "fuente: `ms-win-paint.html`; «¿Cuánto cuesta Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m02-l07-q169
  prompt:
    es: "En un equipo con Windows 11, la aplicación Asistencia rápida se instala, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "en Windows Update, como una actualización de características de Windows"
  - id: b
    text:
      es: "en Herramientas de Windows, como herramienta administrativa"
  - id: c
    text:
      es: "en Configuración › Sistema › Acerca de, con el botón Instalar"
  - id: d
    correct: true
    text:
      es: "en Microsoft Store, buscándola y seleccionando Obtener o Instalar"
  explanation:
    es: "La página dice que se selecciona Iniciar, Todas las aplicaciones y Microsoft Store, donde se busca Asistencia rápida y se selecciona Obtener o Instalar. Windows Update, Herramientas de Windows y Acerca de de Configuración contradicen esa vía de instalación: Herramientas de Windows es una carpeta del Panel de control y Acerca de muestra datos del dispositivo."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Instalar Asistencia rápida»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q254
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la aplicación Asistencia rápida, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Windows+Ctrl+D"
  - id: b
    text:
      es: "Windows+Ctrl+F"
  - id: c
    text:
      es: "Windows+K"
  - id: d
    correct: true
    text:
      es: "Windows+Ctrl+Q"
  explanation:
    es: "Windows+Ctrl+Q abre Asistencia rápida. Windows+Ctrl+F busca dispositivos en una red, Windows+K abre Transmitir desde Configuración rápida y Windows+Ctrl+D crea otro escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m02-l07-q266
  prompt:
    es: "En la Asistencia rápida de Windows 11, ¿qué hace la persona que recibe la ayuda con el código de 6 dígitos que le ha dado quien la ayuda?"
  options:
  - id: a
    text:
      es: "Lo escribe en el cuadro de diálogo Ejecutar y pulsa Entrar"
  - id: b
    text:
      es: "Lo escribe en Windows Update para aceptar la conexión remota"
  - id: c
    correct: true
    text:
      es: "Lo escribe en el cuadro Código del asistente y selecciona Enviar"
  - id: d
    text:
      es: "Lo comparte de vuelta con quien ayuda para que seleccione Permitir"
  explanation:
    es: "Quien recibe ayuda escribe el código en el cuadro Código del asistente y selecciona Enviar; después selecciona Permitir. El cuadro Ejecutar y Windows Update no intervienen, y el código lo comparte quien ayuda, no quien recibe la ayuda."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Obtener ayuda de alguien de confianza con la Asistencia rápida»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-asistencia-rapida-html
- id: m02-l07-q272
  prompt:
    es: "Señale la afirmación correcta sobre la Asistencia rápida de Windows 11, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "Quien ayuda ve la pantalla de la otra persona sin necesidad de que esta lo permita"
  - id: b
    correct: true
    text:
      es: "Solo debe usarse con personas de confianza, que pueden ver la pantalla o controlar el equipo si se les permite"
  - id: c
    text:
      es: "El código que se comparte tiene cuatro dígitos y caduca al abandonar la sesión de ayuda"
  - id: d
    text:
      es: "Solo funciona entre equipos que están conectados a la misma red local de la organización"
  explanation:
    es: "Asistencia rápida usa una conexión remota, por eso solo debe usarse con personas de confianza, que pueden ver la pantalla o controlar el equipo si se les permite. El código tiene seis dígitos, y la conexión remota no se limita a una red local."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Introducción»"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: fuente-ms-win-calculadora-html
- id: m02-l07-q273
  prompt:
    es: "En la Calculadora de Windows 11, ¿qué modo de cálculo sirve para cálculos avanzados, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Gráficos"
  - id: b
    correct: true
    text:
      es: "Científica"
  - id: c
    text:
      es: "Standard"
  - id: d
    text:
      es: "Programador"
  explanation:
    es: "Científica es el modo para cálculos avanzados. Standard es para aritmética básica, Gráficos traza ecuaciones y Programador trabaja con binario y hexadecimal."
  citation: "fuente: `ms-win-calculadora.html`; «Elegir un modo de cálculo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-calculadora-html
- id: m02-l07-q274
  prompt:
    es: "En la Calculadora de Windows 11, ¿cuál de las siguientes opciones se usa para trabajar con binario, hexadecimal y otras bases, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Científica"
  - id: b
    text:
      es: "Gráficos"
  - id: c
    correct: true
    text:
      es: "Programador"
  - id: d
    text:
      es: "Cálculo de fechas"
  explanation:
    es: "Programador es el modo de binario, hexadecimal y mucho más. Científica es para cálculos avanzados, Gráficos para trazar ecuaciones y Cálculo de fechas para diferencias entre fechas."
  citation: "fuente: `ms-win-calculadora.html`; «Elegir un modo de cálculo»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-calculadora-html
- id: m02-l07-q275
  prompt:
    es: "Señale la afirmación correcta sobre los convertidores integrados de la Calculadora de Windows 11, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "Se activan con Alt+Flecha arriba, que mantiene la Calculadora encima de las demás"
  - id: b
    correct: true
    text:
      es: "Se abren desde Abrir navegación (☰); se escribe un valor y se eligen unidades"
  - id: c
    text:
      es: "Solo están disponibles en el modo Programador, con las unidades en binario"
  - id: d
    text:
      es: "Se abren desde el Historial; se escribe un valor y se pulsa MR para convertirlo"
  explanation:
    es: "Los convertidores se eligen en el menú Abrir navegación (☰); se escribe un valor y se seleccionan las unidades desde y hacia. El Historial sirve para revisar cálculos, MR es un botón de memoria y Alt+Flecha arriba mantiene la Calculadora visible."
  citation: "fuente: `ms-win-calculadora.html`; «Convertir valores»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q276
  prompt:
    es: "En Paint de Windows 11, ¿cuál de las siguientes herramientas sirve para rellenar áreas cerradas con un color seleccionado?"
  options:
  - id: a
    text:
      es: "Lápiz"
  - id: b
    text:
      es: "Borrador"
  - id: c
    text:
      es: "Pincel"
  - id: d
    correct: true
    text:
      es: "Relleno con color"
  explanation:
    es: "Relleno con color rellena áreas cerradas con el color elegido. El Pincel pinta con distintos estilos y tamaños, el Lápiz dibuja a mano alzada y el Borrador quita partes del dibujo."
  citation: "fuente: `ms-win-paint.html`; «¿Cuáles son las herramientas de dibujo en Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q277
  prompt:
    es: "En Paint de Windows 11, ¿para qué sirve la herramienta Pincel, según la página de Microsoft sobre la aplicación?"
  options:
  - id: a
    text:
      es: "Para acercar o alejar el lienzo del dibujo con precisión"
  - id: b
    text:
      es: "Para quitar partes del dibujo o de la imagen que se ha creado"
  - id: c
    correct: true
    text:
      es: "Para pintar con distintos estilos y tamaños de pincel"
  - id: d
    text:
      es: "Para dibujar a mano alzada con un trazo fijo y de un solo grosor"
  explanation:
    es: "El Pincel pinta con distintos estilos y tamaños. Dibujar a mano alzada es el Lápiz, quitar partes es el Borrador y acercar o alejar es el Zoom."
  citation: "fuente: `ms-win-paint.html`; «¿Cuáles son las herramientas de dibujo en Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q278
  prompt:
    es: "Señale la afirmación correcta sobre cómo cambiar el tamaño de una imagen en Paint de Windows 11, según Microsoft:"
  options:
  - id: a
    text:
      es: "Se selecciona Recortar en la pestaña Inicio y se arrastra el borde de la imagen hasta el tamaño deseado"
  - id: b
    text:
      es: "Se selecciona Formas en la pestaña Inicio y se indican las dimensiones en centímetros"
  - id: c
    correct: true
    text:
      es: "Se selecciona Cambiar tamaño en la pestaña Inicio y se indican píxeles o porcentaje"
  - id: d
    text:
      es: "Se usa la herramienta Zoom, que cambia el tamaño real de la imagen guardada"
  explanation:
    es: "Cambiar tamaño está en la pestaña Inicio y admite dimensiones en píxeles o como porcentaje del original. Recortar quita la parte no seleccionada, el Zoom solo acerca o aleja el lienzo y Formas dibuja líneas, rectángulos y círculos."
  citation: "fuente: `ms-win-paint.html`; «¿Hay una manera de cambiar el tamaño de una imagen en Paint?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-paint-html
- id: m02-l07-q280
  prompt:
    es: "En Paint de Windows 11, ¿cómo se recorta una imagen para conservar solo una parte?"
  options:
  - id: a
    text:
      es: "Con la herramienta Borrador, que quita lo no seleccionado de la imagen"
  - id: b
    text:
      es: "Seleccionando esa parte con Lápiz y pulsando Cambiar tamaño en la pestaña Inicio"
  - id: c
    correct: true
    text:
      es: "Seleccionando esa parte con Seleccionar y pulsando Recortar en la pestaña Inicio"
  - id: d
    text:
      es: "Con Relleno con color sobre la parte de la imagen que se quiere conservar"
  explanation:
    es: "Se selecciona la parte que se quiere conservar con la herramienta Seleccionar y se pulsa Recortar en la pestaña Inicio, que quita la parte no seleccionada. Cambiar tamaño modifica las dimensiones, el Borrador quita partes de la imagen y Relleno con color solo colorea áreas cerradas."
  citation: "fuente: `ms-win-paint.html`; «¿Cómo puedo recortar una imagen en Paint?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
