# Normativa del programa: Cuerpo General Administrativo de la AGE, especialidad de Agentes de la Hacienda Pública (AEAT),
# acceso libre.
# Fuente del programa: Resolución de 22-12-2025 de la Presidencia de la AEAT (BOE-A-2025-27056), Anexo I (32 temas:
# I.1–I.7, II.1–II.5, III.1–III.20; la numeración por epígrafes es del curso, véase sources/programa.md).
# Rige la legislación vigente a la fecha de cada ejercicio. El examen de la próxima convocatoria será en 2027.
# Construido: 2026-11-11 (ronda R0a del curso aeat-agentes-hacienda), a partir de content/age-auxiliar-c2/sources/normativa.yaml
# (construido 2026-11-05), de content/age-administrativo-c1/sources/normativa.yaml (2026-10-16, para las normas que C2 no
# tiene), del texto del programa y de las normas que citan los 680 cuestionarios del primer ejercicio (2020–2025,
# docs/age-verification/aeat/r0a/checks/norms_cited.txt).
# Verificación (2026-11-11): para cada norma con boe_id, la página https://www.boe.es/buscar/act.php?id=<ID> («Última
# actualización publicada el», título, aviso de derogación) y la API de datos abiertos del BOE
# (legislacion-consolidada/id/<ID>/analisis: modificaciones de 2025–2026 y notas de entrada en vigor). El texto de cada norma
# modificadora con efectos futuros se leyó en el BOE (diario_boe/xml.php) para fijar sus fechas. Los sumarios diarios del
# BOE del 28-09-2026 al 11-11-2026 se revisaron en busca de acuerdos de convalidación o derogación de reales decretos-leyes.
# Normas de la UE: identificador CELEX, vigencia, versiones consolidadas y actos modificativos comprobados en el SPARQL de la
# Oficina de Publicaciones; ficheros descargados del Cellar (publications.europa.eu/resource/celex/<id>).
# Scripts: docs/age-verification/aeat/r0a/scripts/norm/; informes: docs/age-verification/aeat/r0a/checks/norm_*.json.
#
# Campos: los mismos que en C1 (véase la cabecera de content/age-administrativo-c1/sources/normativa.yaml) y C2, con estas
# diferencias:
#   temas               temas del programa de Agentes (I.1–I.7, II.1–II.5, III.1–III.20)
#   consolidated_as_of  «Última actualización publicada el» en boe.es el 2026-11-11; sin esa línea (norma nunca
#                       modificada o fuera de la colección consolidada), la fecha de publicación. UE: fecha de la versión
#                       consolidada usada.
#   origen              «copiado de age-auxiliar-c2» o «copiado de age-administrativo-c1»: el fichero se copió con el mismo
#                       nombre y se comprobó que el sha256 es el mismo; «descarga nueva»: ningún curso lo tiene, o boe.es
#                       tiene una consolidación posterior a la copia; «no localizada».
#   amended_2025_2026   modificaciones de 2025–2026 que boe.es lista en el análisis (en las normas nuevas, con el texto del
#                       análisis y el identificador entre paréntesis; no se listan las normas «dictadas de conformidad»
#                       ni los recursos y cuestiones pendientes).
#   cambios_pendientes  solo modificaciones publicadas con efectos posteriores al 2026-11-11 (los reales decretos-leyes
#                       publicados el 11-11-2026 entran en vigor el 12-11-2026 y figuran aquí).
#   cambios_aplicados   como en C2: cambios que eran pendientes en una copia anterior y cuya entrada en vigor ya pasó.
#   tags                cambio-pendiente: hay cambios_pendientes. anual: la norma fija cifras para un año concreto
#                       (Ley de Presupuestos, órdenes de módulos).
#   cifras_anuales      (nuevo, requisito R3.5 del curso) cifras que fija cada año una norma y de las que dependen el texto
#                       de la norma o su tema: cifra, valor_2026, norma que la fija para el año en curso, boe_id, precepto,
#                       desde (fecha de efectos o de entrada en vigor) y, si hace falta, nota; valor_2027 y norma_2027 cuando
#                       la norma del año siguiente ya está publicada. Cada valor se leyó en el texto descargado. La ronda de
#                       la convocatoria vuelve a comprobarlas todas para el año del examen. Las que fija la Ley 31/2022
#                       (interés legal, interés de demora, IPREM) llevan además texto (la disposición, literal),
#                       vigencia_2026 y estado: «fuente legal; no contrastado con la sede de la AEAT». Ronda R1
#                       (2026-11-11): un intento con el navegador (Playwright, Chromium) sobre la calculadora de
#                       intereses de la sede (www2.agenciatributaria.gob.es/wlpl/TGIN-CONS/calc/af/calcAfA.faces) cargó
#                       la página (200), pero su tabla de tipos se rellena al abrir un diálogo y quedó vacía («No se
#                       encontraron registros»): no hay copia guardada y el estado no cambia.
# Ficheros: 53 copiados de C2 o C1 (mismo nombre y sha256, comprobado fichero a fichero) y 41 de descarga
# nueva del 2026-11-11 (PDF consolidado de boe.es, PDF del diario oficial para las normas modificadoras, Cellar para
# la UE). El detalle, con los sha256, está en docs/age-verification/aeat/r0a/checks/norm_build_report.json.
# Ronda R2 (2026-11-11, parte común): tres copias más de C2 con el mismo sha256 (LO 3/1980, Orden TDF/379/2024, Resolución
# de 14-04-2026), para las frases copiadas que las citan, y dos descargas nuevas para «Ciudades Autónomas» de I.4 (LO 1/1995
# y LO 2/1995, Estatutos de Ceuta y Melilla). Detalle: docs/aeat-theory-ledger.md.
# Ronda R2 (2026-11-11, parte tributaria): 13 descargas nuevas para III.1, III.4–III.7 (Ley 19/1991, Ley 29/1987, RDL 1/1993,
# Ley 38/1992, RDL 5/2004, Ley 38/2022, Código de Comercio, RD 1676/2009, Orden EHA/586/2011 y las órdenes HAC/1398/2003,
# HAC/342/2021, HAC/266/2024 y HAC/277/2026 a las que remiten los arts. 67 y 67 bis RIRPF y 49 y 49 ter RGAT). PDF consolidado
# de boe.es, salvo la Orden HAC/266/2024 (PDF del diario, no consolidada).
# Ronda R2b (2026-11-11): 13 normas que las lecciones nombran solo dentro del texto de otra («nombrado/citado en…» en
# «Normativa»): 11 descargas nuevas de boe.es y 2 copias de C1 con el mismo sha256 (Ley 7/1988, Estatuto de los Trabajadores).
# Detalle: docs/age-verification/aeat/r2b/currency/normativa.md.
# Descargas nuevas de normas que C2 tiene: Ley 39/2006 y LGSS (boe.es las actualizó el 11-11-2026 por los RDL 36/2026 y
# 35/2026; C2 tiene las consolidaciones de 03-10-2026 y 21-10-2026).
# Reglas de cita (R3.5 de los requisitos del Administrativo): las lecciones citan la versión posterior (la de
# cambios_pendientes); las entradas con cambio-pendiente se revisan si el examen cae antes de la fecha de efectos.
# Reales decretos-leyes pendientes de convalidación el 2026-11-11 (art. 86.2 CE; sin acuerdo publicado en el BOE): RDL 29/2026
# (vivienda; modifica LIRPF, RIRPF, LIVA, RGAT, TRLRHL y LEC; el RDL 26/2026, de igual contenido, fue derogado por el Congreso
# el 02-10-2026, BOE-A-2026-20526), RDL 31/2026, RDL 33/2026, RDL 35/2026 y RDL 36/2026. Si alguno se deroga, sus cambios
# decaen y las entradas afectadas vuelven a la redacción anterior. Lista de reversión del RDL 29/2026 (precepto a precepto, con
# dónde está la redacción anterior): docs/age-verification/aeat/r1/rdl-29-2026-revert-list.md. Plazo de convalidación del
# RDL 29/2026: 19-11-2026 (publicación el 07-10-2026 más 30 días hábiles, sin sábados, domingos ni el 12-10; art. 86.2 CE,
# arts. 90.1 y 151.1 del Reglamento del Congreso; fiestas de 2026 según BOE-A-2025-21667). Variantes y fuentes en esa lista.
# Normas de C2/C1 que no entran: las de temas del Auxiliar o del Administrativo que este programa no tiene (información
# administrativa, archivos, accesibilidad, ventanilla única, ENS, ofimática, contratos, subvenciones, gestión presupuestaria,
# retribuciones e indemnizaciones, personal laboral).
# Normas citadas en los cuestionarios que no entran:
#   - por temas que el programa de 2025 suprimió (contrabando, gestión censal, declaraciones informativas): RD 1165/1995
#     (2023-28), LO 12/1995 de represión del contrabando (2022X-97), Ley 5/2020 del Impuesto sobre Transacciones Financieras
#     (2022-32), Ley 7/2022 de residuos (impuestos medioambientales, 2022X-100, 2024-71), Orden EHA/1274/2007 (modelos 036 y
#     037, 2021-49). Entran después, solo para III.1 («impuestos de titularidad estatal y sus características»; ronda R2,
#     2026-11-11): Ley 38/1992 de Impuestos Especiales (art. 1; 2022X-99, 2024-2), TRLIRNR RDL 5/2004 (2024-29) y Ley 38/2022
#     (art. 3, ITSGF; 2023-87);
#   - por estar derogadas: Orden HAP/2178/2015 (límite de garantías de 30.000 €, derogada por la Orden HFP/311/2023);
#     Resolución de 19-02-2004 de la AEAT (Gestión Tributaria, derogada por la de 13-01-2021); la Ley 1/1998 de derechos y
#     garantías de los contribuyentes;
#   - por no ser base de ningún tema de 2025: LO 2/2012 de Estabilidad Presupuestaria (2022-31), Ley 37/2007 de reutilización
#     de la información del sector público (2021-13), Ley 7/2012 de prevención del fraude (ningún tema la nombra; su límite de
#     pagos en efectivo no es de III.9, que trata el pago de la deuda tributaria). LO 5/2000 y RDL 9/1993 (2020-85) solo se
#     nombran dentro del art. 7 LIRPF.
#   - erratas de los enunciados: «Ley 58/2023» = Ley 58/2003; «Ley 27/2004» = Ley 27/2014; «Ley 29/1988» = Ley 29/1998;
#     «LO 3/2017» = LO 3/2007; «Reglamento (UE) 2016/1979» (2022X-13) = Reglamento (UE) 2016/679; la «Resolución de 13 de
#     enero de 2021 … estructura y organización territorial» (2024-27) es BOE-A-2021-519.

