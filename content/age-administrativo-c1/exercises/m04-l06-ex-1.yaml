# anchor: boe-a-1985-151-art-1
- id: m04-l06-q001
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el personal comprendido en su ámbito de aplicación:"
  options:
  - id: a
    text:
      es: "No podrá compatibilizar sus actividades con un segundo puesto, cargo o actividad en el sector público en ningún caso, sin excepciones."
  - id: b
    text:
      es: "Podrá compatibilizar sus actividades con un segundo puesto en el sector público si no supera la mitad de la jornada ordinaria."
  - id: c
    correct: true
    text:
      es: "No podrá compatibilizar sus actividades con un segundo puesto, cargo o actividad en el sector público, salvo en los supuestos previstos en la Ley."
  - id: d
    text:
      es: "Podrá compatibilizar sus actividades con un segundo puesto en el sector público si lo comunica antes a su Subsecretaría."
  explanation:
    es: "El artículo 1.1 prohíbe el segundo puesto, cargo o actividad en el sector público «salvo en los supuestos previstos en la misma». La opción que lo prohíbe sin excepciones olvida esa salvedad: la propia Ley admite supuestos, como los de las funciones docente y sanitaria. La mitad de la jornada es el umbral del artículo 12.2 para actividades privadas, no una vía para el segundo puesto público. Una comunicación a la Subsecretaría no basta: el segundo puesto exige la previa y expresa autorización de compatibilidad (artículo 3.1)."
  citation: "art. 1.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-1
- id: m04-l06-q002
  prompt:
    es: "Según el artículo 1.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la prohibición de compatibilizar un segundo puesto de trabajo en el sector público alcanza a su desempeño:"
  options:
  - id: a
    text:
      es: "Solo por sí mismo, no mediante sustitución."
  - id: b
    text:
      es: "Solo mediante una sustitución retribuida."
  - id: c
    correct: true
    text:
      es: "Tanto por sí mismo como mediante sustitución."
  - id: d
    text:
      es: "Solo si el segundo puesto es de otra Administración."
  explanation:
    es: "El artículo 1.1 habla del desempeño «por sí o mediante sustitución» de un segundo puesto. Por eso alcanza también la sustitución, retribuida o no. La opción que deja fuera la sustitución contradice ese texto. La que limita la prohibición a la sustitución retribuida añade una condición que el artículo no pone. La que la limita a los puestos de otra Administración también es falsa: el artículo habla del «sector público» sin distinguir Administraciones."
  citation: "art. 1.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q003
  prompt:
    es: "¿Para cuál de las siguientes funciones prevé la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas supuestos de segundo puesto de trabajo en el sector público?"
  options:
  - id: a
    correct: true
    text:
      es: "Para las funciones docente y sanitaria."
  - id: b
    text:
      es: "Para las funciones de inspección y control."
  - id: c
    text:
      es: "Para las funciones de gestión económica y presupuestaria."
  - id: d
    text:
      es: "Para las funciones de registro y atención a la ciudadanía."
  explanation:
    es: "El artículo 3.1 permite el segundo puesto «en los supuestos previstos en la misma para las funciones docente y sanitaria», además de los casos de los artículos 5 y 6 y los que fije el Consejo de Ministros por razón de interés público. Las funciones de inspección y control, las de gestión económica y presupuestaria y las de registro y atención a la ciudadanía no aparecen en esa lista."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q004
  prompt:
    es: "Conforme al artículo 3.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el segundo puesto que el Consejo de Ministros determine por razón de interés público solo podrá prestarse:"
  options:
  - id: a
    text:
      es: "En régimen funcionarial, a tiempo parcial y con duración determinada."
  - id: b
    text:
      es: "En régimen laboral, a tiempo completo y con duración determinada."
  - id: c
    text:
      es: "En régimen laboral, a tiempo parcial y con duración indefinida."
  - id: d
    correct: true
    text:
      es: "En régimen laboral, a tiempo parcial y con duración determinada."
  explanation:
    es: "En los supuestos que fije el Consejo de Ministros por razón de interés público, «la actividad sólo podrá prestarse en régimen laboral, a tiempo parcial y con duración determinada». Cada distractor cambia uno de esos tres rasgos: el régimen funcionarial en lugar del laboral, el tiempo completo en lugar del parcial y la duración indefinida en lugar de la determinada."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q005
  prompt:
    es: "¿Qué órgano determina mediante Real Decreto, por razón de interés público, otros supuestos de segundo puesto en el sector público para el personal de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "El Ministro para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "El Subsecretario del Departamento del puesto principal."
  - id: c
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: d
    text:
      es: "El Secretario de Estado de Función Pública."
  explanation:
    es: "El artículo 3.1 de la Ley 53/1984 admite el segundo puesto en los supuestos que, «por razón de interés público, se determine por el Consejo de Ministros, mediante Real decreto, u órgano de gobierno de la Comunidad Autónoma». Un ministro aprueba órdenes ministeriales, no reales decretos. El Subsecretario interviene proponiendo la autorización de cada caso (artículo 9), no fijando supuestos. El Secretario de Estado de Función Pública tampoco dicta reales decretos."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q006
  prompt:
    es: "Según el artículo 3.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿qué carácter ha de tener la autorización de compatibilidad para ejercer una segunda actividad en el sector público?"
  options:
  - id: a
    text:
      es: "Previa, aunque se entiende concedida si no se resuelve dentro del plazo."
  - id: b
    text:
      es: "Expresa, aunque puede obtenerse después de iniciar la segunda actividad."
  - id: c
    text:
      es: "Previa y expresa solo cuando el segundo puesto sea de otra Administración."
  - id: d
    correct: true
    text:
      es: "Previa y expresa, como requisito indispensable para el ejercicio de esa actividad."
  explanation:
    es: "El artículo 3.1 dice que para la segunda actividad «será indispensable la previa y expresa autorización de compatibilidad». Una autorización que se entiende concedida por no resolver a tiempo no es expresa. Una autorización obtenida después de empezar la actividad no es previa. El artículo exige la autorización en todo caso, también cuando los dos puestos son de la misma Administración."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q007
  prompt:
    es: "Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la autorización de compatibilidad para un segundo puesto o actividad en el sector público:"
  options:
  - id: a
    text:
      es: "Se efectúa según la cualificación del solicitante."
  - id: b
    text:
      es: "Se efectúa solo si el segundo puesto es de la misma Administración."
  - id: c
    correct: true
    text:
      es: "Se efectúa en todo caso en razón del interés público."
  - id: d
    text:
      es: "Se efectúa solo cuando el segundo puesto no está retribuido."
  explanation:
    es: "El artículo 3.1 cierra su primer apartado así: «En todo caso la autorización de compatibilidad se efectuará en razón del interés público». La cualificación del solicitante no es el criterio que fija la Ley. El artículo 9 regula expresamente el segundo puesto en otra Comunidad Autónoma o Corporación Local, así que no se limita a la misma Administración. El segundo puesto puede estar retribuido: el artículo 7.1 limita la cantidad total percibida por ambos puestos."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1985-151-art-3
- id: m04-l06-q008
  prompt:
    es: "Conforme al artículo 3.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la autorización de compatibilidad para un segundo puesto en el sector público se condiciona:"
  options:
  - id: a
    text:
      es: "Al estricto cumplimiento de la jornada y horario en el puesto principal."
  - id: b
    text:
      es: "Al estricto cumplimiento de la jornada y horario en el segundo puesto."
  - id: c
    correct: true
    text:
      es: "Al estricto cumplimiento de la jornada y horario en ambos puestos."
  - id: d
    text:
      es: "A que el segundo puesto no exceda de media jornada."
  explanation:
    es: "La autorización «no supondrá modificación de la jornada de trabajo y horario de los dos puestos y […] se condiciona a su estricto cumplimiento en ambos». Las opciones que miran solo al puesto principal o solo al segundo puesto recortan ese «en ambos». La mitad de la jornada ordinaria es el umbral del artículo 12.2, que se refiere a actividades privadas."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-151-art-7
- id: m04-l06-q009
  prompt:
    es: "Según el artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, para autorizar la compatibilidad, lo percibido por ambos puestos tiene como tope la remuneración presupuestaria de:"
  options:
  - id: a
    correct: true
    text:
      es: "El cargo de Director General."
  - id: b
    text:
      es: "El cargo de Subdirector General."
  - id: c
    text:
      es: "El cargo de Secretario de Estado."
  - id: d
    text:
      es: "El cargo de Secretario General Técnico."
  explanation:
    es: "El artículo 7.1 toma como tope «la remuneración prevista en los Presupuestos Generales del Estado para el cargo de Director General». El Subdirector General está un nivel por debajo y el Secretario de Estado por encima. El Secretario General Técnico tiene rango de Director General, pero el artículo no lo nombra como referencia."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1985-151-art-7
- id: m04-l06-q010
  prompt:
    es: "Según el artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, para el grupo A, el tope de lo percibido por ambos puestos es el principal incrementado en:"
  options:
  - id: a
    text:
      es: "Un 35 por 100 de esa retribución."
  - id: b
    text:
      es: "Un 40 por 100 de esa retribución."
  - id: c
    correct: true
    text:
      es: "Un 30 por 100 de esa retribución."
  - id: d
    text:
      es: "Un 50 por 100 de esa retribución."
  explanation:
    es: "El artículo 7.1 fija el incremento por grupos: «Un 30 por 100, para los funcionarios del grupo A o personal de nivel equivalente». El 35 por 100 es el del grupo B, el 40 por 100 el del grupo C y el 50 por 100 el del grupo E."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
