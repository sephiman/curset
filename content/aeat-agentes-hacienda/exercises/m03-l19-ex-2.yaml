# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0017
  prompt:
    es: "De acuerdo con el artículo 78.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la base imponible del impuesto estará constituida por el importe total de la contraprestación de las operaciones sujetas procedente:"
  options:
  - id: a
    text:
      es: "del destinatario, pero nunca de terceras personas."
  - id: b
    text:
      es: "del sujeto pasivo que realice la operación."
  - id: c
    text:
      es: "exclusivamente del destinatario de la operación."
  - id: d
    correct: true
    text:
      es: "del destinatario o de terceras personas."
  explanation:
    es: "La contraprestación puede proceder del destinatario o de terceras personas: el precepto no limita su origen al destinatario ni excluye a los terceros. Tampoco procede del sujeto pasivo que realiza la operación, que es quien la recibe."
  citation: "art. 78.Uno LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "regla general"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0018
  prompt:
    es: "Señale cuál de los siguientes conceptos se incluye en la contraprestación a efectos de la base imponible, según el artículo 78.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "El propio Impuesto sobre el Valor Añadido que grave las operaciones sujetas, repercutido en la factura."
  - id: b
    text:
      es: "Los intereses por el aplazamiento en el pago del precio correspondientes a un período posterior a la entrega."
  - id: c
    correct: true
    text:
      es: "El importe de las deudas asumidas por el destinatario de las operaciones sujetas como contraprestación total o parcial de las mismas."
  - id: d
    text:
      es: "Las sumas pagadas en nombre y por cuenta del cliente en virtud de mandato expreso del mismo."
  explanation:
    es: "Las deudas que el destinatario asume como pago total o parcial forman parte de la contraprestación (art. 78.Dos.7.º). El propio IVA queda fuera de los tributos que se integran, los intereses de un aplazamiento posterior a la entrega no se incluyen y las sumas pagadas por cuenta del cliente con mandato expreso están excluidas por el apartado Tres."
  citation: "art. 78.Dos.7.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "contraprestación"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0019
  prompt:
    es: "Según el artículo 78.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿a qué período debe corresponder el aplazamiento en el pago del precio para que los intereses queden fuera de la contraprestación?"
  options:
  - id: a
    text:
      es: "Un período anterior a la entrega de los bienes o a la prestación de los servicios pactada."
  - id: b
    text:
      es: "Un período superior a un año natural contado desde la entrega de los bienes."
  - id: c
    correct: true
    text:
      es: "Un período posterior a la entrega de los bienes o la prestación de los servicios."
  - id: d
    text:
      es: "Un período superior a seis meses contados desde el devengo de la operación."
  explanation:
    es: "Solo se excluyen los intereses que corresponden al aplazamiento posterior a la entrega o prestación. Los de un período anterior forman parte de la contraprestación, y la ley no fija topes de seis meses ni de un año para esta exclusión."
  citation: "art. 78.Dos.1.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "intereses"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0020
  prompt:
    es: "Conforme al artículo 78.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en ningún caso se considerará interés, a efectos de su exclusión de la contraprestación, la parte de esta que exceda:"
  options:
  - id: a
    correct: true
    text:
      es: "del importe usualmente aplicado en el mercado para similares operaciones."
  - id: b
    text:
      es: "del diez por ciento del precio pactado para la entrega de los bienes."
  - id: c
    text:
      es: "del importe que fije el contrato entre las partes para el aplazamiento del pago."
  - id: d
    text:
      es: "del importe que resulte de aplicar el interés legal del dinero a la parte aplazada."
  explanation:
    es: "El límite es el importe usualmente aplicado en el mercado para operaciones similares: lo que excede de él no es interés y se queda en la contraprestación. El interés legal, lo pactado en el contrato y un porcentaje fijo del precio no son el criterio de la ley."
  citation: "art. 78.Dos.1.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "intereses"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0021
  prompt:
    es: "De acuerdo con el artículo 78.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran vinculadas directamente al precio de las operaciones sujetas las subvenciones establecidas en función del número de unidades entregadas o del volumen de los servicios prestados cuando se determinen:"
  options:
  - id: a
    text:
      es: "con posterioridad a la realización de la operación."
  - id: b
    correct: true
    text:
      es: "con anterioridad a la realización de la operación."
  - id: c
    text:
      es: "en el mismo período de liquidación de la operación."
  - id: d
    text:
      es: "una vez conocido el beneficio obtenido con la operación."
  explanation:
    es: "La subvención se vincula directamente al precio cuando se fija en función de unidades o volumen y se determina antes de la operación. Una subvención fijada después, en el mismo período o a la vista del beneficio no cumple esa condición."
  citation: "art. 78.Dos.3.º LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "subvenciones"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0023
  prompt:
    es: "De acuerdo con el artículo 78.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, señale la afirmación CORRECTA sobre las indemnizaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "No se incluyen en la base imponible las cantidades percibidas por indemnizaciones que, por su naturaleza y función, no constituyan contraprestación de las operaciones sujetas."
  - id: b
    text:
      es: "Se incluyen en la base imponible las indemnizaciones únicamente cuando las abone un tercero distinto del destinatario."
  - id: c
    text:
      es: "Se incluyen en la base imponible todas las cantidades percibidas por indemnizaciones vinculadas a la operación, sea cual sea su naturaleza."
  - id: d
    text:
      es: "No se incluyen en la base imponible las indemnizaciones que compensen el precio de las operaciones sujetas, aunque constituyan contraprestación."
  explanation:
    es: "El criterio es la naturaleza y la función de la cantidad: la indemnización que no constituye contraprestación o compensación de la operación queda fuera de la base imponible. La que compensa el precio sí es contraprestación, y la identidad de quien paga no cambia esa calificación."
  citation: "art. 78.Tres.1.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "indemnizaciones"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0024
  prompt:
    es: "Conforme al artículo 78.Tres.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo deben concederse los descuentos y bonificaciones justificados por cualquier medio de prueba admitido en derecho para quedar excluidos de la base imponible?"
  options:
  - id: a
    text:
      es: "En cualquier momento, siempre que consten reflejados en la factura de la operación."
  - id: b
    text:
      es: "Previa o simultáneamente al momento en que la operación se realice, aunque no dependan de ella."
  - id: c
    correct: true
    text:
      es: "Previa o simultáneamente al momento en que la operación se realice y en función de ella."
  - id: d
    text:
      es: "Con posterioridad al momento en que la operación se realice y en función de ella."
  explanation:
    es: "El descuento queda fuera de la base imponible cuando se concede previa o simultáneamente a la operación y en función de ella. Concedido después, reduce la base por la vía del artículo 80, y concedido sin depender de la operación no cumple el texto."
  citation: "art. 78.Tres.2.º LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "descuentos"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0025
  prompt:
    es: "Señale la respuesta CORRECTA sobre el descuento concedido previa o simultáneamente a la operación, según el artículo 78.Tres.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "No es de aplicación la exclusión de la base imponible cuando las minoraciones de precio constituyan remuneraciones de otras operaciones."
  - id: b
    text:
      es: "La exclusión de la base imponible se aplica solo cuando el descuento se paga en dinero y no en especie."
  - id: c
    text:
      es: "La exclusión de la base imponible exige que el descuento figure en un contrato firmado antes de la operación."
  - id: d
    text:
      es: "La exclusión de la base imponible se aplica también cuando las minoraciones de precio constituyan remuneraciones de otras operaciones distintas."
  explanation:
    es: "El descuento previo o simultáneo se excluye de la base, salvo que la minoración de precio retribuya otras operaciones. La ley admite cualquier medio de prueba, sin exigir contrato previo, y no distingue entre descuento en dinero o en especie."
  citation: "art. 78.Tres.2.º LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "descuentos"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0026
  prompt:
    es: "Según el artículo 78.Tres.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, respecto de las sumas pagadas en nombre y por cuenta del cliente en virtud de mandato expreso, el sujeto pasivo está obligado a justificar la cuantía efectiva de tales gastos y:"
  options:
  - id: a
    text:
      es: "puede deducir el impuesto que eventualmente los hubiera gravado."
  - id: b
    correct: true
    text:
      es: "no puede deducir el impuesto que eventualmente los hubiera gravado."
  - id: c
    text:
      es: "debe incluirlos en la base imponible hasta el límite del diez por ciento."
  - id: d
    text:
      es: "debe repercutir el impuesto que eventualmente los hubiera gravado."
  explanation:
    es: "Las sumas pagadas por cuenta del cliente se excluyen de la base imponible, pero el sujeto pasivo debe justificar su cuantía y no puede deducir el IVA que las gravó. Deducirlo, repercutirlo o integrar un porcentaje en la base no está previsto."
  citation: "art. 78.Tres.3.º LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "suplidos"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0027
  prompt:
    es: "Señale la respuesta CORRECTA sobre la operación cuyas cuotas del IVA se han omitido en la factura, sin repercusión expresa, según el artículo 78.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se entiende que la contraprestación no incluyó dichas cuotas, incluso cuando la repercusión expresa no fuese obligatoria."
  - id: b
    text:
      es: "Se entiende que la contraprestación incluyó la mitad de dichas cuotas hasta que se rectifique la factura."
  - id: c
    text:
      es: "Se entiende que la contraprestación incluyó dichas cuotas, salvo que el destinatario las haya soportado."
  - id: d
    correct: true
    text:
      es: "Se entiende que la contraprestación no incluyó dichas cuotas, salvo que la repercusión expresa no fuese obligatoria."
  explanation:
    es: "La regla general es que la contraprestación no incluyó las cuotas no repercutidas, con dos excepciones: los casos en que la repercusión expresa no era obligatoria y los percibidos por resolución del apartado Dos.5.º. La presunción contraria o un reparto por mitades no figuran en el precepto."
  citation: "art. 78.Cuatro LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "cuotas no repercutidas"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0028
  prompt:
    es: "Taller Mora, S.L. vende un lote de herramientas por 2.000 euros. Factura además 150 euros de portes y 100 euros por un envase retornable cargado al comprador, y recibe una subvención de 300 euros fijada antes de la operación en función de las unidades entregadas. Paga además, en nombre y por cuenta del cliente y por mandato expreso, una tasa de 80 euros. Todos los importes excluyen el IVA. Según los artículos 78.Dos y 78.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es la base imponible?"
  options:
  - id: a
    text:
      es: "Una base imponible de 2.630 euros en total."
  - id: b
    text:
      es: "Una base imponible de 2.250 euros en total."
  - id: c
    text:
      es: "Una base imponible de 2.450 euros en total."
  - id: d
    correct: true
    text:
      es: "Una base imponible de 2.550 euros en total."
  explanation:
    es: "La base suma 2.000 euros de precio, 150 de portes (art. 78.Dos.1.º), 100 del envase, incluso si es susceptible de devolución (art. 78.Dos.6.º), y 300 de subvención vinculada al precio (art. 78.Dos.3.º): 2.550 euros. La tasa de 80 euros, pagada por cuenta del cliente con mandato expreso, queda fuera (art. 78.Tres.3.º), y sumarla daría 2.630. Quitar el envase da 2.450 y quitar la subvención da 2.250."
  citation: "art. 78.Dos LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "cómputo"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0029
  prompt:
    es: "Comercial Vega, S.A. entrega mercancía con un precio de lista de 5.000 euros y concede en la factura un descuento del 10 % en función de la operación, pactado antes de realizarla. Factura 200 euros de seguros y 150 euros de intereses por un aplazamiento posterior a la entrega, exentos conforme al artículo 20.Uno.18.º c) y consignados separadamente en la factura. Los importes excluyen el IVA. Según los artículos 78.Dos y 78.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es la base imponible?"
  options:
  - id: a
    text:
      es: "Una base imponible de 4.500 euros en total."
  - id: b
    correct: true
    text:
      es: "Una base imponible de 4.700 euros en total."
  - id: c
    text:
      es: "Una base imponible de 5.200 euros en total."
  - id: d
    text:
      es: "Una base imponible de 4.850 euros en total."
  explanation:
    es: "El descuento previo del 10 % no forma parte de la base (art. 78.Tres.2.º): 5.000 - 500 = 4.500. Los 200 euros de seguros sí se incluyen (art. 78.Dos.1.º): 4.700. Los 150 euros de intereses del aplazamiento posterior a la entrega, exentos y consignados aparte, se excluyen. Con 5.200 se olvida el descuento, con 4.850 se suman los intereses y con 4.500 se olvidan los seguros."
  citation: "art. 78.Dos LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "cómputo"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0030
  prompt:
    es: "Conforme al artículo 79.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué se considera base imponible en las operaciones cuya contraprestación no consista en dinero?"
  options:
  - id: a
    correct: true
    text:
      es: "El importe, expresado en dinero, que se hubiera acordado entre las partes."
  - id: b
    text:
      es: "El valor contable de los bienes entregados en pago de la operación, minorado en su amortización."
  - id: c
    text:
      es: "El precio medio de mercado de la operación en el mes del devengo."
  - id: d
    text:
      es: "El importe de la cuota del impuesto que grave la operación."
  explanation:
    es: "Si la contraprestación no es dinero, la base es el importe en dinero que las partes hayan acordado. El valor contable, el precio medio de mercado y la cuota del impuesto no son el criterio de este apartado."
  citation: "art. 79.Uno LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "permuta"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0031
  prompt:
    es: "Según el artículo 79.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se determina la base imponible correspondiente a cada bien o servicio cuando en una misma operación y por precio único se entreguen bienes o se presten servicios de diversa naturaleza?"
  options:
  - id: a
    text:
      es: "Por partes iguales entre los bienes entregados y los servicios prestados."
  - id: b
    text:
      es: "En proporción al coste de producción de los bienes entregados o de los servicios prestados."
  - id: c
    correct: true
    text:
      es: "En proporción al valor de mercado de los bienes entregados o de los servicios prestados."
  - id: d
    text:
      es: "Aplicando a todos ellos la base del bien o servicio de mayor importe."
  explanation:
    es: "Con precio único y operaciones de distinta naturaleza, el reparto se hace en proporción al valor de mercado. El coste de producción, el reparto por partes iguales y la aplicación de la base mayor no están previstos."
  citation: "art. 79.Dos LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "precio único"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0032
  prompt:
    es: "Señale la respuesta CORRECTA sobre la regla de reparto del precio único, según el artículo 79.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se aplica también cuando los bienes o servicios constituyan el objeto de prestaciones accesorias de otra principal sujeta al impuesto."
  - id: b
    text:
      es: "No se aplica cuando uno de los bienes o servicios sea de valor inferior al diez por ciento del total."
  - id: c
    text:
      es: "Se aplica solo en la transmisión de la totalidad de un patrimonio empresarial, no en otras operaciones."
  - id: d
    correct: true
    text:
      es: "No se aplica cuando los bienes o servicios constituyan el objeto de prestaciones accesorias de otra principal sujeta al impuesto."
  explanation:
    es: "La regla del valor de mercado no rige para las prestaciones accesorias de otra principal sujeta. Tampoco hay umbral del diez por ciento, y el reparto no se limita a la transmisión de un patrimonio empresarial, que solo se cita como ejemplo incluido."
  citation: "art. 79.Dos LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "precio único"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0035
  prompt:
    es: "Según el artículo 79.Tres.3.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, si el valor de los bienes entregados en autoconsumo hubiese experimentado alteraciones como consecuencia de su utilización, deterioro, obsolescencia, envilecimiento o revalorización, la base imponible será:"
  options:
  - id: a
    text:
      es: "el valor medio de los bienes durante el período en que se utilizaron."
  - id: b
    correct: true
    text:
      es: "el valor de los bienes en el momento en que se efectúe la entrega."
  - id: c
    text:
      es: "el valor de los bienes en el momento en que fueron adquiridos."
  - id: d
    text:
      es: "el coste de los bienes incrementado en la revalorización experimentada."
  explanation:
    es: "Cuando el valor ha cambiado por uso, deterioro, obsolescencia, envilecimiento o revalorización, la base es el valor en el momento de la entrega. El valor de adquisición, un valor medio del período y el coste incrementado no figuran en la regla."
  citation: "art. 79.Tres.3.ª LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "autoconsumo"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0036
  prompt:
    es: "Conforme al artículo 79.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en los casos de autoconsumo de servicios, se considera base imponible:"
  options:
  - id: a
    text:
      es: "el valor de los bienes utilizados en la prestación, sin incluir los gastos de personal."
  - id: b
    text:
      es: "el coste de prestación de los servicios, excluida la amortización de los bienes cedidos a terceros."
  - id: c
    text:
      es: "el precio de mercado de servicios similares prestados a terceros independientes."
  - id: d
    correct: true
    text:
      es: "el coste de prestación de los servicios, incluida, en su caso, la amortización de los bienes cedidos."
  explanation:
    es: "En el autoconsumo de servicios la base es el coste de prestación, con la amortización de los bienes cedidos incluida. El precio de mercado, la exclusión de la amortización y el valor de los bienes sin personal se apartan del texto."
  citation: "art. 79.Cuatro LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "autoconsumo"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0037
  prompt:
    es: "Exportaciones Levante, S.L. presta un servicio sujeto por 12.000 dólares. El tipo de cambio vendedor fijado por el Banco de España es de 1,20 dólares por euro el día del devengo, 1,25 el de la expedición de la factura y 1,50 el del cobro. Según el artículo 79.Once de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es la base imponible, en euros?"
  options:
  - id: a
    text:
      es: "Una base imponible de 14.400 euros en total."
  - id: b
    correct: true
    text:
      es: "Una base imponible de 10.000 euros en total."
  - id: c
    text:
      es: "Una base imponible de 8.000 euros en total."
  - id: d
    text:
      es: "Una base imponible de 9.600 euros en total."
  explanation:
    es: "Se aplica el tipo de cambio vendedor del Banco de España vigente en el momento del devengo: 12.000 / 1,20 = 10.000 euros. Con el de la factura saldrían 9.600 y con el del cobro 8.000. Multiplicar en lugar de dividir da 14.400."
  citation: "art. 79.Once LIVA"
  difficulty: 3
  tags:
  - "base imponible"
  - "moneda extranjera"
  - "cómputo"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0038
  prompt:
    es: "Según el artículo 80.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la base imponible determinada con arreglo a los artículos 78 y 79 se reducirá en el importe de los envases y embalajes:"
  options:
  - id: a
    correct: true
    text:
      es: "susceptibles de reutilización que hayan sido objeto de devolución."
  - id: b
    text:
      es: "no susceptibles de reutilización que hayan sido objeto de devolución al proveedor."
  - id: c
    text:
      es: "susceptibles de reutilización que hayan sido cargados a los destinatarios de la operación."
  - id: d
    text:
      es: "susceptibles de reutilización que se encuentren pendientes de devolución por el destinatario."
  explanation:
    es: "Reduce la base el importe de los envases y embalajes reutilizables que han sido devueltos. Los cargados al destinatario siguen en la base (art. 78.Dos.6.º) hasta que se devuelvan, y los no reutilizables o aún no devueltos no cumplen la condición."
