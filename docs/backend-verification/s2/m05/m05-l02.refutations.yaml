m05-l02-q01:
  key:
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: Auto-configurations must be loaded only by being named in the imports file.
  wrong:
  - option: By component scanning of the application's packages
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: Make sure that they are defined in a specific package space and that they are never the target of component scanning.
  - option: By an auto-configuration class that enables component scanning to find the other ones
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: auto-configuration classes should not enable component scanning to find additional components.
  - option: By a `@Bean` method of the application class that returns each auto-configuration
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: Specific @Import annotations should be used instead.
