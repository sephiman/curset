# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q096
  prompt:
    es: "En lugar de un script para mostrar u ocultar una sección con más detalles, ¿qué elemento propone el estándar HTML como alternativa declarativa?"
  options:
  - id: a
    correct: true
    text:
      es: "El elemento details de HTML"
  - id: b
    text:
      es: "El elemento output de HTML"
  - id: c
    text:
      es: "El elemento form de HTML"
  - id: d
    text:
      es: "El elemento noscript de HTML"
  explanation:
    es: "El estándar propone usar el elemento details en lugar de un script para mostrar u ocultar una sección con más detalles. El elemento noscript presenta contenido alternativo cuando los scripts están desactivados, no es un mecanismo declarativo de mostrar u ocultar. El elemento output muestra el resultado de un cálculo en los ejemplos de la página. El elemento form agrupa los controles de un formulario, como en el ejemplo del cálculo del cuadrado."
  citation: "fuente: `whatwg-html-scripting.html`; «For example, instead of using a script to show or hide a section to show more details, the details element could be used.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-scripting-html
- id: m02-l12-q097
  prompt:
    es: "¿Cuál de las siguientes cosas ocurre, en el ejemplo del estándar HTML que usa noscript para calcular un cuadrado, cuando los scripts están desactivados?"
  options:
  - id: a
    text:
      es: "El formulario desaparece de la página sin dejar ningún botón"
  - id: b
    text:
      es: "El navegador ejecuta el script del cálculo en un hilo aparte"
  - id: c
    correct: true
    text:
      es: "Aparece un botón para hacer el cálculo en el servidor"
  - id: d
    text:
      es: "El valor se calcula al instante en el propio navegador"
  explanation:
    es: "Con los scripts desactivados aparece un botón para que el cálculo se haga en el servidor; con los scripts activados, el valor se calcula al instante. Calcular el valor al instante en el navegador es lo que ocurre con los scripts activados. Con los scripts desactivados aparece un botón en el formulario, que permanece en la página. Con los scripts desactivados no se ejecuta el script, ni en un hilo aparte ni de otra forma."
  citation: "fuente: `whatwg-html-scripting.html`; «When script is disabled, a button appears to do the calculation on the server side.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q098
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué combinación de teclas abre directamente la consola de DevTools para ejecutar JavaScript?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+M, que cambia de usuario o examina como invitado"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+J"
  - id: c
    text:
      es: "Ctrl+Mayús+K, que duplica la pestaña actual"
  - id: d
    text:
      es: "Ctrl+Mayús+N, que abre una ventana de InPrivate"
  explanation:
    es: "Ctrl+Mayús+J abre directamente la consola de DevTools de Edge en Windows. Ctrl+Mayús+K duplica la pestaña actual, según la lista de métodos abreviados de Edge. Ctrl+Mayús+N abre una nueva ventana de InPrivate. Ctrl+Mayús+M inicia sesión como usuario distinto o examina como invitado."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q099
  prompt:
    es: "¿Cuál de las siguientes formas de ejecución usa la Consola de DevTools de Microsoft Edge para el código JavaScript que se escribe en ella?"
  options:
  - id: a
    correct: true
    text:
      es: "De forma inmediata e interactiva, a medida que se escribe"
  - id: b
    text:
      es: "Solo tras enviarlo a un servidor externo que lo valida antes"
  - id: c
    text:
      es: "Solo al guardar el código escrito en un archivo con extensión .js"
  - id: d
    text:
      es: "Solo al cerrar la consola, que ejecuta todo lo escrito de una vez"
  explanation:
    es: "La consola ejecuta cualquier expresión o instrucción de JavaScript de forma inmediata e interactiva a medida que se escribe. La consola no necesita archivos: ejecuta lo que se escribe a medida que se escribe. La consola no espera a cerrarse: muestra el resultado mientras se escribe. La consola evalúa el código en el propio navegador, sin enviarlo a ningún servidor."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q100
  prompt:
    es: "¿Cuál de las siguientes secuencias repite la Consola de DevTools de Microsoft Edge, un entorno de bucle de lectura, evaluación e impresión (REPL)?"
  options:
  - id: a
    correct: true
    text:
      es: "Lee el código, lo evalúa, imprime el resultado y vuelve al primer paso"
  - id: b
    text:
      es: "Evalúa el código, lo lee, imprime el resultado y vuelve al primer paso"
  - id: c
    text:
      es: "Lee el código, imprime el resultado, lo evalúa y vuelve al primer paso"
  - id: d
    text:
      es: "Lee el código, lo evalúa, imprime el resultado y termina la sesión"
  explanation:
    es: "La consola lee el código JavaScript que se escribe, lo evalúa, imprime el resultado y vuelve al primer paso. Evaluar el código antes de leerlo invierte el orden de los pasos de la página. Imprimir el resultado antes de evaluar el código invierte el orden de los pasos. La consola vuelve al primer paso, no termina la sesión."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q102
  prompt:
    es: "¿Cuál de las siguientes cosas ocurre la primera vez que se intenta pegar contenido en la herramienta Consola de DevTools de Microsoft Edge?"
  options:
  - id: a
    text:
      es: "Se pega como texto sin formato, sin advertencia"
  - id: b
    text:
      es: "Se pega y se ejecuta de inmediato, sin pedir confirmación"
  - id: c
    text:
      es: "Se pega tras escribir Entrar, que ejecuta el contenido"
  - id: d
    correct: true
    text:
      es: "Se muestra una advertencia en lugar de pegarlo"
  explanation:
    es: "Al intentar pegar por vez inicial, la consola muestra una advertencia en lugar de pegar el contenido, para evitar ataques de auto-XSS. Pegar y ejecutar de inmediato contradice la advertencia, que impide pegar de entrada. La consola no pega ni como texto sin formato: muestra primero la advertencia. Entrar ejecuta el comando; para pegar hay que escribir primero «permitir pegar»."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q103
  prompt:
    es: "¿Cuál de las siguientes acciones evita el diseño adaptable, según la definición del Servicio Web del Gobierno Vasco?"
  options:
  - id: a
    text:
      es: "Adaptar el diseño a las distintas resoluciones de pantalla de los usuarios"
  - id: b
    correct: true
    text:
      es: "Duplicar los sitios web para versiones de dispositivos concretos"
  - id: c
    text:
      es: "Usar unidades relativas y consultas de medios (media queries)"
  - id: d
    text:
      es: "Usar estándares web como HTML5 y CSS3 en sus portales"
  explanation:
    es: "El diseño adaptable es un conjunto de técnicas para que los sitios web sean utilizables en cualquier dispositivo sin duplicarlos en versiones para dispositivos concretos. HTML5 y CSS3 son estándares que el Servicio Web usa para lograr la adaptabilidad, no lo que evita. Las unidades relativas y las media queries son técnicas que usa para adaptar el diseño. Adaptar el diseño a distintas resoluciones es justo lo que pretende el diseño adaptable."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q104
  prompt:
    es: "¿Cuál de los siguientes dispositivos recomienda el Servicio Web del Gobierno Vasco que se tenga en cuenta primero al plantear una interfaz adaptable?"
  options:
  - id: a
    text:
      es: "En las tabletas, con el enfoque «Tablet First»"
  - id: b
    correct: true
    text:
      es: "En los dispositivos móviles, con el enfoque «Mobile First»"
  - id: c
    text:
      es: "En los televisores y consolas, con el enfoque «Console First»"
  - id: d
    text:
      es: "En los ordenadores personales, con el enfoque «Desktop First»"
  explanation:
    es: "Al plantear una interfaz adaptable se recomienda pensar primero en los dispositivos móviles («Mobile First»), para lograr interacciones más claras y simples. Los ordenadores personales no son el primer dispositivo al que se recomienda pensar. Los televisores y las consolas aparecen solo como dispositivos con navegador integrado, no como punto de partida. Las tabletas son un dispositivo más en los datos de visitas; la recomendación es pensar primero en los móviles."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q105
  prompt:
    es: "Según los datos de visitas a Euskadi.eus en 2018 que cita el Servicio Web del Gobierno Vasco, ¿qué tipo de dispositivo fue el más usado?"
  options:
  - id: a
    text:
      es: "El móvil, con el 62 % de las visitas"
  - id: b
    text:
      es: "El ordenador personal, con el 34 % de las visitas"
  - id: c
    correct: true
    text:
      es: "El ordenador personal, con el 62 % de las visitas"
  - id: d
    text:
      es: "La tableta, con el 34 % de las visitas"
  explanation:
    es: "En 2018 el ordenador personal fue el dispositivo del 62 % de las visitas a Euskadi.eus, frente al 34 % del móvil y el 4 % de la tableta. El móvil supuso el 34 % de las visitas, no el 62 %. El ordenador personal supuso el 62 %; el 34 % es el del móvil. La tableta supuso el 4 % de las visitas; el 34 % es el del móvil."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q106
  prompt:
    es: "En Windows 11, ¿qué permite la ruta de origen flexible que ping usa con el parámetro /j?"
  options:
  - id: a
    text:
      es: "Que se fije el tiempo de espera de cada respuesta de eco"
  - id: b
    text:
      es: "Que se haga el seguimiento de la ruta de ida y vuelta en IPv6"
  - id: c
    text:
      es: "Que el siguiente destino intermedio sea un vecino accesible directamente"
  - id: d
    correct: true
    text:
      es: "Que los destinos intermedios sucesivos estén separados por uno o varios enrutadores"
  explanation:
    es: "Con el enrutamiento de origen flexible (/j), los destinos intermedios sucesivos pueden estar separados por uno o varios enrutadores. Que el siguiente destino sea un vecino accesible directamente es la exigencia de la ruta de origen estricta (/k). El seguimiento de la ruta de ida y vuelta, solo en IPv6, es el parámetro /R. El tiempo de espera de cada respuesta se fija con /w."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q107
  prompt:
    es: "En Windows 11, ¿qué valor máximo admite el campo Período de vida (TTL) que se fija en el encabezado IP de los mensajes de solicitud de eco de ping?"
  options:
  - id: a
    correct: true
    text:
      es: "255, y por defecto se usa el TTL predeterminado del host"
  - id: b
    text:
      es: "32, y por defecto se usa el TTL predeterminado del host"
  - id: c
    text:
      es: "9, y por defecto se usa el TTL predeterminado del host"
  - id: d
    text:
      es: "65 500, y por defecto se usa el TTL predeterminado del host"
  explanation:
    es: "El TTL máximo que se puede fijar es 255, y por defecto se usa el valor TTL predeterminado del host. 65 500 es el tamaño máximo del campo de datos, no el TTL máximo. 32 es la longitud predeterminada del campo de datos, no el TTL máximo. 9 es el máximo del recuento de /r y de la lista de hosts, no el TTL máximo."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q108
  prompt:
    es: "En Windows 11, ¿qué envía el comando ping /n 10 /l 1000 10.0.99.221 al destino?"
  options:
  - id: a
    text:
      es: "1000 mensajes de solicitud de eco, cada uno con 10 bytes en el campo de datos"
  - id: b
    text:
      es: "10 mensajes de solicitud de eco, cada uno con un tiempo de vida de 1000"
  - id: c
    text:
      es: "Mensajes de solicitud de eco hasta que se interrumpa, de 1000 bytes cada uno"
  - id: d
    correct: true
    text:
      es: "10 mensajes de solicitud de eco, cada uno con 1000 bytes en el campo de datos"
  explanation:
    es: "El parámetro /n fija el número de solicitudes (10) y /l la longitud del campo de datos (1000 bytes). Intercambiar las cifras invierte /n, que es el número de mensajes, y /l, que es la longitud de los datos. /l fija la longitud del campo de datos, no el tiempo de vida de los mensajes. Seguir enviando hasta interrumpir es el efecto de /t, que ese comando no usa."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q109
  prompt:
    es: "En Windows 11, ¿qué hace el comando ping /a 10.0.99.221 cuando se escribe tal cual en el símbolo del sistema?"
  options:
  - id: a
    text:
      es: "Hace ping al destino y registra la ruta de 4 saltos"
  - id: b
    correct: true
    text:
      es: "Hace ping al destino y resuelve la dirección 10.0.99.221 en su nombre de host"
  - id: c
    text:
      es: "Hace ping al destino enviando solicitudes de eco hasta que se interrumpa"
  - id: d
    text:
      es: "Hace ping al destino con 10 solicitudes de eco de 1000 bytes"
  explanation:
    es: "ping /a 10.0.99.221 hace ping al destino y resuelve la dirección en su nombre de host. Enviar solicitudes hasta que se interrumpa es el efecto de /t. Registrar la ruta de 4 saltos es el ejemplo de ping /r 4. Las 10 solicitudes de 1000 bytes son el ejemplo de ping /n 10 /l 1000."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q110
  prompt:
    es: "En Windows 11, ¿en qué condición está disponible el comando ping, según la documentación de Microsoft Learn?"
  options:
  - id: a
    text:
      es: "Solo si hay una conexión a Internet activa en el equipo"
  - id: b
    text:
      es: "Solo si el equipo tiene una dirección IP pública asignada"
  - id: c
    correct: true
    text:
      es: "Solo si el protocolo TCP/IP está instalado como componente de un adaptador de red"
  - id: d
    text:
      es: "Solo si el servicio DNS está instalado en el adaptador de red"
  explanation:
    es: "La documentación dice: «Este comando solo está disponible si el protocolo de Internet (TCP/IP) está instalado como componente en las propiedades de un adaptador de red». Una conexión a Internet activa no es la condición: la página presenta ping como la prueba de conectividad a nivel de IP con otro equipo TCP/IP, mediante solicitudes de eco, sin pedir salida a Internet. Una dirección IP pública tampoco: la condición es TCP/IP instalado. Y el servicio DNS no es el requisito: la página trata la resolución de nombres aparte, como algo que se puede probar con ping, no como condición de que el comando esté disponible."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q111
  prompt:
    es: "¿Cuál de los siguientes protocolos es, según el glosario de INCIBE, el más utilizado para la navegación web?"
  options:
  - id: a
    text:
      es: "FTP, el servicio de transferencia de ficheros"
  - id: b
    text:
      es: "DNS, el servicio de nombres de dominio"
  - id: c
    correct: true
    text:
      es: "HTTP, el protocolo de transferencia de hipertexto"
  - id: d
    text:
      es: "SMTP, el protocolo de intercambio de correo electrónico"
  explanation:
    es: "HTTP es el protocolo más utilizado para la navegación web. FTP sirve para transferir ficheros por una red, no para la navegación web. SMTP sirve para intercambiar mensajes de correo electrónico. El DNS traduce nombres de dominio en direcciones IP."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.8. HTTP»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q112
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, ¿qué se obtiene al pulsar Flecha arriba, como en muchos otros entornos de línea de comandos?"
  options:
  - id: a
    correct: true
    text:
      es: "Los comandos especificados anteriormente, para reutilizarlos"
  - id: b
    text:
      es: "Los resultados que muestra la consola mientras se escribe"
  - id: c
    text:
      es: "Las propiedades y métodos del cuerpo de la página web actual"
  - id: d
    text:
      es: "El resultado de la expresión anterior ejecutada, con la utilidad $_"
  explanation:
    es: "Flecha arriba muestra los comandos que se especificaron anteriormente, disponibles para su reutilización. El resultado de la expresión anterior lo guarda $_, que no se muestra con Flecha arriba. La lista de propiedades y métodos del cuerpo de la página aparece al escribir un punto en el autocompletado. La evaluación inmediata, que muestra el resultado mientras se escribe, es independiente de Flecha arriba."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q113
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, si se escribe 2+2 sin pulsar Entrar, ¿qué hace la consola?"
  options:
  - id: a
    text:
      es: "Muestra la expresión 2+2 tal como se ha escrito, sin evaluarla"
  - id: b
    correct: true
    text:
      es: "Muestra el resultado 4 en la línea siguiente al escribir"
  - id: c
    text:
      es: "No muestra nada hasta que se pulsa Entrar para ejecutar el comando"
  - id: d
    text:
      es: "Muestra un mensaje de error porque falta pulsar Entrar al final"
  explanation:
    es: "La consola muestra inmediatamente el resultado 4 en la línea siguiente mientras se escribe, sin pulsar Entrar. La evaluación inmediata muestra el resultado antes de pulsar Entrar. La consola no marca error por no haber pulsado Entrar: muestra el resultado mientras se escribe. La consola evalúa la expresión y muestra su resultado, no la expresión sin evaluar."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q114
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, ¿qué contiene siempre la utilidad $_ después de ejecutar expresiones?"
  options:
  - id: a
    correct: true
    text:
      es: "El resultado de la expresión anterior que se ejecutó en la consola"
  - id: b
    text:
      es: "Los comandos que se especificaron anteriormente en la consola, para reutilizarlos"
  - id: c
    text:
      es: "El primer elemento de la lista de propiedades de document.body"
  - id: d
    text:
      es: "El resultado de la expresión que se está escribiendo ahora"
  explanation:
    es: "La utilidad $_ siempre contiene el resultado de la expresión anterior que se ejecutó en la consola. Los comandos anteriores los muestra Flecha arriba, no $_. document.body es el ejemplo del autocompletado, que lista sus propiedades y métodos, sin relación con $_. La expresión que se está escribiendo aún no se ha ejecutado, por lo que $_ no la contiene."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q115
  prompt:
    es: "¿Cuál de las siguientes bases usa el Servicio Web del Gobierno Vasco para lograr la adaptabilidad de sus portales?"
  options:
  - id: a
    text:
      es: "En versiones separadas de cada portal para móviles, tabletas y ordenadores, con contenidos duplicados"
  - id: b
    text:
      es: "En duplicar el trabajo y el mantenimiento de cada contenido por dispositivo"
  - id: c
    correct: true
    text:
      es: "En estándares web como HTML5 y CSS3, unidades relativas, media queries y frameworks"
  - id: d
    text:
      es: "En estándares cerrados de cada fabricante de navegadores y plugins como Flash y PDF"
  explanation:
    es: "La adaptabilidad de los portales se basa en estándares web (HTML5 y CSS3), unidades relativas, media queries, lenguajes de script y frameworks como Bootstrap. Hacer versiones separadas por dispositivo es justo lo que el diseño adaptable evita. La página basa la adaptabilidad en estándares web, no en estándares cerrados de cada fabricante. Duplicar el trabajo y el mantenimiento es lo que se evita al no hacer versiones extra para determinados entornos."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-euskadi-diseno-adaptable-html
- id: m02-l12-q116
  prompt:
    es: "¿Cuál de las siguientes situaciones describía el tráfico de Internet en los primeros años de su expansión, según el Servicio Web del Gobierno Vasco?"
  options:
  - id: a
    correct: true
    text:
      es: "Casi todo se realizaba desde ordenadores personales, con pocos sistemas operativos y navegadores"
  - id: b
    text:
      es: "Se repartía por igual entre ordenadores, televisores y consolas con navegador"
  - id: c
    text:
      es: "Casi todo se realizaba desde teléfonos inteligentes, con muchos sistemas operativos"
  - id: d
    text:
      es: "Casi todo se realizaba desde tabletas, con una gran variedad de resoluciones"
  explanation:
    es: "En los primeros años casi todo el tráfico se realizaba desde ordenadores personales, con un número reducido de sistemas operativos, navegadores, resoluciones y dispositivos de entrada. Los teléfonos inteligentes llegaron después y cambiaron ese panorama. Los televisores y las consolas con navegador integrado son un fenómeno posterior, con la irrupción de nuevos dispositivos. Con las tabletas y otros dispositivos aumentó la variedad de resoluciones, tras los primeros años."
  citation: "fuente: `euskadi-diseno-adaptable.html`; «Diseño adaptable (Responsive Design)»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q117
  prompt:
    es: "Según la introducción del estándar HTML del WHATWG, ¿qué atributos permiten incluir datos para scripts del cliente o del servidor, y los navegadores nunca los tocan?"
  options:
  - id: a
    text:
      es: "Los atributos class, que sirven para crear elementos propios"
  - id: b
    text:
      es: "Los atributos de manejadores de eventos, que ejecutan los scripts"
  - id: c
    text:
      es: "Los atributos href, que fijan el destino de un enlace"
  - id: d
    correct: true
    text:
      es: "Los atributos data-*, que buscan y procesan los scripts"
  explanation:
    es: "Los atributos data-* permiten a los scripts incluir datos en los elementos HTML, y se garantiza que los navegadores nunca los tocan. El atributo class sirve para extender elementos y crear elementos propios, no para guardar datos de scripts. El atributo href fija el destino de un enlace, que un script puede cambiar. Los atributos de contenido de manejadores de eventos sirven para incrustar un script, no para guardar datos de scripts."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.7.2 Extensibility»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-dhcp-html
- id: m02-l12-q161
  prompt:
    es: "Según la documentación de Microsoft sobre DHCP, ¿qué ocurre con una dirección IP concedida a un cliente cuando este deja de usarla?"
  options:
  - id: a
    correct: true
    text:
      es: "Vuelve automáticamente al grupo de direcciones para poder reasignarse"
  - id: b
    text:
      es: "Pasa a ser una dirección estática que el administrador asigna a mano"
  - id: c
    text:
      es: "Queda reservada para ese mismo cliente de forma permanente"
  - id: d
    text:
      es: "Se elimina de la base de datos del servidor sin volver a asignarse"
  explanation:
    es: "Las direcciones DHCP son dinámicas (concedidas), no estáticas, así que las que dejan de usarse se devuelven automáticamente al grupo para su reasignación. «Queda reservada para ese mismo cliente de forma permanente» describe una reserva, que es otra configuración del servidor asociada a determinados clientes; una concesión normal no reserva la dirección. «Se elimina de la base de datos del servidor sin volver a asignarse» contradice la página: las direcciones sin uso se devuelven al grupo para reasignarlas, no se descartan. «Pasa a ser una dirección estática que el administrador asigna a mano» es lo contrario de una concesión: las direcciones estáticas se asignan de forma permanente y las dinámicas se conceden."
  citation: "fuente: `ms-win-dhcp.html`; «¿Qué es el servidor del Protocolo de configuración dinámica de host (DHCP) en Windows Server?»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-win-dhcp-html
- id: m02-l12-q162
  prompt:
    es: "¿Cuál de las siguientes ventajas atribuye Microsoft al uso de DHCP frente a configurar a mano las direcciones IP de los equipos de una red?"
  options:
  - id: a
    text:
      es: "Cifra la comunicación entre cada cliente y el servidor para que nadie la intercepte"
  - id: b
    text:
      es: "Elimina la necesidad de que un administrador mantenga la configuración TCP/IP"
  - id: c
    correct: true
    text:
      es: "Minimiza errores como los conflictos por asignar la misma dirección IP a más de un equipo"
  - id: d
    text:
      es: "Garantiza que cada equipo conserve siempre la misma dirección IP, aunque cambie de subred"
  explanation:
    es: "La página cita entre las ventajas de DHCP una configuración fiable, que evita errores tipográficos y conflictos de direcciones. «Garantiza que cada equipo conserve siempre la misma dirección IP, aunque cambie de subred» no es una ventaja de DHCP: las direcciones se conceden de forma dinámica y solo una dirección reservada para un cliente concreto se mantiene siempre igual. «Elimina la necesidad de que un administrador mantenga la configuración TCP/IP» es falso: el administrador establece los servidores DHCP, que mantienen la información de configuración; DHCP reduce la administración, no la suprime. «Cifra la comunicación entre cada cliente y el servidor para que nadie la intercepte» no aparece entre las ventajas de la página; el cifrado lo aportan HTTPS, TLS o una VPN, según INCIBE, y no DHCP."
  citation: "fuente: `ms-win-dhcp.html`; «¿Qué es el servidor del Protocolo de configuración dinámica de host (DHCP) en Windows Server?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-dhcp-html
- id: m02-l12-q163
  prompt:
    es: "¿Qué es la duración de la concesión que el servidor DHCP guarda en su base de datos, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "El tiempo que espera el servidor la respuesta de un cliente antes de descartar su solicitud"
  - id: b
    correct: true
    text:
      es: "El período durante el que se puede usar la dirección IP antes de renovar la concesión"
  - id: c
    text:
      es: "El número máximo de clientes que pueden recibir direcciones del mismo grupo"
  - id: d
    text:
      es: "El plazo tras el cual la dirección concedida pasa a ser permanente para el cliente"
  explanation:
    es: "La página define la duración de la concesión como el tiempo de uso de la dirección IP antes de que haga falta renovarla. «El tiempo que espera el servidor la respuesta de un cliente antes de descartar su solicitud» no es un tiempo de espera de respuestas; la página la define como el período de uso de la dirección concedida. «El número máximo de clientes que pueden recibir direcciones del mismo grupo» no es un límite de clientes; el grupo de direcciones válidas es otro dato de la base de datos del servidor. «El plazo tras el cual la dirección concedida pasa a ser permanente para el cliente» contradice la página: las direcciones DHCP son dinámicas (concedidas) y no asignadas de forma permanente, y al vencer la concesión hay que renovarla."
  citation: "fuente: `ms-win-dhcp.html`; «¿Qué es el servidor del Protocolo de configuración dinámica de host (DHCP) en Windows Server?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-dhcp-html
- id: m02-l12-q164
  prompt:
    es: "Señale el protocolo en el que se basa DHCP, definido como estándar del IETF en los RFC 2131 y 2132, según la documentación de Microsoft:"
  options:
  - id: a
    text:
      es: "En el protocolo de mensajes de control de Internet (ICMP)"
  - id: b
    text:
      es: "En el protocolo de transferencia de ficheros (FTP)"
  - id: c
    text:
      es: "En el sistema de nombres de dominio (DNS)"
  - id: d
    correct: true
    text:
      es: "En el protocolo de arranque (BOOTP)"
  explanation:
    es: "La página define DHCP como un estándar del IETF basado en BOOTP, con el que comparte muchos detalles de implementación. «En el protocolo de transferencia de ficheros (FTP)» es el servicio de transferencia de ficheros por una red, según INCIBE, y la página no lo relaciona con DHCP como base. «En el protocolo de mensajes de control de Internet (ICMP)» es el protocolo de los mensajes de eco que usa ping, según Microsoft; no es la base de DHCP. «En el sistema de nombres de dominio (DNS)»: traduce nombres de dominio en direcciones IP; la página solo dice que DHCP se integra con DNS para actualizar sus registros, no que se base en él."
  citation: "fuente: `ms-win-dhcp.html`; «¿Qué es el servidor del Protocolo de configuración dinámica de host (DHCP) en Windows Server?»"
  difficulty: 2
  tags:
  - "concepto"
