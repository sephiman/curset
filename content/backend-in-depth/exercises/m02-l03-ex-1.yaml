  - id: b
    text:
      en: '`null` is accepted and sorts first, and `ClassCastException` is thrown for the element that cannot be
        compared'
  - id: c
    correct: true
    text:
      en: '`NullPointerException` for `null` and `ClassCastException` for the element that cannot be compared'
  - id: d
    text:
      en: '`NullPointerException` for `null`, while the element that cannot be compared is accepted and sorts last'
  explanation:
    en: '`offer` throws `NullPointerException` for `null` and `ClassCastException` for an element that cannot be
      compared. The claim of swapped exceptions is wrong, because `NullPointerException` is thrown if the specified
      element is null. The claim that null sorts first is wrong, because a priority queue does not permit null elements.
      The claim that an incomparable element is accepted is wrong, because `ClassCastException` is thrown when the
