  explanation:
    es: "La página dice: «actualice la tabla de contenido haciendo clic con el botón derecho en la tabla de contenido y seleccionando Actualizar campo». Ctrl+F9 inserta un campo vacío. Mayús+F9 cambia entre un código de campo y su resultado. F11 va al campo siguiente."
  citation: "fuente: `ms-word-tabla-contenido.html`; «Crear la tabla de contenido»"
