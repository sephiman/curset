# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q267
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones de búsqueda se presenta en la página de funciones destacadas como la que busca en un rango o matriz y devuelve la coincidencia inicial?"
  options:
  - id: a
    text:
      es: "BUSCARH"
  - id: b
    text:
      es: "COINCIDIRX"
  - id: c
    text:
      es: "BUSCARV"
  - id: d
    correct: true
    text:
      es: "BUSCARX"
  explanation:
    es: "La página dice que BUSCARX busca en un rango o matriz y devuelve el elemento de la coincidencia inicial. «BUSCARV»: BUSCARV busca en la primera columna de una matriz y se mueve en horizontal. «BUSCARH»: BUSCARH busca en la fila superior de una matriz. «COINCIDIRX»: COINCIDIRX devuelve la posición relativa de un elemento."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Nuestras 10 funciones destacadas»"
  difficulty: 1
