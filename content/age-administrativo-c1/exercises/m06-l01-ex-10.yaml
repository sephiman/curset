# anchor: fuente-ms-win-firewall-html
- id: m06-l01-q316
  prompt:
    es: "Señale qué ocurre con una directiva de la organización cuando se restauran los firewalls a los valores predeterminados en Windows 11:"
  options:
  - id: a
    correct: true
    text:
      es: "Se vuelve a aplicar tras restaurar el firewall."
  - id: b
    text:
      es: "Se elimina de forma definitiva del dispositivo."
  - id: c
    text:
      es: "Se ignora hasta que se reinicia el equipo."
  - id: d
    text:
      es: "Se sustituye por la configuración de la red pública."
  explanation:
    es: "La página dice que, al restaurar los valores predeterminados, «si su organización ha aplicado alguna directiva para configurar el firewall, se volverá a aplicar». La directiva no se elimina, no espera a un reinicio y no se sustituye por la configuración de la red pública."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q318
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde al phishing, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Un malware que «secuestra» un dispositivo y exige un rescate para devolver el acceso a la información."
  - id: b
    text:
      es: "Un ataque que deja un sistema, aplicación o dispositivo fuera de servicio por saturación de peticiones."
  - id: c
    text:
      es: "Un malware que recopila información de un ordenador y después la envía a una entidad remota sin que el propietario lo sepa."
  - id: d
    correct: true
    text:
      es: "Una técnica que suplanta a una entidad por correo o mensaje para conseguir credenciales o datos de tarjeta."
  explanation:
    es: "El glosario define el phishing como una técnica o tipo de ataque en el que alguien suplanta a una entidad o servicio mediante un correo electrónico o mensaje instantáneo para conseguir las credenciales o la información de la tarjeta de crédito de un usuario. Secuestrar un dispositivo y exigir un rescate es la definición del ransomware. Dejar un sistema fuera de servicio por saturación de peticiones es la definición de la denegación de servicio. Recopilar información de un ordenador y enviarla a una entidad remota es lo que hace el spyware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Phishing»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q319
  prompt:
    es: "¿Cuál de los siguientes elementos suele contener el correo o mensaje de un phishing, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Un código de un solo uso generado por la entidad suplantada en ese momento."
  - id: b
    text:
      es: "Un certificado digital emitido por una Autoridad Certificadora reconocida."
  - id: c
    correct: true
    text:
      es: "Un enlace, o un fichero que lo contiene, a un sitio web que suplanta al legítimo."
  - id: d
    text:
      es: "Un programa que cifra los ficheros del equipo a cambio de un rescate económico para devolverlos."
  explanation:
    es: "El glosario dice que ese correo o mensaje «suele tener un enlace (o fichero que contiene ese enlace) a un sitio web que suplanta al legítimo y que usan para engañarlo». Una contraseña de un solo uso es otra figura del glosario, que se genera en un dispositivo o aplicación en el momento de su utilización. El certificado digital es un fichero que asocia datos de identidad, y el glosario no lo relaciona con el contenido del mensaje de phishing. Cifrar o secuestrar a cambio de un rescate es el ransomware, no el contenido que el glosario atribuye al phishing."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Phishing»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q320
  prompt:
    es: "¿Cuál de los siguientes términos aparece en el glosario de ciberseguridad del INCIBE como sinónimo de phishing?"
  options:
  - id: a
    text:
      es: "Pharming."
  - id: b
    correct: true
    text:
      es: "Smishing."
  - id: c
    text:
      es: "Spoofing."
  - id: d
    text:
      es: "Scam."
  explanation:
    es: "El glosario da como sinónimos de phishing «vishing» y «smishing». El glosario define el pharming como un ataque que aprovecha una vulnerabilidad de los servidores DNS, no como sinónimo de phishing. El glosario define el spoofing como una técnica de suplantación de identidad en la Red, no como sinónimo de phishing. El glosario define el scam como una estafa por medios electrónicos, no como sinónimo de phishing."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Phishing»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q321
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿cuál de las siguientes definiciones corresponde al spear phishing?"
  options:
  - id: a
    correct: true
    text:
      es: "Una modalidad de phishing dirigida contra un usuario u organización en concreto."
  - id: b
    text:
      es: "Una modalidad de phishing que se envía de forma masiva a cualquier usuario."
  - id: c
    text:
      es: "Un ataque que modifica el archivo del servidor DNS para redirigir al usuario."
  - id: d
    text:
      es: "Una estafa por medios electrónicos que ofrece productos o servicios falsos a las víctimas."
  explanation:
    es: "El glosario define el spear phishing como una «modalidad de phishing dirigido contra un usuario u organización en concreto», con un correo que aparenta ser de un amigo o de una empresa conocida. Modificar el archivo del servidor de nombres de dominio para redirigir al usuario es el pharming, y la estafa por medios electrónicos con productos o servicios falsos es el scam."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Spear phishing»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q323
  prompt:
    es: "¿Cuál de las siguientes expresiones corresponde, en español, a las siglas CAPTCHA, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "La herramienta o troyano de administración remota que usan habitualmente los ciberdelincuentes."
  - id: b
    text:
      es: "El número de identificación personal, un tipo de contraseña generalmente de cuatro dígitos."
  - id: c
    correct: true
    text:
      es: "La prueba de Turing completamente automática y pública que diferencia ordenadores de humanos."
  - id: d
    text:
      es: "El identificador de conjunto de servicios que distingue una red wifi de otras de la zona."
  explanation:
    es: "El glosario define CAPTCHA como acrónimo de Completely Automated Public Turing test to tell Computers and Humans Apart, en español «prueba de Turing completamente automática y pública para diferenciar ordenadores de humanos». El glosario define esas siglas como Remote Administration Tool, herramienta o troyano de administración remota; son las de RAT. El glosario define esas siglas como Personal Identification Number, número de identificación personal; son las de PIN. El glosario define esas siglas como Service Set Identifier, identificador de conjunto de servicios; son las de SSID."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Captcha»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q324
  prompt:
    es: "¿Cuál de los siguientes tipos de pruebas consiste en realizar un CAPTCHA, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Pruebas de carga que miden la velocidad de una red."
  - id: b
    text:
      es: "Pruebas de intrusión que buscan vulnerabilidades del sistema."
  - id: c
    text:
      es: "Pruebas de cifrado que comprueban la clave del usuario."
  - id: d
    correct: true
    text:
      es: "Pruebas desafío-respuesta controladas por máquinas."
  explanation:
    es: "El glosario define el CAPTCHA como «un tipo de medida de seguridad que consiste en la realización de pruebas desafío-respuesta controladas por máquinas». Medir la velocidad y calidad de una red es lo que hace la utilidad Ping, y las pruebas de intrusión y de cifrado no figuran en esa definición."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Captcha»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q325
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, un certificado digital lo genera una entidad denominada:"
  options:
  - id: a
    correct: true
    text:
      es: "la Autoridad Certificadora (CA)."
  - id: b
    text:
      es: "la autoridad de validación."
  - id: c
    text:
      es: "el proveedor de acceso."
  - id: d
    text:
      es: "el sello de confianza."
  explanation:
    es: "El glosario define el certificado digital como «un fichero informático generado por una entidad denominada Autoridad Certificadora (CA)» que asocia unos datos de identidad a una persona física, organismo o empresa. El glosario dice que la autoridad de validación informa de la vigencia y validez de los certificados, no que los genere. El glosario define el proveedor de acceso como el prestador de servicios que proporciona a sus usuarios acceso a redes de telecomunicaciones. El glosario define los sellos de confianza como distintivos de calidad de una actividad comercial en Internet."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Certificado digital»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q327
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿cuál de las siguientes funciones es la principal de un certificado digital?"
  options:
  - id: a
    text:
      es: "Cifrar las comunicaciones, aunque también puede autenticar al poseedor."
  - id: b
    text:
      es: "Firmar digitalmente, aunque también puede autenticar al poseedor del certificado."
  - id: c
    correct: true
    text:
      es: "Autenticar al poseedor, aunque también puede cifrar comunicaciones y firmar digitalmente."
  - id: d
    text:
      es: "Proteger el equipo frente al software malicioso, aunque también puede autenticar."
  explanation:
    es: "El glosario dice que el certificado digital «tiene como función principal autenticar al poseedor pero puede servir también para cifrar las comunicaciones y firmar digitalmente». Cifrar y firmar son, por tanto, funciones posibles y no la principal, y proteger frente al software malicioso es la función del antivirus."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Certificado digital»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q328
  prompt:
    es: "¿Por qué es necesaria la colaboración de un tercero de confianza en un certificado digital, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque el certificado autentica a un usuario o sitio web ante las partes de la comunicación."
  - id: b
    text:
      es: "Porque el tercero cifra todas las comunicaciones del usuario con el sitio web que visita."
  - id: c
    text:
      es: "Porque el tercero conserva la contraseña de cada usuario que posee un certificado."
  - id: d
    text:
      es: "Porque el tercero sustituye al usuario cuando este no dispone de conexión a Internet."
  explanation:
    es: "El glosario dice que el certificado digital «es válido para autenticar la existencia y validez de un usuario o sitio web, por lo que es necesaria la colaboración de un tercero que sea de confianza para cualquiera de las partes que participe en la comunicación». El tercero se justifica por esa autenticación, y no por cifrar las comunicaciones, guardar contraseñas o sustituir al usuario."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Certificado digital»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q329
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿cuál de las siguientes opciones puede ser la Autoridad Certificadora que genera un certificado digital?"
  options:
  - id: a
    text:
      es: "Solo un organismo público de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "Un organismo público o una empresa reconocida en Internet."
  - id: c
    text:
      es: "Solo una empresa privada con licencia de software propio."
  - id: d
    text:
      es: "Cualquier usuario que disponga de un equipo conectado a Internet."
  explanation:
    es: "El glosario dice que la Autoridad Certificadora puede ser «un organismo público o empresa reconocida en Internet». Por eso no es solo un organismo público, ni solo una empresa privada, ni cualquier usuario: es una entidad de confianza."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Certificado digital»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q330
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a una contraseña robusta, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Corta y generada por defecto o con nombres propios y fechas significativas."
  - id: b
    text:
      es: "Asignada por el fabricante de un dispositivo a todos los aparatos que fabrica."
  - id: c
    text:
      es: "Válida para un solo uso, generada por un dispositivo o aplicación al usarla."
  - id: d
    correct: true
    text:
      es: "Larga, creada al azar o con mayúsculas, minúsculas, números y caracteres especiales."
  explanation:
    es: "El glosario define la contraseña robusta como la «suficientemente larga, que se crea al azar o mediante la combinación de caracteres alfanuméricos (letras mayúsculas y minúsculas, números y caracteres especiales)». Corta y generada por defecto es la contraseña débil, asignada por el fabricante es la predeterminada y válida para un solo uso es la contraseña de un solo uso."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Contraseña robusta»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q331
  prompt:
    es: "Señale la característica de una contraseña débil, según la definición del glosario de ciberseguridad del INCIBE:"
  options:
  - id: a
    text:
      es: "Es larga y se crea al azar combinando letras, números y caracteres especiales."
  - id: b
    text:
      es: "Se cifra y se guarda en un programa integrado en los principales navegadores."
  - id: c
    correct: true
    text:
      es: "Es corta y se genera por defecto o con nombres propios o fechas significativas."
  - id: d
    text:
      es: "Solo sirve una vez y la genera un dispositivo en el momento de utilizarla."
  explanation:
    es: "El glosario describe la contraseña débil como la «corta» y «generada por defecto o mediante el uso de nombres propios, variaciones del nombre del usuario o fechas significativas», que se puede adivinar de forma rápida con diccionarios. Larga y creada al azar es la contraseña robusta, cifrada y guardada en un programa es lo que hace el gestor de contraseñas, y valer para un solo uso es la contraseña de un solo uso."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Contraseña débil»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q332
  prompt:
    es: "¿Cuál de las siguientes recomendaciones da el glosario de ciberseguridad del INCIBE sobre las contraseñas asignadas por el fabricante de un dispositivo o software?"
  options:
  - id: a
    text:
      es: "Conservarlas, porque el fabricante las ha generado de forma segura."
  - id: b
    correct: true
    text:
      es: "Cambiarlas siempre, porque se consideran una vulnerabilidad."
  - id: c
    text:
      es: "Cambiarlas solo cuando el dispositivo se conecta a Internet."
  - id: d
    text:
      es: "Anotarlas en el manual de puesta en marcha del dispositivo."
  explanation:
    es: "El glosario dice que las contraseñas predeterminadas se consideran «una vulnerabilidad, aprovechada por los ciberdelincuentes a menudo para acceder a los dispositivos sin autorización», y que «la recomendación es cambiar siempre las contraseñas por defecto». El glosario las considera una vulnerabilidad y recomienda cambiarlas siempre. El glosario recomienda cambiarlas siempre, no solo en un caso. El glosario dice que figuran en los manuales de puesta en marcha, y de ahí la vulnerabilidad: recomienda cambiarlas."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Contraseña predeterminada»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q333
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a un gestor de contraseñas, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Programa integrable en los navegadores que genera contraseñas robustas y las guarda cifradas."
  - id: b
    text:
      es: "Software de protección que evita que se ejecute software malicioso en el equipo infectado."
  - id: c
    text:
      es: "Fichero generado por una Autoridad Certificadora que asocia datos de identidad a personas."
  - id: d
    text:
      es: "Prueba de desafío-respuesta que distingue a un humano de un programa automático o bot."
  explanation:
    es: "El glosario define el gestor de contraseñas como un «programa o aplicación que se puede integrar en los principales navegadores y que permite generar contraseñas robustas y almacenarlas cifradas». Evitar que se ejecute software malicioso es la función del antivirus, asociar datos de identidad es la del certificado digital y distinguir a un humano de un bot es la del CAPTCHA."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Gestor de contraseñas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q334
  prompt:
    es: "¿Cuál de las siguientes contraseñas basta recordar al usar un gestor de contraseñas, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "La contraseña de cada sitio web y aplicación."
  - id: b
    text:
      es: "El nombre de usuario y la contraseña de cada servicio."
  - id: c
    text:
      es: "El código de un solo uso de cada inicio de sesión."
  - id: d
    correct: true
    text:
      es: "Solo la contraseña de acceso al gestor."
  explanation:
    es: "El glosario dice que el gestor permite tener contraseñas diferentes por cada sitio «con la facilidad de tener que recordar solo la contraseña de acceso al gestor». El glosario dice que basta recordar solo la contraseña de acceso al gestor, y no la de cada sitio. El glosario dice que el gestor almacena los nombres de usuario junto con las contraseñas y basta recordar solo la de acceso al gestor. El glosario dice que basta recordar solo la contraseña de acceso al gestor, no códigos de un solo uso."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Gestor de contraseñas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q337
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿para qué es requerido el certificado digital en algunas administraciones públicas y empresas privadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Para ciertos trámites con intercambio de información sensible entre las partes."
  - id: b
    text:
      es: "Para acceder a cualquier página web que use el protocolo HTTP sin cifrar."
  - id: c
    text:
      es: "Para instalar software con licencia legal en cualquier equipo de la organización."
  - id: d
    text:
      es: "Para enviar correos electrónicos a otros usuarios de la propia organización."
  explanation:
    es: "El glosario dice que el certificado digital, en algunas administraciones públicas y empresas privadas, es requerido «para poder realizar ciertos trámites que involucren intercambio de información sensible entre las partes». No se exige para acceder a cualquier página web ni para enviar correos, y lo que acompaña a un software con licencia legal es el certificado de autenticidad (COA), una etiqueta."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Certificado digital»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q339
  prompt:
    es: "¿Qué ocurre en Windows 11 con algunas actualizaciones de Windows si el dispositivo tiene una conexión de uso medido, según la página de preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Se instalan automáticamente, pero sin reiniciar."
  - id: b
    text:
      es: "Se descargan más rápido que con otras conexiones."
  - id: c
    correct: true
    text:
      es: "No se instalan automáticamente en ese dispositivo."
  - id: d
    text:
      es: "Se desinstalan para ahorrar datos del plan."
  explanation:
    es: "La página dice que, con una conexión de uso medido, «algunas actualizaciones de Windows no se instalarán automáticamente». No se instalan sin reiniciar, ni se descargan más rápido, ni se desinstalan."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q341
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué protege el uso de un certificado cualificado como mecanismo de autenticación?"
  options:
  - id: a
    text:
      es: "Una contraseña de un solo uso enviada al correo del usuario."
  - id: b
    correct: true
    text:
      es: "Un segundo factor, del tipo PIN o biométrico."
  - id: c
    text:
      es: "Un registro de los accesos con éxito y de los fallidos."
  - id: d
    text:
      es: "Una limitación de la ventana de acceso del usuario."
  explanation:
    es: "El Real Decreto dice que, en el refuerzo de certificados, «el uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico». Registrar los accesos y limitar la ventana de acceso son otros refuerzos, y una contraseña de un solo uso es un segundo factor del refuerzo de contraseña más otro factor."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q342
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿cuándo se inhabilitan las credenciales de un usuario de la organización?"
  options:
  - id: a
    text:
      es: "Cuando el usuario cambia de puesto dentro del organismo."
  - id: b
    text:
      es: "Cuando el usuario no accede durante una semana."
  - id: c
    text:
      es: "Cuando el usuario cambia su contraseña con la periodicidad fijada."
  - id: d
    correct: true
    text:
      es: "Cuando el usuario termina su relación con el sistema."
  explanation:
    es: "El Real Decreto dice que «las credenciales serán inhabilitadas cuando el usuario que autentican termina su relación con el sistema». No las vincula a un cambio de puesto ni a una semana sin acceso, y el cambio de credenciales sigue la periodicidad de la política de seguridad."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q352
  prompt:
    es: "¿Qué objetivos tiene una actualización de seguridad en un dispositivo, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Únicamente añadir nuevas funcionalidades al software instalado en el dispositivo del usuario."
  - id: b
    text:
      es: "Solo identificar un tipo de malware en concreto mediante una base de datos."
  - id: c
    text:
      es: "Solo duplicar la información de un soporte a otro para poder recuperarla."
  - id: d
    correct: true
    text:
      es: "Corregir fallos de seguridad y de funcionamiento, y mejorar funciones y rendimiento."
  explanation:
    es: "El glosario define la actualización de seguridad como las modificaciones que se aplican en el software «con el objetivo de corregir fallos de seguridad, errores de funcionamiento o bien para dotar a los dispositivos de nuevas funcionabilidades, así como incorporar mejoras de rendimiento». Identificar tipos de malware es lo que hace la firma antivirus y duplicar información de un soporte a otro es la copia de seguridad."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Actualización de seguridad»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q353
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, un sinónimo de «actualización de seguridad», la modificación del software, es:"
  options:
  - id: a
    correct: true
    text:
      es: "Parches de seguridad."
  - id: b
    text:
      es: "Firmas antivirus."
  - id: c
    text:
      es: "Copias de seguridad."
  - id: d
    text:
      es: "Contraseñas predeterminadas."
  explanation:
    es: "El glosario da como sinónimo de la actualización de seguridad los «parches de seguridad». La firma antivirus es una entrada de la base de datos del antivirus, la copia de seguridad duplica información de un soporte a otro y las contraseñas predeterminadas son las asignadas por el fabricante."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Actualización de seguridad»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q354
  prompt:
    es: "¿Cómo descarga e instala Windows 11 las actualizaciones, según la página de preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Solo cuando el usuario las solicita desde Configuración o Windows Update."
  - id: b
    text:
      es: "Solo cuando el usuario conecta el dispositivo a una red doméstica."
  - id: c
    text:
      es: "Solo cuando el usuario reinicia el dispositivo cada día de la semana."
  - id: d
    correct: true
    text:
      es: "Automáticamente, para que el dispositivo sea seguro y esté actualizado."
  explanation:
    es: "La página dice que Windows 11 «descarga e instala actualizaciones automáticamente para asegurarse de que tu dispositivo sea seguro y esté actualizado». No espera a que el usuario las solicite, ni a una red doméstica, ni a un reinicio diario."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q355
  prompt:
    es: "En Windows 11, ¿qué ruta lleva a buscar actualizaciones manualmente, según la página de preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Inicio › Configuración › Cuentas › Windows Update"
  - id: b
    correct: true
    text:
      es: "Inicio › Configuración › Windows Update"
  - id: c
    text:
      es: "Inicio › Configuración › Sistema › Windows Update"
  - id: d
    text:
      es: "Inicio › Configuración › Seguridad de Windows › Windows Update"
  explanation:
    es: "La página dice que, para buscar actualizaciones manualmente, se selecciona Inicio, Configuración y Windows Update. Windows Update está directamente en Configuración, no dentro de Cuentas, Sistema ni Seguridad de Windows."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q356
  prompt:
    es: "En Windows 11, ¿qué opción de Windows Update permite detener temporalmente la descarga e instalación de las actualizaciones?"
  options:
  - id: a
    text:
      es: "Programar el reinicio."
  - id: b
    text:
      es: "Historial de actualizaciones."
  - id: c
    correct: true
    text:
      es: "Pausar actualizaciones."
  - id: d
    text:
      es: "Buscar actualizaciones."
  explanation:
    es: "La página dice que, en Windows 11, junto a «Pausar actualizaciones» se selecciona la duración de pausa que se prefiera. Programar el reinicio sirve para elegir un momento conveniente para reiniciar, no para detener la descarga. El historial de actualizaciones muestra las actualizaciones instaladas y cuándo se instalaron. Buscar actualizaciones comprueba manualmente si hay actualizaciones, no las detiene."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
