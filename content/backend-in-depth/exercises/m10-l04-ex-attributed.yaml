- id: m10-l04-qa01
  prompt:
    en: According to OWASP in Threat Modeling Cheat Sheet, which statement about threat modeling in application
      security does the cheat sheet make?
  options:
  - id: a
    correct: true
    text:
      en: It is ideally performed early in the SDLC, such as during the design phase
  - id: b
    text:
      en: It is performed once and never again, since the system model stays fixed
  - id: c
    text:
      en: It is an add-on that a team applies after its normal SDLC process
  - id: d
    text:
      en: It analyzes the system from the defender's perspective, focusing on controls
  explanation:
    en: The cheat sheet says threat modeling is ideally performed early in the SDLC, such as during the design phase.
      According to the cheat sheet, threat modeling is not something that is performed once and never again, which
      contradicts performing it once and never again because the system model stays fixed. The cheat sheet states
      that ideally, threat modeling should be integrated seamlessly into a team's normal SDLC process; it should
      be treated as a standard and necessary step in the process, not an add-on, which contradicts treating it as
      an add-on applied after the normal SDLC process. Per the cheat sheet, threat modeling analyzes a system from
      an adversarial perspective, focusing on ways an attacker can exploit it, not from the defender's side focused
      on controls.
  citation: owasp-cs-threat-modeling#overview
  extract:
    en: Threat modeling is ideally performed early in the SDLC, such as during the design phase.
- id: m10-l04-qa04
  prompt:
    en: According to Erik S. and Barry Zhang in Building effective agents, which description of an agent does the
      post give when it separates agents from workflows?
  options:
  - id: a
    text:
      en: Systems where LLMs and tools are orchestrated through predefined code paths
  - id: b
    text:
      en: Systems that run without any human command or interactive discussion at the start
  - id: c
    correct: true
    text:
      en: Systems where LLMs dynamically direct their own processes and tool usage
  - id: d
    text:
      en: Systems that always run until the task ends, with no stopping conditions
  explanation:
    en: The post describes agents as systems where LLMs dynamically direct their own processes and tool usage, maintaining
      control over how they accomplish tasks. The post assigns the description of LLMs and tools orchestrated through
      predefined code paths to workflows, so it does not describe an agent. According to the post, agents begin
      their work with either a command from, or interactive discussion with, the human user, so starting without
      one contradicts it. Stopping conditions, such as a maximum number of iterations, are described as common for
      maintaining control, which contradicts running with none.
  citation: anthropic-building-effective-agents#what-are-agents; anthropic-building-effective-agents#agents
- id: m10-l04-qa05
  prompt:
    en: According to Erik S. and Barry Zhang in Building effective agents, what does the post recommend when building
      applications with large language models?
  options:
  - id: a
    text:
      en: Start with an agent framework so its abstraction layers handle the details
  - id: b
    correct: true
    text:
      en: Find the simplest solution possible, adding complexity only when needed
  - id: c
    text:
      en: Prefer agents over workflows for well-defined tasks, for their predictability
  - id: d
    text:
      en: Replace optimized single LLM calls with agents in most applications
  explanation:
    en: The post recommends finding the simplest solution possible and only increasing complexity when needed. What
      the post suggests is that developers start by using LLM APIs directly, not with a framework. The post says
      that when more complexity is warranted, workflows offer predictability and consistency for well-defined tasks,
      whereas agents are the better option when flexibility and model-driven decision-making are needed at scale,
      which contradicts preferring agents over workflows for well-defined tasks for their predictability. The post
      states that for many applications, optimizing single LLM calls with retrieval and in-context examples is usually
      enough, which contradicts replacing them with agents in most applications.
  citation: anthropic-building-effective-agents#when-and-when-not-to-use-agents; anthropic-building-effective-agents#when-and-how-to-use-frameworks
