# anchor: boe-a-2003-23186-art-75
- id: m03-l10-q0071
  prompt:
    es: "De acuerdo con el artículo 75 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias solo podrán condonarse:"
  options:
  - id: a
    correct: true
    text:
      es: "En virtud de ley, en la cuantía y con los requisitos que en ella se determinen."
  - id: b
    text:
      es: "Por acuerdo del órgano de recaudación, en la cuantía que estime procedente."
  - id: c
    text:
      es: "Por reglamento, en la cuantía y con los requisitos que este determine."
  - id: d
    text:
      es: "Por resolución del Director General de la Agencia, previa declaración de insolvencia."
  explanation:
    es: "Solo una ley puede condonar deudas tributarias, fijando cuantía y requisitos. Ni el órgano de recaudación, ni un reglamento, ni el Director General de la Agencia pueden hacerlo, con o sin insolvencia."
  citation: "art. 75 LGT"
  difficulty: 1
  tags:
  - "condonación"
# anchor: boe-a-2003-23186-art-75
- id: m03-l10-q0072
  prompt:
    es: "Sobre la condonación de las deudas tributarias, señale la respuesta CORRECTA de acuerdo con el artículo 75 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "La Administración tributaria puede condonar las deudas de cuantía reducida sin necesidad de ley."
  - id: b
    correct: true
    text:
      es: "La ley que la establece determina la cuantía de la deuda condonada y los requisitos exigibles."
  - id: c
    text:
      es: "La condonación procede de oficio cuando se declara el crédito incobrable."
  - id: d
    text:
      es: "La condonación exige un acuerdo previo entre la Administración y el obligado tributario."
  explanation:
    es: "La condonación depende de una ley que fije la cuantía y los requisitos. No cabe condonar sin ley por razón de la cuantía, la declaración de crédito incobrable es una baja provisional que no condona la deuda y el precepto no exige acuerdo entre las partes."
  citation: "art. 75 LGT"
  difficulty: 2
  tags:
  - "condonación"
# anchor: boe-a-2003-23186-art-76
- id: m03-l10-q0074
  prompt:
    es: "De acuerdo con el artículo 76.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias que no han podido hacerse efectivas por insolvencia probada, total o parcial, de los obligados tributarios se dan de baja en cuentas mediante:"
  options:
  - id: a
    text:
      es: "La condonación de la deuda por el órgano de recaudación, sin posibilidad de rehabilitación posterior."
  - id: b
    text:
      es: "La declaración del crédito como incobrable, total o parcial, con carácter definitivo y sin posibilidad de rehabilitación."
  - id: c
    text:
      es: "La declaración de nulidad de las liquidaciones que originaron la deuda, de oficio y en la cuantía procedente."
  - id: d
    correct: true
    text:
      es: "La declaración del crédito como incobrable, total o parcial, en tanto no se rehabiliten dentro del plazo de prescripción."
  explanation:
    es: "La baja en cuentas se hace declarando el crédito incobrable, total o parcialmente, y es provisional: se mantiene en tanto no se rehabilite dentro del plazo de prescripción. La condonación solo cabe por ley (artículo 75). Declarar el crédito incobrable de forma definitiva niega la rehabilitación que el precepto prevé. Y la nulidad de las liquidaciones es otra figura de revisión que no se aplica a la insolvencia."
  citation: "art. 76.1 LGT"
  difficulty: 2
  tags:
  - "baja provisional"
  - "insolvencia"
# anchor: boe-a-2003-23186-art-76
- id: m03-l10-q0075
  prompt:
    es: "Según el artículo 76.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la deuda tributaria dada de baja por insolvencia se extingue si:"
  options:
  - id: a
    text:
      es: "Transcurre un año desde la declaración de crédito incobrable sin que se rehabilite."
  - id: b
    text:
      es: "Se declara fallido a todos los obligados al pago, aunque no haya vencido la prescripción."
  - id: c
    text:
      es: "Se inscribe la declaración de fallido en el Registro Mercantil sin que haya recursos pendientes."
  - id: d
    correct: true
    text:
      es: "Vencido el plazo de prescripción, no se ha rehabilitado."
  explanation:
    es: "La extinción llega al vencer el plazo de prescripción sin rehabilitación. No corre un plazo de un año desde la declaración. La declaración de fallido de todos los obligados lleva a declarar incobrable el crédito, pero no extingue la deuda. La anotación en el Registro Mercantil es solo un efecto de la declaración de fallido (artículo 62.3 del Reglamento)."
  citation: "art. 76.2 LGT"
  difficulty: 1
  tags:
  - "baja provisional"
  - "extinción"
# anchor: boe-a-2003-23186-art-76
- id: m03-l10-q0076
  prompt:
    es: "Un crédito tributario de 8.000 euros contra Cerámicas Soto, S.L. se declaró incobrable el 3 de marzo de 2026. Su plazo de prescripción vence el 30 de noviembre de 2027, y hasta esa fecha no se ha conocido ninguna solvencia ni se ha rehabilitado el crédito. Conforme al artículo 76.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre el 1 de diciembre de 2027?"
  options:
  - id: a
    text:
      es: "La deuda sigue viva y puede rehabilitarse mientras no la condone una ley."
  - id: b
    text:
      es: "La deuda se extingue solo si la sociedad alega la prescripción ante la Administración."
  - id: c
    text:
      es: "La deuda pasa a período voluntario de pago con un nuevo plazo de ingreso."
  - id: d
    correct: true
    text:
      es: "La deuda tributaria se extingue, porque vencido el plazo de prescripción no se ha rehabilitado."
  explanation:
    es: "La baja por incobrable es provisional hasta que vence la prescripción. Pasado el 30 de noviembre de 2027 sin rehabilitación, la deuda se extingue por mandato del artículo 76.2, sin esperar a ninguna condonación ni a que la alegue la sociedad, y no vuelve al período voluntario."
  citation: "art. 76.2 LGT"
  difficulty: 3
  tags:
  - "baja provisional"
  - "extinción"
  - "cómputo"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0077
  prompt:
    es: "De acuerdo con el artículo 61.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, se estima que no existen bienes o derechos embargables cuando los poseídos por el obligado al pago:"
  options:
  - id: a
    text:
      es: "Hubiesen sido adjudicados a la Hacienda pública conforme a las reglas de adjudicación de bienes y derechos."
  - id: b
    correct: true
    text:
      es: "No hubiesen sido adjudicados a la Hacienda pública conforme a las reglas de adjudicación de bienes y derechos."
  - id: c
    text:
      es: "No hubiesen sido embargados por otro acreedor con anterioridad al embargo de la Hacienda pública."
  - id: d
    text:
      es: "Tuviesen cargas anteriores de importe superior al valor de tasación de los bienes y derechos."
  explanation:
    es: "Se presume que no hay bienes embargables cuando los que posee el obligado no se adjudicaron a la Hacienda pública conforme a las reglas de adjudicación. Si se adjudicaron, el supuesto no se da. El embargo previo por otro acreedor y las cargas superiores al valor de tasación no son el criterio del artículo."
  citation: "art. 61.1 RGR"
  difficulty: 2
  tags:
  - "fallido"
  - "bienes embargables"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0078
  prompt:
    es: "Según el artículo 61.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo se considera fallido por insolvencia parcial a un obligado al pago?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando su patrimonio embargable o realizable conocido solo alcanza a cubrir una parte de la deuda."
  - id: b
    text:
      es: "Cuando solo se ignora la existencia de bienes embargables de uno de los varios obligados al pago."
  - id: c
    text:
      es: "Cuando ha pagado una parte de la deuda y no ingresa el resto en el período ejecutivo."
  - id: d
    text:
      es: "Cuando su patrimonio conocido alcanza a cubrir la deuda pero no los recargos del período ejecutivo."
  explanation:
    es: "El fallido por insolvencia parcial es el deudor cuyo patrimonio embargable o realizable conocido solo cubre una parte de la deuda. No se trata de que otro obligado conserve bienes, ni de un pago parcial seguido de impago, ni de una insuficiencia limitada a los recargos."
  citation: "art. 61.1 RGR"
  difficulty: 2
  tags:
  - "fallido"
  - "insolvencia parcial"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0079
  prompt:
    es: "Conforme al artículo 61.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, son créditos incobrables:"
  options:
  - id: a
    text:
      es: "Los que han prescrito por el transcurso del plazo sin que se haya reclamado su pago."
  - id: b
    correct: true
    text:
      es: "Los que no han podido hacerse efectivos en el procedimiento de apremio por resultar fallidos los obligados al pago."
  - id: c
    text:
      es: "Los que no han podido ingresarse en período voluntario por falta de liquidez del obligado."
  - id: d
    text:
      es: "Los que se han condonado por ley a favor de los obligados al pago que resultan insolventes."
  explanation:
    es: "El crédito incobrable es el que no se ha podido cobrar en el apremio porque los obligados al pago resultaron fallidos. El crédito prescrito se extingue, no se declara incobrable. La falta de pago en voluntario abre el ejecutivo. La condonación es una figura distinta que exige ley."
  citation: "art. 61.1 RGR"
  difficulty: 1
  tags:
  - "incobrable"
  - "concepto"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0082
  prompt:
    es: "De acuerdo con el artículo 61.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, una vez declarados fallidos los deudores principales y los responsables solidarios, la acción de cobro se dirige:"
  options:
  - id: a
    text:
      es: "Frente a los sucesores de los deudores principales."
  - id: b
    correct: true
    text:
      es: "Frente al responsable subsidiario."
  - id: c
    text:
      es: "Frente a un nuevo deudor principal designado por el órgano de recaudación."
  - id: d
    text:
      es: "Frente a ningún obligado, declarándose incobrable el crédito en todo caso."
  explanation:
    es: "Declarados fallidos los deudores principales y los solidarios, la acción se dirige frente al responsable subsidiario. El crédito solo se declara incobrable si no hay responsables subsidiarios o si, existiendo, resultan fallidos. El precepto no prevé acudir a los sucesores ni a un nuevo deudor designado."
  citation: "art. 61.2 RGR"
  difficulty: 1
  tags:
  - "fallido"
  - "responsables"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0083
  prompt:
    es: "Un crédito tributario se reclama a Textiles Mora, S.L. como deudora principal y a su administrador como responsable solidario. Ambos resultan fallidos y no existe ningún responsable subsidiario. Según el artículo 61.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué procede?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el órgano de recaudación declare incobrable el crédito."
  - id: b
    text:
      es: "Que el órgano de recaudación condone la deuda por insolvencia de ambos obligados."
  - id: c
    text:
      es: "Que se reclame el crédito al órgano que dictó la liquidación impagada."
  - id: d
    text:
      es: "Que se reanude el procedimiento de apremio contra los fallidos transcurrido un año."
  explanation:
    es: "Sin responsable subsidiario y con el deudor principal y el solidario fallidos, el órgano de recaudación declara incobrable el crédito. La condonación exige una ley, la deuda no se reclama al órgano que liquidó, y el apremio solo se reanuda cuando se conoce la solvencia de algún obligado, sin plazo fijo de un año."
  citation: "art. 61.2 RGR"
  difficulty: 2
  tags:
  - "fallido"
  - "incobrable"
  - "responsables"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0084
  prompt:
    es: "Según el artículo 61.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿quién declara incobrable el crédito si no existen responsables subsidiarios o, existiendo, resultan fallidos?"
  options:
  - id: a
    text:
      es: "El Director del Departamento de Recaudación."
  - id: b
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "El órgano de recaudación competente."
  - id: d
    text:
      es: "El órgano que dictó la liquidación impagada."
  explanation:
    es: "El crédito lo declara incobrable el órgano de recaudación. El Director del Departamento de Recaudación solo determina las actuaciones que justifican la declaración (artículo 61.3). La Intervención General y el órgano que liquidó no la declaran."
  citation: "art. 61.2 RGR"
  difficulty: 1
  tags:
  - "incobrable"
  - "órgano"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0085
  prompt:
    es: "Conforme al artículo 61.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el Director del Departamento de Recaudación de la Agencia Estatal de Administración Tributaria determina:"
  options:
  - id: a
    text:
      es: "Los obligados al pago que deben declararse fallidos en cada ejercicio."
  - id: b
    text:
      es: "El importe mínimo de deuda a partir del cual puede declararse incobrable un crédito."
  - id: c
    correct: true
    text:
      es: "Las actuaciones concretas que deben realizarse para justificar la declaración de crédito incobrable."
  - id: d
    text:
      es: "El plazo en que deben rehabilitarse los créditos declarados incobrables."
  explanation:
    es: "El Director determina las actuaciones que justifican la declaración de crédito incobrable, atendiendo a criterios de eficiencia. No designa a los fallidos, no fija un importe mínimo y no señala un plazo para rehabilitar, que depende de la prescripción."
  citation: "art. 61.3 RGR"
  difficulty: 2
  tags:
  - "incobrable"
  - "órgano"
# anchor: boe-a-2005-14803-art-62
- id: m03-l10-q0086
  prompt:
    es: "Según el artículo 62.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la declaración total o parcial de crédito incobrable determina:"
  options:
  - id: a
    text:
      es: "La extinción de la deuda tributaria en la cuantía a que se refiera la declaración."
  - id: b
    text:
      es: "La condonación del crédito en la cuantía que determine el órgano de recaudación."
  - id: c
    correct: true
    text:
      es: "La baja en cuentas del crédito en la cuantía a que se refiera la declaración."
  - id: d
    text:
      es: "La suspensión de la prescripción del crédito hasta que se conozca la solvencia."
  explanation:
    es: "La declaración da de baja en cuentas el crédito en la cuantía declarada. No extingue la deuda, que solo se extingue por prescripción sin rehabilitación (artículo 76.2 de la Ley General Tributaria), ni la condona, ni suspende la prescripción."
  citation: "art. 62.1 RGR"
  difficulty: 1
  tags:
  - "incobrable"
  - "efectos"
# anchor: boe-a-2005-14803-art-62
- id: m03-l10-q0087
  prompt:
    es: "De acuerdo con el artículo 62.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la declaración de crédito incobrable no impide el ejercicio por la Hacienda pública de las acciones que procedan contra quien corresponda, en tanto no se haya producido:"
  options:
  - id: a
    text:
      es: "El aplazamiento de la deuda a favor de los obligados al pago."
  - id: b
    text:
      es: "La inscripción de la declaración de fallido en el Registro Mercantil."
  - id: c
    correct: true
    text:
      es: "La prescripción del derecho de la Administración para exigir el pago."
  - id: d
    text:
      es: "El transcurso de un año desde la declaración de crédito incobrable."
  explanation:
    es: "Las acciones siguen abiertas mientras no prescriba el derecho a exigir el pago. El aplazamiento, la anotación registral y el simple paso de un año no cierran esa posibilidad."
  citation: "art. 62.2 RGR"
  difficulty: 1
  tags:
  - "incobrable"
  - "efectos"
  - "prescripción"
# anchor: boe-a-2005-14803-art-62
- id: m03-l10-q0088
  prompt:
    es: "Conforme al artículo 62.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la declaración de fallido de personas o entidades inscritas en el Registro Mercantil se anota en este en virtud de:"
  options:
  - id: a
    correct: true
    text:
      es: "Mandamiento expedido por el órgano de recaudación competente."
  - id: b
    text:
      es: "Certificado expedido por el Director del Departamento de Recaudación."
  - id: c
    text:
      es: "Instancia presentada por el propio obligado declarado fallido."
  - id: d
    text:
      es: "Resolución dictada por el Tribunal Económico-Administrativo competente."
  explanation:
    es: "La anotación se practica por mandamiento del órgano de recaudación competente. El Director del Departamento no expide certificado a ese fin, el obligado no promueve su propia anotación y el tribunal económico-administrativo no interviene."
  citation: "art. 62.3 RGR"
  difficulty: 1
  tags:
  - "fallido"
  - "Registro Mercantil"
# anchor: boe-a-2005-14803-art-63
- id: m03-l10-q0091
  prompt:
    es: "Según el artículo 63.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿quién vigila la posible solvencia sobrevenida de los obligados al pago declarados fallidos?"
  options:
  - id: a
    text:
      es: "El Departamento de Inspección Financiera y Tributaria."
  - id: b
    correct: true
    text:
      es: "El órgano de recaudación."
  - id: c
    text:
      es: "El Tribunal Económico-Administrativo competente."
  - id: d
    text:
      es: "La oficina de contabilidad del órgano gestor del crédito."
  explanation:
    es: "La vigilancia corresponde al órgano de recaudación. La inspección financiera, el tribunal económico-administrativo y la oficina de contabilidad del órgano gestor no tienen esa función según el artículo."
  citation: "art. 63.1 RGR"
  difficulty: 1
  tags:
  - "fallido"
  - "revisión"
# anchor: boe-a-2005-14803-art-63
- id: m03-l10-q0092
  prompt:
    es: "De acuerdo con el artículo 63.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si se produce la solvencia sobrevenida y no ha mediado prescripción, procede rehabilitar los créditos incobrables y se reanuda el procedimiento de recaudación partiendo de:"
  options:
  - id: a
    text:
      es: "El inicio del procedimiento de apremio, con una nueva providencia notificada al obligado."
  - id: b
    text:
      es: "El período voluntario de pago, con un nuevo plazo de ingreso para el obligado."
  - id: c
    text:
      es: "La fecha de la rehabilitación, sin conservar las actuaciones anteriores del procedimiento."
  - id: d
    correct: true
    text:
      es: "La situación en que se encontraban en el momento de la declaración de crédito incobrable o de la baja por referencia."
  explanation:
    es: "La recaudación se reanuda desde la situación en que estaba al declarar el crédito incobrable o dar la baja por referencia, de modo que se conservan las actuaciones. No se vuelve al inicio del apremio, al período voluntario ni se parte de cero."
  citation: "art. 63.2 RGR"
  difficulty: 2
  tags:
  - "fallido"
  - "rehabilitación"
# anchor: boe-a-2005-14803-art-61
- id: m03-l10-q0117
  prompt:
    es: "La recaudación comprueba que se ignora si Mármoles Duero, S.L. tiene algún bien o derecho embargable o realizable con el que cobrar su deuda. Según el artículo 61.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cómo se considera a esta sociedad?"
  options:
  - id: a
    text:
      es: "Obligada al pago fallida por insolvencia parcial, porque su patrimonio embargable conocido solo cubre una parte de la deuda."
  - id: b
    correct: true
    text:
      es: "Obligada al pago fallida, porque se ignora la existencia de bienes o derechos embargables o realizables."
  - id: c
    text:
      es: "Obligada al pago fallida solo cuando haya prescrito el derecho de la Administración a cobrar su deuda."
  - id: d
    text:
      es: "Obligada insolvente a efectos concursales, porque ignorar sus bienes equivale a una declaración de concurso."
  explanation:
    es: "Se consideran fallidos los obligados al pago respecto de los cuales se ignore la existencia de bienes o derechos embargables o realizables para el cobro del débito (art. 61.1 RGR). La sociedad está justo en ese caso. La insolvencia parcial exige conocer un patrimonio que solo alcanza a cubrir una parte de la deuda, y aquí se ignora todo patrimonio. La norma no espera a la prescripción para considerar fallido al obligado. La declaración de concurso es una situación distinta, que la norma no equipara a ignorar los bienes."
  citation: "art. 61.1 RGR"
  difficulty: 2
  tags:
  - "fallido"
  - "bienes embargables"
# anchor: boe-a-2003-23186-art-173
- id: m03-l10-q0093
  prompt:
    es: "Respecto del acuerdo que declara el crédito total o parcialmente incobrable como causa de terminación del procedimiento de apremio, señale la respuesta CORRECTA según el artículo 173.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Procede en cuanto se declara fallido el deudor principal, aunque existan responsables solventes."
  - id: b
    text:
      es: "Procede cuando transcurre el plazo de prescripción sin que el procedimiento se haya reanudado."
  - id: c
    text:
      es: "Procede cuando el obligado no paga en el plazo abierto con la notificación de la providencia de apremio."
  - id: d
    correct: true
    text:
      es: "Procede una vez declarados fallidos todos los obligados al pago."
  explanation:
    es: "El apremio termina con el acuerdo de incobrable cuando todos los obligados al pago han sido declarados fallidos. No basta el deudor principal si hay responsables. La prescripción sin reanudación extingue la deuda, y el impago tras la providencia de apremio abre el embargo, no termina el procedimiento."
  citation: "art. 173.1 LGT"
  difficulty: 2
  tags:
  - "terminación del apremio"
  - "incobrable"
# anchor: boe-a-2003-23186-art-173
- id: m03-l10-q0094
  prompt:
    es: "¿Cuál de las siguientes circunstancias determina la terminación del procedimiento de apremio según el artículo 173.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La notificación de la providencia de apremio al obligado al pago."
  - id: b
    text:
      es: "La presentación de una solicitud de aplazamiento por el obligado al pago."
  - id: c
    text:
      es: "La declaración de fallido de uno solo de los obligados al pago."
  - id: d
    correct: true
    text:
      es: "El acuerdo de haber quedado extinguida la deuda por cualquier otra causa."
  explanation:
    es: "El apremio termina con el pago, con el acuerdo de crédito incobrable tras declarar fallidos a todos los obligados y con el acuerdo de extinción de la deuda por cualquier otra causa. La providencia es el acto con que se inicia el apremio. La solicitud de aplazamiento no lo termina, y un solo fallido no basta si hay más obligados."
  citation: "art. 173.1 LGT"
  difficulty: 1
  tags:
  - "terminación del apremio"
# anchor: boe-a-2005-14803-art-116
- id: m03-l10-q0097
  prompt:
    es: "Conforme al artículo 116.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando en el procedimiento de apremio resultan solventados los débitos perseguidos y las costas:"
  options:
  - id: a
    text:
      es: "Se dicta una resolución de terminación que se notifica al obligado para que alegue."
  - id: b
    text:
      es: "Se archiva el expediente sin declaración alguna, que queda abierto hasta la prescripción."
  - id: c
    text:
      es: "Se declara el expediente suspendido hasta que se aprueben las cuentas de las costas."
  - id: d
    correct: true
    text:
      es: "Se declara dicho extremo en el expediente de apremio, que queda ultimado."
  explanation:
    es: "Cuando los débitos y las costas están solventados, se declara en el expediente de apremio, que queda ultimado. No hay resolución con trámite de alegaciones, no se archiva sin declaración y no se suspende a la espera de las costas, que ya están solventadas."
  citation: "art. 116.1 RGR"
  difficulty: 2
  tags:
  - "terminación del apremio"
  - "ultimado"
# anchor: boe-a-2005-14803-art-116
- id: m03-l10-q0098
  prompt:
    es: "De acuerdo con el artículo 116.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el importe obtenido en el procedimiento de apremio es insuficiente, se aplica:"
  options:
  - id: a
    text:
      es: "En primer lugar a las deudas más antiguas y seguidamente a las costas del procedimiento."
  - id: b
    text:
      es: "En primer lugar a los intereses de demora de todas las deudas y después a las costas."
  - id: c
    text:
      es: "A prorrata entre las costas y las deudas cuyo cobro se persigue en el procedimiento."
  - id: d
    correct: true
    text:
      es: "En primer lugar a las costas y seguidamente a las deudas cuyo cobro se persigue, según las reglas de imputación de pagos."
  explanation:
    es: "El importe insuficiente se aplica primero a las costas y después a las deudas según las reglas de imputación de pagos de la Ley General Tributaria. No se pone antes la deuda más antigua ni los intereses, y tampoco se reparte a prorrata."
  citation: "art. 116.2 RGR"
  difficulty: 2
  tags:
  - "terminación del apremio"
  - "imputación"
# anchor: boe-a-2005-14803-art-116
- id: m03-l10-q0100
  prompt:
    es: "Conforme al artículo 116.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, por la parte de deuda que no se ha podido solventar en el procedimiento de apremio:"
  options:
  - id: a
    correct: true
    text:
      es: "Se actúa de acuerdo con lo dispuesto para los créditos incobrables."
  - id: b
    text:
      es: "Se inicia un procedimiento de deducción sobre transferencias."
  - id: c
    text:
      es: "Se declara la deuda extinguida por condonación del órgano de recaudación."
  - id: d
    text:
      es: "Se concede un nuevo plazo de ingreso en período voluntario."
  explanation:
    es: "La parte no solventada se trata conforme a las reglas de los créditos incobrables. La deducción sobre transferencias es propia de entidades públicas, la condonación exige ley y no se reabre el período voluntario."
  citation: "art. 116.2 RGR"
  difficulty: 1
  tags:
  - "terminación del apremio"
  - "incobrables"
