# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0107
  prompt:
    es: "¿Qué ocurre con el acuerdo de inclusión en el sistema de cuenta corriente si se disuelve la entidad incluida, según el artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Se revoca, porque la disolución de la entidad es causa de revocación."
  - id: b
    text:
      es: "Se mantiene, porque solo la muerte del obligado persona física es causa de revocación."
  - id: c
    text:
      es: "Se suspende hasta que se inscriba la liquidación de la entidad en el Registro Mercantil."
  - id: d
    text:
      es: "Se mantiene, siempre que continúe el ejercicio de las actividades por medio de representante."
  explanation:
    es: "La disolución de la entidad es causa de revocación. La salvedad del representante solo juega para la incapacitación, no para la disolución, y el artículo no prevé una suspensión a la espera de la liquidación. Tampoco limita la muerte a las personas físicas como única causa."
  citation: "art. 143.3 RGAT"
  difficulty: 2
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0108
  prompt:
    es: "¿En qué período deben encontrarse las deudas tributarias que la Administración tributaria compensa de oficio según el primer párrafo del artículo 73.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "En período voluntario, desde que se notifica la liquidación al obligado."
  - id: b
    correct: true
    text:
      es: "En período ejecutivo, sin necesidad de solicitud del obligado."
  - id: c
    text:
      es: "En período voluntario o ejecutivo, a elección de la Administración tributaria."
  - id: d
    text:
      es: "En período ejecutivo, solo si el obligado no ha pedido aplazamiento de la deuda."
  explanation:
    es: "La Administración compensa de oficio las deudas que se encuentren en período ejecutivo. No actúa de oficio sobre deudas en voluntario, salvo los supuestos del párrafo segundo, ni elige el período, y la petición de aplazamiento no es condición del primer párrafo."
  citation: "art. 73.1 LGT"
  difficulty: 1
  tags:
  - "compensación de oficio"
  - "período ejecutivo"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0110
  prompt:
    es: "Sobre los créditos que se anotan en la cuenta corriente tributaria, señale la respuesta CORRECTA según el artículo 139.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio:"
  options:
  - id: a
    text:
      es: "Se anotan los reconocidos por devoluciones acordadas durante el año natural anterior a la inclusión en el sistema."
  - id: b
    correct: true
    text:
      es: "Se anotan los reconocidos por devoluciones tributarias derivadas de la normativa del tributo acordadas durante el período de aplicación del sistema."
  - id: c
    text:
      es: "Se anotan los reconocidos por devoluciones de cualquier tributo o tasa estatal, sin distinción."
  - id: d
    text:
      es: "Se anotan los reconocidos por cualquier procedimiento de revisión que reconozca una devolución."
  explanation:
    es: "Se anotan las devoluciones derivadas de la normativa del tributo acordadas mientras el sistema es aplicable y correspondientes a los tributos que enumera el artículo. Las acordadas antes de la inclusión no entran, ni las de cualquier tributo o tasa, ni las de los procedimientos de revisión, que el apartado 4.c excluye."
  citation: "art. 139.2 RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "anotación"
  - "créditos"
# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0112
  prompt:
    es: "¿Cuál de las siguientes parejas de forma de extinción y momento es CORRECTA según los artículos 72.3, 73.3 y 74.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Compensación a instancia del obligado: en el momento del inicio del período ejecutivo."
  - id: b
    text:
      es: "Compensación de oficio de una deuda en ejecutivo: en el momento de la presentación de la solicitud."
  - id: c
    text:
      es: "Deducción sobre transferencias: en el momento en que se inicia el procedimiento."
  - id: d
    correct: true
    text:
      es: "Deducción sobre transferencias: cuando se produce la deducción y por la cantidad concurrente."
  explanation:
    es: "La deducción extingue la deuda cuando se produce y por la cantidad concurrente. La compensación a instancia se extingue al presentar la solicitud o, si fuera posterior, al cumplirse los requisitos, no al iniciarse el ejecutivo. La compensación de oficio de una deuda en ejecutivo atiende al inicio del ejecutivo, no a una solicitud. Y el inicio de la deducción solo suspende el cobro."
  citation: "art. 74.3 LGT"
  difficulty: 3
  tags:
  - "extinción"
  - "compensación"
  - "deducciones sobre transferencias"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0114
  prompt:
    es: "¿Cuál de los siguientes datos debe contener la solicitud de compensación según el artículo 56.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El número de la cuenta bancaria en que debe abonarse el crédito."
  - id: b
    text:
      es: "Una declaración de que el obligado no tiene otras deudas con la Hacienda pública."
  - id: c
    text:
      es: "La propuesta de resolución redactada por el propio solicitante."
  - id: d
    correct: true
    text:
      es: "El lugar, la fecha y la firma del solicitante."
  explanation:
    es: "La solicitud incluye lugar, fecha y firma del solicitante. El artículo no pide cuenta bancaria, ni declaración de ausencia de otras deudas, ni propuesta de resolución."
  citation: "art. 56.1 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "solicitud"
  - "contenido"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0119
  prompt:
    es: "De acuerdo con el artículo 139.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, señale la respuesta CORRECTA sobre lo excluido de la cuenta corriente tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Las deudas que se derivan de liquidaciones provisionales o definitivas practicadas por los órganos de la Administración tributaria."
  - id: b
    text:
      es: "Las deudas que se derivan de autoliquidaciones presentadas en plazo de los impuestos incluidos en el sistema."
  - id: c
    text:
      es: "Las deudas que se derivan de pagos a cuenta del IRPF cuyo plazo finalice durante el período de aplicación del sistema."
  - id: d
    text:
      es: "Los créditos por devoluciones del IVA acordadas en aplicación de la normativa del tributo durante el período del sistema."
  explanation:
    es: "No pueden anotarse las deudas que se derivan de liquidaciones provisionales o definitivas practicadas por los órganos de la Administración tributaria (art. 139.4.b RGAT). Las autoliquidaciones presentadas en plazo de los impuestos incluidos, los pagos a cuenta del IRPF cuyo plazo finaliza durante el período de aplicación y las devoluciones del IVA acordadas por la normativa del tributo sí son objeto de anotación (art. 139.2 y 139.3)."
  citation: "art. 139.4 RGAT"
  difficulty: 2
  tags:
  - "cuenta corriente tributaria"
  - "liquidaciones"
# anchor: boe-a-2003-23186-art-71
- id: m03-l10-q0125
  prompt:
    es: "¿Cómo se acuerda la compensación de las deudas tributarias de un obligado, según el artículo 71.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "De oficio o a instancia del obligado tributario, en las condiciones que se establezcan reglamentariamente."
  - id: b
    text:
      es: "Solo a instancia del obligado tributario, mediante solicitud presentada en período voluntario."
  - id: c
    text:
      es: "Solo de oficio por la Administración, cuando la deuda se encuentre en período ejecutivo."
  - id: d
    text:
      es: "De oficio en período ejecutivo y a instancia del obligado, pero nunca en período voluntario."
  explanation:
    es: "La compensación se acuerda de oficio o a instancia del obligado tributario (art. 71.2), y el artículo 71.1 remite las condiciones al reglamento. Limitarla a la solicitud del obligado deja fuera la compensación de oficio, que regula el artículo 73. Limitarla a la Administración elimina la solicitud, que regula el artículo 72. Excluir el período voluntario contradice que el obligado pueda pedirla en ese período (art. 72.1)."
  citation: "art. 71.2 LGT"
  difficulty: 1
  tags:
  - "compensación"
  - "de oficio"
  - "a instancia"
# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0056
  prompt:
    es: "Conforme al artículo 74.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias vencidas, líquidas y exigibles de las comunidades autónomas, entidades locales y demás entidades de derecho público con el Estado podrán extinguirse con deducciones sobre:"
  options:
  - id: a
    text:
      es: "Los créditos que las referidas entidades tengan reconocidos por devoluciones tributarias."
  - id: b
    text:
      es: "Los bienes y derechos de las referidas entidades que embargue el órgano de recaudación."
  - id: c
    text:
      es: "Las cantidades que las referidas entidades deban ingresar al Estado por recargos del período ejecutivo."
  - id: d
    correct: true
    text:
      es: "Las cantidades que la Administración del Estado deba transferir a las referidas entidades."
  explanation:
    es: "La deducción opera sobre las cantidades que el Estado debe transferir a la entidad deudora. Los créditos por devoluciones se compensan, el embargo es del procedimiento de apremio y los recargos son una deuda de la entidad, no una cantidad sobre la que deducir."
  citation: "art. 74.1 LGT"
  difficulty: 1
  tags:
  - "deducciones sobre transferencias"
# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0057
  prompt:
    es: "Respecto de la aplicación del régimen de deducciones sobre transferencias a las comunidades autónomas, a las entidades de derecho público dependientes de estas y a las entidades locales, señale la respuesta CORRECTA según el artículo 74.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Se realiza en los supuestos y conforme al procedimiento que determine el Departamento de Recaudación."
  - id: b
    text:
      es: "Se realiza mediante un convenio que suscribe cada entidad con la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "Se realiza conforme al procedimiento de apremio de esta ley, sin remitirse a ninguna legislación específica."
  - id: d
    correct: true
    text:
      es: "Se realiza en los supuestos y conforme al procedimiento establecido en la legislación específica."
  explanation:
    es: "El segundo párrafo del artículo 74.1 remite a los supuestos y al procedimiento de la legislación específica. No atribuye la regulación al Departamento de Recaudación, no exige convenio con la Agencia y tampoco aplica el apremio sin remitirse a esa legislación."
  citation: "art. 74.1 LGT"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "legislación específica"
# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0058
  prompt:
    es: "De acuerdo con el artículo 74.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la extinción de las deudas objeto del procedimiento de deducción sobre transferencias tendrá lugar:"
  options:
  - id: a
    text:
      es: "Cuando se notifique la propuesta de deducción y por el importe íntegro de la deuda."
  - id: b
    correct: true
    text:
      es: "Cuando se produzca la deducción y por la cantidad concurrente."
  - id: c
    text:
      es: "Cuando se inicie el procedimiento y por la cantidad concurrente."
  - id: d
    text:
      es: "Cuando venza el plazo de alegaciones y por el importe íntegro de la deuda."
  explanation:
    es: "La extinción llega al producirse la deducción, y solo por la cantidad concurrente. El inicio del procedimiento no extingue la deuda, solo suspende su cobro, y la notificación de la propuesta o el vencimiento del plazo de alegaciones no son el momento de la extinción."
  citation: "art. 74.3 LGT"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "extinción"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0059
  prompt:
    es: "¿Cuál de los siguientes sujetos puede ver extinguidas sus deudas con la Hacienda pública estatal mediante deducción de las cantidades que la Administración General del Estado deba transferirle, según el artículo 60.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "La Seguridad Social, por deudas de naturaleza pública vencidas, líquidas y exigibles."
  - id: b
    text:
      es: "Una sociedad mercantil privada, por sus deudas tributarias vencidas, líquidas y exigibles."
  - id: c
    text:
      es: "Un particular con una subvención pendiente de pago, por sus deudas tributarias vencidas."
  - id: d
    text:
      es: "Cualquier obligado tributario que sea acreedor del Estado por una devolución reconocida."
  explanation:
    es: "El artículo 60.1 alcanza a entes territoriales, organismos autónomos, Seguridad Social y demás entidades de derecho público. Las sociedades privadas y los particulares no son esas entidades, y el obligado acreedor por una devolución recurre a la compensación, no a la deducción sobre transferencias."
  citation: "art. 60.1 RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "sujetos"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0060
  prompt:
    es: "Conforme al artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, comprobada la existencia de una deuda y la inexistencia de créditos compensables de oficio a favor de la entidad deudora, el procedimiento de deducción se inicia mediante:"
  options:
  - id: a
    text:
      es: "Una providencia de apremio que se notifica a la entidad deudora, con la liquidación de la deuda."
  - id: b
    correct: true
    text:
      es: "Un acuerdo que se notifica a la entidad deudora, acompañado de la propuesta de deducción."
  - id: c
    text:
      es: "Una resolución del Director del Departamento de Recaudación que se notifica solo al ente acreedor."
  - id: d
    text:
      es: "Un requerimiento de pago que se notifica a la entidad deudora, con un nuevo plazo de ingreso voluntario."
  explanation:
    es: "El procedimiento se inicia con un acuerdo notificado a la entidad deudora y acompañado de la propuesta de deducción. La providencia de apremio, la resolución notificada solo al acreedor y el requerimiento de pago con nuevo plazo voluntario no son el acto de inicio que describe el artículo."
  citation: "art. 60.2.a RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "inicio"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0061
  prompt:
    es: "De acuerdo con el artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la notificación del acuerdo de inicio de la deducción sobre transferencias concede a la entidad deudora, para formular alegaciones, un plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "15 días contados a partir del día siguiente a aquel en que se produzca la notificación."
  - id: b
    text:
      es: "10 días contados a partir del día siguiente a aquel en que se produzca la notificación."
  - id: c
    text:
      es: "15 días contados a partir de la fecha en que se dicte la propuesta de deducción."
  - id: d
    text:
      es: "Un mes contado a partir del día siguiente a aquel en que se produzca la notificación."
  explanation:
    es: "El plazo de alegaciones es de 15 días desde el día siguiente a la notificación. Los 10 días son el plazo de subsanación de la compensación del artículo 56.3. Contarlos desde la fecha de la propuesta cambia el inicio del cómputo, y el mes no es el plazo de este trámite."
  citation: "art. 60.2.a RGR"
  difficulty: 1
  tags:
  - "deducciones sobre transferencias"
  - "alegaciones"
  - "plazo"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0062
  prompt:
    es: "El lunes 12 de abril de 2027 se notifica al Ayuntamiento de Valdecastro el acuerdo de inicio de un procedimiento de deducción sobre transferencias, con la propuesta de deducción. Según el artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, tiene 15 días a partir del día siguiente a la notificación para alegar. Se cuentan días hábiles, sin festivos en el período. ¿Cuándo termina el plazo?"
  options:
  - id: a
    text:
      es: "El martes 27 de abril de 2027."
  - id: b
    text:
      es: "El viernes 30 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes 3 de mayo de 2027."
  - id: d
    text:
      es: "El miércoles 12 de mayo de 2027."
  explanation:
    es: "El cómputo empieza el martes 13 de abril. Los quince días hábiles son: 13 a 16 de abril (cuatro), 19 a 23 (nueve), 26 a 30 (catorce) y el lunes 3 de mayo (quince), porque el 1 y el 2 de mayo caen en fin de semana. El 27 de abril sale de contar quince días naturales. El 30 de abril es el decimocuarto día hábil. El 12 de mayo es un mes completo, plazo que el artículo no prevé."
  citation: "art. 60.2.a RGR"
  difficulty: 3
  tags:
  - "deducciones sobre transferencias"
  - "alegaciones"
  - "cómputo"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0063
  prompt:
    es: "Si la entidad deudora no formula alegaciones ni aporta nuevos documentos o pruebas tras la notificación del acuerdo de inicio, señale la respuesta CORRECTA según el artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Se archivan las actuaciones por falta de oposición de la entidad deudora."
  - id: b
    text:
      es: "Se entiende desistida la Administración y caduca el procedimiento de deducción."
  - id: c
    correct: true
    text:
      es: "Podrá dictarse la resolución de acuerdo con la propuesta de deducción."
  - id: d
    text:
      es: "Debe dictarse la resolución, en todo caso, por el importe íntegro de la deuda."
  explanation:
    es: "La notificación advierte de que, sin alegaciones ni nuevos documentos o pruebas, podrá dictarse la resolución de acuerdo con la propuesta. El archivo se acuerda en otro caso: cuando el órgano no propone la deducción a la vista de las alegaciones. No hay desistimiento de la Administración, y la resolución no es obligada ni se fija por el importe íntegro."
  citation: "art. 60.2.a RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "alegaciones"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0065
  prompt:
    es: "De acuerdo con el artículo 60.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el acuerdo de deducción que dicta el órgano competente para resolver se notifica:"
  options:
  - id: a
    text:
      es: "Solo al deudor, sin dar traslado al ente acreedor de la deducción."
  - id: b
    text:
      es: "Al deudor y a la Intervención General, que debe autorizar su ejecución."
  - id: c
    correct: true
    text:
      es: "Al ente acreedor, en su caso al órgano competente para ejecutarlo, y al deudor."
  - id: d
    text:
      es: "Al ente acreedor y al Tribunal de Cuentas, para su control contable."
  explanation:
    es: "El acuerdo se notifica al ente acreedor, al órgano que debe ejecutarlo si procede y al deudor. Limitarlo al deudor deja fuera al acreedor, y la Intervención General o el Tribunal de Cuentas no figuran entre los destinatarios."
  citation: "art. 60.2.b RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "acuerdo"
  - "notificación"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0066
  prompt:
    es: "Conforme al artículo 60.2.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, tras el acuerdo de deducción, en su caso, se practica y notifica al deudor:"
  options:
  - id: a
    text:
      es: "La liquidación del recargo del período ejecutivo que corresponda."
  - id: b
    text:
      es: "La liquidación de las costas del procedimiento de apremio devengadas."
  - id: c
    correct: true
    text:
      es: "La liquidación de los intereses de demora que se hayan devengado."
  - id: d
    text:
      es: "La liquidación de la sanción tributaria que proceda."
  explanation:
    es: "El apartado c prevé la liquidación de los intereses de demora devengados. El recargo del período ejecutivo, las costas del apremio y las sanciones no son lo que el precepto manda liquidar en este procedimiento."
  citation: "art. 60.2.c RGR"
  difficulty: 1
  tags:
  - "deducciones sobre transferencias"
  - "intereses de demora"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0067
  prompt:
    es: "¿Hasta cuándo se extiende la suspensión del procedimiento de cobro que produce el inicio de un procedimiento de deducción, según el artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Hasta que venza el plazo de alegaciones de la entidad deudora."
  - id: b
    text:
      es: "Hasta que se dicte la providencia de apremio contra la entidad deudora."
  - id: c
    correct: true
    text:
      es: "Hasta que se produzca la deducción o, en su caso, se acuerde el archivo de las actuaciones."
  - id: d
    text:
      es: "Hasta que se notifique el acuerdo de deducción al ente acreedor."
  explanation:
    es: "La suspensión corre desde el inicio hasta que se produce la deducción o se archivan las actuaciones. No cesa al terminar las alegaciones, no termina con una providencia de apremio que no existe en este procedimiento y tampoco con la notificación al ente acreedor."
  citation: "art. 60.2.a RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "suspensión"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0069
  prompt:
    es: "Conforme al artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, efectuada la compensación de oficio de créditos reconocidos a favor de la entidad deudora, el acuerdo de deducción:"
  options:
