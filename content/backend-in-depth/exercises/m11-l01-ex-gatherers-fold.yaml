- id: m11-l01-v-gatherers-fold-001
  prompt:
    en: |-
      Since Java 24, where gatherers are final, what does this program print? The stream is ordered, and the result is printed as a list.

      ```java
      import java.util.stream.Gatherers;
      import java.util.stream.Stream;

      public class Main {
          public static void main(String[] args) {
              System.out.println(Stream.of(1, 2, 3, 4, 5, 6).gather(Gatherers.fold(() -> 0, Integer::sum)).toList());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[21]`'
    correct: true
  - id: b
    text:
      en: '`[1, 3, 6, 10, 15, 21]`'
  - id: c
    text:
      en: '`[22]`'
  - id: d
    text:
      en: '`[6]`'
  explanation:
    en: '`fold` starts from the seed 0 and applies `Integer::sum` to the running value and each element in order. It emits
      a single element, the final value. The program prints `[21]`. `[1, 3, 6, 10, 15, 21]` comes from this mistake: using
      `scan` where `fold` was written. `[22]` comes from this mistake: starting from one instead of the seed written. `[6]`
      comes from this mistake: using the maximum instead of the function written.'
  family: gatherers-fold
  code_reading: true
  citation: javadoc-gatherers#fold(java.util.function.Supplier,java.util.function.BiFunction)
  difficulty: 3
  tags: &id001
  - streams
  - gatherers
