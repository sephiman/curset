    actualización… produce efectos desde el 1 de enero de 2027» y, debajo, la «Redacción anterior», que es la vigente hoy. La
    DA 5.ª ya incluye los apartados 5 y 6 del RDL 33/2026 (en vigor 12-11-2026, efectos desde 01-01-2025) sin aviso.
