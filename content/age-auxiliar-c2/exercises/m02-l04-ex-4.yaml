    es: "Según el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, este real decreto se aplica a la Administración General del Estado, a las Administraciones de las comunidades autónomas, a las entidades de la Administración Local, al sector público institucional y a:"
