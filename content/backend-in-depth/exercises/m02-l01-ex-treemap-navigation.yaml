- id: m02-l01-v-treemap-navigation-001
  prompt:
    en: |-
      What does this program print? The `TreeMap` has `String` keys and is ordered by the comparator it was created with, or by natural `String` ordering when it has none.

      ```java
      import java.util.Comparator;
      import java.util.TreeMap;

      public class Main {
          public static void main(String[] args) {
              TreeMap<String, Integer> m = new TreeMap<>();
              m.put("b", 1); m.put("D", 2); m.put("a", 3); m.put("E", 4); m.put("c", 5);
              System.out.println(m.keySet());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[D, E, a, b, c]`'
    correct: true
  - id: b
    text:
      en: '`[a, b, c, D, E]`'
  - id: c
    text:
      en: '`[c, b, a, E, D]`'
  - id: d
    text:
      en: '`[b, D, a, E, c]`'
  explanation:
    en: 'A `TreeMap` keeps its keys sorted by the comparator given at creation, or by natural ordering when it has none, and
      here that order is natural `String` ordering, where uppercase letters come before lowercase ones. The views `keySet()`,
      `values()` and `entrySet()` list the keys, the values and the entries in that order, whatever the order in which the
      keys were inserted. The program prints `[D, E, a, b, c]`. `[a, b, c, D, E]` comes from this mistake: assuming the map
      is case-insensitive. The order of this map is natural `String` ordering, where uppercase letters come before lowercase
      ones, which is not case-insensitive `String` ordering. `[c, b, a, E, D]` comes from this mistake: assuming the map is
      in descending order. The order of this map is natural `String` ordering, where uppercase letters come before lowercase
      ones, which is not the reverse of natural `String` ordering. `[b, D, a, E, c]` comes from this mistake: assuming the
      keys stay in insertion order. A `TreeMap` orders its keys by comparison, not by insertion.'
  family: treemap-navigation
  code_reading: true
  citation: javadoc-treemap#class-treemap-k-v
  difficulty: 3
  tags: &id001
