    - id: m03-l20
      title:
        es: 'La Aduana: representación aduanera. Deuda aduanera de importación y deuda aduanera de exportación. Inclusión
          de mercancías en un régimen aduanero: disposiciones generales.'
      summary:
        es: 'El Código Aduanero de la Unión, con el Reglamento Delegado (UE) 2015/2446 y el Reglamento de Ejecución (UE)
          2015/2447, regula el territorio aduanero, el registro de los operadores económicos y la representación
          aduanera, que puede ser directa o indirecta. La deuda aduanera de importación nace al incluir mercancías no
          pertenecientes a la Unión sujetas a derechos de importación en el despacho a libre práctica o en la
          importación temporal con exención parcial de derechos, en el supuesto de mercancías no originarias del
          artículo 78 del Código o por incumplimiento en los casos de su artículo 79; la de exportación nace al
          incluir mercancías sujetas a derechos de exportación en el régimen de exportación o de perfeccionamiento
          pasivo, o por incumplimiento en los casos del artículo 82. Las mercancías que vayan a incluirse en un
          régimen aduanero, salvo el de zona franca, son objeto de una declaración en aduana, y la lección trata
          también el valor en aduana y el depósito temporal.'
