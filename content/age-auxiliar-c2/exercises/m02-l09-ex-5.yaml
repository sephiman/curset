# anchor: fuente-ms-excel-funcion-dia-html
- id: m02-l09-q213
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes números de serie tiene por defecto el 1 de enero de 1900?"
  options:
  - id: a
    correct: true
    text:
      es: "1"
  - id: b
    text:
      es: "39448"
  - id: c
    text:
      es: "0"
  - id: d
    text:
      es: "1900"
  explanation:
    es: "La página dice que Excel almacena las fechas como números de serie y que el 1 de enero de 1900 es el número 1. «0»: la página dice que, de manera predeterminada, el 1 de enero de 1900 es el número de serie 1. «1900»: 1900 es el año, y el número de serie de esa fecha es 1. «39448»: 39448 es el número de serie del 1 de enero de 2008."
