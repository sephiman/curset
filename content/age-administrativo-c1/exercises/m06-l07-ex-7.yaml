# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m06-l07-q205
  prompt:
    es: "En Outlook 365 clásico, ¿qué nivel de protección contra el correo no deseado sirve para quien recibe mucho correo no deseado pero no quiere restringir a los remitentes de las listas seguras?"
  options:
  - id: a
    correct: true
    text:
      es: "Alto"
  - id: b
    text:
      es: "Solo listas seguras"
  - id: c
    text:
      es: "Bajo"
  - id: d
    text:
      es: "Sin filtrado automático"
  explanation:
    es: "La ayuda recomienda Alto cuando se recibe una gran cantidad de mensajes no deseados pero no se quiere restringir a los remitentes de las listas seguras. Bajo filtra solo lo más obvio. Solo listas seguras clasifica como no deseado todo mensaje que no sea de la lista de remitentes seguros. Sin filtrado automático desactiva el filtro automático."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Cambiar el nivel de protección contra correo electrónico no deseado»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m06-l07-q206
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con un mensaje que no es de nadie de la lista de remitentes seguros cuando el nivel de protección es Solo listas seguras?"
  options:
  - id: a
    text:
      es: "Se elimina permanentemente sin revisarlo"
  - id: b
    correct: true
    text:
      es: "Se clasifica como correo no deseado"
  - id: c
    text:
      es: "Se conserva en la Bandeja de entrada"
  - id: d
    text:
      es: "Se evalúa solo con la lista de remitentes bloqueados"
  explanation:
    es: "Con Solo listas seguras, cualquier mensaje que no sea de un remitente de la lista segura se clasifica como correo no deseado. Conservarlo en la Bandeja de entrada contradice esa frase. Eliminarlo permanentemente exige activar otra casilla, Eliminar permanentemente los mensajes sospechosos. Evaluarlo solo con la lista de remitentes bloqueados es lo que ocurre con Sin filtrado automático."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Cambiar el nivel de protección contra correo electrónico no deseado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m06-l07-q207
  prompt:
    es: "En Outlook 365 clásico, ¿qué hay que hacer, además de elegir Sin filtrado automático, para desactivar del todo el Filtro de Email no deseado?"
  options:
  - id: a
    text:
      es: "Elegir después el nivel Bajo"
  - id: b
    text:
      es: "Elegir después el nivel Alto"
  - id: c
    text:
      es: "Activar la casilla de eliminar permanentemente los mensajes sospechosos"
  - id: d
    correct: true
    text:
      es: "Quitar nombres de las listas del Filtro de Email no deseado"
  explanation:
    es: "La nota dice que, para desactivar el Filtro de Email no deseado, también hay que quitar nombres de sus listas, porque Sin filtrado automático sigue evaluando con los nombres de dominio y direcciones de la lista de remitentes bloqueados. Elegir Bajo o Alto activa el filtro. Eliminar permanentemente los sospechosos es otra opción, que no desactiva el filtro."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Cambiar el nivel de protección contra correo electrónico no deseado»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m06-l07-q209
  prompt:
    es: "En Outlook 365 clásico, ¿qué consecuencia señala la ayuda de activar la casilla Eliminar permanentemente los mensajes sospechosos de ser correo no deseado?"
  options:
  - id: a
    text:
      es: "Solo se eliminan los mensajes de los remitentes de la lista segura"
  - id: b
    correct: true
    text:
      es: "Se pierde la opción de revisar los mensajes en busca de falsos positivos"
  - id: c
    text:
      es: "Los mensajes sospechosos pasan a Elementos eliminados para revisarlos"
  - id: d
    text:
      es: "Los mensajes sospechosos se mueven a Correo no deseado para revisarlos"
  explanation:
    es: "La casilla elimina los mensajes sospechosos en lugar de moverlos a Correo no deseado, y por eso se pierde la capacidad de revisar posibles falsos positivos. Moverlos a Correo no deseado es lo que se hace sin activarla. Pasar a Elementos eliminados para revisarlos contradice que se eliminen permanentemente. Eliminar los de la lista segura contradice que se eliminen los sospechosos de ser correo no deseado."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Solo tienes que eliminarlos.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m06-l07-q210
  prompt:
    es: "En Outlook 365 clásico, ¿qué hace el filtro de correo no deseado con los mensajes que identifica como probablemente no deseados?"
  options:
  - id: a
    text:
      es: "Los elimina permanentemente de forma automática"
  - id: b
    text:
      es: "Los mueve a la carpeta Elementos eliminados"
  - id: c
    text:
      es: "Los mueve a la carpeta Archivo"
  - id: d
    correct: true
    text:
      es: "Los mueve a la carpeta Correo no deseado"
  explanation:
    es: "El filtro identifica los mensajes que probablemente son correo no deseado y los mueve a la carpeta Correo no deseado. Eliminarlos de forma automática contradice que el filtro los mueva, y la ayuda presenta eliminarlos como una opción distinta. Moverlos a Elementos eliminados o a Archivo contradice que el destino sea Correo no deseado."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Correo no deseado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q211
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de los siguientes métodos abreviados de teclado establece las opciones de correo no deseado?"
  options:
  - id: a
    text:
      es: "Alt+H, M, V"
  - id: b
    text:
      es: "Alt+H, F, W"
  - id: c
    correct: true
    text:
      es: "Alt+H, J, O"
  - id: d
    text:
      es: "Alt+H, R, A"
  explanation:
    es: "Alt+H, J, O establece las opciones de correo no deseado. Alt+H, R, A selecciona Responder a todos. Alt+H, F, W reenvía un mensaje. Alt+H, M, V mueve un elemento a una carpeta de la lista."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de correo en la versión clásica de Outlook»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q213
  prompt:
    es: "En Outlook 365, ¿qué efecto tiene usar el botón Archivar para mover mensajes a la carpeta Archivo sobre el tamaño del buzón?"
  options:
  - id: a
    text:
      es: "Reduce el tamaño del buzón porque los quita del servidor"
  - id: b
    text:
      es: "Reduce el tamaño del buzón solo con cuentas de Exchange"
  - id: c
    correct: true
    text:
      es: "No reduce el tamaño del buzón, solo mueve los mensajes a Archivo"
  - id: d
    text:
      es: "Reduce el tamaño del buzón porque elimina los mensajes"
  explanation:
    es: "La ayuda dice que usar el botón Archivar para mover mensajes a la carpeta Archivo no reduce el tamaño del buzón. Que elimine los mensajes contradice que los mueva sin eliminarlos. Que los quite del servidor contradice esa misma frase. Que reduzca el tamaño con cuentas de Exchange también la contradice, porque la frase no distingue cuentas."
  citation: "fuente: `ms-outlook-archivar.html`; «Todas las cuentas tienen acceso a una carpeta Archivo»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q214
  prompt:
    es: "Señale la tecla que, en Outlook 365 clásico, archiva inmediatamente los mensajes seleccionados en la Bandeja de entrada:"
  options:
  - id: a
    correct: true
    text:
      es: "Retroceso"
  - id: b
    text:
      es: "Suprimir"
  - id: c
    text:
      es: "Esc"
  - id: d
    text:
      es: "Insertar"
  explanation:
    es: "La tecla Retroceso archiva los mensajes seleccionados. Suprimir los envía a Elementos eliminados. Insertar agrega una marca rápida a un mensaje sin abrir. Esc cierra una ventana o un menú, o borra los resultados de la búsqueda."
  citation: "fuente: `ms-outlook-archivar.html`; «Archivar mensajes con el teclado en Outlook clásico»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q215
  prompt:
    es: "En Outlook 365 clásico, ¿a qué carpeta van los mensajes seleccionados cuando se pulsa la tecla Suprimir en lugar de la tecla Retroceso?"
  options:
  - id: a
    text:
      es: "A la carpeta Bandeja de salida, a la espera de enviarse"
  - id: b
    correct: true
    text:
      es: "A la carpeta Elementos eliminados, no a la carpeta Archivo"
  - id: c
    text:
      es: "A la carpeta Archivo, igual que con Retroceso"
  - id: d
    text:
      es: "A la carpeta Correo no deseado, como el filtro"
  explanation:
    es: "Si se presiona la tecla Suprimir, los mensajes van a Elementos eliminados. Archivo es el destino de la tecla Retroceso. Correo no deseado es el destino del filtro de correo no deseado. Bandeja de salida es donde esperan los mensajes con entrega retrasada."
  citation: "fuente: `ms-outlook-archivar.html`; «Archivar mensajes con el teclado en Outlook clásico»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q216
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se archiva un mensaje que está abierto en su propia ventana y no en el panel de lectura?"
  options:
  - id: a
    text:
      es: "Con la tecla Suprimir, que lo mueve a Archivo"
  - id: b
    text:
      es: "Con la tecla Insertar, que lo marca para archivar"
  - id: c
    text:
      es: "Con la tecla Retroceso, igual que en el panel de lectura"
  - id: d
    correct: true
    text:
      es: "Con el botón Archivar de la cinta de opciones"
  explanation:
    es: "Con el mensaje en una ventana nueva, la única manera de archivarlo es el botón Archivar de la cinta. Retroceso no archiva si el mensaje está abierto en su propia ventana. Suprimir lo envía a Elementos eliminados. Insertar agrega una marca rápida y no archiva."
  citation: "fuente: `ms-outlook-archivar.html`; «Archivar mensajes con el teclado en Outlook clásico»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q217
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes afirmaciones sobre la carpeta Archivo de una cuenta de Microsoft 365 es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Es una carpeta predeterminada que no se puede eliminar"
  - id: b
    text:
      es: "Hay que crearla primero, antes de poder archivar mensajes"
  - id: c
    text:
      es: "Se puede mover a otra ubicación dentro del buzón"
  - id: d
    text:
      es: "Se puede eliminar cuando no contiene mensajes"
  explanation:
    es: "En las cuentas de Microsoft 365, Outlook.com y Exchange, la carpeta Archivo es una de las predeterminadas y no se puede eliminar. Crearla antes contradice que ya exista aunque nunca se haya usado la función. Eliminarla vacía la contradice. Moverla contradice que no se pueda cambiar su ubicación en cuentas de Microsoft 365 o Exchange."
  citation: "fuente: `ms-outlook-archivar.html`; «Todas las cuentas tienen acceso a una carpeta Archivo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q218
  prompt:
    es: "En Outlook 365 clásico, ¿qué pueden hacer con la carpeta Archivo las cuentas POP e IMAP, a diferencia de las cuentas de Microsoft 365?"
  options:
  - id: a
    text:
      es: "Usar una carpeta Archivo predeterminada que no se puede cambiar"
  - id: b
    text:
      es: "No disponer de carpeta Archivo en ningún caso"
  - id: c
    text:
      es: "Mantener la carpeta Archivo en el servidor sin poder moverla"
  - id: d
    correct: true
    text:
      es: "Crearla o designar una carpeta existente como Archivo"
  explanation:
    es: "Para las cuentas POP e IMAP se puede crear una carpeta Archivo o designar una existente. La carpeta predeterminada que no se puede cambiar es la de las cuentas de Microsoft 365 o Exchange. No tener carpeta Archivo contradice que todas las cuentas tienen acceso a una. Mantenerla sin poder moverla contradice que en POP e IMAP se pueda cambiar su ubicación."
  citation: "fuente: `ms-outlook-archivar.html`; «Todas las cuentas tienen acceso a una carpeta Archivo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q219
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se encuentra un mensaje archivado usando el cuadro de búsqueda de la parte superior de la lista de carpetas?"
  options:
  - id: a
    text:
      es: "Solo con Limpieza de buzón, que busca en la carpeta Archivo"
  - id: b
    text:
      es: "Solo navegando a la carpeta Archivo, porque la búsqueda no la incluye"
  - id: c
    correct: true
    text:
      es: "Escribiendo un término: por defecto Outlook busca en todo el buzón, archivo incluido"
  - id: d
    text:
      es: "Solo desde el teléfono, donde la carpeta Archivo está disponible"
  explanation:
    es: "Por defecto, la búsqueda de Outlook clásico recorre todo el buzón y los elementos archivados se encuentran desde el cuadro de búsqueda. Que la búsqueda no incluya Archivo contradice esa frase. Limpieza de buzón muestra tamaños y busca por antigüedad o tamaño. Que solo se vean desde el teléfono contradice que sigan fáciles de encontrar desde el cuadro de búsqueda."
  citation: "fuente: `ms-outlook-archivar.html`; «¿Cómo buscar la carpeta Archivo?»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q220
  prompt:
    es: "En Outlook 365 clásico, ¿qué debe hacerse para recuperar un mensaje que se ha archivado por error?"
  options:
  - id: a
    text:
      es: "Nada: un mensaje archivado ya no se puede mover de nuevo a otra carpeta"
  - id: b
    correct: true
    text:
      es: "Mover el mensaje desde la carpeta Archivo a la Bandeja de entrada"
  - id: c
    text:
      es: "Abrir Limpieza de buzón y restaurar desde allí el mensaje archivado"
  - id: d
    text:
      es: "Usar Recuperar este mensaje desde Elementos enviados"
  explanation:
    es: "Si se archiva un mensaje por error, se va a la carpeta Archivo y se mueve de nuevo a la Bandeja de entrada. Recuperar este mensaje retira un mensaje enviado a otros que no han abierto. Limpieza de buzón muestra tamaños y vacía Elementos eliminados. Que no se pueda mover de nuevo contradice la propia frase de la ayuda."
  citation: "fuente: `ms-outlook-archivar.html`; «Archivar elementos en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-archivar-html
- id: m06-l07-q221
  prompt:
    es: "En Outlook 365, ¿para qué clientes es el Archivo en línea, la característica distinta de la carpeta Archivo, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Usuarios de cuentas personales de Outlook.com y Hotmail"
  - id: b
    text:
      es: "Cualquier cuenta, para reducir el tamaño de la Bandeja de entrada"
  - id: c
    correct: true
    text:
      es: "Clientes de Microsoft 365 Enterprise con buzones muy grandes"
  - id: d
    text:
      es: "Usuarios de cuentas POP e IMAP con carpeta Archivo propia"
  explanation:
    es: "El Archivo en línea es una característica para clientes de Microsoft 365 Enterprise que tienen buzones singularmente grandes. Las cuentas POP e IMAP usan una carpeta Archivo normal. Las cuentas personales de Outlook.com no son clientes de Microsoft 365 Enterprise. Que sirva para cualquier cuenta contradice que sea para clientes de Microsoft 365 Enterprise."
  citation: "fuente: `ms-outlook-archivar.html`; «¿Cuál es la diferencia con respecto a Archivo en línea?»"
  difficulty: 3
  tags:
  - "concepto"
