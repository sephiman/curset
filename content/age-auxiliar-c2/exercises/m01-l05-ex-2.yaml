# anchor: boe-a-1997-25336-art-13
- id: m01-l05-q012
  prompt:
    es: "De acuerdo con el artículo 13.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la suplencia de los Ministros, para el despacho ordinario de los asuntos de su competencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Será determinada por Real Decreto del Presidente del Gobierno y recaerá, en todo caso, en otro miembro del Gobierno."
  - id: b
    text:
      es: "Será determinada por Real Decreto del Presidente del Gobierno y podrá recaer en un Secretario de Estado del mismo Departamento."
  - id: c
    text:
      es: "Será determinada por acuerdo del Consejo de Ministros y recaerá, en todo caso, en otro miembro del Gobierno."
  - id: d
    text:
      es: "Corresponderá al Subsecretario del Departamento, salvo que el Presidente del Gobierno designe a otro Ministro."
  explanation:
    es: "El artículo 13.2 dice que la suplencia «será determinada por Real Decreto del Presidente del Gobierno, debiendo recaer, en todo caso, en otro miembro del Gobierno». Un Secretario de Estado o un Subsecretario no son miembros del Gobierno, así que no pueden suplir a un Ministro. La suplencia no la acuerda el Consejo de Ministros, sino el Presidente por Real Decreto."
  citation: "art. 13.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-3
- id: m01-l05-q061
  prompt:
    es: "¿Cuál de los siguientes órganos encomienda sus funciones a los Vicepresidentes del Gobierno, cuando existan, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "El Rey."
  - id: c
    text:
      es: "El Ministro de la Presidencia."
  - id: d
    text:
      es: "El Congreso de los Diputados."
  explanation:
    es: "El artículo 3.1 dice que los Vicepresidentes ejercen las funciones que les encomiende el Presidente. El Rey los nombra, a propuesta del Presidente, pero no les encomienda funciones. El Ministro de la Presidencia y el Congreso tampoco les asignan tareas."
  citation: "art. 3 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1997-25336-art-3
- id: m01-l05-q062
  prompt:
    es: "¿Cuál de las siguientes condiciones ostenta, además, el Vicepresidente que asuma la titularidad de un Departamento Ministerial, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "La condición de Secretario de Estado."
  - id: b
    text:
      es: "La condición de Subsecretario del Departamento."
  - id: c
    correct: true
    text:
      es: "La condición de Ministro."
  - id: d
    text:
      es: "La condición de Director del Gabinete del Presidente."
  explanation:
    es: "El artículo 3.2 le da, además, la condición de Ministro. Secretario de Estado, Subsecretario y Director del Gabinete son cargos subordinados que un Vicepresidente no adquiere por dirigir un Departamento."
  citation: "art. 3 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-4
- id: m01-l05-q063
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de sus Departamentos, tienen competencia y responsabilidad en:"
  options:
  - id: a
    text:
      es: "Toda la acción del Gobierno, junto con el Presidente."
  - id: b
    correct: true
    text:
      es: "La esfera específica de su actuación."
  - id: c
    text:
      es: "Las materias que les delegue el Rey."
  - id: d
    text:
      es: "Las decisiones del Consejo de Ministros en su conjunto."
  explanation:
    es: "El artículo 4.1 limita su competencia y responsabilidad a la esfera específica de su actuación. La dirección de toda la acción del Gobierno corresponde al Presidente, según el artículo 98.2 de la Constitución. El Rey no les delega materias. Las decisiones del Consejo de Ministros son colegiadas."
  citation: "art. 4 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-4
- id: m01-l05-q064
  prompt:
    es: "Conforme a la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de un Departamento, ejercen la potestad reglamentaria:"
  options:
  - id: a
    text:
      es: "En todas las materias, sin habilitación legal."
  - id: b
    text:
      es: "Solo por delegación del Presidente del Gobierno."
  - id: c
    text:
      es: "Solo en materias de organización interna."
  - id: d
    correct: true
    text:
      es: "En las materias propias de su Departamento."
  explanation:
    es: "El artículo 4.1.b les atribuye la potestad reglamentaria en las materias propias de su Departamento. No es general, ni exige una delegación del Presidente, ni se limita a la organización interna."
  citation: "art. 4 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-4
- id: m01-l05-q066
  prompt:
    es: "Conforme a la Ley 50/1997, de 27 de noviembre, del Gobierno, en caso de que existan Ministros sin cartera, el ámbito de sus competencias se determina:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante Real Decreto."
  - id: b
    text:
      es: "Mediante ley orgánica."
  - id: c
    text:
      es: "Mediante orden del Ministro de la Presidencia."
  - id: d
    text:
      es: "Mediante acuerdo del Congreso de los Diputados."
  explanation:
    es: "El artículo 4.2 dice que por Real Decreto se determina el ámbito de competencias de los Ministros sin cartera, así como su estructura administrativa y sus medios. No hace falta ley orgánica. Una orden ministerial es una norma de menor rango, y el Congreso no interviene."
  citation: "art. 4 Ley 50/1997"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1997-25336-art-4
- id: m01-l05-q112
  prompt:
    es: "De acuerdo con el artículo 4.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de sus Departamentos, refrendan, en su caso, los actos del Rey:"
  options:
  - id: a
    text:
      es: "En materia de política general del Gobierno."
  - id: b
    correct: true
    text:
      es: "En materia de su competencia."
  - id: c
    text:
      es: "En materia de los asuntos que les encomiende el Consejo de Ministros."
  - id: d
    text:
      es: "En materia de cualquier Departamento ministerial."
  explanation:
    es: "El artículo 4.1.d atribuye al Ministro refrendar, en su caso, los actos del Rey en materia de su competencia. La política general del Gobierno la dirige el Presidente, no cada Ministro. Los asuntos que encomiende el Consejo de Ministros no amplían el refrendo, que sigue la competencia del Departamento. El refrendo de los actos de cualquier Departamento desborda la esfera específica de actuación del Ministro."
  citation: "art. 4.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q013
  prompt:
    es: "De acuerdo con el artículo 18.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en las reuniones del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Director del Secretariado del Gobierno."
  - id: b
    correct: true
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  - id: c
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Subsecretario de la Presidencia."
  - id: d
    text:
      es: "El Vicepresidente primero las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  explanation:
    es: "El artículo 18.1 dice: «El Presidente del Gobierno convoca y preside las reuniones del Consejo de Ministros, actuando como Secretario el Ministro de la Presidencia». El Director del Secretariado del Gobierno suple al Secretario de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.3). El Subsecretario de la Presidencia es el Secretario de esa Comisión, no del Consejo. El Consejo lo convoca y preside el Presidente, no un Vicepresidente."
  citation: "art. 18.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q015
  prompt:
    es: "¿Qué carácter tienen las deliberaciones del Consejo de Ministros, a cuyas reuniones pueden asistir los Secretarios de Estado cuando sean convocados?"
  options:
  - id: a
    text:
      es: "Las deliberaciones del Consejo son reservadas."
  - id: b
    text:
      es: "Las deliberaciones del Consejo son públicas."
  - id: c
    text:
      es: "Las deliberaciones del Consejo constan íntegras en el acta."
  - id: d
    correct: true
    text:
      es: "Las deliberaciones del Consejo son secretas."
  explanation:
    es: "El artículo 5.3 dice: «Las deliberaciones del Consejo de Ministros serán secretas». Reservadas son las de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.4), no las del Consejo. No son públicas. El acta recoge exclusivamente el tiempo y lugar, los asistentes, los acuerdos y los informes presentados (art. 18.4), no las deliberaciones."
  citation: "art. 5.3 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q016
  prompt:
    es: "De acuerdo con el artículo 18.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en el acta de las sesiones del Consejo de Ministros figurarán, exclusivamente:"
  options:
  - id: a
    correct: true
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados."
  - id: b
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y el sentido de las deliberaciones."
  - id: c
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los votos particulares formulados."
  - id: d
    text:
      es: "La relación de asistentes, el orden del día, las deliberaciones mantenidas y los acuerdos adoptados."
  explanation:
    es: "El artículo 18.4 dice que en el acta figurarán, exclusivamente, «las circunstancias relativas al tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados». Las deliberaciones son secretas (art. 5.3) y no constan en el acta, ni su sentido ni su contenido. Los votos particulares no figuran en la lista."
  citation: "art. 18.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q067
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros aprueba los proyectos de ley y su remisión:"
  options:
  - id: a
    text:
      es: "A las Cortes Generales reunidas en sesión conjunta."
  - id: b
    text:
      es: "Al Consejo de Estado, para su dictamen preceptivo."
  - id: c
    text:
      es: "Al Rey, para su sanción previa."
  - id: d
    correct: true
    text:
      es: "Al Congreso de los Diputados o, en su caso, al Senado."
  explanation:
    es: "El artículo 5.1.a dice que el Consejo de Ministros aprueba los proyectos de ley y los remite al Congreso o, en su caso, al Senado. Las Cortes Generales no se reúnen en sesión conjunta para tramitar un proyecto de ley. El dictamen del Consejo de Estado no figura en ese apartado. El Rey sanciona las leyes ya aprobadas por las Cortes, no los proyectos."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q068
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde al Consejo de Ministros, según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Interponer el recurso de inconstitucionalidad."
  - id: b
    text:
      es: "Proponer al Rey la disolución de las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Aprobar el Proyecto de Ley de Presupuestos Generales del Estado."
  - id: d
    text:
      es: "Proponer al Rey la convocatoria de un referéndum consultivo."
  explanation:
    es: "El artículo 5.1.b atribuye al Consejo de Ministros aprobar el Proyecto de Ley de Presupuestos Generales del Estado. Interponer el recurso de inconstitucionalidad y proponer al Rey la disolución o el referéndum son funciones del Presidente del Gobierno, según el artículo 2.2."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q069
  prompt:
    es: "¿Qué órgano aprueba los Reales Decretos-leyes y los Reales Decretos Legislativos, según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios."
  - id: c
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: d
    text:
      es: "Las Comisiones Delegadas del Gobierno."
  explanation:
    es: "El artículo 5.1.c encomienda al Consejo de Ministros aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos. El Presidente no los aprueba por sí solo. La Comisión General solo prepara asuntos y no puede adoptar acuerdos por delegación del Gobierno. Las Comisiones Delegadas tampoco los aprueban."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q070
  prompt:
    es: "Según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros remite los Tratados internacionales, en los términos previstos en la Constitución:"
  options:
  - id: a
    text:
      es: "Al Consejo de Estado."
  - id: b
    correct: true
    text:
      es: "A las Cortes Generales."
  - id: c
    text:
      es: "Al Rey, para su sanción."
  - id: d
    text:
      es: "Al Congreso de los Diputados, con exclusión del Senado."
  explanation:
    es: "El artículo 5.1.e dice que el Consejo de Ministros remite los Tratados internacionales a las Cortes Generales. Los demás destinos no figuran en ese apartado."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q071
  prompt:
    es: "Señale la opción correcta sobre la función del Consejo de Ministros respecto del estado de sitio, según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "Declararlo directamente, dando cuenta al Congreso de los Diputados."
  - id: b
    text:
      es: "Declararlo previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Solicitar su declaración al Senado."
  - id: d
    correct: true
    text:
      es: "Proponer al Congreso de los Diputados su declaración."
  explanation:
    es: "El artículo 5.1.f le atribuye proponer al Congreso la declaración del estado de sitio, que el Congreso declara. Declararlo directamente o con autorización del Congreso son las fórmulas de los estados de alarma y de excepción. El Senado no interviene en esa declaración."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q072
  prompt:
    es: "De acuerdo con el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros dispone la emisión de Deuda Pública o contrae crédito, cuando haya sido autorizado:"
  options:
  - id: a
    correct: true
    text:
      es: "Por una ley."
  - id: b
    text:
      es: "Por el Presidente del Gobierno."
  - id: c
    text:
      es: "Por el Congreso de los Diputados, mediante acuerdo."
  - id: d
    text:
      es: "Por una orden del Ministerio de Hacienda."
  explanation:
    es: "El artículo 5.1.g exige que la emisión de Deuda o el crédito estén autorizados por una ley. Un acuerdo del Congreso, una orden ministerial o la voluntad del Presidente no sustituyen a esa ley."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q073
  prompt:
    es: "Según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros aprueba los reglamentos para el desarrollo y la ejecución de las leyes, previo dictamen:"
  options:
  - id: a
    text:
      es: "Del Tribunal Constitucional."
  - id: b
    text:
      es: "De la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: c
    text:
      es: "Del Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "Del Consejo de Estado."
  explanation:
    es: "El artículo 5.1.h exige el dictamen previo del Consejo de Estado, que es el supremo órgano consultivo del Gobierno. El Tribunal Constitucional, la Comisión General y el Consejo General del Poder Judicial no emiten ese dictamen."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q074
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde al Consejo de Ministros crear, modificar y suprimir:"
  options:
  - id: a
    text:
      es: "Los Departamentos Ministeriales."
  - id: b
    text:
      es: "Las Secretarías de Estado."
  - id: c
    correct: true
    text:
      es: "Los órganos directivos de los Departamentos Ministeriales."
  - id: d
    text:
      es: "La estructura orgánica de la Presidencia del Gobierno."
  explanation:
    es: "El artículo 5.1.i atribuye al Consejo de Ministros los órganos directivos de los Departamentos Ministeriales. Los Departamentos, las Secretarías de Estado y la estructura orgánica de la Presidencia los crea o aprueba el Presidente del Gobierno, según el artículo 2.2.j."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q075
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros adopta programas, planes y directrices que son vinculantes para:"
  options:
  - id: a
    correct: true
    text:
      es: "Todos los órganos de la Administración General del Estado."
  - id: b
    text:
      es: "Solo los Departamentos Ministeriales."
  - id: c
    text:
      es: "Todas las Administraciones Públicas, incluidas las autonómicas."
  - id: d
    text:
      es: "Los órganos de las Comunidades Autónomas y de las Entidades Locales."
  explanation:
    es: "El artículo 5.1.j los hace vinculantes para todos los órganos de la Administración General del Estado. Reducirlos a los Departamentos deja fuera a otros órganos de esa Administración. Extenderlos a las administraciones autonómicas y locales sobrepasa el ámbito del artículo."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-5
- id: m01-l05-q076
  prompt:
    es: "Conforme al artículo 5.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, a las reuniones del Consejo de Ministros podrán asistir los Secretarios de Estado y, excepcionalmente, otros altos cargos, cuando:"
  options:
  - id: a
    text:
      es: "Lo autorice el Rey."
  - id: b
    correct: true
    text:
      es: "Sean convocados para ello."
  - id: c
    text:
      es: "Lo solicite el Congreso de los Diputados."
  - id: d
    text:
      es: "Lo decida la Comisión General de Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 5.2 permite su asistencia cuando sean convocados para ello. No exige autorización del Rey, petición del Congreso ni decisión de la Comisión General."
  citation: "art. 5.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-18
- id: m01-l05-q077
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, las reuniones del Consejo de Ministros, que preside el Presidente del Gobierno, podrán tener carácter:"
  options:
  - id: a
    text:
      es: "Público o reservado, según el asunto."
  - id: b
    correct: true
    text:
      es: "Decisorio o deliberante."
  - id: c
    text:
      es: "Consultivo o vinculante, según el Presidente."
  - id: d
    text:
      es: "Resolutivo o fiscalizador, según el orden del día."
  explanation:
    es: "El artículo 18.2 distingue las reuniones decisorias de las deliberantes. Las demás opciones inventan otras distinciones: sus deliberaciones son secretas, no públicas, y la ley no las clasifica en consultivas, vinculantes, resolutivas ni fiscalizadoras."
  citation: "art. 18.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
