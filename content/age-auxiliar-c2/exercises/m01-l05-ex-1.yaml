# anchor: boe-a-1978-31229-art-97
- id: m01-l05-q001
  prompt:
    es: "De acuerdo con el artículo 97 de la Constitución Española de 1978, el Gobierno dirige la política interior y exterior, la Administración civil y militar y:"
  options:
  - id: a
    correct: true
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  - id: b
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad legislativa de acuerdo con la Constitución y las leyes."
  - id: c
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con las directrices de las Cortes Generales."
  - id: d
    text:
      es: "La seguridad ciudadana, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  explanation:
    es: "El artículo 97 dice que el Gobierno dirige «la defensa del Estado» y ejerce «la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes». La potestad legislativa es de las Cortes Generales (art. 66.2 CE), no del Gobierno. La potestad reglamentaria se ejerce de acuerdo con la Constitución y las leyes, no con directrices de las Cortes. La seguridad ciudadana es la misión de las Fuerzas y Cuerpos de seguridad (art. 104.1 CE); el artículo 97 habla de la defensa del Estado."
  citation: "art. 97 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q002
  prompt:
    es: "De acuerdo con el artículo 98.1 de la Constitución Española de 1978, el Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los Ministros y de:"
  options:
  - id: a
    text:
      es: "Los Secretarios de Estado que designe el Presidente del Gobierno."
  - id: b
    text:
      es: "Los Subsecretarios de cada uno de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Los demás miembros que establezca la ley."
  - id: d
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas."
  explanation:
    es: "El artículo 98.1 cierra la lista con «los demás miembros que establezca la ley». Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1 Ley 50/1997), no miembros del Gobierno. Tampoco lo son los Subsecretarios ni los Delegados del Gobierno, que son órganos de la Administración."
  citation: "art. 98.1 CE"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-1
- id: m01-l05-q003
  prompt:
    es: "¿Cuál de las siguientes afirmaciones recoge la composición del Gobierno tal como la establece la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros."
  - id: b
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y de los Secretarios de Estado."
  - id: c
    text:
      es: "Se compone del Presidente, de los Ministros y de los Subsecretarios de los Departamentos Ministeriales."
  - id: d
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y del Abogado General del Estado."
  explanation:
    es: "El artículo 1.2 de la Ley 50/1997 dice que el Gobierno «se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros». La ley no añade otros miembros. Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1). Los Subsecretarios y el Abogado General del Estado forman parte o asisten a la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.1), pero no son miembros del Gobierno."
  citation: "art. 1.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-103
- id: m01-l05-q004
  prompt:
    es: "De acuerdo con el artículo 103.1 de la Constitución Española de 1978, la Administración Pública sirve con objetividad los intereses generales y actúa de acuerdo con los principios de:"
  options:
  - id: a
    text:
      es: "Eficacia, eficiencia, jerarquía, descentralización y coordinación."
  - id: b
    correct: true
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y coordinación."
  - id: c
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y cooperación."
  - id: d
    text:
      es: "Eficiencia, jerarquía, descentralización, desconcentración y coordinación."
  explanation:
    es: "El artículo 103.1 enumera cinco principios: «eficacia, jerarquía, descentralización, desconcentración y coordinación». La lista no incluye la eficiencia, así que fallan las dos opciones que la nombran. La opción que cambia coordinación por cooperación altera el último principio."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-1
- id: m01-l05-q045
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, los miembros del Gobierno se reúnen, para el ejercicio de sus funciones, en:"
  options:
  - id: a
    text:
      es: "Consejo de Ministros y en la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: b
    text:
      es: "Consejo de Ministros y en el Consejo de Estado, según la materia."
  - id: c
    correct: true
    text:
      es: "Consejo de Ministros y en Comisiones Delegadas del Gobierno."
  - id: d
    text:
      es: "Comisiones Delegadas del Gobierno y en la Conferencia de Presidentes."
  explanation:
    es: "El artículo 1.3 dice que los miembros del Gobierno se reúnen en Consejo de Ministros y en Comisiones Delegadas del Gobierno. La Comisión General de Secretarios de Estado y Subsecretarios la integran los titulares de las Secretarías de Estado y los Subsecretarios, que no son miembros del Gobierno. El Consejo de Estado es un órgano consultivo, no una reunión del Gobierno. La Conferencia de Presidentes no está en el artículo."
  citation: "art. 1.3 Ley 50/1997"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-103
- id: m01-l05-q046
  prompt:
    es: "Según el artículo 103.2 de la Constitución Española de 1978, los órganos de la Administración del Estado son creados, regidos y coordinados:"
  options:
  - id: a
    text:
      es: "De acuerdo con los reglamentos que apruebe el Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "De acuerdo con la ley."
  - id: c
    text:
      es: "De acuerdo con las directrices que fije el Presidente del Gobierno."
  - id: d
    text:
      es: "De acuerdo con los acuerdos de la Comisión General de Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 103.2 somete la creación, el régimen y la coordinación de esos órganos a la ley. Los reglamentos del Consejo de Ministros, las directrices del Presidente y los acuerdos de la Comisión General son normas o decisiones de rango inferior, que desarrollan la ley pero no la sustituyen."
  citation: "art. 103.2 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-103
- id: m01-l05-q047
  prompt:
    es: "Conforme al artículo 103.1 de la Constitución Española de 1978, la Administración Pública sirve con objetividad los intereses generales y actúa con sometimiento pleno a:"
  options:
  - id: a
    text:
      es: "La ley y a las instrucciones del Gobierno."
  - id: b
    text:
      es: "La Constitución y a las resoluciones judiciales."
  - id: c
    text:
      es: "Las órdenes del Gobierno y a los reglamentos."
  - id: d
    correct: true
    text:
      es: "La ley y al Derecho."
  explanation:
    es: "El artículo 103.1 somete a la Administración de manera plena a la ley y al Derecho. Las instrucciones del Gobierno, las resoluciones judiciales y las órdenes del Gobierno cambian el segundo término, o ambos, por algo que el artículo no dice."
  citation: "art. 103.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-103
- id: m01-l05-q048
  prompt:
    es: "¿Cuál de los siguientes principios NO figura entre los que guían la actuación de la Administración Pública, según el artículo 103.1 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El principio de eficiencia."
  - id: b
    text:
      es: "El principio de jerarquía."
  - id: c
    text:
      es: "El principio de desconcentración."
  - id: d
    text:
      es: "El principio de coordinación."
  explanation:
    es: "El artículo 103.1 enumera la eficacia, la jerarquía, la descentralización, la desconcentración y la coordinación. La eficiencia no está en la lista, y es la que se parece a la eficacia. La jerarquía, la desconcentración y la coordinación sí figuran en ella."
  citation: "art. 103.1 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-104
- id: m01-l05-q049
  prompt:
    es: "De acuerdo con el artículo 104.1 de la Constitución Española de 1978, las Fuerzas y Cuerpos de seguridad actúan bajo la dependencia:"
  options:
  - id: a
    text:
      es: "Del Rey."
  - id: b
    text:
      es: "De las Cortes Generales."
  - id: c
    text:
      es: "Del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Del Gobierno."
  explanation:
    es: "El artículo 104.1 pone a las Fuerzas y Cuerpos de seguridad bajo la dependencia del Gobierno. El Rey, las Cortes Generales y el Consejo de Estado no tienen esa relación de dependencia con ellas."
  citation: "art. 104.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-104
- id: m01-l05-q050
  prompt:
    es: "Señale la opción correcta sobre la misión de las Fuerzas y Cuerpos de seguridad, según el artículo 104.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Garantizar la soberanía e independencia de España y defender su integridad territorial."
  - id: b
    text:
      es: "Defender el ordenamiento constitucional y la unidad de la Nación española."
  - id: c
    correct: true
    text:
      es: "Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana."
  - id: d
    text:
      es: "Ejercer la función ejecutiva y la potestad reglamentaria en materia de seguridad."
  explanation:
    es: "El artículo 104.1 les asigna proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana. Garantizar la soberanía y la integridad territorial es la misión de las Fuerzas Armadas, según el artículo 8.1. Defender el ordenamiento constitucional y la unidad de la Nación tampoco es la misión que fija este artículo. La función ejecutiva y la potestad reglamentaria son del Gobierno, según el artículo 97."
  citation: "art. 104.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-107
- id: m01-l05-q051
  prompt:
    es: "¿Cuál de las siguientes materias regula una ley orgánica en relación con el Consejo de Estado, supremo órgano consultivo del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Su composición y su competencia."
  - id: b
    text:
      es: "Su régimen económico y su sede."
  - id: c
    text:
      es: "El nombramiento de sus miembros por el Congreso de los Diputados."
  - id: d
    text:
      es: "Su dependencia orgánica del Ministerio de la Presidencia."
  explanation:
    es: "El artículo 107 dice que una ley orgánica regulará la composición y la competencia del Consejo de Estado. El régimen económico, el nombramiento por el Congreso y la dependencia de un Ministerio no están en el artículo."
  citation: "art. 107 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q006
  prompt:
    es: "De acuerdo con el artículo 98.2 de la Constitución Española de 1978, el Presidente dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo:"
  options:
  - id: a
    text:
      es: "Que responden solo ante él de su gestión, y no ante el Congreso de los Diputados."
  - id: b
    text:
      es: "Que ejercen sus competencias por delegación del Presidente del Gobierno."
  - id: c
    text:
      es: "Sin perjuicio de la responsabilidad solidaria de éstos ante el Senado."
  - id: d
    correct: true
    text:
      es: "Sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión."
  explanation:
    es: "El artículo 98.2 termina con «sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión». Los miembros del Gobierno no responden solo ante el Presidente: el Gobierno responde solidariamente ante el Congreso (art. 108 CE). No ejercen sus competencias por delegación del Presidente, sino como competencia propia. La responsabilidad solidaria es ante el Congreso, no ante el Senado."
  citation: "art. 98.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q007
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde, en todo caso, al Presidente del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos."
  - id: b
    text:
      es: "Crear, modificar y suprimir los órganos directivos de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Interponer el recurso de inconstitucionalidad."
  - id: d
    text:
      es: "Aprobar el Proyecto de Ley de Presupuestos Generales del Estado."
  explanation:
    es: "El artículo 2.2.i) atribuye al Presidente «interponer el recurso de inconstitucionalidad». Las otras tres son funciones del Consejo de Ministros: aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos (art. 5.1.c), crear, modificar y suprimir los órganos directivos de los Departamentos (art. 5.1.i) y aprobar el Proyecto de Ley de Presupuestos (art. 5.1.b)."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q008
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde al Presidente del Gobierno crear, modificar y suprimir, por Real Decreto:"
  options:
  - id: a
    text:
      es: "Los órganos directivos de los Departamentos Ministeriales."
  - id: b
    text:
      es: "Los Departamentos Ministeriales y las Subsecretarías de cada uno de ellos."
  - id: c
    correct: true
    text:
      es: "Los Departamentos Ministeriales, así como las Secretarías de Estado."
  - id: d
    text:
      es: "Las Comisiones Delegadas del Gobierno y sus respectivas Secretarías."
  explanation:
    es: "El artículo 2.2.j) atribuye al Presidente crear, modificar y suprimir, por Real Decreto, «los Departamentos Ministeriales, así como las Secretarías de Estado». Los órganos directivos de los Departamentos los crea el Consejo de Ministros (art. 5.1.i). Las Subsecretarías no figuran en esta letra. Las Comisiones Delegadas las crea el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente (art. 6.1)."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q009
  prompt:
    es: "Según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿con qué requisito propone el Presidente del Gobierno al Rey la convocatoria de un referéndum consultivo?"
  options:
  - id: a
    text:
      es: "Previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Previa autorización de las Cortes Generales."
  - id: c
    text:
      es: "Previo dictamen favorable del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Previa autorización del Congreso de los Diputados."
  explanation:
    es: "El artículo 2.2.e) dice que el Presidente propone la convocatoria «previa autorización del Congreso de los Diputados». La deliberación del Consejo de Ministros es el requisito de la disolución y de la cuestión de confianza (letras c y d), no del referéndum. La autorización es del Congreso, no de las Cortes Generales. El dictamen del Consejo de Estado no aparece en esta letra."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-13
- id: m01-l05-q010
  prompt:
    es: "De acuerdo con el artículo 13.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en los casos de vacante, ausencia o enfermedad, las funciones del Presidente del Gobierno serán asumidas:"
  options:
  - id: a
    correct: true
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos."
  - id: b
    text:
      es: "Por el Vicepresidente primero y, en su defecto, por el Ministro de la Presidencia, sin atender al orden de los Departamentos."
  - id: c
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por el Ministro de mayor edad."
  - id: d
    text:
      es: "Por el Ministro que designe el Presidente mediante Real Decreto y, en su defecto, por el Ministro de la Presidencia."
  explanation:
    es: "El artículo 13.1 dice que las funciones del Presidente las asumen «los Vicepresidentes, de acuerdo con el correspondiente orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos». La ley no da la suplencia al Ministro de la Presidencia ni al Ministro de mayor edad. La designación por Real Decreto del Presidente es la regla de la suplencia de los Ministros (art. 13.2), no del Presidente."
  citation: "art. 13.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q052
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde, en todo caso, al Presidente del Gobierno según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Aprobar los Reales Decretos-leyes."
  - id: b
    correct: true
    text:
      es: "Representar al Gobierno."
  - id: c
    text:
      es: "Remitir los Tratados internacionales a las Cortes Generales."
  - id: d
    text:
      es: "Disponer la emisión de Deuda Pública."
  explanation:
    es: "El artículo 2.2.a atribuye al Presidente la representación del Gobierno. Aprobar los Reales Decretos-leyes, remitir los Tratados a las Cortes y disponer la emisión de Deuda Pública son funciones del Consejo de Ministros, según el artículo 5.1."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q053
  prompt:
    es: "Según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde al Presidente del Gobierno establecer el programa político del Gobierno y determinar las directrices de la política:"
  options:
  - id: a
    text:
      es: "Exterior, y la interior al Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "Interior y exterior, y velar por su cumplimiento."
  - id: c
    text:
      es: "Interior, y la exterior al Ministro competente."
  - id: d
    text:
      es: "Económica, y las demás a cada Ministro."
  explanation:
    es: "El artículo 2.2.b le encomienda las directrices de la política interior y exterior y velar por su cumplimiento. Reservar una de las dos políticas al Consejo de Ministros o a un Ministro recorta la función. Limitarla a la política económica la reduce más, porque la ley habla de las políticas interior y exterior."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q054
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Presidente del Gobierno propone al Rey la disolución del Congreso, del Senado o de las Cortes Generales, previa:"
  options:
  - id: a
    text:
      es: "Autorización del Congreso de los Diputados."
  - id: b
    text:
      es: "Consulta con los Grupos políticos."
  - id: c
    text:
      es: "Propuesta de la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "Deliberación del Consejo de Ministros."
  explanation:
    es: "El artículo 2.2.c exige la previa deliberación del Consejo de Ministros. La autorización del Congreso es el requisito de la propuesta de referéndum consultivo. La consulta con los Grupos políticos corresponde a la propuesta de candidato a la Presidencia del Gobierno que hace el Rey. La Comisión General no interviene."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q055
  prompt:
    es: "¿Cuál de los siguientes órganos recibe la cuestión de confianza que el Presidente del Gobierno plantea, previa deliberación del Consejo de Ministros, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "El Congreso de los Diputados."
  - id: b
    text:
      es: "El Senado."
  - id: c
    text:
      es: "El Rey."
  - id: d
    text:
      es: "El Consejo de Estado."
  explanation:
    es: "El artículo 2.2.d dice que la cuestión de confianza se plantea ante el Congreso de los Diputados. El Senado no da ni retira la confianza al Gobierno, que responde solo ante el Congreso. El Rey y el Consejo de Estado tampoco intervienen en esa votación."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q056
  prompt:
    es: "Señale la opción correcta sobre lo que, además de dirigir la política de defensa, ejerce el Presidente del Gobierno respecto de las Fuerzas Armadas, según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "El mando supremo, que la Constitución le atribuye."
  - id: b
    text:
      es: "La declaración de guerra, previa autorización del Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Las funciones previstas en la legislación reguladora de la defensa nacional y de la organización militar."
  - id: d
    text:
      es: "La acreditación de los embajadores y otros representantes diplomáticos."
  explanation:
    es: "El artículo 2.2.f le atribuye las funciones que prevé la legislación reguladora de la defensa nacional y de la organización militar. El mando supremo, la declaración de guerra y la acreditación de embajadores son funciones que la Constitución da al Rey, y ninguna aparece en este artículo como del Presidente."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q057
  prompt:
    es: "Señale la opción correcta sobre las facultades del Presidente del Gobierno en relación con las reuniones del Consejo de Ministros, según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "Convocarlas y presidirlas, sin fijar el orden del día."
  - id: b
    text:
      es: "Presidirlas y fijar el orden del día, sin convocarlas."
  - id: c
    text:
      es: "Fijar el orden del día y levantar el acta."
  - id: d
    correct: true
    text:
      es: "Convocarlas, presidirlas y fijar su orden del día."
  explanation:
    es: "El artículo 2.2.g le atribuye convocar, presidir y fijar el orden del día de las reuniones del Consejo de Ministros. Las demás opciones le quitan una de las tres tareas, o le atribuyen el acta, que no le corresponde, sin base en la ley."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q058
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, el Presidente del Gobierno refrenda, en su caso, los actos del Rey y le somete, para su sanción:"
  options:
  - id: a
    correct: true
    text:
      es: "Las leyes y demás normas con rango de ley."
  - id: b
    text:
      es: "Solo las leyes aprobadas por las Cortes."
  - id: c
    text:
      es: "Los reglamentos y las órdenes ministeriales."
  - id: d
    text:
      es: "Los Reales Decretos del Consejo de Ministros."
  explanation:
    es: "El artículo 2.2.h dice que le somete para su sanción las leyes y demás normas con rango de ley. Limitarlo a las leyes de las Cortes deja fuera las normas con rango de ley que no salen de ellas. Los reglamentos y las órdenes ministeriales no se sancionan. Los Reales Decretos los expide el Rey, no los sanciona."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q059
  prompt:
    es: "En relación con los Vicepresidentes y los Ministros, ¿qué corresponde en todo caso al Presidente del Gobierno, según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Nombrarlos y separarlos por Real Decreto."
  - id: b
    correct: true
    text:
      es: "Proponer al Rey su nombramiento y separación."
  - id: c
    text:
      es: "Proponerlos al Congreso de los Diputados para su investidura."
  - id: d
    text:
      es: "Proponer su nombramiento al Consejo de Ministros, que los nombra."
  explanation:
    es: "El artículo 2.2.k le atribuye proponer al Rey el nombramiento y la separación de los Vicepresidentes y de los Ministros. El nombramiento es del Rey, no del Presidente. Los Ministros no pasan por una investidura del Congreso. El Consejo de Ministros no los nombra."
  citation: "art. 2.2.k) Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q060
  prompt:
    es: "Conforme al artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde al Presidente del Gobierno resolver los conflictos de atribuciones que puedan surgir entre:"
  options:
  - id: a
    text:
      es: "El Gobierno y las Comunidades Autónomas."
  - id: b
    text:
      es: "El Estado y las Entidades Locales."
  - id: c
    correct: true
    text:
      es: "Los diferentes Ministerios."
  - id: d
    text:
      es: "Los Secretarios de Estado y los Subsecretarios."
  explanation:
    es: "El artículo 2.2.l le atribuye resolver los conflictos de atribuciones entre los diferentes Ministerios. Los conflictos entre el Gobierno y las Comunidades Autónomas o entre el Estado y las Entidades Locales enfrentan a administraciones distintas, no a Ministerios. La ley no le encomienda los que surgen entre Secretarios de Estado y Subsecretarios."
  citation: "art. 2.2.l) Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
