# anchor: boe-a-2003-23186-art-188
- id: m03-l13-q0079
  prompt:
    es: "¿En qué porcentaje se reduce la cuantía de las sanciones pecuniarias impuestas según los artículos 191 a 197 en los supuestos de conformidad, de acuerdo con el artículo 188.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Un 50 por ciento de la cuantía de la sanción."
  - id: b
    correct: true
    text:
      es: "Un 30 por ciento de la cuantía de la sanción."
  - id: c
    text:
      es: "Un 40 por ciento de la cuantía de la sanción."
  - id: d
    text:
      es: "Un 65 por ciento de la cuantía de la sanción."
  explanation:
    es: "La reducción por conformidad es del 30 por ciento, según el artículo 188.1.b LGT. El 40 por ciento es la reducción por pronto pago del apartado 3 y el 65 por ciento la de las actas con acuerdo. No existe una reducción del 50 por ciento en este artículo."
  citation: "art. 188.1 LGT"
  difficulty: 2
  tags:
