# anchor: boe-a-2003-23186-art-192
- id: m03-l13-q0129
  prompt:
    es: "Según el artículo 192.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo es muy grave la infracción de incumplir la obligación de presentar de forma completa y correcta declaraciones necesarias para practicar liquidaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando se hubieran utilizado medios fraudulentos."
  - id: b
    text:
      es: "Cuando la incidencia de la llevanza incorrecta de libros supere el 10 por ciento de la base."
  - id: c
    text:
      es: "Cuando no se haya presentado declaración alguna dentro del plazo establecido."
  - id: d
    text:
      es: "Cuando la base de la sanción supere los 3.000 euros y exista ocultación."
  explanation:
    es: "El artículo 192.4 LGT define la infracción muy grave por la utilización de medios fraudulentos. Una base superior a 3.000 euros con ocultación la hace grave, igual que una llevanza incorrecta de libros entre el 10 y el 50 por ciento. No presentar declaración no cambia por sí solo la calificación."
  citation: "art. 192.4 LGT"
  difficulty: 1
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-193
- id: m03-l13-q0131
  prompt:
    es: "De acuerdo con el artículo 193.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la base de la sanción por la infracción de obtener indebidamente devoluciones derivadas de la normativa de cada tributo es:"
  options:
  - id: a
    correct: true
    text:
      es: "La cantidad devuelta indebidamente como consecuencia de la comisión de la infracción."
  - id: b
    text:
      es: "La cuota que hubiera debido ingresarse si no se hubiese solicitado devolución alguna."
  - id: c
    text:
      es: "La diferencia entre la devolución obtenida y el importe de la deuda tributaria regularizada."
  - id: d
    text:
      es: "La cantidad solicitada en la autoliquidación, con independencia de la que se haya devuelto."
  explanation:
    es: "El artículo 193.1 LGT toma como base lo efectivamente devuelto de forma indebida. La cantidad solicitada sin obtener es la base del artículo 194.1. Las otras dos referencias no figuran en el artículo."
  citation: "art. 193.1 LGT"
  difficulty: 2
  tags:
  - "base"
# anchor: boe-a-2003-23186-art-193
- id: m03-l13-q0132
  prompt:
    es: "Según el artículo 193.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la infracción de obtener indebidamente devoluciones cuando la base de la sanción sea de 2.000 euros y no exista ocultación:"
  options:
  - id: a
    text:
      es: "Es leve y se sanciona con una multa pecuniaria proporcional del 15 por ciento."
  - id: b
    text:
      es: "Es leve y se sanciona con una multa pecuniaria fija de 300 euros."
  - id: c
    correct: true
    text:
      es: "Es leve y se sanciona con una multa pecuniaria proporcional del 50 por ciento."
  - id: d
    text:
      es: "Es grave y se sanciona con una multa pecuniaria proporcional del 50 al 100 por ciento."
  explanation:
    es: "Con base inferior a 3.000 euros y sin ocultación, el artículo 193.2 LGT la califica de leve y la sanciona con el 50 por ciento. El 15 por ciento es de la infracción del artículo 194.1, que no incluye devolución obtenida. La multa del 50 al 100 es la de la grave, y los 300 euros fijos corresponden al artículo 194.2."
  citation: "art. 193.2 LGT"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-193
- id: m03-l13-q0133
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la infracción grave de obtener indebidamente devoluciones es CORRECTA según el artículo 193.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Se da cuando la base de la sanción es superior a 3.000 euros y existe ocultación, con multa del 50 al 100 por ciento."
  - id: b
    text:
      es: "Se da cuando la base de la sanción es superior a 3.000 euros, exista o no ocultación, con multa del 50 al 100 por ciento."
  - id: c
    text:
      es: "Se da cuando la base de la sanción es superior a 3.000 euros y existe ocultación, con multa del 100 al 150 por ciento."
  - id: d
    text:
      es: "Se da cuando la base de la sanción es superior a 6.000 euros y existe ocultación, con multa del 50 al 100 por ciento."
  explanation:
    es: "El artículo 193.3 LGT la considera grave con base superior a 3.000 euros y ocultación, con multa del 50 al 100 por ciento. Si no hay ocultación, es leve. El tramo del 100 al 150 es el de la muy grave y el umbral es de 3.000 euros, no de 6.000."
