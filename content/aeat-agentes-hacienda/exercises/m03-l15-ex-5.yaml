# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0096
  prompt:
    es: "En 2026, una empresa contrata un arrendamiento de vehículo que no es de su propiedad y lo cede a Jorge Ibáñez para uso particular. El vehículo, si fuese nuevo, tendría un valor de mercado de 30.000 euros. Conforme al artículo 43.1.1.º.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿por qué importe anual se valora el uso?"
  options:
  - id: a
    text:
      es: "El uso se valora en 30.000 euros anuales."
  - id: b
    text:
      es: "El uso se valora en 3.000 euros anuales."
  - id: c
    text:
      es: "El uso se valora en 4.500 euros anuales."
  - id: d
    correct: true
    text:
      es: "El uso se valora en 6.000 euros anuales."
  explanation:
    es: "Si el vehículo no es propiedad del pagador, el 20 por ciento anual se aplica sobre el valor de mercado que tendría si fuese nuevo: 20 por ciento de 30.000 euros son 6.000 euros (art. 43.1.1.º.b) LIRPF). El valor íntegro de 30.000 no es la valoración anual, y 3.000 y 4.500 son resultados de porcentajes del 10 y del 15 por ciento."
  citation: "art. 43.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "vehículos"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0098
  prompt:
    es: "¿Qué porcentaje anual del coste de adquisición se aplica para valorar el uso de un vehículo automóvil propiedad del pagador, como rendimiento del trabajo en especie, según el artículo 43 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "El 20 por ciento anual del coste de adquisición para el pagador, incluidos los tributos que graven la operación."
  - id: b
    text:
      es: "El 25 por ciento anual del coste de adquisición para el pagador, excluidos los tributos que graven la operación."
  - id: c
    text:
      es: "El 10 por ciento anual del coste de adquisición para el pagador, incluidos los tributos que graven la operación."
  - id: d
    text:
      es: "El 15 por ciento anual del valor de mercado del vehículo si fuese nuevo."
  explanation:
    es: "El uso se valora en el 20 por ciento anual del coste de adquisición para el pagador, que incluye los tributos de la operación (art. 43.1.1.º.b) LIRPF). Diez y veinticinco por ciento son porcentajes cercanos. La base de valor de mercado de un vehículo nuevo se reserva al caso en que el vehículo no sea del pagador, y el 15 por ciento no figura."
  citation: "art. 43.1 LIRPF"
  difficulty: 1
  tags:
  - "especie"
  - "vehículos"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0100
  prompt:
    es: "Señale la respuesta CORRECTA sobre los gastos deducibles del rendimiento del trabajo, de acuerdo con el artículo 19.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Tienen la consideración de gastos deducibles, entre otros, los enumerados en ese apartado."
  - id: b
    text:
      es: "Tienen la consideración de gastos deducibles los enumerados en ese apartado, salvo los de defensa jurídica."
  - id: c
    text:
      es: "Tienen la consideración de gastos deducibles los enumerados en ese apartado y los necesarios para la obtención de los rendimientos."
  - id: d
    correct: true
    text:
      es: "Tienen la consideración de gastos deducibles exclusivamente los enumerados en ese apartado."
  explanation:
    es: "La lista del artículo 19.2 LIRPF es cerrada: el texto dice exclusivamente. Por eso no caben otros gastos, ni los necesarios para la obtención de los rendimientos, que es la regla del capital inmobiliario. Y los gastos de defensa jurídica figuran en la lista, con su límite."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "rendimiento neto"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0101
  prompt:
    es: "De acuerdo con el artículo 19.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son gasto deducible del rendimiento del trabajo las cotizaciones a:"
  options:
  - id: a
    text:
      es: "la Seguridad Social o a cualquier mutualidad de previsión social, obligatoria o voluntaria."
  - id: b
    text:
      es: "planes de pensiones y mutualidades de previsión social."
  - id: c
    correct: true
    text:
      es: "la Seguridad Social o a mutualidades generales obligatorias de funcionarios."
  - id: d
    text:
      es: "la Seguridad Social, pero no a mutualidades de funcionarios."
  explanation:
    es: "Se deducen las cotizaciones a la Seguridad Social y a las mutualidades generales obligatorias de funcionarios (art. 19.2.a) LIRPF). Las mutualidades voluntarias y los planes de pensiones no figuran en la lista, y excluir las de funcionarios contradice la letra."
  citation: "art. 19.2 LIRPF"
  difficulty: 1
  tags:
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0102
  prompt:
    es: "Según el artículo 19.2.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son gasto deducible del rendimiento del trabajo las cotizaciones a:"
  options:
  - id: a
    text:
      es: "los colegios profesionales de colegiación voluntaria."
  - id: b
    text:
      es: "los sindicatos de trabajadores o entidades similares."
  - id: c
    text:
      es: "las asociaciones de padres de alumnos o entidades similares."
  - id: d
    correct: true
    text:
      es: "los colegios de huérfanos o entidades similares."
  explanation:
    es: "La letra c) cita los colegios de huérfanos o entidades similares. Los colegios profesionales y los sindicatos se tratan en la letra d), con condiciones y límite propios, y las asociaciones de padres no figuran en la lista."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0103
  prompt:
    es: "Conforme al artículo 19.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son gasto deducible del rendimiento del trabajo las cuotas satisfechas a sindicatos y colegios profesionales, cuando la colegiación tenga carácter:"
  options:
  - id: a
    text:
      es: "voluntario u obligatorio, en la parte que corresponda a los fines esenciales de estas instituciones y con el límite que reglamentariamente se establezca."
  - id: b
    text:
      es: "obligatorio, por su importe íntegro y sin otro límite que el rendimiento íntegro del trabajo."
  - id: c
    correct: true
    text:
      es: "obligatorio, en la parte que corresponda a los fines esenciales de estas instituciones y con el límite que reglamentariamente se establezca."
  - id: d
    text:
      es: "obligatorio, hasta el límite de 300 euros anuales por cada institución."
  explanation:
    es: "La letra d) exige colegiación obligatoria, limita la deducción a la parte que corresponde a los fines esenciales y fija el límite por reglamento (art. 19.2.d) LIRPF). La colegiación voluntaria no cumple el requisito. Deducir el importe íntegro quita el límite reglamentario, y los 300 euros son el límite de los gastos de defensa jurídica de la letra e)."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "gastos deducibles"
  - "sindicatos"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0106
  prompt:
    es: "Conforme al artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los otros gastos deducibles del rendimiento del trabajo distintos de los de las letras anteriores:"
  options:
  - id: a
    text:
      es: "Se deducen 1.500 euros anuales en concepto de otros gastos."
  - id: b
    correct: true
    text:
      es: "Se deducen 2.000 euros anuales en concepto de otros gastos."
  - id: c
    text:
      es: "Se deducen 2.500 euros anuales en concepto de otros gastos."
  - id: d
    text:
      es: "Se deducen 3.500 euros anuales en concepto de otros gastos."
  explanation:
    es: "La cuantía general de otros gastos es de 2.000 euros anuales (art. 19.2.f) LIRPF). Los 3.500 euros son el incremento para personas con discapacidad que son trabajadores activos, no la cuantía general. Mil quinientos y dos mil quinientos son cifras que el artículo no recoge."
  citation: "art. 19.2 LIRPF"
  difficulty: 1
  tags:
  - "gastos deducibles"
  - "cifra"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0107
  prompt:
    es: "Nuria Ramos, desempleada inscrita en la oficina de empleo, acepta en septiembre de 2026 un puesto de trabajo que exige trasladar su residencia habitual a un nuevo municipio. Sus rendimientos íntegros superan los 30.000 euros anuales en 2026 y en 2027. Según el artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe de otros gastos puede deducir en cada período?"
  options:
  - id: a
    text:
      es: "4.000 euros anuales en 2026 y 2.000 euros anuales en 2027, porque el incremento solo se aplica en el período del cambio de residencia y no en el siguiente."
  - id: b
    correct: true
    text:
      es: "4.000 euros anuales en 2026 y 4.000 euros anuales en 2027, porque el incremento de 2.000 euros se aplica en el período del cambio y en el siguiente."
  - id: c
    text:
      es: "6.000 euros anuales en 2026 y 6.000 euros anuales en 2027, porque el incremento es de 4.000 euros adicionales."
  - id: d
    text:
      es: "2.000 euros anuales en 2026 y 4.000 euros anuales en 2027, porque el incremento se aplica solo en el período siguiente al del cambio."
  explanation:
    es: "Los 2.000 euros de otros gastos se incrementan en 2.000 euros adicionales en el período del cambio de residencia (2026) y en el siguiente (2027): 4.000 euros en cada uno (art. 19.2.f) LIRPF). Aplicar el incremento solo en uno de los dos períodos recorta el plazo, y un incremento de 4.000 euros duplica la cifra de la ley."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "otros gastos"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0108
  prompt:
    es: "Según el artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el incremento de 2.000 euros anuales de otros gastos, en el período del cambio de residencia y en el siguiente, corresponde a desempleados inscritos que acepten un puesto de trabajo que exija trasladar su residencia habitual:"
  options:
  - id: a
    text:
      es: "a otra Comunidad Autónoma, en las condiciones que reglamentariamente se determinen."
  - id: b
    text:
      es: "a un municipio situado a más de cien kilómetros del anterior, sin otras condiciones."
  - id: c
    text:
      es: "a otro Estado miembro de la Unión Europea, en las condiciones que reglamentariamente se determinen."
  - id: d
    correct: true
    text:
      es: "a un nuevo municipio, en las condiciones que reglamentariamente se determinen."
  explanation:
    es: "El traslado que da derecho al incremento es el de la residencia habitual a un nuevo municipio, en las condiciones del reglamento (art. 19.2.f) LIRPF). No se exige cambiar de Comunidad Autónoma ni de Estado, ni existe un umbral de distancia en kilómetros."
  citation: "art. 19.2 LIRPF"
  difficulty: 1
  tags:
  - "otros gastos"
  - "desempleo"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0109
  prompt:
    es: "Berta Luna, trabajadora activa con una discapacidad reconocida del 33 por ciento que no necesita ayuda de terceras personas ni tiene movilidad reducida, obtiene en 2026 rendimientos del trabajo suficientes para aplicar todos sus gastos. Conforme al artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe anual de otros gastos puede deducir?"
  options:
  - id: a
    text:
      es: "3.500 euros: solo el incremento, que sustituye a la cuantía general."
  - id: b
    text:
      es: "2.000 euros: la cuantía general, sin incremento alguno."
  - id: c
    text:
      es: "9.750 euros: los 2.000 euros generales más 7.750 euros de incremento."
  - id: d
    correct: true
    text:
      es: "5.500 euros: los 2.000 euros generales más 3.500 euros de incremento."
  explanation:
    es: "Una persona con discapacidad que trabaja como activa suma 3.500 euros a los 2.000 generales: 5.500 euros (art. 19.2.f) LIRPF). El incremento de 7.750 exige ayuda de terceras personas, movilidad reducida o un grado igual o superior al 65 por ciento, que Berta no tiene. Y el incremento se añade a la cuantía general, no la sustituye."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "discapacidad"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0110
  prompt:
    es: "Raúl Peña, trabajador activo con una discapacidad reconocida del 65 por ciento, obtiene en 2026 rendimientos del trabajo suficientes para aplicar todos sus gastos. Según el artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe anual de otros gastos puede deducir?"
  options:
  - id: a
    text:
      es: "7.750 euros: solo el incremento, que sustituye a la cuantía general."
  - id: b
    text:
      es: "5.500 euros: los 2.000 euros generales más 3.500 euros de incremento."
  - id: c
    text:
      es: "2.000 euros: la cuantía general, sin incremento alguno."
  - id: d
    correct: true
    text:
      es: "9.750 euros: los 2.000 euros generales más 7.750 euros de incremento."
  explanation:
    es: "Con un grado igual o superior al 65 por ciento, el incremento para trabajadores activos es de 7.750 euros, que se suma a los 2.000 generales: 9.750 euros (art. 19.2.f) LIRPF). Los 3.500 euros corresponden al caso general. El incremento no sustituye a la cuantía de 2.000, y no es cero."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "discapacidad"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0111
  prompt:
    es: "¿En cuál de los siguientes supuestos el incremento de los otros gastos deducibles del rendimiento del trabajo es de 7.750 euros anuales, según el artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Persona con discapacidad que, siendo trabajador activo, tiene un grado inferior al 65 por ciento y no necesita ayuda de terceros."
  - id: b
    text:
      es: "Persona con discapacidad que obtiene rendimientos del trabajo, cualquiera que sea su situación laboral."
  - id: c
    text:
      es: "Persona con discapacidad igual o superior al 65 por ciento que solo percibe prestaciones por desempleo."
  - id: d
    correct: true
    text:
      es: "Persona con discapacidad que, siendo trabajador activo, acredita necesitar ayuda de terceras personas o movilidad reducida."
  explanation:
    es: "El incremento de 7.750 euros exige ser trabajador activo y acreditar ayuda de terceras personas o movilidad reducida, o un grado de discapacidad igual o superior al 65 por ciento (art. 19.2.f) LIRPF). Quien solo cobra desempleo no es trabajador activo. Con un grado inferior al 65 y sin ayuda corresponde el incremento de 3.500. Y la situación laboral sí importa."
  citation: "art. 19.2 LIRPF"
  difficulty: 3
  tags:
  - "discapacidad"
  - "otros gastos"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0113
  prompt:
    es: "Según el artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los gastos deducibles de la letra f) tienen como límite:"
  options:
  - id: a
    text:
      es: "el importe de las cotizaciones a la Seguridad Social satisfechas en el período."
  - id: b
    text:
      es: "el rendimiento íntegro del trabajo, sin minorarlo por el resto de gastos deducibles del apartado 2."
  - id: c
    correct: true
    text:
      es: "el rendimiento íntegro del trabajo una vez minorado por el resto de gastos deducibles previstos en el apartado 2."
  - id: d
    text:
      es: "el rendimiento neto del trabajo una vez aplicada la reducción por obtención de rendimientos del trabajo del artículo 20."
  explanation:
    es: "Los otros gastos no pueden exceder el rendimiento íntegro menos los demás gastos del apartado 2 (art. 19.2.f) LIRPF). Tomar el neto tras la reducción del artículo 20 adelanta una operación posterior, y no minorar por los demás gastos o limitarlo a las cotizaciones cambia la base del límite."
  citation: "art. 19.2 LIRPF"
  difficulty: 3
  tags:
  - "otros gastos"
  - "límite"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0114
  prompt:
    es: "Mario Gil obtiene en 2026 un rendimiento íntegro del trabajo de 2.300 euros y satisface 400 euros de cotizaciones a la Seguridad Social. No tiene otros gastos de las letras a) a e) ni incrementos por discapacidad o traslado. Conforme al artículo 19.2.f) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe puede deducir como otros gastos?"
  options:
  - id: a
    text:
      es: "2.000 euros, que es la cuantía general de la letra f)."
  - id: b
    correct: true
    text:
      es: "1.900 euros, que es el rendimiento íntegro minorado por las cotizaciones."
  - id: c
    text:
      es: "2.300 euros, que es el rendimiento íntegro del trabajo."
  - id: d
    text:
      es: "1.600 euros, que es la cuantía general de 2.000 euros menos las cotizaciones."
  explanation:
    es: "El rendimiento íntegro menos las cotizaciones es 2.300 menos 400, 1.900 euros, inferior a los 2.000 generales, y ese es el límite de la letra f) (art. 19.2.f) LIRPF). Aplicar 2.000 lo supera. Los 2.300 ignoran la minoración, y 1.600 resta las cotizaciones a la cuantía general, que no es la base del límite."
  citation: "art. 19.2 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "supuesto"
  - "otros gastos"
# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0115
  prompt:
    es: "De acuerdo con el artículo 18.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se reducen en un 30 por ciento los rendimientos íntegros distintos de los del artículo 17.2.a) que tengan un período de generación superior a:"
  options:
  - id: a
    correct: true
    text:
      es: "dos años, así como los que se califiquen reglamentariamente como obtenidos de forma notoriamente irregular en el tiempo."
  - id: b
    text:
      es: "cinco años, así como los que se califiquen reglamentariamente como obtenidos de forma notoriamente irregular en el tiempo."
  - id: c
    text:
      es: "un año, así como los que se califiquen reglamentariamente como obtenidos de forma notoriamente irregular en el tiempo."
  - id: d
    text:
      es: "tres años, así como los que se califiquen reglamentariamente como obtenidos de forma notoriamente irregular en el tiempo."
  explanation:
    es: "El período de generación debe superar los dos años (art. 18.2 LIRPF). Uno, tres y cinco años son plazos próximos que el artículo no recoge. Los cinco períodos se usan para otro fin en el mismo apartado: la exclusión por reducción previa."
  citation: "art. 18.2 LIRPF"
  difficulty: 1
  tags:
  - "reducción"
  - "plazo"
# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0116
  prompt:
    es: "Conforme al artículo 18.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la reducción del 30 por ciento de los rendimientos con período de generación superior a dos años o de generación notoriamente irregular se aplica cuando, en ambos casos, se imputen:"
  options:
  - id: a
    text:
      es: "fraccionadamente en más de un período impositivo."
  - id: b
    correct: true
    text:
      es: "en un único período impositivo."
  - id: c
    text:
      es: "en dos períodos impositivos consecutivos, como máximo."
  - id: d
    text:
      es: "en el período impositivo siguiente al de su generación."
  explanation:
    es: "La reducción exige que el rendimiento se impute en un único período impositivo (art. 18.2 LIRPF). La imputación en dos períodos, fraccionada o en el siguiente al de su generación no cumple esa condición."
  citation: "art. 18.2 LIRPF"
  difficulty: 1
  tags:
  - "reducción"
# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0118
  prompt:
    es: "Señale la respuesta CORRECTA sobre el importe máximo al que se aplica la reducción del 30 por ciento de los rendimientos íntegros del trabajo, de acuerdo con el artículo 18.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "La cuantía del rendimiento íntegro sobre la que se aplica la reducción no puede superar 600.000 euros anuales."
  - id: b
    correct: true
    text:
      es: "La cuantía del rendimiento íntegro sobre la que se aplica la reducción no puede superar 300.000 euros anuales."
  - id: c
    text:
      es: "La cuantía del rendimiento íntegro sobre la que se aplica la reducción no puede superar 100.000 euros anuales."
  - id: d
    text:
      es: "La cuantía del rendimiento íntegro sobre la que se aplica la reducción no puede superar 150.000 euros anuales."
  explanation:
    es: "El límite es de 300.000 euros anuales sobre los que se aplica el 30 por ciento (art. 18.2 LIRPF). Ciento cincuenta mil y seiscientos mil son cifras que el artículo no fija, y los 100.000 euros son el límite de otra reducción, la del inicio de actividad del artículo 32.3."
  citation: "art. 18.2 LIRPF"
  difficulty: 1
  tags:
