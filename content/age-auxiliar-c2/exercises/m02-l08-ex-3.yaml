# anchor: fuente-ms-word-atajos-html
- id: m02-l08-q085
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra el cuadro de diálogo Macro?"
  options:
  - id: a
    text:
      es: "Alt+F11"
  - id: b
    text:
      es: "Alt+F7"
  - id: c
    correct: true
    text:
      es: "Alt+F8"
  - id: d
    text:
      es: "Alt+F5"
