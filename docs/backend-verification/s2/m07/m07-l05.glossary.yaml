- id: g-idempotent-method
  term:
    en: idempotent method
  definition:
    en: A request method is considered "idempotent" if the intended effect on the server of multiple identical requests with that method is the same as the effect for a single such request.
  origin: m07-l05
  citation: rfc9110#section-9.2.2
- id: g-idempotency-key
  term:
    en: idempotency key
  definition:
    en: An idempotency key is a unique value generated by the client which the resource uses to recognize subsequent retries of the same request.
  origin: m07-l05
  citation: ietf-httpapi-idempotency-key#content
- id: g-lost-update-problem
  term:
    en: lost update problem
  definition:
    en: One client accidentally overwriting the work of another client that has been acting in parallel.
  origin: m07-l05
  citation: rfc9110#section-13
- id: g-entity-tag
  term:
    en: entity tag
  definition:
    en: An entity tag is an opaque validator for differentiating between multiple representations of the same resource, regardless of whether those multiple representations are due to resource state changes over time, content negotiation resulting in multiple representations being valid at the same time, or both.
  origin: m07-l05
  citation: rfc9110#section-8.8.3
- id: g-problem-details
  term:
    en: problem details
  definition:
    en: The canonical model for problem details is a JSON object, identified with the application/problem+json media type.
  origin: m07-l05
  citation: rfc9457#section-3
