# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q244
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes parejas de combinaciones va a la carpeta anterior y a la siguiente, respectivamente?"
  options:
  - id: a
    text:
      es: "Alt+Flecha arriba y Alt+Entrar"
  - id: b
    text:
      es: "Ctrl+Tab y Ctrl+Mayús+Tab"
  - id: c
    correct: true
    text:
      es: "Alt+Flecha izquierda y Alt+Flecha derecha"
  - id: d
    text:
      es: "Alt+D y Alt+P"
  explanation:
    es: "Alt+Flecha izquierda retrocede a la carpeta anterior y Alt+Flecha derecha avanza a la siguiente. Alt+Flecha arriba sube un nivel y Alt+Entrar muestra las propiedades; Ctrl+Tab y Ctrl+Mayús+Tab cambian de pestaña; Alt+D selecciona la barra de direcciones y Alt+P muestra el panel de vista previa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q247
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas actualiza la ventana, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "F3"
  - id: b
    text:
      es: "F6"
  - id: c
    correct: true
    text:
      es: "F5"
  - id: d
    text:
      es: "F4"
  explanation:
    es: "F5 actualiza la ventana. F3 busca un archivo o una carpeta, F4 selecciona la barra de direcciones para cambiar la ruta y F6 desplaza el foco por los elementos de la ventana."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
