# anchor: boe-a-1986-1216-art-41
- id: m01-l14-q230
  prompt:
    es: "Cumplimentadas las diligencias, la vista del expediente se notifica al inculpado el lunes, 23 de agosto de 2027, sin festivos en esas fechas. ¿Hasta qué día puede alegar y aportar documentos?"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 2 de septiembre de 2027."
  - id: b
    text:
      es: "Hasta el viernes, 3 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el lunes, 6 de septiembre de 2027."
  - id: d
    text:
      es: "Hasta el martes, 14 de septiembre de 2027."
  explanation:
    es: "El artículo 41 del Real Decreto 33/1986 da diez días, hábiles por el artículo 30.2 de la Ley 39/2015. Agosto es hábil en el procedimiento administrativo: solo se excluyen sábados, domingos y festivos. Del martes 24 al viernes 27 de agosto van cuatro; el lunes 30 y el martes 31, seis; del miércoles 1 al viernes 3 de septiembre, nueve; el décimo es el lunes 6 de septiembre de 2027. El martes 14 sale de tratar agosto como inhábil. El jueves 2 sale de contar días naturales. El viernes 3 cuenta como primero el día de la notificación."
  citation: "art. 41 RD 33/1986"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-42
- id: m01-l14-q232
  prompt:
    es: "De acuerdo con el artículo 42 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la propuesta de resolución la formula:"
  options:
  - id: a
    text:
      es: "El Instructor, dentro del mes siguiente."
  - id: b
    text:
      es: "El Subsecretario del Departamento, dentro de los diez días siguientes."
  - id: c
    text:
      es: "El órgano competente para sancionar, dentro de los diez días siguientes."
  - id: d
    correct: true
    text:
      es: "El Instructor, dentro de los diez días siguientes."
  explanation:
    es: "El artículo 42 dice: «El Instructor formulará dentro de los diez días siguientes la propuesta de resolución». El plazo no es de un mes. La propuesta no la hace el Subsecretario ni el órgano que sanciona: la fase instructora y la sancionadora van a órganos distintos."
  citation: "art. 42 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1986-1216-art-43
- id: m01-l14-q233
  prompt:
    es: "Según el artículo 43 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, notificada la propuesta de resolución, ¿ante quién y en qué plazo puede alegar el interesado?"
  options:
  - id: a
    text:
      es: "Ante el órgano competente para sancionar, en el plazo de diez días."
  - id: b
    text:
      es: "Ante el Instructor, en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "Ante el Instructor, en el plazo de diez días."
  - id: d
    text:
      es: "Ante el Subsecretario del Departamento, en el plazo de quince días."
  explanation:
    es: "El artículo 43 dice que la propuesta se notifica «para que, en el plazo de diez días, pueda alegar ante el Instructor cuanto considere conveniente en su defensa». Las alegaciones no van al órgano que sanciona ni al Subsecretario, y el plazo no es de un mes ni de quince días."
  citation: "art. 43 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1986-1216-art-43
- id: m01-l14-q234
  prompt:
    es: "La propuesta de resolución de un expediente disciplinario se notifica al interesado el jueves, 28 de octubre de 2027. En esas fechas el único festivo es el lunes, 1 de noviembre. ¿Hasta qué día puede alegar ante el Instructor?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 8 de noviembre de 2027."
  - id: b
    text:
      es: "Hasta el jueves, 11 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el viernes, 12 de noviembre de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 15 de noviembre de 2027."
  explanation:
    es: "El artículo 43 del Real Decreto 33/1986 da diez días, hábiles por el artículo 30.2 de la Ley 39/2015. El viernes 29 de octubre es el primero. El sábado 30, el domingo 31 y el festivo 1 de noviembre no cuentan. Del martes 2 al viernes 5 van cinco y del lunes 8 al viernes 12, diez: el último día es el viernes 12 de noviembre de 2027. El jueves 11 sale de contar el 1 de noviembre como hábil. El lunes 8 sale de contar días naturales, que acaban el domingo 7. El lunes 15 añade un día de más."
  citation: "art. 43 RD 33/1986"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-45
- id: m01-l14-q235
  prompt:
    es: "De acuerdo con el artículo 45.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la resolución que pone fin al procedimiento disciplinario deberá adoptarse en el plazo de diez días:"
  options:
  - id: a
    text:
      es: "Salvo en caso de suspensión de funciones."
  - id: b
    text:
      es: "Salvo en caso de traslado con cambio de residencia."
  - id: c
    text:
      es: "Salvo en caso de falta leve sancionada con apercibimiento."
  - id: d
    correct: true
    text:
      es: "Salvo en caso de separación del servicio."
  explanation:
    es: "El artículo 45.1 dice que la resolución «deberá adoptarse en el plazo de diez días, salvo en caso de separación del servicio». La suspensión de funciones, el traslado con cambio de residencia y el apercibimiento no están exceptuados."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1986-1216-art-45
- id: m01-l14-q236
  prompt:
    es: "En un expediente por falta grave en el que se propone la suspensión de funciones, ¿en qué plazo debe adoptarse la resolución según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de diez días."
  - id: b
    text:
      es: "En el plazo de un mes."
  - id: c
    text:
      es: "En el plazo de tres meses."
  - id: d
    text:
      es: "En el plazo de seis meses."
  explanation:
    es: "El artículo 45.1 fija diez días para la resolución, con la única salvedad de la separación del servicio. La suspensión de funciones no es separación, así que rige el plazo de diez días. Un mes, tres meses y seis meses no son el plazo de este trámite."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-45
- id: m01-l14-q237
  prompt:
    es: "El órgano competente recibe el lunes, 15 de noviembre de 2027, un expediente en el que se propone suspensión de funciones. Si el plazo para resolver se cuenta desde el día siguiente, sin festivos en esas fechas, ¿cuándo vence?"
  options:
  - id: a
    text:
      es: "El jueves, 25 de noviembre de 2027."
  - id: b
    text:
      es: "El viernes, 26 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 29 de noviembre de 2027."
  - id: d
    text:
      es: "El miércoles, 15 de diciembre de 2027."
  explanation:
    es: "Como no es separación del servicio, el artículo 45.1 del Real Decreto 33/1986 da diez días, hábiles por el artículo 30.2 de la Ley 39/2015. Del martes 16 al viernes 19 van cuatro, del lunes 22 al viernes 26 nueve, y el décimo es el lunes 29 de noviembre de 2027. El jueves 25 sale de contar días naturales. El viernes 26 cuenta como primero el día de la recepción. El 15 de diciembre es un mes."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-47
- id: m01-l14-q238
  prompt:
    es: "Según el artículo 47.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿para imponer qué sanción es competente el Consejo de Ministros?"
  options:
  - id: a
    correct: true
    text:
      es: "La separación del servicio."
  - id: b
    text:
      es: "La suspensión de funciones."
  - id: c
    text:
      es: "El traslado con cambio de residencia."
  - id: d
    text:
      es: "El apercibimiento."
  explanation:
    es: "El artículo 47.1 reserva al Consejo de Ministros la imposición de «la separación del servicio». La suspensión de funciones y el traslado con cambio de residencia los imponen los Ministros y Secretarios de Estado (artículo 47.2). El apercibimiento lo imponen el Subsecretario, los Directores generales y los Delegados del Gobierno (artículo 47.3)."
  citation: "art. 47.1 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m01-l14-q239
  prompt:
    es: "Según el artículo 47.2 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, los Ministros y Secretarios de Estado del Departamento de destino son competentes para imponer:"
  options:
  - id: a
    text:
      es: "La suspensión de funciones, pero no el traslado con cambio de residencia."
  - id: b
    text:
      es: "El apercibimiento y el traslado con cambio de residencia."
  - id: c
    text:
      es: "Solo el apercibimiento, cuando se trate de faltas leves."
  - id: d
    correct: true
    text:
      es: "La suspensión de funciones y el traslado con cambio de residencia."
  explanation:
    es: "El artículo 47.2 les atribuye «las sanciones de los apartados b) y c) del artículo 14»: la suspensión de funciones y el traslado con cambio de residencia. Excluir el traslado deja fuera el apartado c). El apercibimiento es el apartado e), que el artículo 47.3 da al Subsecretario, a los Directores generales y a los Delegados del Gobierno."
  citation: "art. 47.2 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m01-l14-q240
  prompt:
    es: "De acuerdo con el artículo 47.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la sanción de apercibimiento puede imponerla a cualquier funcionario destinado en el Departamento:"
  options:
  - id: a
    text:
      es: "El Director general de cualquier centro directivo del Departamento."
  - id: b
    text:
      es: "El Delegado del Gobierno de cualquier comunidad autónoma."
  - id: c
    correct: true
    text:
      es: "El Subsecretario del Departamento."
  - id: d
    text:
      es: "El Jefe del centro o dependencia del funcionario."
  explanation:
    es: "El artículo 47.3 RD 33/1986 asigna la sanción de apercibimiento (apartados d y e del artículo 14) al «Subsecretario del Departamento, en todo caso». Los Directores generales la imponen solo «respecto del personal dependiente de su Dirección General», no a cualquier funcionario del Departamento. Los Delegados del Gobierno la imponen solo «respecto a los funcionarios destinados en su correspondiente ámbito territorial», no a los de cualquier comunidad autónoma. El artículo 47 enumera los órganos sancionadores en tres apartados: el Consejo de Ministros para la separación del servicio, los Ministros y Secretarios de Estado, o los Subsecretarios por delegación, para las sanciones de los apartados b) y c) del artículo 14, y los del apartado 3. El Jefe del centro o dependencia no es ninguno de ellos."
  citation: "art. 47.3 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-47
- id: m01-l14-q241
  prompt:
    es: "¿Cuál de las siguientes sanciones pueden imponer los Delegados del Gobierno a los funcionarios de su ámbito territorial, según el artículo 47.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El apercibimiento."
  - id: b
    text:
      es: "La suspensión de funciones."
  - id: c
    text:
      es: "El traslado con cambio de residencia."
  - id: d
    text:
      es: "La separación del servicio."
  explanation:
    es: "El artículo 47.3 permite a los Delegados del Gobierno imponer en su ámbito territorial las sanciones «de los apartados d) y e) del artículo 14». El apartado d) figura como derogado y el e) es el apercibimiento. La suspensión de funciones y el traslado con cambio de residencia son de los Ministros y Secretarios de Estado (artículo 47.2), y la separación del servicio, del Consejo de Ministros (artículo 47.1)."
  citation: "art. 47.3 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-94
- id: m01-l14-q242
  prompt:
    es: "El Instructor de un procedimiento disciplinario recoge indicios fundados de que los hechos investigados son delictivos. Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué efecto tiene esto sobre la tramitación?"
  options:
  - id: a
    text:
      es: "Continúa su curso normal hasta la propuesta de resolución del Instructor."
  - id: b
    correct: true
    text:
      es: "Se suspende la tramitación del procedimiento disciplinario ya iniciado."
  - id: c
    text:
      es: "Se amplía en un mes el plazo para formular el pliego de cargos."
  - id: d
    text:
      es: "Pasa a tramitarse por el procedimiento sumario con audiencia al interesado."
  explanation:
    es: "El artículo 94.3 dice que, ante indicios fundados de criminalidad, «se suspenderá su tramitación». El procedimiento no sigue su curso, y la ampliación del plazo del pliego de cargos exige causas justificadas del Instructor, no indicios de delito. El procedimiento sumario es el de las faltas leves, no el que sustituye al ordinario."
  citation: "art. 94.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-94
- id: m01-l14-q243
  prompt:
    es: "Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se suspende la tramitación del procedimiento disciplinario cuando los indicios fundados de criminalidad resultan:"
  options:
  - id: a
    text:
      es: "De la denuncia que motivó la incoación del procedimiento."
  - id: b
    text:
      es: "De la resolución por la que se incoa el procedimiento."
  - id: c
    correct: true
    text:
      es: "De la instrucción del propio procedimiento disciplinario."
  - id: d
    text:
      es: "De la resolución sancionadora del órgano competente."
  explanation:
    es: "El artículo 94.3 parte de que «de la instrucción de un procedimiento disciplinario resulte» la existencia de indicios fundados de criminalidad. La denuncia y la resolución de incoación son anteriores a la instrucción, y la resolución sancionadora es posterior a ella."
  citation: "art. 94.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1986-1216-art-30
- id: m01-l14-q244
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, nombrar Instructor a un funcionario de un cuerpo o escala de grupo inferior al del inculpado:"
  options:
  - id: a
    correct: true
    text:
      es: "Incumple el requisito de ser de un cuerpo o escala de igual o superior grupo."
  - id: b
    text:
      es: "Es válido, porque el Instructor solo debe depender del mismo Departamento que el inculpado."
  - id: c
    text:
      es: "Es válido si el inculpado no recusa al Instructor en el plazo de tres días."
  - id: d
    text:
      es: "Es válido si el Instructor cuenta con más años de servicio que el inculpado."
  explanation:
    es: "El artículo 30 exige un Instructor «de igual o superior grupo al del inculpado», así que un grupo inferior incumple el requisito. Depender del mismo Departamento no es lo que se exige: si depende de otro, basta la autorización de su Subsecretario. La falta de recusación y la antigüedad no sustituyen al grupo."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-30
- id: m01-l14-q245
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿puede ser nombrado Instructor un funcionario de un cuerpo o escala del mismo grupo que el del inculpado?"
  options:
  - id: a
    text:
      es: "No, el Instructor debe pertenecer siempre a un grupo superior al del inculpado."
  - id: b
    text:
      es: "No, salvo que el inculpado consienta expresamente ese nombramiento."
  - id: c
    text:
      es: "Sí, pero solo si depende del mismo Departamento que el inculpado."
  - id: d
    correct: true
    text:
      es: "Sí, porque el artículo exige un grupo igual o superior al del inculpado."
  explanation:
    es: "El artículo 30 admite al Instructor de «igual o superior grupo», y el mismo grupo es el caso de igualdad. No se exige un grupo estrictamente superior, ni el consentimiento del inculpado. Tampoco se limita a los funcionarios del mismo Departamento: el que depende de otro necesita la autorización del Subsecretario de éste."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-94
- id: m01-l14-q254
  prompt:
    es: "Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se suspende la tramitación de un procedimiento disciplinario cuando de su instrucción resultan indicios fundados:"
  options:
  - id: a
    text:
      es: "De responsabilidad patrimonial del funcionario expedientado."
  - id: b
    text:
      es: "De responsabilidad contable del funcionario expedientado."
  - id: c
    correct: true
    text:
      es: "De criminalidad en los hechos investigados."
  - id: d
    text:
      es: "De una falta más grave que la imputada al incoar."
  explanation:
    es: "El artículo 94.3 dice: «Cuando de la instrucción de un procedimiento disciplinario resulte la existencia de indicios fundados de criminalidad, se suspenderá su tramitación». La responsabilidad patrimonial la deja a salvo el artículo 94.1 («sin perjuicio de la responsabilidad patrimonial o penal»), sin suspender el procedimiento. El artículo 94 no menciona la responsabilidad contable, y tampoco hace de una falta más grave que la imputada una causa de suspensión."
  citation: "art. 94.3 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1986-1216-art-30
- id: m01-l14-q255
  prompt:
    es: "Un Director general acuerda incoar expediente disciplinario a un funcionario de la Administración del Estado que depende de su Dirección General. ¿Quién nombra al Instructor del procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "El propio Director general, en la resolución de incoación."
  - id: b
    text:
      es: "El Subsecretario del Departamento, en una resolución posterior."
  - id: c
    text:
      es: "El Jefe del centro o dependencia, al proponer la incoación."
  - id: d
    text:
      es: "La Dirección General de la Función Pública, a petición del Director general."
  explanation:
    es: "El artículo 30 del Real Decreto 33/1986 dice: «En la resolución por la que se incoe el procedimiento se nombrará Instructor». Si incoa el Director general, como le permite el artículo 29.1 respecto del personal de su Dirección General, el nombramiento va en su resolución. Ningún artículo da al Subsecretario el nombramiento del Instructor en un expediente que incoa otro órgano; el artículo 30 solo exige la previa autorización del Subsecretario de otro Departamento cuando el Instructor depende de él. El Jefe del centro o dependencia puede proponer la incoación (artículo 29.2), no nombrar al Instructor. La Dirección General de la Función Pública no aparece en estos artículos."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-61
- id: m01-l14-q264
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de las siguientes funciones corresponde a los Ministros, como titulares del departamento?"
  options:
  - id: a
    text:
      es: "Imponer la sanción de despido disciplinario al personal laboral por faltas graves."
  - id: b
    text:
      es: "Aprobar la oferta de empleo público estatal."
  - id: c
    text:
      es: "Aprobar los estatutos de los organismos públicos dependientes de su Ministerio."
  - id: d
    correct: true
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  explanation:
    es: "El artículo 61.s) incluye entre las funciones de los Ministros «imponer la sanción de separación del servicio por faltas muy graves». Ninguna de las otras tres figura en el artículo 61: el despido disciplinario del personal laboral no es una de sus funciones, ni lo son la aprobación de la oferta de empleo público ni la de los estatutos de los organismos públicos, que el artículo 93.2 da al Consejo de Ministros."
  citation: "art. 61.s) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l14-q265
  prompt:
    es: "De acuerdo con el artículo 61.s) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la sanción de separación del servicio que corresponde imponer a los Ministros lo es:"
  options:
  - id: a
    correct: true
    text:
      es: "por la comisión de faltas muy graves."
  - id: b
    text:
      es: "por la comisión de faltas graves o muy graves."
  - id: c
    text:
      es: "por la comisión de faltas graves reiteradas."
  - id: d
    text:
      es: "por la comisión de faltas leves acumuladas."
  explanation:
    es: "El artículo 61.s) LRJSP dice que corresponde a los Ministros «imponer la sanción de separación del servicio por faltas muy graves». Añadir las graves amplía la letra: el apartado dice solo muy graves. Las graves reiteradas y las leves acumuladas son tipos que la letra s) no contempla: la letra nombra una clase de falta, la muy grave, y no hace depender la separación de que otras faltas se repitan o se acumulen."
  citation: "art. 61.s) LRJSP"
