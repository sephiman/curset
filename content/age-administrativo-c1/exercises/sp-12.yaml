  - id: d
    correct: true
    text:
      es: "El lunes, 15 de marzo de 2027."
  explanation:
    es: "El período de prueba no es superior a treinta días ni inferior a diez (art. 77.2 LPAC), y los días son hábiles (art. 30.2 LPAC). Desde el martes 2 de febrero, y sin festivos en el periodo, el trigésimo día hábil es el lunes, 15 de marzo de 2027. La fecha del lunes 15 de febrero aplica el mínimo de diez días. La del miércoles 3 de marzo cuenta treinta días naturales. La del viernes 12 de marzo cuenta el lunes 1 de febrero como primer día."
  citation: "art. 77.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
