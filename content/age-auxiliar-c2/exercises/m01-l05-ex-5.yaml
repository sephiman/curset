# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q033
  prompt:
    es: "De acuerdo con el artículo 21.3 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno en funciones limitará su gestión:"
  options:
  - id: a
    text:
      es: "A la aprobación de Reales Decretos-leyes, absteniéndose de adoptar cualesquiera otras medidas sin autorización del Congreso."
  - id: b
    correct: true
    text:
      es: "Al despacho ordinario de los asuntos públicos, absteniéndose de adoptar otras medidas salvo urgencia debidamente acreditada o razones de interés general."
  - id: c
    text:
      es: "Al despacho ordinario de los asuntos públicos, sin excepción alguna aunque concurran razones de urgencia."
  - id: d
    text:
      es: "A los asuntos que le autorice expresamente la Diputación Permanente del Congreso de los Diputados."
  explanation:
    es: "El artículo 21.3 dice que el Gobierno en funciones limitará su gestión «al despacho ordinario de los asuntos públicos», absteniéndose de adoptar otras medidas «salvo casos de urgencia debidamente acreditados o por razones de interés general cuya acreditación expresa así lo justifique». La ley no reduce su gestión a los Reales Decretos-leyes. Sí admite excepciones por urgencia o interés general. No depende de autorizaciones de la Diputación Permanente."
  citation: "art. 21.3 Ley 50/1997"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q034
  prompt:
    es: "Según el artículo 21.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué facultad tiene vedada el Presidente del Gobierno en funciones?"
  options:
  - id: a
    text:
      es: "Convocar y presidir las reuniones del Consejo de Ministros."
  - id: b
    text:
      es: "Impartir instrucciones a los demás miembros del Gobierno."
  - id: c
    text:
      es: "Representar al Gobierno en el ejercicio de sus funciones."
  - id: d
    correct: true
    text:
      es: "Plantear la cuestión de confianza ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 21.4 dice que el Presidente del Gobierno en funciones no podrá proponer la disolución de las Cámaras, «plantear la cuestión de confianza» ni proponer un referéndum consultivo. Convocar y presidir el Consejo, impartir instrucciones y representar al Gobierno son funciones del artículo 2.2 que el artículo 21.4 no le retira."
  citation: "art. 21.4 Ley 50/1997"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-101
- id: m01-l05-q094
  prompt:
    es: "Conforme al artículo 101.1 de la Constitución Española de 1978, además de tras elecciones generales y de la pérdida de la confianza parlamentaria, el Gobierno cesa por:"
  options:
  - id: a
    text:
      es: "Dimisión o fallecimiento de cualquiera de sus Ministros."
  - id: b
    correct: true
    text:
      es: "Dimisión o fallecimiento de su Presidente."
  - id: c
    text:
      es: "Pérdida de la mayoría en el Senado."
  - id: d
    text:
      es: "Disolución de las Cortes Generales por el Rey."
  explanation:
    es: "El artículo 101.1 incluye la dimisión o el fallecimiento del Presidente. La salida de un Ministro no hace cesar a todo el Gobierno. El Gobierno responde ante el Congreso, no ante el Senado. La disolución de las Cortes no lo hace cesar, porque cesa tras las elecciones generales."
  citation: "art. 101.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q095
  prompt:
    es: "Conforme al artículo 21.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno cesa, entre otros casos, en los de pérdida de la confianza parlamentaria previstos en:"
  options:
  - id: a
    text:
      es: "La propia Ley del Gobierno."
  - id: b
    text:
      es: "El Reglamento del Congreso de los Diputados."
  - id: c
    text:
      es: "Una ley orgánica específica."
  - id: d
    correct: true
    text:
      es: "La Constitución."
  explanation:
    es: "El artículo 21.1 remite a los casos que prevé la Constitución, que son la cuestión de confianza y la moción de censura. La Ley del Gobierno, el Reglamento del Congreso y una ley orgánica no son la fuente que cita el artículo."
  citation: "art. 21.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-101
- id: m01-l05-q096
  prompt:
    es: "Cuando el Gobierno cesa tras elecciones generales, por dimisión o fallecimiento de su Presidente o por pérdida de la confianza parlamentaria, continúa en funciones hasta:"
  options:
  - id: a
    correct: true
    text:
      es: "La toma de posesión del nuevo Gobierno."
  - id: b
    text:
      es: "La investidura del nuevo Presidente."
  - id: c
    text:
      es: "La celebración de nuevas elecciones."
  - id: d
    text:
      es: "La aprobación de los Presupuestos."
  explanation:
    es: "El artículo 101.2 fija como límite la toma de posesión del nuevo Gobierno. La investidura del Presidente llega antes, y aún falta nombrar a los Ministros. Las nuevas elecciones son una causa del cese, no su fin. Los Presupuestos no tienen relación con ese plazo."
  citation: "art. 101.2 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q097
  prompt:
    es: "Conforme al artículo 21.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué facultad tiene vedada el Presidente del Gobierno en funciones?"
  options:
  - id: a
    text:
      es: "Refrendar, en su caso, los actos del Rey."
  - id: b
    text:
      es: "Resolver los conflictos de atribuciones entre los Ministerios."
  - id: c
    text:
      es: "Dirigir la política de defensa."
  - id: d
    correct: true
    text:
      es: "Proponer al Rey la disolución de alguna de las Cámaras o de las Cortes Generales."
  explanation:
    es: "El artículo 21.4.a prohíbe al Presidente en funciones proponer al Rey la disolución de alguna de las Cámaras o de las Cortes Generales. Refrendar actos del Rey, resolver conflictos entre Ministerios y dirigir la política de defensa son funciones del Presidente que el artículo no le quita."
  citation: "art. 21.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "excepción"
  - "competencia"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q098
  prompt:
    es: "Según el artículo 21.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Presidente del Gobierno en funciones no podrá ejercer la facultad de:"
  options:
  - id: a
    text:
      es: "Representar al Gobierno."
  - id: b
    text:
      es: "Establecer las directrices de la política interior y exterior."
  - id: c
    correct: true
    text:
      es: "Proponer al Rey la convocatoria de un referéndum consultivo."
  - id: d
    text:
      es: "Interponer el recurso de inconstitucionalidad."
  explanation:
    es: "El artículo 21.4.c le prohíbe proponer al Rey la convocatoria de un referéndum consultivo. Representar al Gobierno, fijar las directrices de política y recurrir ante el Tribunal Constitucional no figuran entre las facultades vedadas."
  citation: "art. 21.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "excepción"
  - "competencia"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q099
  prompt:
    es: "Conforme al artículo 21.5 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Gobierno en funciones no podrá ejercer la facultad de:"
  options:
  - id: a
    correct: true
    text:
      es: "Aprobar el Proyecto de Ley de Presupuestos Generales del Estado."
  - id: b
    text:
      es: "Despachar los asuntos públicos de carácter ordinario."
  - id: c
    text:
      es: "Adoptar medidas en casos de urgencia debidamente acreditados."
  - id: d
    text:
      es: "Adoptar medidas por razones de interés general debidamente acreditadas."
  explanation:
    es: "El artículo 21.5.a veta al Gobierno en funciones aprobar el Proyecto de Ley de Presupuestos. El despacho ordinario, y las medidas urgentes o de interés general debidamente acreditadas, son lo que el artículo 21.3 le permite."
  citation: "art. 21.5 Ley 50/1997"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1997-25336-art-21
- id: m01-l05-q100
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, las delegaciones legislativas otorgadas por las Cortes Generales quedan en suspenso mientras el Gobierno esté en funciones como consecuencia de:"
  options:
  - id: a
    text:
      es: "La dimisión del Presidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "La celebración de elecciones generales."
  - id: c
    text:
      es: "El fallecimiento del Presidente del Gobierno."
  - id: d
    text:
      es: "La aprobación de una moción de censura."
  explanation:
    es: "El artículo 21.6 limita la suspensión al caso del Gobierno en funciones por la celebración de elecciones generales. La dimisión o el fallecimiento del Presidente y la moción de censura son otras causas de cese, pero el artículo no suspende por ellas las delegaciones."
  citation: "art. 21.6 Ley 50/1997"
  difficulty: 3
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q038
  prompt:
    es: "Señale la respuesta correcta sobre las funciones y actividades que pueden ejercer los miembros del Gobierno según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Pueden ejercer una actividad profesional, siempre que no sea retribuida."
  - id: b
    text:
      es: "Pueden ejercer una función pública que no derive de su cargo, con autorización del Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "Pueden ejercer las funciones representativas propias del mandato parlamentario."
  - id: d
    text:
      es: "Pueden ejercer una actividad mercantil, previa declaración ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 98.3 dice que los miembros del Gobierno no podrán ejercer «otras funciones representativas que las propias del mandato parlamentario», así que estas sí pueden ejercerlas. El mismo apartado prohíbe «actividad profesional o mercantil alguna», sea o no retribuida y con o sin declaración. También prohíbe «cualquier otra función pública que no derive de su cargo», sin admitir autorización."
  citation: "art. 98.3 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-108
- id: m01-l05-q101
  prompt:
    es: "Según la Constitución Española de 1978, ¿de qué forma responde el Gobierno en su gestión política ante el Congreso de los Diputados?"
  options:
  - id: a
    text:
      es: "De forma individual, cada Ministro por separado."
  - id: b
    correct: true
    text:
      es: "De forma solidaria."
  - id: c
    text:
      es: "De forma subsidiaria respecto de la del Presidente."
  - id: d
    text:
      es: "De forma compartida con el Senado."
  explanation:
    es: "El artículo 108 dice que el Gobierno responde solidariamente. La responsabilidad individual de cada Ministro y la subsidiaria respecto del Presidente cambian el carácter solidario. Compartirla con el Senado añade una Cámara ante la que el Gobierno no responde."
  citation: "art. 108 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-112
- id: m01-l05-q102
  prompt:
    es: "Según el artículo 112 de la Constitución Española de 1978, el Presidente del Gobierno, previa deliberación del Consejo de Ministros, puede plantear ante el Congreso la cuestión de confianza sobre su programa o sobre:"
  options:
  - id: a
    text:
      es: "Los Presupuestos Generales del Estado."
  - id: b
    text:
      es: "La composición del Gobierno."
  - id: c
    text:
      es: "La disolución anticipada de las Cortes."
  - id: d
    correct: true
    text:
      es: "Una declaración de política general."
  explanation:
    es: "El artículo 112 admite la cuestión de confianza sobre el programa del Gobierno o sobre una declaración de política general. Los Presupuestos, la composición del Gobierno y la disolución no son los objetos que fija el artículo."
  citation: "art. 112 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q103
  prompt:
    es: "Conforme al artículo 113.2 de la Constitución Española de 1978, la moción de censura, que habrá de incluir un candidato a la Presidencia del Gobierno, deberá ser propuesta al menos por:"
  options:
  - id: a
    correct: true
    text:
      es: "La décima parte de los Diputados."
  - id: b
    text:
      es: "La quinta parte de los Diputados."
  - id: c
    text:
      es: "La cuarta parte de los Diputados."
  - id: d
    text:
      es: "La mayoría absoluta de los Diputados."
  explanation:
    es: "El artículo 113.2 exige la décima parte de los Diputados. La quinta parte y la cuarta parte son fracciones mayores que la Constitución no fija aquí. La mayoría absoluta es la que se necesita para adoptar la moción, no para proponerla."
  citation: "art. 113.2 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-114
- id: m01-l05-q104
  prompt:
    es: "De acuerdo con el artículo 114.1 de la Constitución Española de 1978, si el Congreso niega su confianza al Gobierno, este presenta su dimisión:"
  options:
  - id: a
    text:
      es: "Al Rey, procediéndose a disolver las Cortes Generales."
  - id: b
    text:
      es: "Al Presidente del Congreso, que propone un nuevo Gobierno."
  - id: c
    correct: true
    text:
      es: "Al Rey, procediéndose a designar Presidente del Gobierno."
  - id: d
    text:
      es: "Al Consejo de Estado, que designa un Gobierno provisional."
  explanation:
    es: "El artículo 114.1 dice que el Gobierno presenta su dimisión al Rey y se procede a designar Presidente según el artículo 99. La disolución de las Cortes no es la consecuencia inmediata. El Presidente del Congreso y el Consejo de Estado no reciben la dimisión."
  citation: "art. 114.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1978-31229-art-114
- id: m01-l05-q105
  prompt:
    es: "Señale la afirmación correcta sobre el candidato incluido en una moción de censura adoptada por el Congreso, según el artículo 114.2 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Debe someterse a una votación ordinaria de investidura."
  - id: b
    text:
      es: "Se entiende investido, pero necesita la ratificación del Senado."
  - id: c
    text:
      es: "Es nombrado Presidente por el Congreso, sin intervención del Rey."
  - id: d
    correct: true
    text:
      es: "Se entiende investido de la confianza de la Cámara, y el Rey le nombra Presidente."
  explanation:
    es: "El artículo 114.2 dice que el candidato se entiende investido de la confianza de la Cámara y el Rey le nombra Presidente. No se repite la investidura, el Senado no interviene y el nombramiento lo hace el Rey."
  citation: "art. 114.2 CE"
  difficulty: 3
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q106
  prompt:
    es: "¿Cuál de las siguientes Salas del Tribunal Supremo juzga la responsabilidad criminal del Presidente y de los demás miembros del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Sala de lo Penal."
  - id: b
    text:
      es: "Sala de lo Civil."
  - id: c
    text:
      es: "Sala de lo Contencioso-Administrativo."
  - id: d
    text:
      es: "Sala de lo Social."
  explanation:
    es: "El artículo 102.1 atribuye la responsabilidad criminal a la Sala de lo Penal del Tribunal Supremo. Las Salas de lo Civil, de lo Contencioso-Administrativo y de lo Social existen, pero juzgan otras materias."
  citation: "art. 102.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q107
  prompt:
    es: "Según el artículo 102.2 de la Constitución Española de 1978, la acusación contra miembros del Gobierno exige la iniciativa de una parte del Congreso y su aprobación por mayoría absoluta si fuere por:"
  options:
  - id: a
    text:
      es: "Prevaricación o cualquier delito contra la Administración pública."
  - id: b
    correct: true
    text:
      es: "Traición o cualquier delito contra la seguridad del Estado en el ejercicio de sus funciones."
  - id: c
    text:
      es: "Malversación o cualquier delito contra la Hacienda Pública."
  - id: d
    text:
      es: "Cualquier delito cometido durante el mandato."
  explanation:
    es: "El artículo 102.2 reserva ese procedimiento reforzado a la acusación por traición o por cualquier delito contra la seguridad del Estado en el ejercicio de las funciones. Los demás delitos, y los cometidos durante el mandato en general, no siguen esa regla."
  citation: "art. 102.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q108
  prompt:
    es: "Conforme al artículo 102.2 de la Constitución Española de 1978, la acusación por traición o por delito contra la seguridad del Estado, con la aprobación de la mayoría absoluta del Congreso, solo podrá plantearse por iniciativa de:"
  options:
  - id: a
    text:
      es: "La tercera parte de los miembros del Congreso."
  - id: b
    text:
      es: "La décima parte de los miembros del Congreso."
  - id: c
    correct: true
    text:
      es: "La cuarta parte de los miembros del Congreso."
  - id: d
    text:
      es: "La mitad de los miembros del Congreso."
  explanation:
    es: "El artículo 102.2 exige la iniciativa de la cuarta parte de los miembros del Congreso. La décima parte es la fracción que exige la moción de censura, según el artículo 113.2. La tercera parte y la mitad son fracciones mayores que el artículo no fija."
  citation: "art. 102.2 CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-102
- id: m01-l05-q109
  prompt:
    es: "Señale la afirmación correcta sobre la prerrogativa real de gracia, según el artículo 102.3 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "No será aplicable a ninguno de los supuestos de responsabilidad criminal del artículo."
  - id: b
    text:
      es: "Solo será aplicable a los delitos distintos de la traición."
  - id: c
    text:
      es: "Será aplicable previo informe favorable del Congreso de los Diputados."
  - id: d
    text:
      es: "Será aplicable con el refrendo del Presidente del Congreso."
  explanation:
    es: "El artículo 102.3 excluye la prerrogativa real de gracia de todos los supuestos del artículo. Salvar los delitos distintos de la traición, o supeditarla a un informe del Congreso o a un refrendo, la dejaría aplicable."
  citation: "art. 102.3 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q110
  prompt:
    es: "Conforme al artículo 98.3 de la Constitución Española de 1978, los miembros del Gobierno no podrán ejercer otras funciones representativas que las del mandato parlamentario, ni otra función pública que no derive de su cargo, ni:"
  options:
  - id: a
    text:
      es: "Actividad mercantil, aunque sí profesional."
  - id: b
    text:
      es: "Actividad profesional, aunque sí mercantil."
  - id: c
    correct: true
    text:
      es: "Actividad profesional o mercantil alguna."
  - id: d
    text:
      es: "Actividad profesional o mercantil sin autorización del Consejo de Ministros."
  explanation:
    es: "El artículo 98.3 prohíbe toda actividad profesional o mercantil. Permitir una de las dos, o condicionarlas a la autorización del Consejo de Ministros, rebaja una prohibición que el artículo formula sin excepciones."
  citation: "art. 98.3 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-112
- id: m01-l05-q039
  prompt:
    es: "¿Cuándo se entiende otorgada la confianza que el Presidente del Gobierno solicita al plantear una cuestión de confianza ante el Congreso?"
  options:
  - id: a
    text:
      es: "Cuando vota a favor de la misma la mayoría absoluta de los Diputados."
  - id: b
    text:
      es: "Cuando vota a favor de la misma la mayoría de tres quintos de los Diputados."
  - id: c
    text:
      es: "Cuando no vota en contra de la misma la mayoría absoluta de los Diputados."
  - id: d
    correct: true
    text:
      es: "Cuando vota a favor de la misma la mayoría simple de los Diputados."
  explanation:
    es: "El artículo 112 dice: «La confianza se entenderá otorgada cuando vote a favor de la misma la mayoría simple de los Diputados». La mayoría absoluta es la de la moción de censura (art. 113.1) y la de la primera votación de investidura (art. 99.3). Los tres quintos no se exigen aquí. No basta con que la mayoría absoluta no vote en contra: hacen falta más votos a favor que en contra."
  citation: "art. 112 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q040
  prompt:
    es: "Según el artículo 113.1 de la Constitución Española de 1978, ¿por qué mayoría puede el Congreso de los Diputados adoptar la moción de censura para exigir la responsabilidad política del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría absoluta del Congreso de los Diputados."
  - id: b
    text:
      es: "Por mayoría simple del Congreso de los Diputados."
  - id: c
    text:
      es: "Por mayoría de tres quintos del Congreso de los Diputados."
  - id: d
    text:
      es: "Por mayoría absoluta del Congreso y ratificación del Senado."
  explanation:
    es: "El artículo 113.1 dice que el Congreso puede exigir la responsabilidad política del Gobierno «mediante la adopción por mayoría absoluta de la moción de censura». La mayoría simple es la de la cuestión de confianza (art. 112). Los tres quintos no se exigen. El Senado no interviene en la moción de censura."
  citation: "art. 113.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
