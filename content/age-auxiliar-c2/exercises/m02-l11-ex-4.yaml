# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m02-l11-q125
  prompt:
    es: "En Outlook 365 clásico, ¿qué consecuencia señala la ayuda de activar la casilla Eliminar permanentemente los mensajes sospechosos de ser correo no deseado?"
  options:
  - id: a
    text:
      es: "Solo se eliminan los mensajes de los remitentes de la lista segura"
  - id: b
    correct: true
    text:
      es: "Se pierde la opción de revisar los mensajes en busca de falsos positivos"
  - id: c
    text:
      es: "Los mensajes sospechosos pasan a Elementos eliminados para revisarlos"
  - id: d
    text:
      es: "Los mensajes sospechosos se mueven a Correo no deseado para revisarlos"
  explanation:
    es: "La casilla elimina los mensajes sospechosos en lugar de moverlos a Correo no deseado, y por eso se pierde la capacidad de revisar posibles falsos positivos. Moverlos a Correo no deseado es lo que se hace sin activarla. Pasar a Elementos eliminados para revisarlos contradice que se eliminen permanentemente. Eliminar los de la lista segura contradice que se eliminen los sospechosos de ser correo no deseado."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Solo tienes que eliminarlos.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-correo-no-deseado-html
- id: m02-l11-q126
  prompt:
    es: "En Outlook 365 clásico, ¿qué hace el filtro de correo no deseado con los mensajes que identifica como probablemente no deseados?"
  options:
  - id: a
    text:
      es: "Los elimina permanentemente de forma automática"
  - id: b
    text:
      es: "Los mueve a la carpeta Elementos eliminados"
  - id: c
    text:
      es: "Los mueve a la carpeta Archivo"
  - id: d
    correct: true
    text:
      es: "Los mueve a la carpeta Correo no deseado"
  explanation:
    es: "El filtro identifica los mensajes que probablemente son correo no deseado y los mueve a la carpeta Correo no deseado. Eliminarlos de forma automática contradice que el filtro los mueva, y la ayuda presenta eliminarlos como una opción distinta. Moverlos a Elementos eliminados o a Archivo contradice que el destino sea Correo no deseado."
  citation: "fuente: `ms-outlook-correo-no-deseado.html`; «Correo no deseado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q127
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de los siguientes métodos abreviados de teclado establece las opciones de correo no deseado?"
  options:
  - id: a
    text:
      es: "Alt+H, M, V"
  - id: b
    text:
      es: "Alt+H, F, W"
  - id: c
    correct: true
    text:
      es: "Alt+H, J, O"
  - id: d
    text:
      es: "Alt+H, R, A"
  explanation:
    es: "Alt+H, J, O establece las opciones de correo no deseado. Alt+H, R, A selecciona Responder a todos. Alt+H, F, W reenvía un mensaje. Alt+H, M, V mueve un elemento a una carpeta de la lista."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de correo en la versión clásica de Outlook»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q183
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que muestra el Asistente para programación al organizar una reunión con varios asistentes?"
  options:
  - id: a
    text:
      es: "Los calendarios de los asistentes superpuestos, uno encima de otro."
  - id: b
    correct: true
    text:
      es: "La disponibilidad de los asistentes, para elegir una hora libre."
  - id: c
    text:
      es: "Las salas de conferencias de un edificio filtradas por tipo y capacidad."
  - id: d
    text:
      es: "El estado de aceptación de cada invitado a la convocatoria."
  explanation:
    es: "El Asistente para programación muestra una fila por cada destinatario con las horas en que está ocupado, y así se elige una hora disponible para todos. Las salas filtradas por tipo y capacidad son del Buscador de salas. El estado de aceptación se sigue abriendo la solicitud enviada, como organizador. Los calendarios superpuestos son la vista superpuesta del Calendario, que sirve para ver conflictos propios."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q184
  prompt:
    es: "¿Cuál de los siguientes botones del Asistente para programación de Outlook 365 clásico busca la disponibilidad de personas y salas con los criterios que se elijan?"
  options:
  - id: a
    text:
      es: "Buscador de salas"
  - id: b
    text:
      es: "Horas sugeridas"
  - id: c
    correct: true
    text:
      es: "Autoseleccionar"
  - id: d
    text:
      es: "Periodicidad"
  explanation:
    es: "Se selecciona Asistente para programación en la cinta y después Autoseleccionar, para elegir los criterios. El Buscador de salas sirve para examinar edificios y salas desde el campo Ubicación. Periodicidad, en el grupo Opciones del menú Reunión, fija el patrón de repetición. Horas sugeridas es la característica de versiones anteriores que el Asistente para programación reemplaza."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación y el Buscador de salas para las reuniones en Outlook»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q185
  prompt:
    es: "En el Asistente para programación de Outlook 365 clásico, ¿cuál de las siguientes opciones indica cómo se muestran las horas en las que los asistentes están ocupados?"
  options:
  - id: a
    text:
      es: "En gris claro"
  - id: b
    text:
      es: "En blanco con borde azul"
  - id: c
    text:
      es: "En azul claro con trama"
  - id: d
    correct: true
    text:
      es: "En azul oscuro"
  explanation:
    es: "Las horas ocupadas salen en azul oscuro. El azul claro con trama (hash) marca las citas provisionales. El gris claro marca las horas fuera del horario de trabajo de los asistentes. El blanco con borde azul no es ninguno de los tres códigos de color que da la página, que reserva el azul oscuro para las horas ocupadas."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q186
  prompt:
    es: "En el Asistente para programación de Outlook 365 clásico, ¿cuál de las siguientes opciones indica lo que significa un bloque en azul claro con trama?"
  options:
  - id: a
    text:
      es: "Que el asistente ya ha rechazado la reunión para esa hora."
  - id: b
    correct: true
    text:
      es: "Que el asistente tiene una cita provisional en esa hora."
  - id: c
    text:
      es: "Que el asistente está ocupado en esa hora."
  - id: d
    text:
      es: "Que esa hora queda fuera del horario de trabajo del asistente."
  explanation:
    es: "El bloque azul claro con trama (hash) indica una cita provisional. Ocupado se muestra en azul oscuro. Fuera del horario de trabajo se muestra en gris claro. La página no da ningún color para un rechazo: sus tres códigos son ocupado, provisional y fuera de las horas de trabajo."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q187
  prompt:
    es: "¿Cuál de los siguientes métodos abreviados de teclado crea una convocatoria de reunión en Outlook 365 clásico configurado en español?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+A"
  - id: b
    text:
      es: "Ctrl+Mayús+L"
  - id: c
    text:
      es: "Ctrl+Mayús+M"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+Q"
  explanation:
    es: "Ctrl+Mayús+Q crea una nueva convocatoria de reunión. Ctrl+Mayús+A crea una cita, que no invita a nadie. Ctrl+Mayús+M crea un mensaje desde cualquier vista. Ctrl+Mayús+L crea un grupo de contactos."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q188
  prompt:
    es: "En Outlook 365, ¿quién configura las salas de conferencias y las listas de tipo, capacidad y piso que muestra el Buscador de salas?"
  options:
  - id: a
    text:
      es: "El usuario, desde Archivo › Opciones"
  - id: b
    text:
      es: "Cada asistente, desde su propio calendario"
  - id: c
    correct: true
    text:
      es: "El administrador de Exchange o de Microsoft 365"
  - id: d
    text:
      es: "El organizador de la reunión, al crear la convocatoria"
  explanation:
    es: "Las salas y las listas por tipo, capacidad, piso y características las configura el administrador de Microsoft Exchange o de Microsoft 365. El organizador solo elige una sala disponible para agregarla a la reunión como destinatario. Los asistentes no intervienen: cada uno aparece como una fila del asistente. En Archivo › Opciones no hay ajuste de salas que la página mencione."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Buscador de salas»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q189
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica dónde está el botón Buscador de salas en una nueva reunión?"
  options:
  - id: a
    correct: true
    text:
      es: "A la derecha del campo Ubicación"
  - id: b
    text:
      es: "A la derecha del campo Asunto"
  - id: c
    text:
      es: "Al final del campo Para"
  - id: d
    text:
      es: "En el grupo Etiquetas de la pestaña Mensaje"
  explanation:
    es: "El botón Buscador de salas está a la derecha del campo Ubicación. El campo Para recoge los asistentes obligatorios. En el campo Asunto se escribe la descripción de la reunión. El grupo Etiquetas de la pestaña Mensaje contiene la flecha Opciones de mensaje, que sirve para retrasar la entrega de un mensaje."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Buscador de salas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-asistente-programacion-html
- id: m02-l11-q190
  prompt:
    es: "¿Cuál de los siguientes comandos del grupo Opciones del menú Reunión de Outlook 365 clásico se selecciona para que una reunión sea periódica?"
  options:
  - id: a
    text:
      es: "Autoseleccionar"
  - id: b
    text:
      es: "Buscador de salas"
  - id: c
    correct: true
    text:
      es: "Periodicidad"
  - id: d
    text:
      es: "Asistente para programación"
  explanation:
    es: "En el menú Reunión, grupo Opciones, se selecciona Periodicidad y se elige el patrón; el menú pasa entonces a llamarse Reunión periódica. Autoseleccionar busca la disponibilidad de personas y salas. El Buscador de salas lista las salas de un edificio. El Asistente para programación muestra las horas ocupadas de cada asistente. Ninguno de los tres fija un patrón de repetición."
  citation: "fuente: `ms-outlook-asistente-programacion.html`; «Usar el Asistente para programación»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-calendario-html
- id: m02-l11-q191
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que permite hacer el vínculo con un sitio de SharePoint al que se tiene acceso?"
  options:
  - id: a
    text:
      es: "Ver sus listas de eventos solo después de enviarlas como Calendario de Internet."
  - id: b
    correct: true
    text:
      es: "Ver sus listas de eventos en el Calendario y cambiarlas aunque no haya conexión."
  - id: c
    text:
      es: "Ver sus listas de eventos solo en el navegador, sin poder cambiarlas desde Outlook."
  - id: d
    text:
      es: "Cambiar sus listas de eventos únicamente mientras Outlook está conectado a Internet."
  explanation:
    es: "Con acceso a un sitio de SharePoint se ven sus listas de eventos en el Calendario de Outlook y se pueden cambiar incluso sin conexión; los cambios se sincronizan al volver a conectarse. Verlas solo en el navegador contradice la página, que las muestra en Outlook y deja cambiarlas. Exigir conexión para cambiarlas también: la página dice que se pueden cambiar sin conexión. Enviarlas como Calendario de Internet es otra función, la de mandar el calendario por correo."
  citation: "fuente: `ms-outlook-calendario.html`; «Vincular a calendarios en sitios de Microsoft SharePoint»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-calendario-html
- id: m02-l11-q192
  prompt:
    es: "En el Calendario de Outlook 365 clásico, ¿cuál de las siguientes vistas muestra varios calendarios uno encima de otro, para ver rápidamente conflictos o tiempo libre?"
  options:
  - id: a
    text:
      es: "La suscripción a Calendarios de Internet"
  - id: b
    correct: true
    text:
      es: "La vista superpuesta"
  - id: c
    text:
      es: "La vista en paralelo"
  - id: d
    text:
      es: "La vista de programaciones de grupo"
  explanation:
    es: "La vista superpuesta muestra varios calendarios, propios y compartidos, uno encima de otro para detectar conflictos o tiempo libre. La vista en paralelo los muestra uno al lado de otro. Las programaciones de grupo son calendarios que reúnen las agendas de varias personas o recursos. Las suscripciones a Calendarios de Internet descargan un calendario y lo sincronizan periódicamente, sin superponerlo."
  citation: "fuente: `ms-outlook-calendario.html`; «Ver calendarios uno encima de otro en la vista de superposición»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-calendario-html
- id: m02-l11-q193
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que ocurre si una convocatoria de reunión entra en conflicto con un elemento del Calendario de un invitado?"
  options:
  - id: a
    text:
      es: "Outlook rechaza la convocatoria automáticamente."
  - id: b
    text:
      es: "Outlook acepta la convocatoria de forma provisional."
  - id: c
    correct: true
    text:
      es: "Outlook muestra una notificación al invitado."
  - id: d
    text:
      es: "Outlook propone al organizador una hora alternativa sin intervención del invitado."
  explanation:
    es: "Si la solicitud entra en conflicto con un elemento del Calendario del invitado, Outlook muestra una notificación. Rechazarla o aceptarla provisionalmente lo decide el invitado con un solo botón, no Outlook. La hora alternativa solo la proponen los invitados si el organizador lo permite, y no se propone sola."
  citation: "fuente: `ms-outlook-calendario.html`; «Organizar reuniones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-calendario-html
- id: m02-l11-q194
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica cómo pueden responder los invitados a una convocatoria de reunión recibida en la Bandeja de entrada?"
  options:
  - id: a
    text:
      es: "Solo responder con un mensaje, sin botones de respuesta."
  - id: b
    correct: true
    text:
      es: "Aceptarla, aceptarla provisionalmente o rechazarla, con un botón."
  - id: c
    text:
      es: "Aceptarla, rechazarla o delegarla en otra persona."
  - id: d
    text:
      es: "Aceptarla o rechazarla únicamente, sin la opción de aceptación provisional."
  explanation:
    es: "Al abrir la solicitud, los invitados pueden aceptar, aceptar provisionalmente o rechazar la reunión seleccionando un solo botón. Quitar la opción provisional contradice la página. Delegar es otra característica, la de Delegar el acceso, con la que una persona administra el calendario de otra. Responder solo con un mensaje no es lo que describe la página: usa botones."
  citation: "fuente: `ms-outlook-calendario.html`; «Organizar reuniones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-calendario-html
- id: m02-l11-q195
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes características permite que un asistente administrativo cree, mueva o elimine citas y organice reuniones en nombre de un administrador?"
  options:
  - id: a
    text:
      es: "Suscribirse a un Calendario de Internet"
  - id: b
    text:
      es: "Enviar el calendario como Calendario de Internet"
  - id: c
    text:
      es: "Ver programaciones de grupo"
  - id: d
    correct: true
    text:
      es: "Delegar el acceso"
  explanation:
    es: "Con Delegar el acceso, el administrador designa al asistente como delegado y este actúa en su nombre. Enviar el calendario como Calendario de Internet manda la información como datos adjuntos que el destinatario abre en Outlook, sin poder editar. Suscribirse a un Calendario de Internet descarga un calendario que se sincroniza periódicamente. Las programaciones de grupo solo muestran las agendas de varias personas o recursos."
  citation: "fuente: `ms-outlook-calendario.html`; «Administrar el calendario de otro usuario»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-leido-html
- id: m02-l11-q196
  prompt:
    es: "¿Cuál de los siguientes métodos abreviados de teclado marca un mensaje como leído en Outlook 365 clásico configurado en español?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+G"
  - id: b
    text:
      es: "Ctrl+Mayús+D"
  - id: c
    correct: true
    text:
      es: "Ctrl+Q"
  - id: d
    text:
      es: "Ctrl+Alt+F"
  explanation:
    es: "Ctrl+Q marca el mensaje como leído. Ctrl+Mayús+G abre el cuadro para marcar un mensaje para seguimiento. Ctrl+Mayús+D elimina o ignora una conversación. Ctrl+Alt+F reenvía un mensaje como archivo adjunto."
  citation: "fuente: `ms-outlook-leido.html`; «Marca un mensaje como leído o no leído en Outlook para mí.»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-leido-html
- id: m02-l11-q197
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se marcan como leídos todos los mensajes de una carpeta?"
  options:
  - id: a
    text:
      es: "Se seleccionan varias carpetas a la vez y, con el botón derecho, Marcar como leído."
  - id: b
    correct: true
    text:
      es: "Se selecciona la carpeta, Ctrl+A en la lista de mensajes y Marcar como leído con el botón derecho."
  - id: c
    text:
      es: "Se selecciona la carpeta, Ctrl+A en el panel de carpetas y Marcar como leído con el botón derecho."
  - id: d
    text:
      es: "Se vacía Elementos eliminados con Limpieza de buzón y se vuelve a la carpeta."
  explanation:
    es: "Se selecciona una carpeta, se pulsa Ctrl+A en la lista de mensajes y se elige Marcar como leído con el botón derecho. Seleccionar varias carpetas no vale: la página indica que se selecciona solo una a la vez. Ctrl+A se pulsa en la lista de mensajes, no en el panel de carpetas. Limpieza de buzón muestra el tamaño del buzón y vacía Elementos eliminados, pero no cambia el estado de lectura."
  citation: "fuente: `ms-outlook-leido.html`; «Marcar todos los mensajes de una carpeta como leídos o no leídos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-leido-html
- id: m02-l11-q198
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica cuándo marca Outlook un mensaje como leído con la configuración predeterminada?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando se selecciona el mensaje."
  - id: b
    text:
      es: "Solo cuando se abre con doble clic en una ventana independiente."
  - id: c
    text:
      es: "Siempre tras esperar 30 segundos fijos, sin posibilidad de cambiarlos."
  - id: d
    text:
      es: "Cuando se responde al mensaje."
  explanation:
    es: "Outlook marca un mensaje como leído cuando se selecciona. Responder no es necesario. La apertura con doble clic tampoco: basta seleccionarlo. Los 30 segundos son solo un ejemplo del tiempo de espera que se puede configurar con la casilla Esperar _ segundos, no un valor fijo."
  citation: "fuente: `ms-outlook-leido.html`; «Cambiar cómo y cuándo se marcan los mensajes como leídos»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q199
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que ocurre al elegir Desactivado en Vista › Diseño › Panel de lectura?"
  options:
  - id: a
    text:
      es: "Se mueve el panel de lectura a la parte inferior de la ventana."
  - id: b
    text:
      es: "Se cierra el panel de lectura solo para el mensaje seleccionado."
  - id: c
    text:
      es: "Se cierra el panel de lectura en todas las carpetas de correo."
  - id: d
    correct: true
    text:
      es: "Se cierra el panel solo en la carpeta en la que se está."
  explanation:
    es: "Desactivado cierra el panel de lectura solo para la carpeta en la que se encuentra el usuario. Cerrarlo en todas las carpetas exige el comando Aplicar la vista actual a otras carpetas de correo. No es una opción por mensaje: depende de la carpeta. Moverlo abajo lo hace la opción Abajo, no Desactivado."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Desactivar o mover el panel de lectura en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q200
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas desactiva rápidamente el panel de lectura en varias carpetas de correo?"
  options:
  - id: a
    text:
      es: "Vista › Configuración de conversación"
  - id: b
    text:
      es: "Inicio › Eliminar › Limpiar carpeta"
  - id: c
    correct: true
    text:
      es: "Vista › Cambiar vista › Aplicar la vista actual a otras carpetas de correo"
  - id: d
    text:
      es: "Vista › Diseño › Panel de lectura › Opciones"
  explanation:
    es: "Para varias carpetas se usa Vista › Cambiar vista › Aplicar la vista actual a otras carpetas de correo y se eligen carpetas en el cuadro Aplicar vista. Panel de lectura › Opciones contiene casillas como Marcar elementos como leídos o Vista previa siempre. Configuración de conversación ofrece opciones de la vista de conversación. Limpiar carpeta elimina mensajes redundantes de una carpeta."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Desactivar o mover el panel de lectura en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q201
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones de Panel de lectura hace que el mensaje seleccionado llene el espacio disponible de la ventana?"
  options:
  - id: a
    text:
      es: "Solo elemento emergente"
  - id: b
    text:
      es: "Mostrar en la parte inferior"
  - id: c
    correct: true
    text:
      es: "Rellenar pantalla"
  - id: d
    text:
      es: "Mostrar a la derecha"
  explanation:
    es: "Rellenar pantalla hace que el correo seleccionado llene el espacio de la ventana. Solo elemento emergente desactiva el panel y abre los mensajes en una ventana independiente. Mostrar a la derecha y Mostrar en la parte inferior solo cambian el diseño del panel, que sigue visible junto a la lista de mensajes."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Desactivar o personalizar el panel de lectura en el nuevo Outlook»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q202
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que ocurre al activar la casilla Vista previa siempre de los mensajes?"
  options:
  - id: a
    text:
      es: "Cada mensaje seleccionado se abre en una ventana de mensaje independiente."
  - id: b
    correct: true
    text:
      es: "Al cambiar de carpeta se muestra el mensaje más reciente en el panel."
  - id: c
    text:
      es: "Los mensajes se marcan como leídos tras esperar unos segundos."
  - id: d
    text:
      es: "Se muestran de una a tres líneas de cada mensaje en la lista de mensajes."
  explanation:
    es: "Con Vista previa siempre de los mensajes activada, al navegar a otra carpeta se muestra el mensaje más reciente en el panel de lectura; está desactivada de forma predeterminada. Las líneas de cada mensaje en la lista son la Vista previa del mensaje, otro comando de la pestaña Ver. Abrir mensajes en ventana independiente no tiene que ver con el panel. Marcar como leído tras unos segundos lo gestiona la casilla Marcar elementos como leídos cuando se visualicen en el panel de lectura."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Vista previa de mensajes siempre al cambiar de carpeta en Outlook clásico»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q203
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que hace la barra espaciadora en el panel de lectura con la lectura de una sola tecla activada?"
  options:
  - id: a
    text:
      es: "Marca el mensaje como leído y pasa directamente al siguiente mensaje de la lista."
  - id: b
    text:
      es: "Abre el mensaje seleccionado en una ventana independiente para leerlo con más espacio."
  - id: c
    text:
      es: "Divide la ventana del mensaje en dos paneles horizontales para desplazarlos por separado."
  - id: d
    correct: true
    text:
      es: "Desplaza el contenido una página y, al final, muestra el siguiente no leído."
  explanation:
    es: "Con la lectura de una sola tecla, cada pulsación de la barra espaciadora desplaza el contenido una página hacia abajo, y al final aparece el siguiente elemento no leído; está activada de forma predeterminada. Marcar como leído al pasar de mensaje no lo hace la barra espaciadora. Abrir en ventana independiente se hace con doble clic. Dividir la ventana horizontalmente es una acción de un mensaje abierto, con su propio método abreviado."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Desplazarse por los mensajes presionando la barra espaciadora (lectura de una sola tecla) en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q204
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe el efecto del zoom aplicado en el panel de lectura con el control inferior o con CTRL y la rueda del ratón?"
  options:
  - id: a
    text:
      es: "Afecta a todos los mensajes de la carpeta hasta cerrar Outlook."
  - id: b
    correct: true
    text:
      es: "Afecta solo al elemento actual; al cambiar de elemento o carpeta vuelve al 100 %."
  - id: c
    text:
      es: "Se guarda como zoom predeterminado para todos los mensajes del panel de lectura."
  - id: d
    text:
      es: "Se mantiene en el valor elegido al cambiar de carpeta, pero no al cambiar de mensaje."
  explanation:
    es: "El zoom temporal afecta solo al elemento actual del panel de lectura, y al seleccionar otro elemento o carpeta vuelve al 100 por ciento. El zoom permanente se fija abriendo un mensaje en su propia ventana, con el icono de Zoom y Recordar mis preferencias, no con el control inferior ni con la rueda. Afectar a toda la carpeta hasta cerrar Outlook contradice la nota. Mantenerse al cambiar de carpeta tampoco: la nota dice que vuelve al 100 % al cambiar de carpeta."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Aumentar o reducir el tamaño de los elementos de vista previa en el panel de lectura de Outlook clásico»"
  difficulty: 3
  tags:
  - "comportamiento"
