      es: "Detener el procesamiento de más reglas"
  - id: d
    text:
      es: "Incluir subcarpetas"
  explanation:
    es: "La casilla Detener el procesamiento de más reglas evita que se ejecute otra regla después. Ejecutar esta nueva regla ahora es una casilla de Outlook clásico para usar la regla de inmediato. Incluir subcarpetas pertenece a Ejecutar reglas ahora. Activar esta regla es la casilla del asistente de reglas de Outlook clásico para crear una regla de retraso."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
