# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q128
  prompt:
    es: "En Windows 11, desde la versión 22H2, ¿con qué nombre se conoce la página en la que se abre por defecto el Explorador de archivos, antes llamada Acceso rápido?"
  options:
  - id: a
    correct: true
    text:
      es: "Inicio"
  - id: b
    text:
      es: "Este equipo"
  - id: c
    text:
      es: "Escritorio"
  - id: d
    text:
      es: "Documentos"
  explanation:
    es: "La página dice que el Explorador se abre por defecto en Acceso rápido, cuyo nombre se ha cambiado a Inicio del Explorador de archivos en Windows 11, versión 22H2. Este equipo es otra ubicación en la que se puede configurar la apertura, y Escritorio y Documentos son dos de las carpetas conocidas ancladas."
  citation: "fuente: `ms-win-explorador.html`; «De forma predeterminada, el Explorador de archivos se abre en Acceso rápido, cuyo nombre se ha cambiado a Inicio del Explorador de archivos en Windows 11, versión 22H2.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q129
  prompt:
    es: "En Windows 11, desde la versión 22H2, ¿cuál de los siguientes grupos de carpetas conocidas está anclado de forma predeterminada en Acceso rápido?"
  options:
  - id: a
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Red"
  - id: b
    text:
      es: "Documentos, Descargas, Imágenes, Música, Vídeos y Papelera de reciclaje"
  - id: c
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes y Música, sin Vídeos"
  - id: d
    correct: true
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos"
  explanation:
    es: "La página dice que, desde Windows 11 22H2, las carpetas conocidas «(escritorio, documentos, descargas, imágenes, música y vídeos)» están ancladas de forma predeterminada en Acceso rápido, y que son seis. La lista con Red en lugar de Vídeos cambia una de esas seis por una carpeta que la página no incluye. La que sustituye Escritorio por Papelera de reciclaje hace lo mismo. Y la de cinco carpetas sin Vídeos contradice que la página cuente seis y nombre Vídeos entre ellas."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q130
  prompt:
    es: "¿Qué muestra la vista Este equipo del Explorador de archivos de Windows 11 desde la versión 22H2, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Las seis carpetas conocidas de Windows ancladas de forma predeterminada en el equipo"
  - id: b
    text:
      es: "Los archivos de Office.com recientes y favoritos del usuario"
  - id: c
    correct: true
    text:
      es: "Las unidades y las ubicaciones de red del equipo, sin las carpetas conocidas"
  - id: d
    text:
      es: "Las carpetas del usuario con los archivos más recientes"
  explanation:
    es: "La página dice que las carpetas predeterminadas ya no se muestran en Este equipo, para mantener la vista centrada en las unidades y las ubicaciones de red del equipo. Las carpetas conocidas ancladas están en Acceso rápido y los archivos de Office.com recientes y favoritos se ven en Inicio del Explorador."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q131
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes opciones del menú contextual de una carpeta la ancla a Acceso rápido?"
  options:
  - id: a
    text:
      es: "Anclar a Inicio"
  - id: b
    correct: true
    text:
      es: "Anclar a acceso rápido"
  - id: c
    text:
      es: "Anclar a la barra de tareas"
  - id: d
    text:
      es: "Mostrar más opciones"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en la carpeta y se selecciona Anclar a acceso rápido. Anclar a Inicio coloca la carpeta en el menú Inicio, Anclar a la barra de tareas es la opción de las aplicaciones y Mostrar más opciones abre el menú contextual anterior de Windows 10."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 1
  tags:
  - "ofimática-menú"
