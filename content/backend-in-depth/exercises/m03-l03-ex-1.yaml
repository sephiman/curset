- id: m03-l03-q06
  prompt:
    en: In Java 25, this snippet creates a `Semaphore` with two permits, calls `tryAcquire()` three times, then
      calls `release()` once. What does the program print?
  options:
  - id: a
    text:
      en: 'available=3

        first=true

        second=true

        third=true

        after release available=1'
  - id: b
    text:
      en: 'available=2

        first=true

        second=true

        third=true

        after release available=3'
  - id: c
    text:
      en: 'available=2

        first=true

        second=true

        third=false

        after release available=2'
  - id: d
    correct: true
    text:
      en: 'available=2

        first=true

        second=true

        third=false

        after release available=1'
  explanation:
    en: The first two `tryAcquire()` calls take the two permits, so the third returns `false`, and `release()` then
      leaves one permit available. The output starting with `available=3` is wrong because the semaphore is created
      with two permits. The output where all three calls print `true` is wrong because each successful `tryAcquire()`
      takes a permit. The output ending in `available=2` is wrong because `release()` adds one permit to the zero
      that remain instead of restoring the initial count.
  citation: javadoc-semaphore#class-semaphore
  snippet: m03-l03/SemaphoreLimit.java
- id: m03-l03-q07
  prompt:
    en: In Java 25, this snippet binds a `ScopedValue` with `ScopedValue.where(NAME, "duke").run(...)`, rebinds
      it in a nested `run`, and binds it again in a second thread. What does it print?
  options:
  - id: a
    text:
      en: 'before bound=false

        inside bound=true value=duke

        rebound bound=true value=nested

        after-rebound bound=true value=nested

        after bound=false

        other thread bound=true value=duke2

        main thread bound=true value=duke1'
  - id: b
    text:
      en: 'before bound=false

        inside bound=true value=duke

        rebound bound=true value=nested

        after-rebound bound=true value=duke

        after bound=true value=duke

        other thread bound=true value=duke2

        main thread bound=true value=duke1'
  - id: c
    correct: true
    text:
      en: 'before bound=false

        inside bound=true value=duke

        rebound bound=true value=nested

        after-rebound bound=true value=duke

        after bound=false

        other thread bound=true value=duke2

        main thread bound=true value=duke1'
  - id: d
    text:
      en: 'before bound=false

        inside bound=true value=duke

        rebound bound=true value=nested

        after-rebound bound=true value=duke

        after bound=false

        other thread bound=true value=duke2

        main thread bound=true value=duke2'
  explanation:
    en: A `ScopedValue` is bound only while the `run` executes, a nested `run` rebinds it only for its own duration,
