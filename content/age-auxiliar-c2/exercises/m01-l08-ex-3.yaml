      es: "Ministros suplentes de los titulares."
  explanation:
    es: "El artículo 4.2 prevé Ministros sin cartera, con responsabilidad sobre determinadas funciones gubernamentales. Los Ministros delegados, los adjuntos y los suplentes no existen como figura en ese apartado."
