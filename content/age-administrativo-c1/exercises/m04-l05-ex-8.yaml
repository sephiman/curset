# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q230
  prompt:
    es: "De acuerdo con el artículo 70.3 del Real Decreto 364/1995, de 10 de marzo, los funcionarios consolidarán necesariamente como grado personal inicial el correspondiente:"
  options:
  - id: a
    text:
      es: "Al nivel mínimo del intervalo de su Cuerpo o Escala, cualquiera que sea el puesto de trabajo que se les haya adjudicado."
  - id: b
    text:
      es: "Al nivel del puesto adjudicado tras el proceso selectivo, aunque pasen voluntariamente a uno de nivel inferior."
  - id: c
    correct: true
    text:
      es: "Al nivel del puesto adjudicado tras el proceso selectivo, salvo que pasen voluntariamente a uno de nivel inferior."
  - id: d
    text:
      es: "Al nivel del primer puesto que obtengan por concurso una vez superado el proceso selectivo."
  explanation:
    es: "El artículo 70.3 dice que consolidarán «el correspondiente al nivel del puesto de trabajo adjudicado tras la superación del proceso selectivo, salvo que con carácter voluntario pasen a desempeñar un puesto de nivel inferior», en cuyo caso consolidan el de este último. El nivel mínimo del intervalo no es la referencia. El paso voluntario a un nivel inferior sí cambia el grado inicial. El primer concurso posterior no cuenta para el grado inicial."
  citation: "art. 70.3 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q231
  prompt:
    es: "Un funcionario del Subgrupo C2 obtiene tras el proceso selectivo un puesto de nivel 17 y, a petición propia, pasa enseguida a uno de nivel 15. El grado personal inicial que consolidará es:"
  options:
  - id: a
    text:
      es: "El 17, nivel del puesto adjudicado tras el proceso selectivo."
  - id: b
    text:
      es: "El 14, nivel mínimo del intervalo del Subgrupo C2."
  - id: c
    text:
      es: "El 18, nivel máximo del intervalo del Subgrupo C2."
  - id: d
    correct: true
    text:
      es: "El 15, nivel del puesto inferior al que pasó voluntariamente."
  explanation:
    es: "La regla del artículo 70.3 del Real Decreto 364/1995 es consolidar el nivel del puesto adjudicado tras el proceso selectivo, «salvo que con carácter voluntario pasen a desempeñar un puesto de nivel inferior, en cuyo caso consolidarán el correspondiente a este último». Pasó a petición propia a un nivel 15, así que consolida el 15, no el 17. Los niveles mínimo y máximo del intervalo del Subgrupo no son la referencia del grado inicial."
  citation: "art. 70.3 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q232
  prompt:
    es: "De acuerdo con el artículo 70.6 del Real Decreto 364/1995, de 10 de marzo, una vez consolidado el grado inicial, el tiempo prestado en comisión de servicios computa para consolidar el grado del puesto desempeñado siempre que:"
  options:
  - id: a
    text:
      es: "La comisión de servicios se haya prolongado al menos dos años continuados."
  - id: b
    text:
      es: "Se obtenga con carácter definitivo dicho puesto u otro de cualquier nivel."
  - id: c
    correct: true
    text:
      es: "Se obtenga con carácter definitivo dicho puesto u otro de igual o superior nivel."
  - id: d
    text:
      es: "Lo autorice el Subsecretario del Departamento al acordar la comisión."
  explanation:
    es: "El artículo 70.6 dice que ese tiempo «será computable para consolidar el grado correspondiente al puesto desempeñado siempre que se obtenga con carácter definitivo dicho puesto u otro de igual o superior nivel». La condición es obtener un destino definitivo de igual o superior nivel, no de cualquier nivel. El precepto no exige una duración mínima de la comisión ni una autorización del Subsecretario."
  citation: "art. 70.6 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q233
  prompt:
    es: "Según el artículo 70.6 del Real Decreto 364/1995, de 10 de marzo, ¿desde cuándo puede computar el tiempo en comisión de servicios para consolidar el grado del puesto desempeñado?"
  options:
  - id: a
    text:
      es: "Desde que el funcionario ha superado el periodo de prácticas."
  - id: b
    text:
      es: "Desde que el funcionario ha perfeccionado su primer trienio."
  - id: c
    text:
      es: "Desde que el funcionario ha cumplido un año de servicio activo."
  - id: d
    correct: true
    text:
      es: "Desde que el funcionario ha consolidado su grado personal inicial."
  explanation:
    es: "El artículo 70.6 empieza: «Una vez consolidado el grado inicial […] el tiempo prestado en comisión de servicios será computable». El punto de partida es la consolidación del grado inicial. El periodo de prácticas, el primer trienio o un año de servicio activo no aparecen en el precepto."
  citation: "art. 70.6 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q234
  prompt:
    es: "Una funcionaria con grado 18 consolidado desempeña en comisión de servicios un puesto de nivel 20 durante dos años y después lo obtiene con carácter definitivo por concurso. El tiempo en comisión:"
  options:
  - id: a
    text:
      es: "No computa, porque solo cuenta el tiempo desde la toma de posesión con carácter definitivo."
  - id: b
    correct: true
    text:
      es: "Computa para consolidar el grado 20, porque ha obtenido ese puesto con carácter definitivo."
  - id: c
    text:
      es: "Computa solo para consolidar el grado 19, porque la comisión no da el nivel completo."
  - id: d
    text:
      es: "Computa solo si la comisión de servicios se acordó con carácter forzoso."
  explanation:
    es: "El artículo 70.6 del Real Decreto 364/1995 dice que, consolidado el grado inicial, el tiempo en comisión «será computable para consolidar el grado correspondiente al puesto desempeñado siempre que se obtenga con carácter definitivo dicho puesto». Lo obtuvo por concurso, así que los dos años cuentan para el grado 20. El precepto no limita el cómputo a la etapa definitiva, no rebaja el grado a un nivel intermedio y no distingue entre comisión voluntaria y forzosa."
  citation: "art. 70.6 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q235
  prompt:
    es: "¿Qué órgano efectúa el reconocimiento del grado personal de un funcionario de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento donde preste servicios el funcionario."
  - id: b
    text:
      es: "El Secretario General Técnico del Departamento donde preste servicios."
  - id: c
    text:
      es: "El titular del Ministerio al que esté adscrito su Cuerpo o Escala."
  - id: d
    text:
      es: "El Director General del que dependa la unidad del funcionario."
  explanation:
    es: "El artículo 70.11 del Real Decreto 364/1995 dice: «El reconocimiento del grado personal se efectuará por el Subsecretario del Departamento donde preste servicios el funcionario». No lo reconoce el Secretario General Técnico, el Ministro del que dependa el Cuerpo ni el Director General de la unidad."
  citation: "art. 70.11 RD 364/1995"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q236
  prompt:
    es: "De acuerdo con el artículo 70.11 del Real Decreto 364/1995, de 10 de marzo, la resolución de reconocimiento del grado personal se comunica al Registro Central de Personal:"
  options:
  - id: a
    text:
      es: "Dentro de los diez días hábiles siguientes."
  - id: b
    text:
      es: "Dentro del mes siguiente a su firma."
  - id: c
    text:
      es: "Dentro de los quince días naturales siguientes."
  - id: d
    correct: true
    text:
      es: "Dentro de los tres días hábiles siguientes."
  explanation:
    es: "El artículo 70.11 dice que el Subsecretario dicta la resolución, «comunicándose al Registro central de personal dentro de los tres días hábiles siguientes». Los diez días hábiles, el mes y los quince días naturales no están en el precepto."
  citation: "art. 70.11 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q237
  prompt:
    es: "El Subsecretario de un Departamento dicta el jueves 12 de noviembre de 2026 la resolución que reconoce el grado personal de un funcionario. ¿Hasta qué día debe comunicarse la resolución al Registro Central de Personal?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el martes 17 de noviembre de 2026."
  - id: b
    text:
      es: "Hasta el domingo 15 de noviembre de 2026."
  - id: c
    text:
      es: "Hasta el lunes 16 de noviembre de 2026."
  - id: d
    text:
      es: "Hasta el jueves 26 de noviembre de 2026."
  explanation:
    es: "El artículo 70.11 del Real Decreto 364/1995 da «tres días hábiles siguientes». Según el artículo 30.2 de la Ley 39/2015, se excluyen sábados, domingos y festivos. Desde el viernes 13 de noviembre de 2026: viernes 13, lunes 16 y martes 17. El domingo 15 cuenta días naturales. El lunes 16 cuenta como primer día el de la propia resolución. El jueves 26 son diez días hábiles."
  citation: "art. 70.11 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q238
  prompt:
    es: "De acuerdo con la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, hasta que se apruebe la normativa reglamentaria, el intervalo de niveles del Subgrupo C1 es:"
  options:
  - id: a
    text:
      es: "Del nivel 18 al nivel 24."
  - id: b
    text:
      es: "Del nivel 14 al nivel 18."
  - id: c
    text:
      es: "Del nivel 20 al nivel 26."
  - id: d
    correct: true
    text:
      es: "Del nivel 16 al nivel 22."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo C1 el nivel mínimo 16 y el máximo 22. Del 18 al 24 es el Grupo B. Del 14 al 18 es el C2. Del 20 al 26 es el A2."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q239
  prompt:
    es: "Según la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, ¿cuál es el intervalo de niveles del Subgrupo A1 hasta que se apruebe la normativa reglamentaria?"
  options:
  - id: a
    text:
      es: "Del nivel 20 al nivel 30."
  - id: b
    text:
      es: "Del nivel 22 al nivel 30."
  - id: c
    correct: true
    text:
      es: "Del nivel 24 al nivel 30."
  - id: d
    text:
      es: "Del nivel 24 al nivel 28."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo A1 el intervalo del 24 al 30. Del 20 al 30 es el intervalo del antiguo Grupo A en el artículo 71.1 del Real Decreto 364/1995, no el de la disposición transitoria por la que se pregunta. El 22 no es el mínimo de ningún grupo de la tabla. El máximo del A1 es el 30, no el 28."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q240
  prompt:
    es: "¿A qué grupo o subgrupo corresponde, según la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, el intervalo de niveles que va del 18 al 24?"
  options:
  - id: a
    text:
      es: "Al Subgrupo A2 de clasificación profesional."
  - id: b
    text:
      es: "Al Subgrupo C1 de clasificación profesional."
  - id: c
    correct: true
    text:
      es: "Al Grupo B de clasificación profesional."
  - id: d
    text:
      es: "Al Subgrupo C2 de clasificación profesional."
  explanation:
    es: "La disposición transitoria sexta asigna al Grupo B el nivel mínimo 18 y el máximo 24. El A2 va del 20 al 26, el C1 del 16 al 22 y el C2 del 14 al 18."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q242
  prompt:
    es: "Según la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, ¿cuál es el intervalo de niveles del Subgrupo C2 hasta que se apruebe la normativa reglamentaria?"
  options:
  - id: a
    text:
      es: "Del nivel 16 al nivel 22."
  - id: b
    correct: true
    text:
      es: "Del nivel 14 al nivel 18."
  - id: c
    text:
      es: "Del nivel 12 al nivel 18."
  - id: d
    text:
      es: "Del nivel 14 al nivel 20."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo C2 el nivel mínimo 14 y el máximo 18. Del 16 al 22 es el C1. El 12 como mínimo y el 20 como máximo no aparecen en la tabla."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q243
  prompt:
    es: "De acuerdo con la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, los intervalos de niveles que fija para cada grupo o subgrupo de clasificación rigen:"
  options:
  - id: a
    text:
      es: "Hasta que se aprueben las leyes de Función Pública de las Comunidades Autónomas."
  - id: b
    text:
      es: "Durante los cinco años siguientes a la entrada en vigor del real decreto-ley."
  - id: c
    correct: true
    text:
      es: "Hasta tanto no se apruebe la normativa reglamentaria correspondiente."
  - id: d
    text:
      es: "Hasta que cada Departamento apruebe su nueva relación de puestos de trabajo."
  explanation:
    es: "La disposición transitoria sexta empieza: «Hasta tanto no se apruebe la normativa reglamentaria correspondiente, los intervalos de los niveles […] son los siguientes». Rige hasta esa norma reglamentaria. No depende de leyes autonómicas, de un plazo de cinco años ni de las relaciones de puestos de cada Departamento."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-71
- id: m04-l05-q244
  prompt:
    es: "De acuerdo con el artículo 71.2 del Real Decreto 364/1995, de 10 de marzo, en ningún caso los funcionarios podrán obtener puestos de trabajo:"
  options:
  - id: a
    text:
      es: "De nivel superior en más de dos niveles al correspondiente a su grado personal consolidado."
  - id: b
    correct: true
    text:
      es: "No incluidos en los niveles del intervalo correspondiente al Grupo en el que figure clasificado su Cuerpo o Escala."
  - id: c
    text:
      es: "De nivel superior al de su grado personal mientras no lo hayan consolidado durante dos años."
  - id: d
    text:
      es: "Adscritos a un Departamento ministerial distinto de aquel en el que hayan prestado servicios desde su ingreso."
  explanation:
    es: "El artículo 71.2 dice: «En ningún caso los funcionarios podrán obtener puestos de trabajo no incluidos en los niveles del intervalo correspondiente al Grupo en el que figure clasificado su Cuerpo o Escala». El límite es el intervalo del Grupo. Obtener un puesto superior en más de dos niveles al grado es posible: el artículo 70.2 regula precisamente ese caso. El precepto tampoco liga los puestos al grado ni al Departamento de ingreso."
  citation: "art. 71.2 RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-71
- id: m04-l05-q245
  prompt:
    es: "¿Para cuáles de los siguientes grupos fija intervalos de niveles el artículo 71.1 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    correct: true
    text:
      es: "Para los Grupos A, B, C, D y E."
  - id: b
    text:
      es: "Para los Subgrupos A1, A2, C1 y C2 y el Grupo B."
  - id: c
    text:
      es: "Para los Grupos A, B y C, sin dividirlos en Subgrupos."
  - id: d
    text:
      es: "Para los Subgrupos A1 y A2 y los Grupos B y C."
  explanation:
    es: "El artículo 71.1 contiene una tabla con los Grupos A, B, C, D y E, la clasificación anterior al TREBEP. Los Subgrupos A1, A2, C1 y C2 y el Grupo B son los de la disposición transitoria sexta del Real Decreto-ley 6/2023. La tabla del artículo 71.1 no se queda en tres grupos ni mezcla Subgrupos con Grupos."
  citation: "art. 71.1 RD 364/1995"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1984-17387-art-21
- id: m04-l05-q246
  prompt:
    es: "¿Cuál es la vigencia del artículo 21 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, sobre el grado personal, según la nota del BOE a ese artículo?"
  options:
  - id: a
    text:
      es: "Derogado por el TREBEP sin régimen transitorio, de modo que el grado se rige solo por el Real Decreto 364/1995."
  - id: b
    text:
      es: "Vigente sin limitación alguna, porque el TREBEP no lo incluye en la lista de su disposición derogatoria única."
  - id: c
    text:
      es: "Derogado por el Real Decreto-ley 6/2023, que regula el grado personal en su libro segundo."
  - id: d
    correct: true
    text:
      es: "Derogado por el TREBEP, sigue vigente en lo que no se le oponga hasta que se dicten las leyes de Función Pública."
  explanation:
    es: "La nota del BOE dice que el artículo «ha sido derogado por la disposición derogatoria única.b)» del TREBEP, «pero se mantendrá vigente en tanto no se oponga a lo establecido en el mismo, hasta que se dicten las Leyes de Función Pública y las normas reglamentarias de desarrollo». Hay, pues, un régimen transitorio, y el TREBEP sí lo incluye en su lista derogatoria. La nota no menciona el Real Decreto-ley 6/2023."
  citation: "art. 21 Ley 30/1984"
  difficulty: 3
  tags:
  - "estructura"
