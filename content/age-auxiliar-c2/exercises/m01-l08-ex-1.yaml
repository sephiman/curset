  - id: d
    correct: true
    text:
      es: "Los Secretarios de Estado."
  explanation:
    es: "Los Secretarios de Estado son órganos superiores, no directivos. Los Subdirectores generales, los Secretarios generales técnicos y los Secretarios generales sí son órganos directivos según el artículo 55.3.b."
