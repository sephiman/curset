# anchor: boe-a-1995-8729-art-11
- id: m04-l02-q027
  prompt:
    es: "En los procesos selectivos de ingreso en la Administración General del Estado, los Tribunales están constituidos por:"
  options:
  - id: a
    correct: true
    text:
      es: "Un número impar de miembros, funcionarios de carrera, no inferior a cinco"
  - id: b
    text:
      es: "Cinco miembros, funcionarios de carrera, sin designación de suplentes"
  - id: c
    text:
      es: "Un número par de miembros, funcionarios de carrera, no inferior a seis"
  - id: d
    text:
      es: "Un número impar de miembros, funcionarios de carrera o interinos, no inferior a cinco"
  explanation:
    es: "El artículo 11 del Real Decreto 364/1995 dice que los Tribunales «estarán constituidos por un número impar de miembros, funcionarios de carrera, no inferior a cinco», con el mismo número de suplentes. El número es impar, no par. Los interinos no pueden formar parte (artículo 60.2 del Estatuto Básico), y el artículo 11 solo habla de funcionarios de carrera. La opción de cinco miembros sin suplentes contradice la designación obligatoria de suplentes."
  citation: "art. 11 RD 364/1995"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1995-8729-art-11
- id: m04-l02-q028
  prompt:
    es: "¿Cuál de las siguientes reglas sobre los Tribunales establece el artículo 11 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "Se designan suplentes en número igual a la mitad de los miembros titulares"
  - id: b
    correct: true
    text:
      es: "Todos sus miembros deben tener una titulación igual o superior a la exigida para el ingreso"
  - id: c
    text:
      es: "Basta con que su presidente tenga una titulación igual o superior a la exigida para el ingreso"
  - id: d
    text:
      es: "Se nombran con carácter permanente para todas las convocatorias del Cuerpo o Escala"
  explanation:
    es: "El artículo 11 dice que «la totalidad de los miembros deberá poseer un nivel de titulación igual o superior al exigido para el ingreso en el Cuerpo o Escala». No basta con el presidente. Los suplentes son «el mismo número» que los titulares, no la mitad. Los Tribunales se nombran, salvo excepción justificada, en cada orden de convocatoria, no con carácter permanente."
  citation: "art. 11 RD 364/1995"
  difficulty: 2
  tags:
  - "composición"
  - "requisito"
# anchor: boe-a-1995-8729-art-11
- id: m04-l02-q029
  prompt:
    es: "¿Cuándo se nombran, salvo excepción justificada, los Tribunales de los procesos selectivos de ingreso en la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Una vez publicada la lista definitiva de admitidos"
  - id: b
    text:
      es: "Por un periodo de cuatro años, renovable una vez"
  - id: c
    correct: true
    text:
      es: "En cada orden de convocatoria"
  - id: d
    text:
      es: "Al inicio de cada año natural, para todas las convocatorias"
  explanation:
    es: "El artículo 11 del Real Decreto 364/1995 dice que los Tribunales «serán nombrados, salvo excepción justificada, en cada orden de convocatoria». No tienen un mandato de cuatro años ni se nombran al inicio de cada año para todas las convocatorias. Tampoco esperan a la lista de admitidos: la convocatoria ya contiene la designación del Tribunal (artículo 16.g)."
  citation: "art. 11 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-12
- id: m04-l02-q030
  prompt:
    es: "¿En qué Cuerpos y Escalas de la Administración General del Estado se encomienda a las Comisiones Permanentes de Selección el desarrollo y la calificación de las pruebas?"
  options:
  - id: a
    text:
      es: "En aquellos que tengan pocos aspirantes y exijan una titulación muy especializada"
  - id: b
    text:
      es: "En todos los adscritos al departamento con competencias en materia de función pública"
  - id: c
    correct: true
    text:
      es: "En aquellos en que lo aconsejen el elevado número de aspirantes y el nivel de titulación exigido"
  - id: d
    text:
      es: "Solo en aquellos cuyo ingreso se haga por el sistema de concurso-oposición"
  explanation:
    es: "El artículo 12.1 del Real Decreto 364/1995 les encomienda los Cuerpos y Escalas «en los que el elevado número de aspirantes y el nivel de titulación o especialización exigidos así lo aconseje». La opción de pocos aspirantes invierte el criterio. El artículo no usa como criterio el departamento de adscripción ni el sistema selectivo."
  citation: "art. 12.1 RD 364/1995"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1995-8729-art-13
- id: m04-l02-q031
  prompt:
    es: "Según el artículo 13.2 del Real Decreto 364/1995, de 10 de marzo, quedan fuera de los órganos de selección los funcionarios que hayan realizado tareas de preparación de aspirantes a pruebas selectivas:"
  options:
  - id: a
    text:
      es: "En los cinco años anteriores a la celebración del primer ejercicio"
  - id: b
    correct: true
    text:
      es: "En los cinco años anteriores a la publicación de la convocatoria"
  - id: c
    text:
      es: "En cualquier momento anterior a la publicación de la convocatoria"
  - id: d
    text:
      es: "En los diez años anteriores a la publicación de la convocatoria"
  explanation:
    es: "El artículo 13.2 dice que no podrán formar parte de los órganos de selección los funcionarios que hubiesen preparado aspirantes «en los cinco años anteriores a la publicación de la correspondiente convocatoria». Los diez años y «cualquier momento» amplían el periodo. El periodo se cuenta hacia atrás desde la publicación de la convocatoria, no desde el primer ejercicio."
  citation: "art. 13.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "composición"
# anchor: boe-a-2023-25758-art-114
- id: m04-l02-q032
  prompt:
    es: "Las bases de la convocatoria de un proceso de selección de personal de la Administración del Estado vinculan:"
  options:
  - id: a
    correct: true
    text:
      es: "Al órgano convocante, a los órganos de selección y a quienes participen en el proceso"
  - id: b
    text:
      es: "Al órgano convocante y a quienes participen, pero no a los órganos de selección"
  - id: c
    text:
      es: "A los órganos de selección, que pueden modificarlas libremente durante el proceso"
  - id: d
    text:
      es: "Solo a quienes participen en el proceso, pero no a la Administración convocante"
  explanation:
    es: "El artículo 114.11 del Real Decreto-ley 6/2023 dice que «las bases de la convocatoria vincularán al órgano convocante, a los órganos de selección y a quienes participen en los mismos». Las opciones que dejan fuera a la Administración convocante o a los órganos de selección contradicen el texto. Los órganos de selección quedan vinculados por las bases y no pueden modificarlas libremente. El artículo 15.4 del Real Decreto 364/1995 dice lo mismo."
  citation: "art. 114.11 RDL 6/2023"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2023-25758-art-114
- id: m04-l02-q033
  prompt:
    es: "Según el artículo 114.11 del Real Decreto-ley 6/2023, de 19 de diciembre, ¿cómo se inician los procesos de selección de personal de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Mediante invitación a los inscritos en una bolsa de empleo"
  - id: b
    text:
      es: "Mediante resolución del órgano de selección, que fijará las bases"
  - id: c
    correct: true
    text:
      es: "Mediante convocatoria pública, que incluirá las bases"
  - id: d
    text:
      es: "Mediante la oferta de empleo público, sin una convocatoria separada"
  explanation:
    es: "El artículo 114.11 dice que «los procesos de selección se iniciarán mediante convocatoria pública, que incluirá las bases». Las bases no las fija el órgano de selección: lo vinculan. La oferta obliga a convocar, pero no sustituye a la convocatoria. Una invitación a los inscritos en una bolsa no es una convocatoria pública."
  citation: "art. 114.11 RDL 6/2023"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-15
- id: m04-l02-q034
  prompt:
    es: "Las convocatorias de los procesos selectivos de ingreso en la Administración General del Estado, juntamente con sus bases, se publican:"
  options:
  - id: a
    text:
      es: "En el boletín oficial de la provincia donde se celebren las pruebas"
  - id: b
    text:
      es: "En el tablón de anuncios del departamento convocante"
  - id: c
    text:
      es: "Solo en la sede electrónica del departamento convocante"
  - id: d
    correct: true
    text:
      es: "En el Boletín Oficial del Estado"
  explanation:
    es: "El artículo 15.1 del Real Decreto 364/1995 dice que «las convocatorias, juntamente con sus bases, se publicarán en el “Boletín Oficial del Estado”». El tablón del departamento, la sede electrónica y el boletín provincial no son el diario oficial que exige el artículo."
  citation: "art. 15.1 RD 364/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-18
- id: m04-l02-q035
  prompt:
    es: "¿En qué plazo se presenta la solicitud para participar en un procedimiento de ingreso en la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Veinte días naturales a partir del siguiente al de publicación de la convocatoria en el Boletín Oficial del Estado"
  - id: b
    text:
      es: "Veinte días hábiles a partir del siguiente al de publicación de la convocatoria en el Boletín Oficial del Estado"
  - id: c
    text:
      es: "Diez días hábiles a partir del siguiente al de publicación de la convocatoria en el Boletín Oficial del Estado"
  - id: d
    text:
      es: "Un mes a partir del mismo día de publicación de la convocatoria en el Boletín Oficial del Estado"
  explanation:
    es: "El artículo 18.1 del Real Decreto 364/1995 fija «el plazo de veinte días naturales a partir del siguiente al de publicación de la convocatoria respectiva en el “Boletín Oficial del Estado”». Los días son naturales, no hábiles. Los diez días hábiles son el plazo de subsanación de la lista de admitidos (artículo 20.1). El mes no está en el artículo, que además cuenta desde el día siguiente al de publicación."
  citation: "art. 18.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-18
- id: m04-l02-q036
  prompt:
    es: "Una convocatoria de ingreso en un Cuerpo de la Administración General del Estado se publica en el Boletín Oficial del Estado el miércoles, 3 de febrero de 2027. ¿Cuál es el último día para presentar la solicitud?"
  options:
  - id: a
    text:
      es: "El lunes, 22 de febrero de 2027"
  - id: b
    text:
      es: "El miércoles, 3 de marzo de 2027"
  - id: c
    text:
      es: "El viernes, 5 de marzo de 2027"
  - id: d
    correct: true
    text:
      es: "El martes, 23 de febrero de 2027"
  explanation:
    es: "El artículo 18.1 del Real Decreto 364/1995 da veinte días naturales «a partir del siguiente al de publicación». El plazo empieza el jueves 4 de febrero de 2027 y el vigésimo día natural es el martes 23 de febrero, día hábil. El lunes 22 sale de contar el día de publicación como primero. El miércoles 3 de marzo sale de contar veinte días hábiles, y el viernes 5 de marzo de contar treinta días naturales."
  citation: "art. 18.1 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-18
- id: m04-l02-q037
  prompt:
    es: "La convocatoria de un proceso selectivo de ingreso en la Administración General del Estado se publica en el Boletín Oficial del Estado el lunes, 2 de febrero de 2026. ¿Cuál es el último día para presentar la solicitud?"
  options:
  - id: a
    text:
      es: "El lunes, 2 de marzo de 2026"
  - id: b
    text:
      es: "El domingo, 22 de febrero de 2026"
  - id: c
    text:
      es: "El sábado, 21 de febrero de 2026"
  - id: d
    correct: true
    text:
      es: "El lunes, 23 de febrero de 2026"
  explanation:
    es: "El artículo 18.1 del Real Decreto 364/1995 da veinte días naturales «a partir del siguiente al de publicación». El plazo empieza el martes 3 de febrero de 2026 y el vigésimo día natural es el domingo 22 de febrero. Como el último día es inhábil, el plazo se prorroga al primer día hábil siguiente, el lunes 23 (artículo 30.5 de la Ley 39/2015). El domingo 22 olvida esa prórroga. El sábado 21 sale de contar el día de publicación como primero. El lunes 2 de marzo sale de contar veinte días hábiles."
  citation: "art. 18.1 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-55
- id: m04-l02-q041
  prompt:
    es: "¿Cuál de los siguientes principios deben garantizar los procedimientos de selección según el artículo 55.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Preferencia de los aspirantes que ya presten servicios en la Administración"
  - id: b
    text:
      es: "Representación de las organizaciones sindicales en los órganos de selección"
  - id: c
    correct: true
    text:
      es: "Independencia y discrecionalidad técnica en la actuación de los órganos de selección"
  - id: d
    text:
      es: "Valoración de la antigüedad como mérito preferente de los aspirantes"
  explanation:
    es: "La letra d) del artículo 55.2 recoge la «independencia y discrecionalidad técnica en la actuación de los órganos de selección». La representación sindical choca con el artículo 60.3, que impide pertenecer a un órgano de selección en representación de nadie. La preferencia de quien ya presta servicios y la antigüedad como mérito preferente no figuran entre los principios del artículo."
  citation: "art. 55.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-55
- id: m04-l02-q042
  prompt:
    es: "De acuerdo con el artículo 55.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los procedimientos de selección garantizarán la agilidad en los procesos de selección:"
  options:
  - id: a
    correct: true
    text:
      es: "Sin perjuicio de la objetividad"
  - id: b
    text:
      es: "Con preferencia sobre la transparencia"
  - id: c
    text:
      es: "Aunque se reduzca la publicidad de las bases"
  - id: d
    text:
      es: "Sin perjuicio de la antigüedad de los aspirantes"
  explanation:
    es: "La letra f) del artículo 55.2 TREBEP dice: «Agilidad, sin perjuicio de la objetividad, en los procesos de selección». Dar preferencia a la agilidad sobre la transparencia contradice la letra b), que recoge la transparencia como principio de los mismos procedimientos. Reducir la publicidad de las bases contradice la letra a), «publicidad de las convocatorias y de sus bases». La antigüedad de los aspirantes no es una salvedad: la única que la letra f) pone a la agilidad es la objetividad."
  citation: "art. 55.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-55
- id: m04-l02-q043
  prompt:
    es: "¿Cuál de los siguientes principios NO figura entre los que, según el artículo 55.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, garantizan los procedimientos de selección?"
  options:
  - id: a
    text:
      es: "Transparencia de los procedimientos de selección"
  - id: b
    correct: true
    text:
      es: "Prioridad de la antigüedad sobre el mérito de los aspirantes"
  - id: c
    text:
      es: "Adecuación entre el contenido de los procesos selectivos y las funciones a desarrollar"
  - id: d
    text:
      es: "Publicidad de las convocatorias y de sus bases"
  explanation:
    es: "El artículo 55.2 enumera, entre otros, la publicidad de las convocatorias y de sus bases (letra a), la transparencia (letra b) y la adecuación entre el contenido de los procesos y las funciones o tareas a desarrollar (letra e). No recoge ninguna prioridad de la antigüedad, que además chocaría con el principio de mérito del artículo 55.1."
  citation: "art. 55.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-55
- id: m04-l02-q044
  prompt:
    es: "Señale la respuesta correcta sobre los principios que deben garantizar los procedimientos de selección según el artículo 55.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Rigen para la selección del personal funcionario, pero no para la del laboral"
  - id: b
    text:
      es: "Incluyen la representatividad de los miembros de los órganos de selección"
  - id: c
    text:
      es: "Excluyen la discrecionalidad técnica en la actuación de los órganos de selección"
  - id: d
    correct: true
    text:
      es: "Incluyen la imparcialidad y profesionalidad de los miembros de los órganos de selección"
  explanation:
    es: "La letra c) del artículo 55.2 TREBEP recoge la «imparcialidad y profesionalidad de los miembros de los órganos de selección». La representatividad no es el principio de la letra c): la letra habla de imparcialidad y profesionalidad. La discrecionalidad técnica no está excluida: la letra d) garantiza la «independencia y discrecionalidad técnica en la actuación de los órganos de selección». El apartado rige para el personal laboral igual que para el funcionario: dice que las Administraciones «seleccionarán a su personal funcionario y laboral» con esos principios."
  citation: "art. 55.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
