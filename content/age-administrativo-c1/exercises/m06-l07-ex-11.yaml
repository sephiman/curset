# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q352
  prompt:
    es: "En Outlook 365, si se quiere más funcionalidad que una lista de contactos, ¿qué recomienda la ayuda considerar?"
  options:
  - id: a
    text:
      es: "Crear un grupo de envío y recepción con los contactos"
  - id: b
    text:
      es: "Crear una regla que envíe automáticamente mensajes a los contactos"
  - id: c
    correct: true
    text:
      es: "Crear un grupo en Outlook, para compartir bandeja, calendario y archivos"
  - id: d
    text:
      es: "Crear una carpeta de búsqueda, que permite compartir los contactos"
  explanation:
    es: "La ayuda recomienda crear un grupo en Outlook, con el que se comparten bandeja de entrada, calendario y archivos. La carpeta de búsqueda es una carpeta virtual con mensajes, y no comparte contactos. La regla actúa sobre el correo que llega. El grupo de envío y recepción contiene cuentas y carpetas, no contactos."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-graficos-html
- id: m06-l07-q353
  prompt:
    es: "En Outlook 365 clásico, ¿de quién es la responsabilidad de respetar el copyright al insertar imágenes en línea de Bing en un mensaje?"
  options:
  - id: a
    text:
      es: "Del servidor de correo, que rechaza las imágenes con copyright"
  - id: b
    text:
      es: "Del destinatario, que debe comprobar la licencia al abrir el mensaje"
  - id: c
    text:
      es: "De Microsoft, que garantiza la licencia de todas las imágenes de Bing"
  - id: d
    correct: true
    text:
      es: "Del usuario, que puede apoyarse en el filtro de licencia de Bing"
  explanation:
    es: "La ayuda dice que el usuario es responsable de respetar el copyright y que el filtro de licencia de Bing puede ayudarle a elegir qué imágenes usar. Que Microsoft garantice la licencia, que lo haga el destinatario o que el servidor rechace las imágenes contradice esa frase."
  citation: "fuente: `ms-outlook-graficos.html`; «Para insertar gráficos en mensajes en Outlook para PC»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q354
  prompt:
    es: "En Outlook 365, ¿qué permite configurar la ayuda de Microsoft sobre firmas de correo electrónico respecto a su inclusión en los mensajes?"
  options:
  - id: a
    text:
      es: "Varias firmas, pero solo para mensajes nuevos, nunca para respuestas o reenvíos"
  - id: b
    text:
      es: "Una firma única para todas las cuentas, sin poder cambiarla"
  - id: c
    correct: true
    text:
      es: "Varias firmas, y elegir si se incluyen en nuevos mensajes, respuestas o reenvíos"
  - id: d
    text:
      es: "Una sola firma por cuenta, incluida siempre en nuevos mensajes y respuestas"
  explanation:
    es: "La ayuda dice que se pueden configurar varias firmas para diferentes propósitos y elegir si incluirlas automáticamente en nuevos correos, respuestas o reenvíos. Una sola firma por cuenta o una única para todas las cuentas contradice que se puedan configurar varias. Limitarlas a mensajes nuevos contradice que se pueda elegir también para respuestas o reenvíos."
  citation: "fuente: `ms-outlook-firma.html`; «Resumen»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q355
  prompt:
    es: "En Outlook 365 clásico, ¿qué se puede hacer en el cuadro desplegable Cuenta de correo electrónico al crear una firma?"
  options:
  - id: a
    text:
      es: "Elegir si la firma se aplica a los mensajes nuevos o a las respuestas"
  - id: b
    correct: true
    text:
      es: "Elegir la cuenta a la que se asocia la firma, con firmas distintas"
  - id: c
    text:
      es: "Elegir el idioma en el que se redacta cada firma de las cuentas"
  - id: d
    text:
      es: "Elegir la carpeta en la que se guardan las firmas de todas las cuentas"
  explanation:
    es: "En Cuenta de correo electrónico se elige una cuenta para asociarla a la firma, y se pueden tener firmas distintas para cada cuenta. Elegir una carpeta o un idioma contradice esa descripción. Elegir si se aplica a mensajes nuevos o respuestas se hace en Elegir firma predeterminada, con las listas Nuevos mensajes y Respuestas/reenvíos."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q356
  prompt:
    es: "En Outlook 365 clásico, ¿qué permite hacer la minibarra de formato del cuadro Editar firma, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Agregar vínculos e imágenes, cambiar fuentes y justificar el texto"
  - id: b
    text:
      es: "Elegir la firma que se agrega automáticamente a las respuestas"
  - id: c
    text:
      es: "Insertar viñetas, tablas y bordes directamente en la firma"
  - id: d
    text:
      es: "Descargar plantillas prediseñadas de firmas para personalizar"
  explanation:
    es: "La minibarra de formato de Editar firma permite agregar vínculos e imágenes, cambiar fuentes y colores, y justificar el texto. Las viñetas, tablas y bordes se crean en Word y se copian y pegan. Las plantillas prediseñadas se descargan en Word. La firma de las respuestas se elige en la lista Respuestas/reenvíos."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q357
  prompt:
    es: "En el nuevo Outlook para Windows, el botón que cancela la creación de una regla en lugar de crearla es:"
  options:
  - id: a
    correct: true
    text:
      es: "Descartar"
  - id: b
    text:
      es: "Aceptar"
  - id: c
    text:
      es: "Guardar"
  - id: d
    text:
      es: "Más opciones"
  explanation:
    es: "Se presiona Guardar para crear la regla o Descartar para cancelar su creación. Guardar crea la regla. Aceptar confirma la carpeta en la creación rápida. Más opciones abre el menú de configuración de reglas."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q358
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué se selecciona al crear una regla desde un mensaje para hacer algo más que mover los correos de un remitente a una carpeta?"
  options:
  - id: a
    text:
      es: "Detener el procesamiento de más reglas"
  - id: b
    text:
      es: "Guardar"
  - id: c
    correct: true
    text:
      es: "Más opciones"
  - id: d
    text:
      es: "Descartar"
  explanation:
    es: "Para hacer algo más que mover el mensaje se selecciona Más opciones, que abre el menú de configuración de reglas. Descartar cancela la creación. Guardar la crea. Detener el procesamiento de más reglas evita que se ejecuten reglas posteriores."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q359
  prompt:
    es: "En el nuevo Outlook para Windows, ¿desde qué carpetas pueden crearse las reglas de bandeja de entrada, que se aplican a los mensajes entrantes?"
  options:
  - id: a
    text:
      es: "Solo desde las carpetas de búsqueda"
  - id: b
    text:
      es: "Solo desde la Bandeja de entrada"
  - id: c
    text:
      es: "Solo desde la carpeta Elementos enviados"
  - id: d
    correct: true
    text:
      es: "Desde cualquier carpeta"
  explanation:
    es: "La ayuda dice que las reglas se aplican a los mensajes entrantes y pueden crearse desde cualquier carpeta. Limitarlo a la Bandeja de entrada, a Elementos enviados o a las carpetas de búsqueda contradice esa frase."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q360
  prompt:
    es: "En Outlook 365 clásico, ¿qué botón del cuadro Reglas y alertas se pulsa para cambiar la configuración, el nombre, la ubicación o el comportamiento de una regla?"
  options:
  - id: a
    text:
      es: "Eliminar"
  - id: b
    correct: true
    text:
      es: "Cambiar regla"
  - id: c
    text:
      es: "Nueva regla"
  - id: d
    text:
      es: "Ejecutar reglas ahora"
  explanation:
    es: "Con Cambiar regla se elige el tipo de cambio que se quiere hacer. Nueva regla crea una regla. Ejecutar reglas ahora ejecuta manualmente las reglas elegidas. Eliminar quita la regla seleccionada."
  citation: "fuente: `ms-outlook-reglas.html`; «Editar una regla en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q361
  prompt:
    es: "En Outlook 365 clásico, en el cuadro Ejecutar reglas ahora, ¿qué casilla hay que activar para incluir las carpetas contenidas en la carpeta seleccionada?"
  options:
  - id: a
    correct: true
    text:
      es: "Incluir subcarpetas"
  - id: b
    text:
      es: "Activar esta regla"
  - id: c
    text:
      es: "Examinar"
  - id: d
    text:
      es: "Aplicar reglas a"
  explanation:
    es: "La casilla Incluir subcarpetas incluye todas las carpetas contenidas en la carpeta seleccionada. Examinar permite elegir otra carpeta en el cuadro Ejecutar en la carpeta. Aplicar reglas a es la lista con todos los mensajes, leídos o no leídos. Activar esta regla es la casilla final del asistente de nuevas reglas."
  citation: "fuente: `ms-outlook-reglas.html`; «Ejecutar reglas manualmente en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q362
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se identifica en el cuadro Reglas y alertas una regla errónea que necesita modificarse?"
  options:
  - id: a
    text:
      es: "Aparece en azul, y se selecciona Ejecutar reglas ahora en el cuadro"
  - id: b
    text:
      es: "Aparece en gris, y se pulsa Eliminar para quitarla"
  - id: c
    text:
      es: "Aparece con una exclamación roja, y se pulsa Nueva regla"
  - id: d
    correct: true
    text:
      es: "Aparece en rojo, y se activa la casilla situada junto a ella"
  explanation:
    es: "La ayuda dice que se active la casilla situada junto a la regla en rojo y que se editen los vínculos de la Descripción de la regla. Que aparezca en azul, en gris o con una exclamación roja contradice el color rojo que cita la ayuda."
  citation: "fuente: `ms-outlook-reglas.html`; «Editar una regla en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q363
  prompt:
    es: "En Outlook 365, ¿sobre qué correo actúan automáticamente las reglas, según la ayuda de Microsoft sobre administrar mensajes con reglas?"
  options:
  - id: a
    text:
      es: "Solo sobre el correo que el usuario selecciona a mano"
  - id: b
    correct: true
    text:
      es: "Sobre el correo que llega a la bandeja de entrada"
  - id: c
