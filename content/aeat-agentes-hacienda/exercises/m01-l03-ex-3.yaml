# anchor: boe-a-1978-31229-art-97
- id: m01-l03-q0001
  prompt:
    es: "De acuerdo con el artículo 97 de la Constitución Española de 1978, el Gobierno dirige la política interior y exterior, la Administración civil y militar y:"
  options:
  - id: a
    correct: true
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  - id: b
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad legislativa de acuerdo con la Constitución y las leyes."
  - id: c
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con las directrices de las Cortes Generales."
  - id: d
    text:
      es: "La seguridad ciudadana, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  explanation:
    es: "El artículo 97 dice que el Gobierno dirige «la defensa del Estado» y ejerce «la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes». La potestad legislativa es de las Cortes Generales (art. 66.2 CE), no del Gobierno. La potestad reglamentaria se ejerce de acuerdo con la Constitución y las leyes, no con directrices de las Cortes. La seguridad ciudadana es la misión de las Fuerzas y Cuerpos de seguridad (art. 104.1 CE); el artículo 97 habla de la defensa del Estado."
  citation: "art. 97 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-98
- id: m01-l03-q0002
  prompt:
    es: "De acuerdo con el artículo 98.1 de la Constitución Española de 1978, el Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los Ministros y de:"
  options:
  - id: a
    text:
      es: "Los Secretarios de Estado que designe el Presidente del Gobierno."
  - id: b
    text:
      es: "Los Subsecretarios de cada uno de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Los demás miembros que establezca la ley."
  - id: d
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas."
  explanation:
    es: "El artículo 98.1 cierra la lista con «los demás miembros que establezca la ley». Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1 Ley 50/1997), no miembros del Gobierno. Tampoco lo son los Subsecretarios ni los Delegados del Gobierno, que son órganos de la Administración."
  citation: "art. 98.1 CE"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-1
- id: m01-l03-q0003
  prompt:
    es: "¿Cuál de las siguientes afirmaciones recoge la composición del Gobierno tal como la establece la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros."
  - id: b
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y de los Secretarios de Estado."
  - id: c
    text:
      es: "Se compone del Presidente, de los Ministros y de los Subsecretarios de los Departamentos Ministeriales."
  - id: d
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y del Abogado General del Estado."
  explanation:
    es: "El artículo 1.2 de la Ley 50/1997 dice que el Gobierno «se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros». La ley no añade otros miembros. Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1). Los Subsecretarios y el Abogado General del Estado forman parte o asisten a la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.1), pero no son miembros del Gobierno."
  citation: "art. 1.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-15
- id: m01-l03-q0020
  prompt:
    es: "Según el artículo 15.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿cómo son nombrados y separados los Secretarios de Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan."
  - id: b
    text:
      es: "Por acuerdo de la Comisión General de Secretarios de Estado y Subsecretarios, a propuesta del Ministro del Departamento."
  - id: c
    text:
      es: "Por Orden del Ministro del Departamento al que pertenezcan, previo conocimiento del Consejo de Ministros."
  - id: d
    text:
      es: "Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro del Departamento al que pertenezcan."
  explanation:
    es: "El artículo 15.1 dice que los Secretarios de Estado «son nombrados y separados por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan». La Comisión General no nombra a nadie y no puede adoptar acuerdos por delegación del Gobierno (art. 8.4). La Orden Ministerial previo conocimiento del Consejo es la forma de nombrar a los Directores de Gabinete de los Secretarios de Estado (art. 16.2). El Real Decreto es del Consejo de Ministros, no del Presidente."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-11
- id: m01-l03-q0021
  prompt:
    es: "¿Cuál de los siguientes es un requisito para ser miembro del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Ostentar la condición de Diputado o Senador en el momento del nombramiento."
  - id: b
    text:
      es: "Haber cumplido veinticinco años de edad en la fecha del nombramiento."
  - id: c
    text:
      es: "Ser funcionario de carrera de un cuerpo del subgrupo A1."
  - id: d
    correct: true
    text:
      es: "No estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme."
  explanation:
    es: "El artículo 11 exige ser español, mayor de edad, disfrutar de los derechos de sufragio activo y pasivo, «no estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme» y reunir los requisitos de idoneidad de la Ley 3/2015. No exige ser Diputado o Senador. La edad exigida es la mayoría de edad, no veinticinco años. No exige ser funcionario."
  citation: "art. 11 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-100
- id: m01-l03-q0025
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de los miembros del Gobierno se ajusta a la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los Ministros son nombrados por el Rey, a propuesta del Presidente, y separados por el Congreso de los Diputados."
  - id: b
    text:
      es: "Los Vicepresidentes son nombrados por el Rey, previa votación de investidura en el Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Los demás miembros del Gobierno son nombrados y separados por el Rey, a propuesta de su Presidente."
  - id: d
    text:
      es: "Los Ministros son nombrados por el Presidente del Gobierno, previa deliberación del Consejo de Ministros."
  explanation:
    es: "El artículo 100 dice: «Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente». El Congreso no separa a los Ministros; exige la responsabilidad política del Gobierno en su conjunto (art. 113.1). Solo el candidato a Presidente se somete a investidura (art. 99). Los Ministros los nombra el Rey, no el Presidente, y la ley no exige deliberación del Consejo."
  citation: "art. 100 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-98
- id: m01-l03-q0030
  prompt:
    es: "Señale la respuesta correcta sobre las funciones y actividades que pueden ejercer los miembros del Gobierno según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Pueden ejercer una actividad profesional, siempre que no sea retribuida."
  - id: b
    text:
      es: "Pueden ejercer una función pública que no derive de su cargo, con autorización del Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "Pueden ejercer las funciones representativas propias del mandato parlamentario."
  - id: d
    text:
      es: "Pueden ejercer una actividad mercantil, previa declaración ante el Congreso de los Diputados."
  explanation:
    es: "El artículo 98.3 dice que los miembros del Gobierno no podrán ejercer «otras funciones representativas que las propias del mandato parlamentario», así que estas sí pueden ejercerlas. El mismo apartado prohíbe «actividad profesional o mercantil alguna», sea o no retribuida y con o sin declaración. También prohíbe «cualquier otra función pública que no derive de su cargo», sin admitir autorización."
  citation: "art. 98.3 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1997-25336-art-1
- id: m01-l03-q0033
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, los miembros del Gobierno se reúnen, para el ejercicio de sus funciones, en:"
  options:
  - id: a
    text:
      es: "Consejo de Ministros y en la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: b
    text:
      es: "Consejo de Ministros y en el Consejo de Estado, según la materia."
  - id: c
    correct: true
    text:
      es: "Consejo de Ministros y en Comisiones Delegadas del Gobierno."
  - id: d
    text:
      es: "Comisiones Delegadas del Gobierno y en la Conferencia de Presidentes."
  explanation:
    es: "El artículo 1.3 dice que los miembros del Gobierno se reúnen en Consejo de Ministros y en Comisiones Delegadas del Gobierno. La Comisión General de Secretarios de Estado y Subsecretarios la integran los titulares de las Secretarías de Estado y los Subsecretarios, que no son miembros del Gobierno. El Consejo de Estado es un órgano consultivo, no una reunión del Gobierno. La Conferencia de Presidentes no está en el artículo."
  citation: "art. 1.3 Ley 50/1997"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-103
- id: m01-l03-q0034
  prompt:
    es: "Según el artículo 103.2 de la Constitución Española de 1978, los órganos de la Administración del Estado son creados, regidos y coordinados:"
  options:
  - id: a
    text:
      es: "De acuerdo con los reglamentos que apruebe el Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "De acuerdo con la ley."
  - id: c
    text:
      es: "De acuerdo con las directrices que fije el Presidente del Gobierno."
  - id: d
    text:
      es: "De acuerdo con los acuerdos de la Comisión General de Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 103.2 somete la creación, el régimen y la coordinación de esos órganos a la ley. Los reglamentos del Consejo de Ministros, las directrices del Presidente y los acuerdos de la Comisión General son normas o decisiones de rango inferior, que desarrollan la ley pero no la sustituyen."
  citation: "art. 103.2 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-103
- id: m01-l03-q0035
  prompt:
    es: "Conforme al artículo 103.1 de la Constitución Española de 1978, la Administración Pública sirve con objetividad los intereses generales y actúa con sometimiento pleno a:"
  options:
  - id: a
    text:
      es: "La ley y a las instrucciones del Gobierno."
  - id: b
    text:
      es: "La Constitución y a las resoluciones judiciales."
  - id: c
    text:
      es: "Las órdenes del Gobierno y a los reglamentos."
  - id: d
    correct: true
    text:
      es: "La ley y al Derecho."
  explanation:
    es: "El artículo 103.1 somete a la Administración de manera plena a la ley y al Derecho. Las instrucciones del Gobierno, las resoluciones judiciales y las órdenes del Gobierno cambian el segundo término, o ambos, por algo que el artículo no dice."
  citation: "art. 103.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-104
- id: m01-l03-q0038
  prompt:
    es: "Señale la opción correcta sobre la misión de las Fuerzas y Cuerpos de seguridad, según el artículo 104.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Garantizar la soberanía e independencia de España y defender su integridad territorial."
  - id: b
    text:
      es: "Defender el ordenamiento constitucional y la unidad de la Nación española."
  - id: c
    correct: true
    text:
      es: "Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana."
  - id: d
    text:
      es: "Ejercer la función ejecutiva y la potestad reglamentaria en materia de seguridad."
  explanation:
    es: "El artículo 104.1 les asigna proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana. Garantizar la soberanía y la integridad territorial es la misión de las Fuerzas Armadas, según el artículo 8.1. Defender el ordenamiento constitucional y la unidad de la Nación tampoco es la misión que fija este artículo. La función ejecutiva y la potestad reglamentaria son del Gobierno, según el artículo 97."
  citation: "art. 104.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-107
- id: m01-l03-q0039
  prompt:
    es: "¿Cuál de las siguientes materias regula una ley orgánica en relación con el Consejo de Estado, supremo órgano consultivo del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Su composición y su competencia."
  - id: b
    text:
      es: "Su régimen económico y su sede."
  - id: c
    text:
      es: "El nombramiento de sus miembros por el Congreso de los Diputados."
  - id: d
    text:
      es: "Su dependencia orgánica del Ministerio de la Presidencia."
  explanation:
    es: "El artículo 107 dice que una ley orgánica regulará la composición y la competencia del Consejo de Estado. El régimen económico, el nombramiento por el Congreso y la dependencia de un Ministerio no están en el artículo."
  citation: "art. 107 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
