  tags:
  - "concepto"
# anchor: fuente-rfc5322-formato-mensaje-txt
- id: m02-l11-q244
  prompt:
    es: "Según el RFC 5322, Internet Message Format, ¿cuál de las siguientes opciones indica los únicos campos de cabecera obligatorios de un mensaje de correo?"
  options:
  - id: a
    text:
      es: "El asunto (Subject) y la fecha de origen (Date)."
  - id: b
    correct: true
    text:
      es: "La fecha de origen (Date) y las direcciones del originador (From)."
  - id: c
    text:
      es: "El destinatario (To) y el asunto (Subject)."
  - id: d
    text:
      es: "Las direcciones del originador (From) y del destinatario (To)."
  explanation:
    es: "El RFC 5322 dice que los únicos campos de cabecera obligatorios son la fecha de origen y las direcciones del originador. El destinatario y el asunto no lo son: todos los demás campos son sintácticamente opcionales. El asunto con la fecha falla por el asunto, que es opcional. El originador con el destinatario falla por el destinatario, que tampoco es obligatorio."
  citation: "fuente: `rfc5322-formato-mensaje.txt`; «The only required header fields are the origination date field and the originator address field(s).»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc5321-smtp-txt
- id: m02-l11-q245
  prompt:
    es: "Según el RFC 5321, Simple Mail Transfer Protocol, ¿cuál es la longitud máxima total de la parte local de una dirección de correo electrónico?"
  options:
  - id: a
    text:
      es: "255 octetos"
  - id: b
    text:
      es: "256 octetos"
  - id: c
    text:
      es: "128 octetos"
  - id: d
    correct: true
    text:
      es: "64 octetos"
  explanation:
    es: "La longitud máxima total de un nombre de usuario u otra parte local es de 64 octetos. 255 octetos es el máximo del nombre de dominio. 256 octetos es el máximo de la ruta, con los signos de puntuación y los separadores. 128 octetos no corresponde a ningún límite de las longitudes de dirección de la norma."
  citation: "fuente: `rfc5321-smtp.txt`; «4.5.3.1.1. Local-part»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-rfc5321-smtp-txt
- id: m02-l11-q246
  prompt:
    es: "Según el RFC 5321, Simple Mail Transfer Protocol, ¿cuál es la longitud máxima total de un nombre de dominio?"
  options:
  - id: a
    text:
      es: "64 octetos"
  - id: b
    text:
      es: "256 octetos"
  - id: c
    correct: true
    text:
      es: "255 octetos"
  - id: d
    text:
      es: "1000 octetos"
  explanation:
    es: "La longitud máxima total de un nombre de dominio o número es de 255 octetos. 64 octetos es el límite de la parte local. 256 octetos es el de la ruta completa, que incluye los signos de puntuación y los separadores. 1000 octetos es la longitud máxima de una línea de texto con el CRLF, no de un dominio."
  citation: "fuente: `rfc5321-smtp.txt`; «4.5.3.1.2. Domain»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-rfc5321-smtp-txt
- id: m02-l11-q247
  prompt:
    es: "Según el RFC 5321, ¿cuál de las siguientes opciones es el objetivo del protocolo SMTP?"
  options:
  - id: a
    text:
      es: "Dejar los mensajes en el servidor para leerlos desde varios dispositivos."
  - id: b
    text:
      es: "Cifrar el contenido de los mensajes de extremo a extremo."
  - id: c
    text:
      es: "Descargar el correo al equipo y eliminarlo del servidor."
  - id: d
    correct: true
    text:
      es: "Transferir correo de forma fiable y eficiente."
  explanation:
    es: "El RFC 5321 dice que el objetivo de SMTP es transferir correo de forma fiable y eficiente. Descargar y eliminar del servidor es lo que hace POP. Dejar los mensajes en el servidor para leerlos desde varios dispositivos es lo que hace IMAP. El cifrado de extremo a extremo no figura como objetivo del protocolo: la página sobre cifrado lo atribuye a S/MIME."
  citation: "fuente: `rfc5321-smtp.txt`; «1.1. Transport of Electronic Mail»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l11-q248
  prompt:
    es: "Según el glosario de ciberseguridad de INCIBE, ¿cuál de las siguientes opciones describe el reparto de tareas entre SMTP y los protocolos POP o IMAP?"
  options:
  - id: a
    text:
      es: "SMTP almacena el correo en el servidor y POP o IMAP lo cifran."
  - id: b
    text:
      es: "SMTP se encarga de recibir el correo y POP o IMAP, de enviarlo."
  - id: c
    correct: true
    text:
      es: "SMTP se encarga de enviar el correo y POP o IMAP, de recibirlo."
  - id: d
    text:
      es: "SMTP y POP envían el correo e IMAP lo recibe."
  explanation:
    es: "El glosario atribuye a SMTP la tarea específica de enviar correo, y la recepción a POP o IMAP. Invertir los papeles contradice esa frase. Que SMTP y POP envíen e IMAP reciba mezcla los tres protocolos: POP e IMAP son los de recepción. Almacenar en el servidor y cifrar no se atribuye a ninguno de ellos: el glosario habla solo de enviar y recibir."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.18.16. SMTP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-agregar-cuenta-html
- id: m02-l11-q254
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes rutas se abre para agregar una cuenta de correo electrónico?"
  options:
  - id: a
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: b
    text:
      es: "Archivo › Opciones › Buscar"
  - id: c
    correct: true
    text:
      es: "Archivo › Agregar cuenta"
  - id: d
    text:
      es: "Archivo › Administrar reglas y alertas"
  explanation:
    es: "Para agregar una cuenta se abre Outlook y se selecciona Archivo y Agregar cuenta. Archivo › Administrar reglas y alertas lleva al cuadro de reglas. Archivo › Herramientas › Limpieza de buzón abre la herramienta que muestra el tamaño del buzón. Archivo › Opciones › Buscar sirve para fijar el ámbito de búsqueda predeterminado."
  citation: "fuente: `ms-outlook-agregar-cuenta.html`; «Abra Outlook y seleccioneAgregar cuentaa archivo>.»"
  difficulty: 1
  tags:
  - "ofimática-menú"
