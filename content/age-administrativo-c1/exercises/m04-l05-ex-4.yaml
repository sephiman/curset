# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q101
  prompt:
    es: "De acuerdo con el artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos tienen derecho a la formación continua y a la actualización permanente de sus conocimientos:"
  options:
  - id: a
    correct: true
    text:
      es: "Y capacidades profesionales, preferentemente en horario laboral."
  - id: b
    text:
      es: "Y capacidades profesionales, siempre dentro del horario laboral."
  - id: c
    text:
      es: "Y capacidades profesionales, preferentemente fuera del horario laboral."
  - id: d
    text:
      es: "Y capacidades profesionales, exclusivamente fuera del horario laboral."
  explanation:
    es: "La letra g) del artículo 14 dice «preferentemente en horario laboral». La opción de hacerlo exclusivamente fuera del horario y la de preferirlo fuera del horario invierten la regla. La opción de hacerlo siempre dentro del horario cambia «preferentemente» por una obligación que el artículo no impone."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q102
  prompt:
    es: "Según el artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el derecho a la defensa jurídica y protección de la Administración Pública alcanza a los procedimientos:"
  options:
  - id: a
    text:
      es: "Ante el orden penal únicamente, derivados del ejercicio legítimo de sus funciones o cargos públicos."
  - id: b
    text:
      es: "Ante el orden contencioso-administrativo, derivados del ejercicio legítimo de sus funciones o cargos."
  - id: c
    text:
      es: "Ante cualquier orden jurisdiccional, derivados de cualquier actuación del empleado, legítima o no."
  - id: d
    correct: true
    text:
      es: "Ante cualquier orden jurisdiccional, derivados del ejercicio legítimo de sus funciones o cargos públicos."
  explanation:
    es: "La letra f) protege en los procedimientos «ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos». No se limita al orden penal ni al contencioso-administrativo. Tampoco cubre cualquier actuación: el ejercicio tiene que ser legítimo."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q103
  prompt:
    es: "¿Cuál de los siguientes derechos de carácter individual recoge el artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "A la inamovilidad en el puesto de trabajo concreto que desempeñe en cada momento."
  - id: b
    text:
      es: "A percibir el complemento de productividad en la misma cuantía cada año."
  - id: c
    correct: true
    text:
      es: "A la desconexión digital, en los términos de la legislación de protección de datos."
  - id: d
    text:
      es: "A la elección del puesto de trabajo dentro de su Cuerpo o Escala de pertenencia."
  explanation:
    es: "La letra j bis) reconoce la desconexión digital «en los términos establecidos en la legislación vigente en materia de protección de datos personales». La inamovilidad de la letra a) es en la condición de funcionario de carrera, no en un puesto concreto. El artículo no da derecho a elegir puesto dentro del Cuerpo ni a cobrar la productividad en una cuantía fija: la letra d) habla solo de percibir las retribuciones."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q104
  prompt:
    es: "Conforme al artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos tienen derecho a la libertad de expresión:"
  options:
  - id: a
    text:
      es: "Sin más límites que los que fije su superior jerárquico."
  - id: b
    correct: true
    text:
      es: "Dentro de los límites del ordenamiento jurídico."
  - id: c
    text:
      es: "Dentro de los límites que establezca la Junta de Personal."
  - id: d
    text:
      es: "Solo fuera del ejercicio de sus funciones públicas."
  explanation:
    es: "La letra k) dice «a la libertad de expresión dentro de los límites del ordenamiento jurídico». El límite lo pone el ordenamiento, no el superior jerárquico ni la Junta de Personal. El artículo tampoco reduce el derecho al tiempo fuera de las funciones."
  citation: "art. 14 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q105
  prompt:
    es: "Entre los derechos individuales de los empleados públicos figura la progresión en la carrera profesional y la promoción interna según los principios constitucionales de:"
  options:
  - id: a
    text:
      es: "Igualdad, mérito y antigüedad, con sistemas objetivos y transparentes de evaluación."
  - id: b
    correct: true
    text:
      es: "Igualdad, mérito y capacidad, con sistemas objetivos y transparentes de evaluación."
  - id: c
    text:
      es: "Antigüedad, mérito y capacidad, con sistemas objetivos y transparentes de evaluación."
  - id: d
    text:
      es: "Igualdad, mérito y capacidad, valorando de forma exclusiva la antigüedad."
  explanation:
    es: "La letra c) del artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público habla de «principios constitucionales de igualdad, mérito y capacidad» y de «sistemas objetivos y transparentes de evaluación». La antigüedad no es uno de esos principios, ni en lugar de la igualdad ni en lugar de la capacidad. Una valoración exclusiva de la antigüedad contradice la evaluación objetiva que pide el artículo."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m04-l05-q106
  prompt:
    es: "Señale la respuesta correcta sobre la libre asociación profesional en el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Solo se reconoce al personal laboral, a través de su convenio colectivo."
  - id: b
    text:
      es: "Solo se reconoce a los funcionarios de carrera, no al resto de empleados."
  - id: c
    text:
      es: "Figura entre los derechos individuales que se ejercen de forma colectiva."
  - id: d
    correct: true
    text:
      es: "Figura entre los derechos individuales de los empleados públicos."
  explanation:
    es: "La letra p) del artículo 14 la incluye entre los derechos «de carácter individual» de «los empleados públicos». La lista del artículo 15, la de los derechos que se ejercen de forma colectiva, no la recoge: allí están la libertad sindical, la negociación colectiva, la huelga, los conflictos colectivos y la reunión. El artículo 14 se refiere a todos los empleados públicos, no solo a los funcionarios de carrera ni solo al personal laboral."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-15
- id: m04-l05-q107
  prompt:
    es: "Según el artículo 15 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos tienen derecho al ejercicio de la huelga:"
  options:
  - id: a
    correct: true
    text:
      es: "Con la garantía del mantenimiento de los servicios esenciales de la comunidad."
  - id: b
    text:
      es: "Solo cuando la convoque la Junta de Personal del centro de trabajo."
  - id: c
    text:
      es: "Con la garantía de los servicios mínimos que fijen los sindicatos convocantes."
  - id: d
    text:
      es: "Previa autorización del órgano competente en materia de personal."
  explanation:
    es: "La letra c) del artículo 15 dice «al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad». La garantía no la fijan los sindicatos convocantes. El artículo no exige autorización del órgano de personal ni reserva la convocatoria a la Junta de Personal."
  citation: "art. 15 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-30
- id: m04-l05-q108
  prompt:
    es: "De acuerdo con el artículo 30.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la deducción proporcional de haberes por la parte de jornada no realizada se aplica:"
  options:
  - id: a
    text:
      es: "En lugar de la sanción disciplinaria, que queda excluida por esos hechos."
  - id: b
    text:
      es: "Solo cuando no proceda imponer una sanción disciplinaria por esos hechos."
  - id: c
    correct: true
    text:
      es: "Sin perjuicio de la sanción disciplinaria que pueda corresponder."
  - id: d
    text:
      es: "Solo después de que la sanción disciplinaria por esos hechos sea firme."
  explanation:
    es: "El artículo 30.1 empieza «Sin perjuicio de la sanción disciplinaria que pueda corresponder». La deducción y la sanción pueden concurrir. No depende de que no proceda sanción, no la sustituye y no espera a que sea firme."
  citation: "art. 30.1 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-30
- id: m04-l05-q109
  prompt:
    es: "Según el artículo 30.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, respecto del tiempo en que un funcionario ha permanecido en huelga:"
  options:
  - id: a
    text:
      es: "Devenga las retribuciones de ese tiempo, pero no las percibe hasta recuperarlo."
  - id: b
    text:
      es: "Percibe las retribuciones de ese tiempo si la huelga se convocó legalmente."
  - id: c
    correct: true
    text:
      es: "No devenga ni percibe las retribuciones correspondientes a ese tiempo."
  - id: d
    text:
      es: "Devenga y percibe la mitad de las retribuciones correspondientes a ese tiempo."
  explanation:
    es: "El artículo 30.2 dice que quienes ejercen la huelga «no devengarán ni percibirán las retribuciones correspondientes al tiempo» de huelga. No hay devengo con cobro aplazado. Que la huelga sea legal no da derecho a cobrar ese tiempo. Tampoco se cobra la mitad."
  citation: "art. 30.2 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-46
- id: m04-l05-q110
  prompt:
    es: "De acuerdo con el artículo 46.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, están legitimados para convocar una reunión los empleados públicos de las Administraciones respectivas en número no inferior al:"
  options:
  - id: a
    text:
      es: "50 por 100 del colectivo convocado."
  - id: b
    correct: true
    text:
      es: "40 por 100 del colectivo convocado."
  - id: c
    text:
      es: "33 por 100 del colectivo convocado."
  - id: d
    text:
      es: "25 por 100 del colectivo convocado."
  explanation:
    es: "La letra d) del artículo 46.1 fija «número no inferior al 40 por 100 del colectivo convocado». El 25, el 33 y el 50 por 100 no aparecen en el artículo."
  citation: "art. 46.1 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-46
- id: m04-l05-q111
  prompt:
    es: "Según el artículo 46.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de las organizaciones sindicales, ¿quién está legitimado para convocar una reunión?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Delegados de Personal."
  - id: b
    text:
      es: "La unidad de recursos humanos del centro."
  - id: c
    text:
      es: "El Subsecretario del Departamento."
  - id: d
    text:
      es: "La Dirección General de la Función Pública."
  explanation:
    es: "El artículo 46.1 legitima a los Delegados de Personal, las Juntas de Personal, los Comités de Empresa y los empleados en número no inferior al 40 por 100. Es un derecho de la representación y del personal. El Subsecretario, la Dirección General de la Función Pública y la unidad de recursos humanos son la Administración y no figuran en la lista."
  citation: "art. 46.1 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q112
  prompt:
    es: "De acuerdo con el artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el permiso por accidente o enfermedad graves u hospitalización de un familiar alcanza a los parientes:"
  options:
  - id: a
    text:
      es: "Hasta el cuarto grado de consanguinidad o afinidad."
  - id: b
    text:
      es: "Hasta el primer grado de consanguinidad, sin incluir la afinidad."
  - id: c
    text:
      es: "Hasta el tercer grado de consanguinidad y el segundo de afinidad."
  - id: d
    correct: true
    text:
      es: "Hasta el segundo grado de consanguinidad o afinidad."
  explanation:
    es: "El artículo 48.a) da cinco días hábiles por los parientes «hasta el primer grado por consanguinidad o afinidad» y cuatro por los de «segundo grado de consanguinidad o afinidad». Más allá del segundo grado no hay permiso por parentesco, ni en el tercero ni en el cuarto. La afinidad está incluida desde el primer grado."
  citation: "art. 48.a) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q113
  prompt:
    es: "Una funcionaria con jornada de lunes a viernes inicia el jueves 11 de febrero de 2027 el permiso por la hospitalización de su padre, pariente de primer grado. No hay festivos en esas fechas. ¿Cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El martes 16 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles 17 de febrero de 2027."
  - id: c
    text:
      es: "El jueves 18 de febrero de 2027."
  - id: d
    text:
      es: "El lunes 15 de febrero de 2027."
  explanation:
    es: "La hospitalización de un pariente de primer grado da «cinco días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Con jornada de lunes a viernes cuentan el jueves 11, el viernes 12, el lunes 15, el martes 16 y el miércoles 17. El lunes 15 sale de contar cinco días naturales. El martes 16 sale de contar cuatro días, que es el permiso del segundo grado. El jueves 18 añade un sexto día."
  citation: "art. 48.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q114
  prompt:
    es: "Un funcionario con jornada de lunes a viernes inicia el viernes 20 de noviembre de 2026 el permiso por el fallecimiento de su abuela, familiar de segundo grado, en otra localidad. Sin festivos en el periodo, ¿cuál es el último día del permiso?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 25 de noviembre de 2026."
  - id: b
    text:
      es: "El martes 24 de noviembre de 2026."
  - id: c
    text:
      es: "El jueves 26 de noviembre de 2026."
  - id: d
    text:
      es: "El lunes 23 de noviembre de 2026."
  explanation:
    es: "El fallecimiento de un familiar de segundo grado en distinta localidad da «cuatro días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Cuentan el viernes 20, el lunes 23, el martes 24 y el miércoles 25. El lunes 23 corresponde a los dos días de la misma localidad. El martes 24, a tres días, que es el fallecimiento de primer grado en la misma localidad. El jueves 26, a cinco días, que es el de primer grado en distinta localidad."
  citation: "art. 48.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q115
  prompt:
    es: "Un funcionario con jornada de lunes a viernes inicia el jueves 28 de enero de 2027 el permiso por el fallecimiento de su suegro, familiar de primer grado por afinidad, en su misma localidad. Sin festivos en el periodo, ¿cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El sábado 30 de enero de 2027."
  - id: b
    text:
      es: "El miércoles 3 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: d
    text:
      es: "El viernes 29 de enero de 2027."
  explanation:
    es: "El fallecimiento de un familiar de primer grado, también por afinidad, en la misma localidad da «tres días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Cuentan el jueves 28, el viernes 29 y, saltando el fin de semana, el lunes 1 de febrero. El sábado 30 sale de contar días naturales. El viernes 29 corresponde a dos días, el permiso del segundo grado. El miércoles 3 corresponde a cinco días, el de distinta localidad."
  citation: "art. 48.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
