# anchor: boe-a-2006-20764-art-27
- id: m03-l15-q0244
  prompt:
    es: "¿Cuándo se entiende, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, que el arrendamiento de inmuebles se realiza como actividad económica?"
  options:
  - id: a
    text:
      es: "Únicamente cuando los inmuebles arrendados sean locales y no viviendas."
  - id: b
    correct: true
    text:
      es: "Únicamente cuando para su ordenación se utilice, al menos, una persona empleada con contrato laboral y a jornada completa."
  - id: c
    text:
      es: "Siempre que el arrendador se dé de alta en el censo de empresarios, profesionales y retenedores."
  - id: d
    text:
      es: "Siempre que se arrienden más de tres inmuebles a lo largo del período impositivo."
  explanation:
    es: "El criterio es una persona empleada con contrato laboral y jornada completa (art. 27.2 LIRPF). El número de inmuebles, el alta censal y la clase de inmueble no son condiciones del precepto."
  citation: "art. 27.2 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "arrendamiento"
# anchor: boe-a-2006-20764-art-28
- id: m03-l15-q0251
  prompt:
    es: "¿En cuál de los siguientes rendimientos se determina el rendimiento neto según las normas del Impuesto sobre Sociedades, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "En los rendimientos del trabajo."
  - id: b
    text:
      es: "En los rendimientos del capital mobiliario."
  - id: c
    correct: true
    text:
      es: "En los rendimientos de actividades económicas."
  - id: d
    text:
      es: "En los rendimientos del capital inmobiliario."
  explanation:
    es: "El rendimiento neto de las actividades económicas se calcula según las normas del Impuesto sobre Sociedades (art. 28.1 LIRPF). El del trabajo se obtiene restando los gastos de la lista del artículo 19.2, el inmobiliario deduce los gastos necesarios del artículo 23, y el mobiliario sigue el artículo 26."
  citation: "art. 28.1 LIRPF"
  difficulty: 1
  tags:
  - "actividades económicas"
  - "comparación"
# anchor: boe-a-2006-20764-art-32
- id: m03-l15-q0253
  prompt:
    es: "¿Cuál de las siguientes reducciones de los rendimientos de actividades económicas es del 20 por ciento, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La que aplican los contribuyentes que inician el ejercicio de una actividad económica y determinan el rendimiento neto por estimación directa."
  - id: b
    text:
      es: "La que se aplica a los rendimientos con período de generación superior a dos años imputados en un único período impositivo."
  - id: c
    text:
      es: "La que se aplica a los contribuyentes que renuncian a la estimación objetiva y pasan a la estimación directa."
  - id: d
    text:
      es: "La que se aplica a los rendimientos calificados reglamentariamente como obtenidos de forma notoriamente irregular en el tiempo."
  explanation:
    es: "La reducción del 20 por ciento es la de inicio de actividad con estimación directa (art. 32.3 LIRPF). Las de generación superior a dos años y de irregularidad notoria son del 30 por ciento (art. 32.1), y la renuncia a la estimación objetiva solo obliga a aplicar la estimación directa durante tres años (art. 31.1.5.ª)."
  citation: "art. 32.3 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "reducción"
# anchor: boe-a-2006-20764-art-16
- id: m03-l15-q0266
  prompt:
    es: "Conforme al artículo 16.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la estimación objetiva de rendimientos se aplica para determinadas actividades económicas, en los términos que:"
  options:
  - id: a
    text:
      es: "fije cada año la Ley de Presupuestos Generales del Estado."
  - id: b
    correct: true
    text:
      es: "reglamentariamente se establezcan."
  - id: c
    text:
      es: "determine el contribuyente en su declaración del impuesto."
  - id: d
    text:
      es: "establezcan las Comunidades Autónomas en el ejercicio de sus competencias."
  explanation:
    es: "La estimación objetiva se aplica a determinadas actividades en los términos que se establezcan reglamentariamente (art. 16.2.b) LIRPF). No depende de la ley anual de presupuestos, de la elección del contribuyente ni de las Comunidades Autónomas."
  citation: "art. 16.2 LIRPF"
  difficulty: 1
  tags:
  - "métodos"
  - "estimación objetiva"
# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0277
  prompt:
    es: "Julia Ferrer inició una actividad económica de peluquería el 1 de julio de 2025 y obtuvo hasta el 31 de diciembre de 2025 unos rendimientos íntegros de 80.000 euros, todos por operaciones con consumidores finales sin obligación de expedir factura. No tiene otra actividad. Atendiendo solo al volumen de rendimientos íntegros del conjunto de actividades, según el artículo 31.1.3.ª.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede aplicar en 2026 la estimación objetiva?"
  options:
  - id: a
    text:
      es: "Sí, porque los 80.000 euros efectivamente obtenidos no superan los 150.000 euros del límite."
  - id: b
    text:
      es: "No, porque los 80.000 euros obtenidos superan los 75.000 euros del límite aplicable a su caso."
  - id: c
    correct: true
    text:
      es: "No, porque al elevarse al año el volumen de 2025 resulta superior a 150.000 euros."
  - id: d
    text:
      es: "Sí, porque en el año de inicio de la actividad no se aplica el límite de rendimientos íntegros."
  explanation:
    es: "Si en el año inmediato anterior se hubiese iniciado una actividad, el volumen de ingresos se eleva al año (art. 31.1.3.ª.b). Julia ejerció 184 días en 2025, de modo que 80.000 × 365 / 184 = 158.695,65 euros, más que los 150.000 euros de 2026 para el conjunto de actividades que no son agrícolas, ganaderas ni forestales. Los 80.000 euros sin elevar sí quedarían por debajo, pero la norma manda elevarlos. El límite de 75.000 euros es solo para operaciones por las que se esté obligado a expedir factura a empresarios o profesionales, y aquí no las hay. El año de inicio no exime del límite: precisamente por eso la norma eleva el volumen al año."
  citation: "art. 31.1.3.ª LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "estimación objetiva"
