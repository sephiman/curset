# anchor: boe-a-2003-23186-art-237
- id: m03-l14-q0185
  prompt:
    es: "De acuerdo con el artículo 237.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las reclamaciones y recursos económico-administrativos someten a conocimiento del órgano competente todas las cuestiones de hecho y de derecho que ofrezca el expediente, hayan sido o no planteadas, sin que en ningún caso pueda:"
  options:
  - id: a
    text:
      es: "Anular el acto por defectos formales."
  - id: b
    text:
      es: "Imponer costas al reclamante."
  - id: c
    correct: true
    text:
      es: "Empeorar la situación inicial del reclamante."
  - id: d
    text:
      es: "Mejorar la situación inicial del reclamante."
  explanation:
    es: "El artículo 237.1 prohíbe empeorar la situación inicial del reclamante. Mejorarla no está prohibido, y anular por defectos formales o imponer costas por temeridad son facultades de otros preceptos (arts. 239.3 y 234.5)."
  citation: "art. 237.1 LGT"
  difficulty: 1
  tags:
  - "resolución"
  - "extensión"
# anchor: boe-a-2003-23186-art-238
- id: m03-l14-q0186
  prompt:
    es: "Respecto a las formas de terminación del procedimiento económico-administrativo, según el artículo 238.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "El procedimiento finaliza por renuncia, por desistimiento, por transacción con la Administración y mediante resolución."
  - id: b
    text:
      es: "El procedimiento finaliza solo mediante resolución expresa, sin que quepa renuncia ni desistimiento."
  - id: c
    correct: true
    text:
      es: "El procedimiento finaliza por renuncia, por desistimiento, por caducidad de la instancia, por satisfacción extraprocesal y mediante resolución."
  - id: d
    text:
      es: "El procedimiento finaliza por renuncia, por prescripción del derecho y mediante resolución."
  explanation:
    es: "El artículo 238.1 enumera cinco formas: renuncia al derecho, desistimiento de la petición o instancia, caducidad de esta, satisfacción extraprocesal y resolución. No solo la resolución. No existe la transacción con la Administración en ese listado. Y la prescripción no es una forma de terminación."
  citation: "art. 238.1 LGT"
  difficulty: 2
  tags:
  - "terminación"
  - "modos"
# anchor: boe-a-2003-23186-art-239
- id: m03-l14-q0187
  prompt:
    es: "Conforme al artículo 239.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la resolución de una reclamación económico-administrativa puede ser estimatoria, desestimatoria o declarar:"
  options:
  - id: a
    correct: true
    text:
      es: "La inadmisibilidad."
  - id: b
    text:
      es: "La nulidad de pleno derecho del acto."
  - id: c
    text:
      es: "La caducidad del procedimiento."
  - id: d
    text:
      es: "La suspensión del acto reclamado."
  explanation:
    es: "La resolución puede ser estimatoria, desestimatoria o declarar la inadmisibilidad (art. 239.3). La caducidad es una forma de terminación de la instancia, no un tipo de resolución. La suspensión y la nulidad de pleno derecho son pronunciamientos de otros procedimientos."
  citation: "art. 239.3 LGT"
  difficulty: 1
  tags:
  - "resolución"
  - "tipos"
# anchor: boe-a-2003-23186-art-239
- id: m03-l14-q0188
  prompt:
    es: "Según el artículo 239.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se declara la inadmisibilidad cuando se impugnen actos o resoluciones no susceptibles de reclamación o recurso en vía económico-administrativa, o cuando la reclamación se haya presentado:"
  options:
  - id: a
    text:
      es: "Ante un tribunal territorialmente incompetente."
  - id: b
    text:
      es: "Sin aportar garantía suficiente del importe."
  - id: c
    correct: true
    text:
      es: "Fuera de plazo."
  - id: d
    text:
      es: "Sin la firma del reclamante en el escrito."
  explanation:
    es: "La presentación fuera de plazo es causa de inadmisibilidad (art. 239.4.b). La falta de garantía, la incompetencia territorial y la falta de firma no figuran en la lista. La garantía solo se exige para suspender."
  citation: "art. 239.4 LGT"
  difficulty: 1
  tags:
  - "resolución"
  - "inadmisibilidad"
# anchor: boe-a-2003-23186-art-239
- id: m03-l14-q0189
  prompt:
    es: "En relación con las causas de inadmisibilidad del artículo 239.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se declara la inadmisibilidad cuando el reclamante no haya interpuesto previamente recurso de reposición."
  - id: b
    text:
      es: "Se declara la inadmisibilidad cuando la cuantía de la reclamación sea inferior a seis mil euros."
  - id: c
    text:
      es: "Se declara la inadmisibilidad cuando el órgano que dictó el acto no remita el expediente en plazo."
  - id: d
    correct: true
    text:
      es: "Se declara la inadmisibilidad cuando concurran defectos de legitimación o de representación."
  explanation:
    es: "Los defectos de legitimación o de representación son la letra e) del artículo 239.4. La cuantía inferior a seis mil euros solo lleva al procedimiento abreviado. La reposición es potestativa. Y el retraso del órgano en remitir el expediente no inadmite la reclamación: el reclamante puede presentar la copia sellada del escrito (art. 235.3)."
  citation: "art. 239.4 LGT"
  difficulty: 2
  tags:
  - "resolución"
  - "inadmisibilidad"
# anchor: boe-a-2003-23186-art-240
- id: m03-l14-q0190
  prompt:
    es: "¿Cuál es la duración del procedimiento económico-administrativo en cualquiera de sus instancias, conforme al artículo 240.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Tres meses contados desde la interposición de la reclamación."
  - id: b
    text:
      es: "Seis meses contados desde la interposición de la reclamación."
  - id: c
    correct: true
    text:
      es: "Un año contado desde la interposición de la reclamación."
  - id: d
    text:
      es: "Dos años contados desde la interposición de la reclamación."
  explanation:
    es: "El procedimiento general dura un año desde la interposición (art. 240.1). Seis meses es el plazo del procedimiento abreviado (art. 247.2) y tres meses el del recurso extraordinario de alzada para unificación de criterio (art. 242.3). Dos años no es plazo de este artículo."
  citation: "art. 240.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "resolución"
  - "reclamación"
# anchor: boe-a-2003-23186-art-240
- id: m03-l14-q0191
  prompt:
    es: "Mario Roldán Ibarra interpone una reclamación económico-administrativa en primera instancia contra una liquidación. Transcurrido un año desde la interposición, el tribunal no le ha notificado resolución. Según el artículo 240.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede hacer?"
  options:
  - id: a
    text:
      es: "Entender estimada la reclamación y anulada la liquidación."
  - id: b
    text:
      es: "Esperar a la resolución, porque el tribunal no puede resolver una vez transcurrido el año."
  - id: c
    correct: true
    text:
      es: "Entender desestimada la reclamación al objeto de interponer el recurso procedente."
  - id: d
    text:
      es: "Entender caducado el procedimiento y volver a interponer la reclamación."
  explanation:
    es: "Pasado el año sin resolución, el interesado puede entender desestimada la reclamación para interponer el recurso procedente (art. 240.1). El silencio no es estimatorio. No hay caducidad del procedimiento. Y el tribunal debe resolver expresamente en todo caso."
  citation: "art. 240.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "reclamación"
  - "silencio"
# anchor: boe-a-2003-23186-art-241
- id: m03-l14-q0193
  prompt:
    es: "Según el artículo 241.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué plazo se interpone el recurso de alzada ordinario ante el Tribunal Económico-Administrativo Central?"
  options:
  - id: a
    correct: true
    text:
      es: "Un mes contado desde el día siguiente al de la notificación de las resoluciones."
  - id: b
    text:
      es: "Tres meses contados desde el día siguiente al de la notificación de las resoluciones."
  - id: c
    text:
      es: "Quince días contados desde el día siguiente al de la notificación de las resoluciones."
  - id: d
    text:
      es: "Dos meses contados desde el día siguiente al de la notificación de las resoluciones."
  explanation:
    es: "El alzada ordinario se interpone en un mes desde el día siguiente al de la notificación (art. 241.1). Quince días es el del recurso de anulación y tres meses el de los extraordinarios. Dos meses no corresponde a este recurso."
  citation: "art. 241.1 LGT"
  difficulty: 1
  tags:
  - "alzada"
  - "plazo"
# anchor: boe-a-2003-23186-art-241
- id: m03-l14-q0194
  prompt:
    es: "Se notifica a una sociedad el jueves 21 de mayo de 2026 la resolución dictada en primera instancia por un tribunal económico-administrativo regional, contra la que cabe alzada ordinario. El plazo se cuenta según los apartados 4 y 5 del artículo 30 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin otros festivos que los fines de semana. Conforme al artículo 241.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo para interponer el recurso termina el:"
  options:
  - id: a
    correct: true
    text:
      es: "Lunes 22 de junio de 2026."
  - id: b
    text:
      es: "Viernes 19 de junio de 2026."
  - id: c
    text:
      es: "Domingo 21 de junio de 2026."
  - id: d
    text:
      es: "Martes 23 de junio de 2026."
  explanation:
    es: "El mes empieza a contar el 22 de mayo y termina el 21 de junio de 2026, que es domingo. Al ser inhábil, el plazo se prorroga al lunes 22 de junio (art. 30.5 LPAC). El domingo es el vencimiento teórico. El 19 se queda corto y el 23 ya está fuera de plazo."
  citation: "art. 241.1 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "alzada"
# anchor: boe-a-2003-23186-art-241-bis
- id: m03-l14-q0196
  prompt:
    es: "Según el artículo 241 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué plazo se interpone el recurso de anulación contra las resoluciones de las reclamaciones económico-administrativas ante el tribunal que las dictó?"
  options:
  - id: a
    text:
      es: "Un mes contado desde el día siguiente a la notificación."
  - id: b
    correct: true
    text:
      es: "Quince días."
  - id: c
    text:
      es: "Seis meses contados desde el día siguiente a la notificación."
  - id: d
    text:
      es: "Tres meses contados desde el día siguiente a la notificación."
  explanation:
    es: "El recurso de anulación tiene el plazo más corto de la vía económico-administrativa: quince días (art. 241 bis.1). Un mes es el de la reposición, la reclamación y el alzada ordinario. Tres meses es el de los extraordinarios, y seis meses es un plazo para resolver, no para interponer."
  citation: "art. 241 bis.1 LGT"
  difficulty: 1
  tags:
  - "anulación"
  - "plazo"
# anchor: boe-a-2003-23186-art-242
- id: m03-l14-q0200
  prompt:
    es: "Se notifica el martes 10 de febrero de 2026 a un Director de Departamento de la Agencia Estatal de Administración Tributaria la resolución de un tribunal regional que estima gravemente dañosa y errónea, sin que quepa alzada ordinario. El plazo se cuenta según los apartados 4 y 5 del artículo 30 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin otros festivos que los fines de semana. Según el artículo 242.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo para interponer el recurso extraordinario de alzada para la unificación de criterio termina el:"
  options:
  - id: a
    text:
      es: "Lunes 10 de agosto de 2026."
  - id: b
    text:
      es: "Martes 10 de marzo de 2026."
  - id: c
    text:
      es: "Domingo 10 de mayo de 2026."
  - id: d
    correct: true
    text:
      es: "Lunes 11 de mayo de 2026."
  explanation:
    es: "El plazo es de tres meses desde el día siguiente a la notificación y termina el 10 de mayo de 2026, que es domingo. Al ser inhábil se prorroga al lunes 11 de mayo (art. 30.5 LPAC). El domingo es el vencimiento teórico. El 10 de marzo sería a un mes, que es el plazo del alzada ordinario, y el 10 de agosto a seis meses."
  citation: "art. 242.2 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "unificación de criterio"
# anchor: boe-a-2003-23186-art-242
- id: m03-l14-q0202
  prompt:
    es: "Según el artículo 242.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué plazo debe dictarse la resolución del recurso extraordinario de alzada para la unificación de criterio?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de tres meses."
  - id: b
    text:
      es: "En el plazo de seis meses."
  - id: c
    text:
      es: "En el plazo de un año."
  - id: d
    text:
      es: "En el plazo de un mes."
  explanation:
    es: "El plazo para resolver el recurso extraordinario de alzada para unificación de criterio es de tres meses (art. 242.3). Seis meses es el de la unificación de doctrina y el de la revisión. El año es el de la reclamación general y un mes el del recurso de anulación."
  citation: "art. 242.3 LGT"
  difficulty: 2
  tags:
  - "unificación de criterio"
  - "resolución"
# anchor: boe-a-2003-23186-art-242
- id: m03-l14-q0203
  prompt:
    es: "Conforme al artículo 242.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si la resolución no ha sido notificada al órgano legitimado para recurrir, el plazo de tres meses para interponer el recurso extraordinario de alzada se cuenta desde el momento en que dicho órgano tenga conocimiento:"
  options:
  - id: a
    text:
      es: "De la firmeza de la resolución en vía económico-administrativa."
  - id: b
    text:
      es: "Del texto íntegro de la resolución mediante notificación expresa."
  - id: c
    correct: true
    text:
      es: "Del contenido esencial de la resolución por cualquier medio."
  - id: d
    text:
      es: "De la publicación de la resolución en el Boletín Oficial del Estado."
  explanation:
    es: "Si no se notificó al órgano legitimado, el plazo corre desde que conoce el contenido esencial de la resolución por cualquier medio (art. 242.2). No exige texto íntegro ni notificación expresa, ni publicación, ni firmeza."
  citation: "art. 242.2 LGT"
  difficulty: 3
  tags:
  - "unificación de criterio"
  - "plazo"
# anchor: boe-a-2005-8662-art-61
- id: m03-l14-q0206
  prompt:
    es: "Según el artículo 61.4 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, ¿en qué plazo se interpone el recurso extraordinario para la unificación de doctrina?"
  options:
  - id: a
    correct: true
    text:
      es: "Tres meses contados a partir del día siguiente al de la notificación de la resolución."
  - id: b
    text:
      es: "Un mes contado a partir del día siguiente al de la notificación de la resolución."
  - id: c
    text:
      es: "Quince días contados a partir del día siguiente al de la notificación de la resolución."
  - id: d
    text:
      es: "Seis meses contados a partir del día siguiente al de la notificación de la resolución."
  explanation:
    es: "El reglamento fija en tres meses el plazo de interposición del recurso para la unificación de doctrina (art. 61.4 RGRVA). El mes es el de la reposición y el alzada ordinario. Seis meses es el plazo para resolver. Y quince días es el del recurso de anulación."
  citation: "art. 61.4 RGRVA"
  difficulty: 3
  tags:
  - "unificación de doctrina"
  - "plazo"
# anchor: boe-a-2003-23186-art-244
- id: m03-l14-q0208
  prompt:
    es: "Según el artículo 244.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una de las circunstancias del recurso extraordinario de revisión es que al dictar el acto o la resolución hayan influido esencialmente documentos o testimonios declarados falsos por sentencia judicial:"
  options:
  - id: a
    text:
      es: "Firme, únicamente anterior a aquella resolución, y no posterior a ella."
  - id: b
    text:
      es: "Firme, posterior a la interposición del recurso."
  - id: c
    text:
      es: "No firme, anterior a aquella resolución."
  - id: d
    correct: true
    text:
      es: "Firme, anterior o posterior a aquella resolución."
  explanation:
    es: "La letra b) exige sentencia judicial firme, anterior o posterior a la resolución. No hay límite a que sea anterior ni basta una sentencia no firme. Y no se exige que sea posterior a la interposición."
  citation: "art. 244.1 LGT"
  difficulty: 1
  tags:
  - "revisión"
  - "circunstancias"
# anchor: boe-a-2003-23186-art-244
- id: m03-l14-q0209
  prompt:
    es: "Conforme al artículo 244.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recurso extraordinario de revisión puede interponerse por los interesados contra los actos firmes de la Administración tributaria y contra:"
  options:
  - id: a
    text:
      es: "Las liquidaciones provisionales notificadas dentro del último año."
  - id: b
    text:
      es: "Las resoluciones no firmes de los tribunales económico-administrativos regionales."
  - id: c
    correct: true
    text:
      es: "Las resoluciones firmes de los órganos económico-administrativos."
  - id: d
    text:
      es: "Las sentencias firmes de los órganos de la jurisdicción contencioso-administrativa."
  explanation:
    es: "El recurso extraordinario de revisión alcanza a los actos firmes de la Administración tributaria y a las resoluciones firmes de los órganos económico-administrativos (art. 244.1). Las no firmes se recurren por las vías ordinarias. Las sentencias se impugnan en la vía judicial. Y no se limita a liquidaciones provisionales recientes."
  citation: "art. 244.1 LGT"
  difficulty: 2
  tags:
  - "revisión"
  - "sujetos"
# anchor: boe-a-2003-23186-art-244
- id: m03-l14-q0210
  prompt:
    es: "De acuerdo con el artículo 244.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recurso extraordinario de revisión se interpone en el plazo de tres meses a contar desde el conocimiento de los documentos o desde que quedó firme:"
  options:
  - id: a
    text:
      es: "La notificación de la resolución del tribunal regional."
  - id: b
    text:
      es: "El acto o resolución recurridos."
  - id: c
    text:
      es: "La liquidación o el acuerdo de iniciación."
  - id: d
    correct: true
    text:
      es: "La sentencia judicial."
  explanation:
    es: "Los tres meses se cuentan desde el conocimiento de los documentos o desde que quedó firme la sentencia judicial (art. 244.5). No desde la firmeza del acto recurrido ni desde la liquidación o la notificación del tribunal regional."
  citation: "art. 244.5 LGT"
  difficulty: 2
  tags:
  - "revisión"
  - "plazo"
# anchor: boe-a-2003-23186-art-244
- id: m03-l14-q0211
  prompt:
    es: "¿Qué puede entender el interesado si transcurren seis meses sin notificarse resolución expresa del recurso extraordinario de revisión, según el artículo 244.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que el recurso ha sido estimado por silencio."
  - id: b
    text:
      es: "Que el recurso ha sido inadmitido a trámite."
  - id: c
    correct: true
    text:
      es: "Que el recurso ha sido desestimado."
  - id: d
    text:
      es: "Que el procedimiento ha caducado y debe reiniciarse."
  explanation:
    es: "Si pasan seis meses sin resolución, el interesado puede entender desestimado el recurso (art. 244.6). No cabe entenderlo estimado, ni caducado, ni inadmitido."
  citation: "art. 244.6 LGT"
  difficulty: 2
  tags:
  - "revisión"
  - "plazo"
# anchor: boe-a-2003-23186-art-244
- id: m03-l14-q0213
  prompt:
    es: "De acuerdo con el artículo 244.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se declara la inadmisibilidad del recurso extraordinario de revisión cuando se aleguen:"
  options:
  - id: a
    text:
      es: "Circunstancias ya alegadas en una reclamación anterior ante el mismo tribunal."
  - id: b
    correct: true
    text:
      es: "Circunstancias distintas a las previstas en el apartado 1."
  - id: c
    text:
      es: "Circunstancias posteriores a la firmeza del acto."
  - id: d
    text:
      es: "Circunstancias que afecten solo a la cuantía."
  explanation:
    es: "El recurso se inadmite si se alegan circunstancias distintas a las del apartado 1 (art. 244.3). El haberlas alegado antes o ser posteriores a la firmeza no es la causa del precepto, ni lo es que afecten solo a la cuantía."
  citation: "art. 244.3 LGT"
  difficulty: 3
  tags:
  - "revisión"
  - "inadmisibilidad"
# anchor: boe-a-2003-23186-art-242
- id: m03-l14-q0214
  prompt:
    es: "Según los artículos 241.1, 241 bis.1, 242.2 y 244.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de los siguientes recursos económico-administrativos se interpone en el plazo de quince días ante el tribunal que dictó la resolución?"
  options:
  - id: a
    text:
      es: "El recurso extraordinario de revisión."
  - id: b
    correct: true
    text:
      es: "El recurso de anulación."
  - id: c
    text:
      es: "El recurso extraordinario de alzada para la unificación de criterio."
  - id: d
    text:
      es: "El recurso de alzada ordinario."
  explanation:
    es: "El plazo de quince días es el del recurso de anulación (art. 241 bis.1). El alzada ordinario tiene un mes (art. 241.1) y se interpone ante el Tribunal Económico-Administrativo Central. El extraordinario de alzada y el de revisión tienen tres meses (arts. 242.2 y 244.5)."
  citation: "art. 242.2 LGT"
  difficulty: 3
  tags:
  - "plazos"
  - "comparación"
  - "recursos"
# anchor: boe-a-2003-23186-art-244
