# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q224
  prompt:
    es: "Según la página de Microsoft sobre el espaciado en Word 365, ¿qué hace el Interletraje con las letras «A» y «V»?"
  options:
  - id: a
    text:
      es: "Aumenta el espaciado entre ellas, porque no encajan bien"
  - id: b
    text:
      es: "Mantiene el espaciado y estira la forma de las dos letras"
  - id: c
    text:
      es: "Mantiene el espaciado y cambia el espacio vertical entre líneas"
  - id: d
    correct: true
    text:
      es: "Reduce el espaciado entre ellas, porque encajan bien entre sí"
  explanation:
    es: "La página dice que la idea del Interletraje es «reducir el espaciado entre caracteres que encajan bien entre sí (como «A» y «V») y aumentar el espaciado entre caracteres que no lo hacen». El interletraje reduce el espaciado entre caracteres que encajan bien, como A y V. Estirar la forma de los caracteres es la Escala, no el Interletraje. El espacio vertical entre líneas es el interlineado."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Interletrar los caracteres que superan un tamaño determinado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q225
  prompt:
    es: "En Word 365, ¿para qué sirve activar la casilla Permitir solapamientos en la pestaña Posición del cuadro Diseño?"
  options:
  - id: a
    correct: true
    text:
      es: "Para que varias imágenes se puedan superponer en una página"
  - id: b
    text:
      es: "Para que la imagen se mueva con el texto al agregarlo o quitarlo"
  - id: c
    text:
      es: "Para que la imagen permanezca en un punto fijo de la página"
  - id: d
    text:
      es: "Para que la imagen se ancle al párrafo anterior"
  explanation:
    es: "La página dice: «Si tiene más de una imagen que quiera superponer en una página, puede habilitar esta opción en el cuadro Diseño» y «active la casilla Permitir solapamientos». Moverse con el texto es lo que hace Mover con texto. Mantener la imagen en un punto fijo es Corregir posición en la página. El anclaje indica el párrafo al que está asociado el objeto con los ajustes distintos de En línea con el texto."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Cambiar las opciones de diseño de imagen»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-salto-seccion-html
- id: m06-l04-q226
  prompt:
    es: "Según la página de Microsoft sobre cómo insertar un salto de sección, los saltos de sección de Word 365 sirven:"
  options:
  - id: a
    text:
      es: "Para que el documento tenga una sola sección con un único formato"
  - id: b
    text:
      es: "Para insertar una nota al final de cada capítulo del documento"
  - id: c
    correct: true
    text:
      es: "Para dividir el documento en secciones con formato propio, como columnas, encabezados y pies"
  - id: d
    text:
      es: "Para marcar las entradas que formarán el índice del documento"
  explanation:
    es: "La página dice: «Use los saltos de secciones para dividir y dar formato a documentos de todos los tamaños», con formato propio en cada sección, como columnas, encabezados y pies de página y bordes de página. Una sola sección con un único formato es lo contrario de dividir. La nota al final de cada capítulo es otra función, de la pestaña Referencias según la página de notas: las notas al final aparecen al final del documento. Y marcar entradas de índice es otra función de Referencias, la de Marcar entrada, según la página del índice."
  citation: "fuente: `ms-word-salto-seccion.html`; «Agregar un salto de sección»"
  difficulty: 1
  tags:
  - "concepto"
