- id: m04-l02-v-kotlin-sealed-when-001
  prompt:
    en: |-
      Since Kotlin 2.2, a `when` branch can carry a guard condition. What does this program print? The function `large` prints `guard` each time it is called.

      ```kotlin
      sealed interface Command {
          data class Deposit(val amount: Int) : Command
          data class Withdraw(val amount: Int) : Command
          data object Close : Command
      }

      fun large(amount: Int): Boolean {
          println("guard")
          return amount > 50
      }

      fun describe(command: Command): String = when (command) {
          is Command.Deposit if large(command.amount) -> "large deposit"
          is Command.Withdraw if large(command.amount) -> "large withdrawal"
          is Command.Deposit -> "plain deposit"
          is Command.Withdraw -> "plain withdrawal"
          Command.Close -> "closed"
      }

      fun main() {
          println(describe(Command.Deposit(80)))
          println(describe(Command.Withdraw(70)))
      }
      ```
  options:
  - id: a
    text:
      en: '`guard`, `large deposit`, `guard`, `large withdrawal`'
    correct: true
  - id: b
    text:
      en: '`plain deposit`, `plain withdrawal`'
  - id: c
    text:
      en: '`guard`, `plain deposit`, `guard`, `plain withdrawal`'
  - id: d
    text:
      en: '`guard`, `plain deposit`, `guard`, `large withdrawal`'
  explanation:
    en: 'The branches are tried in order and a guard is evaluated only after its primary condition matches. `Deposit(80)`
      matches `is Command.Deposit`, so `large` is evaluated and prints `guard`. `large` returns `true` because `80` is above
      `50`, so the guarded `Deposit` branch runs. `Withdraw(70)` does not match `is Command.Deposit`, so the first guard is
      not evaluated. It matches `is Command.Withdraw`, so `large` is evaluated and prints `guard`. `large` returns `true`
      because `70` is above `50`, so the guarded `Withdraw` branch runs. The program prints `guard`, `large deposit`, `guard`,
      `large withdrawal`. `plain deposit`, `plain withdrawal` comes from this mistake: putting the plain branches before the
      guarded ones. `when` tries the branches in order, so a guarded branch written first is tried before the plain branch
      of the same type. `guard`, `plain deposit`, `guard`, `plain withdrawal` comes from this mistake: negating both guards.
      A guarded branch runs when its guard returns `true`, and `large` returns `true` only for an amount above `50`. `guard`,
      `plain deposit`, `guard`, `large withdrawal` comes from this mistake: negating only the `Deposit` guard. The `Deposit`
      guard is `large(command.amount)`, which holds for an amount above `50`.'
  family: kotlin-sealed-when
  code_reading: true
  citation: kotlin-docs-control-flow#guard-conditions-in-when-expressions
  difficulty: 3
  tags: &id001
  - kotlin
