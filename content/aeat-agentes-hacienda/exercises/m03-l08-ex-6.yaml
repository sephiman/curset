# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0324
  prompt:
    es: "¿A quién corresponde dirigir las actuaciones y quién fija su lugar, día y hora, según el artículo 180.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos?"
  options:
  - id: a
    correct: true
    text:
      es: "La dirección, a los órganos de inspección; el lugar, día y hora, a los funcionarios que tramitan el procedimiento."
  - id: b
    text:
      es: "La dirección, a los funcionarios que tramitan el procedimiento; el lugar, día y hora, a los órganos de inspección."
  - id: c
    text:
      es: "La dirección, al órgano competente para liquidar; el lugar, día y hora, a los órganos de inspección."
  - id: d
    text:
      es: "La dirección, a los órganos de inspección; el lugar, día y hora, al obligado tributario de acuerdo con la inspección."
  explanation:
    es: "La dirección de las actuaciones inspectoras corresponde a los órganos de inspección, y los funcionarios que tramitan el procedimiento deciden el lugar, día y hora en que se realizan (art. 180.2). Invertir los dos papeles contradice el texto. Atribuir la dirección al órgano competente para liquidar mezcla la fase de actuaciones con la de liquidación. Dejar el lugar, día y hora a un acuerdo con el obligado quita a los funcionarios una decisión que la norma les da."
  citation: "art. 180.2 RGAT"
  difficulty: 2
  tags:
