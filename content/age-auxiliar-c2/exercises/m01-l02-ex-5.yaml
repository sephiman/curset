# anchor: boe-a-1978-31229-art-115
- id: m01-l02-q145
  prompt:
    es: "De acuerdo con el artículo 115.1 de la Constitución Española de 1978, el Presidente del Gobierno podrá proponer la disolución previa deliberación del Consejo de Ministros y:"
  options:
  - id: a
    text:
      es: "Con la autorización del Congreso."
  - id: b
    text:
      es: "Con el informe favorable del Consejo de Estado."
  - id: c
    text:
      es: "Con el voto de la mayoría absoluta del Senado."
  - id: d
    correct: true
    text:
      es: "Bajo su exclusiva responsabilidad."
  explanation:
    es: "El artículo 115.1 dice «bajo su exclusiva responsabilidad». No hace falta autorización del Congreso, informe del Consejo de Estado ni voto del Senado."
  citation: "art. 115.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q168
  prompt:
    es: "De acuerdo con el artículo 62.f) de la Constitución Española de 1978, corresponde al Rey conferir los empleos civiles y militares y conceder honores y distinciones:"
  options:
  - id: a
    text:
      es: "Previa autorización de las Cortes Generales."
  - id: b
    text:
      es: "A propuesta del Presidente del Congreso de los Diputados."
  - id: c
    text:
      es: "Con carácter discrecional, sin sujeción a ley alguna."
  - id: d
    correct: true
    text:
      es: "Con arreglo a las leyes."
  explanation:
    es: "El artículo 62.f) atribuye al Rey esas funciones con arreglo a las leyes. La autorización de las Cortes Generales es el requisito de declarar la guerra y hacer la paz, no el de conferir empleos u honores. El Presidente del Congreso refrenda otros actos del Rey, no propone estos. La discrecionalidad sin ley contradice el «con arreglo a las leyes»."
  citation: "art. 62.f CE"
  difficulty: 2
  tags:
  - "competencia"
  - "requisito"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q046
  prompt:
    es: "En el orden de sucesión al trono que fija la Constitución Española de 1978, ¿qué se prefiere dentro de la misma línea?"
  options:
  - id: a
    text:
      es: "Se prefiere la línea anterior a las posteriores."
  - id: b
    correct: true
    text:
      es: "Se prefiere el grado más próximo al más remoto."
  - id: c
    text:
      es: "Se prefiere el varón a la mujer."
  - id: d
    text:
      es: "Se prefiere la persona de más edad a la de menos."
  explanation:
    es: "El artículo 57.1 dice que la sucesión prefiere «en la misma línea, el grado más próximo al más remoto». El varón a la mujer es la regla «en el mismo grado». La persona de más edad es la regla «en el mismo sexo». La línea anterior a las posteriores es la primera regla, entre líneas distintas."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q047
  prompt:
    es: "Conforme al artículo 57.2 de la Constitución Española de 1978, el Príncipe heredero tendrá la dignidad de Príncipe de Asturias:"
  options:
  - id: a
    text:
      es: "Desde que alcance la mayoría de edad y preste juramento ante las Cortes Generales."
  - id: b
    text:
      es: "Desde su proclamación por las Cortes Generales en sesión conjunta."
  - id: c
    text:
      es: "Desde su nacimiento, siempre que sea el primogénito varón del Rey."
  - id: d
    correct: true
    text:
      es: "Desde su nacimiento o desde que se produzca el hecho que origine el llamamiento."
  explanation:
    es: "El artículo 57.2 dice que el Príncipe heredero, «desde su nacimiento o desde que se produzca el hecho que origine el llamamiento», tendrá esa dignidad. No depende de la mayoría de edad ni del juramento, que se presta al alcanzarla (art. 61.2). Las Cortes no proclaman al Príncipe. El texto no exige ser primogénito varón."
  citation: "art. 57.2 CE"
  difficulty: 2
  tags:
  - "fecha"
  - "requisito"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q048
  prompt:
    es: "Extinguidas todas las líneas llamadas en Derecho, ¿quién provee a la sucesión en la Corona según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cortes Generales, en la forma que más convenga a los intereses de España."
  - id: b
    text:
      es: "El Congreso de los Diputados, por mayoría absoluta."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta de su Presidente."
  - id: d
    text:
      es: "El pueblo español, mediante referéndum de todos los ciudadanos."
  explanation:
    es: "El artículo 57.3 dice: «Extinguidas todas las líneas llamadas en Derecho, las Cortes Generales proveerán a la sucesión en la Corona en la forma que más convenga a los intereses de España». Las Cortes Generales son el Congreso y el Senado juntos; el Congreso solo, con mayoría absoluta, no es el sujeto de esa frase. El Consejo de Ministros no figura como sujeto de la provisión. Un referéndum de todos los ciudadanos tampoco es el cauce: el sujeto de «proveerán» son las Cortes Generales."
  citation: "art. 57.3 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q050
  prompt:
    es: "De acuerdo con el artículo 57.4 de la Constitución Española de 1978, quienes, teniendo derecho a la sucesión en el trono, contrajeren matrimonio contra la expresa prohibición del Rey y de las Cortes Generales:"
  options:
  - id: a
    text:
      es: "Quedarán excluidos de la sucesión, pero no sus descendientes."
  - id: b
    text:
      es: "Perderán su lugar en el orden de sucesión hasta que el matrimonio se disuelva."
  - id: c
    text:
      es: "Quedarán excluidos de la sucesión si las Cortes Generales lo ratifican después."
  - id: d
    correct: true
    text:
      es: "Quedarán excluidos de la sucesión a la Corona por sí y sus descendientes."
  explanation:
    es: "El artículo 57.4 dice que esas personas «quedarán excluidas en la sucesión a la Corona por sí y sus descendientes». La exclusión alcanza a los descendientes. No es temporal ni depende de que el matrimonio se disuelva. Tampoco necesita una ratificación posterior de las Cortes: la prohibición ya es suya y del Rey."
  citation: "art. 57.4 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q051
  prompt:
    es: "Según el artículo 57.4 de la Constitución Española de 1978, ¿de quién debe ser la prohibición expresa de matrimonio que excluye de la sucesión a quien tiene derecho a ella?"
  options:
  - id: a
    correct: true
    text:
      es: "Del Rey y de las Cortes Generales."
  - id: b
    text:
      es: "Del Rey, con el refrendo del Presidente del Gobierno."
  - id: c
    text:
      es: "De las Cortes Generales, a propuesta del Gobierno."
  - id: d
    text:
      es: "Del Rey o, en su defecto, del Congreso de los Diputados."
  explanation:
    es: "El artículo 57.4 habla del matrimonio contraído «contra la expresa prohibición del Rey y de las Cortes Generales». Hacen falta las dos voluntades. No basta la del Rey refrendada, ni la de las Cortes a propuesta del Gobierno. El Congreso no sustituye a las Cortes Generales."
  citation: "art. 57.4 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q052
  prompt:
    es: "¿Cuál de las siguientes cuestiones sobre la sucesión en la Corona se resuelve por una ley orgánica, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La provisión de la sucesión cuando se extingan todas las líneas llamadas en Derecho."
  - id: b
    text:
      es: "La exclusión de quienes se casen contra la prohibición del Rey y de las Cortes."
  - id: c
    text:
      es: "El orden regular de primogenitura y representación en la sucesión al trono."
  - id: d
    correct: true
    text:
      es: "Las abdicaciones y renuncias y cualquier duda de hecho o de derecho en el orden de sucesión."
  explanation:
    es: "El artículo 57.5 dice: «Las abdicaciones y renuncias y cualquier duda de hecho o de derecho que ocurra en el orden de sucesión a la Corona se resolverán por una ley orgánica». La extinción de las líneas la resuelven las Cortes Generales en la forma que más convenga (art. 57.3). La exclusión por matrimonio la fija la propia Constitución (art. 57.4), igual que el orden de primogenitura y representación (art. 57.1)."
  citation: "art. 57.5 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q146
  prompt:
    es: "Según la Constitución Española de 1978, la Corona de España es hereditaria en los sucesores de una determinada persona histórica, que es:"
  options:
  - id: a
    correct: true
    text:
      es: "S. M. Don Juan Carlos I de Borbón, legítimo heredero de la dinastía histórica."
  - id: b
    text:
      es: "S. M. Don Alfonso XIII de Borbón, último Rey antes de la República."
  - id: c
    text:
      es: "Don Juan de Borbón y Battenberg, Conde de Barcelona."
  - id: d
    text:
      es: "S. M. Don Felipe VI de Borbón, actual Rey de España."
  explanation:
    es: "El artículo 57.1 la hace hereditaria «en los sucesores de S. M. Don Juan Carlos I de Borbón, legítimo heredero de la dinastía histórica». Ni Alfonso XIII, ni Don Juan de Borbón, ni Felipe VI son la persona que nombra el artículo."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q147
  prompt:
    es: "Según la Constitución Española de 1978, la sucesión en el trono sigue un orden regular que se basa en dos criterios, que son:"
  options:
  - id: a
    text:
      es: "Primogenitura y aclamación."
  - id: b
    text:
      es: "Ultimogenitura y representación."
  - id: c
    correct: true
    text:
      es: "Primogenitura y representación."
  - id: d
    text:
      es: "Proximidad de grado y aclamación."
  explanation:
    es: "El artículo 57.1 habla del «orden regular de primogenitura y representación». La aclamación no figura como criterio de sucesión: las Cortes solo intervienen si se extinguen todas las líneas (57.3). La ultimogenitura invierte el criterio y la proximidad de grado es una preferencia dentro de la misma línea, no el orden regular."
  citation: "art. 57.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q148
  prompt:
    es: "Según la Constitución Española de 1978, en el orden regular de sucesión al trono se prefiere siempre, en primer lugar:"
  options:
  - id: a
    text:
      es: "La línea posterior a las anteriores."
  - id: b
    correct: true
    text:
      es: "La línea anterior a las posteriores."
  - id: c
    text:
      es: "La persona de más edad con independencia de la línea."
  - id: d
    text:
      es: "La persona que designe el Rey en su testamento."
  explanation:
    es: "El artículo 57.1 dice que es «preferida siempre la línea anterior a las posteriores». La posterior invierte la regla, la edad solo decide dentro del mismo sexo y el testamento del Rey no designa sucesor."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q149
  prompt:
    es: "Según la Constitución Española de 1978, cuando dos personas llamadas a la sucesión están en el mismo grado, se prefiere:"
  options:
  - id: a
    text:
      es: "La mujer antes que el varón."
  - id: b
    text:
      es: "La persona de más edad al margen del sexo."
  - id: c
    text:
      es: "La persona que elijan las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "El varón a la mujer."
  explanation:
    es: "En el mismo grado, el artículo 57.1 prefiere «el varón a la mujer». La mujer al varón invierte la regla, la edad independiente del sexo es el criterio solo entre personas del mismo sexo, y las Cortes eligen únicamente si se extinguen todas las líneas."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q150
  prompt:
    es: "Según la Constitución Española de 1978, cuando dos personas del mismo grado y del mismo sexo están llamadas a suceder, se prefiere:"
  options:
  - id: a
    text:
      es: "La persona de menos edad a la de más."
  - id: b
    correct: true
    text:
      es: "La persona de más edad a la de menos."
  - id: c
    text:
      es: "La que haya nacido antes del matrimonio de sus padres."
  - id: d
    text:
      es: "La que designe el Príncipe de Asturias."
  explanation:
    es: "Entre personas del mismo sexo, el artículo 57.1 prefiere «la persona de más edad a la de menos». La de menos edad invierte la regla, y ni la fecha del matrimonio de los padres ni la designación del Príncipe de Asturias son criterios."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
