# anchor: boe-a-2017-12902-art-193
- id: q08
  lesson: m03-l04
  prompt:
    es: "¿Cuál es el importe de las penalidades diarias que la Biblioteca puede imponer a Digitaliza Patrimonio, S.L. por la demora en el plazo total, si opta por ellas en lugar de resolver el contrato?"
  options:
  - id: a
    correct: true
    text:
      es: "Unas penalidades de 388,80 euros en total."
  - id: b
    text:
      es: "Unas penalidades de 470,45 euros en total."
  - id: c
    text:
      es: "Unas penalidades de 816,48 euros en total."
  - id: d
    text:
      es: "Unas penalidades de 324,00 euros en total."
  explanation:
    es: "La penalidad es de 0,60 euros por cada 1.000 euros del precio, IVA excluido (art. 193.3 LCSP): 0,60 × 54 × 12 días = 388.80 euros. La cifra de 470,45 euros parte del precio con IVA (54.000 euros más 21 % de IVA, 65.340 euros). La de 816,48 euros parte del valor estimado (113.400 euros), que incluye la prórroga y la modificación prevista. La de 324,00 euros cuenta diez días en lugar de los doce de retraso."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-206
- id: q09
  lesson: m03-l04
  prompt:
    es: "Señale hasta qué importe, IVA excluido, está obligada Digitaliza Patrimonio, S.L. a aceptar el lote adicional no previsto en el pliego:"
  options:
  - id: a
    text:
      es: "Hasta un máximo de 27.000 euros."
  - id: b
    correct: true
    text:
      es: "Hasta un máximo de 10.800 euros."
  - id: c
    text:
      es: "Hasta un máximo de 13.068 euros."
  - id: d
    text:
      es: "Hasta un máximo de 5.400 euros."
  explanation:
    es: "Las modificaciones del art. 205 LCSP obligan al contratista si no exceden, aislada o conjuntamente, del 20 por ciento del precio inicial, IVA excluido (art. 206.1 LCSP): 20 % de 54.000 euros son 10.800 euros. El lote de 14.000 euros lo supera, por lo que necesita su conformidad por escrito. La cifra de 27.000 euros es el 50 % del precio, el límite de la modificación no prevista, no el de la obligatoriedad. La de 13.068 euros aplica el 20 % al precio con IVA. La de 5.400 euros aplica el 10 %."
  citation: "art. 206.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-87
- id: q10
  lesson: m04-l04
  prompt:
    es: "Conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué situación administrativa se encuentra Don Ernesto Palomares Ruiz mientras desempeña el puesto de personal eventual?"
  options:
  - id: a
    text:
      es: "En servicio activo, porque conserva su destino definitivo en la Biblioteca."
  - id: b
    text:
      es: "En excedencia voluntaria por interés particular, desde su designación."
  - id: c
    correct: true
    text:
      es: "En servicios especiales, porque no optó por permanecer en servicio activo."
  - id: d
    text:
      es: "En servicio en otras Administraciones Públicas, por pasar a un órgano ministerial."
  explanation:
    es: "Los funcionarios de carrera designados personal eventual en puestos de confianza o asesoramiento político pasan a servicios especiales si no optan por permanecer en servicio activo (art. 87.1.i TREBEP). Don Ernesto no optó. La opción del servicio activo solo valdría si hubiera optado por él. La excedencia voluntaria por interés particular es la que se declara si no pide el reingreso a tiempo, no la de su designación. El servicio en otras Administraciones Públicas se refiere a puestos en otras Administraciones, no al gabinete de un Ministerio."
  citation: "art. 87.1.i) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8730-art-9
- id: q11
  lesson: m04-l04
  prompt:
    es: "Conforme al Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿hasta qué fecha debe solicitar Don Ernesto Palomares Ruiz el reingreso para no pasar a excedencia voluntaria por interés particular?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 2 de noviembre de 2027."
  - id: b
    text:
      es: "El sábado, 30 de octubre de 2027."
  - id: c
    text:
      es: "El viernes, 29 de octubre de 2027."
  - id: d
    text:
      es: "El viernes, 15 de octubre de 2027."
  explanation:
    es: "Quien pierde la condición que causó los servicios especiales pide el reingreso en el plazo de un mes (art. 9.1 RD 365/1995). Contado desde el día siguiente al jueves 30 de septiembre, concluye el mismo día del mes de vencimiento: el sábado 30 de octubre (art. 30.4 LPAC). Es inhábil, y el lunes 1 de noviembre es festivo en toda España, así que el plazo se prorroga al primer día hábil, el martes, 2 de noviembre de 2027 (art. 30.5 LPAC). La fecha del sábado, 30 de octubre de 2027, no prorroga el plazo. La del viernes, 29 de octubre de 2027, acaba el viernes anterior. La del viernes, 15 de octubre de 2027, cuenta quince días naturales."
  citation: "art. 9.1 RD 365/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-54
- id: q12
  lesson: m04-l05
  prompt:
    es: "Conforme al Real Decreto 364/1995, de 10 de marzo, y a fecha del jueves, 28 de octubre de 2027, ¿cómo debe considerarse el informe del Ministerio de Hacienda sobre el nombramiento de Don Julián Ibáñez Roldán?"
  options:
  - id: a
    text:
      es: "Desfavorable, porque no se emitió en diez días hábiles."
  - id: b
    text:
      es: "Pendiente, y el nombramiento no puede hacerse hasta que el Ministerio lo emita."
  - id: c
    text:
      es: "Favorable solo cuando lo confirme la Secretaría de Estado de Función Pública."
  - id: d
    correct: true
    text:
      es: "Favorable, al haber pasado más de quince días naturales sin emitirse."
  explanation:
    es: "Si el informe del Departamento del funcionario no se emite en quince días naturales, se considera favorable (art. 54.1 RD 364/1995). Desde el 4 de octubre han pasado veinticuatro días. El silencio no se entiende desfavorable ni de plazo de diez días hábiles. El nombramiento no queda bloqueado: el informe se tiene por favorable. La intervención de la Secretaría de Estado de Función Pública solo se prevé si el informe fuera desfavorable."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1985-151-art-16
- id: q23
  lesson: m04-l06
  prompt:
    es: "Conforme al artículo 16.4 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del Personal al servicio de las Administraciones Públicas, si el complemento específico del puesto de Doña Lucía es de 4.800 euros anuales y no incluye el factor de incompatibilidad, ¿puede reconocérsele compatibilidad para la actividad privada?"
  options:
  - id: a
    text:
      es: "Sí, porque el complemento no supera el 30 por 100 de su retribución básica, antigüedad incluida."
  - id: b
    correct: true
    text:
      es: "No, porque el complemento supera en 300 euros el 30 por 100 de su retribución básica sin antigüedad."
  - id: c
    text:
      es: "No, porque la compatibilidad exige que el puesto no lleve complemento específico alguno."
  - id: d
    text:
      es: "Sí, porque el límite es el 50 por 100 de su retribución básica sin antigüedad."
  explanation:
    es: "Puede reconocerse la compatibilidad para actividades privadas si el complemento específico no supera el 30 por 100 de la retribución básica, excluidos los conceptos que tengan su origen en la antigüedad (art. 16.4 Ley 53/1984). La base son 17.300 menos 2.300 de antigüedad, es decir, 15.000 euros, y el 30 por 100 son 4.500 euros. El complemento de 4.800 euros lo supera en 300 euros. La opción que cuenta la antigüedad llega a 5.190 euros y concluiría que sí cabe, pero el artículo la excluye. La que exige que el puesto no lleve complemento específico contradice el artículo, que admite complementos hasta ese límite. La del 50 por 100 usa un porcentaje que el artículo no fija."
  citation: "art. 16.4 Ley 53/1984"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-151-art-14
- id: q14
  lesson: m04-l06
  prompt:
    es: "Conforme a la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del Personal al servicio de las Administraciones Públicas, ¿hasta qué fecha debe dictarse la resolución sobre la compatibilidad solicitada por Doña Lucía Ferrández Ortiz?"
  options:
  - id: a
    text:
      es: "El sábado, 6 de noviembre de 2027."
  - id: b
    text:
      es: "El viernes, 5 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 8 de noviembre de 2027."
  - id: d
    text:
      es: "El miércoles, 6 de octubre de 2027."
  explanation:
    es: "La resolución sobre actividades privadas se dicta en el plazo de dos meses (art. 14 Ley 53/1984). Contado desde el día siguiente al lunes 6 de septiembre, concluye el sábado 6 de noviembre; al ser inhábil, se prorroga al primer día hábil, el lunes, 8 de noviembre de 2027 (art. 30.4–5 LPAC). La fecha del sábado, 6 de noviembre de 2027, no aplica la prórroga. La del viernes, 5 de noviembre de 2027, cuenta sesenta días naturales. La del miércoles, 6 de octubre de 2027, cuenta un mes."
  citation: "art. 14 Ley 53/1984"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-56
- id: q15
  lesson: m05-l02
  prompt:
    es: "¿Quién es competente para autorizar el crédito extraordinario que necesita el organismo para pagar las nuevas estanterías de los depósitos?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro de Hacienda, al superar el 10 % del capítulo sin alcanzar el 20 %."
  - id: b
    text:
      es: "La Directora del organismo, porque el crédito extraordinario no alcanza el 10 % del capítulo."
  - id: c
    text:
      es: "El Consejo de Ministros, porque supera el 20 % del capítulo de gastos del organismo."
  - id: d
    text:
      es: "Las Cortes Generales, mediante ley, porque el organismo carece de crédito adecuado y suficiente."
  explanation:
    es: "Los límites del art. 56.3 LGP se refieren al conjunto de las modificaciones del ejercicio (art. 56.4 LGP). Con el suplemento de 120.000 euros, el total es 370.000 euros. El 10 % del capítulo, 3.200.000 euros, son 320.000 euros: el total lo supera y el Director ya no es competente aunque 250.000 euros solos no lo alcanzaran. El 20 % son 640.000 euros, que no se alcanzan, y no se supera 1.000.000 de euros: autoriza el Ministro de Hacienda (art. 56.3.b LGP). El Consejo de Ministros solo actúa en los restantes casos. Las Cortes solo intervienen en los supuestos del art. 56.7 LGP, que aquí no concurren."
  citation: "art. 56.4 LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: q16
  lesson: m05-l02
  prompt:
    es: "Conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué importe máximo puede imputarse en 2029 al contrato de mantenimiento de la climatización?"
  options:
  - id: a
    text:
      es: "Un máximo de 280.000 euros en 2029."
  - id: b
    text:
      es: "Un máximo de 200.000 euros en 2029."
  - id: c
    text:
      es: "Un máximo de 400.000 euros en 2029."
  - id: d
    correct: true
    text:
      es: "Un máximo de 240.000 euros en 2029."
  explanation:
    es: "El gasto de cada ejercicio posterior no puede exceder de un porcentaje del crédito inicial: 70 % en el inmediato siguiente, 60 % en el segundo y 50 % en el tercero y cuarto (art. 47.2 LGP). Para 2029, segundo ejercicio posterior a 2027, es el 60 % de 400.000 euros: 240.000 euros. La cifra de 280.000 euros aplica el 70 % del ejercicio inmediato siguiente. La de 200.000 euros aplica el 50 % del tercero. La de 400.000 euros ignora el límite."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2014-879-anexo-iv
- id: q26
  lesson: m05-l05
  prompt:
    es: "Según el anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, el contrato de mantenimiento de la climatización de los depósitos se imputa al artículo titulado:"
  options:
  - id: a
    correct: true
    text:
      es: "Reparaciones, mantenimiento y conservación, del capítulo 2."
  - id: b
    text:
      es: "Material, suministros y otros, del capítulo 2."
  - id: c
    text:
      es: "Arrendamientos y cánones, del capítulo 2."
  - id: d
    text:
      es: "Inversión de reposición asociada al funcionamiento operativo de los servicios, del capítulo 6."
  explanation:
    es: "El anexo IV imputa al artículo 21 los gastos de mantenimiento, reparaciones y conservación de edificios y locales, maquinaria y otro inmovilizado material (anexo IV, art. 21, Resolución de 20-01-2014). El contrato mantiene las instalaciones de climatización de los depósitos, así que va a ese artículo del capítulo 2. El artículo 22 recoge el material de oficina y los suministros, no el mantenimiento. El 20 recoge los alquileres y cánones. El 63 es del capítulo 6 y repone bienes inservibles; este contrato conserva instalaciones que ya existen."
  citation: "anexo IV, art. 21, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1989-14441-art-2
- id: q25
  lesson: m05-l05
  prompt:
    es: "Conforme al artículo 2.3 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, ¿puede el organismo dividir la factura de la imprenta en dos pagos de 3.100 euros para atenderla con el anticipo?"
  options:
  - id: a
    text:
      es: "Sí, porque cada uno de los pagos resultantes no supera los 5.000 euros."
  - id: b
    text:
      es: "Sí, siempre que cada pago se justifique con un documento distinto de la imprenta."
  - id: c
    text:
      es: "No, porque las facturas de imprenta de una exposición no se atienden con anticipos de caja fija."
  - id: d
    correct: true
    text:
      es: "No, porque no puede fraccionarse un único gasto en varios pagos."
  explanation:
    es: "Para aplicar los límites del anticipo, no puede fraccionarse un único gasto en varios pagos (art. 2.3 RD 725/1989). La factura de la imprenta, de 6.200 euros, supera los 5.000 euros por pago y no es de teléfono, energía, combustibles ni indemnizaciones, así que dividirla en dos pagos de 3.100 euros burla el límite. La opción que mira solo cada pago resultante ignora esa prohibición. La de los documentos distintos tampoco: es un solo gasto con un solo proveedor. La de las facturas de imprenta inventa una exclusión del anticipo que el real decreto no contiene."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2003-21614-art-157
- id: q19
  lesson: m05-l03
  prompt:
    es: "Según el artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué modalidad de control interno ejerce la Intervención Delegada sobre la Biblioteca?"
  options:
  - id: a
    text:
      es: "Función interventora previa de los actos que generan gasto en el organismo."
  - id: b
    text:
      es: "Auditoría pública posterior y sistemática de la actividad del organismo."
  - id: c
    correct: true
    text:
      es: "Control financiero permanente sobre el funcionamiento económico-financiero del organismo."
  - id: d
    text:
      es: "Control externo del Tribunal de Cuentas sobre las cuentas del organismo."
  explanation:
    es: "El control financiero permanente verifica de forma continua, a través de la intervención delegada, la situación y el funcionamiento económico-financiero de las entidades del sector público estatal (art. 157 LGP). La función interventora es previa y controla los actos que generan gasto, no el seguimiento continuo. La auditoría pública es posterior y sistemática. El control externo corresponde al Tribunal de Cuentas, no a la Intervención."
  citation: "art. 157 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2003-21614-art-162
- id: q20
  lesson: m05-l03
  prompt:
    es: "Según el artículo 162 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué modalidad de control interno es la revisión que realiza la Intervención General de la Administración del Estado sobre el organismo?"
  options:
  - id: a
    text:
      es: "Control financiero permanente, que se ejerce de forma continua en el organismo."
  - id: b
    text:
      es: "Función interventora, que fiscaliza antes de reconocer cada obligación."
  - id: c
    text:
      es: "Control externo, que corresponde al Tribunal de Cuentas sobre el organismo."
  - id: d
    correct: true
    text:
      es: "Auditoría pública, que se efectúa con posterioridad y de forma sistemática."
  explanation:
    es: "La auditoría pública es la verificación, realizada con posterioridad y de forma sistemática, de la actividad económico-financiera del sector público estatal (art. 162 LGP). La revisión posterior y sistemática de la IGAE es esa auditoría. El control financiero permanente es continuo y lo ejerce la intervención delegada. La función interventora es previa al reconocimiento de la obligación. El control externo lo ejerce el Tribunal de Cuentas, no la IGAE."
  citation: "art. 162 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
