- id: g-row-security-policy
  term: {en: row security policy}
  definition: {en: "Tables can have row security policies that restrict, on a per-user basis, which rows can be returned by normal queries or inserted, updated, or deleted by data modification commands. This feature is also known as Row-Level Security."}
  origin: m09-l03
  citation: "pg-ddl-rowsecurity#DDL-ROWSECURITY"
- id: g-default-deny-policy
  term: {en: default-deny policy}
  definition: {en: "If row security is enabled on a table and no policy exists for it, a default-deny policy is used, meaning that no rows are visible or can be modified."}
  origin: m09-l03
  citation: "pg-ddl-rowsecurity#DDL-ROWSECURITY"
- id: g-qos-class
  term: {en: QoS class}
  definition: {en: "Kubernetes assigns every Pod a quality of service (QoS) class based on the resource requests and limits of its component Containers. Kubernetes uses QoS classes to decide which Pods to evict from a Node experiencing Node Pressure."}
  origin: m09-l03
  citation: "k8s-qos#quality-of-service-classes"
