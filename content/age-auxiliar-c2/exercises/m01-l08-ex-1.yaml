# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q079
  prompt:
    es: "Conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los titulares de los órganos superiores y directivos son nombrados atendiendo a criterios de:"
  options:
  - id: a
    text:
      es: "Antigüedad en el Cuerpo y titulación."
  - id: b
    correct: true
    text:
      es: "Competencia profesional y experiencia."
  - id: c
    text:
      es: "Confianza política y afinidad con el Gobierno."
  - id: d
    text:
      es: "Oposición libre y concurso de méritos."
  explanation:
    es: "El artículo 55.11 manda nombrar a los titulares atendiendo a criterios de competencia profesional y experiencia. La antigüedad, la afinidad política y la oposición o el concurso no son los criterios que fija ese apartado."
  citation: "art. 55.11 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q080
  prompt:
    es: "Según el artículo 55.11 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, a los titulares de los órganos superiores y directivos se aplica, en el desempeño de sus funciones, la responsabilidad:"
  options:
  - id: a
    text:
      es: "Solidaria y colectiva por la gestión del Departamento."
  - id: b
    text:
      es: "Política y subsidiaria por la gestión de los órganos dependientes."
  - id: c
    text:
      es: "Exclusivamente disciplinaria por los resultados obtenidos."
  - id: d
    correct: true
    text:
      es: "Profesional, personal y directa por la gestión desarrollada."
  explanation:
    es: "El artículo 55.11.a establece la responsabilidad profesional, personal y directa por la gestión desarrollada. No es solidaria ni colectiva, ni subsidiaria por los órganos dependientes, ni se limita a la vía disciplinaria."
  citation: "art. 55.11 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q081
  prompt:
    es: "Señale la respuesta correcta sobre la condición de alto cargo, de acuerdo con el artículo 55.6 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "La tienen los órganos superiores y directivos, salvo los Subdirectores generales y asimilados."
  - id: b
    text:
      es: "La tienen solo los órganos superiores."
  - id: c
    text:
      es: "La tienen todos los órganos directivos, incluidos los Subdirectores generales."
  - id: d
    text:
      es: "La tienen los órganos directivos, pero no los superiores."
  explanation:
    es: "El artículo 55.6 da la condición de alto cargo a los órganos superiores y directivos y exceptúa a los Subdirectores generales y asimilados. No se limita a los superiores, no alcanza a los Subdirectores generales y tampoco excluye a los órganos superiores."
  citation: "art. 55.6 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
