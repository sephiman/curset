# anchor: boe-a-2003-23186-art-17
- id: m03-l03-q0067
  prompt:
    es: "Según el artículo 17.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se entiende por relación jurídico-tributaria el conjunto de:"
  options:
  - id: a
    text:
      es: "obligaciones y deberes de los obligados tributarios originados por la aplicación de los tributos."
  - id: b
    text:
      es: "obligaciones y derechos de los obligados tributarios, excluidas las potestades de la Administración."
  - id: c
    correct: true
    text:
      es: "obligaciones y deberes, derechos y potestades originados por la aplicación de los tributos."
  - id: d
    text:
      es: "derechos y potestades de la Administración tributaria derivados exclusivamente de la ley de cada tributo."
  explanation:
    es: "La relación jurídico-tributaria abarca obligaciones y deberes, derechos y potestades, de ambas partes, que origina la aplicación de los tributos. Reducirla a los deberes del obligado, excluir las potestades de la Administración o limitarla a los derechos y potestades de esta última recorta la definición del artículo 17.1."
  citation: "art. 17.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-17
- id: m03-l03-q0069
  prompt:
    es: "Conforme al artículo 17.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, de las obligaciones que derivan de la relación jurídico-tributaria, son obligaciones tributarias materiales:"
  options:
  - id: a
    text:
      es: "las de carácter principal, las de realizar pagos a cuenta y las formales definidas en la propia ley."
  - id: b
    correct: true
    text:
      es: "las de carácter principal, las de realizar pagos a cuenta, las establecidas entre particulares resultantes del tributo y las accesorias."
  - id: c
    text:
      es: "las de carácter principal y las accesorias, pero no las de realizar pagos a cuenta."
  - id: d
    text:
      es: "las de carácter principal, las de realizar pagos a cuenta, las accesorias y las sanciones tributarias."
  explanation:
    es: "Son materiales las obligaciones principales, las de pagos a cuenta, las establecidas entre particulares resultantes del tributo y las accesorias. Las formales son una categoría aparte, que define el artículo 29.1. Dejar fuera los pagos a cuenta o las obligaciones entre particulares recorta la lista, y las sanciones tributarias no son obligaciones accesorias, de modo que no figuran entre ellas."
  citation: "art. 17.3 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-17
- id: m03-l03-q0070
  prompt:
    es: "Según el artículo 17.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el contribuyente de un tributo pacta por escrito con otra persona que será esta quien lo pague, con el fin de quedar liberado ante la Administración tributaria, ¿qué efecto tiene ese pacto?"
  options:
  - id: a
    text:
      es: "Produce efectos ante la Administración si se comunica por escrito antes del devengo del tributo."
  - id: b
    text:
      es: "Produce efectos ante la Administración, pero el contribuyente responde subsidiariamente del pago."
  - id: c
    correct: true
    text:
      es: "No produce efectos ante la Administración, sin perjuicio de sus consecuencias jurídico-privadas entre quienes lo pactan."
  - id: d
    text:
      es: "Es nulo también entre quienes lo pactan, porque la ley prohíbe pactar sobre los elementos del tributo."
  explanation:
    es: "Los elementos de la obligación tributaria no pueden alterarse por actos o convenios de los particulares, que no producen efectos ante la Administración. Se salvan sus consecuencias jurídico-privadas, de modo que el pacto vale entre quienes lo celebran. Comunicarlo antes del devengo no cambia nada frente a la Administración, y la responsabilidad subsidiaria del contribuyente tampoco nace del pacto. La nulidad entre las partes contradice la salvedad del precepto."
  citation: "art. 17.5 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "sujeto"
# anchor: boe-a-2003-23186-art-18
- id: m03-l03-q0071
  prompt:
    es: "Según el artículo 18 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo es el crédito tributario respecto de quien puede disponer de él?"
  options:
  - id: a
    text:
      es: "Es disponible por la Administración mediante convenio con el obligado, en los términos pactados."
  - id: b
    text:
      es: "Es indisponible en todo caso, sin que ninguna ley pueda establecer excepciones."
  - id: c
    text:
      es: "Es disponible por la Administración cuando lo autorice el órgano de recaudación competente."
  - id: d
    correct: true
    text:
      es: "Es indisponible, salvo que la ley establezca otra cosa."
  explanation:
    es: "El crédito tributario es indisponible, salvo que la ley establezca otra cosa. Un convenio con el obligado o la autorización de un órgano de recaudación no bastan para disponer de él, y la indisponibilidad no es absoluta, porque la ley puede fijar excepciones."
  citation: "art. 18 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-19
- id: m03-l03-q0072
  prompt:
    es: "De acuerdo con el artículo 19 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación tributaria principal tiene por objeto:"
  options:
  - id: a
    correct: true
    text:
      es: "el pago de la cuota tributaria."
  - id: b
    text:
      es: "el pago de la deuda tributaria, incluidos los recargos y los intereses de demora."
  - id: c
    text:
      es: "la presentación de las declaraciones y autoliquidaciones del tributo."
  - id: d
    text:
      es: "el pago de los pagos fraccionados y de las retenciones a cuenta de la cuota."
  explanation:
    es: "La obligación tributaria principal tiene por objeto el pago de la cuota tributaria. La deuda tributaria es más amplia, porque incluye recargos e intereses, que son obligaciones accesorias. Presentar declaraciones es una obligación formal, y los pagos fraccionados y las retenciones son pagos a cuenta, con carácter autónomo."
  citation: "art. 19 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-20
- id: m03-l03-q0073
  prompt:
    es: "Conforme al artículo 20.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ley podrá completar la delimitación del hecho imponible mediante la mención de:"
  options:
  - id: a
    correct: true
    text:
      es: "supuestos de no sujeción, que forman parte de su delimitación."
  - id: b
    text:
      es: "supuestos de exención, en los que el hecho imponible no llega a realizarse."
  - id: c
    text:
      es: "supuestos de devengo especial, que fijan cuándo nace la obligación principal."
  - id: d
    text:
      es: "supuestos de exigibilidad diferida, que retrasan el pago de la cuota."
  explanation:
    es: "La ley completa el hecho imponible con supuestos de no sujeción. En la exención, en cambio, el hecho imponible se realiza y la ley exime del cumplimiento de la obligación principal. El devengo y la exigibilidad son momentos distintos, regulados en el artículo 21, y no delimitan el hecho imponible."
  citation: "art. 20.2 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-20
- id: m03-l03-q0074
  prompt:
    es: "Según el artículo 20.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede una orden ministerial fijar el presupuesto que configura el hecho imponible de un tributo, incluyendo en él una actividad que la ley reguladora de ese tributo no gravaba?"
  options:
  - id: a
    text:
      es: "Sí, porque las órdenes ministeriales tienen en materia tributaria el mismo rango que la ley y pueden ampliarlo."
  - id: b
    text:
      es: "Sí, siempre que la orden se publique en el boletín oficial antes del devengo del tributo."
  - id: c
    correct: true
    text:
      es: "No, porque el hecho imponible es el presupuesto fijado por la ley para configurar cada tributo."
  - id: d
    text:
      es: "No, porque el hecho imponible solo puede ampliarse por real decreto del Gobierno."
  explanation:
    es: "El hecho imponible lo fija la ley para configurar cada tributo, así que una orden ministerial no puede ampliarlo. La orden no tiene rango de ley, y publicarla antes del devengo no le da el rango que le falta. Tampoco basta un real decreto del Gobierno: es una norma reglamentaria, y la reserva es de ley."
  citation: "art. 20.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-20
- id: m03-l03-q0076
  prompt:
    es: "Conforme al artículo 20.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué origina la realización del hecho imponible?"
  options:
  - id: a
    text:
      es: "El nacimiento de la obligación de realizar pagos a cuenta."
  - id: b
    text:
      es: "La exigibilidad de la cuota, que se fija en la ley de cada tributo."
  - id: c
    text:
      es: "La presentación de la autoliquidación del tributo por el contribuyente."
  - id: d
    correct: true
    text:
      es: "El nacimiento de la obligación tributaria principal."
  explanation:
    es: "La realización del hecho imponible origina el nacimiento de la obligación tributaria principal. Los pagos a cuenta tienen carácter autónomo respecto de ella. La exigibilidad de la cuota puede fijarse en un momento distinto del devengo, y presentar la autoliquidación es una obligación formal, no el efecto de realizar el hecho imponible."
  citation: "art. 20.1 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "definición"
# anchor: boe-a-2003-23186-art-21
- id: m03-l03-q0079
  prompt:
    es: "Según los artículos 21.1 y 21.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el hecho imponible de un tributo se realiza el 15 de noviembre de 2025 y la ley del tributo dispone que la cuota será exigible el 20 de abril de 2026, ¿cuándo nace la obligación tributaria principal?"
  options:
  - id: a
    text:
      es: "El 20 de abril de 2026, porque la obligación nace cuando es exigible la cuota."
  - id: b
    correct: true
    text:
      es: "El 15 de noviembre de 2025, en el devengo, aunque la cuota sea exigible después."
  - id: c
    text:
      es: "El 15 de noviembre de 2025, pero la ley no puede fijar una exigibilidad posterior."
  - id: d
    text:
      es: "El día en que la Administración notifique la liquidación al obligado."
  explanation:
    es: "La obligación principal nace en el devengo, que es el momento en que se entiende realizado el hecho imponible, aquí el 15 de noviembre de 2025. La ley del tributo puede fijar la exigibilidad de la cuota en otro momento, como el 20 de abril de 2026, sin cambiar el nacimiento. Por eso no vale ni retrasar el nacimiento a la exigibilidad, ni negar a la ley esa facultad. La notificación de una liquidación no es el momento del devengo."
  citation: "art. 21.1 LGT"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2003-23186-art-23
- id: m03-l03-q0082
  prompt:
    es: "Según el artículo 23.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación tributaria de realizar pagos a cuenta consiste en satisfacer un importe a la Administración tributaria por el obligado a realizar pagos fraccionados, por el retenedor o por:"
  options:
  - id: a
    correct: true
    text:
      es: "el obligado a realizar ingresos a cuenta."
  - id: b
    text:
      es: "el sustituto del contribuyente en las operaciones sujetas."
  - id: c
    text:
      es: "el responsable solidario de las deudas del contribuyente."
  - id: d
    text:
      es: "el obligado a repercutir el tributo a sus clientes."
  explanation:
    es: "Los obligados a realizar pagos a cuenta son los obligados a realizar pagos fraccionados, los retenedores y los obligados a realizar ingresos a cuenta. El sustituto del contribuyente y el responsable solidario son otras figuras de obligados, y quien repercute el tributo cumple una obligación entre particulares."
  citation: "art. 23.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
  - "definición"
# anchor: boe-a-2003-23186-art-23
- id: m03-l03-q0083
  prompt:
    es: "De acuerdo con el artículo 23.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la obligación tributaria de realizar pagos a cuenta:"
  options:
  - id: a
    text:
      es: "Tiene carácter accesorio, porque se exige en relación con la obligación tributaria principal."
  - id: b
    text:
      es: "Tiene carácter subsidiario, porque solo se exige si no se paga la obligación tributaria principal."
  - id: c
    text:
      es: "Tiene carácter formal, porque consiste en presentar declaraciones periódicas a la Administración."
  - id: d
    correct: true
    text:
      es: "Tiene carácter autónomo respecto de la obligación tributaria principal."
  explanation:
    es: "La obligación de realizar pagos a cuenta tiene carácter autónomo respecto de la principal. No es accesoria, porque las accesorias son el interés de demora y los recargos. Tampoco es subsidiaria, ni formal: consiste en satisfacer un importe, no en presentar declaraciones."
  citation: "art. 23.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-23
- id: m03-l03-q0085
  prompt:
    es: "Pedro Ibáñez, contribuyente de un tributo cuya ley no dispone otra cosa, tiene una obligación tributaria principal de 5.000 euros por el año 2025 y ha soportado ese año pagos a cuenta por 1.200 euros. Conforme al artículo 23.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué importe le queda por pagar tras deducir los pagos a cuenta?"
  options:
  - id: a
    text:
      es: "6.200 euros, resultado de sumar los pagos a cuenta soportados a la obligación principal."
  - id: b
    text:
      es: "5.000 euros, porque los pagos a cuenta no se deducen de la obligación tributaria principal."
  - id: c
    correct: true
    text:
      es: "3.800 euros, resultado de restar los pagos a cuenta soportados de la obligación principal."
  - id: d
    text:
      es: "3.800 euros, pero solo si la Administración reconoce antes los pagos a cuenta en una liquidación."
  explanation:
    es: "El contribuyente deduce de la obligación principal los pagos a cuenta soportados: 5.000 menos 1.200 son 3.800 euros. Sumarlos da 6.200 y contradice la deducción. No deducirlos deja los 5.000 euros del principio, y los pagos a cuenta se deducen sin necesidad de que la Administración los reconozca previamente."
  citation: "art. 23.2 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-23186-art-24
- id: m03-l03-q0086
  prompt:
    es: "Según el artículo 24.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las obligaciones entre particulares resultantes del tributo:"
  options:
  - id: a
    text:
      es: "Son las que tienen por objeto una prestación de naturaleza tributaria exigible entre el obligado y la Administración."
  - id: b
    text:
      es: "Son las que tienen por objeto una prestación de naturaleza civil exigible entre obligados tributarios por pacto privado."
  - id: c
    text:
      es: "Son las que tienen por objeto una prestación exigible por la Administración a quien no es obligado tributario."
  - id: d
    correct: true
    text:
      es: "Son las que tienen por objeto una prestación de naturaleza tributaria exigible entre obligados tributarios."
  explanation:
    es: "Las obligaciones entre particulares resultantes del tributo tienen por objeto una prestación de naturaleza tributaria exigible entre obligados tributarios. Si se exigiera entre el obligado y la Administración sería una obligación tributaria ordinaria, y si fuera de naturaleza civil por pacto privado no sería tributaria. Y la prestación a exigir a quien no es obligado no se ajusta a la definición."
  citation: "art. 24.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-24
- id: m03-l03-q0088
  prompt:
    es: "¿Qué tipo de obligación tributaria es, según el artículo 24 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la de pagar el importe de un impuesto que un empresario repercute en factura a su cliente cuando la ley del impuesto prevé la repercusión?"
  options:
  - id: a
    correct: true
    text:
      es: "Una obligación entre particulares resultante del tributo, generada por un acto de repercusión previsto legalmente."
  - id: b
    text:
      es: "Una obligación tributaria accesoria, porque se exige en relación con la obligación principal."
  - id: c
    text:
      es: "Una obligación tributaria formal, porque consiste en expedir y entregar la factura."
  - id: d
    text:
      es: "Una obligación de realizar pagos a cuenta, porque el cliente anticipa la cuota del impuesto."
  explanation:
    es: "El importe repercutido se debe entre obligados tributarios por un acto de repercusión previsto legalmente, que es el ejemplo típico de las obligaciones entre particulares del artículo 24.2. No es accesoria, porque las accesorias son el interés de demora y los recargos. Expedir la factura es otra obligación, formal, y el cliente no anticipa la cuota de la principal a la Administración."
  citation: "art. 24.2 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-25
- id: m03-l03-q0089
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las obligaciones tributarias accesorias:"
  options:
  - id: a
    text:
      es: "Consisten en prestaciones pecuniarias cuya exigencia se impone en relación con la comisión de una infracción tributaria."
  - id: b
    correct: true
    text:
      es: "Consisten en prestaciones pecuniarias que se deben satisfacer a la Administración tributaria y cuya exigencia se impone en relación con otra obligación tributaria."
  - id: c
    text:
      es: "Consisten en prestaciones de hacer o no hacer que la normativa impone para facilitar la aplicación de los tributos."
  - id: d
    text:
      es: "Consisten en prestaciones pecuniarias exigibles entre particulares en relación con otra obligación tributaria."
  explanation:
    es: "Las obligaciones accesorias son prestaciones pecuniarias debidas a la Administración y exigidas en relación con otra obligación tributaria. Las ligadas a una infracción serían sanciones, que no son accesorias. Las prestaciones de hacer o no hacer son obligaciones formales, y las exigibles entre particulares son las del artículo 24."
  citation: "art. 25.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-25
- id: m03-l03-q0090
  prompt:
    es: "Según el artículo 25.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tienen la naturaleza de obligaciones tributarias accesorias las de satisfacer el interés de demora, los recargos por declaración extemporánea y:"
  options:
  - id: a
    text:
      es: "las retenciones e ingresos a cuenta, así como aquellas otras que imponga la ley."
  - id: b
    text:
      es: "las obligaciones entre particulares resultantes del tributo, así como las que imponga la ley."
  - id: c
    correct: true
    text:
      es: "los recargos del período ejecutivo, así como aquellas otras que imponga la ley."
  - id: d
    text:
      es: "las obligaciones formales de llevar libros y registros, así como aquellas otras que imponga la ley."
  explanation:
    es: "Completan la lista de accesorias los recargos del período ejecutivo y las otras que imponga la ley. Las retenciones y los ingresos a cuenta son pagos a cuenta, las obligaciones entre particulares forman una categoría propia y las de llevar libros y registros son formales: el artículo 17.3 las distingue de las accesorias."
  citation: "art. 25.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-25
- id: m03-l03-q0091
  prompt:
    es: "¿Qué naturaleza tiene, según el artículo 25 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación de pagar una sanción que la Administración tributaria impone por una infracción tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "No es una obligación tributaria accesoria, porque las sanciones tributarias no tienen esa consideración."
  - id: b
    text:
      es: "Es una obligación tributaria accesoria, porque se exige en relación con la obligación principal."
  - id: c
    text:
      es: "Es una obligación entre particulares resultante del tributo, porque nace de un acto de repercusión previsto legalmente."
  - id: d
    text:
      es: "Es una obligación tributaria accesoria si se impone junto con intereses de demora."
  explanation:
    es: "Las sanciones tributarias no tienen la consideración de obligaciones accesorias. No basta que se impongan en relación con otra obligación para que lo sean. No son obligaciones entre particulares, porque se exigen por la Administración y no nacen de actos de repercusión, y su imposición junto con intereses de demora tampoco las convierte en accesorias."
  citation: "art. 25.2 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0094
  prompt:
    es: "¿En cuál de los siguientes casos se exige el interés de demora, según el artículo 26.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Quien presenta una autoliquidación de la que resulta una cantidad a ingresar una vez finalizado el plazo establecido."
  - id: b
    text:
      es: "Quien presenta una autoliquidación con resultado a ingresar y la paga dentro del plazo establecido."
  - id: c
    text:
      es: "Quien recibe en plazo una devolución a la que tenía derecho según la liquidación practicada."
  - id: d
    text:
      es: "Quien paga la deuda dentro del plazo en período voluntario tras recibir la liquidación."
  explanation:
    es: "El interés de demora se exige, entre otros casos, a quien presenta una autoliquidación de la que resulta una cantidad a ingresar una vez finalizado el plazo. Quien presenta y paga en plazo, recibe una devolución que le corresponde o paga dentro del período voluntario no incurre en ninguno de los supuestos del artículo 26.1."
  citation: "art. 26.1 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0095
  prompt:
    es: "De acuerdo con el artículo 26.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora se exigirá, entre otros supuestos, cuando finalice el plazo establecido para el pago en período voluntario de una deuda resultante de:"
  options:
  - id: a
    text:
      es: "una liquidación practicada por la Administración, pero no del importe de una sanción, sin que el ingreso se hubiera efectuado."
  - id: b
    text:
      es: "una liquidación practicada por la Administración o de una sanción, aunque el ingreso se hubiera efectuado en plazo."
  - id: c
    correct: true
    text:
      es: "una liquidación practicada por la Administración o del importe de una sanción, sin que el ingreso se hubiera efectuado."
  - id: d
    text:
      es: "una autoliquidación presentada en plazo por el obligado, cuando el ingreso se efectúe al presentarla."
  explanation:
    es: "Se exige interés de demora cuando termina el plazo de pago en voluntaria de una liquidación de la Administración o de una sanción sin que se haya ingresado. Excluir la sanción recorta el supuesto, y el ingreso en plazo, o el pago al presentar una autoliquidación en plazo, no genera demora."
  citation: "art. 26.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0096
  prompt:
    es: "Según el artículo 26.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora se exigirá cuando finalice el plazo establecido para la presentación de una autoliquidación o declaración sin que hubiera sido presentada o hubiera sido presentada incorrectamente, salvo lo dispuesto para:"
  options:
  - id: a
    text:
      es: "las declaraciones extemporáneas presentadas tras un requerimiento previo de la Administración."
  - id: b
    text:
      es: "las autoliquidaciones presentadas incorrectamente cuando de ellas no resulte cantidad a ingresar."
  - id: c
    text:
      es: "las declaraciones presentadas fuera de plazo con solicitud de aplazamiento del importe a ingresar."
  - id: d
    correct: true
    text:
      es: "las declaraciones extemporáneas presentadas sin requerimiento previo de la Administración."
  explanation:
    es: "La salvedad del artículo 26.2.b) remite al apartado 2 del artículo 27, que regula el recargo de las declaraciones extemporáneas presentadas sin requerimiento previo. Si hubo requerimiento previo no se aplica ese artículo, y las autoliquidaciones incorrectas sin cantidad a ingresar o las presentadas con solicitud de aplazamiento no son la salvedad de este apartado."
  citation: "art. 26.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0097
  prompt:
    es: "Según el artículo 26.2.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, se exige interés de demora cuando se suspende la ejecución del acto. ¿Respecto de qué recursos y reclamaciones se exceptúa esa exigencia hasta la finalización del plazo de pago en período voluntario abierto por la resolución final?"
  options:
  - id: a
    text:
      es: "En los recursos y reclamaciones contra liquidaciones tributarias."
  - id: b
    text:
      es: "En los recursos y reclamaciones contra actos de recaudación en período ejecutivo."
  - id: c
    text:
      es: "En todos los recursos y reclamaciones, con independencia del acto recurrido."
  - id: d
    correct: true
    text:
      es: "En los recursos y reclamaciones contra sanciones."
  explanation:
    es: "La excepción del artículo 26.2.c) es solo para los recursos y reclamaciones contra sanciones: durante la suspensión no se exige interés hasta que termina el plazo de pago abierto por la resolución que pone fin a la vía administrativa. Contra liquidaciones o actos de recaudación sí se exige, y la excepción no alcanza a todos los recursos."
  citation: "art. 26.2 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0098
  prompt:
    es: "Conforme al artículo 26.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora se exigirá cuando se inicie el período ejecutivo, salvo lo dispuesto respecto a los intereses de demora cuando sea exigible:"
  options:
  - id: a
    correct: true
    text:
      es: "el recargo ejecutivo o el recargo de apremio reducido."
  - id: b
    text:
      es: "el recargo de apremio ordinario o el recargo por declaración extemporánea."
  - id: c
    text:
      es: "el recargo ejecutivo, pero no el recargo de apremio reducido."
  - id: d
    text:
      es: "el recargo de apremio ordinario, pero no el recargo ejecutivo."
  explanation:
    es: "La salvedad del artículo 26.2.d) alcanza al recargo ejecutivo y al recargo de apremio reducido, y para ellos se estará a lo que dispone el artículo 28.5. Excluir el apremio reducido o aplicar la salvedad al apremio ordinario altera el texto, y el recargo por declaración extemporánea pertenece a otro supuesto."
  citation: "art. 26.2 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0099
  prompt:
    es: "De acuerdo con el artículo 26.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora se exigirá cuando el obligado tributario haya obtenido una devolución improcedente, salvo que:"
  options:
  - id: a
    text:
      es: "devuelva el importe cobrado dentro de los tres meses siguientes a su cobro, aunque haya mediado requerimiento."
  - id: b
    text:
      es: "la Administración tributaria no hubiera notificado todavía la liquidación que corrija la devolución."
  - id: c
    correct: true
    text:
      es: "voluntariamente regularice su situación tributaria, sin perjuicio de lo dispuesto para las declaraciones extemporáneas sin requerimiento previo."
  - id: d
    text:
      es: "el importe de la devolución cobrada no supere un tercio de la cuota ingresada en el período."
  explanation:
    es: "La única salvedad del artículo 26.2.f) es que el obligado regularice voluntariamente su situación, sin perjuicio de lo previsto en el artículo 27.2 para las declaraciones extemporáneas sin requerimiento previo. No existe plazo de tres meses que evite la demora si hubo requerimiento, ni depende de que la Administración haya notificado la liquidación, ni de un límite sobre la cuota ingresada."
  citation: "art. 26.2 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0100
  prompt:
    es: "Según el artículo 26.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora se calculará sobre el importe no ingresado en plazo o sobre la cuantía de la devolución cobrada improcedentemente, y resultará exigible:"
  options:
  - id: a
    text:
      es: "durante un máximo de cuatro años desde el fin del plazo de pago en período voluntario."
  - id: b
    correct: true
    text:
      es: "durante el tiempo al que se extienda el retraso del obligado, salvo lo dispuesto en el apartado siguiente."
  - id: c
    text:
      es: "desde el devengo del tributo hasta el día del ingreso efectivo de la deuda."
  - id: d
    text:
      es: "desde la notificación de la liquidación hasta el fin del plazo de pago en período voluntario."
  explanation:
    es: "El interés es exigible durante el tiempo que dura el retraso del obligado, salvo lo que dispone el apartado 4 sobre incumplimientos de plazos de la Administración. No tiene el tope de cuatro años, que es el plazo de prescripción, ni arranca en el devengo, ni se limita al período voluntario de pago."
  citation: "art. 26.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0102
  prompt:
    es: "Según el artículo 26.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la regla por la que no se exigen intereses de demora desde que la Administración incumple un plazo para resolver no se aplica al incumplimiento del plazo para resolver:"
  options:
  - id: a
    text:
      es: "las solicitudes de compensación de deudas tributarias."
  - id: b
    text:
      es: "los recursos administrativos, cuando se haya acordado la suspensión del acto."
  - id: c
    text:
      es: "las solicitudes de rectificación de autoliquidaciones del obligado."
  - id: d
    correct: true
    text:
      es: "las solicitudes de aplazamiento o fraccionamiento del pago."
  explanation:
    es: "El segundo párrafo del artículo 26.4 excluye de la regla el plazo para resolver las solicitudes de aplazamiento o fraccionamiento. En los demás casos, como la compensación o los recursos con suspensión, sí se dejan de exigir los intereses, y la rectificación de autoliquidaciones no es una excepción que el apartado prevea."
  citation: "art. 26.4 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "definición"
