# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q227
  prompt:
    es: "En Excel 365, A1 contiene la fórmula =B1+C1. ¿Qué muestra, en otra celda, la fórmula =FORMULATEXTO(A1)?"
  options:
  - id: a
    text:
      es: "El resultado numérico de sumar B1 y C1"
  - id: b
    text:
      es: "VERDADERO"
  - id: c
    text:
      es: "El número de caracteres de la fórmula"
  - id: d
    correct: true
    text:
      es: "La propia fórmula =B1+C1, como texto"
  explanation:
    es: "FORMULATEXTO devuelve la fórmula de la referencia dada como texto, es decir, =B1+C1. El valor sumado es lo que muestra A1; VERDADERO sería el resultado de ESFORMULA y el número de caracteres, el de LARGO."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-formulas-html
- id: m06-l05-q228
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función BUSCARX en comparación con BUSCARV?"
  options:
  - id: a
    text:
      es: "Solo busca en la primera columna y devuelve coincidencias aproximadas"
  - id: b
    correct: true
    text:
      es: "Funciona en cualquier dirección y devuelve coincidencias exactas de forma predeterminada"
  - id: c
    text:
      es: "Busca únicamente de izquierda a derecha y exige ordenar la tabla"
  - id: d
    text:
      es: "Cuenta las filas de una referencia en las que encuentra el valor"
  explanation:
    es: "BUSCARX es una versión mejorada de BUSCARV que funciona en cualquier dirección y devuelve coincidencias exactas de forma predeterminada. Buscar solo en la columna 1 de la matriz es lo propio de BUSCARV, y contar filas es FILAS."
  citation: "fuente: `ms-excel-formulas.html`; «Análisis detallado de las fórmulas»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q229
  prompt:
    es: "En Excel 365, la función que busca en la fila superior de una matriz y devuelve el valor de la celda indicada es:"
  options:
  - id: a
    text:
      es: "BUSCARV"
  - id: b
    text:
      es: "FILAS"
  - id: c
    text:
      es: "FORMULATEXTO"
  - id: d
    correct: true
    text:
      es: "BUSCARH"
  explanation:
    es: "BUSCARH busca en la fila superior de una matriz y devuelve el valor de la celda indicada. BUSCARV busca en la columna 1 de la matriz, FILAS devuelve el número de filas de una referencia y FORMULATEXTO devuelve una fórmula como texto."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q230
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones devuelve VERDADERO si el valor es el valor de error #N/A?"
  options:
  - id: a
    text:
      es: "ESERROR"
  - id: b
    correct: true
    text:
      es: "ESNOD"
  - id: c
    text:
      es: "ESERR"
  - id: d
    text:
      es: "ESBLANCO"
  explanation:
    es: "ESNOD devuelve VERDADERO si el valor es el valor de error #N/A. ESERROR lo hace con cualquier valor de error, ESERR con cualquiera excepto #N/A y ESBLANCO con valores en blanco."
