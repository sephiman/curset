  - option: It is the bus that wraps a local segment and adds distribution
    anchor: axon-command-infrastructure#_distributed_command_bus
    sentence: The DistributedCommandBus takes in a local CommandBus (called the localSegment), a CommandBusConnector, and DistributedCommandBusConfiguration
m08-l06-q10:
  key:
    anchor: axon-data-protection#_about
    sentence: 'By encrypting parts of that data, and storing a key outside of the event stream so that it can be deleted, this becomes possible again: deleting the key will effectively delete the data.'
  wrong:
  - option: The events that hold the personal data, removed from the event store
    anchor: axon-data-protection#_about
    sentence: With event sourcing, all data is stored as a series of immutable, undeletable events.
  - option: The encrypted field values, rewritten in place inside each stored event
    anchor: axon-data-protection#_about
    sentence: Of course, other approaches are possible (including changing the immutable events anyway), but these suffer from significant drawbacks and potential operations costs.
  - option: The key that encrypted the personal fields, stored inside the event stream
    anchor: axon-data-protection#_about
    sentence: storing a key outside of the event stream so that it can be deleted
m08-l06-q11:
  key:
    anchor: axon-event-versioning#event_versioning_at_handling_time
    sentence: When a handler needs to process an event, Axon converts the payload to the handler’s expected type at that moment.
  wrong:
  - option: At storing time, when the event is written once in every format a handler needs
    anchor: axon-event-versioning#event_versioning_at_handling_time
    sentence: When events are stored in the event store, they retain their serialized form (for example JSON or Avro binary) along with metadata about their MessageType.
  - option: Only after an upcaster has rewritten the stored events
    anchor: axon-event-versioning#event_versioning_at_handling_time
    sentence: You can evolve your event handling without modifying stored events.
  - option: Never, because every handler of an event must use the same Java class
    anchor: axon-event-versioning#event_versioning_at_handling_time
    sentence: Different handlers can process the same event using different Java representations.
m08-l06-q12:
  key:
    anchor: axon-message-transformation#_when_to_reach_for_a_transformation
    sentence: 'You need to restructure the payload itself: combine firstName and lastName into a single fullName, or wrap minCapacity and maxCapacity into a range object.'
  wrong:
  - option: Adding a new field that has a default value
    anchor: axon-message-transformation#_when_to_reach_for_a_transformation
    sentence: Adding fields with defaults, dropping fields a handler no longer reads, renaming fields, and changing compatible field types are all typically handled here.
    exclusive: true
  - option: Renaming a field of the payload
    anchor: axon-message-transformation#_when_to_reach_for_a_transformation
    sentence: Adding fields with defaults, dropping fields a handler no longer reads, renaming fields, and changing compatible field types are all typically handled here.
    exclusive: true
