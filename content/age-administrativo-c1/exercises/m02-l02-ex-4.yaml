# anchor: fuente-cultura-dta-diccionario-html
- id: m02-l02-q064
  prompt:
    es: "Según el Diccionario de Terminología Archivística del Ministerio de Cultura, ¿qué operación consiste en establecer las categorías y grupos que reflejan la estructura jerárquica del fondo?"
  options:
  - id: a
    text:
      es: "La ordenación."
  - id: b
    text:
      es: "La valoración."
  - id: c
    correct: true
    text:
      es: "La clasificación."
  - id: d
    text:
      es: "La descripción."
  explanation:
    es: "El Diccionario define la clasificación como la «Operación archivística que consiste en el establecimiento de las categorías y grupos que reflejan la estructura jerárquica del fondo». La ordenación establece secuencias dentro de esas categorías. La valoración estudia las características de los documentos para decidir su conservación o eliminación. La descripción no es la operación que fija las categorías del fondo."
  citation: "fuente: `cultura-dta-diccionario.html`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-cultura-dta-diccionario-html
- id: m02-l02-q065
  prompt:
    es: "Para el Diccionario de Terminología Archivística del Ministerio de Cultura, la ordenación establece, dentro de las categorías y grupos definidos en la clasificación, secuencias naturales:"
  options:
  - id: a
    text:
      es: "Numéricas y/o geográficas."
  - id: b
    correct: true
    text:
      es: "Cronológicas y/o alfabéticas."
  - id: c
    text:
      es: "Temáticas y/o jerárquicas."
  - id: d
    text:
      es: "Orgánicas y/o funcionales."
  explanation:
    es: "El Diccionario define la ordenación como la operación que consiste en «establecer, secuencias naturales cronológicas y/o alfabéticas, dentro de las categorías y grupos definidos en la clasificación». No nombra secuencias numéricas, geográficas, temáticas, jerárquicas, orgánicas ni funcionales. La estructura jerárquica del fondo es lo que refleja la clasificación."
  citation: "fuente: `cultura-dta-diccionario.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-cultura-dta-diccionario-html
- id: m02-l02-q066
  prompt:
    es: "Señale la afirmación correcta sobre la clasificación y la ordenación según el Diccionario de Terminología Archivística del Ministerio de Cultura:"
  options:
  - id: a
    text:
      es: "La clasificación establece secuencias dentro de los grupos definidos previamente en la ordenación."
  - id: b
    correct: true
    text:
      es: "La ordenación establece secuencias dentro de las categorías y grupos definidos en la clasificación."
  - id: c
    text:
      es: "La ordenación es el primer paso del proceso de organización y precede a la clasificación."
  - id: d
    text:
      es: "La clasificación y la ordenación son una misma operación con dos nombres distintos."
  explanation:
    es: "Según el Diccionario, la ordenación consiste en establecer secuencias «dentro de las categorías y grupos definidos en la clasificación». Es la clasificación la que fija los grupos, así que no establece secuencias dentro de grupos de la ordenación. El primer paso del proceso de organización es la clasificación, no la ordenación. Son dos operaciones distintas, con definiciones distintas."
  citation: "fuente: `cultura-dta-diccionario.html`"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q067
  prompt:
    es: "El registro electrónico propio de que pueden disponer los Organismos públicos vinculados o dependientes de una Administración ha de ser:"
  options:
  - id: a
    text:
      es: "Parte del Registro Electrónico General, sin numeración ni asientos propios del Organismo."
  - id: b
    text:
      es: "Independiente del Registro Electrónico General, con su propio calendario de días hábiles."
  - id: c
    text:
      es: "Accesible solo desde la sede del Organismo, sin conexión con otras Administraciones."
  - id: d
    correct: true
    text:
      es: "Plenamente interoperable e interconectado con el Registro Electrónico General de su Administración."
  explanation:
    es: "El artículo 16.1 de la Ley 39/2015 permite a esos Organismos «disponer de su propio registro electrónico plenamente interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende». Es un registro propio, así que no carece de asientos propios. No es independiente del Registro General, y el calendario de días inhábiles lo fija la sede de cada registro según el artículo 31.3. Tampoco queda aislado: la interconexión es la condición que pone la ley."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-31
- id: m02-l02-q068
  prompt:
    es: "El registro electrónico de cada Administración u Organismo, en cuanto a los días y horas en que admite la presentación de documentos, permitirá presentarlos:"
  options:
  - id: a
    correct: true
    text:
      es: "Todos los días del año durante las veinticuatro horas."
  - id: b
    text:
      es: "Todos los días hábiles durante las veinticuatro horas."
  - id: c
    text:
      es: "Todos los días del año, en el horario de su sede electrónica."
  - id: d
    text:
      es: "Los días hábiles, en el horario de las oficinas de asistencia."
  explanation:
    es: "El artículo 31.2.a) de la Ley 39/2015 dice que el registro electrónico «Permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». No se limita a los días hábiles. La sede electrónica no impone un horario de presentación. El horario de las oficinas de asistencia rige para la atención presencial, no para el registro electrónico."
  citation: "art. 31.2.a) LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2011-18541-art-8
- id: m02-l02-q069
  prompt:
    es: "¿Cuál de las siguientes NO es una clase de archivo de la Administración General del Estado según el artículo 8 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos?"
  options:
  - id: a
    text:
      es: "Archivos de oficina o de gestión."
  - id: b
    correct: true
    text:
      es: "Archivos de conservación permanente."
  - id: c
    text:
      es: "Archivo intermedio."
  - id: d
    text:
      es: "Archivos históricos."
  explanation:
    es: "El artículo 8 clasifica los Archivos, atendiendo al ciclo vital, en archivos de oficina o de gestión, archivos generales o centrales de los Ministerios y de sus organismos públicos, archivo intermedio y archivos históricos. Los archivos de oficina o de gestión, el archivo intermedio y los archivos históricos están en esa lista. Los «archivos de conservación permanente» no son una clase: la conservación permanente es uno de los destinos posibles de los documentos al final del ciclo vital."
  citation: "art. 8 RD 1708/2011"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2011-18541-art-9
- id: m02-l02-q071
  prompt:
    es: "Señale la afirmación correcta sobre los documentos de apoyo informativo según el artículo 9 del Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos:"
  options:
  - id: a
    correct: true
    text:
      es: "Los elimina el archivo de oficina o de gestión antes de la transferencia al Archivo central."
  - id: b
    text:
      es: "Los elimina el Archivo Central una vez recibidos en la transferencia periódica de la unidad."
  - id: c
    text:
      es: "Se transfieren al archivo intermedio, que resuelve después sobre su eliminación."
  - id: d
    text:
      es: "Se conservan en la unidad productora hasta su transferencia al archivo intermedio."
  explanation:
    es: "El artículo 9 incluye entre las funciones de los archivos de oficina o de gestión «Eliminar los documentos de apoyo informativo antes de la transferencia al Archivo central». No los elimina el Archivo Central tras recibirlos, porque no llegan a transferirse. No pasan al archivo intermedio para que decida sobre ellos. Tampoco se conservan en la unidad productora hasta una transferencia al archivo intermedio: los archivos de oficina transfieren al Archivo central, no al intermedio."
  citation: "art. 9 RD 1708/2011"
  difficulty: 2
  tags:
  - "competencia"
