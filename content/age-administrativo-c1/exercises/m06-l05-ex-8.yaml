# anchor: fuente-ms-excel-graficos-html
- id: m06-l05-q251
  prompt:
    es: "En Excel 365 para Windows, tras seleccionar los datos, ¿cuál de las siguientes rutas de la cinta de opciones abre los gráficos recomendados?"
  options:
  - id: a
    text:
      es: "Insertar › Tabla dinámica"
  - id: b
    text:
      es: "Insertar › Segmentación"
  - id: c
    text:
      es: "Datos › Ordenar y filtrar"
  - id: d
    correct: true
    text:
      es: "Insertar › Gráficos recomendados"
  explanation:
    es: "Se seleccionan los datos y se elige Insertar › Gráficos recomendados. Insertar › Tabla dinámica crea una tabla dinámica, Insertar › Segmentación añade botones de filtro y Datos › Filtro pone flechas en los encabezados."
  citation: "fuente: `ms-excel-graficos.html`; «Crear un gráfico»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q252
  prompt:
    es: "Señale el método abreviado de Excel 365 que crea un gráfico incrustado a partir de los datos del rango actual."
  options:
  - id: a
    text:
      es: "F11"
  - id: b
    text:
      es: "Alt+Mayús+F1"
  - id: c
    correct: true
    text:
      es: "Alt+F1"
  - id: d
    text:
      es: "Ctrl+F1"
  explanation:
    es: "Alt+F1 crea un gráfico incrustado a partir de los datos del rango actual. F11 lo crea en una hoja de gráfico distinta, Alt+Mayús+F1 inserta una hoja de cálculo nueva y Ctrl+F1 muestra u oculta la cinta de opciones."
  citation: "fuente: `ms-excel-atajos.html`; «Teclas de función»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q253
  prompt:
    es: "Señale la tecla de Excel 365 que crea un gráfico a partir de los datos del rango actual en una hoja de gráfico distinta."
  options:
  - id: a
    text:
      es: "Alt+F1"
  - id: b
    text:
      es: "Mayús+F11"
  - id: c
    text:
      es: "Alt+F11"
  - id: d
    correct: true
    text:
      es: "F11"
  explanation:
    es: "Solo F11 crea un gráfico en una hoja de gráfico distinta. Alt+F1 lo crea incrustado, Mayús+F11 inserta una hoja de cálculo nueva y Alt+F11 abre el Editor de Visual Basic para Aplicaciones."
  citation: "fuente: `ms-excel-atajos.html`; «Solo F11: crea un gráfico a partir de los datos del rango actual en una hoja de gráfico distinta.»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-graficos-html
- id: m06-l05-q254
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe la pestaña Todos los gráficos del cuadro de gráficos recomendados?"
  options:
  - id: a
    text:
      es: "Muestra una vista previa de un gráfico recomendado para los datos"
  - id: b
    text:
      es: "Crea de inmediato un gráfico con los datos seleccionados"
  - id: c
    correct: true
    text:
      es: "Muestra todos los tipos de gráficos"
  - id: d
    text:
      es: "Agrega una línea de tendencia a un gráfico existente"
  explanation:
    es: "Si ningún gráfico recomendado gusta, la pestaña Todos los gráficos muestra todos los tipos de gráficos. La vista previa se obtiene al seleccionar un gráfico en Gráficos recomendados, el gráfico inmediato lo crea Alt+F1 y la línea de tendencia se agrega con Agregar elemento de gráfico."
  citation: "fuente: `ms-excel-graficos.html`; «Crear un gráfico»"
  difficulty: 1
  tags:
  - "concepto"
  - "ofimática-menú"
# anchor: fuente-ms-excel-graficos-html
- id: m06-l05-q255
  prompt:
    es: "En Excel 365, tras seleccionar datos y presionar Alt+F1, ¿qué advierte la ayuda de Microsoft sobre el gráfico creado?"
  options:
  - id: a
    text:
      es: "Que solo se crea si los datos están en una tabla de Excel"
  - id: b
    correct: true
    text:
      es: "Que es posible que no sea el mejor gráfico para los datos"
  - id: c
    text:
      es: "Que se coloca siempre en una hoja de gráfico distinta"
  - id: d
    text:
      es: "Que hay que confirmarlo con Aceptar para que aparezca"
  explanation:
    es: "La ayuda dice que Alt+F1 crea un gráfico inmediatamente, pero que es posible que no sea el mejor gráfico para los datos. La hoja de gráfico distinta corresponde a F11, y no se menciona confirmar con Aceptar ni exigir una tabla."
  citation: "fuente: `ms-excel-graficos.html`; «Crear un gráfico»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-graficos-html
- id: m06-l05-q256
