- id: m09-l02-qa01
  prompt:
    en: According to Microsoft in Design a data partitioning strategy, which statement about horizontal partitioning,
      or sharding, does the guide make?
  options:
  - id: a
    text:
      en: Shards must all be the same size to keep the load even
  - id: b
    correct: true
    text:
      en: The sharding key you choose is the most important factor
  - id: c
    text:
      en: A customer name's first letter gives an even spread across shards
  - id: d
    text:
      en: The sharding key is easy to change once the system is in operation
  explanation:
    en: Microsoft writes that the most important factor in sharding is the sharding key that you choose. It writes
      that the shards do not have to be the same size, which contradicts requiring equal sizes. It writes that using
      the first letter of a customer's name can create an unbalanced distribution because some letters are more
      common than others, which contradicts an even spread. It writes that it can be difficult to change the key
      after the system is in operation, which contradicts an easy change.
  citation: azure-data-partitioning#horizontal-partitioning-sharding
- id: m09-l02-qa03
  prompt:
    en: According to Citus in Choosing Distribution Column, which statement about choosing a distribution column
      does the documentation make?
  options:
  - id: a
    correct: true
    text:
      en: Choose a high-cardinality column as the distribution column
  - id: b
    text:
      en: A status column with three values is a good distribution column
  - id: c
    text:
      en: Distributing on a skewed column spreads data evenly across shards
  - id: d
    text:
      en: A fact table can be distributed on several keys at once
  explanation:
    en: Citus writes that you should choose a column with high cardinality as the distribution column. It writes
      that a status field with a few values is a poor choice because the number of distinct values limits the shards,
      which contradicts it being a good column. It writes that distributing on a skewed column makes data accumulate
      in certain shards, which contradicts an even spread. It writes that a fact table can have only one distribution
      key, which contradicts several keys at once.
  citation: citus-colocation#id1
- id: m09-l02-qa04
  prompt:
    en: According to Amazon Web Services in Caching strategies for Memcached, which statement about the lazy loading
      strategy does the user guide make?
  options:
  - id: a
    text:
      en: A cache miss under lazy loading costs a single trip to the cache
  - id: b
    text:
      en: A node failure is fatal for an application using lazy loading
  - id: c
    correct: true
    text:
      en: Lazy loading loads data into the cache only when necessary
  - id: d
    text:
      en: Lazy loading refreshes the cache whenever the database data changes
  explanation:
    en: Amazon Web Services writes that lazy loading is a caching strategy that loads data into the cache only when
      necessary. It writes that each cache miss results in three trips, which contradicts a single trip. It writes
      that node failures are not fatal for the application, which contradicts a fatal failure. It writes that there
      are no updates to the cache when data is changed in the database, which contradicts refreshing on each change.
  citation: aws-elasticache-caching-strategies#Strategies.LazyLoading; aws-elasticache-caching-strategies#Strategies.LazyLoading.Evaluation
- id: m09-l02-qa05
  prompt:
    en: According to Amazon Web Services in Caching strategies for Memcached, which statement about the write-through
      strategy does the user guide make?
  options:
  - id: a
    correct: true
    text:
      en: Write-through adds or updates cached data on each database write
  - id: b
    text:
      en: With write-through, data in the cache can go stale after a database write
  - id: c
    text:
      en: A node started after a failure holds all the data under write-through
  - id: d
    text:
      en: Each write under write-through involves a single trip, to the database
  explanation:
    en: Amazon Web Services writes that write-through adds data or updates data in the cache whenever data is written
      to the database. It writes that data in the cache is never stale, which contradicts stale data after a write.
      It writes that if you spin up a new node there is missing data, which contradicts a node holding all the data.
      It writes that every write involves two trips, which contradicts a single trip.
  citation: aws-elasticache-caching-strategies#Strategies.WriteThrough; aws-elasticache-caching-strategies#Strategies.WriteThrough.Evaluation
- id: m09-l02-qa07
  prompt:
    en: According to Jas Chhabra in Caching challenges and strategies, which statement about cache expiration and
      eviction does the article make?
  options:
  - id: a
    text:
      en: The most common eviction policy is first-in, first-out
  - id: b
    text:
      en: The TTL is chosen without regard to clients' tolerance of stale data
  - id: c
    text:
      en: Cache size and TTL should be picked at launch and never revisited
  - id: d
    correct: true
    text:
      en: The eviction policy controls how items leave the cache at capacity
  explanation:
    en: Chhabra writes that the eviction policy controls how items are removed from the cache when it reaches capacity.
      He writes that the most common eviction policy is Least Recently Used, which contradicts first-in, first-out.
      He writes that the TTL is chosen based on client requirements such as tolerance of stale data, which contradicts
      choosing it without regard to them. He writes that they want to avoid a developer picking cache size and TTL
      values once and never validating them, which contradicts never revisiting them.
  citation: aws-builders-caching-challenges#cache-expiration
