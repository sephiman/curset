# anchor: boe-a-2013-12887-art-2
- id: m01-l07-q001
  prompt:
    es: "¿A qué actividades de la Casa de Su Majestad el Rey, el Congreso y el Senado se aplica el título I de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "A sus actividades sujetas a Derecho Administrativo"
  - id: b
    text:
      es: "A todas sus actividades, cualquiera que sea su naturaleza"
  - id: c
    text:
      es: "A sus actividades sujetas a Derecho privado y laboral"
  - id: d
    text:
      es: "A sus actividades institucionales y de representación del Estado"
  explanation:
    es: "El artículo 2.1.f) incluye a la Casa de Su Majestad el Rey, al Congreso y al Senado «en relación con sus actividades sujetas a Derecho Administrativo». La ley no los somete en todas sus actividades. Las actividades sujetas a Derecho privado o laboral quedan fuera de ese criterio. Las actividades institucionales y de representación tampoco son el criterio que fija la ley."
  citation: "art. 2.1.f) Ley 19/2013"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2013-12887-art-3
- id: m01-l07-q003
  prompt:
    es: "Una entidad privada queda sujeta a las obligaciones de publicidad activa cuando al menos el 40 % de sus ingresos anuales sean ayudas o subvenciones públicas, siempre que alcancen como mínimo:"
  options:
  - id: a
    text:
      es: "La cantidad de 10.000 euros"
  - id: b
    text:
      es: "La cantidad de 50.000 euros"
  - id: c
    correct: true
    text:
      es: "La cantidad de 5.000 euros"
  - id: d
    text:
      es: "La cantidad de 100.000 euros"
  explanation:
    es: "El artículo 3.b) Ley 19/2013 añade al criterio del 40 % la condición de que las ayudas alcancen «como mínimo la cantidad de 5.000 euros». Los 100.000 euros son el otro criterio del mismo precepto, que funciona solo. Los 50.000 euros son la cifra del artículo 5.4. Los 10.000 euros no aparecen en la ley."
  citation: "art. 3.b) Ley 19/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2013-12887-art-5
- id: m01-l07-q004
  prompt:
    es: "¿Dónde se publica la información sujeta a las obligaciones de transparencia de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, y en qué formatos preferentemente?"
  options:
  - id: a
    correct: true
    text:
      es: "En las sedes electrónicas o páginas web, preferiblemente en formatos reutilizables"
  - id: b
    text:
      es: "En el Boletín Oficial del Estado, preferiblemente en formatos firmados electrónicamente"
  - id: c
    text:
      es: "En los tablones de anuncios de cada órgano, preferiblemente en formato papel"
  - id: d
    text:
      es: "En las sedes electrónicas o páginas web, preferiblemente en formatos no editables"
  explanation:
    es: "El artículo 5.4 dice que la información se publica «en las correspondientes sedes electrónicas o páginas web» y, «preferiblemente, en formatos reutilizables». La ley no remite al Boletín Oficial del Estado ni a los tablones de anuncios. Los formatos no editables van contra la preferencia por la reutilización."
  citation: "art. 5.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-6
- id: m01-l07-q005
  prompt:
    es: "En el ámbito de la Administración General del Estado, ¿a quién corresponde evaluar el cumplimiento de los planes y programas anuales y plurianuales que publican las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Al Consejo de Transparencia y Buen Gobierno"
  - id: b
    text:
      es: "A la Intervención General de la Administración del Estado"
  - id: c
    text:
      es: "A las Secretarías Generales Técnicas de los departamentos"
  - id: d
    correct: true
    text:
      es: "A las inspecciones generales de servicios"
  explanation:
    es: "El artículo 6.2 Ley 19/2013 atribuye en la Administración General del Estado «a las inspecciones generales de servicios la evaluación del cumplimiento de estos planes y programas». El Consejo de Transparencia y Buen Gobierno controla la publicidad activa (art. 9.1), no evalúa los planes. La Intervención General y las Secretarías Generales Técnicas no reciben esta función en la ley."
  citation: "art. 6.2 Ley 19/2013"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-art-7
- id: m01-l07-q006
  prompt:
    es: "¿Cuál de los siguientes documentos deben publicar las Administraciones Públicas como información de relevancia jurídica, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Anteproyectos de Ley y los proyectos de Decretos Legislativos de su iniciativa"
  - id: b
    text:
      es: "Las actas de las deliberaciones del Consejo de Ministros"
  - id: c
    text:
      es: "Las sentencias firmes dictadas en los procesos en que sean parte"
  - id: d
    text:
      es: "Las agendas de trabajo de sus altos cargos y personal directivo"
  explanation:
    es: "El artículo 7.b) obliga a publicar «los Anteproyectos de Ley y los proyectos de Decretos Legislativos cuya iniciativa les corresponda». Las actas del Consejo de Ministros, las sentencias firmes y las agendas de los altos cargos no figuran en la lista del artículo 7."
  citation: "art. 7 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-9
- id: m01-l07-q008
  prompt:
    es: "¿Qué órgano controla el cumplimiento por la Administración General del Estado de las obligaciones de publicidad activa de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El Defensor del Pueblo, como alto comisionado de las Cortes Generales"
  - id: b
    correct: true
    text:
      es: "El Consejo de Transparencia y Buen Gobierno"
  - id: c
    text:
      es: "El Tribunal de Cuentas, como supremo órgano fiscalizador"
  - id: d
    text:
      es: "La Agencia Española de Protección de Datos"
  explanation:
    es: "Según el artículo 9.1, el cumplimiento de la publicidad activa por la Administración General del Estado «será objeto de control por parte del Consejo de Transparencia y Buen Gobierno». El Defensor del Pueblo, el Tribunal de Cuentas y la Agencia Española de Protección de Datos tienen un representante en la Comisión del Consejo (art. 36.2), pero la ley no les da este control."
  citation: "art. 9.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-art-10
- id: m01-l07-q009
  prompt:
    es: "De acuerdo con el artículo 10 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Portal de la Transparencia de la Administración General del Estado depende, según el texto legal:"
  options:
  - id: a
    text:
      es: "Del Ministerio de Hacienda y Administraciones Públicas"
  - id: b
    text:
      es: "Del Consejo de Transparencia y Buen Gobierno"
  - id: c
    correct: true
    text:
      es: "Del Ministerio de la Presidencia"
  - id: d
    text:
      es: "De la Secretaría de Estado de Administraciones Públicas"
  explanation:
    es: "El artículo 10.1 describe un Portal de la Transparencia «dependiente del Ministerio de la Presidencia». El Ministerio de Hacienda y Administraciones Públicas aparece en otros preceptos de la ley, como el artículo 37, no en este. El Consejo de Transparencia y Buen Gobierno controla la publicidad activa, pero el Portal no depende de él. La Secretaría de Estado de Administraciones Públicas solo aparece en la composición de la Comisión (art. 36.2)."
  citation: "art. 10.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-art-11
- id: m01-l07-q010
  prompt:
    es: "¿Cuál de los siguientes principios deben respetar las prescripciones técnicas con las que se publica la información del Portal de la Transparencia de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El principio de seguridad de la información"
  - id: b
    correct: true
    text:
      es: "El principio de reutilización de la información"
  - id: c
    text:
      es: "El principio de confidencialidad de la información"
  - id: d
    text:
      es: "El principio de exhaustividad de la información"
  explanation:
    es: "El artículo 11 Ley 19/2013 enumera tres principios: accesibilidad, interoperabilidad y reutilización. La seguridad, la confidencialidad y la exhaustividad no están entre ellos."
  citation: "art. 11 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q011
  prompt:
    es: "Según el artículo 14 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿cuál de los siguientes NO es un perjuicio que permite limitar el derecho de acceso?"
  options:
  - id: a
    correct: true
    text:
      es: "El perjuicio para la imagen y el prestigio de las instituciones"
  - id: b
    text:
      es: "El perjuicio para la seguridad nacional o para la seguridad pública"
  - id: c
    text:
      es: "El perjuicio para la protección del medio ambiente"
  - id: d
    text:
      es: "El perjuicio para la política económica y monetaria"
  explanation:
    es: "El artículo 14.1 permite limitar el acceso por un perjuicio para la seguridad nacional (letra a), la seguridad pública (letra d), la política económica y monetaria (letra i) y la protección del medio ambiente (letra l). La imagen y el prestigio de las instituciones no figuran en la lista, así que no son un límite."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q012
  prompt:
    es: "¿Cuál de los siguientes supuestos permite limitar el derecho de acceso a la información pública, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Que acceder a la información suponga un perjuicio para la defensa"
  - id: b
    text:
      es: "Que atender la solicitud suponga una carga de trabajo excesiva para el órgano"
  - id: c
    text:
      es: "Que acceder a la información suponga un perjuicio para la reputación de un alto cargo"
  - id: d
    text:
      es: "Que el solicitante no acredite un interés legítimo en la información"
  explanation:
    es: "La defensa es el límite de la letra b) del artículo 14.1. La carga de trabajo del órgano y la reputación de un alto cargo no están en la lista de límites. La falta de un interés legítimo tampoco limita el acceso: el solicitante ni siquiera tiene que motivar su solicitud (art. 17.3)."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q015
  prompt:
    es: "¿Qué se exige para autorizar el acceso a información pública que incluya datos personales relativos a la salud del afectado, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El consentimiento expreso y por escrito del afectado, en todo caso"
  - id: b
    correct: true
    text:
      es: "El consentimiento expreso del afectado o el amparo de una norma con rango de ley"
  - id: c
    text:
      es: "La ponderación del interés público, sin consentimiento del afectado"
  - id: d
    text:
      es: "La autorización judicial previa a solicitud del órgano"
  explanation:
    es: "Para los datos de salud, el segundo párrafo del artículo 15.1 permite el acceso si se cuenta con «el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley». El consentimiento expreso y por escrito, sin alternativa, es la regla de la ideología, la afiliación sindical, la religión y las creencias. La ley no se conforma con ponderar el interés público para estos datos, ni exige autorización judicial."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q016
  prompt:
    es: "Con carácter general, salvo que prevalezca la protección de datos personales, se concederá el acceso a información con datos meramente identificativos relacionados con:"
  options:
  - id: a
    text:
      es: "La vida privada y familiar de los empleados públicos del órgano"
  - id: b
    text:
      es: "Los procedimientos disciplinarios en curso contra el personal del órgano"
  - id: c
    correct: true
    text:
      es: "La organización, funcionamiento o actividad pública del órgano"
  - id: d
    text:
      es: "La situación patrimonial de los altos cargos y directivos del órgano"
  explanation:
    es: "El artículo 15.2 Ley 19/2013 concede con carácter general el acceso a «datos meramente identificativos relacionados con la organización, funcionamiento o actividad pública del órgano». La vida privada de los empleados, los procedimientos disciplinarios y la situación patrimonial no son ese objeto, y los datos sobre infracciones tienen además la regla reforzada del artículo 15.1."
  citation: "art. 15.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
