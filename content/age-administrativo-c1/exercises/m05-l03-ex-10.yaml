# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q274
  prompt:
    es: "Salvo los casos reservados al Consejo de Ministros, ¿cuál de las siguientes afirmaciones sobre los presidentes o directores de los organismos autónomos del Estado es correcta según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Aprueban y comprometen el gasto; el Subsecretario reconoce las obligaciones."
  - id: b
    text:
      es: "Reconocen y pagan las obligaciones; el Secretario de Estado aprueba el gasto."
  - id: c
    text:
      es: "Aprueban el gasto; el Director General de Presupuestos reconoce las obligaciones."
  - id: d
    correct: true
    text:
      es: "Aprueban y comprometen el gasto, y también reconocen y pagan las obligaciones."
  explanation:
    es: "El artículo 74.2 atribuye a los presidentes o directores de los organismos autónomos del Estado, con la misma salvedad legal, «la aprobación y compromiso del gasto, así como el reconocimiento y el pago de las obligaciones». Las opciones que dan el reconocimiento de las obligaciones al Subsecretario, la aprobación al Secretario de Estado o el reconocimiento al Director General de Presupuestos reparten entre otros órganos actos que el artículo 74.2 reúne en el presidente o director del organismo."
  citation: "art. 74.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1996-2627-regla-14
- id: m05-l03-q275
  prompt:
    es: "De acuerdo con la regla 14.1 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, la solicitud de que se certifique la existencia de crédito disponible al inicio de un expediente de gasto:"
  options:
  - id: a
    correct: true
    text:
      es: "es obligatoria, salvo en los casos del capítulo III de la Instrucción en que no se exige."
  - id: b
    text:
      es: "es obligatoria en todo expediente de gasto, sin excepción alguna en la Instrucción."
  - id: c
    text:
      es: "solo es obligatoria en los expedientes de gasto derivados de contratos."
  - id: d
    text:
      es: "queda a la valoración del Servicio Gestor en todos los expedientes de gasto."
  explanation:
    es: "La regla 14.1 manda al Servicio Gestor solicitar, al inicio de la tramitación de un expediente de gasto, que se certifique la existencia de crédito disponible, y exceptúa los «casos contemplados en el Capítulo III de esta Instrucción, en que tal solicitud no sea obligatoria». La opción que la exige sin excepción olvida esos casos. La que la limita a los contratos estrecha una regla que vale para todo expediente de gasto. La que la deja siempre a la valoración del Servicio Gestor extiende a todos los expedientes lo que la regla prevé solo para los casos del capítulo III, en los que el Servicio Gestor valora la conveniencia de formularla."
  citation: "regla 14.1 IOC"
  difficulty: 3
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q276
  prompt:
    es: "Según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado, ¿qué documento registra la autorización de un gasto de tramitación ordinaria imputable al Presupuesto corriente?"
  options:
  - id: a
    text:
      es: "El documento AD de ejercicio corriente."
  - id: b
    text:
      es: "El documento A de tramitación anticipada."
  - id: c
    correct: true
    text:
      es: "El documento A de ejercicio corriente."
  - id: d
    text:
      es: "El documento RC de ejercicio corriente."
  explanation:
    es: "El apartado sexto.1.e) dice que el documento A de ejercicio corriente «se utilizará en las operaciones de autorización del gasto imputables al Presupuesto corriente». El AD de ejercicio corriente es para operaciones que combinen autorización y compromiso. El A de tramitación anticipada es para la autorización de gastos que se tramitan anticipadamente, y el enunciado habla de tramitación ordinaria. El RC de ejercicio corriente sirve para solicitar el certificado de existencia y retención de crédito."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l03-q277
  prompt:
    es: "¿En qué expedientes de contratación del Estado se dispensa al Servicio gestor de expedir, al inicio, el documento RC de ejercicios posteriores?"
  options:
  - id: a
    correct: true
    text:
      es: "En los de arrendamiento de bienes inmuebles a utilizar por organismos del Estado."
  - id: b
    text:
      es: "En los de adquisición de bienes inmuebles con destino a organismos del Estado."
  - id: c
    text:
      es: "En los de arrendamiento financiero de bienes muebles para organismos del Estado."
  - id: d
    text:
      es: "En los de obras de reforma de bienes inmuebles ocupados por organismos del Estado."
  explanation:
    es: "La regla 77.1 dice que en los expedientes de contratación de arrendamientos de bienes inmuebles a utilizar por organismos del Estado «no será precisa la expedición del documento RC de ejercicios posteriores»; formalizado el contrato, se formula un AD de ejercicios posteriores junto con el AD de ejercicio corriente. La adquisición de inmuebles y las obras de reforma siguen la regla general del primer párrafo: RC de ejercicio corriente y, en su caso, RC de ejercicios posteriores. El arrendamiento financiero aparece en la regla 77.2 solo para exigir un cuadro financiero junto con los documentos D o AD, no para dispensar del RC."
  citation: "regla 77.1 IOC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-86
- id: m05-l03-q278
  prompt:
    es: "Según la regla 86.3 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, en una subvención no nominativa con convocatoria previa de carácter periódico, aprobada la concesión, el Servicio gestor expide:"
  options:
  - id: a
    text:
      es: "un documento OK por el importe de cada una de las subvenciones concedidas."
  - id: b
    text:
      es: "un documento A y, en su caso, un documento A de ejercicios posteriores."
  - id: c
    text:
      es: "un documento RC y, en su caso, un documento RC de ejercicios posteriores."
  - id: d
    correct: true
    text:
      es: "un documento D y, en su caso, un documento D para ejercicios posteriores."
  explanation:
    es: "La regla 86.3 dice: «Cuando se apruebe la concesión de las subvenciones, el Servicio gestor expedirá un documento D y, en su caso, un documento D para ejercicios posteriores». Los documentos A se expiden antes, una vez aprobado el expediente de gasto y antes de publicar la convocatoria. Los RC se expiden durante la tramitación del expediente (regla 86.2). El OK documenta el reconocimiento de la obligación, que llega cuando se cumplen las condiciones de la concesión (regla 86.4)."
  citation: "regla 86.3 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-24
- id: m05-l03-q279
  prompt:
    es: "¿Qué determina que el Servicio gestor expida un documento contable mixto AD en lugar de un documento A y otro documento D separados?"
  options:
  - id: a
    text:
      es: "Que el gasto no supere la cuantía fijada para los contratos menores."
  - id: b
    correct: true
    text:
      es: "Que la autorización y el compromiso del gasto se acuerden en un acto único."
  - id: c
    text:
      es: "Que el gasto se impute a ejercicios posteriores al del Presupuesto corriente."
  - id: d
    text:
      es: "Que la Intervención haya fiscalizado ya el expediente de gasto completo."
  explanation:
    es: "La regla 24.2 liga el AD a un solo hecho: que «la autorización y el compromiso de gasto se acuerdan en un acto único». Ni la cuantía del gasto ni la fiscalización previa deciden qué documento se expide. La imputación a ejercicios posteriores tampoco: la Orden de documentos contables prevé documentos A, D y AD tanto de ejercicio corriente como de ejercicios posteriores."
  citation: "regla 24.2 IOC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q281
  prompt:
    es: "Según el artículo 73.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la acreditación documental previa al reconocimiento de obligaciones con cargo a la Hacienda Pública estatal se hace de conformidad con:"
  options:
  - id: a
    correct: true
    text:
      es: "los acuerdos que en su día aprobaron y comprometieron el gasto correspondiente."
  - id: b
    text:
      es: "las instrucciones que dicte el Ordenador general de pagos del Estado."
  - id: c
    text:
      es: "el informe previo de la Intervención delegada en el departamento."
  - id: d
    text:
      es: "el plan de disposición de fondos del Tesoro Público del ejercicio."
  explanation:
    es: "El artículo 73.4 exige acreditar ante el órgano competente la realización de la prestación o el derecho del acreedor «de conformidad con los acuerdos que en su día aprobaron y comprometieron el gasto». Las otras opciones remiten a instrucciones del Ordenador general de pagos, a un informe de la Intervención delegada y al plan de disposición de fondos; el artículo 73.4 no remite a ninguno de ellos, sino a los acuerdos de aprobación y compromiso."
  citation: "art. 73.4 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-162
- id: m05-l03-q282
  prompt:
    es: "Según el artículo 162 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué forma de control consiste en la verificación, realizada con posterioridad y de forma sistemática, de la actividad económico-financiera del sector público estatal?"
  options:
  - id: a
    text:
      es: "El control financiero permanente."
  - id: b
    text:
      es: "La función interventora."
  - id: c
    text:
      es: "La intervención material del pago."
  - id: d
    correct: true
    text:
      es: "La auditoría pública."
  explanation:
    es: "El artículo 162 define la auditoría pública como «la verificación, realizada con posterioridad y efectuada de forma sistemática, de la actividad económico-financiera del sector público estatal». El control financiero permanente verifica «de una forma continua» (art. 157). La función interventora controla los actos antes de que sean aprobados (art. 148), y la intervención material del pago es una de sus modalidades (art. 150.2)."
  citation: "art. 162 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q283
  prompt:
    es: "Una intervención delegada en una entidad gestora de la Seguridad Social formula un reparo, la Intervención General de la Seguridad Social lo confirma y la discrepancia subsiste. ¿A quién corresponde resolverla?"
  options:
  - id: a
    text:
      es: "Al Consejo de Ministros, con carácter definitivo."
  - id: b
    correct: true
    text:
      es: "A la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "Al Ministro de Inclusión, Seguridad Social y Migraciones."
  - id: d
    text:
      es: "Al director de la entidad gestora afectada."
  explanation:
    es: "El artículo 155.a) dice que, cuando la Intervención General de la Seguridad Social haya confirmado el reparo de una intervención delegada y subsista la discrepancia, «corresponderá a la Intervención General de la Administración del Estado resolver la misma». El Consejo de Ministros adopta resolución definitiva cuando el reparo es de la Intervención General de la Administración del Estado o esta ha confirmado el de otra Intervención General o delegada (art. 155.b), y en este caso aún no se ha pronunciado. El director de la entidad gestora es quien plantea la discrepancia, no quien la resuelve, y el artículo no da papel alguno al Ministro."
  citation: "art. 155.a) LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-152
- id: m05-l03-q284
  prompt:
    es: "Entre los extremos que enumera el artículo 152.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria para la fiscalización previa de requisitos básicos figura la competencia de:"
  options:
  - id: a
    text:
      es: "la oficina de contabilidad que registra el documento contable."
  - id: b
    text:
      es: "el Ordenador general de pagos que expide la orden de pago."
  - id: c
    correct: true
    text:
      es: "el órgano al que se proponen para su aprobación los gastos u obligaciones."
  - id: d
    text:
      es: "la intervención delegada que fiscaliza el expediente de gasto."
  explanation:
    es: "La letra b) del artículo 152.1 incluye comprobar «que los gastos u obligaciones se proponen a órgano competente», y la letra c) añade la del órgano de contratación, el concedente de la subvención y, en general, el que dicte el acto cuando no pueda aprobar el gasto. Ninguna de las letras a) a f) se refiere a la competencia de la oficina de contabilidad, del Ordenador general de pagos o de la intervención delegada; la letra g) solo permite al Consejo de Ministros añadir otros extremos, sin enumerarlos."
  citation: "art. 152.1 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "competencia"
# anchor: boe-a-1996-2627-regla-5
- id: m05-l03-q285
  prompt:
    es: "Aprobada una modificación de créditos por el órgano que tenga atribuida la competencia, ¿qué órgano expide y autoriza el documento MC, según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    text:
      es: "La oficina de contabilidad del departamento."
  - id: d
    text:
      es: "El Servicio gestor del crédito."
  explanation:
    es: "La regla 5 manda comunicar la modificación aprobada a la Dirección General de Presupuestos «para que actualice sus bases de datos y expida y autorice los documentos MC». La oficina de contabilidad del departamento afectado es la destinataria del MC, no quien lo expide. La regla no da ese papel a la Intervención General de la Administración del Estado ni al Servicio gestor."
  citation: "regla 5 IOC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1996-2627-regla-21
- id: m05-l03-q286
  prompt:
    es: "De acuerdo con la regla 21.2 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, el Servicio gestor formula el documento A, de autorización de gastos de ejercicio corriente:"
  options:
  - id: a
    correct: true
    text:
      es: "una vez aprobado el expediente de gasto."
  - id: b
    text:
      es: "al iniciarse el expediente de gasto."
  - id: c
    text:
      es: "al concertarse el gasto con un tercero."
  - id: d
    text:
      es: "al acreditarse la prestación realizada."
  explanation:
    es: "La regla 21.2 dice que las actuaciones para autorizar un gasto quedan reflejadas en un expediente de gasto y, «aprobado éste», el Servicio gestor formula el documento A. Al inicio del expediente se expide el RC (regla 14.1). El concierto con un tercero es el compromiso, que se documenta con un D (regla 22). La acreditación de la prestación precede al reconocimiento de la obligación, que se documenta con un OK (regla 23)."
  citation: "regla 21.2 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-22
- id: m05-l03-q287
  prompt:
    es: "¿Cuál de los siguientes documentos formula el Servicio gestor una vez comprometido un gasto previamente autorizado, según la regla 22.2 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Un documento A de ejercicio corriente y, en su caso, otro A de ejercicios posteriores."
  - id: b
    text:
      es: "Un documento OK por el importe comprometido con cargo al Presupuesto en curso."
  - id: c
    text:
      es: "Un documento RC de ejercicios posteriores con el importe de cada anualidad."
  - id: d
    correct: true
    text:
      es: "Un documento D de ejercicio corriente y, en su caso, otro D de ejercicios posteriores."
  explanation:
    es: "La regla 22.2 dice que, comprometido el gasto, el Servicio gestor formula «un documento D, de compromiso de gastos de ejercicio corriente» y, en su caso, un D de ejercicios posteriores. Los documentos A se formulan antes, aprobado el expediente de gasto (regla 21.2). El OK corresponde al reconocimiento de la obligación (regla 23.3). El RC de ejercicios posteriores se expide al inicio del expediente (regla 19.1)."
  citation: "regla 22.2 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-23
- id: m05-l03-q288
  prompt:
    es: "Según la regla 23.3 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, salvo en el supuesto excepcional de la regla 23.4, todo reconocimiento de la obligación lleva implícita:"
  options:
  - id: a
    text:
      es: "la orden de pago expedida por el Ordenador general de Pagos."
  - id: b
    text:
      es: "la intervención material del pago por la Intervención delegada."
  - id: c
    correct: true
    text:
      es: "la propuesta de pago dirigida al Ordenador general de Pagos."
  - id: d
    text:
      es: "la retención del crédito necesario en el ejercicio siguiente."
  explanation:
    es: "La regla 23.3 dice que «todo reconocimiento de la obligación llevará implícita la correspondiente propuesta de pago», es decir, la solicitud para que el Ordenador general de Pagos proceda a ordenar el pago; por eso se expide un documento OK. La orden de pago la expide después el Ordenador, en la fase de ordenación del pago. La intervención material del pago recae sobre el pago, no sobre el reconocimiento. La retención de crédito se pide al inicio del expediente de gasto (regla 14.1)."
  citation: "regla 23.3 IOC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-23
- id: m05-l03-q289
  prompt:
    es: "En las operaciones específicas de la Deuda Pública en que se expide un documento O, de reconocimiento de la obligación sin propuesta de pago implícita, ¿con qué documento se propone después el pago?"
  options:
  - id: a
    text:
      es: "Con un documento OK complementario."
  - id: b
    correct: true
    text:
      es: "Con un documento K, de propuesta de pago."
  - id: c
    text:
      es: "Con un documento ADOK por el mismo importe."
  - id: d
    text:
      es: "Con un documento D de ejercicios posteriores."
  explanation:
    es: "La regla 23.4 dice que en estos supuestos la propuesta de pago la expide el Servicio gestor con posterioridad al reconocimiento, «debiendo formularse al efecto el oportuno documento K, de propuesta de pago». Un OK o un ADOK volverían a reconocer la obligación, ya reconocida con el O. El D de ejercicios posteriores documenta un compromiso de gasto, no una propuesta de pago."
  citation: "regla 23.4 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-1982-11584-art-21
- id: m05-l03-q290
  prompt:
    es: "De acuerdo con el artículo 21.Uno de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, el Tribunal en Pleno está integrado por:"
  options:
  - id: a
    correct: true
    text:
      es: "doce Consejeros de Cuentas, uno de los cuales es el Presidente, y el Fiscal."
  - id: b
    text:
      es: "doce Consejeros de Cuentas, además del Presidente, y el Fiscal."
  - id: c
    text:
      es: "nueve Consejeros de Cuentas, uno de los cuales es el Presidente, y el Fiscal."
  - id: d
    text:
      es: "doce Consejeros de Cuentas, uno de los cuales es el Presidente, y el Secretario General."
  explanation:
    es: "El artículo 21.Uno dice que el Pleno «estará integrado por doce Consejeros de Cuentas, uno de los cuales será el Presidente, y el Fiscal». La opción que suma el Presidente a los doce da trece miembros más el Fiscal. Nueve no es el número de Consejeros, sino los años de su mandato (art. 30.Uno). La que pone al Secretario General en lugar del Fiscal cambia un miembro que el artículo nombra."
  citation: "art. 21.Uno LO 2/1982"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1982-11584-art-21
- id: m05-l03-q291
  prompt:
    es: "El cuórum para la válida constitución del Pleno del Tribunal de Cuentas, cuyos acuerdos se adoptan por mayoría de asistentes, es el de:"
  options:
  - id: a
    text:
      es: "tres quintos de sus componentes."
  - id: b
    text:
      es: "la mitad de sus componentes."
  - id: c
    correct: true
    text:
      es: "dos tercios de sus componentes."
  - id: d
    text:
      es: "tres cuartos de sus componentes."
  explanation:
    es: "El artículo veintiuno.Dos de la LO 2/1982 dice: «El cuórum para la válida constitución del Pleno será el de dos tercios de sus componentes y sus acuerdos serán adoptados por mayoría de asistentes». Tres quintos es la mayoría con la que cada Cámara elige a los Consejeros de Cuentas, según el artículo treinta.Uno, no el cuórum del Pleno. La mitad y los tres cuartos no son la fracción del apartado, que es dos tercios."
  citation: "art. 21.Dos LO 2/1982"
  difficulty: 1
  tags:
  - "mayoría"
  - "composición"
# anchor: boe-a-1982-11584-art-29
- id: m05-l03-q292
  prompt:
    es: "Según el artículo 29 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, ¿cómo se nombra al Presidente del Tribunal de Cuentas?"
  options:
  - id: a
    text:
      es: "Por el Rey, de entre sus miembros, a propuesta del Gobierno y por tres años."
  - id: b
    text:
      es: "Por el Rey, de entre sus miembros, a propuesta del Tribunal en Pleno y por nueve años."
  - id: c
    text:
      es: "Por las Cortes Generales, de entre sus miembros, por mayoría de tres quintos y por tres años."
  - id: d
    correct: true
    text:
      es: "Por el Rey, de entre sus miembros, a propuesta del Tribunal en Pleno y por tres años."
  explanation:
    es: "El artículo 29 dice que el Presidente «será nombrado de entre sus miembros por el Rey, a propuesta del mismo Tribunal en Pleno y por un período de tres años». La propuesta no es del Gobierno. Nueve años es el mandato de los Consejeros (art. 30.Uno), no el del Presidente. Las Cortes Generales, por mayoría de tres quintos, designan a los Consejeros, no nombran al Presidente."
  citation: "art. 29 LO 2/1982"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1982-11584-art-30
- id: m05-l03-q293
  prompt:
    es: "¿Cuál de las siguientes describe la designación de los Consejeros de Cuentas según el artículo 30.Uno de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas?"
  options:
  - id: a
    text:
      es: "Seis por el Congreso y seis por el Senado, por mayoría de dos tercios de cada Cámara."
  - id: b
    correct: true
    text:
      es: "Seis por el Congreso y seis por el Senado, por mayoría de tres quintos de cada Cámara."
  - id: c
    text:
      es: "Ocho por el Congreso y cuatro por el Senado, por mayoría de tres quintos de cada Cámara."
  - id: d
    text:
      es: "Seis por el Congreso y seis por el Senado, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 30.Uno dice que los Consejeros de Cuentas son designados por las Cortes Generales, «seis por el Congreso de los Diputados y seis por el Senado, mediante votación por mayoría de tres quintos de cada una de las Cámaras». Los dos tercios son el cuórum del Pleno del Tribunal (art. 21.Dos), no la mayoría de designación. El reparto de ocho y cuatro no existe: el artículo da seis a cada Cámara. La mayoría absoluta no es la que exige el artículo."
  citation: "art. 30.Uno LO 2/1982"
  difficulty: 2
  tags:
  - "composición"
  - "mayoría"
# anchor: boe-a-1996-1578-art-13
- id: m05-l03-q310
  prompt:
    es: "De acuerdo con el artículo 13.2 del Real Decreto 2188/1995, de 28 de diciembre, el plazo de fiscalización del expediente se reduce a cinco días cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Se haya declarado urgente la tramitación del expediente o se aplique el régimen especial de fiscalización previa."
  - id: b
    text:
      es: "Se haya declarado urgente la tramitación del expediente o el gasto deba aprobarlo el Consejo de Ministros."
  - id: c
    text:
      es: "El expediente se tramite de forma anticipada o el gasto se extienda a ejercicios posteriores al corriente."
  - id: d
    text:
      es: "Lo solicite el órgano gestor por razones de interés público o el expediente llegue completo en soporte electrónico."
  explanation:
    es: "La Intervención fiscaliza el expediente en el plazo máximo de 10 días, que «se reducirá a cinco días computados de igual forma cuando se haya declarado urgente la tramitación del expediente o se aplique el régimen especial de fiscalización e intervención previa regulado en los artículos 19 y siguientes» (art. 13.2). La aprobación por el Consejo de Ministros no reduce el plazo: esos gastos quedan, al contrario, en el régimen general de fiscalización previa (art. 152.2 LGP). La tramitación anticipada, el carácter plurianual del gasto, la petición del órgano gestor y el soporte electrónico no figuran entre los dos supuestos que reducen el plazo."
  citation: "art. 13.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1996-1578-art-13
- id: m05-l03-q311
  prompt:
    es: "La Intervención recibe el jueves 4 de marzo de 2027 un expediente cuya tramitación se ha declarado urgente. Según el artículo 13.2 del Real Decreto 2188/1995, de 28 de diciembre, y contando días hábiles, ¿qué día vence el plazo máximo para fiscalizarlo?"
  options:
  - id: a
    text:
      es: "El martes 9 de marzo de 2027."
  - id: b
    text:
      es: "El miércoles 10 de marzo de 2027."
  - id: c
    text:
      es: "El jueves 18 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El jueves 11 de marzo de 2027."
  explanation:
    es: "Con la tramitación declarada urgente, el plazo de 10 días «se reducirá a cinco días computados de igual forma», es decir, contados también «desde el siguiente a la fecha de recepción» (art. 13.2). El cómputo empieza el viernes 5 de marzo de 2027; excluidos el sábado 6 y el domingo 7, siguen el lunes 8, el martes 9, el miércoles 10 y el jueves 11, quinto día hábil. El martes 9 sale de contar cinco días naturales, con el fin de semana. El miércoles 10 sale de contar desde el mismo día de recepción. El jueves 18 es el décimo día hábil, el plazo ordinario que la urgencia reduce."
  citation: "art. 13.2 RD 2188/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l03-q312
  prompt:
    es: "Según la Orden de 1 de febrero de 1996, por la que se aprueba la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, ¿qué documentos expide, por orden, el servicio gestor en un contrato formalizado?"
  options:
  - id: a
    text:
      es: "RC al iniciar el expediente, D una vez aprobado el expediente de gasto y A al formalizar el contrato."
  - id: b
    correct: true
    text:
      es: "RC al iniciar el expediente, A una vez aprobado el expediente de gasto y D al formalizar el contrato."
  - id: c
    text:
      es: "A al iniciar el expediente, RC una vez aprobado el expediente de gasto y D al formalizar el contrato."
  - id: d
    text:
      es: "RC al iniciar el expediente, A al formalizar el contrato y D al reconocer la obligación."
  explanation:
    es: "La regla 77 pide un RC «al inicio de un expediente de contratación», un A «una vez que se apruebe el expediente de gasto» y un D «cuando se formalicen los contratos». Las demás opciones permutan los documentos o sitúan el D en el reconocimiento de la obligación, que es el momento del OK."
  citation: "regla 77.1–2 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-1996-2627-regla-86
- id: m05-l03-q313
  prompt:
    es: "Según la Orden de 1 de febrero de 1996, por la que se aprueba la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, en una subvención con convocatoria previa periódica, el servicio gestor expide:"
  options:
  - id: a
    text:
      es: "un documento RC al publicar la convocatoria y un documento OK al aprobarse la concesión."
  - id: b
    text:
      es: "un documento AD al aprobarse la concesión, sin documento alguno antes de la convocatoria."
  - id: c
    text:
      es: "un documento MC antes de publicar la convocatoria y un D al reconocerse la obligación."
  - id: d
    correct: true
    text:
      es: "un documento A, aprobado el expediente de gasto y antes de publicar la convocatoria, y un D al aprobarse la concesión."
  explanation:
    es: "La regla 86.3 dispone el documento A «una vez aprobado el expediente de gasto, aprobación que será previa a la publicación de la convocatoria», y el D «cuando se apruebe la concesión». El OK llega cuando se cumplen las condiciones de la concesión (regla 86.4), el AD no figura en este procedimiento y el MC es el documento de las modificaciones de crédito."
  citation: "regla 86.3 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1996-2627-regla-4
- id: m05-l03-q314
  prompt:
    es: "Según la regla 4.2 de la Orden de 1 de febrero de 1996, por la que se aprueba la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, para registrar la carga del presupuesto prorrogado:"
  options:
  - id: a
    text:
      es: "el servicio gestor expide un documento OK por cada crédito prorrogado."
  - id: b
    text:
      es: "se expide un documento AD por el total de los créditos iniciales."
  - id: c
    correct: true
    text:
      es: "no es necesaria la expedición de ningún documento contable específico."
  - id: d
    text:
      es: "se expide un documento D por los gastos de los servicios que terminen en ese ejercicio."
  explanation:
    es: "La regla 4.2 dice que, para registrar la carga del presupuesto prorrogado, «no será necesaria la expedición de ningún documento contable específico». Los documentos OK, AD y D corresponden a fases del gasto (reconocimiento, autorización con compromiso y compromiso), no a la carga de la prórroga."
  citation: "regla 4.2 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
