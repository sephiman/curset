  prompt:
    es: "Según el artículo 72.5 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en las Comunidades Autónomas uniprovinciales en las que no exista Subdelegado, la suplencia del Delegado corresponde:"
