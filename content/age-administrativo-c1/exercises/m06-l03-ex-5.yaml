# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q152
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes definiciones corresponde a la sintaxis de consulta avanzada (AQS) de Windows Search?"
  options:
  - id: a
    text:
      es: "El formato de las rutas que acceden a recursos de red con un servidor precedido de \\\\"
  - id: b
    correct: true
    text:
      es: "La sintaxis de consulta predeterminada de Windows Search para consultar el índice y restringir búsquedas"
  - id: c
    text:
      es: "El conjunto de directivas que configura el comportamiento del Explorador de archivos"
  - id: d
    text:
      es: "El modo de indexación que incluye en el índice todas las carpetas y archivos del equipo"
  explanation:
    es: "La página dice que AQS es la sintaxis de consulta predeterminada usada por Windows Search para consultar el índice y refinar y restringir los parámetros de búsqueda. Las rutas con el servidor precedido de \\\\ son las rutas UNC. Las directivas del Explorador de archivos son las del CSP ADMX_WindowsExplorer. El modo que indexa todo el equipo es el Mejorado."
  citation: "fuente: `ms-win-aqs.html`; «Uso de la sintaxis de consulta avanzada mediante programación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q153
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search en Windows 11, ¿cuál de los siguientes elementos debe escribirse en mayúsculas?"
  options:
  - id: a
    text:
      es: "Los nombres canónicos, como System.Size"
  - id: b
    correct: true
    text:
      es: "Los operadores AND, OR y NOT"
  - id: c
    text:
      es: "Las frases escritas entre comillas"
  - id: d
    text:
      es: "Las palabras clave, como author"
  explanation:
    es: "La página dice que AQS no distingue mayúsculas de minúsculas, con la excepción de AND, OR y NOT, que deben estar en mayúsculas. Añade que los nombres canónicos, como System.Photo.LightSource, no distinguen mayúsculas y minúsculas. Las frases entre comillas y las palabras clave de propiedad quedan bajo la regla general."
  citation: "fuente: `ms-win-aqs.html`; «Acerca de la sintaxis de consulta avanzada»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q154
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, que enlaza AND y OR de izquierda a derecha, ¿cómo se interpreta la consulta informe AND acta OR memoria?"
  options:
  - id: a
    text:
      es: "informe AND (acta OR memoria)"
  - id: b
    text:
      es: "(informe OR memoria) AND acta"
  - id: c
    correct: true
    text:
      es: "(informe AND acta) OR memoria"
  - id: d
    text:
      es: "informe OR (acta AND memoria)"
  explanation:
    es: "La página dice que, si una consulta tiene dos o más usos de AND u OR, se enlazan de izquierda a derecha, sea AND u OR: «manzana AND pera OR ciruela» se interpreta como «(manzana Y pera) OR ciruela». Con las mismas palabras de esta consulta, primero se une informe AND acta y después OR memoria. Las otras tres agrupan de otra forma, como haría una prioridad de operadores que AQS no aplica."
  citation: "fuente: `ms-win-aqs.html`; «Acerca de la sintaxis de consulta avanzada»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "resultado-fórmula"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q155
  prompt:
    es: "En Windows Search, un documento contiene la palabra memoria, pero no las palabras informe ni acta. ¿Cuál de las siguientes consultas de sintaxis de consulta avanzada (AQS) lo devuelve?"
  options:
  - id: a
    correct: true
    text:
      es: "informe AND acta OR memoria"
  - id: b
    text:
      es: "informe OR acta AND memoria"
  - id: c
    text:
      es: "informe acta memoria"
  - id: d
    text:
      es: "acta AND NOT memoria"
  explanation:
    es: "AQS enlaza AND y OR de izquierda a derecha. «informe AND acta OR memoria» equivale a «(informe AND acta) OR memoria» y devuelve el documento porque contiene memoria. «informe OR acta AND memoria» equivale a «(informe OR acta) AND memoria» y no lo devuelve, como en el ejemplo de la página con ciruela. Dos consultas seguidas sin operador equivalen a AND, así que «informe acta memoria» exige las tres palabras. «acta AND NOT memoria» exige acta y excluye memoria."
  citation: "fuente: `ms-win-aqs.html`; «Acerca de la sintaxis de consulta avanzada»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q156
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, ¿a qué equivale escribir dos consultas seguidas sin ningún operador, como informe acta?"
  options:
  - id: a
    text:
      es: "A informe OR acta"
  - id: b
    text:
      es: "A informe NOT acta"
  - id: c
    text:
      es: "A la frase exacta \"informe acta\""
  - id: d
    correct: true
    text:
      es: "A informe AND acta"
  explanation:
    es: "La gramática de la página da «<query> <query>» como «Same as <query> AND <query>»: dos consultas seguidas equivalen a unirlas con AND. OR y NOT son los otros dos operadores de la sintaxis. Una frase exacta se busca escribiéndola entre comillas."
  citation: "fuente: `ms-win-aqs.html`; «Acerca de la sintaxis de consulta avanzada»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q157
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, si una consulta básica indica solo el valor buscado y no especifica ninguna propiedad, Windows Search:"
  options:
  - id: a
    correct: true
    text:
      es: "Busca el valor en todas las propiedades"
  - id: b
    text:
      es: "Busca el valor solo en el nombre de archivo"
  - id: c
    text:
      es: "Busca el valor solo en el contenido con texto"
  - id: d
    text:
      es: "No devuelve resultados hasta indicar una propiedad"
  explanation:
    es: "La página dice que la única parte necesaria de una consulta básica es la restricción o valor de búsqueda, y que si no se especifica una propiedad, Windows Search busca en todas las propiedades. Por eso no se limita al nombre ni al contenido, y la consulta sin propiedad es válida."
  citation: "fuente: `ms-win-aqs.html`; «Acerca de la sintaxis de consulta avanzada»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q158
  prompt:
    es: "En un Windows 11 en español, ¿qué ocurre con una palabra clave de propiedad de la sintaxis de consulta avanzada (AQS) escrita en inglés, como author?"
  options:
  - id: a
    text:
      es: "Se reconoce siempre, sea cual sea el idioma del sistema operativo"
  - id: b
    text:
      es: "Se reconoce solo si se escribe en mayúsculas"
  - id: c
    correct: true
    text:
      es: "No se reconoce: solo funcionan las del idioma del sistema"
  - id: d
    text:
      es: "Se traduce al español antes de consultar el índice"
  explanation:
    es: "La página dice que en Windows 7 y versiones posteriores Windows Search solo reconoce palabras clave en el idioma predeterminado actual «y no en inglés», salvo que el inglés sea el predeterminado. Reconocerlas siempre, sea cual sea el idioma, contradice esa frase. Que baste con escribirla en mayúsculas no aparece en la página: sobre mayúsculas dice que AQS no distingue entre ellas, salvo en AND, OR y NOT. Y traducirla al español antes de consultar el índice contradice que solo se reconozcan las del idioma del sistema."
  citation: "fuente: `ms-win-aqs.html`; «Uso de palabras clave en idiomas locales»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q159
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, ¿qué indican los puntos dobles entre dos valores, como en System.Size:5kb..10kb?"
  options:
  - id: a
    text:
      es: "Un intervalo de valores, con los dos extremos excluidos"
  - id: b
    correct: true
    text:
      es: "Un intervalo de valores, con los dos extremos incluidos"
  - id: c
    text:
      es: "Dos valores alternativos, como si se uniesen con OR"
  - id: d
    text:
      es: "Una propiedad sin valor, como los corchetes vacíos"
  explanation:
    es: "La página dice que los puntos dobles indican un intervalo de valores; su ejemplo de fechas busca entre las dos fechas, «ambos incluidos». Excluir los extremos contradice ese ejemplo. Dos valores alternativos se escriben con OR. La ausencia de valor se escribe con corchetes vacíos, []."
  citation: "fuente: `ms-win-aqs.html`; «Valores de consulta»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q160
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, ¿cuál de los siguientes elementos busca la consulta System.Keywords:=[]?"
  options:
  - id: a
    text:
      es: "Los elementos con cualquier etiqueta"
  - id: b
    text:
      es: "Los elementos con etiquetas entre corchetes"
  - id: c
    text:
      es: "Los elementos sin nombre de archivo"
  - id: d
    correct: true
    text:
      es: "Los elementos que no se han etiquetado"
  explanation:
    es: "La página dice que los corchetes vacíos indican que no hay ningún valor y que el ejemplo System.Keywords:=[] busca todos los elementos que no se han etiquetado. No busca etiquetas, ni etiquetas escritas entre corchetes, y la propiedad consultada es Keywords, no el nombre de archivo."
  citation: "fuente: `ms-win-aqs.html`; «Valores de consulta»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q161
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, con el operador ~ de comodines al estilo de DOS, ¿qué representa el asterisco (*)?"
  options:
  - id: a
    text:
      es: "Un único carácter arbitrario"
  - id: b
    text:
      es: "Uno o más caracteres arbitrarios seguidos"
  - id: c
    text:
      es: "Un único dígito del 0 al 9"
  - id: d
    correct: true
    text:
      es: "Cero o más caracteres arbitrarios"
  explanation:
    es: "La página dice que, con el operador de comodines al estilo de DOS, «* representa cero o más caracteres arbitrarios». Un único carácter arbitrario es el otro comodín, el signo ?. «Uno o más» contradice «cero o más»: deja fuera la coincidencia con cero caracteres. Y un único dígito del 0 al 9 no es el significado de ninguno de los comodines de la página: el asterisco no distingue dígitos de otros caracteres."
  citation: "fuente: `ms-win-aqs.html`; «Operadores de consulta»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q162
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, ¿cuál de los siguientes elementos busca la consulta System.Kind:<>imagen?"
  options:
  - id: a
    text:
      es: "Los elementos cuyo tipo es una imagen"
  - id: b
    correct: true
    text:
      es: "Los elementos cuyo tipo no es una imagen"
  - id: c
    text:
      es: "Las imágenes que no tienen fecha de captura"
  - id: d
    text:
      es: "Los elementos cuyo nombre empieza por imagen"
  explanation:
    es: "La página da <> como símbolo de COP_NOTEQUAL y dice de System.Kind:<>imagen que la propiedad System.Kind no es una imagen. Lo contrario, el tipo imagen, sería System.Kind:imagen. Las fechas de captura se consultan con System.Photo.DateTaken, y la propiedad consultada aquí es el tipo, no el nombre."
  citation: "fuente: `ms-win-aqs.html`; «Operadores de consulta»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
