# anchor: boe-a-2001-21090-art-1
- id: m02-l01-q053
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, pueden ejercer el derecho de petición:"
  options:
  - id: a
    text:
      es: "Solo los españoles mayores de edad y las personas jurídicas españolas, de forma individual o colectiva."
  - id: b
    text:
      es: "Toda persona natural, prescindiendo de su nacionalidad, solo de forma individual."
  - id: c
    text:
      es: "Toda persona natural o jurídica de nacionalidad española o residente legal en España."
  - id: d
    correct: true
    text:
      es: "Toda persona natural o jurídica, prescindiendo de su nacionalidad, individual o colectivamente."
  explanation:
    es: "El artículo 1.1 reconoce el derecho a «toda persona natural o jurídica, prescindiendo de su nacionalidad», que puede ejercerlo «individual o colectivamente». No se limita a los españoles mayores de edad ni a los residentes legales, incluye a las personas jurídicas y admite el ejercicio colectivo."
  citation: "art. 1.1 LO 4/2001"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-4
- id: m02-l01-q054
  prompt:
    es: "¿Cuál de los siguientes datos debe incluir necesariamente el escrito de petición según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición?"
  options:
  - id: a
    correct: true
    text:
      es: "La nacionalidad del solicitante, si la tuviere."
  - id: b
    text:
      es: "La firma de un abogado colegiado en ejercicio."
  - id: c
    text:
      es: "La fundamentación jurídica de lo que se pide."
  - id: d
    text:
      es: "El número de identificación fiscal del destinatario."
  explanation:
    es: "El artículo 4.1 dice que las peticiones «incluirán necesariamente la identidad del solicitante, la nacionalidad si la tuviere, el lugar o el medio elegido para la práctica de notificaciones, el objeto y el destinatario». No exige firma de abogado ni fundamentación jurídica. Del destinatario basta con identificarlo; no se pide su número de identificación fiscal."
  citation: "art. 4.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-6
- id: m02-l01-q055
  prompt:
    es: "Según el artículo 6.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, ¿en qué plazo debe quien recibe una petición acusar recibo y comunicarlo al interesado?"
  options:
  - id: a
    text:
      es: "Dentro de los quince días siguientes a su recepción."
  - id: b
    text:
      es: "Dentro de los cuarenta y cinco días hábiles siguientes."
  - id: c
    correct: true
    text:
      es: "Dentro de los diez días siguientes a su recepción."
  - id: d
    text:
      es: "Dentro de los tres meses siguientes a su presentación."
  explanation:
    es: "El artículo 6.2 obliga a quien recibe la petición a acusar recibo y comunicarlo al interesado «dentro de los diez días siguientes a su recepción». Quince días es el plazo de subsanación (art. 7.2). Cuarenta y cinco días hábiles es el plazo para declarar la inadmisibilidad (art. 9.1). Tres meses es el plazo para contestar una petición admitida (art. 11.1)."
  citation: "art. 6.2 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2001-21090-art-7
- id: m02-l01-q056
  prompt:
    es: "Según el artículo 7.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si el escrito incumple los requisitos del artículo 4, se requerirá al peticionario para que subsane los defectos:"
  options:
  - id: a
    text:
      es: "En diez días, con el apercibimiento de que, si no lo hiciera, se le tendrá por desistido."
  - id: b
    correct: true
    text:
      es: "En quince días, con el apercibimiento de que, si no lo hiciera, se le tendrá por desistido."
  - id: c
    text:
      es: "En quince días, con el apercibimiento de que, si no lo hiciera, se inadmitirá su petición."
  - id: d
    text:
      es: "En diez días, con el apercibimiento de que, si no lo hiciera, se resolverá con lo aportado."
  explanation:
    es: "El artículo 7.2 fija «el plazo de quince días con el apercibimiento de que, si así no lo hiciera, se le tendrá por desistido de su petición». Diez días es el plazo del acuse de recibo (art. 6.2), no el de subsanación. La consecuencia es el desistimiento y el archivo, no la inadmisión ni una resolución con lo aportado."
  citation: "art. 7.2 LO 4/2001"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2001-21090-art-8
- id: m02-l01-q057
  prompt:
    es: "¿En cuál de los siguientes casos se inadmitirá una petición según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición?"
  options:
  - id: a
    text:
      es: "Cuando afecte exclusivamente al peticionario y carezca de interés colectivo o general."
  - id: b
    correct: true
    text:
      es: "Cuando sobre su objeto exista un proceso judicial ya iniciado sin resolución firme."
  - id: c
    text:
      es: "Cuando la formulen varias personas de forma colectiva, sin un representante común."
  - id: d
    text:
      es: "Cuando la presente una persona de nacionalidad extranjera no residente en España."
  explanation:
    es: "El artículo 8 no admite las peticiones sobre cuyo objeto exista un procedimiento parlamentario, administrativo o «un proceso judicial ya iniciado, en tanto sobre los mismos no haya recaído acuerdo o resolución firme». El artículo 3 permite peticiones que afecten solo al peticionario. El artículo 1.1 admite el ejercicio colectivo y no exige nacionalidad ni residencia."
  citation: "art. 8 LO 4/2001"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2001-21090-art-9
- id: m02-l01-q058
  prompt:
    es: "Una petición dirigida a un Ministerio se presenta el martes 12 de enero de 2027. Si en ese periodo no hay festivos, ¿hasta qué día, según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, puede acordarse y notificarse su inadmisión?"
  options:
  - id: a
    text:
      es: "Hasta el lunes 15 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el viernes 26 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 16 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el lunes 12 de abril de 2027."
  explanation:
    es: "El artículo 9.1 exige acordar y notificar la inadmisibilidad «en los cuarenta y cinco días hábiles siguientes al de presentación». El cómputo empieza el miércoles 13 de enero de 2027 y excluye sábados y domingos (art. 30.2 LPAC); el enunciado descarta los festivos. El cuadragésimo quinto día hábil es el martes 16 de marzo de 2027. El lunes 15 de marzo sale de contar como primero el propio día de la presentación. El viernes 26 de febrero sale de contar 45 días naturales. El lunes 12 de abril corresponde a tres meses, el plazo para contestar una petición ya admitida (art. 11.1)."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2001-21090-art-9
- id: m02-l01-q059
  prompt:
    es: "Señale la respuesta correcta según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición:"
  options:
  - id: a
    correct: true
    text:
      es: "La declaración de inadmisibilidad de una petición será siempre motivada."
  - id: b
    text:
      es: "La declaración de inadmisibilidad podrá ser verbal cuando la petición sea colectiva."
  - id: c
    text:
      es: "La petición inadmitida por falta de competencia se archivará sin más trámite."
  - id: d
    text:
      es: "La contestación de una petición admitida podrá demorarse hasta seis meses."
  explanation:
    es: "El artículo 9.1 dice que la declaración de inadmisibilidad «será siempre motivada». El artículo 9.1 no prevé una declaración verbal para las peticiones colectivas. La inadmitida por falta de competencia se remite al órgano competente en diez días (art. 10.1), no se archiva. Una petición admitida se contesta en un plazo máximo de tres meses (art. 11.1), no de seis."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-9
- id: m02-l01-q060
  prompt:
    es: "Según el artículo 9.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si transcurre el plazo para acordar y notificar la inadmisibilidad sin que se haya notificado, la petición:"
  options:
  - id: a
    text:
      es: "Se entenderá estimada por silencio."
  - id: b
    text:
      es: "Se entenderá desestimada por silencio."
  - id: c
    text:
      es: "Se entenderá caducada y se archivará."
  - id: d
    correct: true
    text:
      es: "Se entenderá admitida a trámite."
  explanation:
    es: "El artículo 9.2 dice que, si no se declara la inadmisibilidad en el plazo del apartado 1, «se entenderá que la petición ha sido admitida a trámite». La admisión obliga a contestar en tres meses (art. 11.1), pero no equivale a estimarla. Tampoco se entiende desestimada ni caducada."
  citation: "art. 9.2 LO 4/2001"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2001-21090-art-9
- id: m02-l01-q061
  prompt:
    es: "Según el artículo 9.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, cuando la inadmisión se deba a que existen otros procedimientos específicos para satisfacer el objeto de la petición, la declaración:"
  options:
  - id: a
    correct: true
    text:
      es: "Indicará expresamente las disposiciones a cuyo amparo deba sustanciarse y el órgano competente para ella."
  - id: b
    text:
      es: "Remitirá de oficio la petición al órgano competente para tramitar ese procedimiento específico, sin otra indicación."
  - id: c
    text:
      es: "Podrá dictarse sin motivación alguna, porque basta con la mera referencia a la existencia de ese procedimiento."
  - id: d
    text:
      es: "Se notificará en el plazo de tres meses a contar desde la presentación de la petición."
  explanation:
    es: "El párrafo segundo del artículo 9.1 dice que, en ese caso, la declaración de inadmisión «deberá indicar expresamente las disposiciones a cuyo amparo deba sustanciarse, así como el órgano competente para ella». La remisión de oficio es la regla de la falta de competencia (art. 10.1). La declaración es «siempre motivada». Se notifica en cuarenta y cinco días hábiles, no en tres meses."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-10
- id: m02-l01-q062
  prompt:
    es: "Según el artículo 10.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si la inadmisibilidad se basa en la falta de competencia del destinatario, ¿qué debe hacer este?"
  options:
  - id: a
    text:
      es: "Devolverla al peticionario en diez días, indicándole cuál es el órgano competente."
  - id: b
    text:
      es: "Remitirla en quince días a quien estime competente, sin comunicarlo al peticionario."
  - id: c
    text:
      es: "Archivarla y comunicar al peticionario que puede presentarla de nuevo ante otro órgano."
  - id: d
    correct: true
    text:
      es: "Remitirla en diez días a quien estime competente y comunicarlo al peticionario."
  explanation:
    es: "El artículo 10.1 dice que el destinatario «la remitirá a la institución, administración u organismo que estime competente en el plazo de diez días y lo comunicará así al peticionario». No la devuelve ni la archiva: la remite él. El plazo es de diez días, no de quince, y la comunicación al peticionario es obligatoria."
  citation: "art. 10.1 LO 4/2001"
  difficulty: 3
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-2001-21090-art-11
- id: m02-l01-q063
  prompt:
    es: "Una petición presentada el miércoles 31 de marzo de 2027 ha sido admitida a trámite. Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, ¿hasta qué día hay para contestarla y notificar la contestación?"
  options:
  - id: a
    text:
      es: "Hasta el jueves 1 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles 30 de junio de 2027."
  - id: c
    text:
      es: "Hasta el martes 29 de junio de 2027."
  - id: d
    text:
      es: "Hasta el lunes 31 de mayo de 2027."
  explanation:
    es: "El artículo 11.1 da «el plazo máximo de tres meses a contar desde la fecha de su presentación». Los meses se cuentan de fecha a fecha y, si el mes de vencimiento no tiene el día equivalente, el plazo expira el último día del mes (art. 30.4 LPAC). Junio no tiene día 31, así que el plazo acaba el miércoles 30 de junio de 2027, día hábil. El jueves 1 de julio sale de pasar al mes siguiente, que la regla no permite. El martes 29 de junio sale de cerrar el plazo un día antes del último día del mes. El lunes 31 de mayo corresponde a dos meses, no a tres."
  citation: "art. 11.1 LO 4/2001"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2001-21090-art-11
- id: m02-l01-q064
  prompt:
    es: "Según el artículo 11.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, admitida a trámite una petición, la autoridad u órgano competente deberá contestar y notificar la contestación:"
  options:
  - id: a
    text:
      es: "En el plazo máximo de tres meses a contar desde la fecha de su admisión a trámite."
  - id: b
    text:
      es: "En el plazo máximo de cuarenta y cinco días hábiles desde la fecha de su presentación."
  - id: c
    correct: true
    text:
      es: "En el plazo máximo de tres meses a contar desde la fecha de su presentación."
  - id: d
    text:
      es: "En el plazo máximo de seis meses a contar desde la fecha de su presentación."
  explanation:
    es: "El artículo 11.1 LO 4/2001 dice que, admitida a trámite la petición, la autoridad u órgano competente deberá contestar y notificar «en el plazo máximo de tres meses a contar desde la fecha de su presentación». Contar desde la admisión cambia el día inicial: el apartado dice presentación. Cuarenta y cinco días hábiles desde la presentación es el plazo del artículo 9.1 para declarar la inadmisibilidad, no el de contestar. Seis meses duplica el plazo de tres meses del apartado."
  citation: "art. 11.1 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
