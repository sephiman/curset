# anchor: fuente-whatwg-html-introduccion-html
- id: m02-l12-q304
  prompt:
    es: "¿Cuál de las siguientes opciones recoge los principios básicos que adoptó el WHATWG al crearse, según la introducción del estándar HTML del WHATWG?"
  options:
  - id: a
    text:
      es: "Dar prioridad a las funciones nuevas aunque rompan las páginas existentes, dejando que cada navegador decida"
  - id: b
    text:
      es: "Sustituir HTML por un lenguaje basado en XML y XForms"
  - id: c
    correct: true
    text:
      es: "Compatibilidad hacia atrás y especificaciones detalladas que garanticen la interoperabilidad"
  - id: d
    text:
      es: "Reservar el copyright de la especificación a un solo fabricante"
  explanation:
    es: "El WHATWG se basó en la compatibilidad hacia atrás y en especificaciones lo bastante detalladas para lograr una interoperabilidad completa. «Dar prioridad a las funciones nuevas aunque rompan las páginas existentes, dejando que cada navegador decida» contradice el principio de que las tecnologías deben ser compatibles hacia atrás. «Reservar el copyright de la especificación a un solo fabricante»: el copyright pasó a ser de las tres empresas fundadoras y se amplió para permitir la reutilización. «Sustituir HTML por un lenguaje basado en XML y XForms»: el W3C había elegido esa vía, y el WHATWG nació para seguir evolucionando HTML."
  citation: "fuente: `whatwg-html-introduccion.html`; «The WHATWG was based on several core principles, in particular that technologies need to be backwards compatible, that specifications and implementations need to match even if this means changing the specification rather than the implementations, and that specifications need to be detailed enough that implementations can achieve complete interoperability without reverse-engineering each other.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q312
  prompt:
    es: "Según la Comunicación de la Comisión Europea de 2023, ¿cuál de las siguientes opciones recoge los fines para los que los mundos virtuales mezclan mundos físicos y digitales en tiempo real?"
  options:
  - id: a
    text:
      es: "Solo para el entretenimiento de los usuarios"
  - id: b
    text:
      es: "Solo para realizar transacciones comerciales"
  - id: c
    correct: true
    text:
      es: "Para diseñar, simular, colaborar, aprender, socializar, hacer transacciones o entretener"
  - id: d
    text:
      es: "Solo para la formación a distancia de los usuarios, sin otros fines posibles en el entorno digital"
  explanation:
    es: "La Comunicación cita fines como diseñar, simular, colaborar, aprender, socializar, hacer transacciones o proporcionar entretenimiento. «Solo para el entretenimiento de los usuarios»: la Comunicación habla de diversos fines, no solo del entretenimiento. «Solo para realizar transacciones comerciales»: las transacciones son uno de los fines, junto con otros. «Solo para la formación a distancia de los usuarios, sin otros fines posibles en el entorno digital»: aprender es uno de los fines, junto con otros."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m02-l12-q314
  prompt:
    es: "Según la Comisión Europea, ¿qué tipo de experiencias permite la web 4.0, en la que los objetos y entornos digitales y reales están plenamente integrados?"
  options:
  - id: a
    text:
      es: "Experiencias que sustituyen los mundos virtuales por redes sociales"
  - id: b
    text:
      es: "Experiencias limitadas a texto e imágenes en páginas enlazadas"
  - id: c
    correct: true
    text:
      es: "Experiencias intuitivas e inmersivas que combinan los mundos físico y digital"
  - id: d
    text:
      es: "Experiencias en las que el usuario solo controla el valor económico de sus datos"
  explanation:
    es: "La web 4.0 permite experiencias verdaderamente intuitivas e inmersivas en las que se combinan sin fisuras los mundos físico y digital. «Experiencias limitadas a texto e imágenes en páginas enlazadas» contradice la Comunicación: la web 4.0 integra mundos virtuales y capacidades de realidad aumentada. «Experiencias en las que el usuario solo controla el valor económico de sus datos» es un rasgo de la web 3.0, y no define la web 4.0. «Experiencias que sustituyen los mundos virtuales por redes sociales»: la web 4.0 usa mundos virtuales y realidad aumentada, no los sustituye."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «El uso de la inteligencia artificial y ambiental avanzada, el internet de las cosas, las transacciones de cadena de bloques de confianza, los mundos virtuales y las capacidades de RA, los objetos y entornos digitales y reales están plenamente integrados y se comunican entre sí, lo que permite disfrutar de experiencias verdaderamente intuitivas e inmersivas en las que se combinan sin fisuras los mundos físico y digital.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q045
  prompt:
    es: "Señale la definición de protocolo de comunicación que ofrece el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Un equipo o programa que guarda información y la ofrece a otras máquinas"
  - id: b
    text:
      es: "Un pequeño fichero que un sitio web guarda en el equipo del usuario"
  - id: c
    correct: true
    text:
      es: "Un sistema de reglas que permite a dos o más entidades comunicarse para transmitir información"
  - id: d
    text:
      es: "Un número único e irrepetible que identifica a todo sistema conectado a una red"
  explanation:
    es: "Según INCIBE, un protocolo es un sistema de reglas que permite que dos o más entidades se comuniquen para transmitir información. Un equipo o programa que guarda y ofrece información es la definición de servidor. Un número único que identifica a todo sistema conectado a una red es la dirección IP. Un pequeño fichero que guarda un sitio web en el equipo del usuario es una cookie."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.16.19. Protocolo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q046
  prompt:
    es: "Señale lo que define la norma o estándar de un protocolo, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Solo el medio físico por el que viajan los datos entre las entidades"
  - id: b
    correct: true
    text:
      es: "La sintaxis, la semántica y la sincronización de la comunicación, y los métodos de recuperación de errores"
  - id: c
    text:
      es: "Solo el hardware que lo implementa, sin que el software pueda hacerlo"
  - id: d
    text:
      es: "La sintaxis, la semántica y la velocidad de la comunicación, pero no la recuperación de errores"
  explanation:
    es: "La norma de un protocolo define la sintaxis, la semántica y la sincronización de la comunicación y los posibles métodos de recuperación de errores. Cambiar la sincronización por la velocidad y quitar la recuperación de errores altera la lista que da el glosario. El protocolo sirve para cualquier tipo de medio físico, que no es lo que define. Los protocolos pueden implementarse por hardware, por software o por una combinación de ambos."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.16.19. Protocolo»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q047
  prompt:
    es: "En la familia de protocolos TCP/IP, según el glosario de términos de ciberseguridad de INCIBE, el protocolo TCP:"
  options:
  - id: a
    text:
      es: "Traduce nombres inteligibles en direcciones IP"
  - id: b
    text:
      es: "Cifra el tráfico con una clave que intercambian navegador y servidor"
  - id: c
    text:
      es: "Transfiere los paquetes de datos hasta su destino correcto"
  - id: d
    correct: true
    text:
      es: "Garantiza que la transferencia se lleve a cabo de forma correcta y fiable"
  explanation:
    es: "TCP se ocupa de garantizar que la transferencia de datos se lleve a cabo de forma correcta y confiable. Transferir los paquetes hasta su destino correcto es la función de IP. Traducir nombres en direcciones IP es la función del DNS. Cifrar el tráfico con una clave intercambiada entre navegador y servidor es lo que hace HTTPS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.2. TCP/IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q048
  prompt:
    es: "En la familia de protocolos TCP/IP, según el glosario de términos de ciberseguridad de INCIBE, el protocolo IP:"
  options:
  - id: a
    text:
      es: "Garantiza que la transferencia sea correcta y confiable"
  - id: b
    text:
      es: "Distingue si el usuario es un humano o un bot"
  - id: c
    text:
      es: "Asocia cada nombre de dominio con información variada sobre él"
  - id: d
    correct: true
    text:
      es: "Transfiere los paquetes de datos hasta su destino correcto"
  explanation:
    es: "El protocolo IP se ocupa de transferir los paquetes de datos hasta su destino correcto. Garantizar una transferencia correcta y confiable es la función de TCP. Asociar cada nombre de dominio con información sobre él es lo que hace el servicio DNS. Distinguir a un humano de un bot es la función del CAPTCHA."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.2. TCP/IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q050
  prompt:
    es: "¿Cuál de las siguientes diferencias separa a las direcciones IP v6 de las v4, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Son idénticas en longitud, pero se escriben con letras en lugar de números"
  - id: b
    correct: true
    text:
      es: "Son mucho más complejas: hasta cuatro veces más largas y más seguras"
  - id: c
    text:
      es: "Son hasta dos veces más largas, sin diferencias de seguridad"
  - id: d
    text:
      es: "Son más sencillas: hasta cuatro veces más cortas y menos seguras"
  explanation:
    es: "Las direcciones v6 son mucho más complejas: hasta cuatro veces más largas, más seguras y con capacidad para muchos más sistemas conectados. Que sean más cortas y menos seguras invierte lo que dice el glosario. La v6 es hasta cuatro veces más larga, por lo que la longitud no es idéntica. La cifra del glosario es hasta cuatro veces más largas, y también las califica de más seguras."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q051
  prompt:
    es: "Señale la condición que hace privada una dirección IP, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Si es accesible directamente desde cualquier sistema conectado a Internet"
  - id: b
    text:
      es: "Si solo puede asignarse a sistemas sin ninguna conexión de red"
  - id: c
    text:
      es: "Si identifica únicamente a los servidores, y no a los demás equipos de la red"
  - id: d
    correct: true
    text:
      es: "Si es interna a una red local y solo accesible desde los equipos de esa red privada"
  explanation:
    es: "Una dirección IP es privada si es interna a una red LAN y solo accesible desde los equipos conectados a esa red privada. Ser accesible desde cualquier sistema conectado a Internet es lo que define a una dirección pública. Una dirección IP identifica a todo sistema conectado a una red, no solo a los servidores. Una dirección IP identifica a un sistema conectado a una red, incluida la red privada."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q052
  prompt:
    es: "¿Qué carácter tiene, según INCIBE, el número con el que se identifica a todo sistema conectado a una red mediante la dirección IP?"
  options:
  - id: a
    correct: true
    text:
      es: "Único e irrepetible, como la matrícula de un coche"
  - id: b
    text:
      es: "Compartido por todos los sistemas de la misma red local"
  - id: c
    text:
      es: "Variable, y cambia con cada paquete que envía el sistema"
  - id: d
    text:
      es: "Reservado a los servidores, sin identificar a los equipos cliente"
  explanation:
    es: "La dirección IP es un número único e irrepetible con el que se identifica a todo sistema conectado a una red; INCIBE lo compara con la matrícula de un coche. Un número que cambia con cada paquete contradice que sea único e irrepetible. Un número compartido por todos los sistemas de una red no identificaría a cada uno. La dirección IP identifica a todo sistema conectado, no solo a los servidores."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q053
  prompt:
    es: "Un usuario escribe un nombre de dominio fácil de recordar y su equipo localiza el sistema correspondiente. ¿Qué servicio traduce ese nombre en la dirección IP?"
  options:
  - id: a
    correct: true
    text:
      es: "El DNS, servicio de nombres de dominio"
  - id: b
    text:
      es: "El proxy, que centraliza el tráfico de la red privada"
  - id: c
    text:
      es: "El comando ping, que comprueba la conectividad IP"
  - id: d
    text:
      es: "El HTTPS, que cifra el tráfico con una clave"
  explanation:
    es: "El DNS traduce nombres inteligibles para las personas en las direcciones IP de los sistemas conectados a la red. HTTPS cifra el tráfico entre navegador y servidor, no traduce nombres. El proxy hace de intermediario entre las peticiones de la red privada e Internet, sin traducir nombres. El comando ping comprueba la conectividad IP con otro equipo mediante mensajes de eco, sin traducir nombres."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.17. DNS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l12-q055
  prompt:
    es: "Según el glosario de términos de ciberseguridad de INCIBE, el término DNS (Domain Name Service) se refiere:"
  options:
  - id: a
    text:
      es: "Solo al servidor, y no al servicio que ofrece"
  - id: b
    correct: true
    text:
      es: "Tanto al servicio de nombres de dominio como al servidor que lo ofrece"
  - id: c
    text:
      es: "Solo al servicio, y nunca al servidor que lo presta"
  - id: d
    text:
      es: "Al protocolo que cifra el tráfico entre navegador y servidor"
  explanation:
    es: "DNS se refiere tanto al servicio de nombres de dominio como al servidor que ofrece dicho servicio. Decir que solo es el servicio excluye al servidor, que el glosario incluye. Decir que solo es el servidor excluye al servicio, que el glosario incluye. El protocolo que cifra el tráfico entre navegador y servidor es HTTPS, no DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.17. DNS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q056
  prompt:
    es: "En Windows 11, ¿qué tipo de mensajes envía el comando ping a otro equipo TCP/IP para comprobar la conectividad a nivel de IP?"
  options:
  - id: a
    text:
      es: "Mensajes de solicitud de conexión del protocolo TCP"
  - id: b
    text:
      es: "Mensajes de respuesta de eco del protocolo ICMP"
  - id: c
    correct: true
    text:
      es: "Mensajes de solicitud de eco del protocolo ICMP"
  - id: d
    text:
      es: "Mensajes de solicitud de eco del protocolo UDP"
  explanation:
    es: "ping comprueba la conectividad IP enviando mensajes de solicitud de eco del protocolo de mensajes de control de Internet (ICMP). Los mensajes de eco son de ICMP, no de UDP, según la descripción del comando. Las respuestas de eco son las que recibe y muestra ping, junto con los tiempos de ida y vuelta; lo que envía son solicitudes. ping no envía solicitudes de conexión TCP, sino solicitudes de eco ICMP."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q057
  prompt:
    es: "¿Cuál de las siguientes informaciones muestra el comando ping de Windows 11 sobre los mensajes de respuesta de eco que recibe del equipo de destino?"
  options:
  - id: a
    text:
      es: "Solo el número de saltos hasta el destino, sin los tiempos"
  - id: b
    correct: true
    text:
      es: "Su recepción, junto con los tiempos de ida y vuelta"
  - id: c
    text:
      es: "El contenido de los mensajes de solicitud de eco enviados"
  - id: d
    text:
      es: "La ruta completa de enrutadores, con la hora de cada salto"
  explanation:
    es: "ping muestra la recepción de los mensajes de respuesta de eco y los tiempos de ida y vuelta. Mostrar solo los saltos sin tiempos contradice que muestra los tiempos de ida y vuelta. Lo que muestra son las respuestas de eco recibidas, no el contenido de las solicitudes que envía. La ruta y la hora de cada salto solo se registran con los parámetros /r y /s, no por defecto."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "comportamiento"
