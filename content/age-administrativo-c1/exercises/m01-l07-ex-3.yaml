# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q027
  prompt:
    es: "¿Qué debe hacer el sujeto que recibe una solicitud de acceso sobre información que no obra en su poder, si conoce cuál es el competente?"
  options:
  - id: a
    text:
      es: "Inadmitirla e indicar en la resolución cuál es el órgano competente"
  - id: b
    text:
      es: "Remitirla al competente, sin necesidad de informar de ello al solicitante"
  - id: c
    text:
      es: "Devolverla al solicitante para que la presente ante el órgano competente"
  - id: d
    correct: true
    text:
      es: "Remitirla al competente e informar de esta circunstancia al solicitante"
  explanation:
    es: "El artículo 19.1 Ley 19/2013 dice que el sujeto «la remitirá al competente, si lo conociera, e informará de esta circunstancia al solicitante». La inadmisión con indicación del competente es para el caso contrario, cuando el competente se desconoce (art. 18.1.d) y 18.2). La ley exige informar al solicitante y no prevé devolverle la solicitud."
  citation: "art. 19.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q028
  prompt:
    es: "De acuerdo con el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, si la solicitud no identifica suficientemente la información, se pedirá al solicitante que la concrete:"
  options:
  - id: a
    correct: true
    text:
      es: "En diez días, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  - id: b
    text:
      es: "En quince días, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  - id: c
    text:
      es: "En diez días, advirtiéndole de que, si no lo hace, se archivará por caducidad"
  - id: d
    text:
      es: "En un mes, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  explanation:
    es: "El artículo 19.2 fija «un plazo de diez días, con indicación de que, en caso de no hacerlo, se le tendrá por desistido». Los quince días son el plazo de alegaciones de los terceros (art. 19.3). Un mes es el plazo para resolver (art. 20.1). La consecuencia es el desistimiento, no la caducidad."
  citation: "art. 19.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q029
  prompt:
    es: "Según el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué plazo tienen los terceros debidamente identificados para alegar si la información solicitada puede afectar a sus derechos?"
  options:
  - id: a
    text:
      es: "Un plazo de diez días para realizar las alegaciones oportunas"
  - id: b
    text:
      es: "Un plazo de un mes para realizar las alegaciones oportunas"
  - id: c
    correct: true
    text:
      es: "Un plazo de quince días para realizar las alegaciones oportunas"
  - id: d
    text:
      es: "Un plazo de cinco días hábiles para realizar las alegaciones oportunas"
  explanation:
    es: "El artículo 19.3 concede a los terceros «un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas». Diez días es el plazo para que el solicitante concrete su solicitud (art. 19.2). Un mes es el plazo para resolver (art. 20.1). Cinco días no aparece en este procedimiento."
  citation: "art. 19.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q030
  prompt:
    es: "De acuerdo con el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, cuando se da audiencia a terceros afectados, el plazo para dictar resolución queda suspendido hasta que:"
  options:
  - id: a
    text:
      es: "El Consejo de Transparencia y Buen Gobierno emita informe sobre las alegaciones"
  - id: b
    correct: true
    text:
      es: "Se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación"
  - id: c
    text:
      es: "Los terceros presten su consentimiento expreso y por escrito al acceso"
  - id: d
    text:
      es: "Se reciban las alegaciones, sin que baste el transcurso del plazo"
  explanation:
    es: "El artículo 19.3 mantiene la suspensión del plazo para resolver «hasta que se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación». Basta con que pase el plazo, aunque no lleguen alegaciones. La ley no pide informe del Consejo en este trámite, y la suspensión no depende del consentimiento de los terceros."
  citation: "art. 19.3 Ley 19/2013"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q031
  prompt:
    es: "De acuerdo con el artículo 20 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la resolución que conceda o deniegue el acceso deberá notificarse en el plazo máximo de:"
  options:
  - id: a
    text:
      es: "Tres meses desde la recepción de la solicitud por el órgano competente para resolver"
  - id: b
    correct: true
    text:
      es: "Un mes desde la recepción de la solicitud por el órgano competente para resolver"
  - id: c
    text:
      es: "Un mes desde la presentación de la solicitud en cualquier registro"
  - id: d
    text:
      es: "Quince días desde la recepción de la solicitud por el órgano competente"
  explanation:
    es: "El artículo 20.1 fija «el plazo máximo de un mes desde la recepción de la solicitud por el órgano competente para resolver». Tres meses es el plazo para resolver la reclamación ante el Consejo (art. 24.4). El plazo no se cuenta desde la presentación en cualquier registro. Quince días es el plazo de alegaciones de los terceros (art. 19.3)."
  citation: "art. 20.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q032
  prompt:
    es: "¿En qué caso puede ampliarse por otro mes el plazo para resolver una solicitud de acceso a la información pública?"
  options:
  - id: a
    text:
      es: "Cuando la información pueda afectar a derechos o intereses de terceros debidamente identificados"
  - id: b
    text:
      es: "Cuando el solicitante no haya motivado su solicitud de acceso a la información"
  - id: c
    text:
      es: "Cuando el órgano carezca de medios suficientes, sin necesidad de notificarlo al solicitante"
  - id: d
    correct: true
    text:
      es: "Cuando el volumen o la complejidad de la información lo hagan necesario, previa notificación al solicitante"
  explanation:
    es: "El artículo 20.1 Ley 19/2013 permite ampliar el plazo por otro mes «en el caso de que el volumen o la complejidad de la información que se solicita así lo hagan necesario y previa notificación al solicitante». La afectación a terceros abre el trámite de alegaciones y suspende el plazo (art. 19.3); no lo amplía. La falta de motivación no tiene efectos (art. 17.3). La falta de medios no es causa de ampliación, y la notificación al solicitante es obligatoria."
  citation: "art. 20.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q033
  prompt:
    es: "De acuerdo con el artículo 20 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, serán motivadas las resoluciones en materia de acceso que:"
  options:
  - id: a
    text:
      es: "Denieguen totalmente el acceso, pero no las que concedan un acceso parcial a la información"
  - id: b
    text:
      es: "Denieguen el acceso, salvo cuando la denegación se funde en la protección de datos personales"
  - id: c
    text:
      es: "Concedan el acceso pese a la oposición de un tercero, pero no las que lo denieguen"
  - id: d
    correct: true
    text:
      es: "Denieguen el acceso, concedan el acceso parcial o por una modalidad distinta a la solicitada, o lo permitan pese a la oposición de un tercero"
  explanation:
    es: "El artículo 20.2 exige motivar «las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero». El acceso parcial también se motiva. La ley no exceptúa las denegaciones basadas en la protección de datos. Las denegaciones se motivan siempre."
  citation: "art. 20.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q034
  prompt:
    es: "Señale la respuesta correcta sobre el plazo máximo para resolver una solicitud de acceso a la información pública conforme a la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "Transcurrido sin resolución expresa notificada, la solicitud se entiende estimada"
  - id: b
    text:
      es: "Transcurrido sin resolución expresa notificada, se produce la caducidad del procedimiento"
  - id: c
    correct: true
    text:
      es: "Transcurrido sin resolución expresa notificada, la solicitud se entiende desestimada"
  - id: d
    text:
      es: "Es de tres meses, ampliable por otros tres si la información es compleja"
  explanation:
    es: "El artículo 20.4 dice que, transcurrido el plazo máximo sin resolución expresa notificada, «se entenderá que la solicitud ha sido desestimada». El silencio no es estimatorio ni produce la caducidad. El plazo es de un mes, ampliable por otro mes (art. 20.1), no de tres meses."
  citation: "art. 20.4 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2013-12887-art-22
- id: m01-l07-q035
  prompt:
    es: "Según el artículo 22 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, si el acceso no puede darse al notificar la resolución, ¿en qué plazo debe otorgarse?"
  options:
  - id: a
    text:
      es: "En un plazo no superior a quince días"
  - id: b
    correct: true
    text:
      es: "En un plazo no superior a diez días"
  - id: c
    text:
      es: "En un plazo no superior a un mes"
  - id: d
    text:
      es: "En un plazo no inferior a diez días ni superior a un mes"
  explanation:
    es: "El artículo 22.1 dice que, si no puede darse en el momento de la notificación, el acceso «deberá otorgarse, en cualquier caso, en un plazo no superior a diez días». Quince días y un mes son otros plazos de la ley (arts. 19.3 y 20.1), no este. La ley no fija un mínimo de diez días."
  citation: "art. 22.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-22
- id: m01-l07-q036
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el coste del acceso a la información pública es correcta según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El acceso devenga en todo caso la tasa que fije cada Administración"
  - id: b
    correct: true
    text:
      es: "El acceso es gratuito, aunque la expedición de copias puede dar lugar a exacciones"
  - id: c
    text:
      es: "El acceso es gratuito en todo caso, incluidas la expedición de copias y el cambio de formato"
  - id: d
    text:
      es: "El acceso es gratuito solo para quien acredite un interés legítimo"
  explanation:
    es: "El artículo 22.4 dice que «el acceso a la información será gratuito», pero que la expedición de copias o el cambio a un formato diferente al original «podrá dar lugar a la exigencia de exacciones». El acceso no devenga siempre una tasa. Las copias y el cambio de formato no son necesariamente gratuitos. La gratuidad no depende de acreditar un interés."
  citation: "art. 22.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q037
  prompt:
    es: "La reclamación ante el Consejo de Transparencia y Buen Gobierno frente a una resolución expresa o presunta en materia de acceso tiene carácter:"
  options:
  - id: a
    text:
      es: "Obligatorio y previo a la impugnación en vía contencioso-administrativa"
  - id: b
    correct: true
    text:
      es: "Potestativo y previo a la impugnación en vía contencioso-administrativa"
  - id: c
    text:
      es: "Potestativo y posterior a la resolución del recurso de alzada"
  - id: d
    text:
      es: "Obligatorio y sustitutivo de la impugnación en vía contencioso-administrativa"
  explanation:
    es: "El artículo 24.1 Ley 19/2013 configura la reclamación «con carácter potestativo y previo a su impugnación en vía contencioso-administrativa». No es obligatoria: las resoluciones pueden recurrirse directamente ante la jurisdicción contencioso-administrativa (art. 20.5). No sigue a un recurso de alzada, porque sustituye a los recursos administrativos (art. 23.1). No sustituye a la vía contencioso-administrativa, sino que la precede."
  citation: "art. 24.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q038
  prompt:
    es: "Según el artículo 24 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿en qué plazo se interpone la reclamación ante el Consejo de Transparencia y Buen Gobierno?"
  options:
  - id: a
    text:
      es: "En tres meses desde el día siguiente a la notificación o a los efectos del silencio"
  - id: b
    correct: true
    text:
      es: "En un mes desde el día siguiente a la notificación o a los efectos del silencio"
  - id: c
    text:
      es: "En dos meses desde el día siguiente a la notificación o a los efectos del silencio"
  - id: d
    text:
      es: "En quince días hábiles desde la notificación del acto o los efectos del silencio"
  explanation:
    es: "El artículo 24.2 fija «el plazo de un mes a contar desde el día siguiente al de la notificación del acto impugnado o desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo». Tres meses es el plazo para resolver la reclamación (art. 24.4), no para interponerla. Dos meses y quince días hábiles no aparecen en el artículo 24."
  citation: "art. 24.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q039
  prompt:
    es: "De acuerdo con el artículo 24 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el plazo máximo para resolver y notificar la reclamación ante el Consejo es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Tres meses, transcurridos los cuales la reclamación se entenderá desestimada"
  - id: b
    text:
      es: "Tres meses, transcurridos los cuales la reclamación se entenderá estimada"
  - id: c
    text:
      es: "Un mes, transcurrido el cual la reclamación se entenderá desestimada"
  - id: d
    text:
      es: "Seis meses, transcurridos los cuales la reclamación se entenderá desestimada"
  explanation:
    es: "El artículo 24.4 dice que el plazo máximo para resolver y notificar «será de tres meses, transcurrido el cual, la reclamación se entenderá desestimada». El silencio no es estimatorio. Un mes es el plazo para interponer la reclamación (art. 24.2). Seis meses no aparece en el precepto."
  citation: "art. 24.4 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q040
  prompt:
    es: "¿A quién comunica el Presidente del Consejo de Transparencia y Buen Gobierno las resoluciones que dicta sobre las reclamaciones en materia de acceso?"
  options:
  - id: a
    correct: true
    text:
      es: "A la institución del Defensor del Pueblo"
  - id: b
    text:
      es: "A la Comisión Constitucional del Congreso de los Diputados"
  - id: c
    text:
      es: "A la Agencia Española de Protección de Datos"
  - id: d
    text:
      es: "A la Sección de Enjuiciamiento del Tribunal de Cuentas"
  explanation:
    es: "El artículo 24.5 Ley 19/2013 dice que el Presidente del Consejo «comunicará al Defensor del Pueblo las resoluciones que dicte en aplicación de este artículo». La ley no prevé esa comunicación a una comisión del Congreso, a la Agencia Española de Protección de Datos ni al Tribunal de Cuentas."
  citation: "art. 24.5 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-da-cuarta
- id: m01-l07-q041
  prompt:
    es: "Según la disposición adicional cuarta de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿quién resuelve la reclamación frente a las resoluciones en materia de acceso dictadas por las Entidades Locales?"
  options:
  - id: a
    text:
      es: "El Consejo de Transparencia y Buen Gobierno, en todo caso y sin excepción"
  - id: b
    text:
      es: "El Pleno de la Entidad Local que dictó la resolución impugnada"
  - id: c
    correct: true
    text:
      es: "El órgano independiente que determine la Comunidad Autónoma en cuyo ámbito territorial se encuentren"
  - id: d
    text:
      es: "La Delegación del Gobierno en la Comunidad Autónoma correspondiente"
  explanation:
    es: "La disposición adicional cuarta, apartado 1, atribuye la reclamación contra resoluciones de las Entidades Locales comprendidas en el ámbito territorial de una Comunidad Autónoma «al órgano independiente que determinen las Comunidades Autónomas». El Consejo no resuelve en todo caso: solo si la Comunidad le atribuye la competencia mediante convenio (apartado 2). La ley no da esta competencia al Pleno de la Entidad Local ni a la Delegación del Gobierno."
  citation: "disposición adicional cuarta Ley 19/2013"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-da-cuarta
- id: m01-l07-q042
  prompt:
    es: "¿Cuál de las siguientes opciones tienen las Ciudades con Estatuto de Autonomía para resolver las reclamaciones en materia de acceso a la información pública?"
  options:
  - id: a
    text:
      es: "Atribuir la competencia al Consejo mediante convenio, sin poder designar órganos propios"
  - id: b
    text:
      es: "Designar sus propios órganos independientes, sin posibilidad de convenio con el Consejo"
  - id: c
    correct: true
    text:
      es: "Designar sus propios órganos independientes o atribuir la competencia al Consejo mediante convenio"
  - id: d
    text:
      es: "Atribuir la competencia a la Delegación del Gobierno o al Consejo mediante convenio"
  explanation:
    es: "La disposición adicional cuarta, apartado 3, dice que las Ciudades con Estatuto de Autonomía «podrán designar sus propios órganos independientes o bien atribuir la competencia al Consejo de Transparencia y Buen Gobierno», celebrando un convenio. Tienen las dos opciones, no solo una de ellas. La Delegación del Gobierno no aparece en la disposición."
  citation: "disposición adicional cuarta Ley 19/2013"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
