# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q023
  prompt:
    es: "Según el artículo 53.1 de la Constitución Española de 1978, el ejercicio de los derechos y libertades reconocidos en el capítulo segundo del título I solo podrá regularse:"
  options:
  - id: a
    text:
      es: "Por ley o por reglamento, que en todo caso deberán respetar su contenido esencial."
  - id: b
    text:
      es: "Por ley, que podrá limitar su contenido esencial cuando lo exija el interés general."
  - id: c
    text:
      es: "Por ley, sin otro límite que el respeto a los tratados internacionales."
  - id: d
    correct: true
    text:
      es: "Por ley, que en todo caso deberá respetar su contenido esencial."
  explanation:
    es: "El artículo 53.1 dice: «Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades». El reglamento queda excluido. El contenido esencial es un límite absoluto para la ley, que no puede reducirlo ni por razones de interés general."
  citation: "art. 53.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-53
- id: m01-l01-q024
  prompt:
    es: "¿Cuál de los siguientes derechos, recogido en la sección 2.ª del capítulo segundo del título I, es también susceptible de recurso de amparo según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El derecho a la objeción de conciencia."
  - id: b
    text:
      es: "El derecho a la propiedad privada y a la herencia."
  - id: c
    text:
      es: "El derecho al trabajo y a la libre elección de profesión u oficio."
  - id: d
    text:
      es: "La libertad de empresa en el marco de la economía de mercado."
  explanation:
    es: "El artículo 53.2 limita el amparo al artículo 14 y a la sección 1.ª, y añade: «Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30». La propiedad privada, el derecho al trabajo y la libertad de empresa están en la sección 2.ª y no tienen amparo."
  citation: "art. 53.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-81
- id: m01-l01-q025
  prompt:
    es: "Según el artículo 81.2 de la Constitución Española de 1978, ¿qué exige la aprobación, modificación o derogación de las leyes orgánicas, como la que desarrolla un derecho fundamental?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de cada una de las Cámaras, en una votación final sobre el conjunto del proyecto."
  - id: b
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    text:
      es: "Mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto."
  explanation:
    es: "El artículo 81.2 exige «mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto». La mayoría absoluta se pide solo al Congreso, no a las dos Cámaras. Los tres quintos son la mayoría de la reforma constitucional ordinaria. La mayoría simple es la de las leyes ordinarias."
  citation: "art. 81.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q026
  prompt:
    es: "Según el artículo 55.1 de la Constitución Española de 1978, ¿cuál de los siguientes derechos NO puede suspenderse cuando se acuerda la declaración del estado de excepción o de sitio?"
  options:
  - id: a
    text:
      es: "El derecho a la huelga de los trabajadores."
  - id: b
    text:
      es: "El derecho de reunión pacífica y sin armas."
  - id: c
    text:
      es: "El derecho a elegir libremente la residencia y a circular por el territorio nacional."
  - id: d
    correct: true
    text:
      es: "El derecho de asociación."
  explanation:
    es: "El artículo 55.1 permite suspender los derechos de los artículos 17, 18.2 y 3, 19, 20.1.a) y d) y 5, 21, 28.2 y 37.2. La huelga (art. 28.2), la reunión (art. 21) y la libre residencia y circulación (art. 19) están en la lista. El derecho de asociación (art. 22) no está, así que no puede suspenderse."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q027
  prompt:
    es: "De acuerdo con el artículo 55.1 de la Constitución Española de 1978, cuando se declara el estado de excepción, no pueden suspenderse los derechos del detenido consistentes en:"
  options:
  - id: a
    correct: true
    text:
      es: "Ser informado de sus derechos y de las razones de su detención, no ser obligado a declarar y contar con asistencia de abogado."
  - id: b
    text:
      es: "No permanecer detenido más de setenta y dos horas sin ser puesto a disposición judicial."
  - id: c
    text:
      es: "No sufrir entradas ni registros en su domicilio sin resolución judicial."
  - id: d
    text:
      es: "Mantener el secreto de sus comunicaciones salvo resolución judicial."
  explanation:
    es: "El artículo 55.1 exceptúa de la suspensión «el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción». Ese apartado recoge el derecho a ser informado, a no declarar y a la asistencia de abogado. El plazo de setenta y dos horas (art. 17.2), la inviolabilidad del domicilio (art. 18.2) y el secreto de las comunicaciones (art. 18.3) sí pueden suspenderse."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q028
  prompt:
    es: "De acuerdo con el artículo 116.2 de la Constitución Española de 1978, el estado de alarma será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros por un plazo máximo de:"
  options:
  - id: a
    text:
      es: "Quince días, previa autorización del Congreso de los Diputados."
  - id: b
    correct: true
    text:
      es: "Quince días, dando cuenta al Congreso de los Diputados."
  - id: c
    text:
      es: "Treinta días, dando cuenta al Congreso de los Diputados."
  - id: d
    text:
      es: "Treinta días, prorrogables por otro plazo igual."
  explanation:
    es: "El artículo 116.2 fija un plazo máximo de quince días, «dando cuenta al Congreso de los Diputados», cuya autorización solo se necesita para prorrogarlo. La autorización previa del Congreso corresponde al estado de excepción. Los treinta días prorrogables por otro plazo igual son también del estado de excepción (art. 116.3)."
  citation: "art. 116.2 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q029
  prompt:
    es: "Según el artículo 116.3 de la Constitución Española de 1978, ¿qué duración puede tener el estado de excepción que determinen su autorización y proclamación?"
  options:
  - id: a
    text:
      es: "No podrá exceder de quince días, prorrogables por otro plazo igual."
  - id: b
    text:
      es: "No podrá exceder de treinta días, sin posibilidad de prórroga."
  - id: c
    text:
      es: "La que determine el Congreso de los Diputados, sin límite máximo."
  - id: d
    correct: true
    text:
      es: "No podrá exceder de treinta días, prorrogables por otro plazo igual."
  explanation:
    es: "El artículo 116.3 dice que su duración «no podrá exceder de treinta días, prorrogables por otro plazo igual, con los mismos requisitos». Quince días es el plazo máximo del estado de alarma. La prórroga está permitida. La duración que fija libremente el Congreso es la del estado de sitio (art. 116.4)."
  citation: "art. 116.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q031
  prompt:
    es: "¿Quién declara el estado de sitio y a propuesta de quién, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Gobierno, mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso."
  - id: b
    correct: true
    text:
      es: "La mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno."
  - id: c
    text:
      es: "La mayoría absoluta de cada una de las Cámaras, a propuesta exclusiva del Gobierno."
  - id: d
    text:
      es: "La mayoría de tres quintos del Congreso de los Diputados, a propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 116.4 dice que el estado de sitio «será declarado por la mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno». El decreto del Gobierno con autorización previa del Congreso es el estado de excepción. El Senado no interviene y la mayoría exigida no es de tres quintos."
  citation: "art. 116.4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q032
  prompt:
    es: "¿Cuál de las siguientes describe correctamente la composición del Tribunal Constitucional, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Doce miembros: seis a propuesta del Congreso, cuatro del Senado y dos del Gobierno."
  - id: b
    text:
      es: "Doce miembros: cuatro a propuesta del Congreso, dos del Senado, cuatro del Gobierno y dos del Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Doce miembros: cuatro a propuesta del Congreso, cuatro del Senado, dos del Gobierno y dos del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Quince miembros: cinco a propuesta del Congreso, cinco del Senado, tres del Gobierno y dos del Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 159.1 dice que el Tribunal se compone de 12 miembros nombrados por el Rey: cuatro a propuesta del Congreso, cuatro del Senado, dos del Gobierno y dos del Consejo General del Poder Judicial. Las otras opciones cambian el reparto o el total."
  citation: "art. 159.1 CE"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q033
  prompt:
    es: "¿Por qué mayoría propone el Senado a los cuatro miembros del Tribunal Constitucional que le corresponden, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría de tres quintos de sus miembros, idéntica a la del Congreso."
  - id: b
    text:
      es: "Por mayoría absoluta de sus miembros."
  - id: c
    text:
      es: "Por mayoría de dos tercios de sus miembros."
  - id: d
    text:
      es: "Por mayoría simple de los senadores presentes."
  explanation:
    es: "El artículo 159.1 dice que cuatro miembros se nombran a propuesta del Congreso «por mayoría de tres quintos de sus miembros» y cuatro a propuesta del Senado, «con idéntica mayoría». La mayoría absoluta, la de dos tercios y la simple no son las que fija el artículo."
  citation: "art. 159.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q034
  prompt:
    es: "Según el artículo 159.2 de la Constitución Española de 1978, los miembros del Tribunal Constitucional se nombrarán entre Magistrados y Fiscales, Profesores de Universidad, funcionarios públicos y Abogados, todos ellos juristas de reconocida competencia con:"
  options:
  - id: a
    text:
      es: "Más de diez años de ejercicio profesional."
  - id: b
    correct: true
    text:
      es: "Más de quince años de ejercicio profesional."
  - id: c
    text:
      es: "Más de veinte años de ejercicio profesional."
  - id: d
    text:
      es: "Más de doce años de ejercicio profesional."
  explanation:
    es: "El artículo 159.2 exige juristas de reconocida competencia «con más de quince años de ejercicio profesional». Diez, doce y veinte años no son la cifra del artículo."
  citation: "art. 159.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q035
  prompt:
    es: "Según el artículo 159.3 de la Constitución Española de 1978, ¿cómo se renueva el Tribunal Constitucional a lo largo del período de designación de sus miembros?"
  options:
  - id: a
    text:
      es: "Por mitades cada cuatro años y medio."
  - id: b
    text:
      es: "Por cuartas partes cada tres años."
  - id: c
    correct: true
    text:
      es: "Por terceras partes cada tres años."
  - id: d
    text:
      es: "Por terceras partes cada cuatro años."
  explanation:
    es: "El artículo 159.3 dice que los miembros «se renovarán por terceras partes cada tres». Con doce miembros y nueve años de mandato, cada tres años se renuevan cuatro. Las renovaciones por mitades, por cuartas partes o cada cuatro años no son las del artículo."
  citation: "art. 159.3 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "composición"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q036
  prompt:
    es: "Los doce miembros del Tribunal Constitucional, nombrados por el Rey a propuesta de las Cámaras, del Gobierno y del Consejo General del Poder Judicial, son designados:"
  options:
  - id: a
    text:
      es: "Por un período de seis años."
  - id: b
    text:
      es: "Por un período de doce años."
  - id: c
    text:
      es: "Por un período de cinco años."
  - id: d
    correct: true
    text:
      es: "Por un período de nueve años."
  explanation:
    es: "El artículo 159.3 dice que los miembros del Tribunal «serán designados por un período de nueve años». Seis años no aparece en el artículo, doce coincide con el número de miembros y cinco es el mandato del Defensor del Pueblo."
  citation: "art. 159.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1979-23709-art-16
- id: m01-l01-q037
  prompt:
    es: "De acuerdo con el artículo 16 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ningún Magistrado podrá ser propuesto al Rey para otro período inmediato:"
  options:
  - id: a
    text:
      es: "Salvo que hubiera ocupado el cargo por un plazo no superior a seis años."
  - id: b
    correct: true
    text:
      es: "Salvo que hubiera ocupado el cargo por un plazo no superior a tres años."
  - id: c
    text:
      es: "Salvo que lo proponga el mismo órgano que lo propuso la primera vez."
  - id: d
    text:
      es: "Salvo que hubiera sido Presidente del Tribunal durante su mandato."
  explanation:
    es: "El artículo 16.4 de la LOTC dice: «Ningún Magistrado podrá ser propuesto al Rey para otro período inmediato, salvo que hubiera ocupado el cargo por un plazo no superior a tres años». El límite es de tres años, no de seis. El órgano proponente y el haber sido Presidente no abren ninguna excepción."
  citation: "art. 16.4 LOTC"
  difficulty: 3
  tags:
  - "excepción"
  - "plazo"
