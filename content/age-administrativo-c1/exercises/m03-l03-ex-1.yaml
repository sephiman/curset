# anchor: boe-a-2015-10565-art-4
- id: m03-l03-q001
  prompt:
    es: "Una persona no ha iniciado un procedimiento administrativo, pero tiene derechos que pueden resultar afectados por la decisión que en él se adopte. ¿Cuál es su posición en ese procedimiento?"
  options:
  - id: a
    text:
      es: "Solo es interesada si se persona antes de la resolución definitiva."
  - id: b
    correct: true
    text:
      es: "Se la considera interesada en el procedimiento, sin más requisitos."
  - id: c
    text:
      es: "Solo es interesada si el órgano instructor la emplaza de forma expresa."
  - id: d
    text:
      es: "No es interesada, porque no ha promovido el procedimiento."
  explanation:
    es: "El artículo 4.1.b) LPAC considera interesados a «los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión que en el mismo se adopte». No pide nada más. La condición de personarse mientras no haya resolución definitiva es la de la letra c), para quien solo tiene intereses legítimos, no derechos. El emplazamiento por el instructor no es un requisito de la ley. Haber promovido el procedimiento es el caso de la letra a), no el único."
  citation: "art. 4.1.b) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-5
- id: m03-l03-q004
  prompt:
    es: "El jueves 12 de noviembre de 2026 se notifica a un interesado el requerimiento para subsanar la acreditación de su representación, con el plazo ordinario de diez días. No hay festivos en el periodo. ¿Cuál es el último día para subsanar?"
  options:
  - id: a
    text:
      es: "El lunes 23 de noviembre de 2026."
  - id: b
    text:
      es: "El miércoles 25 de noviembre de 2026."
  - id: c
    correct: true
    text:
      es: "El jueves 26 de noviembre de 2026."
  - id: d
    text:
      es: "El jueves 3 de diciembre de 2026."
  explanation:
    es: "El artículo 5.6 LPAC da diez días, y los días son hábiles: el artículo 30.2 LPAC excluye sábados, domingos y festivos, y el cómputo empieza el día siguiente a la notificación. El plazo empieza el viernes 13 de noviembre; los días hábiles son el 13, 16, 17, 18, 19, 20, 23, 24, 25 y 26, así que el décimo es el jueves 26 de noviembre de 2026. El lunes 23 sale de contar diez días naturales (el domingo 22) y pasar al día hábil siguiente. El miércoles 25 cuenta como primer día el de la notificación. El jueves 3 de diciembre corresponde a quince días hábiles."
  citation: "art. 5.6 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10565-art-14
- id: m03-l03-q005
  prompt:
    es: "Según el artículo 14.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las personas físicas que no estén obligadas a relacionarse electrónicamente con las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "deberán mantener hasta el final del procedimiento el medio elegido al iniciarlo."
  - id: b
    correct: true
    text:
      es: "podrán elegir en todo momento si se comunican con ellas por medios electrónicos o no."
  - id: c
    text:
      es: "deberán comunicarse por medios electrónicos, salvo que acrediten no disponer de ellos."
  - id: d
    text:
      es: "solo podrán cambiar el medio de comunicación con autorización del órgano instructor."
  explanation:
    es: "El artículo 14.1 LPAC dice que las personas físicas «podrán elegir en todo momento» si se comunican por medios electrónicos o no, salvo que estén obligadas. Si la elección cabe en todo momento, no queda fijada al iniciar el procedimiento ni depende de una autorización del instructor. La regla para las personas físicas no obligadas es la libre elección, no el medio electrónico con una excepción por falta de medios."
  citation: "art. 14.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-14
- id: m03-l03-q006
  prompt:
    es: "Según el artículo 14.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en cuál de estos casos quien representa a un interesado está obligado a relacionarse electrónicamente con la Administración?"
  options:
  - id: a
    text:
      es: "Cuando el interesado al que representa sea una persona física mayor de edad."
  - id: b
    text:
      es: "Cuando la representación se haya acreditado mediante apoderamiento apud acta."
  - id: c
    text:
      es: "Cuando el representante actúe en el procedimiento sin percibir ninguna retribución."
  - id: d
    correct: true
    text:
      es: "Cuando el interesado al que representa esté obligado a relacionarse electrónicamente."
  explanation:
    es: "La letra d) del artículo 14.2 LPAC obliga a «quienes representen a un interesado que esté obligado a relacionarse electrónicamente con la Administración». La obligación del representante sigue a la del representado. Que el representado sea una persona física mayor de edad no la crea: las personas físicas pueden elegir. La forma de acreditar la representación y el carácter gratuito de la representación no aparecen en el artículo."
  citation: "art. 14.2.d) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-14
- id: m03-l03-q007
  prompt:
    es: "Conforme al artículo 14.2.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los empleados de las Administraciones Públicas están obligados a relacionarse con ellas a través de medios electrónicos:"
  options:
  - id: a
    correct: true
    text:
      es: "para los trámites que realicen con ellas por razón de su condición de empleado público."
  - id: b
    text:
      es: "para cualquier trámite, incluidos los que realicen con ellas como simples particulares."
  - id: c
    text:
      es: "solo cuando así lo disponga el convenio colectivo o el pacto que les resulte aplicable."
  - id: d
    text:
      es: "solo si pertenecen a cuerpos o escalas de los subgrupos A1 o A2 de clasificación."
  explanation:
    es: "El artículo 14.2.e) LPAC obliga a los empleados públicos «para los trámites y actuaciones que realicen con ellas por razón de su condición de empleado público», en la forma que determine cada Administración por reglamento. Fuera de esa condición son personas físicas y pueden elegir, así que la obligación no alcanza a lo que hagan como particulares. La ley no remite a un convenio o pacto ni distingue por subgrupos."
  citation: "art. 14.2.e) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m03-l03-q008
  prompt:
    es: "Según el artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los registros electrónicos de todas y cada una de las Administraciones deberán ser plenamente interoperables, de modo que se garantice:"
  options:
  - id: a
    text:
      es: "su integración en un registro electrónico único gestionado por la Administración General del Estado."
  - id: b
    text:
      es: "su compatibilidad informática, sin que proceda la transmisión de los documentos presentados."
  - id: c
    correct: true
    text:
      es: "su compatibilidad informática e interconexión y la transmisión telemática de asientos y documentos."
  - id: d
    text:
      es: "la transmisión telemática de los asientos registrales, pero no la de los documentos presentados."
  explanation:
    es: "El artículo 16.4 LPAC exige que se garantice «su compatibilidad informática e interconexión, así como la transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros». Las dos opciones que excluyen los documentos recortan esa frase. La ley no crea un registro único estatal: cada Administración tiene el suyo y lo que se exige es que sean interoperables."
  citation: "art. 16.4 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m03-l03-q009
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los registros electrónicos recoge el artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cada Administración decide si su registro es interoperable con los de las demás."
  - id: b
    correct: true
    text:
      es: "Los de todas las Administraciones deben ser plenamente interoperables entre sí."
  - id: c
    text:
      es: "La interoperabilidad solo se exige entre registros de una misma Administración."
  - id: d
    text:
      es: "Solo deben ser interoperables los registros de la Administración General del Estado."
  explanation:
    es: "El artículo 16.4 LPAC dice que «los registros electrónicos de todas y cada una de las Administraciones» deberán ser plenamente interoperables. La ley impone un deber y no deja la decisión a cada Administración. Alcanza a todas las Administraciones y a la transmisión entre cualquiera de los registros, no solo a los de una misma Administración o a los del Estado."
  citation: "art. 16.4 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-17
- id: m03-l03-q010
  prompt:
    es: "De acuerdo con el artículo 17.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos electrónicos deberán conservarse en un formato que permita garantizar:"
  options:
  - id: a
    text:
      es: "su autenticidad e integridad durante los cinco años siguientes a la fecha de su emisión."
  - id: b
    text:
      es: "su integridad, con la consulta limitada al órgano administrativo que emitió el documento."
  - id: c
    text:
      es: "su autenticidad e integridad mientras no haya finalizado el procedimiento al que pertenecen."
  - id: d
    correct: true
    text:
      es: "su autenticidad, integridad y conservación, y su consulta sin depender del tiempo transcurrido."
  explanation:
    es: "El artículo 17.2 LPAC pide un formato que garantice «la autenticidad, integridad y conservación del documento, así como su consulta con independencia del tiempo transcurrido desde su emisión». Al no depender del tiempo, la garantía no se acaba a los cinco años ni al finalizar el procedimiento. La ley tampoco limita la consulta al órgano emisor: exige que los datos puedan trasladarse a formatos que permitan el acceso desde diferentes aplicaciones."
  citation: "art. 17.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-17
- id: m03-l03-q011
  prompt:
    es: "¿Qué requisito debe cumplir la eliminación de los documentos electrónicos que una Administración Pública conserva de sus procedimientos administrativos?"
  options:
  - id: a
    correct: true
    text:
      es: "Debe ser autorizada de acuerdo con lo dispuesto en la normativa aplicable."
  - id: b
    text:
      es: "Basta con que la acuerde el órgano que tramitó el procedimiento ya finalizado."
  - id: c
    text:
      es: "No cabe en ningún caso, porque deben conservarse de forma indefinida."
  - id: d
    text:
      es: "Se produce de oficio a los cinco años de la finalización del procedimiento."
  explanation:
    es: "El artículo 17.2 LPAC dice que «la eliminación de dichos documentos deberá ser autorizada de acuerdo a lo dispuesto en la normativa aplicable». La eliminación cabe, así que no está prohibida en todo caso. Pero necesita autorización conforme a esa normativa: no la decide por sí solo el órgano que tramitó ni se produce de oficio pasado un plazo."
  citation: "art. 17.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-17
- id: m03-l03-q012
  prompt:
    es: "En la conservación de los documentos electrónicos de los procedimientos, la ley de procedimiento administrativo común asegura en todo caso:"
  options:
  - id: a
    text:
      es: "la conservación de los datos solo en el formato original en que se emitieron los documentos."
  - id: b
    text:
      es: "el acceso a los datos solo desde la aplicación informática con la que se generaron."
  - id: c
    correct: true
    text:
      es: "la posibilidad de trasladar los datos a otros formatos y soportes que garanticen el acceso."
  - id: d
    text:
      es: "la impresión en papel de todos los documentos electrónicos para su archivo definitivo."
  explanation:
    es: "El artículo 17.2 LPAC dice: «Se asegurará en todo caso la posibilidad de trasladar los datos a otros formatos y soportes que garanticen el acceso desde diferentes aplicaciones». Lo que se asegura es el traslado a otros formatos, no la permanencia en el formato original. El acceso es desde diferentes aplicaciones, no desde una sola. La impresión en papel no aparece: el archivo es de documentos electrónicos."
  citation: "art. 17.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-8
- id: m03-l03-q013
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿puede un órgano administrativo renunciar a la competencia que tiene atribuida?"
  options:
  - id: a
    text:
      es: "Sí, a favor de su superior jerárquico inmediato."
  - id: b
    text:
      es: "Sí, con autorización del titular del departamento."
  - id: c
    correct: true
    text:
      es: "No, porque la competencia es irrenunciable."
  - id: d
    text:
      es: "Sí, cuando la norma de atribución no lo prohíba."
  explanation:
    es: "El artículo 8.1 LRJSP empieza: «La competencia es irrenunciable». No hay excepción a favor del superior, ni con autorización del titular del departamento, ni por silencio de la norma de atribución. Otra cosa es que se delegue o se avoque su ejercicio, que no es renunciar a ella."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-8
- id: m03-l03-q014
  prompt:
    es: "De acuerdo con el artículo 8.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la delegación de competencias, las encomiendas de gestión, la delegación de firma y la suplencia:"
  options:
  - id: a
    text:
      es: "trasladan la titularidad de la competencia al órgano que la ejerce."
  - id: b
    correct: true
    text:
      es: "no suponen alteración de la titularidad de la competencia."
  - id: c
    text:
      es: "alteran la titularidad de la competencia, salvo la delegación de firma."
  - id: d
    text:
      es: "alteran la titularidad de la competencia cuando se publican en el BOE."
  explanation:
    es: "El artículo 8.1 LRJSP dice que esas cuatro figuras «no suponen alteración de la titularidad de la competencia, aunque sí de los elementos determinantes de su ejercicio». La titularidad sigue en el órgano que la tiene atribuida, sea cual sea la figura. No hay excepción para la delegación de firma. La publicación tampoco cambia la titularidad."
  citation: "art. 8.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q015
  prompt:
    es: "Según el artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, cuando dos órganos de un mismo Ministerio no están relacionados jerárquicamente, ¿quién aprueba previamente la delegación de competencias entre ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "El superior común de ambos órganos."
  - id: b
    text:
      es: "El órgano superior del que dependa el órgano delegado."
  - id: c
    text:
      es: "El Subsecretario del Ministerio al que pertenecen."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro."
  explanation:
    es: "Para órganos no relacionados jerárquicamente, el artículo 9.1 LRJSP exige «la aprobación previa del superior común si ambos pertenecen al mismo Ministerio». El órgano superior del que dependa el órgano delegado es la regla para órganos de diferentes Ministerios. El Subsecretario y el Consejo de Ministros no aparecen en esta regla."
  citation: "art. 9.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q016
  prompt:
    es: "Conforme al artículo 9.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si el órgano delegante y el delegado, no relacionados jerárquicamente, pertenecen a diferentes Ministerios, la delegación necesita la aprobación previa:"
  options:
  - id: a
    text:
      es: "del Consejo de Ministros, a propuesta de ambos Ministros."
  - id: b
    text:
      es: "de los Subsecretarios de los dos Ministerios, de forma conjunta."
  - id: c
    text:
      es: "de la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "del órgano superior de quien dependa el órgano delegado."
  explanation:
    es: "El artículo 9.1 LRJSP pide la aprobación previa «del órgano superior de quien dependa el órgano delegado, si el delegante y el delegado pertenecen a diferentes Ministerios». Decide el superior del lado que recibe la competencia. Ni el Consejo de Ministros, ni los dos Subsecretarios juntos, ni la Comisión General de Secretarios de Estado y Subsecretarios intervienen en esta aprobación."
  citation: "art. 9.1 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q017
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la delegación de competencias es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Solo cabe en órganos jerárquicamente dependientes del órgano delegante."
  - id: b
    correct: true
    text:
      es: "Cabe en otros órganos de la misma Administración aunque no sean jerárquicamente dependientes."
  - id: c
    text:
      es: "Solo cabe entre órganos que pertenezcan al mismo Ministerio."
  - id: d
    text:
      es: "Solo cabe entre órganos que tengan el mismo rango administrativo."
  explanation:
    es: "El artículo 9.1 LRJSP permite delegar en otros órganos de la misma Administración «aun cuando no sean jerárquicamente dependientes». La dependencia jerárquica no es requisito. El mismo artículo prevé la delegación entre órganos de diferentes Ministerios, así que no se limita a un Ministerio. Tampoco exige igual rango."
  citation: "art. 9.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q018
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en ningún caso podrán ser objeto de delegación las competencias relativas a la resolución de recursos:"
  options:
  - id: a
    text:
      es: "en los órganos superiores jerárquicos de los que dictaron los actos recurridos."
  - id: b
    text:
      es: "en los organismos públicos vinculados o dependientes del órgano delegante."
  - id: c
    correct: true
    text:
      es: "en los órganos administrativos que hayan dictado los actos objeto de recurso."
  - id: d
    text:
      es: "en órganos de un Ministerio distinto de aquel al que pertenece el delegante."
  explanation:
    es: "El artículo 9.2.c) LRJSP prohíbe delegar «la resolución de recursos en los órganos administrativos que hayan dictado los actos objeto de recurso». El límite es que quien dictó el acto no resuelva el recurso contra él. La letra no habla del superior jerárquico, de los organismos públicos ni de órganos de otro Ministerio; el artículo 9.1 permite delegar en los dos últimos."
  citation: "art. 9.2.c) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q019
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las resoluciones adoptadas por delegación es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Se consideran dictadas por el órgano delegante."
  - id: b
    text:
      es: "Se consideran dictadas por el órgano delegado que las firma."
  - id: c
    text:
      es: "Se consideran dictadas por el superior común de ambos órganos."
  - id: d
    text:
      es: "Se consideran dictadas por el órgano que aprobó la delegación."
  explanation:
    es: "El artículo 9.4 LRJSP dice que esas resoluciones «se considerarán dictadas por el órgano delegante». Firma el delegado, pero el acto se imputa al delegante, que sigue siendo el titular de la competencia (artículo 8.1). El superior común y el órgano que aprobó la delegación solo intervienen al aprobarla."
  citation: "art. 9.4 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10566-art-9
- id: m03-l03-q020
  prompt:
    es: "Una Directora General delega en un Subdirector General de su dirección la competencia para resolver licencias por estudios. ¿Qué órgano se considera autor de las resoluciones que firme el Subdirector?"
  options:
  - id: a
    text:
      es: "El Subdirector General, que firma la resolución."
  - id: b
    text:
      es: "El Subsecretario del departamento ministerial."
  - id: c
    text:
      es: "Los dos órganos, de forma conjunta."
  - id: d
    correct: true
    text:
      es: "La Directora General, como órgano delegante."
  explanation:
    es: "Las resoluciones adoptadas por delegación «se considerarán dictadas por el órgano delegante» (artículo 9.4 LRJSP). Aquí el órgano delegante es la Directora General. Que el Subdirector firme no lo convierte en autor, y la ley no reparte la autoría entre los dos. El Subsecretario no es parte de la delegación."
  citation: "art. 9.4 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10566-art-14
- id: m03-l03-q021
  prompt:
    es: "Conforme al artículo 14.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el órgano administrativo que se estime incompetente para la resolución de un asunto:"
  options:
  - id: a
    text:
      es: "devolverá la solicitud al interesado y le indicará cuál es el órgano que considera competente."
  - id: b
    correct: true
    text:
      es: "remitirá directamente las actuaciones al órgano que considere competente y lo notificará a los interesados."
  - id: c
    text:
      es: "elevará las actuaciones a su superior jerárquico para que este decida qué órgano es el competente."
  - id: d
    text:
      es: "declarará inadmisible la solicitud y archivará las actuaciones, sin necesidad de notificarlo."
  explanation:
    es: "El artículo 14.1 LRJSP dice que ese órgano «remitirá directamente las actuaciones al órgano que considere competente, debiendo notificar esta circunstancia a los interesados». No devuelve la solicitud ni la inadmite: el interesado no tiene que empezar de nuevo. Tampoco eleva el asunto a su superior; la remisión es directa al órgano que considera competente."
  citation: "art. 14.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-14
- id: m03-l03-q022
  prompt:
    es: "Según el artículo 14.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué pueden hacer los interesados que sean parte si creen que el órgano que conoce del asunto no es competente?"
  options:
  - id: a
    text:
      es: "Interponer recurso de alzada contra el acuerdo de iniciación dictado por ese órgano."
  - id: b
    text:
      es: "Plantear un conflicto de atribuciones entre los dos órganos ante el Consejo de Ministros."
  - id: c
    text:
      es: "Pedir la suspensión del procedimiento hasta que dictamine el Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Pedir a ese órgano que decline su competencia y remita las actuaciones al competente."
  explanation:
    es: "El artículo 14.2 LRJSP permite a los interesados «dirigirse al órgano que se encuentre conociendo de un asunto para que decline su competencia y remita las actuaciones al órgano competente», o al que estimen competente para que requiera de inhibición. El artículo no les da un recurso de alzada contra la iniciación, ni un conflicto de atribuciones ante el Consejo de Ministros, ni una suspensión pendiente de dictamen del Consejo de Estado."
  citation: "art. 14.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-14
- id: m03-l03-q023
  prompt:
    es: "De acuerdo con el artículo 14.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los interesados que sean parte en el procedimiento podrán dirigirse al órgano que estimen competente para que:"
  options:
  - id: a
    correct: true
    text:
      es: "requiera de inhibición al órgano que esté conociendo del asunto."
  - id: b
    text:
      es: "avoque para sí el conocimiento del asunto que tramita el otro órgano."
  - id: c
    text:
      es: "declare la nulidad de lo actuado por el órgano que conoce del asunto."
  - id: d
    text:
      es: "delegue en el órgano que conoce del asunto la competencia para resolverlo."
  explanation:
    es: "El artículo 14.2 LRJSP dice que los interesados «podrán dirigirse al órgano que estimen competente para que requiera de inhibición al que esté conociendo del asunto». Avocar para sí el asunto es otra figura: según el artículo 10.1, la avocación la ejercen los órganos superiores sobre asuntos de sus órganos dependientes. Declarar la nulidad de lo actuado no figura en las dos peticiones que el artículo 14.2 permite: declinar competencia y requerir de inhibición. Delegar la competencia en el órgano que conoce del asunto no es una de ellas: lo que se pide al órgano que se estima competente es que reclame el asunto."
  citation: "art. 14.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-17
- id: m03-l03-q025
  prompt:
    es: "Según el artículo 17.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué asistencia se requiere para la válida constitución de un órgano colegiado a efectos de sesiones, deliberaciones y acuerdos?"
  options:
  - id: a
    text:
      es: "La de la mayoría absoluta de los miembros, sin que se compute para ello la del Secretario."
  - id: b
    correct: true
    text:
      es: "La del Presidente y el Secretario, o sus suplentes, y la de la mitad, al menos, de los miembros."
  - id: c
    text:
      es: "La del Presidente o de quien le supla y la de la totalidad de los miembros del órgano."
  - id: d
    text:
      es: "La del Presidente y el Secretario y la de un tercio de los miembros en primera convocatoria."
  explanation:
    es: "El artículo 17.2 LRJSP exige «la asistencia, presencial o a distancia, del Presidente y Secretario o en su caso, de quienes les suplan, y la de la mitad, al menos, de sus miembros». El Secretario siempre cuenta, así que no basta una mayoría sin él. La totalidad de los miembros solo hace falta para constituirse sin convocatoria previa. Un tercio no es la proporción de la ley."
  citation: "art. 17.2 LRJSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2015-10566-art-17
- id: m03-l03-q027
  prompt:
    es: "Según el artículo 17.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, podrá ser objeto de deliberación o acuerdo un asunto que no figure en el orden del día si:"
  options:
  - id: a
    correct: true
    text:
      es: "asisten todos los miembros y se declara la urgencia por el voto favorable de la mayoría."
  - id: b
    text:
      es: "asiste la mayoría de los miembros y se declara la urgencia del asunto por unanimidad."
  - id: c
    text:
      es: "asisten todos los miembros y se declara la urgencia del asunto por unanimidad."
  - id: d
    text:
      es: "el Presidente declara la urgencia del asunto al comienzo de la sesión, sin votación."
  explanation:
    es: "El artículo 17.4 LRJSP lo permite si «asistan todos los miembros del órgano colegiado y sea declarada la urgencia del asunto por el voto favorable de la mayoría». Hace falta la asistencia de todos, no de la mayoría. La urgencia se vota por mayoría, no por unanimidad. El Presidente no puede declararla solo."
  citation: "art. 17.4 LRJSP"
  difficulty: 1
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-2015-10566-art-17
- id: m03-l03-q028
  prompt:
    es: "A una sesión de un órgano colegiado falta uno de sus miembros y se propone tratar un asunto urgente fuera del orden del día. ¿Puede tratarse según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Sí, si la mayoría de los asistentes declara la urgencia del asunto."
  - id: b
    text:
      es: "Sí, si lo autoriza el Presidente con su voto de calidad."
  - id: c
    correct: true
    text:
      es: "No, porque para ello deben asistir todos los miembros del órgano."
  - id: d
    text:
      es: "Sí, si los asistentes declaran la urgencia por unanimidad."
  explanation:
    es: "Un asunto fuera del orden del día solo se trata si «asistan todos los miembros del órgano colegiado» y la mayoría declara la urgencia (artículo 17.4 LRJSP). Falta un miembro, así que no se cumple la primera condición. Ninguna votación de los asistentes la suple, ni por mayoría ni por unanimidad, y el voto de calidad del Presidente no sirve para esto."
  citation: "art. 17.4 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-17
- id: m03-l03-q029
  prompt:
    es: "En la votación de un acuerdo de un órgano colegiado de la Administración General del Estado, uno de sus miembros se abstiene. ¿Responde de lo que pueda derivarse del acuerdo?"
  options:
  - id: a
    text:
      es: "Sí, porque solo quedan exentos los miembros que votan en contra del acuerdo."
  - id: b
    correct: true
    text:
      es: "No, porque quienes se abstienen quedan exentos de esa responsabilidad."
  - id: c
    text:
      es: "Sí, salvo que explique su abstención en un voto particular por escrito."
  - id: d
    text:
      es: "Sí, en la misma medida que los miembros que votaron a favor del acuerdo."
  explanation:
    es: "El artículo 17.6 LRJSP dice: «Cuando los miembros del órgano voten en contra o se abstengan, quedarán exentos de la responsabilidad que, en su caso, pueda derivarse de los acuerdos». Abstenerse tiene el mismo efecto que votar en contra, así que la exención no se limita a los votos en contra. No depende de un voto particular escrito. Quien se abstiene no queda en la posición de quien votó a favor."
  citation: "art. 17.6 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
