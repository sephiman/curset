# anchor: boe-a-1978-31229-art-1
- id: m01-l02-q016
  prompt:
    es: "De acuerdo con el artículo 1.3 de la Constitución Española de 1978, en relación con la forma política del Estado español:"
  options:
  - id: a
    text:
      es: "La forma política del Estado español es la Monarquía constitucional."
  - id: b
    text:
      es: "La forma política del Estado español es la Monarquía democrática."
  - id: c
    correct: true
    text:
      es: "La forma política del Estado español es la Monarquía parlamentaria."
  - id: d
    text:
      es: "La forma política del Estado español es la Monarquía parlamentaria y federal."
  explanation:
    es: "El artículo 1.3 dice: «La forma política del Estado español es la Monarquía parlamentaria». «Constitucional» y «democrática» cambian el adjetivo que el apartado fija; el artículo 1.1 usa «democrático» para el Estado de Derecho, no para la Monarquía. «Parlamentaria y federal» añade un segundo adjetivo a una frase que solo lleva uno."
  citation: "art. 1.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q018
  prompt:
    es: "De acuerdo con el artículo 56.1 de la Constitución Española de 1978, en relación con las instituciones del Estado, el Rey:"
  options:
  - id: a
    text:
      es: "Dirige y coordina el funcionamiento regular de las instituciones."
  - id: b
    text:
      es: "Arbitra y modera el funcionamiento regular de las Cortes Generales."
  - id: c
    text:
      es: "Garantiza y controla el funcionamiento regular de los poderes públicos."
  - id: d
    correct: true
    text:
      es: "Arbitra y modera el funcionamiento regular de las instituciones."
  explanation:
    es: "El artículo 56.1 dice que el Rey «arbitra y modera el funcionamiento regular de las instituciones». «Dirige y coordina» cambia los verbos: dirigir no es función del Rey en ese artículo. Limitar la función a las Cortes Generales también es incorrecto: el texto habla de las instituciones en general. «Garantiza y controla» cambia los verbos y el objeto."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q019
  prompt:
    es: "¿Con qué naciones asume el Rey especialmente la más alta representación del Estado español en las relaciones internacionales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Con los Estados miembros de la Unión Europea."
  - id: b
    correct: true
    text:
      es: "Con las naciones de su comunidad histórica."
  - id: c
    text:
      es: "Con los Estados vecinos de la cuenca mediterránea."
  - id: d
    text:
      es: "Con los Estados con los que España haya celebrado tratados."
  explanation:
    es: "El artículo 56.1 dice que el Rey asume la más alta representación del Estado en las relaciones internacionales, «especialmente con las naciones de su comunidad histórica». La Unión Europea, la cuenca mediterránea y los Estados con tratados con España son otros ámbitos: el texto reserva el «especialmente» a una sola categoría, la comunidad histórica, y no a un grupo definido por pertenencia a una organización, por vecindad geográfica o por haber firmado tratados."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q021
  prompt:
    es: "Señale la respuesta correcta sobre la persona del Rey, de acuerdo con el título II de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Es inviolable, salvo por los delitos cometidos fuera del ejercicio de sus funciones."
  - id: b
    text:
      es: "Goza de inmunidad y solo puede ser juzgada por el Tribunal Supremo."
  - id: c
    text:
      es: "Es inviolable y responde de sus actos ante las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "Es inviolable y no está sujeta a responsabilidad."
  explanation:
    es: "El artículo 56.3 dice: «La persona del Rey es inviolable y no está sujeta a responsabilidad». La inviolabilidad no tiene en el texto ninguna excepción por delitos. La Constitución no habla de inmunidad ni de un fuero ante el Tribunal Supremo para el Rey. Tampoco responde ante las Cortes: de sus actos responden quienes los refrendan (art. 64.2)."
  citation: "art. 56.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q022
  prompt:
    es: "Según el artículo 56.3 de la Constitución Española de 1978, ¿qué consecuencia tiene que un acto del Rey no esté refrendado, salvo lo dispuesto en el artículo 65.2?"
  options:
  - id: a
    correct: true
    text:
      es: "El acto carece de validez sin dicho refrendo."
  - id: b
    text:
      es: "El acto es válido, pero el Rey asume su responsabilidad."
  - id: c
    text:
      es: "El acto es anulable a instancia del Gobierno."
  - id: d
    text:
      es: "El acto es válido si lo convalidan las Cortes Generales."
  explanation:
    es: "El artículo 56.3 dice que los actos del Rey estarán siempre refrendados, «careciendo de validez sin dicho refrendo, salvo lo dispuesto en el artículo 65, 2». Un acto sin refrendo no es válido: queda descartado que sea válido con responsabilidad del Rey, porque el mismo apartado dice que su persona «es inviolable y no está sujeta a responsabilidad». Tampoco es anulable a instancia del Gobierno ni válido si lo convalidan las Cortes: el artículo lo declara sin validez, y no deja ese efecto en manos de ningún órgano."
  citation: "art. 56.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q026
  prompt:
    es: "El artículo 56.3 de la Constitución Española de 1978 exime del refrendo lo dispuesto en el artículo 65.2. ¿Qué actos del Rey regula este último?"
  options:
  - id: a
    text:
      es: "La distribución de la cantidad global que recibe para su Familia y Casa."
  - id: b
    correct: true
    text:
      es: "El nombramiento y relevo de los miembros civiles y militares de su Casa."
  - id: c
    text:
      es: "La concesión de honores y distinciones con arreglo a las leyes."
  - id: d
    text:
      es: "El Alto Patronazgo de las Reales Academias."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». La distribución de la cantidad global está en el artículo 65.1, no en el 65.2. Los honores y distinciones (art. 62.f) y el Alto Patronazgo (art. 62.j) son funciones del artículo 62."
  citation: "art. 65.2 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q027
  prompt:
    es: "¿Quién nombra y releva a los miembros civiles y militares de la Casa del Rey, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Rey, a propuesta del Presidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "El Rey, que los nombra y releva libremente."
  - id: c
    text:
      es: "El Gobierno, a propuesta del Jefe de la Casa del Rey."
  - id: d
    text:
      es: "El Rey, a propuesta del Consejo de Ministros."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». No hay propuesta del Presidente del Gobierno ni del Consejo de Ministros. El Gobierno no nombra a esos miembros."
  citation: "art. 65.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q070
  prompt:
    es: "De acuerdo con el artículo 64.1 de la Constitución Española de 1978, fuera de la propuesta y el nombramiento del Presidente del Gobierno y la disolución prevista en el artículo 99, los actos del Rey serán refrendados:"
  options:
  - id: a
    text:
      es: "Por el Presidente del Gobierno y, en su caso, por el Consejo de Ministros."
  - id: b
    text:
      es: "Por el Presidente del Congreso y, en su caso, por los Ministros competentes."
  - id: c
    text:
      es: "Por los Ministros competentes y, en su caso, por el Presidente del Senado."
  - id: d
    correct: true
    text:
      es: "Por el Presidente del Gobierno y, en su caso, por los Ministros competentes."
  explanation:
    es: "El artículo 64.1 dice: «Los actos del Rey serán refrendados por el Presidente del Gobierno y, en su caso, por los Ministros competentes». El refrendo es de personas, que son las que responden (art. 64.2); el Consejo de Ministros, órgano colegiado, no refrenda. El Presidente del Congreso refrenda solo los tres actos que el enunciado aparta, no los demás. El Presidente del Senado no refrenda ningún acto del Rey. Aparte queda el nombramiento y relevo de los miembros de su Casa, que el artículo 56.3 exime de refrendo (art. 65.2)."
  citation: "art. 64.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q124
  prompt:
    es: "Según la Constitución Española de 1978, el Rey es el Jefe del Estado y símbolo, en los términos que emplea el propio texto constitucional:"
  options:
  - id: a
    text:
      es: "De su soberanía e independencia."
  - id: b
    correct: true
    text:
      es: "De su unidad y permanencia."
  - id: c
    text:
      es: "De su continuidad y neutralidad."
  - id: d
    text:
      es: "De su integridad y legitimidad democrática."
  explanation:
    es: "El artículo 56.1 llama al Rey «símbolo de su unidad y permanencia». Soberanía, independencia, continuidad, neutralidad, integridad y legitimidad son palabras próximas, pero ninguna de esas parejas aparece en el artículo."
  citation: "art. 56.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q125
  prompt:
    es: "¿Cuál de las siguientes funciones asume el Rey en el ámbito de las relaciones internacionales, conforme al artículo 56.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La dirección de la política exterior del Estado."
  - id: b
    correct: true
    text:
      es: "La más alta representación del Estado español."
  - id: c
    text:
      es: "La negociación de los tratados."
  - id: d
    text:
      es: "La designación de los embajadores sin refrendo alguno."
  explanation:
    es: "El artículo 56.1 dice que asume «la más alta representación del Estado español en las relaciones internacionales». No dirige la política exterior ni negocia tratados: según el artículo 63 solo acredita a los embajadores y manifiesta el consentimiento del Estado, y sus actos requieren refrendo."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q126
  prompt:
    es: "Según la Constitución Española de 1978, las funciones que el Rey ejerce como Jefe del Estado son las que le atribuyen expresamente:"
  options:
  - id: a
    text:
      es: "La Constitución y los decretos del Gobierno."
  - id: b
    text:
      es: "La Constitución y la tradición histórica de la Corona."
  - id: c
    text:
      es: "Las Cortes Generales en cada sucesión."
  - id: d
    correct: true
    text:
      es: "La Constitución y las leyes."
  explanation:
    es: "El artículo 56.1 dice que «ejerce las funciones que le atribuyen expresamente la Constitución y las leyes». Ni los decretos del Gobierno ni la tradición histórica ni una decisión de las Cortes en cada sucesión le atribuyen funciones."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q127
  prompt:
    es: "Según la Constitución Española de 1978, el título del Rey es el de Rey de España y, además de este, podrá utilizar:"
  options:
  - id: a
    correct: true
    text:
      es: "Los demás títulos que correspondan a la Corona."
  - id: b
    text:
      es: "Los que le atribuyan las Cortes Generales en cada sucesión."
  - id: c
    text:
      es: "Los que fije el Gobierno por real decreto."
  - id: d
    text:
      es: "Ninguno más, salvo el de Jefe del Estado."
  explanation:
    es: "El artículo 56.2 dice que «podrá utilizar los demás que correspondan a la Corona». Los títulos no los atribuyen las Cortes ni los fija el Gobierno, y la regla no los limita al de Jefe del Estado."
  citation: "art. 56.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q128
  prompt:
    es: "¿Quién refrenda la disolución de las Cortes Generales prevista en el artículo 99 de la Constitución Española de 1978, de acuerdo con las reglas sobre el refrendo de los actos del Rey?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "El Presidente del Senado."
  - id: c
    correct: true
    text:
      es: "El Presidente del Congreso."
  - id: d
    text:
      es: "El Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  explanation:
    es: "El artículo 64.1 dice que «la disolución prevista en el artículo 99» la refrenda el Presidente del Congreso. Los demás actos los refrenda el Presidente del Gobierno y, en su caso, los Ministros competentes. El Presidente del Senado no refrenda ningún acto del Rey."
  citation: "art. 64.1 CE"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q129
  prompt:
    es: "¿Cuál de los siguientes actos del Rey refrenda el Presidente del Congreso, de acuerdo con el artículo 64.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El nombramiento de los demás Ministros."
  - id: b
    correct: true
    text:
      es: "El nombramiento del Presidente del Gobierno."
  - id: c
    text:
      es: "La sanción de las leyes aprobadas por las Cortes Generales."
  - id: d
    text:
      es: "La expedición de los decretos acordados en el Consejo de Ministros."
  explanation:
    es: "El artículo 64.1 atribuye al Presidente del Congreso el refrendo de tres actos: la propuesta y el nombramiento del Presidente del Gobierno y la disolución del artículo 99. El nombramiento de los demás Ministros, la sanción de leyes y la expedición de decretos los refrenda el Presidente del Gobierno o los Ministros competentes."
  citation: "art. 64.1 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q130
  prompt:
    es: "Según el artículo 64.2 de la Constitución Española de 1978, dado que la persona del Rey es inviolable, de los actos del Rey son responsables:"
  options:
  - id: a
    text:
      es: "El propio Rey."
  - id: b
    text:
      es: "El Consejo de Ministros en pleno, en todos los casos."
  - id: c
    text:
      es: "El Presidente del Tribunal Constitucional."
  - id: d
    correct: true
    text:
      es: "Las personas que los refrenden."
  explanation:
    es: "El artículo 64.2 dice que «serán responsables las personas que los refrenden». El Rey no responde por ser inviolable (artículo 56.3), no siempre intervienen todos los Ministros y el Tribunal Constitucional no refrenda."
  citation: "art. 64.2 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q131
  prompt:
    es: "Respecto al sostenimiento de su Familia y Casa, el artículo 65.1 de la Constitución Española de 1978 establece que el Rey recibe una cantidad global:"
  options:
  - id: a
    text:
      es: "Del patrimonio de la Corona, y la distribuye con arreglo a las leyes."
  - id: b
    text:
      es: "De una asignación del Gobierno fijada cada legislatura, que distribuye el Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "De los Presupuestos del Estado, y la distribuye libremente."
  - id: d
    text:
      es: "De las Comunidades Autónomas, y la distribuye con refrendo del Presidente del Gobierno."
  explanation:
    es: "El artículo 65.1 dice que el Rey recibe «de los Presupuestos del Estado una cantidad global» y la distribuye libremente. No procede del patrimonio de la Corona ni de las Comunidades Autónomas, y la distribución no corresponde al Consejo de Ministros ni requiere refrendo."
  citation: "art. 65.1 CE"
  difficulty: 3
  tags:
  - "concepto"
  - "competencia"
