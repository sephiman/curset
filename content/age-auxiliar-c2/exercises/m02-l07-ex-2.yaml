# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q243
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+Flecha izquierda, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Sube un nivel en la ruta de acceso de la carpeta"
  - id: b
    text:
      es: "Va a la carpeta siguiente"
  - id: c
    correct: true
    text:
      es: "Va a la carpeta anterior"
  - id: d
    text:
      es: "Selecciona la barra de direcciones"
  explanation:
    es: "Alt+Flecha izquierda va a la carpeta anterior. Subir un nivel en la ruta es Alt+Flecha arriba, ver la carpeta siguiente es Alt+Flecha derecha y seleccionar la barra de direcciones es Alt+D."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
