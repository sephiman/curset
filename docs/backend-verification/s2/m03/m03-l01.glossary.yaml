- id: g-heap-dump
  term:
    en: heap dump
  definition:
    en: The most important data to troubleshoot memory leaks; it can be collected using jcmd, jmap, JConsole tools, and the -XX:+HeapDumpOnOutOfMemoryError Java option.
  origin: m03-l01
  citation: jdk-troubleshoot-memleaks#JSTGD-GUID-4B841E7E-C533-447B-B093-58CEE13B962A
- id: g-thread-dump
  term:
    en: thread dump
  definition:
    en: The thread stack, including the thread state, for all Java threads in the virtual machine. It does not terminate the application.
  origin: m03-l01
  citation: jdk-troubleshoot-tools#JSTGD-GUID-489BB790-A7C7-4CF0-9A6B-63FA12230238
- id: g-memory-leak
  term:
    en: memory leak
  definition:
    en: A memory leak occurs when an application unintentionally holds references to Java objects or classes, preventing them from being garbage collected.
  origin: m03-l01
  citation: jdk-troubleshoot-memleaks#JSTGD-GUID-2A57EA14-3A39-4E6D-90FA-95788A9C3605
- id: g-live-set
  term:
    en: live set
  definition:
    en: The amount of Java heap space or Metaspace being used after a full garbage collection.
  origin: m03-l01
  citation: jdk-troubleshoot-memleaks#JSTGD-GUID-2A57EA14-3A39-4E6D-90FA-95788A9C3605
- id: g-metaspace
  term:
    en: Metaspace
  definition:
    en: Native memory in which Java class metadata is allocated.
  origin: m03-l01
  citation: jdk-troubleshoot-memleaks#JSTGD-GUID-19F6D28E-75A1-4480-9879-D0932B2F305B
- id: g-tlab
  term:
    en: TLAB
  definition:
    en: A small memory area where new objects are allocated. Once a TLAB is full, the thread gets a new one.
  origin: m03-l01
  citation: jdk-troubleshoot-jfr#JSTGD-GUID-3839D694-F0F7-4E43-93BE-3BF13F4D2102
- id: g-ahead-of-time-cache
  term:
    en: AOT cache
  definition:
    en: A container, introduced in JDK 24, for storing artifacts produced by ahead-of-time optimizations.
  origin: m03-l01
  citation: jdk-tool-java#ahead-of-time-cache
- id: g-closed-world-assumption
  term:
    en: closed-world assumption
  definition:
    en: The constraint that once a native image is built, no new elements can be added at run time, for example through class loading.
  origin: m03-l01
  citation: graalvm-native-image-basics#static-analysis
