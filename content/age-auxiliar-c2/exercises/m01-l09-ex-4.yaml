# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q045
  prompt:
    es: "De acuerdo con el artículo 153 de la Constitución Española de 1978, el control del ejercicio de funciones delegadas en las Comunidades Autónomas por ley orgánica del Estado se ejercerá:"
  options:
  - id: a
    text:
      es: "Por el Tribunal Constitucional, previo requerimiento del Gobierno."
  - id: b
    text:
      es: "Por el Tribunal de Cuentas, previo informe de las Cortes Generales."
  - id: c
    text:
      es: "Por la jurisdicción contencioso-administrativa, a instancia del Gobierno."
  - id: d
    correct: true
    text:
      es: "Por el Gobierno, previo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 153.b) atribuye «al Gobierno, previo dictamen del Consejo de Estado», el control «del ejercicio de funciones delegadas a que se refiere el apartado 2 del artículo 150». El Tribunal Constitucional controla las normas con fuerza de ley. El Tribunal de Cuentas, lo económico y presupuestario. La jurisdicción contencioso-administrativa, la administración autónoma y sus reglamentos."
  citation: "art. 153.b) CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q046
  prompt:
    es: "Señale la respuesta correcta sobre el control que ejerce el Tribunal Constitucional sobre la actividad de los órganos de las Comunidades Autónomas, según la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Controla la constitucionalidad de sus disposiciones normativas con fuerza de ley."
  - id: b
    text:
      es: "Controla la administración autónoma y sus normas reglamentarias."
  - id: c
    text:
      es: "Controla la actividad económica y presupuestaria de la Comunidad Autónoma."
  - id: d
    text:
      es: "Controla el ejercicio de las funciones delegadas por el Estado."
  explanation:
    es: "El artículo 153.a) atribuye al Tribunal Constitucional el control «relativo a la constitucionalidad de sus disposiciones normativas con fuerza de ley». La administración autónoma y sus reglamentos los controla la jurisdicción contencioso-administrativa. Lo económico y presupuestario, el Tribunal de Cuentas. Las funciones delegadas, el Gobierno previo dictamen del Consejo de Estado."
  citation: "art. 153.a) CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q048
  prompt:
    es: "De acuerdo con el artículo 155.1 de la Constitución Española de 1978, antes de adoptar las medidas necesarias para obligar a una Comunidad Autónoma al cumplimiento forzoso de sus obligaciones, el Gobierno dirige un requerimiento:"
  options:
  - id: a
    text:
      es: "A la Asamblea Legislativa de la Comunidad Autónoma."
  - id: b
    correct: true
    text:
      es: "Al Presidente de la Comunidad Autónoma."
  - id: c
    text:
      es: "Al Consejo de Gobierno de la Comunidad Autónoma."
  - id: d
    text:
      es: "Al Tribunal Superior de Justicia de la Comunidad Autónoma."
  explanation:
    es: "El artículo 155.1 exige «previo requerimiento al Presidente de la Comunidad Autónoma». El requerimiento no se dirige a la Asamblea, al Consejo de Gobierno ni al Tribunal Superior de Justicia."
  citation: "art. 155.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q049
  prompt:
    es: "Si el Presidente de la Comunidad Autónoma no atiende el requerimiento del Gobierno, ¿quién debe aprobar las medidas para obligarla al cumplimiento forzoso de sus obligaciones?"
  options:
  - id: a
    text:
      es: "El Congreso de los Diputados, por mayoría absoluta."
  - id: b
    text:
      es: "El Senado, por mayoría de dos tercios."
  - id: c
    text:
      es: "Las Cortes Generales, en sesión conjunta, por mayoría simple."
  - id: d
    correct: true
    text:
      es: "El Senado, por mayoría absoluta."
  explanation:
    es: "El artículo 155.1 exige, si el requerimiento no es atendido, «la aprobación por mayoría absoluta del Senado». No aprueba el Congreso ni las Cortes en sesión conjunta. La mayoría es absoluta, no de dos tercios."
  citation: "art. 155.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q057
  prompt:
    es: "Para ejecutar las medidas aprobadas frente a una Comunidad Autónoma que incumple sus obligaciones constitucionales, ¿a quién podrá dar instrucciones el Gobierno de la Nación?"
  options:
  - id: a
    correct: true
    text:
      es: "A todas las autoridades de las Comunidades Autónomas."
  - id: b
    text:
      es: "Solo al Presidente de la Comunidad Autónoma, que es quien recibió el requerimiento previo."
  - id: c
    text:
      es: "A las autoridades autonómicas que designe el Tribunal Constitucional a petición del Senado."
  - id: d
    text:
      es: "A los Delegados del Gobierno, que las trasladarán a las autoridades autonómicas tras oír al Consejo de Estado."
  explanation:
    es: "El artículo 155.2 dice: «Para la ejecución de las medidas previstas en el apartado anterior, el Gobierno podrá dar instrucciones a todas las autoridades de las Comunidades Autónomas». El requerimiento previo va al Presidente (art. 155.1), pero las instrucciones no se limitan a él. El Tribunal Constitucional no designa a sus destinatarios. El artículo no las hace pasar por los Delegados del Gobierno ni exige oír al Consejo de Estado."
  citation: "art. 155.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q130
  prompt:
    es: "¿Cuál de los siguientes órganos o jurisdicciones controla la administración autónoma y sus normas reglamentarias, conforme al artículo 153 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Tribunal Constitucional."
  - id: b
    text:
      es: "El Tribunal de Cuentas."
  - id: c
    text:
      es: "El Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "La jurisdicción contencioso-administrativa."
  explanation:
    es: "El artículo 153.c) atribuye a la jurisdicción contencioso-administrativa el control de la administración autónoma y de sus normas reglamentarias. El Tribunal Constitucional controla las disposiciones normativas con fuerza de ley. El Tribunal de Cuentas ejerce el control económico y presupuestario. El Consejo de Estado emite el dictamen previo cuando el Gobierno controla las funciones delegadas."
  citation: "art. 153.c) CE"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q131
  prompt:
    es: "Según el artículo 153 de la Constitución Española de 1978, el control económico y presupuestario de la actividad de los órganos de las Comunidades Autónomas se ejerce:"
  options:
  - id: a
    correct: true
    text:
      es: "Por el Tribunal de Cuentas."
  - id: b
    text:
      es: "Por el Tribunal Constitucional."
  - id: c
    text:
      es: "Por el Gobierno, previo dictamen del Consejo de Estado."
  - id: d
    text:
      es: "Por la jurisdicción contencioso-administrativa."
  explanation:
    es: "El control económico y presupuestario corresponde al Tribunal de Cuentas. El Tribunal Constitucional controla la constitucionalidad de las disposiciones con fuerza de ley. El Gobierno, previo dictamen del Consejo de Estado, controla las funciones delegadas por ley orgánica. La jurisdicción contencioso-administrativa controla la administración autónoma y sus normas reglamentarias."
  citation: "art. 153.d) CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-141
- id: m01-l09-q060
  prompt:
    es: "Según el artículo 141.2 de la Constitución Española de 1978, el gobierno y la administración autónoma de las provincias estarán encomendados:"
  options:
  - id: a
    correct: true
    text:
      es: "A Diputaciones u otras Corporaciones de carácter representativo."
  - id: b
    text:
      es: "A las Diputaciones Provinciales, con exclusión de cualquier otra Corporación."
  - id: c
    text:
      es: "A las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "A los Consejos de Gobierno de las Comunidades Autónomas."
  explanation:
    es: "El artículo 141.2 CE encomienda el gobierno y la administración autónoma de las provincias «a Diputaciones u otras Corporaciones de carácter representativo». La Constitución admite otras Corporaciones, así que la exclusión es falsa. Las Delegaciones del Gobierno y los Consejos de Gobierno autonómicos no son órganos de la provincia."
  citation: "art. 141.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-140
- id: m01-l09-q062
  prompt:
    es: "De acuerdo con el artículo 140 de la Constitución Española de 1978, el gobierno y la administración de los municipios corresponde:"
  options:
  - id: a
    text:
      es: "A sus respectivos Plenos, integrados por los Concejales y presididos por el Alcalde."
  - id: b
    correct: true
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales."
  - id: c
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Tenientes de Alcalde."
  - id: d
    text:
      es: "A las Diputaciones Provinciales, integradas por los Presidentes y los Diputados."
  explanation:
    es: "El artículo 140 CE dice que el gobierno y la administración de los municipios «corresponde a sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales». El Pleno es un órgano del Ayuntamiento, no el titular de su gobierno. Los Tenientes de Alcalde no sustituyen a los Concejales en esa fórmula. La Diputación gobierna la provincia, no el municipio."
  citation: "art. 140 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1978-31229-art-137
- id: m01-l09-q064
  prompt:
    es: "Según el artículo 137 de la Constitución Española de 1978, los municipios, las provincias y las Comunidades Autónomas que se constituyan:"
  options:
  - id: a
    text:
      es: "Gozan de soberanía para la gestión de sus respectivos intereses."
  - id: b
    text:
      es: "Gozan de autonomía para la gestión de los intereses generales del Estado."
  - id: c
    text:
      es: "Gozan de autonomía política y legislativa en sus respectivos territorios."
  - id: d
    correct: true
    text:
      es: "Gozan de autonomía para la gestión de sus respectivos intereses."
  explanation:
    es: "El artículo 137 CE dice que todas estas entidades «gozan de autonomía para la gestión de sus respectivos intereses». La soberanía no es de ellas. La autonomía se refiere a sus propios intereses, no a los generales del Estado. El artículo no atribuye potestad legislativa a municipios ni a provincias."
  citation: "art. 137 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-141
- id: m01-l09-q122
  prompt:
    es: "Según el artículo 141.1 de la Constitución Española de 1978, cualquier alteración de los límites provinciales habrá de ser aprobada por:"
  options:
  - id: a
    text:
      es: "El Gobierno mediante Real Decreto del Consejo de Ministros."
  - id: b
    text:
      es: "Las Diputaciones de las provincias afectadas por acuerdo de sus Plenos."
  - id: c
    text:
      es: "Las Comunidades Autónomas afectadas mediante ley autonómica."
  - id: d
    correct: true
    text:
      es: "Las Cortes Generales mediante ley orgánica."
  explanation:
    es: "Los límites provinciales los altera una ley orgánica de las Cortes Generales, según el artículo 141.1. El Gobierno por Real Decreto no tiene esa competencia. Las Diputaciones gobiernan cada provincia, pero no deciden sobre sus límites. Las Comunidades Autónomas tampoco: sus leyes no pueden modificar la división provincial."
  citation: "art. 141.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-141
- id: m01-l09-q123
  prompt:
    es: "Conforme al artículo 141.4 de la Constitución Española de 1978, en los archipiélagos las islas tendrán además su administración propia en forma de:"
  options:
  - id: a
    correct: true
    text:
      es: "Cabildos o Consejos."
  - id: b
    text:
      es: "Diputaciones o Mancomunidades."
  - id: c
    text:
      es: "Comarcas o Áreas Metropolitanas."
  - id: d
    text:
      es: "Ayuntamientos o Concejos Abiertos."
  explanation:
    es: "Los Cabildos o Consejos son la administración propia de las islas en los archipiélagos, según el artículo 141.4. Las Diputaciones gobiernan las provincias. Las Mancomunidades, las Comarcas y las Áreas Metropolitanas son otras entidades locales que no sustituyen a la isla. Los Ayuntamientos gobiernan los municipios, y el Concejo Abierto es un régimen municipal."
  citation: "art. 141.4 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-140
- id: m01-l09-q133
  prompt:
    es: "De acuerdo con el artículo 140 de la Constitución Española de 1978, la ley regulará las condiciones en las que proceda:"
  options:
  - id: a
    text:
      es: "La fusión de municipios limítrofes."
  - id: b
    text:
      es: "La creación de mancomunidades de municipios."
  - id: c
    correct: true
    text:
      es: "El régimen del concejo abierto."
  - id: d
    text:
      es: "La disolución de los Ayuntamientos."
  explanation:
    es: "El artículo 140 remite a la ley la regulación de las condiciones en que proceda el régimen del concejo abierto. La fusión de municipios, las mancomunidades y la disolución de los Ayuntamientos no figuran en ese artículo."
  citation: "art. 140 CE"
  difficulty: 2
  tags:
  - "concepto"
