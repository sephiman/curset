# anchor: boe-a-2015-10565-art-118
- id: m02-l05-q0017
  prompt:
    es: "Señale el plazo para alegar sobre nuevos hechos o documentos al resolver un recurso, según el artículo 118.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "No inferior a cinco días ni superior a diez."
  - id: b
    text:
      es: "No inferior a quince días ni superior a veinte."
  - id: c
    correct: true
    text:
      es: "No inferior a diez días ni superior a quince."
  - id: d
    text:
      es: "No inferior a veinte días ni superior a treinta."
  explanation:
    es: "El artículo 118.1 da a los interesados un plazo no inferior a diez días ni superior a quince para alegar y presentar documentos sobre los nuevos hechos o documentos. Las horquillas de cinco a diez días, de quince a veinte y de veinte a treinta no son la que fija este apartado."
  citation: "art. 118.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-112
- id: m02-l05-q0039
  prompt:
    es: "Según el artículo 112.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra las disposiciones administrativas de carácter general:"
  options:
  - id: a
    text:
      es: "Cabrá únicamente el recurso de alzada ante el órgano superior jerárquico."
  - id: b
    text:
      es: "Cabrá únicamente el recurso potestativo de reposición ante el mismo órgano."
  - id: c
    text:
      es: "Cabrán el recurso de alzada o el de reposición, a elección del interesado."
  - id: d
    correct: true
    text:
      es: "No cabrá recurso en vía administrativa."
  explanation:
    es: "El artículo 112.3 dice que contra las disposiciones administrativas de carácter general no cabe recurso en vía administrativa. Por eso no procede ni la alzada ante el superior jerárquico ni la reposición ante el mismo órgano, ni se deja elegir entre ambas: la impugnación de la disposición se hace directamente en la vía judicial."
  citation: "art. 112.3 LPAC"
  difficulty: 1
  tags:
  - "disposiciones generales"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0041
  prompt:
    es: "De acuerdo con el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ponen fin a la vía administrativa las resoluciones de los órganos administrativos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Carezcan de superior jerárquico, salvo que una Ley establezca lo contrario."
  - id: b
    text:
      es: "Tengan superior jerárquico, salvo que una Ley establezca lo contrario."
  - id: c
    text:
      es: "Carezcan de superior jerárquico, salvo que un reglamento establezca lo contrario."
  - id: d
    text:
      es: "Carezcan de superior jerárquico, sin que ninguna norma pueda establecer lo contrario."
  explanation:
    es: "El artículo 114.1.c) incluye las resoluciones de los órganos que carecen de superior jerárquico, y admite que una Ley disponga otra cosa. La versión que se refiere a los órganos que sí tienen superior jerárquico invierte el requisito. La que permite la excepción por reglamento cambia el rango exigido, que es el de Ley, y la que la excluye por completo ignora la salvedad que el propio precepto recoge."
  citation: "art. 114.1.c) LPAC"
  difficulty: 1
  tags:
  - "fin de la vía administrativa"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0042
  prompt:
    es: "Señale la respuesta CORRECTA sobre la resolución de los procedimientos de responsabilidad patrimonial, de acuerdo con el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Pone fin a la vía administrativa solo si deriva de una relación de naturaleza pública."
  - id: b
    text:
      es: "No pone fin a la vía administrativa, y contra ella cabe recurso de alzada."
  - id: c
    correct: true
    text:
      es: "Pone fin a la vía administrativa, cualquiera que sea el tipo de relación, pública o privada, de la que derive."
  - id: d
    text:
      es: "Pone fin a la vía administrativa solo cuando la dicta un Ministro o un Secretario de Estado."
  explanation:
    es: "El artículo 114.1.e) incluye entre los actos que ponen fin a la vía administrativa la resolución de los procedimientos de responsabilidad patrimonial, sin distinguir si la relación de la que deriva es pública o privada. Limitarlo a las relaciones públicas añade una condición inexistente, y exigir que la dicte un Ministro o un Secretario de Estado confunde esta letra con el artículo 114.2.b). Que no ponga fin a la vía y quepa alzada contradice el texto."
  citation: "art. 114.1.e) LPAC"
  difficulty: 2
  tags:
  - "fin de la vía administrativa"
  - "responsabilidad patrimonial"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0043
  prompt:
    es: "De acuerdo con el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la resolución de un recurso de alzada, cualquiera que sea el órgano que la dicte:"
  options:
  - id: a
    text:
      es: "Deja abierta la vía administrativa y cabe interponer un segundo recurso de alzada."
  - id: b
    correct: true
    text:
      es: "Pone fin a la vía administrativa."
  - id: c
    text:
      es: "Deja abierta la vía administrativa hasta que se resuelva un recurso de reposición."
  - id: d
    text:
      es: "Pone fin a la vía administrativa solo si el Subsecretario carece de superior jerárquico."
  explanation:
    es: "Las resoluciones de los recursos de alzada ponen fin a la vía administrativa (art. 114.1.a), sin que importe quién las dicte. Por eso no queda abierta la vía ni cabe un segundo recurso de alzada: contra la resolución de la alzada solo cabe, en los casos del artículo 125.1, el extraordinario de revisión (art. 122.3). Tampoco depende de que el Subsecretario carezca de superior jerárquico, requisito que es el de otra letra del mismo apartado, la c)."
  citation: "art. 114.1.a) LPAC"
  difficulty: 1
  tags:
  - "fin de la vía administrativa"
  - "alzada"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0044
  prompt:
    es: "Conforme al artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el ámbito estatal ponen fin a la vía administrativa:"
  options:
  - id: a
    text:
      es: "Los actos de los órganos directivos con nivel de Director general o superior, en materia de contratación."
  - id: b
    text:
      es: "Los actos de los órganos directivos con nivel de Subdirector general o superior, en materia de personal."
  - id: c
    correct: true
    text:
      es: "Los actos de los órganos directivos con nivel de Director general o superior, en materia de personal."
  - id: d
    text:
      es: "Los actos de los órganos directivos con nivel de Director general o superior, en cualquier materia."
  explanation:
    es: "El artículo 114.2.c) cubre los actos de los órganos directivos con nivel de Director general o superior, y solo en relación con las competencias que tengan atribuidas en materia de personal. Cambiar la materia a la contratación o extenderla a cualquiera rompe esa limitación, y bajar el nivel a Subdirector general lo aparta del que exige el precepto."
  citation: "art. 114.2.c) LPAC"
  difficulty: 2
  tags:
  - "fin de la vía administrativa"
  - "ámbito estatal"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0045
  prompt:
    es: "Señale la respuesta CORRECTA sobre los organismos públicos vinculados o dependientes de la Administración General del Estado, de acuerdo con el artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Ponen fin a la vía administrativa solo los actos de sus máximos órganos de dirección unipersonales, según sus estatutos."
  - id: b
    text:
      es: "Ponen fin a la vía administrativa los actos de sus máximos órganos de dirección, salvo que por reglamento se establezca otra cosa."
  - id: c
    text:
      es: "Ponen fin a la vía administrativa los actos de cualquiera de sus órganos directivos, según lo que establezca el Ministro de adscripción."
  - id: d
    correct: true
    text:
      es: "Ponen fin a la vía administrativa los actos de sus máximos órganos de dirección, unipersonales o colegiados, según sus estatutos, salvo que por ley se establezca otra cosa."
  explanation:
    es: "Según el artículo 114.2.d), en estos organismos ponen fin a la vía los actos de los máximos órganos de dirección, sean unipersonales o colegiados, de acuerdo con lo que digan sus estatutos y salvo que una ley disponga otra cosa. Limitar la regla a los unipersonales excluye los colegiados, que el texto incluye expresamente. Admitir que un reglamento lo cambie sustituye el rango de ley por otro inferior, y atribuir la decisión al Ministro de adscripción o a cualquier órgano directivo no está en el precepto: remite a los estatutos."
  citation: "art. 114.2.d) LPAC"
  difficulty: 3
  tags:
  - "fin de la vía administrativa"
  - "organismos públicos"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0046
  prompt:
    es: "Conforme al artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el ámbito estatal, una resolución de un Secretario de Estado dictada en el ejercicio de las competencias atribuidas al órgano del que es titular:"
  options:
  - id: a
    correct: true
    text:
      es: "Pone fin a la vía administrativa, por tratarse del ámbito estatal."
  - id: b
    text:
      es: "No pone fin a la vía administrativa, y cabe recurso de alzada ante el Ministro."
  - id: c
    text:
      es: "Pone fin a la vía administrativa solo si el Ministro la confirma expresamente."
  - id: d
    text:
      es: "No pone fin a la vía administrativa hasta que transcurra un mes sin que se recurra."
  explanation:
    es: "El artículo 114.2.b) incluye los actos de los Ministros y de los Secretarios de Estado en el ejercicio de las competencias de los órganos de los que son titulares entre los que ponen fin a la vía administrativa en el ámbito estatal. Por eso no cabe alzada ante el Ministro, no hace falta que este los confirme y no es necesario esperar a que transcurra el plazo de recurso para que la vía quede agotada."
  citation: "art. 114.2.b) LPAC"
  difficulty: 2
  tags:
  - "fin de la vía administrativa"
  - "ámbito estatal"
# anchor: boe-a-2015-10565-art-115
- id: m02-l05-q0047
  prompt:
    es: "Según el artículo 115.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el recurrente califica erróneamente su recurso, por ejemplo como de alzada cuando procedería la reposición, ese error:"
  options:
  - id: a
    text:
      es: "Obliga a inadmitir el recurso y a presentar otro con la calificación correcta."
  - id: b
    correct: true
    text:
      es: "No impide la tramitación del recurso, siempre que se deduzca su verdadero carácter."
  - id: c
    text:
      es: "Obliga a tramitarlo como recurso de alzada, aunque se deduzca otro carácter."
  - id: d
    text:
      es: "Obliga al órgano a archivarlo si el interesado no lo recalifica en el plazo de un mes."
  explanation:
    es: "El artículo 115.2 dispone que el error en la calificación del recurso no es obstáculo para su tramitación mientras se deduzca su verdadero carácter, de modo que el escrito se tramita como la reposición que realmente es. El error no figura entre las causas de inadmisión del artículo 116, no obliga a tramitarlo con el nombre equivocado y la ley no prevé requerimiento de recalificación con archivo si no se atiende."
  citation: "art. 115.2 LPAC"
  difficulty: 2
  tags:
  - "calificación del recurso"
# anchor: boe-a-2015-10565-art-116
- id: m02-l05-q0048
  prompt:
    es: "Según el artículo 116 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre con un recurso interpuesto ante un órgano de la Administración General del Estado cuando la competencia para resolverlo corresponde a una Comunidad Autónoma?"
  options:
  - id: a
    correct: true
    text:
      es: "Es causa de inadmisión, y el recurso debe remitirse al órgano competente."
  - id: b
    text:
      es: "No es causa de inadmisión, y el órgano incompetente debe resolver el recurso."
  - id: c
    text:
      es: "Es causa de inadmisión, y el recurso se archiva sin remitirlo a ningún otro órgano."
  - id: d
    text:
      es: "No es causa de inadmisión, y el recurso se remite al superior jerárquico del órgano incompetente."
  explanation:
    es: "Ser incompetente el órgano, cuando el competente pertenece a otra Administración Pública, es causa de inadmisión según el artículo 116.a), y el mismo apartado ordena remitir el recurso al órgano competente. Por tanto ni lo resuelve el incompetente ni se archiva sin remisión, y el destino no es el superior jerárquico del órgano incompetente, sino el órgano que tiene la competencia."
  citation: "art. 116 LPAC"
  difficulty: 2
  tags:
  - "causas de inadmisión"
  - "competencia"
# anchor: boe-a-2015-10565-art-116
- id: m02-l05-q0049
  prompt:
    es: "Señale la respuesta CORRECTA sobre las causas de inadmisión de los recursos administrativos, de acuerdo con el artículo 116 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Carecer el recurso de fundamento es causa de inadmisión aunque no lo sea de forma manifiesta."
  - id: b
    text:
      es: "Ser incompetente el órgano es causa de inadmisión aunque el competente pertenezca a la misma Administración."
  - id: c
    text:
      es: "Carecer de legitimación el recurrente determina la desestimación del recurso y no su inadmisión."
  - id: d
    correct: true
    text:
      es: "Haber transcurrido el plazo para la interposición del recurso es causa de inadmisión."
  explanation:
    es: "El artículo 116.d) incluye haber transcurrido el plazo de interposición entre las causas de inadmisión. La falta de fundamento solo lo es si es manifiesta (116.e), la incompetencia del órgano lo es cuando el competente pertenece a otra Administración Pública (116.a), y la falta de legitimación del recurrente figura como causa de inadmisión (116.b), no de desestimación."
  citation: "art. 116 LPAC"
  difficulty: 2
  tags:
  - "causas de inadmisión"
# anchor: boe-a-2015-10565-art-116
- id: m02-l05-q0050
  prompt:
    es: "¿Cuál de las siguientes es una causa de inadmisión de los recursos administrativos, según el artículo 116 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Haber solicitado el recurrente la suspensión de la ejecución del acto."
  - id: b
    text:
      es: "Tener el recurrente un interés legítimo en el asunto."
  - id: c
    correct: true
    text:
      es: "Carecer el recurso manifiestamente de fundamento."
  - id: d
    text:
      es: "Ser el acto recurrido de trámite y decidir el fondo del asunto."
  explanation:
    es: "Carecer el recurso manifiestamente de fundamento es la causa del artículo 116.e). Pedir la suspensión de la ejecución no figura en la lista cerrada del precepto, que se limita a cinco causas. Tener un interés legítimo es lo contrario de carecer de legitimación (116.b). Un acto de trámite que decide el fondo del asunto es susceptible de recurso (art. 112.1), de modo que no entra en la causa del 116.c)."
  citation: "art. 116 LPAC"
  difficulty: 1
  tags:
  - "causas de inadmisión"
# anchor: boe-a-2015-10565-art-116
- id: m02-l05-q0051
  prompt:
    es: "Don Álvaro Beltrán recibe la notificación de una resolución expresa y, dos meses después de recibirla, interpone contra ella recurso de alzada. Conforme al artículo 116 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo debe tratar el órgano competente ese recurso?"
  options:
  - id: a
    text:
      es: "Debe inadmitirlo, por carecer manifiestamente de fundamento."
  - id: b
    text:
      es: "Debe inadmitirlo, por carecer de legitimación el recurrente."
  - id: c
    text:
      es: "Debe tramitarlo, porque el plazo de interposición no es causa de inadmisión."
  - id: d
    correct: true
    text:
      es: "Debe inadmitirlo, por haber transcurrido el plazo para interponerlo."
  explanation:
    es: "El plazo de la alzada contra un acto expreso es de un mes (art. 122.1) y el recurso se interpone a los dos, de modo que concurre la causa del artículo 116.d): haber transcurrido el plazo para la interposición. No es la falta de fundamento, que debe ser manifiesta, ni la falta de legitimación, de la que el enunciado no da dato alguno, y el transcurso del plazo sí figura entre las causas de inadmisión."
  citation: "art. 116 LPAC"
  difficulty: 2
  tags:
  - "causas de inadmisión"
  - "alzada"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0098
  prompt:
    es: "Señale la respuesta CORRECTA sobre los acuerdos, pactos, convenios o contratos que tengan la consideración de finalizadores del procedimiento, de acuerdo con el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Ponen fin a la vía administrativa."
  - id: b
    text:
      es: "Ponen fin a la vía administrativa solo si los suscribe un Ministro."
  - id: c
    text:
      es: "No ponen fin a la vía administrativa, y contra ellos cabe recurso de alzada."
  - id: d
    text:
      es: "Ponen fin a la vía administrativa solo si una ley así lo establece."
  explanation:
    es: "El artículo 114.1.d) incluye sin condiciones los acuerdos, pactos, convenios o contratos con carácter de finalizadores del procedimiento entre los actos que ponen fin a la vía administrativa. No se exige que los suscriba un Ministro (esa es la letra b del apartado 2), ni que lo diga una ley expresa, ni caben contra ellos alzada, que se dirige contra actos que no ponen fin a la vía."
  citation: "art. 114.1.d) LPAC"
  difficulty: 2
  tags:
  - "fin de la vía administrativa"
# anchor: boe-a-2015-10565-art-114
- id: m02-l05-q0099
  prompt:
    es: "Conforme al artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ponen fin a la vía administrativa las demás resoluciones de órganos administrativos cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Una disposición legal o reglamentaria así lo establezca."
  - id: b
    text:
      es: "Una disposición legal así lo establezca, sin que baste un reglamento."
  - id: c
    text:
      es: "El órgano que las dicta lo declare en la propia resolución."
  - id: d
    text:
      es: "El interesado lo solicite en el recurso que interponga."
  explanation:
    es: "La letra g) del artículo 114.1 deja abierta la lista a las demás resoluciones cuando una disposición legal o reglamentaria así lo establezca. Por eso basta un reglamento, no depende de lo que declare el órgano autor ni de lo que pida el interesado."
  citation: "art. 114.1.g) LPAC"
  difficulty: 1
  tags:
  - "fin de la vía administrativa"
# anchor: boe-a-2015-10565-art-116
- id: m02-l05-q0102
  prompt:
    es: "Según el artículo 116 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe acordar el órgano ante un recurso de alzada interpuesto por un ciudadano que no era parte ni tiene derecho o interés legítimo alguno afectado?"
  options:
  - id: a
    text:
      es: "La desestimación del recurso por el fondo, por carecer de legitimación el recurrente."
  - id: b
    text:
      es: "La inadmisión del recurso, por ser incompetente el órgano ante el que se interpuso."
  - id: c
    text:
      es: "La estimación del recurso, porque la ley permite recurrir a cualquier ciudadano."
  - id: d
    correct: true
    text:
      es: "La inadmisión del recurso, por carecer de legitimación el recurrente."
  explanation:
    es: "Carecer de legitimación el recurrente es una de las causas de inadmisión del artículo 116.b), y el supuesto describe a alguien sin interés alguno en el procedimiento. La falta de legitimación no da lugar a una desestimación sobre el fondo. El enunciado no plantea ningún problema de competencia del órgano, y el artículo no permite recurrir a cualquier persona."
  citation: "art. 116 LPAC"
  difficulty: 2
  tags:
  - "causas de inadmisión"
  - "legitimación"
# anchor: boe-a-2015-10565-art-118
- id: m02-l05-q0103
  prompt:
    es: "De acuerdo con el artículo 118.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, al resolver un recurso administrativo, los hechos o documentos se ponen de manifiesto a los interesados para que formulen alegaciones cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Hayan de tenerse en cuenta nuevos hechos o documentos no recogidos en el expediente originario."
  - id: b
    text:
      es: "Se hayan interpuesto varios recursos contra un mismo acto administrativo."
  - id: c
    text:
      es: "El recurrente lo solicite expresamente en el escrito de interposición del recurso."
  - id: d
    text:
      es: "Hayan de tenerse en cuenta el propio recurso, los informes y las propuestas del expediente."
  explanation:
    es: "El trámite de alegaciones del artículo 118.1 se abre cuando han de tenerse en cuenta nuevos hechos o documentos que no constan en el expediente originario. No lo provoca la pluralidad de recursos (que regula el art. 120) ni la mera petición del recurrente. El recurso, los informes y las propuestas no tienen carácter de documentos nuevos a estos efectos."
  citation: "art. 118.1 LPAC"
  difficulty: 2
  tags:
  - "alegaciones"
