template: |
  public class Main {
      static String describe(Object o) {
          return switch (o) {
              case Integer i when i > @@limit@@ -> "big " + i;
              case Integer i -> "int " + i;
              case String s when s.length() > @@len@@ -> "long " + s;
              case String s -> "text " + s;
              default -> "other";
          };
      }

      public static void main(String[] args) {
          System.out.println(describe(@@a@@));
          System.out.println(describe(@@b@@));
          System.out.println(describe(@@c@@));
          System.out.println(describe(@@d@@));
      }
  }
explanation: A pattern `switch` chooses the first case label that applies to the value, and a label with a `when` guard applies only while its guard is true. @@why@@ The program prints @@key@@.
mistakes:
- name: ignoring the `Integer` guard, so the first `Integer` label always wins
  replace:
  - |-
    case @@ifocus@@ i when i > @@limit@@ -> "big " + i;
                case Integer i -> "int " + i;
  - case Integer i -> "big " + i;
  why: A guard refines its pattern, so the first `Integer` label does not apply to an `Integer` that fails `i > @@limit@@`.
- name: reading the `Integer` guard `i > @@limit@@` as its opposite
  replace:
  - '@@ifocus@@ i when i > @@limit@@'
  - Integer i when i <= @@limit@@
  why: The guard `i > @@limit@@` is true for values above `@@limit@@` only, and a label applies only while its guard is true.
- name: sending an `Integer` that fails its guard to `default`
  replace:
  - |2
                case @@ifocus@@ i -> "int " + i;
  - ''
  why: A failed guard only skips that label, and the next label that applies is chosen, here the unguarded `Integer` label before `default`.
- name: reading `i > @@limit@@` as `i >= @@limit@@`
  replace:
  - '@@ifocus@@ i when i > @@limit@@'
  - Integer i when i >= @@limit@@
  why: The guard `i > @@limit@@` is false for exactly `@@limit@@`, so such an `Integer` reaches the second `Integer` label.
- name: ignoring the `String` guard, so the first `String` label always wins
  replace:
  - |-
    case @@sfocus@@ s when s.length() > @@len@@ -> "long " + s;
                case String s -> "text " + s;
  - case String s -> "long " + s;
  why: A guard refines its pattern, so the first `String` label does not apply to a `String` that fails `s.length() > @@len@@`.
- name: reading the `String` guard `s.length() > @@len@@` as its opposite
  replace:
  - '@@sfocus@@ s when s.length() > @@len@@'
  - String s when s.length() <= @@len@@
  why: The guard `s.length() > @@len@@` is true for longer strings only, and a label applies only while its guard is true.
- name: sending a `String` that fails its guard to `default`
  replace:
  - |2
                case @@sfocus@@ s -> "text " + s;
  - ''
  why: A failed guard only skips that label, and the next label that applies is chosen, here the unguarded `String` label before `default`.
- name: reading `s.length() > @@len@@` as `s.length() >= @@len@@`
  replace:
  - '@@sfocus@@ s when s.length() > @@len@@'
  - String s when s.length() >= @@len@@
  why: The guard `s.length() > @@len@@` is false for a length of exactly `@@len@@`, so such a `String` reaches the second `String` label.
