# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0199
  prompt:
    es: "Según el artículo 135.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la normativa propia del tributo lo prevea, el interesado puede reservarse el derecho a promover la tasación pericial contradictoria si estima que la notificación no contiene expresión suficiente de los datos y motivos, y denunciará esa omisión en:"
  options:
  - id: a
    text:
      es: "un escrito de alegaciones dirigido al órgano que dictó la liquidación de que se trate."
  - id: b
    correct: true
    text:
      es: "un recurso de reposición o en una reclamación económico-administrativa."
  - id: c
    text:
      es: "un recurso de alzada ante el superior jerárquico del órgano actuante."
  - id: d
    text:
      es: "una solicitud de rectificación presentada ante el órgano competente."
  explanation:
    es: "La reserva del derecho se acompaña de la denuncia de la omisión en un recurso de reposición o en una reclamación económico-administrativa (art. 135.1). Las alegaciones, el recurso de alzada y la solicitud de rectificación no son el cauce que prevé."
  citation: "art. 135.1 LGT"
  difficulty: 2
  tags:
  - "tasación pericial"
  - "reserva del derecho"
# anchor: boe-a-2003-23186-art-57
- id: m03-l07-q0200
  prompt:
    es: "Según el artículo 57.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué valor puede tomar la Administración como medio de comprobación respecto de los bienes que tengan contratado un seguro?"
  options:
  - id: a
    text:
      es: "El valor de mercado que el tomador declare a la aseguradora al contratar la cobertura del bien."
  - id: b
    text:
      es: "El importe de las primas satisfechas por el obligado durante los últimos cuatro ejercicios."
  - id: c
    text:
      es: "El valor de reposición que fije la aseguradora tras un siniestro ocurrido en el ejercicio."
  - id: d
    correct: true
    text:
      es: "El valor asignado a los bienes en las pólizas de contratos de seguros."
  explanation:
    es: "La letra f) del artículo 57.1 recoge el valor asignado a los bienes en las pólizas de contratos de seguros. El valor de reposición tras un siniestro, las primas pagadas y el valor que declara el tomador no están entre los medios del precepto."
  citation: "art. 57.1 LGT"
  difficulty: 1
  tags:
  - "comprobación de valores"
  - "medios"
