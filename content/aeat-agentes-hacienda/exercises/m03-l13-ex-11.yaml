    es: "Con ocasión de una inspección, Bodegas Rueda, S.L. suscribe un acta de conformidad y se le impone una sanción reducida un 30 por ciento. La sociedad interpone reclamación económico-administrativa solo contra la sanción, y no contra la regularización. Según el artículo 212.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿pierde la reducción por conformidad?"
