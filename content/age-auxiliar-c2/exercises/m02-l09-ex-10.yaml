# anchor: fuente-ms-excel-si-anidadas-html
- id: m02-l09-q269
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que significa el cuarto argumento VERDADERO en =BUSCARV(B9;B2:C6;2;VERDADERO)?"
  options:
  - id: a
    text:
      es: "Busca una coincidencia exacta y no exige que la tabla esté ordenada de ninguna manera"
  - id: b
    text:
      es: "Busca en la fila superior de la matriz"
  - id: c
    text:
      es: "Devuelve VERDADERO si el valor existe"
  - id: d
    correct: true
    text:
      es: "Busca una coincidencia aproximada y exige la tabla ordenada de menor a mayor"
  explanation:
    es: "La página dice que VERDADERO indica coincidencia aproximada, que hace coincidir valores exactos y los comprendidos entre ellos, y que la tabla debe ordenarse de menor a mayor. «Busca una coincidencia exacta y no exige que la tabla esté ordenada de ninguna manera»: VERDADERO indica coincidencia aproximada, para la que la tabla debe estar ordenada. «Devuelve VERDADERO si el valor existe»: el argumento no cambia el tipo de resultado, que es un valor de la tabla. «Busca en la fila superior de la matriz»: esa es la tarea de BUSCARH."
  citation: "fuente: `ms-excel-si-anidadas.html`; «Ejemplos adicionales»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-contara-html
