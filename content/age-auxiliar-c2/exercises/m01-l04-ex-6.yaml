# anchor: boe-a-1988-29622-art-2
- id: m01-l04-q122
  prompt:
    es: "Según el artículo 2.5 de la Ley 38/1988, de 28 de diciembre, de Demarcación y de Planta Judicial, a efectos de la demarcación judicial las ciudades de Ceuta y Melilla quedan integradas en la circunscripción de:"
  options:
  - id: a
    text:
      es: "El Tribunal Superior de Justicia de la Región de Murcia."
  - id: b
    text:
      es: "El Tribunal Superior de Justicia de Madrid."
  - id: c
    text:
      es: "El Tribunal Superior de Justicia de Canarias."
  - id: d
    correct: true
    text:
      es: "El Tribunal Superior de Justicia de Andalucía."
  explanation:
    es: "El artículo 2.5 integra a Ceuta y Melilla «en la circunscripción territorial del Tribunal Superior de Justicia de Andalucía». Murcia, Madrid y Canarias no son su circunscripción."
  citation: "art. 2.5 Ley 38/1988"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-12666-art-80
- id: m01-l04-q123
  prompt:
    es: "Las Audiencias Provinciales tienen su sede en la capital de la provincia, de la que toman su nombre, y extienden su jurisdicción a:"
  options:
  - id: a
    correct: true
    text:
      es: "Toda la provincia."
  - id: b
    text:
      es: "Toda la Comunidad Autónoma en que se encuentran."
  - id: c
    text:
      es: "Solo el partido judicial de la capital."
  - id: d
    text:
      es: "Todo el territorio nacional."
  explanation:
    es: "El artículo 80.1 dice que «extenderán su jurisdicción a toda ella», es decir, a toda la provincia de la que toman su nombre. La Comunidad Autónoma es el ámbito del Tribunal Superior de Justicia, el partido judicial el del Tribunal de Instancia y el territorio nacional el del Supremo y la Audiencia Nacional."
  citation: "art. 80.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "estructura"
# anchor: boe-a-1985-12666-art-81
- id: m01-l04-q124
  prompt:
    es: "Según el artículo 81.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, las Audiencias Provinciales se componen de un Presidente y de:"
  options:
  - id: a
    text:
      es: "Cuatro o más magistrados."
  - id: b
    text:
      es: "Un magistrado por cada partido judicial."
  - id: c
    correct: true
    text:
      es: "Dos o más magistrados."
  - id: d
    text:
      es: "Seis magistrados, divididos en dos Salas."
  explanation:
    es: "El artículo 81.1 dice «un Presidente y dos o más magistrados». Cuatro o más es la composición que algunas Secciones pueden tener, no la general. Las otras dos opciones no figuran en la ley."
  citation: "art. 81.1 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q125
  prompt:
    es: "Conforme al artículo 84.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, habrá un Tribunal de Instancia en cada partido judicial, con sede en:"
  options:
  - id: a
    text:
      es: "La capital de la provincia respectiva."
  - id: b
    text:
      es: "La capital de la Comunidad Autónoma."
  - id: c
    correct: true
    text:
      es: "Su capital, de la que tomará su nombre."
  - id: d
    text:
      es: "La villa de Madrid."
  explanation:
    es: "El artículo 84.1 sitúa la sede «en su capital», la del partido judicial, «de la que tomará su nombre». La capital de la provincia es la sede de la Audiencia Provincial, la de la Comunidad Autónoma es la de los Tribunales Superiores y Madrid es la sede del Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia."
  citation: "art. 84.1 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q126
  prompt:
    es: "De acuerdo con el artículo 84.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, con carácter general los Tribunales de Instancia están integrados por una:"
  options:
  - id: a
    text:
      es: "Sección Única, de lo Penal y de lo Social."
  - id: b
    text:
      es: "Sección de Familia, Infancia y Capacidad exclusivamente."
  - id: c
    text:
      es: "Sala de lo Civil y otra de lo Penal."
  - id: d
    correct: true
    text:
      es: "Sección Única, de Civil y de Instrucción."
  explanation:
    es: "El artículo 84.2 dice que estarán integrados «por una Sección Única, de Civil y de Instrucción». Una Sección de lo Penal y de lo Social no es la básica, la de Familia es una de las que se pueden añadir y los Tribunales de Instancia no se dividen en Salas."
  citation: "art. 84.2 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
  - "composición"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q127
  prompt:
    es: "En los supuestos determinados por la Ley 38/1988, de Demarcación y de Planta Judicial, el artículo 84.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial integra el Tribunal de Instancia por:"
  options:
  - id: a
    text:
      es: "Una Sección Única de lo Civil y lo Mercantil."
  - id: b
    correct: true
    text:
      es: "Una Sección Civil y otra Sección de Instrucción."
  - id: c
    text:
      es: "Dos Secciones de lo Penal."
  - id: d
    text:
      es: "Una Sección de Familia y otra de Menores."
  explanation:
    es: "En esos supuestos el artículo 84.2 integra el Tribunal «por una Sección Civil y otra Sección de Instrucción». Una Sección Única de Civil y Mercantil, dos de lo Penal o una de Familia y otra de Menores no son esa composición."
  citation: "art. 84.2 LOPJ"
  difficulty: 3
  tags:
  - "estructura"
  - "excepción"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q128
  prompt:
    es: "¿Cuál de las siguientes Secciones puede integrar un Tribunal de Instancia, además de la básica, según el artículo 84.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "La de Violencia contra la Infancia y la Adolescencia."
  - id: b
    text:
      es: "La de Apelación."
  - id: c
    text:
      es: "La de lo Militar."
  - id: d
    text:
      es: "La de Extranjería."
  explanation:
    es: "El artículo 84.2 enumera, entre las Secciones que puede tener un Tribunal de Instancia, la de Violencia contra la Infancia y la Adolescencia. La de Apelación es una Sala de la Audiencia Nacional, y las de lo Militar y de Extranjería no figuran en la lista."
  citation: "art. 84.2 LOPJ"
  difficulty: 3
  tags:
  - "estructura"
  - "composición"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q129
  prompt:
    es: "En cada partido judicial hay un Tribunal de Instancia, con sede en su capital, y cada uno de esos Tribunales de Instancia contará con:"
  options:
  - id: a
    text:
      es: "Una Presidencia por cada Sección."
  - id: b
    text:
      es: "Una Junta de Gobierno presidida por el Decano."
  - id: c
    text:
      es: "Dos Vicepresidencias nombradas por el Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "Una Presidencia."
  explanation:
    es: "El artículo 84.3 dice «cada Tribunal de Instancia contará con una Presidencia». Las Secciones solo tienen una Presidencia de Sección cuando concurren las condiciones de ese artículo. La Junta presidida por el Decano y las Vicepresidencias no se prevén."
  citation: "art. 84.3 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-12666-art-95
- id: m01-l04-q130
  prompt:
    es: "Conforme al artículo 95 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Tribunal Central de Instancia tiene su sede y su jurisdicción en:"
  options:
  - id: a
    correct: true
    text:
      es: "La villa de Madrid y todo el territorio nacional."
  - id: b
    text:
      es: "La villa de Madrid y la Comunidad de Madrid."
  - id: c
    text:
      es: "Cada capital de provincia y su provincia."
  - id: d
    text:
      es: "La sede de cada Tribunal Superior de Justicia y su Comunidad Autónoma."
  explanation:
    es: "El artículo 95 lo sitúa «en la Villa de Madrid y con jurisdicción en todo el territorio nacional». Limitarlo a la Comunidad de Madrid, a cada provincia o a cada Comunidad lo confunde con la Audiencia Provincial o el Tribunal Superior."
  citation: "art. 95 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
  - "competencia"
# anchor: boe-a-1985-12666-art-95
- id: m01-l04-q131
  prompt:
    es: "¿Cuál de las siguientes Secciones NO forma parte del Tribunal Central de Instancia, según el artículo 95 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Sección de Instrucción."
  - id: b
    correct: true
    text:
      es: "La Sección de lo Social."
  - id: c
    text:
      es: "La Sección de Menores."
  - id: d
    text:
      es: "La Sección de lo Contencioso-Administrativo."
  explanation:
    es: "El artículo 95 da al Tribunal Central de Instancia las Secciones de Instrucción, de lo Penal, de Menores, de Vigilancia Penitenciaria y de lo Contencioso-Administrativo. La de lo Social no está."
  citation: "art. 95 LOPJ"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2025-76-dt-primera
- id: m01-l04-q132
  prompt:
    es: "¿En qué fecha se transformaron en Secciones del Tribunal de Instancia los Juzgados de Primera Instancia e Instrucción y de Violencia sobre la Mujer de los partidos sin otro tipo de Juzgados?"
  options:
  - id: a
    text:
      es: "El 1 de octubre de 2025."
  - id: b
    text:
      es: "El 31 de diciembre de 2025."
  - id: c
    correct: true
    text:
      es: "El 1 de julio de 2025."
  - id: d
    text:
      es: "El 2 de enero de 2025."
  explanation:
    es: "La disposición transitoria primera señala «el día 1 de julio de 2025» para los Juzgados de Primera Instancia e Instrucción y los de Violencia sobre la Mujer en los partidos donde no existía otro tipo de Juzgados. El 1 de octubre y el 31 de diciembre son las fechas de otras dos fases de la transformación. El 2 de enero de 2025 es la fecha de la propia ley orgánica."
  citation: "disposición transitoria primera LO 1/2025"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2025-76-dt-primera
- id: m01-l04-q133
  prompt:
    es: "Conforme a la disposición transitoria primera de la Ley Orgánica 1/2025, de 2 de enero, en la segunda fase los Juzgados de Primera Instancia, de Instrucción y de Violencia sobre la Mujer se transformaron en Secciones el:"
  options:
  - id: a
    text:
      es: "1 de julio de 2025."
  - id: b
    correct: true
    text:
      es: "1 de octubre de 2025."
  - id: c
    text:
      es: "31 de diciembre de 2025."
  - id: d
    text:
      es: "1 de enero de 2026."
  explanation:
    es: "La disposición señala «el día 1 de octubre de 2025» para los Juzgados de Primera Instancia, de Instrucción y de Violencia sobre la Mujer separados en partidos donde no existía otro tipo de Juzgados. El 1 de julio y el 31 de diciembre son las fechas de otras dos fases, y el 1 de enero de 2026 no es fecha de ninguna fase."
  citation: "disposición transitoria primera LO 1/2025"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2025-76-dt-segunda
- id: m01-l04-q134
  prompt:
    es: "De acuerdo con la disposición transitoria segunda de la Ley Orgánica 1/2025, de 2 de enero, el Tribunal Central de Instancia se constituyó, por transformación de los Juzgados Centrales, el:"
  options:
  - id: a
    text:
      es: "1 de julio de 2025."
  - id: b
    text:
      es: "1 de octubre de 2025."
  - id: c
    text:
      es: "2 de enero de 2026."
  - id: d
    correct: true
    text:
      es: "31 de diciembre de 2025."
  explanation:
    es: "La disposición transitoria segunda dice «el día 31 de diciembre de 2025, el Tribunal Central de Instancia se constituirá a través de la transformación de los actuales Juzgados Centrales». El 1 de julio y el 1 de octubre son las dos primeras fases de los Tribunales de Instancia, y el 2 de enero de 2026 no es ninguna fecha de constitución."
  citation: "disposición transitoria segunda LO 1/2025"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-1985-12666-art-99
- id: m01-l04-q135
  prompt:
    es: "¿Qué órgano judicial hay en cada municipio donde no existe Tribunal de Instancia y tiene jurisdicción en el término correspondiente?"
  options:
  - id: a
    text:
      es: "Un Juzgado de Primera Instancia."
  - id: b
    text:
      es: "Una Sección de Instrucción Única."
  - id: c
    correct: true
    text:
      es: "Un juez o una jueza de paz."
  - id: d
    text:
      es: "Una Audiencia Provincial."
  explanation:
    es: "El artículo 99 dice «habrá un juez o una jueza de paz». Un Juzgado de Primera Instancia y una Sección de Instrucción pertenecen a los Tribunales de Instancia, y la Audiencia Provincial tiene su sede en la capital de la provincia."
  citation: "art. 99 LOPJ"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-12666-art-100
- id: m01-l04-q136
  prompt:
    es: "De acuerdo con el artículo 100.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, en el orden penal los Juzgados de Paz conocen en primera instancia de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los procesos por delito leve que les atribuya la ley."
  - id: b
    text:
      es: "Los procesos por delito grave cometidos en su término."
  - id: c
    text:
      es: "Los delitos menos graves, en todo caso."
  - id: d
    text:
      es: "Las causas contra aforados del municipio."
  explanation:
    es: "El artículo 100.2 dice «los procesos por delito leve que les atribuya la ley». Los delitos graves y menos graves y las causas contra aforados son de órganos superiores."
  citation: "art. 100.2 LOPJ"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q137
  prompt:
    es: "¿En qué plazo, a contar desde que se produce una vacante en un Juzgado de Paz, debe el Ayuntamiento efectuar la propuesta de nombramiento de Juez de Paz?"
  options:
  - id: a
    text:
      es: "Un plazo de un mes."
  - id: b
    text:
      es: "Un plazo de dos meses."
  - id: c
    text:
      es: "Un plazo de seis meses."
  - id: d
    correct: true
    text:
      es: "Un plazo de tres meses."
  explanation:
    es: "El artículo 101.4 fija «el plazo de tres meses, a contar desde que se produjera la vacante». Un mes, dos y seis no son el plazo de la ley."
  citation: "art. 101.4 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q138
  prompt:
    es: "¿Quién designa al Juez de Paz si el Ayuntamiento no hace la propuesta en el plazo de tres meses desde que se produjo la vacante?"
  options:
  - id: a
    text:
      es: "El Pleno del Ayuntamiento por mayoría simple."
  - id: b
    text:
      es: "El Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "La Sala de Gobierno del Tribunal Superior de Justicia."
  - id: d
    text:
      es: "El Juez de Primera Instancia e Instrucción."
  explanation:
    es: "El artículo 101.4 dice que «la Sala de Gobierno del Tribunal Superior de Justicia procederá a designar al Juez de Paz». El Pleno del Ayuntamiento ya agotó su plazo, el Consejo General del Poder Judicial no interviene y el Juez de Primera Instancia solo eleva el acuerdo."
  citation: "art. 101.4 LOPJ"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-72
- id: m01-l04-q146
  prompt:
    es: "¿Cuál de las siguientes es una de las Salas que integran el Tribunal Superior de Justicia, según el artículo 72.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Sala de Apelación."
  - id: b
    text:
      es: "La Sala de lo Mercantil."
  - id: c
    correct: true
    text:
      es: "La Sala de lo Social."
  - id: d
    text:
      es: "La Sala de lo Militar."
  explanation:
    es: "El artículo 72.1 enumera tres Salas del Tribunal Superior de Justicia: de lo Civil y Penal, de lo Contencioso-Administrativo y de lo Social. La Sala de lo Militar es la quinta del Tribunal Supremo. La Sala de Apelación pertenece a la Audiencia Nacional. De lo Mercantil hay una Sección en los Tribunales de Instancia, no una Sala del Tribunal Superior."
  citation: "art. 72.1 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
  - "composición"
