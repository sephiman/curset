    es: "El 4 de junio de 2026 se notifica a Carpintería Lorca, S.L. una sanción de 6.000 euros. El 20 de junio de 2026 interpone en tiempo y forma reclamación económico-administrativa contra la sanción y no ofrece ninguna garantía. Según el artículo 212.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede la Administración exigirle la sanción en período voluntario mientras no sea firme en vía administrativa?"
  options:
