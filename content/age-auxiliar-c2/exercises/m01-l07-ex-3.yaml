# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q034
  prompt:
    es: "La reclamación ante el Consejo de Transparencia y Buen Gobierno frente a una resolución expresa o presunta en materia de acceso tiene carácter:"
  options:
  - id: a
    text:
      es: "Obligatorio y previo a la impugnación en vía contencioso-administrativa"
  - id: b
    correct: true
    text:
      es: "Potestativo y previo a la impugnación en vía contencioso-administrativa"
  - id: c
    text:
      es: "Potestativo y posterior a la resolución del recurso de alzada"
  - id: d
    text:
      es: "Obligatorio y sustitutivo de la impugnación en vía contencioso-administrativa"
  explanation:
    es: "El artículo 24.1 Ley 19/2013 configura la reclamación «con carácter potestativo y previo a su impugnación en vía contencioso-administrativa». No es obligatoria: las resoluciones pueden recurrirse directamente ante la jurisdicción contencioso-administrativa (art. 20.5). No sigue a un recurso de alzada, porque sustituye a los recursos administrativos (art. 23.1). No sustituye a la vía contencioso-administrativa, sino que la precede."
  citation: "art. 24.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q035
  prompt:
    es: "Según el artículo 24 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿en qué plazo se interpone la reclamación ante el Consejo de Transparencia y Buen Gobierno?"
  options:
  - id: a
    text:
      es: "En tres meses desde el día siguiente a la notificación o a los efectos del silencio"
  - id: b
    correct: true
    text:
      es: "En un mes desde el día siguiente a la notificación o a los efectos del silencio"
  - id: c
    text:
      es: "En dos meses desde el día siguiente a la notificación o a los efectos del silencio"
  - id: d
    text:
      es: "En quince días hábiles desde la notificación del acto o los efectos del silencio"
  explanation:
    es: "El artículo 24.2 fija «el plazo de un mes a contar desde el día siguiente al de la notificación del acto impugnado o desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo». Tres meses es el plazo para resolver la reclamación (art. 24.4), no para interponerla. Dos meses y quince días hábiles no aparecen en el artículo 24."
  citation: "art. 24.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q036
  prompt:
    es: "De acuerdo con el artículo 24 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el plazo máximo para resolver y notificar la reclamación ante el Consejo es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Tres meses, transcurridos los cuales la reclamación se entenderá desestimada"
  - id: b
    text:
      es: "Tres meses, transcurridos los cuales la reclamación se entenderá estimada"
  - id: c
    text:
      es: "Un mes, transcurrido el cual la reclamación se entenderá desestimada"
  - id: d
    text:
      es: "Seis meses, transcurridos los cuales la reclamación se entenderá desestimada"
  explanation:
    es: "El artículo 24.4 dice que el plazo máximo para resolver y notificar «será de tres meses, transcurrido el cual, la reclamación se entenderá desestimada». Con el mismo plazo, el silencio no puede ser estimatorio: el apartado dice «desestimada». Un mes es el plazo para interponer la reclamación, según el artículo 24.2, no el de resolverla. Seis meses duplica el plazo del apartado 4."
  citation: "art. 24.4 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-24
- id: m01-l07-q037
  prompt:
    es: "¿A quién comunica el Presidente del Consejo de Transparencia y Buen Gobierno las resoluciones que dicta sobre las reclamaciones en materia de acceso?"
  options:
  - id: a
    correct: true
    text:
      es: "A la institución del Defensor del Pueblo"
  - id: b
    text:
      es: "A la Comisión Constitucional del Congreso de los Diputados"
  - id: c
    text:
      es: "A la Agencia Española de Protección de Datos"
  - id: d
    text:
      es: "A la Sección de Enjuiciamiento del Tribunal de Cuentas"
  explanation:
    es: "El artículo 24.5 Ley 19/2013 dice que el Presidente del Consejo «comunicará al Defensor del Pueblo las resoluciones que dicte en aplicación de este artículo». La ley no prevé esa comunicación a una comisión del Congreso, a la Agencia Española de Protección de Datos ni al Tribunal de Cuentas."
  citation: "art. 24.5 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2013-12887-art-26
- id: m01-l07-q038
  prompt:
    es: "De acuerdo con el artículo 26 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los obsequios de una mayor relevancia institucional que reciban los altos cargos:"
  options:
  - id: a
    text:
      es: "Podrán aceptarse si el alto cargo los declara ante la Oficina de Conflictos de Intereses"
  - id: b
    correct: true
    text:
      es: "Se incorporarán al patrimonio de la Administración Pública correspondiente"
  - id: c
    text:
      es: "Se devolverán en todo caso a la persona o entidad que los entregó"
  - id: d
    text:
      es: "Se enajenarán y su importe se ingresará en el Tesoro Público"
  explanation:
    es: "El artículo 26.2.b) dice que en el caso de obsequios de una mayor relevancia institucional «se procederá a su incorporación al patrimonio de la Administración Pública correspondiente». La ley no prevé aceptarlos con una declaración, devolverlos ni venderlos."
  citation: "art. 26.2.b) Ley 19/2013"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q039
  prompt:
    es: "¿Cuál de las siguientes es una infracción disciplinaria muy grave del título II de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El abuso de autoridad en el ejercicio del cargo"
  - id: b
    correct: true
    text:
      es: "La prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro"
  - id: c
    text:
      es: "La incorrección con los superiores, compañeros o subordinados"
  - id: d
    text:
      es: "El descuido o negligencia en el ejercicio de sus funciones"
  explanation:
    es: "La letra h) del artículo 29.1 califica de muy grave «la prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro». El abuso de autoridad es infracción grave (art. 29.2.a). La incorrección con superiores, compañeros o subordinados y el descuido o negligencia son infracciones leves (art. 29.3)."
  citation: "art. 29.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q040
  prompt:
    es: "Según el artículo 29 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿cuál de las siguientes conductas de un alto cargo es una infracción grave?"
  options:
  - id: a
    text:
      es: "El incumplimiento del deber de respeto a la Constitución y a los Estatutos de Autonomía en el ejercicio de sus funciones"
  - id: b
    correct: true
    text:
      es: "La intervención en un procedimiento administrativo cuando se dé alguna de las causas de abstención"
  - id: c
    text:
      es: "La incorrección con los superiores, compañeros o subordinados"
  - id: d
    text:
      es: "La prevalencia de la condición de alto cargo para obtener un beneficio indebido"
  explanation:
    es: "La letra b) del artículo 29.2 califica de grave «la intervención en un procedimiento administrativo cuando se dé alguna de las causas de abstención legalmente señaladas». El incumplimiento del deber de respeto a la Constitución y a los Estatutos y la prevalencia de la condición de alto cargo son muy graves (art. 29.1.a) y h). La incorrección con superiores, compañeros o subordinados es leve (art. 29.3.a)."
  citation: "art. 29.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q041
  prompt:
    es: "De acuerdo con el artículo 29 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la comisión de una infracción grave es muy grave cuando el autor hubiera sido sancionado por:"
  options:
  - id: a
    correct: true
    text:
      es: "Dos infracciones graves en el año anterior, contra las que no quepa recurso en vía administrativa"
  - id: b
    text:
      es: "Una infracción grave en el año anterior, contra la que no quepa recurso en vía administrativa"
  - id: c
    text:
      es: "Dos infracciones leves en el año anterior, contra las que no quepa recurso en vía administrativa"
  - id: d
    text:
      es: "Tres infracciones graves a lo largo de los dos años anteriores, aunque quepa recurso administrativo contra ellas"
  explanation:
    es: "La letra l) del artículo 29.1 exige que el autor hubiera sido sancionado «por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa». Una sola infracción grave no basta. Dos leves en el año anterior convierten una leve en grave (art. 29.2.f), no una grave en muy grave. La ley no habla de tres infracciones ni de dos años, y exige que no quepa recurso."
  citation: "art. 29.1.l) Ley 19/2013"
  difficulty: 3
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q042
  prompt:
    es: "De acuerdo con el artículo 30 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el sancionado por infracción muy grave no podrá ser nombrado alto cargo o asimilado durante:"
  options:
  - id: a
    text:
      es: "Un periodo de entre tres y cinco años"
  - id: b
    text:
      es: "Un periodo de entre dos y cuatro años"
  - id: c
    text:
      es: "Un periodo de entre cinco y quince años"
  - id: d
    correct: true
    text:
      es: "Un periodo de entre cinco y diez años"
  explanation:
    es: "El artículo 30.4 dice que los sancionados por infracción muy grave no podrán ser nombrados alto cargo o asimilado «durante un periodo de entre cinco y diez años». Las otras horquillas no aparecen en la ley."
  citation: "art. 30.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-32
- id: m01-l07-q043
  prompt:
    es: "De acuerdo con el artículo 32 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las infracciones de su título II prescriben:"
  options:
  - id: a
    text:
      es: "A los tres años las muy graves, a los dos años las graves y a los seis meses las leves"
  - id: b
    text:
      es: "A los cinco años las muy graves, a los dos años las graves y a los seis meses las leves"
  - id: c
    text:
      es: "A los cuatro años las muy graves, a los dos años las graves y al año las leves"
  - id: d
    correct: true
    text:
      es: "A los cinco años las muy graves, a los tres años las graves y al año las leves"
  explanation:
    es: "El artículo 32.1 fija «cinco años para las infracciones muy graves, tres años para las graves y un año para las leves». Las otras combinaciones cambian uno o varios de esos plazos."
  citation: "art. 32.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-32
- id: m01-l07-q044
  prompt:
    es: "¿En qué plazo prescriben las sanciones impuestas por infracciones graves del título II de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "En el plazo de dos años"
  - id: b
    text:
      es: "En el plazo de cinco años"
  - id: c
    correct: true
    text:
      es: "En el plazo de tres años"
  - id: d
    text:
      es: "En el plazo de un año"
  explanation:
    es: "El artículo 32.2 dice que las sanciones por infracciones muy graves prescriben a los cinco años, las impuestas por infracciones graves «a los tres años» y las de infracciones leves en un año. Cinco años es el plazo de las muy graves y un año el de las leves. Dos años no corresponde a ninguna de las tres categorías del apartado."
  citation: "art. 32.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-33
- id: m01-l07-q045
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Consejo de Transparencia y Buen Gobierno:"
  options:
  - id: a
    text:
      es: "Carece de personalidad jurídica propia y depende jerárquicamente del Ministerio de adscripción"
  - id: b
    text:
      es: "Tiene personalidad jurídica propia, pero actúa bajo la tutela jerárquica del Consejo de Ministros"
  - id: c
    text:
      es: "Es un órgano colegiado de la Presidencia del Gobierno, sin personalidad jurídica propia"
  - id: d
    correct: true
    text:
      es: "Tiene personalidad jurídica propia y plena capacidad de obrar, y actúa con autonomía y plena independencia"
  explanation:
    es: "El artículo 33.2 dice que el Consejo «tiene personalidad jurídica propia y plena capacidad de obrar» y que «actúa con autonomía y plena independencia en el cumplimiento de sus fines». Tiene personalidad jurídica propia. No actúa bajo dependencia ni tutela jerárquica de ningún ministerio ni del Consejo de Ministros."
  citation: "art. 33.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-34
- id: m01-l07-q046
  prompt:
    es: "¿Cuál de los siguientes es uno de los fines del Consejo de Transparencia y Buen Gobierno, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Fiscalizar las cuentas y la gestión económica de todo el sector público"
  - id: b
    text:
      es: "Supervisar el cumplimiento de la normativa general de protección de datos"
  - id: c
    correct: true
    text:
      es: "Garantizar la observancia de las disposiciones de buen gobierno"
  - id: d
    text:
      es: "Evaluar la sostenibilidad de las finanzas de las Administraciones Públicas"
  explanation:
    es: "El artículo 34 enumera como fines del Consejo promover la transparencia, velar por las obligaciones de publicidad, salvaguardar el derecho de acceso y «garantizar la observancia de las disposiciones de buen gobierno». Fiscalizar las cuentas del sector público, supervisar la protección de datos y evaluar la sostenibilidad de las finanzas son funciones de otras instituciones, no fines del Consejo según la ley."
  citation: "art. 34 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
