# anchor: boe-a-2015-10565-art-106
- id: m01-l11-q098
  prompt:
    es: "En la revisión de oficio, según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano competente puede inadmitir a trámite, motivadamente y sin recabar dictamen, la solicitud que:"
  options:
  - id: a
    correct: true
    text:
      es: "carezca de manera manifiesta de fundamento."
  - id: b
    text:
      es: "se presente pasados cuatro años desde que se dictó el acto."
  - id: c
    text:
      es: "no vaya acompañada de informe de la Abogacía del Estado."
  - id: d
    text:
      es: "repita otra desestimada solo por motivos de forma."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite, sin dictamen, las solicitudes que «carezcan manifiestamente de fundamento», que no se basen en una causa del artículo 47.1 o que repitan otras «desestimadas en cuanto al fondo». Pasados cuatro años no es causa: el artículo 106.1 admite la revisión de nulidad «en cualquier momento». El informe de la Abogacía del Estado no es un requisito: el órgano consultivo que interviene es el Consejo de Estado o el equivalente autonómico, según los apartados 1 y 3. La desestimación anterior debe ser «en cuanto al fondo»: si fue por motivos de forma, no hay una solicitud sustancialmente igual ya resuelta."
  citation: "art. 106.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-106
- id: m01-l11-q099
  prompt:
    es: "Se pide la revisión de oficio de un acto y otra solicitud sustancialmente igual ya se desestimó en cuanto al fondo. Según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, el órgano competente puede:"
  options:
  - id: a
    text:
      es: "declarar la nulidad del acto, sin recabar dictamen del Consejo de Estado."
  - id: b
    text:
      es: "inadmitir la solicitud sin motivar, por tratarse de una petición repetida."
  - id: c
    correct: true
    text:
      es: "acordar motivadamente la inadmisión a trámite, sin recabar dictamen del Consejo de Estado."
  - id: d
    text:
      es: "inadmitir la solicitud solo previo dictamen favorable del Consejo de Estado."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite «motivadamente» y «sin necesidad de recabar Dictamen» cuando se hubieran desestimado en cuanto al fondo otras solicitudes sustancialmente iguales. Declarar la nulidad exige dictamen favorable (art. 106.1). La inadmisión tiene que ser motivada, y el dictamen no es previo a ella."
  citation: "art. 106.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-21
- id: m01-l11-q103
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la norma reguladora de un procedimiento sancionador iniciado de oficio no fije el plazo máximo, este será:"
  options:
  - id: a
    text:
      es: "de dos meses, contados desde que el acuerdo de iniciación se notifique al presunto responsable."
  - id: b
    text:
      es: "de un mes, contado desde la fecha de la propuesta de resolución."
  - id: c
    correct: true
    text:
      es: "de tres meses, contados desde la fecha del acuerdo de iniciación."
  - id: d
    text:
      es: "de tres meses, contados desde que concluya la instrucción del procedimiento."
  explanation:
    es: "El artículo 21.3 fija tres meses cuando la norma reguladora no señala plazo, y en los procedimientos iniciados de oficio se cuentan «desde la fecha del acuerdo de iniciación». Contar desde la notificación del acuerdo, desde la propuesta de resolución o desde el fin de la instrucción no es el inicio que marca el artículo, y dos meses o un mes no son el plazo supletorio."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-63
- id: m01-l11-q105
  prompt:
    es: "De acuerdo con el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos de naturaleza sancionadora se inician:"
  options:
  - id: a
    correct: true
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo de órganos distintos."
  - id: b
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y con la fase instructora y la sancionadora a cargo del mismo órgano."
  - id: c
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y quien denuncia los hechos adquiere por ello la condición de interesado."
  - id: d
    text:
      es: "siempre de oficio, por acuerdo del órgano competente, y el denunciante que participó en la infracción queda exento de la multa en todo caso."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente» y que la fase instructora y la sancionadora «se encomendará a órganos distintos». Reunir las dos fases en el mismo órgano contradice esa separación. Que quien denuncia los hechos adquiera la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el denunciante que participó en la infracción quede exento de la multa en todo caso contradice el artículo 62.4, que lo condiciona: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-63
- id: m01-l11-q106
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el procedimiento sancionador es correcta según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La presentación de una denuncia confiere por sí sola la condición de interesado en el procedimiento."
  - id: b
    text:
      es: "La fase instructora y la sancionadora pueden encomendarse al mismo órgano."
  - id: c
    correct: true
    text:
      es: "El procedimiento sancionador se inicia siempre de oficio, por acuerdo del órgano competente."
  - id: d
    text:
      es: "El denunciante que participó en la infracción queda siempre exento de la multa que le correspondería."
  explanation:
    es: "El artículo 63.1 dice que los procedimientos de naturaleza sancionadora «se iniciarán siempre de oficio por acuerdo del órgano competente». Que una denuncia confiera por sí sola la condición de interesado contradice el artículo 62.5: la denuncia «no confiere, por sí sola, la condición de interesado en el procedimiento». Que el mismo órgano pueda llevar la fase instructora y la sancionadora contradice el artículo 63.1, que las separa y dice que se «encomendará a órganos distintos». Que el denunciante que participó en la infracción quede siempre exento de la multa contradice el artículo 62.4, que condiciona la exención: debe ser el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, no disponerse entonces de elementos suficientes y repararse el perjuicio causado."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q107
  prompt:
    es: "Un funcionario que forma parte de una comisión de valoración comprueba que uno de los solicitantes es hijo de su hermano. ¿Debe abstenerse?"
  options:
  - id: a
    text:
      es: "No, porque la abstención solo alcanza a la consanguinidad dentro del segundo grado."
  - id: b
    correct: true
    text:
      es: "Sí, porque es pariente por consanguinidad en tercer grado, dentro del cuarto."
  - id: c
    text:
      es: "No, porque el hijo de un hermano es pariente por afinidad, no por consanguinidad."
  - id: d
    text:
      es: "Sí, porque es pariente por consanguinidad en segundo grado, dentro del cuarto."
  explanation:
    es: "El hijo de un hermano es un sobrino. En la línea colateral se sube hasta el tronco común y se baja; el artículo 918 del Código Civil dice que el hermano dista «tres del tío», y la distancia es la misma en sentido inverso: tío y sobrino están en tercer grado. El artículo 23.2.b) LRJSP alcanza la consanguinidad «dentro del cuarto grado», así que el funcionario debe abstenerse. El segundo grado como límite es el de la afinidad. El sobrino es pariente por sangre, no por afinidad. El segundo grado es la distancia entre hermanos, no entre tío y sobrino."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q108
  prompt:
    es: "El instructor de un procedimiento tiene con un interesado un parentesco de afinidad de tercer grado, y no concurre ningún otro motivo. ¿Es motivo de abstención?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la afinidad solo es motivo de abstención dentro del segundo grado."
  - id: b
    text:
      es: "Sí, porque la afinidad es motivo de abstención dentro del tercer grado."
  - id: c
    text:
      es: "Sí, porque todo parentesco por afinidad es motivo de abstención."
  - id: d
    text:
      es: "Solo si el interesado lo alega mediante un escrito de recusación."
  explanation:
    es: "El artículo 23.2.b) LRJSP limita la afinidad a la que está «dentro del segundo», así que el tercer grado de afinidad queda fuera. No hay un límite de tercer grado para la afinidad, ni la ley incluye toda afinidad. La recusación (artículo 24.1) solo cabe en los casos del artículo 23: si no hay motivo de abstención, alegarlo no lo crea."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q109
  prompt:
    es: "Un funcionario debe instruir un procedimiento administrativo en el que es interesada una empresa a la que prestó servicios profesionales hace dieciocho meses. ¿Debe abstenerse?"
  options:
  - id: a
    text:
      es: "No, porque solo cuentan los servicios prestados en el último año."
  - id: b
    text:
      es: "No, porque solo cuenta una relación de servicio que siga vigente."
  - id: c
    correct: true
    text:
      es: "Sí, porque le prestó servicios profesionales en los dos últimos años."
  - id: d
    text:
      es: "Sí, pero solo si los servicios se prestaron a cambio de retribución."
  explanation:
    es: "El artículo 23.2.e) LRJSP incluye «haberle prestado en los dos últimos años servicios profesionales de cualquier tipo». Dieciocho meses están dentro de los dos años, así que debe abstenerse. El periodo no es de un año. La relación de servicio vigente es otro supuesto de la misma letra, que no excluye este. La ley habla de servicios «de cualquier tipo», sin exigir que fueran retribuidos."
  citation: "art. 23.2.e) LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q110
  prompt:
    es: "¿Cuál de las siguientes circunstancias es motivo de abstención según el artículo 23.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Haber sido instructor de un procedimiento anterior del mismo interesado."
  - id: b
    correct: true
    text:
      es: "Haber intervenido como perito o como testigo en el procedimiento."
  - id: c
    text:
      es: "Pertenecer al mismo cuerpo de funcionarios que uno de los interesados."
  - id: d
    text:
      es: "Haber resuelto antes otro asunto promovido por el mismo interesado."
  explanation:
    es: "La letra d) del artículo 23.2 LRJSP recoge «haber intervenido como perito o como testigo en el procedimiento de que se trate». Haber instruido o resuelto antes otro asunto del mismo interesado no figura entre los motivos. Pertenecer al mismo cuerpo tampoco."
  citation: "art. 23.2.d) LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q111
  prompt:
    es: "Entre los motivos de abstención de las autoridades y el personal que intervienen en un procedimiento administrativo figura tener con un interesado:"
  options:
  - id: a
    correct: true
    text:
      es: "amistad íntima o enemistad manifiesta."
  - id: b
    text:
      es: "amistad o enemistad, sea cual sea su intensidad."
  - id: c
    text:
      es: "enemistad manifiesta, pero no amistad íntima."
  - id: d
    text:
      es: "amistad íntima, pero no enemistad manifiesta."
  explanation:
    es: "El artículo 23.2.c) LRJSP dice: «Tener amistad íntima o enemistad manifiesta». Los dos supuestos cuentan, así que las opciones que excluyen uno de ellos recortan la letra. Tampoco basta cualquier amistad o enemistad: la ley exige que la amistad sea íntima y la enemistad manifiesta."
  citation: "art. 23.2.c) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q112
  prompt:
    es: "¿Cuál de las siguientes circunstancias recoge el artículo 23.2.a) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público como motivo de abstención?"
  options:
  - id: a
    text:
      es: "Haber sido interesado en otro procedimiento ya concluido ante el mismo órgano."
  - id: b
    text:
      es: "Haber tenido con algún interesado una cuestión litigiosa ya resuelta."
  - id: c
    text:
      es: "Residir en el mismo municipio que alguno de los interesados."
  - id: d
    correct: true
    text:
      es: "Tener cuestión litigiosa pendiente con algún interesado."
  explanation:
    es: "La letra a) del artículo 23.2 LRJSP recoge el interés personal en el asunto, ser administrador de sociedad o entidad interesada y «tener cuestión litigiosa pendiente con algún interesado». La cuestión tiene que estar pendiente; una ya resuelta no está en la letra. Haber sido interesado en otro procedimiento concluido y residir en el mismo municipio no figuran entre los motivos."
  citation: "art. 23.2.a) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q113
  prompt:
    es: "Según el artículo 23.2.b) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, respecto de los asesores, representantes legales o mandatarios que intervengan en el procedimiento, también es motivo de abstención:"
  options:
  - id: a
    text:
      es: "haber compartido despacho profesional con ellos en los cuatro últimos años, aunque ya no lo compartan."
  - id: b
    correct: true
    text:
      es: "compartir despacho profesional o estar asociado con ellos para el asesoramiento, la representación o el mandato."
  - id: c
    text:
      es: "pertenecer al mismo colegio profesional que ellos, aunque no se comparta despacho ni se esté asociado."
  - id: d
    text:
      es: "haber coincidido con ellos como miembros de un mismo órgano colegiado de la Administración del Estado."
  explanation:
    es: "El artículo 23.2.b) LRJSP incluye «compartir despacho profesional o estar asociado con éstos para el asesoramiento, la representación o el mandato». Habla de compartir despacho ahora, no de haberlo compartido en un periodo anterior. La pertenencia al mismo colegio profesional y la coincidencia en un órgano colegiado no aparecen en la letra."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-23
- id: m01-l11-q114
  prompt:
    es: "Además del vínculo matrimonial con cualquiera de los interesados, el mismo motivo de abstención de la legislación de régimen jurídico del sector público incluye:"
  options:
  - id: a
    text:
      es: "el noviazgo, siempre que conste por escrito ante notario."
  - id: b
    text:
      es: "el vínculo matrimonial ya disuelto en los dos últimos años."
  - id: c
    correct: true
    text:
      es: "la situación de hecho asimilable al vínculo matrimonial."
  - id: d
    text:
      es: "la convivencia en el mismo domicilio por razones de trabajo."
  explanation:
    es: "El artículo 23.2.b) LRJSP habla de «un vínculo matrimonial o situación de hecho asimilable». La situación de hecho asimilable queda equiparada al matrimonio. El noviazgo ante notario, el matrimonio disuelto y la convivencia por trabajo no figuran en la letra."
  citation: "art. 23.2.b) LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-24
- id: m01-l11-q115
  prompt:
    es: "Según el artículo 24.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quién puede promover la recusación y en qué momento?"
  options:
  - id: a
    text:
      es: "Cualquier ciudadano, en cualquier momento de la tramitación del procedimiento."
  - id: b
    text:
      es: "Los interesados, dentro de los diez días siguientes a conocer la causa."
  - id: c
    text:
      es: "El superior jerárquico, en cuanto conozca la causa de abstención."
  - id: d
    correct: true
    text:
      es: "Los interesados, en cualquier momento de la tramitación del procedimiento."
  explanation:
    es: "El artículo 24.1 LRJSP dice que «podrá promoverse recusación por los interesados en cualquier momento de la tramitación del procedimiento». La pueden promover los interesados, no cualquier ciudadano. No hay plazo de diez días desde que se conoce la causa. El superior no recusa: puede ordenar que el afectado se abstenga, que es otra figura."
  citation: "art. 24.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-24
- id: m01-l11-q116
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las causas de recusación es correcta según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Son los mismos motivos que obligan a abstenerse."
  - id: b
    text:
      es: "Incluyen cualquier causa que afecte a la imparcialidad, aunque no obligue a abstenerse."
  - id: c
    text:
      es: "Solo pueden alegarse contra el órgano competente para resolver el procedimiento."
  - id: d
    text:
      es: "Solo pueden alegarse si antes el superior inmediato ha rechazado la abstención."
  explanation:
    es: "El artículo 24.1 LRJSP dice: «En los casos previstos en el artículo anterior, podrá promoverse recusación». Las causas de recusación son los motivos de abstención del artículo 23, no cualquier causa que afecte a la imparcialidad. La recusación no se limita a quien resuelve: alcanza a las autoridades y al personal que intervengan. No hace falta una abstención previa rechazada."
  citation: "art. 24.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-24
- id: m01-l11-q118
  prompt:
    es: "El jueves 5 de marzo de 2026 un funcionario recusado en un procedimiento administrativo niega ante su superior la causa alegada. No hay festivos en esos días. ¿Hasta qué día tiene el superior para resolver?"
  options:
  - id: a
    text:
      es: "Hasta el viernes 6 de marzo de 2026."
  - id: b
    text:
      es: "Hasta el lunes 9 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 10 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el jueves 12 de marzo de 2026."
  explanation:
    es: "Si el recusado niega la causa, «el superior resolverá en el plazo de tres días» (artículo 24.4 LRJSP). Los tres días son hábiles y se cuentan desde el día siguiente (artículo 30.2 LPAC): viernes 6, lunes 9 y martes 10. El último día es el martes 10 de marzo de 2026. El viernes 6 es el día siguiente, que es el plazo del recusado. El lunes 9 sale de contar tres días naturales, que acaban el domingo 8, y pasar al lunes. El jueves 12 corresponde a cinco días hábiles."
  citation: "art. 24.4 LRJSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10566-art-24
- id: m01-l11-q119
  prompt:
    es: "Según el artículo 24.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si el recusado niega la causa de recusación:"
  options:
  - id: a
    correct: true
    text:
      es: "el superior resolverá en el plazo de tres días."
  - id: b
    text:
      es: "el superior resolverá en el plazo de diez días."
  - id: c
    text:
      es: "el órgano que resuelve el procedimiento decidirá en un mes."
  - id: d
    text:
      es: "el recusado seguirá actuando sin necesidad de resolución."
  explanation:
    es: "El artículo 24.4 LRJSP dice: «Si el recusado niega la causa de recusación, el superior resolverá en el plazo de tres días». Diez días no es el plazo. No decide el órgano del procedimiento, sino el superior inmediato del recusado. La negativa no basta para que siga actuando: hace falta que el superior resuelva."
  citation: "art. 24.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
