# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0103
  prompt:
    es: "Conforme al artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora será el interés legal del dinero vigente a lo largo del período en el que aquel resulte exigible, incrementado en un:"
  options:
  - id: a
    text:
      es: "15 por ciento, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente."
  - id: b
    text:
      es: "20 por ciento, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente."
  - id: c
    correct: true
    text:
      es: "25 por ciento, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente."
  - id: d
    text:
      es: "50 por ciento, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente."
  explanation:
    es: "El interés de demora es el interés legal del dinero incrementado en un 25 por ciento, salvo que la ley de presupuestos fije otro. El 15 por ciento es el recargo extemporáneo de más de doce meses, el 20 por ciento es un recargo del período ejecutivo y el 50 por ciento no figura en el artículo 26.6."
  citation: "art. 26.6 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
  - "cantidad"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0104
  prompt:
    es: "De acuerdo con el artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el interés exigible en los supuestos de aplazamiento, fraccionamiento o suspensión de deudas garantizadas en su totalidad mediante aval solidario de entidad de crédito o certificado de seguro de caución:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el interés legal del dinero, sin el incremento del 25 por ciento."
  - id: b
    text:
      es: "Es el interés legal del dinero, incrementado en un 25 por ciento."
  - id: c
    text:
      es: "Es el interés legal del dinero, incrementado en un 10 por ciento."
  - id: d
    text:
      es: "Es el interés de demora, sin que pueda fijarlo otra ley de presupuestos."
  explanation:
    es: "Si la deuda está garantizada en su totalidad con aval solidario de entidad de crédito o sociedad de garantía recíproca, o con certificado de seguro de caución, el interés exigible es el interés legal, sin incremento. El tipo con el 25 por ciento es el general del interés de demora, y el incremento del 10 por ciento no figura en el artículo."
  citation: "art. 26.6 LGT"
  difficulty: 2
  tags:
  - "porcentaje"
  - "condición"
# anchor: boe-a-2022-22128-da-cuadragesimosegunda
- id: m03-l03-q0105
  prompt:
    es: "Conforme a la disposición adicional cuadragésima segunda, apartado Dos, de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, prorrogada para 2026, ¿cuál es en 2026 el interés de demora tributario a que se refiere el artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El 3,25 por ciento anual."
  - id: b
    text:
      es: "El 3,75 por ciento anual."
  - id: c
    correct: true
    text:
      es: "El 4,0625 por ciento anual."
  - id: d
    text:
      es: "El 4,5 por ciento anual."
  explanation:
    es: "En 2026 rige la Ley 31/2022 prorrogada: no hay ley de presupuestos para 2024, 2025 ni 2026. Su disposición adicional cuadragésima segunda, apartado Dos, fija el interés de demora tributario en el 4,0625 por ciento. El 3,25 por ciento es el interés legal del dinero del apartado Uno, y el 3,75 y el 4,5 por ciento no son el tipo de esa disposición."
  citation: "disposición adicional cuadragésima segunda.Dos Ley 31/2022"
  difficulty: 2
  tags:
  - "porcentaje"
  - "cantidad"
