    es: "El artículo 72.5 prevé primero al Subdelegado designado por el Delegado y, en su defecto, al de la provincia donde está la sede. El Secretario General solo suple en las uniprovinciales sin Subdelegado. Ni la antigüedad ni el Director Insular son criterios del artículo."
  citation: "art. 72.5 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
