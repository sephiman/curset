# anchor: boe-a-2006-20764-art-1
- id: m03-l01-q0023
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Es un tributo de carácter personal y directo que grava la renta de las personas físicas de acuerdo con su naturaleza y sus circunstancias personales y familiares."
  - id: b
    text:
      es: "Es un tributo de carácter real e indirecto que grava la renta de las personas físicas de acuerdo con su naturaleza y sus circunstancias personales y familiares."
  - id: c
    text:
      es: "Es un tributo de carácter personal y directo que grava el patrimonio neto de las personas físicas de acuerdo con su naturaleza y sus circunstancias personales y familiares."
  - id: d
    text:
      es: "Es un tributo de carácter personal e indirecto que grava el consumo de las personas físicas de acuerdo con su naturaleza y sus circunstancias personales y familiares."
  explanation:
    es: "El impuesto es personal y directo y grava la renta de las personas físicas según sus circunstancias personales y familiares. La versión real e indirecta cambia la naturaleza del tributo. Si grava el patrimonio neto, describe otro impuesto, el del Patrimonio. Si recae sobre el consumo y es indirecto, describe el IVA."
  citation: "art. 1 LIRPF"
  difficulty: 1
  tags:
  - "irpf"
  - "naturaleza"
# anchor: boe-a-2006-20764-art-1
- id: m03-l01-q0024
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el Impuesto sobre la Renta de las Personas Físicas grava la renta de las personas físicas según:"
  options:
  - id: a
    correct: true
    text:
      es: "Los principios de igualdad, generalidad y progresividad."
  - id: b
    text:
      es: "Los principios de igualdad, proporcionalidad y seguridad jurídica."
  - id: c
    text:
      es: "Los principios de legalidad, generalidad y capacidad económica."
  - id: d
    text:
      es: "Los principios de justicia, igualdad y no confiscatoriedad."
  explanation:
    es: "El artículo 1 de la ley del impuesto cita la igualdad, la generalidad y la progresividad. Las otras combinaciones mezclan principios de normas vecinas: la proporcionalidad y la seguridad jurídica no figuran en ese artículo, la legalidad y la capacidad económica tampoco, y la justicia y la no confiscatoriedad pertenecen al artículo 3.1 de la Ley General Tributaria."
  citation: "art. 1 LIRPF"
  difficulty: 2
  tags:
  - "irpf"
  - "principios"
# anchor: boe-a-2006-20764-art-2
- id: m03-l01-q0025
  prompt:
    es: "De acuerdo con el artículo 2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, constituye el objeto del impuesto la renta del contribuyente, entendida como:"
  options:
  - id: a
    text:
      es: "Solo los rendimientos del trabajo y de las actividades económicas que obtenga en el período impositivo."
  - id: b
    correct: true
    text:
      es: "La totalidad de sus rendimientos, ganancias y pérdidas patrimoniales y las imputaciones de renta que se establezcan por la ley."
  - id: c
    text:
      es: "La totalidad de sus bienes y derechos de contenido económico, con deducción de las cargas y deudas."
  - id: d
    text:
      es: "Los rendimientos y las ganancias patrimoniales, con exclusión de las pérdidas patrimoniales y de las imputaciones de renta."
  explanation:
    es: "La renta es la totalidad de rendimientos, ganancias y pérdidas patrimoniales e imputaciones de renta que prevea la ley. Limitarla a rendimientos del trabajo y de actividades económicas la recorta. Los bienes y derechos con deducción de cargas y deudas describen el patrimonio neto, no la renta. Excluir las pérdidas y las imputaciones contradice el precepto, que las incluye."
  citation: "art. 2 LIRPF"
  difficulty: 2
  tags:
  - "irpf"
  - "objeto"
# anchor: boe-a-2006-20764-art-3
- id: m03-l01-q0026
  prompt:
    es: "¿En qué medida está cedido a las Comunidades Autónomas el Impuesto sobre la Renta de las Personas Físicas, según el artículo 3.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Es un impuesto cedido totalmente a las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Es un impuesto cedido parcialmente a las Comunidades Autónomas."
  - id: c
    text:
      es: "Es un impuesto no cedido, porque su titularidad es exclusiva del Estado."
  - id: d
    text:
      es: "Es un impuesto cedido únicamente a las Corporaciones locales."
  explanation:
    es: "El artículo 3.1 configura el impuesto como cedido parcialmente a las Comunidades Autónomas. La cesión total no es la que establece. Decir que no está cedido ignora la cesión parcial. Los destinatarios de la cesión son las Comunidades Autónomas, no las Corporaciones locales."
  citation: "art. 3.1 LIRPF"
  difficulty: 1
  tags:
  - "irpf"
  - "cesión"
# anchor: boe-a-2014-12328-art-1
- id: m03-l01-q0027
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre la naturaleza del Impuesto sobre Sociedades:"
  options:
  - id: a
    correct: true
    text:
      es: "Es un tributo de carácter directo y naturaleza personal que grava la renta de las sociedades y demás entidades jurídicas."
  - id: b
    text:
      es: "Es un tributo de carácter directo y naturaleza real que grava la renta de las sociedades y demás entidades jurídicas."
  - id: c
    text:
      es: "Es un tributo de carácter directo y naturaleza personal que grava el patrimonio neto de las sociedades y demás entidades jurídicas."
  - id: d
    text:
      es: "Es un tributo de carácter indirecto y naturaleza personal que grava la renta de las sociedades y demás entidades jurídicas."
  explanation:
    es: "El Impuesto sobre Sociedades es directo, de naturaleza personal, y grava la renta de las sociedades y demás entidades jurídicas. Si fuera real, cambiaría su naturaleza. Si gravara el patrimonio neto, sería el Impuesto sobre el Patrimonio. Si fuera indirecto, se parecería al IVA o a los impuestos sobre transmisiones, que recaen sobre actos de consumo o tráfico."
  citation: "art. 1 LIS"
  difficulty: 1
  tags:
  - "is"
  - "naturaleza"
# anchor: boe-a-2014-12328-art-1
- id: m03-l01-q0028
  prompt:
    es: "¿Qué grava el Impuesto sobre Sociedades según el artículo 1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "La renta de las personas físicas de acuerdo con sus circunstancias personales y familiares."
  - id: b
    text:
      es: "La renta obtenida en territorio español por las entidades no residentes en éste."
  - id: c
    correct: true
    text:
      es: "La renta de las sociedades y demás entidades jurídicas."
  - id: d
    text:
      es: "El consumo de bienes y servicios que realicen las sociedades y demás entidades."
  explanation:
    es: "El impuesto grava la renta de las sociedades y demás entidades jurídicas. La renta de las personas físicas es la materia del IRPF. La renta obtenida en España por no residentes corresponde al impuesto específico de no residentes. El consumo es la materia del IVA, un tributo indirecto."
  citation: "art. 1 LIS"
  difficulty: 1
  tags:
  - "is"
  - "objeto"
# anchor: boe-a-1992-28740-art-1
- id: m03-l01-q0029
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, señale la respuesta CORRECTA sobre la naturaleza del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Es un tributo de naturaleza directa que recae sobre el consumo."
  - id: b
    text:
      es: "Es un tributo de naturaleza indirecta que recae sobre la renta de los empresarios."
  - id: c
    correct: true
    text:
      es: "Es un tributo de naturaleza indirecta que recae sobre el consumo."
  - id: d
    text:
      es: "Es un tributo de naturaleza directa que recae sobre el patrimonio de los consumidores."
  explanation:
    es: "El IVA es un tributo de naturaleza indirecta que recae sobre el consumo. Llamarlo directo cambia su naturaleza, aunque el objeto sea el mismo. Gravar la renta de los empresarios o el patrimonio de los consumidores describe otros impuestos: el IRPF o el de Sociedades en el primer caso, y el del Patrimonio en el segundo."
  citation: "art. 1 LIVA"
  difficulty: 1
  tags:
  - "iva"
  - "naturaleza"
# anchor: boe-a-1992-28740-art-1
- id: m03-l01-q0030
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, señale la respuesta CORRECTA sobre las operaciones que grava el Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Grava las entregas de bienes y prestaciones de servicios efectuadas por empresarios o profesionales, las adquisiciones intracomunitarias de bienes y las importaciones de bienes."
  - id: b
    text:
      es: "Grava las entregas de bienes y prestaciones de servicios efectuadas por cualquier persona, sea o no empresario o profesional, y las importaciones de bienes."
  - id: c
    text:
      es: "Grava las entregas de bienes y prestaciones de servicios efectuadas por empresarios o profesionales, las adquisiciones intracomunitarias de bienes y las exportaciones de bienes."
  - id: d
    text:
      es: "Grava las adquisiciones intracomunitarias de bienes y las importaciones de bienes, pero no las prestaciones de servicios efectuadas por empresarios o profesionales."
  explanation:
    es: "El impuesto grava tres bloques: entregas y servicios de empresarios o profesionales, adquisiciones intracomunitarias de bienes e importaciones de bienes. Extenderlo a las entregas de cualquier persona elimina el requisito de empresario o profesional. Las exportaciones no figuran entre las operaciones que enumera el artículo 1. Excluir las prestaciones de servicios deja fuera uno de los tres bloques."
  citation: "art. 1 LIVA"
  difficulty: 2
  tags:
  - "iva"
  - "hecho-imponible"
# anchor: boe-a-2004-4527-art-1
- id: m03-l01-q0032
  prompt:
    es: "De acuerdo con el artículo 1 del Real Decreto Legislativo 5/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley del Impuesto sobre la Renta de no Residentes, señale la respuesta CORRECTA sobre el Impuesto sobre la Renta de no Residentes:"
  options:
  - id: a
    correct: true
    text:
      es: "Es un tributo de carácter directo que grava la renta obtenida en territorio español por las personas físicas y entidades no residentes en éste."
  - id: b
    text:
      es: "Es un tributo de carácter directo que grava la renta obtenida en cualquier territorio por las personas físicas y entidades residentes en España."
  - id: c
    text:
      es: "Es un tributo de carácter indirecto que grava la renta obtenida en territorio español por las personas físicas y entidades no residentes en éste."
  - id: d
    text:
      es: "Es un tributo de carácter directo que grava el patrimonio situado en territorio español de las personas físicas no residentes en éste."
  explanation:
    es: "El impuesto es directo y grava la renta que personas físicas y entidades no residentes obtienen en territorio español. La versión que grava a residentes por rentas de cualquier territorio describe el régimen de los residentes. Calificarlo de indirecto cambia su naturaleza. Gravar patrimonio en lugar de renta cambia la materia imponible."
  citation: "art. 1 TRLIRNR"
  difficulty: 2
  tags:
  - "irnr"
  - "naturaleza"
# anchor: boe-a-2004-4527-art-1
- id: m03-l01-q0033
  prompt:
    es: "De acuerdo con el artículo 1 del Real Decreto Legislativo 5/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley del Impuesto sobre la Renta de no Residentes, el Impuesto sobre la Renta de no Residentes grava la renta obtenida en territorio español por:"
  options:
  - id: a
    text:
      es: "Las personas físicas residentes y las entidades no residentes en éste."
  - id: b
    text:
      es: "Las personas físicas no residentes, con exclusión de las entidades."
  - id: c
    text:
      es: "Las entidades residentes que obtengan rentas fuera de ese territorio."
  - id: d
    correct: true
    text:
      es: "Las personas físicas y entidades no residentes en éste."
  explanation:
    es: "El artículo 1 alcanza a personas físicas y a entidades, ambas no residentes. Mezclar personas físicas residentes con entidades no residentes rompe esa condición común. Excluir a las entidades recorta el precepto. Las entidades residentes con rentas obtenidas fuera quedan al margen de este impuesto."
  citation: "art. 1 TRLIRNR"
  difficulty: 1
  tags:
  - "irnr"
  - "sujetos"
# anchor: boe-a-1991-14392-art-1
- id: m03-l01-q0034
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 19/1991, de 6 de junio, del Impuesto sobre el Patrimonio, el Impuesto sobre el Patrimonio es un tributo de carácter directo y naturaleza personal que grava:"
  options:
  - id: a
    text:
      es: "El patrimonio bruto de las personas físicas y de las entidades jurídicas."
  - id: b
    correct: true
    text:
      es: "El patrimonio neto de las personas físicas."
  - id: c
    text:
      es: "El patrimonio neto de las personas físicas y de las entidades jurídicas."
  - id: d
    text:
      es: "Los incrementos patrimoniales obtenidos a título lucrativo por las personas físicas."
  explanation:
    es: "El impuesto grava el patrimonio neto de las personas físicas. El patrimonio bruto de personas físicas y entidades jurídicas amplía el sujeto y cambia la base. El patrimonio neto de las entidades jurídicas amplía el sujeto aunque mantenga la base. Los incrementos patrimoniales a título lucrativo son la materia del Impuesto sobre Sucesiones y Donaciones."
  citation: "art. 1 Ley 19/1991"
  difficulty: 1
  tags:
  - "patrimonio"
  - "naturaleza"
# anchor: boe-a-1991-14392-art-1
- id: m03-l01-q0036
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la naturaleza del Impuesto sobre el Patrimonio recoge el artículo 1 de la Ley 19/1991, de 6 de junio, del Impuesto sobre el Patrimonio?"
  options:
  - id: a
    text:
      es: "Es un tributo de carácter directo y naturaleza real."
  - id: b
    correct: true
    text:
      es: "Es un tributo de carácter directo y naturaleza personal."
  - id: c
    text:
      es: "Es un tributo de carácter indirecto y naturaleza personal."
  - id: d
    text:
      es: "Es un tributo de carácter indirecto y naturaleza real."
  explanation:
    es: "El Impuesto sobre el Patrimonio es directo y de naturaleza personal. La naturaleza real es la del Impuesto sobre Bienes Inmuebles. Indirecto cambia su carácter, porque no recae sobre actos de consumo o tráfico. Indirecto y real a la vez no corresponde a ningún rasgo que fije su artículo 1."
  citation: "art. 1 Ley 19/1991"
  difficulty: 1
  tags:
  - "patrimonio"
  - "naturaleza"
# anchor: boe-a-1993-25359-art-1
- id: m03-l01-q0038
  prompt:
    es: "De acuerdo con el artículo 1.1 del Real Decreto Legislativo 1/1993, de 24 de septiembre, por el que se aprueba el Texto refundido de la Ley del Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados, el impuesto, que es un tributo de naturaleza indirecta, gravará:"
  options:
  - id: a
    text:
      es: "Las transmisiones patrimoniales lucrativas, las operaciones societarias y los actos jurídicos documentados."
  - id: b
    text:
      es: "Las transmisiones patrimoniales onerosas, las operaciones societarias y las sucesiones y donaciones."
  - id: c
    text:
      es: "Las transmisiones patrimoniales onerosas y las operaciones mercantiles, con exclusión de los actos jurídicos documentados."
  - id: d
    correct: true
    text:
      es: "Las transmisiones patrimoniales onerosas, las operaciones societarias y los actos jurídicos documentados."
  explanation:
    es: "El impuesto grava tres conceptos: las transmisiones patrimoniales onerosas, las operaciones societarias y los actos jurídicos documentados. Las transmisiones lucrativas son materia del Impuesto sobre Sucesiones y Donaciones, y las sucesiones y donaciones también. Las operaciones mercantiles no son un concepto del impuesto, y los actos jurídicos documentados sí lo son."
  citation: "art. 1.1 TRLITPAJD"
  difficulty: 2
  tags:
  - "itpajd"
  - "hecho-imponible"
# anchor: boe-a-1992-28741-art-1
- id: m03-l01-q0040
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley 38/1992, de 28 de diciembre, de Impuestos Especiales, señale la respuesta CORRECTA sobre la naturaleza de los impuestos especiales:"
  options:
  - id: a
    text:
      es: "Son tributos de naturaleza directa que recaen sobre consumos específicos."
  - id: b
    text:
      es: "Son tributos de naturaleza indirecta que recaen sobre el consumo en general."
  - id: c
    text:
      es: "Son tributos de naturaleza indirecta que recaen sobre la renta obtenida por los fabricantes."
  - id: d
    correct: true
    text:
      es: "Son tributos de naturaleza indirecta que recaen sobre consumos específicos."
  explanation:
    es: "Los impuestos especiales son indirectos y recaen sobre consumos específicos. Llamarlos directos cambia su naturaleza. El consumo en general es la materia del IVA, mientras que los especiales se limitan a consumos concretos. La renta de los fabricantes no es su materia imponible."
  citation: "art. 1.1 Ley 38/1992"
  difficulty: 1
  tags:
  - "iiee"
  - "naturaleza"
# anchor: boe-a-1992-28741-art-1
- id: m03-l01-q0042
  prompt:
    es: "De acuerdo con el artículo 1.2 de la Ley 38/1992, de 28 de diciembre, de Impuestos Especiales, tienen la consideración de impuestos especiales:"
  options:
  - id: a
    text:
      es: "Los Impuestos Especiales de Fabricación, el Impuesto Especial sobre la Electricidad, el Impuesto sobre Transmisiones Patrimoniales y el Impuesto Especial sobre el Carbón."
  - id: b
    correct: true
    text:
      es: "Los Impuestos Especiales de Fabricación, el Impuesto Especial sobre la Electricidad, el Impuesto Especial sobre Determinados Medios de Transporte y el Impuesto Especial sobre el Carbón."
  - id: c
    text:
      es: "Los Impuestos Especiales de Fabricación, el Impuesto sobre el Valor Añadido, el Impuesto Especial sobre Determinados Medios de Transporte y el Impuesto Especial sobre el Carbón."
  - id: d
    text:
      es: "Los Impuestos Especiales de Fabricación y el Impuesto Especial sobre el Carbón, con exclusión de la electricidad y de los medios de transporte."
  explanation:
    es: "El artículo 1.2 enumera cuatro: los de Fabricación, el de la Electricidad, el de Determinados Medios de Transporte y el del Carbón. El impuesto sobre transmisiones patrimoniales y el IVA son tributos indirectos de otra clase, ninguno de los cuales es impuesto especial. Suprimir la electricidad y los medios de transporte deja la lista incompleta."
  citation: "art. 1.2 Ley 38/1992"
  difficulty: 3
  tags:
  - "iiee"
  - "enumeración"
# anchor: boe-a-2022-22684-art-3
- id: m03-l01-q0044
  prompt:
    es: "Según el artículo 3 de la Ley 38/2022, de 27 de diciembre, por la que se crea el impuesto temporal de solidaridad de las grandes fortunas, ¿en qué momento ha de tener el sujeto pasivo la titularidad del patrimonio neto superior a 3.000.000 de euros para realizar el hecho imponible?"
  options:
  - id: a
    text:
      es: "Durante todo el año natural anterior al devengo."
  - id: b
    correct: true
    text:
      es: "En el momento del devengo."
  - id: c
    text:
      es: "En el momento de presentar la declaración del impuesto."
  - id: d
    text:
      es: "En el momento en que adquiere el último bien o derecho."
  explanation:
    es: "El hecho imponible es la titularidad del patrimonio neto en el momento del devengo. No se exige mantenerla durante todo el año anterior, ni consta que lo decisivo sea la fecha de presentación de la declaración o la de adquisición del último bien."
  citation: "art. 3.Tres Ley 38/2022"
  difficulty: 2
  tags:
  - "itsgf"
  - "hecho-imponible"
# anchor: boe-a-2022-22684-art-3
- id: m03-l01-q0045
  prompt:
    es: "De acuerdo con el artículo 3.Dos.2 de la Ley 38/2022, de 27 de diciembre, por la que se crea el impuesto temporal de solidaridad de las grandes fortunas, el impuesto temporal de solidaridad de las grandes fortunas:"
  options:
  - id: a
    text:
      es: "Podrá ser cedido total o parcialmente a las Comunidades Autónomas, en los términos de su ley de cesión."
  - id: b
    text:
      es: "Se cede a las Comunidades Autónomas en la misma medida que el Impuesto sobre el Patrimonio."
  - id: c
    text:
      es: "Solo podrá ser cedido a las Comunidades Autónomas de régimen común."
  - id: d
    correct: true
    text:
      es: "No podrá ser objeto de cesión a las Comunidades Autónomas."
  explanation:
    es: "El precepto excluye la cesión a las Comunidades Autónomas. Aunque el Impuesto sobre el Patrimonio sí se cede, el artículo 3.Dos.2 no extiende esa cesión al impuesto temporal. Tampoco admite una cesión parcial o limitada a cierto régimen, porque la prohibición no distingue."
  citation: "art. 3.Dos.2 Ley 38/2022"
  difficulty: 1
  tags:
  - "itsgf"
  - "cesión"
# anchor: boe-a-2022-22684-art-3
- id: m03-l01-q0046
  prompt:
    es: "De acuerdo con el artículo 3.Uno de la Ley 38/2022, de 27 de diciembre, por la que se crea el impuesto temporal de solidaridad de las grandes fortunas, señale la respuesta CORRECTA sobre la naturaleza del impuesto temporal de solidaridad de las grandes fortunas:"
  options:
  - id: a
    text:
      es: "Es un tributo de carácter indirecto, naturaleza real y complementario del Impuesto sobre el Patrimonio."
  - id: b
    text:
      es: "Es un tributo de carácter directo, naturaleza personal y sustitutivo del Impuesto sobre el Patrimonio."
  - id: c
    correct: true
    text:
