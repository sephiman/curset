type: quiz
variants:
- id: m08-l02-q01
  prompt:
    en: In Kafka 4, a topic has two replicas and one of them has failed. A producer with `acks=all` and the default
      `min.insync.replicas` writes to it. What happens to the write?
  options:
  - id: a
    correct: true
    text:
      en: The write succeeds, because acknowledgement needs only the in-sync replicas that remain
  - id: b
    text:
      en: The write fails, because `acks=all` requires every assigned replica to acknowledge it
  - id: c
    text:
      en: The write fails with `NotEnoughReplicas`, because the default `min.insync.replicas` is 2
  - id: d
    text:
      en: The write succeeds only once the failed replica has caught up and rejoined the ISR
  explanation:
    en: With only two replicas and one of them failed, writes that specify `acks=all` succeed. Requiring every assigned
      replica is wrong, because acknowledgement by all replicas does not guarantee that the full set of assigned
      replicas have received the message. A `NotEnoughReplicas` failure is wrong, because the default of `min.insync.replicas`
      is 1, not 2. Waiting for the failed replica to rejoin the ISR is wrong, because acknowledgement happens as
      soon as all the current in-sync replicas have received the message.
  citation: kafka-design#availability-and-durability-guarantees; kafka-topic-configs#min.insync.replicas
  extract:
    en: then writes that specify acks=all will succeed.
- id: m08-l02-q02
  prompt:
    en: In Kafka, a topic's minimum ISR size is raised to a higher value for producers that use `acks=all`. Which
      statement describes the effect of this higher setting?
  options:
  - id: a
    text:
      en: It trades consistency for availability, because fewer replicas have to acknowledge each write
  - id: b
    text:
      en: It also applies to producers that use `acks=1`, so their writes wait for the minimum ISR size
  - id: c
    text:
      en: It makes the producer wait for every assigned replica, including replicas outside the ISR
  - id: d
    correct: true
    text:
      en: 'It trades availability for consistency: messages are written to more replicas, and writes stop when the
        ISR drops below the minimum'
  explanation:
    en: A higher minimum ISR size trades availability for consistency, because this setting offers a trade-off between
      consistency and availability. Trading consistency for availability is wrong, because a higher setting guarantees
      better consistency since the message is written to more replicas. Applying to `acks=1` producers is wrong,
      because the setting only takes effect if the producer uses `acks=all`. Waiting for every assigned replica
      is wrong, because acknowledgement by all replicas does not guarantee that the full set of assigned replicas
      have received the message.
  citation: kafka-design#availability-and-durability-guarantees
  extract:
    en: This setting offers a trade-off between consistency and availability.
- id: m08-l02-q03
  prompt:
    en: With the new consumer rebalance protocol of Apache Kafka 4 enabled through `group.protocol`, which of these
      configurations is no longer usable?
  options:
  - id: a
    text:
      en: '`group.consumer.assignors`'
  - id: b
    text:
      en: '`group.remote.assignor`'
  - id: c
    correct: true
    text:
      en: '`partition.assignment.strategy`'
  - id: d
    text:
      en: '`group.protocol`'
  explanation:
    en: '`partition.assignment.strategy` is listed among the configurations and APIs that are no longer usable once
      the new protocol is enabled. `group.consumer.assignors` stays usable, because it specifies the list of available
      assignors for consumer groups. `group.remote.assignor` stays usable, because a consumer selects a different
      assignor through that client config. `group.protocol` stays usable, because it must be set to `consumer` to
      enable the new protocol.'
  citation: kafka-consumer-rebalance-protocol#consumer; kafka-consumer-rebalance-protocol#server
  extract:
    en: the following configurations and APIs are no longer usable
- id: m08-l02-q05
  prompt:
    en: In Kafka 4, a consumer reads from a topic, processes the records and writes results to other topics, without
      transactions. Which delivery guarantee does Kafka give by default?
  options:
  - id: a
    correct: true
    text:
      en: At-least-once delivery
  - id: b
    text:
      en: At-most-once delivery, because the producer has retries disabled by default
  - id: c
    text:
      en: Exactly-once delivery, because the consumer isolation level defaults to `read_committed`
  - id: d
    text:
      en: Exactly-once delivery to any destination system, because Kafka coordinates every write with the consumer
        position
  explanation:
    en: Kafka guarantees at-least-once delivery by default. At-most-once delivery is wrong, because the user implements
      it by disabling retries on the producer and committing offsets before processing. Exactly-once delivery through
      a `read_committed` default is wrong, because `read_uncommitted` is the default isolation level. Exactly-once
      delivery to any destination system is wrong, because it generally requires cooperation with such systems.
  citation: kafka-design#message-delivery-semantics; kafka-consumer-configs#isolation.level
  extract:
    en: Kafka guarantees at-least-once delivery by default
- id: m08-l02-q06
  prompt:
    en: A consumer uses `isolation.level=read_committed`, and a partition has an open transaction. Up to which offset
      can `consumer.poll()` return messages from that partition?
  options:
  - id: a
    text:
      en: The high watermark, because messages committed after the open transaction are already visible
  - id: b
    text:
      en: Every committed message, skipping the open transaction and returning the messages that follow it
  - id: c
    correct: true
    text:
      en: The last stable offset, which is one less than the offset of the first open transaction
  - id: d
    text:
      en: The log end offset, because the poll returns non-transactional messages out of offset order
  explanation:
    en: In `read_committed` mode, `consumer.poll()` only returns messages up to the last stable offset, which is
      one less than the offset of the first open transaction. Reading up to the high watermark is wrong, because
      read-committed consumers cannot read that far while transactions are in flight. Skipping the open transaction
      is wrong, because messages after ongoing transactions are withheld until the transaction completes. Returning
      messages out of offset order is wrong, because messages are always returned in offset order.
  citation: kafka-consumer-configs#isolation.level
  extract:
    en: consumer.poll() will only return messages up to the last stable offset (LSO), which is the one less than
      the offset of the first open transaction.
- id: m08-l02-q07
  prompt:
    en: In Kafka 4, which producer configuration value is compatible with `enable.idempotence=true`, given that
      the other required settings are also respected?
  options:
  - id: a
    text:
      en: '`acks=1`'
  - id: b
    correct: true
    text:
      en: '`acks=all`'
  - id: c
    text:
      en: '`retries=0`'
  - id: d
    text:
      en: '`max.in.flight.requests.per.connection=10`'
  explanation:
    en: Enabling idempotence requires `acks` to be `all`. `acks=1` is wrong, because enabling idempotence requires
      the `acks` value to be `all`. `retries=0` is wrong, because idempotence requires `retries` to be greater than
      0. A `max.in.flight.requests.per.connection` of 10 is wrong, because idempotence requires it to be less than
      or equal to 5.
  citation: kafka-producer-configs#enable.idempotence; kafka-producer-configs#acks
  extract:
    en: and acks must be 'all'
- id: m08-l02-q08
  prompt:
    en: Which of these situations does NOT cause RabbitMQ to dead-letter a message, that is, to republish it to
      an exchange when it leaves its queue?
  options:
  - id: a
    text:
      en: The message expires due to its per-message TTL
  - id: b
    text:
      en: A consumer rejects the message with `basic.nack` and `requeue` set to false
  - id: c
    text:
      en: The message is dropped because its queue exceeded a length limit
  - id: d
    correct: true
    text:
      en: The whole queue that holds the message expires
  explanation:
    en: If an entire queue expires, the messages in the queue are not dead-lettered. A message that expires due
      to per-message TTL is dead-lettered. A message rejected with `basic.nack` and `requeue` set to false is dead-lettered.
      A message dropped because its queue exceeded a length limit is dead-lettered.
  citation: rabbitmq-dlx#overview
- id: m08-l02-q09
  prompt:
    en: In Spring for Apache Kafka 4, a record keeps failing in a listener that uses the default `DefaultErrorHandler`
      configuration. What happens to the record once the retries are exhausted?
  options:
  - id: a
    text:
      en: The record is published to a topic named after the original topic with the `-dlt` suffix
  - id: b
    correct: true
    text:
      en: The failed record is logged at the ERROR level
  - id: c
    text:
      en: The record is retried indefinitely until the listener succeeds
  - id: d
    text:
      en: The container stops and rethrows the exception to the application
  explanation:
    en: By default, after ten failures, the failed record is logged at the ERROR level. Publishing to a `-dlt` topic
      is wrong, because the default recoverer logs the failed record and `DeadLetterPublishingRecoverer` has to
      be configured to publish it. Retrying indefinitely is wrong, because it takes a `FixedBackOff` with `FixedBackOff.UNLIMITED_ATTEMPTS`.
      Stopping the container and rethrowing is wrong, because failures are simply logged after retries are exhausted.
  citation: spring-kafka-error-handling#default-eh
