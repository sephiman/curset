- id: m11-l01-v-comparators-001
  prompt:
    en: |-
      What does this program print? The sort is stable, and each item is shown by its name.

      ```java
      import java.util.Comparator;
      import java.util.List;

      public class Main {
          record Item(String name, int rank, String group) {}

          public static void main(String[] args) {
              List<Item> items = List.of(new Item("bob", 2, "x"), new Item("Amy", 1, "y"), new Item("cat", 2, "y"), new Item("Dan", 1, "x"), new Item("amy", 2, "x"));
              Comparator<Item> order = Comparator.comparingInt(Item::rank).thenComparing(Item::name);
              System.out.println(items.stream().sorted(order).map(Item::name).toList());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[Amy, Dan, amy, bob, cat]`'
    correct: true
  - id: b
    text:
      en: '`[Amy, Dan, bob, cat, amy]`'
  - id: c
    text:
      en: '`[Dan, Amy, bob, amy, cat]`'
  - id: d
    text:
      en: '`[Dan, amy, bob, Amy, cat]`'
  explanation:
    en: 'The comparator is `comparingInt(Item::rank).thenComparing(Item::name)`. Items are compared by its first key, and
      `thenComparing` decides only between items that key sees as equal. The sort is stable, so items that stay equal keep
      their input order. The program prints `[Amy, Dan, amy, bob, cat]`. `[Amy, Dan, bob, cat, amy]` comes from this mistake:
      leaving out the tie-breaker, so equal items keep their input order. `[Dan, Amy, bob, amy, cat]` comes from this mistake:
      breaking ties on the group instead of the name. `[Dan, amy, bob, Amy, cat]` comes from this mistake: sorting by the
      group first instead of the rank.'
  family: comparators
  code_reading: true
  citation: javadoc-comparator#thenComparing(java.util.Comparator)
  difficulty: 3
