# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q278
  prompt:
    es: "Un ministerio y un organismo autónomo agotan el crédito del artículo 12 «Funcionarios» de un programa y conservan el del artículo 13 «Laborales». ¿Cuál puede atender el gasto con este sin tramitar una modificación presupuestaria?"
  options:
  - id: a
    text:
      es: "Los dos, porque los gastos de personal vinculan a nivel de capítulo en ambos presupuestos."
  - id: b
    text:
      es: "Solo el ministerio, porque su presupuesto especifica los gastos de personal a nivel de capítulo."
  - id: c
    correct: true
    text:
      es: "Solo el organismo autónomo, porque su presupuesto especifica los gastos de personal a nivel de capítulo."
  - id: d
    text:
      es: "Ninguno de los dos, porque los gastos de personal vinculan a nivel de artículo en ambos presupuestos."
  explanation:
    es: "En el presupuesto del Estado los gastos de personal se especifican a nivel de artículo (art. 43.1), y los artículos 12 y 13 son distintos: el ministerio necesita una modificación. En el de los organismos autónomos se especifican a nivel de capítulo (art. 44.1), y los dos artículos son del capítulo 1: el organismo atiende el gasto con el crédito del 13. Por eso no es cierto que vinculen a nivel de capítulo en ambos presupuestos, ni que el ministerio sea el que puede, ni que vinculen a nivel de artículo en los dos."
  citation: "arts. 43.1 y 44.1 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "estructura"
# anchor: boe-a-2022-22128-art-8
- id: m05-l02-q279
  prompt:
    es: "Según el artículo 8.Uno de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, entre los créditos vinculantes el de «Labores Fábrica Nacional Moneda y Timbre» figura con el código:"
  options:
  - id: a
    correct: true
    text:
      es: "221.09, del concepto 221 «Suministros»."
  - id: b
    text:
      es: "221.10, del concepto 221 «Suministros»."
  - id: c
    text:
      es: "221.08, del concepto 221 «Suministros»."
  - id: d
    text:
      es: "225.02, del concepto 225 «Tributos»."
  explanation:
    es: "El artículo 8.Uno.4 declara vinculantes los créditos 221.09 «Labores Fábrica Nacional Moneda y Timbre», 225.02 «Tributos locales» y 202. El 221.10 es el crédito del Ministerio del Interior «A la Fábrica Nacional de Moneda y Timbre por afectación de las tasas del DNI y pasaportes», que el artículo 8.Dos.2 trata aparte. El 221.08 es el subconcepto de material deportivo, didáctico y cultural, y el 225.02 es el de tributos locales."
  citation: "art. 8.Uno Ley 31/2022"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q280
  prompt:
    es: "Una operación plurianual de un ministerio tiene un crédito inicial de 700.000 euros. Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuánto puede imputarse como máximo, en total, a los cuatro ejercicios posteriores?"
  options:
  - id: a
    text:
      es: "1.260.000 euros."
  - id: b
    text:
      es: "1.540.000 euros."
  - id: c
    correct: true
    text:
      es: "1.610.000 euros."
  - id: d
    text:
      es: "1.750.000 euros."
  explanation:
    es: "Los topes son el 70 por ciento en el ejercicio inmediato siguiente, el 60 en el segundo y el 50 en el tercero y en el cuarto: 490.000 + 420.000 + 350.000 + 350.000 = 1.610.000 euros. La cifra de 1.260.000 suma solo los tres primeros ejercicios posteriores, la de 1.540.000 aplica un 40 por ciento al cuarto y la de 1.750.000 aplica un 60 por ciento al tercero y al cuarto."
  citation: "art. 47.2 LGP"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q281
  prompt:
    es: "¿Cuál de las siguientes es la denominación que da al artículo 62 del capítulo 6 «Inversiones reales» el anexo II de la Orden HAC/557/2026, de 3 de junio?"
  options:
  - id: a
    text:
      es: "«Inversión nueva en infraestructura y bienes destinados al uso general»."
  - id: b
    text:
      es: "«Inversión de reposición en infraestructura y bienes destinados al uso general»."
  - id: c
    text:
      es: "«Inversiones militares asociadas al funcionamiento de los servicios»."
  - id: d
    correct: true
    text:
      es: "«Inversión nueva asociada al funcionamiento operativo de los servicios»."
  explanation:
    es: "El anexo II denomina el artículo 62 «Inversión nueva asociada al funcionamiento operativo de los servicios». Las otras tres denominaciones son de otros artículos del mismo capítulo 6: la inversión nueva en infraestructura y bienes de uso general es el 60, la de reposición en esa misma infraestructura es el 61 y las inversiones militares asociadas al funcionamiento de los servicios son el 66."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q282
  prompt:
    es: "En la aplicación 33.101.921O.227.06, ¿qué designa el código 06 con el que termina la parte económica, según el anexo II de la Orden HAC/557/2026, de 3 de junio?"
  options:
  - id: a
    text:
      es: "El subconcepto «Limpieza y aseo» del concepto 227."
  - id: b
    text:
      es: "El subconcepto «Valoraciones y peritajes» del concepto 227."
  - id: c
    text:
      es: "El concepto «Estudios y trabajos técnicos» del artículo 22."
  - id: d
    correct: true
    text:
      es: "El subconcepto «Estudios y trabajos técnicos» del concepto 227."
  explanation:
    es: "La parte económica 227.06 se lee como concepto 227 «Trabajos realizados por otras empresas y profesionales» y subconcepto 06 «Estudios y trabajos técnicos». El 06 no es un concepto del artículo 22: el concepto es el 227, y el 06 lo divide. Limpieza y aseo y valoraciones y peritajes son subconceptos del mismo concepto 227, con los códigos 00 y 02."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-anexo-i
- id: m05-l02-q283
  prompt:
    es: "En la aplicación presupuestaria 33.101.921O.227.06 del Instituto Nacional de Administración Pública, ¿qué código corresponde a un programa de gasto del anexo I de la Orden HAC/557/2026, de 3 de junio?"
  options:
  - id: a
    text:
      es: "El código 33.101 de la aplicación."
  - id: b
    correct: true
    text:
      es: "El código 921O de la aplicación."
  - id: c
    text:
      es: "El código 227.06 de la aplicación."
  - id: d
    text:
      es: "El código 227 de la aplicación."
  explanation:
    es: "El anexo I recoge el programa 921O «Formación del personal de las Administraciones Públicas», que es el que figura en la aplicación. El 33.101 es la parte orgánica, que identifica el organismo. El 227.06 es la parte económica, y el 227 es su concepto «Trabajos realizados por otras empresas y profesionales»."
  citation: "anexo I Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2022-22128-art-8
- id: m05-l02-q284
  prompt:
    es: "Un organismo autónomo debe pagar un tributo local con cargo al crédito 225.02 «Tributos locales», ya agotado, y queda crédito en el 225.00 del mismo programa. ¿Puede atenderse el pago con este sin modificación presupuestaria?"
  options:
  - id: a
    text:
      es: "Sí, porque los dos créditos son subconceptos de un mismo concepto 225."
  - id: b
    correct: true
    text:
      es: "No, porque la Ley de Presupuestos Generales del Estado declara vinculante el crédito 225.02."
  - id: c
    text:
      es: "Sí, porque los tributos se especifican a nivel de artículo en los organismos autónomos."
  - id: d
    text:
      es: "No, porque en los organismos autónomos cada subconcepto vincula por sí solo, sin excepción alguna."
  explanation:
    es: "El artículo 8.Uno.4 de la Ley 31/2022, de presupuestos prorrogados, declara vinculante el crédito 225.02 «Tributos locales» en el Estado, los organismos autónomos y las entidades del apartado 4.º de su artículo 1.a): no comparte crédito con el 225.00, y agotado necesita una modificación. Pertenecer al mismo concepto no basta, porque el 225.02 vincula por sí solo. En los organismos autónomos los gastos corrientes en bienes y servicios se especifican a nivel de capítulo, no de artículo (art. 44.1 LGP). Tampoco es regla general que cada subconcepto vincule por sí solo: el artículo 44.1 fija el nivel de concepto o de capítulo, y solo los créditos que enumeran el artículo 44.2 y la ley anual vinculan a su concreta clasificación."
  citation: "art. 8.Uno Ley 31/2022"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q286
  prompt:
    es: "Un organismo autónomo tiene un capítulo 2 de 3.000.000 de euros iniciales, sin otras modificaciones. Según el artículo 56.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué suplemento autoriza el Ministro de Hacienda?"
  options:
  - id: a
    text:
      es: "Un suplemento de 300.000 euros."
  - id: b
    correct: true
    text:
      es: "Un suplemento de 450.000 euros."
  - id: c
    text:
      es: "Un suplemento de 600.000 euros."
  - id: d
    text:
      es: "Un suplemento de 750.000 euros."
  explanation:
    es: "El 10 por ciento del capítulo son 300.000 euros y el 20 por ciento, 600.000. El suplemento de 450.000 supera el límite del Presidente o Director y no alcanza el 20 por ciento ni supera 1.000.000 de euros: lo autoriza el Ministro de Hacienda (art. 56.3.b). El de 300.000 no pasa del 10 por ciento ni de 500.000 euros, y lo autoriza el Presidente o Director (art. 56.3.a). El de 600.000 ya alcanza el 20 por ciento, y el de 750.000 lo supera: los dos van al Consejo de Ministros (art. 56.3.c)."
  citation: "art. 56.3.b LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "cantidad"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q287
  prompt:
    es: "Según el artículo 62.1.d) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la autorización de las ampliaciones de crédito previstas en el artículo 54.1 corresponde:"
  options:
  - id: a
    text:
      es: "al Consejo de Ministros, a propuesta del Ministro de Hacienda y del ministro afectado."
  - id: b
    text:
      es: "a las Cortes Generales, mediante la aprobación de una ley de crédito extraordinario."
  - id: c
    correct: true
    text:
      es: "al Ministro de Hacienda, sin perjuicio de las competencias del artículo 63.3."
  - id: d
    text:
      es: "a la Dirección General de Presupuestos, previo informe de la Intervención Delegada."
  explanation:
    es: "El artículo 62.1.d) atribuye al Ministro de Hacienda las ampliaciones de crédito del artículo 54.1, sin perjuicio de las competencias que el artículo 63.3 da a los Presidentes y Directores de las entidades de la Seguridad Social. El artículo 62.1.d) no da esa autorización al Consejo de Ministros. Las Cortes Generales intervienen por ley en ciertos créditos extraordinarios y suplementos (art. 55.2), no en las ampliaciones. La Dirección General de Presupuestos emite informes en otros procedimientos, pero no autoriza ampliaciones."
  citation: "art. 62.1.d) LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q288
  prompt:
    es: "Los gastos de una operación de canje de Deuda del Estado superan el crédito consignado para ellos. Según el artículo 54.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ese crédito:"
  options:
  - id: a
    text:
      es: "es ampliable solo en la parte destinada a intereses, y no en la de canje."
  - id: b
    correct: true
    text:
      es: "tiene la condición de ampliable, igual que los de intereses y amortización de principal."
  - id: c
    text:
      es: "no es ampliable, y la insuficiencia obliga a tramitar un suplemento de crédito del Estado."
  - id: d
    text:
      es: "solo puede reforzarse mediante un anticipo de Tesorería que acuerde el Gobierno."
  explanation:
    es: "El artículo 54.1 da la condición de ampliables a los créditos para obligaciones de la Deuda del Estado y de sus organismos autónomos, tanto por intereses y amortizaciones de principal como por gastos de emisión, conversión, canje o amortización. El canje está incluido, así que la ampliación no se limita a los intereses. Al ser ampliable el crédito, no procede el suplemento, que exige un crédito insuficiente y no ampliable (art. 55.1). El anticipo de Tesorería solo cabe en los casos del artículo 60.1, ligados a créditos extraordinarios y suplementos."
  citation: "art. 54.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q289
  prompt:
    es: "Según el artículo 9.Siete de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿cuál de las siguientes ampliaciones de crédito puede autorizar el titular de un ministerio en su presupuesto?"
  options:
  - id: a
    text:
      es: "Una del capítulo 1 financiada con baja en un crédito del capítulo 2 del mismo programa."
  - id: b
    text:
      es: "Una del capítulo 2 financiada con baja en un crédito del capítulo 1 del mismo programa."
  - id: c
    text:
      es: "Una del capítulo 1 financiada con baja en el Fondo de Contingencia de ejecución presupuestaria."
  - id: d
    correct: true
    text:
      es: "Una del capítulo 1 financiada con baja en un crédito de retribuciones básicas del mismo capítulo."
  explanation:
    es: "El artículo 9.Siete atribuye a los titulares de los ministerios, en sus presupuestos, las ampliaciones del capítulo 1 «Gastos de personal» que se financien con cargo a créditos del mismo capítulo. La ampliación del capítulo 1 con baja en el capítulo 2 o en el Fondo de Contingencia no se financia dentro del capítulo 1, y la del capítulo 2 no es una ampliación del capítulo 1: esas quedan en la regla general del artículo 62.1.d) LGP, que da las ampliaciones al Ministro de Hacienda."
  citation: "art. 9.Siete Ley 31/2022"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q290
  prompt:
    es: "Un ministerio ingresa en el ejercicio el precio de la venta de un edificio que formaba parte de su inmovilizado. Según el artículo 53.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ese ingreso:"
  options:
  - id: a
    text:
      es: "permite ampliar crédito, por tratarse de un ingreso no previsto en el presupuesto inicial."
  - id: b
    text:
      es: "se incorpora como remanente de crédito al presupuesto del ejercicio siguiente."
  - id: c
    correct: true
    text:
      es: "puede dar lugar a una generación de crédito, por proceder de una enajenación de inmovilizado."
  - id: d
    text:
      es: "no genera crédito, porque solo lo generan las ventas de bienes corrientes y servicios."
  explanation:
    es: "El artículo 53.2.c) incluye las enajenaciones de inmovilizado entre los ingresos del propio ejercicio que pueden dar lugar a generaciones. La ampliación no depende de un ingreso: la tienen los créditos ampliables del artículo 54. La incorporación lleva a un ejercicio los remanentes de crédito del anterior (art. 58), no los ingresos. El artículo 53.2 no limita la generación a las ventas de bienes corrientes: su letra b) habla de ventas de bienes y prestación de servicios, y la letra c) añade las enajenaciones de inmovilizado."
  citation: "art. 53.2 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q291
  prompt:
    es: "Según el artículo 63.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con cuál de los siguientes ingresos puede el titular de un ministerio autorizar una generación de crédito?"
  options:
  - id: a
    text:
      es: "La venta de un solar que formaba parte del inmovilizado del ministerio."
  - id: b
    text:
      es: "La venta de publicaciones que el propio ministerio edita y distribuye."
  - id: c
    correct: true
    text:
      es: "El reembolso de un préstamo que el ministerio había concedido a una entidad."
  - id: d
    text:
      es: "Unos ingresos que una ley afecta a la realización de una actuación determinada."
  explanation:
    es: "El artículo 63.1.b) da a los titulares de los ministerios, previo informe favorable de la Intervención Delegada, las generaciones de los párrafos a), d) y f) del artículo 53.2, y el reembolso de préstamos es el párrafo d). La venta de un solar del inmovilizado es una enajenación de inmovilizado, párrafo c). La venta de publicaciones es una venta de bienes, párrafo b), y los ingresos legalmente afectados son el párrafo e). El artículo 62.1.b) da al Ministro de Hacienda las del párrafo c) y, en el presupuesto del Estado, las de los párrafos b) y e)."
  citation: "art. 63.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q292
  prompt:
    es: "Señale la afirmación correcta sobre la generación de crédito que origina la aportación de una fundación privada a un ministerio para financiar conjuntamente gastos comprendidos en los fines de este:"
  options:
  - id: a
    correct: true
    text:
      es: "La autoriza el titular del ministerio, previo informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "La autoriza el Ministro de Hacienda, porque el ingreso procede de una persona jurídica privada."
  - id: c
    text:
      es: "No cabe, porque solo generan crédito las aportaciones entre entidades del sector público."
  - id: d
    text:
      es: "Puede hacerse antes del ingreso, si la fundación asume un compromiso firme de aportación."
  explanation:
    es: "El artículo 53.2.a) incluye las aportaciones de otras personas naturales o jurídicas al Estado para financiar conjuntamente gastos de sus fines, y el artículo 63.1.b) da esas generaciones al titular del ministerio, previo informe favorable de la Intervención Delegada. El Ministro de Hacienda autoriza las del párrafo c) y, en el Estado, las de los párrafos b) y e) (art. 62.1.b); el origen privado del ingreso no cambia el órgano. El artículo 53.2.a) no limita las aportaciones al sector público. El artículo 53.3 solo admite generar con el compromiso firme de aportación en los organismos autónomos y la Seguridad Social; en el Estado, la generación exige que se haya efectuado el ingreso."
  citation: "art. 63.1.b) LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q293
  prompt:
    es: "Según el artículo 63.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con cuál de los siguientes ingresos puede el Presidente o Director de un organismo autónomo autorizar una generación de crédito en su presupuesto?"
  options:
  - id: a
    text:
      es: "La venta de un inmueble que formaba parte del inmovilizado del organismo."
  - id: b
    text:
      es: "Un préstamo que el organismo recibe de una entidad financiera en el ejercicio."
  - id: c
    text:
      es: "Los remanentes de crédito que el organismo no comprometió en el ejercicio anterior y sigue sin aplicar."
  - id: d
    correct: true
    text:
      es: "Una aportación del Estado para financiar conjuntamente gastos de los fines del organismo."
  explanation:
    es: "El artículo 63.2 da a los Presidentes y Directores, en sus presupuestos, las generaciones de los párrafos b) y e) del artículo 53.2 y las competencias que el artículo 63 da a los ministros, entre ellas las generaciones del párrafo a), la aportación del Estado a los organismos autónomos (art. 63.1.b). La venta de un inmueble del inmovilizado es el párrafo c), que el artículo 62.1.b) reserva al Ministro de Hacienda. Un préstamo recibido no figura entre los ingresos que enumera el artículo 53.2. Los remanentes de crédito del ejercicio anterior se incorporan (art. 58), no generan crédito."
  citation: "art. 63.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
