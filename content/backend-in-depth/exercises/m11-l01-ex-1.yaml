- id: m11-l01-q07
  prompt:
    en: A pipeline applies `partitioningBy(predicate, counting())` to a stream in which no element matches the predicate.
      Which statement about the returned map is correct?
  options:
  - id: a
    text:
      en: Its `true` entry is `null`, because no element reached the downstream collector
  - id: b
    text:
      en: It is an unmodifiable map, as the documentation guarantees for this collector
  - id: c
    text:
      en: Its `true` entry is an empty `List`, whatever the downstream collector is
  - id: d
    correct: true
    text:
      en: It holds both a `false` and a `true` key, so the empty partition still appears
  explanation:
    en: The map always contains mappings for both `false` and `true`, so the empty partition still appears. The
      claim of a `null` entry is wrong because the value of an empty partition comes from the supplier and the finisher
      of the downstream collector. The claim of an unmodifiable map is wrong because there are no guarantees on
      the type, mutability, serializability or thread-safety of the returned map. The claim of an empty `List` is
      wrong because the values of the map are the results of the downstream reduction, here a count.
  citation: javadoc-collectors#partitioningBy(java.util.function.Predicate,java.util.stream.Collector)
- id: m11-l01-q08
  prompt:
    en: In `Collectors.toMap(keyMapper, valueMapper, mergeFunction)`, two elements of the stream produce equal keys.
      Which statement about how the collector treats them is correct?
  options:
  - id: a
    text:
      en: It throws an exception unconditionally, as every form of `toMap` does
  - id: b
    text:
      en: The merge function runs only when the two mapped values are themselves equal
  - id: c
    correct: true
    text:
      en: The value mapping function is applied to each equal element, and the results are merged with the merge
        function
  - id: d
    text:
      en: The returned map is always a `HashMap`
  explanation:
    en: When the mapped keys are duplicates, the value mapping function is applied to each equal element and the
      results are merged with the merge function. The claim of an unconditional exception is wrong because only
      the other forms of `toMap` use a merge function that throws, while this form lets the caller write a flexible
      merge policy. The claim that equal values trigger the merge is wrong because the merge function resolves collisions
      between values associated with the same key. The claim of a `HashMap` is wrong because there are no guarantees
      on the type of the returned map.
  citation: javadoc-collectors#toMap(java.util.function.Function,java.util.function.Function,java.util.function.BinaryOperator)
- id: m11-l01-q09
  prompt:
    en: Which built-in gatherer of `java.util.stream.Gatherers` is a stateful many-to-one gatherer that constructs
      an aggregate incrementally and emits it when no more input elements exist?
  options:
  - id: a
    text:
      en: '`scan`'
  - id: b
    correct: true
    text:
      en: '`fold`'
  - id: c
    text:
      en: '`windowSliding`'
  - id: d
    text:
      en: '`mapConcurrent`'
  explanation:
    en: '`fold` is the stateful many-to-one gatherer that builds an aggregate incrementally and emits it at the
      end of the input. `scan` is wrong because it is a one-to-one gatherer that passes each next element downstream.
      `windowSliding` is wrong because it is a many-to-many gatherer that emits lists of a supplied size. `mapConcurrent`
      is wrong because it is a one-to-one gatherer that invokes a function for each input element concurrently.'
  citation: jep-485#Built-in-gatherers
- id: m11-l01-q10
  prompt:
    en: A pipeline puts side-effects in its behavioral parameters, and nothing is explicitly stated about them.
      What does the stream package documentation say may happen to such a parameter?
  options:
  - id: a
    text:
      en: It always runs on the same thread as the other operations on the same element
  - id: b
    text:
      en: Its side-effects are visible to other threads once the terminal operation returns
  - id: c
    text:
      en: In a pipeline constrained to encounter order, it is applied to the elements in that order
  - id: d
    correct: true
    text:
      en: The implementation may elide it, so it is not always invoked, if the result is unaffected
  explanation:
    en: A stream implementation is free to elide operations or entire stages when it can prove that doing so would
      not affect the result, so a behavioral parameter may never be invoked. The claim of one thread is wrong because
      there is no guarantee that different operations on the same element run in the same thread. The claim of visibility
      is wrong because there is no guarantee about the visibility of side-effects to other threads. The claim of
      encounter order is wrong because no guarantees are made about the order in which the mapper function is applied
      to individual elements.
  citation: javadoc-stream-package#SideEffects
- id: m11-l01-q11
  prompt:
    en: In the three-argument form of `Stream.reduce` with an identity, an accumulator and a combiner, which role
      does the combiner function play?
  options:
  - id: a
    text:
      en: It is applied once per element to update the running total
  - id: b
    text:
      en: It supplies the seed value and the default result for empty input
  - id: c
    text:
      en: It maps each element to the result type before the accumulator runs
  - id: d
    correct: true
    text:
      en: In a parallel reduction it combines the partial accumulations computed for the partitions of the input
  explanation:
    en: The combiner is necessary in parallel reductions, where the input is partitioned, a partial accumulation
      is computed for each partition and the partial results are combined. The claim of a per-element update is
      wrong because the combiner combines two partial results into a new partial result. The claim of a seed value
      is wrong because the identity element is the seed and the default result. The claim of a mapping step is wrong
      because the mapping is incorporated into the accumulation step.
  citation: javadoc-stream-package#Reduction
- id: m11-l01-q12
  prompt:
    en: A pipeline calls `sorted()` and then takes the first element. According to the stream package documentation,
      why can the pipeline not produce a result as soon as the first element arrives?
  options:
  - id: a
    correct: true
    text:
      en: Sorting cannot produce any results until all elements of the stream have been seen
  - id: b
    text:
      en: '`sorted()` is a stateless operation, so it waits for the terminal operation to run'
  - id: c
    text:
      en: Intermediate operations are eager, so `sorted()` runs to completion before the terminal operation starts
  - id: d
    text:
      en: A pipeline with a stateful operation cannot run in parallel and falls back to a sequential pass
  explanation:
    en: Sorting cannot produce any results until all elements of the stream have been seen. The claim that `sorted()`
      is stateless is wrong because stateful operations such as `distinct` and `sorted` may incorporate state from
      previously seen elements. The claim that intermediate operations are eager is wrong because traversal of the
      pipeline source does not begin until the terminal operation is executed. The claim of a sequential fallback
      is wrong because under parallel computation such pipelines may require multiple passes or buffer significant
      data.
  citation: javadoc-stream-package#StreamOps
