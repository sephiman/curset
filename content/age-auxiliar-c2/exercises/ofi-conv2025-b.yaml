- id: q061
  kind: single_choice
  prompt:
    es: 'Conforme lo determinado por el Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba
      el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social,
      se considera infracción muy grave:'
  options:
  - id: a
    text:
      es: Los actos discriminatorios u omisiones que supongan directa o indirectamente un trato menos favorable
        a la persona con discapacidad en relación con otra persona que se encuentre en situación análoga o comparable.
    correct: false
  - id: b
    text:
      es: La imposición abusiva de cualquier forma de renuncia total o parcial a los derechos de las personas por
        motivo de o por razón de su discapacidad, basada en una posición de ventaja.
    correct: false
  - id: c
    text:
      es: Las acciones que deliberadamente generen un grave perjuicio económico o profesional para las personas
        con discapacidad.
    correct: true
  - id: d
    text:
      es: La coacción, amenaza, represalia ejercida sobre la persona con discapacidad o sobre otras personas físicas
        o jurídicas, que hayan entablado o pretendan entablar cualquier clase de acción legal, reclamación, denuncia
        o participen en procedimientos ya iniciados para exigir el cumplimiento del principio de igualdad de oportunidades,
        así como la tentativa de ejercitar tales actos.
