# anchor: boe-a-1987-12636-art-2
- id: m04-l07-q048
  prompt:
    es: "Según el artículo 2.1 del texto refundido de Ley de Clases Pasivas del Estado, aprobado por el Real Decreto Legislativo 670/1987, de 30 de abril, constituyen el ámbito personal de cobertura del Régimen, entre otros:"
  options:
  - id: a
    correct: true
    text:
      es: "Los funcionarios de carrera civiles de la Administración del Estado y los funcionarios en prácticas"
  - id: b
    text:
      es: "Los funcionarios de carrera de la Administración Local y los de las Comunidades Autónomas"
  - id: c
    text:
      es: "El personal laboral fijo de la Administración General del Estado y de sus organismos"
  - id: d
    text:
      es: "Los funcionarios de carrera propios de las Comunidades Autónomas y su personal eventual"
  explanation:
    es: "El artículo 2.1 incluye en su letra a) a «los funcionarios de carrera de carácter civil de la Administración del Estado» y en su letra h) a «los funcionarios en prácticas». No incluye a los funcionarios locales ni a los propios de las Comunidades Autónomas: solo al personal estatal transferido (letra g). El personal laboral y el eventual no están en la lista."
  citation: "art. 2.1 TRLCPE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1987-12636-art-28
- id: m04-l07-q051
  prompt:
    es: "Según el artículo 28.2.a) del texto refundido de Ley de Clases Pasivas del Estado, ¿cómo se declara la jubilación forzosa?"
  options:
  - id: a
    correct: true
    text:
      es: "Automáticamente, al cumplir la edad legalmente señalada"
  - id: b
    text:
      es: "A instancia del funcionario, al cumplir la edad legalmente señalada"
  - id: c
    text:
      es: "De oficio, previo dictamen preceptivo y vinculante del órgano médico"
  - id: d
    text:
      es: "A instancia de parte, con sesenta años de edad y treinta de servicios"
  explanation:
    es: "El artículo 28.2.a) dice que la jubilación forzosa «se declarará automáticamente al cumplir dicho personal la edad legalmente señalada». No depende de una solicitud. El dictamen del órgano médico es de la jubilación por incapacidad permanente. La solicitud con sesenta años y treinta de servicios es la jubilación voluntaria."
  citation: "art. 28.2.a) TRLCPE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12636-art-28
- id: m04-l07-q052
  prompt:
    es: "Según el artículo 28.2.a) del texto refundido de Ley de Clases Pasivas del Estado, puede pedir prórroga en el servicio activo quien, al cumplir la edad de jubilación forzosa:"
  options:
  - id: a
    text:
      es: "Tenga reconocidos diez años de servicios efectivos y no haya completado los quince exigidos"
  - id: b
    correct: true
    text:
      es: "Tenga reconocidos doce años de servicios efectivos y no haya completado los quince exigidos"
  - id: c
    text:
      es: "Tenga reconocidos quince años de servicios efectivos y no haya completado los treinta exigidos"
  - id: d
    text:
      es: "Tenga reconocidos ocho años de servicios efectivos y no haya completado los doce exigidos"
  explanation:
    es: "El artículo 28.2.a) permite la prórroga a quien tuviera «reconocidos doce años de servicios efectivos al Estado y no hubiera completado los quince que, como mínimo, se exigen» para la pensión. Diez y ocho años no son la cifra del artículo. Treinta años son de la jubilación voluntaria; con quince ya se tiene derecho a pensión."
  citation: "art. 28.2.a) TRLCPE"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1987-12636-art-28
- id: m04-l07-q053
  prompt:
    es: "De acuerdo con el artículo 28.2.b) del texto refundido de Ley de Clases Pasivas del Estado, la jubilación voluntaria se declara a instancia de parte si el interesado tiene cumplidos:"
  options:
  - id: a
    text:
      es: "Sesenta y cinco años de edad y treinta años de servicios efectivos al Estado"
  - id: b
    correct: true
    text:
      es: "Sesenta años de edad y treinta años de servicios efectivos al Estado"
  - id: c
    text:
      es: "Sesenta años de edad y quince años de servicios efectivos al Estado"
  - id: d
    text:
      es: "Sesenta y un años de edad y treinta y cinco de servicios efectivos"
  explanation:
    es: "El artículo 28.2.b) exige que el interesado tenga «cumplidos los sesenta años de edad y reconocidos treinta años de servicios efectivos al Estado». Sesenta y cinco y sesenta y un años no son la edad del artículo. Quince años son el período de carencia de la pensión, no el requisito de la jubilación voluntaria."
  citation: "art. 28.2.b) TRLCPE"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1987-12636-art-28
- id: m04-l07-q054
  prompt:
    es: "Según el artículo 28.2.c) del texto refundido de Ley de Clases Pasivas del Estado, la jubilación por incapacidad permanente para el servicio se declara:"
  options:
  - id: a
    text:
      es: "Solo a instancia de parte, según el dictamen preceptivo y no vinculante del órgano médico"
  - id: b
    text:
      es: "Solo de oficio, cuando se agota el plazo máximo de duración de la incapacidad temporal"
  - id: c
    correct: true
    text:
      es: "De oficio o a instancia de parte, según el dictamen preceptivo y vinculante del órgano médico"
  - id: d
    text:
      es: "De oficio o a instancia de parte, según el dictamen facultativo del órgano médico"
  explanation:
    es: "El artículo 28.2.c) dice que se declara «de oficio o a instancia de parte», «de acuerdo con el dictamen preceptivo y vinculante del órgano médico». No es solo a instancia de parte, ni solo de oficio. El dictamen es vinculante y preceptivo, no facultativo."
  citation: "art. 28.2.c) TRLCPE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1987-12636-art-29
- id: m04-l07-q055
  prompt:
    es: "Según el artículo 29 del texto refundido de Ley de Clases Pasivas del Estado, ¿cuántos años de servicios efectivos al Estado exige la pensión ordinaria de jubilación o retiro?"
  options:
  - id: a
    text:
      es: "Doce años de servicios efectivos al Estado"
  - id: b
    text:
      es: "Treinta años de servicios efectivos al Estado"
  - id: c
    text:
      es: "Veinte años de servicios efectivos al Estado"
  - id: d
    correct: true
    text:
      es: "Quince años de servicios efectivos al Estado"
  explanation:
    es: "El artículo 29 exige «haber completado quince años de servicios efectivos al Estado». Doce años son los que permiten pedir la prórroga del artículo 28.2.a). Treinta años son el requisito de la jubilación voluntaria. Veinte años no aparecen en estos artículos."
  citation: "art. 29 TRLCPE"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1987-12636-art-35
- id: m04-l07-q056
  prompt:
    es: "En el Régimen de Clases Pasivas, ¿cuál de las siguientes es correcta sobre el causante de los derechos pasivos de sus familiares?"
  options:
  - id: a
    correct: true
    text:
      es: "No necesita haber completado ningún periodo mínimo de servicios efectivos al Estado"
  - id: b
    text:
      es: "Debe haber completado quince años de servicios efectivos prestados al Estado"
  - id: c
    text:
      es: "Debe haber completado al menos cinco años de servicios efectivos al Estado"
  - id: d
    text:
      es: "Debe haber fallecido en servicio activo, sin haber sido declarado jubilado"
  explanation:
    es: "El artículo 35 dice que no es preciso «que el causante de los mismos haya completado ningún periodo mínimo de prestación de servicios efectivos al Estado». Los quince años son la carencia de la pensión de jubilación propia. Cinco años no aparecen en el artículo. Tampoco se exige morir en activo."
  citation: "art. 35 TRLCPE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1987-12636-art-39
- id: m04-l07-q057
  prompt:
    es: "En el Régimen de Clases Pasivas del Estado, ¿qué constituye la base reguladora de la pensión de viudedad?"
  options:
  - id: a
    text:
      es: "El último haber regulador del fallecido en servicio activo"
  - id: b
    text:
      es: "La media de sus retribuciones de los últimos quince años"
  - id: c
    text:
      es: "Las retribuciones básicas del fallecido en el mes de su muerte"
  - id: d
    correct: true
    text:
      es: "La pensión de jubilación o retiro del fallecido"
  explanation:
    es: "El artículo 39.1 dice que la base reguladora de la pensión de viudedad «estará constituida por la pensión de jubilación o retiro del fallecido o declarado fallecido». Los artículos 42.1 y 45.1 aplican la misma base a la orfandad y a la pensión en favor de los padres. No es el haber regulador, una media de retribuciones ni las retribuciones básicas del último mes."
  citation: "art. 39.1 TRLCPE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1987-12636-art-38
- id: m04-l07-q058
  prompt:
    es: "Según el artículo 38.1 del texto refundido de Ley de Clases Pasivas del Estado, si el fallecimiento deriva de enfermedad común no sobrevenida tras el vínculo conyugal, la pensión de viudedad exige que el matrimonio se haya celebrado:"
  options:
  - id: a
    text:
      es: "Con dos años de antelación como mínimo a la fecha del fallecimiento"
  - id: b
    correct: true
    text:
      es: "Con un año de antelación como mínimo a la fecha del fallecimiento"
  - id: c
    text:
      es: "Con seis meses de antelación como mínimo a la fecha del fallecimiento"
  - id: d
    text:
      es: "Con tres años de antelación como mínimo a la fecha del fallecimiento"
  explanation:
    es: "El artículo 38.1 exige que «el matrimonio se hubiera celebrado con un año de antelación como mínimo a la fecha del fallecimiento». Dos años es otra cifra del mismo párrafo: la convivencia como pareja de hecho que, sumada al matrimonio, evita el requisito. Seis meses y tres años no están en el artículo."
  citation: "art. 38.1 TRLCPE"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-1987-12636-art-41
- id: m04-l07-q060
  prompt:
    es: "Según el artículo 41.1 del texto refundido de Ley de Clases Pasivas del Estado, tienen derecho a pensión de orfandad los hijos del causante:"
  options:
  - id: a
    correct: true
    text:
      es: "Menores de veintiún años o incapacitados para todo trabajo antes de esa edad o del fallecimiento"
  - id: b
    text:
      es: "Menores de dieciocho años o incapacitados para todo trabajo antes de esa edad o del fallecimiento"
  - id: c
    text:
      es: "Menores de dieciséis años o incapacitados para todo trabajo antes de esa edad o del fallecimiento"
  - id: d
    text:
      es: "Menores de veintiún años, solo si no existe cónyuge supérstite con derecho a pensión"
  explanation:
    es: "El artículo 41.1 da derecho a los hijos «menores de veintiún años, así como los que estuvieran incapacitados para todo trabajo antes del cumplimiento de dicha edad o de la fecha del fallecimiento del causante». Dieciocho y dieciséis años no son la edad del artículo. El derecho existe «con independencia de la existencia o no de cónyuge supérstite»."
  citation: "art. 41 TRLCPE"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1987-12636-art-42
- id: m04-l07-q061
  prompt:
    es: "Según el artículo 42.2 del texto refundido de Ley de Clases Pasivas del Estado, si existen varios hijos con derecho a pensión de orfandad, a cada uno se le aplica:"
  options:
  - id: a
    text:
      es: "El 25 por 100 de la base reguladora, sin ningún incremento"
  - id: b
    text:
      es: "El 10 por 100 de la base reguladora, más un 15 por 100 adicional para cada hijo"
  - id: c
    text:
      es: "El 15 por 100 de la base reguladora, más el prorrateo por cabeza de un único 10 por 100"
  - id: d
    correct: true
    text:
      es: "El 10 por 100 de la base reguladora, más el prorrateo por cabeza de un único 15 por 100"
  explanation:
    es: "El artículo 42.2 aplica «el 10 por 100, en el supuesto de que existieran varios hijos», y añade «el prorrateo por cabeza de un único 15 por 100 de la base reguladora». El 25 por 100 es para un solo hijo. El 15 por 100 se reparte entre todos, no se suma entero a cada uno. La opción del 15 por 100 con prorrateo del 10 invierte las dos cifras."
  citation: "art. 42.2 TRLCPE"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-1987-12636-art-44
- id: m04-l07-q062
  prompt:
    es: "Según el artículo 44.1 del texto refundido de Ley de Clases Pasivas del Estado, el padre y la madre del causante tienen derecho a la pensión en su favor siempre que:"
  options:
  - id: a
    text:
      es: "Convivieran con él al fallecer, aunque haya cónyuge supérstite o hijos con derecho a pensión"
  - id: b
    text:
      es: "Dependieran económicamente de él al fallecer y tengan cumplidos sesenta y cinco años"
  - id: c
    correct: true
    text:
      es: "Dependieran económicamente de él al fallecer y no haya cónyuge supérstite ni hijos con derecho a pensión"
  - id: d
    text:
      es: "No haya cónyuge supérstite ni hijos del fallecido, cualquiera que sea su situación económica"
  explanation:
    es: "El artículo 44.1 exige que los padres «dependieran económicamente de éste al momento de su fallecimiento y que no existan cónyuge supérstite o hijos del fallecido con derecho a pensión». La convivencia no basta y no se comparte la pensión con el cónyuge o los hijos. El artículo no fija una edad. La dependencia económica es requisito."
  citation: "art. 44.1 TRLCPE"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1987-12636-art-44
- id: m04-l07-q063
  prompt:
    es: "Fallece un funcionario incluido en Clases Pasivas del que dependía económicamente su madre, y quedan su cónyuge y un hijo con derecho a pensión. La madre tendrá derecho a la pensión en favor de los padres:"
  options:
  - id: a
    text:
      es: "Desde el fallecimiento del causante, en concurrencia con el cónyuge y con el hijo del causante"
  - id: b
    correct: true
    text:
      es: "Desde que fallezca el último de esos beneficiarios o pierda la aptitud para ser pensionista"
  - id: c
    text:
      es: "En ningún caso, porque la existencia de cónyuge excluye ese derecho de forma definitiva"
  - id: d
    text:
      es: "Desde que el hijo cumpla veintiún años, aunque el cónyuge siga cobrando su pensión"
  explanation:
    es: "El segundo párrafo del artículo 44.1 del texto refundido de Ley de Clases Pasivas dice que, si hay cónyuge o hijos con derecho, los padres «sólo tendrán derecho a la pensión a partir del momento del fallecimiento del cónyuge» o del último hijo, o de la pérdida de aptitud del último beneficiario. No concurren desde el principio. El derecho no se pierde para siempre. No basta con que el hijo deje de cobrar si el cónyuge sigue siendo pensionista."
  citation: "art. 44.1 TRLCPE"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1987-12636-art-45
- id: m04-l07-q064
  prompt:
    es: "Según el artículo 45.2 del texto refundido de Ley de Clases Pasivas del Estado, ¿qué porcentaje fijo se aplica, con carácter general, a la base reguladora de cada pensión en favor de los padres?"
  options:
  - id: a
    correct: true
    text:
      es: "El 15 por 100 de la base reguladora"
  - id: b
    text:
      es: "El 25 por 100 de la base reguladora"
  - id: c
    text:
      es: "El 10 por 100 de la base reguladora"
  - id: d
    text:
      es: "El 20 por 100 de la base reguladora"
  explanation:
    es: "El artículo 45.2 aplica «el porcentaje fijo del 15 por 100 para la determinación de cada una de las pensiones». El 25 por 100 es la orfandad de un solo hijo y el 10 por 100 la de cada hijo cuando hay varios. El 20 por 100 no aparece."
  citation: "art. 45.2 TRLCPE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1975-13887-preambulo
- id: m04-l07-q065
  prompt:
    es: "Según el preámbulo de la Ley 29/1975, de 27 de junio, sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿cuál de las siguientes describe la Mutualidad que esa ley crea?"
  options:
  - id: a
    text:
      es: "Una Mutualidad General única para todos los funcionarios civiles y militares de la Administración del Estado"
  - id: b
    text:
      es: "Una Mutualidad General única para los funcionarios de carrera del Estado y de la Administración Local"
  - id: c
    correct: true
    text:
      es: "Una Mutualidad General única para todos los funcionarios de carrera de la Administración Civil del Estado"
  - id: d
    text:
      es: "Una mutualidad propia de cada departamento ministerial, coordinada por una Mutualidad General"
  explanation:
    es: "El preámbulo dice: «La nueva Ley crea una Mutualidad General única para todos los funcionarios de carrera de la Administración Civil del Estado». No incluye a los funcionarios militares ni a los de la Administración Local. Lo que crea es una sola Mutualidad General, no una mutualidad por departamento."
  citation: "preámbulo Ley 29/1975"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-20
- id: m04-l07-q066
  prompt:
    es: "Según el artículo 20.2 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, a efectos de cómputo de plazos hay en todo caso nuevo proceso patológico cuando:"
  options:
  - id: a
    text:
      es: "Las licencias se han interrumpido durante un periodo mínimo de tres meses"
  - id: b
    text:
      es: "Las licencias se han interrumpido durante un periodo mínimo de doce meses"
  - id: c
    text:
      es: "El funcionario se ha reincorporado al servicio activo, aunque sea un solo día"
  - id: d
    correct: true
    text:
      es: "Las licencias se han interrumpido durante un periodo mínimo de seis meses"
  explanation:
    es: "El artículo 20.2 dice que hay nuevo proceso patológico cuando las enfermedades son diferentes o sin relación directa con las del anterior «y, en todo caso, cuando se hayan interrumpido las licencias durante un periodo mínimo de 6 meses». Tres y doce meses no son la cifra del artículo. Una reincorporación breve no basta por sí sola: hace falta esa interrupción mínima o una enfermedad distinta."
  citation: "art. 20.2 RDL 4/2000"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1997-9874-art-4
- id: m04-l07-q067
  prompt:
    es: "¿Cuál de los siguientes es el órgano ejecutivo de la MUFACE, según el artículo 4.2 de su Estatuto, aprobado por el Real Decreto 577/1997, de 18 de abril?"
  options:
  - id: a
    text:
      es: "La Presidencia del organismo autónomo"
  - id: b
    text:
      es: "El Consejo General del organismo autónomo"
  - id: c
    correct: true
    text:
      es: "La Dirección del organismo autónomo"
  - id: d
    text:
      es: "La Secretaría General del organismo autónomo"
  explanation:
    es: "El artículo 4.2 dice: «El órgano ejecutivo del organismo autónomo es la Dirección». La Presidencia y el Consejo General son los órganos de gobierno del artículo 4.1. El Secretario general actúa como secretario del Consejo General, con voz pero sin voto."
  citation: "art. 4.2 RD 577/1997"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1987-12636-art-30
- id: m04-l07-q068
  prompt:
    es: "Según el artículo 30.1 del texto refundido de Ley de Clases Pasivas del Estado, los haberes reguladores que sirven para determinar las pensiones de Clases Pasivas se establecen:"
  options:
  - id: a
    text:
      es: "En un real decreto aprobado cada año por el Consejo de Ministros"
  - id: b
    text:
      es: "En una orden del Ministerio de Hacienda dictada en cada ejercicio económico"
  - id: c
    text:
      es: "En el propio texto refundido de Ley de Clases Pasivas, con carácter permanente"
  - id: d
    correct: true
    text:
      es: "En la Ley de Presupuestos Generales del Estado para cada ejercicio económico"
  explanation:
    es: "El artículo 30.1 dice que los haberes reguladores «se establecerán en la Ley de Presupuestos Generales del Estado para cada ejercicio económico». No los fija un real decreto ni una orden ministerial. El texto refundido remite a la Ley de Presupuestos y no trae cuantías permanentes."
  citation: "art. 30.1 TRLCPE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1997-9874-art-1
- id: m04-l07-q070
  prompt:
    es: "Conforme al artículo 1.1 del Real Decreto 577/1997, de 18 de abril, la Mutualidad General de Funcionarias y Funcionarios Civiles del Estado tiene personalidad jurídica diferenciada, plena capacidad de obrar y:"
  options:
  - id: a
    text:
      es: "tesorería propia, pero un patrimonio integrado en el del Estado."
  - id: b
    text:
      es: "patrimonio propio, pero una tesorería integrada en la del Estado."
  - id: c
    text:
      es: "autonomía en su gestión, pero sin tesorería ni patrimonio propios."
  - id: d
    correct: true
    text:
      es: "tesorería y patrimonio propios y autonomía en su gestión."
  explanation:
    es: "El artículo 1.1 le atribuye «tesorería y patrimonio propios y autonomía en su gestión», junto con personalidad jurídica diferenciada y plena capacidad de obrar. Las demás opciones quitan uno de esos atributos: integran el patrimonio o la tesorería en los del Estado, o le niegan ambos."
  citation: "art. 1.1 RD 577/1997"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1987-12636-art-28
- id: m04-l07-q071
  prompt:
    es: "Conforme al artículo 28.3.b) del Real Decreto Legislativo 670/1987, de 30 de abril, la jubilación voluntaria de un funcionario civil de la Administración del Estado la acuerda, por regla general:"
  options:
  - id: a
    correct: true
    text:
