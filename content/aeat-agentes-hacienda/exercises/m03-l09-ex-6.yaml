# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0155
  prompt:
    es: "En relación con el contenido de la resolución que concede un aplazamiento o fraccionamiento, conforme al artículo 52.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Debe respetar los plazos y condiciones solicitados por el obligado."
  - id: b
    text:
      es: "Debe señalar los mismos plazos que ofreció la garantía aportada."
  - id: c
    correct: true
    text:
      es: "Puede señalar plazos y condiciones distintos de los solicitados."
  - id: d
    text:
      es: "Puede señalar plazos distintos, pero no condiciones distintas de las solicitadas."
  explanation:
    es: "La resolución puede señalar plazos y condiciones distintos de los solicitados (artículo 52.1). No está obligada a respetar lo pedido. La garantía no determina los plazos. La facultad alcanza tanto a los plazos como a las condiciones."
  citation: "art. 52.1 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "resolución"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0156
  prompt:
    es: "De acuerdo con el artículo 52.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en la resolución podrá exigirse y condicionarse el mantenimiento y eficacia del acuerdo de concesión del aplazamiento o fraccionamiento a que el solicitante:"
  options:
  - id: a
    text:
      es: "No solicite ningún otro aplazamiento durante la vigencia del acuerdo."
  - id: b
    correct: true
    text:
      es: "Se encuentre al corriente de sus obligaciones tributarias durante la vigencia del acuerdo."
  - id: c
    text:
      es: "Mantenga su domicilio fiscal en el mismo municipio durante la vigencia del acuerdo."
  - id: d
    text:
      es: "Aporte cada año un informe de auditoría de sus cuentas durante toda la vigencia del acuerdo."
  explanation:
    es: "El acuerdo puede condicionarse a que el solicitante esté al corriente de sus obligaciones tributarias durante su vigencia (artículo 52.2). No solicitar otros aplazamientos, no cambiar de domicilio fiscal o aportar auditorías anuales no son condiciones que el precepto prevea."
  citation: "art. 52.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "resolución"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0157
  prompt:
    es: "Según el artículo 52.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando un fraccionamiento incluye deudas en período voluntario y ejecutivo al solicitarse, no se acumulan en la misma fracción deudas de distinto período de ingreso, y se satisfarán en primer lugar:"
  options:
  - id: a
    text:
      es: "Las fracciones que incluyan las deudas que estaban en período voluntario."
  - id: b
    text:
      es: "Las fracciones de menor importe, con independencia del período de ingreso."
  - id: c
    correct: true
    text:
      es: "Las fracciones que incluyan las deudas que estaban en período ejecutivo."
  - id: d
    text:
      es: "Las fracciones que el obligado designe en su solicitud de fraccionamiento."
  explanation:
    es: "Se satisfacen primero las fracciones con las deudas que estaban en período ejecutivo (artículo 52.2). Invertir el orden contradice el texto. El importe de la fracción y la designación del obligado no son criterios del precepto."
  citation: "art. 52.2 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "resolución"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0158
  prompt:
    es: "Conforme al artículo 52.4.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la resolución es denegatoria y la solicitud se presentó en período voluntario, con la notificación del acuerdo denegatorio:"
  options:
  - id: a
    correct: true
    text:
      es: "Se iniciará el plazo de ingreso regulado en el artículo 62.2 de la Ley General Tributaria."
  - id: b
    text:
      es: "Se iniciará el período ejecutivo al día siguiente de la notificación."
  - id: c
    text:
      es: "Se iniciará un plazo de diez días para recurrir en reposición."
  - id: d
    text:
      es: "Se iniciará un nuevo plazo de solicitud de aplazamiento de un mes."
  explanation:
    es: "Con la notificación de la denegación se inicia el plazo de ingreso del artículo 62.2 de la Ley General Tributaria (artículo 52.4.a). El ejecutivo comienza solo si no se ingresa en ese plazo. El plazo de diez días y la nueva solicitud de un mes no figuran en el precepto."
  citation: "art. 52.4 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "resolución"
  - "denegación"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0161
  prompt:
    es: "Según el artículo 52.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué cabe contra la denegación de las solicitudes de aplazamiento o fraccionamiento?"
  options:
  - id: a
    text:
      es: "El recurso de alzada ante el órgano superior jerárquico."
  - id: b
    text:
      es: "El recurso contencioso-administrativo directamente ante el tribunal competente."
  - id: c
    text:
      es: "Un recurso extraordinario de revisión ante la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Solo el recurso de reposición o la reclamación económico-administrativa."
  explanation:
    es: "Contra la denegación solo caben el recurso de reposición o la reclamación económico-administrativa (artículo 52.5). El recurso de alzada, la vía contencioso-administrativa directa y el recurso extraordinario de revisión no son los previstos."
  citation: "art. 52.5 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "resolución"
  - "denegación"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0162
  prompt:
    es: "Conforme al artículo 52.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿en qué plazo debe notificarse la resolución de la solicitud de aplazamiento o fraccionamiento?"
  options:
  - id: a
    text:
      es: "Un plazo de tres meses."
  - id: b
    text:
      es: "Un plazo de un año."
  - id: c
    correct: true
    text:
      es: "Un plazo de seis meses."
  - id: d
    text:
      es: "Un plazo de dos meses."
  explanation:
    es: "La resolución debe notificarse en seis meses (artículo 52.6). Tres meses, dos meses y un año no son el plazo que fija el precepto."
  citation: "art. 52.6 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "resolución"
  - "plazos"
# anchor: boe-a-2003-23186-art-26
- id: m03-l09-q0163
  prompt:
    es: "Conforme al artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el interés de demora será el interés legal del dinero vigente a lo largo del período en el que aquel resulte exigible, incrementado en un 25 por ciento:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente."
  - id: b
    text:
      es: "Salvo que el órgano de recaudación fije otro porcentaje en cada procedimiento."
  - id: c
    text:
      es: "Sin que la Ley de Presupuestos Generales del Estado pueda establecer otro diferente."
  - id: d
    text:
      es: "Salvo que el obligado tributario solicite un porcentaje menor por dificultades económicas."
  explanation:
    es: "El interés de demora es el interés legal incrementado en un 25 por ciento, salvo que la Ley de Presupuestos Generales del Estado fije otro (artículo 26.6). La ley de presupuestos sí puede establecerlo. Ni el órgano de recaudación ni el obligado pueden alterar el porcentaje."
  citation: "art. 26.6 LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0166
  prompt:
    es: "Cuando solo el 60 por ciento de la deuda aplazada se garantiza con aval solidario de entidad de crédito, conforme al artículo 65.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se exige el interés legal, porque la mayor parte de la deuda está avalada."
  - id: b
    correct: true
    text:
      es: "Se exige el interés de demora general, porque el aval no cubre la totalidad de la deuda aplazada."
  - id: c
    text:
      es: "Se exige el interés legal sobre la parte avalada y el interés de demora sobre el resto."
  - id: d
    text:
      es: "Se exige el interés legal, porque cualquier garantía parcial reduce el interés de demora."
  explanation:
    es: "El interés legal se exige solo cuando la totalidad de la deuda aplazada se garantiza con aval solidario, sociedad de garantía recíproca o seguro de caución (artículo 65.4). Con una garantía parcial rige el interés de demora general. El precepto no prevé una división por tramos ni una reducción por garantía parcial."
  citation: "art. 65.4 LGT"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0167
  prompt:
    es: "¿Cuál es el interés exigible cuando la totalidad de la deuda aplazada se garantiza con una hipoteca sobre un inmueble, conforme al artículo 65.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El interés legal, porque la hipoteca garantiza la totalidad de la deuda."
  - id: b
    text:
      es: "El interés legal incrementado en un 25 por ciento solo mientras no se inscriba la hipoteca."
  - id: c
    correct: true
    text:
      es: "El interés de demora general, porque la hipoteca no es aval solidario ni seguro de caución."
  - id: d
    text:
      es: "Ninguno, porque la hipoteca equivale al pago de la deuda."
  explanation:
    es: "El interés legal se reserva a las deudas garantizadas en su totalidad con aval solidario de entidad de crédito o sociedad de garantía recíproca, o con certificado de seguro de caución (artículo 65.4). La hipoteca no figura entre ellos, y se aplica el interés de demora general. La inscripción registral no cambia el tipo. La hipoteca no equivale a pagar."
  citation: "art. 65.4 LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0168
  prompt:
    es: "De acuerdo con el artículo 53.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en caso de concesión del aplazamiento se calcularán intereses de demora sobre la deuda aplazada por el tiempo comprendido entre:"
  options:
  - id: a
    text:
      es: "El día de presentación de la solicitud y la fecha del vencimiento del plazo concedido."
  - id: b
    text:
      es: "El día siguiente al de la notificación del acuerdo de concesión y la fecha del vencimiento del plazo concedido."
  - id: c
    text:
      es: "El día siguiente al del vencimiento del plazo de ingreso en período voluntario y la fecha de notificación del acuerdo."
  - id: d
    correct: true
    text:
      es: "El día siguiente al del vencimiento del plazo de ingreso en período voluntario y la fecha del vencimiento del plazo concedido."
  explanation:
    es: "Los intereses van desde el día siguiente al del vencimiento del plazo voluntario hasta el vencimiento del plazo concedido (artículo 53.1). No empiezan con la solicitud ni con la notificación del acuerdo. No acaban en la notificación del acuerdo, sino en el vencimiento del plazo concedido."
  citation: "art. 53.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0169
  prompt:
    es: "Según el artículo 53.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿desde qué día se computan los intereses de demora de un aplazamiento concedido cuando el plazo de ingreso en período voluntario acabó el martes 20 de abril de 2027?"
  options:
  - id: a
    correct: true
    text:
      es: "El 21 de abril de 2027, día siguiente al vencimiento del plazo de ingreso en período voluntario."
  - id: b
    text:
      es: "El 20 de abril de 2027, último día del plazo de ingreso en período voluntario."
  - id: c
    text:
      es: "El 1 de mayo de 2027, primer día del mes siguiente al vencimiento voluntario."
  - id: d
    text:
      es: "El 21 de julio de 2027, día siguiente al vencimiento del plazo concedido."
  explanation:
    es: "Los intereses se calculan desde el día siguiente al del vencimiento del plazo voluntario (artículo 53.1): el 21 de abril de 2027. El 20 de abril es el último día de plazo y aún no hay demora. El 1 de mayo y el 21 de julio no son fechas del precepto, pues el 21 de julio es el día siguiente al fin del plazo concedido."
  citation: "art. 53.1 RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "intereses"
  - "cómputo"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0170
  prompt:
    es: "Según el artículo 53.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué ocurre con el recargo del período ejecutivo en la base de intereses de un aplazamiento solicitado en período ejecutivo?"
  options:
  - id: a
    text:
      es: "La base para el cálculo de intereses incluye el recargo del período ejecutivo."
  - id: b
    correct: true
    text:
      es: "La base para el cálculo de intereses no incluye el recargo del período ejecutivo."
  - id: c
    text:
      es: "La base incluye solo un recargo del período ejecutivo reducido."
  - id: d
    text:
      es: "La base incluye las costas del procedimiento de apremio."
  explanation:
    es: "Si el aplazamiento se solicitó en período ejecutivo, la base de los intereses no incluye el recargo del período ejecutivo (artículo 53.1). Incluirlo, total o parcialmente, o añadir las costas contradice el texto."
  citation: "art. 53.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0171
  prompt:
    es: "Conforme al artículo 53.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo deben ingresarse los intereses devengados por un aplazamiento concedido?"
  options:
  - id: a
    text:
      es: "En el plazo de diez días desde la concesión."
  - id: b
    text:
      es: "Antes de la formalización de la garantía."
  - id: c
    text:
      es: "Al día siguiente del vencimiento del plazo de ingreso en período voluntario."
  - id: d
    correct: true
    text:
      es: "Junto con la deuda aplazada."
  explanation:
    es: "Los intereses devengados se ingresan junto con la deuda aplazada (artículo 53.1). No hay un plazo propio de diez días, ni se exigen antes de formalizar la garantía, ni en el día siguiente al vencimiento voluntario."
  citation: "art. 53.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0172
  prompt:
    es: "Según el artículo 53.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo deben pagarse los intereses devengados por cada fracción de un fraccionamiento concedido?"
  options:
  - id: a
    text:
      es: "Al final, junto con la última fracción de la deuda."
  - id: b
    text:
      es: "Antes del vencimiento de la primera fracción de la deuda."
  - id: c
    correct: true
    text:
      es: "Junto con dicha fracción en el plazo correspondiente."
  - id: d
    text:
      es: "En un pago único, en el momento de notificarse el acuerdo."
  explanation:
    es: "En el fraccionamiento los intereses se calculan por cada fracción y se pagan junto con ella en su plazo (artículo 53.2). No se aplazan a la última fracción, ni se adelantan a la primera, ni se pagan de una vez al notificar el acuerdo."
  citation: "art. 53.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-53
- id: m03-l09-q0173
  prompt:
    es: "Conforme al artículo 53.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en caso de denegación de un aplazamiento solicitado en período ejecutivo, se liquidarán intereses:"
  options:
  - id: a
    text:
      es: "Desde la fecha de la solicitud, de conformidad con el artículo 52.4."
  - id: b
    text:
      es: "Desde la notificación de la denegación, de conformidad con el artículo 62.2 de la Ley."
  - id: c
    text:
      es: "Solo si se inicia el procedimiento de apremio, de conformidad con el artículo 54."
  - id: d
    correct: true
    text:
      es: "Una vez realizado el pago, de conformidad con el artículo 72."
  explanation:
    es: "Si se solicitó en período ejecutivo, los intereses se liquidan una vez realizado el pago, conforme al artículo 72 (artículo 53.3.b). La remisión al artículo 52.4 es la del período voluntario. Ni el artículo 62.2 ni el 54 son los que señala el precepto para ese caso."
  citation: "art. 53.3 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
  - "denegación"
# anchor: boe-a-2022-22128-da-cuadragesimosegunda
- id: m03-l09-q0174
  prompt:
    es: "¿Qué tipo de interés legal del dinero estableció la disposición adicional cuadragésima segunda, apartado Uno, de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, hasta el 31 de diciembre del año 2023?"
  options:
  - id: a
    correct: true
    text:
      es: "Un tipo del 3,25 por ciento."
  - id: b
    text:
      es: "Un tipo del 4,0625 por ciento."
  - id: c
    text:
      es: "Un tipo del 3,00 por ciento."
  - id: d
    text:
      es: "Un tipo del 3,75 por ciento."
  explanation:
    es: "La disposición adicional cuadragésima segunda, apartado Uno, de la Ley 31/2022 fijó el interés legal del dinero en el 3,25 por ciento hasta el 31 de diciembre de 2023. El 4,0625 por ciento es el interés de demora, que resulta de incrementar el legal en un 25 por ciento. Los otros dos tipos no figuran en la disposición."
  citation: "disposición adicional cuadragésima segunda.Uno Ley 31/2022"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "intereses"
  - "cifra anual"
