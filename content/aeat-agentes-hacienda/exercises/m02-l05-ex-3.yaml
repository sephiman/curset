# anchor: boe-a-1998-16718-art-46
- id: m02-l05-q0093
  prompt:
    es: "Según el artículo 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el plazo para interponer el recurso contencioso-administrativo contra un acto que no fuera expreso es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Seis meses, a partir del día siguiente a aquel en que se produzca el acto presunto."
  - id: b
    text:
      es: "Dos meses, a partir del día siguiente a aquel en que se produzca el acto presunto."
  - id: c
    text:
      es: "Un año, a partir del día siguiente a aquel en que se produzca el acto presunto."
  - id: d
    text:
      es: "Seis meses, a partir del día siguiente a la notificación del acto presunto al solicitante."
  explanation:
    es: "El artículo 46.1 da seis meses contra el acto presunto, contados desde el día siguiente a aquel en que, según su normativa específica, se produzca. Dos meses es el plazo contra el acto expreso. Un año no lo prevé el artículo, y un acto presunto no se notifica, por lo que no hay notificación de la que partir."
  citation: "art. 46.1 LJCA"
  difficulty: 1
  tags:
  - "plazo"
  - "acto presunto"
# anchor: boe-a-2025-76-da-primera
- id: m02-l05-q0097
  prompt:
    es: "Según la disposición adicional primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, las referencias a los Juzgados de lo Contencioso-administrativo se entienden hechas a las Secciones de lo Contencioso-administrativo de los Tribunales de Instancia una vez que estos estén:"
  options:
  - id: a
    text:
      es: "Creados por la entrada en vigor de la Ley Orgánica."
  - id: b
    text:
      es: "Aprobados por el Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Constituidos e implantados de forma efectiva."
  - id: d
    text:
      es: "Previstos en la demarcación y planta judiciales."
  explanation:
    es: "La disposición adicional primera condiciona el cambio de las menciones a que los Tribunales de Instancia estén constituidos e implantados de forma efectiva. No basta con que la Ley Orgánica entre en vigor, con la aprobación del Consejo General del Poder Judicial ni con que figuren en la demarcación y planta, porque el texto exige la implantación real."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 1
  tags:
  - "Tribunales de Instancia"
