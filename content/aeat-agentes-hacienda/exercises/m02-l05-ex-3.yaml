# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0008
  prompt:
    es: "De acuerdo con el artículo 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión contra actos firmes en vía administrativa se interpone:"
  options:
  - id: a
    text:
      es: "Ante el órgano superior jerárquico del que los dictó, que es el competente para resolverlo."
  - id: b
    text:
      es: "Ante el órgano que los dictó, que lo remite al Consejo de Estado para que lo resuelva."
  - id: c
    text:
      es: "Ante el titular del departamento ministerial, que es el competente para resolverlo en todo caso."
  - id: d
    correct: true
    text:
      es: "Ante el órgano administrativo que los dictó, que también es el competente para resolverlo."
  explanation:
    es: "El artículo 125.1 dice que el recurso se interpone «ante el órgano administrativo que los dictó, que también será el competente para su resolución». No interviene el superior jerárquico, que es el órgano de la alzada, ni el Ministro con carácter general. El Consejo de Estado no resuelve el recurso."
  citation: "art. 125.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0009
  prompt:
    es: "Según el artículo 125.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, procede el recurso extraordinario de revisión cuando al dictar el acto se hubiera incurrido en:"
  options:
  - id: a
    text:
      es: "Error de hecho o de derecho, que resulte de los documentos incorporados al expediente."
  - id: b
    correct: true
    text:
      es: "Error de hecho, que resulte de los propios documentos incorporados al expediente."
  - id: c
    text:
      es: "Error de derecho, que resulte de la interpretación de la norma aplicada al caso."
  - id: d
    text:
      es: "Error de hecho, aunque no resulte de los documentos incorporados al expediente."
  explanation:
    es: "La causa a) exige un «error de hecho, que resulte de los propios documentos incorporados al expediente». El error de derecho no abre este recurso, ni solo ni junto al de hecho. Un error de hecho que no resulte de los documentos del expediente tampoco basta."
  citation: "art. 125.1.a) LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0011
  prompt:
    es: "Conforme al artículo 125.1.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cabe el recurso extraordinario de revisión si en la resolución influyeron esencialmente documentos o testimonios declarados falsos por:"
  options:
  - id: a
    correct: true
    text:
      es: "Sentencia judicial firme, anterior o posterior a aquella resolución."
  - id: b
    text:
      es: "Sentencia judicial firme, siempre que sea anterior a aquella resolución."
  - id: c
    text:
      es: "Resolución administrativa firme, anterior o posterior a aquella resolución."
  - id: d
    text:
      es: "Sentencia judicial, aunque no sea firme, posterior a aquella resolución."
  explanation:
    es: "La causa c) se refiere a documentos o testimonios «declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución». La sentencia puede ser posterior a la resolución, de modo que exigir que sea anterior es incorrecto. La falsedad la declara un juez, no una resolución administrativa, y la sentencia tiene que ser firme."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0012
  prompt:
    es: "Según el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión fundado en un error de hecho que resulte de los documentos del expediente se interpone:"
  options:
  - id: a
    text:
      es: "Dentro de los tres meses siguientes a la fecha de la notificación de la resolución impugnada."
  - id: b
    text:
      es: "Dentro de los cuatro años siguientes a aquel en que el interesado conoció el error."
  - id: c
    text:
      es: "En cualquier momento, sin sujeción a plazo, mientras el acto siga produciendo efectos."
  - id: d
    correct: true
    text:
      es: "Dentro de los cuatro años siguientes a la fecha de la notificación de la resolución impugnada."
  explanation:
    es: "Para la causa a), el artículo 125.2 fija «el plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada». Los tres meses son el plazo de las demás causas, y se cuentan desde el conocimiento de los documentos o desde la firmeza de la sentencia, no desde la notificación. Los cuatro años no se cuentan desde que se conoció el error. El recurso tiene plazo, de modo que no cabe en cualquier momento."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0065
  prompt:
    es: "Señale la respuesta CORRECTA sobre el recurso extraordinario de revisión, de acuerdo con el artículo 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Se interpone contra cualquier acto administrativo, aunque no sea firme, cuando concurra alguna de las circunstancias que el precepto enumera."
  - id: b
    text:
      es: "Se interpone contra las disposiciones de carácter general firmes, cuando concurra alguna de las circunstancias que el precepto enumera."
  - id: c
    correct: true
    text:
      es: "Se interpone contra actos firmes en vía administrativa, cuando concurra alguna de las circunstancias que el precepto enumera."
  - id: d
    text:
      es: "Se interpone contra los actos de trámite que no deciden el fondo, cuando concurra alguna de las circunstancias que el precepto enumera."
  explanation:
    es: "El artículo 125.1 limita el recurso extraordinario de revisión a los actos firmes en vía administrativa y a las cuatro circunstancias que enumera. No cabe contra actos que no son firmes, que se impugnan por la alzada o la reposición. Contra las disposiciones de carácter general no cabe recurso en vía administrativa (art. 112.3), y la oposición a los actos de trámite que no deciden el fondo se alega para la resolución final."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "extraordinario de revisión"
# anchor: boe-a-2015-10565-art-125
- id: m02-l05-q0068
  prompt:
    es: "Don Néstor Cabrera tuvo conocimiento, hace cinco meses, de documentos de valor esencial posteriores a una resolución que ya es firme en vía administrativa y que evidencian el error de aquella. Interpone ahora el recurso extraordinario de revisión. Según el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo debe valorarse el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "Está fuera de plazo, porque en esa causa el plazo es de tres meses desde el conocimiento de los documentos."
  - id: b
    text:
      es: "Está en plazo, porque en esa causa el plazo es de cuatro años desde la notificación de la resolución."
  - id: c
    text:
      es: "Está en plazo, porque en esa causa el plazo es de seis meses desde el conocimiento de los documentos, que aún no han vencido."
  - id: d
    text:
      es: "Está en plazo, porque en esa causa no existe plazo y puede interponerse en cualquier momento posterior al conocimiento."
  explanation:
    es: "La aparición de documentos de valor esencial es la circunstancia del artículo 125.1.b), y para ella el artículo 125.2 fija tres meses desde el conocimiento de los documentos; han pasado cinco. Los cuatro años desde la notificación solo valen para el error de hecho de la letra a). Seis meses es una cifra que el artículo no usa, y la ley sí fija plazo en esta causa."
  citation: "art. 125.2 LPAC"
  difficulty: 3
  tags:
  - "extraordinario de revisión"
  - "plazo"
# anchor: boe-a-2015-10565-art-126
- id: m02-l05-q0071
  prompt:
    es: "¿Cuál es el plazo para que se entienda desestimado el recurso extraordinario de revisión por falta de resolución y notificación, y desde cuándo se cuenta, según el artículo 126.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Un mes desde la admisión a trámite del recurso."
  - id: b
    correct: true
    text:
      es: "Tres meses desde la interposición del recurso."
  - id: c
    text:
      es: "Tres meses desde que se declaró firme el acto recurrido."
  - id: d
    text:
      es: "Seis meses desde la interposición del recurso."
  explanation:
    es: "El artículo 126.3 cuenta tres meses desde la interposición del recurso extraordinario de revisión. Un mes es el plazo máximo de la reposición, y no se cuenta desde una admisión a trámite que el artículo no menciona. La firmeza del acto es el presupuesto del recurso, no el inicio de este plazo, y seis meses no es plazo de ninguno de los recursos administrativos del título V."
  citation: "art. 126.3 LPAC"
  difficulty: 1
  tags:
  - "extraordinario de revisión"
  - "plazo"
# anchor: boe-a-1998-16718-art-6
- id: m02-l05-q0019
  prompt:
    es: "Según el artículo 6 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cuál de los siguientes órganos integra el orden jurisdiccional contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Los Tribunales Económico-Administrativos Regionales del Estado."
  - id: b
    correct: true
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: c
    text:
      es: "Los Juzgados de lo Social de cada provincia."
  - id: d
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  explanation:
    es: "El artículo 6 integra en el orden contencioso-administrativo los Juzgados de lo Contencioso-administrativo, los Juzgados Centrales, las Salas de los Tribunales Superiores de Justicia, la Sala de la Audiencia Nacional y la del Tribunal Supremo. Los Tribunales Económico-Administrativos son órganos administrativos, y los Juzgados de lo Social y la Sala de lo Penal son de otros órdenes o salas."
  citation: "art. 6 LJCA"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-128
- id: m02-l05-q0020
  prompt:
    es: "Conforme al artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, durante el mes de agosto el plazo para interponer el recurso contencioso-administrativo:"
  options:
  - id: a
    text:
      es: "corre con normalidad, pues agosto es hábil en toda la jurisdicción contencioso-administrativa."
  - id: b
    text:
      es: "queda suspendido solo para las partes que lo soliciten al órgano jurisdiccional."
  - id: c
    text:
      es: "no corre en ningún procedimiento de la Ley, tampoco en el de protección de derechos fundamentales."
  - id: d
    correct: true
    text:
      es: "no corre, salvo en el procedimiento para la protección de los derechos fundamentales."
  explanation:
    es: "El artículo 128.2 dice que en agosto «no correrá el plazo para interponer el recurso contencioso-administrativo ni ningún otro plazo» de la Ley, salvo en el procedimiento para la protección de los derechos fundamentales. Agosto no es hábil con carácter general, la suspensión no depende de que las partes la pidan y la excepción de los derechos fundamentales existe."
  citation: "art. 128.2 LJCA"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1998-16718-art-128
- id: m02-l05-q0021
  prompt:
    es: "Según el artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en el procedimiento para la protección de los derechos fundamentales el mes de agosto tiene carácter:"
  options:
  - id: a
    correct: true
    text:
      es: "hábil, de manera que en él corren los plazos."
  - id: b
    text:
      es: "inhábil, como en el resto de procedimientos."
  - id: c
    text:
      es: "hábil solo para presentar el recurso, no para otros plazos."
  - id: d
    text:
      es: "inhábil, salvo que el órgano lo habilite por urgencia."
  explanation:
    es: "El artículo 128.2 excluye ese procedimiento de la regla de agosto: «el mes de agosto tendrá carácter de hábil». Por tanto no es inhábil, ni lo es salvo habilitación, y no es hábil solo para el recurso: lo es para todos sus plazos."
  citation: "art. 128.2 LJCA"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2025-76-da-primera
- id: m02-l05-q0022
  prompt:
    es: "Según la disposición adicional primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, implantados los Tribunales de Instancia, los Juzgados de lo Contencioso-administrativo se entienden referidos a:"
  options:
  - id: a
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: b
    text:
      es: "Las Secciones de lo Contencioso-administrativo del Tribunal Central de Instancia."
  - id: c
    text:
      es: "Las Salas de lo Contencioso-administrativo de las Audiencias Provinciales."
  - id: d
    correct: true
    text:
      es: "Las Secciones de lo Contencioso-administrativo de los Tribunales de Instancia."
  explanation:
    es: "La disposición adicional primera dice que las referencias a los Juzgados «de lo Contencioso-Administrativo» se entienden referidas «a las Secciones del orden jurisdiccional correspondiente de los Tribunales de Instancia». Las Salas de los Tribunales Superiores de Justicia siguen siendo órganos distintos. Las Secciones del Tribunal Central de Instancia sustituyen a los Juzgados Centrales, no a los Juzgados. Las Audiencias Provinciales no tienen Salas de lo contencioso-administrativo."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2025-76-da-primera
- id: m02-l05-q0023
  prompt:
    es: "Implantados los Tribunales de Instancia, ¿a qué órgano se entienden hechas las referencias a los Juzgados Centrales de lo Contencioso-administrativo, según la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia?"
  options:
  - id: a
    text:
      es: "A la Sala de lo Contencioso-administrativo de la Audiencia Nacional."
  - id: b
    correct: true
    text:
      es: "A las Secciones correspondientes del Tribunal Central de Instancia."
  - id: c
    text:
      es: "A las Secciones de los Tribunales de Instancia de Madrid."
  - id: d
    text:
      es: "A la Sala de lo Contencioso-administrativo del Tribunal Supremo."
  explanation:
    es: "La disposición adicional primera de la Ley Orgánica 1/2025 dice que «la misma consideración tendrán las referencias a los Juzgados Centrales respecto de las correspondientes Secciones del Tribunal Central de Instancia». La Sala de la Audiencia Nacional y la del Tribunal Supremo son órganos colegiados distintos que la ley no toca. Las Secciones de los Tribunales de Instancia de Madrid sustituyen a los Juzgados de Madrid, no a los Centrales."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-12
- id: m02-l05-q0027
  prompt:
    es: "Señale de qué actos y disposiciones conoce en única instancia la Sala de lo Contencioso-administrativo del Tribunal Supremo, según el artículo 12.1.a) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa:"
  options:
  - id: a
    text:
      es: "De los de los Ministros y los Secretarios de Estado."
  - id: b
    text:
      es: "De los de los Delegados del Gobierno en las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "De los del Consejo de Ministros y de las Comisiones Delegadas del Gobierno."
  - id: d
    text:
      es: "De los de los órganos de gobierno de las Comunidades Autónomas."
  explanation:
    es: "El artículo 12.1.a) atribuye a la Sala del Tribunal Supremo, en única instancia, los actos y disposiciones del Consejo de Ministros y de las Comisiones Delegadas del Gobierno. Los de los Ministros y Secretarios de Estado, los de los Delegados del Gobierno y los de los órganos autonómicos no se mencionan en esa letra."
  citation: "art. 12.1.a) LJCA"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1998-16718-art-6
- id: m02-l05-q0028
  prompt:
    es: "Conforme al artículo 6 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, integran el orden jurisdiccional contencioso-administrativo, entre otros órganos, la Sala de lo Contencioso-administrativo de la Audiencia Nacional y:"
  options:
  - id: a
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal Constitucional."
  - id: b
    text:
      es: "Las Secciones de lo Contencioso-administrativo de las Audiencias Provinciales."
  - id: c
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal Supremo."
  explanation:
    es: "El artículo 6 enumera, junto a los Juzgados, los Juzgados Centrales y las Salas de los Tribunales Superiores de Justicia, la Sala de la Audiencia Nacional y la del Tribunal Supremo. El Tribunal Constitucional y el Tribunal de Cuentas no tienen Sala de lo Contencioso-administrativo, y las Audiencias Provinciales no figuran en la lista."
  citation: "art. 6 LJCA"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-2
- id: m02-l05-q0072
  prompt:
    es: "De acuerdo con el artículo 2.a) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el orden jurisdiccional contencioso-administrativo conoce de la protección jurisdiccional de los derechos fundamentales, de los elementos reglados y de la determinación de las indemnizaciones que procedan, en relación con los actos:"
  options:
  - id: a
    text:
      es: "Del Gobierno o de los Consejos de Gobierno de las Comunidades Autónomas, solo cuando sean de naturaleza administrativa."
  - id: b
    text:
      es: "Del Gobierno y de las Cortes Generales, cualquiera que fuese la naturaleza de dichos actos."
  - id: c
    correct: true
    text:
      es: "Del Gobierno o de los Consejos de Gobierno de las Comunidades Autónomas, cualquiera que fuese la naturaleza de dichos actos."
  - id: d
    text:
      es: "De las Entidades locales o de los Consejos de Gobierno de las Comunidades Autónomas, cualquiera que fuese su naturaleza."
  explanation:
    es: "El artículo 2.a) incluye los actos del Gobierno y de los Consejos de Gobierno autonómicos, sin importar su naturaleza, de modo que también alcanza a los que no son estrictamente administrativos. Limitarlo a los de naturaleza administrativa añade una condición que el texto excluye expresamente. Las Cortes Generales no aparecen en la letra a), y las Entidades locales no son el sujeto que esta letra menciona."
  citation: "art. 2 LJCA"
  difficulty: 3
  tags:
  - "objeto"
  - "actos del Gobierno"
# anchor: boe-a-1998-16718-art-2
- id: m02-l05-q0073
  prompt:
    es: "Según el artículo 2.b) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿qué orden jurisdiccional conoce de la impugnación de la adjudicación de un contrato sujeto a la legislación de contratación de las Administraciones públicas pero de naturaleza privada?"
  options:
  - id: a
    correct: true
    text:
      es: "El contencioso-administrativo, porque conoce de los actos de preparación y adjudicación de esos contratos."
  - id: b
    text:
      es: "El civil, porque el contrato no es un contrato administrativo."
  - id: c
    text:
      es: "El social, porque el contrato se refiere a la prestación de servicios."
  - id: d
    text:
      es: "El civil, porque la adjudicación es un acto de una empresa privada."
  explanation:
    es: "El artículo 2.b) atribuye al orden contencioso-administrativo los contratos administrativos y los actos de preparación y adjudicación de los demás contratos sujetos a la legislación de contratación de las Administraciones públicas. Que el contrato no sea administrativo no lo desplaza al orden civil en lo que toca a esos actos. El orden social no interviene, y la adjudicación la realiza un poder adjudicador sometido a esa legislación, no una empresa privada."
  citation: "art. 2 LJCA"
  difficulty: 2
  tags:
  - "objeto"
  - "contratos"
# anchor: boe-a-1998-16718-art-2
- id: m02-l05-q0074
  prompt:
    es: "Conforme al artículo 2.c) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el orden jurisdiccional contencioso-administrativo conoce de los actos y disposiciones de las Corporaciones de Derecho público adoptados:"
  options:
  - id: a
    text:
      es: "En el ejercicio de funciones privadas."
  - id: b
    text:
      es: "En cualquier ámbito de su actividad."
  - id: c
    text:
      es: "Únicamente en materia disciplinaria."
  - id: d
    correct: true
    text:
      es: "En el ejercicio de funciones públicas."
  explanation:
    es: "La letra c) del artículo 2 limita el control de estas Corporaciones a los actos y disposiciones adoptados en el ejercicio de funciones públicas. Lo que decidan en el ejercicio de funciones privadas queda fuera, no alcanza a cualquier ámbito de su actividad, y la materia disciplinaria no es el único contenido que abarca."
  citation: "art. 2 LJCA"
  difficulty: 1
  tags:
  - "objeto"
  - "Corporaciones de Derecho público"
# anchor: boe-a-1998-16718-art-2
- id: m02-l05-q0076
  prompt:
    es: "Según el artículo 2.e) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿ante qué orden jurisdiccional debe demandarse a la Administración por los daños de un servicio público en cuya producción concurrió una empresa privada y que está cubierta por un seguro?"
  options:
  - id: a
    text:
      es: "Ante el civil, porque en la producción del daño concurrió una empresa privada."
  - id: b
    text:
      es: "Ante el civil, porque la Administración tiene contratado un seguro de responsabilidad."
  - id: c
    text:
      es: "Ante el social, porque el daño deriva de la prestación de un servicio público."
  - id: d
    correct: true
    text:
      es: "Ante el contencioso-administrativo, sin que pueda demandarse a la Administración por este motivo ante los órdenes civil o social."
  explanation:
    es: "El artículo 2.e) atribuye al orden contencioso-administrativo la responsabilidad patrimonial de las Administraciones públicas, sea cual sea la naturaleza de la actividad o el tipo de relación de que derive. Añade que no pueden ser demandadas por ese motivo ante los órdenes civil o social, aunque en el daño concurran particulares o exista un seguro. Los dos primeros supuestos de los distractores se refieren justamente a esas dos circunstancias, y el orden social tampoco es competente."
  citation: "art. 2 LJCA"
  difficulty: 2
  tags:
  - "objeto"
  - "responsabilidad patrimonial"
# anchor: boe-a-1998-16718-art-2
