# anchor: fuente-ms-win32-processor-cache-html
- id: m06-l01-q001
  prompt:
    es: "¿Cuál de los siguientes componentes describe la documentación de Microsoft sobre Windows como el dispositivo que puede interpretar una secuencia de instrucciones en un equipo?"
  options:
  - id: a
    text:
      es: "La memoria de acceso aleatorio o RAM"
  - id: b
    text:
      es: "La memoria caché de nivel 2 del procesador"
  - id: c
    correct: true
    text:
      es: "El procesador o unidad de procesamiento central"
  - id: d
    text:
      es: "La placa base o placa de circuito principal del equipo"
  explanation:
    es: "La clase Win32_Processor «representa un dispositivo que puede interpretar una secuencia de instrucciones», es decir, el procesador. La RAM guarda temporalmente los datos que la CPU usa, la caché de nivel 2 es un área de memoria con acceso más rápido que la RAM principal y la placa base es la placa de circuito a la que se conectan los chips: ninguna de las tres interpreta instrucciones."
  citation: "fuente: `ms-win32-processor-cache.html`; «Win32_Processor clase»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-analisis-cpu-html
- id: m06-l01-q002
  prompt:
    es: "¿Cuál de las siguientes definiciones de procesador lógico da la guía de Microsoft sobre análisis de CPU, en la que procesador y CPU designan ese concepto?"
  options:
  - id: a
    correct: true
    text:
      es: "Un dispositivo de hardware que el sistema operativo usa para ejecutar instrucciones de programa"
  - id: b
    text:
      es: "Un dispositivo de hardware que guarda temporalmente los datos que usa el procesador"
  - id: c
    text:
      es: "Un componente del sistema operativo que cambia de un subproceso a otro en el procesador"
  - id: d
    text:
      es: "Un área de memoria externa con un tiempo de acceso más rápido que la RAM principal"
  explanation:
    es: "La guía define el procesador lógico como «un dispositivo de hardware que el sistema operativo puede usar para ejecutar instrucciones de programa». Guardar temporalmente los datos es lo que hace la RAM; cambiar de un subproceso a otro es el trabajo del distribuidor, un componente de Windows y no un dispositivo de hardware; y el área de memoria más rápida que la RAM principal es la caché de nivel 2 o 3."
  citation: "fuente: `ms-win-analisis-cpu.html`; «Fondo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q003
  prompt:
    es: "¿Cuál de los siguientes nombres da la formación de Microsoft a la placa de circuito a la que están conectados los chips de un equipo, además de la CPU?"
  options:
  - id: a
    text:
      es: "Unidad de procesamiento central."
  - id: b
    correct: true
    text:
      es: "Placa base."
  - id: c
    text:
      es: "Unidad de procesamiento de gráficos."
  - id: d
    text:
      es: "Memoria de acceso aleatorio."
  explanation:
    es: "La página dice que «hay otros chips en un equipo todos conectados a una placa de circuito denominada placa base». La unidad de procesamiento central es la propia CPU, la de procesamiento de gráficos es la GPU, otro procesador, y la memoria de acceso aleatorio es la RAM: ninguna es la placa de circuito que conecta los chips."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Investigación de los procesadores»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q004
  prompt:
    es: "¿Qué componente de un equipo llama Microsoft su «cerebro» principal, el que hace la mayor parte del pensamiento en el funcionamiento del equipo?"
  options:
  - id: a
    text:
      es: "La memoria de acceso aleatorio (RAM)"
  - id: b
    text:
      es: "La placa base a la que se conectan los chips"
  - id: c
    text:
      es: "La unidad de disco duro (HDD)"
  - id: d
    correct: true
    text:
      es: "La unidad de procesamiento central (CPU)"
  explanation:
    es: "Según la página, el «cerebro» principal del equipo es la «unidad de procesamiento central» o CPU, y «es la CPU que hace la mayor parte del pensamiento». La RAM almacena datos que la CPU usa, la placa base es la placa de circuito a la que se conectan los chips y el disco duro es almacenamiento a largo plazo."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Investigación de los procesadores»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q005
  prompt:
    es: "Señale la afirmación correcta sobre la unidad de procesamiento central (CPU) según la formación de Microsoft sobre los procesadores de los equipos:"
  options:
  - id: a
    text:
      es: "Solo los ordenadores de sobremesa y los portátiles necesitan una CPU."
  - id: b
    correct: true
    text:
      es: "Todos los equipos necesitan al menos una CPU, incluso un smartphone."
  - id: c
    text:
      es: "Un smartphone no necesita CPU porque sus gráficos los procesa la GPU."
  - id: d
    text:
      es: "Todo equipo moderno necesita como mínimo dos CPU en sockets independientes."
  explanation:
    es: "La página dice: «Todos los equipos necesitan al menos una CPU, incluso un smartphone». Limitar la CPU a sobremesas y portátiles, o decir que un smartphone prescinde de ella, contradice esa frase. La guía de análisis de CPU dice que los equipos modernos «pueden» contener varias CPU, no que necesiten dos como mínimo."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Unidad de procesamiento central»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q006
  prompt:
    es: "¿Cuál de las siguientes cifras indica en cuántos comandos por segundo pueden «pensar» las CPU modernas, según la formación de Microsoft sobre procesadores?"
  options:
  - id: a
    correct: true
    text:
      es: "En miles de millones de comandos por segundo"
  - id: b
    text:
      es: "En miles de comandos por segundo"
  - id: c
    text:
      es: "En cientos de comandos por segundo"
  - id: d
    text:
      es: "En millones de comandos por cada minuto"
  explanation:
    es: "La página dice que «las CPU modernas se crean para pensar en miles de millones de comandos por segundo». Miles o cientos de comandos por segundo, o millones por minuto, son cifras muy por debajo de esa."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Unidad de procesamiento central»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe, según Microsoft, el idioma digital al que se pueden reducir todos los problemas informáticos que resuelve un equipo?"
  options:
  - id: a
    text:
      es: "Un idioma de diez símbolos, del 0 al 9, propio de cada procesador"
  - id: b
    text:
      es: "Un idioma de dieciséis símbolos que solo entienden las tarjetas gráficas"
  - id: c
    correct: true
    text:
      es: "Un idioma de solo dos símbolos, 0 y 1, que enciende y apaga interruptores"
  - id: d
    text:
      es: "Un idioma de ocho símbolos, uno por cada bit que forma un byte"
  explanation:
    es: "Según la página, todos los problemas informáticos se pueden dividir en «un idioma digital: 0 y 1», y eso significa que el equipo enciende y apaga muchos interruptores muy rápido. Los idiomas de diez, dieciséis u ocho símbolos cambian ese número de símbolos."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Cómo piensa un ordenador»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q008
  prompt:
    es: "¿Qué componente describe la formación de Microsoft como el que hace que todos los gráficos se vean en pantalla y es aún más rápido que la CPU?"
  options:
  - id: a
    text:
      es: "La memoria caché de nivel 3 del procesador"
  - id: b
    text:
      es: "El módulo de plataforma segura (TPM)"
  - id: c
    text:
      es: "La memoria de acceso aleatorio (RAM) del equipo"
  - id: d
    correct: true
    text:
      es: "La unidad de procesamiento de gráficos (GPU)"
  explanation:
    es: "La página dice que «la unidad de procesamiento de gráficos (GPU) hace que todos esos gráficos geniales se vean en pantalla» y que los procesadores gráficos «son aún más rápidos» que la CPU. La caché de nivel 3 es memoria con acceso más rápido que la RAM, el TPM es un requisito de seguridad de Windows 11 y la RAM guarda datos que usa la CPU: ninguno muestra los gráficos."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Un procesador más»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q009
  prompt:
    es: "Según la formación de Microsoft, por su velocidad, la unidad de procesamiento de gráficos (GPU) se ha empezado a usar también para:"
  options:
  - id: a
    text:
      es: "guardar los datos del equipo cuando este se queda sin energía."
  - id: b
    correct: true
    text:
      es: "resolver problemas matemáticos muy complejos, por ejemplo sobre el clima."
  - id: c
    text:
      es: "controlar el arranque del equipo antes de pasar el control a Windows."
  - id: d
    text:
      es: "asignar los recursos de hardware que solicita cada dispositivo conectado."
  explanation:
    es: "La página cuenta que, por su velocidad, se empezó a usar la GPU «para problemas matemáticos muy complejos», como los del clima. Guardar datos sin energía es el almacenamiento a largo plazo, controlar el arranque es la interfaz del firmware y asignar recursos de hardware es el administrador de PnP."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Un procesador más»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-procesador-html
- id: m06-l01-q010
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la unidad de procesamiento de gráficos (GPU) recoge la formación de Microsoft sobre los procesadores de un equipo?"
  options:
  - id: a
    correct: true
    text:
      es: "Muchos proveedores de nube recurren a ella para acelerar la informática en Internet."
  - id: b
    text:
      es: "Se diseñó primero para cálculos matemáticos y después se aplicó a los gráficos."
  - id: c
    text:
      es: "Sus chips son baratos, por lo que se usan en cualquier tipo de trabajo."
  - id: d
    text:
      es: "Ha sustituido a la CPU como cerebro principal del ordenador moderno."
  explanation:
    es: "La página dice que la GPU «es un recurso al que muchos proveedores de nube están recurriendo para ayudar a acelerar la informática en Internet». Las GPU se diseñaron primero para los gráficos y después se usaron en matemáticas; los chips gráficos, por ser rápidos, tienden a costar más dinero y solo se usan para trabajos especiales; y la CPU sigue siendo el cerebro principal."
  citation: "fuente: `ms-learn-equipos-procesador.html`; «Un procesador más»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win32-processor-cache-html
- id: m06-l01-q011
  prompt:
    es: "Según la documentación de Microsoft sobre la clase Win32_Processor de Windows, una caché de nivel 2 del procesador es un área de memoria externa que:"
  options:
  - id: a
    text:
      es: "tiene un tiempo de acceso más lento que la memoria RAM principal."
  - id: b
    text:
      es: "tiene el mismo tiempo de acceso que la memoria RAM principal."
  - id: c
    text:
      es: "forma parte de la propia memoria RAM principal del equipo."
  - id: d
    correct: true
    text:
      es: "tiene un tiempo de acceso más rápido que la memoria RAM principal."
  explanation:
    es: "La página dice: «Una caché de nivel 2 es un área de memoria externa que tiene un tiempo de acceso más rápido que la memoria RAM principal». Más lento o igual cambia la comparación, y una memoria que se compara con la RAM principal y es más rápida que ella no forma parte de esa RAM."
  citation: "fuente: `ms-win32-processor-cache.html`; «L2CacheSize»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win32-processor-cache-html
- id: m06-l01-q012
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las cachés de nivel 2 y de nivel 3 del procesador es correcta según la documentación de la clase Win32_Processor?"
  options:
  - id: a
    text:
      es: "Solo la de nivel 2 es más rápida que la RAM principal; la de nivel 3, no."
  - id: b
    text:
      es: "Solo la de nivel 3 es más rápida que la RAM principal; la de nivel 2, no."
  - id: c
    correct: true
    text:
      es: "Las dos tienen un tiempo de acceso más rápido que la RAM principal."
  - id: d
    text:
      es: "Las dos tienen el mismo tiempo de acceso que la RAM principal."
  explanation:
    es: "La página da la misma frase para las dos: una caché de nivel 2, y también una de nivel 3, «es un área de memoria externa que tiene un tiempo de acceso más rápido que la memoria RAM principal». Por eso es falso limitar la ventaja a una sola de ellas o decir que su tiempo de acceso es el mismo que el de la RAM."
  citation: "fuente: `ms-win32-processor-cache.html`; «L3CacheSize»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win32-processor-cache-html
- id: m06-l01-q015
  prompt:
    es: "Según la documentación de Microsoft sobre la clase Win32_Processor, ¿qué es un núcleo, cuyo número da la propiedad NumberOfCores para cada procesador?"
  options:
  - id: a
    text:
      es: "Un área de memoria externa más rápida que la RAM"
  - id: b
    text:
      es: "Una placa de circuito a la que se conectan los chips"
  - id: c
    correct: true
    text:
      es: "Un procesador físico en el circuito integrado"
  - id: d
    text:
      es: "Un subproceso que mantiene la información de contexto"
  explanation:
    es: "La página dice: «Un núcleo es un procesador físico en el circuito integrado». El área de memoria más rápida que la RAM es la caché de nivel 2 o 3, la placa de circuito que conecta los chips es la placa base y el elemento que mantiene la información de contexto de ejecución es el subproceso."
  citation: "fuente: `ms-win32-processor-cache.html`; «NumberOfCores»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-analisis-cpu-html
- id: m06-l01-q016
  prompt:
    es: "Según la guía de Microsoft sobre análisis de CPU, cada CPU puede hospedar varios núcleos de procesador físicos, y cada uno de ellos es capaz de procesar simultáneamente:"
  options:
  - id: a
    text:
      es: "un único flujo de instrucción, sin excepción."
  - id: b
    text:
      es: "hasta ocho flujos de instrucción independientes."
  - id: c
    text:
      es: "exactamente cuatro flujos de instrucción independientes."
  - id: d
    correct: true
    text:
      es: "uno o dos flujos de instrucción independientes."
  explanation:
    es: "La guía dice que cada núcleo físico es «capaz de procesar uno o dos flujos de instrucción independientes simultáneamente». Un único flujo sin excepción, ocho o cuatro cambian esa cifra."
  citation: "fuente: `ms-win-analisis-cpu.html`; «Fondo»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-learn-equipos-ram-html
- id: m06-l01-q023
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe, según la formación de Microsoft, la función de la memoria de acceso aleatorio (RAM) de un equipo?"
  options:
  - id: a
    text:
      es: "Conserva los datos del equipo aunque este se quede sin energía o se apague."
  - id: b
    text:
      es: "Controla el proceso de arranque y después pasa el control a Windows."
  - id: c
    correct: true
    text:
      es: "Almacena datos que la CPU toma y usa cuando los necesita, y los guarda temporalmente."
  - id: d
    text:
      es: "Asigna a cada dispositivo los recursos de hardware que este solicita."
  explanation:
    es: "La página dice que la RAM «se inventó para almacenar fragmentos de datos que la CPU puede agarrar y usar cuando lo necesita y almacenarlo temporalmente». Conservar los datos sin energía es el almacenamiento a largo plazo, controlar el arranque es la interfaz del firmware y asignar recursos de hardware es el administrador de PnP."
  citation: "fuente: `ms-learn-equipos-ram.html`; «Examen de la memoria de acceso aleatorio»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q024
  prompt:
    es: "Según la formación de Microsoft sobre almacenamiento, ¿qué ocurre con lo que está en la memoria RAM cuando el equipo se apaga o se queda sin batería?"
  options:
  - id: a
    text:
      es: "Se conserva en la RAM hasta que el equipo se vuelve a encender."
  - id: b
    text:
      es: "Se conserva en la RAM solo si el equipo tiene firmware UEFI."
  - id: c
    text:
      es: "Se mantiene en la RAM mientras quede espacio libre en ella."
  - id: d
    correct: true
    text:
      es: "Desaparece, porque la RAM solo está activa con el equipo encendido."
  explanation:
    es: "La página dice que la RAM «solo está activo cuando el equipo está activado» y que, una vez apagado el equipo o sin batería, «lo que esté en RAM desaparece». Las otras tres afirman que el contenido se conserva, con o sin condición, y eso solo lo hace el almacenamiento a largo plazo."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Almacenamiento a largo plazo»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-learn-equipos-ram-html
- id: m06-l01-q025
  prompt:
    es: "Según la formación de Microsoft, ¿por qué se denomina «aleatorio» el acceso de la memoria de acceso aleatorio (RAM) de un equipo?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque la CPU puede usar cualquier dato almacenado en ella en cualquier momento."
  - id: b
    text:
      es: "Porque la CPU tiene que recorrerla en orden hasta llegar al punto que necesita."
  - id: c
    text:
      es: "Porque guarda los datos a largo plazo, aunque el equipo esté apagado."
  - id: d
    text:
      es: "Porque el sistema guarda cada dato en una posición elegida al azar."
  explanation:
    es: "La página dice que la RAM «se conoce como \"aleatorio\" porque la CPU puede pensar en cualquier cosa almacenada en la memoria en cualquier momento que quiera». Recorrerla en orden es lo contrario: otra página de la misma formación cuenta que con la cinta magnética las computadoras no podían acceder a los datos en ella «\"aleatoriamente\"» y «tenían que rebobinar o avanzar la cinta para llegar al punto que necesitaban». Guardar datos con el equipo apagado es el almacenamiento a largo plazo: según esa misma página, «lo que esté en RAM desaparece» una vez que el equipo está apagado. Y la posición elegida al azar tampoco es la razón: la frase del nombre da un único motivo, que la CPU puede pensar en cualquier dato en cualquier momento."
  citation: "fuente: `ms-learn-equipos-ram.html`; «Examen de la memoria de acceso aleatorio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q026
  prompt:
    es: "¿Con cuál de los siguientes nombres se refiere también la formación de Microsoft sobre almacenamiento a la memoria de acceso aleatorio (RAM)?"
  options:
  - id: a
    text:
      es: "Memoria a largo plazo."
  - id: b
    correct: true
    text:
      es: "Memoria a corto plazo."
  - id: c
    text:
      es: "Almacenamiento magnético."
  - id: d
    text:
      es: "Almacenamiento digital."
  explanation:
    es: "La página dice: «Este tipo de memoria, memoria de acceso aleatorio, también se denomina memoria a corto plazo». La memoria a largo plazo es el «almacenamiento», el segundo tipo de memoria, y el almacenamiento magnético y el digital son los dos tipos principales de ese almacenamiento."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Comprender el almacenamiento»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-equipos-ram-html
- id: m06-l01-q027
  prompt:
    es: "Señale la afirmación correcta sobre la memoria RAM frente a las demás partes de un equipo, según la formación de Microsoft sobre la memoria de acceso aleatorio:"
  options:
  - id: a
    text:
      es: "Tiende a ser lenta, aunque es la parte más barata."
  - id: b
    text:
      es: "Tiende a ser rápida y es la parte más barata."
  - id: c
    correct: true
    text:
      es: "Tiende a ser rápida, pero puede costar bastante dinero."
  - id: d
    text:
      es: "Tiende a ser lenta y conviene comprar la mínima."
  explanation:
    es: "La página dice que la RAM «tiende a ser rápida» pero «puede costar dinero significativo en relación con las otras partes del equipo», y aconseja comprar «lo máximo que uno pueda permitirse». Las opciones que la describen como lenta o como la parte más barata, o que aconsejan comprar la mínima, contradicen esas frases."
  citation: "fuente: `ms-learn-equipos-ram.html`; «Examen de la memoria de acceso aleatorio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-sql-bits-html
- id: m06-l01-q028
  prompt:
    es: "Según la documentación de Microsoft sobre las funciones de manipulación de bits, ¿cuántos valores distintos puede tomar un bit y cuáles son?"
  options:
  - id: a
    text:
      es: "Ocho valores: del 0 al 7."
  - id: b
    text:
      es: "Diez valores: del 0 al 9."
  - id: c
    text:
      es: "Dieciséis valores: del 0 al 15."
  - id: d
    correct: true
    text:
      es: "Dos valores: 1 o 0."
  explanation:
    es: "La página dice: «Un bit tiene dos valores (1 o 0, que representan on o off, o true o false)». Ocho, diez o dieciséis valores no corresponden a un bit; ocho es el número de bits de un byte."
  citation: "fuente: `ms-sql-bits.html`; «Funciones de manipulación de bits»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-ms-sql-bits-html
- id: m06-l01-q029
  prompt:
    es: "¿Cuál de las siguientes definiciones de byte da la documentación de Microsoft sobre las funciones de manipulación de bits de SQL Server?"
  options:
  - id: a
    correct: true
    text:
      es: "Una secuencia de 8 bits."
  - id: b
    text:
      es: "Una secuencia de 2 bits."
  - id: c
    text:
      es: "Una secuencia de 10 bits."
  - id: d
    text:
      es: "Una secuencia de 16 bits."
  explanation:
    es: "La página dice: «Un byte se compone de una secuencia de 8 bits». Dos, diez o dieciséis bits son cifras distintas; dos es el número de valores que puede tomar un bit."
  citation: "fuente: `ms-sql-bits.html`; «Funciones de manipulación de bits»"
  difficulty: 1
