# anchor: celex-12016m-txt-art-13
- id: m01-l10-q061
  prompt:
    es: "Conforme al artículo 13.1 del Tratado de la Unión Europea, el marco institucional de la Unión se compone de un número de instituciones igual a:"
  options:
  - id: a
    text:
      es: "Cinco."
  - id: b
    text:
      es: "Seis."
  - id: c
    correct: true
    text:
      es: "Siete."
  - id: d
    text:
      es: "Nueve."
  explanation:
    es: "El artículo 13.1 enumera siete instituciones: el Parlamento Europeo, el Consejo Europeo, el Consejo, la Comisión, el Tribunal de Justicia, el Banco Central Europeo y el Tribunal de Cuentas. Con cinco o seis faltarían algunas de ellas, y nueve incluiría órganos que no lo son, como los Comités consultivos."
  citation: "art. 13.1 TUE"
  difficulty: 1
  tags:
  - "cantidad"
  - "estructura"
# anchor: celex-12016m-txt-art-13
- id: m01-l10-q062
  prompt:
    es: "Señale cuál de los siguientes órganos es una institución de la Unión Europea, según el artículo 13.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Comité de las Regiones."
  - id: b
    correct: true
    text:
      es: "El Banco Central Europeo."
  - id: c
    text:
      es: "El Comité Económico y Social."
  - id: d
    text:
      es: "El Banco Europeo de Inversiones."
  explanation:
    es: "El Banco Central Europeo figura en la lista de instituciones del artículo 13.1. El Comité de las Regiones y el Comité Económico y Social asisten al Parlamento, al Consejo y a la Comisión con funciones consultivas, según el artículo 13.4. El Banco Europeo de Inversiones no está en la lista."
  citation: "art. 13.1 TUE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: celex-12016m-txt-art-13
- id: m01-l10-q063
  prompt:
    es: "¿Cuál de las siguientes formas de cooperación mantienen entre sí las instituciones de la Unión, de acuerdo con el artículo 13.2 del Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Una cooperación leal."
  - id: b
    text:
      es: "Una cooperación reforzada."
  - id: c
    text:
      es: "Una cooperación estructurada permanente."
  - id: d
    text:
      es: "Una cooperación subsidiaria."
  explanation:
    es: "Las instituciones mantienen entre sí una cooperación leal. La cooperación reforzada es el mecanismo del título IV por el que algunos Estados avanzan juntos. La cooperación estructurada permanente se refiere a la defensa. La cooperación subsidiaria no figura en el artículo."
  citation: "art. 13.2 TUE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-12016m-txt-art-13
- id: m01-l10-q064
  prompt:
    es: "Conforme al Tratado de la Unión Europea, cada institución de la Unión debe actuar dentro de los límites de las atribuciones que le confieren:"
  options:
  - id: a
    text:
      es: "Las leyes de los Estados miembros."
  - id: b
    text:
      es: "Las decisiones del Consejo Europeo."
  - id: c
    text:
      es: "Los reglamentos de las demás instituciones."
  - id: d
    correct: true
    text:
      es: "Los Tratados."
  explanation:
    es: "Cada institución actúa dentro de las atribuciones que le confieren los Tratados, con arreglo a los procedimientos, condiciones y fines que ellos establecen. Ni las leyes nacionales, ni las decisiones del Consejo Europeo ni los reglamentos de otras instituciones fijan esas atribuciones."
  citation: "art. 13.2 TUE"
  difficulty: 2
  tags:
  - "competencia"
