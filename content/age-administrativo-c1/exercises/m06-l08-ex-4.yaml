    text:
      es: "400 milisegundos, es decir, 0,4 segundos"
  - id: d
    correct: true
    text:
      es: "4000 milisegundos, es decir, 4 segundos"
  explanation:
    es: "El parámetro /w fija el tiempo de espera en milisegundos y por defecto es 4000, es decir, 4 segundos. El tiempo de espera predeterminado es de 4 segundos, no de 1. El tiempo de espera predeterminado es 4000 milisegundos, no 400. El tiempo de espera predeterminado es 4000 milisegundos, no 40 000."
