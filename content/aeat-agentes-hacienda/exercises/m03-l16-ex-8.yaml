# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0079
  prompt:
    es: "Según el artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las mujeres con hijos menores de tres años con derecho al mínimo por descendientes que cumplan los requisitos pueden minorar la cuota diferencial hasta en:"
  options:
  - id: a
    correct: true
    text:
      es: "1.200 euros anuales por cada hijo menor de tres años."
  - id: b
    text:
      es: "1.000 euros anuales por cada hijo menor de tres años."
  - id: c
    text:
      es: "2.400 euros anuales en total, con independencia del número de hijos."
  - id: d
    text:
      es: "600 euros anuales por cada hijo menor de tres años."
  explanation:
    es: "La deducción por maternidad es de hasta 1.200 euros anuales por cada hijo menor de tres años (art. 81.1). Los 1.000 euros son el incremento por gastos de custodia del apartado 2, no la deducción base. Fijar un total de 2.400 euros con independencia del número de hijos contradice el \"por cada hijo\". Y los 600 euros son la cifra de otro incremento, el del artículo 81 bis."
  citation: "art. 81.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0080
  prompt:
    es: "De acuerdo con el artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, para tener derecho a la deducción por maternidad las mujeres dadas de alta en la Seguridad Social o mutualidad deben acreditar un período mínimo de:"
  options:
  - id: a
    correct: true
    text:
      es: "30 días cotizados en el período."
  - id: b
    text:
      es: "15 días cotizados en el período."
  - id: c
    text:
      es: "90 días cotizados en el período."
  - id: d
    text:
      es: "seis meses cotizados en el período."
  explanation:
    es: "El período mínimo de cotización o alta es de 30 días cotizados (art. 81.1). Quince y noventa días y seis meses no son plazos de la ley."
  citation: "art. 81.1 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0081
  prompt:
    es: "Conforme al artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en los supuestos de adopción o acogimiento, tanto preadoptivo como permanente, la deducción por maternidad se puede practicar, con independencia de la edad del menor:"
  options:
  - id: a
    text:
      es: "durante los dos años siguientes a la fecha de la inscripción en el Registro Civil."
  - id: b
    text:
      es: "hasta que el menor cumpla dieciocho años."
  - id: c
    text:
      es: "durante el año de la inscripción y los cuatro siguientes."
  - id: d
    correct: true
    text:
      es: "durante los tres años siguientes a la fecha de la inscripción en el Registro Civil."
  explanation:
    es: "En adopción o acogimiento la deducción se practica durante los tres años siguientes a la inscripción en el Registro Civil (art. 81.1). Dos años es el plazo del aumento del mínimo por descendientes (art. 58.2). Los dieciocho años y los cinco períodos no figuran en el precepto."
  citation: "art. 81.1 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0082
  prompt:
    es: "Según el artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en caso de fallecimiento de la madre, o cuando la guarda y custodia se atribuya de forma exclusiva al padre o, en su caso, a un tutor, siempre que cumpla los requisitos del artículo, este:"
  options:
  - id: a
    text:
      es: "pierde la deducción pendiente, que no se transmite a otro progenitor."
  - id: b
    text:
      es: "tiene derecho a la mitad del importe de la deducción pendiente."
  - id: c
    correct: true
    text:
      es: "tiene derecho a la práctica de la deducción pendiente."
  - id: d
    text:
      es: "tiene derecho a la deducción únicamente en el período impositivo del fallecimiento."
  explanation:
    es: "El padre o el tutor que cumpla los requisitos puede practicar la deducción pendiente (art. 81.1). La ley no extingue la deducción, ni la recorta a la mitad, ni la limita al período del fallecimiento."
  citation: "art. 81.1 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0083
  prompt:
    es: "¿Hasta cuántos euros adicionales puede incrementarse el importe de la deducción por maternidad cuando el contribuyente ha satisfecho gastos de custodia del hijo menor de tres años en guarderías o centros de educación infantil autorizados, según el artículo 81.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Hasta 1.500 euros adicionales por hijo."
  - id: b
    correct: true
    text:
      es: "Hasta 1.000 euros adicionales por hijo."
  - id: c
    text:
      es: "Hasta 500 euros adicionales por hijo."
  - id: d
    text:
      es: "Hasta 2.400 euros adicionales por hijo."
  explanation:
    es: "El incremento por gastos de custodia llega hasta 1.000 euros adicionales (art. 81.2). Los 1.500, los 500 y los 2.400 euros no son cifras del precepto."
  citation: "art. 81.2 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0084
  prompt:
    es: "El hijo de Laura Ferrer cumple tres años el 15 de mayo de 2026. Laura tiene derecho a la deducción por maternidad y ha pagado gastos de guardería por meses completos. Supón que el segundo ciclo de educación infantil puede comenzar en septiembre de 2026. Según el artículo 81.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿hasta qué mes, inclusive, pueden computarse los gastos para el incremento en 2026?"
  options:
  - id: a
    text:
      es: "Hasta el mes de mayo de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el mes de agosto de 2026."
  - id: c
    text:
      es: "Hasta el mes de junio de 2026."
  - id: d
    text:
      es: "Hasta el mes de septiembre de 2026."
  explanation:
    es: "En el período en que el hijo cumple tres años, el incremento puede aplicarse a los gastos posteriores al cumpleaños hasta el mes anterior a aquel en que pueda comenzar el segundo ciclo (art. 81.2). Si empieza en septiembre, el mes anterior es agosto. Mayo es el mes del cumpleaños y no pone fin al incremento. Junio y septiembre no son el mes anterior al inicio del ciclo."
  citation: "art. 81.2 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0085
  prompt:
    es: "De acuerdo con el artículo 81.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se puede solicitar a la Agencia Estatal de Administración Tributaria el abono de la deducción por maternidad de forma anticipada. En estos supuestos:"
  options:
  - id: a
    correct: true
    text:
      es: "no se minorará la cuota diferencial del impuesto."
  - id: b
    text:
      es: "se minorará la cuota diferencial en la mitad del importe de la deducción."
  - id: c
    text:
      es: "se minorará la cuota diferencial por el importe íntegro de la deducción."
  - id: d
    text:
      es: "se minorará la cuota líquida estatal en lugar de la cuota diferencial."
  explanation:
    es: "Quien cobra la deducción por adelantado no la aplica después contra la cuota diferencial (art. 81.4). Minorar la mitad, o el importe íntegro, o trasladar la minoración a la cuota líquida estatal supondría cobrarla dos veces o cambiar de cuota, cosa que la ley no prevé."
  citation: "art. 81.4 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0086
  prompt:
    es: "Según el artículo 81 bis.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué requisito general deben cumplir los contribuyentes que realizan una actividad para minorar la cuota diferencial con las deducciones por familia numerosa o personas con discapacidad a cargo?"
  options:
  - id: a
    text:
      es: "Tener un contrato de trabajo indefinido a jornada completa."
  - id: b
    text:
      es: "Estar dados de alta como trabajadores autónomos, con exclusión de los trabajadores por cuenta ajena, y acreditar cotizaciones superiores al importe de la deducción en cada período."
  - id: c
    text:
      es: "Haber cotizado al menos 30 días en el período impositivo."
  - id: d
    correct: true
    text:
      es: "Estar dados de alta en el régimen correspondiente de la Seguridad Social o mutualidad por la actividad por cuenta propia o ajena que realicen."
  explanation:
    es: "El artículo 81 bis.1 exige realizar una actividad por cuenta propia o ajena por la que se esté dado de alta en el régimen correspondiente de la Seguridad Social o mutualidad. No se pide un contrato indefinido ni jornada completa. Tampoco se limita a los autónomos, porque incluye la actividad por cuenta ajena. Y los 30 días cotizados son un requisito de la deducción por maternidad (art. 81.1), no de esta."
  citation: "art. 81 bis.1 LIRPF"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0087
  prompt:
    es: "¿Hasta cuántos euros anuales puede alcanzar la deducción por cada descendiente con discapacidad con derecho al mínimo por descendientes, según el artículo 81 bis.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Hasta 600 euros anuales por cada descendiente."
  - id: b
    text:
      es: "Hasta 1.000 euros anuales por cada descendiente."
  - id: c
    correct: true
    text:
      es: "Hasta 1.200 euros anuales por cada descendiente."
  - id: d
    text:
      es: "Hasta 3.000 euros anuales por cada descendiente."
  explanation:
    es: "La deducción por descendiente con discapacidad es de hasta 1.200 euros anuales (art. 81 bis.1.a). Los 600 euros son el incremento por hijo que exceda del mínimo de la familia numerosa. Los 1.000 euros son el incremento de la deducción por maternidad por gastos de custodia. Y los 3.000 euros son el mínimo por discapacidad del contribuyente."
  citation: "art. 81 bis.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0088
  prompt:
    es: "De acuerdo con el artículo 81 bis.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en caso de familias numerosas de categoría especial, la deducción por familia numerosa se incrementa en:"
  options:
  - id: a
    text:
      es: "un incremento del 50 por ciento."
  - id: b
    text:
      es: "un incremento del 200 por ciento."
  - id: c
    correct: true
    text:
      es: "un incremento del 100 por ciento."
  - id: d
    text:
      es: "un incremento de 3.000 euros anuales."
  explanation:
    es: "En las familias numerosas de categoría especial la deducción se incrementa en un 100 por ciento (art. 81 bis.1.c). El 50 y el 200 por ciento y la cifra fija de 3.000 euros no son el incremento que fija la ley."
  citation: "art. 81 bis.1.c) LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0089
  prompt:
    es: "Según el artículo 81 bis.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se incrementa la deducción por familia numerosa por cada hijo que forme parte de ella y exceda del número mínimo de hijos exigido?"
  options:
  - id: a
    text:
      es: "Hasta en 600 euros anuales por cada hijo, con independencia del número mínimo exigido."
  - id: b
    correct: true
    text:
      es: "Hasta en 600 euros anuales por cada hijo que exceda del número mínimo exigido para la categoría general o especial, según corresponda."
  - id: c
    text:
      es: "Hasta en 1.200 euros anuales por cada hijo que exceda del número mínimo exigido para la categoría general o especial, según corresponda."
  - id: d
    text:
      es: "En un 100 por ciento por cada hijo que exceda del número mínimo exigido."
  explanation:
    es: "El incremento es de hasta 600 euros anuales por cada hijo que exceda del número mínimo exigido para la categoría general o especial, según corresponda (art. 81 bis.1.c). Contar todos los hijos prescinde del mínimo. Los 1.200 euros son la deducción base, no el incremento. Y el 100 por ciento es el incremento de las familias de categoría especial, no se aplica por hijo."
  citation: "art. 81 bis.1.c) LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0091
  prompt:
    es: "Conforme al artículo 81 bis.1.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la deducción por el cónyuge no separado legalmente con discapacidad exige que este no tenga rentas anuales, excluidas las exentas, superiores a:"
  options:
  - id: a
    text:
      es: "la cifra de 1.800 euros anuales."
  - id: b
    text:
      es: "la cifra de 5.550 euros anuales."
  - id: c
    text:
      es: "la cifra de 22.000 euros anuales."
  - id: d
    correct: true
    text:
      es: "la cifra de 8.000 euros anuales."
  explanation:
    es: "El cónyuge con discapacidad no puede tener rentas anuales, excluidas las exentas, superiores a 8.000 euros (art. 81 bis.1.d). Los 1.800 euros son el límite de la regla 2.ª del artículo 61, los 5.550 euros el mínimo del contribuyente y los 22.000 euros el límite de obligación de declarar por rendimientos del trabajo."
  citation: "art. 81 bis.1.d) LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0092
  prompt:
    es: "Según el artículo 81 bis.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes contribuyentes, sin realizar actividad dada de alta en la Seguridad Social, puede minorar la cuota diferencial con estas deducciones?"
  options:
  - id: a
    text:
      es: "El que perciba únicamente rendimientos del capital inmobiliario."
  - id: b
    text:
      es: "El que perciba únicamente una beca de estudios."
  - id: c
    text:
      es: "El que perciba solo intereses de cuentas corrientes."
  - id: d
    correct: true
    text:
      es: "El que perciba pensiones abonadas por el Régimen de Clases Pasivas del Estado."
  explanation:
    es: "Pueden aplicar las deducciones, sin estar dados de alta en actividad, quienes perciban prestaciones del desempleo, pensiones del Régimen General, de los regímenes especiales o de Clases Pasivas, o prestaciones análogas de mutualidades alternativas (art. 81 bis.1). Las rentas del capital inmobiliario, las becas y los intereses de cuentas no figuran en esa lista."
  citation: "art. 81 bis.1 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0093
  prompt:
    es: "De acuerdo con el artículo 81 bis.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las deducciones por familia numerosa o personas con discapacidad a cargo se calculan de forma proporcional:"
  options:
  - id: a
    text:
      es: "al número de días del período impositivo en que el contribuyente esté dado de alta."
  - id: b
    text:
      es: "a los ingresos anuales del contribuyente."
  - id: c
    correct: true
    text:
      es: "al número de meses en que se cumplan de forma simultánea los requisitos del apartado 1."
  - id: d
    text:
      es: "al número de personas a cargo con discapacidad."
  explanation:
    es: "El cálculo es proporcional al número de meses en que se cumplen de forma simultánea los requisitos del apartado 1 (art. 81 bis.2). La ley no usa los días de alta, ni los ingresos, ni el número de personas a cargo como criterio de proporción."
  citation: "art. 81 bis.2 LIRPF"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0094
  prompt:
    es: "Según el artículo 81 bis.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, para los contribuyentes dados de alta en la Seguridad Social o mutualidad, cada una de las deducciones tiene como límite:"
  options:
  - id: a
    text:
      es: "las retenciones practicadas sobre sus rendimientos del trabajo en el período impositivo."
  - id: b
    correct: true
    text:
      es: "las cotizaciones y cuotas totales a la Seguridad Social y Mutualidades devengadas en cada período impositivo."
  - id: c
    text:
      es: "la cuota líquida total del impuesto del período impositivo."
  - id: d
    text:
      es: "el importe del mínimo por descendientes aplicado en el período impositivo."
  explanation:
    es: "El límite de cada deducción son las cotizaciones y cuotas totales a la Seguridad Social y Mutualidades devengadas en el período (art. 81 bis.2). Las retenciones, la cuota líquida y el mínimo por descendientes no son la referencia que fija el artículo."
  citation: "art. 81 bis.2 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0095
  prompt:
    es: "De acuerdo con el artículo 81 bis.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿ante qué organismo se puede solicitar el abono anticipado de las deducciones por familia numerosa o personas con discapacidad a cargo?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "Ante la Tesorería General de la Seguridad Social."
  - id: c
    text:
      es: "Ante el Instituto Nacional de la Seguridad Social."
  - id: d
    text:
      es: "Ante el Servicio Público de Empleo Estatal."
  explanation:
    es: "El artículo 81 bis.3 prevé solicitar el abono anticipado a la Agencia Estatal de Administración Tributaria. La Tesorería General, el Instituto Nacional de la Seguridad Social y el Servicio Público de Empleo Estatal gestionan cotizaciones, pensiones y prestaciones, pero no esta solicitud."
  citation: "art. 81 bis.3 LIRPF"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0096
  prompt:
    es: "Según el artículo 81 bis.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué efecto tiene sobre la cuota diferencial solicitar el abono anticipado de las deducciones por familia numerosa o personas con discapacidad a cargo?"
  options:
  - id: a
    correct: true
    text:
      es: "No se minora la cuota diferencial del impuesto."
  - id: b
    text:
      es: "Se minora la cuota diferencial en el importe percibido por anticipado."
  - id: c
    text:
      es: "Se minora la cuota diferencial solo en la mitad de las deducciones."
  - id: d
    text:
      es: "Se minora la cuota líquida estatal en lugar de la cuota diferencial."
  explanation:
    es: "Con el abono anticipado no se minora la cuota diferencial (art. 81 bis.3), porque la deducción ya se ha cobrado. Aplicarla además contra la cuota diferencial, total o parcialmente, o trasladarla a la cuota líquida estatal duplicaría o desplazaría un beneficio que la ley no prevé."
  citation: "art. 81 bis.3 LIRPF"
  difficulty: 1
  tags:
  - "efecto"
