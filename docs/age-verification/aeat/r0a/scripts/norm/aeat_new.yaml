    file: sources/normativa/BOE-A-2026-23602_rdl-33-2026_2026-11-11.pdf
  cifras_anuales:
  - cifra: Límites excluyentes del método de estimación objetiva (volumen de rendimientos íntegros del año anterior; parte facturada a empresarios; compras)
    valor_2026: 150.000 euros; 75.000 euros; 150.000 euros
