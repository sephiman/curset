- id: m02-l05-q03
  prompt:
    en: A naive recursive method and a method that stores each result in a map both compute the Fibonacci number
      for n = 20, and each counts its calls. The base cases are 0 and 1. What is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'fib(20) 6765

        naive calls 21891

        memoised calls 39'
  - id: b
    text:
      en: 'fib(20) 6765

        naive calls 10946

        memoised calls 39'
  - id: c
    text:
      en: 'fib(20) 6765

        naive calls 21891

        memoised calls 21'
  - id: d
    text:
      en: 'fib(20) 6765

        naive calls 6765

        memoised calls 39'
  explanation:
    en: The naive method makes 21891 calls and the memoised one makes 39, so it prints `naive calls 21891` and `memoised
      calls 39`. The count `naive calls 10946` counts only the leaves of the recursion tree, but the internal calls
      count as well. The count `memoised calls 21` is the number of distinct arguments, but every cached lookup
      is a call too. The count `naive calls 6765` assumes one call per unit of the result, but the tree has about
      twice as many nodes as its leaves.
  citation: erickson-dynamic-programming#p3
  extract:
    en: We can speed up our recursive algorithm considerably by writing down the results of our recursive calls
      and looking them up again if we need them later.
  snippet: m02-l05/FibonacciMemoisation.java
- id: m02-l05-q04
  prompt:
    en: 'Dynamic programming tables solve four problems on the data below: 0/1 knapsack, longest increasing subsequence,
      edit distance from FOOD to MONEY, and right-or-down paths in a 3 by 3 grid. What is printed?

      ```text

      weights 1 3 4 5, values 1 4 5 7, capacity 7

      sequence 3 1 4 1 5 9 2 6

      ```'
  options:
  - id: a
    text:
      en: 'knapsack 8

        longest increasing subsequence 4

        edit distance 4

        grid paths 6'
  - id: b
    text:
      en: 'knapsack 9

        longest increasing subsequence 5

        edit distance 4

        grid paths 6'
  - id: c
    correct: true
    text:
      en: 'knapsack 9

        longest increasing subsequence 4

        edit distance 4

        grid paths 6'
  - id: d
    text:
      en: 'knapsack 9

        longest increasing subsequence 4

        edit distance 5

        grid paths 6'
  explanation:
    en: The tables give `knapsack 9`, a subsequence of length 4, an edit distance of 4 and 6 grid paths. The value
      `knapsack 8` is what picking by value per weight gives, but the items of weight 3 and 4 together are worth
      9. The length `longest increasing subsequence 5` counts the sentinel element, but the sentinel is not part
      of the sequence. The distance `edit distance 5` is the length of `MONEY`, but the source shows that `FOOD`
      becomes `MONEY` in four edits.
  citation: erickson-dynamic-programming#p15; erickson-dynamic-programming#p13
  extract:
    en: The edit distance between two strings is the minimum number of letter inser- tions, letter deletions, and
      letter substitutions required to transform one string into the other.
  snippet: m02-l05/TabulatedPatterns.java
- id: m02-l05-q05
  prompt:
    en: 'Classes are scheduled greedily, first by earliest start and then by earliest finish, and knapsack items
      are taken by value per weight. The data is below. What is printed?

      ```text

      classes 1-10, 2-3, 4-5, 6-7

      weights 1 3 4 5, values 1 4 5 7, capacity 7

      ```'
  options:
  - id: a
    text:
      en: 'earliest start 3

        earliest finish 1

        greedy knapsack 8'
  - id: b
    text:
      en: 'earliest start 1

        earliest finish 3

        greedy knapsack 9'
  - id: c
    text:
      en: 'earliest start 1

        earliest finish 4

        greedy knapsack 8'
  - id: d
    correct: true
    text:
      en: 'earliest start 1

        earliest finish 3

        greedy knapsack 8'
  explanation:
    en: Earliest start takes the long class 1-10 first and nothing else fits, and earliest finish takes three short
      classes, so it prints `earliest start 1`, `earliest finish 3` and `greedy knapsack 8`. The pair `earliest
      start 3` and `earliest finish 1` swaps the rules, but taking the class 1-10 first blocks every other class.
      The line `greedy knapsack 9` assumes the greedy choice is optimal, but taking the item of weight 5 first leaves
      room only for the item of weight 1. The line `earliest finish 4` counts every class, but the class 1-10 overlaps
      the other three.
  citation: erickson-greedy#p7
  extract:
    en: Argue that we can exchange the optimal choice for the greedy choice without making the solution worse (although
      the exchange might not make it better).
  snippet: m02-l05/GreedyChoices.java
- id: m02-l05-q06
  prompt:
    en: A program applies `Integer.bitCount` to 11, `Integer.highestOneBit` to 100 and `Integer.numberOfTrailingZeros`
      to 40. It also tests 64 and 48 for a power of two with `n & (n - 1)`. What is printed?
  options:
  - id: a
    text:
      en: 'ones in 11: 4

        highest one-bit of 100: 64

        trailing zeros of 40: 3

        64 is a power of two: true

        48 is a power of two: false'
  - id: b
    correct: true
    text:
      en: 'ones in 11: 3

        highest one-bit of 100: 64

        trailing zeros of 40: 3

        64 is a power of two: true

        48 is a power of two: false'
  - id: c
    text:
      en: 'ones in 11: 3

        highest one-bit of 100: 6

        trailing zeros of 40: 3

        64 is a power of two: true

        48 is a power of two: false'
  - id: d
    text:
      en: 'ones in 11: 3

        highest one-bit of 100: 64

        trailing zeros of 40: 3

        64 is a power of two: true

        48 is a power of two: true'
  explanation:
    en: 'The value 11 is 1011, which has 3 one-bits, 100 has its highest one-bit at the value 64, and 40 is 101000
      with 3 trailing zeros. The line `ones in 11: 4` counts the four bits of 1011, but `bitCount` counts only the
      one-bits. The line `highest one-bit of 100: 6` gives a position, but the method returns an int value with
      a single one-bit. The line `48 is a power of two: true` treats a non-zero result as true, but `48 & 47` is
      32, so the test is false.'
  citation: javadoc-integer#bitCount(int); javadoc-integer#highestOneBit(int); javadoc-integer#numberOfTrailingZeros(int)
  snippet: m02-l05/BitOperations.java
