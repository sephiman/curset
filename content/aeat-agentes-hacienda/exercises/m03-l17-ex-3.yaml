# anchor: boe-a-2014-12328-art-23
- id: m03-l17-q0044
  prompt:
    es: "De acuerdo con el artículo 23.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las rentas positivas procedentes de la cesión del derecho de uso o de explotación de patentes tienen derecho a una reducción en la base imponible en el porcentaje que resulte de multiplicar por un 60 por ciento un coeficiente cuyo numerador:"
  options:
  - id: a
    text:
      es: "recoge los gastos de la entidad cedente directamente relacionados con la creación del activo, incrementados en un 50 por ciento, sin superar el denominador."
  - id: b
    text:
      es: "recoge los gastos de la entidad cedente directamente relacionados con la creación del activo y los financieros, sin superar el denominador."
  - id: c
    text:
      es: "recoge todos los gastos de la entidad cedente del ejercicio, incrementados en un 30 por ciento, sin superar el denominador."
  - id: d
    correct: true
    text:
      es: "recoge los gastos de la entidad cedente directamente relacionados con la creación del activo, incrementados en un 30 por ciento, sin superar el denominador."
  explanation:
    es: "El numerador son los gastos de la cedente directamente relacionados con la creación del activo, con subcontratación a terceros no vinculados, incrementados en un 30 por ciento y sin poder superar el denominador. Un incremento del 50 por ciento no es el que fija el artículo. Los gastos financieros quedan fuera del coeficiente en todo caso. Y los gastos que cuentan son los relacionados directamente con la creación del activo, no todos los del ejercicio."
  citation: "art. 23.1 LIS"
  difficulty: 3
  tags:
  - "reducciones"
  - "intangibles"
# anchor: boe-a-2014-12328-art-23
- id: m03-l17-q0045
  prompt:
    es: "¿Cuál de las siguientes rentas tiene derecho a la reducción en la base imponible prevista en el artículo 23 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Las rentas procedentes de la cesión del derecho de uso o de explotación de marcas."
  - id: b
    correct: true
    text:
      es: "Las rentas positivas procedentes de la cesión del derecho de uso de patentes que deriven de actividades de investigación y desarrollo e innovación tecnológica."
  - id: c
    text:
      es: "Las rentas procedentes de la cesión del derecho de explotación de obras literarias, artísticas o científicas, incluidas las películas cinematográficas y los programas informáticos."
  - id: d
    text:
      es: "Las rentas procedentes de la transmisión de una patente a una entidad vinculada con la cedente."
  explanation:
    es: "Tienen derecho a la reducción las rentas de la cesión de patentes y de otros activos del artículo 23.1 que deriven de actividades de investigación y desarrollo e innovación tecnológica. Las marcas y las obras literarias, artísticas o científicas, con las películas, quedan fuera por el artículo 23.5. Y la transmisión solo da derecho a la reducción cuando se hace entre entidades que no tengan la condición de vinculadas."
  citation: "art. 23.5 LIS"
  difficulty: 2
  tags:
  - "reducciones"
  - "intangibles"
# anchor: boe-a-2014-12328-art-24
- id: m03-l17-q0047
  prompt:
    es: "Según el artículo 24.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, serán deducibles fiscalmente las cantidades que las cajas de ahorro y las fundaciones bancarias destinen de sus resultados:"
  options:
  - id: a
    text:
      es: "a la constitución de reservas indisponibles por el importe del incremento de sus fondos propios en el ejercicio."
  - id: b
    text:
      es: "a la distribución de beneficios entre sus impositores, de conformidad con sus estatutos."
  - id: c
    correct: true
    text:
      es: "a la financiación de obras benéfico-sociales, de conformidad con las normas por las que se rigen."
  - id: d
    text:
      es: "a la dotación de provisiones para la cobertura de sus riesgos de crédito."
  explanation:
    es: "El artículo 24.1 hace deducibles las cantidades destinadas de los resultados a obras benéfico-sociales, conforme a las normas que rigen a cajas y fundaciones. La reserva indisponible por incremento de fondos propios es el mecanismo de la reserva de capitalización del artículo 25. El reparto de beneficios entre impositores no figura en el artículo. Y las provisiones por riesgo de crédito se rigen por las reglas de correcciones de valor, no por este artículo."
  citation: "art. 24.1 LIS"
  difficulty: 1
  tags:
  - "reducciones"
  - "obra social"
# anchor: boe-a-2014-12328-art-24
- id: m03-l17-q0048
  prompt:
    es: "De acuerdo con el artículo 24.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre las cantidades asignadas a la obra benéfico-social de las cajas de ahorro y de las fundaciones bancarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Deben aplicarse, al menos en un 50 por ciento, en el mismo período al que corresponda la asignación o en el inmediato siguiente, a inversiones afectas o a gastos de sostenimiento."
  - id: b
    text:
      es: "Deben aplicarse, al menos en un 25 por ciento, en el mismo período al que corresponda la asignación o en los dos siguientes, a inversiones afectas o a gastos de sostenimiento de las instituciones acogidas."
  - id: c
    text:
      es: "Deben aplicarse en su totalidad en el mismo período al que corresponda la asignación, y no pueden aplicarse a gastos de sostenimiento."
  - id: d
    text:
      es: "Deben aplicarse, al menos en un 70 por ciento, en los tres períodos siguientes a aquel al que corresponda la asignación."
  explanation:
    es: "La aplicación debe alcanzar al menos el 50 por ciento, en el período de la asignación o en el inmediato siguiente, a inversiones afectas o a gastos de sostenimiento de las instituciones acogidas. Un 25 por ciento en dos períodos siguientes rebaja el porcentaje y alarga el plazo. Exigir el total en el mismo período y excluir los gastos de sostenimiento no es lo que dice el artículo. Y un 70 por ciento en tres períodos cambia las dos cifras."
  citation: "art. 24.2 LIS"
  difficulty: 2
  tags:
  - "reducciones"
  - "obra social"
# anchor: boe-a-2014-12328-art-25
- id: m03-l17-q0049
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los contribuyentes que tributen al tipo de gravamen de los apartados 1 o 6 del artículo 29 tienen derecho a una reducción en la base imponible del:"
  options:
  - id: a
    text:
      es: "20 por ciento del incremento de sus fondos propios, si este se mantiene 5 años y se dota una reserva indisponible por el importe de la reducción."
  - id: b
    text:
      es: "10 por ciento del incremento de sus fondos propios, si este se mantiene 3 años y se dota una reserva indisponible por el importe de la reducción."
  - id: c
    correct: true
    text:
      es: "20 por ciento del incremento de sus fondos propios, si este se mantiene 3 años y se dota una reserva indisponible por el importe de la reducción."
  - id: d
    text:
      es: "20 por ciento de los beneficios del ejercicio, si estos se mantienen 3 años y se dota una reserva indisponible por el importe de la reducción."
  explanation:
    es: "La reducción es del 20 por ciento del incremento de los fondos propios, con dos requisitos: mantener el incremento 3 años desde el cierre del período, y dotar una reserva por el importe de la reducción, indisponible durante ese plazo. El plazo de 5 años y el porcentaje del 10 por ciento no son los del artículo. Y la base de cálculo es el incremento de fondos propios, no los beneficios del ejercicio."
  citation: "art. 25.1 LIS"
  difficulty: 1
  tags:
  - "reserva de capitalización"
# anchor: boe-a-2014-12328-art-25
- id: m03-l17-q0051
  prompt:
    es: "Según el artículo 25.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, si el incremento de la plantilla media total del contribuyente, respecto de la del período inmediato anterior, se encuentra entre un 5 y un 10 por ciento, tiene derecho a una reducción en la base imponible del:"
  options:
  - id: a
    text:
      es: "23 por ciento del importe del incremento de los fondos propios."
  - id: b
    text:
      es: "30 por ciento del importe del incremento de los fondos propios."
  - id: c
    text:
      es: "20 por ciento del importe del incremento de los fondos propios del ejercicio."
  - id: d
    correct: true
    text:
      es: "26,5 por ciento del importe del incremento de los fondos propios."
  explanation:
    es: "Entre el 5 y el 10 por ciento de incremento de plantilla la reducción es del 26,5 por ciento. El 23 por ciento corresponde a un incremento de al menos un 2 por ciento que no supere el 5. El 30 por ciento corresponde a un incremento superior al 10 por ciento. Y el 20 por ciento es el porcentaje general, sin incremento de plantilla."
  citation: "art. 25.1 LIS"
  difficulty: 2
  tags:
  - "reserva de capitalización"
# anchor: boe-a-2014-12328-art-25
- id: m03-l17-q0052
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el importe del incremento de los fondos propios debe mantenerse desde el cierre del período impositivo al que corresponda la reducción durante un plazo de:"
  options:
  - id: a
    text:
      es: "5 años, salvo por la existencia de pérdidas contables en la entidad."
  - id: b
    correct: true
    text:
      es: "3 años, salvo por la existencia de pérdidas contables en la entidad."
  - id: c
    text:
      es: "2 años, sin excepción alguna por razón de pérdidas contables."
  - id: d
    text:
      es: "3 años, salvo por la existencia de pérdidas fiscales de ejercicios anteriores."
  explanation:
    es: "El incremento de fondos propios debe mantenerse 3 años, y la ley salva el caso de pérdidas contables en la entidad. Los 5 años exceden el plazo. Los 2 años son el plazo para aplicar las cantidades pendientes por insuficiencia de base, que es otra regla, y además aquí hay una excepción. Y las pérdidas fiscales de ejercicios anteriores no son la salvedad: el artículo habla de pérdidas contables."
  citation: "art. 25.1 LIS"
  difficulty: 1
  tags:
  - "reserva de capitalización"
  - "plazo"
# anchor: boe-a-2014-12328-art-25
- id: m03-l17-q0053
  prompt:
    es: "Aceros del Norte SA tiene a 31 de diciembre de 2026 fondos propios de 1.600.000 euros, de los que 100.000 son el resultado de 2026. A 1 de enero de 2026 tenía 1.350.000 euros, de los que 150.000 eran el resultado de 2025. Sin partidas que excluir, cumple los requisitos y la base imponible no limita la reducción. Conforme al artículo 25 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué reducción por reserva de capitalización puede practicar?"
  options:
  - id: a
    text:
      es: "50.000 euros: el 20 por ciento de un incremento de fondos propios de 250.000 euros."
  - id: b
    text:
      es: "30.000 euros: el 20 por ciento de un incremento de fondos propios de 150.000 euros."
  - id: c
    text:
      es: "80.000 euros: el 20 por ciento de un incremento de fondos propios de 400.000 euros."
  - id: d
    correct: true
    text:
      es: "60.000 euros: el 20 por ciento de un incremento de fondos propios de 300.000 euros."
  explanation:
    es: "El incremento es la diferencia positiva entre los fondos propios al cierre sin los resultados del ejercicio y los fondos propios al inicio sin los resultados del ejercicio anterior. Al cierre: 1.600.000 - 100.000 = 1.500.000 euros. Al inicio: 1.350.000 - 150.000 = 1.200.000 euros. La diferencia es 300.000 euros, y el 20 por ciento da 60.000 euros. Restar de los 1.600.000 los 1.350.000 sin quitar los resultados da 250.000 euros. Quitar solo el resultado de 2026 da 150.000 euros. Y quitar solo el de 2025 da 400.000 euros."
  citation: "art. 25.2 LIS"
  difficulty: 3
  tags:
  - "reserva de capitalización"
  - "cómputo"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0054
  prompt:
    es: "Conforme al artículo 26.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las bases imponibles negativas que hayan sido objeto de liquidación o autoliquidación pueden compensarse con las rentas positivas de los períodos siguientes con el límite, en el primer párrafo, del:"
  options:
  - id: a
    text:
      es: "70 por ciento de la base imponible posterior a la aplicación de la reserva de capitalización."
  - id: b
    correct: true
    text:
      es: "70 por ciento de la base imponible previa a la aplicación de la reserva de capitalización y a su compensación."
  - id: c
    text:
      es: "80 por ciento de la cuota íntegra del período, minorada en las reducciones aplicables."
  - id: d
    text:
      es: "60 por ciento de la base imponible previa a la aplicación de la reserva de capitalización y a su compensación."
  explanation:
    es: "El primer párrafo del artículo 26.1 fija el límite en el 70 por ciento de la base imponible previa a la reserva de capitalización y a la propia compensación. Medirlo sobre la base posterior a la reserva cambia la magnitud de referencia. Un porcentaje sobre la cuota íntegra tampoco es el límite: se mide sobre la base imponible. Y el 60 por ciento rebaja la cifra legal. Para los contribuyentes con cifra de negocios de al menos 20 millones, la disposición adicional decimoquinta sustituye ese límite por el 50 o el 25 por ciento."
  citation: "art. 26.1 LIS"
  difficulty: 1
  tags:
  - "compensación de bases negativas"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0056
  prompt:
    es: "Papelería Costa SL, con cifra de negocios de 8.000.000 de euros en los 12 meses anteriores al inicio de su período impositivo de 2026, tiene una base imponible previa a la compensación de 1.200.000 euros y bases imponibles negativas pendientes de 2.000.000 de euros. No aplica reserva de capitalización. Conforme al artículo 26.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué importe puede compensar en 2026?"
  options:
  - id: a
    text:
      es: "840.000 euros, el 70 por ciento de la base imponible previa, sin tener en cuenta ningún importe mínimo."
  - id: b
    text:
      es: "1.200.000 euros, toda la base imponible previa, porque las bases negativas pendientes son mayores."
  - id: c
    correct: true
    text:
      es: "1.000.000 de euros, porque en todo caso puede compensar hasta ese importe y el 70 por ciento de la base previa solo sería de 840.000 euros."
  - id: d
    text:
      es: "600.000 euros, el 50 por ciento de la base imponible previa, límite propio de su cifra de negocios."
  explanation:
    es: "El 70 por ciento de 1.200.000 euros son 840.000 euros. Pero el artículo 26.1 permite compensar en todo caso bases negativas hasta 1 millón de euros por período, y esa cifra es mayor. Puede compensar 1.000.000 de euros y le quedan 1.000.000 pendientes. Aplicar solo los 840.000 euros ignora ese mínimo. Compensar toda la base previa supera el límite. Y el 50 por ciento es el límite de los contribuyentes con cifra de negocios de entre 20 y 60 millones de euros, que no es el caso con 8 millones."
  citation: "art. 26.1 LIS"
  difficulty: 3
  tags:
  - "compensación de bases negativas"
  - "cómputo"
# anchor: boe-a-2014-12328-da-decimoquinta
- id: m03-l17-q0057
  prompt:
    es: "Siderúrgica del Ebro SA, con cifra de negocios de 30.000.000 de euros en los 12 meses anteriores al inicio de su período impositivo, iniciado el 1 de enero de 2026, tiene una base imponible previa a la compensación de 10.000.000 de euros y bases negativas pendientes de 8.000.000 de euros. No aplica reserva de capitalización. Conforme a la disposición adicional decimoquinta.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué importe puede compensar en ese período?"
  options:
  - id: a
    correct: true
    text:
      es: "5.000.000 de euros, el 50 por ciento de la base imponible previa."
  - id: b
    text:
      es: "7.000.000 de euros, el 70 por ciento de la base imponible previa."
  - id: c
    text:
      es: "2.500.000 euros, el 25 por ciento de la base imponible previa."
  - id: d
    text:
      es: "8.000.000 de euros, todas las bases negativas pendientes, por superar el millón de euros."
  explanation:
    es: "Con una cifra de negocios de al menos 20 millones y menos de 60, en períodos iniciados desde el 1 de enero de 2024, el límite del artículo 26.1 se sustituye por el 50 por ciento: 10.000.000 x 50 % = 5.000.000 euros. El 70 por ciento es el límite general, que aquí no se aplica. El 25 por ciento corresponde a una cifra de negocios de al menos 60 millones. Y el millón de euros que se puede compensar en todo caso es un mínimo, no permite compensar todo lo pendiente."
  citation: "disposición adicional decimoquinta.1 LIS"
  difficulty: 3
  tags:
  - "compensación de bases negativas"
  - "cómputo"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0058
  prompt:
    es: "De acuerdo con el artículo 26.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el límite de compensación de bases imponibles negativas no se aplica en el período impositivo en que se produzca la extinción de la entidad, salvo que la extinción:"
  options:
  - id: a
    text:
      es: "sea consecuencia de un procedimiento concursal en el que se liquide el patrimonio de la entidad."
  - id: b
    text:
      es: "se produzca antes de que la entidad haya generado una base imponible positiva en alguno de sus tres primeros períodos impositivos, con independencia de su forma jurídica."
  - id: c
    correct: true
    text:
      es: "sea consecuencia de una operación de reestructuración a la que resulte de aplicación el régimen fiscal especial del capítulo VII del título VII."
  - id: d
    text:
      es: "afecte a una entidad cuyas bases imponibles negativas pendientes superen un millón de euros."
  explanation:
    es: "El límite no se aplica en el período de extinción, salvo que esta resulte de una operación de reestructuración acogida al régimen especial del capítulo VII del título VII. El procedimiento concursal no es la excepción que el artículo establece. Los tres primeros períodos con base positiva son la regla de las entidades de nueva creación, que es otra distinta. Y el millón de euros es el importe que puede compensarse en todo caso, no un umbral que active el límite en la extinción."
  citation: "art. 26.1 LIS"
  difficulty: 3
  tags:
  - "compensación de bases negativas"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0059
  prompt:
    es: "Según el artículo 26.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, si el período impositivo tiene una duración inferior al año, las bases imponibles negativas que pueden compensarse en todo caso son el resultado de multiplicar 1 millón de euros por:"
  options:
  - id: a
    text:
      es: "la proporción existente entre la base imponible del período y la del ejercicio anterior."
  - id: b
    correct: true
    text:
      es: "la proporción existente entre la duración del período impositivo respecto del año."
  - id: c
    text:
      es: "la proporción existente entre el importe neto de la cifra de negocios del período y 1 millón de euros."
  - id: d
    text:
      es: "el porcentaje de la base imponible previa que corresponda según la duración del período."
  explanation:
    es: "Para períodos inferiores al año el millón de euros se prorratea por la proporción que la duración del período representa respecto del año. La proporción con la base del ejercicio anterior no es la del artículo. Tampoco lo es la relación entre la cifra de negocios y el millón. Y el porcentaje de la base previa es el límite del primer párrafo, no el prorrateo del importe que se compensa en todo caso."
  citation: "art. 26.2 LIS"
  difficulty: 1
  tags:
  - "compensación de bases negativas"
  - "período"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0060
  prompt:
    es: "De acuerdo con el artículo 26.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el límite del primer párrafo del apartado 1 no se aplica a las entidades de nueva creación del artículo 29.1, en:"
  options:
  - id: a
    text:
      es: "los 2 primeros períodos impositivos en que se genere una base imponible positiva previa a su compensación."
  - id: b
    text:
      es: "los 3 primeros períodos impositivos desde su constitución, aunque la base imponible previa sea negativa."
  - id: c
    text:
      es: "los 5 primeros períodos impositivos en que se genere una base imponible positiva previa a su compensación."
  - id: d
    correct: true
    text:
      es: "los 3 primeros períodos impositivos en que se genere una base imponible positiva previa a su compensación."
  explanation:
    es: "Las entidades de nueva creación quedan fuera del límite en los 3 primeros períodos en que generen base imponible positiva previa a la compensación. Dos períodos coincide con la duración del tipo reducido del 15 por ciento, que es otra regla. Contar desde la constitución sin atender a la base positiva cambia el cómputo. Y cinco períodos supera el plazo legal."
  citation: "art. 26.3 LIS"
  difficulty: 2
  tags:
  - "compensación de bases negativas"
  - "nueva creación"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0061
  prompt:
    es: "Conforme al artículo 26.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre las circunstancias que impiden compensar las bases imponibles negativas de una entidad:"
  options:
  - id: a
    text:
      es: "Entre ellas, que quienes adquirieron la mayoría del capital hubieran tenido una participación inferior al 50 por ciento al concluir el período al que corresponde la base negativa."
  - id: b
    correct: true
    text:
      es: "Entre ellas, que quienes adquirieron la mayoría del capital hubieran tenido una participación inferior al 25 por ciento al concluir el período al que corresponde la base negativa."
  - id: c
    text:
      es: "Entre ellas, que la mayoría del capital se hubiera adquirido antes de la conclusión del período al que corresponde la base negativa."
  - id: d
    text:
      es: "Entre ellas, que quienes adquirieron la mayoría del capital hubieran tenido una participación superior al 25 por ciento al concluir ese período."
  explanation:
    es: "Una de las circunstancias es que los adquirentes de la mayoría del capital tuvieran menos del 25 por ciento en el momento de concluir el período de la base negativa. Un 50 por ciento cambia el umbral. La adquisición debe ser posterior a la conclusión del período, no anterior. Y una participación superior al 25 por ciento invierte la condición."
  citation: "art. 26.4 LIS"
  difficulty: 2
  tags:
  - "compensación de bases negativas"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0062
  prompt:
    es: "Según el artículo 26.5 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿en qué plazo prescribe el derecho de la Administración para iniciar el procedimiento de comprobación de las bases imponibles negativas compensadas o pendientes de compensación?"
  options:
  - id: a
    text:
      es: "A los 5 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su compensación."
  - id: b
    text:
      es: "A los 15 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su compensación."
  - id: c
    text:
      es: "A los 10 años, a contar desde el día siguiente a aquel en que se presente la declaración del período en que se compense la base negativa."
  - id: d
    correct: true
    text:
      es: "A los 10 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su compensación."
  explanation:
    es: "El derecho a iniciar la comprobación prescribe a los 10 años desde el día siguiente al fin del plazo de presentación de la declaración del período en que se generó el derecho a compensar. Cinco y quince años no son el plazo del artículo. Y contar desde la presentación de la declaración del período en que se compensa cambia el punto de partida: el artículo mira al período en que se generó el derecho. En el examen 2024 (pregunta 43) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 26.5 LIS"
  difficulty: 2
  tags:
  - "compensación de bases negativas"
  - "prescripción"
# anchor: boe-a-2014-12328-art-26
- id: m03-l17-q0063
  prompt:
    es: "Una sociedad generó una base imponible negativa en 2014, liquidada en su momento, y no la ha compensado todavía. En su período de 2026 obtiene una base imponible positiva. ¿Cuál de las siguientes afirmaciones es correcta según el artículo 26.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "No puede compensarla, porque solo cabe compensar durante los 10 años siguientes al de su generación."
  - id: b
    text:
      es: "No puede compensarla, porque solo cabe compensar en los 3 períodos impositivos siguientes al de su generación."
  - id: c
    correct: true
    text:
      es: "Puede compensarla con la base positiva de 2026, porque el artículo no fija un plazo máximo para la compensación, y con los límites que el artículo establece."
  - id: d
    text:
      es: "Puede compensarla, pero sin límite porcentual alguno, al haber transcurrido más de 10 años desde su generación."
  explanation:
    es: "El artículo 26.1 no establece plazo máximo para compensar: la base negativa liquidada puede compensarse con las rentas positivas de cualquier período posterior, dentro del límite porcentual y del importe de 1 millón de euros. Los 10 años no son un plazo de compensación: son el plazo de prescripción del derecho de la Administración a comprobar, del artículo 26.5. Tres períodos tampoco figuran en ningún apartado. Y el paso del tiempo no suprime el límite porcentual."
  citation: "art. 26.1 LIS"
  difficulty: 2
  tags:
  - "compensación de bases negativas"
