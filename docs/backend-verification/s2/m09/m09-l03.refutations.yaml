m09-l03-q01:
  key:
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: If no policy exists for the table, a default-deny policy is used, meaning that no rows are visible or can be modified.
  wrong:
  - option: See and modify all rows, because the SQL privilege system alone decides access
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: all normal access to the table for selecting rows or modifying rows must be allowed by a row security policy
  - option: See all rows but update none of them
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: so that no rows will be visible or updatable.
  - option: Nothing, because every query fails with an error until a policy is created
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: Typically, no error occurs when a row is not visible, but see Table 301 for exceptions.
m09-l03-q02:
  key:
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: For policies that can have both USING and WITH CHECK expressions (ALL and UPDATE), if no WITH CHECK expression is defined, then the USING expression will be used both to determine which rows are visible (normal USING case) and which new rows will be allowed to be added (WITH CHECK case).
  wrong:
  - option: Against no expression, so any new row value is allowed
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: For policies that can have both USING and WITH CHECK expressions (ALL and UPDATE), if no WITH CHECK expression is defined, then the USING expression will be used both to determine which rows are visible (normal USING case) and which new rows will be allowed to be added (WITH CHECK case).
    exclusive: true
  - option: Against an implicit `WITH CHECK (true)` expression
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: For policies that can have both USING and WITH CHECK expressions (ALL and UPDATE), if no WITH CHECK expression is defined, then the USING expression will be used both to determine which rows are visible (normal USING case) and which new rows will be allowed to be added (WITH CHECK case).
    exclusive: true
  - option: Against the `USING` expressions of the `SELECT` policies only
    anchor: pg-sql-createpolicy#id-1.9.3.75.5
    sentence: For policies that can have both USING and WITH CHECK expressions (ALL and UPDATE), if no WITH CHECK expression is defined, then the USING expression will be used both to determine which rows are visible (normal USING case) and which new rows will be allowed to be added (WITH CHECK case).
    exclusive: true
m09-l03-q03:
  key:
    anchor: pg-sql-createpolicy#id-1.9.3.75.6.4
    sentence: Thus all the PERMISSIVE policy expressions are combined using OR, all the RESTRICTIVE policy expressions are combined using AND, and the results are combined using AND.
  wrong:
  - option: All three expressions are combined with OR, so any one of them grants access
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: When multiple policies apply to a given query, they are combined using either OR (for permissive policies, which are the default) or using AND (for restrictive policies).
  - option: All three expressions are combined with AND, so every policy must pass
    anchor: pg-sql-createpolicy#id-1.9.3.75.6.4
    sentence: then there must be at least one PERMISSIVE policy granting access to the relation, and all of the RESTRICTIVE policies must pass.
  - option: Only the restrictive policy is applied, because the stricter policy overrides the others
    anchor: pg-sql-createpolicy#id-1.9.3.75.6.4
    sentence: If there are no PERMISSIVE policies, then access is denied.
m09-l03-q04:
  key:
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: though a table owner can choose to be subject to row security with ALTER TABLE ... FORCE ROW LEVEL SECURITY.
  wrong:
  - option: With `ALTER TABLE ... ENABLE ROW LEVEL SECURITY`, which applies to every role including the owner
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: However, the table's owner is typically not subject to row security policies.
  - option: By granting the owner the `BYPASSRLS` attribute
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: Superusers and roles with the BYPASSRLS attribute always bypass the row security system when accessing a table.
  - option: It is not possible, because table owners always bypass row security
    anchor: pg-ddl-rowsecurity#DDL-ROWSECURITY
    sentence: though a table owner can choose to be subject to row security with ALTER TABLE ... FORCE ROW LEVEL SECURITY.
m09-l03-q05:
  key:
    anchor: pg-ddl-schemas#DDL-SCHEMAS-PATTERNS
    sentence: In PostgreSQL 15 and later, the default configuration supports this usage pattern.
  wrong:
  - option: Keeping the default search path and granting privileges to create in the public schema
    anchor: pg-ddl-schemas#DDL-SCHEMAS-PATTERNS
    sentence: In databases upgraded from PostgreSQL 14 or earlier, this is the default.
  - option: Removing the public schema from the default search path
    anchor: pg-ddl-schemas#DDL-SCHEMAS-PATTERNS
    sentence: Remove the public schema from the default search path, by modifying postgresql.conf or by issuing ALTER ROLE ALL SET search_path
  - option: Installing the shared applications into the private schema of each user
    anchor: pg-ddl-schemas#DDL-SCHEMAS-PATTERNS
    sentence: For any pattern, to install shared applications (tables to be used by everyone, additional functions provided by third parties, etc.), put them into separate schemas.
