# anchor: boe-a-1982-5196-art-46
- id: m01-l02-q0054
  prompt:
    es: "Según el artículo 46 del Reglamento del Congreso de 10 de febrero de 1982, además de las Comisiones Permanentes Legislativas, ¿cuáles son también Comisiones Permanentes?"
  options:
  - id: a
    text:
      es: "Las de investigación y las de Reglamento, Estatuto y Peticiones."
  - id: b
    text:
      es: "Las que deban constituirse por disposición legal y las de investigación."
  - id: c
    correct: true
    text:
      es: "Las que deban constituirse por disposición legal y las de Reglamento, Estatuto y Peticiones."
  - id: d
    text:
      es: "Las de Reglamento, Estatuto y Peticiones, y las Ponencias de cada Comisión."
  explanation:
    es: "El artículo 46.2 del Reglamento dice: «Son también Comisiones Permanentes aquellas que deban constituirse por disposición legal y las siguientes: 1ª. Reglamento. 2ª. Estatuto. 3ª. Peticiones». Las Comisiones de investigación no están en esa lista. Las Ponencias no son Comisiones Permanentes."
  citation: "art. 46.2 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-82
- id: m01-l02-q0065
  prompt:
    es: "Según la Constitución Española de 1978, señale la respuesta correcta sobre la forma de otorgar al Gobierno la delegación legislativa:"
  options:
  - id: a
    text:
      es: "Mediante una ley orgánica cuando su objeto sea la formación de textos articulados."
  - id: b
    text:
      es: "Mediante una ley de bases cuando se trate de refundir varios textos legales en uno solo."
  - id: c
    correct: true
    text:
      es: "Mediante una ley de bases cuando su objeto sea la formación de textos articulados."
  - id: d
    text:
      es: "Mediante un decreto legislativo cuando se trate de refundir varios textos legales en uno solo."
  explanation:
    es: "El artículo 82.2 dice que la delegación «deberá otorgarse mediante una ley de bases cuando su objeto sea la formación de textos articulados o por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo». No se otorga por ley orgánica. Para refundir textos se usa una ley ordinaria, no una ley de bases. El decreto legislativo es la norma que dicta el Gobierno en uso de la delegación (art. 85), no la que la otorga."
  citation: "art. 82.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-87
- id: m01-l02-q0074
  prompt:
    es: "¿Cuál de las siguientes opciones recoge a quienes corresponde la iniciativa legislativa, de acuerdo con el artículo 87.1 de la Constitución Española de 1978, dentro del capítulo segundo del título III?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Gobierno, al Congreso y al Senado."
  - id: b
    text:
      es: "Al Gobierno y al Congreso, pero no al Senado."
  - id: c
    text:
      es: "Al Congreso y al Senado, pero no al Gobierno."
  - id: d
    text:
      es: "Al Gobierno, al Congreso, al Senado y al Defensor del Pueblo."
  explanation:
    es: "El artículo 87.1 atribuye la iniciativa legislativa al Gobierno, al Congreso y al Senado, sin excluir a ninguno de los tres. Las opciones que dejan fuera al Senado o al Gobierno recortan la lista de tres titulares, y la que añade al Defensor del Pueblo suma un cuarto que el apartado no incluye."
  citation: "art. 87.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-91
- id: m01-l02-q0080
  prompt:
    es: "Conforme al artículo 91 de la Constitución Española de 1978, el Rey sancionará en el plazo de quince días las leyes aprobadas por las Cortes Generales y, además:"
  options:
  - id: a
    text:
      es: "Las someterá a referéndum antes de su publicación."
  - id: b
    correct: true
    text:
      es: "Las promulgará y ordenará su inmediata publicación."
  - id: c
    text:
      es: "Las devolverá al Senado si no las considera oportunas."
  - id: d
    text:
      es: "Las promulgará, y ordenará su publicación cuando lo pida el Gobierno."
  explanation:
    es: "El artículo 91 completa la sanción con la promulgación y la orden de inmediata publicación. No prevé referéndum previo, ni la devolución al Senado, ni que la publicación dependa de una petición del Gobierno."
  citation: "art. 91 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1981-10325-art-3
- id: m01-l02-q0085
  prompt:
    es: "¿Cuál de las siguientes condiciones debe cumplir un español para poder ser elegido Defensor del Pueblo, según el artículo 3 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Ser mayor de treinta y cinco años y licenciado en Derecho."
  - id: b
    correct: true
    text:
      es: "Ser mayor de edad y encontrarse en el pleno disfrute de sus derechos civiles y políticos."
  - id: c
    text:
      es: "Ser mayor de veinticinco años y no estar afiliado a ningún partido."
  - id: d
    text:
      es: "Ser mayor de edad y tener diez años de ejercicio de una profesión jurídica."
  explanation:
    es: "El artículo 3 solo pide ser español mayor de edad y estar en pleno disfrute de los derechos civiles y políticos. No exige una edad concreta, ni licenciatura en Derecho, ni años de ejercicio profesional. La no afiliación a un partido es una incompatibilidad del artículo 7, no un requisito de elegibilidad."
  citation: "art. 3 LO 3/1981"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1981-10325-art-6
- id: m01-l02-q0089
  prompt:
    es: "Señale la respuesta correcta sobre la independencia del Defensor del Pueblo respecto de mandatos e instrucciones, según el artículo 6.1 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    correct: true
    text:
      es: "No recibirá instrucciones de ninguna Autoridad."
  - id: b
    text:
      es: "Recibirá instrucciones de la Comisión Mixta Congreso-Senado."
  - id: c
    text:
      es: "Recibirá instrucciones de las Mesas de ambas Cámaras."
  - id: d
    text:
      es: "Informará al Gobierno antes de iniciar cualquier investigación."
  explanation:
    es: "El artículo 6.1 añade que no recibe instrucciones de ninguna Autoridad y que actúa con autonomía y según su criterio. La Comisión Mixta se relaciona con el Defensor e informa a los Plenos, sin darle instrucciones. Las Mesas de las Cámaras no dan instrucciones al Defensor. Informar al Gobierno antes de investigar contradice esa autonomía."
  citation: "art. 6.1 LO 3/1981"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1981-10325-art-8
- id: m01-l02-q0090
  prompt:
    es: "¿Cuál de los siguientes requisitos condiciona el nombramiento y la separación de los Adjuntos por el Defensor del Pueblo, según el artículo 8.2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Previa propuesta de la Comisión Mixta Congreso-Senado."
  - id: b
    text:
      es: "Previa autorización del Gobierno."
  - id: c
    correct: true
    text:
      es: "Previa conformidad de las Cámaras."
  - id: d
    text:
      es: "Libremente, sin intervención de las Cámaras."
  explanation:
    es: "El artículo 8.2 condiciona el nombramiento y la separación de los Adjuntos a la conformidad previa de las Cámaras. La conformidad corresponde a las Cámaras: una propuesta de la Comisión Mixta o la autorización del Gobierno sustituyen a ese órgano, y la libre decisión suprime el control."
  citation: "art. 8.2 LO 3/1981"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1981-10325-art-11
- id: m01-l02-q0093
  prompt:
    es: "¿Cuál de los siguientes órganos recibe la comunicación del Defensor del Pueblo cuando las Cortes Generales no están reunidas o han sido disueltas, según el artículo 11 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "La Comisión Mixta Congreso-Senado."
  - id: b
    correct: true
    text:
      es: "Las Diputaciones Permanentes de las Cámaras."
  - id: c
    text:
      es: "Los Presidentes de las Cámaras."
  - id: d
    text:
      es: "El Gobierno."
  explanation:
    es: "El artículo 11.2 manda dirigirse a las Diputaciones Permanentes de las Cámaras, que velan por los poderes de estas cuando no están reunidas. La Comisión Mixta y los Presidentes no sustituyen a las Cortes en ese momento. El Gobierno es la Administración que el Defensor supervisa."
  citation: "art. 11 LO 3/1981"
  difficulty: 3
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1981-10325-art-17
- id: m01-l02-q0095
  prompt:
    es: "Señale la respuesta correcta sobre el régimen de recurso de las decisiones del Defensor del Pueblo, conforme al artículo 17.3 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    text:
      es: "Cabe recurso ante el Tribunal Supremo."
  - id: b
    correct: true
    text:
      es: "No serán susceptibles de recurso."
  - id: c
    text:
      es: "Cabe recurso ante la Comisión Mixta Congreso-Senado."
  - id: d
    text:
      es: "Cabe recurso de alzada ante la Mesa del Congreso."
  explanation:
    es: "El artículo 17.3 dice que las decisiones del Defensor del Pueblo no son susceptibles de recurso. Ni el Tribunal Supremo, ni la Comisión Mixta, ni la Mesa del Congreso son vías de recurso frente a esas decisiones."
  citation: "art. 17.3 LO 3/1981"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1981-10325-art-7
- id: m01-l02-q0106
  prompt:
    es: "Según el artículo 7 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué ocurre si el Defensor del Pueblo no cesa en su situación de incompatibilidad dentro de los diez días siguientes a su nombramiento?"
  options:
  - id: a
    text:
      es: "Se entiende que renuncia al cargo en la fecha en que se produjo la incompatibilidad."
  - id: b
    text:
      es: "Las Cámaras declaran la vacante por mayoría de tres quintos, previa audiencia del interesado."
  - id: c
    text:
      es: "Se le concede un nuevo plazo de diez días para que cese en la incompatibilidad."
  - id: d
    correct: true
    text:
      es: "Se entiende que no acepta el nombramiento."
  explanation:
    es: "El artículo 7.2 de la LO 3/1981 dice que, si no cesa en ese plazo, se entiende «en caso contrario que no acepta el nombramiento». La renuncia en la fecha de la incompatibilidad es la consecuencia de la incompatibilidad sobrevenida tras la toma de posesión (art. 7.3). La ley no prevé declaración de vacante por las Cámaras para este caso ni un nuevo plazo."
  citation: "art. 7.2 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1982-5196-art-10
- id: m01-l02-q0115
  prompt:
    es: "Según el artículo 10 del Reglamento del Congreso de 10 de febrero de 1982, ¿hasta cuándo gozan de inviolabilidad las diputadas y diputados por las opiniones manifestadas en el ejercicio de sus funciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Aun después de haber cesado en su mandato."
  - id: b
    text:
      es: "Solo durante el período de su mandato."
  - id: c
    text:
      es: "Hasta la disolución de la Cámara que los eligió."
  - id: d
    text:
      es: "Hasta la constitución de las nuevas Cortes Generales."
  explanation:
    es: "El artículo 10 del Reglamento dice que gozan de inviolabilidad «aun después de haber cesado en su mandato». La limitación al período del mandato es la de la inmunidad (art. 71.2 CE). La inviolabilidad no termina con la disolución ni con la constitución de las nuevas Cortes Generales."
  citation: "art. 10 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-1982-5196-art-57
- id: m01-l02-q0124
  prompt:
    es: "Según el artículo 57 del Reglamento del Congreso de 10 de febrero de 1982, en los casos de disolución o expiración del mandato del Congreso, ¿qué facultades asume la Diputación Permanente?"
  options:
  - id: a
    text:
      es: "Las relativas a los Decretos-leyes y a la moción de censura."
  - id: b
    correct: true
    text:
      es: "Las relativas a los Decretos-leyes y a los estados de alarma, excepción y sitio."
  - id: c
    text:
      es: "Las relativas a los estados de alarma, excepción y sitio y a la investidura."
  - id: d
    text:
      es: "Las relativas a los Decretos-leyes y a las leyes orgánicas declaradas urgentes."
  explanation:
    es: "El artículo 57 del Reglamento le atribuye las facultades que el artículo 86 de la Constitución da al Congreso sobre los Decretos-leyes y las competencias del artículo 116 «respecto de los estados de alarma, excepción y sitio». La moción de censura, la investidura y las leyes orgánicas no están entre ellas."
  citation: "art. 57 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "competencia"
