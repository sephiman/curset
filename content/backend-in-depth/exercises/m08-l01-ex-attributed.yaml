    en: Jepsen writes that the model known as Serializability guarantees that every legal history must be equivalent
      to a totally ordered execution. It writes that a consistency model is a safety property which declares what
      a system can do, which contradicts calling it a liveness property. It writes that preventing specific cycles
      in the dependency graph gives rise to different consistency models, which contradicts a single model. It writes
      that models are often defined in terms of proscribed phenomena, specific patterns of operations, which contradicts
      a performance metric.
