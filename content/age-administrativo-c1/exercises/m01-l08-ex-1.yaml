# anchor: boe-a-1978-31229-art-103
- id: m01-l08-q001
  prompt:
    es: "Según la Constitución Española de 1978, entre los principios de acuerdo con los cuales actúa la Administración Pública figuran:"
  options:
  - id: a
    text:
      es: "La neutralidad y la independencia."
  - id: b
    text:
      es: "La subsidiariedad y la proporcionalidad."
  - id: c
    correct: true
    text:
      es: "La descentralización y la desconcentración."
  - id: d
    text:
      es: "La eficiencia y la autonomía."
  explanation:
    es: "El artículo 103.1 CE enumera cinco principios: «eficacia, jerarquía, descentralización, desconcentración y coordinación». La descentralización y la desconcentración están en esa lista. La eficiencia, la autonomía, la neutralidad, la independencia, la subsidiariedad y la proporcionalidad no figuran en el artículo."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-54
- id: m01-l08-q002
  prompt:
    es: "De acuerdo con el artículo 54.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado se organiza según los principios del artículo 3 y, además, los de:"
  options:
  - id: a
    text:
      es: "Descentralización política y desconcentración funcional y territorial."
  - id: b
    correct: true
    text:
      es: "Descentralización funcional y desconcentración funcional y territorial."
  - id: c
    text:
      es: "Descentralización territorial y desconcentración funcional y orgánica."
  - id: d
    text:
      es: "Autonomía funcional y desconcentración territorial y orgánica."
  explanation:
    es: "El artículo 54.1 añade a los principios del artículo 3 «los de descentralización funcional y desconcentración funcional y territorial». La descentralización que nombra es funcional, no territorial ni política. La ley no habla de autonomía funcional ni de desconcentración orgánica."
  citation: "art. 54.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-55-bis
- id: m01-l08-q003
  prompt:
    es: "Según el artículo 55 bis de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en el nombramiento de los titulares de las Secretarías de Estado y de los órganos directivos, las personas de cada sexo:"
  options:
  - id: a
    text:
      es: "No superarán el setenta por ciento ni serán menos del treinta por ciento en cada departamento ministerial."
  - id: b
    text:
      es: "No superarán el sesenta por ciento ni serán menos del cuarenta por ciento en el conjunto de la Administración General del Estado."
  - id: c
    correct: true
    text:
      es: "No superarán el sesenta por ciento ni serán menos del cuarenta por ciento en cada departamento ministerial."
  - id: d
    text:
      es: "No superarán el cincuenta y cinco por ciento ni serán menos del cuarenta y cinco por ciento en cada departamento ministerial."
  explanation:
    es: "El artículo 55 bis fija que «las personas de cada sexo no superen el sesenta por ciento ni sean menos del cuarenta por ciento en el ámbito de cada departamento ministerial». Los porcentajes 55/45 y 70/30 no son los de la ley. Una opción tiene los porcentajes correctos, pero los mide en toda la Administración General del Estado y la ley los mide en cada departamento ministerial."
  citation: "art. 55 bis LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q004
  prompt:
    es: "De acuerdo con el artículo 55.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado comprende:"
  options:
  - id: a
    text:
      es: "La Organización Central, la Organización Periférica y el sector público institucional estatal."
  - id: b
    text:
      es: "Los Ministerios, las Delegaciones del Gobierno y los Organismos públicos vinculados o dependientes de ellos."
  - id: c
    text:
      es: "La Organización Central, la Organización Territorial y el sector público institucional estatal."
  - id: d
    correct: true
    text:
      es: "La Organización Central, la Organización Territorial y la Administración General del Estado en el exterior."
  explanation:
    es: "El artículo 55.2 enumera tres partes: «La Organización Central», «La Organización Territorial» y «La Administración General del Estado en el exterior». El sector público institucional se regula en el título II de la ley y no forma parte de esa enumeración. La ley no usa «Organización Periférica» en este artículo, y los Ministerios y las Delegaciones son piezas de dos de esas partes, no la enumeración."
  citation: "art. 55.2 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q005
  prompt:
    es: "Según el artículo 55.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la organización de la Administración General del Estado responde a los principios de:"
  options:
  - id: a
    text:
      es: "División funcional en Secretarías de Estado y gestión territorial integrada en Subdelegaciones del Gobierno en las provincias."
  - id: b
    correct: true
    text:
      es: "División funcional en Departamentos ministeriales y gestión territorial integrada en Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: c
    text:
      es: "División territorial en Departamentos ministeriales y gestión funcional integrada en Subdelegaciones del Gobierno en las provincias."
  - id: d
    text:
      es: "Jerarquía en los Departamentos ministeriales y descentralización territorial en las Comunidades Autónomas y en las provincias."
  explanation:
    es: "El artículo 55.1 habla de «división funcional en Departamentos ministeriales y de gestión territorial integrada en Delegaciones del Gobierno en las Comunidades Autónomas». Una opción invierte funcional y territorial. La de «jerarquía» y «descentralización» cambia los dos principios. Otra pone Secretarías de Estado y Subdelegaciones donde la ley dice Departamentos ministeriales y Delegaciones."
  citation: "art. 55.1 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q006
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos son órganos superiores en la organización central de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Los Ministros y los Subsecretarios de cada departamento."
  - id: b
    text:
      es: "Los Secretarios de Estado y los Secretarios generales."
  - id: c
    correct: true
    text:
      es: "Los Ministros y los Secretarios de Estado."
  - id: d
    text:
      es: "Los Ministros, los Secretarios de Estado y los Subsecretarios."
  explanation:
    es: "El artículo 55.3.a enumera como órganos superiores «Los Ministros» y «Los Secretarios de Estado». Los Subsecretarios y los Secretarios generales son órganos directivos (art. 55.3.b), así que ninguna lista que los incluya como superiores es correcta."
  citation: "art. 55.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q007
  prompt:
    es: "De acuerdo con el artículo 55.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la organización central son órganos directivos:"
  options:
  - id: a
    text:
      es: "Los Secretarios generales técnicos, los Directores generales, los Subdirectores generales y los jefes de servicio."
  - id: b
    correct: true
    text:
      es: "Los Subsecretarios y Secretarios generales, los Secretarios generales técnicos y Directores generales y los Subdirectores generales."
  - id: c
    text:
      es: "Los Secretarios de Estado, los Subsecretarios, los Secretarios generales técnicos y los Directores generales."
  - id: d
    text:
      es: "Solo los Subsecretarios, los Secretarios generales técnicos y los Directores generales, pero no los Subdirectores generales."
  explanation:
    es: "El artículo 55.3.b enumera como órganos directivos a «los Subsecretarios y Secretarios generales», «los Secretarios generales técnicos y Directores generales» y «los Subdirectores generales». Los Secretarios de Estado son órganos superiores. Los Subdirectores generales sí son órganos directivos. Los jefes de servicio no figuran en la lista."
  citation: "art. 55.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q008
  prompt:
    es: "Según el artículo 55.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la organización territorial de la Administración General del Estado son órganos directivos:"
  options:
  - id: a
    text:
      es: "Los Delegados del Gobierno y los Presidentes de las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas y los Subdelegados del Gobierno en las provincias."
  - id: c
    text:
      es: "Solo los Delegados del Gobierno en las Comunidades Autónomas, con rango de Subsecretario."
  - id: d
    text:
      es: "Los Subdelegados del Gobierno en las provincias y los Secretarios generales de las Delegaciones."
  explanation:
    es: "El artículo 55.4 nombra como órganos directivos territoriales «tanto los Delegados del Gobierno en las Comunidades Autónomas» «como los Subdelegados del Gobierno en las provincias». La opción de «solo los Delegados» deja fuera a los Subdelegados. Los Secretarios generales de las Delegaciones y los Presidentes autonómicos no figuran en el artículo; los Presidentes ni siquiera son órganos del Estado."
  citation: "art. 55.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q009
  prompt:
    es: "En la organización territorial de la Administración General del Estado, los Subdelegados del Gobierno en las provincias son órganos directivos que tienen:"
  options:
  - id: a
    correct: true
    text:
      es: "Nivel de Subdirector general, mientras que los Delegados tienen rango de Subsecretario."
  - id: b
    text:
      es: "Nivel de Director general, mientras que los Delegados tienen rango de Subsecretario."
  - id: c
    text:
      es: "Rango de Subsecretario, igual que los Delegados del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Nivel de Subdirector general, mientras que los Delegados tienen rango de Secretario de Estado."
  explanation:
    es: "El artículo 55.4 da a los Delegados del Gobierno «rango de Subsecretario» y a los Subdelegados «nivel de Subdirector general». La opción de «nivel de Director general» sube a los Subdelegados un nivel. Otra les da el rango de los Delegados. Otra acierta con los Subdelegados, pero sube a los Delegados al rango de Secretario de Estado."
  citation: "art. 55.4 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q010
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los órganos directivos de la Administración General del Estado en el exterior, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Los embajadores, los cónsules generales y los cónsules honorarios."
  - id: b
    text:
      es: "Los jefes de las Oficinas Consulares de carrera y los agregados sectoriales."
  - id: c
    text:
      es: "Los Encargados de Negocios con cartas de gabinete y los cónsules honorarios."
  - id: d
    correct: true
    text:
      es: "Los embajadores y representantes permanentes ante Organizaciones internacionales."
  explanation:
    es: "El artículo 55.5 dice que en el exterior «son órganos directivos los embajadores y representantes permanentes ante Organizaciones internacionales». Los cónsules generales, los cónsules honorarios, los jefes de Oficina Consular, los agregados y los Encargados de Negocios no están en esa lista."
  citation: "art. 55.5 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q011
  prompt:
    es: "Según el artículo 55.6 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los órganos superiores y directivos tienen además la condición de alto cargo, excepto:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Subdirectores generales y asimilados."
  - id: b
    text:
      es: "Los Directores generales y asimilados."
  - id: c
    text:
      es: "Los Secretarios generales técnicos y asimilados."
  - id: d
    text:
      es: "Los Subsecretarios y los Secretarios generales."
  explanation:
    es: "El artículo 55.6 da la condición de alto cargo a los órganos superiores y directivos «excepto los Subdirectores generales y asimilados». Los Directores generales, los Secretarios generales técnicos, los Subsecretarios y los Secretarios generales son órganos directivos no exceptuados, así que son altos cargos."
  citation: "art. 55.6 LRJSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-3444-art-2
- id: m01-l08-q012
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado, son idóneos para ser nombrados altos cargos quienes reúnen:"
  options:
  - id: a
    correct: true
    text:
      es: "Honorabilidad y la debida formación y experiencia en la materia, en función del cargo que vayan a desempeñar."
  - id: b
    text:
      es: "La condición de funcionario de carrera del Subgrupo A1 y la debida experiencia en la materia."
  - id: c
    text:
      es: "Honorabilidad, la condición de funcionario de carrera y la debida formación en la materia."
  - id: d
    text:
      es: "Mérito y capacidad acreditados y la debida experiencia en puestos de responsabilidad pública."
  explanation:
    es: "El artículo 2.1 dice: «Son idóneos quienes reúnen honorabilidad y la debida formación y experiencia en la materia, en función del cargo que vayan a desempeñar». La idoneidad no exige ser funcionario; esa condición la piden, para algunos cargos, los artículos de la Ley 40/2015. El mérito y la capacidad no son los requisitos de idoneidad."
  citation: "art. 2.1 Ley 3/2015"
  difficulty: 2
  tags:
  - "requisito"
