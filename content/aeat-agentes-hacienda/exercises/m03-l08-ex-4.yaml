# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0129
  prompt:
    es: "Según el artículo 151.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué otro lugar pueden desarrollarse las actuaciones inspectoras, además del domicilio fiscal y los lugares de las actividades gravadas?"
  options:
  - id: a
    text:
      es: "En el lugar donde exista una prueba completa del hecho imponible, que debe constar en diligencia."
  - id: b
    text:
      es: "En el lugar donde se encuentre el obligado en el momento de recibir la comunicación de inicio."
  - id: c
    text:
      es: "En el lugar donde radiquen los bienes del obligado que sean susceptibles de embargo."
  - id: d
    correct: true
    text:
      es: "En el lugar donde exista alguna prueba, al menos parcial, del hecho imponible o del presupuesto de hecho de la obligación tributaria."
  explanation:
    es: "La letra c) admite el lugar donde exista alguna prueba, al menos parcial, del hecho imponible o del presupuesto de hecho. No exige una prueba completa ni documentada en diligencia, y el lugar donde esté el obligado o donde haya bienes embargables no figura entre los lugares."
  citation: "art. 151.1 LGT"
  difficulty: 2
  tags:
  - "lugar"
  - "prueba"
# anchor: boe-a-2003-23186-art-151
- id: m03-l08-q0142
  prompt:
    es: "¿Con quién se entienden las actuaciones cuando la inspección se persona sin previa comunicación en las instalaciones del obligado, según el artículo 151.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Con el obligado o con su representante legal inscrito en el registro, y con nadie más."
  - id: b
    correct: true
    text:
      es: "Con el obligado o con el encargado o responsable de los locales."
  - id: c
    text:
      es: "Con el obligado o con cualquier trabajador que se encuentre presente en el local."
  - id: d
    text:
      es: "Con el encargado o responsable de los locales, nunca con el propio obligado."
  explanation:
    es: "Las actuaciones se entienden con el obligado o con el encargado o responsable de los locales (art. 151.2). No se limita al representante inscrito, no vale cualquier trabajador y tampoco se excluye al obligado."
  citation: "art. 151.2 LGT"
  difficulty: 2
  tags:
  - "personación"
  - "actuaciones"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0143
  prompt:
    es: "Conforme al artículo 173.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si el personal inspector se persona sin previa comunicación y el obligado o su representante no están presentes, ¿quién debe colaborar en las actuaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquiera de las personas encargadas o responsables de los lugares."
  - id: b
    text:
      es: "Únicamente el apoderado del obligado inscrito en el registro mercantil."
  - id: c
    text:
      es: "Cualquier persona que se encuentre en el local, aunque no sea encargada ni responsable."
  - id: d
    text:
      es: "El representante legal del obligado, que será citado para el día hábil siguiente."
  explanation:
    es: "En defecto del obligado o de su representante, debe colaborar cualquiera de las personas encargadas o responsables de esos lugares (art. 173.2). No se exige un apoderado inscrito, no basta cualquier persona presente y la citación del representante no sustituye la colaboración inmediata."
  citation: "art. 173.2 RGAT"
  difficulty: 2
  tags:
  - "personación"
  - "colaboración"
# anchor: boe-a-2003-23186-art-145
- id: m03-l08-q0146
  prompt:
    es: "De acuerdo con el artículo 145.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de inspección tendrá por objeto comprobar e investigar el adecuado cumplimiento de las obligaciones tributarias y, en su caso, proceder a:"
  options:
  - id: a
    text:
      es: "La regularización de la situación tributaria del obligado mediante una única liquidación definitiva."
  - id: b
    correct: true
    text:
      es: "La regularización de la situación tributaria del obligado mediante la práctica de una o varias liquidaciones."
  - id: c
    text:
      es: "La imposición de las sanciones que correspondan a las infracciones tributarias que se aprecien."
  - id: d
    text:
      es: "La recaudación de las deudas que resulten de las comprobaciones, mediante el procedimiento de apremio, una vez firme la liquidación practicada."
  explanation:
    es: "El artículo 145.1 prevé la regularización mediante una o varias liquidaciones, no una sola ni necesariamente definitiva. Las sanciones se tramitan en el procedimiento sancionador y la recaudación corresponde al período de pago y apremio, no al procedimiento de inspección."
  citation: "art. 145.1 LGT"
  difficulty: 2
  tags:
  - "objeto"
  - "regularización"
# anchor: boe-a-2003-23186-art-145
- id: m03-l08-q0147
  prompt:
    es: "Conforme al artículo 145 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes afirmaciones sobre el objeto de la comprobación en el procedimiento de inspección es cierta?"
  options:
  - id: a
    text:
      es: "Tiene por objeto descubrir hechos con relevancia tributaria no declarados o declarados incorrectamente por los obligados."
  - id: b
    text:
      es: "Tiene por objeto los hechos que la Administración ignora y que no constan en ninguna declaración del obligado tributario."
  - id: c
    text:
      es: "Tiene por objeto las valoraciones que la Administración efectúa de oficio, con independencia de lo declarado por el obligado."
  - id: d
    correct: true
    text:
      es: "Tiene por objeto los actos, elementos y valoraciones consignados por los obligados tributarios en sus declaraciones."
  explanation:
    es: "La comprobación recae sobre lo consignado por los obligados en sus declaraciones (art. 145.2). Descubrir hechos no declarados o declarados incorrectamente es el objeto de la investigación (art. 145.3), y los hechos ignorados por la Administración son materia de investigación, no de comprobación."
  citation: "art. 145.2 LGT"
  difficulty: 2
  tags:
  - "objeto"
  - "comprobación"
# anchor: boe-a-2003-23186-art-145
- id: m03-l08-q0148
  prompt:
    es: "¿Cuál es el objeto de la investigación en el procedimiento de inspección, según el artículo 145.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Verificar la exactitud de los actos y elementos consignados por los obligados en sus declaraciones."
  - id: b
    text:
      es: "Descubrir los hechos que ya constan en los censos tributarios y en las declaraciones informativas recibidas por la Administración tributaria."
  - id: c
    correct: true
    text:
      es: "Descubrir la existencia, en su caso, de hechos con relevancia tributaria no declarados o declarados incorrectamente."
  - id: d
    text:
      es: "Comprobar el valor de los bienes y derechos declarados por el obligado tributario en sus autoliquidaciones."
  explanation:
    es: "La investigación persigue descubrir hechos con relevancia tributaria no declarados o declarados incorrectamente (art. 145.3). Verificar lo consignado en las declaraciones es la comprobación (art. 145.2), y la comprobación de valores es una función distinta (art. 141.d)."
  citation: "art. 145.3 LGT"
  difficulty: 2
  tags:
  - "objeto"
  - "investigación"
# anchor: boe-a-2003-23186-art-147
- id: m03-l08-q0150
  prompt:
    es: "De acuerdo con el artículo 147.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la información que se da a los obligados tributarios al inicio de las actuaciones del procedimiento de inspección:"
  options:
  - id: a
    text:
      es: "Deben ser informados sobre la naturaleza de las actuaciones y su alcance, pero no sobre sus derechos y obligaciones en el curso de ellas."
  - id: b
    correct: true
    text:
      es: "Deben ser informados sobre la naturaleza y alcance de las actuaciones, así como de sus derechos y obligaciones en el curso de ellas."
  - id: c
    text:
      es: "Deben ser informados de la propuesta de liquidación que formulará la inspección al término de las actuaciones."
  - id: d
    text:
      es: "Deben ser informados solo cuando las actuaciones tengan carácter general, y no cuando el alcance sea parcial."
  explanation:
    es: "El artículo 147.2 exige informar al inicio sobre naturaleza y alcance y también sobre derechos y obligaciones. No se anticipa la propuesta de liquidación, y la información se da con independencia de que el alcance sea general o parcial."
  citation: "art. 147.2 LGT"
  difficulty: 2
  tags:
  - "iniciación"
  - "información"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0151
  prompt:
    es: "Conforme al artículo 87.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la iniciación de oficio de las actuaciones y procedimientos requerirá acuerdo del órgano competente para su inicio, por propia iniciativa, como consecuencia de orden superior o:"
  options:
  - id: a
    text:
      es: "A solicitud del obligado tributario afectado por las actuaciones."
  - id: b
    text:
      es: "Por denuncia pública de cualquier persona ante la Administración."
  - id: c
    text:
      es: "Previa autorización del delegado de la Agencia Tributaria en el territorio."
  - id: d
    correct: true
    text:
      es: "A petición razonada de otros órganos."
  explanation:
    es: "El artículo 87.1 recoge tres formas de iniciación de oficio: propia iniciativa, orden superior o petición razonada de otros órganos. La solicitud del obligado es iniciación a instancia de parte, la denuncia pública es una figura distinta y la autorización del delegado no es requisito de este apartado."
  citation: "art. 87.1 RGAT"
  difficulty: 1
  tags:
  - "iniciación"
  - "de oficio"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0152
  prompt:
    es: "¿Cómo se realiza la iniciación de oficio del procedimiento de inspección, según el artículo 87.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante comunicación notificada al obligado tributario o mediante personación."
  - id: b
    text:
      es: "Mediante resolución del órgano competente para liquidar, publicada en el boletín oficial."
  - id: c
    text:
      es: "Mediante diligencia extendida por el actuario, que se firma en presencia del obligado tributario."
  - id: d
    text:
      es: "Mediante requerimiento de información dirigido al obligado y a los terceros con quienes opere."
  explanation:
    es: "La iniciación se realiza mediante comunicación notificada al obligado o mediante personación (art. 87.2). No hay resolución publicada en el boletín, y ni la diligencia ni el requerimiento de información son las formas de iniciar."
  citation: "art. 87.2 RGAT"
  difficulty: 2
  tags:
  - "iniciación"
  - "comunicación"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0153
  prompt:
    es: "Conforme al artículo 87.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, salvo si el inicio es mediante personación, se concederá al obligado un plazo no inferior a 10 días desde el día siguiente al de la notificación de la comunicación de inicio para:"
  options:
  - id: a
    text:
      es: "Que comparezca y aporte únicamente la documentación requerida por la inspección en la comunicación de inicio."
  - id: b
    text:
      es: "Que solicite que las actuaciones de carácter parcial tengan carácter general respecto al tributo y períodos afectados."
  - id: c
    correct: true
    text:
      es: "Que comparezca, aporte la documentación requerida y la que considere conveniente, o efectúe cuantas alegaciones tenga por oportunas."
  - id: d
    text:
      es: "Que formule alegaciones contra la propuesta de liquidación que se incluya en la comunicación de inicio."
  explanation:
    es: "El plazo, no inferior a diez días, sirve para comparecer, aportar la documentación requerida y la que se considere conveniente o alegar lo oportuno (art. 87.4). No se limita a lo requerido. La solicitud de inspección general tiene su propio plazo de quince días (art. 149.2 LGT), y las alegaciones no se circunscriben a la propuesta."
  citation: "art. 87.4 RGAT"
  difficulty: 2
  tags:
  - "iniciación"
  - "plazo"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0154
  prompt:
    es: "De acuerdo con el artículo 87.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el plazo que se concede al obligado tras la notificación de la comunicación de inicio del procedimiento:"
  options:
  - id: a
    text:
      es: "Se concede también en los supuestos de iniciación mediante personación, con una duración mínima de cinco días."
  - id: b
    text:
      es: "Se concede en todo caso, y es de quince días improrrogables desde la notificación de la comunicación."
  - id: c
    text:
      es: "Se concede solo si el obligado lo solicita antes de que se abra el trámite de audiencia del procedimiento."
  - id: d
    correct: true
    text:
      es: "No se concede en los supuestos de iniciación mediante personación."
  explanation:
    es: "El artículo 87.4 excluye ese plazo cuando el procedimiento se inicia mediante personación. Cuando existe, no es de cinco ni de quince días improrrogables, sino no inferior a diez, y no depende de una solicitud del obligado."
  citation: "art. 87.4 RGAT"
  difficulty: 2
  tags:
  - "iniciación"
  - "personación"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0155
  prompt:
    es: "Conforme al artículo 87.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre las declaraciones o autoliquidaciones que presente el obligado una vez iniciadas las actuaciones, en relación con las obligaciones y períodos objeto de la actuación:"
  options:
  - id: a
    text:
      es: "Iniciarán un procedimiento de devolución cuando de ellas resulte una cantidad a devolver a favor del obligado tributario."
  - id: b
    correct: true
    text:
      es: "En ningún caso iniciarán un procedimiento de devolución, sin perjuicio de que en la liquidación se pueda tener en cuenta la información que contengan."
  - id: c
    text:
      es: "No pueden tenerse en cuenta en la liquidación que se practique, porque se presentan una vez iniciadas las actuaciones."
  - id: d
    text:
      es: "Producen los efectos de las declaraciones extemporáneas sin requerimiento previo, con el recargo que corresponda."
  explanation:
    es: "Las declaraciones presentadas tras el inicio no inician un procedimiento de devolución y no producen los efectos del artículo 27 de la Ley (art. 87.5). Sí puede tenerse en cuenta la información que contienen al practicar la liquidación."
  citation: "art. 87.5 RGAT"
  difficulty: 2
  tags:
  - "iniciación"
  - "autoliquidaciones"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0156
  prompt:
    es: "De acuerdo con el artículo 87.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, los ingresos efectuados por el obligado tras el inicio de las actuaciones, en relación con las obligaciones y períodos objeto del procedimiento, tendrán carácter de:"
  options:
  - id: a
    text:
      es: "Ingresos a cuenta sobre el importe de la liquidación que se practique, con intereses de demora sobre la cantidad ingresada hasta que se dicte la liquidación."
  - id: b
    text:
      es: "Ingresos espontáneos a efectos del artículo 27 de la Ley General Tributaria, que impiden apreciar las infracciones que correspondan."
  - id: c
    correct: true
    text:
      es: "Ingresos a cuenta sobre el importe de la liquidación que se practique, sin que se devenguen intereses de demora sobre la cantidad ingresada desde el día siguiente al del ingreso."
  - id: d
    text:
      es: "Pagos definitivos de la deuda tributaria, que impiden practicar una liquidación posterior por esos conceptos y períodos."
  explanation:
    es: "Esos ingresos son a cuenta de la liquidación y, desde el día siguiente al del ingreso, no devengan intereses de demora sobre lo ingresado (art. 87.5). No son espontáneos, porque el artículo 27 no se aplica, y no impiden apreciar las infracciones ni liquidar después."
  citation: "art. 87.5 RGAT"
  difficulty: 3
  tags:
  - "iniciación"
  - "ingresos a cuenta"
# anchor: boe-a-2003-23186-art-148
- id: m03-l08-q0157
  prompt:
    es: "Conforme al artículo 148.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones inspectoras tendrán carácter parcial cuando no afecten a la totalidad de los elementos de la obligación tributaria en el período objeto de la comprobación y:"
  options:
  - id: a
    correct: true
    text:
      es: "En todos aquellos supuestos que se señalen reglamentariamente."
  - id: b
    text:
      es: "En los supuestos que determine el órgano competente para liquidar en cada procedimiento."
  - id: c
    text:
      es: "Cuando el obligado haya solicitado que se limiten a determinados períodos impositivos."
  - id: d
    text:
      es: "Siempre que el procedimiento se inicie mediante personación, sin previa comunicación."
  explanation:
    es: "El artículo 148.2 añade los supuestos que señale el reglamento. No los fija el órgano que liquida caso por caso, ni dependen de la petición del obligado, ni se derivan de iniciar el procedimiento por personación."
  citation: "art. 148.2 LGT"
  difficulty: 1
  tags:
  - "alcance"
  - "parcial"
# anchor: boe-a-2003-23186-art-148
- id: m03-l08-q0158
  prompt:
    es: "¿Qué carácter tienen las actuaciones del procedimiento de inspección que no sean parciales, según el artículo 148.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Carácter general en relación con el obligado tributario y con todos sus períodos no prescritos."
  - id: b
    text:
      es: "Carácter general solo cuando así lo indique la comunicación de inicio del procedimiento."
  - id: c
    text:
      es: "Carácter definitivo en relación con las liquidaciones que se practiquen al término del procedimiento."
  - id: d
    correct: true
    text:
      es: "Carácter general en relación con la obligación tributaria y el período comprobado."
  explanation:
    es: "Si no son parciales, las actuaciones son generales en relación con la obligación tributaria y el período comprobado (art. 148.2). No se refiere a todos los períodos no prescritos ni depende de la comunicación de inicio, y definitivo es un carácter de la liquidación, no del alcance."
  citation: "art. 148.2 LGT"
  difficulty: 1
  tags:
  - "alcance"
  - "general"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0159
  prompt:
    es: "Según el artículo 178.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actuaciones del procedimiento de inspección tendrán carácter general, salvo que se indique otra cosa:"
  options:
  - id: a
    text:
      es: "En la comunicación de inicio del procedimiento inspector, y nunca durante el desarrollo de las actuaciones ni mediante acuerdo posterior."
  - id: b
    text:
      es: "En la liquidación que ponga fin al procedimiento, que fijará el alcance con carácter retroactivo."
  - id: c
    correct: true
    text:
      es: "En la comunicación de inicio del procedimiento inspector o en el acuerdo de modificación que deberá ser comunicado."
  - id: d
    text:
      es: "En el acta de inspección, que determinará el alcance de las actuaciones desarrolladas."
  explanation:
    es: "El carácter general es la regla salvo que lo indique la comunicación de inicio o el acuerdo de modificación del apartado 5, que se comunica (art. 178.2). El alcance no se fija a posteriori en la liquidación ni en el acta, y la comunicación de inicio no es el único momento posible."
  citation: "art. 178.2 RGAT"
  difficulty: 2
  tags:
  - "alcance"
  - "general"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0161
  prompt:
    es: "Conforme al artículo 178.3.c del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actuaciones que tengan por objeto la comprobación de una solicitud de devolución tendrán carácter parcial siempre que se limiten exclusivamente a:"
  options:
  - id: a
    text:
      es: "Verificar que el importe solicitado no excede de las cuotas soportadas que consten en los registros del obligado."
  - id: b
    correct: true
    text:
      es: "Constatar que el contenido de la solicitud presentada se ajusta formalmente a lo anotado en la contabilidad, registros y justificantes del obligado."
  - id: c
    text:
      es: "Comprobar que la solicitud se ha presentado en plazo y que el obligado se encuentra al corriente de sus obligaciones."
  - id: d
    text:
      es: "Investigar los hechos no declarados que hayan podido influir en el importe de la devolución que se solicita."
  explanation:
    es: "La letra c) exige que la comprobación se limite a constatar que la declaración o solicitud se ajusta formalmente a la contabilidad, registros y justificantes, sin perjuicio de la comprobación completa posterior. Verificar importes concretos, el plazo o investigar hechos no declarados va más allá de esa constatación formal."
  citation: "art. 178.3 RGAT"
  difficulty: 2
  tags:
  - "alcance"
  - "parcial"
  - "devolución"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0162
  prompt:
    es: "Según el artículo 178.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué debe comunicarse al inicio en las actuaciones de alcance parcial?"
  options:
  - id: a
    text:
      es: "Los elementos comprobados con anterioridad en otros procedimientos y los pendientes de regularización."
  - id: b
    text:
      es: "Los períodos prescritos que se excluyen de la comprobación y los que se mantienen."
  - id: c
    text:
      es: "Los elementos que se comprobarán en una fase posterior, con indicación de la fecha prevista."
  - id: d
    correct: true
    text:
      es: "Los elementos que vayan a ser comprobados o los excluidos de ellas."
  explanation:
    es: "En las actuaciones parciales deben comunicarse los elementos que se vayan a comprobar o los excluidos (art. 178.4). No se refiere a elementos comprobados en otros procedimientos, a períodos prescritos ni a fases posteriores con fecha prevista."
  citation: "art. 178.4 RGAT"
  difficulty: 2
  tags:
  - "alcance"
  - "comunicación"
# anchor: boe-a-2007-15984-art-178
- id: m03-l08-q0163
  prompt:
    es: "De acuerdo con el artículo 178.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la modificación del alcance o de la extensión de las actuaciones en el curso del procedimiento:"
  options:
  - id: a
    text:
      es: "El órgano competente puede acordarla sin motivación, porque la dirección de las actuaciones corresponde a los órganos de inspección."
  - id: b
    text:
      es: "El órgano competente solo puede acordarla a solicitud del obligado, mediante escrito dirigido al actuario."
  - id: c
    correct: true
    text:
      es: "El órgano competente puede acordarla de forma motivada cuando se pongan de manifiesto razones que así lo aconsejen."
  - id: d
    text:
      es: "El órgano competente puede ampliar el alcance, pero nunca reducirlo una vez comunicado el inicio."
  explanation:
    es: "El artículo 178.5 permite acordar de forma motivada la modificación de la extensión y la ampliación o reducción del alcance, cuando haya razones que lo aconsejen. Exige motivación, no depende de la petición del obligado y admite también reducir."
  citation: "art. 178.5 RGAT"
  difficulty: 2
  tags:
  - "alcance"
  - "modificación"
# anchor: boe-a-2003-23186-art-148
- id: m03-l08-q0164
  prompt:
    es: "Según el artículo 148.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando las actuaciones hubieran terminado con una liquidación provisional, el objeto de las mismas no podrá regularizarse nuevamente en un procedimiento posterior, salvo que concurra alguna de las circunstancias del artículo 101.4.a) y:"
  options:
  - id: a
    correct: true
    text:
      es: "Exclusivamente en relación con los elementos de la obligación tributaria afectados por dichas circunstancias."
  - id: b
    text:
      es: "Respecto de la totalidad de los elementos de la obligación tributaria comprobada en el procedimiento anterior."
  - id: c
    text:
      es: "Siempre que el procedimiento posterior se inicie dentro del plazo de seis meses desde la liquidación."
  - id: d
    text:
      es: "Con el consentimiento del obligado tributario, manifestado por escrito ante el órgano competente."
  explanation:
    es: "Si concurre alguna circunstancia del artículo 101.4.a, la nueva regularización se limita a los elementos afectados por ella (art. 148.3). No se reabre toda la obligación, ni se fija un plazo de seis meses, ni se condiciona al consentimiento del obligado."
  citation: "art. 148.3 LGT"
  difficulty: 2
  tags:
  - "alcance"
  - "liquidación provisional"
# anchor: boe-a-2003-23186-art-149
- id: m03-l08-q0166
  prompt:
    es: "Conforme al artículo 149.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el obligado tributario deberá formular la solicitud de una inspección de carácter general en el plazo de 15 días desde:"
  options:
  - id: a
    text:
      es: "El inicio de las actuaciones inspectoras de carácter parcial, aunque no se le haya notificado."
  - id: b
    text:
      es: "La notificación de la propuesta de liquidación de las actuaciones de carácter parcial."
  - id: c
    text:
      es: "La apertura del trámite de audiencia de las actuaciones inspectoras de carácter parcial."
  - id: d
    correct: true
    text:
      es: "La notificación del inicio de las actuaciones inspectoras de carácter parcial."
  explanation:
    es: "El plazo de quince días corre desde la notificación del inicio de las actuaciones parciales (art. 149.2). No desde el inicio sin notificación, ni desde la propuesta de liquidación ni desde la apertura del trámite de audiencia, que son momentos posteriores."
  citation: "art. 149.2 LGT"
  difficulty: 1
  tags:
  - "solicitud"
  - "inspección general"
  - "plazo"
# anchor: boe-a-2007-15984-art-179
- id: m03-l08-q0169
  prompt:
    es: "Conforme al artículo 179.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cómo debe formularse la solicitud del obligado de una inspección de alcance general?"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante escrito dirigido al órgano competente para liquidar o comunicándola expresamente al actuario, que la recoge en diligencia y da traslado de ella."
  - id: b
    text:
      es: "Mediante escrito dirigido al actuario, que la recoge en diligencia y la resuelve con carácter definitivo en el acto."
  - id: c
    text:
      es: "Mediante comparecencia ante el órgano competente para liquidar, que la resuelve en el mismo acto."
  - id: d
    text:
      es: "Mediante escrito dirigido al delegado de la Agencia Tributaria, que la resuelve previo informe del actuario."
  explanation:
    es: "La solicitud se dirige por escrito al órgano competente para liquidar o se comunica al actuario, que la recoge en diligencia y da traslado a ese órgano (art. 179.1). El actuario no la resuelve y el delegado no interviene."
  citation: "art. 179.1 RGAT"
  difficulty: 2
  tags:
  - "solicitud"
  - "inspección general"
# anchor: boe-a-2007-15984-art-179
- id: m03-l08-q0170
  prompt:
    es: "De acuerdo con el artículo 179.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la inadmisión de la solicitud de una inspección de alcance general:"
  options:
  - id: a
    text:
      es: "Debe estar motivada y notificarse, y contra ella cabe recurso de reposición ante el órgano competente para liquidar."
  - id: b
    text:
      es: "Puede ser inmotivada, y contra ella cabe reclamación económico-administrativa en el plazo de un mes."
  - id: c
    text:
      es: "Debe notificarse, y puede recurrirse en reposición o reclamarse en vía económico-administrativa antes de la liquidación final."
  - id: d
    correct: true
    text:
      es: "Debe estar motivada y notificarse, y contra ella no cabe recurso de reposición ni reclamación económico-administrativa."
  explanation:
    es: "La inadmisión por incumplir los requisitos del artículo 149 debe motivarse y notificarse, y no admite reposición ni reclamación económico-administrativa (art. 179.3), sin perjuicio de reclamar contra el acto que ponga fin al procedimiento. No puede ser inmotivada."
  citation: "art. 179.3 RGAT"
  difficulty: 2
  tags:
  - "solicitud"
  - "inadmisión"
# anchor: boe-a-2007-15984-art-179
- id: m03-l08-q0171
  prompt:
    es: "Recibida la solicitud de inspección de alcance general, ¿qué acuerda el órgano competente para liquidar, según el artículo 179.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Si la inspección de carácter general se realizará por el mismo equipo de inspección o por otro distinto."
  - id: b
    correct: true
    text:
      es: "Si la inspección de carácter general se realizará ampliando el alcance del procedimiento ya iniciado o mediante el inicio de otro procedimiento."
  - id: c
    text:
      es: "Si procede suspender las actuaciones parciales hasta que se inicie la inspección de carácter general."
  - id: d
    text:
      es: "Si el obligado debe ingresar a cuenta las cuotas que resulten de la comprobación de carácter general."
  explanation:
    es: "El órgano que liquida decide si la inspección general se hace ampliando el alcance del procedimiento ya iniciado o iniciando otro (art. 179.2). No decide la composición del equipo, no suspende las actuaciones parciales (art. 149.1 dice que no se interrumpen) ni ordena ingresos a cuenta."
  citation: "art. 179.2 RGAT"
  difficulty: 2
  tags:
  - "solicitud"
  - "inspección general"
# anchor: boe-a-2007-15984-art-180
- id: m03-l08-q0172
  prompt:
    es: "Conforme al artículo 180.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actuaciones necesarias para obtener los datos y pruebas en el procedimiento de inspección sirven para fundamentar la regularización de la situación tributaria del obligado o para:"
  options:
  - id: a
    correct: true
    text:
      es: "Declararla correcta, si de ellas resulta que el obligado ha cumplido sus obligaciones tributarias."
  - id: b
    text:
      es: "Declararla sancionable, si de ellas resultan infracciones tributarias que deban ser sancionadas en el procedimiento sancionador."
  - id: c
    text:
      es: "Declararla regularizada de oficio, sin necesidad de que se practique una liquidación posterior."
  - id: d
    text:
      es: "Declararla provisional, si de ellas resulta que quedan elementos de la obligación sin comprobar."
  explanation:
    es: "Las actuaciones sirven para fundamentar la regularización o para declarar correcta la situación tributaria (art. 180.1). Declararla sancionable corresponde al procedimiento sancionador, no existe una regularización de oficio sin liquidación y el carácter provisional es una clase de liquidación, no un contenido de las actuaciones."
  citation: "art. 180.1 RGAT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "actuaciones"
