# anchor: fuente-ms-win-update-html
- id: m06-l01-q358
  prompt:
    es: "En Windows 11, ¿qué opción de Windows Update permite elegir un momento conveniente para reiniciar el dispositivo e instalar una actualización?"
  options:
  - id: a
    text:
      es: "Pausar actualizaciones."
  - id: b
    correct: true
    text:
      es: "Programar el reinicio."
  - id: c
    text:
      es: "Desinstalar actualizaciones."
  - id: d
    text:
      es: "Ver el historial de actualizaciones."
  explanation:
    es: "La página dice que, para programar el reinicio, se selecciona «Programar el reinicio» y se elige un momento conveniente. Pausar actualizaciones detiene temporalmente la descarga e instalación, con la duración que se elija. Desinstalar actualizaciones quita una actualización ya instalada. El historial de actualizaciones muestra las actualizaciones instaladas y cuándo se instalaron."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-boe-a-2022-7191-ens-2024-11-06-pdf
- id: m06-l01-q363
  prompt:
    es: "El Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, se aplica con carácter general:"
  options:
  - id: a
    text:
      es: "solo a la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "a todo el sector público definido en la Ley 40/2015."
  - id: c
    text:
      es: "solo a las entidades del sector privado."
  - id: d
    text:
      es: "solo a los sistemas de información que tratan datos personales."
  explanation:
    es: "El Real Decreto dice que «es de aplicación a todo el sector público, en los términos en que este se define por el artículo 2 de la Ley 40/2015». No se limita a la Administración General del Estado ni a los sistemas con datos personales, y a las entidades privadas solo las alcanza cuando prestan servicios o proveen soluciones al sector público."
  citation: "fuente: `BOE-A-2022-7191_ens_2024-11-06.pdf`; «Artículo 2. Ámbito de aplicación.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2022-7191-art-26
- id: m06-l01-q364
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué deben tener los sistemas para garantizar la continuidad de la actividad?"
  options:
  - id: a
    text:
      es: "Copias de seguridad, pero solo en los sistemas de categoría alta del organismo."
  - id: b
    text:
      es: "Mecanismos de continuidad de las operaciones, sin necesidad alguna de copias de seguridad."
  - id: c
    text:
      es: "Copias de seguridad, que cada usuario decide si conserva en su equipo."
  - id: d
    correct: true
    text:
      es: "Copias de seguridad y mecanismos de continuidad si se pierden los medios habituales."
  explanation:
    es: "El Real Decreto dice que «los sistemas dispondrán de copias de seguridad y se establecerán los mecanismos necesarios para garantizar la continuidad de las operaciones en caso de pérdida de los medios habituales». No limita las copias a una categoría, no las deja al criterio del usuario y las exige además de los mecanismos de continuidad."
  citation: "art. 26 ENS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q365
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué se requiere para que los usuarios de la organización accedan desde o a través de zonas no controladas?"
  options:
  - id: a
    correct: true
    text:
      es: "Un doble factor de autenticación, según los refuerzos R2, R3 o R4."
  - id: b
    text:
      es: "Una contraseña de complejidad mínima como único factor de autenticación."
  - id: c
    text:
      es: "Un registro de los accesos con éxito y de los fallidos del usuario."
  - id: d
    text:
      es: "Una renovación periódica de la contraseña del usuario de la organización."
  explanation:
    es: "El Real Decreto dice que, «para el acceso desde o a través de zonas no controladas se requerirá un doble factor de autenticación: R2, R3 o R4». La contraseña como único mecanismo se limita a accesos desde zonas controladas, y registrar los accesos o cambiar las credenciales con periodicidad son otros requisitos que no sustituyen al doble factor."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q367
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿cuándo se emplea una contraseña como mecanismo de autenticación de los usuarios de la organización?"
  options:
  - id: a
    text:
      es: "Cuando el acceso se realiza desde Internet, una zona no controlada."
  - id: b
    correct: true
    text:
      es: "Cuando el acceso es desde zonas controladas y sin atravesar zonas no controladas."
  - id: c
    text:
      es: "Cuando el acceso atraviesa una zona no controlada, si el usuario es personal propio."
  - id: d
    text:
      es: "Cuando el acceso se realiza con un certificado cualificado en una tarjeta."
  explanation:
    es: "El Real Decreto dice que «se empleará una contraseña como mecanismo de autenticación cuando el acceso se realiza desde zonas controladas y sin atravesar zonas no controladas». Desde Internet, zona no controlada, y a través de zonas no controladas se requiere doble factor, y el certificado cualificado en soporte físico es otro refuerzo."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q368
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué debe ocurrir cuando se supera el número de intentos de acceso permitidos?"
  options:
  - id: a
    text:
      es: "Se informa al usuario del motivo exacto del rechazo para que pueda corregirlo."
  - id: b
    text:
      es: "Se cambian automáticamente las credenciales del usuario tras el último intento."
  - id: c
    correct: true
    text:
      es: "Se bloquea el acceso y se exige una intervención específica para reactivar la cuenta."
  - id: d
    text:
      es: "El sistema permite seguir intentándolo, con una espera creciente entre cada intento del usuario."
  explanation:
    es: "El Real Decreto dice que el número de intentos será limitado, «bloqueando la oportunidad de acceso una vez superado tal número, y requiriendo una intervención específica para reactivar la cuenta». Si se rechaza, no se informa del motivo, y el cambio de credenciales sigue la periodicidad de la política de seguridad, no el exceso de intentos."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q369
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿quién marca la periodicidad con la que se cambian las credenciales de los usuarios de la organización?"
  options:
  - id: a
    correct: true
    text:
      es: "La política de seguridad de la organización."
  - id: b
    text:
      es: "El propio usuario, cuando lo estime conveniente."
  - id: c
    text:
      es: "Las guías CCN-STIC, para cada sistema."
  - id: d
    text:
      es: "El fabricante del dispositivo de acceso."
  explanation:
    es: "El Real Decreto dice que «las credenciales se cambiarán con una periodicidad marcada por la política de seguridad de la organización». Las guías CCN-STIC desarrollan los mecanismos y calidades exigibles a cada tipo de factor de autenticación, no la periodicidad."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q370
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿a qué personal se refiere la medida del mecanismo de autenticación de los usuarios de la organización?"
  options:
  - id: a
    text:
      es: "Solo al personal propio y estable del organismo, no al contratado."
  - id: b
    correct: true
    text:
      es: "Al personal del organismo, propio o contratado, estable o circunstancial."
  - id: c
    text:
      es: "Solo al personal contratado por una empresa externa al organismo."
  - id: d
    text:
      es: "A cualquier ciudadano que use los servicios electrónicos del propio organismo público."
  explanation:
    es: "El Real Decreto dice que la medida «se refiere a personal del organismo, propio o contratado, estable o circunstancial, que pueda tener acceso a información contenida en el sistema». Por eso no se limita al personal propio y estable, ni solo al contratado, ni alcanza a cualquier ciudadano."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-entra-mfa-html
- id: m06-l01-q371
  prompt:
    es: "¿Cuál de las siguientes series recoge los tres tipos de factor de la autenticación multifactor de Microsoft Entra?"
  options:
  - id: a
    text:
      es: "Algo que sabes, algo que firmas y algo que eres."
  - id: b
    correct: true
    text:
      es: "Algo que sabes, algo que tienes y algo que eres."
  - id: c
    text:
      es: "Algo que sabes, algo que tienes y algo que ves."
  - id: d
    text:
      es: "Algo que usas, algo que tienes y algo que eres."
  explanation:
    es: "La página de Microsoft Entra enumera tres métodos: algo que tú sabes, normalmente una contraseña; algo que tiene, como un teléfono o una clave de hardware; y algo que eres, biometría como una huella digital o un escaneo facial. La serie con «algo que firmas» cambia el segundo método y la de «algo que ves» cambia el tercero, y ninguno aparece en la lista de la página. La serie con «algo que usas» sustituye al primero, que la página define como algo que sabes."
  citation: "fuente: `ms-entra-mfa.html`; «El funcionamiento de la autenticación multifactor de Microsoft Entra se basa en exigir uno o varios de los siguientes métodos de autenticación:»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m06-l01-q373
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes series recoge los tres perfiles de red que se pueden seleccionar en el Firewall de Windows?"
  options:
  - id: a
    correct: true
    text:
      es: "Red de dominio, red privada y red pública."
  - id: b
    text:
      es: "Red de dominio, red doméstica y red pública."
  - id: c
    text:
      es: "Red corporativa, red privada y red pública."
  - id: d
    text:
      es: "Red de dominio, red privada y red de invitados."
  explanation:
    es: "La página de Seguridad de Windows dice: «Selecciona un perfil de red: Red de dominio, Red privada, o Red pública». La serie con «red doméstica» cambia el perfil de red privada, que es el que la página ilustra con la red doméstica como ejemplo. La serie con «red corporativa» cambia el perfil de red de dominio, y la de «red de invitados» sustituye al perfil de red pública. Ninguno de esos tres nombres es un perfil de la página."
  citation: "fuente: `ms-win-firewall.html`; «Selecciona un perfil de red: Red de dominio, Red privada, o Red pública.»"
  difficulty: 2
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q375
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, un certificado digital asocia unos datos de identidad a:"
  options:
  - id: a
    text:
      es: "un equipo informático, un programa instalado o una red local."
  - id: b
    text:
      es: "una carpeta, un fichero o una unidad de almacenamiento."
  - id: c
    text:
      es: "una dirección de correo, una contraseña o un código PIN."
  - id: d
    correct: true
    text:
      es: "una persona física, un organismo o una empresa."
  explanation:
    es: "El glosario del INCIBE dice que el certificado digital, generado por una Autoridad Certificadora, asocia unos datos de identidad a una persona física, organismo o empresa, y así confirma su identidad digital en Internet. Un equipo, un programa o una red, una carpeta, un fichero o una unidad, y una dirección de correo, una contraseña o un PIN no figuran entre lo que el glosario dice que el certificado identifica."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Un certificado digital es un fichero informático generado por una entidad denominada Autoridad Certificadora (CA) que asocia unos datos de identidad a una persona física, organismo o empresa confirmando de esta manera su identidad digital en Internet.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q376
  prompt:
    es: "En Windows 11, ¿qué ocurre cuando se alcanza el límite de pausa de las actualizaciones de Windows Update?"
  options:
  - id: a
    text:
      es: "La pausa se renueva sola otro periodo igual sin instalar nada."
  - id: b
    correct: true
    text:
      es: "Hay que instalar las últimas actualizaciones para poder volver a pausarlas."
  - id: c
    text:
      es: "Windows Update se desactiva de forma permanente en el dispositivo."
  - id: d
    text:
      es: "Las actualizaciones pendientes se eliminan y dejan de ofrecerse."
  explanation:
    es: "La página de Windows Update dice que, una vez alcanzado el límite de pausa, hay que instalar las últimas actualizaciones para poder volver a pausarlas. La renovación automática de la pausa sin instalar nada contradice esa frase. Que Windows Update se desactive de forma permanente o que se eliminen las pendientes contradice la página, que dice que las actualizaciones no se pueden detener por completo y que finalmente será necesario descargarlas e instalarlas."
  citation: "fuente: `ms-win-update.html`; «Ten en cuenta que una vez que se alcance el límite de pausa, tendrás que instalar las últimas actualizaciones para poder volver a pausar las actualizaciones.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-boe-rd-4-2010-eni-pdf
- id: m06-l01-q378
  prompt:
    es: "¿Cuál de las siguientes descripciones recoge el glosario del Real Decreto 4/2010, de 8 de enero, por el que se regula el Esquema Nacional de Interoperabilidad, para una aplicación de fuentes abiertas?"
  options:
  - id: a
    text:
      es: "Se distribuye con una licencia que permite ejecutarla y conocer el código fuente, pero no modificarla ni redistribuir copias."
  - id: b
    correct: true
    text:
      es: "Se distribuye con una licencia que permite ejecutarla, conocer el código fuente, modificarla o mejorarla y redistribuir copias."
  - id: c
    text:
      es: "Se distribuye con una licencia que permite ejecutarla, modificarla y redistribuir copias, pero no conocer el código fuente."
  - id: d
    text:
      es: "Se distribuye con una licencia que permite modificarla o mejorarla y conocer el código fuente, pero no redistribuir copias."
  explanation:
    es: "El glosario dice que es la aplicación «que se distribuye con una licencia que permite la libertad de ejecutarla, de conocer el código fuente, de modificarla o mejorarla y de redistribuir copias a otros usuarios». La licencia que no permite modificarla ni redistribuir copias quita dos de esas libertades; la que no permite conocer el código fuente quita otra; y la que no permite redistribuir copias deja fuera la libertad de redistribuir, que el glosario incluye."
  citation: "fuente: `boe-rd-4-2010-eni.pdf`; «Aquella que se distribuye con una licencia que permite la libertad de ejecutarla, de conocer el código fuente, de modificarla o mejorarla y de redistribuir copias a otros usuarios.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-entra-mfa-html
- id: m06-l01-q379
  prompt:
    es: "¿Cuál de los siguientes ejemplos corresponde al método «algo que eres» de la autenticación multifactor de Microsoft Entra?"
  options:
  - id: a
    text:
      es: "Una contraseña elegida por el usuario."
  - id: b
    text:
      es: "Un teléfono de confianza del usuario."
  - id: c
    text:
      es: "Una clave de hardware del usuario."
  - id: d
    correct: true
    text:
      es: "Una huella digital del usuario."
  explanation:
    es: "La página define «algo que eres» como «biometría como una huella digital o un escaneo facial». La contraseña es el ejemplo de «algo que tú sabes», y el teléfono y la clave de hardware son ejemplos de «algo que tiene», un dispositivo de confianza que no se puede duplicar con facilidad."
  citation: "fuente: `ms-entra-mfa.html`; «El funcionamiento de la autenticación multifactor de Microsoft Entra se basa en exigir uno o varios de los siguientes métodos de autenticación:»"
  difficulty: 2
  tags:
  - "concepto"
