template: |
  import java.math.BigDecimal;

  public class Main {
      static boolean same(BigDecimal p, BigDecimal q) {
          return p.equals(q);
      }

      static int order(BigDecimal p, BigDecimal q) {
          return p.compareTo(q);
      }

      public static void main(String[] args) {
          BigDecimal a = new BigDecimal("@@p1@@");
          BigDecimal b = new BigDecimal("@@q1@@");
          BigDecimal c = new BigDecimal("@@p2@@");
          BigDecimal d = new BigDecimal("@@q2@@");
          System.out.println(same(a, b));
          System.out.println(order(a, b));
          System.out.println(same(c, d));
          System.out.println(order(c, d));
      }
  }
explanation: '`same` calls `equals`, which is `true` only when two `BigDecimal` values are equal in value and in scale, and `order` calls `compareTo`, which compares numeric value alone and returns `-1`,
  `0` or `1`. @@why@@ The program prints @@key@@.'
mistakes:
- name: comparing only the numeric value in `same`
  replace:
  - return p.equals(q);
  - return p.compareTo(q) == 0;
  why: '`equals` is `true` only when value and scale are both equal, so two numbers with different scales are not equal.'
- name: making `order` return `0` only when `equals` is true and `1` otherwise
  replace:
  - return p.compareTo(q);
  - 'return p.equals(q) ? 0 : 1;'
  why: '`compareTo` ignores the scale and returns `-1`, `0` or `1` for less, equal or greater, so it is not tied to `equals`.'
- name: negating the result of `equals` in `same`
  replace:
  - return p.equals(q);
  - return !p.equals(q);
  why: '`equals` returns `true` for a `BigDecimal` with the same value and scale, and `false` otherwise.'
