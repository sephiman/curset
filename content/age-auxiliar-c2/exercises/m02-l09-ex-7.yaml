- id: m02-l09-q123
  prompt:
    es: "En Excel 365, A1:A4 contienen 14, 9, 31 y 22. ¿Qué muestra la celda con =MAX(A1:A4)?"
  options:
  - id: a
    text:
      es: "76"
  - id: b
    text:
      es: "22"
  - id: c
    correct: true
    text:
      es: "31"
  - id: d
    text:
      es: "9"
  explanation:
    es: "MAX devuelve el valor máximo de una lista de argumentos: 31. 76 es la suma, y 22 y 9 son otros valores de la lista que no son el máximo."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones estadísticas»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-extrae-html
- id: m02-l09-q124
  prompt:
    es: "En Excel 365, A1 contiene Hoja de cálculo. ¿Qué muestra la celda con =EXTRAE(A1; 9; 7)?"
  options:
  - id: a
    text:
      es: "álculo"
  - id: b
    text:
      es: " cálcul"
  - id: c
    text:
      es: "Hoja de"
  - id: d
    correct: true
    text:
      es: "cálculo"
  explanation:
    es: "EXTRAE devuelve 7 caracteres comenzando por la posición 9, y el primer carácter del texto es la posición 1: en Hoja de cálculo la posición 9 es el carácter c de cálculo. Empezar en la 10 daría álculo, en la 8 un espacio antes, y Hoja de serían los 7 primeros caracteres."
  citation: "fuente: `ms-excel-funcion-extrae.html`; «Ejemplo»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
