- id: m01-l02-q29
  prompt:
    en: In Java 25, this snippet builds an `Invoice` through a builder with a validating `build` method, once with
      both fields set and once without `cents`. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: '```text

        Invoice F-1 1200

        cents must not be negative

        ```'
  - id: b
    text:
      en: '```text

        Invoice F-1 1200

        Invoice F-2 -1

        ```'
  - id: c
    text:
      en: '```text

        Invoice F-1 1200

        number is required

        ```'
  - id: d
    text:
      en: '```text

        cents must not be negative

        Invoice F-1 1200

        ```'
  explanation:
    en: The first builder is complete, so the snippet prints `Invoice F-1 1200`, and the second keeps the default
      `-1` for `cents`, so `build` throws and the snippet prints its message. The output `Invoice F-2 -1` is wrong
      because `build` rejects a negative `cents` before it constructs an object. The message `number is required`
      is wrong because the second builder did set a number. The reversed output is wrong because the statements
      run in source order.
  citation: course-requirements#4-content-classes
