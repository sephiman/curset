# anchor: boe-a-2017-12902-art-44
- id: q06
  lesson: m03-l04
  prompt:
    es: "¿Podía la empresa Archivos Digitales Ibérica, S.A. interponer recurso especial en materia de contratación contra la adjudicación del contrato de digitalización?"
  options:
  - id: a
    text:
      es: "No, porque solo cabe en servicios de valor estimado superior a 140.000 euros."
  - id: b
    text:
      es: "No, porque contra la adjudicación solo procede el recurso de alzada."
  - id: c
    correct: true
    text:
      es: "Sí, porque el contrato de servicios supera los cien mil euros de valor estimado."
  - id: d
    text:
      es: "Sí, pero solo si el contrato está sujeto a regulación armonizada."
  explanation:
    es: "El recurso especial cabe en los contratos de servicios de valor estimado superior a cien mil euros (art. 44.1.a LCSP), y la adjudicación es un acto recurrible (art. 44.2 LCSP). El valor estimado de 113.400 euros lo supera. La cifra de 140.000 euros es el umbral de regulación armonizada de servicios, que no se exige para este recurso. La alzada no procede contra los actos que admiten recurso especial (art. 44.5 LCSP). La regulación armonizada no es condición cuando se supera el umbral de cien mil euros."
  citation: "art. 44.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
