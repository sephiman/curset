# SPDX-License-Identifier: AGPL-3.0-only
# age-administrativo-c1 glossary. Same rules as content/crypto-futures/glossary.yaml: the glossary refers, it does
# not teach; ids are permanent; origin names the lesson that teaches the term; the glossary never coins.
# Course rule (R4.5): a term enters when two or more lessons use it in the same precise sense, or when a norm
# defines it; the definition then names that article. Spanish only. File order is by origin lesson.
terms:
- id: g-ley-organica
  es: ley orgánica
  origin: m01-l01
  definition:
    es: >-
      Ley relativa al desarrollo de los derechos fundamentales y de las libertades públicas, la que aprueba los
      Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución. Su aprobación,
      modificación o derogación exige mayoría absoluta del Congreso en una votación final (art. 81 CE).
- id: g-recurso-de-amparo
  es: recurso de amparo
  origin: m01-l01
  definition:
    es: >-
      Recurso ante el Tribunal Constitucional contra la violación de los derechos de los artículos 14 a 29 y de
      la objeción de conciencia del artículo 30 de la Constitución (art. 53.2 CE; art. 41.1 LOTC).
- id: g-recurso-de-inconstitucionalidad
  es: recurso de inconstitucionalidad
  origin: m01-l01
  definition:
    es: >-
      Recurso ante el Tribunal Constitucional contra leyes y disposiciones normativas con fuerza de ley. Se formula
      en tres meses desde la publicación de la norma (art. 161.1.a CE; art. 33.1 LOTC).
- id: g-cuestion-de-inconstitucionalidad
  es: cuestión de inconstitucionalidad
  origin: m01-l01
  definition:
    es: >-
      La que plantea un órgano judicial ante el Tribunal Constitucional cuando una norma con rango de ley aplicable
      al caso, de cuya validez dependa el fallo, puede ser contraria a la Constitución (art. 163 CE).
- id: g-estado-de-alarma
  es: estado de alarma
  origin: m01-l01
  definition:
    es: >-
      Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, por un plazo máximo de quince días,
      dando cuenta al Congreso, sin cuya autorización no puede prorrogarse (art. 116.2 CE).
- id: g-estado-de-excepcion
  es: estado de excepción
  origin: m01-l01
  definition:
    es: >-
      Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso.
      Su duración no puede exceder de treinta días, prorrogables por otro plazo igual (art. 116.3 CE).
- id: g-defensor-del-pueblo
  es: Defensor del Pueblo
  origin: m01-l01
  definition:
    es: >-
      Alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos del título I
      de la Constitución, que puede supervisar la actividad de la Administración (art. 54 CE). Se elige para cinco
      años (art. 2.1 LO 3/1981).
- id: g-principios-rectores
  es: principios rectores de la política social y económica
  origin: m01-l01
  definition:
    es: >-
      Los del capítulo tercero del título I de la Constitución. Informan la legislación, la práctica judicial y
      la actuación de los poderes públicos, y solo pueden alegarse ante la Jurisdicción ordinaria según las leyes
      que los desarrollen (art. 53.3 CE).
- id: g-monarquia-parlamentaria
  es: Monarquía parlamentaria
  origin: m01-l02
  definition:
    es: >-
      La forma política del Estado español (art. 1.3 CE). El Rey es el Jefe del Estado y sus actos necesitan refrendo.
- id: g-refrendo
  es: refrendo
  origin: m01-l02
  link_except:
  - m01-l07
  definition:
    es: >-
      Requisito de los actos del Rey, que refrendan el Presidente del Gobierno y, en su caso, los Ministros competentes,
      o el Presidente del Congreso en los casos del artículo 64.1; de esos actos responden quienes los refrendan.
      Sin refrendo, el acto del Rey carece de validez, salvo lo dispuesto en el artículo 65.2 (arts. 56.3 y 64 CE).
- id: g-regencia
  es: Regencia
  origin: m01-l02
  definition:
    es: >-
      Institución que se ejerce por mandato constitucional y siempre en nombre del Rey cuando este es menor de edad
      o cuando las Cortes Generales reconocen su inhabilitación. Para ejercerla es preciso ser español y mayor de
      edad (art. 59 CE).
- id: g-derecho-de-gracia
  es: derecho de gracia
  origin: m01-l02
  definition:
    es: >-
      Función del Rey que ejerce con arreglo a la ley. Esa ley no puede autorizar indultos generales (art. 62.i
      CE).
- id: g-sesion-conjunta
  es: sesión conjunta
  origin: m01-l02
  definition:
    es: >-
      Reunión del Congreso y el Senado juntos. Se usa para las competencias no legislativas que el título II de
      la Constitución atribuye expresamente a las Cortes Generales (art. 74.1 CE).
- id: g-mandato-imperativo
  es: mandato imperativo
  origin: m01-l03
  link_except:
  - m01-l01
  definition:
    es: >-
      Vínculo que la Constitución excluye para los parlamentarios: los miembros de las Cortes Generales no están
      ligados por mandato imperativo (art. 67.2 CE).
- id: g-inviolabilidad-parlamentaria
  es: inviolabilidad
  origin: m01-l03
  link_except:
  - m01-l01
  - m01-l02
  definition:
    es: >-
      Prerrogativa de Diputados y Senadores por las opiniones manifestadas en el ejercicio de sus funciones (art.
      71.1 CE). Dura aun después de haber cesado en el mandato (art. 10 Reglamento del Congreso).
- id: g-inmunidad-parlamentaria
  es: inmunidad
  origin: m01-l03
  definition:
    es: >-
      Prerrogativa de Diputados y Senadores durante su mandato: solo pueden ser detenidos en caso de flagrante delito
      y no pueden ser inculpados ni procesados sin la previa autorización de su Cámara (art. 71.2 CE).
- id: g-suplicatorio
  es: suplicatorio
  origin: m01-l03
  definition:
    es: >-
      Solicitud de la autorización de la Cámara para inculpar o procesar a uno de sus miembros. En el Congreso se
      entiende denegado si la Cámara no se pronuncia en sesenta días naturales, computados durante el período de
      sesiones a partir del día siguiente al de su recibo (arts. 13.1 y 14.2 Reglamento del Congreso).
- id: g-diputacion-permanente
  es: Diputación Permanente
  origin: m01-l03
  definition:
    es: >-
      Órgano de cada Cámara, presidido por su Presidente y con un mínimo de veintiún miembros, que vela por sus
      poderes cuando no está reunida y sigue en funciones tras la disolución hasta la constitución de las nuevas
      Cortes Generales (art. 78 CE).
- id: g-grupo-parlamentario
  es: Grupo Parlamentario
  origin: m01-l03
  definition:
    es: >-
      Agrupación de los miembros de una Cámara. En el Congreso exige quince diputados, o cinco escaños con determinados
      porcentajes de voto (art. 23.1 Reglamento del Congreso); en el Senado, al menos diez Senadores (art. 27.1
      Reglamento del Senado).
- id: g-grupo-mixto
  es: Grupo Mixto
  origin: m01-l03
  definition:
    es: >-
      Grupo al que quedan incorporados los miembros de la Cámara que no se integran en otro Grupo Parlamentario
      en el plazo señalado (art. 25.1 Reglamento del Congreso).
- id: g-junta-de-portavoces
  es: Junta de Portavoces
  origin: m01-l03
  definition:
    es: >-
      Órgano formado por los portavoces de los grupos parlamentarios y presidido por el Presidente de la Cámara.
      En el Congreso decide siempre por voto ponderado (art. 39 Reglamento del Congreso).
- id: g-comision-mixta
  es: Comisión Mixta
  origin: m01-l03
  definition:
    es: >-
      Comisión de igual número de Diputados y Senadores que busca el acuerdo entre las dos Cámaras en las decisiones
      del artículo 74.2. Si su texto no se aprueba, decide el Congreso por mayoría absoluta (art. 74.2 CE).
- id: g-ley-de-bases
  es: ley de bases
  origin: m01-l03
  definition:
    es: >-
      Ley con la que las Cortes Generales delegan en el Gobierno la formación de textos articulados (art. 82.2 CE).
- id: g-iniciativa-popular
  es: iniciativa popular
  origin: m01-l03
  definition:
    es: >-
      Presentación de proposiciones de ley por los ciudadanos, con no menos de 500.000 firmas acreditadas. No procede
      en materias propias de ley orgánica, tributarias o de carácter internacional, ni en la prerrogativa de gracia
      (art. 87.3 CE).
- id: g-veto
  es: veto
  origin: m01-l03
  definition:
    es: >-
      Oposición del Senado, mediante mensaje motivado y por mayoría absoluta, a un proyecto aprobado por el Congreso.
      El Congreso la levanta ratificando el texto inicial por mayoría absoluta, o por mayoría simple pasados dos
      meses (art. 90.2 CE).
- id: g-referendum-consultivo
  es: referéndum consultivo
  origin: m01-l03
  definition:
    es: >-
      Consulta a todos los ciudadanos sobre decisiones políticas de especial trascendencia. Lo convoca el Rey, mediante
      propuesta del Presidente del Gobierno, previamente autorizada por el Congreso (art. 92 CE).
- id: g-potestad-jurisdiccional
  es: potestad jurisdiccional
  origin: m01-l04
  definition:
    es: >-
      Juzgar y hacer ejecutar lo juzgado en todo tipo de procesos. Corresponde exclusivamente a los Juzgados y Tribunales
      determinados por las leyes (art. 117.3 CE).
- id: g-consejo-general-del-poder-judicial
  es: Consejo General del Poder Judicial
  origin: m01-l04
  definition:
    es: >-
      Órgano de gobierno del Poder Judicial. Lo integran el Presidente del Tribunal Supremo, que lo preside, y veinte
      Vocales nombrados por el Rey por un período de cinco años (art. 122 CE).
- id: g-ministerio-fiscal
  es: Ministerio Fiscal
  origin: m01-l04
  definition:
    es: >-
      Órgano que promueve la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos
      y del interés público tutelado por la ley. Actúa conforme a los principios de unidad de actuación y dependencia
      jerárquica (art. 124 CE).
- id: g-orden-jurisdiccional
  es: orden jurisdiccional
  origin: m01-l04
  definition:
    es: >-
      Cada uno de los ámbitos en que se reparte la jurisdicción: civil, penal, contencioso-administrativo y social,
      más la jurisdicción militar (art. 9 LOPJ).
- id: g-partido-judicial
  es: partido judicial
  origin: m01-l04
  definition:
    es: >-
      Unidad territorial integrada por uno o más municipios limítrofes de una misma provincia. En cada uno hay un
      Tribunal de Instancia (arts. 32.1 y 84.1 LOPJ).
- id: g-tribunal-de-instancia
  es: Tribunal de Instancia
  origin: m01-l04
  definition:
    es: >-
      Órgano judicial que existe en cada partido judicial, con sede en su capital, y que se organiza en Secciones
      (art. 84 LOPJ). Se constituyó transformando los antiguos Juzgados en esas Secciones (disposición transitoria
      primera LO 1/2025).
- id: g-juez-de-paz
  es: juez de paz
  origin: m01-l04
  definition:
    es: >-
      Juez que existe en cada municipio donde no hay Tribunal de Instancia. Lo elige el Pleno del Ayuntamiento y
      lo nombra por cuatro años la Sala de Gobierno del Tribunal Superior de Justicia (arts. 99 y 101 LOPJ).
- id: g-estado-de-sitio
  es: estado de sitio
  origin: m01-l05
  definition:
    es: >-
      Lo declara la mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno. El Congreso determina su
      ámbito territorial, duración y condiciones (art. 116.4 CE).
- id: g-cuestion-de-confianza
  es: cuestión de confianza
  origin: m01-l05
  link_except:
  - m01-l10
  definition:
    es: >-
      Votación que el Presidente del Gobierno plantea ante el Congreso, previa deliberación del Consejo de Ministros,
      sobre su programa o sobre una declaración de política general. La confianza se entiende otorgada con la mayoría
      simple de los Diputados (art. 112 CE).
- id: g-mocion-de-censura
  es: moción de censura
  origin: m01-l05
  link_except:
  - m01-l10
  - m01-l11
  definition:
    es: >-
      Instrumento con el que el Congreso exige la responsabilidad política del Gobierno. La proponen al menos la
      décima parte de los Diputados con un candidato a la Presidencia y se adopta por mayoría absoluta (art. 113
      CE).
- id: g-gobierno-en-funciones
  es: Gobierno en funciones
  origin: m01-l05
  definition:
    es: >-
      El Gobierno cesante, que continúa hasta la toma de posesión del nuevo y limita su gestión al despacho ordinario
      de los asuntos públicos (art. 101.2 CE; art. 21 Ley 50/1997).
- id: g-ministro-sin-cartera
  es: Ministros sin cartera
  origin: m01-l05
  definition:
    es: >-
      Ministros que no son titulares de un Departamento y a los que se atribuye la responsabilidad de determinadas
      funciones gubernamentales (art. 4.2 Ley 50/1997).
- id: g-comisiones-delegadas
  es: Comisiones Delegadas del Gobierno
  origin: m01-l05
  definition:
    es: >-
      Órganos colegiados del Gobierno creados por Real Decreto del Consejo de Ministros, a propuesta del Presidente,
      para los asuntos que afectan a varios Ministerios (art. 6 Ley 50/1997).
- id: g-investidura
  es: investidura
  origin: m01-l05
  definition:
    es: >-
      Votación en la que el Congreso otorga su confianza al candidato a Presidente del Gobierno: mayoría absoluta
      en la primera votación o mayoría simple en otra cuarenta y ocho horas después (art. 99 CE).
- id: g-consulta-publica
  es: consulta pública
  origin: m01-l06
  definition:
    es: >-
      Trámite previo a la elaboración de un proyecto o anteproyecto de ley o de reglamento, en el portal web de
      la Administración competente, que recaba la opinión de los sujetos y de las organizaciones más representativas
      potencialmente afectados por la futura norma (art. 133.1 LPAC).
- id: g-agenda-2030
  es: Agenda 2030
  origin: m01-l06
  link_except:
  - m01-l08
  definition:
    es: >-
      Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, «Transformar nuestro
      mundo: la Agenda 2030 para el Desarrollo Sostenible», que fija los 17 Objetivos de Desarrollo Sostenible.
- id: g-informacion-publica
  es: información pública
  origin: m01-l07
  definition:
    es: >-
      Los contenidos o documentos, cualquiera que sea su formato o soporte, que obren en poder de un sujeto obligado
      por la Ley 19/2013 y que haya elaborado o adquirido en el ejercicio de sus funciones (art. 13 Ley 19/2013).
- id: g-publicidad-activa
  es: publicidad activa
  origin: m01-l07
  definition:
    es: >-
      La información relevante para garantizar la transparencia de su actividad que los sujetos obligados por la
      Ley 19/2013 publican de forma periódica y actualizada en sus sedes electrónicas o páginas web (arts. 5–8 Ley
      19/2013).
- id: g-derecho-de-acceso-a-la-informacion-publica
  es: derecho de acceso a la información pública
  origin: m01-l07
  definition:
    es: >-
      El derecho de todas las personas a acceder a la información pública, en los términos del artículo 105.b) de
      la Constitución, sin obligación de motivar la solicitud (arts. 12 y 17.3 Ley 19/2013).
- id: g-autoridad-administrativa-independiente
  es: autoridad administrativa independiente
  origin: m01-l07
  definition:
    es: >-
      Entidad de derecho público de ámbito estatal, con personalidad jurídica propia y vinculada a la Administración
      General del Estado, con funciones de regulación o supervisión de carácter externo sobre sectores económicos
      o actividades determinadas que requieren independencia funcional o una especial autonomía respecto de ella,
      lo que determina una norma con rango de ley (art. 109.1 LRJSP).
- id: g-silencio-administrativo
  es: silencio administrativo
  origin: m01-l07
  definition:
    es: >-
      En el acceso a la información, la solicitud se entiende desestimada si transcurre el plazo máximo sin resolución
      expresa notificada, y la reclamación ante el Consejo de Transparencia se entiende desestimada pasados tres
      meses sin resolución (arts. 20.4 y 24.4 Ley 19/2013).
- id: g-alto-cargo
  es: alto cargo
  origin: m01-l08
  match:
    es:
    - alto cargo
    - altos cargos
  link_except:
  - m04-l04
  definition:
    es: >-
      Condición que tienen los órganos superiores y directivos de la Administración General del Estado, salvo los
      Subdirectores generales y asimilados, y los demás cargos que enumera la Ley 3/2015 (art. 55.6 LRJSP; art.
      1.2 Ley 3/2015). Su nombramiento recae en personas idóneas (art. 2.1 Ley 3/2015).
- id: g-organos-superiores
  es: órganos superiores
  origin: m01-l08
  definition:
    es: >-
      En la organización central de la Administración General del Estado, los Ministros y los Secretarios de Estado.
      Establecen los planes de actuación de la organización a su cargo (art. 55.3 y 55.9 LRJSP).
- id: g-organos-directivos
  es: órganos directivos
  origin: m01-l08
  definition:
    es: >-
      Los Subsecretarios, Secretarios generales, Secretarios generales técnicos, Directores generales y Subdirectores
      generales; en el territorio, los Delegados y Subdelegados del Gobierno, y en el exterior, los embajadores
      y representantes permanentes ante Organizaciones internacionales. Desarrollan y ejecutan los planes de los
      órganos superiores (art. 55 LRJSP).
- id: g-servicios-comunes
  es: servicios comunes
  origin: m01-l08
  link_except:
  - m01-l07
  - m02-l01
  - m03-l04
  - m04-l05
  - m05-l03
  - m05-l05
  definition:
    es: >-
      Órganos de cada Ministerio que asisten a los demás en funciones como la planificación y presupuestación, los
      recursos humanos, la producción normativa, la asistencia jurídica, la gestión financiera y la inspección de
      servicios. Los dirige el Subsecretario (arts. 63.1 y 68.1 LRJSP).
- id: g-unidades-administrativas
  es: unidades administrativas
  origin: m01-l08
  definition:
    es: >-
      Elementos organizativos básicos de las estructuras orgánicas: puestos de trabajo vinculados por sus cometidos
      y por una jefatura común. Se establecen mediante las relaciones de puestos de trabajo (art. 56 LRJSP).
- id: g-delegado-del-gobierno
  es: Delegado del Gobierno
  origin: m01-l08
  match:
    es:
    - Delegado del Gobierno
    - Delegados del Gobierno
  definition:
    es: >-
      Órgano directivo con rango de Subsecretario que representa al Gobierno de la Nación en una Comunidad Autónoma
      y dirige allí la Administración General del Estado. Lo nombra el Consejo de Ministros a propuesta del Presidente
      del Gobierno (art. 72 LRJSP).
- id: g-subdelegado-del-gobierno
  es: Subdelegado del Gobierno
  origin: m01-l08
  match:
    es:
    - Subdelegado del Gobierno
    - Subdelegados del Gobierno
  definition:
    es: >-
      Órgano directivo con nivel de Subdirector General que existe en cada provincia bajo la inmediata dependencia
      del Delegado del Gobierno. Lo nombra el Delegado por libre designación entre funcionarios de carrera del Subgrupo
      A1 (art. 74 LRJSP).
- id: g-servicio-exterior-del-estado
  es: Servicio Exterior del Estado
  origin: m01-l08
  definition:
    es: >-
      Los órganos, unidades administrativas y medios humanos y materiales que, bajo la dirección del Gobierno, ejecutan
      la Política Exterior y la Acción Exterior (art. 1.2.c Ley 2/2014).
- id: g-oficinas-consulares
  es: Oficinas Consulares
  origin: m01-l08
  definition:
    es: >-
      Órganos de la Administración General del Estado encargados de las funciones consulares y, en especial, de
      la asistencia y protección a los españoles en el exterior. Son de carrera u honorarias (arts. 47.1 y 48.1
      Ley 2/2014).
- id: g-representaciones-permanentes
  es: Representaciones Permanentes
  origin: m01-l08
  definition:
    es: >-
      Órganos que representan con este carácter a España ante la Unión Europea o una Organización Internacional;
      son de Observación si España no es parte de ella (art. 42.2 Ley 2/2014).
- id: g-estatuto-de-autonomia
  es: Estatuto de Autonomía
  origin: m01-l09
  definition:
    es: >-
      La norma institucional básica de cada Comunidad Autónoma, que el Estado reconoce y ampara como parte integrante
      de su ordenamiento jurídico. Se aprueba por ley orgánica y su reforma requiere en todo caso la aprobación
      de las Cortes Generales mediante ley orgánica (arts. 81.1, 147.1 y 147.3 CE).
- id: g-ley-marco
  es: ley marco
  origin: m01-l09
  definition:
    es: >-
      Ley estatal por la que las Cortes Generales atribuyen a todas o a alguna de las Comunidades Autónomas la facultad
      de dictar normas legislativas en materias de competencia estatal, en el marco de los principios, bases y directrices
      que fija. Cada ley marco establece el control de las Cortes sobre esas normas (art. 150.1 CE).
- id: g-tribunal-superior-de-justicia
  es: Tribunal Superior de Justicia
  origin: m01-l09
  definition:
    es: >-
      Órgano judicial que culmina la organización judicial en el ámbito territorial de la Comunidad Autónoma, sin
      perjuicio de la jurisdicción que corresponde al Tribunal Supremo (art. 152.1 CE).
- id: g-fondo-de-compensacion
  es: Fondo de Compensación
  origin: m01-l09
  definition:
    es: >-
      Fondo con destino a gastos de inversión, creado para corregir desequilibrios económicos interterritoriales
      y hacer efectivo el principio de solidaridad. Sus recursos los distribuyen las Cortes Generales entre las
      Comunidades Autónomas y provincias, en su caso (art. 158.2 CE).
- id: g-competencia-exclusiva
  es: competencia exclusiva
  senses:
  - origin: m01-l09
    definition:
      es: >-
        La que el Estado tiene sobre las 32 materias que enumera el artículo 149.1 de la Constitución (art. 149.1
        CE).
  - origin: m01-l11
    definition:
      es: >-
        Competencia de la Unión en la que solo ella puede legislar y adoptar actos jurídicamente vinculantes; los
        Estados miembros solo pueden hacerlo si la Unión los faculta o para aplicar sus actos (art. 2.1 TFUE).
- id: g-entidad-local
  es: entidades locales
  origin: m01-l10
  definition:
    es: >-
      Son Entidades Locales territoriales el Municipio, la Provincia y la Isla en los archipiélagos balear y canario;
      tienen también esa condición las comarcas, las áreas metropolitanas y las mancomunidades de municipios (art.
      3 LBRL).
- id: g-municipio
  es: municipio
  origin: m01-l10
  definition:
    es: >-
      Entidad local básica de la organización territorial del Estado, con personalidad jurídica y plena capacidad
      para cumplir sus fines. Sus elementos son el territorio, la población y la organización (art. 11 LBRL).
- id: g-provincia
  es: provincia
  origin: m01-l10
  definition:
    es: >-
      Entidad local con personalidad jurídica propia, determinada por la agrupación de municipios y división territorial
      para el cumplimiento de las actividades del Estado (art. 141.1 CE). La gobierna la Diputación u otra Corporación
      de carácter representativo.
- id: g-termino-municipal
  es: término municipal
  origin: m01-l10
  definition:
    es: >-
      Territorio en que el ayuntamiento ejerce sus competencias. Cada municipio pertenece a una sola provincia (art.
      12 LBRL).
- id: g-padron-municipal
  es: Padrón municipal
  origin: m01-l10
  definition:
    es: >-
      Registro administrativo donde constan los vecinos de un municipio. Sus datos prueban la residencia y el domicilio
      habitual, y sus certificaciones son documento público y fehaciente (art. 16.1 LBRL).
- id: g-vecino
  es: vecinos
  origin: m01-l10
  definition:
    es: >-
      Las personas inscritas en el Padrón municipal. La condición de vecino se adquiere en el momento de la inscripción
      (art. 15 LBRL).
- id: g-concejo-abierto
  es: Concejo Abierto
  origin: m01-l10
  definition:
    es: >-
      Régimen de gobierno municipal en el que el gobierno y la administración corresponden a un Alcalde y a una
      asamblea vecinal de la que forman parte todos los electores (art. 29.3 LBRL).
- id: g-junta-de-gobierno-local
  es: Junta de Gobierno Local
  origin: m01-l10
  definition:
    es: >-
      Órgano municipal formado por el Alcalde y Concejales en número no superior al tercio del número legal, que
      asiste al Alcalde. Existe en los municipios de más de 5.000 habitantes y en los de menos si lo prevé el reglamento
      orgánico o lo acuerda el Pleno (arts. 20.1.b y 23 LBRL).
- id: g-mancomunidad
  es: mancomunidades
  origin: m01-l10
  definition:
    es: >-
      Asociaciones de municipios para la ejecución en común de obras y servicios determinados de su competencia,
      con personalidad jurídica y Estatutos propios (art. 44 LBRL).
- id: g-area-metropolitana
  es: áreas metropolitanas
  origin: m01-l10
  definition:
    es: >-
      Entidades locales integradas por los municipios de grandes aglomeraciones urbanas cuyos núcleos tienen vinculaciones
      económicas y sociales que exigen planificación conjunta y coordinación de servicios y obras (art. 43.2 LBRL).
- id: g-municipio-gran-poblacion
  es: municipios de gran población
  origin: m01-l10
  definition:
    es: >-
      Municipios a los que se aplica el régimen de organización del título X de la LBRL: los de más de 250.000 habitantes
      y las capitales de provincia de más de 175.000 y, si lo decide la Asamblea Legislativa a iniciativa del ayuntamiento,
      las capitales de provincia, las capitales autonómicas, las sedes de las instituciones autonómicas y los de
      más de 75.000 con circunstancias económicas, sociales, históricas o culturales especiales (art. 121.1 LBRL).
- id: g-mayoria-cualificada-consejo
  es: mayoría cualificada
  origin: m01-l11
  definition:
    es: >-
      En el Consejo de la Unión, desde el 1 de noviembre de 2014, un mínimo del 55 % de sus miembros que incluya
      al menos a quince de ellos y represente como mínimo el 65 % de la población de la Unión (art. 16.4 TUE). Si
      el Consejo no actúa a propuesta de la Comisión o del Alto Representante, el mínimo es el 72 % de los miembros
      (art. 238.2 TFUE).
- id: g-minoria-de-bloqueo
  es: minoría de bloqueo
  origin: m01-l11
  definition:
    es: >-
      En el Consejo de la Unión, al menos cuatro miembros; a falta de ella, la mayoría cualificada se considera
      alcanzada (art. 16.4 TUE).
- id: g-competencia-compartida
  es: competencia compartida
  origin: m01-l11
  definition:
    es: >-
      Competencia en la que legislan la Unión y los Estados miembros; los Estados la ejercen en la medida en que
      la Unión no haya ejercido la suya (art. 2.2 TFUE).
- id: g-cuestion-prejudicial
  es: cuestión prejudicial
  origin: m01-l11
  definition:
    es: >-
      Petición de un órgano jurisdiccional nacional al Tribunal de Justicia de la Unión Europea para que se pronuncie
      sobre la interpretación de los Tratados o sobre la validez e interpretación de los actos de la Unión. Es obligatoria
      para el órgano cuyas decisiones no admiten ulterior recurso (art. 267 TFUE).
- id: g-directiva
  es: directiva
  origin: m01-l11
  link_except:
  - m04-l01
  - m06-l03
  - m04-l08
  definition:
    es: >-
      Acto de la Unión que obliga al Estado miembro destinatario en cuanto al resultado y deja a las autoridades
      nacionales la elección de la forma y de los medios (art. 288 TFUE).
- id: g-principio-de-atribucion
  es: principio de atribución
  origin: m01-l11
  definition:
    es: >-
      Principio por el que la Unión actúa dentro de los límites de las competencias que le atribuyen los Estados
      miembros en los Tratados; toda competencia no atribuida corresponde a los Estados miembros (art. 5.2 TUE).
- id: g-derecho-de-peticion
  es: derecho de petición
  origin: m02-l01
  definition:
    es: >-
      Derecho de toda persona natural o jurídica, prescindiendo de su nacionalidad, a formular peticiones,
      individual o colectivamente, ante cualquier institución pública, administración o autoridad, respecto de las
      materias de su competencia (arts. 1.1 y 2 LO 4/2001).
- id: g-cartas-de-servicios
  es: cartas de servicios
  origin: m02-l01
  definition:
    es: >-
      Documentos a través de los cuales los órganos, organismos y entidades de la Administración General del
      Estado informan a los ciudadanos sobre los servicios que tienen encomendados, los derechos que les asisten y
      los compromisos de calidad en su prestación (art. 8.1 RD 951/2005).
- id: g-informacion-general
  es: información general
  origin: m02-l01
  link_except:
  - m06-l05
  definition:
    es: >-
      Información administrativa sobre la identificación, fines, competencia, estructura, funcionamiento y
      localización de organismos y unidades, los requisitos de las solicitudes, la tramitación de procedimientos y
      los servicios y prestaciones (art. 2.1 RD 208/1996). Se facilita sin exigir acreditación de legitimación
      alguna (art. 2.2 RD 208/1996).
- id: g-informacion-particular
  es: información particular
  origin: m02-l01
  definition:
    es: >-
      Información sobre el estado o contenido de los procedimientos en tramitación y la identificación de las
      autoridades y personal responsables de ellos, que sólo puede facilitarse a los interesados o a sus
      representantes legales (art. 3.1 RD 208/1996).
- id: g-personas-con-discapacidad
  es: personas con discapacidad
  origin: m02-l01
  definition:
    es: >-
      Aquellas que presentan deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente
      permanentes que, al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en
      la sociedad, en igualdad de condiciones con los demás (art. 4.1 RDL 1/2013).
- id: g-oficinas-de-atencion-al-ciudadano
  es: Oficinas de Atención al Ciudadano
  origin: m02-l01
  definition:
    es: >-
      Dependencias o espacios físicos que la Administración General del Estado dedica exclusiva o prioritariamente
      al contacto directo con los ciudadanos y sus representantes (art. 1.2.a) RD 366/2007).
- id: g-modelos-normalizados
  es: modelos normalizados
  origin: m02-l01
  definition:
    es: >-
      Impresos que la Administración General del Estado pone a disposición de los ciudadanos para formular
      solicitudes, declaraciones, alegaciones, recursos o cualquier pretensión o manifestación de voluntad ante
      ella (art. 1.2.b) RD 366/2007).
- id: g-accesibilidad-universal
  es: accesibilidad universal
  origin: m02-l01
  definition:
    es: >-
      Condición que deben cumplir los entornos, procesos, bienes, productos y servicios, así como los objetos,
      instrumentos, herramientas y dispositivos, para ser comprensibles, utilizables y practicables por todas las
      personas en condiciones de seguridad y comodidad y de la forma más autónoma y natural posible (art. 2.k) RDL
      1/2013, desde 23-10-2026).
- id: g-patrimonio-documental
  es: Patrimonio Documental
  origin: m02-l02
  definition:
    es: >-
      Parte del Patrimonio Histórico Español (art. 48.1 Ley 16/1985) que forman, entre otros, los documentos de
      cualquier época generados, conservados o reunidos en el ejercicio de su función por cualquier organismo o
      entidad de carácter público (art. 49.2 Ley 16/1985).
- id: g-documento-de-archivo
  es: documento de archivo
  origin: m02-l02
  definition:
    es: >-
      Ejemplar en cualquier tipo de soporte, testimonio de las actividades y funciones de las personas físicas y
      jurídicas, públicas o privadas (art. 2.2.b) RD 1708/2011).
- id: g-documento-electronico
  es: documento electrónico
  origin: m02-l02
  definition:
    es: >-
      Información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico, según un
      formato determinado y susceptible de identificación y tratamiento diferenciado (art. 2.2.c) RD 1708/2011).
- id: g-expediente-electronico
  es: expediente electrónico
  origin: m02-l02
  definition:
    es: >-
      Conjunto de documentos electrónicos correspondientes a un procedimiento administrativo, cualquiera que sea
      el tipo de información que contengan (art. 2.2.d) RD 1708/2011).
- id: g-documentos-publicos-administrativos
  es: documentos públicos administrativos
  origin: m02-l02
  definition:
    es: >-
      Los válidamente emitidos por los órganos de las Administraciones Públicas (art. 26.1 LPAC).
- id: g-documento-administrativo-electronico
  es: documento administrativo electrónico
  origin: m02-l02
  definition:
    es: >-
      Información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico, según un
      formato determinado y susceptible de identificación y tratamiento diferenciado admitido en el Esquema
      Nacional de Interoperabilidad y normativa correspondiente, generada, recibida o incorporada por las
      Administraciones Públicas en el ejercicio de sus funciones sujetas a Derecho administrativo (art. 46.1 RD
      203/2021).
- id: g-registro-electronico-general
  es: Registro Electrónico General
  origin: m02-l02
  definition:
    es: >-
      Registro de cada Administración en el que se hace el asiento de todo documento que sea presentado o que se
      reciba en cualquier órgano administrativo, Organismo público o Entidad vinculado o dependiente (art. 16.1
      LPAC).
- id: g-archivo-electronico-unico
  es: archivo electrónico único
  origin: m02-l02
  definition:
    es: >-
      Conjunto de sistemas y servicios de cada Administración que sustenta la gestión, custodia y recuperación de
      los documentos y expedientes electrónicos una vez finalizados los procedimientos administrativos o
      actuaciones correspondientes (art. 17.1 LPAC; art. 55.1 RD 203/2021).
- id: g-ciclo-vital-de-documentos
  es: ciclo vital de documentos
  origin: m02-l02
  definition:
    es: >-
      Etapas por las que atraviesan los documentos desde que se producen hasta su eliminación conforme al
      procedimiento establecido o, en su caso, su conservación permanente (art. 2.2.e) RD 1708/2011).
- id: g-calendario-de-conservacion
  es: calendario de conservación
  origin: m02-l02
  definition:
    es: >-
      Instrumento de trabajo fruto de la valoración documental que recoge el plazo de permanencia de los
      documentos de archivo en cada fase del ciclo vital para su selección, eliminación o conservación permanente
      (art. 2.2.f) RD 1708/2011).
- id: g-archivo-intermedio
  es: archivo intermedio
  origin: m02-l02
  definition:
    es: >-
      Institución que custodia los documentos de los Departamentos ministeriales y sus organismos públicos una vez
      finalizada su fase activa. En la Administración General del Estado es el Archivo General de la
      Administración (art. 11 RD 1708/2011).
- id: g-comision-superior-calificadora-de-documentos-administrativos
  es: Comisión Superior Calificadora de Documentos Administrativos
  origin: m02-l02
  definition:
    es: >-
      Órgano al que corresponde el estudio y dictamen de la calificación y utilización de los documentos de la
      Administración del Estado y del sector público estatal (art. 58 Ley 16/1985). Se adscribe como órgano
      consultivo superior a la Comisión de Archivos de la Administración General del Estado (art. 13.6 RD
      1708/2011).
- id: g-sede-electronica
  es: sede electrónica
  origin: m02-l03
  definition:
    es: >-
      Dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya
      titularidad corresponde a una Administración Pública, o bien a una o varios organismos públicos o entidades
      de Derecho Público en el ejercicio de sus competencias (art. 38.1 LRJSP).
- id: g-portal-de-internet
  es: portal de internet
  origin: m02-l03
  definition:
    es: >-
      Punto de acceso electrónico cuya titularidad corresponde a una Administración Pública, organismo público o
      entidad de Derecho Público y que permite el acceso a través de internet a la información publicada y, en su
      caso, a la sede electrónica correspondiente (art. 39 LRJSP).
- id: g-punto-de-acceso-general
  es: Punto de Acceso General
  origin: m02-l03
  definition:
    es: >-
      Portal de internet que facilita el acceso a los servicios, trámites e información de los órganos, organismos
      públicos y entidades de la Administración correspondiente y aglutina o conduce a sus sedes electrónicas
      (anexo RD 203/2021). El de la Administración General del Estado lo regula la Orden HAP/1949/2014.
- id: g-carpeta-ciudadana
  es: Carpeta Ciudadana
  origin: m02-l03
  definition:
    es: >-
      Área personalizada de las personas interesadas en su relación con el sector público estatal, accesible a
      través de la sede electrónica del Punto de Acceso General electrónico (art. 8.1 y 8.2 RD 203/2021).
- id: g-direccion-electronica-habilitada-unica
  es: Dirección Electrónica Habilitada única
  origin: m02-l03
  definition:
    es: >-
      Sistema de información para la notificación electrónica, alojado en la sede electrónica del Punto de Acceso
      General electrónico de la Administración General del Estado (art. 44.1 y 44.2 RD 203/2021).
- id: g-certificado-electronico
  es: certificado electrónico
  origin: m02-l03
  definition:
    es: >-
      Documento emitido y firmado por la Autoridad de Certificación que identifica una clave pública con su
      propietario (anexo RD 203/2021).
- id: g-sello-electronico
  es: sello electrónico
  origin: m02-l03
  definition:
    es: >-
      Datos en formato electrónico anejos a otros datos en formato electrónico, o asociados de manera lógica con
      ellos, para garantizar el origen y la integridad de estos últimos (anexo RD 203/2021).
- id: g-carga-desproporcionada
  es: carga desproporcionada
  origin: m02-l03
  definition:
    es: >-
      Carga financiera y organizativa excesiva para la entidad obligada, o que compromete su capacidad para
      cumplir su cometido o para publicar la información necesaria y pertinente para sus tareas y servicios, teniendo en cuenta al mismo
      tiempo el posible beneficio o perjuicio para los ciudadanos, en particular para las personas con discapacidad
      y personas mayores. Permite exceptuar con carácter excepcional los requisitos de accesibilidad web (art. 7.1 y
      7.2 RD 1112/2018).
- id: g-declaracion-de-accesibilidad
  es: declaración de accesibilidad
  origin: m02-l03
  definition:
    es: >-
      Declaración detallada, exhaustiva y clara sobre la conformidad de un sitio web o aplicación móvil del sector
      público con el RD 1112/2018, actualizada como mínimo una vez al año (art. 15.1 RD 1112/2018).
- id: g-datos-personales
  es: datos personales
  origin: m02-l04
  definition:
    es: >-
      Toda información sobre una persona física identificada o identificable, a la que el RGPD llama «el
      interesado» (art. 4.1 RGPD).
- id: g-responsable-del-tratamiento
  es: responsable del tratamiento
  origin: m02-l04
  definition:
    es: >-
      Persona física o jurídica, autoridad pública, servicio u otro organismo que, solo o junto con otros,
      determina los fines y medios del tratamiento de datos personales (art. 4.7 RGPD).
- id: g-encargado-del-tratamiento
  es: encargado del tratamiento
  origin: m02-l04
  definition:
    es: >-
      Persona física o jurídica, autoridad pública, servicio u otro organismo que trata datos personales por
      cuenta del responsable del tratamiento (art. 4.8 RGPD).
- id: g-consentimiento-del-interesado
  es: consentimiento del interesado
  origin: m02-l04
  definition:
    es: >-
      Toda manifestación de voluntad libre, específica, informada e inequívoca por la que el interesado acepta,
      mediante una declaración o una clara acción afirmativa, el tratamiento de los datos personales que le
      conciernen (art. 4.11 RGPD; art. 6.1 LOPDGDD).
- id: g-limitacion-del-tratamiento
  es: limitación del tratamiento
  origin: m02-l04
  definition:
    es: >-
      Marcado de los datos de carácter personal conservados con el fin de limitar su tratamiento en el futuro
      (art. 4.3 RGPD).
- id: g-violacion-de-la-seguridad-de-los-datos-personales
  es: violación de la seguridad de los datos personales
  origin: m02-l04
  definition:
    es: >-
      Toda violación de la seguridad que ocasiona la destrucción, pérdida o alteración accidental o ilícita de
      datos personales transmitidos, conservados o tratados de otra forma, o la comunicación o acceso no
      autorizados a dichos datos (art. 4.12 RGPD).
- id: g-categorias-especiales-de-datos
  es: categorías especiales de datos
  origin: m02-l04
  definition:
    es: >-
      Datos personales que revelan el origen étnico o racial, las opiniones políticas, las convicciones religiosas
      o filosóficas o la afiliación sindical, y los datos genéticos, biométricos dirigidos a identificar de manera
      unívoca a una persona, relativos a la salud o a la vida u orientación sexual, cuyo tratamiento está
      prohibido salvo en los casos del artículo 9.2 (art. 9 RGPD).
- id: g-responsabilidad-proactiva
  es: responsabilidad proactiva
  origin: m02-l04
  definition:
    es: >-
      Principio por el que el responsable del tratamiento responde del cumplimiento de los principios del artículo
      5.1 del RGPD y debe ser capaz de demostrarlo (art. 5.2 RGPD).
- id: g-desconexion-digital
  es: desconexión digital
  origin: m02-l04
  definition:
    es: >-
      Derecho de los trabajadores y los empleados públicos a que se respete, fuera del tiempo de trabajo legal o
      convencionalmente establecido, su tiempo de descanso, permisos y vacaciones y su intimidad personal y
      familiar (art. 88.1 LOPDGDD).
- id: g-agencia-espanola-de-proteccion-de-datos
  es: Agencia Española de Protección de Datos
  origin: m02-l04
  definition:
    es: >-
      Autoridad administrativa independiente de ámbito estatal, con personalidad jurídica y plena capacidad
      pública y privada, que actúa con plena independencia de los poderes públicos en el ejercicio de sus
      funciones (art. 44.1 LOPDGDD).
- id: g-decreto-ley
  es: decreto-ley
  origin: m03-l01
  definition:
    es: >-
      Disposición legislativa provisional que el Gobierno puede dictar en caso de extraordinaria y urgente
      necesidad. No puede afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes
      y libertades del Título I, al régimen de las Comunidades Autónomas ni al Derecho electoral general
      (art. 86.1 CE).
- id: g-decreto-legislativo
  es: decreto legislativo
  origin: m03-l01
  definition:
    es: >-
      Disposición del Gobierno que contiene legislación delegada por las Cortes Generales, mediante una ley de
      bases para formar textos articulados o una ley ordinaria para refundir varios textos legales en uno solo
      (arts. 82.1, 82.2 y 85 CE).
- id: g-potestad-reglamentaria
  es: potestad reglamentaria
  origin: m03-l01
  definition:
    es: >-
      Potestad para dictar reglamentos y otras disposiciones (título VI LPAC). Su ejercicio corresponde al
      Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas, de conformidad con sus
      respectivos Estatutos, y a los órganos de gobierno locales, de acuerdo con la Constitución, los Estatutos
      de Autonomía y la Ley 7/1985 (art. 128.1 LPAC). El Gobierno la ejerce de acuerdo con la Constitución y las
      leyes (art. 97 CE).
- id: g-costumbre
  es: costumbre
  origin: m03-l01
  definition:
    es: >-
      Fuente del ordenamiento jurídico que sólo rige en defecto de ley aplicable, siempre que no sea contraria a
      la moral o al orden público y que resulte probada (arts. 1.1 y 1.3 Código Civil).
- id: g-jurisprudencia
  es: jurisprudencia
  origin: m03-l01
  definition:
    es: >-
      Doctrina que, de modo reiterado, establece el Tribunal Supremo al interpretar y aplicar la ley, la costumbre
      y los principios generales del derecho. Complementa el ordenamiento jurídico (art. 1.6 Código Civil).
- id: g-anulabilidad
  es: anulabilidad
  origin: m03-l02
  definition:
    es: >-
      Invalidez de los actos de la Administración que incurren en cualquier infracción del ordenamiento jurídico,
      incluso la desviación de poder (art. 48.1 LPAC).
- id: g-desviacion-de-poder
  es: desviación de poder
  origin: m03-l02
  definition:
    es: >-
      Ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico
      (art. 70.2 LJCA).
- id: g-inderogabilidad-singular
  es: inderogabilidad singular
  origin: m03-l02
  definition:
    es: >-
      Regla por la que las resoluciones administrativas de carácter particular no pueden vulnerar lo establecido
      en una disposición de carácter general, aunque procedan de un órgano de igual o superior jerarquía al que
      dictó la disposición general (art. 37.1 LPAC).
- id: g-comparecencia-en-la-sede-electronica
  es: comparecencia en la sede electrónica
  origin: m03-l02
  definition:
    es: >-
      Acceso por el interesado o su representante debidamente identificado al contenido de la notificación, a
      efectos de la notificación por medios electrónicos (art. 43.1 LPAC).
- id: g-interesado
  es: interesado
  origin: m03-l03
  link_except:
  - m01-l01
  - m01-l08
  - m01-l10
  - m02-l04
  definition:
    es: >-
      En el procedimiento administrativo, quien lo promueve como titular de derechos o intereses legítimos
      individuales o colectivos; quien, sin haberlo iniciado, tiene derechos que puedan resultar afectados por la
      decisión que en él se adopte; y quien tiene intereses legítimos, individuales o colectivos, que puedan
      resultar afectados por la resolución y se persona en el procedimiento en tanto no haya recaído resolución
      definitiva (art. 4.1 LPAC).
- id: g-convenio
  es: convenio
  origin: m03-l03
  link_except:
  - m01-l01
  - m01-l03
  - m02-l04
  - m03-l04
  - m04-l06
  - m04-l08
  - m05-l04
  - m05-l05
  - m05-l06
  definition:
    es: >-
      Acuerdo con efectos jurídicos adoptado por las Administraciones Públicas, los organismos públicos y
      entidades de derecho público vinculados o dependientes o las Universidades públicas entre sí o con sujetos
      de derecho privado para un fin común (art. 47.1 LRJSP).
- id: g-organo-colegiado
  es: órgano colegiado
  origin: m03-l03
  link_except:
  - m01-l03
  - m01-l05
  - m01-l09
  - m03-l01
  definition:
    es: >-
      Órgano que se crea formalmente, está integrado por tres o más personas, tiene atribuidas funciones
      administrativas de decisión, propuesta, asesoramiento, seguimiento o control y actúa integrado en la
      Administración General del Estado o en alguno de sus Organismos públicos (art. 20.1 LRJSP).
- id: g-recurso-de-alzada
  es: recurso de alzada
  origin: m03-l03
  definition:
    es: >-
      Recurso contra las resoluciones y actos del artículo 112.1 que no ponen fin a la vía administrativa, ante el
      órgano superior jerárquico del que los dictó (art. 121.1 LPAC).
- id: g-recurso-potestativo-de-reposicion
  es: recurso potestativo de reposición
  origin: m03-l03
  definition:
    es: >-
      Recurso que puede interponerse potestativamente, ante el mismo órgano que los hubiera dictado, contra los
      actos administrativos que pongan fin a la vía administrativa, que también pueden impugnarse directamente
      ante el orden jurisdiccional contencioso-administrativo (art. 123.1 LPAC).
- id: g-recurso-extraordinario-de-revision
  es: recurso extraordinario de revisión
  origin: m03-l03
  definition:
    es: >-
      Recurso contra los actos firmes en vía administrativa, ante el órgano administrativo que los dictó, cuando
      concurre alguna de las circunstancias del artículo 125.1 (art. 125.1 LPAC).
- id: g-declaracion-de-lesividad
  es: declaración de lesividad
  origin: m03-l03
  definition:
    es: >-
      Declaración, previa a su impugnación por la Administración ante el orden jurisdiccional
      contencioso-administrativo, de que un acto favorable para los interesados y anulable conforme al artículo
      48 es lesivo para el interés público (art. 107.1 LPAC).
- id: g-recusacion
  es: recusación
  origin: m03-l03
  definition:
    es: >-
      Petición que los interesados pueden plantear por escrito, en cualquier momento de la tramitación del
      procedimiento, para que se sustituya a la autoridad o al personal al servicio de las Administraciones en
      quien concurra alguna de las circunstancias de abstención del artículo 23 (art. 24.1–3 LRJSP).
- id: g-contrato-menor
  es: contrato menor
  origin: m03-l04
  definition:
    es: >-
      Contrato de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras, o a 15.000 euros,
      cuando se trate de contratos de suministro o de servicios, sin perjuicio de lo dispuesto en el artículo 229
      (art. 118.1 LCSP).
- id: g-presupuesto-base-de-licitacion
  es: presupuesto base de licitación
  origin: m03-l04
  definition:
    es: >-
      Límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el
      Impuesto sobre el Valor Añadido, salvo disposición en contrario (art. 100.1 LCSP).
- id: g-valor-estimado
  es: valor estimado
  origin: m03-l04
  definition:
    es: >-
      En los contratos de obras, suministros y servicios, el importe total, sin incluir el Impuesto sobre el Valor
      Añadido, pagadero según las estimaciones del órgano de contratación (art. 101.1.a) LCSP). En las concesiones,
      el importe neto de la cifra de negocios, sin incluir el Impuesto sobre el Valor Añadido, que según las
      estimaciones del órgano de contratación generará la empresa concesionaria (art. 101.1.b) LCSP).
- id: g-contrato-sujeto-a-regulacion-armonizada
  es: contrato sujeto a regulación armonizada
  origin: m03-l04
  definition:
    es: >-
      Contrato de obras, de concesión de obras, de concesión de servicios, de suministro o de servicios cuyo valor
      estimado sea igual o superior a las cuantías de los artículos 20 a 22, siempre que la entidad contratante
      tenga el carácter de poder adjudicador, salvo los excluidos por el artículo 19.2 (art. 19 LCSP).
- id: g-contrato-de-obras
  es: contrato de obras
  origin: m03-l04
  definition:
    es: >-
      Contrato que tiene por objeto la ejecución de una obra, aislada o conjuntamente con la redacción del
      proyecto, o la realización de alguno de los trabajos del anexo I, o la realización, por cualquier medio, de
      una obra que cumpla los requisitos fijados por la entidad contratante que ejerza una influencia decisiva en
      el tipo o el proyecto de la obra (art. 13.1 LCSP).
- id: g-contrato-de-suministro
  es: contrato de suministro
  origin: m03-l04
  definition:
    es: >-
      Contrato que tiene por objeto la adquisición, el arrendamiento financiero, o el arrendamiento, con o sin
      opción de compra, de productos o bienes muebles (art. 16.1 LCSP).
- id: g-contrato-de-servicios
  es: contrato de servicios
  origin: m03-l04
  definition:
    es: >-
      Contrato cuyo objeto son prestaciones de hacer consistentes en el desarrollo de una actividad o dirigidas a
      la obtención de un resultado distinto de una obra o suministro (art. 17 LCSP).
- id: g-concesion-de-servicios
  es: concesión de servicios
  origin: m03-l04
  definition:
    es: >-
      Contrato por el que uno o varios poderes adjudicadores encomiendan a título oneroso a una o varias
      personas, naturales o jurídicas, la gestión de un servicio cuya prestación sea de su titularidad o
      competencia, y cuya contrapartida es el derecho a explotar los servicios o ese derecho acompañado del de
      percibir un precio (art. 15.1 LCSP).
- id: g-contrato-mixto
  es: contrato mixto
  origin: m03-l04
  definition:
    es: >-
      Contrato que contiene prestaciones correspondientes a otro u otros de distinta clase (art. 18.1 LCSP).
- id: g-acuerdo-marco
  es: acuerdo marco
  origin: m03-l04
  definition:
    es: >-
      Acuerdo que uno o varios órganos de contratación del sector público celebran con una o varias empresas para
      fijar las condiciones a que habrán de ajustarse los contratos que pretendan adjudicar durante un período
      determinado, en particular los precios y, en su caso, las cantidades previstas (art. 219.1 LCSP).
- id: g-mesa-de-contratacion
  es: mesa de contratación
  origin: m03-l04
  definition:
    es: >-
      Órgano de asistencia técnica especializada que asiste a los órganos de contratación de las Administraciones
      Públicas en los procedimientos de adjudicación que señala el artículo 326.1, salvo cuando la competencia
      para contratar corresponde a una Junta de Contratación (art. 326.1–2 LCSP).
- id: g-declaracion-responsable
  es: declaración responsable
  origin: m03-l05
  definition:
    es: >-
      Documento suscrito por un interesado en el que manifiesta, bajo su responsabilidad, que cumple los
      requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o
      para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la
      Administración cuando le sea requerida y que se compromete a mantener el cumplimiento de esas obligaciones
      durante el periodo inherente a dicho reconocimiento o ejercicio (art. 69.1 LPAC).
- id: g-subvencion
  es: subvención
  origin: m03-l05
  definition:
    es: >-
      Disposición dineraria de los sujetos del artículo 3 de la Ley 38/2003 a favor de personas públicas o
      privadas, sin contraprestación directa de los beneficiarios, sujeta al cumplimiento de un objetivo, la
      ejecución de un proyecto, la realización de una actividad, la adopción de un comportamiento singular o la
      concurrencia de una situación, con las obligaciones materiales y formales que se hubieran establecido, y
      que tiene por objeto el fomento de una actividad de utilidad pública o interés social o la promoción de una
      finalidad pública (art. 2.1 LGS).
- id: g-consejo-de-estado
  es: Consejo de Estado
  origin: m03-l06
  definition:
    es: >-
      Supremo órgano consultivo del Gobierno (art. 107 CE; art. 1.1 LO 3/1980).
- id: g-discriminacion-directa-por-razon-de-sexo
  es: discriminación directa por razón de sexo
  origin: m03-l07
  definition:
    es: >-
      Situación en que se encuentra una persona que sea, haya sido o pudiera ser tratada, en atención a su sexo,
      de manera menos favorable que otra en situación comparable (art. 6.1 LO 3/2007).
- id: g-discriminacion-indirecta-por-razon-de-sexo
  es: discriminación indirecta por razón de sexo
  origin: m03-l07
  definition:
    es: >-
      Situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en
      desventaja particular con respecto a personas del otro, salvo que dicha disposición, criterio o práctica
      puedan justificarse objetivamente en atención a una finalidad legítima y que los medios para alcanzar dicha
      finalidad sean necesarios y adecuados (art. 6.2 LO 3/2007).
- id: g-acoso-sexual
  es: acoso sexual
  origin: m03-l07
  definition:
    es: >-
      A los efectos de la LO 3/2007 y sin perjuicio del Código Penal, cualquier comportamiento, verbal o físico,
      de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de una
      persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo (art. 7.1 LO 3/2007).
- id: g-acoso-por-razon-de-sexo
  es: acoso por razón de sexo
  origin: m03-l07
  definition:
    es: >-
      Cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de
      atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo (art. 7.2 LO 3/2007).
- id: g-composicion-equilibrada
  es: composición equilibrada
  origin: m03-l07
  definition:
    es: >-
      Presencia de mujeres y hombres de forma que, en el conjunto a que se refiera, las personas de cada sexo no
      superen el sesenta por ciento ni sean menos del cuarenta por ciento (disposición adicional primera
      LO 3/2007).
- id: g-situacion-de-dependencia
  es: situación de dependencia
  origin: m03-l07
  definition:
    es: >-
      Estado de carácter permanente en el que las personas, debido a dificultades que afectan a su autonomía,
      precisan de cuidados y apoyos de otra u otras personas o ayudas importantes para realizar actividades de la
      vida diaria (art. 2.2 Ley 39/2006, desde 23-10-2026).
- id: g-persona-trans
  es: persona trans
  origin: m03-l07
  definition:
    es: >-
      Persona cuya identidad sexual no se corresponde con el sexo asignado al nacer (art. 3.k) Ley 4/2023).
- id: g-normalizacion
  es: normalización
  origin: m03-l07
  definition:
    es: >-
      Principio en virtud del cual las personas con discapacidad deben poder llevar una vida en igualdad de
      condiciones, accediendo a los mismos lugares, ámbitos, bienes y servicios que están a disposición de
      cualquier otra persona (art. 2.i) RDL 1/2013).
- id: g-empleado-publico
  es: empleado público
  origin: m04-l01
  match:
    es:
    - empleado público
    - empleados públicos
  definition:
    es: >-
      Quien desempeña funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales
      (art. 8.1 TREBEP).
- id: g-funcionario-de-carrera
  es: funcionario de carrera
  origin: m04-l01
  match:
    es:
    - funcionario de carrera
    - funcionarios de carrera
  definition:
    es: >-
      Quien, en virtud de nombramiento legal, está vinculado a una Administración Pública por una relación
      estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de
      carácter permanente (art. 9.1 TREBEP).
- id: g-personal-laboral
  es: personal laboral
  origin: m04-l01
  definition:
    es: >-
      El que, en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de
      contratación de personal previstas en la legislación laboral, presta servicios retribuidos por las
      Administraciones Públicas; según la duración del contrato, puede ser fijo, por tiempo indefinido o temporal
      (art. 11.1 TREBEP).
- id: g-personal-eventual
  es: personal eventual
  origin: m04-l01
  definition:
    es: >-
      El que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente
      calificadas como de confianza o asesoramiento especial, retribuido con cargo a los créditos presupuestarios
      consignados para este fin (art. 12.1 TREBEP).
- id: g-registro-central-de-personal
  es: Registro Central de Personal
  origin: m04-l01
  definition:
    es: >-
      Registro administrativo de la Administración General del Estado en el que se inscribe su personal y se anotan
      preceptivamente los actos que afecten a su vida administrativa (art. 1.1 Reglamento aprobado por RD 2073/1999;
      art. 13.1 Ley 30/1984).
- id: g-oferta-de-empleo-publico
  es: Oferta de Empleo Público
  origin: m04-l02
  definition:
    es: >-
      Instrumento que recoge las necesidades de recursos humanos, con asignación presupuestaria, que deban proveerse
      mediante la incorporación de personal de nuevo ingreso; su ejecución debe desarrollarse dentro del plazo
      improrrogable de tres años (art. 70.1 TREBEP).
- id: g-organo-de-seleccion
  es: órgano de selección
  origin: m04-l02
  match:
    es:
    - órgano de selección
    - órganos de selección
  definition:
    es: >-
      Órgano colegiado que desarrolla y califica las pruebas selectivas, cuya composición se ajusta a los principios
      de imparcialidad y profesionalidad de sus miembros. En la Administración General del Estado lo son los
      Tribunales y las Comisiones Permanentes de Selección (art. 60.1 TREBEP; arts. 10, 11 y 12.1 RD 364/1995).
- id: g-comision-permanente-de-seleccion
  es: Comisión Permanente de Selección
  origin: m04-l02
  match:
    es:
    - Comisión Permanente de Selección
    - Comisiones Permanentes de Selección
  definition:
    es: >-
      Órgano de selección al que se encomienda el desarrollo y la calificación de las pruebas de los Cuerpos y Escalas
      en los que el elevado número de aspirantes y el nivel de titulación o especialización exigidos así lo aconseje
      (art. 12.1 RD 364/1995).
- id: g-funcionario-interino
  es: funcionario interino
  origin: m04-l03
  match:
    es:
    - funcionario interino
    - funcionarios interinos
  definition:
    es: >-
      Funcionario nombrado con carácter temporal, por razones expresamente justificadas de necesidad y urgencia, para
      el desempeño de funciones propias de funcionarios de carrera en alguna de las circunstancias que fija el
      Estatuto (art. 10.1 TREBEP).
- id: g-funcionario-en-practicas
  es: funcionario en prácticas
  origin: m04-l03
  match:
    es:
    - funcionario en prácticas
    - funcionarios en prácticas
  definition:
    es: >-
      Condición que tiene el aspirante a funcionario de carrera durante el curso selectivo o el periodo de prácticas
      que forma parte del proceso selectivo (art. 114.8 RDL 6/2023; art. 24.1 RD 364/1995).
- id: g-curso-selectivo
  es: curso selectivo
  origin: m04-l03
  match:
    es:
    - curso selectivo
    - cursos selectivos
  definition:
    es: >-
      Fase del sistema de selección de funcionarios de carrera que consiste en un periodo formativo o de prácticas
      evaluable, cuyo contenido y desarrollo difiere de lo valorado en las fases previas (art. 114.8 RDL 6/2023).
- id: g-oposicion
  es: oposición
  origin: m04-l03
  link_except:
  - m01-l07
  - m02-l04
  definition:
    es: >-
      Sistema selectivo que consiste en la celebración de una o más pruebas para determinar la capacidad de los
      aspirantes y fijar su orden de prelación (art. 114.5 RDL 6/2023).
- id: g-concurso-oposicion
  es: concurso-oposición
  origin: m04-l03
  definition:
    es: >-
      Sistema selectivo que consiste en la sucesiva celebración de la oposición y del concurso; para la valoración de
      la fase de concurso hay que haber superado la fase de oposición (art. 114.7 RDL 6/2023).
- id: g-servicio-activo
  es: servicio activo
  origin: m04-l04
  link_except:
  - m01-l04
  definition:
    es: >-
      Situación administrativa de quien presta servicios en su condición de funcionario público, cualquiera que sea
      la Administración u organismo público o entidad en que esté destinado, y no le corresponda quedar en otra
      situación (art. 86.1 TREBEP).
- id: g-servicio-en-otras-administraciones-publicas
  es: servicio en otras Administraciones Públicas
  origin: m04-l04
  definition:
    es: >-
      Situación administrativa del funcionario de carrera que, en virtud de los procesos de transferencias o por los
      procedimientos de provisión de puestos de trabajo, obtiene destino en una Administración Pública distinta (art.
      88.1 TREBEP).
- id: g-suspension-firme
  es: suspensión firme
  origin: m04-l04
  definition:
    es: >-
      Suspensión de funciones impuesta en virtud de sentencia dictada en causa criminal o de sanción disciplinaria; la
      disciplinaria no puede exceder de seis años (art. 90.2 TREBEP; art. 22.1 RD 365/1995).
- id: g-expectativa-de-destino
  es: expectativa de destino
  origin: m04-l04
  definition:
    es: >-
      Situación de los funcionarios afectados por un procedimiento de reasignación de efectivos que no han obtenido
      puesto en sus dos primeras fases; dura un máximo de un año, tras el cual se pasa a la excedencia forzosa (arts. 12.1
      y 12.2 RD 365/1995).
- id: g-libre-designacion
  es: libre designación
  origin: m04-l05
  definition:
    es: >-
      Procedimiento de provisión de puestos que consiste en la apreciación discrecional por el órgano competente de la
      idoneidad de los candidatos en relación con los requisitos exigidos para el desempeño del puesto. Sus titulares
      pueden ser cesados discrecionalmente (art. 80.1 y 80.4 TREBEP).
- id: g-grado-personal
  es: grado personal
  origin: m04-l05
  definition:
    es: >-
      Nivel que adquiere el funcionario de carrera por el desempeño de uno o más puestos del nivel correspondiente
      durante dos años continuados o tres con interrupción, cualquiera que sea el sistema de provisión (art. 70.2 RD
      364/1995).
- id: g-comision-de-servicios
  es: comisión de servicios
  origin: m04-l05
  definition:
    es: >-
      Forma de provisión temporal de un puesto vacante: voluntaria, en caso de urgente e inaplazable necesidad, con un
      funcionario que reúna los requisitos establecidos para su desempeño; o forzosa, cuando el concurso se declara
      desierto y es urgente para el servicio su provisión. Las de los apartados 1 y 2 del artículo 64 tienen una
      duración máxima de un año, prorrogable por otro si el puesto no se ha cubierto con carácter definitivo (art.
      64.1–3 RD 364/1995).
- id: g-adscripcion-provisional
  es: adscripción provisional
  origin: m04-l05
  definition:
    es: >-
      Forma de provisión temporal que solo procede por remoción o cese en un puesto obtenido por concurso o libre
      designación, por supresión del puesto o por reingreso al servicio activo sin reserva de puesto (art. 63 RD
      364/1995).
- id: g-redistribucion-de-efectivos
  es: redistribución de efectivos
  origin: m04-l05
  definition:
    es: >-
      Adscripción, por necesidades del servicio, de los funcionarios que ocupen con carácter definitivo puestos no
      singularizados a otros de la misma naturaleza, nivel de complemento de destino y complemento específico, con el
      mismo procedimiento de provisión y sin cambio de municipio (art. 59.1 RD 364/1995).
- id: g-reasignacion-de-efectivos
  es: reasignación de efectivos
  origin: m04-l05
  definition:
    es: >-
      Procedimiento por el que los funcionarios cuyo puesto se suprime como consecuencia de un Plan de Empleo pueden
      ser destinados a otro puesto, con criterios objetivos y carácter definitivo (art. 60.1 RD 364/1995).
- id: g-promocion-interna
  es: promoción interna
  origin: m04-l05
  definition:
    es: >-
      En la Administración del Estado, ascenso desde Cuerpos o Escalas de un Grupo de titulación a otro del inmediato
      superior o acceso a Cuerpos o Escalas del mismo Grupo de titulación (art. 73 RD 364/1995).
- id: g-carrera-horizontal
  es: carrera horizontal
  origin: m04-l05
  definition:
    es: >-
      Reconocimiento del desarrollo profesional del funcionario de carrera mediante su progresión en un sistema de
      tramos, sin necesidad de cambiar de puesto de trabajo (art. 122.1 RDL 6/2023).
- id: g-separacion-del-servicio
  es: separación del servicio
  origin: m04-l06
  link_except:
  - m01-l04
  definition:
    es: >-
      Sanción disciplinaria que solo puede imponerse por faltas muy graves; en los funcionarios interinos comporta la
      revocación de su nombramiento (art. 96.1.a) TREBEP).
- id: g-suspension-provisional
  es: suspensión provisional
  origin: m04-l06
  definition:
    es: >-
      Suspensión de funciones acordada con ocasión de la tramitación de un procedimiento judicial o expediente
      disciplinario; como medida cautelar en el expediente disciplinario no puede exceder de 6 meses, salvo
      paralización imputable al interesado (arts. 90.4 y 98.3 TREBEP).
- id: g-pliego-de-cargos
  es: pliego de cargos
  origin: m04-l06
  match:
    es:
    - pliego de cargos
  definition:
    es: >-
      Escrito del Instructor del expediente disciplinario con los hechos imputados y, en su caso, la falta presuntamente
      cometida y las sanciones aplicables; se formula en un plazo no superior a un mes desde la incoación, que el
      Instructor puede pedir ampliar por causas justificadas (art. 35.1 RD 33/1986).
- id: g-autorizacion-de-compatibilidad
  es: autorización de compatibilidad
  origin: m04-l06
  definition:
    es: >-
      Autorización previa y expresa que exige el desempeño de un segundo puesto o actividad en el sector público; no
      supone modificación de la jornada de trabajo y horario de los dos puestos y se efectúa en razón del interés
      público (art. 3.1 Ley 53/1984).
- id: g-reconocimiento-de-compatibilidad
  es: reconocimiento de compatibilidad
  origin: m04-l06
  definition:
    es: >-
      Resolución previa que requiere el ejercicio de actividades profesionales, laborales, mercantiles o industriales
      fuera de las Administraciones Públicas; no puede modificar la jornada de trabajo y horario (art. 14 Ley 53/1984).
- id: g-demerito
  es: demérito
  origin: m04-l06
  definition:
    es: >-
      Sanción disciplinaria que consiste en la penalización a efectos de carrera, promoción o movilidad voluntaria (art.
      96.1.e) TREBEP).
- id: g-mutualismo-administrativo
  es: mutualismo administrativo
  origin: m04-l07
  definition:
    es: >-
      Mecanismo de cobertura del Régimen especial de la Seguridad Social de los Funcionarios Civiles del Estado, junto
      al Régimen de Clases Pasivas. Se gestiona y presta a través de la MUFACE (arts. 2.1.b) y 4.1 RDL 4/2000).
- id: g-regimen-de-clases-pasivas
  es: Régimen de Clases Pasivas
  origin: m04-l07
  definition:
    es: >-
      Régimen por el que el Estado garantiza a los funcionarios de carrera civiles del Estado y al resto del personal
      del art. 2.1 TRLCPE la protección frente a los riesgos de vejez, incapacidad y muerte y supervivencia, con
      pensiones de jubilación o retiro, de viudedad, de orfandad y en favor de los padres (arts. 1.1 y 18.2 TRLCPE).
- id: g-mutualista
  es: mutualista
  origin: m04-l07
  definition:
    es: >-
      Funcionario incorporado a la MUFACE. El funcionario de carrera de la Administración Civil del Estado se incorpora
      obligatoriamente en el momento de la toma de posesión de su cargo, cuando adquiere la condición de funcionario,
      es rehabilitado en ella o reingresa al servicio activo (art. 7.1 RDL 4/2000).
- id: g-grupo-profesional
  es: grupo profesional
  origin: m04-l08
  definition:
    es: >-
      En el IV Convenio único, el que agrupa unitariamente las aptitudes profesionales, las titulaciones y el
      contenido general de la prestación laboral que se corresponde con ellas; los grupos M3, M2, M1, E2, E1 y E0 se
      establecen según la titulación exigida para el ingreso (arts. 7.3 y 8.1 Convenio único).
- id: g-familia-profesional
  es: familia profesional
  origin: m04-l08
  definition:
    es: >-
      En el IV Convenio único, la que agrupa el conjunto de titulaciones, cualificaciones, profesiones, oficios y
      ocupaciones atendiendo a criterios de afinidad de la competencia profesional (art. 7.4 Convenio único).
- id: g-despido-disciplinario
  es: despido disciplinario
  origin: m04-l08
  definition:
    es: >-
      Sanción del personal laboral que solo puede imponerse por faltas muy graves y comporta la inhabilitación para
      ser titular de un nuevo contrato de trabajo con funciones similares a las que desempeñaba (art. 96.1.b) TREBEP).
- id: g-incapacidad-temporal
  es: incapacidad temporal
  origin: m04-l09
  link_except:
  - m04-l05
  - m04-l07
  definition:
    es: >-
      En el Régimen General, situación del trabajador impedido para el trabajo por enfermedad común o profesional o
      por accidente, sea o no de trabajo, mientras recibe asistencia sanitaria de la Seguridad Social, con una
      duración máxima de trescientos sesenta y cinco días, prorrogables por otros ciento ochenta cuando se presuma que
      durante ellos puede el trabajador ser dado de alta médica por curación; también los períodos de observación por
      enfermedad profesional en los que se prescriba la baja en el trabajo, con una duración máxima de ciento
      ochenta días, prorrogables por otros ciento ochenta cuando se estime necesario para el estudio y diagnóstico de
      la enfermedad (art. 169.1 LGSS).
- id: g-regimen-general-de-la-seguridad-social
  es: Régimen General de la Seguridad Social
  origin: m04-l09
  definition:
    es: >-
      Régimen de la Seguridad Social en el que están obligatoriamente incluidos los trabajadores por cuenta ajena y
      asimilados, salvo que por razón de su actividad deban quedar comprendidos en algún régimen especial (art. 136.1
      LGSS).
- id: g-presupuestos-generales-del-estado
  es: Presupuestos Generales del Estado
  origin: m05-l01
  definition:
    es: >-
      Expresión cifrada, conjunta y sistemática de los derechos y obligaciones a liquidar durante el ejercicio por
      cada uno de los órganos y entidades que forman parte del sector público estatal (art. 32 LGP).
- id: g-estabilidad-presupuestaria
  es: estabilidad presupuestaria
  origin: m05-l01
  definition:
    es: >-
      Para las Administraciones Públicas, la situación de equilibrio o superávit estructural; para los sujetos del
      artículo 2.2 de la LO 2/2012, la posición de equilibrio financiero (art. 3.2 y 3.3 LO 2/2012).
- id: g-escenarios-presupuestarios-plurianuales
  es: escenarios presupuestarios plurianuales
  origin: m05-l01
  definition:
    es: >-
      Programación de la actividad del sector público estatal con presupuesto limitativo en la que se enmarcan
      anualmente los Presupuestos Generales del Estado; determinan los límites, referidos a los tres ejercicios
      siguientes, que la acción de gobierno debe respetar cuando sus decisiones tengan incidencia presupuestaria
      (art. 28.1 LGP).
- id: g-ejercicio-presupuestario
  es: ejercicio presupuestario
  origin: m05-l01
  match:
    es:
    - ejercicio presupuestario
    - ejercicios presupuestarios
  definition:
    es: >-
      Coincide con el año natural (art. 34.1 LGP).
- id: g-programa-de-gasto
  es: programa de gasto
  origin: m05-l01
  match:
    es:
    - programa de gasto
    - programas de gasto
  definition:
    es: >-
      Conjunto de créditos que, para el logro de los objetivos anuales que el mismo establezca, se ponen a
      disposición del gestor responsable de su ejecución (art. 35.4 LGP).
- id: g-credito-presupuestario
  es: crédito presupuestario
  origin: m05-l01
  match:
    es:
    - crédito presupuestario
    - créditos presupuestarios
  definition:
    es: >-
      Cada una de las asignaciones individualizadas de gasto que figuran en los presupuestos de los órganos y
      entidades del artículo 33.1.a) de la LGP, puestas a disposición de los centros gestores para la cobertura de
      las necesidades para las que hayan sido aprobados (art. 35.1 LGP).
- id: g-credito-extraordinario
  es: crédito extraordinario
  origin: m05-l02
  match:
    es:
    - crédito extraordinario
    - créditos extraordinarios
  definition:
    es: >-
      Modificación que se tramita, junto con el suplemento de crédito, cuando un gasto que no puede demorarse hasta el
      ejercicio siguiente no tiene crédito adecuado, o el consignado es insuficiente y no ampliable, y su dotación no
      es posible con las demás modificaciones (art. 55.1 LGP).
- id: g-suplemento-de-credito
  es: suplemento de crédito
  origin: m05-l02
  match:
    es:
    - suplemento de crédito
    - suplementos de crédito
  definition:
    es: >-
      Modificación que se tramita, junto con el crédito extraordinario, cuando un gasto que no puede demorarse hasta el
      ejercicio siguiente no tiene crédito adecuado, o el consignado es insuficiente y no ampliable, y su dotación no
      es posible con las demás modificaciones (art. 55.1 LGP).
- id: g-generacion-de-credito
  es: generación de crédito
  origin: m05-l02
  match:
    es:
    - generación de crédito
    - generaciones de crédito
  definition:
    es: >-
      Modificación que incrementa los créditos como consecuencia de la realización de determinados ingresos no
      previstos o superiores a los contemplados en el presupuesto inicial (art. 53.1 LGP).
- id: g-transferencia-de-credito
  es: transferencia de crédito
  origin: m05-l02
  match:
    es:
    - transferencia de crédito
    - transferencias de crédito
  definition:
    es: >-
      Traspaso de dotaciones entre créditos, incluso con creación de créditos nuevos, con las restricciones del
      artículo 52 LGP (art. 52.1 LGP).
- id: g-anticipo-de-tesoreria
  es: anticipo de Tesorería
  origin: m05-l02
  match:
    es:
    - anticipo de Tesorería
    - anticipos de Tesorería
  definition:
    es: >-
      Anticipo que el Gobierno puede conceder con carácter excepcional para gastos inaplazables, con el límite máximo
      en cada ejercicio del uno por ciento de los créditos autorizados al Estado por la Ley de Presupuestos, cuando un
      crédito extraordinario o suplemento en tramitación tiene dictamen favorable del Consejo de Estado o lo exige una
      ley promulgada (art. 60.1 LGP).
- id: g-fondo-de-contingencia
  es: Fondo de Contingencia
  origin: m05-l02
  definition:
    es: >-
      Sección del presupuesto del Estado, del dos por ciento del gasto para operaciones no financieras con las
      exclusiones de la ley, para necesidades inaplazables y no discrecionales sin dotación adecuada; únicamente
      financia, cuando proceda y salvo en los casos del artículo 59 LGP, ampliaciones, créditos extraordinarios y
      suplementos e incorporaciones (art. 50.1 LGP).
- id: g-compromiso-de-gasto-plurianual
  es: compromiso de gasto plurianual
  origin: m05-l02
  match:
    es:
    - compromiso de gasto plurianual
    - compromisos de gasto plurianuales
  definition:
    es: >-
      Compromiso de gasto que ha de extenderse a ejercicios posteriores a aquel en que se autoriza; exige que la
      ejecución se inicie en el propio ejercicio y que no se superen los límites y anualidades del artículo 47.2 LGP
      (art. 47.1 LGP).
- id: g-aprobacion-del-gasto
  es: aprobación del gasto
  origin: m05-l03
  definition:
    es: >-
      Acto mediante el cual se autoriza la realización de un gasto determinado por una cuantía cierta o aproximada,
      reservando a tal fin la totalidad o parte de un crédito presupuestario; inicia el procedimiento de ejecución del
      gasto sin relaciones con terceros (art. 73.2 LGP).
- id: g-compromiso-de-gasto
  es: compromiso de gasto
  origin: m05-l03
  match:
    es:
    - compromiso de gasto
    - compromisos de gasto
  definition:
    es: >-
      Acto mediante el cual se acuerda, tras los trámites legalmente establecidos, la realización de gastos
      previamente aprobados por un importe determinado o determinable; vincula a la Hacienda Pública frente a
      terceros (art. 73.3 LGP).
- id: g-reconocimiento-de-la-obligacion
  es: reconocimiento de la obligación
  origin: m05-l03
  definition:
    es: >-
      Acto mediante el que se declara la existencia de un crédito exigible contra la Hacienda Pública estatal o la
      Seguridad Social, derivado de un gasto aprobado y comprometido, y que comporta la propuesta de pago (art. 73.4
      LGP).
- id: g-anticipo-de-caja-fija
  es: anticipo de caja fija
  origin: m05-l05
  match:
    es:
    - anticipo de caja fija
    - anticipos de caja fija
  definition:
    es: >-
      Provisión de fondos de carácter extrapresupuestario y permanente a pagadurías, cajas y habilitaciones para la
      atención inmediata, y posterior aplicación al capítulo de gastos corrientes en bienes y servicios del
      presupuesto del año, de gastos periódicos o repetitivos (art. 78.1 LGP).
- id: g-pago-a-justificar
  es: pago a justificar
  origin: m05-l05
  match:
    es:
    - pago a justificar
    - pagos a justificar
  definition:
    es: >-
      Libramiento de fondos que se tramita cuando, excepcionalmente, no puede aportarse la documentación
      justificativa de las obligaciones en el momento del artículo 73.4 LGP, cuando los servicios y prestaciones
      tienen lugar en el extranjero, o para gastos en localidad donde no exista dependencia del ministerio,
      organismo, entidad gestora o servicio común (art. 79.1–2 LGP).
- id: g-funcion-interventora
  es: función interventora
  origin: m05-l03
  definition:
    es: >-
      Control, antes de que sean aprobados, de los actos del sector público estatal que den lugar al reconocimiento
      de derechos o a la realización de gastos, de los ingresos y pagos que de ellos se deriven y de la inversión o
      aplicación de sus fondos públicos (art. 148 LGP).
- id: g-control-financiero-permanente
  es: control financiero permanente
  origin: m05-l03
  definition:
    es: >-
      Verificación continua, a través de la intervención delegada, de la situación y el funcionamiento
      económico-financiero de las entidades del sector público estatal (art. 157 LGP).
- id: g-auditoria-publica
  es: auditoría pública
  origin: m05-l03
  definition:
    es: >-
      Verificación, realizada con posterioridad y de forma sistemática, de la actividad económico-financiera del
      sector público estatal, mediante los procedimientos de revisión selectivos de las normas de auditoría (art. 162
      LGP).
- id: g-reparo
  es: reparo
  origin: m05-l03
  definition:
    es: >-
      Desacuerdo que la Intervención formula por escrito, con cita de los preceptos legales, con el contenido o el
      procedimiento de los actos que fiscaliza; suspende la tramitación del expediente hasta que se solventa (art.
      154.1 LGP).
- id: g-tribunal-de-cuentas
  es: Tribunal de Cuentas
  origin: m05-l03
  definition:
    es: >-
      Supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado y del sector público; depende
      directamente de las Cortes Generales (art. 136.1 CE).
- id: g-clasificacion-economica
  es: clasificación económica
  origin: m05-l02
  definition:
    es: >-
      Clasificación de los créditos de los estados de gastos que los agrupa por capítulos, separando las operaciones
      corrientes, las de capital, las financieras y el Fondo de Contingencia; los capítulos se desglosan en artículos,
      estos en conceptos y los conceptos pueden dividirse en subconceptos (art. 40.1.c LGP).
- id: g-gastos-corrientes-en-bienes-y-servicios
  es: gastos corrientes en bienes y servicios
  origin: m05-l05
  definition:
    es: >-
      Capítulo 2 del presupuesto de gastos: recursos para los gastos corrientes en bienes y servicios necesarios para
      las actividades del Estado y sus organismos que no originen un aumento de capital o del patrimonio público
      (anexo IV, capítulo 2, Resolución de 20-01-2014).
- id: g-inversiones-reales
  es: inversiones reales
  origin: m05-l05
  definition:
    es: >-
      Capítulo 6 del presupuesto de gastos: gastos que realizan directamente el Estado y sus organismos para crear o
      adquirir bienes de capital, adquirir bienes inventariables necesarios para el funcionamiento operativo de los
      servicios y gastos inmateriales de carácter amortizable (anexo IV, capítulo 6, Resolución de 20-01-2014).
- id: g-transferencias-corrientes
  es: transferencias corrientes
  origin: m05-l05
  definition:
    es: >-
      Capítulo 4 del presupuesto de gastos: pagos, condicionados o no, sin contrapartida directa de los agentes
      receptores, que estos destinan a financiar gastos de naturaleza corriente (anexo IV, capítulo 4, Resolución de
      20-01-2014).
- id: g-transferencias-de-capital
  es: transferencias de capital
  origin: m05-l05
  definition:
    es: >-
      Capítulo 7 del presupuesto de gastos: pagos, condicionados o no, sin contrapartida directa de los agentes
      receptores, que estos destinan a financiar operaciones de capital (anexo IV, capítulo 7, Resolución de
      20-01-2014).
- id: g-trienio
  es: trienio
  origin: m05-l04
  match:
    es:
    - trienio
    - trienios
  definition:
    es: >-
      Retribución básica que consiste en una cantidad igual para cada Subgrupo, o Grupo si no tiene Subgrupo, por
      cada tres años de servicio (art. 23.b) TREBEP).
- id: g-complemento-de-destino
  es: complemento de destino
  origin: m05-l04
  match:
    es:
    - complemento de destino
    - complementos de destino
  definition:
    es: >-
      Retribución complementaria correspondiente al nivel del puesto que se desempeñe (art. 23.3.a) Ley 30/1984).
- id: g-complemento-especifico
  es: complemento específico
  origin: m05-l04
  match:
    es:
    - complemento específico
    - complementos específicos
  definition:
    es: >-
      Retribución complementaria destinada a retribuir las condiciones particulares de algunos puestos en atención a
      su especial dificultad técnica, dedicación, responsabilidad, incompatibilidad, peligrosidad o penosidad. En
      ningún caso puede asignarse más de uno a cada puesto (art. 23.3.b) Ley 30/1984).
- id: g-complemento-de-productividad
  es: complemento de productividad
  origin: m05-l04
  match:
    es:
    - complemento de productividad
    - complementos de productividad
  definition:
    es: >-
      Retribución complementaria destinada a retribuir el especial rendimiento, la actividad extraordinaria y el
      interés o iniciativa con que el funcionario desempeñe su trabajo (art. 23.3.c) Ley 30/1984).
- id: g-gratificacion-por-servicios-extraordinarios
  es: gratificación por servicios extraordinarios
  origin: m05-l04
  match:
    es:
    - gratificación por servicios extraordinarios
    - gratificaciones por servicios extraordinarios
  definition:
    es: >-
      Retribución complementaria por servicios extraordinarios fuera de la jornada normal, que en ningún caso puede
      ser fija en su cuantía y periódica en su devengo (art. 23.3.d) Ley 30/1984).
- id: g-residencia-oficial
  es: residencia oficial
  origin: m05-l04
  match:
    es:
    - residencia oficial
    - residencias oficiales
  definition:
    es: >-
      Término municipal correspondiente a la oficina o dependencia en que se desarrollan las actividades del puesto
      de trabajo habitual, salvo autorización expresa para residir en otro que conste en la orden de comisión (art.
      3.1 RD 462/2002).
- id: g-comision-de-servicio-con-derecho-a-indemnizacion
  es: comisión de servicio con derecho a indemnización
  origin: m05-l04
  match:
    es:
    - comisión de servicio con derecho a indemnización
    - comisiones de servicio con derecho a indemnización
  definition:
    es: >-
      Cometido especial que circunstancialmente se ordena al personal y que debe desempeñar fuera del término
      municipal de su residencia oficial (art. 3.1 RD 462/2002).
- id: g-dieta
  es: dieta
  origin: m05-l04
  match:
    es:
    - dieta
    - dietas
  definition:
    es: >-
      Cantidad que se devenga diariamente para satisfacer los gastos que origina la estancia fuera de la residencia
      oficial en los casos previstos en el artículo 5 (art. 9.1 RD 462/2002).
- id: g-plan-estrategico-de-subvenciones
  es: plan estratégico de subvenciones
  origin: m05-l06
  match:
    es:
    - plan estratégico de subvenciones
    - planes estratégicos de subvenciones
  definition:
    es: >-
      Plan en el que los órganos de las Administraciones públicas o cualesquiera entes que propongan el
      establecimiento de subvenciones concretan, con carácter previo, los objetivos y efectos que se pretenden, el plazo
      necesario para su consecución, los costes previsibles y sus fuentes de financiación (art. 8.1 LGS).
- id: g-pago-anticipado
  es: pago anticipado
  origin: m05-l06
  match:
    es:
    - pago anticipado
    - pagos anticipados
  definition:
    es: >-
      Entrega de fondos de una subvención con carácter previo a la justificación, como financiación necesaria para
      poder llevar a cabo las actuaciones inherentes a la subvención. Debe preverse expresamente en la normativa
      reguladora de la subvención (art. 34.4 LGS).
- id: g-malware
  es: malware
  origin: m06-l01
  match:
    es:
    - malware
    - software malicioso
  definition:
    es: >-
      Software que tiene como objetivo dañar o infiltrarse sin el consentimiento de su propietario en un sistema de
      información; incluye virus, gusanos, troyanos, backdoors y spyware (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-cortafuegos
  es: cortafuegos
  origin: m06-l01
  match:
    es:
    - cortafuegos
    - firewall
  definition:
    es: >-
      Sistema de seguridad, de software o de hardware, situado en los puntos limítrofes de una red, que permite y limita
      el flujo de tráfico sobre la base de un conjunto de normas (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-phishing
  es: phishing
  origin: m06-l01
  definition:
    es: >-
      Técnica o tipo de ataque en el que alguien suplanta a una entidad o servicio mediante un correo electrónico o un
      mensaje instantáneo para conseguir las credenciales o la información de la tarjeta de crédito de un usuario
      (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-copia-de-seguridad
  es: copia de seguridad
  origin: m06-l01
  match:
    es:
    - copia de seguridad
    - copias de seguridad
  definition:
    es: >-
      Proceso mediante el cual se duplica la información existente de un soporte a otro para poder recuperar los datos
      en caso de fallo del primer soporte (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-doble-factor-de-autenticacion
  es: doble factor de autenticación
  origin: m06-l01
  definition:
    es: >-
      Esquema de autenticación básica al que se añade otro factor, como un código enviado a un móvil, la huella dactilar
      o un sistema OTP (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-saas
  es: SaaS
  origin: m06-l01
  definition:
    es: >-
      Software como servicio: modelo de distribución en el que el software y los datos que maneja se alojan en
      servidores de un tercero y el cliente accede a ellos vía Internet (fuente: incibe-glosario-ciberseguridad.pdf).
- id: g-ntfs
  es: NTFS
  origin: m06-l01
  definition:
    es: >-
      Sistema de archivos predeterminado de los sistemas operativos modernos basados en Windows, con descriptores de
      seguridad, cifrado y cuotas de disco (fuente: ms-win-ntfs.html).
- id: g-barra-de-tareas
  es: barra de tareas
  origin: m06-l02
  match:
    es:
    - barra de tareas
    - barras de tareas
  definition:
    es: >-
      Parte de Windows que sirve para iniciar aplicaciones, cambiar entre ventanas abiertas y acceder a características
      del sistema como las notificaciones, la búsqueda y el menú Inicio (fuente: ms-win-barra-tareas.html).
- id: g-menu-inicio
  es: menú Inicio
  origin: m06-l02
  match:
    es:
    - menú Inicio
    - menú de Inicio
  definition:
    es: >-
      Menú de Windows que da acceso rápido a las aplicaciones, la configuración y los archivos; permite anclar
      aplicaciones, carpetas y sitios web (fuente: ms-win-menu-inicio.html).
- id: g-acceso-directo
  es: acceso directo
  origin: m06-l02
  link_except:
