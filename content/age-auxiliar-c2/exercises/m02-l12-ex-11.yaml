# anchor: fuente-ms-edge-extensiones-html
- id: m02-l12-q258
  prompt:
    es: "En Microsoft Edge en Windows 11, si no se ve el botón Extensiones a la derecha de la barra de direcciones, ¿qué se selecciona para llegar a ellas?"
  options:
  - id: a
    text:
      es: "Descargas › Extensiones"
  - id: b
    text:
      es: "InPrivate › Extensiones"
  - id: c
    text:
      es: "Favoritos › Extensiones del explorador"
  - id: d
    correct: true
    text:
      es: "Configuración y más › Extensiones"
  explanation:
    es: "La página indica seleccionar Configuración y más › Extensiones cuando el botón no aparece junto a la barra de direcciones. «Favoritos › Extensiones del explorador»: Favoritos abre la lista de favoritos, según la página de atajos; el acceso a las extensiones es Configuración y más. «Descargas › Extensiones»: Descargas abre la lista de descargas, con Ctrl+J; no da acceso a las extensiones. «InPrivate › Extensiones»: InPrivate es un tipo de ventana que se abre desde Configuración y más, no un menú con extensiones."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m02-l12-q259
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿qué botón se selecciona primero en la página de una extensión de Chrome Web Store para agregarla?"
  options:
  - id: a
    text:
      es: "Administrar extensiones"
  - id: b
    text:
      es: "Notificar abuso"
  - id: c
    correct: true
    text:
      es: "Obtener extensión, o Obtener en la página"
  - id: d
    text:
      es: "Agregar una reseña"
  explanation:
    es: "En Chrome Web Store se selecciona el botón Obtener extensión de la pancarta superior o el botón Obtener de la página. «Agregar una reseña» sirve para dejar una clasificación o un comentario de una extensión en el sitio de complementos de Edge. «Administrar extensiones» abre la lista de extensiones para desactivarlas. «Notificar abuso» sirve para informar de una extensión con malware o que infringe las directivas, en el sitio de complementos de Edge."
  citation: "fuente: `ms-edge-extensiones.html`; «Agregar una extensión a Microsoft Edge desde Chrome Web Store»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m02-l12-q260
  prompt:
    es: "En Microsoft Edge en Windows 11, ¿cuál de los siguientes elementos puede aparecer al agregar una extensión desde Chrome Web Store si el usuario nunca ha permitido las extensiones de otros almacenes?"
  options:
  - id: a
    correct: true
    text:
      es: "Un cuadro de diálogo para permitirlas, en el que se selecciona Permitir"
  - id: b
    text:
      es: "Un aviso que bloquea la extensión hasta que se notifique abuso"
  - id: c
    text:
      es: "Un formulario que hay que rellenar y enviar al sitio de complementos de Edge"
  - id: d
    text:
      es: "Una página de reseña en la que se selecciona Agregar una reseña"
  explanation:
    es: "Si no se han permitido las extensiones de otros almacenes, puede mostrarse un cuadro de diálogo en el que se selecciona Permitir. «Un aviso que bloquea la extensión hasta que se notifique abuso»: Notificar abuso es otra función, para informar en el sitio de complementos de una extensión que infringe las directivas, y no tiene que ver con permitir almacenes. «Un formulario que hay que rellenar y enviar al sitio de complementos de Edge»: el formulario es el de notificar abuso, que se rellena y se envía con Enviar. «Una página de reseña en la que se selecciona Agregar una reseña»: Agregar una reseña sirve para dejar una clasificación o comentario, no para permitir almacenes."
  citation: "fuente: `ms-edge-extensiones.html`; «Agregar una extensión a Microsoft Edge desde Chrome Web Store»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q261
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, ¿qué hace la tecla Tab cuando el autocompletado ha resaltado una opción del menú desplegable?"
  options:
  - id: a
    correct: true
    text:
      es: "Selecciona la opción resaltada, por ejemplo document"
  - id: b
    text:
      es: "Muestra los comandos que se especificaron anteriormente"
  - id: c
    text:
      es: "Inserta un salto de línea para escribir varias líneas"
  - id: d
    text:
      es: "Ejecuta la expresión y muestra su resultado"
  explanation:
    es: "En el autocompletado se resalta una opción con las teclas de flecha y se pulsa Tab para seleccionarla. «Ejecuta la expresión y muestra su resultado» es lo que hace Entrar. «Muestra los comandos que se especificaron anteriormente» lo hace Flecha arriba, que recupera el historial de comandos. «Inserta un salto de línea para escribir varias líneas» corresponde a Mayús+Entrar."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q262
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, ¿qué combinación de teclas permite escribir una expresión de varias líneas sin ejecutarla?"
  options:
  - id: a
    text:
      es: "Esc"
  - id: b
    text:
      es: "Entrar"
  - id: c
    text:
      es: "Flecha arriba"
  - id: d
    correct: true
    text:
      es: "Mayús+Entrar"
  explanation:
    es: "Para superar la limitación de una línea hay que pulsar Mayús+Entrar en lugar de Entrar. «Entrar» ejecuta el comando de JavaScript y mueve el cursor a la línea siguiente. «Flecha arriba» muestra los comandos que se especificaron antes, y no sirve para escribir varias líneas. «Esc» abre la consola cuando DevTools ya está abierto."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Para evitar la limitación de 1 línea, presione Mayús+Entrar en lugar de Entrar.»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q263
  prompt:
    es: "Con las herramientas de desarrollo de Microsoft Edge ya abiertas, ¿qué tecla abre la consola después de hacer clic en DevTools para darle el foco?"
  options:
  - id: a
    text:
      es: "F9"
  - id: b
    text:
      es: "F12"
  - id: c
    correct: true
    text:
      es: "Esc"
  - id: d
    text:
      es: "F7"
  explanation:
    es: "Tras dar el foco a DevTools con un clic, la tecla Esc abre la consola. «F12» abre las Herramientas de desarrollo, que ya están abiertas. «F9»: entra al Lector inmersivo o sale de él. «F7»: activa o desactiva la exploración mediante el símbolo de intercalación."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Si es necesario, haga clic en DevTools para darle el foco y, a continuación, presione Esc para abrir la consola.»"
  difficulty: 2
  tags:
  - "atajo"
