# anchor: boe-a-1978-31229-art-10
- id: m01-l01-q005
  prompt:
    es: "De acuerdo con el artículo 10.2 de la Constitución Española de 1978, las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con:"
  options:
  - id: a
    correct: true
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España."
  - id: b
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados sobre esas materias firmados por España, aunque no estén ratificados."
  - id: c
    text:
      es: "La Declaración Universal de Derechos Humanos y las leyes orgánicas que desarrollen esos derechos."
  - id: d
    text:
      es: "Los principios rectores de la política social y económica del capítulo tercero."
  explanation:
    es: "El artículo 10.2 remite a «la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España». Exige ratificación, no basta la firma. No remite a las leyes orgánicas de desarrollo ni a los principios rectores del capítulo tercero."
  citation: "art. 10.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q006
  prompt:
    es: "¿Qué materia regula el capítulo quinto del título I de la Constitución Española de 1978, que contiene un único artículo?"
  options:
  - id: a
    text:
      es: "Las garantías de las libertades y derechos fundamentales."
  - id: b
    correct: true
    text:
      es: "La suspensión de los derechos y libertades."
  - id: c
    text:
      es: "Los principios rectores de la política social y económica."
  - id: d
    text:
      es: "Los derechos y deberes de los ciudadanos."
  explanation:
    es: "El capítulo quinto del título I se titula «De la suspensión de los derechos y libertades» y contiene solo el artículo 55. Las garantías son el capítulo cuarto (arts. 53 y 54), los principios rectores el capítulo tercero y los derechos y deberes de los ciudadanos la sección 2.ª del capítulo segundo."
  citation: "art. 55 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-11
- id: m01-l01-q054
  prompt:
    es: "Según el artículo 11.2 de la Constitución Española de 1978, dentro del capítulo primero del título I, De los españoles y los extranjeros, no podrá ser privado de su nacionalidad:"
  options:
  - id: a
    text:
      es: "Ningún español, aunque la haya adquirido por naturalización."
  - id: b
    correct: true
    text:
      es: "Ningún español de origen."
  - id: c
    text:
      es: "Ningún español condenado por delitos contra la seguridad del Estado."
  - id: d
    text:
      es: "Ningún español, salvo que lo disponga una ley orgánica."
  explanation:
    es: "El artículo 11.2 protege a «ningún español de origen». La protección no alcanza a quien adquirió la nacionalidad por otra vía, de modo que la opción que la extiende a los naturalizados es falsa. La regla no distingue por condenas ni admite salvedades por ley orgánica: protege a todo español de origen."
  citation: "art. 11.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-12
- id: m01-l01-q055
  prompt:
    es: "Según la Constitución Española de 1978, que fija la mayoría de edad en el capítulo primero del título I, los españoles son mayores de edad:"
  options:
  - id: a
    text:
      es: "A los dieciséis años, si están emancipados."
  - id: b
    text:
      es: "A los veintiún años, como regla general."
  - id: c
    text:
      es: "A los diecinueve años, cumplido el curso escolar."
  - id: d
    correct: true
    text:
      es: "A los dieciocho años."
  explanation:
    es: "El artículo 12 fija la mayoría de edad a los dieciocho años, sin condiciones. Los dieciséis años con emancipación, los veintiún años como regla general y los diecinueve tras el curso escolar son otras cifras u otros requisitos, y el artículo no hace depender la mayoría de edad de la emancipación ni del curso."
  citation: "art. 12 CE"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q056
  prompt:
    es: "Señale la respuesta correcta sobre los delitos excluidos de la extradición, según el artículo 13.3 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Los delitos políticos, incluidos los actos de terrorismo."
  - id: b
    correct: true
    text:
      es: "Los delitos políticos, sin que se consideren como tales los actos de terrorismo."
  - id: c
    text:
      es: "Los delitos de terrorismo, aunque tengan motivación política."
  - id: d
    text:
      es: "Los delitos cometidos por españoles de origen en el extranjero."
  explanation:
    es: "El artículo 13.3 excluye de la extradición los delitos políticos y precisa que los actos de terrorismo no se consideran como tales. La opción que los incluye entre los delitos políticos invierte la precisión. La que excluye el terrorismo de la extradición convierte en regla la contraria. Los delitos de españoles de origen en el extranjero no definen la exclusión: el artículo la funda en la naturaleza política del delito, no en la nacionalidad de quien lo comete."
  citation: "art. 13.3 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-15
- id: m01-l01-q057
  prompt:
    es: "Señale la respuesta correcta sobre la pena de muerte, según lo que dispone el artículo 15 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Queda abolida sin excepción alguna."
  - id: b
    text:
      es: "Queda abolida, salvo para los delitos de terrorismo que determine una ley orgánica."
  - id: c
    correct: true
    text:
      es: "Queda abolida, salvo lo que dispongan las leyes penales militares para tiempos de guerra."
  - id: d
    text:
      es: "Puede establecerla una ley orgánica para los delitos de mayor gravedad."
  explanation:
    es: "El artículo 15 abole la pena de muerte con una única salvedad: lo que dispongan las leyes penales militares para tiempos de guerra. La opción de la abolición sin excepción olvida esa salvedad. La del terrorismo y la de una ley orgánica para los delitos más graves introducen excepciones que el artículo no contiene."
  citation: "art. 15 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-15
- id: m01-l01-q058
  prompt:
    es: "Según el artículo 15 de la Constitución Española de 1978, que abre las libertades de la sección 1.ª del capítulo segundo, todos tienen derecho a la vida y a la integridad:"
  options:
  - id: a
    correct: true
    text:
      es: "Física y moral."
  - id: b
    text:
      es: "Física y psíquica."
  - id: c
    text:
      es: "Física y patrimonial."
  - id: d
    text:
      es: "Moral y social."
  explanation:
    es: "El artículo 15 reconoce el derecho a la vida y a la integridad física y moral. Los pares «física y psíquica», «física y patrimonial» y «moral y social» sustituyen uno de los dos calificativos por otro que el artículo no usa."
  citation: "art. 15 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-17
- id: m01-l01-q059
  prompt:
    es: "¿Cuál de los siguientes procedimientos prevé el artículo 17.4 de la Constitución Española de 1978 para la inmediata puesta a disposición judicial de toda persona detenida ilegalmente?"
  options:
  - id: a
    correct: true
    text:
      es: "El «habeas corpus»."
  - id: b
    text:
      es: "El «habeas data»."
  - id: c
    text:
      es: "El amparo judicial ordinario."
  - id: d
    text:
      es: "El recurso de súplica ante la autoridad gubernativa."
  explanation:
    es: "El artículo 17.4 nombra el procedimiento de «habeas corpus» para la puesta a disposición judicial inmediata del detenido ilegalmente. El «habeas data» protege los datos personales, no la libertad personal del detenido. El amparo judicial ordinario es el cauce del artículo 53.2 para otros derechos. La súplica ante la autoridad gubernativa no es judicial, y el artículo 17.4 exige la puesta a disposición judicial."
  citation: "art. 17.4 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-17
- id: m01-l01-q060
  prompt:
    es: "Según el artículo 17.4 de la Constitución Española de 1978, ¿qué determinará la ley en relación con la prisión provisional?"
  options:
  - id: a
    text:
      es: "La duración mínima que debe tener en cada caso."
  - id: b
    text:
      es: "Los delitos para los que se acuerda sin resolución judicial."
  - id: c
    correct: true
    text:
      es: "El plazo máximo de su duración."
  - id: d
    text:
      es: "El órgano administrativo que la acuerda."
  explanation:
    es: "El artículo 17.4 remite a la ley la determinación del plazo máximo de duración de la prisión provisional. Un plazo mínimo obligatorio no es un límite a la privación de libertad. Acordarla sin resolución judicial o por un órgano administrativo contradice el sistema de garantías del propio artículo 17, que somete la privación de libertad a la forma y los casos previstos en la ley y a la autoridad judicial."
  citation: "art. 17.4 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-18
- id: m01-l01-q061
  prompt:
    es: "Según el artículo 18.3 de la Constitución Española de 1978, dentro de los derechos al honor y a la intimidad, se garantiza el secreto de las comunicaciones, salvo:"
  options:
  - id: a
    text:
      es: "Consentimiento del titular, resolución judicial o flagrante delito."
  - id: b
    correct: true
    text:
      es: "Una resolución judicial."
  - id: c
    text:
      es: "Autorización del Ministerio Fiscal en casos de urgencia."
  - id: d
    text:
      es: "Orden de la autoridad gubernativa en las investigaciones de terrorismo."
  explanation:
    es: "El artículo 18.3 solo admite una excepción: la resolución judicial. Las excepciones del consentimiento del titular y del flagrante delito pertenecen a la inviolabilidad del domicilio, del artículo 18.2, y no se trasladan a las comunicaciones. El Ministerio Fiscal y la autoridad gubernativa no pueden levantar el secreto sin resolución judicial."
  citation: "art. 18.3 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-20
- id: m01-l01-q062
  prompt:
    es: "¿A qué parte del título I de la Constitución Española de 1978 pertenece el derecho a comunicar o recibir libremente información veraz que reconoce el artículo 20.1.d?"
  options:
  - id: a
    text:
      es: "A la sección 2.ª del capítulo segundo, De los derechos y deberes de los ciudadanos."
  - id: b
    text:
      es: "Al capítulo tercero, De los principios rectores de la política social y económica."
  - id: c
    text:
      es: "Al capítulo primero, De los españoles y los extranjeros."
  - id: d
    correct: true
    text:
      es: "A la sección 1.ª del capítulo segundo, De los derechos fundamentales y de las libertades públicas."
  explanation:
    es: "El artículo 20.1.d está en la sección 1.ª del capítulo segundo, que reúne los derechos fundamentales y las libertades públicas (arts. 15 a 29). La sección 2.ª trata de los derechos y deberes de los ciudadanos, desde la defensa de España hasta la libertad de empresa. El capítulo tercero recoge mandatos a los poderes públicos. El primero regula la nacionalidad y la condición de los extranjeros."
  citation: "art. 20.1.d CE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-20
- id: m01-l01-q063
  prompt:
    es: "¿Qué prohíbe expresamente el artículo 20.2 de la Constitución Española de 1978 respecto del ejercicio de los derechos de expresión e información del apartado 1?"
  options:
  - id: a
    text:
      es: "Que las asociaciones que los ejerzan sean secretas."
  - id: b
    correct: true
    text:
      es: "Restringirlos mediante cualquier tipo de censura previa."
  - id: c
    text:
      es: "Que la Administración civil sancione su ejercicio con privación de libertad."
  - id: d
    text:
      es: "Que se imponga la pena de muerte en tiempos de paz."
  explanation:
    es: "El artículo 20.2 dice que el ejercicio de estos derechos no puede restringirse mediante ningún tipo de censura previa. La prohibición de asociaciones secretas es del artículo 22.5. Que la Administración civil imponga sanciones privativas de libertad lo prohíbe el artículo 25.3. La pena de muerte está abolida por el artículo 15, salvo lo que dispongan las leyes penales militares para tiempos de guerra. Ninguna de las tres es la regla del artículo 20.2."
  citation: "art. 20.2 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q064
  prompt:
    es: "Conforme al artículo 21.1 de la Constitución Española de 1978, se reconoce el derecho de reunión, que se caracteriza por ser:"
  options:
  - id: a
    text:
      es: "Pacífica y con autorización previa."
  - id: b
    text:
      es: "Pública y sin armas, con comunicación previa."
  - id: c
    text:
      es: "Pacífica, siempre que se celebre en lugar cerrado."
  - id: d
    correct: true
    text:
      es: "Pacífica y sin armas."
  explanation:
    es: "El artículo 21.1 reconoce el derecho de reunión pacífica y sin armas. La autorización previa la excluye el propio apartado. La comunicación previa solo se pide en las reuniones en lugares de tránsito público y en las manifestaciones (artículo 21.2). Limitarlo a lugares cerrados es incompatible con ese apartado 2, que regula las reuniones en lugares de tránsito público."
  citation: "art. 21 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q065
  prompt:
    es: "Conforme al artículo 21.2 de la Constitución Española de 1978, en las reuniones en lugares de tránsito público y manifestaciones, ¿ante quién se da la comunicación previa?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante la autoridad."
  - id: b
    text:
      es: "Ante el Ministerio Fiscal."
  - id: c
    text:
      es: "Ante la autoridad judicial competente."
  - id: d
    text:
      es: "Ante el Defensor del Pueblo."
  explanation:
    es: "El artículo 21.2 manda dar comunicación previa a la autoridad, que solo puede prohibirlas por razones fundadas de alteración del orden público, con peligro para personas o bienes. El Ministerio Fiscal y el Defensor del Pueblo son órganos de otro tipo. La autoridad judicial interviene, en su caso, ante una prohibición, pero la comunicación previa se dirige a «la autoridad» sin más."
  citation: "art. 21 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-22
- id: m01-l01-q066
  prompt:
    es: "Según el artículo 22.3 de la Constitución Española de 1978, las asociaciones constituidas al amparo de este artículo deberán inscribirse en un registro a los solos efectos de:"
  options:
  - id: a
    text:
      es: "Obtener su personalidad jurídica."
  - id: b
    text:
      es: "Permitir su control administrativo previo."
  - id: c
    correct: true
    text:
      es: "Dar publicidad a su existencia."
  - id: d
    text:
      es: "Acreditar la legalidad de sus fines."
  explanation:
    es: "El artículo 22.3 exige la inscripción registral «a los solos efectos de publicidad». Por eso el registro no condiciona la personalidad jurídica de la asociación, no abre un control administrativo previo y no sirve para acreditar la legalidad de los fines: la palabra «solos» cierra esas lecturas."
  citation: "art. 22.3–5 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-22
- id: m01-l01-q067
  prompt:
    es: "¿Cuál de los siguientes pares de asociaciones prohíbe expresamente el artículo 22.5 de la Constitución Española de 1978, que regula el derecho de asociación?"
  options:
  - id: a
    text:
      es: "Las secretas y las que persigan fines políticos."
  - id: b
    text:
      es: "Las paramilitares y las de carácter religioso."
  - id: c
    correct: true
    text:
      es: "Las secretas y las de carácter paramilitar."
  - id: d
    text:
      es: "Las secretas y las que no estén inscritas en el registro."
  explanation:
    es: "El artículo 22.5 prohíbe las asociaciones secretas y las de carácter paramilitar. Los fines políticos y el carácter religioso no motivan prohibición alguna en el artículo. La falta de inscripción en el registro tampoco: el registro del apartado 3 es solo de publicidad y no condiciona la existencia de la asociación."
  citation: "art. 22.3–5 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-23
- id: m01-l01-q068
  prompt:
    es: "Señale la respuesta correcta sobre el acceso a las funciones y cargos públicos, según el artículo 23.2 de la Constitución Española de 1978, para los ciudadanos:"
  options:
  - id: a
    correct: true
    text:
      es: "En condiciones de igualdad, con los requisitos que señalen las leyes."
  - id: b
    text:
      es: "En condiciones de igualdad, con los requisitos que fije el Gobierno."
  - id: c
    text:
      es: "Con preferencia para los funcionarios de carrera."
  - id: d
    text:
      es: "En condiciones de reciprocidad, según los tratados."
  explanation:
    es: "El artículo 23.2 reconoce el acceso en condiciones de igualdad, con los requisitos que señalen las leyes: los fija el legislador, no el Gobierno. La preferencia de los funcionarios de carrera contradice la igualdad. La reciprocidad por tratado es la excepción del artículo 13.2 para el sufragio municipal de los extranjeros, no el criterio de acceso a cargos públicos."
  citation: "art. 23.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-25
- id: m01-l01-q069
  prompt:
    es: "Conforme al artículo 25.3 de la Constitución Española de 1978, la Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen:"
  options:
  - id: a
    text:
      es: "Privación de derechos políticos."
  - id: b
    text:
      es: "Una multa superior al daño causado."
  - id: c
    text:
      es: "La suspensión de la actividad profesional."
  - id: d
    correct: true
    text:
      es: "Privación de libertad."
  explanation:
    es: "El artículo 25.3 veda a la Administración civil las sanciones que impliquen privación de libertad, directa o subsidiariamente. La privación de derechos políticos, la multa superior al daño y la suspensión de la actividad profesional son otras clases de sanción, que el apartado no veta."
  citation: "art. 25.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-27
- id: m01-l01-q070
  prompt:
    es: "Conforme al artículo 27.1 de la Constitución Española de 1978, que se ubica entre los derechos fundamentales de la sección 1.ª del capítulo segundo, todos tienen derecho:"
  options:
  - id: a
    text:
      es: "A la educación superior gratuita."
  - id: b
    correct: true
    text:
      es: "A la educación."
  - id: c
    text:
      es: "A la enseñanza obligatoria en el centro que elijan."
  - id: d
    text:
      es: "A la formación profesional de su elección."
  explanation:
    es: "El artículo 27.1 reconoce a todos el derecho a la educación, en términos generales. La gratuidad se predica solo de la enseñanza básica (apartado 4), de modo que la educación superior gratuita no es el contenido del apartado 1. La enseñanza obligatoria en el centro elegido y la formación profesional de su elección concretan un derecho más específico que el que enuncia el apartado 1."
  citation: "art. 27.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-27
- id: m01-l01-q071
  prompt:
    es: "¿Cuál de los siguientes niveles de enseñanza declara la Constitución Española de 1978 obligatorio y gratuito, entre los derechos de la sección 1.ª del capítulo segundo?"
  options:
  - id: a
    text:
      es: "La enseñanza infantil."
  - id: b
    text:
      es: "La enseñanza universitaria en centros públicos."
  - id: c
    text:
      es: "La educación secundaria posobligatoria."
  - id: d
    correct: true
    text:
      es: "La enseñanza básica."
  explanation:
    es: "El artículo 27.4 declara obligatoria y gratuita la enseñanza básica. La infantil, la universitaria y la posobligatoria no reciben esa declaración en el artículo."
  citation: "art. 27.4 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-30
- id: m01-l01-q072
  prompt:
    es: "Conforme al artículo 30.1 de la Constitución Española de 1978, primero de la sección 2.ª del capítulo segundo, los españoles tienen, respecto de la defensa de España:"
  options:
  - id: a
    text:
      es: "El deber de defenderla, pero no el derecho."
  - id: b
    correct: true
    text:
      es: "El derecho y el deber de defenderla."
  - id: c
    text:
      es: "El derecho de defenderla, con carácter voluntario."
  - id: d
    text:
      es: "El deber de defenderla únicamente en tiempo de guerra."
  explanation:
    es: "El artículo 30.1 reconoce a los españoles «el derecho y el deber de defender a España». Quitar el derecho, quitar el deber o limitar el deber al tiempo de guerra recorta esa doble fórmula."
  citation: "art. 30 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-31
- id: m01-l01-q073
  prompt:
    es: "¿Cuál de las siguientes características atribuye el artículo 31.1 de la Constitución Española de 1978, que regula el sostenimiento de los gastos públicos, al sistema tributario justo?"
  options:
  - id: a
    text:
      es: "Que podrá tener alcance confiscatorio en tiempos de crisis."
  - id: b
    text:
      es: "Que tendrá alcance retroactivo cuando favorezca al contribuyente."
  - id: c
    correct: true
    text:
      es: "Que en ningún caso tendrá alcance confiscatorio."
  - id: d
    text:
      es: "Que se basará exclusivamente en el principio de progresividad."
  explanation:
    es: "El artículo 31.1 dice que el sistema tributario justo, inspirado en los principios de igualdad y progresividad, no tendrá en ningún caso alcance confiscatorio. Admitir ese alcance en tiempos de crisis contradice el «en ningún caso». El alcance retroactivo no figura en el artículo. La progresividad es uno de los dos principios que lo inspiran, junto con la igualdad: no se basa solo en ella."
  citation: "art. 31.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-32
- id: m01-l01-q074
  prompt:
    es: "Según el artículo 32.1 de la Constitución Española de 1978, el hombre y la mujer tienen derecho a contraer matrimonio con:"
  options:
  - id: a
    correct: true
    text:
      es: "Plena igualdad jurídica."
  - id: b
    text:
      es: "Plena capacidad de obrar."
  - id: c
    text:
      es: "Plena libertad de régimen económico."
  - id: d
    text:
      es: "Plena equiparación entre las formas civil y religiosa."
  explanation:
    es: "El artículo 32.1 habla de contraer matrimonio «con plena igualdad jurídica». Los demás calificativos, capacidad de obrar, régimen económico y equiparación entre formas de matrimonio, quedan para la ley, que según el apartado 2 regula las formas, la edad y capacidad y los derechos y deberes de los cónyuges."
  citation: "art. 32.1 CE"
  difficulty: 2
  tags:
