m05-l01-q09:
  key:
    anchor: spring-fw-beans-java-basic-concepts#page-title
    sentence: A custom Java call to such a method will not get intercepted by the container and therefore behaves just like a regular method call, creating a new instance every time rather than reusing an existing singleton (or scoped) instance for the given bean.
  wrong:
  - option: The container intercepts it and returns the existing singleton instance
    anchor: spring-fw-beans-java-basic-concepts#page-title
    sentence: In such scenarios, @Bean methods are effectively a general-purpose factory method mechanism without special runtime processing
  - option: The call fails with an exception, because lite mode forbids calls between `@Bean` methods
    anchor: spring-fw-beans-java-basic-concepts#page-title
    sentence: behaves just like a regular method call
  - option: The call returns a CGLIB proxy of the bean, created on demand
    anchor: spring-fw-beans-java-basic-concepts#page-title
    sentence: The positive side-effect here is that no CGLIB subclassing has to be applied at runtime, reducing the overhead and the footprint.
