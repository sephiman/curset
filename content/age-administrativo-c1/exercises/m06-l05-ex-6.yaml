  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-error-na-html
- id: m06-l05-q209
  prompt:
    es: "En Excel 365, la tabla A2:B4 contiene Manzana, Pera y Melocotón con sus precios. ¿Cuál de los siguientes resultados muestra =BUSCARV(\"Plátano\"; A2:B4; 2; FALSO)?"
  options:
  - id: a
    text:
      es: "#¡VALOR!"
  - id: b
    text:
      es: "#¿NOMBRE?"
  - id: c
    correct: true
    text:
      es: "#N/A"
  - id: d
    text:
      es: "#¡REF!"
  explanation:
    es: "Plátano no está en la tabla de búsqueda, por lo que BUSCARV devuelve un error #N/A. #¡VALOR!, #¿NOMBRE? y #¡REF! no son lo que la página da para un valor de búsqueda ausente."
  citation: "fuente: `ms-excel-error-na.html`; «Solución principal»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-error-na-html
- id: m06-l05-q210
  prompt:
    es: "Señale el valor del argumento tipo_de_coincidencia de COINCIDIR en Excel 365 que busca una coincidencia exacta."
  options:
  - id: a
    text:
      es: "1"
  - id: b
    correct: true
    text:
      es: "0"
  - id: c
    text:
      es: "-1"
  - id: d
    text:
      es: "2"
  explanation:
    es: "Para buscar una coincidencia exacta, el argumento tipo_de_coincidencia de COINCIDIR se establece en 0 (cero). Ninguno de los otros valores es el que la página da para la coincidencia exacta."
  citation: "fuente: `ms-excel-error-na.html`; «Usar el método de coincidencia aproximada o el método de coincidencia exacta (VERDADERO/FALSO)»"
