    correct: true
    text:
      es: "La utilización de medios fraudulentos, con multa del 100 al 150 por ciento."
  - id: b
    text:
      es: "Una devolución superior a 6.000 euros, con multa del 100 al 150 por ciento."
  - id: c
    text:
