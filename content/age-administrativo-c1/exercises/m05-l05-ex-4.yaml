# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q077
  prompt:
    es: "De acuerdo con el artículo 7.2 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, las cuentas podrán ser aprobadas por los Órganos centrales cuando:"
  options:
  - id: a
    text:
      es: "El importe de las cuentas supere el límite de 5.000 euros fijado para cada pago individualizado."
  - id: b
    text:
      es: "La Intervención Delegada haga constar defectos o anomalías en el informe sobre el examen de las cuentas."
  - id: c
    correct: true
    text:
      es: "La organización administrativa lo requiera, a efectos de continuar el procedimiento de reposición."
  - id: d
    text:
      es: "El Jefe de la Unidad Administrativa no haya aprobado las cuentas en el plazo de quince días."
  explanation:
    es: "Los Órganos centrales solo aprueban las cuentas en los casos en que la organización administrativa lo requiera, a efectos de continuar el procedimiento; la regla general es la aprobación por los Jefes de las Unidades Administrativas. La cuantía de las cuentas, los defectos que anote la Intervención Delegada y un plazo de quince días no son condiciones del artículo: el límite de 5.000 euros es de cada pago, y los quince días son los de alegaciones tras el informe de control."
  citation: "art. 7.2 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1987-12158-art-12
- id: m05-l05-q078
  prompt:
    es: "Según el artículo 12.3 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», los Jefes de las Unidades Administrativas, para su comprobación y tramitación posterior, remiten las cuentas conformadas a:"
  options:
  - id: a
    correct: true
    text:
      es: "La Unidad Central prevista en el propio Real Decreto."
  - id: b
    text:
      es: "La Intervención Delegada que realiza la intervención de la inversión."
  - id: c
    text:
      es: "La autoridad que dispuso la expedición de las órdenes de pago."
  - id: d
    text:
      es: "El Tribunal de Cuentas, para su examen y enjuiciamiento."
  explanation:
    es: "Tras conformar las cuentas, los Jefes de las Unidades Administrativas las remiten a la Unidad Central, que después las pasa a la Intervención Delegada y recaba su aprobación. La Intervención Delegada solo recibe las cuentas de la Unidad Central, la autoridad que dispuso la expedición las aprueba cuando la Unidad Central lo recaba, y el Tribunal de Cuentas las recibe una vez aprobadas."
  citation: "art. 12.3 RD 640/1987"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q082
  prompt:
    es: "Según el artículo 63 de la Resolución de 20 de enero de 2014 sobre clasificación económica, el concepto 630 recoge los mismos gastos que el concepto 620, siempre que se trate de:"
  options:
  - id: a
    text:
      es: "Bienes cuya duración prevista sea inferior al ejercicio presupuestario."
  - id: b
    text:
      es: "Infraestructuras y bienes destinados al uso general."
  - id: c
    correct: true
    text:
      es: "Sustitución de los bienes existentes por otros análogos."
  - id: d
    text:
      es: "Bienes no susceptibles de inclusión en inventario."
  explanation:
    es: "El concepto 630 incluye los mismos gastos que el 620 cuando los bienes sustituyen a otros existentes por otros análogos; si el bien es nuevo, va al 620. La duración inferior al ejercicio y la no inclusión en inventario son rasgos del capítulo 2, y las infraestructuras de uso general corresponden al artículo 61."
  citation: "anexo IV, art. 63, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q084
  prompt:
    es: "¿Qué debe acompañar a las cuentas de los anticipos de Caja fija que aprueban los Jefes de las Unidades Administrativas a las que las Cajas estén adscritas?"
  options:
  - id: a
    text:
      es: "El informe de la Intervención Delegada sobre el examen de los justificantes presentados por el Cajero."
  - id: b
    correct: true
    text:
      es: "Las facturas y demás documentos originales que justifiquen la aplicación de los fondos, debidamente relacionados."
  - id: c
    text:
      es: "El certificado del Cajero pagador sobre el saldo de la Caja a fin de año y los pagos realizados."
  - id: d
    text:
      es: "La carta de pago demostrativa del reintegro de las cantidades no invertidas por el Cajero."
  explanation:
    es: "Las cuentas se acompañan de las facturas y demás documentos originales que justifiquen la aplicación de los fondos, debidamente relacionados. El informe de la Intervención Delegada es posterior a la aprobación y lo emite el órgano de control tras examinar las cuentas. El certificado del saldo y la carta de pago de reintegro no se mencionan en el artículo."
  citation: "art. 7.2 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q085
  prompt:
    es: "Según el artículo 79.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién puede ampliar excepcionalmente los plazos de rendición de las cuentas de los pagos a justificar?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda y con informe del Tribunal de Cuentas."
  - id: b
    text:
      es: "El Interventor General de la Administración del Estado, a petición del Cajero pagador y del órgano gestor."
  - id: c
    correct: true
    text:
      es: "El Ministro, o en quien delegue, a propuesta del órgano gestor del crédito y con informe de su Intervención."
  - id: d
    text:
      es: "El Jefe de la Unidad Administrativa a la que esté adscrita la Caja, previo informe del Interventor Delegado."
  explanation:
    es: "El artículo atribuye la ampliación excepcional al Ministro o a quien delegue y, en su caso, a los presidentes o directores de los organismos autónomos y entidades gestoras, a propuesta del órgano gestor del crédito y con informe de sus Intervenciones. No la tienen el Consejo de Ministros, el Interventor General ni el Jefe de la Unidad a la que está adscrita la Caja."
  citation: "art. 79.4 LGP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q086
  prompt:
    es: "Según el artículo 79.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, si del calendario de actuaciones de una propuesta de pago a justificar se deriva la existencia de gastos plurianuales, ¿qué se tramita?"
  options:
  - id: a
    text:
      es: "Una propuesta de pago a justificar independiente por cada uno de los ejercicios posteriores que resulten afectados."
  - id: b
    text:
      es: "Una modificación presupuestaria que traslade al ejercicio siguiente el crédito no invertido del libramiento aprobado."
  - id: c
    text:
      es: "Una autorización previa del Consejo de Ministros antes de librar los fondos a justificar al Cajero pagador."
  - id: d
    correct: true
    text:
      es: "Un expediente de gastos que desglose las anualidades correspondientes al ejercicio corriente y a ejercicios posteriores."
  explanation:
    es: "Cuando el calendario revela gastos plurianuales, se tramita un expediente de gastos que desglose las anualidades del ejercicio corriente y de los posteriores. El artículo no exige propuestas separadas por ejercicio, ni una modificación presupuestaria, ni autorización previa del Consejo de Ministros, que solo interviene para atender en el ejercicio siguiente gastos en el extranjero."
  citation: "art. 79.3 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q087
  prompt:
    es: "Un servicio del Estado encarga un estudio técnico, no materializado en un activo, que contribuirá al mantenimiento de su actividad en ejercicios futuros. Según la clasificación económica de los gastos, ese gasto:"
  options:
  - id: a
    text:
      es: "Es inmaterial sin carácter amortizable y se imputa al capítulo 2."
  - id: b
    text:
      es: "Tiene carácter amortizable, pero se imputa al capítulo 2 por no ser inventariable."
  - id: c
    correct: true
    text:
      es: "Tiene carácter amortizable y se imputa al capítulo 6, «Inversiones reales»."
  - id: d
    text:
      es: "Es inmaterial y se imputa al capítulo 7, «Transferencias de capital»."
  explanation:
    es: "El capítulo 6 comprende los gastos de naturaleza inmaterial que tengan carácter amortizable, y un gasto se considera amortizable cuando contribuye al mantenimiento de la actividad del sujeto que lo realiza en ejercicios futuros, como este estudio. La opción que le niega el carácter amortizable contradice esa definición. Que el estudio no sea inventariable no lo lleva al capítulo 2, que solo recibe los gastos en bienes inmateriales que no sean susceptibles de amortización. El capítulo 7 recoge pagos sin contrapartida directa que los receptores destinan a operaciones de capital, y aquí el servicio paga un estudio para sí mismo."
  citation: "anexo IV, capítulo 6, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1987-12158-dd
- id: m05-l05-q088
  prompt:
    es: "Según la disposición derogatoria del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», el Decreto de 14 de noviembre de 1952, derogado por su apartado 4, versaba sobre:"
  options:
  - id: a
    correct: true
    text:
      es: "La situación y disponibilidad de fondos librados «en firme» a través de cuentas corrientes en el Banco de España."
  - id: b
    text:
      es: "La situación y disponibilidad de fondos librados «a justificar» a través de las Cajas pagadoras de los Ministerios."
  - id: c
    text:
      es: "Las consignaciones para material de oficinas de los Servicios Centrales y Provinciales del Estado."
  - id: d
    text:
      es: "Las provisiones de fondos de carácter permanente a las pagadurías, cajas y habilitaciones del Estado."
  explanation:
    es: "El apartado 4 de la disposición derogatoria deroga el Decreto de 14 de noviembre de 1952, «sobre situación y disponibilidad de fondos librados \"en firme\" a través de cuentas corrientes en el Banco de España». Los fondos librados «a justificar» son la materia del Decreto de 20 de febrero de 1942, que deroga el apartado 3. Las consignaciones para material de oficinas son la materia del Decreto de 28 de septiembre de 1935, que deroga el apartado 2. Las provisiones de fondos permanentes a pagadurías, cajas y habilitaciones son los anticipos de caja fija que define hoy el artículo 78.1 de la Ley 47/2003, y la disposición derogatoria no atribuye esa materia al Decreto de 1952."
  citation: "disposición derogatoria.4 RD 640/1987"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-78
- id: m05-l05-q089
  prompt:
    es: "El artículo 78.3 de la Ley 47/2003, de 26 de noviembre, cita a la «Agencia Española de Cooperación Internacional». Con créditos de 2.500.000 euros en gastos corrientes en bienes y servicios, ¿cuál es su máximo de anticipos de caja fija?"
  options:
  - id: a
    text:
      es: "175.000 euros, el 7 por ciento de esos créditos."
  - id: b
    text:
      es: "250.000 euros, el 10 por ciento de esos créditos."
  - id: c
    text:
      es: "300.000 euros, el 12 por ciento de esos créditos."
  - id: d
    correct: true
    text:
      es: "350.000 euros, el 14 por ciento de esos créditos."
  explanation:
    es: "El artículo 78.3 LGP autoriza a la Agencia Española de Cooperación Internacional a exceder el siete por ciento general «hasta un máximo del 14 por ciento del total de los créditos del capítulo destinado a gastos corrientes en bienes y servicios»: el 14 % de 2.500.000 euros son 350.000 euros. El 7 %, 175.000 euros, es el límite general de cada ministerio u organismo autónomo, que la Agencia puede superar. El 10 %, 250.000 euros, es el máximo del tercer párrafo, solo para los créditos del artículo 23 del programa 222A del Ministerio del Interior. El 12 % no es ninguno de los tres porcentajes del apartado, que son 7, 14 y 10."
  citation: "art. 78.3 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-78
- id: m05-l05-q090
  prompt:
    es: "Según el artículo 78.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué informe previo necesitan los ministros y los presidentes o directores de los organismos autónomos para dictar las normas de los anticipos de caja fija?"
  options:
  - id: a
    correct: true
    text:
      es: "El de su Intervención Delegada correspondiente."
  - id: b
    text:
      es: "El de la Intervención General de la Seguridad Social."
  - id: c
    text:
      es: "El de la Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El de la Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "El artículo 78.1 dice que los ministros y los presidentes o directores de los organismos autónomos establecen esas normas «previo informe de su Intervención Delegada en ambos casos». El informe de la Intervención General de la Seguridad Social es el que precede, según el apartado 2, a las normas del Director General de la Tesorería General de la Seguridad Social sobre los fondos de maniobra, que son otra figura. Ni la Intervención General de la Administración del Estado ni la Dirección General del Tesoro y Política Financiera emiten el informe que pide el apartado 1."
  citation: "art. 78.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q091
  prompt:
    es: "Según el artículo 79.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las cuentas justificativas de los pagos a justificar en el extranjero se rinden en un plazo de:"
  options:
  - id: a
    text:
      es: "Tres meses, ampliable excepcionalmente a seis meses."
  - id: b
    text:
      es: "Seis meses, ampliable excepcionalmente a nueve meses."
  - id: c
    correct: true
    text:
      es: "Seis meses, ampliable excepcionalmente a doce meses."
  - id: d
    text:
      es: "Nueve meses, ampliable excepcionalmente a doce meses."
  explanation:
    es: "El artículo 79.4 fija tres meses como regla, salvo los pagos de expropiaciones y los pagos en el extranjero, que pueden rendirse en seis meses; excepcionalmente, el Ministro, o en quien delegue, y en su caso los presidentes o directores que el artículo cita, pueden ampliar esos plazos «a seis y doce meses respectivamente». Los pagos en el extranjero tienen, pues, seis meses ampliables a doce. Tres meses ampliables a seis es la regla general, no la de los pagos en el extranjero. Ni el plazo de nueve meses ni la ampliación a nueve meses figuran en el artículo."
  citation: "art. 79.4 LGP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1987-12158-art-10
- id: m05-l05-q092
  prompt:
    es: "Según el artículo 10.2 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», ¿qué plazo tienen los pagos «a justificar» de créditos del Fondo Social Europeo para rendir las cuentas justificativas?"
  options:
  - id: a
    text:
      es: "Tres meses, prorrogable en un año más cuando sea necesario."
  - id: b
    correct: true
    text:
      es: "Seis meses, prorrogable en un año más cuando sea necesario."
  - id: c
    text:
      es: "Seis meses, prorrogable en seis meses más cuando sea necesario."
  - id: d
    text:
      es: "Un año, prorrogable en seis meses más cuando sea necesario."
  explanation:
    es: "El artículo 10.2 da a los pagos «a justificar» de créditos del Fondo Social Europeo y de expropiaciones un plazo «de seis meses, prorrogable en un año más, cuando ello sea necesario». Tres meses es el plazo general de los Cajeros pagadores del artículo 10.1, que solo puede ampliarse hasta seis meses, no en un año. Una prórroga de seis meses más y un plazo inicial de un año no figuran en el artículo."
  citation: "art. 10.2 RD 640/1987"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q093
  prompt:
    es: "Un ministerio alquila un edificio para instalar en él una oficina de atención al público. Según la clasificación económica de los gastos, ¿a qué artículo se imputa el gasto del alquiler?"
  options:
  - id: a
    text:
      es: "Al artículo 21, «Reparaciones, mantenimiento y conservación», del capítulo 2."
  - id: b
    text:
      es: "Al artículo 22, «Material, suministros y otros», del capítulo 2."
  - id: c
    text:
      es: "Al artículo 62, «Inversión nueva asociada al funcionamiento operativo de los servicios»."
  - id: d
    correct: true
    text:
      es: "Al artículo 20, «Arrendamientos y cánones», del capítulo 2."
  explanation:
    es: "El artículo 20, «Arrendamientos y cánones», incluye entre otros «el arrendamiento de terrenos, edificios y locales»; el alquiler de edificios va a su concepto 202. El artículo 21 recoge el mantenimiento, las reparaciones y la conservación de edificios y otros bienes, no su alquiler. El artículo 22 recoge el material de oficina, los suministros y otros gastos, no los arrendamientos. El artículo 62 recoge la inversión nueva que incrementa el stock de capital público, y alquilar un edificio no crea ni adquiere un bien de capital."
  citation: "anexo IV, art. 20, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2002-12506-apartado-primero
- id: m05-l05-q094
  prompt:
    es: "Según el apartado primero.2 de la Orden PRE/1576/2002, de 19 de junio, por la que se regula el procedimiento para el pago de obligaciones de la Administración General del Estado, se tramitan conforme a ella los pagos derivados de:"
  options:
  - id: a
    text:
      es: "La ejecución del Presupuesto de Gastos, excluidas las devoluciones de ingresos presupuestarios."
  - id: b
    correct: true
    text:
      es: "Cualquier tipo de obligación, presupuestaria o no, incluidas las devoluciones de ingresos presupuestarios."
  - id: c
    text:
      es: "La ejecución del Presupuesto de Gastos y de anticipos de tesorería, excluidas otras operaciones no presupuestarias."
  - id: d
    text:
      es: "Las operaciones presupuestarias de gastos y de ingresos, excluidas las operaciones no presupuestarias."
  explanation:
    es: "El apartado primero.2 somete a la Orden los pagos «derivados de cualquier tipo de obligación», sea por la ejecución del Presupuesto de Gastos, por devoluciones de ingresos presupuestarios, por la ejecución de anticipos de tesorería o por «cualesquiera otras operaciones no presupuestarias». Por eso es incorrecta la opción que excluye las devoluciones de ingresos presupuestarios, y también las dos que excluyen las operaciones no presupuestarias, porque el apartado incluye todas."
  citation: "apartado primero.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2002-12506-apartado-noveno
- id: m05-l05-q095
  prompt:
    es: "Según el apartado noveno.1 de la Orden PRE/1576/2002, de 19 de junio, por la que se regula el procedimiento para el pago de obligaciones de la Administración General del Estado, ¿cuál de las siguientes es una forma de pago?"
  options:
  - id: a
    text:
      es: "La aceptación de letras de cambio libradas por el acreedor contra la cuenta del Tesoro."
  - id: b
    text:
      es: "La entrega al acreedor de valores de Deuda del Estado por el importe de la obligación."
  - id: c
    correct: true
    text:
      es: "Los pagos en formalización a conceptos del Presupuesto de ingresos y a conceptos no presupuestarios."
  - id: d
    text:
      es: "La entrega al acreedor de pagarés emitidos por el órgano gestor del gasto."
  explanation:
    es: "El apartado noveno.1 prevé el pago por transferencia bancaria y, excepcionalmente y solo para personas físicas, por cheque nominativo no a la orden; añade que se pueden cancelar las obligaciones «mediante pagos en formalización a conceptos del Presupuesto de ingresos y a conceptos no presupuestarios». Las letras de cambio, la entrega de valores de Deuda del Estado y los pagarés del órgano gestor no figuran entre esas formas de pago."
  citation: "apartado noveno.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-73
- id: m05-l05-q096
  prompt:
    es: "Según el artículo 73.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el reconocimiento de obligaciones con cargo a la Hacienda Pública estatal se produce previa:"
  options:
  - id: a
    correct: true
    text:
      es: "Acreditación documental ante el órgano competente de la realización de la prestación o el derecho del acreedor."
  - id: b
    text:
      es: "Ordenación del pago por la Dirección General del Tesoro y Política Financiera, a propuesta del órgano gestor."
  - id: c
    text:
      es: "Rendición de la cuenta justificativa de los fondos recibidos por el Cajero pagador ante la Intervención Delegada."
  - id: d
    text:
      es: "Realización del pago material de la obligación al acreedor por el Tesoro Público."
  explanation:
    es: "El artículo 73.4 dice que el reconocimiento de obligaciones con cargo a la Hacienda Pública estatal se produce «previa acreditación documental ante el órgano competente de la realización de la prestación o el derecho del acreedor». La ordenación del pago y el pago material son las fases que el artículo 73.1 enumera después del reconocimiento de la obligación. La cuenta justificativa es la que rinden los perceptores de pagos a justificar sobre los fondos ya recibidos (artículo 79.4), no un requisito previo del reconocimiento."
  citation: "art. 73.4 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-79
- id: m05-l05-q097
  prompt:
    es: "Según el artículo 79 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en cuál de los siguientes casos NO pueden librarse fondos con el carácter de a justificar?"
  options:
  - id: a
    text:
      es: "Para satisfacer gastos a realizar en una localidad donde no exista dependencia del organismo que los paga."
  - id: b
    correct: true
    text:
      es: "Para atender gastos periódicos o repetitivos que se apliquen al capítulo de gastos corrientes en bienes y servicios."
  - id: c
    text:
      es: "Cuando los servicios y prestaciones hayan tenido o vayan a tener lugar fuera del territorio nacional."
  - id: d
    text:
      es: "Cuando, excepcionalmente, la documentación justificativa no pueda aportarse al reconocer la obligación."
  explanation:
    es: "El artículo 79 admite los libramientos a justificar cuando, excepcionalmente, no pueda aportarse la documentación justificativa en el momento del reconocimiento de la obligación, cuando los servicios y prestaciones tengan o vayan a tener lugar en el extranjero y para gastos en una localidad donde no exista dependencia del organismo. Los gastos periódicos o repetitivos del capítulo de gastos corrientes en bienes y servicios son, en cambio, los del anticipo de caja fija del artículo 78.1, no un supuesto de pago a justificar."
  citation: "art. 79.1–2 LGP"
