# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q128
  prompt:
    es: "De acuerdo con el artículo 48.g) del texto refundido de la Ley del Estatuto Básico del Empleado Público, por el nacimiento de un hijo prematuro que deba permanecer hospitalizado tras el parto, el funcionario puede:"
  options:
  - id: a
    text:
      es: "Ausentarse hasta tres horas diarias con retribuciones íntegras, sin poder reducir además su jornada."
  - id: b
    correct: true
    text:
      es: "Ausentarse hasta dos horas diarias con retribuciones íntegras, y reducir su jornada hasta dos horas con disminución proporcional."
  - id: c
    text:
      es: "Ausentarse hasta dos horas diarias con disminución proporcional, y reducir su jornada a la mitad con retribuciones íntegras."
  - id: d
    text:
      es: "Ausentarse hasta una hora diaria con retribuciones íntegras, y reducir su jornada hasta dos horas con disminución proporcional."
  explanation:
    es: "La letra g) da derecho a ausentarse «durante un máximo de dos horas diarias percibiendo las retribuciones íntegras» y, además, a reducir la jornada «hasta un máximo de dos horas, con la disminución proporcional de sus retribuciones». La ausencia no es de una ni de tres horas. La ausencia es la parte retribuida y la reducción la que disminuye el sueldo, no al revés. La reducción sí es compatible con la ausencia."
  citation: "art. 48.g) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q129
  prompt:
    es: "Según el artículo 48.h) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario que por guarda legal tenga el cuidado directo de un menor de doce años puede reducir su jornada:"
  options:
  - id: a
    text:
      es: "Con retribuciones íntegras si reduce un tercio de la jornada o menos."
  - id: b
    text:
      es: "Con retribuciones íntegras durante el primer mes de la reducción."
  - id: c
    correct: true
    text:
      es: "Con la disminución de sus retribuciones que corresponda."
  - id: d
    text:
      es: "Con retribuciones íntegras si reduce al menos la mitad de la jornada."
  explanation:
    es: "La letra h) da la reducción «con la disminución de sus retribuciones que corresponda». Las retribuciones íntegras con reducción de un tercio o menos son la regla de la víctima de violencia de género del artículo 49.d). La reducción de al menos la mitad con retribuciones íntegras es la del hijo con cáncer del artículo 49.e). El mes retribuido es la reducción por enfermedad muy grave de un familiar de primer grado del artículo 48.i)."
  citation: "art. 48.h) TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q130
  prompt:
    es: "Un funcionario tiene la guarda legal de su hija, nacida el sábado 10 de mayo de 2014, sin discapacidad ni enfermedad. ¿Puede pedir en septiembre de 2026 la reducción de jornada por guarda legal de un menor?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la hija cumplió doce años en mayo de 2026."
  - id: b
    text:
      es: "No, porque la reducción solo alcanza al cuidado de menores de ocho años."
  - id: c
    text:
      es: "Sí, porque la reducción alcanza al cuidado de menores de catorce años."
  - id: d
    text:
      es: "Sí, porque la reducción alcanza al cuidado de menores de dieciséis años."
  explanation:
    es: "La letra h) da la reducción por el cuidado directo de un «menor de doce años». La hija nació el 10 de mayo de 2014 y cumplió doce años el domingo 10 de mayo de 2026, así que en septiembre ya no está en el supuesto. El artículo no extiende la edad a catorce ni a dieciséis años. Tampoco la limita a ocho: ocho años es el límite del permiso parental del artículo 49.g)."
  citation: "art. 48.h) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q131
  prompt:
    es: "Conforme al artículo 48.h) del texto refundido de la Ley del Estatuto Básico del Empleado Público, también puede reducir su jornada el funcionario que precise encargarse del cuidado directo de un familiar:"
  options:
  - id: a
    text:
      es: "Hasta el segundo grado que conviva con él, aunque pueda valerse por sí mismo."
  - id: b
    text:
      es: "Hasta el tercer grado que no pueda valerse por sí mismo y no desempeñe actividad retribuida."
  - id: c
    text:
      es: "Hasta el primer grado que no pueda valerse por sí mismo, desempeñe o no actividad retribuida."
  - id: d
    correct: true
    text:
      es: "Hasta el segundo grado que no pueda valerse por sí mismo y no desempeñe actividad retribuida."
  explanation:
    es: "La letra h) se refiere a «un familiar, hasta el segundo grado de consanguinidad o afinidad, que por razones de edad, accidente o enfermedad no pueda valerse por sí mismo y que no desempeñe actividad retribuida». No se limita al primer grado ni llega al tercero. La actividad retribuida del familiar excluye la reducción. La convivencia no sustituye el requisito de no poder valerse por sí mismo."
  citation: "art. 48.h) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q132
  prompt:
    es: "Según el artículo 48.i) del texto refundido de la Ley del Estatuto Básico del Empleado Público, para atender el cuidado de un familiar de primer grado por enfermedad muy grave, el funcionario puede solicitar:"
  options:
  - id: a
    text:
      es: "Una reducción de hasta el cincuenta por ciento de la jornada, no retribuida, por tres meses como máximo."
  - id: b
    correct: true
    text:
      es: "Una reducción de hasta el cincuenta por ciento de la jornada, retribuida, por un mes como máximo."
  - id: c
    text:
      es: "Una reducción de hasta un tercio de la jornada, retribuida, por un mes como máximo."
  - id: d
    text:
      es: "Una reducción de al menos la mitad de la jornada, retribuida, hasta el alta del familiar."
  explanation:
    es: "La letra i) permite «una reducción de hasta el cincuenta por ciento de la jornada laboral, con carácter retribuido» y «por el plazo máximo de un mes». La reducción es retribuida y no dura tres meses. El tope es la mitad, no un tercio. La reducción de al menos la mitad sin plazo fijo se parece a la del hijo con cáncer del artículo 49.e), no a esta."
  citation: "art. 48.i) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q133
  prompt:
    es: "Dos hermanos, ambos funcionarios, quieren reducir su jornada para cuidar a su madre, que padece una enfermedad muy grave. ¿Cómo pueden disfrutar la reducción retribuida que les corresponde?"
  options:
  - id: a
    correct: true
    text:
      es: "Pueden prorratear el tiempo entre ambos, respetando en todo caso el plazo máximo de un mes."
  - id: b
    text:
      es: "Cada hermano tiene derecho a un mes completo de reducción, por ser un derecho individual."
  - id: c
    text:
      es: "Pueden prorratear el tiempo entre ambos, con un plazo máximo de dos meses en total."
  - id: d
    text:
      es: "Solo uno de los dos hermanos puede disfrutar la reducción, el que elijan entre ambos."
  explanation:
    es: "La letra i) dice que, si hay más de un titular por el mismo hecho causante, el tiempo «se podrá prorratear entre los mismos, respetando en todo caso, el plazo máximo de un mes». No hay un mes para cada uno ni dos meses en total. Tampoco se reserva a uno solo: el prorrateo es precisamente el reparto entre ambos."
  citation: "art. 48.i) TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q134
  prompt:
    es: "De los siguientes permisos del artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál tiene una duración fijada en días por cada año?"
  options:
  - id: a
    text:
      es: "El permiso por traslado de domicilio, de un día por traslado."
  - id: b
    text:
      es: "El permiso por lactancia de un hijo menor de doce meses, de una hora."
  - id: c
    correct: true
    text:
      es: "El permiso por asuntos particulares, de seis días."
  - id: d
    text:
      es: "El permiso por deber inexcusable, del tiempo indispensable."
  explanation:
    es: "La letra k) da «por asuntos particulares, seis días al año». La lactancia es una hora diaria, no un número de días al año. El deber inexcusable se concede por el tiempo indispensable. El traslado de domicilio sin cambio de residencia da un día por el traslado, sin referencia al año."
  citation: "art. 48.k) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2026-8287-apartado-9
- id: m04-l05-q135
  prompt:
    es: "Según el apartado 9.7 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, los días de permiso por asuntos particulares se distribuyen:"
  options:
  - id: a
    text:
      es: "A conveniencia del personal, previa autorización de la Subsecretaría del Departamento."
  - id: b
    correct: true
    text:
      es: "A conveniencia del personal, previa autorización de sus superiores y respetando las necesidades del servicio."
  - id: c
    text:
      es: "En las fechas que fije el calendario laboral de cada centro de trabajo."
  - id: d
    text:
      es: "A conveniencia del personal, con una simple comunicación previa a sus superiores, sin necesidad de autorización."
  explanation:
    es: "El apartado 9.7 dice que el personal puede distribuir los días «a su conveniencia, previa autorización de sus superiores y respetando siempre las necesidades del servicio». Una comunicación no basta: hace falta autorización. Las fechas no las fija el calendario laboral. La autorización es de los superiores, no de la Subsecretaría."
  citation: "apartado 9.7 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2026-8287-apartado-9
- id: m04-l05-q136
  prompt:
    es: "Un funcionario de la Administración General del Estado cumple su sexto trienio el martes 15 de septiembre de 2026. Según la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, ¿cuántos días de asuntos particulares tiene en 2026?"
  options:
  - id: a
    text:
      es: "Ocho días: los seis anuales y dos adicionales desde el 15 de septiembre."
  - id: b
    text:
      es: "Siete días: los seis anuales y uno adicional por el sexto trienio."
  - id: c
    text:
      es: "Seis días: los dos adicionales solo corresponden desde el año siguiente."
  - id: d
    correct: true
    text:
      es: "Ocho días: los seis anuales y dos adicionales desde el 16 de septiembre."
  explanation:
    es: "El apartado 9.7 da seis días al año y «dos días adicionales de permiso por asuntos particulares desde el día siguiente al del cumplimiento del sexto trienio». Cumplido el martes 15 de septiembre, los dos días corresponden desde el miércoles 16, en el mismo año. No hay que esperar al año siguiente. El sexto trienio da dos días, no uno. El día del cumplimiento todavía no cuenta."
  citation: "apartado 9.7 Resolución de 14-04-2026"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimotercera
- id: m04-l05-q138
  prompt:
    es: "De acuerdo con la disposición adicional decimotercera del texto refundido de la Ley del Estatuto Básico del Empleado Público, los días adicionales de permiso por asuntos particulares por antigüedad:"
  options:
  - id: a
    text:
      es: "Solo pueden establecerse para el personal laboral, por convenio colectivo."
  - id: b
    text:
      es: "Son un derecho mínimo que el Estatuto reconoce a todo funcionario."
  - id: c
    correct: true
    text:
      es: "Son una posibilidad que cada Administración Pública puede establecer."
  - id: d
    text:
      es: "Solo pueden establecerse mediante una ley de las Cortes Generales."
  explanation:
    es: "La disposición dice que las Administraciones Públicas «podrán establecer» los días adicionales. Es una facultad de cada Administración, no un mínimo que el Estatuto imponga. No exige una ley de las Cortes. Tampoco se limita al personal laboral: habla del permiso por asuntos particulares de los funcionarios."
  citation: "disposición adicional decimotercera TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q139
  prompt:
    es: "Un funcionario registra su pareja de hecho e inicia el lunes 7 de septiembre de 2026 el permiso que le corresponde por ello. ¿Cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El domingo 20 de septiembre de 2026."
  - id: b
    text:
      es: "El martes 22 de septiembre de 2026."
  - id: c
    text:
      es: "El viernes 25 de septiembre de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 21 de septiembre de 2026."
  explanation:
    es: "La letra l) da «quince días» por el registro de pareja de hecho y no dice que sean hábiles. Por eso son naturales e incluyen sábados, domingos y festivos (apartado 14.3 de la Resolución de 14 de abril de 2026). Del lunes 7 al lunes 21 de septiembre hay quince días, contando el primero. El viernes 25 sale de contar quince días hábiles. El martes 22 deja fuera el primer día. El domingo 20 solo da catorce días."
  citation: "art. 48.l) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q140
  prompt:
    es: "Según el artículo 48.l) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el permiso de quince días se concede por:"
  options:
  - id: a
    text:
      es: "Matrimonio, solo cuando se celebre en forma civil ante la autoridad competente."
  - id: b
    correct: true
    text:
      es: "Matrimonio o registro o constitución formalizada por documento público de pareja de hecho."
  - id: c
    text:
      es: "Matrimonio o convivencia acreditada como pareja de hecho durante al menos un año."
  - id: d
    text:
      es: "Matrimonio del funcionario o de un familiar hasta el primer grado de consanguinidad."
  explanation:
    es: "La letra l) da quince días «por matrimonio o registro o constitución formalizada por documento público de pareja de hecho». No distingue la forma civil de las demás. La pareja de hecho tiene que estar registrada o formalizada en documento público: la convivencia no basta. El matrimonio de un familiar no da este permiso."
  citation: "art. 48.l) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2026-8287-apartado-14
- id: m04-l05-q142
  prompt:
    es: "Según el apartado 14.2 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, los permisos cuya duración se fija en días hábiles se computan atendiendo:"
  options:
  - id: a
    text:
      es: "Al horario general de apertura al público de las oficinas de su centro."
  - id: b
    text:
      es: "Al calendario de días inhábiles para los procedimientos administrativos."
  - id: c
    text:
      es: "Al calendario de días hábiles de la localidad donde ocurra el hecho causante."
  - id: d
    correct: true
    text:
      es: "Al régimen de jornada y horario que corresponda al titular del permiso."
  explanation:
    es: "El apartado 14.2 dice que «se atenderá al régimen de jornada y horario que corresponda al titular del permiso». No cuenta el calendario del lugar del hecho causante ni el horario de apertura de las oficinas. El calendario de días inhábiles del procedimiento administrativo tampoco rige para los permisos."
  citation: "apartado 14.2 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q143
  prompt:
    es: "¿Cuál de los siguientes es un permiso de los funcionarios previsto en el artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Dos días por el traslado de domicilio con cambio de localidad de residencia."
  - id: b
    correct: true
    text:
      es: "El tiempo indispensable para los actos preparatorios de la donación de órganos o tejidos."
  - id: c
    text:
      es: "Un día por obras de reforma en el domicilio habitual del funcionario."
  - id: d
    text:
      es: "Un día por la boda de un familiar de segundo grado del funcionario."
  explanation:
    es: "La letra m) da permiso «por el tiempo indispensable para la realización de los actos preparatorios de la donación de órganos o tejidos» dentro de la jornada. El artículo 48 no tiene permiso por obras en el domicilio ni por la boda de un familiar. El traslado de domicilio solo da permiso sin cambio de residencia, y es de un día."
  citation: "art. 48.m) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q144
  prompt:
    es: "De acuerdo con el artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, las diecinueve semanas del permiso por nacimiento de la madre biológica se distribuyen:"
  options:
  - id: a
    correct: true
    text:
      es: "Seis tras el parto, once hasta los doce meses del hijo y dos hasta que cumpla ocho años."
  - id: b
    text:
      es: "Seis tras el parto, once hasta los doce meses del hijo y dos hasta que cumpla seis años."
  - id: c
    text:
      es: "Seis tras el parto, diez hasta los doce meses del hijo y tres hasta que cumpla ocho años."
  - id: d
    text:
      es: "Cuatro tras el parto, trece hasta los doce meses del hijo y dos hasta que cumpla ocho años."
  explanation:
    es: "El artículo 49.a) reparte el permiso en seis semanas ininterrumpidas tras el parto, once hasta que el hijo cumpla doce meses y dos hasta que cumpla ocho años. Las dos últimas semanas no acaban a los seis años. El tramo intermedio es de once semanas, no de diez ni de trece. Las semanas obligatorias son seis, no cuatro."
  citation: "art. 49.a) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "estructura"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q145
  prompt:
    es: "Una funcionaria da a luz el jueves 14 de enero de 2027 y reserva para más adelante las dos semanas del párrafo 3.º del artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público. ¿Hasta cuándo puede disfrutarlas?"
  options:
  - id: a
    text:
      es: "Hasta que la hija cumpla seis años, el viernes 14 de enero de 2033."
  - id: b
    correct: true
    text:
      es: "Hasta que la hija cumpla ocho años, el domingo 14 de enero de 2035."
  - id: c
    text:
      es: "Hasta que la hija cumpla doce meses, el viernes 14 de enero de 2028."
  - id: d
    text:
      es: "Hasta que la hija cumpla doce años, el viernes 14 de enero de 2039."
  explanation:
    es: "El párrafo 3.º del artículo 49.a) permite disfrutar esas dos semanas «hasta que el hijo o la hija cumpla los ocho años». Nacida el 14 de enero de 2027, la hija cumple ocho años el domingo 14 de enero de 2035. Los doce meses son el límite de las once semanas del párrafo 2.º. Seis y doce años no aparecen en el artículo."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q146
  prompt:
    es: "El hijo de una funcionaria, que tiene dos progenitores, nace prematuro y permanece hospitalizado cuarenta días tras el parto. ¿Qué duración tiene el permiso por nacimiento de la madre?"
  options:
  - id: a
    correct: true
    text:
      es: "Diecinueve semanas, ampliadas en cuarenta días."
  - id: b
    text:
      es: "Diecinueve semanas, sin ampliación por la hospitalización."
  - id: c
    text:
      es: "Diecinueve semanas, ampliadas en dos semanas."
  - id: d
    text:
      es: "Diecinueve semanas, ampliadas en trece semanas."
  explanation:
    es: "En el parto prematuro el permiso «se ampliará en tantos días como el neonato se encuentre hospitalizado, con un máximo de trece semanas adicionales». Cuarenta días no llegan a trece semanas, así que se suman los cuarenta días. Las trece semanas son el tope, no una ampliación fija. La hospitalización sí amplía el permiso. Las dos semanas son la ampliación por discapacidad del hijo."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q147
  prompt:
    es: "La hija de una funcionaria, que tiene dos progenitores, nace prematura y permanece hospitalizada ciento diez días tras el parto. ¿Cuánto dura el permiso por nacimiento de la madre?"
  options:
  - id: a
    text:
      es: "Diecinueve semanas más los ciento diez días que dura la hospitalización."
  - id: b
    text:
      es: "Veintiuna semanas: diecinueve más dos por la hospitalización de la hija."
  - id: c
    text:
      es: "Veintinueve semanas: diecinueve más un máximo de diez adicionales."
  - id: d
    correct: true
    text:
      es: "Treinta y dos semanas: diecinueve más el máximo de trece adicionales."
  explanation:
    es: "La hospitalización amplía el permiso en tantos días como dure, «con un máximo de trece semanas adicionales». Ciento diez días superan las trece semanas, que son noventa y un días, así que la ampliación se queda en trece: diecinueve más trece, treinta y dos semanas. No se suman los ciento diez días completos. Las dos semanas son la ampliación por discapacidad. El tope es de trece semanas, no de diez."
  citation: "art. 49.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q149
  prompt:
    es: "Según el artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, en caso de monoparentalidad las treinta y dos semanas del permiso por nacimiento de la madre biológica se distribuyen:"
  options:
  - id: a
    text:
      es: "Seis obligatorias tras el parto, veinticuatro hasta los doce meses y dos hasta los ocho años."
  - id: b
    text:
      es: "Doce obligatorias tras el parto, dieciséis hasta los doce meses y cuatro hasta los ocho años."
  - id: c
    correct: true
    text:
      es: "Seis obligatorias tras el parto, veintidós hasta los doce meses y cuatro hasta los ocho años."
  - id: d
    text:
      es: "Seis obligatorias tras el parto, veintidós hasta los doce meses y cuatro hasta los doce años."
  explanation:
    es: "En la monoparentalidad el artículo 49.a) mantiene las seis semanas obligatorias tras el parto y duplica los otros tramos: «once semanas, veintidós en el caso de monoparentalidad» y «dos semanas, cuatro en el caso de monoparentalidad», estas hasta los ocho años. El último tramo no llega a los doce años. Las semanas obligatorias no se duplican a doce. El reparto de veinticuatro y dos no es el del artículo."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "estructura"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q152
  prompt:
    es: "Según el artículo 49.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, en la adopción las seis semanas obligatorias del permiso se disfrutan inmediatamente después de:"
  options:
  - id: a
    text:
      es: "La llegada efectiva del menor al domicilio familiar."
  - id: b
    text:
      es: "La presentación de la solicitud del permiso por adopción."
  - id: c
    text:
      es: "La declaración de idoneidad de los adoptantes."
  - id: d
    correct: true
    text:
      es: "La resolución judicial por la que se constituye la adopción."
  explanation:
    es: "El artículo 49.b) fija «seis semanas ininterrumpidas inmediatamente posteriores a la resolución judicial por la que se constituye la adopción». La llegada del menor al domicilio y la solicitud del permiso no son el momento que fija el artículo. La declaración de idoneidad es anterior a la adopción y en el artículo 48.e) solo da tiempo para los informes previos."
  citation: "art. 49.b) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q153
  prompt:
    es: "Según el artículo 49.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes derechos tiene, además, quien adopta en el extranjero y necesita desplazarse antes al país de origen del adoptado?"
  options:
  - id: a
    text:
      es: "Un permiso de hasta tres meses, percibiendo solo las retribuciones básicas."
  - id: b
    text:
      es: "Un permiso de hasta dos meses, percibiendo las retribuciones íntegras."
  - id: c
    correct: true
    text:
      es: "Un permiso de hasta dos meses, percibiendo solo las retribuciones básicas."
  - id: d
    text:
      es: "Un permiso de hasta un mes, sin derecho a percibir retribución alguna."
  explanation:
    es: "El artículo 49.b) da «un permiso de hasta dos meses de duración, percibiendo durante este periodo exclusivamente las retribuciones básicas». No se cobran las retribuciones íntegras. No son tres meses ni un mes. Sí hay retribución: la básica."
  citation: "art. 49.b) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q155
  prompt:
    es: "Según el artículo 49.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, las seis primeras semanas del permiso del progenitor diferente de la madre biológica:"
  options:
  - id: a
    text:
      es: "Son voluntarias y pueden disfrutarse a jornada completa o a tiempo parcial."
  - id: b
    text:
      es: "Son obligatorias, pero pueden disfrutarse a tiempo parcial si el servicio lo permite."
  - id: c
    text:
      es: "Son obligatorias y pueden interrumpirse por semanas completas, con preaviso."
  - id: d
    correct: true
    text:
      es: "Son obligatorias, ininterrumpidas y se disfrutan a jornada completa."
  explanation:
    es: "El artículo 49.c) fija «seis semanas ininterrumpidas» que «serán obligatorias y habrán de disfrutarse a jornada completa». No son voluntarias. El tiempo parcial y el disfrute interrumpido con preaviso solo valen para las semanas de los párrafos 2.º y 3.º."
  citation: "art. 49.c) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q156
  prompt:
    es: "La funcionaria víctima de violencia de género o sexual que reduce su jornada para hacer efectiva su protección mantiene sus retribuciones íntegras si la reducción es:"
  options:
  - id: a
    correct: true
    text:
      es: "De un tercio de la jornada o menos."
  - id: b
    text:
      es: "De la mitad de la jornada o menos."
  - id: c
    text:
      es: "De dos tercios de la jornada o menos."
  - id: d
    text:
      es: "De tres cuartos de la jornada o menos."
  explanation:
    es: "El artículo 49.d) dice que la funcionaria «mantendrá sus retribuciones íntegras cuando reduzca su jornada en un tercio o menos». La mitad, los dos tercios y los tres cuartos superan ese límite."
  citation: "art. 49.d) TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q157
  prompt:
    es: "Según el artículo 49.d) del texto refundido de la Ley del Estatuto Básico del Empleado Público, las faltas de asistencia de las funcionarias víctimas de violencia de género o sexual se consideran justificadas:"
  options:
  - id: a
    text:
      es: "Por el tiempo que fije la resolución judicial que acuerde la orden de protección."
  - id: b
    text:
      es: "Por el tiempo y en las condiciones que determine el órgano competente en materia de personal."
  - id: c
    correct: true
    text:
      es: "Por el tiempo y en las condiciones que determinen los servicios sociales de atención o de salud."
  - id: d
    text:
      es: "Por un máximo de quince días al año, previa denuncia ante la autoridad judicial."
  explanation:
    es: "El artículo 49.d) considera justificadas las faltas «por el tiempo y en las condiciones en que así lo determinen los servicios sociales de atención o de salud según proceda». No lo decide el órgano de personal ni una resolución judicial. El artículo no fija un máximo de quince días ni exige denuncia."
  citation: "art. 49.d) TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q158
  prompt:
    es: "Según el artículo 49.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, para cuidar a un hijo menor afectado por cáncer, siempre que ambos progenitores trabajen, el funcionario tiene derecho a una reducción de jornada:"
  options:
  - id: a
    text:
      es: "De hasta la mitad de su duración, percibiendo las retribuciones íntegras."
  - id: b
    correct: true
    text:
      es: "De al menos la mitad de su duración, percibiendo las retribuciones íntegras."
  - id: c
    text:
      es: "De al menos la mitad de su duración, con disminución proporcional de retribuciones."
  - id: d
    text:
      es: "De hasta un tercio de su duración, percibiendo las retribuciones íntegras."
  explanation:
    es: "El artículo 49.e) da «una reducción de la jornada de trabajo de al menos la mitad de la duración de aquélla, percibiendo las retribuciones íntegras». La mitad es el mínimo, no el máximo. Las retribuciones son íntegras, no proporcionales. Un tercio es la cifra del artículo 49.d), no de este permiso."
  citation: "art. 49.e) TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "efecto"
