# anchor: celex-32016r0679-art-4
- id: m02-l04-q030
  prompt:
    es: "¿Quién es el «responsable del tratamiento» según el Reglamento (UE) 2016/679, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales?"
  options:
  - id: a
    text:
      es: "Quien trate datos personales por cuenta de otro que determina los fines y medios."
  - id: b
    correct: true
    text:
      es: "Quien, solo o junto con otros, determine los fines y medios del tratamiento."
  - id: c
    text:
      es: "Quien supervise el cumplimiento de la normativa de protección de datos en la organización."
  - id: d
    text:
      es: "Quien realice materialmente las operaciones de tratamiento, automatizadas o no."
  explanation:
    es: "El artículo 4.7 define al responsable como quien, «solo o junto con otros, determine los fines y medios del tratamiento». Quien trata datos por cuenta del responsable es el encargado (artículo 4.8). Supervisar el cumplimiento es una función del delegado de protección de datos. La definición no atiende a quién realiza materialmente las operaciones."
  citation: "art. 4.7 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-30
- id: m02-l04-q031
  prompt:
    es: "Según el artículo 30.5 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿qué empresas u organizaciones quedan, salvo excepciones, exentas de llevar el registro de las actividades de tratamiento?"
  options:
  - id: a
    text:
      es: "Las que empleen a menos de 500 personas."
  - id: b
    text:
      es: "Las que empleen a menos de 50 personas."
  - id: c
    text:
      es: "Las que empleen a menos de 100 personas."
  - id: d
    correct: true
    text:
      es: "Las que empleen a menos de 250 personas."
  explanation:
    es: "El artículo 30.5 dice que la obligación de llevar el registro no se aplica a la empresa u organización «que emplee a menos de 250 personas», salvo que el tratamiento entrañe riesgo, no sea ocasional o incluya categorías especiales de datos o datos penales. Las cifras de 500, 50 y 100 personas no son las del artículo."
  citation: "art. 30.5 RGPD"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2018-16673-art-31
- id: m02-l04-q032
  prompt:
    es: "Según el artículo 31.2 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, las Administraciones públicas harán público un inventario de sus actividades de tratamiento:"
  options:
  - id: a
    text:
      es: "En el diario oficial correspondiente, con una actualización anual."
  - id: b
    correct: true
    text:
      es: "Accesible por medios electrónicos y en el que constará su base legal."
  - id: c
    text:
      es: "Previa aprobación por la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "En sus oficinas de asistencia en materia de registros, en papel."
  explanation:
    es: "El artículo 31.2 obliga a los sujetos del artículo 77.1, entre ellos las Administraciones públicas, a publicar un inventario «accesible por medios electrónicos» en el que constará la información del artículo 30 del RGPD «y su base legal». La ley no exige publicarlo en un diario oficial ni actualizarlo cada año. No necesita aprobación de la Agencia. El medio es electrónico, no el papel en una oficina."
  citation: "art. 31.2 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-28
- id: m02-l04-q033
  prompt:
    es: "Según el artículo 28.2 del Reglamento (UE) 2016/679, de 27 de abril de 2016, para recurrir a otro encargado, el encargado del tratamiento necesita:"
  options:
  - id: a
    text:
      es: "La autorización previa de la autoridad de control competente."
  - id: b
    text:
      es: "La comunicación previa al delegado de protección de datos del responsable."
  - id: c
    correct: true
    text:
      es: "La autorización previa por escrito, específica o general, del responsable."
  - id: d
    text:
      es: "La autorización previa por escrito y siempre específica del responsable."
  explanation:
    es: "El artículo 28.2 dice que el encargado no recurrirá a otro encargado «sin la autorización previa por escrito, específica o general, del responsable». La autorización la da el responsable, no la autoridad de control. Una comunicación al delegado no basta. La autorización puede ser general, no siempre específica."
  citation: "art. 28.2 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-33
- id: m02-l04-q034
  prompt:
    es: "Un responsable tiene constancia, el lunes 15 de febrero de 2027 a las 10:00 horas, de una violación de la seguridad de los datos que entraña riesgo para los interesados. Según el Reglamento general de protección de datos, ¿hasta cuándo debe notificarla, de ser posible, a la autoridad de control?"
  options:
  - id: a
    text:
      es: "Hasta el jueves 18 de febrero de 2027 a las 24:00 horas."
  - id: b
    text:
      es: "Hasta el viernes 19 de febrero de 2027 a las 10:00 horas."
  - id: c
    correct: true
    text:
      es: "Hasta el jueves 18 de febrero de 2027 a las 10:00 horas."
  - id: d
    text:
      es: "Hasta el lunes 22 de febrero de 2027 a las 10:00 horas."
  explanation:
    es: "El artículo 33.1 pide notificar «sin dilación indebida y, de ser posible, a más tardar 72 horas después de que haya tenido constancia» de la violación. Desde el lunes 15 de febrero a las 10:00, 72 horas llevan al jueves 18 de febrero a las 10:00; los tres días intermedios son laborables, sin fin de semana ni festivo. Las 24:00 del jueves alargan el plazo hasta el final del día, y el artículo cuenta horas desde la constancia. El viernes 19 a las 10:00 son 96 horas. El lunes 22 a las 10:00 es una semana."
  citation: "art. 33.1 RGPD"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: celex-32016r0679-art-33
- id: m02-l04-q035
  prompt:
    es: "Según el Reglamento (UE) 2016/679, de 27 de abril de 2016, el responsable queda dispensado de notificar a la autoridad de control una violación de la seguridad de los datos personales cuando:"
  options:
  - id: a
    text:
      es: "Afecte a menos de cien interesados y no incluya categorías especiales de datos personales."
  - id: b
    correct: true
    text:
      es: "Sea improbable que constituya un riesgo para los derechos y las libertades de las personas físicas."
  - id: c
    text:
      es: "La haya comunicado antes, sin dilación indebida, a todos los interesados cuyos datos se vieron afectados."
  - id: d
    text:
      es: "Se haya producido por causa imputable al encargado y no al responsable del tratamiento."
  explanation:
    es: "El artículo 33.1 obliga a notificar «a menos que sea improbable que dicha violación de la seguridad constituya un riesgo para los derechos y las libertades de las personas físicas». El Reglamento no fija un umbral de cien interesados. La comunicación a los interesados (artículo 34) no sustituye la notificación a la autoridad. Que la causa sea del encargado tampoco exime al responsable."
  citation: "art. 33.1 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: celex-32016r0679-art-34
- id: m02-l04-q036
  prompt:
    es: "Según el artículo 34.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el responsable comunicará al interesado una violación de la seguridad de los datos personales:"
  options:
  - id: a
    text:
      es: "En el plazo de 72 horas desde que haya tenido constancia de ella, cualquiera que sea el riesgo que entrañe."
  - id: b
    text:
      es: "En el plazo de un mes, solo cuando así lo ordene la autoridad de control."
  - id: c
    text:
      es: "En el plazo de diez días, cuando afecte a categorías especiales de datos."
  - id: d
    correct: true
    text:
      es: "Sin dilación indebida, si es probable que entrañe un alto riesgo para sus derechos y libertades."
  explanation:
    es: "El artículo 34.1 dice que, cuando sea probable que la violación «entrañe un alto riesgo para los derechos y libertades de las personas físicas», el responsable la comunicará al interesado «sin dilación indebida». Las 72 horas son el plazo de la notificación a la autoridad de control, y la comunicación al interesado depende del alto riesgo. La comunicación no depende de una orden de la autoridad. El Reglamento no fija diez días ni la liga a las categorías especiales."
  citation: "art. 34.1 RGPD"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: celex-32016r0679-art-36
- id: m02-l04-q037
  prompt:
    es: "¿Cuándo debe el responsable consultar a la autoridad de control antes de proceder al tratamiento, según el Reglamento general de protección de datos?"
  options:
  - id: a
    text:
      es: "Siempre que vaya a tratar categorías especiales de datos personales, aunque no haya realizado una evaluación de impacto."
  - id: b
    text:
      es: "Cuando el delegado de protección de datos discrepe del resultado de la evaluación de impacto realizada."
  - id: c
    correct: true
    text:
      es: "Cuando la evaluación de impacto muestre que el tratamiento entrañaría un alto riesgo si no toma medidas para mitigarlo."
  - id: d
    text:
      es: "Cuando la evaluación de impacto muestre que las medidas ya adoptadas han mitigado el alto riesgo."
  explanation:
    es: "El artículo 36.1 exige la consulta previa cuando la evaluación de impacto «muestre que el tratamiento entrañaría un alto riesgo si el responsable no toma medidas para mitigarlo». No basta tratar categorías especiales de datos. La discrepancia del delegado no es el supuesto. Si las medidas ya han mitigado el riesgo, falta precisamente la condición."
  citation: "art. 36.1 RGPD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-37
- id: m02-l04-q038
  prompt:
    es: "Según el artículo 37.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, se designará un delegado de protección de datos siempre que el tratamiento lo lleve a cabo una autoridad u organismo público:"
  options:
  - id: a
    correct: true
    text:
      es: "Excepto los tribunales que actúen en ejercicio de su función judicial."
  - id: b
    text:
      es: "Excepto las entidades locales de menos de veinte mil habitantes."
  - id: c
    text:
      es: "Siempre que emplee a doscientas cincuenta personas o más."
  - id: d
    text:
      es: "Excepto los organismos públicos que no traten categorías especiales de datos."
  explanation:
    es: "El artículo 37.1.a) exige el delegado cuando el tratamiento lo lleva a cabo una autoridad u organismo público, «excepto los tribunales que actúen en ejercicio de su función judicial». El Reglamento no exceptúa a las entidades locales pequeñas. No pone un mínimo de 250 personas: esa cifra es la del registro de actividades. Tampoco exceptúa a quien no trata categorías especiales."
  citation: "art. 37.1 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-34
- id: m02-l04-q039
  prompt:
    es: "Según el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál de las siguientes entidades debe designar en todo caso un delegado de protección de datos?"
  options:
  - id: a
    text:
      es: "Las federaciones deportivas, aunque no traten datos de menores."
  - id: b
    correct: true
    text:
      es: "Los colegios profesionales y sus consejos generales."
  - id: c
    text:
      es: "Las comunidades de propietarios en régimen de propiedad horizontal."
  - id: d
    text:
      es: "Las asociaciones de consumidores y usuarios."
  explanation:
    es: "El artículo 34.1.a) incluye entre las entidades obligadas «los colegios profesionales y sus consejos generales». Las federaciones deportivas solo están obligadas «cuando traten datos de menores de edad». Las comunidades de propietarios y las asociaciones de consumidores no figuran en la lista."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-34
- id: m02-l04-q040
  prompt:
    es: "Una entidad aseguradora tiene treinta empleados. Según el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿debe designar un delegado de protección de datos?"
  options:
  - id: a
    text:
      es: "Solo si trata a gran escala categorías especiales de datos."
  - id: b
    text:
      es: "No, porque la designación es voluntaria para las entidades privadas."
  - id: c
    correct: true
    text:
      es: "Sí, en todo caso, por ser una entidad aseguradora."
  - id: d
    text:
      es: "Solo si se lo requiere la Agencia Española de Protección de Datos."
  explanation:
    es: "El artículo 34.1.g) obliga a designar delegado «en todo caso» a «las entidades aseguradoras y reaseguradoras», sin atender al número de empleados. La obligación no depende de tratar categorías especiales a gran escala ni de un requerimiento de la Agencia. Para estas entidades la designación no es voluntaria."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-34
- id: m02-l04-q041
  prompt:
    es: "¿En cuál de los siguientes casos exige el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales designar en todo caso un delegado de protección de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un hospital privado legalmente obligado a mantener las historias clínicas de sus pacientes."
  - id: b
    text:
      es: "Una odontóloga obligada a llevar historias clínicas que ejerce a título individual."
  - id: c
    text:
      es: "Una comunidad de propietarios que dispone de un sistema de videovigilancia."
  - id: d
    text:
      es: "Un comercio minorista que conserva los datos de contacto de sus clientes."
  explanation:
    es: "El artículo 34.1.l) incluye «los centros sanitarios legalmente obligados al mantenimiento de las historias clínicas de los pacientes», como un hospital. Exceptúa a «los profesionales de la salud» que, aun obligados a mantener historias clínicas, «ejerzan su actividad a título individual», como la odontóloga. Las comunidades de propietarios y los comercios minoristas no figuran en la lista."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-34
- id: m02-l04-q042
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿en qué plazo se comunican a la autoridad de protección de datos las designaciones, nombramientos y ceses de los delegados de protección de datos?"
  options:
  - id: a
    text:
      es: "En el plazo de un mes."
  - id: b
    text:
      es: "En el plazo de quince días."
  - id: c
    text:
      es: "En el plazo de setenta y dos horas."
  - id: d
    correct: true
    text:
      es: "En el plazo de diez días."
  explanation:
    es: "El artículo 34.3 dice que los responsables y encargados comunicarán «en el plazo de diez días» las designaciones, nombramientos y ceses a la Agencia o, en su caso, a las autoridades autonómicas. Un mes, quince días y setenta y dos horas no son el plazo de esta comunicación."
  citation: "art. 34.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2018-16673-art-36
- id: m02-l04-q043
  prompt:
    es: "Según el artículo 36.2 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, el delegado persona física integrada en la organización solo podrá ser removido o sancionado por desempeñar sus funciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Si incurre en dolo o negligencia grave en su ejercicio."
  - id: b
    text:
      es: "Si incurre en dolo, culpa o negligencia leve en su ejercicio."
  - id: c
    text:
      es: "Previo informe favorable de la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "Si lo acuerda el más alto nivel jerárquico del responsable."
  explanation:
    es: "El artículo 36.2 dice que ese delegado no podrá ser removido ni sancionado por desempeñar sus funciones «salvo que incurriera en dolo o negligencia grave en su ejercicio». La negligencia leve no basta. La ley no prevé un informe de la Agencia. El más alto nivel jerárquico es a quien el delegado rinde cuentas, no una vía para removerlo."
  citation: "art. 36.2 LOPDGDD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-36
- id: m02-l04-q044
  prompt:
    es: "Señale la respuesta correcta sobre el acceso del delegado de protección de datos a los datos personales y procesos de tratamiento, según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales:"
  options:
  - id: a
    text:
      es: "El responsable o el encargado pueden oponerle el deber de confidencialidad del artículo 5 de la ley."
  - id: b
    text:
      es: "El responsable o el encargado pueden oponerle el secreto profesional de sus empleados."
  - id: c
    correct: true
    text:
      es: "El responsable o el encargado no pueden oponerle ningún deber de confidencialidad o secreto."
  - id: d
    text:
      es: "El responsable o el encargado pueden limitarle el acceso a las categorías especiales de datos."
  explanation:
    es: "El artículo 36.3 dice que el delegado tendrá acceso a los datos personales y procesos de tratamiento, «no pudiendo oponer a este acceso el responsable o el encargado del tratamiento la existencia de cualquier deber de confidencialidad o secreto, incluyendo el previsto en el artículo 5». El deber del artículo 5 está incluido expresamente. El secreto profesional de los empleados es un deber de secreto más. La ley no limita el acceso a las categorías especiales."
  citation: "art. 36.3 LOPDGDD"
  difficulty: 2
  tags:
  - "efecto"
# anchor: celex-32016r0679-art-39
- id: m02-l04-q045
  prompt:
    es: "Según el artículo 39.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el delegado de protección de datos actuará como punto de contacto de la autoridad de control para cuestiones relativas al tratamiento:"
  options:
  - id: a
    text:
      es: "Excluida la consulta previa, que corresponde en exclusiva al responsable o al encargado del tratamiento."
  - id: b
    text:
      es: "Incluida la consulta previa, sin poder realizar consultas sobre ningún otro asunto."
  - id: c
    text:
      es: "Solo cuando el responsable le haya delegado expresamente esa función por escrito."
  - id: d
    correct: true
    text:
      es: "Incluida la consulta previa, y realizará consultas, en su caso, sobre cualquier otro asunto."
  explanation:
    es: "El artículo 39.1.e) atribuye al delegado «actuar como punto de contacto de la autoridad de control para cuestiones relativas al tratamiento, incluida la consulta previa […], y realizar consultas, en su caso, sobre cualquier otro asunto». La consulta previa está incluida, no excluida. Puede consultar sobre cualquier otro asunto. Es una función mínima que le da el Reglamento, sin delegación del responsable."
  citation: "art. 39.1 RGPD"
  difficulty: 3
  tags:
  - "competencia"
# anchor: celex-32016r0679-art-39
- id: m02-l04-q046
  prompt:
    es: "¿Cuál de las siguientes es una de las funciones mínimas del delegado de protección de datos según el Reglamento (UE) 2016/679?"
  options:
  - id: a
    text:
      es: "Imponer multas administrativas al responsable."
  - id: b
    correct: true
    text:
      es: "Cooperar con la autoridad de control."
  - id: c
    text:
      es: "Autorizar la contratación de otros encargados."
  - id: d
    text:
      es: "Determinar los fines y medios del tratamiento."
  explanation:
    es: "El artículo 39.1.d) incluye entre las funciones mínimas del delegado «cooperar con la autoridad de control». Imponer multas es un poder de la autoridad de control. Autorizar a otros encargados corresponde al responsable (artículo 28.2). Determinar los fines y medios es lo que define al responsable."
  citation: "art. 39.1 RGPD"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2018-16673-art-37
- id: m02-l04-q047
  prompt:
    es: "Un afectado acude al delegado de protección de datos antes de reclamar ante la Agencia; el delegado recibe la reclamación el lunes 11 de enero de 2027. Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿hasta qué fecha debe comunicarle la decisión?"
  options:
  - id: a
    text:
      es: "Hasta el miércoles 10 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el jueves 11 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el lunes 25 de enero de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el jueves 11 de marzo de 2027."
  explanation:
    es: "El artículo 37.1 da al delegado «el plazo máximo de dos meses a contar desde la recepción de la reclamación». Contado de fecha a fecha desde el lunes 11 de enero de 2027, vence el jueves 11 de marzo de 2027, día laborable sin festivo en el intervalo. El miércoles 10 de marzo resulta de contar el día de la recepción como primer día. El jueves 11 de febrero es un mes, el plazo del artículo 37.2. El lunes 25 de enero son diez días hábiles."
  citation: "art. 37.1 LOPDGDD"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2018-16673-art-37
- id: m02-l04-q048
  prompt:
    es: "Según el artículo 37.2 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿quién puede remitir una reclamación al delegado de protección de datos para que este responda?"
  options:
  - id: a
    text:
      es: "El responsable del tratamiento, antes de resolver sobre la reclamación recibida."
  - id: b
    text:
      es: "El órgano superior jerárquico del responsable del tratamiento."
  - id: c
    correct: true
    text:
      es: "La autoridad de protección de datos ante la que el afectado presentó la reclamación."
  - id: d
    text:
      es: "El juzgado de lo contencioso-administrativo que conozca del recurso interpuesto por el afectado."
  explanation:
    es: "El artículo 37.2 dice que, cuando el afectado reclama ante la Agencia o, en su caso, ante una autoridad autonómica, «aquellas podrán remitir la reclamación al delegado de protección de datos a fin de que este responda en el plazo de un mes». La remisión no la hace el responsable ni su órgano superior. Tampoco un juzgado."
  citation: "art. 37.2 LOPDGDD"
  difficulty: 2
  tags:
  - "órgano"
