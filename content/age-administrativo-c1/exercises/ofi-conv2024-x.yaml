    correct: false
  - id: b
    text:
      es: El principio en virtud del cual las personas con discapacidad deben poder llevar una vida en igualdad de condiciones,
        accediendo a los mismos lugares, ámbitos, bienes y servicios que están a disposición de cualquier otra persona.
    correct: true
  - id: c
    text:
      es: El principio en virtud del cual la sociedad promueve valores compartidos orientados al bien común y a la cohesión
        social, permitiendo que todas las personas con discapacidad tengan las oportunidades y recursos necesarios para participar
        plenamente en la vida política, económica, social, educativa, laboral y cultural y para disfrutar de unas condiciones
        de vida en igualdad con los demás.
    correct: false
  - id: d
