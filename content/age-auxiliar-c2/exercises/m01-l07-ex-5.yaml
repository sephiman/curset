# anchor: boe-a-2013-12887-art-9
- id: m01-l07-q067
  prompt:
    es: "¿Cuál de los siguientes incumplimientos tiene la consideración de infracción grave a efectos disciplinarios, según el artículo 9.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La publicación de la información en formatos no reutilizables y sin metadatos descriptivos."
  - id: b
    text:
      es: "La resolución fuera de plazo de una única solicitud de acceso."
  - id: c
    text:
      es: "La falta de actualización puntual de un dato del organigrama."
  - id: d
    correct: true
    text:
      es: "El incumplimiento reiterado de las obligaciones de publicidad activa."
  explanation:
    es: "El artículo 9.3 considera infracción grave el incumplimiento reiterado de las obligaciones de publicidad activa, a efectos de aplicar a sus responsables el régimen disciplinario. Publicar en formatos no reutilizables es solo una preferencia del artículo 5.4, y una resolución tardía aislada o la falta de actualización de un dato no son un incumplimiento reiterado."
  citation: "art. 9.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2013-12887-art-9
- id: m01-l07-q068
  prompt:
    es: "Conforme al artículo 9.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el incumplimiento reiterado de las obligaciones de publicidad activa se considera infracción grave a los efectos de:"
  options:
  - id: a
    text:
      es: "Imponer una multa coercitiva a la entidad incumplidora."
  - id: b
    text:
      es: "Anular los actos dictados por el órgano responsable."
  - id: c
    correct: true
    text:
      es: "Aplicar a sus responsables el régimen disciplinario de su normativa reguladora."
  - id: d
    text:
      es: "Suspender el funcionamiento del Portal de la Transparencia."
  explanation:
    es: "La consecuencia que fija el artículo 9.3 es aplicar a los responsables el régimen disciplinario previsto en la normativa reguladora correspondiente. La ley no prevé multas coercitivas contra la entidad, ni la anulación de los actos ni la suspensión del Portal."
  citation: "art. 9.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-13
- id: m01-l07-q071
  prompt:
    es: "Según el artículo 13 de la Ley 19/2013, de 9 de diciembre, se entiende por información pública los contenidos o documentos que obren en poder de los sujetos del título I y que:"
  options:
  - id: a
    text:
      es: "Hayan sido publicados previamente en el Portal de la Transparencia o en una sede electrónica."
  - id: b
    text:
      es: "Hayan sido solicitados antes por algún ciudadano."
  - id: c
    correct: true
    text:
      es: "Hayan sido elaborados o adquiridos en el ejercicio de sus funciones."
  - id: d
    text:
      es: "Estén archivados en soporte electrónico."
  explanation:
    es: "Es información pública lo que obra en poder de los sujetos del título I y ha sido elaborado o adquirido en el ejercicio de sus funciones. Que ya esté en el Portal, que alguien la haya pedido antes o que esté en soporte electrónico no son requisitos del concepto."
  citation: "art. 13 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-13
- id: m01-l07-q072
  prompt:
    es: "Señale la expresión que completa la definición de información pública del artículo 13 de la Ley 19/2013, de 9 de diciembre: contenidos o documentos en poder de los sujetos del título I, cualquiera que sea su:"
  options:
  - id: a
    correct: true
    text:
      es: "Formato o soporte."
  - id: b
    text:
      es: "Origen o autoría."
  - id: c
    text:
      es: "Fecha de elaboración."
  - id: d
    text:
      es: "Nivel de protección."
  explanation:
    es: "El artículo 13 dice que la información pública lo es cualquiera que sea su formato o soporte. El origen o la autoría, la fecha de elaboración y el nivel de protección no aparecen en la definición."
  citation: "art. 13 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q073
  prompt:
    es: "Según el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para:"
  options:
  - id: a
    text:
      es: "La estabilidad política del Gobierno y de su mayoría parlamentaria."
  - id: b
    correct: true
    text:
      es: "La igualdad de las partes en los procesos judiciales y la tutela judicial efectiva."
  - id: c
    text:
      es: "La eficacia de los servicios públicos de atención al ciudadano."
  - id: d
    text:
      es: "El prestigio personal de los responsables públicos."
  explanation:
    es: "El artículo 14.1.f) incluye entre los límites el perjuicio para la igualdad de las partes en los procesos judiciales y la tutela judicial efectiva. La estabilidad del Gobierno, la eficacia de los servicios de atención al ciudadano y el prestigio de los responsables no figuran entre los límites del apartado."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q074
  prompt:
    es: "De acuerdo con el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para las funciones administrativas de:"
  options:
  - id: a
    text:
      es: "Gestión, ordenación y fomento."
  - id: b
    text:
      es: "Información, orientación y atención."
  - id: c
    text:
      es: "Registro, archivo y custodia."
  - id: d
    correct: true
    text:
      es: "Vigilancia, inspección y control."
  explanation:
    es: "El artículo 14.1.g) habla de las funciones administrativas de vigilancia, inspección y control. Las otras ternas son funciones administrativas reales pero ninguna es la que menciona el límite."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q075
  prompt:
    es: "Señale cuál de los siguientes es uno de los perjuicios que permiten limitar el derecho de acceso, conforme al artículo 14.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "El perjuicio para la política de vivienda del Gobierno."
  - id: b
    text:
      es: "El perjuicio para la política social de las entidades locales."
  - id: c
    correct: true
    text:
      es: "El perjuicio para la política económica y monetaria."
  - id: d
    text:
      es: "El perjuicio para la política de empleo de las empresas públicas."
  explanation:
    es: "El artículo 14.1.i) enumera la política económica y monetaria. Las otras tres opciones parecen límites del mismo tipo, pero ninguna está en la lista: ni la política de vivienda del Gobierno, ni la política social de las entidades locales, ni la política de empleo de las empresas públicas."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q076
  prompt:
    es: "Conforme al artículo 14.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho de acceso podrá ser limitado por el perjuicio para el secreto profesional y para:"
  options:
  - id: a
    text:
      es: "La protección de datos meramente identificativos."
  - id: b
    text:
      es: "La libertad de empresa y de competencia."
  - id: c
    text:
      es: "El derecho de petición y de queja."
  - id: d
    correct: true
    text:
      es: "La propiedad intelectual e industrial."
  explanation:
    es: "El artículo 14.1.j) junta el secreto profesional con la propiedad intelectual e industrial. Los datos meramente identificativos tienen su tratamiento propio en el artículo 15, y la libertad de empresa y de competencia y el derecho de petición no son límites del artículo 14.1."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q077
  prompt:
    es: "De acuerdo con el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, es límite al derecho de acceso el perjuicio para la garantía de la confidencialidad o el secreto requerido en:"
  options:
  - id: a
    correct: true
    text:
      es: "Procesos de toma de decisión."
  - id: b
    text:
      es: "Procedimientos de contratación pública."
  - id: c
    text:
      es: "Procesos electorales."
  - id: d
    text:
      es: "Procedimientos de reclamación de responsabilidad patrimonial."
  explanation:
    es: "El artículo 14.1.k) se refiere a la garantía de la confidencialidad o el secreto requerido en procesos de toma de decisión. Los procedimientos de contratación, los procesos electorales y los de responsabilidad patrimonial no son los ámbitos que menciona la letra."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q078
  prompt:
    es: "Según el artículo 14.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para:"
  options:
  - id: a
    text:
      es: "La conservación del patrimonio histórico."
  - id: b
    correct: true
    text:
      es: "La protección del medio ambiente."
  - id: c
    text:
      es: "La protección de la salud pública."
  - id: d
    text:
      es: "El ordenamiento urbanístico del municipio."
  explanation:
    es: "El artículo 14.1.l) cierra la lista con la protección del medio ambiente. La conservación del patrimonio histórico, la protección de la salud pública y el ordenamiento urbanístico no son límites que enumere el apartado."
  citation: "art. 14.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-14
- id: m01-l07-q079
  prompt:
    es: "Señale cómo debe ser la aplicación de los límites al derecho de acceso, conforme al artículo 14.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "Automática cuando concurra alguno de los supuestos del apartado 1."
  - id: b
    correct: true
    text:
      es: "Justificada y proporcionada a su objeto y finalidad de protección."
  - id: c
    text:
      es: "Acordada en todo caso por el Consejo de Transparencia y Buen Gobierno."
  - id: d
    text:
      es: "Indefinida y sin necesidad de motivación."
  explanation:
    es: "Los límites se aplican de forma justificada y proporcionada a su objeto y finalidad de protección. No operan de forma automática por el solo hecho de que se dé uno de los supuestos del apartado 1, no los acuerda siempre el Consejo y exigen motivación."
  citation: "art. 14.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q082
  prompt:
    es: "Conforme al artículo 15.1 de la Ley 19/2013, de 9 de diciembre, si la información incluyese datos genéticos o biométricos, el acceso solo se podrá autorizar con el consentimiento expreso del afectado o si estuviera amparado por:"
  options:
  - id: a
    correct: true
    text:
      es: "Una norma con rango de ley."
  - id: b
    text:
      es: "Una resolución del Consejo de Transparencia y Buen Gobierno."
  - id: c
    text:
      es: "Un informe favorable de la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "Una orden ministerial del departamento competente."
  explanation:
    es: "Para los datos genéticos o biométricos el artículo 15.1 exige el consentimiento expreso del afectado o el amparo de una norma con rango de ley. Ni una resolución del Consejo, ni un informe de la Agencia de Protección de Datos, ni una orden ministerial tienen rango de ley."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q083
  prompt:
    es: "Señale cuándo dejan de aplicarse las limitaciones por protección de datos personales, según el artículo 15.4 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "Previa autorización del Consejo de Transparencia y Buen Gobierno."
  - id: b
    text:
      es: "Con el consentimiento tácito de las personas afectadas."
  - id: c
    text:
      es: "Mediante resolución motivada de la Agencia Española de Protección de Datos."
  - id: d
    correct: true
    text:
      es: "Previa disociación de los datos, de modo que se impida identificar a las personas afectadas."
  explanation:
    es: "El artículo 15.4 deja sin aplicación las reglas anteriores si el acceso se hace previa disociación de los datos de modo que no se identifique a las personas afectadas. La autorización del Consejo, el consentimiento tácito y la resolución de la Agencia de Protección de Datos no desactivan esos límites."
  citation: "art. 15.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
