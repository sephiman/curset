# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q112
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al mantener pulsada Mayús y hacer clic con el botón derecho del ratón en un elemento?"
  options:
  - id: a
    text:
      es: "Se crea un acceso directo al elemento en la carpeta actual"
  - id: b
    text:
      es: "Se abre otra instancia de la aplicación asociada al elemento"
  - id: c
    correct: true
    text:
      es: "Se muestra el menú contextual Mostrar más opciones del elemento seleccionado"
  - id: d
    text:
      es: "Se elimina el elemento sin moverlo a la Papelera de reciclaje"
  explanation:
    es: "La tabla del Explorador de archivos dice que Mayús+clic con el botón derecho muestra «el menú contextual Mostrar más opciones para el elemento seleccionado». Un acceso directo se crea arrastrando el archivo con Alt pulsada. Abrir otra instancia es lo que hace Mayús al seleccionar un icono de la barra de tareas. Eliminar sin pasar por la Papelera es Mayús+Supr."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "atajo"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q113
  prompt:
    es: "En Windows 11, ¿qué ruta del menú contextual de un archivo o carpeta crea en el escritorio un acceso directo a ese elemento?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Nuevo › Acceso directo"
  - id: b
    text:
      es: "Mostrar más opciones › Ver › Mostrar iconos del escritorio"
  - id: c
    correct: true
    text:
      es: "Mostrar más opciones › Enviar a › Escritorio (crear acceso directo)"
  - id: d
    text:
      es: "Mostrar más opciones › Anclar a Inicio"
  explanation:
    es: "La página indica que, para archivos o carpetas, se hace clic con el botón derecho y se elige Mostrar más opciones, Enviar a y Escritorio (crear acceso directo). Nuevo › Acceso directo está en el menú contextual de un área vacía del escritorio, no en el de un archivo. Ver › Mostrar iconos del escritorio pertenece al menú Ver del escritorio y oculta o muestra los iconos. Anclar a Inicio lleva el elemento al menú Inicio, no al escritorio."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q115
  prompt:
    es: "En Windows 11, la combinación Windows+X abre el menú Vínculo rápido. ¿Cuál de las siguientes acciones con el ratón produce el mismo resultado?"
  options:
  - id: a
    text:
      es: "Hacer clic con el botón derecho en un área vacía del escritorio"
  - id: b
    text:
      es: "Hacer clic con el botón derecho en una aplicación de la barra de tareas"
  - id: c
    correct: true
    text:
      es: "Hacer clic con el botón derecho en el menú Inicio"
  - id: d
    text:
      es: "Mantener el puntero sobre el botón Maximizar de la ventana activa"
  explanation:
    es: "La tabla dice que Windows+X abre el menú Vínculo rápido y que es «la misma acción que hacer clic con el botón derecho en el menú Inicio». El clic derecho en un área vacía del escritorio abre su menú contextual (Ver, Nuevo). En una aplicación de la barra de tareas muestra su lista de accesos directos. El puntero sobre Maximizar abre el menú flotante Acoplar."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 3
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q116
  prompt:
    es: "En un cuadro de diálogo de Windows 11, ¿cuál de las siguientes teclas activa o desactiva la casilla que tiene el foco en ese momento?"
  options:
  - id: a
    correct: true
    text:
      es: "Barra espaciadora"
  - id: b
    text:
      es: "Teclas de dirección"
  - id: c
    text:
      es: "Ctrl+Mayús+Tab"
  - id: d
    text:
      es: "Retroceso"
  explanation:
    es: "La tabla de los cuadros de diálogo asigna a la Barra espaciadora: «Si la opción activa es una casilla, activarla o desactivarla». En la misma tabla, las teclas de dirección seleccionan un botón de un grupo de botones de opción, Ctrl+Mayús+Tab retrocede a través de las pestañas y Retroceso abre la carpeta de un nivel superior en Guardar como o Abrir."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q117
  prompt:
    es: "En un cuadro de diálogo de Windows 11 que tiene varias pestañas, ¿qué combinación de teclas avanza a través de esas pestañas?"
  options:
  - id: a
    text:
      es: "Mayús+Tab"
  - id: b
    text:
      es: "Alt+Tab"
  - id: c
    text:
      es: "Ctrl+Mayús+Tab"
  - id: d
    correct: true
    text:
      es: "Ctrl+Tab"
  explanation:
    es: "La tabla de los cuadros de diálogo asigna a Ctrl+Tab «Avanzar a través de las pestañas». Mayús+Tab retrocede por las opciones, Ctrl+Mayús+Tab retrocede a través de las pestañas y Alt+Tab cambia entre ventanas abiertas."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q118
  prompt:
    es: "En un cuadro de diálogo de Windows 11, como una alerta del sistema, ¿qué hace la tecla F4 cuando el foco está en una lista?"
  options:
  - id: a
    text:
      es: "Cierra el cuadro de diálogo y descarta los cambios"
  - id: b
    correct: true
    text:
      es: "Muestra los elementos de la lista activa"
  - id: c
    text:
      es: "Avanza a la pestaña siguiente del cuadro de diálogo"
  - id: d
    text:
      es: "Abre la carpeta de un nivel superior del cuadro"
  explanation:
    es: "La tabla de los cuadros de diálogo asigna a F4 «Mostrar los elementos de la lista activa». Descartar un cuadro de diálogo corresponde a Esc; avanzar por las pestañas, a Ctrl+Tab; y abrir la carpeta de un nivel superior, a Retroceso en Guardar como o Abrir."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q119
  prompt:
    es: "En los cuadros de diálogo Guardar como o Abrir de Windows 11, con una carpeta seleccionada, ¿cuál de las siguientes acciones realiza la tecla Retroceso?"
  options:
  - id: a
    correct: true
    text:
      es: "Abre la carpeta de un nivel superior"
  - id: b
    text:
      es: "Elimina la carpeta seleccionada y la mueve a la Papelera"
  - id: c
    text:
      es: "Cambia el nombre de la carpeta seleccionada"
  - id: d
    text:
      es: "Muestra los elementos de la lista activa del cuadro"
  explanation:
    es: "La tabla de los cuadros de diálogo dice que Retroceso sirve para «abrir una carpeta de un nivel superior si hay una carpeta seleccionada en el cuadro de diálogo Guardar como o Abrir». Mover un elemento a la Papelera es Supr; cambiar el nombre, F2; y mostrar los elementos de la lista activa, F4."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q120
  prompt:
    es: "En un cuadro de diálogo de Windows 11, cuando la opción activa es un grupo de botones de opción, las teclas de dirección sirven para:"
  options:
  - id: a
    text:
      es: "activar o desactivar la casilla que tiene el foco"
  - id: b
    correct: true
    text:
      es: "seleccionar uno de los botones de ese grupo"
  - id: c
    text:
      es: "avanzar a través de las pestañas del cuadro de diálogo"
  - id: d
    text:
      es: "mostrar los elementos de la lista que está activa"
  explanation:
    es: "La tabla de los cuadros de diálogo dice de las teclas de dirección: «Si la opción activa es un grupo de botones de opción, seleccionar un botón». Activar o desactivar una casilla es la Barra espaciadora, avanzar por las pestañas es Ctrl+Tab y mostrar los elementos de la lista activa es F4."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q121
  prompt:
    es: "En Windows 11, ¿qué tecla, según la tabla general de métodos abreviados, descarta un cuadro de diálogo que está abierto?"
  options:
  - id: a
    text:
      es: "Supr"
  - id: b
    correct: true
    text:
      es: "Esc"
  - id: c
    text:
      es: "Retroceso"
  - id: d
    text:
      es: "F6"
  explanation:
    es: "La tabla general dice que Esc sirve para «detener o salir de la tarea actual, o descartar un cuadro de diálogo». Supr elimina el elemento seleccionado y lo mueve a la Papelera, Retroceso abre la carpeta de un nivel superior en Guardar como o Abrir y F6 se desplaza por los elementos de una ventana o del escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q122
  prompt:
    es: "En Windows 11, ¿qué combinación de teclas con la tecla Windows abre directamente el cuadro de diálogo Ejecutar?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+R"
  - id: b
    text:
      es: "Windows+E"
  - id: c
    text:
      es: "Windows+I"
  - id: d
    text:
      es: "Windows+S"
  explanation:
    es: "La tabla con la tecla Windows asigna a Windows+R «Abrir el cuadro de diálogo Ejecutar». Windows+E abre el Explorador de archivos, Windows+I abre Configuración y Windows+S abre la búsqueda."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q123
  prompt:
    es: "Señale la afirmación correcta sobre los métodos abreviados de teclado de los cuadros de diálogo de Windows 11:"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+Tab retrocede por las opciones del cuadro"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+Tab retrocede por las pestañas del cuadro"
  - id: c
    text:
      es: "Mayús+Tab retrocede por las pestañas del cuadro"
  - id: d
    text:
      es: "Ctrl+Tab retrocede por las pestañas del cuadro"
  explanation:
    es: "La tabla de los cuadros de diálogo asigna a Ctrl+Mayús+Tab «Retroceder a través de las pestañas». Retroceder por las opciones es Mayús+Tab, no Ctrl+Mayús+Tab, y Mayús+Tab no cambia de pestaña. Ctrl+Tab avanza por las pestañas; no retrocede."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de los cuadros de diálogo»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q124
  prompt:
    es: "En Windows 11, ¿qué combinación de teclas con la tecla Windows sirve tanto para mostrar el escritorio como para volver a ocultarlo?"
  options:
  - id: a
    text:
      es: "Windows+Alt+D"
  - id: b
    text:
      es: "Windows+Tab"
  - id: c
    correct: true
    text:
      es: "Windows+D"
  - id: d
    text:
      es: "Windows+E"
  explanation:
    es: "La tabla con la tecla Windows asigna a Windows+D «Mostrar y ocultar el escritorio». Windows+Alt+D muestra y oculta la fecha y la hora en el escritorio, Windows+Tab abre la Vista de tareas y Windows+E abre el Explorador de archivos."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q125
  prompt:
    es: "En Windows 11, con varias ventanas abiertas, se pulsa Windows+D y, a continuación, se vuelve a pulsar. ¿Cuál de las siguientes describe lo que ocurre?"
  options:
  - id: a
    text:
      es: "Primero se muestran la fecha y la hora en el escritorio y después se ocultan"
  - id: b
    text:
      es: "Primero se abre la Vista de tareas y después se vuelve a cerrar"
  - id: c
    correct: true
    text:
      es: "Primero se muestra el escritorio y, con la segunda pulsación, se vuelve a ocultar"
  - id: d
    text:
      es: "Primero se crea otro escritorio y después se cierra el que se usa"
  explanation:
    es: "Windows+D sirve para «mostrar y ocultar el escritorio»: al pulsarla una vez se muestra y al pulsarla de nuevo se oculta. Mostrar y ocultar la fecha y la hora es Windows+Alt+D. La Vista de tareas se abre con Windows+Tab. Crear otro escritorio es Windows+Ctrl+D y cerrar el que se usa, Windows+Ctrl+F4."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q126
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas permite ojear temporalmente el escritorio sin cambiar de ventana?"
  options:
  - id: a
    text:
      es: "Windows+punto (.)"
  - id: b
    text:
      es: "Windows+punto y coma (;)"
  - id: c
    text:
      es: "Windows+barra diagonal (/)"
  - id: d
    correct: true
    text:
      es: "Windows+coma (,)"
  explanation:
    es: "La tabla con la tecla Windows asigna a Windows+coma (,) «Ojear temporalmente el escritorio». Windows+punto (.) y Windows+punto y coma (;) abren el panel de emojis, y Windows+barra diagonal (/) inicia la reconversión del Editor de métodos de entrada."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q127
  prompt:
    es: "En Windows 11, ¿qué hace la combinación de teclas Windows+Alt+D según la tabla de métodos abreviados con la tecla Windows?"
  options:
  - id: a
    text:
      es: "Muestra y oculta todos los iconos del escritorio"
  - id: b
    text:
      es: "Crea otro escritorio y cambia a él directamente"
  - id: c
    correct: true
    text:
      es: "Muestra y oculta la fecha y la hora en el escritorio"
  - id: d
    text:
      es: "Muestra y oculta el escritorio, como hace Windows+D"
  explanation:
    es: "La tabla asigna a Windows+Alt+D «Mostrar y ocultar la fecha y hora en el escritorio». Los iconos del escritorio se ocultan desactivando Mostrar iconos del escritorio en el menú Ver. Crear otro escritorio es Windows+Ctrl+D. Mostrar y ocultar el escritorio es Windows+D, sin Alt."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-barra-tareas-html
- id: m06-l02-q128
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes zonas de la barra de tareas da acceso al escritorio minimizando todas las ventanas abiertas?"
  options:
  - id: a
    correct: true
    text:
      es: "El área de la esquina más alejada de la barra"
  - id: b
    text:
      es: "El botón Vista de tareas de la barra de tareas"
  - id: c
    text:
      es: "El botón Widgets situado en la barra de tareas"
  - id: d
    text:
      es: "El icono del reloj o de la campana de notificación"
  explanation:
    es: "La página describe un área pequeña en el lateral de la barra de tareas que da acceso al escritorio «minimizando todas las ventanas abiertas», y la opción que la controla habla de «la esquina más alejada de la barra de tareas». El botón Vista de tareas muestra miniaturas de las aplicaciones activas. El botón Widgets abre el panel de widgets. El reloj o la campana abren el calendario y el centro de notificaciones."
  citation: "fuente: `ms-win-barra-tareas.html`; «Mostrar el escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q130
  prompt:
    es: "En Windows 11, con todos los iconos del escritorio ocultos, ¿desde dónde se puede acceder al contenido del escritorio según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el Explorador de archivos, eligiendo Escritorio en el panel de navegación"
  - id: b
    text:
      es: "Desde Configuración del icono de escritorio, en Configuración › Personalización › Temas"
  - id: c
    text:
      es: "Desde el menú de iconos ocultos de la bandeja del sistema de la barra de tareas"
  - id: d
    text:
      es: "Desde la Configuración rápida que se abre en la barra de tareas"
  explanation:
    es: "La página dice que, si se ocultan los iconos, se puede acceder al escritorio «a través del Explorador de archivos», seleccionando «Escritorio en el panel de navegación». Configuración del icono de escritorio solo elige qué iconos predeterminados aparecen. El menú de iconos ocultos guarda iconos de la bandeja del sistema. La Configuración rápida ajusta el volumen, el brillo o la red."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Mostrar u ocultar todos los iconos del escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q131
  prompt:
    es: "En Windows 11, ¿en qué ruta de Configuración se eligen los iconos Este equipo, Papelera de reciclaje y Red que aparecen en el escritorio?"
  options:
  - id: a
    text:
      es: "Personalización › Inicio › Configuración del icono de escritorio"
  - id: b
    correct: true
    text:
      es: "Personalización › Temas › Configuración del icono de escritorio"
  - id: c
    text:
      es: "Sistema › Multitarea › Escritorios"
  - id: d
    text:
      es: "Personalización › Barra de tareas › Iconos de la bandeja del sistema"
  explanation:
    es: "La página manda abrir Temas, dentro de Personalización, seleccionar Configuración del icono de escritorio y marcar los iconos deseados. Personalización › Inicio es donde la página de la barra de tareas manda activar la opción de mostrar elementos abiertos recientemente en las listas de accesos directos. Sistema › Multitarea › Escritorios configura cómo se muestran las ventanas abiertas en varios escritorios. Iconos de la bandeja del sistema, en la configuración de la barra de tareas, elige Menú lápiz, Teclado táctil y Panel táctil virtual."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q132
  prompt:
    es: "En Windows 11, de los iconos predeterminados que se pueden mostrar en el escritorio, el icono Este equipo proporciona:"
  options:
  - id: a
    text:
      es: "acceso a los recursos de red para poder conectarse a ellos"
  - id: b
    correct: true
    text:
      es: "acceso a las unidades del equipo y a los dispositivos conectados"
  - id: c
    text:
      es: "un lugar donde se almacenan temporalmente los archivos eliminados"
  - id: d
    text:
      es: "acceso a la ventana de Configuración del icono de escritorio"
  explanation:
    es: "La página dice que Este equipo «proporciona acceso a las unidades del equipo y a los dispositivos conectados». Ver los recursos de red y conectarse a ellos es lo que permite el icono Red. Almacenar temporalmente los archivos eliminados es la Papelera de reciclaje. Configuración del icono de escritorio se abre desde Personalización › Temas."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q133
  prompt:
    es: "Señale la afirmación correcta sobre la opción Permitir que los temas cambien los iconos del escritorio en Windows 11:"
  options:
  - id: a
    text:
      es: "De forma predeterminada, los temas no pueden cambiar esos iconos"
  - id: b
    text:
      es: "Decide qué iconos aparecen en el escritorio, no su aspecto"
  - id: c
    correct: true
    text:
      es: "De forma predeterminada, los temas pueden cambiar esos iconos"
  - id: d
    text:
      es: "Cambia el tamaño de los iconos al aplicar un tema nuevo"
  explanation:
    es: "La página dice que la opción permite o impide que los temas cambien los iconos de los accesos directos comunes y que «de forma predeterminada, los temas pueden cambiar estos iconos». Por eso es falso que por defecto no puedan. Qué iconos aparecen se elige marcándolos en Configuración del icono de escritorio, no con esta opción. El tamaño se cambia en el menú Ver del escritorio."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q134
  prompt:
    es: "En Windows 11, ¿cómo se elige entre iconos grandes, medianos o pequeños para los iconos del escritorio desde el menú contextual?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver"
  - id: b
    text:
      es: "Clic derecho en un área vacía del escritorio › Nuevo"
  - id: c
    text:
      es: "Clic derecho en la barra de tareas › Configuración de la barra de tareas"
  - id: d
    text:
      es: "Clic derecho en la Papelera de reciclaje › Mostrar más opciones"
  explanation:
    es: "La página indica hacer clic con el botón derecho en un área vacía del escritorio, seleccionar Ver y elegir «entre iconos grandes, medianos o pequeños». Nuevo, en ese mismo menú, sirve para crear un acceso directo. La configuración de la barra de tareas controla la barra, no los iconos del escritorio. Mostrar más opciones, en el menú de un archivo o carpeta, lleva a Enviar a, que crea un acceso directo en el escritorio, no cambia tamaños."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Cambiar el tamaño de los iconos del escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q136
  prompt:
    es: "En Windows 11, ¿qué ocurre al desactivar la opción Mostrar iconos del escritorio en el menú Ver del menú contextual del escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Se ocultan temporalmente todos los iconos hasta volver a marcar la opción"
  - id: b
    text:
      es: "Se eliminan todos los accesos directos y se envían a la Papelera"
  - id: c
    text:
      es: "Se ocultan Este equipo, Red y la Papelera, pero no los demás"
  - id: d
    text:
      es: "Se ocultan los iconos de la bandeja del sistema de la barra de tareas"
  explanation:
    es: "La página dice que desactivar Mostrar iconos del escritorio «ocultará temporalmente todos los iconos» y que vuelven a verse al marcar de nuevo la opción. No elimina nada ni envía nada a la Papelera. Afecta a todos los iconos, no solo a los predeterminados. Los iconos de la bandeja del sistema se eligen en la configuración de la barra de tareas."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Mostrar u ocultar todos los iconos del escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q137
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del menú contextual del escritorio inicia la creación de un nuevo acceso directo?"
  options:
  - id: a
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Iconos pequeños"
  - id: b
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Iconos medianos"
  - id: c
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Mostrar iconos del escritorio"
  - id: d
    correct: true
    text:
      es: "Clic derecho en un área vacía del escritorio › Nuevo › Acceso directo"
  explanation:
    es: "La página manda hacer clic con el botón derecho en un área vacía del escritorio y seleccionar Nuevo › Acceso directo. El menú Ver sirve para elegir entre iconos grandes, medianos o pequeños y para desactivar Mostrar iconos del escritorio, que oculta los iconos; no crea accesos directos."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q138
  prompt:
    es: "En Windows 11, al crear un acceso directo con Nuevo › Acceso directo en el escritorio, ¿a qué elementos puede apuntar según las indicaciones?"
  options:
  - id: a
    text:
      es: "Solo a un archivo o a una carpeta del propio equipo"
  - id: b
    text:
      es: "Solo a una aplicación instalada que aparezca en Inicio"
  - id: c
    correct: true
    text:
      es: "A un archivo, a una carpeta o a una página web concretos"
  - id: d
    text:
      es: "Solo a un archivo guardado en la carpeta Escritorio"
  explanation:
    es: "La página dice que se siguen las indicaciones «para crear un acceso directo a un archivo, carpeta o página web específicos». Limitarlo a archivos y carpetas deja fuera las páginas web. Las aplicaciones se llevan al escritorio de otra forma, arrastrándolas desde Inicio, pero no son lo único posible. Nada limita el destino a la carpeta Escritorio."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m06-l02-q140
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes formas crea en el escritorio un acceso directo a una aplicación instalada?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir Inicio › Todo y arrastrar la aplicación hasta el escritorio"
  - id: b
    text:
      es: "Abrir Inicio › Todo y pulsar Supr con la aplicación seleccionada"
  - id: c
    text:
      es: "Abrir Inicio › Todo y elegir Anclar a la barra de tareas"
  - id: d
    text:
      es: "Abrir Inicio › Todo y pulsar Alt+Barra espaciadora sobre la aplicación"
  explanation:
    es: "Para aplicaciones, la página manda seleccionar Inicio y Todo, buscar la aplicación y arrastrarla y colocarla en el escritorio. Supr elimina el elemento seleccionado. Anclar a la barra de tareas lleva la aplicación a la barra de tareas, no al escritorio. Alt+Barra espaciadora abre el menú contextual de la ventana activa."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
