m03-l02-q08:
  key:
    anchor: javadoc-stampedlock#class-stampedlock
    sentence: Like Semaphore, but unlike most Lock implementations, StampedLocks have no notion of ownership.
  wrong:
  - option: It is reentrant, so a thread may safely re-acquire a lock it already holds
    anchor: javadoc-stampedlock#class-stampedlock
    sentence: They are not reentrant, so locked bodies should not call other unknown methods that may try to re-acquire locks
  - option: It implements the `Lock` interface, so it can replace a `ReentrantLock` in existing code without any change
    anchor: javadoc-stampedlock#class-stampedlock
    sentence: Because it supports coordinated usage across multiple lock modes, this class does not directly implement the Lock or ReadWriteLock interfaces.
  - option: A zero from a `try` method means that the lock is currently held in write mode
    anchor: javadoc-stampedlock#class-stampedlock
    sentence: A zero return from any "try" method for acquiring or converting locks does not carry any information about the state of the lock; a subsequent invocation may succeed.
m03-l02-q09:
  key:
    anchor: javadoc-reentrantlock#class-reentrantlock
    sentence: When set true, under contention, locks favor granting access to the longest-waiting thread.
  wrong:
  - option: Its overall throughput is always higher than with the default setting when many threads use it
    anchor: javadoc-reentrantlock#class-reentrantlock
    sentence: Programs using fair locks accessed by many threads may display lower overall throughput (i.e., are slower; often much slower) than those using the default setting, but have smaller variances in times to obtain locks and guarantee lack of starvation.
  - option: The untimed `tryLock()` method also honors the fairness setting when the lock is contended
    anchor: javadoc-reentrantlock#class-reentrantlock
    sentence: Also note that the untimed tryLock() method does not honor the fairness setting.
  - option: It guarantees that the threads that use the lock are also scheduled fairly by the system
    anchor: javadoc-reentrantlock#class-reentrantlock
    sentence: Note however, that fairness of locks does not guarantee fairness of thread scheduling.
m03-l02-q10:
  key:
    anchor: javadoc-semaphore#class-semaphore
    sentence: When set false, this class makes no guarantees about the order in which threads acquire permits.
  wrong:
  - option: Threads obtain permits strictly in first-in-first-out order of their `acquire` calls
    anchor: javadoc-semaphore#class-semaphore
    sentence: When set false, this class makes no guarantees about the order in which threads acquire permits.
  - option: Barging is not permitted, so a thread that has been waiting is always served first
    anchor: javadoc-semaphore#class-semaphore
    sentence: In particular, barging is permitted, that is, a thread invoking acquire() can be allocated a permit ahead of a thread that has been waiting
  - option: The untimed `tryAcquire` methods wait until permits can be granted in order
    anchor: javadoc-semaphore#class-semaphore
    sentence: Also note that the untimed tryAcquire methods do not honor the fairness setting, but will take any permits that are available.
