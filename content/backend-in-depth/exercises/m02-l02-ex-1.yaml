- id: m02-l02-q01
  prompt:
    en: In Java 25, `Arrays.binarySearch(int[], int)` is called on a sorted array with a key that is not in the
      array. Which statement about the value it returns is correct?
  options:
  - id: a
    text:
      en: It returns `-1` for every missing key, whatever position the key would take in the array
  - id: b
    text:
      en: It returns the insertion point itself, a non-negative index, and the caller tests that index against the
        array
  - id: c
    text:
      en: It returns `-(insertion point) - 1`, where the insertion point is the index of the last element smaller
        than the key
  - id: d
    correct: true
    text:
      en: It returns `-(insertion point) - 1`, where the insertion point is the index of the first element greater
        than the key
  explanation:
    en: A missing key gives `-(insertion point) - 1`, with the insertion point at the first element greater than
      the key. The claim of `-1` for every missing key is wrong, because the returned value depends on the insertion
      point. The claim of a non-negative insertion point is wrong, because the return value is >= 0 if and only
      if the key is found. The claim that the insertion point follows the last smaller element is wrong, because
      the insertion point is defined as the index of the first element greater than the key.
  citation: javadoc-arrays#binarySearch(int[],int)
- id: m02-l02-q03
  prompt:
    en: In Java 25, `Arrays.sort(Object[])` sorts an array whose elements are mutually comparable, and two of them
      are equal. Which statement about their relative order after the sort is correct?
  options:
  - id: a
    text:
      en: Equal elements may swap places, because the sort is a Dual-Pivot Quicksort
  - id: b
    text:
      en: Equal elements end up in the reverse of their original order
  - id: c
    correct: true
    text:
      en: Equal elements keep their original order, because the sort is guaranteed to be stable
  - id: d
    text:
      en: Equal elements keep their order only when a `Comparator` is passed, not under natural ordering
  explanation:
    en: Equal elements keep their original order, because `Arrays.sort(Object[])` is guaranteed to be stable. The
      claim of a Dual-Pivot Quicksort is wrong, because the implementation is a stable, adaptive, iterative mergesort.
      The claim of a reversed order is wrong, because equal elements will not be reordered as a result of the sort.
      The claim that stability needs a `Comparator` is wrong, because `Collections.sort(List)`, which uses the natural
      ordering, is guaranteed to be stable too.
  citation: javadoc-arrays#sort(java.lang.Object[]); javadoc-collections#sort(java.util.List)
- id: m02-l02-q04
  prompt:
    en: A developer compares the sorting methods of Java 25. Which statement about them is correct?
  options:
  - id: a
    correct: true
    text:
      en: '`Arrays.sort(Object[])` requires approximately n comparisons when the input array is nearly sorted'
  - id: b
    text:
      en: '`Arrays.sort(Object[])` always needs n lg(n) comparisons, because it is a mergesort'
  - id: c
    text:
      en: '`Collections.sort(List)` uses its own algorithm, unrelated to `List.sort(Comparator)`'
  - id: d
    text:
      en: '`Arrays.sort(int[])` is a stable mergesort adapted from the Python list sort'
  explanation:
    en: '`Arrays.sort(Object[])` requires approximately n comparisons when the input array is nearly sorted. The
      claim of always n lg(n) comparisons is wrong, because the mergesort requires far fewer than n lg(n) comparisons
      when the input array is partially sorted. The claim that `Collections.sort(List)` is unrelated to `List.sort(Comparator)`
      is wrong, because it defers to that method with a null comparator. The claim that `Arrays.sort(int[])` is
      a stable mergesort is wrong, because it is a Dual-Pivot Quicksort.'
  citation: javadoc-arrays#sort(java.lang.Object[]); javadoc-collections#sort(java.util.List); javadoc-arrays#sort(int[])
- id: m02-l02-q05
  prompt:
    en: According to Open Data Structures, which statement about the sorting algorithms of its chapter 11 is correct?
  options:
  - id: a
    correct: true
    text:
      en: Radix-sort uses several passes of counting-sort to allow for a much greater range of maximum values
  - id: b
    text:
      en: Radix-sort sorts the integers by their most significant bits first and the least significant bits last
  - id: c
    text:
      en: Counting-sort is most efficient when the array length is much smaller than the maximum value
  - id: d
    text:
      en: Heap-sort needs a second array of the same size, so it is not an in-place algorithm
  explanation:
    en: Radix-sort uses several passes of counting-sort to allow for a much greater range of maximum values. The
      claim of most significant bits first is wrong, because radix sort first sorts the integers by their least
      significant bits. The claim about a length much smaller than the maximum is wrong, because counting-sort is
      very efficient when the length is not much smaller than the maximum value. The claim that heap-sort is not
      in place is wrong, because it is another in-place sorting algorithm.
  citation: ods-11-2-counting-sort-radix-so#SECTION001422000000000000000; ods-11-1-comparison-based-sorti#SECTION001413000000000000000
