# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q054
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Constitución Española de 1978, cuando el Rey fuere menor de edad, entrará a ejercer inmediatamente la Regencia:"
  options:
  - id: a
    text:
      es: "El Príncipe heredero de la Corona, si fuere mayor de edad."
  - id: b
    text:
      es: "La persona que hubiese nombrado el Rey difunto en su testamento."
  - id: c
    text:
      es: "Una Regencia de una, tres o cinco personas nombrada por las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "El padre o la madre del Rey y, en su defecto, el pariente mayor de edad más próximo a suceder en la Corona."
  explanation:
    es: "El artículo 59.1 dice que en la minoría de edad del Rey ejerce la Regencia «el padre o la madre del Rey y, en su defecto, el pariente mayor de edad más próximo a suceder en la Corona». El Príncipe heredero mayor de edad es el Regente en la inhabilitación del Rey (art. 59.2). La persona nombrada en el testamento es el tutor (art. 60.1). La Regencia de una, tres o cinco personas es la que nombran las Cortes cuando no corresponde a nadie (art. 59.3)."
  citation: "art. 59.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q055
  prompt:
    es: "Según el artículo 59.2 de la Constitución Española de 1978, si el Rey se inhabilita y el Príncipe heredero no es mayor de edad, ¿cómo se procede?"
  options:
  - id: a
    correct: true
    text:
      es: "Como en la minoría de edad del Rey, hasta que el Príncipe heredero alcance la mayoría de edad."
  - id: b
    text:
      es: "Las Cortes Generales nombran una Regencia de una, tres o cinco personas."
  - id: c
    text:
      es: "El tutor del Príncipe heredero ejerce la Regencia hasta su mayoría de edad."
  - id: d
    text:
      es: "El Presidente del Gobierno asume las funciones del Rey hasta esa mayoría de edad."
  explanation:
    es: "El artículo 59.2 dice que, si el Príncipe heredero no es mayor de edad, «se procederá de la manera prevista en el apartado anterior, hasta que el Príncipe heredero alcance la mayoría de edad». El apartado anterior es el de la minoría de edad del Rey. La Regencia de las Cortes solo procede si no hay persona a quien corresponda (art. 59.3). El texto no da la Regencia al tutor del Príncipe ni al Presidente del Gobierno."
  citation: "art. 59.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q058
  prompt:
    es: "Conforme al artículo 59.5 de la Constitución Española de 1978, en cuanto al título por el que actúa y al nombre en que lo hace, la Regencia se ejercerá:"
  options:
  - id: a
    text:
      es: "Por delegación de las Cortes Generales y en nombre propio."
  - id: b
    correct: true
    text:
      es: "Por mandato constitucional y siempre en nombre del Rey."
  - id: c
    text:
      es: "Por mandato constitucional y en nombre de las Cortes Generales."
  - id: d
    text:
      es: "Por delegación del Rey y en nombre del Gobierno."
  explanation:
    es: "El artículo 59.5 dice: «La Regencia se ejercerá por mandato constitucional y siempre en nombre del Rey». No es una delegación de las Cortes ni del Rey. No se ejerce en nombre propio, de las Cortes ni del Gobierno."
  citation: "art. 59.5 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-12
- id: m01-l02-q059
  prompt:
    es: "Para ejercer la Regencia es preciso ser mayor de edad. ¿A qué edad son mayores de edad los españoles según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "A los dieciséis años cumplidos."
  - id: b
    correct: true
    text:
      es: "A los dieciocho años cumplidos."
  - id: c
    text:
      es: "A los veintiún años cumplidos."
  - id: d
    text:
      es: "A los veinticinco años cumplidos."
  explanation:
    es: "El artículo 12 dice: «Los españoles son mayores de edad a los dieciocho años». Dieciséis, veintiún y veinticinco años no son la mayoría de edad de la Constitución."
  citation: "art. 12 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-58
- id: m01-l02-q151
  prompt:
    es: "Señale la respuesta correcta sobre la Reina consorte o el consorte de la Reina, de acuerdo con el artículo 58 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Ejercen las funciones constitucionales del Rey cuando este se encuentra ausente."
  - id: b
    text:
      es: "Pueden asumir funciones constitucionales si las Cortes Generales las autorizan."
  - id: c
    correct: true
    text:
      es: "No pueden asumir funciones constitucionales, salvo lo dispuesto para la Regencia."
  - id: d
    text:
      es: "Asumen la tutela del Rey menor en todo caso."
  explanation:
    es: "El artículo 58 dice que no pueden asumir funciones constitucionales, «salvo lo dispuesto para la Regencia». No sustituyen al Rey en su ausencia, las Cortes no pueden autorizarles esas funciones y la tutela del Rey menor se rige por el artículo 60, no por su condición de consorte."
  citation: "art. 58 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q152
  prompt:
    es: "Según la Constitución Española de 1978, si no hubiere ninguna persona a quien corresponda la Regencia, esta será nombrada por:"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cortes Generales."
  - id: b
    text:
      es: "El Consejo de Estado."
  - id: c
    text:
      es: "El Gobierno, mediante real decreto."
  - id: d
    text:
      es: "El Tribunal Constitucional."
  explanation:
    es: "El artículo 59.3 dice que, si no hay ninguna persona a quien corresponda, «ésta será nombrada por las Cortes Generales». El Consejo de Estado, el Gobierno y el Tribunal Constitucional no intervienen en ese nombramiento."
  citation: "art. 59.3 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q154
  prompt:
    es: "Según la Constitución Española de 1978, quien pretenda ejercer la Regencia, ya sea por minoría de edad o por inhabilitación del Rey, debe reunir dos condiciones personales, que son:"
  options:
  - id: a
    text:
      es: "Ser español de nacimiento y mayor de edad."
  - id: b
    text:
      es: "Ser pariente del Rey y mayor de edad."
  - id: c
    correct: true
    text:
      es: "Ser español y mayor de edad."
  - id: d
    text:
      es: "Ser español y haber cumplido treinta años."
  explanation:
    es: "El artículo 59.4 pide «ser español y mayor de edad». La nacionalidad de nacimiento es la exigencia para el tutor del Rey menor nombrado en testamento (artículo 60.1), no para el Regente. El parentesco con el Rey y los treinta años tampoco son requisitos."
  citation: "art. 59.4 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q155
  prompt:
    es: "Conforme al artículo 59.2 de la Constitución Española de 1978, si el Rey se inhabilitare para el ejercicio de su autoridad, la imposibilidad ha de ser reconocida por:"
  options:
  - id: a
    text:
      es: "El Tribunal Constitucional."
  - id: b
    correct: true
    text:
      es: "Las Cortes Generales."
  - id: c
    text:
      es: "El Consejo de Estado."
  - id: d
    text:
      es: "El Gobierno, mediante real decreto."
  explanation:
    es: "El artículo 59.2 dice que «la imposibilidad fuere reconocida por las Cortes Generales». El Tribunal Constitucional, el Consejo de Estado y el Gobierno no tienen esa competencia."
  citation: "art. 59.2 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q167
  prompt:
    es: "¿De cuántas personas se compone, como máximo, la Regencia que nombran las Cortes Generales cuando nadie la ejerce por mandato constitucional, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Cinco personas."
  - id: b
    text:
      es: "Siete personas."
  - id: c
    text:
      es: "Nueve personas."
  - id: d
    text:
      es: "Seis personas."
  explanation:
    es: "El artículo 59.3 dice que la Regencia nombrada por las Cortes se compone de una, tres o cinco personas, de modo que el máximo es cinco. Siete y nueve superan ese tope. Seis lo supera también y además es un número par, que la serie impar del artículo no incluye."
  citation: "art. 59.3 CE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q060
  prompt:
    es: "De acuerdo con el artículo 60.1 de la Constitución Española de 1978, será tutor del Rey menor, en primer lugar:"
  options:
  - id: a
    correct: true
    text:
      es: "La persona que en su testamento hubiese nombrado el Rey difunto, siempre que sea mayor de edad y español de nacimiento."
  - id: b
    text:
      es: "El Regente, que acumula siempre los cargos de Regente y de tutor."
  - id: c
    text:
      es: "El pariente mayor de edad más próximo a suceder en la Corona."
  - id: d
    text:
      es: "El Presidente del Gobierno, mientras dure la minoría de edad del Rey."
  explanation:
    es: "El artículo 60.1 dice: «Será tutor del Rey menor la persona que en su testamento hubiese nombrado el Rey difunto, siempre que sea mayor de edad y español de nacimiento». Los cargos de Regente y tutor no se acumulan siempre: solo en el padre, la madre o los ascendientes directos. El pariente más próximo a suceder es quien ejerce la Regencia en defecto de los padres (art. 59.1), no el tutor. El Presidente del Gobierno no es tutor."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q061
  prompt:
    es: "¿Qué requisitos debe reunir la persona que el Rey difunto nombre tutor del Rey menor en su testamento, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Ser español y mayor de edad."
  - id: b
    correct: true
    text:
      es: "Ser mayor de edad y español de nacimiento."
  - id: c
    text:
      es: "Ser mayor de edad y pariente del Rey difunto."
  - id: d
    text:
      es: "Ser mayor de veinticinco años y español de nacimiento."
  explanation:
    es: "El artículo 60.1 exige al tutor testamentario que sea «mayor de edad y español de nacimiento». Ser español sin más es el requisito de la Regencia (art. 59.4). El parentesco no se exige. La edad exigida es la mayoría de edad, no veinticinco años."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q062
  prompt:
    es: "Si el Rey difunto no nombró tutor en su testamento, ¿quién es tutor del Rey menor según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El padre o la madre, mientras permanezcan viudos."
  - id: b
    text:
      es: "El padre o la madre, aunque hayan contraído nuevo matrimonio."
  - id: c
    text:
      es: "El pariente mayor de edad más próximo a suceder en la Corona."
  - id: d
    text:
      es: "La persona que designe el Gobierno, oído el Consejo de Estado."
  explanation:
    es: "El artículo 60.1 dice que, si el Rey difunto no lo nombró, «será tutor el padre o la madre mientras permanezcan viudos». Si dejan de estar viudos, dejan de cumplir la condición. El pariente más próximo a suceder aparece en la Regencia (art. 59.1). En defecto de los padres nombran al tutor las Cortes Generales, no el Gobierno."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q063
  prompt:
    es: "De acuerdo con el artículo 60.1 de la Constitución Española de 1978, los cargos de Regente y de tutor del Rey menor:"
  options:
  - id: a
    text:
      es: "Podrán acumularse en cualquier persona que reúna los requisitos de ambos."
  - id: b
    text:
      es: "No podrán acumularse en ningún caso."
  - id: c
    text:
      es: "No podrán acumularse sino en el pariente más próximo a suceder en la Corona."
  - id: d
    correct: true
    text:
      es: "No podrán acumularse sino en el padre, madre o ascendientes directos del Rey."
  explanation:
    es: "El artículo 60.1 dice que «no podrán acumularse los cargos de Regente y de tutor sino en el padre, madre o ascendientes directos del Rey». La regla es la prohibición, con esa única excepción. No se acumulan en cualquier persona, y la excepción no alcanza al pariente más próximo a suceder."
  citation: "art. 60.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q156
  prompt:
    es: "¿Quién nombra al tutor del Rey menor cuando el Rey difunto no nombró tutor en su testamento y el padre o la madre no permanecen viudos?"
  options:
  - id: a
    text:
      es: "El Consejo de Estado."
  - id: b
    text:
      es: "El Gobierno."
  - id: c
    text:
      es: "El Presidente del Congreso."
  - id: d
    correct: true
    text:
      es: "Las Cortes Generales."
  explanation:
    es: "El artículo 60.1 dice «en su defecto, lo nombrarán las Cortes Generales». El Consejo de Estado, el Gobierno y el Presidente del Congreso no lo nombran."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q157
  prompt:
    es: "De acuerdo con el artículo 60.2 de la Constitución Española de 1978, el ejercicio de la tutela del Rey menor es también incompatible con:"
  options:
  - id: a
    text:
      es: "Cualquier actividad profesional del ámbito privado."
  - id: b
    correct: true
    text:
      es: "Todo cargo o representación política."
  - id: c
    text:
      es: "El cargo de Regente en todo caso."
  - id: d
    text:
      es: "Todo empleo en la Administración, incluido el político."
  explanation:
    es: "El artículo 60.2 declara la tutela incompatible «con el de todo cargo o representación política». No lo es con la actividad privada en general. Tampoco lo es con la Regencia en todo caso, pues el artículo 60.1 permite acumularla en el padre, la madre o los ascendientes directos."
  citation: "art. 60.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
