- id: g-reverse-proxy
  term: {en: reverse proxy}
  definition: {en: "An intermediary, also called a gateway, that acts as an origin server for the outbound connection but translates received requests and forwards them inbound to another server or servers."}
  origin: m07-l03
  citation: "rfc9110#section-3.7"
- id: g-ingress
  term: {en: Ingress}
  definition: {en: "A Kubernetes resource that exposes HTTP and HTTPS routes from outside the cluster to services within the cluster, with traffic routing controlled by rules defined on the resource."}
  origin: m07-l03
  citation: "k8s-ingress#what-is-ingress"
- id: g-fresh-response
  term: {en: fresh response}
  definition: {en: "A cached response whose age has not yet exceeded its freshness lifetime."}
  origin: m07-l03
  citation: "rfc9111#section-4.2"
- id: g-stale-response
  term: {en: stale response}
  definition: {en: "A cached response whose age has exceeded its freshness lifetime."}
  origin: m07-l03
  citation: "rfc9111#section-4.2"
- id: g-stale-while-revalidate
  term: {en: stale-while-revalidate}
  definition: {en: "A Cache-Control extension that indicates that caches may serve the response in which it appears after it becomes stale, up to the indicated number of seconds."}
  origin: m07-l03
  citation: "rfc5861#section-3"
