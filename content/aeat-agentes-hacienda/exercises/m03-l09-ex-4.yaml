# anchor: boe-a-2005-14803-art-35
- id: m03-l09-q0086
  prompt:
    es: "Sobre el cheque presentado en una entidad de crédito que preste el servicio de caja, conforme al artículo 35.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Debe ser al portador, para que cualquier empleado de la entidad pueda cobrarlo."
  - id: b
    text:
      es: "Debe estar avalado por la Administración tributaria antes de presentarlo."
  - id: c
    text:
      es: "Debe ser nominativo a favor de la entidad de crédito que preste el servicio de caja."
  - id: d
    correct: true
    text:
      es: "Debe estar conformado o certificado por la entidad librada, en fecha y forma."
  explanation:
    es: "El cheque debe estar conformado o certificado por la entidad librada, en fecha y forma (artículo 35.1). Además ha de ser nominativo a favor del Tesoro público, no al portador ni a favor de la entidad de crédito. La Administración tributaria no avala los cheques de los obligados."
  citation: "art. 35.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "cheque"
# anchor: boe-a-2003-23186-art-64
- id: m03-l09-q0087
  prompt:
    es: "Según el artículo 64 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué importes pueden consignar los obligados tributarios en la Caja General de Depósitos?"
  options:
  - id: a
    text:
      es: "Solo el importe de la deuda tributaria, sin que puedan consignarse las costas devengadas."
  - id: b
    text:
      es: "El importe de la deuda tributaria y de las sanciones que se hayan impuesto por la misma infracción."
  - id: c
    correct: true
    text:
      es: "El importe de la deuda tributaria y, en su caso, de las costas reglamentariamente devengadas."
  - id: d
    text:
      es: "El importe de la deuda tributaria y de los recargos del período ejecutivo, sin las costas."
  explanation:
    es: "El artículo 64 permite consignar el importe de la deuda tributaria y, en su caso, de las costas reglamentariamente devengadas. Excluir las costas contradice el texto, y el precepto no menciona las sanciones ni los recargos del período ejecutivo entre los importes consignables."
  citation: "art. 64 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-29
- id: m03-l09-q0088
  prompt:
    es: "Respecto de los ingresos de las entidades colaboradoras en la cuenta del Tesoro, conforme al artículo 29.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Lo recaudado en la quincena que finaliza el día 5 se ingresa el día 18 del mes o el inmediato hábil anterior."
  - id: b
    text:
      es: "Lo recaudado en la quincena que finaliza el día 5 se ingresa el penúltimo día hábil del mes."
  - id: c
    text:
      es: "Lo recaudado en la quincena que finaliza el día 20 se ingresa el día 18 del mes o el inmediato hábil anterior."
  - id: d
    text:
      es: "Lo recaudado en la quincena que finaliza el día 20 se ingresa el día 5 del mes siguiente."
  explanation:
    es: "Lo recaudado en la quincena que acaba el día 5 se ingresa el día 18 del mismo mes o el inmediato hábil anterior (artículo 29.1). El penúltimo día hábil es el de la quincena que acaba el día 20, de modo que asignarlo a la quincena del día 5 o el día 18 a la del día 20 cruza ambas reglas. El día 5 del mes siguiente no figura en el artículo."
  citation: "art. 29.1 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "entidades colaboradoras"
  - "quincena"
# anchor: boe-a-2003-23186-art-7
- id: m03-l09-q0090
  prompt:
    es: "De acuerdo con el artículo 7.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tendrán carácter supletorio en materia tributaria:"
  options:
  - id: a
    text:
      es: "Las disposiciones generales del derecho penal y los preceptos del derecho procesal civil."
  - id: b
    text:
      es: "Las ordenanzas fiscales de cada entidad local y los usos del tráfico mercantil."
  - id: c
    text:
      es: "Los criterios de la doctrina administrativa y las costumbres de cada órgano gestor."
  - id: d
    correct: true
    text:
      es: "Las disposiciones generales del derecho administrativo y los preceptos del derecho común."
  explanation:
    es: "La ley declara supletorias las disposiciones generales del derecho administrativo y los preceptos del derecho común (artículo 7.2). El derecho penal y el procesal civil no se citan. Las ordenanzas fiscales son normas propias del ámbito tributario local, no supletorias, y la doctrina o las costumbres de un órgano no son fuentes que el artículo señale."
  citation: "art. 7.2 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "plazos de pago"
  - "supletoriedad"
# anchor: boe-a-2015-10565-art-30
- id: m03-l09-q0091
  prompt:
    es: "Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, siempre que por ley o por el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días se entiende que son hábiles, excluyéndose del cómputo:"
  options:
  - id: a
    correct: true
    text:
      es: "Los sábados, los domingos y los declarados festivos."
  - id: b
    text:
      es: "Los domingos y los declarados festivos, pero no los sábados."
  - id: c
    text:
      es: "Los sábados y los domingos, pero no los declarados festivos."
  - id: d
    text:
      es: "Los domingos y los festivos nacionales, pero no los sábados ni los festivos locales."
  explanation:
    es: "En los plazos por días se excluyen del cómputo los sábados, los domingos y los declarados festivos (artículo 30.2). Dejar fuera del cómputo solo los domingos y festivos mantiene el sábado como hábil, y excluir solo sábados y domingos deja los festivos. La referencia a los declarados festivos no se limita a los nacionales."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "pago"
  - "plazos de pago"
  - "cómputo de plazos"
# anchor: boe-a-2015-10565-art-30
- id: m03-l09-q0092
  prompt:
    es: "En relación con los plazos señalados por días, conforme al artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se entiende que son naturales, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: b
    correct: true
    text:
      es: "Se entiende que son hábiles, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: c
    text:
      es: "Se entiende que son hábiles en todo caso, aunque una ley exprese otro cómputo distinto."
  - id: d
    text:
      es: "Se entiende que son hábiles, salvo que el órgano administrativo exprese otro cómputo en la notificación."
  explanation:
    es: "Los plazos por días son hábiles salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo (artículo 30.2). No son naturales por defecto. La regla cede ante la ley, así que no rige en todo caso. Y el órgano administrativo no puede fijar por sí mismo otro cómputo en la notificación."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "pago"
  - "plazos de pago"
  - "cómputo de plazos"
# anchor: boe-a-2015-10565-art-30
- id: m03-l09-q0093
  prompt:
    es: "Conforme al artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué días se excluyen del cómputo de un plazo de pago señalado por días, cuando ninguna ley expresa otro cómputo?"
  options:
  - id: a
    text:
      es: "Solo los domingos y los declarados festivos."
  - id: b
    text:
      es: "Solo los sábados y los domingos."
  - id: c
    text:
      es: "Los domingos y los festivos de ámbito nacional, no los autonómicos."
  - id: d
    correct: true
    text:
      es: "Los sábados, los domingos y los declarados festivos."
  explanation:
    es: "Se excluyen los sábados, los domingos y los declarados festivos (artículo 30.2). Las otras opciones dejan algún día de los tres como hábil o restringen los festivos a los nacionales."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "pago"
  - "plazos de pago"
  - "cómputo de plazos"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0094
  prompt:
    es: "Sobre los efectos de las dos consignaciones en efectivo que regula el artículo 43 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "La hecha al interponer recursos o reclamaciones suspende la ejecución del acto impugnado, y la hecha por no admitirse el pago libera al deudor."
  - id: b
    text:
      es: "La hecha al interponer recursos o reclamaciones libera al deudor del pago, y la hecha por no admitirse el pago suspende la ejecución del acto impugnado."
  - id: c
    text:
      es: "Las dos suspenden la ejecución del acto impugnado desde la fecha en que se efectúan."
  - id: d
    text:
      es: "Las dos liberan al deudor desde la fecha en que se comunican al órgano de recaudación."
  explanation:
    es: "La consignación al recurrir suspende la ejecución del acto desde que se hace, y la consignación por pago no admitido tiene efectos liberatorios si se comunica al órgano de recaudación (artículo 43.2). Intercambiar los efectos los atribuye a la consignación equivocada. Y no producen el mismo efecto las dos."
  citation: "art. 43.2 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2003-23186-art-61
- id: m03-l09-q0095
  prompt:
    es: "Respecto del momento en que se entiende pagada la deuda tributaria, conforme a los artículos 61.1 a 61.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "En efectivo, cuando se ingresa en la cuenta del Tesoro público; con efectos timbrados, cuando se adquieren en la forma reglamentaria."
  - id: b
    correct: true
    text:
      es: "En efectivo, cuando se ingresa en las cajas de los órganos competentes, oficinas recaudadoras o entidades autorizadas; con efectos timbrados, cuando se utilizan en la forma reglamentaria."
  - id: c
    text:
      es: "En efectivo, cuando se ingresa en las cajas de los órganos competentes; en especie, cuando se aceptan los bienes por el órgano de recaudación."
  - id: d
    text:
      es: "En efectivo, cuando el órgano de recaudación expide el recibo; con efectos timbrados, cuando se utilizan, y en especie, desde la valoración de los bienes."
  explanation:
    es: "En efectivo la deuda se entiende pagada con el ingreso en las cajas de los órganos competentes, oficinas recaudadoras o entidades autorizadas; con efectos timbrados, cuando se utilizan en la forma reglamentaria (artículos 61.1 y 61.2). El ingreso en el Tesoro y la adquisición de los timbres no son los momentos del texto. El pago en especie extingue la deuda en el momento que fijen sus normas, no al aceptarse los bienes. Y el recibo o la valoración tampoco son los momentos que señala el artículo."
  citation: "art. 61.1 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "momento del pago"
# anchor: boe-a-2003-23186-art-60
- id: m03-l09-q0195
  prompt:
    es: "De acuerdo con el artículo 60.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el pago en especie de las deudas tributarias que son inaplazables:"
  options:
  - id: a
    text:
      es: "Cabe, siempre que una ley lo disponga expresamente y la deuda se encuentre en período ejecutivo."
  - id: b
    text:
      es: "Cabe, pero solo si el obligado constituye garantía suficiente del valor de los bienes ofrecidos."
  - id: c
    correct: true
    text:
      es: "No cabe, y las solicitudes de pago en especie de esas deudas son objeto de inadmisión."
  - id: d
    text:
      es: "No cabe, pero las solicitudes se tramitan como solicitudes de aplazamiento de la deuda."
  explanation:
    es: "El pago en especie puede admitirse en período voluntario o ejecutivo cuando una ley lo disponga, pero no cabe respecto de las deudas que según el artículo 65.2 son inaplazables, y las solicitudes se inadmiten (art. 60.2). Limitarlo al período ejecutivo contradice que valga en ambos. Exigir garantía añade un requisito que la norma no prevé. Tramitar la solicitud como aplazamiento no tiene apoyo: esas deudas tampoco pueden aplazarse y la solicitud se inadmite."
  citation: "art. 60.2 LGT"
  difficulty: 2
  tags:
  - "pago en especie"
  - "inaplazables"
  - "inadmisión"
# anchor: boe-a-2005-14803-art-17
- id: m03-l09-q0199
  prompt:
    es: "¿A quién deben solicitar autorización las entidades que deseen actuar como colaboradoras en la gestión recaudatoria de la Agencia Estatal de Administración Tributaria, según el artículo 17.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Al Director del Departamento de Gestión Tributaria de la Agencia Estatal de Administración Tributaria."
  - id: b
    correct: true
    text:
      es: "Al Director del Departamento de Recaudación de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "Al delegado especial de la Agencia Tributaria de la provincia donde la entidad tenga su domicilio."
  - id: d
    text:
      es: "A la persona titular de la Secretaría de Estado de Hacienda, previo informe del Tesoro Público."
  explanation:
    es: "Las entidades que deseen actuar como colaboradoras en la gestión recaudatoria de la Agencia Estatal de Administración Tributaria solicitan autorización del Director del Departamento de Recaudación (art. 17.2 RGR). La norma señala un único órgano. El Departamento de Gestión Tributaria se ocupa de otras funciones, el delegado especial actúa en su ámbito territorial y la Secretaría de Estado de Hacienda queda fuera de esa autorización."
  citation: "art. 17.2 RGR"
  difficulty: 1
  tags:
  - "entidades colaboradoras"
  - "autorización"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0101
  prompt:
    es: "Conforme al artículo 65.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias en período voluntario o ejecutivo podrán aplazarse o fraccionarse en los términos que se fijen reglamentariamente y previa solicitud del obligado, cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Su situación económico-financiera le impida, de forma transitoria, efectuar el pago en los plazos establecidos."
  - id: b
    text:
      es: "Su situación económico-financiera le impida, de forma estructural, efectuar el pago en los plazos establecidos."
  - id: c
    text:
      es: "Su situación económico-financiera le impida, de forma definitiva, efectuar el pago en los plazos establecidos."
  - id: d
    text:
      es: "Su situación económico-financiera le impida, de forma parcial, efectuar el pago en los plazos establecidos."
  explanation:
    es: "El aplazamiento procede cuando la situación económico-financiera impida el pago en plazo de forma transitoria (artículo 65.1). Una dificultad estructural o definitiva no es la que la ley contempla. Tampoco se exige que la dificultad sea solo parcial."
  citation: "art. 65.1 LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "requisitos"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0102
  prompt:
    es: "¿Cuál de las siguientes deudas tributarias NO puede ser objeto de aplazamiento o fraccionamiento según el artículo 65.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Las resultantes de liquidaciones practicadas por la Administración."
  - id: b
    text:
      es: "Las derivadas de una autoliquidación presentada en plazo."
  - id: c
    text:
      es: "Las derivadas de un acta de inspección firmada en conformidad."
  - id: d
    correct: true
    text:
      es: "Las correspondientes a obligaciones tributarias que deba cumplir el retenedor."
  explanation:
    es: "Las obligaciones del retenedor o del obligado a realizar ingresos a cuenta no son aplazables (artículo 65.2.b). Las liquidaciones de la Administración y las autoliquidaciones presentadas en plazo sí pueden aplazarse, y el artículo 65.2 no excluye las derivadas de actas en conformidad."
  citation: "art. 65.2 LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
  - "retenedores"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0103
  prompt:
    es: "En relación con las deudas de los retenedores, conforme al artículo 65.2.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Pueden aplazarse con garantía del 25 por ciento de la deuda más los intereses."
  - id: b
    correct: true
    text:
      es: "No pueden aplazarse ni fraccionarse, y la solicitud se inadmite."
  - id: c
    text:
      es: "No pueden aplazarse en período voluntario, pero sí en período ejecutivo."
  - id: d
    text:
      es: "Pueden aplazarse si el retenedor justifica una dificultad económico-financiera transitoria."
  explanation:
    es: "Las obligaciones del retenedor o del obligado a realizar ingresos a cuenta son inaplazables y su solicitud se inadmite (artículo 65.2.b). No procede conceder el aplazamiento con garantía ni acreditando una dificultad transitoria, porque la exclusión no depende de esas circunstancias. Y rige en cualquier período, no solo en el voluntario."
  citation: "art. 65.2.b LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
  - "retenedores"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0106
  prompt:
    es: "Según el artículo 65.2.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, en caso de concurso del obligado tributario no podrán ser objeto de aplazamiento o fraccionamiento las deudas que, de acuerdo con la legislación concursal:"
  options:
  - id: a
    text:
      es: "Tengan la consideración de créditos con privilegio especial."
  - id: b
    text:
      es: "Tengan la consideración de créditos subordinados."
  - id: c
    correct: true
    text:
      es: "Tengan la consideración de créditos contra la masa."
  - id: d
    text:
      es: "Hayan nacido con anterioridad a la declaración del concurso."
  explanation:
    es: "En caso de concurso, son inaplazables las deudas que sean créditos contra la masa (artículo 65.2.c). Los créditos con privilegio especial, los subordinados o los nacidos antes del concurso no figuran en esa exclusión."
  citation: "art. 65.2.c LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0107
  prompt:
    es: "¿Cuál de las siguientes deudas tributarias es inaplazable conforme al artículo 65.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Las resultantes de la ejecución de decisiones de recuperación de ayudas de Estado reguladas en el título VII de la Ley."
  - id: b
    text:
      es: "Las resultantes de la ejecución de sentencias firmes estimatorias de recursos contencioso-administrativos."
  - id: c
    text:
      es: "Las resultantes de actas de inspección firmadas en disconformidad por el obligado."
  - id: d
    text:
      es: "Las resultantes de liquidaciones provisionales de la Administración no recurridas."
  explanation:
    es: "Son inaplazables las deudas que resultan de ejecutar decisiones de recuperación de ayudas de Estado (artículo 65.2.d). Las sentencias estimatorias, las actas en disconformidad y las liquidaciones provisionales no figuran entre las exclusiones del artículo 65.2."
  citation: "art. 65.2.d LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0108
  prompt:
    es: "Sobre las deudas que no pueden aplazarse, conforme al artículo 65.2.e de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Son inaplazables las resultantes de resoluciones firmes desestimatorias de cualquier recurso, aunque no se hubiera suspendido."
  - id: b
    correct: true
    text:
      es: "Son inaplazables las resultantes de resoluciones firmes desestimatorias de un recurso que previamente se suspendió durante su tramitación."
  - id: c
    text:
      es: "Son inaplazables las resultantes de resoluciones estimatorias de un recurso que previamente se suspendió."
  - id: d
    text:
      es: "Son inaplazables las resultantes de resoluciones desestimatorias que no sean firmes aún."
  explanation:
    es: "No son aplazables las deudas de la ejecución de resoluciones firmes, total o parcialmente desestimatorias, de un recurso o reclamación que previamente fue objeto de suspensión (artículo 65.2.e). La suspensión previa es requisito. Una resolución estimatoria no genera esa deuda. La resolución debe ser firme."
  citation: "art. 65.2.e LGT"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0109
  prompt:
    es: "De acuerdo con el artículo 65.2.f de la Ley 58/2003, de 17 de diciembre, General Tributaria, no podrán ser objeto de aplazamiento o fraccionamiento las deudas derivadas de tributos que deban ser legalmente repercutidos:"
  options:
  - id: a
    text:
      es: "Salvo que el obligado acredite que ha repercutido las cuotas a todos sus clientes."
  - id: b
    text:
      es: "Salvo que la deuda esté garantizada con aval solidario de entidad de crédito."
  - id: c
    text:
      es: "Salvo que la Administración autorice el aplazamiento en consideración a la cuantía de la deuda aplazada."
  - id: d
    correct: true
    text:
      es: "Salvo que se justifique debidamente que las cuotas repercutidas no han sido efectivamente pagadas."
  explanation:
    es: "Estas deudas son inaplazables salvo que se justifique que las cuotas repercutidas no han sido efectivamente pagadas (artículo 65.2.f). Haber repercutido las cuotas no es la excepción. El aval y la cuantía de la deuda tampoco abren ese supuesto."
  citation: "art. 65.2.f LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0110
  prompt:
    es: "¿Cuáles de las siguientes obligaciones tributarias dan lugar a deudas inaplazables conforme al artículo 65.2.g de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Las correspondientes al obligado a realizar pagos fraccionados del Impuesto sobre Sociedades."
  - id: b
    text:
      es: "Las correspondientes al obligado a presentar la declaración anual del Impuesto sobre Sociedades."
  - id: c
    text:
      es: "Las correspondientes a la cuota diferencial del Impuesto sobre la Renta de las Personas Físicas."
  - id: d
    text:
      es: "Las correspondientes al obligado a presentar autoliquidaciones trimestrales del Impuesto sobre el Valor Añadido."
  explanation:
    es: "Las obligaciones del obligado a realizar pagos fraccionados del Impuesto sobre Sociedades dan lugar a deudas inaplazables (artículo 65.2.g). La declaración anual del impuesto, la cuota diferencial del IRPF y las autoliquidaciones trimestrales del IVA no están entre las exclusiones."
  citation: "art. 65.2.g LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "deudas inaplazables"
# anchor: boe-a-2005-14803-art-44
- id: m03-l09-q0111
  prompt:
    es: "Conforme al artículo 44.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, serán aplazables o fraccionables todas las deudas tributarias y demás de naturaleza pública cuya titularidad corresponda a la Hacienda pública:"
  options:
  - id: a
    text:
      es: "Salvo las deudas de cuantía inferior a 50.000 euros."
  - id: b
    text:
      es: "Salvo las deudas que se encuentren en período ejecutivo."
  - id: c
    correct: true
    text:
      es: "Salvo las excepciones previstas en las leyes."
  - id: d
    text:
      es: "Salvo las que el órgano competente decida excluir en cada caso."
  explanation:
    es: "Todas las deudas tributarias y demás de naturaleza pública de la Hacienda pública son aplazables, salvo las excepciones que prevean las leyes (artículo 44.2). Las deudas pequeñas no quedan excluidas y las del período ejecutivo también pueden aplazarse. No hay exclusión discrecional del órgano."
  citation: "art. 44.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "deudas aplazables"
# anchor: boe-a-2005-14803-art-45
- id: m03-l09-q0112
  prompt:
    es: "Según el artículo 45.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿quién tramita y resuelve las solicitudes de aplazamiento o fraccionamiento de las deudas cuya recaudación lleva a cabo la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    text:
      es: "La Dirección General del Tesoro y Política Financiera, de forma subsidiaria."
  - id: b
    correct: true
    text:
      es: "La propia Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "El Tribunal Económico-Administrativo Central."
  - id: d
    text:
      es: "El Servicio Jurídico del Estado."
  explanation:
    es: "Las solicitudes sobre deudas que recauda la Agencia Tributaria se tramitan y resuelven por ella misma (artículo 45.1). La Dirección General del Tesoro y Política Financiera, el Tribunal Económico-Administrativo Central y el Servicio Jurídico del Estado no son los competentes en ese caso."
  citation: "art. 45.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "competencia"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0113
  prompt:
    es: "De acuerdo con el artículo 46.1.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las solicitudes de aplazamiento o fraccionamiento de las deudas que se encuentren en período ejecutivo podrán presentarse:"
  options:
  - id: a
    text:
      es: "En cualquier momento anterior a la notificación de la providencia de apremio."
  - id: b
    correct: true
    text:
      es: "En cualquier momento anterior a la notificación del acuerdo de enajenación de los bienes."
  - id: c
    text:
      es: "Dentro de los diez días siguientes a la notificación de la providencia de apremio."
  - id: d
    text:
      es: "Hasta la fecha en que se practique el embargo de los bienes del deudor."
  explanation:
    es: "En período ejecutivo la solicitud puede presentarse en cualquier momento anterior a la notificación del acuerdo de enajenación de los bienes (artículo 46.1.b). No hay que anticiparse a la providencia de apremio. Tampoco rige un plazo de diez días ni el límite del embargo."
  citation: "art. 46.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "solicitud"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0115
  prompt:
    es: "En las deudas resultantes de autoliquidaciones presentadas fuera de plazo, conforme al artículo 46.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el período en que se entiende presentada la solicitud de aplazamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo se entiende presentada en período voluntario cuando se presenta junto con la autoliquidación extemporánea."
  - id: b
    text:
      es: "Siempre se entiende presentada en período voluntario, aunque se presente después de la autoliquidación."
  - id: c
    text:
      es: "Siempre se entiende presentada en período ejecutivo, porque la autoliquidación se presentó fuera de plazo."
  - id: d
    text:
      es: "Se entiende presentada en período voluntario cuando se presenta hasta diez días después de la autoliquidación extemporánea."
  explanation:
    es: "Con una autoliquidación extemporánea, la solicitud solo se entiende presentada en período voluntario si se presenta junto con ella (artículo 46.1.a). Presentada después, no goza de esa condición. No es siempre voluntario ni siempre ejecutivo, y no hay plazo de diez días. En el examen 2022X (pregunta 69) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 46.1.a RGR"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "solicitud"
  - "autoliquidación extemporánea"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0116
  prompt:
    es: "Conforme al artículo 46.3.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, a la solicitud de aplazamiento o fraccionamiento deberá acompañarse, en particular, justificación de que existen:"
  options:
  - id: a
    text:
      es: "Dificultades económico-financieras que impidan de forma definitiva efectuar el pago de la deuda."
  - id: b
    text:
      es: "Bienes suficientes del obligado para garantizar la deuda con una hipoteca inmobiliaria."
  - id: c
    text:
      es: "Créditos a favor del obligado frente a la Administración que permitan compensar la deuda."
  - id: d
    correct: true
    text:
      es: "Dificultades económico-financieras que impidan de forma transitoria efectuar el pago en el plazo establecido."
  explanation:
    es: "El solicitante debe justificar dificultades económico-financieras que le impidan pagar de forma transitoria en el plazo (artículo 46.3.c). La imposibilidad definitiva no es el supuesto. Tampoco se exige acreditar bienes para una hipoteca, ni créditos que permitan compensar."
  citation: "art. 46.3 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "solicitud"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0117
  prompt:
    es: "De acuerdo con el artículo 46.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si la solicitud de aplazamiento o fraccionamiento no reúne los requisitos o no se acompañan los documentos, el órgano competente requerirá al solicitante para que subsane el defecto o aporte los documentos en un plazo de:"
  options:
  - id: a
    text:
      es: "Cinco días contados a partir del siguiente al de la notificación del requerimiento."
  - id: b
    text:
      es: "Quince días contados a partir del siguiente al de la notificación del requerimiento."
  - id: c
    text:
      es: "Un mes contado a partir del siguiente al de la notificación del requerimiento."
  - id: d
    correct: true
    text:
      es: "Diez días contados a partir del siguiente al de la notificación del requerimiento."
  explanation:
    es: "El plazo de subsanación es de diez días contados desde el siguiente al de la notificación del requerimiento (artículo 46.6). Cinco, quince días y un mes son plazos de otros trámites de la normativa tributaria, pero no el de este requerimiento."
  citation: "art. 46.6 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "solicitud"
  - "subsanación"
