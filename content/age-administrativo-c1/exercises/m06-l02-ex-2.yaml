# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q028
  prompt:
    es: "En Windows 11, con la Lupa activada, ¿cuál de los siguientes métodos abreviados de teclado invierte los colores de la pantalla?"
  options:
  - id: a
    text:
      es: "Ctrl+Alt+L"
  - id: b
    text:
      es: "Ctrl+Alt+D"
  - id: c
    correct: true
    text:
      es: "Ctrl+Alt+I"
  - id: d
    text:
      es: "Ctrl+Alt+M"
  explanation:
    es: "La página dice que, con la Lupa activada, Ctrl+Alt+I invierte los colores y que volver a pulsarlo los devuelve a la normalidad. Ctrl+Alt+L pasa a la vista de lente, Ctrl+Alt+D a la vista acoplada y Ctrl+Alt+M recorre las vistas."
  citation: "fuente: `ms-win-lupa.html`; «Invertir colores»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q029
  prompt:
    es: "En Windows 11, con la Lupa activada, ¿cuál de las siguientes vistas de la Lupa se usa al pulsar el método abreviado Ctrl+Alt+L?"
  options:
  - id: a
    correct: true
    text:
      es: "La vista de lente"
  - id: b
    text:
      es: "La vista acoplada"
  - id: c
    text:
      es: "La vista de pantalla completa"
  - id: d
    text:
      es: "La vista de lectura"
  explanation:
    es: "Según la página, Ctrl+Alt+L activa la vista de lente. La vista acoplada se activa con Ctrl+Alt+D y la de pantalla completa con Ctrl+Alt+F; una «vista de lectura» no es ninguna de las vistas de la Lupa que la página enumera."
  citation: "fuente: `ms-win-lupa.html`; «Cambiar la vista de la Lupa»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q030
  prompt:
    es: "En Windows 11, con la Lupa activada, ¿cuál de los siguientes métodos abreviados permite desplazarse entre sus vistas para compararlas?"
  options:
  - id: a
    text:
      es: "Ctrl+Alt+F"
  - id: b
    correct: true
    text:
      es: "Ctrl+Alt+M"
  - id: c
    text:
      es: "Ctrl+Alt+I"
  - id: d
    text:
      es: "Ctrl+Alt+L"
  explanation:
    es: "La página dice: «Para desplazarse entre las vistas, presione Ctrl+Alt+M», y que sirve para comparar rápidamente las vistas. Ctrl+Alt+F pasa directamente a la vista de pantalla completa, Ctrl+Alt+L a la de lente, y Ctrl+Alt+I invierte los colores."
  citation: "fuente: `ms-win-lupa.html`; «Cambiar la vista de la Lupa»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q031
  prompt:
    es: "En Windows 11, ¿qué hace el método abreviado de teclado Windows+Ctrl+M en relación con la Lupa?"
  options:
  - id: a
    text:
      es: "Activa la Lupa con el nivel de zoom predeterminado."
  - id: b
    text:
      es: "Cierra la Lupa y devuelve la pantalla a su tamaño."
  - id: c
    text:
      es: "Invierte los colores de la pantalla mientras la Lupa está activa."
  - id: d
    correct: true
    text:
      es: "Abre la vista de configuración de la Lupa."
  explanation:
    es: "La página repite que Windows+Ctrl+M sirve «para abrir la vista de configuración de la Lupa». La Lupa se activa con Windows+signo más (+), se cierra con Windows+Esc, y los colores se invierten con Ctrl+Alt+I."
  citation: "fuente: `ms-win-lupa.html`; «Personalizar el nivel de zoom de Lupa»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q032
  prompt:
    es: "En Windows 11, en la configuración de la Lupa, ¿cuál de las siguientes afirmaciones describe el apartado «Que mi Lupa lo siguiera» de la sección Ver?"
  options:
  - id: a
    text:
      es: "Ofrece puntero del mouse, foco del teclado, cursor de texto y cursor del Narrador, pero solo uno a la vez."
  - id: b
    text:
      es: "Ofrece solo el puntero del mouse y el cursor de texto, en cualquier combinación."
  - id: c
    correct: true
    text:
      es: "Ofrece puntero del mouse, foco del teclado, cursor de texto y cursor del Narrador, en cualquier combinación."
  - id: d
    text:
      es: "Ofrece puntero del mouse, foco del teclado y cursor de texto, pero no el cursor del Narrador."
  explanation:
    es: "La página enumera en «Que mi Lupa lo siguiera» las casillas puntero del mouse, foco del teclado, cursor de texto y cursor del Narrador, y añade que «se puede seleccionar en cualquier combinación». Limitarlo a una casilla a la vez, quitar el foco del teclado o quitar el cursor del Narrador contradice la página."
  citation: "fuente: `ms-win-lupa.html`; «Cambiar lo que sigue la vista Lupa»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q033
  prompt:
    es: "En Windows 11, ¿qué hace la Lupa, una de las herramientas de accesibilidad del sistema operativo?"
  options:
  - id: a
    text:
      es: "Controla el PC y escribe texto mediante comandos de voz."
  - id: b
    text:
      es: "Muestra miniaturas de las otras ventanas abiertas para acoplarlas."
  - id: c
    text:
      es: "Captura una zona de la pantalla y la copia al portapapeles."
  - id: d
    correct: true
    text:
      es: "Amplía toda la pantalla o parte de ella para ver mejor."
  explanation:
    es: "La página define la Lupa: «amplía toda la pantalla o parte de ella para poder ver mejor las palabras e imágenes». Controlar el PC con la voz es Acceso por voz, mostrar miniaturas para acoplar ventanas es el Asistente para el ajuste, y capturar una zona al portapapeles es Windows+Mayús+S."
  citation: "fuente: `ms-win-lupa.html`; «Usar la Lupa en Windows 11»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q034
  prompt:
    es: "En Windows 11, con la Lupa activada, ¿qué hace el método abreviado de teclado Ctrl+Alt+signo menos (-)?"
  options:
  - id: a
    correct: true
    text:
      es: "Cambia entre la ampliación establecida y el aumento de 1x."
  - id: b
    text:
      es: "Aleja la imagen un incremento de zoom de la Lupa."
  - id: c
    text:
      es: "Cierra la Lupa y restaura el tamaño normal de la pantalla."
  - id: d
    text:
      es: "Pasa a la vista acoplada de la Lupa."
  explanation:
    es: "La página dice que Ctrl+Alt+signo menos (-) sirve «para cambiar entre el nivel de ampliación establecido y el aumento de 1x». Alejar con la Lupa es Windows+signo menos (-), cerrarla es Windows+Esc, y la vista acoplada es Ctrl+Alt+D."
  citation: "fuente: `ms-win-lupa.html`; «Cambiar la vista de la Lupa»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-cortana-fin-soporte-html
- id: m06-l02-q035
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes características permite controlar el PC y escribir texto con la voz?"
  options:
  - id: a
    text:
      es: "Narrador"
  - id: b
    correct: true
    text:
      es: "Acceso por voz"
  - id: c
    text:
      es: "Lupa"
  - id: d
    text:
      es: "Asistencia rápida"
  explanation:
    es: "Microsoft presenta Acceso por voz como la característica de Windows 11 que permite «controlar su PC y escribir texto con su voz». El Narrador lee la pantalla, la Lupa la amplía y Asistencia rápida, que se abre con Windows+Ctrl+Q, es otra herramienta."
  citation: "fuente: `ms-cortana-fin-soporte.html`; «Acceso por voz en Windows 11»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-cortana-fin-soporte-html
- id: m06-l02-q036
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre la característica Acceso por voz es correcta?"
  options:
  - id: a
    text:
      es: "Necesita conexión a Internet para reconocer la voz del usuario."
  - id: b
    text:
      es: "Funciona sin conexión, pero solo sirve para dictar texto."
  - id: c
    correct: true
    text:
      es: "Funciona sin conexión y usa el reconocimiento de voz avanzado."
  - id: d
    text:
      es: "Funciona sin conexión, pero solo con aplicaciones de Microsoft 365."
  explanation:
    es: "La página dice que «el acceso de voz funciona sin conexión y usa el reconocimiento de voz avanzado». Necesitar Internet contradice «sin conexión». Servir solo para dictar contradice la misma página, que le atribuye abrir y cambiar entre aplicaciones, navegar por la web y leer y escribir correos, además de escribir texto. Y limitarlo a las aplicaciones de Microsoft 365 no cuadra con esa lista: la página lo presenta como control del PC y no lo liga a Microsoft 365, que es el ámbito de otra característica distinta, Copilot en aplicaciones de Microsoft 365."
  citation: "fuente: `ms-cortana-fin-soporte.html`; «Acceso por voz en Windows 11»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-cortana-fin-soporte-html
- id: m06-l02-q037
  prompt:
    es: "En Windows 11, ¿qué tareas pueden hacerse con los comandos de voz de Acceso por voz, según Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir y cambiar aplicaciones, navegar por la web y leer y escribir correos."
  - id: b
    text:
      es: "Solo dictar texto en los cuadros de texto de las aplicaciones que están abiertas."
  - id: c
    text:
      es: "Solo abrir las aplicaciones ancladas en la barra de tareas."
  - id: d
    text:
      es: "Ampliar la pantalla y leer en voz alta los botones de cada ventana."
  explanation:
    es: "Según la página, con Acceso por voz se pueden usar comandos de voz «para abrir y cambiar entre aplicaciones, navegar por la web y leer y escribir correos electrónicos». Limitarlo a dictar o a abrir aplicaciones ancladas recorta lo que dice la página; ampliar la pantalla y leer los botones son la Lupa y el Narrador."
  citation: "fuente: `ms-cortana-fin-soporte.html`; «Acceso por voz en Windows 11»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q038
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas permite comprobar qué idiomas están instalados en el sistema?"
  options:
  - id: a
    text:
      es: "Configuración › Sistema › Idioma & región"
  - id: b
    correct: true
    text:
      es: "Configuración › Hora & idioma › Idioma & región"
  - id: c
    text:
      es: "Configuración › Personalización › Idioma & región"
  - id: d
    text:
      es: "Configuración › Accesibilidad › Idioma & región"
  explanation:
    es: "La página manda abrir Configuración, seleccionar Hora & idioma y luego Idioma & región; los idiomas instalados aparecen en la sección Idioma. Sistema, Personalización y Accesibilidad son otros apartados de Configuración que no contienen esa página."
  citation: "fuente: `ms-win-idioma.html`; «Seleccione la hora & el idioma > Idioma & región .»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q039
  prompt:
    es: "En Windows 11, con varios idiomas instalados, ¿qué determina el idioma para mostrar de Windows?"
  options:
  - id: a
    text:
      es: "Solo la distribución del teclado con la que se escribe en el sistema."
  - id: b
    text:
      es: "Solo el idioma de las aplicaciones y los sitios web de Microsoft Store."
  - id: c
    text:
      es: "El idioma de la región, pero no el de la interfaz de usuario."
  - id: d
    correct: true
    text:
      es: "El idioma de la interfaz de usuario y de características como Configuración."
  explanation:
    es: "La página dice que el idioma para mostrar «determina el idioma que usa la interfaz de usuario de Windows» y el de características como la aplicación Configuración y el Explorador de archivos. La distribución del teclado es un ajuste aparte; las aplicaciones de Microsoft Store usan el primer idioma admitido de la lista de idiomas preferidos; y la interfaz sí depende del idioma para mostrar."
  citation: "fuente: `ms-win-idioma.html`; «Cambiar el idioma de visualización de Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q040
  prompt:
    es: "Señale cuál de las siguientes afirmaciones sobre la distribución del teclado en Windows 11 es correcta:"
  options:
  - id: a
    text:
      es: "Cambiarla cambia también el idioma para mostrar de Windows tras cerrar sesión."
  - id: b
    text:
      es: "Solo puede ser una distribución del mismo idioma que el idioma para mostrar."
  - id: c
    correct: true
    text:
      es: "Cambiarla solo cambia el diseño y no cambia el idioma para mostrar de Windows."
  - id: d
    text:
      es: "Solo puede cambiarse desde Configuración, nunca desde la pantalla de inicio de sesión."
  explanation:
    es: "La página dice que «cambiar la distribución del teclado solo cambia el diseño y no cambia el idioma para mostrar de Windows». También dice que todos los idiomas tienen distribuciones de teclado en varios idiomas distintos y que la distribución se puede cambiar en la pantalla de inicio de sesión con el icono de idioma de entrada."
  citation: "fuente: `ms-win-idioma.html`; «Cambiar el idioma de visualización de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q041
  prompt:
    es: "En Windows 11, ¿qué condición debe cumplir un idioma para poder instalar sus características de voz, como Texto a voz?"
  options:
  - id: a
    text:
      es: "Ocupar el último lugar de la lista de idiomas preferidos."
  - id: b
    correct: true
    text:
      es: "Estar establecido como idioma para mostrar de Windows."
  - id: c
    text:
      es: "Tener instalada una segunda distribución de teclado."
  - id: d
    text:
      es: "Estar instalado sin el paquete de idioma completo."
  explanation:
    es: "Entre los pasos para instalar la voz de un idioma, la página exige asegurarse de que ese idioma «está establecido como idioma para mostrar». La posición en la lista de idiomas preferidos y una segunda distribución de teclado no son requisitos de la voz, y la página tampoco habla de instalar la voz sin el paquete de idioma."
  citation: "fuente: `ms-win-idioma.html`; «Instalar la voz de un idioma»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q042
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes elementos determina el idioma que usan las aplicaciones y los sitios web de Microsoft Store?"
  options:
  - id: a
    correct: true
    text:
      es: "El primer idioma admitido en la lista de idiomas preferidos."
  - id: b
    text:
      es: "El último idioma instalado en la ventana Idioma & región."
  - id: c
    text:
      es: "La distribución del teclado seleccionada en la barra de tareas."
  - id: d
    text:
      es: "El último idioma admitido en la lista de idiomas preferidos."
  explanation:
    es: "La página dice que «el primer idioma admitido en la lista de idiomas preferidos determina el idioma que usan las aplicaciones y los sitios web de Microsoft Store», y que por eso se arrastra el idioma deseado a la parte superior. Ni el último idioma instalado, ni el último de la lista, ni la distribución del teclado deciden ese idioma."
  citation: "fuente: `ms-win-idioma.html`; «Cambiar el idioma usado por las aplicaciones y los sitios web de Microsoft Store»"
  difficulty: 3
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q043
  prompt:
    es: "En Windows 11, después de elegir un nuevo idioma para mostrar en la ventana Idioma & región, ¿qué hay que hacer para que se aplique?"
  options:
  - id: a
    text:
      es: "Pulsar Windows+Barra espaciadora hasta seleccionarlo."
  - id: b
    text:
      es: "Moverlo al último lugar de la lista de idiomas preferidos."
  - id: c
    text:
      es: "Quitar antes la distribución del teclado del idioma anterior."
  - id: d
    correct: true
    text:
      es: "Cerrar la sesión de Windows y volver a iniciarla."
  explanation:
    es: "La página muestra el mensaje «Windows necesita cerrar tu sesión para aplicar el nuevo idioma para mostrar» y, tras volver a iniciar sesión, se aplica. Windows+Barra espaciadora recorre las distribuciones del teclado; la posición en la lista de idiomas preferidos afecta a Microsoft Store; y quitar una distribución de teclado no aplica el idioma."
  citation: "fuente: `ms-win-idioma.html`; «Cambiar el idioma de visualización de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q044
  prompt:
    es: "En Windows 11, en la ventana Idioma & región, ¿por qué aparece atenuado el botón Quitar de un idioma instalado?"
  options:
  - id: a
    text:
      es: "Porque ese idioma tiene instaladas características de voz."
  - id: b
    text:
      es: "Porque ese idioma ocupa el último lugar de los idiomas preferidos."
  - id: c
    correct: true
    text:
      es: "Porque ese idioma es el idioma para mostrar actual de Windows."
  - id: d
    text:
      es: "Porque el dispositivo no está conectado a Internet en ese momento."
  explanation:
    es: "La página dice: «Si el botón Quitar está atenuado, el idioma seleccionado que se va a quitar es el idioma para mostrar actual de Windows», y que hay que cambiar antes a otro idioma para mostrar. Las características de voz, la posición en la lista y la conexión a Internet no son la causa que da la página."
  citation: "fuente: `ms-win-idioma.html`; «Quitar un paquete de idioma»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q045
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados recorre, con cada pulsación, las distribuciones del teclado instaladas?"
  options:
  - id: a
    text:
      es: "Ctrl+Barra espaciadora"
  - id: b
    correct: true
    text:
      es: "Windows+Barra espaciadora"
  - id: c
    text:
      es: "Alt+Barra espaciadora"
  - id: d
    text:
      es: "Windows+Tab"
  explanation:
    es: "La página dice que, manteniendo pulsada la tecla Windows, cada pulsación de la barra espaciadora recorre las distribuciones del teclado instaladas. Según la tabla de métodos abreviados, Ctrl+Barra espaciadora activa o desactiva el IME para chino, Alt+Barra espaciadora abre el menú contextual de la ventana activa y Windows+Tab abre la Vista de tareas."
  citation: "fuente: `ms-win-idioma.html`; «Cambiar la distribución del teclado»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-idioma-html
- id: m06-l02-q046
  prompt:
    es: "En Windows 11, al intentar agregar un paquete de idioma, ¿cuál de los siguientes mensajes indica que puede estar instalada una edición de un solo idioma?"
  options:
  - id: a
    text:
      es: "Windows necesita cerrar tu sesión para aplicar el nuevo idioma para mostrar."
  - id: b
    text:
      es: "Espera mientras el idioma termina de instalarse."
  - id: c
    text:
      es: "Este idioma no tiene características de voz disponibles."
  - id: d
    correct: true
    text:
      es: "Su licencia de Windows admite solo un idioma para mostrar."
  explanation:
    es: "La página dice que es posible que se haya instalado una edición de un solo idioma si aparece «Solo se permite un paquete de idioma» o «Su licencia de Windows admite solo un idioma para mostrar». El mensaje de cerrar sesión aparece al aplicar un idioma para mostrar, el de espera durante la instalación, y la falta de características de voz no indica la edición."
  citation: "fuente: `ms-win-idioma.html`; «Instalar un paquete de idioma»"
  difficulty: 3
  tags:
  - "comportamiento"
