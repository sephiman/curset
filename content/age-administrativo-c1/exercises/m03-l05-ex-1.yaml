# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q026
  prompt:
    es: "Si las leyes no fijan plazos de prescripción, ¿en qué clase de faltas prescribe la sanción en un plazo mayor que la infracción, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "En las graves: la infracción prescribe al año y la sanción a los dos años."
  - id: b
    correct: true
    text:
      es: "En las leves: la infracción prescribe a los seis meses y la sanción al año."
  - id: c
    text:
      es: "En las muy graves: la infracción prescribe a los tres años y la sanción a los cinco."
  - id: d
    text:
      es: "En ninguna: la infracción y la sanción prescriben siempre en el mismo plazo."
  explanation:
    es: "El artículo 30.1 fija para las leves seis meses la infracción y un año la sanción: es la única clase en que los plazos difieren. En las graves, infracción y sanción prescriben a los dos años; en las muy graves, a los tres. Por eso falla también la opción que dice que nunca difieren."
  citation: "art. 30.1 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
