# anchor: celex-12016m-txt-art-16
- id: m01-l10-q010
  prompt:
    es: "Según el artículo 16 del Tratado de la Unión Europea, ¿con qué institución ejerce el Consejo conjuntamente la función legislativa y la función presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Con el Parlamento Europeo."
  - id: b
    text:
      es: "Con la Comisión Europea."
  - id: c
    text:
      es: "Con el Consejo Europeo."
  - id: d
    text:
      es: "Con el Tribunal de Cuentas."
  explanation:
    es: "El artículo 16.1 TUE dice que «el Consejo ejercerá conjuntamente con el Parlamento Europeo la función legislativa y la función presupuestaria». La Comisión propone los actos legislativos (art. 17.2 TUE) y ejecuta el presupuesto, pero no comparte esas funciones. El Consejo Europeo no ejerce función legislativa alguna (art. 15.1 TUE). El Tribunal de Cuentas no tiene funciones legislativas."
  citation: "art. 16.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: celex-12016m-txt-art-16
- id: m01-l10-q011
  prompt:
    es: "Señale la respuesta correcta sobre la composición del Consejo de la Unión Europea, conforme a lo establecido en el Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Lo componen los Jefes de Estado o de Gobierno de los Estados miembros, su Presidente y el Presidente de la Comisión."
  - id: b
    correct: true
    text:
      es: "Lo compone un representante de cada Estado miembro, de rango ministerial, facultado para comprometer al Gobierno de su Estado y para ejercer el derecho de voto."
  - id: c
    text:
      es: "Lo compone un representante de cada Estado miembro, de rango ministerial o de embajador, sin derecho de voto."
  - id: d
    text:
      es: "Lo componen los representantes permanentes de los Gobiernos de los Estados miembros, con rango de embajador."
  explanation:
    es: "El artículo 16.2 TUE dice que el Consejo «estará compuesto por un representante de cada Estado miembro, de rango ministerial, facultado para comprometer al Gobierno del Estado miembro al que represente y para ejercer el derecho de voto». Los Jefes de Estado o de Gobierno forman el Consejo Europeo (art. 15.2 TUE). El representante vota, y los representantes permanentes forman el comité que prepara los trabajos del Consejo (art. 16.7 TUE), no el Consejo."
  citation: "art. 16.2 TUE"
  difficulty: 1
  tags:
  - "composición"
# anchor: celex-32009d0937-art-1
- id: m01-l10-q013
  prompt:
    es: "De acuerdo con el artículo 1 del Reglamento interno del Consejo, aprobado por la Decisión 2009/937/UE del Consejo, de 1 de diciembre de 2009:"
  options:
  - id: a
    text:
      es: "El Consejo tendrá su sede en Luxemburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: b
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Estrasburgo."
  - id: c
    text:
      es: "El Consejo tendrá su sede en Estrasburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: d
    correct: true
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Luxemburgo."
  explanation:
    es: "El artículo 1.3 del Reglamento interno dice: «El Consejo tendrá su sede en Bruselas. Durante los meses de abril, junio y octubre, el Consejo celebrará sus sesiones en Luxemburgo». Las otras opciones invierten las ciudades o ponen Estrasburgo, que es la sede del Parlamento Europeo."
  citation: "art. 1.3 Reglamento interno del Consejo"
  difficulty: 1
  tags:
  - "fecha"
  - "estructura"
# anchor: celex-12016m-txt-art-16
- id: m01-l10-q014
  prompt:
    es: "Como regla general, y excepto cuando los Tratados dispongan otra cosa, ¿por qué mayoría se pronuncia el Consejo de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría cualificada."
  - id: b
    text:
      es: "Por unanimidad de sus miembros."
  - id: c
    text:
      es: "Por mayoría simple de sus miembros."
  - id: d
    text:
      es: "Por consenso de sus miembros."
  explanation:
    es: "El artículo 16.3 TUE dice que «el Consejo se pronunciará por mayoría cualificada, excepto cuando los Tratados dispongan otra cosa». La unanimidad y la mayoría simple solo se aplican cuando un artículo concreto las exige. El consenso es la regla general del Consejo Europeo (art. 15.4 TUE)."
  citation: "art. 16.3 TUE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-238
- id: m01-l10-q015
  prompt:
    es: "De acuerdo con el artículo 238 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo no actúe a propuesta de la Comisión o del Alto Representante, la mayoría cualificada se definirá como un mínimo:"
  options:
  - id: a
    text:
      es: "Del 55 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: b
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 55 % de la población de la Unión."
  - id: c
    correct: true
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: d
    text:
      es: "Del 65 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 72 % de la población de la Unión."
  explanation:
    es: "El artículo 238.2 TFUE, «no obstante lo dispuesto en el apartado 4 del artículo 16» TUE, fija para este caso «un mínimo del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión». El 55 % de miembros es la regla general del artículo 16.4 TUE, que aquí no se aplica. Las otras dos opciones alteran o intercambian los porcentajes."
  citation: "art. 238.2 TFUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "excepción"
  - "cantidad"
# anchor: celex-12016e-txt-art-236
- id: m01-l10-q049
  prompt:
    es: "De acuerdo con el artículo 236 del Tratado de Funcionamiento de la Unión Europea, la decisión que establece la lista de las formaciones del Consejo distintas de la de Asuntos Generales y la de Asuntos Exteriores la adopta:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad de sus miembros."
  - id: b
    correct: true
    text:
      es: "El Consejo Europeo, por mayoría cualificada."
  - id: c
    text:
      es: "El Consejo, por mayoría simple de sus miembros."
  - id: d
    text:
      es: "El Consejo, por mayoría cualificada, a propuesta de la Comisión."
  explanation:
    es: "La opción correcta es el Consejo Europeo por mayoría cualificada: el artículo 236 TFUE dice que «el Consejo Europeo adoptará por mayoría cualificada» la decisión con la lista de las formaciones del Consejo distintas de Asuntos Generales y Asuntos Exteriores. El artículo no exige unanimidad. La decisión no la adopta el propio Consejo, ni por mayoría simple ni a propuesta de la Comisión."
  citation: "art. 236 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: celex-12016m-txt-art-16
- id: m01-l10-q052
  prompt:
    es: "Según el artículo 16 del Tratado de la Unión Europea, ¿qué formación del Consejo prepara las reuniones del Consejo Europeo y garantiza su actuación subsiguiente?"
  options:
  - id: a
    text:
      es: "El Consejo de Asuntos Exteriores, presidido por el Alto Representante de la Unión."
  - id: b
    text:
      es: "El Consejo de Asuntos Económicos y Financieros, en contacto con el Presidente de la Comisión."
  - id: c
    correct: true
    text:
      es: "El Consejo de Asuntos Generales."
  - id: d
    text:
      es: "El Consejo de Justicia y Asuntos de Interior, en contacto con el Presidente del Consejo Europeo."
  explanation:
    es: "La opción correcta es el Consejo de Asuntos Generales: el artículo 16.6 TUE dice que esta formación «preparará las reuniones del Consejo Europeo y garantizará su actuación subsiguiente». El Consejo de Asuntos Exteriores, que preside el Alto Representante, elabora la acción exterior de la Unión. Los Consejos de Asuntos Económicos y Financieros y de Justicia y Asuntos de Interior existen, pero el artículo no les da esta función."
  citation: "art. 16.6 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: celex-32009d0937-art-1
- id: m01-l10-q065
  prompt:
    es: "Según el Reglamento interno del Consejo, aprobado por la Decisión 2009/937/UE, cuando concurran circunstancias excepcionales, el Consejo o el Coreper pueden decidir que una sesión del Consejo se celebre en otro lugar:"
  options:
