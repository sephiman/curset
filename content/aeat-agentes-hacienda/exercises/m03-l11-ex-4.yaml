# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0015
  prompt:
    es: "De acuerdo con el artículo 161.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el inicio del período ejecutivo determinará la exigencia de los intereses de demora y de los recargos del período ejecutivo y, en su caso:"
  options:
  - id: a
    correct: true
    text:
      es: "De las costas del procedimiento de apremio."
  - id: b
    text:
      es: "De las sanciones tributarias pendientes de resolución."
  - id: c
    text:
      es: "De un nuevo plazo voluntario para pagar sin recargo."
  - id: d
    text:
      es: "De los recargos por declaración extemporánea."
  explanation:
    es: "El inicio del período ejecutivo determina intereses, recargos y, en su caso, las costas del procedimiento de apremio. Las sanciones se rigen por su propio régimen, no por este efecto. No se abre otro plazo voluntario, porque el voluntario ya terminó. Y el recargo por declaración extemporánea es del artículo 27, ajeno al período ejecutivo."
  citation: "art. 161.4 LGT"
  difficulty: 1
  tags:
  - "período ejecutivo"
  - "efectos"
# anchor: boe-a-2003-23186-art-160
- id: m03-l11-q0053
  prompt:
    es: "De acuerdo con el artículo 160.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la recaudación tributaria consiste en:"
  options:
  - id: a
    text:
      es: "El ejercicio de las funciones administrativas conducentes a la liquidación de las deudas tributarias."
  - id: b
    text:
      es: "El ejercicio de las potestades jurisdiccionales conducentes al cobro forzoso de las deudas tributarias."
  - id: c
    correct: true
    text:
      es: "El ejercicio de las funciones administrativas conducentes al cobro de las deudas tributarias."
  - id: d
    text:
      es: "El conjunto de actuaciones de comprobación conducentes a la determinación de las deudas tributarias."
  explanation:
    es: "La recaudación consiste en el ejercicio de las funciones administrativas conducentes al cobro de las deudas. La liquidación y la comprobación son otras fases, que fijan la deuda, no la cobran. Y el cobro forzoso en período ejecutivo es administrativo, no jurisdiccional."
  citation: "art. 160.1 LGT"
  difficulty: 1
  tags:
  - "recaudación"
  - "concepto"
# anchor: boe-a-2003-23186-art-160
- id: m03-l11-q0054
  prompt:
    es: "Conforme al artículo 160.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre cómo puede realizarse la recaudación de las deudas tributarias en período ejecutivo:"
  options:
  - id: a
    text:
      es: "Mediante el pago o cumplimiento del obligado tributario en los plazos previstos en el artículo 62, sin posibilidad de apremio."
  - id: b
    text:
      es: "Mediante el procedimiento administrativo de apremio, sin que el obligado pueda pagar o cumplir espontáneamente."
  - id: c
    correct: true
    text:
      es: "Mediante el pago o cumplimiento espontáneo del obligado tributario o, en su defecto, a través del procedimiento administrativo de apremio."
  - id: d
    text:
      es: "Mediante el procedimiento judicial de ejecución, ante el juzgado competente del domicilio del obligado."
  explanation:
    es: "En período ejecutivo la recaudación se hace por pago o cumplimiento espontáneo o, en su defecto, por apremio. Los plazos del artículo 62 son la recaudación en período voluntario. El apremio no excluye el pago espontáneo, y la vía judicial no es la prevista: el apremio es exclusivamente administrativo."
  citation: "art. 160.2 LGT"
  difficulty: 3
  tags:
  - "recaudación"
  - "período ejecutivo"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0055
  prompt:
    es: "Según el artículo 161.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el caso de deudas liquidadas por la Administración tributaria, el período ejecutivo se inicia:"
  options:
  - id: a
    text:
      es: "El mismo día del vencimiento del plazo establecido para su ingreso en el artículo 62."
  - id: b
    text:
      es: "El día siguiente al de la notificación de la providencia de apremio al obligado."
  - id: c
    correct: true
    text:
      es: "El día siguiente al del vencimiento del plazo establecido para su ingreso en el artículo 62."
  - id: d
    text:
      es: "El día siguiente al de la presentación de la solicitud de ingreso por el obligado."
  explanation:
    es: "En deudas liquidadas por la Administración, el período ejecutivo empieza el día siguiente al del vencimiento del plazo de ingreso del artículo 62. No es el mismo día. La providencia viene después: inicia el apremio, no el período ejecutivo. Y no hay solicitud de ingreso que lo desencadene."
  citation: "art. 161.1.a LGT"
  difficulty: 1
  tags:
  - "período ejecutivo"
  - "inicio"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0056
  prompt:
    es: "De acuerdo con el artículo 161.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, en deudas a ingresar mediante autoliquidación presentada sin realizar el ingreso, el período ejecutivo se inicia al día siguiente de la finalización del plazo que establezca la normativa de cada tributo o, si este ya hubiera concluido:"
  options:
  - id: a
    text:
      es: "El mismo día de la presentación de la autoliquidación."
  - id: b
    correct: true
    text:
      es: "El día siguiente a la presentación de la autoliquidación."
  - id: c
    text:
      es: "El día siguiente a la notificación de la providencia de apremio."
  - id: d
    text:
      es: "El día siguiente al vencimiento del plazo del artículo 62.2 de la propia ley."
  explanation:
    es: "Si la autoliquidación se presenta sin ingreso una vez concluido el plazo, el período ejecutivo empieza el día siguiente a la presentación. No es el mismo día de la presentación. La providencia no marca el inicio, y el plazo del artículo 62.2 es el voluntario de las deudas liquidadas por la Administración."
  citation: "art. 161.1.b LGT"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "inicio"
  - "autoliquidación"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0057
  prompt:
    es: "A Josefina Barrera, que no recurrió la liquidación, se le notificó una liquidación tributaria cuyo plazo de ingreso en período voluntario terminó el martes 20 de octubre de 2026. No ingresó la deuda ni presentó solicitud alguna. Conforme al artículo 161.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué día se inicia el período ejecutivo?"
  options:
  - id: a
    text:
      es: "El martes 20 de octubre de 2026."
  - id: b
    correct: true
    text:
      es: "El miércoles 21 de octubre de 2026."
  - id: c
    text:
      es: "El día siguiente a aquel en que se le notifique la providencia de apremio."
  - id: d
    text:
      es: "El jueves 5 de noviembre de 2026."
  explanation:
    es: "Es una deuda liquidada por la Administración y no pagada en plazo, así que el período ejecutivo se inicia el día siguiente al del vencimiento del plazo: el miércoles 21 de octubre de 2026 (artículo 161.1.a). No empieza el último día del plazo voluntario. Tampoco espera a la providencia, que llega después. Y el 5 de noviembre no tiene apoyo en el artículo."
  citation: "art. 161.1.a LGT"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "inicio"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0058
  prompt:
    es: "Distribuciones Calderón, S.L. presenta el lunes 10 de agosto de 2026 una autoliquidación a ingresar sin efectuar el ingreso. El plazo que fija la normativa del tributo para ingresar había terminado el lunes 20 de julio de 2026. Conforme al artículo 161.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo se inicia el período ejecutivo?"
  options:
  - id: a
    text:
      es: "El martes 21 de julio de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 11 de agosto de 2026."
  - id: c
    text:
      es: "El lunes 10 de agosto de 2026."
  - id: d
    text:
      es: "El día siguiente al de la notificación de la providencia de apremio."
  explanation:
    es: "El plazo para ingresar ya había concluido al presentar la autoliquidación, así que el período ejecutivo empieza el día siguiente a la presentación (artículo 161.1.b): el martes 11 de agosto de 2026. El día siguiente a la finalización del plazo, el 21 de julio, solo vale cuando se presenta antes de que concluya el plazo. El mismo día de la presentación incumple la regla del día siguiente. Y la providencia no marca el inicio: viene después."
  citation: "art. 161.1.b LGT"
  difficulty: 3
  tags:
  - "período ejecutivo"
  - "inicio"
  - "autoliquidación"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0059
  prompt:
    es: "Reformas Antúnez, S.L. presenta el viernes 15 de enero de 2027 una autoliquidación a ingresar sin efectuar el ingreso. El plazo que fija la normativa del tributo para ingresar termina el miércoles 20 de enero de 2027. Conforme al artículo 161.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo se inicia el período ejecutivo?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves 21 de enero de 2027."
  - id: b
    text:
      es: "El sábado 16 de enero de 2027."
  - id: c
    text:
      es: "El miércoles 20 de enero de 2027."
  - id: d
    text:
      es: "El día siguiente al de la notificación de la providencia de apremio."
  explanation:
    es: "La autoliquidación se presentó antes de que acabara el plazo, así que el período ejecutivo se inicia al día siguiente de la finalización del plazo del tributo (artículo 161.1.b): el jueves 21 de enero de 2027. No empieza al día siguiente de la presentación, que es la regla para el plazo ya concluido. Tampoco el último día del plazo. Y la providencia no marca el inicio: viene después."
  citation: "art. 161.1.b LGT"
  difficulty: 3
  tags:
  - "período ejecutivo"
  - "inicio"
  - "autoliquidación"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0062
  prompt:
    es: "Según el artículo 161.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta cuándo impide el inicio del período ejecutivo la interposición en tiempo y forma de un recurso o reclamación contra una sanción?"
  options:
  - id: a
    text:
      es: "Hasta que se dicte la resolución del recurso o reclamación, aunque la sanción no sea firme en vía administrativa ni haya terminado el plazo de ingreso voluntario."
  - id: b
    correct: true
    text:
      es: "Hasta que la sanción sea firme en vía administrativa y haya finalizado el plazo para el ingreso voluntario del pago."
  - id: c
    text:
      es: "Hasta que la sanción sea firme en vía judicial y se notifique la providencia de apremio."
  - id: d
    text:
      es: "Hasta que transcurran seis meses desde la interposición del recurso o reclamación contra la sanción."
  explanation:
    es: "El recurso o reclamación en tiempo y forma contra una sanción impide el inicio del período ejecutivo hasta que la sanción sea firme en vía administrativa y haya terminado el plazo de ingreso voluntario. Resolver el recurso no basta si la sanción no es firme. La firmeza que cuenta es la administrativa, no la judicial. Y el artículo no fija un plazo de seis meses."
  citation: "art. 161.2 LGT"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "sanciones"
  - "inicio"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0063
  prompt:
    es: "Según el artículo 161.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la declaración de concurso no suspenderá el plazo voluntario de pago de las deudas que tengan la calificación de concursal, sin perjuicio de que:"
  options:
  - id: a
    text:
      es: "Los recargos del período ejecutivo se devenguen con la declaración de concurso."
  - id: b
    correct: true
    text:
      es: "Las actuaciones del período ejecutivo se rijan por lo dispuesto en el texto refundido de la Ley Concursal."
  - id: c
    text:
      es: "Las actuaciones del período ejecutivo se suspendan hasta la finalización del concurso."
  - id: d
    text:
      es: "El plazo voluntario quede ampliado en un mes desde la declaración de concurso."
  explanation:
    es: "La declaración de concurso no suspende el plazo voluntario de pago de las deudas concursales, y las actuaciones del período ejecutivo se rigen por el texto refundido de la Ley Concursal. El artículo no suspende esas actuaciones hasta el fin del concurso, ni amplía el plazo en un mes, ni adelanta el devengo de los recargos."
  citation: "art. 161.2 LGT"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "concurso"
# anchor: boe-a-2003-23186-art-161
- id: m03-l11-q0064
  prompt:
    es: "De acuerdo con el artículo 161.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, iniciado el período ejecutivo, la Administración tributaria efectuará la recaudación de las deudas liquidadas o autoliquidadas:"
  options:
  - id: a
    text:
      es: "Por el procedimiento de apremio, solo sobre los bienes que el obligado señale."
  - id: b
    text:
      es: "Por el procedimiento de gestión tributaria, sobre el patrimonio del obligado al pago."
  - id: c
    text:
      es: "Por el procedimiento judicial de ejecución, sobre el patrimonio del obligado al pago."
  - id: d
    correct: true
    text:
      es: "Por el procedimiento de apremio sobre el patrimonio del obligado al pago."
  explanation:
    es: "Iniciado el período ejecutivo, la recaudación se hace por el procedimiento de apremio sobre el patrimonio del obligado, sin limitarla a los bienes que él señale. No es un procedimiento de gestión tributaria ni uno judicial."
  citation: "art. 161.3 LGT"
  difficulty: 1
  tags:
  - "período ejecutivo"
  - "apremio"
# anchor: boe-a-2005-14803-art-46
- id: m03-l11-q0065
  prompt:
    es: "Conforme al artículo 46.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en el caso de deudas resultantes de autoliquidaciones presentadas fuera de plazo, señale la respuesta CORRECTA sobre la solicitud de aplazamiento o fraccionamiento:"
  options:
  - id: a
    text:
      es: "Se entiende siempre presentada en período ejecutivo, porque la autoliquidación se presentó fuera de plazo."
  - id: b
    text:
      es: "Se entiende presentada en período voluntario si se presenta dentro de los diez días siguientes a la autoliquidación."
  - id: c
    text:
      es: "Se entiende presentada en período voluntario aunque se presente después de que se inicie el apremio."
  - id: d
    correct: true
    text:
      es: "Solo se entiende presentada en período voluntario cuando se presenta junto con la autoliquidación extemporánea."
  explanation:
    es: "Para las autoliquidaciones extemporáneas, la solicitud de aplazamiento o fraccionamiento solo se entiende presentada en período voluntario si se presenta junto con la autoliquidación. No es cierto que siempre sea ejecutiva, ni hay un margen de diez días, ni vale la presentada tras iniciarse el apremio. En el examen 2022X (pregunta 69) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 46.1.a RGR"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "aplazamiento"
  - "autoliquidación"
# anchor: boe-a-2005-14803-art-46
- id: m03-l11-q0067
  prompt:
    es: "Según el artículo 46.1.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las solicitudes de aplazamiento o fraccionamiento de deudas que se encuentren en período ejecutivo podrán presentarse:"
  options:
  - id: a
    correct: true
    text:
      es: "En cualquier momento anterior a la notificación del acuerdo de enajenación de los bienes."
  - id: b
    text:
      es: "En cualquier momento anterior a la notificación de la providencia de apremio."
  - id: c
    text:
      es: "Dentro del plazo previsto en el artículo 62.5 de la Ley General Tributaria para las deudas apremiadas."
  - id: d
    text:
      es: "En cualquier momento anterior a la adjudicación de los bienes embargados al órgano de recaudación."
  explanation:
    es: "En período ejecutivo la solicitud puede presentarse en cualquier momento anterior a la notificación del acuerdo de enajenación de los bienes. No se cierra con la providencia de apremio, ni se limita al plazo del artículo 62.5, ni llega hasta la adjudicación."
  citation: "art. 46.1.b RGR"
  difficulty: 1
  tags:
  - "período ejecutivo"
  - "aplazamiento"
  - "plazos"
# anchor: boe-a-2005-14803-art-69
- id: m03-l11-q0068
  prompt:
    es: "De acuerdo con el artículo 69.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el pago en período ejecutivo no comprende la totalidad de la deuda, incluido el recargo que corresponda y, en su caso, las costas devengadas:"
  options:
  - id: a
    text:
      es: "Se archivará el procedimiento y se iniciará otro por el resto impagado."
  - id: b
    correct: true
    text:
      es: "Continuará el procedimiento por el resto impagado."
  - id: c
    text:
      es: "Se devolverá el pago y se exigirá de nuevo el importe total de la deuda."
  - id: d
    text:
      es: "Se suspenderá el procedimiento hasta que el obligado complete el pago."
  explanation:
    es: "El obligado puede pagar total o parcialmente en período ejecutivo. Si el pago no cubre deuda, recargo y costas, el procedimiento continúa por el resto impagado. No se archiva, ni se devuelve el pago, ni se suspende a la espera de que complete."
  citation: "art. 69.3 RGR"
  difficulty: 1
  tags:
  - "período ejecutivo"
  - "pago parcial"
# anchor: boe-a-2003-23186-art-160
- id: m03-l11-q0124
  prompt:
    es: "¿Cómo puede realizarse la recaudación de las deudas tributarias en período voluntario, de acuerdo con el artículo 160.2.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Mediante el procedimiento administrativo de apremio, una vez notificada la providencia."
  - id: b
    text:
      es: "Mediante el pago espontáneo del obligado, con el recargo ejecutivo que corresponda."
  - id: c
    correct: true
    text:
      es: "Mediante el pago o cumplimiento del obligado tributario en los plazos previstos en el artículo 62."
  - id: d
    text:
      es: "Mediante la ejecución de las garantías que haya constituido el obligado tributario."
  explanation:
    es: "En período voluntario la recaudación se hace por el pago o cumplimiento del obligado en los plazos del artículo 62. El apremio, el recargo ejecutivo y la ejecución de garantías son propios del período ejecutivo."
  citation: "art. 160.2.a LGT"
  difficulty: 2
  tags:
  - "recaudación"
  - "período voluntario"
# anchor: boe-a-2005-14803-art-69
- id: m03-l11-q0126
  prompt:
    es: "¿Puede el obligado al pago satisfacer solo una parte de la deuda que está en período ejecutivo, según el artículo 69.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "No, en período ejecutivo solo puede pagar la totalidad de la deuda."
  - id: b
    correct: true
    text:
      es: "Sí, puede satisfacerla total o parcialmente."
  - id: c
    text:
      es: "Sí, pero únicamente si el pago parcial cubre el recargo y las costas."
  - id: d
    text:
      es: "No, salvo que la Administración autorice el pago parcial por escrito."
  explanation:
    es: "El obligado puede satisfacer total o parcialmente las deudas en período ejecutivo. Si el pago no cubre toda la deuda, el procedimiento continúa por el resto. El artículo no exige que el pago parcial cubra recargo y costas ni una autorización escrita."
  citation: "art. 69.3 RGR"
  difficulty: 2
  tags:
  - "período ejecutivo"
  - "pago parcial"
