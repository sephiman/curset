# anchor: boe-a-1978-31229-art-66
- id: m01-l03-q012
  prompt:
    es: "De acuerdo con el artículo 66 de la Constitución Española de 1978, las Cortes Generales ejercen la potestad legislativa del Estado, controlan la acción del Gobierno y, además:"
  options:
  - id: a
    text:
      es: "Elaboran los Presupuestos Generales del Estado."
  - id: b
    correct: true
    text:
      es: "Aprueban los Presupuestos del Estado."
  - id: c
    text:
      es: "Dirigen la Administración civil y militar."
  - id: d
    text:
      es: "Ejercen la potestad reglamentaria del Estado."
  explanation:
    es: "El artículo 66.2 dice que las Cortes Generales «aprueban sus Presupuestos», los del Estado. Elaborar los Presupuestos no es función de las Cortes: el precepto solo les da su aprobación. Dirigir la Administración civil y militar y ejercer la potestad reglamentaria no figuran entre las funciones que enumera el artículo 66.2."
  citation: "art. 66.2 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q013
  prompt:
    es: "De acuerdo con el artículo 67 de la Constitución Española de 1978, el acta de una Asamblea de Comunidad Autónoma no puede acumularse con:"
  options:
  - id: a
    correct: true
    text:
      es: "La de Diputado al Congreso."
  - id: b
    text:
      es: "La de Senador elegido en la provincia."
  - id: c
    text:
      es: "La de Senador designado por la Comunidad Autónoma."
  - id: d
    text:
      es: "La de miembro de cualquiera de las dos Cámaras."
  explanation:
    es: "El artículo 67.1 prohíbe «acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso». La prohibición se refiere solo al Congreso. El precepto no la extiende al Senado, ni a los Senadores elegidos ni a los designados por la Comunidad Autónoma. Por la misma razón no alcanza a cualquiera de las dos Cámaras."
  citation: "art. 67.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-66
- id: m01-l03-q072
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde a las Cortes Generales, según el artículo 66.2 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Dictar Decretos-leyes en caso de extraordinaria y urgente necesidad."
  - id: b
    text:
      es: "Sancionar y promulgar las leyes que ellas mismas aprueban."
  - id: c
    text:
      es: "Dictar Decretos Legislativos con rango de ley."
  - id: d
    correct: true
    text:
      es: "Controlar la acción del Gobierno."
  explanation:
    es: "El artículo 66.2 atribuye a las Cortes Generales la potestad legislativa, la aprobación de los Presupuestos, el control de la acción del Gobierno y las demás competencias que les dé la Constitución. Los Decretos-leyes (artículo 86.1) y los Decretos Legislativos (artículo 85) son normas del Gobierno, y la sanción y promulgación de las leyes corresponde al Rey (artículo 91)."
  citation: "art. 66.2 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q073
  prompt:
    es: "Señale la respuesta correcta sobre las incompatibilidades que fija el artículo 67.1 de la Constitución Española de 1978 para los miembros de las Cortes Generales:"
  options:
  - id: a
    correct: true
    text:
      es: "El acta de una Asamblea de Comunidad Autónoma solo es incompatible con la de Diputado al Congreso."
  - id: b
    text:
      es: "Nadie puede ser miembro de las dos Cámaras, salvo los Senadores que designe una Comunidad Autónoma."
  - id: c
    text:
      es: "El acta de una Asamblea de Comunidad Autónoma es incompatible con la de Diputado y con la de Senador."
  - id: d
    text:
      es: "El acta de Diputado se puede acumular con la de Senador si ambas Cámaras lo autorizan."
  explanation:
    es: "El artículo 67.1 prohíbe ser miembro de las dos Cámaras y acumular el acta autonómica con la de Diputado al Congreso. La prohibición del acta autonómica se refiere solo al Diputado y no se extiende al Senador. La regla de las dos Cámaras no admite excepción para los Senadores designados por las Comunidades Autónomas, ni autorización de las Cámaras."
  citation: "art. 67.1 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q074
  prompt:
    es: "Señale la respuesta correcta sobre la relación de los miembros de las Cortes Generales con quienes los eligen, según el artículo 67.2 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Estarán ligados por el mandato de su grupo parlamentario."
  - id: b
    text:
      es: "Estarán ligados por las instrucciones de la circunscripción que los elige."
  - id: c
    correct: true
    text:
      es: "No estarán ligados por mandato imperativo."
  - id: d
    text:
      es: "Estarán ligados por mandato imperativo solo en las votaciones de investidura."
  explanation:
    es: "El artículo 67.2 dice que los miembros de las Cortes Generales no están ligados por mandato imperativo. Las tres opciones restantes los vinculan a alguien, al grupo, a la circunscripción o a un tipo de votación, y eso es justo el mandato imperativo que el artículo descarta."
  citation: "art. 67.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q075
  prompt:
    es: "Señale la respuesta correcta sobre los efectos de las reuniones de Parlamentarios que se celebren sin convocatoria reglamentaria, según el artículo 67.3 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Vincularán a las Cámaras si asiste la mayoría de sus miembros."
  - id: b
    text:
      es: "Vincularán a las Cámaras, pero sin ostentar sus privilegios."
  - id: c
    correct: true
    text:
      es: "No vincularán a las Cámaras, y no podrán ejercer sus funciones ni ostentar sus privilegios."
  - id: d
    text:
      es: "No vincularán a las Cámaras, pero sí podrán ejercer sus funciones."
  explanation:
    es: "El artículo 67.3 niega a esas reuniones tres efectos: no vinculan a las Cámaras, no ejercen sus funciones y no ostentan sus privilegios. Condicionar el efecto vinculante a la asistencia de la mayoría de los miembros contradice el texto, que se lo niega a toda reunión sin convocatoria reglamentaria. Vincular sin privilegios, o ejercer funciones sin vincular, dejan un efecto que el artículo niega."
  citation: "art. 67.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q076
  prompt:
    es: "¿Cuál de las siguientes series de características corresponde al sufragio por el que se eligen los Diputados, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Universal, libre, igual, directo y secreto."
  - id: b
    text:
      es: "Universal, libre, igual, directo y público."
  - id: c
    text:
      es: "Universal, igual, directo, secreto y obligatorio."
  - id: d
    text:
      es: "Universal, libre, proporcional, directo y secreto."
  explanation:
    es: "El artículo 68.1 exige sufragio universal, libre, igual, directo y secreto. Cambiar secreto por público, añadir el carácter obligatorio o sustituir igual por proporcional altera la lista. La proporcionalidad es un criterio de la elección en cada circunscripción (apartado 3), no una característica del sufragio."
  citation: "art. 68.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q077
  prompt:
    es: "¿Cuál de las siguientes cifras es el número mínimo de Diputados que puede tener el Congreso de los Diputados, según el artículo 68.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Doscientos cincuenta Diputados."
  - id: b
    text:
      es: "Trescientos cincuenta Diputados."
  - id: c
    text:
      es: "Cuatrocientos Diputados."
  - id: d
    correct: true
    text:
      es: "Trescientos Diputados."
  explanation:
    es: "El artículo 68.1 fija un mínimo de 300 y un máximo de 400 Diputados. Doscientos cincuenta queda por debajo del mínimo. Trescientos cincuenta es una cifra intermedia sin base en el artículo. Cuatrocientos es el máximo, no el mínimo."
  citation: "art. 68.1 CE"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q078
  prompt:
    es: "Conforme al artículo 68.2 de la Constitución Española de 1978, la ley distribuirá el número total de Diputados asignando a cada circunscripción:"
  options:
  - id: a
    text:
      es: "Un número igual de Diputados, y distribuyendo los demás por partes iguales entre provincias."
  - id: b
    correct: true
    text:
      es: "Una representación mínima inicial, y distribuyendo los demás en proporción a la población."
  - id: c
    text:
      es: "Una representación mínima inicial, y distribuyendo los demás en proporción al número de municipios."
  - id: d
    text:
      es: "Un Diputado por cada cien mil habitantes, en todo caso."
  explanation:
    es: "El artículo 68.2 manda asignar una representación mínima inicial a cada circunscripción y repartir los demás Diputados en proporción a la población. El reparto por partes iguales o por número de municipios sustituye la población por otro criterio. Un Diputado por cada cien mil habitantes en todo caso elimina la representación mínima inicial."
  citation: "art. 68.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q080
  prompt:
    es: "Conforme al artículo 68.4 de la Constitución Española de 1978, el Congreso es elegido por cuatro años, y el mandato de los Diputados termina cuatro años después de su elección o:"
  options:
  - id: a
    text:
      es: "El día de la constitución de las nuevas Cortes Generales."
  - id: b
    correct: true
    text:
      es: "El día de la disolución de la Cámara."
  - id: c
    text:
      es: "El día en que expire el mandato del Gobierno."
  - id: d
    text:
      es: "Treinta días después de la convocatoria de elecciones."
  explanation:
    es: "El artículo 68.4 pone fin al mandato a los cuatro años de la elección o el día de la disolución de la Cámara. La constitución de las nuevas Cortes Generales es posterior, y hasta ese momento siguen actuando las Diputaciones Permanentes. El mandato del Gobierno y la convocatoria de elecciones no son causas de terminación del mandato de los Diputados."
  citation: "art. 68.4 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q081
  prompt:
    es: "¿Cuál de los siguientes colectivos reúne a los electores y elegibles para el Congreso de los Diputados, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Todos los españoles mayores de edad, sin más requisito."
  - id: b
    text:
      es: "Todos los españoles residentes en España en pleno uso de sus derechos civiles."
  - id: c
    correct: true
    text:
      es: "Todos los españoles que estén en pleno uso de sus derechos políticos."
  - id: d
    text:
      es: "Todos los ciudadanos de la Unión Europea residentes en España."
  explanation:
    es: "El artículo 68.5 exige ser español y estar en pleno uso de los derechos políticos. La mayoría de edad, la residencia y los derechos civiles son otros requisitos que el artículo no pone. Los ciudadanos de la Unión Europea no son titulares del sufragio para el Congreso: el artículo 13.2 solo admite el sufragio de los extranjeros en elecciones municipales, por tratado o ley."
  citation: "art. 68.5 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q082
  prompt:
    es: "Conforme al artículo 68.6 de la Constitución Española de 1978, el Congreso electo deberá ser convocado dentro de un plazo, contado desde las elecciones, de:"
  options:
  - id: a
    correct: true
    text:
      es: "Veinticinco días siguientes a la celebración de las elecciones."
  - id: b
    text:
      es: "Quince días siguientes a la celebración de las elecciones."
  - id: c
    text:
      es: "Treinta días siguientes a la celebración de las elecciones."
  - id: d
    text:
      es: "Sesenta días siguientes a la celebración de las elecciones."
  explanation:
    es: "El artículo 68.6 da veinticinco días desde la celebración de las elecciones para convocar al Congreso electo. Treinta y sesenta días son las cifras del plazo en que deben celebrarse las elecciones desde el fin del mandato, no el de convocatoria del Congreso electo. Quince días es una cifra distinta de la veinticinco que fija el artículo."
  citation: "art. 68.6 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q085
  prompt:
    es: "¿En cuál de las siguientes islas se elige un solo Senador, por ser una de las islas menores que cuentan con Cabildo o Consejo Insular?"
  options:
  - id: a
    text:
      es: "La isla de Tenerife."
  - id: b
    correct: true
    text:
      es: "La isla de Lanzarote."
  - id: c
    text:
      es: "La isla de Mallorca."
  - id: d
    text:
      es: "La isla de Gran Canaria."
  explanation:
    es: "Según el artículo 69.3, corresponde un Senador a cada una de las islas menores que enumera, entre ellas Lanzarote. Tenerife, Mallorca y Gran Canaria son las islas mayores y eligen tres Senadores cada una."
  citation: "art. 69.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q086
  prompt:
    es: "Conforme al artículo 69.3 de la Constitución Española de 1978, en las provincias insulares constituye una circunscripción a efectos de elección de Senadores:"
  options:
  - id: a
    text:
      es: "Cada provincia insular, en su conjunto."
  - id: b
    text:
      es: "Cada municipio de las islas con más de cien mil habitantes."
  - id: c
    text:
      es: "Cada Comunidad Autónoma insular."
  - id: d
    correct: true
    text:
      es: "Cada isla con Cabildo o Consejo Insular."
  explanation:
    es: "El artículo 69.3 hace circunscripción a cada isla con Cabildo o Consejo Insular, y no a la provincia insular entera. El municipio no es circunscripción para el Senado, ni existe el umbral de cien mil habitantes. La Comunidad Autónoma designa Senadores por otra vía, la del apartado 5."
  citation: "art. 69.3 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q087
  prompt:
    es: "Conforme al artículo 69.4 de la Constitución Española de 1978, las poblaciones de Ceuta y Melilla elegirán, cada una de ellas, el siguiente número de Senadores:"
  options:
  - id: a
    text:
      es: "Un Senador cada una."
  - id: b
    correct: true
    text:
      es: "Dos Senadores cada una."
  - id: c
    text:
      es: "Tres Senadores cada una."
  - id: d
    text:
      es: "Cuatro Senadores cada una."
  explanation:
    es: "El artículo 69.4 asigna dos Senadores a cada una de las dos ciudades. Uno es la cifra de las islas menores y de Ceuta y Melilla en el Congreso, donde eligen un Diputado. Tres corresponde a las islas mayores. Cuatro es el número de Senadores por provincia."
  citation: "art. 69.4 CE"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q088
  prompt:
    es: "Conforme al artículo 69.5 de la Constitución Española de 1978, las Comunidades Autónomas designarán además un Senador y otro más por cada determinado número de habitantes de su territorio, que es:"
  options:
  - id: a
    text:
      es: "Cien mil habitantes."
  - id: b
    text:
      es: "Quinientos mil habitantes."
  - id: c
    text:
      es: "Dos millones de habitantes."
  - id: d
    correct: true
    text:
      es: "Un millón de habitantes."
  explanation:
    es: "El artículo 69.5 suma un Senador por cada millón de habitantes al que cada Comunidad Autónoma designa en todo caso. El artículo fija un millón de habitantes: cien mil, quinientos mil y dos millones son otras cifras."
  citation: "art. 69.5 CE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q089
  prompt:
    es: "¿Cuál de los siguientes órganos designa a los Senadores que corresponden a cada Comunidad Autónoma, de acuerdo con los Estatutos, según el artículo 69.5 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "La Asamblea legislativa o, en su defecto, el órgano colegiado superior de la Comunidad Autónoma."
  - id: b
    text:
      es: "El Gobierno de la Comunidad Autónoma, en todo caso."
  - id: c
    text:
      es: "El Presidente de la Comunidad Autónoma, a propuesta del Parlamento autonómico."
  - id: d
    text:
      es: "El Congreso de los Diputados, a propuesta de la Comunidad Autónoma."
  explanation:
    es: "El artículo 69.5 atribuye la designación a la Asamblea legislativa autonómica o, si no la hay, al órgano colegiado superior de la Comunidad. El Gobierno autonómico y el Presidente de la Comunidad no designan por sí solos, y el Congreso de los Diputados no interviene: los Senadores autonómicos los designa la propia Comunidad."
  citation: "art. 69.5 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-70
- id: m01-l03-q090
  prompt:
    es: "¿Cuál de las siguientes categorías de personas figura en la letra a) de las causas de inelegibilidad e incompatibilidad del artículo 70.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los miembros del Gobierno."
  - id: b
    text:
      es: "Los Presidentes de las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "Los componentes del Tribunal Constitucional."
  - id: d
    text:
      es: "Los miembros del Consejo de Estado."
  explanation:
    es: "El artículo 70.1.a incluye a los componentes del Tribunal Constitucional. Los miembros del Gobierno están expresamente exceptuados de la regla sobre altos cargos. La lista del apartado 1 es la de seis categorías, y los Presidentes de las Comunidades Autónomas y los miembros del Consejo de Estado no son ninguna de ellas."
  citation: "art. 70.1 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-70
- id: m01-l03-q091
  prompt:
    es: "Conforme al artículo 70.1.b de la Constitución Española de 1978, la inelegibilidad e incompatibilidad comprende a los altos cargos de la Administración del Estado que determine la ley, con la excepción de:"
  options:
  - id: a
    text:
      es: "Los Subsecretarios."
  - id: b
    text:
      es: "Los Secretarios de Estado."
  - id: c
    correct: true
    text:
      es: "Los miembros del Gobierno."
  - id: d
    text:
      es: "Los Directores Generales."
  explanation:
    es: "El artículo 70.1.b exceptúa de esa regla a los miembros del Gobierno. Los Subsecretarios, los Secretarios de Estado y los Directores Generales son altos cargos de la Administración del Estado, sin la excepción del texto."
  citation: "art. 70.1 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-70
- id: m01-l03-q092
  prompt:
    es: "¿Cuál de las siguientes personas está comprendida en todo caso en las causas de inelegibilidad e incompatibilidad de Diputados y Senadores, según el artículo 70.1 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Defensor del Pueblo."
  - id: b
    text:
      es: "Los Alcaldes de municipios de más de cien mil habitantes."
  - id: c
    text:
      es: "Los Presidentes de las Cámaras."
  - id: d
    text:
      es: "Los Concejales de cualquier municipio."
  explanation:
    es: "El artículo 70.1.c incluye al Defensor del Pueblo. Los Alcaldes, los Concejales y los Presidentes de las Cámaras no son ninguna de las seis categorías que la ley electoral debe comprender en todo caso."
  citation: "art. 70.1 CE"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-70
- id: m01-l03-q093
  prompt:
    es: "Señale cuál de las siguientes personas queda comprendida en las causas de inelegibilidad e incompatibilidad del artículo 70.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Los miembros de las Mesas electorales."
  - id: b
    text:
      es: "Los Interventores y Apoderados de las candidaturas."
  - id: c
    text:
      es: "Los Presidentes de las Juntas Electorales Provinciales únicamente."
  - id: d
    correct: true
    text:
      es: "Los miembros de las Juntas Electorales."
  explanation:
    es: "El artículo 70.1.f cita a los miembros de las Juntas Electorales, sin distinguir a sus Presidentes. Los miembros de las Mesas electorales y los Interventores y Apoderados son otras figuras del proceso electoral, distintas de las Juntas Electorales que la letra f cita. Limitarlo a los Presidentes de las Juntas Provinciales recorta el texto."
  citation: "art. 70.1 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-71
- id: m01-l03-q094
  prompt:
    es: "Conforme a la Constitución Española de 1978, entre las prerrogativas que esta reconoce a los Diputados y Senadores, estos gozarán de inviolabilidad por:"
  options:
  - id: a
    text:
      es: "Los actos realizados durante todo su mandato."
  - id: b
    correct: true
    text:
      es: "Las opiniones manifestadas en el ejercicio de sus funciones."
  - id: c
    text:
      es: "Las opiniones manifestadas en cualquier ámbito."
  - id: d
    text:
      es: "Los delitos cometidos en el recinto parlamentario."
  explanation:
    es: "El artículo 71.1 limita la inviolabilidad a las opiniones manifestadas en el ejercicio de las funciones. La inviolabilidad cubre las opiniones, no los actos de todo el mandato ni los delitos en el recinto, y solo las manifestadas en el ejercicio de las funciones."
  citation: "art. 71.1 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-71
- id: m01-l03-q095
  prompt:
    es: "Conforme al artículo 71.2 de la Constitución Española de 1978, durante su mandato los Diputados y Senadores no podrán ser inculpados ni procesados sin la previa autorización de:"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo."
  - id: b
    text:
      es: "El Gobierno."
  - id: c
    text:
      es: "El Presidente del Congreso."
  - id: d
    correct: true
    text:
      es: "La Cámara respectiva."
  explanation:
    es: "El artículo 71.2 exige la previa autorización de la Cámara respectiva para inculpar o procesar a un parlamentario. El Tribunal Supremo es el órgano competente para juzgarlo (apartado 3), no quien autoriza. El Gobierno no interviene y el Presidente del Congreso no autoriza por sí solo: decide la Cámara."
  citation: "art. 71.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-71
- id: m01-l03-q096
  prompt:
    es: "¿Cuál de los siguientes órganos es competente en las causas contra Diputados y Senadores durante su mandato, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  - id: b
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: c
    text:
      es: "El Tribunal Constitucional."
  - id: d
    text:
      es: "El Tribunal Superior de Justicia de la Comunidad Autónoma respectiva."
  explanation:
    es: "El artículo 71.3 atribuye esas causas a la Sala de lo Penal del Tribunal Supremo. La Audiencia Nacional y el Tribunal Superior de Justicia son órganos de otro nivel que la Constitución no menciona para los parlamentarios. El Tribunal Constitucional no juzga causas penales."
  citation: "art. 71.3 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1982-5196-art-22
- id: m01-l03-q097
  prompt:
    es: "¿Cuál de las siguientes es causa de pérdida de la condición de Diputado, según el artículo 22 del Reglamento del Congreso de 10 de febrero de 1982?"
  options:
  - id: a
    text:
      es: "La condena por un delito leve en la jurisdicción penal."
  - id: b
    text:
      es: "La inasistencia injustificada a las sesiones del Pleno."
  - id: c
    correct: true
    text:
      es: "La decisión judicial firme que anule su elección o su proclamación."
  - id: d
    text:
      es: "La sanción disciplinaria impuesta por la Mesa de la Cámara."
  explanation:
    es: "El artículo 22 enumera cuatro causas: decisión judicial firme que anule la elección o la proclamación, fallecimiento o incapacitación declarada por decisión judicial firme, extinción del mandato y renuncia presentada ante la Mesa del Congreso. La condena por un delito leve, la inasistencia y la sanción disciplinaria no son ninguna de las cuatro."
  citation: "art. 22 Reglamento del Congreso"
  difficulty: 1
  tags:
  - "requisito"
