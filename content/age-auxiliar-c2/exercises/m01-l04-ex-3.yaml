# anchor: boe-a-1985-12666-art-558
- id: m01-l04-q021
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el Consejo General del Poder Judicial es correcta según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Ejerce sus competencias solo sobre los órganos judiciales con jurisdicción en toda España."
  - id: b
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y su sede la fija el Pleno cada cinco años."
  - id: c
    correct: true
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y tiene su sede en la villa de Madrid."
  - id: d
    text:
      es: "Tiene su sede en la villa de Madrid y delegaciones con competencias propias en cada Comunidad Autónoma."
  explanation:
    es: "El artículo 558 LOPJ dice que el Consejo «ejerce sus competencias en todo el territorio nacional» (apartado 1) y que «tiene su sede en la villa de Madrid» (apartado 2). Una opción limita sus competencias a los órganos centrales. Otra deja la sede a una decisión del Pleno, cuando la fija la ley. Otra inventa delegaciones con competencias propias."
  citation: "art. 558 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q022
  prompt:
    es: "Según el artículo 122 de la Constitución Española de 1978, ¿cómo se reparten los veinte miembros del Consejo General del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Diez entre Jueces y Magistrados, cinco a propuesta del Congreso y cinco a propuesta del Senado."
  - id: b
    text:
      es: "Doce entre Jueces y Magistrados, seis a propuesta del Congreso y dos a propuesta del Senado."
  - id: c
    correct: true
    text:
      es: "Doce entre Jueces y Magistrados, cuatro a propuesta del Congreso y cuatro a propuesta del Senado."
  - id: d
    text:
      es: "Ocho entre Jueces y Magistrados, seis a propuesta del Congreso y seis a propuesta del Senado."
  explanation:
    es: "El artículo 122.3 CE reparte los veinte así: «doce entre Jueces y Magistrados de todas las categorías judiciales [...]; cuatro a propuesta del Congreso de los Diputados, y cuatro a propuesta del Senado». Las otras tres opciones suman veinte, pero con cifras que el artículo no da."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q023
  prompt:
    es: "De acuerdo con el artículo 122 de la Constitución Española de 1978, los cuatro miembros del Consejo General del Poder Judicial propuestos por el Congreso y los cuatro propuestos por el Senado se eligen:"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría de tres quintos de sus miembros, entre abogados y otros juristas de reconocida competencia."
  - id: b
    text:
      es: "Por mayoría absoluta de sus miembros, entre abogados y otros juristas de reconocida competencia."
  - id: c
    text:
      es: "Por mayoría de dos tercios de sus miembros, entre Jueces y Magistrados de todas las categorías."
  - id: d
    text:
      es: "Por mayoría de tres quintos de sus miembros, entre Magistrados del Tribunal Supremo en activo."
  explanation:
    es: "El artículo 122.3 CE dice que los ocho de las Cámaras se eligen «en ambos casos por mayoría de tres quintos de sus miembros, entre abogados y otros juristas». Una opción cambia la mayoría por la absoluta. Otra cambia la mayoría y confunde a los juristas con los doce del turno judicial. Otra acierta la mayoría pero los busca entre Magistrados del Tribunal Supremo."
  citation: "art. 122.3 CE"
  difficulty: 1
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q024
  prompt:
    es: "De acuerdo con el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, los veinte Vocales del Consejo General del Poder Judicial son designados:"
  options:
  - id: a
    text:
      es: "Por el Gobierno, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  - id: b
    correct: true
    text:
      es: "Por las Cortes Generales, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  - id: c
    text:
      es: "Doce por los Jueces y Magistrados en elección directa y ocho por las Cortes Generales."
  - id: d
    text:
      es: "Por el Pleno del Tribunal Supremo, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  explanation:
    es: "El artículo 567.1 LOPJ dice que los veinte Vocales «serán designadas por las Cortes Generales [...] atendiendo al principio de presencia equilibrada de mujeres y hombres». No los designa el Gobierno ni el Pleno del Tribunal Supremo. Otra opción describe una elección directa por los jueces que la LOPJ no prevé: los doce del turno judicial también los eligen las Cámaras (art. 567.2)."
  citation: "art. 567.1 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q025
  prompt:
    es: "Según el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿cuántos Vocales del Consejo General del Poder Judicial elige cada una de las Cámaras?"
  options:
  - id: a
    text:
      es: "Diez Vocales: seis juristas de reconocida competencia y cuatro del turno judicial."
  - id: b
    text:
      es: "Ocho Vocales: cuatro juristas de reconocida competencia y cuatro del turno judicial."
  - id: c
    correct: true
    text:
      es: "Diez Vocales: cuatro juristas de reconocida competencia y seis del turno judicial."
  - id: d
    text:
      es: "Doce Vocales: seis juristas de reconocida competencia y seis del turno judicial."
  explanation:
    es: "El artículo 567.2 LOPJ dice que cada Cámara elige «a diez Vocales, cuatro entre juristas de reconocida competencia [...] y seis correspondientes al turno judicial». La opción de diez Vocales con «seis juristas» invierte las cifras. Las de ocho y doce Vocales cambian el total; además, dos Cámaras eligiendo doce sumarían veinticuatro, y el Consejo tiene veinte Vocales."
  citation: "art. 567.2 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q026
  prompt:
    es: "De acuerdo con el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, entre los diez Vocales que elige cada Cámara debe incluirse, de cada uno de los sexos:"
  options:
  - id: a
    text:
      es: "Como mínimo un treinta por ciento."
  - id: b
    correct: true
    text:
      es: "Como mínimo un cuarenta por ciento."
  - id: c
    text:
      es: "Como mínimo un veinticinco por ciento."
  - id: d
    text:
      es: "Como mínimo un cincuenta por ciento."
  explanation:
    es: "El artículo 567.2 LOPJ obliga a cada Cámara a que «entre las diez personas vocales se incluya como mínimo un cuarenta por ciento de cada uno de los sexos». El treinta y el veinticinco por ciento se quedan por debajo de ese mínimo. El cincuenta por ciento exigiría la paridad exacta, cinco y cinco, que la ley no impone."
  citation: "art. 567.2 LOPJ"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12666-art-570
- id: m01-l04-q028
  prompt:
    es: "Señale la respuesta correcta sobre lo que ocurre, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, si ninguna de las dos Cámaras designa a sus Vocales del Consejo General del Poder Judicial en el plazo legal:"
  options:
  - id: a
    text:
      es: "El Gobierno designa provisionalmente a los Vocales pendientes hasta que lo hagan las Cámaras."
  - id: b
    text:
      es: "El Consejo saliente cesa y sus funciones pasan provisionalmente al Pleno del Tribunal Supremo."
  - id: c
    text:
      es: "Se constituye el nuevo Consejo solo con los doce Vocales del turno judicial."
  - id: d
    correct: true
    text:
      es: "El Consejo saliente continúa en funciones hasta la toma de posesión del nuevo."
  explanation:
    es: "El artículo 570.2 LOPJ dice que, en ese caso, «el Consejo saliente continuará en funciones hasta la toma de posesión del nuevo». La ley no da ningún papel al Gobierno ni al Pleno del Tribunal Supremo. La opción de constituirlo «solo con los doce Vocales del turno judicial» no cabe porque las Cámaras eligen también a los Vocales del turno judicial (art. 567.2), así que no hay doce designados con los que constituirlo."
  citation: "art. 570.2 LOPJ"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-585
- id: m01-l04-q029
  prompt:
    es: "Quien ostenta la condición de primera autoridad judicial de la Nación y la representación del Poder Judicial y de su órgano de gobierno es:"
  options:
  - id: a
    text:
      es: "El Presidente del Tribunal Constitucional."
  - id: b
    correct: true
    text:
      es: "El Presidente del Tribunal Supremo y del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "El Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    text:
      es: "El Fiscal General del Estado."
  explanation:
    es: "El artículo 585 LOPJ dice: «El Presidente del Tribunal Supremo y del Consejo General del Poder Judicial es la primera autoridad judicial de la Nación y ostenta la representación del Poder Judicial y del órgano de gobierno del mismo». El Tribunal Constitucional no forma parte del Poder Judicial. El Ministro es miembro del Gobierno. El Fiscal General dirige el Ministerio Fiscal (art. 124 CE)."
  citation: "art. 585 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q030
  prompt:
    es: "De acuerdo con el artículo 586 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, resulta elegido Presidente del Tribunal Supremo y del Consejo General del Poder Judicial quien obtenga en votación nominal:"
  options:
  - id: a
    correct: true
    text:
      es: "El apoyo de la mayoría de tres quintos de los miembros del Pleno."
  - id: b
    text:
      es: "El apoyo de la mayoría absoluta de los miembros del Pleno."
  - id: c
    text:
      es: "El apoyo de la mayoría de dos tercios de los miembros del Pleno."
  - id: d
    text:
      es: "El apoyo de la mayoría simple de los Vocales presentes en la sesión."
  explanation:
    es: "El artículo 586.3 LOPJ dice que resulta elegido «quien en votación nominal obtenga el apoyo de la mayoría de tres quintos de los miembros del Pleno». La mayoría absoluta es la regla general de los acuerdos del Consejo (art. 630.1 LOPJ), no la de esta elección. Los dos tercios y la mayoría simple no aparecen en el artículo."
  citation: "art. 586.3 LOPJ"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q031
  prompt:
    es: "De acuerdo con el artículo 586 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Presidente del Tribunal Supremo será nombrado por el Rey mediante:"
  options:
  - id: a
    text:
      es: "Real Decreto refrendado por el Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: b
    correct: true
    text:
      es: "Real Decreto refrendado por el Presidente del Gobierno."
  - id: c
    text:
      es: "Real Decreto refrendado por el Presidente del Congreso de los Diputados."
  - id: d
    text:
      es: "Real Decreto refrendado por el Vocal de más edad del Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 586.4 LOPJ dice: «El Presidente del Tribunal Supremo será nombrado por el Rey mediante Real Decreto refrendado por el Presidente del Gobierno». El refrendo no es del Ministro del ramo, ni del Presidente del Congreso, ni de un Vocal; el Vocal de más edad solo preside la sesión constitutiva (art. 586.2)."
  citation: "art. 586.4 LOPJ"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1985-12666-art-560
- id: m01-l04-q032
  prompt:
    es: "¿Qué atribución tiene el Consejo General del Poder Judicial en el nombramiento del Fiscal General del Estado según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Proponer al Rey su nombramiento por mayoría de tres quintos del Pleno."
  - id: b
    text:
      es: "Nombrarlo a propuesta del Gobierno, oído el Consejo Fiscal."
  - id: c
    text:
      es: "Ratificar el nombramiento acordado por el Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Ser oído por el Gobierno antes del nombramiento del Fiscal General del Estado."
  explanation:
    es: "La atribución 4.ª del artículo 560.1 LOPJ es «ser oído por el Gobierno antes del nombramiento del Fiscal General del Estado», en línea con el artículo 124.4 CE. El Consejo no propone: la propuesta es del Gobierno. No nombra: nombra el Rey. No ratifica: su papel es ser oído."
  citation: "art. 560.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-599
- id: m01-l04-q033
  prompt:
    es: "Según el artículo 599 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué plazo máximo debe el Pleno proponer a los dos Magistrados del Tribunal Constitucional que corresponden al Consejo?"
  options:
  - id: a
    text:
      es: "Un mes desde el día siguiente al vencimiento del mandato anterior."
  - id: b
    correct: true
    text:
      es: "Tres meses desde el día siguiente al vencimiento del mandato anterior."
  - id: c
    text:
      es: "Seis meses desde el día siguiente al vencimiento del mandato anterior."
  - id: d
    text:
      es: "Cuatro meses desde el día siguiente al vencimiento del mandato anterior."
  explanation:
    es: "La materia 1.ª del artículo 599.1 LOPJ fija para esa propuesta, que se hace por mayoría de tres quintos, «el plazo máximo de tres meses a contar desde el día siguiente al vencimiento del mandato anterior». Uno, seis y cuatro meses no son el plazo del artículo. Los cuatro meses aparecen en otro lugar de la ley, en el artículo 568.2, para el inicio del proceso de renovación del Consejo."
  citation: "art. 599.1 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-561
- id: m01-l04-q034
  prompt:
    es: "De acuerdo con el artículo 561 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial emite sus informes sobre anteproyectos de ley en el plazo improrrogable de:"
  options:
  - id: a
    text:
      es: "Quince días, o de diez si la orden de remisión hace constar la urgencia."
  - id: b
    text:
      es: "Treinta días, o de diez si la orden de remisión hace constar la urgencia."
  - id: c
    text:
      es: "Dos meses, o de un mes si la orden de remisión hace constar la urgencia."
  - id: d
    correct: true
    text:
      es: "Treinta días, o de quince si la orden de remisión hace constar la urgencia."
  explanation:
    es: "El artículo 561.2 LOPJ dice que el Consejo «emitirá su informe en el plazo improrrogable de treinta días» y que, si la orden de remisión hace constar la urgencia, «el plazo será de quince días». Quince días, o diez con urgencia, son las cifras de la prórroga excepcional del mismo apartado, no las del plazo ordinario. Treinta días, o diez con urgencia, mezcla el plazo ordinario con la prórroga urgente. Dos meses, o un mes con urgencia, supera hasta el máximo con prórroga, que es de treinta más quince días."
  citation: "art. 561.2 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q035
  prompt:
    es: "¿Cuál de los siguientes nombramientos requiere en el Consejo General del Poder Judicial una mayoría de tres quintos de los miembros presentes, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El del Promotor de la Acción Disciplinaria."
  - id: b
    text:
      es: "El del Director de la Escuela Judicial."
  - id: c
    correct: true
    text:
      es: "El de los Presidentes de Audiencias Provinciales."
  - id: d
    text:
      es: "El de los profesores de la Escuela Judicial."
  explanation:
    es: "El artículo 630.1 LOPJ exige tres quintos de los miembros presentes para nombrar a los Presidentes de Sala y Magistrados del Tribunal Supremo, al Presidente de la Audiencia Nacional y a los Presidentes de Sala de la Audiencia Nacional, a los Presidentes de los Tribunales Superiores de Justicia y de sus Salas, «y Presidentes de Audiencias Provinciales». Los otros tres nombramientos no están en esa lista, así que el artículo 630.1 no les exige tres quintos. Para el Promotor, el artículo 606.3 pide mayoría absoluta en primera votación y, si nadie la obtiene, basta en segunda votación con el mayor número de votos."
  citation: "art. 630.1 LOPJ"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q036
  prompt:
    es: "¿Qué ocurre en caso de empate en las votaciones de los órganos colegiados del Consejo General del Poder Judicial según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Se repite la votación hasta obtener la mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Decide el voto de calidad de quien preside."
  - id: c
    text:
      es: "Decide el voto del Vocal de más edad."
  - id: d
    text:
      es: "Se entiende rechazada la propuesta sometida a votación."
  explanation:
    es: "El artículo 630.1 LOPJ dice: «Quien preside tendrá voto de calidad en caso de empate». La ley no prevé repetir la votación, ni dar el desempate al Vocal de más edad, ni tener por rechazada la propuesta."
  citation: "art. 630.1 LOPJ"
  difficulty: 2
  tags:
  - "mayoría"
  - "efecto"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q051
  prompt:
    es: "Según el artículo 122 de la Constitución Española de 1978, ¿cuál de las siguientes afirmaciones sobre el Consejo General del Poder Judicial es correcta?"
  options:
  - id: a
    text:
      es: "Lo preside el Ministro de la Presidencia, Justicia y Relaciones con las Cortes, y sus veinte miembros son nombrados por el Rey por cinco años."
  - id: b
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son nombrados por el Rey por el tiempo de la legislatura."
  - id: c
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son elegidos por los propios Jueces y Magistrados por cinco años."
  - id: d
    correct: true
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son nombrados por el Rey por cinco años."
  explanation:
    es: "El artículo 122.3 dice que el Consejo «estará integrado por el Presidente del Tribunal Supremo, que lo presidirá, y por veinte miembros nombrados por el Rey por un período de cinco años». El Ministro de la Presidencia, Justicia y Relaciones con las Cortes no lo preside: la presidencia es del Presidente del Tribunal Supremo. El nombramiento por el tiempo de la legislatura sustituye los «cinco años» del apartado. Los veinte miembros los nombra el Rey, no los eligen los propios Jueces y Magistrados: el apartado solo exige que doce procedan de la judicatura, y los otros ocho se nombran a propuesta del Congreso y del Senado."
  citation: "art. 122.3 CE"
  difficulty: 1
  tags:
  - "composición"
  - "plazo"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q053
  prompt:
    es: "¿Cuál de los siguientes requisitos exige la Constitución Española de 1978 a los abogados y otros juristas que se eligen a propuesta del Congreso y del Senado como miembros del Consejo General del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Estar en situación de servicio activo en la carrera judicial."
  - id: b
    correct: true
    text:
      es: "Ser de reconocida competencia y tener más de quince años de ejercicio en su profesión."
  - id: c
    text:
      es: "Ser de reconocida competencia y tener más de veinticinco años de antigüedad en su profesión."
  - id: d
    text:
      es: "Pertenecer como Juez o Magistrado a cualquiera de las categorías judiciales."
  explanation:
    es: "El artículo 122.3 CE dice que los cuatro propuestos por cada Cámara se eligen «entre abogados y otros juristas, todos ellos de reconocida competencia y con más de quince años de ejercicio en su profesión». Una opción toma los veinticinco años que el artículo 586.1 LOPJ pide al jurista que aspire a Presidente del Tribunal Supremo y del Consejo. Las opciones del «servicio activo» y de las «categorías judiciales» describen a los doce que se escogen «entre Jueces y Magistrados de todas las categorías judiciales», no a los juristas; además, el artículo 567.3 LOPJ impide elegir por el turno de juristas a quien esté en servicio activo en la carrera judicial."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-12666-art-600
- id: m01-l04-q054
  prompt:
    es: "De acuerdo con el artículo 600 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, para la válida constitución del Pleno en la sesión de elección del Presidente se requiere la presencia de:"
  options:
  - id: a
    text:
      es: "Al menos diez Vocales y el Presidente del Tribunal Supremo y del Consejo."
  - id: b
    text:
      es: "Al menos dos tercios de sus miembros, incluido en todo caso el Presidente saliente."
  - id: c
    text:
      es: "Al menos quince de sus miembros, de los cuales ocho del turno judicial."
  - id: d
    correct: true
    text:
      es: "Al menos doce de sus miembros."
  explanation:
    es: "El artículo 600.3 LOPJ dice que en la sesión de elección del Presidente «será necesaria, para la válida constitución del Pleno, al menos la presencia de doce de sus miembros». La opción de diez Vocales y el Presidente es la regla de los demás casos (art. 600.4), que no rige en esa sesión. Las opciones de dos tercios con el Presidente saliente y de quince miembros con ocho del turno judicial no aparecen en el artículo."
  citation: "art. 600.3 LOPJ"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12666-art-566
- id: m01-l04-q084
  prompt:
    es: "Según el artículo 566 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial lo integran su Presidente y veinte Vocales: doce Jueces o Magistrados en servicio activo y ocho:"
  options:
  - id: a
    text:
      es: "Letrados de la Administración de Justicia."
  - id: b
    text:
      es: "Fiscales de Sala del Tribunal Supremo."
  - id: c
    text:
      es: "Catedráticos de Derecho de universidades públicas."
  - id: d
    correct: true
    text:
      es: "Juristas de reconocida competencia."
  explanation:
    es: "El artículo 566 dice «doce serán Jueces o Magistrados en servicio activo en la carrera judicial y ocho juristas de reconocida competencia». Los Letrados de la Administración de Justicia, los Fiscales de Sala y los catedráticos no tienen reservado ese turno."
  citation: "art. 566 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q085
  prompt:
    es: "Según el artículo 567.4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, las Cámaras designarán suplentes de los Vocales del Consejo General del Poder Judicial de este modo:"
  options:
  - id: a
    text:
      es: "Dos suplentes por cada uno de los Vocales titulares."
  - id: b
    correct: true
    text:
      es: "Un suplente por cada uno de los Vocales titulares."
  - id: c
    text:
      es: "Un suplente por cada Cámara, que cubre cualquier vacante."
  - id: d
    text:
      es: "Ningún suplente: las vacantes las cubre el Pleno del Consejo."
  explanation:
    es: "El artículo 567.4 dice que «las Cámaras designarán un suplente por cada uno de los vocales titulares». No son dos por Vocal ni uno por Cámara, y el Pleno del Consejo no cubre las vacantes."
  citation: "art. 567.4 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q086
  prompt:
    es: "Señale la opción correcta. De acuerdo con el artículo 567.5 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la designación de Vocales del nuevo Consejo General del Poder Judicial no podrá recaer en ningún caso en:"
  options:
  - id: a
    text:
      es: "Jueces o Magistrados en servicio activo."
  - id: b
    text:
      es: "Juristas con más de quince años de ejercicio."
  - id: c
    text:
      es: "Abogados que hayan ejercido ante el Tribunal Supremo."
  - id: d
    correct: true
    text:
      es: "Vocales del Consejo saliente."
  explanation:
    es: "El artículo 567.5 impide designar a «Vocales del Consejo saliente». Los Jueces y Magistrados en servicio activo y los juristas con más de quince años son precisamente los perfiles que la ley pide, y el ejercicio ante el Supremo no es causa de exclusión."
  citation: "art. 567.5 LOPJ"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1985-12666-art-568
- id: m01-l04-q087
  prompt:
    es: "Conforme al artículo 568.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial se renueva en su totalidad cada cinco años, que se cuentan desde:"
  options:
  - id: a
    text:
      es: "La fecha del nombramiento de sus Vocales por el Rey."
  - id: b
    text:
      es: "La fecha de la elección de sus Vocales por las Cámaras."
  - id: c
    correct: true
    text:
      es: "La fecha de su constitución."
  - id: d
    text:
      es: "La fecha de la elección de su Presidente."
  explanation:
    es: "El artículo 568.1 dice «contados desde la fecha de su constitución». El nombramiento de los Vocales por el Rey, su elección por las Cámaras y la elección del Presidente son hitos anteriores o posteriores, pero no el punto de partida del plazo."
  citation: "art. 568.1 LOPJ"
  difficulty: 1
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1985-12666-art-569
- id: m01-l04-q089
  prompt:
    es: "De acuerdo con el artículo 569.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la toma de posesión y la sesión constitutiva del nuevo Consejo tienen lugar dentro de los cinco días posteriores a:"
  options:
  - id: a
    text:
      es: "La publicación del Real Decreto de nombramiento de los Vocales."
  - id: b
    correct: true
    text:
      es: "La expiración del anterior Consejo."
  - id: c
    text:
      es: "La elección del Presidente del Tribunal Supremo."
  - id: d
    text:
      es: "El vencimiento del plazo de designación de las Cámaras."
  explanation:
    es: "El artículo 569.2 fija los cinco días «posteriores a la expiración del anterior Consejo». El Real Decreto de nombramiento, la elección del Presidente y el plazo de designación de las Cámaras no son el inicio del cómputo."
  citation: "art. 569.2 LOPJ"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-582
- id: m01-l04-q090
  prompt:
    es: "¿Cuál de las siguientes es una causa de cese de los Vocales del Consejo General del Poder Judicial, según el artículo 582.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La decisión del Presidente del Gobierno, oído el Consejo de Ministros."
  - id: b
    text:
      es: "La moción de censura aprobada por el Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "El transcurso de los cinco años para los que fueron nombrados."
  - id: d
    text:
      es: "El cese del Presidente del Tribunal Supremo y del Consejo."
  explanation:
    es: "El artículo 582.1 dice que «sólo cesarán en sus cargos por el transcurso de los cinco años», por renuncia aceptada o por incapacidad, incompatibilidad o incumplimiento grave. Ni el Gobierno, ni el Congreso mediante moción de censura, ni el cese del Presidente son causas de cese."
  citation: "art. 582.1 LOPJ"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1985-12666-art-582
- id: m01-l04-q091
  prompt:
    es: "Según el artículo 582.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el cese de un Vocal por incapacidad, incompatibilidad o incumplimiento grave de los deberes del cargo lo aprecia el Pleno mediante:"
  options:
  - id: a
    text:
      es: "Una mayoría de dos tercios."
  - id: b
    text:
      es: "Una mayoría absoluta de los presentes."
  - id: c
    text:
      es: "Una mayoría simple."
  - id: d
    correct: true
    text:
      es: "Una mayoría de tres quintos."
  explanation:
    es: "El artículo 582.1 exige que lo aprecie el Pleno «mediante mayoría de tres quintos». Los dos tercios, la mayoría absoluta de los presentes y la simple no son la mayoría de esta decisión."
  citation: "art. 582.1 LOPJ"
  difficulty: 2
  tags:
  - "mayoría"
  - "procedimiento"
