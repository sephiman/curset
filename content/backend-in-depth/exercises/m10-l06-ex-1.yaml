type: quiz
variants:
- id: m10-l06-q01
  prompt:
    en: Which statement about the OWASP Top 10:2025 list and the OWASP API Security Top 10 2023 list is correct?
  options:
  - id: a
    text:
      en: Injection is A01:2025 in the Top 10:2025
  - id: b
    text:
      en: Software Supply Chain Failures is A10:2025 in the Top 10:2025
  - id: c
    text:
      en: Server Side Request Forgery is API3:2023 in the API Security Top 10
  - id: d
    correct: true
    text:
      en: Broken Access Control is A01:2025 in the Top 10:2025
  explanation:
    en: Broken Access Control is A01:2025 in the Top 10:2025. Injection as A01 is ruled out because the list names
      it A05:2025. Software Supply Chain Failures as A10 is ruled out because the list names it A03:2025. Server
      Side Request Forgery as API3 is ruled out because the API list names it API7:2023.
  citation: owasp-top10-2025#top-102025-list
  extract:
    en: A01:2025 - Broken Access Control
- id: m10-l06-q02
  prompt:
    en: Which statement about Broken Object Level Authorization (BOLA) in the OWASP API Security Top 10 2023 is
      correct?
  options:
  - id: a
    correct: true
    text:
      en: Every endpoint that takes an object ID needs an object-level authorization check
  - id: b
    text:
      en: Comparing the session user ID from the JWT token with the ID parameter fully solves it
  - id: c
    text:
      en: Reaching an endpoint the attacker should not access at all counts as BOLA
  - id: d
    text:
      en: Only sequential integer IDs can be manipulated, so UUIDs remove the problem
  explanation:
    en: Every API endpoint that receives an ID of an object and performs an action on it should implement object-level
      authorization checks. A full fix by comparing the session user ID with the ID parameter is ruled out because
      that comparison isn't a sufficient solution to BOLA. Counting access to a forbidden endpoint as BOLA is ruled
      out because that case is Broken Function Level Authorization (BFLA) rather than BOLA. Safety through UUIDs
      is ruled out because object IDs can be sequential integers, UUIDs, or generic strings.
  citation: owasp-api1-bola#is-the-api-vulnerable; owasp-api1-bola#api12023-broken-object-level-authorization
- id: m10-l06-q03
  prompt:
    en: An API endpoint returns an object that has internal properties, and clients can also update it. Which practice
      does the OWASP API Security Top 10 give to prevent Broken Object Property Level Authorization?
  options:
  - id: a
    text:
      en: Returning the whole object with `to_json()` and letting clients ignore extra fields
  - id: b
    correct: true
    text:
      en: Cherry-picking the specific object properties that the endpoint should return
  - id: c
    text:
      en: Binding client input automatically into internal objects to save code
  - id: d
    text:
      en: Letting clients change every property that they can see in the response
  explanation:
    en: Cherry-picking the specific object properties you want to return is the practice given. Returning the whole
      object with `to_json()` is ruled out because generic methods such as `to_json()` and `to_string()` should
      be avoided. Automatic binding of client input is ruled out because functions that automatically bind a client's
      input into internal objects should be avoided where possible. Letting clients change every visible property
      is ruled out because changes are allowed only to the properties that should be updated by the client.
  citation: owasp-api3-bopla#how-to-prevent
- id: m10-l06-q04
  prompt:
    en: A team adds permission checks to an API. Which statement about how those checks should be applied is correct
      according to the OWASP Authorization Cheat Sheet?
  options:
  - id: a
    text:
      en: Requests initiated by an AJAX script are exempt because the page already checked
  - id: b
    correct: true
    text:
      en: The technology should allow global, application-wide configuration instead of per-method setup
  - id: c
    text:
      en: One missed check is tolerable because an attacker needs several unprotected paths
  - id: d
    text:
      en: Checking most requests correctly is enough as long as the sensitive ones are covered
  explanation:
    en: The technology used for permission checks should allow global, application-wide configuration rather than
      being applied individually to every method or class. An exemption for AJAX requests is ruled out because permission
      should be validated on every request regardless of its origin. Tolerating one missed check is ruled out because
      an attacker only needs to find one way in. Covering only most requests is ruled out because validating permissions
      correctly on just the majority of requests is insufficient.
  citation: owasp-cs-authorization#validate-the-permissions-on-every-request
  extract:
    en: The technology used to perform such checks should allow for global, application-wide configuration rather
      than needing to be applied individually to every method or class.
- id: m10-l06-q05
  prompt:
    en: An application builds a SQL request that includes dynamic data from the user. Which defence does the OWASP
      SQL Injection Prevention Cheat Sheet prefer?
  options:
  - id: a
    text:
      en: Manually escaping the dynamic inputs before concatenating them
  - id: b
    correct: true
    text:
      en: Parameterized queries
  - id: c
    text:
      en: Escaping the table and column names that users choose
  - id: d
    text:
      en: Positive server-side input validation as the only defence
  explanation:
    en: Parameterized queries are the preferred pattern when including dynamic data in SQL requests. Manual escaping
      is ruled out because relying on manually escaping dynamic inputs is error-prone and strongly discouraged.
      Escaping user-chosen table and column names is ruled out because SQL structures such as table names and column
      names cannot be escaped. Validation as the only defence is ruled out because positive server-side input validation
      is not a complete defense.
  citation: owasp-cs-sql-injection#primary-defenses; owasp-top10-2025-a05#how-to-prevent
  extract:
    en: parameterized queries when including dynamic data in SQL requests;
- id: m10-l06-q06
  prompt:
    en: An API fetches a resource from a URL that the client supplies. Which measure does the OWASP API Security
      Top 10 give to prevent Server Side Request Forgery (SSRF)?
  options:
  - id: a
    correct: true
    text:
      en: Using allow lists of the remote origins, URL schemes and ports that are expected
  - id: b
    text:
      en: Following HTTP redirections so that moved resources still resolve
  - id: c
    text:
      en: Returning the raw response of the fetched resource to the client for debugging
  - id: d
    text:
      en: Writing a custom URL parser that handles parsing inconsistencies
  explanation:
    en: Allow lists of the expected remote origins, URL schemes and ports are the measure given. Following redirections
      is ruled out because HTTP redirections should be disabled. Returning the raw response is ruled out because
      raw responses must not be sent to clients. A custom URL parser is ruled out because a well-tested and maintained
      URL parser should be used.
  citation: owasp-api7-ssrf#how-to-prevent
- id: m10-l06-q08
  prompt:
    en: An application accepts file uploads and stores them on disk. Which practice does the OWASP File Upload Cheat
      Sheet give for the filenames of the stored files?
  options:
  - id: a
    text:
      en: Keeping the user's filename and block-listing dangerous characters as the preferred defence
  - id: b
    text:
      en: Allowing sequential periods because they only separate file extensions
  - id: c
    correct: true
    text:
      en: Generating a random name such as a UUID instead of keeping the user's filename
  - id: d
    text:
      en: Checking only the long filename on Windows because it is the file's only name
  explanation:
    en: Creating a random string as a filename, such as a UUID, is essential. Block-listing as the preferred defence
      is ruled out because block-listing dangerous characters is only the fallback when restricting characters to
      an allowed subset is not possible. Allowing sequential periods is ruled out because sequential periods (directory
      traversal) should be restricted. Checking only the long name is ruled out because a long filename on Windows/NTFS
      may have an 8.3 short name alias that bypasses a check on the long name.
  citation: owasp-cs-file-upload#filename-safety
  extract:
    en: In order to avoid the above mentioned threat, creating a random string as a filename, such as generating
      a UUID/GUID, is essential.
- id: m10-l06-q09
  prompt:
    en: Which statement about defending against cross-site request forgery (CSRF) in Spring Security and the OWASP
      CSRF Cheat Sheet is correct?
  options:
  - id: a
    text:
      en: Fetch Metadata headers replace origin verification, so legacy browsers need no fallback
  - id: b
    text:
      en: '`Sec-Fetch-Mode` is the primary signal for CSRF protection, ahead of `Sec-Fetch-Site`'
  - id: c
    correct: true
    text:
      en: A missing token ends in an `AccessDeniedException` handled by the `AccessDeniedHandler`
  - id: d
    text:
      en: The synchronizer token pattern is discouraged because it keeps state on the server
  explanation:
    en: If the actual CSRF token is invalid or missing, an `AccessDeniedException` is passed to the `AccessDeniedHandler`.
      Dropping the fallback is ruled out because a fallback to standard origin verification headers is mandatory
      for any Fetch Metadata implementation. `Sec-Fetch-Mode` as the primary signal is ruled out because `Sec-Fetch-Site`
      is the primary signal for CSRF protection. Discouraging the synchronizer token pattern is ruled out because
      it is one of the most popular and recommended methods to mitigate CSRF.
  citation: spring-security-servlet-exploits-csrf#csrf-components; owasp-cs-csrf#fetch-metadata-headers; owasp-cs-csrf#token-based-mitigation
- id: m10-l06-q10
  prompt:
    en: A Spring Security application customizes its CORS handling and its default response security headers. Which
      statement about that configuration is correct?
  options:
  - id: a
    correct: true
    text:
      en: CORS is configured automatically only if a `UrlBasedCorsConfigurationSource` instance is present
  - id: b
    text:
      en: '`defaultsDisabled()` followed by `cacheControl(withDefaults())` keeps all of the default headers'
  - id: c
    text:
      en: '`headers.disable()` removes only the cache control header'
  - id: d
    text:
      en: To change one default header, all the defaults must be disabled first
  explanation:
    en: Spring Security configures CORS automatically only if a `UrlBasedCorsConfigurationSource` instance is present.
      Keeping all defaults is ruled out because that configuration adds only Cache Control. A `headers.disable()`
      limited to cache control is ruled out because it disables all of the HTTP security response headers. Disabling
      the defaults first is ruled out because you can keep the defaults and specify `SAMEORIGIN` for `X-Frame-Options`.
  citation: spring-security-servlet-integrations-cors#cors-configuration-source; spring-security-servlet-exploits-headers#servlet-headers-default
- id: m10-l06-q11
  prompt:
    en: A team defines validation rules for the input of a web application. Which statement about input validation
      in the OWASP Input Validation Cheat Sheet is correct?
  options:
  - id: a
    correct: true
    text:
      en: Validation covers both syntax and semantics, such as an end date after its start date
  - id: b
    text:
      en: Blocking apostrophes makes a database query safe against injection
  - id: c
    text:
      en: The application should recognize every malicious string and reject it
  - id: d
    text:
      en: Free-form comments must be restricted to letters and digits
  explanation:
    en: Validation covers both syntax, the expected type and format, and semantics, whether the value makes sense
      for the operation. Blocking apostrophes is ruled out because it rejects legitimate names without making a
      database query safe. Recognizing every malicious string is ruled out because the guidance says not to try
      to recognize every malicious string. A letters-and-digits rule is ruled out because an allowlist for free-form
      comments can permit broad Unicode text while limiting its length.
  citation: owasp-cs-input-validation#input-validation-strategies; owasp-cs-input-validation#allowlist-vs-denylist
  extract:
    en: Validate both syntax (the expected type and format) and semantics (whether the value makes sense for the
      operation).
- id: m10-l06-q13
  prompt:
    en: Which statement about Kubernetes Secrets and access to them, according to the Kubernetes documentation,
      is correct?
  options:
  - id: a
    text:
      en: The kubelet writes a mounted Secret to durable node storage so that it survives restarts
  - id: b
    text:
      en: Every Secret of a namespace is sent to every node, in case a Pod needs it
  - id: c
    text:
      en: A Pod can read the Secrets of other Pods that run on the same node
  - id: d
    correct: true
    text:
      en: Granting `list` or `watch` on Secrets lets a subject read all Secret data in that namespace
  explanation:
    en: Granting `list` or `watch` permissions on Secrets allows a subject to read all Secret data in that namespace,
      not only the Secrets referenced by its Pods. Writing a mounted Secret to durable storage is ruled out because
      the kubelet stores a copy in a `tmpfs` so the data is not written to durable storage. Sending every Secret
      to every node is ruled out because a Secret is only sent to a node if a Pod on that node requires it. Reading
      the Secrets of other Pods is ruled out because one Pod does not have access to the Secrets of another Pod.
  citation: k8s-secrets#information-security-for-secrets
  extract:
    en: For example, granting list or watch permissions on Secrets allows a subject to read all Secret data in that
      namespace, not only the Secrets explicitly referenced by its Pods.
- id: m10-l06-q14
  prompt:
    en: According to the OWASP Secrets Management Cheat Sheet, which practice applies to a secret that a Java application
      holds in memory?
  options:
  - id: a
    text:
      en: Storing it in a `String`, because immutable objects are collected promptly
  - id: b
    correct: true
    text:
      en: Using a char array or byte array, whose memory can be directly overwritten
  - id: c
    text:
      en: Keeping it in memory for the whole life of the process so it is always available
  - id: d
    text:
      en: Skipping any protection of secrets in memory, because it is always overkill
  explanation:
    en: A char array or byte array is used instead, because its memory can be directly overwritten. Storing the
      secret in a `String` is ruled out because it is impossible to force immutable structures such as Strings to
      be garbage collected. Keeping it for the whole process life is ruled out because the goal is to minimize the
      time window where the secret is in plaintext in memory. Always skipping protection is ruled out because in
      highly sensitive environments, protecting secrets in memory can be a valuable additional layer of security.
  citation: owasp-cs-secrets#25-handling-secrets-in-memory
  extract:
    en: Instead, use primitive types such as byte arrays or char arrays, where the memory can be directly overwritten.
- id: m10-l06-q15
  prompt:
    en: A team adopts SLSA to secure its software supply chain. Which statement about the levels of the SLSA build
      and source tracks is correct?
  options:
  - id: a
    text:
      en: At Build L1, the build platform signs the provenance so tampering is prevented
  - id: b
    text:
      en: At Build L3, the signing material may be reachable by user-defined build steps
  - id: c
    text:
      en: Source L1 requires code review of every change
  - id: d
    correct: true
    text:
      en: At Build L2, builds run on a hosted platform that generates and signs the provenance
  explanation:
    en: At Build L2, builds run on a hosted platform that generates and signs the provenance. A signed and tamper-proof
      Build L1 is ruled out because provenance may be incomplete or unsigned at L1. Reachable signing material at
      Build L3 is ruled out because the platform must prevent secret material used to sign the provenance from being
      accessible to user-defined build steps. Code review at Source L1 is ruled out because Source L1 requires only
      a version control system.
