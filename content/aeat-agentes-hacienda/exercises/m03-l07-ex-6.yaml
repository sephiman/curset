    es: "En una tasación pericial contradictoria, el valor declarado por Aceites Montoro, S.L. es de 200.000 euros y el perito tercero tasa los bienes en 250.000 euros. Según el artículo 135.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quién abona los gastos del perito tercero?"
  options:
  - id: a
    correct: true
    text:
      es: "El obligado tributario, porque la diferencia de 50.000 euros supera el 20 por ciento del valor declarado."
  - id: b
