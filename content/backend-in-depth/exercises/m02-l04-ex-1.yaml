- id: m02-l04-q04
  prompt:
    en: A priority-queue shortest-path search settles each vertex once. It runs on a four-vertex graph with non-negative
      weights and then on a three-vertex graph where an edge of weight -2 leads from vertex 2 to vertex 1. What
      is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'distances [0, 3, 1, 4]

        with a negative edge [0, 2, 3]'
  - id: b
    text:
      en: 'distances [0, 3, 1, 4]

        with a negative edge [0, 1, 3]'
  - id: c
    text:
      en: 'distances [0, 4, 1, 4]

        with a negative edge [0, 2, 3]'
  - id: d
    text:
      en: 'distances [0, 3, 1, 6]

        with a negative edge [0, 2, 3]'
  explanation:
    en: The first graph gives `distances [0, 3, 1, 4]`, and the negative edge makes the second run print `with a
      negative edge [0, 2, 3]`, because vertex 1 is settled with 2 before the edge from vertex 2 is seen. The line
      `with a negative edge [0, 1, 3]` is the true shortest distance, but a search that scans each vertex once does
      not reach it. The line `distances [0, 4, 1, 4]` uses the direct edge of weight 4 to vertex 1, but the path
      0, 2, 1 costs 1 + 2 = 3. The line `distances [0, 3, 1, 6]` uses 1 + 5 for vertex 3, but the path through vertex
      1 costs 3 + 1 = 4.
  citation: erickson-shortest-paths#p15
  extract:
    en: If G has no negative-weight edges, then when D ends, dist(v) is the length of the shortest path in G from
      s to v, for every vertex v.
  snippet: m02-l04/Dijkstra.java
- id: m02-l04-q06
  prompt:
    en: In the adjacency list implementation of a graph in Open Data Structures, which operation scans the adjacency
      list of every vertex in order to build its result?
  options:
  - id: a
    text:
      en: '`outEdges(i)`'
  - id: b
    correct: true
    text:
      en: '`inEdges(i)`'
  - id: c
    text:
      en: '`addEdge(i, j)`'
  - id: d
    text:
      en: '`removeEdge(i, j)`'
  explanation:
    en: '`inEdges(i)` scans the adjacency list of every vertex, which is why the book calls it very slow. `outEdges(i)`
      returns the list of vertex `i` without scanning. `addEdge(i, j)` just appends a value to one list. `removeEdge(i,
      j)` searches through one list until it finds the value.'
  citation: ods-12-2-adjacencylists-graph-a#SECTION001520000000000000000
  extract:
    en: It scans the adjacency list of every vertex, so it takes time.
- id: m02-l04-q08
  prompt:
    en: In a disjoint-set data structure where every set has a leader, what does `Find(x)` return for an element
      x?
  options:
  - id: a
    text:
      en: The union of the set of x with another set
  - id: b
    correct: true
    text:
      en: The leader of the set that contains x
  - id: c
    text:
      en: A new set that contains only x
  - id: d
    text:
      en: Any element of the set of x, chosen freely on each call
  explanation:
    en: '`Find(x)` returns the leader of the set containing x. The union of two sets is the result of `Union(A,
      B)`, which replaces the two sets with their union. A new set that contains only x is what `MakeSet(x)` creates.
      A freely chosen element is wrong, because each set has a unique leader element that identifies the set.'
  citation: erickson-union-find#p1
- id: m02-l04-q10
  prompt:
    en: In Erickson's analysis of Dijkstra's algorithm on a graph with no negative-weight edges, what holds for
      each distance label `dist(v)`, in contrast with breadth-first search?
  options:
  - id: a
    text:
      en: It can change again after its vertex has been extracted from the priority queue
  - id: b
    text:
      en: It can increase when a longer path to the vertex is found
  - id: c
    correct: true
    text:
      en: It can change multiple times
  - id: d
    text:
      en: It changes exactly once, as in breadth-first search
  explanation:
    en: Unlike in breadth-first search, each distance label `dist(v)` can change multiple times. The claim that
      it changes after its vertex leaves the priority queue is wrong, because after the vertex is extracted its
      distance label never changes. The claim that it can increase is wrong, because the distance label never increases.
      The claim that it changes exactly once is wrong, because after the first change each further change to `dist(v)`
      is followed by a decrease-key call.
  citation: erickson-shortest-paths#p15
  extract:
    en: However, unlike in breadth-first search, each distance label dist(v) can change multiple times.
