type: quiz
variants:
- id: m06-l04-qa02
  prompt:
    en: According to Danilo Sato in Parallel Change, what happens to the interface in the expand phase of the pattern
      for making a backward-incompatible change?
  options:
  - id: a
    correct: true
    text:
      en: The interface is augmented to support both the old and the new versions
  - id: b
    text:
      en: The old version is removed at once and every client is moved to the new one
  - id: c
    text:
      en: Every existing method is changed in place, so that old clients break at once
  - id: d
    text:
      en: All clients are updated to the new version, which can take the longest time
  explanation:
    en: Sato writes that in the expand phase you augment the interface to support both the old and the new versions.
      He rules out removing the old version at once, because he writes that the contract phase, which removes the
      old version, comes once all usages have been migrated to the new version. He rules out changing every existing
      method in place, because he describes introducing new methods that can receive the new type without changing
      the existing code. He rules out updating all clients in this phase, because he writes that you update all
      clients during the migrate phase.
  citation: fowler-parallel-change#banner
