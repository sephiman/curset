  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q073
  prompt:
    es: "Según el artículo 55.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la organización central los Ministros y los Secretarios de Estado son:"
  options:
  - id: a
    text:
      es: "Órganos directivos."
  - id: b
    text:
      es: "Órganos colegiados."
  - id: c
    correct: true
    text:
      es: "Órganos superiores."
  - id: d
    text:
      es: "Órganos de gestión de los servicios comunes."
  explanation:
    es: "El artículo 55.3.a clasifica a los Ministros y a los Secretarios de Estado como órganos superiores. Los órganos directivos son Subsecretarios, Secretarios generales, Secretarios generales técnicos, Directores generales y Subdirectores generales. Los servicios comunes los gestionan órganos directivos concretos, no los órganos superiores."
  citation: "art. 55.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-55
