# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q001
  prompt:
    es: "De acuerdo con el artículo 1.1 del Código Civil, las fuentes del ordenamiento jurídico español son:"
  options:
  - id: a
    correct: true
    text:
      es: "La ley, la costumbre y los principios generales del derecho."
  - id: b
    text:
      es: "La ley, la jurisprudencia y los principios generales del derecho."
  - id: c
    text:
      es: "La ley, la costumbre y la jurisprudencia."
  - id: d
    text:
      es: "La Constitución, la ley y los principios generales del derecho."
  explanation:
    es: "El artículo 1.1 enumera tres fuentes: «la ley, la costumbre y los principios generales del derecho». La jurisprudencia no está en la lista: el artículo 1.6 dice que «complementará» el ordenamiento, así que las dos opciones que la incluyen como fuente cambian el texto. La opción que empieza por la Constitución quita la costumbre, que el artículo 1.1 sí nombra."
  citation: "art. 1.1 Código Civil"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m03-l01-q003
  prompt:
    es: "Según el artículo 9.3 de la Constitución Española de 1978, ¿cuál de los siguientes principios garantiza la Constitución?"
  options:
  - id: a
    text:
      es: "La irretroactividad de todas las disposiciones normativas, sean o no sancionadoras."
  - id: b
    text:
      es: "La irretroactividad de las disposiciones sancionadoras favorables o ampliatorias de derechos individuales."
  - id: c
    text:
      es: "La retroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales."
  - id: d
    correct: true
    text:
      es: "La irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales."
  explanation:
    es: "El artículo 9.3 garantiza «la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales». No garantiza la irretroactividad de todas las disposiciones: las leyes pueden ser retroactivas si así lo disponen (art. 2.3 Código Civil). La opción de las disposiciones favorables invierte el supuesto. La opción que habla de retroactividad dice lo contrario de lo que garantiza el artículo."
  citation: "art. 9.3 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m03-l01-q004
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge principios que garantiza la Constitución Española de 1978 en su artículo 9.3?"
  options:
  - id: a
    text:
      es: "La seguridad jurídica, la eficacia y la interdicción de la arbitrariedad de los poderes públicos."
  - id: b
    correct: true
    text:
      es: "La seguridad jurídica, la responsabilidad y la interdicción de la arbitrariedad de los poderes públicos."
  - id: c
    text:
      es: "La seguridad jurídica, la responsabilidad y la desconcentración de los poderes públicos."
  - id: d
    text:
      es: "La seguridad jurídica, la proporcionalidad y la jerarquía de los poderes públicos."
  explanation:
    es: "El artículo 9.3 CE garantiza «el principio de legalidad, la jerarquía normativa, la publicidad de las normas, la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, la seguridad jurídica, la responsabilidad y la interdicción de la arbitrariedad de los poderes públicos». La eficacia y la desconcentración son principios de actuación de la Administración del artículo 103.1. La proporcionalidad no es uno de los siete principios del 9.3, y lo que el 9.3 garantiza es la «jerarquía normativa», la de las normas, no una jerarquía de los poderes públicos."
  citation: "art. 9.3 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q005
  prompt:
    es: "En el sistema de fuentes del ordenamiento jurídico español, las disposiciones que contradigan otra de rango superior:"
  options:
  - id: a
    text:
      es: "Serán válidas hasta que una norma posterior las derogue expresamente."
  - id: b
    correct: true
    text:
      es: "Carecerán de validez por contradecir una disposición de rango superior."
  - id: c
    text:
      es: "Serán válidas si se han publicado en el «Boletín Oficial del Estado»."
  - id: d
    text:
      es: "Serán anulables solo a instancia del órgano que dictó la superior."
  explanation:
    es: "El artículo 1.2 del Código Civil dice que «carecerán de validez las disposiciones que contradigan otra de rango superior». Ni la falta de derogación expresa ni la publicación en el «Boletín Oficial del Estado» salvan una disposición que contradice otra superior. La opción de la anulabilidad a instancia del órgano superior no está en el texto; para las disposiciones administrativas, el artículo 47.2 LPAC prevé además la nulidad de pleno derecho."
  citation: "art. 1.2 Código Civil"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-128
- id: m03-l01-q006
  prompt:
    es: "De acuerdo con el artículo 128.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las disposiciones administrativas:"
  options:
  - id: a
    text:
      es: "Se ajustarán al orden de jerarquía que fije el Consejo de Ministros."
  - id: b
    text:
      es: "Se ajustarán al orden que fije cada Ministerio."
  - id: c
    correct: true
    text:
      es: "Se ajustarán al orden de jerarquía que establezcan las leyes."
  - id: d
    text:
      es: "Se ajustarán al orden de jerarquía que establezcan sus propios preámbulos."
  explanation:
    es: "El artículo 128.3 dice que las disposiciones administrativas «se ajustarán al orden de jerarquía que establezcan las leyes». El orden no lo fija el Consejo de Ministros ni cada Administración Pública, y menos el preámbulo de cada disposición: lo fijan las leyes, como hace el artículo 24.2 de la Ley 50/1997 para los reglamentos del Estado."
  citation: "art. 128.3 LPAC"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-24
- id: m03-l01-q007
  prompt:
    es: "Según el artículo 24.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los reglamentos se ordenarán según la siguiente jerarquía:"
  options:
  - id: a
    correct: true
    text:
      es: "1.º Real Decreto del Presidente del Gobierno o acordado en Consejo de Ministros; 2.º Orden Ministerial."
  - id: b
    text:
      es: "1.º Orden Ministerial; 2.º Real Decreto del Presidente del Gobierno o acordado en Consejo de Ministros."
  - id: c
    text:
      es: "1.º Real Decreto del Presidente del Gobierno; 2.º Real Decreto acordado en Consejo de Ministros; 3.º Orden."
  - id: d
    text:
      es: "1.º Real Decreto acordado en Consejo de Ministros; 2.º Real Decreto del Presidente; 3.º Orden Ministerial."
  explanation:
    es: "El artículo 24.2 tiene dos escalones: «1.º Disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros. 2.º Disposiciones aprobadas por Orden Ministerial». La opción que pone primero la Orden Ministerial invierte el orden. Las dos opciones de tres escalones separan los dos tipos de Real Decreto, que el artículo sitúa en el mismo rango."
  citation: "art. 24.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-149
- id: m03-l01-q009
  prompt:
    es: "Según el artículo 149.3 de la Constitución Española de 1978, en caso de conflicto, las normas del Estado:"
  options:
  - id: a
    text:
      es: "Prevalecerán siempre sobre las autonómicas, por emanar de las Cortes Generales."
  - id: b
    text:
      es: "Cederán ante las autonómicas en todo lo que no esté atribuido a la exclusiva competencia del Estado."
  - id: c
    correct: true
    text:
      es: "Prevalecerán sobre las autonómicas en todo lo que no esté atribuido a la exclusiva competencia de éstas."
  - id: d
    text:
      es: "Prevalecerán sobre las autonómicas solo cuando así lo declare el Tribunal Constitucional."
  explanation:
    es: "El artículo 149.3 dice que las normas del Estado «prevalecerán, en caso de conflicto, sobre las de las Comunidades Autónomas en todo lo que no esté atribuido a la exclusiva competencia de éstas». La prevalencia no es absoluta: no alcanza a las competencias exclusivas autonómicas, y no depende de que la ley venga de las Cortes Generales. El artículo no hace ceder la norma estatal ni exige una declaración del Tribunal Constitucional."
  citation: "art. 149.3 CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m03-l01-q010
  prompt:
    es: "¿Qué carácter tiene el derecho estatal respecto del derecho de las Comunidades Autónomas según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Es, en todo caso, supletorio del derecho de las Comunidades Autónomas."
  - id: b
    text:
      es: "Es preferente en todo caso, aunque la materia sea de competencia exclusiva autonómica."
  - id: c
    text:
      es: "Es supletorio solo cuando así lo disponga el Estatuto de Autonomía respectivo."
  - id: d
    text:
      es: "Está subordinado al derecho autonómico en las materias de competencia compartida."
  explanation:
    es: "El artículo 149.3 dice: «El derecho estatal será, en todo caso, supletorio del derecho de las Comunidades Autónomas». La supletoriedad no depende de lo que diga cada Estatuto. La prevalencia estatal no alcanza a la competencia exclusiva autonómica, y el artículo no subordina el derecho estatal al autonómico."
  citation: "art. 149.3 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-81
- id: m03-l01-q011
  prompt:
    es: "¿Qué mayoría exige la Constitución Española de 1978 para la aprobación, modificación o derogación de las leyes orgánicas?"
  options:
  - id: a
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Mayoría de dos tercios del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    text:
      es: "Mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto."
  explanation:
    es: "El artículo 81.2 exige «mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto». Los tres quintos, los dos tercios y la mayoría simple son otras mayorías que la Constitución usa para otros actos, no para las leyes orgánicas."
  citation: "art. 81.2 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-2015-10565-art-131
- id: m03-l01-q012
  prompt:
    es: "De acuerdo con el artículo 131 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las normas con rango de ley, los reglamentos y disposiciones administrativas:"
  options:
  - id: a
    text:
      es: "Entrarán en vigor desde su aprobación, aunque no se publiquen en ningún diario oficial."
  - id: b
    text:
      es: "Producirán efectos desde su notificación a los interesados, sin necesidad de publicación oficial."
  - id: c
    text:
      es: "Habrán de publicarse en el «Boletín Oficial del Estado», cualquiera que sea la Administración autora."
  - id: d
    correct: true
    text:
      es: "Habrán de publicarse en el diario oficial correspondiente para que entren en vigor y produzcan efectos."
  explanation:
    es: "El artículo 131 dice que estas normas «habrán de publicarse en el diario oficial correspondiente para que entren en vigor y produzcan efectos jurídicos». Sin publicación no entran en vigor, y la notificación a los interesados no la sustituye. El diario es el «correspondiente» a cada Administración, no siempre el «Boletín Oficial del Estado»."
  citation: "art. 131 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1889-4763-art-2
- id: m03-l01-q013
  prompt:
    es: "Según el Código Civil, si en ella no se dispone otra cosa, una ley entrará en vigor:"
  options:
  - id: a
    correct: true
    text:
      es: "A los veinte días de su completa publicación en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "A los veinte días de su sanción por el Rey, aunque no se haya publicado."
  - id: c
    text:
      es: "A los veinte días de su aprobación definitiva por las Cortes Generales."
  - id: d
    text:
      es: "A los veinte días de su publicación en extracto en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 2.1 dice que las leyes entrarán en vigor «a los veinte días de su completa publicación en el «Boletín Oficial del Estado», si en ellas no se dispone otra cosa». El plazo no corre desde la sanción ni desde la aprobación por las Cortes, sino desde la publicación. Tiene que ser completa: una publicación en extracto no basta."
  citation: "art. 2.1 Código Civil"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1889-4763-art-2
- id: m03-l01-q014
  prompt:
    es: "De acuerdo con el artículo 2.1 del Código Civil, el plazo de veinte días para la entrada en vigor de las leyes:"
  options:
  - id: a
    text:
      es: "Se aplica a todas las leyes, sin que estas puedan fijar un plazo distinto."
  - id: b
    text:
      es: "Solo puede reducirse mediante un real decreto-ley posterior a la ley."
  - id: c
    correct: true
    text:
      es: "Se aplica si en la propia ley no se dispone otra cosa."
  - id: d
    text:
      es: "Solo se aplica a las leyes orgánicas."
  explanation:
    es: "El artículo 2.1 fija los veinte días «si en ellas no se dispone otra cosa». Cada ley puede fijar su propia entrada en vigor, así que la opción que lo prohíbe contradice el texto. El artículo no reserva el cambio a un real decreto-ley ni limita la regla a las leyes orgánicas y los decretos legislativos."
  citation: "art. 2.1 Código Civil"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1889-4763-art-2
- id: m03-l01-q015
  prompt:
    es: "¿Recobra vigencia una ley derogada cuando se deroga la ley que la había derogado, según el Código Civil?"
  options:
  - id: a
    text:
      es: "Sí, de forma automática, desde la entrada en vigor de la ley que deroga a la derogatoria."
  - id: b
    correct: true
    text:
      es: "No; por la simple derogación de una ley no recobran vigencia las que esta hubiere derogado."
  - id: c
    text:
      es: "Sí, siempre que la nueva ley derogatoria se publique en el «Boletín Oficial del Estado»."
  - id: d
    text:
      es: "Sí, salvo que la ley derogada fuera una ley orgánica aprobada por el Congreso."
  explanation:
    es: "El artículo 2.2 dice: «Por la simple derogación de una ley no recobran vigencia las que ésta hubiere derogado». No hay recuperación automática de la vigencia. La publicación de la nueva ley y el carácter orgánico de la ley derogada no cambian la regla."
  citation: "art. 2.2 Código Civil"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1889-4763-art-2
- id: m03-l01-q016
  prompt:
    es: "Según el artículo 2.2 del Código Civil, en relación con la derogación de las normas, las leyes:"
  options:
  - id: a
    text:
      es: "Pueden ser derogadas por un reglamento posterior que regule la misma materia."
  - id: b
    text:
      es: "Pierden su vigencia por el desuso."
  - id: c
    text:
      es: "Pueden ser derogadas por la costumbre posterior contraria que resulte probada."
  - id: d
    correct: true
    text:
      es: "Solo se derogan por otras leyes posteriores."
  explanation:
    es: "El artículo 2.2 dice: «Las leyes sólo se derogan por otras posteriores». Un reglamento no puede derogar una ley, porque carece de validez la disposición que contradice otra de rango superior (art. 1.2). El desuso no deroga. La costumbre solo rige en defecto de ley aplicable (art. 1.3), así que tampoco puede derogarla."
  citation: "art. 2.2 Código Civil"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1889-4763-art-2
- id: m03-l01-q017
  prompt:
    es: "Conforme al artículo 2.3 del Código Civil, en cuanto a su eficacia en el tiempo, las leyes:"
  options:
  - id: a
    correct: true
    text:
      es: "No tendrán efecto retroactivo, si no dispusieren lo contrario."
  - id: b
    text:
      es: "No tendrán efecto retroactivo en ningún caso, aunque lo dispongan."
  - id: c
    text:
      es: "Tendrán efecto retroactivo, si no dispusieren lo contrario."
  - id: d
    text:
      es: "Tendrán efecto retroactivo solo cuando sean favorables a los interesados."
  explanation:
    es: "El artículo 2.3 dice: «Las leyes no tendrán efecto retroactivo, si no dispusieren lo contrario». La regla es la irretroactividad, pero la propia ley puede disponer lo contrario, así que la opción «en ningún caso» es falsa. La opción que hace de la retroactividad la regla invierte el texto. El artículo no limita la retroactividad a las leyes favorables."
  citation: "art. 2.3 Código Civil"
  difficulty: 1
  tags:
  - "efecto"
