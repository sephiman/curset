type: quiz
variants:
- id: m11-l01-v-takewhile-001
  prompt:
    en: |-
      What does this program print? The stream is ordered, because `Stream.of` keeps the order of its arguments.

      ```java
      import java.util.stream.Stream;

      public class Main {
          public static void main(String[] args) {
              System.out.println(Stream.of(1, 2, 5, 1, 6, 2)
                      .takeWhile(n -> n < 4)
                      .toList());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[1, 2]`'
    correct: true
  - id: b
    text:
      en: '`[1, 2, 1, 2]`'
  - id: c
    text:
      en: '`[5, 1, 6, 2]`'
  - id: d
    text:
      en: '`[]`'
  explanation:
    en: '`takeWhile` returns the longest prefix of elements that match `n < 4`. It stops at the first element that fails and
      does not test the elements after it. The program prints `[1, 2]`. `[1, 2, 1, 2]` comes from this mistake: using `filter`,
      which tests every element instead of stopping at the first failure. `[5, 1, 6, 2]` comes from this mistake: using `dropWhile`
      where `takeWhile` was written. `[]` comes from this mistake: applying the negated predicate.'
  family: takewhile
  code_reading: true
  citation: javadoc-stream#takeWhile(java.util.function.Predicate)
  difficulty: 2
  tags: &id001
  - streams
