    text:
      es: "Título del gráfico"
  - id: c
    text:
      es: "Leyenda"
  - id: d
    text:
      es: "Líneas de cuadrícula"
  explanation:
    es: "En Agregar elemento de gráfico se elige Línea de tendencia y después el tipo de línea. Título del gráfico, Leyenda y Líneas de cuadrícula son otros elementos del gráfico que se muestran u ocultan."
  citation: "fuente: `ms-excel-graficos.html`; «Agregar una línea de tendencia»"
