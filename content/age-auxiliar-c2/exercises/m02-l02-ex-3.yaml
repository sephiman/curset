# anchor: boe-a-2005-14836-art-14
- id: m02-l02-q017
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la unidad responsable de la gestión de las quejas y sugerencias en la Administración General del Estado es correcta?"
  options:
  - id: a
    text:
      es: "Recoge las manifestaciones de insatisfacción con los servicios, pero no las iniciativas para mejorar su calidad."
  - id: b
    correct: true
    text:
      es: "Recoge y tramita tanto las manifestaciones de insatisfacción con los servicios como las iniciativas para mejorar su calidad."
  - id: c
    text:
      es: "Recoge las iniciativas para mejorar la calidad y remite las quejas a la Inspección General de Servicios para su tramitación."
  - id: d
    text:
      es: "Recoge y tramita las quejas, y solo responde a las sugerencias que los usuarios presentan presencialmente en la unidad."
  explanation:
    es: "El artículo 14 RD 951/2005 crea la unidad para «recoger y tramitar tanto las manifestaciones de insatisfacción de los usuarios con los servicios como las iniciativas para mejorar su calidad», y le encarga dar respuesta a las quejas y sugerencias. Excluir las iniciativas, remitir las quejas a la Inspección en lugar de tramitarlas o responder solo a las sugerencias presenciales contradice ese artículo."
  citation: "art. 14 RD 951/2005"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1996-4997-art-4
- id: m02-l02-q073
  prompt:
    es: "¿Cómo se denomina, en la atención personalizada al ciudadano, la propuesta de un empleado público para suprimir trámites innecesarios y simplificar procedimientos?"
  options:
  - id: a
    text:
      es: "Queja o reclamación."
  - id: b
    text:
      es: "Petición."
  - id: c
    text:
      es: "Recurso."
  - id: d
    correct: true
    text:
      es: "Iniciativa o sugerencia."
  explanation:
    es: "El artículo 4.d) llama iniciativas o sugerencias a las propuestas de ciudadanos o empleados públicos para mejorar los servicios o simplificar trámites. La queja o reclamación señala irregularidades ya observadas, la petición se rige por la ley orgánica y el recurso no es una propuesta de mejora."
  citation: "art. 4.d) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l02-q074
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, son iniciativas o sugerencias las formuladas por los ciudadanos o por:"
  options:
  - id: a
    text:
      es: "Las organizaciones sindicales."
  - id: b
    text:
      es: "Los órganos de representación del personal."
  - id: c
    correct: true
    text:
      es: "Los propios empleados públicos."
  - id: d
    text:
      es: "Las unidades de información administrativa."
  explanation:
    es: "El artículo 4.d) admite las formuladas por los ciudadanos o por los propios empleados públicos. Las organizaciones sindicales, los órganos de representación del personal y las unidades de información no figuran como autores."
  citation: "art. 4.d) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-14
- id: m02-l02-q075
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, determinan la unidad responsable de la gestión de las quejas y sugerencias:"
  options:
  - id: a
    text:
      es: "La Inspección General de Servicios de cada departamento."
  - id: b
    text:
      es: "La Secretaría General para la Administración Pública."
  - id: c
    text:
      es: "El Defensor del Pueblo, a propuesta de cada departamento."
  - id: d
    correct: true
    text:
      es: "Los órganos y organismos incluidos en su ámbito de aplicación."
  explanation:
    es: "El artículo 14 deja la determinación de la unidad a los propios órganos y organismos incluidos en el ámbito del real decreto. La Inspección General de Servicios hace el seguimiento, no designa la unidad; la Secretaría General para la Administración Pública define el contenido mínimo de los formularios; el Defensor del Pueblo no interviene."
  citation: "art. 14 RD 951/2005"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2005-14836-art-14
- id: m02-l02-q076
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, la unidad responsable de las quejas y sugerencias debe ofrecer respuesta a los ciudadanos, informarles de las actuaciones realizadas y, en su caso, de:"
  options:
  - id: a
    text:
      es: "Las sanciones impuestas."
  - id: b
    text:
      es: "Los recursos procedentes."
  - id: c
    correct: true
    text:
      es: "Las medidas adoptadas."
  - id: d
    text:
      es: "Las responsabilidades exigidas."
  explanation:
    es: "El artículo 14 añade, en su caso, las medidas adoptadas. Las sanciones, los recursos procedentes y las responsabilidades exigidas no son parte de lo que la unidad informa."
  citation: "art. 14 RD 951/2005"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q018
  prompt:
    es: "Según el artículo 9.c) del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las reclamaciones por incumplimiento de los compromisos:"
  options:
  - id: a
    text:
      es: "Darán lugar a responsabilidad patrimonial cuando el incumplimiento cause un daño evaluable."
  - id: b
    text:
      es: "Se tramitarán como recurso de alzada ante el Subsecretario del departamento."
  - id: c
    text:
      es: "Darán lugar, en todo caso, a una compensación económica fijada en la propia carta."
  - id: d
    correct: true
    text:
      es: "En ningún caso darán lugar a responsabilidad patrimonial por parte de la Administración."
  explanation:
    es: "El artículo 9.c) dice que esas reclamaciones, cuyo reconocimiento corresponde al titular del órgano u organismo al que se refiere la carta, «en ningún caso darán lugar a responsabilidad patrimonial por parte de la Administración». No hay excepción por daño evaluable. No se tramitan como recurso de alzada. Las medidas de subsanación de contenido económico son posibles, pero no obligatorias en todo caso."
  citation: "art. 9.c) RD 951/2005"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l02-q077
  prompt:
    es: "La atención al ciudadano incluye, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la recepción de las quejas y reclamaciones por tardanzas, desatenciones o cualquier otra actuación irregular que observen en el funcionamiento de:"
  options:
  - id: a
    text:
      es: "Los órganos judiciales."
  - id: b
    correct: true
    text:
      es: "Las dependencias administrativas."
  - id: c
    text:
      es: "Los servicios de inspección."
  - id: d
    text:
      es: "Las empresas concesionarias."
  explanation:
    es: "El artículo 4.e) se refiere al funcionamiento de las dependencias administrativas. Los órganos judiciales, los servicios de inspección y las empresas concesionarias no son su ámbito."
  citation: "art. 4.e) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q078
  prompt:
    es: "El reconocimiento de las reclamaciones por incumplimiento de los compromisos declarados en una carta de servicios corresponde, según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, al:"
  options:
  - id: a
    correct: true
    text:
      es: "Titular del órgano u organismo al que se refiera la carta."
  - id: b
    text:
      es: "Subsecretario del departamento que aprobó la carta."
  - id: c
    text:
      es: "Titular de la Secretaría General para la Administración Pública."
  - id: d
    text:
      es: "Titular de la Inspección General de Servicios del departamento."
  explanation:
    es: "El artículo 9.c) lo atribuye al titular del órgano u organismo al que se refiera la carta. El Subsecretario aprueba la carta mediante resolución, la Secretaría General para la Administración Pública informa y la Inspección General de Servicios hace el seguimiento de las quejas; ninguno reconoce la reclamación."
  citation: "art. 9.c) RD 951/2005"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q079
  prompt:
    es: "La carta de servicios debe señalar expresamente, según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, el modo de formular las reclamaciones por:"
  options:
  - id: a
    correct: true
    text:
      es: "Incumplimiento de los compromisos declarados."
  - id: b
    text:
      es: "Deficiencias en las instalaciones de atención al público."
  - id: c
    text:
      es: "Retrasos en la contestación de las quejas y sugerencias."
  - id: d
    text:
      es: "Falta de respuesta a las peticiones de los ciudadanos."
  explanation:
    es: "El artículo 9.c) pide indicar el modo de formular las reclamaciones por incumplimiento de los compromisos. Las deficiencias de instalaciones, los retrasos en contestar quejas y la falta de contestación a las peticiones no son el objeto de esa reclamación."
  citation: "art. 9.c) RD 951/2005"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q126
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, la carta de servicios deberá señalar expresamente el modo de formular las reclamaciones por incumplimiento de los compromisos declarados, que en ningún caso darán lugar a:"
  options:
  - id: a
    text:
      es: "La anulación de la resolución que aprobó la carta de servicios."
  - id: b
    text:
      es: "Responsabilidad disciplinaria del titular del órgano u organismo."
  - id: c
    text:
      es: "La suspensión de la carta hasta su siguiente actualización periódica."
  - id: d
    correct: true
    text:
      es: "Responsabilidad patrimonial por parte de la Administración."
  explanation:
    es: "El artículo 9.c) dice que las reclamaciones por incumplimiento de los compromisos no darán en ningún caso lugar a responsabilidad patrimonial de la Administración. La anulación de la resolución de aprobación, la responsabilidad disciplinaria del titular y la suspensión de la carta no se mencionan como efectos de la reclamación: lo que el apartado le atribuye es su reconocimiento por el titular del órgano u organismo, y excluye solo la responsabilidad patrimonial."
  citation: "art. 9.c) RD 951/2005"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14836-art-8
- id: m02-l02-q002
  prompt:
    es: "Según el artículo 8.1 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las cartas de servicios informan sobre:"
  options:
  - id: a
    text:
      es: "Los servicios encomendados, el coste económico de cada prestación y las sanciones previstas por su incumplimiento."
  - id: b
    correct: true
    text:
      es: "Los servicios encomendados, los derechos que asisten en relación con ellos y los compromisos de calidad en su prestación."
  - id: c
    text:
      es: "Los servicios encomendados, los derechos que asisten en relación con ellos y el régimen disciplinario aplicable al personal."
  - id: d
    text:
      es: "Los procedimientos en tramitación, el estado de cada expediente y el personal responsable de tramitarlo."
  explanation:
    es: "El artículo 8.1 define las cartas como el instrumento con el que se informa a ciudadanos y usuarios «sobre los servicios que tienen encomendados, sobre los derechos que les asisten en relación con aquellos y sobre los compromisos de calidad en su prestación». El coste y las sanciones, y el régimen disciplinario del personal, no forman parte de esa definición. El estado de los procedimientos en tramitación es información particular del RD 208/1996, no contenido de una carta."
  citation: "art. 8.1 RD 951/2005"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-11
- id: m02-l02-q006
  prompt:
    es: "Señale la respuesta correcta sobre las cartas de servicios según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "La resolución que aprueba la carta se publica en el boletín oficial de la provincia."
  - id: b
    text:
      es: "Su contenido se estructura en dos apartados: compromisos de calidad y medidas de subsanación."
  - id: c
    text:
      es: "Se actualizarán periódicamente y, en cualquier caso, al menos cada cinco años."
  - id: d
    correct: true
    text:
      es: "La resolución que aprueba la carta se publica en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 11.2 dice que la resolución de aprobación «se publicará en el \"Boletín Oficial del Estado\"». El boletín de la provincia no es el diario que fija el artículo. El contenido de la carta tiene cuatro apartados, no dos (art. 9). La actualización es al menos cada tres años, no cada cinco (art. 10.4)."
  citation: "art. 11.2 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-4
- id: m02-l02-q081
  prompt:
    es: "Las disposiciones del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, se aplican a la Administración General del Estado, a sus organismos autónomos y a:"
  options:
  - id: a
    text:
      es: "Las entidades locales y sus organismos autónomos."
  - id: b
    text:
      es: "Las Comunidades Autónomas y sus organismos públicos."
  - id: c
    text:
      es: "Las mutualidades de funcionarios y los organismos reguladores de los sectores económicos."
  - id: d
    correct: true
    text:
      es: "Las Entidades Gestoras y Servicios Comunes de la Seguridad Social."
  explanation:
    es: "El artículo 4 extiende el real decreto a las Entidades Gestoras y Servicios Comunes de la Seguridad Social. No alcanza a las entidades locales, a las Comunidades Autónomas ni a las mutualidades de funcionarios y organismos reguladores."
  citation: "art. 4 RD 951/2005"
  difficulty: 2
  tags:
  - "requisito"
  - "estructura"
# anchor: boe-a-2005-14836-art-4
- id: m02-l02-q082
  prompt:
    es: "Un organismo autónomo del Estado presta servicios directos a los ciudadanos. ¿Le es aplicable el marco general para la mejora de la calidad en la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "No, porque solo se aplica a los departamentos ministeriales."
  - id: b
    correct: true
    text:
      es: "Sí, porque el marco se aplica también a los organismos autónomos del Estado."
  - id: c
    text:
      es: "No, porque solo se aplica a las Entidades Gestoras y Servicios Comunes de la Seguridad Social."
  - id: d
    text:
      es: "Sí, pero solo si el organismo cuenta con servicios periféricos."
  explanation:
    es: "El artículo 4 incluye a los organismos autónomos. La aplicación no se limita a los departamentos ministeriales ni a las Entidades Gestoras de la Seguridad Social, y no depende de que el organismo tenga servicios periféricos."
  citation: "art. 4 RD 951/2005"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-3
- id: m02-l02-q083
  prompt:
    es: "El marco general para la mejora de la calidad del Real Decreto 951/2005, de 29 de julio, integra seis programas, entre ellos el de cartas de servicios y el de:"
  options:
  - id: a
    text:
      es: "Inspección de servicios."
  - id: b
    correct: true
    text:
      es: "Quejas y sugerencias."
  - id: c
    text:
      es: "Gestión del conocimiento."
  - id: d
    text:
      es: "Participación ciudadana."
  explanation:
    es: "El artículo 3.1 incluye entre los seis programas el de quejas y sugerencias, junto al de cartas de servicios. Inspección de servicios, gestión del conocimiento y participación ciudadana no figuran entre ellos."
  citation: "art. 3.1 RD 951/2005"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q084
  prompt:
    es: "El contenido de las cartas de servicios se estructura, según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, en cuatro apartados: de carácter general y legal, de compromisos de calidad, de medidas de subsanación y:"
  options:
  - id: a
    correct: true
    text:
      es: "De carácter complementario."
  - id: b
    text:
      es: "De carácter económico y presupuestario."
  - id: c
    text:
      es: "De carácter organizativo y funcional."
  - id: d
    text:
      es: "De carácter sancionador y disciplinario."
  explanation:
    es: "El artículo 9 cierra la estructura con el apartado de carácter complementario, que recoge direcciones de las oficinas y de la unidad responsable. Los apartados económico, organizativo y sancionador no existen."
  citation: "art. 9 RD 951/2005"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2005-14836-art-9
- id: m02-l02-q085
  prompt:
    es: "¿En cuántos apartados se estructura el contenido de las cartas de servicios que elaboran los órganos, organismos y entidades de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Tres apartados."
  - id: b
    text:
      es: "Cinco apartados."
  - id: c
    correct: true
    text:
      es: "Cuatro apartados."
  - id: d
    text:
      es: "Seis apartados."
  explanation:
    es: "El artículo 9 enumera cuatro apartados, de la letra a) a la letra d): general y legal, compromisos de calidad, medidas de subsanación y complementario. Tres, cinco y seis no coinciden con esa enumeración."
  citation: "art. 9 RD 951/2005"
  difficulty: 1
  tags:
  - "cantidad"
  - "estructura"
# anchor: boe-a-2005-14836-art-10
- id: m02-l02-q086
  prompt:
    es: "¿En función de qué se actualizan periódicamente las cartas de servicios de la Administración General del Estado, y con qué mínimo temporal?"
  options:
  - id: a
    text:
      es: "De las circunstancias y, en cualquier caso, al menos una vez al año."
  - id: b
    text:
      es: "Del cambio de titular del órgano y, en cualquier caso, al menos cada legislatura."
  - id: c
    text:
      es: "De la solicitud de la Secretaría General para la Administración Pública y, en cualquier caso, cuando esta lo indique."
  - id: d
    correct: true
    text:
      es: "De las circunstancias y, en cualquier caso, al menos cada tres años."
  explanation:
    es: "El artículo 10.4 combina la actualización periódica en función de las circunstancias con un mínimo de tres años. No exige una actualización anual, no se liga al cambio de titular ni a la legislatura y no depende de que la Secretaría General la solicite."
  citation: "art. 10.4 RD 951/2005"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-11
- id: m02-l02-q087
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las cartas de servicios y sus posteriores actualizaciones se aprueban mediante:"
  options:
  - id: a
    text:
      es: "Resolución del titular del órgano u organismo al que se refiera la carta, previo informe del Subsecretario."
  - id: b
    text:
      es: "Real Decreto del Consejo de Ministros, a propuesta del departamento."
  - id: c
    text:
      es: "Resolución de la Secretaría General para la Administración Pública."
  - id: d
    correct: true
    text:
      es: "Resolución del Subsecretario del departamento al que pertenezca el órgano proponente."
  explanation:
    es: "El artículo 11.1 las atribuye a una resolución del Subsecretario del departamento. El titular del órgano elabora y gestiona la carta pero no la aprueba, el Consejo de Ministros no interviene y la Secretaría General para la Administración Pública emite informe previo favorable, no la aprueba."
  citation: "art. 11.1 RD 951/2005"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2005-14836-art-11
- id: m02-l02-q089
  prompt:
    es: "La publicación en el «Boletín Oficial del Estado» de la resolución que aprueba una carta de servicios da cuenta, según el Real Decreto 951/2005, de 29 de julio, de su aprobación y de:"
  options:
  - id: a
    text:
      es: "Su entrada en vigor inmediata."
  - id: b
    correct: true
    text:
      es: "Su disponibilidad para el público."
  - id: c
    text:
      es: "Su vigencia durante tres años."
  - id: d
    text:
      es: "Su notificación a los usuarios."
  explanation:
    es: "El artículo 11.2 dice que la publicación da cuenta de la aprobación y de la disponibilidad de la carta para el público. No fija una entrada en vigor inmediata ni una vigencia de tres años, y no sustituye una notificación a los usuarios."
  citation: "art. 11.2 RD 951/2005"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-11
- id: m02-l02-q090
  prompt:
    es: "¿Dónde debe garantizar cada órgano u organismo que los usuarios puedan conocer su carta de servicios mediante las acciones divulgativas que estime más eficaces?"
  options:
  - id: a
    correct: true
    text:
      es: "En todas sus dependencias con atención al público, en el servicio de atención e información al ciudadano del ministerio y en Internet."
  - id: b
    text:
      es: "Solo en el «Boletín Oficial del Estado» y en la sede electrónica del ministerio."
  - id: c
    text:
      es: "En las dependencias del órgano y en los medios de comunicación de ámbito estatal."
  - id: d
    text:
      es: "En las Delegaciones del Gobierno, en las oficinas de las Entidades Gestoras de la Seguridad Social y en los registros de cada ministerio."
  explanation:
    es: "El artículo 11.3 exige que la carta pueda conocerse en todas las dependencias con atención al público, en el servicio de atención e información al ciudadano del ministerio y en Internet. Limitarse al Boletín y la sede electrónica, usar medios de comunicación o acudir a las Delegaciones del Gobierno y a la Seguridad Social no cumple esa garantía."
  citation: "art. 11.3 RD 951/2005"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-8
- id: m02-l02-q119
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, los órganos, organismos y entidades de la Administración General del Estado informan a los ciudadanos y usuarios sobre los servicios que tienen encomendados mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "Las cartas de servicios."
  - id: b
    text:
      es: "El programa de quejas y sugerencias."
  - id: c
    text:
      es: "El programa de reconocimiento."
  - id: d
    text:
      es: "El programa de evaluación de la calidad de las organizaciones."
  explanation:
    es: "El artículo 8.1 define las cartas de servicios como el instrumento a través del cual los órganos, organismos y entidades informan a los ciudadanos de los servicios que tienen encomendados. El programa de quejas y sugerencias recoge y tramita la insatisfacción de los usuarios y las iniciativas de mejora, según el artículo 14, y no informa de los servicios. El programa de reconocimiento y el de evaluación de la calidad de las organizaciones son otros programas del marco, distintos del de cartas de servicios, que es el que el artículo 8.1 define como instrumento de información."
  citation: "art. 8.1 RD 951/2005"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-8
- id: m02-l02-q120
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, las cartas de servicios informan a los ciudadanos sobre los servicios que tiene encomendados el órgano, sobre los derechos que les asisten en relación con ellos y sobre:"
  options:
  - id: a
    text:
      es: "Las sanciones aplicables a quien incumpla esos compromisos."
  - id: b
    correct: true
    text:
      es: "Los compromisos de calidad en su prestación."
  - id: c
    text:
      es: "Los recursos que pueden interponer contra la prestación del servicio."
  - id: d
    text:
      es: "Los plazos de que dispone la Administración para actualizar la carta."
  explanation:
    es: "El artículo 8.1 cierra la tríada de la definición con los compromisos de calidad en la prestación de los servicios. Las sanciones por incumplirlos no son contenido de la información: lo que prevé la carta para el incumplimiento son medidas de subsanación, según el artículo 9.c). Los recursos contra la prestación tampoco forman parte de la definición. El plazo de actualización es el del artículo 10.4, al menos cada tres años, y no es una de las cosas sobre las que la carta informa según el artículo 8.1."
  citation: "art. 8.1 RD 951/2005"
  difficulty: 2
  tags:
  - "concepto"
