- id: g-deadline
  term:
    en: deadline
  definition:
    en: gRPC allows clients to specify how long they are willing to wait for an RPC to complete before the RPC is terminated with a DEADLINE_EXCEEDED error.
  origin: m07-l06
  citation: grpc-core-concepts#deadlines
- id: g-unknown-fields
  term:
    en: unknown fields
  definition:
    en: Unknown fields are well-formed Protobuf serialized data representing fields that the parser does not recognize.
  origin: m07-l06
  citation: protobuf-proto3#unknowns
- id: g-graphql-schema
  term:
    en: GraphQL schema
  definition:
    en: A GraphQL service’s collective type system capabilities are referred to as that service’s “schema”.
  origin: m07-l06
  citation: graphql-spec#sec-Schema
- id: g-asyncapi
  term:
    en: AsyncAPI
  definition:
