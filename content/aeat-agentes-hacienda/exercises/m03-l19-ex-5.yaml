  - id: d
    text:
      es: "los bienes han permanecido afectos a la actividad menos de cuatro años desde su adquisición."
  explanation:
    es: "La regularización procede cuando se acredita que el grado efectivo de utilización difiere del aplicado al principio. El valor contable, el tiempo de afectación y el cambio de prorrata no son el presupuesto de la regla 3.ª."
