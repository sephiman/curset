# anchor: boe-a-1984-17387-art-2
- id: m04-l01-q035
  prompt:
    es: "Según el artículo 2 de la Ley 30/1984, de 2 de agosto, el personal de la Administración del Estado tiene dependencia orgánica de un ministerio, sin perjuicio de la que funcionalmente tenga con:"
  options:
  - id: a
    text:
      es: "La Secretaría de Estado de Función Pública."
  - id: b
    text:
      es: "La Dirección General de Función Pública."
  - id: c
    text:
      es: "La Subsecretaría del Ministerio de Hacienda."
  - id: d
    correct: true
    text:
      es: "Cada Departamento."
  explanation:
    es: "El artículo dos de la Ley 30/1984 dice que todo el personal tendrá dependencia orgánica del Ministerio de la Presidencia, «sin perjuicio de la que funcionalmente tenga con cada Departamento». La dependencia funcional es con el Departamento en el que se sirve, no con un órgano concreto del ministerio de función pública. La Secretaría de Estado de Función Pública y la Dirección General de Función Pública no son «cada Departamento»: el artículo reparte la dependencia entre el Ministerio de la Presidencia, orgánica, y el Departamento donde se presta el servicio, funcional. La Subsecretaría del Ministerio de Hacienda tampoco: Hacienda es un Departamento más, y el artículo se refiere a cada uno."
  citation: "art. 2 Ley 30/1984"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2023-23537-art-22
- id: m04-l01-q036
  prompt:
    es: "El artículo 2 de la Ley 30/1984 da la dependencia orgánica del personal del Estado al «Ministerio de la Presidencia». ¿Qué ministerio tiene hoy la propuesta y ejecución de la política del Gobierno en función pública?"
  options:
  - id: a
    text:
      es: "El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: b
    text:
      es: "El Ministerio de Política Territorial y Memoria Democrática."
  - id: c
    correct: true
    text:
      es: "El Ministerio para la Transformación Digital y de la Función Pública."
  - id: d
    text:
      es: "El Ministerio de Hacienda."
  explanation:
    es: "El artículo 22.2 del Real Decreto 829/2023, de 20 de noviembre, atribuye al Ministerio para la Transformación Digital y de la Función Pública «la propuesta y ejecución de la política del Gobierno en materia de administración pública, función pública, y gobernanza pública». El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes, el de Política Territorial y Memoria Democrática y el de Hacienda existen, pero ninguno tiene esa materia."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1984-17387-art-3
- id: m04-l01-q037
  prompt:
    es: "De acuerdo con el artículo 3.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿quién dirige la política de personal de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "El Ministro para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "La Secretaría de Estado de Función Pública."
  - id: c
    text:
      es: "La Dirección General de Función Pública."
  - id: d
    correct: true
    text:
      es: "El Gobierno."
  explanation:
    es: "El artículo 3.1 dice: «El Gobierno dirige la política de personal y ejerce la función ejecutiva y la potestad reglamentaria en materia de función pública de la Administración del Estado». El Ministro, la Secretaría de Estado y la Dirección General están por debajo: proponen y ejecutan esa política, no la dirigen."
  citation: "art. 3.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1984-17387-art-3
- id: m04-l01-q038
  prompt:
    es: "¿Cuál de las siguientes atribuciones en materia de función pública de la Administración del Estado da al Gobierno el artículo 3.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública?"
  options:
  - id: a
    text:
      es: "La función ejecutiva, pero no la potestad reglamentaria, que es del Ministro."
  - id: b
    text:
      es: "La potestad reglamentaria, previo acuerdo de la Mesa General de Negociación."
  - id: c
    text:
      es: "La función consultiva y la coordinación con las comunidades autónomas."
  - id: d
    correct: true
    text:
      es: "La función ejecutiva y la potestad reglamentaria."
  explanation:
    es: "El artículo 3.1 dice que el Gobierno «ejerce la función ejecutiva y la potestad reglamentaria en materia de función pública de la Administración del Estado». No reserva la potestad reglamentaria al Ministro. No la condiciona a un acuerdo de la Mesa General de Negociación. Y la función que atribuye no es consultiva: es de dirección, ejecución y reglamento."
  citation: "art. 3.1 Ley 30/1984"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1984-17387-art-3
- id: m04-l01-q039
  prompt:
    es: "Según el artículo 3.2 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿a quién corresponde aprobar la oferta de empleo de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Al Ministro de Hacienda."
  - id: b
    correct: true
    text:
      es: "Al Gobierno."
  - id: c
    text:
      es: "A la Secretaría de Estado de Función Pública."
  - id: d
    text:
      es: "A las Cortes Generales, en la ley de presupuestos."
  explanation:
    es: "El artículo 3.2.g) dice que corresponde en particular al Gobierno «aprobar la oferta de empleo de la Administración del Estado». El Ministro de Hacienda y la Secretaría de Estado de Función Pública no tienen esa competencia en el artículo. Las Cortes Generales aprueban la ley de presupuestos, pero el artículo no les da la aprobación de la oferta."
  citation: "art. 3.2.g) Ley 30/1984"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2023-23537-art-22
- id: m04-l01-q041
  prompt:
    es: "Según el artículo 22.2 del Real Decreto 829/2023, de 20 de noviembre, el Ministerio para la Transformación Digital y de la Función Pública propone y ejecuta la política del Gobierno en materia de:"
  options:
  - id: a
    text:
      es: "Función pública, política territorial y memoria democrática."
  - id: b
    text:
      es: "Administración pública, presupuestos y gastos de personal."
  - id: c
    correct: true
    text:
      es: "Administración pública, función pública y gobernanza pública."
  - id: d
    text:
      es: "Función pública, relaciones con las Cortes y gobernanza pública."
  explanation:
    es: "El artículo 22.2 atribuye a ese ministerio la política del Gobierno «en materia de administración pública, función pública, y gobernanza pública». La política territorial y la memoria democrática son de otro ministerio. Los presupuestos y gastos son de Hacienda. Las relaciones con las Cortes son del Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2023-24842-art-21
- id: m04-l01-q043
  prompt:
    es: "Según el artículo 21 del Real Decreto 1009/2023, de 5 de diciembre, por el que se establece la estructura orgánica básica de los departamentos ministeriales, la Dirección General de Función Pública:"
  options:
  - id: a
    text:
      es: "Tiene rango de secretaría general y depende de la Secretaría de Estado de Función Pública."
  - id: b
    text:
      es: "Tiene rango de dirección general y depende de la Subsecretaría del Ministerio."
  - id: c
    text:
      es: "Tiene rango de subsecretaría y depende directamente del Ministro."
  - id: d
    correct: true
    text:
      es: "Tiene rango de subsecretaría y depende de la Secretaría de Estado de Función Pública."
  explanation:
    es: "El artículo 21.C) dice que de la Secretaría de Estado de Función Pública dependen «la Dirección General de Función Pública, con rango de subsecretaría, y la Dirección General de Gobernanza Pública». No tiene rango de secretaría general. No depende de la Subsecretaría, de la que depende la Secretaría General Técnica (art. 21.D). Tampoco depende directamente del Ministro."
  citation: "art. 21.C RD 1009/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2023-24842-art-21
- id: m04-l01-q044
  prompt:
    es: "De acuerdo con el artículo 21 del Real Decreto 1009/2023, de 5 de diciembre, ¿qué órgano con rango de Dirección General depende también de la Secretaría de Estado de Función Pública?"
  options:
  - id: a
    text:
      es: "La Secretaría General Técnica."
  - id: b
    correct: true
    text:
      es: "La Oficina de Conflictos de Intereses."
  - id: c
    text:
      es: "La Dirección General del Dato."
  - id: d
    text:
      es: "La Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 21.C) dice: «Asimismo, depende de esta Secretaría de Estado la Oficina de Conflictos de Intereses, con rango de Dirección General». La Secretaría General Técnica depende de la Subsecretaría del ministerio (art. 21.D). La Dirección General del Dato depende de la Secretaría de Estado de Digitalización e Inteligencia Artificial (art. 21.A). La Intervención General de la Administración del Estado es del Ministerio de Hacienda."
  citation: "art. 21.C RD 1009/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2023-24842-art-21
- id: m04-l01-q046
  prompt:
    es: "¿De qué órgano superior depende la Dirección General de Gobernanza Pública del Ministerio para la Transformación Digital y de la Función Pública?"
  options:
  - id: a
    text:
      es: "De la Secretaría de Estado de Digitalización e Inteligencia Artificial."
  - id: b
    correct: true
    text:
      es: "De la Secretaría de Estado de Función Pública."
  - id: c
    text:
      es: "De la Secretaría de Estado de Telecomunicaciones e Infraestructuras Digitales."
  - id: d
    text:
      es: "De la Subsecretaría del ministerio."
  explanation:
    es: "El artículo 21.C) del Real Decreto 1009/2023 sitúa la Dirección General de Gobernanza Pública bajo la Secretaría de Estado de Función Pública. Las Secretarías de Estado de Digitalización e Inteligencia Artificial y de Telecomunicaciones e Infraestructuras Digitales son los otros dos órganos superiores del ministerio, con sus propios órganos directivos. De la Subsecretaría depende la Secretaría General Técnica."
  citation: "art. 21.C RD 1009/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1984-17387-art-13
- id: m04-l01-q047
  prompt:
    es: "¿Qué actos se anotan preceptivamente en el Registro Central en el que se inscribe a todo el personal al servicio de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Todos los actos que afecten a la vida administrativa de ese personal."
  - id: b
    text:
      es: "Sólo los actos que tengan repercusión en la nómina de ese personal."
  - id: c
    text:
      es: "Sólo los nombramientos, las tomas de posesión y los ceses de ese personal."
  - id: d
    text:
      es: "Los actos cuya anotación solicite expresamente el propio interesado."
  explanation:
    es: "El artículo 13.1 de la Ley 30/1984 dice que en el Registro Central «se anotarán preceptivamente todos los actos que afecten a la vida administrativa» del personal. No se limita a los actos con repercusión en nómina ni a nombramientos, tomas de posesión y ceses. Y la anotación es preceptiva, no depende de que la pida el interesado."
  citation: "art. 13.1 Ley 30/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-13
- id: m04-l01-q048
  prompt:
    es: "Según el artículo 13.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿a qué personal se inscribe en el Registro Central?"
  options:
  - id: a
    text:
      es: "Sólo al personal funcionario de carrera de la Administración del Estado."
  - id: b
    text:
      es: "A todo el personal de cualquier Administración Pública."
  - id: c
    text:
      es: "Sólo al personal que perciba sus retribuciones de los presupuestos del Estado."
  - id: d
    correct: true
    text:
      es: "A todo el personal al servicio de la Administración del Estado."
  explanation:
    es: "El artículo 13.1 dice que en el Registro Central «se inscribirá a todo el personal al servicio de la Administración del Estado». No se limita a los funcionarios de carrera. No inscribe al personal de las demás Administraciones, que constituyen sus propios Registros. Y el artículo no usa el criterio de la fuente de las retribuciones."
  citation: "art. 13.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-71
- id: m04-l01-q049
  prompt:
    es: "Según el artículo 71.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, mediante convenio de Conferencia Sectorial se establecerán:"
  options:
  - id: a
    correct: true
    text:
      es: "Los contenidos mínimos comunes de los Registros de personal y los criterios para el intercambio homogéneo de la información."
  - id: b
    text:
      es: "Las normas de organización del Registro Central de Personal y los modelos de sus documentos registrales."
  - id: c
    text:
      es: "El número máximo de personal eventual de cada Administración y sus condiciones retributivas."
  - id: d
    text:
      es: "Los criterios de coordinación de los planes de oferta de empleo de las Administraciones Públicas."
  explanation:
    es: "El artículo 71.3 dice que mediante convenio de Conferencia Sectorial «se establecerán los contenidos mínimos comunes de los Registros de personal y los criterios que permitan el intercambio homogéneo de la información entre Administraciones». La organización del Registro Central la regula su propio Reglamento. El número máximo de personal eventual lo fijan los órganos de gobierno (art. 12.2). Los criterios de coordinación de la oferta de empleo los aprueba el Gobierno (art. 3.2.f) Ley 30/1984)."
  citation: "art. 71.3 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-71
- id: m04-l01-q050
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los contenidos mínimos comunes de los Registros de personal recoge el artículo 71.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Se establecen mediante convenio de Conferencia Sectorial, con respeto a la legislación de protección de datos."
  - id: b
    text:
      es: "Se establecen mediante convenio de Conferencia Sectorial, con independencia de la legislación de protección de datos."
  - id: c
    text:
      es: "Los fija cada Administración Pública en su propio Registro, sin necesidad de acuerdo con las demás."
  - id: d
    text:
      es: "Los fija el Registro Central de Personal, y las demás Administraciones deben adoptarlos."
  explanation:
    es: "El artículo 71.3 dice que los contenidos mínimos comunes se establecen «mediante convenio de Conferencia Sectorial», «con respeto a lo establecido en la legislación de protección de datos de carácter personal». La opción que prescinde de esa legislación altera el texto. Los contenidos son comunes porque se acuerdan entre Administraciones, no los fija cada una por su cuenta. Tampoco los impone el Registro Central de Personal."
  citation: "art. 71.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2000-1007-art-1
- id: m04-l01-q051
  prompt:
    es: "De acuerdo con el artículo 1.1 del Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre, el Registro Central de Personal es:"
  options:
  - id: a
    text:
      es: "El registro común de todas las Administraciones Públicas en el que se inscribe a todo su personal funcionario y laboral."
  - id: b
    correct: true
    text:
      es: "El registro administrativo de la Administración General del Estado en el que se inscribe el personal de su ámbito y se anotan preceptivamente los actos que afecten a su vida administrativa."
  - id: c
    text:
      es: "El archivo de la Administración General del Estado que custodia los expedientes del personal que ha perdido su condición."
  - id: d
    text:
      es: "El registro de la Administración General del Estado en el que se anotan, a solicitud del interesado, los actos que le afectan."
  explanation:
    es: "El artículo 1.1 define el Registro Central de Personal como «el registro administrativo de la Administración General del Estado en el que se inscribe el personal a que se refiere el artículo 5» y en el que se anotan preceptivamente los actos que afecten a su vida administrativa. No es un registro común de todas las Administraciones: cada una constituye el suyo. No es un archivo de expedientes cerrados. Y la anotación es preceptiva, no a solicitud del interesado."
  citation: "art. 1.1 RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-11
- id: m04-l01-q052
  prompt:
    es: "Según el artículo 11.2 del Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre, los órganos de personal comunicarán al Registro los actos que deban registrarse dentro del plazo máximo de:"
  options:
  - id: a
    text:
      es: "Diez días desde la fecha en que fueran dictados o desde que tuvieran conocimiento de ellos."
  - id: b
    text:
      es: "Tres días desde la fecha en que fueran notificados a los interesados."
  - id: c
    correct: true
    text:
      es: "Tres días desde la fecha en que fueran dictados o desde que tuvieran conocimiento de ellos."
  - id: d
    text:
      es: "Un mes desde la fecha en que fueran dictados o desde que surtieran efectos."
  explanation:
    es: "El artículo 11.2 fija la comunicación «dentro del plazo máximo de tres días desde la fecha en que fueran dictados o desde que tuvieran conocimiento de los mismos». Diez días y un mes no son los plazos del artículo. El plazo no se cuenta desde la notificación a los interesados, sino desde que se dictó el acto o se tuvo conocimiento de él."
  citation: "art. 11.2 RD 2073/1999"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2000-1007-art-11
- id: m04-l01-q053
  prompt:
    es: "¿Desde cuándo se cuenta el plazo máximo de tres días que tiene el Registro Central de Personal para practicar el asiento de un acto que le ha sido comunicado?"
  options:
  - id: a
    text:
      es: "Desde que se dictó el acto."
  - id: b
    text:
      es: "Desde la notificación del acto al interesado."
  - id: c
    text:
      es: "Desde que el acto empieza a surtir efectos."
  - id: d
    correct: true
    text:
      es: "Desde la recepción de la comunicación."
  explanation:
    es: "El artículo 11.2 del Reglamento del Registro Central de Personal dice que, una vez comunicados, los asientos se practican «en un plazo máximo de tres días desde la recepción de la comunicación». La fecha en que se dictó el acto es el inicio de otro plazo: el que tiene el órgano de personal para comunicarlo. La notificación al interesado y el inicio de los efectos no son el punto de partida que fija el artículo."
  citation: "art. 11.2 RD 2073/1999"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2000-1007-art-11
- id: m04-l01-q054
  prompt:
    es: "Un órgano de personal comunica al Registro Central de Personal el cese de un funcionario. Una vez recibida la comunicación, el Registro practicará el asiento:"
  options:
  - id: a
    text:
      es: "En un plazo máximo de diez días desde la recepción de la comunicación."
  - id: b
    correct: true
    text:
      es: "En un plazo máximo de tres días desde la recepción de la comunicación."
  - id: c
    text:
      es: "En un plazo máximo de un mes desde la recepción de la comunicación."
  - id: d
    text:
      es: "En el plazo que fije la propia comunicación del órgano de personal."
  explanation:
    es: "El artículo 11.2 del Reglamento del Registro Central de Personal dice que los asientos se practican «en un plazo máximo de tres días desde la recepción de la comunicación». Diez días y un mes no son plazos del artículo. El plazo lo fija el Reglamento, no el órgano que comunica el acto."
  citation: "art. 11.2 RD 2073/1999"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q055
  prompt:
    es: "Según el artículo 13.1.a) del Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre, ¿cuál de los siguientes actos se anota respecto de un funcionario interino?"
  options:
  - id: a
    text:
      es: "Las solicitudes de participación en concursos de provisión."
  - id: b
    text:
      es: "Los cambios de cuenta bancaria de la nómina."
  - id: c
    text:
      es: "Las afiliaciones a organizaciones sindicales y las bajas en ellas."
  - id: d
    correct: true
    text:
      es: "Los reconocimientos de trienios y de servicios previos."
  explanation:
    es: "El artículo 13.1.a) enumera los actos que se anotan para el personal funcionario de carrera, en prácticas o interino y el personal eventual; entre ellos, los «reconocimientos de trienios» y los «reconocimientos de servicios previos». Las solicitudes de participación en concursos no figuran: se anota la toma de posesión que resulta del concurso. Los cambios de entidad bancaria y la afiliación sindical tampoco figuran en la lista."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q056
  prompt:
    es: "¿Cuál de los siguientes actos se anota en el Registro Central de Personal respecto del personal eventual, según el Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre?"
  options:
  - id: a
    text:
      es: "Las declaraciones de bienes y derechos patrimoniales."
  - id: b
    text:
      es: "Las propuestas de nombramiento de la autoridad."
  - id: c
    correct: true
    text:
      es: "Las autorizaciones o reconocimientos de compatibilidad."
  - id: d
    text:
      es: "Las valoraciones del desempeño de sus funciones de confianza."
  explanation:
    es: "El artículo 13.1.a) aplica su lista también al personal eventual, y en ella figuran las «autorizaciones o reconocimientos de compatibilidad». Las declaraciones de bienes no están en la lista. Se inscribe la resolución de nombramiento, no la propuesta. Las valoraciones del desempeño tampoco figuran entre los actos que se anotan."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q057
  prompt:
    es: "¿Qué licencias y permisos del funcionario de carrera se anotan en el Registro Central de Personal de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Que tuvieran repercusión en nómina o en el cómputo del tiempo de servicio activo."
  - id: b
    text:
      es: "De cualquier clase, tengan o no repercusión en nómina o en el tiempo de servicio."
  - id: c
    text:
      es: "Que superen los quince días naturales de duración en el año natural."
  - id: d
    text:
      es: "Que haya concedido el Subsecretario del departamento de destino."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «licencias y permisos que tuvieran repercusión en nómina o en el cómputo del tiempo de servicio activo». No se anotan todos: sólo los que tienen esa repercusión. El artículo no usa un umbral de quince días ni el órgano que los concede como criterio."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q058
  prompt:
    es: "Respecto del funcionario de carrera, se anotan en el Registro Central de Personal, entre otros actos:"
  options:
  - id: a
    text:
      es: "Las jubilaciones y las solicitudes de jubilación pendientes de resolver."
  - id: b
    correct: true
    text:
      es: "Las jubilaciones y las prolongaciones de la permanencia en servicio activo."
  - id: c
    text:
      es: "Las propuestas de sanción y los expedientes disciplinarios aún en tramitación."
  - id: d
    text:
      es: "Las peticiones de traslado y las solicitudes de comisión de servicios."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «jubilaciones» y las «prolongaciones de la permanencia en servicio activo». Se anotan los actos dictados, no las solicitudes pendientes. De la potestad disciplinaria se anotan las sanciones, no las propuestas ni los expedientes en curso. Las peticiones de traslado y de comisión de servicios tampoco son actos de la lista."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q059
  prompt:
    es: "Se suprimen dos puestos de trabajo ocupados por funcionarios de carrera en una subdirección general. Según el Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre, esa supresión:"
  options:
  - id: a
    correct: true
    text:
      es: "Se anota en el Registro respecto de cada funcionario que ocupaba esos puestos."
  - id: b
    text:
      es: "Se anota en el Registro sólo cuando los funcionarios afectados pasan a otra situación."
  - id: c
    text:
      es: "Se anota en el Registro sólo si los funcionarios afectados lo solicitan expresamente."
  - id: d
    text:
      es: "Se anota en el Registro sólo si la ordena la Secretaría de Estado de Función Pública."
  explanation:
    es: "El artículo 13.1.a) incluye entre los actos que se anotan para el funcionario la «supresión o modificación en las características de los puestos de trabajo ocupados». La anotación no depende de un cambio de situación administrativa, que es otro acto distinto de la lista. Tampoco depende de que la pida el interesado ni de una orden de la Secretaría de Estado: la anotación es preceptiva."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 3
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q060
  prompt:
    es: "¿Cuál de las siguientes resoluciones judiciales se anota en el Registro Central de Personal respecto de un funcionario de carrera?"
  options:
  - id: a
    correct: true
    text:
      es: "Las sentencias firmes relacionadas con su condición de funcionario."
  - id: b
    text:
      es: "Las sentencias, firmes o no, relacionadas con su condición de funcionario."
  - id: c
    text:
      es: "Las sentencias firmes de cualquier orden, afecten o no a su condición."
  - id: d
    text:
      es: "Los autos que admiten a trámite sus recursos."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «sentencias firmes relacionadas con su condición de funcionario». Las sentencias no firmes quedan fuera. También las firmes que no guardan relación con esa condición. Los autos de admisión de recursos no son sentencias firmes."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q061
  prompt:
    es: "¿Qué cursos del funcionario de carrera se anotan en el Registro Central de Personal, junto con sus titulaciones y diplomas?"
  options:
  - id: a
    text:
      es: "Sólo los que haya recibido, no los que haya impartido."
  - id: b
    text:
      es: "Sólo los que haya impartido, no los que haya recibido."
  - id: c
    correct: true
    text:
      es: "Tanto los que haya recibido como los que haya impartido."
  - id: d
    text:
      es: "Sólo los recibidos en planes de formación del departamento."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «titulaciones, diplomas y cursos recibidos o impartidos». Se anotan los dos: los recibidos y los impartidos. El artículo no limita los cursos a los de los planes de formación del departamento."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-18101-art-4
- id: m04-l01-q063
  prompt:
    es: "Según el artículo 4.1 del Reglamento aprobado por el Real Decreto 1405/1986, de 6 de junio, entre los actos referentes al personal funcionario que deben anotarse preceptivamente figuran:"
  options:
  - id: a
    text:
      es: "Los reingresos, el reconocimiento de antigüedad y trienios y las solicitudes de excedencia pendientes."
  - id: b
    text:
      es: "Los ceses en los puestos, las solicitudes de traslado y la autorización o reconocimiento de compatibilidades."
  - id: c
    correct: true
    text:
      es: "Los reingresos, el reconocimiento de antigüedad y trienios y la autorización o reconocimiento de compatibilidades."
  - id: d
    text:
      es: "Las jubilaciones, las peticiones de comisión de servicios y el reconocimiento de antigüedad y trienios."
  explanation:
    es: "El artículo 4.1, apartado 1.1, enumera para el personal funcionario, entre otros, los «reingresos», el «reconocimiento de antigüedad y trienios» y la «autorización o reconocimiento de compatibilidades». Las otras opciones mezclan actos de la lista con uno que no está: las solicitudes de excedencia pendientes, las solicitudes de traslado y las peticiones de comisión de servicios. La lista recoge actos y resoluciones, no solicitudes."
  citation: "art. 4.1 RD 1405/1986"
  difficulty: 3
  tags:
  - "concepto"
