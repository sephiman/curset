# anchor: boe-a-2005-14803-art-85
- id: m03-l12-q0024
  prompt:
    es: "Conforme al artículo 85 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale cuál de los siguientes datos debe contener el mandamiento para la anotación preventiva de embargo de una finca:"
  options:
  - id: a
    text:
      es: "La fecha prevista para la celebración de la subasta de la finca."
  - id: b
    text:
      es: "El valor de tasación fijado por el perito para la finca embargada."
  - id: c
    correct: true
    text:
      es: "El importe total del débito y el de la responsabilidad a que se afecta el inmueble por principal, recargos, intereses y costas."
  - id: d
    text:
      es: "La relación de otros embargos practicados sobre la finca a favor de acreedores distintos de la Hacienda pública y de sus importes pendientes."
  explanation:
    es: "La letra d del artículo 85 RGR exige el importe total del débito y el de la responsabilidad a que se afecta el inmueble por principal, recargos, intereses y costas. Los otros embargos, la fecha de la subasta y la tasación no son contenido del mandamiento."
  citation: "art. 85 RGR"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-84
- id: m03-l12-q0093
  prompt:
    es: "En el embargo de bienes inmuebles, el artículo 84.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que el órgano de recaudación expide mandamiento dirigido al registrador, en el que solicita además que se libre:"
  options:
  - id: a
    correct: true
    text:
      es: "certificación de las cargas que figuren en el registro sobre cada finca."
  - id: b
    text:
      es: "certificación del acuerdo de enajenación de cada finca."
  - id: c
    text:
      es: "nota simple del dominio de cada finca a nombre del obligado y de los poseedores de la finca."
  - id: d
    text:
      es: "certificación de la valoración catastral de cada finca."
  explanation:
    es: "El mandamiento pide al registrador la certificación de las cargas de cada finca (art. 84.2 RGR). El valor catastral y la nota simple no son lo que se solicita, y el acuerdo de enajenación es posterior a la anotación y no lo certifica el registro."
  citation: "art. 84.2 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-83
- id: m03-l12-q0095
  prompt:
    es: "En el embargo de bienes inmuebles, el artículo 83.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que en el momento de notificarse la diligencia:"
  options:
  - id: a
    text:
      es: "se levanta acta del estado de conservación de los inmuebles embargados."
  - id: b
    text:
      es: "se tasan los inmuebles por perito de la Administración."
  - id: c
    correct: true
    text:
      es: "se requieren los títulos de propiedad a los titulares de los bienes o derechos."
  - id: d
    text:
      es: "se entrega al obligado al pago una copia del mandamiento de anotación preventiva."
  explanation:
    es: "Al notificar la diligencia se requieren los títulos de propiedad a los titulares (art. 83.2 RGR). La entrega del mandamiento, el acta del estado de conservación y la tasación pericial no son lo que dispone el apartado."
  citation: "art. 83.2 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-78
- id: m03-l12-q0096
  prompt:
    es: "Señale la respuesta CORRECTA sobre el embargo de dinero en efectivo, según el artículo 78.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "La diligencia se emite en un solo ejemplar, que queda unido al expediente, y el dinero se ingresa en el Tesoro."
  - id: b
    text:
      es: "El dinero se entrega al depositario designado, que lo ingresa en el Tesoro en el plazo de cinco días."
  - id: c
    text:
      es: "El dinero se deposita en la caja del órgano de recaudación hasta que sea firme la liquidación de la deuda."
  - id: d
    correct: true
    text:
      es: "El órgano de recaudación lo hace constar en diligencia, de la que emite un duplicado, y el dinero se ingresa inmediatamente en el Tesoro."
  explanation:
    es: "El dinero embargado consta en diligencia con duplicado: un ejemplar va al expediente y otro queda en poder del obligado, y se ingresa de inmediato en el Tesoro (art. 78.1 RGR). No se retiene en caja hasta la firmeza de la liquidación. La diligencia no es de un solo ejemplar. Y no se pasa por un depositario ni se espera cinco días."
  citation: "art. 78.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-78
- id: m03-l12-q0097
  prompt:
    es: "¿Qué puede acordar el órgano de recaudación, según el artículo 78.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando se trata de la recaudación de cajas, taquillas o similares de empresas o entidades en funcionamiento?"
  options:
  - id: a
    text:
      es: "El ingreso en el Tesoro de la totalidad de la recaudación, sin permitir pagos."
  - id: b
    correct: true
    text:
      es: "Los pagos que deban realizarse con cargo a dicha recaudación, en la cuantía necesaria para evitar la paralización de aquellas."
  - id: c
    text:
      es: "La clausura de la caja o taquilla hasta el ingreso íntegro de la deuda."
  - id: d
    text:
      es: "El nombramiento de un administrador que gestione la caja con autorización judicial."
  explanation:
    es: "El órgano puede permitir pagos con cargo a la recaudación, en la cuantía necesaria para que la empresa no se paralice (art. 78.2 RGR). No clausura la caja ni ingresa todo sin excepción. El administrador con intervención de la gestión es una medida del embargo de establecimientos (art. 170.5 LGT) y no necesita autorización judicial."
  citation: "art. 78.2 RGR"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-171
- id: m03-l12-q0100
  prompt:
    es: "Cuando en la cuenta afectada por el embargo se abonan habitualmente sueldos, salarios o pensiones, ¿qué importe se considera sueldo, salario o pensión del deudor, según el artículo 171.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El importe ingresado en la cuenta por ese concepto en el mes anterior a aquel en que se practica el embargo."
  - id: b
    text:
      es: "El importe medio mensual ingresado en la cuenta por ese concepto durante los doce meses anteriores al mes en que se practica el embargo."
  - id: c
    text:
      es: "El importe ingresado en la cuenta por ese concepto en el trimestre natural en que se practica el embargo."
  - id: d
    correct: true
    text:
      es: "El importe ingresado en la cuenta por ese concepto en el mes en que se practica el embargo o, en su defecto, en el mes anterior."
  explanation:
    es: "Se toma lo ingresado por ese concepto en el mes del embargo y, si no hay ingreso, en el mes anterior (art. 171.3 LGT). No se calcula una media anual ni se toma siempre el mes anterior, y el trimestre no es la referencia del artículo."
  citation: "art. 171.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-79
- id: m03-l12-q0102
  prompt:
    es: "En defecto del acuerdo general con la entidad de crédito, ¿dónde se presenta la diligencia de embargo de cuentas, según el artículo 79.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "En la sede del Banco de España."
  - id: b
    text:
      es: "En el domicilio del obligado al pago."
  - id: c
    text:
      es: "En el Registro Mercantil de la provincia del obligado."
  - id: d
    correct: true
    text:
      es: "En la oficina donde esté abierta la cuenta."
  explanation:
    es: "Sin convenio, la diligencia se presenta en la oficina donde esté abierta la cuenta (art. 79.3 RGR). Cabe también en la oficina designada por la entidad para relacionarse con el órgano de recaudación o en su domicilio fiscal o social, pero no en el domicilio del obligado, en el Registro Mercantil ni en el Banco de España."
  citation: "art. 79.3 RGR"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-79
- id: m03-l12-q0104
  prompt:
    es: "¿Desde cuándo surte efectos legales el embargo de fondos en una entidad de crédito, según el artículo 79.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Desde el día en que la entidad retiene efectivamente el importe embargado."
  - id: b
    correct: true
    text:
      es: "Desde el día de presentación de la diligencia a la entidad depositaria."
  - id: c
    text:
      es: "Desde el día en que el importe retenido se ingresa en el Tesoro."
  - id: d
    text:
      es: "Desde el día siguiente a la notificación de la diligencia al obligado al pago."
  explanation:
    es: "El embargo produce efectos desde que la diligencia se presenta a la entidad depositaria (art. 79.3 RGR), aunque la retención pueda tardar hasta cinco días. No esperan ni la retención material, ni la notificación al obligado, ni el ingreso en el Tesoro."
  citation: "art. 79.3 RGR"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-2005-14803-art-80
- id: m03-l12-q0107
  prompt:
    es: "De acuerdo con el artículo 80.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué se hace con el importe obtenido de la enajenación de los valores embargados?"
  options:
  - id: a
    text:
      es: "Se entrega al ejecutante hasta el límite de lo debido y el sobrante pasa a la Hacienda pública."
  - id: b
    correct: true
    text:
      es: "Se ingresa en el Tesoro hasta el límite de lo debido y el sobrante, si existe, se pone a disposición de su propietario."
  - id: c
    text:
      es: "Se ingresa íntegramente en el Tesoro y el obligado debe reclamar después el sobrante."
  - id: d
    text:
      es: "Se consigna en depósito hasta que sea firme la liquidación de la deuda perseguida."
  explanation:
    es: "Solo se ingresa lo debido y lo que sobra se pone a disposición del propietario (art. 80.4 RGR). No se ingresa todo para reclamar luego el sobrante. No se consigna a la espera de firmeza, y el sobrante no pasa a la Hacienda pública."
  citation: "art. 80.4 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-80
- id: m03-l12-q0108
  prompt:
    es: "¿Qué puede acordar el órgano de recaudación, cuando resulte más adecuado para la satisfacción de la deuda, en lugar de la enajenación de los valores embargados, según el artículo 80.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "La ejecución de las garantías del obligado al pago sobre otros bienes."
  - id: b
    text:
      es: "La adjudicación de los valores a la Hacienda pública por su valor de cotización en el mercado oficial."
  - id: c
    text:
      es: "La sustitución de los valores por un depósito en efectivo del obligado."
  - id: d
    correct: true
    text:
      es: "El embargo de los rendimientos de toda clase y, en su caso, reintegros, derivados de aquellos."
  explanation:
    es: "En lugar de vender los valores, puede embargar sus rendimientos y reintegros (art. 80.5 RGR). La adjudicación a la Hacienda pública es un cierre del apremio para bienes no adjudicados (art. 172.2 LGT). La ejecución de garantías y el depósito sustitutivo no son lo que dispone el apartado."
  citation: "art. 80.5 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-80
- id: m03-l12-q0109
  prompt:
    es: "En el embargo de participaciones en el capital de sociedades de responsabilidad limitada, ¿a quién se notifica la diligencia de embargo para su inscripción en el libro registro de socios, según el artículo 80.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Al notario que autorizó la escritura de constitución de la sociedad."
  - id: b
    text:
      es: "Al Registro Mercantil."
  - id: c
    text:
      es: "A la junta general de socios."
  - id: d
    correct: true
    text:
      es: "Al órgano de administración de la sociedad."
  explanation:
    es: "La diligencia se notifica al órgano de administración, que lleva el libro registro de socios (art. 80.6 RGR). No se notifica a la junta general, al Registro Mercantil ni al notario."
  citation: "art. 80.6 RGR"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-81
- id: m03-l12-q0110
  prompt:
    es: "Según el artículo 81.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué se advierte a la persona o entidad deudora del obligado cuando se le notifica la diligencia de embargo de créditos, efectos y derechos sin garantía?"
  options:
  - id: a
    text:
      es: "Que debe ingresar en el Tesoro el importe del crédito aunque no haya vencido."
  - id: b
    text:
      es: "Que el pago efectuado al obligado conserva carácter liberatorio hasta el vencimiento del crédito."
  - id: c
    text:
      es: "Que debe pagar al obligado y comunicar después el pago al órgano de recaudación."
  - id: d
    correct: true
    text:
      es: "Que, a partir de ese momento, no tiene carácter liberatorio el pago efectuado al obligado."
  explanation:
    es: "Desde la notificación el deudor ya no se libera pagando al obligado (art. 81.a RGR). Si el crédito ha vencido, ingresa en el Tesoro hasta cubrir la deuda; si no, el crédito queda afectado hasta su vencimiento. Por eso no se le pide ingresar un crédito no vencido ni se mantiene el carácter liberatorio, y pagar al obligado no es lo que se ordena."
  citation: "art. 81.a RGR"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-89
- id: m03-l12-q0112
  prompt:
    es: "Cuando se embargan intereses, rentas y frutos del obligado al pago que se materializan en pagos en dinero, el artículo 89.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que la diligencia se notifica a la persona o entidad pagadora, que debe:"
  options:
  - id: a
    correct: true
    text:
      es: "retenerlos e ingresarlos en el Tesoro hasta cubrir la cantidad adeudada."
  - id: b
    text:
      es: "depositarlos en una cuenta de consignaciones hasta la resolución del apremio."
  - id: c
    text:
      es: "ingresarlos en el Tesoro en su totalidad, sea cual sea la cantidad adeudada."
  - id: d
    text:
      es: "entregarlos al obligado al pago y comunicar la entrega al órgano de recaudación."
  explanation:
    es: "El pagador retiene e ingresa en el Tesoro hasta cubrir lo adeudado (art. 89.1 RGR). No entrega al obligado, no consigna en depósito ni ingresa más de lo debido."
  citation: "art. 89.1 RGR"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-90
- id: m03-l12-q0113
  prompt:
    es: "En el embargo de establecimientos mercantiles e industriales, ¿qué se hace constar en la diligencia que se extiende del resultado de la actuación, positivo o negativo, según el artículo 90.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El valor de tasación del establecimiento y la identidad de sus trabajadores."
  - id: b
    text:
      es: "Solo los bienes y derechos que se embargan, sin inventario del resto."
  - id: c
    correct: true
    text:
      es: "Los bienes y derechos existentes en cada establecimiento embargado, inventariados, así como los que se embargan."
  - id: d
    text:
      es: "Únicamente las mercaderías y materias primas existentes en el establecimiento."
  explanation:
    es: "La diligencia inventaría todos los bienes y derechos de cada establecimiento y señala los que se embargan (art. 90.2 RGR). No se limita a lo embargado ni a las mercaderías, y la tasación y los trabajadores no son contenido de la diligencia."
  citation: "art. 90.2 RGR"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-90
- id: m03-l12-q0114
  prompt:
    es: "¿Cuál de los siguientes elementos comprende el embargo de un establecimiento mercantil o industrial, si los hubiera, según el artículo 90.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Los bienes personales de los socios de la entidad titular."
  - id: b
    correct: true
    text:
      es: "Los derechos de propiedad intelectual e industrial."
  - id: c
    text:
      es: "Los derechos de los trabajadores del establecimiento."
  - id: d
    text:
      es: "Las cuentas bancarias del titular del negocio."
  explanation:
    es: "El embargo del establecimiento comprende el derecho de cesión del contrato de arrendamiento y las instalaciones, los derechos de propiedad intelectual e industrial, el utillaje y las máquinas, las mercaderías y materias primas y las posibles indemnizaciones (art. 90.3 RGR). Los derechos de los trabajadores, las cuentas del titular y los bienes personales de los socios no forman parte de esa lista."
  citation: "art. 90.3 RGR"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-90
- id: m03-l12-q0115
  prompt:
    es: "Según el artículo 90.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el inmueble en el que se encuentra el establecimiento embargado está arrendado, ¿a quién se notifica la diligencia de embargo?"
  options:
  - id: a
    correct: true
    text:
      es: "Al arrendador."
  - id: b
    text:
      es: "Al arrendatario de los inmuebles colindantes."
  - id: c
    text:
      es: "Al administrador de la comunidad de propietarios."
  - id: d
    text:
      es: "Al registrador de la propiedad."
  explanation:
    es: "Si el inmueble está arrendado, la diligencia se notifica al arrendador (art. 90.4 RGR). No se notifica al registrador por este motivo ni a terceros ajenos al arrendamiento."
  citation: "art. 90.4 RGR"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-91
- id: m03-l12-q0117
  prompt:
    es: "El embargo de metales preciosos, piedras finas, joyería, orfebrería y antigüedades se realiza, según el artículo 91.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, por el órgano de recaudación, que adopta las precauciones necesarias para impedir su sustitución o levantamiento:"
  options:
  - id: a
    text:
      es: "mediante su depósito inmediato en el Banco de España."
  - id: b
    text:
      es: "mediante la presencia permanente de un agente de la autoridad."
  - id: c
    text:
      es: "mediante su inscripción en el Registro de Bienes Muebles."
  - id: d
    correct: true
    text:
      es: "por medio de precintos o en la forma más conveniente."
  explanation:
    es: "Las precauciones son los precintos u otra forma más conveniente (art. 91.1 RGR). El depósito obligatorio en el Banco de España, la vigilancia permanente y la inscripción en el Registro de Bienes Muebles no son las medidas del artículo."
  citation: "art. 91.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-92
- id: m03-l12-q0118
  prompt:
    es: "¿Qué plazo se concede al obligado al pago, en la notificación del embargo de automóviles, camiones, motocicletas, embarcaciones o aeronaves, para poner el vehículo a disposición de los órganos de recaudación con su documentación y llaves, según el artículo 92.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Un mes desde la notificación del embargo."
  - id: b
    correct: true
    text:
      es: "Cinco días desde la notificación del embargo."
  - id: c
    text:
      es: "Diez días desde la notificación del embargo."
  - id: d
    text:
      es: "Quince días desde la notificación del embargo."
  explanation:
    es: "El requerimiento concede cinco días (art. 92.4 RGR). Los diez y los quince días y el mes no son el plazo del artículo."
  citation: "art. 92.4 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-92
- id: m03-l12-q0120
  prompt:
    es: "Según el artículo 92.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, siempre que el embargo afecte a bienes inscribibles en el Registro de Bienes Muebles, ¿qué expide el órgano de recaudación?"
  options:
  - id: a
    text:
      es: "Acta de depósito del bien embargado."
  - id: b
    text:
      es: "Certificación de dominio del bien."
  - id: c
    correct: true
    text:
      es: "Mandamiento de anotación preventiva de embargo."
  - id: d
    text:
      es: "Providencia de apremio específica de cada bien embargado."
  explanation:
    es: "Para bienes inscribibles en el Registro de Bienes Muebles se expide mandamiento de anotación preventiva de embargo (art. 92.3 RGR). La certificación de dominio, la providencia específica y el acta de depósito no son el documento previsto."
  citation: "art. 92.3 RGR"
  difficulty: 1
  tags:
  - "documento"
# anchor: boe-a-2005-14803-art-79
- id: m03-l12-q0235
  prompt:
    es: "Presentada la diligencia de embargo en la oficina donde esté abierta la cuenta, el artículo 79.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que sus responsables deben proceder de forma inmediata a retener el importe embargado si existe saldo suficiente o, en otro caso:"
  options:
  - id: a
    text:
      es: "la mitad de los saldos existentes a nombre del obligado al pago, hasta el límite de lo adeudado."
  - id: b
    text:
      es: "el saldo de la cuenta de mayor importe, sin afectar a las demás cuentas del obligado al pago."
  - id: c
    text:
      es: "solo el saldo disponible en el momento de la presentación, rechazando el resto de la diligencia."
  - id: d
    correct: true
    text:
      es: "el total de los saldos existentes a nombre del obligado al pago."
  explanation:
    es: "Si el saldo no basta, se retiene el total de los saldos existentes a nombre del obligado (art. 79.3 RGR). No se rechaza el resto de la diligencia ni se limita a la mitad o a la cuenta mayor."
  citation: "art. 79.3 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-80
- id: m03-l12-q0236
  prompt:
    es: "Cuando la Administración conoce valores del obligado al pago, el artículo 80.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que la diligencia de embargo identifica los valores conocidos y comprende un número de valores que, a juicio del órgano de recaudación:"
  options:
  - id: a
    text:
      es: "garantice su enajenación inmediata en un mercado secundario oficial, aunque exceda de la deuda."
  - id: b
    text:
      es: "supere en un 20 por ciento el importe de la deuda para cubrir posibles variaciones de cotización."
  - id: c
    correct: true
    text:
      es: "cubra el importe total del artículo 169.1 de la Ley General Tributaria."
  - id: d
    text:
      es: "cubra únicamente el principal de la deuda no ingresada, sin intereses ni costas."
  explanation:
    es: "La diligencia identifica los valores conocidos y abarca los suficientes para cubrir el importe total del artículo 169.1 LGT (art. 80.1 RGR): deuda, intereses, recargos y costas. No es solo el principal. No se añade un margen del 20 por ciento, ni se exige que se puedan vender de inmediato en mercado oficial."
  citation: "art. 80.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0238
  prompt:
    es: "¿A quién más se notifica la diligencia de embargo, además de al obligado al pago y al cónyuge en los casos previstos, según el artículo 76.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "A los trabajadores del obligado cuando los bienes embargados sean instrumentos de producción."
  - id: b
    text:
      es: "A los acreedores del obligado al pago que hayan solicitado el embargo de los mismos bienes."
  - id: c
    correct: true
    text:
      es: "Al tercero titular, poseedor o depositario de los bienes si no se hubieran realizado con él las actuaciones, y a los condueños o cotitulares."
  - id: d
    text:
      es: "Al Registro de la Propiedad y al Registro Mercantil, en todo caso, para que se tome nota del embargo."
  explanation:
    es: "La diligencia se notifica al obligado, al tercero titular, poseedor o depositario si no intervino, al cónyuge en bienes gananciales o vivienda habitual y a condueños o cotitulares (art. 76.3 RGR). No se notifica a otros acreedores ni a los trabajadores, y los registros reciben el mandamiento de anotación, no la notificación de la diligencia."
  citation: "art. 76.3 RGR"
  difficulty: 3
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-79
- id: m03-l12-q0243
  prompt:
    es: "El importe retenido por la entidad de crédito se ingresa en el Tesoro, según el artículo 79.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, transcurridos 20 días naturales desde el día siguiente a la traba, sin haber recibido la oficina o entidad:"
  options:
  - id: a
    text:
      es: "autorización escrita del obligado al pago para el ingreso del importe retenido."
  - id: b
    correct: true
    text:
      es: "comunicación en contrario del órgano de recaudación."
  - id: c
    text:
      es: "resolución del recurso que haya interpuesto el obligado contra la diligencia de embargo."
  - id: d
    text:
      es: "requerimiento de pago del importe retenido formulado por el órgano de recaudación competente."
  explanation:
    es: "La entidad ingresa el importe retenido pasados 20 días naturales si no recibe comunicación en contrario del órgano de recaudación (art. 79.6 RGR). No hace falta autorización del obligado ni resolución de recurso, y tampoco un requerimiento posterior del órgano."
  citation: "art. 79.6 RGR"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-84
- id: m03-l12-q0244
  prompt:
    es: "Según el artículo 84.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en el embargo de bienes inmuebles, ¿en qué registro solicita la Administración que se practique anotación preventiva del embargo?"
  options:
  - id: a
    text:
      es: "En el Catastro Inmobiliario del municipio donde radique el inmueble."
  - id: b
    text:
      es: "En el Registro Mercantil del domicilio fiscal del obligado."
  - id: c
    correct: true
    text:
      es: "En el Registro de la Propiedad que corresponda."
  - id: d
    text:
      es: "En el Registro de Bienes Muebles de la provincia donde radique el inmueble."
  explanation:
    es: "La anotación preventiva del embargo de inmuebles se solicita en el Registro de la Propiedad competente (art. 84.1 RGR). El Registro Mercantil y el de Bienes Muebles no son el de los inmuebles (el segundo se usa para bienes muebles inscribibles, art. 92.3), y el Catastro no es un registro jurídico donde se anote un embargo."
  citation: "art. 84.1 RGR"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-85
- id: m03-l12-q0245
  prompt:
    es: "¿Cuál de los siguientes contenidos corresponde al mandamiento para la anotación preventiva de embargo de una finca, según la letra a del artículo 85 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "La certificación del acuerdo de valoración de la finca y de la valoración contradictoria del obligado."
  - id: b
    text:
      es: "La certificación de la liquidación de la que deriva la deuda, con su fecha de notificación al obligado."
  - id: c
    text:
      es: "La certificación del acuerdo de enajenación de la finca, con indicación del tipo de subasta fijado."
  - id: d
    correct: true
    text:
      es: "La certificación de la providencia de apremio y de la diligencia de embargo, con indicación de las personas a las que se ha notificado el embargo."
  explanation:
    es: "El mandamiento incorpora la certificación de la providencia de apremio y de la diligencia de embargo, con las personas notificadas y el concepto de la notificación (art. 85.a RGR). La valoración, la liquidación de origen y el acuerdo de enajenación no son contenido del mandamiento."
  citation: "art. 85 RGR"
  difficulty: 2
  tags:
  - "contenido"
