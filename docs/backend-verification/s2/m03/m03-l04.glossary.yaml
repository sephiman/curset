- id: g-jdk-mission-control
  term:
    en: JDK Mission Control
  definition:
    en: A production-time profiling and diagnostics tool that includes tools to monitor and manage your Java application with a very small performance overhead.
  origin: m03-l04
  citation: jdk-troubleshoot-tools#JSTGD-GUID-47A98C88-95B1-4842-9B0D-67BBDB266214
- id: g-dead-code-elimination
  term:
    en: dead-code elimination
  definition:
    en: The optimization in which compilers deduce that some computations are redundant and eliminate them completely.
  origin: m03-l04
  citation: jmh-sample-deadcode#_R_7lcpala9lik5_
- id: g-constant-folding
  term:
    en: constant folding
  definition:
    en: The optimization in which, if the JVM realizes the result of the computation is the same no matter what, it can cleverly optimize it, for example by moving the computation outside of the internal loop.
  origin: m03-l04
  citation: jmh-sample-constantfold#_R_7lcpala9lik5_
- id: g-coordinated-omission
  term:
    en: Coordinated Omission
  definition:
    en: An effect in a load generator through which most of the high latency artifacts exhibited by the measured server are ignored, because each connection only begins to send a request after receiving a response.
  origin: m03-l04
  citation: wrk2-readme#acknowledgements
