# anchor: boe-a-2021-5032-art-21
- id: m02-l04-q090
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las Administraciones Públicas podrán utilizar sistemas de código seguro de verificación de documentos en el desarrollo de:"
  options:
  - id: a
    text:
      es: "Procedimientos de apoderamiento apud acta."
  - id: b
    correct: true
    text:
      es: "Actuaciones automatizadas."
  - id: c
    text:
      es: "Notificaciones electrónicas obligatorias."
  - id: d
    text:
      es: "Actuaciones presenciales en oficinas."
  explanation:
    es: "El código seguro de verificación se usa en las actuaciones automatizadas. Las notificaciones obligatorias, la atención presencial y el apoderamiento apud acta no son el ámbito que fija el precepto."
  citation: "art. 21.1 RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-21
- id: m02-l04-q091
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, el código seguro de verificación vinculará al órgano, organismo público o entidad de derecho público y, en su caso, a:"
  options:
  - id: a
    text:
      es: "La oficina de asistencia que lo digitaliza."
  - id: b
    text:
      es: "La persona interesada a la que se dirige el documento."
  - id: c
    text:
      es: "El funcionario habilitado que expide la copia."
  - id: d
    correct: true
    text:
      es: "La persona firmante del documento."
  explanation:
    es: "El código vincula al órgano emisor y, en su caso, a quien firma el documento. El destinatario, el funcionario que copia y la oficina que digitaliza no quedan vinculados por el código."
  citation: "art. 21.1 RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-21
- id: m02-l04-q092
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, el código seguro de verificación permitirá en todo caso la comprobación de la integridad del documento en:"
  options:
  - id: a
    text:
      es: "La oficina de asistencia en materia de registros más próxima."
  - id: b
    correct: true
    text:
      es: "La sede electrónica o sede electrónica asociada correspondiente."
  - id: c
    text:
      es: "El Registro de Funcionarios Habilitados de la Administración General del Estado."
  - id: d
    text:
      es: "El Registro Electrónico General de la Administración competente."
  explanation:
    es: "La integridad se comprueba en la sede electrónica, o sede asociada, correspondiente, mediante un procedimiento de verificación directo y gratuito. El registro general, la oficina de asistencia y el registro de funcionarios no verifican documentos con código."
  citation: "art. 21.1 RD 203/2021"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-21
- id: m02-l04-q093
  prompt:
    es: "Cuando una Administración emite un documento con código seguro de verificación, ¿qué permite comprobar ese código en la sede electrónica correspondiente?"
  options:
  - id: a
    text:
      es: "La vigencia del certificado del prestador de servicios."
  - id: b
    text:
      es: "La fecha y la hora de su presentación en el registro."
  - id: c
    correct: true
    text:
      es: "La integridad del documento."
  - id: d
    text:
      es: "La identidad de la persona interesada que lo presentó."
  explanation:
    es: "El código permite comprobar la integridad del documento. No acredita la identidad del interesado, ni la hora de presentación, ni la vigencia de ningún certificado."
  citation: "art. 21.1 RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-sede-pag-portada-html
- id: m02-l04-q094
  prompt:
    es: "Entre los servicios electrónicos destacados de la sede del Punto de Acceso General, ¿cuál permite verificar la integridad y autenticidad de documentos electrónicos mediante su código?"
  options:
  - id: a
    text:
      es: "La validación de certificados de las sedes asociadas."
  - id: b
    text:
      es: "El registro electrónico de apoderamientos de los interesados."
  - id: c
    correct: true
    text:
      es: "El cotejo de documentos por código seguro de verificación."
  - id: d
    text:
      es: "El registro de funcionarios habilitados para firmar por los interesados."
  explanation:
    es: "La portada de la sede destaca el cotejo de documentos por CSV, que verifica integridad y autenticidad de los documentos emitidos con código seguro de verificación. Los registros de funcionarios y de apoderamientos tienen otra función."
  citation: "fuente: `sede-pag-portada.html`; «Portada de la sede»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-14
- id: m02-l04-q157
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, están obligados a relacionarse por medios electrónicos los empleados de las Administraciones Públicas, en la forma que determine cada Administración, para los trámites que realicen con ellas por razón de su:"
  options:
  - id: a
    text:
      es: "Antigüedad en el servicio activo de la Administración."
  - id: b
    text:
      es: "Pertenencia a un cuerpo de funcionarios de carrera."
  - id: c
    correct: true
    text:
      es: "Condición de empleado público."
  - id: d
    text:
      es: "Condición de personas interesadas en procesos selectivos."
  explanation:
    es: "La letra e) obliga a los empleados por razón de su condición de empleado público. Participar en procesos selectivos, pertenecer a un cuerpo de carrera o la antigüedad no son el criterio de la letra."
  citation: "art. 14.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-9
- id: m02-l04-q158
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados podrán identificarse electrónicamente mediante certificados electrónicos cualificados de firma electrónica y mediante certificados electrónicos cualificados de:"
  options:
  - id: a
    text:
      es: "Clave concertada de usuario."
  - id: b
    text:
      es: "Autenticación de sitio web."
  - id: c
    correct: true
    text:
      es: "Sello electrónico."
  - id: d
    text:
      es: "Fechado electrónico."
  explanation:
    es: "La letra b) añade los certificados cualificados de sello electrónico. Los de autenticación de sitio web identifican sedes, y el fechado y la clave concertada no son certificados de esa letra."
  citation: "art. 9.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-10
- id: m02-l04-q159
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, con carácter general los interesados podrán firmar a través de:"
  options:
  - id: a
    text:
      es: "Solo sistemas de firma avanzada que expida la propia Administración Pública competente."
  - id: b
    text:
      es: "Únicamente un certificado electrónico cualificado de firma expedido por prestador de confianza."
  - id: c
    correct: true
    text:
      es: "Cualquier medio que permita acreditar la autenticidad de la expresión de su voluntad y consentimiento."
  - id: d
    text:
      es: "Siempre una firma manuscrita presencial ante un funcionario habilitado de la oficina."
  explanation:
    es: "La regla general admite cualquier medio que acredite la autenticidad de la voluntad y del consentimiento. No se exige un certificado cualificado, una firma emitida por la Administración ni la firma presencial."
  citation: "art. 10.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-40
- id: m02-l04-q160
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas podrán identificarse mediante el uso de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un sello electrónico basado en un certificado electrónico reconocido o cualificado."
  - id: b
    text:
      es: "Una clave concertada de usuario y contraseña propia de cada órgano de la Administración."
  - id: c
    text:
      es: "Una firma manuscrita digitalizada de la persona titular del órgano administrativo."
  - id: d
    text:
      es: "Un código seguro de verificación sin certificado electrónico alguno de respaldo."
  explanation:
    es: "Las Administraciones se identifican con un sello electrónico basado en un certificado reconocido o cualificado. La firma manuscrita digitalizada, el código sin certificado y la clave concertada no son ese sistema."
  citation: "art. 40.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-12
- id: m02-l04-q163
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el interesado carece de medios electrónicos y un funcionario realiza su identificación o firma, será necesario que el interesado se identifique ante el funcionario y preste:"
  options:
  - id: a
    correct: true
    text:
      es: "Su consentimiento expreso para esta actuación."
  - id: b
    text:
      es: "Su conformidad por escrito ante un notario."
  - id: c
    text:
      es: "Una declaración responsable sobre su falta de medios."
  - id: d
    text:
      es: "Su consentimiento tácito al presentar el escrito."
  explanation:
    es: "El interesado ha de prestar su consentimiento expreso, de lo que debe quedar constancia. El consentimiento tácito, la declaración responsable sobre la falta de medios y la conformidad ante notario no son lo que exige el apartado."
  citation: "art. 12.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-14
- id: m02-l04-q167
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria están obligados a relacionarse electrónicamente con las Administraciones para los trámites que realicen en ejercicio de:"
  options:
  - id: a
    correct: true
    text:
      es: "Dicha actividad profesional."
  - id: b
    text:
      es: "Su condición de interesados en procedimientos tributarios."
  - id: c
    text:
      es: "Cualquier actividad económica o empresarial."
  - id: d
    text:
      es: "Sus derechos como ciudadanos y administrados."
  explanation:
    es: "La obligación del colectivo colegiado se limita a los trámites y actuaciones que realicen en ejercicio de la actividad profesional. No alcanza a cualquier actividad económica, a sus derechos como ciudadanos ni a todos los procedimientos tributarios."
  citation: "art. 14.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-3
- id: m02-l04-q168
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las personas físicas no obligadas a relacionarse electrónicamente ejercitan su derecho al inicio del procedimiento y lo comunican al órgano competente para la tramitación del mismo, de forma que este pueda:"
  options:
  - id: a
    text:
      es: "Inscribir al interesado en el registro de apoderamientos."
  - id: b
    text:
      es: "Autorizar la sede electrónica que se vaya a utilizar."
  - id: c
    text:
      es: "Verificar la identidad del interesado ante el registro."
  - id: d
    correct: true
    text:
      es: "Tener constancia de dicha decisión."
  explanation:
    es: "La comunicación sirve para que el órgano tenga constancia de la decisión del interesado. Verificar la identidad, autorizar la sede o inscribir en el registro de apoderamientos son actos que el precepto no prevé."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 2
  tags:
  - "procedimiento"
