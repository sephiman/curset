# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q023
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si las leyes no fijan plazos, las infracciones leves y las sanciones impuestas por faltas leves prescribirán, respectivamente:"
  options:
  - id: a
    text:
      es: "Al año y a los seis meses."
  - id: b
    text:
      es: "A los seis meses en ambos casos."
  - id: c
    text:
      es: "Al año en ambos casos."
  - id: d
    correct: true
    text:
      es: "A los seis meses y al año."
  explanation:
    es: "El artículo 30.1 dice que, si las leyes no fijan plazos, «las leves [prescribirán] a los seis meses» y las sanciones «impuestas por faltas leves al año». La opción del año y los seis meses invierte el orden. Las dos que igualan los plazos olvidan que, en las faltas leves, la sanción prescribe más tarde que la infracción."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q024
  prompt:
    es: "Si la ley que las establece no fija plazos de prescripción, ¿en qué plazos prescriben las infracciones graves y las muy graves, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Al año y a los dos años, respectivamente."
  - id: b
    correct: true
    text:
      es: "A los dos años y a los tres años, respectivamente."
  - id: c
    text:
      es: "A los dos y a los cuatro años, respectivamente."
  - id: d
    text:
      es: "A los tres y a los cinco años, respectivamente."
  explanation:
