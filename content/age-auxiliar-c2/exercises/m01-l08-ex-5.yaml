  prompt:
    es: "Conforme al artículo 71.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los servicios territoriales de la Administración General del Estado en la Comunidad Autónoma se organizan en servicios:"
