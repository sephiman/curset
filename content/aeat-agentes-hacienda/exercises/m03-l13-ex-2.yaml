# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0004
  prompt:
    es: "Una persona carece de capacidad de obrar en el orden tributario y, en su nombre, no se presenta en plazo una autoliquidación. Según el artículo 179.2.a y el artículo 181.1.f de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quién responde por la infracción tributaria que se haya podido cometer?"
  options:
  - id: a
    correct: true
    text:
      es: "El representante legal del obligado, que es sujeto infractor, mientras que el obligado sin capacidad de obrar no responde."
  - id: b
    text:
      es: "Nadie, porque la falta de capacidad de obrar excluye también la responsabilidad del representante legal."
  - id: c
    text:
      es: "El obligado sin capacidad de obrar, y su representante legal solo responde de forma subsidiaria si no paga."
  - id: d
    text:
      es: "El obligado sin capacidad de obrar, pero únicamente si la infracción es leve, y nunca su representante legal."
  explanation:
    es: "El artículo 179.2.a LGT excluye la responsabilidad de quien carece de capacidad de obrar en el orden tributario. El artículo 181.1.f añade que es sujeto infractor el representante legal de esos obligados. La infracción, por tanto, recae en el representante y no en el obligado. No hay responsabilidad subsidiaria del representante ni exención general, y la gravedad de la infracción no cambia esa atribución."
  citation: "art. 181.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "sujeto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0018
  prompt:
    es: "De acuerdo con el artículo 181.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los sujetos infractores:"
  options:
  - id: a
    text:
      es: "Los retenedores son sujetos infractores, pero no lo son los obligados a practicar ingresos a cuenta."
  - id: b
    text:
      es: "Solo son sujetos infractores los contribuyentes y los sustitutos de los contribuyentes, sin ningún otro obligado."
  - id: c
    correct: true
    text:
      es: "Los retenedores y los obligados a practicar ingresos a cuenta son sujetos infractores, entre otros."
  - id: d
    text:
      es: "Los obligados al cumplimiento de obligaciones tributarias formales no son sujetos infractores, aunque incumplan esas obligaciones."
  explanation:
    es: "El artículo 181.1.b LGT incluye entre los sujetos infractores a los retenedores y a los obligados a practicar ingresos a cuenta, a ambos. La lista no se reduce a contribuyentes y sustitutos: dice «entre otros» e incluye en la letra c a los obligados a obligaciones formales."
  citation: "art. 181.1 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "lista"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0019
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los sujetos infractores es CORRECTA según el artículo 181.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Las entidades obligadas a atribuir rentas a sus socios o miembros no son sujetos infractores; lo son sus socios."
  - id: b
    text:
      es: "El representante legal de un obligado sin capacidad de obrar no es sujeto infractor, porque no realiza el hecho."
  - id: c
    correct: true
    text:
      es: "La entidad representante del grupo fiscal en el régimen de consolidación fiscal es sujeto infractor."
  - id: d
    text:
      es: "Los obligados tributarios conforme a la normativa sobre asistencia mutua quedan fuera de los sujetos infractores."
  explanation:
    es: "La letra d del artículo 181.1 LGT incluye a la entidad representante del grupo fiscal en el régimen de consolidación fiscal. Las otras tres afirmaciones niegan lo que el mismo artículo afirma: la letra e incluye a las entidades que imputan o atribuyen rentas, la g a los obligados por asistencia mutua y la f al representante legal de quien carece de capacidad de obrar."
  citation: "art. 181.1 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "lista"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0020
  prompt:
    es: "Según el artículo 181.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué entidad es sujeto infractor en el régimen especial del grupo de entidades del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "La entidad dominante del grupo de entidades."
  - id: b
    text:
      es: "La entidad dependiente de mayor volumen de operaciones del grupo en el ejercicio."
  - id: c
    text:
      es: "Cada una de las entidades dependientes, de forma individual y no solidaria."
  - id: d
    text:
      es: "La entidad representante del grupo, como en el régimen de consolidación fiscal."
  explanation:
    es: "La letra h del artículo 181.1 LGT señala a la entidad dominante en el régimen especial del grupo de entidades del IVA. La entidad representante es la figura que la letra d reserva al grupo fiscal en el régimen de consolidación fiscal. El texto no pone como sujeto infractor a cada dependiente ni a la de mayor volumen de operaciones."
  citation: "art. 181.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0021
  prompt:
    es: "De acuerdo con el artículo 181.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el sujeto infractor tendrá la consideración de deudor principal a efectos de lo dispuesto en el artículo 41.1 en relación con:"
  options:
  - id: a
    text:
      es: "La liquidación del interés de demora que corresponda a la deuda sancionada."
  - id: b
    correct: true
    text:
      es: "La declaración de responsabilidad."
  - id: c
    text:
      es: "La suspensión de la ejecución de la sanción en período voluntario."
  - id: d
    text:
      es: "La prescripción del derecho de la Administración a imponer la sanción."
  explanation:
    es: "El artículo 181.2 LGT dice que el sujeto infractor es deudor principal a efectos del artículo 41.1 en relación con la declaración de responsabilidad. Ese carácter no tiene que ver con el interés de demora, con la suspensión de la sanción ni con la prescripción."
  citation: "art. 181.2 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0022
  prompt:
    es: "De acuerdo con el artículo 181.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la concurrencia de varios sujetos infractores en la realización de una infracción tributaria determina que:"
  options:
  - id: a
    text:
      es: "Quede obligado al pago de la sanción el de mayor participación, y solo subsidiariamente los demás."
  - id: b
    text:
      es: "Se imponga la sanción únicamente al sujeto infractor que primero haya sido identificado por la Administración."
  - id: c
    text:
      es: "Respondan de la sanción por partes iguales, sin solidaridad entre ellos frente a la Administración."
  - id: d
    correct: true
    text:
      es: "Queden solidariamente obligados frente a la Administración al pago de la sanción."
  explanation:
    es: "El artículo 181.3 LGT hace solidarios frente a la Administración a los varios sujetos infractores que concurren en una infracción. Por eso no hay reparto por partes iguales, ni responsabilidad subsidiaria del de menor participación, ni sanción solo para el identificado primero."
  citation: "art. 181.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0023
  prompt:
    es: "Dos socios, Pedro Alonso y Marta Gil, cometen conjuntamente una infracción tributaria y la Administración les impone una sanción de 10.000 euros. Marta ha ingresado ya 4.000 euros. Según el artículo 181.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede exigir la Administración a Pedro?"
  options:
  - id: a
    correct: true
    text:
      es: "Los 6.000 euros que restan, porque los dos sujetos infractores quedan solidariamente obligados al pago de la sanción."
  - id: b
    text:
      es: "Solo 4.000 euros, porque la solidaridad se limita a la cantidad que ha ingresado el otro infractor."
  - id: c
    text:
      es: "Solo 5.000 euros, porque cada sujeto infractor responde de la mitad de la sanción impuesta."
  - id: d
    text:
      es: "Nada, porque Marta ha abonado una parte y la sanción queda extinguida para el otro infractor."
  explanation:
    es: "Con varios sujetos infractores, el artículo 181.3 LGT los obliga solidariamente al pago de la sanción. La Administración puede exigir a Pedro el importe pendiente, 10.000 menos 4.000, es decir, 6.000 euros. No se divide por mitades, el pago parcial de uno no extingue la sanción y la solidaridad no se limita a lo ya ingresado."
  citation: "art. 181.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
# anchor: boe-a-2003-23186-art-182
- id: m03-l13-q0028
  prompt:
    es: "Según el artículo 182.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre con las sanciones tributarias de las personas físicas infractoras cuando estas fallecen?"
  options:
  - id: a
    text:
      es: "Se transmiten a sus herederos hasta el valor de la herencia recibida."
  - id: b
    text:
      es: "Se transmiten a los legatarios, pero no a los herederos, en proporción a lo recibido."
  - id: c
    text:
      es: "Se transmiten a los herederos solo si la sanción era firme en vía administrativa."
  - id: d
    correct: true
    text:
      es: "No se transmiten a sus herederos y legatarios."
  explanation:
    es: "El artículo 182.3 LGT establece que las sanciones tributarias no se transmiten a los herederos y legatarios de las personas físicas infractoras, sin excepciones por firmeza ni por el valor de lo recibido. Lo mismo dice, con otro alcance, el artículo 189.1, que extingue la responsabilidad por el fallecimiento del infractor."
  citation: "art. 182.3 LGT"
  difficulty: 1
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2003-23186-art-182
- id: m03-l13-q0029
  prompt:
    es: "Fallece Ramón Ortega, persona física, cuando le habían impuesto por resolución una sanción tributaria de 3.000 euros que no había pagado. Sus hijos aceptan la herencia. Según el artículo 182.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿pueden los hijos ser obligados al pago de esa sanción?"
  options:
  - id: a
    text:
      es: "No, salvo que los hijos hayan aceptado la herencia pura y simplemente, sin beneficio de inventario ni limitación de responsabilidad."
  - id: b
    correct: true
    text:
      es: "No, porque las sanciones tributarias no se transmiten a los herederos de las personas físicas infractoras."
  - id: c
    text:
      es: "Sí, hasta el límite del valor de la herencia, porque la sanción ya estaba impuesta al fallecer."
  - id: d
    text:
      es: "Sí, solo si la sanción era firme en vía administrativa en la fecha del fallecimiento de Ramón."
  explanation:
    es: "El artículo 182.3 LGT impide transmitir las sanciones a herederos y legatarios de las personas físicas infractoras. La regla no depende de que la sanción esté ya impuesta, sea firme o la herencia se acepte de una forma u otra."
  citation: "art. 182.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2003-23186-art-182
- id: m03-l13-q0030
  prompt:
    es: "De acuerdo con el artículo 182.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las sanciones tributarias por infracciones cometidas por las sociedades y entidades disueltas se transmitirán:"
  options:
  - id: a
    correct: true
    text:
      es: "A los sucesores de las mismas en los términos previstos en el artículo 40."
  - id: b
    text:
      es: "A los socios en todo caso, con independencia de la cuota de liquidación que hubieran recibido."
  - id: c
    text:
      es: "A los administradores de la sociedad, de forma solidaria y sin límite de cuantía alguno."
  - id: d
    text:
      es: "A los sucesores de las mismas en los términos previstos en el artículo 39, relativo a los herederos."
  explanation:
    es: "El artículo 182.3 LGT transmite esas sanciones a los sucesores de la sociedad o entidad disuelta, en los términos del artículo 40. No se transmiten a los socios sin más, ni a los administradores, y el artículo 39 regula la sucesión de personas físicas, no la de entidades disueltas."
  citation: "art. 182.3 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0236
  prompt:
    es: "Según el artículo 181.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quiénes son sujetos infractores, entre otros, por incumplir las obligaciones tributarias que les corresponden?"
  options:
  - id: a
    correct: true
    text:
      es: "Los obligados al cumplimiento de obligaciones tributarias formales."
  - id: b
    text:
      es: "Los sucesores de los obligados al cumplimiento de obligaciones tributarias formales fallecidos."
  - id: c
    text:
      es: "Los obligados al cumplimiento de obligaciones tributarias materiales, pero no los de las formales."
  - id: d
    text:
      es: "Los obligados al cumplimiento de obligaciones tributarias accesorias, pero no los de las formales."
  explanation:
    es: "La letra c del artículo 181.1 LGT incluye entre los sujetos infractores a los obligados al cumplimiento de obligaciones tributarias formales. La lista no se limita a obligaciones materiales ni accesorias, y las sanciones no se transmiten a herederos de personas físicas (artículo 182.3)."
  citation: "art. 181.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0237
  prompt:
    es: "Según el artículo 181.1.g de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué obligados tributarios son sujetos infractores por remisión a otra normativa?"
  options:
  - id: a
    text:
      es: "Los obligados tributarios conforme a la normativa aduanera de la Unión Europea."
  - id: b
    text:
      es: "Los obligados tributarios conforme a la normativa sobre el Impuesto sobre el Valor Añadido."
  - id: c
    text:
      es: "Los obligados tributarios conforme a la normativa de los convenios para evitar la doble imposición."
  - id: d
    correct: true
    text:
      es: "Los obligados tributarios conforme a la normativa sobre asistencia mutua."
  explanation:
    es: "La letra g del artículo 181.1 LGT incluye a los obligados tributarios conforme a la normativa sobre asistencia mutua. El IVA tiene su propia mención en la letra h, para la entidad dominante del grupo, y los convenios y la normativa aduanera no aparecen en la lista."
  citation: "art. 181.1 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-182
- id: m03-l13-q0238
  prompt:
    es: "Conforme al artículo 182.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la responsabilidad solidaria por el pago de las sanciones tributarias:"
  options:
  - id: a
    text:
      es: "Alcanza solo a las sanciones derivadas de una deuda tributaria, y no a las que no deriven de ninguna deuda."
  - id: b
    text:
      es: "Alcanza a las sanciones de quienes se encuentran en los supuestos de cualquier párrafo del apartado 1 del artículo 42."
  - id: c
    text:
      es: "Alcanza a las sanciones, pero el procedimiento para exigirla es el del artículo 176, propio de la subsidiaria."
  - id: d
    correct: true
    text:
      es: "Alcanza a las sanciones, derivadas o no de una deuda tributaria, de quienes se encuentran en los supuestos de los párrafos a) y c) del artículo 42.1 y del 42.2."
  explanation:
    es: "El artículo 182.1 LGT incluye las sanciones, derivadas o no de una deuda, en los supuestos de los párrafos a) y c) del artículo 42.1 y en el 42.2. No es para cualquier párrafo del apartado 1 y el procedimiento es el del artículo 175; el 176 es el de la responsabilidad subsidiaria."
  citation: "art. 182.1 LGT"
  difficulty: 3
  tags:
  - "responsabilidad"
# anchor: boe-a-2003-23186-art-181
- id: m03-l13-q0248
  prompt:
    es: "De acuerdo con el artículo 181.1.e de la Ley 58/2003, de 17 de diciembre, General Tributaria, son sujetos infractores, entre otros, las entidades que estén obligadas a imputar o atribuir rentas:"
  options:
  - id: a
    text:
      es: "A la Administración tributaria, en cumplimiento de la normativa de cada tributo."
  - id: b
    text:
      es: "A sus socios o miembros, pero solo si carecen de personalidad jurídica propia."
  - id: c
    correct: true
    text:
      es: "A sus socios o miembros."
  - id: d
    text:
      es: "A los contribuyentes que hayan sido sustituidos por la propia entidad."
  explanation:
    es: "La letra e del artículo 181.1 LGT incluye a las entidades obligadas a imputar o atribuir rentas a sus socios o miembros, sin añadir el requisito de que carezcan de personalidad jurídica. La atribución no es a la Administración ni a contribuyentes sustituidos."
  citation: "art. 181.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
