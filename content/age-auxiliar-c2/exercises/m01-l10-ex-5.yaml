    es: "La selección sigue un sistema de rotación estrictamente igual entre los Estados miembros. El Parlamento no elige a cada miembro, solo aprueba colegiadamente la Comisión. El Presidente tampoco los designa libremente y el artículo no prevé sorteo alguno."
