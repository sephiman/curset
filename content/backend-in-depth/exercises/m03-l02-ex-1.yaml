  - id: d
    text:
      en: '`LongAdder`'
  explanation:
    en: '`AtomicStampedReference` associates an integer value with a reference. `AtomicMarkableReference` is wrong,
      because it associates a single boolean with a reference. `AtomicReferenceFieldUpdater` is wrong, because it
      is a reflection-based utility for atomic updates to designated volatile reference fields. `LongAdder` is wrong,
      because it maintains an initially zero long sum across one or more variables.'
