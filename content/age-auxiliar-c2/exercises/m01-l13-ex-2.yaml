# anchor: boe-a-2015-11719-art-62
- id: m01-l13-q170
  prompt:
    es: "Según el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el acto de acatamiento que se exige para adquirir la condición de funcionario de carrera comprende:"
  options:
  - id: a
    text:
      es: "La Constitución y las leyes aprobadas por las Cortes Generales, pero no el Estatuto de Autonomía correspondiente."
  - id: b
    text:
      es: "La Constitución, el Estatuto de Autonomía correspondiente y el código de conducta de los empleados públicos."
  - id: c
    correct: true
    text:
      es: "La Constitución y, en su caso, el Estatuto de Autonomía correspondiente y el resto del Ordenamiento Jurídico."
  - id: d
    text:
      es: "La Constitución y los tratados de la Unión Europea, pero no el resto del Ordenamiento Jurídico."
  explanation:
    es: "El artículo 62.1.c) exige el «acto de acatamiento de la Constitución y, en su caso, del Estatuto de Autonomía correspondiente y del resto del Ordenamiento Jurídico». Las leyes de las Cortes Generales sin el Estatuto dejan fuera el Estatuto, que la letra c) incluye «en su caso». Añadir el código de conducta cambia el objeto del acatamiento: la letra c) habla del Ordenamiento Jurídico, y el código de conducta es un conjunto de principios del Estatuto, no un objeto de acatamiento. Los tratados de la Unión Europea sin el resto del Ordenamiento contradicen «y del resto del Ordenamiento Jurídico»."
  citation: "art. 62.1.c) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-11719-art-62
- id: m01-l13-q171
  prompt:
    es: "De acuerdo con el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la condición de funcionario de carrera se adquiere cumpliendo sus requisitos:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma sucesiva, en el orden en que el artículo los enumera."
  - id: b
    text:
      es: "De forma simultánea, en un único acto de nombramiento y toma de posesión."
  - id: c
    text:
      es: "En el orden que fije cada convocatoria, aunque altere el del artículo."
  - id: d
    text:
      es: "En cualquier orden, siempre que todos se cumplan dentro del mismo año."
  explanation:
    es: "El artículo 62.1 habla del «cumplimiento sucesivo» de cuatro requisitos: superación del proceso selectivo, nombramiento, acatamiento y toma de posesión. Se cumplen uno tras otro. La opción del acto único los hace simultáneos. La de la convocatoria deja el orden en manos de cada proceso, y el artículo no lo permite. La del mismo año admite cualquier orden y añade un límite que el artículo no fija."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-62
- id: m01-l13-q172
  prompt:
    es: "Según el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en el cumplimiento sucesivo de los requisitos, el acto de acatamiento de la Constitución se sitúa:"
  options:
  - id: a
    text:
      es: "Antes de la superación del proceso selectivo, al presentar la solicitud."
  - id: b
    text:
      es: "Entre la superación del proceso selectivo y el nombramiento."
  - id: c
    text:
      es: "Después de la toma de posesión, ya como funcionario de carrera."
  - id: d
    correct: true
    text:
      es: "Entre el nombramiento y la toma de posesión dentro de plazo."
  explanation:
    es: "El artículo 62.1 enumera los requisitos en este orden: superación del proceso selectivo, nombramiento, acto de acatamiento y toma de posesión. El acatamiento es el tercero, entre el nombramiento y la toma de posesión. La opción de la solicitud y la que lo sitúa antes del nombramiento lo adelantan. La que lo pone después de la toma de posesión lo retrasa, y la toma de posesión es el último requisito."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2023-25758-art-114
- id: m01-l13-q182
  prompt:
    es: "Señale la respuesta correcta sobre los plazos de toma de posesión del artículo 114.12 del Real Decreto-ley 6/2023, de 19 de diciembre:"
  options:
  - id: a
    correct: true
    text:
      es: "Con cambio de localidad de residencia, el funcionario de carrera dispone de un mes."
  - id: b
    text:
      es: "El funcionario interino dispone de quince días naturales desde la publicación del nombramiento."
  - id: c
    text:
      es: "El personal eventual dispone de un mes si el nombramiento supone cambio de residencia."
  - id: d
    text:
      es: "El funcionario de carrera dispone de quince días desde la notificación personal del nombramiento."
  explanation:
    es: "El artículo 114.12 da al funcionario de carrera quince días naturales desde la publicación del nombramiento, «que será de un mes cuando suponga cambio de localidad de residencia». El interino y el eventual toman posesión al día siguiente al del nombramiento, sin plazo de quince días ni de un mes. La opción de la notificación personal cambia el día inicial: el plazo corre desde la publicación."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-67
- id: m01-l13-q191
  prompt:
    es: "Según el artículo 67.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la jubilación de los funcionarios podrá ser:"
  options:
  - id: a
    correct: true
    text:
      es: "Voluntaria, forzosa o por incapacidad permanente para las funciones de su cuerpo o escala."
  - id: b
    text:
      es: "Voluntaria o forzosa; la incapacidad permanente lleva a la excedencia forzosa."
  - id: c
    text:
      es: "Forzosa o por incapacidad permanente; la voluntaria solo cabe en cuerpos con normas específicas."
  - id: d
    text:
      es: "Voluntaria, forzosa o anticipada por reasignación de efectivos."
  explanation:
    es: "El artículo 67.1 TREBEP dice que la jubilación puede ser voluntaria, a solicitud del funcionario; forzosa, al cumplir la edad legal; o por incapacidad permanente para las funciones de su cuerpo o escala. La opción que manda la incapacidad a la excedencia forzosa suprime la tercera clase, que la letra c) recoge. La que limita la voluntaria a ciertos cuerpos contradice el apartado 2, que la admite siempre que el funcionario reúna los requisitos del régimen de Seguridad Social aplicable. La jubilación anticipada por reasignación de efectivos no es ninguna de las tres clases de las letras a), b) y c)."
  citation: "art. 67.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m01-l13-q192
  prompt:
    es: "De las clases de jubilación que pueden corresponder a un funcionario de carrera, la jubilación forzosa es la que se produce:"
  options:
  - id: a
    correct: true
    text:
      es: "Al cumplir el funcionario la edad legalmente establecida."
  - id: b
    text:
      es: "A solicitud del funcionario que reúna los requisitos de su régimen."
  - id: c
    text:
      es: "Por la declaración de incapacidad permanente para su cuerpo o escala."
  - id: d
    text:
      es: "Por la imposición firme de la sanción de separación del servicio."
  explanation:
    es: "El artículo 67.1.b) TREBEP define la jubilación forzosa como la que se produce «al cumplir la edad legalmente establecida». La solicitud del funcionario es la jubilación voluntaria. La incapacidad permanente es la tercera clase del mismo apartado. La separación firme del servicio es una sanción y una causa de pérdida distinta."
  citation: "art. 67.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m01-l13-q193
  prompt:
    es: "De acuerdo con el artículo 67.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la jubilación voluntaria procede, a solicitud del interesado, siempre que el funcionario:"
  options:
  - id: a
    text:
      es: "Cuente con informe favorable de la unidad de personal de su departamento."
  - id: b
    text:
      es: "Haya cumplido sesenta y cinco años, sea cual sea su régimen de Seguridad Social."
  - id: c
    text:
      es: "Justifique ante su departamento que su jubilación no perjudica las necesidades del servicio."
  - id: d
    correct: true
    text:
      es: "Reúna los requisitos y condiciones del Régimen de Seguridad Social que le sea aplicable."
  explanation:
    es: "El artículo 67.2 dice que procede la jubilación voluntaria «siempre que el funcionario reúna los requisitos y condiciones establecidos en el Régimen de Seguridad Social que le sea aplicable». El informe de la unidad de personal y las necesidades del servicio no figuran en el artículo. La edad de sesenta y cinco años para cualquier régimen sustituye la remisión al régimen de cada funcionario por una edad única."
  citation: "art. 67.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-205
- id: m01-l13-q200
  prompt:
    es: "Según el artículo 205.1.a) del texto refundido de la Ley General de la Seguridad Social, aplicable desde 2027, la pensión de jubilación del Régimen General exige haber cumplido:"
  options:
  - id: a
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y cinco años cotizados."
  - id: b
    text:
      es: "Sesenta y cinco años, o sesenta y tres con treinta y ocho años y seis meses cotizados."
  - id: c
    correct: true
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y ocho años y seis meses cotizados."
  - id: d
    text:
      es: "Sesenta y seis años, o sesenta y cuatro con treinta y siete años cotizados."
  explanation:
    es: "El artículo 205.1.a) LGSS exige «Haber cumplido sesenta y siete años de edad, o sesenta y cinco años cuando se acrediten treinta y ocho años y seis meses de cotización», y la disposición transitoria séptima aplica esas cifras desde 2027. Es la edad a la que remite el artículo 67.4 TREBEP para el funcionario del Régimen General. Las otras tres opciones cambian la edad o los años cotizados."
  citation: "art. 205.1.a) LGSS"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1984-17387-art-33
- id: m01-l13-q201
  prompt:
    es: "Según el artículo 33 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, si el funcionario prolonga voluntariamente su permanencia en servicio activo, la declaración de jubilación forzosa:"
  options:
  - id: a
    text:
      es: "Se produce a los sesenta y cinco años, aunque siga prestando servicios."
  - id: b
    correct: true
    text:
      es: "No se produce hasta que cese en el servicio activo, como máximo a los setenta años."
  - id: c
    text:
      es: "No se produce hasta que cese en el servicio activo, sin límite de edad."
  - id: d
    text:
      es: "No se produce hasta que cese en el servicio activo, como máximo a los setenta y dos años."
  explanation:
    es: "El artículo 33 Ley 30/1984 dice que la declaración de jubilación forzosa «no se producirá hasta el momento en que los funcionarios cesen en la situación de servicio activo», cuando voluntariamente prolonguen su permanencia «hasta, como máximo, los setenta años de edad». La declaración a los sesenta y cinco años ignora la prolongación. La opción sin límite de edad suprime el máximo. La de setenta y dos años lo altera."
  citation: "art. 33 Ley 30/1984"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1984-17387-art-33
- id: m01-l13-q202
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, quedan exceptuados de la prolongación voluntaria en servicio activo:"
  options:
  - id: a
    text:
      es: "Los funcionarios con más de cuarenta años de servicios efectivos."
  - id: b
    correct: true
    text:
      es: "Los funcionarios de cuerpos y escalas con normas específicas de jubilación."
  - id: c
    text:
      es: "Los funcionarios que desempeñen puestos de libre designación."
  - id: d
    text:
      es: "Los funcionarios que hayan sido sancionados por falta grave."
  explanation:
    es: "El artículo 33 Ley 30/1984 exceptúa «los funcionarios de aquellos cuerpos y escalas que tengan normas específicas de jubilación». Los años de servicios, la libre designación y las sanciones por falta grave no figuran en el artículo."
  citation: "art. 33 Ley 30/1984"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1984-17387-art-33
- id: m01-l13-q203
  prompt:
    es: "Según la nota del BOE al artículo 33 de la Ley 30/1984, de 2 de agosto, ese artículo, derogado por la disposición derogatoria única del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Quedó sin efecto el día en que entró en vigor el Estatuto, sin régimen transitorio."
  - id: b
    text:
      es: "Se mantiene vigente aunque se oponga al Estatuto, hasta que se dicten las Leyes de Función Pública."
  - id: c
    correct: true
    text:
      es: "Se mantiene vigente en tanto no se oponga al Estatuto, hasta que se dicten las Leyes de Función Pública."
  - id: d
    text:
      es: "Se mantiene vigente solo para el personal docente e investigador, en tanto no se oponga al Estatuto."
  explanation:
    es: "La nota del BOE al artículo 33 dice que el artículo, derogado por la disposición derogatoria única.b) del Estatuto, «se mantendrá vigente en tanto no se oponga a lo establecido en el mismo» hasta que se dicten las Leyes de Función Pública y las normas reglamentarias de desarrollo. La opción de la pérdida inmediata de efecto ignora esa vigencia. La de la vigencia aunque se oponga suprime el límite «en tanto no se oponga». La del personal docente restringe a un colectivo una vigencia que la nota no restringe."
  citation: "art. 33 Ley 30/1984"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m01-l13-q205
  prompt:
    es: "Señale la respuesta correcta sobre la jubilación según el artículo 67 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "La jubilación forzosa se declara a solicitud del funcionario que cumple sesenta y cinco años."
  - id: b
    text:
      es: "La prolongación en el servicio activo se concede siempre que el funcionario la solicite."
  - id: c
    correct: true
    text:
      es: "Puede deberse a la declaración de incapacidad permanente para las funciones propias de su cuerpo o escala."
  - id: d
    text:
      es: "Los funcionarios con normas estatales específicas de jubilación pueden prolongar hasta los setenta años."
  explanation:
    es: "El artículo 67.1.c) admite la jubilación «Por la declaración de incapacidad permanente para el ejercicio de las funciones propias de su cuerpo o escala». La jubilación forzosa se declara de oficio, no a solicitud (art. 67.3). La prolongación exige una resolución motivada que puede denegarla. Los funcionarios con normas estatales específicas de jubilación quedan excluidos de la prolongación."
  citation: "art. 67.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
