# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q038
  prompt:
    es: "Según el artículo 148.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias relativas a los montes pueden asumir las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "La legislación básica sobre montes y aprovechamientos forestales."
  - id: b
    text:
      es: "La legislación básica sobre vías pecuarias y aprovechamientos forestales."
  - id: c
    correct: true
    text:
      es: "Los montes y aprovechamientos forestales."
  - id: d
    text:
      es: "La legislación sobre montes, aprovechamientos forestales y vías pecuarias."
  explanation:
    es: "El artículo 148.1.8.ª incluye entre las materias que pueden asumir las Comunidades «los montes y aprovechamientos forestales». La legislación básica sobre montes, aprovechamientos forestales y vías pecuarias es competencia exclusiva del Estado (art. 149.1.23.ª). La legislación sobre montes, aprovechamientos forestales y vías pecuarias tampoco es materia de la lista del 148.1."
  citation: "art. 148.1.8.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q039
  prompt:
    es: "De acuerdo con el artículo 149.1 de la Constitución Española de 1978, el Estado tiene competencia exclusiva sobre la siguiente materia:"
  options:
  - id: a
    correct: true
    text:
      es: "Tráfico y circulación de vehículos a motor; correos y telecomunicaciones."
  - id: b
    text:
      es: "Las carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  - id: c
    text:
      es: "Los puertos de refugio y los puertos y aeropuertos deportivos."
  - id: d
    text:
      es: "La coordinación y demás facultades en relación con las policías locales."
  explanation:
    es: "El artículo 149.1.21.ª atribuye al Estado en exclusiva el «tráfico y circulación de vehículos a motor; correos y telecomunicaciones». Las carreteras con itinerario íntegro en la Comunidad (art. 148.1.5.ª), los puertos de refugio y deportivos (art. 148.1.6.ª) y la coordinación de las policías locales (art. 148.1.22.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q040
  prompt:
    es: "¿A quién atribuye la Constitución Española de 1978 la competencia sobre el tráfico y la circulación de vehículos a motor?"
  options:
  - id: a
    text:
      es: "A las Comunidades Autónomas que la asuman en sus Estatutos."
  - id: b
    correct: true
    text:
      es: "Al Estado, como competencia exclusiva."
  - id: c
    text:
      es: "Al Estado la legislación básica y a las Comunidades Autónomas su desarrollo."
  - id: d
    text:
      es: "A las Comunidades Autónomas, dentro de su territorio, en todo caso."
  explanation:
    es: "El artículo 149.1.21.ª pone el «tráfico y circulación de vehículos a motor» entre las materias de competencia exclusiva del Estado. No está en la lista del artículo 148.1, así que no es materia que asuman las Comunidades por su Estatuto. El artículo no la divide en bases estatales y desarrollo autonómico."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q041
  prompt:
    es: "De acuerdo con el artículo 148.1 de la Constitución Española de 1978, en materia de medio ambiente las Comunidades Autónomas podrán asumir competencias sobre:"
  options:
  - id: a
    text:
      es: "La legislación básica sobre protección del medio ambiente."
  - id: b
    text:
      es: "La legislación básica y la gestión en materia de protección del medio ambiente."
  - id: c
    correct: true
    text:
      es: "La gestión en materia de protección del medio ambiente."
  - id: d
    text:
      es: "La legislación exclusiva sobre protección del medio ambiente en su territorio."
  explanation:
    es: "El artículo 148.1.9.ª incluye «la gestión en materia de protección del medio ambiente». La legislación básica sobre protección del medio ambiente es competencia exclusiva del Estado (art. 149.1.23.ª), así que no vale ninguna respuesta que la incluya. Las Comunidades pueden establecer normas adicionales de protección, pero no tienen una legislación exclusiva."
  citation: "art. 148.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q042
  prompt:
    es: "¿Qué facultad reserva la Constitución Española de 1978 a las Comunidades Autónomas frente a la legislación básica del Estado sobre protección del medio ambiente?"
  options:
  - id: a
    text:
      es: "La de dejar sin efecto la legislación básica estatal en su territorio."
  - id: b
    text:
      es: "La de dictar la legislación básica cuando el Estado no la haya aprobado."
  - id: c
    text:
      es: "La de sustituir la legislación básica estatal por normas propias de igual protección."
  - id: d
    correct: true
    text:
      es: "La de establecer normas adicionales de protección."
  explanation:
    es: "El artículo 149.1.23.ª atribuye al Estado la «legislación básica sobre protección del medio ambiente, sin perjuicio de las facultades de las Comunidades Autónomas de establecer normas adicionales de protección». Las Comunidades añaden protección; no desplazan, suplen ni sustituyen la legislación básica, que es competencia exclusiva del Estado."
  citation: "art. 149.1.23.ª CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q043
  prompt:
    es: "¿Cuál de las siguientes competencias en materia de ferrocarriles pueden asumir las Comunidades Autónomas según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Los ferrocarriles cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  - id: b
    text:
      es: "Los ferrocarriles que transcurran por el territorio de más de una Comunidad Autónoma."
  - id: c
    text:
      es: "Los ferrocarriles de interés general, aunque su itinerario discurra por varias Comunidades."
  - id: d
    text:
      es: "Los ferrocarriles cuyo itinerario se desarrolle mayoritariamente en el territorio de la Comunidad Autónoma."
  explanation:
    es: "El artículo 148.1.5.ª incluye «los ferrocarriles y carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma». Los ferrocarriles que transcurren por más de una Comunidad son competencia exclusiva del Estado (art. 149.1.21.ª). El itinerario debe ser íntegro, no mayoritario."
  citation: "art. 148.1.5.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q044
  prompt:
    es: "Entre las materias que la Constitución Española de 1978 atribuye al Estado como competencia exclusiva se encuentra:"
  options:
  - id: a
    text:
      es: "La promoción y ordenación del turismo en el ámbito territorial de la Comunidad."
  - id: b
    correct: true
    text:
      es: "El régimen de producción, comercio, tenencia y uso de armas y explosivos."
  - id: c
    text:
      es: "La pesca en aguas interiores, el marisqueo y la acuicultura."
  - id: d
    text:
      es: "La artesanía y las ferias interiores de la Comunidad Autónoma."
  explanation:
    es: "El artículo 149.1.26.ª atribuye al Estado en exclusiva el «régimen de producción, comercio, tenencia y uso de armas y explosivos». El turismo en su ámbito territorial (art. 148.1.18.ª), la pesca en aguas interiores, el marisqueo y la acuicultura (148.1.11.ª), la artesanía (148.1.14.ª) y las ferias interiores (148.1.12.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.26.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q045
  prompt:
    es: "Según el artículo 149.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias pertenece a la competencia exclusiva del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Legislación sobre propiedad intelectual e industrial."
  - id: b
    text:
      es: "Fomento de la cultura y de la investigación de la Comunidad Autónoma."
  - id: c
    text:
      es: "Patrimonio monumental de interés de la Comunidad Autónoma."
  - id: d
    text:
      es: "Ordenación del territorio, urbanismo y vivienda."
  explanation:
    es: "El artículo 149.1.9.ª reserva al Estado la «legislación sobre propiedad intelectual e industrial». El fomento de la cultura y de la investigación (art. 148.1.17.ª), el patrimonio monumental de interés de la Comunidad (148.1.16.ª) y la ordenación del territorio, urbanismo y vivienda (148.1.3.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q047
  prompt:
    es: "De acuerdo con el artículo 148.2 de la Constitución Española de 1978, las Comunidades Autónomas podrán ampliar sucesivamente sus competencias dentro del marco establecido en el artículo 149:"
  options:
  - id: a
    text:
      es: "Transcurridos tres años y mediante la reforma de sus Estatutos."
  - id: b
    correct: true
    text:
      es: "Transcurridos cinco años y mediante la reforma de sus Estatutos."
  - id: c
    text:
      es: "Transcurridos cinco años y mediante acuerdo de su Asamblea Legislativa."
  - id: d
    text:
      es: "Transcurridos diez años y mediante la reforma de sus Estatutos."
  explanation:
    es: "El artículo 148.2 dice: «Transcurridos cinco años, y mediante la reforma de sus Estatutos, las Comunidades Autónomas podrán ampliar sucesivamente sus competencias». Tres y diez años no son el plazo del artículo. Basta el paso del tiempo, pero la ampliación exige reformar el Estatuto, no un acuerdo de la Asamblea."
  citation: "art. 148.2 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q048
  prompt:
    es: "Señale la respuesta correcta sobre las materias no atribuidas expresamente al Estado y las no asumidas por los Estatutos, conforme a la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Las materias no atribuidas expresamente al Estado corresponderán en todo caso a las Comunidades Autónomas."
  - id: b
    text:
      es: "La competencia sobre las materias no asumidas por los Estatutos corresponderá a las Comunidades Autónomas."
  - id: c
    text:
      es: "Las normas autonómicas prevalecerán siempre, en caso de conflicto, sobre las del Estado."
  - id: d
    correct: true
    text:
      es: "El derecho estatal será, en todo caso, supletorio del derecho de las Comunidades Autónomas."
  explanation:
    es: "El artículo 149.3 dice: «El derecho estatal será, en todo caso, supletorio del derecho de las Comunidades Autónomas». Las materias no atribuidas al Estado «podrán corresponder» a las Comunidades en virtud de sus Estatutos, no en todo caso. Las no asumidas por los Estatutos corresponden al Estado. En caso de conflicto prevalecen las normas del Estado en todo lo que no sea competencia exclusiva de las Comunidades."
  citation: "art. 149.3 CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q049
  prompt:
    es: "De acuerdo con el artículo 150.1 de la Constitución Española de 1978, en cada ley marco por la que las Cortes atribuyen a las Comunidades la facultad de dictar normas legislativas se establecerá:"
  options:
  - id: a
    text:
      es: "La correspondiente transferencia de medios financieros y las formas de control que se reserve el Estado."
  - id: b
    correct: true
    text:
      es: "La modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas."
  - id: c
    text:
      es: "El control del Gobierno, previo dictamen del Consejo de Estado, sobre estas normas legislativas."
  - id: d
    text:
      es: "La apreciación de su necesidad por las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.1 dice que «en cada ley marco se establecerá la modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas». La transferencia de medios financieros y las formas de control del Estado son de la ley orgánica de transferencia o delegación (art. 150.2). El control del Gobierno con dictamen del Consejo de Estado se refiere a las funciones delegadas (art. 153.b). La apreciación por mayoría absoluta de cada Cámara es de las leyes de armonización (art. 150.3)."
  citation: "art. 150.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q050
  prompt:
    es: "Según la Constitución Española de 1978, ¿mediante qué norma puede el Estado transferir o delegar en las Comunidades Autónomas facultades de materia de titularidad estatal?"
  options:
  - id: a
    text:
      es: "Mediante ley ordinaria, que preverá la transferencia de medios financieros y las formas de control."
  - id: b
    text:
      es: "Mediante ley marco, que fijará los principios, bases y directrices de la legislación autonómica."
  - id: c
    correct: true
    text:
      es: "Mediante ley orgánica, que preverá la transferencia de medios financieros y las formas de control."
  - id: d
    text:
      es: "Mediante real decreto del Gobierno, previo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 150.2 dice que el Estado podrá transferir o delegar «mediante ley orgánica» y que «la ley preverá en cada caso la correspondiente transferencia de medios financieros, así como las formas de control que se reserve el Estado». No basta una ley ordinaria. La ley marco del artículo 150.1 atribuye facultades legislativas, no transfiere ni delega. Un real decreto no es la norma que exige el artículo."
  citation: "art. 150.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
