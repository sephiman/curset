# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0045
  prompt:
    es: "Según el artículo 220.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el órgano u organismo que hubiera dictado el acto rectifica en cualquier momento, de oficio o a instancia del interesado, los errores:"
  options:
  - id: a
    text:
      es: "Formales, de procedimiento o de competencia."
  - id: b
    text:
      es: "Materiales, de interpretación o de calificación."
  - id: c
    correct: true
    text:
      es: "Materiales, de hecho o aritméticos."
  - id: d
    text:
      es: "De derecho, de hecho o aritméticos."
  explanation:
    es: "El artículo 220.1 limita la rectificación a los errores materiales, de hecho o aritméticos. Los errores de derecho, de interpretación, de calificación jurídica o de procedimiento no se corrigen por este procedimiento."
  citation: "art. 220.1 LGT"
  difficulty: 1
  tags:
  - "rectificación"
  - "errores"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0046
  prompt:
    es: "¿Hasta cuándo puede rectificarse un error material, de hecho o aritmético según el artículo 220.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Dentro de los cuatro años siguientes a la notificación del acto."
  - id: b
    text:
      es: "Mientras el acto no haya adquirido firmeza en vía administrativa."
  - id: c
    correct: true
    text:
      es: "En cualquier momento, siempre que no hubiera transcurrido el plazo de prescripción."
  - id: d
    text:
      es: "Dentro del mes siguiente a la notificación del acto, como el recurso de reposición."
  explanation:
    es: "La rectificación puede hacerse en cualquier momento, con el único límite de la prescripción (art. 220.1). El mes es el plazo de la reposición, los cuatro años son los de la lesividad y la firmeza no limita la rectificación."
  citation: "art. 220.1 LGT"
  difficulty: 1
  tags:
  - "rectificación"
  - "límite"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0047
  prompt:
    es: "Conforme al artículo 220.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué órgano rectifica los errores del acto o de la resolución de la reclamación?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, en el ámbito de competencias del Estado, previo dictamen del Consejo de Estado."
  - id: b
    correct: true
    text:
      es: "El órgano u organismo que hubiera dictado el acto o la resolución de la reclamación."
  - id: c
    text:
      es: "El superior jerárquico del órgano que hubiera dictado el acto."
  - id: d
    text:
      es: "El Tribunal Económico-Administrativo Central, en todo caso."
  explanation:
    es: "Rectifica el mismo órgano u organismo que dictó el acto o resolvió la reclamación (art. 220.1). El superior jerárquico y el Ministro intervienen en otros procedimientos (nulidad, lesividad). El tribunal central solo rectifica sus propias resoluciones."
  citation: "art. 220.1 LGT"
  difficulty: 2
  tags:
  - "rectificación"
  - "órgano"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0048
  prompt:
    es: "De acuerdo con el artículo 220.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se rectifican en particular por el procedimiento de rectificación de errores los actos y resoluciones en los que se hubiera incurrido en error de hecho que resulte de:"
  options:
  - id: a
    text:
      es: "Las alegaciones formuladas por el interesado."
  - id: b
    text:
      es: "Los criterios de los tribunales económico-administrativos."
  - id: c
    text:
      es: "La interpretación de la norma aplicable al caso."
  - id: d
    correct: true
    text:
      es: "Los propios documentos incorporados al expediente."
  explanation:
    es: "El error de hecho que se rectifica en particular es el que resulta de los propios documentos del expediente. Las alegaciones del interesado, los criterios de los tribunales o la interpretación de una norma no son su fuente."
  citation: "art. 220.1 LGT"
  difficulty: 2
  tags:
  - "rectificación"
  - "errores"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0049
  prompt:
    es: "Julia Ferrer Ruiz solicita el 4 de mayo de 2026 la rectificación de un error aritmético de su liquidación. El plazo se cuenta de fecha a fecha, sin festivos que lo alteren. El 5 de noviembre de 2026 no se le ha notificado resolución expresa. Según el artículo 220.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es el efecto?"
  options:
  - id: a
    text:
      es: "Su solicitud se estima por silencio administrativo."
  - id: b
    correct: true
    text:
      es: "Su solicitud se desestima por silencio administrativo."
  - id: c
    text:
      es: "El procedimiento caduca y debe presentar una nueva solicitud."
  - id: d
    text:
      es: "El error se entiende rectificado de oficio por la Administración."
  explanation:
    es: "El plazo es de seis meses desde la presentación y terminó el 4 de noviembre de 2026 (art. 220.2). Al ser un procedimiento iniciado a instancia del interesado, la solicitud se desestima por silencio. La caducidad es el efecto en los iniciados de oficio. El silencio no es estimatorio ni rectifica el error."
  citation: "art. 220.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "rectificación"
  - "cómputo"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0050
  prompt:
    es: "Conforme al artículo 220.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las resoluciones que se dicten en el procedimiento de rectificación de errores son susceptibles de:"
  options:
  - id: a
    text:
      es: "Recurso de alzada ordinario ante el Tribunal Económico-Administrativo Central."
  - id: b
    text:
      es: "Recurso extraordinario de revisión únicamente."
  - id: c
    correct: true
    text:
      es: "Recurso de reposición y de reclamación económico-administrativa."
  - id: d
    text:
      es: "Recurso contencioso-administrativo, al poner fin a la vía administrativa."
  explanation:
    es: "El artículo 220.3 admite reposición y reclamación económico-administrativa contra la resolución de rectificación. No cabe alzada ordinario, que va contra resoluciones de tribunales regionales y locales. Y no ponen fin a la vía administrativa, a diferencia de las de la revocación."
  citation: "art. 220.3 LGT"
  difficulty: 1
  tags:
  - "rectificación"
  - "recursos"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0052
  prompt:
    es: "Iván Mora Pardo ingresó el 10 de abril de 2026 una liquidación y, por error, volvió a pagar el mismo importe el 14 de abril. Según el artículo 221.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué procedimiento especial de revisión corresponde para recuperar el segundo pago?"
  options:
  - id: a
    text:
      es: "El de rectificación de errores del artículo 220, porque el error del pago es material."
  - id: b
    correct: true
    text:
      es: "El de devolución de ingresos indebidos, por duplicidad en el pago."
  - id: c
    text:
      es: "El de declaración de lesividad del artículo 218."
  - id: d
    text:
      es: "El de revocación del artículo 219."
  explanation:
    es: "Un doble pago de una deuda tributaria es el primer supuesto del artículo 221.1, la duplicidad en el pago, y da lugar al procedimiento de devolución de ingresos indebidos. La rectificación corrige errores del acto, no un pago duplicado. La lesividad y la revocación operan sobre actos de la Administración."
  citation: "art. 221.1.a LGT"
  difficulty: 1
  tags:
  - "supuesto"
  - "devolución"
  - "duplicidad"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0053
  prompt:
    es: "De acuerdo con el artículo 221.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, procede iniciar el procedimiento de devolución de ingresos indebidos cuando la cantidad pagada haya sido superior al importe a ingresar resultante de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un acto administrativo o de una autoliquidación."
  - id: b
    text:
      es: "Una sentencia o de un acuerdo de aplazamiento."
  - id: c
    text:
      es: "Un recargo o de un interés de demora."
  - id: d
    text:
      es: "Una propuesta de liquidación o de un acta de conformidad."
  explanation:
    es: "El supuesto de la letra b) es el pago superior al importe resultante de un acto administrativo o de una autoliquidación. Las sentencias, los aplazamientos, los recargos, las propuestas y las actas no figuran como referencia en ese supuesto."
  citation: "art. 221.1.b LGT"
  difficulty: 1
  tags:
  - "devolución"
  - "supuestos"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0054
  prompt:
    es: "Respecto al procedimiento de devolución de ingresos indebidos del artículo 221.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se devuelven las cantidades satisfechas en la regularización voluntaria del artículo 252 solo si no ha prescrito la deuda."
  - id: b
    correct: true
    text:
      es: "En ningún caso se devuelven las cantidades satisfechas en la regularización voluntaria del artículo 252."
  - id: c
    text:
      es: "Siempre se devuelven las cantidades satisfechas en la regularización voluntaria del artículo 252, con intereses."
  - id: d
    text:
      es: "Se devuelven las cantidades satisfechas en la regularización voluntaria del artículo 252 si el interesado lo solicita en el plazo de un mes."
  explanation:
    es: "La letra c) del artículo 221.1 incluye ingresos hechos tras la prescripción, pero excluye en todo caso las cantidades satisfechas en la regularización voluntaria del artículo 252. Esa exclusión no admite excepciones por solicitud ni por plazo."
  citation: "art. 221.1.c LGT"
  difficulty: 3
  tags:
  - "devolución"
  - "prescripción"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0055
  prompt:
    es: "Según el artículo 221.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de devolución de ingresos indebidos se inicia de oficio o a instancia del interesado cuando así lo establezca:"
  options:
  - id: a
    text:
      es: "Una resolución del Tribunal Económico-Administrativo Central."
  - id: b
    text:
      es: "El criterio de la Dirección General de Tributos."
  - id: c
    text:
      es: "Un acuerdo entre la Administración y el obligado tributario."
  - id: d
    correct: true
    text:
      es: "La normativa tributaria."
  explanation:
    es: "La letra d) remite a lo que establezca la normativa tributaria. Una resolución del tribunal central, un criterio de la Dirección General de Tributos o un acuerdo con el obligado no abren por sí solos este procedimiento."
  citation: "art. 221.1.d LGT"
  difficulty: 1
  tags:
  - "devolución"
  - "supuestos"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0056
  prompt:
    es: "Cuando el acto por el que se realizó el ingreso indebido ha adquirido firmeza, el artículo 221.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria solo permite pedir la devolución instando su revisión. ¿Cuál de los siguientes procedimientos puede instarse con ese fin?"
  options:
  - id: a
    text:
      es: "La declaración de lesividad del acto firme."
  - id: b
    text:
      es: "El recurso de reposición contra el acto firme."
  - id: c
    correct: true
    text:
      es: "La revocación del acto por el órgano competente."
  - id: d
    text:
      es: "La reclamación económico-administrativa en primera instancia."
  explanation:
    es: "El artículo 221.3 remite a los procedimientos especiales de las letras a), c) y d) del artículo 216 (nulidad, revocación y rectificación de errores) y al recurso extraordinario de revisión. La lesividad es la letra b), que no está. La reposición y la reclamación son medios contra actos no firmes."
  citation: "art. 221.3 LGT"
  difficulty: 3
  tags:
  - "devolución"
  - "firmeza"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0057
  prompt:
    es: "Conforme al artículo 221.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando un obligado tributario considera que la presentación de una autoliquidación ha dado lugar a un ingreso indebido, puede:"
  options:
  - id: a
    text:
      es: "Pedir la declaración de lesividad de la autoliquidación presentada."
  - id: b
    correct: true
    text:
      es: "Instar la rectificación de la autoliquidación de acuerdo con el artículo 120.3."
  - id: c
    text:
      es: "Solicitar la revocación de la autoliquidación ante el órgano que la recibió."
  - id: d
    text:
      es: "Interponer directamente reclamación económico-administrativa contra la autoliquidación."
  explanation:
    es: "El artículo 221.4 remite a la rectificación de la autoliquidación del artículo 120.3. No prevé reclamación directa, ni revocación ni lesividad de una autoliquidación."
  citation: "art. 221.4 LGT"
  difficulty: 2
  tags:
  - "devolución"
  - "autoliquidación"
# anchor: boe-a-2003-23186-art-221
- id: m03-l14-q0059
  prompt:
    es: "De acuerdo con el artículo 221.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las resoluciones que se dicten en el procedimiento de devolución de ingresos indebidos son susceptibles de:"
  options:
  - id: a
    text:
      es: "Recurso de alzada ordinario ante el Tribunal Económico-Administrativo Central."
  - id: b
    correct: true
    text:
      es: "Recurso de reposición y de reclamación económico-administrativa."
  - id: c
    text:
      es: "Recurso extraordinario para la unificación de doctrina."
  - id: d
    text:
      es: "Recurso de anulación ante el órgano que dictó el acto."
  explanation:
    es: "El artículo 221.6 prevé reposición y reclamación económico-administrativa, igual que en la rectificación de errores. El alzada ordinario, el recurso de unificación de doctrina y el de anulación son recursos económico-administrativos con presupuestos distintos."
  citation: "art. 221.6 LGT"
  difficulty: 1
  tags:
  - "devolución"
  - "recursos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0060
  prompt:
    es: "Según los artículos 217.6, 218.3, 219.4 y 220.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuál de los procedimientos especiales de revisión el plazo máximo para notificar resolución es de un año?"
  options:
  - id: a
    text:
      es: "En la rectificación de errores."
  - id: b
    correct: true
    text:
      es: "En la declaración de nulidad de pleno derecho."
  - id: c
    text:
      es: "En la revocación."
  - id: d
    text:
      es: "En la declaración de lesividad."
  explanation:
    es: "La nulidad de pleno derecho es el procedimiento con plazo de un año (art. 217.6). La lesividad caduca a los tres meses (art. 218.3). La revocación y la rectificación tienen seis meses (arts. 219.4 y 220.2)."
  citation: "art. 217.6 LGT"
  difficulty: 2
  tags:
  - "plazos"
  - "comparación"
