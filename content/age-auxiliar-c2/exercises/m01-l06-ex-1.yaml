    es: "Señale qué reúne el quinto eje del IV Plan de Gobierno Abierto de España 2020-2024, que se recoge en el compromiso diez de ese Plan:"
  options:
  - id: a
    correct: true
    text:
      es: "Las iniciativas de las Comunidades y Ciudades Autónomas y de la FEMP."
  - id: b
    text:
      es: "Las iniciativas de los ministerios y de los organismos públicos de la Administración General del Estado."
  - id: c
    text:
      es: "Las propuestas de las organizaciones de la sociedad civil del Foro de Gobierno Abierto."
  - id: d
    text:
      es: "Las iniciativas de las Cortes Generales y de los órganos constitucionales."
  explanation:
    es: "El quinto eje recoge, en el compromiso diez, las iniciativas de las Comunidades y Ciudades Autónomas y de la FEMP. Los ministerios y los organismos de la Administración General del Estado figuran en los compromisos de los primeros ejes. Las propuestas de la sociedad civil son el origen de los cuatro primeros ejes, no el contenido del quinto. Las Cortes y los órganos constitucionales no tienen iniciativas en el Plan."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 2
  tags:
  - "estructura"
  - "composición"
