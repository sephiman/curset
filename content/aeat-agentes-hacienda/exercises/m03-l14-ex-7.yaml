# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0103
  prompt:
    es: "Conforme al artículo 220.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo puede iniciarse el procedimiento de rectificación de errores?"
  options:
  - id: a
    text:
      es: "Siempre de oficio, y nunca a instancia del interesado."
  - id: b
    text:
      es: "Solo a instancia del interesado, nunca de oficio."
  - id: c
    text:
      es: "Por acuerdo del Ministro de Hacienda en todos los casos."
  - id: d
    correct: true
    text:
      es: "De oficio o a instancia del interesado."
  explanation:
    es: "La rectificación se hace de oficio o a instancia del interesado (art. 220.1). No es siempre de oficio, como la revocación, ni solo a instancia, ni exige acuerdo del Ministro."
  citation: "art. 220.1 LGT"
  difficulty: 1
  tags:
  - "rectificación"
  - "inicio"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0104
  prompt:
    es: "¿Qué diferencia hay entre el órgano competente para declarar la revocación y el que dictó el acto, según el artículo 219.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Deben ser distintos solo cuando el acto sea una sanción."
  - id: b
    text:
      es: "Es indiferente: lo fija libremente la Administración en cada caso, sin vinculación al reglamento."
  - id: c
    correct: true
    text:
      es: "Deben ser distintos: el que declara la revocación no puede ser el que dictó el acto."
  - id: d
    text:
      es: "Deben ser el mismo: quien dictó el acto es quien lo revoca."
  explanation:
    es: "La revocación la declara el órgano que se determine reglamentariamente, que debe ser distinto del que dictó el acto (art. 219.3). La regla se aplica a todos los actos, no solo a las sanciones. Y no es una elección libre de la Administración."
  citation: "art. 219.3 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "comparación"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0105
  prompt:
    es: "Según el artículo 218.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿con qué fin declara la Administración tributaria lesivos sus actos favorables a los interesados que infringen el ordenamiento?"
  options:
  - id: a
    text:
      es: "Para remitirlos al Tribunal Económico-Administrativo Central y que los anule."
  - id: b
    text:
      es: "Para anularlos de oficio en vía administrativa sin audiencia del interesado."
  - id: c
    correct: true
    text:
      es: "Para proceder a su posterior impugnación en vía contencioso-administrativa."
  - id: d
    text:
      es: "Para someterlos a un nuevo procedimiento de comprobación limitada."
  explanation:
    es: "La declaración de lesividad es el paso previo a impugnar el acto en vía contencioso-administrativa (art. 218.1). La Administración no puede anular por sí misma en perjuicio de los interesados fuera de los artículos 217 y 220. La comprobación y el tribunal central no entran en este procedimiento."
  citation: "art. 218.1 LGT"
  difficulty: 1
  tags:
  - "lesividad"
  - "jurisdicción"
# anchor: boe-a-2003-23186-art-220
- id: m03-l14-q0109
  prompt:
    es: "Conforme al artículo 220.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, transcurrido el plazo de seis meses sin notificar resolución expresa en un procedimiento de rectificación de errores iniciado de oficio, se produce:"
  options:
  - id: a
    text:
      es: "La desestimación por silencio administrativo, que permite recurrir en reposición."
  - id: b
    text:
      es: "La estimación por silencio administrativo de la rectificación propuesta."
  - id: c
    correct: true
    text:
      es: "La caducidad del procedimiento, sin que ello impida iniciar de nuevo otro posteriormente."
  - id: d
    text:
      es: "La caducidad del procedimiento y la pérdida del derecho a rectificar el error."
  explanation:
    es: "En el procedimiento iniciado de oficio el vencimiento produce caducidad, sin impedir un nuevo procedimiento (art. 220.2.a). El silencio desestimatorio es el efecto cuando se inició a instancia del interesado. No hay estimación por silencio. Y la caducidad no extingue el derecho a rectificar, mientras no prescriba."
  citation: "art. 220.2 LGT"
  difficulty: 2
  tags:
  - "rectificación"
  - "caducidad"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0110
  prompt:
    es: "De acuerdo con el artículo 217.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, puede inadmitirse a trámite una solicitud de nulidad en el supuesto de que se hubieran desestimado en cuanto al fondo otras solicitudes:"
  options:
  - id: a
    text:
      es: "Relativas al mismo ejercicio tributario."
  - id: b
    correct: true
    text:
      es: "Sustancialmente iguales."
  - id: c
    text:
      es: "Dirigidas al mismo órgano competente."
  - id: d
    text:
      es: "Presentadas por el mismo interesado."
  explanation:
    es: "El artículo 217.3 permite inadmitir si ya se desestimaron en cuanto al fondo otras solicitudes sustancialmente iguales. Que las presente el mismo interesado, sean del mismo ejercicio o se dirijan al mismo órgano no basta si no son sustancialmente iguales."
  citation: "art. 217.3 LGT"
  difficulty: 3
  tags:
  - "nulidad"
  - "inadmisión"
# anchor: boe-a-2003-23186-art-226
- id: m03-l14-q0111
  prompt:
    es: "Conforme al artículo 226 de la Ley 58/2003, de 17 de diciembre, General Tributaria, puede reclamarse en vía económico-administrativa en relación con la aplicación de los tributos del Estado y la imposición de sanciones tributarias que realicen:"
  options:
  - id: a
    text:
      es: "La Administración General del Estado y las Administraciones tributarias de las Comunidades Autónomas, pero no las entidades de derecho público vinculadas o dependientes de aquella."
  - id: b
    correct: true
    text:
      es: "La Administración General del Estado, las entidades de derecho público vinculadas o dependientes de ella y las Administraciones tributarias de las Comunidades Autónomas y de las Ciudades con Estatuto de Autonomía."
  - id: c
    text:
      es: "Únicamente la Agencia Estatal de Administración Tributaria, con exclusión de las demás entidades de derecho público dependientes de la Administración General del Estado."
  - id: d
    text:
      es: "La Administración General del Estado, las entidades de derecho público vinculadas o dependientes de ella y las entidades locales de más de cincuenta mil habitantes."
  explanation:
    es: "El artículo 226.a abarca a la Administración General del Estado, a sus entidades de derecho público vinculadas o dependientes y a las Administraciones tributarias de las Comunidades Autónomas y de las Ciudades con Estatuto de Autonomía. Las entidades locales no aparecen en la lista. Excluir a las entidades dependientes o limitarlo a la Agencia recorta el ámbito."
  citation: "art. 226 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "ámbito"
# anchor: boe-a-2003-23186-art-226
- id: m03-l14-q0112
  prompt:
    es: "Según el artículo 226 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué otra materia puede reclamarse en vía económico-administrativa, además de la aplicación de los tributos del Estado y la imposición de sanciones?"
  options:
  - id: a
    text:
      es: "En cualquier otra que decida el tribunal económico-administrativo competente."
  - id: b
    correct: true
    text:
      es: "En cualquier otra que se establezca por precepto legal del Estado expreso."
  - id: c
    text:
      es: "En cualquier otra que se establezca por precepto reglamentario del Estado."
  - id: d
    text:
      es: "En cualquier otra que afecte a los derechos de los obligados tributarios."
  explanation:
    es: "La cláusula abierta del artículo 226.b exige un precepto legal del Estado expreso. Un reglamento, la mera afectación de derechos o la decisión del tribunal no bastan para ampliar la materia reclamable."
  citation: "art. 226 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "ámbito"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0113
  prompt:
    es: "Respecto a los actos contra los que es admisible la reclamación económico-administrativa, según el artículo 227.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Son reclamables únicamente los actos de trámite que pongan término al procedimiento, no los que decidan indirectamente el fondo del asunto."
  - id: b
    correct: true
    text:
      es: "Son reclamables los actos de trámite que decidan, directa o indirectamente, el fondo del asunto o pongan término al procedimiento."
  - id: c
    text:
      es: "Son reclamables todos los actos de trámite, aunque no decidan el fondo del asunto ni pongan término al procedimiento."
  - id: d
    text:
      es: "Son reclamables solo los actos que definitivamente reconozcan un derecho, no los que lo hagan de forma provisional."
  explanation:
    es: "El artículo 227.1.b admite los actos de trámite que decidan directa o indirectamente el fondo o pongan término al procedimiento. No cualquier trámite. La letra a) incluye los actos que reconocen o deniegan un derecho provisional o definitivamente. Y limitarlo a los que ponen término excluye los que deciden indirectamente el fondo, que el texto incluye."
  citation: "art. 227.1 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "actos"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0116
  prompt:
    es: "Conforme al artículo 227.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de aplicación de los tributos son reclamables las liquidaciones:"
  options:
  - id: a
    text:
      es: "Firmes, pero no las que hayan sido notificadas."
  - id: b
    correct: true
    text:
      es: "Provisionales o definitivas."
  - id: c
    text:
      es: "Provisionales, pero no las definitivas."
  - id: d
    text:
      es: "Definitivas, pero no las provisionales."
  explanation:
    es: "Son reclamables las liquidaciones provisionales o definitivas (art. 227.2.a). Excluir unas u otras o exigir firmeza no es lo que dice el precepto."
  citation: "art. 227.2 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "actos"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0117
  prompt:
    es: "Según el artículo 227.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué resoluciones derivadas de una solicitud de rectificación de una autoliquidación o de una comunicación de datos son reclamables?"
  options:
  - id: a
    text:
      es: "Únicamente las resoluciones presuntas por silencio."
  - id: b
    correct: true
    text:
      es: "Las resoluciones expresas o presuntas."
  - id: c
    text:
      es: "Únicamente las resoluciones expresas."
  - id: d
    text:
      es: "Ninguna, porque deben revisarse mediante rectificación de errores."
  explanation:
    es: "Son reclamables las resoluciones expresas o presuntas derivadas de esa solicitud (art. 227.2.b). No solo las expresas ni solo las presuntas. Y no deben ir por rectificación de errores, que es otro procedimiento."
  citation: "art. 227.2 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "actos"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0119
  prompt:
    es: "Según el artículo 227.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son reclamables los actos que determinen el régimen tributario aplicable a un obligado tributario, en cuanto sean determinantes de futuras obligaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Incluso formales, a su cargo."
  - id: b
    text:
      es: "Solo materiales, a su cargo."
  - id: c
    text:
      es: "Exclusivamente de pago, a su cargo."
  - id: d
    text:
      es: "Solo de carácter censal, a su cargo."
  explanation:
    es: "La letra f) dice que determinan futuras obligaciones, incluso formales, a cargo del obligado. Limitarlas a materiales, censales o de pago contradice el «incluso formales»."
  citation: "art. 227.2 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "actos"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0120
  prompt:
    es: "Conforme al artículo 227.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, además de los actos de aplicación de los tributos citados en el apartado anterior, son también reclamables:"
  options:
  - id: a
    text:
      es: "Los acuerdos de inicio de los procedimientos sancionadores."
  - id: b
    text:
      es: "Los actos que declaren la prescripción de sanciones."
  - id: c
    correct: true
    text:
      es: "Los actos que impongan sanciones."
  - id: d
    text:
      es: "Los informes previos a la imposición de sanciones."
  explanation:
    es: "El artículo 227.3 declara reclamables los actos que imponen sanciones. Los acuerdos de inicio y los informes son trámites que no deciden el fondo ni ponen término al procedimiento, y la declaración de prescripción no es lo que dice el precepto."
  citation: "art. 227.3 LGT"
  difficulty: 1
  tags:
  - "reclamación"
  - "sanciones"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0121
  prompt:
    es: "Respecto a las actuaciones u omisiones de los particulares reclamables, conforme al artículo 227.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Son reclamables las relativas a las obligaciones de conservar la documentación contable."
  - id: b
    correct: true
    text:
      es: "Son reclamables las relativas a las obligaciones de repercutir y soportar la repercusión prevista legalmente."
  - id: c
    text:
      es: "Son reclamables las relativas a las obligaciones de comparecer ante la inspección."
  - id: d
    text:
      es: "Son reclamables las relativas a la obligación de presentar la declaración censal."
  explanation:
    es: "El artículo 227.4 enumera cuatro actuaciones: repercutir y soportar la repercusión, practicar y soportar retenciones o ingresos a cuenta, expedir, entregar y rectificar facturas, y las relaciones entre el sustituto y el contribuyente. La declaración censal, la conservación de documentación contable y la comparecencia ante la inspección no están."
  citation: "art. 227.4 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "particulares"
# anchor: boe-a-2003-23186-art-227
- id: m03-l14-q0123
  prompt:
    es: "Respecto a los actos que no admiten reclamación económico-administrativa según el artículo 227.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "No se admiten reclamaciones contra las liquidaciones definitivas que hayan sido notificadas por medios electrónicos."
  - id: b
    text:
      es: "No se admiten reclamaciones contra los actos de imposición de sanciones de cuantía inferior a seis mil euros."
  - id: c
    text:
      es: "No se admiten reclamaciones contra los actos de trámite que decidan indirectamente el fondo del asunto."
  - id: d
    correct: true
    text:
      es: "No se admiten reclamaciones contra los actos dictados en virtud de una ley del Estado que los excluya de reclamación económico-administrativa."
  explanation:
    es: "La letra c) excluye los actos dictados en virtud de una ley del Estado que los excluya. Las liquidaciones definitivas son reclamables (art. 227.2.a) sin importar la forma de notificación. Las sanciones son reclamables (art. 227.3) y la cuantía solo decide el procedimiento abreviado. Y los actos de trámite que deciden indirectamente el fondo son reclamables (art. 227.1.b)."
  citation: "art. 227.5 LGT"
  difficulty: 2
  tags:
  - "reclamación"
  - "exclusiones"
