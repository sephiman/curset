# anchor: boe-a-1978-31229-art-37
- id: m01-l01-q075
  prompt:
    es: "Conforme al artículo 37.1 de la Constitución Española de 1978, la ley garantizará el derecho a la negociación colectiva laboral entre:"
  options:
  - id: a
    correct: true
    text:
      es: "Los representantes de los trabajadores y empresarios."
  - id: b
    text:
      es: "Las organizaciones sindicales y el Gobierno."
  - id: c
    text:
      es: "Los trabajadores y la Administración Pública empleadora."
  - id: d
    text:
      es: "Los sindicatos y los Tribunales de lo Social."
  explanation:
    es: "El artículo 37.1 garantiza la negociación colectiva laboral entre los representantes de los trabajadores y empresarios. El Gobierno, la Administración empleadora y los Tribunales de lo Social no son las partes de esa negociación: el artículo coloca frente a frente a trabajadores y empresarios."
  citation: "art. 37.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-38
- id: m01-l01-q076
  prompt:
    es: "La sección 2.ª del capítulo segundo del título I de la Constitución Española de 1978, De los derechos y deberes de los ciudadanos, comienza con el derecho y el deber de defender a España y termina con:"
  options:
  - id: a
    text:
      es: "El derecho a la negociación colectiva laboral."
  - id: b
    text:
      es: "El derecho a contraer matrimonio con plena igualdad jurídica."
  - id: c
    correct: true
    text:
      es: "La libertad de empresa."
  - id: d
    text:
      es: "El sistema tributario justo y no confiscatorio."
  explanation:
    es: "La sección 2.ª va del derecho y el deber de defender a España (artículo 30) a la libertad de empresa (artículo 38), que la cierra. La negociación colectiva laboral, el matrimonio y el sistema tributario son derechos y deberes de la misma sección, pero intermedios."
  citation: "art. 38 CE"
  difficulty: 2
  tags:
  - "estructura"
