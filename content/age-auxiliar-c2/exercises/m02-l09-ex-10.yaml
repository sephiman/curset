# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m02-l09-q274
  prompt:
    es: "En Excel 365, A3 contiene Ser o no ser. ¿Cuántas celdas ocupa el resultado de =DIVIDIRTEXTO(A3;\" \")?"
  options:
  - id: a
    text:
      es: "Cuatro celdas en una columna"
  - id: b
    text:
      es: "Una celda con las palabras unidas"
  - id: c
    text:
      es: "Tres celdas en una fila"
  - id: d
    correct: true
    text:
      es: "Cuatro celdas en una fila"
  explanation:
    es: "La función divide el texto por cada espacio y desborda entre columnas: Ser, o, no, ser. «Una celda con las palabras unidas»: el delimitador de columna espacio divide el texto en cuatro palabras. «Cuatro celdas en una columna»: el delimitador de columna reparte el texto entre columnas, no entre filas. «Tres celdas en una fila»: el texto tiene cuatro palabras separadas por tres espacios, y se generan cuatro celdas."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Sintaxis»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m02-l09-q275
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones es el valor con el que DIVIDIRTEXTO rellena el resultado por defecto, en el argumento pad_with?"
  options:
  - id: a
    text:
      es: "Texto vacío"
  - id: b
    text:
      es: "0"
  - id: c
    correct: true
    text:
      es: "#N/D"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "La página dice que el valor predeterminado de pad_with es #N/D, y que se puede quitar con SI.ND o con el argumento pad_with. «0»: el valor predeterminado es #N/D. «Texto vacío»: la celda vacía aparece al no ignorar delimitadores consecutivos, no por pad_with. «#¡VALOR!»: el valor predeterminado es #N/D."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m02-l09-q276
  prompt:
    es: "En Excel 365, ¿qué se debe usar en DIVIDIRTEXTO si hay más de un delimitador?"
  options:
  - id: a
    correct: true
    text:
      es: "Una constante de matriz"
  - id: b
    text:
      es: "Varias llamadas a la función en la misma celda"
  - id: c
    text:
      es: "Un delimitador de fila"
  - id: d
    text:
      es: "El argumento match_mode"
  explanation:
    es: "La página dice que, si hay más de un delimitador, se usa una constante de matriz, por ejemplo {\",\",\".\"}. «Varias llamadas a la función en la misma celda»: la página pide una constante de matriz, como {\",\",\".\"}. «Un delimitador de fila»: el delimitador de fila separa filas, no varios delimitadores de columna. «El argumento match_mode»: match_mode controla si se distinguen mayúsculas de minúsculas."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m02-l09-q277
  prompt:
    es: "Con Microsoft Excel 365 abierto en un equipo con Windows 11, ¿con qué función es DIVIDIRTEXTO la inversa, según su ayuda?"
  options:
  - id: a
    text:
      es: "EXTRAE"
  - id: b
    text:
      es: "TEXTODESPUES"
  - id: c
