# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q025
  prompt:
    es: "De acuerdo con el artículo 147.1 de la Constitución Española de 1978, dentro de los términos de la Constitución, los Estatutos serán:"
  options:
  - id: a
    text:
      es: "La norma institucional superior de cada Comunidad Autónoma."
  - id: b
    text:
      es: "La norma suprema del ordenamiento jurídico de cada Comunidad Autónoma."
  - id: c
    text:
      es: "La norma básica de organización de las instituciones del Estado en cada Comunidad."
  - id: d
    correct: true
    text:
      es: "La norma institucional básica de cada Comunidad Autónoma."
  explanation:
    es: "El artículo 147.1 dice que los Estatutos serán «la norma institucional básica de cada Comunidad Autónoma». La palabra es «básica», no «superior» ni «suprema»: el Estatuto actúa dentro de los términos de la Constitución. El Estatuto organiza las instituciones de la Comunidad, no las del Estado."
  citation: "art. 147.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q026
  prompt:
    es: "¿Qué posición atribuye la Constitución Española de 1978 a los Estatutos de autonomía respecto del ordenamiento jurídico del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El Estado los reconocerá y amparará como parte integrante de su ordenamiento jurídico."
  - id: b
    text:
      es: "El Estado los respetará como ordenamientos jurídicos separados del suyo."
  - id: c
    text:
      es: "El Estado los reconocerá como normas de rango superior a las leyes orgánicas."
  - id: d
    text:
      es: "El Estado los amparará como parte de su ordenamiento jurídico, con el rango de una ley ordinaria."
  explanation:
    es: "El artículo 147.1 dice que «el Estado los reconocerá y amparará como parte integrante de su ordenamiento jurídico». No son ordenamientos separados del estatal. Tampoco están por encima de las leyes orgánicas ni tienen rango de ley ordinaria: se aprueban por ley orgánica (art. 81.1)."
  citation: "art. 147.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-81
- id: m01-l09-q027
  prompt:
    es: "Según el artículo 81.1 de la Constitución Española de 1978, ¿mediante qué tipo de norma se aprueban los Estatutos de Autonomía?"
  options:
  - id: a
    text:
      es: "Mediante ley ordinaria de las Cortes Generales."
  - id: b
    text:
      es: "Mediante ley de la Asamblea Legislativa de la Comunidad."
  - id: c
    correct: true
    text:
      es: "Mediante ley orgánica de las Cortes Generales."
  - id: d
    text:
      es: "Mediante ley marco de las Cortes Generales."
  explanation:
    es: "El artículo 81.1 dice: «Son leyes orgánicas las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía». No basta una ley ordinaria. La Asamblea de la Comunidad no aprueba su propio Estatuto. La ley marco es la técnica del artículo 150.1 para atribuir facultades legislativas."
  citation: "art. 81.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q028
  prompt:
    es: "¿Cuál de los siguientes contenidos deben incluir los Estatutos de autonomía según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La composición y competencias de los órganos de la Administración del Estado en su territorio."
  - id: b
    correct: true
    text:
      es: "La denominación, organización y sede de las instituciones autónomas propias."
  - id: c
    text:
      es: "El régimen de los tributos propios y de los impuestos cedidos por el Estado."
  - id: d
    text:
      es: "El procedimiento para la elección del Delegado del Gobierno en la Comunidad."
  explanation:
    es: "El artículo 147.2.c) exige que los Estatutos contengan «la denominación, organización y sede de las instituciones autónomas propias». Los órganos de la Administración del Estado no son materia del Estatuto: los dirige el Delegado del Gobierno (art. 154). El régimen de los tributos no está en la lista del artículo 147.2. El Delegado no se elige: lo nombra el Gobierno."
  citation: "art. 147.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q029
  prompt:
    es: "De acuerdo con el artículo 147.2 de la Constitución Española de 1978, en materia de competencias, los Estatutos de autonomía deberán contener:"
  options:
  - id: a
    text:
      es: "Las competencias asumidas dentro del marco establecido en la Constitución y la relación nominal de los funcionarios que se transfieren."
  - id: b
    text:
      es: "Todas las materias enumeradas en el artículo 148.1 y las bases para el traspaso de los servicios correspondientes."
  - id: c
    correct: true
    text:
      es: "Las competencias asumidas dentro del marco establecido en la Constitución y las bases para el traspaso de los servicios correspondientes a las mismas."
  - id: d
    text:
      es: "Las competencias exclusivas del Estado que se delegan en la Comunidad y las formas de control que este se reserve."
  explanation:
    es: "El artículo 147.2.d) exige «las competencias asumidas dentro del marco establecido en la Constitución y las bases para el traspaso de los servicios correspondientes a las mismas». El Estatuto recoge bases para el traspaso, no una relación de funcionarios. No tiene que incluir todas las materias del 148.1: la Comunidad «podrá» asumirlas. La delegación de facultades estatales con formas de control es la ley orgánica del artículo 150.2."
  citation: "art. 147.2 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "requisito"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q031
  prompt:
    es: "Según el artículo 152.2 de la Constitución Española de 1978, una vez sancionados y promulgados los Estatutos aprobados por el procedimiento del artículo 151, ¿cómo podrán modificarse?"
  options:
  - id: a
    text:
      es: "Solamente mediante los procedimientos en ellos establecidos, sin necesidad de referéndum."
  - id: b
    text:
      es: "Solamente mediante ley orgánica aprobada por mayoría de tres quintos de cada Cámara."
  - id: c
    text:
      es: "Solamente mediante referéndum convocado por el Gobierno a propuesta de la Asamblea Legislativa."
  - id: d
    correct: true
    text:
      es: "Solamente mediante los procedimientos en ellos establecidos y con referéndum entre los electores inscritos en los censos correspondientes."
  explanation:
    es: "El artículo 152.2 dice que esos Estatutos «solamente podrán ser modificados mediante los procedimientos en ellos establecidos y con referéndum entre los electores inscritos en los censos correspondientes». El referéndum es necesario. La Constitución no pide tres quintos de cada Cámara para la ley orgánica de reforma. El referéndum se suma al procedimiento del Estatuto, no lo sustituye."
  citation: "art. 152.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q032
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la reforma de los Estatutos de autonomía es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "La Constitución exige referéndum para reformar los Estatutos aprobados por el procedimiento del artículo 151."
  - id: b
    text:
      es: "La Constitución exige referéndum para reformar todos los Estatutos de autonomía, sea cual sea su vía de aprobación."
  - id: c
    text:
      es: "La reforma de un Estatuto no requiere la aprobación de las Cortes Generales si así lo prevé el propio Estatuto."
  - id: d
    text:
      es: "La reforma de los Estatutos se aprueba mediante ley ordinaria de las Cortes Generales."
  explanation:
    es: "El artículo 152.2 exige referéndum para modificar los Estatutos aprobados por el procedimiento del artículo 151. Para los demás, el artículo 147.3 pide la aprobación de las Cortes por ley orgánica y no menciona el referéndum, así que la Constitución no lo exige para todos. Esa aprobación de las Cortes se requiere «en todo caso», diga lo que diga el Estatuto, y es por ley orgánica, no ordinaria."
  citation: "art. 152.2 CE"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q033
  prompt:
    es: "De acuerdo con el artículo 152.1 de la Constitución Española de 1978, en los Estatutos aprobados por el procedimiento del artículo 151, al Presidente de la Comunidad le corresponde:"
  options:
  - id: a
    text:
      es: "La dirección del Consejo de Gobierno, la suprema representación de la Comunidad y la dirección de la Administración del Estado en ella."
  - id: b
    text:
      es: "La dirección del Consejo de Gobierno y la suprema representación de la Comunidad, pero no la representación del Estado."
  - id: c
    correct: true
    text:
      es: "La dirección del Consejo de Gobierno, la suprema representación de la Comunidad y la ordinaria del Estado en aquella."
  - id: d
    text:
      es: "La presidencia de la Asamblea Legislativa, la suprema representación de la Comunidad y la ordinaria del Estado en aquella."
  explanation:
    es: "El artículo 152.1 dice que al Presidente «corresponde la dirección del Consejo de Gobierno, la suprema representación de la respectiva Comunidad y la ordinaria del Estado en aquélla». La Administración del Estado en la Comunidad la dirige el Delegado del Gobierno (art. 154). La representación ordinaria del Estado sí es del Presidente. El artículo no le atribuye la presidencia de la Asamblea."
  citation: "art. 152.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q034
  prompt:
    es: "Según el artículo 152.1 de la Constitución Española de 1978, ¿cómo se designa al Presidente de las Comunidades Autónomas cuyos Estatutos se aprobaron por el procedimiento del artículo 151?"
  options:
  - id: a
    text:
      es: "Es elegido por la Asamblea, de entre sus miembros, y nombrado por el Presidente del Gobierno."
  - id: b
    text:
      es: "Es elegido por sufragio universal directo de los electores de la Comunidad y nombrado por el Rey."
  - id: c
    text:
      es: "Es elegido por la Asamblea, entre cualesquiera ciudadanos de la Comunidad, y nombrado por el Rey."
  - id: d
    correct: true
    text:
      es: "Es elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey."
  explanation:
    es: "El artículo 152.1 prevé «un Presidente, elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey». No lo nombra el Presidente del Gobierno. No lo eligen directamente los electores. Debe ser miembro de la Asamblea."
  citation: "art. 152.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q035
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe la Asamblea Legislativa que la Constitución Española de 1978 prevé en los Estatutos aprobados tras ratificar en referéndum la iniciativa autonómica?"
  options:
  - id: a
    correct: true
    text:
      es: "Se elige por sufragio universal, con un sistema proporcional que asegure además la representación de las diversas zonas del territorio."
  - id: b
    text:
      es: "Se elige por sufragio universal, con un sistema mayoritario que asegure además la representación de las diversas zonas del territorio."
  - id: c
    text:
      es: "Se compone de los Diputados y Senadores elegidos en las circunscripciones del territorio de la Comunidad."
  - id: d
    text:
      es: "Se elige por las Diputaciones provinciales, con un sistema proporcional que asegure la representación de cada provincia."
  explanation:
    es: "El artículo 152.1 prevé «una Asamblea Legislativa, elegida por sufragio universal, con arreglo a un sistema de representación proporcional que asegure, además, la representación de las diversas zonas del territorio». El sistema es proporcional, no mayoritario. La asamblea de Diputados y Senadores es la que elabora el proyecto de Estatuto (art. 151.2), no la Asamblea Legislativa. La eligen los ciudadanos por sufragio universal, no las Diputaciones."
  citation: "art. 152.1 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q036
  prompt:
    es: "En la organización institucional de los Estatutos aprobados tras ratificar en referéndum la iniciativa autonómica, el Consejo de Gobierno tiene funciones:"
  options:
  - id: a
    text:
      es: "Consultivas y ejecutivas, bajo la dirección del Presidente."
  - id: b
    correct: true
    text:
      es: "Ejecutivas y administrativas, bajo la dirección del Presidente."
  - id: c
    text:
      es: "Ejecutivas y jurisdiccionales, bajo la dirección del Presidente."
  - id: d
    text:
      es: "Administrativas y de control de la Asamblea, bajo la dirección del Presidente."
  explanation:
    es: "El artículo 152.1 prevé «un Consejo de Gobierno con funciones ejecutivas y administrativas», dirigido por el Presidente. Las funciones consultivas no son las que el artículo le da. Las jurisdiccionales corresponden a los órganos judiciales. El control lo ejerce la Asamblea sobre el Consejo, no al revés."
  citation: "art. 152.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q037
  prompt:
    es: "De acuerdo con el artículo 152.1 de la Constitución Española de 1978, sin perjuicio de lo dispuesto en el artículo 123, las sucesivas instancias procesales, en su caso, se agotarán:"
  options:
  - id: a
    text:
      es: "Ante órganos judiciales radicados en el territorio de la Comunidad Autónoma en que resida el demandante."
  - id: b
    text:
      es: "Ante órganos judiciales radicados en el mismo territorio de la Comunidad Autónoma, sin excepción alguna."
  - id: c
    text:
      es: "Ante órganos judiciales radicados en el territorio de la Comunidad Autónoma en que tenga su domicilio el demandado."
  - id: d
    correct: true
    text:
      es: "Ante órganos judiciales radicados en el mismo territorio de la Comunidad Autónoma en que esté el órgano competente en primera instancia."
  explanation:
    es: "El artículo 152.1 dice que las instancias «se agotarán ante órganos judiciales radicados en el mismo territorio de la Comunidad Autónoma en que esté el órgano competente en primera instancia». El criterio es el órgano de primera instancia, no la residencia del demandante ni el domicilio del demandado. La regla deja a salvo el artículo 123, que regula el Tribunal Supremo, así que no rige «sin excepción alguna»."
  citation: "art. 152.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
