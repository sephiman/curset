# age-administrativo-c1 course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/age-administrativo-course-requirements.md. Programme: sources/programa.md (Anexo III,
# BOE-A-2025-26262). Module mNN is bloque NN of the programme and lesson mNN-lMM its tema MM, so ids follow
# the official numbering; m00 is the introduction and sits before bloque I.
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are written bloque by bloque in round R2
# (bloque I done); the rest are placeholders.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: age-administrativo-c1
  title:
    es: Administrativo del Estado (C1)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: Ingreso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Administrativo de la Administración del Estado, ingreso libre, resumido
      tema a tema, con preguntas tipo test como las del examen.
  languages: [es]
  status: draft
  exercise_types: [quiz]
  # glyph / color: not set. The schema has no such fields yet; the identity round (R2a.3 of
  # docs/curset-multicourse-requirements.md, R2.2 of the course requirements) adds both here.
blocks:
- id: block-a
  title:
    es: Proceso de selección
  modules:
  - id: m00
    title:
      es: El examen
    summary:
      es: Las reglas del ejercicio único de la convocatoria.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el examen
      summary:
        es: El ejercicio único tiene dos partes, dura cien minutos y cada error resta un tercio de acierto. La puntuación
          directa de cada parte se transforma en una calificación de 0 a 50, con 25 en la nota de corte. La lección
          da las notas de corte que fijó la Comisión en 2025.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización del Estado y de la Administración pública
    summary:
      es: >-
        La organización del Estado según la Constitución de 1978: la Corona, las Cortes Generales, el Poder
        Judicial, el Gobierno y la organización territorial. Incluye la Administración General del Estado, la
        local, la transparencia y el Gobierno Abierto, y las instituciones de la Unión Europea.
    lessons:
    - id: m01-l01
      title:
        es: 'La Constitución Española de 1978: estructura y contenido. Derechos y deberes fundamentales. Su garantía
          y suspensión. El Tribunal Constitucional. El Defensor del Pueblo. Reforma de la Constitución.'
      summary:
        es: >-
          La Constitución de 1978 tiene un título preliminar, diez títulos y 169 artículos, y se ha reformado
          cuatro veces. El título I reparte los derechos en tres niveles de protección y regula su suspensión en
          los estados de excepción y de sitio. La lección cierra con el Tribunal Constitucional, el Defensor del
          Pueblo y los dos procedimientos de reforma.
    - id: m01-l02
      title:
        es: 'La Jefatura del Estado. La Corona: funciones constitucionales del Rey. Sucesión y regencia.'
      summary:
        es: >-
          El Rey es el Jefe del Estado de una Monarquía parlamentaria, es inviolable y sus actos necesitan
          refrendo del Presidente del Gobierno, de los Ministros o, en tres casos, del Presidente del Congreso.
          La lección recorre las funciones de los artículos 62 y 63 de la Constitución y las que el Rey ejerce
          en la formación del Gobierno y en el nombramiento de otros órganos. Cierra con el orden de sucesión,
          la Regencia y la tutela del Rey menor.
    - id: m01-l03
      title:
        es: 'Las Cortes Generales: composición, atribuciones y funcionamiento del Congreso de los Diputados y del
          Senado.'
      summary:
        es: >-
          Las Cortes Generales son el Congreso, de 300 a 400 Diputados, y el Senado, la Cámara de representación
          territorial, con cuatro Senadores por provincia y los que designan las Comunidades Autónomas. Cada
          Cámara funciona en Pleno y por Comisiones, con su Mesa, su Junta de Portavoces, sus Grupos
          Parlamentarios y una Diputación Permanente de al menos veintiún miembros. La lección sigue el título
          III de la Constitución y los dos Reglamentos: períodos de sesiones, quórum y mayorías, elaboración de
          las leyes y tratados internacionales.
    - id: m01-l04
      title:
        es: El Poder Judicial. El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial
          española.
      summary:
        es: >-
          Los Jueces y Magistrados son independientes, inamovibles, responsables y sometidos únicamente al
          imperio de la ley, y el Consejo General del Poder Judicial, con su Presidente y veinte Vocales
          nombrados por cinco años, es el órgano de gobierno del Poder Judicial. El Tribunal Supremo es el
          órgano jurisdiccional superior en todos los órdenes, salvo en materia de garantías constitucionales.
          Desde la Ley Orgánica 1/2025, los antiguos Juzgados son Secciones de los Tribunales de Instancia, uno
          por partido judicial.
    - id: m01-l05
      title:
        es: El Gobierno y la Administración. El Presidente del Gobierno. El Consejo de Ministros. Designación, causas
          de cese y responsabilidad del Gobierno. Las funciones del Gobierno. Relaciones entre el Gobierno y las
          Cortes Generales.
      summary:
        es: >-
          El Gobierno se compone del Presidente, los Vicepresidentes y los Ministros, y se reúne en Consejo de
          Ministros y en Comisiones Delegadas. El Presidente obtiene la confianza del Congreso en la investidura
          y el Gobierno cesa tras las elecciones, por pérdida de la confianza parlamentaria o por dimisión o
          fallecimiento de su Presidente. El Gobierno responde ante el Congreso, que puede exigir esa
          responsabilidad con la moción de censura.
    - id: m01-l06
      title:
        es: 'El Gobierno Abierto: concepto y principios informadores. La Agenda 2030 y los Objetivos de Desarrollo
          Sostenible.'
      summary:
        es: >-
          El Gobierno Abierto es una cultura de gobernanza que promueve la transparencia, la integridad, la
          rendición de cuentas y la participación, y en España avanza mediante planes de Gobierno Abierto, hoy
          el V Plan 2025-2029. La Ley 19/2013, la LRJSP y la consulta pública del artículo 133 de la LPAC dan
          base legal a la transparencia y la participación. La Agenda 2030, aprobada por la Asamblea General de
          las Naciones Unidas el 25 de septiembre de 2015, fija 17 Objetivos de Desarrollo Sostenible y 169
          metas.
    - id: m01-l07
      title:
        es: La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno.
      summary:
        es: >-
          La Ley 19/2013 regula la publicidad activa, el derecho de acceso a la información pública y el buen
          gobierno de los altos cargos. La solicitud de acceso se resuelve en un mes, ampliable por otro, y
          contra la resolución cabe una reclamación potestativa ante el Consejo de Transparencia y Buen Gobierno
          en el plazo de un mes. El título III regula ese Consejo: su Comisión y su Presidente, nombrado por
          cinco años no renovables.
    - id: m01-l08
      title:
        es: La Administración General del Estado. Órganos centrales. Órganos superiores y directivos. Órganos territoriales.
          La Administración del Estado en el Exterior.
      summary:
        es: >-
          La Administración General del Estado se divide en organización central, territorial y en el exterior,
          con Ministros y Secretarios de Estado como órganos superiores y el resto como órganos directivos. La
          lección da, órgano por órgano, quién nombra y separa a cada titular, su rango y si debe ser
          funcionario del Subgrupo A1. Cierra con las Delegaciones y Subdelegaciones del Gobierno y con las
          Misiones Diplomáticas y Oficinas Consulares de la Ley 2/2014.
    - id: m01-l09
      title:
        es: 'La Organización territorial del Estado: las Comunidades Autónomas. Constitución y distribución de competencias
          entre el Estado y las Comunidades Autónomas. Estatutos de Autonomía.'
      summary:
        es: >-
          El Estado se organiza territorialmente en municipios, provincias y Comunidades Autónomas, que acceden
          a la autonomía por la vía del artículo 143 o por la del artículo 151 y se rigen por su Estatuto, la
          norma institucional básica de cada Comunidad. Los artículos 148 y 149 reparten las competencias, y el
          artículo 150 permite leyes marco, transferencia o delegación y armonización. El control de las
          Comunidades, el artículo 155 y la financiación cierran el título VIII.
    - id: m01-l10
      title:
        es: 'La Administración local: entidades que la integran. La provincia, el municipio y la isla.'
      summary:
        es: >-
          La Constitución garantiza la autonomía de los municipios y fija la provincia y la isla; la LBRL
          distingue las entidades locales territoriales de las comarcas, áreas metropolitanas y mancomunidades.
          En el municipio, el Alcalde, los Tenientes de Alcalde y el Pleno existen en todos los ayuntamientos, y
          la Junta de Gobierno Local en los de más de 5.000 habitantes y en los que la prevean. La provincia se
          gobierna por la Diputación, y los municipios de gran población tienen su propio régimen de
          organización.
    - id: m01-l11
      title:
        es: La organización de la Unión Europea. El Consejo Europeo, el Consejo, el Parlamento Europeo, la Comisión
          Europea y el Tribunal de Justicia de la Unión Europea. Efectos de la integración europea sobre la organización
          del Estado español.
      summary:
        es: >-
          La Unión Europea actúa a través de siete instituciones; esta lección recorre las cinco del programa
          con su composición, sus mayorías y sus plazos según el TUE y el TFUE. El Consejo comparte con el
          Parlamento Europeo la función legislativa y la presupuestaria, y el Consejo Europeo no legisla. La
          integración se apoya en el artículo 93 de la Constitución, que permite ceder por ley orgánica el
          ejercicio de competencias.
  - id: m02
    title:
      es: Organización de oficinas públicas
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m02-l01
      title:
        es: Atención al público. Atención de personas con discapacidad. Los servicios de información administrativa.
          Información general y particular al ciudadano. Iniciativas. Reclamaciones. Quejas. Peticiones.
      summary:
        es: Resumen pendiente.
    - id: m02-l02
      title:
        es: Concepto de documento, registro y archivo. Funciones del registro y del archivo. Clases de archivo y
          criterios de ordenación.
      summary:
        es: Resumen pendiente.
    - id: m02-l03
      title:
        es: Administración electrónica y servicios al ciudadano. Análisis de principales páginas web de carácter
          público. Servicios telemáticos. Oficinas integradas de atención al ciudadano. Ventanilla única empresarial.
          El Punto de Acceso General de la Administración General del Estado.
      summary:
        es: Resumen pendiente.
    - id: m02-l04
      title:
        es: 'La protección de datos personales y su régimen Jurídico: principios, derechos, responsable y encargado
          del tratamiento, delegado y autoridades de protección de datos. Derechos digitales.'
      summary:
        es: Resumen pendiente.
  - id: m03
    title:
      es: Derecho administrativo general
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m03-l01
      title:
        es: 'Las fuentes del derecho administrativo. La jerarquía de las fuentes. La ley. Las disposiciones del
          Ejecutivo con fuerza de ley: decreto-ley y decreto legislativo. El reglamento: concepto, clases y límites.
          Otras fuentes del derecho administrativo.'
      summary:
        es: Resumen pendiente.
    - id: m03-l02
      title:
        es: 'El acto administrativo: concepto, clases y elementos. Eficacia y validez de los actos administrativos.
          Su motivación y notificación.'
      summary:
        es: Resumen pendiente.
    - id: m03-l03
      title:
        es: 'Las Leyes del Procedimiento Administrativo Común de las Administraciones Públicas y del Régimen Jurídico
          del Sector Público. Procedimiento administrativo común y su alcance: iniciación, ordenación, instrucción
          y terminación. La revisión de los actos en vía administrativa: revisión de oficio y recursos administrativos.
          El recurso contencioso-administrativo. Actividad administrativa impugnable. Las partes: capacidad, legitimación,
          representación y defensa.'
      summary:
        es: Resumen pendiente.
    - id: m03-l04
      title:
        es: 'Los contratos del sector público: concepto y clases. Preparación, adjudicación, efectos, cumplimiento
          y extinción. La revisión de precios y otras alteraciones contractuales. Régimen de invalidez y recursos.'
      summary:
        es: Resumen pendiente.
    - id: m03-l05
      title:
        es: Procedimientos y formas de la actividad administrativa. La actividad de limitación, arbitral, de servicio
          público y de fomento. Formas de gestión de los servicios públicos.
      summary:
        es: Resumen pendiente.
    - id: m03-l06
      title:
        es: La responsabilidad patrimonial de las Administraciones públicas. Concepto y clases. Requisitos generales.
          Efectos.
      summary:
        es: Resumen pendiente.
    - id: m03-l07
      title:
        es: 'Políticas de igualdad y contra la violencia de género. Políticas de igualdad de trato y no discriminación
          de las personas LGTBI. Discapacidad y dependencia: régimen jurídico.'
      summary:
        es: Resumen pendiente.
  - id: m04
    title:
      es: Gestión de personal
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m04-l01
      title:
        es: 'El personal al servicio de las Administraciones públicas: concepto y clases. El texto refundido del
          Estatuto Básico del Empleado Público y demás normativa de aplicación. Las competencias en materia de personal.
          El Registro Central de Personal.'
      summary:
        es: Resumen pendiente.
    - id: m04-l02
      title:
        es: Selección de personal. Los procesos selectivos en la Administración pública y su conexión con la Oferta
          de Empleo Público. Principios constitucionales. Acceso al empleo público y provisión de puestos de trabajo
          de las personas con discapacidad.
      summary:
        es: Resumen pendiente.
    - id: m04-l03
      title:
        es: 'El personal funcionario al servicio de las Administraciones públicas: funcionarios de carrera y funcionarios
          interinos. La selección de los funcionarios.'
      summary:
        es: Resumen pendiente.
    - id: m04-l04
      title:
        es: Adquisición y pérdida de la condición de funcionario. Situaciones administrativas de los funcionarios.
          Supuestos y efectos de cada una de ellas.
      summary:
        es: Resumen pendiente.
    - id: m04-l05
      title:
        es: Provisión de puestos de trabajo en la función pública. Los deberes y derechos de los funcionarios. La
          carrera administrativa. Promoción interna.
      summary:
        es: Resumen pendiente.
    - id: m04-l06
      title:
        es: 'Las incompatibilidades. Régimen disciplinario: faltas, sanciones y procedimiento.'
      summary:
        es: Resumen pendiente.
    - id: m04-l07
      title:
        es: El régimen de la Seguridad Social de los funcionarios. La MUFACE y las clases pasivas.
      summary:
        es: Resumen pendiente.
    - id: m04-l08
      title:
        es: 'El personal laboral al servicio de las Administraciones públicas. Selección. Derechos, deberes e incompatibilidades.
          El IV Convenio único para el personal laboral de la Administración General del Estado: ámbito de aplicación
          y sistema de clasificación.'
      summary:
        es: Resumen pendiente.
    - id: m04-l09
      title:
        es: El régimen de la Seguridad Social del personal laboral. La acción protectora. Tipos y características
          de las prestaciones.
      summary:
        es: Resumen pendiente.
  - id: m05
    title:
      es: Gestión financiera
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m05-l01
      title:
        es: 'El presupuesto: concepto. Los principios presupuestarios. El ciclo presupuestario. El presupuesto por
          programas: concepto y fases. Terminología y desarrollo del proceso presupuestario.'
      summary:
        es: Resumen pendiente.
    - id: m05-l02
      title:
        es: 'El presupuesto del Estado en España: concepto y estructura. Los créditos presupuestarios: clasificación.
          Gastos plurianuales. Las modificaciones presupuestarias: créditos extraordinarios y suplementos de crédito.
          Ampliaciones de crédito. Generaciones de crédito. Transferencias de crédito. Incorporaciones de crédito.
          Anticipos de tesorería.'
      summary:
        es: Resumen pendiente.
    - id: m05-l03
      title:
        es: 'El procedimiento administrativo de ejecución del presupuesto de gasto. Órganos competentes. Fases del
          procedimiento y sus documentos contables. Compromisos de gasto para ejercicios posteriores. La ordenación
          del pago: concepto y competencia. Realización del pago: modos y perceptores. Control del gasto público.
          Clases. Especial referencia al control de legalidad. El Tribunal de Cuentas.'
      summary:
        es: Resumen pendiente.
    - id: m05-l04
      title:
        es: 'Las retribuciones e indemnizaciones de los funcionarios públicos y del personal laboral al servicio
          de la Administración pública. Nóminas: estructura y normas de confección. Altas y bajas: su justificación.
          Retribuciones básicas: sueldos, trienios, pagas extraordinarias. Retribuciones complementarias y otras
          remuneraciones. Devengo y liquidación de derechos económicos. El pago de las retribuciones del personal
          en activo. Formas de pago.'
      summary:
        es: Resumen pendiente.
    - id: m05-l05
      title:
        es: 'Gastos para la compra de bienes y servicios. Gastos de inversión. Gastos de transferencias: corrientes
          y de capital. Pagos: concepto y tipos. Pagos por obligaciones presupuestarias. Anticipos de caja fija.
          Pagos «a justificar». Justificación de libramientos.'
      summary:
        es: Resumen pendiente.
    - id: m05-l06
      title:
        es: Gestión económica y financiera de los contratos del sector público. Gestión económica y financiera de
          subvenciones.
      summary:
        es: Resumen pendiente.
  - id: m06
    title:
      es: Informática básica y ofimática
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m06-l01
      title:
        es: 'Informática básica: conceptos fundamentales sobre el hardware y el software. Sistemas de almacenamiento
          de datos. Sistemas operativos. Nociones básicas de seguridad informática.'
      summary:
        es: Resumen pendiente.
    - id: m06-l02
      title:
        es: 'Introducción al sistema operativo: el entorno Windows. Fundamentos. Trabajo en el entorno gráfico de
          Windows: ventanas, iconos, menús contextuales, cuadros de diálogo. El escritorio y sus elementos. El menú
          inicio. Copilot.'
      summary:
        es: Resumen pendiente.
    - id: m06-l03
      title:
        es: El explorador de Windows. Gestión de carpetas y archivos. Operaciones de búsqueda. Herramientas «Este
          equipo» y «Acceso rápido». Accesorios. Herramientas del sistema.
      summary:
        es: Resumen pendiente.
    - id: m06-l04
      title:
        es: 'Procesadores de texto: Word 365. Principales funciones y utilidades. Creación y estructuración del
          documento. Gestión, grabación, recuperación e impresión de ficheros. Personalización del entorno de trabajo.'
      summary:
        es: Resumen pendiente.
    - id: m06-l05
      title:
        es: 'Hojas de cálculo: Excel 365. Principales funciones y utilidades. Libros, hojas y celdas. Configuración.
          Introducción y edición de datos. Fórmulas y funciones. Gráficos. Gestión de datos. Personalización del
          entorno de trabajo.'
      summary:
        es: Resumen pendiente.
    - id: m06-l06
      title:
        es: 'Bases de datos: Access 365. Principales funciones y utilidades. Tablas. Consultas. Formularios. Informes.
          Relaciones. Importación, vinculación y exportación de datos.'
      summary:
        es: Resumen pendiente.
    - id: m06-l07
      title:
        es: 'Correo electrónico: Outlook 365. Conceptos elementales y funcionamiento. El entorno de trabajo. Enviar,
          recibir, responder y reenviar mensajes. Creación de mensajes. Reglas de mensaje. Libreta de direcciones.'
      summary:
        es: Resumen pendiente.
    - id: m06-l08
      title:
        es: 'La Red Internet: origen, evolución y estado actual. Conceptos elementales sobre protocolos y servicios
          en Internet. Funcionalidades básicas de los navegadores web.'
      summary:
        es: Resumen pendiente.
