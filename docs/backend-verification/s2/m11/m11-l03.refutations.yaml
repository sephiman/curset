m11-l03-q05:
  key:
    anchor: hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections
    sentence: If the pool is properly tuned it is set right at the limit of the number of queries the database is capable of processing simultaneously -- which is rarely much more than (CPU cores * 2) as noted above.
  wrong:
  - option: It matches the number of front-end users, so that no request waits for a connection
    anchor: hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections
    sentence: If you have 10,000 front-end users, having a connection pool of 10,000 would be shear insanity.
  - option: It is large, 100 connections or more, so that application threads never block on the pool
    anchor: hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections
    sentence: You want a small pool of a few dozen connections at most, and you want the rest of the application threads blocked on the pool awaiting connections.
  - option: It equals `Tn x (Cm - 1) + 1`, which is the optimal pool size
    anchor: hikaricp-pool-sizing#pool-locking
    sentence: This is not necessarily the optimal pool size, but the minimum required to avoid deadlock.
