      summary:
        en: 'Records, sealed types and pattern matching in Java 25 as the building blocks of data-oriented design, with the single responsibility principle, DRY, KISS and yagni attributed to their authors.'
    - id: m01-l02
      title:
        en: 'GoF patterns in modern backend code'
      summary:
        en: 'JDK dynamic proxies and Spring AOP proxying mechanics, with the Gang of Four catalogue pointed to by chapter and a builder, a proxy and a strategy-with-observer run as snippets.'
    - id: m01-l03
      title:
        en: 'Application architecture and modular evolution'
      summary:
