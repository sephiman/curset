type: quiz
variants:
- id: m06-l02-q01
  prompt:
    en: In PostgreSQL 18, a transaction set to `READ UNCOMMITTED` reads a row that another transaction has changed
      but not yet committed. Which version of the row does the read return?
  options:
  - id: a
    text:
      en: The uncommitted change, because the SQL standard allows dirty reads at Read Uncommitted
  - id: b
    text:
      en: The uncommitted change, but only when the other transaction commits later on
  - id: c
    correct: true
    text:
      en: The last committed version, because Read Uncommitted behaves like Read Committed
  - id: d
    text:
      en: A snapshot taken when the transaction began, as at Repeatable Read
  explanation:
    en: PostgreSQL's Read Uncommitted mode behaves like Read Committed, so the read returns committed data. The
      table marks dirty reads at Read Uncommitted as allowed, but not in PG. A Read Committed `SELECT` never sees
      uncommitted data or changes committed during its execution, so a later commit does not make the change visible.
      A Read Committed `SELECT` sees a snapshot as of the instant the query begins to run, not as of the transaction
      start.
  citation: pg-transaction-iso#TRANSACTION-ISO; pg-transaction-iso#XACT-READ-COMMITTED
  extract:
    en: PostgreSQL's Read Uncommitted mode behaves like Read Committed
- id: m06-l02-q02
  prompt:
    en: In PostgreSQL 18, transaction T1 reads one row twice. Transaction T2 updates that row and commits between
      the two reads, and the second read returns the new value. Which phenomenon occurred?
  options:
  - id: a
    text:
      en: Dirty read
  - id: b
    correct: true
    text:
      en: Nonrepeatable read
  - id: c
    text:
      en: Phantom read
  - id: d
    text:
      en: Serialization anomaly
  explanation:
    en: Re-reading data and finding it modified by a transaction that committed since the first read is a nonrepeatable
      read. A dirty read is reading data written by a concurrent uncommitted transaction, but T2 had committed.
      A phantom read is a changed set of rows satisfying a search condition, not one modified row. A serialization
      anomaly is a committed group of transactions inconsistent with every one-at-a-time ordering, which a single
      changed value does not describe.
  citation: pg-transaction-iso#TRANSACTION-ISO
  extract:
    en: A transaction re-reads data it has previously read and finds that data has been modified by another transaction
      (that committed since the initial read).
- id: m06-l02-q03
  prompt:
    en: In PostgreSQL 18, a transaction runs a query with a search condition twice. Between the runs another transaction
      inserts a matching row and commits, so the second run returns an extra row. Which phenomenon occurred?
  options:
  - id: a
    text:
      en: Dirty read
  - id: b
    text:
      en: Nonrepeatable read
  - id: c
    correct: true
    text:
      en: Phantom read
  - id: d
    text:
      en: Serialization anomaly
  explanation:
    en: A re-executed query whose set of matching rows changed because of a recently committed transaction is a
      phantom read. A dirty read needs uncommitted data, and the inserting transaction committed. A nonrepeatable
      read concerns data already read being modified, and no row that was read changed. A serialization anomaly
      concerns a committed group inconsistent with all serial orders.
  citation: pg-transaction-iso#TRANSACTION-ISO
  extract:
    en: finds that the set of rows satisfying the condition has changed due to another recently-committed transaction
- id: m06-l02-q05
  prompt:
    en: In PostgreSQL 18, which of the four phenomena of the isolation table can still occur at the Repeatable Read
      level?
  options:
  - id: a
    text:
      en: Dirty read
  - id: b
    text:
      en: Nonrepeatable read
  - id: c
    text:
      en: Phantom read
  - id: d
    correct: true
    text:
      en: Serialization anomaly
  explanation:
    en: Repeatable Read prevents all phenomena except serialization anomalies. A dirty read cannot occur because
      it never sees uncommitted data. A nonrepeatable read cannot occur because successive `SELECT` commands see
      the same data. A phantom read cannot occur because PostgreSQL's Repeatable Read implementation does not allow
      it.
  citation: pg-transaction-iso#XACT-REPEATABLE-READ; pg-transaction-iso#TRANSACTION-ISO
  extract:
    en: prevents all of the phenomena described in Table 13.1 except for serialization anomalies
- id: m06-l02-q06
  prompt:
    en: In PostgreSQL 18, at which isolation level is none of the dirty read, nonrepeatable read, phantom read and
      serialization anomaly phenomena possible?
  options:
  - id: a
    text:
      en: Repeatable Read
  - id: b
    text:
      en: Read Committed
  - id: c
    text:
      en: Read Uncommitted
  - id: d
    correct: true
    text:
      en: Serializable
  explanation:
    en: Only Serializable has no possible phenomenon in the table. Repeatable Read excludes every phenomenon except
      serialization anomalies. At Read Committed two successive `SELECT` commands can see different data. Read Uncommitted
      behaves like Read Committed.
  citation: pg-transaction-iso#TRANSACTION-ISO; pg-transaction-iso#XACT-REPEATABLE-READ; pg-transaction-iso#XACT-READ-COMMITTED
- id: m06-l02-q07
  prompt:
    en: At Read Committed in PostgreSQL 18, rows hold `hits` 9 and 10. Session A runs an uncommitted `UPDATE` adding
      1 to `hits`; session B runs `DELETE ... WHERE hits = 10`. What does `DELETE` do after A commits?
  options:
  - id: a
    correct: true
    text:
      en: Nothing, because the row that held 10 now holds 11 and the row that held 9 was skipped
  - id: b
    text:
      en: It deletes the row that now holds 10, because that row held 9 before the update
  - id: c
    text:
      en: It re-evaluates the `WHERE` clause on the original values and deletes the row that held 10
  - id: d
    text:
      en: It fails with the error could not serialize access due to concurrent update
  explanation:
    en: The pre-update value 9 is skipped and the new value of the other row is 11, so nothing matches. Deleting
      the row that was 9 fails because that pre-update value is skipped. The `WHERE` clause is re-evaluated on the
      updated version of the row, not on the original values. The serialization error is what a Repeatable Read
      transaction gets, not a Read Committed command.
  citation: pg-transaction-iso#XACT-READ-COMMITTED; pg-transaction-iso#XACT-REPEATABLE-READ
  extract:
    en: This occurs because the pre-update row value 9 is skipped
- id: m06-l02-q08
  prompt:
    en: In PostgreSQL 18, a Repeatable Read transaction runs `SELECT FOR UPDATE` on a row that another transaction
      changed and committed after the first transaction started. What happens?
  options:
  - id: a
    text:
      en: The updated version of the row is locked and returned, as in Read Committed mode
  - id: b
    text:
      en: The row is locked in the version of its own snapshot and returned without any error
  - id: c
    correct: true
    text:
      en: An error is thrown, because the row to be locked has changed since the transaction started
  - id: d
    text:
      en: It waits for the other transaction to end, then proceeds without raising an error
  explanation:
    en: Within a `REPEATABLE READ` or `SERIALIZABLE` transaction an error is thrown if a row to be locked has changed
      since the transaction started. A repeatable read transaction cannot modify or lock rows changed by other transactions
      after it began, so it cannot lock its snapshot version either. If the first updater commits, the repeatable
      read transaction is rolled back instead of proceeding.
  citation: pg-explicit-locking#LOCKING-ROWS; pg-transaction-iso#XACT-REPEATABLE-READ
  extract:
    en: Within a REPEATABLE READ or SERIALIZABLE transaction, however, an error will be thrown if a row to be locked
      has changed since the transaction started.
- id: m06-l02-q09
  prompt:
    en: According to the PostgreSQL 18 documentation, what can a read-only transaction at Repeatable Read still
      observe, even though it sees a stable snapshot?
  options:
  - id: a
    text:
      en: A row written by a transaction that has not committed yet at the time of the read
  - id: b
    text:
      en: Two successive `SELECT` commands that return different data within one transaction
  - id: c
    correct: true
    text:
      en: A control record showing a batch as completed, but not one of its detail records
  - id: d
    text:
      en: A phantom row inserted by a transaction that committed after its snapshot was taken
  explanation:
    en: A read-only transaction at Repeatable Read may see a control record updated to show a batch completed but
      not a detail record of that batch. Repeatable Read never sees uncommitted data. Successive `SELECT` commands
      there see the same data. PostgreSQL's Repeatable Read implementation does not allow phantom reads.
  citation: pg-transaction-iso#XACT-REPEATABLE-READ; pg-transaction-iso#TRANSACTION-ISO
  extract:
    en: even a read-only transaction at this level may see a control record updated to show that a batch has been
      completed but not see one of the detail records
- id: m06-l02-q10
  prompt:
    en: In PostgreSQL 18, serializable transaction A sums the class 1 rows of `mytab` and inserts the sum as a class
      2 row, while B sums class 2 rows and inserts a class 1 row. Both try to commit. What happens?
  options:
  - id: a
    text:
      en: Both commit, because the order of the two inserts does not matter
  - id: b
    correct: true
    text:
      en: Exactly one commits and the other is rolled back with a serialization failure
  - id: c
    text:
      en: The transaction that started second is always the one rolled back
  - id: d
    text:
      en: The second transaction waits on a lock and then commits with a recomputed sum
  explanation:
    en: Serializable allows one transaction to commit and rolls the other back. Both committing is ruled out because
      there is no serial order consistent with the result. The docs call it very hard to predict exactly which transaction
      will be rolled back, so it is not always the later one. Predicate locks in PostgreSQL do not cause any blocking,
      so no lock wait occurs.
  citation: pg-transaction-iso#XACT-SERIALIZABLE
  extract:
    en: using Serializable transactions will allow one transaction to commit and will roll the other back
- id: m06-l02-q12
  prompt:
    en: A PostgreSQL 18 transaction at Serializable fails with a serialization failure. What should the application
      do?
  options:
  - id: a
    text:
      en: Use the data read in the aborted transaction, since it was valid when read
  - id: b
    text:
      en: Treat the error as permanent and give up without retrying
  - id: c
    text:
      en: Rerun only the failed statement inside the same transaction
  - id: d
    correct: true
    text:
      en: Retry the whole transaction until it succeeds
  explanation:
    en: Applications must retry the transaction until it succeeds. They must not depend on results read during a
      transaction that later aborted. The Serializable level requires applications to be prepared to retry due to
      serialization failures. The documented procedure is to abort the current transaction and retry it from the
      beginning, not a single statement.
  citation: pg-transaction-iso#XACT-SERIALIZABLE; pg-transaction-iso#XACT-REPEATABLE-READ
  extract:
    en: applications must not depend on results read during a transaction that later aborted; instead, they should
      retry the transaction until it succeeds
- id: m06-l02-q13
  prompt:
    en: In Jakarta Persistence 3.2, when does an optimistic lock failure occur for an entity that is updated within
      a unit of work?
  options:
  - id: a
    correct: true
    text:
      en: When the version in the database changes between reading the data and updating it
  - id: b
    text:
      en: When a second transaction reads the same entity before the first one commits
  - id: c
    text:
      en: When an entity that has no version attribute is updated by the application code
  - id: d
    text:
      en: When the persistence provider increments the version column during the update
  explanation:
    en: A failure occurs when the version or timestamp in the database changes between the read and the update or
      delete. Verification ensures an update succeeds only when no intervening transaction has already updated the
      item, so concurrent reads do not matter. A missing version does not impede completion of the operation. The
      provider must update the version each time the state is written, which is normal and not a failure.
  citation: jakarta-persistence-spec#a2056; jakarta-persistence-spec#a2059
  extract:
    en: An optimistic lock failure occurs when verification fails
- id: m06-l02-q14
  prompt:
    en: In Jakarta Persistence 3.2, the provider merges a detached entity instance that holds a stale revision of
      the entity. What must it do?
  options:
  - id: a
    text:
      en: Overwrite the database state with the detached state
  - id: b
    text:
      en: Refresh the instance from the database and merge anyway
  - id: c
    correct: true
    text:
      en: Throw an `OptimisticLockException`
  - id: d
    text:
      en: Ignore the version, because version checks apply only to managed instances
  explanation:
    en: The provider must throw an `OptimisticLockException` if the merged instance holds a stale revision. Overwriting
      would lose the updates that optimistic verification prevents. Refreshing and merging anyway is not allowed
      when the entity was updated since the instance became detached. The provider must examine the version of a
      detached instance when it is merged.
  citation: jakarta-persistence-spec#a2059; jakarta-persistence-spec#a2056
  extract:
    en: throw an OptimisticLockException if the instance being merged holds a stale revision of the state of the
      entity
- id: m06-l02-q15
  prompt:
    en: In Jakarta Persistence 3.2, when may the provider check the version of a detached entity instance that is
      being merged?
  options:
  - id: a
    text:
      en: Always synchronously with the call to `merge()`, before any flush happens
  - id: b
    text:
      en: Always at transaction commit, and never earlier than that point
  - id: c
    text:
      en: Only when the application calls `lock()` on the instance explicitly
  - id: d
    correct: true
    text:
      en: At `merge()`, or later at a flush or commit, depending on the provider
  explanation:
    en: 'The timing of the check is provider-dependent: at `merge()`, or delayed until a flush or commit. It is
