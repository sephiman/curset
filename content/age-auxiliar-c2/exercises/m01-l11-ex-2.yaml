# anchor: boe-a-2015-10565-art-44
- id: m01-l11-q052
  prompt:
    es: "¿En cuál de los siguientes casos se hará la notificación por medio de un anuncio en el «Boletín Oficial del Estado», según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando, intentada la notificación, no se hubiese podido practicar."
  - id: b
    text:
      es: "Cuando la notificación contenga medios de pago a favor del interesado."
  - id: c
    text:
      es: "Cuando el interesado no haya comunicado un dispositivo para avisos."
  - id: d
    text:
      es: "Cuando el interesado o su representante rechace la notificación."
  explanation:
    es: "El artículo 44 prevé el anuncio en el «Boletín Oficial del Estado» cuando los interesados sean desconocidos, se ignore el lugar de la notificación o, «intentada ésta, no se hubiese podido practicar». El rechazo da por efectuado el trámite (art. 41.5). No comunicar un dispositivo sólo impide enviar el aviso. Los medios de pago obligan a notificar por medios no electrónicos (art. 41.2.b), no por anuncio."
  citation: "art. 44 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-45
- id: m01-l11-q053
  prompt:
    es: "De acuerdo con el artículo 45.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos integrantes de un procedimiento selectivo o de concurrencia competitiva:"
  options:
  - id: a
    text:
      es: "Se publicarán sólo cuando el número de aspirantes impida la notificación individual."
  - id: b
    correct: true
    text:
      es: "Serán objeto de publicación en todo caso, y esta surtirá los efectos de la notificación."
  - id: c
    text:
      es: "Serán objeto de publicación en todo caso, pero esta no sustituirá a la notificación."
  - id: d
    text:
      es: "Se publicarán sólo si lo prevén las bases, como complemento de la notificación individual."
  explanation:
    es: "El artículo 45.1 dice que, «en todo caso, los actos administrativos serán objeto de publicación, surtiendo ésta los efectos de la notificación», entre otros supuestos, cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva (letra b). La publicación no depende de las bases ni del número de aspirantes. Sustituye a la notificación, porque surte sus efectos."
  citation: "art. 45.1.b) LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-45
- id: m01-l11-q054
  prompt:
    es: "Según el artículo 45.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en cuál de los siguientes casos serán objeto de publicación en todo caso los actos administrativos?"
  options:
  - id: a
    text:
      es: "Cuando el acto sea de gravamen o desfavorable para más de un interesado."
  - id: b
    correct: true
    text:
      es: "Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas."
  - id: c
    text:
      es: "Cuando el acto ponga fin a la vía administrativa en un procedimiento iniciado de oficio."
  - id: d
    text:
      es: "Cuando el acto tenga por destinatarios a varios interesados identificados en el expediente."
  explanation:
    es: "El artículo 45.1.a) exige publicar «cuando el acto tenga por destinatario a una pluralidad indeterminada de personas». Varios interesados identificados no son una pluralidad indeterminada. Poner fin a la vía administrativa o ser un acto de gravamen no obliga a publicar."
  citation: "art. 45.1.a) LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-45
- id: m01-l11-q056
  prompt:
    es: "¿Cuál de los siguientes actos será objeto de publicación en todo caso, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La resolución que concede una autorización a un solo interesado."
  - id: b
    correct: true
    text:
      es: "La relación de aspirantes admitidos en un procedimiento selectivo de ingreso."
  - id: c
    text:
      es: "El acuerdo que amplía el plazo de un procedimiento iniciado a solicitud."
  - id: d
    text:
      es: "La resolución del recurso de alzada interpuesto por un particular."
  explanation:
    es: "El artículo 45.1.b) exige publicar en todo caso los «actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo», y la relación de admitidos es uno de ellos. Una autorización para un solo interesado, la resolución de un recurso de un particular y la ampliación de plazo en un procedimiento a solicitud no están en el artículo 45.1 y se notifican."
  citation: "art. 45.1.b) LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-41
- id: m01-l11-q057
  prompt:
    es: "El representante de un interesado rechaza la notificación de un acto de trámite. Según el artículo 41.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene ese rechazo?"
  options:
  - id: a
    text:
      es: "El trámite sólo se da por efectuado si rechaza el propio interesado."
  - id: b
    text:
      es: "El plazo máximo para resolver queda suspendido hasta que se notifique al interesado."
  - id: c
    correct: true
    text:
      es: "El trámite se da por efectuado y el procedimiento sigue su curso."
  - id: d
    text:
      es: "El trámite se da por efectuado, pero el procedimiento queda en suspenso."
  explanation:
    es: "El artículo 41.5 se aplica «cuando el interesado o su representante rechace la notificación» y dice que se hará constar en el expediente, «dando por efectuado el trámite y siguiéndose el procedimiento». El rechazo del representante produce el mismo efecto que el del interesado. El artículo no suspende el plazo para resolver. Tampoco deja el procedimiento en suspenso: manda seguirlo."
  citation: "art. 41.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1998-16718-art-6
- id: m01-l11-q100
  prompt:
    es: "Según el artículo 6 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cuál de los siguientes órganos integra el orden jurisdiccional contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Los Tribunales Económico-Administrativos Regionales del Estado."
  - id: b
    correct: true
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: c
    text:
      es: "Los Juzgados de lo Social de cada provincia."
  - id: d
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  explanation:
    es: "El artículo 6 integra en el orden contencioso-administrativo los Juzgados de lo Contencioso-administrativo, los Juzgados Centrales, las Salas de los Tribunales Superiores de Justicia, la Sala de la Audiencia Nacional y la del Tribunal Supremo. Los Tribunales Económico-Administrativos son órganos administrativos, y los Juzgados de lo Social y la Sala de lo Penal son de otros órdenes o salas."
  citation: "art. 6 LJCA"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-128
- id: m01-l11-q101
  prompt:
    es: "Conforme al artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, durante el mes de agosto el plazo para interponer el recurso contencioso-administrativo:"
  options:
  - id: a
    text:
      es: "corre con normalidad, pues agosto es hábil en toda la jurisdicción contencioso-administrativa."
  - id: b
    text:
      es: "queda suspendido solo para las partes que lo soliciten al órgano jurisdiccional."
  - id: c
    text:
      es: "no corre en ningún procedimiento de la Ley, tampoco en el de protección de derechos fundamentales."
  - id: d
    correct: true
    text:
      es: "no corre, salvo en el procedimiento para la protección de los derechos fundamentales."
  explanation:
    es: "El artículo 128.2 dice que en agosto «no correrá el plazo para interponer el recurso contencioso-administrativo ni ningún otro plazo» de la Ley, salvo en el procedimiento para la protección de los derechos fundamentales. Agosto no es hábil con carácter general, la suspensión no depende de que las partes la pidan y la excepción de los derechos fundamentales existe."
  citation: "art. 128.2 LJCA"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1998-16718-art-128
- id: m01-l11-q102
  prompt:
    es: "Según el artículo 128.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en el procedimiento para la protección de los derechos fundamentales el mes de agosto tiene carácter:"
  options:
  - id: a
    correct: true
    text:
      es: "hábil, de manera que en él corren los plazos."
  - id: b
    text:
      es: "inhábil, como en el resto de procedimientos."
  - id: c
    text:
      es: "hábil solo para presentar el recurso, no para otros plazos."
  - id: d
    text:
      es: "inhábil, salvo que el órgano lo habilite por urgencia."
  explanation:
    es: "El artículo 128.2 excluye ese procedimiento de la regla de agosto: «el mes de agosto tendrá carácter de hábil». Por tanto no es inhábil, ni lo es salvo habilitación, y no es hábil solo para el recurso: lo es para todos sus plazos."
  citation: "art. 128.2 LJCA"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2025-76-da-primera
- id: m01-l11-q259
  prompt:
    es: "Según la disposición adicional primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, implantados los Tribunales de Instancia, los Juzgados de lo Contencioso-administrativo se entienden referidos a:"
  options:
  - id: a
    text:
      es: "Las Salas de lo Contencioso-administrativo de los Tribunales Superiores de Justicia."
  - id: b
    text:
      es: "Las Secciones de lo Contencioso-administrativo del Tribunal Central de Instancia."
  - id: c
    text:
      es: "Las Salas de lo Contencioso-administrativo de las Audiencias Provinciales."
  - id: d
    correct: true
    text:
      es: "Las Secciones de lo Contencioso-administrativo de los Tribunales de Instancia."
  explanation:
    es: "La disposición adicional primera dice que las referencias a los Juzgados «de lo Contencioso-Administrativo» se entienden referidas «a las Secciones del orden jurisdiccional correspondiente de los Tribunales de Instancia». Las Salas de los Tribunales Superiores de Justicia siguen siendo órganos distintos. Las Secciones del Tribunal Central de Instancia sustituyen a los Juzgados Centrales, no a los Juzgados. Las Audiencias Provinciales no tienen Salas de lo contencioso-administrativo."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2025-76-da-primera
- id: m01-l11-q260
  prompt:
    es: "Implantados los Tribunales de Instancia, ¿a qué órgano se entienden hechas las referencias a los Juzgados Centrales de lo Contencioso-administrativo, según la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia?"
  options:
  - id: a
    text:
      es: "A la Sala de lo Contencioso-administrativo de la Audiencia Nacional."
  - id: b
    correct: true
    text:
      es: "A las Secciones correspondientes del Tribunal Central de Instancia."
  - id: c
    text:
      es: "A las Secciones de los Tribunales de Instancia de Madrid."
  - id: d
    text:
      es: "A la Sala de lo Contencioso-administrativo del Tribunal Supremo."
  explanation:
    es: "La disposición adicional primera de la Ley Orgánica 1/2025 dice que «la misma consideración tendrán las referencias a los Juzgados Centrales respecto de las correspondientes Secciones del Tribunal Central de Instancia». La Sala de la Audiencia Nacional y la del Tribunal Supremo son órganos colegiados distintos que la ley no toca. Las Secciones de los Tribunales de Instancia de Madrid sustituyen a los Juzgados de Madrid, no a los Centrales."
  citation: "disposición adicional primera LO 1/2025"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1998-16718-art-46
- id: m01-l11-q261
  prompt:
    es: "Según el artículo 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cuál es el plazo para interponer el recurso contencioso-administrativo contra un acto expreso y contra uno presunto?"
  options:
  - id: a
    text:
      es: "Dos meses contra el acto expreso y tres meses contra el acto presunto."
  - id: b
    text:
      es: "Un mes contra el acto expreso y seis meses contra el acto presunto."
  - id: c
    text:
      es: "Dos meses en ambos casos, contados desde el día siguiente al de la notificación."
  - id: d
    correct: true
    text:
      es: "Dos meses contra el acto expreso y seis meses contra el acto presunto."
  explanation:
    es: "El artículo 46.1 fija «dos meses» contra la disposición o el acto expreso y, si el acto no es expreso, «el plazo será de seis meses». Tres meses no es el plazo del acto presunto. Un mes es el plazo de la alzada y de la reposición, no del contencioso. El acto presunto no se notifica, y su plazo se cuenta desde el día siguiente a aquel en que se produce."
  citation: "art. 46.1 LJCA"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1998-16718-art-46
- id: m01-l11-q263
  prompt:
    es: "Una disposición administrativa de carácter general se publica en el «Boletín Oficial del Estado» el jueves, 15 de octubre de 2026. ¿Hasta qué día puede impugnarse directamente ante el orden contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 16 de noviembre de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el martes, 15 de diciembre de 2026."
  - id: c
    text:
      es: "Hasta el miércoles, 16 de diciembre de 2026."
  - id: d
    text:
      es: "Hasta el jueves, 15 de abril de 2027."
  explanation:
    es: "El plazo es de dos meses «contados desde el día siguiente al de la publicación de la disposición impugnada» (art. 46.1 de la Ley 29/1998). Empieza el viernes 16 de octubre y, contado de fecha a fecha, concluye el martes 15 de diciembre de 2026, día hábil. El periodo no incluye agosto, que en el contencioso es inhábil (art. 128.2 LJCA). El 16 de diciembre añade un día al cómputo. El 16 de noviembre aplica un mes (el 15 es domingo) y el 15 de abril de 2027, seis meses."
  citation: "art. 46.1 LJCA"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-124
- id: m01-l11-q264
  prompt:
    es: "La resolución de un Ministro, que pone fin a la vía administrativa, se publica en el «Boletín Oficial del Estado» el martes, 20 de enero de 2026. ¿Hasta qué día cabe reposición y hasta cuál, sin ella, recurso contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Reposición hasta el viernes 20 de febrero y contencioso hasta el lunes 20 de abril de 2026."
  - id: b
    text:
      es: "Reposición hasta el viernes 20 de marzo y contencioso hasta el lunes 20 de julio de 2026."
  - id: c
    text:
      es: "Reposición hasta el viernes 20 de marzo y contencioso también hasta el viernes 20 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "Reposición hasta el viernes 20 de febrero y contencioso hasta el viernes 20 de marzo de 2026."
  explanation:
    es: "Contra un acto que agota la vía caben reposición potestativa o contencioso directo (art. 123.1 de la Ley 39/2015). La reposición se interpone en un mes (art. 124.1): desde el miércoles 21 de enero, concluye el viernes 20 de febrero de 2026. El contencioso se interpone en dos meses (art. 46.1 de la Ley 29/1998): concluye el viernes 20 de marzo de 2026. Los dos días son hábiles y el periodo no incluye agosto, inhábil en el contencioso (art. 128.2 LJCA). Las demás opciones dan a la reposición dos meses o al contencioso tres o seis meses."
  citation: "art. 124.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-1998-16718-art-12
- id: m01-l11-q380
  prompt:
    es: "Señale de qué actos y disposiciones conoce en única instancia la Sala de lo Contencioso-administrativo del Tribunal Supremo, según el artículo 12.1.a) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa:"
  options:
  - id: a
    text:
      es: "De los de los Ministros y los Secretarios de Estado."
  - id: b
    text:
      es: "De los de los Delegados del Gobierno en las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "De los del Consejo de Ministros y de las Comisiones Delegadas del Gobierno."
  - id: d
    text:
      es: "De los de los órganos de gobierno de las Comunidades Autónomas."
  explanation:
    es: "El artículo 12.1.a) atribuye a la Sala del Tribunal Supremo, en única instancia, los actos y disposiciones del Consejo de Ministros y de las Comisiones Delegadas del Gobierno. Los de los Ministros y Secretarios de Estado, los de los Delegados del Gobierno y los de los órganos autonómicos no se mencionan en esa letra."
  citation: "art. 12.1.a) LJCA"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1998-16718-art-6
- id: m01-l11-q402
  prompt:
    es: "Conforme al artículo 6 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, integran el orden jurisdiccional contencioso-administrativo, entre otros órganos, la Sala de lo Contencioso-administrativo de la Audiencia Nacional y:"
  options:
  - id: a
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal Constitucional."
  - id: b
    text:
      es: "Las Secciones de lo Contencioso-administrativo de las Audiencias Provinciales."
  - id: c
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "La Sala de lo Contencioso-administrativo del Tribunal Supremo."
  explanation:
    es: "El artículo 6 enumera, junto a los Juzgados, los Juzgados Centrales y las Salas de los Tribunales Superiores de Justicia, la Sala de la Audiencia Nacional y la del Tribunal Supremo. El Tribunal Constitucional y el Tribunal de Cuentas no tienen Sala de lo Contencioso-administrativo, y las Audiencias Provinciales no figuran en la lista."
  citation: "art. 6 LJCA"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
