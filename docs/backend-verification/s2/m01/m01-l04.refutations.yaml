m01-l04-q06:
  key:
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: AspectJ compile-time weaving and load-time weaving do not have this self-invocation issue because they apply advice within the bytecode instead of via a proxy.
  wrong:
  - option: They wrap the `this` reference in a proxy that is injected into the target at startup
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: In this case, there is no proxy in the first place.
  - option: They apply advice only to calls that enter through a method declared on a public interface
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Instead, the target class is woven (that is, its byte code is modified) to support @Transactional runtime behavior on any kind of method.
  - option: They have the same issue, so inner calls need the self-injection workaround as well
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: AspectJ compile-time weaving and load-time weaving do not have this self-invocation issue because they apply advice within the bytecode instead of via a proxy.
m01-l04-q07:
  key:
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: This last approach is highly discouraged, and we hesitate to point it out, in favor of the previous options.
  wrong:
  - option: Refactoring the code so that the self invocation does not happen
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: This does entail some work on your part, but it is the best, least-invasive approach.
  - option: Injecting a self reference and invoking the methods through it instead of through `this`
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: An alternative approach is to make use of self injection, and invoke methods on the proxy via the self reference instead of via this.
  - option: Switching to `AspectJ` mode, which weaves the target class and uses no proxy
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Consider using AspectJ mode (see the mode attribute in the following table) if you expect self-invocations to be wrapped with transactions as well.
m01-l04-q08:
  key:
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: In the preceding examples that use programmatic configuration, the @EnableTransactionManagement annotation switches on actual transaction management at runtime.
  wrong:
  - option: The `@Transactional` annotation itself, as soon as the bean is defined
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: However, the mere presence of the @Transactional annotation is not enough to activate the transactional behavior.
  - option: The `<tx:annotation-driven/>` element placed in the same programmatic configuration
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Whereas, in the preceding example that uses XML configuration, the <tx:annotation-driven/> element switches on actual transaction management at runtime.
  - option: A `DataSourceTransactionManager` bean declared in the configuration class and nothing else
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: In the preceding examples that use programmatic configuration, the @EnableTransactionManagement annotation switches on actual transaction management at runtime.
m01-l04-q09:
  key:
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Also, the proxy must be fully initialized to provide the expected behavior, so you should not rely on this feature in your initialization code — for example, in a @PostConstruct method.
  wrong:
  - option: Only methods with `public` visibility can be made transactional, for any kind of proxy
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: As of 6.0, protected or package-visible methods can also be made transactional for class-based proxies by default.
  - option: Only `jakarta.transaction.Transactional` is honored there, and Spring's own annotation is ignored
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: The standard jakarta.transaction.Transactional annotation is also supported as a drop-in replacement for Spring’s own annotation.
  - option: The annotation applies only to interface definitions and never to methods of a class
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: You can apply the @Transactional annotation to an interface definition, a method on an interface, a class definition, or a method on a class.
