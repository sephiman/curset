# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q035
  prompt:
    es: "Según el párrafo 18 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, la Agenda 2030 anuncia:"
  options:
  - id: a
    text:
      es: "16 Objetivos de Desarrollo Sostenible y 196 metas conexas de carácter integrado e indivisible."
  - id: b
    correct: true
    text:
      es: "17 Objetivos de Desarrollo Sostenible y 169 metas conexas de carácter integrado e indivisible."
  - id: c
    text:
      es: "17 Objetivos de Desarrollo Sostenible y 169 metas conexas de carácter voluntario y divisible."
  - id: d
    text:
      es: "18 Objetivos de Desarrollo Sostenible y 169 metas conexas de carácter integrado e indivisible."
  explanation:
    es: "El párrafo 18 dice: «Hoy anunciamos 17 Objetivos de Desarrollo Sostenible y 169 metas conexas de carácter integrado e indivisible». Las opciones de 16 y 18 Objetivos cambian las cifras. Otra cambia el carácter integrado e indivisible por voluntario y divisible."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q036
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Objetivos y las metas de la Agenda 2030 para el Desarrollo Sostenible es correcta, según su preámbulo?"
  options:
  - id: a
    text:
      es: "Conjugan dos dimensiones del desarrollo sostenible: la económica y la social."
  - id: b
    correct: true
    text:
      es: "Son de carácter integrado e indivisible."
  - id: c
    text:
      es: "Estimularán la acción durante los próximos diez años."
  - id: d
    text:
      es: "Dan por cumplidos los Objetivos de Desarrollo del Milenio."
  explanation:
    es: "El preámbulo dice que los Objetivos y las metas «son de carácter integrado e indivisible». Conjugan tres dimensiones, no dos: económica, social y ambiental. Estimularán la acción durante 15 años. No dan por cumplidos los Objetivos de Desarrollo del Milenio: pretenden «conseguir lo que estos no lograron»."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q038
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las esferas en las que los Objetivos y las metas de la Agenda 2030 estimularán la acción durante los próximos 15 años?"
  options:
  - id: a
    text:
      es: "Las personas, el planeta, la prosperidad, la paz y la justicia."
  - id: b
    text:
      es: "Las personas, el clima, la economía, la paz y las alianzas."
  - id: c
    text:
      es: "Las personas, el planeta, el crecimiento, la seguridad y las instituciones."
  - id: d
    correct: true
    text:
      es: "Las personas, el planeta, la prosperidad, la paz y las alianzas."
  explanation:
    es: "El preámbulo enumera cinco esferas: las personas, el planeta, la prosperidad, la paz y las alianzas. Una opción cambia las alianzas por la justicia. Otra cambia el planeta y la prosperidad por el clima y la economía. La de «el crecimiento, la seguridad y las instituciones» cambia tres de las cinco."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`; «Los Objetivos y las metas estimularán durante los próximos 15 años la acción en las siguientes esferas de importancia crítica pa ra la humanidad y el planeta.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q039
  prompt:
    es: "Según el párrafo 55 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, las metas de la Agenda 2030:"
  options:
  - id: a
    correct: true
    text:
      es: "Expresan las aspiraciones a nivel mundial, y cada gobierno fijará sus propias metas nacionales."
  - id: b
    text:
      es: "Son jurídicamente vinculantes, y cada gobierno las incorporará sin cambios."
  - id: c
    text:
      es: "Expresan aspiraciones mundiales, y el foro político de alto nivel fijará las metas nacionales."
  - id: d
    text:
      es: "Son obligatorias para los países en desarrollo y orientativas para los países desarrollados."
  explanation:
    es: "El párrafo 55 dice que «las metas expresan las aspiraciones a nivel mundial» y que «cada gobierno fijará sus propias metas nacionales». No las incorpora sin cambios, no da al foro político de alto nivel la fijación de metas nacionales y no distingue entre países: los Objetivos son de aplicación universal."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "competencia"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q040
  prompt:
    es: "Según el párrafo 82 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, desempeñará un papel central en la supervisión del seguimiento y examen mundial de la Agenda:"
  options:
  - id: a
    text:
      es: "El Consejo de Seguridad de las Naciones Unidas."
  - id: b
    text:
      es: "El Secretario General de las Naciones Unidas."
  - id: c
    correct: true
    text:
      es: "El foro político de alto nivel."
  - id: d
    text:
      es: "El Consejo Económico y Social de las Naciones Unidas."
  explanation:
    es: "El párrafo 82 dice que «el foro político de alto nivel desempeñará un papel central en la supervisión» de los procesos mundiales de seguimiento y examen. El Consejo Económico y Social es uno de los órganos con los que el foro coordina su labor. El Secretario General prepara el informe anual de progresos. El Consejo de Seguridad no tiene ese papel."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "órgano"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q041
  prompt:
    es: "Según el párrafo 84 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, los exámenes periódicos del foro político de alto nivel:"
  options:
  - id: a
    text:
      es: "Serán obligatorios para todos los Estados Miembros y se celebrarán cada cuatro años."
  - id: b
    text:
      es: "Serán voluntarios y se limitarán a los países en desarrollo que lo soliciten."
  - id: c
    correct: true
    text:
      es: "Serán voluntarios, aunque se alentará la presentación de informes."
  - id: d
    text:
      es: "Serán obligatorios y los dirigirá el Secretario General de las Naciones Unidas."
  explanation:
    es: "El párrafo 84 dice que «los exámenes serán voluntarios, aunque se alentará la presentación de informes». Incluyen a países desarrollados y en desarrollo, y los dirigen los Estados, no el Secretario General. No son obligatorios."
