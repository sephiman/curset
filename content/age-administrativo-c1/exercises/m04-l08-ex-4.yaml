# anchor: boe-a-2019-7414-art-27
- id: m04-l08-q073
  prompt:
    es: "Según el artículo 27.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, además del concurso abierto y permanente y del ingreso libre, los puestos vacantes cuya cobertura sea necesaria se proveen por:"
  options:
  - id: a
    text:
      es: "El procedimiento de redistribución de efectivos."
  - id: b
    text:
      es: "El procedimiento de reasignación de efectivos."
  - id: c
    text:
      es: "El procedimiento de funcionarización de puestos."
  - id: d
    correct: true
    text:
      es: "El procedimiento de promoción profesional."
  explanation:
    es: "El artículo 27.2 enumera tres procedimientos: «a) Concurso abierto y permanente. b) Promoción profesional. c) Ingreso libre». El que falta en el enunciado es la promoción profesional. La redistribución y la reasignación de efectivos son figuras de movilidad de los funcionarios que el Convenio no recoge. La funcionarización convierte puestos laborales en puestos de funcionario y tampoco es un procedimiento de provisión del Convenio."
  citation: "art. 27.2 Convenio único"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2019-7414-art-27
- id: m04-l08-q074
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los procedimientos de provisión de puestos vacantes del artículo 27.2 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Concurso abierto y permanente, redistribución de efectivos e ingreso libre."
  - id: b
    text:
      es: "Concurso abierto y permanente, promoción profesional y reasignación de efectivos."
  - id: c
    correct: true
    text:
      es: "Concurso abierto y permanente, promoción profesional e ingreso libre."
  - id: d
    text:
      es: "Reasignación de efectivos, promoción profesional e ingreso libre."
  explanation:
    es: "El artículo 27.2 dice que los puestos vacantes cuya cobertura sea necesaria se proveen por «a) Concurso abierto y permanente. b) Promoción profesional. c) Ingreso libre». Cada una de las otras enumeraciones mete una figura que el Convenio no regula: la redistribución de efectivos en lugar de la promoción profesional, o la reasignación de efectivos en lugar del ingreso libre o del concurso abierto y permanente."
  citation: "art. 27.2 Convenio único"
  difficulty: 2
  tags:
  - "procedimiento"
