# anchor: boe-a-2015-11724-art-192
- id: m04-l09-q044
  prompt:
    es: "Según el artículo 192.1 del texto refundido de la Ley General de la Seguridad Social, el subsidio por cuidado de menores con cáncer u otra enfermedad grave es el 100 por ciento de la base reguladora de incapacidad temporal:"
  options:
  - id: a
    text:
      es: "Por contingencias comunes, en proporción a la reducción que experimente la jornada"
  - id: b
    correct: true
    text:
      es: "Por contingencias profesionales, en proporción a la reducción que experimente la jornada"
  - id: c
    text:
      es: "Por contingencias profesionales, cualquiera que sea la reducción de la jornada"
  - id: d
    text:
      es: "Por contingencias comunes, cualquiera que sea la reducción de la jornada"
  explanation:
    es: "El artículo 192.1 fija «un subsidio equivalente al 100 por ciento de la base reguladora establecida para la prestación de incapacidad temporal derivada de contingencias profesionales, y en proporción a la reducción que experimente la jornada de trabajo». La base no es la de contingencias comunes, y el subsidio sí depende de cuánto se reduzca la jornada."
  citation: "art. 192.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11724-art-194
- id: m04-l09-q045
  prompt:
    es: "¿Cuál de los siguientes es uno de los grados en que se clasifica la incapacidad permanente, según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    correct: true
    text:
      es: "El grado de incapacidad permanente absoluta"
  - id: b
    text:
      es: "El grado de incapacidad permanente severa"
  - id: c
    text:
      es: "El grado de incapacidad permanente moderada"
  - id: d
    text:
      es: "El grado de incapacidad permanente cualificada"
  explanation:
    es: "El artículo 194.1 clasifica la incapacidad permanente en cuatro grados: parcial, total, absoluta y gran incapacidad. Severa y moderada no son grados de la ley. La incapacidad permanente total «cualificada» es el nombre habitual del incremento de la pensión de incapacidad permanente total del artículo 196.2, no un grado."
  citation: "art. 194.1 LGSS"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11724-art-194
- id: m04-l09-q046
  prompt:
    es: "En el Régimen General de la Seguridad Social, la incapacidad permanente, cualquiera que sea su causa determinante, se clasifica en:"
  options:
  - id: a
    text:
      es: "Tres grados, el último de los cuales es la incapacidad permanente absoluta"
  - id: b
    text:
      es: "Cinco grados, el primero de los cuales es la incapacidad permanente leve"
  - id: c
    correct: true
    text:
      es: "Cuatro grados, el último de los cuales es la gran incapacidad"
  - id: d
    text:
      es: "Cuatro grados, el primero de los cuales es la incapacidad permanente total"
  explanation:
    es: "El artículo 194.1 del texto refundido de la Ley General de la Seguridad Social enumera cuatro grados: parcial, total, absoluta y gran incapacidad, que es el último. No son tres ni cinco, la incapacidad permanente leve no es un grado y el primero de la lista es la incapacidad permanente parcial, no la total."
  citation: "art. 194.1 LGSS"
  difficulty: 1
  tags:
  - "estructura"
  - "cantidad"
# anchor: boe-a-2015-11724-art-196
- id: m04-l09-q047
  prompt:
    es: "¿En qué consiste la prestación económica por incapacidad permanente parcial en el Régimen General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Una pensión vitalicia sobre la base reguladora"
  - id: b
    text:
      es: "Una pensión temporal mientras dure la incapacidad"
  - id: c
    text:
      es: "Una pensión vitalicia con un complemento por ayuda"
  - id: d
    correct: true
    text:
      es: "Una cantidad a tanto alzado"
  explanation:
    es: "El artículo 196.1 dice que la prestación por incapacidad permanente parcial «consistirá en una cantidad a tanto alzado». La pensión vitalicia corresponde a la total y a la absoluta, y la pensión vitalicia con complemento a la gran incapacidad. La ley no prevé una pensión temporal para este grado."
  citation: "art. 196.1 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-196
- id: m04-l09-q048
  prompt:
    es: "¿Cuándo puede sustituirse excepcionalmente por una indemnización a tanto alzado la pensión vitalicia por incapacidad permanente total del Régimen General?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el beneficiario sea menor de sesenta años"
  - id: b
    text:
      es: "Cuando el beneficiario sea menor de cincuenta y cinco años"
  - id: c
    text:
      es: "Cuando el beneficiario sea mayor de sesenta años"
  - id: d
    text:
      es: "Cuando el beneficiario sea menor de sesenta y cinco años"
  explanation:
    es: "El artículo 196.2 dice que la pensión vitalicia «podrá excepcionalmente ser sustituida por una indemnización a tanto alzado cuando el beneficiario fuese menor de sesenta años». La edad es sesenta años, no cincuenta y cinco ni sesenta y cinco, y el beneficiario debe ser menor de esa edad, no mayor."
  citation: "art. 196.2 LGSS"
  difficulty: 3
  tags:
  - "excepción"
  - "cantidad"
# anchor: boe-a-2015-11724-art-196
- id: m04-l09-q049
  prompt:
    es: "Señale la respuesta correcta sobre la prestación económica de cada grado de incapacidad permanente, según el artículo 196 del texto refundido de la Ley General de la Seguridad Social:"
  options:
  - id: a
    text:
      es: "Incapacidad permanente parcial: una pensión vitalicia"
  - id: b
    correct: true
    text:
      es: "Incapacidad permanente absoluta: una pensión vitalicia"
  - id: c
    text:
      es: "Incapacidad permanente total: una cantidad a tanto alzado en todo caso"
  - id: d
    text:
      es: "Incapacidad permanente absoluta: una cantidad a tanto alzado"
  explanation:
    es: "El artículo 196.3 dice que la prestación por incapacidad permanente absoluta «consistirá en una pensión vitalicia». La parcial es una cantidad a tanto alzado, no una pensión. La total es una pensión vitalicia, que solo excepcionalmente se sustituye por una indemnización a tanto alzado si el beneficiario es menor de sesenta años. La absoluta no se paga a tanto alzado."
  citation: "art. 196.3 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-196
- id: m04-l09-q050
  prompt:
    es: "¿A qué se destina el complemento que incrementa la pensión vitalicia de quien es calificado en el grado de gran incapacidad?"
  options:
  - id: a
    text:
      es: "Adaptar su vivienda a sus necesidades de movilidad"
  - id: b
    text:
      es: "Costear la asistencia sanitaria que no cubra el sistema"
  - id: c
    correct: true
    text:
      es: "Remunerar a la persona que le atienda"
  - id: d
    text:
      es: "Compensar la pérdida de la indemnización a tanto alzado"
  explanation:
    es: "El artículo 196.4 incrementa la pensión «con un complemento, destinado a que el inválido pueda remunerar a la persona que le atienda»; el artículo usa aún la palabra «inválido» para la gran incapacidad. El complemento no se destina a adaptar la vivienda ni a costear asistencia sanitaria, y no compensa ninguna indemnización a tanto alzado."
  citation: "art. 196.4 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-205
- id: m04-l09-q051
  prompt:
    es: "Según el artículo 205.1.a) del texto refundido de la Ley General de la Seguridad Social, con las edades que rigen a partir de 2027, la pensión de jubilación exige haber cumplido:"
  options:
  - id: a
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y siete años cotizados"
  - id: b
    text:
      es: "Sesenta y cinco años, o sesenta y siete si no se acreditan treinta y cinco años cotizados"
  - id: c
    text:
      es: "Sesenta y siete años, o sesenta y tres con treinta y ocho años y seis meses cotizados"
  - id: d
    correct: true
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y ocho años y seis meses cotizados"
  explanation:
    es: "El artículo 205.1.a) exige «haber cumplido sesenta y siete años de edad, o sesenta y cinco años cuando se acrediten treinta y ocho años y seis meses de cotización», sin contar la parte proporcional de las pagas extraordinarias; la disposición transitoria séptima aplica esas edades a partir de 2027. Treinta y siete y treinta y cinco años no son la cotización que exige el artículo, y la edad reducida es de sesenta y cinco años, no de sesenta y tres."
  citation: "art. 205.1.a) LGSS"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-205
- id: m04-l09-q053
  prompt:
    es: "De acuerdo con el artículo 205.1.b) del texto refundido de la Ley General de la Seguridad Social, el período mínimo de cotización para la pensión contributiva de jubilación es de:"
  options:
  - id: a
    text:
      es: "Quince años, de los cuales al menos dos dentro de los diez inmediatamente anteriores al momento de causar el derecho"
  - id: b
    correct: true
    text:
      es: "Quince años, de los cuales al menos dos dentro de los quince inmediatamente anteriores al momento de causar el derecho"
  - id: c
    text:
      es: "Quince años, de los cuales al menos cinco dentro de los quince inmediatamente anteriores al momento de causar el derecho"
  - id: d
    text:
      es: "Veinte años, de los cuales al menos dos dentro de los quince inmediatamente anteriores al momento de causar el derecho"
  explanation:
    es: "El artículo 205.1.b) exige «un período mínimo de cotización de quince años, de los cuales al menos dos deberán estar comprendidos dentro de los quince años inmediatamente anteriores al momento de causar el derecho». El período total es de quince años, no de veinte. Los años recientes son dos, no cinco, y se cuentan dentro de los quince últimos, no de los diez."
  citation: "art. 205.1.b) LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-205
- id: m04-l09-q054
  prompt:
    es: "Según el artículo 205.1.b) del texto refundido de la Ley General de la Seguridad Social, si se accede a la pensión desde el alta o situación asimilada sin obligación de cotizar, ¿dónde deben estar los dos años recientes?"
  options:
  - id: a
    text:
      es: "Dentro de los quince años inmediatamente anteriores a la fecha de la solicitud de la pensión"
  - id: b
    text:
      es: "Dentro de los diez años inmediatamente anteriores a la fecha en que cesó la obligación de cotizar"
  - id: c
    text:
      es: "Dentro de los quince años inmediatamente anteriores al cumplimiento de la edad ordinaria"
  - id: d
    correct: true
    text:
      es: "Dentro de los quince años inmediatamente anteriores a la fecha en que cesó la obligación de cotizar"
  explanation:
    es: "El artículo 205.1.b) dice que, en ese caso, el período de dos años «deberá estar comprendido dentro de los quince años inmediatamente anteriores a la fecha en que cesó la obligación de cotizar». La referencia no es la solicitud ni el cumplimiento de la edad, y el período es de quince años, no de diez."
  citation: "art. 205.1.b) LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11724-art-215
- id: m04-l09-q055
  prompt:
    es: "Según el artículo 215.2.a) del texto refundido de la Ley General de la Seguridad Social, en la jubilación parcial con contrato de relevo, la cotización exigida se reduce a veinticinco años para las personas con discapacidad en grado:"
  options:
  - id: a
    text:
      es: "Igual o superior al 45 por ciento"
  - id: b
    text:
      es: "Igual o superior al 65 por ciento"
  - id: c
    correct: true
    text:
      es: "Igual o superior al 33 por ciento"
  - id: d
    text:
      es: "Igual o superior al 50 por ciento"
  explanation:
    es: "El artículo 215.2.a) dice que, «en el supuesto de personas con discapacidad en grado igual o superior al 33 por ciento», el período de cotización de treinta y tres años «se reducirá al de veinticinco años». El cuarenta y cinco, el sesenta y cinco y el cincuenta por ciento no son el grado que fija el artículo."
  citation: "art. 215.2.a) LGSS"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-215
- id: m04-l09-q056
  prompt:
    es: "De acuerdo con el artículo 215.2.a) del texto refundido de la Ley General de la Seguridad Social, con contrato de relevo simultáneo, el trabajador a tiempo completo puede jubilarse parcialmente con una edad inferior a la ordinaria en:"
  options:
  - id: a
    correct: true
    text:
      es: "Tres años, como máximo, en la fecha del hecho causante"
  - id: b
    text:
      es: "Dos años, como máximo, en la fecha del hecho causante"
  - id: c
    text:
      es: "Cuatro años, como máximo, en la fecha del hecho causante"
  - id: d
    text:
      es: "Cinco años, como máximo, en la fecha del hecho causante"
  explanation:
    es: "El artículo 215.2.a) exige «tener cumplida en la fecha del hecho causante una edad que sea inferior en tres años, como máximo, a la edad que en cada caso resulte de aplicación». Dos, cuatro y cinco años no son la cifra del artículo."
  citation: "art. 215.2.a) LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-art-215
- id: m04-l09-q057
  prompt:
    es: "Señale la respuesta correcta sobre el período de cotización de la jubilación parcial con contrato de relevo, según el artículo 215.2.a) del texto refundido de la Ley General de la Seguridad Social:"
  options:
  - id: a
    text:
      es: "Se tienen en cuenta las bonificaciones de edad, pero no las pagas extraordinarias"
  - id: b
    correct: true
    text:
      es: "No se tienen en cuenta las bonificaciones o anticipaciones de la edad de jubilación"
  - id: c
    text:
      es: "Se tiene en cuenta la parte proporcional de las pagas extraordinarias"
  - id: d
    text:
      es: "Se computan las anticipaciones de edad que correspondan por la actividad"
  explanation:
    es: "El artículo 215.2.a) exige el período de cotización «sin que, a tales efectos, se tengan en cuenta las bonificaciones o anticipaciones de la edad de jubilación que pudieran ser de aplicación al interesado, ni la parte proporcional correspondiente por pagas extraordinarias». Ni las bonificaciones, ni las anticipaciones, ni las pagas extraordinarias cuentan, así que las otras tres opciones son incorrectas."
  citation: "art. 215.2.a) LGSS"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-216
- id: m04-l09-q058
  prompt:
    es: "En caso de muerte por enfermedad común, ¿cuál de las siguientes prestaciones puede reconocerse según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Una indemnización a tanto alzado por la muerte"
  - id: b
    text:
      es: "Un subsidio vitalicio de viudedad"
  - id: c
    text:
      es: "Una pensión temporal en favor de familiares"
  - id: d
    correct: true
    text:
      es: "Una prestación temporal de viudedad"
  explanation:
    es: "El artículo 216.1 prevé, en caso de muerte, cualquiera que sea su causa, «una prestación temporal de viudedad», entre otras. La indemnización a tanto alzado se reconoce solo cuando la muerte la causa un accidente de trabajo o una enfermedad profesional (artículo 216.2). La viudedad vitalicia es una pensión, no un subsidio, y en favor de familiares la pensión es vitalicia y lo temporal es el subsidio."
  citation: "art. 216.1 LGSS"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-216
- id: m04-l09-q059
  prompt:
    es: "Según el artículo 216.2 del texto refundido de la Ley General de la Seguridad Social, en caso de muerte causada por accidente de trabajo o enfermedad profesional se reconoce, además:"
  options:
  - id: a
    correct: true
    text:
      es: "Una indemnización a tanto alzado"
  - id: b
    text:
      es: "Un auxilio por defunción de cuantía doble"
  - id: c
    text:
      es: "Una pensión vitalicia en favor de los herederos"
  - id: d
    text:
      es: "Un complemento de la pensión de viudedad"
  explanation:
    es: "El artículo 216.2 dice que en ese caso «se reconocerá, además, una indemnización a tanto alzado». El artículo no duplica el auxilio por defunción ni añade un complemento a la viudedad. La pensión vitalicia en favor de familiares es una de las prestaciones generales del artículo 216.1, no la que se añade."
  citation: "art. 216.2 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-264
- id: m04-l09-q061
  prompt:
    es: "Un funcionario interino de la Administración General del Estado cesa en su puesto. ¿Está comprendido en la protección por desempleo de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "No, porque los funcionarios públicos están excluidos de la protección por desempleo"
  - id: b
    correct: true
    text:
      es: "Sí, siempre que tenga previsto cotizar por la contingencia de desempleo"
  - id: c
    text:
      es: "Sí, pero solo en el nivel asistencial y si tiene responsabilidades familiares"
  - id: d
    text:
      es: "Sí, pero solo si ha ocupado una plaza vacante durante más de un año"
  explanation:
    es: "El artículo 264.1.d) del texto refundido de la Ley General de la Seguridad Social comprende en la protección por desempleo a «los funcionarios interinos», «siempre que tengan previsto cotizar por esta contingencia». Los interinos no están excluidos. El artículo no los limita al nivel asistencial ni exige un año en una plaza vacante."
  citation: "art. 264.1.d) LGSS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-264
- id: m04-l09-q062
  prompt:
    es: "¿Cuál de los siguientes colectivos está comprendido en la protección por desempleo, siempre que tenga previsto cotizar por ella, según el artículo 264.1 del texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Los funcionarios de carrera de las administraciones públicas"
  - id: b
    text:
      es: "Los altos cargos que tengan la condición de funcionarios públicos"
  - id: c
    correct: true
    text:
      es: "El personal eventual de las administraciones públicas"
  - id: d
    text:
      es: "Los funcionarios de carrera en situación de servicios especiales"
  explanation:
    es: "La letra d) del artículo 264.1 comprende a «los funcionarios interinos, el personal eventual, así como el personal contratado en su momento en régimen de derecho administrativo». Los funcionarios de carrera no están en la lista, tampoco en servicios especiales. La letra f) comprende a los altos cargos que no sean funcionarios públicos, no a los que lo son."
  citation: "art. 264.1.d) LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-264
- id: m04-l09-q063
  prompt:
    es: "¿Cuál de los siguientes colectivos está comprendido en la protección por desempleo, siempre que tenga previsto cotizar por ella, según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Los trabajadores por cuenta propia del Régimen Especial de Trabajadores Autónomos"
  - id: b
    text:
      es: "Los consejeros y administradores de sociedades de capital con funciones de dirección"
  - id: c
    text:
      es: "Los funcionarios de carrera incluidos en el Régimen de Clases Pasivas del Estado"
  - id: d
    correct: true
    text:
      es: "Los trabajadores emigrantes que retornen a España y los liberados de prisión"
  explanation:
    es: "El artículo 264.1.c) comprende a «los trabajadores emigrantes que retornen a España y los liberados de prisión». Los autónomos no son trabajadores por cuenta ajena: su protección es la de cese de actividad. El artículo 136.2.c) excluye de la protección por desempleo a los consejeros y administradores con funciones de dirección y gerencia. Los funcionarios de carrera de Clases Pasivas no están entre los colectivos del artículo 264.1."
  citation: "art. 264.1 LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-268
- id: m04-l09-q064
  prompt:
    es: "¿En qué plazo debe solicitarse la prestación por desempleo para que el derecho nazca a partir de la situación legal de desempleo?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro del plazo de los quince días siguientes"
  - id: b
    text:
      es: "Dentro del plazo de los diez días siguientes"
  - id: c
    text:
      es: "Dentro del plazo de los treinta días siguientes"
  - id: d
    text:
      es: "Dentro del plazo de un mes desde el cese"
  explanation:
    es: "El artículo 268.1 dice que el derecho «nacerá a partir de que se produzca la situación legal de desempleo, siempre que se solicite dentro del plazo de los quince días siguientes». Diez días, treinta días y un mes no son el plazo del artículo."
  citation: "art. 268.1 LGSS"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11724-art-270
- id: m04-l09-q065
  prompt:
    es: "La cuantía de la prestación contributiva por desempleo de la Seguridad Social se determina aplicando a la base reguladora:"
  options:
  - id: a
    text:
      es: "El 70 por ciento los ciento ochenta primeros días y el 50 por ciento desde el día ciento ochenta y uno"
  - id: b
    text:
      es: "El 75 por ciento los ciento ochenta primeros días y el 60 por ciento desde el día ciento ochenta y uno"
  - id: c
    correct: true
    text:
      es: "El 70 por ciento los ciento ochenta primeros días y el 60 por ciento desde el día ciento ochenta y uno"
  - id: d
    text:
      es: "El 70 por ciento los noventa primeros días y el 60 por ciento desde el día noventa y uno"
  explanation:
    es: "El artículo 270.2 aplica a la base reguladora «el 70 por ciento durante los ciento ochenta primeros días y el 60 por ciento a partir del día ciento ochenta y uno». El segundo tramo es del sesenta por ciento, no del cincuenta. El primero es del setenta por ciento, no del setenta y cinco, y dura ciento ochenta días, no noventa."
  citation: "art. 270.2 LGSS"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11724-art-237
- id: m04-l09-q066
  prompt:
    es: "Según el artículo 237.1 del texto refundido de la Ley General de la Seguridad Social, tienen la consideración de período de cotización efectiva los períodos de excedencia por cuidado de cada hijo o menor acogido de hasta:"
  options:
  - id: a
    text:
      es: "Dos años de excedencia por cada hijo o menor"
  - id: b
    text:
      es: "Un año de excedencia por cada hijo o menor"
  - id: c
    text:
      es: "Tres años de excedencia en total, sea cual sea el número de hijos"
  - id: d
    correct: true
    text:
      es: "Tres años de excedencia por cada hijo o menor"
  explanation:
    es: "El artículo 237.1 considera cotización efectiva «los períodos de hasta tres años de excedencia» que se disfruten «en razón del cuidado de cada hijo o menor». Son tres años, no uno ni dos, y se cuentan por cada hijo o menor, no en total."
  citation: "art. 237.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2015-11724-art-237
- id: m04-l09-q067
  prompt:
    es: "Según el artículo 237.1 del texto refundido de la Ley General de la Seguridad Social, ¿a efectos de qué prestaciones se consideran cotización efectiva los períodos de hasta tres años de excedencia por cuidado de hijo?"
  options:
  - id: a
    text:
      es: "Jubilación, incapacidad permanente, desempleo, maternidad y paternidad"
  - id: b
    correct: true
    text:
      es: "Jubilación, incapacidad permanente, muerte y supervivencia, maternidad y paternidad"
  - id: c
    text:
      es: "Jubilación, incapacidad temporal, muerte y supervivencia, maternidad y paternidad"
  - id: d
    text:
      es: "Solo jubilación e incapacidad permanente, no muerte y supervivencia"
  explanation:
    es: "El artículo 237.1 los considera cotización efectiva «a efectos de las correspondientes prestaciones de la Seguridad Social por jubilación, incapacidad permanente, muerte y supervivencia, maternidad y paternidad»; maternidad y paternidad son las palabras del artículo. El desempleo y la incapacidad temporal no están en la lista, y muerte y supervivencia sí lo están."
  citation: "art. 237.1 LGSS"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11724-art-207
- id: m04-l09-q068
  prompt:
    es: "Conforme al artículo 207.1 del texto refundido de la Ley General de la Seguridad Social, la jubilación anticipada por causa no imputable al trabajador exige una edad inferior, como máximo, a la del artículo 205.1.a) en:"
  options:
  - id: a
    text:
      es: "dos años."
  - id: b
    correct: true
    text:
      es: "cuatro años."
  - id: c
    text:
      es: "tres años."
  - id: d
    text:
      es: "cinco años."
  explanation:
    es: "El artículo 207.1.a) exige «una edad que sea inferior en cuatro años, como máximo» a la que resulte del artículo 205.1.a). Los dos años son el margen de la jubilación anticipada por voluntad del interesado, del artículo 208.1. Tres y cinco años no figuran en el artículo."
  citation: "art. 207.1 LGSS"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11724-art-207
- id: m04-l09-q069
  prompt:
    es: "Según el artículo 207.1 del texto refundido de la Ley General de la Seguridad Social, el acceso a la jubilación anticipada por causa no imputable al trabajador exige acreditar un período mínimo de cotización efectiva de:"
  options:
  - id: a
    text:
      es: "35 años, sin contar la parte proporcional por pagas extraordinarias."
  - id: b
    text:
      es: "33 años, contando la parte proporcional por pagas extraordinarias."
  - id: c
    text:
      es: "38 años y 6 meses, sin contar la parte proporcional por pagas extraordinarias."
  - id: d
    correct: true
    text:
      es: "33 años, sin contar la parte proporcional por pagas extraordinarias."
  explanation:
    es: "El artículo 207.1.c) pide «un período mínimo de cotización efectiva de 33 años, sin que, a tales efectos, se tenga en cuenta la parte proporcional por pagas extraordinarias». Los 35 años son la cifra de la jubilación anticipada por voluntad del interesado, del artículo 208.1. Contar la parte proporcional contradice el artículo. Los 38 años y 6 meses son el umbral de la edad de jubilación ordinaria, no el de esta modalidad."
  citation: "art. 207.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2015-11724-art-207
- id: m04-l09-q070
  prompt:
    es: "De acuerdo con el artículo 207.1 del texto refundido de la Ley General de la Seguridad Social, ¿cuál de las siguientes causas de cese en el trabajo permite acceder a la jubilación anticipada por causa no imputable al trabajador?"
  options:
  - id: a
    correct: true
    text:
      es: "El despido por causas objetivas conforme al artículo 52 del Estatuto de los Trabajadores."
  - id: b
    text:
      es: "El despido disciplinario declarado procedente por el órgano de la jurisdicción social competente."
  - id: c
    text:
      es: "La finalización del contrato temporal por expiración del tiempo convenido en él."
  - id: d
    text:
      es: "La dimisión del trabajador sin una causa legal que la justifique ante la empresa."
  explanation:
    es: "El artículo 207.1.d).2.ª incluye «el despido por causas objetivas conforme al artículo 52» del Estatuto de los Trabajadores. El despido disciplinario declarado procedente, el fin de un contrato temporal por expiración del tiempo convenido y la dimisión sin causa legal no figuran entre las siete causas que enumera el artículo."
  citation: "art. 207.1 LGSS"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
