# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0256
  prompt:
    es: "¿Qué puede acordar el órgano competente antes de dictar el acto de liquidación en el acta de disconformidad, según el artículo 157.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La ratificación de las medidas cautelares adoptadas durante las actuaciones."
  - id: b
    text:
      es: "La revocación de la conformidad parcial manifestada por el obligado en el acta."
  - id: c
    correct: true
    text:
      es: "La práctica de actuaciones complementarias en los términos que se fijen reglamentariamente."
  - id: d
    text:
      es: "La apertura de un nuevo plazo de 10 días para que se formalice un acta con acuerdo sobre los elementos discutidos."
  explanation:
    es: "Antes de la liquidación el órgano competente puede acordar actuaciones complementarias en los términos del reglamento (art. 157.4). La ratificación de medidas cautelares tiene su propio plazo, la conformidad no se revoca y no se reabre el acta con acuerdo."
  citation: "art. 157.4 LGT"
  difficulty: 2
  tags:
  - "actas de disconformidad"
  - "actuaciones complementarias"
# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0257
  prompt:
    es: "Según el artículo 157.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, recibidas las alegaciones al acta de disconformidad, el órgano competente dictará la liquidación que proceda, que será:"
  options:
  - id: a
    text:
      es: "Remitida al actuario para su ratificación."
  - id: b
    correct: true
    text:
      es: "Notificada al interesado."
  - id: c
    text:
      es: "Comunicada al órgano de recaudación."
  - id: d
    text:
      es: "Sometida a un nuevo trámite de audiencia."
  explanation:
    es: "Con las alegaciones recibidas, el órgano competente dicta la liquidación y se notifica al interesado (art. 157.5). No necesita ratificación del actuario ni un nuevo trámite de audiencia, y la comunicación al órgano de recaudación es posterior."
  citation: "art. 157.5 LGT"
  difficulty: 1
  tags:
  - "actas de disconformidad"
  - "liquidación"
# anchor: boe-a-2003-23186-art-158
- id: m03-l08-q0258
  prompt:
    es: "De acuerdo con el artículo 158.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando resulte aplicable el método de estimación indirecta, la inspección de los tributos acompañará a las actas incoadas para regularizar la situación tributaria de los obligados:"
  options:
  - id: a
    correct: true
    text:
      es: "Un informe razonado sobre las causas, la contabilidad, la justificación de los medios elegidos y los cálculos efectuados."
  - id: b
    text:
      es: "Un informe del actuario, que podrá acompañarse cuando sea preciso completar la información del acta."
  - id: c
    text:
      es: "Un informe razonado sobre las causas de la estimación objetiva y la situación de los registros del obligado."
  - id: d
    text:
      es: "Una propuesta de sanción con la reducción del artículo 188.1 y la renuncia a la tramitación separada."
  explanation:
    es: "Con estimación indirecta la inspección acompaña un informe razonado sobre las causas, la situación de la contabilidad y registros, la justificación de los medios elegidos y los cálculos (art. 158.1). El informe del actuario es facultativo en la disconformidad, la estimación objetiva es un método distinto y la propuesta de sanción es contenido del acta con acuerdo."
  citation: "art. 158.1 LGT"
  difficulty: 2
  tags:
  - "estimación indirecta"
  - "informe razonado"
# anchor: boe-a-2003-23186-art-158
- id: m03-l08-q0259
  prompt:
    es: "Conforme al artículo 158.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿sobre cuál de las siguientes materias versa el informe razonado que acompaña a las actas cuando resulta aplicable la estimación indirecta?"
  options:
  - id: a
    text:
      es: "La existencia de indicios de infracciones tributarias en la conducta del obligado."
  - id: b
    text:
      es: "El carácter provisional o definitivo de la liquidación que se derive del acta."
  - id: c
    correct: true
    text:
      es: "La situación de la contabilidad y registros obligatorios del obligado tributario."
  - id: d
    text:
      es: "La valoración jurídica de las alegaciones presentadas durante el procedimiento."
  explanation:
    es: "El informe razonado versa sobre las causas de la estimación indirecta, la situación de la contabilidad y registros, la justificación de los medios elegidos y los cálculos (art. 158.1). Los indicios de infracción son mención del acta, y el carácter de la liquidación y la valoración de alegaciones son menciones del reglamento (art. 176.1)."
  citation: "art. 158.1 LGT"
  difficulty: 2
  tags:
  - "estimación indirecta"
  - "informe razonado"
# anchor: boe-a-2003-23186-art-158
- id: m03-l08-q0261
  prompt:
    es: "Conforme al artículo 158.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la aplicación del método de estimación indirecta no requerirá acto administrativo previo que lo declare, pero su procedencia podrá plantearse:"
  options:
  - id: a
    text:
      es: "En el trámite de audiencia, mediante escrito dirigido al actuario antes de la formalización del acta."
  - id: b
    text:
      es: "Mediante recurso independiente contra el informe razonado que acompañe a las actas."
  - id: c
    text:
      es: "Ante el órgano competente para liquidar, en el plazo de cinco días desde la notificación del acta."
  - id: d
    correct: true
    text:
      es: "En los recursos y reclamaciones que procedan contra los actos y liquidaciones resultantes."
  explanation:
    es: "La procedencia de la estimación indirecta se discute en los recursos y reclamaciones contra los actos y liquidaciones resultantes (art. 158.2). No hay un acto previo que declare el método, y el informe razonado ni se recurre aparte ni hay plazo especial de cinco días."
  citation: "art. 158.2 LGT"
  difficulty: 2
  tags:
  - "estimación indirecta"
  - "recursos"
# anchor: boe-a-2003-23186-art-101
- id: m03-l08-q0262
  prompt:
    es: "Según el artículo 101.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, tienen la consideración de definitivas las liquidaciones practicadas en el procedimiento inspector:"
  options:
  - id: a
    text:
      es: "Previa comprobación de los elementos declarados por el obligado, aunque otros elementos de la obligación queden sin investigar."
  - id: b
    text:
      es: "Cuando el alcance de las actuaciones sea general, incluso si algún elemento depende de otras obligaciones no comprobadas."
  - id: c
    correct: true
    text:
      es: "Previa comprobación e investigación de la totalidad de los elementos de la obligación tributaria, salvo los supuestos de liquidación provisional."
  - id: d
    text:
      es: "Cuando el obligado haya prestado su conformidad con la propuesta de regularización, aunque la comprobación sea parcial."
  explanation:
    es: "Es definitiva la liquidación practicada tras comprobar e investigar la totalidad de los elementos de la obligación, salvo los supuestos del apartado 4 (art. 101.3.a). Comprobar solo lo declarado, tener alcance general con elementos pendientes o la conformidad con una comprobación parcial no bastan."
  citation: "art. 101.3 LGT"
  difficulty: 2
  tags:
  - "liquidaciones"
  - "definitivas"
# anchor: boe-a-2007-15984-art-190
- id: m03-l08-q0264
  prompt:
    es: "De acuerdo con el artículo 190.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cuál de las siguientes causas puede dar lugar a una liquidación provisional por no haber sido posible la comprobación definitiva de elementos de la obligación?"
  options:
  - id: a
    text:
      es: "Que el obligado tributario haya presentado alegaciones contra la propuesta de regularización."
  - id: b
    correct: true
    text:
      es: "Que exista una reclamación judicial o proceso penal que afecte a los hechos comprobados."
  - id: c
    text:
      es: "Que el órgano competente para liquidar haya ratificado una medida cautelar sobre los libros."
  - id: d
    text:
      es: "Que se haya extendido un acta con acuerdo sobre un elemento de la obligación tributaria."
  explanation:
    es: "La letra a) del artículo 190.3 incluye la reclamación judicial o el proceso penal que afecte a los hechos comprobados. Las alegaciones del obligado y la ratificación de medidas cautelares no impiden comprobar los elementos, y el acta con acuerdo sobre parte de la obligación es otro supuesto, el del artículo 101.4.b de la Ley."
  citation: "art. 190.3 RGAT"
  difficulty: 2
  tags:
  - "liquidaciones"
  - "provisionales"
# anchor: boe-a-2007-15984-art-190
- id: m03-l08-q0265
  prompt:
    es: "Según el artículo 190.3.b del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la liquidación puede ser provisional cuando no se haya podido finalizar la comprobación por no haberse obtenido los datos solicitados a terceros o no haberse recibido:"
  options:
  - id: a
    correct: true
    text:
      es: "Los datos, informes, dictámenes o documentos solicitados a otra Administración."
  - id: b
    text:
      es: "Los datos, informes o documentos solicitados al propio obligado tributario en el tercer requerimiento."
  - id: c
    text:
      es: "Las alegaciones y pruebas que el obligado debía aportar en el trámite de audiencia."
  - id: d
    text:
      es: "El informe del actuario que debe acompañar al acta de disconformidad."
  explanation:
    es: "La letra b) del artículo 190.3 habla de datos solicitados a terceros o de datos, informes, dictámenes o documentos solicitados a otra Administración. Lo que debe aportar el obligado tiene su propio régimen de extensión del plazo (art. 150.5 LGT), y el informe del actuario no es una causa de provisionalidad."
  citation: "art. 190.3 RGAT"
  difficulty: 2
  tags:
  - "liquidaciones"
  - "provisionales"
# anchor: boe-a-2007-15984-art-190
- id: m03-l08-q0266
  prompt:
    es: "Conforme al artículo 190.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el carácter de las liquidaciones derivadas de las actuaciones de comprobación e investigación:"
  options:
  - id: a
    text:
      es: "Las de alcance parcial son definitivas cuando el obligado presta su conformidad, y las de alcance general son siempre definitivas."
  - id: b
    text:
      es: "Las de alcance parcial son siempre definitivas, y las de alcance general son provisionales salvo en los casos de los apartados 2, 3 y 4."
  - id: c
    text:
      es: "Las de alcance general y las de alcance parcial son provisionales mientras no adquieran firmeza en vía administrativa."
  - id: d
    correct: true
    text:
      es: "Las de alcance parcial son siempre provisionales, y las de alcance general son definitivas salvo en los casos de los apartados 2, 3 y 4."
  explanation:
    es: "Las liquidaciones de alcance parcial son siempre provisionales y las de alcance general definitivas, salvo los casos de los apartados 2, 3 y 4 del artículo 190 (art. 190.1). La conformidad no cambia el carácter, no se invierte la regla y la firmeza no determina si son provisionales o definitivas."
  citation: "art. 190.1 RGAT"
  difficulty: 2
  tags:
  - "liquidaciones"
  - "alcance"
# anchor: boe-a-2007-15984-art-190
- id: m03-l08-q0267
  prompt:
    es: "Según el artículo 190.6 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, los elementos comprobados en actuaciones que terminaron con liquidación provisional no se regularizan de nuevo en un procedimiento posterior, salvo las circunstancias de los apartados 2 y 3 y:"
  options:
  - id: a
    correct: true
    text:
      es: "Exclusivamente en relación con los elementos de la obligación tributaria afectados por dichas circunstancias."
  - id: b
    text:
      es: "Respecto de todos los elementos de la obligación tributaria comprobados en las actuaciones anteriores."
  - id: c
    text:
      es: "Siempre que el procedimiento posterior se inicie antes de transcurridos seis meses desde la liquidación provisional del obligado."
  - id: d
    text:
      es: "Con la autorización del órgano competente para liquidar, que se notificará al obligado tributario."
  explanation:
    es: "La nueva regularización solo alcanza a los elementos afectados por las circunstancias de los apartados 2 y 3 (art. 190.6). No se reabre toda la obligación, no hay un plazo de seis meses y no se exige autorización del órgano que liquida."
  citation: "art. 190.6 RGAT"
  difficulty: 2
  tags:
  - "liquidaciones"
  - "provisionales"
  - "nueva regularización"
# anchor: boe-a-2007-15984-art-191
- id: m03-l08-q0268
  prompt:
    es: "Según el artículo 191.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la liquidación del procedimiento inspector incorporará los intereses de demora hasta el día en que se dicte o se entienda dictada, sin perjuicio de que:"
  options:
  - id: a
    text:
      es: "No se exijan intereses de demora desde el inicio del procedimiento hasta que se formalice el acta de inspección."
  - id: b
    text:
      es: "Se reduzcan a la mitad los intereses de demora devengados desde la apertura del trámite de audiencia previo a las actas."
  - id: c
    correct: true
    text:
      es: "No se exijan intereses de demora desde que se produzca el incumplimiento del plazo de duración hasta la finalización del procedimiento."
  - id: d
    text:
      es: "No se exijan intereses de demora sobre las cantidades ingresadas por el obligado antes de la notificación de la liquidación ni sobre las sanciones impuestas."
  explanation:
    es: "La salvedad del artículo 191.1 es el artículo 150.6 de la Ley: no se exigen intereses desde el incumplimiento del plazo de duración hasta que termine el procedimiento. No hay exención desde el inicio hasta el acta ni reducción a la mitad. Los ingresos posteriores al inicio dejan de devengar intereses por el artículo 87.5, no los anteriores a la liquidación."
  citation: "art. 191.1 RGAT"
  difficulty: 2
  tags:
  - "intereses de demora"
  - "liquidación"
# anchor: boe-a-2007-15984-art-191
- id: m03-l08-q0269
  prompt:
    es: "De acuerdo con el artículo 191.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el cálculo de los intereses de demora en las actas de disconformidad:"
  options:
  - id: a
    text:
      es: "Se calculan hasta el día en que deba entenderse dictada la liquidación por transcurso del plazo legal."
  - id: b
    correct: true
    text:
      es: "Se calculan hasta la conclusión del plazo establecido para formular alegaciones."
  - id: c
    text:
      es: "Se calculan hasta la fecha en que se extiende el acta de disconformidad por la inspección."
  - id: d
    text:
      es: "Se calculan hasta la notificación al obligado de la liquidación que dicte el órgano competente."
  explanation:
    es: "En las actas de disconformidad los intereses llegan hasta la conclusión del plazo para formular alegaciones (art. 191.2). Hasta el día en que se entiende dictada la liquidación por transcurso del plazo legal es la regla de las actas con acuerdo y de conformidad. Ni la fecha del acta ni la notificación de la liquidación son los límites."
  citation: "art. 191.2 RGAT"
  difficulty: 2
  tags:
  - "intereses de demora"
  - "disconformidad"
# anchor: boe-a-2007-15984-art-191
- id: m03-l08-q0270
  prompt:
    es: "¿Hasta cuándo se calculan los intereses de demora en las actas con acuerdo y de conformidad, según el artículo 191.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el día en que deba entenderse dictada la liquidación por transcurso del plazo legalmente establecido."
  - id: b
    text:
      es: "Hasta el día en que el obligado suscriba el acta con acuerdo o de conformidad ante la inspección."
  - id: c
    text:
      es: "Hasta la conclusión del plazo establecido para que el obligado formule alegaciones contra la propuesta de regularización del acta."
  - id: d
    text:
      es: "Hasta el día en que se notifique al obligado la liquidación que rectifique los errores materiales."
  explanation:
    es: "En las actas con acuerdo y de conformidad los intereses se calculan hasta el día en que deba entenderse dictada la liquidación por transcurso del plazo legal (art. 191.2). La suscripción del acta, el plazo de alegaciones, propio de la disconformidad, y la notificación de una liquidación rectificadora no son el límite."
  citation: "art. 191.2 RGAT"
  difficulty: 2
  tags:
  - "intereses de demora"
  - "con acuerdo"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0273
  prompt:
    es: "Según el artículo 155.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre con el depósito realizado una vez confirmadas las propuestas del acta con acuerdo?"
  options:
  - id: a
    text:
      es: "Se devuelve al obligado, que debe ingresar las cantidades en el plazo del artículo 62.2."
  - id: b
    text:
      es: "Se mantiene hasta que el acuerdo sea firme en vía contencioso-administrativa."
  - id: c
    correct: true
    text:
      es: "Se aplica al pago de las cantidades confirmadas."
  - id: d
    text:
      es: "Se aplica al pago de las sanciones, quedando la deuda sujeta a aplazamiento."
  explanation:
    es: "Confirmadas las propuestas, el depósito se aplica al pago de dichas cantidades (art. 155.5). Solo con aval o seguro de caución hay que ingresar en el plazo del artículo 62.2 o en el aplazamiento solicitado. No se retiene hasta la firmeza ni se destina solo a la sanción."
  citation: "art. 155.5 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "depósito"
# anchor: boe-a-2003-23186-art-144
- id: m03-l08-q0274
  prompt:
    es: "Según el artículo 144.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué valor tienen las actas extendidas por la inspección de los tributos respecto de los hechos que motiven su formalización?"
  options:
  - id: a
    text:
      es: "Hacen prueba plena de ellos, sin que se admita prueba en contrario."
  - id: b
    correct: true
    text:
      es: "Hacen prueba de ellos, salvo que se acredite lo contrario."
  - id: c
    text:
      es: "Constituyen un indicio que debe ser corroborado por el órgano que liquida."
  - id: d
    text:
      es: "Hacen prueba de ellos solo cuando el obligado las ha suscrito sin reservas."
  explanation:
    es: "Las actas son documentos públicos y hacen prueba de los hechos, salvo prueba en contrario (art. 144.1). No tienen valor absoluto, no son un mero indicio y su valor no depende de que el obligado las suscriba."
  citation: "art. 144 LGT"
  difficulty: 1
  tags:
  - "actas"
  - "valor probatorio"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0277
  prompt:
    es: "Conforme al artículo 155.2.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe incluir necesariamente el acta con acuerdo además del contenido del artículo 153, en relación con la aplicación, estimación, valoración o medición realizada?"
  options:
  - id: a
    correct: true
    text:
      es: "El fundamento de la aplicación, estimación, valoración o medición realizada."
  - id: b
    text:
      es: "La relación de los datos y documentos aportados por el obligado en el procedimiento."
  - id: c
    text:
      es: "El informe razonado sobre la contabilidad y registros del obligado tributario."
  - id: d
    text:
      es: "La autorización del órgano competente para liquidar, con indicación de su fecha."
  explanation:
    es: "La letra a) del artículo 155.2 exige el fundamento de la aplicación, estimación, valoración o medición realizada. No se exige relacionar los documentos aportados, ni un informe razonado, que es propio de la estimación indirecta, ni la fecha de la autorización, que consigna el reglamento (art. 176.1.e)."
  citation: "art. 155.2 LGT"
  difficulty: 1
  tags:
  - "actas con acuerdo"
  - "contenido"
# anchor: boe-a-2003-23186-art-156
- id: m03-l08-q0278
  prompt:
    es: "¿Qué contenido tiene el acuerdo del órgano competente para liquidar que regula el artículo 156.3.b de la Ley 58/2003, de 17 de diciembre, General Tributaria respecto de un acta de conformidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Ordenar completar el expediente mediante la realización de las actuaciones que procedan."
  - id: b
    text:
      es: "Ordenar a la inspección que formalice un acta de disconformidad por los elementos discutidos."
  - id: c
    text:
      es: "Ordenar la remisión del expediente al órgano de recaudación para el cobro de la deuda."
  - id: d
    text:
      es: "Ordenar el archivo del expediente por haber prescrito el derecho a liquidar."
  explanation:
    es: "La letra b) del artículo 156.3 prevé ordenar completar el expediente con las actuaciones que procedan. Formalizar un acta de disconformidad, remitir al órgano de recaudación o archivar por prescripción no son contenidos de ese apartado."
  citation: "art. 156.3 LGT"
  difficulty: 2
  tags:
  - "actas de conformidad"
  - "contenido"
# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0279
  prompt:
    es: "Según el artículo 157.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe concederse al interesado con carácter previo a la firma del acta de disconformidad?"
  options:
  - id: a
    text:
      es: "Plazo de quince días para que alegue ante el órgano competente para liquidar."
  - id: b
    correct: true
    text:
      es: "Trámite de audiencia para que alegue lo que convenga a su derecho."
  - id: c
    text:
      es: "Plazo de un mes para que manifieste si presta conformidad a la propuesta."
  - id: d
    text:
      es: "Informe del actuario sobre las alegaciones presentadas durante el procedimiento."
  explanation:
    es: "Antes de la firma del acta de disconformidad se concede trámite de audiencia (art. 157.1). El plazo de quince días para alegar ante el órgano que liquida es posterior al acta (art. 157.3), y no hay plazo de un mes ni informe previo del actuario sobre las alegaciones."
  citation: "art. 157.1 LGT"
  difficulty: 2
  tags:
  - "actas de disconformidad"
  - "audiencia"
# anchor: boe-a-2007-15984-art-188
- id: m03-l08-q0280
  prompt:
    es: "¿Desde cuándo se cuentan los 15 días para presentar alegaciones en un acta de disconformidad cuando el obligado no ha comparecido en la fecha señalada, según el artículo 188.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Desde el día siguiente a aquel en que estaba señalada la comparecencia del obligado."
  - id: b
    text:
      es: "Desde el mismo día en que se haya extendido el acta, sin descontar ningún día."
  - id: c
    correct: true
    text:
      es: "Desde el día siguiente a aquel en que se haya notificado el acta."
  - id: d
    text:
      es: "Desde el día siguiente a aquel en que se abra el trámite de audiencia."
  explanation:
    es: "Si el obligado no comparece, los quince días corren desde el día siguiente al de la notificación del acta (art. 188.1). Si se niega a suscribir o suscribe, desde el día siguiente a ese hecho. No cuenta la fecha señalada, ni el propio día del acta, ni la apertura de la audiencia."
  citation: "art. 188.1 RGAT"
  difficulty: 2
  tags:
  - "actas de disconformidad"
  - "plazo"
  - "15 días"
# anchor: boe-a-2003-23186-art-155
- id: m03-l08-q0281
  prompt:
    es: "Según el artículo 155.3.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué entidades pueden prestar el aval solidario exigido para suscribir el acta con acuerdo?"
  options:
  - id: a
    text:
      es: "Una entidad de crédito o una compañía aseguradora autorizada."
  - id: b
    text:
      es: "Una sociedad de garantía recíproca o una entidad gestora de fondos de inversión."
  - id: c
    text:
      es: "Una entidad de crédito, una sociedad de garantía recíproca o el propio obligado mediante garantía personal."
  - id: d
    correct: true
    text:
      es: "Una entidad de crédito o una sociedad de garantía recíproca."
  explanation:
    es: "El aval de carácter solidario lo presta una entidad de crédito o una sociedad de garantía recíproca (art. 155.3.b). La entidad aseguradora emite el certificado de seguro de caución, que es otra garantía, y no se admiten gestoras de fondos ni garantías personales del obligado."
  citation: "art. 155.3 LGT"
  difficulty: 3
  tags:
  - "actas con acuerdo"
  - "garantía"
# anchor: boe-a-2007-15984-art-185
- id: m03-l08-q0285
  prompt:
    es: "Conforme al artículo 185.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿en cuál de los siguientes casos las actas son firmadas solo por el funcionario, haciéndose constar la circunstancia?"
  options:
  - id: a
    text:
      es: "Cuando el obligado tributario firme pero manifieste su disconformidad con la propuesta."
  - id: b
    text:
      es: "Cuando el obligado tributario solicite un plazo adicional para estudiar la propuesta."
  - id: c
    text:
      es: "Cuando el obligado tributario presente alegaciones durante el trámite de audiencia."
  - id: d
    correct: true
    text:
      es: "Cuando el obligado tributario no supiera o no pudiera firmarlas."
  explanation:
    es: "Las actas se firman solo por el funcionario si el obligado no sabe o no puede firmar, no comparece o se niega (art. 185.2). Firmar sin conformidad, pedir más plazo o alegar en la audiencia no impiden su firma conjunta."
  citation: "art. 185.2 RGAT"
  difficulty: 1
  tags:
  - "actas"
  - "firma"
# anchor: boe-a-2007-15984-art-190
- id: m03-l08-q0286
  prompt:
    es: "Según el artículo 190.3.c del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿en qué supuesto de comprobación de una devolución la liquidación puede ser provisional?"
  options:
  - id: a
    text:
      es: "Cuando se compruebe la procedencia de una devolución y el obligado haya presentado la solicitud fuera de plazo."
  - id: b
    text:
      es: "Cuando se compruebe la procedencia de una devolución y la inspección no haya examinado los libros contables."
  - id: c
    text:
      es: "Cuando se compruebe la procedencia de una devolución y el importe solicitado supere los 6.000 euros."
  - id: d
    correct: true
    text:
      es: "Cuando se compruebe la procedencia de una devolución y las actuaciones se hayan limitado en los términos del artículo 178.3.c."
  explanation:
    es: "La letra c) del artículo 190.3 prevé la liquidación provisional cuando se comprueba una devolución y las actuaciones se han limitado a la constatación formal del artículo 178.3.c. La presentación fuera de plazo, no examinar los libros o un importe determinado no son causas."
  citation: "art. 190.3 RGAT"
  difficulty: 3
  tags:
  - "liquidaciones"
  - "provisionales"
  - "devolución"
# anchor: boe-a-2007-15984-art-189
- id: m03-l08-q0288
  prompt:
    es: "¿Qué debe emitir el órgano actuante cuando el procedimiento termina por acuerdo del órgano competente para liquidar sin acta, según el artículo 189.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Un informe con los hechos acreditados en el expediente y las circunstancias que determinan esa forma de terminación."
  - id: b
    text:
      es: "Un acta de comprobado y conforme con los hechos acreditados en el expediente y la propuesta de liquidación."
  - id: c
    text:
      es: "Una diligencia con las manifestaciones del obligado y las circunstancias que determinan esa forma de terminación del procedimiento."
  - id: d
    text:
      es: "Una comunicación al obligado con los hechos acreditados y el plazo para formular alegaciones."
  explanation:
    es: "El órgano que desarrolló las actuaciones propone el acuerdo y emite informe con los hechos acreditados y las circunstancias de esa forma de terminación (art. 189.4). No se formaliza acta, y la diligencia y la comunicación son documentos con otra función (art. 99.7 LGT)."
  citation: "art. 189.4 RGAT"
  difficulty: 2
  tags:
  - "terminación"
  - "informe"
# anchor: boe-a-2007-15984-art-186
- id: m03-l08-q0303
  prompt:
    es: "Según el artículo 186.5 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, Imprenta Sierra, S.L. propone un acta con acuerdo con una deuda tributaria de 80.000 euros y una sanción de 16.000 euros. ¿Qué importe debe cubrir como mínimo un seguro de caución?"
  options:
  - id: a
    correct: true
    text:
      es: "115.200 euros, la deuda y la sanción más el 20 por ciento de ambas cantidades."
  - id: b
    text:
      es: "96.000 euros, el importe total de la deuda tributaria y de la sanción."
  - id: c
    text:
      es: "112.000 euros, la deuda y la sanción más el 20 por ciento de la deuda."
  - id: d
    text:
      es: "99.200 euros, la deuda y la sanción más el 20 por ciento de la sanción."
  explanation:
    es: "El aval o el seguro de caución cubre el importe total de la deuda tributaria y de la sanción y, además, el 20 por ciento de ambas cantidades (art. 186.5 RGAT). Deuda y sanción suman 96.000 euros, el 20 por ciento de esa suma son 19.200 euros y el total es 115.200 euros. Los 96.000 euros son lo que cubre el depósito, que no lleva ese añadido. El 20 por ciento solo de la deuda da 112.000 euros, y solo de la sanción, 99.200 euros: en los dos casos se aplica a una de las cantidades cuando la norma lo aplica a ambas."
  citation: "art. 186.5 RGAT"
  difficulty: 3
  tags:
  - "cómputo"
  - "acta con acuerdo"
  - "garantía"
# anchor: boe-a-2003-23186-art-156
- id: m03-l08-q0304
  prompt:
    es: "Se formaliza el lunes 9 de marzo de 2026 un acta de conformidad a Talleres Rojas, S.L. Según el artículo 156.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué fecha puede el órgano competente para liquidar notificar un acuerdo que rectifique errores materiales, sin que se entienda producida la liquidación conforme a la propuesta del acta?"
  options:
  - id: a
    text:
      es: "El lunes 23 de marzo de 2026, a los diez días hábiles de la fecha del acta."
  - id: b
    text:
      es: "El martes 24 de marzo de 2026, a los 15 días naturales de la fecha del acta."
  - id: c
    correct: true
    text:
      es: "El jueves 9 de abril de 2026, al cumplirse un mes desde la fecha del acta."
  - id: d
    text:
      es: "El viernes 10 de abril de 2026, a un mes y un día de la fecha del acta."
  explanation:
    es: "Se entiende producida y notificada la liquidación de acuerdo con la propuesta del acta si, en el plazo de un mes contado desde el día siguiente a la fecha del acta, no se ha notificado un acuerdo del órgano competente para liquidar con alguno de los contenidos del artículo 156.3, entre ellos rectificar errores materiales. El mes que empieza el 10 de marzo acaba el 9 de abril de 2026, porque el plazo en meses concluye el mismo día del mes de vencimiento (art. 30.4 de la Ley 39/2015). Los diez días hábiles son el plazo del acta con acuerdo y los 15 días son el de alegaciones en la de disconformidad, ambos de otras actas. El 10 de abril suma un día a un plazo que ya acaba el 9."
  citation: "art. 156.3 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "acta de conformidad"
  - "plazo"
