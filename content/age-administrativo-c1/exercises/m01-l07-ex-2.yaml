# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q015
  prompt:
    es: "De acuerdo con el artículo 15 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el acceso a datos personales que revelen la ideología, afiliación sindical, religión o creencias exige:"
  options:
  - id: a
    text:
      es: "El consentimiento expreso del afectado o que el acceso esté amparado por una norma con rango de ley"
  - id: b
    text:
      es: "El consentimiento tácito del afectado, que se presume si no se opone en quince días"
  - id: c
    text:
      es: "La autorización previa de la Agencia Española de Protección de Datos"
  - id: d
    correct: true
    text:
      es: "El consentimiento expreso y por escrito del afectado, salvo que este los hubiera hecho manifiestamente públicos antes"
  explanation:
    es: "Para la ideología, la afiliación sindical, la religión o las creencias, el artículo 15.1 exige «el consentimiento expreso y por escrito del afectado», salvo que este hubiera hecho los datos manifiestamente públicos antes de la solicitud. El consentimiento expreso o una norma con rango de ley es la regla del segundo párrafo, para la salud, el origen racial y los demás datos que enumera. La ley no admite un consentimiento tácito ni pide autorización de la Agencia Española de Protección de Datos."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q016
  prompt:
    es: "¿Qué se exige para autorizar el acceso a información pública que incluya datos personales relativos a la salud del afectado, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El consentimiento expreso y por escrito del afectado, en todo caso"
  - id: b
    correct: true
    text:
      es: "El consentimiento expreso del afectado o el amparo de una norma con rango de ley"
  - id: c
    text:
      es: "La ponderación del interés público, sin consentimiento del afectado"
  - id: d
    text:
      es: "La autorización judicial previa a solicitud del órgano"
  explanation:
    es: "Para los datos de salud, el segundo párrafo del artículo 15.1 permite el acceso si se cuenta con «el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley». El consentimiento expreso y por escrito, sin alternativa, es la regla de la ideología, la afiliación sindical, la religión y las creencias. La ley no se conforma con ponderar el interés público para estos datos, ni exige autorización judicial."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-15
- id: m01-l07-q017
  prompt:
    es: "Con carácter general, salvo que prevalezca la protección de datos personales, se concederá el acceso a información con datos meramente identificativos relacionados con:"
  options:
  - id: a
    text:
      es: "La vida privada y familiar de los empleados públicos del órgano"
  - id: b
    text:
      es: "Los procedimientos disciplinarios en curso contra el personal del órgano"
  - id: c
    correct: true
    text:
      es: "La organización, funcionamiento o actividad pública del órgano"
  - id: d
    text:
      es: "La situación patrimonial de los altos cargos y directivos del órgano"
  explanation:
    es: "El artículo 15.2 Ley 19/2013 concede con carácter general el acceso a «datos meramente identificativos relacionados con la organización, funcionamiento o actividad pública del órgano». La vida privada de los empleados, los procedimientos disciplinarios y la situación patrimonial no son ese objeto, y los datos sobre infracciones tienen además la regla reforzada del artículo 15.1."
  citation: "art. 15.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-16
- id: m01-l07-q018
  prompt:
    es: "De acuerdo con el artículo 16 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, cuando la aplicación de un límite al acceso no afecte a la totalidad de la información:"
  options:
  - id: a
    text:
      es: "Se denegará el acceso a la totalidad de la información solicitada"
  - id: b
    text:
      es: "Se concederá el acceso parcial sin indicar al solicitante qué parte de la información se ha omitido"
  - id: c
    text:
      es: "Se suspenderá el plazo para resolver hasta que el solicitante acepte el acceso parcial"
  - id: d
    correct: true
    text:
      es: "Se concederá el acceso parcial previa omisión de la información afectada, salvo que resulte distorsionada o carezca de sentido"
  explanation:
    es: "El artículo 16 manda conceder «el acceso parcial previa omisión de la información afectada por el límite salvo que de ello resulte una información distorsionada o que carezca de sentido». No se deniega todo. Al solicitante hay que indicarle qué parte se ha omitido. La ley no prevé suspender el plazo a la espera de que el solicitante acepte."
  citation: "art. 16 Ley 19/2013"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q019
  prompt:
    es: "¿A quién debe dirigirse la solicitud de acceso a la información pública que posee un órgano administrativo, conforme a la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Al Consejo de Transparencia y Buen Gobierno, que la remitirá al órgano competente"
  - id: b
    text:
      es: "Al Ministerio para la Transformación Digital y de la Función Pública, en todo caso"
  - id: c
    text:
      es: "Al Defensor del Pueblo, que la tramitará como una queja"
  - id: d
    correct: true
    text:
      es: "Al titular del órgano administrativo o entidad que posea la información"
  explanation:
    es: "El artículo 17.1 dice que la solicitud «deberá dirigirse al titular del órgano administrativo o entidad que posea la información». El Consejo de Transparencia y Buen Gobierno interviene después, si hay reclamación (art. 24). Ningún ministerio centraliza las solicitudes, y el Defensor del Pueblo no las tramita."
  citation: "art. 17.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q020
  prompt:
    es: "De acuerdo con el artículo 17 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en relación con los motivos de la solicitud de acceso a la información pública:"
  options:
  - id: a
    text:
      es: "El solicitante debe motivar su solicitud, salvo que la información ya esté publicada"
  - id: b
    text:
      es: "El solicitante debe acreditar un interés legítimo y directo en la información"
  - id: c
    correct: true
    text:
      es: "El solicitante no está obligado a motivar su solicitud de acceso"
  - id: d
    text:
      es: "El solicitante debe motivar su solicitud cuando afecte a datos de terceros"
  explanation:
    es: "El artículo 17.3 empieza así: «El solicitante no está obligado a motivar su solicitud de acceso a la información». La ley no hace excepciones por que la información esté publicada o afecte a terceros. Tampoco exige un interés legítimo: el derecho es de todas las personas (art. 12)."
  citation: "art. 17.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q021
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la ausencia de motivación en una solicitud de acceso a la información pública:"
  options:
  - id: a
    text:
      es: "Será causa de inadmisión a trámite mediante resolución motivada"
  - id: b
    correct: true
    text:
      es: "No será por sí sola causa de rechazo de la solicitud"
  - id: c
    text:
      es: "Obligará a requerir al solicitante para que la motive en diez días"
  - id: d
    text:
      es: "Suspenderá el plazo para resolver hasta que el solicitante la subsane"
  explanation:
    es: "El artículo 17.3 dice que «la ausencia de motivación no será por si sola causa de rechazo de la solicitud». No está entre las causas de inadmisión del artículo 18.1. El requerimiento de diez días del artículo 19.2 es para concretar una solicitud que no identifica bien la información, no para motivarla. Por lo mismo, no suspende el plazo para resolver."
  citation: "art. 17.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q022
  prompt:
    es: "¿En qué lengua pueden los solicitantes de información dirigirse a las Administraciones Públicas, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Exclusivamente en castellano, como lengua española oficial del Estado"
  - id: b
    text:
      es: "En castellano o en la lengua cooficial del lugar de residencia del solicitante"
  - id: c
    text:
      es: "En cualquiera de las lenguas oficiales de la Unión Europea"
  - id: d
    correct: true
    text:
      es: "En cualquiera de las lenguas cooficiales del Estado en el territorio en el que radique la Administración"
  explanation:
    es: "El artículo 17.4 permite dirigirse a las Administraciones «en cualquiera de las lenguas cooficiales del Estado en el territorio en el que radique la Administración en cuestión». No se limita al castellano. El criterio es el territorio de la Administración, no la residencia del solicitante. La ley no menciona las lenguas oficiales de la Unión Europea."
  citation: "art. 17.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q023
  prompt:
    es: "¿Cuál de las siguientes solicitudes de acceso a la información pública se inadmitirá a trámite, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La que no exponga los motivos por los que se solicita la información"
  - id: b
    text:
      es: "La que se presente en una lengua cooficial distinta del castellano"
  - id: c
    correct: true
    text:
      es: "La que se refiera a información que esté en curso de elaboración o de publicación general"
  - id: d
    text:
      es: "La que se refiera a datos meramente identificativos de los responsables del órgano"
  explanation:
    es: "El artículo 18.1.a) inadmite las solicitudes «que se refieran a información que esté en curso de elaboración o de publicación general». La falta de motivos no es causa de rechazo (art. 17.3). La solicitud puede presentarse en cualquier lengua cooficial del territorio (art. 17.4). El acceso a datos meramente identificativos se concede con carácter general (art. 15.2)."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q024
  prompt:
    es: "De acuerdo con el artículo 18 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, se inadmitirán las solicitudes referidas a información auxiliar o de apoyo, como la contenida en:"
  options:
  - id: a
    correct: true
    text:
      es: "Notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas"
  - id: b
    text:
      es: "Resoluciones definitivas que pongan fin a la vía administrativa"
  - id: c
    text:
      es: "Contratos, convenios y subvenciones con repercusión económica o presupuestaria"
  - id: d
    text:
      es: "Directrices, instrucciones y circulares que supongan una interpretación del Derecho"
  explanation:
    es: "El artículo 18.1.b) pone como ejemplo de información auxiliar o de apoyo la contenida en «notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas». Los contratos, convenios y subvenciones son información que hay que publicar (art. 8.1), igual que las directrices e instrucciones que interpretan el Derecho (art. 7). Una resolución definitiva no es información auxiliar."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
  - "concepto"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q025
  prompt:
    es: "Se inadmitirá a trámite la solicitud de acceso a la información pública para cuya divulgación sea necesaria:"
  options:
  - id: a
    text:
      es: "La previa disociación de los datos de carácter personal"
  - id: b
    text:
      es: "La previa audiencia de los terceros cuyos intereses puedan verse afectados"
  - id: c
    correct: true
    text:
      es: "Una acción previa de reelaboración de la información"
  - id: d
    text:
      es: "La previa traducción a otra de las lenguas cooficiales del Estado"
  explanation:
    es: "El artículo 18.1 inadmite las solicitudes «relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración» (letra c). Las causas son cinco y están todas en el apartado: información en curso de elaboración o de publicación general (a), información auxiliar o de apoyo como notas o borradores (b), la de reelaboración (c), solicitudes dirigidas a un órgano que no tiene la información cuando se desconoce el competente (d) y solicitudes manifiestamente repetitivas o abusivas (e). La disociación de datos personales no está en esa lista, y el artículo 15.4 va en sentido contrario: si el acceso se hace previa disociación de modo que no se identifique a las personas, no se aplican las limitaciones de los apartados anteriores. La audiencia a los terceros afectados es un trámite del artículo 19.3: les da quince días para alegar y suspende el plazo para resolver, no inadmite la solicitud. La traducción a una lengua cooficial no es ninguna de las cinco causas del artículo 18.1."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q026
  prompt:
    es: "De acuerdo con el artículo 18 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la resolución que inadmite una solicitud por desconocerse el órgano competente:"
  options:
  - id: a
    text:
      es: "Remitirá la solicitud al Consejo de Transparencia y Buen Gobierno"
  - id: b
    text:
      es: "Declarará caducado el procedimiento y archivará las actuaciones"
  - id: c
    correct: true
    text:
      es: "Deberá indicar el órgano que, a juicio del que inadmite, es competente"
  - id: d
    text:
      es: "Dará al solicitante diez días para identificar al órgano competente"
  explanation:
    es: "Cuando se inadmite por la causa de la letra d), el artículo 18.2 obliga a «indicar en la resolución el órgano que, a su juicio, es competente para conocer de la solicitud». La ley no manda remitir la solicitud al Consejo ni declarar la caducidad. El plazo de diez días del artículo 19.2 sirve para concretar la información, no para buscar el órgano."
  citation: "art. 18.2 Ley 19/2013"
  difficulty: 3
  tags:
  - "procedimiento"
