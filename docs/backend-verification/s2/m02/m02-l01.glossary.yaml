- id: g-load-factor
  term:
    en: load factor
  definition:
    en: The load factor is a measure of how full the hash table is allowed to get before its capacity is automatically increased.
  origin: m02-l01
  citation: javadoc-hashmap#class-hashmap-k-v
- id: g-chained-hash-table
  term:
    en: chained hash table
  definition:
    en: In a chained hash table, each entry T [i] is not just a single item, but rather (a pointer to) a linked list of all the items that hash to T [i].
  origin: m02-l01
  citation: erickson-hashing#p4
