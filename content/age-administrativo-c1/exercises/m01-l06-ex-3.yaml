# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q058
  prompt:
    es: "¿Cuál de los siguientes es el título completo del Objetivo 16 de la Agenda 2030 para el Desarrollo Sostenible?"
  options:
  - id: a
    text:
      es: "Promover sociedades pacíficas e inclusivas para el desarrollo sostenible, garantizar la seguridad jurídica para todos y construir a todos los niveles instituciones eficaces e independientes que rindan cuentas."
  - id: b
    text:
      es: "Promover sociedades justas y pacíficas para el desarrollo sostenible, facilitar el acceso a la justicia para todos y construir instituciones nacionales eficaces y transparentes que rindan cuentas."
  - id: c
    correct: true
    text:
      es: "Promover sociedades pacíficas e inclusivas para el desarrollo sostenible, facilitar el acceso a la justicia para todos y construir a todos los niveles instituciones eficaces e inclusivas que rindan cuentas."
  - id: d
    text:
      es: "Promover sociedades pacíficas e inclusivas para el desarrollo sostenible, facilitar el acceso a la información pública y construir a todos los niveles administraciones abiertas que rindan cuentas."
  explanation:
    es: "El título del Objetivo 16 habla de sociedades «pacíficas e inclusivas», de «facilitar el acceso a la justicia para todos» y de instituciones «eficaces e inclusivas» «a todos los niveles». Una opción cambia el acceso a la justicia por la seguridad jurídica. Otra habla de sociedades justas e instituciones nacionales. Otra cambia la justicia por la información pública y las instituciones por administraciones abiertas."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 3
  tags:
  - "concepto"
