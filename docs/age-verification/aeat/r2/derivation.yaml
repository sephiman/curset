  # El ordenamiento jurídico de la Unión Europea.
  - new: "## El ordenamiento jurídico de la Unión Europea"
    brief: >-
      derecho originario (TUE y TFUE, art. 1 TUE) y derivado: los actos del art. 288 TFUE (reglamento, directiva,
      decisión, recomendación, dictamen) y el procedimiento legislativo ordinario y los especiales del art. 289 TFUE
      (2025-1, 2024-12); art. 290–291 si hace falta para «actos delegados» y «de ejecución»; nada que los tratados no
      digan (la primacía solo como la Declaración 17 la recoge, si se menciona).
  - take: "c1:m01-l11#Efectos de la integración europea sobre la organización del Estado español / Las normas de la Unión dentro del ordenamiento"
    as: "### Las normas de la Unión dentro del ordenamiento español"

