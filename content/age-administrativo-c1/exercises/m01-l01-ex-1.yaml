# anchor: boe-a-1978-31229-df
- id: m01-l01-q001
  prompt:
    es: "¿Cuándo entró en vigor la Constitución Española de 1978, según lo que dispone su propio texto sobre su entrada en vigor?"
  options:
  - id: a
    correct: true
    text:
      es: "El mismo día de la publicación de su texto oficial en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "A los veinte días de su completa publicación en el «Boletín Oficial del Estado»."
  - id: c
    text:
      es: "El día siguiente al de la publicación de su texto oficial en el «Boletín Oficial del Estado»."
  - id: d
    text:
      es: "El día de su sanción por el Rey, el 27 de diciembre de 1978."
  explanation:
    es: "La disposición final dice que la Constitución «entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado». No hay vacatio de veinte días ni entrada en vigor al día siguiente. La sanción del Rey, el 27 de diciembre de 1978, es anterior a la publicación y no marca la entrada en vigor."
  citation: "disposición final CE"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-1978-31229-art-94
- id: m01-l01-q004
  prompt:
    es: "Conforme al artículo 94.1 de la Constitución Española de 1978, la prestación del consentimiento del Estado requiere la previa autorización de las Cortes Generales en los tratados o convenios que:"
  options:
  - id: a
    text:
      es: "Supongan modificación o derogación de algún real decreto o exijan su desarrollo reglamentario."
  - id: b
    text:
      es: "Supongan modificación o derogación de alguna orden ministerial."
  - id: c
    text:
      es: "Supongan modificación o derogación de alguna disposición reglamentaria del Gobierno."
  - id: d
    correct: true
    text:
      es: "Supongan modificación o derogación de alguna ley o exijan medidas legislativas para su ejecución."
  explanation:
    es: "El artículo 94.1.e) pide autorización previa de las Cortes para los tratados «que supongan modificación o derogación de alguna ley o exijan medidas legislativas para su ejecución». El apartado 1 lista los casos con «en los siguientes casos», y ninguno nombra normas del Gobierno. Un real decreto no es una ley ni una medida legislativa, y lo mismo vale para una orden ministerial y para una disposición reglamentaria del Gobierno: son normas reglamentarias, y el caso e) exige una ley."
  citation: "art. 94.1.e CE"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q005
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Constitución Española de 1978, España se constituye en un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento jurídico:"
  options:
  - id: a
    text:
      es: "La libertad, la justicia, la igualdad y la seguridad jurídica."
  - id: b
    correct: true
    text:
      es: "La libertad, la justicia, la igualdad y el pluralismo político."
  - id: c
    text:
      es: "La libertad, la igualdad, la solidaridad y el pluralismo político."
  - id: d
    text:
      es: "La dignidad, la justicia, la igualdad y el pluralismo político."
  explanation:
    es: "Los cuatro valores superiores del artículo 1.1 son «la libertad, la justicia, la igualdad y el pluralismo político». La seguridad jurídica es un principio que garantiza el artículo 9.3, la solidaridad entre nacionalidades y regiones está en el artículo 2 y la dignidad de la persona es fundamento del orden político según el artículo 10.1. Ninguna de las tres es un valor superior."
  citation: "art. 1.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q006
  prompt:
    es: "Según la Constitución Española de 1978, que constituye a España en un Estado social y democrático de Derecho, la soberanía nacional reside:"
  options:
  - id: a
    text:
      es: "En las Cortes Generales, que representan al pueblo español."
  - id: b
    text:
      es: "En la Nación española, patria común e indivisible de todos los españoles."
  - id: c
    correct: true
    text:
      es: "En el pueblo español, del que emanan los poderes del Estado."
  - id: d
    text:
      es: "En el Rey, Jefe del Estado y símbolo de su unidad y permanencia."
  explanation:
    es: "El artículo 1.2 dice que «la soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado». Las Cortes representan al pueblo español, pero no son titulares de la soberanía. La Nación española, patria común e indivisible, es el fundamento de la Constitución según el artículo 2. El Rey es Jefe del Estado, no titular de la soberanía."
  citation: "art. 1.2 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q008
  prompt:
    es: "De acuerdo con el artículo 9.3 de la Constitución Española de 1978, entre otros principios, la Constitución garantiza la irretroactividad de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las disposiciones sancionadoras no favorables o restrictivas de derechos individuales."
  - id: b
    text:
      es: "Las disposiciones sancionadoras favorables o ampliatorias de derechos individuales."
  - id: c
    text:
      es: "Todas las disposiciones de carácter general, salvo las de naturaleza tributaria."
  - id: d
    text:
      es: "Las leyes orgánicas que regulen el ejercicio de los derechos fundamentales."
  explanation:
    es: "El artículo 9.3 garantiza «la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales». La opción de las disposiciones «favorables o ampliatorias» invierte el sentido: lo que se prohíbe aplicar hacia atrás es lo desfavorable. La irretroactividad no alcanza a todas las disposiciones generales ni se refiere a las leyes orgánicas de desarrollo de derechos."
  citation: "art. 9.3 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-boe-analisis-ce-xml
- id: m01-l01-q010
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las reformas de la Constitución Española de 1978 aprobadas hasta 2026 es correcta?"
  options:
  - id: a
    text:
      es: "Se ha reformado tres veces, y cada reforma ha modificado un solo artículo."
  - id: b
    text:
      es: "Se ha reformado dos veces, en 1992 y en 2011, y nunca después."
  - id: c
    text:
      es: "Se ha reformado cuatro veces, y la de 2011 modificó varios artículos del título VII."
  - id: d
    correct: true
    text:
      es: "Se ha reformado cuatro veces, y cada reforma ha modificado un solo artículo."
  explanation:
    es: "El análisis del BOE recoge cuatro reformas, cada una de un solo artículo: el 13.2 en 1992, el 135 en 2011, el 49 en 2024 y el 69.3 en 2026. Decir tres reformas deja fuera la de 2026. Decir dos deja fuera las de 2024 y 2026. La de 2011 modificó solo el artículo 135."
  citation: "fuente: `boe-analisis-ce.xml`"
  difficulty: 2
  tags:
  - "cantidad"
  - "fecha"
# anchor: boe-a-1978-31229-art-10
- id: m01-l01-q011
  prompt:
    es: "De acuerdo con el artículo 10.2 de la Constitución Española de 1978, las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con:"
  options:
  - id: a
    correct: true
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España."
  - id: b
    text:
      es: "La Declaración Universal de Derechos Humanos y los tratados sobre esas materias firmados por España, aunque no estén ratificados."
  - id: c
    text:
      es: "La Declaración Universal de Derechos Humanos y las leyes orgánicas que desarrollen esos derechos."
  - id: d
    text:
      es: "Los principios rectores de la política social y económica del capítulo tercero."
  explanation:
    es: "El artículo 10.2 remite a «la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España». Exige ratificación, no basta la firma. No remite a las leyes orgánicas de desarrollo ni a los principios rectores del capítulo tercero."
  citation: "art. 10.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q012
  prompt:
    es: "¿Qué materia regula el capítulo quinto del título I de la Constitución Española de 1978, que contiene un único artículo?"
  options:
  - id: a
    text:
      es: "Las garantías de las libertades y derechos fundamentales."
  - id: b
    correct: true
    text:
      es: "La suspensión de los derechos y libertades."
  - id: c
    text:
      es: "Los principios rectores de la política social y económica."
  - id: d
    text:
      es: "Los derechos y deberes de los ciudadanos."
  explanation:
    es: "El capítulo quinto del título I se titula «De la suspensión de los derechos y libertades» y contiene solo el artículo 55. Las garantías son el capítulo cuarto (arts. 53 y 54), los principios rectores el capítulo tercero y los derechos y deberes de los ciudadanos la sección 2.ª del capítulo segundo."
  citation: "art. 55 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q013
  prompt:
    es: "Señale la respuesta correcta sobre el derecho de sufragio activo y pasivo de los extranjeros en las elecciones municipales, según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Puede establecerse por tratado o ley, sin necesidad de atender a criterios de reciprocidad."
  - id: b
    text:
      es: "Solo puede establecerse por tratado internacional, atendiendo a criterios de reciprocidad."
  - id: c
    text:
      es: "Puede establecerse por ley, pero limitado al sufragio activo."
  - id: d
    correct: true
    text:
      es: "Puede establecerse por tratado o ley, atendiendo a criterios de reciprocidad."
  explanation:
    es: "El artículo 13.2 reserva a los españoles los derechos del artículo 23, «salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales». La reciprocidad es obligada, valen tanto el tratado como la ley y la excepción cubre el sufragio activo y el pasivo."
  citation: "art. 13.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-14
- id: m01-l01-q014
  prompt:
    es: "Según el artículo 14 de la Constitución Española de 1978, los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de:"
  options:
  - id: a
    correct: true
    text:
      es: "Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social."
  - id: b
    text:
      es: "Nacimiento, raza, sexo, religión u opinión, sin que la ley pueda añadir otras causas."
  - id: c
    text:
      es: "Raza, sexo, religión, opinión o nacionalidad, en los términos que establezca la ley."
  - id: d
    text:
      es: "Nacimiento, raza, sexo o religión, salvo lo que dispongan las leyes orgánicas."
  explanation:
    es: "El artículo 14 enumera «nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social». La lista es abierta, por eso es incorrecta la opción que la cierra. Las otras dos quitan causas del texto, añaden la nacionalidad o introducen salvedades que el artículo no contiene."
  citation: "art. 14 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-17
- id: m01-l01-q015
  prompt:
    es: "Según el artículo 17.2 de la Constitución Española de 1978, ¿en qué plazo máximo el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial?"
  options:
  - id: a
    text:
      es: "En el plazo máximo de veinticuatro horas."
  - id: b
    correct: true
    text:
      es: "En el plazo máximo de setenta y dos horas."
  - id: c
    text:
      es: "En el plazo máximo de cuarenta y ocho horas."
  - id: d
    text:
      es: "En el plazo máximo de noventa y seis horas."
  explanation:
    es: "El artículo 17.2 dice que la detención preventiva no podrá durar más del tiempo estrictamente necesario y que, «en todo caso, en el plazo máximo de setenta y dos horas», el detenido debe ser puesto en libertad o a disposición judicial. Veinticuatro, cuarenta y ocho y noventa y seis horas no aparecen en el artículo."
  citation: "art. 17.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-18
- id: m01-l01-q017
  prompt:
    es: "Según el artículo 18.2 de la Constitución Española de 1978, que declara inviolable el domicilio, ¿en qué casos puede hacerse en él una entrada o registro?"
  options:
  - id: a
    correct: true
    text:
      es: "Con consentimiento del titular o resolución judicial, salvo en caso de flagrante delito."
  - id: b
    text:
      es: "Con consentimiento del titular o resolución judicial o gubernativa, salvo en caso de flagrante delito."
  - id: c
    text:
      es: "Solo con resolución judicial, incluso en caso de flagrante delito."
  - id: d
    text:
      es: "Con consentimiento del titular, resolución judicial o resolución administrativa motivada."
  explanation:
    es: "El artículo 18.2 dice que ninguna entrada o registro podrá hacerse «sin consentimiento del titular o resolución judicial, salvo en caso de flagrante delito». No basta una resolución gubernativa ni una administrativa. El flagrante delito es la excepción, así que no hace falta resolución judicial en ese caso."
  citation: "art. 18.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-20
- id: m01-l01-q018
  prompt:
    es: "De acuerdo con el artículo 20.5 de la Constitución Española de 1978, el secuestro de publicaciones, grabaciones y otros medios de información solo podrá acordarse:"
  options:
  - id: a
    text:
      es: "En virtud de resolución judicial o, en caso de urgencia, gubernativa."
  - id: b
    correct: true
    text:
      es: "En virtud de resolución judicial."
  - id: c
    text:
      es: "En virtud de resolución del Ministerio Fiscal, con posterior control judicial."
  - id: d
    text:
      es: "En virtud de resolución motivada de la autoridad administrativa competente."
  explanation:
    es: "El artículo 20.5 dice: «Sólo podrá acordarse el secuestro de publicaciones, grabaciones y otros medios de información en virtud de resolución judicial». No admite resolución gubernativa por urgencia, ni del Ministerio Fiscal, ni de una autoridad administrativa."
  citation: "art. 20.5 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q019
  prompt:
    es: "Según el artículo 21 de la Constitución Española de 1978, en los casos de reuniones en lugares de tránsito público y manifestaciones:"
  options:
  - id: a
    text:
      es: "Se requerirá autorización previa de la autoridad, que podrá denegarla por razones fundadas de alteración del orden público."
  - id: b
    text:
      es: "Se dará comunicación previa a la autoridad, que podrá prohibirlas por razones fundadas de alteración del orden público, aunque no haya peligro."
  - id: c
    correct: true
    text:
      es: "Se dará comunicación previa a la autoridad, que solo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes."
  - id: d
    text:
      es: "Se requerirá autorización judicial previa cuando existan razones fundadas de alteración del orden público."
  explanation:
    es: "El artículo 21.2 exige «comunicación previa a la autoridad, que sólo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes». No es una autorización, ni administrativa ni judicial. La prohibición exige las dos cosas: alteración del orden público y peligro para personas o bienes."
  citation: "art. 21.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q020
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el derecho de reunión pacífica y sin armas, tal como lo reconoce la Constitución Española de 1978, es correcta?"
  options:
  - id: a
    text:
      es: "Su ejercicio necesitará autorización previa de la Delegación del Gobierno."
  - id: b
    text:
      es: "Su ejercicio necesitará autorización previa cuando participen más de veinte personas."
  - id: c
    text:
      es: "Su ejercicio necesitará autorización previa salvo en los locales cerrados."
  - id: d
    correct: true
    text:
      es: "Su ejercicio no necesitará autorización previa."
  explanation:
    es: "El artículo 21.1 dice: «El ejercicio de este derecho no necesitará autorización previa». Las otras tres opciones introducen una autorización que el artículo excluye, sea con carácter general, por número de asistentes o por el lugar."
  citation: "art. 21.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-22
- id: m01-l01-q021
  prompt:
    es: "De acuerdo con el artículo 22 de la Constitución Española de 1978, las asociaciones solo podrán ser disueltas o suspendidas en sus actividades:"
  options:
  - id: a
    text:
      es: "En virtud de resolución administrativa motivada del Ministerio del Interior."
  - id: b
    correct: true
    text:
      es: "En virtud de resolución judicial motivada."
  - id: c
    text:
      es: "En virtud de resolución judicial o gubernativa, según los casos."
  - id: d
    text:
      es: "Por acuerdo del Consejo de Ministros, previa audiencia de la asociación."
  explanation:
    es: "El artículo 22.4 dice que las asociaciones «sólo podrán ser disueltas o suspendidas en sus actividades en virtud de resolución judicial motivada». No cabe hacerlo por resolución administrativa o gubernativa ni por acuerdo del Consejo de Ministros."
  citation: "art. 22.4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-29
- id: m01-l01-q022
  prompt:
    es: "¿Cómo pueden ejercer el derecho de petición los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Individual y colectivamente, como el resto de los españoles."
  - id: b
    text:
      es: "Solo colectivamente, a través de sus asociaciones profesionales."
  - id: c
    correct: true
    text:
      es: "Solo individualmente y con arreglo a lo dispuesto en su legislación específica."
  - id: d
    text:
      es: "Solo individualmente y previa autorización de su superior jerárquico."
  explanation:
    es: "El artículo 29.2 dice que podrán ejercer este derecho «sólo individualmente y con arreglo a lo dispuesto en su legislación específica». La petición colectiva es la regla general del artículo 29.1, que no les alcanza. El artículo no exige autorización del superior."
  citation: "art. 29.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
