type: case
title:
  es: "Formación en línea del INAP"
scenario:
  es: "El Instituto Nacional de Administración Pública (INAP) es un organismo autónomo con sede en Madrid. En los plazos por días son festivos el 12 de octubre, el 1 de noviembre y el 6 y el 8 de diciembre. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027.\n\nDon Mauricio Ferrer Lozano presentó una solicitud el miércoles, 8 de septiembre de 2027. El INAP le notificó el viernes, 5 de noviembre de 2027, que el procedimiento está paralizado porque no aporta un informe indispensable, y que caducará. Él ejerció su derecho de acceso el lunes, 22 de febrero de 2027, y vuelve a ejercerlo el lunes, 13 de septiembre de 2027, sin alegar causa. Doña Noelia Barrantes Cifuentes, notificada el lunes, 14 de junio de 2027, de una resolución firme de la Directora, advierte un error de hecho que resulta del expediente.\n\nEl jueves, 28 de octubre de 2027, el INAP pide a la Abogacía del Estado un informe facultativo, sin plazo especial. Acuerda también una información pública, anunciada en el «Boletín Oficial del Estado» el martes, 16 de noviembre de 2027, con el plazo mínimo legal.\n\nEl INAP adjudica por procedimiento abierto simplificado un contrato de servicios de formación en línea, de valor estimado 138.000 euros, y una licitadora excluida quiere recurrir. Compra, con la tramitación del artículo 159.6 de la Ley de Contratos del Sector Público, portátiles de uso corriente disponibles en el mercado, de valor estimado 54.000 euros, con anuncio el jueves, 7 de octubre de 2027. La adjudicataria, por 50.000 euros, IVA excluido, entrega con 20 días de retraso sobre el plazo total, por causa suya, y el INAP opta por penalidades. La Intervención Delegada formula reparo por insuficiencia de crédito a esa compra y la Directora no lo acepta. El INAP aprobó un contrato de videoconferencia sin la fiscalización previa preceptiva, y recibe su factura.\n\nEl viernes, 10 de septiembre de 2027, el «Boletín Oficial del Estado» publica el concurso por el que Don Esteban Calleja Roldán, del Ministerio de Hacienda, obtiene un puesto en el INAP, ambos en Madrid. Su cese, sin diferir, se produce el martes, 14 de septiembre de 2027, y un permiso le dura hasta el viernes, 24 de septiembre de 2027. Doña Natalia Bermejo Sanz, interina desde el martes, 4 de febrero de 2025, en una plaza vacante del INAP sin convocatoria, cobra retribuciones fijas de 80 euros por día. Don Ramiro Peña Ortiz, de grado personal 22, ve cambiadas por la relación de puestos de trabajo las funciones del puesto que obtuvo por concurso. Don Álvaro Casal Peña, funcionario del INAP con once años de servicios, solicita una excedencia voluntaria por interés particular.\n\nEl presupuesto inicial del INAP para 2027 asigna 3.400.000 euros al capítulo 2, gastos corrientes en bienes y servicios, sin modificaciones. El INAP necesita un suplemento de crédito en ese capítulo. El Estado se comprometió con firmeza a aportar 200.000 euros a un programa conjunto: ingresará 150.000 en diciembre de 2027 y 50.000 en febrero de 2028. El INAP alquila un local para aulas de 2027 a 2030, con renta anual de 55.000 euros y crédito inicial de 60.000 en 2027. Tiene anticipos de caja fija por 175.000 euros.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2018-16673-art-13
- id: q21
  lesson: m02-l04
  prompt:
    es: "Según la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿puede el INAP considerar repetitiva la nueva solicitud de acceso de Don Mauricio Ferrer Lozano y negarse por ello a actuar?"
  options:
  - id: a
    text:
      es: "Sí, porque cualquier segundo ejercicio del derecho de acceso se considera repetitivo."
  - id: b
    text:
      es: "Sí, porque el derecho de acceso solo puede ejercerse una vez al año."
  - id: c
    correct: true
    text:
      es: "No, porque el ejercicio anterior fue hace más de seis meses y no hay otro motivo para considerarla excesiva."
  - id: d
    text:
      es: "No, porque el responsable no puede negarse a actuar ante ninguna solicitud de acceso, por repetitiva que sea."
  explanation:
    es: "Se puede considerar repetitivo el ejercicio del derecho de acceso en más de una ocasión durante seis meses, salvo causa legítima. Don Mauricio lo ejerció el lunes, 22 de febrero de 2027 y lo vuelve a ejercer el lunes, 13 de septiembre de 2027, más de seis meses después. Sin otro motivo que la haga excesiva, el INAP debe atenderla. Considerar repetitivo cualquier segundo ejercicio ignora el plazo de seis meses. La norma no limita el derecho a una vez al año. Negarse a actuar sí cabe ante solicitudes manifiestamente excesivas (art. 12.5 RGPD), y el responsable debe demostrarlo."
  citation: "art. 13.3 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10565-art-125
- id: q43
  lesson: m03-l03
  prompt:
    es: "Según el artículo 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué órgano resuelve el recurso extraordinario de revisión que plantea Doña Noelia Barrantes Cifuentes?"
  options:
  - id: a
    text:
      es: "La Subsecretaría del Ministerio al que está adscrito el INAP, como superior jerárquico."
  - id: b
    correct: true
    text:
      es: "La propia Directora del INAP, que dictó la resolución firme que se impugna."
  - id: c
    text:
      es: "El Consejo de Ministros, por tratarse de un recurso extraordinario contra un acto firme."
  - id: d
    text:
      es: "El Consejo de Estado, que resuelve los recursos contra los actos firmes en vía administrativa."
  explanation:
    es: "El recurso extraordinario de revisión se interpone contra actos firmes en vía administrativa ante el órgano que los dictó, que también es el competente para resolverlo (art. 125.1 LPAC). La resolución firme es de la Directora del INAP, así que la resuelve ella misma. La Subsecretaría del Ministerio no interviene como superior jerárquico, que es la regla de la alzada. El Consejo de Ministros y el Consejo de Estado no resuelven este recurso por tratarse de un acto firme."
  citation: "art. 125.1 LPAC"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-80
- id: q23
  lesson: m03-l03
  prompt:
    es: "Conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe la Abogacía del Estado emitir el informe facultativo que le solicita el INAP?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 12 de noviembre de 2027."
  - id: b
    text:
      es: "Hasta el jueves, 11 de noviembre de 2027."
  - id: c
    text:
      es: "Hasta el lunes, 8 de noviembre de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el lunes, 15 de noviembre de 2027."
  explanation:
    es: "Los informes se emiten en diez días, salvo que una disposición o el resto de los plazos del procedimiento fijen otro, y aquí no hay plazo especial. Los días son hábiles: no cuentan sábados, domingos ni festivos (art. 30.2 LPAC). El informe se pide el jueves, 28 de octubre de 2027, y los diez días empiezan el viernes 29. No cuentan el lunes 1 y el martes 9 de noviembre, festivos. El décimo día hábil es el lunes, 15 de noviembre de 2027. El viernes, 12 de noviembre de 2027, cuenta el 9 de noviembre como hábil. El jueves, 11 de noviembre de 2027, ignora los dos festivos. El lunes, 8 de noviembre de 2027, cuenta diez días naturales."
  citation: "art. 80.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-83
- id: q24
  lesson: m03-l03
  prompt:
    es: "Conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál es la fecha más temprana en que puede terminar el plazo de alegaciones de la información pública que acuerda el INAP?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves, 16 de diciembre de 2027."
  - id: b
    text:
      es: "El miércoles, 15 de diciembre de 2027."
  - id: c
    text:
      es: "El martes, 14 de diciembre de 2027."
  - id: d
    text:
      es: "El martes, 7 de diciembre de 2027."
  explanation:
    es: "El anuncio de información pública fija un plazo de alegaciones que en ningún caso puede ser inferior a veinte días, y los días son hábiles (art. 30.2 LPAC). Anunciada el martes, 16 de noviembre de 2027, la cuenta empieza el miércoles 17. No cuentan el lunes 6 ni el miércoles 8 de diciembre, festivos. El vigésimo día hábil es el jueves, 16 de diciembre de 2027. El miércoles, 15 de diciembre de 2027, cuenta el 6 de diciembre como hábil. El martes, 14 de diciembre de 2027, ignora los dos festivos. El martes, 7 de diciembre de 2027, cuenta veinte días naturales, con el lunes 6 festivo."
  citation: "art. 83.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
