# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q121
  prompt:
    es: "En Outlook 365, ¿dónde se muestran los colores de las categorías asignadas a un mensaje?"
  options:
  - id: a
    correct: true
    text:
      es: "En la Bandeja de entrada y en los elementos abiertos"
  - id: b
    text:
      es: "Solo en los elementos abiertos, no en la Bandeja de entrada"
  - id: c
    text:
      es: "Solo en el Panel de lectura, nunca en la lista de mensajes"
  - id: d
    text:
      es: "Solo en la Bandeja de entrada, no en los elementos abiertos"
  explanation:
    es: "Los colores se muestran en la Bandeja de entrada y en los propios elementos abiertos. Mostrarlos solo en la Bandeja de entrada, solo en los elementos abiertos o solo en el Panel de lectura contradice esa frase, que cita los dos sitios."
