# anchor: boe-a-1978-31229-art-123
- id: m01-l04-q074
  prompt:
    es: "Conforme al artículo 123.2 de la Constitución Española de 1978, el Presidente del Tribunal Supremo será nombrado por el Rey, a propuesta de:"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "El Pleno del Tribunal Supremo."
  - id: c
    text:
      es: "El Congreso de los Diputados."
  - id: d
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 123.2 dice que el Presidente del Tribunal Supremo será nombrado por el Rey «a propuesta del Consejo General del Poder Judicial». El Presidente del Gobierno, el Pleno del propio Tribunal y el Congreso no intervienen."
  citation: "art. 123.2 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-121
- id: m01-l04-q139
  prompt:
    es: "De acuerdo con el artículo 121 de la Constitución Española de 1978, junto a los daños causados por error judicial, darán derecho a una indemnización a cargo del Estado los que sean consecuencia:"
  options:
  - id: a
    text:
      es: "De toda sentencia desfavorable para quien litiga."
  - id: b
    text:
      es: "De cualquier sentencia revocada por un tribunal superior."
  - id: c
    text:
      es: "Del funcionamiento normal de la Administración de Justicia."
  - id: d
    correct: true
    text:
      es: "Del funcionamiento anormal de la Administración de Justicia."
  explanation:
    es: "El artículo 121 da derecho a indemnización a cargo del Estado por el error judicial y por el funcionamiento anormal de la Administración de Justicia. El funcionamiento normal no la da. Una sentencia revocada por un tribunal superior tampoco la da por sí sola, y una sentencia desfavorable menos aún: el artículo exige error judicial o funcionamiento anormal."
  citation: "art. 121 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-12666-art-3
- id: m01-l04-q016
  prompt:
    es: "De acuerdo con el artículo 3 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la jurisdicción:"
  options:
  - id: a
    correct: true
    text:
      es: "Es única y se ejerce por los jueces, las juezas y los Tribunales previstos en dicha ley orgánica."
  - id: b
    text:
      es: "Es única y se ejerce por los jueces y Tribunales que designe el Consejo General del Poder Judicial."
  - id: c
    text:
      es: "Se divide en tantas jurisdicciones como Comunidades Autónomas con Tribunal Superior de Justicia."
  - id: d
    text:
      es: "Es única y se ejerce exclusivamente por el Tribunal Supremo y los Tribunales Superiores de Justicia."
  explanation:
    es: "El artículo 3.1 LOPJ dice: «La jurisdicción es única y se ejerce por los jueces, las juezas y los Tribunales previstos en esta ley orgánica». Una opción deja la designación al Consejo General del Poder Judicial, cuando los Tribunales los prevé la ley. Otra niega la unidad de la jurisdicción. Otra la reduce a dos órganos y olvida, entre otros, los Tribunales de Instancia y las Audiencias."
  citation: "art. 3.1 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-4
- id: m01-l04-q017
  prompt:
    es: "Según el artículo 4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿a qué se extiende la jurisdicción?"
  options:
  - id: a
    text:
      es: "A todas las personas y materias, salvo las reservadas a la jurisdicción militar."
  - id: b
    text:
      es: "A las personas de nacionalidad española, en todo el territorio nacional."
  - id: c
    correct: true
    text:
      es: "A todas las personas, a todas las materias y a todo el territorio español."
  - id: d
    text:
      es: "A las materias que le atribuyan las leyes, en el territorio que fije el Gobierno."
  explanation:
    es: "El artículo 4 LOPJ dice: «La jurisdicción se extiende a todas las personas, a todas las materias y a todo el territorio español». Una opción excluye la jurisdicción militar, que el artículo 3.2 LOPJ integra en el Poder Judicial. Otra deja fuera a quienes no tienen nacionalidad española, cuando el artículo dice «todas las personas». Otra deja el territorio en manos del Gobierno."
  citation: "art. 4 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q018
  prompt:
    es: "¿Cuál de los siguientes órdenes jurisdiccionales conoce, además de las materias que le son propias, de todas las que no estén atribuidas a otro orden, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Tribunales del orden penal."
  - id: b
    correct: true
    text:
      es: "Los Tribunales del orden civil."
  - id: c
    text:
      es: "Los Tribunales del orden contencioso-administrativo."
  - id: d
    text:
      es: "Los Tribunales del orden social."
  explanation:
    es: "El artículo 9.2 LOPJ dice que los Tribunales del orden civil conocerán, «además de las materias que les son propias, de todas aquellas que no estén atribuidas a otro orden jurisdiccional»: el civil hace de orden residual. El penal conoce de las causas y juicios criminales (art. 9.3), el contencioso-administrativo de la actuación administrativa (art. 9.4) y el social de la rama social del derecho (art. 9.5)."
  citation: "art. 9.2 LOPJ"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q019
  prompt:
    es: "¿Cuál de las siguientes materias corresponde al orden jurisdiccional social según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La responsabilidad patrimonial de las Administraciones públicas."
  - id: b
    text:
      es: "Los juicios criminales por delitos contra los derechos de los trabajadores."
  - id: c
    text:
      es: "Los recursos contra disposiciones generales de rango inferior a la ley."
  - id: d
    correct: true
    text:
      es: "Las reclamaciones en materia de Seguridad Social."
  explanation:
    es: "El artículo 9.5 LOPJ atribuye al orden social las pretensiones de la rama social del derecho y «las reclamaciones en materia de Seguridad Social». La responsabilidad patrimonial de las Administraciones y las disposiciones generales de rango inferior a la ley son del orden contencioso-administrativo (art. 9.4). Los juicios criminales son del orden penal (art. 9.3), aunque el delito afecte a los trabajadores."
  citation: "art. 9.5 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-3
- id: m01-l04-q075
  prompt:
    es: "De acuerdo con el artículo 3.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la jurisdicción se ejerce por los Tribunales previstos en ella, sin perjuicio de las potestades que la Constitución reconoce a:"
  options:
  - id: a
    correct: true
    text:
      es: "Otros órganos."
  - id: b
    text:
      es: "Las Comunidades Autónomas en su territorio."
  - id: c
    text:
      es: "Los Ayuntamientos en el ámbito local."
  - id: d
    text:
      es: "El Ministerio Fiscal en las causas penales."
  explanation:
    es: "El artículo 3.1 salva «las potestades jurisdiccionales reconocidas por la Constitución a otros órganos». Las Comunidades Autónomas, los Ayuntamientos y el Ministerio Fiscal no tienen potestad jurisdiccional que el artículo reserve."
  citation: "art. 3.1 LOPJ"
  difficulty: 3
  tags:
  - "excepción"
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q076
  prompt:
    es: "Según el artículo 9.3 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el orden jurisdiccional penal conoce de las causas y juicios criminales, con excepción de los que correspondan a:"
  options:
  - id: a
    text:
      es: "La jurisdicción contencioso-administrativa."
  - id: b
    text:
      es: "Los Juzgados de Paz."
  - id: c
    correct: true
    text:
      es: "La jurisdicción militar."
  - id: d
    text:
      es: "La Audiencia Nacional."
  explanation:
    es: "El artículo 9.3 excluye «los que correspondan a la jurisdicción militar». La jurisdicción contencioso-administrativa no juzga causas criminales. Los Juzgados de Paz y la Audiencia Nacional pertenecen al orden penal en el ámbito que la ley les atribuye, y no están excluidos."
  citation: "art. 9.3 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q077
  prompt:
    es: "¿Cuál de las siguientes materias corresponde al orden contencioso-administrativo, de acuerdo con el artículo 9.4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los conflictos individuales y colectivos de la rama social del derecho."
  - id: b
    text:
      es: "Las causas y juicios criminales, salvo los de la jurisdicción militar."
  - id: c
    text:
      es: "Las materias que no estén atribuidas a ningún otro orden jurisdiccional."
  - id: d
    correct: true
    text:
      es: "Las pretensiones relativas a la actuación de las Administraciones públicas sujeta al derecho administrativo."
  explanation:
    es: "El artículo 9.4 atribuye a este orden las pretensiones sobre la actuación de las Administraciones públicas sujeta al derecho administrativo. Los conflictos de la rama social son del orden social (9.5), las causas criminales del penal (9.3) y las materias no atribuidas a otro orden, del civil (9.2)."
  citation: "art. 9.4 LOPJ"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q078
  prompt:
    es: "Conforme al artículo 9.4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el orden contencioso-administrativo conoce también de las pretensiones relativas a las disposiciones generales de rango:"
  options:
  - id: a
    text:
      es: "Superior a la ley."
  - id: b
    correct: true
    text:
      es: "Inferior a la ley."
  - id: c
    text:
      es: "Igual al de la ley orgánica."
  - id: d
    text:
      es: "Constitucional."
  explanation:
    es: "El artículo 9.4 dice «las disposiciones generales de rango inferior a la ley». Las normas de rango superior o igual al de la ley no entran en este orden, y el control de las de rango constitucional corresponde al Tribunal Constitucional."
  citation: "art. 9.4 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q079
  prompt:
    es: "Señale la respuesta correcta sobre el orden jurisdiccional social, conforme al artículo 9.5 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial:"
  options:
  - id: a
    text:
      es: "Conoce solo de conflictos individuales de trabajo, nunca de los colectivos."
  - id: b
    text:
      es: "Conoce de las causas y juicios criminales por delitos contra los trabajadores."
  - id: c
    correct: true
    text:
      es: "Conoce de las pretensiones de la rama social del derecho, tanto en conflictos individuales como colectivos."
  - id: d
    text:
      es: "Conoce de las pretensiones deducidas contra las disposiciones generales de rango inferior a la ley."
  explanation:
    es: "El artículo 9.5 atribuye al orden social las pretensiones «dentro de la rama social del derecho, tanto en conflictos individuales como colectivos». Excluir los colectivos recorta el texto. Las causas criminales son del orden penal y las disposiciones generales de rango inferior a la ley, del contencioso-administrativo."
  citation: "art. 9.5 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q080
  prompt:
    es: "Señale la respuesta correcta sobre el carácter de la jurisdicción, según el artículo 9.6 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial:"
  options:
  - id: a
    correct: true
    text:
      es: "Es improrrogable."
  - id: b
    text:
      es: "Es prorrogable por acuerdo de las partes en los órdenes civil y social."
  - id: c
    text:
      es: "Es prorrogable cuando el órgano judicial superior lo autorice."
  - id: d
    text:
      es: "Es prorrogable por un plazo máximo de dos años."
  explanation:
    es: "El artículo 9.6 dice que «la jurisdicción es improrrogable». Las partes no pueden ampliarla por acuerdo, ni el superior autorizarlo, ni se fija un plazo máximo de prórroga."
  citation: "art. 9.6 LOPJ"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-26
- id: m01-l04-q081
  prompt:
    es: "¿Cuál de los siguientes órganos NO figura entre los Tribunales a los que atribuye la potestad jurisdiccional el artículo 26 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Tribunales Superiores de Justicia."
  - id: b
    correct: true
    text:
      es: "El Tribunal Constitucional."
  - id: c
    text:
      es: "Los jueces y juezas de paz."
  - id: d
    text:
      es: "Las Audiencias Provinciales."
  explanation:
    es: "El artículo 26 enumera los jueces de paz, los Tribunales de Instancia, las Audiencias Provinciales, los Tribunales Superiores de Justicia, el Tribunal Central de Instancia, la Audiencia Nacional y el Tribunal Supremo. El Tribunal Constitucional no está en la lista: la Constitución lo regula aparte, en su título IX."
  citation: "art. 26 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-12666-art-32
- id: m01-l04-q082
  prompt:
    es: "Según el artículo 32.1 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el partido es la unidad territorial integrada por:"
  options:
  - id: a
    correct: true
    text:
      es: "Uno o más municipios limítrofes pertenecientes a una misma provincia."
  - id: b
    text:
      es: "Dos o más provincias limítrofes de una misma Comunidad Autónoma."
  - id: c
    text:
      es: "Uno o más municipios de cualquier provincia."
  - id: d
    text:
      es: "Todos los municipios de una Comunidad Autónoma."
  explanation:
    es: "El artículo 32.1 define el partido como la unidad «integrada por uno o más municipios limítrofes, pertenecientes a una misma provincia». Agrupar provincias o todos los municipios de una Comunidad lo confunde con otra unidad, y limítrofes y de la misma provincia son dos condiciones que no puede saltarse."
  citation: "art. 32.1 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
  - "composición"
# anchor: boe-a-1985-12666-art-34
- id: m01-l04-q083
  prompt:
    es: "Señale la opción correcta. Conforme al artículo 34 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el ámbito territorial de los Tribunales Superiores de Justicia es:"
  options:
  - id: a
    text:
      es: "La provincia, con un Tribunal Superior por cada una."
  - id: b
    text:
      es: "El partido judicial, con un Tribunal Superior por cada uno."
  - id: c
    correct: true
    text:
      es: "La Comunidad Autónoma."
  - id: d
    text:
      es: "El conjunto del territorio nacional, con sede en Madrid."
  explanation:
    es: "El artículo 34 dice que «la Comunidad Autónoma será el ámbito territorial de los Tribunales Superiores de Justicia». La provincia es el ámbito de las Audiencias Provinciales, el partido el de los Tribunales de Instancia y el conjunto del territorio nacional el del Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia."
  citation: "art. 34 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
