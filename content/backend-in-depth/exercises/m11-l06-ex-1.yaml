- id: m11-l06-q02
  prompt:
    en: In PIT, what does the `CONDITIONALS_BOUNDARY_MUTATOR` do to the bytecode generated for the statement `if
      ( i >= 0 )`, according to the PIT documentation on mutation operators?
  options:
  - id: a
    correct: true
    text:
      en: It makes the bytecode equivalent to `if ( i > 0 )`
  - id: b
    text:
      en: It makes the bytecode equivalent to `if ( i < 0 )`
  - id: c
    text:
      en: It makes the bytecode equivalent to `if ( i <= 0 )`
  - id: d
    text:
      en: It rewrites the Java source of the statement before the code is compiled
  explanation:
    en: The mutator modifies the bytecode so that `i >= 0` becomes equivalent to `i > 0`. A bytecode equivalent
      to `if ( i < 0 )` is wrong because the documented result is `if ( i > 0 )`, and so is one equivalent to `if
      ( i <= 0 )`. Rewriting the Java source is wrong because PIT applies its mutators to the bytecode generated
      by compiling your code.
  citation: pitest-basic-concepts#mutation-operators
- id: m11-l06-q04
  prompt:
    en: According to the Pact documentation, for which kind of integration is Pact most valuable between a consumer
      and a provider?
  options:
  - id: a
    text:
      en: One where the provider serves an open-ended crowd of unknown consumers
  - id: b
    text:
      en: One where the provider is stable and no longer under active development
  - id: c
    text:
      en: One where the provider team cannot control the data returned in its responses
  - id: d
    correct: true
    text:
      en: One where you control the development of both the consumer and the provider
  explanation:
    en: Pact is most valuable where you control the development of both the consumer and the provider. An open-ended
      crowd of unknown consumers is wrong because Pact fits a number of consumers small enough for the provider
      team to manage an individual relationship with each consumer team. A stable provider is wrong because Pact
      fits integrations where both sides are under active development. A provider team without control of the response
      data is wrong because Pact fits cases where the provider team can easily control the data returned in its
      responses.
  citation: pact-what-is-good-for#what-is-pact-good-for
- id: m11-l06-q05
  prompt:
    en: Following the Pact documentation, a team wants to cover the flow “create user 123, then log in as user 123”.
      How should it write the Pact tests?
  options:
  - id: a
    text:
      en: As two interactions in one test, where the second depends on the first having run
  - id: b
    text:
      en: As one test that sends both requests to the real provider and checks the final login
  - id: c
    correct: true
    text:
      en: As two separate interactions, the second one with the provider state “user 123 exists”
  - id: d
    text:
      en: As one interaction whose provider state is created by the consumer's first request
  explanation:
    en: The documentation writes two separate interactions, one creating user 123 and one with the provider state
      “user 123 exists” that logs in. Two dependent interactions are wrong because each interaction in Pact is considered
      to be independent. Sending both requests to the real provider is wrong because the consumer test code fires
      a real request to a mock provider. A provider state created by the consumer's first request is wrong because
      provider states describe preconditions on the provider required to generate the expected response.
  citation: pact-how-it-works#consumer-testing
- id: m11-l06-q06
  prompt:
    en: In Pact provider verification, each request of a consumer's pact file is sent to the provider. Which condition
      makes the verification of that interaction pass?
  options:
  - id: a
    text:
      en: The response equals the expected response exactly, field for field
  - id: b
    correct: true
    text:
      en: The response contains at least the data described in the minimal expected response
  - id: c
    text:
      en: The consumer test code is run again against the real provider and passes
  - id: d
    text:
      en: A mock provider replays the pact file and its answer matches the consumer's expectation
  explanation:
    en: Verification passes when the response contains at least the data described in the minimal expected response.
      An exact field-for-field match is wrong because only the minimal expected response must be contained. Running
      the consumer test code again is wrong because provider verification is entirely driven by the Pact framework.
      A mock provider replay is wrong because each request is sent to the provider and its actual response is compared
      with the expected one.
  citation: pact-how-it-works#provider-verification
- id: m11-l06-q07
  prompt:
    en: A k6 closed-model test runs one VU, and the target's response time rises from 6 to 12 seconds. What happens
      to the rate at which new iterations start?
  options:
  - id: a
    text:
      en: It stays constant, because the arrival rate is set independently of the iteration duration
  - id: b
    correct: true
    text:
      en: It falls, because each iteration lasts longer and the next one waits for it
  - id: c
    text:
      en: It rises, because iterations overlap while the slow requests are pending
  - id: d
    text:
      en: It rises, because the executor adds VUs to keep the response time constant
  explanation:
    en: In a closed model, slower response times mean longer iterations and a lower arrival rate of new iterations.
      A constant rate is wrong because the arrival rate is tightly coupled with the iteration duration. A rise through
      overlapping iterations is wrong because the next iteration doesn't start until the previous one finishes.
      A rise through added VUs is wrong because a closed model load test waits, and the arrival rate of new VU iterations
      tapers off.
  citation: k6-open-vs-closed#drawbacks-of-using-the-closed-model; k6-open-vs-closed#closed-model
- id: m11-l06-q09
  prompt:
    en: In the k6 test-type cheat sheet, which combination of load level and test duration describes a soak test,
      as opposed to the other test types?
  options:
  - id: a
    correct: true
    text:
      en: Average load for a long duration, in hours
  - id: b
    text:
      en: Low load for a short duration, in seconds or minutes
  - id: c
    text:
      en: Very high load for a short duration, in a few minutes
  - id: d
    text:
      en: Load that increases until the system breaks, for as long as necessary
  explanation:
    en: A soak test uses average load for a long duration, in hours. Low load for seconds or minutes is wrong because
      that row of the cheat sheet describes a smoke test. Very high load for a few minutes is wrong because that
      row describes a spike test. Load that increases until the system breaks is wrong because that row describes
      a breakpoint test.
  citation: k6-test-types#test-type-cheat-sheet
- id: m11-l06-q10
  prompt:
    en: In the Chaos Engineering paper, which metric does Netflix use as its primary indicator of the overall health
      of the system when it designs experiments?
  options:
  - id: a
    text:
      en: CPU load of the Control Plane services
  - id: b
    text:
      en: Request latency between services
  - id: c
    correct: true
    text:
      en: SPS, the number of stream starts per second
  - id: d
    text:
      en: Completed purchases per second
  explanation:
    en: Netflix uses SPS, stream starts per second, as its primary indicator of the overall health of the system.
      CPU load is wrong because Netflix does not use finer grained metrics for the design of experiments, as they
      are not a direct measure of system availability. Request latency is wrong because an increase in it is only
      a symptom that a service is operating in degraded mode. Completed purchases per second is wrong because that
      metric belongs to an e-commerce site, while Netflix uses SPS.
  citation: paper-basiri-chaos-engineering#p5
- id: m11-l06-q11
  prompt:
    en: In the bookmark-service experiment of the Chaos Engineering paper, whose requests to the bookmark service
      does Netflix fail on purpose?
  options:
  - id: a
    text:
      en: Those of every user in the selected percentage, whichever group the user is in
  - id: b
    correct: true
    text:
      en: Only those of users in the experimental group
  - id: c
    text:
      en: Those of all Netflix users, to measure SPS at full scale
  - id: d
    text:
      en: Only those of users in the control group, which acts as the baseline
  explanation:
    en: The experiment selectively fails all requests against the bookmark service that are associated with users
      in the experimental group. Failing the requests of every selected user is wrong because no failures are introduced
      for the users in the control group. Failing all Netflix users is wrong because only a small percentage of
      Netflix users is involved in the experiment. Failing only the control group is wrong because the failures
      go to the experimental group, and the control group serves as the comparison.
  citation: paper-basiri-chaos-engineering#p9
- id: m11-l06-q12
  prompt:
    en: The snippet checks `Math.abs(x) >= 0` for the smallest and largest `int`, then concatenates an empty string
      and `"a"` and compares lengths. What does it print?
  options:
  - id: a
    text:
      en: 'abs of smallest int = 2147483648

        abs of smallest int >= 0: true

        abs of largest int >= 0: true

        length of concatenation: 1

        longer than string1: true

        longer than string2: false'
  - id: b
    text:
      en: 'abs of smallest int = -2147483648

        abs of smallest int >= 0: false

        abs of largest int >= 0: true

        length of concatenation: 1

        longer than string1: true

        longer than string2: true'
  - id: c
    text:
      en: 'abs of smallest int = -2147483647

        abs of smallest int >= 0: false

        abs of largest int >= 0: true

        length of concatenation: 1

        longer than string1: true

        longer than string2: false'
  - id: d
    correct: true
    text:
      en: 'abs of smallest int = -2147483648

        abs of smallest int >= 0: false

        abs of largest int >= 0: true

        length of concatenation: 1

        longer than string1: true

        longer than string2: false'
  explanation:
    en: '`Math.abs(Integer.MIN_VALUE)` overflows and stays `-2147483648`, so the check fails for it, and the concatenation
      `"a"` is not longer than `"a"`. The output with `2147483648` is wrong because the positive value does not
      fit in an `int`. The output with `longer than string2: true` is wrong because the length stays `1`, equal
      to the length of `"a"`. The output with `-2147483647` is wrong because the result is exactly the minimum value.'
  citation: jqwik-user-guide#creating-a-property
