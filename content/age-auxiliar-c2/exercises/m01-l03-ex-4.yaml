# anchor: boe-a-1994-10830-art-27
- id: m01-l03-q056
  prompt:
    es: "¿Cuántos Senadores, como mínimo, componen cada Grupo parlamentario según el texto refundido del Reglamento del Senado de 3 de mayo de 1994?"
  options:
  - id: a
    text:
      es: "Quince Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: b
    correct: true
    text:
      es: "Diez Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: c
    text:
      es: "Seis Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: d
    text:
      es: "Diez Senadores, pudiendo cada uno formar parte de dos Grupos."
  explanation:
    es: "El artículo 27.1 del Reglamento del Senado dice: «Cada Grupo parlamentario estará compuesto, al menos, de diez Senadores. Ningún Senador podrá formar parte de más de un Grupo parlamentario». Quince es el mínimo general en el Congreso. Seis es la cifra por debajo de la cual un Grupo ya constituido se disuelve al final del período de sesiones (art. 27.2). Nadie puede estar en dos Grupos."
  citation: "art. 27.1 Reglamento del Senado"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1994-10830-art-55
- id: m01-l03-q057
  prompt:
    es: "Según el artículo 55 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, ¿cómo está integrada la Mesa de la Comisión General de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Por un Presidente, dos Vicepresidentes y dos Secretarios."
  - id: b
    text:
      es: "Por un Presidente, cuatro Vicepresidentes y cuatro Secretarios."
  - id: c
    correct: true
    text:
      es: "Por un Presidente, dos Vicepresidentes y cuatro Secretarios."
  - id: d
    text:
      es: "Por un Presidente, un Vicepresidente y dos Secretarios."
  explanation:
    es: "El artículo 55 del Reglamento del Senado dice que esta Mesa «estará integrada por un Presidente, dos Vicepresidentes y cuatro Secretarios». Es una excepción a la regla de las demás Comisiones, cuya Mesa tiene dos Secretarios (art. 53.2). Cuatro Vicepresidentes y un solo Vicepresidente no aparecen."
  citation: "art. 55 Reglamento del Senado"
  difficulty: 3
  tags:
  - "composición"
  - "excepción"
# anchor: boe-a-1994-10830-art-27
- id: m01-l03-q131
  prompt:
    es: "Señale la respuesta correcta sobre la reducción de un Grupo parlamentario del Senado a menos de seis componentes durante la legislatura, según el artículo 27.2 del texto refundido del Reglamento del Senado de 3 de mayo de 1994:"
  options:
  - id: a
    correct: true
    text:
      es: "Queda disuelto al final del período de sesiones en que se produzca esta circunstancia."
  - id: b
    text:
      es: "Queda disuelto de inmediato, el día en que se produzca la reducción."
  - id: c
    text:
      es: "Pasa a integrarse en el Grupo Mixto hasta el fin de la legislatura."
  - id: d
    text:
      es: "Se mantiene hasta el fin de la legislatura, sin consecuencia alguna."
  explanation:
    es: "El artículo 27.2 disuelve el Grupo al final del período de sesiones en que su número baja de seis. No se disuelve de inmediato, ni pasa al Grupo Mixto, ni se mantiene hasta el final de la legislatura: la disolución se produce en el momento que el artículo señala."
  citation: "art. 27 Reglamento del Senado"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-1994-10830-art-28
- id: m01-l03-q132
  prompt:
    es: "En el Senado, los Senadores que resuelvan constituirse en Grupo parlamentario entregan en la Presidencia la relación nominal de sus integrantes en el término de:"
  options:
  - id: a
    text:
      es: "Cinco días naturales, contados desde la constitución del Senado."
  - id: b
    text:
      es: "Diez días hábiles, contados desde la constitución del Senado."
  - id: c
    correct: true
    text:
      es: "Cinco días hábiles, contados desde la constitución del Senado."
  - id: d
    text:
      es: "Cinco días hábiles, contados desde la publicación de los resultados electorales."
  explanation:
    es: "El artículo 28.1 da cinco días hábiles desde la constitución del Senado. Cinco días naturales y diez días hábiles cambian la clase de días o la cifra. Contarlos desde los resultados electorales cambia el punto de partida: el plazo corre desde que el Senado se constituye."
  citation: "art. 28 Reglamento del Senado"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1994-10830-art-53
- id: m01-l03-q133
  prompt:
    es: "En el Senado, cada Comisión elige de entre sus miembros una Mesa que, salvo la Comisión General de las Comunidades Autónomas, está formada por:"
  options:
  - id: a
    text:
      es: "Un Presidente, dos Vicepresidentes y cuatro Secretarios."
  - id: b
    correct: true
    text:
      es: "Un Presidente, dos Vicepresidentes y dos Secretarios."
  - id: c
    text:
      es: "Un Presidente, cuatro Vicepresidentes y cuatro Secretarios."
  - id: d
    text:
      es: "Una Presidencia, dos Vicepresidencias y dos Secretarías, con cuatro vocales."
  explanation:
    es: "El artículo 53.2 da a cada Comisión una Mesa con un Presidente, dos Vicepresidentes y dos Secretarios. La opción de cuatro Secretarios es la de la Comisión General de las Comunidades Autónomas, que el artículo 55 exceptúa. Cuatro Vicepresidentes es la cifra de la Mesa del Congreso, y los vocales no forman parte de la Mesa de una Comisión."
  citation: "art. 53 Reglamento del Senado"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-81
- id: m01-l03-q058
  prompt:
    es: "¿Cuál de las siguientes mayorías exige la Constitución Española de 1978 para la aprobación, modificación o derogación de las leyes orgánicas?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta del Congreso y del Senado, en votaciones separadas de cada artículo."
  - id: b
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  explanation:
    es: "El artículo 81.2 exige «mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto». La mayoría absoluta se exige al Congreso, no también al Senado, y la votación es final, no artículo por artículo. No se piden tres quintos ni basta la mayoría simple."
  citation: "art. 81.2 CE"
  difficulty: 1
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-82
- id: m01-l03-q060
  prompt:
    es: "Según la Constitución Española de 1978, señale la respuesta correcta sobre la forma de otorgar al Gobierno la delegación legislativa:"
  options:
  - id: a
    text:
      es: "Mediante una ley orgánica cuando su objeto sea la formación de textos articulados."
  - id: b
    text:
      es: "Mediante una ley de bases cuando se trate de refundir varios textos legales en uno solo."
  - id: c
    correct: true
    text:
      es: "Mediante una ley de bases cuando su objeto sea la formación de textos articulados."
  - id: d
    text:
      es: "Mediante un decreto legislativo cuando se trate de refundir varios textos legales en uno solo."
  explanation:
    es: "El artículo 82.2 dice que la delegación «deberá otorgarse mediante una ley de bases cuando su objeto sea la formación de textos articulados o por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo». No se otorga por ley orgánica. Para refundir textos se usa una ley ordinaria, no una ley de bases. El decreto legislativo es la norma que dicta el Gobierno en uso de la delegación (art. 85), no la que la otorga."
  citation: "art. 82.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-86
- id: m01-l03-q061
  prompt:
    es: "¿En qué plazo deben someterse los Decretos-leyes a debate y votación de totalidad del Congreso de los Diputados, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "En el plazo de los quince días siguientes a su promulgación."
  - id: b
    text:
      es: "En el plazo de los sesenta días siguientes a su promulgación."
  - id: c
    correct: true
    text:
      es: "En el plazo de los treinta días siguientes a su promulgación."
  - id: d
    text:
      es: "En el plazo de los veinte días naturales siguientes a su promulgación."
  explanation:
    es: "El artículo 86.2 dice que los Decretos-leyes se someten al Congreso «en el plazo de los treinta días siguientes a su promulgación». Quince y sesenta días no aparecen. Veinte días naturales es el plazo del Senado en los proyectos urgentes (art. 90.3)."
  citation: "art. 86.2 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q063
  prompt:
    es: "De acuerdo con el artículo 90 de la Constitución Española de 1978, el Senado puede, mediante mensaje motivado, oponer su veto o introducir enmiendas a un proyecto de ley en el plazo de:"
  options:
  - id: a
    text:
      es: "Tres meses a partir del día de la recepción del texto."
  - id: b
    text:
      es: "Dos meses a partir de la aprobación del proyecto por el Congreso."
  - id: c
    correct: true
    text:
      es: "Dos meses a partir del día de la recepción del texto."
  - id: d
    text:
      es: "Un mes a partir del día de la recepción del texto."
  explanation:
    es: "El artículo 90.2 dice que el Senado dispone de «dos meses, a partir del día de la recepción del texto». No son tres meses ni uno. El plazo corre desde la recepción del texto, no desde la aprobación en el Congreso."
  citation: "art. 90.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q064
  prompt:
    es: "Según el artículo 90 de la Constitución Española de 1978, ¿qué mayoría exige el veto que el Senado opone a un proyecto de ley?"
  options:
  - id: a
    text:
      es: "Deberá ser aprobado por mayoría simple."
  - id: b
    text:
      es: "Deberá ser aprobado por mayoría de tres quintos."
  - id: c
    text:
      es: "Deberá ser aprobado por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Deberá ser aprobado por mayoría absoluta."
  explanation:
    es: "El artículo 90.2 dice: «El veto deberá ser aprobado por mayoría absoluta». La mayoría simple basta al Congreso para pronunciarse sobre las enmiendas, no al Senado para vetar. Tres quintos y dos tercios no aparecen en el precepto."
  citation: "art. 90.2 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q065
  prompt:
    es: "¿Qué mayoría necesita el Congreso para ratificar el texto inicial tras el veto del Senado, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta en todo caso, sin que el transcurso del tiempo la reduzca."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta o, transcurridos dos meses desde la interposición del veto, mayoría simple."
  - id: c
    text:
      es: "Mayoría de tres quintos o, transcurridos dos meses desde el veto, mayoría absoluta."
  - id: d
    text:
      es: "Mayoría simple en todo caso, desde el momento de la interposición del veto."
  explanation:
    es: "El artículo 90.2 exige que el Congreso ratifique «por mayoría absoluta, en caso de veto, el texto inicial, o por mayoría simple, una vez transcurridos dos meses desde la interposición del mismo». La mayoría absoluta no se exige siempre: pasados dos meses basta la simple. Nunca se piden tres quintos. Antes de los dos meses la mayoría simple no basta."
  citation: "art. 90.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "plazo"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q066
  prompt:
    es: "De acuerdo con el artículo 90 de la Constitución Española de 1978, en los proyectos declarados urgentes por el Gobierno o por el Congreso de los Diputados, el plazo del Senado para vetar o enmendar se reduce a:"
  options:
  - id: a
    text:
      es: "Un plazo de veinte días hábiles."
  - id: b
    correct: true
    text:
      es: "Un plazo de veinte días naturales."
  - id: c
    text:
      es: "Un plazo de quince días naturales."
  - id: d
    text:
      es: "Un plazo de treinta días naturales."
  explanation:
    es: "El artículo 90.3 dice que el plazo de dos meses «se reducirá al de veinte días naturales en los proyectos declarados urgentes». Son días naturales, no hábiles. Quince días es el plazo de la sanción real (art. 91). Treinta días no es el plazo del Senado."
  citation: "art. 90.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-92
- id: m01-l03-q068
  prompt:
    es: "Según el artículo 92 de la Constitución Española de 1978, ¿cómo se convoca el referéndum consultivo sobre decisiones políticas de especial trascendencia?"
  options:
  - id: a
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por las Cortes Generales."
  - id: b
    text:
      es: "Lo convoca el Presidente del Gobierno, previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Lo convoca el Rey, mediante propuesta del Congreso de los Diputados, previamente autorizada por el Senado."
  - id: d
    correct: true
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados."
  explanation:
    es: "El artículo 92.2 dice: «El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados». La autorización es solo del Congreso, no de las Cortes Generales ni del Senado. Lo convoca el Rey, no el Presidente del Gobierno, que hace la propuesta."
  citation: "art. 92.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-85
- id: m01-l03-q134
  prompt:
    es: "Según la Constitución Española de 1978, en materia de legislación delegada, las disposiciones del Gobierno que la contengan reciben el título de:"
  options:
  - id: a
    text:
      es: "Decretos-leyes."
  - id: b
    text:
      es: "Reales Decretos de desarrollo."
  - id: c
    text:
      es: "Leyes de bases."
  - id: d
    correct: true
    text:
      es: "Decretos Legislativos."
  explanation:
    es: "El artículo 85 llama Decretos Legislativos a las disposiciones del Gobierno con legislación delegada. Los Decretos-leyes son las disposiciones provisionales de urgencia del artículo 86. Los Reales Decretos de desarrollo y las leyes de bases no son el nombre que el artículo da a la legislación delegada: la ley de bases es el instrumento con que las Cortes delegan, no la norma que dicta el Gobierno."
  citation: "art. 85 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-86
- id: m01-l03-q135
  prompt:
    es: "Según la Constitución Española de 1978, en caso de extraordinaria y urgente necesidad el Gobierno puede dictar disposiciones legislativas provisionales, que toman la forma de:"
  options:
  - id: a
    text:
      es: "Decretos Legislativos."
  - id: b
    correct: true
    text:
      es: "Decretos-leyes."
  - id: c
    text:
      es: "Leyes de bases."
  - id: d
    text:
      es: "Reales Decretos de urgencia."
  explanation:
    es: "El artículo 86.1 llama Decretos-leyes a esas disposiciones provisionales. Los Decretos Legislativos desarrollan una delegación de las Cortes (artículo 85). Las leyes de bases las aprueban las Cortes Generales, y los Reales Decretos de urgencia no son una figura del artículo."
  citation: "art. 86.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-87
- id: m01-l03-q137
  prompt:
    es: "¿Cuál de las siguientes opciones recoge a quienes corresponde la iniciativa legislativa, de acuerdo con el artículo 87.1 de la Constitución Española de 1978, dentro del capítulo segundo del título III?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Gobierno, al Congreso y al Senado."
  - id: b
    text:
      es: "Al Gobierno y al Congreso, pero no al Senado."
  - id: c
    text:
      es: "Al Congreso y al Senado, pero no al Gobierno."
  - id: d
    text:
      es: "Al Gobierno, al Congreso, al Senado y al Defensor del Pueblo."
  explanation:
    es: "El artículo 87.1 atribuye la iniciativa legislativa al Gobierno, al Congreso y al Senado, sin excluir a ninguno de los tres. Las opciones que dejan fuera al Senado o al Gobierno recortan la lista de tres titulares, y la que añade al Defensor del Pueblo suma un cuarto que el apartado no incluye."
  citation: "art. 87.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-87
- id: m01-l03-q138
  prompt:
    es: "Conforme al artículo 87.2 de la Constitución Española de 1978, las Asambleas de las Comunidades Autónomas pueden remitir a la Mesa del Congreso una proposición de ley, delegando ante esa Cámara un máximo de:"
  options:
  - id: a
    text:
      es: "Dos miembros de la Asamblea."
  - id: b
    text:
      es: "Cinco miembros de la Asamblea."
  - id: c
    correct: true
    text:
      es: "Tres miembros de la Asamblea."
  - id: d
    text:
      es: "Siete miembros de la Asamblea."
  explanation:
    es: "El artículo 87.2 fija un máximo de tres miembros de la Asamblea encargados de defender la proposición. El máximo es tres: dos, cinco y siete son otras cifras."
  citation: "art. 87.2 CE"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-87
- id: m01-l03-q139
  prompt:
    es: "Conforme al artículo 87.3 de la Constitución Española de 1978, la iniciativa popular para la presentación de proposiciones de ley exige no menos de:"
  options:
  - id: a
    text:
      es: "100.000 firmas acreditadas."
  - id: b
    text:
      es: "250.000 firmas acreditadas."
  - id: c
    correct: true
    text:
      es: "500.000 firmas acreditadas."
  - id: d
    text:
      es: "750.000 firmas acreditadas."
  explanation:
    es: "El artículo 87.3 exige no menos de 500.000 firmas acreditadas. El mínimo es de 500.000: 100.000, 250.000 y 750.000 son otras cifras."
  citation: "art. 87.3 CE"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q141
  prompt:
    es: "¿Cuál de los siguientes cargos recibe la cuenta inmediata del Presidente del Congreso cuando este aprueba un proyecto de ley, según el artículo 90.1 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Presidente del Gobierno, que lo somete a la sanción del Rey."
  - id: b
    text:
      es: "Rey, que lo somete a la deliberación del Senado."
  - id: c
    text:
      es: "Presidente de la Comisión Mixta, que lo somete a ambas."
  - id: d
    correct: true
    text:
      es: "Presidente del Senado, que lo somete a la deliberación de este."
  explanation:
    es: "El artículo 90.1 manda al Presidente del Congreso dar cuenta al Presidente del Senado, que somete el proyecto a la deliberación de su Cámara. La sanción corresponde al Rey y llega después del trámite en el Senado. El Rey no delibera ni el Presidente del Gobierno recibe el proyecto en este trámite. La Comisión Mixta es una figura del artículo 74.2, no de este trámite."
  citation: "art. 90.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q142
  prompt:
    es: "Conforme al artículo 90.2 de la Constitución Española de 1978, si el Senado introduce enmiendas a un proyecto de ley, el Congreso se pronuncia sobre ellas, aceptándolas o no, por:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Mayoría simple."
  - id: c
    text:
      es: "Tres quintos de sus miembros."
  - id: d
    text:
      es: "Dos tercios de sus miembros."
  explanation:
    es: "El artículo 90.2 pide mayoría simple para aceptar o rechazar las enmiendas. La mayoría absoluta es la del veto, que el Congreso solo ratifica así si no han pasado dos meses desde su interposición. Los tres quintos y los dos tercios son mayorías de otros trámites, como la reforma constitucional."
  citation: "art. 90.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-91
- id: m01-l03-q143
  prompt:
    es: "Conforme al artículo 91 de la Constitución Española de 1978, el Rey sancionará las leyes aprobadas por las Cortes Generales en el plazo de:"
  options:
  - id: a
    text:
      es: "Diez días."
  - id: b
    text:
      es: "Veinte días naturales."
  - id: c
    text:
      es: "Un mes."
  - id: d
    correct: true
    text:
      es: "Quince días."
  explanation:
    es: "El artículo 91 da al Rey quince días para sancionar las leyes. Veinte días naturales es el plazo del Senado para vetar o enmendar los proyectos urgentes (artículo 90.3), no el de la sanción. El artículo fija quince días: diez días y un mes son otros plazos."
  citation: "art. 91 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-91
- id: m01-l03-q144
  prompt:
    es: "Conforme al artículo 91 de la Constitución Española de 1978, el Rey sancionará en el plazo de quince días las leyes aprobadas por las Cortes Generales y, además:"
  options:
  - id: a
    text:
      es: "Las someterá a referéndum antes de su publicación."
  - id: b
    correct: true
    text:
      es: "Las promulgará y ordenará su inmediata publicación."
