- id: m08-l01-qa01
  prompt:
    en: According to Jepsen in Consistency, which statement about consistency models and the vocabulary used to
      define them does the reference guide make?
  options:
  - id: a
    text:
      en: G1a occurs when a transaction observes a write by a committed transaction
  - id: b
    correct: true
    text:
      en: A consistency model is a safety property declaring what a system can do
  - id: c
    text:
      en: Transaction T2 write-read depends on T1 if T2 writes a value that T1 read
  - id: d
    text:
      en: Consistency models are never defined in terms of dependencies
  explanation:
    en: Jepsen writes that a consistency model is a safety property which declares what a system can do. It writes
      that G1a (Aborted Read) occurs when a transaction observes a write performed by a different, aborted transaction,
      which contradicts a write by a committed one. It writes that T2 write-read depends on T1 if T2 reads some
      value that T1 wrote, which contradicts the reverse direction. It writes that models and phenomena are often
      defined in terms of dependencies between operations, which contradicts never defining them that way.
  citation: jepsen-consistency#models; jepsen-consistency#phenomena; jepsen-consistency#dependencies
- id: m08-l01-qa02
  prompt:
    en: According to Jepsen in Consistency, which statement about Serializability and how consistency models are
      defined does the reference guide make?
  options:
  - id: a
    correct: true
    text:
      en: Serializability makes every legal history equivalent to a totally ordered execution
  - id: b
    text:
