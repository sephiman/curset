    anchor: spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
    sentence: One possible solution is to edit the source code of some classes to be configured by setters rather than constructors.
  - option: It creates both beans, because constructor injection resolves circular dependencies
    anchor: spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
