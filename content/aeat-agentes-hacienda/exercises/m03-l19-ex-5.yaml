- id: m03-l19-q0096
  prompt:
    es: "Conforme al artículo 95.Tres.3.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las deducciones de los bienes de inversión afectos en todo o en parte a la actividad deben regularizarse cuando se acredite que:"
  options:
  - id: a
    text:
      es: "el sujeto pasivo ha modificado el porcentaje de prorrata aplicado en el ejercicio anterior."
  - id: b
    correct: true
    text:
      es: "el grado efectivo de utilización de los bienes en el desarrollo de la actividad es diferente del que se haya aplicado inicialmente."
  - id: c
    text:
