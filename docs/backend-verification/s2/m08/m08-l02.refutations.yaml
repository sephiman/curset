m08-l02-q05:
  key:
    anchor: kafka-design#message-delivery-semantics
    sentence: Kafka guarantees at-least-once delivery by default
  wrong:
  - option: At-most-once delivery, because the producer has retries disabled by default
    anchor: kafka-design#message-delivery-semantics
    sentence: allows the user to implement at-most-once delivery by disabling retries on the producer
  - option: Exactly-once delivery, because the consumer isolation level defaults to `read_committed`
    anchor: kafka-consumer-configs#isolation.level
    sentence: read_uncommitted (the default)
  - option: Exactly-once delivery to any destination system, because Kafka coordinates every write with the consumer position
    anchor: kafka-design#message-delivery-semantics
    sentence: Exactly-once delivery for other destination systems generally requires cooperation with such systems
m08-l02-q06:
  key:
    anchor: kafka-consumer-configs#isolation.level
    sentence: in read_committed mode, consumer.poll() will only return messages up to the last stable offset (LSO), which is the one less than the offset of the first open transaction.
  wrong:
  - option: The high watermark, because messages committed after the open transaction are already visible
    anchor: kafka-consumer-configs#isolation.level
    sentence: read_committed consumers will not be able to read up to the high watermark when there are in flight transactions.
  - option: Every committed message, skipping the open transaction and returning the messages that follow it
    anchor: kafka-consumer-configs#isolation.level
    sentence: any messages appearing after messages belonging to ongoing transactions will be withheld until the relevant transaction has been completed.
  - option: The log end offset, because the poll returns non-transactional messages out of offset order
    anchor: kafka-consumer-configs#isolation.level
    sentence: Messages will always be returned in offset order.
