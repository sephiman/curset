- id: g-platform-type
  term:
    en: platform type
  definition:
    en: Types of Java declarations are treated in Kotlin as non-denotable and called platform types.
  origin: m04-l01
  citation: kotlin-docs-java-interop#null-safety-and-platform-types
- id: g-smart-cast
  term:
    en: smart cast
  definition:
    en: The compiler tracks the type checks and explicit casts for immutable values and inserts implicit (safe) casts automatically.
  origin: m04-l01
  citation: kotlin-docs-typecasts#smart-casts
- id: g-elvis-operator
  term:
    en: Elvis operator
  definition:
    en: 'If the expression to the left of ?: is not null, the Elvis operator returns it. Otherwise, the Elvis operator returns the expression to the right.'
  origin: m04-l01
  citation: kotlin-docs-null-safety#elvis-operator
- id: g-declaration-site-variance
  term:
    en: declaration-site variance
  definition:
    en: The out modifier is called a variance annotation, and since it is provided at the type parameter declaration site, it provides declaration-site variance.
  origin: m04-l01
  citation: kotlin-docs-generics#declaration-site-variance
- id: g-type-erasure
  term:
    en: type erasure
  definition:
    en: At runtime, the instances of generic types do not hold any information about their actual type arguments. The type information is said to be erased.
  origin: m04-l01
  citation: kotlin-docs-generics#type-erasure
