- id: m01-l01-q31
  prompt:
    en: In Java 25, which redundant modifier does the Java Language Specification explicitly permit on a record
      declaration, so that writing it does not cause a compile-time error?
  options:
  - id: a
    text:
      en: '`static` on a local record class declared inside a method body'
  - id: b
    correct: true
    text:
      en: '`static` on a member record class, which is implicitly static anyway'
  - id: c
    text:
      en: '`abstract` on a top-level record class'
  - id: d
    text:
      en: '`public` written twice on a top-level record class'
  explanation:
    en: A member record class may redundantly specify `static` because a nested record class is implicitly static.
      A local record class may not specify `static`, because the specification says that is not permitted for a
      local record class. A record declaration with `abstract` is a compile-time error, because `abstract`, `sealed`
      and `non-sealed` are all rejected. Writing `public` twice is a compile-time error, because the same keyword
      may not appear more than once as a modifier.
  citation: jls-8-records#jls-8.10
  extract:
    en: It is permitted for the declaration of a member record class to redundantly specify the static modifier
- id: m01-l01-q32
  prompt:
    en: In Java 25, `record Money(long cents)` declares its own accessor for `cents` explicitly. According to the
      Java Language Specification, which declaration of that accessor method is allowed?
  options:
  - id: a
    correct: true
    text:
      en: '`public long cents() { return this.cents; }`, with the same return type as the component'
  - id: b
    text:
      en: '`public int cents() { return (int) cents; }`'
  - id: c
    text:
      en: '`public <T> long cents() { return cents; }`'
  - id: d
    text:
      en: '`long cents() { return cents; }`, with no access modifier'
  explanation:
    en: The accessor `public long cents()` is allowed because it is a public instance method with no parameters
      and no `throws` clause. The `int` version fails because the return type must be the same as the declared type
      of the component. The generic version fails because an explicit accessor method must not be generic. The version
      without an access modifier fails because the accessor must be a public instance method.
  citation: jls-8-records#jls-8.10.3
  extract:
    en: The accessor method must be a public instance method with no formal parameters and no throws clause.
- id: m01-l01-q33
  prompt:
    en: In Java 25, `record Point(int i, int j) implements Logging` implements an interface `Logging` that has a
      `default` method `logAction` printing `Logged`. What does the Java Language Specification say about `logAction`?
  options:
  - id: a
    text:
      en: Its body can read the component fields `i` and `j` of the record directly
  - id: b
    text:
      en: It becomes the implicit accessor method for the component `i`
  - id: c
    text:
      en: It is inherited only after the record redeclares it as a `public` method
  - id: d
    correct: true
    text:
      en: The record inherits it, and `p.logAction()` prints `Logged`
  explanation:
    en: The record inherits the `default` method and the specification's example prints `Logged`. The body cannot
      read the component fields, because default method bodies have no knowledge of them. The method does not become
      an accessor, because a superinterface method is never inherited as an accessor method. No redeclaration is
      needed, because all the rules of inheritance that apply to normal classes apply to record classes.
  citation: jls-8-records#jls-8.10.3
  extract:
    en: a record class can inherit default methods from its direct superinterfaces
- id: m01-l01-q34
  prompt:
    en: In Java 25, a record class `R` does not declare `toString`. According to the Java Language Specification,
      what is the implicitly declared `toString` method's result derived from?
  options:
  - id: a
    text:
      en: Only the string representations of the components, without the record class name
  - id: b
    text:
      en: The values returned by invoking the accessor method of every component, not the fields
  - id: c
    correct: true
    text:
      en: The name of the record class and the names and string representations of every record component
  - id: d
    text:
      en: The name of the record class and the string representations of the reference-type components only
  explanation:
    en: The result is derived from the name of the record class and the names and string representations of every
      record component. The version without the class name is wrong because the result is derived from the record
      class name as well. The accessor-based version is wrong because values are determined by looking at the component
      fields directly, not by invoking accessor methods. The reference-only version is wrong because a primitive
      component also contributes, through the `toString` method of its wrapper class.
  citation: jls-8-records#jls-8.10.3
  extract:
    en: A method public final String toString() that returns a string derived from the name of the record class
      and the names and string representations of every record component of R
- id: m01-l01-q35
  prompt:
    en: In Java 25, with `record Card(String last4, long cents)` and `record Box<T>(T value)` declared, which of
      these record patterns does the Java Language Specification make a compile-time error?
  options:
  - id: a
    correct: true
    text:
      en: '`String(var s)`, because `String` is not a record class type'
  - id: b
    text:
      en: '`Card(var a, _)`, which uses a match-all pattern for the second component'
  - id: c
    text:
      en: '`Box(var v)`, which names the raw type `Box` instead of a parameterized type'
  - id: d
    text:
      en: '`Card(var a, var b)`, which uses `var` for both component patterns'
  explanation:
    en: The pattern `String(var s)` is an error because a record pattern whose type is not a record class type is
      a compile-time error. The match-all pattern in `Card(var a, _)` is allowed because it can appear directly
      in the component pattern list of a record pattern. The raw type in `Box(var v)` is allowed because the type
      of the record pattern is inferred. The `var` patterns in `Card(var a, var b)` are allowed because `var` may
      appear directly in the component pattern list of a record pattern.
  citation: jls-14-statements#jls-14.30.1
  extract:
    en: If ReferenceType is not a record class type (§8.10) then a compile-time error occurs.
- id: m01-l01-q36
  prompt:
    en: In Java 25, `record Box(String s)` is matched by a `switch` against the pattern `Box(String s)`, and the
      value is `new Box(null)`. What does the Java Language Specification say about this match?
  options:
  - id: a
    text:
      en: The match fails, because the null reference matches no pattern nested in a record pattern
  - id: b
    correct: true
    text:
      en: The nested type pattern `String s` matches the null component, because it is unconditional for the component
        type `String`
  - id: c
    text:
      en: The match throws a `MatchException`, because the accessor returns the null reference
  - id: d
    text:
      en: The match succeeds, but `s` is initialized to the empty string instead of the null reference
  explanation:
    en: A type pattern that appears directly in a component pattern list and is unconditional for the component
      type is null-matching, so it matches the null component. The claim that no nested pattern matches null is
      wrong because the null reference matches a null-matching type pattern. The `MatchException` claim is wrong
      because that exception is thrown only when an accessor method completes abruptly, and returning null is not
      abrupt. The empty-string claim is wrong because a matching null is stored in the pattern variable as the null
      reference.
  citation: jls-14-statements#jls-14.30.1; jls-14-statements#jls-14.30.2
  extract:
    en: A type pattern is said to be null-matching if it is appears directly in the component pattern list of a
      record pattern with type R, where the corresponding record component of R has type U, and the type pattern
      is unconditional for the type U
- id: m01-l01-q39
  prompt:
    en: In Java 25, with `record Card(String last4, long cents)` and `record Box(Card card)` declared, which pattern
      is a compile-time error when written as a top-level pattern of a `case` label?
  options:
  - id: a
    correct: true
    text:
      en: '`var s`, a type pattern whose type is `var`'
  - id: b
    text:
      en: '`String s`, a type pattern with a reference type'
  - id: c
    text:
      en: '`Box(Card(var a, var b))`, with `var` inside a nested record pattern'
  - id: d
    text:
      en: '`Card(_, _)`, a record pattern made of two match-all patterns'
  explanation:
    en: A top-level type pattern whose type is `var` is a compile-time error, because the type of a top-level type
      pattern must denote a reference type and is not `var`. A top-level `String s` is allowed because it denotes
      a reference type. The nested `var` patterns are allowed because each appears directly in the component pattern
      list of a record pattern. The match-all patterns are allowed because they appear directly in the component
      pattern list of a record pattern.
  citation: jls-14-statements#jls-14.30.1
  extract:
    en: The LocalVariableType in a top level type pattern denotes a reference type (and furthermore is not var).
- id: m01-l01-q40
  prompt:
    en: In Java 25, according to section 8.10.3 of the Java Language Specification, which of these members can a
      record class explicitly declare in its body?
  options:
  - id: a
    text:
      en: An instance field such as `private int cache`
  - id: b
    text:
      en: A method `public void wait()` that serves as the accessor for a component named `wait`
  - id: c
    correct: true
    text:
      en: A class variable, declared with the `static` modifier
  - id: d
    text:
      en: An accessor method `x()` that declares a `throws` clause
  explanation:
    en: A record class may explicitly declare class variables, since explicit declarations of class methods and
      class variables are permitted. An instance field is rejected because a record class may not explicitly declare
      instance variables. The `wait()` method is not an accessor method, because `wait` is never a record component
      name. The accessor with a `throws` clause is rejected because an explicit accessor must be a public instance
      method with no `throws` clause.
  citation: jls-8-records#jls-8.10.3
  extract:
    en: Explicit declarations of class methods and class variables are permitted.
- id: m01-l01-q41
  prompt:
    en: In Java 25, which requirement does the `Record` Javadoc state for the canonical constructor, one of the
      mandated members of a record class?
  options:
  - id: a
    text:
      en: It must be explicitly declared in the record body, because the compiler never generates one
  - id: b
    text:
      en: It must be `private`, so that instances are created only through factory methods
  - id: c
    text:
      en: Its implicit declaration leaves the component fields at their default values until the accessors are called
  - id: d
    correct: true
    text:
      en: Its descriptor is the same as the record descriptor
  explanation:
    en: The canonical constructor must have the same descriptor as the record descriptor. The claim that it must
      be declared explicitly is wrong because implicit implementations are provided when the body does not declare
      the member. The claim that it must be `private` is wrong because it must provide at least as much access as
      the record class. The claim about default field values is wrong because the implicit declaration initializes
      the component fields from the corresponding constructor arguments.
  citation: javadoc-record#class-record
