# anchor: boe-a-1979-23709-art-43
- id: m01-l02-q105
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el recurso de amparo frente a una violación originada por el Gobierno, agotada la vía judicial, se interpone en el plazo de:"
  options:
  - id: a
    text:
      es: "Treinta días desde la notificación de la resolución."
  - id: b
    correct: true
    text:
      es: "Veinte días desde la notificación de la resolución judicial."
  - id: c
    text:
      es: "Tres meses desde que el acto sea firme."
  - id: d
    text:
      es: "Un mes desde la publicación de la disposición."
  explanation:
    es: "El artículo 43.2 dice «los veinte días siguientes a la notificación de la resolución recaída en el previo proceso judicial». Treinta días son los del artículo 44.2 para las violaciones de un órgano judicial, y tres meses desde que sean firmes los del artículo 42 para los actos de las Cortes. Un mes desde la publicación no figura en la ley."
  citation: "art. 43.2 LOTC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-164
- id: m01-l02-q106
  prompt:
    es: "Conforme al artículo 164.1 de la Constitución Española de 1978, las sentencias del Tribunal Constitucional tienen el valor de cosa juzgada:"
  options:
  - id: a
    text:
      es: "Desde el momento en que se dictan en audiencia pública."
  - id: b
    text:
      es: "Desde que se notifican a las partes."
  - id: c
    correct: true
    text:
      es: "A partir del día siguiente de su publicación."
  - id: d
    text:
      es: "A partir de los quince días de su publicación."
  explanation:
    es: "El artículo 164.1 fija el valor de cosa juzgada «a partir del día siguiente de su publicación». Ni el dictado ni la notificación a las partes marcan ese momento, y no se espera quince días."
  citation: "art. 164.1 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1978-31229-art-164
- id: m01-l02-q107
  prompt:
    es: "De acuerdo con el artículo 164.1 de la Constitución Española de 1978, respecto a los recursos que caben contra las sentencias del Tribunal Constitucional, una vez publicadas en el boletín oficial del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "No cabe recurso alguno contra ellas."
  - id: b
    text:
      es: "Cabe recurso de súplica ante el propio Tribunal en Pleno."
  - id: c
    text:
      es: "Cabe recurso ante el Tribunal Supremo en el plazo de un mes."
  - id: d
    text:
      es: "Cabe recurso ante el Defensor del Pueblo por la vía del amparo."
  explanation:
    es: "El artículo 164.1 cierra toda vía: «no cabe recurso alguno contra ellas». Ni el Pleno, ni el Supremo, ni el Defensor del Pueblo pueden revisarlas."
  citation: "art. 164.1 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-164
- id: m01-l02-q108
  prompt:
    es: "Según el artículo 164.1 de la Constitución Española de 1978, las sentencias del Tribunal Constitucional se publican en el boletín oficial del Estado junto con:"
  options:
  - id: a
    text:
      es: "Los dictámenes del Consejo de Estado."
  - id: b
    text:
      es: "Las alegaciones de las partes."
  - id: c
    text:
      es: "Los informes del Ministerio Fiscal."
  - id: d
    correct: true
    text:
      es: "Los votos particulares, si los hubiere."
  explanation:
    es: "El artículo 164.1 dispone la publicación «con los votos particulares, si los hubiere». Los dictámenes del Consejo de Estado, las alegaciones de las partes y los informes del Fiscal no acompañan a la sentencia en la publicación."
  citation: "art. 164.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1979-23709-art-6
- id: m01-l02-q164
  prompt:
    es: "Conforme a la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, en cuanto a su forma de funcionar, el Tribunal Constitucional actúa:"
  options:
  - id: a
    text:
      es: "Solo en Pleno y en Sala."
  - id: b
    text:
      es: "En Pleno, en Comisión o en Sección."
  - id: c
    correct: true
    text:
      es: "En Pleno, en Sala o en Sección."
  - id: d
    text:
      es: "En Pleno, en Cámara o en Sala de Admisión."
  explanation:
    es: "El Tribunal actúa en Pleno, en Sala o en Sección. La opción de solo Pleno y Sala deja fuera las Secciones. Las que hablan de Comisión, de Cámara o de Sala de Admisión inventan formas de actuar que la ley no prevé."
  citation: "art. 6.1 LOTC"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1979-23709-art-9
- id: m01-l02-q165
  prompt:
    es: "Conforme al artículo 9.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Pleno elige de entre sus miembros a su Presidente y propone al Rey su nombramiento mediante:"
  options:
  - id: a
    text:
      es: "Votación pública y nominal."
  - id: b
    text:
      es: "Votación pública a mano alzada."
  - id: c
    text:
      es: "Aclamación del Pleno."
  - id: d
    correct: true
    text:
      es: "Votación secreta."
  explanation:
    es: "El Pleno elige a su Presidente por votación secreta. Las votaciones públicas, ya sea nominal o a mano alzada, quitan el secreto que fija la ley. La aclamación sustituye la votación por un asentimiento general, y la ley prevé varias votaciones con mayorías precisas."
  citation: "art. 9.1 LOTC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1979-23709-art-9
- id: m01-l02-q166
  prompt:
    es: "De acuerdo con el artículo 9.3 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Presidente se nombra por un período de tres años, expirado el cual podrá ser reelegido:"
  options:
  - id: a
    text:
      es: "Sin límite de veces."
  - id: b
    correct: true
    text:
      es: "Por una sola vez."
  - id: c
    text:
      es: "Por dos veces consecutivas como máximo."
  - id: d
    text:
      es: "Por dos veces, siempre que no sean consecutivas."
  explanation:
    es: "El artículo 9.3 permite reelegir al Presidente por una sola vez. Sin límite de veces elimina el tope. Las dos opciones de dos reelecciones, seguidas o alternas, suben la cifra a dos."
  citation: "art. 9.3 LOTC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q169
  prompt:
    es: "Según el artículo 159.1 de la Constitución Española de 1978, ¿qué función corresponde al Rey respecto de los doce miembros del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "Elegirlos entre las candidaturas de las Asambleas autonómicas."
  - id: b
    text:
      es: "Ratificar los que designe el Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Nombrarlos a todos, a propuesta de los órganos que la Constitución señala."
  - id: d
    text:
      es: "Proponerlos al Senado, que los nombra por tres quintos."
  explanation:
    es: "El artículo 159.1 dice que el Tribunal se compone de 12 miembros nombrados por el Rey, a propuesta del Congreso, el Senado, el Gobierno y el Consejo General del Poder Judicial. El Rey no elige entre candidaturas: nombra a los que esos cuatro órganos le proponen. Tampoco ratifica la designación de uno de ellos, porque el Congreso solo propone a cuatro de los doce. Y no propone al Senado: el nombramiento es suyo."
  citation: "art. 159.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q170
  prompt:
    es: "Señale la opción correcta sobre la condición de los miembros del Tribunal Constitucional en el ejercicio de su mandato, según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Independientes, pero revocables por el órgano que los propuso."
  - id: b
    correct: true
    text:
      es: "Independientes e inamovibles."
  - id: c
    text:
      es: "Inamovibles, pero sujetos a las instrucciones del Gobierno."
  - id: d
    text:
      es: "Dependientes del Rey, que puede separarlos libremente."
  explanation:
    es: "El artículo 159.5 dice que son independientes e inamovibles. Cada distractor conserva una mitad y cambia la otra: revocables por quien los propuso quita la inamovilidad, las instrucciones del Gobierno quitan la independencia, y la dependencia del Rey con separación libre quita las dos."
  citation: "art. 159.5 CE"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1978-31229-art-161
- id: m01-l02-q171
  prompt:
    es: "¿Cuál de las siguientes categorías puede ser objeto del recurso de inconstitucionalidad ante el Tribunal Constitucional, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Sentencias firmes del Tribunal Supremo."
  - id: b
    text:
      es: "Actos administrativos del Estado."
  - id: c
    text:
      es: "Resoluciones del Defensor del Pueblo."
  - id: d
    correct: true
    text:
      es: "Leyes y disposiciones normativas con fuerza de ley."
  explanation:
    es: "El recurso de inconstitucionalidad se dirige contra leyes y disposiciones normativas con fuerza de ley. Las sentencias firmes del Tribunal Supremo y los actos administrativos del Estado no son normas con fuerza de ley, y las resoluciones del Defensor del Pueblo tampoco."
  citation: "art. 161.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-169
- id: m01-l02-q110
  prompt:
    es: "Según el artículo 169 de la Constitución Española de 1978, no podrá iniciarse la reforma constitucional en un determinado momento. ¿Cuál de las siguientes situaciones lo impide?"
  options:
  - id: a
    text:
      es: "El último año de la legislatura de las Cortes Generales."
  - id: b
    text:
      es: "El primer año posterior a la disolución de las Cortes Generales."
  - id: c
    text:
      es: "La tramitación de una moción de censura contra el Gobierno."
  - id: d
    correct: true
    text:
      es: "El tiempo de guerra o la vigencia de alguno de los estados previstos en el artículo 116."
  explanation:
    es: "El artículo 169 prohíbe iniciar la reforma «en tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116». El último año de legislatura, el primer año tras una disolución y la tramitación de una moción de censura no figuran como impedimento. La moción de censura sí frena la propuesta de disolución (artículo 115.2), pero no la reforma."
  citation: "art. 169 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q111
  prompt:
    es: "¿Cuál de las siguientes figuras prevé el artículo 167.1 de la Constitución Española de 1978 para intentar el acuerdo entre ambas Cámaras cuando no lo hay sobre un proyecto de reforma?"
  options:
  - id: a
    text:
      es: "Una Comisión Mixta formada por miembros del Gobierno y del Consejo de Estado."
  - id: b
    text:
      es: "Una Ponencia del Tribunal Constitucional con ocho Magistrados."
  - id: c
    correct: true
    text:
      es: "Una Comisión de composición paritaria de Diputados y Senadores."
  - id: d
    text:
      es: "Una Comisión del Congreso de los Diputados con mayoría de los Grupos mayoritarios."
  explanation:
    es: "El artículo 167.1 prevé «una Comisión de composición paritaria de Diputados y Senadores», que presenta un texto votado por el Congreso y el Senado. Ni el Gobierno con el Consejo de Estado, ni una ponencia del Tribunal Constitucional, ni una Comisión del Congreso solo intervienen en ese trámite."
  citation: "art. 167.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q113
  prompt:
    es: "Conforme al artículo 167.2 de la Constitución Española de 1978, si no se logra la aprobación por el procedimiento del apartado anterior, el Congreso puede aprobar la reforma por mayoría de dos tercios, siempre que el texto haya obtenido:"
  options:
  - id: a
    text:
      es: "El voto favorable de la mayoría de dos tercios del Senado."
  - id: b
    text:
      es: "El voto favorable de tres quintos del Senado."
  - id: c
    text:
      es: "El informe favorable del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "El voto favorable de la mayoría absoluta del Senado."
  explanation:
    es: "El artículo 167.2 exige que el texto haya obtenido «el voto favorable de la mayoría absoluta del Senado». Los dos tercios o los tres quintos del Senado son mayorías más altas que las exigidas, y el Consejo de Estado no interviene en esta vía."
  citation: "art. 167.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q114
  prompt:
    es: "De no lograrse la aprobación mediante el procedimiento del artículo 167.1 de la Constitución Española de 1978, ¿qué mayoría permite al Congreso aprobar la reforma, si el Senado la ha respaldado por mayoría absoluta?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos tercios de sus miembros."
  - id: b
    text:
      es: "Tres quintos del Congreso."
  - id: c
    text:
      es: "Mayoría absoluta de sus miembros."
  - id: d
    text:
      es: "Cuatro quintos de sus miembros."
  explanation:
    es: "Según el artículo 167.2, el Congreso, «por mayoría de dos tercios», puede aprobar la reforma. Los tres quintos son la mayoría de la vía ordinaria, la mayoría absoluta es la que se pide al Senado en esta segunda y los cuatro quintos no figuran en la Constitución."
  citation: "art. 167.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q115
  prompt:
    es: "Según el artículo 167.3 de la Constitución Española de 1978, aprobada la reforma por las Cortes Generales, se someterá a referéndum para su ratificación si lo solicitan, dentro de los quince días siguientes a su aprobación:"
  options:
  - id: a
    text:
      es: "Una quinta parte de los Diputados."
  - id: b
    correct: true
    text:
      es: "Una décima parte de los miembros de cualquiera de las Cámaras."
  - id: c
    text:
      es: "El Gobierno, mediante acuerdo del Consejo de Ministros."
  - id: d
    text:
      es: "Una tercera parte de los miembros de cada Cámara."
  explanation:
    es: "El artículo 167.3 exige «una décima parte de los miembros de cualquiera de las Cámaras». Una quinta parte del Congreso solo limita a una Cámara y sube la cifra, el Gobierno no tiene esa facultad en este artículo y una tercera parte eleva la fracción."
  citation: "art. 167.3 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q116
  prompt:
    es: "De acuerdo con el artículo 167.3 de la Constitución Española de 1978, la solicitud de referéndum para ratificar una reforma aprobada por las Cortes Generales debe presentarse:"
  options:
  - id: a
    text:
      es: "Dentro de los treinta días siguientes."
  - id: b
    text:
      es: "Dentro de los veinte días siguientes a su publicación."
  - id: c
    correct: true
    text:
      es: "Dentro de los quince días siguientes a su aprobación."
  - id: d
    text:
      es: "Dentro del mes siguiente a la disolución de las Cortes."
  explanation:
    es: "El artículo 167.3 fija «los quince días siguientes a su aprobación». Treinta días y veinte días desde la publicación no figuran en el artículo, y la disolución de las Cortes no marca ningún plazo en esta vía."
  citation: "art. 167.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q117
  prompt:
    es: "¿Cuál de las siguientes partes de la Constitución Española de 1978, si la reforma parcial la afecta, obliga a seguir el procedimiento agravado del artículo 168?"
  options:
  - id: a
    text:
      es: "El título III, De las Cortes Generales."
  - id: b
    text:
      es: "El título IV, Del Gobierno y de la Administración."
  - id: c
    text:
      es: "El título IX, Del Tribunal Constitucional."
  - id: d
    correct: true
    text:
      es: "El título II, De la Corona."
  explanation:
    es: "El artículo 168.1 manda seguir el procedimiento agravado en la revisión total o en la parcial que afecte al título preliminar, a la sección primera del capítulo segundo del título I o al título II, De la Corona. Los títulos III, IV y IX, aunque sean fundamentales, no están en esa lista, y su reforma se rige por el artículo 167."
  citation: "art. 168.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q118
  prompt:
    es: "Conforme al artículo 168.1 de la Constitución Española de 1978, una reforma parcial exige el procedimiento agravado cuando afecta, además del título preliminar y del título II, a:"
  options:
  - id: a
    text:
      es: "La sección segunda del capítulo segundo del título I."
  - id: b
    correct: true
    text:
      es: "La sección primera del capítulo segundo del título I."
  - id: c
    text:
      es: "El capítulo tercero del título I."
  - id: d
    text:
      es: "El título VIII, De la Organización Territorial del Estado."
  explanation:
    es: "El artículo 168.1 nombra la «Sección primera» del capítulo segundo del título I. La sección segunda, el capítulo tercero y el título VIII no están en la lista y siguen el procedimiento ordinario."
  citation: "art. 168.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q119
  prompt:
    es: "En el procedimiento agravado de reforma, tras aprobarse el principio por mayoría de dos tercios de cada Cámara, el artículo 168.1 de la Constitución Española de 1978 ordena a continuación:"
  options:
  - id: a
    text:
      es: "La convocatoria del referéndum de ratificación."
  - id: b
    text:
      es: "La constitución de una Comisión de composición paritaria."
  - id: c
    correct: true
    text:
      es: "La disolución inmediata de las Cortes."
  - id: d
    text:
      es: "La elaboración del nuevo texto por el Gobierno."
  explanation:
    es: "El artículo 168.1 ordena, junto a la aprobación del principio, «la disolución inmediata de las Cortes». El referéndum llega al final (artículo 168.3), la Comisión paritaria pertenece al procedimiento ordinario y el nuevo texto lo estudian las Cámaras elegidas, no el Gobierno."
  citation: "art. 168.1 CE"
  difficulty: 1
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q120
  prompt:
    es: "Según el artículo 168.2 de la Constitución Española de 1978, en el procedimiento agravado de reforma, ratifican la decisión y estudian el nuevo texto constitucional:"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cámaras elegidas tras la disolución."
  - id: b
    text:
      es: "Las Cámaras disueltas."
  - id: c
    text:
      es: "El Congreso de los Diputados, sin intervención del Senado."
  - id: d
    text:
      es: "Una Comisión de composición paritaria de Diputados y Senadores."
  explanation:
    es: "El artículo 168.2 dice que «las Cámaras elegidas deberán ratificar la decisión y proceder al estudio del nuevo texto». Las disueltas ya no existen como tales. Tampoco actúa el Congreso solo: el texto se aprueba por dos tercios de ambas Cámaras. La Comisión paritaria es propia del procedimiento ordinario."
  citation: "art. 168.2 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-167
- id: m01-l02-q160
  prompt:
    es: "¿Cuál de las siguientes fracciones de cada Cámara exige la Constitución Española de 1978 para aprobar un proyecto de reforma constitucional por el procedimiento ordinario?"
  options:
  - id: a
    text:
      es: "Tres cuartos."
  - id: b
    correct: true
    text:
      es: "Tres quintos."
  - id: c
    text:
      es: "Cuatro quintos."
  - id: d
    text:
      es: "Cinco sextos."
  explanation:
    es: "El artículo 167.1 pide una mayoría de tres quintos de cada una de las Cámaras. Los tres cuartos, los cuatro quintos y los cinco sextos son fracciones más altas que la Constitución no fija para este procedimiento."
  citation: "art. 167.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
  - "cantidad"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q161
  prompt:
    es: "De acuerdo con el artículo 168.2 de la Constitución Española de 1978, el nuevo texto constitucional que estudian las Cámaras elegidas tras la disolución deberá ser aprobado por:"
  options:
  - id: a
    text:
      es: "Una mayoría de tres quintos de ambas Cámaras."
  - id: b
    text:
      es: "Dos tercios del Congreso y la mayoría absoluta del Senado."
  - id: c
    correct: true
    text:
      es: "Una mayoría de dos tercios de ambas Cámaras."
  - id: d
    text:
      es: "La mayoría absoluta de ambas Cámaras, reunidas en sesión conjunta."
  explanation:
    es: "El artículo 168.2 exige que el nuevo texto se apruebe por mayoría de dos tercios de ambas Cámaras. Los tres quintos son la mayoría del procedimiento ordinario del artículo 167.1. Dos tercios del Congreso con mayoría absoluta del Senado es la fórmula del artículo 167.2, que aquí no se aplica. La mayoría absoluta en sesión conjunta rebaja la cifra y junta las Cámaras, que votan cada una."
  citation: "art. 168.2 CE"
