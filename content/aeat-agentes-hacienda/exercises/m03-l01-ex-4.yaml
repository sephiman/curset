# anchor: boe-a-2004-4214-art-59
- id: m03-l01-q0103
  prompt:
    es: "De acuerdo con el artículo 59.2 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, señale la respuesta CORRECTA sobre el Impuesto sobre Construcciones, Instalaciones y Obras y el Impuesto sobre el Incremento de Valor de los Terrenos de Naturaleza Urbana:"
  options:
  - id: a
    text:
      es: "Los ayuntamientos están obligados a exigirlos, de acuerdo con la ley y las disposiciones que la desarrollen, sin ordenanza fiscal."
  - id: b
    text:
      es: "Los ayuntamientos podrán establecerlos y exigirlos, pero solo si lo autoriza la Comunidad Autónoma."
  - id: c
