# anchor: boe-a-1978-31229-art-141
- id: m01-l10-q002
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la provincia se ajusta a lo dispuesto en la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Es una entidad local con personalidad jurídica propia, determinada por la agrupación de municipios."
  - id: b
    text:
      es: "Es una entidad local sin personalidad jurídica, determinada por la agrupación de municipios."
  - id: c
    text:
      es: "Sus límites solo pueden alterarse por ley de la Comunidad Autónoma en la que se integra."
  - id: d
    text:
      es: "Su gobierno y administración autónoma corresponden en exclusiva a las Diputaciones Provinciales."
  explanation:
    es: "El artículo 141.1 CE define la provincia como «una entidad local con personalidad jurídica propia, determinada por la agrupación de municipios». La opción que le niega la personalidad jurídica contradice ese texto. Los límites provinciales los altera una ley orgánica de las Cortes Generales, no una ley autonómica. El artículo 141.2 CE encomienda el gobierno y la administración autónoma de las provincias a «Diputaciones u otras Corporaciones de carácter representativo», no solo a las Diputaciones."
  citation: "art. 141.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-141
- id: m01-l10-q003
  prompt:
    es: "Según el artículo 141.2 de la Constitución Española de 1978, el gobierno y la administración autónoma de las provincias estarán encomendados:"
  options:
  - id: a
    correct: true
    text:
      es: "A Diputaciones u otras Corporaciones de carácter representativo."
  - id: b
    text:
      es: "A las Diputaciones Provinciales, con exclusión de cualquier otra Corporación."
  - id: c
    text:
      es: "A las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "A los Consejos de Gobierno de las Comunidades Autónomas."
  explanation:
    es: "El artículo 141.2 CE encomienda el gobierno y la administración autónoma de las provincias «a Diputaciones u otras Corporaciones de carácter representativo». La Constitución admite otras Corporaciones, así que la exclusión es falsa. Las Delegaciones del Gobierno y los Consejos de Gobierno autonómicos no son órganos de la provincia."
  citation: "art. 141.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-141
- id: m01-l10-q004
  prompt:
    es: "En los archipiélagos, conforme a lo previsto en el régimen constitucional de la Administración local, las islas:"
  options:
  - id: a
    correct: true
    text:
      es: "Tendrán además su administración propia en forma de Cabildos o Consejos."
  - id: b
    text:
      es: "Tendrán su administración propia en forma de Diputaciones insulares, que sustituyen a la provincia."
  - id: c
    text:
      es: "Carecerán de administración propia y quedarán integradas en la provincia correspondiente."
  - id: d
    text:
      es: "Tendrán su administración propia en forma de mancomunidades interinsulares de municipios."
  explanation:
    es: "El artículo 141.4 CE dice que en los archipiélagos «las islas tendrán además su administración propia en forma de Cabildos o Consejos». La palabra «además» indica que la isla se suma a la provincia, no la sustituye. Tampoco carece de administración propia. Las mancomunidades interinsulares son otra figura de la LBRL y no son la administración de cada isla."
  citation: "art. 141.4 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-1978-31229-art-140
- id: m01-l10-q005
  prompt:
    es: "De acuerdo con el artículo 140 de la Constitución Española de 1978, el gobierno y la administración de los municipios corresponde:"
  options:
  - id: a
    text:
      es: "A sus respectivos Plenos, integrados por los Concejales y presididos por el Alcalde."
  - id: b
    correct: true
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales."
  - id: c
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Tenientes de Alcalde."
  - id: d
    text:
      es: "A las Diputaciones Provinciales, integradas por los Presidentes y los Diputados."
  explanation:
    es: "El artículo 140 CE dice que el gobierno y la administración de los municipios «corresponde a sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales». El Pleno es un órgano del Ayuntamiento, no el titular de su gobierno. Los Tenientes de Alcalde no sustituyen a los Concejales en esa fórmula. La Diputación gobierna la provincia, no el municipio."
  citation: "art. 140 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1978-31229-art-140
- id: m01-l10-q006
  prompt:
    es: "Según el artículo 140 de la Constitución Española de 1978, que garantiza la autonomía de los municipios, estos:"
  options:
  - id: a
    text:
      es: "Gozarán de personalidad jurídica limitada a los fines que les atribuya la ley."
  - id: b
    text:
      es: "Carecerán de personalidad jurídica propia, que corresponde a sus Ayuntamientos."
  - id: c
    correct: true
    text:
      es: "Gozarán de personalidad jurídica plena."
  - id: d
    text:
      es: "Gozarán de autonomía solo en los términos que fije cada Estatuto de Autonomía."
  explanation:
    es: "El artículo 140 CE dice: «La Constitución garantiza la autonomía de los municipios. Estos gozarán de personalidad jurídica plena». La personalidad no está limitada a unos fines ni corresponde al Ayuntamiento en lugar del municipio. La autonomía municipal la garantiza la propia Constitución, no cada Estatuto."
  citation: "art. 140 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-137
- id: m01-l10-q007
  prompt:
    es: "Según el artículo 137 de la Constitución Española de 1978, los municipios, las provincias y las Comunidades Autónomas que se constituyan:"
  options:
  - id: a
    text:
      es: "Gozan de soberanía para la gestión de sus respectivos intereses."
  - id: b
    text:
      es: "Gozan de autonomía para la gestión de los intereses generales del Estado."
  - id: c
    text:
      es: "Gozan de autonomía política y legislativa en sus respectivos territorios."
  - id: d
    correct: true
    text:
      es: "Gozan de autonomía para la gestión de sus respectivos intereses."
  explanation:
    es: "El artículo 137 CE dice que todas estas entidades «gozan de autonomía para la gestión de sus respectivos intereses». La soberanía no es de ellas. La autonomía se refiere a sus propios intereses, no a los generales del Estado. El artículo no atribuye potestad legislativa a municipios ni a provincias."
  citation: "art. 137 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-137
- id: m01-l10-q008
  prompt:
    es: "¿Cuál de las siguientes fórmulas recoge cómo se organiza territorialmente el Estado según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "En municipios, en comarcas, en provincias y en las Comunidades Autónomas."
  - id: b
    text:
      es: "En municipios, en provincias, en islas y en las Comunidades Autónomas."
  - id: c
    text:
      es: "En provincias y en las Comunidades Autónomas que se constituyan."
  - id: d
    correct: true
    text:
      es: "En municipios, en provincias y en las Comunidades Autónomas que se constituyan."
  explanation:
    es: "El artículo 137 CE dice que el Estado se organiza territorialmente «en municipios, en provincias y en las Comunidades Autónomas que se constituyan». Las comarcas y las islas no aparecen en esa enumeración. Quitar los municipios también altera el texto."
  citation: "art. 137 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-3
- id: m01-l10-q009
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las Entidades Locales territoriales según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "El Municipio, la Provincia y la Comarca en todas las Comunidades Autónomas."
  - id: b
    text:
      es: "El Municipio, la Provincia y las Áreas Metropolitanas de las grandes ciudades."
  - id: c
    text:
      es: "El Municipio, la Mancomunidad de Municipios y la Isla en los archipiélagos."
  - id: d
    correct: true
    text:
      es: "El Municipio, la Provincia y la Isla en los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.1 LBRL dice que son Entidades Locales territoriales «el Municipio», «la Provincia» y «la Isla en los archipiélagos balear y canario». Las Comarcas, las Áreas Metropolitanas y las Mancomunidades de Municipios son entidades locales, pero el artículo 3.2 las pone en el otro grupo, el de las no territoriales."
  citation: "art. 3.1 LBRL"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-3
- id: m01-l10-q010
  prompt:
    es: "¿Cuál de las siguientes goza de la condición de Entidad Local sin ser Entidad Local territorial, según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Áreas Metropolitanas de grandes aglomeraciones urbanas."
  - id: b
    text:
      es: "Las Diputaciones Provinciales de régimen común."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Las Islas de los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.2 LBRL da la condición de Entidades Locales a las Comarcas, a «las Áreas Metropolitanas» y a las Mancomunidades de Municipios. La Diputación no es una entidad: es el órgano de gobierno de la Provincia, que es entidad territorial. Las Delegaciones del Gobierno son órganos de la Administración General del Estado. La Isla es entidad local territorial según el artículo 3.1."
  citation: "art. 3.2 LBRL"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-1985-5392-art-4
- id: m01-l10-q011
  prompt:
    es: "Señale la respuesta correcta sobre lo que corresponde en todo caso a municipios, provincias e islas como Administraciones públicas de carácter territorial:"
  options:
  - id: a
    text:
      es: "La potestad legislativa en las materias de su competencia."
  - id: b
    correct: true
    text:
      es: "La potestad de revisión de oficio de sus actos y acuerdos."
  - id: c
    text:
      es: "La potestad jurisdiccional en materia de tributos locales."
  - id: d
    text:
      es: "La embargabilidad de sus bienes y derechos en los términos de las leyes."
  explanation:
    es: "El artículo 4.1.g) LBRL atribuye a municipios, provincias e islas «la potestad de revisión de oficio de sus actos y acuerdos». Las entidades locales no tienen potestad legislativa ni jurisdiccional. El artículo 4.1.h) habla de la «inembargabilidad» de sus bienes y derechos, no de su embargabilidad."
  citation: "art. 4.1 LBRL"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-11
- id: m01-l10-q012
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el Municipio:"
  options:
  - id: a
    text:
      es: "Es la entidad local intermedia entre la Provincia y la Comunidad Autónoma."
  - id: b
    text:
      es: "Es la entidad territorial básica de la organización de las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "Es la entidad local básica de la organización territorial del Estado."
  - id: d
    text:
      es: "Es una entidad local sin personalidad jurídica propia, distinta del Ayuntamiento."
  explanation:
    es: "El artículo 11.1 LBRL dice que «el Municipio es la entidad local básica de la organización territorial del Estado». No es una entidad intermedia: la Provincia es la que agrupa municipios. El artículo habla de la organización territorial del Estado, no de la de las Comunidades Autónomas. El mismo apartado le reconoce personalidad jurídica y plena capacidad."
  citation: "art. 11.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-11
- id: m01-l10-q013
  prompt:
    es: "¿Cuáles son, en la legislación básica estatal de régimen local, los elementos que integran el Municipio?"
  options:
  - id: a
    text:
      es: "El territorio, el Padrón municipal y el Ayuntamiento."
  - id: b
    text:
      es: "La población, el Ayuntamiento y la Junta de Gobierno Local."
  - id: c
    correct: true
    text:
      es: "El territorio, la población y la organización."
  - id: d
    text:
      es: "El término municipal, la vecindad y la personalidad jurídica."
  explanation:
    es: "El artículo 11.2 LBRL dice: «Son elementos del Municipio el territorio, la población y la organización». El Padrón es el registro de la población, no un elemento. El Ayuntamiento y la Junta de Gobierno Local son órganos, parte de la organización. La vecindad y la personalidad jurídica no figuran en la lista."
  citation: "art. 11.2 LBRL"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1985-5392-art-12
- id: m01-l10-q014
  prompt:
    es: "Conforme a la legislación básica estatal de régimen local, el concepto de término municipal se define como:"
  options:
  - id: a
    text:
      es: "El conjunto de personas inscritas en el Padrón municipal."
  - id: b
    text:
      es: "El territorio de la provincia al que pertenece el municipio."
  - id: c
    text:
      es: "El núcleo de población en el que tiene su sede el ayuntamiento."
  - id: d
    correct: true
    text:
      es: "El territorio en que el ayuntamiento ejerce sus competencias."
  explanation:
    es: "El artículo 12.1 LBRL dice: «El término municipal es el territorio en que el ayuntamiento ejerce sus competencias». Las personas inscritas en el Padrón son la población del municipio (art. 15). El territorio provincial agrupa varios términos municipales. El núcleo de población donde está la sede del ayuntamiento es solo una parte del término."
  citation: "art. 12.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-13
- id: m01-l10-q015
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la alteración de términos municipales es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Se regula por la legislación autonómica sobre régimen local y no puede suponer modificación de los límites provinciales."
  - id: b
    text:
      es: "Se regula por ley orgánica de las Cortes Generales, igual que la alteración de los límites provinciales."
  - id: c
    text:
      es: "Se regula por la legislación autonómica y puede modificar los límites provinciales con informe del Estado."
  - id: d
    text:
      es: "Se regula por la legislación estatal y requiere la aprobación del Consejo de Ministros."
  explanation:
    es: "El artículo 13.1 LBRL remite la alteración de términos municipales a «la legislación de las Comunidades Autónomas sobre régimen local», sin que pueda suponer, «en ningún caso, modificación de los límites provinciales». La ley orgánica de las Cortes es la que exige el artículo 141.1 CE para los límites provinciales, no para los términos municipales. Ningún informe permite tocar los límites provinciales por esta vía. La ley no atribuye la decisión al Estado ni al Consejo de Ministros."
  citation: "art. 13.1 LBRL"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1985-5392-art-13
- id: m01-l10-q016
  prompt:
    es: "De acuerdo con el artículo 13.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la creación de nuevos municipios solo podrá realizarse sobre la base de núcleos de población territorialmente diferenciados:"
  options:
  - id: a
    text:
      es: "De al menos 2.000 habitantes."
  - id: b
    correct: true
    text:
      es: "De al menos 4.000 habitantes."
  - id: c
    text:
      es: "De al menos 5.000 habitantes."
  - id: d
    text:
      es: "De al menos 1.000 habitantes."
  explanation:
    es: "El artículo 13.2 LBRL exige núcleos de población territorialmente diferenciados «de al menos 4.000 habitantes». Las cifras de 1.000 y 5.000 habitantes aparecen en la LBRL para otras reglas: los servicios de secretaría e intervención que garantiza la Diputación y la Junta de Gobierno Local. La de 2.000 no está en el artículo."
  citation: "art. 13.2 LBRL"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-5392-art-15
- id: m01-l10-q017
  prompt:
    es: "¿En qué Padrón debe inscribirse quien vive en varios municipios, según la legislación básica estatal de régimen local?"
  options:
  - id: a
    text:
      es: "En el de cada uno de los municipios en que resida, indicando el principal."
  - id: b
    text:
      es: "En el del municipio en que tenga su domicilio fiscal a efectos tributarios."
  - id: c
    text:
      es: "En el del municipio que elija, comunicándolo a los demás municipios afectados."
  - id: d
    correct: true
    text:
      es: "Únicamente en el del municipio en que habite durante más tiempo al año."
  explanation:
    es: "El artículo 15 LBRL dice: «Quien viva en varios municipios deberá inscribirse únicamente en el que habite durante más tiempo al año». La inscripción es única, así que no cabe inscribirse en todos. El domicilio fiscal no es el criterio. La persona no elige el municipio: lo fija el tiempo de residencia."
  citation: "art. 15 LBRL"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-5392-art-15
- id: m01-l10-q018
  prompt:
    es: "La condición de vecino de un municipio, conforme a la legislación básica estatal de régimen local, se adquiere:"
  options:
  - id: a
    text:
      es: "Al cumplirse un año de residencia habitual en el municipio."
  - id: b
    correct: true
    text:
      es: "En el mismo momento de la inscripción en el Padrón municipal."
  - id: c
    text:
      es: "Al obtener el certificado de empadronamiento expedido por el ayuntamiento."
  - id: d
    text:
      es: "Al aprobar el Gobierno la revisión anual de las cifras del Padrón."
  explanation:
    es: "El artículo 15 LBRL dice: «La condición de vecino se adquiere en el mismo momento de su inscripción en el Padrón». No hay plazo de residencia previo. El certificado prueba la inscripción, pero no la produce. La revisión de las cifras oficiales de población no es el momento en que se adquiere la vecindad."
  citation: "art. 15 LBRL"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1985-5392-art-16
- id: m01-l10-q019
  prompt:
    es: "De acuerdo con el artículo 16.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las certificaciones que se expidan de los datos del Padrón municipal:"
  options:
  - id: a
    text:
      es: "Tendrán carácter de documento privado, salvo que las expida el Instituto Nacional de Estadística."
  - id: b
    text:
      es: "Tendrán carácter de documento público solo a efectos electorales y tributarios."
  - id: c
    correct: true
    text:
      es: "Tendrán carácter de documento público y fehaciente para todos los efectos administrativos."
  - id: d
    text:
      es: "Constituirán prueba de la nacionalidad y del estado civil de los vecinos."
  explanation:
    es: "El artículo 16.1 LBRL dice que esas certificaciones «tendrán carácter de documento público y fehaciente para todos los efectos administrativos». Son documento público aunque las expida el ayuntamiento. Su eficacia no se limita a efectos electorales o tributarios. Los datos del Padrón prueban la residencia y el domicilio habitual, no la nacionalidad ni el estado civil."
  citation: "art. 16.1 LBRL"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-5392-art-19
- id: m01-l10-q020
  prompt:
    es: "De acuerdo con el artículo 19.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, en los términos que establezca la legislación electoral general:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde por los Concejales o por los vecinos."
  - id: b
    text:
      es: "Los Concejales son elegidos mediante sufragio universal indirecto, y el Alcalde por los Concejales o por los vecinos."
  - id: c
    text:
      es: "Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde por el Pleno de la Diputación."
  - id: d
    text:
      es: "Los Concejales son designados por el Alcalde, y el Alcalde es elegido por los vecinos mediante sufragio universal directo."
  explanation:
    es: "El artículo 19.2 LBRL dice: «Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde es elegido por los Concejales o por los vecinos». El sufragio de los Concejales es directo, no indirecto. La Diputación no interviene en la elección del Alcalde. El Alcalde no designa a los Concejales."
  citation: "art. 19.2 LBRL"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-19
- id: m01-l10-q021
  prompt:
    es: "Según el artículo 19.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿a quién corresponden el gobierno y la administración municipal, salvo en los municipios que funcionen en Concejo Abierto?"
  options:
  - id: a
    text:
      es: "Al Pleno, integrado por todos los Concejales y presidido por el Alcalde."
  - id: b
    correct: true
    text:
      es: "Al ayuntamiento, integrado por el Alcalde y los Concejales."
  - id: c
    text:
      es: "A la Junta de Gobierno Local, presidida por el Alcalde."
  - id: d
    text:
      es: "A la asamblea vecinal, de la que forman parte todos los electores."
  explanation:
    es: "El artículo 19.1 LBRL atribuye el gobierno y la administración municipal «al ayuntamiento, integrado por el Alcalde y los Concejales». El Pleno y la Junta de Gobierno Local son órganos del ayuntamiento. La asamblea vecinal es propia del Concejo Abierto, que es justo la excepción del artículo (art. 29.3)."
  citation: "art. 19.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-20
