# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q118
  prompt:
    es: "¿En cuál de los siguientes tipos de contrato puede acordarse el procedimiento abierto simplificado de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "En los contratos de obras y de concesión de obras."
  - id: b
    correct: true
    text:
      es: "En los contratos de obras, suministro y servicios."
  - id: c
    text:
      es: "En los de concesión de obras y de concesión de servicios."
  - id: d
    text:
      es: "En los de suministro y servicios, pero no en los de obras."
  explanation:
    es: "El artículo 159.1 permite el procedimiento abierto simplificado «en los contratos de obras, suministro y servicios» que cumplan sus dos condiciones. Las concesiones de obras y de servicios no están en esa lista. Las obras sí lo están, con el límite de 2.000.000 de euros de valor estimado."
  citation: "art. 159.1 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q120
  prompt:
    es: "Con los umbrales vigentes desde el 1 de enero de 2026, ¿qué límite de valor estimado permite a un ministerio licitar un contrato de servicios por el procedimiento abierto simplificado?"
  options:
  - id: a
    text:
      es: "Valor estimado inferior a 143.000 euros."
  - id: b
    text:
      es: "Valor estimado inferior a 216.000 euros."
  - id: c
    text:
      es: "Valor estimado inferior a 60.000 euros."
  - id: d
    correct: true
    text:
      es: "Valor estimado inferior a 140.000 euros."
  explanation:
    es: "El artículo 159.1.a) exige, en suministro y servicios, un valor estimado «inferior a las cantidades establecidas en los artículos 21.1, letra a), y 22.1, letra a)». Desde el 1 de enero de 2026 el artículo 22.1.a) dice 140.000 euros. Los 143.000 euros eran la cifra anterior, que la Orden HAC/1517/2025 sustituyó. Los 216.000 euros son el umbral de la letra b), al que el artículo 159.1 no remite. Los 60.000 euros son el límite de la tramitación del artículo 159.6, no del abierto simplificado."
  citation: "art. 159.1.a) LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q121
  prompt:
    es: "Según el artículo 159.1.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, para usar el procedimiento abierto simplificado, los criterios evaluables mediante juicio de valor, si los hay, no pueden superar:"
  options:
  - id: a
    correct: true
    text:
      es: "El veinticinco por ciento del total, salvo en prestaciones de carácter intelectual."
  - id: b
    text:
      es: "El cincuenta por ciento del total, salvo en prestaciones de carácter intelectual."
  - id: c
    text:
      es: "El veinticinco por ciento del total, también en prestaciones de carácter intelectual."
  - id: d
    text:
      es: "El cuarenta y cinco por ciento del total, salvo en los contratos de obras."
  explanation:
    es: "El artículo 159.1.b) exige que los criterios evaluables mediante juicio de valor, si los hay, no superen «el veinticinco por ciento del total, salvo en el caso de que el contrato tenga por objeto prestaciones de carácter intelectual», donde el límite es el cuarenta y cinco por ciento. El cincuenta por ciento no es el límite del veinticinco ni el del cuarenta y cinco que fija el apartado. Las prestaciones de carácter intelectual no se quedan en el veinticinco: la excepción les da el cuarenta y cinco. El cuarenta y cinco por ciento es el límite de esas prestaciones, y la excepción se refiere a ellas, no a los contratos de obras."
  citation: "art. 159.1.b) LCSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q122
  prompt:
    es: "Un ministerio licita un servicio de arquitectura de 100.000 euros de valor estimado, con criterios de juicio de valor que pesan el 40 % del total. ¿Puede seguir el procedimiento abierto simplificado?"
  options:
  - id: a
    text:
      es: "No, porque los criterios de juicio de valor superan el 25 % del total."
  - id: b
    correct: true
    text:
      es: "Sí, porque en prestaciones intelectuales el juicio de valor puede llegar al 45 %."
  - id: c
    text:
      es: "No, porque los servicios de arquitectura deben licitarse por el procedimiento restringido."
  - id: d
    text:
      es: "Sí, porque el simplificado no limita el peso de los criterios de juicio de valor."
  explanation:
    es: "El valor estimado de 100.000 euros es inferior a los 140.000 euros del artículo 22.1.a), así que se cumple la primera condición. Sobre la segunda, el artículo 159.1.b) eleva el límite al cuarenta y cinco por ciento cuando el contrato tiene por objeto «prestaciones de carácter intelectual, como los servicios de ingeniería y arquitectura». Un 40 % queda dentro. El límite del 25 % es la regla general, que aquí no se aplica. Ningún precepto obliga a licitar estos servicios por el restringido. El simplificado sí limita el peso del juicio de valor."
  citation: "art. 159.1.b) LCSP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-159
- id: m03-l04-q124
  prompt:
    es: "Un contrato de obras de 1.800.000 euros de valor estimado, sin prestaciones de carácter intelectual, prevé criterios de juicio de valor que pesan el 30 % del total. ¿Puede tramitarse por el procedimiento abierto simplificado?"
  options:
  - id: a
    text:
      es: "Sí, porque el valor estimado no supera 2.000.000 de euros."
  - id: b
    text:
      es: "No, porque el valor estimado supera el umbral de 140.000 euros."
  - id: c
    text:
      es: "Sí, porque en obras el juicio de valor puede llegar al 45 % del total."
  - id: d
    correct: true
    text:
      es: "No, porque los criterios de juicio de valor superan el 25 % del total."
  explanation:
    es: "El valor estimado de 1.800.000 euros cumple el límite de obras del artículo 159.1.a), igual o inferior a 2.000.000 de euros. Falla la segunda condición: el artículo 159.1.b) exige que los criterios de juicio de valor no superen «el veinticinco por ciento del total», y aquí pesan el 30 %. Cumplir el valor estimado no basta, porque se exigen las dos condiciones. Los 140.000 euros son el límite de suministro y servicios, no de obras. El 45 % solo vale para prestaciones de carácter intelectual."
  citation: "art. 159.1.b) LCSP"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
