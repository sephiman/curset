# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q162
  prompt:
    es: "Señale la afirmación correcta sobre las generaciones de crédito según el artículo 53 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Pueden generar crédito los ingresos del propio ejercicio por ventas de bienes y prestación de servicios."
  - id: b
    text:
      es: "Las generaciones no exigen, en ningún caso, que se hayan efectuado antes los ingresos que las justifican."
  - id: c
    text:
      es: "Los ingresos legalmente afectados a actuaciones determinadas no pueden dar lugar a generación de crédito."
  - id: d
    text:
      es: "Las generaciones reducen los créditos cuando el ingreso realizado resulta inferior al previsto en el presupuesto."
  explanation:
    es: "El artículo 53.2.b) incluye las ventas de bienes y la prestación de servicios entre las fuentes de generación. La generación solo se hace una vez efectuados los ingresos, salvo la excepción de las aportaciones a organismos autónomos. Los ingresos legalmente afectados son el supuesto e). Las generaciones incrementan créditos, nunca los reducen."
  citation: "art. 53.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q168
  prompt:
    es: "Según el artículo 53.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué ingresos por reintegros de pagos indebidos pueden dar lugar a una generación de crédito?"
  options:
  - id: a
    text:
      es: "Los realizados con cargo a créditos de presupuestos de ejercicios anteriores ya cerrados."
  - id: b
    text:
      es: "Los de cualquier ejercicio, siempre que el Ministro de Hacienda autorice la generación."
  - id: c
    text:
      es: "Solo los que superen el importe del crédito inicial del concepto afectado por el pago."
  - id: d
    correct: true
    text:
      es: "Los realizados con cargo a créditos del presupuesto corriente."
  explanation:
    es: "El artículo 53.2.f) limita los reintegros que generan crédito a los de pagos indebidos hechos con cargo a créditos del presupuesto corriente. Los pagos de ejercicios cerrados, la autorización del Ministro de Hacienda como requisito para cualquier ejercicio y un umbral sobre el crédito inicial no figuran en el artículo."
  citation: "art. 53.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q169
  prompt:
    es: "Un ministerio ingresa reintegros de pagos indebidos hechos con cargo al presupuesto corriente y tramita una generación de crédito. ¿Qué efecto tiene esa modificación sobre sus créditos?"
  options:
  - id: a
    text:
      es: "Traspasa dotaciones de unos créditos a otros sin variar el importe total del presupuesto de gastos."
  - id: b
    correct: true
    text:
      es: "Incrementa los créditos como consecuencia de ingresos no previstos o superiores a los del presupuesto inicial."
  - id: c
    text:
      es: "Dota un crédito nuevo con la parte del remanente que quedó sin aplicar el ejercicio anterior."
  - id: d
    text:
      es: "Amplía el crédito hasta el importe de las obligaciones que se reconozcan y se liquiden en el ejercicio."
  explanation:
    es: "La generación incrementa los créditos como consecuencia de ingresos no previstos o superiores a los contemplados en el presupuesto inicial (art. 53.1). Traspasar dotaciones sin variar el total es la transferencia, dotar con remanente es la incorporación y ampliar hasta el importe de las obligaciones es la ampliación."
  citation: "art. 53.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q171
  prompt:
    es: "Un ministerio cobró en diciembre del ejercicio anterior el reembolso de un préstamo. Conforme al artículo 53.5 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede ese ingreso generar crédito en el ejercicio en curso?"
  options:
  - id: a
    text:
      es: "No, porque solo generan crédito los ingresos realizados en el propio ejercicio, sin excepción alguna."
  - id: b
    text:
      es: "Sí, porque generan crédito los ingresos realizados en cualquier momento del ejercicio anterior."
  - id: c
    correct: true
    text:
      es: "Sí, excepcionalmente, porque generan crédito los ingresos realizados en el último trimestre del ejercicio anterior."
  - id: d
    text:
      es: "No, porque los reembolsos de préstamos nunca dan lugar a generaciones de crédito."
  explanation:
    es: "El artículo 53.5 admite con carácter excepcional los ingresos del último trimestre del ejercicio anterior, y diciembre cae en él. La regla general del 53.2 (ingresos del propio ejercicio) tiene esa excepción, que no alcanza a todo el ejercicio anterior. Los reembolsos de préstamos sí figuran entre los ingresos que generan crédito (art. 53.2.d)."
  citation: "art. 53.5 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
