    correct: false
  - id: c
    text:
      es: La no división en lotes.
    correct: true
  - id: d
    text:
      es: 'El límite máximo del presupuesto estimado. 2019 ADVO-LI - EXTRAORDINARIO SEGUNDA PARTE NO OLVIDE MARCAR EL SUPUESTO
        ELEGIDO EN LA HOJA DE EXAMEN SUPUESTO I Con motivo de una fuerte tormenta producida el día 12 de abril de 2020, se
        rompió la puerta acristalada de acceso de la sede central del actual Ministerio de Hacienda y Función Pública, estropeándose
        los enganches de la puerta con la pared e inutilizando la fotocédula de apertura automática. Para el arreglo de los
        desperfectos, la Oficialía Mayor podría, por la cuantía, celebrar un contrato menor de obra por un importe de 7.000
        euros. Sin embargo, no se señalizó el peligro que podría suponer este desperfecto, de forma que el mismo día 12 D.
        Antonio Orrosco, que debía llevar a cabo unas gestiones en el Ministerio, al no percatarse de la situación, se cortó
        en la mano, necesitando intervención quirúrgica hospitalaria debido a los profundos cortes. Fue dado de alta por curación
        el 12 de junio de 2020. El 20 de abril de 2021, Dª. Mar Orrosco, como representante de su padre, presentó a través
        de la Sede Electrónica del Ministerio una reclamación, solicitando una indemnización de 70.000 euros por los daños
        sufridos por su padre y por la estancia en el hospital. En la reclamación facilitó su número de teléfono móvil y un
        domicilio físico a efectos de notificaciones. El órgano competente siguió en la tramitación del expediente el siguiente
        orden procedimental: primero requirió informe al responsable de la Oficialía Mayor del Departamento ministerial sobre
        la situación de la puerta. Una vez emitido, formuló propuesta de resolución que elevó al Consejo de Estado para su
        dictamen, y finalmente otorgó plazo de audiencia al interesado. De acuerdo con el Consejo de Estado, el órgano competente
        resolvió desestimatoriamente la reclamación. Esta resolución fue puesta a disposición de la reclamante en la sede
        electrónica el día 10 de septiembre de 2021, entendiendo el Ministerio que la reclamación había quedado notificada
        el día 25 de septiembre de 2021, al no haber accedido Dña. Mar electrónicamente al contenido de la misma. No obstante,
        se acuerda remitir la resolución desestimatoria al domicilio físico indicado por Dª Mar en su reclamación, siendo
        notificada ésta con fecha 1 de octubre. Contra la resolución, Dª. Mar presentó un recurso administrativo en el Registro
        del Ministerio con fecha 21 de octubre de 2021. Asimismo, la Sra. Orrosco presentó una sugerencia al Ministerio proponiendo
        una serie de medidas para mejorar la atención al ciudadano al amparo de lo establecido en el Real Decreto 951/2005,
        de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General
        del Estado. Por otra parte, con fecha de 30 de mayo de 2021 Dª Lucía Garrido Sánchez, funcionaria de carrera, se incorporó
        al Gabinete Técnico de la Subsecretaría del Ministerio de Política Territorial y Función Pública. Posteriormente,
        mediante el Real Decreto 507/2021, de 10 de julio, se procede a una reestructuración ministerial, pasando las competencias
        en materia de Función Pública al nuevo Ministerio de Hacienda y Función Pública. Por ello resultaba necesario proceder
        a una redistribución de los créditos del extinto Ministerio de Política Territorial y Función Pública entre los Ministerios
        de Política Territorial y de Hacienda y Función Pública. La reestructuración Ministerial hizo necesaria la realización
        de unas obras en la sede principal del Departamento del Ministerio de Hacienda y Función Pública, ubicada en el Paseo
        de la Castellana, número 3, por lo que fue necesario alquilar una nueva ubicación para los servicios administrativos
        en tanto finalizaban las obras. Para la financiación de las obras y para el arrendamiento de la nueva sede, Dª Lucía
        debe valorar si es posible utilizar créditos disponibles en diversos conceptos del presupuesto del Ministerio. Con
        motivo de la preparación del anteproyecto de ley de Presupuestos Generales del Estado para el año 2023, en el que
        se estaba trabajando, Dª. Lucía Garrido asumió funciones de apoyo en su elaboración, lo que le plantea también distintas
        cuestiones a resolver. Finalmente, Dª. Catalina Sáez Martínez, amiga de Dª Lucía y funcionaria del Cuerpo de Gestión
        de la Administración Civil del Estado desde el año 1998, está destinada como Jefe de Sección Nivel 24 en la Demarcación
        de Costas de Valencia. Aprueba el proceso selectivo por promoción interna para la Escala Técnica de Gestión de Organismos
        Autónomos y es nombrada funcionaria de carrera por Resolución de fecha 8 de enero de 2022, adjudicándosele un puesto
        de Jefe de Servicio Nivel 26 adscrito al Ministerio de Industria, Comercio y Turismo, en Madrid. El Ministerio de
        Hacienda y Función Pública tiene un puesto vacante de N28, cuya forma provisión es por concurso conforme a la Relación
        de Puestos de Trabajo. Dado que se precisa su cobertura urgente, el Departamento, con la conformidad de la Sra. Sáez,
        solicita la movilidad de la funcionaria al puesto N28. En relación con estos antecedentes, responda las siguientes
        preguntas:'
    correct: false
