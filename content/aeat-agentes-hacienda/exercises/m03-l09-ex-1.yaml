# anchor: boe-a-2005-14803-art-35
- id: m03-l09-q0029
  prompt:
    es: "Según el artículo 35.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el cheque presentado en una entidad de crédito que preste el servicio de caja debe reunir, además de los requisitos de la legislación mercantil:"
  options:
  - id: a
    text:
      es: "Ser al portador y cruzado, y estar conformado o certificado por la entidad librada, en fecha y forma."
  - id: b
    correct: true
    text:
      es: "Ser nominativo a favor del Tesoro público y cruzado, y estar conformado o certificado por la entidad librada, en fecha y forma."
  - id: c
    text:
      es: "Ser nominativo a favor del Tesoro público y cruzado, y estar avalado por el obligado al pago en el reverso."
  - id: d
    text:
      es: "Ser nominativo a favor del Tesoro público y no cruzado, y estar conformado por la entidad librada."
  explanation:
    es: "El cheque ha de ser nominativo a favor del Tesoro público y cruzado, y estar conformado o certificado por la entidad librada, en fecha y forma (artículo 35.1). El cheque al portador no cumple el requisito de nominatividad. El aval del obligado en el reverso no es un requisito del artículo. El cheque no debe ser no cruzado, porque el cruce es exigible."
  citation: "art. 35.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "cheque"
# anchor: boe-a-2005-14803-art-35
- id: m03-l09-q0030
  prompt:
    es: "Conforme al artículo 35.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la entrega del cheque en la entidad que preste el servicio de caja libera al deudor por el importe satisfecho siempre que se haga efectivo, y el efecto liberatorio se entiende producido:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde la fecha en que el cheque haya sido entregado en dicha entidad."
  - id: b
    text:
      es: "Desde la fecha en que el cheque se haga efectivo en la cuenta del librador."
  - id: c
    text:
      es: "Desde la fecha en que se emita el cheque, aunque no se entregue a la entidad."
  - id: d
    text:
      es: "Desde la fecha en que la Administración tributaria reciba el justificante validado."
  explanation:
    es: "El efecto liberatorio del cheque se produce desde que se entrega en la entidad, siempre que luego se haga efectivo (artículo 35.1). Retrasarlo hasta el cobro en la cuenta del librador o hasta el justificante en poder de la Administración se aparta del texto. Tampoco basta con emitirlo sin entregarlo."
  citation: "art. 35.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "cheque"
# anchor: boe-a-2005-14803-art-35
- id: m03-l09-q0031
  prompt:
    es: "Aitana Ruiz entrega el miércoles 10 de marzo de 2027 un cheque conformado, nominativo a favor del Tesoro público y cruzado, en una entidad de crédito que presta el servicio de caja. El cheque se hace efectivo el viernes 12 de marzo de 2027. ¿Desde qué fecha queda liberada la deudora por el importe del cheque, según el artículo 35.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Desde el viernes 12 de marzo de 2027, fecha en que se hace efectivo."
  - id: b
    text:
      es: "Desde el jueves 11 de marzo de 2027, día siguiente a la entrega."
  - id: c
    correct: true
    text:
      es: "Desde el miércoles 10 de marzo de 2027, fecha de entrega del cheque."
  - id: d
    text:
      es: "Desde el lunes 15 de marzo de 2027, primer día hábil tras el cobro."
  explanation:
    es: "La liberación opera por el importe satisfecho siempre que el cheque se haga efectivo, y con efecto desde la fecha de entrega en la entidad (artículo 35.1): el 10 de marzo. La fecha del cobro, el 12, no es el punto de partida del efecto. El día siguiente a la entrega y el primer día hábil tras el cobro tampoco aparecen en el precepto."
  citation: "art. 35.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "cheque"
  - "cómputo"
