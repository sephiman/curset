# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q099
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que amplía una búsqueda para incluir las subcarpetas es:"
  options:
  - id: a
    text:
      es: "Ctrl+Alt+A"
  - id: b
    text:
      es: "Ctrl+Mayús+F"
  - id: c
    text:
      es: "Ctrl+Alt+K"
  - id: d
    correct: true
    text:
      es: "Ctrl+Alt+Z"
  explanation:
    es: "Ctrl+Alt+Z amplía la búsqueda a las subcarpetas. Ctrl+Alt+A la amplía a Todos los elementos de correo, de calendario o de contactos. Ctrl+Alt+K la amplía a la carpeta actual. Ctrl+Mayús+F abre la Búsqueda avanzada."
  citation: "fuente: `ms-outlook-atajos.html`; «Expandir una búsqueda para incluir subcarpetas. — Ctrl+Alt+Z»"
  difficulty: 3
  tags:
  - "atajo"
