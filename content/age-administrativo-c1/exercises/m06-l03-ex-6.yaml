  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q207
  prompt:
    es: "En el Explorador de archivos de Windows 11, para cortar y pegar un archivo o una carpeta que están en Acceso rápido, antes hay que seleccionar con el clic derecho la opción:"
  options:
  - id: a
    text:
      es: "Anclar a acceso rápido"
  - id: b
    text:
      es: "Desanclar del acceso rápido"
  - id: c
    text:
      es: "Mostrar más opciones"
  - id: d
    correct: true
    text:
      es: "Abrir"
  explanation:
    es: "La nota de la página dice que, para los archivos y carpetas en Acceso rápido, hay que hacer clic con el botón derecho y seleccionar Abrir para poder cortar y pegar. Anclar y desanclar solo cambian si el elemento aparece en Acceso rápido, y Mostrar más opciones abre el menú contextual anterior."
