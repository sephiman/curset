- id: g-fixed-clock
  term:
    en: fixed clock
  definition:
    en: A clock that always returns the same instant. Its main use case is in testing, where the fixed clock ensures tests are not dependent on the current clock.
  origin: m11-l04
  citation: "javadoc-clock#fixed(java.time.Instant,java.time.ZoneId)"
- id: g-parameterized-test
  term:
    en: parameterized test
  definition:
    en: Parameterized tests make it possible to run a test method multiple times with different arguments. They are declared just like regular @Test methods but use the @ParameterizedTest annotation instead.
  origin: m11-l04
  citation: "junit-writing-parameterized#parameterized-classes-and-tests"
- id: g-shared-container
  term:
    en: shared container
  definition:
    en: Shared containers are defined as static fields in a top level test class and have to be annotated with @Container. Shared containers can't be declared inside nested test classes.
  origin: m11-l04
  citation: "testcontainers-junit5#shared-containers"
