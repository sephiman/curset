# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q046
  prompt:
    es: "Señale la definición de protocolo de comunicación que ofrece el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Un equipo o programa que guarda información y la ofrece a otras máquinas"
  - id: b
    text:
      es: "Un pequeño fichero que un sitio web guarda en el equipo del usuario"
  - id: c
    correct: true
    text:
      es: "Un sistema de reglas que permite a dos o más entidades comunicarse para transmitir información"
  - id: d
    text:
      es: "Un número único e irrepetible que identifica a todo sistema conectado a una red"
  explanation:
    es: "Según INCIBE, un protocolo es un sistema de reglas que permite que dos o más entidades se comuniquen para transmitir información. Un equipo o programa que guarda y ofrece información es la definición de servidor. Un número único que identifica a todo sistema conectado a una red es la dirección IP. Un pequeño fichero que guarda un sitio web en el equipo del usuario es una cookie."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.16.19. Protocolo»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q047
  prompt:
    es: "Señale lo que define la norma o estándar de un protocolo, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Solo el medio físico por el que viajan los datos entre las entidades"
  - id: b
    correct: true
    text:
      es: "La sintaxis, la semántica y la sincronización de la comunicación, y los métodos de recuperación de errores"
  - id: c
    text:
      es: "Solo el hardware que lo implementa, sin que el software pueda hacerlo"
  - id: d
    text:
      es: "La sintaxis, la semántica y la velocidad de la comunicación, pero no la recuperación de errores"
  explanation:
    es: "La norma de un protocolo define la sintaxis, la semántica y la sincronización de la comunicación y los posibles métodos de recuperación de errores. Cambiar la sincronización por la velocidad y quitar la recuperación de errores altera la lista que da el glosario. El protocolo sirve para cualquier tipo de medio físico, que no es lo que define. Los protocolos pueden implementarse por hardware, por software o por una combinación de ambos."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.16.19. Protocolo»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q048
  prompt:
    es: "En la familia de protocolos TCP/IP, según el glosario de términos de ciberseguridad de INCIBE, el protocolo TCP:"
  options:
  - id: a
    text:
      es: "Traduce nombres inteligibles en direcciones IP"
  - id: b
    text:
      es: "Cifra el tráfico con una clave que intercambian navegador y servidor"
  - id: c
    text:
      es: "Transfiere los paquetes de datos hasta su destino correcto"
  - id: d
    correct: true
    text:
      es: "Garantiza que la transferencia se lleve a cabo de forma correcta y fiable"
  explanation:
    es: "TCP se ocupa de garantizar que la transferencia de datos se lleve a cabo de forma correcta y confiable. Transferir los paquetes hasta su destino correcto es la función de IP. Traducir nombres en direcciones IP es la función del DNS. Cifrar el tráfico con una clave intercambiada entre navegador y servidor es lo que hace HTTPS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.2. TCP/IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q049
  prompt:
    es: "En la familia de protocolos TCP/IP, según el glosario de términos de ciberseguridad de INCIBE, el protocolo IP:"
  options:
  - id: a
    text:
      es: "Garantiza que la transferencia sea correcta y confiable"
  - id: b
    text:
      es: "Distingue si el usuario es un humano o un bot"
  - id: c
    text:
      es: "Asocia cada nombre de dominio con información variada sobre él"
  - id: d
    correct: true
    text:
      es: "Transfiere los paquetes de datos hasta su destino correcto"
  explanation:
    es: "El protocolo IP se ocupa de transferir los paquetes de datos hasta su destino correcto. Garantizar una transferencia correcta y confiable es la función de TCP. Asociar cada nombre de dominio con información sobre él es lo que hace el servicio DNS. Distinguir a un humano de un bot es la función del CAPTCHA."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.19.2. TCP/IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q050
  prompt:
    es: "Según el glosario de términos de ciberseguridad de INCIBE, ¿qué forma tiene una dirección IP en su versión v4, como en el ejemplo 192.168.121.40?"
  options:
  - id: a
    text:
      es: "Cuatro números del 0 al 1023 separados por puntos"
  - id: b
    text:
      es: "Un valor único de 48 bits escrito en el hardware de la interfaz"
  - id: c
    correct: true
    text:
      es: "Cuatro números del 0 al 255 separados por puntos"
  - id: d
    text:
      es: "Ocho grupos de cuatro dígitos hexadecimales separados por dos puntos"
  explanation:
    es: "Una dirección IP v4 es un conjunto de cuatro números del 0 al 255 separados por puntos, como 192.168.121.40. Los números llegan hasta 255, no hasta 1023. Los grupos hexadecimales separados por dos puntos son el formato del ejemplo de la versión v6. Un valor único de 48 bits escrito en el hardware de la interfaz es una dirección MAC, no una dirección IP."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q051
  prompt:
    es: "¿Cuál de las siguientes diferencias separa a las direcciones IP v6 de las v4, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Son idénticas en longitud, pero se escriben con letras en lugar de números"
  - id: b
    correct: true
    text:
      es: "Son mucho más complejas: hasta cuatro veces más largas y más seguras"
  - id: c
    text:
      es: "Son hasta dos veces más largas, sin diferencias de seguridad"
  - id: d
    text:
      es: "Son más sencillas: hasta cuatro veces más cortas y menos seguras"
  explanation:
    es: "Las direcciones v6 son mucho más complejas: hasta cuatro veces más largas, más seguras y con capacidad para muchos más sistemas conectados. Que sean más cortas y menos seguras invierte lo que dice el glosario. La v6 es hasta cuatro veces más larga, por lo que la longitud no es idéntica. La cifra del glosario es hasta cuatro veces más largas, y también las califica de más seguras."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q052
  prompt:
    es: "Señale la condición que hace privada una dirección IP, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Si es accesible directamente desde cualquier sistema conectado a Internet"
  - id: b
    text:
      es: "Si solo puede asignarse a sistemas sin ninguna conexión de red"
  - id: c
    text:
      es: "Si identifica únicamente a los servidores, y no a los demás equipos de la red"
  - id: d
    correct: true
    text:
      es: "Si es interna a una red local y solo accesible desde los equipos de esa red privada"
  explanation:
    es: "Una dirección IP es privada si es interna a una red LAN y solo accesible desde los equipos conectados a esa red privada. Ser accesible desde cualquier sistema conectado a Internet es lo que define a una dirección pública. Una dirección IP identifica a todo sistema conectado a una red, no solo a los servidores. Una dirección IP identifica a un sistema conectado a una red, incluida la red privada."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q053
  prompt:
    es: "¿Qué carácter tiene, según INCIBE, el número con el que se identifica a todo sistema conectado a una red mediante la dirección IP?"
  options:
  - id: a
    correct: true
    text:
      es: "Único e irrepetible, como la matrícula de un coche"
  - id: b
    text:
      es: "Compartido por todos los sistemas de la misma red local"
  - id: c
    text:
      es: "Variable, y cambia con cada paquete que envía el sistema"
  - id: d
    text:
      es: "Reservado a los servidores, sin identificar a los equipos cliente"
  explanation:
    es: "La dirección IP es un número único e irrepetible con el que se identifica a todo sistema conectado a una red; INCIBE lo compara con la matrícula de un coche. Un número que cambia con cada paquete contradice que sea único e irrepetible. Un número compartido por todos los sistemas de una red no identificaría a cada uno. La dirección IP identifica a todo sistema conectado, no solo a los servidores."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.12. Dirección IP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q054
  prompt:
    es: "Un usuario escribe un nombre de dominio fácil de recordar y su equipo localiza el sistema correspondiente. ¿Qué servicio traduce ese nombre en la dirección IP?"
  options:
  - id: a
    correct: true
    text:
      es: "El DNS, servicio de nombres de dominio"
  - id: b
    text:
      es: "El proxy, que centraliza el tráfico de la red privada"
  - id: c
    text:
      es: "El comando ping, que comprueba la conectividad IP"
  - id: d
    text:
      es: "El HTTPS, que cifra el tráfico con una clave"
  explanation:
    es: "El DNS traduce nombres inteligibles para las personas en las direcciones IP de los sistemas conectados a la red. HTTPS cifra el tráfico entre navegador y servidor, no traduce nombres. El proxy hace de intermediario entre las peticiones de la red privada e Internet, sin traducir nombres. El comando ping comprueba la conectividad IP con otro equipo mediante mensajes de eco, sin traducir nombres."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.17. DNS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q055
  prompt:
    es: "¿Cuál de los siguientes propósitos persigue el DNS, según INCIBE, al traducir los nombres de dominio en direcciones IP de los sistemas de la red?"
  options:
  - id: a
    text:
      es: "Distinguir si quien hace la consulta es un humano o un bot"
  - id: b
    text:
      es: "Cifrar la comunicación entre el navegador y el servidor"
  - id: c
    text:
      es: "Comprobar la integridad y autenticidad de los datos de las consultas"
  - id: d
    correct: true
    text:
      es: "Localizar y direccionar esos sistemas de una forma mucho más simple"
  explanation:
    es: "La traducción de nombres a direcciones IP tiene el propósito de localizar y direccionar los sistemas de una forma mucho más simple. Cifrar la comunicación entre navegador y servidor es lo que hace HTTPS. Comprobar la integridad y autenticidad de los datos es el objeto de las extensiones DNSSEC, que añaden una capa de seguridad. Distinguir a un humano de un bot es la función del CAPTCHA."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.17. DNS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q056
  prompt:
    es: "Según el glosario de términos de ciberseguridad de INCIBE, el término DNS (Domain Name Service) se refiere:"
  options:
  - id: a
    text:
      es: "Solo al servidor, y no al servicio que ofrece"
  - id: b
    correct: true
    text:
      es: "Tanto al servicio de nombres de dominio como al servidor que lo ofrece"
  - id: c
    text:
      es: "Solo al servicio, y nunca al servidor que lo presta"
  - id: d
    text:
      es: "Al protocolo que cifra el tráfico entre navegador y servidor"
  explanation:
    es: "DNS se refiere tanto al servicio de nombres de dominio como al servidor que ofrece dicho servicio. Decir que solo es el servicio excluye al servidor, que el glosario incluye. Decir que solo es el servidor excluye al servicio, que el glosario incluye. El protocolo que cifra el tráfico entre navegador y servidor es HTTPS, no DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.4.17. DNS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q057
  prompt:
    es: "¿Cuál de los siguientes grupos de protocolos cita el RFC 1122 como los más comunes de usuario dentro de la capa de aplicación del modelo TCP/IP?"
  options:
  - id: a
    correct: true
    text:
      es: "Telnet, FTP y SMTP: inicio de sesión remoto, transferencia de ficheros y correo"
  - id: b
    text:
      es: "Telnet, UDP y SMTP: inicio de sesión remoto, datagramas y correo"
  - id: c
    text:
      es: "FTP, ICMP y SMTP: transferencia de ficheros, errores y correo"
  - id: d
    text:
      es: "Telnet, FTP e IGMP: inicio de sesión remoto, ficheros y multidifusión"
  explanation:
    es: "El RFC 1122 cita como protocolos de usuario más comunes de la capa de aplicación Telnet (inicio de sesión remoto), FTP (transferencia de ficheros) y SMTP (correo). UDP es un protocolo de la capa de transporte, no de aplicación. ICMP es un protocolo de control de la capa de internet. IGMP es un protocolo de la capa de internet para grupos dinámicos de hosts."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q058
  prompt:
    es: "Según el RFC 1122, ¿cuáles son los dos protocolos principales de la capa de transporte del modelo TCP/IP?"
  options:
  - id: a
    text:
      es: "IP, que no ofrece garantías de entrega, e ICMP, que informa de errores"
  - id: b
    correct: true
    text:
      es: "TCP, orientado a conexión y fiable, y UDP, de datagramas sin conexión"
  - id: c
    text:
      es: "TCP, orientado a conexión, e IGMP, que forma grupos dinámicos de hosts"
  - id: d
    text:
      es: "Telnet, de inicio de sesión remoto, y FTP, de transferencia de ficheros"
  explanation:
    es: "La capa de transporte tiene dos protocolos principales: TCP, un servicio orientado a conexión y fiable, y UDP, un servicio de datagramas sin conexión. IP e ICMP son protocolos de la capa de internet, no de transporte. Telnet y FTP son protocolos de usuario de la capa de aplicación. IGMP es un protocolo de la capa de internet, y no es uno de los dos principales de transporte."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q059
  prompt:
    es: "Según el RFC 1122, ¿qué protocolos pertenecen a la capa de internet del modelo TCP/IP?"
  options:
  - id: a
    text:
      es: "IP, ICMP y SMTP"
  - id: b
    correct: true
    text:
      es: "IP, ICMP e IGMP"
  - id: c
    text:
      es: "IP, TCP e ICMP"
  - id: d
    text:
      es: "UDP, ICMP e IGMP"
  explanation:
    es: "Los protocolos de la capa de internet son IP, ICMP e IGMP. TCP es un protocolo de la capa de transporte. UDP es un protocolo de la capa de transporte. SMTP es un protocolo de usuario de la capa de aplicación."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q060
  prompt:
    es: "Según el RFC 1122, ¿qué garantías de entrega ofrece el protocolo IP a los datagramas que transporta de un host de origen a otro de destino?"
  options:
  - id: a
    correct: true
    text:
      es: "Ninguna de extremo a extremo: pueden llegar dañados, duplicados, desordenados o no llegar"
  - id: b
    text:
      es: "Garantiza el orden, aunque los datagramas pueden perderse por el camino"
  - id: c
    text:
      es: "Garantiza la entrega, aunque los datagramas pueden llegar desordenados"
  - id: d
    text:
      es: "Garantiza la entrega de todos los datagramas y en el orden en que se enviaron"
  explanation:
    es: "IP es un servicio sin conexión que no ofrece garantías de entrega de extremo a extremo: los datagramas pueden llegar dañados, duplicados, desordenados o no llegar, y las capas superiores dan la fiabilidad. Garantizar la entrega y el orden contradice que IP no ofrece garantías de entrega. Garantizar la entrega contradice que los datagramas pueden no llegar. Garantizar el orden contradice que los datagramas pueden llegar desordenados."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q061
  prompt:
    es: "¿Cuál de los siguientes servicios ofrece ICMP, según el RFC 1122, protocolo de control considerado parte integral de IP?"
  options:
  - id: a
    text:
      es: "Grupos dinámicos de hosts para la multidifusión IP"
  - id: b
    correct: true
    text:
      es: "Informes de errores y de congestión, y redirección a la pasarela del primer salto"
  - id: c
    text:
      es: "Fiabilidad de extremo a extremo, reordenación de segmentos y control de flujo"
  - id: d
    text:
      es: "Asignación de nombres de host, arranque y gestión de la red"
  explanation:
    es: "ICMP ofrece informes de errores, informes de congestión y redirección a la pasarela del primer salto. Los grupos dinámicos de hosts para multidifusión son función de IGMP. La fiabilidad de extremo a extremo, la reordenación y el control de flujo son de TCP. La asignación de nombres de host, el arranque y la gestión son tareas de los protocolos de apoyo, como el DNS."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q062
  prompt:
    es: "Según el RFC 1122, ¿con qué capas del modelo OSI equivale la capa de aplicación de la familia de protocolos de Internet?"
  options:
  - id: a
    correct: true
    text:
      es: "Con las dos capas superiores, Presentación y Aplicación"
  - id: b
    text:
      es: "Con las capas de Red y Enlace de datos"
  - id: c
    text:
      es: "Con las capas de Sesión y Transporte"
  - id: d
    text:
      es: "Con una sola capa, la de Aplicación del modelo OSI"
  explanation:
    es: "La capa de aplicación de Internet combina, en esencia, las funciones de las dos capas superiores del modelo OSI: Presentación y Aplicación. Sesión y Transporte no son las dos capas superiores del modelo OSI. Red y Enlace de datos son capas inferiores del modelo OSI. La capa de aplicación de Internet no se subdivide, y reúne las funciones de dos capas OSI, no de una."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q063
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al sistema de nombres de dominio (DNS) dentro de los protocolos de la capa de aplicación, según el RFC 1122?"
  options:
  - id: a
    correct: true
    text:
      es: "Es un protocolo de apoyo, usado para la asignación de nombres de host"
  - id: b
    text:
      es: "Es un protocolo de usuario que da servicio directo a los usuarios, como Telnet"
  - id: c
    text:
      es: "Es un protocolo de internet que lleva los datos del origen al destino"
  - id: d
    text:
      es: "Es un protocolo de transporte que ofrece servicio de extremo a extremo"
  explanation:
    es: "El RFC distingue protocolos de usuario y protocolos de apoyo: el DNS está entre los de apoyo, que sirven para asignar nombres de host, arrancar y gestionar. Los protocolos de usuario son los que dan servicio directo a los usuarios, como Telnet, FTP y SMTP; el DNS figura entre los de apoyo. El DNS es un protocolo de la capa de aplicación, no de transporte como TCP y UDP. Llevar los datos del origen al destino es la función de IP, en la capa de internet."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-rfc1122-capas-tcp-ip-txt
- id: m06-l08-q064
  prompt:
    es: "Según el RFC 1122, el protocolo UDP, uno de los dos principales de la capa de transporte del modelo TCP/IP, se describe:"
  options:
  - id: a
    text:
      es: "Como un servicio de transporte fiable, orientado a conexión y con control de flujo"
  - id: b
    text:
      es: "Como un protocolo de control que informa de errores y congestión"
  - id: c
    text:
      es: "Como un protocolo de usuario para la entrega de correo electrónico"
  - id: d
    correct: true
    text:
      es: "Como un servicio de transporte sin conexión, de datagramas"
  explanation:
    es: "UDP es un servicio de transporte sin conexión, de datagramas. Un servicio fiable, orientado a conexión y con control de flujo es TCP. Informar de errores y de congestión es lo que hace ICMP. La entrega de correo electrónico es la tarea de SMTP, protocolo de usuario de la capa de aplicación."
  citation: "fuente: `rfc1122-capas-tcp-ip.txt`; «1.1.3 Internet Protocol Suite»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-rfc1918-direcciones-privadas-txt
- id: m06-l08-q065
  prompt:
    es: "¿Cuál de los siguientes bloques de direcciones IP reservó la IANA para redes privadas y recibe en el RFC 1918 el nombre de «bloque de 24 bits»?"
  options:
  - id: a
    text:
      es: "10.0.0.0 a 10.0.255.255, con prefijo 10.0/16"
  - id: b
    text:
      es: "192.168.0.0 a 192.168.255.255, con prefijo 192.168/16"
  - id: c
    correct: true
    text:
      es: "10.0.0.0 a 10.255.255.255, con prefijo 10/8"
  - id: d
    text:
      es: "172.16.0.0 a 172.31.255.255, con prefijo 172.16/12"
  explanation:
    es: "El bloque de 24 bits es el que va de 10.0.0.0 a 10.255.255.255, con prefijo 10/8. 172.16.0.0 a 172.31.255.255 es el bloque de 20 bits. 192.168.0.0 a 192.168.255.255 es el bloque de 16 bits. El bloque reservado llega hasta 10.255.255.255, no hasta 10.0.255.255."
  citation: "fuente: `rfc1918-direcciones-privadas.txt`; «3. Private Address Space»"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-rfc1918-direcciones-privadas-txt
- id: m06-l08-q066
  prompt:
    es: "En la notación anterior a CIDR del RFC 1918, ¿qué es el bloque de direcciones privadas que va de 172.16.0.0 a 172.31.255.255?"
  options:
  - id: a
    correct: true
    text:
      es: "Un conjunto de 16 números de red de clase B contiguos"
  - id: b
    text:
      es: "Un conjunto de 256 números de red de clase C contiguos"
  - id: c
    text:
      es: "Un conjunto de 16 números de red de clase A contiguos"
  - id: d
    text:
      es: "Un único número de red de clase A"
  explanation:
    es: "El bloque 172.16.0.0 a 172.31.255.255 es un conjunto de 16 números de red de clase B contiguos. Un único número de red de clase A es el bloque 10.0.0.0 a 10.255.255.255. Un conjunto de 256 números de red de clase C contiguos es el bloque 192.168.0.0 a 192.168.255.255. El RFC habla de 16 números de clase B, no de clase A."
  citation: "fuente: `rfc1918-direcciones-privadas.txt`; «3. Private Address Space»"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-rfc1918-direcciones-privadas-txt
- id: m06-l08-q068
  prompt:
    es: "Señale la comunicación que puede mantener un equipo clasificado como privado, según el RFC 1918, entre las siguientes:"
  options:
  - id: a
    text:
      es: "Con los equipos públicos de otras empresas, pero no con los de la suya"
  - id: b
    correct: true
    text:
      es: "Con todos los equipos de la empresa, pero no por IP con equipos de fuera"
  - id: c
    text:
      es: "Con cualquier equipo de Internet, por IP directa, igual que un equipo público"
  - id: d
    text:
      es: "Solo con otros equipos privados de la misma empresa"
  explanation:
    es: "Un equipo privado se comunica con todos los de la empresa, públicos y privados, pero no tiene conectividad IP con ningún equipo de fuera; sí puede acceder a servicios externos mediante pasarelas intermedias. La conectividad IP con equipos de fuera de la empresa es lo que un equipo privado no tiene. Los equipos privados se comunican con los demás equipos de la empresa, tanto públicos como privados. No pueden tener conectividad IP con ningún equipo de fuera, ni público ni privado."
  citation: "fuente: `rfc1918-direcciones-privadas.txt`; «3. Private Address Space»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-rfc1918-direcciones-privadas-txt
- id: m06-l08-q069
  prompt:
    es: "Según el RFC 1918, pasar un equipo de la categoría privada a la pública, o al revés, implica:"
  options:
  - id: a
    text:
      es: "Solo cambiar la entrada DNS del equipo, que conserva su dirección IP"
  - id: b
    text:
      es: "Nada, porque el espacio privado y el público usan las mismas direcciones"
  - id: c
    correct: true
    text:
      es: "Cambiar su dirección IP, las entradas DNS correspondientes y la configuración de otros equipos"
  - id: d
    text:
      es: "Solo cambiar los archivos de configuración de los equipos de otras empresas"
  explanation:
    es: "Pasar un equipo de privado a público, o viceversa, supone cambiar su dirección IP, las entradas DNS adecuadas y los archivos de configuración de otros equipos que lo citen por su dirección. Conservar la dirección IP contradice que el cambio exige una dirección nueva. También hay que cambiar la dirección IP y las entradas DNS; los archivos afectados son de otros equipos que citen al equipo por su dirección. El espacio privado y el público son direcciones distintas, por lo que el paso exige cambiar la dirección."
  citation: "fuente: `rfc1918-direcciones-privadas.txt`; «3. Private Address Space»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-rfc1918-direcciones-privadas-txt
- id: m06-l08-q070
  prompt:
    es: "Según el RFC 1918, los paquetes con dirección privada de origen o de destino en los enlaces entre empresas:"
  options:
  - id: a
    correct: true
    text:
      es: "No deben reenviarse por esos enlaces, y su información de enrutamiento no debe propagarse"
  - id: b
    text:
      es: "Se reenvían con normalidad, porque las direcciones privadas tienen significado global"
  - id: c
    text:
      es: "Se reenvían, pero sin propagar la información de enrutamiento de esas redes"
  - id: d
    text:
      es: "Se reenvían solo si el destino es un equipo público de otra empresa"
  explanation:
    es: "Como las direcciones privadas no tienen significado global, su información de enrutamiento no se propaga en los enlaces entre empresas y los paquetes con esas direcciones no deben reenviarse por ellos. Las direcciones privadas no tienen significado global, que es la razón por la que no deben reenviarse. Tampoco deben reenviarse los paquetes, además de no propagarse el enrutamiento. No deben reenviarse paquetes con dirección privada de origen o de destino por esos enlaces."
  citation: "fuente: `rfc1918-direcciones-privadas.txt`; «3. Private Address Space»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-dominios-es-sobre-nosotros-html
- id: m06-l08-q071
  prompt:
    es: "¿En qué entidad está integrada la unidad responsable de gestionar el registro de nombres de dominio de Internet bajo el código de país «.es»?"
  options:
  - id: a
    text:
      es: "En el ICANN, la corporación internacional de nombres y números asignados"
  - id: b
    text:
      es: "En la Internet Society, que publicó la historia de Internet"
  - id: c
    correct: true
    text:
      es: "En la Entidad Pública Empresarial Red.es, del Gobierno de España"
  - id: d
    text:
      es: "En el Ministerio de Asuntos Económicos y Transformación Digital"
  explanation:
    es: "La página dice: «Somos la unidad responsable de la gestión del registro de nombres de dominio de Internet bajo el código de país \".es\" y estamos integrados en la Entidad Pública Empresarial Red.es del Gobierno de España». El ICANN aparece en otra frase: las actuaciones se realizan «en conformidad» con él, es decir, lo siguen, no es la entidad que integra la unidad. El Ministerio de Asuntos Económicos y Transformación Digital aparece como quien establece las directrices, no como entidad en la que se integra. Y la Internet Society no es la entidad que integra la unidad: la página la sitúa en Red.es, y la Internet Society es la fuente de otra página citada, la historia de Internet."
  citation: "fuente: `dominios-es-sobre-nosotros.html`; «Sobre nosotros»"
  difficulty: 1
  tags:
  - "concepto"
