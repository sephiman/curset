type: quiz
variants:
- id: m10-l05-qa01
  prompt:
    en: According to Pete Hodgson in Feature Toggles (aka Feature Flags), which statement about release toggles
      does he make?
  options:
  - id: a
    text:
      en: They are permanent by nature, left in place as a standing control
  - id: b
    correct: true
    text:
      en: They should generally not last much longer than a week or two
  - id: c
    text:
      en: Their toggling decision is typically very dynamic, changing per request
  - id: d
    text:
      en: Changing their toggling decision by rolling out a new release is unacceptable
  explanation:
    en: Hodgson writes that release toggles should generally not stick around much longer than a week or two, although
      product-centric toggles may stay longer. Hodgson writes that release toggles are transitionary by nature,
      so a permanent standing control is not what they are. The toggling decision for a release toggle is typically
      very static, according to his text, which contradicts a very dynamic per-request decision. In the same section,
      he says that changing the decision by rolling out a new release with a toggle configuration change is usually
      perfectly acceptable, not unacceptable.
  citation: fowler-feature-toggles#ReleaseToggles
- id: m10-l05-qa03
  prompt:
    en: According to Pete Hodgson in Feature Toggles (aka Feature Flags), which statement about managing the carrying
      cost of feature toggles does he make?
  options:
  - id: a
    correct: true
    text:
      en: Savvy teams treat toggles as inventory with a carrying cost, to be kept low
  - id: b
    text:
      en: Toggles are cheap to create, so they carry no cost once they are in the code
  - id: c
    text:
      en: A toggle removal task is added to the backlog only when an ops toggle is introduced
  - id: d
    text:
      en: A team that reaches its limit on toggles simply raises the limit to add a new one
  explanation:
    en: Hodgson writes that savvy teams view their feature toggles as inventory which comes with a carrying cost,
      and work to keep that inventory as low as possible. Hodgson states that toggles do come with a carrying cost,
      so cheap creation does not make them free once in the code. In the same text, he says that some teams always
      add a toggle removal task to the backlog whenever a release toggle is first introduced, which contradicts
      adding the removal task only for ops toggles. Once the limit is reached, he writes, whoever wants a new toggle
      must first do the work to remove an existing flag, which leaves no room for simply raising the limit.
  citation: fowler-feature-toggles#ManagingTheCarryingCostOfFeatureToggles
- id: m10-l05-qa05
  prompt:
    en: According to Danilo Sato in Parallel Change, which statement about the parallel change pattern does the
      article make?
  options:
  - id: a
    text:
      en: Code can be released only once the contract phase has been completed
  - id: b
    text:
      en: It requires an explicit version in the exposed API when evolving a remote API
  - id: c
    correct: true
    text:
      en: During the migrate phase the supplier has to support two different versions
  - id: d
    text:
      en: A feature flag cannot be used to control which version clients use
  explanation:
    en: Sato names as the downside of parallel change that during the migrate phase the supplier has to support
      two different versions, and clients could get confused about which is new and which is old. Sato writes that
      the pattern allows the code to be released in any of its three phases, not only after the contract phase.
      Parallel change on a remote API is described as an alternative to using an explicit version in the exposed
      API, which contradicts the claim that it requires one. In the same text, he says that during the migrate phase
      a feature flag can be used to control which version of the interface is used, which contradicts the claim
      that a feature flag cannot be used.
  citation: fowler-parallel-change#banner
