    text:
      es: "CONCAT no proporciona delimitador ni el argumento IgnoreEmpty"
  - id: d
    text:
      es: "UNIRCADENAS solo une números"
  explanation:
    es: "La página describe CONCAT como combinar el texto de varios rangos o cadenas, pero sin el delimitador ni los argumentos IgnoreEmpty. «CONCAT solo admite dos cadenas de texto en cada llamada a la función»: la página dice que CONCAT combina texto de varios rangos o cadenas. «UNIRCADENAS solo une números»: la página dice que UNIRCADENAS combina texto de varios rangos o cadenas. «CONCAT es de la versión 2013 y UNIRCADENAS de la 2019»: la página fecha CONCAT en 2019, igual que UNIRCADENAS."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de texto»"
  difficulty: 2
  tags:
  - "función"
