# anchor: boe-a-1984-17387-art-33
- id: m04-l04-q053
  prompt:
    es: "Según la nota del BOE al artículo 33 de la Ley 30/1984, de 2 de agosto, ese artículo, derogado por la disposición derogatoria única del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Quedó sin efecto el día en que entró en vigor el Estatuto, sin régimen transitorio."
  - id: b
    text:
      es: "Se mantiene vigente aunque se oponga al Estatuto, hasta que se dicten las Leyes de Función Pública."
  - id: c
    correct: true
    text:
      es: "Se mantiene vigente en tanto no se oponga al Estatuto, hasta que se dicten las Leyes de Función Pública."
  - id: d
    text:
      es: "Se mantiene vigente solo para el personal docente e investigador, en tanto no se oponga al Estatuto."
  explanation:
    es: "La nota del BOE al artículo 33 dice que el artículo, derogado por la disposición derogatoria única.b) del Estatuto, «se mantendrá vigente en tanto no se oponga a lo establecido en el mismo» hasta que se dicten las Leyes de Función Pública y las normas reglamentarias de desarrollo. La opción de la pérdida inmediata de efecto ignora esa vigencia. La de la vigencia aunque se oponga suprime el límite «en tanto no se oponga». La del personal docente restringe a un colectivo una vigencia que la nota no restringe."
  citation: "art. 33 Ley 30/1984"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q054
  prompt:
    es: "Según el artículo 67.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, da lugar a la jubilación el reconocimiento de una pensión de incapacidad permanente:"
  options:
  - id: a
    text:
      es: "Parcial en relación con el ejercicio de las funciones de su cuerpo o escala."
  - id: b
    text:
      es: "Total para una profesión distinta de las funciones de su cuerpo o escala."
  - id: c
    correct: true
    text:
      es: "Absoluta o total en relación con el ejercicio de las funciones de su cuerpo o escala."
  - id: d
    text:
      es: "Absoluta, pero no la total, en relación con las funciones de su cuerpo o escala."
  explanation:
    es: "El artículo 67.1.c) recoge el reconocimiento de «una pensión de incapacidad permanente absoluta o, incapacidad permanente total en relación con el ejercicio de las funciones de su cuerpo o escala». La incapacidad parcial no figura. La total para otra profesión no guarda relación con las funciones del cuerpo o escala. La opción que excluye la total deja fuera una de las dos que el artículo admite."
  citation: "art. 67.1 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q055
  prompt:
    es: "Señale la respuesta correcta sobre la jubilación según el artículo 67 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "La jubilación forzosa se declara a solicitud del funcionario que cumple sesenta y cinco años."
  - id: b
    text:
      es: "La prolongación en el servicio activo se concede siempre que el funcionario la solicite."
  - id: c
    correct: true
    text:
      es: "Puede deberse a la declaración de incapacidad permanente para las funciones propias de su cuerpo o escala."
  - id: d
    text:
      es: "Los funcionarios con normas estatales específicas de jubilación pueden prolongar hasta los setenta años."
  explanation:
    es: "El artículo 67.1.c) admite la jubilación «Por la declaración de incapacidad permanente para el ejercicio de las funciones propias de su cuerpo o escala». La jubilación forzosa se declara de oficio, no a solicitud (art. 67.3). La prolongación exige una resolución motivada que puede denegarla. Los funcionarios con normas estatales específicas de jubilación quedan excluidos de la prolongación."
  citation: "art. 67.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q056
  prompt:
    es: "Un funcionario incluido en el Régimen General de la Seguridad Social nació el jueves 14 de abril de 1960. No llegará a treinta y ocho años y seis meses cotizados y no pide prolongar su servicio activo. ¿En qué fecha cumple la edad de jubilación forzosa?"
  options:
  - id: a
    text:
      es: "El lunes 14 de abril de 2025."
  - id: b
    text:
      es: "El domingo 14 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles 14 de abril de 2027."
  - id: d
    text:
      es: "El domingo 14 de abril de 2030."
  explanation:
    es: "El artículo 67.4 TREBEP remite, para el funcionario del Régimen General, a la edad de la pensión contributiva sin coeficiente reductor. Desde 2027 es de sesenta y siete años, o sesenta y cinco con treinta y ocho años y seis meses cotizados (art. 205.1.a) y disposición transitoria séptima LGSS). Sin esa cotización la edad es sesenta y siete, y la cumple el miércoles 14 de abril de 2027. El lunes 14 de abril de 2025 son los sesenta y cinco años del artículo 67.3, que el apartado 4 desplaza para este funcionario. El domingo 14 de febrero de 2027 corresponde a sesenta y seis años y diez meses, la edad del cuadro para 2026, que ya no rige en 2027. El domingo 14 de abril de 2030 son los setenta años, el máximo de una prolongación que no ha pedido."
  citation: "art. 67.4 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q057
  prompt:
    es: "Una funcionaria incluida en el Régimen General de la Seguridad Social nació el viernes 8 de junio de 1962. Al cumplir sesenta y cinco años acredita treinta y ocho años y seis meses cotizados, y no pide prolongar su servicio activo. ¿En qué fecha cumple la edad de jubilación forzosa?"
  options:
  - id: a
    text:
      es: "El viernes 8 de junio de 2029."
  - id: b
    text:
      es: "El domingo 8 de abril de 2029."
  - id: c
    text:
      es: "El martes 8 de junio de 2032."
  - id: d
    correct: true
    text:
      es: "El martes 8 de junio de 2027."
  explanation:
    es: "El artículo 67.4 TREBEP remite a la edad de la pensión contributiva sin coeficiente reductor. Desde 2027 es de sesenta y cinco años cuando se acreditan treinta y ocho años y seis meses de cotización (art. 205.1.a) y disposición transitoria séptima LGSS). Ella los acredita justo al cumplirlos, el martes 8 de junio de 2027. El viernes 8 de junio de 2029 son los sesenta y siete años de quien no llega a esa cotización. El domingo 8 de abril de 2029 corresponde a sesenta y seis años y diez meses, la edad del cuadro para 2026. El martes 8 de junio de 2032 es el máximo de una prolongación que no ha pedido."
  citation: "art. 67.4 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q058
  prompt:
    es: "Un funcionario ajeno al Régimen General de la Seguridad Social, sin normas estatales específicas de jubilación, nació el sábado 20 de octubre de 1962 y no pide prolongar su servicio activo. ¿Qué día se declara de oficio su jubilación forzosa?"
  options:
  - id: a
    text:
      es: "El sábado 20 de octubre de 2029."
  - id: b
    text:
      es: "El lunes 20 de agosto de 2029."
  - id: c
    text:
      es: "El miércoles 20 de octubre de 2032."
  - id: d
    correct: true
    text:
      es: "El miércoles 20 de octubre de 2027."
  explanation:
    es: "Al funcionario fuera del Régimen General no se le aplica el apartado 4, y el artículo 67.3 dice que la jubilación forzosa «se declarará de oficio al cumplir el funcionario los sesenta y cinco años de edad»: el miércoles 20 de octubre de 2027. El sábado 20 de octubre de 2029 son los sesenta y siete años del Régimen General. El lunes 20 de agosto de 2029 corresponde a sesenta y seis años y diez meses, una edad del cuadro de la Seguridad Social para 2026. El miércoles 20 de octubre de 2032 es el máximo de una prolongación que no ha pedido."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q059
  prompt:
    es: "Una funcionaria ajena al Régimen General de la Seguridad Social, sin normas estatales específicas de jubilación, nació el sábado 3 de marzo de 1962. ¿Hasta qué fecha puede, como máximo, prolongar su permanencia en el servicio activo?"
  options:
  - id: a
    text:
      es: "El miércoles 3 de marzo de 2027."
  - id: b
    text:
      es: "El sábado 3 de marzo de 2029."
  - id: c
    text:
      es: "El viernes 3 de marzo de 2034."
  - id: d
    correct: true
    text:
      es: "El miércoles 3 de marzo de 2032."
  explanation:
    es: "El artículo 67.3 permite solicitar la prolongación de la permanencia en el servicio activo «como máximo hasta que se cumpla setenta años de edad». Ella los cumple el miércoles 3 de marzo de 2032. El miércoles 3 de marzo de 2027 es la edad de la jubilación forzosa de oficio, no el máximo de la prolongación. El sábado 3 de marzo de 2029 son los sesenta y siete años del Régimen General. El viernes 3 de marzo de 2034 supera el límite de setenta años."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1984-17387-art-33
- id: m04-l04-q060
  prompt:
    es: "Según el artículo 33 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, un funcionario nacido el viernes 22 de septiembre de 1961 que prolonga voluntariamente su servicio activo y no cesa antes será declarado jubilado forzoso, como máximo:"
  options:
  - id: a
    text:
      es: "El martes 22 de septiembre de 2026."
  - id: b
    text:
      es: "El viernes 22 de septiembre de 2028."
  - id: c
    correct: true
    text:
      es: "El lunes 22 de septiembre de 2031."
  - id: d
    text:
      es: "El jueves 22 de septiembre de 2033."
  explanation:
    es: "El artículo 33 Ley 30/1984 retrasa la declaración de jubilación forzosa hasta que el funcionario cese en el servicio activo, si prolonga voluntariamente su permanencia «hasta, como máximo, los setenta años de edad»: el lunes 22 de septiembre de 2031. El martes 22 de septiembre de 2026 es la edad de la declaración sin prolongación. El viernes 22 de septiembre de 2028 no es una edad que el artículo mencione. El jueves 22 de septiembre de 2033 supera el máximo de setenta años."
  citation: "art. 33 Ley 30/1984"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-68
- id: m04-l04-q061
  prompt:
    es: "¿Cuál de los siguientes pares de causas de pérdida de la condición de funcionario permite solicitar una rehabilitación que será concedida?"
  options:
  - id: a
    text:
      es: "La renuncia voluntaria o la jubilación forzosa por edad."
  - id: b
    correct: true
    text:
      es: "La pérdida de la nacionalidad o la jubilación por incapacidad permanente."
  - id: c
    text:
      es: "La sanción firme de separación del servicio o la renuncia voluntaria aceptada."
  - id: d
    text:
      es: "La jubilación forzosa por edad o la sanción firme de separación."
  explanation:
    es: "El artículo 68.1 prevé la rehabilitación tras la extinción «como consecuencia de pérdida de la nacionalidad o jubilación por incapacidad permanente para el servicio». La renuncia, la jubilación forzosa por edad y la separación firme del servicio no están en ese apartado."
  citation: "art. 68.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-68
- id: m04-l04-q062
  prompt:
    es: "De acuerdo con el artículo 68.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, quien perdió su condición por jubilación por incapacidad permanente puede solicitar la rehabilitación:"
  options:
  - id: a
    text:
      es: "Dentro de los cinco años siguientes a la pérdida de la condición."
  - id: b
    text:
      es: "Una vez transcurridos dos años desde la pérdida de la condición."
  - id: c
    text:
      es: "Antes de la edad de jubilación forzosa, haya o no desaparecido la causa."
  - id: d
    correct: true
    text:
      es: "Una vez desaparecida la causa objetiva que motivó la jubilación."
  explanation:
    es: "El artículo 68.1 permite pedir la rehabilitación «una vez desaparecida la causa objetiva que la motivó». El artículo no fija un plazo de cinco años ni una espera de dos. La opción de pedirla aunque la causa no haya desaparecido prescinde del único requisito del apartado."
  citation: "art. 68.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-68
- id: m04-l04-q063
  prompt:
    es: "Según el artículo 68.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando quien perdió la condición por pérdida de la nacionalidad pide la rehabilitación tras desaparecer la causa:"
  options:
  - id: a
    text:
      es: "La Administración podrá concederla con carácter excepcional."
  - id: b
    text:
      es: "La Administración podrá concederla si hay vacante en su cuerpo."
  - id: c
    text:
      es: "La Administración le nombrará funcionario interino en su cuerpo."
  - id: d
    correct: true
    text:
      es: "La Administración le concederá la rehabilitación de su condición."
  explanation:
    es: "El artículo 68.1 dice que el interesado podrá solicitar la rehabilitación, «que le será concedida». La concesión no es discrecional. La opción del carácter excepcional y la de la vacante la convierten en una facultad de la Administración. El nombramiento como interino no es una rehabilitación de la condición de funcionario de carrera."
  citation: "art. 68.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-68
- id: m04-l04-q064
  prompt:
    es: "Una funcionaria jubilada por incapacidad permanente para el servicio se recupera, y desaparece la causa objetiva de su jubilación. ¿Qué puede hacer para volver a ser funcionaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Solicitar la rehabilitación de su condición, que le será concedida."
  - id: b
    text:
      es: "Superar un nuevo proceso selectivo, único modo de volver a ser funcionaria."
  - id: c
    text:
      es: "Solicitar la rehabilitación, que solo se concede con carácter excepcional."
  - id: d
    text:
      es: "Solicitar el reingreso desde la excedencia voluntaria por interés particular."
  explanation:
    es: "El artículo 68.1 TREBEP permite a quien perdió la condición por jubilación por incapacidad permanente solicitar, desaparecida la causa objetiva, la rehabilitación de su condición, «que le será concedida». No necesita un nuevo proceso selectivo. La concesión no es excepcional. La excedencia por interés particular es una situación de quien sigue siendo funcionario, y ella perdió la condición."
  citation: "art. 68.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
