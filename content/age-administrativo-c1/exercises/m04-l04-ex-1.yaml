# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q014
  prompt:
    es: "El nombramiento de una funcionaria de carrera se publica en el «Boletín Oficial del Estado» el miércoles 13 de enero de 2027. No supone cambio de localidad de residencia y no hay festivos en el periodo. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El miércoles 3 de febrero de 2027."
  - id: b
    text:
      es: "El martes 2 de febrero de 2027."
  - id: c
    text:
      es: "El jueves 14 de enero de 2027."
  - id: d
    correct: true
    text:
      es: "El jueves 28 de enero de 2027."
  explanation:
    es: "El artículo 114.12 RDL 6/2023 fija quince días naturales desde la publicación del nombramiento para el funcionario de carrera sin cambio de localidad. El artículo 30.3 LPAC manda contar los plazos en días a partir del día siguiente a la publicación: del jueves 14 de enero al jueves 28 de enero de 2027 hay quince días, sábados y domingos incluidos. El miércoles 3 de febrero sale de contar quince días hábiles, y el artículo 114.12 los fija naturales. El martes 2 de febrero corresponde a veinte días naturales, y el plazo es de quince. El jueves 14 de enero es el día de la toma de posesión del interino y del eventual, que lo hacen «al día siguiente al del nombramiento», no la de la funcionaria de carrera."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q015
  prompt:
    es: "El nombramiento de un funcionario de carrera se publica en el «Boletín Oficial del Estado» el martes 19 de enero de 2027 y supone cambio de localidad de residencia. No hay festivos en el periodo. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El miércoles 3 de febrero de 2027."
  - id: b
    text:
      es: "El martes 9 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 19 de febrero de 2027."
  - id: d
    text:
      es: "El viernes 19 de marzo de 2027."
  explanation:
    es: "El artículo 114.12 del Real Decreto-ley 6/2023 no dice si cuenta el día de la publicación; con el artículo 30 LPAC, el cómputo empieza el día siguiente. Con cambio de localidad de residencia el plazo es de un mes, y el artículo 30.4 LPAC lo hace terminar el mismo día del mes de vencimiento: el viernes 19 de febrero de 2027. El miércoles 3 de febrero de 2027 son los quince días naturales del nombramiento sin cambio de localidad. El martes 9 de febrero de 2027 sale de contar quince días hábiles. El viernes 19 de marzo de 2027 corresponde a dos meses."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q016
  prompt:
    es: "El nombramiento de una funcionaria de carrera se publica en el «Boletín Oficial del Estado» el miércoles 31 de marzo de 2027 y supone cambio de localidad de residencia. Ningún día de abril es festivo en la localidad. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El sábado 1 de mayo de 2027."
  - id: b
    text:
      es: "El lunes 3 de mayo de 2027."
  - id: c
    text:
      es: "El jueves 15 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes 30 de abril de 2027."
  explanation:
    es: "El artículo 114.12 del Real Decreto-ley 6/2023 no dice si cuenta el día de la publicación; con el artículo 30 LPAC, el cómputo empieza el día siguiente. El plazo es de un mes. Abril no tiene día 31, y el artículo 30.4 LPAC dice que, si en el mes de vencimiento no hay día equivalente, el plazo expira el último día del mes: el viernes 30 de abril de 2027. El sábado 1 de mayo de 2027 sale de desbordar abril con un día 31 que no existe. El lunes 3 de mayo de 2027 añade a ese error el traslado al siguiente día hábil. El jueves 15 de abril de 2027 son los quince días naturales del nombramiento sin cambio de localidad."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q017
  prompt:
    es: "El nombramiento de un funcionario de carrera se firma el lunes 8 de febrero de 2027 y se publica en el «Boletín Oficial del Estado» el jueves 11 de febrero de 2027. Sin cambio de localidad ni festivos en el periodo, ¿cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El martes 23 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes 26 de febrero de 2027."
  - id: c
    text:
      es: "El jueves 4 de marzo de 2027."
  - id: d
    text:
      es: "El jueves 11 de marzo de 2027."
  explanation:
    es: "El artículo 114.12 del Real Decreto-ley 6/2023 cuenta los quince días naturales «a partir de la publicación del nombramiento», no desde su firma. Con el artículo 30 LPAC, el cómputo empieza el día siguiente a la publicación, el viernes 12 de febrero de 2027, y el decimoquinto día natural es el viernes 26 de febrero de 2027; febrero de 2027 tiene 28 días, pero el plazo termina antes. El martes 23 de febrero de 2027 cuenta desde la firma de la resolución. El jueves 4 de marzo de 2027 sale de contar quince días hábiles. El jueves 11 de marzo de 2027 es el plazo de un mes, que solo rige con cambio de localidad."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 3
  tags:
