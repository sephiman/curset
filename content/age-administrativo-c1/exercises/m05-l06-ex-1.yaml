# anchor: boe-a-2017-12902-art-116
- id: m05-l06-q001
  prompt:
    es: "Según el artículo 116.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué se incorpora al expediente de una entidad estatal con presupuesto estimativo en lugar del certificado de existencia de crédito?"
  options:
  - id: a
    correct: true
    text:
      es: "Un documento equivalente que acredite la existencia de financiación del contrato."
  - id: b
    text:
      es: "Un informe de la Intervención que acredite la disponibilidad de tesorería del ejercicio."
  - id: c
    text:
      es: "Un certificado de cumplimiento de los límites autorizados para compromisos de gasto futuros."
  - id: d
    text:
      es: "Una resolución del órgano de contratación que apruebe el presupuesto estimativo de la entidad."
  explanation:
    es: "El artículo 116.3 prevé que las entidades del sector público estatal con presupuesto estimativo incorporen, en lugar del certificado de existencia de crédito, un «documento equivalente que acredite la existencia de financiación». El informe de tesorería, el certificado de límites de compromisos futuros (que pertenece a la tramitación anticipada) y la resolución que aprueba el presupuesto estimativo no son lo que el artículo exige como sustituto."
  citation: "art. 116.3 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-117
- id: m05-l06-q004
  prompt:
    es: "Los expedientes de contratación pueden ultimarse, aunque la ejecución deba iniciarse en el ejercicio siguiente, incluso con:"
  options:
  - id: a
    text:
      es: "La aprobación del expediente y la apertura del procedimiento de adjudicación."
  - id: b
    correct: true
    text:
      es: "La adjudicación y formalización del correspondiente contrato."
  - id: c
    text:
      es: "La adjudicación del contrato, quedando su formalización para el ejercicio siguiente."
  - id: d
    text:
      es: "La recepción de la prestación y el reconocimiento de la obligación correspondiente."
  explanation:
    es: "La tramitación anticipada del artículo 117.2 permite ultimar el expediente «incluso con la adjudicación y formalización del correspondiente contrato». Detenerse en la aprobación del expediente o en la adjudicación sin formalizar no es lo que dice el artículo, y la recepción y el reconocimiento de la obligación son fases de la ejecución, que empieza después."
  citation: "art. 117.2 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-117
- id: m05-l06-q005
  prompt:
    es: "Según el artículo 117.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, para ultimar un expediente cuya ejecución se inicia en el ejercicio siguiente pueden comprometerse créditos:"
  options:
  - id: a
    text:
      es: "Sin limitación alguna, al tratarse de un gasto plurianual de un contrato ya adjudicado y formalizado."
  - id: b
    correct: true
    text:
      es: "Con las limitaciones de las normas presupuestarias de cada Administración Pública sujeta a esta Ley."
  - id: c
    text:
      es: "Hasta el límite del cincuenta por ciento del crédito disponible en el ejercicio corriente."
  - id: d
    text:
      es: "Únicamente con la autorización previa del Consejo de Ministros en cada expediente."
  explanation:
    es: "El artículo 117.2 remite a las normas presupuestarias de cada Administración: los créditos se comprometen «con las limitaciones que se determinen» en ellas. No hay libertad total de compromiso, ni un tope fijo del cincuenta por ciento en este artículo, ni una autorización del Consejo de Ministros que el artículo exija en cada expediente."
  citation: "art. 117.2 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-2627-regla-42
- id: m05-l06-q006
  prompt:
    es: "En la tramitación anticipada de un expediente de contratación, el pliego hace constar que la adjudicación y formalización quedan sometidas a:"
  options:
  - id: a
    text:
      es: "La condición resolutoria de que se reduzca el crédito en la Ley de Presupuestos."
  - id: b
    text:
      es: "La autorización previa del Consejo de Ministros para el compromiso de gasto plurianual del contrato."
  - id: c
    correct: true
    text:
      es: "La condición suspensiva de existencia de crédito adecuado y suficiente en ese ejercicio."
  - id: d
    text:
      es: "El informe favorable de la oficina de contabilidad sobre los límites de compromisos."
  explanation:
    es: "La regla 42.2.a) manda hacer constar en el pliego que la adjudicación y formalización «queda sometida a la condición suspensiva de existencia de crédito adecuado y suficiente». No es una condición resolutoria, que operaría después de adjudicar. La autorización del Consejo de Ministros y el informe de la oficina de contabilidad no son la condición que el pliego recoge."
  citation: "regla 42.2 IOC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l06-q008
  prompt:
    es: "¿Cuál de las siguientes secuencias de documentos contables expide el Servicio gestor en un expediente de contratación, según la Instrucción de operatoria contable?"
  options:
  - id: a
    text:
      es: "Un RC al inicio, un D al aprobarse el expediente de gasto y un A al formalizarse el contrato."
  - id: b
    text:
      es: "Un A al inicio, un RC al aprobarse el expediente de gasto y un D al formalizarse el contrato."
  - id: c
    text:
      es: "Un RC al inicio, un A al adjudicarse el contrato y un D al iniciarse su ejecución."
  - id: d
    correct: true
    text:
      es: "Un RC al inicio, un A al aprobarse el expediente de gasto y un D al formalizarse el contrato."
  explanation:
    es: "La regla 77 fija la secuencia: el RC al inicio del expediente, el A «una vez que se apruebe el expediente de gasto» y el D «cuando se formalicen los contratos». Las opciones que invierten A y D, que empiezan por un A o que sitúan el A en la adjudicación y el D en el inicio de la ejecución alteran esa secuencia."
  citation: "regla 77.1–2 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l06-q009
  prompt:
    es: "Un contrato se formaliza el 15 de marzo de 2027. ¿Qué documento contable expide entonces el Servicio gestor competente?"
  options:
  - id: a
    text:
      es: "Un documento A por el importe del presupuesto corriente y, en su caso, otro A de ejercicios posteriores."
  - id: b
    text:
      es: "Un documento RC por el importe del presupuesto corriente y, en su caso, otro RC de ejercicios posteriores."
  - id: c
    text:
      es: "Un documento OK por el importe del presupuesto corriente, que se remite junto al pliego."
  - id: d
    correct: true
    text:
      es: "Un documento D por el importe del presupuesto corriente y, en su caso, otro D de ejercicios posteriores."
  explanation:
    es: "La regla 77.2 dispone que, cuando se formalicen los contratos, el Servicio gestor expida el documento D por el importe del presupuesto corriente y, en su caso, un D de ejercicios posteriores, que se remiten con el contrato a la oficina de contabilidad. El A corresponde a la aprobación del expediente de gasto y el RC al inicio del expediente. El documento OK corresponde al reconocimiento de la obligación y no se remite con el pliego."
  citation: "regla 77.1–2 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l06-q010
  prompt:
    es: "Resuelto un contrato, ¿por qué importe expide el Servicio gestor los documentos AD y RC negativos?"
  options:
  - id: a
    text:
      es: "El importe total de adjudicación del contrato, con independencia de lo ya ejecutado por el contratista."
  - id: b
    correct: true
    text:
      es: "El importe no ejecutado del contrato, según se deduzca de la liquidación que se practique."
  - id: c
    text:
      es: "El importe de la garantía definitiva constituida, que se devuelve tras la resolución."
  - id: d
    text:
      es: "El importe de las penalidades impuestas al contratista hasta la fecha de resolución."
  explanation:
    es: "La regla 77.7 manda expedir los documentos AD y RC negativos «por el importe no ejecutado del contrato según se deduzca de la liquidación». El importe total de adjudicación anularía también lo ya ejecutado, y ni la garantía definitiva ni las penalidades miden el crédito que queda libre."
  citation: "regla 77.7 IOC"
  difficulty: 1
  tags:
  - "cantidad"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q012
  prompt:
    es: "De acuerdo con el artículo 198.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en los contratos de tracto sucesivo el pago del precio puede hacerse:"
  options:
  - id: a
    text:
      es: "Únicamente al finalizar el contrato, una vez aprobada la liquidación del mismo."
  - id: b
    text:
      es: "Solo mediante un abono anual coincidente con el cierre del ejercicio presupuestario."
  - id: c
    correct: true
    text:
      es: "Mediante pago en cada uno de los vencimientos que se hubiesen estipulado."
  - id: d
    text:
      es: "Siempre de manera total, sin posibilidad de abonos a cuenta durante la ejecución."
  explanation:
    es: "El artículo 198.2 LCSP dice que el pago del precio podrá hacerse «de manera total o parcial, mediante abonos a cuenta o, en el caso de contratos de tracto sucesivo, mediante pago en cada uno de los vencimientos que se hubiesen estipulado». Pagar únicamente al finalizar el contrato contradice «parcial» y «abonos a cuenta». Pagar solo con un abono anual sustituye los vencimientos estipulados por una fecha fija que el apartado no impone. «Siempre de manera total, sin abonos a cuenta» contradice las dos fórmulas parciales de la misma frase."
  citation: "art. 198.2 LCSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q013
  prompt:
    es: "Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el plazo de treinta días para que la Administración abone el precio se cuenta desde:"
  options:
  - id: a
    correct: true
    text:
      es: "La fecha de aprobación de las certificaciones de obra o de los documentos de conformidad."
  - id: b
    text:
      es: "La fecha de entrega efectiva de los bienes o de prestación del servicio."
  - id: c
    text:
      es: "La fecha de adjudicación del contrato por el órgano de contratación."
  - id: d
    text:
      es: "La fecha de formalización del contrato entre las partes."
  explanation:
    es: "El artículo 198.4 obliga a abonar el precio «dentro de los treinta días siguientes a la fecha de aprobación de las certificaciones de obra o de los documentos» de conformidad. La entrega efectiva es el punto de partida de otro plazo de treinta días, el de aprobar la conformidad. La adjudicación y la formalización no marcan el pago."
  citation: "art. 198.4 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q014
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si la Administración se demora en el pago más allá de los treinta días, debe abonar al contratista:"
  options:
  - id: a
    text:
      es: "Solo los intereses de demora, sin indemnización alguna por los costes de cobro que haya ocasionado la demora."
  - id: b
    text:
      es: "Una penalidad del tres por ciento del precio pendiente de pago."
  - id: c
    text:
      es: "La revisión del precio del contrato y la devolución de la garantía definitiva."
  - id: d
    correct: true
    text:
      es: "Los intereses de demora y la indemnización por los costes de cobro, en los términos de la Ley 3/2004."
  explanation:
    es: "Si la Administración se demora, el artículo 198.4 le obliga a abonar, desde que se cumple el plazo de treinta días, «los intereses de demora y la indemnización por los costes de cobro» de la Ley 3/2004. Quedarse solo en los intereses omite la indemnización; la penalidad del tres por ciento y la revisión de precios con devolución de la garantía no figuran en el artículo."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q015
  prompt:
    es: "¿Dentro de qué plazo debe la Administración aprobar los documentos que acrediten la conformidad de los bienes entregados o servicios prestados, a contar desde la entrega efectiva?"
  options:
  - id: a
    text:
      es: "Los quince días siguientes a la entrega efectiva de los bienes o prestación del servicio."
  - id: b
    text:
      es: "Los sesenta días siguientes a la entrega efectiva de los bienes o prestación del servicio."
  - id: c
    correct: true
    text:
      es: "Los treinta días siguientes a la entrega efectiva de los bienes o prestación del servicio."
  - id: d
    text:
      es: "Los tres meses siguientes a la entrega efectiva de los bienes o prestación del servicio."
  explanation:
    es: "El artículo 198.4 fija en treinta días desde la entrega efectiva el plazo para aprobar la conformidad. Quince y sesenta días no figuran en el artículo. Los tres meses son el plazo del artículo 243.1 para la certificación final de las obras, que no se aplica a bienes entregados ni a servicios prestados."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q016
  prompt:
    es: "De acuerdo con el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, para que empiece el cómputo de intereses, el contratista debe presentar la factura en el registro administrativo en el plazo de:"
  options:
  - id: a
    text:
      es: "Quince días desde la entrega efectiva de las mercancías o la prestación del servicio."
  - id: b
    correct: true
    text:
      es: "Treinta días desde la entrega efectiva de las mercancías o la prestación del servicio."
  - id: c
    text:
      es: "Sesenta días desde la entrega efectiva de las mercancías o la prestación del servicio."
  - id: d
    text:
      es: "Treinta días desde la aprobación de la conformidad por la Administración."
  explanation:
    es: "El artículo 198.4 exige presentar la factura «en el plazo de treinta días desde la fecha de entrega efectiva de las mercancías o la prestación del servicio». Quince y sesenta días son otras cifras. Contar los treinta días desde la aprobación de la conformidad cambia el punto de partida: la factura no espera a la conformidad."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q017
  prompt:
    es: "Un contratista presenta la factura correctamente, pero fuera del plazo de treinta días desde la prestación. Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuándo empieza el devengo de intereses?"
  options:
  - id: a
    text:
      es: "Desde el día siguiente a la entrega efectiva del servicio, pese a la presentación tardía."
  - id: b
    text:
      es: "Desde la finalización de los treinta días de aprobar la conformidad, con independencia de la factura."
  - id: c
    correct: true
    text:
      es: "Cuando pasan treinta días desde la correcta presentación sin conformidad ni abono por la Administración."
  - id: d
    text:
      es: "Desde la fecha de presentación de la factura, sin plazo adicional alguno de espera."
  explanation:
    es: "Si la factura se presenta fuera de plazo, el artículo 198.4 retrasa el devengo: «no se iniciará hasta transcurridos treinta días desde la fecha de la correcta presentación», sin conformidad ni abono. Los intereses no corren desde la entrega ni desde que vence el plazo de conformidad con independencia de la factura, ni desde la presentación sin espera alguna."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q018
  prompt:
    es: "La conformidad de un suministro se aprueba el jueves 4 de febrero de 2027. Con el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público y su disposición adicional duodécima, y sábados y domingos inhábiles, ¿cuándo vence el plazo de pago?"
  options:
  - id: a
    text:
      es: "El sábado 6 de marzo de 2027, aunque el último día del plazo sea inhábil."
  - id: b
    correct: true
    text:
      es: "El lunes 8 de marzo de 2027, primer día hábil siguiente al sábado en que acaba el plazo."
  - id: c
    text:
      es: "El viernes 5 de marzo de 2027, último día hábil anterior al sábado en que acaba."
  - id: d
    text:
      es: "El jueves 4 de marzo de 2027, un mes natural después de aprobada la conformidad."
  explanation:
    es: "El plazo de treinta días naturales desde el 4 de febrero de 2027 termina el sábado 6 de marzo (el día siguiente al 4 de febrero es el 5 de febrero, el 28 de febrero es el día 24 y el 6 de marzo el día 30). Como es inhábil, la disposición adicional duodécima lo prorroga al primer día hábil siguiente: el lunes 8 de marzo. No se retrocede al viernes, no se mantiene el sábado y no se cuenta por meses."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q019
  prompt:
    es: "Unos servicios se entregan de forma efectiva el viernes 12 de febrero de 2027. Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, con sábados y domingos inhábiles, ¿cuál es el último día para presentar la factura en tiempo?"
  options:
  - id: a
    text:
      es: "El domingo 14 de marzo de 2027, último día natural del plazo de treinta días."
  - id: b
    text:
      es: "El viernes 12 de marzo de 2027, último día hábil anterior al domingo en que acaba."
  - id: c
    text:
      es: "El viernes 26 de marzo de 2027, treinta días hábiles después de la entrega."
  - id: d
    correct: true
    text:
      es: "El lunes 15 de marzo de 2027, primer día hábil siguiente al domingo en que acaba el plazo."
  explanation:
    es: "La factura debe presentarse en treinta días desde la entrega efectiva (artículo 198.4). Contados días naturales desde el viernes 12 de febrero de 2027, el plazo acaba el domingo 14 de marzo. Al ser inhábil, la disposición adicional duodécima lo prorroga al lunes 15 de marzo. El plazo no retrocede al viernes anterior, no se queda en el domingo y no se cuenta en días hábiles, porque la Ley solo computa hábiles cuando lo dice expresamente."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m05-l06-q021
  prompt:
    es: "¿Cuál de las siguientes actuaciones puede realizar el contratista de un contrato en ejecución cuando la Administración se demora cinco meses en pagar el precio?"
  options:
  - id: a
    text:
      es: "Resolver el contrato y ser resarcido de los perjuicios que se le originen como consecuencia de la demora."
  - id: b
    text:
      es: "Suspender el cumplimiento del contrato sin comunicación previa a la Administración."
  - id: c
    correct: true
    text:
      es: "Suspender el cumplimiento del contrato, comunicándolo a la Administración con un mes de antelación."
  - id: d
    text:
      es: "Suspender el cumplimiento del contrato comunicándolo con tres meses de antelación."
  explanation:
    es: "Con una demora superior a cuatro meses, el artículo 198.5 permite suspender el cumplimiento, comunicándolo «con un mes de antelación». Resolver el contrato exige una demora superior a seis meses (artículo 198.6), que aún no se alcanza. La suspensión sin aviso y el preaviso de tres meses no coinciden con el artículo."
  citation: "art. 198.5 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2017-12902-art-243
- id: m05-l06-q023
  prompt:
    es: "De acuerdo con el artículo 243.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, dentro del plazo de tres meses contados desde la recepción de las obras, el órgano de contratación debe:"
  options:
  - id: a
    text:
      es: "Aprobar la liquidación definitiva del contrato y devolver la garantía definitiva al contratista."
  - id: b
    text:
      es: "Abonar al contratista el precio total pendiente, con los intereses de demora devengados."
  - id: c
    text:
      es: "Designar al facultativo que representará a la Administración en el acto de recepción."
  - id: d
    correct: true
    text:
      es: "Aprobar la certificación final de las obras ejecutadas."
  explanation:
    es: "El artículo 243.1 da tres meses desde la recepción para «aprobar la certificación final de las obras ejecutadas», que se abona a cuenta de la liquidación. La liquidación definitiva y la devolución de la garantía llegan después, el abono íntegro con intereses no es la obligación de ese plazo y el facultativo asiste a la recepción, que es anterior."
  citation: "art. 243.1 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2017-12902-da-duodecima
- id: m05-l06-q025
  prompt:
    es: "Según la disposición adicional duodécima de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los plazos establecidos por días en esa Ley se entienden referidos a días:"
  options:
  - id: a
    text:
      es: "Hábiles, salvo que se indique expresamente que deben computarse los naturales."
  - id: b
    text:
      es: "Hábiles en todo caso, con exclusión de sábados, domingos y festivos de la sede del órgano."
  - id: c
    correct: true
    text:
      es: "Naturales, salvo que se indique expresamente que solo deben computarse los hábiles."
  - id: d
    text:
      es: "Naturales en todo caso, aunque la Ley indique expresamente que se computen los hábiles."
  explanation:
    es: "La disposición adicional duodécima establece la regla contraria a la de la Ley 39/2015: los plazos por días son naturales «salvo que en la misma se indique expresamente que solo deben computarse los días hábiles». Invertir la regla, hacerla hábil en todo caso o negar que la propia Ley pueda indicar días hábiles altera el texto."
  citation: "disposición adicional duodécima LCSP"
  difficulty: 1
  tags:
  - "cómputo"
  - "concepto"
