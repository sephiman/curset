# anchor: boe-a-2003-21614-art-142
- id: m01-l15-q142
  prompt:
    es: "Según el artículo 142.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control interno se realiza mediante:"
  options:
  - id: a
    text:
      es: "la función interventora, la fiscalización externa y la auditoría pública."
  - id: b
    text:
      es: "la función interventora, el control de eficacia y el control financiero permanente."
  - id: c
    text:
      es: "el control financiero permanente, la auditoría privada y la rendición de cuentas."
  - id: d
    correct: true
    text:
      es: "la función interventora, el control financiero permanente y la auditoría pública."
  explanation:
    es: "El artículo 142.2 enumera tres formas de control interno: función interventora, control financiero permanente y auditoría pública. Las otras opciones sustituyen alguna por la fiscalización externa, un control de eficacia, la auditoría privada o la rendición de cuentas, que no son formas de control interno."
  citation: "art. 142.2 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-142
- id: m01-l15-q143
  prompt:
    es: "Según el artículo 142.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál es una de las formas de ejercicio del control interno?"
  options:
  - id: a
    text:
      es: "El enjuiciamiento de la responsabilidad contable."
  - id: b
    correct: true
    text:
      es: "El control financiero permanente de las entidades."
  - id: c
    text:
      es: "La rendición de cuentas al Tribunal de Cuentas."
  - id: d
    text:
      es: "El control parlamentario del Presupuesto."
  explanation:
    es: "El control financiero permanente es una de las tres formas de control interno. El enjuiciamiento contable es función del Tribunal de Cuentas, el control parlamentario corresponde a las Cortes y la rendición de cuentas es una obligación de las entidades, no una forma de control."
  citation: "art. 142.2 LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-157
- id: m01-l15-q144
  prompt:
    es: "Conforme al artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cómo se realiza la verificación en que consiste el control financiero permanente?"
  options:
  - id: a
    text:
      es: "De forma previa a cada acto, mediante la intervención formal del gasto."
  - id: b
    text:
      es: "De forma anual, por el Tribunal de Cuentas en su informe."
  - id: c
    correct: true
    text:
      es: "De forma continua, a través de la correspondiente intervención delegada."
  - id: d
    text:
      es: "De forma posterior y sistemática, mediante procedimientos de revisión selectivos."
  explanation:
    es: "El control financiero permanente verifica de forma continua, a través de la intervención delegada. La verificación posterior y sistemática es la de la auditoría pública, y ni la intervención previa de cada acto ni el informe anual del Tribunal de Cuentas lo definen."
  citation: "art. 157 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-157
- id: m01-l15-q145
  prompt:
    es: "Según el artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control financiero permanente tiene por objeto verificar:"
  options:
  - id: a
    text:
      es: "la actividad de las entidades del sector público autonómico y local."
  - id: b
    correct: true
    text:
      es: "la situación y el funcionamiento económico-financiero de las entidades del sector público estatal."
  - id: c
    text:
      es: "la legalidad de cada acto de gasto antes de su aprobación o compromiso."
  - id: d
    text:
      es: "la regularidad contable de las cuentas ya rendidas al Tribunal de Cuentas."
  explanation:
    es: "El objeto del control financiero permanente es la situación y el funcionamiento económico-financiero de las entidades del sector público estatal. La legalidad previa de cada acto es función interventora, la revisión de cuentas rendidas es auditoría y el sector autonómico queda fuera."
  citation: "art. 157 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-157
- id: m01-l15-q146
  prompt:
    es: "Según el artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control financiero permanente se realiza a través de:"
  options:
  - id: a
    text:
      es: "los Servicios gestores del gasto."
  - id: b
    text:
      es: "la Oficina de Contabilidad del departamento."
  - id: c
    correct: true
    text:
      es: "la intervención delegada correspondiente a cada entidad."
  - id: d
    text:
      es: "el Pleno del Tribunal de Cuentas."
  explanation:
    es: "El control financiero permanente se ejerce a través de la intervención delegada correspondiente. Los Servicios gestores y las Oficinas de Contabilidad son objeto de control o de registro, y el Pleno del Tribunal de Cuentas ejerce el control externo."
  citation: "art. 157 LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-162
- id: m01-l15-q147
  prompt:
    es: "Según el artículo 162 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la auditoría pública consiste en la verificación de la actividad económico-financiera del sector público estatal realizada:"
  options:
  - id: a
    text:
      es: "de forma ocasional, a petición del Tribunal de Cuentas."
  - id: b
    text:
      es: "con carácter previo a la aprobación de cada gasto."
  - id: c
    correct: true
    text:
      es: "con posterioridad y de forma sistemática."
  - id: d
    text:
      es: "de forma continua, a través de la intervención delegada."
  explanation:
    es: "La auditoría pública se efectúa con posterioridad y de forma sistemática. La verificación continua es la del control financiero permanente, la previa al gasto corresponde a la función interventora, y el artículo no la condiciona a petición del Tribunal de Cuentas."
  citation: "art. 162 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-164
- id: m01-l15-q148
  prompt:
    es: "Según el artículo 164.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la auditoría pública adopta las modalidades de auditoría de:"
  options:
  - id: a
    text:
      es: "regularidad contable, operativa y de resultados."
  - id: b
    correct: true
    text:
      es: "regularidad contable, de cumplimiento y operativa."
  - id: c
    text:
      es: "regularidad contable, de gestión y financiera."
  - id: d
    text:
      es: "cumplimiento, operativa y de legalidad previa."
  explanation:
    es: "El artículo 164.1 LGP enumera tres modalidades de auditoría pública: la de regularidad contable, en la letra a), la de cumplimiento, en la letra b), y la operativa, en la letra c). La combinación con «de resultados» sustituye la de cumplimiento por una modalidad que el apartado no nombra. La que añade «de gestión y financiera» tampoco corresponde a las letras a) a c). La que incluye «de legalidad previa» es una forma de control distinta de las tres modalidades del apartado."
  citation: "art. 164.1 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-164
- id: m01-l15-q149
  prompt:
    es: "¿Cuál de las siguientes es una modalidad de la auditoría pública según el artículo 164.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "La auditoría de legalidad previa del gasto."
  - id: b
    correct: true
    text:
      es: "La auditoría de cumplimiento de la normativa."
  - id: c
    text:
      es: "La auditoría de eficacia presupuestaria."
  - id: d
    text:
      es: "La auditoría fiscal de carácter tributario."
  explanation:
    es: "La auditoría de cumplimiento es una de las tres modalidades del artículo 164.1. La auditoría de legalidad previa, la de eficacia presupuestaria y la fiscal tributaria no están previstas en el precepto."
  citation: "art. 164.1 LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-137
- id: m01-l15-q150
  prompt:
    es: "Según el artículo 137 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las entidades integrantes del sector público estatal rinden al Tribunal de Cuentas la información contable:"
  options:
  - id: a
    correct: true
    text:
      es: "por conducto de la Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "por conducto de la Dirección General de Presupuestos del Ministerio."
  - id: c
    text:
      es: "directamente, sin intermediación de ningún otro órgano de la Administración."
  - id: d
    text:
      es: "por conducto del Consejo de Ministros, que las remite a las Cortes."
  explanation:
    es: "La información contable llega al Tribunal de Cuentas por conducto de la IGAE. No se rinde directamente ni a través de la Dirección General de Presupuestos o del Consejo de Ministros."
  citation: "art. 137 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-148
- id: m01-l15-q151
  prompt:
    es: "¿En qué momento controla la función interventora los actos del sector público estatal que dan lugar a la realización de gastos?"
  options:
  - id: a
    correct: true
    text:
      es: "Antes de que esos actos sean aprobados."
  - id: b
    text:
      es: "Una vez aprobados, pero antes de su pago material."
  - id: c
    text:
      es: "Después de realizado el pago, al rendir las cuentas."
  - id: d
    text:
      es: "Solo cuando el órgano gestor lo pida a la Intervención."
  explanation:
    es: "El artículo 148 sitúa la función interventora antes de la aprobación del acto: es un control previo. La opción que la coloca tras la aprobación pero antes del pago y la que la coloca después del pago convierten un control previo en uno posterior, que es propio de la auditoría pública. La opción que la deja a petición del órgano gestor inventa un requisito: la función interventora es preceptiva y no depende de que nadie la pida."
  citation: "art. 148 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-148
- id: m01-l15-q152
  prompt:
    es: "Según el artículo 148 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con qué fin controla la función interventora los actos que dan lugar a gastos y a los pagos que de ellos se derivan?"
  options:
  - id: a
    correct: true
    text:
      es: "Para asegurar que su gestión se ajuste a las disposiciones aplicables en cada caso."
  - id: b
    text:
      es: "Para enjuiciar la responsabilidad contable de quienes manejen caudales públicos."
  - id: c
    text:
      es: "Para proponer la modificación de los créditos que resulten insuficientes."
  - id: d
    text:
      es: "Para formar la Cuenta General del Estado de cada ejercicio."
  explanation:
    es: "El artículo 148 dice que el control se hace «con el fin de asegurar que su gestión se ajuste a las disposiciones aplicables en cada caso». Enjuiciar la responsabilidad contable es función propia del Tribunal de Cuentas. Proponer modificaciones de crédito no es un fin de este control. Formar la Cuenta General corresponde a la Intervención General de la Administración del Estado como tarea contable, no como fin de la función interventora."
  citation: "art. 148 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-131
- id: m01-l15-q157
  prompt:
    es: "Según el artículo 131.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Cuenta General del Estado se eleva al Gobierno para su remisión al Tribunal de Cuentas antes del día:"
  options:
  - id: a
    text:
      es: "31 de agosto del año siguiente al ejercicio al que se refiera."
  - id: b
    text:
      es: "30 de junio del año siguiente al ejercicio al que se refiera."
  - id: c
    correct: true
    text:
      es: "31 de octubre del año siguiente al que se refiera."
  - id: d
    text:
      es: "31 de diciembre del año al que se refiera."
  explanation:
    es: "El artículo 131.1 de la Ley General Presupuestaria fija el 31 de octubre del año siguiente. El 31 de agosto es la fecha en que, según la Ley 7/1988, se ultima la Cuenta General, que es otra norma y otro trámite. El 30 de junio y el 31 de diciembre del propio año no figuran en el artículo."
  citation: "art. 131.1 LGP"
  difficulty: 2
  tags:
  - "fecha"
  - "plazo"
# anchor: boe-a-2003-21614-art-131
- id: m01-l15-q159
  prompt:
    es: "¿Qué órgano forma la Cuenta General del Estado de cada año, antes de elevarla al Gobierno para su remisión al Tribunal de Cuentas?"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "El artículo 131.1 atribuye la formación de la Cuenta General del Estado a la Intervención General de la Administración del Estado. El Tribunal de Cuentas no la forma, sino que la examina y comprueba una vez rendida. Tampoco la forman la Dirección General de Presupuestos ni el Consejo de Ministros."
  citation: "art. 131.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-131
- id: m01-l15-q160
  prompt:
    es: "Según el artículo 131.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado eleva la Cuenta General del Estado, para su remisión al Tribunal de Cuentas:"
  options:
  - id: a
    text:
      es: "Al Ministro de Hacienda."
  - id: b
    text:
      es: "A las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Al Gobierno."
  - id: d
    text:
      es: "Al Consejo de Estado."
  explanation:
    es: "El artículo 131.1 manda elevar la Cuenta General al Gobierno para que la remita al Tribunal de Cuentas. No se eleva al Ministro de Hacienda ni al Consejo de Estado. Las Cortes Generales tampoco la reciben en ese paso: el Tribunal la examina por delegación suya después."
  citation: "art. 131.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q165
  prompt:
    es: "¿Puede el SEPE minorar con una transferencia de crédito, en octubre de 2027, el crédito de la aplicación de las ayudas que suplementó en abril?"
  options:
  - id: a
    text:
      es: "Sí, con la autorización de su Director General, por tratarse de créditos del mismo programa."
  - id: b
    correct: true
    text:
      es: "No, porque las transferencias no pueden minorar créditos que se hayan suplementado en el ejercicio."
  - id: c
    text:
      es: "Sí, previo informe favorable de la Intervención Delegada, que sustituye a cualquier otra restricción."
  - id: d
    text:
      es: "No, porque las transferencias solo pueden hacerse entre créditos de un mismo artículo del presupuesto."
  explanation:
    es: "Las transferencias pueden hacerse entre los diferentes créditos del presupuesto, pero no minoran créditos extraordinarios ni créditos que se hayan suplementado o ampliado en el ejercicio, y el de las ayudas se suplementó en abril de 2027. La opción de la autorización del Director General por ser del mismo programa se refiere a quién autoriza, y no salva la restricción. La del informe favorable de la Intervención Delegada tampoco, porque ese informe no sustituye las restricciones del artículo 52.1. La del mismo artículo del presupuesto inventa una limitación que la ley no contiene."
  citation: "art. 52.1 LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q168
  prompt:
    es: "¿Puede la Jefatura dotar otro programa del mismo servicio con 50.000 euros del crédito del capítulo 2 suplementado en febrero, mediante una transferencia de crédito?"
  options:
  - id: a
    text:
      es: "Sí, si el titular del Ministerio del Interior la autoriza previo informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "Sí, porque la restricción de las transferencias solo afecta a los créditos de distintas secciones presupuestarias."
  - id: c
    text:
      es: "Sí, si la persona titular de la Dirección del organismo la autoriza dentro de su presupuesto, sin otros requisitos."
  - id: d
    correct: true
    text:
      es: "No, porque las transferencias de crédito no pueden minorar créditos suplementados en el ejercicio."
  explanation:
    es: "Las transferencias de crédito no pueden minorar créditos extraordinarios ni créditos que se hayan suplementado o ampliado en el ejercicio (art. 52.1.c) LGP). El capítulo 2 de la Jefatura recibió un suplemento de 200.000 euros en febrero, así que no puede dotar con él a otro programa. Que el titular del Ministerio, con informe de la Intervención Delegada, o la Dirección del organismo en su presupuesto autoricen ciertas transferencias, regula quién las autoriza y no levanta la restricción. La restricción tampoco se limita a las secciones distintas, que es otra regla de la misma lista."
  citation: "art. 52.1 LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2003-21614-art-148
- id: m01-l15-q171
  prompt:
    es: "Conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué momento ejerce la Intervención Delegada la función interventora sobre el gasto del contrato de digitalización del fondo, que no es un contrato menor?"
  options:
  - id: a
    correct: true
    text:
      es: "Antes de que se apruebe el gasto, para asegurar que su gestión se ajusta a las disposiciones aplicables."
  - id: b
    text:
      es: "Después de recibida la prestación, mediante la auditoría pública de regularidad contable, de cumplimiento u operativa."
  - id: c
    text:
      es: "Durante la ejecución del contrato, de forma continua, mediante el control financiero permanente."
  - id: d
    text:
      es: "Al rendirse las cuentas, cuando la Intervención General las remite al Tribunal de Cuentas."
  explanation:
    es: "La función interventora controla los actos que den lugar a la realización de gastos antes de que sean aprobados, con el fin de asegurar que su gestión se ajuste a las disposiciones aplicables (art. 148 LGP). El contrato de digitalización se licita por procedimiento abierto y no es un contrato menor, así que el expediente pasa por esa fiscalización previa. La auditoría pública es una verificación posterior y sistemática, no previa. El control financiero permanente es continuo y no precede a la aprobación. La rendición de cuentas al Tribunal de Cuentas pertenece al control externo y llega después de la ejecución."
  citation: "art. 148 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q191
  prompt:
    es: "¿Cuál de las siguientes parejas de escenarios integra los escenarios presupuestarios plurianuales según el artículo 28.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Un escenario de ingresos y un escenario de gastos."
  - id: b
    text:
      es: "Un escenario orgánico y un escenario económico."
  - id: c
    text:
      es: "Un escenario de programas y un escenario de créditos."
  - id: d
    text:
      es: "Un escenario de ingresos y un escenario de operaciones financieras."
  explanation:
    es: "El artículo 28.4 integra los escenarios plurianuales con un escenario de ingresos y un escenario de gastos. Orgánico y económico son clasificaciones de los estados de gastos, no escenarios. Programas y créditos son piezas de la estructura del presupuesto, y las operaciones financieras son una agrupación de la clasificación económica; ninguna forma parte de la pareja del artículo."
  citation: "art. 28.4 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q192
  prompt:
    es: "¿Cuál de las siguientes materias se define en los escenarios presupuestarios plurianuales, según el artículo 28.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La previsible evolución de los ingresos."
  - id: b
    text:
      es: "La relación de puestos de trabajo de cada ministerio."
  - id: c
    text:
      es: "El calendario de pagos materiales del ejercicio."
  - id: d
    text:
      es: "La distribución de los beneficios fiscales entre administraciones."
  explanation:
    es: "El artículo 28.1 dice que los escenarios definen los equilibrios presupuestarios básicos, la previsible evolución de los ingresos y los recursos a asignar a las políticas de gasto. La relación de puestos de trabajo no es contenido de la programación plurianual, el calendario de pagos materiales pertenece a la fase de ejecución, y la distribución de beneficios fiscales entre administraciones no aparece entre lo que definen los escenarios."
  citation: "art. 28.1 LGP"
  difficulty: 3
  tags:
  - "concepto"
