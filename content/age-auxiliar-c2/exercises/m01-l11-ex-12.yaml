# anchor: boe-a-2015-10565-art-76
- id: m01-l11-q172
  prompt:
    es: "Señale la respuesta correcta sobre las alegaciones de los interesados en la instrucción del procedimiento, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Solo pueden aducirse después del trámite de audiencia y antes de la resolución."
  - id: b
    correct: true
    text:
      es: "Pueden aducirse en cualquier momento del procedimiento anterior al trámite de audiencia."
  - id: c
    text:
      es: "Solo pueden aducirse dentro de los diez días siguientes al acuerdo de iniciación."
  - id: d
    text:
      es: "Solo pueden aducirse durante el período de prueba que acuerde el instructor."
  explanation:
    es: "El artículo 76.1 dice que los interesados podrán, «en cualquier momento del procedimiento anterior al trámite de audiencia», aducir alegaciones y aportar documentos. No hay un plazo de diez días desde la iniciación ni se limita al período de prueba. Después de la audiencia no se abre un nuevo momento general de alegaciones."
  citation: "art. 76.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-77
- id: m01-l11-q173
  prompt:
    es: "El instructor abre un período de prueba por el plazo máximo legal mediante acuerdo notificado el lunes 11 de enero de 2027. Sin festivos en el periodo, ¿cuál es el último día del período de prueba?"
  options:
  - id: a
    text:
      es: "El lunes 25 de enero de 2027."
  - id: b
    text:
      es: "El miércoles 10 de febrero de 2027."
  - id: c
    text:
      es: "El jueves 11 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 22 de febrero de 2027."
  explanation:
    es: "El máximo del período de prueba es de treinta días (art. 77.2), hábiles (art. 30.2), desde el martes 12 de enero (art. 30.3). Excluidos sábados y domingos, el trigésimo día hábil es el lunes 22 de febrero de 2027. El lunes 25 de enero es el décimo día hábil, el mínimo legal. El miércoles 10 de febrero sale de contar treinta días naturales. El jueves 11 de febrero trata el plazo como de un mes."
  citation: "art. 77.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-80
- id: m01-l11-q174
  prompt:
    es: "De acuerdo con el artículo 80.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, salvo disposición expresa en contrario, los informes que se emitan en el procedimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán facultativos y no vinculantes."
  - id: b
    text:
      es: "Serán preceptivos y no vinculantes."
  - id: c
    text:
      es: "Serán facultativos y vinculantes."
  - id: d
    text:
      es: "Serán preceptivos y vinculantes."
  explanation:
    es: "El artículo 80.1 dice que, «salvo disposición expresa en contrario, los informes serán facultativos y no vinculantes». Para que un informe sea preceptivo, o vinculante, hace falta una norma que lo diga."
  citation: "art. 80.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-82
- id: m01-l11-q175
  prompt:
    es: "Se notifica a un interesado el lunes 18 de enero de 2027 la apertura del trámite de audiencia con el plazo máximo que permite la ley. Sin festivos en el periodo, ¿cuál es el último día para alegar?"
  options:
  - id: a
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: b
    text:
      es: "El martes 2 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes 8 de febrero de 2027."
  - id: d
    text:
      es: "El lunes 15 de febrero de 2027."
  explanation:
    es: "El plazo de audiencia es no inferior a diez días ni superior a quince (art. 82.2); el máximo son quince días hábiles (art. 30.2), desde el martes 19 de enero (art. 30.3). Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 8 de febrero de 2027. El lunes 1 de febrero es el décimo día hábil, el mínimo. El martes 2 de febrero sale de contar quince días naturales. El lunes 15 de febrero cuenta veinte días hábiles."
  citation: "art. 82.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m01-l11-q176
  prompt:
    es: "Se notifica a una interesada el martes 18 de noviembre de 2025 la apertura del trámite de audiencia con el plazo mínimo que permite la ley. Sin festivos en el periodo, el último día para alegar es:"
  options:
  - id: a
    text:
      es: "El martes 25 de noviembre de 2025."
  - id: b
    text:
      es: "El viernes 28 de noviembre de 2025."
  - id: c
    text:
      es: "El lunes 1 de diciembre de 2025."
  - id: d
    correct: true
    text:
      es: "El martes 2 de diciembre de 2025."
  explanation:
    es: "El plazo de audiencia es no inferior a diez días (art. 82.2 de la Ley 39/2015); el mínimo son diez días hábiles (art. 30.2), desde el miércoles 19 de noviembre (art. 30.3). Excluidos sábados y domingos, el décimo día hábil es el martes 2 de diciembre de 2025. El martes 25 de noviembre son cinco días hábiles, la mitad. El viernes 28 sale de contar diez días naturales. El lunes 1 de diciembre cuenta el día de la notificación como primero."
  citation: "art. 82.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m01-l11-q177
  prompt:
    es: "¿En cuál de los siguientes casos se podrá prescindir del trámite de audiencia, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando no figuren ni se tengan en cuenta otros hechos, alegaciones y pruebas que los del interesado."
  - id: b
    text:
      es: "Cuando el interesado no haya presentado alegaciones ni documentos en ningún momento anterior del procedimiento."
  - id: c
    text:
      es: "Cuando se haya abierto en el mismo procedimiento un período de información pública de veinte días."
  - id: d
    text:
      es: "Cuando el plazo máximo para resolver esté próximo a vencer y el órgano competente así lo motive."
  explanation:
    es: "El artículo 82.4 permite prescindir de la audiencia «cuando no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado». No basta que el interesado no haya alegado antes. La información pública es otro trámite y no sustituye a la audiencia. La proximidad del vencimiento no es causa."
  citation: "art. 82.4 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-83
- id: m01-l11-q178
  prompt:
    es: "De acuerdo con el artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el anuncio de un período de información pública determinará el plazo para formular alegaciones, que:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá ser inferior a veinte días."
  - id: b
    text:
      es: "En ningún caso podrá ser inferior a diez días."
  - id: c
    text:
      es: "En ningún caso podrá ser superior a veinte días."
  - id: d
    text:
      es: "En ningún caso podrá ser inferior a un mes."
  explanation:
    es: "El artículo 83.2 dice que el plazo de alegaciones de la información pública «en ningún caso podrá ser inferior a veinte días». Veinte días es un mínimo, no un máximo. No es de diez días, y nada exige un mes."
  citation: "art. 83.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-83
- id: m01-l11-q179
  prompt:
    es: "El anuncio de información pública de un procedimiento se publica en el «Boletín Oficial del Estado» el lunes 19 de enero de 2026 y fija el plazo mínimo de alegaciones. Sin festivos en el periodo, ¿cuál es su último día?"
  options:
  - id: a
    text:
      es: "El lunes 2 de febrero de 2026."
  - id: b
    text:
      es: "El lunes 9 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 16 de febrero de 2026."
  - id: d
    text:
      es: "El jueves 19 de febrero de 2026."
  explanation:
    es: "El plazo de alegaciones de la información pública no puede ser inferior a veinte días (art. 83.2). Son hábiles (art. 30.2) y se cuentan desde el día siguiente a la publicación (art. 30.3), el martes 20 de enero. Excluidos sábados y domingos, el vigésimo día hábil es el lunes 16 de febrero de 2026. El lunes 2 de febrero cuenta diez días hábiles. El lunes 9 sale de contar veinte días naturales, hasta el domingo 8, y prorrogar. El jueves 19 cuenta veintitrés días hábiles."
  citation: "art. 83.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-83
- id: m01-l11-q180
  prompt:
    es: "Un anuncio de información pública se publica el lunes 4 de enero de 2027 con el plazo mínimo de alegaciones. El miércoles 6 de enero es festivo nacional y no hay otros. ¿Cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El lunes 25 de enero de 2027."
  - id: b
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El martes 2 de febrero de 2027."
  - id: d
    text:
      es: "El miércoles 3 de febrero de 2027."
  explanation:
    es: "El mínimo es de veinte días (art. 83.2), hábiles: se excluyen sábados, domingos y festivos (art. 30.2). El cómputo empieza el martes 5 de enero (art. 30.3). El miércoles 6 es festivo y no cuenta. El vigésimo día hábil es el martes 2 de febrero de 2027. El lunes 1 de febrero olvida excluir el festivo del 6 de enero. El lunes 25 de enero sale de contar veinte días naturales, hasta el domingo 24, y prorrogar. El miércoles 3 de febrero añade un día de más."
  citation: "art. 83.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-84
- id: m01-l11-q181
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los modos de poner fin al procedimiento del artículo 84.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la prescripción."
  - id: b
    correct: true
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la declaración de caducidad."
  - id: c
    text:
      es: "La resolución, el desistimiento y la declaración de caducidad, sin que quepa en ningún caso la renuncia al derecho."
  - id: d
    text:
      es: "La resolución, la suspensión del procedimiento, la renuncia al derecho no prohibida y la declaración de caducidad."
  explanation:
    es: "El artículo 84.1 dice: «Pondrán fin al procedimiento la resolución, el desistimiento, la renuncia al derecho en que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico, y la declaración de caducidad». La prescripción no está en la lista. La renuncia sí, cuando no esté prohibida. La suspensión no pone fin al procedimiento."
  citation: "art. 84.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m01-l11-q182
  prompt:
    es: "De acuerdo con el artículo 85.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento sancionador, si el infractor reconoce su responsabilidad:"
  options:
  - id: a
    text:
      es: "Deberá archivarse el procedimiento sin imponer sanción alguna."
  - id: b
    text:
      es: "Deberá abrirse en todo caso un período de prueba sobre los hechos."
  - id: c
    text:
      es: "Se suspenderá el procedimiento hasta que el infractor abone la sanción."
  - id: d
    correct: true
    text:
      es: "Podrá resolverse el procedimiento imponiendo la sanción que proceda."
  explanation:
    es: "El artículo 85.1 dice que, si el infractor reconoce su responsabilidad, «se podrá resolver el procedimiento con la imposición de la sanción que proceda». El reconocimiento no lleva al archivo sin sanción, no obliga a abrir prueba y no suspende el procedimiento."
  citation: "art. 85.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m01-l11-q183
  prompt:
    es: "Según el artículo 85.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo implica la terminación del procedimiento sancionador el pago voluntario por el presunto responsable?"
  options:
  - id: a
    correct: true
    text:
      es: "Si la sanción es solo pecuniaria, o se justificó la improcedencia de la otra, y se paga antes de resolver."
  - id: b
    text:
      es: "Si la sanción es pecuniaria o no pecuniaria, siempre que se pague antes de la propuesta de resolución."
  - id: c
    text:
      es: "Si la sanción es solo pecuniaria y se paga dentro de los diez días siguientes a la notificación de la iniciación."
  - id: d
    text:
      es: "Si la sanción es solo pecuniaria y se paga una vez notificada la resolución sancionadora, en periodo voluntario."
  explanation:
    es: "El artículo 85.2 exige que la sanción tenga «únicamente carácter pecuniario» o que, pudiendo imponerse otra no pecuniaria, «se ha justificado la improcedencia de la segunda», y que el pago se haga «en cualquier momento anterior a la resolución». No vale para cualquier sanción no pecuniaria. El límite es la resolución, no la propuesta ni diez días desde la iniciación. Pagar después de la resolución no termina un procedimiento que ya terminó."
  citation: "art. 85.2 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m01-l11-q184
  prompt:
    es: "De acuerdo con el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la sanción es solo pecuniaria y el infractor reconoce su responsabilidad o paga voluntariamente, se aplicarán reducciones:"
  options:
  - id: a
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, no acumulables entre sí."
  - id: b
    correct: true
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: c
    text:
      es: "De, al menos, el 30 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: d
    text:
      es: "De, como máximo, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  explanation:
    es: "El artículo 85.3 dice que se aplicarán «reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí». El 20 % es un mínimo, no un máximo, y el porcentaje legal no es el 30 %. Las dos reducciones, por reconocimiento y por pago, sí se acumulan."
  citation: "art. 85.3 LPAC"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-85
- id: m01-l11-q185
  prompt:
    es: "Según el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿a qué está condicionada la efectividad de las reducciones sobre el importe de la sanción propuesta?"
  options:
  - id: a
    text:
      es: "Al desistimiento o renuncia de cualquier recurso contencioso-administrativo contra la sanción."
  - id: b
    text:
      es: "A que el infractor no haya sido sancionado en el año anterior por una infracción de la misma naturaleza."
  - id: c
    text:
      es: "A que el pago se realice dentro de los diez días siguientes a la notificación de la resolución."
  - id: d
    correct: true
    text:
      es: "Al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción."
  explanation:
    es: "El artículo 85.3 dice que la efectividad de las reducciones «estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción». La renuncia se refiere a la vía administrativa, no a la contencioso-administrativa. La ley no exige falta de sanciones previas ni un pago en diez días tras la resolución."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m01-l11-q186
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las reducciones de la sanción pecuniaria por reconocimiento o pago voluntario es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Deben figurar en la propuesta de resolución, y su porcentaje podrá incrementarse reglamentariamente."
  - id: b
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje solo podrá incrementarse por ley."
  - id: c
    text:
      es: "Las acuerda el instructor a petición del interesado, y su porcentaje es fijo e invariable."
  - id: d
    correct: true
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje podrá incrementarse reglamentariamente."
  explanation:
    es: "El artículo 85.3 dice que las reducciones «deberán estar determinadas en la notificación de iniciación del procedimiento» y que el porcentaje «podrá ser incrementado reglamentariamente». No se fijan en la propuesta de resolución. Un reglamento basta para subir el porcentaje. Las aplica el órgano competente para resolver, no el instructor, y el porcentaje no es invariable."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-87
- id: m01-l11-q187
  prompt:
    es: "Terminadas las actuaciones complementarias de un procedimiento, su finalización se notifica a los interesados el martes 3 de marzo de 2026. Sin festivos en el periodo, ¿cuál es el último día para formular alegaciones?"
  options:
  - id: a
    text:
      es: "El martes 10 de marzo de 2026."
  - id: b
    correct: true
    text:
      es: "El jueves 12 de marzo de 2026."
  - id: c
    text:
      es: "El martes 17 de marzo de 2026."
  - id: d
    text:
      es: "El martes 24 de marzo de 2026."
  explanation:
    es: "El plazo de alegaciones tras las actuaciones complementarias es de siete días (art. 87), hábiles (art. 30.2), desde el miércoles 4 de marzo (art. 30.3). Excluidos sábados y domingos, el séptimo día hábil es el jueves 12 de marzo de 2026. El martes 10 de marzo sale de contar siete días naturales. El martes 17 cuenta diez días hábiles. El martes 24 cuenta quince, el plazo máximo para practicar las actuaciones."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-94
- id: m01-l11-q189
  prompt:
    es: "Según el artículo 94.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la solicitud la formularon varios interesados y uno desiste, ¿a quién afecta el desistimiento?"
  options:
  - id: a
    text:
      es: "A todos los que formularon el escrito."
  - id: b
    correct: true
    text:
      es: "Solo a aquel que lo haya formulado."
  - id: c
    text:
      es: "A todos, salvo que los demás ratifiquen la solicitud."
  - id: d
    text:
      es: "Solo a quien lo formuló, si los demás lo aceptan."
  explanation:
    es: "El artículo 94.2 dice que, si el escrito se formuló por dos o más interesados, «el desistimiento o la renuncia sólo afectará a aquellos que la hubiesen formulado». No alcanza a los demás, que no tienen que ratificar nada ni aceptar el desistimiento."
  citation: "art. 94.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-94
- id: m01-l11-q190
  prompt:
    es: "De acuerdo con el artículo 94.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración aceptará de plano el desistimiento o la renuncia y declarará concluso el procedimiento, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "Terceros interesados personados insten su continuación en diez días desde que se les notificó."
  - id: b
    text:
      es: "Terceros interesados personados insten su continuación en quince días desde que se les notificó."
  - id: c
    text:
      es: "El órgano instructor proponga su continuación en diez días desde que recibió el escrito."
  - id: d
    text:
      es: "Cualquier persona, aunque no esté personada, inste su continuación en diez días."
  explanation:
    es: "El artículo 94.4 exceptúa el caso de que, «habiéndose personado en el mismo terceros interesados, instasen éstos su continuación en el plazo de diez días desde que fueron notificados». El plazo no es de quince días. Pueden instarla los terceros personados, no cualquier persona ni el instructor."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-94
- id: m01-l11-q191
  prompt:
    es: "El viernes 5 de febrero de 2027 se notifica a los terceros interesados personados en un procedimiento el desistimiento del solicitante. Sin festivos en el periodo, el último día para instar la continuación es:"
  options:
  - id: a
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: b
    text:
      es: "El jueves 18 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes 19 de febrero de 2027."
  - id: d
    text:
      es: "El viernes 26 de febrero de 2027."
  explanation:
    es: "Los terceros personados pueden instar la continuación en diez días desde que se les notificó el desistimiento (art. 94.4 de la Ley 39/2015). Son hábiles (art. 30.2): el sábado 6 y el domingo 7 no cuentan, y el primer día es el lunes 8 de febrero. El décimo día hábil es el viernes 19 de febrero de 2027. El lunes 15 sale de contar diez días naturales. El jueves 18 cuenta el viernes de la notificación como primer día. El viernes 26 cuenta quince días hábiles."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
