- id: m02-l05-q01
  prompt:
    en: A recursive method adds the current choice list as a subset on entry, then extends it with each later element
      of 1, 2, 3 and undoes the choice. Another method builds all permutations in the same way. What is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'subsets [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]]

        permutations 6 first [1, 2, 3] last [3, 2, 1]'
  - id: b
    text:
      en: 'subsets [[], [1], [2], [3], [1, 2], [1, 3], [2, 3], [1, 2, 3]]

        permutations 6 first [1, 2, 3] last [3, 2, 1]'
  - id: c
    text:
      en: 'subsets [[1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]]

        permutations 6 first [1, 2, 3] last [3, 2, 1]'
  - id: d
    text:
      en: 'subsets [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]]

        permutations 8 first [1, 2, 3] last [3, 2, 1]'
  explanation:
    en: Each call records the list on entry and then extends it, so the output is `subsets [[], [1], [1, 2], [1,
      2, 3], [1, 3], [2], [2, 3], [3]]` with 6 permutations. The order `[[], [1], [2], [3], [1, 2]` lists subsets
      by size, but the recursion goes deep before it moves to the next element. The list without `[]` leaves out
      the empty subset, but the method records the list before it adds anything. The count `permutations 8` is the
      number of subsets of three elements, but three elements have 3 x 2 x 1 = 6 orderings.
  citation: erickson-backtracking#p9; erickson-backtracking#p3
  extract:
    en: Backtracking algorithms are commonly used to make a sequence of decisions, with the goal of building a recursively
      defined structure satisfying certain constraints.
  snippet: m02-l05/SubsetsAndPermutations.java
- id: m02-l05-q02
  prompt:
    en: A recursive search over the items 1 to 5 includes or skips each item and records every subset that sums
      to 5. It runs with and without a test that stops when the remaining target is negative. What is printed?
  options:
  - id: a
    text:
      en: 'subsets that sum to 5 [[1, 4], [2, 3], [5]]

        calls with pruning 55

        calls without pruning 41'
  - id: b
    correct: true
    text:
      en: 'subsets that sum to 5 [[1, 4], [2, 3], [5]]

        calls with pruning 41

        calls without pruning 55'
  - id: c
    text:
      en: 'subsets that sum to 5 [[1, 4], [2, 3]]

        calls with pruning 41

        calls without pruning 55'
  - id: d
    text:
      en: 'subsets that sum to 5 [[1, 4], [2, 3], [5]]

        calls with pruning 41

        calls without pruning 41'
  explanation:
    en: The three subsets are `[1, 4]`, `[2, 3]` and `[5]`, and the test that stops negative targets cuts the calls
      from 55 to 41. The pair `calls with pruning 55` and `calls without pruning 41` swaps the two runs, but cutting
      branches cannot add calls. The list without `[5]` drops a solution, but the single item 5 already reaches
      the target. The line `calls without pruning 41` assumes the test changes nothing, but the unpruned search
      also explores the branches with a negative target.
  citation: erickson-backtracking#p7; erickson-backtracking#p3
