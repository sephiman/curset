# anchor: fuente-ms-excel-proteger-hoja-html
- id: m06-l05-q040
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones sobre los gráficos y segmentaciones de datos de una hoja de cálculo es correcta?"
  options:
  - id: a
    text:
      es: "Quedan desbloqueados al agregarlos y hay que bloquearlos antes de proteger la hoja."
  - id: b
    text:
      es: "Ya están bloqueados al agregarlos y el bloqueo actúa aunque la hoja no esté protegida."
  - id: c
    correct: true
    text:
      es: "Ya están bloqueados al agregarlos, pero el bloqueo solo actúa con la hoja protegida."
  - id: d
    text:
      es: "No admiten bloqueo, porque la protección de la hoja solo afecta a celdas."
  explanation:
    es: "La nota de la página dice que los gráficos, las segmentaciones de datos y otros objetos «ya están bloqueados cuando se agregan a una hoja de cálculo. Pero el bloqueo solo funcionará cuando se habilite la protección de la hoja». No quedan desbloqueados, el bloqueo no actúa sin proteger la hoja y sí admiten bloqueo."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Elegir qué elementos de celda se deben bloquear»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m06-l05-q041
  prompt:
    es: "En Excel 365, proteger la estructura con Revisar › Proteger libro impide a los demás usuarios:"
  options:
  - id: a
    text:
      es: "Modificar las celdas bloqueadas de la hoja de cálculo que está activa en ese momento."
  - id: b
    correct: true
    text:
      es: "Agregar, mover, eliminar, ocultar o cambiar el nombre de las hojas de cálculo."
  - id: c
    text:
      es: "Abrir el archivo de Excel si no conocen la contraseña que protege el libro."
  - id: d
    text:
      es: "Ver las fórmulas de las celdas en la barra de fórmulas de cada hoja."
  explanation:
    es: "La página dice que proteger la estructura del libro impide ver hojas ocultas, «agregar, mover, eliminar u ocultar hojas de cálculo o cambiarles el nombre». Impedir modificar celdas bloqueadas es Proteger hoja, impedir abrir el archivo es Proteger un archivo de Excel y ocultar fórmulas se hace con la protección de la hoja."
  citation: "fuente: `ms-excel-proteger-libro.html`; «Proteger un libro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m06-l05-q042
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones sobre la contraseña al proteger la estructura de un libro es correcta?"
  options:
  - id: a
    text:
      es: "Es obligatoria; sin ella, Excel no activa la protección de la estructura."
  - id: b
    correct: true
    text:
      es: "Es opcional; sin ella, cualquier usuario puede desproteger el libro."
  - id: c
    text:
      es: "Es opcional; sin ella, solo el autor del libro puede desprotegerlo."
  - id: d
    text:
      es: "Es obligatoria, y Excel puede recuperarla si se pierde."
  explanation:
    es: "La página dice «La contraseña es opcional. Si no proporciona una contraseña, cualquier usuario puede desproteger y cambiar el libro», y añade que, si se pierde, Excel no podrá recuperarla. No es obligatoria ni reserva la desprotección al autor."
  citation: "fuente: `ms-excel-proteger-libro.html`; «Proteger un libro»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m06-l05-q043
  prompt:
    es: "En un libro de Excel 365 con la estructura protegida, ¿qué se observa al hacer clic en la parte inferior de una hoja, en sus pestañas?"
  options:
  - id: a
    text:
      es: "Las opciones de estructura están disponibles, pero piden la contraseña antes de aplicarse."
  - id: b
    text:
      es: "Solo la opción Desproteger hoja está disponible en el menú de la pestaña de la hoja."
  - id: c
    text:
      es: "Las opciones de estructura están disponibles, pero sus cambios se deshacen al cerrar el libro."
  - id: d
    correct: true
    text:
      es: "No están disponibles opciones como Insertar, Eliminar, Cambiar el nombre, Mover u Ocultar."
  explanation:
    es: "La página dice que, con el libro protegido, las opciones para cambiar su estructura, «como Insertar, Eliminar, Cambiar el nombre, Mover, Copiar, Ocultar y Mostrar hojas no están disponibles». No quedan disponibles a la espera de una contraseña, no se deshacen al cerrar y Desproteger hoja pertenece a la protección de la hoja."
  citation: "fuente: `ms-excel-proteger-libro.html`; «¿Cómo saber si un libro está protegido?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m06-l05-q044
  prompt:
    es: "En Excel 365, ¿qué protección corresponde usar para que otros usuarios no puedan abrir un archivo, según la ayuda de Proteger libro?"
  options:
  - id: a
    text:
      es: "Proteger la estructura del libro con una contraseña"
  - id: b
    correct: true
    text:
      es: "Proteger un archivo de Excel con una contraseña"
  - id: c
    text:
      es: "Proteger la hoja de cálculo con una contraseña"
  - id: d
    text:
      es: "Bloquear las celdas en Formato de celdas › Protección"
  explanation:
    es: "La nota de la página distingue las tres protecciones: «Para bloquear el archivo de modo que otros usuarios no pueden abrirlo, vea Proteger un archivo de Excel». Proteger la estructura del libro impide cambiar sus hojas, proteger la hoja protege áreas de datos y bloquear celdas solo actúa con la hoja protegida."
  citation: "fuente: `ms-excel-proteger-libro.html`; «Proteger un libro»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m06-l05-q045
  prompt:
    es: "En Excel 365, ¿qué filas y columnas fija el comando Inmovilizar paneles respecto de la celda seleccionada?"
  options:
  - id: a
    text:
      es: "Las filas inferiores y las columnas situadas a la derecha de la celda seleccionada."
  - id: b
    text:
      es: "Las filas superiores y las columnas a la derecha de la celda seleccionada."
  - id: c
    correct: true
    text:
      es: "Las filas superiores y las columnas a la izquierda de la celda seleccionada."
  - id: d
    text:
      es: "Solo la fila y la columna en las que está la celda seleccionada."
  explanation:
    es: "La página dice que «Inmovilizar paneles inmoviliza las filas superiores y las columnas a la izquierda de la celda seleccionada». Las demás opciones cambian la dirección de las filas o de las columnas, o reducen lo fijado a la fila y la columna de la celda."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m06-l05-q046
  prompt:
    es: "En Excel 365, ¿en cuál de las siguientes pestañas de la cinta de opciones está el comando Inmovilizar paneles?"
  options:
  - id: a
    text:
      es: "La pestaña Inicio"
  - id: b
    text:
      es: "La pestaña Diseño de página"
  - id: c
    text:
      es: "La pestaña Revisar"
  - id: d
    correct: true
    text:
      es: "La pestaña Vista"
  explanation:
    es: "La página indica ir a «la pestaña Vista, donde puede inmovilizar paneles para bloquear filas y columnas específicas». Inmovilizar paneles no está en Inicio, Diseño de página ni Revisar."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar paneles para bloquear filas y columnas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m06-l05-q047
  prompt:
    es: "En Excel 365, para inmovilizar las dos primeras columnas de la hoja con Inmovilizar paneles, ¿qué se selecciona antes?"
  options:
  - id: a
    text:
      es: "La segunda columna"
  - id: b
    text:
      es: "La primera y la segunda columna"
  - id: c
    text:
      es: "La celda A1"
  - id: d
    correct: true
    text:
      es: "La tercera columna"
  explanation:
    es: "Para inmovilizar las dos primeras columnas, la página manda seleccionar antes la columna siguiente (C). Inmovilizar paneles fija las columnas a la izquierda de la selección: con la columna B seleccionada solo quedaría fija la columna A, con las columnas A y B no queda ninguna a su izquierda, y con la celda A1 no queda nada a la izquierda ni encima."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m06-l05-q048
  prompt:
    es: "En una hoja de Excel 365 se quiere que las filas 1 y 2 y la columna A sigan visibles al desplazarse. ¿Cuál de las siguientes celdas se selecciona antes de Inmovilizar paneles?"
  options:
  - id: a
    text:
      es: "La celda A3"
  - id: b
    correct: true
    text:
      es: "La celda B3"
  - id: c
    text:
      es: "La celda B2"
  - id: d
    text:
      es: "La celda C3"
  explanation:
    es: "La página indica seleccionar «la celda que se encuentra debajo de las filas y a la derecha de las columnas» que se quieren mantener visibles: debajo de la fila 2 y a la derecha de la columna A está B3. A3 solo fija las filas 1 y 2, B2 fija la fila 1 y la columna A, y C3 fija también la columna B."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar filas o columnas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-inmovilizar-paneles-html
- id: m06-l05-q049
  prompt:
    es: "Señale la afirmación correcta sobre los comandos de la pestaña Vista de Excel 365 que mantienen visible un área de la hoja:"
  options:
  - id: a
    text:
      es: "Dividir paneles bloquea en su lugar las filas superiores de la hoja de cálculo."
  - id: b
    correct: true
    text:
      es: "Dividir paneles crea ventanas independientes de la misma hoja de cálculo."
  - id: c
    text:
      es: "Inmovilizar paneles crea ventanas independientes de la misma hoja de cálculo."
  - id: d
    text:
      es: "Inmovilizar paneles oculta las filas y columnas que quedan fuera de la vista."
  explanation:
    es: "La página dice que en la pestaña Vista se pueden «inmovilizar paneles para bloquear filas y columnas específicas en su lugar, o puede dividir paneles para crear ventanas independientes de la misma hoja de cálculo». Las demás opciones intercambian lo que hace cada comando o atribuyen a Inmovilizar paneles una ocultación que no hace."
  citation: "fuente: `ms-excel-inmovilizar-paneles.html`; «Inmovilizar paneles para bloquear filas y columnas»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-seleccionar-celdas-html
- id: m06-l05-q050
  prompt:
    es: "En Excel 365, ¿qué tecla se mantiene presionada para seleccionar con el ratón celdas y rangos de celdas no adyacentes?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl"
  - id: b
    text:
      es: "Mayús"
  - id: c
    text:
      es: "Alt"
  - id: d
    text:
      es: "Tab"
  explanation:
    es: "La página dice «Para seleccionar rangos de celdas y celdas no adyacentes, mantenga presionada la tecla Ctrl y seleccione las celdas». Mayús extiende la selección a un rango continuo, Alt activa las teclas de acceso de la cinta y Tab mueve una celda a la derecha."
  citation: "fuente: `ms-excel-seleccionar-celdas.html`; «Seleccionar una o varias celdas»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-seleccionar-celdas-html
- id: m06-l05-q051
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes métodos abreviados permite agregar otra celda o rango no adyacente a la selección con las teclas de dirección?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+Fin"
  - id: b
    text:
      es: "Ctrl+F8"
  - id: c
    correct: true
    text:
      es: "Mayús+F8"
  - id: d
    text:
      es: "Alt+F8"
  explanation:
    es: "La página da Mayús+F8 «para agregar otra celda o rango no adyacente a la selección»; se vuelve a presionar para dejar de agregar. Ctrl+Mayús+Fin extiende la selección hasta la última celda utilizada de la esquina inferior derecha, Ctrl+F8 ejecuta el comando Tamaño cuando un libro no está maximizado y Alt+F8 sirve para crear, ejecutar, editar o eliminar una macro."
  citation: "fuente: `ms-excel-seleccionar-celdas.html`; «Celdas o rangos de celdas no adyacentes»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q052
  prompt:
    es: "En Excel 365, ¿qué nombre recibe el punto y coma (;) usado en una referencia como C2:C7;E2:E7?"
  options:
  - id: a
    text:
      es: "Operador de rango"
  - id: b
    correct: true
    text:
      es: "Operador de unión"
  - id: c
    text:
      es: "Operador de intersección"
  - id: d
    text:
      es: "Operador de concatenación"
  explanation:
    es: "La tabla de operadores de referencia da «punto y coma (;) u operador de unión», con el rango C2:C7; E2:E7. Los dos puntos (:) son el operador de rango y el espacio es el operador de intersección; la concatenación une textos, no referencias."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Operadores de referencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q053
  prompt:
    es: "En Excel 365, ¿qué carácter actúa como operador de intersección entre dos referencias de una fórmula?"
  options:
  - id: a
    text:
      es: "Los dos puntos (:)"
  - id: b
    text:
      es: "El punto y coma (;)"
  - id: c
    text:
      es: "El signo de exclamación (!)"
  - id: d
    correct: true
    text:
      es: "Un espacio"
  explanation:
    es: "La tabla de operadores de referencia da «(espacio) u operador de intersección». Los dos puntos son el operador de rango, el punto y coma el operador de unión, y el signo de exclamación separa el nombre de la hoja del rango."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Operadores de referencia»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-seleccionar-celdas-html
- id: m06-l05-q054
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes acciones selecciona varias filas completas no adyacentes de una hoja?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic en el encabezado de la primera fila y Ctrl+clic en los encabezados de las demás."
  - id: b
    text:
      es: "Clic en el encabezado de la primera fila y Mayús+clic en los encabezados de las demás."
  - id: c
    text:
      es: "Clic en una celda de la primera fila y Ctrl+barra espaciadora en cada una de las demás."
  - id: d
    text:
      es: "Clic en una celda de cada fila manteniendo presionada la tecla Alt."
  explanation:
    es: "La página indica hacer clic en el encabezado de una fila o columna y mantener presionada Ctrl al hacer clic en los encabezados de las demás, no Alt. Mayús selecciona filas o columnas adyacentes y Ctrl+barra espaciadora selecciona la columna entera de una celda."
  citation: "fuente: `ms-excel-seleccionar-celdas.html`; «Filas o columnas no adyacentes»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-seleccionar-celdas-html
- id: m06-l05-q055
  prompt:
    es: "En Excel 365, con una celda cualquiera de una columna activa, ¿qué método abreviado selecciona toda esa columna?"
  options:
  - id: a
    text:
      es: "Mayús+barra espaciadora"
  - id: b
    text:
      es: "Ctrl+E"
  - id: c
    text:
      es: "Ctrl+Mayús+Fin"
  - id: d
    correct: true
    text:
      es: "Ctrl+barra espaciadora"
  explanation:
    es: "La página dice que se selecciona toda la columna al hacer clic en cualquier celda de ella y presionar «Ctrl + Barra espaciadora». Mayús+barra espaciadora selecciona la fila, Ctrl+E selecciona toda la hoja y Ctrl+Mayús+Fin extiende la selección hasta la celda utilizada de la esquina inferior derecha."
  citation: "fuente: `ms-excel-seleccionar-celdas.html`; «Seleccionar una o más filas y columnas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-combinar-celdas-html
- id: m06-l05-q056
  prompt:
    es: "En Excel 365, al combinar varias celdas que tienen contenido, ¿qué ocurre con el contenido de las celdas distintas de la superior izquierda?"
  options:
  - id: a
    text:
      es: "Se conserva oculto y vuelve a aparecer al anular la combinación."
  - id: b
    text:
      es: "Se mueve a las celdas situadas a la derecha del rango combinado."
  - id: c
    correct: true
    text:
      es: "Se elimina; la celda combinada muestra solo el de la superior izquierda."
  - id: d
    text:
      es: "Se copia al portapapeles para que pueda pegarse en otra ubicación."
  explanation:
    es: "La página dice que la celda combinada muestra el contenido de una sola celda, la superior izquierda en los idiomas de izquierda a derecha, y que «el contenido de las demás celdas que se combinen se elimina». No se conserva oculto, no se desplaza a otras celdas y no pasa al portapapeles."
  citation: "fuente: `ms-excel-combinar-celdas.html`; «Combinar celdas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-combinar-celdas-html
- id: m06-l05-q057
  prompt:
    es: "En Excel 365 en español se combinan las celdas B2:D4, todas con texto. ¿Cuál de las siguientes celdas aporta el contenido que muestra la celda combinada?"
  options:
  - id: a
    text:
      es: "La celda D4"
  - id: b
    text:
      es: "La celda D2"
  - id: c
    correct: true
    text:
      es: "La celda B2"
  - id: d
    text:
      es: "La celda B4"
  explanation:
    es: "Al combinar varias celdas, la celda combinada muestra el contenido de la celda superior izquierda en los idiomas que se escriben de izquierda a derecha, como el español; en B2:D4 esa celda es B2. D4 es la inferior derecha, D2 la superior derecha y B4 la inferior izquierda."
  citation: "fuente: `ms-excel-combinar-celdas.html`; «Combinar celdas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-combinar-celdas-html
- id: m06-l05-q058
  prompt:
    es: "En Excel 365, con un idioma que se escribe de derecha a izquierda, ¿qué celda aporta el contenido de la celda combinada al combinar varias?"
  options:
  - id: a
    correct: true
    text:
      es: "La celda superior derecha"
  - id: b
    text:
      es: "La celda superior izquierda"
  - id: c
    text:
      es: "La celda inferior derecha"
  - id: d
    text:
      es: "La celda inferior izquierda"
  explanation:
    es: "La página dice que aparece el contenido de la celda superior izquierda en los idiomas de izquierda a derecha «o la celda superior derecha para los idiomas de derecha a izquierda». La superior izquierda es la regla de los idiomas de izquierda a derecha y las celdas inferiores no aportan contenido."
  citation: "fuente: `ms-excel-combinar-celdas.html`; «Combinar celdas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-combinar-celdas-html
- id: m06-l05-q059
  prompt:
    es: "En Excel 365 para Windows, ¿cuál de las siguientes acciones de la cinta separa una celda combinada en sus celdas?"
  options:
  - id: a
    text:
      es: "Flecha abajo de Combinar y centrar › Combinar celdas"
  - id: b
    correct: true
    text:
      es: "Flecha abajo de Combinar y centrar › Anular combinación de celdas"
  - id: c
    text:
      es: "Revisar › Proteger hoja › Anular combinación de celdas"
  - id: d
    text:
      es: "Inicio › Eliminar › Anular combinación de celdas"
  explanation:
    es: "Para separar celdas, la página indica hacer clic en la flecha abajo de Combinar y centrar y seleccionar Anular combinación de celdas. Combinar celdas, en ese mismo menú, combina en lugar de separar; Anular combinación de celdas no está en Proteger hoja ni en el menú Eliminar."
  citation: "fuente: `ms-excel-combinar-celdas.html`; «Separar celdas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-combinar-celdas-html
- id: m06-l05-q060
  prompt:
    es: "Señale la afirmación correcta sobre la división de celdas en una hoja de cálculo de Excel 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Una celda sin combinar no se puede dividir; una combinada sí puede separarse."
  - id: b
    text:
      es: "Cualquier celda se puede dividir en dos con el comando Combinar y centrar."
  - id: c
    text:
      es: "Una celda sin combinar se divide en varias con Anular combinación de celdas."
  - id: d
    text:
      es: "Una celda combinada ya no se puede volver a separar en sus celdas."
  explanation:
    es: "La página dice «No puede dividir una celda sin combinar» y, a continuación, que «después de combinar celdas, puede dividir una celda combinada en celdas separadas de nuevo». Combinar y centrar une celdas, no las divide; Anular combinación solo actúa sobre una celda combinada."
  citation: "fuente: `ms-excel-combinar-celdas.html`; «No puede dividir una celda sin combinar.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-separadores-html
- id: m06-l05-q101
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe de dónde toma Excel, de forma predeterminada, los separadores decimal y de miles?"
  options:
  - id: a
    correct: true
    text:
      es: "Usa los separadores del sistema que define la configuración regional"
  - id: b
    text:
      es: "Usa los separadores personalizados que se escriben en los cuadros de Opciones de edición"
  - id: c
    text:
      es: "Usa los separadores que define cada libro en su propia configuración de fórmulas"
  - id: d
    text:
      es: "Usa siempre coma para los decimales y punto para los miles, en cualquier equipo"
  explanation:
    es: "La página dice que Excel usa por defecto los separadores del sistema definidos en la configuración regional del Panel de control. Los personalizados de Opciones de edición solo se usan al desactivar la casilla Usar separadores del sistema, y la página los presenta como un reemplazo temporal. Los demás enunciados contradicen que la fuente sea la configuración regional del sistema."
  citation: "fuente: `ms-excel-separadores.html`; «Cambiar el carácter usado para separar los miles o los decimales»"
  difficulty: 1
  tags:
  - "configuración"
  - "concepto"
