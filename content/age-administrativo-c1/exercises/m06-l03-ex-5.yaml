      es: "Las carpetas Imágenes, Música y Vídeos, además del escritorio"
  - id: c
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos"
  - id: d
    correct: true
    text:
      es: "Las carpetas Documentos, Imágenes y Música, además del escritorio, de forma predeterminada"
  explanation:
    es: "La página dice que el modo Clásico indexa de forma predeterminada las carpetas Documentos, Imágenes y Música, además del escritorio. Todo el equipo es lo que indexa el modo Mejorado. La lista con Vídeos cambia una de las carpetas. Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos son las carpetas conocidas que vienen ancladas en Acceso rápido, no las del modo Clásico."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
