# Tax-part summaries, batch 4 (III.11–III.14), staged for the blind check.
m03-l11: El período ejecutivo se inicia, para las deudas liquidadas por la Administración, el día siguiente al del vencimiento
  del plazo de ingreso del artículo 62 de la LGT, y para las autoliquidadas sin ingreso, al día siguiente de la finalización
  del plazo de ingreso o, si este ya hubiera concluido, el día siguiente a la presentación de la autoliquidación. Sus recargos
  son del 5 %, del 10 % o del 20 %, según el momento del pago, y la deuda apremiada se paga en los plazos del artículo 62.5
  de la LGT. Entre las garantías de la deuda tributaria están el derecho de prelación, la hipoteca legal tácita, la afección
  de bienes, el derecho de retención y las medidas cautelares.
m03-l12: El embargo se practica sobre los bienes y derechos del obligado en cuantía suficiente para cubrir la deuda, los intereses,
  los recargos y las costas, atendiendo a la mayor facilidad de su enajenación y la menor onerosidad para el obligado, y por
  el orden del artículo 169.2 de la LGT cuando esos criterios son de imposible o muy difícil aplicación. Contra la diligencia
  de embargo solo caben los motivos de oposición del artículo 170.3 de la LGT. Los bienes embargados se enajenan por subasta,
  concurso o adjudicación directa, y la recaudación se dirige también contra los responsables y los sucesores.
m03-l13: La potestad sancionadora tributaria se ejerce de acuerdo con los principios de la potestad sancionadora en materia
  administrativa, con las especialidades de la LGT, entre ellos el de no concurrencia de sanciones. Las infracciones son leves,
  graves o muy graves; las sanciones pecuniarias se gradúan por los criterios del artículo 187 de la LGT y se reducen por
  conformidad, por acta con acuerdo o por pronto pago. El procedimiento sancionador se tramita de forma separada, salvo renuncia,
  y debe concluir en seis meses desde la notificación de su inicio.
m03-l14: Los actos tributarios se revisan por los procedimientos especiales de revisión, por el recurso de reposición, potestativo,
  y por las reclamaciones económico-administrativas. El recurso de reposición y la reclamación se interponen en el plazo de
  un mes. Los órganos económico-administrativos del Estado son el Tribunal Económico-Administrativo Central y los tribunales
  económico-administrativos regionales y locales, y tiene también esa consideración la Sala Especial para la Unificación de
  Doctrina.
