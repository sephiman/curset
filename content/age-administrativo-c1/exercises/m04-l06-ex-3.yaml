# anchor: boe-a-1985-151-art-19
- id: m04-l06-q054
  prompt:
    es: "Conforme al artículo 19.a) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, las actividades derivadas de la administración del patrimonio personal o familiar:"
  options:
  - id: a
    text:
      es: "Quedan exceptuadas incluso cuando incurran en las prohibiciones del artículo 12."
  - id: b
    text:
      es: "Requieren en todo caso el previo reconocimiento de compatibilidad."
  - id: c
    text:
      es: "Quedan exceptuadas solo si el patrimonio no supera el límite reglamentario."
  - id: d
    correct: true
    text:
      es: "Quedan exceptuadas, sin perjuicio de lo dispuesto en el artículo 12 de la Ley."
  explanation:
    es: "El artículo 19.a) exceptúa «Las derivadas de la Administración del patrimonio personal o familiar, sin perjuicio de lo dispuesto en el artículo 12». Las prohibiciones del artículo 12 siguen aplicándose a esas actividades. Al estar exceptuadas, no requieren reconocimiento. El artículo no pone ningún límite al valor del patrimonio."
  citation: "art. 19.a) Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q055
  prompt:
    es: "El cargo de Presidente, Vocal o miembro de Juntas rectoras de Mutualidades o Patronatos de Funcionarios queda exceptuado del régimen de incompatibilidades:"
  options:
  - id: a
    correct: true
    text:
      es: "Siempre que el cargo no sea retribuido."
  - id: b
    text:
      es: "Siempre que no supere setenta y cinco horas al año."
  - id: c
    text:
      es: "Siempre que no tenga carácter permanente o habitual."
  - id: d
    text:
      es: "Siempre que lo autorice el Subsecretario del Departamento."
  explanation:
    es: "El artículo 19.e) de la Ley 53/1984 exceptúa ese cargo «siempre que no sea retribuido». El límite de setenta y cinco horas y el carácter no permanente ni habitual son condiciones de la letra b). La autorización del Subsecretario no aparece: lo exceptuado queda fuera del régimen."
  citation: "art. 19.e) Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q056
  prompt:
    es: "¿Cuál de las siguientes condiciones fija la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas para que la creación literaria, artística, científica y técnica quede exceptuada del régimen de incompatibilidades?"
  options:
  - id: a
    text:
      es: "Que no genere ingresos superiores a la retribución anual del puesto principal."
  - id: b
    correct: true
    text:
      es: "Que no se origine como consecuencia de una relación de empleo o de prestación de servicios."
  - id: c
    text:
      es: "Que no suponga más de setenta y cinco horas de dedicación al año."
  - id: d
    text:
      es: "Que no tenga carácter permanente o habitual a lo largo del año."
  explanation:
    es: "El artículo 19.f) exceptúa esa producción y sus publicaciones «siempre que no se originen como consecuencia de una relación de empleo o de prestación de servicios». Ninguna norma fija un tope de ingresos ligado al puesto principal. Las setenta y cinco horas y el carácter no permanente ni habitual son condiciones de la letra b)."
  citation: "art. 19.f) Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q057
  prompt:
    es: "¿Qué participación en coloquios y programas de los medios de comunicación social queda exceptuada del régimen de incompatibilidades del personal de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La participación no retribuida, solo en medios de comunicación públicos."
  - id: b
    text:
      es: "La participación ocasional, solo en medios de comunicación públicos."
  - id: c
    correct: true
    text:
      es: "La participación ocasional, en cualquier medio de comunicación social."
  - id: d
    text:
      es: "La participación autorizada por el Subsecretario del Departamento."
  explanation:
    es: "El artículo 19.g) de la Ley 53/1984 exceptúa «La participación ocasional en coloquios y programas en cualquier medio de comunicación social». La condición es que sea ocasional, no que sea gratuita. Limitarla a medios públicos contradice «cualquier medio». No hace falta autorización: lo exceptuado queda fuera del régimen."
  citation: "art. 19.g) Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q058
  prompt:
    es: "Señale la actividad que, según el artículo 19.h) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, queda exceptuada del régimen de incompatibilidades:"
  options:
  - id: a
    text:
      es: "La dirección permanente de un centro privado de formación profesional."
  - id: b
    text:
      es: "La asistencia técnica habitual a empresas del sector en que trabaja."
  - id: c
    correct: true
    text:
      es: "La colaboración y la asistencia ocasional a congresos o cursos de carácter profesional."
  - id: d
    text:
      es: "La actuación habitual como perito de parte en procesos judiciales."
  explanation:
    es: "El artículo 19.h) exceptúa «La colaboración y la asistencia ocasional a Congresos, seminarios, conferencias o cursos de carácter profesional». Las otras tres son actividades permanentes o habituales que el artículo 19 no recoge. Como actividades privadas, requieren el previo reconocimiento de compatibilidad del artículo 14."
  citation: "art. 19.h) Ley 53/1984"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-19
- id: m04-l06-q059
  prompt:
    es: "Según el artículo 19 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿cuál de las siguientes actividades NO queda exceptuada del régimen de incompatibilidades?"
  options:
  - id: a
    text:
      es: "La participación del personal docente en evaluaciones distintas de las habituales, en la forma reglamentaria."
  - id: b
    text:
      es: "La participación ocasional en coloquios y programas de cualquier medio de comunicación social."
  - id: c
    correct: true
    text:
      es: "La dirección habitual de seminarios en Centros oficiales de formación de funcionarios."
  - id: d
    text:
      es: "La administración del patrimonio familiar, sin perjuicio de lo dispuesto en el artículo 12."
  explanation:
    es: "El artículo 19.b) exceptúa la dirección de seminarios en Centros oficiales de formación de funcionarios solo «cuando no tenga carácter permanente o habitual». Si es habitual, no queda exceptuada. Las otras tres están exceptuadas: la participación del personal docente en evaluaciones distintas de las que le corresponden (letra d), la participación ocasional en medios de comunicación (letra g) y la administración del patrimonio familiar (letra a)."
  citation: "art. 19 Ley 53/1984"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q060
  prompt:
    es: "Según el artículo 12.1.c) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿en cuál de las siguientes entidades tiene vedado el personal el desempeño de cargos de todo orden?"
  options:
  - id: a
    correct: true
    text:
      es: "Una sociedad avalada por el sector público, aunque su actividad no tenga relación con el Departamento."
  - id: b
    text:
      es: "Una sociedad que solo vende a particulares, sin contratos, participación ni aval públicos."
  - id: c
    text:
      es: "Una fundación privada que se financia solo con donaciones de particulares, sin vínculo público."
  - id: d
    text:
      es: "Una cooperativa agraria sin contratos públicos ni participación o aval del sector público."
  explanation:
    es: "El artículo 12.1.c) veda en todo caso los cargos de todo orden en empresas o sociedades «concesionarias, contratistas de obras, servicios o suministros, arrendatarias o administradoras de monopolios, o con participación o aval del sector público, cualquiera que sea la configuración jurídica de aquéllas». El aval público basta: la letra c) no pide relación con el Departamento, condición que solo pone la letra b) para los Consejos de Administración de empresas privadas. La sociedad que vende solo a particulares, la fundación financiada con donaciones y la cooperativa sin contratos, participación ni aval públicos no tienen ninguno de los vínculos de la lista. Un cargo en ellas no cae en esta prohibición; como actividad privada, requiere el previo reconocimiento de compatibilidad del artículo 14."
  citation: "art. 12.1.c) Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-93
- id: m04-l06-q102
  prompt:
    es: "Según el artículo 93.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes es la responsabilidad de quienes inducen a otros a cometer una falta disciplinaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La misma responsabilidad en que incurren quienes realizan esos actos o conductas."
  - id: b
    text:
      es: "La de una falta de grado inmediatamente inferior al de la falta cometida."
  - id: c
    text:
      es: "Ninguna, salvo que participen ellos mismos en la ejecución de los actos."
  - id: d
    text:
      es: "La misma responsabilidad, pero solo si la falta inducida es muy grave."
  explanation:
    es: "Quienes inducen a otros a cometer una falta «incurrirán en la misma responsabilidad que éstos». El artículo no rebaja la falta un grado ni exige que el inductor participe en la ejecución. Tampoco limita la regla a las faltas muy graves: vale para cualquier falta disciplinaria."
  citation: "art. 93.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-93
- id: m04-l06-q103
  prompt:
    es: "De acuerdo con el artículo 93.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, incurren en responsabilidad quienes encubran:"
  options:
  - id: a
    correct: true
    text:
      es: "Las faltas consumadas muy graves o graves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: b
    text:
      es: "Las faltas consumadas de cualquier clase, incluidas las leves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: c
    text:
      es: "Las faltas consumadas muy graves o graves, aunque de ello no se derive daño alguno para la Administración."
  - id: d
    text:
      es: "Las faltas muy graves, consumadas o intentadas, cuando de ello se derive un daño para los ciudadanos."
  explanation:
    es: "El artículo 93.3 exige dos cosas: que la falta encubierta sea consumada y muy grave o grave, y que del encubrimiento «se derive daño grave para la Administración o los ciudadanos». Encubrir una falta leve no entra. Sin daño grave tampoco hay responsabilidad. La falta intentada no figura: el texto habla de faltas consumadas."
  citation: "art. 93.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1986-1216-art-1
- id: m04-l06-q104
  prompt:
    es: "De acuerdo con su artículo 1, el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, aprobado por el Real Decreto 33/1986, de 10 de enero, se aplica:"
  options:
  - id: a
    text:
      es: "Al personal funcionario y laboral de todas las Administraciones públicas."
  - id: b
    correct: true
    text:
      es: "Al personal funcionario comprendido en el artículo 1.1 de la Ley 30/1984."
  - id: c
    text:
      es: "Al personal laboral de la Administración del Estado y de sus organismos."
  - id: d
    text:
      es: "Al personal funcionario y laboral comprendido en el artículo 1.1 de la Ley 30/1984."
  explanation:
    es: "El artículo 1 lo aplica «al personal funcionario comprendido en el artículo 1, 1, de la Ley 30/1984». El personal laboral queda fuera, tanto el de la Administración del Estado como el del mismo artículo 1.1. Tampoco alcanza a todas las Administraciones públicas: su título lo ciñe a los funcionarios de la Administración del Estado."
  citation: "art. 1 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q108
  prompt:
    es: "Un funcionario se niega abiertamente a cumplir la orden de su superior de firmar un acuerdo que constituye una infracción manifiesta del Ordenamiento jurídico. Según el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Comete la falta muy grave de desobediencia abierta, que no admite excepciones."
  - id: b
    text:
      es: "Comete la falta muy grave de desobediencia abierta, salvo que hubiera recurrido la orden."
  - id: c
    correct: true
    text:
      es: "No comete la falta muy grave de desobediencia abierta, que exceptúa esas órdenes."
  - id: d
    text:
      es: "Comete la falta muy grave de desobediencia abierta, salvo que avisara por escrito."
  explanation:
    es: "La desobediencia abierta a un superior es falta muy grave «salvo que constituyan infracción manifiesta del Ordenamiento jurídico». La orden del caso es de ese tipo, así que la negativa no encaja en esa falta. Decir que no admite excepciones contradice el propio precepto. Recurrir la orden o avisar por escrito no son condiciones que el artículo exija."
  citation: "art. 95.2.i) TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q109
  prompt:
    es: "De acuerdo con el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el incumplimiento de las normas sobre incompatibilidades es falta muy grave:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando ello dé lugar a una situación de incompatibilidad."
  - id: b
    text:
      es: "En todo caso, se produzca o no una situación de incompatibilidad."
  - id: c
    text:
      es: "Cuando se perciban retribuciones por los dos puestos o actividades."
  - id: d
    text:
      es: "Cuando persista después de un requerimiento de la Administración."
  explanation:
    es: "La letra n) del artículo 95.2 exige que el incumplimiento «dé lugar a una situación de incompatibilidad». No lo califica de muy grave en todo caso. Tampoco pide que se cobre por los dos puestos ni un requerimiento previo de la Administración."
  citation: "art. 95.2.n) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q111
  prompt:
    es: "Según el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la adopción de acuerdos manifiestamente ilegales es falta muy grave cuando:"
  options:
  - id: a
    text:
      es: "Se adopten en un órgano colegiado con el voto favorable del funcionario."
  - id: b
    text:
      es: "Causen cualquier perjuicio, aunque sea leve, a la Administración o a los ciudadanos."
  - id: c
    text:
      es: "Se repitan en un período de un año después de una advertencia."
  - id: d
    correct: true
    text:
      es: "Causen perjuicio grave a la Administración o a los ciudadanos."
  explanation:
    es: "La letra d) del artículo 95.2 exige que los acuerdos «causen perjuicio grave a la Administración o a los ciudadanos». Un perjuicio leve no basta. El precepto no habla de órganos colegiados ni de votos, y tampoco pide repetición ni advertencia previa."
  citation: "art. 95.2.d) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q112
  prompt:
    es: "¿Cuándo es falta muy grave, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la negligencia en la custodia de secretos oficiales declarados así por ley o clasificados como tales?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando sea causa de su publicación o provoque su difusión o conocimiento indebido."
  - id: b
    text:
      es: "En todo caso, aunque no se produzca su publicación ni su difusión."
  - id: c
    text:
      es: "Solo cuando sea dolosa y cause su publicación en un medio de comunicación."
  - id: d
    text:
      es: "Cuando provoque su difusión y se hubiera advertido al funcionario."
  explanation:
    es: "La letra f) del artículo 95.2 tipifica la negligencia que «sea causa de su publicación o que provoque su difusión o conocimiento indebido». Sin ese resultado no hay falta muy grave. Hablar de una negligencia dolosa es una contradicción, y el precepto no pide un medio de comunicación ni una advertencia previa."
  citation: "art. 95.2.f) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q114
  prompt:
    es: "¿En qué procesos electorales es falta muy grave violar la imparcialidad utilizando las facultades atribuidas al empleado público para influir en ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "En los de cualquier naturaleza y ámbito."
  - id: b
    text:
      es: "Solo en los de ámbito estatal o autonómico."
  - id: c
    text:
      es: "Solo en las elecciones a las Cortes Generales."
  - id: d
    text:
      es: "Solo en los políticos, no en los sindicales."
  explanation:
    es: "La letra h) del artículo 95.2 habla de influir «en procesos electorales de cualquier naturaleza y ámbito». No se limita a un ámbito territorial ni a las elecciones a las Cortes Generales. Tampoco excluye los procesos sindicales: cualquier naturaleza los incluye."
  citation: "art. 95.2.h) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q115
  prompt:
    es: "Según el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, es falta muy grave la prevalencia de la condición de empleado público para:"
  options:
  - id: a
    text:
      es: "Obtener un beneficio indebido para sí, pero no cuando es para otro."
  - id: b
    text:
      es: "Obtener un beneficio económico superior a su retribución mensual."
  - id: c
    correct: true
    text:
      es: "Obtener un beneficio indebido para sí o para otro."
  - id: d
    text:
      es: "Obtener un trato preferente en un procedimiento propio, aunque sea debido."
  explanation:
    es: "La letra j) del artículo 95.2 castiga la prevalencia de la condición de empleado público «para obtener un beneficio indebido para sí o para otro». Cuenta también el beneficio para otro. El precepto no fija una cuantía mínima, y lo que importa es que el beneficio sea indebido."
  citation: "art. 95.2.j) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q116
  prompt:
    es: "¿Cuál de las siguientes conductas es falta muy grave según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: b
    text:
      es: "Las conductas constitutivas de delito doloso relacionadas con el servicio."
  - id: c
    correct: true
    text:
      es: "El incumplimiento de la obligación de atender los servicios esenciales en caso de huelga."
  - id: d
    text:
      es: "La tolerancia de los superiores respecto de las faltas graves de sus subordinados."
  explanation:
    es: "La letra m) del artículo 95.2 tipifica como muy grave «el incumplimiento de la obligación de atender los servicios esenciales en caso de huelga». Las otras tres conductas no figuran en ese artículo. Son faltas graves del artículo 7.1 del Reglamento de Régimen Disciplinario de 1986: el atentado grave a la dignidad, el delito doloso relacionado con el servicio y la tolerancia de los superiores."
  citation: "art. 95.2.m) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q117
  prompt:
    es: "Según el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuáles de las siguientes faltas son también muy graves, además de las que enumera?"
  options:
  - id: a
    text:
      es: "Las tipificadas como tales por real decreto del Gobierno o, para el personal laboral, por orden ministerial."
  - id: b
    text:
      es: "Las tipificadas como tales solo por ley de las Cortes Generales, también para el personal laboral."
  - id: c
    text:
      es: "Las tipificadas como tales por reglamento de cada Administración o, para el laboral, en su contrato."
  - id: d
    correct: true
    text:
      es: "Las tipificadas como tales por ley estatal o autonómica o, para el personal laboral, por convenio colectivo."
  explanation:
    es: "La letra p) del artículo 95.2 añade las faltas tipificadas como muy graves «en ley de las Cortes Generales o de la asamblea legislativa de la correspondiente comunidad autónoma o por los convenios colectivos en el caso de personal laboral». Un real decreto, una orden, un reglamento o un contrato no bastan. Y no son solo las leyes de las Cortes: valen las autonómicas y, para el personal laboral, los convenios."
  citation: "art. 95.2.p) TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q118
  prompt:
    es: "Según el artículo 95.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cómo se establecen las faltas graves del personal funcionario?"
  options:
  - id: a
    correct: true
    text:
      es: "Por ley de las Cortes Generales o de la asamblea legislativa de la comunidad autónoma."
  - id: b
    text:
      es: "Por orden del ministerio competente en función pública, previa negociación."
  - id: c
    text:
      es: "Por convenio colectivo, del mismo modo que las del personal laboral."
  - id: d
    text:
      es: "Por el propio Estatuto, que las enumera en una lista cerrada."
  explanation:
    es: "El artículo 95.3 dice que las faltas graves «serán establecidas por ley de las Cortes Generales o de la asamblea legislativa de la correspondiente comunidad autónoma». El convenio colectivo solo sirve para el personal laboral. Una orden ministerial no puede establecerlas. El Estatuto enumera las muy graves, no las graves."
  citation: "art. 95.3 TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q119
  prompt:
    es: "De acuerdo con el artículo 95.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el régimen aplicable a las faltas leves lo determinan:"
  options:
  - id: a
    text:
      es: "Los reglamentos de régimen interior que apruebe cada departamento ministerial."
  - id: b
    correct: true
    text:
      es: "Las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: c
    text:
      es: "Los convenios colectivos, también para el personal funcionario."
  - id: d
    text:
      es: "Las resoluciones de la Secretaría de Estado de Función Pública."
  explanation:
    es: "El artículo 95.4 remite a «las leyes de Función Pública que se dicten en desarrollo del presente Estatuto». No lo deja a reglamentos de cada departamento ni a resoluciones de la Secretaría de Estado. Los convenios colectivos solo tipifican faltas del personal laboral."
  citation: "art. 95.4 TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q121
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave la tolerancia de los superiores respecto de la comisión, por sus subordinados, de:"
  options:
  - id: a
    correct: true
    text:
      es: "Faltas muy graves o graves."
  - id: b
    text:
      es: "Faltas de cualquier clase, también leves."
  - id: c
    text:
      es: "Faltas leves, cuando se repitan."
  - id: d
    text:
      es: "Faltas muy graves, pero no graves."
  explanation:
    es: "La letra d) del artículo 7.1 habla de la tolerancia «respecto de la comisión de faltas muy graves o graves de sus subordinados». No incluye las leves, ni siquiera cuando se repiten. Y no se limita a las muy graves: también cuentan las graves."
  citation: "art. 7.1.d) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q123
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave el incumplimiento injustificado de la jornada de trabajo que, acumulado, suponga un mínimo de:"
  options:
  - id: a
    text:
      es: "Cinco horas al mes."
  - id: b
    text:
      es: "Diez horas al trimestre."
  - id: c
    text:
      es: "Quince horas al mes."
  - id: d
    correct: true
    text:
      es: "Diez horas al mes."
  explanation:
    es: "La letra l) del artículo 7.1 fija el umbral en «un mínimo de diez horas al mes». Cinco o quince horas no son la cifra del texto, y el período de referencia es el mes, no el trimestre."
  citation: "art. 7.1.l) RD 33/1986"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1986-1216-art-8
- id: m04-l06-q124
  prompt:
    es: "En marzo de 2027, un funcionario de un ministerio acumula seis horas de incumplimiento injustificado de su horario, sin otra circunstancia. Según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado:"
  options:
  - id: a
    text:
      es: "Comete falta grave, porque todo incumplimiento injustificado de la jornada lo es."
  - id: b
    correct: true
    text:
      es: "Comete falta leve, porque no llega al mínimo de la falta grave."
  - id: c
    text:
      es: "No comete falta, porque el incumplimiento no llega a diez horas en el mes."
  - id: d
    text:
      es: "Comete falta muy grave, porque equivale al abandono del servicio público."
  explanation:
    es: "El incumplimiento injustificado de la jornada es falta grave cuando suma al menos diez horas al mes (artículo 7.1.l). Seis horas no llegan. Entonces se aplica la letra a) del artículo 8: es falta leve «el incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave». No queda sin falta por no llegar a diez horas. Tampoco equivale al abandono del servicio."
  citation: "art. 8.a) RD 33/1986"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q125
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave la tercera falta injustificada de asistencia:"
  options:
  - id: a
    correct: true
    text:
      es: "En un período de tres meses, cuando las dos anteriores hubieran sido sancionadas como falta leve."
  - id: b
    text:
      es: "En un período de seis meses, cuando las dos anteriores fueran sancionadas como falta leve."
  - id: c
    text:
      es: "En un período de tres meses, aunque las dos anteriores no hubieran sido sancionadas."
  - id: d
    text:
      es: "En un período de un año, cuando las dos anteriores hubieran sido sancionadas como falta grave."
  explanation:
    es: "La letra m) del artículo 7.1 pide la tercera falta de asistencia injustificada «en un período de tres meses, cuando las dos anteriores hubieren sido objeto de sanción por falta leve». El período no es de seis meses ni de un año. Las dos faltas anteriores tienen que haber sido sancionadas, y como leves, no como graves."
  citation: "art. 7.1.m) RD 33/1986"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q126
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, son falta grave las conductas constitutivas de delito:"
  options:
  - id: a
    correct: true
    text:
      es: "Doloso, relacionadas con el servicio o que causen daño a la Administración o a los administrados."
  - id: b
    text:
      es: "Doloso o culposo, cualquiera que sea su relación con el servicio o el daño causado."
  - id: c
    text:
      es: "Culposo, cuando causen un daño grave a la Administración o a los administrados."
  - id: d
    text:
      es: "Doloso, solo cuando hayan sido declaradas en una sentencia firme de condena."
  explanation:
    es: "La letra c) del artículo 7.1 habla de conductas constitutivas de delito doloso «relacionadas con el servicio o que causen daño a la Administración o a los administrados». El delito culposo no figura. Hace falta esa relación con el servicio o ese daño. El precepto no exige una sentencia firme de condena."
  citation: "art. 7.1.c) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
