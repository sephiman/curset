# anchor: boe-a-1989-14441-art-2
- id: q20
  lesson: m05-l05
  prompt:
    es: "Con el sistema de anticipos de caja fija establecido en la Mutualidad, ¿puede tramitarse un libramiento aplicado al presupuesto a favor del proveedor por la factura de material de oficina?"
  options:
  - id: a
    text:
      es: "Sí, porque solo se prohíben los libramientos directos de importe superior a 5.000 euros."
  - id: b
    text:
      es: "Sí, porque el material de oficina no inventariable nunca puede pagarse con anticipo de caja fija."
  - id: c
    text:
      es: "No, porque todo pago inferior a 5.000 euros debe hacerse siempre con anticipo de caja fija."
  - id: d
    correct: true
    text:
      es: "No, porque no pueden tramitarse libramientos a perceptores directos por menos de 600 euros."
  explanation:
    es: "Cuando un organismo autónomo tiene establecido el sistema de anticipos de caja fija, no pueden tramitarse libramientos aplicados al presupuesto a favor de perceptores directos por importe inferior a 600 euros, salvo los de reposición del anticipo. La factura es de 480 euros, inferior a 600, y debe pagarse con el anticipo. Los 5.000 euros son el tope de cada pago con cargo al anticipo, no el límite de los libramientos directos. El material de oficina no inventariable sí se paga con anticipo, y entre 600 y 5.000 euros el libramiento directo sigue siendo posible."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
