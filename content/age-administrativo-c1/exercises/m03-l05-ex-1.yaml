# anchor: boe-a-2015-10565-art-1
- id: m03-l05-q001
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, esta Ley regula el procedimiento administrativo común a todas las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Excluido el sancionador, que se rige solo por la Ley de Régimen Jurídico del Sector Público."
  - id: b
    correct: true
    text:
      es: "Incluyendo el sancionador y el de reclamación de responsabilidad de las Administraciones Públicas."
  - id: c
    text:
      es: "Incluyendo el sancionador, pero no el de reclamación de responsabilidad patrimonial."
  - id: d
    text:
      es: "Excluidos el sancionador y el de reclamación de responsabilidad, que tienen leyes propias."
  explanation:
    es: "El artículo 1.1 incluye en el procedimiento común «el sancionador y el de reclamación de responsabilidad de las Administraciones Públicas». La opción que remite el sancionador solo a la Ley 40/2015 lo saca del procedimiento común, y la Ley 39/2015 lo incluye. La que excluye la reclamación de responsabilidad y la que excluye los dos procedimientos contradicen el mismo inciso."
  citation: "art. 1.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-4
- id: m03-l05-q002
  prompt:
    es: "De acuerdo con el artículo 4.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones que establezcan medidas que limiten el ejercicio de derechos deberán aplicar el principio de proporcionalidad y elegir:"
  options:
  - id: a
    correct: true
    text:
      es: "La medida menos restrictiva de entre las posibles."
  - id: b
    text:
      es: "La medida de mayor eficacia de entre las posibles."
  - id: c
    text:
      es: "La medida de menor coste de entre las posibles."
  - id: d
    text:
      es: "La medida de efecto más inmediato de entre las posibles."
  explanation:
    es: "El artículo 4.1 obliga a «aplicar el principio de proporcionalidad y elegir la medida menos restrictiva». La ley no manda elegir la medida más eficaz, la más barata ni la de efecto más rápido: el criterio es cuánto restringe el derecho o la actividad."
  citation: "art. 4.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-4
- id: m03-l05-q003
  prompt:
    es: "Según el artículo 4.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿para qué deben motivar su necesidad las medidas que exijan el cumplimiento de requisitos para el desarrollo de una actividad?"
  options:
  - id: a
    text:
      es: "Para la protección de la libre competencia."
  - id: b
    text:
      es: "Para la protección del equilibrio presupuestario."
  - id: c
    text:
      es: "Para la protección de los derechos de terceros."
  - id: d
    correct: true
    text:
      es: "Para la protección del interés público."
  explanation:
    es: "El artículo 4.1 exige «motivar su necesidad para la protección del interés público». La libre competencia, el equilibrio presupuestario y los derechos de terceros no son el fin que nombra el artículo: cambian la palabra «interés público» por otro objeto."
  citation: "art. 4.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-4
- id: m03-l05-q004
  prompt:
    es: "¿Cuál de las siguientes obligaciones impone la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público a las Administraciones que establezcan medidas que limiten el ejercicio de derechos?"
  options:
  - id: a
    text:
      es: "Someterlas a información pública durante veinte días."
  - id: b
    text:
      es: "Obtener el informe vinculante de la autoridad de competencia."
  - id: c
    text:
      es: "Limitar su vigencia a un plazo máximo de cuatro años."
  - id: d
    correct: true
    text:
      es: "Justificar su adecuación para lograr los fines que se persiguen."
  explanation:
    es: "El artículo 4.1 obliga a «justificar su adecuación para lograr los fines que se persiguen». No exige información pública por veinte días, ni el informe vinculante de una autoridad de competencia, ni un límite de cuatro años de vigencia: ninguna de esas tres obligaciones aparece en el artículo."
  citation: "art. 4.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q006
  prompt:
    es: "De acuerdo con el artículo 69.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la declaración responsable es el documento suscrito por un interesado en el que manifiesta, bajo su responsabilidad:"
  options:
  - id: a
    text:
      es: "Que cumple los requisitos de la normativa vigente y que acompaña a la declaración toda la documentación que lo acredita, sin la cual el documento no producirá efecto alguno ante la Administración."
  - id: b
    text:
      es: "Sus datos identificativos y cualquier otro dato relevante para el inicio de una actividad o para el ejercicio de un derecho ante la Administración Pública competente."
  - id: c
    correct: true
    text:
      es: "Que cumple los requisitos de la normativa vigente, que dispone de la documentación que lo acredita y que la pondrá a disposición de la Administración cuando le sea requerida."
  - id: d
    text:
      es: "Que cumplirá los requisitos de la normativa vigente dentro del plazo que le fije la Administración competente una vez que haya comprobado el contenido del documento presentado."
  explanation:
    es: "El artículo 69.1 define la declaración responsable como el documento en que el interesado manifiesta que cumple los requisitos de la normativa vigente, «que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida». No tiene que acompañar la documentación: basta con disponer de ella. Poner en conocimiento datos identificativos es la comunicación del artículo 69.2. Y lo que se declara es que ya cumple los requisitos, no que los cumplirá en un plazo."
  citation: "art. 69.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q007
  prompt:
    es: "¿Durante qué periodo se compromete quien suscribe una declaración responsable a mantener el cumplimiento de lo declarado, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Durante el periodo de tiempo inherente al reconocimiento o ejercicio del derecho."
  - id: b
    text:
      es: "Durante el plazo de un año contado desde la presentación de la declaración."
  - id: c
    text:
      es: "Hasta que la Administración compruebe lo declarado y dicte la resolución."
  - id: d
    text:
      es: "Durante los cuatro años que dura el plazo de prescripción de sus obligaciones."
  explanation:
    es: "Según el artículo 69.1, el interesado «se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio». El artículo no fija un año ni cuatro años. Tampoco limita el compromiso al tiempo que tarde la Administración en comprobar: la declaración responsable no espera ninguna resolución."
  citation: "art. 69.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q008
  prompt:
    es: "¿Qué manifiesta sobre la documentación acreditativa quien suscribe una declaración responsable, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Que la presenta junto con la declaración en el registro electrónico de la Administración."
  - id: b
    text:
      es: "Que la presentará ante la Administración competente dentro de los diez días siguientes a la declaración."
  - id: c
    correct: true
    text:
      es: "Que dispone de ella y que la pondrá a disposición de la Administración cuando le sea requerida."
  - id: d
    text:
      es: "Que la conservará durante cuatro años sin obligación de mostrarla a la Administración."
  explanation:
    es: "El artículo 69.1 recoge que el interesado manifiesta «que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida». No la presenta con la declaración ni en un plazo de diez días: la aporta cuando se le pide. Y no puede negarse a mostrarla, porque se compromete justo a lo contrario."
  citation: "art. 69.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q009
  prompt:
    es: "¿Cómo denomina la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas el documento suscrito por un interesado en el que manifiesta, bajo su responsabilidad, que cumple los requisitos de la normativa vigente?"
  options:
  - id: a
    correct: true
    text:
      es: "La declaración responsable del interesado."
  - id: b
    text:
      es: "La comunicación dirigida a la Administración."
  - id: c
    text:
      es: "La solicitud de iniciación del procedimiento."
  - id: d
    text:
      es: "La licencia o autorización administrativa previa."
  explanation:
    es: "El artículo 69.1 llama declaración responsable al documento en que el interesado «manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente». La comunicación del artículo 69.2 pone en conocimiento datos, no afirma el cumplimiento de requisitos. La solicitud de iniciación pide algo a la Administración. La licencia o autorización la otorga la Administración, no la firma el interesado."
  citation: "art. 69.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q010
  prompt:
    es: "De acuerdo con el artículo 69.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se entiende por comunicación el documento mediante el que los interesados ponen en conocimiento de la Administración competente:"
  options:
  - id: a
    correct: true
    text:
      es: "Sus datos identificativos o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho."
  - id: b
    text:
      es: "Que cumplen todos los requisitos establecidos en la normativa vigente para el inicio de una actividad o el ejercicio de un derecho."
  - id: c
    text:
      es: "Su solicitud de autorización para iniciar una actividad, que se entenderá concedida si la Administración no resuelve en plazo."
  - id: d
    text:
      es: "Sus datos identificativos, para que la Administración autorice de forma expresa el inicio de la actividad."
  explanation:
    es: "El artículo 69.2 define la comunicación como el documento con el que los interesados ponen en conocimiento de la Administración «sus datos identificativos o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho». Manifestar que se cumplen los requisitos es la declaración responsable del artículo 69.1. La comunicación no es una solicitud de autorización ni espera una autorización expresa: permite iniciar la actividad desde su presentación (art. 69.3)."
  citation: "art. 69.2 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q011
  prompt:
    es: "De acuerdo con el artículo 69.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las declaraciones responsables y las comunicaciones permitirán el inicio de una actividad:"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el día de su presentación, sin perjuicio de las facultades de comprobación, control e inspección de la Administración."
  - id: b
    text:
      es: "Desde el día siguiente al de su presentación, salvo que la Administración se oponga de forma expresa y motivada dentro de ese mismo día."
  - id: c
    text:
      es: "Una vez transcurridos quince días desde su presentación sin que la Administración haya formulado ningún reparo."
  - id: d
    text:
      es: "Desde que la Administración competente haya comprobado la exactitud de todos los datos declarados o comunicados por el interesado."
  explanation:
    es: "El artículo 69.3 dice que permiten el inicio de una actividad «desde el día de su presentación, sin perjuicio de las facultades de comprobación, control e inspección». No hay que esperar al día siguiente ni quince días sin reparos. Tampoco hay que esperar a la comprobación de la Administración: la comprobación es posterior y no condiciona el inicio."
  citation: "art. 69.3 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q012
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los efectos de una declaración responsable es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Su presentación no impide a la Administración ejercer sus facultades de comprobación, control e inspección."
  - id: b
    text:
      es: "Su presentación agota las facultades de comprobación de la Administración sobre lo declarado."
  - id: c
    text:
      es: "Su presentación permite iniciar la actividad solo después de una inspección previa de la Administración."
  - id: d
    text:
      es: "Su presentación permite iniciar una actividad, pero no el reconocimiento o ejercicio de un derecho."
  explanation:
    es: "El artículo 69.3 da efectos a la declaración responsable desde su presentación «sin perjuicio de las facultades de comprobación, control e inspección que tengan atribuidas las Administraciones Públicas». Presentarla no agota esas facultades. La inspección no es previa: la actividad se inicia desde la presentación. Y el mismo apartado incluye el reconocimiento o ejercicio de un derecho junto al inicio de una actividad."
  citation: "art. 69.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-69
- id: m03-l05-q013
  prompt:
    es: "Según el artículo 69.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué documento puede presentarse en un plazo posterior al inicio de la actividad si la legislación correspondiente lo prevé expresamente?"
  options:
  - id: a
    correct: true
    text:
      es: "La comunicación, pero no la declaración responsable."
  - id: b
    text:
      es: "La declaración responsable, pero no la comunicación."
  - id: c
    text:
      es: "Tanto la declaración responsable como la comunicación."
  - id: d
    text:
      es: "Ninguno de los dos, que surten efectos solo desde su presentación."
  explanation:
    es: "El segundo párrafo del artículo 69.3 dice que «la comunicación podrá presentarse dentro de un plazo posterior al inicio de la actividad cuando la legislación correspondiente lo prevea expresamente». Ese párrafo nombra solo la comunicación: la declaración responsable no aparece en él. Por eso fallan la opción que se lo atribuye a la declaración responsable y la que lo extiende a las dos. La que lo niega para ambos documentos contradice el párrafo."
  citation: "art. 69.3 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10566-art-25
- id: m03-l05-q014
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la potestad sancionadora de las Administraciones Públicas se ejercerá cuando haya sido expresamente reconocida:"
  options:
  - id: a
    text:
      es: "Por una norma con rango de Ley o, en su defecto, por un real decreto del Consejo de Ministros."
  - id: b
    text:
      es: "Por una disposición de carácter general, de rango legal o reglamentario, publicada en el boletín oficial."
  - id: c
    text:
      es: "Por una norma con rango de Ley, sin necesidad de procedimiento cuando la infracción sea leve."
  - id: d
    correct: true
    text:
      es: "Por una norma con rango de Ley, con aplicación del procedimiento previsto para su ejercicio."
  explanation:
    es: "El artículo 25.1 exige que la potestad sancionadora haya sido «expresamente reconocida por una norma con rango de Ley, con aplicación del procedimiento previsto para su ejercicio». Un real decreto o cualquier disposición reglamentaria no basta para reconocerla. Y el procedimiento se aplica siempre: el artículo no exime a las infracciones leves."
  citation: "art. 25.1 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-25
- id: m03-l05-q015
  prompt:
    es: "Según el artículo 25.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿conforme a qué norma ejercen además la potestad sancionadora las Entidades Locales?"
  options:
  - id: a
    text:
      es: "Las ordenanzas fiscales que apruebe el Pleno de cada Entidad Local en el ejercicio de su autonomía."
  - id: b
    text:
      es: "La legislación sobre régimen local que apruebe cada Comunidad Autónoma en su territorio."
  - id: c
    correct: true
    text:
      es: "El título XI de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local."
  - id: d
    text:
      es: "El texto refundido de las disposiciones legales vigentes en materia de régimen local."
  explanation:
    es: "El artículo 25.1 añade que, «cuando se trate de Entidades Locales», la potestad se ejerce «de conformidad con lo dispuesto en el Título XI de la Ley 7/1985, de 2 de abril». No remite a las ordenanzas fiscales, a la legislación autonómica de régimen local ni al texto refundido de régimen local."
  citation: "art. 25.1 LRJSP"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-27
- id: m03-l05-q016
  prompt:
    es: "Sin perjuicio de lo dispuesto para la Administración Local, solo constituyen infracciones administrativas las vulneraciones del ordenamiento jurídico previstas como tales infracciones:"
  options:
  - id: a
    text:
      es: "Por una Ley o un reglamento, que las clasificarán en leves y graves."
  - id: b
    text:
      es: "Por un reglamento dictado con habilitación de una Ley, en leves y graves."
  - id: c
    text:
      es: "Por una Ley, que las clasificará en leves, menos graves y graves."
  - id: d
    correct: true
    text:
      es: "Por una Ley, que las clasificará en leves, graves y muy graves."
  explanation:
    es: "El artículo 27.1 de la Ley 40/2015 dice que «sólo constituyen infracciones administrativas las vulneraciones del ordenamiento jurídico previstas como tales infracciones por una Ley» y que la Ley las clasifica «en leves, graves y muy graves». Un reglamento no basta para prever una infracción: el artículo exige una Ley. La clase «menos graves» no existe en esta clasificación, y sin «muy graves» la lista queda incompleta."
  citation: "art. 27.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-27
- id: m03-l05-q017
  prompt:
    es: "Según el artículo 27.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de las siguientes NO es una de las clases en que la Ley clasificará las infracciones administrativas?"
  options:
  - id: a
    correct: true
    text:
      es: "Las infracciones calificadas como menos graves."
  - id: b
    text:
      es: "Las infracciones calificadas como leves."
  - id: c
    text:
      es: "Las infracciones calificadas como graves."
  - id: d
    text:
      es: "Las infracciones calificadas como muy graves."
  explanation:
    es: "El artículo 27.1 dispone que «las infracciones administrativas se clasificarán por la Ley en leves, graves y muy graves». Leves, graves y muy graves son las tres clases del artículo. La de «menos graves» no figura en él."
  citation: "art. 27.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-29
- id: m03-l05-q018
  prompt:
    es: "¿Cuál de los siguientes es uno de los criterios que la graduación de la sanción considerará especialmente, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "El grado de culpabilidad o la existencia de intencionalidad."
  - id: b
    text:
      es: "La capacidad económica del infractor al imponer la sanción."
  - id: c
    text:
      es: "La colaboración del infractor con el órgano instructor."
  - id: d
    text:
      es: "La trascendencia social que haya tenido la infracción."
  explanation:
    es: "El artículo 29.3.a) pone en primer lugar «el grado de culpabilidad o la existencia de intencionalidad». Los otros criterios del apartado son la continuidad o persistencia en la conducta, la naturaleza de los perjuicios y la reincidencia. La capacidad económica del infractor, su colaboración con el instructor y la trascendencia social de la infracción no están en la lista."
  citation: "art. 29.3 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-29
- id: m03-l05-q019
  prompt:
    es: "Según el artículo 29.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la graduación de la sanción considerará especialmente, junto al grado de culpabilidad, la naturaleza de los perjuicios y la reincidencia:"
  options:
  - id: a
    text:
      es: "La reparación voluntaria del daño causado."
  - id: b
    text:
      es: "El reconocimiento de la responsabilidad."
  - id: c
    correct: true
    text:
      es: "La continuidad o persistencia en la conducta infractora."
  - id: d
    text:
      es: "La situación económica y patrimonial del infractor."
  explanation:
    es: "El artículo 29.3.b) incluye «la continuidad o persistencia en la conducta infractora». La reparación voluntaria del daño y la situación económica del infractor no figuran entre los criterios. El reconocimiento de responsabilidad tiene otro efecto en la Ley 39/2015: permite resolver con la sanción que proceda y, si es solo pecuniaria, reducirla (art. 85 LPAC). No es un criterio de graduación del artículo 29.3."
  citation: "art. 29.3 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-29
- id: m03-l05-q020
  prompt:
    es: "Junto a la continuidad en la conducta infractora, ¿qué criterio relativo al daño considera especialmente la graduación de la sanción según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La cuantía del beneficio ilícito obtenido."
  - id: b
    correct: true
    text:
      es: "La naturaleza de los perjuicios causados."
  - id: c
    text:
      es: "El número de personas perjudicadas por la infracción."
  - id: d
    text:
      es: "La reparación de los perjuicios antes de resolver."
  explanation:
    es: "El artículo 29.3.c) recoge «la naturaleza de los perjuicios causados». El artículo atiende a la naturaleza del perjuicio, no al número de perjudicados ni a si se reparó antes de resolver. El beneficio ilícito obtenido no está entre los criterios del artículo 29.3."
  citation: "art. 29.3 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-29
- id: m03-l05-q021
  prompt:
    es: "De acuerdo con el artículo 29.3.d) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la reincidencia que considera la graduación de la sanción exige la comisión en el término de un año de:"
  options:
  - id: a
    text:
      es: "Más de una infracción de otra naturaleza, declarada por resolución firme en vía administrativa."
  - id: b
    correct: true
    text:
      es: "Más de una infracción de la misma naturaleza, declarada por resolución firme en vía administrativa."
  - id: c
    text:
      es: "Más de una infracción de la misma naturaleza, declarada por sentencia judicial firme."
  - id: d
    text:
      es: "Una infracción de la misma naturaleza, aunque la resolución que la declare no sea firme."
  explanation:
    es: "El artículo 29.3.d) define la reincidencia como la «comisión en el término de un año de más de una infracción de la misma naturaleza cuando así haya sido declarado por resolución firme en vía administrativa». No vale una infracción de otra naturaleza. La firmeza que se exige es en vía administrativa, no una sentencia judicial. Y la resolución tiene que ser firme."
  citation: "art. 29.3 LRJSP"
  difficulty: 3
  tags:
