# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q037
  prompt:
    es: "¿En los sucesores de quién es hereditaria la Corona de España, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "De S. M. Don Juan Carlos I de Borbón, legítimo heredero de la dinastía histórica."
  - id: b
    text:
      es: "De S. M. Don Alfonso XIII de Borbón, legítimo heredero de la dinastía histórica."
  - id: c
    text:
      es: "De S. M. Don Juan de Borbón, legítimo heredero de la dinastía histórica."
  - id: d
    text:
      es: "De los Reyes de la Casa de Borbón, según designación de las Cortes Generales."
  explanation:
    es: "El artículo 57.1 dice: «La Corona de España es hereditaria en los sucesores de S. M. Don Juan Carlos I de Borbón, legítimo heredero de la dinastía histórica». Ese nombre es el que lleva la frase, no el de Alfonso XIII ni el de Don Juan de Borbón. La designación por las Cortes Generales contradice el carácter hereditario: según el artículo 57.3, las Cortes solo proveen a la sucesión cuando se han extinguido todas las líneas llamadas en Derecho."
  citation: "art. 57.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q038
  prompt:
    es: "En el orden de sucesión al trono que fija la Constitución Española de 1978, ¿qué se prefiere dentro de la misma línea?"
  options:
  - id: a
    text:
      es: "Se prefiere la línea anterior a las posteriores."
  - id: b
    correct: true
    text:
      es: "Se prefiere el grado más próximo al más remoto."
  - id: c
    text:
      es: "Se prefiere el varón a la mujer."
  - id: d
    text:
      es: "Se prefiere la persona de más edad a la de menos."
  explanation:
    es: "El artículo 57.1 dice que la sucesión prefiere «en la misma línea, el grado más próximo al más remoto». El varón a la mujer es la regla «en el mismo grado». La persona de más edad es la regla «en el mismo sexo». La línea anterior a las posteriores es la primera regla, entre líneas distintas."
  citation: "art. 57.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q039
  prompt:
    es: "Conforme al artículo 57.2 de la Constitución Española de 1978, el Príncipe heredero tendrá la dignidad de Príncipe de Asturias:"
  options:
  - id: a
    text:
      es: "Desde que alcance la mayoría de edad y preste juramento ante las Cortes Generales."
  - id: b
    text:
      es: "Desde su proclamación por las Cortes Generales en sesión conjunta."
  - id: c
    text:
      es: "Desde su nacimiento, siempre que sea el primogénito varón del Rey."
  - id: d
    correct: true
    text:
      es: "Desde su nacimiento o desde que se produzca el hecho que origine el llamamiento."
  explanation:
    es: "El artículo 57.2 dice que el Príncipe heredero, «desde su nacimiento o desde que se produzca el hecho que origine el llamamiento», tendrá esa dignidad. No depende de la mayoría de edad ni del juramento, que se presta al alcanzarla (art. 61.2). Las Cortes no proclaman al Príncipe. El texto no exige ser primogénito varón."
  citation: "art. 57.2 CE"
  difficulty: 2
  tags:
  - "fecha"
  - "requisito"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q040
  prompt:
    es: "Extinguidas todas las líneas llamadas en Derecho, ¿quién provee a la sucesión en la Corona según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Cortes Generales, en la forma que más convenga a los intereses de España."
  - id: b
    text:
      es: "El Congreso de los Diputados, por mayoría absoluta."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta de su Presidente."
  - id: d
    text:
      es: "El pueblo español, mediante referéndum de todos los ciudadanos."
  explanation:
    es: "El artículo 57.3 dice: «Extinguidas todas las líneas llamadas en Derecho, las Cortes Generales proveerán a la sucesión en la Corona en la forma que más convenga a los intereses de España». Las Cortes Generales son el Congreso y el Senado juntos; el Congreso solo, con mayoría absoluta, no es el sujeto de esa frase. El Consejo de Ministros no figura como sujeto de la provisión. Un referéndum de todos los ciudadanos tampoco es el cauce: el sujeto de «proveerán» son las Cortes Generales."
  citation: "art. 57.3 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q041
  prompt:
    es: "Extinguidas todas las líneas llamadas en Derecho, las Cortes Generales proveerán a la sucesión en la Corona:"
  options:
  - id: a
    text:
      es: "En la forma que establezca una ley orgánica aprobada al efecto."
  - id: b
    text:
      es: "Mediante la elección de un Rey entre los parientes del último monarca."
  - id: c
    correct: true
    text:
      es: "En la forma que más convenga a los intereses de España."
  - id: d
    text:
      es: "En la forma que el último Rey haya dispuesto en su testamento."
  explanation:
    es: "El artículo 57.3 dice que las Cortes proveen a la sucesión «en la forma que más convenga a los intereses de España». La ley orgánica es la que resuelve las abdicaciones, renuncias y dudas del orden de sucesión (art. 57.5), otro supuesto. El texto no limita la elección a los parientes del último monarca ni remite a su testamento."
  citation: "art. 57.3 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q042
  prompt:
    es: "De acuerdo con el artículo 57.4 de la Constitución Española de 1978, quienes, teniendo derecho a la sucesión en el trono, contrajeren matrimonio contra la expresa prohibición del Rey y de las Cortes Generales:"
  options:
  - id: a
    text:
      es: "Quedarán excluidos de la sucesión, pero no sus descendientes."
  - id: b
    text:
      es: "Perderán su lugar en el orden de sucesión hasta que el matrimonio se disuelva."
  - id: c
    text:
      es: "Quedarán excluidos de la sucesión si las Cortes Generales lo ratifican después."
  - id: d
    correct: true
    text:
      es: "Quedarán excluidos de la sucesión a la Corona por sí y sus descendientes."
  explanation:
    es: "El artículo 57.4 dice que esas personas «quedarán excluidas en la sucesión a la Corona por sí y sus descendientes». La exclusión alcanza a los descendientes. No es temporal ni depende de que el matrimonio se disuelva. Tampoco necesita una ratificación posterior de las Cortes: la prohibición ya es suya y del Rey."
  citation: "art. 57.4 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q043
  prompt:
    es: "Según el artículo 57.4 de la Constitución Española de 1978, ¿de quién debe ser la prohibición expresa de matrimonio que excluye de la sucesión a quien tiene derecho a ella?"
  options:
  - id: a
    correct: true
    text:
      es: "Del Rey y de las Cortes Generales."
  - id: b
    text:
      es: "Del Rey, con el refrendo del Presidente del Gobierno."
  - id: c
    text:
      es: "De las Cortes Generales, a propuesta del Gobierno."
  - id: d
    text:
      es: "Del Rey o, en su defecto, del Congreso de los Diputados."
  explanation:
    es: "El artículo 57.4 habla del matrimonio contraído «contra la expresa prohibición del Rey y de las Cortes Generales». Hacen falta las dos voluntades. No basta la del Rey refrendada, ni la de las Cortes a propuesta del Gobierno. El Congreso no sustituye a las Cortes Generales."
  citation: "art. 57.4 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-57
- id: m01-l02-q044
  prompt:
    es: "¿Cuál de las siguientes cuestiones sobre la sucesión en la Corona se resuelve por una ley orgánica, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La provisión de la sucesión cuando se extingan todas las líneas llamadas en Derecho."
  - id: b
    text:
      es: "La exclusión de quienes se casen contra la prohibición del Rey y de las Cortes."
  - id: c
    text:
      es: "El orden regular de primogenitura y representación en la sucesión al trono."
  - id: d
    correct: true
    text:
      es: "Las abdicaciones y renuncias y cualquier duda de hecho o de derecho en el orden de sucesión."
  explanation:
    es: "El artículo 57.5 dice: «Las abdicaciones y renuncias y cualquier duda de hecho o de derecho que ocurra en el orden de sucesión a la Corona se resolverán por una ley orgánica». La extinción de las líneas la resuelven las Cortes Generales en la forma que más convenga (art. 57.3). La exclusión por matrimonio la fija la propia Constitución (art. 57.4), igual que el orden de primogenitura y representación (art. 57.1)."
  citation: "art. 57.5 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-58
- id: m01-l02-q045
  prompt:
    es: "¿Puede la Reina consorte o el consorte de la Reina asumir funciones constitucionales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "No, salvo lo dispuesto para la tutela del Rey menor."
  - id: b
    text:
      es: "Sí, por delegación expresa del Rey."
  - id: c
    correct: true
    text:
      es: "No, salvo lo dispuesto para la Regencia."
  - id: d
    text:
      es: "Sí, cuando las Cortes Generales lo autoricen."
  explanation:
    es: "El artículo 58 dice: «La Reina consorte o el consorte de la Reina no podrán asumir funciones constitucionales, salvo lo dispuesto para la Regencia». La salvedad es la Regencia, no la tutela. El texto no permite que asuman funciones por delegación del Rey ni por autorización de las Cortes."
  citation: "art. 58 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q046
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Constitución Española de 1978, cuando el Rey fuere menor de edad, entrará a ejercer inmediatamente la Regencia:"
  options:
  - id: a
    text:
      es: "El Príncipe heredero de la Corona, si fuere mayor de edad."
  - id: b
    text:
      es: "La persona que hubiese nombrado el Rey difunto en su testamento."
  - id: c
    text:
      es: "Una Regencia de una, tres o cinco personas nombrada por las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "El padre o la madre del Rey y, en su defecto, el pariente mayor de edad más próximo a suceder en la Corona."
  explanation:
    es: "El artículo 59.1 dice que en la minoría de edad del Rey ejerce la Regencia «el padre o la madre del Rey y, en su defecto, el pariente mayor de edad más próximo a suceder en la Corona». El Príncipe heredero mayor de edad es el Regente en la inhabilitación del Rey (art. 59.2). La persona nombrada en el testamento es el tutor (art. 60.1). La Regencia de una, tres o cinco personas es la que nombran las Cortes cuando no corresponde a nadie (art. 59.3)."
  citation: "art. 59.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q047
  prompt:
    es: "Según el artículo 59.2 de la Constitución Española de 1978, si el Rey se inhabilita y el Príncipe heredero no es mayor de edad, ¿cómo se procede?"
  options:
  - id: a
    correct: true
    text:
      es: "Como en la minoría de edad del Rey, hasta que el Príncipe heredero alcance la mayoría de edad."
  - id: b
    text:
      es: "Las Cortes Generales nombran una Regencia de una, tres o cinco personas."
  - id: c
    text:
      es: "El tutor del Príncipe heredero ejerce la Regencia hasta su mayoría de edad."
  - id: d
    text:
      es: "El Presidente del Gobierno asume las funciones del Rey hasta esa mayoría de edad."
  explanation:
    es: "El artículo 59.2 dice que, si el Príncipe heredero no es mayor de edad, «se procederá de la manera prevista en el apartado anterior, hasta que el Príncipe heredero alcance la mayoría de edad». El apartado anterior es el de la minoría de edad del Rey. La Regencia de las Cortes solo procede si no hay persona a quien corresponda (art. 59.3). El texto no da la Regencia al tutor del Príncipe ni al Presidente del Gobierno."
  citation: "art. 59.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q048
  prompt:
    es: "De acuerdo con el artículo 59.3 de la Constitución Española de 1978, si no hubiere ninguna persona a quien corresponda la Regencia, esta será nombrada por las Cortes Generales y se compondrá:"
  options:
  - id: a
    text:
      es: "De una, dos o tres personas."
  - id: b
    correct: true
    text:
      es: "De una, tres o cinco personas."
  - id: c
    text:
      es: "De tres o cinco personas."
  - id: d
    text:
      es: "De tres, cinco o siete personas."
  explanation:
    es: "El artículo 59.3 dice que esa Regencia «se compondrá de una, tres o cinco personas». Las demás opciones cambian las cifras: el texto admite una Regencia de una sola persona, y no prevé dos ni siete."
  citation: "art. 59.3 CE"
  difficulty: 1
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q049
  prompt:
    es: "Según el artículo 59.4 de la Constitución Española de 1978, ¿qué requisitos son precisos para ejercer la Regencia?"
  options:
  - id: a
    text:
      es: "Ser español de nacimiento y mayor de edad."
  - id: b
    correct: true
    text:
      es: "Ser español y mayor de edad."
  - id: c
    text:
      es: "Ser mayor de edad y pariente del Rey."
  - id: d
    text:
      es: "Ser español, mayor de edad y no ostentar cargo político."
  explanation:
    es: "El artículo 59.4 dice: «Para ejercer la Regencia es preciso ser español y mayor de edad». Ser español de nacimiento es requisito del tutor nombrado en testamento (art. 60.1), no del Regente. El parentesco no es requisito. La incompatibilidad con todo cargo político es de la tutela (art. 60.2)."
  citation: "art. 59.4 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q050
  prompt:
    es: "Conforme al artículo 59.5 de la Constitución Española de 1978, en cuanto al título por el que actúa y al nombre en que lo hace, la Regencia se ejercerá:"
  options:
  - id: a
    text:
      es: "Por delegación de las Cortes Generales y en nombre propio."
  - id: b
    correct: true
    text:
      es: "Por mandato constitucional y siempre en nombre del Rey."
  - id: c
    text:
      es: "Por mandato constitucional y en nombre de las Cortes Generales."
  - id: d
    text:
      es: "Por delegación del Rey y en nombre del Gobierno."
  explanation:
    es: "El artículo 59.5 dice: «La Regencia se ejercerá por mandato constitucional y siempre en nombre del Rey». No es una delegación de las Cortes ni del Rey. No se ejerce en nombre propio, de las Cortes ni del Gobierno."
  citation: "art. 59.5 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-12
- id: m01-l02-q051
  prompt:
    es: "Para ejercer la Regencia es preciso ser mayor de edad. ¿A qué edad son mayores de edad los españoles según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "A los dieciséis años cumplidos."
  - id: b
    correct: true
    text:
      es: "A los dieciocho años cumplidos."
  - id: c
    text:
      es: "A los veintiún años cumplidos."
  - id: d
    text:
      es: "A los veinticinco años cumplidos."
  explanation:
    es: "El artículo 12 dice: «Los españoles son mayores de edad a los dieciocho años». Dieciséis, veintiún y veinticinco años no son la mayoría de edad de la Constitución."
  citation: "art. 12 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
