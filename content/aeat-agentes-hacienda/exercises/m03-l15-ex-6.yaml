# anchor: boe-a-2006-20764-art-20
- id: m03-l15-q0127
  prompt:
    es: "Carmen Sanz obtiene en 2026 un rendimiento neto del trabajo de 15.000 euros y, además, 7.000 euros de rendimientos del capital inmobiliario. Ninguna de sus rentas es exenta. Conforme al artículo 20 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede aplicar la reducción por obtención de rendimientos del trabajo?"
  options:
  - id: a
    text:
      es: "No, porque su rendimiento neto del trabajo supera los 14.852 euros."
  - id: b
    correct: true
    text:
      es: "No, porque sus rentas distintas de las del trabajo superan los 6.500 euros."
  - id: c
    text:
      es: "Sí, porque su rendimiento neto del trabajo es inferior a 19.747,5 euros."
  - id: d
    text:
      es: "Sí, porque los rendimientos del capital inmobiliario no cuentan para el límite de 6.500 euros."
  explanation:
    es: "Con 7.000 euros de otras rentas no exentas se supera el límite de 6.500 euros, y la reducción no se aplica (art. 20 LIRPF). Estar por debajo de 19.747,5 no basta, y los rendimientos del capital cuentan como rentas distintas de las del trabajo. Los 14.852 euros solo delimitan el primer tramo."
  citation: "art. 20 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "reducción"
# anchor: boe-a-2006-20764-art-20
- id: m03-l15-q0128
  prompt:
    es: "Conforme al artículo 20 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el rendimiento neto del trabajo a efectos de la reducción por obtención de rendimientos del trabajo:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el resultante de minorar el rendimiento íntegro en los gastos de las letras a), b), c), d) y e) del artículo 19.2."
  - id: b
    text:
      es: "Es el resultante de minorar el rendimiento íntegro en los gastos de las letras a), b) y c) del artículo 19.2."
  - id: c
    text:
      es: "Es el resultante de minorar el rendimiento íntegro en los gastos del artículo 19.2 y en la reducción del artículo 18."
  - id: d
    text:
      es: "Es el resultante de minorar el rendimiento íntegro en todos los gastos del artículo 19.2, incluidos los otros gastos de la letra f)."
  explanation:
    es: "Para esta reducción, el neto excluye los otros gastos de la letra f): se minora solo por las letras a) a e) (art. 20 LIRPF). Incluir la f) lo reduciría de más, quedarse en a), b) y c) omite sindicatos y defensa jurídica, y la reducción del artículo 18 no se resta."
  citation: "art. 20 LIRPF"
  difficulty: 3
  tags:
  - "reducción"
  - "rendimiento neto"
# anchor: boe-a-2006-20764-art-20
- id: m03-l15-q0129
  prompt:
    es: "De acuerdo con el artículo 20 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el efecto de la reducción por obtención de rendimientos del trabajo en el rendimiento neto:"
  options:
  - id: a
    text:
      es: "El saldo resultante de aplicar la reducción puede ser negativo y compensarse con rendimientos de los cuatro años siguientes."
  - id: b
    correct: true
    text:
      es: "El saldo resultante de aplicar la reducción no puede ser negativo."
  - id: c
    text:
      es: "El saldo resultante de aplicar la reducción no puede ser inferior a 7.302 euros."
  - id: d
    text:
      es: "El saldo resultante de aplicar la reducción puede ser negativo y compensarse con otras rentas del período."
  explanation:
    es: "El saldo tras la reducción no puede ser negativo (art. 20 LIRPF), de modo que la reducción no genera pérdidas compensables ni con otras rentas ni con años posteriores. Y no hay un mínimo de 7.302 euros: esa cifra es la reducción máxima del primer tramo."
  citation: "art. 20 LIRPF"
  difficulty: 2
  tags:
  - "reducción"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0137
  prompt:
    es: "Según el artículo 17.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué naturaleza tiene la pensión de jubilación de un régimen público de la Seguridad Social cuando no resulta exenta?"
  options:
  - id: a
    correct: true
    text:
      es: "Son rendimientos del trabajo."
  - id: b
    text:
      es: "Son rendimientos del capital mobiliario."
  - id: c
    text:
      es: "Son rendimientos de actividades económicas."
  - id: d
    text:
      es: "Son ganancias patrimoniales."
  explanation:
    es: "Las pensiones de los regímenes públicos de la Seguridad Social tienen en todo caso la consideración de rendimientos del trabajo, sin perjuicio de las exenciones del artículo 7 (art. 17.2.a) LIRPF). No son capital mobiliario, ni ganancias patrimoniales, ni derivan de ordenar medios de producción."
  citation: "art. 17.2 LIRPF"
  difficulty: 1
  tags:
  - "rendimientos del trabajo"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0142
  prompt:
    es: "Según los artículos 17.1 y 7.n) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo tributa la prestación por desempleo que una persona cobra en pagos mensuales y no en la modalidad de pago único?"
  options:
  - id: a
    text:
      es: "Como renta exenta, porque toda prestación por desempleo está exenta."
  - id: b
    text:
      es: "Como rendimiento del capital mobiliario, porque deriva de una prestación pública."
  - id: c
    text:
      es: "Como ganancia patrimonial, porque no deriva de una actividad laboral actual."
  - id: d
    correct: true
    text:
      es: "Como rendimiento íntegro del trabajo, porque la exención de la letra n) solo alcanza al pago único."
  explanation:
    es: "Las prestaciones por desempleo son rendimientos íntegros del trabajo (art. 17.1.b) LIRPF). La exención del artículo 7.n) solo se aplica cuando se perciben en la modalidad de pago único y con el destino previsto, y no al cobro mensual. No son rendimientos del capital ni ganancias patrimoniales."
  citation: "art. 17.1 LIRPF"
  difficulty: 2
  tags:
  - "desempleo"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0235
  prompt:
    es: "¿Cómo se califica, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la retribución que percibe el administrador de una sociedad por el ejercicio de su cargo en el consejo de administración?"
  options:
  - id: a
    text:
      es: "Como ganancia patrimonial obtenida de la sociedad."
  - id: b
    text:
      es: "Como rendimiento del capital mobiliario por participación en fondos propios."
  - id: c
    text:
      es: "Como rendimiento de actividades económicas, en todo caso."
  - id: d
    correct: true
    text:
      es: "Como rendimiento del trabajo."
  explanation:
    es: "Las retribuciones de los administradores y miembros de los consejos de administración son rendimientos del trabajo (art. 17.2.e) LIRPF). No son capital mobiliario, que se reserva a la participación en fondos propios (art. 25.1), ni lo son de actividades económicas en todo caso, ni ganancia patrimonial."
  citation: "art. 17.2 LIRPF"
  difficulty: 1
  tags:
  - "rendimientos del trabajo"
  - "calificación"
# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0245
  prompt:
    es: "Según el artículo 18.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se computan, como regla general, los rendimientos íntegros del trabajo?"
  options:
  - id: a
    text:
      es: "En su totalidad, sin que sea posible aplicar reducción alguna a los rendimientos del trabajo."
  - id: b
    text:
      es: "Por el 50 por ciento de su importe, salvo que se perciban en especie."
  - id: c
    correct: true
    text:
      es: "En su totalidad, salvo que les resulte de aplicación alguno de los porcentajes de reducción del propio artículo 18."
  - id: d
    text:
      es: "Por el 70 por ciento de su importe, salvo que se imputen en un único período impositivo."
  explanation:
    es: "La regla general es computar los rendimientos íntegros en su totalidad, salvo que se aplique un porcentaje de reducción del artículo 18 (art. 18.1 LIRPF). No hay una reducción general del 30 ni del 50 por ciento, y sí existen reducciones, como la del 30 por ciento del apartado 2."
  citation: "art. 18.1 LIRPF"
  difficulty: 1
  tags:
  - "rendimientos del trabajo"
  - "reducción"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0246
  prompt:
    es: "Conforme al artículo 19.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué detracciones son gasto deducible del rendimiento del trabajo?"
  options:
  - id: a
    text:
      es: "Las detracciones por aportaciones a planes de pensiones."
  - id: b
    correct: true
    text:
      es: "Las detracciones por derechos pasivos."
  - id: c
    text:
      es: "Las detracciones por retenciones a cuenta del impuesto."
  - id: d
    text:
      es: "Las detracciones por cuotas de la comunidad de propietarios."
  explanation:
    es: "La letra b) permite deducir las detracciones por derechos pasivos (art. 19.2.b) LIRPF). Las retenciones son un pago a cuenta, no un gasto. Y los planes de pensiones y las cuotas de la comunidad de propietarios no figuran en la lista exclusiva."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "rendimiento neto"
  - "gastos deducibles"
# anchor: boe-a-2006-20764-art-20
- id: m03-l15-q0261
  prompt:
    es: "Víctor Ríos obtiene en 2026 un rendimiento neto del trabajo de 19.747,5 euros, calculado conforme al artículo 20, y no tiene otras rentas. Conforme al artículo 20 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede aplicar la reducción por obtención de rendimientos del trabajo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la reducción exige rendimientos netos del trabajo inferiores a 19.747,5 euros."
  - id: b
    text:
      es: "No, porque tiene rentas distintas de las del trabajo superiores a 6.500 euros."
  - id: c
    text:
      es: "Sí, porque la reducción se aplica a rendimientos netos de hasta 19.747,5 euros inclusive."
  - id: d
    text:
      es: "Sí, con la reducción fija de 7.302 euros anuales."
  explanation:
    es: "El requisito es que el rendimiento neto sea inferior a 19.747,5 euros, y Víctor llega exactamente a esa cifra, de modo que no se cumple (art. 20 LIRPF). La reducción fija de 7.302 euros es la del primer tramo, hasta 14.852. Y no tiene otras rentas, así que el límite de 6.500 euros no interviene."
  citation: "art. 20 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "reducción"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0264
  prompt:
    es: "De acuerdo con el artículo 43.1.1.º.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en el caso de utilización de una vivienda propiedad del pagador situada en un municipio sin valores catastrales revisados en los diez períodos anteriores, el rendimiento del trabajo en especie se valora en:"
  options:
  - id: a
    correct: true
    text:
      es: "el 10 por ciento del valor catastral."
  - id: b
    text:
      es: "el 20 por ciento del valor catastral."
  - id: c
    text:
      es: "el 5 por ciento del valor catastral."
  - id: d
    text:
      es: "el 3 por ciento del valor catastral."
  explanation:
    es: "La regla general para la vivienda propiedad del pagador es el 10 por ciento del valor catastral (art. 43.1.1.º.a) LIRPF). El 5 por ciento se reserva a los municipios con valores revisados recientemente. El 20 por ciento es el porcentaje anual de los vehículos, y el 3 por ciento no figura en este precepto."
  citation: "art. 43.1 LIRPF"
  difficulty: 1
  tags:
  - "especie"
  - "vivienda"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0270
  prompt:
    es: "¿Cuál de las siguientes rentas NO tiene la consideración de rendimiento del trabajo en todo caso, según el artículo 17.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las pensiones compensatorias recibidas del cónyuge."
  - id: b
    correct: true
    text:
      es: "Los dividendos y participaciones en los beneficios de cualquier tipo de entidad."
  - id: c
    text:
      es: "Las retribuciones de los administradores y miembros de los consejos de administración."
  - id: d
    text:
      es: "Las becas, sin perjuicio de lo dispuesto en el artículo 7."
  explanation:
    es: "Los dividendos y participaciones en beneficios son capital mobiliario (art. 25.1.a) LIRPF). Las retribuciones de administradores, las pensiones compensatorias del cónyuge y las becas figuran en la lista del artículo 17.2 como rendimientos del trabajo."
  citation: "art. 17.2 LIRPF"
  difficulty: 2
  tags:
  - "rendimientos del trabajo"
  - "negativa"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0271
  prompt:
    es: "¿Cuál de los siguientes gastos NO es deducible del rendimiento del trabajo, de acuerdo con el artículo 19.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las cotizaciones a la Seguridad Social."
  - id: b
    text:
      es: "Las detracciones por derechos pasivos."
  - id: c
    correct: true
    text:
      es: "Las cuotas satisfechas a un colegio profesional cuando la colegiación es voluntaria."
  - id: d
    text:
      es: "Las cotizaciones a los colegios de huérfanos o entidades similares."
  explanation:
    es: "Las cuotas de colegios profesionales solo son deducibles si la colegiación es obligatoria (art. 19.2.d) LIRPF), y no lo son si es voluntaria. Las cotizaciones a la Seguridad Social, las detracciones por derechos pasivos y las cotizaciones a los colegios de huérfanos figuran en las letras a), b) y c)."
  citation: "art. 19.2 LIRPF"
  difficulty: 2
  tags:
  - "gastos deducibles"
  - "negativa"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0274
  prompt:
    es: "¿Cuál de las siguientes rentas tiene en todo caso la consideración de rendimiento del trabajo, conforme al artículo 17.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Las becas, sin perjuicio de lo dispuesto en el artículo 7 de la propia Ley."
  - id: b
    text:
      es: "Las rentas del arrendamiento de un local urbano a un tercero no empresario."
  - id: c
    text:
      es: "Los intereses de cuentas abiertas por el contribuyente en entidades de crédito."
  - id: d
    text:
      es: "Las rentas obtenidas por la venta de un inmueble que ha sido de su propiedad."
  explanation:
    es: "El artículo 17.2.h) incluye las becas entre los rendimientos del trabajo, sin perjuicio de las que el artículo 7 declara exentas. Los intereses de cuentas son rendimientos del capital mobiliario por ser retribución de la cesión a terceros de capitales propios (art. 25.2). El arrendamiento de un local urbano es rendimiento del capital inmobiliario (art. 22.1). La renta de la venta de un inmueble tributa como ganancia o pérdida patrimonial, salvo que la Ley la califique como rendimiento (art. 21.1)."
  citation: "art. 17.2 LIRPF"
  difficulty: 1
  tags:
  - "rendimientos del trabajo"
  - "becas"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0276
  prompt:
    es: "En 2026, una empresa concede a Sergio Lara, empleado suyo, un préstamo de 20.000 euros durante todo el año, al 1 por ciento de interés anual. El interés legal del dinero fijado para 2026 es del 3,25 por ciento. De acuerdo con el artículo 43.1.1.º.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el valor del rendimiento del trabajo en especie de ese año?"
  options:
  - id: a
    text:
      es: "200 euros, porque se valora el interés que Sergio paga por el préstamo durante el año."
  - id: b
    correct: true
    text:
      es: "450 euros, porque se valora la diferencia entre el interés legal y el interés pagado."
  - id: c
    text:
      es: "850 euros, porque se valoran juntos el interés pagado y el interés legal del dinero."
  - id: d
    text:
      es: "650 euros, porque se valora el interés legal del dinero sobre el total del préstamo."
  explanation:
    es: "En los préstamos con tipos de interés inferiores al legal del dinero, la valoración es la diferencia entre el interés pagado y el interés legal del dinero vigente en el período (art. 43.1.1.º.c). El interés legal de 2026 es el 3,25 por ciento que fija la disposición adicional cuadragésima segunda, apartado Uno, de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para 2023, prorrogada. El interés legal es 20.000 × 3,25 % = 650 euros y el pagado es 20.000 × 1 % = 200 euros, de modo que la diferencia es 450 euros. Los 650 euros ignoran que Sergio ya paga interés. Los 200 euros son solo lo que paga. Los 850 euros suman las dos cifras en lugar de restarlas."
  citation: "art. 43.1.1.º LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "rentas en especie"
  - "préstamos"
# anchor: boe-a-2006-20764-art-19
- id: m03-l15-q0282
  prompt:
    es: "De acuerdo con el artículo 19.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el rendimiento neto del trabajo es:"
  options:
  - id: a
    text:
      es: "El resultado de disminuir el rendimiento íntegro en el importe de todos los gastos necesarios para su obtención, sea cual sea su naturaleza."
  - id: b
    correct: true
    text:
      es: "El resultado de disminuir el rendimiento íntegro en el importe de los gastos deducibles."
  - id: c
    text:
      es: "El resultado de disminuir el rendimiento íntegro en el importe de los gastos deducibles y de la reducción por obtención de rendimientos del trabajo."
  - id: d
    text:
      es: "El resultado de disminuir el rendimiento íntegro en la reducción del 30 por ciento, sin deducir ningún otro gasto."
  explanation:
    es: "El rendimiento neto del trabajo es el resultado de disminuir el rendimiento íntegro en el importe de los gastos deducibles (art. 19.1), que son exclusivamente los de la lista del artículo 19.2. La reducción por obtención de rendimientos del trabajo no forma parte del cálculo del neto: se aplica después, minorando ese rendimiento neto (art. 20). Los gastos necesarios para la obtención del rendimiento son la regla del capital inmobiliario (art. 23.1.a), no la del trabajo. La reducción del 30 por ciento actúa sobre el rendimiento íntegro con período de generación superior a dos años (art. 18.2) y no sustituye a los gastos deducibles."
  citation: "art. 19.1 LIRPF"
  difficulty: 2
  tags:
  - "rendimientos del trabajo"
  - "rendimiento neto"
# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0283
  prompt:
    es: "Señale la respuesta CORRECTA sobre la regla de los cinco períodos impositivos anteriores que limita la reducción del 30 por ciento del artículo 18.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se tienen en cuenta también, a estos efectos, los rendimientos derivados de la extinción de una relación laboral, común o especial."
  - id: b
    text:
      es: "Solo se tienen en cuenta, a estos efectos, los rendimientos derivados de la extinción de una relación laboral, común o especial."
  - id: c
    correct: true
    text:
      es: "No se tienen en cuenta, a estos efectos, los rendimientos derivados de la extinción de una relación laboral, común o especial."
  - id: d
    text:
      es: "No se tienen en cuenta, a estos efectos, los rendimientos de los tres períodos impositivos anteriores al de su exigibilidad."
  explanation:
    es: "Al comprobar si el contribuyente aplicó la reducción en los cinco períodos anteriores, no se tienen en cuenta los rendimientos derivados de la extinción de una relación laboral, común o especial (art. 18.2). Las opciones que los cuentan, sea todos o solo ellos, invierten la regla. El plazo es de cinco períodos y no de tres."
  citation: "art. 18.2 LIRPF"
  difficulty: 3
  tags:
  - "rendimientos del trabajo"
  - "reducción 30 por ciento"
