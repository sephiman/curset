variants:
# anchor: boe-a-2013-12887-art-2
- id: m01-l05-q0112
  prompt:
    es: "Señale en qué medida quedan sujetas las corporaciones de Derecho Público a las disposiciones del título I, conforme al artículo 2.1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "En todas sus actividades, sin distinción."
  - id: b
    correct: true
    text:
      es: "En lo relativo a sus actividades sujetas a Derecho Administrativo."
  - id: c
    text:
      es: "Solo cuando reciban subvenciones públicas."
  - id: d
    text:
      es: "Únicamente respecto de su organización interna."
  explanation:
    es: "El artículo 2.1.e) aplica el título I a las corporaciones de Derecho Público en lo relativo a sus actividades sujetas a Derecho Administrativo. No se les aplica en todas sus actividades. Tampoco depende de que reciban subvenciones, que es el criterio del artículo 3 para las entidades privadas, ni se limita a su organización interna."
  citation: "art. 2.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-2
- id: m01-l05-q0113
  prompt:
    es: "Conforme al artículo 2.1.g) de la Ley 19/2013, de 9 de diciembre, el título I se aplica a las sociedades mercantiles cuando la participación, directa o indirecta, de las entidades del artículo 2 en su capital social sea:"
  options:
  - id: a
    correct: true
    text:
      es: "Superior al 50 por 100."
  - id: b
    text:
      es: "Igual o superior al 25 por 100."
  - id: c
    text:
      es: "Superior al 75 por 100."
  - id: d
    text:
      es: "Del 100 por 100."
  explanation:
    es: "Entran en el ámbito del título I las sociedades mercantiles en cuyo capital social la participación directa o indirecta de las entidades del artículo 2 sea superior al 50 por 100. Un 25 por 100 o más no basta. Exigir más del 75 por 100 o el 100 por 100 es subir el umbral por encima del que fija la ley."
  citation: "art. 2.1.g) Ley 19/2013"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2013-12887-art-6
- id: m01-l05-q0115
  prompt:
    es: "¿Cuál de las siguientes opciones completa los datos que, junto a la identidad de los responsables de los órganos, incluye el organigrama de los sujetos del título I, según la Ley 19/2013, de 9 de diciembre?"
  options:
  - id: a
    text:
      es: "Retribución y régimen de incompatibilidades."
  - id: b
    text:
      es: "Domicilio y horario de atención al público."
  - id: c
    text:
      es: "Situación patrimonial y declaración de bienes."
  - id: d
    correct: true
    text:
      es: "Perfil y trayectoria profesional."
  explanation:
    es: "El organigrama debe identificar a los responsables de los diferentes órganos y su perfil y trayectoria profesional. La retribución es información económica del artículo 8, y la situación patrimonial no se exige en el organigrama. El domicilio y el horario de atención tampoco son datos que el artículo 6.1 pida."
  citation: "art. 6.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
  - "estructura"
# anchor: boe-a-2013-12887-art-9
- id: m01-l05-q0119
  prompt:
    es: "¿Cuál de los siguientes incumplimientos tiene la consideración de infracción grave a efectos disciplinarios, según el artículo 9.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La publicación de la información en formatos no reutilizables y sin metadatos descriptivos."
  - id: b
    text:
      es: "La resolución fuera de plazo de una única solicitud de acceso."
  - id: c
    text:
      es: "La falta de actualización puntual de un dato del organigrama."
  - id: d
    correct: true
    text:
      es: "El incumplimiento reiterado de las obligaciones de publicidad activa."
  explanation:
    es: "El artículo 9.3 considera infracción grave el incumplimiento reiterado de las obligaciones de publicidad activa, a efectos de aplicar a sus responsables el régimen disciplinario. Publicar en formatos no reutilizables es solo una preferencia del artículo 5.4, y una resolución tardía aislada o la falta de actualización de un dato no son un incumplimiento reiterado."
  citation: "art. 9.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2013-12887-art-15
- id: m01-l05-q0130
  prompt:
    es: "Conforme al artículo 15.1 de la Ley 19/2013, de 9 de diciembre, si la información incluyese datos genéticos o biométricos, el acceso solo se podrá autorizar con el consentimiento expreso del afectado o si estuviera amparado por:"
  options:
  - id: a
    correct: true
    text:
      es: "Una norma con rango de ley."
  - id: b
    text:
      es: "Una resolución del Consejo de Transparencia y Buen Gobierno."
  - id: c
    text:
      es: "Un informe favorable de la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "Una orden ministerial del departamento competente."
  explanation:
    es: "Para los datos genéticos o biométricos el artículo 15.1 exige el consentimiento expreso del afectado o el amparo de una norma con rango de ley. Ni una resolución del Consejo, ni un informe de la Agencia de Protección de Datos, ni una orden ministerial tienen rango de ley."
  citation: "art. 15.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-18
- id: m01-l05-q0135
  prompt:
    es: "De acuerdo con el artículo 18.1.c) de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, se inadmitirán a trámite las solicitudes relativas a información para cuya divulgación sea necesaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Una acción previa de reelaboración."
  - id: b
    text:
      es: "Una ponderación previa del interés público."
  - id: c
    text:
      es: "Una consulta previa a los terceros afectados."
  - id: d
    text:
      es: "Una autorización previa del Consejo de Transparencia y Buen Gobierno."
  explanation:
    es: "Se inadmite la solicitud si la divulgación exige una acción previa de reelaboración. La ponderación del interés público es el método del artículo 15.3 y la consulta a los terceros es un trámite del artículo 19.3: ninguna de las dos causa inadmisión. La autorización del Consejo no la exige la ley."
  citation: "art. 18.1.c) Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2013-12887-art-25
- id: m01-l05-q0145
  prompt:
    es: "Señale qué efecto tiene la aplicación del título II sobre la condición de cargo electo que pudieran ostentar los sujetos citados, conforme al artículo 25.3 de la Ley 19/2013, de 9 de diciembre:"
  options:
  - id: a
    correct: true
    text:
      es: "No la afecta en ningún caso."
  - id: b
    text:
      es: "La suspende mientras dure el procedimiento sancionador."
  - id: c
    text:
      es: "La extingue si se impone una sanción grave."
  - id: d
    text:
      es: "Exige la renuncia previa al cargo electo."
  explanation:
    es: "El artículo 25.3 dice que la aplicación del título II no afectará, en ningún caso, a la condición de cargo electo. No la suspende, no la extingue por una sanción grave ni exige renunciar a ella."
  citation: "art. 25.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-26
- id: m01-l05-q0146
  prompt:
    es: "De acuerdo con el artículo 26.2.b) de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, entre los principios de actuación está no aceptar para sí regalos que superen:"
  options:
  - id: a
    text:
      es: "Un valor de cien euros por ocasión."
  - id: b
    correct: true
    text:
      es: "Los usos habituales, sociales o de cortesía."
  - id: c
    text:
      es: "El límite que fije el Consejo de Ministros."
  - id: d
    text:
      es: "Los límites de la normativa de contratación pública."
  explanation:
    es: "El principio de actuación de la letra b).6.º prohíbe aceptar regalos que superen los usos habituales, sociales o de cortesía. La ley no fija una cifra en euros ni remite a un límite del Consejo de Ministros o a la normativa de contratación."
  citation: "art. 26.2.b) Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-27
- id: m01-l05-q0147
  prompt:
    es: "De acuerdo con el artículo 27 de la Ley 19/2013, de 9 de diciembre, el incumplimiento de las normas de incompatibilidades o de las que regulan las declaraciones de los altos cargos se sancionará:"
  options:
  - id: a
    text:
      es: "Siempre conforme al régimen disciplinario del título II de esta Ley."
  - id: b
    text:
      es: "Por el Consejo de Transparencia y Buen Gobierno en todas las Administraciones."
  - id: c
    text:
      es: "Como infracción grave en todo caso."
  - id: d
    correct: true
    text:
      es: "Conforme a la normativa en materia de conflictos de intereses de cada Administración."
  explanation:
    es: "El artículo 27 remite a la normativa de conflictos de intereses de la Administración General del Estado y, para las demás Administraciones, a su propia normativa. No aplica el título II de forma directa, no atribuye la sanción al Consejo y no califica la infracción como grave sin más."
  citation: "art. 27 Ley 19/2013"
  difficulty: 3
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-2013-12887-art-31
- id: m01-l05-q0160
  prompt:
    es: "Conforme al artículo 31.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en los procedimientos sancionadores contra altos cargos de la Administración General del Estado, la instrucción corresponde a:"
  options:
  - id: a
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  - id: b
    text:
      es: "La Abogacía del Estado."
  - id: c
    text:
      es: "La Inspección General de Servicios del departamento."
  - id: d
    correct: true
    text:
      es: "La Oficina de Conflictos de Intereses."
  explanation:
    es: "La instrucción corresponde a la Oficina de Conflictos de Intereses. El Consejo de Transparencia y Buen Gobierno puede instar el inicio del procedimiento, pero no lo instruye. La Abogacía del Estado y la Inspección General de Servicios no tienen esa función."
  citation: "art. 31.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2024-15944-art-17
- id: m01-l05-q0168
  prompt:
    es: "Conforme al artículo 17.1.f) del Real Decreto 615/2024, de 2 de julio, la vocalía de la Comisión que propone el Ministerio para la Transformación Digital y de la Función Pública es de un representante de la:"
  options:
  - id: a
    correct: true
    text:
      es: "Secretaría de Estado de Función Pública."
  - id: b
    text:
      es: "Secretaría de Estado de Presupuestos y Gastos."
  - id: c
    text:
      es: "Secretaría General de Administración Digital."
  - id: d
    text:
      es: "Subsecretaría del Ministerio para la Transformación Digital y de la Función Pública."
  explanation:
    es: "El Estatuto atribuye esa vocalía a un representante de la Secretaría de Estado de Función Pública. La Secretaría de Estado de Presupuestos y Gastos, la Secretaría General de Administración Digital y la Subsecretaría del propio Ministerio son otras unidades que el Estatuto no menciona para esa vocalía."
  citation: "art. 17.1.f) Estatuto RD 615/2024"
  difficulty: 3
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-2013-12887-art-38
- id: m01-l05-q0175
  prompt:
    es: "Según el artículo 38.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, entre las funciones que corresponden al Presidente del Consejo de Transparencia y Buen Gobierno está:"
  options:
  - id: a
    text:
      es: "Aprobar el Estatuto del Consejo."
  - id: b
    correct: true
    text:
      es: "Aprobar el anteproyecto de presupuesto."
  - id: c
    text:
      es: "Nombrar a los miembros de la Comisión."
  - id: d
    text:
      es: "Imponer las sanciones a los altos cargos."
  explanation:
    es: "Al Presidente le corresponde aprobar el anteproyecto de presupuesto. El Estatuto lo aprueba el Consejo de Ministros mediante Real Decreto, los miembros de la Comisión los nombra el Gobierno y las sanciones a los altos cargos las impone el Consejo de Ministros o el ministro competente, no el Presidente."
  citation: "art. 38.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
