# anchor: fuente-ms-excel-formulas-html
- id: m06-l05-q015
  prompt:
    es: "En una hoja de cálculo de Excel 365, con el estilo de referencia A1, ¿qué letra identifica a la última columna?"
  options:
  - id: a
    text:
      es: "IV"
  - id: b
    text:
      es: "ZZZ"
  - id: c
    correct: true
    text:
      es: "XFD"
  - id: d
    text:
      es: "XFA"
  explanation:
    es: "La página dice que el estilo A1 se refiere a las columnas con letras «de A a XFD, para un total de 16 384 columnas». IV, ZZZ y XFA no son la columna final de una hoja de Excel 365."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-formulas-html
- id: m06-l05-q016
  prompt:
    es: "¿Cuál de las siguientes cifras es el número de filas de una hoja de cálculo de Excel 365?"
  options:
  - id: a
    text:
      es: "65 536 filas"
  - id: b
    text:
      es: "16 384 filas"
  - id: c
    correct: true
    text:
      es: "1 048 576 filas"
  - id: d
    text:
      es: "1 000 000 filas"
  explanation:
    es: "Según la página, las filas se numeran «del 1 al 1 048 576». 16 384 es el número de columnas (de A a XFD); 65 536 y 1 000 000 no son el número de filas que da la página."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-formulas-html
- id: m06-l05-q017
  prompt:
    es: "En Excel 365, ¿cuántas columnas tiene una hoja de cálculo, de la columna A a la XFD?"
  options:
  - id: a
    text:
      es: "1 048 576 columnas"
  - id: b
    correct: true
    text:
      es: "16 384 columnas"
  - id: c
    text:
      es: "18 278 columnas"
  - id: d
    text:
      es: "16 000 columnas"
  explanation:
    es: "La página da «de A a XFD, para un total de 16 384 columnas». 1 048 576 es el número de filas; 18 278 y 16 000 no son el total de columnas que da la página."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 2
  tags:
