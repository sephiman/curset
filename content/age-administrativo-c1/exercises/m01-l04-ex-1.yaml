# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q001
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Jueces y Magistrados integrantes del poder judicial es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Son independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley."
  - id: b
    text:
      es: "Son independientes, inamovibles, inviolables y sometidos únicamente al imperio de la ley."
  - id: c
    text:
      es: "Pueden ser trasladados o jubilados por acuerdo del Gobierno, oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Pueden pertenecer a partidos políticos mientras se hallen en activo, pero no a sindicatos."
  explanation:
    es: "El artículo 117.1 CE dice que los Jueces y Magistrados son «independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley». Una opción cambia «responsables» por «inviolables», que es la nota que el artículo 56.3 CE da a la persona del Rey. La del traslado «por acuerdo del Gobierno» contradice el artículo 117.2 CE: solo pueden ser trasladados o jubilados por las causas y con las garantías previstas en la ley. La que admite partidos «pero no sindicatos» contradice el artículo 127.1 CE, que les prohíbe pertenecer a partidos políticos y también a sindicatos."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q002
  prompt:
    es: "Según el artículo 117 de la Constitución Española de 1978, ¿a qué están sometidos los Jueces y Magistrados integrantes del poder judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "Únicamente al imperio de la ley."
  - id: b
    text:
      es: "A la ley y a las instrucciones del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "A la ley y a las órdenes de los Presidentes de sus Tribunales."
  - id: d
    text:
      es: "A la ley y a las directrices de política judicial del Gobierno."
  explanation:
    es: "El artículo 117.1 CE los declara «sometidos únicamente al imperio de la ley». Las otras tres opciones añaden una segunda sujeción, al Consejo General del Poder Judicial, a los Presidentes de los Tribunales o al Gobierno, y el adverbio «únicamente» las excluye. El Consejo es el órgano de gobierno del Poder Judicial (art. 122.2 CE), pero no dicta a los jueces cómo juzgar."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q003
  prompt:
    es: "Según la Constitución Española de 1978, que dedica su título VI al Poder Judicial, la justicia emana del pueblo y se administra:"
  options:
  - id: a
    correct: true
    text:
      es: "En nombre del Rey por Jueces y Magistrados integrantes del poder judicial."
  - id: b
    text:
      es: "En nombre del pueblo por Jueces y Magistrados integrantes del poder judicial."
  - id: c
    text:
      es: "En nombre del Rey por el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "En nombre de las Cortes Generales por Jueces y Magistrados de carrera."
  explanation:
    es: "El artículo 117.1 CE dice que la justicia «emana del pueblo y se administra en nombre del Rey por Jueces y Magistrados integrantes del poder judicial». La opción «en nombre del pueblo» confunde de quién emana la justicia con en nombre de quién se administra. Otra opción pone al Consejo General del Poder Judicial, que es el órgano de gobierno del Poder Judicial (art. 122.2 CE) y no juzga. Otra opción cambia al Rey por las Cortes Generales."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q004
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, los Jueces y Magistrados no podrán ser separados, suspendidos, trasladados ni jubilados:"
  options:
  - id: a
    text:
      es: "Sino por acuerdo del Consejo General del Poder Judicial adoptado por tres quintos."
  - id: b
    text:
      es: "Sino por alguna de las causas previstas en el reglamento del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "Sino por sentencia firme del Tribunal Supremo dictada en única instancia."
  - id: d
    correct: true
    text:
      es: "Sino por alguna de las causas y con las garantías previstas en la ley."
  explanation:
    es: "El artículo 117.2 CE exige «alguna de las causas y con las garantías previstas en la ley». Una opción sustituye la ley por un acuerdo del Consejo con una mayoría que el artículo no menciona. Otra remite a un reglamento del Consejo, cuando la garantía es de ley. Otra inventa una sentencia del Tribunal Supremo como único cauce."
  citation: "art. 117.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q005
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, el ejercicio de la potestad jurisdiccional corresponde exclusivamente a los Juzgados y Tribunales:"
  options:
  - id: a
    text:
      es: "Determinados por el Consejo General del Poder Judicial, según las normas de competencia que este establezca."
  - id: b
    text:
      es: "Determinados por el Gobierno mediante real decreto, según las normas de competencia y procedimiento vigentes."
  - id: c
    text:
      es: "Determinados por los Estatutos de Autonomía en su respectivo ámbito territorial."
  - id: d
    correct: true
    text:
      es: "Determinados por las leyes, según las normas de competencia y procedimiento que las mismas establezcan."
  explanation:
    es: "El artículo 117.3 CE atribuye la potestad jurisdiccional «exclusivamente a los Juzgados y Tribunales determinados por las leyes, según las normas de competencia y procedimiento que las mismas establezcan». Dos opciones ponen la determinación en manos del Consejo General del Poder Judicial o del Gobierno, y otra en los Estatutos de Autonomía. El artículo reserva esa determinación a las leyes."
  citation: "art. 117.3 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q006
  prompt:
    es: "¿En qué consiste, según la Constitución Española de 1978, la potestad jurisdiccional que corresponde exclusivamente a los Juzgados y Tribunales?"
  options:
  - id: a
    correct: true
    text:
      es: "En juzgar y hacer ejecutar lo juzgado en todo tipo de procesos."
  - id: b
    text:
      es: "En juzgar en todo tipo de procesos, mientras la ejecución corresponde al Gobierno."
  - id: c
    text:
      es: "En juzgar y hacer ejecutar lo juzgado solo en los procesos penales."
  - id: d
    text:
      es: "En juzgar y proponer al Gobierno la ejecución de lo juzgado."
  explanation:
    es: "El artículo 117.3 CE habla de «la potestad jurisdiccional en todo tipo de procesos, juzgando y haciendo ejecutar lo juzgado». Dos opciones sacan la ejecución de los Juzgados y Tribunales y se la dan al Gobierno. Otra limita la potestad a los procesos penales, cuando el artículo dice «en todo tipo de procesos»."
  citation: "art. 117.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q007
  prompt:
    es: "Según el artículo 117 de la Constitución Española de 1978, ¿qué principio es la base de la organización y funcionamiento de los Tribunales?"
  options:
  - id: a
    correct: true
    text:
      es: "El principio de unidad jurisdiccional."
  - id: b
    text:
      es: "El principio de unidad de actuación."
  - id: c
    text:
      es: "El principio de dependencia jerárquica."
  - id: d
    text:
      es: "El principio de especialización jurisdiccional."
  explanation:
    es: "El artículo 117.5 CE dice: «El principio de unidad jurisdiccional es la base de la organización y funcionamiento de los Tribunales». La unidad de actuación y la dependencia jerárquica son los principios con los que el Ministerio Fiscal ejerce sus funciones (art. 124.2 CE). La especialización jurisdiccional no aparece en el artículo 117."
  citation: "art. 117.5 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q008
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, la ley regulará el ejercicio de la jurisdicción militar:"
  options:
  - id: a
    correct: true
    text:
      es: "En el ámbito estrictamente castrense y en los supuestos de estado de sitio."
  - id: b
    text:
      es: "En el ámbito estrictamente castrense y en los supuestos de estado de excepción y de sitio."
  - id: c
    text:
      es: "En el ámbito castrense y en los supuestos de estado de alarma, de excepción y de sitio."
  - id: d
    text:
      es: "Únicamente en tiempo de guerra y en los supuestos de estado de sitio."
  explanation:
    es: "El artículo 117.5 CE limita la jurisdicción militar al «ámbito estrictamente castrense» y a «los supuestos de estado de sitio». Una opción añade el estado de excepción y otra, además, el de alarma. Otra sustituye el ámbito castrense por el tiempo de guerra."
  citation: "art. 117.5 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q009
  prompt:
    es: "En la organización de la justicia que establece el texto constitucional vigente, los Tribunales de excepción:"
  options:
  - id: a
    text:
      es: "Pueden crearse por ley orgánica durante el estado de sitio."
  - id: b
    correct: true
    text:
      es: "Están prohibidos por la Constitución."
  - id: c
    text:
      es: "Pueden crearse por ley orgánica con autorización del Congreso."
  - id: d
    text:
      es: "Forman parte de la jurisdicción militar en el ámbito castrense."
  explanation:
    es: "El artículo 117.6 CE es tajante: «Se prohíben los Tribunales de excepción». No hay supuesto en que puedan crearse, ni durante el estado de sitio ni con autorización del Congreso. La jurisdicción militar es otra cosa: la regula la ley en el ámbito estrictamente castrense y en el estado de sitio (art. 117.5 CE), y no es un tribunal de excepción."
  citation: "art. 117.6 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-119
- id: m01-l04-q010
  prompt:
    es: "Según el artículo 119 de la Constitución Española de 1978, ¿cuándo será gratuita la justicia?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando así lo disponga la ley y, en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar."
  - id: b
    text:
      es: "Siempre, en todo tipo de procesos y para todas las personas que litiguen."
  - id: c
    text:
      es: "Solo respecto de quienes acrediten insuficiencia de recursos para litigar."
  - id: d
    text:
      es: "Cuando así lo acuerde el Consejo General del Poder Judicial para cada orden jurisdiccional."
  explanation:
    es: "El artículo 119 CE dice: «La justicia será gratuita cuando así lo disponga la ley y, en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar». Una opción la hace gratuita siempre. Otra se queda con la segunda mitad y suprime los demás casos que disponga la ley. Otra deja la decisión al Consejo General del Poder Judicial, cuando el artículo la remite a la ley."
  citation: "art. 119 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-120
- id: m01-l04-q011
  prompt:
    es: "De acuerdo con el artículo 120 de la Constitución Española de 1978, que regula las actuaciones judiciales, las sentencias:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán siempre motivadas y se pronunciarán en audiencia pública."
  - id: b
    text:
      es: "Serán motivadas cuando lo exija la ley y se pronunciarán en audiencia pública."
  - id: c
    text:
      es: "Serán siempre motivadas y se notificarán por escrito, sin audiencia pública."
  - id: d
    text:
      es: "Serán siempre motivadas y se pronunciarán en audiencia reservada a las partes."
  explanation:
    es: "El artículo 120.3 CE dice: «Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública». Una opción convierte la motivación en algo que depende de la ley, cuando el artículo dice «siempre». Otras dos suprimen la audiencia pública o la reservan a las partes."
  citation: "art. 120.3 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-121
- id: m01-l04-q012
  prompt:
    es: "¿A cargo de quién corre, según la Constitución Española de 1978, la indemnización de los daños causados por error judicial?"
  options:
  - id: a
    text:
      es: "A cargo del Juez o Magistrado que haya causado el daño."
  - id: b
    text:
      es: "A cargo del Consejo General del Poder Judicial, con cargo a su presupuesto."
  - id: c
    correct: true
    text:
      es: "A cargo del Estado, conforme a la ley."
  - id: d
    text:
      es: "A cargo de la Comunidad Autónoma con competencias asumidas en materia de Justicia."
  explanation:
    es: "El artículo 121 CE dice que los daños causados por error judicial y los debidos al funcionamiento anormal de la Administración de Justicia «darán derecho a una indemnización a cargo del Estado, conforme a la ley». No la paga el juez, ni el Consejo General del Poder Judicial, ni la Comunidad Autónoma."
  citation: "art. 121 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-124
- id: m01-l04-q013
  prompt:
    es: "¿Qué misión atribuye la Constitución Española de 1978 al Ministerio Fiscal, sin perjuicio de las funciones encomendadas a otros órganos?"
  options:
  - id: a
    text:
      es: "Gobernar el poder judicial, en particular en materia de nombramientos, ascensos, inspección y régimen disciplinario."
  - id: b
    correct: true
    text:
      es: "Promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley."
  - id: c
    text:
      es: "Juzgar y hacer ejecutar lo juzgado en defensa de la legalidad y del interés público tutelado por la ley."
  - id: d
    text:
      es: "Defender los derechos fundamentales supervisando la actividad de la Administración y dando cuenta a las Cortes."
  explanation:
    es: "El artículo 124.1 CE da al Ministerio Fiscal la misión de «promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley». La opción de «gobernar el poder judicial» describe las funciones del Consejo General del Poder Judicial (art. 122.2 CE). La de «juzgar y hacer ejecutar lo juzgado» es la potestad jurisdiccional, que corresponde a los Juzgados y Tribunales (art. 117.3 CE). La que habla de supervisar «la actividad de la Administración» describe al Defensor del Pueblo (art. 54 CE)."
  citation: "art. 124.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-124
- id: m01-l04-q014
  prompt:
    es: "De acuerdo con el artículo 124 de la Constitución Española de 1978, el Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno:"
  options:
  - id: a
    text:
      es: "Previo informe favorable del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "Oído el Pleno del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Previa aprobación del Congreso de los Diputados por mayoría absoluta."
  explanation:
    es: "El artículo 124.4 CE dice: «El Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial». Una opción convierte la audiencia en un informe favorable, que vincularía al Gobierno. Otra cambia el órgano oído por el Consejo de Estado. Otra añade una aprobación del Congreso que el artículo no prevé."
  citation: "art. 124.4 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-127
- id: m01-l04-q015
  prompt:
    es: "De acuerdo con el artículo 127 de la Constitución Española de 1978, los Jueces y Magistrados, así como los Fiscales, mientras se hallen en activo:"
  options:
  - id: a
    text:
      es: "No podrán pertenecer a partidos políticos, pero sí afiliarse a sindicatos de su elección."
  - id: b
    text:
      es: "No podrán desempeñar otros cargos públicos, salvo los de elección popular en el ámbito local."
  - id: c
    text:
      es: "Podrán pertenecer a partidos políticos, pero no desempeñar cargos directivos en ellos."
  - id: d
    correct: true
    text:
      es: "No podrán desempeñar otros cargos públicos, ni pertenecer a partidos políticos o sindicatos."
  explanation:
    es: "El artículo 127.1 CE dice que, mientras se hallen en activo, «no podrán desempeñar otros cargos públicos, ni pertenecer a partidos políticos o sindicatos». Una opción permite la afiliación sindical y otra la afiliación a partidos, ambas prohibidas. Otra más inventa una excepción para cargos locales de elección popular."
  citation: "art. 127.1 CE"
  difficulty: 2
  tags:
  - "requisito"
