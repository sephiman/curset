    text:
      es: "UNIRCADENAS"
  - id: d
    text:
      es: "CONCAT"
  explanation:
    es: "La página dice que DIVIDIRTEXTO es el inverso de la función TEXTJOIN, UNIRCADENAS en la lista de funciones de texto. «CONCAT»: CONCAT combina texto de varios rangos sin delimitador. «EXTRAE»: EXTRAE devuelve caracteres desde una posición. «TEXTODESPUES»: TEXTODESPUES devuelve el texto posterior a un carácter o cadena determinados."
