# anchor: boe-a-1997-25336-art-24
- id: m01-l05-q045
  prompt:
    es: "De acuerdo con el artículo 24.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los reglamentos se ordenarán según la siguiente jerarquía:"
  options:
  - id: a
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto acordado en el Consejo de Ministros; después, las de Real Decreto del Presidente; y por último, las Órdenes Ministeriales."
  - id: b
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto del Presidente del Gobierno; después, las Órdenes Ministeriales; y por último, los Reales Decretos acordados en Consejo de Ministros."
  - id: c
    text:
      es: "Primero, las disposiciones aprobadas por Orden Ministerial; después, las aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Primero, las disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros; después, las aprobadas por Orden Ministerial."
  explanation:
    es: "El artículo 24.2 fija dos escalones: «1.º Disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros» y «2.º Disposiciones aprobadas por Orden Ministerial». Los Reales Decretos del Presidente y los acordados en Consejo de Ministros comparten el primer escalón; ninguno está por encima del otro. Las Órdenes Ministeriales van siempre después de los Reales Decretos."
  citation: "art. 24.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-20
- id: m01-l05-q046
  prompt:
    es: "¿Cuál de las siguientes competencias puede delegarse según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Las competencias atribuidas directamente por la Constitución al Presidente del Gobierno."
  - id: b
    text:
      es: "Las competencias relativas al nombramiento y separación de los altos cargos atribuidas al Consejo de Ministros."
  - id: c
    text:
      es: "Las competencias atribuidas por una ley que prohíba expresamente la delegación."
  - id: d
    correct: true
    text:
      es: "Las funciones administrativas del Consejo de Ministros, en las Comisiones Delegadas, a propuesta del Presidente."
  explanation:
    es: "El artículo 20.2 dice que «son delegables a propuesta del Presidente del Gobierno las funciones administrativas del Consejo de Ministros en las Comisiones Delegadas del Gobierno». Las otras tres son las competencias que el artículo 20.3 declara no delegables «en ningún caso»: las atribuidas directamente por la Constitución, las de nombramiento y separación de altos cargos del Consejo de Ministros y las atribuidas por una ley que prohíba la delegación."
  citation: "art. 20.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-111
- id: m01-l05-q047
  prompt:
    es: "¿A qué puede dar lugar toda interpelación formulada en las Cámaras al Gobierno o a cualquiera de sus miembros?"
  options:
  - id: a
    text:
      es: "A una moción de censura, si la propone al menos la décima parte de los Diputados."
  - id: b
    text:
      es: "A una cuestión de confianza que debe plantear el Presidente del Gobierno."
  - id: c
    correct: true
    text:
      es: "A una moción en la que la Cámara manifieste su posición."
  - id: d
    text:
      es: "A una comparecencia obligatoria del Presidente del Gobierno ante el Pleno."
  explanation:
    es: "El artículo 111.2 dice: «Toda interpelación podrá dar lugar a una moción en la que la Cámara manifieste su posición». La moción de censura tiene sus propios requisitos (art. 113) y no nace de una interpelación. La cuestión de confianza la plantea el Presidente por decisión propia (art. 112), no como consecuencia de una interpelación. La Constitución no prevé una comparecencia obligatoria del Presidente tras cada interpelación."
  citation: "art. 111.2 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-112
- id: m01-l05-q048
  prompt:
    es: "¿Cuándo se entiende otorgada la confianza que el Presidente del Gobierno solicita al plantear una cuestión de confianza ante el Congreso?"
  options:
  - id: a
    text:
      es: "Cuando vota a favor de la misma la mayoría absoluta de los Diputados."
  - id: b
    text:
      es: "Cuando vota a favor de la misma la mayoría de tres quintos de los Diputados."
  - id: c
    text:
      es: "Cuando no vota en contra de la misma la mayoría absoluta de los Diputados."
  - id: d
    correct: true
    text:
      es: "Cuando vota a favor de la misma la mayoría simple de los Diputados."
  explanation:
    es: "El artículo 112 dice: «La confianza se entenderá otorgada cuando vote a favor de la misma la mayoría simple de los Diputados». La mayoría absoluta es la de la moción de censura (art. 113.1) y la de la primera votación de investidura (art. 99.3). Los tres quintos no se exigen aquí. No basta con que la mayoría absoluta no vote en contra: hacen falta más votos a favor que en contra."
  citation: "art. 112 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q049
  prompt:
    es: "Según el artículo 113.1 de la Constitución Española de 1978, ¿por qué mayoría puede el Congreso de los Diputados adoptar la moción de censura para exigir la responsabilidad política del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría absoluta del Congreso de los Diputados."
  - id: b
    text:
      es: "Por mayoría simple del Congreso de los Diputados."
  - id: c
    text:
      es: "Por mayoría de tres quintos del Congreso de los Diputados."
  - id: d
    text:
      es: "Por mayoría absoluta del Congreso y ratificación del Senado."
  explanation:
    es: "El artículo 113.1 dice que el Congreso puede exigir la responsabilidad política del Gobierno «mediante la adopción por mayoría absoluta de la moción de censura». La mayoría simple es la de la cuestión de confianza (art. 112). Los tres quintos no se exigen. El Senado no interviene en la moción de censura."
  citation: "art. 113.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q050
  prompt:
    es: "De acuerdo con el artículo 113.2 de la Constitución Española de 1978, la moción de censura contra el Gobierno:"
  options:
  - id: a
    correct: true
    text:
      es: "Deberá ser propuesta al menos por la décima parte de los Diputados, y habrá de incluir un candidato a la Presidencia del Gobierno."
  - id: b
    text:
      es: "Deberá ser propuesta al menos por la quinta parte de los Diputados, y habrá de incluir un candidato a la Presidencia del Gobierno."
  - id: c
    text:
      es: "Deberá ser propuesta al menos por la décima parte de los Diputados, sin necesidad de incluir un candidato a la Presidencia."
  - id: d
    text:
      es: "Deberá ser propuesta al menos por dos Grupos parlamentarios, y habrá de incluir un candidato a la Presidencia del Gobierno."
  explanation:
    es: "El artículo 113.2 dice que la moción «deberá ser propuesta al menos por la décima parte de los Diputados, y habrá de incluir un candidato a la Presidencia del Gobierno». No es la quinta parte. El candidato es obligatorio. La Constitución cuenta Diputados, no Grupos parlamentarios."
  citation: "art. 113.2 CE"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q051
  prompt:
    es: "De acuerdo con el artículo 113.3 de la Constitución Española de 1978, la moción de censura no podrá ser votada hasta que transcurran:"
  options:
  - id: a
    text:
      es: "Tres días desde su presentación, y en el primer día podrán presentarse mociones alternativas."
  - id: b
    correct: true
    text:
      es: "Cinco días desde su presentación, y en los dos primeros días podrán presentarse mociones alternativas."
  - id: c
    text:
      es: "Cinco días desde su presentación, y no podrán presentarse mociones alternativas."
  - id: d
    text:
      es: "Siete días desde su presentación, y en los dos primeros días podrán presentarse mociones alternativas."
  explanation:
    es: "El artículo 113.3 dice que la moción «no podrá ser votada hasta que transcurran cinco días desde su presentación» y que «en los dos primeros días de dicho plazo podrán presentarse mociones alternativas». El plazo no es de tres ni de siete días. Las mociones alternativas sí se admiten."
  citation: "art. 113.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q052
  prompt:
    es: "¿En qué plazo pueden presentarse mociones alternativas a una moción de censura presentada en el Congreso de los Diputados?"
  options:
  - id: a
    text:
      es: "En los cinco días siguientes a su presentación, antes de que pueda ser votada."
  - id: b
    text:
      es: "En las cuarenta y ocho horas siguientes a la votación de la moción inicial."
  - id: c
    text:
      es: "En el primer día del plazo de tres días que debe transcurrir antes de su votación."
  - id: d
    correct: true
    text:
      es: "En los dos primeros días del plazo de cinco días que debe transcurrir antes de su votación."
  explanation:
    es: "El artículo 113.3 dice que la moción no podrá votarse hasta que transcurran cinco días desde su presentación y que «en los dos primeros días de dicho plazo podrán presentarse mociones alternativas». El plazo para las alternativas no es el de cinco días entero. No se presentan después de la votación. El plazo previo a la votación es de cinco días, no de tres."
  citation: "art. 113.3 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-113
- id: m01-l05-q053
  prompt:
    es: "Según el artículo 113.4 de la Constitución Española de 1978, ¿qué consecuencia tiene para sus signatarios que la moción de censura no sea aprobada por el Congreso?"
  options:
  - id: a
    text:
      es: "No podrán presentar otra durante el resto de la legislatura."
  - id: b
    correct: true
    text:
      es: "No podrán presentar otra durante el mismo período de sesiones."
  - id: c
    text:
      es: "No podrán presentar otra hasta que transcurra un año desde la votación."
  - id: d
    text:
      es: "No podrán presentar otra hasta que transcurran dos meses desde la votación."
  explanation:
    es: "El artículo 113.4 dice que, si la moción no fuere aprobada, «sus signatarios no podrán presentar otra durante el mismo período de sesiones». La limitación no dura toda la legislatura. El año es el plazo entre disoluciones (art. 115.3) y los dos meses son los de la investidura (art. 99.5)."
  citation: "art. 113.4 CE"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-1978-31229-art-115
- id: m01-l05-q055
  prompt:
    es: "La propuesta de disolución del Congreso, del Senado o de las Cortes Generales queda vedada al Presidente del Gobierno cuando:"
  options:
  - id: a
    text:
      es: "Esté en trámite una cuestión de confianza ante el Congreso."
  - id: b
    text:
      es: "Esté en trámite el Proyecto de Ley de Presupuestos Generales del Estado."
  - id: c
    text:
      es: "Falten menos de seis meses para el término de la legislatura."
  - id: d
    correct: true
    text:
      es: "Esté en trámite una moción de censura."
  explanation:
    es: "El artículo 115.2 dice: «La propuesta de disolución no podrá presentarse cuando esté en trámite una moción de censura». La Constitución no impide la disolución durante una cuestión de confianza ni durante la tramitación de los Presupuestos. Tampoco fija un límite por la proximidad del fin de la legislatura."
  citation: "art. 115.2 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-115
- id: m01-l05-q056
  prompt:
    es: "Fuera del caso de la investidura fallida, ¿cuándo puede proceder una nueva disolución de las Cámaras tras una disolución anterior?"
  options:
  - id: a
    text:
      es: "Cuando hayan transcurrido seis meses desde la anterior."
  - id: b
    correct: true
    text:
      es: "Cuando haya transcurrido un año desde la anterior."
  - id: c
    text:
      es: "Cuando hayan transcurrido dos años desde la anterior."
  - id: d
    text:
      es: "En cualquier momento, si lo autoriza el Congreso de los Diputados."
  explanation:
    es: "El artículo 115.3 dice: «No procederá nueva disolución antes de que transcurra un año desde la anterior, salvo lo dispuesto en el artículo 99, apartado 5». La investidura fallida del artículo 99.5 es la única salvedad. El plazo no es de seis meses ni de dos años. La autorización del Congreso no permite saltarse el año."
  citation: "art. 115.3 CE"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1978-31229-art-116
- id: m01-l05-q057
  prompt:
    es: "De acuerdo con el artículo 116.2 de la Constitución Española de 1978, el estado de alarma será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros:"
  options:
  - id: a
    correct: true
    text:
      es: "Por un plazo máximo de quince días, dando cuenta al Congreso de los Diputados, sin cuya autorización no podrá ser prorrogado."
  - id: b
    text:
      es: "Por un plazo máximo de treinta días, dando cuenta al Congreso de los Diputados, sin cuya autorización no podrá ser prorrogado."
  - id: c
    text:
      es: "Por un plazo máximo de quince días, previa autorización del Congreso de los Diputados, prorrogable por otro plazo igual."
  - id: d
    text:
      es: "Por un plazo máximo de quince días, dando cuenta a las Cortes Generales, que podrán prorrogarlo por mayoría absoluta."
  explanation:
    es: "El artículo 116.2 dice que el estado de alarma se declara «por un plazo máximo de quince días, dando cuenta al Congreso de los Diputados, reunido inmediatamente al efecto y sin cuya autorización no podrá ser prorrogado dicho plazo». Treinta días es el límite del estado de excepción (art. 116.3). La autorización previa del Congreso es propia del estado de excepción, no de la alarma. Se da cuenta al Congreso, no a las Cortes Generales."
  citation: "art. 116.2 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-116
- id: m01-l05-q058
  prompt:
    es: "Según el artículo 116.3 de la Constitución Española de 1978, ¿qué duración puede tener el estado de excepción declarado por el Gobierno?"
  options:
  - id: a
    text:
      es: "No podrá exceder de quince días, prorrogables por otro plazo igual, con los mismos requisitos."
  - id: b
    text:
      es: "No podrá exceder de treinta días, sin posibilidad de prórroga."
  - id: c
    correct: true
    text:
      es: "No podrá exceder de treinta días, prorrogables por otro plazo igual, con los mismos requisitos."
  - id: d
    text:
      es: "La que determine el Congreso de los Diputados, sin límite fijado en la Constitución."
  explanation:
    es: "El artículo 116.3 dice que la duración del estado de excepción «no podrá exceder de treinta días, prorrogables por otro plazo igual, con los mismos requisitos». Quince días es el plazo máximo del estado de alarma (art. 116.2). La prórroga sí está prevista. El Congreso determina la duración del estado de sitio (art. 116.4), no la del estado de excepción."
  citation: "art. 116.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-116
- id: m01-l05-q059
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de los estados de alarma, de excepción y de sitio es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El estado de alarma lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso."
  - id: b
    correct: true
    text:
      es: "El estado de excepción lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso."
  - id: c
    text:
      es: "El estado de sitio lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, dando cuenta al Congreso."
  - id: d
    text:
      es: "El estado de excepción lo declara el Congreso por mayoría absoluta, a propuesta exclusiva del Gobierno."
  explanation:
    es: "El artículo 116.3 dice que el estado de excepción «será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso de los Diputados». El estado de alarma no exige autorización previa: el Gobierno lo declara dando cuenta al Congreso (art. 116.2). El estado de sitio lo declara la mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno (art. 116.4), y esa no es la regla del estado de excepción."
  citation: "art. 116.3 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-116
- id: m01-l05-q060
  prompt:
    es: "¿Quién declara el estado de sitio y quién determina su ámbito territorial, duración y condiciones?"
  options:
  - id: a
    text:
      es: "Lo declara el Gobierno, previa autorización del Congreso por mayoría absoluta, y el Gobierno determina su ámbito, duración y condiciones."
  - id: b
    text:
      es: "Lo declara la mayoría absoluta de las Cortes Generales, a propuesta del Gobierno, y una ley orgánica fija su duración máxima."
  - id: c
    text:
      es: "Lo declara el Rey, a propuesta del Gobierno, y el Congreso determina su ámbito territorial, duración y condiciones."
  - id: d
    correct: true
    text:
      es: "Lo declara la mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno, y el Congreso determina su ámbito, duración y condiciones."
  explanation:
    es: "El artículo 116.4 dice que el estado de sitio «será declarado por la mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno» y que «el Congreso determinará su ámbito territorial, duración y condiciones». No lo declara el Gobierno ni el Rey. Interviene el Congreso, no las Cortes Generales, y es el Congreso quien fija su duración."
  citation: "art. 116.4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-116
- id: m01-l05-q061
  prompt:
    es: "Mientras esté declarado alguno de los estados de alarma, de excepción o de sitio, en relación con el Congreso de los Diputados:"
  options:
  - id: a
    text:
      es: "Solo podrá disolverse a propuesta del Presidente del Gobierno, previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Quedará suspendido su funcionamiento hasta que termine el estado declarado."
  - id: c
    correct: true
    text:
      es: "No podrá procederse a su disolución."
  - id: d
    text:
      es: "Sus competencias pasarán en todo caso a su Diputación Permanente."
  explanation:
    es: "El artículo 116.5 dice: «No podrá procederse a la disolución del Congreso mientras estén declarados algunos de los estados comprendidos en el presente artículo». La prohibición no admite propuesta del Presidente. Su funcionamiento no puede interrumpirse durante estos estados. La Diputación Permanente asume sus competencias solo si el Congreso está disuelto o ha expirado su mandato, no en todo caso."
  citation: "art. 116.5 CE"
  difficulty: 3
  tags:
  - "excepción"
