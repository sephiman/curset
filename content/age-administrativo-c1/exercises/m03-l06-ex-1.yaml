# anchor: boe-a-1978-31229-art-106
- id: m03-l06-q001
  prompt:
    es: "De acuerdo con el artículo 106.2 de la Constitución Española de 1978, los particulares tendrán derecho a ser indemnizados por toda lesión que sufran en cualquiera de sus bienes y derechos:"
  options:
  - id: a
    text:
      es: "Salvo en los supuestos de caso fortuito, siempre que la lesión sea consecuencia del funcionamiento de los servicios públicos."
  - id: b
    text:
      es: "Incluso en los casos de fuerza mayor, siempre que la lesión sea consecuencia del funcionamiento de los servicios públicos."
  - id: c
    correct: true
    text:
      es: "Salvo en los casos de fuerza mayor, siempre que la lesión sea consecuencia del funcionamiento de los servicios públicos."
  - id: d
    text:
      es: "Salvo en los casos de fuerza mayor, siempre que la lesión sea consecuencia de un acto administrativo declarado nulo."
  explanation:
    es: "El artículo 106.2 CE reconoce el derecho «salvo en los casos de fuerza mayor, siempre que la lesión sea consecuencia del funcionamiento de los servicios públicos». La opción del caso fortuito cambia la excepción que nombra la Constitución. La opción que incluye la fuerza mayor convierte la excepción en lo contrario. La opción del acto declarado nulo pone como causa algo que el artículo no exige: basta el funcionamiento de los servicios públicos."
  citation: "art. 106.2 CE"
  difficulty: 1
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q002
  prompt:
    es: "Conforme al artículo 32.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los particulares tendrán derecho a ser indemnizados de toda lesión que sufran en sus bienes y derechos siempre que sea consecuencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Del funcionamiento normal o anormal de los servicios públicos."
  - id: b
    text:
      es: "Únicamente del funcionamiento anormal de los servicios públicos."
  - id: c
    text:
      es: "Del funcionamiento anormal de los servicios públicos o de la fuerza mayor."
  - id: d
    text:
      es: "Del funcionamiento normal o anormal de cualquier entidad privada."
  explanation:
    es: "El artículo 32.1 LRJSP da derecho a indemnización cuando la lesión sea consecuencia «del funcionamiento normal o anormal de los servicios públicos». «Únicamente anormal» deja fuera el funcionamiento normal, que el apartado incluye. La fuerza mayor es la excepción expresa: el apartado dice «salvo en los casos de fuerza mayor». Una entidad privada no es el sujeto del apartado: indemnizan «las Administraciones Públicas correspondientes» por sus servicios públicos."
  citation: "art. 32.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q006
  prompt:
    es: "Según el artículo 32.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la lesión causada por actos legislativos de naturaleza no expropiatoria que no haya deber jurídico de soportar será indemnizable:"
  options:
  - id: a
    text:
      es: "En todo caso, en los términos que fije después el Consejo de Ministros mediante real decreto."
  - id: b
    text:
      es: "Cuando así lo declare el Tribunal Constitucional en la sentencia que resuelva sobre esos actos."
  - id: c
    text:
      es: "Cuando así lo proponga el Consejo de Estado en el dictamen emitido sobre la reclamación."
  - id: d
    correct: true
    text:
      es: "Cuando así se establezca en los propios actos legislativos y en los términos que en ellos se especifiquen."
  explanation:
    es: "El artículo 32.3 LRJSP reconoce ese derecho «cuando así se establezca en los propios actos legislativos y en los términos que en ellos se especifiquen». Ni el Consejo de Ministros, ni el Tribunal Constitucional, ni el dictamen del Consejo de Estado deciden si esa lesión se indemniza: lo decide el propio acto legislativo. Por eso fallan la opción del real decreto del Consejo de Ministros, la de la sentencia constitucional y la del dictamen."
  citation: "art. 32.3 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q007
  prompt:
    es: "¿Cuál de los siguientes pares de supuestos añade la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público a la responsabilidad del Estado legislador, siempre que concurran los requisitos generales?"
  options:
  - id: a
    correct: true
    text:
      es: "Daños por aplicar una norma con rango de ley declarada inconstitucional o una norma contraria al Derecho de la Unión Europea."
  - id: b
    text:
      es: "Daños por aplicar un reglamento declarado nulo por sentencia firme o una norma contraria al Derecho de la Unión Europea."
  - id: c
    text:
      es: "Daños por aplicar una norma con rango de ley declarada inconstitucional o un reglamento declarado nulo."
  - id: d
    text:
      es: "Daños por aplicar un decreto-ley que no haya sido convalidado o una norma con rango de ley declarada inconstitucional."
  explanation:
    es: "El artículo 32.3 LRJSP dice que la responsabilidad del Estado legislador podrá surgir también cuando los daños deriven «de la aplicación de una norma con rango de ley declarada inconstitucional» o «de la aplicación de una norma contraria al Derecho de la Unión Europea». El reglamento declarado nulo no es un acto del legislador y no figura entre esos supuestos, así que fallan las dos opciones que lo incluyen. El decreto-ley no convalidado tampoco está en la lista."
  citation: "art. 32.3 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q008
  prompt:
    es: "Según el artículo 32.8 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quién fija el importe de las indemnizaciones por el funcionamiento anormal declarado en la tramitación de un recurso de amparo?"
  options:
  - id: a
    text:
      es: "Corresponde fijarlo al Presidente del Gobierno."
  - id: b
    text:
      es: "Corresponde fijarlo a las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Corresponde fijarlo al Consejo de Ministros."
  - id: d
    text:
      es: "Corresponde fijarlo al Ministro de Hacienda."
  explanation:
    es: "El artículo 32.8 LRJSP dice: «El Consejo de Ministros fijará el importe de las indemnizaciones que proceda abonar». El Presidente del Gobierno, las Cortes Generales y el Ministro de Hacienda no tienen esa función en el artículo."
  citation: "art. 32.8 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q009
  prompt:
    es: "Según el artículo 32.8 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién se da audiencia en el procedimiento que fija las indemnizaciones por funcionamiento anormal en las cuestiones de inconstitucionalidad?"
  options:
  - id: a
    text:
      es: "Se da audiencia al Consejo General del Poder Judicial."
  - id: b
    text:
      es: "Se da audiencia al propio Tribunal Constitucional."
  - id: c
    text:
      es: "Se da audiencia a la Abogacía General del Estado."
  - id: d
    correct: true
    text:
      es: "Se da audiencia al Consejo de Estado."
  explanation:
    es: "El artículo 32.8 LRJSP dice que el procedimiento para fijar las indemnizaciones por el funcionamiento anormal declarado por el Tribunal Constitucional «se tramitará por el Ministerio de Justicia, con audiencia al Consejo de Estado». El Consejo General del Poder Judicial interviene en otra reclamación, la del funcionamiento anormal de la Administración de Justicia, según el artículo 81.3 LPAC. El Tribunal Constitucional es quien declara el funcionamiento anormal, a instancia de parte, y no es a quien se da audiencia. La Abogacía General del Estado no es el órgano que nombra el segundo párrafo: ese párrafo nombra al Consejo de Estado."
  citation: "art. 32.8 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q010
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el Consejo de Ministros fija el importe de las indemnizaciones cuando el Tribunal Constitucional haya declarado un funcionamiento anormal en la tramitación de:"
  options:
  - id: a
    text:
      es: "Los recursos de inconstitucionalidad o de los conflictos de competencia."
  - id: b
    correct: true
    text:
      es: "Los recursos de amparo o de las cuestiones de inconstitucionalidad."
  - id: c
    text:
      es: "Los recursos de amparo o de los conflictos entre órganos constitucionales."
  - id: d
    text:
      es: "Las cuestiones de inconstitucionalidad o de los conflictos de competencia."
  explanation:
    es: "El artículo 32.8 LRJSP se refiere al funcionamiento anormal «en la tramitación de los recursos de amparo o de las cuestiones de inconstitucionalidad». Los recursos de inconstitucionalidad, los conflictos de competencia y los conflictos entre órganos constitucionales son otros procesos del Tribunal Constitucional que el apartado no nombra. Cada distractor cambia al menos uno de los dos procesos."
  citation: "art. 32.8 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q011
  prompt:
    es: "¿Qué departamento nombra el artículo 32.8 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público para tramitar el procedimiento que fija las indemnizaciones por funcionamiento anormal en los recursos de amparo?"
  options:
  - id: a
    text:
      es: "El Ministerio del Interior, con audiencia al Consejo de Estado."
  - id: b
    text:
      es: "El Ministerio de Justicia, con audiencia al Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "El Ministerio de Justicia, con audiencia al Consejo de Estado."
  - id: d
    text:
      es: "El Ministerio de Política Territorial y Memoria Democrática, con audiencia al Consejo de Estado."
  explanation:
    es: "El artículo 32.8 LRJSP dice, con su redacción literal, que el procedimiento «se tramitará por el Ministerio de Justicia, con audiencia al Consejo de Estado». La opción del Ministerio del Interior y la del Ministerio de Política Territorial y Memoria Democrática cambian el departamento. La opción de la audiencia al Consejo de Ministros confunde el órgano que fija el importe con el que recibe audiencia."
  citation: "art. 32.8 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-32
- id: m03-l06-q012
  prompt:
    es: "Según el artículo 32.9 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, se sigue el procedimiento de la Ley 39/2015 para los daños a terceros durante la ejecución de contratos cuando sean consecuencia de:"
  options:
  - id: a
    correct: true
    text:
      es: "Una orden inmediata y directa de la Administración o de los vicios del proyecto elaborado por ella misma."
  - id: b
    text:
      es: "Una orden directa o indirecta de la Administración o de los vicios del proyecto elaborado por el contratista."
  - id: c
    text:
      es: "Cualquier operación que requiera la ejecución del contrato, aunque no medie orden de la Administración."
  - id: d
    text:
      es: "Una orden inmediata y directa de la Administración, pero no de los vicios del proyecto elaborado por ella."
  explanation:
    es: "El artículo 32.9 LRJSP se refiere a los daños que sean «consecuencia de una orden inmediata y directa de la Administración o de los vicios del proyecto elaborado por ella misma». La opción de la orden «directa o indirecta» y del proyecto del contratista cambia dos palabras del texto. La opción de cualquier operación de ejecución describe los daños que indemniza el contratista (art. 196.1 LCSP). La opción que excluye los vicios del proyecto suprime la segunda causa que el apartado recoge."
  citation: "art. 32.9 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-196
- id: m03-l06-q013
  prompt:
    es: "Según el artículo 196.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿de quién es la obligación de indemnizar los daños y perjuicios causados a terceros por las operaciones que requiera la ejecución del contrato?"
  options:
  - id: a
    correct: true
    text:
      es: "Es una obligación del contratista."
  - id: b
    text:
      es: "Es una obligación del órgano de contratación."
  - id: c
    text:
      es: "Es una obligación de la Administración contratante."
  - id: d
    text:
      es: "Es una obligación del responsable del contrato."
  explanation:
    es: "El artículo 196.1 LCSP dice: «Será obligación del contratista indemnizar todos los daños y perjuicios que se causen a terceros como consecuencia de las operaciones que requiera la ejecución del contrato». El órgano de contratación, la Administración contratante y el responsable del contrato no cargan con esa obligación general; la Administración solo responde en los casos del apartado 2."
  citation: "art. 196.1 LCSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2017-12902-art-196
- id: m03-l06-q014
  prompt:
    es: "Conforme al artículo 196.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando los daños a terceros en la ejecución del contrato se deban de forma inmediata y directa a una orden de la Administración:"
  options:
  - id: a
    text:
      es: "Responderá el contratista, que podrá repetir después contra la Administración."
  - id: b
    text:
      es: "Responderán la Administración y el contratista de forma solidaria."
  - id: c
    correct: true
    text:
      es: "Será esta responsable dentro de los límites señalados en las leyes."
  - id: d
    text:
      es: "Será responsable el contratista dentro de los límites señalados en las leyes."
  explanation:
    es: "El artículo 196.2 LCSP dice que, cuando los daños «hayan sido ocasionados como consecuencia inmediata y directa de una orden de la Administración, será esta responsable dentro de los límites señalados en las leyes». La opción del contratista que repite contra la Administración y la del contratista responsable dentro de los límites legales ponen la responsabilidad en quien el apartado la quita. La opción solidaria reparte entre los dos lo que el apartado atribuye solo a la Administración."
  citation: "art. 196.2 LCSP"
  difficulty: 2
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10566-art-35
- id: m03-l06-q015
  prompt:
    es: "Conforme al artículo 35 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, cuando las Administraciones actúen en relaciones de derecho privado, directamente o a través de una entidad privada, su responsabilidad se exigirá:"
  options:
  - id: a
    text:
      es: "Conforme a las normas del Código Civil sobre responsabilidad extracontractual, ante la jurisdicción civil."
  - id: b
    text:
      es: "Conforme al régimen de responsabilidad patrimonial de esa ley, salvo cuando concurra con sujetos privados."
  - id: c
    text:
      es: "Conforme al Derecho privado, salvo que la entidad a través de la cual actúe sea de derecho público."
  - id: d
    correct: true
    text:
      es: "Conforme al régimen de responsabilidad patrimonial de esa ley, incluso cuando concurra con sujetos de derecho privado."
  explanation:
    es: "El artículo 35 LRJSP dispone que esa responsabilidad «se exigirá de conformidad con lo previsto en los artículos 32 y siguientes, incluso cuando concurra con sujetos de derecho privado». La opción del Código Civil y la jurisdicción civil y la opción del Derecho privado sacan esa responsabilidad del régimen de la ley. La opción que excepciona la concurrencia con sujetos privados cambia «incluso cuando» por «salvo cuando»."
  citation: "art. 35 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q016
  prompt:
    es: "Según el artículo 36.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las indemnizaciones por los daños causados por las autoridades y personal al servicio de las Administraciones Públicas las exigirán los particulares:"
  options:
  - id: a
    text:
      es: "Directamente a la autoridad o empleado público que causó el daño."
  - id: b
    correct: true
    text:
      es: "Directamente a la Administración Pública correspondiente."
  - id: c
    text:
      es: "Al empleado causante y, de forma subsidiaria, a la Administración."
  - id: d
    text:
      es: "A la Administración y al empleado causante, de forma solidaria."
  explanation:
    es: "El artículo 36.1 LRJSP dice que «los particulares exigirán directamente a la Administración Pública correspondiente las indemnizaciones». La opción que dirige la reclamación a la autoridad o empleado causante, la que pone primero al empleado y después a la Administración y la que hace responder a los dos de forma solidaria contradicen esa reclamación directa a la Administración. La responsabilidad del personal la exige después la propia Administración (art. 36.2)."
  citation: "art. 36.1 LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q017
  prompt:
    es: "Una vez indemnizados los lesionados, ¿qué responsabilidad exigirá la Administración a sus autoridades y demás personal, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La contraída por dolo, o culpa o negligencia de cualquier grado."
  - id: b
    correct: true
    text:
      es: "La contraída por dolo, o culpa o negligencia graves."
  - id: c
    text:
      es: "Solo la contraída por dolo, declarado en sentencia penal firme."
  - id: d
    text:
      es: "La contraída por culpa o negligencia leves, si el daño es grave."
  explanation:
    es: "El artículo 36.2 LRJSP limita la acción de regreso a la responsabilidad en que hubieran incurrido «por dolo, o culpa o negligencia graves». La opción de cualquier grado de culpa amplía el supuesto. La opción que exige sentencia penal firme y solo dolo deja fuera la culpa grave, que el artículo incluye, y añade una condición que no recoge. La opción de la culpa leve rebaja el grado que exige la ley."
  citation: "art. 36.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q018
  prompt:
    es: "Según el artículo 36.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cómo exige la Administración que ya ha indemnizado a los lesionados la responsabilidad de su personal?"
  options:
  - id: a
    correct: true
    text:
      es: "De oficio en vía administrativa, previa instrucción del correspondiente procedimiento."
  - id: b
    text:
      es: "A instancia del lesionado, mediante la correspondiente demanda ante el orden jurisdiccional civil."
  - id: c
    text:
      es: "De oficio, mediante demanda ante el orden jurisdiccional contencioso-administrativo."
  - id: d
    text:
      es: "A instancia del lesionado, en vía administrativa y sin instruir procedimiento."
  explanation:
    es: "El artículo 36.2 LRJSP dice que la Administración «exigirá de oficio en vía administrativa» esa responsabilidad, «previa instrucción del correspondiente procedimiento». Las dos opciones «a instancia del lesionado» cambian quién la pone en marcha; una además prescinde del procedimiento. Las dos opciones de demanda judicial, civil o contencioso-administrativa, sacan de la vía administrativa lo que el artículo deja en ella."
  citation: "art. 36.2 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q019
  prompt:
    es: "En el procedimiento para exigir la responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas, ¿qué plazo fija la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público para el trámite de alegaciones?"
  options:
  - id: a
    text:
      es: "Un plazo de diez días."
  - id: b
    text:
      es: "Un plazo de cinco días."
  - id: c
    text:
      es: "Un plazo de un mes."
  - id: d
    correct: true
    text:
      es: "Un plazo de quince días."
  explanation:
    es: "El artículo 36.4 LRJSP enumera los trámites con sus plazos: alegaciones durante quince días, prueba durante quince días, audiencia durante diez días, propuesta de resolución en cinco días y resolución en cinco días. Diez días es el plazo de la audiencia, no el de las alegaciones. Cinco días es el plazo de la propuesta y el de la resolución. Un mes no es ninguno de los plazos de la lista."
  citation: "art. 36.4 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q020
  prompt:
    es: "Según el artículo 36.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en el procedimiento para exigir la responsabilidad de las autoridades y demás personal, la audiencia tendrá lugar:"
  options:
  - id: a
    text:
      es: "Durante un plazo de quince días."
  - id: b
    text:
      es: "Durante un plazo de cinco días."
  - id: c
    correct: true
    text:
      es: "Durante un plazo de diez días."
  - id: d
    text:
      es: "Durante un plazo no inferior a diez días ni superior a quince."
  explanation:
    es: "El artículo 36.4 LRJSP fija la «audiencia durante un plazo de diez días». Quince días son los plazos de alegaciones y de prueba, y cinco días el de la propuesta y el de la resolución. El plazo «no inferior a diez días ni superior a quince» es el de la audiencia del procedimiento común (art. 82.2 LPAC); este procedimiento tiene su propio plazo fijo."
  citation: "art. 36.4 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q021
  prompt:
    es: "En el procedimiento del artículo 36.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público para exigir la responsabilidad de las autoridades y demás personal, la propuesta de resolución se formulará:"
  options:
  - id: a
    text:
      es: "En un plazo de diez días a contar desde la finalización del trámite de audiencia."
  - id: b
    text:
      es: "En un plazo de cinco días a contar desde la finalización del período de prueba."
  - id: c
    correct: true
    text:
      es: "En un plazo de cinco días a contar desde la finalización del trámite de audiencia."
  - id: d
    text:
      es: "En un plazo de quince días a contar desde la finalización del trámite de audiencia."
  explanation:
    es: "El artículo 36.4 LRJSP fija la «formulación de la propuesta de resolución en un plazo de cinco días a contar desde la finalización del trámite de audiencia». Diez días desde la audiencia es el plazo para remitir la propuesta cuando hay dictamen en la reclamación del particular (art. 81.2 LPAC), otro procedimiento. La opción del período de prueba cambia el momento inicial. Quince días es el plazo de alegaciones y de prueba."
  citation: "art. 36.4 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q022
  prompt:
    es: "Señale la respuesta correcta sobre los trámites mínimos del procedimiento para exigir la responsabilidad de las autoridades y personal, según el artículo 36.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Práctica de las pruebas durante un plazo de quince días."
  - id: b
    text:
      es: "Alegaciones durante un plazo de diez días."
  - id: c
    text:
      es: "Audiencia durante un plazo de quince días."
  - id: d
    text:
      es: "Resolución por el órgano competente en diez días."
  explanation:
    es: "El artículo 36.4 LRJSP fija la «práctica de las pruebas admitidas y cualesquiera otras que el órgano competente estime oportunas durante un plazo de quince días». Las alegaciones duran quince días, no diez. La audiencia dura diez días, no quince. La resolución se dicta en cinco días, no en diez."
  citation: "art. 36.4 LRJSP"
  difficulty: 2
  tags:
