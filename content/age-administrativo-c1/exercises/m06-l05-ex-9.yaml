# anchor: fuente-ms-excel-lista-desplegable-html
- id: m06-l05-q334
  prompt:
    es: "En Excel 365, ¿qué estilos de alerta de error de una lista desplegable muestran un mensaje sin impedir que se introduzcan datos que no están en la lista?"
  options:
  - id: a
    text:
      es: "Detener y Advertencia"
  - id: b
    text:
      es: "Detener e Información"
  - id: c
    correct: true
    text:
      es: "Información y Advertencia"
  - id: d
    text:
      es: "Información, Advertencia y Detener"
  explanation:
    es: "Información y Advertencia muestran un mensaje que no impide introducir datos que no están en la lista. Detener, en cambio, lo impide."
  citation: "fuente: `ms-excel-lista-desplegable.html`; «Crear una lista desplegable»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-excel-lista-desplegable-html
- id: m06-l05-q336
  prompt:
    es: "En Excel 365, ¿por qué es recomendable colocar los elementos de una lista desplegable en una tabla de Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque las listas basadas en ella se actualizan solas al cambiar elementos"
  - id: b
    text:
      es: "Porque la tabla ordena sola los elementos de la lista"
  - id: c
    text:
      es: "Porque así no hace falta indicar el rango en el cuadro Origen"
  - id: d
    text:
      es: "Porque la tabla protege los elementos frente a cambios"
  explanation:
    es: "La página dice: «Cuando los datos se encuentran en una tabla, al agregar o quitar elementos de la lista, se actualizan automáticamente las listas desplegables basadas en esa tabla. No necesita realizar ninguna otra acción». Ordenar es otra cosa: la página lo trata aparte, como un paso que se puede dar después sobre el rango o la tabla. Hacer innecesario el cuadro Origen contradice los pasos: incluso con la tabla ya creada, se selecciona en el cuadro Origen y se arrastran las celdas. Y proteger los elementos no es lo que dice la página: la protección de hojas aparece solo como causa de que la validación de datos no esté disponible."
  citation: "fuente: `ms-excel-lista-desplegable.html`; «Crear una lista desplegable»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-imprimir-html
- id: m06-l05-q338
  prompt:
    es: "En Excel 365, ¿qué método abreviado abre las opciones de impresión, a las que también se llega con Archivo › Imprimir?"
  options:
  - id: a
    text:
      es: "Ctrl+1"
  - id: b
    text:
      es: "Ctrl+T"
  - id: c
    correct: true
    text:
      es: "Ctrl+P"
  - id: d
    text:
      es: "Ctrl+Mayús+F"
  explanation:
    es: "Archivo e Imprimir, o Ctrl+P, abre las opciones de impresión. Ctrl+1 abre Formato de celdas, Ctrl+T crea una tabla y Ctrl+Mayús+F da formato a fuentes en Formato de celdas."
  citation: "fuente: `ms-excel-imprimir.html`; «Seleccione Archivo e Imprimir o presione Ctrl+P.»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-escalar-html
- id: m06-l05-q344
  prompt:
    es: "En Escalar para ajustar de Excel 365, el cuadro que muestra cuánto escalado se utiliza al imprimir es:"
  options:
  - id: a
    text:
      es: "Ancho"
  - id: b
    text:
      es: "Alto"
  - id: c
    correct: true
    text:
      es: "Escala"
  - id: d
    text:
      es: "Orientación"
  explanation:
    es: "Para ver cuánto escalado se utiliza, se observa el número del cuadro Escala. Ancho y Alto fijan el número de páginas y la orientación es un comando de Configurar página."
  citation: "fuente: `ms-excel-escalar.html`; «Escalar una hoja de cálculo»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-escalar-html
- id: m06-l05-q347
  prompt:
    es: "En Excel 365, ¿qué hace Excel con los saltos de página manuales cuando se usa la opción Ajustar a de Escalar?"
