# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q114
  prompt:
    es: "En Excel 365, A1 contiene la fórmula =B1+C1. ¿Qué muestra, en otra celda, la fórmula =FORMULATEXTO(A1)?"
  options:
  - id: a
    text:
      es: "El resultado numérico de sumar B1 y C1"
  - id: b
    text:
      es: "VERDADERO"
  - id: c
    text:
      es: "El número de caracteres de la fórmula"
  - id: d
    correct: true
    text:
      es: "La propia fórmula =B1+C1, como texto"
  explanation:
    es: "FORMULATEXTO devuelve la fórmula de la referencia dada como texto, es decir, =B1+C1. El valor sumado es lo que muestra A1; VERDADERO sería el resultado de ESFORMULA y el número de caracteres, el de LARGO."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
