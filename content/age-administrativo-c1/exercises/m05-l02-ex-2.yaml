# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q049
  prompt:
    es: "Sobre un crédito inicial de 1.000.000 de euros se imputan 690.000, 580.000 y 480.000 euros a los tres primeros ejercicios posteriores. Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, esa distribución:"
  options:
  - id: a
    text:
      es: "Incumple los límites, porque la suma de las anualidades posteriores supera el crédito inicial."
  - id: b
    text:
      es: "Incumple los límites, porque el segundo ejercicio posterior sobrepasa el 50 por ciento del crédito inicial."
  - id: c
    text:
      es: "Incumple los límites, porque el tercer ejercicio posterior sobrepasa el 40 por ciento del crédito inicial."
  - id: d
    correct: true
    text:
      es: "Respeta los límites, porque cada anualidad queda dentro del límite de su ejercicio."
  explanation:
    es: "Los límites son 700.000 euros (70 por ciento) para el primer ejercicio posterior, 600.000 (60) para el segundo y 500.000 (50) para el tercero. Las anualidades de 690.000, 580.000 y 480.000 caben en cada uno. La ley limita cada anualidad, no la suma: que el conjunto pase del crédito inicial no es motivo de incumplimiento. Tampoco rige un 50 por ciento para el segundo ejercicio ni un 40 por ciento para el tercero."
  citation: "art. 47.2 LGP"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q050
  prompt:
    es: "Un ministerio con crédito inicial de 900.000 euros proyecta imputar 600.000, 520.000 y 470.000 euros a los tres primeros ejercicios posteriores. Conforme al artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué anualidad incumple el límite?"
  options:
  - id: a
    correct: true
    text:
      es: "La del tercer ejercicio posterior, que excede en 20.000 euros el límite de 450.000."
  - id: b
    text:
      es: "La del primer ejercicio posterior, que excede en 20.000 euros el límite de 580.000."
  - id: c
    text:
      es: "La del segundo ejercicio posterior, que excede en 20.000 euros el límite de 500.000."
  - id: d
    text:
      es: "Ninguna anualidad lo incumple, porque la suma de las tres es inferior al doble del crédito inicial."
  explanation:
    es: "Los límites sobre 900.000 euros son 630.000 (70 por ciento), 540.000 (60) y 450.000 (50). El primer ejercicio, con 600.000, y el segundo, con 520.000, caben; el tercero, con 470.000, excede en 20.000 euros. La suma de las anualidades no es el criterio de la ley."
  citation: "art. 47.2 LGP"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q052
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los porcentajes máximos de gasto plurianual se aplican sobre:"
  options:
  - id: a
    correct: true
    text:
      es: "El crédito inicial a que corresponda la operación."
  - id: b
    text:
      es: "El importe de adjudicación del contrato."
  - id: c
    text:
      es: "El crédito definitivo tras las modificaciones del ejercicio."
  - id: d
    text:
      es: "La anualidad del ejercicio en que se autoriza el gasto."
  explanation:
    es: "La base es «el crédito inicial a que corresponda la operación». No son la base el importe de adjudicación, el crédito definitivo tras modificaciones ni la anualidad del ejercicio de autorización."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q054
  prompt:
    es: "Conforme al artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los límites de los gastos plurianuales no se aplican a los compromisos derivados de:"
  options:
  - id: a
    correct: true
    text:
      es: "La carga financiera de la Deuda y los arrendamientos de inmuebles, incluidos los contratos mixtos."
  - id: b
    text:
      es: "Los contratos de obra de carácter plurianual y los de suministro de bienes de equipo del Estado."
  - id: c
    text:
      es: "Los gastos de personal fijo y las transferencias corrientes a organismos autónomos."
  - id: d
    text:
      es: "La carga financiera de la Deuda y los contratos de servicios de mantenimiento de equipos."
  explanation:
    es: "El artículo 47.2 excluye de los límites los compromisos de la carga financiera de la Deuda y de los arrendamientos de inmuebles, incluidos los contratos mixtos de arrendamiento y adquisición. Las obras y los suministros quedan sujetos a ellos; el personal fijo y las transferencias no son compromisos que la ley excluya; y los contratos de mantenimiento tampoco."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q056
  prompt:
    es: "Según el artículo 47.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién puede acordar, en casos especialmente justificados, la modificación de los porcentajes de los gastos plurianuales?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno, mediante acuerdo del Consejo de Ministros."
  - id: b
    text:
      es: "El titular del ministerio que gestiona el crédito, con informe de la Intervención Delegada."
  - id: c
    text:
      es: "La Dirección General de Presupuestos, mediante resolución motivada."
  - id: d
    text:
      es: "Las Cortes Generales, mediante una ley específica para cada caso."
  explanation:
    es: "La modificación de los porcentajes corresponde al Gobierno, en casos especialmente justificados. Ni el ministerio gestor, ni la Dirección General de Presupuestos, que solo informa, ni las Cortes pueden hacerlo por el procedimiento del artículo 47.3."
  citation: "art. 47.3 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q058
  prompt:
    es: "Según el artículo 47.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién eleva al Consejo de Ministros la propuesta para modificar los límites de un gasto plurianual y a iniciativa de quién?"
  options:
  - id: a
    text:
      es: "El ministerio correspondiente, a iniciativa del Ministro de Hacienda."
  - id: b
    text:
      es: "El Director General de Presupuestos, a iniciativa del Ministro de Hacienda."
  - id: c
    correct: true
    text:
      es: "El Ministro de Hacienda, a iniciativa del ministerio correspondiente."
  - id: d
    text:
      es: "El Ministro de Hacienda, a iniciativa de la Intervención General de la Administración del Estado."
  explanation:
    es: "El Ministro de Hacienda eleva la propuesta al Consejo de Ministros, a iniciativa del ministerio correspondiente. Las demás opciones invierten los papeles, ponen a la Dirección General de Presupuestos como proponente o atribuyen la iniciativa a la Intervención General."
  citation: "art. 47.3 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q059
  prompt:
    es: "Según el artículo 47.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el informe previo de la Dirección General de Presupuestos para modificar los límites plurianuales debe acreditar:"
  options:
  - id: a
    text:
      es: "La existencia de crédito disponible suficiente en el ejercicio en que se autoriza el gasto."
  - id: b
    text:
      es: "Que ningún ejercicio posterior supera el 50 por ciento del crédito inicial."
  - id: c
    correct: true
    text:
      es: "Su coherencia con la programación a que se refieren los artículos 28 y 29 de la ley."
  - id: d
    text:
      es: "La conformidad de la Intervención General con el contrato que da origen al gasto."
  explanation:
    es: "El informe de la Dirección General de Presupuestos acredita la coherencia del compromiso con la programación de los artículos 28 y 29. No acredita la existencia de crédito disponible, ni un tope del 50 por ciento que el propio acuerdo puede modificar, ni la conformidad de la Intervención General."
  citation: "art. 47.3 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-47-bis
- id: m05-l02-q060
  prompt:
    es: "Si en un ejercicio posterior la Ley de Presupuestos no autoriza créditos suficientes para un compromiso plurianual, ¿qué debe hacer primero el órgano competente según el artículo 47 bis de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Acordar de inmediato la resolución del negocio, con las compensaciones que procedan."
  - id: b
    text:
      es: "Reprogramar las obligaciones sin comunicarlo antes al tercero afectado."
  - id: c
    text:
      es: "Solicitar al Gobierno la modificación de los porcentajes del artículo 47.2."
  - id: d
    correct: true
    text:
      es: "Comunicarlo al tercero tan pronto como tenga conocimiento de ello."
  explanation:
    es: "El primer paso del artículo 47 bis es comunicar al tercero la circunstancia en cuanto se conozca. Después se reprograman las obligaciones si las disponibilidades lo permiten y, si no, se resuelve el negocio con las compensaciones que procedan. La modificación de porcentajes pertenece al artículo 47.3 y no resuelve la falta de crédito en un ejercicio posterior."
  citation: "art. 47 bis LGP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47-bis
- id: m05-l02-q061
  prompt:
    es: "Según el artículo 47 bis de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, si faltan créditos en un ejercicio posterior y lo permiten las disponibilidades de los créditos, se acordará:"
  options:
  - id: a
    correct: true
    text:
      es: "La reprogramación de las obligaciones de cada parte, con el reajuste de anualidades."
  - id: b
    text:
      es: "La resolución del negocio, fijando las compensaciones que procedan para el tercero."
  - id: c
    text:
      es: "El mantenimiento de las anualidades, con cargo al Fondo de Contingencia del ejercicio."
  - id: d
    text:
      es: "La anulación de las obligaciones, sin compensación alguna para el tercero."
  explanation:
    es: "El artículo 47 bis.2.º LGP dice que, si faltan créditos en un ejercicio posterior, «siempre que lo permitan las disponibilidades de los créditos, se acordará […] la reprogramación de las obligaciones asumidas por cada parte, con el consiguiente reajuste de anualidades». La resolución del negocio es la consecuencia del punto 3.º, «cuando no resulte posible» reprogramar, y fija «las compensaciones que, en su caso, procedan». El Fondo de Contingencia no sostiene las anualidades: el artículo 50.1 limita el Fondo a financiar ampliaciones de crédito, créditos extraordinarios, suplementos e incorporaciones. Anular las obligaciones sin compensación contradice el punto 3.º, que prevé fijar compensaciones."
  citation: "art. 47 bis LGP"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47-bis
- id: m05-l02-q062
  prompt:
    es: "Conforme al artículo 47 bis de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, cuando no sea posible reprogramar las obligaciones por falta de crédito, el órgano competente:"
  options:
  - id: a
    text:
      es: "Mantendrá el negocio y trasladará la obligación al ejercicio siguiente sin compensación alguna."
  - id: b
    text:
      es: "Pedirá al tercero que renuncie por escrito a las obligaciones pendientes."
  - id: c
    correct: true
    text:
      es: "Acordará la resolución del negocio, fijando las compensaciones que procedan."
  - id: d
    text:
      es: "Declarará nulo de pleno derecho el negocio desde su formalización."
  explanation:
    es: "Si la reprogramación no es posible, el órgano competente acuerda la resolución del negocio y fija las compensaciones que procedan. Mantener el negocio sin compensación, exigir una renuncia al tercero o declarar nulo el negocio desde el principio no figuran en el artículo 47 bis."
  citation: "art. 47 bis LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
