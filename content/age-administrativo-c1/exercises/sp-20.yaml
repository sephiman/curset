type: case
title:
  es: "Las estaciones GNSS del IGN"
scenario:
  es: "La Dirección General del Instituto Geográfico Nacional forma parte del Ministerio de Transportes y Movilidad Sostenible y tiene su sede en Madrid.\n\nLa solicitud de Cartografía del Jarama, S.L. entró en el registro electrónico de la Dirección General el miércoles, 17 de marzo de 2027. El martes, 13 de abril de 2027, la empresa promovió la recusación de la instructora. Mapas Digitales del Duero, S.L. solicitó instalar cinco estaciones el lunes, 12 de abril de 2027. Agotados los medios, la Directora General amplió, de forma motivada, el plazo máximo para resolver. El Subdirector General firmó la resolución por delegación de la Directora General, y su parte dispositiva dice «quince estaciones». Rutas Serranas, S.L. reclama 4.000 euros por excursiones canceladas al cerrar la Dirección General el acceso a un vértice geodésico.\n\nLa Dirección General licita el suministro de receptores GNSS por procedimiento abierto, con ofertas electrónicas. El presupuesto base es de 350.000 euros, IVA excluido; el pliego prevé modificaciones al alza por un máximo de 70.000 euros y el contrato no admite prórrogas. La adjudicación a Geodesia Meseta, S.L. se notificó con remisión el martes, 13 de julio de 2027. La empresa entregó el jueves, 2 de septiembre de 2027; la conformidad se aprobó el martes, 7 de septiembre de 2027, y la factura se presentó el viernes, 10 de septiembre de 2027. La Intervención Delegada reparó la propuesta de modificar el contrato; la Intervención General de la Administración del Estado confirmó el reparo y la Dirección General sigue sin aceptarlo.\n\nEl viernes, 11 de junio de 2027, a las 16:30 horas, la Dirección General supo que un correo con datos personales de 120 colaboradores llegó por error a destinatarios ajenos, con probable riesgo para sus derechos.\n\nDoña Yasmina El Idrissi Benali, marroquí casada con un español, no separados de derecho, superó el proceso del Cuerpo de Ingenieros Técnicos en Topografía, sin plazas de poder público. Su nombramiento ya está publicado en el «Boletín Oficial del Estado», pero no ha acatado la Constitución ni tomado posesión. Don Héctor Sanz Ordóñez obtiene por concurso un puesto de otra unidad del Ministerio en Madrid; la resolución se publica en el «Boletín Oficial del Estado» el miércoles, 9 de junio de 2027, y cesa el último día del plazo.\n\nLa Dirección General quiere pasar 85.000 euros del capítulo 6 de un programa al capítulo 6 de otro programa del mismo servicio presupuestario, sin afectar a créditos de personal.\n\nDon Javier Aranda Mateos, del Subgrupo A2 (grupo 2 de dietas), viaja a Fráncfort del lunes, 7 de junio de 2027, al jueves, 10 de junio de 2027; el anexo III del Real Decreto 462/2002 fija para su grupo en Alemania 132,82 euros de alojamiento y 59,50 de manutención. Doña Aurora Salinas Pardo, del mismo subgrupo, con residencia oficial en Madrid, hace el lunes, 21 de junio de 2027, una comisión con derecho a indemnización en Toledo, de 8:00 a 17:30 horas, sin pernoctar.\n\nEn Madrid son inhábiles, además de sábados y domingos, el viernes, 19 de marzo de 2027, el jueves, 25 de marzo de 2027, el viernes, 26 de marzo de 2027, y el martes, 12 de octubre de 2027; ningún otro festivo cae en los plazos por días.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10566-art-24
- id: q21
  lesson: m03-l03
  prompt:
    es: "Recusada la instructora de Cartografía del Jarama, S.L., esta niega la causa el día siguiente. Según el artículo 24.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿hasta qué fecha resuelve el superior, contando tres días hábiles desde el siguiente a la negativa?"
  options:
  - id: a
    text:
      es: "El viernes, 16 de abril de 2027."
  - id: b
    text:
      es: "El sábado, 17 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 19 de abril de 2027."
  - id: d
    text:
      es: "El martes, 20 de abril de 2027."
  explanation:
    es: "Si el recusado niega la causa de recusación, el superior resuelve en el plazo de tres días (art. 24.4 LRJSP), y el recusado manifiesta si la causa se da o no en el día siguiente a la recusación (art. 24.3 LRJSP). Promovida la recusación el martes, 13 de abril de 2027, la instructora niega la causa el miércoles, 14 de abril de 2027. Tres días hábiles desde el jueves, 15 de abril de 2027, terminan el lunes, 19 de abril de 2027, porque el sábado y el domingo no cuentan. La fecha del viernes, 16 de abril de 2027, cuenta el día de la negativa. La del sábado, 17 de abril de 2027, cuenta tres días naturales. La del martes, 20 de abril de 2027, añade un día que la ley no prevé."
  citation: "art. 24.3–4 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-23
- id: q22
  lesson: m03-l03
  prompt:
    es: "¿Qué recurso cabe contra el acuerdo con el que la Directora General amplió el plazo máximo para resolver la solicitud de Mapas Digitales del Duero, S.L., según el artículo 23 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El de alzada ante el superior jerárquico de la Directora General, en el plazo de un mes."
  - id: b
    text:
      es: "El de reposición potestativo ante la propia Directora General, en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "Ninguno, porque contra el acuerdo que resuelve sobre la ampliación del plazo no cabe recurso alguno."
  - id: d
    text:
      es: "El contencioso-administrativo directo ante el Juzgado competente, en el plazo de dos meses."
  explanation:
    es: "El acuerdo que resuelve sobre la ampliación del plazo máximo para resolver y notificar se notifica a los interesados y no admite recurso alguno (art. 23.2 LPAC). Por eso no caben ni la alzada ni la reposición potestativa, que se darían contra un acto que no pusiera fin a la vía administrativa o que sí la pusiera, respectivamente. Tampoco cabe acudir directamente a la vía contencioso-administrativa contra el acuerdo, que ninguna norma abre a recurso."
  citation: "art. 23 LPAC"
  difficulty: 1
  tags:
  - "recurso"
  - "plazo"
# anchor: boe-a-2015-10565-art-109
- id: q03
  lesson: m03-l03
  prompt:
    es: "¿Hasta cuándo puede la Dirección General rectificar el error de «quince estaciones» en la resolución para Mapas Digitales del Duero, S.L., según el artículo 109.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En cualquier momento, de oficio o a instancia de la empresa interesada."
  - id: b
    text:
      es: "Solo durante el mes siguiente a notificarla, y únicamente de oficio."
  - id: c
    text:
      es: "Durante dos meses desde la notificación, y solo a instancia de la empresa."
  - id: d
    text:
      es: "Mientras no haya transcurrido el plazo de prescripción de la acción."
  explanation:
    es: "Las Administraciones rectifican en cualquier momento, de oficio o a instancia de los interesados, los errores materiales, de hecho o aritméticos de sus actos (art. 109.2 LPAC). Poner «quince» donde la solicitud dice «cinco» es un error material de transcripción, y no hay plazo para rectificarlo. Limitarlo al mes siguiente o a dos meses crea un plazo que el artículo no contiene. La opción de la prescripción traslada la regla de la revocación de actos desfavorables, que es el apartado 1 del mismo artículo."
  citation: "art. 109.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-9
- id: q04
  lesson: m03-l03
  prompt:
    es: "¿Qué órgano se considera que dictó la resolución para Mapas Digitales del Duero, S.L., firmada por el Subdirector General, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "La Directora General, como órgano delegante de la competencia."
  - id: b
    text:
      es: "El Subdirector General, como órgano delegado que la firmó."
  - id: c
    text:
      es: "El Ministro de Transportes y Movilidad Sostenible, como superior de ambos."
  - id: d
    text:
      es: "Ambos órganos a la vez, con responsabilidad solidaria sobre su contenido."
  explanation:
    es: "Las resoluciones que se adoptan por delegación indican expresamente esa circunstancia y se consideran dictadas por el órgano delegante (art. 9.4 LRJSP). La Directora General delegó, así que la resolución es suya aunque la firme el Subdirector General. La opción del Subdirector confunde quien firma con quien se considera autor. La del Ministro atribuye la resolución a un superior que no la delegó. La de ambos órganos con responsabilidad solidaria no figura en el artículo."
  citation: "art. 9.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
  - "efecto"
# anchor: boe-a-2015-10566-art-32
- id: q05
  lesson: m03-l06
  prompt:
    es: "Señale la respuesta correcta sobre los requisitos del daño de 4.000 euros que alega Rutas Serranas, S.L., conforme al artículo 32.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Ser efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas."
  - id: b
    text:
      es: "Ser efectivo, evaluable económicamente y haber afectado a una persona física, nunca a una empresa."
  - id: c
    text:
      es: "Ser efectivo y derivar de un funcionamiento anormal, pues el normal no genera indemnización."
  - id: d
    text:
      es: "Ser evaluable económicamente y estar declarado antijurídico por una resolución judicial previa."
  explanation:
    es: "El daño alegado ha de ser efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas (art. 32.2 LRJSP). Las excursiones canceladas son un daño efectivo y evaluable, y se individualiza en la empresa. Limitarlo a personas físicas añade una exclusión que la norma no tiene. Exigir un funcionamiento anormal contradice el artículo 32.1, que ampara el normal y el anormal. La declaración judicial previa no figura entre los requisitos."
  citation: "art. 32.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-101
- id: q06
  lesson: m03-l04
  prompt:
    es: "¿Cuál es el valor estimado del contrato de suministro de receptores GNSS, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "350.000 euros, el presupuesto sin IVA y sin la modificación prevista."
  - id: b
    correct: true
    text:
      es: "420.000 euros, el presupuesto sin IVA más la modificación prevista."
  - id: c
    text:
      es: "423.500 euros, el presupuesto con IVA y sin la modificación prevista."
  - id: d
    text:
      es: "508.200 euros, el valor con la modificación prevista y con IVA incluido."
  explanation:
    es: "El valor estimado se calcula sin IVA y, si el pliego prevé modificaciones, es el importe máximo que el contrato pueda alcanzar con todas las modificaciones al alza previstas (art. 101.2 LCSP). Son 350.000 + 70.000 = 420.000 euros. El contrato no admite prórrogas, así que no suma ninguna. La cifra de 350.000 euros olvida la modificación. La de 423.500 euros es el presupuesto con IVA (350.000 × 1,21). La de 508.200 euros añade IVA al valor estimado (420.000 × 1,21)."
  citation: "art. 101.2 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-153
- id: q07
  lesson: m03-l04
  prompt:
    es: "Según el artículo 153.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿desde qué fecha puede formalizarse el contrato con Geodesia Meseta, S.L., si ningún licitador pidió suspender?"
  options:
  - id: a
    text:
      es: "Desde el miércoles, 28 de julio de 2027."
  - id: b
    text:
      es: "Desde el jueves, 29 de julio de 2027."
  - id: c
    text:
      es: "Desde el martes, 3 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "Desde el miércoles, 4 de agosto de 2027."
  explanation:
    es: "El contrato es susceptible de recurso especial, así que la formalización no puede efectuarse antes de que transcurran quince días hábiles desde la remisión de la notificación de la adjudicación (art. 153.3 LCSP). La remisión fue el martes, 13 de julio de 2027. Los días se cuentan desde el siguiente, sin sábados, domingos ni festivos: el decimoquinto es el martes 3 de agosto, y la formalización cabe desde el miércoles, 4 de agosto de 2027. La fecha del 3 de agosto cuenta el día de la remisión. La del 29 de julio cuenta quince días naturales, y la del 28 de julio, diez días hábiles."
  citation: "art. 153.3 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-198
- id: q08
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué fecha debe abonar la Dirección General el precio a Geodesia Meseta, S.L. para no deber intereses de demora, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Hasta el sábado, 2 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el jueves, 7 de octubre de 2027."
  - id: c
    text:
      es: "Hasta el domingo, 10 de octubre de 2027."
  - id: d
    text:
      es: "Hasta el miércoles, 20 de octubre de 2027."
  explanation:
    es: "La Administración abona el precio dentro de los treinta días siguientes a la aprobación de los documentos de conformidad (art. 198.4 LCSP), y esos días son naturales (disposición adicional duodécima LCSP). La conformidad se aprobó el martes, 7 de septiembre de 2027, y el plazo termina el jueves, 7 de octubre de 2027. La fecha del sábado 2 de octubre cuenta desde la entrega, plazo que corresponde a aprobar la conformidad. La del domingo 10 de octubre cuenta desde la factura, que es el plazo del contratista. La del miércoles 20 de octubre cuenta treinta días hábiles, con el 12 de octubre inhábil."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-45
- id: q09
  lesson: m03-l04
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el recurso especial que una licitadora no adjudicataria interpusiera contra la adjudicación del suministro de receptores lo resolvería:"
  options:
  - id: a
    text:
      es: "El Ministro de Transportes y Movilidad Sostenible, como superior jerárquico."
  - id: b
    text:
      es: "La Junta Consultiva de Contratación Pública del Estado, como órgano consultivo."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado, por conducto de la Intervención Delegada."
  - id: d
    correct: true
    text:
      es: "El Tribunal Administrativo Central de Recursos Contractuales."
  explanation:
    es: "En el ámbito de los poderes adjudicadores del sector público estatal, el recurso especial lo conoce y resuelve el Tribunal Administrativo Central de Recursos Contractuales (art. 45.1 LCSP). El Ministerio es un poder adjudicador del sector estatal. El Ministro no lo resuelve, porque el recurso especial no sigue la vía de la alzada. La Junta Consultiva informa en materia de contratación, pero no resuelve recursos. La Intervención General ejerce el control del gasto y tampoco los resuelve."
  citation: "art. 45.1 LCSP"
  difficulty: 1
  tags:
  - "órgano"
  - "recurso"
# anchor: celex-32016r0679-art-33
- id: q10
  lesson: m02-l04
  prompt:
    es: "Conforme al artículo 33.1 del Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, ¿hasta qué momento debe la Dirección General, de ser posible, notificar la violación de seguridad a la autoridad de control?"
  options:
  - id: a
    text:
      es: "El domingo, 13 de junio de 2027, a las 16:30 horas."
  - id: b
    correct: true
    text:
      es: "El lunes, 14 de junio de 2027, a las 16:30 horas."
  - id: c
    text:
      es: "El martes, 15 de junio de 2027, a las 16:30 horas."
  - id: d
    text:
      es: "El miércoles, 16 de junio de 2027, a las 16:30 horas."
  explanation:
    es: "El responsable notifica la violación a la autoridad de control sin dilación indebida y, de ser posible, a más tardar 72 horas después de tener constancia de ella (art. 33.1 RGPD). Son horas corridas. La Dirección General tuvo constancia el viernes, 11 de junio de 2027, a las 16:30 horas, y 72 horas después es el lunes, 14 de junio de 2027, a las 16:30 horas. El domingo 13 solo suma 48 horas. El martes 15 empieza el cómputo al día siguiente, y el miércoles 16 cuenta tres días hábiles, plazo que el artículo no usa."
  citation: "art. 33.1 RGPD"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-56
- id: q11
  lesson: m04-l03
  prompt:
    es: "Según el artículo 56.1.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, un aspirante de 58 años que quiere participar en el proceso selectivo del Cuerpo de Ingenieros Técnicos en Topografía:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede participar, porque solo se exige tener dieciséis años y no superar la edad de jubilación forzosa."
  - id: b
    text:
      es: "No puede participar, porque el acceso al cuerpo tiene un máximo de cincuenta y cinco años."
  - id: c
    text:
      es: "Puede participar solo si una norma reglamentaria eleva el límite de edad de la jubilación forzosa."
  - id: d
    text:
      es: "No puede participar, porque a los cincuenta y ocho años ya ha pasado la edad de jubilación voluntaria."
  explanation:
    es: "Para participar hay que tener cumplidos dieciséis años y no exceder de la edad máxima de jubilación forzosa, y solo por ley puede fijarse otra edad máxima para el acceso al empleo público (art. 56.1.c) TREBEP). Un aspirante de 58 años está por debajo de la jubilación forzosa. Un máximo de cincuenta y cinco años solo podría fijarlo una ley, y el proceso no cita ninguna. Una norma reglamentaria no cambia el límite de la jubilación forzosa. La jubilación voluntaria no es un límite de acceso."
  citation: "art. 56.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-57
- id: q12
  lesson: m04-l03
  prompt:
    es: "Señale la respuesta correcta sobre la participación de Doña Yasmina El Idrissi Benali en el proceso selectivo, conforme al artículo 57.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre:"
  options:
  - id: a
    text:
      es: "No, porque el acceso como funcionario exige siempre la nacionalidad española."
  - id: b
    text:
      es: "No, porque solo pueden acceder los nacionales de Estados miembros de la Unión Europea."
  - id: c
    correct: true
    text:
      es: "Sí, por ser cónyuge de un español no separado de derecho, en igualdad de condiciones que los españoles."
  - id: d
    text:
      es: "Sí, pero únicamente a plazas de personal laboral, nunca como funcionaria de carrera."
  explanation:
    es: "Las reglas de acceso de los nacionales de la Unión Europea se aplican, cualquiera que sea su nacionalidad, al cónyuge de los españoles que no esté separado de derecho (art. 57.2 TREBEP). Doña Yasmina es marroquí y está casada con un español, así que accede como funcionaria en igualdad de condiciones, salvo en empleos que impliquen ejercicio del poder público, que aquí no hay. Exigir siempre la nacionalidad española olvida el artículo 57. Limitar el acceso a nacionales de la Unión excluye al cónyuge que el apartado 2 incluye. Reservarle solo plazas de personal laboral añade una restricción sin base."
  citation: "art. 57.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-62
- id: q13
  lesson: m04-l04
  prompt:
    es: "¿Tiene ya Doña Yasmina El Idrissi Benali la condición de funcionaria de carrera, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre?"
  options:
  - id: a
    text:
      es: "Sí, porque basta con superar el proceso selectivo y ser nombrada en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "Sí, porque el acatamiento de la Constitución se exige después de la toma de posesión."
  - id: c
    text:
      es: "No, porque la condición solo se adquiere al cumplir un periodo de prueba de seis meses."
  - id: d
    correct: true
    text:
      es: "No, porque aún le faltan el acatamiento de la Constitución y la toma de posesión."
  explanation:
    es: "La condición de funcionario de carrera se adquiere por el cumplimiento sucesivo de cuatro requisitos: superar el proceso selectivo, ser nombrado con publicación en el diario oficial, acatar la Constitución y tomar posesión (art. 62.1 TREBEP). Doña Yasmina cumple los dos primeros. Le faltan el acatamiento y la toma de posesión, así que aún no es funcionaria. Superar el proceso y el nombramiento no bastan. El acatamiento no se exige después de la toma de posesión: los requisitos son sucesivos y el acatamiento va antes. El periodo de prueba de seis meses no figura en el artículo."
  citation: "art. 62.1 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1995-8729-art-48
- id: q23
  lesson: m04-l05
  prompt:
    es: "¿Hasta qué fecha debe cesar Don Héctor Sanz Ordóñez en su puesto actual, si el Subsecretario no difiere el cese, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "El sábado, 12 de junio de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 14 de junio de 2027."
  - id: c
    text:
      es: "El viernes, 11 de junio de 2027."
  - id: d
    text:
      es: "El miércoles, 7 de julio de 2027."
  explanation:
    es: "El cese debe efectuarse dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el «Boletín Oficial del Estado» (art. 48.1 RD 364/1995). Publicada el miércoles, 9 de junio de 2027, esos días son el jueves, 10 de junio de 2027, el viernes, 11 de junio de 2027, y el lunes, 14 de junio de 2027, porque el sábado y el domingo no cuentan. La fecha del viernes, 11 de junio de 2027, cuenta el día de la publicación. La del sábado, 12 de junio de 2027, cuenta tres días naturales. La del miércoles, 7 de julio de 2027, suma los veinte días hábiles del cese diferido, que solo existen si el Subsecretario lo difiere."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-42
- id: q24
  lesson: m04-l05
  prompt:
    es: "El concurso que gana Don Héctor Sanz Ordóñez se convocó en el «Boletín Oficial del Estado» el lunes, 15 de marzo de 2027. ¿Hasta qué fecha pudo presentar su solicitud, según el artículo 42.2 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "El lunes, 5 de abril de 2027."
  - id: b
    text:
      es: "El martes, 30 de marzo de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 8 de abril de 2027."
  - id: d
    text:
      es: "El martes, 6 de abril de 2027."
  explanation:
    es: "El plazo de presentación de instancias es de quince días hábiles, contados a partir del siguiente al de la publicación de la convocatoria (art. 42.2 RD 364/1995). Desde el martes, 16 de marzo de 2027, y sin contar sábados, domingos ni los inhábiles de Madrid (el viernes, 19 de marzo de 2027, el jueves, 25 de marzo de 2027, y el viernes, 26 de marzo de 2027), el decimoquinto día hábil es el jueves, 8 de abril de 2027. La fecha del lunes, 5 de abril de 2027, no descuenta ningún festivo. La del martes, 6 de abril de 2027, descuenta solo el de San José. La del martes, 30 de marzo de 2027, cuenta quince días naturales."
  citation: "art. 42.2 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-50
- id: q29
  lesson: m05-l02
  prompt:
    es: "¿Qué importe tiene el Fondo de Contingencia que financiaría la indemnización a Rutas Serranas, S.L., si hay 350.000 millones de gastos no financieros y 70.000 van a la sección independiente de comunidades y entidades locales, según el artículo 50.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "7.000 millones de euros, el dos por ciento de todos los gastos no financieros."
  - id: b
    correct: true
    text:
      es: "5.600 millones de euros, el dos por ciento del total sin la sección independiente."
  - id: c
    text:
      es: "2.800 millones de euros, el uno por ciento del total sin la sección independiente."
  - id: d
    text:
      es: "1.400 millones de euros, el dos por ciento de la sección independiente."
  explanation:
    es: "El Fondo de Contingencia es el dos por ciento del total de gastos para operaciones no financieras, excluidos los destinados a financiar a las comunidades autónomas y entidades locales en una sección independiente (art. 50.1 LGP). Se excluyen 70.000 millones: 350.000 − 70.000 = 280.000, y el dos por ciento de 280.000 son 5.600 millones de euros. Los 7.000 millones aplican el dos por ciento al total, sin excluir la sección independiente. Los 2.800 millones usan un uno por ciento que la ley no fija. Y los 1.400 millones aplican el dos por ciento solo a la sección independiente, que es justo lo excluido."
  citation: "art. 50.1 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "fondo-de-contingencia"
# anchor: boe-a-2003-21614-art-55
- id: q26
  lesson: m05-l02
  prompt:
    es: "Si la Dirección General no tuviera crédito adecuado para indemnizar a Rutas Serranas, S.L., ¿quién autoriza el crédito extraordinario, financiado con el Fondo de Contingencia para una obligación del ejercicio corriente, según el artículo 55.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, previo informe de la Intervención Delegada."
  - id: b
    text:
      es: "Las Cortes Generales, mediante una ley aprobada a propuesta del Gobierno."
  - id: c
    text:
      es: "El titular del Ministerio de Transportes y Movilidad Sostenible, previo informe de la Intervención Delegada."
  - id: d
    correct: true
    text:
      es: "El Consejo de Ministros, sin necesidad de remitir un proyecto de ley a las Cortes."
  explanation:
    es: "El Consejo de Ministros autoriza los créditos extraordinarios y suplementos para atender obligaciones del ejercicio corriente cuando se financian con cargo al Fondo de Contingencia (art. 55.3 LGP). Las Cortes Generales intervienen por ley, a propuesta del Gobierno, solo si se financian con baja en otros créditos o atienden obligaciones de ejercicios anteriores sin crédito anulado (art. 55.2 LGP). El Ministro de Hacienda y el titular del Ministerio autorizan otras modificaciones, como las transferencias o las incorporaciones, no este crédito."
  citation: "art. 55.3 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "financiación"
# anchor: boe-a-1996-1578-art-16
- id: q27
  lesson: m05-l03
  prompt:
    es: "La Intervención Delegada notificó el reparo el miércoles, 22 de septiembre de 2027. Según el artículo 16.1 del Real Decreto 2188/1995, de 28 de diciembre, ¿hasta qué fecha puede la Dirección General plantear la discrepancia, contando días hábiles desde el siguiente?"
  options:
  - id: a
    text:
      es: "El miércoles, 13 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 14 de octubre de 2027."
  - id: c
    text:
      es: "El jueves, 7 de octubre de 2027."
  - id: d
    text:
      es: "El miércoles, 6 de octubre de 2027."
  explanation:
    es: "El órgano gestor que no acepta el reparo plantea la discrepancia en el plazo de quince días (art. 16.1 RD 2188/1995), que aquí se cuentan hábiles desde el jueves, 23 de septiembre de 2027. Sin sábados, domingos ni el martes, 12 de octubre de 2027, que es inhábil en Madrid, el decimoquinto día hábil es el jueves, 14 de octubre de 2027. La fecha del miércoles, 13 de octubre de 2027, no descuenta ese festivo. La del jueves, 7 de octubre de 2027, cuenta quince días naturales. La del miércoles, 6 de octubre de 2027, cuenta solo diez días hábiles, el plazo de fiscalización del artículo 13.2 y no el de la discrepancia."
  citation: "art. 16.1 RD 2188/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2002-10337-art-12
- id: q19
  lesson: m05-l04
  prompt:
    es: "¿Qué dieta máxima puede percibir Don Javier Aranda Mateos el martes, 8 de junio de 2027, según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio?"
  options:
  - id: a
    text:
      es: "59,50 euros, solo la dieta de manutención del anexo III."
  - id: b
    text:
      es: "96,16 euros, el 50 por 100 de la dieta entera del anexo III."
  - id: c
    text:
      es: "132,82 euros, solo la dieta de alojamiento del anexo III."
  - id: d
    correct: true
    text:
      es: "192,32 euros, la dieta entera de alojamiento y manutención."
  explanation:
    es: "En los días intermedios entre el de salida y el de regreso se perciben dietas al 100 por 100 (art. 12.3.c) RD 462/2002). El martes 8 es intermedio. El anexo III fija para el grupo 2 en Alemania 132,82 euros de alojamiento y 59,50 de manutención: 132,82 + 59,50 = 192,32 euros. Los 59,50 euros son solo la manutención, y los 132,82, solo el alojamiento. Los 96,16 euros son el 50 por 100 de la dieta entera, porcentaje que la norma no aplica a los días intermedios."
  citation: "art. 12.3.c) RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-art-12
- id: q30
  lesson: m05-l04
  prompt:
    es: "Doña Aurora Salinas Pardo sale en comisión a Toledo el martes, 22 de junio de 2027, a las 22:30, y regresa el jueves, 24 de junio de 2027, a las 13:00. ¿Qué importe total de dietas le corresponde, con 65,97 euros de alojamiento y 37,40 euros de manutención por día?"
  options:
  - id: a
    text:
      es: "206,74 euros: la dieta entera el martes y el miércoles."
  - id: b
    text:
      es: "131,94 euros: solo el alojamiento el martes y el miércoles."
  - id: c
    correct: true
    text:
      es: "169,34 euros: alojamiento el martes y la dieta entera el miércoles."
  - id: d
    text:
      es: "188,04 euros: alojamiento y media manutención el martes, y la dieta entera el miércoles."
  explanation:
    es: "La comisión dura más de veinticuatro horas, así que se cuenta por días (art. 12.3 RD 462/2002). El martes sale a las 22:30, después de las veintidós horas: se percibe alojamiento, pero no manutención. El miércoles es día intermedio, dieta al 100 por 100: 65,97 + 37,40 = 103,37 euros. El jueves concluye a las 13:00, antes de las catorce horas: nada. Total: 65,97 + 103,37 = 169,34 euros. Los 188,04 euros pagan media manutención el martes, que solo se da si se sale antes de las veintidós. Los 206,74 euros dan la dieta entera el martes. Y los 131,94 euros olvidan la manutención del miércoles."
  citation: "art. 12.3 RD 462/2002"
  difficulty: 3
  tags:
  - "cantidad"
  - "dieta"
