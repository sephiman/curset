# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0055
  prompt:
    es: "Si la Administración y el obligado tributario no han acordado otro orden, el artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria establece que se embargarán los bienes teniendo en cuenta:"
  options:
  - id: a
    text:
      es: "la mayor cuantía de los bienes y la menor onerosidad de su enajenación para la Administración."
  - id: b
    text:
      es: "la mayor antigüedad de los bienes y la mayor facilidad de su valoración."
  - id: c
    text:
      es: "el orden en que los bienes hayan sido señalados por el obligado en su relación patrimonial."
  - id: d
    correct: true
    text:
      es: "la mayor facilidad de su enajenación y la menor onerosidad de esta para el obligado."
  explanation:
    es: "Los criterios son la facilidad de enajenar y la onerosidad menor para el obligado, no para la Administración (art. 169.2 LGT). Ni la cuantía o antigüedad de los bienes ni el orden en que el obligado los relacione son criterios del artículo."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "criterio"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0057
  prompt:
    es: "El orden de embargo del artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando no son aplicables los criterios de facilidad de enajenación y onerosidad, termina con:"
  options:
  - id: a
    text:
      es: "metales preciosos, piedras finas, joyería, orfebrería y antigüedades."
  - id: b
    text:
      es: "bienes muebles y semovientes."
  - id: c
    correct: true
    text:
      es: "créditos, efectos, valores y derechos realizables a largo plazo."
  - id: d
    text:
      es: "establecimientos mercantiles o industriales."
  explanation:
    es: "La última letra del orden es la de créditos, efectos, valores y derechos realizables a largo plazo (art. 169.2.i LGT). Los bienes muebles y semovientes son la letra anterior. Los metales preciosos y los establecimientos mercantiles o industriales aparecen antes, en las letras g y f."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0058
  prompt:
    es: "¿Cuál de los siguientes bienes se embarga inmediatamente después de los créditos, efectos, valores y derechos realizables en el acto o a corto plazo, según el orden del artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los intereses, rentas y frutos de toda especie."
  - id: b
    correct: true
    text:
      es: "Los sueldos, salarios y pensiones del obligado tributario."
  - id: c
    text:
      es: "Los establecimientos mercantiles o industriales del obligado."
  - id: d
    text:
      es: "Los bienes inmuebles del obligado tributario."
  explanation:
    es: "Tras los créditos y valores a corto plazo (letra b) viene el embargo de sueldos, salarios y pensiones (letra c). Los inmuebles son la letra d, los intereses, rentas y frutos la e, y los establecimientos mercantiles o industriales la f."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0059
  prompt:
    es: "¿Cuál de los siguientes bienes se embarga inmediatamente después de los bienes inmuebles, conforme al orden subsidiario del artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los sueldos, salarios y pensiones del obligado."
  - id: b
    text:
      es: "Los establecimientos mercantiles o industriales."
  - id: c
    text:
      es: "Los bienes muebles y semovientes del obligado."
  - id: d
    correct: true
    text:
      es: "Los intereses, rentas y frutos de toda especie."
  explanation:
    es: "Después de los inmuebles (letra d) se embargan los intereses, rentas y frutos de toda especie (letra e). Los sueldos, salarios y pensiones van antes, en la letra c. Los establecimientos mercantiles o industriales son la letra f y los bienes muebles y semovientes la letra h."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0061
  prompt:
    es: "De acuerdo con el artículo 169.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, se embargan en último lugar aquellos bienes:"
  options:
  - id: a
    correct: true
    text:
      es: "para cuya traba sea necesaria la entrada en el domicilio del obligado tributario."
  - id: b
    text:
      es: "que estén situados fuera del territorio del órgano de recaudación que dicta la diligencia."
  - id: c
    text:
      es: "que el obligado tributario haya ofrecido en garantía de la deuda."
  - id: d
    text:
      es: "cuyo valor de mercado sea inferior al importe de la deuda."
  explanation:
    es: "Los bienes que exigen entrar en el domicilio se dejan para el final (art. 169.4 LGT). El artículo no ordena posponer los bienes ofrecidos en garantía, los situados fuera del territorio ni los de valor inferior a la deuda."
  citation: "art. 169.4 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0062
  prompt:
    es: "Conforme al artículo 169.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la alteración del orden de embargo a solicitud del obligado tributario:"
  options:
  - id: a
    text:
      es: "Procede siempre que los bienes que señale tengan un valor superior al de la deuda pendiente, aunque con ello se cause perjuicio a terceros."
  - id: b
    text:
      es: "Procede si los bienes que señale garantizan el cobro con la misma eficacia, aunque la cobranza sea más tardía."
  - id: c
    correct: true
    text:
      es: "Procede si los bienes que señale garantizan el cobro de la deuda con la misma eficacia y prontitud y no se causa perjuicio a terceros."
  - id: d
    text:
      es: "No procede una vez notificada la providencia de apremio, porque el orden es imperativo desde entonces."
  explanation:
    es: "La alteración exige dos condiciones acumuladas: que los bienes señalados garanticen el cobro con la misma eficacia y prontitud, y que no se perjudique a terceros (art. 169.4 LGT). El mayor valor no basta ni autoriza dañar a terceros. La misma eficacia sin la misma prontitud no cumple el artículo. Y el orden se puede alterar a solicitud del obligado, sin que el texto lo cierre tras la providencia de apremio."
  citation: "art. 169.4 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0063
  prompt:
    es: "No se embargan, según el artículo 169.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los bienes o derechos declarados inembargables por las leyes ni aquellos otros respecto de los que se presuma que:"
  options:
  - id: a
    text:
      es: "el obligado tributario los destine al uso de su familia."
  - id: b
    correct: true
    text:
      es: "el coste de su realización pudiera exceder del importe que normalmente podría obtenerse en su enajenación."
  - id: c
    text:
      es: "su enajenación pudiera perjudicar la continuidad de la actividad económica del obligado tributario o de sus trabajadores."
  - id: d
    text:
      es: "su valor de mercado sea inferior a la mitad del importe de la deuda pendiente."
  explanation:
    es: "La segunda causa de no embargo es que el coste de realizar el bien supere lo que normalmente se obtendría al venderlo (art. 169.5 LGT). El valor inferior a la mitad de la deuda, la continuidad de la actividad y el uso familiar no son causas de inembargabilidad en este artículo. El uso familiar solo opera a través de los bienes que declara inembargables la Ley de Enjuiciamiento Civil."
  citation: "art. 169.5 LGT"
  difficulty: 2
  tags:
  - "inembargabilidad"
# anchor: boe-a-2000-323-art-605
- id: m03-l12-q0064
  prompt:
    es: "¿Cuál de los siguientes bienes es inembargable en absoluto, según el artículo 605 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil?"
  options:
  - id: a
    correct: true
    text:
      es: "Los animales de compañía, sin perjuicio de la embargabilidad de las rentas que puedan generar."
  - id: b
    text:
      es: "Los libros e instrumentos necesarios para la profesión cuando su valor guarde proporción con la deuda."
  - id: c
    text:
      es: "El mobiliario y el menaje de la casa que pueda considerarse superfluo."
  - id: d
    text:
      es: "Los vehículos del ejecutado destinados al trabajo cuando su valor no exceda de la deuda."
  explanation:
    es: "El artículo 605 LEC declara inembargables en absoluto, entre otros, los animales de compañía, aunque sus rentas sí son embargables. El mobiliario solo es inembargable en lo que no sea superfluo, y los libros e instrumentos de la profesión solo cuando su valor no guarda proporción con la deuda: ambos están en el artículo 606, que regula los bienes inembargables del ejecutado. Los vehículos no figuran como inembargables."
  citation: "art. 605 LEC"
  difficulty: 2
  tags:
  - "inembargabilidad"
# anchor: boe-a-2000-323-art-606
- id: m03-l12-q0065
  prompt:
    es: "Señale la respuesta CORRECTA sobre los bienes que son inembargables del ejecutado, según el artículo 606 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil:"
  options:
  - id: a
    correct: true
    text:
      es: "Los libros e instrumentos necesarios para el ejercicio de la profesión, arte u oficio, cuando su valor no guarde proporción con la cuantía de la deuda reclamada."
  - id: b
    text:
      es: "Los libros e instrumentos necesarios para el ejercicio de la profesión, cuando su valor guarde proporción con la cuantía de la deuda reclamada."
  - id: c
    text:
      es: "Los bienes y cantidades declarados inembargables por cualquier norma de rango reglamentario."
  - id: d
    text:
      es: "Los bienes sacros y los dedicados al culto de cualquier religión, esté o no registrada."
  explanation:
    es: "La inembargabilidad de libros e instrumentos profesionales opera cuando su valor no guarda proporción con la deuda (art. 606.2.º LEC). Si guarda proporción, sí se pueden embargar. Los bienes de culto solo son inembargables si pertenecen a religiones legalmente registradas. Las cantidades inembargables lo son por ley o por tratados ratificados por España, no por reglamento."
  citation: "art. 606 LEC"
  difficulty: 2
  tags:
  - "inembargabilidad"
# anchor: boe-a-2000-323-art-607
- id: m03-l12-q0066
  prompt:
    es: "Conforme al artículo 607.1 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil, es inembargable el salario, sueldo, pensión, retribución o su equivalente que:"
  options:
  - id: a
    text:
      es: "no exceda del doble de la cuantía señalada para el salario mínimo interprofesional."
  - id: b
    correct: true
    text:
      es: "no exceda de la cuantía señalada para el salario mínimo interprofesional."
  - id: c
    text:
      es: "no exceda de la cuantía del indicador público de renta de efectos múltiples."
  - id: d
    text:
      es: "no exceda de la mitad de la cuantía señalada para el salario mínimo interprofesional."
  explanation:
    es: "El tramo inembargable llega hasta el salario mínimo interprofesional (art. 607.1 LEC). El doble del salario mínimo es el límite del primer tramo embargable al 30 por ciento. La mitad del salario mínimo y el indicador público de renta no son referencias de este artículo."
  citation: "art. 607.1 LEC"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2000-323-art-607
- id: m03-l12-q0069
  prompt:
    es: "A efectos de este ejemplo, el salario mínimo interprofesional se fija en 1.000 euros mensuales. Rosa Pardo cobra un sueldo de 2.500 euros al mes, sin otras percepciones ni rebajas por cargas familiares. Conforme al artículo 607 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil, ¿cuánto se puede embargar de ese sueldo?"
  options:
  - id: a
    text:
      es: "1.500 euros, restando solo el salario mínimo interprofesional."
  - id: b
    text:
      es: "1.250 euros, aplicando el 50 por 100 a todo el sueldo."
  - id: c
    text:
      es: "750 euros, aplicando el 30 por 100 a todo el sueldo."
  - id: d
    correct: true
    text:
      es: "550 euros, aplicando la escala de tramos del artículo 607.2."
  explanation:
    es: "El primer salario mínimo (1.000) es inembargable. Entre 1.000 y 2.000 euros se embarga el 30 por 100: 1.000 × 0,30 = 300 euros. Entre 2.000 y 2.500 euros se embarga el 50 por 100: 500 × 0,50 = 250 euros. Total: 550 euros (art. 607.1 y 607.2.1.º y 2.º LEC). Los 750 euros aplican el 30 por 100 a todo el sueldo. Los 1.250 aplican el 50 por 100 a todo el sueldo. Los 1.500 euros resultan de restar solo el salario mínimo, sin escala."
  citation: "art. 607.2 LEC"
  difficulty: 3
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-82
- id: m03-l12-q0071
  prompt:
    es: "Si el obligado al pago es beneficiario de más de una percepción de sueldos, salarios o pensiones, el artículo 82.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que:"
  options:
  - id: a
    correct: true
    text:
      es: "se acumulan para deducir sobre la suma de todas ellas la parte inembargable."
  - id: b
    text:
      es: "se embarga solo la de mayor importe, aplicando a ella la parte inembargable."
  - id: c
    text:
      es: "se embarga la de menor importe antes que las demás, sin aplicar parte inembargable."
  - id: d
    text:
      es: "se aplica a cada percepción por separado la parte inembargable correspondiente."
  explanation:
    es: "Las percepciones se suman y la parte inembargable se deduce una sola vez sobre el total (art. 82.2 RGR). Aplicarla a cada percepción por separado multiplicaría la parte inembargable. Tampoco se limita el embargo a una de ellas ni se prescinde de la parte inembargable."
  citation: "art. 82.2 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-75
- id: m03-l12-q0072
  prompt:
    es: "Transcurrido el plazo del artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria sin ingreso, el artículo 75.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se procederá al embargo de los bienes y derechos que procedan, siempre que:"
  options:
  - id: a
    text:
      es: "se haya declarado previamente fallido al obligado al pago y no existan responsables solidarios de la deuda."
  - id: b
    correct: true
    text:
      es: "no se haya pagado la deuda por la ejecución de garantías o no sea previsible, de forma motivada, que de esa ejecución resulte líquido suficiente para cubrirla."
  - id: c
    text:
      es: "el obligado al pago no haya ofrecido bienes en garantía durante el período voluntario de ingreso."
  - id: d
    text:
      es: "no se haya notificado al obligado el inicio del procedimiento de apremio ni se haya presentado solicitud de aplazamiento o fraccionamiento de la deuda en período voluntario."
  explanation:
    es: "El embargo se hace tras el plazo del artículo 62.5 LGT si no se ha cobrado por ejecución de garantías o es previsible, de forma motivada, que esa ejecución no dará líquido suficiente (art. 75.1 RGR). La declaración de fallido es posterior, cuando no hay bienes embargables. El texto tampoco condiciona el embargo a que el obligado no haya ofrecido garantías en voluntaria ni a que falten responsables solidarios."
  citation: "art. 75.1 RGR"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-75
- id: m03-l12-q0073
  prompt:
    es: "Según el artículo 75.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cómo se documenta cada actuación de embargo en el procedimiento de apremio?"
  options:
  - id: a
    correct: true
    text:
      es: "En una diligencia de embargo."
  - id: b
    text:
      es: "En un acta de embargo."
  - id: c
    text:
      es: "En un mandamiento de embargo."
  - id: d
    text:
      es: "En una providencia de embargo."
  explanation:
    es: "Cada actuación se documenta en diligencia de embargo (art. 75.2 RGR). La providencia es el acto que inicia el apremio y la dicta el órgano de recaudación (providencia de apremio). El mandamiento es el documento que se dirige al registrador para la anotación preventiva (art. 84.2 RGR). El acta no es el documento del embargo en este artículo."
  citation: "art. 75.2 RGR"
  difficulty: 1
  tags:
  - "documento"
# anchor: boe-a-2005-14803-art-75
- id: m03-l12-q0074
  prompt:
    es: "Conforme al artículo 75.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre las deudas de un mismo obligado al pago en las diligencias de embargo:"
  options:
  - id: a
    text:
      es: "Pueden acumularse en una diligencia de embargo y, una vez acumuladas, no pueden segregarse."
  - id: b
    text:
      es: "Deben tramitarse siempre en diligencias separadas, sin que sea posible acumularlas."
  - id: c
    text:
      es: "Solo pueden acumularse las deudas de la misma naturaleza tributaria y del mismo período."
  - id: d
    correct: true
    text:
      es: "Pueden acumularse en una diligencia de embargo y, cuando las necesidades del procedimiento lo exijan, se segregan las deudas acumuladas."
  explanation:
    es: "Las deudas del mismo obligado pueden acumularse y, si lo exige el procedimiento, se segregan (art. 75.3 RGR). La acumulación no está prohibida, la segregación sí cabe, y el artículo no limita la acumulación a deudas de la misma naturaleza o período."
  citation: "art. 75.3 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0075
  prompt:
    es: "Si los bienes embargables están en locales de personas o entidades distintas del obligado al pago, el artículo 76.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que:"
  options:
  - id: a
    text:
      es: "se solicita autorización judicial para entrar en el local y trabar los bienes."
  - id: b
    text:
      es: "se difiere el embargo hasta que el obligado al pago recupere la posesión de los bienes."
  - id: c
    correct: true
    text:
      es: "se ordena al depositario o a su personal dependiente la entrega de los bienes, que se detallan en la diligencia."
  - id: d
    text:
      es: "se notifica al titular del local el embargo y se le nombra administrador de los bienes."
  explanation:
    es: "Los bienes que están en locales ajenos se reclaman al depositario o a su personal, y se detallan en la diligencia (art. 76.1 RGR). El precepto no exige autorización judicial, ni nombra administrador al titular del local, ni aplaza el embargo."
  citation: "art. 76.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0076
  prompt:
    es: "Cuando en la fase de traba o en la de ejecución se presume que el resultado de la enajenación puede ser insuficiente para cubrir la deuda, el artículo 76.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que:"
  options:
  - id: a
    correct: true
    text:
      es: "se procede al embargo de otros bienes y derechos."
  - id: b
    text:
      es: "se suspende el procedimiento hasta que se complete la valoración de los bienes."
  - id: c
    text:
      es: "se declara fallido al obligado al pago y se inicia la derivación de responsabilidad."
  - id: d
    text:
      es: "se da por cubierta la deuda con el resultado de la enajenación realizada."
  explanation:
    es: "Si el producto previsible de la enajenación no cubre la deuda, se embargan otros bienes y derechos (art. 76.2 RGR). No se suspende el procedimiento, ni se declara fallido al obligado mientras haya bienes embargables, ni se da por cubierta una deuda que no lo está."
  citation: "art. 76.2 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0077
  prompt:
    es: "¿Cuál de las siguientes personas debe ser notificada de la diligencia de embargo, además del obligado al pago, cuando los bienes embargados sean gananciales o se trate de la vivienda habitual, según el artículo 76.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El registrador de la propiedad del lugar donde radiquen los bienes."
  - id: b
    text:
      es: "Los acreedores hipotecarios anteriores al embargo."
  - id: c
    correct: true
    text:
      es: "El cónyuge del obligado al pago."
  - id: d
    text:
      es: "El arrendador de la vivienda habitual del obligado."
  explanation:
    es: "El artículo 76.3 RGR obliga a notificar al cónyuge cuando los bienes son gananciales o es la vivienda habitual. El arrendador solo se notifica en el embargo de establecimientos arrendados (art. 90.4 RGR). El registrador recibe el mandamiento de anotación, no la notificación de la diligencia. Los acreedores hipotecarios se notifican en el acuerdo de enajenación (art. 101.2 RGR)."
  citation: "art. 76.3 RGR"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0080
  prompt:
    es: "Si una vez realizado el embargo se comprueba que concurren las circunstancias del artículo 169.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el artículo 76.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que:"
  options:
  - id: a
    text:
      es: "se suspende el embargo hasta que se resuelva sobre la inembargabilidad."
  - id: b
    correct: true
    text:
      es: "se procede al levantamiento del embargo."
  - id: c
    text:
      es: "se sustituye el bien por otro de la misma clase y valor."
  - id: d
    text:
      es: "se mantiene el embargo hasta que lo solicite el obligado al pago."
  explanation:
    es: "Comprobada una causa de inembargabilidad del artículo 169.5 LGT, el embargo se levanta (art. 76.4 RGR). No se mantiene a la espera de que lo pida el obligado, ni se sustituye el bien, ni basta con suspenderlo."
  citation: "art. 76.4 RGR"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-76
- id: m03-l12-q0081
  prompt:
    es: "Conforme al artículo 76.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la inexistencia de bienes embargables conocidos por la Administración cuya ejecución permita el cobro de la deuda:"
  options:
  - id: a
    text:
      es: "obliga a notificar al obligado al pago el archivo definitivo del expediente."
  - id: b
    text:
      es: "supone la extinción de la deuda por insolvencia del obligado."
  - id: c
    correct: true
    text:
      es: "se hará constar en el expediente."
  - id: d
    text:
      es: "determina la declaración inmediata de prescripción de la deuda."
  explanation:
    es: "Si no hay bienes embargables conocidos que permitan cobrar, solo se deja constancia en el expediente (art. 76.6 RGR). No prescribe la deuda por ese hecho, no se archiva con notificación obligatoria y la insolvencia no extingue la deuda por sí sola."
  citation: "art. 76.6 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0225
  prompt:
    es: "¿Cuándo se entiende, según el artículo 169.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, que un crédito, efecto, valor o derecho es realizable a corto plazo a efectos de embargo?"
  options:
  - id: a
    text:
      es: "Cuando, con independencia de las circunstancias y a juicio del órgano de recaudación, pueda ser realizado en un plazo no superior a seis meses."
  - id: b
    text:
      es: "Cuando, en circunstancias normales y a juicio del obligado tributario, pueda ser realizado en un plazo no superior a seis meses."
  - id: c
    correct: true
    text:
      es: "Cuando, en circunstancias normales y a juicio del órgano de recaudación, pueda ser realizado en un plazo no superior a seis meses."
  - id: d
    text:
      es: "Cuando, en circunstancias normales y a juicio del órgano de recaudación, pueda ser realizado en un plazo no superior a tres meses."
  explanation:
    es: "La definición de corto plazo combina tres elementos: circunstancias normales, juicio del órgano de recaudación y plazo no superior a seis meses (art. 169.3 LGT). El juicio no es del obligado. El plazo no es de tres meses. Y las circunstancias que se tienen en cuenta son las normales, no cualesquiera."
  citation: "art. 169.3 LGT"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0226
  prompt:
    es: "Siguiendo el orden subsidiario del artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, inmediatamente antes de los créditos, efectos, valores y derechos realizables a largo plazo se embargan:"
  options:
  - id: a
    text:
      es: "los metales preciosos, piedras finas, joyería, orfebrería y antigüedades."
  - id: b
    text:
      es: "los establecimientos mercantiles o industriales del obligado tributario."
  - id: c
    text:
      es: "los intereses, rentas y frutos de toda especie del obligado tributario."
  - id: d
    correct: true
    text:
      es: "los bienes muebles y semovientes."
  explanation:
    es: "Los bienes muebles y semovientes son la letra h, justo antes de los créditos, efectos, valores y derechos a largo plazo de la letra i (art. 169.2 LGT). Los metales preciosos son la letra g, los establecimientos mercantiles o industriales la letra f y los intereses, rentas y frutos la letra e."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0227
  prompt:
    es: "¿Qué se embarga inmediatamente antes de los metales preciosos, piedras finas, joyería, orfebrería y antigüedades, según el orden del artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los establecimientos mercantiles o industriales."
  - id: b
    text:
      es: "Los intereses, rentas y frutos de toda especie del obligado."
  - id: c
    text:
      es: "Los bienes muebles y semovientes."
  - id: d
    text:
      es: "Los bienes inmuebles."
  explanation:
    es: "Los establecimientos mercantiles o industriales son la letra f, y los metales preciosos la g (art. 169.2 LGT). Los inmuebles y los intereses, rentas y frutos van antes, en las letras d y e. Los bienes muebles y semovientes van después, en la letra h."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0228
  prompt:
    es: "Según el artículo 169.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el orden subsidiario de embargo, los créditos, efectos, valores y derechos realizables en el acto o a corto plazo ocupan el lugar:"
  options:
  - id: a
    correct: true
    text:
      es: "segundo, inmediatamente después del dinero efectivo o en cuentas abiertas en entidades de crédito."
  - id: b
    text:
      es: "tercero, inmediatamente después de los sueldos, salarios y pensiones del obligado tributario embargado."
  - id: c
    text:
      es: "cuarto, inmediatamente después de los bienes inmuebles del obligado tributario."
  - id: d
    text:
      es: "primero, antes del dinero efectivo o en cuentas abiertas en entidades de crédito."
  explanation:
    es: "Los créditos, efectos, valores y derechos realizables a corto plazo son la letra b, tras el dinero y las cuentas de la letra a (art. 169.2 LGT). Los sueldos, salarios y pensiones son la letra c y los inmuebles la letra d, así que ninguno precede a los créditos."
  citation: "art. 169.2 LGT"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2000-323-art-605
- id: m03-l12-q0229
  prompt:
    es: "Conforme al artículo 605 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil, señale cuál de los siguientes bienes es inembargable en absoluto:"
  options:
  - id: a
    text:
      es: "El mobiliario y el menaje de la casa, en lo que no pueda considerarse superfluo."
  - id: b
    correct: true
    text:
      es: "Los bienes que hayan sido declarados inalienables."
  - id: c
    text:
      es: "Los libros e instrumentos necesarios para el ejercicio de la profesión, cuando su valor no guarde proporción con la deuda."
  - id: d
    text:
      es: "Los bienes sacros y los dedicados al culto de las religiones legalmente registradas."
  explanation:
    es: "Entre los bienes inembargables en absoluto del artículo 605 LEC están los declarados inalienables, los derechos accesorios no alienables con independencia del principal, los que carecen de contenido patrimonial y los expresamente declarados inembargables por ley. Los libros e instrumentos profesionales, el mobiliario y los bienes sacros son inembargables del ejecutado según el artículo 606."
  citation: "art. 605 LEC"
  difficulty: 2
  tags:
  - "inembargabilidad"
