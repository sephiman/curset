# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q041
  prompt:
    es: "¿Cuál de los siguientes es uno de los dos ejes transversales del V Plan de Gobierno Abierto de España 2025-2029?"
  options:
  - id: a
    text:
      es: "La protección de denunciantes y la integridad pública."
  - id: b
    correct: true
    text:
      es: "La alineación con los Objetivos de Desarrollo Sostenible de la Agenda 2030."
  - id: c
    text:
      es: "La apertura de datos y la reutilización de la información pública."
  - id: d
    text:
      es: "La reforma del marco regulatorio de la transparencia."
  explanation:
    es: "Los dos ejes transversales del V Plan son la alineación con los Objetivos de Desarrollo Sostenible de la Agenda 2030 y la promoción de la inclusión social, la igualdad y la accesibilidad universal. Las demás opciones son materias de compromisos concretos, no ejes transversales."
  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 2
  tags:
  - "estructura"
