  - id: c
    text:
      es: "Se mantiene el período voluntario hasta que se resuelva sobre el resto de fracciones."
  - id: d
    text:
      es: "El período ejecutivo se inicia a los diez días del vencimiento de la fracción incumplida."
  explanation:
