# anchor: boe-a-2003-23186-art-213
- id: m03-l14-q0001
  prompt:
    es: "De acuerdo con el artículo 213.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los actos de aplicación de los tributos y los actos de imposición de sanciones tributarias podrán revisarse mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "Los procedimientos especiales de revisión, el recurso de reposición y las reclamaciones económico-administrativas."
  - id: b
    text:
      es: "El recurso de reposición, el recurso de alzada y el recurso contencioso-administrativo ante la jurisdicción."
  - id: c
    text:
      es: "Los procedimientos especiales de revisión y las reclamaciones económico-administrativas, sin recurso de reposición."
  - id: d
    text:
      es: "Los procedimientos especiales de revisión, el recurso de alzada y las reclamaciones económico-administrativas."
  explanation:
    es: "El artículo 213.1 enumera tres medios: los procedimientos especiales de revisión, el recurso de reposición y las reclamaciones económico-administrativas. La lista con el recurso de alzada en lugar de la reposición cambia uno de los tres. El recurso contencioso-administrativo es judicial, no un medio de revisión en vía administrativa. Y quitar la reposición deja la lista en dos medios."
  citation: "art. 213.1 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "medios"
# anchor: boe-a-2003-23186-art-213
- id: m03-l14-q0002
  prompt:
    es: "En relación con las resoluciones firmes de los órganos económico-administrativos y el artículo 213.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Pueden revisarse en vía administrativa por cualquier procedimiento especial de revisión mientras no hayan prescrito los derechos de la Administración."
  - id: b
    text:
      es: "Pueden revisarse en vía administrativa mediante el recurso de reposición, siempre que no hayan transcurrido cuatro años desde su notificación."
  - id: c
    correct: true
    text:
      es: "No pueden revisarse en vía administrativa, cualquiera que sea la causa alegada, salvo por nulidad de pleno derecho, rectificación de errores o recurso extraordinario de revisión."
  - id: d
    text:
      es: "No pueden revisarse en vía administrativa, cualquiera que sea la causa alegada, salvo por revocación, rectificación de errores o recurso extraordinario de revisión."
  explanation:
    es: "El artículo 213.2 cierra la lista de excepciones: nulidad de pleno derecho (art. 217), rectificación de errores (art. 220) y recurso extraordinario de revisión (art. 244). La revocación no figura entre ellas. La reposición es un recurso contra actos de la Administración tributaria, no contra resoluciones económico-administrativas, y el plazo de cuatro años es el de la lesividad. Admitir cualquier procedimiento especial contradice el «cualquiera que sea la causa alegada»."
  citation: "art. 213.2 LGT"
  difficulty: 2
  tags:
  - "revisión"
  - "firmeza"
# anchor: boe-a-2003-23186-art-213
- id: m03-l14-q0004
  prompt:
    es: "Conforme al artículo 213.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de los siguientes actos queda fuera de toda revisión en vía administrativa?"
  options:
  - id: a
    text:
      es: "Una resolución económico-administrativa que contiene un error de hecho resultante de los documentos del expediente."
  - id: b
    correct: true
    text:
      es: "Una resolución de una reclamación económico-administrativa confirmada por sentencia judicial firme."
  - id: c
    text:
      es: "Un acto firme de la Administración tributaria contra el que aparecen documentos esenciales posteriores."
  - id: d
    text:
      es: "Una resolución firme de un tribunal económico-administrativo dictada por órgano manifiestamente incompetente."
  explanation:
    es: "Lo que impide toda revisión es la confirmación por sentencia judicial firme (art. 213.3). La resolución dictada por órgano manifiestamente incompetente puede anularse por nulidad de pleno derecho (art. 217.1.b). El error de hecho se corrige por rectificación de errores (art. 220.1). Y los documentos esenciales posteriores son motivo del recurso extraordinario de revisión (art. 244.1.a)."
  citation: "art. 213.3 LGT"
  difficulty: 1
  tags:
  - "revisión"
  - "sentencia"
# anchor: boe-a-2003-23186-art-215
- id: m03-l14-q0006
  prompt:
    es: "Según el artículo 215.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo deben ser las resoluciones de los procedimientos especiales de revisión, recursos y reclamaciones del título V?"
  options:
  - id: a
    text:
      es: "Escritas, con remisión a la propuesta del instructor, sin necesidad de referencia a hechos concretos."
  - id: b
    correct: true
    text:
      es: "Motivadas, con sucinta referencia a hechos y fundamentos de derecho."
  - id: c
    text:
      es: "Motivadas, con exposición detallada de todos los hechos probados y de la jurisprudencia aplicable."
  - id: d
    text:
      es: "Razonadas únicamente cuando estimen total o parcialmente la pretensión del interesado en el procedimiento."
  explanation:
    es: "El artículo 215.1 exige resoluciones motivadas, con una referencia sucinta a hechos y fundamentos de derecho. «Sucinta» descarta la exposición detallada. La remisión sin hechos concretos incumple la motivación. Y la obligación no depende de que la resolución sea estimatoria."
  citation: "art. 215.1 LGT"
  difficulty: 1
  tags:
  - "motivación"
# anchor: boe-a-2003-23186-art-216
- id: m03-l14-q0007
  prompt:
    es: "De acuerdo con el artículo 216 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de los siguientes es un procedimiento especial de revisión?"
  options:
  - id: a
    text:
      es: "La reclamación económico-administrativa en única instancia."
  - id: b
    text:
      es: "El recurso extraordinario de revisión."
  - id: c
    correct: true
    text:
      es: "La devolución de ingresos indebidos."
  - id: d
    text:
      es: "El recurso de reposición contra liquidaciones."
  explanation:
    es: "El artículo 216 enumera cinco procedimientos especiales: nulidad de pleno derecho, lesividad, revocación, rectificación de errores y devolución de ingresos indebidos. El recurso extraordinario de revisión es un recurso del artículo 244, la reclamación económico-administrativa es otro medio de revisión del artículo 213.1 y la reposición es el tercero."
  citation: "art. 216 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "procedimientos"
# anchor: boe-a-2003-23186-art-216
- id: m03-l14-q0008
  prompt:
    es: "Conforme al artículo 216 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuántos procedimientos especiales de revisión enumera ese precepto como clases de procedimientos especiales?"
  options:
  - id: a
    text:
      es: "Cuatro: nulidad, lesividad, revocación y rectificación de errores."
  - id: b
    text:
      es: "Seis, incluido el recurso extraordinario de revisión."
  - id: c
    correct: true
    text:
      es: "Cinco: nulidad, lesividad, revocación, rectificación de errores y devolución de ingresos indebidos."
  - id: d
    text:
      es: "Tres: nulidad, revocación y rectificación de errores."
  explanation:
    es: "El artículo 216 enumera cinco: nulidad de pleno derecho, declaración de lesividad, revocación, rectificación de errores y devolución de ingresos indebidos. El recurso extraordinario de revisión no es uno de ellos: se regula aparte, en el artículo 244."
  citation: "art. 216 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "procedimientos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0009
  prompt:
    es: "Un tribunal económico-administrativo dictó una resolución que no fue recurrida en plazo. Después se advierte que la dictó un órgano manifiestamente incompetente por razón de la materia. Según el artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué procedimiento especial de revisión permite anularla?"
  options:
  - id: a
    correct: true
    text:
      es: "La declaración de nulidad de pleno derecho."
  - id: b
    text:
      es: "La declaración de lesividad."
  - id: c
    text:
      es: "La rectificación de errores."
  - id: d
    text:
      es: "La devolución de ingresos indebidos."
  explanation:
    es: "El artículo 217.1 admite la nulidad de pleno derecho de resoluciones de los órganos económico-administrativos que no han sido recurridas en plazo, entre otros casos si las dictó un órgano manifiestamente incompetente por razón de la materia. La rectificación solo corrige errores materiales, de hecho o aritméticos. La lesividad se aplica a actos favorables al interesado para impugnarlos en vía contenciosa. La devolución de ingresos indebidos reconoce un derecho a devolución, no anula la resolución."
  citation: "art. 217.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "nulidad"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0010
  prompt:
    es: "Conforme al artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, puede declararse la nulidad de pleno derecho de los actos dictados en materia tributaria que hayan sido dictados por órgano:"
  options:
  - id: a
    text:
      es: "Incompetente por razón del tiempo o del lugar de notificación."
  - id: b
    text:
      es: "Incompetente por razón del grado o de la jerarquía."
  - id: c
    text:
      es: "Manifiestamente incompetente por razón de la cuantía."
  - id: d
    correct: true
    text:
      es: "Manifiestamente incompetente por razón de la materia o del territorio."
  explanation:
    es: "El artículo 217.1.b exige incompetencia manifiesta y limita su origen a la materia o al territorio. La incompetencia por jerarquía o grado, por cuantía o por el tiempo y el lugar de notificación no figura en la lista cerrada del precepto."
  citation: "art. 217.1 LGT"
  difficulty: 1
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0011
  prompt:
    es: "Según el artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuál de los siguientes supuestos puede declararse la nulidad de pleno derecho de un acto dictado en materia tributaria?"
  options:
  - id: a
    text:
      es: "Cuando contenga un error aritmético que perjudique al interesado."
  - id: b
    text:
      es: "Cuando se haya dictado fuera del plazo máximo de resolución del procedimiento."
  - id: c
    text:
      es: "Cuando se dicte con un defecto de forma que no cause indefensión alguna."
  - id: d
    correct: true
    text:
      es: "Cuando lesione derechos y libertades susceptibles de amparo constitucional."
  explanation:
    es: "La lesión de derechos y libertades susceptibles de amparo constitucional es la letra a) del artículo 217.1. La resolución fuera de plazo, el error aritmético y el defecto de forma sin indefensión no están en la lista cerrada. El error aritmético se corrige por rectificación de errores (art. 220)."
  citation: "art. 217.1 LGT"
  difficulty: 1
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0012
  prompt:
    es: "De acuerdo con el artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, uno de los supuestos de nulidad de pleno derecho de los actos dictados en materia tributaria es que tengan un contenido:"
  options:
  - id: a
    text:
      es: "Contradictorio con otro acto anterior."
  - id: b
    text:
      es: "Gravoso para el interesado."
  - id: c
    correct: true
    text:
      es: "Imposible."
  - id: d
    text:
      es: "Desfavorable para el interés público."
  explanation:
    es: "La letra c) del artículo 217.1 habla de actos de contenido imposible. Que el acto contradiga otro anterior, que resulte gravoso o que sea desfavorable para el interés público no es causa de nulidad de pleno derecho en ese artículo."
  citation: "art. 217.1 LGT"
  difficulty: 1
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0013
  prompt:
    es: "Respecto de los supuestos del artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la afirmación CORRECTA:"
  options:
  - id: a
    text:
      es: "Pueden declararse nulos los actos que hayan sido dictados prescindiendo parcialmente del procedimiento legalmente establecido."
  - id: b
    text:
      es: "Pueden declararse nulos los actos que no estén motivados, con independencia de su contenido y de sus efectos."
  - id: c
    correct: true
    text:
      es: "Pueden declararse nulos los actos que hayan sido dictados prescindiendo total y absolutamente del procedimiento legalmente establecido."
  - id: d
    text:
      es: "Pueden declararse nulos los actos presuntos que reconozcan derechos aunque se cumplan los requisitos esenciales para adquirirlos."
  explanation:
    es: "La letra e) exige prescindir total y absolutamente del procedimiento legalmente establecido, no parcialmente. La letra f) se refiere a actos por los que se adquieren facultades o derechos cuando se carece de los requisitos esenciales, no cuando se cumplen. La falta de motivación no es causa del artículo 217.1."
  citation: "art. 217.1 LGT"
  difficulty: 3
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0014
  prompt:
    es: "Según el artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, pueden declararse nulos de pleno derecho los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de:"
  options:
  - id: a
    text:
      es: "La notificación al obligado tributario afectado."
  - id: b
    correct: true
    text:
      es: "Los requisitos esenciales para su adquisición."
  - id: c
    text:
      es: "El informe favorable de la Administración competente."
  - id: d
    text:
      es: "El plazo mínimo de vigencia de la facultad adquirida."
  explanation:
    es: "La letra f) del artículo 217.1 se refiere a actos contrarios al ordenamiento por los que se adquieren facultades o derechos sin los requisitos esenciales. Ni la falta de notificación, ni la de un informe, ni la de un plazo de vigencia son el criterio del precepto."
  citation: "art. 217.1 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0015
  prompt:
    es: "¿Puede declararse la nulidad de pleno derecho de un acto tributario que sea constitutivo de infracción penal, conforme al artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "No, salvo que el acto lesione además derechos susceptibles de amparo constitucional."
  - id: b
    correct: true
    text:
      es: "Sí, tanto si es constitutivo de infracción penal como si se dicta como consecuencia de ella."
  - id: c
    text:
      es: "No, porque la infracción penal solo permite la revisión por el recurso extraordinario de revisión."
  - id: d
    text:
      es: "Sí, pero solo si una sentencia penal firme declara previamente la infracción."
  explanation:
    es: "La letra d) incluye los actos constitutivos de infracción penal y los dictados como consecuencia de ella, sin exigir sentencia previa ni otro requisito concurrente. El recurso extraordinario de revisión se regula aparte (art. 244) y no excluye la nulidad."
  citation: "art. 217.1 LGT"
  difficulty: 1
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0016
  prompt:
    es: "Según el artículo 217.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué otros actos pueden ser declarados nulos de pleno derecho además de los enumerados en las letras a) a f)?"
  options:
  - id: a
    text:
      es: "Cualquier otro que el órgano competente considere contrario al interés público."
  - id: b
    text:
      es: "Cualquier otro que haya sido recurrido en plazo ante un tribunal económico-administrativo."
  - id: c
    text:
      es: "Cualquier otro que se establezca en una disposición reglamentaria o en una circular."
  - id: d
    correct: true
    text:
      es: "Cualquier otro que se establezca expresamente en una disposición de rango legal."
  explanation:
    es: "La letra g) remite a otros supuestos establecidos expresamente en una disposición de rango legal. Una norma reglamentaria o una circular no tienen ese rango. El interés público es criterio de la lesividad y la revocación. Y un acto recurrido en plazo no entra en este precepto sin una causa del listado."
  citation: "art. 217.1 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "supuestos"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0018
  prompt:
    es: "Conforme al artículo 217.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, puede acordarse motivadamente la inadmisión a trámite de las solicitudes de nulidad, sin recabar dictamen del órgano consultivo, cuando el acto:"
  options:
  - id: a
    correct: true
    text:
      es: "No sea firme en vía administrativa."
  - id: b
    text:
      es: "Haya sido dictado por un órgano jerárquicamente superior."
  - id: c
    text:
      es: "Haya sido notificado hace más de cuatro años."
  - id: d
    text:
      es: "Haya sido objeto de una solicitud anterior estimada en cuanto al fondo."
  explanation:
    es: "Entre las causas de inadmisión del artículo 217.3 está que el acto no sea firme en vía administrativa. Los cuatro años son el límite de la lesividad. Que lo dicte un superior no es causa. Y la inadmisión por solicitudes anteriores se refiere a las desestimadas en cuanto al fondo, no a las estimadas."
  citation: "art. 217.3 LGT"
  difficulty: 3
  tags:
  - "nulidad"
  - "inadmisión"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0019
  prompt:
    es: "En el procedimiento de nulidad de pleno derecho del artículo 217 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el apartado 3 permite inadmitir a trámite una solicitud sin necesidad de recabar dictamen. Señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Puede inadmitirse si el solicitante no es obligado tributario, aunque la solicitud se base en una causa de nulidad."
  - id: b
    text:
      es: "Puede inadmitirse sin motivar si ya se desestimó otra solicitud en cuanto a la forma."
  - id: c
    correct: true
    text:
      es: "Puede inadmitirse si la solicitud no se basa en alguna de las causas de nulidad del apartado 1 o carece manifiestamente de fundamento."
  - id: d
    text:
      es: "Puede inadmitirse únicamente si el acto ya fue confirmado por sentencia judicial firme."
  explanation:
    es: "La inadmisión del artículo 217.3 se acuerda de forma motivada y procede, entre otros casos, cuando la solicitud no se basa en las causas del apartado 1 o carece manifiestamente de fundamento. No exige que el solicitante sea obligado tributario. Debe motivarse. Y sustancialmente iguales se refiere a solicitudes desestimadas en cuanto al fondo. La sentencia firme es un límite del artículo 213.3, no la única causa."
  citation: "art. 217.3 LGT"
  difficulty: 3
  tags:
  - "nulidad"
  - "inadmisión"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0020
  prompt:
    es: "De acuerdo con el artículo 217.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la declaración de nulidad de pleno derecho requiere dictamen favorable previo:"
  options:
  - id: a
    text:
      es: "Del órgano con funciones de asesoramiento jurídico de la propia Agencia Tributaria."
  - id: b
    text:
      es: "Del Tribunal Económico-Administrativo Central o del tribunal regional competente."
  - id: c
    text:
      es: "De la Dirección General de Tributos del Ministerio de Hacienda."
  - id: d
    correct: true
    text:
      es: "Del Consejo de Estado u órgano equivalente de la respectiva comunidad autónoma, si lo hubiere."
  explanation:
    es: "El dictamen es del Consejo de Estado u órgano autonómico equivalente. Los tribunales económico-administrativos son órganos de revisión, no consultivos. La Dirección General de Tributos y el servicio jurídico de la Agencia no emiten el dictamen. El informe del órgano de asesoramiento jurídico lo exige la revocación (art. 219.3)."
  citation: "art. 217.4 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "dictamen"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0021
  prompt:
    es: "En el procedimiento de nulidad de pleno derecho, ¿a quiénes se da audiencia o se oye, según el artículo 217.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Al interesado y a aquellos a quienes el acto reconoció derechos o cuyos intereses resultaron afectados por él."
  - id: b
    text:
      es: "Solo al interesado que haya presentado la solicitud de nulidad, y no a los terceros cuyos intereses resulten afectados por el acto."
  - id: c
    text:
      es: "Al interesado y al órgano que dictó el acto, pero no a terceros afectados."
  - id: d
    text:
      es: "Al interesado y a cualquier ciudadano que lo solicite durante el trámite de información pública."
  explanation:
    es: "El artículo 217.4 amplía la audiencia más allá del solicitante: se oye también a quienes el acto reconoció derechos o cuyos intereses resultaron afectados. No hay información pública abierta a cualquier ciudadano. Y los terceros afectados no quedan excluidos."
  citation: "art. 217.4 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "audiencia"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0022
  prompt:
    es: "Según el artículo 217.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el ámbito de competencias del Estado, la resolución del procedimiento de nulidad de pleno derecho corresponde al:"
  options:
  - id: a
    text:
      es: "Secretario de Estado de Hacienda."
  - id: b
    correct: true
    text:
      es: "Ministro de Hacienda."
  - id: c
    text:
      es: "Presidente del Tribunal Económico-Administrativo Central."
  - id: d
    text:
      es: "Director General de la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "El artículo 217.5 atribuye la resolución al Ministro de Hacienda en el ámbito del Estado. El Director General de la Agencia, el Secretario de Estado y el presidente del Tribunal Económico-Administrativo Central son órganos de otro nivel o de otra función."
  citation: "art. 217.5 LGT"
