  explanation:
    es: "En conformidad, el artículo 188.2.b LGT reclama el importe de la reducción cuando se recurre la regularización. Recurrir solo la sanción no hace perder la reducción por conformidad, según el artículo 212.2. La providencia de apremio no figura en el precepto."
  citation: "art. 188.2 LGT"
  difficulty: 1
  tags:
