# anchor: celex-32016r0679-art-99
- id: m02-l04-q001
  prompt:
    es: "¿Desde qué fecha es aplicable el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales?"
  options:
  - id: a
    text:
      es: "A partir del 27 de abril de 2016."
  - id: b
    text:
      es: "A partir del 25 de mayo de 2017."
  - id: c
    correct: true
    text:
      es: "A partir del 25 de mayo de 2018."
  - id: d
    text:
      es: "A partir del 1 de enero de 2018."
  explanation:
    es: "El artículo 99.2 dice que el Reglamento «será aplicable a partir del 25 de mayo de 2018». El 27 de abril de 2016 es la fecha del propio Reglamento, no la de su aplicación. El 25 de mayo de 2017 y el 1 de enero de 2018 no aparecen en el artículo 99."
  citation: "art. 99.2 RGPD"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-2018-16673-art-1
- id: m02-l04-q002
  prompt:
    es: "Según el artículo 1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál es uno de los objetos de esa ley orgánica?"
  options:
  - id: a
    correct: true
    text:
      es: "Adaptar el ordenamiento jurídico español al Reglamento (UE) 2016/679 y completar sus disposiciones."
  - id: b
    text:
      es: "Transponer al Derecho español el Reglamento (UE) 2016/679 y desarrollar sus disposiciones."
  - id: c
    text:
      es: "Adaptar el ordenamiento jurídico español a la Directiva 95/46/CE y completar sus disposiciones."
  - id: d
    text:
      es: "Sustituir en el ordenamiento jurídico español las disposiciones del Reglamento (UE) 2016/679."
  explanation:
    es: "El artículo 1.a) fija como objeto «adaptar el ordenamiento jurídico español al Reglamento (UE) 2016/679 […] y completar sus disposiciones». Un reglamento de la Unión no se transpone: es directamente aplicable, y la ley lo adapta y lo completa. La Directiva 95/46/CE es la norma que el Reglamento deroga. La ley tampoco sustituye las disposiciones del Reglamento."
  citation: "art. 1.a) LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-4
- id: m02-l04-q003
  prompt:
    es: "Según el Reglamento (UE) 2016/679, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales, son «datos personales»:"
  options:
  - id: a
    text:
      es: "Toda información sobre una persona física o jurídica identificada o identificable."
  - id: b
    correct: true
    text:
      es: "Toda información sobre una persona física identificada o identificable."
  - id: c
    text:
      es: "Toda información sobre una persona física identificada, excluida la solo identificable."
  - id: d
    text:
      es: "Toda información íntima o familiar sobre una persona física identificada o identificable."
  explanation:
    es: "El artículo 4.1 define los datos personales como «toda información sobre una persona física identificada o identificable». Las personas jurídicas quedan fuera de la definición. La persona identificable está incluida, no excluida. La definición alcanza a toda información, no solo a la íntima o familiar."
  citation: "art. 4.1 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-3
- id: m02-l04-q004
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿quiénes pueden dirigirse al responsable del tratamiento para solicitar el acceso a los datos de una persona fallecida?"
  options:
  - id: a
    correct: true
    text:
      es: "Las personas vinculadas al fallecido por razones familiares o de hecho y sus herederos."
  - id: b
    text:
      es: "Únicamente sus herederos, sean testamentarios o abintestato."
  - id: c
    text:
      es: "Las personas vinculadas al fallecido por razones familiares, con exclusión de las de hecho."
  - id: d
    text:
      es: "Únicamente sus parientes por consanguinidad hasta el segundo grado."
  explanation:
    es: "El artículo 3.1 dice que «las personas vinculadas al fallecido por razones familiares o de hecho así como sus herederos» pueden dirigirse al responsable o encargado para pedir el acceso. No se limita a los herederos. Incluye expresamente a las personas vinculadas por razones de hecho. No fija ningún grado de parentesco."
  citation: "art. 3.1 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-5
- id: m02-l04-q005
  prompt:
    es: "¿Qué nombre da el Reglamento (UE) 2016/679 al principio según el cual los datos personales serán adecuados, pertinentes y limitados a lo necesario en relación con los fines?"
  options:
  - id: a
    text:
      es: "Limitación de la finalidad."
  - id: b
    text:
      es: "Limitación del plazo de conservación."
  - id: c
    correct: true
    text:
      es: "Minimización de datos."
  - id: d
    text:
      es: "Integridad y confidencialidad."
  explanation:
    es: "El artículo 5.1.c) llama «minimización de datos» a la exigencia de que los datos sean «adecuados, pertinentes y limitados a lo necesario». La limitación de la finalidad es el artículo 5.1.b): fines determinados, explícitos y legítimos. La limitación del plazo de conservación es el 5.1.e). La integridad y confidencialidad es el 5.1.f), sobre la seguridad de los datos."
  citation: "art. 5.1 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-5
- id: m02-l04-q006
  prompt:
    es: "Según el artículo 5.2 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿cómo se denomina el principio por el que el responsable del tratamiento responde del cumplimiento de los principios y es capaz de demostrarlo?"
  options:
  - id: a
    correct: true
    text:
      es: "Responsabilidad proactiva."
  - id: b
    text:
      es: "Licitud, lealtad y transparencia."
  - id: c
    text:
      es: "Exactitud."
  - id: d
    text:
      es: "Integridad y confidencialidad."
  explanation:
    es: "El artículo 5.2 dice que el responsable «será responsable del cumplimiento de lo dispuesto en el apartado 1 y capaz de demostrarlo («responsabilidad proactiva»)». La licitud, lealtad y transparencia, la exactitud y la integridad y confidencialidad son principios del apartado 1, no el del apartado 2."
  citation: "art. 5.2 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-5
- id: m02-l04-q007
  prompt:
    es: "De acuerdo con el artículo 5.3 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el deber de confidencialidad de quienes intervienen en el tratamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Se mantiene aun cuando hubiese finalizado la relación del obligado con el responsable o encargado."
  - id: b
    text:
      es: "Se extingue cuando finaliza la relación del obligado con el responsable o encargado."
  - id: c
    text:
      es: "Se mantiene durante los cinco años siguientes al fin de la relación con el responsable."
  - id: d
    text:
      es: "Se mantiene solo mientras los datos sigan siendo objeto de tratamiento por el responsable."
  explanation:
    es: "El artículo 5.3 dice que las obligaciones de confidencialidad «se mantendrán aun cuando hubiese finalizado la relación del obligado con el responsable o encargado del tratamiento». No se extinguen al acabar esa relación. La ley no les pone un límite de cinco años. Tampoco las liga a que el tratamiento siga en curso."
  citation: "art. 5.3 LOPDGDD"
  difficulty: 1
  tags:
  - "efecto"
# anchor: celex-32016r0679-art-6
- id: m02-l04-q009
  prompt:
    es: "Según el artículo 6.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿qué condición de licitud queda excluida para el tratamiento realizado por las autoridades públicas en el ejercicio de sus funciones?"
  options:
  - id: a
    text:
      es: "El cumplimiento de una misión realizada en interés público."
  - id: b
    text:
      es: "El cumplimiento de una obligación legal aplicable al responsable."
  - id: c
    correct: true
    text:
      es: "La satisfacción de intereses legítimos del responsable o de un tercero."
  - id: d
    text:
      es: "La protección de intereses vitales del interesado o de otra persona."
  explanation:
    es: "El párrafo segundo del artículo 6.1 dice que la letra f), la de los intereses legítimos del responsable o de un tercero, «no será de aplicación al tratamiento realizado por las autoridades públicas en el ejercicio de sus funciones». La misión en interés público, la obligación legal y los intereses vitales son los artículos 6.1.e), 6.1.c) y 6.1.d), y la exclusión no los alcanza."
  citation: "art. 6.1 RGPD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-7
- id: m02-l04-q010
  prompt:
    es: "¿Cuándo puede fundarse en su propio consentimiento el tratamiento de los datos de un menor de edad, según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    text:
      es: "Cuando sea mayor de dieciséis años."
  - id: b
    text:
      es: "Cuando sea mayor de doce años."
  - id: c
    text:
      es: "Cuando sea mayor de trece años."
  - id: d
    correct: true
    text:
      es: "Cuando sea mayor de catorce años."
  explanation:
    es: "El artículo 7.1 dice que el tratamiento de los datos de un menor «únicamente podrá fundarse en su consentimiento cuando sea mayor de catorce años». Las edades de dieciséis, doce y trece años no son las que fija la ley orgánica."
  citation: "art. 7.1 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2018-16673-art-7
- id: m02-l04-q011
  prompt:
    es: "¿Cuál de los siguientes supuestos impide, según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, fundar el tratamiento de los datos de un menor de quince años solo en su consentimiento?"
  options:
  - id: a
    text:
      es: "Que el responsable del tratamiento sea una Administración pública o un organismo público."
  - id: b
    correct: true
    text:
      es: "Que la ley exija la asistencia de los titulares de la patria potestad o tutela para celebrar el acto."
  - id: c
    text:
      es: "Que los titulares de la patria potestad o tutela no hayan sido informados previamente del tratamiento."
  - id: d
    text:
      es: "Que el tratamiento de los datos se realice por medios automatizados o mediante perfiles."
  explanation:
    es: "El artículo 7.1 exceptúa de la regla de los catorce años «los supuestos en que la ley exija la asistencia de los titulares de la patria potestad o tutela para la celebración del acto o negocio jurídico» en cuyo contexto se recaba el consentimiento. Que el responsable sea una Administración no es una excepción. La ley no exige informar antes a los titulares de la patria potestad. El tratamiento automatizado tampoco cambia la regla."
  citation: "art. 7.1 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-9
- id: m02-l04-q012
  prompt:
    es: "Según el artículo 9.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, para levantar la prohibición del tratamiento de datos cuya finalidad principal sea identificar la religión del afectado:"
  options:
  - id: a
    text:
      es: "Bastará el consentimiento expreso y por escrito del afectado."
  - id: b
    correct: true
    text:
      es: "No bastará el solo consentimiento del afectado."
  - id: c
    text:
      es: "Bastará el consentimiento del afectado mayor de catorce años."
  - id: d
    text:
      es: "Bastará la autorización previa de la Agencia Española de Protección de Datos."
  explanation:
    es: "El artículo 9.1 dice que, a fin de evitar situaciones discriminatorias, «el solo consentimiento del afectado no bastará para levantar la prohibición» cuando la finalidad principal sea identificar, entre otras cosas, su religión. Ni el consentimiento por escrito ni el de un mayor de catorce años bastan por sí solos. La ley no prevé una autorización de la Agencia para este caso."
  citation: "art. 9.1 LOPDGDD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-22
- id: m02-l04-q013
  prompt:
    es: "Unas cámaras de seguridad captan imágenes el martes 9 de febrero de 2027 que no han de conservarse para acreditar actos contra la integridad de personas, bienes o instalaciones. Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿hasta qué fecha pueden conservarse?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el martes 9 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el viernes 12 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el martes 23 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el viernes 9 de abril de 2027."
  explanation:
    es: "El artículo 22.3 dice que los datos «serán suprimidos en el plazo máximo de un mes desde su captación». El mes se cuenta de fecha a fecha: desde el martes 9 de febrero de 2027 vence el martes 9 de marzo de 2027, un día laborable sin festivo en el intervalo. El viernes 12 de febrero resulta de aplicar setenta y dos horas, que es el plazo para poner las imágenes a disposición de la autoridad. El martes 23 de febrero son diez días hábiles. El viernes 9 de abril son dos meses."
  citation: "art. 22.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2018-16673-art-22
- id: m02-l04-q014
  prompt:
    es: "Según el artículo 22.3 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, cuando las imágenes de videovigilancia deban conservarse para acreditar actos que atenten contra la integridad de bienes:"
  options:
  - id: a
    text:
      es: "Se pondrán a disposición de la autoridad competente en un plazo máximo de cuarenta y ocho horas."
  - id: b
    correct: true
    text:
      es: "Se pondrán a disposición de la autoridad competente en un plazo máximo de setenta y dos horas."
  - id: c
    text:
      es: "Se pondrán a disposición del delegado de protección de datos en un plazo máximo de diez días."
  - id: d
    text:
      es: "Se conservarán por el responsable hasta que la autoridad competente las reclame por escrito."
  explanation:
    es: "El artículo 22.3 dice que, en ese caso, las imágenes «deberán ser puestas a disposición de la autoridad competente en un plazo máximo de setenta y dos horas» desde que se conoció la grabación. El plazo no es de cuarenta y ocho horas. El destinatario es la autoridad competente, no el delegado de protección de datos. El responsable no espera a que se las reclamen."
  citation: "art. 22.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
