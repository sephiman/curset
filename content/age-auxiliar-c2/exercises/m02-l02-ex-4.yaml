# anchor: boe-a-2005-14836-art-15
- id: m02-l02-q019
  prompt:
    es: "Según el artículo 15.2 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, los usuarios podrán formular sus quejas o sugerencias:"
  options:
  - id: a
    text:
      es: "Por correo postal y por medios telemáticos, pero no presencialmente."
  - id: b
    text:
      es: "Presencialmente y por correo postal, pero no por medios telemáticos."
  - id: c
    correct: true
    text:
      es: "Presencialmente, por correo postal y por medios telemáticos."
  - id: d
    text:
      es: "Presencialmente y por medios telemáticos, pero no por correo postal."
  explanation:
    es: "El artículo 15.2 admite los tres cauces: los usuarios podrán formular sus quejas o sugerencias «presencialmente, por correo postal y por medios telemáticos». Cada una de las otras opciones excluye uno de esos tres cauces."
  citation: "art. 15.2 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-15
- id: m02-l02-q021
  prompt:
    es: "Formulada una queja o sugerencia ante la Administración General del Estado, ¿a través de qué medio recibe el usuario constancia de su presentación?"
  options:
  - id: a
    text:
      es: "A través de la sede electrónica del departamento, en todo caso."
  - id: b
    text:
      es: "A través de correo postal certificado con acuse de recibo."
  - id: c
    text:
      es: "A través del tablón de anuncios de la unidad responsable."
  - id: d
    correct: true
    text:
      es: "A través del medio que el propio usuario indique."
  explanation:
    es: "El artículo 15.4 RD 951/2005 dice que, formuladas las quejas y sugerencias, los usuarios recibirán constancia de su presentación «a través del medio que indiquen». La norma no impone la sede electrónica, el correo certificado ni el tablón de anuncios; el medio lo elige el usuario."
  citation: "art. 15.4 RD 951/2005"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-16
- id: m02-l02-q024
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre el plazo de contestación de una queja cuando la unidad responsable deba requerir aclaraciones al interesado?"
  options:
  - id: a
    text:
      es: "Volverá a contarse desde el principio, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  - id: b
    correct: true
    text:
      es: "Su transcurso se podrá suspender, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  - id: c
    text:
      es: "Seguirá corriendo sin interrupción, y el interesado formulará las aclaraciones en un plazo de 15 días hábiles."
  - id: d
    text:
      es: "Se ampliará hasta 40 días hábiles, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  explanation:
    es: "El artículo 16.2 RD 951/2005 dice que el transcurso del plazo «se podrá suspender» cuando deba requerirse al interesado para que, «en un plazo de 10 días hábiles», formule las aclaraciones necesarias. Suspender no es volver a contar desde el principio ni ampliar el plazo a 40 días. Que el plazo siga corriendo contradice la suspensión, y el interesado dispone de 10 días hábiles, no de 15."
  citation: "art. 16.2 RD 951/2005"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-16
- id: m02-l02-q026
  prompt:
    es: "Si, transcurrido el plazo, el ciudadano no ha obtenido respuesta a su queja, ¿para qué puede dirigirse a la Inspección General de Servicios del departamento correspondiente?"
  options:
  - id: a
    text:
      es: "Para que dicte la resolución que la unidad no ha dictado."
  - id: b
    text:
      es: "Para interponer recurso de alzada contra la falta de respuesta."
  - id: c
    text:
      es: "Para solicitar una indemnización por el retraso en la respuesta."
  - id: d
    correct: true
    text:
      es: "Para conocer los motivos de la falta de contestación."
  explanation:
    es: "El artículo 16.3 RD 951/2005 dice que el ciudadano podrá dirigirse a la Inspección General de Servicios del departamento «para conocer los motivos de la falta de contestación» y «para que dicha Inspección proponga, en su caso, a los órganos competentes la adopción de las medidas oportunas». La Inspección propone medidas, no dicta la resolución que la unidad no ha dictado. El recurso de alzada no cabe contra la falta de respuesta: el artículo 19 dice que las quejas «no tendrán, en ningún caso, la calificación de recurso administrativo». Pedir una indemnización por el retraso no es ninguna de las dos finalidades del apartado: conocer los motivos y que la Inspección proponga medidas."
  citation: "art. 16.3 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-17
- id: m02-l02-q028
  prompt:
    es: "¿De qué órganos, unidades y organismos hace la Inspección General de Servicios de cada departamento el seguimiento de las quejas y sugerencias?"
  options:
  - id: a
    correct: true
    text:
      es: "De los de su ámbito, tanto centrales como periféricos."
  - id: b
    text:
      es: "De los de su ámbito, solo cuando sean servicios centrales."
  - id: c
    text:
      es: "De los de su ámbito, solo cuando sean servicios periféricos."
  - id: d
    text:
      es: "De los de toda la Administración General del Estado."
  explanation:
    es: "El artículo 17.1 RD 951/2005 dice que la Inspección General de Servicios de cada departamento hará el seguimiento de las quejas y sugerencias relativas a los órganos, unidades y organismos «de su ámbito, tanto centrales como periféricos». Limitarlo a los centrales o a los periféricos contradice ese «tanto… como». Extenderlo a toda la Administración General del Estado sale del ámbito de cada departamento."
  citation: "art. 17.1 RD 951/2005"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2005-14836-art-17
- id: m02-l02-q029
  prompt:
    es: "El artículo 17.2 del Real Decreto 951/2005, de 29 de julio, atribuye a la Inspección General de Servicios del ministerio que llama «de Administraciones Públicas» el seguimiento de las quejas relativas a:"
  options:
  - id: a
    text:
      es: "Los servicios centrales de todos los departamentos ministeriales, sin excepción alguna."
  - id: b
    text:
      es: "Los organismos autónomos adscritos a cualquiera de los departamentos ministeriales."
  - id: c
    correct: true
    text:
      es: "Los servicios periféricos integrados en las Delegaciones y Subdelegaciones del Gobierno."
  - id: d
    text:
      es: "Las Entidades Gestoras y Servicios Comunes de la Seguridad Social, en su conjunto."
  explanation:
    es: "El artículo 17.2 dice que el seguimiento de las quejas y sugerencias «de los servicios periféricos integrados en las Delegaciones y Subdelegaciones del Gobierno» corresponderá a la Inspección General de Servicios del Ministerio que el texto llama «de Administraciones Públicas». Los servicios centrales, los organismos autónomos y las Entidades Gestoras y Servicios Comunes siguen la regla general del artículo 17.1: los sigue la Inspección de su propio departamento."
  citation: "art. 17.2 RD 951/2005"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2005-14836-art-17
- id: m02-l02-q030
  prompt:
    es: "¿Cuándo remite la unidad responsable de las quejas y sugerencias a la Inspección General de Servicios de su ministerio el informe global de las recibidas el año anterior?"
  options:
  - id: a
    text:
      es: "En el mes de marzo de cada año."
  - id: b
    text:
      es: "En el mes de junio de cada año."
  - id: c
    text:
      es: "En el mes de diciembre de cada año."
  - id: d
    correct: true
    text:
      es: "En el mes de enero de cada año."
  explanation:
    es: "El artículo 17.3 RD 951/2005 dice que la unidad remitirá a la Inspección General de Servicios de su ministerio, «en el mes de enero de cada año», un informe global de las quejas y sugerencias del año anterior, con copia de las contestaciones. Marzo, junio y diciembre no son el mes que fija el artículo."
  citation: "art. 17.3 RD 951/2005"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-15
- id: m02-l02-q091
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las quejas y sugerencias presentadas por correo electrónico o a través de Internet deberán:"
  options:
  - id: a
    text:
      es: "Confirmarse presencialmente en el plazo de diez días hábiles."
  - id: b
    text:
      es: "Remitirse además a la unidad responsable del ministerio mediante fax."
  - id: c
    text:
      es: "Acompañar la identificación del interesado con un documento oficial escaneado."
  - id: d
    correct: true
    text:
      es: "Estar suscritas con la firma electrónica del interesado."
  explanation:
    es: "El artículo 15.2 exige la firma electrónica del interesado. No hay que confirmar la queja presencialmente, reenviarla por fax ni adjuntar un documento escaneado."
  citation: "art. 15.2 RD 951/2005"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-16
- id: m02-l02-q092
  prompt:
    es: "Recibida una queja o sugerencia, la unidad responsable debe informar al interesado, según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, de:"
  options:
  - id: a
    text:
      es: "La resolución definitiva del fondo, en el plazo de veinte días hábiles."
  - id: b
    text:
      es: "Las actuaciones realizadas, en el plazo de veinte días naturales."
  - id: c
    correct: true
    text:
      es: "Las actuaciones realizadas, en el plazo de veinte días hábiles."
  - id: d
    text:
      es: "El archivo de la queja, en el plazo de veinte días hábiles."
  explanation:
    es: "El artículo 16.1 obliga a informar de las actuaciones realizadas en 20 días hábiles. No exige una resolución definitiva del fondo, el plazo no se cuenta en días naturales y el archivo no es el contenido de la información."
  citation: "art. 16.1 RD 951/2005"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2005-14836-art-16
- id: m02-l02-q093
  prompt:
    es: "La unidad responsable de las quejas y sugerencias de un ministerio recibe una queja el viernes 15 de enero de 2027. Si en ese periodo no hay festivos, ¿hasta qué día tiene para informar al interesado de las actuaciones realizadas?"
  options:
  - id: a
    text:
      es: "Hasta el jueves 4 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el viernes 12 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el jueves 11 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el lunes 15 de febrero de 2027."
  explanation:
    es: "El plazo es de 20 días hábiles y empieza el día siguiente a la recepción, el sábado 16 de enero; solo cuentan los días laborables. Primera semana (18 a 22 de enero): 5. Segunda (25 a 29): 10. Tercera (1 a 5 de febrero): 15. Cuarta (8 a 12 de febrero): 20. El vigésimo día hábil es el viernes 12 de febrero de 2027. El jueves 4 de febrero resulta de contar 20 días naturales, el jueves 11 de febrero de contar el día de la recepción como primero y el lunes 15 de febrero de contar un día hábil de más."
  citation: "art. 16.1 RD 951/2005"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2005-14836-art-17
- id: m02-l02-q096
  prompt:
    es: "¿Qué periodo abarca el informe global que remite en enero la unidad responsable de las quejas y sugerencias de un ministerio?"
  options:
  - id: a
    text:
      es: "Las recibidas durante el semestre anterior."
  - id: b
    correct: true
    text:
      es: "Las recibidas durante el año anterior."
  - id: c
    text:
      es: "Las recibidas durante el mes de diciembre anterior."
  - id: d
    text:
      es: "Las recibidas durante los dos años anteriores."
  explanation:
    es: "El artículo 17.3 se refiere a las quejas y sugerencias recibidas en el año anterior. El semestre, el mes de diciembre y los dos años anteriores no coinciden con el periodo que indica."
  citation: "art. 17.3 RD 951/2005"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2005-14836-art-17
- id: m02-l02-q097
  prompt:
    es: "El informe global anual de quejas y sugerencias que remite la unidad responsable, según el Real Decreto 951/2005, de 29 de julio, incluye una copia de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las contestaciones dadas a las quejas y sugerencias."
  - id: b
    text:
      es: "Las resoluciones de los recursos administrativos relacionados."
  - id: c
    text:
      es: "Los informes de las unidades de gestión afectadas."
  - id: d
    text:
      es: "Las cartas de servicios vigentes del órgano."
  explanation:
    es: "El artículo 17.3 añade una copia de las contestaciones dadas a las quejas y sugerencias. Las resoluciones de recursos, los informes de las unidades de gestión y las cartas de servicios no se incluyen."
  citation: "art. 17.3 RD 951/2005"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-19
- id: m02-l02-q098
  prompt:
    es: "Un ciudadano presenta una queja contra la denegación de su solicitud y no interpone recurso alguno. ¿Puede considerarse que ha interpuesto un recurso administrativo?"
  options:
  - id: a
    text:
      es: "Sí, porque la queja equivale a un recurso de alzada ante el superior jerárquico del órgano."
  - id: b
    text:
      es: "Sí, si la queja se presenta dentro del plazo de recurso."
  - id: c
    text:
      es: "Sí, cuando la queja se firma con firma electrónica."
  - id: d
    correct: true
    text:
      es: "No, porque la queja no tiene en ningún caso la calificación de recurso administrativo."
  explanation:
    es: "El artículo 19 niega a la queja la calificación de recurso administrativo en ningún caso. No equivale a un recurso de alzada y la presentación dentro del plazo de recurso o con firma electrónica no cambia su naturaleza."
  citation: "art. 19 RD 951/2005"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14836-art-19
- id: m02-l02-q099
  prompt:
    es: "Una persona presenta una queja mientras corre el plazo para recurrir una resolución. ¿Qué efecto tiene la queja sobre ese plazo?"
  options:
  - id: a
    text:
      es: "Lo suspende hasta que la unidad responsable conteste la queja."
  - id: b
    text:
      es: "Lo interrumpe, y se reinicia una vez la unidad responsable ha contestado la queja al interesado."
  - id: c
    correct: true
    text:
      es: "Ninguno: su presentación no interrumpe los plazos establecidos en la normativa vigente."
  - id: d
    text:
      es: "Lo amplía en veinte días hábiles desde su presentación."
  explanation:
    es: "El artículo 19 dice que presentar la queja no interrumpe los plazos. No los suspende ni los interrumpe para reiniciarlos, y tampoco los amplía en veinte días hábiles; esos veinte días son el plazo de la unidad para informar."
  citation: "art. 19 RD 951/2005"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2005-14836-art-19
- id: m02-l02-q100
  prompt:
    es: "Las quejas formuladas conforme al Real Decreto 951/2005, de 29 de julio, no condicionan, en modo alguno, el ejercicio de:"
  options:
  - id: a
    text:
      es: "Los derechos reconocidos por la propia carta de servicios."
  - id: b
    correct: true
    text:
      es: "Las restantes acciones o derechos que puedan ejercer los interesados."
  - id: c
    text:
      es: "Las peticiones presentadas ante la misma unidad responsable."
  - id: d
    text:
      es: "Las iniciativas de los empleados públicos del órgano."
  explanation:
    es: "El artículo 19 deja intactas las restantes acciones o derechos que puedan ejercer los interesados. Los derechos de la carta, las peticiones y las iniciativas de empleados no son lo que el artículo protege."
  citation: "art. 19 RD 951/2005"
  difficulty: 2
  tags:
  - "efecto"
