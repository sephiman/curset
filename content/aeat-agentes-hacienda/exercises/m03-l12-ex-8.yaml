# anchor: boe-a-2005-14803-art-105
- id: m03-l12-q0174
  prompt:
    es: "Señale la respuesta CORRECTA sobre el anuncio de una subasta cuya ejecución material se ha encargado a una empresa especializada, según el artículo 105.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    correct: true
    text:
      es: "Contiene los datos esenciales de la subasta y se publicita en la sede electrónica del organismo correspondiente."
  - id: b
    text:
      es: "Contiene los datos esenciales de la subasta y se publica únicamente en el Boletín Oficial del Estado."
  - id: c
    text:
      es: "Contiene solo la identificación de los bienes y se comunica por escrito a los licitadores registrados en el portal."
  - id: d
    text:
      es: "Se sustituye por la publicidad que acuerde la empresa, sin necesidad de sede electrónica."
  explanation:
    es: "El anuncio mantiene los datos esenciales y se publicita en la sede electrónica del organismo (art. 105.2.a RGR). No se limita al BOE ni se reduce a una comunicación a licitadores. La publicidad no se deja a la empresa sin sede electrónica."
  citation: "art. 105.2 RGR"
  difficulty: 3
  tags:
  - "publicidad"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0249
  prompt:
    es: "Según el artículo 97.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, los órganos de recaudación competentes valoran los bienes embargados:"
  options:
  - id: a
    text:
      es: "a precios de mercado, minorados en un 20 por ciento por tratarse de una enajenación forzosa."
  - id: b
    text:
      es: "a su valor contable en el balance del obligado, con aplicación de un descuento por venta forzosa."
  - id: c
    correct: true
    text:
      es: "a precios de mercado y de acuerdo con los criterios habituales de valoración."
  - id: d
    text:
      es: "a su valor catastral o, en su defecto, al valor de adquisición actualizado."
  explanation:
    es: "La valoración se hace a precios de mercado y con los criterios habituales (art. 97.1 RGR). No se usa el valor catastral, ni el contable con descuento, ni se aplica una minoración del 20 por ciento por la venta forzosa."
  citation: "art. 97.1 RGR"
  difficulty: 2
  tags:
  - "criterio"
# anchor: boe-a-2005-14803-art-100
- id: m03-l12-q0250
  prompt:
    es: "La subasta de bienes embargados es única y se realiza por medios electrónicos en el Portal de Subastas de la Agencia Estatal Boletín Oficial del Estado, con la única excepción de los supuestos en los que, según el artículo 100.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "la subasta se celebra por segunda vez tras haber quedado desierta la primera."
  - id: b
    text:
      es: "el obligado al pago solicita expresamente una subasta presencial."
  - id: c
    correct: true
    text:
      es: "la ejecución material se encarga a empresas o profesionales especializados."
  - id: d
    text:
      es: "los bienes subastados son inmuebles de valor superior a 100.000 euros."
  explanation:
    es: "La única excepción a la subasta única y electrónica en el Portal es que la ejecución material se encargue a empresas o profesionales especializados (art. 100.2 RGR). Ni el valor de los inmuebles, ni la petición del obligado, ni la segunda subasta eximen de ese cauce."
  citation: "art. 100.2 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-101
- id: m03-l12-q0251
  prompt:
    es: "Entre los datos esenciales de la subasta, el artículo 101.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación incluye la obligación del adjudicatario de ingresar, en los 15 días siguientes a que le sea notificada la adjudicación:"
  options:
  - id: a
    text:
      es: "el 5 por ciento del precio de remate, para el otorgamiento de la escritura pública."
  - id: b
    text:
      es: "la diferencia entre el tipo de subasta y el depósito constituido por el licitador."
  - id: c
    text:
      es: "el precio de adjudicación íntegro, sin descontar el depósito constituido."
  - id: d
    correct: true
    text:
      es: "la diferencia entre el depósito constituido y el precio de adjudicación."
  explanation:
    es: "El anuncio advierte de que el adjudicatario ingresa en 15 días la diferencia entre el depósito y el precio de adjudicación (art. 101.4 RGR). No se paga el precio íntegro, porque el depósito se descuenta, ni la diferencia se calcula sobre el tipo. El 5 por ciento del remate es el ingreso adicional de la escritura pública (art. 111.1)."
  citation: "art. 101.4 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0256
  prompt:
    es: "Conforme al artículo 104 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la afirmación INCORRECTA sobre la finalización de la fase de presentación de ofertas de la subasta:"
  options:
  - id: a
    correct: true
    text:
      es: "La Mesa se reúne en el plazo máximo de 15 días hábiles para adjudicar los bienes o lotes o declarar desierta la subasta."
  - id: b
    text:
      es: "Si la mejor oferta es inferior al 50 por ciento del tipo, la Mesa decide si es suficiente, sin que exista precio mínimo."
  - id: c
    text:
      es: "La Mesa se reúne en el plazo máximo de 15 días naturales para adjudicar los bienes o lotes o declarar desierta la subasta."
  - id: d
    text:
      es: "Si la mejor oferta es igual o superior al 50 por ciento del tipo, la Mesa adjudica el bien al licitador que la presentó."
  explanation:
    es: "El plazo de la Mesa es de 15 días naturales, no hábiles (art. 104 bis.1 RGR), y por eso es incorrecta la afirmación que dice 15 días hábiles. Las otras tres reproducen el plazo y los dos supuestos del 50 por ciento."
  citation: "art. 104 bis.1 RGR"
  difficulty: 2
  tags:
  - "plazo"
  - "negativa"
# anchor: boe-a-2005-14803-art-104
- id: m03-l12-q0264
  prompt:
    es: "Según el artículo 104.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuánto tiempo debe transcurrir desde la realización de la última puja para que se cierre la subasta, aunque ello suponga ampliar el plazo inicialmente fijado?"
  options:
  - id: a
    text:
      es: "Seis horas desde la última puja."
  - id: b
    text:
      es: "Veinticuatro horas desde la última puja."
  - id: c
    correct: true
    text:
      es: "Una hora desde la última puja."
  - id: d
    text:
      es: "Quince minutos desde la última puja."
  explanation:
    es: "La subasta no se cierra hasta que pase una hora desde la última puja (art. 104.3 RGR). Las veinticuatro horas son el límite máximo de ampliación del plazo inicial, no el tiempo que se espera tras cada puja. Los quince minutos y las seis horas no figuran en el artículo."
  citation: "art. 104.3 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-103-bis
- id: m03-l12-q0267
  prompt:
    es: "Conforme al artículo 103 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, todo licitador debe constituir un depósito para poder:"
  options:
  - id: a
    text:
      es: "pujar por encima del tipo de subasta fijado en el acuerdo de enajenación."
  - id: b
    text:
      es: "reservar su depósito para el caso de incumplimiento del mejor postor."
  - id: c
    correct: true
    text:
      es: "ser admitido como licitador en la subasta."
  - id: d
    text:
      es: "presentar valoración contradictoria de los bienes que se subastan."
  explanation:
    es: "El depósito es requisito de admisión como licitador (art. 103 bis.1 RGR). La valoración contradictoria es un derecho del obligado al pago (art. 97.3). Pujar por encima del tipo no exige un depósito distinto, y la reserva del depósito es una opción posterior que el artículo regula en otro apartado."
  citation: "art. 103 bis.1 RGR"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2005-14803-art-106
- id: m03-l12-q0268
  prompt:
    es: "Según el artículo 106.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la convocatoria del concurso para enajenar bienes embargados señala los bienes objeto de enajenación, el plazo y las condiciones para concurrir, la forma de pago y:"
  options:
  - id: a
    text:
      es: "el tipo mínimo de adjudicación en todo caso."
  - id: b
    text:
      es: "el número máximo de ofertas por concursante."
  - id: c
    text:
      es: "la identidad de los concursantes admitidos."
  - id: d
    correct: true
    text:
      es: "el depósito a realizar."
  explanation:
    es: "La convocatoria indica los bienes, el plazo y las condiciones para concurrir, la forma de pago y el depósito (art. 106.2 RGR), y las condiciones especiales si las hay. No fija un tipo mínimo obligatorio, ni identifica a los concursantes, que aún no han presentado oferta, ni limita las ofertas por concursante."
  citation: "art. 106.2 RGR"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-105
- id: m03-l12-q0270
  prompt:
    es: "En las subastas encargadas a empresas especializadas, el artículo 105.2.d del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación establece que la Mesa está representada en el acto de licitación:"
  options:
  - id: a
    text:
      es: "por todos sus componentes, que deben estar presentes durante la totalidad del acto de licitación."
  - id: b
    text:
      es: "por el representante de la empresa especializada, que decide sobre las incidencias del desarrollo."
  - id: c
    text:
      es: "por un notario designado, que levanta acta de las incidencias y las traslada después a la Mesa."
  - id: d
    correct: true
    text:
      es: "por uno de sus componentes, que decide sobre las incidencias que puedan surgir en su desarrollo."
  explanation:
    es: "Un solo componente de la Mesa la representa y resuelve las incidencias (art. 105.2.d RGR). No lo hace la empresa especializada, no se exige la presencia de todos los miembros y no interviene un notario."
  citation: "art. 105.2 RGR"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-111
- id: m03-l12-q0274
  prompt:
    es: "Una vez notificada la adjudicación, el adjudicatario puede solicitar el otorgamiento de escritura pública de venta del inmueble y, según el artículo 111.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, debe comunicar de forma expresa esta opción en el plazo de:"
  options:
  - id: a
    text:
      es: "5 días a contar desde el ingreso del remate por el adjudicatario."
  - id: b
    correct: true
    text:
      es: "5 días a contar desde la notificación de la adjudicación."
  - id: c
    text:
      es: "15 días a contar desde la notificación de la adjudicación."
  - id: d
    text:
      es: "10 días a contar desde la notificación de la adjudicación."
  explanation:
    es: "La opción por la escritura se comunica en 5 días desde la notificación de la adjudicación (art. 111.1 RGR). Los 15 días son el plazo para pagar la diferencia del precio (art. 104 bis.3.b) y no hay un plazo de 10 días. Tampoco se cuenta desde el ingreso del remate."
  citation: "art. 111.1 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0275
  prompt:
    es: "En cualquier momento anterior a la adjudicación de bienes, el artículo 172.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que la Administración tributaria libera los bienes embargados si el obligado:"
  options:
  - id: a
    text:
      es: "solicita un aplazamiento o fraccionamiento de la deuda tributaria pendiente."
  - id: b
    correct: true
    text:
      es: "extingue la deuda tributaria y las costas del procedimiento de apremio."
  - id: c
    text:
      es: "ofrece garantía suficiente por el importe de la deuda tributaria y de las costas."
  - id: d
    text:
      es: "abona el importe del depósito exigido a los licitadores y las costas del procedimiento."
  explanation:
    es: "La liberación exige extinguir la deuda y las costas (art. 172.4 LGT). No basta ofrecer garantía, ni solicitar un aplazamiento, ni pagar el importe del depósito de los licitadores, que es una cantidad ajena a la deuda."
  citation: "art. 172.4 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0276
  prompt:
    es: "Cuando no hay acuerdo sobre la valoración, el artículo 97.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que la nueva valoración por perito adecuado debe estar comprendida entre los límites de las efectuadas anteriormente y que:"
  options:
  - id: a
    text:
      es: "puede ser recurrida ante el órgano de recaudación en el plazo de 15 días."
  - id: b
    text:
      es: "solo es aplicable si la diferencia con las anteriores no excede del 20 por ciento."
  - id: c
    text:
      es: "se somete a la aprobación del obligado al pago antes de fijar el tipo."
  - id: d
    correct: true
    text:
      es: "es la definitivamente aplicable."
  explanation:
    es: "La nueva valoración, entre los límites de las anteriores, es la definitiva (art. 97.4 RGR). No se recurre en 15 días ante el órgano de recaudación, ni requiere la conformidad del obligado, ni depende del umbral del 20 por ciento, que solo opera en la fase de las dos primeras valoraciones (art. 97.3)."
  citation: "art. 97.4 RGR"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0279
  prompt:
    es: "Señale la respuesta CORRECTA sobre los plazos de la subasta electrónica de bienes embargados, según los artículos 101 a 104 bis del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Entre las notificaciones del acuerdo y la subasta transcurren 15 días como máximo, las pujas duran veinte días naturales y la Mesa se reúne en 5 días naturales."
  - id: b
    text:
      es: "Entre las notificaciones del acuerdo y la subasta transcurren 15 días como mínimo, las pujas duran quince días naturales y la Mesa se reúne en 20 días naturales como máximo."
  - id: c
    text:
      es: "Entre las notificaciones del acuerdo y la subasta transcurren 20 días como mínimo, las pujas duran veinte días naturales y la Mesa se reúne en 15 días naturales como máximo."
  - id: d
    correct: true
    text:
      es: "Entre las notificaciones del acuerdo y la subasta transcurren 15 días como mínimo, las pujas duran veinte días naturales y la Mesa se reúne en 15 días naturales como máximo tras las ofertas."
  explanation:
    es: "Hay 15 días como mínimo entre las notificaciones y la subasta (art. 101.2 RGR), las pujas duran veinte días naturales (art. 104.2) y la Mesa se reúne como máximo a los 15 días naturales de finalizada la presentación de ofertas (art. 104 bis.1). Las otras opciones alteran uno o dos de esos números o convierten el mínimo en máximo."
  citation: "art. 104 bis.1 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0283
  prompt:
    es: "Señale la respuesta CORRECTA sobre la adjudicación directa de los bienes embargados, según el artículo 107 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "El órgano de recaudación procede en el plazo de quince días desde la notificación del acuerdo a realizar las gestiones conducentes a la adjudicación."
  - id: b
    correct: true
    text:
      es: "El órgano de recaudación procede en el plazo de un mes desde el día siguiente a la notificación del acuerdo de enajenación a realizar las gestiones conducentes a la adjudicación."
  - id: c
    text:
      es: "Procede únicamente cuando el concurso se declara desierto, sin otros supuestos que justifiquen esta forma de enajenación."
  - id: d
    text:
      es: "El precio mínimo de adjudicación es siempre el tipo de la última subasta, y los bienes nunca se adjudican sin precio mínimo."
  explanation:
    es: "El plazo es de un mes desde el día siguiente a la notificación (art. 107.3 RGR). El precio mínimo es el tipo del concurso si lo hubo, y si no, valores de mercado, con posibilidad de adjudicar sin precio mínimo (art. 107.5). Y la adjudicación directa procede también por perecederos, urgencia y falta de conveniencia de la concurrencia (art. 107.1)."
  citation: "art. 107.3 RGR"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0285
  prompt:
    es: "¿En cuál de los siguientes casos puede la Administración tributaria enajenar los bienes embargados antes de que sea firme el acto de liquidación de la deuda ejecutada, según el artículo 172.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Cuando el valor de los bienes embargados exceda del importe de la deuda y las costas."
  - id: b
    text:
      es: "Cuando el obligado tributario haya interpuesto recurso contra la providencia de apremio."
  - id: c
    correct: true
    text:
      es: "Cuando el obligado tributario solicite de forma expresa su enajenación."
  - id: d
    text:
      es: "Cuando haya transcurrido un año desde la notificación de la diligencia de embargo."
  explanation:
    es: "Las excepciones son la fuerza mayor, los bienes perecederos, el riesgo de pérdida inminente de valor y la solicitud expresa del obligado (art. 172.3 LGT). Recurrir la providencia no autoriza la enajenación anticipada. El mayor valor de los bienes y el paso de un año desde el embargo tampoco son excepciones."
  citation: "art. 172.3 LGT"
  difficulty: 2
  tags:
  - "supuesto-legal"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0289
  prompt:
    es: "Según el artículo 97.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando no existe acuerdo entre el obligado y el órgano de recaudación sobre la valoración, ¿entre qué límites debe estar comprendida la nueva valoración?"
  options:
  - id: a
    text:
      es: "Entre el 80 y el 120 por ciento de la valoración del órgano de recaudación."
  - id: b
    text:
      es: "Entre la menor valoración y el doble de la mayor de las anteriores."
  - id: c
    text:
      es: "Entre la valoración del órgano de recaudación y el valor catastral del bien."
  - id: d
    correct: true
    text:
      es: "Entre los límites de las valoraciones efectuadas anteriormente."
  explanation:
    es: "La nueva valoración queda entre los límites de las anteriores (art. 97.4 RGR). No se mide por porcentajes de la valoración del órgano, ni por el valor catastral, ni puede llegar al doble de la mayor."
  citation: "art. 97.4 RGR"
  difficulty: 2
  tags:
  - "criterio"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0290
  prompt:
    es: "Según el artículo 97.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿a quién se notifica la valoración de los bienes embargados?"
  options:
  - id: a
    text:
      es: "Al depositario de los bienes, que puede presentar valoración contradictoria si discrepa."
  - id: b
    correct: true
    text:
      es: "Al obligado al pago, que puede presentar valoración contradictoria si discrepa."
  - id: c
    text:
      es: "Al registrador de la propiedad, que debe anotar la valoración en la hoja de la finca embargada."
  - id: d
    text:
      es: "A los acreedores hipotecarios, que pueden presentar valoración contradictoria si discrepan."
  explanation:
    es: "La valoración se notifica al obligado al pago, que en caso de discrepancia presenta valoración contradictoria en 15 días (art. 97.3 RGR). No se notifica con ese fin al depositario ni a los acreedores hipotecarios, que sí reciben el acuerdo de enajenación (art. 101.2), y el registrador no anota la valoración."
  citation: "art. 97.3 RGR"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-105
- id: m03-l12-q0291
  prompt:
    es: "¿Cómo se realiza el desarrollo de la licitación en las subastas cuya ejecución material se ha encargado a empresas o profesionales especializados, según el artículo 105.2.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Conforme a las prácticas habituales de este tipo de actos."
  - id: b
    text:
      es: "Con un cierre automático al transcurrir una hora desde la última puja realizada."
  - id: c
    text:
      es: "Mediante pujas electrónicas durante veinte días naturales desde la apertura de la subasta."
  - id: d
    text:
      es: "Con una puja mínima del 10 por ciento del tipo de subasta en todos los casos."
  explanation:
    es: "En las subastas encargadas a empresas especializadas la licitación se desarrolla conforme a las prácticas habituales de estos actos (art. 105.2.c RGR). El plazo de veinte días de pujas electrónicas, la puja mínima del 10 por ciento y el cierre tras una hora sin pujas son reglas de la subasta electrónica ordinaria (art. 104 RGR), que este apartado sustituye por esa remisión a la práctica habitual."
  citation: "art. 105.2 RGR"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0293
  prompt:
    es: "¿Cuál es el precio mínimo de adjudicación en la adjudicación directa cuando los bienes han sido objeto de concurso, según el artículo 107.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "El tipo del concurso."
