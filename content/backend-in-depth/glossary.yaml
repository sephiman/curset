  definition:
    en: Indirect prompt injections occur when an LLM accepts input from external sources, such as websites or files.
      Like direct injections, indirect injections can be either intentional or unintentional.

# owasp-cs-threat-modeling#overview
- id: g-threat-modeling
  en: threat modeling
  origin: m10-l04
  definition:
    en: In the context of application security, threat modeling is a structured, repeatable process used to gain
      actionable insights into the security characteristics of a particular system. It involves modeling a system
      from a security perspective, identifying applicable threats based on this model, and determining responses
      to these threats.

# k8s-pod-lifecycle#liveness-probe
- id: g-liveness-probe
  en: liveness probe
  origin: m10-l05
  definition:
    en: Liveness probes determine when to restart a container. For example, liveness probes could catch a deadlock,
      where an application is running, but unable to make progress.

# k8s-pod-lifecycle#readiness-probe
- id: g-readiness-probe
  en: readiness probe
  origin: m10-l05
  definition:
    en: Readiness probes determine when a container is ready to accept traffic.

# k8s-pod-lifecycle#startup-probe
- id: g-startup-probe
  en: startup probe
  origin: m10-l05
  definition:
    en: Startup probes verify whether the application within a container is started.

# k8s-disruptions#pod-disruption-budgets
- id: g-pod-disruption-budget
  en: PodDisruptionBudget
  origin: m10-l05
  definition:
    en: A PDB limits the number of Pods of a replicated application that are down simultaneously from voluntary
      disruptions.

# argo-rollouts-concepts#progressive-delivery
- id: g-progressive-delivery
  en: progressive delivery
  origin: m10-l05
  definition:
    en: Progressive delivery is the process of releasing updates of a product in a controlled and gradual manner,
      thereby reducing the risk of the release, typically coupling automation and metric analysis to drive the automated
      promotion or rollback of the update.

# argo-rollouts-concepts#canary
- id: g-canary-deployment
  en: canary deployment
  origin: m10-l05
  definition:
    en: A Canary deployment exposes a subset of users to the new version of the application while serving the rest
      of the traffic to the old version.

# argo-rollouts-concepts#blue-green
- id: g-blue-green-deployment
  en: blue-green deployment
  origin: m10-l05
  definition:
    en: A Blue-Green deployment has both the new and old version of the application deployed at the same time. During
      this time, only the old version of the application will receive production traffic.

# owasp-cs-idor#introduction
- id: g-insecure-direct-object-reference
  en: Insecure Direct Object Reference
  origin: m10-l06
  definition:
    en: Insecure Direct Object Reference (IDOR) is a vulnerability that arises when attackers can access or modify
      objects by manipulating identifiers used in a web application's URLs or parameters.

# owasp-cs-mass-assignment#definition
- id: g-mass-assignment
  en: Mass Assignment
  origin: m10-l06
  definition:
    en: Software frameworks sometimes allow developers to automatically bind HTTP request parameters into program
      code variables or objects to make using that framework easier on developers. Attackers can sometimes use this
      methodology to create new parameters that the developer never intended.

# owasp-api-top10-2023#owasp-top-10-api-security-risks-2023
- id: g-server-side-request-forgery
  en: Server-Side Request Forgery
  origin: m10-l06
  definition:
    en: Server-Side Request Forgery (SSRF) flaws can occur when an API is fetching a remote resource without validating
      the user-supplied URI.

# owasp-cs-threat-modeling#threat-identification
- id: g-stride
  en: STRIDE
  origin: m10-l06
  definition:
    en: STRIDE is a mature and popular threat modeling technique and mnemonic originally developed by Microsoft
      employees.

# slsa-tracks#build-track
- id: g-provenance
  en: provenance
  origin: m10-l06
  definition:
    en: Provenance describes what entity built the artifact, what process they used, and what the inputs were.

# reproducible-builds-definition#when-is-a-build-reproducible
- id: g-reproducible-build
  en: reproducible build
  origin: m10-l06
  definition:
    en: A build is reproducible if given the same source code, build environment and build instructions, any party
      can recreate bit-by-bit identical copies of all specified artifacts.

# javadoc-stream-package#MutableReduction
- id: g-mutable-reduction
  en: mutable reduction
  origin: m11-l01
  definition:
    en: A mutable reduction operation accumulates input elements into a mutable result container, such as a Collection
      or StringBuilder, as it processes the elements in the stream.

# javadoc-gatherer#interface-gatherer-t-a-r
- id: g-gatherer
  en: gatherer
  origin: m11-l01
  definition:
    en: An intermediate operation that transforms a stream of input elements into a stream of output elements, optionally
      applying a final action when the end of the upstream is reached.

# javadoc-stream-package#Statelessness
- id: g-stateful-lambda
  en: stateful lambda
  origin: m11-l01
  definition:
    en: A stateful lambda is one whose result depends on any state which might change during the execution of the
      stream pipeline.

# javadoc-throwable#class-throwable
- id: g-checked-exception
  en: checked exception
  origin: m11-l02
  definition:
    en: Throwable and any subclass of Throwable that is not also a subclass of either RuntimeException or Error
      are regarded as checked exceptions.

# javadoc-throwable#class-throwable
- id: g-wrapped-exception
  en: wrapped exception
  origin: m11-l02
  definition:
    en: A wrapped exception is an exception containing a cause.

# jdk-troubleshoot-jfr#JSTGD-GUID-E9C795D6-3D7A-4CD8-84DD-4F7DE3200614
- id: g-sum-of-pauses
  en: sum of pauses
  origin: m11-l03
  definition:
    en: The Sum of Pauses is the total amount of time that the application was paused during a GC.

# javadoc-throwable#class-throwable
- id: g-chained-exception-facility
  en: chained exception facility
  origin: m11-l03
  definition:
    en: The recording of this causal information is referred to as the chained exception facility, as the cause
      can, itself, have a cause, and so on, leading to a "chain" of exceptions, each caused by another.

# javadoc-clock#fixed(java.time.Instant,java.time.ZoneId)
- id: g-fixed-clock
  en: fixed clock
  origin: m11-l04
  definition:
    en: A clock that always returns the same instant. Its main use case is in testing, where the fixed clock ensures
      tests are not dependent on the current clock.

# junit-writing-parameterized#parameterized-classes-and-tests
- id: g-parameterized-test
  en: parameterized test
  origin: m11-l04
  definition:
    en: Parameterized tests make it possible to run a test method multiple times with different arguments. They
      are declared just like regular @Test methods but use the @ParameterizedTest annotation instead.

# testcontainers-junit5#shared-containers
- id: g-shared-container
  en: shared container
  origin: m11-l04
  definition:
    en: Shared containers are defined as static fields in a top level test class and have to be annotated with @Container.
      Shared containers can't be declared inside nested test classes.

# pact-how-it-works#consumer-testing
- id: g-provider-state
  en: provider state
  origin: m11-l06
  definition:
    en: Provider states allow you describe the preconditions on the provider required to generate the expected response
      - for example, the existence of specific user data.

# jqwik-user-guide#result-shrinking
- id: g-shrinking
  en: shrinking
  origin: m11-l06
  definition:
    en: If a property could be falsified with a generated set of values, jqwik will try to “shrink” this sample
      in order to find a “smaller” sample that also falsifies the property.

# pitest-basic-concepts#mutants
- id: g-mutant
  en: mutant
  origin: m11-l06
  definition:
    en: Mutants are Java classes which contain a mutation (or fault) which should make them behave differently from
      the unmutated class.

# pitest-basic-concepts#equivalent-mutations
- id: g-equivalent-mutation
  en: equivalent mutation
  origin: m11-l06
  definition:
    en: Not all mutations will behave differently than the unmutated class. These mutants are referred to as equivalent
      mutations.

# k6-open-vs-closed#closed-model
- id: g-closed-model
  en: closed model
  origin: m11-l06
  definition:
    en: In a closed model, the execution time of each iteration dictates the number of iterations executed in your
      test. The next iteration doesn’t start until the previous one finishes.

# k6-open-vs-closed#open-model
- id: g-open-model
  en: open model
  origin: m11-l06
  definition:
    en: Compared to the closed model, the open model decouples VU iterations from the iteration duration. The response
      times of the target system no longer influence the load on the target system.

# k6-soak#soak-testing
- id: g-soak-test
  en: soak test
  origin: m11-l06
  definition:
    en: Soak testing is another variation of the Average-Load test. It focuses on extended periods.

# paper-basiri-chaos-engineering#p2
- id: g-chaos-engineering
  en: Chaos Engineering
  origin: m11-l06
  definition:
    en: Chaos Engineering is the discipline of experimenting on a distributed system in order to build confidence
      in its capability to withstand turbulent conditions in production.

# pg-ddl-partitioning#DDL-PARTITIONING-DECLARATIVE
- id: g-partitioned-table
  en: partitioned table
  origin: m09-l02
  definition:
    en: PostgreSQL allows you to declare that a table is divided into partitions. The table that is divided is referred
      to as a partitioned table.

# redis-scaling#redis-cluster-data-sharding
- id: g-hash-slot
  en: hash slot
  origin: m09-l02
  definition:
    en: Redis Cluster uses a form of sharding where every key is conceptually part of what is called a hash slot.
      There are 16384 hash slots, and the hash slot of a key is the CRC16 of the key modulo 16384.

# redis-cluster-spec#hash-tags
- id: g-hash-tag
  en: hash tag
  origin: m09-l02
  definition:
    en: Hash tags are a way to ensure that multiple keys are allocated in the same hash slot. If the key contains
      a "{...}" pattern, only the substring between { and } is hashed in order to obtain the hash slot.

# paper-dynamo#p5
- id: g-consistent-hashing
  en: consistent hashing
  origin: m09-l02
  definition:
    en: In consistent hashing, the output range of a hash function is treated as a fixed circular space or "ring",
      where the largest hash value wraps around to the smallest hash value.

# paper-dynamo#p6
- id: g-virtual-node
  en: virtual node
  origin: m09-l02
  definition:
    en: A virtual node looks like a single node in the system, but each node can be responsible for more than one
      virtual node.

# paper-dynamo#p8
- id: g-sloppy-quorum
  en: sloppy quorum
  origin: m09-l02
  definition:
    en: In a sloppy quorum, all read and write operations are performed on the first N healthy nodes from the preference
      list, which may not always be the first N nodes encountered while walking the consistent hashing ring.

# pg-ddl-rowsecurity#DDL-ROWSECURITY
- id: g-row-security-policy
  en: row security policy
  origin: m09-l03
  definition:
    en: Tables can have row security policies that restrict, on a per-user basis, which rows can be returned by
      normal queries or inserted, updated, or deleted by data modification commands. This feature is also known
      as Row-Level Security.

# pg-ddl-rowsecurity#DDL-ROWSECURITY
- id: g-default-deny-policy
  en: default-deny policy
  origin: m09-l03
  definition:
    en: If row security is enabled on a table and no policy exists for it, a default-deny policy is used, meaning
      that no rows are visible or can be modified.

# k8s-qos#quality-of-service-classes
- id: g-qos-class
  en: QoS class
  origin: m09-l03
  definition:
    en: Kubernetes assigns every Pod a quality of service (QoS) class based on the resource requests and limits
      of its component Containers. Kubernetes uses QoS classes to decide which Pods to evict from a Node experiencing
      Node Pressure.

# ietf-httpapi-ratelimit-headers#content
- id: g-quota-policy
  en: quota policy
  origin: m09-l04
  definition:
    en: A quota policy is implemented by the server to regulate the activity within a specified quota partition,
      quantified in quota units, over a defined time window.

# rfc9562#section-5.7
- id: g-uuidv7
  en: UUIDv7
  origin: m09-l04
  definition:
    en: UUIDv7 features a time-ordered value field derived from the widely implemented and well-known Unix Epoch
      timestamp source, the number of milliseconds since midnight 1 Jan 1970 UTC, leap seconds excluded.

# owasp-llm-top10-prompt-injection#main
- id: g-prompt-injection
  en: prompt injection
  origin: m09-l04
  definition:
    en: A Prompt Injection Vulnerability occurs when user prompts alter the LLM's behavior or output in unintended
      ways.

# paper-bigtable#p6
- id: g-memtable
  en: memtable
  origin: m09-l05
  definition:
    en: A sorted buffer in memory in which the recently committed updates of a Bigtable tablet are stored.

# paper-oneil-lsm-tree#p4
- id: g-lsm-tree
  en: LSM-tree
  origin: m09-l05
  definition:
    en: An LSM-tree is composed of two or more tree-like component data structures.

# paper-broder-bloom-filters#p2
- id: g-bloom-filter
  en: Bloom filter
  origin: m09-l05
  definition:
    en: A Bloom filter for representing a set S of n elements is described by an array of m bits, initially all
      set to 0, and uses k independent hash functions.

# es-translog#elastic-docs-v3
- id: g-translog
  en: translog
  origin: m09-l05
  definition:
    en: The transaction log in which each Elasticsearch shard copy writes index and delete operations, so that operations
      not yet included in the last Lucene commit can be recovered.

# redis-persistence#append-only-file
- id: g-append-only-file
  en: append-only file
  origin: m09-l05
  definition:
    en: An alternative, fully-durable persistence strategy for Redis, to which every command that changes the dataset
      is appended.
