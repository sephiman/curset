# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q124
  prompt:
    es: "En Word 365, al compartir el documento con una transcripción, ¿qué ocurre con la reproducción del audio para los destinatarios?"
  options:
  - id: a
    text:
      es: "Está disponible siempre en el panel Transcribir"
  - id: b
    text:
      es: "Está disponible solo para los destinatarios que sean coautores"
  - id: c
    text:
      es: "Está disponible durante las primeras 24 horas"
  - id: d
    correct: true
    text:
      es: "No está disponible por defecto, para proteger la privacidad"
  explanation:
    es: "La página dice: «Para proteger su privacidad, la reproducción del archivo de audio no está disponible por defecto en el panel Transcribir para ninguna persona con la que comparta el documento de Word». La página dice que no está disponible por defecto para nadie con quien se comparta. La página dice que no está disponible por defecto para ninguna persona con la que se comparta el documento. La página dice que no está disponible por defecto, sin plazo."
  citation: "fuente: `ms-word-transcribir.html`; «Comparta la transcripción y la grabación»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-transcribir-html
- id: m06-l04-q125
  prompt:
    es: "Señale dónde está disponible actualmente la función Transcribir en Word 365, según la página de Microsoft:"
  options:
  - id: a
    correct: true
    text:
      es: "En Word para Microsoft 365 en Windows, en inquilinos comerciales"
  - id: b
    text:
      es: "En cualquier versión de Word de escritorio, incluidas las que no son de Microsoft 365"
  - id: c
    text:
      es: "En Word para Microsoft 365 en Mac, en inquilinos comerciales"
  - id: d
    text:
      es: "En Word para Microsoft 365 en Windows, solo en inquilinos de educación"
  explanation:
    es: "La página dice: «Actualmente, esta característica solo está disponible en Word para Microsoft 365 en Windows, en inquilinos comerciales». Decir que está en cualquier versión de Word de escritorio contradice ese «solo». La opción de Word para Mac cambia el sistema por otro que la frase no cita, Windows. Y la de inquilinos de educación cambia el tipo de inquilino: la página dice comerciales, y añade que para los gubernamentales la transcripción solo está en Word para la Web."
  citation: "fuente: `ms-word-transcribir.html`; «Transcribir las grabaciones»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-word-coautoria-documentos-html
- id: m06-l04-q126
  prompt:
    es: "En Word 365, ¿en cuál de los siguientes lugares debe guardarse el documento para trabajar en él al mismo tiempo con otros usuarios?"
  options:
  - id: a
    text:
      es: "En una carpeta local del equipo, sin compartirlo"
  - id: b
    text:
      es: "En el equipo local, con la protección Marcar como final"
  - id: c
    correct: true
    text:
      es: "En OneDrive o SharePoint, y compartirlo con los demás"
  - id: d
    text:
      es: "En una unidad de red, sin compartirlo"
  explanation:
    es: "La página dice: «Guarde el documento en OneDrive o SharePoint y compártalo con otros usuarios para que pueda trabajar en él al mismo tiempo». Una carpeta local sin compartir ni una unidad de red sin compartir no cumplen ni el lugar ni el compartir. Un documento en el equipo local con Marcar como final tampoco: la página dice que un documento marcado como final es de solo lectura y no se puede trabajar en coautoría hasta que se desactive."
  citation: "fuente: `ms-word-coautoria-documentos.html`; «Coautoría de documentos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-coautoria-documentos-html
- id: m06-l04-q127
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones realiza Word cuando otra persona abre un documento en coautoría?"
  options:
  - id: a
    text:
      es: "Cierra el documento a los demás usuarios hasta que termine de editar"
  - id: b
    correct: true
    text:
      es: "Le avisa y le muestra en qué parte del documento está trabajando"
  - id: c
    text:
      es: "Pide guardar el documento antes de que el nuevo usuario pueda ver nada"
  - id: d
    text:
      es: "Crea una copia del documento para cada usuario"
  explanation:
    es: "La página dice: «Cuando otra persona abre el documento, Word le avisa y le muestra en qué parte del documento está trabajando». Word avisa y muestra en qué parte trabaja la otra persona; el documento sigue abierto para todos. Word avisa y muestra en qué parte trabaja la otra persona. Word avisa y muestra en qué parte trabaja la otra persona, en el mismo documento."
  citation: "fuente: `ms-word-coautoria-documentos.html`; «Coautoría de documentos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-coautoria-html
- id: m06-l04-q128
  prompt:
    es: "En Word 365, ¿cómo se denomina que varias personas editen a la vez un mismo documento y vean la presencia y los cambios de las demás?"
  options:
  - id: a
    text:
      es: "Seguimiento de cambios de revisión"
  - id: b
    text:
      es: "Combinación de correspondencia masiva"
  - id: c
    text:
      es: "Marcar como final el documento"
  - id: d
    correct: true
    text:
      es: "Coautoría o colaboración en tiempo real"
  explanation:
    es: "La página dice: «Si cualquier otra persona está trabajando en el documento, verá su presencia y los cambios que está realizando. Esto se denomina coautoría o colaboración en tiempo real». La página trata el seguimiento de cambios como un tema aparte de la coautoría. La combinación de correspondencia crea un lote de documentos personalizados para cada destinatario. Un documento marcado como final es de solo lectura y no admite coautoría."
  citation: "fuente: `ms-word-coautoria.html`; «Colaborar en documentos de Word en coautoría a tiempo real»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-coautoria-documentos-html
- id: m06-l04-q129
  prompt:
    es: "Con una versión anterior de Word 365, o sin suscripción a Microsoft 365, ¿qué puede hacer falta para ver los cambios de otros usuarios y compartir los propios?"
  options:
  - id: a
    correct: true
    text:
      es: "Guardar el documento de vez en cuando"
  - id: b
    text:
      es: "Marcar el documento como final"
  - id: c
    text:
      es: "Guardar el documento como archivo .doc"
  - id: d
    text:
      es: "Abrir el documento siempre con la opción Abrir en el escritorio"
  explanation:
    es: "La página dice que quien usa una versión anterior de Word o no está suscrito a Microsoft 365 «es posible que tenga que guardar el documento periódicamente para ver los cambios de otros usuarios y compartir los suyos». Marcar como final deja el documento de solo lectura y no admite coautoría. La coautoría pide que el documento se guarde como archivo .docx. La página pide guardar el documento periódicamente, no cambiar de modo de apertura."
  citation: "fuente: `ms-word-coautoria-documentos.html`; «Coautoría de documentos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-coautoria-documentos-html
- id: m06-l04-q130
  prompt:
    es: "¿Cuál de los siguientes elementos impide la coautoría de un documento de Word 365 hasta que se desactiva?"
  options:
  - id: a
    text:
      es: "Guardar el documento en OneDrive"
  - id: b
    text:
      es: "Compartir el documento con otros usuarios"
  - id: c
    text:
      es: "Abrir el documento con Abrir en el escritorio"
  - id: d
    correct: true
    text:
      es: "Marcar como final el documento"
  explanation:
    es: "La página dice: «Un documento marcado como final es de solo lectura y no se puede trabajar en coautoría hasta que se desactive Marcar como final». La página pide guardar el documento en OneDrive o SharePoint para trabajar a la vez. La página pide compartir el documento con otros usuarios. La página ofrece cambiar de Edición a Abrir en el escritorio para trabajar en la aplicación de Word."
  citation: "fuente: `ms-word-coautoria-documentos.html`; «Si la coautoría no funciona»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-word-coautoria-documentos-html
- id: m06-l04-q131
  prompt:
    es: "Señale la comprobación que NO figura entre las que la página de Microsoft recomienda si falla la coautoría en Word 365:"
  options:
  - id: a
    text:
      es: "Que todos los usuarios usen una versión de Word que admita la coautoría"
  - id: b
    correct: true
    text:
      es: "Que el documento tenga menos de cien páginas"
  - id: c
    text:
      es: "Que el documento se guarde como archivo .docx"
  - id: d
    text:
      es: "Que el documento no contenga objetos OLE ni controles ActiveX"
  explanation:
    es: "La página enumera cinco comprobaciones: la versión de Word, el tipo de archivo, Marcar como final, la configuración de directiva y el contenido del documento. El número de páginas no está entre ellas, y por eso es la respuesta. Que todos usen una versión de Word compatible es el apartado «Versión de Word». Guardar el documento como .docx es el apartado «Tipo de archivo». Y que no tenga objetos OLE ni controles ActiveX es el apartado «Contenido del documento»."
  citation: "fuente: `ms-word-coautoria-documentos.html`; «Si la coautoría no funciona»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-word-coautoria-html
- id: m06-l04-q132
  prompt:
    es: "En Word 365, ¿qué ocurre con un documento que contiene macros (.docm) cuando se trabaja en coautoría?"
  options:
  - id: a
    text:
      es: "No se puede abrir en coautoría mientras tenga macros"
  - id: b
    text:
      es: "Solo se puede colaborar si antes se quitan todas las macros"
  - id: c
    correct: true
    text:
      es: "Se puede editar y colaborar en él, incluidas las macros"
  - id: d
    text:
      es: "Se abre como documento de solo lectura"
  explanation:
    es: "La página dice: «Si el documento contiene macros (.docm), aún puede editar y colaborar. Puede abrir y editar el contenido como cualquier otro documento, incluidas las macros en ejecución». La página dice que un documento con macros .docm aún se puede editar y colaborar. La página dice que se puede editar y colaborar con las macros incluidas. La página dice que se puede abrir y editar el contenido como cualquier otro documento."
  citation: "fuente: `ms-word-coautoria.html`; «Colaborar en documentos de Word en coautoría a tiempo real»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-combinar-correspondencia-html
- id: m06-l04-q133
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones describe lo que crea la combinación de correspondencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Un lote de documentos personalizados, uno para cada destinatario"
  - id: b
    text:
      es: "Una copia del documento traducida automáticamente a otro idioma"
  - id: c
    text:
      es: "Una lista de los términos y los temas del documento con sus páginas"
  - id: d
    text:
      es: "Una transcripción de texto de una grabación, con cada orador por separado"
  explanation:
    es: "La página dice: «La combinación de correspondencia le permite crear un lote de documentos personalizados para cada destinatario». Crear una copia traducida es lo que hace Traducir. Esa lista es el índice. Esa transcripción es lo que hace Transcribir."
  citation: "fuente: `ms-word-combinar-correspondencia.html`; «Usar la combinación de correspondencia de correo electrónico masivo, cartas, etiquetas y sobres»"
