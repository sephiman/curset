- id: m04-l01-q01
  prompt:
    en: In Kotlin, the variable `b` is declared as `String?` and holds null. What happens when the expression `b?.length`
      is evaluated?
  options:
  - id: a
    text:
      en: It returns `0`, the default value of `Int`
  - id: b
    text:
      en: It throws a `NullPointerException` at runtime
  - id: c
    text:
      en: It fails to compile, because `length` is not available on `String?`
  - id: d
    correct: true
    text:
      en: It returns `null` and no exception is thrown
  explanation:
    en: The `?.` operator returns null instead of throwing an NPE when the object is null. Returning `0` is wrong
      because the expression returns `b.length` if `b` is non-null, or null otherwise. Throwing a `NullPointerException`
      is wrong because the `?.` operator returns null instead of throwing an NPE when the object is null. A compile
      error is wrong because safe calls are allowed on a nullable receiver of type `String?`.
  citation: kotlin-docs-null-safety#safe-call-operator
  extract:
    en: Instead of throwing an NPE, if the object is null, the ?. operator simply returns null
- id: m04-l01-q02
  prompt:
    en: 'Which statement about the right-hand side of the Elvis operator in Kotlin, as in `left ?: right`, is correct?'
  options:
  - id: a
    text:
      en: It is returned whenever the left-hand side has a nullable type, even if its value is not null
  - id: b
    correct: true
    text:
      en: It is evaluated only if the left-hand side is null
  - id: c
    text:
      en: It is always evaluated first, and its result is dropped when the left-hand side is not null
  - id: d
    text:
      en: It must be a `throw` or `return` expression and never a plain value
  explanation:
    en: The right-hand side is evaluated only if the left-hand side is null. Returning the right side for every
      nullable left side is wrong because the Elvis operator returns the left expression when it is not null. Evaluating
      it first is wrong because the right-hand side is evaluated only if the left-hand side is null. Allowing only
      `throw` or `return` is wrong because they are expressions that you can also use on the right-hand side, next
      to plain values.
  citation: kotlin-docs-null-safety#elvis-operator
  extract:
    en: The expression on the right-hand side is evaluated only if the left-hand side is null.
- id: m04-l01-q03
  prompt:
    en: Which of these Kotlin properties can be marked with the `lateinit` modifier, assuming that none of them
      has a custom getter or setter?
  options:
  - id: a
    correct: true
    text:
      en: A `var` of type `String` declared in the class body
  - id: b
    text:
      en: A `val` of type `String` declared in the class body
  - id: c
    text:
      en: A `var` of type `Int` declared in the class body
  - id: d
    text:
      en: A `var` of type `String` declared in the primary constructor
  explanation:
    en: The `lateinit` modifier is allowed on `var` properties inside the body of a class, and a non-nullable `String`
      qualifies. A `val` is wrong because the modifier is used on `var` properties. A `var` of type `Int` is wrong
      because the property must not be a primitive type. A property in the primary constructor is wrong because
      a `lateinit` class property cannot be declared there.
  citation: kotlin-docs-properties#late-initialized-properties-and-variables
  extract:
    en: Properties inside the body of a class.
- id: m04-l01-q05
  prompt:
    en: In Kotlin, a variable receives a value of a Java type that has no nullability annotation. How does Kotlin
      treat the type of that Java declaration?
  options:
  - id: a
    text:
      en: As a non-nullable type, with every null check enforced at compile time
  - id: b
    text:
      en: As a nullable type, so every call on it needs `?.` or `!!`
  - id: c
    text:
      en: As a denotable type that the variable must name explicitly
  - id: d
    correct: true
    text:
      en: As a platform type, which Kotlin treats as non-denotable
  explanation:
    en: Types of Java declarations are treated in Kotlin as non-denotable platform types. A non-nullable type with
      enforced checks is wrong because null checks are relaxed for platform types. A nullable type is wrong because
      Kotlin does not issue nullability errors at compile time when you call methods on variables of platform types.
      A type that must be named is wrong because you cannot write the non-denotable types in the code explicitly.
  citation: kotlin-docs-java-interop#null-safety-and-platform-types
  extract:
    en: Types of Java declarations are treated in Kotlin as non-denotable and called platform types.
