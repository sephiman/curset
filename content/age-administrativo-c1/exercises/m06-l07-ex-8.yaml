# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q222
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que comprueba si hay mensajes nuevos es:"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+M o F9"
  - id: b
    text:
      es: "Ctrl+Mayús+M"
  - id: c
    text:
      es: "Ctrl+Entrar"
  - id: d
    text:
      es: "Ctrl+E o F3"
  explanation:
    es: "Ctrl+M o F9 comprueban si hay mensajes nuevos. Ctrl+E o F3 llevan al campo de búsqueda. Ctrl+Mayús+M crea un mensaje desde cualquier vista. Ctrl+Entrar envía un mensaje."
  citation: "fuente: `ms-outlook-atajos.html`; «Comprobar si hay nuevos mensajes. — Ctrl+M o F9»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q224
  prompt:
    es: "En Outlook 365, tanto en Outlook clásico como en el nuevo Outlook para Windows, ¿cuál de los siguientes métodos abreviados de teclado envía un mensaje?"
  options:
  - id: a
    text:
      es: "Ctrl+F"
  - id: b
    text:
      es: "Ctrl+N"
  - id: c
    text:
      es: "Ctrl+Mayús+R"
  - id: d
    correct: true
    text:
      es: "Ctrl+Entrar"
  explanation:
    es: "Ctrl+Entrar envía un mensaje en los dos clientes. Ctrl+F reenvía un mensaje. Ctrl+Mayús+R selecciona Responder a todos. Ctrl+N crea un mensaje nuevo."
  citation: "fuente: `ms-outlook-atajos.html`; «Enviar un mensaje. — Ctrl+Entrar»"
  difficulty: 1
  tags:
  - "atajo"
