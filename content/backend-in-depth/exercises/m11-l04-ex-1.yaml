- id: m11-l04-q02
  prompt:
    en: A JUnit Jupiter test passes a `Supplier<String>` as the failure message of an assertion, for example `()
      -> buildReport()`. Which statement about that message is correct?
  options:
  - id: a
    text:
      en: It is evaluated before the assertion runs, on every call
  - id: b
    text:
      en: It is evaluated once, when the test class is instantiated
  - id: c
    correct: true
    text:
      en: It is evaluated only when the assertion fails
  - id: d
    text:
      en: It is rejected, because the message parameter must be a `String`
  explanation:
    en: A message given as a `Supplier<String>` is only evaluated when the assertion fails. Evaluating it before
      the assertion on every call is wrong because the message is evaluated lazily, and so is evaluating it once
      at instantiation. Rejecting it is wrong because the message can be either a `String` or a `Supplier<String>`.
  citation: junit-writing-assertions#assertions
  extract:
    en: it is only evaluated when the assertion fails
- id: m11-l04-q03
  prompt:
    en: A test calls a Spring-managed bean from inside `assertTimeoutPreemptively` while Spring's test-managed transaction
      is active. What happens to the bean's database changes after the test finishes?
  options:
  - id: a
    text:
      en: They are rolled back together with the test-managed transaction
  - id: b
    correct: true
    text:
      en: They are committed, even though the test-managed transaction is rolled back
  - id: c
    text:
      en: They are rolled back, because the executable runs in the thread of the calling code
  - id: d
    text:
      en: They are rolled back, because Spring binds transaction state to the whole JVM
  explanation:
    en: The bean's actions are committed to the persistent store even though the test-managed transaction is rolled
      back. A rollback together with the test-managed transaction is wrong because those actions will not be rolled
      back with it. A rollback in the calling thread is wrong because `assertTimeoutPreemptively` runs the executable
      in a different thread. A rollback through JVM-wide transaction state is wrong because Spring binds transaction
      state to the current thread through a `ThreadLocal`.
  citation: junit-writing-assertions#assertions
  extract:
    en: such actions will be committed to the persistent store (e.g., relational database) even though the test-managed
      transaction is rolled back
- id: m11-l04-q04
  prompt:
    en: A Mockito test stubs `when(list.get(0)).thenReturn("a")` and, later in the same test, `when(list.get(0)).thenReturn("b")`.
      What does `list.get(0)` return afterwards?
  options:
  - id: a
    text:
      en: '`"a"`, because the first stubbing is kept'
  - id: b
    correct: true
    text:
      en: '`"b"`, because the last stubbing wins'
  - id: c
    text:
      en: '`null`, because the second stubbing resets the mock'
  - id: d
    text:
      en: An exception, because the same call was stubbed twice
  explanation:
    en: 'When the same method is stubbed with the same arguments many times, the last stubbing is more important,
      so `"b"` is returned. Keeping the first stubbing is wrong for the same reason: the last one wins. Returning
      `null` is wrong because once stubbed, the method will always return a stubbed value. An exception is wrong
      because stubbing can be overridden.'
  citation: mockito-javadoc-source#2
  extract:
    en: Last stubbing is more important - when you stubbed the same method with
- id: m11-l04-q06
  prompt:
    en: The snippet builds fixed clocks for the instant `2026-03-31T23:30:00Z` in `UTC` and `Europe/Madrid`, then
      checks an invoice due on `2026-03-31` against each clock. What does it print?
  options:
  - id: a
    text:
      en: '2026-03-31

        2026-03-31

        false

        false

        true'
  - id: b
    text:
      en: '2026-03-31

        2026-04-01

        false

        true

        false'
  - id: c
    text:
      en: '2026-03-31

        2026-04-01

        true

        true

        true'
  - id: d
    correct: true
    text:
      en: '2026-03-31

        2026-04-01

        false

        true

        true'
  explanation:
    en: The same instant is `2026-03-31` in `UTC` and `2026-04-01` in `Europe/Madrid`, so only the second clock
      finds the invoice overdue, and both clocks hold equal instants. The output with equal dates is wrong because
      the zone converts the instant to a different date. The output with `false` for the last line is wrong because
      the zone does not change the instant. The output with `true` for `UTC` is wrong because `isAfter` is false
      for a date equal to the due date.
  citation: javadoc-clock#fixed(java.time.Instant,java.time.ZoneId)
  snippet: m11-l04/FixedClockDemo.java
- id: m11-l04-q07
  prompt:
    en: The snippet checks `isExpired` with a fixed clock one second before, exactly at and one second after the
      expiry, then reads the clock twice. What does it print?
  options:
  - id: a
    text:
      en: 'offset -1: false

        offset 0: true

        offset 1: true

        same instant twice: true'
  - id: b
    text:
      en: 'offset -1: false

        offset 0: false

        offset 1: true

        same instant twice: false'
  - id: c
    correct: true
    text:
      en: 'offset -1: false

        offset 0: false

        offset 1: true

        same instant twice: true'
  - id: d
    text:
      en: 'offset -1: true

        offset 0: false

        offset 1: false

        same instant twice: true'
  explanation:
    en: '`isAfter` is false at the expiry and true one second later, and a fixed clock returns an equal instant
      each time. The output with `true` at the expiry is wrong because `isAfter` excludes an equal instant. The
      output ending in `false` is wrong because a fixed clock does not tick. The output starting with `true` is
      wrong because one second before the expiry the instant is not after it.'
  citation: javadoc-clock#fixed(java.time.Instant,java.time.ZoneId)
  snippet: m11-l04/ExpiryBoundary.java
- id: m11-l04-q08
  prompt:
    en: The snippet runs `midpoint` as `(low + high) / 2` on three input pairs, the last one near `Integer.MAX_VALUE`,
      and prints the expected value computed with `long`. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: '0,10 -> 5 expected 5

        4,4 -> 4 expected 4

        2147483646,2147483647 -> -1 expected 2147483646'
  - id: b
    text:
      en: '0,10 -> 5 expected 5

        4,4 -> 4 expected 4

        2147483646,2147483647 -> 2147483646 expected 2147483646'
  - id: c
    text:
      en: '0,10 -> 5 expected 5

        4,4 -> 4 expected 4

        2147483646,2147483647 -> -2 expected 2147483646'
  - id: d
    text:
      en: '0,10 -> 5 expected 5

        4,4 -> 4 expected 4

        2147483646,2147483647 -> -1 expected -1'
  explanation:
    en: The sum of the last pair overflows `int` to `-3`, and `-3 / 2` truncates to `-1`, while the `long` computation
      gives `2147483646`. The output without a difference is wrong because `int` addition overflows silently. The
      output with `-2` is wrong because integer division truncates toward zero. The output with `expected -1` is
      wrong because the expected value is computed with `long`.
  citation: javadoc-integer#MAX_VALUE
