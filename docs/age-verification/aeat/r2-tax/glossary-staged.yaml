# Tax-part glossary entries staged for the blind check (r2-tax/glossary-verify.md), then copied to glossary.yaml.
- id: g-impuesto
  es: impuesto
  origin: m03-l01
  definition:
    es: Tributo exigido sin contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente (art. 2.2.c) LGT).
- id: g-tributos-cedidos
  es: tributos cedidos
  origin: m03-l01
  definition:
    es: Los establecidos y regulados por el Estado cuyo producto corresponde a la Comunidad Autónoma (art. 10.1 LOFCA).
- id: g-hacienda-publica-estatal
  es: Hacienda Pública estatal
  origin: m03-l01
  definition:
    es: El conjunto de derechos y obligaciones de contenido económico cuya titularidad corresponde a la Administración General del Estado y a sus organismos autónomos (art. 5.1 LGP).
