type: case
title:
  es: "El Encuentro Joven del Injuve"
scenario:
  es: "El Instituto de la Juventud (Injuve), organismo autónomo del Ministerio de Juventud e Infancia, está en Madrid. Ningún festivo cae en los plazos por días; los plazos por meses terminan en día hábil.\n\nEl lunes, 7 de junio de 2027, Doña Marta Lozano Rebollo presenta una queja sobre la oficina de información juvenil del Injuve. Álvaro Prieto Zamora, de trece años, se inscribe en el Encuentro Joven.\n\nEl Injuve convoca ayudas para asociaciones juveniles en concurrencia competitiva. Mirador presenta una solicitud, y Faro se persona como interesada. El jueves, 10 de junio de 2027, notifica que resolverá también una cuestión conexa que nadie planteó. El martes, 15 de junio de 2027, Mirador desiste y el Instituto notifica ese día el desistimiento a Faro.\n\nEl Instituto licita por procedimiento abierto el contrato de servicios del Encuentro, en tres lotes: alojamiento, de 60.000 euros; transporte, de 30.000, y actividades, de 40.000, de presupuesto base de licitación, IVA excluido. El valor estimado es de 130.000 euros, no sujeto a regulación armonizada, y se admiten ofertas electrónicas. El anuncio sale en el perfil de contratante el lunes, 14 de junio de 2027. Se exige garantía provisional, motivada, y una empresa licita a los lotes de alojamiento y de transporte. El adjudicatario del lote de actividades ofrece constituir la garantía definitiva mediante retención en el precio. El Instituto paga por anticipo de caja fija la maquetación del programa, contrato menor de servicios de 4.600 euros, IVA del 21 % excluido.\n\nDoña Elena Barroso Lidón, funcionaria de carrera, cobra 2.350 euros mensuales; pide reducir su jornada para cuidar de su hija de once años, sana, y luego a la mitad durante un mes por la enfermedad muy grave de su padre. El miércoles, 9 de junio de 2027, el Instituto pide un informe sobre la petición y declara urgente la tramitación. Doña Carmen Olmedo Pardo, funcionaria de carrera, cumple el sexto trienio el miércoles, 16 de junio de 2027. Don Gonzalo Ibáñez Tapia, funcionario de carrera con doce años de servicios efectivos en las Administraciones Públicas, pide la excedencia voluntaria por interés particular. Don Matías Quirós Aldea, funcionario de carrera, comete una falta leve continuada de puntualidad desde el lunes, 1 de marzo de 2027, hasta el martes, 1 de junio de 2027.\n\nDoña Natalia Cuesta Mena, del Cuerpo de Gestión (Subgrupo A2), sale a Valencia el miércoles, 23 de junio de 2027, a las 16:30, vuelve el jueves, 24 de junio, a las 12:00 y justifica 60,00 euros de alojamiento. Don Hugo Segarra Palomar, del Cuerpo Superior de Administradores Civiles del Estado, sale a Sevilla el martes, 29 de junio de 2027, a las 7:30 y vuelve el jueves, 1 de julio, a las 23:15, con cena fuera de Madrid prevista en la orden; justifica 60,00 y 62,00 euros de alojamiento y la factura de la cena.\n\nEl Injuve adjudica en 2027 el mantenimiento del portal juvenil, de 2027 a 2029, con inicio en septiembre de 2027; el crédito inicial de 2027 de su aplicación es de 150.000 euros. Quiere comprometer tres anualidades para una subvención a la Federación Brújula, prevista nominativamente en los Presupuestos Generales del Estado. Para una jornada en Lisboa libra fondos a justificar a su habilitada, que los percibe el miércoles, 9 de junio de 2027.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2005-14836-art-16
- id: q01
  lesson: m02-l01
  prompt:
    es: "Según el artículo 16.1 del Real Decreto 951/2005, de 29 de julio, ¿hasta qué fecha debe la unidad responsable informar a Doña Marta Lozano Rebollo de las actuaciones realizadas sobre su queja?"
  options:
  - id: a
    text:
      es: "El viernes, 2 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 5 de julio de 2027."
  - id: c
    text:
      es: "El lunes, 21 de junio de 2027."
  - id: d
    text:
      es: "El miércoles, 7 de julio de 2027."
  explanation:
    es: "La unidad informa en 20 días hábiles desde la recepción de la queja (art. 16.1 RD 951/2005). La queja entra el lunes, 7 de junio de 2027, y el cómputo empieza el martes, 8 de junio. Sin sábados ni domingos, el vigésimo día hábil es el lunes, 5 de julio de 2027, y no hay festivos en ese periodo. La fecha del viernes, 2 de julio de 2027, cuenta como primer día el de la presentación. La del lunes, 21 de junio de 2027, usa los 10 días hábiles de las aclaraciones del apartado 2. La del miércoles, 7 de julio de 2027, toma un mes en lugar de 20 días hábiles."
  citation: "art. 16.1 RD 951/2005"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2018-16673-art-7
- id: q02
  lesson: m02-l04
  prompt:
    es: "¿Puede el Injuve fundar en el propio consentimiento de Álvaro el tratamiento de sus datos para inscribirlo en el Encuentro Joven?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque solo se funda en el consentimiento del menor si es mayor de catorce años."
  - id: b
    text:
      es: "Sí, porque desde los trece años el menor puede consentir por sí mismo."
  - id: c
    text:
      es: "Sí, porque el consentimiento del menor basta cuando el Instituto es una Administración pública."
  - id: d
    text:
      es: "No, porque el consentimiento de un menor nunca es válido sin importar su edad."
  explanation:
    es: "El tratamiento de los datos de un menor solo puede fundarse en su consentimiento si es mayor de catorce años (art. 7.1 LOPDGDD). Álvaro tiene trece, así que no basta su consentimiento; debe constar el de quien tenga la patria potestad o la tutela (art. 7.2). La opción de los trece años baja el umbral en un año. La de la Administración pública inventa una excepción que la ley no prevé. La del consentimiento siempre inválido ignora que el mayor de catorce años sí puede consentir."
  citation: "art. 7.1 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2015-10565-art-33
- id: q03
  lesson: m03-l03
  prompt:
    es: "Según el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe emitirse el informe que el Instituto pidió con tramitación de urgencia, si su plazo ordinario es de diez días hábiles?"
  options:
  - id: a
    text:
      es: "El miércoles, 23 de junio de 2027."
  - id: b
    text:
      es: "El lunes, 14 de junio de 2027."
  - id: c
    text:
      es: "El martes, 15 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 16 de junio de 2027."
  explanation:
    es: "La tramitación de urgencia reduce a la mitad los plazos del procedimiento ordinario (art. 33 LPAC), y diez días hábiles pasan a cinco. El cómputo empieza el jueves, 10 de junio de 2027; sin sábados ni domingos, el quinto día hábil es el miércoles, 16 de junio de 2027. La fecha del miércoles, 23 de junio de 2027, aplica el plazo ordinario. La del lunes, 14 de junio de 2027, cuenta cinco días naturales, con sábado y domingo. La del martes, 15 de junio de 2027, cuenta como primer día el de la petición."
  citation: "art. 33 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-88
- id: q21
  lesson: m03-l03
  prompt:
    es: "Según el artículo 88.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál es la última fecha en que puede terminar el plazo que el Instituto da a los interesados para alegar sobre la cuestión conexa que nadie planteó?"
  options:
  - id: a
    text:
      es: "El viernes, 25 de junio de 2027."
  - id: b
    text:
      es: "El miércoles, 30 de junio de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 1 de julio de 2027."
  - id: d
    text:
      es: "El jueves, 24 de junio de 2027."
  explanation:
    es: "El órgano puede pronunciarse sobre cuestiones conexas poniéndolas de manifiesto por un plazo no superior a quince días (art. 88.1 LPAC), hábiles por defecto, y la tramitación de urgencia solo afecta a la solicitud de Doña Elena. El cómputo empieza el viernes, 11 de junio de 2027, y el decimoquinto día hábil es el jueves, 1 de julio de 2027. La fecha del viernes, 25 de junio de 2027, cuenta quince días naturales. La del miércoles, 30 de junio de 2027, cuenta como primer día el de la notificación. La del jueves, 24 de junio de 2027, usa diez días hábiles, que es el plazo mínimo de la audiencia."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-94
- id: q22
  lesson: m03-l03
  prompt:
    es: "¿Hasta qué fecha puede la asociación Faro, como tercera interesada personada, pedir que continúe el procedimiento tras el desistimiento de Mirador?"
  options:
  - id: a
    text:
      es: "El viernes, 25 de junio de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 29 de junio de 2027."
  - id: c
    text:
      es: "El lunes, 28 de junio de 2027."
  - id: d
    text:
      es: "El martes, 6 de julio de 2027."
  explanation:
    es: "La Administración acepta de plano el desistimiento y declara concluso el procedimiento, salvo que los terceros interesados personados insten su continuación en diez días desde que fueron notificados (art. 94.4 LPAC); los días son hábiles. Mirador era la única solicitante, y la tramitación de urgencia solo afecta a la solicitud de Doña Elena. Faro recibe la notificación el martes, 15 de junio de 2027, el cómputo empieza el miércoles, 16, y el décimo día hábil es el martes, 29 de junio de 2027. La fecha del viernes, 25 de junio de 2027, cuenta diez días naturales. La del lunes, 28 de junio de 2027, cuenta como primer día el de la notificación. La del martes, 6 de julio de 2027, usa quince días hábiles, que no figuran en el artículo."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-156
- id: q06
  lesson: m03-l04
  prompt:
    es: "Según el artículo 156.6 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es la fecha más temprana en que puede terminar el plazo de presentación de proposiciones del contrato del Encuentro Joven?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 29 de junio de 2027."
  - id: b
    text:
      es: "El lunes, 28 de junio de 2027."
  - id: c
    text:
      es: "El jueves, 24 de junio de 2027."
  - id: d
    text:
      es: "El lunes, 5 de julio de 2027."
  explanation:
    es: "El contrato no está sujeto a regulación armonizada (130.000 euros, por debajo del umbral de 140.000), así que el plazo no es inferior a quince días desde el día siguiente a la publicación del anuncio (art. 156.6 LCSP). Los días de la LCSP son naturales (disposición adicional duodécima). El cómputo empieza el martes, 15 de junio de 2027, y el decimoquinto día es el martes, 29 de junio de 2027, hábil. La fecha del lunes, 28 de junio de 2027, cuenta como primer día el de la publicación. La del jueves, 24 de junio de 2027, aplica la reducción de cinco días por ofertas electrónicas, que es del contrato armonizado (art. 156.3.c). La del lunes, 5 de julio de 2027, cuenta quince días hábiles."
  citation: "art. 156.6 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-106
- id: q07
  lesson: m03-l04
  prompt:
    es: "¿Qué importe máximo de garantía provisional puede fijarse para la empresa que licita solo a los lotes de alojamiento y de transporte?"
  options:
  - id: a
    text:
      es: "Un importe máximo de 3.900 euros."
  - id: b
    text:
      es: "Un importe máximo de 3.267 euros."
  - id: c
    text:
      es: "Un importe máximo de 4.500 euros."
  - id: d
    correct: true
    text:
      es: "Un importe máximo de 2.700 euros."
  explanation:
    es: "La garantía provisional no puede superar el 3 por 100 del presupuesto base de licitación, excluido el IVA (art. 106.2 LCSP), y con lotes se fija solo por los lotes a los que el licitador oferta: 3 % de 90.000 (60.000 más 30.000) son 2.700 euros. Los 3.900 euros toman el 3 % de los tres lotes, 130.000 euros. Los 3.267 euros calculan el 3 % con IVA del 21 %. Los 4.500 euros aplican el 5 % de la garantía definitiva."
  citation: "art. 106.2 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-108
- id: q08
  lesson: m03-l04
  prompt:
    es: "¿Qué condición debe cumplirse para que el adjudicatario del lote de actividades constituya la garantía definitiva mediante retención en el precio?"
  options:
  - id: a
    text:
      es: "Que el adjudicatario lo pida y el órgano de contratación lo acepte en el contrato."
  - id: b
    text:
      es: "Que el contrato sea de obras, único tipo en que cabe la retención en el precio."
  - id: c
    correct: true
    text:
      es: "Que lo prevea el pliego de cláusulas administrativas particulares, que fijará la forma y condiciones."
  - id: d
    text:
      es: "Que lo autorice la persona titular del Ministerio de Hacienda a petición del órgano de contratación."
  explanation:
    es: "La garantía definitiva de los contratos de obras, suministros y servicios puede constituirse mediante retención en el precio cuando lo prevean los pliegos, que fijan forma y condiciones (art. 108.2 LCSP). El lote de actividades es de servicios, así que cabe. La opción de la petición del adjudicatario olvida que debe estar en el pliego. La de las obras excluye suministros y servicios. La del Ministerio de Hacienda inventa una autorización que la ley no pide."
  citation: "art. 108.2 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2017-12902-art-118
- id: q09
  lesson: m03-l04
  prompt:
    es: "¿Debe el órgano de contratación emitir el informe que justifica la necesidad y que no se altera el objeto en el contrato menor de maquetación del programa?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque se paga por anticipo de caja fija y el valor estimado no excede de 5.000 euros."
  - id: b
    text:
      es: "Sí, porque con el IVA del 21 % el importe supera los 5.000 euros."
  - id: c
    text:
      es: "Sí, porque todo contrato menor exige ese informe, se pague como se pague."
  - id: d
    text:
      es: "No, porque los contratos menores de servicios no exigen informe alguno."
  explanation:
    es: "El informe del apartado 2 no se exige en los contratos pagados por anticipo de caja fija cuyo valor estimado no exceda de 5.000 euros (art. 118.5 LCSP). El valor estimado excluye el IVA: son 4.600 euros, no los 5.566 con IVA. La opción del IVA incluido cuenta el impuesto que el valor estimado deja fuera. La del informe siempre obligatorio ignora la excepción. La de los servicios sin informe la extiende a todos, también a los que se pagan por otro sistema."
  citation: "art. 118.5 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11719-art-48
- id: q10
  lesson: m04-l05
  prompt:
    es: "Según el artículo 48.h) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿con qué consecuencia retributiva reduce Doña Elena Barroso Lidón su jornada para cuidar de su hija?"
  options:
  - id: a
    text:
      es: "Con retribución íntegra, durante un mes como máximo."
  - id: b
    correct: true
    text:
      es: "Con la disminución de sus retribuciones que corresponda."
  - id: c
    text:
      es: "Con retribución íntegra mientras la menor tenga menos de doce años."
  - id: d
    text:
      es: "Sin derecho a reducirla, porque su hija no padece una enfermedad grave."
  explanation:
    es: "Quien tiene el cuidado directo de un menor de doce años tiene derecho a reducir la jornada con la disminución de retribuciones que corresponda (art. 48.h TREBEP). La hija tiene once años, así que cumple el requisito. La retribución íntegra por un mes máximo es la regla del cuidado de un familiar de primer grado con enfermedad muy grave (art. 48.i), que no es este caso. La retribución íntegra hasta los doce años no existe en el artículo. La falta de derecho confunde la guarda legal con el supuesto de enfermedad."
  citation: "art. 48.h) TREBEP"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: q11
  lesson: m04-l05
  prompt:
    es: "Según el artículo 48.i) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué retribución mensual percibe Doña Elena al reducir a la mitad su jornada por la enfermedad de su padre?"
  options:
  - id: a
    text:
      es: "Percibe 1.175,00 euros al mes."
  - id: b
    text:
      es: "Percibe 1.762,50 euros al mes."
  - id: c
    correct: true
    text:
      es: "Percibe 2.350,00 euros al mes."
  - id: d
    text:
      es: "Percibe 587,50 euros al mes."
  explanation:
    es: "El funcionario puede reducir hasta el 50 % de la jornada, con carácter retribuido, por la enfermedad muy grave de un familiar de primer grado y por un máximo de un mes (art. 48.i TREBEP). El padre es familiar de primer grado y la reducción dura un mes, así que cobra los 2.350,00 euros íntegros. Los 1.175,00 euros descuentan la mitad, como si no fuera retribuida. Los 1.762,50 euros descuentan una cuarta parte. Los 587,50 euros dejan solo esa cuarta parte."
  citation: "art. 48.i) TREBEP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2026-8287-apartado-9
- id: q12
  lesson: m04-l05
  prompt:
    es: "Conforme a las instrucciones vigentes sobre jornada y horarios del personal de la Administración General del Estado y sus organismos públicos, ¿desde qué fecha tiene Doña Carmen Olmedo Pardo derecho a los dos días adicionales de asuntos particulares?"
  options:
  - id: a
    text:
      es: "El miércoles, 16 de junio de 2027."
  - id: b
    text:
      es: "El jueves, 1 de julio de 2027."
  - id: c
    text:
      es: "El viernes, 16 de junio de 2028."
  - id: d
    correct: true
    text:
      es: "El jueves, 17 de junio de 2027."
  explanation:
    es: "Los dos días adicionales de asuntos particulares se disfrutan desde el día siguiente al del cumplimiento del sexto trienio (apartado 9.7 de la Resolución). El trienio se cumple el miércoles, 16 de junio de 2027, y los días corren desde el jueves, 17 de junio de 2027. La fecha del miércoles, 16 de junio de 2027, da el mismo día del cumplimiento. La del jueves, 1 de julio de 2027, los concede desde el primer día del mes siguiente. La del viernes, 16 de junio de 2028, espera un año al cumplimiento."
  citation: "apartado 9.7 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1995-8730-art-16
- id: q13
  lesson: m04-l04
  prompt:
    es: "Según el artículo 16.3 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿qué duración máxima puede tener la excedencia voluntaria por interés particular de Don Gonzalo Ibáñez Tapia?"
  options:
  - id: a
    correct: true
    text:
      es: "Doce años, los que acredita de servicios efectivos."
  - id: b
    text:
      es: "Quince años, el máximo general del Reglamento."
  - id: c
    text:
      es: "Cinco años, el periodo de servicios previo exigido."
  - id: d
    text:
      es: "Dos años, la duración mínima de cada periodo."
  explanation:
    es: "Cada periodo de excedencia dura no menos de dos años continuados ni más de los años de servicios que el funcionario acredite, con un máximo de quince (art. 16.3 RD 365/1995). Don Gonzalo acredita doce, menos que el tope de quince: doce años. La opción de los quince años aplica el máximo general sin mirar los servicios. La de los cinco años toma los servicios previos que exige el apartado 2. La de los dos años toma el mínimo."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-11719-art-97
- id: q26
  lesson: m04-l06
  prompt:
    es: "Según el artículo 97 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, si Don Matías Quirós Aldea comete además una falta leve aislada el martes, 22 de junio de 2027, ¿qué día prescribe?"
  options:
  - id: a
    text:
      es: "El jueves, 23 de diciembre de 2027."
  - id: b
    text:
      es: "El miércoles, 22 de septiembre de 2027."
  - id: c
    text:
      es: "El domingo, 19 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 22 de diciembre de 2027."
  explanation:
    es: "Las faltas leves prescriben a los seis meses, y el plazo se cuenta desde que se cometieron, salvo en las continuadas, que lo hacen desde el cese de su comisión (art. 97.1 y 97.2 TREBEP). La falta del martes, 22 de junio de 2027, es aislada, así que corre desde ese día. Los meses se cuentan de fecha a fecha desde el día siguiente: el sexto acaba el miércoles, 22 de diciembre de 2027. La fecha del jueves, 23 de diciembre de 2027, cuenta los seis meses desde el día siguiente a la falta. La del domingo, 19 de diciembre de 2027, cuenta seis meses de treinta días. La del miércoles, 22 de septiembre de 2027, aplica tres meses. La falta continuada de marzo a junio sigue otra regla, porque su plazo corre desde que cesó."
  citation: "art. 97 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2002-10337-art-12
- id: q24
  lesson: m05-l04
  prompt:
    es: "Según el artículo 12.2 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿qué importe total percibe Doña Natalia Cuesta Mena por su comisión de servicio a Valencia?"
  options:
  - id: a
    text:
      es: "Percibe un total de 84,67 euros."
  - id: b
    correct: true
    text:
      es: "Percibe un total de 78,70 euros."
  - id: c
    text:
      es: "Percibe un total de 97,40 euros."
  - id: d
    text:
      es: "Percibe un total de 60,00 euros."
  explanation:
    es: "El Subgrupo A2 es grupo 2 (alojamiento 65,97 euros, manutención 37,40). La comisión dura 19 horas y 30 minutos y toca dos días naturales: alojamiento de un solo día y manutención como en los días de salida y regreso (art. 12.2 RD 462/2002). Sale a las 16:30, después de las catorce y antes de las veintidós, así que el 50 % de la manutención, 18,70 euros; vuelve antes de las catorce, sin manutención. El alojamiento se paga por lo justificado, 60,00 euros. Total, 78,70 euros. Los 84,67 euros pagan el máximo del grupo en vez de lo gastado. Los 97,40 euros dan la manutención entera. Los 60,00 euros olvidan la manutención."
  citation: "art. 12.2 RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2002-10337-art-12
