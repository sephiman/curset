# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0138
  prompt:
    es: "De acuerdo con el artículo 4.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se exceptúan de la no sujeción a «transmisiones patrimoniales onerosas» las entregas y arrendamientos de bienes inmuebles exentos del impuesto, salvo que el sujeto pasivo:"
  options:
  - id: a
    text:
      es: "solicite la exención a la Administración tributaria con carácter previo."
  - id: b
    correct: true
    text:
      es: "renuncie a la exención en las circunstancias y con las condiciones que la ley prevé para la renuncia."
  - id: c
    text:
      es: "adquiera el inmueble para su uso personal y no para su actividad."
  - id: d
    text:
      es: "repercuta el impuesto sin haber presentado la declaración censal."
  explanation:
    es: "Los inmuebles exentos del IVA tributan por «transmisiones patrimoniales onerosas», salvo que el sujeto pasivo renuncie a la exención en las condiciones previstas. La solicitud previa, el uso personal del adquirente y la declaración censal no son la salvedad."
  citation: "art. 4.Cuatro LIVA"
  difficulty: 3
  tags:
  - "hecho imponible"
  - "ITP"
  - "renuncia"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0139
  prompt:
    es: "Según el artículo 5.Uno.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se reputan empresarios o profesionales quienes realicen entregas de bienes o prestaciones de servicios que supongan la explotación de un bien corporal o incorporal con el fin de obtener:"
  options:
  - id: a
    text:
      es: "ingresos superiores al salario mínimo interprofesional anual."
  - id: b
    text:
      es: "un beneficio superior al coste de adquisición del bien."
  - id: c
    text:
      es: "ingresos que se perciban de una sola vez en el ejercicio."
  - id: d
    correct: true
    text:
      es: "ingresos continuados en el tiempo."
  explanation:
    es: "La explotación de un bien con el fin de obtener ingresos continuados en el tiempo hace empresario a quien la realiza. El beneficio sobre el coste, un mínimo de ingresos y el cobro único no son el criterio."
  citation: "art. 5.Uno LIVA"
  difficulty: 1
  tags:
  - "empresario o profesional"
  - "explotación de bienes"
# anchor: boe-a-1992-28740-art-6
- id: m03-l18-q0141
  prompt:
    es: "Conforme al artículo 6.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las construcciones que enumera son edificaciones siempre que estén unidas a un inmueble de una manera fija, de suerte que no puedan separarse de él sin:"
  options:
  - id: a
    text:
      es: "un coste superior al 25 por ciento de su valor de mercado."
  - id: b
    text:
      es: "consentimiento del propietario del suelo sobre el que se asientan."
  - id: c
    correct: true
    text:
      es: "quebranto de la materia ni deterioro del objeto."
  - id: d
    text:
      es: "autorización de la Administración urbanística competente."
  explanation:
    es: "Las construcciones de la lista son edificaciones si no pueden separarse del inmueble sin quebranto de la materia ni deterioro del objeto. La autorización urbanística, el consentimiento del propietario y un coste del 25 por ciento no son el criterio."
  citation: "art. 6.Dos LIVA"
  difficulty: 2
  tags:
  - "edificaciones"
  - "unión fija"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0143
  prompt:
    es: "Según el artículo 7.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué entregas gratuitas no están sujetas al impuesto?"
  options:
  - id: a
    text:
      es: "Las de muestras de mercancías sin valor comercial, con fines de beneficencia."
  - id: b
    correct: true
    text:
      es: "Las de muestras de mercancías sin valor comercial estimable, con fines de promoción de las actividades empresariales o profesionales."
  - id: c
    text:
      es: "Las de cualquier mercancía con fines de promoción, hasta un coste de 200 euros por destinatario."
  - id: d
    text:
      es: "Las de muestras de mercancías con valor comercial estimable, con fines de promoción de la actividad."
  explanation:
    es: "La no sujeción exige muestras sin valor comercial estimable y fines de promoción de la actividad. Si tienen valor comercial estimable no se benefician, el límite de 200 euros es el de los objetos publicitarios y el fin benéfico no es el que prevé el precepto."
  citation: "art. 7.2.º LIVA"
  difficulty: 1
  tags:
  - "no sujeción"
  - "muestras"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0144
  prompt:
    es: "De acuerdo con el artículo 7.8.º.F) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están sujetas en todo caso las entregas y prestaciones de las Administraciones en actividades como las telecomunicaciones, los transportes de personas y bienes y:"
  options:
  - id: a
    text:
      es: "las de expedición de documentos de identidad."
  - id: b
    text:
      es: "las de asistencia social a la tercera edad."
  - id: c
    text:
      es: "las de enseñanza universitaria pública."
  - id: d
    correct: true
    text:
      es: "las de agencias de viajes."
  explanation:
    es: "Las agencias de viajes figuran entre las actividades de la lista que quedan siempre sujetas. La enseñanza pública, la asistencia social y la expedición de documentos no están en ella."
  citation: "art. 7.8.º.F) LIVA"
  difficulty: 1
  tags:
  - "no sujeción"
  - "Administraciones Públicas"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0163
  prompt:
    es: "Según el artículo 7.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, quedan sujetas las entregas de objetos publicitarios cuando el coste total de los suministros a un mismo destinatario durante el año natural exceda de 200 euros, a menos que se entreguen a otros sujetos pasivos para su:"
  options:
  - id: a
    text:
      es: "reventa a consumidores finales dentro del territorio de aplicación."
  - id: b
    text:
      es: "exportación fuera de la Comunidad por parte del destinatario."
  - id: c
    correct: true
    text:
      es: "redistribución gratuita."
  - id: d
    text:
      es: "uso en las propias instalaciones del sujeto pasivo destinatario."
  explanation:
    es: "La excepción a la sujeción no opera si el destinatario es un sujeto pasivo que redistribuye los objetos gratuitamente. La reventa, la exportación y el uso en sus instalaciones no están en el precepto, así que esas entregas quedan sujetas al superar los 200 euros."
  citation: "art. 7.4.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "objetos publicitarios"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0167
  prompt:
    es: "Señale cuál de las siguientes personas se reputa empresario o profesional a efectos del impuesto, según el artículo 5.Uno.d) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Quien realiza exclusivamente entregas gratuitas de bienes a una fundación."
  - id: b
    text:
      es: "Quien vende de forma ocasional un vehículo usado que no empleaba en ninguna actividad."
  - id: c
    correct: true
    text:
      es: "Quien promueve la construcción de edificaciones destinadas, en todos los casos, a su venta, aunque lo haga de forma ocasional."
  - id: d
    text:
      es: "Quien presta servicios por cuenta ajena en régimen de dependencia laboral."
  explanation:
    es: "Quien promueve edificaciones destinadas a su venta es empresario aunque actúe de forma ocasional. La venta ocasional de un vehículo usado no encaja en ninguna letra del artículo 5.Uno, quien solo entrega gratuitamente no es empresario y el trabajador dependiente tampoco ordena factores de producción por cuenta propia."
  citation: "art. 5.Uno LIVA"
  difficulty: 2
  tags:
  - "empresario o profesional"
  - "promotor"
# anchor: boe-a-1992-28740-art-6
- id: m03-l18-q0168
  prompt:
    es: "Señale la respuesta CORRECTA sobre el concepto de edificación, según el artículo 6.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "No tienen la consideración de edificaciones los edificios concebidos para ser utilizados como vivienda."
  - id: b
    correct: true
    text:
      es: "No tienen la consideración de edificaciones las minas, canteras o escoriales, pozos de petróleo o de gas u otros lugares de extracción de productos naturales."
  - id: c
    text:
      es: "No tienen la consideración de edificaciones las instalaciones industriales no habitables, como diques, tanques o cargaderos."
  - id: d
    text:
      es: "No tienen la consideración de edificaciones los puertos, aeropuertos y mercados unidos de manera fija a un inmueble."
  explanation:
    es: "Las minas, canteras, escoriales, pozos y otros lugares de extracción de productos naturales no son edificaciones. Los puertos, aeropuertos y mercados, los edificios y las instalaciones industriales no habitables sí lo son, según el artículo 6.Dos."
  citation: "art. 6.Tres LIVA"
  difficulty: 2
  tags:
  - "edificaciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0169
  prompt:
    es: "Señale la respuesta CORRECTA sobre los servicios prestados en régimen de dependencia, según el artículo 7.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Están sujetos los prestados por funcionarios públicos en régimen de relación administrativa."
  - id: b
    text:
      es: "Están sujetos los prestados por trabajadores con contrato laboral de carácter especial."
  - id: c
    text:
      es: "No están sujetos los prestados por profesionales liberales a sus clientes habituales."
  - id: d
    correct: true
    text:
      es: "No están sujetos los prestados por personas físicas en régimen de dependencia derivado de relaciones administrativas o laborales."
  explanation:
    es: "No están sujetos los servicios prestados en régimen de dependencia derivado de relaciones administrativas o laborales. Quedan comprendidos los funcionarios y los contratos laborales de carácter especial. El profesional liberal que presta servicios por cuenta propia a sus clientes sí realiza una prestación sujeta."
  citation: "art. 7.5.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "dependencia"
# anchor: boe-a-1992-28740-art-6
- id: m03-l18-q0174
  prompt:
    es: "¿Cuál de las siguientes construcciones tiene la consideración de edificación, siempre que esté unida a un inmueble de manera fija, según el artículo 6.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Las instalaciones industriales no habitables, tales como diques, tanques o cargaderos."
  - id: b
    text:
      es: "Las obras de urbanización de terrenos, como los accesos, las calles y las aceras."
  - id: c
    text:
      es: "Las minas, canteras y escoriales, aunque estén unidos a un inmueble."
  - id: d
    text:
      es: "Las redes de distribución de gas y de suministro de energía eléctrica."
  explanation:
    es: "Las instalaciones industriales no habitables, como diques, tanques o cargaderos, son edificaciones. Las obras de urbanización, las redes de distribución de gas o electricidad que forman parte de ellas y las minas y canteras quedan excluidas por el artículo 6.Tres."
  citation: "art. 6.Dos LIVA"
  difficulty: 2
  tags:
  - "edificaciones"
  - "enumeración"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0181
  prompt:
    es: "Según el artículo 7.12.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no están sujetas al impuesto:"
  options:
  - id: a
    text:
      es: "Las prestaciones de hospitalización realizadas por entidades de Derecho público."
  - id: b
    text:
      es: "Las operaciones de seguro, reaseguro y capitalización realizadas por aseguradoras."
  - id: c
    text:
      es: "La concesión de créditos y préstamos en dinero, cualquiera que sea su instrumentación."
  - id: d
    correct: true
    text:
      es: "Las entregas de dinero a título de contraprestación o pago."
  explanation:
    es: "No están sujetas al impuesto las entregas de dinero a título de contraprestación o pago (art. 7.12.º). Las operaciones de seguro, reaseguro y capitalización, la concesión de créditos y préstamos en dinero y las prestaciones de hospitalización de entidades de Derecho público sí están sujetas, pero exentas (art. 20.Uno.16.º, 20.Uno.18.º.c) y 20.Uno.2.º). La exención presupone la sujeción, mientras que la no sujeción excluye la operación del hecho imponible."
  citation: "art. 7.12.º LIVA"
  difficulty: 1
  tags:
  - "no sujeción"
  - "hecho imponible"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0045
  prompt:
    es: "Según el artículo 8.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se considerará entrega de bienes la transmisión del poder de disposición sobre bienes corporales, incluso si se efectúa mediante:"
  options:
  - id: a
    text:
      es: "contrato de mandato para la gestión de dichos bienes."
  - id: b
    text:
      es: "depósito de dichos bienes en un almacén de terceros."
  - id: c
    correct: true
    text:
      es: "cesión de títulos representativos de dichos bienes."
  - id: d
    text:
      es: "cesión del uso y disfrute temporal de dichos bienes."
  explanation:
    es: "La entrega puede hacerse mediante la cesión de títulos representativos de los bienes. La cesión de uso y disfrute es una prestación de servicios, y el mandato y el depósito no transmiten el poder de disposición."
  citation: "art. 8.Uno LIVA"
  difficulty: 1
  tags:
  - "entrega de bienes"
  - "concepto"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0046
  prompt:
    es: "Señale cuál de los siguientes tiene la condición de bien corporal a efectos del impuesto, según el artículo 8.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "La energía eléctrica y las demás modalidades de energía, como el gas, el calor y el frío."
  - id: b
    text:
      es: "Las acciones de una sociedad mercantil que no cotice en bolsa."
  - id: c
    text:
      es: "Un crédito frente a un cliente derivado de una venta anterior."
  - id: d
    text:
      es: "El derecho de uso de una patente industrial cedido en licencia a un empresario o profesional."
  explanation:
    es: "La ley da la condición de bienes corporales al gas, el calor, el frío, la energía eléctrica y las demás modalidades de energía. Un derecho de patente, unas acciones y un crédito son bienes incorporales."
  citation: "art. 8.Uno LIVA"
  difficulty: 1
  tags:
  - "entrega de bienes"
  - "bienes corporales"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0047
  prompt:
    es: "Reformas Alcarria, S.L. ejecuta para un cliente la construcción de una nave por 200.000 euros de base imponible. Para ello aporta una parte de los materiales, cuyo coste es de 90.000 euros. Conforme al artículo 8.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se califica la operación?"
  options:
  - id: a
    text:
      es: "Como prestación de servicios, porque el contratista ejecuta la obra con su trabajo para el cliente."
  - id: b
    correct: true
    text:
      es: "Como entrega de bienes, porque el coste de los materiales aportados, un 45 %, excede del 40 % de la base imponible."
  - id: c
    text:
      es: "Como prestación de servicios, porque el coste de los materiales es inferior al 50 % de la base imponible de la obra."
  - id: d
    text:
      es: "Como entrega de bienes solo si el coste de los materiales excede del 60 % de la base imponible."
  explanation:
    es: "La ejecución de obra de construcción es entrega de bienes si el empresario aporta materiales y su coste excede del 40 por 100 de la base imponible. Aquí 90.000 entre 200.000 es el 45 por 100, más del 40. No es servicio por el hecho de ejecutar la obra, el umbral no es el 50 ni el 60 por 100."
  citation: "art. 8.Dos.1.º LIVA"
  difficulty: 2
  tags:
  - "entrega de bienes"
  - "ejecución de obra"
  - "cómputo"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0051
  prompt:
    es: "Rodrigo Pastor formaliza con Transportes Moncayo, S.L. un contrato de arrendamiento de un camión con opción de compra, y el arrendatario se compromete a ejercitar la opción. Conforme al artículo 8.Dos.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué calificación tiene el contrato?"
  options:
  - id: a
    correct: true
    text:
      es: "Se asimila al arrendamiento-venta y es una entrega de bienes desde que el arrendatario se compromete a ejercitar la opción."
  - id: b
    text:
      es: "Es una entrega de bienes solo cuando la propiedad del camión se inscribe a nombre del arrendatario."
  - id: c
    text:
      es: "Es una entrega de bienes desde la firma del contrato, aunque el arrendatario no se comprometa a ejercitar la opción de compra."
  - id: d
    text:
      es: "Es una prestación de servicios hasta que el arrendatario ejercita efectivamente la opción de compra."
  explanation:
    es: "El arrendamiento con opción de compra se asimila al arrendamiento-venta desde que el arrendatario se compromete a ejercitar la opción, y entonces hay entrega de bienes. No basta la firma sin ese compromiso, no hace falta la inscripción y no se espera al ejercicio efectivo de la opción."
  citation: "art. 8.Dos.5.º LIVA"
  difficulty: 3
  tags:
  - "entrega de bienes"
  - "arrendamiento-venta"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0053
  prompt:
    es: "De acuerdo con el artículo 8.Dos.7.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran productos informáticos normalizados aquellos que:"
  options:
  - id: a
    text:
      es: "se distribuyan en soporte material con una licencia estándar de uso."
  - id: b
    text:
      es: "se suministren por vía electrónica sin entrega de ningún soporte material."
  - id: c
    correct: true
    text:
      es: "no precisen de modificación sustancial alguna para ser utilizados por cualquier usuario."
  - id: d
    text:
      es: "hayan sido confeccionados previo encargo según las especificaciones técnicas del destinatario final."
  explanation:
    es: "Un producto informático es normalizado si no necesita modificación sustancial para que cualquier usuario lo utilice. El soporte, la licencia y la vía de suministro no lo definen, y el confeccionado por encargo es lo contrario: su suministro es una prestación de servicios."
  citation: "art. 8.Dos.7.º LIVA"
  difficulty: 2
  tags:
  - "entrega de bienes"
  - "productos informáticos"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0054
  prompt:
    es: "Señale cuál de las siguientes transmisiones de valores se considera entrega de bienes, según el artículo 8.Dos.8.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "La de valores cuya posesión asegura, de hecho o de derecho, el uso o disfrute de un inmueble o de una parte del mismo."
  - id: b
    text:
      es: "La de participaciones en un fondo de inversión de carácter financiero."
  - id: c
    text:
      es: "La de acciones que representan una participación en el capital social de una sociedad mercantil que no sea inmobiliaria."
  - id: d
    text:
      es: "La de obligaciones admitidas a negociación en un mercado secundario oficial."
  explanation:
    es: "Solo es entrega de bienes la transmisión de valores que aseguran la propiedad, el uso o el disfrute de un inmueble. Las acciones ordinarias, las obligaciones negociadas y las participaciones en un fondo no atribuyen ese uso del inmueble."
  citation: "art. 8.Dos.8.º LIVA"
  difficulty: 3
  tags:
  - "entrega de bienes"
  - "valores"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0055
  prompt:
    es: "Según el artículo 9.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran operaciones asimiladas a las entregas de bienes a título oneroso, con las excepciones que fija el propio número, la transferencia por un sujeto pasivo de un bien corporal de su empresa con destino a:"
  options:
  - id: a
    text:
      es: "otro sujeto pasivo establecido en la Comunidad, con ocasión de una venta a distancia."
  - id: b
    correct: true
    text:
      es: "otro Estado miembro, para afectarlo a las necesidades de aquella en este último."
  - id: c
    text:
      es: "un territorio tercero, para afectarlo a su exportación posterior a un cliente."
  - id: d
    text:
      es: "otro establecimiento permanente situado dentro del territorio de aplicación del impuesto."
  explanation:
    es: "La transferencia de un bien de la empresa a otro Estado miembro, para afectarlo a las necesidades de esa misma empresa allí, se asimila a una entrega de bienes onerosa. El envío a un territorio tercero, a un establecimiento dentro de España o una venta a otro sujeto pasivo no son esa transferencia."
  citation: "art. 9.3.º LIVA"
  difficulty: 2
  tags:
  - "autoconsumo"
  - "transferencia a otro Estado miembro"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0056
  prompt:
    es: "Mariano Soler, dueño de una frutería, se lleva a su casa cajas de fruta de su comercio para el consumo de su familia, sin pagar nada. Había deducido el IVA soportado en la compra de esa fruta. Conforme al artículo 9.1.º.a) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué consideración tiene la operación?"
  options:
  - id: a
    text:
      es: "Es una entrega de bienes entre empresario y consumidor final, sujeta solo si cobra un precio."
  - id: b
    text:
      es: "Es un autoconsumo de servicios, asimilado a una prestación de servicios a título oneroso."
  - id: c
    text:
      es: "Es una operación no sujeta, porque no existe contraprestación alguna."
  - id: d
    correct: true
    text:
      es: "Es un autoconsumo de bienes, asimilado a una entrega de bienes a título oneroso."
  explanation:
    es: "Llevarse bienes del patrimonio empresarial al consumo particular, sin contraprestación, es un autoconsumo de bienes. Como dedujo el IVA soportado, la operación está sujeta. No es un autoconsumo de servicios, que recae sobre el uso de bienes, y la falta de contraprestación no la saca del impuesto ni exige que cobre un precio."
  citation: "art. 9.1.º.a) LIVA"
  difficulty: 2
  tags:
  - "autoconsumo"
  - "consumo particular"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0058
  prompt:
    es: "¿Cuál de las siguientes operaciones, realizada sin contraprestación, constituye un autoconsumo de bienes conforme al artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "El cambio de afectación de un vehículo del sector de comercio a otro sector diferenciado de la misma empresa."
  - id: b
    text:
      es: "El cambio de destino de un vehículo que pasa a formar parte de una actividad accesoria."
  - id: c
    text:
      es: "La venta de un vehículo de la empresa a un tercero por su valor contable."
  - id: d
    text:
      es: "El traslado de un vehículo entre dos establecimientos del mismo sector de actividad de la misma empresa y sin cambio de régimen."
  explanation:
    es: "El autoconsumo de la letra c) es el cambio de afectación de bienes de un sector diferenciado a otro. Mover un bien dentro del mismo sector no cambia de sector, la venta tiene contraprestación y la actividad accesoria sigue el régimen de la principal."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 3
  tags:
  - "autoconsumo"
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0059
  prompt:
    es: "De acuerdo con el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el autoconsumo por cambio de afectación no resulta aplicable cuando, por una modificación en la normativa vigente, una determinada actividad económica pase obligatoriamente a formar parte de:"
  options:
  - id: a
    text:
      es: "una actividad accesoria cuyo volumen de operaciones no exceda del 15 por 100 de la principal."
  - id: b
    text:
      es: "una actividad exenta que no origine el derecho a la deducción del impuesto."
  - id: c
    text:
      es: "un sector diferenciado en el que se apliquen los mismos porcentajes de deducción que antes."
  - id: d
    correct: true
    text:
      es: "un sector diferenciado distinto de aquel en el que venía estando integrada."
  explanation:
    es: "La excepción se da si una modificación normativa hace pasar obligatoriamente la actividad a un sector diferenciado distinto del que ocupaba. La actividad accesoria, la actividad exenta y los mismos porcentajes de deducción no son el supuesto de la ley."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 3
  tags:
  - "autoconsumo"
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0060
  prompt:
    es: "Señale la respuesta CORRECTA sobre el cambio de régimen de tributación de una actividad, según el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Hay autoconsumo cuando el régimen cambia del general al simplificado, salvo que lo imponga la Administración."
  - id: b
    correct: true
    text:
      es: "No hay autoconsumo cuando el régimen cambia del general al simplificado, incluso por el ejercicio de un derecho de opción."
  - id: c
    text:
      es: "No hay autoconsumo en el cambio al recargo de equivalencia, pero sí en el cambio al régimen de agricultura, ganadería y pesca."
  - id: d
    text:
      es: "Hay autoconsumo cuando el cambio de régimen deriva del ejercicio de un derecho de opción, y no si es obligatorio."
  explanation:
    es: "El cambio entre el régimen general y el simplificado, el de agricultura, ganadería y pesca, el recargo de equivalencia o el de oro de inversión, o a la inversa, no produce autoconsumo, aunque derive de una opción. La regla no distingue entre cambios impuestos y opcionales, y trata igual todos esos regímenes."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 3
  tags:
  - "autoconsumo"
  - "cambio de régimen"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0063
  prompt:
    es: "¿Qué requisito común deben cumplir las operaciones que el artículo 9.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido califica como autoconsumos de bienes?"
  options:
  - id: a
    correct: true
    text:
      es: "Que se realicen sin contraprestación."
  - id: b
    text:
      es: "Que se realicen a un precio inferior al de adquisición de los bienes."
  - id: c
    text:
      es: "Que se realicen con carácter habitual por empresarios o profesionales."
  - id: d
    text:
      es: "Que el sujeto pasivo hubiera deducido íntegramente el IVA soportado."
  explanation:
    es: "Los autoconsumos de bienes se definen por realizarse sin contraprestación. Un precio inferior al de adquisición sí es contraprestación, la habitualidad no se exige y la deducción íntegra no es requisito general, solo opera en la letra d) como excepción."
  citation: "art. 9.1.º LIVA"
  difficulty: 1
  tags:
  - "autoconsumo"
  - "sin contraprestación"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0146
  prompt:
    es: "¿Qué es una entrega de bienes a efectos del impuesto, según el artículo 8.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La cesión del uso o disfrute de bienes corporales a cambio de un precio."
  - id: b
    text:
      es: "La transmisión de la propiedad registral de bienes inmuebles o de bienes muebles inscribibles."
  - id: c
    correct: true
    text:
      es: "La transmisión del poder de disposición sobre bienes corporales, incluso mediante cesión de títulos representativos de ellos."
  - id: d
    text:
      es: "La transmisión de bienes corporales e incorporales a título oneroso."
  explanation:
    es: "La entrega de bienes es la transmisión del poder de disposición sobre bienes corporales, también mediante títulos representativos. No exige inscripción registral, la cesión de uso es un servicio y los bienes incorporales no son objeto de entrega."
  citation: "art. 8.Uno LIVA"
  difficulty: 1
  tags:
  - "entrega de bienes"
  - "concepto"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0147
  prompt:
    es: "Según el artículo 8.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo es entrega de bienes la ejecución de obra de construcción de una edificación en la que el empresario aporta parte de los materiales?"
  options:
  - id: a
    text:
      es: "Cuando el coste de los materiales aportados exceda del 40 por 100 del coste total de la obra para el cliente."
  - id: b
    correct: true
    text:
      es: "Cuando el coste de los materiales aportados exceda del 40 por 100 de la base imponible."
  - id: c
    text:
      es: "Cuando el empresario aporte cualquier parte de los materiales, aunque su coste no exceda del 40 por 100."
  - id: d
    text:
      es: "Cuando la obra consista en la rehabilitación de la edificación, pero no en su construcción."
  explanation:
    es: "La ejecución de obra de construcción o rehabilitación con aportación de materiales es entrega de bienes si su coste excede del 40 por 100 de la base imponible. Aportar cualquier parte no basta, el porcentaje se calcula sobre la base imponible y el precepto abarca tanto la construcción como la rehabilitación."
  citation: "art. 8.Dos.1.º LIVA"
  difficulty: 2
  tags:
  - "entrega de bienes"
  - "ejecución de obra"
