  prompt:
    es: "Según el artículo 118.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿quién emite el informe que justifica la necesidad de un contrato menor y que no se altera su objeto para evitar los umbrales?"
