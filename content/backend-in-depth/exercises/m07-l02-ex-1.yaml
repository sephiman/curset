type: quiz
variants:
- id: m07-l02-q02
  prompt:
    en: In HTTP/2, how does a peer limit the number of streams that are concurrently active on a connection?
  options:
  - id: a
    text:
      en: With the `WINDOW_UPDATE` frame, which caps the open streams
  - id: b
    correct: true
    text:
      en: With the `SETTINGS_MAX_CONCURRENT_STREAMS` parameter in a `SETTINGS` frame
  - id: c
    text:
      en: It cannot, because a connection carries one stream at a time
  - id: d
    text:
      en: With one connection-wide value that applies equally to both peers
  explanation:
    en: A peer sets `SETTINGS_MAX_CONCURRENT_STREAMS` in a `SETTINGS` frame. The `WINDOW_UPDATE` frame is wrong
      because it provides flow control. The claim of one stream at a time is wrong because a single connection can
      contain multiple concurrently open streams. A connection-wide value for both peers is wrong because the setting
      is specific to each endpoint and applies only to the peer that receives it.
  citation: rfc9113#section-5.1.2
  extract:
    en: A peer can limit the number of concurrently active streams using the SETTINGS_MAX_CONCURRENT_STREAMS parameter
      (see Section 6.5.2) within a SETTINGS frame.
- id: m07-l02-q03
  prompt:
    en: In HPACK as defined in RFC 7541, which statement about the dynamic table of header fields is correct?
  options:
  - id: a
    correct: true
    text:
      en: The newest entry is at the lowest index and the oldest entry is at the highest index
  - id: b
    text:
      en: Entries are kept in least-recently-used order, so a reused entry moves to the lowest index
  - id: c
    text:
      en: The table starts filled with the most common header fields of HTTP
  - id: d
    text:
      en: A decoder must report an error when the table holds two entries with the same name and value
  explanation:
    en: The first and newest entry has the lowest index, and the oldest entry the highest. Least-recently-used order
      is wrong because the table is maintained in first-in, first-out order. A table that starts filled is wrong
      because the dynamic table is initially empty. Reporting an error on duplicates is wrong because a decoder
      must not treat duplicate entries as an error.
  citation: rfc7541#section-2.3.2
  extract:
    en: The first and newest entry in a dynamic table is at the lowest index, and the oldest entry of a dynamic
      table is at the highest index.
- id: m07-l02-q04
  prompt:
    en: In QUIC as defined in RFC 9000, which statement about the creation of streams is correct?
  options:
  - id: a
    correct: true
    text:
      en: A single `STREAM` frame can open a stream, carry data for it, and close it
  - id: b
    text:
      en: Only the client can create streams, and the server can only answer on them
  - id: c
    text:
      en: A stream must be opened with a separate round trip before any data is sent
  - id: d
    text:
      en: Streams are always bidirectional, so a single endpoint cannot be the only sender
  explanation:
    en: A single `STREAM` frame can open, carry data for, and close a stream. Client-only creation is wrong because
      streams can be created by either endpoint. A separate opening round trip is wrong because streams can be created
      by sending data. Always-bidirectional streams are wrong because streams can be unidirectional or bidirectional.
  citation: rfc9000#section-2
  extract:
    en: For instance, a single STREAM frame (Section 19.8) can open, carry data for, and close a stream.
- id: m07-l02-q05
  prompt:
    en: What is the primary function of a connection ID in QUIC, according to RFC 9000?
  options:
  - id: a
    text:
      en: To limit how many streams the peer may initiate on the connection
  - id: b
    text:
      en: To order the bytes of different streams on the same connection
  - id: c
    text:
      en: To let an observer correlate all packets of the same connection
  - id: d
    correct: true
    text:
      en: To keep packets of a connection from reaching the wrong endpoint when addressing changes at lower layers
        such as UDP or IP
  explanation:
    en: A connection ID keeps packets from being delivered to the wrong endpoint when addressing changes in UDP
      or IP. Limiting streams is wrong because a QUIC endpoint controls the cumulative number of streams its peer
      can initiate. Ordering bytes across streams is wrong because QUIC provides no ordering between bytes on different
      streams. Letting an observer correlate packets is wrong because multiple connection IDs are used so that observers
      cannot identify packets as belonging to the same connection.
  citation: rfc9000#section-5.1
  extract:
    en: The primary function of a connection ID is to ensure that changes in addressing at lower protocol layers
      (UDP, IP) do not cause packets for a QUIC connection to be delivered to the wrong endpoint.
- id: m07-l02-q06
  prompt:
    en: In QUIC version 1 as specified in RFC 9000, which endpoints can initiate connection migration to a new network
      path?
  options:
  - id: a
    text:
      en: Only servers, because they hold the connection IDs
  - id: b
    text:
      en: Either endpoint, at any time, including during the handshake
  - id: c
    correct: true
    text:
      en: Only clients
  - id: d
    text:
      en: No endpoint, because a connection is bound to its first address
  explanation:
    en: Only clients are able to migrate in version 1. Servers alone is wrong because clients are responsible for
      initiating all migrations. Either endpoint at any time is wrong because an endpoint must not initiate migration
      before the handshake is confirmed. A connection bound to its first address is wrong because a connection ID
      lets connections survive changes of endpoint addresses.
  citation: rfc9000#section-1
  extract:
    en: Only clients are able to migrate in this version of QUIC.
- id: m07-l02-q08
  prompt:
    en: How does a WebSocket server build the value of the `Sec-WebSocket-Accept` header field from the `Sec-WebSocket-Key`
      of the client handshake?
  options:
  - id: a
    text:
      en: It hashes the value of the `Origin` header field with SHA-1
  - id: b
    text:
      en: It hashes the key and the GUID with SHA-256 instead of SHA-1
  - id: c
    text:
      en: It returns a random value chosen by the server in clear text
  - id: d
    correct: true
    text:
      en: It hashes the client's key together with a predefined GUID using SHA-1 and base64-encodes the result
  explanation:
    en: The server hashes the client's key with a predefined GUID using SHA-1 and base64-encodes the result. Hashing
      the `Origin` value is wrong because that field protects against unauthorized cross-origin use. SHA-256 is
      wrong because the concatenation is hashed with a 160-bit SHA-1. A random clear-text value is wrong because
      any value other than the hash must not be interpreted as acceptance.
  citation: rfc6455#section-1.3
  extract:
    en: If present, this header field must include a hash of the client's nonce sent in |Sec-WebSocket-Key| along
      with a predefined GUID.
- id: m07-l02-q09
  prompt:
    en: In Java 25, the snippet hashes the sample `Sec-WebSocket-Key` of the WebSocket specification followed by
      its GUID with SHA-1, prints the digest in hexadecimal, then compares its base64 form with the sample accept
      value. What does it print?
  options:
  - id: a
    text:
      en: 'd8e65fd9279e77dcb3229923fb3bc2f4a4bd323c

        false'
  - id: b
    text:
      en: '8472ed7f657593c6834197cd8f0dc86b5842c2dd

        false'
  - id: c
    correct: true
    text:
      en: 'b37a4f2cc0624f1690f64606cf385945b2bec4ea

        true'
  - id: d
    text:
      en: 'b37a4f2cc0624f1690f64606cf385945b2bec4ea

        false'
  explanation:
    en: The digest of the key followed by the GUID is `b37a4f2c...c4ea`, and its base64 form equals the sample accept
      value, so the second line is `true`. The output with the GUID before the key is wrong because the snippet
      appends the GUID to the key. The output of the key alone is wrong because the GUID is part of the hashed text.
      The output ending in `false` after the right digest is wrong because the base64 form of that digest matches
      the sample accept value.
  citation: rfc6455#section-1.3
  snippet: m07-l02/WebSocketAccept.java
- id: m07-l02-q11
  prompt:
    en: How can a server tell an `EventSource` client, which reconnects whenever its connection closes, to stop
      reconnecting?
  options:
  - id: a
    text:
      en: By answering with a `301` redirect to the same URL
  - id: b
    correct: true
    text:
      en: By answering with the HTTP `204 No Content` response code
  - id: c
    text:
      en: By closing the connection after the last event
  - id: d
    text:
      en: By sending a `Last-Event-ID` header with the final event ID
  explanation:
    en: The `204 No Content` response code tells the client to stop reconnecting. A `301` redirect is wrong because
      redirects are followed like in normal HTTP requests. Closing the connection is wrong because clients reconnect
      if the connection is closed. `Last-Event-ID` is wrong because it is a request header the client uses to report
      its last event ID when it reconnects.
  citation: whatwg-html-sse#server-sent-events-intro
  extract:
    en: Clients will reconnect if the connection is closed; a client can be told to stop reconnecting using the
      HTTP 204 No Content response code.
- id: m07-l02-q12
  prompt:
    en: Which character encoding does an event stream of Server-Sent Events use, according to the HTML Standard?
  options:
  - id: a
    text:
      en: The one named in the charset parameter of the `Content-Type` header
  - id: b
    correct: true
    text:
      en: UTF-8, always
  - id: c
    text:
      en: ISO-8859-1 unless the stream starts with a byte order mark
  - id: d
    text:
      en: US-ASCII with other characters escaped
  explanation:
    en: Event streams must always be encoded as UTF-8. A `charset` parameter is wrong because there is no way to
      specify another character encoding. ISO-8859-1 with a byte order mark and US-ASCII with escapes are both excluded,
      because the encoding must always be UTF-8.
  citation: whatwg-html-sse#parsing-an-event-stream
  extract:
    en: Event streams in this format must always be encoded as UTF-8.
- id: m07-l02-q13
  prompt:
    en: Which HTTP/2 frame type provides flow control for individual streams and for the connection as a whole?
  options:
  - id: a
    correct: true
    text:
      en: '`WINDOW_UPDATE`'
  - id: b
    text:
      en: '`CONTINUATION`'
  - id: c
    text:
      en: '`SETTINGS`'
  - id: d
    text:
      en: '`HEADERS`'
  explanation:
    en: '`WINDOW_UPDATE` provides the flow control. `CONTINUATION` is wrong because it carries subsequent field
      block fragments. `SETTINGS` is wrong because it carries parameters such as the concurrent stream limit. `HEADERS`
      is wrong because it transmits the first field block fragment.'
  citation: rfc9113#section-5.2
  extract:
    en: HTTP/2 provides for flow control through use of the WINDOW_UPDATE frame (Section 6.9).
