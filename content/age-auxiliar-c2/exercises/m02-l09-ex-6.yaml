# anchor: fuente-ms-excel-rellenar-datos-html
- id: m02-l09-q227
  prompt:
    es: "En Excel 365, ¿qué datos hay que escribir en las dos primeras celdas para rellenar con el controlador de relleno la serie 2, 4, 6, 8…?"
  options:
  - id: a
    text:
      es: "2 en la celda inicial y la siguiente vacía"
  - id: b
    text:
      es: "2 y 3 en las dos primeras celdas"
  - id: c
    correct: true
    text:
      es: "2 en la celda inicial y 4 en la siguiente"
  - id: d
    text:
      es: "4 en la celda inicial y 2 en la siguiente"
  explanation:
    es: "La página dice que para la serie 2, 4, 6, 8… se escriben 2 y 4, se seleccionan las dos celdas y se arrastra el controlador. «2 en la celda inicial y la siguiente vacía»: con una sola celda se repite el valor, como en la serie 2, 2, 2…. «2 y 3 en las dos primeras celdas»: daría la serie 2, 3, 4, 5…, con un paso de 1. «4 en la celda inicial y 2 en la siguiente»: esa pareja daría una serie decreciente."
  citation: "fuente: `ms-excel-rellenar-datos.html`; «Para la serie “2, 4, 6, 8…”, escriba 2 y 4.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q346
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados aplica el formato Moneda con dos decimales?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+$"
  - id: b
    text:
      es: "Ctrl+Mayús+!"
  - id: c
    text:
      es: "Ctrl+Mayús+~"
  - id: d
    text:
      es: "Ctrl+Mayús+%"
  explanation:
    es: "La página da Ctrl+Mayús+signo de dólar ($) para el formato Moneda con dos decimales. «Ctrl+Mayús+%»: aplica el formato Porcentaje sin decimales. «Ctrl+Mayús+!»: aplica el formato Número con dos decimales, separador de miles y signo menos. «Ctrl+Mayús+~»: aplica el formato de número General."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q347
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados aplica el formato Hora con las horas y los minutos e indica a.m. o p.m.?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+@"
  - id: b
    text:
      es: "Ctrl+Mayús+:"
  - id: c
    text:
      es: "Ctrl+Mayús+#"
  - id: d
    text:
      es: "Ctrl+Mayús+$"
  explanation:
    es: "La página da Ctrl+Mayús+arroba (@) para el formato Hora con horas y minutos y a.m. o p.m. «Ctrl+Mayús+:»: inserta la hora actual en la celda. «Ctrl+Mayús+#»: aplica el formato Fecha con día, mes y año. «Ctrl+Mayús+$»: aplica el formato Moneda con dos decimales."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q348
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados alterna entre mostrar los valores de las celdas o las fórmulas de la hoja?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+comillas rectas (\")"
  - id: b
    text:
      es: "F2"
  - id: c
    correct: true
    text:
      es: "Ctrl+acento grave (`)"
  - id: d
    text:
      es: "F9"
  explanation:
    es: "La página da Ctrl+acento grave (`) para cambiar entre valores de celda y fórmulas. «F9»: calcula todas las hojas de todos los libros abiertos. «F2»: edita la celda activa y coloca el punto de inserción al final de su contenido. «Ctrl+Mayús+comillas rectas (\")»: copia el valor de la celda situada sobre la activa en la celda o en la barra de fórmulas."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q349
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados rellena el rango de celdas seleccionado con la entrada actual?"
  options:
  - id: a
    text:
      es: "Mayús+Entrar"
  - id: b
    text:
      es: "Alt+Entrar"
  - id: c
    text:
      es: "Ctrl+D"
  - id: d
    correct: true
    text:
      es: "Ctrl+Entrar"
  explanation:
    es: "La página da Ctrl+Entrar para rellenar el rango seleccionado con la entrada actual. «Alt+Entrar»: comienza una nueva línea en la misma celda. «Mayús+Entrar»: completa la entrada y selecciona la celda de encima. «Ctrl+D»: copia hacia abajo el contenido y el formato de la celda superior del rango."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para realizar selecciones y acciones»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q350
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados selecciona una columna completa de la hoja de cálculo?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+Inicio"
  - id: b
    text:
      es: "F8"
  - id: c
    text:
      es: "Mayús+barra espaciadora"
  - id: d
    correct: true
    text:
      es: "Ctrl+barra espaciadora"
  explanation:
    es: "La página da Ctrl+barra espaciadora para seleccionar una columna completa y Mayús+barra espaciadora para una fila. «Mayús+barra espaciadora»: selecciona una fila completa. «Ctrl+Mayús+Inicio»: amplía la selección hasta el comienzo de la hoja. «F8»: activa el modo extendido, para ampliar una selección con las teclas de dirección."
  citation: "fuente: `ms-excel-atajos.html`; «Úselo para seleccionar una columna completa de una hoja de cálculo. — Ctrl+barra espaciadora»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q353
  prompt:
    es: "En Excel 365 configurado en español, en el cuadro Pegado especial, ¿cuál de las siguientes letras se pulsa para pegar solo los valores, sin las fórmulas?"
  options:
  - id: a
    text:
      es: "T"
  - id: b
    correct: true
    text:
      es: "V"
  - id: c
    text:
      es: "C"
  - id: d
    text:
      es: "F"
  explanation:
    es: "La página da V para pegar solo los valores, no las fórmulas. «F»: pega solo las fórmulas tal como se escribieron en la barra de fórmulas. «T»: pega solo el formato copiado. «C»: pega solo los comentarios y notas de la celda."
  citation: "fuente: `ms-excel-atajos.html`; «Pegue solo los valores (no las fórmulas). — V»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q075
  prompt:
    es: "En Excel 365, la celda C1 contiene =$A$1*B1. Si se copia en C4, ¿qué fórmula queda en C4?"
  options:
  - id: a
    correct: true
    text:
      es: "=$A$1*B4"
  - id: b
    text:
      es: "=$A$4*B4"
  - id: c
    text:
      es: "=$A$1*B1"
  - id: d
    text:
      es: "=A4*B4"
  explanation:
    es: "La referencia absoluta no se ajusta al copiar, así que $A$1 se mantiene, mientras que la relativa B1 pasa a B4. Ajustar $A$1 a $A$4 o dejar B1 sin cambio contradice esas reglas, y A4 supondría que $A$1 fuera relativa."
  citation: "fuente: `ms-excel-formulas.html`; «Referencias absolutas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q076
  prompt:
    es: "En Excel 365, la celda C3 contiene =$A1+B$2. Si se copia en E6, ¿qué fórmula queda en E6?"
  options:
  - id: a
    text:
      es: "=$A1+B$2"
  - id: b
    text:
      es: "=$A4+B$5"
  - id: c
    correct: true
    text:
      es: "=$A4+D$2"
  - id: d
    text:
      es: "=C4+D$2"
  explanation:
    es: "En $A1 la columna es absoluta y la fila relativa: al bajar tres filas queda $A4. En B$2 la fila es absoluta y la columna relativa: al avanzar dos columnas queda D$2. Las otras opciones fijan lo que debe cambiar o cambian lo que debe permanecer."
  citation: "fuente: `ms-excel-formulas.html`; «Referencias mixtas»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q077
  prompt:
    es: "En una fórmula de Excel 365, ¿cuál de las siguientes opciones clasifica correctamente la referencia A$1 respecto a la fila y la columna?"
  options:
  - id: a
    text:
      es: "Mixta, con la columna absoluta y la fila relativa"
  - id: b
    text:
      es: "Absoluta, porque lleva un signo de dólar"
  - id: c
    text:
      es: "Relativa, porque la columna no lleva signo de dólar"
  - id: d
    correct: true
    text:
      es: "Mixta, con la fila absoluta y la columna relativa"
  explanation:
    es: "Una referencia de fila absoluta toma la forma A$1: es mixta, con la fila absoluta y la columna relativa. La de columna absoluta es $A1, y la absoluta completa es $A$1."
  citation: "fuente: `ms-excel-formulas.html`; «Una referencia de fila absoluta toma la forma A$1, B$1, y así sucesivamente.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q078
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes tipos de referencias a celdas usan de forma predeterminada las fórmulas nuevas que se escriben?"
  options:
  - id: a
    text:
      es: "Absolutas"
  - id: b
    correct: true
    text:
      es: "Relativas"
  - id: c
    text:
      es: "Mixtas"
  - id: d
    text:
      es: "3D"
  explanation:
    es: "La página dice que, de forma predeterminada, las nuevas fórmulas usan referencias relativas. Las absolutas hay que fijarlas con $, y la referencia 3D abarca el mismo rango en varias hojas."
  citation: "fuente: `ms-excel-formulas.html`; «Referencias relativas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q079
  prompt:
    es: "En Excel 365, con una referencia de celda seleccionada en una fórmula, ¿cuál de las siguientes teclas recorre las combinaciones de referencias absolutas y relativas?"
  options:
  - id: a
    text:
      es: "F2"
  - id: b
    correct: true
    text:
      es: "F4"
  - id: c
    text:
      es: "F3"
  - id: d
    text:
      es: "F9"
  explanation:
    es: "Con una referencia seleccionada en una fórmula, F4 recorre las combinaciones de referencias absolutas y relativas. F2 activa o desactiva el modo Señalar al editar, F3 muestra el cuadro Pegar nombre y F9 calcula todas las hojas de todos los libros abiertos."
  citation: "fuente: `ms-excel-atajos.html`; «Teclas de función»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q080
  prompt:
    es: "En una fórmula de Excel 365 como =PROMEDIO(Marketing!B1:B10), el carácter que separa el nombre de la hoja del rango de celdas es:"
  options:
  - id: a
    text:
      es: "Los dos puntos (:) de rango"
  - id: b
    text:
      es: "El punto y coma (;) de unión"
  - id: c
    text:
      es: "El espacio de intersección"
  - id: d
    correct: true
    text:
      es: "El signo de exclamación (!)"
  explanation:
    es: "El signo de exclamación separa la referencia de hoja de la referencia del rango. Los dos puntos son el operador de rango, el punto y coma el de unión y el espacio el de intersección."
  citation: "fuente: `ms-excel-formulas.html`; «Hacer referencia a una celda o un rango de celdas de otra hoja de cálculo del mismo libro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q081
  prompt:
    es: "En Excel 365, la hoja Marketing tiene el valor 4 en B1 y el 8 en B2. ¿Qué muestra =PROMEDIO(Marketing!B1:B2) escrita en otra hoja del mismo libro?"
  options:
  - id: a
    text:
      es: "12"
  - id: b
    text:
      es: "8"
  - id: c
    correct: true
    text:
      es: "6"
  - id: d
    text:
      es: "4"
  explanation:
    es: "La referencia Marketing!B1:B2 toma el rango de la hoja Marketing del mismo libro y PROMEDIO calcula su valor promedio: (4 + 8) / 2 = 6. 12 sería la suma y 8 y 4 son valores sueltos."
  citation: "fuente: `ms-excel-formulas.html`; «Hacer referencia a una celda o un rango de celdas de otra hoja de cálculo del mismo libro»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q082
  prompt:
    es: "En Excel 365, ¿cómo se escribe una referencia a la celda A1 de una hoja llamada Ingresos enero, con un espacio en el nombre?"
  options:
  - id: a
    correct: true
    text:
      es: "='Ingresos enero'!A1"
  - id: b
    text:
      es: "=Ingresos enero!A1"
  - id: c
    text:
      es: "=\"Ingresos enero\"!A1"
  - id: d
    text:
      es: "='Ingresos enero!A1'"
  explanation:
    es: "Si el nombre de la hoja incluye espacios o números, se agregan apóstrofos antes y después del nombre, como en ='Ingresos enero'!A1. Sin apóstrofos, con comillas dobles o con el apóstrofo final después del signo de exclamación no sigue esa regla."
  citation: "fuente: `ms-excel-formulas.html`; «Hacer referencia a una celda o un rango de celdas de otra hoja de cálculo del mismo libro»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q083
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes nombres reciben las referencias a celdas que se encuentran en otros libros distintos del actual?"
  options:
  - id: a
    correct: true
    text:
      es: "Vínculos o referencias externas"
  - id: b
    text:
      es: "Referencias 3D, que abarcan varias hojas"
  - id: c
    text:
      es: "Referencias estructuradas de tabla"
  - id: d
    text:
      es: "Referencias mixtas de fila o columna"
  explanation:
    es: "Las referencias a celdas de otros libros se llaman vínculos o referencias externas. La referencia 3D abarca varias hojas, la estructurada usa nombres de tabla y columna, y la mixta fija solo la fila o la columna."
  citation: "fuente: `ms-excel-formulas.html`; «Usar referencias en fórmulas de Excel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q084
  prompt:
    es: "En Excel 365, la fórmula =Hoja2!B3*2 está en la Hoja1 de un libro y B3 de la Hoja2 de ese libro vale 10. ¿Qué muestra?"
  options:
  - id: a
    text:
      es: "10"
  - id: b
    text:
      es: "12"
  - id: c
    text:
      es: "5"
  - id: d
    correct: true
    text:
      es: "20"
  explanation:
    es: "Hoja2!B3 apunta a la celda B3 de otra hoja del mismo libro, cuyo valor es 10, y la fórmula lo multiplica por 2: 20. 10 omite la multiplicación, 12 sumaría y 5 dividiría."
  citation: "fuente: `ms-excel-formulas.html`; «Hacer referencia a una celda o un rango de celdas de otra hoja de cálculo del mismo libro»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q086
  prompt:
    es: "En Excel 365, =SUMA(DeptVentas[Importe de ventas]) usa una referencia estructurada. ¿Qué ocurre con ella al agregar filas a la tabla?"
  options:
  - id: a
    text:
      es: "Hay que editarla para incluir las filas nuevas"
  - id: b
    text:
      es: "Se convierte en referencias absolutas de estilo A1"
  - id: c
    correct: true
    text:
      es: "Se ajusta automáticamente, sin editar la fórmula"
  - id: d
    text:
      es: "Solo se ajusta tras recalcular con F9"
  explanation:
    es: "Los nombres de las referencias estructuradas se ajustan siempre que se agreguen o quiten datos de la tabla. Con referencias de celda explícitas sí habría que revisar la fórmula, y la conversión a referencias absolutas A1 ocurre al convertir la tabla en rango."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Cuando crea una tabla de Excel»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q087
  prompt:
    es: "En Excel 365, con una celda del rango de datos seleccionada, ¿cuál de los siguientes métodos abreviados crea una tabla?"
  options:
  - id: a
    text:
      es: "Ctrl+1"
  - id: b
    text:
      es: "Ctrl+Y"
  - id: c
    correct: true
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+Mayús+F"
  explanation:
    es: "Para crear la tabla se selecciona una celda del rango y se presiona Ctrl+T. Ctrl+1 abre Formato de celdas, Ctrl+Y repite el último comando y Ctrl+Mayús+F da formato a fuentes en Formato de celdas."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Cuando crea una tabla de Excel»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q088
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes nombres es válido para una tabla creada con Ctrl+T?"
  options:
  - id: a
    correct: true
    text:
      es: "Impuesto_Ventas"
  - id: b
    text:
      es: "Impuesto Ventas"
  - id: c
    text:
      es: "Z$100"
  - id: d
    text:
      es: "R1C1"
  explanation:
    es: "En el nombre de una tabla no se pueden usar espacios, y se puede usar el subrayado, como en Impuesto_Ventas. Z$100 y R1C1 son referencias de celda, y los nombres no pueden ser idénticos a una."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «¿Cómo puedo cambiar un nombre de tabla?»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q090
  prompt:
    es: "En una referencia estructurada de Excel 365, ¿cuál de los siguientes especificadores de elemento hace referencia solo a la fila de encabezado de la tabla?"
  options:
  - id: a
    text:
      es: "#Datos"
  - id: b
    text:
      es: "#Totales"
  - id: c
    text:
      es: "#Todas"
  - id: d
    correct: true
    text:
      es: "#Encabezados"
  explanation:
    es: "#Encabezados hace referencia solo a la fila de encabezado. #Datos solo a las filas de datos, #Totales solo a la fila del total y #Todas a toda la tabla."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «#Encabezados — Solo la fila de encabezado.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q091
  prompt:
    es: "En Excel 365, ¿qué ocurre con las referencias estructuradas de una fórmula cuando se copia esa fórmula a otra celda?"
  options:
  - id: a
    text:
      es: "Se ajustan como una serie de especificadores de columna"
  - id: b
    text:
      es: "Se convierten en referencias absolutas de estilo A1"
  - id: c
    text:
      es: "Se ajustan igual que las referencias relativas de celda"
  - id: d
    correct: true
    text:
      es: "Permanecen iguales"
  explanation:
    es: "Al copiar o mover una fórmula con referencias estructuradas, estas permanecen iguales. Solo al rellenar, y según la dirección y la tecla, los especificadores de columna se ajustan como una serie."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Estrategias para trabajar con referencias estructuradas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q092
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe qué ocurre con las fórmulas que usan una columna de una tabla si se cambia el nombre de esa columna?"
  options:
  - id: a
    correct: true
    text:
