# anchor: fuente-ms-excel-si-anidadas-html
- id: m02-l09-q254
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, ¿cuál de los siguientes argumentos de la función SI es opcional?"
  options:
  - id: a
    text:
      es: "núm_decimales"
  - id: b
    text:
      es: "valor_si_verdadero"
  - id: c
    correct: true
    text:
      es: "valor_si_falso"
  - id: d
    text:
      es: "prueba_lógica"
  explanation:
    es: "La sintaxis de la página es SI(prueba_lógica; valor_si_verdadero; [valor_si_falso]), con el tercer argumento opcional. «prueba_lógica»: es obligatorio: es el valor que se quiere probar. «valor_si_verdadero»: es obligatorio: es el valor que se devuelve si el resultado es VERDADERO. «núm_decimales»: SI no tiene ese argumento; es de TRUNCAR."
  citation: "fuente: `ms-excel-si-anidadas.html`; «Detalles técnicos»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-no-html
- id: m02-l09-q255
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, A2 contiene 50. ¿Qué muestra =SI(Y(NO(A2>1);NO(A2<100));A2;\"El valor está fuera del rango\")?"
  options:
  - id: a
    text:
      es: "El valor 50 está dentro del rango"
  - id: b
    correct: true
    text:
      es: "El valor está fuera del rango"
  - id: c
    text:
      es: "FALSO"
  - id: d
    text:
      es: "50"
  explanation:
    es: "Con 50, A2>1 y A2<100 son VERDADERO; NO los invierte a FALSO, Y devuelve FALSO y SI da el texto, según la página. «50»: Y exige que ambos argumentos sean verdaderos, y NO invierte los dos a FALSO. «El valor 50 está dentro del rango»: Y exige que ambos argumentos invertidos por NO sean verdaderos, y la función SI devuelve entonces el texto indicado. «FALSO»: SI devuelve A2 o el texto, no el valor lógico de Y."
  citation: "fuente: `ms-excel-funcion-no.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-no-html
- id: m02-l09-q256
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365, A3 contiene 100. ¿Qué muestra =SI(O(NO(A3<0);NO(A3>50));A3;\"El valor está fuera del rango\")?"
  options:
  - id: a
    text:
      es: "VERDADERO"
  - id: b
    text:
      es: "0"
  - id: c
    correct: true
    text:
      es: "100"
  - id: d
    text:
      es: "El valor está fuera del rango"
  explanation:
    es: "NO invierte A3<0 (FALSO) a VERDADERO; como O solo requiere un argumento VERDADERO, SI devuelve A3, que vale 100. «El valor está fuera del rango»: NO(A3<0) es VERDADERO, y O solo necesita un argumento verdadero. «VERDADERO»: SI devuelve A3, no el valor lógico de O. «0»: SI devuelve el valor de A3, y no cero."
  citation: "fuente: `ms-excel-funcion-no.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
