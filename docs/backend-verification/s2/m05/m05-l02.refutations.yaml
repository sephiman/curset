m05-l02-q07:
  key:
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: If you want to order certain auto-configurations that should not have any direct knowledge of each other, you can also use @AutoConfigureOrder.
