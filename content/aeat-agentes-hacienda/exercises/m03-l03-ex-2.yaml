# anchor: boe-a-2003-23186-art-16
- id: m03-l03-q0042
  prompt:
    es: "En los actos o negocios en los que exista simulación, el artículo 16.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria establece que el hecho imponible gravado será:"
  options:
  - id: a
    text:
      es: "el que las partes hayan declarado en el negocio aparente."
  - id: b
    text:
      es: "el que determine la Administración tributaria a su criterio."
  - id: c
    text:
      es: "el que resulte más favorable para el obligado tributario."
  - id: d
    correct: true
    text:
      es: "el efectivamente realizado por las partes."
  explanation:
    es: "Con simulación se grava el hecho imponible efectivamente realizado por las partes. Lo declarado en el negocio aparente es justo lo que se descarta. La Administración no elige el hecho a su criterio, ni se aplica el más favorable al obligado."
  citation: "art. 16.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-16
- id: m03-l03-q0043
  prompt:
    es: "Julián Esteve y Amparo Sanz firman una escritura de compraventa por un precio que nunca se paga: en realidad Julián dona el inmueble a Amparo. La Administración tributaria declara la simulación. Según el artículo 16.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué hecho imponible se grava?"
  options:
  - id: a
    correct: true
    text:
      es: "La donación, por ser el hecho imponible efectivamente realizado por las partes."
  - id: b
    text:
      es: "La compraventa, por ser el negocio que las partes formalizaron en la escritura."
  - id: c
    text:
      es: "La compraventa y la donación, cada una como hecho imponible independiente."
  - id: d
    text:
      es: "La donación, pero solo si un juez declara previamente la existencia de simulación."
  explanation:
    es: "En caso de simulación se grava el hecho imponible efectivamente realizado, que es la donación. La compraventa es el negocio aparente. Gravar ambos hechos no tiene apoyo en el artículo 16.1. Y la Administración declara la simulación en el acto de liquidación, sin intervención judicial previa."
  citation: "art. 16.1 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "definición"
# anchor: boe-a-2003-23186-art-16
- id: m03-l03-q0044
  prompt:
    es: "Según el artículo 16.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué acto declara la Administración tributaria la existencia de simulación y qué efectos produce esa calificación?"
  options:
  - id: a
    text:
      es: "En el correspondiente acto de liquidación, con efectos también en el ámbito civil y mercantil."
  - id: b
    text:
      es: "En una resolución judicial previa, con efectos exclusivamente tributarios."
  - id: c
    correct: true
    text:
      es: "En el correspondiente acto de liquidación, con efectos exclusivamente tributarios."
  - id: d
    text:
      es: "En el acuerdo de inicio de las actuaciones de comprobación, con efectos exclusivamente tributarios."
  explanation:
    es: "La simulación la declara la Administración tributaria en el acto de liquidación, y la calificación solo produce efectos tributarios. No alcanza al ámbito civil ni mercantil, no requiere una resolución judicial previa y no se declara en el acuerdo de inicio de las actuaciones."
  citation: "art. 16.2 LGT"
  difficulty: 2
  tags:
  - "órgano"
  - "efecto"
# anchor: boe-a-2003-23186-art-16
- id: m03-l03-q0045
  prompt:
    es: "Conforme al artículo 16.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la regularización que proceda como consecuencia de la existencia de simulación:"
  options:
  - id: a
    correct: true
    text:
      es: "Se exigen los intereses de demora y, en su caso, la sanción pertinente."
  - id: b
    text:
      es: "Se exigen los intereses de demora, pero no puede imponerse sanción alguna."
  - id: c
    text:
      es: "Solo se exige el tributo, sin intereses de demora ni sanción."
  - id: d
    text:
      es: "Se exigen los intereses de demora y la sanción pertinente en todo caso."
  explanation:
    es: "La regularización por simulación comporta intereses de demora y, en su caso, la sanción pertinente. No se excluye la sanción ni los intereses. Tampoco se impone la sanción en todo caso: solo cuando proceda."
  citation: "art. 16.3 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-7
- id: m03-l03-q0047
  prompt:
    es: "Según el artículo 7.1.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos se rigen por las normas que dicte la Unión Europea y otros organismos internacionales o supranacionales:"
  options:
  - id: a
    text:
      es: "con los que España haya suscrito un convenio para evitar la doble imposición."
  - id: b
    text:
      es: "cuyas normas hayan sido incorporadas mediante ley orgánica a nuestro ordenamiento."
  - id: c
    correct: true
    text:
      es: "a los que se atribuya el ejercicio de competencias en materia tributaria."
  - id: d
    text:
      es: "cuyas disposiciones hayan sido transpuestas por real decreto legislativo."
  explanation:
    es: "Se rigen por las normas de la Unión Europea y de otros organismos internacionales o supranacionales a los que se atribuya el ejercicio de competencias en materia tributaria. Los convenios para evitar la doble imposición son los tratados de la letra anterior. La incorporación por ley orgánica o por real decreto legislativo no es la condición que fija el precepto."
  citation: "art. 7.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0050
  prompt:
    es: "De acuerdo con el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las consecuencias del incumplimiento de las obligaciones tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Se regulan en todo caso por ley las consecuencias del incumplimiento respecto de la eficacia de los actos o negocios jurídicos."
  - id: b
    text:
      es: "Se regulan por reglamento las consecuencias del incumplimiento de las obligaciones tributarias respecto de la eficacia de los actos o negocios jurídicos."
  - id: c
    text:
      es: "Se regulan por ley las consecuencias del incumplimiento solo respecto de los negocios celebrados entre particulares."
  - id: d
    text:
      es: "Se regulan por ley las consecuencias del incumplimiento solo respecto de los actos administrativos de liquidación."
  explanation:
    es: "El artículo 8.i) reserva a la ley las consecuencias del incumplimiento de las obligaciones tributarias respecto de la eficacia de los actos o negocios jurídicos, sin distinguir entre unos y otros. El reglamento no puede regularlas, y limitarlas a los negocios entre particulares o a las liquidaciones recorta la reserva."
  citation: "art. 8 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-15
- id: m03-l03-q0052
  prompt:
    es: "Según el artículo 15.1.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, una de las circunstancias del conflicto en la aplicación de la norma tributaria es que de la utilización de los actos o negocios no resulten efectos jurídicos o económicos relevantes, distintos de:"
  options:
  - id: a
    text:
      es: "el ahorro fiscal y de los efectos de la regularización voluntaria que realice el obligado."
  - id: b
    correct: true
    text:
      es: "el ahorro fiscal y de los efectos que se hubieran obtenido con los actos o negocios usuales o propios."
  - id: c
    text:
      es: "el ahorro fiscal, sin que importen los efectos que se hubieran obtenido con los actos o negocios usuales de su sector."
  - id: d
    text:
      es: "los efectos de la devolución de ingresos indebidos que el obligado haya solicitado."
  explanation:
    es: "La segunda circunstancia del conflicto es que no resulten efectos jurídicos o económicos relevantes distintos del ahorro fiscal y de los efectos que se hubieran obtenido con los actos o negocios usuales o propios. La regularización voluntaria y la devolución de ingresos indebidos no son esos efectos, y prescindir de los efectos de los actos usuales altera la circunstancia."
  citation: "art. 15.1 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "requisito"
# anchor: boe-a-2003-23186-art-10
- id: m03-l03-q0054
  prompt:
    es: "Conforme al artículo 10.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el efecto retroactivo de las normas tributarias en general:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo que se disponga lo contrario, no tienen efecto retroactivo."
  - id: b
    text:
      es: "Salvo que se disponga lo contrario, tienen efecto retroactivo sobre los actos que no sean firmes."
  - id: c
    text:
      es: "Tienen efecto retroactivo siempre que su aplicación resulte más favorable para el contribuyente."
  - id: d
    text:
      es: "No tienen efecto retroactivo en ningún caso, ni siquiera si la propia norma lo dispone."
  explanation:
    es: "La regla general es la irretroactividad, salvo que se disponga lo contrario. La retroactividad sobre los actos no firmes y en favor del interesado es propia del régimen de infracciones, sanciones y recargos, no de las normas tributarias en general. Y la irretroactividad no es absoluta, porque la propia norma puede disponer otra cosa."
  citation: "art. 10.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0156
  prompt:
    es: "De acuerdo con el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el establecimiento, modificación, supresión y prórroga de las exenciones, reducciones, bonificaciones, deducciones y demás beneficios o incentivos fiscales se regulan:"
  options:
  - id: a
    text:
      es: "En todo caso por ley, salvo las bonificaciones, que se fijan por reglamento."
  - id: b
    text:
      es: "Por reglamento, previa habilitación expresa de una ley para cada beneficio."
  - id: c
    text:
      es: "Por orden del Ministro de Hacienda, en desarrollo de la ley de cada tributo."
  - id: d
    correct: true
    text:
      es: "En todo caso por ley, incluidas las bonificaciones y las deducciones."
  explanation:
    es: "Se regulan en todo caso por ley el establecimiento, modificación, supresión y prórroga de las exenciones, reducciones, bonificaciones, deducciones y demás beneficios o incentivos fiscales (art. 8.d). La reserva abarca todos los beneficios de la lista, así que no deja las bonificaciones al reglamento. Que un reglamento o una orden del Ministro de Hacienda los regule, aunque sea con habilitación o en desarrollo de la ley, contradice «en todo caso por ley». La orden ministerial sirve para el desarrollo que la ley o el reglamento prevean (art. 7.1), no para establecer beneficios."
  citation: "art. 8 LGT"
  difficulty: 1
  tags:
  - "reserva de ley"
  - "beneficios fiscales"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0168
  prompt:
    es: "De acuerdo con el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las presunciones en materia tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "El establecimiento de presunciones que no admitan prueba en contrario se regula en todo caso por ley."
  - id: b
    text:
      es: "El establecimiento de presunciones que admitan prueba en contrario se regula en todo caso por ley, y las que no la admitan, por reglamento."
  - id: c
    text:
      es: "Las presunciones que no admitan prueba en contrario pueden establecerse por orden del Ministro de Hacienda."
  - id: d
    text:
      es: "Las presunciones se regulan por ley cuando afectan a la base imponible, y por reglamento cuando afectan al hecho imponible."
  explanation:
    es: "El establecimiento de presunciones que no admitan prueba en contrario se regula en todo caso por ley (art. 8.a), junto con la delimitación del hecho imponible, del devengo, de la base imponible y liquidable y del tipo de gravamen. Invertir el reparto entre presunciones que admiten y que no admiten prueba contraria cambia lo que la ley reserva. Una orden ministerial solo desarrolla lo que la ley o el reglamento prevean (art. 7.1). Distribuir las presunciones entre ley y reglamento según el elemento afectado no figura en el precepto."
  citation: "art. 8 LGT"
  difficulty: 1
  tags:
  - "reserva de ley"
  - "presunciones"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0169
  prompt:
    es: "Según el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la condonación de deudas y sanciones tributarias y la concesión de moratorias y quitas se regulan:"
  options:
  - id: a
    text:
      es: "En todo caso por ley, salvo las moratorias, que pueden concederse por reglamento."
  - id: b
    text:
      es: "Por reglamento, previa autorización de la ley de cada tributo."
  - id: c
    text:
      es: "Por acuerdo del Consejo de Ministros, sin necesidad de una ley previa."
  - id: d
    correct: true
    text:
      es: "En todo caso por ley, incluidas las moratorias y las quitas."
  explanation:
    es: "La condonación de deudas y sanciones tributarias y la concesión de moratorias y quitas se regulan en todo caso por ley (art. 8.k), y el artículo 75 repite que las deudas solo pueden condonarse en virtud de ley. La reserva alcanza también a las moratorias y las quitas, no solo a la condonación. Un reglamento autorizado o un acuerdo del Consejo de Ministros no sustituyen a la ley."
  citation: "art. 8 LGT"
  difficulty: 2
  tags:
  - "reserva de ley"
  - "condonación"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0056
  prompt:
    es: "Según el artículo 2.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos son los ingresos públicos que consisten en prestaciones pecuniarias exigidas por una Administración pública como consecuencia de la realización del supuesto de hecho al que la ley vincula:"
  options:
  - id: a
    text:
      es: "el deber de contribuir, con el fin primordial de redistribuir la renta entre los ciudadanos de menor capacidad."
  - id: b
    correct: true
    text:
      es: "el deber de contribuir, con el fin primordial de obtener los ingresos necesarios para el sostenimiento de los gastos públicos."
  - id: c
    text:
      es: "la obligación de pago, con el fin primordial de financiar los servicios de la propia Administración tributaria."
  - id: d
    text:
      es: "el deber de contribuir, con el fin primordial de sancionar los incumplimientos de la normativa fiscal."
  explanation:
    es: "El artículo 2.1 define los tributos por su fin primordial: obtener los ingresos necesarios para el sostenimiento de los gastos públicos. Redistribuir la renta, financiar a la propia Administración tributaria o sancionar incumplimientos no son ese fin, y el precepto habla del deber de contribuir, no de una obligación de pago cualquiera."
  citation: "art. 2.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0057
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el concepto de tributo:"
  options:
  - id: a
    correct: true
    text:
      es: "Son prestaciones pecuniarias exigidas por una Administración pública como consecuencia de la realización del supuesto de hecho al que la ley vincula el deber de contribuir."
  - id: b
    text:
      es: "Son prestaciones pecuniarias exigidas exclusivamente por el Estado como consecuencia de la realización del supuesto de hecho al que la ley vincula el deber de contribuir."
  - id: c
    text:
      es: "Son prestaciones pecuniarias o en especie exigidas por una Administración pública como consecuencia de la realización del supuesto de hecho al que la ley vincula el deber de contribuir."
  - id: d
    text:
      es: "Son prestaciones pecuniarias exigidas por una Administración pública como consecuencia de un acuerdo con el obligado, al que la ley vincula el deber de contribuir."
  explanation:
    es: "Los tributos son prestaciones pecuniarias exigidas por una Administración pública cuando se realiza el supuesto de hecho al que la ley vincula el deber de contribuir. No se exigen solo por el Estado, no incluyen prestaciones en especie y no nacen de un acuerdo con el obligado, sino de la realización del supuesto de hecho legal."
  citation: "art. 2.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0058
  prompt:
    es: "Según el artículo 2.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos se clasifican en varias clases. Señale la figura que NO es una clase de tributo:"
  options:
  - id: a
    text:
      es: "Las tasas por utilización privativa del dominio público."
  - id: b
    correct: true
    text:
      es: "Los precios públicos por servicios de solicitud voluntaria."
  - id: c
    text:
      es: "Las contribuciones especiales por obras públicas."
  - id: d
    text:
      es: "Los impuestos exigidos sin contraprestación."
  explanation:
    es: "El artículo 2.2 clasifica los tributos en tasas, contribuciones especiales e impuestos. Los precios públicos no son tributos: son contraprestaciones por servicios de solicitud voluntaria que también presta el sector privado. Las tasas, las contribuciones especiales y los impuestos sí son clases de tributo."
  citation: "art. 2.2 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-1989-8508-art-24
- id: m03-l03-q0061
  prompt:
    es: "¿Cuál de las siguientes contraprestaciones pecuniarias tiene la consideración de precio público, según el artículo 24 de la Ley 8/1989, de 13 de abril, de Tasas y Precios Públicos?"
  options:
  - id: a
    text:
      es: "La que se satisface por servicios prestados en régimen de Derecho público que solo presta la Administración y son de recepción obligatoria."
  - id: b
    text:
      es: "La que se satisface por servicios prestados en régimen de Derecho público que también presta el sector privado, pero son de recepción obligatoria."
  - id: c
    text:
      es: "La que se satisface por servicios de solicitud voluntaria prestados en régimen de Derecho privado por una empresa pública."
  - id: d
    correct: true
    text:
      es: "La que se satisface por servicios prestados en régimen de Derecho público que también presta el sector privado y son de solicitud voluntaria."
  explanation:
    es: "Son precios públicos las contraprestaciones por servicios o actividades en régimen de Derecho público que también presta el sector privado y que son de solicitud voluntaria. El servicio obligatorio que solo presta la Administración da lugar a una tasa. Si es obligatorio, aunque lo preste también el sector privado, también hay tasa, porque falta la solicitud voluntaria. Y un servicio en régimen de Derecho privado queda fuera de la definición, que exige régimen de Derecho público."
  citation: "art. 24 Ley 8/1989"
  difficulty: 3
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0062
  prompt:
    es: "Según el artículo 2.2.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, contribuciones especiales son los tributos cuyo hecho imponible consiste en la obtención por el obligado tributario de un beneficio o de un aumento de valor de sus bienes como consecuencia de:"
  options:
  - id: a
    text:
      es: "la utilización privativa o el aprovechamiento especial del dominio público."
  - id: b
    correct: true
    text:
      es: "la realización de obras públicas o del establecimiento o ampliación de servicios públicos."
  - id: c
    text:
      es: "la realización de negocios, actos o hechos que ponen de manifiesto su capacidad económica."
  - id: d
    text:
      es: "la prestación de servicios en régimen de derecho público de solicitud voluntaria."
  explanation:
    es: "En las contribuciones especiales el beneficio o aumento de valor de los bienes del obligado procede de la realización de obras públicas o del establecimiento o ampliación de servicios públicos. La utilización del dominio público caracteriza a las tasas, y los negocios, actos o hechos que revelan capacidad económica, a los impuestos. Los servicios de solicitud voluntaria prestados también por el sector privado son precios públicos."
  citation: "art. 2.2.b LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0063
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a los impuestos, según el artículo 2.2.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Tributos exigidos sin contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente."
  - id: b
    text:
      es: "Tributos exigidos como contraprestación de un servicio cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica."
  - id: c
    text:
      es: "Tributos exigidos sin contraprestación cuyo hecho imponible consiste en la obtención de un beneficio o aumento de valor de los bienes del obligado."
  - id: d
    text:
      es: "Tributos exigidos sin contraprestación cuyo hecho imponible consiste en la utilización privativa o el aprovechamiento especial del dominio público."
  explanation:
    es: "Los impuestos se exigen sin contraprestación y su hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente. Exigirlos como contraprestación de un servicio los acercaría a las tasas. El beneficio o aumento de valor de los bienes por obras o servicios públicos define las contribuciones especiales, y la utilización del dominio público, las tasas."
  citation: "art. 2.2.c LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-2
- id: m03-l03-q0064
  prompt:
    es: "El ayuntamiento de una localidad autoriza a Daniel Solís a ocupar durante un año una parte de la vía pública con una terraza de su local y le exige por ello una cantidad. Según el artículo 2.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué clase de tributo es esa exacción?"
  options:
  - id: a
    text:
      es: "Una contribución especial, porque Daniel obtiene un beneficio de un servicio público."
  - id: b
    text:
      es: "Un impuesto, porque la ocupación pone de manifiesto la capacidad económica del contribuyente."
  - id: c
    correct: true
    text:
      es: "Una tasa, porque su hecho imponible es la utilización privativa del dominio público."
  - id: d
