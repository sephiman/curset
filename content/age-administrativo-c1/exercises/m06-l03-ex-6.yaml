  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q208
  prompt:
    es: "En Windows 11, ¿cómo se configura el Explorador de archivos para que se abra en Este equipo en lugar de en Inicio?"
  options:
  - id: a
    text:
      es: "Con Ver › Mostrar › Este equipo, en la barra de comandos"
  - id: b
    text:
      es: "Con clic derecho en una carpeta y Anclar a acceso rápido"
  - id: c
    correct: true
    text:
      es: "Con Ver más › Opciones y eligiendo Este equipo"
  - id: d
    text:
      es: "Con Ver › Mostrar › Panel de navegación"
  explanation:
    es: "La página dice que, para tener abierto el Explorador en Este equipo, se selecciona Ver más › Opciones, se elige abrir el Explorador en Este equipo y se aplica. Ver › Mostrar da acceso a las extensiones, los elementos ocultos y el panel de navegación, y Anclar a acceso rápido solo ancla una carpeta."
  citation: "fuente: `ms-win-explorador.html`; «Configure el Explorador de archivos para abrirlo en Este equipo»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q210
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes rutas lleva al comando Asignar unidad de red?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Conceder acceso a › Personas específicas"
  - id: b
    correct: true
    text:
      es: "Este equipo › Más › Asignar unidad de red"
  - id: c
    text:
      es: "Ver más › Opciones › Este equipo"
  - id: d
    text:
      es: "Mostrar más opciones › Enviar a › Escritorio (crear acceso directo)"
  explanation:
    es: "La página dice que se selecciona Este equipo en el panel izquierdo y, en la cinta del Explorador, Más y Asignar unidad de red. Conceder acceso a › Personas específicas sirve para compartir un archivo, Ver más › Opciones para elegir dónde se abre el Explorador y Enviar a › Escritorio para crear un acceso directo."
  citation: "fuente: `ms-win-compartir-red.html`; «Cómo asigno una unidad de red»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q211
  prompt:
    es: "En Windows 11, para que una unidad de red se conecte cada vez que se inicie sesión en el PC, al asignarla hay que seleccionar la opción:"
  options:
  - id: a
    correct: true
    text:
      es: "Volver a conectar al iniciar sesión"
  - id: b
    text:
      es: "Examinar, para buscar la carpeta o el equipo"
  - id: c
    text:
      es: "Finalizar, para terminar el asistente"
  - id: d
    text:
      es: "Unidad, para elegir la letra de unidad"
  explanation:
    es: "La página dice que, para conectarse cada vez que se inicia sesión en el PC, se selecciona Volver a conectar al iniciar sesión. Examinar es el botón para buscar la carpeta o el equipo, Finalizar cierra el asistente y Unidad es la lista de letras de unidad."
  citation: "fuente: `ms-win-compartir-red.html`; «Cómo asigno una unidad de red»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q212
  prompt:
    es: "En Windows 11, al asignar una unidad de red, ¿qué letra de unidad se puede elegir en la lista Unidad?"
  options:
  - id: a
    text:
      es: "Solo la letra Z, reservada para las unidades de red"
  - id: b
    text:
      es: "Solo una letra posterior a la unidad C del equipo"
  - id: c
    text:
      es: "Solo la letra que Windows propone de forma automática"
  - id: d
    correct: true
    text:
      es: "Cualquier letra de unidad que esté disponible"
  explanation:
    es: "La página dice que, en la lista Unidad, se selecciona una letra de unidad y que sirve cualquier letra disponible. Limitarla a la Z, a una posterior a la unidad C o a la que propone Windows contradice esa frase."
  citation: "fuente: `ms-win-compartir-red.html`; «Cómo asigno una unidad de red»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q213
  prompt:
    es: "En Windows 11, al asignar una unidad de red, ¿qué se hace en el cuadro Carpeta, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Elegir la letra de unidad, entre las letras disponibles"
  - id: b
    text:
      es: "Seleccionar la casilla para conectar cada vez que se inicia sesión en el PC"
  - id: c
    text:
      es: "Seleccionar el comando Más en la cinta del Explorador"
  - id: d
    correct: true
    text:
      es: "Escribir la ruta de la carpeta o del equipo, o buscarlos con Examinar"
  explanation:
    es: "La página dice que, en el cuadro Carpeta, se escribe la ruta de acceso de la carpeta o del equipo, o se hace clic en Examinar para buscar la carpeta o el equipo. La letra se elige en la lista Unidad, la reconexión es la casilla Volver a conectar al iniciar sesión y Más es el comando de la cinta que lleva a Asignar unidad de red."
  citation: "fuente: `ms-win-compartir-red.html`; «Cómo asigno una unidad de red»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q215
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas de Windows 11 abre la página Acerca de de Configuración › Sistema?"
  options:
  - id: a
    text:
      es: "Windows+U"
  - id: b
    correct: true
    text:
      es: "Windows+Pausa"
  - id: c
    text:
      es: "Windows+I"
  - id: d
    text:
      es: "Windows+Ctrl+Q"
