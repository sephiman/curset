    title:
      en: Lamport and vector clocks
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: kafka-consumer-lag
    title:
      en: Kafka offsets and consumer lag
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: isolation-anomaly
    title:
      en: Isolation levels and anomalies
    weight: 1
