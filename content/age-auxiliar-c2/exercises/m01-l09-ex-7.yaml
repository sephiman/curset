# anchor: boe-a-1985-5392-art-41
- id: m01-l09-q106
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Cabildos Insulares Canarios se rigen, supletoriamente, por las normas que regulan:"
  options:
  - id: a
    text:
      es: "La organización y funcionamiento de los municipios de gran población."
  - id: b
    text:
      es: "La organización y funcionamiento de las mancomunidades provinciales interinsulares."
  - id: c
    correct: true
    text:
      es: "La organización y funcionamiento de las Diputaciones provinciales."
  - id: d
    text:
      es: "La organización y funcionamiento de los Consejos Insulares de las Islas Baleares."
  explanation:
    es: "El artículo 41.1 LBRL dice que los Cabildos Insulares Canarios se rigen por la disposición adicional decimocuarta «y supletoriamente por las normas que regulan la organización y funcionamiento de las Diputaciones provinciales», cuyas competencias asumen. El régimen de gran población es municipal. Las mancomunidades provinciales interinsulares son solo órganos de representación (art. 41.2). Los Consejos Insulares de Baleares tienen su propia regla en el artículo 41.3."
  citation: "art. 41.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-41
- id: m01-l09-q155
  prompt:
    es: "De acuerdo con el artículo 41.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, a los Consejos Insulares de las Islas Baleares les son de aplicación las normas de organización y funcionamiento de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las Diputaciones provinciales."
  - id: b
    text:
      es: "Los municipios de gran población."
  - id: c
    text:
      es: "Los Cabildos Insulares Canarios."
  - id: d
    text:
      es: "Las mancomunidades provinciales interinsulares."
  explanation:
    es: "Los Consejos Insulares de Baleares se rigen por las normas de organización y funcionamiento de las Diputaciones provinciales. Los municipios de gran población son una categoría municipal. Los Cabildos Insulares Canarios tienen su propio régimen y las mancomunidades provinciales interinsulares son órganos de representación del archipiélago canario."
  citation: "art. 41.3 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-137
- id: m01-l09-q051
  prompt:
    es: "De acuerdo con el artículo 157.2 de la Constitución Española de 1978, las Comunidades Autónomas no podrán en ningún caso adoptar medidas tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios."
  - id: b
    text:
      es: "Sobre bienes situados en su territorio que pertenezcan a personas residentes en otra Comunidad."
  - id: c
    text:
      es: "Sobre bienes situados fuera de su territorio, salvo autorización de las Cortes Generales."
  - id: d
    text:
      es: "Que consistan en recargos sobre impuestos estatales."
  explanation:
    es: "El artículo 157.2 prohíbe medidas tributarias «sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios». Los bienes situados en su territorio sí pueden gravarse, sea quien sea su titular. La prohibición es «en ningún caso», sin autorización posible. Los recargos sobre impuestos estatales son un recurso de las Comunidades (art. 157.1.a)."
  citation: "art. 157.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1978-31229-art-158
- id: m01-l09-q052
  prompt:
    es: "¿Con qué fin se constituye, según la Constitución Española de 1978, un Fondo de Compensación con destino a gastos de inversión?"
  options:
  - id: a
    text:
      es: "Para garantizar un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio."
  - id: b
    correct: true
    text:
      es: "Para corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad."
  - id: c
    text:
      es: "Para financiar los servicios y actividades estatales que hayan asumido las Comunidades Autónomas."
  - id: d
    text:
      es: "Para compensar a las Comunidades Autónomas por los impuestos cedidos total o parcialmente por el Estado."
  explanation:
    es: "El artículo 158.2 constituye el Fondo «con el fin de corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad». La garantía de un nivel mínimo en los servicios públicos fundamentales y el volumen de los servicios estatales asumidos son los criterios de la asignación del artículo 158.1, no el fin del Fondo. Los impuestos cedidos son un recurso del artículo 157.1.a), no algo que el Fondo compense."
  citation: "art. 158.2 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-158
- id: m01-l09-q053
  prompt:
    es: "Según el artículo 158.1 de la Constitución Española de 1978, ¿en función de qué podrá establecerse en los Presupuestos Generales del Estado una asignación a las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "De la población y la superficie de cada Comunidad Autónoma y de las circunstancias del hecho insular."
  - id: b
    text:
      es: "De la corrección de desequilibrios económicos interterritoriales, con destino exclusivo a gastos de inversión."
  - id: c
    text:
      es: "Del esfuerzo fiscal de cada Comunidad Autónoma en la recaudación de sus propios impuestos."
  - id: d
    correct: true
    text:
      es: "Del volumen de los servicios y actividades estatales asumidos y de la garantía de un nivel mínimo en los servicios públicos fundamentales."
  explanation:
    es: "El artículo 158.1 prevé una asignación «en función del volumen de los servicios y actividades estatales que hayan asumido y de la garantía de un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio español». La población, la superficie y el esfuerzo fiscal no son criterios del artículo. La corrección de desequilibrios con destino a inversión es el fin del Fondo de Compensación del 158.2."
  citation: "art. 158.1 CE"
  difficulty: 3
  tags:
  - "concepto"
