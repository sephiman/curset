  - id: b
    text:
      es: "FILA"
  - id: c
    text:
      es: "BUSCARH"
  - id: d
    text:
      es: "FILAS"
  explanation:
    es: "La página dice que COLUMNA devuelve el número de columna de una referencia. «FILA»: FILA devuelve el número de fila de una referencia. «FILAS»: FILAS devuelve el número de filas de una referencia. «BUSCARH»: BUSCARH busca en la fila superior de una matriz."
