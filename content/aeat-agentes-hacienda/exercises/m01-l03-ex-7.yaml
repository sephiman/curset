type: quiz
variants:
# anchor: boe-a-2015-10566-art-63
- id: m01-l03-q0171
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios nombran y cesan a los Subdirectores dependientes de la Subsecretaría, al personal de libre designación y al personal:"
  options:
  - id: a
    text:
      es: "Laboral del Departamento."
  - id: b
    text:
      es: "Interino de los Organismos públicos."
  - id: c
    correct: true
    text:
      es: "Eventual del Departamento."
  - id: d
    text:
      es: "Directivo de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 63.1.l añade al personal eventual del Departamento. El personal laboral no se nombra y cesa así, y los interinos de los Organismos públicos y los directivos de las Delegaciones no dependen del Subsecretario."
  citation: "art. 63.1.l LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-66
- id: m01-l03-q0176
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Directores generales son nombrados y separados por Real Decreto del Consejo de Ministros a propuesta:"
  options:
  - id: a
    text:
      es: "Únicamente del titular del Departamento."
  - id: b
    text:
      es: "Del Subsecretario del Departamento."
  - id: c
    correct: true
    text:
      es: "Del titular del Departamento o del Presidente del Gobierno."
  - id: d
    text:
      es: "Del titular del Departamento o del Secretario de Estado."
  explanation:
    es: "El artículo 66.2 admite la propuesta del titular del Departamento o la del Presidente del Gobierno. No basta la del titular en exclusiva, ni interviene el Subsecretario, ni el Secretario de Estado."
  citation: "art. 66.2 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10566-art-67
- id: m01-l03-q0178
  prompt:
    es: "Según el artículo 67.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subdirectores generales responden de forma inmediata de la ejecución de los proyectos asignados y de:"
  options:
  - id: a
    text:
      es: "La dirección de la Dirección General de la que dependan."
  - id: b
    correct: true
    text:
      es: "La gestión ordinaria de la Subdirección General."
  - id: c
    text:
      es: "La gestión de los servicios comunes del Ministerio."
  - id: d
    text:
      es: "La fijación de los objetivos del Departamento."
  explanation:
    es: "El artículo 67.1 añade la gestión ordinaria de la Subdirección General. La dirección de la Dirección General es del Director general, los servicios comunes son de la Subsecretaría y los objetivos del Departamento los fija el Ministro."
  citation: "art. 67.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-65
- id: m01-l03-q0179
  prompt:
    es: "Señale la respuesta correcta sobre los Secretarios generales técnicos, de acuerdo con el artículo 65 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Dependen del Subsecretario y tienen la categoría de Director general."
  - id: b
    text:
      es: "Dependen del Ministro y tienen la categoría de Subsecretario."
  - id: c
    text:
      es: "Dependen del Subsecretario y tienen la categoría de Subdirector general."
  - id: d
    text:
      es: "Dependen del Secretario de Estado y tienen la categoría de Director general."
  explanation:
    es: "Los Secretarios generales técnicos dependen del Subsecretario y tienen a todos los efectos la categoría de Director general, según los apartados 1 y 2 del artículo 65. Cada alternativa cambia uno de los dos elementos, o los dos, por otro órgano o por otra categoría."
  citation: "art. 65 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2015-10566-art-64
- id: m01-l03-q0180
  prompt:
    es: "Señale la respuesta correcta sobre los Secretarios generales de un Ministerio, conforme al artículo 64 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Tienen categoría de Director general y deben ser funcionarios del Subgrupo A1."
  - id: b
    text:
      es: "Tienen categoría de Subsecretario y deben ser funcionarios del Subgrupo A1."
  - id: c
    text:
      es: "Tienen categoría de Director general y no se exige que sean funcionarios."
  - id: d
    correct: true
    text:
      es: "Tienen categoría de Subsecretario y no se exige que sean funcionarios."
  explanation:
    es: "Según el artículo 64.3, los Secretarios generales tienen categoría de Subsecretario y se nombran entre personas con cualificación y experiencia en la gestión pública o privada, sin exigir la condición de funcionario. Las otras alternativas combinan mal la categoría o el requisito."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2015-10566-art-69
- id: m01-l03-q0183
  prompt:
    es: "Según el artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿de quién depende inmediatamente el Subdelegado del Gobierno en cada provincia de las Comunidades Autónomas pluriprovinciales?"
  options:
  - id: a
    text:
      es: "Del Ministro del Interior."
  - id: b
    correct: true
    text:
      es: "Del Delegado del Gobierno."
  - id: c
    text:
      es: "Del Presidente de la Comunidad Autónoma."
  - id: d
    text:
      es: "Del Secretario General de la Delegación."
  explanation:
    es: "El artículo 69.4 pone al Subdelegado bajo la inmediata dependencia del Delegado del Gobierno. No depende del Ministro del Interior, ni del Presidente autonómico, ni del Secretario General, que gestiona los servicios comunes de la Delegación."
  citation: "art. 69.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-69
- id: m01-l03-q0184
  prompt:
    es: "Conforme al artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en las Comunidades Autónomas uniprovinciales pueden crearse Subdelegaciones del Gobierno, cuando la población o el volumen de gestión lo justifiquen, mediante:"
  options:
  - id: a
    text:
      es: "Ley orgánica."
  - id: b
    text:
      es: "Orden del Ministro del Interior."
  - id: c
    text:
      es: "Acuerdo del Consejo de Gobierno de la Comunidad."
  - id: d
    correct: true
    text:
      es: "Real Decreto."
  explanation:
    es: "El artículo 69.4 prevé que se creen por Real Decreto. No se exige una ley orgánica, ni basta una orden del Ministro del Interior, ni es competente el Consejo de Gobierno de la Comunidad, que no forma parte de la Administración General del Estado."
  citation: "art. 69.4 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-71
- id: m01-l03-q0186
  prompt:
    es: "Conforme al artículo 71.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los servicios territoriales de la Administración General del Estado en la Comunidad Autónoma se organizan en servicios:"
  options:
  - id: a
    correct: true
    text:
      es: "Integrados y no integrados en las Delegaciones del Gobierno."
  - id: b
    text:
      es: "Centrales y periféricos de cada Ministerio."
  - id: c
    text:
      es: "Provinciales e insulares de cada Subdelegación."
  - id: d
    text:
      es: "Ordinarios y extraordinarios de la Delegación."
  explanation:
    es: "El artículo 71.1 distingue servicios integrados y no integrados en las Delegaciones del Gobierno. Las otras clasificaciones no figuran en el artículo."
  citation: "art. 71.1 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-71
- id: m01-l03-q0187
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los servicios territoriales integrados dependen del Delegado del Gobierno o, en su caso, del Subdelegado, a través de:"
  options:
  - id: a
    text:
      es: "La Subsecretaría del Ministerio competente."
  - id: b
    text:
      es: "La Comisión territorial de asistencia al Delegado."
  - id: c
    text:
      es: "El Director Insular."
  - id: d
    correct: true
    text:
      es: "La Secretaría General."
  explanation:
    es: "El artículo 71.4 los hace depender del Delegado o del Subdelegado a través de la Secretaría General. La Subsecretaría y la Comisión territorial no intervienen en esa dependencia, y el Director Insular es otro órgano territorial."
  citation: "art. 71.4 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
  - "órgano"
# anchor: boe-a-2015-10566-art-71
- id: m01-l03-q0188
  prompt:
    es: "Señale la respuesta correcta sobre los servicios territoriales de la Administración General del Estado, de acuerdo con el artículo 71 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Los integrados dependen del órgano central competente en su sector, y los no integrados, del Delegado del Gobierno."
  - id: b
    text:
      es: "Los integrados y los no integrados dependen del Delegado del Gobierno."
  - id: c
    correct: true
    text:
      es: "Los integrados dependen del Delegado o del Subdelegado, y los no integrados, del órgano central competente en su sector."
  - id: d
    text:
      es: "Los integrados y los no integrados dependen de la Subsecretaría del Ministerio."
  explanation:
    es: "Los integrados dependen del Delegado o del Subdelegado a través de la Secretaría General, según el artículo 71.4, y los no integrados dependen del órgano central competente sobre su sector de actividad, según el artículo 71.3. Las otras opciones invierten el reparto o lo unifican."
  citation: "art. 71 LRJSP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-73
- id: m01-l03-q0193
  prompt:
    es: "Según el artículo 73 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Delegados del Gobierno nombran a los Subdelegados del Gobierno en las provincias y, en su caso, a:"
  options:
  - id: a
    text:
      es: "Los Secretarios Generales de las Subdelegaciones."
  - id: b
    correct: true
    text:
      es: "Los Directores Insulares."
  - id: c
    text:
      es: "Los jefes de los servicios territoriales no integrados."
  - id: d
    text:
      es: "Los Presidentes de las Comisiones territoriales."
  explanation:
    es: "El artículo 73.1.a.2.º les atribuye nombrar a los Subdelegados y, en su caso, a los Directores Insulares. Los Secretarios Generales, los jefes de servicios no integrados y los presidentes de las Comisiones no entran en esa competencia."
  citation: "art. 73.1.a LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-74
- id: m01-l03-q0199
  prompt:
    es: "Según el artículo 74 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en las Comunidades Autónomas uniprovinciales en las que no exista Subdelegado, las competencias de los Subdelegados las asume:"
  options:
  - id: a
    text:
      es: "El Secretario General de la Delegación."
  - id: b
    text:
      es: "El Presidente de la Comunidad Autónoma."
  - id: c
    text:
      es: "El Director Insular de mayor nivel."
  - id: d
    correct: true
    text:
      es: "El Delegado del Gobierno."
  explanation:
    es: "El artículo 74 dice que el Delegado del Gobierno asume esas competencias. El Secretario General, el Presidente autonómico y el Director Insular no las asumen."
  citation: "art. 74 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-74
- id: m01-l03-q0200
  prompt:
    es: "Señale la respuesta correcta sobre los Subdelegados del Gobierno en las provincias, conforme al artículo 74 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen nivel de Subdirector general y los nombra el Delegado del Gobierno por libre designación."
  - id: b
    text:
      es: "Tienen rango de Subsecretario y los nombra el Consejo de Ministros."
  - id: c
    text:
      es: "Tienen nivel de Subdirector general y los nombra el Ministro del Interior."
  - id: d
    text:
      es: "Tienen nivel de Director general y los nombra el Delegado por concurso."
  explanation:
    es: "El artículo 74 les da nivel de Subdirector general y atribuye su nombramiento al Delegado del Gobierno por libre designación. El rango de Subsecretario es el de los Delegados. El Ministro del Interior no los nombra, y tampoco tienen nivel de Director general ni se eligen por concurso."
  citation: "art. 74 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
