# anchor: boe-a-1985-7820-art-5
- id: m04-l06-q027
  prompt:
    es: "Según el artículo 5 del Real Decreto 598/1985, de 30 de abril, sobre incompatibilidades del personal al servicio de la Administración del Estado, de la Seguridad Social y de los Entes, Organismos y Empresas dependientes, la prórroga:"
  options:
  - id: a
    text:
      es: "Requiere resolución motivada y no puede superar tres meses."
  - id: b
    text:
      es: "Se produce automáticamente por un mes."
  - id: c
    correct: true
    text:
      es: "Requiere resolución motivada y no puede superar un mes."
  - id: d
    text:
      es: "Requiere informe de la Subsecretaría y no puede superar un mes."
  explanation:
    es: "El artículo 5 dice que el plazo «podrá prorrogarse, mediante resolución motivada, por un periodo de tiempo no superior a un mes». Tres meses es la duración del plazo inicial, no de la prórroga. La prórroga no es automática: exige una resolución motivada. El artículo no pide informe de la Subsecretaría para prorrogar."
  citation: "art. 5 RD 598/1985"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q028
  prompt:
    es: "¿En qué asuntos ya tramitados por razón de su puesto tiene vedado el personal de las Administraciones Públicas ejercer actividades privadas?"
  options:
  - id: a
    correct: true
    text:
      es: "En aquellos en que haya intervenido en los dos últimos años."
  - id: b
    text:
      es: "En aquellos en que haya intervenido en el último año."
  - id: c
    text:
      es: "En aquellos en que haya intervenido en los tres últimos años."
  - id: d
    text:
      es: "En aquellos en que haya intervenido en los cinco últimos años."
  explanation:
    es: "El artículo 12.1.a) de la Ley 53/1984 prohíbe las actividades privadas «en los asuntos en que esté interviniendo, haya intervenido en los dos últimos años o tenga que intervenir por razón del puesto público». El último año, los tres y los cinco últimos años no son la cifra de la Ley."
  citation: "art. 12.1.a) Ley 53/1984"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q029
  prompt:
    es: "Un funcionario que hace dieciocho meses informó, por razón de su puesto, el expediente de una empresa quiere asesorarla ahora como profesional en ese mismo expediente. ¿Puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque intervino en ese asunto dentro de los dos últimos años."
  - id: b
    text:
      es: "Sí, porque ha pasado más de un año desde su intervención."
  - id: c
    text:
      es: "Sí, si obtiene antes el reconocimiento de compatibilidad."
  - id: d
    text:
      es: "Sí, si el asesoramiento se presta fuera de su horario de trabajo."
  explanation:
    es: "El artículo 12.1 de la Ley 53/1984 dice que «En todo caso» el personal no podrá ejercer actividades privadas, incluidas las profesionales, en los asuntos en que «haya intervenido en los dos últimos años». Dieciocho meses quedan dentro de esos dos años. Un año no es el plazo de la Ley. Por ser una prohibición «en todo caso», no la levanta un reconocimiento de compatibilidad ni el hecho de trabajar fuera del horario."
  citation: "art. 12.1.a) Ley 53/1984"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q032
  prompt:
    es: "¿Alcanza la prohibición de desempeñar cargos en empresas contratistas del sector público al funcionario que los ejerce por persona interpuesta?"
  options:
  - id: a
    text:
      es: "No, solo alcanza el desempeño directo de cargos por el propio funcionario."
  - id: b
    text:
      es: "Solo si la persona interpuesta percibe retribución de la empresa."
  - id: c
    text:
      es: "No, salvo que el funcionario tenga una participación superior al 10 por 100."
  - id: d
    correct: true
    text:
      es: "Sí, la prohibición alcanza el desempeño por sí o por persona interpuesta."
  explanation:
    es: "El artículo 12.1.c) de la Ley 53/1984 prohíbe «El desempeño, por sí o por persona interpuesta, de cargos de todo orden» en esas empresas. La opción que limita la prohibición al desempeño directo contradice ese «por persona interpuesta». La retribución de la persona interpuesta no es una condición del artículo. La participación superior al 10 por 100 es una prohibición distinta, la de la letra d), y no condiciona la de la letra c)."
  citation: "art. 12.1.c) Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q033
  prompt:
    es: "Según el artículo 12.1.d) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, en el capital de empresas concesionarias o contratistas del sector público el personal tiene vedada una participación:"
  options:
  - id: a
    text:
      es: "Superior al 5 por 100 de ese capital."
  - id: b
    correct: true
    text:
      es: "Superior al 10 por 100 de ese capital."
  - id: c
    text:
      es: "Superior al 15 por 100 de ese capital."
  - id: d
    text:
      es: "Superior al 25 por 100 de ese capital."
  explanation:
    es: "El artículo 12.1.d) prohíbe «La participación superior al 10 por 100 en el capital de las Empresas o Sociedades a que se refiere el párrafo anterior». El 5, el 15 y el 25 por 100 no son la cifra de la Ley."
  citation: "art. 12.1.d) Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1985-151-art-12
- id: m04-l06-q034
  prompt:
    es: "Una funcionaria posee el 12 por 100 del capital de una sociedad arrendataria de un monopolio. Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿puede mantener esa participación?"
  options:
  - id: a
    text:
      es: "Sí, porque no supera el 15 por 100 del capital social."
  - id: b
    correct: true
    text:
      es: "No, porque supera el 10 por 100 permitido en esas sociedades."
  - id: c
    text:
      es: "Sí, si obtiene antes el reconocimiento de compatibilidad."
  - id: d
    text:
      es: "Sí, siempre que no desempeñe cargos en la sociedad."
  explanation:
    es: "El artículo 12.1 prohíbe «En todo caso» la participación superior al 10 por 100 en el capital de las sociedades de la letra c), entre las que están las «arrendatarias o administradoras de monopolios». El 12 por 100 supera ese límite. El 15 por 100 no es la cifra de la Ley. Una prohibición «en todo caso» no la levanta un reconocimiento de compatibilidad. No desempeñar cargos tampoco basta: el cargo es la prohibición de la letra c) y la participación, la de la letra d)."
  citation: "art. 12.1.d) Ley 53/1984"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q035
  prompt:
    es: "De acuerdo con el artículo 14 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera de las Administraciones Públicas requiere:"
  options:
  - id: a
    text:
      es: "La previa y expresa autorización de compatibilidad."
  - id: b
    correct: true
    text:
      es: "El previo reconocimiento de compatibilidad."
  - id: c
    text:
      es: "Una comunicación posterior al órgano de personal."
  - id: d
    text:
      es: "El informe favorable de la Oficina de Conflictos de Intereses."
  explanation:
    es: "El artículo catorce de la Ley 53/1984 dice que el ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera de las Administraciones Públicas «requerirá el previo reconocimiento de compatibilidad». La previa y expresa autorización es la figura del artículo noveno para un segundo puesto o actividad del sector público. Una comunicación posterior contradice «previo». La Oficina de Conflictos de Intereses no interviene: el artículo atribuye la resolución al Ministerio de la Presidencia, al órgano competente de la Comunidad Autónoma o al Pleno de la Corporación Local."
  citation: "art. 14 Ley 53/1984"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q036
  prompt:
    es: "¿En qué plazo se dicta la resolución que reconoce la compatibilidad o declara la incompatibilidad del personal de las Administraciones Públicas para actividades privadas?"
  options:
  - id: a
    text:
      es: "En el plazo de un mes."
  - id: b
    text:
      es: "En el plazo de tres meses."
  - id: c
    correct: true
    text:
      es: "En el plazo de dos meses."
  - id: d
    text:
      es: "En el plazo de seis meses."
  explanation:
    es: "El artículo 14 de la Ley 53/1984 dice que la resolución motivada «se dictará en el plazo de dos meses». Tres meses es el plazo del artículo 5 del Real Decreto 598/1985 para la autorización de un segundo puesto público, y un mes su prórroga máxima. Seis meses no aparece en estas normas."
  citation: "art. 14 Ley 53/1984"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q037
  prompt:
    es: "Según el artículo 14 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la resolución sobre la compatibilidad para una actividad privada se dicta, en el Estado, a propuesta de:"
  options:
  - id: a
    text:
      es: "El Director General de la Función Pública."
  - id: b
    text:
      es: "El Secretario General Técnico del Departamento correspondiente."
  - id: c
    text:
      es: "El Secretario de Estado de Función Pública."
  - id: d
    correct: true
    text:
      es: "El Subsecretario del Departamento correspondiente."
  explanation:
    es: "El artículo 14 atribuye la resolución al ministerio que nombra, «a propuesta del Subsecretario del Departamento correspondiente». El Director General de la Función Pública, el Secretario General Técnico y el Secretario de Estado de Función Pública no aparecen en el artículo como proponentes."
  citation: "art. 14 Ley 53/1984"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q038
  prompt:
    es: "¿Cuál de los siguientes efectos tiene el cambio de puesto en el sector público para quien tiene reconocida la compatibilidad para una actividad privada?"
  options:
  - id: a
    text:
      es: "El reconocimiento se mantiene si la nueva jornada no es superior."
  - id: b
    text:
      es: "El reconocimiento se suspende hasta que lo confirme el nuevo Departamento."
  - id: c
    correct: true
    text:
      es: "El reconocimiento queda automáticamente sin efecto."
  - id: d
    text:
      es: "El reconocimiento se mantiene durante un plazo de dos meses."
  explanation:
    es: "El artículo 14 de la Ley 53/1984 dice que los reconocimientos de compatibilidad «quedarán automáticamente sin efecto en caso de cambio de puesto en el sector público». No se mantienen aunque la jornada no aumente, ni quedan en suspenso a la espera de confirmación, ni duran dos meses más: dos meses es el plazo para resolver una nueva solicitud."
  citation: "art. 14 Ley 53/1984"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q039
  prompt:
    es: "Conforme al artículo 14 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, los reconocimientos de compatibilidad para actividades privadas:"
  options:
  - id: a
    correct: true
    text:
      es: "No pueden modificar la jornada de trabajo y horario del interesado."
  - id: b
    text:
      es: "Pueden reducir la jornada del interesado, con la reducción proporcional de retribuciones."
  - id: c
    text:
      es: "Pueden modificar el horario si no alteran la jornada semanal."
  - id: d
    text:
      es: "Pueden modificar la jornada del interesado previo informe favorable de la Subsecretaría."
  explanation:
    es: "El artículo 14 dice que «Los reconocimientos de compatibilidad no podrán modificar la jornada de trabajo y horario del interesado». Las tres opciones que permiten reducir la jornada, mover el horario o modificar la jornada con informe chocan con esa prohibición."
  citation: "art. 14 Ley 53/1984"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q040
  prompt:
    es: "Señale la respuesta correcta sobre la resolución que, conforme al artículo 14 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, se dicta sobre la compatibilidad para actividades privadas:"
  options:
  - id: a
    text:
      es: "Solo debe motivarse cuando declara la incompatibilidad del interesado."
  - id: b
    correct: true
    text:
      es: "Debe ser motivada, tanto si reconoce la compatibilidad como si declara la incompatibilidad."
  - id: c
    text:
      es: "Solo debe motivarse cuando reconoce la compatibilidad del interesado."
  - id: d
    text:
      es: "No requiere motivación cuando se dicta dentro del plazo de dos meses desde la presentación de la solicitud."
  explanation:
    es: "El artículo 14 habla de «La resolución motivada reconociendo la compatibilidad o declarando la incompatibilidad». La motivación se exige en los dos sentidos. Las opciones que la reservan a uno solo de ellos recortan el texto. Dictarla dentro del plazo no dispensa de motivarla."
  citation: "art. 14 Ley 53/1984"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1985-151-art-14
- id: m04-l06-q041
  prompt:
    es: "¿Cuál de las siguientes actividades requiere, conforme a la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el previo reconocimiento de compatibilidad?"
  options:
  - id: a
    text:
      es: "La administración del patrimonio personal o familiar, sin perjuicio del artículo 12."
  - id: b
    text:
      es: "La presidencia no retribuida de la Junta rectora de una Mutualidad de Funcionarios."
  - id: c
    text:
      es: "La producción y creación literaria que no se origine como consecuencia de una relación de empleo o de servicios."
  - id: d
    correct: true
    text:
      es: "El ejercicio de una actividad profesional por cuenta propia fuera de las Administraciones Públicas."
  explanation:
    es: "El artículo 14 exige el previo reconocimiento de compatibilidad para «El ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera de las Administraciones Públicas». Las otras tres actividades están exceptuadas del régimen de incompatibilidades por el artículo 19: la administración del patrimonio personal o familiar (letra a), el cargo no retribuido en Juntas rectoras de Mutualidades (letra e) y la creación literaria no originada en una relación de empleo (letra f)."
  citation: "art. 14 Ley 53/1984"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l06-q042
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, mientras no surta efectos la nueva redacción del artículo 16.1 de la Ley 53/1984, la autorización o denegación de compatibilidades:"
  options:
  - id: a
    text:
      es: "Se regirá directamente por la nueva redacción del artículo 16.1."
  - id: b
    text:
      es: "Quedará en suspenso hasta la aprobación de las leyes de Función Pública."
  - id: c
    text:
      es: "Se regirá por las instrucciones que dicte cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Continuará rigiéndose por la actual normativa."
  explanation:
    es: "La disposición final cuarta.1, párrafo segundo, dice: «Hasta que se hagan efectivos esos supuestos la autorización o denegación de compatibilidades continuará rigiéndose por la actual normativa». La nueva redacción del artículo 16.1 no se aplica todavía de forma directa. Las autorizaciones no quedan en suspenso. La disposición no remite a instrucciones de cada Departamento."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l06-q043
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuándo produce efectos en cada Administración la nueva redacción del artículo 16.1 de la Ley 53/1984?"
  options:
  - id: a
    text:
      es: "Con la entrada en vigor del texto refundido, en todas las Administraciones a la vez."
  - id: b
    correct: true
    text:
      es: "Con la entrada en vigor del capítulo III del título III, al aprobarse las leyes de Función Pública."
  - id: c
    text:
      es: "Con la aprobación de un real decreto de desarrollo por el Consejo de Ministros."
  - id: d
    text:
      es: "Con la publicación de la relación de puestos de trabajo de cada Administración."
  explanation:
    es: "La disposición dice que la final tercera, que da la nueva redacción al artículo 16.1, «producirá efectos en cada Administración Pública a partir de la entrada en vigor del capítulo III del título III con la aprobación de las leyes de Función Pública». No surtió efectos con el propio texto refundido ni a la vez en todas las Administraciones. Un real decreto de desarrollo o la relación de puestos de trabajo no son el hecho que la disposición señala."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-1985-151-art-16
- id: m04-l06-q044
  prompt:
    es: "En la redacción que el texto refundido de la Ley del Estatuto Básico del Empleado Público da al artículo 16.1 de la Ley 53/1984, se excluye de toda compatibilidad al personal cuyas retribuciones complementarias incluyan:"
  options:
  - id: a
    text:
      es: "El factor de dedicación del puesto."
  - id: b
    text:
      es: "El factor de responsabilidad del puesto."
  - id: c
    text:
      es: "El factor de especial dificultad técnica del puesto."
  - id: d
    correct: true
    text:
      es: "El factor de incompatibilidad del puesto."
  explanation:
    es: "La nueva redacción del artículo 16.1, dada por la disposición final tercera del texto refundido, excluye al personal «cuando las retribuciones complementarias […] incluyan el factor de incompatibilidad». La dedicación, la responsabilidad y la especial dificultad técnica son otros factores que pueden retribuirse con el complemento, pero el artículo 16.1 no los nombra."
  citation: "art. 16.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-16
- id: m04-l06-q045
  prompt:
    es: "Según la redacción anterior del artículo 16.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, que reproduce la nota del BOE, se excluye de toda compatibilidad al personal:"
  options:
  - id: a
    text:
      es: "Que desempeñe puestos que comporten la percepción de complementos de productividad o concepto equiparable."
  - id: b
    text:
      es: "Que desempeñe puestos con nivel de complemento de destino superior al 26."
  - id: c
    text:
      es: "Que desempeñe puestos de libre designación, cualquiera que sea su complemento."
  - id: d
    correct: true
    text:
      es: "Que desempeñe puestos que comporten la percepción de complementos específicos o concepto equiparable."
  explanation:
    es: "La redacción anterior que recoge la nota del BOE dice: «No podrá autorizarse o reconocerse compatibilidad alguna al personal que desempeñe puestos que comporten la percepción de complementos específicos o concepto equiparable, y al retribuido por arancel». El complemento de productividad, el nivel de complemento de destino y la libre designación no aparecen en ese texto."
  citation: "art. 16.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-16
- id: m04-l06-q046
  prompt:
    es: "Según el artículo 16.1 de la Ley 53/1984 en la redacción dada por el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿a qué personal, además del retribuido por arancel, excluye de toda compatibilidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Al personal directivo, incluido el sujeto a la relación laboral especial de alta dirección."
  - id: b
    text:
      es: "Al personal funcionario interino, cualquiera que sea su retribución complementaria."
  - id: c
    text:
      es: "Al personal laboral temporal, cualquiera que sea su retribución complementaria."
  - id: d
    text:
      es: "Al personal de los órganos constitucionales, cualquiera que sea su vínculo."
  explanation:
    es: "El artículo dieciséis.1 de la Ley 53/1984 niega la compatibilidad «al retribuido por arancel y al personal directivo, incluido el sujeto a la relación laboral de carácter especial de alta dirección». El funcionario interino y el laboral temporal no están nombrados por su vínculo: el apartado excluye al personal funcionario, eventual y laboral solo cuando sus retribuciones complementarias incluyen el factor de incompatibilidad. El personal de los órganos constitucionales no es una de las dos categorías que el apartado nombra: retribuidos por arancel y personal directivo."
  citation: "art. 16.1 Ley 53/1984"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-16
- id: m04-l06-q047
  prompt:
    es: "De acuerdo con el artículo 16.4 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, puede reconocerse compatibilidad para actividades privadas a quien percibe complementos específicos cuya cuantía no supere:"
  options:
  - id: a
    text:
      es: "El 30 por 100 de su retribución básica, incluidos los conceptos de antigüedad."
  - id: b
    correct: true
    text:
      es: "El 30 por 100 de su retribución básica, excluidos los conceptos de antigüedad."
  - id: c
    text:
      es: "El 35 por 100 de su retribución básica, excluidos los conceptos de antigüedad."
  - id: d
    text:
      es: "El 30 por 100 de sus retribuciones complementarias, excluida la productividad."
  explanation:
    es: "El artículo 16.4 admite el reconocimiento cuando el complemento específico tenga una cuantía que «no supere el 30 por 100 de su retribución básica, excluidos los conceptos que tengan su origen en la antigüedad». Incluir la antigüedad, subir al 35 por 100 o tomar como base las retribuciones complementarias cambia el texto."
  citation: "art. 16.4 Ley 53/1984"
  difficulty: 1
  tags:
