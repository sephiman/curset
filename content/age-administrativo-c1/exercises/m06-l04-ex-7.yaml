# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q246
  prompt:
    es: "Según la página de Microsoft, ¿cuál de los siguientes contenidos almacena el formato de archivo .docm de Word 365?"
  options:
  - id: a
    text:
      es: "Código de macros de JavaScript"
  - id: b
    correct: true
    text:
      es: "Código de macros de Visual Basic para Aplicaciones"
  - id: c
    text:
      es: "Código de macros de Python"
  - id: d
    text:
      es: "Solo las personalizaciones de la interfaz de usuario"
  explanation:
    es: "La página dice que .docm es un formato «habilitado para macros» y «almacena código de macros Visual Basic para Aplicaciones (VBA)». JavaScript y Python no son el lenguaje que la página nombra para las macros de .docm. Y las personalizaciones de la interfaz de usuario las cita la página en otra fila, la de .dotm, la plantilla: «los usuarios que deseen incluir personalizaciones de la interfaz de usuario o macros en la plantilla deben usar este formato»."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q247
  prompt:
    es: "¿Cuál de las siguientes extensiones es el formato de archivo basado en XML predeterminado de los documentos de Word 365?"
  options:
  - id: a
    text:
      es: ".docm"
  - id: b
    text:
      es: ".doc"
  - id: c
    correct: true
    text:
      es: ".docx"
  - id: d
    text:
      es: ".odt"
  explanation:
    es: "La página dice de .docx: «Formato de archivo basado en XML predeterminado para Word 2021, Word 2019, Word 2016, Word 2013, Word 2010 y Office Word 2007». .docm es el formato habilitado para macros, no el predeterminado. .doc es el formato binario de Word 97-2003. .odt guarda archivos para abrirlos en aplicaciones que usan OpenDocument."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q248
  prompt:
    es: "¿Qué formato de archivo es el binario de Word 97-Word 2003, según la página de Microsoft sobre formatos de Word 365?"
  options:
  - id: a
    text:
      es: ".docx"
  - id: b
    text:
      es: ".rtf"
  - id: c
    text:
      es: ".txt"
  - id: d
    correct: true
    text:
      es: ".doc"
  explanation:
    es: "La página dice: «.doc Documento de Word 97-2003. Formato de archivo binario para Word 97-Word 2003». .docx es el formato basado en XML predeterminado. .rtf es el formato de texto enriquecido para transferir documentos entre sistemas. .txt guarda texto sin formato."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q249
  prompt:
    es: "Según la página de Microsoft sobre formatos de archivo de Word, al guardar un documento de Word 365 como archivo .txt:"
  options:
  - id: a
    correct: true
    text:
      es: "Se pierde todo el formato"
  - id: b
    text:
      es: "Se conserva el formato, pero se pierden las macros"
  - id: c
    text:
      es: "Se conserva solo el formato de los títulos"
  - id: d
    text:
      es: "Se convierte en una plantilla con el mismo formato"
  explanation:
    es: "La página dice: «Cuando los usuarios guardan un documento como un archivo .txt, perderá todo el formato». Conservar el formato y perder solo las macros contradice «todo el formato», y conservar solo el de los títulos también: no queda ninguno. Y convertirse en plantilla no es lo que hace .txt: las plantillas tienen sus propias filas en la página, .dotx y .dotm, y .txt aparece como formato de texto sin formato."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q250
  prompt:
    es: "¿Qué formato de archivo permite transferir documentos de Word 365 entre sistemas operativos y aplicaciones diferentes?"
  options:
  - id: a
    text:
      es: ".docm"
  - id: b
    text:
      es: ".dotx"
  - id: c
    correct: true
    text:
      es: ".rtf"
  - id: d
    text:
      es: ".wps"
  explanation:
    es: "La página dice que con .rtf «los documentos creados en diferentes sistemas operativos y con diferentes aplicaciones de software pueden transferirse». .docm almacena macros VBA. .dotx es una plantilla que no contiene macros. .wps es el formato predeterminado de Microsoft Works."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q251
  prompt:
    es: "Según la página de Microsoft, en Word 365 el Autoguardado está habilitado de forma predeterminada:"
  options:
  - id: a
    text:
      es: "Cuando el archivo está guardado en una ruta de acceso local como C:\\ del equipo"
  - id: b
    correct: true
    text:
      es: "Cuando el archivo está en OneDrive, OneDrive para la Empresa o SharePoint Online"
  - id: c
    text:
      es: "Cuando el archivo está en un servidor de archivos de la propia organización"
  - id: d
    text:
      es: "Cuando el archivo está en un sitio local de SharePoint de la organización"
  explanation:
    es: "La página dice: «El Autoguardado está habilitado de forma predeterminada en Microsoft 365 cuando un archivo está almacenado en OneDrive, OneDrive para la Empresa o SharePoint Online». Con una ruta local, Autoguardado está desactivado. Con un servidor de archivos, Autoguardado está desactivado. Con un sitio local de SharePoint, Autoguardado está desactivado."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué es el Autoguardado?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q252
  prompt:
    es: "Según la página de Microsoft sobre qué es el Autoguardado, en Word 365 este guarda el archivo:"
  options:
  - id: a
    text:
      es: "Cada 10 minutos, aproximadamente, durante la edición"
  - id: b
    text:
      es: "Solo al cerrar el documento con los cambios"
  - id: c
    text:
      es: "Solo al presionar Ctrl+S o el botón Guardar"
  - id: d
    correct: true
    text:
      es: "Cada pocos segundos, mientras se trabaja"
  explanation:
    es: "La página dice que Autoguardado «guarda el archivo automáticamente, cada pocos segundos, mientras trabaja». Los 10 minutos son el intervalo aproximado entre versiones nuevas del historial de versiones. La página dice que guarda cada pocos segundos mientras se trabaja. Ctrl+S es el guardado manual; Autoguardado guarda cada pocos segundos."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué es el Autoguardado?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q253
  prompt:
    es: "Señale en cuál de las siguientes ubicaciones queda desactivado el Autoguardado de un archivo de Word 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Una ruta de acceso local, como C:\\"
  - id: b
    text:
      es: "Una carpeta de OneDrive en la nube"
  - id: c
    text:
      es: "Una carpeta de OneDrive para la Empresa"
  - id: d
    text:
      es: "Una biblioteca de SharePoint Online"
  explanation:
    es: "La página dice que Autoguardado está desactivado si el archivo está «guardado en una ruta de acceso local como C:\\». En OneDrive, Autoguardado está habilitado de forma predeterminada. En OneDrive para la Empresa, Autoguardado está habilitado de forma predeterminada. En SharePoint Online, Autoguardado está habilitado de forma predeterminada."
  citation: "fuente: `ms-office-autoguardado.html`; «Soy un suscriptor y tengo la última versión de Office. ¿Por qué Autoguardado está deshabilitado?»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q254
  prompt:
    es: "En Word 365, ¿cuál de los siguientes archivos tiene desactivado el Autoguardado aunque esté en OneDrive?"
  options:
  - id: a
    text:
      es: "Uno en formato .docx guardado en OneDrive"
  - id: b
    text:
      es: "Uno almacenado en SharePoint Online"
  - id: c
    text:
      es: "Uno almacenado en OneDrive para la Empresa"
  - id: d
    correct: true
    text:
      es: "Uno en formato antiguo, como .doc"
  explanation:
    es: "La página dice entre las razones por las que Autoguardado puede estar desactivado: «El archivo está en un formato antiguo, como .xls, .ppt o .doc». Un archivo almacenado en OneDrive tiene Autoguardado habilitado de forma predeterminada. Un archivo almacenado en SharePoint Online tiene Autoguardado habilitado de forma predeterminada. Un archivo almacenado en OneDrive para la Empresa tiene Autoguardado habilitado de forma predeterminada."
  citation: "fuente: `ms-office-autoguardado.html`; «Soy un suscriptor y tengo la última versión de Office. ¿Por qué Autoguardado está deshabilitado?»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q255
  prompt:
    es: "En Word 365, ¿cuál de los siguientes comandos muestra el menú Archivo en lugar de Guardar como al abrir un documento desde OneDrive?"
  options:
  - id: a
    text:
      es: "Imprimir"
  - id: b
    correct: true
    text:
      es: "Guardar una copia"
  - id: c
    text:
      es: "Abrir"
  - id: d
    text:
      es: "Abrir versión"
  explanation:
    es: "La página dice: «Guardar como no se incluye en el menú Archivo si abre un documento desde OneDrive, OneDrive para la Empresa o SharePoint Online. En estos casos, se muestra el comando Guardar una copia». Imprimir y Abrir no son el comando que sustituye a Guardar como: la página nombra solo Guardar una copia. Y Abrir versión es un botón del Historial de versiones, que se abre desde el nombre del archivo, no un comando del menú Archivo."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué ha ocurrido con Guardar > archivo como?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q258
  prompt:
    es: "Si en Word 365 se desactiva Autoguardado para un archivo individual, ¿qué ocurre al volver a abrir ese mismo archivo?"
  options:
  - id: a
    text:
      es: "El programa lo vuelve a activar de forma predeterminada"
  - id: b
    correct: true
    text:
      es: "El programa recuerda mantenerlo desactivado"
  - id: c
    text:
      es: "El programa pide activarlo antes de permitir la edición"
  - id: d
    text:
      es: "El programa lo desactiva en todos los archivos de OneDrive"
  explanation:
    es: "La página dice: «Si desactiva Autoguardado para un archivo individual, el programa recordará mantenerlo desactivado cada vez que vuelva a abrir ese archivo». Volver a activarlo por defecto contradice «recordará mantenerlo desactivado». Que pida activarlo antes de permitir la edición choca con lo que la página describe para el archivo con Autoguardado desactivado: «puede desactivar Autoguardado. Cuando esté listo, haga clic en Guardar», es decir, se trabaja con él apagado y se guarda a mano. Desactivarlo en todos los archivos de OneDrive es un ajuste distinto: para todos los archivos la página manda a Opciones de archivo > Guardar, y lo de reabrir se limita a «un archivo individual»."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Cómo puedo hacer que el valor predeterminado no sea Autoguardado?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q259
  prompt:
    es: "En Word 365, ¿cuál es el orden de pasos correcto para restaurar una versión anterior de un archivo con Autoguardado?"
  options:
  - id: a
    text:
      es: "Clic en el nombre del archivo › Abrir versión › Historial de versiones › Restaurar"
  - id: b
    text:
      es: "Clic en el nombre del archivo › Historial de versiones › Restaurar › Abrir versión"
  - id: c
    correct: true
    text:
      es: "Clic en el nombre del archivo › Historial de versiones › Abrir versión › Restaurar"
  - id: d
    text:
      es: "Archivo › Guardar una copia › Historial de versiones › Restaurar"
  explanation:
    es: "La página dice: «En la parte superior de la ventana, haz clic en el nombre del archivo y después, haz clic en Historial de versiones […]. A continuación, haz clic en Abrir versión […]. Para regresar a esta versión, haz clic en el botón Restaurar». La página pone Historial de versiones antes de Abrir versión. La página pide Abrir versión antes de Restaurar. La página parte del nombre del archivo, en la parte superior de la ventana."
  citation: "fuente: `ms-office-autoguardado.html`; «No quería que los cambios se guardaran. ¿Cómo puedo restaurar la versión anterior?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q260
  prompt:
    es: "En Word 365, ¿qué ocurre al seleccionar Abrir versión en el historial de versiones de un archivo?"
  options:
  - id: a
    text:
      es: "Se restaura la versión elegida sobre el archivo actual"
  - id: b
    text:
      es: "Se elimina la versión elegida del historial"
  - id: c
    text:
      es: "Se guarda una copia de la versión elegida en OneDrive"
  - id: d
    correct: true
    text:
      es: "Se abre una segunda ventana que muestra la versión del archivo"
  explanation:
    es: "La página dice: «haz clic en Abrir versión. Se abrirá una segunda ventana que muestra la versión del archivo». Restaurar sobre el archivo actual lo hace otro botón: «Para regresar a esta versión, haz clic en el botón Restaurar». Eliminar la versión del historial contradice esa secuencia, porque tras Abrir versión la página sigue ofreciendo regresar a esa versión con Restaurar, y no se podría si se hubiera eliminado. Guardar una copia en OneDrive es el cometido de otro comando: «se muestra el comando Guardar una copia en el menú Archivo»."
  citation: "fuente: `ms-office-autoguardado.html`; «No quería que los cambios se guardaran. ¿Cómo puedo restaurar la versión anterior?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q261
  prompt:
    es: "En la segunda ventana que muestra una versión anterior en Word 365, ¿qué botón permite regresar a esa versión?"
  options:
  - id: a
    correct: true
    text:
      es: "Restaurar"
  - id: b
    text:
      es: "Abrir versión"
  - id: c
    text:
      es: "Historial de versiones"
  - id: d
    text:
      es: "Guardar una copia"
  explanation:
    es: "La página dice: «Para regresar a esta versión, haz clic en el botón Restaurar». Abrir versión abre la segunda ventana con la versión. Historial de versiones lista las versiones, desde el nombre del archivo. Guardar una copia es el comando que sustituye a Guardar como en OneDrive."
  citation: "fuente: `ms-office-autoguardado.html`; «No quería que los cambios se guardaran. ¿Cómo puedo restaurar la versión anterior?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-autoguardado-html
- id: m06-l04-q262
  prompt:
    es: "Con Autoguardado activo en Word 365, ¿cada cuánto se agregan versiones nuevas al historial de versiones durante la sesión de edición?"
  options:
  - id: a
    text:
      es: "Cada pocos segundos, con cada guardado automático"
  - id: b
    text:
      es: "Solo al cerrar el archivo"
  - id: c
    correct: true
    text:
      es: "Ocasionalmente, cada 10 minutos aproximadamente"
  - id: d
    text:
      es: "Cada hora, exactamente"
  explanation:
    es: "La página dice: «solo se agregan versiones nuevas al historial de versiones ocasionalmente (cada 10 minutos aproximadamente) durante el resto de la sesión de edición». Aunque Autoguardado guarda periódicamente, las versiones nuevas se agregan solo ocasionalmente. Las versiones nuevas se agregan cada 10 minutos aproximadamente durante la sesión. La página da 10 minutos aproximadamente."
  citation: "fuente: `ms-office-autoguardado.html`; «No quería que los cambios se guardaran. ¿Cómo puedo restaurar la versión anterior?»"
  difficulty: 3
  tags:
  - "cantidad"
