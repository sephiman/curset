variants:
# anchor: boe-a-2007-6115-art-12
- id: m01-l16-q066
  prompt:
    es: "Señale en qué procesos tienen capacidad y legitimación las personas con interés legítimo para defender el derecho a la igualdad, según el artículo 12.2 de la Ley Orgánica 3/2007, de 22 de marzo:"
  options:
  - id: a
    text:
      es: "En los procesos civiles y penales."
  - id: b
    text:
      es: "Solo en los procesos contencioso-administrativos."
  - id: c
    correct: true
    text:
      es: "En los procesos civiles, sociales y contencioso-administrativos."
  - id: d
    text:
      es: "En los procesos sociales y militares."
  explanation:
    es: "El artículo 12.2 nombra los procesos civiles, sociales y contencioso-administrativos. No cita los penales ni los militares, y no se limita a los contencioso-administrativos."
  citation: "art. 12.2 LO 3/2007"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2007-6115-art-12
- id: m01-l16-q067
  prompt:
    es: "Una asociación con interés legítimo en la igualdad quiere intervenir en un litigio por acoso sexual. Conforme a la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, ¿puede hacerlo como parte legitimada?"
  options:
  - id: a
    text:
      es: "Sí, porque las personas jurídicas con interés legítimo están legitimadas en todos los litigios de igualdad."
  - id: b
    correct: true
    text:
      es: "No, porque la persona acosada es la única legitimada en esos litigios."
  - id: c
    text:
      es: "Sí, siempre que cuente con la autorización de la persona acosada."
  - id: d
    text:
      es: "Sí, si actúa en nombre del Ministerio Fiscal."
  explanation:
    es: "En los litigios sobre acoso sexual y acoso por razón de sexo, el artículo 12.3 deja como única legitimada a la persona acosada, así que la asociación no puede serlo. La regla general del apartado 2 sobre las personas jurídicas con interés legítimo cede ante esta excepción. Ni la autorización de la víctima ni actuar en nombre del Ministerio Fiscal amplían la legitimación."
  citation: "art. 12.3 LO 3/2007"
  difficulty: 3
  tags:
  - "caso"
# anchor: boe-a-2007-6115-art-12
- id: m01-l16-q068
  prompt:
    es: "Señale en qué litigios la persona acosada es la única legitimada, según el artículo 12.3 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres:"
  options:
  - id: a
    correct: true
    text:
      es: "Los litigios sobre acoso sexual y acoso por razón de sexo."
  - id: b
    text:
      es: "Los litigios sobre discriminación directa por razón de sexo."
  - id: c
    text:
      es: "Los litigios sobre discriminación indirecta por razón de sexo."
  - id: d
    text:
      es: "Los litigios sobre la nulidad de cláusulas de negocios jurídicos discriminatorios."
  explanation:
    es: "La legitimación exclusiva de la persona acosada se limita a los litigios sobre acoso sexual y acoso por razón de sexo. En los de discriminación directa o indirecta y en los de nulidad de cláusulas rige la regla general del artículo 12.2, que alcanza a las personas físicas y jurídicas con interés legítimo."
  citation: "art. 12.3 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-53
- id: m01-l16-q069
  prompt:
    es: "¿Cuál de los siguientes principios rige la representación de la Administración General del Estado y de sus organismos públicos en las comisiones de valoración de méritos, según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo?"
  options:
  - id: a
    text:
      es: "Paridad absoluta de ambos sexos."
  - id: b
    text:
      es: "Preferencia de las mujeres en la valoración de méritos."
  - id: c
    text:
      es: "Representación proporcional a la plantilla de cada departamento."
  - id: d
    correct: true
    text:
      es: "Composición equilibrada de ambos sexos."
  explanation:
    es: "Las comisiones de valoración de méritos para la provisión de puestos se ajustan a la composición equilibrada de ambos sexos. No se exige paridad absoluta, ni preferencia de las mujeres, ni una representación proporcional a la plantilla de cada departamento."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-53
- id: m01-l16-q070
  prompt:
    es: "Señale qué órganos deben responder al principio de presencia equilibrada de mujeres y hombres, salvo por razones fundadas y objetivas, según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo:"
  options:
  - id: a
    text:
      es: "Los consejos de administración de todas las empresas privadas."
  - id: b
    text:
      es: "Los tribunales de los procesos selectivos de las comunidades autónomas."
  - id: c
    text:
      es: "Los comités de empresa de las entidades públicas empresariales."
  - id: d
    correct: true
    text:
      es: "Los tribunales y órganos de selección del personal de la Administración General del Estado y de sus organismos públicos."
  explanation:
    es: "El artículo 53 impone la presencia equilibrada a los tribunales y órganos de selección del personal de la Administración General del Estado y de sus organismos públicos. No alcanza a los consejos de administración privados ni a los comités de empresa, y se refiere al ámbito estatal, no a los procesos de las comunidades autónomas."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2007-6115-art-64
- id: m01-l16-q071
  prompt:
    es: "¿Cuál de los siguientes órganos evalúa anualmente el cumplimiento del Plan para la Igualdad entre mujeres y hombres en la Administración General del Estado, según el artículo 64 de la Ley Orgánica 3/2007, de 22 de marzo?"
  options:
  - id: a
    text:
      es: "El Ministerio de Igualdad."
  - id: b
    text:
      es: "Las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: d
    text:
      es: "La Comisión Interministerial de Igualdad entre mujeres y hombres."
  explanation:
    es: "Es el Consejo de Ministros quien evalúa cada año el cumplimiento del Plan. El Ministerio de Igualdad y la Comisión Interministerial coordinan o promueven políticas, pero el artículo 64 no les encarga esa evaluación, y las Cortes Generales no intervienen en ella."
  citation: "art. 64 LO 3/2007"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2007-6115-art-64
- id: m01-l16-q072
  prompt:
    es: "Señale el ámbito del Plan para la Igualdad entre mujeres y hombres que el Gobierno aprueba al inicio de cada legislatura, según el artículo 64 de la Ley Orgánica 3/2007, de 22 de marzo:"
  options:
  - id: a
    text:
      es: "Todas las Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "La Administración General del Estado y sus organismos públicos."
  - id: c
    text:
      es: "Las empresas de cincuenta o más trabajadores."
  - id: d
    text:
      es: "Las Fuerzas Armadas y las Fuerzas y Cuerpos de Seguridad del Estado."
  explanation:
    es: "El Plan se aprueba para la Administración General del Estado y sus organismos públicos. Las empresas de cincuenta o más trabajadores tienen sus propios planes de igualdad del artículo 45, y el artículo 64 no extiende el Plan a todas las Administraciones ni lo limita a los cuerpos armados."
  citation: "art. 64 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-76
- id: m01-l16-q073
  prompt:
    es: "Conforme a la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la Comisión Interministerial de Igualdad entre mujeres y hombres coordina las políticas y medidas adoptadas por:"
  options:
  - id: a
    correct: true
    text:
      es: "Los departamentos ministeriales."
  - id: b
    text:
      es: "Las comunidades autónomas."
  - id: c
    text:
      es: "Las entidades locales."
  - id: d
    text:
      es: "Los organismos autónomos del Estado."
  explanation:
    es: "La Comisión coordina las políticas y medidas de los departamentos ministeriales, con la finalidad de garantizar el derecho a la igualdad y promover su efectividad. El artículo no le atribuye la coordinación de las comunidades autónomas, las entidades locales ni los organismos autónomos."
  citation: "art. 76 LO 3/2007"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2007-6115-da-primera
- id: m01-l16-q074
  prompt:
    es: "Un tribunal de selección de diez personas debe tener composición equilibrada según la disposición adicional primera de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres. ¿Cuál de las siguientes composiciones lo cumple?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuatro mujeres y seis hombres."
  - id: b
    text:
      es: "Tres mujeres y siete hombres."
  - id: c
    text:
      es: "Dos mujeres y ocho hombres."
  - id: d
    text:
      es: "Una mujer y nueve hombres."
  explanation:
    es: "En un órgano de diez personas, cada sexo ha de estar entre el cuarenta y el sesenta por ciento, es decir, entre cuatro y seis personas. Cuatro y seis cumplen. Con siete hombres se superaría el sesenta por ciento, y con ocho o nueve la desproporción es mayor."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 2
  tags:
  - "caso"
  - "cómputo"
# anchor: boe-a-2007-6115-art-7
- id: m01-l16-q118
  prompt:
    es: "Señale cómo ha de ser el comportamiento que constituye acoso sexual, según el artículo 7.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres:"
  options:
  - id: a
    text:
      es: "De naturaleza sexual, siempre que sea reiterado y de carácter físico."
  - id: b
    text:
      es: "Realizado en función del sexo de la persona, sin que sea de naturaleza sexual."
  - id: c
    text:
      es: "De naturaleza sexual, solo si produce un perjuicio profesional a la víctima."
  - id: d
    correct: true
    text:
      es: "De naturaleza sexual, verbal o físico, con el propósito o el efecto de atentar contra la dignidad de una persona."
  explanation:
    es: "El acoso sexual es cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de la persona. No exige reiteración ni limita el acoso al físico, ni requiere un perjuicio profesional. El comportamiento realizado en función del sexo, sin naturaleza sexual, es acoso por razón de sexo."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-45
- id: m01-l16-q119
  prompt:
    es: "Una empresa tiene cuarenta y nueve trabajadores. Según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, ¿están obligadas sus medidas de igualdad a dirigirse a elaborar y aplicar un plan de igualdad?"
  options:
  - id: a
    text:
      es: "Sí, porque la obligación alcanza a toda empresa con más de diez trabajadores."
  - id: b
    text:
      es: "Sí, porque la obligación alcanza a las empresas con más de cuarenta trabajadores."
  - id: c
    correct: true
    text:
      es: "No, la obligación alcanza a las empresas de cincuenta o más trabajadores."
  - id: d
    text:
      es: "No, porque la obligación solo alcanza a las Administraciones Públicas."
  explanation:
    es: "El artículo 45.2 se aplica a las empresas de cincuenta o más trabajadores, y con cuarenta y nueve queda por debajo. No existe un umbral de diez ni de cuarenta trabajadores, y la obligación no se limita a las Administraciones Públicas."
  citation: "art. 45.2 LO 3/2007"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2007-6115-art-10
- id: m01-l16-q124
  prompt:
    es: "Señale qué se considera nulo y sin efecto, según el artículo 10 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres:"
  options:
  - id: a
    correct: true
    text:
      es: "Los actos y las cláusulas de los negocios jurídicos que constituyan o causen discriminación por razón de sexo."
  - id: b
    text:
      es: "Las medidas específicas en favor de las mujeres que sean razonables y proporcionadas."
  - id: c
    text:
      es: "Los planes de igualdad que adopten voluntariamente las empresas de menos de cincuenta trabajadores."
  - id: d
    text:
      es: "Las cláusulas de los contratos que no mencionen el principio de igualdad."
  explanation:
    es: "El artículo 10 declara nulos los actos y cláusulas de los negocios jurídicos que constituyan o causen discriminación por razón de sexo. Las acciones positivas razonables y proporcionadas son legítimas conforme al artículo 11.1, las empresas de menos de cincuenta trabajadores pueden adoptar planes de igualdad de forma voluntaria (artículos 45.2 y 49) y la ley no exige que un contrato mencione el principio de igualdad para ser válido."
  citation: "art. 10 LO 3/2007"
  difficulty: 2
  tags:
  - "lmc-9"
