# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q301
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre el menú Inicio en Windows 11 desde el teclado, sin usar la tecla Windows?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Esc"
  - id: b
    text:
      es: "Ctrl+Mayús+Esc"
  - id: c
    text:
      es: "Windows+X"
  - id: d
    text:
      es: "Ctrl+Alt+Supr"
  explanation:
    es: "La tabla de métodos abreviados asigna a Ctrl+Esc «Abre el menú Inicio». Ctrl+Mayús+Esc abre el Administrador de tareas, Windows+X abre el menú Vínculo rápido y Ctrl+Alt+Supr cambia a la pantalla de seguridad, desde la que se bloquea el equipo, se cambia de usuario o se abre el Administrador de tareas."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q302
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones realiza la combinación de teclas Ctrl+Esc, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Abre el Administrador de tareas"
  - id: b
    text:
      es: "Abre el menú Vínculo rápido"
  - id: c
    text:
      es: "Abre el cuadro de diálogo Ejecutar"
  - id: d
    correct: true
    text:
      es: "Abre el menú Inicio"
  explanation:
    es: "La tabla dice que Ctrl+Esc abre el menú Inicio. El Administrador de tareas se abre con Ctrl+Mayús+Esc, el menú Vínculo rápido con Windows+X y el cuadro de diálogo Ejecutar con Windows+R."
  citation: "fuente: `ms-win-atajos.html`; «Escritorio y otros métodos abreviados generales»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q303
  prompt:
    es: "¿Qué ocurre en Windows 11 al pulsar solo la tecla con el logotipo de Windows, sin combinarla con otra, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Muestra y oculta el escritorio"
  - id: b
    text:
      es: "Abre el Explorador de archivos"
  - id: c
    correct: true
    text:
      es: "Abre o cierra el menú Inicio"
  - id: d
    text:
      es: "Abre la aplicación Configuración"
  explanation:
    es: "La tabla asigna a la tecla Windows «Abrir o cerrar el menú Inicio». Mostrar y ocultar el escritorio es Windows+D, abrir el Explorador de archivos es Windows+E y abrir Configuración es Windows+I."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q304
  prompt:
    es: "En Windows 11, la alineación del menú Inicio se cambia para llevarlo a un lado de la barra de tareas:"
  options:
  - id: a
    text:
      es: "en Configuración de Inicio, con clic derecho en la parte inferior del menú Inicio"
  - id: b
    correct: true
    text:
      es: "en Configuración de la barra de tareas, en Comportamientos de la barra de tareas"
  - id: c
    text:
      es: "en Configuración › Sistema › Multitarea › Escritorios, en la sección Multitarea"
  - id: d
    text:
      es: "en Configuración › Cuentas › Opciones de inicio de sesión, en Windows Hello"
  explanation:
    es: "La página dice que el menú Inicio, normalmente centrado, se lleva a un lado desde la configuración de la barra de tareas, expandiendo los comportamientos de la barra de tareas. La Configuración de Inicio sirve para elegir las carpetas junto al botón de encendido, Multitarea › Escritorios define las ventanas de la barra con varios escritorios y Opciones de inicio de sesión contiene Windows Hello."
  citation: "fuente: `ms-win-menu-inicio.html`; «Mover Inicio a un lado»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q305
  prompt:
    es: "Señale la afirmación correcta sobre la posición del menú Inicio de Windows 11 respecto a la barra de tareas:"
  options:
  - id: a
    text:
      es: "Normalmente está alineado a la izquierda, pero puede centrarse desde Configuración"
  - id: b
    correct: true
    text:
      es: "Normalmente está centrado, pero puede alinearse al lado de la barra de tareas"
  - id: c
    text:
      es: "Está siempre centrado y no hay ninguna opción para moverlo de sitio"
  - id: d
    text:
      es: "Puede llevarse a la parte superior de la pantalla desde la barra de tareas"
  explanation:
    es: "La página dice que el menú Inicio normalmente está centrado y que puede cambiarse la alineación al lado de la barra de tareas. La página sobre la barra de tareas añade que no hay ninguna configuración para llevar la barra a la parte superior o a un lateral de la pantalla."
  citation: "fuente: `ms-win-menu-inicio.html`; «Mover Inicio a un lado»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q306
  prompt:
    es: "En el menú Inicio de Windows 11, ¿qué contenido muestra la sección Recomendaciones, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Aplicaciones agregadas recientemente y usadas con frecuencia, y archivos abiertos recientemente"
  - id: b
    text:
      es: "Aplicaciones, archivos, carpetas y sitios web anclados en formato de cuadrícula para el acceso rápido"
  - id: c
    text:
      es: "Una lista alfabética de todas las aplicaciones instaladas en el dispositivo del usuario"
  - id: d
    text:
      es: "El icono de perfil para la cuenta, el cambio de cuentas y el botón de encendido del dispositivo"
  explanation:
    es: "La página dice que Recomendaciones muestra aplicaciones agregadas recientemente y usadas con frecuencia, además de archivos abiertos recientemente. Las aplicaciones, archivos, carpetas y sitios web en cuadrícula son los anclados, la lista alfabética de las aplicaciones instaladas es Todas las aplicaciones y el perfil con el botón de encendido es la sección Cuenta."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q307
  prompt:
    es: "En el menú Inicio de Windows 11, ¿cuáles de los siguientes tipos de elementos se pueden anclar para que aparezcan en la cuadrícula de anclados?"
  options:
  - id: a
    text:
      es: "Solo aplicaciones y sitios web"
  - id: b
    text:
      es: "Solo aplicaciones, archivos y carpetas, sin sitios web"
  - id: c
    text:
      es: "Solo carpetas y sitios web, sin aplicaciones"
  - id: d
    correct: true
    text:
      es: "Aplicaciones, archivos, carpetas y sitios web"
  explanation:
    es: "La página dice que los elementos anclados son aplicaciones, archivos, carpetas y sitios web en formato de cuadrícula. Las otras opciones dejan fuera alguno de esos cuatro tipos de elemento."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q308
  prompt:
    es: "En el menú Inicio de Windows 11, ¿con qué formato se presentan los elementos de la sección de anclados?"
  options:
  - id: a
    text:
      es: "En una lista alfabética de todas las aplicaciones"
  - id: b
    text:
      es: "Agrupados por categorías, según la vista elegida"
  - id: c
    correct: true
    text:
      es: "En formato de cuadrícula"
  - id: d
    text:
      es: "En una lista de archivos abiertos recientemente"
  explanation:
    es: "La página dice que los elementos anclados se presentan en formato de cuadrícula. La lista alfabética es la de Todas las aplicaciones, la vista por categorías es una de las vistas de la sección Todas y los archivos abiertos recientemente se muestran en Recomendaciones."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q309
  prompt:
    es: "¿Cuáles de las siguientes vistas puede elegir el usuario en Windows 11 para las aplicaciones instaladas de la sección Todas del menú Inicio?"
  options:
  - id: a
    text:
      es: "Iconos, Listas y Detalles"
  - id: b
    text:
      es: "Categoría, Cuadrícula y Detalles"
  - id: c
    correct: true
    text:
      es: "Categoría, Cuadrícula y Lista"
  - id: d
    text:
      es: "Alfabética, Cuadrícula y Lista"
  explanation:
    es: "La página dice que en Todas se puede elegir entre las vistas Categoría, Cuadrícula y Lista, y que Inicio recuerda la última selección. Iconos, listas y detalles son las vistas del Explorador de archivos, y Detalles y Alfabética no son vistas de esta sección."
  citation: "fuente: `ms-win-menu-inicio.html`; «Personalizar el diseño»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q310
  prompt:
    es: "En el menú Inicio de Windows 11, ¿qué permite hacer el botón de encendido de la sección Cuenta?"
  options:
  - id: a
    text:
      es: "Configurar la cuenta, cambiar de cuenta o cerrar sesión"
  - id: b
    correct: true
    text:
      es: "Bloquear, suspender, apagar o reiniciar el dispositivo"
  - id: c
    text:
      es: "Ver mensajes, llamadas y notificaciones del teléfono"
  - id: d
    text:
      es: "Buscar aplicaciones, archivos y configuraciones por palabras clave"
  explanation:
    es: "La página dice que el botón de encendido permite bloquear, suspender, apagar o reiniciar el dispositivo. Configurar la cuenta, cambiar de cuenta y cerrar sesión corresponde al icono de perfil, ver el contenido del teléfono al compañero de dispositivo móvil y buscar aplicaciones, archivos y configuraciones a la búsqueda."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q311
  prompt:
    es: "En el menú Inicio de Windows 11, ¿para qué sirve el icono de perfil de la sección Cuenta?"
  options:
  - id: a
    correct: true
    text:
      es: "Para acceder a la configuración de la cuenta, cambiar de cuenta o cerrar sesión"
  - id: b
    text:
      es: "Para bloquear, suspender, apagar o reiniciar el dispositivo"
  - id: c
    text:
      es: "Para ver el contenido del teléfono mediante Enlace Móvil"
  - id: d
    text:
      es: "Para encontrar aplicaciones y archivos escribiendo palabras clave"
  explanation:
    es: "La página dice que el icono de perfil da acceso a la configuración de la cuenta, al cambio de cuentas y al cierre de sesión. Bloquear, suspender, apagar o reiniciar es el botón de encendido, el contenido del teléfono es el compañero de dispositivo móvil y escribir palabras clave es la búsqueda."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q312
  prompt:
    es: "En el menú Inicio de Windows 11, ¿qué permite ver el compañero de dispositivo móvil?"
  options:
  - id: a
    text:
      es: "Las aplicaciones agregadas recientemente y usadas con frecuencia en el equipo"
  - id: b
    text:
      es: "La lista alfabética de todas las aplicaciones instaladas"
  - id: c
    text:
      es: "Los archivos abiertos recientemente en las cuentas conectadas"
  - id: d
    correct: true
    text:
      es: "El contenido del teléfono, como mensajes, llamadas y notificaciones"
  explanation:
    es: "La página dice que el compañero de dispositivo móvil permite ver el contenido del teléfono, como mensajes, llamadas y notificaciones, mediante Enlace Móvil. Las aplicaciones recientes y los archivos abiertos recientemente son de Recomendaciones y la lista alfabética es la de Todas las aplicaciones."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q313
  prompt:
    es: "En el menú Inicio de Windows 11, ¿qué encuentra la sección Búsqueda al escribir palabras clave?"
  options:
  - id: a
    text:
      es: "Solo las aplicaciones y los archivos recientes"
  - id: b
    text:
      es: "Solo las páginas web guardadas en Edge"
  - id: c
    text:
      es: "Solo las configuraciones del sistema operativo"
  - id: d
    correct: true
    text:
      es: "Aplicaciones, archivos y configuraciones"
  explanation:
    es: "La página dice que la Búsqueda del menú Inicio encuentra rápidamente aplicaciones, archivos y configuraciones escribiendo palabras clave. Las otras tres opciones la limitan a una parte de esos elementos o la sustituyen por las páginas de Edge."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q314
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones del clic derecho en una aplicación encontrada con el cuadro de búsqueda la ancla al menú Inicio?"
  options:
  - id: a
    text:
      es: "Anclar a la barra de tareas"
  - id: b
    text:
      es: "Anclar a acceso rápido"
  - id: c
    correct: true
    text:
      es: "Anclar a Inicio"
  - id: d
    text:
      es: "Desanclar de Inicio"
  explanation:
    es: "La página dice que, tras escribir el nombre de la aplicación en el cuadro de búsqueda de la barra de tareas o del menú Inicio, se hace clic con el botón derecho y se selecciona Anclar a Inicio. Anclar a la barra de tareas la coloca en la barra, Anclar a acceso rápido es de las carpetas del Explorador y Desanclar de Inicio la quita."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q315
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué se hace con una carpeta para anclarla al menú Inicio?"
  options:
  - id: a
    text:
      es: "Hacer clic con el botón derecho en la carpeta y seleccionar Anclar a acceso rápido"
  - id: b
    correct: true
    text:
      es: "Hacer clic con el botón derecho en la carpeta y seleccionar Anclar a Inicio"
  - id: c
    text:
      es: "Arrastrar la carpeta sobre un elemento anclado del menú Inicio"
  - id: d
    text:
      es: "Abrir Edge y seleccionar Más herramientas › Anclar a Inicio"
  explanation:
    es: "La página dice que, en el Explorador, se hace clic con el botón derecho en una carpeta y se selecciona Anclar a Inicio. Anclar a acceso rápido coloca la carpeta en Acceso rápido, arrastrar un elemento anclado sobre otro crea una carpeta de Inicio y Más herramientas › Anclar a Inicio de Edge es la ruta de los sitios web."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q316
  prompt:
    es: "¿Cuál de las siguientes rutas permite anclar al menú Inicio de Windows 11 un sitio web abierto en Microsoft Edge?"
  options:
  - id: a
    correct: true
    text:
      es: "Menú de más opciones › Más herramientas › Anclar a Inicio"
  - id: b
    text:
      es: "Escribir el nombre del sitio en el cuadro de búsqueda y clic derecho en el resultado › Anclar a Inicio"
  - id: c
    text:
      es: "Clic derecho en una carpeta del Explorador de archivos › Anclar a Inicio"
  - id: d
    text:
      es: "Arrastrar un elemento anclado de Inicio sobre otro"
  explanation:
    es: "La página dice que, para los sitios web, se abre Edge, se navega al sitio y se selecciona el menú de más opciones › Más herramientas › Anclar a Inicio. El clic derecho en el resultado de la búsqueda es el método de las aplicaciones, el clic derecho en una carpeta del Explorador es el de las carpetas y arrastrar un anclado sobre otro crea una carpeta."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q318
  prompt:
    es: "En el menú Inicio de Windows 11, cuando en una carpeta de elementos anclados solo queda un elemento:"
  options:
  - id: a
    text:
      es: "la carpeta se conserva con ese único elemento"
  - id: b
    text:
      es: "el elemento restante se desancla del menú Inicio"
  - id: c
    text:
      es: "la carpeta pasa a la sección Todas"
  - id: d
    correct: true
    text:
      es: "la carpeta se quita del menú Inicio"
  explanation:
    es: "La página dice que, cuando solo queda un pin, la carpeta se quita del menú Inicio. Conservar la carpeta con un único elemento, desanclar el elemento o moverla a Todas contradicen esa frase."
  citation: "fuente: `ms-win-menu-inicio.html`; «Organizar las chinchetas en carpetas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q319
  prompt:
    es: "En el menú Inicio de Windows 11, un elemento anclado se saca de una carpeta de Inicio:"
  options:
  - id: a
    text:
      es: "haciendo clic con el botón derecho en la carpeta y eligiendo Desanclar de Inicio"
  - id: b
    text:
      es: "arrastrando la carpeta sobre otro elemento anclado"
  - id: c
    correct: true
    text:
      es: "abriendo la carpeta y arrastrando el elemento fuera de ella"
  - id: d
    text:
      es: "seleccionando Mostrar todo en la sección Anclados"
  explanation:
    es: "La página dice que, para quitar una chincheta de una carpeta, se abre la carpeta y se arrastra la chincheta fuera de ella. Desanclar de Inicio quita un elemento del menú, arrastrar sobre otro elemento crea una carpeta y Mostrar todo expande la sección Anclados."
  citation: "fuente: `ms-win-menu-inicio.html`; «Organizar las chinchetas en carpetas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q320
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones hay que seleccionar, tras hacer clic con el botón derecho en un elemento anclado, para quitarlo del menú Inicio?"
  options:
  - id: a
    text:
      es: "Desanclar de la barra de tareas"
  - id: b
    correct: true
    text:
      es: "Desanclar de Inicio"
  - id: c
    text:
      es: "Desanclar del acceso rápido"
  - id: d
    text:
      es: "Anclar a Inicio"
  explanation:
    es: "La página dice que, para quitar una aplicación anclada o un acceso directo del menú Inicio, se hace clic con el botón derecho y se selecciona Desanclar de Inicio. Desanclar de la barra de tareas quita un icono de la barra, Desanclar del acceso rápido una carpeta del Acceso rápido y Anclar a Inicio hace lo contrario."
  citation: "fuente: `ms-win-menu-inicio.html`; «Desanclar un elemento del menú Inicio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q321
  prompt:
    es: "En el menú Inicio de Windows 11, el orden de los elementos anclados se cambia:"
  options:
  - id: a
    text:
      es: "seleccionando Mostrar todo en la sección Anclados"
  - id: b
    correct: true
    text:
      es: "arrastrando el elemento desde su posición actual a otra"
  - id: c
    text:
      es: "eligiendo la vista Categoría en la sección Todas"
  - id: d
    text:
      es: "arrastrando el elemento sobre otro elemento anclado"
  explanation:
    es: "La página dice que, para cambiar el orden de las chinchetas, se arrastra la chincheta desde su posición actual a otra. Mostrar todo expande la sección, la vista Categoría es de Todas y arrastrar un elemento sobre otro crea una carpeta."
  citation: "fuente: `ms-win-menu-inicio.html`; «Reorganizar y agrupar las chinchetas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q322
  prompt:
    es: "En el menú Inicio de Windows 11, ¿qué ocurre al seleccionar Mostrar todo en la sección Anclados?"
  options:
  - id: a
    correct: true
    text:
      es: "La sección permanece expandida la próxima vez que se abre Inicio"
  - id: b
    text:
      es: "Se desanclan todas las aplicaciones de la sección"
  - id: c
    text:
      es: "Se ordenan los elementos anclados por orden alfabético"
  - id: d
    text:
      es: "Se muestra la lista de todas las aplicaciones instaladas"
  explanation:
    es: "La página dice que las secciones Anclados y Todas recuerdan la vista que se usó por última vez, de modo que, tras seleccionar Mostrar todo, la sección permanece expandida la próxima vez. La lista de todas las aplicaciones instaladas pertenece a la sección Todas; desanclar elementos o ordenarlos no es lo que la página describe para Mostrar todo."
  citation: "fuente: `ms-win-menu-inicio.html`; «Personalizar el diseño»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l02-q323
  prompt:
    es: "En Windows 11, ¿cómo se eligen las carpetas que aparecen junto al botón de encendido del menú Inicio?"
  options:
  - id: a
    text:
      es: "Con clic derecho en la barra de tareas, Configuración de la barra de tareas y Comportamientos"
  - id: b
    text:
      es: "Con clic derecho en un elemento anclado y Anclar a Inicio"
  - id: c
    text:
      es: "Con clic derecho en una carpeta del Explorador y Anclar a acceso rápido"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en la parte inferior del menú Inicio, Configuración de Inicio y Carpetas"
  explanation:
    es: "La página dice que se selecciona Inicio, se hace clic con el botón derecho en la parte inferior del menú Inicio, se elige Configuración de Inicio y, en Carpetas, se activan las que se quieren junto al botón de Inicio/Apagado. Los comportamientos de la barra de tareas sirven para la alineación, y Anclar a Inicio y Anclar a acceso rápido anclan elementos."
  citation: "fuente: `ms-win-menu-inicio.html`; «Personalizar el área de cuenta»"
