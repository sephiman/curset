# anchor: boe-a-2004-4214-art-2
- id: m03-l01-q0108
  prompt:
    es: "De acuerdo con el artículo 2.1 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, señale la respuesta CORRECTA sobre los recursos que constituyen la hacienda de las entidades locales:"
  options:
  - id: a
    text:
      es: "Está constituida exclusivamente por tributos propios y por participaciones en los tributos del Estado."
  - id: b
    correct: true
    text:
      es: "Incluye los percibidos en concepto de precios públicos y el producto de las operaciones de crédito."
  - id: c
    text:
      es: "Excluye el producto de las operaciones de crédito, que solo puede ser un recurso de las Comunidades Autónomas."
  - id: d
    text:
      es: "Excluye las subvenciones, que solo pueden percibir las Comunidades Autónomas."
  explanation:
    es: "La lista del artículo 2.1 incluye los precios públicos y el producto de las operaciones de crédito, entre otros recursos. No se limita a tributos propios y participaciones. Las operaciones de crédito y las subvenciones figuran en ella, así que no son recursos exclusivos de las Comunidades Autónomas."
  citation: "art. 2.1 TRLRHL"
  difficulty: 3
  tags:
  - "trlrhl"
  - "recursos-locales"
