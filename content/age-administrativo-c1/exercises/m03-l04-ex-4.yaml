    text:
      es: "Se amplían en quince días hábiles."
  explanation:
    es: "El artículo 158.3 dice que los plazos de adjudicación «se ampliarán en quince días hábiles cuando sea necesario seguir los trámites a que se refiere el apartado 4 del artículo 149». La ley dice expresamente «hábiles», así que no son quince días naturales. Los diez días hábiles y el mes no figuran en el artículo."
