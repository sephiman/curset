type: case
title:
  es: "Coedición y archivo en el CEPC"
scenario:
  es: "El Centro de Estudios Políticos y Constitucionales, con sede en Madrid, es un organismo autónomo de la Administración General del Estado. Entre el sábado, 10 de abril de 2027, y el miércoles, 28 de abril de 2027, no cae en Madrid ningún festivo, y los plazos por días hábiles de ese periodo solo excluyen sábados y domingos.\n\nEl miércoles, 3 de febrero de 2027, Don Hipólito Sanchís Ferrer entrega en la oficina de asistencia en materia de registros el original en papel de un manuscrito, que la oficina digitaliza ese día sin poder devolvérselo. El miércoles, 31 de marzo de 2027, presenta por el registro electrónico una solicitud de acceso a un fondo, con un plazo máximo de tres meses para resolverla. El martes, 13 de abril de 2027, el Centro pide a su Asesoría Jurídica informe sobre esa solicitud. El lunes, 1 de marzo de 2027, la editorial Ediciones Valdivia Montoya, S.L. solicita autorización para reproducir fragmentos de otro fondo. El plazo máximo para resolver es de tres meses y el Centro ha agotado sus medios personales y materiales.\n\nEl lunes, 11 de enero de 2027, el Centro firma con el Instituto Nacional de Administración Pública, organismo autónomo, un convenio de coedición de cuatro años de vigencia. Para atender su aportación tramita una transferencia desde una aplicación suplementada en el ejercicio. La presentación de la colección genera atenciones protocolarias por 1.800 euros; el subconcepto 226.01 está agotado y otros subconceptos del concepto 226 conservan saldo.\n\nPara digitalizar el fondo, el Centro tramita por procedimiento abierto, con ofertas electrónicas y solo el precio como criterio, un contrato de servicios por 62.000 euros, sin IVA, y suministro de cajas de conservación por 41.500 euros, sin IVA. Se abren las proposiciones el viernes, 9 de abril de 2027. Antes, ante la Intervención Delegada, su presupuesto base de licitación, de 125.235 euros con IVA, se imputaba a la aplicación 227.06, con 98.000 euros disponibles; el Centro subsanó esa insuficiencia antes de licitar. Formaliza además un contrato menor de traducción de 12.000 euros, IVA excluido, con cargo a una aplicación de 40.000 euros de crédito, cuyos compromisos adquiridos, con ese contrato incluido, suman 26.500 euros.\n\nDoña Estefanía Cuadrado Pinto reclama una indemnización por una caída en la sala de lectura el jueves, 12 de noviembre de 2026, valorada a esa fecha en 54.000 euros. Hasta la resolución, el Índice de Garantía de la Competitividad sube un 4,5 % y el IPC un 3,1 %.\n\nDoña Aurora Santamaría Espejo, funcionaria de carrera del Cuerpo General Administrativo, Subgrupo C1, destinada en el Centro, ocupa desde el lunes, 19 de enero de 2026, otro puesto vacante del propio Centro en comisión de servicios voluntaria. Doña Consuelo Ibarra Paniagua, funcionaria de carrera de ese Cuerpo, presenta el martes, 2 de marzo de 2027, una solicitud de compatibilidad para un segundo puesto de profesora asociada. Don Mauricio Ferrándiz Bustos, funcionario de carrera del Cuerpo General Administrativo, ingresó en 2012, nació el lunes, 9 de abril de 1962, y acredita treinta y nueve años cotizados. Doña Lorenza Pinilla Rueda, viuda de un funcionario de carrera que ingresó en 1988 y se jubiló con 2.480,00 euros mensuales de pensión, solicita la pensión de viudedad, y sus dos hijos, de catorce y diez años, la de orfandad.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2018-16673-art-37
- id: q28
  lesson: m02-l04
  prompt:
    es: "El miércoles, 17 de marzo de 2027, Don Hipólito reclama ante el delegado de protección de datos del Centro, antes de acudir a la Agencia. Según el artículo 37.1 de la Ley Orgánica 3/2018, de 5 de diciembre, ¿hasta qué fecha debe comunicarle su decisión, contando de fecha a fecha?"
  options:
  - id: a
    text:
      es: "El sábado, 17 de abril de 2027."
  - id: b
    text:
      es: "El domingo, 16 de mayo de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 17 de mayo de 2027."
  - id: d
    text:
      es: "El jueves, 17 de junio de 2027."
  explanation:
    es: "Cuando el afectado se dirige al delegado de protección de datos antes de reclamar ante la autoridad, el delegado le comunica la decisión en el plazo máximo de dos meses a contar desde la recepción de la reclamación (art. 37.1 LOPDGDD). Contados de fecha a fecha desde el miércoles, 17 de marzo de 2027, terminan el lunes, 17 de mayo de 2027. La fecha del sábado, 17 de abril de 2027, es un mes, el plazo del artículo 37.2 cuando la autoridad le remite la reclamación. La del domingo, 16 de mayo de 2027, cuenta sesenta días, y los dos meses no son dos períodos de treinta días. La del jueves, 17 de junio de 2027, suma tres meses, que la ley no prevé."
  citation: "art. 37.1 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: q02
  lesson: m03-l03
  prompt:
    es: "¿En qué fecha termina el plazo máximo de tres meses que tiene el Centro para resolver la solicitud de acceso al fondo del archivo de Don Hipólito?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles, 30 de junio de 2027."
  - id: b
    text:
      es: "El martes, 29 de junio de 2027."
  - id: c
    text:
      es: "El jueves, 1 de julio de 2027."
  - id: d
    text:
      es: "El miércoles, 23 de junio de 2027."
  explanation:
    es: "Los plazos por meses se cuentan desde el día siguiente a aquel en que tiene lugar la presentación y concluyen el mismo día del mes de vencimiento. Si ese mes no tiene día equivalente, el plazo expira el último día del mes (art. 30.4 LPAC). La solicitud entra el miércoles, 31 de marzo de 2027, y tres meses después, junio no tiene día 31. El plazo termina el último día de junio, el miércoles, 30 de junio de 2027, que es hábil. La fecha del martes, 29 de junio de 2027, cuenta 90 días, y los meses no son períodos de treinta días. La del jueves, 1 de julio de 2027, pasa a julio, aunque la norma lo impide. La del miércoles, 23 de junio de 2027, cuenta doce semanas."
  citation: "art. 30.4 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-23
- id: q03
  lesson: m03-l03
  prompt:
    es: "Según el artículo 23 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede ampliarse, como máximo, el plazo para resolver la solicitud de la editorial?"
  options:
  - id: a
    text:
      es: "El martes, 1 de junio de 2027."
  - id: b
    text:
      es: "El viernes, 16 de julio de 2027."
  - id: c
    text:
      es: "El miércoles, 1 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 1 de septiembre de 2027."
  explanation:
    es: "Cuando se han agotado los medios personales y materiales, el órgano competente puede acordar de manera motivada la ampliación del plazo máximo, que no puede ser superior al establecido para la tramitación del procedimiento (art. 23 LPAC). El plazo de tres meses desde el lunes, 1 de marzo de 2027, termina el martes, 1 de junio de 2027. La ampliación máxima es de otros tres meses, y llega al miércoles, 1 de septiembre de 2027. La fecha del martes, 1 de junio de 2027, es la del plazo sin ampliar. La del viernes, 16 de julio de 2027, suma solo la mitad del plazo, que es el límite de la ampliación de plazos del artículo 32, no el de este artículo. La del miércoles, 1 de diciembre de 2027, suma seis meses, el doble del límite."
  citation: "art. 23 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-80
- id: q04
  lesson: m03-l03
  prompt:
    es: "Señale hasta qué fecha debe emitir su informe la Asesoría Jurídica del Centro sobre la solicitud de acceso, si ninguna disposición fija otro plazo:"
  options:
  - id: a
    text:
      es: "El viernes, 23 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 27 de abril de 2027."
  - id: c
    text:
      es: "El lunes, 26 de abril de 2027."
  - id: d
    text:
      es: "El miércoles, 28 de abril de 2027."
  explanation:
    es: "Los informes se emiten en el plazo de diez días, salvo que una disposición o el resto de los plazos del procedimiento exija otro (art. 80.2 LPAC). Los días son hábiles, sin sábados ni domingos, y se cuentan desde el día siguiente a la petición del martes, 13 de abril de 2027. El décimo día hábil es el martes, 27 de abril de 2027. La fecha del viernes, 23 de abril de 2027, cuenta diez días naturales. La del lunes, 26 de abril de 2027, cuenta como primer día el de la petición. La del miércoles, 28 de abril de 2027, es el undécimo día hábil."
  citation: "art. 80.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10566-art-51
- id: q05
  lesson: m03-l03
  prompt:
    es: "Si, al cumplirse los cuatro años de vigencia del convenio con el Instituto Nacional de Administración Pública, los firmantes no han acordado su prórroga, ¿qué efecto prevé la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "El convenio se prorroga tácitamente por otros cuatro años, que es el máximo de prórroga que permite la ley."
  - id: b
    text:
      es: "El convenio sigue vigente hasta que uno de los firmantes comunique por escrito que desea resolverlo."
  - id: c
    correct: true
    text:
      es: "El convenio incurre en causa de resolución, por haber transcurrido su plazo de vigencia sin prórroga."
  - id: d
    text:
      es: "El convenio solo se extingue si un órgano judicial declara su nulidad, porque la ley no admite otras causas."
  explanation:
    es: "El transcurso del plazo de vigencia del convenio sin haberse acordado la prórroga es una de las causas de resolución (art. 51.2.a) LRJSP). La prórroga exige acuerdo unánime de los firmantes, y la ley no la presume. El convenio no sigue vigente hasta que alguien lo denuncie. Tampoco la nulidad judicial es la única causa, porque es una más de la lista, junto con el acuerdo unánime, el incumplimiento y las que prevean el convenio u otras leyes."
  citation: "art. 51.2 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2017-12902-art-18
- id: q06
  lesson: m03-l04
  prompt:
    es: "Según el artículo 18.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué normas rigen la adjudicación del contrato de digitalización, que incluye también el suministro de cajas de conservación?"
  options:
  - id: a
    correct: true
    text:
      es: "Las del contrato de servicios, porque su valor estimado es mayor que el del suministro de cajas."
  - id: b
    text:
      es: "Las del contrato de suministro, porque las cajas son bienes muebles que el contratista entrega al Centro."
  - id: c
    text:
      es: "Las del contrato de suministro, porque su valor estimado es mayor que el de los servicios de digitalización."
  - id: d
    text:
      es: "Las que elija el órgano de contratación en el pliego, porque la ley no fija una regla para estos contratos."
  explanation:
    es: "Cuando un contrato mixto reúne servicios y suministros, el objeto principal se determina por el mayor de los valores estimados (art. 18.1.a) LCSP). Los servicios valen 62.000 euros y el suministro 41.500 euros, así que rigen las normas del contrato de servicios. Que las cajas sean bienes muebles no cambia la regla, que mira el valor y no la naturaleza de cada prestación. La opción que da la mayor cuantía al suministro parte de una cifra falsa. El pliego tampoco puede elegir, porque la ley fija el criterio."
  citation: "art. 18.1.a) LCSP"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2017-12902-art-158
- id: q07
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué fecha debe recaer la adjudicación del contrato de digitalización, como máximo, según el artículo 158.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El sábado, 24 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 23 de abril de 2027."
  - id: c
    text:
      es: "El viernes, 30 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 26 de abril de 2027."
  explanation:
    es: "Si el único criterio de adjudicación es el precio, la adjudicación debe recaer en quince días como máximo desde el siguiente a la apertura de las proposiciones (art. 158.1 LCSP). Los plazos por días de la ley son naturales, salvo que se indique que son hábiles (disposición adicional duodécima LCSP). Desde el viernes, 9 de abril de 2027, el decimoquinto día natural es el sábado, 24 de abril de 2027. Ese día es inhábil y el plazo pasa al primer día hábil, el lunes, 26 de abril de 2027. La fecha del sábado, 24 de abril de 2027, no traslada el último día inhábil. La del viernes, 23 de abril de 2027, cuenta como primer día el de la apertura. La del viernes, 30 de abril de 2027, cuenta quince días hábiles."
  citation: "art. 158.1 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-29
- id: q08
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 29.8 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el contrato menor de traducción de los textos de la colección tiene una duración máxima de:"
  options:
  - id: a
    text:
      es: "Un año, prorrogable por otro si lo acuerda el órgano de contratación."
  - id: b
    correct: true
    text:
      es: "Un año como máximo, sin que quepa prórroga alguna del contrato."
  - id: c
    text:
      es: "Dos años, incluida una prórroga, como los contratos de servicios de prestación sucesiva."
  - id: d
    text:
      es: "Cinco años, incluidas las prórrogas, como los contratos de servicios de prestación sucesiva."
  explanation:
    es: "Los contratos menores, definidos en el artículo 118.1, no pueden durar más de un año ni prorrogarse (art. 29.8 LCSP). El de traducción vale 12.000 euros sin IVA, por debajo de los 15.000 euros de los servicios, así que es menor. La opción que permite una prórroga la admite sin base. Los cinco años son el máximo, con prórrogas, de los servicios de prestación sucesiva, que sigue otro régimen. Los dos años mezclan ambas reglas."
  citation: "art. 29.8 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-34
- id: q09
  lesson: m03-l06
  prompt:
    es: "Si el Centro estima íntegramente la reclamación de Doña Estefanía, ¿qué cuantía de indemnización, sin contar intereses, procede conforme al artículo 34.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "56.430,00 euros, la cuantía de la caída actualizada con el Índice de Garantía de la Competitividad."
  - id: b
    text:
      es: "55.674,00 euros, la cuantía de la caída actualizada con el Índice de Precios de Consumo."
  - id: c
    text:
      es: "54.000,00 euros, la cuantía de la fecha de la caída sin actualizar."
  - id: d
    text:
      es: "58.104,00 euros, la cuantía de la caída actualizada con la suma del Índice de Garantía y el Índice de Precios de Consumo."
  explanation:
    es: "La indemnización se calcula con referencia al día en que se produjo la lesión y se actualiza a la fecha en que termina el procedimiento con el Índice de Garantía de la Competitividad que fija el INE (art. 34.3 LRJSP). Son 54.000 euros por 1,045, es decir, 56.430,00 euros. La cifra de 55.674,00 euros usa el IPC, que la ley no prevé. La de 54.000,00 euros no actualiza nada. La de 58.104,00 euros suma los dos índices, cuando solo cuenta el de garantía."
  citation: "art. 34.3 LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-67
- id: q22
  lesson: m04-l04
  prompt:
    es: "Según el artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿hasta qué fecha, como máximo, puede Don Mauricio prolongar su permanencia en el servicio activo, si lo solicita y la Administración lo acepta?"
  options:
  - id: a
    text:
      es: "El viernes, 9 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 9 de abril de 2032."
  - id: c
    text:
      es: "El lunes, 9 de abril de 2029."
  - id: d
    text:
      es: "El viernes, 31 de diciembre de 2032."
  explanation:
    es: "La jubilación forzosa se declara de oficio a los sesenta y cinco años, pero cabe solicitar la prolongación de la permanencia en el servicio activo como máximo hasta que se cumplan setenta años (art. 67.3 TREBEP). Don Mauricio nació el lunes, 9 de abril de 1962, y cumple setenta años el viernes, 9 de abril de 2032. La fecha del viernes, 9 de abril de 2027, es la de los sesenta y cinco años, la edad de la jubilación forzosa sin prolongación. La del lunes, 9 de abril de 2029, corresponde a los sesenta y siete, edad que la norma no fija como tope de la prolongación. La del viernes, 31 de diciembre de 2032, lleva el límite al fin del año en que cumple los setenta, y la norma habla de que se cumpla esa edad."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-11719-art-63
- id: q11
  lesson: m04-l04
  prompt:
    es: "¿Qué efecto tiene su jubilación forzosa sobre la condición de funcionario de Don Mauricio, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre?"
  options:
  - id: a
    text:
      es: "La conserva, y pasa a la situación de excedencia voluntaria por interés particular hasta que pida el reingreso."
  - id: b
    text:
      es: "La conserva, y pasa a la situación de servicios especiales mientras perciba la pensión de jubilación."
  - id: c
    text:
      es: "La pierde solo si renuncia por escrito a la condición y la Administración acepta expresamente la renuncia."
  - id: d
    correct: true
    text:
      es: "La pierde, porque la jubilación total es causa de pérdida de la condición de funcionario de carrera."
  explanation:
    es: "La jubilación total del funcionario es una de las causas de pérdida de la condición de funcionario de carrera (art. 63.c) TREBEP). Don Mauricio deja de ser funcionario cuando se jubila. No queda en excedencia ni en servicios especiales, que son situaciones de quien conserva la condición. La renuncia es otra causa distinta y la lista no la exige para la jubilación."
  citation: "art. 63 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-64
- id: q23
  lesson: m04-l05
  prompt:
    es: "Conforme al Real Decreto 364/1995, de 10 de marzo, ¿qué órgano acuerda la comisión de servicios con la que Doña Aurora ocupa el puesto vacante del Centro?"
  options:
  - id: a
    text:
      es: "El Subsecretario del Departamento ministerial al que está adscrito el Centro, respecto de sus organismos autónomos."
  - id: b
    text:
      es: "La Secretaría de Estado de Función Pública, previo informe del Departamento de procedencia de la funcionaria."
  - id: c
    correct: true
    text:
      es: "El Presidente o Director del organismo autónomo, respecto de los funcionarios destinados en él."
  - id: d
    text:
      es: "El Delegado del Gobierno en la Comunidad de Madrid, previo informe del Departamento de procedencia."
  explanation:
    es: "Las comisiones de servicios las acuerdan, entre otros órganos, los Presidentes o Directores de los organismos autónomos respecto de los funcionarios destinados en ellos (art. 64.3.c) RD 364/1995). Doña Aurora está destinada en el Centro, un organismo autónomo, y el puesto vacante es del propio Centro. La comisión no cambia de Departamento ministerial ni sale del organismo. El Subsecretario acuerda las comisiones entre el Departamento y sus organismos autónomos, que no es el caso. La Secretaría de Estado de Función Pública interviene si la comisión cambia de Departamento ministerial, y el Delegado del Gobierno si se produce entre servicios de distintos Departamentos, y ninguna de esas situaciones se da."
  citation: "art. 64.3 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-64
- id: q24
  lesson: m04-l05
  prompt:
    es: "Conforme al Real Decreto 364/1995, de 10 de marzo, ¿en qué supuesto puede el Centro cubrir en comisión de servicios voluntaria, con Doña Aurora, el puesto que ha quedado vacante?"
  options:
  - id: a
    correct: true
    text:
      es: "En caso de urgente e inaplazable necesidad, con un funcionario que reúna los requisitos que fija la relación de puestos."
  - id: b
    text:
      es: "Cuando el concurso convocado para proveerlo se ha declarado desierto y su provisión es urgente para el servicio."
  - id: c
    text:
      es: "Siempre que el funcionario lo pida, aunque no reúna los requisitos que la relación de puestos fija para el puesto."
  - id: d
    text:
      es: "Solo si el puesto ha quedado vacante por cese discrecional de quien lo ocupaba con carácter definitivo por libre designación."
  explanation:
    es: "Un puesto que queda vacante puede cubrirse, en caso de urgente e inaplazable necesidad, en comisión de servicios de carácter voluntario con un funcionario que reúna los requisitos que la relación de puestos de trabajo establece para su desempeño (art. 64.1 RD 364/1995). La declaración de concurso desierto es el supuesto de la comisión de servicios forzosa, que regula otro apartado del mismo artículo. La petición del funcionario no basta si no reúne los requisitos del puesto. El cese discrecional de quien lo ocupaba lleva a la adscripción provisional de este, no a la comisión de servicios voluntaria."
  citation: "art. 64.1 RD 364/1995"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1985-7820-art-5
- id: q14
  lesson: m04-l06
  prompt:
    es: "Según el artículo 5 del Real Decreto 598/1985, de 30 de abril, sobre incompatibilidades del personal al servicio de la Administración del Estado, de la Seguridad Social y de los Entes, Organismos y Empresas dependientes, ¿hasta qué fecha, con la prórroga máxima, puede resolverse la solicitud de Doña Consuelo?"
  options:
  - id: a
    text:
      es: "El miércoles, 2 de junio de 2027."
  - id: b
    text:
      es: "El lunes, 2 de agosto de 2027."
  - id: c
    text:
      es: "El jueves, 2 de septiembre de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes, 2 de julio de 2027."
  explanation:
    es: "La autorización de compatibilidad de un segundo puesto en el sector público se resuelve en tres meses desde la presentación de la solicitud, y el plazo puede prorrogarse, con resolución motivada, un período no superior a un mes (art. 5 RD 598/1985). Tres meses desde el martes, 2 de marzo de 2027, terminan el miércoles, 2 de junio de 2027, y un mes más lleva al viernes, 2 de julio de 2027. La fecha del miércoles, 2 de junio de 2027, no cuenta la prórroga. La del lunes, 2 de agosto de 2027, suma dos meses de prórroga, y la norma admite uno. La del jueves, 2 de septiembre de 2027, suma tres, que es lo que dura el plazo ordinario."
  citation: "art. 5 RD 598/1985"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1987-12636-art-42
- id: q25
  lesson: m04-l07
  prompt:
    es: "Conforme al artículo 42.2 del texto refundido de la Ley de Clases Pasivas del Estado, aprobado por el Real Decreto Legislativo 670/1987, de 30 de abril, ¿qué pensión de orfandad corresponde a cada uno de los dos hijos menores de Doña Lorenza?"
  options:
  - id: a
    text:
      es: "248,00 euros mensuales, el 10 por 100 de la base reguladora sin ningún prorrateo."
  - id: b
    correct: true
    text:
      es: "434,00 euros mensuales, el 10 por 100 más la mitad del 15 por 100 de la base reguladora."
  - id: c
    text:
      es: "620,00 euros mensuales, el 25 por 100 que corresponde cuando solo hay un hijo con derecho."
  - id: d
    text:
      es: "372,00 euros mensuales, el 15 por 100 de la base reguladora entero para cada uno de los hijos."
  explanation:
    es: "La base reguladora de la pensión de orfandad es la pensión de jubilación del fallecido, 2.480,00 euros. Con varios hijos con derecho, cada pensión es el 10 por 100 de la base, a lo que se suma el prorrateo por cabeza de un único 15 por 100 (art. 42.2 TRLCPE). Son 248,00 euros más la mitad de 372,00 euros, es decir, 434,00 euros para cada hijo. La cifra de 248,00 euros olvida el prorrateo. La de 620,00 euros es el 25 por 100 de un hijo único, y aquí son dos. La de 372,00 euros da a cada hijo el 15 por 100 entero, cuando ese porcentaje se reparte entre todos."
  citation: "art. 42.2 TRLCPE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-52
- id: q16
  lesson: m05-l02
  prompt:
    es: "¿Puede la transferencia de crédito que tramita el Centro para su aportación al convenio minorar la aplicación suplementada en el ejercicio, según el artículo 52.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "No, porque las transferencias no minoran créditos que se hayan suplementado en el ejercicio."
  - id: b
    correct: true
    text:
      es: "Sí, porque la restricción no alcanza a las transferencias derivadas de convenios entre organismos autónomos."
  - id: c
    text:
      es: "No, porque las transferencias no pueden realizarse entre créditos de distintas secciones presupuestarias."
  - id: d
    text:
      es: "Sí, porque la restricción solo afecta a los créditos ampliados y no a los suplementados."
  explanation:
    es: "Las transferencias no pueden minorar créditos que se hayan suplementado en el ejercicio (art. 52.1.c) LGP), pero esas restricciones no afectan a las que se deriven de convenios entre departamentos ministeriales, órganos del Estado con sección diferenciada u organismos autónomos (art. 52.2 LGP). El convenio es entre dos organismos autónomos, así que la excepción alcanza a la transferencia. Las dos opciones que dicen que no se apoyan en restricciones del artículo 52.1, que la excepción deja sin efecto. La que limita la regla a los créditos ampliados altera el texto, que incluye los suplementados."
  citation: "art. 52.2 LGP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-44
- id: q17
  lesson: m05-l02
  prompt:
    es: "Señale si el Centro puede atender los gastos de la presentación de la colección con el saldo de otros subconceptos del concepto 226, conforme al artículo 44.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el crédito de atenciones protocolarias y representativas se especifica al nivel de su concreta clasificación económica."
  - id: b
    text:
      es: "Sí, porque en un organismo autónomo los créditos vinculan a nivel de concepto y todos los subconceptos son del concepto 226."
  - id: c
    text:
      es: "Sí, porque los gastos corrientes en bienes y servicios de un organismo autónomo vinculan a nivel de capítulo."
  - id: d
    text:
      es: "No, porque en un organismo autónomo todos los créditos se especifican siempre a nivel de subconcepto."
  explanation:
    es: "En los organismos autónomos los créditos se especifican a nivel de concepto, o de capítulo en gastos corrientes en bienes y servicios, personal e inversiones reales (art. 44.1 LGP). Los destinados a atenciones protocolarias y representativas se especifican al nivel de su concreta clasificación económica (art. 44.2.a) LGP). El subconcepto 226.01 vincula por sí solo, y el saldo de otros subconceptos no lo cubre. Las dos opciones afirmativas aplican la regla general, que el artículo 44.2 exceptúa. La opción que lleva todos los créditos al subconcepto exagera la regla."
  citation: "art. 44.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2003-21614-art-56
- id: q29
  lesson: m05-l02
  prompt:
    es: "Con un suplemento de crédito, ¿qué importe de la insuficiencia de la aplicación 227.06 puede financiar el Centro, según el artículo 56.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, con 140.000 euros de remanente de tesorería, 120.000 aplicados, y 3.500 de mayores ingresos?"
  options:
  - id: a
    text:
      es: "27.235,00 euros, toda la insuficiencia de la aplicación."
  - id: b
    text:
      es: "123.500,00 euros, lo aplicado más los mayores ingresos."
  - id: c
    correct: true
    text:
      es: "23.500,00 euros, el remanente no aplicado más los mayores ingresos."
  - id: d
    text:
      es: "143.500,00 euros, todo el remanente más los mayores ingresos."
  explanation:
    es: "Los suplementos de crédito de un organismo autónomo solo se financian con la parte del remanente de tesorería no aplicada en su presupuesto o con mayores ingresos sobre los previstos (art. 56.2 LGP). El remanente no aplicado es 140.000 − 120.000 = 20.000 euros, que con los 3.500 euros de mayores ingresos suman 23.500,00 euros, menos que la insuficiencia de 125.235 − 98.000 = 27.235 euros, así que financian esa cifra. Los 27.235,00 euros son la insuficiencia, que los recursos no cubren entera. Los 143.500,00 euros cuentan todo el remanente, incluida la parte ya aplicada. Los 123.500,00 euros suman justo esa parte aplicada, que la ley excluye."
  citation: "art. 56.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "financiación"
# anchor: boe-a-2003-21614-art-154
- id: q19
  lesson: m05-l03
  prompt:
    es: "Ante el expediente del contrato de digitalización, ¿qué debe hacer la Intervención Delegada, según el artículo 154.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Fiscalizar de conformidad el expediente y dejar que el Centro tramite después la modificación del crédito."
  - id: b
    text:
      es: "Plantear discrepancia ante la Intervención General de la Administración del Estado, por conducto del Centro."
  - id: c
    text:
      es: "Devolver el expediente sin reparo por escrito, porque la insuficiencia de crédito no es motivo de reparo."
  - id: d
    correct: true
    text:
      es: "Formular reparo por escrito por insuficiencia de crédito, con lo que se suspende la tramitación del expediente."
  explanation:
    es: "Con el régimen general de fiscalización previa, procede el reparo cuando se base en la insuficiencia de crédito (art. 154.2.a) LGP). El presupuesto de 125.235 euros supera los 98.000 disponibles, y el reparo se formula por escrito y suspende la tramitación hasta que se subsane (art. 154.1 LGP). Fiscalizar de conformidad ignora la insuficiencia. La discrepancia la plantea el órgano gestor que no acepta el reparo, no la Intervención. Devolver el expediente sin reparo contradice el texto, que lo prevé por esta causa."
  citation: "art. 154.2 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2003-21614-art-148
- id: q27
  lesson: m05-l03
  prompt:
    es: "Conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué momento ejerce la Intervención Delegada la función interventora sobre el gasto del contrato de digitalización del fondo, que no es un contrato menor?"
  options:
  - id: a
    correct: true
    text:
      es: "Antes de que se apruebe el gasto, para asegurar que su gestión se ajusta a las disposiciones aplicables."
  - id: b
    text:
      es: "Después de recibida la prestación, mediante la auditoría pública de regularidad contable, de cumplimiento u operativa."
  - id: c
    text:
      es: "Durante la ejecución del contrato, de forma continua, mediante el control financiero permanente."
  - id: d
    text:
      es: "Al rendirse las cuentas, cuando la Intervención General las remite al Tribunal de Cuentas."
  explanation:
    es: "La función interventora controla los actos que den lugar a la realización de gastos antes de que sean aprobados, con el fin de asegurar que su gestión se ajuste a las disposiciones aplicables (art. 148 LGP). El contrato de digitalización se licita por procedimiento abierto y no es un contrato menor, así que el expediente pasa por esa fiscalización previa. La auditoría pública es una verificación posterior y sistemática, no previa. El control financiero permanente es continuo y no precede a la aprobación. La rendición de cuentas al Tribunal de Cuentas pertenece al control externo y llega después de la ejecución."
  citation: "art. 148 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "plazo"
