# anchor: boe-a-2002-9969-art-1
- id: m03-l01-q0079
  prompt:
    es: "Según el artículo 1.Uno de la Ley 12/2002, de 23 de mayo, por la que se aprueba el Concierto Económico con la Comunidad Autónoma del País Vasco, ¿qué pueden hacer las Instituciones competentes de los Territorios Históricos dentro de su territorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Mantener, establecer y regular su régimen tributario."
  - id: b
    text:
      es: "Mantener su régimen tributario, pero no establecerlo ni regularlo sin autorización del Estado."
  - id: c
    text:
      es: "Establecer y regular el régimen tributario del Estado en su territorio."
  - id: d
    text:
      es: "Regular únicamente los tributos locales de su territorio."
  explanation:
    es: "Las Instituciones competentes de los Territorios Históricos pueden mantener, establecer y regular su régimen tributario. Condicionar establecer y regular a la autorización del Estado reduce esa potestad. Regular el régimen tributario del Estado no es su función. Limitarse a los tributos locales recorta el alcance del precepto."
  citation: "art. 1.Uno Concierto Económico"
  difficulty: 1
  tags:
  - "concierto"
  - "régimen-foral"
# anchor: boe-a-2002-9969-art-1
- id: m03-l01-q0080
  prompt:
    es: "De acuerdo con el artículo 1.Dos de la Ley 12/2002, de 23 de mayo, por la que se aprueba el Concierto Económico con la Comunidad Autónoma del País Vasco, la exacción, gestión, liquidación, inspección, revisión y recaudación de los tributos que integran el sistema tributario de los Territorios Históricos corresponde:"
  options:
  - id: a
    correct: true
    text:
      es: "A las respectivas Diputaciones Forales."
  - id: b
    text:
      es: "A la Agencia Estatal de Administración Tributaria en cada Territorio Histórico."
  - id: c
    text:
      es: "Al Gobierno Vasco, que la ejerce desde sus órganos centrales."
  - id: d
    text:
      es: "A los ayuntamientos de cada Territorio Histórico en el ámbito de sus competencias."
  explanation:
    es: "Esas funciones corresponden a las respectivas Diputaciones Forales. La Agencia Estatal no las ejerce en el sistema tributario de los Territorios Históricos. El Gobierno Vasco no es el titular que señala el precepto, y los ayuntamientos tampoco."
  citation: "art. 1.Dos Concierto Económico"
  difficulty: 1
  tags:
  - "concierto"
  - "régimen-foral"
# anchor: boe-a-1990-31117-art-1
- id: m03-l01-q0081
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 28/1990, de 26 de diciembre, por la que se aprueba el Convenio Económico entre el Estado y la Comunidad Foral de Navarra, en virtud de su régimen foral, Navarra tiene potestad para:"
  options:
  - id: a
    text:
      es: "Mantener su régimen tributario, pero solo regular los tributos de titularidad local."
  - id: b
    text:
      es: "Establecer y regular tributos, pero sin poder mantener su régimen tributario anterior."
  - id: c
    text:
      es: "Recaudar los tributos del Estado en su territorio por delegación de este."
  - id: d
    correct: true
    text:
      es: "Mantener, establecer y regular su propio régimen tributario."
  explanation:
    es: "Navarra tiene potestad para mantener, establecer y regular su propio régimen tributario. Restringirla a los tributos locales la recorta, y excluir el mantenimiento rompe la fórmula de las tres facultades. La recaudación por delegación del Estado es una figura distinta, la de las Comunidades de régimen común, y no la del régimen foral."
  citation: "art. 1 Convenio Económico"
  difficulty: 1
  tags:
  - "convenio"
  - "régimen-foral"
# anchor: boe-a-1978-31229-art-157
- id: m03-l01-q0096
  prompt:
    es: "De acuerdo con el artículo 157.2 de la Constitución Española, las Comunidades Autónomas no podrán en ningún caso adoptar medidas tributarias sobre bienes situados fuera de su territorio o que supongan obstáculo para:"
  options:
  - id: a
    text:
      es: "El ejercicio de las competencias del Estado en materia tributaria."
  - id: b
    text:
      es: "La coordinación con la Hacienda estatal en la recaudación de tributos."
  - id: c
    text:
      es: "La igualdad de los españoles en el ejercicio de sus derechos tributarios."
  - id: d
    correct: true
    text:
      es: "La libre circulación de mercancías o servicios."
  explanation:
    es: "El segundo límite del artículo 157.2 son las medidas que obstaculicen la libre circulación de mercancías o servicios. Las competencias tributarias del Estado, la coordinación en la recaudación y la igualdad en los derechos tributarios no son límites que el precepto enuncie en esos términos."
  citation: "art. 157.2 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "límites-ccaa"
# anchor: boe-a-1980-21166-art-2
- id: m03-l01-q0097
  prompt:
    es: "De acuerdo con el artículo 2.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, la actividad financiera de las Comunidades Autónomas se ejerce en coordinación con:"
  options:
  - id: a
    text:
      es: "El Consejo de Política Fiscal y Financiera, que fija cada año los principios aplicables."
  - id: b
    correct: true
    text:
      es: "La Hacienda del Estado, con arreglo a los principios que el propio artículo enumera."
  - id: c
    text:
      es: "Las Corporaciones locales de su territorio, con arreglo a sus ordenanzas."
  - id: d
    text:
      es: "Las Cortes Generales, que aprueban anualmente los principios aplicables."
  explanation:
    es: "La coordinación es con la Hacienda del Estado, y los principios los enumera la propia ley en ese artículo. El Consejo de Política Fiscal y Financiera existe para la coordinación, pero no fija los principios cada año. Las ordenanzas locales no establecen principios de la actividad financiera autonómica. Las Cortes Generales no los aprueban anualmente."
  citation: "art. 2.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "principios"
# anchor: boe-a-1980-21166-art-6
- id: m03-l01-q0098
  prompt:
    es: "De acuerdo con el artículo 6.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, las Comunidades Autónomas podrán establecer y exigir sus propios tributos de acuerdo con:"
  options:
  - id: a
    text:
      es: "La Constitución y los acuerdos del Consejo de Política Fiscal."
  - id: b
    text:
      es: "Las Leyes del Estado, sin sujeción a la Constitución."
  - id: c
    text:
      es: "La Constitución y las normas de las Corporaciones locales."
  - id: d
    correct: true
    text:
      es: "La Constitución y las Leyes."
  explanation:
    es: "Los tributos propios se establecen y exigen de acuerdo con la Constitución y las Leyes. Los acuerdos del Consejo de Política Fiscal no son fuente normativa a ese efecto, ni se prescinde de la Constitución, ni las normas locales fijan el marco de los tributos autonómicos."
  citation: "art. 6.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "tributos-propios"
# anchor: boe-a-1978-31229-art-157
- id: m03-l01-q0102
  prompt:
    es: "De acuerdo con el artículo 157.1 de la Constitución Española, señale la respuesta CORRECTA sobre los recursos de las Comunidades Autónomas:"
  options:
  - id: a
    text:
      es: "Entre sus recursos figuran los rendimientos procedentes del patrimonio del Estado situado en su territorio."
  - id: b
    correct: true
    text:
      es: "Entre sus recursos figuran los rendimientos procedentes de su patrimonio e ingresos de derecho privado."
  - id: c
    text:
      es: "Entre sus recursos figuran los ingresos de derecho público procedentes de la gestión del dominio público estatal."
  - id: d
    text:
      es: "Entre sus recursos figuran las transferencias de un Fondo de Compensación interterritorial, con exclusión de otras asignaciones con cargo a los Presupuestos Generales del Estado."
  explanation:
    es: "La letra d) del artículo 157.1 incluye los rendimientos procedentes del patrimonio de la propia Comunidad y sus ingresos de derecho privado. Los rendimientos del patrimonio del Estado y los ingresos por la gestión del dominio público estatal pertenecen al Estado. La letra c) menciona las transferencias de un Fondo de Compensación interterritorial y otras asignaciones con cargo a los Presupuestos Generales del Estado, sin excluir estas últimas."
  citation: "art. 157.1 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "recursos-ccaa"
# anchor: boe-a-2009-20375-art-25
- id: m03-l01-q0106
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 22/2009, de 18 de diciembre, por la que se regula el sistema de financiación de las Comunidades Autónomas de régimen común y Ciudades con Estatuto de Autonomía, señale la afirmación INCORRECTA sobre los tributos cuyo rendimiento se cede a las Comunidades Autónomas:"
  options:
  - id: a
    correct: true
    text:
      es: "Se cede el rendimiento total o parcial en su territorio del Impuesto sobre Sociedades."
  - id: b
    text:
      es: "Se cede el rendimiento total o parcial en su territorio del Impuesto sobre el Valor Añadido."
  - id: c
    text:
      es: "Se cede el rendimiento total o parcial en su territorio del Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados."
  - id: d
    text:
      es: "Se cede el rendimiento total o parcial en su territorio del Impuesto sobre Sucesiones y Donaciones."
  explanation:
    es: "El Impuesto sobre Sociedades no figura en la lista del artículo 25.1, de modo que la afirmación sobre su cesión es la incorrecta. El IVA, el Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados y el de Sucesiones y Donaciones sí están en ella."
  citation: "art. 25.1 Ley 22/2009"
  difficulty: 2
  tags:
  - "ley-22-2009"
  - "cesión"
# anchor: boe-a-1980-21166-art-4
- id: m03-l01-q0111
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los recargos como recurso de las Comunidades Autónomas recoge el artículo 4.Uno de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Entre sus recursos figuran los recargos que pudieran establecerse sobre los tributos de las Corporaciones locales."
  - id: b
    correct: true
    text:
      es: "Entre sus recursos figuran los recargos que pudieran establecerse sobre los tributos del Estado."
  - id: c
    text:
      es: "Entre sus recursos figuran los recargos que pudieran establecerse sobre los tributos de otras Comunidades Autónomas."
  - id: d
    text:
      es: "Entre sus recursos figuran los recargos que pudieran establecerse sobre los tributos de las Diputaciones Forales."
  explanation:
    es: "Los recargos que pueden establecerse recaen sobre los tributos del Estado. Los tributos de las Corporaciones locales, de otras Comunidades Autónomas y de las Diputaciones Forales no son la base de esos recargos según el precepto."
  citation: "art. 4.Uno LOFCA"
  difficulty: 2
  tags:
  - "lofca"
  - "recursos-ccaa"
# anchor: boe-a-2004-4214-art-2
- id: m03-l01-q0083
  prompt:
    es: "¿Cuál de los siguientes es un recurso de la hacienda de las entidades locales según el artículo 2.1 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales?"
  options:
  - id: a
    text:
      es: "Las participaciones en los tributos de las comunidades autónomas, pero no en los del Estado."
  - id: b
    text:
      es: "Los recargos exigibles sobre los impuestos del Estado."
  - id: c
    text:
      es: "El producto de las multas y sanciones en el ámbito de las competencias de otras Administraciones."
  - id: d
    correct: true
    text:
      es: "Las participaciones en los tributos del Estado y de las comunidades autónomas."
  explanation:
    es: "La letra c) del artículo 2.1 incluye las participaciones en los tributos del Estado y de las comunidades autónomas. Excluir los del Estado la recorta. Los recargos que cita la ley son los exigibles sobre los impuestos de las comunidades autónomas o de otras entidades locales, no sobre los del Estado. Las multas y sanciones que forman parte de la hacienda local son las de sus propias competencias."
  citation: "art. 2.1 TRLRHL"
  difficulty: 2
  tags:
  - "trlrhl"
  - "recursos-locales"
# anchor: boe-a-2004-4214-art-2
- id: m03-l01-q0084
  prompt:
    es: "De acuerdo con el artículo 2.1 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, señale la respuesta CORRECTA sobre los tributos propios que integran la hacienda de las entidades locales:"
  options:
  - id: a
    text:
      es: "Son los tributos propios clasificados en tasas, contribuciones especiales e impuestos y los recargos exigibles sobre los impuestos del Estado."
  - id: b
    text:
      es: "Son los tributos propios clasificados en tasas, impuestos y precios públicos y los recargos exigibles sobre los impuestos de las comunidades autónomas."
  - id: c
    text:
      es: "Son los tributos propios clasificados en tasas e impuestos, con exclusión de las contribuciones especiales, y los recargos sobre los impuestos de otras entidades locales."
  - id: d
    correct: true
    text:
      es: "Son los tributos propios clasificados en tasas, contribuciones especiales e impuestos y los recargos exigibles sobre los impuestos de las comunidades autónomas o de otras entidades locales."
  explanation:
    es: "Los tributos propios locales son las tasas, las contribuciones especiales y los impuestos, más los recargos exigibles sobre los impuestos de las comunidades autónomas o de otras entidades locales. Los recargos sobre impuestos del Estado no figuran. Los precios públicos son un recurso distinto, no un tributo propio. Excluir las contribuciones especiales recorta la clasificación."
  citation: "art. 2.1 TRLRHL"
  difficulty: 3
  tags:
  - "trlrhl"
  - "recursos-locales"
# anchor: boe-a-2004-4214-art-56
- id: m03-l01-q0085
  prompt:
    es: "Según el artículo 56 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, ¿por qué recursos está constituida la hacienda de los municipios?"
  options:
  - id: a
    text:
      es: "Solo por los tributos propios, sin los restantes recursos que enumera la ley para las entidades locales."
  - id: b
    correct: true
    text:
      es: "Por los mismos recursos que enumera la ley para las entidades locales, con las especialidades del título dedicado a los municipios."
  - id: c
    text:
      es: "Por los recursos que fije cada ordenanza fiscal, con independencia de los que enumere la ley."
  - id: d
    text:
      es: "Por los recursos de las entidades locales, con exclusión de los ingresos procedentes de su patrimonio."
  explanation:
    es: "La hacienda municipal se compone de los recursos que la ley enumera para las entidades locales, con las especialidades del título sobre los municipios. Reducirla a los tributos propios deja fuera el resto. Las ordenanzas fiscales no sustituyen la enumeración legal. Los ingresos del patrimonio son uno de los recursos de la lista, de modo que no se excluyen."
  citation: "art. 56 TRLRHL"
  difficulty: 3
  tags:
  - "trlrhl"
  - "hacienda-municipal"
# anchor: boe-a-2004-4214-art-58
- id: m03-l01-q0087
  prompt:
    es: "De acuerdo con el artículo 58 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, los ayuntamientos podrán establecer y exigir contribuciones especiales por:"
  options:
  - id: a
    text:
      es: "La prestación de servicios o la realización de actividades de su competencia."
  - id: b
    text:
      es: "La utilización privativa o el aprovechamiento especial de bienes del dominio público municipal."
  - id: c
    correct: true
    text:
      es: "La realización de obras o por el establecimiento o ampliación de servicios municipales."
  - id: d
    text:
      es: "La percepción de precios públicos por los servicios que presten a los vecinos."
  explanation:
    es: "Las contribuciones especiales municipales se exigen por la realización de obras o por el establecimiento o ampliación de servicios municipales. La prestación de servicios y la utilización del dominio público son el presupuesto de las tasas, que regula el artículo anterior. Los precios públicos son un recurso distinto de los tributos."
  citation: "art. 58 TRLRHL"
  difficulty: 2
  tags:
  - "trlrhl"
  - "contribuciones-especiales"
# anchor: boe-a-2004-4214-art-59
- id: m03-l01-q0088
  prompt:
    es: "¿Cuál de los siguientes impuestos exigirán los ayuntamientos, de acuerdo con el artículo 59.1 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, sin que su establecimiento sea potestativo?"
  options:
  - id: a
    text:
      es: "El Impuesto sobre Construcciones, Instalaciones y Obras."
  - id: b
    correct: true
    text:
      es: "El Impuesto sobre Actividades Económicas."
  - id: c
    text:
      es: "El Impuesto sobre el Incremento de Valor de los Terrenos de Naturaleza Urbana."
  - id: d
    text:
      es: "El Impuesto sobre el Patrimonio de los vecinos del municipio."
  explanation:
    es: "El Impuesto sobre Actividades Económicas es uno de los tres que los ayuntamientos exigirán, según el artículo 59.1, junto con el de Bienes Inmuebles y el de Vehículos de Tracción Mecánica. El de Construcciones, Instalaciones y Obras y el del Incremento de Valor de los Terrenos de Naturaleza Urbana son potestativos, según el artículo 59.2. El Impuesto sobre el Patrimonio es un impuesto estatal."
  citation: "art. 59.1 TRLRHL"
  difficulty: 1
  tags:
  - "trlrhl"
  - "impuestos-locales"
# anchor: boe-a-2004-4214-art-59
- id: m03-l01-q0089
  prompt:
    es: "Un ayuntamiento exige el Impuesto sobre Bienes Inmuebles, el Impuesto sobre Actividades Económicas y el Impuesto sobre Vehículos de Tracción Mecánica, pero no establece ni el de Construcciones, Instalaciones y Obras ni el del Incremento de Valor de los Terrenos de Naturaleza Urbana. ¿Qué dice el artículo 59 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales?"
  options:
  - id: a
    correct: true
    text:
      es: "Es conforme, porque los tres primeros son de exigencia obligatoria y los otros dos los ayuntamientos podrán establecerlos y exigirlos."
  - id: b
    text:
      es: "No es conforme, porque los cinco impuestos enumerados son de exigencia obligatoria para todos los ayuntamientos."
  - id: c
    text:
      es: "No es conforme, porque el ayuntamiento solo podría exigir el Impuesto sobre Bienes Inmuebles."
  - id: d
    text:
      es: "Es conforme, pero solo si el pleno justifica cada año la decisión de no establecer los dos impuestos."
  explanation:
    es: "El artículo 59.1 hace de exigencia obligatoria el Impuesto sobre Bienes Inmuebles, el de Actividades Económicas y el de Vehículos de Tracción Mecánica. El artículo 59.2 deja los otros dos como potestativos, porque los ayuntamientos podrán establecerlos y exigirlos. No son obligatorios los cinco, ni el ayuntamiento queda limitado a un solo impuesto, ni se le impone una justificación anual que el precepto no recoge."
  citation: "art. 59.2 TRLRHL"
  difficulty: 2
  tags:
  - "trlrhl"
  - "impuestos-locales"
# anchor: boe-a-2004-4214-art-59
- id: m03-l01-q0090
  prompt:
    es: "De acuerdo con el artículo 59.2 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, los ayuntamientos podrán, asimismo, establecer y exigir el Impuesto sobre Construcciones, Instalaciones y Obras y:"
  options:
  - id: a
    correct: true
    text:
      es: "El Impuesto sobre el Incremento de Valor de los Terrenos de Naturaleza Urbana."
  - id: b
    text:
      es: "El Impuesto sobre Vehículos de Tracción Mecánica."
  - id: c
    text:
      es: "El Impuesto sobre Bienes Inmuebles."
  - id: d
    text:
      es: "El Impuesto sobre Actividades Económicas."
  explanation:
    es: "El segundo impuesto potestativo del apartado 2 es el del Incremento de Valor de los Terrenos de Naturaleza Urbana. Los de Vehículos de Tracción Mecánica, Bienes Inmuebles y Actividades Económicas son los tres que enumera el apartado 1 y que los ayuntamientos exigirán, no los que podrán establecer asimismo."
  citation: "art. 59.2 TRLRHL"
  difficulty: 2
  tags:
  - "trlrhl"
  - "impuestos-locales"
# anchor: boe-a-2004-4214-art-60
- id: m03-l01-q0091
  prompt:
    es: "De acuerdo con el artículo 60 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, el Impuesto sobre Bienes Inmuebles es un tributo directo de carácter real que grava:"
  options:
  - id: a
    text:
      es: "La renta que obtengan los titulares de los bienes inmuebles."
  - id: b
    correct: true
    text:
      es: "El valor de los bienes inmuebles."
  - id: c
    text:
      es: "El patrimonio neto de los titulares de bienes inmuebles."
  - id: d
    text:
      es: "La transmisión onerosa de los bienes inmuebles."
  explanation:
    es: "El impuesto grava el valor de los bienes inmuebles. La renta de sus titulares es materia del IRPF y del Impuesto sobre Sociedades. El patrimonio neto de los titulares es materia del Impuesto sobre el Patrimonio. La transmisión onerosa de inmuebles es materia del impuesto sobre transmisiones patrimoniales."
  citation: "art. 60 TRLRHL"
  difficulty: 1
  tags:
  - "trlrhl"
  - "ibi"
# anchor: boe-a-2004-4214-art-60
- id: m03-l01-q0092
  prompt:
    es: "De acuerdo con el artículo 60 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, señale la respuesta CORRECTA sobre la naturaleza del Impuesto sobre Bienes Inmuebles:"
  options:
  - id: a
    text:
      es: "Es un tributo indirecto de carácter real."
  - id: b
    text:
      es: "Es un tributo directo de carácter personal."
  - id: c
    correct: true
    text:
      es: "Es un tributo directo de carácter real."
  - id: d
    text:
      es: "Es un tributo indirecto de carácter personal."
  explanation:
    es: "El Impuesto sobre Bienes Inmuebles es directo y de carácter real, porque grava el valor de los inmuebles con independencia de las circunstancias de su titular. Las otras tres combinaciones cambian uno de los dos rasgos o ambos: indirecto, personal, o indirecto y personal a la vez."
  citation: "art. 60 TRLRHL"
