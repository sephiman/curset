# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q001
  prompt:
    es: "Según la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, ¿cuál NO es característica de los bienes imputables al capítulo 2?"
  options:
  - id: a
    text:
      es: "Que se trate de bienes fungibles."
  - id: b
    correct: true
    text:
      es: "Que sean susceptibles de inclusión en inventario."
  - id: c
    text:
      es: "Que su duración sea previsiblemente inferior al ejercicio presupuestario."
  - id: d
    text:
      es: "Que sean, previsiblemente, gastos reiterativos."
  explanation:
    es: "El capítulo 2 recoge los gastos de bienes fungibles, de duración previsiblemente inferior al ejercicio, no susceptibles de inclusión en inventario y reiterativos. Por eso el bien susceptible de inclusión en inventario no es característica del capítulo 2: contradice el rasgo de no ser inventariable, y ese bien va a inversiones reales. Los bienes fungibles, la duración inferior al ejercicio y el carácter reiterativo sí figuran en la lista."
  citation: "anexo IV, capítulo 2, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q002
  prompt:
    es: "Según la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, ¿a qué capítulo se imputan las indemnizaciones por razón del servicio?"
  options:
  - id: a
    text:
      es: "Al capítulo 1, de gastos de personal, junto con las retribuciones y cotizaciones."
  - id: b
    correct: true
    text:
      es: "Al capítulo 2, de gastos corrientes, en su artículo 23, «Indemnizaciones por razón del servicio»."
  - id: c
    text:
      es: "Al capítulo 4, de transferencias corrientes, como pagos sin contrapartida directa del receptor."
  - id: d
    text:
      es: "Al capítulo 6, de inversiones reales, como gastos de naturaleza inmaterial y amortizable."
  explanation:
    es: "El artículo 23 del capítulo 2 recoge las indemnizaciones por razón del servicio de altos cargos, funcionarios y personal laboral. El capítulo 1 las excluye de forma expresa: «no se incluyen en este capítulo las indemnizaciones por razón del servicio». Las transferencias corrientes del capítulo 4 son pagos sin contrapartida directa del receptor y las inversiones reales del capítulo 6 son gastos de capital, así que ninguno es su sitio."
  citation: "anexo IV, art. 23, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q004
  prompt:
    es: "Según la clasificación económica de los gastos, ¿cuál de los siguientes se imputa al artículo 21, «Reparaciones, mantenimiento y conservación»?"
  options:
  - id: a
    text:
      es: "La compra de maquinaria nueva para ampliar la dotación de un servicio."
  - id: b
    correct: true
    text:
      es: "El mantenimiento y la conservación de la maquinaria de un servicio del Estado."
  - id: c
    text:
      es: "El alquiler de la maquinaria que utiliza un servicio del Estado."
  - id: d
    text:
      es: "Un estudio técnico no materializado en activos y con efectos en varios años."
  explanation:
    es: "El artículo 21 recoge el mantenimiento, las reparaciones y la conservación de edificios, maquinaria y otro inmovilizado material. La compra de maquinaria nueva es inversión del capítulo 6 y el alquiler va al artículo 20. El estudio técnico sin activo asociado es una inversión de carácter inmaterial del artículo 64."
  citation: "anexo IV, art. 21, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q005
  prompt:
    es: "Dentro del concepto 221, «Suministros», de la clasificación económica de los gastos, el gasto de agua de un edificio del Estado se imputa al:"
  options:
  - id: a
    text:
      es: "Subconcepto 00 del concepto 221, en el artículo 22 del capítulo 2."
  - id: b
    text:
      es: "Subconcepto 02 del concepto 221, en el artículo 22 del capítulo 2."
  - id: c
    text:
      es: "Subconcepto 03 del concepto 221, en el artículo 22 del capítulo 2."
  - id: d
    correct: true
    text:
      es: "Subconcepto 01 del concepto 221, en el artículo 22 del capítulo 2."
  explanation:
    es: "El concepto 221 se divide en subconceptos: 00 energía eléctrica, 01 agua, 02 gas y 03 combustible. El agua es el subconcepto 01. El 00 es la energía eléctrica, el 02 el gas y el 03 el combustible."
  citation: "anexo IV, art. 22, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-art-6
- id: m05-l05-q006
  prompt:
    es: "Según el artículo 6.1.3 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, los gastos se ordenan por naturaleza económica según el:"
  options:
  - id: a
    correct: true
    text:
      es: "Anexo II de la propia orden, con sus capítulos, artículos, conceptos y subconceptos económicos."
  - id: b
    text:
      es: "Anexo I de la propia orden, con sus programas de gasto, grupos de programas y áreas de gasto."
  - id: c
    text:
      es: "Anexo III de la propia orden, con la clasificación económica de los ingresos del Estado."
  - id: d
    text:
      es: "Anexo al Presupuesto, con la clasificación territorial de los proyectos de inversión de cada año."
  explanation:
    es: "El artículo 6.1.3 remite al anexo II para la clasificación por capítulos, artículos, conceptos y subconceptos. El anexo I es la clasificación por programas de gasto y el anexo III la de los ingresos. El anexo al Presupuesto con proyectos de inversión es la estructura territorial del artículo 6.1.4, no la económica."
  citation: "art. 6.1.3 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q007
  prompt:
    es: "En la clasificación económica de los gastos del Estado, las operaciones de capital comprenden los capítulos:"
  options:
  - id: a
    correct: true
    text:
      es: "6 y 7, de inversiones reales y de transferencias de capital del Estado y sus organismos."
  - id: b
    text:
      es: "5 y 6, del fondo de contingencia y de inversiones reales del Estado."
  - id: c
    text:
      es: "7 y 8, de transferencias de capital y de activos financieros del Estado."
  - id: d
    text:
      es: "1 a 4, de gastos de personal hasta transferencias corrientes del Estado."
  explanation:
    es: "Las operaciones de capital son los capítulos 6 y 7, de inversiones reales y de transferencias de capital. Los capítulos 1 a 4 son operaciones corrientes. El capítulo 5 es el fondo de contingencia y el 8 recoge activos financieros, que se separan de las operaciones de capital."
  citation: "anexo IV, introducción, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q008
  prompt:
    es: "Según la clasificación económica de los gastos, ¿qué gastos recoge el capítulo 6, «Inversiones reales», además de los destinados a crear o adquirir bienes de capital?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de adquisición de bienes inventariables necesarios para el funcionamiento operativo de los servicios."
  - id: b
    text:
      es: "Los de adquisición de bienes fungibles de duración previsiblemente inferior al ejercicio presupuestario."
  - id: c
    text:
      es: "Los pagos sin contrapartida directa que el receptor destina a financiar operaciones de capital."
  - id: d
    text:
      es: "Todos los gastos de naturaleza inmaterial que realice el Estado, sean o no amortizables."
  explanation:
    es: "El capítulo 6 incluye los bienes de naturaleza inventariable necesarios para el funcionamiento operativo de los servicios, y los gastos inmateriales que tengan carácter amortizable. Los bienes fungibles de corta duración van al capítulo 2. Los pagos sin contrapartida para financiar operaciones de capital son transferencias del capítulo 7. Los gastos inmateriales entran solo si son amortizables."
  citation: "anexo IV, capítulo 6, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q011
  prompt:
    es: "En un «leasing» incluido en el capítulo 6, la parte de la cuota que recupera el coste del bien va a inversiones reales y la carga financiera se aplica al:"
  options:
  - id: a
    correct: true
    text:
      es: "Concepto 359, «Otros gastos financieros», del capítulo 3 de gastos financieros."
  - id: b
    text:
      es: "Concepto 209, «Cánones», del artículo 20 del capítulo 2 de gastos corrientes."
  - id: c
    text:
      es: "Concepto 206, «Arrendamientos de equipos para procesos de información», del capítulo 2."
  - id: d
    text:
      es: "Concepto 630, «Inversión de reposición asociada al funcionamiento operativo de los servicios»."
  explanation:
    es: "Al capítulo 6 va solo la parte de la cuota que recupera el coste del bien. El resto, la carga financiera, se aplica al concepto 359, «Otros gastos financieros». Los cánones del concepto 209 son pagos por la cesión de un bien o el uso de la propiedad industrial, y los arrendamientos del concepto 206 son gasto corriente de alquiler. El concepto 630 sigue siendo inversión de reposición, no gasto financiero."
  citation: "anexo IV, capítulo 6, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q012
  prompt:
    es: "Un servicio del Estado adquiere equipos informáticos nuevos para ampliar los que ya tiene, sin sustituir ninguno. Según la clasificación económica de los gastos, ¿a qué concepto se imputa?"
  options:
  - id: a
    text:
      es: "Concepto 630, inversión de reposición asociada al funcionamiento operativo de los servicios."
  - id: b
    text:
      es: "Concepto 206, arrendamientos de equipos para procesos de información."
  - id: c
    correct: true
    text:
      es: "Concepto 620, inversión nueva asociada al funcionamiento operativo de los servicios."
  - id: d
    text:
      es: "Concepto 216, reparaciones de equipos para procesos de la información."
  explanation:
    es: "Los equipos nuevos que incrementan el stock de capital del servicio son inversión nueva: el concepto 620 recoge la adquisición de equipamiento para proceso de información. El concepto 630 exige sustituir bienes existentes por otros análogos, y aquí no se sustituye ninguno. El 206 es alquiler y el 216 es reparación de equipos ya existentes, no compra."
  citation: "anexo IV, art. 62, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q013
  prompt:
    es: "Según el artículo 63 de la clasificación económica de los gastos, el concepto 630 recoge los mismos gastos que el 620, siempre que se trate de:"
  options:
  - id: a
    text:
      es: "Ampliación del número de bienes existentes con otros de clase distinta."
  - id: b
    text:
      es: "Reparación de los bienes existentes por el propio personal del servicio."
  - id: c
    correct: true
    text:
      es: "Sustitución de los bienes existentes por otros análogos."
  - id: d
    text:
      es: "Adquisición de bienes fungibles de duración inferior al ejercicio."
  explanation:
    es: "El concepto 630 se distingue del 620 por la sustitución: recoge los mismos gastos «siempre que se trate de sustitución de los bienes existentes por otros análogos». Ampliar con bienes de otra clase no es sustituir. La reparación por el personal del servicio no es una adquisición de bienes. Los bienes fungibles de corta duración van al capítulo 2."
  citation: "anexo IV, art. 63, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q015
  prompt:
    es: "Según la clasificación económica de los gastos, ¿a qué artículo se imputan los estudios y trabajos técnicos que no se materializan en activos y producen efectos en varios ejercicios?"
  options:
  - id: a
    text:
      es: "Al artículo 62, «Inversión nueva asociada al funcionamiento operativo de los servicios», del capítulo 6."
  - id: b
    correct: true
    text:
      es: "Al artículo 64, «Gastos de inversiones de carácter inmaterial», del capítulo 6 de inversiones reales."
  - id: c
    text:
      es: "Al artículo 22, «Material, suministros y otros», del capítulo 2 de gastos corrientes."
  - id: d
    text:
      es: "Al artículo 21, «Reparaciones, mantenimiento y conservación», del capítulo 2 de gastos corrientes."
  explanation:
    es: "El artículo 64 recoge los gastos realizados en un ejercicio que no se materializan en activos y producen efectos en varios ejercicios futuros, como los estudios y trabajos técnicos. El artículo 62 exige un activo que incremente el stock de capital. Los artículos 21 y 22 son gasto corriente de mantenimiento y de material y suministros."
  citation: "anexo IV, art. 64, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-2627-regla-88
- id: m05-l05-q016
  prompt:
    es: "Según la regla 88 de la Orden de 1 de febrero de 1996 por la que se aprueba la Instrucción de operatoria contable, son transferencias las entregas dinerarias no condicionadas hechas:"
  options:
  - id: a
    text:
      es: "Con contrapartida directa en bienes o servicios para el centro gestor que las concede y las abona."
  - id: b
    text:
      es: "Solo a entidades públicas, sin que puedan ser beneficiarias las personas físicas ni las privadas."
  - id: c
    correct: true
    text:
      es: "Sin contrapartida directa por parte de los beneficiarios, sean personas o entidades públicas o privadas."
  - id: d
    text:
      es: "Con carácter reintegrable al Tesoro Público una vez ejecutado el gasto por el beneficiario."
  explanation:
    es: "La regla 88 define las transferencias como entregas dinerarias no condicionadas, a personas o entidades públicas o privadas, sin contrapartida directa de los beneficiarios. Con contrapartida directa sería una prestación a cambio de un precio. Limitarlas a entidades públicas contradice el texto, que incluye las privadas y las personas. El reintegro posterior no forma parte de la definición."
  citation: "regla 88 IOC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-2627-regla-88
- id: m05-l05-q017
  prompt:
    es: "Según la regla 88 de la Orden de 1 de febrero de 1996 por la que se aprueba la Instrucción de operatoria contable, ¿qué indemnizaciones se incluyen entre las transferencias?"
  options:
  - id: a
    text:
      es: "Las indemnizaciones satisfechas a altos cargos y a su séquito."
  - id: b
    correct: true
    text:
      es: "Las indemnizaciones que no sean por razón de servicio."
  - id: c
    text:
      es: "Las indemnizaciones por dietas y locomoción de los funcionarios."
  - id: d
    text:
      es: "Las indemnizaciones por asistencia a tribunales y a órganos colegiados."
  explanation:
    es: "La regla 88 incluye entre las transferencias las indemnizaciones de la Administración General del Estado que no sean por razón de servicio. Las de altos cargos, las dietas y locomoción de funcionarios y las asistencias a tribunales y órganos colegiados son indemnizaciones por razón del servicio, que van al artículo 23 del capítulo 2."
  citation: "regla 88 IOC"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q018
  prompt:
    es: "Según el capítulo 4 de la clasificación económica de los gastos, las transferencias corrientes son pagos, condicionados o no, sin contrapartida directa del receptor, que este destina a financiar:"
  options:
  - id: a
    text:
      es: "Operaciones de capital de los agentes receptores."
  - id: b
    text:
      es: "Gastos de inversión en bienes de naturaleza inventariable."
  - id: c
    text:
      es: "Operaciones de endeudamiento y pago de sus intereses."
  - id: d
    correct: true
    text:
      es: "Gastos de naturaleza corriente de los propios agentes receptores."
  explanation:
    es: "El capítulo 4 se aplica a los pagos sin contrapartida directa que el receptor destina a financiar gastos de naturaleza corriente. Si financian operaciones de capital son transferencias del capítulo 7. Los bienes inventariables son inversiones reales del capítulo 6 y los intereses de la deuda son gastos financieros."
  citation: "anexo IV, capítulo 4, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q019
  prompt:
    es: "Según la clasificación económica de los gastos, ¿con qué criterio se imputan a los capítulos 4 y 7 las transferencias y subvenciones, dinerarias o en especie?"
  options:
  - id: a
    correct: true
    text:
      es: "En función del beneficiario final de las mismas."
  - id: b
    text:
      es: "En función del centro gestor que las concede."
  - id: c
    text:
      es: "En función de que sean dinerarias o en especie."
  - id: d
    text:
      es: "En función del importe del crédito del capítulo."
  explanation:
    es: "Las transferencias y subvenciones, tanto dinerarias como en especie, se imputan en función de su beneficiario final. El centro gestor que las concede, la forma dineraria o en especie y el importe no deciden el capítulo."
  citation: "anexo IV, capítulo 4, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l05-q021
  prompt:
    es: "Según el capítulo 4 de la clasificación económica de los gastos, ¿qué indemnizaciones se atienden con cargo a ese capítulo, siempre que por su naturaleza no deban imputarse a otros?"
  options:
  - id: a
    text:
      es: "Las que se satisfacen al personal funcionario y laboral fijo y eventual por razón del servicio."
  - id: b
    correct: true
    text:
      es: "Las que la Administración satisface como consecuencia del funcionamiento de los servicios públicos."
  - id: c
    text:
      es: "Las que se abonan por la asistencia a tribunales y órganos colegiados y a reuniones o comisiones."
  - id: d
    text:
      es: "Las que se pagan a los altos cargos y a su séquito por sus desplazamientos oficiales."
  explanation:
    es: "El capítulo 4 atiende las indemnizaciones que la Administración debe satisfacer como consecuencia del funcionamiento de los servicios públicos, siempre que no deban imputarse a otros capítulos. Las indemnizaciones por razón del servicio al personal, por asistencia a tribunales y órganos colegiados y de altos cargos y séquito son del artículo 23 del capítulo 2."
  citation: "anexo IV, capítulo 4, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
