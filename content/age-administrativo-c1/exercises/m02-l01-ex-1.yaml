# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q001
  prompt:
    es: "De acuerdo con el artículo 4.b) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la orientación e información al ciudadano:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá entrañar una interpretación normativa ni consideración jurídica o económica."
  - id: b
    text:
      es: "Podrá entrañar una interpretación normativa, pero no una consideración jurídica o económica."
  - id: c
    text:
      es: "Podrá entrañar una consideración jurídica, siempre que no tenga contenido económico."
  - id: d
    text:
      es: "Solo podrá entrañar una interpretación normativa cuando el ciudadano la solicite expresamente por escrito."
  explanation:
    es: "El artículo 4.b) dice que esta función «en ningún caso podrá entrañar una interpretación normativa» ni «consideración jurídica o económica»; se limita a determinar conceptos, informar de opciones legales y ayudar a rellenar impresos. La opción que admite la interpretación normativa y la que admite la consideración jurídica sin contenido económico contradicen ese «en ningún caso». La que la permite si se pide por escrito añade una excepción que el artículo no tiene."
  citation: "art. 4.b) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q002
  prompt:
    es: "¿Cuál de las siguientes es una de las funciones que comprende la atención personalizada al ciudadano según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano?"
  options:
  - id: a
    text:
      es: "La resolución de los recursos de alzada interpuestos contra los actos del departamento."
  - id: b
    text:
      es: "La tramitación de las reclamaciones de responsabilidad patrimonial contra la Administración."
  - id: c
    correct: true
    text:
      es: "La recepción y acogida, para orientar al ciudadano en el momento inicial de su visita."
  - id: d
    text:
      es: "La instrucción de los expedientes disciplinarios del personal que atiende al público."
  explanation:
    es: "El artículo 4 enumera seis funciones; la primera es la de «recepción y acogida» para dar la orientación y ayuda que el ciudadano precise «en el momento inicial de su visita». Los recursos de alzada, la responsabilidad patrimonial y los expedientes disciplinarios se tramitan por sus propios procedimientos y no figuran entre las funciones de atención al ciudadano del artículo 4."
  citation: "art. 4.a) RD 208/1996"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q003
  prompt:
    es: "La función de gestión que comprende la atención personalizada al ciudadano en la Administración General del Estado incluye la resolución de las cuestiones:"
  options:
  - id: a
    text:
      es: "Cuya cuantía económica no supere el límite fijado por el Subsecretario."
  - id: b
    correct: true
    text:
      es: "Cuya urgencia y simplicidad demanden una respuesta inmediata."
  - id: c
    text:
      es: "Que el ciudadano plantee por escrito en el registro de la oficina."
  - id: d
    text:
      es: "Que no requieran el informe previo de la Abogacía del Estado."
  explanation:
    es: "El artículo 4.c) RD 208/1996 incluye en la función de gestión «las actuaciones de trámite y resolución de las cuestiones cuya urgencia y simplicidad demanden una respuesta inmediata». El criterio es la urgencia y la simplicidad. La cuantía fijada por el Subsecretario, la presentación por escrito en el registro y la falta de informe de la Abogacía del Estado no aparecen en el artículo."
  citation: "art. 4.c) RD 208/1996"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2005-14836-art-3
- id: m02-l01-q004
  prompt:
    es: "Según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, ¿cuántos programas integran dicho marco?"
  options:
  - id: a
    text:
      es: "Cuatro programas, entre ellos el de cartas de servicios."
  - id: b
    text:
      es: "Cinco programas, entre ellos el de cartas de servicios."
  - id: c
    text:
      es: "Siete programas, entre ellos el de cartas de servicios."
  - id: d
    correct: true
    text:
      es: "Seis programas, entre ellos el de cartas de servicios."
  explanation:
    es: "El artículo 3.1 enumera seis programas, de la letra a) a la f): análisis de la demanda y evaluación de la satisfacción, cartas de servicios, quejas y sugerencias, evaluación de la calidad de las organizaciones, reconocimiento y Observatorio de la Calidad de los Servicios Públicos. Cuatro, cinco y siete no corresponden a esa lista."
  citation: "art. 3.1 RD 951/2005"
  difficulty: 2
  tags:
  - "cantidad"
  - "estructura"
# anchor: boe-a-2005-14836-art-8
- id: m02-l01-q005
  prompt:
    es: "Según el artículo 8.1 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las cartas de servicios informan sobre:"
  options:
  - id: a
    text:
      es: "Los servicios encomendados, el coste económico de cada prestación y las sanciones previstas por su incumplimiento."
  - id: b
    correct: true
    text:
      es: "Los servicios encomendados, los derechos que asisten en relación con ellos y los compromisos de calidad en su prestación."
  - id: c
    text:
      es: "Los servicios encomendados, los derechos que asisten en relación con ellos y el régimen disciplinario aplicable al personal."
  - id: d
    text:
      es: "Los procedimientos en tramitación, el estado de cada expediente y el personal responsable de tramitarlo."
  explanation:
    es: "El artículo 8.1 define las cartas como el instrumento con el que se informa a ciudadanos y usuarios «sobre los servicios que tienen encomendados, sobre los derechos que les asisten en relación con aquellos y sobre los compromisos de calidad en su prestación». El coste y las sanciones, y el régimen disciplinario del personal, no forman parte de esa definición. El estado de los procedimientos en tramitación es información particular del RD 208/1996, no contenido de una carta."
  citation: "art. 8.1 RD 951/2005"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-9
- id: m02-l01-q006
  prompt:
    es: "¿Cuál de los siguientes es uno de los apartados en que se estructura el contenido de las cartas de servicios de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El régimen sancionador aplicable al personal que incumpla los compromisos declarados en la carta."
  - id: b
    text:
      es: "La memoria económica del coste de cada uno de los servicios incluidos en la carta."
  - id: c
    text:
      es: "El calendario de auditorías externas de los compromisos declarados."
  - id: d
    correct: true
    text:
      es: "Las medidas de subsanación en caso de incumplimiento de los compromisos declarados."
  explanation:
    es: "El artículo 9 RD 951/2005 estructura el contenido en cuatro apartados: de carácter general y legal, de compromisos de calidad, «medidas de subsanación en caso de incumplimiento de los compromisos declarados» y de carácter complementario. Un régimen sancionador del personal, una memoria económica del coste y un calendario de auditorías externas no son apartados de la carta."
  citation: "art. 9 RD 951/2005"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2005-14836-art-10
- id: m02-l01-q007
  prompt:
    es: "Según el artículo 10.4 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las cartas de servicios:"
  options:
  - id: a
    correct: true
    text:
      es: "Se actualizarán periódicamente en función de las circunstancias y, en cualquier caso, al menos cada tres años."
  - id: b
    text:
      es: "Se actualizarán solo cuando cambien los servicios que prestan, sin plazo máximo entre actualizaciones."
  - id: c
    text:
      es: "Se actualizarán cada tres años, sin que puedan modificarse antes de que transcurra ese plazo."
  - id: d
    text:
      es: "Se actualizarán cuando lo acuerde la Inspección General de Servicios y, en cualquier caso, cada cinco años."
  explanation:
    es: "El artículo 10.4 combina dos reglas: actualización periódica «en función de las circunstancias» y, en cualquier caso, «al menos cada tres años». La opción que solo actualiza cuando cambian los servicios suprime el plazo máximo. La que fija cada tres años sin modificación previa suprime la actualización según las circunstancias. La que da la iniciativa a la Inspección General de Servicios cambia el plazo a cinco años."
  citation: "art. 10.4 RD 951/2005"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-11
- id: m02-l01-q008
  prompt:
    es: "Según el artículo 11.1 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, ¿quién aprueba las cartas de servicios?"
  options:
  - id: a
    text:
      es: "El Ministro del departamento del órgano proponente, mediante orden ministerial."
  - id: b
    text:
      es: "El titular del órgano u organismo al que se refiera la carta, mediante resolución."
  - id: c
    correct: true
    text:
      es: "El Subsecretario del departamento del órgano proponente, mediante resolución."
  - id: d
    text:
      es: "El Secretario de Estado del que dependa el órgano proponente, mediante resolución."
  explanation:
    es: "El artículo 11.1 dice que las cartas y sus actualizaciones «serán aprobadas mediante resolución del Subsecretario del departamento al que pertenezca el órgano o esté vinculado o adscrito el organismo proponente». El Ministro y el Secretario de Estado son el nivel superior. Al titular del órgano al que se refiere la carta le corresponde reconocer las reclamaciones por incumplimiento (art. 9.c), no aprobar la carta."
  citation: "art. 11.1 RD 951/2005"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2005-14836-art-11
- id: m02-l01-q009
  prompt:
    es: "Señale la respuesta correcta sobre las cartas de servicios según el Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "La resolución que aprueba la carta se publica en el boletín oficial de la provincia."
  - id: b
    text:
      es: "Su contenido se estructura en dos apartados: compromisos de calidad y medidas de subsanación."
  - id: c
    text:
      es: "Se actualizarán periódicamente y, en cualquier caso, al menos cada cinco años."
  - id: d
    correct: true
    text:
      es: "La resolución que aprueba la carta se publica en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 11.2 dice que la resolución de aprobación «se publicará en el \"Boletín Oficial del Estado\"». El boletín de la provincia no es el diario que fija el artículo. El contenido de la carta tiene cuatro apartados, no dos (art. 9). La actualización es al menos cada tres años, no cada cinco (art. 10.4)."
  citation: "art. 11.2 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q010
  prompt:
    es: "De acuerdo con el artículo 4.1 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, son personas con discapacidad las que presentan deficiencias físicas, mentales, intelectuales o sensoriales:"
  options:
  - id: a
    text:
      es: "Permanentes y declaradas judicialmente que, al interactuar con diversas barreras, impidan su participación plena y efectiva en la sociedad."
  - id: b
    correct: true
    text:
      es: "Previsiblemente permanentes que, al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en la sociedad."
  - id: c
    text:
      es: "Temporales o permanentes que les impidan en todo caso desempeñar una actividad laboral en igualdad de condiciones."
  - id: d
    text:
      es: "Previsiblemente permanentes que les impidan valerse por sí mismas en las actividades básicas de la vida diaria."
  explanation:
    es: "El artículo 4.1 exige deficiencias «previsiblemente permanentes que, al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en la sociedad, en igualdad de condiciones con los demás». No pide una declaración judicial, no admite deficiencias temporales ni se refiere a la actividad laboral. La imposibilidad de valerse en las actividades básicas de la vida diaria describe la dependencia, no la definición de discapacidad del artículo 4.1."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q011
  prompt:
    es: "Según el artículo 4.2 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, el grado mínimo de discapacidad reconocido para tener la consideración de persona con discapacidad es:"
  options:
  - id: a
    text:
      es: "Un grado del 25 por ciento."
  - id: b
    text:
      es: "Un grado del 45 por ciento."
  - id: c
    correct: true
    text:
      es: "Un grado del 33 por ciento."
  - id: d
    text:
      es: "Un grado del 65 por ciento."
  explanation:
    es: "El artículo 4.2 da esa consideración a quienes tengan reconocido «un grado de discapacidad igual o superior al 33 por ciento»; el mínimo es, por tanto, el 33 por ciento. El 25 y el 45 por ciento no aparecen en el artículo. El 65 por ciento es el grado al que el mismo apartado asimila la dependencia en grado II y III, no el umbral general."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-28
- id: m02-l01-q012
  prompt:
    es: "Según el artículo 28.1 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las condiciones básicas de accesibilidad de las oficinas públicas serán exigibles:"
  options:
  - id: a
    correct: true
    text:
      es: "En los plazos y términos establecidos reglamentariamente."
  - id: b
    text:
      es: "En los plazos que fije cada departamento ministerial mediante orden."
  - id: c
    text:
      es: "Desde el momento en que las solicite la persona con discapacidad."
  - id: d
    text:
      es: "En los plazos que acuerde la Conferencia Sectorial competente."
  explanation:
    es: "El artículo 28.1 dice que las condiciones básicas de accesibilidad de las oficinas públicas y servicios de atención al ciudadano «serán exigibles en los plazos y términos establecidos reglamentariamente», con los plazos máximos de la disposición adicional tercera. No los fija cada departamento por orden ni una Conferencia Sectorial, y no dependen de que las solicite la persona con discapacidad."
  citation: "art. 28.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q013
  prompt:
    es: "¿Qué regula el Real Decreto 366/2007, de 16 de marzo, respecto de las personas con discapacidad?"
  options:
  - id: a
    text:
      es: "Las condiciones de accesibilidad de los sitios web y las aplicaciones para dispositivos móviles de todo el sector público."
  - id: b
    text:
      es: "El procedimiento para el reconocimiento, declaración y calificación del grado de discapacidad de las personas."
  - id: c
    correct: true
    text:
      es: "Las condiciones de accesibilidad y no discriminación de las Oficinas de Atención al Ciudadano, impresos y otros medios de relación."
  - id: d
    text:
      es: "Las condiciones básicas de accesibilidad cognitiva exigibles a todos los entornos, productos y servicios."
  explanation:
    es: "El artículo 1.1 RD 366/2007 dice que regula las condiciones de accesibilidad y no discriminación que deben presentar «las Oficinas de Atención al Ciudadano, impresos y cualquier otro medio» que la Administración General del Estado dedica a las relaciones con los ciudadanos. La accesibilidad de sitios web y aplicaciones móviles es la materia del Real Decreto 1112/2018. El reconocimiento del grado de discapacidad tiene su propio reglamento. La accesibilidad cognitiva la regula el Reglamento aprobado por el Real Decreto 707/2026."
  citation: "art. 1.1 RD 366/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q014
  prompt:
    es: "Según el artículo 1.2.a) del Real Decreto 366/2007, de 16 de marzo, las Oficinas de Atención al Ciudadano son dependencias o espacios físicos que la Administración General del Estado dedica:"
  options:
  - id: a
    correct: true
    text:
      es: "Exclusiva o prioritariamente al contacto directo con los ciudadanos y sus representantes."
  - id: b
    text:
      es: "Exclusivamente a la recepción de las solicitudes dirigidas a la Administración General del Estado."
  - id: c
    text:
      es: "Prioritariamente a la atención telefónica y telemática de los ciudadanos y sus representantes."
  - id: d
    text:
      es: "Exclusivamente al registro y archivo de la documentación presentada por los interesados."
  explanation:
    es: "El artículo 1.2.a) define las Oficinas como espacios que la Administración dedica «exclusiva o prioritariamente al contacto directo con los ciudadanos y sus representantes». Recibir solicitudes es solo una de sus finalidades, y la definición no exige exclusividad. La atención telefónica o telemática no es contacto directo en un espacio físico. El registro y archivo tampoco agota lo que hace la Oficina."
  citation: "art. 1.2.a) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q015
  prompt:
    es: "De acuerdo con el artículo 1.2.b) del Real Decreto 366/2007, de 16 de marzo, los modelos normalizados son:"
  options:
  - id: a
    text:
      es: "Documentos internos que la Administración utiliza para tramitar y archivar los expedientes de los ciudadanos."
  - id: b
    text:
      es: "Formularios electrónicos que solo pueden presentarse a través de la sede electrónica de cada departamento."
  - id: c
    text:
      es: "Impresos que la Administración remite a los ciudadanos para notificarles las resoluciones adoptadas."
  - id: d
    correct: true
    text:
      es: "Impresos puestos a disposición de los ciudadanos para formular solicitudes, declaraciones, alegaciones o recursos."
  explanation:
    es: "El artículo 1.2.b) define los modelos normalizados como «impresos puestos por la Administración General del Estado a disposición de los ciudadanos para formular solicitudes, declaraciones, alegaciones, recursos o cualquier pretensión o manifestación de voluntad». No son documentos internos de tramitación. La definición no los limita al formato electrónico. Sirven para que el ciudadano se dirija a la Administración, no para notificarle resoluciones."
  citation: "art. 1.2.b) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q016
  prompt:
    es: "Según el artículo 2 del Real Decreto 366/2007, de 16 de marzo, ¿mediante cuál de los siguientes medios asegura la Administración General del Estado los derechos de los ciudadanos con discapacidad?"
  options:
  - id: a
    text:
      es: "La acción positiva para compensar las desventajas, aplicable solo en los procedimientos de concurrencia competitiva."
  - id: b
    correct: true
    text:
      es: "La acción positiva para compensar las desventajas que estos ciudadanos pudieran presentar en sus relaciones con la Administración."
  - id: c
    text:
      es: "La garantía de la igualdad de resultados, con independencia de las desventajas que estos ciudadanos pudieran presentar."
  - id: d
    text:
      es: "La exención de los requisitos documentales que se exigen al resto de los ciudadanos en sus relaciones con la Administración."
  explanation:
    es: "La letra b) del artículo 2 recoge «la acción positiva para compensar las desventajas que estos ciudadanos en sus relaciones con la Administración pudieran presentar». El artículo no limita esa acción a los procedimientos de concurrencia competitiva. La letra a) garantiza la igualdad de oportunidades, no de resultados. Ninguna letra exime de los requisitos documentales; la letra c) habla de medios y apoyos suplementarios."
  citation: "art. 2.b) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q017
  prompt:
    es: "¿Qué ha de hacer la Administración General del Estado, para asegurar los derechos de los ciudadanos con discapacidad, con cualquier norma, criterio o práctica que vulnere su igualdad de oportunidades?"
  options:
  - id: a
    text:
      es: "Proceder a su revisión cada tres años."
  - id: b
    correct: true
    text:
      es: "Proceder a su eliminación y corrección."
  - id: c
    text:
      es: "Proceder a su comunicación al Defensor del Pueblo."
  - id: d
    text:
      es: "Proceder a su suspensión hasta que resuelva un juez."
  explanation:
    es: "El artículo 2.d) RD 366/2007 recoge «la eliminación y corrección de cualquier norma, criterio, instrucción, actuación, práctica o decisión que suponga una vulneración de la igualdad de oportunidades de las personas con discapacidad». La revisión cada tres años, la comunicación al Defensor del Pueblo y la suspensión a la espera de un juez no figuran en el artículo."
  citation: "art. 2.d) RD 366/2007"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q018
  prompt:
    es: "Según las recomendaciones del artículo 4.2.a) del Real Decreto 366/2007, de 16 de marzo, con carácter preferente y siempre que resulte posible, la Oficina de Atención al Ciudadano se ubicará:"
  options:
  - id: a
    text:
      es: "En la primera planta, con ascensor accesible."
  - id: b
    text:
      es: "En la planta más próxima al aparcamiento."
  - id: c
    correct: true
    text:
      es: "En planta a nivel de la vía pública."
  - id: d
    text:
      es: "En un edificio de uso exclusivo administrativo."
  explanation:
    es: "El artículo 4.2.a) recomienda que, «con carácter preferente y siempre que resulte posible, la Oficina se ubicará en planta a nivel de la vía pública». Las rampas o ascensores solo entran «en caso contrario», como alternativa, no como ubicación preferente en la primera planta. La cercanía al aparcamiento y el uso exclusivo del edificio no son el criterio de esa letra."
  citation: "art. 4.2.a) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q019
  prompt:
    es: "¿Cómo estarán situados los paneles de información gráfica de la señalización interior accesible de las Oficinas de Atención al Ciudadano de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Perpendicularmente a la dirección de la marcha."
  - id: b
    text:
      es: "Frente a la puerta de entrada, sobre el dintel."
  - id: c
    text:
      es: "Detrás del mostrador, a la vista del empleado."
  - id: d
    correct: true
    text:
      es: "Paralelamente a la dirección de la marcha."
  explanation:
    es: "El artículo 7.a) RD 366/2007 recomienda que los paneles de información gráfica estén «situados paralelamente a la dirección de la marcha» y, siempre que sea posible, adyacentes a alguna pared o superficie. Situarlos perpendicularmente a la marcha contradice esa letra. Sobre el dintel de la puerta o detrás del mostrador no se permite el acercamiento que el mismo artículo exige para interactuar con ellos."
  citation: "art. 7.a) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q020
  prompt:
    es: "En la señalización interior accesible de las Oficinas de Atención al Ciudadano de la Administración General del Estado, la información relevante se dispondrá:"
  options:
  - id: a
    correct: true
    text:
      es: "Al menos, en dos de las tres modalidades sensoriales: visual, acústica y táctil."
  - id: b
    text:
      es: "Al menos, en una de las modalidades sensoriales, a elección de la Oficina."
  - id: c
    text:
      es: "Solo en la modalidad visual, con símbolos estándar internacionales."
  - id: d
    text:
      es: "En la modalidad acústica, cuando lo solicite la persona con discapacidad."
  explanation:
    es: "El artículo 7.c) RD 366/2007 recomienda disponer la información relevante «al menos, en dos de las tres modalidades sensoriales: visual, acústica y táctil». Una sola modalidad a elección de la Oficina, la sola modalidad visual y la acústica a petición del interesado quedan por debajo de ese mínimo de dos."
  citation: "art. 7.c) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q021
  prompt:
    es: "Según las recomendaciones del artículo 8.2 del Real Decreto 366/2007, de 16 de marzo, sobre la configuración de los puestos de atención, los mostradores y puntos de atención:"
  options:
  - id: a
    text:
      es: "Se situarán en una zona reservada y cerrada, separada del espacio de circulación de los usuarios del edificio."
  - id: b
    text:
      es: "Tendrán en toda su longitud una única altura, la de una mesa de trabajo, para todo tipo de usuarios."
  - id: c
    correct: true
    text:
      es: "No dispondrán de vidrios u otros obstáculos que dificulten la transmisión del sonido y la comunicación visual."
  - id: d
    text:
      es: "Contarán con un intérprete de lengua de signos presente durante todo el horario de atención al público."
  explanation:
    es: "El artículo 8.2.c) recomienda que los mostradores y puntos de atención «no dispondrán de vidrios u otros obstáculos que dificultan la transmisión del sonido y la comunicación visual». La letra b) pide que el espacio inmediato a los mostradores esté libre de obstáculos, no separado de la circulación. La letra a) pide que al menos una parte, no toda la longitud, esté a la altura de una mesa de trabajo. Ninguna letra exige un intérprete de lengua de signos presente en todo el horario."
  citation: "art. 8.2.c) RD 366/2007"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q022
  prompt:
    es: "Según el artículo 8.2.e) del Real Decreto 366/2007, de 16 de marzo, ¿con qué fin se dotarán de videotelefonía, de permitirlo técnicamente, los puntos con información telefónica?"
  options:
  - id: a
    text:
      es: "Para verificar la identidad del interlocutor."
  - id: b
    correct: true
    text:
      es: "Para facilitar la lectura labial."
  - id: c
    text:
      es: "Para grabar la atención prestada al ciudadano."
  - id: d
    text:
      es: "Para sustituir la atención presencial en la Oficina."
  explanation:
    es: "El artículo 8.2.e) recomienda dotar los puntos con información telefónica de telefonía de texto, de fax y, de permitirlo técnicamente, de videotelefonía «para facilitar la lectura labial». Verificar la identidad, grabar la atención o sustituir la atención presencial no son la finalidad que da el artículo."
  citation: "art. 8.2.e) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-11
- id: m02-l01-q023
  prompt:
    es: "¿En cuál de los siguientes casos podrán exceptuarse parcialmente las condiciones de accesibilidad de las Oficinas de Atención al Ciudadano de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Cuando la Oficina atienda a menos de cien ciudadanos al mes y disponga además de un servicio de atención telefónica."
  - id: b
    text:
      es: "Cuando así lo acuerde el titular de la Oficina por razones de seguridad del personal que presta servicio en ella."
  - id: c
    text:
      es: "Cuando ninguna persona con discapacidad haya solicitado la adaptación de la Oficina durante el último año natural."
  - id: d
    correct: true
    text:
      es: "Cuando circunstancias de infraestructura o protección del patrimonio hagan su aplicación imposible material o económicamente."
  explanation:
    es: "El artículo 11.1 RD 366/2007 permite exceptuar parcialmente las condiciones del capítulo cuando en el edificio o su entorno «concurran circunstancias de infraestructura o protección del patrimonio que hagan su aplicación imposible material o económicamente». El número de visitas, la decisión del titular de la Oficina por seguridad y la falta de solicitudes de adaptación no son causas de excepción."
  citation: "art. 11.1 RD 366/2007"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2007-6239-art-12
- id: m02-l01-q024
  prompt:
    es: "Según el artículo 12.2 del Real Decreto 366/2007, de 16 de marzo, a requerimiento de la persona con discapacidad, los documentos e impresos:"
  options:
  - id: a
    correct: true
    text:
      es: "Se ofrecerán en formatos alternativos con tipografías grandes o ampliadas, en braille, o con personal de apoyo."
  - id: b
    text:
      es: "Se enviarán a su domicilio por correo certificado, sin coste alguno para ella, en el plazo de diez días."
  - id: c
    text:
      es: "Se ofrecerán únicamente en formato electrónico accesible a través de la sede electrónica del departamento."
  - id: d
    text:
      es: "Se sustituirán por una comparecencia personal ante el funcionario responsable de tramitar el procedimiento."
  explanation:
    es: "El artículo 12.2 dice que, a requerimiento de la persona con discapacidad, los documentos e impresos se ofrecerán «en formatos alternativos utilizando tipografías grandes o ampliadas, en braille, o bien se contará con personal de apoyo para facilitar su cumplimentación». No prevé el envío por correo certificado, no limita los formatos al electrónico y no sustituye el impreso por una comparecencia."
  citation: "art. 12.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2026-18509-art-10
- id: m02-l01-q025
  prompt:
    es: "Según el artículo 10.2.a) del Reglamento de las condiciones básicas de accesibilidad cognitiva, aprobado por el Real Decreto 707/2026, de 2 de septiembre, ¿qué documentos deberán estar disponibles en lectura fácil?"
  options:
  - id: a
    text:
      es: "Solo las resoluciones que pongan fin a los procedimientos administrativos."
  - id: b
    text:
      es: "Los presupuestos y las cuentas anuales de cada organismo público."
  - id: c
    text:
      es: "Las memorias anuales de actividad de cada departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Los formularios o solicitudes y las guías de cumplimentación de procedimientos."
  explanation:
    es: "El artículo 10.2.a) del Reglamento, que se aplica desde el 2 de enero de 2027, impone la «disponibilidad en lectura fácil tanto de formularios o solicitudes, como de las guías de cumplimentación de procedimientos». No limita la obligación a las resoluciones finales, y los presupuestos, las cuentas anuales y las memorias de actividad no están en esa letra."
  citation: "art. 10.2.a) Reglamento aprobado por RD 707/2026"
  difficulty: 3
  tags:
  - "requisito"
