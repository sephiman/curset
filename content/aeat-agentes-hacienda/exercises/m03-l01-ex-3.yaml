# anchor: boe-a-1980-21166-art-11
- id: m03-l01-q0072
  prompt:
    es: "De acuerdo con el artículo 11 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, el Impuesto sobre Hidrocarburos puede cederse con carácter parcial con el límite máximo del 58 por ciento para el tipo estatal general y:"
  options:
  - id: a
    correct: true
    text:
      es: "En su totalidad para el tipo estatal especial y para el tipo autonómico."
  - id: b
    text:
      es: "Con el límite máximo del 50 por ciento para el tipo estatal especial y para el tipo autonómico."
  - id: c
    text:
      es: "En su totalidad para el tipo estatal especial, pero no para el tipo autonómico."
  - id: d
    text:
      es: "En su totalidad para el tipo estatal general y para el tipo autonómico."
  explanation:
    es: "Para el tipo estatal especial y el autonómico la cesión es total. Aplicarles un límite del 50 por ciento los trata como el tipo general. Excluir el tipo autonómico recorta la cesión. Hablar de cesión total del tipo general contradice el límite del 58 por ciento que el artículo le fija."
  citation: "art. 11 LOFCA"
  difficulty: 3
  tags:
