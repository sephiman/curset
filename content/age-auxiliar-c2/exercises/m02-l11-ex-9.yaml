# anchor: fuente-ms-outlook-reglas-html
- id: m02-l11-q042
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué casilla debe activarse si no se quiere que se ejecute ninguna regla después de la que se está creando?"
  options:
  - id: a
    text:
      es: "Activar esta regla"
  - id: b
    text:
      es: "Ejecutar esta nueva regla ahora"
  - id: c
    correct: true
