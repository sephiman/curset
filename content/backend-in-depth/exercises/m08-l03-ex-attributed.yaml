type: quiz
variants:
- id: m08-l03-qa01
  prompt:
    en: 'According to Chris Richardson in Pattern: Transactional outbox, what is the solution for the service that
      sends a message while it updates its business entities?'
  options:
  - id: a
    correct: true
    text:
      en: First store the message in the database within the entities' transaction
  - id: b
    text:
      en: Send the message to the broker in the middle of the database transaction
  - id: c
    text:
      en: Commit the transaction first, then send the message to the broker directly
  - id: d
    text:
      en: Run a traditional two-phase commit spanning the database and the message broker
  explanation:
    en: Richardson writes that the service first stores the message in the database as part of the transaction that
      updates the business entities. He writes that sending a message in the middle of a transaction is not reliable,
      which contradicts sending it to the broker mid-transaction. He writes that after committing there is no guarantee
      the service will not crash before sending, which contradicts sending directly after the commit. He writes
      that a traditional distributed transaction (2PC) spanning the database and the message broker is not viable,
      which contradicts running one.
  citation: microservices-io-transactional-outbox#solution; microservices-io-transactional-outbox#context
- id: m08-l03-qa02
  prompt:
    en: 'According to Chris Richardson in Pattern: Transactional outbox, which statement about the result of applying
      the pattern does the page make?'
  options:
  - id: a
    text:
      en: The relay publishes each message exactly once, even after a crash
  - id: b
    correct: true
    text:
      en: A message consumer must be idempotent, perhaps by tracking message IDs
  - id: c
    text:
      en: Messages are sent whether or not the database transaction commits
  - id: d
    text:
      en: Messages reach the message broker in no guaranteed order
  explanation:
    en: Richardson writes that a message consumer must be idempotent, perhaps by tracking the IDs of the messages
      it has already processed. He writes that the message relay might publish a message more than once, which contradicts
      publishing each message exactly once. He writes that messages are guaranteed to be sent if and only if the
      database transaction commits, which contradicts sending them whether or not it commits. He writes that messages
      are sent to the broker in the order the application sent them, which contradicts no guaranteed order.
  citation: microservices-io-transactional-outbox#result-context
- id: m08-l03-qa03
  prompt:
    en: 'According to Chris Richardson in Pattern: Saga, which statement about sagas does the page make?'
  options:
  - id: a
    text:
      en: A saga relies on a distributed transaction across the services' databases
  - id: b
    text:
      en: A failed step is undone by the automatic rollback of ACID transactions
  - id: c
    correct: true
    text:
      en: A saga is a reliably coordinated sequence of local transactions
  - id: d
    text:
      en: A saga isolates concurrent executions, so data anomalies cannot occur
  explanation:
    en: Richardson writes that a saga is a reliably coordinated sequence of local transactions. He writes that the
      pattern keeps data consistent across services without using distributed transactions, which contradicts relying
      on one. He writes that a saga lacks automatic rollback and a developer must design compensating transactions
      that explicitly undo earlier changes, which contradicts an automatic ACID rollback. He writes that a saga
      lacks isolation and concurrent execution risks data anomalies, which contradicts anomalies being impossible.
  citation: microservices-io-saga#solution; microservices-io-saga#resulting-context
