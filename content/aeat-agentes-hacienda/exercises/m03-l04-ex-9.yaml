# anchor: boe-a-2007-15984-art-110
- id: m03-l04-q0248
  prompt:
    es: "De acuerdo con el artículo 110.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el representante legal debe acreditar su condición ante la Administración tributaria, aunque se pueden considerar representantes a las personas que:"
  options:
  - id: a
    correct: true
    text:
      es: "figuren inscritas como tales en los correspondientes registros públicos."
  - id: b
    text:
      es: "hayan comparecido personalmente ante el órgano administrativo competente."
  - id: c
    text:
      es: "hayan sido designadas por escrito por el representado, sin otra formalidad."
  - id: d
    text:
      es: "hayan actuado con anterioridad ante la Administración tributaria por el representado."
  explanation:
    es: "El artículo 110.3 exige acreditar la condición de representante legal, y permite considerar representantes a quienes figuren inscritos como tales en los registros públicos. La comparecencia personal, la designación escrita sin formalidad y la actuación anterior no bastan."
  citation: "art. 110.3 RGAT"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0250
  prompt:
    es: "¿En cuál de los siguientes casos se entiende otorgada la representación a efectos del artículo 46.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, según el artículo 111.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "Cuando conste en documento privado con firma no legitimada y copia del documento de identidad del representado."
  - id: b
    text:
      es: "Cuando el representante manifieste verbalmente su condición ante cualquier funcionario de la Administración."
  - id: c
    text:
      es: "Cuando el representante figure como asesor fiscal en el registro de colegiados de su colegio profesional."
  - id: d
    correct: true
    text:
      es: "Cuando conste en documento público o en documento privado con firma legitimada notarialmente."
  explanation:
    es: "El artículo 111.2.b) incluye el documento público y el documento privado con firma legitimada notarialmente. Un documento privado sin legitimar, la manifestación verbal ante un funcionario y la inscripción como colegiado no figuran entre los casos del precepto."
  citation: "art. 111.2 RGAT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0251
  prompt:
    es: "De acuerdo con el artículo 111.2.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, se entiende otorgada la representación cuando se otorgue mediante comparecencia personal ante el órgano administrativo competente, lo que se documenta:"
  options:
  - id: a
    correct: true
    text:
      es: "en diligencia."
  - id: b
    text:
      es: "en acta notarial."
  - id: c
    text:
      es: "en un escrito firmado por el representante."
  - id: d
    text:
      es: "en el expediente mediante un informe del órgano."
  explanation:
    es: "La comparecencia personal ante el órgano administrativo competente se documenta en diligencia (art. 111.2.c). No se levanta acta notarial, no basta un escrito del representante y el informe del órgano no es el documento que prevé el precepto."
  citation: "art. 111.2 RGAT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0252
  prompt:
    es: "De acuerdo con el artículo 111.2.a) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, se entiende otorgada la representación cuando su existencia conste:"
  options:
  - id: a
    text:
      es: "inscrita en un registro público, aunque se haya extinguido."
  - id: b
    correct: true
    text:
      es: "inscrita y vigente en un registro público."
  - id: c
    text:
      es: "en el censo tributario del representado."
  - id: d
    text:
      es: "en cualquier escrito del representado dirigido a la Administración."
  explanation:
    es: "La letra a) del artículo 111.2 exige que la representación conste inscrita y vigente en un registro público. La inscripción de una representación extinguida no sirve, y el censo o un escrito cualquiera tampoco son medios del precepto."
  citation: "art. 111.2 RGAT"
  difficulty: 1
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2007-15984-art-112
- id: m03-l04-q0253
  prompt:
    es: "De acuerdo con el artículo 112.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre las actuaciones tributarias realizadas con el representante del obligado:"
  options:
  - id: a
    text:
      es: "Se entienden efectuadas con el representante, que responde de ellas personalmente."
  - id: b
    text:
      es: "Se entienden efectuadas con el obligado solo si este las ratifica."
  - id: c
    text:
      es: "Se entienden efectuadas con el obligado solo en los procedimientos de gestión."
  - id: d
    correct: true
    text:
      es: "Se entienden efectuadas directamente con el obligado tributario."
  explanation:
    es: "El artículo 112.4 dispone que las actuaciones realizadas con el representante se entienden efectuadas directamente con el obligado tributario. No generan responsabilidad personal del representante, no requieren ratificación y no se limitan a los procedimientos de gestión."
  citation: "art. 112.4 RGAT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2007-15984-art-112
- id: m03-l04-q0254
  prompt:
    es: "Según el artículo 112.5 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, acreditada o presumida la representación, ¿a quién corresponde probar su inexistencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Al representado, sin poder alegar vicios causados por él."
  - id: b
    text:
      es: "Al representante, que debe acreditar su poder."
  - id: c
    text:
      es: "A la Administración tributaria, que actúa de oficio."
  - id: d
    text:
      es: "Al órgano que dictó el acto impugnado."
  explanation:
    es: "Acreditada o presumida la representación, corresponde al representado probar su inexistencia (art. 112.5), sin poder alegar como fundamento de la nulidad vicios que él mismo haya causado. No recae en el representante, en la Administración ni en el órgano que dictó el acto."
  citation: "art. 112.5 RGAT"
  difficulty: 1
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2003-23186-art-46
- id: m03-l04-q0255
  prompt:
    es: "De acuerdo con el artículo 46.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son válidos los documentos normalizados de representación que apruebe la Administración tributaria:"
  options:
  - id: a
    text:
      es: "para cualquier procedimiento tributario."
  - id: b
    correct: true
    text:
      es: "para determinados procedimientos."
  - id: c
    text:
      es: "solo para los procedimientos de gestión."
  - id: d
    text:
      es: "únicamente cuando se presenten por vía electrónica."
  explanation:
    es: "El artículo 46.2 reconoce la validez de los documentos normalizados que apruebe la Administración para determinados procedimientos. No sirven para cualquier procedimiento, no se limitan a la gestión y no se condicionan a su presentación electrónica."
  citation: "art. 46.2 LGT"
  difficulty: 1
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2007-15984-art-112
- id: m03-l04-q0260
  prompt:
    es: "De acuerdo con el artículo 112.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la representación debe acreditarse:"
  options:
  - id: a
    text:
      es: "antes de iniciarse cualquier procedimiento tributario."
  - id: b
    text:
      es: "en el plazo de diez días desde el inicio del procedimiento."
  - id: c
    text:
      es: "en la última actuación del procedimiento, antes de su resolución definitiva."
  - id: d
    correct: true
    text:
      es: "en la primera actuación que se realice por medio de representante."
  explanation:
    es: "El artículo 112.1 manda acreditar la representación en la primera actuación realizada por medio de representante, y su falta o insuficiencia no impide tener por realizado el acto si se subsana en diez días desde el día siguiente a la notificación del requerimiento. No es anterior al procedimiento, el plazo de diez días es de subsanación y la acreditación no se deja para la última actuación."
  citation: "art. 112.1 RGAT"
  difficulty: 2
  tags:
  - "requisito"
  - "fecha"
# anchor: boe-a-2007-15984-art-2
- id: m03-l04-q0265
  prompt:
    es: "Según el artículo 2.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuál de los siguientes datos incluye cualquier censo tributario solo «en su caso»?"
  options:
  - id: a
    text:
      es: "El domicilio fiscal del obligado tributario."
  - id: b
    correct: true
    text:
      es: "El domicilio en el extranjero del obligado tributario."
  - id: c
    text:
      es: "El número de identificación fiscal del obligado tributario."
  - id: d
    text:
      es: "El nombre y apellidos o la razón social o denominación completa."
  explanation:
    es: "El artículo 2.2 enumera los datos que todo censo incluye necesariamente y solo el domicilio en el extranjero lleva la cautela «en su caso». El nombre o razón social, el número de identificación fiscal y el domicilio fiscal constan siempre."
  citation: "art. 2.2 RGAT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-15984-art-3
- id: m03-l04-q0266
  prompt:
    es: "¿De qué censo forma parte el Registro de grandes empresas, según el artículo 3.5 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Del Censo de Empresarios, Profesionales y Retenedores."
  - id: b
    text:
      es: "Del Registro de operadores intracomunitarios."
  - id: c
    text:
      es: "Del Registro de devolución mensual."
  - id: d
    text:
      es: "Solo del Censo de Obligados Tributarios, sin formar parte del Censo de Empresarios, Profesionales y Retenedores."
  explanation:
    es: "El artículo 3.5 dice que el Registro de grandes empresas forma parte del Censo de Empresarios, Profesionales y Retenedores. El Registro de operadores intracomunitarios y el de devolución mensual son otros registros de ese censo y no lo contienen. Decir que solo pertenece al Censo de Obligados Tributarios contradice el texto."
  citation: "art. 3.5 RGAT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0267
  prompt:
    es: "De acuerdo con el artículo 11.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, presentan la declaración de baja en el Censo de Empresarios, Profesionales y Retenedores quienes cesen en toda actividad empresarial o profesional o, sin serlo:"
  options:
  - id: a
    text:
      es: "dejen de presentar autoliquidaciones periódicas del Impuesto sobre la Renta de las Personas Físicas."
  - id: b
    text:
      es: "cambien su domicilio fiscal a otra Administración tributaria."
  - id: c
    text:
      es: "dejen de ser titulares de un número de identificación fiscal."
  - id: d
    correct: true
    text:
      es: "dejen de satisfacer rendimientos sujetos a retención o ingreso a cuenta."
  explanation:
    es: "El artículo 11.1 impone la baja a quien cesa en toda actividad empresarial o profesional y a quien, sin serlo, deja de satisfacer rendimientos sujetos a retención o ingreso a cuenta. Dejar de presentar autoliquidaciones, cambiar de domicilio o perder el número de identificación fiscal no son hechos que determinen la baja."
  citation: "art. 11.1 RGAT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0268
  prompt:
    es: "De acuerdo con el artículo 11.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los herederos presentan la declaración de baja en el plazo de seis meses desde el fallecimiento y, en su caso, en ese mismo plazo presentan:"
  options:
  - id: a
    text:
      es: "la solicitud de revocación del número de identificación fiscal del causante."
  - id: b
    text:
      es: "la declaración de cese de las obligaciones tributarias pendientes del causante."
  - id: c
    correct: true
    text:
      es: "la declaración o declaraciones de alta que sean procedentes."
  - id: d
    text:
      es: "la renuncia a la herencia ante la Administración tributaria."
  explanation:
    es: "Junto con la baja y la comunicación de la modificación de titularidad, el artículo 11.4 manda presentar, en su caso, la declaración o declaraciones de alta que sean procedentes. Los herederos no solicitan la revocación del número ni declaran el cese de obligaciones del causante, que se transmiten con la herencia, ni renuncian a ella ante la Administración tributaria."
  citation: "art. 11.4 RGAT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2007-15984-art-2
- id: m03-l04-q0270
  prompt:
    es: "De acuerdo con el artículo 2.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, cualquier censo tributario incluye necesariamente el nombre y apellidos o razón social o denominación completa del obligado, así como el anagrama:"
  options:
  - id: a
    text:
      es: "si el obligado figura inscrito en el Registro Mercantil."
  - id: b
    text:
      es: "cuando el obligado sea una persona jurídica."
  - id: c
    text:
      es: "cuando el obligado lo solicite expresamente."
  - id: d
    correct: true
    text:
      es: "si el obligado tributario lo tuviera."
  explanation:
    es: "El artículo 2.2.a) añade al nombre, razón social o denominación el anagrama si el obligado lo tuviera. No depende de la inscripción en el Registro Mercantil, de que sea persona jurídica ni de que el obligado lo pida."
  citation: "art. 2.2 RGAT"
  difficulty: 1
  tags:
  - "condición"
