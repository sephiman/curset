- id: g-quantile
  term: {en: φ-quantile}
  definition: {en: "The φ-quantile is the observation value that ranks at number φ*N among the N observations, where 0 ≤ φ ≤ 1. The 0.5-quantile is known as the median, and the 0.95-quantile is also called the 95th percentile."}
  origin: m09-l01
  citation: "prom-histograms#quantiles"
- id: g-idempotency-key
  term: {en: idempotency key}
  definition: {en: "An idempotency key is a unique value generated by the client which the resource uses to recognize subsequent retries of the same request. The Idempotency-Key HTTP request header field carries this value."}
  origin: m09-l01
  citation: "ietf-httpapi-idempotency-key#content"
