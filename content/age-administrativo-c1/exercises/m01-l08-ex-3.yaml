# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q030
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano del Ministerio ostenta su representación ordinaria y dirige los servicios comunes?"
  options:
  - id: a
    text:
      es: "El Ministro, como titular del Departamento ministerial."
  - id: b
    correct: true
    text:
      es: "El titular de la Subsecretaría del Ministerio."
  - id: c
    text:
      es: "El titular de la Secretaría General Técnica."
  - id: d
    text:
      es: "El titular de la Secretaría de Estado."
  explanation:
    es: "El artículo 63.1 dice: «Los Subsecretarios ostentan la representación ordinaria del Ministerio, dirigen los servicios comunes». El Secretario general técnico depende del Subsecretario y tiene competencias sobre servicios comunes, pero no los dirige ni representa al Ministerio (art. 65.1). Los Secretarios de Estado y el Ministro no tienen atribuida la representación ordinaria."
  citation: "art. 63.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q031
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia en materia de personal corresponde en todo caso a los Subsecretarios de los Ministerios?"
  options:
  - id: a
    text:
      es: "Aprobar las relaciones de puestos de trabajo de todo el Departamento."
  - id: b
    correct: true
    text:
      es: "Desempeñar la jefatura superior de todo el personal del Departamento."
  - id: c
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  - id: d
    text:
      es: "Nombrar y separar a los Directores generales del Departamento."
  explanation:
    es: "El artículo 63.1.f atribuye al Subsecretario «Desempeñar la jefatura superior de todo el personal del Departamento». La separación del servicio la impone el Ministro (art. 61.s). Los Directores generales se nombran por Real Decreto del Consejo de Ministros (art. 66.2). En materia de relaciones de puestos de trabajo el Subsecretario solo asiste a los órganos superiores (art. 63.1.e)."
  citation: "art. 63.1.f LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q032
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué alcance tiene la potestad disciplinaria que ejercen los Subsecretarios sobre el personal del Departamento?"
  options:
  - id: a
    correct: true
    text:
      es: "Se extiende a las faltas graves o muy graves, salvo la separación del servicio."
  - id: b
    text:
      es: "Se extiende a las faltas leves, graves y muy graves, sin excepción alguna."
  - id: c
    text:
      es: "Se extiende a las faltas muy graves, incluida la sanción de separación del servicio."
  - id: d
    text:
      es: "Se limita a las faltas leves y graves, salvo la suspensión de funciones."
  explanation:
    es: "El artículo 63.1.ñ atribuye al Subsecretario la potestad disciplinaria «por faltas graves o muy graves, salvo la separación del servicio». La separación del servicio queda fuera porque la impone el Ministro (art. 61.s). La ley no le da la potestad sin excepción ni la limita a faltas leves y graves."
  citation: "art. 63.1.ñ LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q033
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia corresponde a los Subsecretarios respecto de las pruebas selectivas de personal?"
  options:
  - id: a
    text:
      es: "Convocar las pruebas selectivas de personal funcionario, cuya resolución corresponde al Ministro."
  - id: b
    text:
      es: "Resolver las pruebas selectivas de personal laboral, cuya convocatoria corresponde al Consejo de Ministros."
  - id: c
    text:
      es: "Proponer al Ministro la convocatoria de las pruebas selectivas de personal funcionario y laboral."
  - id: d
    correct: true
    text:
      es: "Convocar y resolver las pruebas selectivas de personal funcionario y laboral."
  explanation:
    es: "El artículo 63.1.m atribuye al Subsecretario «Convocar y resolver pruebas selectivas de personal funcionario y laboral». Las dos fases son suyas y abarcan los dos tipos de personal. La ley no reparte la convocatoria y la resolución con el Ministro o el Consejo de Ministros, ni reduce su papel a proponer."
  citation: "art. 63.1.m LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q034
  prompt:
    es: "De acuerdo con el artículo 63.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios serán nombrados y separados por Real Decreto del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "A propuesta del titular del Ministerio o del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Secretario de Estado del que dependan."
  - id: c
    correct: true
    text:
      es: "A propuesta del titular del Ministerio."
  - id: d
    text:
      es: "A propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 63.3 dice que los Subsecretarios se nombran y separan «por Real Decreto del Consejo de Ministros a propuesta del titular del Ministerio». La propuesta alternativa del Presidente del Gobierno es la de los Secretarios generales y los Directores generales (arts. 64.3 y 66.2). El Subsecretario no depende de un Secretario de Estado: depende del Ministro (art. 60.1)."
  citation: "art. 63.3 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q035
  prompt:
    es: "El nombramiento y la separación de los Subsecretarios de los Ministerios de la Administración General del Estado corresponden:"
  options:
  - id: a
    text:
      es: "Al Secretario de Estado del área, previa autorización del titular del Ministerio."
  - id: b
    correct: true
    text:
      es: "Al Consejo de Ministros, mediante Real Decreto, a propuesta del titular del Ministerio."
  - id: c
    text:
      es: "Al titular del Ministerio, mediante orden ministerial publicada en el Boletín Oficial del Estado."
  - id: d
    text:
      es: "Al Rey, a propuesta del Presidente del Gobierno, igual que en el caso de los Ministros."
  explanation:
    es: "El artículo 63.3 de la Ley 40/2015 dice que los Subsecretarios se nombran y separan «por Real Decreto del Consejo de Ministros a propuesta del titular del Ministerio». El Ministro propone pero no nombra por orden. El Rey nombra a los Ministros (art. 12.2 Ley 50/1997), no a los Subsecretarios. Los Secretarios de Estado nombran a los Subdirectores Generales de su Secretaría (art. 62.2.c), no a Subsecretarios."
  citation: "art. 63.3 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q036
  prompt:
    es: "Según el artículo 63.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios se nombran entre funcionarios de carrera del Subgrupo A1 del Estado, de las Comunidades Autónomas o de las Entidades locales:"
  options:
  - id: a
    text:
      es: "O, excepcionalmente, entre personas ajenas a la función pública, mediante memoria razonada."
  - id: b
    text:
      es: "Que se encuentren en servicio activo, sin que quepa nombrar a funcionarios jubilados."
  - id: c
    correct: true
    text:
      es: "O entre personas que hubieran perdido tal condición como consecuencia de su jubilación."
  - id: d
    text:
      es: "Con una antigüedad mínima de diez años en cuerpos o escalas del Subgrupo A1."
  explanation:
    es: "El artículo 63.3 permite nombrar a funcionarios de carrera del Subgrupo A1 «o entre personas que hubieran perdido tal condición como consecuencia de su jubilación». La ley no pide antigüedad mínima. La excepción con memoria razonada existe solo para los Directores generales (art. 66.2). Los jubilados sí pueden ser nombrados."
  citation: "art. 63.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q037
  prompt:
    es: "¿Cuál de los siguientes requisitos exige la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público para el nombramiento de los Secretarios generales de los Ministerios?"
  options:
  - id: a
    text:
      es: "La pertenencia a la Carrera Diplomática o a otro Cuerpo del Subgrupo A1 del Estado."
  - id: b
    text:
      es: "La condición de funcionario de carrera del Subgrupo A1 con diez años de experiencia en la gestión pública."
  - id: c
    correct: true
    text:
      es: "Cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada."
  - id: d
    text:
      es: "La condición de funcionario de carrera del Subgrupo A1 del Estado, de las Comunidades Autónomas o de las Entidades locales."
  explanation:
    es: "El artículo 64.3 dice que los Secretarios generales se nombran «entre personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada». No se exige ser funcionario: esa condición se pide a Subsecretarios, Secretarios generales técnicos y Directores generales (arts. 63.3, 65.3 y 66.2). La Carrera Diplomática y los diez años de experiencia no aparecen en el artículo."
  citation: "art. 64.3 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q038
  prompt:
    es: "Según el artículo 64.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales, con categoría de Subsecretario, son nombrados y separados por Real Decreto del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "Únicamente a propuesta del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Subsecretario del Ministerio, oído el titular del Departamento."
  - id: c
    correct: true
    text:
      es: "A propuesta del titular del Ministerio o del Presidente del Gobierno."
  - id: d
    text:
      es: "Únicamente a propuesta del titular del Ministerio."
  explanation:
    es: "El artículo 64.3 dice que se nombran y separan por Real Decreto del Consejo de Ministros «a propuesta del titular del Ministerio o del Presidente del Gobierno». Cualquiera de los dos puede proponer, así que las opciones que reservan la propuesta a uno solo son incorrectas. El Subsecretario no propone el nombramiento."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q039
  prompt:
    es: "De acuerdo con el artículo 65.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales técnicos, bajo la inmediata dependencia del Subsecretario, tienen en todo caso las competencias relativas a:"
  options:
  - id: a
    correct: true
    text:
      es: "Producción normativa, asistencia jurídica y publicaciones."
  - id: b
    text:
      es: "Gestión de recursos humanos, gestión financiera y publicaciones."
  - id: c
    text:
      es: "Inspección de servicios, asistencia jurídica y estadística para fines estatales."
  - id: d
    text:
      es: "Producción normativa, representación ordinaria del Ministerio y publicaciones."
  explanation:
    es: "El artículo 65.1 atribuye en todo caso a los Secretarios generales técnicos las competencias «relativas a producción normativa, asistencia jurídica y publicaciones». Recursos humanos, gestión financiera, inspección y estadística son servicios comunes (art. 68.1), pero el artículo 65.1 no los reserva al Secretario general técnico. La representación ordinaria del Ministerio es del Subsecretario (art. 63.1)."
  citation: "art. 65.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q040
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Directores generales se nombran entre funcionarios de carrera del Subgrupo A1 o jubilados que lo fueron, salvo que:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros lo acuerde a propuesta del Presidente del Gobierno, sin necesidad de motivación."
  - id: b
    text:
      es: "El candidato acredite diez años de experiencia en puestos directivos de la gestión privada."
  - id: c
    correct: true
    text:
      es: "El Real Decreto de estructura lo permita por las características específicas de las funciones de la Dirección General."
  - id: d
    text:
      es: "El Ministro lo autorice mediante orden, por razones de urgencia debidamente justificadas."
  explanation:
    es: "El artículo 66.2 admite la excepción cuando «el Real Decreto de estructura permita que, en atención a las características específicas de las funciones de la Dirección General, su titular no reúna dicha condición de funcionario». La excepción va en el Real Decreto de estructura, no en una orden ministerial ni en un acuerdo sin motivar: exige memoria razonada. La ley no prevé una excepción por años de experiencia privada."
  citation: "art. 66.2 LRJSP"
  difficulty: 1
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q041
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cómo debe motivarse la excepción que permite nombrar Director general a quien no sea funcionario?"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante memoria razonada que justifique las especiales características de las funciones."
  - id: b
    text:
      es: "Mediante informe preceptivo del Consejo de Estado sobre la idoneidad del candidato."
  - id: c
    text:
      es: "Mediante informe favorable de la Oficina de Conflictos de Intereses."
  - id: d
    text:
      es: "Mediante acuerdo del Consejo de Ministros adoptado a propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 66.2 exige «motivarse mediante memoria razonada la concurrencia de las especiales características que justifiquen esa circunstancia excepcional». El artículo no pide informe del Consejo de Estado ni de la Oficina de Conflictos de Intereses. El acuerdo del Consejo de Ministros es la forma del nombramiento, no la motivación de la excepción."
  citation: "art. 66.2 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q042
  prompt:
    es: "Señale la respuesta correcta sobre el nombramiento de los Directores generales de los Ministerios, conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Se nombran solo entre funcionarios de carrera del Subgrupo A1 en servicio activo, excluidos los jubilados."
  - id: b
    text:
      es: "Se nombran entre personas con cualificación y experiencia en la gestión pública o privada, sin ningún otro requisito de pertenencia a la función pública."
  - id: c
    correct: true
    text:
      es: "Con carácter general, se nombran entre funcionarios de carrera del Subgrupo A1 o personas que perdieron esa condición por jubilación."
  - id: d
    text:
      es: "Se nombran entre funcionarios de carrera de los Subgrupos A1 o A2 que acrediten al menos cinco años de servicios."
  explanation:
    es: "El artículo 66.2 manda nombrar a los Directores generales entre funcionarios de carrera del Subgrupo A1 «o entre personas que hubieran perdido tal condición como consecuencia de su jubilación», salvo la excepción del Real Decreto de estructura. El Subgrupo A2 no basta y la ley no pide años de servicio. Los jubilados no están excluidos. La cualificación y experiencia en la gestión pública o privada es el requisito de los Secretarios generales (art. 64.3)."
  citation: "art. 66.2 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q043
  prompt:
    es: "En la organización central de la Administración General del Estado, los Directores generales son nombrados y separados por:"
  options:
  - id: a
    correct: true
    text:
      es: "Real Decreto del Consejo de Ministros, a propuesta del titular del Departamento o del Presidente del Gobierno."
  - id: b
    text:
      es: "El Ministro, Secretario de Estado o Subsecretario del que dependan, por libre designación."
  - id: c
    text:
      es: "Real Decreto del Presidente del Gobierno, a propuesta del titular del Departamento y previa deliberación del Consejo de Ministros."
  - id: d
    text:
      es: "Orden del titular del Departamento, previo conocimiento del Consejo de Ministros."
  explanation:
    es: "El artículo 66.2 de la Ley 40/2015 dice que los Directores generales «serán nombrados y separados por Real Decreto del Consejo de Ministros, a propuesta del titular del Departamento o del Presidente del Gobierno». El nombramiento por el Ministro, Secretario de Estado o Subsecretario es el de los Subdirectores generales (art. 67.2). El Real Decreto es del Consejo de Ministros, no del Presidente, y no basta una orden ministerial."
  citation: "art. 66.2 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
