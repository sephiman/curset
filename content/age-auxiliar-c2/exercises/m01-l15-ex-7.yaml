# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q078
  prompt:
    es: "De acuerdo con el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán la estimación de los beneficios fiscales que afecten a los tributos:"
  options:
  - id: a
    text:
      es: "Propios de las Comunidades Autónomas, aunque los gestione el Estado."
  - id: b
    correct: true
    text:
      es: "Del Estado, y no los propios de otras Administraciones territoriales."
  - id: c
    text:
      es: "De las Entidades Locales, como el impuesto sobre bienes inmuebles."
  - id: d
    text:
      es: "De las entidades de presupuesto estimativo, como los consorcios."
  explanation:
    es: "El artículo 33.2.e) incluye la estimación de los beneficios fiscales que afecten a los tributos del Estado. Los tributos propios de las Comunidades Autónomas y los de las Entidades Locales son de otras Administraciones, y las entidades de presupuesto estimativo no son titulares de tributos."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q079
  prompt:
    es: "Según el artículo 40.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la clasificación por programas permite a los centros gestores establecer los objetivos a conseguir de acuerdo con:"
  options:
  - id: a
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "El Consejo de Ministros."
  - id: c
    text:
      es: "El Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "El Ministerio de Hacienda."
  explanation:
    es: "El artículo 40.1.b) dice que los centros gestores establecen los objetivos «de acuerdo con el Ministerio de Hacienda». Ni la Intervención General ni el Consejo de Ministros ni el Tribunal de Cuentas intervienen en esa fijación según el artículo."
  citation: "art. 40.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q080
  prompt:
    es: "Según el anexo II de la Orden HAC/557/2026, de 3 de junio, ¿qué denominación recibe el capítulo 5 de la clasificación económica de gastos?"
  options:
  - id: a
    text:
      es: "Imprevistos y créditos extraordinarios del ejercicio."
  - id: b
    correct: true
    text:
      es: "Fondo de contingencia y otros imprevistos."
  - id: c
    text:
      es: "Reservas de crédito para gastos plurianuales futuros."
  - id: d
    text:
      es: "Dotaciones de contingencia para gastos de personal."
  explanation:
    es: "El capítulo 5 se denomina «Fondo de contingencia y otros imprevistos», y es el único capítulo que no es de operaciones corrientes, de capital ni financieras. Las otras denominaciones no existen en el anexo II."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q081
  prompt:
    es: "Según el artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué clase de operaciones se distinguen los gastos financieros de la clasificación económica?"
  options:
  - id: a
    text:
      es: "En las financieras, junto a los activos financieros y los pasivos financieros."
  - id: b
    correct: true
    text:
      es: "En las corrientes, junto a los gastos de personal y las transferencias corrientes."
  - id: c
    text:
      es: "En las de capital, junto a las inversiones reales y las transferencias de capital."
  - id: d
    text:
      es: "En el Fondo de Contingencia, junto a los imprevistos de ejecución presupuestaria."
  explanation:
    es: "Entre las operaciones corrientes se distinguen los gastos de personal, los gastos corrientes en bienes y servicios, los gastos financieros y las transferencias corrientes. Que se llamen «financieros» no los lleva a las operaciones financieras, que distinguen solo activos y pasivos financieros; las de capital reúnen inversiones reales y transferencias de capital."
  citation: "art. 40.1.c) LGP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q082
  prompt:
    es: "En la aplicación 33.101.921O.227.06, el código 227 es un concepto del artículo 22 del anexo II de la Orden HAC/557/2026, de 3 de junio. ¿Cómo se denomina?"
  options:
  - id: a
    correct: true
    text:
      es: "Recibe la denominación de «Trabajos realizados por otras empresas y profesionales»."
  - id: b
    text:
      es: "Recibe la denominación de «Gastos diversos»."
  - id: c
    text:
      es: "Recibe la denominación de «Suministros»."
  - id: d
    text:
      es: "Recibe la denominación de «Transportes»."
  explanation:
    es: "El concepto 227 es «Trabajos realizados por otras empresas y profesionales». Los gastos diversos son el concepto 226, los suministros el 221 y los transportes el 223; cada uno tiene su código propio dentro del artículo 22."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q083
  prompt:
    es: "De acuerdo con el artículo 33.2.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán los derechos a reconocer durante el ejercicio por:"
  options:
  - id: a
    text:
      es: "Las entidades del artículo 33.1.b), de presupuesto estimativo."
  - id: b
    text:
      es: "Únicamente la Administración General del Estado, sin sus organismos autónomos."
  - id: c
    correct: true
    text:
      es: "Los sujetos del artículo 33.1.a), de presupuesto limitativo."
  - id: d
    text:
      es: "Las Comunidades Autónomas, por los tributos que el Estado les ceda."
  explanation:
    es: "El artículo 33.2.b) habla de los derechos que reconocerán los entes del párrafo anterior, es decir, los sujetos del 33.1.a). Las entidades de presupuesto estimativo aparecen en la letra c), con sus operaciones. El artículo no reduce los sujetos a la Administración General del Estado ni incluye a las Comunidades Autónomas."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-51
- id: m01-l15-q084
  prompt:
    es: "Según el artículo 51 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué enumeración recoge todas las modificaciones con las que durante el ejercicio puede variar la cuantía y finalidad de los créditos?"
  options:
  - id: a
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito, y anticipos de tesorería."
  - id: b
    text:
      es: "Transferencias, ampliaciones, créditos extraordinarios y suplementos de crédito, incorporaciones y prórrogas de crédito."
  - id: c
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito."
  - id: d
    correct: true
    text:
      es: "Transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos de crédito, e incorporaciones."
  explanation:
    es: "El artículo 51 enumera cinco clases: transferencias, generaciones, ampliaciones, créditos extraordinarios y suplementos, e incorporaciones. La opción con anticipos de tesorería cambia las incorporaciones por una figura que el artículo 60 regula aparte y que no modifica créditos. La opción con prórrogas de crédito añade una figura ajena al artículo y omite las generaciones. La que termina en suplementos de crédito deja fuera las incorporaciones."
  citation: "art. 51 LGP"
  difficulty: 1
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q087
  prompt:
    es: "Un ministerio quiere transferir 150.000 euros de un crédito del capítulo 8 «Activos financieros» a un crédito del capítulo 2 de su mismo programa, sin que concurra ninguna excepción legal. ¿Puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 52.1.a) prohíbe transferir desde créditos para operaciones financieras al resto de los créditos."
  - id: b
    text:
      es: "Sí, con el informe favorable de la Intervención Delegada, porque ambos créditos pertenecen al mismo programa y a la misma sección."
  - id: c
    text:
      es: "Sí, si la transferencia la autoriza el Ministro de Hacienda, porque la Ley 31/2022 le reserva las que afectan al capítulo 8."
  - id: d
    text:
      es: "Sí, pero solo si el Gobierno la acuerda a propuesta del Ministro de Hacienda y a iniciativa del ministro afectado."
  explanation:
    es: "El capítulo 8 es una operación financiera y el artículo 52.1.a) impide transferir desde esos créditos al resto. El informe de la Intervención Delegada no levanta la restricción, que se aplica aunque programa y sección coincidan. Que la Ley 31/2022 atribuya al Ministro de Hacienda las variaciones del capítulo 8 fija quién autoriza, no deroga la prohibición, y el artículo 10.Uno de esa ley solo exime las transferencias de capital a corrientes. La iniciativa conjunta del Gobierno y los ministros afectados es la vía de las reorganizaciones entre secciones, que aquí no concurren."
  citation: "art. 52.1.a) LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q088
  prompt:
    es: "Según el artículo 52.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué créditos no podrán minorarse mediante transferencias, con carácter general?"
  options:
  - id: a
    text:
      es: "Los créditos que se hayan incorporado al ejercicio como remanentes de crédito del ejercicio anterior."
  - id: b
    text:
      es: "Los créditos de la sección 06 Deuda Pública."
  - id: c
    correct: true
    text:
      es: "Los créditos extraordinarios y los que se hayan suplementado o ampliado en el ejercicio."
  - id: d
    text:
      es: "Los créditos destinados a gastos corrientes en bienes y servicios."
  explanation:
    es: "La letra c) impide minorar créditos extraordinarios y créditos suplementados o ampliados en el ejercicio. Los remanentes incorporados no aparecen en esa lista. La sección 06 Deuda Pública es precisamente una de las excepciones de la letra, de modo que sí puede minorarse. Los gastos corrientes en bienes y servicios tampoco están protegidos: el artículo 63.1.a) incluso prevé crear créditos nuevos para ellos."
  citation: "art. 52.1.c) LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q089
  prompt:
    es: "La restricción del artículo 52.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria sobre minorar créditos ampliados no afecta a los créditos ampliables de la Seguridad Social ni a:"
  options:
  - id: a
    correct: true
    text:
      es: "los créditos de la sección 06 Deuda Pública."
  - id: b
    text:
      es: "los créditos de la sección 07 Clases Pasivas."
  - id: c
    text:
      es: "los créditos del programa de contratación centralizada."
  - id: d
    text:
      es: "los créditos del Fondo de Contingencia de ejecución presupuestaria."
  explanation:
    es: "La letra c) del artículo 52.1 dice que las transferencias no minorarán créditos extraordinarios o créditos suplementados o ampliados en el ejercicio, y su segundo párrafo exceptúa dos supuestos: «créditos con carácter ampliable de las entidades que integran el sistema de la Seguridad Social» y los que afecten «a créditos de la sección 06 Deuda Pública». Los créditos de Clases Pasivas, los del Fondo de Contingencia y los del programa de contratación centralizada no están en ese párrafo. El programa de contratación centralizada es la excepción de otra regla, la de la letra b), sobre transferencias entre secciones distintas."
  citation: "art. 52.1.c) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q090
  prompt:
    es: "En marzo se aprobó un suplemento de crédito para una aplicación presupuestaria de gastos corrientes. En junio se propone minorar esa aplicación para dotar otra del mismo programa. ¿Puede hacerse mediante transferencia?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 52.1.c) no permite minorar créditos que se hayan suplementado en el ejercicio, aunque la transferencia sea del mismo programa."
  - id: b
    text:
      es: "Sí, siempre que el titular del ministerio la autorice con informe favorable de la Intervención Delegada."
  - id: c
    text:
      es: "Sí, porque la restricción afecta solo a los créditos extraordinarios y no a los suplementados."
  - id: d
    text:
      es: "Sí, pero solo en la parte del crédito que no procediera del suplemento aprobado en marzo."
  explanation:
    es: "La letra c) impide minorar créditos extraordinarios y también los suplementados o ampliados en el ejercicio, sin salvar un porcentaje ni una parte del crédito. Ni el informe de la Intervención Delegada ni la competencia del titular del ministerio sustituyen esa prohibición. Decir que solo afecta a los extraordinarios omite los suplementados que nombra la letra."
  citation: "art. 52.1.c) LGP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q091
  prompt:
    es: "En el ámbito de la Seguridad Social, el artículo 52.1.d) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria no permite minorar créditos ampliables salvo para:"
  options:
  - id: a
    text:
      es: "financiar créditos para la acción protectora no contributiva y universal."
  - id: b
    correct: true
    text:
      es: "financiar otros créditos que también sean ampliables."
  - id: c
    text:
      es: "atender gastos de personal de la propia entidad."
  - id: d
    text:
      es: "financiar créditos extraordinarios aprobados en el ejercicio."
  explanation:
    es: "La letra d) permite minorar créditos ampliables de la Seguridad Social solo para financiar otros créditos ampliables. La acción protectora no contributiva aparece en el artículo 63 como supuesto que exige informe del Ministerio de Hacienda, no como excepción de esta letra. Los gastos de personal y los créditos extraordinarios no figuran en la letra d)."
  citation: "art. 52.1.d) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q092
  prompt:
    es: "Según el artículo 52.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál de las siguientes transferencias queda fuera de las restricciones del apartado 1?"
  options:
  - id: a
    text:
      es: "La que se realice desde créditos para operaciones financieras a créditos de personal."
  - id: b
    correct: true
    text:
      es: "La que haya de realizarse como consecuencia de una reorganización administrativa."
  - id: c
    text:
      es: "La que minore un crédito extraordinario concedido durante el ejercicio."
  - id: d
    text:
      es: "La que cree un crédito para una subvención nominativa no conforme con la Ley General de Subvenciones."
  explanation:
    es: "El artículo 52.2 libera de las restricciones del apartado 1 las transferencias que hayan de realizarse por reorganizaciones administrativas. Las otras tres siguen sometidas a sus reglas: transferir desde créditos financieros lo prohíbe la letra a), minorar créditos extraordinarios lo prohíbe la letra c) y crear créditos para subvenciones nominativas fuera de la Ley General de Subvenciones lo prohíbe el apartado 3."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q094
  prompt:
    es: "Por el traspaso de unos servicios a una comunidad autónoma, el Estado debe pasar créditos de la sección de un ministerio a otra sección distinta. ¿Puede hacerse pese a la prohibición de transferir entre secciones?"
  options:
  - id: a
    text:
      es: "No, porque el artículo 52.1.b) prohíbe toda transferencia entre secciones presupuestarias, sin que el traspaso de competencias sea excepción."
  - id: b
    text:
      es: "No, salvo que se trate de créditos del programa de contratación centralizada, única excepción a la prohibición entre secciones."
  - id: c
    text:
      es: "Sí, pero solo si los créditos proceden de operaciones corrientes y se pasan a créditos de operaciones de capital."
  - id: d
    correct: true
    text:
      es: "Sí, porque el artículo 52.2 excluye de las restricciones las transferencias por traspaso de competencias a comunidades autónomas."
  explanation:
    es: "El artículo 52.2 saca de las restricciones del apartado 1, y con ellas de la prohibición entre secciones, las transferencias que se hagan por traspaso de competencias a comunidades autónomas. Decir que la prohibición no admite excepciones contradice ese apartado. La contratación centralizada es otra excepción distinta, que aquí no concurre. El tipo de operación de origen y destino no condiciona esta excepción."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q096
  prompt:
    es: "Según el artículo 52.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las transferencias nunca podrán crear créditos para subvenciones nominativas, salvo que:"
  options:
  - id: a
    text:
      es: "las autorice el titular del ministerio con informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "se realicen entre créditos de un mismo programa y de un mismo servicio del ministerio."
  - id: c
    correct: true
    text:
      es: "sean conformes con la Ley General de Subvenciones o vayan a otros entes del sector público."
  - id: d
    text:
      es: "las acuerde el Gobierno a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados."
  explanation:
    es: "El apartado 3 admite crear o aumentar créditos para subvenciones nominativas solo si la transferencia es conforme con la Ley General de Subvenciones o se destina a otros entes del sector público. Ni la autorización del titular del ministerio, ni que coincidan programa y servicio, ni el acuerdo del Gobierno aparecen como excepción en ese apartado."
  citation: "art. 52.3 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q098
  prompt:
    es: "Según el artículo 52.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, una transferencia desde créditos para operaciones corrientes a créditos para operaciones de capital:"
  options:
  - id: a
    text:
      es: "queda prohibida en todo caso, porque la letra a) protege los créditos para operaciones corrientes."
  - id: b
    text:
      es: "queda prohibida salvo que la autorice el Gobierno, a propuesta del Ministro de Hacienda, en acuerdo motivado."
  - id: c
    text:
      es: "queda prohibida salvo que se realice entre créditos del mismo programa y de la misma sección presupuestaria."
  - id: d
    correct: true
    text:
      es: "no queda prohibida por esa letra, que solo impide transferir desde financieras al resto y de capital a corrientes."
  explanation:
    es: "La letra a) cierra dos caminos: desde operaciones financieras al resto y desde capital a corrientes. El camino inverso, de corrientes a capital, no está vedado. Las otras opciones inventan una prohibición con excepciones que el artículo no contiene."
  citation: "art. 52.1.a) LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q099
  prompt:
    es: "Una transferencia entre créditos para operaciones corrientes de dos programas de una misma sección presupuestaria, según el artículo 52.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "queda prohibida, porque la letra b) impide transferir entre programas de distinto servicio."
  - id: b
    correct: true
    text:
      es: "no choca con ninguna de sus restricciones, que no alcanzan a los traspasos entre programas de una sección."
  - id: c
    text:
      es: "queda prohibida, salvo que los dos programas pertenezcan además al mismo servicio."
  - id: d
    text:
      es: "solo es posible si el Gobierno la acuerda a propuesta del Ministro de Hacienda."
  explanation:
    es: "Las restricciones del artículo 52.1 se refieren a operaciones financieras, a créditos de capital hacia corrientes, a distintas secciones, a créditos extraordinarios, suplementados o ampliados y a créditos ampliables de la Seguridad Social. Pasar crédito corriente entre programas de una misma sección no cae en ninguna. Lo que cambia con el servicio es quién la autoriza, no si es posible: dentro de un servicio, el titular del ministerio (art. 63.1.a)); entre servicios, el Ministro de Hacienda (art. 62.1.a)). El Gobierno solo interviene en las transferencias entre secciones."
  citation: "art. 52.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q100
  prompt:
    es: "Las transferencias que se efectúen para dar cumplimiento a la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español quedan, según el artículo 52.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "sometidas a todas las restricciones del apartado 1, aunque sin informe previo."
  - id: b
    text:
      es: "reservadas en todo caso al Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: c
    text:
      es: "limitadas al uno por ciento de los créditos autorizados al Estado en el ejercicio."
  - id: d
    correct: true
    text:
      es: "fuera de las restricciones del apartado 1 de ese artículo."
  explanation:
    es: "El artículo 52.2 enumera entre las transferencias que no quedan afectadas por las restricciones del apartado 1 las que se efectúen para dar cumplimiento a la Ley 16/1985. No las somete a esas restricciones, no las reserva al Consejo de Ministros y el uno por ciento es el límite de los anticipos de Tesorería del artículo 60.1, no de estas transferencias."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "concepto"
