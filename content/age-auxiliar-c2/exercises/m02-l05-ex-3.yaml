# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q084
  prompt:
    es: "En el modelo SaaS de distribución de software, ¿quién es generalmente el tercero en cuyos servidores se alojan el software y sus datos?"
  options:
  - id: a
    text:
      es: "El cliente que usa el software."
  - id: b
    text:
      es: "El proveedor de acceso a Internet."
  - id: c
    text:
      es: "La autoridad de certificación del cliente."
  - id: d
    correct: true
    text:
      es: "El fabricante del propio software."
  explanation:
    es: "Según el glosario del INCIBE, en SaaS el software y sus datos se alojan en servidores de un tercero, «generalmente el fabricante del software». El cliente no es un tercero: accede vía Internet. El proveedor de acceso da acceso a las redes de telecomunicaciones, y la autoridad de certificación genera certificados digitales; ninguno de los dos es el tercero que nombra la definición."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «SaaS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-mineria-datos-html
- id: m02-l05-q085
  prompt:
    es: "¿Qué usa la minería de datos, el proceso de detectar información accionable en grandes conjuntos de datos, para derivar patrones y tendencias?"
  options:
  - id: a
    correct: true
    text:
      es: "Análisis matemáticos de los datos."
  - id: b
    text:
      es: "Cifrado de los datos con claves de 256 bits."
  - id: c
    text:
      es: "Replicación de los datos en varias bases."
  - id: d
    text:
      es: "Compresión de los datos en el sistema de archivos."
  explanation:
    es: "La página dice que la minería de datos usa análisis matemáticos para derivar patrones y tendencias que existen en los datos. El cifrado protege los datos, la replicación los copia y sincroniza entre bases de datos y la compresión del sistema de archivos sirve para almacenar más datos en un volumen; ninguno deriva patrones."
  citation: "fuente: `ms-mineria-datos.html`; «Conceptos de minería de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-intel-4004-aniversario-pdf
- id: m02-l05-q168
  prompt:
    es: "¿Cuál de los siguientes años es el del lanzamiento del Intel 4004, el primer microprocesador disponible en el mundo, según la nota de prensa de Intel?"
  options:
  - id: a
    text:
      es: "1969"
  - id: b
    correct: true
    text:
      es: "1971"
  - id: c
    text:
      es: "1946"
  - id: d
    text:
      es: "1981"
  explanation:
    es: "La nota de Intel sitúa el lanzamiento del 4004 en 1971. «1969» es el año en que Nippon Calculating Machine Corp. se puso en contacto con Intel, no el del lanzamiento. «1946» es el año del primer ordenador electrónico, con el que la nota compara la potencia del 4004. «1981» no aparece en la nota como fecha del 4004, que se lanzó diez años antes. Lo que dice la fuente: «Con su lanzamiento en 1971, el 4004»."
  citation: "fuente: `intel-4004-aniversario.pdf`; «Intel celebra el 50º aniversario del Intel 4004»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-intel-4004-aniversario-pdf
- id: m02-l05-q169
  prompt:
    es: "¿Qué fabricante japonés se puso en contacto con Intel en 1969 para que diseñara circuitos integrados destinados a su calculadora Busicom 141-PF?"
  options:
  - id: a
    text:
      es: "Sharp Electronics Corporation"
  - id: b
    text:
      es: "Toshiba Computing Machine Corp."
  - id: c
    correct: true
    text:
      es: "Nippon Calculating Machine Corp."
  - id: d
    text:
      es: "Fujitsu Calculating Machine Corp."
  explanation:
    es: "La nota de Intel atribuye el encargo de 1969 a Nippon Calculating Machine Corp. «Sharp Electronics Corporation» no es la empresa que, según la nota, encargó los circuitos para la Busicom 141-PF. «Toshiba Computing Machine Corp.» no es la empresa que, según la nota, encargó los circuitos para la Busicom 141-PF. «Fujitsu Calculating Machine Corp.» no es la empresa que, según la nota, encargó los circuitos para la Busicom 141-PF. Lo que dice la fuente: «In 1969, Nippon Calculating Machine Corp. approached Intel to design custom integrated circuits for its new Busicom 141-PF printing calculator»."
  citation: "fuente: `intel-4004-aniversario.pdf`; «Intel celebra el 50º aniversario del Intel 4004»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-intel-4004-aniversario-pdf
- id: m02-l05-q170
  prompt:
    es: "¿Cuántos chips componían el conjunto que Intel diseñó para responder al encargo de la calculadora Busicom 141-PF, entre ellos la CPU 4004?"
  options:
  - id: a
    text:
      es: "Doce chips personalizados"
  - id: b
    text:
      es: "Dos chips con memoria"
  - id: c
    correct: true
    text:
      es: "Cuatro chips en total"
  - id: d
    text:
      es: "Ocho chips en total"
  explanation:
    es: "Faggin y su equipo adaptaron los planes originales y diseñaron un conjunto de cuatro chips que incluía la CPU 4004. «Doce chips personalizados» son los chips personalizados de los planes originales, que el equipo de Intel redujo a cuatro. «Dos chips con memoria» no es el tamaño del conjunto que describe la nota de Intel. «Ocho chips en total» no es el tamaño del conjunto que describe la nota de Intel. Lo que dice la fuente: «diseñaron un conjunto de cuatro chips»."
  citation: "fuente: `intel-4004-aniversario.pdf`; «Intel celebra el 50º aniversario del Intel 4004»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-intel-4004-aniversario-pdf
- id: m02-l05-q171
  prompt:
    es: "Según la nota de Intel, ¿con qué ofrecía el 4004, del tamaño de una uña humana, la misma potencia de cálculo?"
  options:
  - id: a
    text:
      es: "Con una calculadora de bolsillo de 1969 de un solo chip, que cabía en la palma de la mano"
  - id: b
    text:
      es: "Con el primer ordenador personal comercializado en 1981, de uso doméstico y poco tamaño"
  - id: c
    correct: true
    text:
      es: "Con el primer ordenador electrónico, de 1946, que llenaba una habitación entera"
  - id: d
    text:
      es: "Con un procesador de los años noventa de tamaño medio"
  explanation:
    es: "La nota compara el 4004 con el primer ordenador electrónico de 1946, que ocupaba una habitación. «Con una calculadora de bolsillo de 1969 de un solo chip, que cabía en la palma de la mano» no es la comparación de la nota, que habla de un ordenador de 1946. «Con el primer ordenador personal comercializado en 1981, de uso doméstico y poco tamaño» no es la comparación de la nota, que habla de un ordenador de 1946. «Con un procesador de los años noventa de tamaño medio» no es la comparación de la nota, que habla de un ordenador de 1946. Lo que dice la fuente: «ofrecía la misma potencia de cálculo que el primer ordenador electrónico fabricado en 1946»."
  citation: "fuente: `intel-4004-aniversario.pdf`; «Intel celebra el 50º aniversario del Intel 4004»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-todo-bienvenida-html
- id: m02-l05-q175
  prompt:
    es: "¿En qué servidores se almacenan las tareas de Microsoft To Do, de modo que aparecen de forma automática en las Tareas de Outlook?"
  options:
  - id: a
    text:
      es: "En servidores de SharePoint Online"
  - id: b
    text:
      es: "En servidores de OneDrive Personal"
  - id: c
    correct: true
    text:
      es: "En servidores de Exchange Online"
  - id: d
    text:
      es: "En el propio dispositivo del usuario"
  explanation:
    es: "Las tareas se almacenan en Exchange Online, de ahí que Outlook las muestre en sus Tareas. «En servidores de SharePoint Online» no es donde guarda las tareas según la página, que cita Exchange Online. «En servidores de OneDrive Personal» no es donde guarda las tareas según la página, que cita Exchange Online. «En el propio dispositivo del usuario» no explicaría que aparezcan en Outlook: la página dice que están en servidores de Exchange Online."
  citation: "fuente: `ms-todo-bienvenida.html`; «Le damos la bienvenida a Microsoft To Do»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-todo-bienvenida-html
- id: m02-l05-q177
  prompt:
    es: "¿Cuál de las siguientes acciones permite en Microsoft To Do marcar las tareas más importantes, según la página de bienvenida?"
  options:
  - id: a
    text:
      es: "Moverlas a Mi día"
  - id: b
    text:
      es: "Añadirles una nota"
  - id: c
    text:
      es: "Asignarles un paso"
  - id: d
    correct: true
    text:
      es: "Destacarlas"
  explanation:
    es: "La página indica que se «destacan» las tareas más importantes. «Moverlas a Mi día» es el espacio donde se trabaja el día, no la forma de marcar la importancia. «Añadirles una nota» sirve para registrar detalles adicionales, no para marcar la importancia. «Asignarles un paso» sirve para dividir una tarea grande, no para marcar la importancia."
  citation: "fuente: `ms-todo-bienvenida.html`; «Mantén todo bajo control estableciendo fechas de vencimiento y recordatorios para cada tarea, y \"destaca\" tus tareas más importantes.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q181
  prompt:
    es: "¿Cuál de las siguientes propiedades de UTF-8 describe la RFC 3629 respecto al conjunto de caracteres US-ASCII, que UTF-8 conserva completo?"
  options:
  - id: a
    text:
      es: "Los caracteres ASCII se codifican con dos octetos para distinguirlos de los demás."
  - id: b
    text:
      es: "Los caracteres ASCII necesitan una tabla de conversión propia para leerse como UTF-8."
  - id: c
    text:
      es: "Los caracteres ASCII se sustituyen por secuencias de cuatro octetos de longitud fija."
  - id: d
    correct: true
    text:
      es: "Los caracteres ASCII se codifican con un solo octeto de valor ASCII normal."
  explanation:
    es: "La RFC explica que cada carácter US-ASCII ocupa un octeto con su valor ASCII habitual. «Los caracteres ASCII se codifican con dos octetos para distinguirlos de los demás.» contradice la RFC, que los codifica con un único octeto. «Los caracteres ASCII necesitan una tabla de conversión propia para leerse como UTF-8.» contradice la RFC, para la que una cadena ASCII ya es una cadena UTF-8 válida. «Los caracteres ASCII se sustituyen por secuencias de cuatro octetos de longitud fija.» contradice la RFC, cuya longitud es variable y de un octeto para ASCII."
  citation: "fuente: `rfc3629-utf8.txt`; «It uses all bits of an octet, but has the quality of preserving the full US-ASCII [US-ASCII] range: US-ASCII characters are encoded in one octet having the normal US-ASCII value, and any octet with such a value can only stand for a US-ASCII character, and nothing else.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q182
  prompt:
    es: "Señale qué ocurre con una cadena de texto formada solo por caracteres ASCII cuando se interpreta con la codificación UTF-8, según la RFC 3629:"
  options:
  - id: a
    text:
      es: "Debe convertirse antes mediante un programa de transcodificación"
  - id: b
    correct: true
    text:
      es: "Es también una cadena UTF-8 válida"
  - id: c
    text:
      es: "Resulta ilegible porque UTF-8 reasigna los valores de 00 a 7F"
  - id: d
    text:
      es: "Se interpreta como una secuencia de varios octetos por carácter"
  explanation:
    es: "La RFC deduce que una cadena ASCII simple es a la vez una cadena UTF-8 válida. «Debe convertirse antes mediante un programa de transcodificación» no es lo que dice la RFC: la compatibilidad evita esa conversión. «Resulta ilegible porque UTF-8 reasigna los valores de 00 a 7F» contradice la RFC, que mantiene esos valores para US-ASCII. «Se interpreta como una secuencia de varios octetos por carácter» contradice la RFC, que usa un solo octeto para el repertorio ASCII. Lo que dice la fuente: «A direct consequence is that a plain ASCII string is also a valid UTF-8 string»."
  citation: "fuente: `rfc3629-utf8.txt`; «A direct consequence is that a plain ASCII string is also a valid UTF-8 string.»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q183
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el primer octeto de una secuencia de varios octetos en UTF-8 es correcta, según la RFC 3629?"
  options:
  - id: a
    correct: true
    text:
      es: "Indica el número de octetos que componen la secuencia."
  - id: b
    text:
      es: "Contiene siempre el valor del carácter ASCII más cercano."
  - id: c
    text:
      es: "Marca la ordenación de los octetos en la secuencia, como un BOM."
  - id: d
    text:
      es: "Se repite en todos los octetos siguientes de la secuencia."
  explanation:
    es: "La RFC señala que el primer octeto de una secuencia multiocteto indica cuántos octetos la forman. «Contiene siempre el valor del carácter ASCII más cercano.» no lo dice la RFC: ese valor solo corresponde a los caracteres ASCII de un octeto. «Marca la ordenación de los octetos en la secuencia, como un BOM.» es la función del BOM en otras codificaciones, que en UTF-8 resulta inútil. «Se repite en todos los octetos siguientes de la secuencia.» contradice la RFC, que da a los octetos siguientes un formato distinto. Lo que dice la fuente: «The first octet of a multi-octet sequence indicates the number of octets in the sequence»."
  citation: "fuente: `rfc3629-utf8.txt`; «The first octet of a multi-octet sequence indicates the number of octets in the sequence.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q184
  prompt:
    es: "¿Qué secuencia de octetos adopta siempre la marca de orden de bytes (BOM) cuando aparece al principio de una cadena codificada en UTF-8?"
  options:
  - id: a
    correct: true
    text:
      es: "EF BB BF"
  - id: b
    text:
      es: "FE FF"
  - id: c
    text:
      es: "00 00 FE FF"
  - id: d
    text:
      es: "C0 C1 F5"
  explanation:
    es: "La RFC indica que, al tener UTF-8 una unidad de un octeto, el BOM aparece siempre como EF BB BF. «FE FF» no es la secuencia del BOM en UTF-8, que ocupa tres octetos. «00 00 FE FF» no es la secuencia del BOM en UTF-8, que ocupa tres octetos. «C0 C1 F5» son valores de octeto que, según la RFC, no aparecen nunca en UTF-8. Lo que dice la fuente: «the BOM will always appear as the octet sequence EF BB BF»."
  citation: "fuente: `rfc3629-utf8.txt`; «UTF-8 having a single-octet encoding unit, this last function is useless and the BOM will always appear as the octet sequence EF BB BF.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q185
  prompt:
    es: "¿Cuál de los siguientes caracteres de Unicode se conoce informalmente como marca de orden de bytes, abreviada BOM, según la RFC 3629?"
  options:
  - id: a
    text:
      es: "U+0000, el carácter nulo del rango ASCII"
  - id: b
    text:
      es: "U+007F, el último carácter del repertorio ASCII"
  - id: c
    correct: true
    text:
      es: "U+FEFF, espacio sin separación de ancho cero"
  - id: d
    text:
      es: "U+10FFFF, el último carácter del rango de UTF-8"
  explanation:
    es: "La RFC identifica el BOM con el carácter U+FEFF, espacio sin separación de ancho cero. «U+0000, el carácter nulo del rango ASCII» no recibe el nombre de BOM en la RFC. «U+007F, el último carácter del repertorio ASCII» es el límite del repertorio US-ASCII, no un BOM. «U+10FFFF, el último carácter del rango de UTF-8» es el límite superior del rango de caracteres, no un BOM."
  citation: "fuente: `rfc3629-utf8.txt`; «The UCS character U+FEFF \"ZERO WIDTH NO-BREAK SPACE\" is also known informally as \"BYTE ORDER MARK\" (abbreviated \"BOM\").»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q186
  prompt:
    es: "¿Qué es el juego universal de caracteres (UCS) definido por ISO/IEC 10646-1, para el que se desarrolló la codificación UTF-8?"
  options:
  - id: a
    text:
      es: "Un conjunto de 128 caracteres de siete bits de la tabla ASCII, que UTF-8 conserva sin cambios"
  - id: b
    text:
      es: "Un protocolo de transmisión de ficheros entre redes distintas y de uso general"
  - id: c
    correct: true
    text:
      es: "Un conjunto de caracteres que abarca la mayoría de las escrituras del mundo"
  - id: d
    text:
      es: "Un sistema de numeración de base hexadecimal para las direcciones de memoria"
  explanation:
    es: "La RFC presenta el UCS como un gran conjunto de caracteres con la mayoría de los sistemas de escritura. «Un conjunto de 128 caracteres de siete bits de la tabla ASCII, que UTF-8 conserva sin cambios» es el repertorio US-ASCII, que UTF-8 conserva pero que no es el UCS. «Un protocolo de transmisión de ficheros entre redes distintas y de uso general» no es lo que describe la RFC, que habla de un juego de caracteres. «Un sistema de numeración de base hexadecimal para las direcciones de memoria» no es lo que describe la RFC, que habla de un juego de caracteres. Lo que dice la fuente: «defines a large character set called the Universal Character Set (UCS) which encompasses most of the world's writing systems»."
  citation: "fuente: `rfc3629-utf8.txt`; «ISO/IEC 10646 [ISO.10646] defines a large character set called the Universal Character Set (UCS), which encompasses most of the world's writing systems.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q194
  prompt:
    es: "¿Cuál de los siguientes resultados devuelve en Python la división con el operador / entre dos números enteros, según el tutorial oficial?"
  options:
  - id: a
    text:
      es: "Un número entero, sin la parte fraccionaria"
  - id: b
    text:
      es: "El resto de la división de los dos números"
  - id: c
    correct: true
    text:
      es: "Un número decimal de punto flotante"
  - id: d
    text:
      es: "Una cadena de texto con el cociente"
  explanation:
    es: "El tutorial dice que la división / siempre devuelve un número de punto flotante. «Un número entero, sin la parte fraccionaria» es el resultado de la división entera con el operador //, no de /. «El resto de la división de los dos números» es el resultado del operador %, no de /. «Una cadena de texto con el cociente» no es lo que devuelve /: el tutorial habla de un número de punto flotante. Lo que dice la fuente: «La división ( / ) siempre retorna un número decimal de punto flotante»."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q195
  prompt:
    es: "¿Qué operador de Python realiza la división entera, descartando la parte fraccionaria del resultado, según el tutorial de la Python Software Foundation?"
  options:
  - id: a
    text:
      es: "/"
  - id: b
    text:
      es: "%"
  - id: c
    correct: true
    text:
      es: "//"
  - id: d
    text:
      es: "**"
  explanation:
    es: "El tutorial explica que // hace floor division y obtiene un número entero. «/» devuelve siempre un número decimal de punto flotante. «%» devuelve el resto de la división. «**» calcula potencias, no divide."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q196
  prompt:
    es: "¿Qué devuelve en Python el operador % aplicado a dos números, por ejemplo 17 % 3, según la introducción informal del tutorial?"
  options:
  - id: a
    text:
      es: "El cociente entero de la división"
  - id: b
    text:
      es: "El porcentaje del primer número sobre el segundo"
  - id: c
    correct: true
    text:
      es: "El resto de la división"
  - id: d
    text:
      es: "El producto de los dos números"
  explanation:
    es: "El tutorial indica que el operador % calcula el resto de la división. «El cociente entero de la división» es lo que devuelve el operador //, no %. «El porcentaje del primer número sobre el segundo» no es lo que hace % en el tutorial, que lo usa para el resto. «El producto de los dos números» no es lo que hace %: el producto se calcula con *. Lo que dice la fuente: «para calcular el resto puedes usar %»."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q197
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las listas de Python es correcta, según el tutorial, que las describe como el tipo compuesto más versátil?"
  options:
  - id: a
    text:
      es: "Se escriben entre comillas simples y su contenido no se puede cambiar una vez creadas."
  - id: b
    correct: true
    text:
      es: "Se escriben como valores separados por comas entre corchetes y su contenido se puede cambiar."
  - id: c
    text:
      es: "Solo admiten ítems del mismo tipo y los mantienen siempre ordenados de menor a mayor."
  - id: d
    text:
      es: "Se escriben entre llaves con elementos separados por puntos y coma, y no se pueden indexar ni segmentar."
  explanation:
    es: "El tutorial las escribe entre corchetes con valores separados por comas y las define como mutables. «Se escriben entre comillas simples y su contenido no se puede cambiar una vez creadas.» es la descripción de una cadena de texto, que es inmutable. «Solo admiten ítems del mismo tipo y los mantienen siempre ordenados de menor a mayor.» contradice el tutorial, que admite ítems de distintos tipos, aunque suelan ser del mismo. «Se escriben entre llaves con elementos separados por puntos y coma, y no se pueden indexar ni segmentar.» contradice el tutorial, que permite indexar y segmentar las listas."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q199
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las cadenas de caracteres de Python, el tipo str, es correcta según el tutorial de la Python Software Foundation?"
  options:
  - id: a
    text:
      es: "Son mutables, igual que las listas, y se pueden modificar por posición sin que se produzca ningún error."
  - id: b
    correct: true
    text:
      es: "Son inmutables, de modo que asignar a una posición indexada produce un error."
  - id: c
    text:
      es: "Solo se pueden encerrar entre comillas dobles y nunca entre comillas simples, que producen un error."
  - id: d
    text:
      es: "Existe un tipo de dato distinto para los caracteres sueltos, el tipo char, que no es una cadena."
  explanation:
    es: "El tutorial indica que las cadenas son inmutables y que asignar a un índice da un error. «Son mutables, igual que las listas, y se pueden modificar por posición sin que se produzca ningún error.» contradice el tutorial: la mutabilidad es propia de las listas, no de las cadenas. «Solo se pueden encerrar entre comillas dobles y nunca entre comillas simples, que producen un error.» contradice el tutorial, que admite comillas simples o dobles con el mismo resultado. «Existe un tipo de dato distinto para los caracteres sueltos, el tipo char, que no es una cadena.» contradice el tutorial, para el que un carácter es una cadena de longitud uno. Lo que dice la fuente: «Las cadenas de Python no se pueden modificar, son immutable »."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 3
  tags:
