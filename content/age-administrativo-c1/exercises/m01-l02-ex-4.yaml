# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q052
  prompt:
    es: "De acuerdo con el artículo 60.1 de la Constitución Española de 1978, será tutor del Rey menor, en primer lugar:"
  options:
  - id: a
    correct: true
    text:
      es: "La persona que en su testamento hubiese nombrado el Rey difunto, siempre que sea mayor de edad y español de nacimiento."
  - id: b
    text:
      es: "El Regente, que acumula siempre los cargos de Regente y de tutor."
  - id: c
    text:
      es: "El pariente mayor de edad más próximo a suceder en la Corona."
  - id: d
    text:
      es: "El Presidente del Gobierno, mientras dure la minoría de edad del Rey."
  explanation:
    es: "El artículo 60.1 dice: «Será tutor del Rey menor la persona que en su testamento hubiese nombrado el Rey difunto, siempre que sea mayor de edad y español de nacimiento». Los cargos de Regente y tutor no se acumulan siempre: solo en el padre, la madre o los ascendientes directos. El pariente más próximo a suceder es quien ejerce la Regencia en defecto de los padres (art. 59.1), no el tutor. El Presidente del Gobierno no es tutor."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q053
  prompt:
    es: "¿Qué requisitos debe reunir la persona que el Rey difunto nombre tutor del Rey menor en su testamento, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Ser español y mayor de edad."
  - id: b
    correct: true
    text:
      es: "Ser mayor de edad y español de nacimiento."
  - id: c
    text:
      es: "Ser mayor de edad y pariente del Rey difunto."
  - id: d
    text:
      es: "Ser mayor de veinticinco años y español de nacimiento."
  explanation:
    es: "El artículo 60.1 exige al tutor testamentario que sea «mayor de edad y español de nacimiento». Ser español sin más es el requisito de la Regencia (art. 59.4). El parentesco no se exige. La edad exigida es la mayoría de edad, no veinticinco años."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q054
  prompt:
    es: "Si el Rey difunto no nombró tutor en su testamento, ¿quién es tutor del Rey menor según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El padre o la madre, mientras permanezcan viudos."
  - id: b
    text:
      es: "El padre o la madre, aunque hayan contraído nuevo matrimonio."
  - id: c
    text:
      es: "El pariente mayor de edad más próximo a suceder en la Corona."
  - id: d
    text:
      es: "La persona que designe el Gobierno, oído el Consejo de Estado."
  explanation:
    es: "El artículo 60.1 dice que, si el Rey difunto no lo nombró, «será tutor el padre o la madre mientras permanezcan viudos». Si dejan de estar viudos, dejan de cumplir la condición. El pariente más próximo a suceder aparece en la Regencia (art. 59.1). En defecto de los padres nombran al tutor las Cortes Generales, no el Gobierno."
  citation: "art. 60.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-60
- id: m01-l02-q055
  prompt:
    es: "De acuerdo con el artículo 60.1 de la Constitución Española de 1978, los cargos de Regente y de tutor del Rey menor:"
  options:
  - id: a
    text:
      es: "Podrán acumularse en cualquier persona que reúna los requisitos de ambos."
  - id: b
    text:
      es: "No podrán acumularse en ningún caso."
  - id: c
    text:
      es: "No podrán acumularse sino en el pariente más próximo a suceder en la Corona."
  - id: d
    correct: true
    text:
      es: "No podrán acumularse sino en el padre, madre o ascendientes directos del Rey."
  explanation:
    es: "El artículo 60.1 dice que «no podrán acumularse los cargos de Regente y de tutor sino en el padre, madre o ascendientes directos del Rey». La regla es la prohibición, con esa única excepción. No se acumulan en cualquier persona, y la excepción no alcanza al pariente más próximo a suceder."
  citation: "art. 60.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q057
  prompt:
    es: "De acuerdo con el artículo 61.1 de la Constitución Española de 1978, el Rey, al ser proclamado ante las Cortes Generales, jurará desempeñar fielmente sus funciones, guardar y hacer guardar la Constitución y las leyes y:"
  options:
  - id: a
    text:
      es: "Respetar los derechos de los ciudadanos y de los pueblos de España."
  - id: b
    text:
      es: "Defender la unidad de la Nación y la integridad de su territorio."
  - id: c
    correct: true
    text:
      es: "Respetar los derechos de los ciudadanos y de las Comunidades Autónomas."
  - id: d
    text:
      es: "Respetar los derechos de los ciudadanos y la autonomía de los municipios."
  explanation:
    es: "El artículo 61.1 dice que el Rey jura «respetar los derechos de los ciudadanos y de las Comunidades Autónomas». Los pueblos de España y la autonomía de los municipios sustituyen a las Comunidades Autónomas, que son las que nombra el texto. Defender la unidad de la Nación y la integridad del territorio no forma parte del juramento."
  citation: "art. 61.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q058
  prompt:
    es: "¿Cuál de los siguientes juramentos prestan el Príncipe heredero y los Regentes, además del mismo que presta el Rey, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El de fidelidad al Rey."
  - id: b
    text:
      es: "El de fidelidad a las Cortes Generales."
  - id: c
    text:
      es: "El de obediencia al Gobierno de la Nación."
  - id: d
    text:
      es: "El de lealtad al Presidente del Gobierno."
  explanation:
    es: "El artículo 61.2 dice que el Príncipe heredero y el Regente o Regentes prestan el mismo juramento que el Rey, «así como el de fidelidad al Rey». El juramento añadido no es a las Cortes, al Gobierno ni a su Presidente."
  citation: "art. 61.2 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-74
- id: m01-l02-q059
  prompt:
    es: "Según el artículo 74.1 de la Constitución Española de 1978, las Cámaras se reunirán en sesión conjunta para ejercer:"
  options:
  - id: a
    text:
      es: "Las competencias legislativas que el título II atribuye a las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Las competencias no legislativas que el título II atribuye expresamente a las Cortes Generales."
  - id: c
    text:
      es: "Todas las competencias que el título III atribuye a las Cortes Generales."
  - id: d
    text:
      es: "Las competencias no legislativas que el título II atribuye al Congreso de los Diputados."
  explanation:
    es: "El artículo 74.1 dice: «Las Cámaras se reunirán en sesión conjunta para ejercer las competencias no legislativas que el Título II atribuye expresamente a las Cortes Generales». Son competencias no legislativas, del título II, de las Cortes Generales. Cada distractor cambia uno de esos tres elementos."
  citation: "art. 74.1 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-59
- id: m01-l02-q060
  prompt:
    es: "¿Cuál de las siguientes competencias atribuye a las Cortes Generales el título II de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Designar al tutor del Rey menor aunque el Rey difunto lo haya nombrado en testamento."
  - id: b
    text:
      es: "Refrendar el nombramiento del Presidente del Gobierno."
  - id: c
    correct: true
    text:
      es: "Reconocer la inhabilitación del Rey para el ejercicio de su autoridad."
  - id: d
    text:
      es: "Distribuir la cantidad global para el sostenimiento de la Familia y Casa del Rey."
  explanation:
    es: "El artículo 59.2 habla de la inhabilitación del Rey cuando «la imposibilidad fuere reconocida por las Cortes Generales». Las Cortes nombran al tutor solo en defecto del testamentario y de los padres viudos (art. 60.1). El nombramiento del Presidente del Gobierno lo refrenda el Presidente del Congreso, no las Cortes (art. 64.1). La cantidad global la distribuye libremente el Rey (art. 65.1)."
  citation: "art. 59.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q061
  prompt:
    es: "¿Cuál de las siguientes competencias NO atribuye la Constitución Española de 1978 a las Cortes Generales en relación con la Corona?"
  options:
  - id: a
    text:
      es: "Autorizar al Rey a declarar la guerra y hacer la paz."
  - id: b
    text:
      es: "Nombrar la Regencia cuando no haya persona a quien corresponda."
  - id: c
    text:
      es: "Proveer a la sucesión si se extinguen todas las líneas llamadas en Derecho."
  - id: d
    correct: true
    text:
      es: "Nombrar y relevar a los miembros civiles y militares de la Casa del Rey."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». Esa competencia es del Rey, no de las Cortes. Las otras tres sí son de las Cortes Generales: autorizar la guerra y la paz (art. 63.3), nombrar la Regencia (art. 59.3) y proveer a la sucesión (art. 57.3)."
  citation: "art. 65.2 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1978-31229-art-168
- id: m01-l02-q062
  prompt:
    es: "De acuerdo con el artículo 168.1 de la Constitución Española de 1978, la reforma parcial que afecte al título II exige aprobar el principio:"
  options:
  - id: a
    text:
      es: "Por mayoría de tres quintos de cada Cámara, y disolver inmediatamente las Cortes."
  - id: b
    text:
      es: "Por mayoría absoluta del Congreso y de dos tercios del Senado."
  - id: c
    text:
      es: "Por mayoría de dos tercios de cada Cámara, sin disolver las Cortes."
  - id: d
    correct: true
    text:
      es: "Por mayoría de dos tercios de cada Cámara, y disolver inmediatamente las Cortes."
  explanation:
    es: "El artículo 168.1 dice que para esa reforma «se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes». Los tres quintos son la mayoría del procedimiento ordinario del artículo 167. La mayoría es la misma en las dos Cámaras. La disolución inmediata es obligatoria."
  citation: "art. 168.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-62
- id: m01-l02-q063
  prompt:
    es: "De acuerdo con el artículo 62 de la Constitución Española de 1978, el Rey ejerce el derecho de gracia con arreglo a la ley, que:"
  options:
  - id: a
    text:
      es: "Podrá autorizar indultos generales a propuesta del Gobierno."
  - id: b
    text:
      es: "Solo podrá autorizar indultos generales en tiempo de guerra."
  - id: c
    correct: true
    text:
      es: "No podrá autorizar indultos generales."
  - id: d
    text:
      es: "Podrá autorizar indultos generales por mayoría absoluta del Congreso."
  explanation:
    es: "El artículo 62.i atribuye al Rey «ejercer el derecho de gracia con arreglo a la ley, que no podrá autorizar indultos generales». La prohibición no tiene excepciones en el texto. Por eso la ley no puede autorizarlos a propuesta del Gobierno. Tampoco solo en tiempo de guerra: la Constitución no hace esa salvedad. Y no hay una mayoría del Congreso que los haga posibles."
  citation: "art. 62.i CE"
  difficulty: 1
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q064
  prompt:
    es: "De acuerdo con el artículo 64.1 de la Constitución Española de 1978, fuera de la propuesta y el nombramiento del Presidente del Gobierno y la disolución prevista en el artículo 99, los actos del Rey serán refrendados:"
  options:
  - id: a
    text:
      es: "Por el Presidente del Gobierno y, en su caso, por el Consejo de Ministros."
  - id: b
    text:
      es: "Por el Presidente del Congreso y, en su caso, por los Ministros competentes."
  - id: c
    text:
      es: "Por los Ministros competentes y, en su caso, por el Presidente del Senado."
  - id: d
    correct: true
    text:
      es: "Por el Presidente del Gobierno y, en su caso, por los Ministros competentes."
  explanation:
    es: "El artículo 64.1 dice: «Los actos del Rey serán refrendados por el Presidente del Gobierno y, en su caso, por los Ministros competentes». El refrendo es de personas, que son las que responden (art. 64.2); el Consejo de Ministros, órgano colegiado, no refrenda. El Presidente del Congreso refrenda solo los tres actos que el enunciado aparta, no los demás. El Presidente del Senado no refrenda ningún acto del Rey. Aparte queda el nombramiento y relevo de los miembros de su Casa, que el artículo 56.3 exime de refrendo (art. 65.2)."
  citation: "art. 64.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-122
- id: m01-l02-q065
  prompt:
    es: "Según el artículo 122.3 de la Constitución Española de 1978, además del Presidente del Tribunal Supremo, que lo preside, el Consejo General del Poder Judicial está integrado por:"
  options:
  - id: a
    text:
      es: "Quince miembros nombrados por el Rey, a propuesta del Gobierno."
  - id: b
    text:
      es: "Veinte miembros nombrados por el Presidente del Tribunal Supremo."
  - id: c
    text:
      es: "Doce miembros nombrados por el Rey, a propuesta del Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Veinte miembros nombrados por el Rey."
  explanation:
    es: "El artículo 122.3 dice que el Consejo está integrado por el Presidente del Tribunal Supremo «y por veinte miembros nombrados por el Rey». Quince no es la cifra, y el Gobierno no propone a ninguno de los vocales. El Presidente del Tribunal Supremo preside el Consejo, pero no nombra a sus miembros. Doce es solo el número de los elegidos entre Jueces y Magistrados, y el Consejo de Ministros tampoco los propone."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-1978-31229-art-124
- id: m01-l02-q067
  prompt:
    es: "¿Qué órgano debe ser oído antes de que el Rey nombre al Fiscal General del Estado a propuesta del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  - id: b
    text:
      es: "La Sala de Gobierno del Tribunal Supremo, por mayoría absoluta de sus miembros."
  - id: c
    text:
      es: "El Consejo de Estado en pleno, mediante dictamen preceptivo y no vinculante."
  - id: d
    text:
      es: "El Tribunal Constitucional en pleno, a petición del Gobierno."
  explanation:
    es: "El artículo 124.4 dice: «El Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial». La Sala de Gobierno del Tribunal Supremo no aparece en ese artículo. El Consejo de Estado tampoco: el texto no pide su dictamen. El Tribunal Constitucional no interviene en el nombramiento."
  citation: "art. 124.4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q068
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la composición del Tribunal Constitucional es correcta, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Lo forman 15 miembros nombrados por el Rey, a propuesta del Congreso, del Senado y del Gobierno."
  - id: b
    text:
      es: "Lo forman 12 miembros elegidos por las Cortes Generales en sesión conjunta de ambas Cámaras."
  - id: c
    correct: true
    text:
      es: "Lo forman 12 miembros nombrados por el Rey."
  - id: d
    text:
      es: "Lo forman 12 miembros nombrados por el Presidente del Gobierno, oído el Consejo de Estado."
  explanation:
    es: "El artículo 159.1 dice: «El Tribunal Constitucional se compone de 12 miembros nombrados por el Rey». Quince no es la cifra, y la propuesta incluye también al Consejo General del Poder Judicial. Las Cortes no los eligen en sesión conjunta: proponen el Congreso y el Senado por separado, junto con el Gobierno y el Consejo General del Poder Judicial. El Presidente del Gobierno no nombra a los magistrados, y el Consejo de Estado no es oído."
  citation: "art. 159.1 CE"
  difficulty: 1
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-1978-31229-art-160
- id: m01-l02-q069
  prompt:
    es: "De acuerdo con el artículo 160 de la Constitución Española de 1978, el Presidente del Tribunal Constitucional será nombrado entre sus miembros por el Rey:"
  options:
  - id: a
    correct: true
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de tres años."
  - id: b
    text:
      es: "A propuesta del Gobierno y por un período de tres años."
  - id: c
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de nueve años."
  - id: d
    text:
      es: "A propuesta del Congreso de los Diputados y por un período de cinco años."
  explanation:
    es: "El artículo 160 dice que el Presidente del Tribunal Constitucional será nombrado por el Rey «a propuesta del mismo Tribunal en pleno y por un período de tres años». La propuesta no es del Gobierno. Nueve años es el mandato de los miembros del Tribunal (art. 159.3), no el de su Presidente. El Congreso no propone al Presidente, y el período no es de cinco años."
  citation: "art. 160 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1978-31229-art-152
- id: m01-l02-q070
  prompt:
    es: "Según el artículo 152.1 de la Constitución Española de 1978, en los Estatutos aprobados por el procedimiento del artículo 151, el Presidente de la Comunidad Autónoma es:"
  options:
  - id: a
    text:
      es: "Elegido por sufragio universal directo y nombrado por el Rey."
  - id: b
    correct: true
    text:
      es: "Elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey."
  - id: c
    text:
      es: "Elegido por la Asamblea, de entre sus miembros, y nombrado por el Presidente del Gobierno."
  - id: d
    text:
      es: "Designado por el Rey a propuesta del Gobierno, oída la Asamblea Legislativa."
  explanation:
    es: "El artículo 152.1 prevé «un Presidente, elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey». La elección no es por sufragio universal directo: así se elige la Asamblea, no el Presidente. El nombramiento es del Rey, no del Presidente del Gobierno. El Rey no lo designa a propuesta del Gobierno: lo elige la Asamblea."
  citation: "art. 152.1 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-123
- id: m01-l02-q071
  prompt:
    es: "¿Cuál de los siguientes nombramientos hace el Rey a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El del Fiscal General del Estado."
  - id: b
    text:
      es: "El del Presidente del Tribunal Constitucional."
  - id: c
    correct: true
    text:
      es: "El del Presidente del Tribunal Supremo."
  - id: d
    text:
      es: "El del Presidente de una Comunidad Autónoma."
  explanation:
    es: "El artículo 123.2 dice: «El Presidente del Tribunal Supremo será nombrado por el Rey, a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley». Al Fiscal General del Estado lo propone el Gobierno; el Consejo General del Poder Judicial solo es oído (art. 124.4). Al Presidente del Tribunal Constitucional lo propone el mismo Tribunal en pleno (art. 160). Al Presidente de la Comunidad Autónoma lo elige la Asamblea de entre sus miembros, y el Rey lo nombra (art. 152.1)."
  citation: "art. 123.2 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
