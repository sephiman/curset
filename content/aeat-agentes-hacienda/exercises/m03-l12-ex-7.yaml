# anchor: boe-a-2005-14803-art-101
- id: m03-l12-q0142
  prompt:
    es: "El anuncio de la subasta de un lote embargado a Vinos Cuesta, S.L. se publica en el Boletín Oficial del Estado el 8 de junio de 2027 a las 10:00 horas. Conforme al artículo 101.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo puede abrirse como pronto la subasta?"
  options:
  - id: a
    text:
      es: "El 8 de junio de 2027 a las 10:00 horas, el mismo momento de la publicación."
  - id: b
    text:
      es: "El 23 de junio de 2027 a las 10:00 horas, transcurridos 15 días desde la publicación."
  - id: c
    text:
      es: "El 9 de junio de 2027 a las 00:00 horas, al comenzar el día siguiente a la publicación."
  - id: d
    correct: true
    text:
      es: "El 9 de junio de 2027 a las 10:00 horas, transcurridas 24 horas desde la publicación."
  explanation:
    es: "La subasta se abre transcurridas al menos 24 horas desde la publicación: 8 de junio a las 10:00 más 24 horas son el 9 de junio a las 10:00 (art. 101.3 RGR). La apertura inmediata incumple el mínimo. Los 15 días son el mínimo entre las notificaciones del acuerdo de enajenación y la subasta (art. 101.2), y empezar a las 00:00 del día siguiente acorta las 24 horas."
  citation: "art. 101.3 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2005-14803-art-104
- id: m03-l12-q0143
  prompt:
    es: "¿Durante qué plazo se pueden realizar pujas electrónicas una vez abierta la subasta, según el artículo 104.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Durante un plazo de veinte días naturales desde su apertura."
  - id: b
    text:
      es: "Durante un plazo de diez días naturales desde su apertura."
  - id: c
    text:
      es: "Durante un plazo de quince días hábiles desde su apertura."
  - id: d
    text:
      es: "Durante un plazo de treinta días naturales desde su anuncio."
  explanation:
    es: "Las pujas electrónicas se admiten durante veinte días naturales desde la apertura (art. 104.2 RGR). Los quince días hábiles, los treinta desde el anuncio y los diez no son el plazo del artículo."
  citation: "art. 104.2 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104
- id: m03-l12-q0144
  prompt:
    es: "Conforme al artículo 104.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el importe de salida o puja mínima del bien o lote subastado:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el 10 por ciento del tipo de subasta, salvo que el bien o lote tenga una carga superior o igual al 25 por ciento del importe de valoración."
  - id: b
    text:
      es: "Es el 25 por ciento del tipo de subasta, sin excepciones por razón de las cargas."
  - id: c
    text:
      es: "Es el 5 por ciento del tipo de subasta, salvo que el bien o lote tenga una carga superior o igual al 25 por ciento de la valoración."
  - id: d
    text:
      es: "Es el 10 por ciento del tipo de subasta, salvo que el bien o lote tenga una carga superior o igual al 50 por ciento del importe de valoración del bien."
  explanation:
    es: "La puja mínima es el 10 por ciento del tipo, con la excepción de las cargas iguales o superiores al 25 por ciento de la valoración (art. 104.3 RGR). El 5 por ciento es el depósito de los inmuebles, no la puja mínima. El 50 por ciento es el umbral de adjudicación de la Mesa (art. 104 bis.1). Y el 25 por ciento no es el importe de salida, sino el umbral de cargas."
  citation: "art. 104.3 RGR"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-104
- id: m03-l12-q0145
  prompt:
    es: "Según el artículo 104.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el deudor puede liberar sus bienes en cualquier momento anterior a la emisión de la certificación del acta de adjudicación o al otorgamiento de la escritura pública de venta, pagando:"
  options:
  - id: a
    text:
      es: "el depósito exigido a los licitadores en el artículo 103 bis."
  - id: b
    text:
      es: "la mitad de la deuda, en un pago único ante el órgano de recaudación competente."
  - id: c
    correct: true
    text:
      es: "íntegramente la cuantía del artículo 169.1 de la Ley General Tributaria."
  - id: d
    text:
      es: "solo el principal de la deuda, sin intereses ni costas."
  explanation:
    es: "Para liberar los bienes hay que pagar íntegramente la cuantía del artículo 169.1 LGT: deuda, intereses, recargos del período ejecutivo y costas (art. 104.4 RGR). El depósito del licitador es otra cosa. No basta el principal ni la mitad de la deuda."
  citation: "art. 104.4 RGR"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0146
  prompt:
    es: "Según el artículo 104 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, finalizada la fase de presentación de ofertas, ¿en qué plazo máximo se reúne la Mesa para adjudicar los bienes o lotes subastados o declarar desierta la subasta?"
  options:
  - id: a
    text:
      es: "En el plazo máximo de 20 días naturales."
  - id: b
    text:
      es: "En el plazo máximo de 15 días hábiles."
  - id: c
    correct: true
    text:
      es: "En el plazo máximo de 15 días naturales."
  - id: d
    text:
      es: "En el plazo máximo de 5 días naturales."
  explanation:
    es: "La Mesa se reúne en un máximo de 15 días naturales (art. 104 bis.1 RGR). No son hábiles. Los 5 días son el plazo de la opción por la escritura pública (art. 111.1) y los 20 días naturales, el de las pujas (art. 104.2)."
  citation: "art. 104 bis.1 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0147
  prompt:
    es: "La fase de presentación de ofertas de una subasta electrónica de bienes embargados a Cerrajería Mora, S.L. finaliza el 10 de junio de 2027. Conforme al artículo 104 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el último día en que puede reunirse la Mesa?"
  options:
  - id: a
    correct: true
    text:
      es: "El 25 de junio de 2027, contando 15 días naturales desde el día siguiente a la finalización."
  - id: b
    text:
      es: "El 24 de junio de 2027, contando 15 días naturales desde el mismo día de la finalización."
  - id: c
    text:
      es: "El 1 de julio de 2027, contando 15 días hábiles desde el día siguiente a la finalización de la fase de ofertas."
  - id: d
    text:
      es: "El 26 de junio de 2027, contando 16 días naturales desde la finalización."
  explanation:
    es: "Los plazos por días se cuentan desde el día siguiente (art. 30 LPAC). El día 1 es el 11 de junio y el día 15 es el 25 de junio de 2027, plazo de 15 días naturales (art. 104 bis.1 RGR). Contar desde el mismo día daría el 24, que acorta el plazo. Los 15 días hábiles llevarían al 1 de julio. Y los 16 días no son el plazo del artículo."
  citation: "art. 104 bis.1 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2005-14803-art-111
- id: m03-l12-q0149
  prompt:
    es: "El tipo de subasta de un inmueble embargado a Gráficas Vera, S.L. es de 60.000 euros y el precio de remate es de 80.000 euros. El adjudicatario opta por el otorgamiento de escritura pública de venta. Conforme al artículo 111.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué ingreso adicional debe efectuar en el plazo de 5 días desde la notificación de la adjudicación?"
  options:
  - id: a
    correct: true
    text:
      es: "4.000 euros, el 5 por ciento del precio de remate."
  - id: b
    text:
      es: "6.000 euros, el 10 por ciento del tipo de subasta."
  - id: c
    text:
      es: "8.000 euros, el 10 por ciento del precio de remate."
  - id: d
    text:
      es: "3.000 euros, el 5 por ciento del tipo de subasta."
  explanation:
    es: "El ingreso adicional es del 5 por ciento del precio de remate: 80.000 × 0,05 = 4.000 euros (art. 111.1 RGR). Los 3.000 euros aplican el 5 por ciento al tipo, que no es la base. Los 8.000 y los 6.000 euros aplican un 10 por ciento, porcentaje del depósito de bienes muebles y de la puja mínima, no de este ingreso."
  citation: "art. 111.1 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-106
- id: m03-l12-q0151
  prompt:
    es: "De acuerdo con el artículo 106.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la enajenación de bienes embargados solo puede celebrarse por concurso cuando la realización de lo embargado por medio de subasta pudiera producir perturbaciones nocivas en el mercado o:"
  options:
  - id: a
    text:
      es: "cuando el obligado al pago lo solicite de forma expresa y motivada ante el órgano de recaudación."
  - id: b
    correct: true
    text:
      es: "cuando existan otras razones de interés público debidamente justificadas."
  - id: c
    text:
      es: "cuando los bienes embargados sean productos perecederos que no admitan una subasta pública."
  - id: d
    text:
      es: "cuando la primera subasta haya quedado desierta por falta de licitadores admitidos."
  explanation:
    es: "El concurso tiene solo dos supuestos: las perturbaciones nocivas en el mercado por las cualidades o la magnitud de lo embargado y otras razones de interés público justificadas (art. 106.1 RGR). La petición del obligado y la subasta desierta no son causas de concurso. Los productos perecederos llevan a la adjudicación directa (art. 107.1.b RGR)."
  citation: "art. 106.1 RGR"
  difficulty: 2
  tags:
  - "supuesto-legal"
# anchor: boe-a-2005-14803-art-106
- id: m03-l12-q0153
  prompt:
    es: "Conforme al artículo 106.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el concurso debe ser autorizado por el órgano competente y su convocatoria se publica en el Boletín Oficial del Estado y en:"
  options:
  - id: a
    correct: true
    text:
      es: "el boletín oficial correspondiente a la demarcación territorial del órgano de recaudación al que esté adscrito el obligado al pago."
  - id: b
    text:
      es: "el tablón de anuncios del Registro de la Propiedad en cuya demarcación radiquen los bienes embargados."
  - id: c
    text:
      es: "dos periódicos de gran difusión de la provincia donde radique el domicilio fiscal del obligado."
  - id: d
    text:
      es: "el Portal de Subastas de la Agencia Estatal Boletín Oficial del Estado, de forma exclusiva y electrónica."
  explanation:
    es: "La convocatoria del concurso va al BOE y al boletín oficial de la demarcación del órgano de recaudación al que pertenece el obligado (art. 106.2 RGR). El Portal de Subastas es el cauce de la subasta (art. 100.2). El tablón del registro y los periódicos de gran difusión no son el medio de publicación del concurso."
  citation: "art. 106.2 RGR"
  difficulty: 2
  tags:
  - "publicidad"
# anchor: boe-a-2005-14803-art-106
- id: m03-l12-q0154
  prompt:
    es: "Según el artículo 106.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, terminado el plazo de admisión de ofertas del concurso, ¿en qué plazo decide el órgano competente adjudicar el concurso o declararlo desierto?"
  options:
  - id: a
    text:
      es: "En el plazo de quince días naturales."
  - id: b
    text:
      es: "En el plazo de un mes desde la convocatoria."
  - id: c
    text:
      es: "En el plazo de tres meses desde la última oferta."
  - id: d
    correct: true
    text:
      es: "En el plazo de cinco días."
  explanation:
    es: "El órgano decide en cinco días (art. 106.3 RGR). Los quince días naturales son el plazo máximo de reunión de la Mesa en la subasta (art. 104 bis.1), y el mes es el de las gestiones de la adjudicación directa (art. 107.3). Los tres meses no son un plazo de este artículo."
  citation: "art. 106.3 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0156
  prompt:
    es: "Según el artículo 107.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, procede la adjudicación directa de los bienes o derechos embargados en otros casos en que no sea posible o no convenga promover concurrencia, siempre que:"
  options:
  - id: a
    text:
      es: "se hayan celebrado antes dos subastas sin adjudicación."
  - id: b
    text:
      es: "lo autorice el juez competente por razón del territorio."
  - id: c
    correct: true
    text:
      es: "existan razones justificadas en el expediente."
  - id: d
    text:
      es: "haya consentimiento expreso del obligado al pago."
  explanation:
    es: "En los casos residuales de adjudicación directa basta que las razones por las que no se promueve concurrencia estén justificadas en el expediente (art. 107.1.c RGR). El artículo no pide autorización judicial, ni consentimiento del obligado, ni dos subastas previas."
  citation: "art. 107.1 RGR"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0157
  prompt:
    es: "El órgano de recaudación embarga a Lácteos Serrano, S.L. un lote de yogures con fecha de caducidad en diez días. Conforme al artículo 107.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué forma de enajenación procede?"
  options:
  - id: a
    text:
      es: "El concurso, porque la caducidad próxima pudiera producir perturbaciones nocivas en el mercado."
  - id: b
    text:
      es: "La adjudicación a la Hacienda pública, por el importe del débito perseguido."
  - id: c
    correct: true
    text:
      es: "La adjudicación directa, porque se trata de productos perecederos."
  - id: d
    text:
      es: "La subasta pública, que es siempre el único procedimiento posible para enajenar bienes embargados."
  explanation:
    es: "Los productos perecederos permiten la adjudicación directa (art. 107.1.b RGR). El concurso exige perturbaciones nocivas en el mercado o interés público justificado, y no basta la caducidad. La subasta es el procedimiento ordinario, pero no excluye las demás formas. La adjudicación a la Hacienda pública es un cierre del apremio para bienes no adjudicados en la enajenación."
  citation: "art. 107.1 RGR"
  difficulty: 2
  tags:
  - "supuesto"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0158
  prompt:
    es: "De acuerdo con el artículo 107.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el órgano de recaudación realiza las gestiones conducentes a la adjudicación directa en las mejores condiciones económicas en el plazo de:"
  options:
  - id: a
    text:
      es: "tres meses contados a partir del día siguiente de la notificación del acuerdo de enajenación."
  - id: b
    text:
      es: "un mes contado a partir de la fecha de la publicación de la convocatoria en la sede electrónica de la Administración que corresponda."
  - id: c
    correct: true
    text:
      es: "un mes contado a partir del día siguiente de la notificación del acuerdo de enajenación por adjudicación directa."
  - id: d
    text:
      es: "quince días contados a partir del día siguiente de la notificación del acuerdo de enajenación."
  explanation:
    es: "El plazo es de un mes desde el día siguiente a la notificación del acuerdo (art. 107.3 RGR). Los quince días y los tres meses no son plazos del apartado, y no se cuenta desde la publicación de la convocatoria."
  citation: "art. 107.3 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0159
  prompt:
    es: "El acuerdo de enajenación por adjudicación directa de unos bienes embargados a Textiles Navas, S.L. se notifica el 12 de abril de 2027. Según el artículo 107.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿hasta qué fecha dispone el órgano de recaudación para realizar las gestiones conducentes a la adjudicación?"
  options:
  - id: a
    text:
      es: "Hasta el 13 de mayo de 2027, porque el mes empieza a contarse desde el día siguiente y termina un día después del mismo día de la notificación."
  - id: b
    text:
      es: "Hasta el 11 de mayo de 2027, porque el mes termina el día anterior al de la notificación."
  - id: c
    text:
      es: "Hasta el 27 de abril de 2027, porque el plazo es de quince días desde la notificación."
  - id: d
    correct: true
    text:
      es: "Hasta el 12 de mayo de 2027, porque el mes se cuenta de fecha a fecha desde el día siguiente a la notificación."
  explanation:
    es: "El plazo se computa desde el día siguiente a la notificación y, al estar fijado en meses, termina el mismo día del mes de vencimiento (art. 30.4 LPAC): 12 de abril más un mes, el 12 de mayo de 2027 (art. 107.3 RGR). Terminar el día 11 acorta el mes y terminar el 13 lo alarga. Los quince días no son el plazo del artículo."
  citation: "art. 107.3 RGR"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0161
  prompt:
    es: "Según el artículo 172.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la adjudicación de bienes a la Hacienda pública se acuerda por el importe del débito perseguido, sin que en ningún caso pueda rebasar:"
  options:
  - id: a
    text:
      es: "el 50 por ciento del tipo inicial fijado en el procedimiento de enajenación."
  - id: b
    text:
      es: "el 75 por ciento de la valoración inicial de los bienes embargados."
  - id: c
    text:
      es: "el 100 por cien del último tipo de subasta, una vez aplicado el coeficiente corrector."
  - id: d
    correct: true
    text:
      es: "el 75 por ciento del tipo inicial fijado en el procedimiento de enajenación."
  explanation:
    es: "El límite es el 75 por ciento del tipo inicial del procedimiento de enajenación (art. 172.2 LGT). El 50 por ciento es el umbral de adjudicación de la Mesa en la subasta (art. 104 bis.1 RGR). El límite no se refiere a la valoración sino al tipo inicial, y no se calcula sobre el tipo corregido de subastas posteriores."
  citation: "art. 172.2 LGT"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0162
  prompt:
    es: "Un inmueble embargado a Bodegas Quirós, S.L. no se adjudicó en el procedimiento de enajenación, cuyo tipo inicial era de 200.000 euros. El débito perseguido es de 180.000 euros. Conforme al artículo 172.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿por qué importe puede adjudicarse el inmueble a la Hacienda pública?"
  options:
  - id: a
    text:
      es: "Por 200.000 euros, el tipo inicial completo."
  - id: b
    text:
      es: "Por 100.000 euros, el 50 por ciento del tipo inicial."
  - id: c
    text:
      es: "Por 180.000 euros, el importe íntegro del débito perseguido."
  - id: d
    correct: true
    text:
      es: "Por 150.000 euros, porque la adjudicación no puede rebasar el 75 por ciento del tipo inicial."
  explanation:
    es: "La adjudicación es por el débito, pero con el techo del 75 por ciento del tipo inicial: 200.000 × 0,75 = 150.000 euros, menos que el débito, y por tanto es el importe de la adjudicación (art. 172.2 LGT). Los 180.000 euros rebasan el límite. Los 100.000 aplican un 50 por ciento inexistente. Los 200.000 son el tipo inicial."
  citation: "art. 172.2 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-108
- id: m03-l12-q0164
  prompt:
    es: "Conforme al artículo 108 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, son competentes para adjudicar bienes o derechos a la Hacienda pública en pago de deudas no cubiertas en el curso del procedimiento de apremio:"
  options:
  - id: a
    text:
      es: "la Dirección General del Patrimonio del Estado, en todos los casos."
  - id: b
    text:
      es: "los Delegados de Economía y Hacienda de la provincia donde estén los bienes."
  - id: c
    text:
      es: "los órganos de recaudación que hayan tramitado el procedimiento de enajenación."
  - id: d
    correct: true
    text:
      es: "los órganos que establezca la norma de organización específica."
  explanation:
    es: "La competencia depende de la norma de organización específica (art. 108 RGR). El órgano de recaudación solo propone la adjudicación (art. 109.1). Los Delegados de Economía y Hacienda informan en ciertos casos, y la Dirección General del Patrimonio del Estado solo es consultada si las cargas superan el valor de adjudicación (art. 109.2)."
  citation: "art. 108 RGR"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-109
- id: m03-l12-q0165
  prompt:
    es: "Cuando en el procedimiento de enajenación no se hayan adjudicado alguno o algunos de los bienes embargados, el artículo 109.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que el órgano de recaudación competente puede:"
  options:
  - id: a
    text:
      es: "proponer su adjudicación a los acreedores hipotecarios en pago de los créditos que figuren en la certificación de cargas."
  - id: b
    text:
      es: "ordenar su devolución al obligado al pago, con extinción de las deudas no cubiertas."
  - id: c
    correct: true
    text:
      es: "proponer de forma motivada al órgano competente su adjudicación a la Hacienda pública en pago de las deudas no cubiertas."
  - id: d
    text:
      es: "adjudicarlos directamente a la Hacienda pública sin necesidad de propuesta motivada."
  explanation:
    es: "El órgano de recaudación propone, de forma motivada, y decide el órgano competente (art. 109.1 RGR). No adjudica por sí mismo. La adjudicación a los acreedores hipotecarios no es una vía prevista, y la devolución al obligado no extingue las deudas no cubiertas."
  citation: "art. 109.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-109
- id: m03-l12-q0166
  prompt:
    es: "Según el artículo 109.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si las cargas o gravámenes de un inmueble son superiores al valor en que debe adjudicarse a la Hacienda pública, ¿a quién consulta el órgano competente y en qué plazo contesta?"
  options:
  - id: a
    correct: true
    text:
      es: "A la Dirección General del Patrimonio del Estado, que contesta en el plazo de tres meses."
  - id: b
    text:
      es: "Al órgano con funciones de asesoramiento jurídico, que contesta en el plazo de seis meses."
  - id: c
    text:
      es: "Al Delegado de Economía y Hacienda, que contesta en el plazo de tres meses."
  - id: d
    text:
      es: "A la Dirección General del Patrimonio del Estado, que contesta en el plazo de un mes."
  explanation:
    es: "La consulta se dirige a la Dirección General del Patrimonio del Estado, con plazo de tres meses (art. 109.2 RGR). El Delegado de Economía y Hacienda informa sobre la utilidad de los inmuebles sin cargas superiores. El órgano de asesoramiento jurídico puede informar antes del acuerdo, y no hay plazo de seis meses para este trámite."
  citation: "art. 109.2 RGR"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2005-14803-art-109
- id: m03-l12-q0167
  prompt:
    es: "Un inmueble de Estampaciones Peña, S.L. tiene cargas superiores al valor en que debe adjudicarse a la Hacienda pública. El órgano competente consulta a la Dirección General del Patrimonio del Estado el 1 de febrero de 2027. Pasados tres meses sin contestación, ¿qué debe hacer el órgano competente conforme al artículo 109.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Acordar la adjudicación, porque el silencio de la Dirección General equivale a contestación afirmativa."
  - id: b
    text:
      es: "Esperar sin límite de tiempo la contestación, que es preceptiva y vinculante."
  - id: c
    correct: true
    text:
      es: "No acordar la adjudicación, porque si no contesta en el plazo la adjudicación no se acuerda."
  - id: d
    text:
      es: "Acordar la adjudicación solo por el importe del débito, con el límite del 75 por ciento del tipo."
  explanation:
    es: "Si el centro directivo no contesta en tres meses, o contesta en sentido negativo, no se acuerda la adjudicación (art. 109.2 RGR). El silencio no vale como afirmativo. El plazo es de tres meses, no ilimitado. El límite del 75 por ciento es del artículo 172.2 LGT y presupone que la adjudicación se acuerde."
  citation: "art. 109.2 RGR"
  difficulty: 3
  tags:
  - "supuesto"
  - "efecto"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0168
  prompt:
    es: "Ingresado el remate, el artículo 104 bis.3.e del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se entrega a los adjudicatarios certificación del acta de adjudicación de los bienes, salvo que hayan optado por:"
  options:
  - id: a
    text:
      es: "la reserva de su depósito para el caso de incumplimiento del mejor postor."
  - id: b
    text:
      es: "la adjudicación en documento privado ante el órgano de recaudación."
  - id: c
    text:
      es: "la entrega material de los bienes en el acto de la subasta."
  - id: d
    correct: true
    text:
      es: "el otorgamiento de escritura pública de venta del artículo 111.1."
  explanation:
    es: "Pagado el remate, se entrega certificación del acta de adjudicación, salvo que el adjudicatario haya optado por la escritura pública de venta (arts. 104 bis.3.e y 111.1 RGR). La entrega material, la reserva del depósito y el documento privado no son alternativas del apartado."
  citation: "art. 104 bis.3.e RGR"
  difficulty: 2
  tags:
  - "documento"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0169
  prompt:
    es: "Si finalizados los procedimientos de enajenación quedan bienes o derechos sin adjudicar, ¿hasta cuándo pueden ser objeto de nuevos procedimientos, según el artículo 104 bis.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Durante un año desde que finalizó el último procedimiento de enajenación."
  - id: b
    correct: true
    text:
      es: "Siempre que no se haya producido la prescripción de la acción de cobro de las deudas."
  - id: c
    text:
      es: "Hasta que se adjudiquen a la Hacienda pública por el 75 por ciento del tipo inicial del procedimiento."
  - id: d
    text:
      es: "Hasta que se produzca la declaración de fallido del obligado al pago."
  explanation:
    es: "Los bienes sin adjudicar admiten nuevos procedimientos mientras no prescriba la acción de cobro (art. 104 bis.4 RGR). No hay límite de un año. La declaración de fallido no es el término de este apartado, y la adjudicación a la Hacienda pública es una posibilidad, no un límite para los nuevos procedimientos."
  citation: "art. 104 bis.4 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0170
  prompt:
    es: "Conforme al artículo 104 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre la adjudicación cuando la mejor oferta presentada es igual o superior al 50 por ciento del tipo de subasta del bien:"
  options:
  - id: a
    text:
      es: "La Mesa decide, atendiendo al interés público, si la oferta es suficiente, y puede declarar desierta la subasta."
  - id: b
    correct: true
    text:
      es: "La Mesa adjudica el bien o lote al licitador que hubiera presentado esa postura."
  - id: c
    text:
      es: "La Mesa convoca a los licitadores a una segunda ronda de pujas con el 50 por ciento del tipo como importe de salida."
  - id: d
    text:
      es: "La Mesa adjudica el bien o lote, pero el adjudicatario debe constituir un depósito adicional del 5 por ciento."
  explanation:
    es: "Con una oferta igual o superior al 50 por ciento del tipo, la Mesa adjudica al licitador que la presentó (art. 104 bis.1.a RGR). La decisión discrecional por interés público es la del caso de ofertas inferiores al 50 por ciento (letra b). No hay segunda ronda de pujas ni un depósito adicional del 5 por ciento en este apartado."
  citation: "art. 104 bis.1 RGR"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-105
- id: m03-l12-q0172
  prompt:
    es: "¿A quién puede encargar el órgano de recaudación competente la ejecución material de las subastas, según el artículo 105.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "A empresas o profesionales especializados."
  - id: b
    text:
      es: "A los notarios designados por el Colegio Notarial."
  - id: c
    text:
      es: "A las entidades de crédito que colaboran en la recaudación."
  - id: d
    text:
      es: "A los registradores de la propiedad del lugar de los bienes."
  explanation:
    es: "La ejecución material de las subastas puede encargarse a empresas o profesionales especializados (art. 105.1 RGR). Los registradores, los notarios y las entidades de crédito colaboradoras no figuran en el artículo."
  citation: "art. 105.1 RGR"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-105
- id: m03-l12-q0173
  prompt:
    es: "En las subastas encargadas a empresas especializadas, el artículo 105.2.e del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación establece que, cuando se pagan las cantidades del artículo 169.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria en el acto de la subasta, el representante de la Mesa:"
  options:
  - id: a
    text:
      es: "adjudica los bienes al licitador presente que haya ofrecido más."
  - id: b
    correct: true
    text:
      es: "suspende la licitación de los bienes correspondientes."
  - id: c
    text:
      es: "declara desierta la subasta de todos los lotes del procedimiento."
  - id: d
    text:
      es: "continúa la licitación y aplica el pago al precio de remate."
  explanation:
    es: "El pago de deuda, intereses, recargos y costas en el acto suspende la licitación de los bienes correspondientes (art. 105.2.e RGR). No se adjudica, no se anula la subasta entera, y el pago no se aplica al precio de remate."
  citation: "art. 105.2 RGR"
  difficulty: 1
  tags:
  - "efecto"
