# anchor: boe-a-2015-10565-art-41
- id: m02-l02-q0142
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la acreditación de la notificación efectuada se incorporará:"
  options:
  - id: a
    text:
      es: "Al registro electrónico general de la Administración notificante."
  - id: b
    correct: true
    text:
      es: "Al expediente administrativo."
  - id: c
    text:
      es: "A la sede electrónica personal del interesado."
  - id: d
    text:
      es: "Al Punto de Acceso General electrónico de la Administración."
  explanation:
    es: "El artículo 41.1 dispone que la acreditación de la notificación efectuada se incorpora al expediente. El registro electrónico, la sede electrónica del interesado y el Punto de Acceso General son medios de presentación y de acceso, no el lugar donde se conserva la acreditación."
  citation: "art. 41 LPAC"
  difficulty: 1
  tags:
  - "notificación"
  - "acreditación"
# anchor: boe-a-2015-10565-art-41
- id: m02-l02-q0145
  prompt:
    es: "Señale la respuesta CORRECTA sobre el aviso de puesta a disposición de la notificación, de acuerdo con el artículo 41.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Las Administraciones enviarán el aviso solo cuando la notificación se realice por medios electrónicos."
  - id: b
    correct: true
    text:
      es: "Las Administraciones enviarán el aviso con independencia de que la notificación se realice en papel o por medios electrónicos."
  - id: c
    text:
      es: "Las Administraciones enviarán el aviso solo cuando el interesado esté obligado a recibir las notificaciones electrónicamente."
  - id: d
    text:
      es: "Las Administraciones enviarán el aviso solo cuando el interesado lo solicite expresamente en cada notificación."
  explanation:
    es: "El artículo 41.6 obliga a enviar el aviso al dispositivo o a la dirección de correo que el interesado haya comunicado, con independencia de que la notificación sea en papel o electrónica. No se limita a las electrónicas, ni a quien esté obligado a recibirlas por esa vía, ni depende de una petición del interesado en cada caso."
  citation: "art. 41 LPAC"
  difficulty: 2
  tags:
  - "notificación"
  - "avisos"
# anchor: boe-a-2015-10565-art-41
- id: m02-l02-q0146
  prompt:
    es: "La Administración pone a disposición de don Pablo Rivas una notificación en la sede electrónica, pero no le envía el aviso al correo electrónico que él había comunicado. De acuerdo con el artículo 41.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene la falta de ese aviso?"
  options:
  - id: a
    text:
      es: "Impide que la notificación sea considerada válida hasta que se envíe el aviso."
  - id: b
    text:
      es: "Obliga a repetir la notificación en papel en el domicilio del interesado."
  - id: c
    text:
      es: "Determina que la notificación sea anulable a instancia del interesado."
  - id: d
    correct: true
    text:
      es: "No impide que la notificación sea considerada plenamente válida."
  explanation:
    es: "La última frase del artículo 41.6 dispone que la falta de práctica del aviso no impide que la notificación sea considerada plenamente válida. Por eso no hay que esperar al aviso, no se repite en papel y no se convierte en anulable."
  citation: "art. 41 LPAC"
  difficulty: 2
  tags:
  - "notificación"
  - "avisos"
# anchor: boe-a-2015-10565-art-42
- id: m02-l02-q0148
  prompt:
    es: "De acuerdo con el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si nadie se hiciera cargo de la notificación en el domicilio del interesado, se hará constar esta circunstancia en el expediente, junto con:"
  options:
  - id: a
    text:
      es: "El día y la hora en que se intentará de nuevo la notificación."
  - id: b
    text:
      es: "El día, pero no la hora, en que se intentó la notificación."
  - id: c
    text:
      es: "La identidad de la persona que se negó a hacerse cargo de ella."
  - id: d
    correct: true
    text:
      es: "El día y la hora en que se intentó la notificación."
  explanation:
    es: "El artículo 42.2 exige dejar constancia del día y la hora del intento fallido, para poder ajustar después el segundo intento en una hora distinta. No se anota la fecha del segundo intento, ni basta con el día sin la hora, ni se identifica a una persona que se negó, porque la hipótesis es que nadie se hizo cargo."
  citation: "art. 42 LPAC"
  difficulty: 2
  tags:
  - "notificación"
  - "papel"
# anchor: boe-a-2015-10565-art-47
- id: m02-l02-q0154
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la nulidad de pleno derecho es correcta, según el artículo 47 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Los actos nulos de pleno derecho se enumeran en el apartado 1, y las disposiciones administrativas nulas de pleno derecho, en el apartado 2."
  - id: b
    text:
      es: "Las disposiciones nulas de pleno derecho se enumeran en el apartado 1, y los actos nulos de pleno derecho, en el apartado 2."
  - id: c
    text:
      es: "Solo se enumeran los actos nulos de pleno derecho, y las disposiciones administrativas solo pueden ser anulables."
  - id: d
    text:
      es: "Los actos nulos de pleno derecho se enumeran en el apartado 1, y los actos anulables, en el apartado 2."
  explanation:
    es: "El artículo 47.1 recoge los casos de nulidad de pleno derecho de los actos, y el 47.2 los de las disposiciones administrativas. La anulabilidad se regula en el artículo 48. Los distractores invierten los apartados, niegan la nulidad de las disposiciones o llevan la anulabilidad a un apartado que no la contiene."
  citation: "art. 47 LPAC"
  difficulty: 2
  tags:
  - "nulidad de pleno derecho"
# anchor: boe-a-2015-10565-art-52
- id: m02-l02-q0157
  prompt:
    es: "Según el artículo 52.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el acto de convalidación producirá efecto:"
  options:
  - id: a
    text:
      es: "Desde la fecha en que se dictó el acto viciado, en todo caso y sin excepción alguna."
  - id: b
    text:
      es: "Desde la fecha de notificación del acto viciado, salvo lo dispuesto en el artículo 39.3."
  - id: c
    correct: true
    text:
      es: "Desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos."
  - id: d
    text:
      es: "Desde la fecha en que se subsanó el vicio, con eficacia retroactiva obligatoria desde esa fecha."
  explanation:
    es: "La convalidación produce efectos desde la fecha del propio acto de convalidación, con la excepción que permite la retroactividad del artículo 39.3. No retrotrae sin más al acto viciado ni a su notificación, y la retroactividad no es obligatoria, sino excepcional."
  citation: "art. 52 LPAC"
  difficulty: 1
  tags:
  - "convalidación"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0082
  prompt:
    es: "De acuerdo con el artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la declaración de oficio de la nulidad de un acto en los supuestos del artículo 47.1 requiere:"
  options:
  - id: a
    text:
      es: "Dictamen previo del Consejo de Estado u órgano consultivo autonómico equivalente, incluso desfavorable."
  - id: b
    correct: true
    text:
      es: "Dictamen favorable previo del Consejo de Estado u órgano consultivo autonómico equivalente, si lo hubiere."
  - id: c
    text:
      es: "Informe previo de la Abogacía del Estado o del servicio jurídico de la Comunidad Autónoma."
  - id: d
    text:
      es: "Autorización previa del órgano superior jerárquico del que dictó el acto que se revisa."
  explanation:
    es: "El artículo 106.1 exige el «previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, si lo hubiere». El dictamen tiene que ser favorable: con un dictamen desfavorable la nulidad no se declara. El precepto no pide un informe de la Abogacía del Estado ni la autorización del superior jerárquico del órgano que dictó el acto."
  citation: "art. 106.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0083
  prompt:
    es: "¿Cuál de los siguientes actos, incurso en un supuesto del artículo 47.1, puede declararse nulo de oficio conforme al artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Solo un acto que no haya sido recurrido en plazo, pero nunca uno que puso fin a la vía."
  - id: b
    correct: true
    text:
      es: "Un acto que haya puesto fin a la vía administrativa o que no haya sido recurrido en plazo."
  - id: c
    text:
      es: "Un acto todavía recurrible en alzada, mientras no haya transcurrido el plazo de un mes."
  - id: d
    text:
      es: "Un acto recurrido en alzada en plazo, con el recurso pendiente de resolver."
  explanation:
    es: "El artículo 106.1 permite declarar la nulidad de los actos «que hayan puesto fin a la vía administrativa o que no hayan sido recurridos en plazo». Los dos supuestos valen, de modo que limitarlo a los actos no recurridos es incorrecto. Un acto todavía recurrible en alzada no ha puesto fin a la vía ni ha dejado pasar el plazo, y lo mismo ocurre con el que tiene una alzada pendiente: en ese caso la nulidad se hace valer en el recurso."
  citation: "art. 106.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0084
  prompt:
    es: "Según el artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo y a iniciativa de quién declaran las Administraciones de oficio la nulidad de los actos del artículo 47.1?"
  options:
  - id: a
    correct: true
    text:
      es: "En cualquier momento, por iniciativa propia o a solicitud de interesado."
  - id: b
    text:
      es: "En los cuatro años siguientes a la fecha del acto, solo por iniciativa propia."
  - id: c
    text:
      es: "En cualquier momento, pero solo por iniciativa propia, nunca a solicitud de interesado."
  - id: d
    text:
      es: "En el año siguiente a la notificación, por iniciativa propia o a solicitud de interesado."
  explanation:
    es: "El artículo 106.1 dice que las Administraciones declaran de oficio la nulidad «en cualquier momento, por iniciativa propia o a solicitud de interesado». Los cuatro años son el límite de la declaración de lesividad de los actos anulables, según el artículo 107.2, no de la nulidad. El plazo de un año a partir de la notificación contradice «en cualquier momento». Excluir la solicitud del interesado contradice «o a solicitud de interesado», que el apartado admite expresamente."
  citation: "art. 106.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0085
  prompt:
    es: "Conforme al artículo 106.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la revisión de oficio se inició a solicitud de interesado y pasan seis meses sin resolver:"
  options:
  - id: a
    text:
      es: "Se podrá entender estimada la solicitud por silencio administrativo."
  - id: b
    correct: true
    text:
      es: "Se podrá entender desestimada la solicitud por silencio administrativo."
  - id: c
    text:
      es: "Se producirá la caducidad del procedimiento de revisión de oficio iniciado."
  - id: d
    text:
      es: "El órgano deberá recabar un nuevo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 106.5 distingue según cómo empezó el procedimiento: «Si el procedimiento se hubiera iniciado a solicitud de interesado, se podrá entender la misma desestimada por silencio administrativo». El silencio es negativo, no estimatorio. La caducidad es la consecuencia del procedimiento iniciado de oficio. El precepto no ordena pedir un nuevo dictamen al Consejo de Estado."
  citation: "art. 106.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2015-10565-art-107
- id: m02-l02-q0087
  prompt:
    es: "De acuerdo con el artículo 107.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos favorables para los interesados que sean anulables, previa declaración de lesividad, se impugnan:"
  options:
  - id: a
    correct: true
    text:
      es: "Ante el orden jurisdiccional contencioso-administrativo, por la Administración."
  - id: b
    text:
      es: "Ante el órgano superior jerárquico del que los dictó, mediante recurso de alzada."
  - id: c
    text:
      es: "Ante el Consejo de Estado, que resuelve mediante un dictamen vinculante."
  - id: d
    text:
      es: "Ante el mismo órgano que los dictó, mediante recurso extraordinario de revisión."
  explanation:
    es: "Según el artículo 107.1, las Administraciones «podrán impugnar ante el orden jurisdiccional contencioso-administrativo los actos favorables para los interesados que sean anulables», previa su declaración de lesividad para el interés público. La Administración no anula por sí misma esos actos. La alzada y el extraordinario de revisión son recursos de los interesados, no vías de la Administración contra sus propios actos, y el Consejo de Estado no resuelve la impugnación."
  citation: "art. 107.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-107
- id: m02-l02-q0088
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de lesividad es correcta según el artículo 107.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Exige la previa audiencia de los interesados y no es susceptible de recurso."
  - id: b
    text:
      es: "Puede adoptarse sin audiencia de los interesados y no es susceptible de recurso."
  - id: c
    text:
      es: "Exige la previa audiencia de quienes aparezcan como interesados y es recurrible en alzada."
  - id: d
    text:
      es: "Puede adoptarse sin audiencia de los interesados y es recurrible en vía administrativa."
  explanation:
    es: "El artículo 107.2 dice que la declaración de lesividad «exigirá la previa audiencia de cuantos aparezcan como interesados» y que «no será susceptible de recurso». Las opciones que suprimen la audiencia contradicen la primera regla. Las que la hacen recurrible, en alzada o en vía administrativa, contradicen la segunda."
  citation: "art. 107.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10565-art-110
- id: m02-l02-q0094
  prompt:
    es: "De acuerdo con el artículo 110 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, no caben las facultades de revisión cuando, por el tiempo transcurrido u otras circunstancias, su ejercicio resulte contrario:"
  options:
  - id: a
    text:
      es: "A la equidad, a la seguridad jurídica, al interés general o a las leyes."
  - id: b
    text:
      es: "A la buena fe, a la confianza legítima, al interés público o a la Constitución."
  - id: c
    correct: true
    text:
      es: "A la equidad, a la buena fe, al derecho de los particulares o a las leyes."
  - id: d
    text:
      es: "Al interés público, a la igualdad, al derecho de los particulares o a los reglamentos."
  explanation:
    es: "El artículo 110 enumera cuatro límites: la revisión no cabe cuando su ejercicio «resulte contrario a la equidad, a la buena fe, al derecho de los particulares o a las leyes». Las demás opciones cambian alguno de esos términos por la seguridad jurídica, el interés general, la confianza legítima, la Constitución, la igualdad o los reglamentos. La igualdad y el interés público son límites de la revocación (art. 109.1), no del artículo 110."
  citation: "art. 110 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-111
- id: m02-l02-q0095
  prompt:
    es: "En los organismos públicos estatales, ¿cuál de las siguientes reglas de competencia para la revisión de oficio recoge el artículo 111 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda revisa los actos del máximo órgano rector y los de sus órganos dependientes."
  - id: b
    correct: true
    text:
      es: "El órgano de adscripción revisa los actos del máximo órgano rector, y este los de sus órganos dependientes."
  - id: c
    text:
      es: "Cada órgano del organismo revisa sus propios actos, sin que intervenga nunca el órgano de adscripción."
  - id: d
    text:
      es: "El Consejo de Estado revisa los actos del máximo órgano rector, y el Ministro los de los demás."
  explanation:
    es: "El artículo 111.c) reparte la competencia en dos escalones: los órganos de adscripción revisan los actos «dictados por el máximo órgano rector», y los máximos órganos rectores los «dictados por los órganos de ellos dependientes». Ningún órgano revisa sus propios actos, el Ministerio de Hacienda no tiene una competencia general sobre los organismos de otros departamentos y el Consejo de Estado dictamina, pero no revisa."
  citation: "art. 111.c) LPAC"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10565-art-111
- id: m02-l02-q0096
  prompt:
    es: "Según el artículo 111.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién revisa de oficio un acto nulo de un órgano dependiente del máximo órgano rector de un organismo público estatal?"
  options:
  - id: a
    text:
      es: "El órgano al que está adscrito el organismo público."
  - id: b
    text:
      es: "El Subsecretario del departamento de adscripción."
  - id: c
    text:
      es: "El mismo órgano dependiente que dictó el acto."
  - id: d
    correct: true
    text:
      es: "El máximo órgano rector del organismo público."
  explanation:
    es: "El artículo 111.c).2.º de la Ley 39/2015 atribuye a «los máximos órganos rectores» de los organismos públicos la revisión de los actos «dictados por los órganos de ellos dependientes». El órgano de adscripción revisa solo los actos del propio máximo órgano rector (art. 111.c).1.º). La ley no da esta competencia al Subsecretario ni al órgano autor del acto."
  citation: "art. 111.c) LPAC"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0106
  prompt:
    es: "Señale de qué pueden declarar de oficio la nulidad en cualquier momento las Administraciones, previo dictamen del Consejo de Estado, según el artículo 106.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Los actos de trámite que produzcan indefensión."
  - id: b
    correct: true
    text:
      es: "Las disposiciones administrativas, en los supuestos del artículo 47.2."
  - id: c
    text:
      es: "Los actos anulables por desviación de poder."
  - id: d
    text:
      es: "Las resoluciones judiciales firmes."
  explanation:
    es: "El artículo 106.2 permite declarar de oficio, previo dictamen favorable, la nulidad de las disposiciones administrativas en los supuestos del artículo 47.2. Los actos de trámite con indefensión y los actos anulables no son objeto de ese apartado, y las resoluciones judiciales no son actos de la Administración."
  citation: "art. 106.2 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1980-8648-art-22
- id: m02-l02-q0111
  prompt:
    es: "Conforme al artículo 22 de la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, la Comisión Permanente debe ser consultada sobre la revisión de oficio de:"
  options:
  - id: a
    text:
      es: "Únicamente las disposiciones administrativas de carácter general."
  - id: b
    correct: true
    text:
      es: "Disposiciones administrativas y actos administrativos, en los supuestos previstos por las leyes."
  - id: c
    text:
      es: "Únicamente los actos que hayan puesto fin a la vía administrativa."
  - id: d
    text:
      es: "Los actos y disposiciones de las Comunidades Autónomas, en todo caso."
  explanation:
    es: "El apartado diez del artículo 22 manda consultar a la Comisión Permanente sobre la revisión de oficio de disposiciones y actos administrativos, en los supuestos previstos por las leyes. No se limita a las disposiciones generales ni a los actos que agotan la vía administrativa, y las Comunidades Autónomas pueden tener su propio órgano consultivo."
  citation: "art. 22.10 LO 3/1980"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-108
- id: m02-l02-q0112
  prompt:
    es: "Según el artículo 108 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento de declaración de lesividad de un acto favorable, ¿qué órgano puede acordar la suspensión de su ejecución?"
  options:
  - id: a
    text:
      es: "El juez de lo contencioso-administrativo, solo tras admitir el recurso."
  - id: b
    correct: true
    text:
      es: "El órgano competente para declarar la lesividad del acto."
  - id: c
    text:
      es: "El Consejo de Estado, al emitir su dictamen sobre el acto."
  - id: d
    text:
      es: "Ninguno, porque un acto favorable no se suspende antes de la sentencia."
  explanation:
    es: "El artículo 108 se aplica a los dos procedimientos de los artículos 106 y 107, la nulidad y la lesividad, y atribuye la suspensión al «órgano competente para declarar la nulidad o lesividad». En la lesividad, ese órgano puede suspender el acto favorable antes de que se impugne ante los tribunales. No hace falta esperar al juez ni a la sentencia. El Consejo de Estado emite dictámenes en la nulidad de oficio y no suspende actos."
  citation: "art. 108 LPAC"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
  - "efecto"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0114
  prompt:
    es: "En la revisión de oficio, según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano competente puede inadmitir a trámite, motivadamente y sin recabar dictamen, la solicitud que:"
  options:
  - id: a
    correct: true
    text:
      es: "carezca de manera manifiesta de fundamento."
  - id: b
    text:
      es: "se presente pasados cuatro años desde que se dictó el acto."
  - id: c
    text:
      es: "no vaya acompañada de informe de la Abogacía del Estado."
  - id: d
    text:
      es: "repita otra desestimada solo por motivos de forma."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite, sin dictamen, las solicitudes que «carezcan manifiestamente de fundamento», que no se basen en una causa del artículo 47.1 o que repitan otras «desestimadas en cuanto al fondo». Pasados cuatro años no es causa: el artículo 106.1 admite la revisión de nulidad «en cualquier momento». El informe de la Abogacía del Estado no es un requisito: el órgano consultivo que interviene es el Consejo de Estado o el equivalente autonómico, según los apartados 1 y 3. La desestimación anterior debe ser «en cuanto al fondo»: si fue por motivos de forma, no hay una solicitud sustancialmente igual ya resuelta."
  citation: "art. 106.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0115
  prompt:
    es: "Se pide la revisión de oficio de un acto y otra solicitud sustancialmente igual ya se desestimó en cuanto al fondo. Según el artículo 106.3 de la Ley 39/2015, de 1 de octubre, el órgano competente puede:"
  options:
  - id: a
    text:
      es: "declarar la nulidad del acto, sin recabar dictamen del Consejo de Estado."
  - id: b
    text:
      es: "inadmitir la solicitud sin motivar, por tratarse de una petición repetida."
  - id: c
    correct: true
    text:
      es: "acordar motivadamente la inadmisión a trámite, sin recabar dictamen del Consejo de Estado."
  - id: d
    text:
      es: "inadmitir la solicitud solo previo dictamen favorable del Consejo de Estado."
  explanation:
    es: "El artículo 106.3 permite inadmitir a trámite «motivadamente» y «sin necesidad de recabar Dictamen» cuando se hubieran desestimado en cuanto al fondo otras solicitudes sustancialmente iguales. Declarar la nulidad exige dictamen favorable (art. 106.1). La inadmisión tiene que ser motivada, y el dictamen no es previo a ella."
  citation: "art. 106.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-106
- id: m02-l02-q0159
  prompt:
    es: "De acuerdo con el artículo 106.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando el procedimiento de revisión de oficio se hubiera iniciado de oficio, el transcurso del plazo de seis meses desde su inicio sin dictarse resolución producirá:"
  options:
  - id: a
    text:
      es: "La desestimación presunta de la nulidad del acto."
  - id: b
    correct: true
    text:
      es: "La caducidad del procedimiento."
  - id: c
    text:
      es: "La estimación presunta de la nulidad del acto."
  - id: d
    text:
      es: "La suspensión del procedimiento hasta que se dicte resolución."
  explanation:
    es: "En los procedimientos iniciados de oficio, el artículo 106.5 asocia a los seis meses sin resolución la caducidad del procedimiento. La desestimación por silencio es el efecto cuando el procedimiento se inició a solicitud de interesado, y la ley no prevé ni la estimación presunta ni una suspensión del procedimiento."
  citation: "art. 106 LPAC"
  difficulty: 1
  tags:
  - "revisión de oficio"
  - "caducidad"
# anchor: boe-a-2015-10565-art-107
- id: m02-l02-q0161
  prompt:
    es: "Un acto favorable para doña Marta Núñez, anulable, se dictó el 10 de marzo de 2022. El 20 de abril de 2026, la Administración que lo dictó quiere declarar su lesividad para el interés público. Según el artículo 107.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque han transcurrido cuatro años desde que se dictó el acto, el 10 de marzo de 2026."
  - id: b
    text:
      es: "Sí, porque no existe plazo máximo para declarar la lesividad de un acto anulable."
  - id: c
    text:
      es: "Sí, porque el plazo para declarar la lesividad es de cinco años desde que se dictó el acto administrativo."
  - id: d
    text:
      es: "Sí, porque el plazo de cuatro años se cuenta desde que el acto fue notificado."
  explanation:
    es: "La lesividad no puede declararse una vez transcurridos cuatro años desde que se dictó el acto (art. 107.2). El acto es de 10 de marzo de 2022, de modo que los cuatro años se cumplieron el 10 de marzo de 2026, y el 20 de abril de 2026 es posterior. No hay ausencia de plazo, el plazo no es de cinco años y el cómputo parte de que se dictó el acto, no de su notificación."
  citation: "art. 107 LPAC"
  difficulty: 2
  tags:
  - "lesividad"
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-107
- id: m02-l02-q0163
  prompt:
    es: "Conforme al artículo 107.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, transcurrido el plazo de seis meses desde la iniciación del procedimiento sin que se hubiera declarado la lesividad, se producirá:"
  options:
  - id: a
    text:
      es: "La desestimación presunta de la lesividad."
  - id: b
    correct: true
    text:
      es: "La caducidad del procedimiento."
  - id: c
    text:
      es: "La estimación presunta de la lesividad."
  - id: d
    text:
      es: "La prórroga del procedimiento por otros seis meses."
  explanation:
    es: "El artículo 107.3 prevé la caducidad del procedimiento cuando pasan seis meses desde su iniciación sin declarar la lesividad. No hay silencio positivo ni negativo, y tampoco se prorroga el procedimiento."
  citation: "art. 107 LPAC"
  difficulty: 1
  tags:
  - "lesividad"
  - "caducidad"
# anchor: boe-a-2015-10565-art-108
- id: m02-l02-q0166
  prompt:
    es: "De acuerdo con el artículo 108 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado el procedimiento de revisión de oficio, el órgano competente para declarar la nulidad o lesividad podrá suspender la ejecución del acto cuando esta pudiera causar:"
  options:
  - id: a
    correct: true
    text:
      es: "Perjuicios de imposible o difícil reparación."
  - id: b
    text:
      es: "Perjuicios al interés público, aunque sean reparables."
  - id: c
    text:
      es: "Perjuicios económicos a la Administración autora del acto."
  - id: d
    text:
      es: "Perjuicios de imposible reparación, pero no de difícil reparación."
  explanation:
    es: "El artículo 108 permite suspender la ejecución cuando cause perjuicios de imposible o difícil reparación. No basta un perjuicio reparable al interés público ni un perjuicio económico a la Administración, y el texto incluye tanto lo imposible como lo difícil de reparar."
  citation: "art. 108 LPAC"
  difficulty: 2
  tags:
  - "revisión de oficio"
  - "suspensión"
