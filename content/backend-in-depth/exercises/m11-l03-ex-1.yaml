- id: m11-l03-q02
  prompt:
    en: A sample holds 98 latencies of 10 ms and 2 of 1,000 ms. The program prints the mean and the nearest-rank
      percentiles p50, p98 and p99. What does it print?
  options:
  - id: a
    text:
      en: 'mean 10.0

        p50 10

        p98 10

        p99 10'
  - id: b
    correct: true
    text:
      en: 'mean 29.8

        p50 10

        p98 10

        p99 1000'
  - id: c
    text:
      en: 'mean 29.8

        p50 10

        p98 1000

        p99 1000'
  - id: d
    text:
      en: 'mean 505.0

        p50 10

        p98 10

        p99 1000'
  explanation:
    en: 'The program prints `mean 29.8`, `p50 10`, `p98 10` and `p99 1000`: the mean averages all 100 samples, and
      rank 99 is the first slow sample. The output with `mean 10.0` and `p99 10` is wrong because the two slow samples
      are part of the data, so they pull the mean up and rank 99 lands on one of them. The line `p98 1000` is wrong
      because rank 98 is `ceil(98 / 100 * 100)`, which is still a fast sample. The line `mean 505.0` is wrong because
      the mean divides the sum of all 100 samples by 100, not the sum of the two distinct values by 2.'
  citation: wrk2-readme#scripting
  snippet: m11-l03/PercentileTail.java
- id: m11-l03-q04
  prompt:
    en: GC 1 paused 3 ms and 1 ms, GC 2 paused 2 ms, GC 3 paused 10 ms and 1 ms. The program prints the sums per
      GC, the total, the largest sum and the average. What does it print?
  options:
  - id: a
    text:
      en: 'sum of pauses per GC {1=4, 2=2, 3=11}

        total 17 ms

        largest sum 10 ms

        average sum 5.67 ms'
  - id: b
    text:
      en: 'sum of pauses per GC {1=4, 2=2, 3=11}

        total 17 ms

        largest sum 11 ms

        average sum 3.40 ms'
  - id: c
    correct: true
    text:
      en: 'sum of pauses per GC {1=4, 2=2, 3=11}

        total 17 ms

        largest sum 11 ms

        average sum 5.67 ms'
  - id: d
    text:
      en: 'sum of pauses per GC {1=3, 2=2, 3=10}

        total 15 ms

        largest sum 10 ms

        average sum 5.00 ms'
  explanation:
    en: 'The program prints `sum of pauses per GC {1=4, 2=2, 3=11}`, `total 17 ms`, `largest sum 11 ms` and `average
      sum 5.67 ms`: the sum of pauses is the total time the application was paused during one GC. The output with
      `largest sum 10 ms` is wrong because the largest sum adds the pauses of GC 3, 10 ms and 1 ms. The line `average
      sum 3.40 ms` is wrong because the average is taken over the three GCs, 17 ms divided by 3, not over the five
      pauses. The output with `total 15 ms` is wrong because every pause counts toward the sum of its GC, so the
      total is 17 ms.'
  citation: jdk-troubleshoot-jfr#JSTGD-GUID-3839D694-F0F7-4E43-93BE-3BF13F4D2102; jdk-troubleshoot-jfr#JSTGD-GUID-E9C795D6-3D7A-4CD8-84DD-4F7DE3200614
  snippet: m11-l03/GcPauseSums.java
- id: m11-l03-q05
  prompt:
    en: According to the HikariCP documentation on pool sizing, how should a properly tuned connection pool relate
      to the number of queries the database can process simultaneously?
  options:
  - id: a
    text:
      en: It matches the number of front-end users, so that no request waits for a connection
  - id: b
    text:
      en: It is large, 100 connections or more, so that application threads never block on the pool
  - id: c
    text:
      en: It equals `Tn x (Cm - 1) + 1`, which is the optimal pool size
  - id: d
    correct: true
    text:
      en: It is set right at that limit, which is rarely much more than CPU cores times 2
  explanation:
    en: A properly tuned pool is set right at the limit of the queries the database can process simultaneously,
      rarely much more than CPU cores times 2. The claim of one connection per front-end user is wrong because a
      pool of 10,000 for 10,000 users would be shear insanity. The claim of a large pool is wrong because the aim
      is a small pool of a few dozen connections at most, with the other threads blocked on it. The claim about
      `Tn x (Cm - 1) + 1` is wrong because that formula gives the minimum required to avoid deadlock, not necessarily
      the optimal size.
  citation: hikaricp-pool-sizing#axiom-you-want-a-small-pool-saturated-with-threads-waiting-for-connections; hikaricp-pool-sizing#pool-locking
- id: m11-l03-q06
  prompt:
    en: According to the JDK troubleshooting guide for the `jfr` tool, an application spends too much time paused
      in GC. Which action does it list to reduce the number of GCs?
  options:
  - id: a
    correct: true
    text:
      en: Allocate fewer temporary objects
  - id: b
    text:
      en: Reduce the Java heap size, so that each collection has less to scan
  - id: c
    text:
      en: Include the heap statistics in the recording, to avoid extra old collections
  - id: d
    text:
      en: Increase the allocation rate, so that each thread fills its TLAB sooner
  explanation:
    en: To reduce the number of GCs, the guide says to allocate fewer temporary objects. The claim of a smaller
      heap is wrong because the bigger the Java heap, the longer the time between GCs. The claim of including the
      heap statistics is wrong because the recording should not include them, since they trigger extra old collections.
      The claim of a higher allocation rate is wrong because the guide says to decrease the allocation rate to reduce
      the need of GCs.
  citation: jdk-troubleshoot-jfr#JSTGD-GUID-3839D694-F0F7-4E43-93BE-3BF13F4D2102
- id: m11-l03-q07
  prompt:
    en: A Lua script for `wrk2` defines `done(summary, latency, requests)` to report results. In which unit are
      the latency values that this function receives expressed?
  options:
  - id: a
    correct: true
    text:
      en: Microseconds
  - id: b
    text:
      en: Milliseconds
  - id: c
    text:
      en: Nanoseconds
  - id: d
    text:
      en: Seconds
  explanation:
    en: The `done()` function receives latency in microseconds. Milliseconds, nanoseconds and seconds are excluded
      by the single documented unit, because latency is given as microsecond values and only the rate is measured
      per second.
  citation: wrk2-readme#scripting
- id: m11-l03-q10
  prompt:
    en: In the example output of the Kafka `kafka-consumer-groups.sh --describe` command, partition 0 of `my-topic`
      has `CURRENT-OFFSET` 2 and `LOG-END-OFFSET` 4. What does its `LAG` column show?
  options:
  - id: a
    text:
      en: '1'
  - id: b
    correct: true
    text:
      en: '2'
  - id: c
    text:
      en: '3'
  - id: d
    text:
      en: '4'
  explanation:
    en: The `LAG` column of partition 0 shows 2, because the example row for partition 0 reads 2, 4 and 2. The values
      1, 3 and 4 are ruled out by that same row, which gives 2 as the `LAG` of partition 0, and 4 is its `LOG-END-OFFSET`.
  citation: kafka-ops-basic-operations#checking-consumer-position
- id: m11-l03-q12
  prompt:
    en: In a `wrk` Lua script, the `done()` function receives a `summary` table of result data. What does `summary.errors.status`
      hold?
  options:
  - id: a
    text:
      en: The total number of request timeouts
  - id: b
    text:
      en: The total number of socket read errors
  - id: c
    correct: true
    text:
      en: The total number of HTTP status codes greater than 399
  - id: d
    text:
      en: The 99th percentile of the sampled per-request latency
  explanation:
    en: The field holds the total of HTTP status codes greater than 399. The number of request timeouts is ruled
      out because `summary.errors.timeout` is the field that holds the total request timeouts. The number of socket
      read errors is ruled out because `summary.errors.read` holds the total socket read errors. The 99th percentile
      is ruled out because `latency:percentile(99.0)` gives the 99th percentile value.
  citation: wrk2-readme#scripting
