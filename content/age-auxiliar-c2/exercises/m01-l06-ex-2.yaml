- id: m01-l06-q110
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge, por orden, los cuatro primeros ejes del IV Plan de Gobierno Abierto de España 2020-2024, aprobado en octubre de 2020?"
  options:
  - id: a
    correct: true
    text:
      es: "Transparencia y rendición de cuentas, participación, integridad, y sensibilización y formación."
  - id: b
    text:
      es: "Participación, transparencia y rendición de cuentas, integridad, y sensibilización y formación."
  - id: c
    text:
      es: "Transparencia y rendición de cuentas, participación, sensibilización y formación, e integridad."
  - id: d
    text:
      es: "Transparencia, integridad, participación y colaboración."
  explanation:
    es: "Los cuatro primeros ejes del IV Plan son, por orden, transparencia y rendición de cuentas, participación, integridad, y sensibilización y formación. La enumeración que empieza por la participación invierte los dos primeros ejes. La que pone la sensibilización y formación antes de la integridad invierte los dos últimos. La de transparencia, integridad, participación y colaboración omite la rendición de cuentas y la sensibilización y formación, cambia el orden y añade un eje, la colaboración, que no figura entre los del IV Plan."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 3
  tags:
  - "estructura"
