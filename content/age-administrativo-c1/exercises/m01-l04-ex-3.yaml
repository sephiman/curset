# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q045
  prompt:
    es: "¿Cuál de los siguientes nombramientos requiere en el Consejo General del Poder Judicial una mayoría de tres quintos de los miembros presentes, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El del Promotor de la Acción Disciplinaria."
  - id: b
    text:
      es: "El del Director de la Escuela Judicial."
  - id: c
    correct: true
    text:
      es: "El de los Presidentes de Audiencias Provinciales."
  - id: d
    text:
      es: "El de los profesores de la Escuela Judicial."
  explanation:
    es: "El artículo 630.1 LOPJ exige tres quintos de los miembros presentes para nombrar a los Presidentes de Sala y Magistrados del Tribunal Supremo, a los Presidentes de la Audiencia Nacional, de los Tribunales Superiores de Justicia y de sus Salas, «y Presidentes de Audiencias Provinciales». Los otros tres nombramientos no están en esa lista y siguen la regla general de mayoría absoluta de los presentes. Para el Promotor, el artículo 606.3 pide mayoría absoluta en primera votación."
  citation: "art. 630.1 LOPJ"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-630
- id: m01-l04-q046
  prompt:
    es: "¿Qué ocurre en caso de empate en las votaciones de los órganos colegiados del Consejo General del Poder Judicial según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Se repite la votación hasta obtener la mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Decide el voto de calidad de quien preside."
  - id: c
    text:
      es: "Decide el voto del Vocal de más edad."
  - id: d
    text:
      es: "Se entiende rechazada la propuesta sometida a votación."
  explanation:
    es: "El artículo 630.1 LOPJ dice: «Quien preside tendrá voto de calidad en caso de empate». La ley no prevé repetir la votación, ni dar el desempate al Vocal de más edad, ni tener por rechazada la propuesta."
  citation: "art. 630.1 LOPJ"
  difficulty: 2
  tags:
  - "mayoría"
  - "efecto"
# anchor: boe-a-1978-31229-art-123
- id: m01-l04-q048
  prompt:
    es: "De acuerdo con el artículo 123 de la Constitución Española de 1978, el Tribunal Supremo, con jurisdicción en toda España, es el órgano jurisdiccional superior en todos los órdenes:"
  options:
  - id: a
    text:
      es: "Sin excepción alguna, incluidas las garantías constitucionales."
  - id: b
    text:
      es: "Salvo en el orden militar, que corresponde a sus propios tribunales."
  - id: c
    text:
      es: "Salvo lo dispuesto en materia de enjuiciamiento contable."
  - id: d
    correct: true
    text:
      es: "Salvo lo dispuesto en materia de garantías constitucionales."
  explanation:
    es: "El artículo 123.1 dice que el Tribunal Supremo es el órgano jurisdiccional superior en todos los órdenes, «salvo lo dispuesto en materia de garantías constitucionales». «Sin excepción alguna» borra esa salvedad. Con el orden militar, la salvedad es falsa: el artículo 55 LOPJ integra en el Tribunal Supremo la Sala Quinta, de lo Militar. El enjuiciamiento contable tampoco es salvedad: el artículo 49 de la LO 2/1982 hace las resoluciones del Tribunal de Cuentas susceptibles de recurso de casación y revisión ante el Tribunal Supremo."
  citation: "art. 123.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-12666-art-55
- id: m01-l04-q049
  prompt:
    es: "¿Cuántas Salas integran el Tribunal Supremo según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, y cuál es la Quinta?"
  options:
  - id: a
    text:
      es: "Cinco Salas, y la Quinta es la de lo Social."
  - id: b
    text:
      es: "Cuatro Salas, porque lo militar tiene sus propios tribunales."
  - id: c
    correct: true
    text:
      es: "Cinco Salas, y la Quinta es la de lo Militar."
  - id: d
    text:
      es: "Seis Salas, y la Quinta es la de lo Militar."
  explanation:
    es: "El artículo 55 LOPJ enumera cinco Salas: «Primera: De lo Civil. Segunda: De lo Penal. Tercera: De lo Contencioso-Administrativo. Cuarta: De lo Social. Quinta: De lo Militar». Una opción pone lo Social en la Quinta, cuando es la Cuarta. Otra niega la Sala de lo Militar. La de seis Salas da una Sala de más."
  citation: "art. 55 LOPJ"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-57
- id: m01-l04-q050
  prompt:
    es: "De acuerdo con el artículo 57 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la instrucción y enjuiciamiento de las causas contra los miembros del Gobierno y los Diputados y Senadores corresponde a:"
  options:
  - id: a
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: b
    text:
      es: "La Sala de Apelación de la Audiencia Nacional."
  - id: c
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia."
  - id: d
    text:
      es: "La Sala Segunda del Tribunal Constitucional."
  explanation:
    es: "El artículo 57.1 LOPJ atribuye a la Sala de lo Penal del Tribunal Supremo «la instrucción y enjuiciamiento de las causas contra el Presidente del Gobierno, Presidentes del Congreso y del Senado, [...] miembros del Gobierno, Diputados y Senadores». La Sala de Apelación de la Audiencia Nacional revisa resoluciones de su Sala de lo Penal (art. 64 bis). La Sala de lo Civil y Penal del Tribunal Superior de Justicia es un órgano autonómico. El Tribunal Constitucional no forma parte del Poder Judicial."
  citation: "art. 57.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-58
- id: m01-l04-q051
  prompt:
    es: "Según el artículo 58 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué Sala del Tribunal Supremo conoce en única instancia de los recursos contra actos y disposiciones del Consejo de Ministros?"
  options:
  - id: a
    text:
      es: "La Sala Primera, de lo Civil."
  - id: b
    correct: true
    text:
      es: "La Sala Tercera, de lo Contencioso-Administrativo."
  - id: c
    text:
      es: "La Sala Cuarta, de lo Social."
  - id: d
    text:
      es: "La Sala Segunda, de lo Penal."
  explanation:
    es: "El artículo 58 LOPJ dice que la Sala de lo Contencioso-administrativo del Tribunal Supremo conocerá «en única instancia, de los recursos contencioso-administrativos contra actos y disposiciones del Consejo de Ministros». El artículo 55 la numera como Sala Tercera. La Primera (Civil), la Cuarta (Social) y la Segunda (Penal) no conocen de recursos contra actos del Gobierno."
  citation: "art. 58 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-30
- id: m01-l04-q052
  prompt:
    es: "De acuerdo con el artículo 30 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, a efectos judiciales el Estado se organiza territorialmente en:"
  options:
  - id: a
    text:
      es: "Municipios, Comarcas, Provincias y Comunidades Autónomas."
  - id: b
    text:
      es: "Partidos, Provincias, Comunidades Autónomas y Demarcaciones supraautonómicas."
  - id: c
    correct: true
    text:
      es: "Municipios, Partidos, Provincias y Comunidades Autónomas."
  - id: d
    text:
      es: "Municipios, Partidos y Provincias, sin otro nivel territorial superior."
  explanation:
    es: "El artículo 30 LOPJ dice: «El Estado se organiza territorialmente, a efectos judiciales, en Municipios, Partidos, Provincias y Comunidades Autónomas». Una opción cambia los Partidos por las Comarcas. Otra suprime el Municipio e inventa un nivel supraautonómico. Otra suprime la Comunidad Autónoma, que es el ámbito de los Tribunales Superiores de Justicia (art. 34)."
  citation: "art. 30 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-26
- id: m01-l04-q053
  prompt:
    es: "Señale la respuesta correcta sobre los Tribunales a los que la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, en su redacción vigente, atribuye el ejercicio de la potestad jurisdiccional:"
  options:
  - id: a
    text:
      es: "Entre ellos figuran los Juzgados de Primera Instancia e Instrucción."
  - id: b
    text:
      es: "Entre ellos figura el Consejo General del Poder Judicial."
  - id: c
    correct: true
    text:
      es: "Entre ellos figura el Tribunal Central de Instancia."
  - id: d
    text:
      es: "Entre ellos figuran los Juzgados Centrales de Instrucción."
  explanation:
    es: "El artículo 26 LOPJ, en la redacción de la Ley Orgánica 1/2025, enumera: jueces y juezas de paz, Tribunales de Instancia, Audiencias Provinciales, Tribunales Superiores de Justicia, «Tribunal Central de Instancia», Audiencia Nacional y Tribunal Supremo. Los Juzgados de Primera Instancia e Instrucción y los Juzgados Centrales de Instrucción ya no figuran: se transformaron en Secciones de los Tribunales de Instancia y del Tribunal Central de Instancia. El Consejo General del Poder Judicial es el órgano de gobierno, no un Tribunal."
  citation: "art. 26 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1988-29622-art-1
- id: m01-l04-q054
  prompt:
    es: "¿Qué órganos tienen jurisdicción en toda España según la Ley 38/1988, de 28 de diciembre, de Demarcación y de Planta Judicial?"
  options:
  - id: a
    text:
      es: "El Tribunal Supremo, la Audiencia Nacional y los Tribunales Superiores de Justicia."
  - id: b
    text:
      es: "El Tribunal Supremo y la Audiencia Nacional, y ningún otro órgano judicial."
  - id: c
    text:
      es: "El Tribunal Supremo, el Tribunal Central de Instancia y la Audiencia Provincial de Madrid."
  - id: d
    correct: true
    text:
      es: "El Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia."
  explanation:
    es: "El artículo 1 de la Ley 38/1988 dice: «El Tribunal Supremo, la Audiencia Nacional y el Tribunal Central de Instancia tienen jurisdicción en toda España». Los Tribunales Superiores de Justicia la tienen en su Comunidad Autónoma (art. 2.1) y la Audiencia Provincial de Madrid en su provincia. La opción de «ningún otro órgano judicial» olvida el Tribunal Central de Instancia, que la Ley Orgánica 1/2025 añadió a esa lista."
  citation: "art. 1 Ley 38/1988"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-64
- id: m01-l04-q055
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las Salas que integran la Audiencia Nacional según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "De Apelación, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: b
    text:
      es: "De lo Civil, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: c
    text:
      es: "De lo Civil y Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: d
    text:
      es: "De Apelación, de lo Penal, de lo Contencioso-Administrativo y de lo Militar."
  explanation:
    es: "El artículo 64.1 LOPJ enumera las Salas de la Audiencia Nacional: «De Apelación. De lo Penal. De lo Contencioso-Administrativo. De lo Social». La opción con lo Civil y lo Penal por separado son cuatro de las Salas del Tribunal Supremo. La que une «lo Civil y Penal» son las tres Salas de un Tribunal Superior de Justicia (art. 72.1). Otra cambia lo Social por lo Militar, que solo tiene Sala en el Tribunal Supremo."
  citation: "art. 64.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-72
- id: m01-l04-q056
  prompt:
    es: "De acuerdo con el artículo 72 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Tribunal Superior de Justicia está integrado por las siguientes Salas:"
  options:
  - id: a
    text:
      es: "De lo Civil, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: b
    correct: true
    text:
      es: "De lo Civil y Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: c
    text:
      es: "De Apelación, de lo Penal, de lo Contencioso-Administrativo y de lo Social."
  - id: d
    text:
      es: "De lo Civil y Penal, de lo Contencioso-Administrativo, de lo Social y de lo Militar."
  explanation:
    es: "El artículo 72.1 LOPJ dice que el Tribunal Superior de Justicia estará integrado por las Salas «de lo Civil y Penal, de lo Contencioso-Administrativo y de lo Social». Una opción separa lo Civil y lo Penal en dos Salas. La que empieza por «De Apelación» son las Salas de la Audiencia Nacional (art. 64.1). Otra añade una Sala de lo Militar, que solo existe en el Tribunal Supremo."
  citation: "art. 72.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-84
- id: m01-l04-q057
  prompt:
    es: "Tras la reforma de la planta judicial que sustituyó los Juzgados por Secciones, existe un Tribunal de Instancia:"
  options:
  - id: a
    correct: true
    text:
      es: "En cada partido judicial, con sede en su capital, de la que toma su nombre."
  - id: b
    text:
      es: "En cada provincia, con sede en su capital, de la que toma su nombre."
  - id: c
    text:
      es: "En cada Comunidad Autónoma, con sede en la capital que fije su Estatuto."
  - id: d
    text:
      es: "En cada municipio, con sede en la casa consistorial del Ayuntamiento."
  explanation:
    es: "El artículo 84.1 LOPJ dice: «Habrá un Tribunal de Instancia en cada partido judicial, con sede en su capital, de la que tomará su nombre». La provincia es el ámbito de la Audiencia Provincial (art. 80.1) y la Comunidad Autónoma el del Tribunal Superior de Justicia (art. 34). En los municipios sin Tribunal de Instancia hay un juez de paz (art. 99)."
  citation: "art. 84.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1985-12666-art-95
- id: m01-l04-q058
  prompt:
    es: "¿Cuál de las siguientes Secciones forma parte del Tribunal Central de Instancia según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Sección de lo Social."
  - id: b
    correct: true
    text:
      es: "La Sección de Vigilancia Penitenciaria."
  - id: c
    text:
      es: "La Sección de lo Mercantil."
  - id: d
    text:
      es: "La Sección de Familia, Infancia y Capacidad."
  explanation:
    es: "El artículo 95 LOPJ da al Tribunal Central de Instancia las Secciones de Instrucción, de lo Penal, de Menores, «de Vigilancia Penitenciaria» y de lo Contencioso-Administrativo. Las Secciones de lo Social, de lo Mercantil y de Familia, Infancia y Capacidad pueden existir en los Tribunales de Instancia (art. 84.2), pero no en el Tribunal Central."
  citation: "art. 95 LOPJ"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2025-76-dt-primera
- id: m01-l04-q059
  prompt:
    es: "Según la disposición transitoria primera de la Ley Orgánica 1/2025, de 2 de enero, de medidas en materia de eficiencia del Servicio Público de Justicia, ¿qué día se transformaron en Secciones los Juzgados no comprendidos en las dos primeras fases?"
  options:
  - id: a
    text:
      es: "El 1 de julio de 2025."
  - id: b
    correct: true
    text:
      es: "El 31 de diciembre de 2025."
  - id: c
    text:
      es: "El 1 de octubre de 2025."
  - id: d
    text:
      es: "El 3 de abril de 2025."
  explanation:
    es: "La disposición transitoria primera de la Ley Orgánica 1/2025 fija tres fases: el 1 de julio de 2025, el 1 de octubre de 2025 y, para «los restantes Juzgados, no comprendidos en los supuestos anteriores», el 31 de diciembre de 2025. El 1 de julio y el 1 de octubre son las dos primeras fases. El 3 de abril de 2025 no es ninguna fase: es cuando entró en vigor la mayor parte de la ley, a los tres meses de su publicación (disposición final trigésima octava)."
  citation: "disposición transitoria primera LO 1/2025"
  difficulty: 3
  tags:
  - "fecha"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q060
  prompt:
    es: "Los Jueces de Paz y sus sustitutos, nombrados por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente, lo son por:"
  options:
  - id: a
    text:
      es: "Un periodo de tres años."
  - id: b
    text:
      es: "Un periodo de cinco años."
  - id: c
    text:
      es: "Un periodo de seis años."
  - id: d
    correct: true
    text:
      es: "Un periodo de cuatro años."
  explanation:
    es: "El artículo 101.1 LOPJ dice que los Jueces de Paz y sus sustitutos «serán nombrados para un periodo de cuatro años por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente». Tres, cinco y seis años no son el periodo del artículo; los cinco años son el mandato del Consejo General del Poder Judicial (art. 122.3 CE)."
  citation: "art. 101.1 LOPJ"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q061
  prompt:
    es: "¿Qué órgano nombra a los Jueces de Paz y a sus sustitutos según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El Pleno del Ayuntamiento respectivo."
  - id: b
    correct: true
    text:
      es: "La Sala de Gobierno del Tribunal Superior de Justicia correspondiente."
  - id: c
    text:
      es: "La Comisión Permanente del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "El Presidente de la Audiencia Provincial."
  explanation:
    es: "El artículo 101.1 LOPJ dice que serán nombrados «por la Sala de Gobierno del Tribunal Superior de Justicia correspondiente». El Pleno del Ayuntamiento los elige (art. 101.2), pero no los nombra. Ni la Comisión Permanente del Consejo ni el Presidente de la Audiencia Provincial intervienen en el nombramiento."
  citation: "art. 101.1 LOPJ"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q062
  prompt:
    es: "Según el artículo 122 de la Constitución Española de 1978, ¿cuál de las siguientes afirmaciones sobre el Consejo General del Poder Judicial es correcta?"
  options:
  - id: a
    text:
      es: "Lo preside el Ministro de la Presidencia, Justicia y Relaciones con las Cortes, y sus veinte miembros son nombrados por el Rey por cinco años."
  - id: b
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son nombrados por el Rey por el tiempo de la legislatura."
  - id: c
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son elegidos por los propios Jueces y Magistrados por cinco años."
  - id: d
    correct: true
    text:
      es: "Lo preside el Presidente del Tribunal Supremo, y sus veinte miembros son nombrados por el Rey por cinco años."
  explanation:
    es: "El artículo 122.3 dice que el Consejo «estará integrado por el Presidente del Tribunal Supremo, que lo presidirá, y por veinte miembros nombrados por el Rey por un período de cinco años». El Ministro de la Presidencia, Justicia y Relaciones con las Cortes no lo preside: la presidencia es del Presidente del Tribunal Supremo. El nombramiento por el tiempo de la legislatura sustituye los «cinco años» del apartado. Los veinte miembros los nombra el Rey, no los eligen los propios Jueces y Magistrados: el apartado solo exige que doce procedan de la judicatura, y los otros ocho se nombran a propuesta del Congreso y del Senado."
  citation: "art. 122.3 CE"
  difficulty: 1
  tags:
  - "composición"
  - "plazo"
# anchor: boe-a-1978-31229-art-123
- id: m01-l04-q063
  prompt:
    es: "¿Qué intervención atribuye la Constitución Española de 1978 al Consejo General del Poder Judicial en el nombramiento del Presidente del Tribunal Supremo?"
  options:
  - id: a
    text:
      es: "Lo nombra directamente, sin intervención del Rey."
  - id: b
    text:
      es: "Es oído por el Gobierno antes de que este proponga su nombramiento."
  - id: c
    correct: true
    text:
      es: "Propone al Rey su nombramiento, en la forma que determine la ley."
  - id: d
    text:
      es: "Informa la propuesta que eleva al Rey el Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  explanation:
    es: "El artículo 123.2 CE dice que el Presidente del Tribunal Supremo «será nombrado por el Rey, a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley». La LOPJ desarrolla esa propuesta: el Pleno lo elige por tres quintos (art. 586.3 LOPJ). La opción «sin intervención del Rey» quita al Rey el nombramiento. La de ser «oído por el Gobierno» es la fórmula del Fiscal General del Estado, a quien nombra el Rey a propuesta del Gobierno, oído el Consejo (art. 124.4 CE). Otra inventa una propuesta ministerial: la propuesta es del Consejo."
  citation: "art. 123.2 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q064
  prompt:
    es: "¿Cuál de los siguientes requisitos exige la Constitución Española de 1978 a los abogados y otros juristas que se eligen a propuesta del Congreso y del Senado como miembros del Consejo General del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Estar en situación de servicio activo en la carrera judicial."
  - id: b
    correct: true
    text:
      es: "Ser de reconocida competencia y tener más de quince años de ejercicio en su profesión."
  - id: c
    text:
      es: "Ser de reconocida competencia y tener más de veinticinco años de antigüedad en su profesión."
  - id: d
    text:
      es: "Pertenecer como Juez o Magistrado a cualquiera de las categorías judiciales."
  explanation:
    es: "El artículo 122.3 CE dice que los cuatro propuestos por cada Cámara se eligen «entre abogados y otros juristas, todos ellos de reconocida competencia y con más de quince años de ejercicio en su profesión». Una opción toma los veinticinco años que el artículo 586.1 LOPJ pide al jurista que aspire a Presidente del Tribunal Supremo y del Consejo. Las opciones del «servicio activo» y de las «categorías judiciales» describen a los doce que se escogen «entre Jueces y Magistrados de todas las categorías judiciales», no a los juristas; además, el artículo 567.3 LOPJ impide elegir por el turno de juristas a quien esté en servicio activo en la carrera judicial."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-12666-art-600
- id: m01-l04-q069
  prompt:
    es: "De acuerdo con el artículo 600 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, para la válida constitución del Pleno en la sesión de elección del Presidente se requiere la presencia de:"
  options:
  - id: a
    text:
      es: "Al menos diez Vocales y el Presidente del Tribunal Supremo y del Consejo."
  - id: b
    text:
      es: "Al menos dos tercios de sus miembros, incluido en todo caso el Presidente saliente."
  - id: c
    text:
      es: "Al menos quince de sus miembros, de los cuales ocho del turno judicial."
  - id: d
    correct: true
    text:
      es: "Al menos doce de sus miembros."
  explanation:
    es: "El artículo 600.3 LOPJ dice que en la sesión de elección del Presidente «será necesaria, para la válida constitución del Pleno, al menos la presencia de doce de sus miembros». La opción de diez Vocales y el Presidente es la regla de los demás casos (art. 600.4), que no rige en esa sesión. Las opciones de dos tercios con el Presidente saliente y de quince miembros con ocho del turno judicial no aparecen en el artículo."
  citation: "art. 600.3 LOPJ"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12666-art-604
- id: m01-l04-q070
  prompt:
    es: "Según el artículo 604 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué recurso cabe contra los acuerdos sancionadores de la Comisión Disciplinaria, y en qué plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "Alzada ante el Pleno, en un mes."
  - id: b
    text:
      es: "Alzada ante la Comisión Permanente, en el plazo de un mes desde la notificación."
  - id: c
    text:
      es: "Reposición ante la propia Comisión Disciplinaria, en el plazo de un mes desde la notificación."
  - id: d
    text:
      es: "Alzada ante el Pleno del Consejo General del Poder Judicial, en el plazo de dos meses."
  explanation:
    es: "El artículo 604.2 LOPJ dice que los acuerdos sancionadores de la Comisión Disciplinaria «serán recurribles, en el plazo de un mes, en alzada ante el Pleno». El apartado fija un mes y no dos. Fija el Pleno, no la Comisión Permanente, y fija la alzada, no la reposición ante la propia Comisión Disciplinaria."
  citation: "art. 604.2 LOPJ"
  difficulty: 2
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-1985-12666-art-610-bis
- id: m01-l04-q071
  prompt:
    es: "De acuerdo con el artículo 610 bis de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la Comisión de Calificación del Consejo General del Poder Judicial está integrada por:"
  options:
  - id: a
    text:
      es: "Cinco Vocales, dos del turno judicial y tres del turno de juristas de reconocida competencia."
  - id: b
    correct: true
    text:
      es: "Cinco Vocales, tres del turno judicial y dos del de juristas."
  - id: c
    text:
      es: "Siete Vocales, cuatro del turno judicial y tres del turno de juristas de reconocida competencia."
  - id: d
    text:
      es: "El Presidente y cuatro Vocales, dos del turno judicial y dos del turno de juristas de reconocida competencia."
  explanation:
    es: "El artículo 610 bis.2 LOPJ dice: «La Comisión de Calificación estará integrada por cinco Vocales, tres del turno judicial y dos del turno de juristas». La opción de dos judiciales y tres juristas invierte los turnos. La de siete Vocales, cuatro y tres, es la composición de la Comisión Disciplinaria (art. 603.2). La que incluye al Presidente confunde esta Comisión con la Permanente, la única que él preside (art. 601.2), y además cambia el número de Vocales."
  citation: "art. 610 bis.2 LOPJ"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1985-12666-art-101
- id: m01-l04-q072
  prompt:
    es: "Según el artículo 101 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué órgano municipal elige a los Jueces de Paz y a sus sustitutos, y con qué mayoría?"
  options:
  - id: a
    text:
      es: "La Junta de Gobierno Local, por mayoría absoluta de sus miembros, a propuesta del Alcalde."
  - id: b
    text:
      es: "El Pleno del Ayuntamiento, por mayoría simple de los concejales presentes en la sesión."
  - id: c
    correct: true
    text:
      es: "El Pleno, por mayoría absoluta de sus miembros."
  - id: d
    text:
      es: "El Pleno del Ayuntamiento, por mayoría de tres quintos de sus miembros de derecho."
  explanation:
    es: "El artículo 101.2 LOPJ dice que los Jueces de Paz y sus sustitutos «serán elegidos por el Pleno del Ayuntamiento, con el voto favorable de la mayoría absoluta de sus miembros». La elección no corresponde a la Junta de Gobierno Local. Las opciones de mayoría simple de los presentes y de tres quintos cambian la mayoría que fija el artículo. El nombramiento posterior es de la Sala de Gobierno del Tribunal Superior de Justicia (art. 101.1)."
  citation: "art. 101.2 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1985-12666-art-80
- id: m01-l04-q073
  prompt:
    es: "Según el artículo 80 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿dónde tienen su sede las Audiencias Provinciales?"
  options:
  - id: a
    text:
      es: "En la capital del partido judicial con mayor número de habitantes de la provincia."
  - id: b
    text:
      es: "En la capital del partido judicial que designe la Sala de Gobierno del Tribunal Superior de Justicia."
  - id: c
    text:
      es: "En la localidad de la provincia que fije el Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "En la capital de la provincia."
  explanation:
    es: "El artículo 80.1 LOPJ dice que las Audiencias Provinciales «tendrán su sede en la capital de la provincia, de la que tomarán su nombre». El artículo no atiende a la población del partido judicial ni deja la sede a una designación de la Sala de Gobierno del Tribunal Superior de Justicia o del Consejo General del Poder Judicial. Lo que permite fuera de la capital son Secciones de la Audiencia, a las que se adscriben uno o varios partidos judiciales (art. 80.2)."
  citation: "art. 80.1 LOPJ"
  difficulty: 2
  tags:
  - "estructura"
