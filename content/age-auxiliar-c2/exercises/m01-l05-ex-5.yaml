  - id: d
    text:
      es: "Siete días desde su presentación, y en los dos primeros días podrán presentarse mociones alternativas."
  explanation:
    es: "El artículo 113.3 dice que la moción «no podrá ser votada hasta que transcurran cinco días desde su presentación» y que «en los dos primeros días de dicho plazo podrán presentarse mociones alternativas». El plazo no es de tres ni de siete días. Las mociones alternativas sí se admiten."
