# anchor: boe-a-2003-23186-art-59
- id: m03-l09-q0001
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas tributarias podrán extinguirse:"
  options:
  - id: a
    text:
      es: "Por pago, prescripción, caducidad o condonación, por los medios previstos en la normativa aduanera y por los demás medios previstos en las leyes tributarias."
  - id: b
    correct: true
    text:
      es: "Por pago, prescripción, compensación o condonación, por los medios previstos en la normativa aduanera y por los demás medios previstos en las leyes."
  - id: c
    text:
      es: "Únicamente por pago, prescripción, compensación o condonación, sin que otras leyes puedan prever más medios de extinción."
  - id: d
    text:
      es: "Por pago, compensación o condonación, mientras que la prescripción solo extingue el derecho a exigir el pago de la deuda."
  explanation:
    es: "El artículo 59.1 cita el pago, la prescripción, la compensación y la condonación, y añade los medios de la normativa aduanera y los demás que prevean las leyes. La caducidad no figura en la lista. La enumeración no es cerrada, porque remite a los demás medios que las leyes prevean. La prescripción es un medio de extinción de la deuda en sí, no solo del derecho a exigir el pago."
  citation: "art. 59.1 LGT"
  difficulty: 3
  tags:
  - "extinción"
# anchor: boe-a-2003-23186-art-59
- id: m03-l09-q0002
  prompt:
    es: "Según el artículo 59.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el pago, la compensación, la deducción sobre transferencias o la condonación de la deuda tributaria tienen efectos liberatorios:"
  options:
  - id: a
    text:
      es: "Por la totalidad de la deuda, aunque el importe satisfecho sea inferior."
  - id: b
    text:
      es: "Por el importe de la deuda y de los recargos que pudieran exigirse después."
  - id: c
    correct: true
    text:
      es: "Exclusivamente por el importe pagado, compensado, deducido o condonado."
  - id: d
    text:
      es: "Solo cuando la Administración tributaria los acepte expresamente por escrito."
  explanation:
    es: "El artículo 59.2 limita el efecto liberatorio al importe pagado, compensado, deducido o condonado. Un pago inferior a la deuda no la extingue por entero. Los recargos no se cubren con lo no pagado: lo que queda sin satisfacer sigue siendo exigible. La norma no condiciona el efecto a una aceptación escrita de la Administración."
  citation: "art. 59.2 LGT"
  difficulty: 1
  tags:
  - "extinción"
  - "efectos liberatorios"
# anchor: boe-a-2003-23186-art-59
- id: m03-l09-q0003
  prompt:
    es: "Carmen Alonso debe 8.000 euros por una liquidación de la Administración y ingresa 5.000 euros dentro del plazo. Conforme al artículo 59.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto liberatorio produce ese pago?"
  options:
  - id: a
    text:
      es: "Libera a Carmen Alonso de toda la deuda, porque el ingreso se hizo dentro del plazo de pago."
  - id: b
    text:
      es: "No libera nada hasta que se ingresen los 8.000 euros, porque el pago parcial no extingue deuda alguna."
  - id: c
    text:
      es: "Libera a Carmen Alonso por 5.000 euros y la Administración debe condonar el resto de la deuda."
  - id: d
    correct: true
    text:
      es: "Libera a Carmen Alonso exclusivamente por los 5.000 euros ingresados; quedan 3.000 euros pendientes."
  explanation:
    es: "El efecto liberatorio es exclusivamente por el importe pagado (artículo 59.2). Los 5.000 euros ingresados extinguen esa parte y quedan 3.000 euros pendientes. Pagar en plazo no libera de la parte no pagada. Tampoco es cierto que el pago parcial no extinga nada: extingue lo pagado. La Administración no tiene que condonar el resto, que sigue siendo deuda."
  citation: "art. 59.2 LGT"
  difficulty: 2
  tags:
  - "extinción"
  - "cómputo"
# anchor: boe-a-2005-14803-art-32
- id: m03-l09-q0004
  prompt:
    es: "De acuerdo con el artículo 32 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las deudas podrán extinguirse por pago, prescripción y compensación, y además por:"
  options:
  - id: a
    correct: true
    text:
      es: "Deducción sobre transferencias, condonación, los medios previstos en la normativa aduanera y los demás medios previstos en las leyes."
  - id: b
    text:
      es: "Deducción sobre transferencias, caducidad, los medios previstos en la normativa aduanera y los demás medios previstos en las leyes de cada tributo."
  - id: c
    text:
      es: "Consignación y condonación, los medios previstos en la normativa aduanera, sin otros medios que puedan prever las leyes."
  - id: d
    text:
      es: "Aplazamiento y condonación, los medios previstos en la normativa aduanera y los demás medios previstos en las leyes."
  explanation:
    es: "El Reglamento General de Recaudación añade la deducción sobre transferencias a las formas de extinción de la ley (artículo 32). La caducidad no es una forma de extinción de la lista. La consignación y el aplazamiento no extinguen la deuda: la consignación tiene los efectos que el reglamento le da y el aplazamiento solo retrasa el pago. La lista remite además a los demás medios que prevean las leyes, de modo que no está cerrada."
  citation: "art. 32 RGR"
  difficulty: 3
  tags:
  - "extinción"
# anchor: boe-a-2003-23186-art-59
- id: m03-l09-q0005
  prompt:
    es: "¿Cuál de los siguientes medios está previsto como forma de extinción de las deudas tributarias en el artículo 59.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El aplazamiento del pago concedido por la Administración."
  - id: b
    text:
      es: "La notificación de la liquidación al obligado tributario."
  - id: c
    correct: true
    text:
      es: "La compensación de la deuda con un crédito del obligado."
  - id: d
    text:
      es: "La constitución de un aval a favor de la Administración."
  explanation:
    es: "La compensación es uno de los medios del artículo 59.1. El aplazamiento retrasa el pago sin extinguir la deuda. La notificación de la liquidación es el acto que determina la deuda, no un medio de extinguirla. El aval solo garantiza el pago futuro y no lo realiza."
  citation: "art. 59.1 LGT"
  difficulty: 1
  tags:
  - "extinción"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0006
  prompt:
    es: "De acuerdo con el artículo 33.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el pago de la deuda puede efectuarlo cualquier persona, tenga o no interés en el cumplimiento de la obligación, y puede hacerlo:"
  options:
  - id: a
    text:
      es: "Solo en período ejecutivo, cuando el deudor no ha pagado."
  - id: b
    correct: true
    text:
      es: "Tanto en período voluntario como en período ejecutivo."
  - id: c
    text:
      es: "Solo en período voluntario, antes de la providencia de apremio."
  - id: d
    text:
      es: "En ambos períodos, siempre que el obligado lo conozca y lo apruebe."
  explanation:
    es: "El artículo 33.1 permite pagar en período voluntario o ejecutivo a cualquier persona, la conozca y apruebe el obligado o no. Limitarlo a un solo período contradice el texto. Exigir la aprobación del obligado también, porque el pago puede hacerse aunque este lo ignore."
  citation: "art. 33.1 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "legitimación"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0007
  prompt:
    es: "Mario Gil paga por su cuenta, sin que Elena Sanz lo sepa, una deuda tributaria de esta última que está en período voluntario. De acuerdo con el artículo 33.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué consecuencia tiene ese pago?"
  options:
  - id: a
    correct: true
    text:
      es: "El pago es válido, pero Mario Gil no puede ejercitar ante la Administración los derechos que corresponden a Elena Sanz."
  - id: b
    text:
      es: "El pago es nulo, porque Elena Sanz no conocía ni aprobó que un tercero lo realizase."
  - id: c
    text:
      es: "El pago es válido y Mario Gil queda subrogado en todos los derechos de Elena Sanz frente a la Administración."
  - id: d
    text:
      es: "El pago es válido solo si Mario Gil acredita un interés propio en el cumplimiento de la obligación."
  explanation:
    es: "Puede pagar cualquiera, aunque el obligado lo ignore, y el tercero que paga no queda legitimado para ejercitar los derechos del obligado (artículo 33.1). El pago no es nulo por el desconocimiento de Elena Sanz. Tampoco hay subrogación en sus derechos frente a la Administración. No se exige que el tercero tenga interés en la obligación."
  citation: "art. 33.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "legitimación"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0008
  prompt:
    es: "En relación con el tercero que paga una deuda ajena, conforme al artículo 33.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Está legitimado para recurrir la liquidación en nombre del obligado al pago desde el momento en que paga la deuda."
  - id: b
    text:
      es: "Solo puede pagar si el obligado al pago ha autorizado expresamente el ingreso por escrito."
  - id: c
    text:
      es: "Solo puede pagar en período ejecutivo, una vez notificada la providencia de apremio."
  - id: d
    correct: true
    text:
      es: "No está legitimado para ejercitar ante la Administración los derechos que corresponden al obligado al pago."
  explanation:
    es: "El tercero paga sin quedar legitimado para ejercitar los derechos del obligado (artículo 33.1). Recurrir la liquidación es uno de esos derechos. La norma no exige autorización escrita del obligado, pues basta que el pago se haga aunque este lo ignore. El tercero puede pagar también en período voluntario."
  citation: "art. 33.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "legitimación"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0009
  prompt:
    es: "Conforme al artículo 33.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el pago de las deudas podrá realizarse en las cajas de los órganos competentes, en las entidades que presten el servicio de caja, en las entidades colaboradoras y demás personas o entidades autorizadas para recibir el pago:"
  options:
  - id: a
    correct: true
    text:
      es: "Directamente o por vía telemática, cuando así esté previsto en la normativa vigente."
  - id: b
    text:
      es: "Únicamente de forma presencial, porque la vía telemática no está prevista en el reglamento."
  - id: c
    text:
      es: "Directamente o por vía telemática, siempre que el obligado haya designado antes la entidad."
  - id: d
    text:
      es: "Por vía telemática en todo caso, y de forma presencial solo en período ejecutivo."
  explanation:
    es: "El artículo 33.2 admite el pago presencial o telemático cuando la normativa vigente lo prevea. Excluir la vía telemática o imponerla en todo caso se aparta del texto. La designación previa de la entidad por el obligado no es un requisito del precepto. La distinción por períodos tampoco aparece en el artículo."
  citation: "art. 33.2 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "lugar de pago"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0010
  prompt:
    es: "De acuerdo con el artículo 33.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, los pagos realizados a órganos no competentes para recibirlos o a personas no autorizadas para ello:"
  options:
  - id: a
    text:
      es: "Liberan al deudor si este actuó de buena fe, sin perjuicio de las responsabilidades del perceptor."
  - id: b
    correct: true
    text:
      es: "No liberan al deudor de su obligación de pago, sin perjuicio de las responsabilidades en que incurra el perceptor que los admita."
  - id: c
    text:
      es: "Liberan al deudor desde la fecha del pago, y el órgano no competente debe trasladar el importe a la Hacienda pública."
  - id: d
    text:
      es: "No liberan al deudor, y el perceptor que los admita queda exento de toda responsabilidad al haber actuado por error."
  explanation:
    es: "Según el artículo 33.3, el pago a un órgano no competente o a una persona no autorizada no libera al deudor, y el perceptor responde por haberlo admitido. La buena fe del deudor no figura como excepción. El traslado del importe por el órgano no competente tampoco devuelve el efecto liberatorio. La responsabilidad del perceptor se mantiene aunque admitiera el pago por error."
  citation: "art. 33.3 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "lugar de pago"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0011
  prompt:
    es: "Conforme al artículo 33.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el pago de las deudas podrá realizarse:"
  options:
  - id: a
    text:
      es: "En efectivo, mediante efectos timbrados y mediante compensación."
  - id: b
    text:
      es: "Solo en efectivo, salvo que una ley prevea los efectos timbrados."
  - id: c
    text:
      es: "En efectivo, en especie y mediante aplazamiento del importe."
  - id: d
    correct: true
    text:
      es: "En efectivo, mediante efectos timbrados y en especie."
  explanation:
    es: "El artículo 33.4 enumera tres formas de pago: en efectivo, mediante efectos timbrados y en especie. La compensación es una forma de extinguir la deuda distinta del pago. El pago exclusivamente en efectivo contradice la enumeración. El aplazamiento no es una forma de pago, sino un retraso del plazo."
  citation: "art. 33.4 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "formas de pago"
# anchor: boe-a-2005-14803-art-28
- id: m03-l09-q0013
  prompt:
    es: "De acuerdo con el artículo 28.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cada quincena de lo recaudado por las entidades de crédito que presten el servicio de caja en los órganos de recaudación comprende desde el fin de la anterior hasta:"
  options:
  - id: a
    text:
      es: "El día 15 o el último de cada mes, o el inmediato hábil anterior si fuesen inhábiles."
  - id: b
    text:
      es: "El día 5 o 20 siguiente, o el inmediato hábil anterior si el 5 o el 20 son inhábiles en la entidad."
  - id: c
    text:
      es: "El día 10 o 25 siguiente, o el inmediato hábil posterior si fuesen inhábiles."
  - id: d
    correct: true
    text:
      es: "El día 5 o 20 siguiente, o el inmediato hábil posterior si el 5 o el 20 son inhábiles."
  explanation:
    es: "La quincena llega hasta el día 5 o 20 siguiente o hasta el inmediato hábil posterior, si el 5 o el 20 son inhábiles (artículo 28.1). Los días 15 y último no son los cortes del artículo. Tampoco los días 10 y 25. Si el 5 o el 20 son inhábiles se pasa al hábil posterior, no al anterior."
  citation: "art. 28.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "entidades de crédito"
  - "quincena"
# anchor: boe-a-2005-14803-art-28
- id: m03-l09-q0014
  prompt:
    es: "Respecto de los días que se consideran inhábiles en el ingreso de lo recaudado por las entidades de crédito que presten el servicio de caja, señale la respuesta CORRECTA según el artículo 28.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    correct: true
    text:
      es: "A los efectos de la quincena, se consideran días inhábiles los sábados."
  - id: b
    text:
      es: "A los efectos de la quincena, se consideran días inhábiles los domingos y no los sábados."
  - id: c
    text:
      es: "A los efectos de la quincena, solo se consideran inhábiles los festivos nacionales."
  - id: d
    text:
      es: "A los efectos de la quincena, todos los días de la semana se consideran hábiles."
  explanation:
    es: "El artículo 28.1 dice expresamente que, a esos efectos, serán considerados días inhábiles los sábados. Los domingos son inhábiles por naturaleza, pero el texto menciona los sábados. Reducir los inhábiles a los festivos nacionales o declarar hábil toda la semana no concuerda con el precepto."
  citation: "art. 28.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "entidades de crédito"
  - "quincena"
# anchor: boe-a-2005-14803-art-29
- id: m03-l09-q0016
  prompt:
    es: "Según el artículo 29.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, las entidades colaboradoras ingresan en la cuenta del Tesoro el total de lo recaudado durante la quincena que finaliza el día 20 de cada mes:"
  options:
  - id: a
    text:
      es: "El día 18 de dicho mes o el inmediato hábil anterior."
  - id: b
    correct: true
    text:
      es: "El penúltimo día hábil de dicho mes."
  - id: c
    text:
      es: "El último día hábil de dicho mes."
  - id: d
    text:
      es: "El día 5 del mes siguiente o el inmediato hábil posterior."
  explanation:
    es: "Lo recaudado en la quincena que acaba el día 20 se ingresa el penúltimo día hábil del mes (artículo 29.1). El día 18 o el hábil anterior es la fecha de la quincena que acaba el 5. El último día hábil del mes y el día 5 del mes siguiente no son fechas del artículo."
  citation: "art. 29.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "entidades colaboradoras"
  - "quincena"
# anchor: boe-a-2005-14803-art-29
- id: m03-l09-q0017
  prompt:
    es: "Una entidad colaboradora recauda durante la quincena que finaliza el lunes 5 de julio de 2027. Si no hay festivos y teniendo en cuenta que el 18 de julio de 2027 es domingo, ¿en qué fecha debe ingresar en la cuenta del Tesoro el total recaudado, conforme al artículo 29.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El lunes 19 de julio de 2027, inmediato hábil posterior al día 18."
  - id: b
    text:
      es: "El jueves 29 de julio de 2027, penúltimo día hábil del mes."
  - id: c
    text:
      es: "El lunes 5 de julio de 2027, mismo día en que finaliza la quincena."
  - id: d
    correct: true
    text:
      es: "El viernes 16 de julio de 2027, inmediato hábil anterior al día 18."
  explanation:
    es: "Lo recaudado en la quincena que acaba el día 5 se ingresa el día 18 o el inmediato hábil anterior (artículo 29.1). El 18 de julio es domingo y el hábil anterior es el viernes 16. El lunes 19 es posterior, y el artículo manda el anterior. El penúltimo día hábil es la regla de la quincena que acaba el día 20. El ingreso no se hace el mismo día en que termina la quincena."
  citation: "art. 29.1 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "entidades colaboradoras"
  - "cómputo"
# anchor: boe-a-2005-14803-art-29
- id: m03-l09-q0018
  prompt:
    es: "Una entidad colaboradora recauda durante la quincena que finaliza el martes 20 de julio de 2027. Si no hay festivos y el 31 de julio de 2027 es sábado, ¿cuándo debe ingresar en la cuenta del Tesoro lo recaudado, conforme al artículo 29.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El viernes 30 de julio de 2027, último día hábil del mes."
  - id: b
    correct: true
    text:
      es: "El jueves 29 de julio de 2027, penúltimo día hábil del mes."
  - id: c
    text:
      es: "El domingo 18 de julio de 2027 o el inmediato hábil anterior."
  - id: d
    text:
      es: "El lunes 2 de agosto de 2027, primer día hábil del mes siguiente."
  explanation:
    es: "Para la quincena que acaba el día 20 se ingresa el penúltimo día hábil del mes (artículo 29.1). El sábado 31 es inhábil, de modo que el último día hábil es el viernes 30 y el penúltimo el jueves 29. El viernes 30 sería el último, no el penúltimo. El día 18 es la regla de la otra quincena y además ya habría pasado. El 2 de agosto queda fuera del mes."
  citation: "art. 29.1 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "entidades colaboradoras"
  - "cómputo"
# anchor: boe-a-2003-23186-art-60
- id: m03-l09-q0019
  prompt:
    es: "De acuerdo con el artículo 60.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el pago de la deuda tributaria se efectuará en efectivo y podrá efectuarse mediante efectos timbrados:"
  options:
  - id: a
    text:
      es: "Cuando así lo solicite el obligado tributario."
  - id: b
    text:
      es: "Cuando así se disponga mediante ley orgánica."
  - id: c
    correct: true
    text:
      es: "Cuando así se disponga reglamentariamente."
  - id: d
    text:
      es: "Cuando lo autorice el órgano de recaudación en cada caso."
  explanation:
    es: "El artículo 60.1 admite los efectos timbrados cuando así se disponga reglamentariamente. La solicitud del obligado no basta para elegir esta forma. La ley orgánica no interviene: es una remisión al reglamento. Tampoco depende de una autorización caso por caso del órgano de recaudación."
  citation: "art. 60.1 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "formas de pago"
# anchor: boe-a-2003-23186-art-60
- id: m03-l09-q0020
  prompt:
    es: "En relación con el pago en efectivo de la deuda tributaria, conforme al artículo 60.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Podrá hacerse por los medios y en la forma que se determinen reglamentariamente."
  - id: b
    text:
