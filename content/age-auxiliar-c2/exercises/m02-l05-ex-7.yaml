# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q289
  prompt:
    es: "En Windows 11, ¿qué error se obtiene al intentar montar un volumen NTFS con un tamaño de clúster mayor que el máximo admitido por la versión, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "STATUS_ACCESS_DENIED"
  - id: b
    correct: true
    text:
      es: "STATUS_UNRECOGNIZED_VOLUME"
  - id: c
    text:
      es: "STATUS_DISK_FULL"
  - id: d
    text:
      es: "STATUS_INVALID_PARAMETER"
  explanation:
    es: "La página indica ese error al montar un volumen con un clúster mayor del admitido. «STATUS_ACCESS_DENIED» no es el error que cita la página para un tamaño de clúster excesivo. «STATUS_DISK_FULL» no es el error que cita la página para un tamaño de clúster excesivo. «STATUS_INVALID_PARAMETER» no es el error que cita la página para un tamaño de clúster excesivo. Lo que dice la fuente: «obtendrá el error STATUS_UNRECOGNIZED_VOLUME»."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q296
  prompt:
    es: "¿Cuál de los siguientes tipos de almacenamiento en la nube mantiene los datos en una estructura jerárquica tradicional de carpetas y directorios?"
  options:
  - id: a
    text:
      es: "El almacenamiento de objetos, con metadatos"
  - id: b
    text:
      es: "El almacenamiento en bloque fijo"
  - id: c
    correct: true
    text:
      es: "El almacenamiento de archivos"
  - id: d
    text:
      es: "El almacenamiento en la nube híbrida"
  explanation:
    es: "La página dice que el almacenamiento de archivos mantiene una estructura jerárquica de carpetas y directorios. «El almacenamiento de objetos, con metadatos» organiza los datos en unidades discretas con metadatos propios, no en carpetas. «El almacenamiento en bloque fijo» divide los datos en bloques de tamaño fijo, no en carpetas. «El almacenamiento en la nube híbrida» es un modelo que combina nube pública y privada, no un tipo de almacenamiento."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q297
  prompt:
    es: "¿Para qué datos es ideal el almacenamiento de objetos en la nube, según la página de Microsoft Azure sobre qué es el almacenamiento en la nube?"
  options:
  - id: a
    text:
      es: "Para bases de datos y aplicaciones de alto rendimiento"
  - id: b
    text:
      es: "Para sistemas de archivos compartidos y aplicaciones colaborativas"
  - id: c
    text:
      es: "Para pequeñas hojas de cálculo con fórmulas estructuradas"
  - id: d
    correct: true
    text:
      es: "Para grandes cantidades de datos no estructurados, como imágenes o vídeos"
  explanation:
    es: "La página lo presenta como ideal para grandes cantidades de datos no estructurados. «Para bases de datos y aplicaciones de alto rendimiento» es el uso adecuado del almacenamiento en bloque, no del de objetos. «Para sistemas de archivos compartidos y aplicaciones colaborativas» es el uso del almacenamiento de archivos, no del de objetos. «Para pequeñas hojas de cálculo con fórmulas estructuradas» no es el uso que cita la página para el almacenamiento de objetos. Lo que dice la fuente: «Es ideal para grandes cantidades de datos no estructurados, como imágenes, vídeos o copias de seguridad»."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q299
  prompt:
    es: "¿Qué ofrece el almacenamiento en la nube pública, entregado por proveedores de terceros a través de Internet, según la página de Microsoft Azure?"
  options:
  - id: a
    text:
      es: "Un control total de la seguridad, a costa de mayor inversión"
  - id: b
    correct: true
    text:
      es: "Una escalabilidad casi ilimitada, sin administrar infraestructura"
  - id: c
    text:
      es: "Datos confidenciales en un entorno privado y cargas menores en la nube"
  - id: d
    text:
      es: "Un servicio limitado a una sola organización cliente"
  explanation:
    es: "La página dice que la nube pública ofrece escalabilidad casi ilimitada y elimina la gestión de infraestructura. «Un control total de la seguridad, a costa de mayor inversión» es la característica del almacenamiento en la nube privada, no de la pública. «Datos confidenciales en un entorno privado y cargas menores en la nube» es el equilibrio de la nube híbrida, no de la pública. «Un servicio limitado a una sola organización cliente» es la característica de la nube privada, no de la pública."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q300
  prompt:
    es: "¿Qué diferencia hay entre el almacenamiento en la nube y el local en cuanto a quién administra la infraestructura, según la página de Microsoft Azure?"
  options:
  - id: a
    correct: true
    text:
      es: "En la nube la administra el proveedor; en el local, la organización"
  - id: b
    text:
      es: "En la nube la administra la organización; en el local, el proveedor"
  - id: c
    text:
      es: "En ambos casos la administra el proveedor de servicios"
  - id: d
    text:
      es: "En ambos casos la administra la propia organización cliente"
  explanation:
    es: "La página dice que en los sistemas locales la organización posee y mantiene el hardware y en la nube lo hace el proveedor. «En la nube la administra la organización; en el local, el proveedor» invierte lo que dice la página. «En ambos casos la administra el proveedor de servicios» contradice la página, que atribuye el hardware local a la organización. «En ambos casos la administra la propia organización cliente» contradice la página, que atribuye la infraestructura de la nube al proveedor."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-almacenamiento-nube-html
- id: m02-l05-q301
  prompt:
    es: "¿Qué protecciones aplican los proveedores a los archivos del almacenamiento en la nube para protegerlos en tránsito y en reposo, según la página de Microsoft Azure?"
  options:
  - id: a
    text:
      es: "Los comprimen en formato zip"
  - id: b
    correct: true
    text:
      es: "Cifran los archivos"
  - id: c
    text:
      es: "Los guardan solo en un servidor local"
  - id: d
    text:
      es: "Los convierten en objetos sin metadatos"
  explanation:
    es: "La página dice que los proveedores cifran los archivos en tránsito y en reposo. «Los comprimen en formato zip» no es la protección que cita la página. «Los guardan solo en un servidor local» contradice la página, que habla de datos distribuidos en centros de datos seguros. «Los convierten en objetos sin metadatos» no es la protección que cita la página. Lo que dice la fuente: «Los proveedores cifran los archivos para protegerlos en tránsito y en reposo»."
  citation: "fuente: `azure-almacenamiento-nube.html`; «¿Qué es el almacenamiento en la nube?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q304
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes sistemas de archivos ofrece el registro en diario de solo metadatos, según la comparación de Microsoft de los cuatro sistemas principales?"
  options:
  - id: a
    text:
      es: "exFAT"
  - id: b
    correct: true
    text:
      es: "NTFS"
  - id: c
    text:
      es: "UDF"
  - id: d
    text:
      es: "FAT32"
  explanation:
    es: "La tabla marca el registro en diario de solo metadatos únicamente para NTFS. «exFAT» la tabla marca que no lo ofrece. «UDF» la tabla marca que no lo ofrece. «FAT32» la tabla marca que no lo ofrece."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Comparación de la funcionalidad del sistema de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q305
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones recoge los sistemas de archivos que admiten las listas de control de acceso, según la comparación de funcionalidades de seguridad de Microsoft?"
  options:
  - id: a
    text:
      es: "NTFS y exFAT"
  - id: b
    text:
      es: "NTFS y UDF"
  - id: c
    text:
      es: "exFAT y FAT32"
  - id: d
    correct: true
    text:
      es: "Solo NTFS"
  explanation:
    es: "La tabla marca las listas de control de acceso solo para NTFS. «NTFS y exFAT» la tabla marca que exFAT no las admite. «NTFS y UDF» la tabla marca que UDF no las admite. «exFAT y FAT32» la tabla marca que ninguno de los dos las admite."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Comparación de la funcionalidad del sistema de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q334
  prompt:
    es: "¿Cómo supera una ruta de acceso extendida el límite de 260 caracteres de MAX_PATH, según la página de Microsoft sobre NTFS?"
  options:
  - id: a
    correct: true
    text:
      es: "Con las versiones Unicode de muchas funciones de la API de Windows, que admiten unos 32 767 caracteres"
  - id: b
    text:
      es: "Con el alias 8.3 que NTFS almacena en el disco"
  - id: c
    text:
      es: "Con el archivo de registro basado en transacciones"
  - id: d
    text:
      es: "Con un tamaño de clúster de 2048 KB"
  explanation:
    es: "Según la página, muchas funciones de la API de Windows tienen versiones Unicode que permiten una ruta de unos 32 767 caracteres, más que el límite de 260 de MAX_PATH. El alias 8.3 da compatibilidad con sistemas de archivos que limitan los nombres de archivo y las extensiones. El archivo de registro basado en transacciones restaura la coherencia del sistema de archivos tras un error. El tamaño de clúster fija el volumen y el archivo máximos."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q339
  prompt:
    es: "Según la comparación de Microsoft de las funciones de seguridad de los sistemas de archivos de Windows, ¿cuáles ofrecen suma de comprobación o ECC?"
  options:
  - id: a
    correct: true
    text:
      es: "exFAT y UDF, y solo para los metadatos"
  - id: b
    text:
      es: "Solo NTFS"
  - id: c
    text:
      es: "NTFS y FAT32"
  - id: d
    text:
      es: "FAT32 y UDF"
  explanation:
    es: "En la fila de suma de comprobación o ECC, exFAT y UDF figuran con «Metadatos». NTFS y FAT32 figuran con «No», así que fallan «solo NTFS», «NTFS y FAT32» y «FAT32 y UDF»."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Comparación de la funcionalidad del sistema de archivos»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q131
  prompt:
    es: "En el sistema operativo Windows, ¿cuál de los siguientes administradores del modo kernel administra la memoria física, según la documentación de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "El administrador de memoria."
  - id: b
    text:
      es: "El administrador de objetos."
  - id: c
    text:
      es: "El administrador de E/S."
  - id: d
    text:
      es: "El administrador de energía."
  explanation:
    es: "El administrador de memoria del modo kernel de Windows «administra la memoria física para el sistema operativo». El administrador de objetos administra archivos, dispositivos, mecanismos de sincronización y claves del Registro. El administrador de E/S administra la comunicación entre las aplicaciones y las interfaces de los controladores de dispositivo. El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q132
  prompt:
    es: "¿Qué función cumple el administrador de procesos y subprocesos en modo kernel de Windows, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "Administra la memoria física para el sistema operativo."
  - id: b
    text:
      es: "Administra la comunicación entre las aplicaciones y los controladores de dispositivo."
  - id: c
    correct: true
    text:
      es: "Controla la ejecución de todos los subprocesos de un proceso."
  - id: d
    text:
      es: "Implementa el procesamiento de transacciones en modo kernel."
  explanation:
    es: "La documentación dice que el administrador de procesos y subprocesos «controla la ejecución de todos los subprocesos de un proceso». Administrar la memoria física es la función del administrador de memoria; la comunicación entre las aplicaciones y los controladores de dispositivo, la del administrador de E/S; y el procesamiento de transacciones, la del administrador de transacciones kernel."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q133
  prompt:
    es: "En el modo kernel de Windows, ¿cuál de los siguientes administradores gestiona la comunicación entre las aplicaciones y las interfaces proporcionadas por los controladores de dispositivo?"
  options:
  - id: a
    text:
      es: "El administrador de Plug and Play."
  - id: b
    correct: true
    text:
      es: "El administrador de E/S."
  - id: c
    text:
      es: "El administrador de memoria."
  - id: d
    text:
      es: "El administrador de energía."
  explanation:
    es: "La documentación dice que el administrador de E/S «administra la comunicación entre las aplicaciones y las interfaces proporcionadas por los controladores de dispositivo». El administrador de Plug and Play permite al equipo reconocer cuándo se agrega un dispositivo; la documentación lo describe como subsistema del de E/S. El administrador de memoria administra la memoria física. El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q134
  prompt:
    es: "¿Cuál de los siguientes administradores del modo kernel de Windows administra objetos como archivos, dispositivos, mecanismos de sincronización y claves del Registro?"
  options:
  - id: a
    text:
      es: "El administrador de memoria."
  - id: b
    text:
      es: "El administrador de energía."
  - id: c
    text:
      es: "El administrador de transacciones kernel."
  - id: d
    correct: true
    text:
      es: "El administrador de objetos."
  explanation:
    es: "La documentación dice que el administrador de objetos «administra objetos: archivos, dispositivos, mecanismos de sincronización, claves del Registro, etc.». El administrador de memoria administra la memoria física. El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos. El administrador de transacciones kernel implementa el procesamiento de transacciones."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q135
  prompt:
    es: "En Windows, ¿cuál de los siguientes administradores permite a un equipo reconocer cuándo se agrega un dispositivo al sistema, según la documentación de Microsoft sobre el modo kernel?"
  options:
  - id: a
    text:
      es: "El administrador de energía."
  - id: b
    correct: true
    text:
      es: "El administrador de Plug and Play."
  - id: c
    text:
      es: "El administrador de configuración."
  - id: d
    text:
      es: "El monitor de referencia de seguridad."
  explanation:
    es: "La documentación dice que el administrador de Plug and Play «permite a un equipo reconocer cuándo se agrega un dispositivo al sistema». El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos. El administrador de configuración administra el registro. El monitor de referencia de seguridad proporciona rutinas para trabajar con el control de acceso."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q136
  prompt:
    es: "¿Qué administra el administrador de energía en modo kernel de Windows, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "El registro de Windows y la supervisión de sus cambios."
  - id: b
    text:
      es: "La memoria física que usa el sistema operativo."
  - id: c
    correct: true
    text:
      es: "El cambio ordenado del estado de energía de los dispositivos."
  - id: d
    text:
      es: "La ejecución de todos los subprocesos de un proceso en marcha."
  explanation:
    es: "El administrador de energía «administra el cambio ordenado en el estado de energía de todos los dispositivos que admiten cambios de estado de energía». Administrar el registro es la función del administrador de configuración. Administrar la memoria física es la función del administrador de memoria. Controlar la ejecución de los subprocesos es la función del administrador de procesos y subprocesos."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q137
  prompt:
    es: "En el modo kernel de Windows, ¿cuál de los siguientes administradores administra el registro, por ejemplo supervisando sus cambios?"
  options:
  - id: a
    correct: true
    text:
      es: "El administrador de configuración."
  - id: b
    text:
      es: "El administrador de memoria."
  - id: c
    text:
      es: "El administrador de E/S."
  - id: d
    text:
      es: "El administrador de energía."
  explanation:
    es: "La documentación dice que el administrador de configuración «administra el registro, como la supervisión de cambios en el registro o el registro de devoluciones de llamada en datos específicos del Registro». El administrador de memoria administra la memoria física. El administrador de E/S administra la comunicación entre las aplicaciones y los controladores de dispositivo. El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q138
  prompt:
    es: "¿Cuál de los siguientes componentes del modo kernel de Windows proporciona rutinas para que el controlador funcione con el control de acceso?"
  options:
  - id: a
    text:
      es: "El administrador de transacciones kernel."
  - id: b
    text:
      es: "El administrador de energía."
  - id: c
    text:
      es: "El administrador de configuración."
  - id: d
    correct: true
    text:
      es: "El monitor de referencia de seguridad."
  explanation:
    es: "La documentación dice que el monitor de referencia de seguridad «proporciona rutinas para que el controlador funcione con el control de acceso». El administrador de transacciones kernel implementa el procesamiento de transacciones. El administrador de energía administra el cambio ordenado en el estado de energía de los dispositivos. El administrador de configuración administra el registro."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q139
  prompt:
    es: "Según la documentación de Microsoft sobre el modo kernel de Windows, ¿qué proporciona el kernel de Microsoft Windows?"
  options:
  - id: a
    text:
      es: "Una capa de abstracción de hardware para el desarrollo de controladores."
  - id: b
    text:
      es: "Un sistema de registro transaccional, el sistema de archivos de registro común."
  - id: c
    correct: true
    text:
      es: "Operaciones básicas de bajo nivel, como programar hilos o enrutar interrupciones."
  - id: d
    text:
      es: "Una biblioteca de acceso directo a memoria para desarrolladores de controladores."
  explanation:
    es: "La documentación dice que «el kernel de Microsoft Windows proporciona operaciones básicas de bajo nivel, como programar hilos o enrutamiento de interrupciones de hardware». La capa de abstracción de hardware es la función de la biblioteca HAL, no la del kernel. El sistema de registro transaccional es la función de la biblioteca CLFS, no la del kernel. La biblioteca de acceso directo a memoria es la función de la biblioteca DMA, no la del kernel."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-apple-macos-html
- id: m02-l05-q140
  prompt:
    es: "Según la página de soporte técnico de Apple, el sistema operativo del ordenador Mac se llama:"
  options:
  - id: a
    text:
      es: "Time Machine."
  - id: b
    correct: true
    text:
      es: "macOS."
  - id: c
    text:
      es: "Windows."
  - id: d
    text:
      es: "Recuperación de macOS."
  explanation:
    es: "La página dice que Recuperación de macOS sirve para «reinstalar el sistema operativo del Mac», y su título es «Soporte para macOS». Time Machine es la herramienta de copia de seguridad automática del Mac, no su sistema operativo. El sistema operativo que reinstala Recuperación de macOS es el del Mac, al que la página llama macOS, no Windows. Recuperación de macOS es la herramienta para reinstalar el sistema operativo, no el sistema operativo."
  citation: "fuente: `apple-macos.html`; «Soporte para macOS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-apple-macos-html
- id: m02-l05-q141
  prompt:
    es: "¿Qué herramienta de macOS permite hacer una copia de seguridad automática de los datos en un dispositivo de almacenamiento externo conectado al Mac?"
  options:
  - id: a
    correct: true
    text:
      es: "Time Machine."
  - id: b
    text:
      es: "Recuperación de macOS."
  - id: c
    text:
      es: "Copias de seguridad de Windows."
  - id: d
    text:
      es: "Historial de archivos."
  explanation:
    es: "La página dice que, con un dispositivo de almacenamiento externo conectado al Mac, «podrás usar Time Machine para hacer una copia de seguridad automática de tus datos». Recuperación de macOS sirve para reinstalar el sistema operativo, no para hacer copias de seguridad. Copias de seguridad de Windows es la herramienta de los equipos Windows, no de macOS. El Historial de archivos es una función de Windows, no de macOS."
  citation: "fuente: `apple-macos.html`; «Soporte para macOS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-componentes-kernel-html
- id: m02-l05-q142
  prompt:
    es: "¿Qué tipo de recurso administra el administrador de memoria del modo kernel de Windows, según la documentación de Microsoft sobre los componentes de ese modo?"
  options:
  - id: a
    text:
      es: "El almacenamiento en servidores remotos."
  - id: b
    text:
      es: "Los archivos y las claves del Registro."
  - id: c
    text:
      es: "La energía de los dispositivos."
  - id: d
    correct: true
    text:
      es: "La memoria física del sistema operativo."
  explanation:
    es: "La documentación dice que el administrador de memoria «administra la memoria física para el sistema operativo». El administrador de memoria administra la memoria física, no el almacenamiento en servidores remotos. Los archivos y las claves del Registro los administra el administrador de objetos. La energía de los dispositivos la administra el administrador de energía."
  citation: "fuente: `ms-win-componentes-kernel.html`; «Guía de diseño de la arquitectura del controlador en modo kernel»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-powershell-html
- id: m02-l05-q187
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a PowerShell, según la página de Microsoft Learn que explica qué es?"
  options:
  - id: a
    text:
      es: "Un editor de texto del sistema operativo para escribir documentos de uso administrativo y de oficina"
  - id: b
    correct: true
    text:
      es: "Una solución de automatización de tareas con shell, lenguaje de scripting y marco de configuración"
  - id: c
    text:
      es: "Un antivirus integrado de Windows que analiza los archivos ejecutables del equipo y los pone en cuarentena"
  - id: d
    text:
      es: "Un lenguaje de marcas para escribir páginas web y servirlas desde servidores de Internet y de red local"
  explanation:
    es: "La página lo define como solución de automatización multiplataforma con shell, scripting y marco de configuración. «Un editor de texto del sistema operativo para escribir documentos de uso administrativo y de oficina» no es lo que describe la página, que habla de un shell y un lenguaje de scripting. «Un antivirus integrado de Windows que analiza los archivos ejecutables del equipo y los pone en cuarentena» no es lo que describe la página, que habla de automatizar tareas. «Un lenguaje de marcas para escribir páginas web y servirlas desde servidores de Internet y de red local» no es lo que describe la página, que habla de un shell de línea de comandos. Lo que dice la fuente: «PowerShell es una solución de automatización de tareas multiplataforma formada por un shell de línea de comandos, un lenguaje de scripting y un marco de administración de configuración»."
  citation: "fuente: `ms-learn-powershell.html`; «¿Qué es PowerShell?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-learn-powershell-html
- id: m02-l05-q190
  prompt:
    es: "¿Cuál de las siguientes herramientas de PowerShell permite administrar la infraestructura empresarial con la configuración como código, según Microsoft?"
  options:
  - id: a
    text:
      es: "Windows Update for Business"
  - id: b
    text:
      es: "Microsoft Defender Antivirus"
  - id: c
    text:
      es: "Administrador de configuración del kernel"
  - id: d
    correct: true
    text:
      es: "Desired State Configuration (DSC)"
  explanation:
    es: "La página describe DSC como marco de administración que permite gestionar la infraestructura con configuración como código. «Windows Update for Business» no es el marco de PowerShell que cita la página para la configuración como código. «Microsoft Defender Antivirus» no es un marco de administración de configuración de PowerShell. «Administrador de configuración del kernel» es un componente del modo kernel de Windows que gestiona el registro, no un marco de PowerShell. Lo que dice la fuente: «Desired State Configuration ( DSC ) de PowerShell es un marco de administración en PowerShell que permite administrar la infraestructura empresarial con configuración como código»."
  citation: "fuente: `ms-learn-powershell.html`; «¿Qué es PowerShell?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-learn-powershell-html
- id: m02-l05-q191
  prompt:
    es: "¿Qué persona inventó PowerShell y escribió el Manifiesto Monad para explicar su visión de cómo cambiaría la administración de sistemas?"
  options:
  - id: a
    text:
      es: "Federico Faggin"
  - id: b
    text:
      es: "Alan Turing"
  - id: c
    correct: true
    text:
      es: "Jeffrey Snover"
  - id: d
    text:
      es: "Pat Gelsinger"
  explanation:
    es: "La página atribuye a Jeffrey Snover la invención de PowerShell y el Manifiesto Monad. «Federico Faggin» es el ingeniero que diseñó el Intel 4004, no el inventor de PowerShell. «Alan Turing» es el hombre al que se atribuye la idea del lenguaje de 0 y 1, no el inventor de PowerShell. «Pat Gelsinger» es el CEO de Intel, no el inventor de PowerShell."
  citation: "fuente: `ms-learn-powershell.html`; «¿Qué es PowerShell?»"
  difficulty: 3
  tags:
  - "concepto"
