# SPDX-License-Identifier: AGPL-3.0-only
# age-auxiliar-c2 course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/age-auxiliar-course-requirements.md (a delta to the C1 requirements). Programme:
# sources/programa.md (Anexo I, BOE-A-2025-26262). Module mNN is bloque NN of the programme (01 = I, 02 = II) and
# lesson mNN-lMM its tema MM, so ids follow the official numbering. Block «Proceso de selección» sits before the
# programme: m00 is the exam, ps the psicotécnicos (not a bloque, so it takes no number and keeps mNN = bloque NN).
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are placeholders until round R2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: age-auxiliar-c2
  title:
    es: Auxiliar Administrativo del Estado (C2)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: Ingreso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Auxiliar de la Administración del Estado, ingreso libre, resumido tema a
      tema, con preguntas tipo test y psicotécnicos como los del examen.
  languages: [es]
  status: draft
  exercise_types: [quiz, psicotecnico]
  # «Por tema» instead of «Por lección» in results and stats.
  lesson_noun:
    es: tema
  # Questions are practised per tema from its «Practicar» page; the lessons embed none.
  lesson_practice: true
  option_labels: letters
# The psicotécnico generators (platform delta L): weight = the type's questions among the scored 31-60 of the six
# official questionnaires (docs/age-c2-psicotecnico-index.md, section 1), difficulty = the index's level mix.
# The three types outside the first batch (series alfanuméricas, analogías, palabra intrusa) wait for a later round.
  practice_generators:
  - generator: tablas-lectura
    title:
      es: Lectura de tablas
    weight: 62
    difficulty: {1: 19, 2: 31, 3: 12}
  - generator: atencion-codificacion
    title:
      es: Codificación y equivalencias
    weight: 16
    difficulty: {1: 10, 2: 6}
  - generator: verbal-sinonimos
    title:
      es: Sinónimos
    weight: 14
    difficulty: {1: 11, 2: 4}
  - generator: verbal-antonimos
    title:
      es: Antónimos
    weight: 10
    difficulty: {1: 12, 2: 1}
  - generator: calculo-ecuaciones
    title:
      es: Ecuaciones
    weight: 9
    difficulty: {1: 1, 2: 12}
  - generator: verbal-definicion
    title:
      es: Definiciones
    weight: 11
    difficulty: {1: 5, 2: 5, 3: 2}
  - generator: verbal-ortografia
    title:
      es: Ortografía
    weight: 9
    difficulty: {1: 6, 2: 5}
  - generator: calculo-problemas
    title:
      es: Problemas aritméticos
    weight: 9
    difficulty: {1: 5, 2: 6}
  - generator: calculo-porcentajes
    title:
      es: Porcentajes
    weight: 9
    difficulty: {1: 7, 2: 3}
  - generator: serie-numerica
    title:
      es: Series numéricas
    weight: 9
    difficulty: {1: 4, 2: 5}
  - generator: administrativo-clasificacion
    title:
      es: Clasificación y archivo
    weight: 9
    difficulty: {1: 4, 2: 5}
  - generator: calculo-fracciones-proporciones
    title:
      es: Fracciones y repartos
    weight: 4
    difficulty: {1: 1, 2: 3}
  - generator: administrativo-ordenacion
    title:
      es: Ordenación alfabética
    weight: 4
    difficulty: {1: 3, 2: 1}
  # The PDF exports theory only: questions stay on the practice and exam pages.
  pdf_exercises: false
  # glyph / color: left for the identity round (docs/identity.md; R2.2 of the course requirements), with a glyph
  # distinct from C1's in the same family. No figures: this course has no figures/ tree.
blocks:
- id: block-a
  title:
    es: Proceso de selección
  modules:
  - id: m00
    title:
      es: El examen
    summary:
      es: Las reglas del ejercicio único de la convocatoria.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el examen
      summary:
        es: El ejercicio único tiene dos partes, dura noventa minutos y cada error resta un tercio de acierto. La
          puntuación directa de cada parte se transforma en una calificación de 0 a 50, con 25 en la nota de corte.
          La lección da las notas de corte que fijó la Comisión en 2025.
  - id: ps
    title:
      es: Psicotécnicos
    summary:
      es: Los tipos de pregunta psicotécnica de la primera parte.
    lessons:
    - id: ps-l01
      title:
        es: Cómo son los psicotécnicos
      summary:
        es: Las 30 preguntas psicotécnicas de la primera parte se agrupan en 16 tipos, sacados de los cuestionarios
          del Auxiliar de 2020 a 2025. Cada tipo lleva una pregunta oficial resuelta, con su clave.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización pública
    summary:
      es: >-
        La organización del Estado según la Constitución de 1978 (la Corona, las Cortes Generales, el Poder
        Judicial, el Tribunal Constitucional, el Gobierno, la Administración General del Estado, las
        Comunidades Autónomas y la Administración local) y la de la Unión Europea. Incluye la transparencia y
        el Gobierno Abierto, el procedimiento administrativo, la protección de datos, el personal funcionario,
        el presupuesto del Estado y las políticas de igualdad.
    lessons:
    - id: m01-l01
      title:
        es: La Constitución Española de 1978. Características. Los principios constitucionales y los valores superiores.
          Derechos y deberes fundamentales. Su garantía y suspensión.
      summary:
        es: >-
          La Constitución de 1978 constituye a España en un Estado social y democrático de Derecho cuya
          forma política es la Monarquía parlamentaria. Propugna como valores superiores la libertad, la
          justicia, la igualdad y el pluralismo político. Los derechos del título I tienen distintas
          garantías según el artículo 53, y algunos se pueden suspender en los estados de excepción y de
          sitio.
    - id: m01-l02
      title:
        es: 'El Tribunal Constitucional. La reforma de la Constitución. La Corona: funciones constitucionales del Rey.
          Sucesión y regencia.'
      summary:
        es: >-
          El Tribunal Constitucional tiene doce miembros nombrados por el Rey por nueve años y se renueva
          por terceras partes cada tres. La reforma de la Constitución exige tres quintos de cada Cámara, o
          dos tercios para la revisión total y las partes que protege el artículo 168. El Rey es el Jefe del
          Estado, sus actos necesitan refrendo y la Constitución regula la sucesión y la regencia.
    - id: m01-l03
      title:
        es: 'Las Cortes Generales: composición, atribuciones y funcionamiento del Congreso de los Diputados y Senado. El
          Defensor del Pueblo.'
      summary:
        es: >-
          Las Cortes Generales son el Congreso, de 300 a 400 Diputados, y el Senado, la Cámara de
          representación territorial, elegidos por cuatro años. Cada Cámara funciona en Pleno y por
          Comisiones. El Defensor del Pueblo lo eligen las Cortes Generales para un periodo de cinco años.
    - id: m01-l04
      title:
        es: El Poder Judicial. El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial española.
      summary:
        es: >-
          Los Jueces y Magistrados son independientes, inamovibles, responsables y sometidos únicamente al
          imperio de la ley. El Consejo General del Poder Judicial es su órgano de gobierno, con su
          Presidente y veinte Vocales nombrados por el Rey por cinco años. El Tribunal Supremo es el órgano
          jurisdiccional superior en todos los órdenes, salvo lo dispuesto en materia de garantías
          constitucionales.
    - id: m01-l05
      title:
        es: El Gobierno y la Administración. El Presidente del Gobierno. El Consejo de Ministros. Designación, causas de
          cese y responsabilidad del Gobierno.
      summary:
        es: >-
          El Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los Ministros y de
          los demás miembros que establezca la ley. El Rey nombra Presidente al candidato que obtiene la
          confianza del Congreso, y el Gobierno cesa tras la celebración de elecciones generales, por
          pérdida de la confianza parlamentaria y por dimisión o fallecimiento del Presidente. El Gobierno
          responde solidariamente de su gestión política ante el Congreso.
    - id: m01-l06
      title:
        es: 'El Gobierno Abierto: concepto y principios informadores. La Agenda 2030 y los Objetivos de Desarrollo Sostenible.'
      summary:
        es: >-
          El Gobierno Abierto según la Recomendación de la OCDE de 2017 y los planes de acción de España,
          hoy el V Plan de Gobierno Abierto 2025-2029. La Agenda 2030, aprobada por la Asamblea General de
          las Naciones Unidas el 25 de septiembre de 2015, tiene 17 Objetivos de Desarrollo Sostenible y 169
          metas.
    - id: m01-l07
      title:
        es: La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno.
      summary:
        es: >-
          La Ley 19/2013 regula la publicidad activa, el derecho de acceso a la información pública y el
          buen gobierno. La solicitud de acceso se resuelve en el plazo máximo de un mes, ampliable por otro
          mes, y la resolución puede reclamarse ante el Consejo de Transparencia y Buen Gobierno.
    - id: m01-l08
      title:
        es: La Administración General del Estado. Órganos centrales. Órganos superiores y órganos directivos. Órganos territoriales.
          Otros órganos administrativos. La Administración del Estado en el exterior.
      summary:
        es: >-
          La Administración General del Estado tiene una organización central, una territorial y una en el
          exterior. Son órganos superiores los Ministros y los Secretarios de Estado, y órganos directivos,
          entre otros, los Subsecretarios, los Secretarios generales técnicos y los Directores generales. En
          cada Comunidad Autónoma hay un Delegado del Gobierno.
    - id: m01-l09
      title:
        es: 'La Organización territorial del Estado. Las Comunidades Autónomas: Constitución y distribución de competencias
          entre el Estado y las Comunidades Autónomas. La Administración local: entidades que la integran. La provincia,
          el municipio y la isla.'
      summary:
        es: >-
          El Estado se organiza territorialmente en municipios, en provincias y en las Comunidades Autónomas
          que se constituyan. La Constitución reparte las competencias en sus artículos 148 y 149, y la Ley
          7/1985 regula el municipio, la provincia y la isla, sus órganos y los servicios que presta cada
          municipio.
    - id: m01-l10
      title:
        es: La organización de la Unión Europea. El Consejo Europeo, el Consejo, el Parlamento Europeo, la Comisión Europea
          y el Tribunal de Justicia de la Unión Europea.
      summary:
        es: >-
          El Tratado de la Unión Europea enumera siete instituciones, entre ellas el Consejo Europeo, el
          Consejo, el Parlamento Europeo, la Comisión Europea y el Tribunal de Justicia de la Unión Europea.
          De estas cinco se dan la composición, las funciones, los mandatos y las mayorías, según el TUE y
          el TFUE.
    - id: m01-l11
      title:
        es: 'Las Leyes del Procedimiento Administrativo Común de las Administraciones Públicas y del Régimen Jurídico del
          Sector Público. El procedimiento administrativo común y sus fases. La revisión de los actos en vía administrativa:
          revisión de oficio y recursos administrativos. El recurso contencioso-administrativo. Actividad administrativa
          impugnable. Las partes: capacidad, legitimación, representación y defensa.'
      summary:
        es: >-
          La Ley 39/2015 regula el procedimiento administrativo común: los interesados, los plazos, el
          silencio, las fases del procedimiento y la eficacia y validez de los actos. Los actos se revisan
          de oficio o mediante los recursos de alzada, potestativo de reposición y extraordinario de
          revisión. La Ley 29/1998 regula el recurso contencioso-administrativo: la actividad impugnable y
          las partes.
    - id: m01-l12
      title:
        es: 'La protección de datos personales y su régimen jurídico: principios, derechos y obligaciones.'
      summary:
        es: >-
          El Reglamento (UE) 2016/679 y la Ley Orgánica 3/2018 regulan el tratamiento de los datos
          personales. Fijan sus principios, las bases de licitud, el consentimiento y los derechos del
          interesado, y las obligaciones del responsable, del encargado y del delegado de protección de
          datos.
    - id: m01-l13
      title:
        es: 'El personal funcionario al servicio de las Administraciones públicas: concepto y clases. Régimen jurídico.
          El Registro Central de Personal. Programación de efectivos y Oferta de Empleo Público. Selección. Provisión de
          puestos de trabajo. Situaciones administrativas de los funcionarios.'
      summary:
        es: >-
          Los empleados públicos se clasifican en funcionarios de carrera, funcionarios interinos, personal
          laboral y personal eventual. El ingreso va de la programación de efectivos y la Oferta de Empleo
          Público a la selección y el nombramiento. Los puestos se proveen por concurso y por libre
          designación, y el funcionario pasa por las situaciones administrativas del TREBEP.
    - id: m01-l14
      title:
        es: Derechos y deberes de los funcionarios. La carrera administrativa. Promoción interna. El sistema de retribuciones
          e indemnizaciones. Régimen disciplinario. El régimen de la Seguridad Social de los funcionarios.
      summary:
        es: >-
          Los funcionarios tienen derechos individuales y colectivos, deberes y un código de conducta, y
          progresan por la carrera y la promoción interna. Sus retribuciones son básicas y complementarias,
          y las faltas disciplinarias son muy graves, graves y leves. La Seguridad Social de los
          funcionarios civiles del Estado combina el mutualismo administrativo de la MUFACE con las clases
          pasivas o, para quienes ingresan desde el 1 de enero de 2011, con el Régimen General a efectos de
          pensiones.
    - id: m01-l15
      title:
        es: El presupuesto del Estado en España. Contenido, elaboración y estructura. Fases del ciclo presupuestario.
      summary:
        es: >-
          El Gobierno elabora los Presupuestos Generales del Estado y las Cortes Generales los examinan,
          enmiendan y aprueban. Contienen los estados de gastos y de ingresos del sector público estatal, y
          su ciclo sigue con la ejecución y el control. Rigen, prorrogados, los Presupuestos de 2023.
    - id: m01-l16
      title:
        es: 'Políticas de igualdad y contra la violencia de género. Políticas de igualdad de trato y no discriminación
          de las personas LGTBI. Discapacidad y dependencia: régimen jurídico.'
      summary:
        es: >-
          La Ley Orgánica 3/2007 regula la igualdad efectiva de mujeres y hombres, y la Ley Orgánica 1/2004
          la protección integral contra la violencia de género. La Ley 15/2022 y la Ley 4/2023 tratan la
          igualdad de trato y los derechos de las personas trans y LGTBI. La discapacidad y la dependencia
          están en el Real Decreto Legislativo 1/2013 y en la Ley 39/2006, con los cambios de la Ley 4/2026.
  - id: m02
    title:
      es: Actividad administrativa y ofimática
    summary:
      es: >-
        La atención al público y los servicios de información administrativa, el documento, el registro y el
        archivo, y la administración electrónica. La informática básica, Windows 11 y su Explorador de
        archivos, las aplicaciones Word, Excel, Access y Outlook de Microsoft 365, e Internet.
    lessons:
    - id: m02-l01
      title:
        es: 'Atención al público: acogida e información al ciudadano. Atención de personas con discapacidad.'
      summary:
        es: >-
          Las funciones de atención personalizada al ciudadano del Real Decreto 208/1996. La atención de las
          personas con discapacidad: el artículo 49 de la Constitución, el Real Decreto Legislativo 1/2013 y
          el Real Decreto 366/2007, con sus reglas para oficinas, impresos y documentos.
    - id: m02-l02
      title:
        es: Los servicios de información administrativa. Información general y particular al ciudadano. Iniciativas. Reclamaciones.
          Quejas. Peticiones.
      summary:
        es: >-
          Los servicios de información administrativa del Real Decreto 208/1996: las unidades y oficinas, y
          la información general y la particular. Las cartas de servicios y las quejas y sugerencias del
          Real Decreto 951/2005, y el derecho de petición de la Ley Orgánica 4/2001.
    - id: m02-l03
      title:
        es: Concepto de documento, registro y archivo. Funciones del registro y del archivo. Clases de archivo y criterios
          de ordenación.
      summary:
        es: >-
          Documento, registro y archivo en la Ley 16/1985, la Ley 39/2015, el Real Decreto 203/2021 y el
          Real Decreto 1708/2011, entre otras normas. Los asientos del registro, las funciones de los
          archivos, sus clases según el ciclo vital y el acceso a los documentos, con las operaciones de
          clasificación y ordenación.
    - id: m02-l04
      title:
        es: Administración electrónica y servicios al ciudadano. La información administrativa. Análisis de principales
          páginas web de carácter público. Servicios telemáticos. Oficinas integradas de atención al ciudadano. Ventanilla
          única empresarial. El Punto de Acceso General de la Administración General del Estado.
      summary:
        es: >-
          La administración electrónica en la Ley 39/2015, la Ley 40/2015 y el Real Decreto 203/2021:
          identificación, firma, sedes, portales y notificaciones. La accesibilidad web, las oficinas
          integradas, la ventanilla única empresarial y el Punto de Acceso General.
    - id: m02-l05
      title:
        es: 'Informática básica: conceptos fundamentales sobre el hardware y el software. Sistemas de almacenamiento de
          datos. Sistemas operativos. Nociones básicas de seguridad informática.'
      summary:
        es: >-
          Hardware y software: procesador, memoria RAM, caché, unidades del byte y periféricos.
          Almacenamiento, sistemas de archivos, sistemas operativos y PowerShell. Malware, antivirus,
          cortafuegos, contraseñas y términos de seguridad de INCIBE.
    - id: m02-l06
      title:
        es: 'Introducción al sistema operativo: el entorno Windows. Fundamentos. Trabajo en el entorno gráfico de Windows:
          ventanas, iconos, menús contextuales, cuadros de diálogo. El escritorio y sus elementos. El menú inicio. Copilot.'
      summary:
        es: >-
          El entorno de Windows 11: Configuración, ventanas, escritorio, barra de tareas, notificaciones,
          varios escritorios y menú Inicio. Conexión a redes Wi-Fi, Enlace Móvil y pantalla de bloqueo.
          Microsoft Copilot y la inteligencia artificial generativa.
    - id: m02-l07
      title:
        es: El explorador de Windows. Gestión de carpetas y archivos. Operaciones de búsqueda. Herramientas «Este equipo»
          y «Acceso rápido». Accesorios. Herramientas del sistema.
      summary:
        es: >-
          El Explorador de archivos de Windows 11: vistas, extensiones, Abrir con, Acceso rápido y
          bibliotecas. Búsqueda e indexación, accesorios y Asistencia rápida. Herramientas del sistema:
          Administrador de tareas, Registro, Historial de archivos, recomendaciones de limpieza y Liberador
          de espacio en disco.
    - id: m02-l08
      title:
        es: 'Procesadores de texto: Word 365. Principales funciones y utilidades. Creación y estructuración del documento.
          Gestión, grabación, recuperación e impresión de ficheros. Personalización del entorno de trabajo.'
      summary:
        es: >-
          Word de Microsoft 365: Sugerencias de teclas, panel de navegación, revisión, control de cambios,
          combinar correspondencia y accesibilidad. Tablas de contenido, índices, listas multinivel, tablas
          e ilustraciones. Guardado, recuperación, exportación e impresión, y personalización de la cinta.
    - id: m02-l09
      title:
        es: 'Hojas de cálculo: Excel 365. Principales funciones y utilidades. Libros, hojas y celdas. Configuración. Introducción
          y edición de datos. Fórmulas y funciones. Gráficos. Gestión de datos. Personalización del entorno de trabajo.'
      summary:
        es: >-
          Excel de Microsoft 365: hojas y libros, formatos de número y de fecha, fórmulas y funciones,
          referencias y categorías de funciones. Gráficos, segmentación, ordenación, filtros e impresión.
          Recuperación de libros no guardados y personalización de la cinta.
    - id: m02-l10
      title:
        es: 'Bases de datos: Access 365. Principales funciones y utilidades. Tablas. Consultas. Formularios. Informes.
          Relaciones. Importación, vinculación y exportación de datos.'
      summary:
        es: >-
          Access de Microsoft 365: objetos, límites, cifrado y división de la base de datos. Tablas con sus
          tipos de datos y propiedades, consultas (acción, criterios, unión, combinaciones, SQL),
          formularios, informes y relaciones. Importación, vinculación y exportación de datos.
    - id: m02-l11
      title:
        es: 'Correo electrónico: Outlook 365. Conceptos elementales y funcionamiento. El entorno de trabajo. Enviar, recibir,
          responder y reenviar mensajes. Creación de mensajes. Reglas de mensaje. Libreta de direcciones.'
      summary:
        es: >-
          Outlook de Microsoft 365, con las diferencias entre Outlook clásico y el nuevo Outlook.
          Direcciones, protocolos de correo, búsqueda, limpieza del buzón, calendario y tareas. Enviar,
          recuperar, programar y cifrar mensajes, reglas, firmas y grupos de contactos.
    - id: m02-l12
      title:
        es: 'La Red Internet: origen, evolución y estado actual. Conceptos elementales sobre protocolos y servicios en
          Internet. Funcionalidades básicas de los navegadores web.'
      summary:
        es: >-
          Origen de Internet, de ARPANET a la Web 4.0. Protocolos y servicios: TCP/IP, DNS, DHCP, VPN, HTTP
          y HTTPS, correo y alojamiento web. Funciones de Microsoft Edge: historial, favoritos, pestañas,
          InPrivate y extensiones.
# exams: not declared yet. The presets need a bank to draw from (the load fails when a pool cannot supply a
# preset) and part 1 mixes stored questions with generated psicotécnico items, which is platform delta section L.
# R7.1 of the course requirements, scored per R7.2 (sources/programa.md: Anexo I 2.3 and the CPS notes):
# - «Simulacro oficial»: 90 minutes for both parts, pause never, tema labels hidden, option letters A–D. Part 1:
#   60 questions (30 from m01 + 30 generated psicotécnicos in the type weights of the last official exam) + 5
#   reserve. Part 2: 50 questions from m02 + 5 reserve, graded only if part 1 reaches its minimum. A wrong answer
#   costs 1/3, a blank nothing; each part 0–50, pass 25, CPS transformation with the 2025 cut-offs of the
#   sistema general as exact fractions: part 1 minimum_raw 29, part 2 minimum_raw 64/3 (printed 21,33); 0–100.
# - «Parte 1» and «Parte 2» alone, with the same counts, reserve and scoring.
# - «Bloque N» per bloque (m01, m02) and «Tema» per tema.
# - «Psicotécnicos»: 30 generated items in the official type weights, timed as the exam's share.
# - The official-exam sets (2025 A/B, 2024 A/B, 2024 extraordinario, 2022, OEP 2020 and its extraordinario), real
#   psicotécnico questions included, from docs/age-c2-official-exams-ledger.md.
