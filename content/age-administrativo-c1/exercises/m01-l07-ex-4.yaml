# anchor: boe-a-2013-12887-art-26
- id: m01-l07-q043
  prompt:
    es: "De acuerdo con el artículo 26 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los obsequios de una mayor relevancia institucional que reciban los altos cargos:"
  options:
  - id: a
    text:
      es: "Podrán aceptarse si el alto cargo los declara ante la Oficina de Conflictos de Intereses"
  - id: b
    correct: true
    text:
      es: "Se incorporarán al patrimonio de la Administración Pública correspondiente"
  - id: c
    text:
      es: "Se devolverán en todo caso a la persona o entidad que los entregó"
  - id: d
    text:
      es: "Se enajenarán y su importe se ingresará en el Tesoro Público"
  explanation:
    es: "El artículo 26.2.b) dice que en el caso de obsequios de una mayor relevancia institucional «se procederá a su incorporación al patrimonio de la Administración Pública correspondiente». La ley no prevé aceptarlos con una declaración, devolverlos ni venderlos."
  citation: "art. 26.2.b) Ley 19/2013"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q044
  prompt:
    es: "¿Cuál de las siguientes es una infracción disciplinaria muy grave del título II de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "El abuso de autoridad en el ejercicio del cargo"
  - id: b
    correct: true
    text:
      es: "La prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro"
  - id: c
    text:
      es: "La incorrección con los superiores, compañeros o subordinados"
  - id: d
    text:
      es: "El descuido o negligencia en el ejercicio de sus funciones"
  explanation:
    es: "La letra h) del artículo 29.1 califica de muy grave «la prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro». El abuso de autoridad es infracción grave (art. 29.2.a). La incorrección con superiores, compañeros o subordinados y el descuido o negligencia son infracciones leves (art. 29.3)."
  citation: "art. 29.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q045
  prompt:
    es: "Según el artículo 29 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿cuál de las siguientes conductas de un alto cargo es una infracción grave?"
  options:
  - id: a
    text:
      es: "El incumplimiento del deber de respeto a la Constitución y a los Estatutos de Autonomía en el ejercicio de sus funciones"
  - id: b
    correct: true
    text:
      es: "La intervención en un procedimiento administrativo cuando se dé alguna de las causas de abstención"
  - id: c
    text:
      es: "La incorrección con los superiores, compañeros o subordinados"
  - id: d
    text:
      es: "La prevalencia de la condición de alto cargo para obtener un beneficio indebido"
  explanation:
    es: "La letra b) del artículo 29.2 califica de grave «la intervención en un procedimiento administrativo cuando se dé alguna de las causas de abstención legalmente señaladas». El incumplimiento del deber de respeto a la Constitución y a los Estatutos y la prevalencia de la condición de alto cargo son muy graves (art. 29.1.a) y h). La incorrección con superiores, compañeros o subordinados es leve (art. 29.3.a)."
  citation: "art. 29.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-29
- id: m01-l07-q046
  prompt:
    es: "De acuerdo con el artículo 29 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la comisión de una infracción grave es muy grave cuando el autor hubiera sido sancionado por:"
  options:
  - id: a
    correct: true
    text:
      es: "Dos infracciones graves en el año anterior, contra las que no quepa recurso en vía administrativa"
  - id: b
    text:
      es: "Una infracción grave en el año anterior, contra la que no quepa recurso en vía administrativa"
  - id: c
    text:
      es: "Dos infracciones leves en el año anterior, contra las que no quepa recurso en vía administrativa"
  - id: d
    text:
      es: "Tres infracciones graves a lo largo de los dos años anteriores, aunque quepa recurso administrativo contra ellas"
  explanation:
    es: "La letra l) del artículo 29.1 exige que el autor hubiera sido sancionado «por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa». Una sola infracción grave no basta. Dos leves en el año anterior convierten una leve en grave (art. 29.2.f), no una grave en muy grave. La ley no habla de tres infracciones ni de dos años, y exige que no quepa recurso."
  citation: "art. 29.1.l) Ley 19/2013"
  difficulty: 3
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q047
  prompt:
    es: "De acuerdo con el artículo 30 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el sancionado por infracción muy grave no podrá ser nombrado alto cargo o asimilado durante:"
  options:
  - id: a
    text:
      es: "Un periodo de entre tres y cinco años"
  - id: b
    text:
      es: "Un periodo de entre dos y cuatro años"
  - id: c
    text:
      es: "Un periodo de entre cinco y quince años"
  - id: d
    correct: true
    text:
      es: "Un periodo de entre cinco y diez años"
  explanation:
    es: "El artículo 30.4 dice que los sancionados por infracción muy grave no podrán ser nombrados alto cargo o asimilado «durante un periodo de entre cinco y diez años». Las otras horquillas no aparecen en la ley."
  citation: "art. 30.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-32
- id: m01-l07-q049
  prompt:
    es: "De acuerdo con el artículo 32 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las infracciones de su título II prescriben:"
  options:
  - id: a
    text:
      es: "A los tres años las muy graves, a los dos años las graves y a los seis meses las leves"
  - id: b
    text:
      es: "A los cinco años las muy graves, a los dos años las graves y a los seis meses las leves"
  - id: c
    text:
      es: "A los cuatro años las muy graves, a los dos años las graves y al año las leves"
  - id: d
    correct: true
    text:
      es: "A los cinco años las muy graves, a los tres años las graves y al año las leves"
  explanation:
    es: "El artículo 32.1 fija «cinco años para las infracciones muy graves, tres años para las graves y un año para las leves». Las otras combinaciones cambian uno o varios de esos plazos."
  citation: "art. 32.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-32
- id: m01-l07-q050
  prompt:
    es: "¿En qué plazo prescriben las sanciones impuestas por infracciones graves del título II de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "En el plazo de dos años"
  - id: b
    text:
      es: "En el plazo de cinco años"
  - id: c
    correct: true
    text:
      es: "En el plazo de tres años"
  - id: d
    text:
      es: "En el plazo de un año"
  explanation:
    es: "El artículo 32.2 dice que las sanciones por infracciones muy graves prescriben a los cinco años, las impuestas por infracciones graves «a los tres años» y las de infracciones leves en un año. Cinco años es el plazo de las muy graves y un año el de las leves. Dos años no corresponde a ninguna de las tres categorías del apartado."
  citation: "art. 32.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-33
- id: m01-l07-q051
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Consejo de Transparencia y Buen Gobierno:"
  options:
  - id: a
    text:
      es: "Carece de personalidad jurídica propia y depende jerárquicamente del Ministerio de adscripción"
  - id: b
    text:
      es: "Tiene personalidad jurídica propia, pero actúa bajo la tutela jerárquica del Consejo de Ministros"
  - id: c
    text:
      es: "Es un órgano colegiado de la Presidencia del Gobierno, sin personalidad jurídica propia"
  - id: d
    correct: true
    text:
      es: "Tiene personalidad jurídica propia y plena capacidad de obrar, y actúa con autonomía y plena independencia"
  explanation:
    es: "El artículo 33.2 dice que el Consejo «tiene personalidad jurídica propia y plena capacidad de obrar» y que «actúa con autonomía y plena independencia en el cumplimiento de sus fines». Tiene personalidad jurídica propia. No actúa bajo dependencia ni tutela jerárquica de ningún ministerio ni del Consejo de Ministros."
  citation: "art. 33.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-34
- id: m01-l07-q053
  prompt:
    es: "¿Cuál de los siguientes es uno de los fines del Consejo de Transparencia y Buen Gobierno, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Fiscalizar las cuentas y la gestión económica de todo el sector público"
  - id: b
    text:
      es: "Supervisar el cumplimiento de la normativa general de protección de datos"
  - id: c
    correct: true
    text:
      es: "Garantizar la observancia de las disposiciones de buen gobierno"
  - id: d
    text:
      es: "Evaluar la sostenibilidad de las finanzas de las Administraciones Públicas"
  explanation:
    es: "El artículo 34 enumera como fines del Consejo promover la transparencia, velar por las obligaciones de publicidad, salvaguardar el derecho de acceso y «garantizar la observancia de las disposiciones de buen gobierno». Fiscalizar las cuentas del sector público, supervisar la protección de datos y evaluar la sostenibilidad de las finanzas son funciones de otras instituciones, no fines del Consejo según la ley."
  citation: "art. 34 Ley 19/2013"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q054
  prompt:
    es: "¿Cuál de los siguientes forma parte de la Comisión de Transparencia y Buen Gobierno según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Un representante de la Autoridad Independiente de Responsabilidad Fiscal"
  - id: b
    text:
      es: "Un representante del Consejo General del Poder Judicial"
  - id: c
    text:
      es: "Un representante de la Secretaría de Estado de Presupuestos y Gastos"
  - id: d
    text:
      es: "Un representante del Pleno del Consejo de Estado, a propuesta de su Presidente"
  explanation:
    es: "La letra h) del artículo 36.2 incluye en la Comisión a «un representante de la Autoridad Independiente de Responsabilidad Fiscal». La lista no incluye al Consejo General del Poder Judicial ni al Consejo de Estado. La Secretaría de Estado que la ley menciona es la de Administraciones Públicas, no la de Presupuestos y Gastos."
  citation: "art. 36.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q056
  prompt:
    es: "De acuerdo con el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Presidente del Consejo de Transparencia y Buen Gobierno será nombrado:"
  options:
  - id: a
    correct: true
    text:
      es: "Por un período no renovable de cinco años mediante Real Decreto"
  - id: b
    text:
      es: "Por un período de cinco años, renovable una sola vez, mediante Real Decreto"
  - id: c
    text:
      es: "Por un período no renovable de seis años mediante Real Decreto"
  - id: d
    text:
      es: "Por un período de tres años, renovable, mediante Orden ministerial"
  explanation:
    es: "El artículo 37.1 dice que el Presidente «será nombrado por un período no renovable de cinco años mediante Real Decreto». El mandato no es renovable. No dura seis ni tres años. El nombramiento se hace por Real Decreto, no por Orden ministerial."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q057
  prompt:
    es: "Según el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿cómo refrenda el Congreso de los Diputados el nombramiento del Presidente del Consejo de Transparencia y Buen Gobierno?"
  options:
  - id: a
    text:
      es: "En sesión plenaria, por mayoría de tres quintos, en el plazo de dos meses"
  - id: b
    text:
      es: "A través de la Comisión competente, por mayoría simple de los presentes, en el plazo de un mes natural"
  - id: c
    correct: true
    text:
      es: "A través de la Comisión competente, por mayoría absoluta, en el plazo de un mes natural"
  - id: d
    text:
      es: "A través de la Comisión competente, por mayoría absoluta, en el plazo de quince días"
  explanation:
    es: "El artículo 37.1 dice que el Congreso, «a través de la Comisión competente y por acuerdo adoptado por mayoría absoluta», refrenda el nombramiento «en el plazo de un mes natural» desde la comunicación. No lo hace el Pleno ni por tres quintos. No basta la mayoría simple. El plazo no es de quince días."
  citation: "art. 37.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "mayoría"
  - "plazo"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q058
  prompt:
    es: "De acuerdo con el artículo 37 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el Presidente del Consejo cesa por expiración de su mandato, a petición propia o:"
  options:
  - id: a
    text:
      es: "Por separación acordada por el Congreso de los Diputados por mayoría absoluta"
  - id: b
    correct: true
    text:
      es: "Por separación acordada por el Gobierno, previa instrucción del procedimiento correspondiente"
  - id: c
    text:
      es: "Por separación acordada libremente por el Ministro que propuso su nombramiento"
  - id: d
    text:
      es: "Por separación acordada por la Comisión de Transparencia y Buen Gobierno"
  explanation:
    es: "El artículo 37.2 prevé el cese «por separación acordada por el Gobierno, previa instrucción del correspondiente procedimiento», y solo por las causas que enumera. El Congreso refrenda el nombramiento, pero no separa al Presidente. El Ministro instruye el procedimiento, pero no acuerda la separación, y menos libremente. La Comisión no tiene esta función."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-39
- id: m01-l07-q059
  prompt:
    es: "¿Qué órgano aprueba el Estatuto del Consejo de Transparencia y Buen Gobierno, y mediante qué norma, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Ministros, mediante Real Decreto"
  - id: b
    text:
      es: "El Ministro de Hacienda, mediante Orden ministerial"
  - id: c
    text:
      es: "Las Cortes Generales, mediante ley ordinaria"
  - id: d
    text:
      es: "La Comisión de Transparencia y Buen Gobierno, mediante resolución"
  explanation:
    es: "El artículo 39.2 dice que «el Consejo de Ministros aprobará mediante Real Decreto el Estatuto del Consejo de Transparencia y Buen Gobierno». No lo aprueba un ministro por orden, ni las Cortes por ley, ni la propia Comisión."
  citation: "art. 39.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-da-sexta
- id: m01-l07-q060
  prompt:
    es: "¿Qué órgano tramita el procedimiento de acceso a la información que obre en poder de la Casa de Su Majestad el Rey, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La Secretaría General de la Casa de Su Majestad el Rey"
  - id: b
    text:
      es: "El Consejo de Transparencia y Buen Gobierno"
  - id: c
    text:
      es: "La Subsecretaría del Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  - id: d
    correct: true
    text:
      es: "La Secretaría General de la Presidencia del Gobierno"
  explanation:
    es: "La disposición adicional sexta dice que «la Secretaría General de la Presidencia del Gobierno será el órgano competente para tramitar el procedimiento» de acceso a la información de la Casa de Su Majestad el Rey. No lo tramita la propia Casa ni un ministerio. El Consejo resuelve reclamaciones, pero no tramita estas solicitudes."
  citation: "disposición adicional sexta Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-df-novena
- id: m01-l07-q061
  prompt:
    es: "De acuerdo con la disposición final novena de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el título II, sobre buen gobierno, entró en vigor:"
  options:
  - id: a
    text:
      es: "Al año de su publicación en el Boletín Oficial del Estado"
  - id: b
    text:
      es: "A los veinte días de su publicación en el Boletín Oficial del Estado"
  - id: c
    text:
      es: "A los dos años de su publicación en el Boletín Oficial del Estado"
  - id: d
    correct: true
    text:
      es: "Al día siguiente de su publicación en el Boletín Oficial del Estado"
  explanation:
    es: "La disposición final novena dice que el título II entró en vigor «al día siguiente de su publicación en el Boletín Oficial del Estado». Al año entraron en vigor el título preliminar, el título I y el título III. Dos años es el plazo máximo que tuvieron las Comunidades Autónomas y Entidades Locales para adaptarse. Los veinte días no aparecen en la disposición."
  citation: "disposición final novena Ley 19/2013"
  difficulty: 2
  tags:
  - "fecha"
  - "plazo"
# anchor: boe-a-2013-12887-art-9
- id: m01-l07-q062
  prompt:
    es: "De acuerdo con el artículo 9 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el incumplimiento reiterado de las obligaciones de publicidad activa tendrá la consideración de:"
  options:
  - id: a
    text:
      es: "Infracción muy grave, sancionada con la destitución del responsable"
  - id: b
    correct: true
    text:
      es: "Infracción grave a efectos disciplinarios"
  - id: c
    text:
      es: "Infracción leve, sancionada con una amonestación conforme al título II"
  - id: d
    text:
      es: "Infracción administrativa sancionada con multa por el Consejo de Transparencia"
  explanation:
    es: "El artículo 9.3 dice que el incumplimiento reiterado de la publicidad activa «tendrá la consideración de infracción grave a los efectos de aplicación a sus responsables del régimen disciplinario». No es muy grave, así que no lleva a la destitución. Tampoco es leve: la amonestación es la sanción de las infracciones leves del título II (art. 30.1), que es otro régimen. La ley no da al Consejo una potestad de multa."
  citation: "art. 9.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-36
- id: m01-l07-q063
  prompt:
    es: "Según el artículo 36 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué miembros de la Comisión de Transparencia y Buen Gobierno tienen derecho a remuneración?"
  options:
  - id: a
    text:
      es: "Todos sus miembros, en la cuantía que fije el Estatuto del Consejo"
  - id: b
    text:
      es: "Los vocales que no sean Diputados ni Senadores, por su dedicación exclusiva"
  - id: c
    correct: true
    text:
      es: "Únicamente el Presidente"
  - id: d
    text:
      es: "El Presidente y los representantes del Tribunal de Cuentas y del Defensor del Pueblo"
  explanation:
    es: "El artículo 36.3 dice que ser miembro de la Comisión «no exigirá dedicación exclusiva ni dará derecho a remuneración con excepción de lo previsto en el artículo siguiente». El artículo siguiente fija las retribuciones del Presidente del Consejo (art. 37.3), que es el único retribuido. Los demás miembros no cobran, sea cual sea la institución que los propone, y la ley no les exige dedicación exclusiva."
  citation: "art. 36.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "composición"
  - "excepción"
# anchor: boe-a-2013-12887-art-37
- id: m01-l07-q064
  prompt:
    es: "¿Cuál de las siguientes es causa de separación del Presidente del Consejo de Transparencia y Buen Gobierno, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La pérdida de la confianza del Gobierno que propuso su nombramiento"
  - id: b
    text:
      es: "La condena por cualquier delito, aunque se haya cometido por imprudencia"
  - id: c
    text:
      es: "La renovación de las Cortes Generales tras la celebración de elecciones"
  - id: d
    correct: true
    text:
      es: "La incompatibilidad sobrevenida"
  explanation:
    es: "El artículo 37.2 solo permite la separación por «incumplimiento grave de sus obligaciones, incapacidad permanente para el ejercicio de su función, incompatibilidad sobrevenida o condena por delito doloso». La pérdida de confianza no está en la lista: el mandato es de cinco años no renovables y no depende del Gobierno. La condena tiene que ser por delito doloso, no por uno imprudente. La renovación de las Cortes no es causa de cese."
  citation: "art. 37.2 Ley 19/2013"
  difficulty: 3
