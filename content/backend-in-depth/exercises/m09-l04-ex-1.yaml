- id: m09-l04-q15
  prompt:
    en: A Kafka producer sends a compressed batch of messages. How does Kafka handle that batch in the broker's
      log and on the way to the consumer?
  options:
  - id: a
    text:
      en: The broker stores the messages uncompressed after validating them
  - id: b
    correct: true
    text:
      en: The batch stays compressed in the log and is also sent to the consumer in compressed form
  - id: c
    text:
      en: The broker never decompresses the batch, so it cannot validate the record count
  - id: d
    text:
      en: The broker compresses each message separately when it appends the batch to the log
  explanation:
    en: The batch will remain compressed in the log and it will also be transmitted to the consumer in compressed
      form. Storing the messages uncompressed is wrong because the batch is written to disk in compressed form.
      Never decompressing the batch is wrong because the broker decompresses the batch in order to validate it.
      Compressing each message separately is wrong because a batch of messages is grouped together, compressed,
      and sent to the server in this form.
  citation: kafka-design#end-to-end-batch-compression
  extract:
    en: The batch will remain compressed in the log and it will also be transmitted to the consumer in compressed
      form.
- id: m09-l04-q16
  prompt:
    en: In UUIDv7 as defined by RFC 9562, which value occupies the most significant 48 bits of the identifier?
  options:
  - id: a
    correct: true
    text:
      en: A Unix Epoch timestamp in milliseconds
  - id: b
    text:
      en: A 100-nanosecond Gregorian Epoch timestamp
  - id: c
    text:
      en: The Media Access Control (MAC) address of the generating node
  - id: d
    text:
      en: Random bits, with the timestamp in the least significant bits
  explanation:
    en: UUIDv7 allocates a Unix timestamp in milliseconds in the most significant 48 bits and fills the remaining
      bits with random bits. A 100-nanosecond Gregorian Epoch timestamp is wrong because that epoch is used in UUIDv1
      timestamps. A MAC address is wrong because UUIDv1 uses it in the node field. Putting the timestamp in the
      least significant bits is wrong because `unix_ts_ms` occupies bits 0 through 47.
  citation: rfc9562#section-5.7
  extract:
    en: UUIDv7 values are created by allocating a Unix timestamp in milliseconds in the most significant 48 bits
      and filling the remaining 74 bits, excluding the required version and variant bits, with random bits for each
      new UUIDv7 generated to provide uniqueness
- id: m09-l04-q17
  prompt:
    en: An application needs UUIDs whose timestamp comes from a custom Epoch instead of the Unix Epoch. Which UUID
      version does RFC 9562 say MUST be used?
  options:
  - id: a
    text:
      en: UUIDv7
  - id: b
    text:
      en: UUIDv6
  - id: c
    correct: true
    text:
      en: UUIDv8
  - id: d
    text:
      en: UUIDv1
  explanation:
    en: If other timestamp sources or a custom timestamp Epoch are required, UUIDv8 MUST be used. UUIDv7 is wrong
      because it features a millisecond level of precision by default within the Unix Epoch. UUIDv6 is wrong because
      UUIDv1 and UUIDv6 both utilize a Gregorian Epoch timestamp. UUIDv1 is wrong because its timestamps use the
      100-nanosecond Gregorian Epoch.
  citation: rfc9562#section-6.1
  extract:
    en: If other timestamp sources or a custom timestamp Epoch are required, UUIDv8 MUST be used.
- id: m09-l04-q18
  prompt:
    en: Which formula does Redis Cluster use to map a key to a hash slot, leaving aside the hash tag exception?
  options:
  - id: a
    text:
      en: '`CRC16(key) mod 65536`'
  - id: b
    correct: true
    text:
      en: '`CRC16(key) mod 16384`'
  - id: c
    text:
      en: '`CRC32(key) mod 16384`'
  - id: d
    text:
      en: '`SHA1(key) mod 16384`'
  explanation:
    en: The base algorithm maps a key to a hash slot with `HASH_SLOT = CRC16(key) mod 16384`. The modulo 65536 variant
      is wrong because 14 out of 16 CRC16 output bits are used, which is why the formula has a modulo 16384 operation.
      The formula uses `CRC16`, which rules out `CRC32(key) mod 16384` and `SHA1(key) mod 16384`.
  citation: redis-cluster-spec#key-distribution-model
  extract:
    en: 'The base algorithm used to map keys to hash slots is the following (read the next paragraph for the hash
      tag exception to this rule): HASH_SLOT = CRC16(key) mod 16384'
