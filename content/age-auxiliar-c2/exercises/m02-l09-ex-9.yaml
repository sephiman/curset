- id: m02-l09-q260
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, ¿cuál de los siguientes valores de error evalúa la función SI.ERROR?"
  options:
  - id: a
    correct: true
    text:
      es: "#¿NOMBRE?"
  - id: b
    text:
      es: "#¡TIEMPO!"
  - id: c
    text:
      es: "#####"
  - id: d
    text:
      es: "#¡ARG!"
  explanation:
    es: "La página lista #N/A, #¡VALOR!, #¡REF!, #¡DIV/0!, #¡NUM!, #¿NOMBRE? y #¡NULO!. «#####»: la lista de la página no incluye #####, que indica una columna estrecha. «#¡TIEMPO!»: ese error no figura en la lista de la página. «#¡ARG!»: ese error no figura en la lista de la página."
