# anchor: boe-a-2003-23186-art-73
- id: m03-l10-q0034
  prompt:
    es: "Según el artículo 73.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se compensan de oficio durante el plazo de ingreso en período voluntario las cantidades de un mismo procedimiento de comprobación limitada o inspección, la extinción se produce:"
  options:
  - id: a
    text:
      es: "En el momento de inicio del período ejecutivo de la cantidad a ingresar."
  - id: b
    correct: true
    text:
      es: "En el momento de concurrencia de las deudas y los créditos, en los términos establecidos reglamentariamente."
  - id: c
    text:
      es: "En el momento de notificación de la liquidación que resulta del procedimiento."
  - id: d
    text:
      es: "Cuando se produce el ingreso o la devolución de la cantidad diferencial resultante."
  explanation:
    es: "Para las compensaciones durante el plazo voluntario, el artículo 73.3 fija la extinción en el momento de concurrencia de deudas y créditos, en los términos del reglamento. El inicio del ejecutivo es la regla de la compensación de oficio de deudas en período ejecutivo. La notificación de la liquidación y el pago de la diferencia no son el momento que señala el precepto."
  citation: "art. 73.3 LGT"
  difficulty: 3
  tags:
  - "compensación de oficio"
  - "extinción"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0035
  prompt:
    es: "Conforme al artículo 59.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el acuerdo de compensación se notifica al interesado y sirve como:"
  options:
  - id: a
    text:
      es: "Título para reclamar el abono inmediato del crédito reconocido."
  - id: b
    text:
      es: "Garantía del pago de la parte de deuda que no se ha compensado."
  - id: c
    text:
      es: "Requerimiento de ingreso de la diferencia entre deuda y crédito."
  - id: d
    correct: true
    text:
      es: "Justificante de la extinción de la deuda."
  explanation:
    es: "El acuerdo sirve como justificante de la extinción de la deuda. No es un título para cobrar el crédito, ni una garantía de la deuda restante, ni un requerimiento de ingreso."
  citation: "art. 59.1 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "efectos"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0036
  prompt:
    es: "De acuerdo con el artículo 59.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, adoptado el acuerdo de compensación, se declaran extinguidas las deudas y los créditos:"
  options:
  - id: a
    text:
      es: "En su totalidad, aunque el crédito sea inferior a la deuda."
  - id: b
    text:
      es: "Solo las deudas, quedando los créditos pendientes de abono."
  - id: c
    text:
      es: "En la parte que el interesado haya señalado en su solicitud."
  - id: d
    correct: true
    text:
      es: "En la cantidad concurrente."
  explanation:
    es: "Se extinguen deudas y créditos hasta la cantidad concurrente, es decir, hasta el menor de los dos importes. No se extingue todo si el crédito es inferior, no se extinguen solo las deudas y la cuantía no depende de lo que el interesado señale."
  citation: "art. 59.1 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "efectos"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0037
  prompt:
    es: "Si el crédito reconocido es inferior a la deuda compensada, señale la respuesta CORRECTA sobre la parte de deuda que excede del crédito según el artículo 59.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Queda condonada de oficio por la cuantía en que la deuda excede del crédito ofrecido."
  - id: b
    text:
      es: "Se aplaza automáticamente hasta que se reconozcan nuevos créditos a favor del obligado."
  - id: c
    text:
      es: "Deja sin efecto la compensación parcial y se reclama la deuda por su importe íntegro."
  - id: d
    correct: true
    text:
      es: "Sigue el régimen ordinario: se inicia el apremio si no se ingresa a su vencimiento, o continúa si ya se había iniciado."
  explanation:
    es: "El exceso de deuda sigue el régimen ordinario, con apremio si no se paga a su vencimiento. La condonación solo cabe en virtud de ley (artículo 75 de la Ley General Tributaria), el aplazamiento no es automático y la compensación de la parte concurrente se mantiene, de modo que la deuda restante no se reclama por el importe íntegro."
  citation: "art. 59.2.a RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "efectos"
  - "crédito inferior"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0038
  prompt:
    es: "Según el artículo 59.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué cabe hacer con los créditos que se reconozcan después a favor del obligado cuando quedó parte de la deuda sin compensar?"
  options:
  - id: a
    text:
      es: "Ninguna compensación más, porque solo se admite un acuerdo de compensación por deuda."
  - id: b
    text:
      es: "Abonarlos directamente al obligado, sin compensarlos con la deuda pendiente."
  - id: c
    text:
      es: "Compensarlos solo si el obligado presenta una nueva solicitud en período voluntario."
  - id: d
    correct: true
    text:
      es: "Practicar compensaciones sucesivas con ellos sobre la deuda que queda."
  explanation:
    es: "El artículo 59.2.a admite compensaciones sucesivas con los créditos que se reconozcan después. No limita la compensación a un solo acuerdo, no impone el abono directo y no condiciona las siguientes a una nueva solicitud en voluntario."
  citation: "art. 59.2.a RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "compensaciones sucesivas"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0039
  prompt:
    es: "Transportes Beltrán, S.L. tiene una deuda tributaria de 1.500 euros y se le reconoce un crédito de 900 euros que se compensa. El acuerdo declara la compensación. Según el artículo 59.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué ocurre con la deuda?"
  options:
  - id: a
    text:
      es: "Se extinguen los 1.500 euros, porque el acuerdo declara extinguida toda la deuda."
  - id: b
    correct: true
    text:
      es: "Se extinguen 900 euros y los 600 restantes siguen el régimen ordinario, con apremio si no se ingresan a su vencimiento."
  - id: c
    text:
      es: "Se extinguen 900 euros y los 600 restantes quedan en suspenso hasta que se reconozca otro crédito."
  - id: d
    text:
      es: "No se extingue ninguna cantidad, porque el crédito es inferior a la deuda."
  explanation:
    es: "La compensación opera hasta la cantidad concurrente, 900 euros. Los 600 euros restantes siguen el régimen ordinario según el artículo 59.2.a, con apremio si no se ingresan a su vencimiento. El acuerdo no extingue toda la deuda ni deja el resto en suspenso, y la compensación parcial es posible aunque el crédito sea inferior."
  citation: "art. 59.2.a RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "cómputo"
  - "crédito inferior"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0040
  prompt:
    es: "A Panadería Ortega, S.L. se le declara la compensación de una deuda tributaria de 700 euros con un crédito reconocido de 1.100 euros. Conforme al artículo 59.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué ocurre con la diferencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Se abonan 400 euros a la sociedad, que es la diferencia entre el crédito y la deuda."
  - id: b
    text:
      es: "Se abonan 1.100 euros a la sociedad y la deuda se ingresa por separado."
  - id: c
    text:
      es: "Se mantienen 400 euros pendientes hasta que la sociedad solicite expresamente su abono."
  - id: d
    text:
      es: "Se pierden 400 euros del crédito, porque solo se compensa el importe de la deuda."
  explanation:
    es: "Si el crédito supera la deuda, declarada la compensación se abona la diferencia al interesado: 1.100 menos 700, 400 euros. No se abona el crédito entero porque 700 euros ya se han compensado. No hace falta pedir el abono, y el exceso del crédito no se pierde."
  citation: "art. 59.3 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "cómputo"
  - "crédito superior"
# anchor: boe-a-2003-23186-art-71
- id: m03-l10-q0041
  prompt:
    es: "De acuerdo con el artículo 71.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios podrán solicitar la compensación de los créditos y las deudas tributarias de las que sean titulares mediante:"
  options:
  - id: a
    text:
      es: "Un sistema de pagos fraccionados, en los términos que determine la ley de cada tributo."
  - id: b
    correct: true
    text:
      es: "Un sistema de cuenta corriente, en los términos que reglamentariamente se determinen."
  - id: c
    text:
      es: "Un registro de compensaciones, que gestiona el órgano de recaudación competente de oficio."
  - id: d
    text:
      es: "Un sistema de ingresos anticipados, en los términos que fije el Departamento de Recaudación."
  explanation:
    es: "El artículo 71.3 prevé un sistema de cuenta corriente, que se desarrolla reglamentariamente. Los pagos fraccionados, el registro de compensaciones y los ingresos anticipados no aparecen en el precepto como cauce para compensar créditos y deudas propios."
  citation: "art. 71.3 LGT"
  difficulty: 1
  tags:
  - "cuenta corriente tributaria"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0044
  prompt:
    es: "Sobre las deudas del Impuesto sobre el Valor Añadido en las operaciones de importación, señale la respuesta CORRECTA según el artículo 139.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio:"
  options:
  - id: a
    text:
      es: "Pueden anotarse siempre que se hayan presentado dentro de plazo."
  - id: b
    text:
      es: "No pueden anotarse en ningún caso, ni siquiera si se ha optado por el diferimiento del ingreso."
  - id: c
    correct: true
    text:
      es: "No pueden anotarse, excepto cuando se haya optado por el diferimiento del ingreso de las cuotas liquidadas por la Aduana."
  - id: d
    text:
      es: "Pueden anotarse, excepto cuando se haya optado por el diferimiento del ingreso de las cuotas liquidadas por la Aduana en cada operación."
  explanation:
    es: "Las deudas del IVA de importación no se anotan, salvo que se haya optado por el diferimiento del ingreso de las cuotas liquidadas por la Aduana. No basta presentarlas en plazo. La excepción existe, así que no se excluyen sin más. Y invertirla, permitiendo la anotación salvo en caso de diferimiento, contradice el texto."
  citation: "art. 139.4.d RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "importación"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0045
  prompt:
    es: "Respecto de las devoluciones que pueden anotarse en la cuenta corriente tributaria, señale la respuesta CORRECTA según el artículo 139 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio:"
  options:
  - id: a
    text:
      es: "Pueden anotarse las devoluciones reconocidas en los procedimientos especiales de revisión, si el obligado lo solicita."
  - id: b
    text:
      es: "No pueden anotarse las devoluciones derivadas de la normativa del tributo acordadas durante el período de aplicación del sistema de cuenta corriente."
  - id: c
    correct: true
    text:
      es: "No pueden anotarse las devoluciones reconocidas en los procedimientos especiales de revisión previstos en la Ley General Tributaria."
  - id: d
    text:
      es: "Solo pueden anotarse las devoluciones del Impuesto sobre el Valor Añadido, con exclusión de las de los demás impuestos."
  explanation:
    es: "El artículo 139.4.c excluye las devoluciones de los procedimientos especiales de revisión y de la resolución de recursos y reclamaciones económico-administrativas, sin excepción por petición del obligado. Las devoluciones derivadas de la normativa del tributo sí se anotan según el apartado 2, y no solo las del Impuesto sobre el Valor Añadido, también las de los otros impuestos que enumera."
  citation: "art. 139.4.c RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "devoluciones"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0046
  prompt:
    es: "¿Cuál de los siguientes impuestos NO da lugar a la anotación de créditos por devoluciones tributarias en la cuenta corriente tributaria, según el artículo 139.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Impuesto sobre la Renta de las Personas Físicas."
  - id: b
    text:
      es: "Impuesto sobre Sociedades."
  - id: c
    correct: true
    text:
      es: "Impuesto sobre Sucesiones y Donaciones."
  - id: d
    text:
      es: "Impuesto sobre el Valor Añadido."
  explanation:
    es: "El artículo 139.2 admite la anotación de devoluciones del Impuesto sobre la Renta de las Personas Físicas, del Impuesto sobre Sociedades, del Impuesto sobre la Renta de no Residentes con establecimiento permanente y del Impuesto sobre el Valor Añadido. El Impuesto sobre Sucesiones y Donaciones no figura en esa relación."
  citation: "art. 139.2 RGAT"
  difficulty: 1
  tags:
  - "cuenta corriente tributaria"
  - "devoluciones"
  - "tributos"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0047
  prompt:
    es: "Según el artículo 139.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, se anotan con signo contrario los importes de las deudas tributarias que resulten de autoliquidaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuyo plazo de declaración o ingreso finalice durante el período en que resulte aplicable el sistema, presentadas por el obligado tributario."
  - id: b
    text:
      es: "Cuyo plazo de declaración o ingreso haya finalizado antes de la inclusión del obligado en el sistema."
  - id: c
    text:
      es: "Practicadas por la Administración tributaria tras comprobar los datos declarados por el obligado."
  - id: d
    text:
      es: "Cuyo plazo de ingreso finalice en el año natural siguiente a aquel en que concluya la aplicación del sistema."
  explanation:
    es: "Las deudas se anotan con signo contrario cuando el plazo de declaración o ingreso de la autoliquidación finaliza mientras el sistema es aplicable y es el obligado quien la presenta. Las autoliquidaciones cuyo plazo acabó antes de la inclusión, las liquidaciones que practica la Administración y las de plazo posterior al fin del sistema quedan fuera."
  citation: "art. 139.3 RGAT"
  difficulty: 2
  tags:
  - "cuenta corriente tributaria"
  - "anotación"
# anchor: boe-a-2007-15984-art-139
- id: m03-l10-q0048
  prompt:
    es: "De acuerdo con el artículo 139.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la aplicación del sistema de cuenta corriente es incompatible, respecto de los créditos y débitos acogidos a él, con:"
  options:
  - id: a
    text:
      es: "El aplazamiento de las deudas tributarias que no estén acogidas al sistema."
  - id: b
    correct: true
    text:
      es: "El procedimiento de compensación regulado en el Reglamento General de Recaudación."
  - id: c
    text:
      es: "La domiciliación bancaria del pago de las autoliquidaciones del obligado."
  - id: d
    text:
      es: "El procedimiento de deducción sobre transferencias del Estado a otras entidades de derecho público."
  explanation:
    es: "La cuenta corriente es incompatible con el procedimiento de compensación del Reglamento de Recaudación, durante la duración de la cuenta y para los créditos y débitos acogidos al sistema. El aplazamiento de deudas ajenas al sistema y la domiciliación del pago no se ven afectados, y la deducción sobre transferencias afecta a entidades públicas, no a los obligados que usan la cuenta."
  citation: "art. 139.5 RGAT"
  difficulty: 2
  tags:
  - "cuenta corriente tributaria"
  - "incompatibilidad"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0049
  prompt:
    es: "¿Cuál de las siguientes circunstancias pone fin a la aplicación del sistema de cuenta corriente en materia tributaria, según el artículo 143.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Que transcurran tres años desde la inclusión del obligado en el sistema."
  - id: b
    text:
      es: "Que el obligado tributario presente una autoliquidación con resultado a devolver."
  - id: c
    correct: true
    text:
      es: "Que el obligado tributario renuncie expresamente a su aplicación."
  - id: d
    text:
      es: "Que la Administración notifique al obligado un requerimiento de información tributaria."
  explanation:
    es: "La aplicación continúa mientras no concurra la renuncia expresa del obligado o la revocación por la Administración. El sistema no tiene un plazo de tres años, una autoliquidación a devolver se anota en la cuenta y un requerimiento de información no figura entre las causas que cierran el sistema."
  citation: "art. 143.1 RGAT"
  difficulty: 1
  tags:
  - "cuenta corriente tributaria"
  - "duración"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0050
  prompt:
    es: "Sobre la incapacitación o muerte del obligado tributario incluido en el sistema de cuenta corriente, señale la respuesta CORRECTA según el artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio:"
  options:
  - id: a
    correct: true
    text:
      es: "La incapacitación no motiva la revocación si continúa el ejercicio de las actividades por medio de representante."
  - id: b
    text:
      es: "La incapacitación motiva la revocación en todo caso, aunque el ejercicio de las actividades continúe por medio de representante."
  - id: c
    text:
      es: "La muerte no motiva la revocación si los herederos continúan el ejercicio de las actividades del obligado."
  - id: d
    text:
      es: "La incapacitación solo motiva la revocación cuando el representante no presenta las autoliquidaciones en plazo."
  explanation:
    es: "El artículo 143.3.a salva la incapacitación si las actividades continúan por medio de representante. Esa salvedad no cubre la muerte ni otras situaciones: la muerte revoca el acuerdo sin más. La revocación por incapacitación no depende de que el representante presente las autoliquidaciones en plazo."
  citation: "art. 143.3 RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0051
  prompt:
    es: "Conforme al artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el acuerdo de inclusión en el sistema de cuenta corriente se revoca por la iniciación contra el obligado tributario de:"
  options:
  - id: a
    text:
      es: "Un procedimiento de comprobación limitada sobre sus autoliquidaciones."
  - id: b
    correct: true
    text:
      es: "Un procedimiento concursal."
  - id: c
    text:
      es: "Un procedimiento de inspección de carácter general."
  - id: d
    text:
      es: "Un procedimiento sancionador por infracción grave."
  explanation:
    es: "Es causa de revocación la iniciación de un procedimiento concursal contra el obligado. La comprobación limitada, la inspección y el procedimiento sancionador no figuran entre las causas del artículo 143.3. El sancionador solo interesa cuando la sanción recae en solicitudes de devolución o autoliquidaciones a compensar improcedentes."
  citation: "art. 143.3 RGAT"
  difficulty: 1
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0052
  prompt:
    es: "De acuerdo con el artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, se revoca el acuerdo de inclusión en la cuenta corriente por dejar de cumplir los requisitos del artículo 138 durante:"
  options:
  - id: a
    correct: true
    text:
      es: "Cada año natural en que se aplique el sistema."
  - id: b
    text:
      es: "Cualquier trimestre natural en que se aplique el sistema."
  - id: c
    text:
      es: "El primer año natural desde la inclusión en el sistema."
  - id: d
    text:
      es: "Un período de tres años consecutivos de aplicación del sistema."
  explanation:
    es: "La causa de revocación es dejar de cumplir los requisitos durante cada año natural de aplicación del sistema. No se mide por trimestres, ni solo en el primer año, ni por períodos de tres años."
  citation: "art. 143.3 RGAT"
  difficulty: 2
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
  - "requisitos"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0053
  prompt:
    es: "¿Cuál de las siguientes circunstancias NO es causa de revocación del acuerdo de inclusión en el sistema de cuenta corriente, según el artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "La muerte del obligado tributario incluido en el sistema."
  - id: b
    correct: true
    text:
      es: "La solicitud de una devolución derivada de la normativa del tributo que resulte procedente y no haya sido sancionada."
  - id: c
    text:
      es: "La iniciación de un procedimiento concursal contra el obligado tributario."
  - id: d
    text:
      es: "La falta de pago en período voluntario de las liquidaciones de los saldos de la cuenta."
  explanation:
    es: "El artículo 143.3.e sanciona con la revocación las solicitudes de devolución o autoliquidaciones a compensar improcedentes que hayan sido objeto de sanción. Una devolución procedente y no sancionada no es causa. La muerte, el procedimiento concursal y la falta de pago en voluntario de las liquidaciones de los saldos sí lo son."
  citation: "art. 143.3 RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0054
  prompt:
    es: "Comercial Navarro, S.L. está incluida en el sistema de cuenta corriente tributaria. En 2027 presenta una solicitud de devolución del Impuesto sobre el Valor Añadido que resulta totalmente improcedente y se le impone una sanción por ella, que recurre y todavía no es firme en vía administrativa. Conforme al artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué consecuencia tiene sobre su inclusión en el sistema?"
  options:
  - id: a
    text:
      es: "No procede revocar el acuerdo de inclusión hasta que la sanción adquiera firmeza en vía administrativa."
  - id: b
    text:
      es: "Procede suspender la inclusión durante un año natural, pero no revocar el acuerdo de inclusión."
  - id: c
    text:
      es: "Procede revocar el acuerdo solo si la sociedad no ingresa la sanción en el período voluntario."
  - id: d
    correct: true
    text:
      es: "Procede revocar el acuerdo de inclusión, aunque la sanción no sea firme en vía administrativa."
  explanation:
    es: "El artículo 143.3.e revoca el acuerdo por presentar solicitudes de devolución improcedentes que hayan sido sancionadas, aunque la sanción no sea firme. La revocación no espera a la firmeza ni se sustituye por una suspensión que el reglamento no prevé, y tampoco depende del ingreso de la sanción."
  citation: "art. 143.3 RGAT"
  difficulty: 3
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0073
  prompt:
    es: "Conforme al artículo 56.7 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, transcurrido el plazo para notificar la resolución de la compensación sin que se haya notificado, los interesados podrán considerar desestimada la solicitud a los efectos de:"
  options:
  - id: a
    text:
      es: "Interponer el recurso, sin que quepa ya esperar la resolución expresa."
  - id: b
    text:
      es: "Entender estimada la solicitud y extinguida la deuda desde su presentación."
  - id: c
    text:
      es: "Solicitar que se declare la caducidad y se archive el procedimiento sin más trámite."
  - id: d
    correct: true
    text:
      es: "Interponer el recurso correspondiente o esperar la resolución expresa."
  explanation:
    es: "Pasados los seis meses sin notificación, el interesado puede considerar desestimada la solicitud a efectos de recurrir o esperar la resolución expresa, lo que tiene a su elección. No está obligado a recurrir, el silencio no es estimatorio y el artículo no habla de caducidad ni de archivo."
  citation: "art. 56.7 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "silencio"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0101
  prompt:
    es: "Si el crédito ofrecido en compensación deriva de una devolución tributaria, ¿qué se acompaña a la solicitud en lugar de la certificación de la oficina de contabilidad, según el artículo 56.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Copia del modelo oficial de la autoliquidación que originó la devolución."
  - id: b
    correct: true
    text:
      es: "Copia, en su caso, del acto, resolución o sentencia que reconozca la devolución."
  - id: c
    text:
      es: "Certificado de la Intervención General sobre la existencia de crédito presupuestario."
  - id: d
    text:
      es: "Declaración del solicitante sobre el importe de la devolución pendiente de cobro."
  explanation:
    es: "Cuando el crédito deriva de una devolución tributaria no se pide la certificación contable, sino, en su caso, copia del acto, resolución o sentencia que la reconozca. El modelo de la autoliquidación se exige para la deuda, no para el crédito. La Intervención General y la simple declaración del solicitante no son documentos que prevea el artículo."
  citation: "art. 56.2 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "documentos"
  - "devolución tributaria"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0102
  prompt:
    es: "¿A quién debe dirigir el obligado al pago que inste la compensación la correspondiente solicitud, según el artículo 56.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "Al órgano competente para su tramitación."
  - id: b
    text:
      es: "Al órgano gestor del gasto que reconoció el crédito ofrecido."
  - id: c
    text:
      es: "Al Departamento de Recaudación de la Agencia Estatal de Administración Tributaria."
  - id: d
    text:
      es: "A la oficina de contabilidad del organismo que debe abonar el crédito."
  explanation:
    es: "La solicitud se dirige al órgano competente para su tramitación. El órgano gestor del gasto y la oficina de contabilidad intervienen por el crédito, que se certifica, pero no tramitan la compensación. El Departamento de Recaudación no es el destinatario que fija el precepto."
  citation: "art. 56.1 RGR"
  difficulty: 1
  tags:
  - "compensación"
  - "solicitud"
  - "órgano"
# anchor: boe-a-2005-14803-art-56
- id: m03-l10-q0103
  prompt:
    es: "Si se deniega una compensación solicitada en período ejecutivo, ¿qué debe hacerse según el artículo 56.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Abrir un plazo de ingreso en período voluntario con la notificación de la denegación."
  - id: b
    text:
      es: "Suspender el procedimiento de apremio hasta que se resuelva el recurso que se interponga."
  - id: c
    correct: true
    text:
      es: "Iniciar el procedimiento de apremio, de no haberse iniciado con anterioridad."
  - id: d
    text:
      es: "Archivar la deuda hasta que el obligado presente una nueva solicitud de compensación."
  explanation:
    es: "En período ejecutivo la denegación obliga a iniciar el apremio si no se había iniciado. El plazo de ingreso del artículo 62.2 se abre solo cuando la solicitud se presentó en período voluntario. El precepto no suspende el apremio por recurso ni archiva la deuda."
  citation: "art. 56.5 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "denegación"
  - "apremio"
# anchor: boe-a-2005-14803-art-59
- id: m03-l10-q0104
  prompt:
    es: "Cuando el crédito reconocido es superior a la deuda y se declara la compensación, ¿qué ocurre con la diferencia según el artículo 59.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Se mantiene como crédito a favor del obligado para futuras compensaciones de oficio."
  - id: b
    text:
      es: "Se destina a pagar los recargos y las costas de otras deudas del obligado."
  - id: c
    correct: true
    text:
      es: "Se abona al interesado la diferencia entre el crédito y la deuda."
  - id: d
    text:
      es: "Se ingresa en el Tesoro cuando el obligado no la reclama en un plazo de un año."
  explanation:
    es: "Si el crédito supera la deuda, declarada la compensación se abona la diferencia al interesado. El precepto no la deja como crédito para compensaciones futuras, ni la destina a otras deudas, ni la ingresa en el Tesoro por falta de reclamación."
  citation: "art. 59.3 RGR"
  difficulty: 2
  tags:
  - "compensación"
  - "crédito superior"
# anchor: boe-a-2007-15984-art-143
- id: m03-l10-q0106
  prompt:
    es: "¿Qué falta de pago en período voluntario determina la revocación del acuerdo de inclusión en el sistema de cuenta corriente, según el artículo 143.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "La de las cuotas de la Seguridad Social del obligado y de sus trabajadores."
  - id: b
    text:
      es: "La de los intereses de demora de las devoluciones anotadas en la cuenta."
  - id: c
    correct: true
    text:
      es: "La de las liquidaciones de los saldos de la cuenta."
  - id: d
    text:
      es: "La de las sanciones tributarias impuestas al obligado durante el año natural."
  explanation:
    es: "La causa es la falta de pago en período voluntario de las liquidaciones de los saldos de la cuenta. Las cuotas de la Seguridad Social, los intereses de las devoluciones anotadas y las sanciones no son lo que el precepto enumera."
  citation: "art. 143.3 RGAT"
  difficulty: 1
  tags:
  - "cuenta corriente tributaria"
  - "revocación"
