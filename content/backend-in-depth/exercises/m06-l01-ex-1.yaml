- id: m06-l01-q01
  prompt:
    en: In PostgreSQL 18, MVCC gives each SQL statement a view of the data. What does a statement see under this
      multiversion model?
  options:
  - id: a
    text:
      en: The latest row versions, with a shared lock held on each row until the statement ends
  - id: b
    correct: true
    text:
      en: A snapshot of the data as it was some time ago, regardless of its current state
  - id: c
    text:
      en: The current state of the data, including changes that concurrent transactions have not committed yet
  - id: d
    text:
      en: Only the rows that no concurrent transaction is updating, because blocked rows are skipped
  explanation:
    en: Each statement sees a snapshot as it was some time ago. Seeing the latest versions under shared locks is
      the locking approach that MVCC eschews. Uncommitted changes are excluded because MVCC prevents statements
      from viewing inconsistent data produced by concurrent transactions. Skipping rows under update is wrong because
      reading does not block on writers and sees the snapshot version.
  citation: pg-mvcc-intro#MVCC-INTRO
  extract:
    en: as it was some time ago, regardless of the current state of the underlying data
- id: m06-l01-q04
