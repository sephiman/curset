# anchor: boe-a-2006-20764-art-48
- id: m03-l16-q0008
  prompt:
    es: "Según el artículo 48 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la base imponible general incluye el saldo de integrar y compensar entre sí los rendimientos y las imputaciones de renta del artículo 45 en cada período impositivo:"
  options:
  - id: a
    text:
      es: "con el límite del 25 por ciento del saldo positivo."
  - id: b
    text:
      es: "con el límite del 50 por ciento del saldo positivo."
  - id: c
    correct: true
    text:
      es: "sin limitación alguna."
  - id: d
    text:
      es: "solo hasta el importe de las ganancias patrimoniales del período."
  explanation:
    es: "Los rendimientos y las imputaciones de renta se integran y compensan entre sí sin limitación alguna (art. 48.a). El límite del 25 por ciento es el de la compensación de un saldo negativo de ganancias y pérdidas patrimoniales con ese saldo positivo, un paso posterior. El 50 por ciento no aparece en el artículo, y las ganancias patrimoniales no fijan tope a los rendimientos."
  citation: "art. 48 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-48
- id: m03-l16-q0009
  prompt:
    es: "De acuerdo con el artículo 48 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si el saldo de las ganancias y pérdidas patrimoniales de la base imponible general es negativo, se compensa con el saldo positivo de los rendimientos e imputaciones del mismo período con el límite del:"
  options:
  - id: a
    text:
      es: "50 por ciento de dicho saldo positivo."
  - id: b
    correct: true
    text:
      es: "25 por ciento de dicho saldo positivo."
  - id: c
    text:
      es: "30 por ciento de dicho saldo positivo."
  - id: d
    text:
      es: "10 por ciento de dicho saldo positivo."
  explanation:
    es: "El límite del artículo 48 es el 25 por ciento del saldo positivo de rendimientos e imputaciones. El 30 por ciento es el límite de las reducciones por previsión social del artículo 52, y el 50 y el 10 por ciento no figuran en ninguno de los dos preceptos."
  citation: "art. 48 LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-48
- id: m03-l16-q0010
  prompt:
    es: "Conforme al artículo 48 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si tras compensar el saldo negativo de ganancias y pérdidas patrimoniales con los rendimientos del mismo período quedase todavía saldo negativo, este se compensa:"
  options:
  - id: a
    correct: true
    text:
      es: "en los cuatro años siguientes, en el mismo orden."
  - id: b
    text:
      es: "en los cinco años siguientes, en el mismo orden."
  - id: c
    text:
      es: "en los dos años siguientes, sin límite de cuantía."
  - id: d
    text:
      es: "únicamente en el período impositivo siguiente."
  explanation:
    es: "El saldo negativo que queda se compensa en los cuatro años siguientes y en el mismo orden (art. 48). Cinco años es el plazo para reducir las aportaciones a previsión social que no cupieron (art. 52.2), no este. Dos años y un solo período siguiente acortan el plazo que fija la ley."
  citation: "art. 48 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-48
- id: m03-l16-q0011
  prompt:
    es: "Nuria Soler obtiene en un período impositivo un saldo de 30.000 euros por rendimientos e imputaciones de renta del artículo 45 y un saldo negativo de 12.000 euros de ganancias y pérdidas patrimoniales. No tiene otras rentas ni saldos pendientes. Conforme al artículo 48 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su base imponible general y qué saldo negativo le queda por compensar?"
  options:
  - id: a
    text:
      es: "18.000 euros de base imponible general y ningún saldo pendiente de compensar."
  - id: b
    text:
      es: "22.500 euros de base imponible general y 12.000 euros pendientes de compensar en los cuatro años siguientes."
  - id: c
    text:
      es: "27.000 euros de base imponible general y 9.000 euros pendientes de compensar en los cuatro años siguientes."
  - id: d
    correct: true
    text:
      es: "22.500 euros de base imponible general y 4.500 euros pendientes de compensar en los cuatro años siguientes."
  explanation:
    es: "El límite es el 25 por ciento del saldo positivo de 30.000 euros, es decir, 7.500 euros. La base imponible general es 30.000 - 7.500 = 22.500 euros y quedan 12.000 - 7.500 = 4.500 euros para los cuatro años siguientes. Compensar los 12.000 euros enteros ignora el límite. Dejar 12.000 pendientes olvida restar lo ya compensado. La cifra de 27.000 euros sale de aplicar el 25 por ciento al saldo negativo (3.000 euros) en lugar de al positivo."
  citation: "art. 48 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2006-20764-art-48
- id: m03-l16-q0012
  prompt:
    es: "Según el artículo 48 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la compensación de saldos negativos de ganancias y pérdidas patrimoniales debe efectuarse en la cuantía máxima que permita cada uno de los ejercicios siguientes y sin que pueda practicarse fuera del plazo de cuatro años mediante la acumulación a:"
  options:
  - id: a
    text:
      es: "gastos deducibles de ejercicios posteriores."
  - id: b
    text:
      es: "reducciones de la base imponible de ejercicios posteriores."
  - id: c
    text:
      es: "cuotas negativas de ejercicios posteriores."
  - id: d
    correct: true
    text:
      es: "pérdidas patrimoniales de ejercicios posteriores."
  explanation:
    es: "El artículo 48 prohíbe compensar fuera del plazo de cuatro años acumulando el saldo a pérdidas patrimoniales de ejercicios posteriores. Los gastos deducibles, las reducciones y las cuotas negativas no son la partida que menciona el artículo, y el saldo negativo de ganancias y pérdidas no se arrastra mediante ninguna de ellas."
  citation: "art. 48 LIRPF"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-49
- id: m03-l16-q0013
  prompt:
    es: "De acuerdo con el artículo 49.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la base imponible del ahorro está constituida por:"
  options:
  - id: a
    text:
      es: "el saldo, positivo o negativo, de sumar el saldo de los rendimientos del artículo 46 y el de las ganancias y pérdidas patrimoniales a que se refiere el mismo artículo."
  - id: b
    text:
      es: "el saldo positivo de sumar los rendimientos del artículo 45 y las ganancias y pérdidas patrimoniales no vinculadas a transmisiones."
  - id: c
    correct: true
    text:
      es: "el saldo positivo de sumar el saldo de los rendimientos del artículo 46 y el de las ganancias y pérdidas patrimoniales a que se refiere el mismo artículo."
  - id: d
    text:
      es: "el saldo positivo de los rendimientos del capital mobiliario del artículo 25, sin las ganancias y pérdidas patrimoniales."
  explanation:
    es: "La base imponible del ahorro es el saldo positivo de sumar los dos saldos del artículo 49.1: rendimientos del artículo 46 y ganancias y pérdidas patrimoniales del artículo 46. Si el resultado fuese negativo, no hay base del ahorro, de modo que no se computa un saldo negativo. Los rendimientos del artículo 45 pertenecen a la base general. Dejar fuera las ganancias y pérdidas patrimoniales por transmisión olvida la letra b)."
  citation: "art. 49.1 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-49
- id: m03-l16-q0014
  prompt:
    es: "Según el artículo 49.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de las siguientes afirmaciones describe la compensación del saldo negativo de una de las dos letras de la base imponible del ahorro?"
  options:
  - id: a
    text:
      es: "Se compensa con el saldo positivo de la otra del mismo período impositivo, sin límite alguno."
  - id: b
    correct: true
    text:
      es: "Se compensa con el saldo positivo de la otra del mismo período impositivo, con el límite del 25 por ciento de dicho saldo positivo."
  - id: c
    text:
      es: "Se compensa con el saldo positivo de la base imponible general del mismo período impositivo."
  - id: d
    text:
      es: "Se compensa con el saldo positivo de la otra del mismo período impositivo, con el límite del 50 por ciento."
  explanation:
    es: "El saldo negativo de una letra se compensa con el positivo de la otra del mismo período, con el límite del 25 por ciento del saldo positivo (art. 49.1). Compensar sin límite o al 50 por ciento altera ese tope. Mezclar con la base general no es posible: las dos letras se integran y compensan exclusivamente entre sí dentro de la base del ahorro."
  citation: "art. 49.1 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-49
- id: m03-l16-q0015
  prompt:
    es: "¿En qué plazo se compensa el saldo negativo que quede tras compensar entre sí las dos letras de la base imponible del ahorro, según el artículo 49.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En los cuatro años siguientes, en el mismo orden."
  - id: b
    text:
      es: "En los cinco años siguientes, en el mismo orden."
  - id: c
    text:
      es: "En los tres años siguientes, en el mismo orden."
  - id: d
    text:
      es: "En el ejercicio siguiente exclusivamente."
  explanation:
    es: "Lo que queda después de compensar una letra con la otra se compensa en los cuatro años siguientes, en el mismo orden (art. 49.1). Cinco años es el plazo del artículo 52.2 para las aportaciones a previsión social. Tres años y un solo ejercicio no corresponden a la regla."
  citation: "art. 49.1 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-49
- id: m03-l16-q0016
  prompt:
    es: "Iván Roca obtiene en un período impositivo un saldo positivo de 16.000 euros por rendimientos del capital mobiliario del artículo 46 y un saldo negativo de 6.000 euros por ganancias y pérdidas patrimoniales del mismo artículo. No tiene saldos de otros períodos. Aplicando el artículo 49.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su base imponible del ahorro y qué saldo negativo queda pendiente?"
  options:
  - id: a
    correct: true
    text:
      es: "12.000 euros de base imponible del ahorro y 2.000 euros pendientes de compensar en los cuatro años siguientes."
  - id: b
    text:
      es: "10.000 euros de base imponible del ahorro y ningún saldo pendiente de compensar."
  - id: c
    text:
      es: "12.000 euros de base imponible del ahorro y 6.000 euros pendientes de compensar en los cuatro años siguientes."
  - id: d
    text:
      es: "14.500 euros de base imponible del ahorro y 4.500 euros pendientes de compensar en los cuatro años siguientes."
  explanation:
    es: "El límite es el 25 por ciento del saldo positivo de 16.000 euros: 4.000 euros. La base del ahorro es 16.000 - 4.000 = 12.000 euros y quedan 6.000 - 4.000 = 2.000 euros para los cuatro años siguientes. Compensar los 6.000 euros enteros ignora el límite. Dejar 6.000 pendientes olvida restar lo ya compensado. Con 14.500 y 4.500 se calcula el 25 por ciento sobre el saldo negativo (1.500 euros), no sobre el positivo."
  citation: "art. 49.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2006-20764-art-51
- id: m03-l16-q0022
  prompt:
    es: "Según el artículo 51 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de las siguientes aportaciones puede reducirse en la base imponible general?"
  options:
  - id: a
    text:
      es: "Las cuotas satisfechas a sindicatos y colegios profesionales."
  - id: b
    text:
      es: "Las primas de seguros de vida que cubran únicamente el riesgo de fallecimiento."
  - id: c
    text:
      es: "Las aportaciones realizadas a fondos de inversión de renta variable por el contribuyente en el período impositivo, con el límite de 1.500 euros anuales."
  - id: d
    correct: true
    text:
      es: "Las primas satisfechas a los seguros privados que cubran exclusivamente el riesgo de dependencia severa o de gran dependencia."
  explanation:
    es: "El artículo 51.5 permite reducir las primas de seguros privados que cubran exclusivamente el riesgo de dependencia severa o de gran dependencia. Las cuotas a sindicatos y colegios son gastos deducibles de los rendimientos del trabajo, no una reducción de la base. Los seguros de vida por fallecimiento y los fondos de inversión no figuran entre los sistemas de previsión social del artículo."
  citation: "art. 51 LIRPF"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0023
  prompt:
    es: "Conforme al artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el límite máximo conjunto de las reducciones por previsión social es la menor de dos cantidades, una de las cuales es un porcentaje de la suma de los rendimientos netos del trabajo y de actividades económicas, que es:"
  options:
  - id: a
    text:
      es: "el 25 por 100 de dicha suma."
  - id: b
    text:
      es: "el 20 por 100 de dicha suma."
  - id: c
    correct: true
    text:
      es: "el 30 por 100 de dicha suma."
  - id: d
    text:
      es: "el 50 por 100 de dicha suma."
  explanation:
    es: "La letra a) del artículo 52.1 toma el 30 por 100 de la suma de los rendimientos netos del trabajo y de actividades económicas. El 25 por 100 es el límite de compensación de saldos negativos entre rentas (arts. 48 y 49), y el 20 y el 50 por 100 no figuran en este precepto."
  citation: "art. 52.1 LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0025
  prompt:
    es: "De acuerdo con el artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el límite máximo conjunto de las reducciones por previsión social se incrementa en 8.500 euros anuales siempre que tal incremento provenga de:"
  options:
  - id: a
    text:
      es: "aportaciones de trabajadores por cuenta propia o autónomos y empresarios o profesionales a planes de pensiones sectoriales, de empleo simplificados o de empleo de los que sean promotores."
  - id: b
    correct: true
    text:
      es: "contribuciones empresariales, o de aportaciones del trabajador al mismo instrumento por importe igual o inferior a las que resulten del cuadro del artículo."
  - id: c
    text:
      es: "primas a seguros colectivos de dependencia satisfechas por la empresa."
  - id: d
    text:
      es: "aportaciones a patrimonios protegidos de personas con discapacidad."
  explanation:
    es: "El incremento de 8.500 euros proviene de contribuciones empresariales, o de aportaciones del trabajador al mismo instrumento dentro de las cantidades del cuadro. Las aportaciones de autónomos a planes sectoriales generan el incremento de 4.250 euros. Las primas de seguros colectivos de dependencia pagadas por la empresa tienen su propio límite adicional de 5.000 euros. Las aportaciones a patrimonios protegidos se reducen con el límite del artículo 54, no con este."
  citation: "art. 52.1 LIRPF"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0026
  prompt:
    es: "Según el artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en cuántos euros anuales se incrementa el límite de las reducciones por previsión social cuando el incremento provenga de aportaciones de trabajadores por cuenta propia o autónomos a planes de pensiones sectoriales?"
  options:
  - id: a
    correct: true
    text:
      es: "Se incrementa en 4.250 euros anuales."
  - id: b
    text:
      es: "Se incrementa en 8.500 euros anuales."
  - id: c
    text:
      es: "Se incrementa en 5.000 euros anuales."
  - id: d
    text:
      es: "Se incrementa en 1.500 euros anuales."
  explanation:
    es: "El incremento por aportaciones de autónomos a planes sectoriales es de 4.250 euros anuales (art. 52.1, número 2.º). Los 8.500 euros corresponden al incremento por contribuciones empresariales. Los 5.000 euros son el límite adicional de las primas de seguros colectivos de dependencia pagadas por la empresa, y los 1.500 euros, el límite general del artículo."
  citation: "art. 52.1 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0027
  prompt:
    es: "¿Cuál es la cuantía máxima anual de reducción por aplicación conjunta de los incrementos de 8.500 y de 4.250 euros del límite, sin contar las primas a seguros colectivos de dependencia satisfechas por la empresa, según el artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Es de 12.750 euros anuales."
  - id: b
    text:
      es: "Es de 4.250 euros anuales."
  - id: c
    text:
      es: "Es de 13.500 euros anuales."
  - id: d
    correct: true
    text:
      es: "Es de 8.500 euros anuales."
  explanation:
    es: "El artículo 52.1 limita la reducción por ambos incrementos a 8.500 euros anuales, y no a su suma. La suma de 12.750 euros es el error habitual. Los 4.250 euros son solo uno de los dos incrementos. Los 13.500 euros salen de sumar además el límite adicional de 5.000 euros, que la ley añade aparte."
  citation: "art. 52.1 LIRPF"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0028
  prompt:
    es: "De acuerdo con el artículo 52.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, además de los incrementos del límite por contribuciones empresariales y por aportaciones de autónomos, se admiten 5.000 euros anuales para:"
  options:
  - id: a
    text:
      es: "las aportaciones a planes de pensiones de empleo simplificados de autónomos."
  - id: b
    text:
      es: "las contribuciones del promotor a planes de pensiones de empleo."
  - id: c
    text:
      es: "las primas de los seguros privados de dependencia satisfechas por el propio trabajador."
  - id: d
    correct: true
    text:
      es: "las primas a seguros colectivos de dependencia satisfechas por la empresa."
  explanation:
    es: "Los 5.000 euros anuales adicionales son para las primas a seguros colectivos de dependencia satisfechas por la empresa. Los planes de empleo simplificados de autónomos están dentro del incremento de 4.250 euros. Las contribuciones empresariales entran en el incremento de 8.500 euros. Las primas pagadas por el propio trabajador a seguros privados de dependencia se reducen dentro del límite general."
  citation: "art. 52.1 LIRPF"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0029
  prompt:
    es: "Según el artículo 52.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las aportaciones a sistemas de previsión social que no hayan podido reducirse por insuficiencia de la base imponible o por el límite porcentual pueden reducirse:"
  options:
  - id: a
    text:
      es: "en los cuatro ejercicios siguientes."
  - id: b
    text:
      es: "en los tres ejercicios siguientes."
  - id: c
    correct: true
    text:
      es: "en los cinco ejercicios siguientes."
  - id: d
    text:
      es: "únicamente en el ejercicio siguiente."
  explanation:
    es: "El artículo 52.2 concede cinco ejercicios para reducir lo que no cupo. Cuatro años es el plazo de compensación de los saldos negativos de las bases (arts. 48 a 50). Tres ejercicios y uno solo recortan el plazo que fija la ley."
  citation: "art. 52.2 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-52
- id: m03-l16-q0030
  prompt:
    es: "Conforme al artículo 52.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la reducción en los cinco ejercicios siguientes de las aportaciones que no pudieron reducirse:"
  options:
  - id: a
    text:
      es: "Se aplica también a las aportaciones que excedan de los límites máximos previstos en el apartado 6 del artículo 51."
  - id: b
    correct: true
    text:
      es: "No se aplica a las aportaciones y contribuciones que excedan de los límites máximos previstos en el apartado 6 del artículo 51."
  - id: c
    text:
      es: "Solo se aplica a las aportaciones que no cupieron por insuficiencia de la base imponible, no por el límite porcentual."
  - id: d
    text:
      es: "Se aplica únicamente a los partícipes de planes de pensiones, no a los mutualistas ni a los asegurados."
  explanation:
    es: "La regla de los cinco ejercicios no vale para las aportaciones que excedan de los límites máximos del apartado 6 del artículo 51. Sí cubre tanto la insuficiencia de la base como el límite porcentual, y alcanza a partícipes, mutualistas y asegurados."
  citation: "art. 52.2 LIRPF"
  difficulty: 3
  tags:
  - "condición"
