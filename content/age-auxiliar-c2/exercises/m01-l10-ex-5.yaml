# anchor: celex-12016m-txt-art-17
- id: m01-l10-q106
  prompt:
    es: "Según el artículo 17.5 del Tratado de la Unión Europea, los miembros de la Comisión serán seleccionados de entre los nacionales de los Estados miembros mediante un sistema de:"
  options:
  - id: a
    text:
