- id: m05-l03-q119
  prompt:
    es: "Según el artículo 73.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la aprobación es el acto mediante el cual se autoriza la realización de un gasto determinado por una cuantía:"
  options:
