# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0117
  prompt:
    es: "Según la escala general del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué tipo se aplica a la parte de la base liquidable general comprendida entre 12.450 y 20.200 euros?"
  options:
  - id: a
    correct: true
    text:
      es: "Se aplica el 12 por ciento."
  - id: b
    text:
      es: "Se aplica el 9,50 por ciento."
  - id: c
    text:
      es: "Se aplica el 15 por ciento."
  - id: d
    text:
      es: "Se aplica el 18,50 por ciento."
  explanation:
    es: "El tramo de 12.450 a 20.200 euros se grava al 12 por ciento (art. 63.1). El 9,50 por ciento es el tipo del primer tramo, hasta 12.450 euros. El 15 por ciento corresponde al tramo siguiente, de 20.200 a 35.200 euros, y el 18,50 por ciento al de 35.200 a 60.000."
  citation: "art. 63.1 LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0118
  prompt:
    es: "De acuerdo con la escala general del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué tipo se aplica a la parte de la base liquidable general comprendida entre 60.000 y 300.000 euros?"
  options:
  - id: a
    text:
      es: "Se aplica el 24,50 por ciento."
  - id: b
    text:
      es: "Se aplica el 18,50 por ciento."
  - id: c
    text:
      es: "Se aplica el 20 por ciento."
  - id: d
    correct: true
    text:
      es: "Se aplica el 22,50 por ciento."
  explanation:
    es: "El tramo de 60.000 a 300.000 euros tributa al 22,50 por ciento (art. 63.1). El 24,50 por ciento es el tipo a partir de 300.000 euros y el 18,50 por ciento el del tramo anterior. El 20 por ciento no figura en la escala."
  citation: "art. 63.1 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0119
  prompt:
    es: "Según la escala general del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué cuota íntegra corresponde a una base liquidable general de 20.200 euros, antes de minorarla en la escala aplicada al mínimo personal y familiar?"
  options:
  - id: a
    text:
      es: "La cuota íntegra es de 1.182,75 euros."
  - id: b
    text:
      es: "La cuota íntegra es de 4.362,75 euros."
  - id: c
    correct: true
    text:
      es: "La cuota íntegra es de 2.112,75 euros."
  - id: d
    text:
      es: "La cuota íntegra es de 1.919,00 euros."
  explanation:
    es: "En la fila que arranca en 20.200 euros la cuota íntegra es de 2.112,75 euros (art. 63.1). Los 1.182,75 euros son la cuota de la fila de 12.450 euros y los 4.362,75 euros la de 35.200 euros. Los 1.919 euros resultan de aplicar el 9,50 por ciento a toda la base, sin escala."
  citation: "art. 63.1 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-66
- id: m03-l16-q0120
  prompt:
    es: "¿Qué tipo se aplica a los primeros 6.000 euros de la base liquidable del ahorro según la escala del artículo 66.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Se aplica el 10,5 por ciento."
  - id: b
    text:
      es: "Se aplica el 19 por ciento."
  - id: c
    correct: true
    text:
      es: "Se aplica el 9,5 por ciento."
  - id: d
    text:
      es: "Se aplica el 12 por ciento."
  explanation:
    es: "Los primeros 6.000 euros de base liquidable del ahorro tributan al 9,5 por ciento (art. 66.1). El 10,5 por ciento es el del tramo siguiente. El 19 por ciento es el tipo de la escala para contribuyentes con residencia habitual en el extranjero (art. 66.2), no de la general del ahorro. Y el 12 por ciento es un tipo de la escala general."
  citation: "art. 66.1 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-66
- id: m03-l16-q0121
  prompt:
    es: "De acuerdo con la escala del artículo 66.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el tipo que se aplica a la parte de la base liquidable del ahorro que exceda de 300.000 euros es:"
  options:
  - id: a
    text:
      es: "el 13,5 por ciento sobre ese exceso."
  - id: b
    correct: true
    text:
      es: "el 15 por ciento sobre ese exceso."
  - id: c
    text:
      es: "el 24,50 por ciento sobre ese exceso."
  - id: d
    text:
      es: "el 11,5 por ciento sobre ese exceso."
  explanation:
    es: "A partir de 300.000 euros la base liquidable del ahorro tributa al 15 por ciento (art. 66.1). El 13,5 por ciento es el tipo del tramo entre 200.000 y 300.000 euros y el 11,5 por ciento el del tramo entre 50.000 y 200.000. El 24,50 por ciento es el tipo máximo de la escala general."
  citation: "art. 66.1 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
