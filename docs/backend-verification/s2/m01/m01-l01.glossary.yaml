- id: g-record-class
  term: {en: record class}
  definition: {en: "A restricted kind of class that defines a simple aggregate of values."}
  origin: m01-l01
  citation: "jls-8-records#jls-8.10"
- id: g-sealed-class
  term: {en: sealed class}
  definition: {en: "A class that can be declared sealed if all its direct subclasses are known when the class is declared, and no other direct subclasses are desired or required."}
  origin: m01-l01
  citation: "jls-8-records#jls-8.1.1.2"
- id: g-record-pattern
  term: {en: record pattern}
  definition: {en: "A pattern used to test whether a value is an instance of a record class type and, if it is, to recursively perform pattern matching on the record component values."}
  origin: m01-l01
  citation: "jls-14-statements#jls-14.30.1"
- id: g-pattern-matching
  term: {en: pattern matching}
  definition: {en: "The process of testing a value against a pattern at run time."}
  origin: m01-l01
  citation: "jls-14-statements#jls-14.30.2"
