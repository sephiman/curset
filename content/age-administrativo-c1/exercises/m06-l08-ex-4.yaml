- id: m06-l08-q124
  prompt:
    es: "¿Cuál de las siguientes formas de cifrado se aplica al tráfico HTTP en HTTPS, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Con cifrado simétrico, cuya clave se intercambió antes entre navegador y servidor"
  - id: b
    text:
      es: "Con un algoritmo de cifrado asimétrico aplicado a todo el tráfico HTTP de la comunicación"
  - id: c
    text:
      es: "Sin cifrar el tráfico: solo se autentica el servidor con un certificado"
  - id: d
    text:
      es: "Con una clave simétrica fija que genera el navegador sin intercambiarla con el servidor"
  explanation:
    es: "En HTTPS el tráfico HTTP se cifra con un algoritmo simétrico cuya clave se ha intercambiado previamente entre el navegador y el servidor. El tráfico no se cifra con un algoritmo asimétrico: es un algoritmo simétrico. La clave no es fija ni se genera sin intercambio: se ha intercambiado previamente entre navegador y servidor. HTTPS cifra el tráfico HTTP, que es lo que lo distingue de HTTP."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.9. HTTPS»"
  difficulty: 1
  tags:
  - "concepto"
