# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q249
  prompt:
    es: "De acuerdo con el artículo 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión contra actos firmes en vía administrativa se interpone:"
  options:
  - id: a
    text:
      es: "Ante el órgano superior jerárquico del que los dictó, que es el competente para resolverlo."
  - id: b
    text:
      es: "Ante el órgano que los dictó, que lo remite al Consejo de Estado para que lo resuelva."
  - id: c
    text:
      es: "Ante el titular del departamento ministerial, que es el competente para resolverlo en todo caso."
  - id: d
    correct: true
    text:
      es: "Ante el órgano administrativo que los dictó, que también es el competente para resolverlo."
  explanation:
    es: "El artículo 125.1 dice que el recurso se interpone «ante el órgano administrativo que los dictó, que también será el competente para su resolución». No interviene el superior jerárquico, que es el órgano de la alzada, ni el Ministro con carácter general. El Consejo de Estado no resuelve el recurso."
  citation: "art. 125.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q250
  prompt:
    es: "Según el artículo 125.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, procede el recurso extraordinario de revisión cuando al dictar el acto se hubiera incurrido en:"
  options:
  - id: a
    text:
      es: "Error de hecho o de derecho, que resulte de los documentos incorporados al expediente."
  - id: b
    correct: true
    text:
      es: "Error de hecho, que resulte de los propios documentos incorporados al expediente."
  - id: c
    text:
      es: "Error de derecho, que resulte de la interpretación de la norma aplicada al caso."
  - id: d
    text:
      es: "Error de hecho, aunque no resulte de los documentos incorporados al expediente."
  explanation:
    es: "La causa a) exige un «error de hecho, que resulte de los propios documentos incorporados al expediente». El error de derecho no abre este recurso, ni solo ni junto al de hecho. Un error de hecho que no resulte de los documentos del expediente tampoco basta."
  citation: "art. 125.1.a) LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q251
  prompt:
    es: "Tras una resolución firme en vía administrativa aparecen documentos de valor esencial, posteriores a ella, que evidencian su error. ¿Qué recurso cabe y ante qué órgano?"
  options:
  - id: a
    text:
      es: "El recurso extraordinario de revisión, ante el superior jerárquico del que dictó el acto."
  - id: b
    correct: true
    text:
      es: "El recurso extraordinario de revisión, ante el órgano que dictó el acto."
  - id: c
    text:
      es: "El recurso de alzada, ante el superior jerárquico del órgano que dictó el acto."
  - id: d
    text:
      es: "El recurso potestativo de reposición, ante el mismo órgano que dictó el acto."
  explanation:
    es: "El artículo 125.1.b) de la Ley 39/2015 admite el recurso extraordinario de revisión cuando «aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida». Se interpone ante el órgano que dictó el acto, que lo resuelve (art. 125.1). La alzada y la reposición no proceden contra un acto ya firme en vía administrativa."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q252
  prompt:
    es: "Conforme al artículo 125.1.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cabe el recurso extraordinario de revisión si en la resolución influyeron esencialmente documentos o testimonios declarados falsos por:"
  options:
  - id: a
    correct: true
    text:
      es: "Sentencia judicial firme, anterior o posterior a aquella resolución."
  - id: b
    text:
      es: "Sentencia judicial firme, siempre que sea anterior a aquella resolución."
  - id: c
    text:
      es: "Resolución administrativa firme, anterior o posterior a aquella resolución."
  - id: d
    text:
      es: "Sentencia judicial, aunque no sea firme, posterior a aquella resolución."
  explanation:
    es: "La causa c) se refiere a documentos o testimonios «declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución». La sentencia puede ser posterior a la resolución, de modo que exigir que sea anterior es incorrecto. La falsedad la declara un juez, no una resolución administrativa, y la sentencia tiene que ser firme."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q254
  prompt:
    es: "Según el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión fundado en un error de hecho que resulte de los documentos del expediente se interpone:"
  options:
  - id: a
    text:
      es: "Dentro de los tres meses siguientes a la fecha de la notificación de la resolución impugnada."
  - id: b
    text:
      es: "Dentro de los cuatro años siguientes a aquel en que el interesado conoció el error."
  - id: c
    text:
      es: "En cualquier momento, sin sujeción a plazo, mientras el acto siga produciendo efectos."
  - id: d
    correct: true
    text:
      es: "Dentro de los cuatro años siguientes a la fecha de la notificación de la resolución impugnada."
  explanation:
    es: "Para la causa a), el artículo 125.2 fija «el plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada». Los tres meses son el plazo de las demás causas, y se cuentan desde el conocimiento de los documentos o desde la firmeza de la sentencia, no desde la notificación. Los cuatro años no se cuentan desde que se conoció el error. El recurso tiene plazo, de modo que no cabe en cualquier momento."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q255
  prompt:
    es: "Una resolución firme en vía administrativa se notificó el jueves, 16 de febrero de 2023, con un error de hecho que resulta de los documentos del expediente. ¿Hasta qué día cabe interponer recurso extraordinario de revisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el martes, 16 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el martes, 16 de mayo de 2023."
  - id: c
    text:
      es: "Hasta el viernes, 16 de febrero de 2024."
  - id: d
    text:
      es: "Hasta el lunes, 16 de febrero de 2026."
  explanation:
    es: "En la causa a) el plazo es de cuatro años desde la notificación (art. 125.2 de la Ley 39/2015). Contado de fecha a fecha (art. 30.4), concluye el martes 16 de febrero de 2027, día hábil. El 16 de mayo de 2023 aplica tres meses, el plazo de las demás causas. El 16 de febrero de 2024 aplica un año y el de 2026, tres años; ninguno es el plazo legal."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-125
- id: m01-l11-q256
  prompt:
    es: "El martes, 18 de noviembre de 2025, un interesado conoce documentos de valor esencial, posteriores a una resolución firme, que evidencian su error. ¿Hasta qué día puede interponer recurso extraordinario de revisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el miércoles, 18 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el jueves, 18 de diciembre de 2025."
  - id: c
    text:
      es: "Hasta el lunes, 19 de enero de 2026."
  - id: d
    text:
      es: "Hasta el lunes, 18 de mayo de 2026."
  explanation:
    es: "En la causa b) el plazo es de «tres meses a contar desde el conocimiento de los documentos» (art. 125.2 de la Ley 39/2015). Empieza el miércoles 19 de noviembre y concluye el mismo día del tercer mes: el miércoles 18 de febrero de 2026, día hábil (art. 30.4). En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 18 de diciembre aplica un mes; el 19 de enero, dos meses (el 18 es domingo); el 18 de mayo, seis meses."
  citation: "art. 125.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m01-l11-q280
  prompt:
    es: "Señale la respuesta correcta sobre cómo debe organizarse el procedimiento sancionador que el INE inicia contra Transportes Valdemaría, S.L., según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Se inicia siempre de oficio, con las fases instructora y sancionadora a cargo del mismo órgano."
  - id: b
    text:
      es: "Se inicia a solicitud de la empresa, con las fases instructora y sancionadora a cargo de órganos distintos."
  - id: c
    text:
      es: "Se inicia de oficio o a solicitud de la empresa, con una única fase a cargo del mismo órgano."
  - id: d
    correct: true
    text:
      es: "Se inicia siempre de oficio, con las fases instructora y sancionadora a cargo de órganos distintos."
  explanation:
    es: "Los procedimientos de naturaleza sancionadora se inician siempre de oficio, por acuerdo del órgano competente, y separan la fase instructora de la sancionadora, que se encomiendan a órganos distintos. La opción del mismo órgano niega esa separación. La opción de la solicitud de la empresa contradice que solo se inician de oficio. La opción de la fase única mantiene los dos errores a la vez."
  citation: "art. 63.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-44
- id: m01-l11-q303
  prompt:
    es: "¿Dónde debe publicarse necesariamente el anuncio con el que el FEGA notifica a Conservas Riberas del Júcar, S.L. la desestimación de su alzada?"
  options:
  - id: a
    text:
      es: "En el boletín oficial de la Comunidad Autónoma del último domicilio, que basta para notificar."
  - id: b
    correct: true
    text:
      es: "En el «Boletín Oficial del Estado», sin perjuicio de otras publicaciones facultativas."
  - id: c
    text:
      es: "En el tablón de edictos del Ayuntamiento del último domicilio de la empresa."
  - id: d
    text:
      es: "En el «Boletín Oficial del Estado» y en el de la provincia, que son obligatorios ambos."
  explanation:
    es: "Cuando se ignora el lugar de la notificación o, intentada, no ha podido practicarse, la notificación se hace por un anuncio publicado en el «Boletín Oficial del Estado» (art. 44 LPAC). Antes pueden publicarse, con carácter facultativo, anuncios en el boletín autonómico o provincial, en el tablón de edictos del Ayuntamiento del último domicilio o en el consulado. Las opciones del boletín de la Comunidad Autónoma y del tablón de edictos toman esos anuncios facultativos por la notificación misma. La de los dos boletines, el estatal y el de la provincia, hace obligatorio un anuncio que la ley deja a elección de la Administración."
  citation: "art. 44 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-77
- id: m01-l11-q314
  prompt:
    es: "El lunes, 1 de febrero de 2027, el Instituto abre un período de prueba en un procedimiento instruido en Madrid y fija el plazo máximo que permite la ley. ¿Hasta qué fecha puede durar ese período?"
  options:
  - id: a
    text:
      es: "El lunes, 15 de febrero de 2027."
  - id: b
    text:
      es: "El miércoles, 3 de marzo de 2027."
  - id: c
    text:
      es: "El viernes, 12 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 15 de marzo de 2027."
  explanation:
    es: "El período de prueba no es superior a treinta días ni inferior a diez (art. 77.2 LPAC), y los días son hábiles (art. 30.2 LPAC). Desde el martes 2 de febrero, y sin festivos en el periodo, el trigésimo día hábil es el lunes, 15 de marzo de 2027. La fecha del lunes 15 de febrero aplica el mínimo de diez días. La del miércoles 3 de marzo cuenta treinta días naturales. La del viernes 12 de marzo cuenta el lunes 1 de febrero como primer día."
  citation: "art. 77.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q323
  prompt:
    es: "Señale hasta qué fecha puede ampliar la Jefatura, como máximo, el plazo de diez días hábiles que concedió a Doña Amparo el lunes, 25 de enero de 2027, si ella pide la ampliación el miércoles, 3 de febrero de 2027:"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 15 de febrero de 2027."
  - id: b
    text:
      es: "El viernes, 12 de febrero de 2027."
  - id: c
    text:
      es: "El sábado, 13 de febrero de 2027."
  - id: d
    text:
      es: "El lunes, 22 de febrero de 2027."
  explanation:
    es: "La ampliación de un plazo no puede exceder de la mitad del plazo (art. 32.1 LPAC), y la petición llega antes del vencimiento (art. 32.3 LPAC). Los diez días hábiles desde el lunes 25 de enero vencen el lunes, 8 de febrero de 2027. La mitad son cinco días hábiles más, del martes 9 al lunes, 15 de febrero de 2027. La fecha del viernes, 12 de febrero de 2027, cuenta el día del vencimiento como primero de los cinco. La del sábado, 13 de febrero de 2027, suma cinco días naturales. La del lunes, 22 de febrero de 2027, duplica el plazo con diez días hábiles más."
  citation: "art. 32.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: m01-l11-q324
  prompt:
    es: "Si la Jefatura denegara a Doña Amparo la ampliación del plazo que pidió, ¿qué recurso cabría contra ese acuerdo, según el artículo 32.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El recurso de reposición, ante el mismo órgano, en el plazo de un mes."
  - id: b
    text:
      es: "El recurso contencioso-administrativo, directamente y sin agotar la vía administrativa."
  - id: c
    correct: true
    text:
      es: "Ninguno, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento."
  - id: d
    text:
      es: "El recurso extraordinario de revisión, si aparecen documentos nuevos."
  explanation:
    es: "Los acuerdos sobre ampliación de plazos o sobre su denegación no son susceptibles de recurso, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento (art. 32.3 LPAC). Por eso no cabe contra la denegación a Doña Amparo la reposición ni el contencioso directo. Tampoco el recurso extraordinario de revisión, que solo cabe contra actos firmes en vía administrativa."
  citation: "art. 32.3 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-33
- id: m01-l11-q325
  prompt:
    es: "¿Qué recurso cabe contra el acuerdo de la Jefatura que declara la tramitación de urgencia, según el artículo 33.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Recurso de alzada ante el superior jerárquico de la Jefatura, en el plazo de un mes desde el acuerdo."
  - id: b
    correct: true
    text:
      es: "Ninguno contra el acuerdo, sin perjuicio del que proceda contra la resolución final del procedimiento."
  - id: c
    text:
      es: "Recurso potestativo de reposición, en el plazo de un mes, ante la propia Jefatura Central."
  - id: d
    text:
      es: "Recurso extraordinario de revisión, por tratarse de un acto de trámite que acelera el procedimiento."
  explanation:
    es: "No cabe recurso alguno contra el acuerdo que declara la tramitación de urgencia, sin perjuicio del procedente contra la resolución que ponga fin al procedimiento (art. 33.2 LPAC). La alzada y la reposición son recursos contra resoluciones y actos de trámite que la ley no excluye, y aquí la ley los excluye. El recurso extraordinario de revisión solo cabe contra actos firmes y por las causas tasadas del artículo 125. El interesado puede alegar su disconformidad al recurrir la resolución final."
  citation: "art. 33.2 LPAC"
  difficulty: 2
  tags:
  - "recurso"
  - "requisito"
# anchor: boe-a-2015-10565-art-33
- id: m01-l11-q330
  prompt:
    es: "Si el trámite de audiencia se notifica al interesado el martes, 13 de abril de 2027, señale hasta qué fecha puede presentar alegaciones, teniendo en cuenta la tramitación de urgencia del expediente:"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 20 de abril de 2027."
  - id: b
    text:
      es: "El martes, 27 de abril de 2027."
  - id: c
    text:
      es: "El domingo, 18 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 19 de abril de 2027."
  explanation:
    es: "La tramitación de urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (art. 33.1 LPAC). El plazo de audiencia no es de esos dos, y queda en cinco días hábiles. Desde el día siguiente a la notificación, del miércoles 14 al martes, 20 de abril de 2027, sin sábados ni domingos. La fecha del martes, 27 de abril de 2027, cuenta los diez días hábiles del procedimiento ordinario. La del domingo, 18 de abril de 2027, suma cinco días naturales. La del lunes, 19 de abril de 2027, cuenta como primero el día de la notificación."
  citation: "art. 33.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
