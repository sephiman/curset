# anchor: boe-a-2003-23186-art-228
- id: m03-l14-q0125
  prompt:
    es: "De acuerdo con el artículo 228.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el conocimiento de las reclamaciones económico-administrativas corresponde con exclusividad a los órganos económico-administrativos, que actúan con:"
  options:
  - id: a
    text:
      es: "Subordinación funcional a la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "Autonomía orgánica respecto al Ministerio de Hacienda."
  - id: c
    correct: true
    text:
      es: "Independencia funcional en el ejercicio de sus competencias."
  - id: d
    text:
      es: "Dependencia jerárquica de la Dirección General de Tributos."
  explanation:
    es: "El artículo 228.1 habla de independencia funcional. No hay dependencia jerárquica de la Dirección General de Tributos ni subordinación a la Agencia, y el texto no habla de autonomía orgánica respecto al Ministerio."
  citation: "art. 228.1 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "independencia"
# anchor: boe-a-2003-23186-art-228
- id: m03-l14-q0126
  prompt:
    es: "Según el artículo 228.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuáles son los órganos económico-administrativos en el ámbito de competencias del Estado?"
  options:
  - id: a
    text:
      es: "El Tribunal Económico-Administrativo Central y el Consejo para la Defensa del Contribuyente."
  - id: b
    correct: true
    text:
      es: "El Tribunal Económico-Administrativo Central y los tribunales económico-administrativos regionales y locales."
  - id: c
    text:
      es: "El Tribunal Económico-Administrativo Central y las juntas arbitrales de cada Comunidad Autónoma y Ciudad con Estatuto."
  - id: d
    text:
      es: "Los tribunales económico-administrativos regionales y los consejos territoriales de la Agencia."
  explanation:
    es: "El artículo 228.2 nombra el Tribunal Económico-Administrativo Central y los tribunales regionales y locales. Las juntas arbitrales, los consejos territoriales y el Consejo para la Defensa del Contribuyente no son órganos económico-administrativos de ese apartado. La Sala Especial para la Unificación de Doctrina se añade en el apartado 3."
  citation: "art. 228.2 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "órganos"
# anchor: boe-a-2003-23186-art-228
- id: m03-l14-q0127
  prompt:
    es: "Conforme al artículo 228.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, también tiene la consideración de órgano económico-administrativo:"
  options:
  - id: a
    text:
      es: "La Comisión Consultiva de Infracciones Tributarias."
  - id: b
    text:
      es: "La Junta Arbitral del Convenio Económico."
  - id: c
    text:
      es: "La Sala de lo Contencioso-Administrativo de la Audiencia Nacional."
  - id: d
    correct: true
    text:
      es: "La Sala Especial para la Unificación de Doctrina."
  explanation:
    es: "El apartado 3 del artículo 228 añade la Sala Especial para la Unificación de Doctrina. La Audiencia Nacional es órgano judicial. La Comisión Consultiva y la Junta Arbitral no figuran como órganos económico-administrativos."
  citation: "art. 228.3 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "sala especial"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0128
  prompt:
    es: "De acuerdo con el artículo 229.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en cada Comunidad Autónoma existe un tribunal económico-administrativo regional, y en cada Ciudad con Estatuto de Autonomía:"
  options:
  - id: a
    text:
      es: "Un tribunal económico-administrativo regional propio."
  - id: b
    correct: true
    text:
      es: "Un tribunal económico-administrativo local."
  - id: c
    text:
      es: "Una dependencia provincial del Tribunal Económico-Administrativo Central."
  - id: d
    text:
      es: "Una sala desconcentrada del tribunal regional."
  explanation:
    es: "El artículo 229.7 prevé un tribunal regional por Comunidad Autónoma y un tribunal local por Ciudad con Estatuto de Autonomía. La sala desconcentrada es una subdivisión de los tribunales regionales. La dependencia provincial es del reglamento. Y en las Ciudades el tribunal es local, no regional."
  citation: "art. 229.7 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "regionales"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0129
  prompt:
    es: "En relación con la competencia territorial de los tribunales económico-administrativos regionales y locales, según el artículo 229.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se determina conforme a la sede del tribunal que haya resuelto la reposición."
  - id: b
    correct: true
    text:
      es: "Se determina conforme a la sede del órgano que hubiera dictado el acto objeto de la reclamación."
  - id: c
    text:
      es: "Se determina conforme al lugar donde se haya presentado el escrito de interposición de la reclamación."
  - id: d
    text:
      es: "Se determina conforme al domicilio fiscal del reclamante en todos los casos."
  explanation:
    es: "El artículo 229.7 fija la competencia territorial por la sede del órgano que dictó el acto. El domicilio fiscal es el criterio solo para las reclamaciones contra actuaciones de los particulares (art. 229.5). El lugar de presentación y la sede del tribunal de reposición no son criterios del precepto."
  citation: "art. 229.7 LGT"
  difficulty: 2
  tags:
  - "tribunales"
  - "competencia territorial"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0130
  prompt:
    es: "Conforme al artículo 229.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los tribunales económico-administrativos regionales pueden crearse salas desconcentradas con el ámbito territorial y las competencias que se fijen en:"
  options:
  - id: a
    text:
      es: "La resolución del presidente de cada tribunal."
  - id: b
    text:
      es: "El convenio con la Agencia Estatal de Administración Tributaria."
  - id: c
    correct: true
    text:
      es: "La normativa tributaria."
  - id: d
    text:
      es: "El acuerdo de la Comunidad Autónoma correspondiente."
  explanation:
    es: "Las salas desconcentradas se crean con el ámbito y las competencias que fije la normativa tributaria (art. 229.7). No depende de una resolución del presidente, de un acuerdo autonómico ni de un convenio."
  citation: "art. 229.7 LGT"
  difficulty: 2
  tags:
  - "tribunales"
  - "salas desconcentradas"
# anchor: boe-a-2005-8662-art-28
- id: m03-l14-q0131
  prompt:
    es: "Según el artículo 28.1 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, el Tribunal Económico-Administrativo Central tiene su sede en Madrid y extiende su competencia:"
  options:
  - id: a
    text:
      es: "A los tributos cedidos a las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "A todo el territorio nacional."
  - id: c
    text:
      es: "A la Comunidad de Madrid y a las Ciudades de Ceuta y Melilla."
  - id: d
    text:
      es: "A las reclamaciones de cuantía superior a seis mil euros."
  explanation:
    es: "El tribunal central tiene sede en Madrid y competencia sobre todo el territorio nacional (art. 28.1 RGRVA). Su ámbito no se limita a Madrid, Ceuta y Melilla, no depende de un umbral de cuantía ni se circunscribe a los tributos cedidos."
  citation: "art. 28.1 RGRVA"
  difficulty: 1
  tags:
  - "tribunales"
  - "TEAC"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0133
  prompt:
    es: "De acuerdo con el artículo 229.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el Tribunal Económico-Administrativo Central conoce en segunda instancia de:"
  options:
  - id: a
    text:
      es: "Los recursos de anulación contra las resoluciones dictadas por los tribunales económico-administrativos locales."
  - id: b
    text:
      es: "Las reclamaciones contra actos de órganos periféricos de la Agencia que superen seis mil euros."
  - id: c
    correct: true
    text:
      es: "Los recursos de alzada ordinarios contra las resoluciones dictadas en primera instancia por los tribunales económico-administrativos regionales y locales."
  - id: d
    text:
      es: "Los recursos de reposición contra las resoluciones dictadas en primera instancia por los tribunales económico-administrativos regionales y locales, ante el mismo tribunal."
  explanation:
    es: "En segunda instancia, el tribunal central resuelve los recursos de alzada ordinarios contra resoluciones de primera instancia de los tribunales regionales y locales (art. 229.1.c). La reposición es un recurso previo ante la Administración. Los de cuantía superior a seis mil euros no se atribuyen al central por ese motivo. Y el recurso de anulación lo resuelve el mismo tribunal que dictó la resolución."
  citation: "art. 229.1 LGT"
  difficulty: 2
  tags:
  - "tribunales"
  - "TEAC"
  - "alzada"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0135
  prompt:
    es: "Según el artículo 229.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el Tribunal Económico-Administrativo Central conoce también de la rectificación de errores:"
  options:
  - id: a
    text:
      es: "En los que incurran los actos de los órganos centrales de la Agencia."
  - id: b
    text:
      es: "En los que incurran las resoluciones de la Sala Especial para la Unificación de Doctrina."
  - id: c
    correct: true
    text:
      es: "En los que incurran sus propias resoluciones."
  - id: d
    text:
      es: "En los que incurran las resoluciones de los tribunales regionales."
  explanation:
    es: "La letra f) del artículo 229.1 se limita a los errores de sus propias resoluciones. Las de los tribunales regionales las rectifican ellos mismos (art. 229.2.c). Y los actos de los órganos de la Agencia los rectifica el órgano que los dictó (art. 220.1)."
  citation: "art. 229.1 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "TEAC"
  - "rectificación"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0137
  prompt:
    es: "Conforme al artículo 229.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la resolución de la reclamación es susceptible de recurso de alzada ordinario ante el Tribunal Económico-Administrativo Central, ¿ante qué órgano puede interponerse directamente la reclamación?"
  options:
  - id: a
    correct: true
    text:
      es: "Directamente ante el Tribunal Económico-Administrativo Central."
  - id: b
    text:
      es: "Ante el órgano de la Agencia que dictó el acto, previa interposición del recurso de reposición."
  - id: c
    text:
      es: "Ante la Sala Especial para la Unificación de Doctrina."
  - id: d
    text:
      es: "Únicamente ante el tribunal económico-administrativo regional del domicilio del reclamante."
  explanation:
    es: "El artículo 229.6 permite interponer directamente la reclamación ante el tribunal central cuando cabe alzada ordinario. No obliga al regional, no pasa por la reposición y la Sala Especial no resuelve reclamaciones."
  citation: "art. 229.6 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "alzada"
  - "directa"
# anchor: boe-a-2003-23186-art-229
- id: m03-l14-q0138
  prompt:
    es: "Una empresa con domicilio fiscal fuera de España presenta una reclamación contra una actuación de un particular en materia tributaria susceptible de reclamación, por una cuantía de 3.000 euros. Conforme al artículo 229.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué órgano es competente?"
  options:
  - id: a
    text:
      es: "La Sala Especial para la Unificación de Doctrina, por afectar a un obligado no residente."
  - id: b
    correct: true
    text:
      es: "El Tribunal Económico-Administrativo Central, cualquiera que sea su cuantía."
  - id: c
    text:
      es: "El tribunal económico-administrativo regional de Madrid, por ser de cuantía inferior a seis mil euros."
  - id: d
    text:
      es: "El tribunal económico-administrativo local de la ciudad donde se hizo la actuación."
  explanation:
    es: "Cuando el domicilio fiscal de quien reclama contra actuaciones de particulares está fuera de España, la competencia es del tribunal central cualquiera que sea la cuantía (art. 229.5). El umbral de cuantía y el lugar de la actuación no cambian la regla. La Sala Especial no resuelve reclamaciones."
  citation: "art. 229.5 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "tribunales"
  - "domicilio"
# anchor: boe-a-2005-8662-art-36
- id: m03-l14-q0139
  prompt:
    es: "Una reclamación económico-administrativa contra una liquidación de 200.000 euros se resuelve en primera instancia por un tribunal regional. No es una reclamación contra bases o valoraciones. Según el artículo 36 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, ¿cabe recurso de alzada ordinario?"
  options:
  - id: a
    text:
      es: "No, porque el umbral para este tipo de reclamación es de 1.800.000 euros."
  - id: b
    text:
      es: "No, porque solo cabe alzada ordinario en los actos de cuantía indeterminada."
  - id: c
    correct: true
    text:
      es: "Sí, porque la cuantía supera 150.000 euros."
  - id: d
    text:
      es: "Sí, pero únicamente si la liquidación procede de una comprobación de valores."
  explanation:
    es: "El umbral general del recurso de alzada ordinario es una cuantía superior a 150.000 euros (art. 36 RGRVA), y 200.000 lo supera. Los 1.800.000 euros solo valen para reclamaciones contra bases o valoraciones. Los actos de cuantía indeterminada también admiten alzada, pero no son el único caso. Y no hace falta que provenga de una comprobación de valores."
  citation: "art. 36 RGRVA"
  difficulty: 2
  tags:
  - "supuesto"
  - "cuantía"
  - "alzada"
# anchor: boe-a-2005-8662-art-35
- id: m03-l14-q0142
  prompt:
    es: "De acuerdo con el artículo 35.1.e del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, en las reclamaciones contra sanciones, la cuantía es el importe de estas:"
  options:
  - id: a
    text:
      es: "Más los intereses de demora devengados durante la tramitación."
  - id: b
    text:
      es: "Una vez aplicadas las reducciones por conformidad y pronto pago."
  - id: c
    correct: true
    text:
      es: "Con anterioridad a la aplicación de las posibles reducciones."
  - id: d
    text:
      es: "Descontado el importe de la deuda tributaria de la que derivan."
  explanation:
    es: "La cuantía de la reclamación contra una sanción es el importe antes de aplicar las reducciones (art. 35.1.e RGRVA). No se calcula después de reducciones, ni se suman intereses de demora, ni se descuenta la deuda de la que deriva."
  citation: "art. 35.1.e RGRVA"
  difficulty: 2
  tags:
  - "cuantía"
  - "sanciones"
# anchor: boe-a-2005-8662-art-64
- id: m03-l14-q0143
  prompt:
    es: "Natalia Cano Rey reclama contra una liquidación por un importe de 5.500 euros que no es una base ni una valoración. Según el artículo 64 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, la reclamación se tramita por el procedimiento:"
  options:
  - id: a
    text:
      es: "Abreviado, porque su cuantía es inferior a 72.000 euros."
  - id: b
    text:
      es: "General, porque la cuantía debe ser inferior a 3.000 euros para el abreviado."
  - id: c
    text:
      es: "General, porque el procedimiento abreviado solo se aplica a bases o valoraciones."
  - id: d
    correct: true
    text:
      es: "Abreviado, porque su cuantía es inferior a 6.000 euros."
  explanation:
    es: "Se tramitan por el procedimiento abreviado las reclamaciones de cuantía inferior a 6.000 euros, o a 72.000 si son contra bases o valoraciones (art. 64 RGRVA). 5.500 euros está por debajo de 6.000. El umbral de 3.000 no existe, el abreviado no es exclusivo de las bases y los 72.000 solo valen para bases o valoraciones."
  citation: "art. 64 RGRVA"
  difficulty: 2
  tags:
  - "supuesto"
  - "procedimiento abreviado"
  - "cuantía"
# anchor: boe-a-2005-8662-art-64
- id: m03-l14-q0144
  prompt:
    es: "Una sociedad reclama contra una liquidación que no es una base ni una valoración, por una cuantía exacta de 6.000 euros. Conforme al artículo 64 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, la reclamación se tramita por el procedimiento:"
  options:
  - id: a
    text:
      es: "Abreviado, porque el límite para este tipo de reclamación es de 72.000 euros."
  - id: b
    text:
      es: "General, porque el abreviado solo se aplica a las reclamaciones contra sanciones."
  - id: c
    text:
      es: "Abreviado, porque el abreviado se aplica hasta 6.000 euros inclusive."
  - id: d
    correct: true
    text:
      es: "General, porque el abreviado exige una cuantía inferior a 6.000 euros."
  explanation:
    es: "El artículo 64 exige cuantía inferior a 6.000 euros, de modo que una de exactamente 6.000 no entra en el abreviado y va por el general. No se aplica hasta 6.000 inclusive. Los 72.000 euros son el límite de las bases o valoraciones. Y el abreviado no se limita a las sanciones."
  citation: "art. 64 RGRVA"
  difficulty: 3
  tags:
  - "supuesto"
  - "procedimiento abreviado"
  - "cuantía"
# anchor: boe-a-2003-23186-art-231
- id: m03-l14-q0145
  prompt:
    es: "De acuerdo con los apartados 2 y 3 del artículo 231 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el Pleno está formado por el Presidente, los Vocales y el Secretario, y las Salas por el Presidente, un Vocal al menos y:"
  options:
  - id: a
    correct: true
    text:
      es: "El Secretario."
  - id: b
    text:
      es: "El Presidente de Sala suplente."
  - id: c
    text:
      es: "Un Abogado del Estado distinto del Secretario."
  - id: d
    text:
      es: "El Director General de Tributos."
  explanation:
    es: "Las Salas se forman con el Presidente, un Vocal al menos y el Secretario (art. 231.3). El Director General de Tributos no integra las salas, y no se exige un segundo Abogado del Estado ni un suplente."
  citation: "arts. 231.2 y 231.3 LGT"
  difficulty: 1
  tags:
  - "tribunales"
  - "composición"
# anchor: boe-a-2003-23186-da-duodecima
- id: m03-l14-q0146
  prompt:
    es: "Conforme a la disposición adicional duodécima de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los tribunales económico-administrativos actúa como Secretario:"
  options:
  - id: a
    text:
      es: "Un Interventor y Auditor del Estado."
  - id: b
    text:
      es: "Un Inspector de Hacienda del Estado."
  - id: c
    correct: true
    text:
      es: "Un Abogado del Estado."
  - id: d
    text:
      es: "Un Letrado del Consejo de Estado."
  explanation:
    es: "La disposición adicional duodécima indica que actúa como Secretario un Abogado del Estado. Los inspectores, los letrados del Consejo de Estado y los interventores no son quienes ejercen la secretaría."
  citation: "disposición adicional duodécima LGT"
  difficulty: 2
  tags:
  - "tribunales"
  - "nombramiento"
# anchor: boe-a-2005-8662-art-29
- id: m03-l14-q0150
  prompt:
    es: "Conforme a los artículos 29.7 y 30.9 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, el secretario de los tribunales económico-administrativos procede del cuerpo de:"
  options:
  - id: a
    text:
      es: "Inspectores de Hacienda del Estado."
  - id: b
    correct: true
    text:
      es: "Abogados del Estado."
  - id: c
    text:
      es: "Técnicos de Hacienda."
  - id: d
    text:
      es: "Letrados de la Administración de Justicia."
  explanation:
    es: "El secretario procede del Cuerpo de Abogados del Estado. Los técnicos de Hacienda, los letrados de la Administración de Justicia y los inspectores no son su cuerpo de procedencia."
  citation: "arts. 29.7 y 30.9 RGRVA"
  difficulty: 1
  tags:
  - "tribunales"
  - "secretario"
