# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q126
  prompt:
    es: "En Outlook 365, ¿qué debe escribirse en el cuadro de búsqueda para limitar los resultados a los correos enviados desde la dirección cheryl.parsons64@yahoo.com?"
  options:
  - id: a
    text:
      es: "asunto:cheryl.parsons64@yahoo.com"
  - id: b
    text:
      es: "cc:cheryl.parsons64@yahoo.com"
  - id: c
    text:
      es: "cheryl.parsons64@yahoo.com"
  - id: d
    correct: true
    text:
      es: "de:cheryl.parsons64@yahoo.com"
  explanation:
    es: "Para limitar a los correos de una dirección se escribe de: y la dirección. Escribir solo la dirección devuelve también los mensajes que la contienen en el asunto, el cuerpo o los adjuntos. asunto: busca en el asunto y cc: en la línea Cc."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q128
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda miguel Y tórrez, con el operador en mayúsculas, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Los elementos que contengan miguel, tórrez o ambos términos"
  - id: b
    text:
      es: "Los elementos que contengan miguel, pero no tórrez"
  - id: c
    correct: true
    text:
      es: "Los elementos con miguel y con tórrez, en cualquier orden"
  - id: d
    text:
      es: "Los elementos que contengan la frase exacta miguel tórrez, en ese orden"
  explanation:
    es: "El operador Y exige los dos términos, pero no un orden. Los elementos con miguel pero sin tórrez son lo que devuelve NO, que excluye el segundo término. Los elementos con miguel, tórrez o ambos son lo que devuelve O. La frase exacta miguel tórrez, en ese orden, exige comillas dobles: la tabla dice que, para buscar una cadena concreta, debe usar comillas."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q129
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda miguel NO tórrez, con el operador en mayúsculas, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Los elementos con miguel y sus variaciones, pero sin tórrez"
  - id: b
    text:
      es: "Los elementos que contengan miguel, tórrez o ambos términos"
  - id: c
    text:
      es: "Los elementos que contengan tanto miguel como tórrez"
  - id: d
    text:
      es: "Los elementos que contengan tórrez, pero no miguel"
  explanation:
    es: "NO deja los elementos con miguel y descarta los que contienen tórrez. Los elementos con miguel y tórrez a la vez son lo que devuelve Y, que exige ambos. Los que contienen tórrez pero no miguel invierten la búsqueda, porque la tabla dice miguel, pero no tórrez. Los que contienen miguel, tórrez o ambos son lo que devuelve O."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q130
  prompt:
    es: "En Outlook 365, ¿qué devuelve una búsqueda de dos palabras escritas sin operador entre ellas, como miguel tórrez, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Solo los elementos con la frase exacta miguel tórrez, en ese orden"
  - id: b
    text:
      es: "Solo los elementos que contengan miguel y no contengan tórrez"
  - id: c
    text:
      es: "Solo los elementos que contengan las dos palabras a la vez"
  - id: d
    correct: true
    text:
      es: "Los elementos con miguel o con tórrez, en cualquier orden"
  explanation:
    es: "Sin operador ni comillas, la tabla dice que la búsqueda devuelve miguel o bien tórrez, pero no necesariamente en ese orden. Pedir las dos palabras a la vez es el operador Y. La frase exacta en ese orden exige comillas dobles. Miguel sin tórrez es el operador NO."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q131
  prompt:
    es: "En Outlook 365, según la ayuda de Microsoft, los operadores lógicos Y, NO y O deben escribirse:"
  options:
  - id: a
    text:
      es: "Indistintamente en mayúsculas o en minúsculas"
  - id: b
    correct: true
    text:
      es: "En letras mayúsculas"
  - id: c
    text:
      es: "Solo con la inicial en mayúscula"
  - id: d
    text:
      es: "En letras minúsculas"
  explanation:
    es: "La ayuda dice que los operadores lógicos Y, NO y O se deben escribir en letras mayúsculas. No valen las minúsculas, ni la mezcla indistinta, ni la inicial sola."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q132
  prompt:
    es: "En Outlook 365, ¿cómo trata la búsqueda instantánea las mayúsculas y las minúsculas de las palabras que se escriben en el cuadro de búsqueda?"
  options:
  - id: a
    text:
      es: "Solo halla palabras que empiezan por mayúscula"
  - id: b
    text:
      es: "Distingue: solo halla los elementos que coinciden letra a letra"
  - id: c
    correct: true
    text:
      es: "No distingue entre mayúsculas y minúsculas"
  - id: d
    text:
      es: "Distingue solo en el asunto, no en el cuerpo del mensaje"
  explanation:
    es: "La ayuda dice que la búsqueda instantánea no distingue entre mayúsculas y minúsculas. Exigir coincidencia letra a letra, distinguir solo en el asunto o buscar solo palabras con inicial en mayúscula supone que sí las distingue, y esa frase lo contradice."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
