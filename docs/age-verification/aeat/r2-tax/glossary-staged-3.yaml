# Tax-part glossary entries, batch 3 (III.7–III.10), staged for the blind check.
- id: g-acta-de-inspeccion
  es: acta
  origin: m03-l08
  definition:
    es: Documento público que extiende la inspección de los tributos con el fin de recoger el resultado de las actuaciones
      inspectoras de comprobación e investigación, proponiendo la regularización que estime procedente de la situación tributaria
      del obligado o declarando correcta la misma (art. 143.2 LGT).
- id: g-efectos-timbrados
  es: efectos timbrados
  origin: m03-l09
  definition:
    es: El papel timbrado común, el papel timbrado de pagos al Estado, los documentos timbrados especiales, los timbres móviles
      y los aprobados por orden del Ministro de Economía y Hacienda (art. 39.1 RGR).
- id: g-fallido
  es: fallido
  origin: m03-l10
  definition:
    es: Obligado al pago respecto del cual se ignora la existencia de bienes o derechos embargables o realizables para el
      cobro del débito (art. 61.1 RGR).
- id: g-credito-incobrable
  es: crédito incobrable
  origin: m03-l10
  definition:
    es: Crédito que no ha podido hacerse efectivo en el procedimiento de apremio por resultar fallidos los obligados al pago
      (art. 61.1 RGR).
