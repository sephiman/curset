# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0128
  prompt:
    es: "Ramón Esteban presentó su autoliquidación del IRPF del ejercicio 2022 con resultado a ingresar. El plazo reglamentario de presentación terminó el viernes 30 de junio de 2023. Conforme a la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día comienza a contarse el plazo de prescripción del derecho de la Administración a determinar la deuda?"
  options:
  - id: a
    text:
      es: "Desde el 30 de junio de 2023."
  - id: b
    correct: true
    text:
      es: "Desde el 1 de julio de 2023."
  - id: c
    text:
      es: "Desde el 1 de enero de 2023."
  - id: d
    text:
      es: "Desde el 1 de julio de 2024."
  explanation:
    es: "El plazo del artículo 66.a) comienza desde el día siguiente a aquel en que finalice el plazo reglamentario de presentación de la declaración o autoliquidación (art. 67.1). Si termina el 30 de junio, empieza el 1 de julio de 2023. El propio último día no cuenta, el inicio del ejercicio no es el hito, y el 1 de julio de 2024 suma un año que la norma no concede."
  citation: "art. 67.1 LGT"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0129
  prompt:
    es: "De acuerdo con el artículo 68.2.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho de la Administración a exigir el pago se interrumpe por cualquier actuación fehaciente del obligado tributario conducente:"
  options:
  - id: a
    text:
      es: "a la liquidación o autoliquidación de la deuda tributaria."
  - id: b
    text:
      es: "a la devolución o al reembolso del coste de las garantías."
  - id: c
    correct: true
    text:
      es: "al pago o extinción de la deuda tributaria."
  - id: d
    text:
      es: "a la rectificación de su autoliquidación."
  explanation:
    es: "La letra c) del artículo 68.2 interrumpe el plazo de exigir el pago con la actuación fehaciente del obligado conducente al pago o extinción de la deuda. La conducente a liquidar o autoliquidar es la de determinar la deuda (art. 68.1.c), y las que pretenden devolución, reembolso o rectificación son las del derecho a solicitar devoluciones (art. 68.3)."
  citation: "art. 68.2 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0015
  prompt:
    es: "De acuerdo con el artículo 4.1 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, la obligación de expedir factura puede cumplirse mediante factura simplificada cuando su importe no exceda de:"
  options:
  - id: a
    correct: true
    text:
      es: "400 euros, Impuesto sobre el Valor Añadido incluido."
  - id: b
    text:
      es: "3.000 euros, Impuesto sobre el Valor Añadido incluido."
  - id: c
    text:
      es: "400 euros, Impuesto sobre el Valor Añadido excluido."
  - id: d
    text:
      es: "1.000 euros, Impuesto sobre el Valor Añadido incluido."
  explanation:
    es: "El artículo 4.1.a) permite la factura simplificada cuando el importe no exceda de 400 euros, IVA incluido. Los 3.000 euros solo valen para las operaciones enumeradas en el artículo 4.2. El límite se mide con el impuesto incluido, no excluido, y 1.000 euros no es cifra de este reglamento."
  citation: "art. 4.1 RD 1619/2012"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0019
  prompt:
    es: "De acuerdo con el artículo 43.1.h) de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los responsables subsidiarios del control efectivo o de la voluntad rectora común con el obligado tributario:"
  options:
  - id: a
    text:
      es: "Responden las personas o entidades controladas o con voluntad rectora común creadas o utilizadas de forma abusiva o fraudulenta, pero la responsabilidad no se extiende a las sanciones."
  - id: b
    correct: true
    text:
      es: "Responden las personas o entidades controladas o con voluntad rectora común creadas o utilizadas de forma abusiva o fraudulenta para eludir la responsabilidad patrimonial universal, y la responsabilidad se extiende a las sanciones."
  - id: c
    text:
      es: "Responden como solidarios las personas o entidades controladas o con voluntad rectora común creadas o utilizadas de forma abusiva o fraudulenta, y la responsabilidad se extiende a las sanciones."
  - id: d
    text:
      es: "Responden las personas o entidades controladas o con voluntad rectora común, siempre que sea bastante el control efectivo, sin que deba acreditarse el abuso o fraude."
  explanation:
    es: "El artículo 43.1.h) los configura como responsables subsidiarios, exige que hayan sido creados o utilizados de forma abusiva o fraudulenta como medio de elusión de la responsabilidad patrimonial universal y extiende expresamente la responsabilidad a las sanciones. Negar la extensión a sanciones o hacerlos solidarios contradice el precepto, y prescindir de acreditar el abuso o el fraude suprime una condición del texto."
  citation: "art. 43.1.h) LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2007-15984-art-20
- id: m03-l04-q0021
  prompt:
    es: "Mirela Popescu, de nacionalidad rumana, va a realizar en España una operación con trascendencia tributaria y no tiene número de identidad de extranjero. Conforme al Real Decreto 1065/2007, de 27 de julio, del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿qué debe hacer?"
  options:
  - id: a
    text:
      es: "Utilizar el número de su pasaporte, que la Administración tributaria reconoce como identificativo fiscal."
  - id: b
    text:
      es: "Solicitar a la Administración tributaria un número de nueve caracteres cuya letra inicial será la L."
  - id: c
    text:
      es: "Esperar a que la Administración tributaria le asigne de oficio el número, sin solicitarlo."
  - id: d
    correct: true
    text:
      es: "Solicitar a la Administración tributaria un número de nueve caracteres cuya letra inicial será la M."
  explanation:
    es: "Las personas físicas sin nacionalidad española y sin número de identidad de extranjero deben solicitar a la Administración tributaria, cuando vayan a realizar operaciones de trascendencia tributaria, un número de nueve caracteres con la M como letra inicial (art. 20.2). La L corresponde a los españoles residentes en el extranjero. El pasaporte no es el número fiscal y la norma obliga a solicitarlo, no a esperar su asignación."
  citation: "art. 20.2 RGAT"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0023
  prompt:
    es: "Según la disposición adicional sexta.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quién facilita el número de identificación fiscal a las personas físicas y jurídicas?"
  options:
  - id: a
    text:
      es: "La Administración General del Estado, solo a instancia del interesado."
  - id: b
    text:
      es: "La Administración tributaria de la comunidad autónoma de su domicilio fiscal."
  - id: c
    correct: true
    text:
      es: "La Administración General del Estado, de oficio o a instancia del interesado."
  - id: d
    text:
      es: "El Registro Civil o el Registro Mercantil, según se trate de personas físicas o jurídicas."
  explanation:
    es: "La disposición adicional sexta.1 dice que la Administración General del Estado facilita el número de identificación fiscal, de oficio o a instancia del interesado. Limitarlo a la solicitud del interesado elimina la asignación de oficio. La ley no encomienda su asignación a las comunidades autónomas ni a los registros públicos."
  citation: "disposición adicional sexta.1 LGT"
  difficulty: 1
  tags:
  - "órgano"
  - "sujeto"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0025
  prompt:
    es: "De acuerdo con el artículo 68.5 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los libros registro de quienes ejercen actividades profesionales en estimación directa:"
  options:
  - id: a
    correct: true
    text:
      es: "Entre ellos figura el libro registro de provisiones de fondos y suplidos."
  - id: b
    text:
      es: "Llevan el libro registro de ventas e ingresos y el de compras y gastos, no el de bienes de inversión."
  - id: c
    text:
      es: "Solo los de la modalidad simplificada llevan el libro registro de provisiones de fondos y suplidos."
  - id: d
    text:
      es: "Llevan los libros registro de ventas e ingresos, de compras y gastos y de bienes de inversión."
  explanation:
    es: "Los profesionales en estimación directa, en cualquier modalidad, llevan cuatro libros: ingresos, gastos, bienes de inversión y provisiones de fondos y suplidos (art. 68.5). Ese último solo lo tienen los profesionales. El libro de bienes de inversión sí es obligatorio para ellos, y los de ventas e ingresos y de compras y gastos son los de las actividades empresariales del artículo 68.3."
  citation: "art. 68.5 RIRPF"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0026
  prompt:
    es: "Señale la respuesta CORRECTA sobre las ventas al por menor a las que se refiere el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación:"
  options:
  - id: a
    text:
      es: "Son también las entregas de bienes que, por su envasado o presentación, son principalmente de utilización empresarial."
  - id: b
    correct: true
    text:
      es: "Son entregas de bienes muebles corporales o semovientes en las que el destinatario actúa como consumidor final."
  - id: c
    text:
      es: "Solo lo son las realizadas por quien no fabrica ni elabora los productos entregados."
  - id: d
    text:
      es: "Son las entregas en las que el destinatario actúa como empresario o profesional, si su importe no excede de 400 euros."
  explanation:
    es: "El reglamento define las ventas al por menor como entregas de bienes muebles corporales o semovientes cuyo destinatario no actúa como empresario o profesional, sino como consumidor final, incluso si las hacen fabricantes o elaboradores. Los bienes de uso principalmente empresarial por su envasado o presentación quedan fuera, y el destinatario empresario también."
  citation: "art. 4.2 RD 1619/2012"
  difficulty: 2
  tags:
  - "definición"
  - "requisito"
# anchor: boe-a-2003-23186-art-38
- id: m03-l04-q0036
  prompt:
    es: "Talleres Beltrán, S.A. presta un servicio sujeto a IVA a Carlos Mena, que no es empresario, y repercute la cuota en la factura. Carlos no la ingresa en la Administración. De acuerdo con el artículo 38.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué obligación tiene Carlos respecto de la cuota?"
  options:
  - id: a
    text:
      es: "Debe ingresar la cuota repercutida en la Administración tributaria, como sujeto pasivo del impuesto."
  - id: b
    text:
      es: "Debe ingresar la cuota en la Administración tributaria y responde subsidiariamente frente a Talleres Beltrán."
  - id: c
    correct: true
    text:
      es: "Debe satisfacer el importe de la cuota repercutida a Talleres Beltrán, sin estar obligado al pago frente a la Administración tributaria."
  - id: d
    text:
      es: "No debe satisfacer la cuota a nadie, porque quien repercute asume el pago frente a la Administración."
  explanation:
    es: "El obligado a soportar la repercusión, Carlos, no tiene obligación de pago frente a la Administración tributaria, pero debe satisfacer al sujeto pasivo, aquí Talleres Beltrán, el importe de la cuota repercutida (art. 38.2). El sujeto pasivo es quien repercute y ingresa. Las otras opciones le atribuyen un pago a la Administración o liberan al repercutido de pagar la cuota a quien la repercute."
  citation: "art. 38.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0038
  prompt:
    es: "Según el artículo 68.4 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, ¿qué libros registro llevan quienes desarrollan actividades empresariales cuyo rendimiento se determina en la modalidad simplificada del método de estimación directa?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de ventas e ingresos, compras y gastos, y bienes de inversión."
  - id: b
    text:
      es: "Los de ingresos, gastos, bienes de inversión y provisiones de fondos y suplidos."
  - id: c
    text:
      es: "Solo los de ventas e ingresos y de compras y gastos."
  - id: d
    text:
      es: "Ninguno, porque su obligación se limita a la contabilidad ajustada al Código de Comercio."
  explanation:
    es: "El artículo 68.4 remite a los libros del artículo 68.3: ventas e ingresos, compras y gastos, y bienes de inversión. El libro de provisiones de fondos y suplidos solo lo llevan los profesionales (art. 68.5). El de bienes de inversión también es obligatorio, y la contabilidad mercantil es la regla de la modalidad normal (art. 68.2), no de la simplificada."
  citation: "art. 68.4 RIRPF"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2007-15984-art-3
- id: m03-l04-q0039
  prompt:
    es: "Inmobiliaria Soto, S.A. tuvo en el año natural 2024 un volumen de operaciones, calculado conforme al artículo 121 de la Ley del IVA, de exactamente 6.010.121,04 euros. Conforme al Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿forma parte en 2025 del Registro de grandes empresas?"
  options:
  - id: a
    text:
      es: "Sí, porque su volumen de operaciones del año natural anterior alcanza 6.010.121,04 euros."
  - id: b
    correct: true
    text:
      es: "No, porque su volumen de operaciones del año natural anterior no supera 6.010.121,04 euros."
  - id: c
    text:
      es: "Sí, porque cualquier sociedad anónima forma parte del Registro de grandes empresas."
  - id: d
    text:
      es: "No, porque el Registro de grandes empresas solo incluye a quienes operan fuera del territorio de aplicación del impuesto."
  explanation:
    es: "El Registro de grandes empresas lo forman los obligados cuyo volumen de operaciones supere 6.010.121,04 euros durante el año natural inmediato anterior (art. 3.5). Alcanzar la cifra no es superarla. La forma societaria no decide, y la norma incluye a quienes operan también fuera del territorio de aplicación del impuesto, sin limitarse a ellos."
  citation: "art. 3.5 RGAT"
  difficulty: 3
  tags:
  - "cantidad"
  - "condición"
# anchor: boe-a-2003-23186-art-45
- id: m03-l04-q0058
  prompt:
    es: "¿Quiénes actúan por las personas que carezcan de capacidad de obrar en el orden tributario según el artículo 45.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Un asesor fiscal designado de oficio por la Administración tributaria."
  - id: b
    text:
      es: "El Ministerio Fiscal, en todo caso."
  - id: c
    correct: true
    text:
      es: "Sus representantes legales."
  - id: d
    text:
      es: "Cualquiera de sus familiares, sin necesidad de acreditar la representación."
  explanation:
    es: "El artículo 45.1 es directo: por las personas sin capacidad de obrar actúan sus representantes legales. La norma no prevé asesor de oficio ni intervención automática del Ministerio Fiscal, y la representación debe acreditarse, sin que un familiar pueda actuar sin hacerlo."
  citation: "art. 45.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-45
- id: m03-l04-q0059
  prompt:
    es: "De acuerdo con el artículo 45.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, por las personas jurídicas actúan las personas que ostenten la titularidad de los órganos a quienes corresponda su representación, por disposición de la ley o por acuerdo válidamente adoptado, en el momento en que:"
  options:
  - id: a
    text:
      es: "se constituyó la persona jurídica."
  - id: b
    text:
      es: "se devengó el tributo al que se refiere la actuación."
  - id: c
    text:
      es: "se nombró a los titulares de esos órganos."
  - id: d
    correct: true
    text:
      es: "se produzcan las actuaciones tributarias."
  explanation:
    es: "El artículo 45.2 mira al momento de las actuaciones: actúa quien ostente entonces la titularidad del órgano representante. La fecha de constitución de la sociedad, la del devengo y la del nombramiento de los titulares no son el criterio del precepto."
  citation: "art. 45.2 LGT"
  difficulty: 1
  tags:
  - "fecha"
  - "sujeto"
# anchor: boe-a-2003-23186-art-45
- id: m03-l04-q0060
  prompt:
    es: "La comunidad de bienes Herederos de Ibarra no ha designado representante ante la Administración tributaria. Uno de sus comuneros, Julián Ibarra, es quien aparentemente ejerce la gestión y dirección. Conforme a la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién se considera su representante?"
  options:
  - id: a
    text:
      es: "A cualquiera de los comuneros, aunque haya otro que aparentemente ejerza la gestión."
  - id: b
    correct: true
    text:
      es: "A Julián Ibarra, por ser quien aparentemente ejerce la gestión o dirección."
  - id: c
    text:
      es: "Al comunero de mayor edad, que ostenta la representación por disposición de la ley."
  - id: d
    text:
      es: "A nadie, y las actuaciones deben suspenderse hasta que la entidad designe representante."
  explanation:
    es: "Por los entes del artículo 35.4 actúa quien ostente la representación, acreditada fehacientemente. De no haberse designado, se considera representante el que aparentemente ejerza la gestión o dirección y, solo en su defecto, cualquiera de sus miembros o partícipes (art. 45.3). Julián ocupa el primer lugar de ese orden. La edad no es criterio, y la falta de designación no paraliza las actuaciones."
  citation: "art. 45.3 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2007-15984-art-110
- id: m03-l04-q0061
  prompt:
    es: "De acuerdo con el artículo 110.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, una vez adquirida o recuperada la capacidad de obrar, las personas físicas actúan por sí mismas ante la Administración tributaria:"
  options:
  - id: a
    text:
      es: "salvo para la comprobación de la situación tributaria del período en que carecían de ella."
  - id: b
    text:
      es: "solo respecto de las obligaciones tributarias nacidas con posterioridad."
  - id: c
    correct: true
    text:
      es: "incluso para la comprobación de la situación tributaria en que carecían de ella."
  - id: d
    text:
      es: "siempre que hayan comunicado antes la extinción de la representación legal."
  explanation:
    es: "El artículo 110.1 dispone que, recuperada o adquirida la capacidad, el obligado actúa por sí mismo, incluso para comprobar la situación tributaria del período en que carecía de ella. No excluye esa comprobación, no limita su actuación a las obligaciones posteriores y no la condiciona a una comunicación previa de la extinción."
  citation: "art. 110.1 RGAT"
  difficulty: 2
  tags:
  - "sujeto"
  - "efecto"
