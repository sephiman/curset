# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0092
  prompt:
    es: "Un funcionario de la Administración tributaria comunica a un conocido los datos tributarios de un vecino. Con independencia de las responsabilidades penales o civiles, ¿cómo califica el artículo 95.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción de ese deber de sigilo?"
  options:
  - id: a
    text:
      es: "Como infracción tributaria grave sancionable con multa proporcional."
  - id: b
    text:
      es: "Como falta disciplinaria cuya gravedad fija cada Administración en su régimen interno."
  - id: c
    correct: true
    text:
      es: "Siempre como falta disciplinaria muy grave."
  - id: d
    text:
      es: "Como falta disciplinaria muy grave solo si media precio o ánimo de lucro."
  explanation:
    es: "El artículo 95.3 considera la infracción del deber de sigilo siempre falta disciplinaria muy grave, sin condicionarla a precio ni ánimo de lucro, y sin remitir su gravedad a cada Administración. No es una infracción tributaria."
  citation: "art. 95.3 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "sigilo"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0093
  prompt:
    es: "De acuerdo con el artículo 95.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria adoptará las medidas necesarias para garantizar:"
  options:
  - id: a
    correct: true
    text:
      es: "la confidencialidad de la información tributaria y su uso adecuado."
  - id: b
    text:
      es: "la gratuidad de la información tributaria y su acceso por internet."
  - id: c
    text:
      es: "la conservación de la información tributaria durante diez años."
  - id: d
    text:
      es: "la publicidad de la información tributaria y su difusión periódica."
  explanation:
    es: "El artículo 95.3 impone garantizar la confidencialidad de la información y su uso adecuado. La gratuidad pertenece al artículo 86.4, la conservación durante diez años no figura en el precepto y la publicidad se opone al carácter reservado."
  citation: "art. 95.3 LGT"
  difficulty: 1
  tags:
  - "carácter reservado"
  - "confidencialidad"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0094
  prompt:
    es: "Conforme al artículo 95.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las autoridades o funcionarios que tengan conocimiento de los datos, informes o antecedentes reservados están obligados al más estricto y completo sigilo, salvo:"
  options:
  - id: a
    correct: true
    text:
      es: "en los casos citados en el artículo 95.1 como supuestos de cesión."
  - id: b
    text:
      es: "cuando el obligado tributario afectado los solicite por escrito."
  - id: c
    text:
      es: "cuando los conozcan en el curso de un procedimiento de inspección."
  - id: d
    text:
      es: "cuando el responsable del órgano autorice expresamente su comunicación."
  explanation:
    es: "El sigilo cede solo en los casos citados, que son las cesiones de la lista del artículo 95.1. La solicitud del obligado, el procedimiento de inspección y la autorización del responsable del órgano no figuran como excepciones."
  citation: "art. 95.3 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "sigilo"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0095
  prompt:
    es: "Según el artículo 95.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el carácter reservado de los datos con trascendencia tributaria no impedirá su publicidad cuando esta se derive de:"
  options:
  - id: a
    text:
      es: "una resolución de la Dirección General de la Agencia Tributaria."
  - id: b
    text:
      es: "la solicitud de cualquier ciudadano que invoque el derecho de acceso."
  - id: c
    text:
      es: "una orden de los órganos de gobierno de las comunidades autónomas."
  - id: d
    correct: true
    text:
      es: "la normativa de la Unión Europea."
  explanation:
    es: "El artículo 95.4 salva la publicidad que derive de la normativa de la Unión Europea. Una resolución del Director General, el derecho de acceso de cualquier ciudadano o una orden autonómica no levantan por sí solos el carácter reservado."
  citation: "art. 95.4 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "publicidad"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0097
  prompt:
    es: "Según el artículo 95 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los listados de deudores a la Hacienda Pública incluyen también a quienes tengan esa condición al haber sido declarados responsables:"
  options:
  - id: a
    correct: true
    text:
      es: "solidarios, por deudas o sanciones tributarias."
  - id: b
    text:
      es: "subsidiarios, por deudas o sanciones tributarias."
  - id: c
    text:
      es: "solidarios, pero solo por deudas tributarias y no por sanciones."
  - id: d
    text:
      es: "subsidiarios, siempre que hayan sido declarados fallidos los deudores principales."
  explanation:
    es: "El artículo 95 bis.1 incluye a los deudores que lo son por haber sido declarados responsables solidarios, por deudas o sanciones. Los responsables subsidiarios no se mencionan y la ley no excluye las sanciones."
  citation: "art. 95 bis.1 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "sujetos"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0098
  prompt:
    es: "A 31 de diciembre de 2025, Construcciones Alba, S.A., debe 450.000 euros de deudas y 200.000 euros de sanciones tributarias, sin pagar tras el plazo de ingreso en período voluntario y sin que ninguna esté aplazada o suspendida. Según el artículo 95 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cumple el requisito de importe para figurar en el listado de deudores?"
  options:
  - id: a
    text:
      es: "No, porque ni las deudas ni las sanciones superan por separado los 600.000 euros."
  - id: b
    text:
      es: "No, porque solo se computan las deudas tributarias y estas suman 450.000 euros."
  - id: c
    correct: true
    text:
      es: "Sí, porque el importe total de deudas y sanciones pendientes de ingreso es de 650.000 euros y supera los 600.000."
  - id: d
    text:
      es: "Sí, pero solo si las sanciones, consideradas por sí solas, superan los 150.000 euros."
  explanation:
    es: "El requisito se refiere al importe total de deudas y sanciones pendientes de ingreso: 450.000 más 200.000 son 650.000 euros, que superan los 600.000. No se aprecia cada concepto por separado y las sanciones también cuentan. El umbral de 150.000 euros no existe."
  citation: "art. 95 bis.1 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0100
  prompt:
    es: "Una sociedad tiene pendientes de ingreso, a 31 de diciembre de 2025, deudas y sanciones tributarias por un importe total de exactamente 600.000 euros, sin aplazar ni suspender y vencido el plazo voluntario. Conforme al artículo 95 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿se incluye en el listado?"
  options:
  - id: a
    text:
      es: "Sí, porque el importe total alcanza los 600.000 euros que exige la ley."
  - id: b
    text:
      es: "Sí, porque a partir de 600.000 euros se incluye al deudor si el plazo voluntario venció."
  - id: c
    correct: true
    text:
      es: "No, porque el importe total debe superar los 600.000 euros y aquí los iguala."
  - id: d
    text:
      es: "No, porque solo se incluyen los deudores cuya deuda supere los 900.000 euros."
  explanation:
    es: "La ley pide que el importe total supere los 600.000 euros. Un importe igual no lo supera. Entender que basta alcanzar los 600.000 euros, o que se incluye a partir de esa cifra, lee «alcance» donde la ley dice «supere», y el umbral de 900.000 euros es inventado."
  citation: "art. 95 bis.1 LGT"
  difficulty: 3
  tags:
  - "listados de deudores"
  - "cómputo"
  - "importe"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0102
  prompt:
    es: "De acuerdo con el artículo 95 bis.1.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, para figurar en el listado de deudores las deudas o sanciones tributarias no deben haber sido pagadas transcurrido:"
  options:
  - id: a
    text:
      es: "el plazo de pago concedido en la providencia de apremio."
  - id: b
    correct: true
    text:
      es: "el plazo original de ingreso en período voluntario."
  - id: c
    text:
      es: "el plazo de cuatro años de prescripción del derecho de cobro."
  - id: d
    text:
      es: "el plazo de un año desde la notificación de la liquidación."
  explanation:
    es: "La letra b) exige que las deudas o sanciones no se hayan pagado una vez vencido el plazo original de ingreso en período voluntario. El plazo de la providencia de apremio, la prescripción y un año desde la liquidación no son el criterio de la ley."
  citation: "art. 95 bis.1 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "requisito"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0103
  prompt:
    es: "¿Cuál de las siguientes circunstancias exige el artículo 95 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para incluir a un deudor en los listados de deudores a la Hacienda Pública?"
  options:
  - id: a
    text:
      es: "Que haya sido sancionado por infracción tributaria grave en los últimos cuatro años por la Administración."
  - id: b
    text:
      es: "Que mantenga deudas en período ejecutivo con recargo del 20 por ciento."
  - id: c
    correct: true
    text:
      es: "Que el importe de las deudas y sanciones pendientes de ingreso supere los 600.000 euros."
  - id: d
    text:
      es: "Que haya sido declarado fallido por la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "El artículo 95 bis.1 exige que el importe total supere 600.000 euros y que no se haya pagado en el plazo voluntario. Una sanción grave reciente, el recargo ejecutivo del 20 por ciento y la declaración de fallido no son requisitos de inclusión."
  citation: "art. 95 bis.1 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "requisito"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0104
  prompt:
    es: "Conforme al artículo 95 bis.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los listados de deudores se incluye la identificación de las personas físicas mediante su:"
  options:
  - id: a
    text:
      es: "nombre, apellidos, NIF y domicilio fiscal."
  - id: b
    correct: true
    text:
      es: "nombre, apellidos y NIF."
  - id: c
    text:
      es: "nombre, apellidos y fecha de nacimiento."
  - id: d
    text:
      es: "apellidos, NIF y actividad económica principal."
  explanation:
    es: "Para las personas físicas el listado recoge nombre, apellidos y NIF. No incluye el domicilio fiscal, la fecha de nacimiento ni la actividad económica."
  citation: "art. 95 bis.2 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "contenido"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0105
  prompt:
    es: "Según el artículo 95 bis.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los listados de deudores las personas jurídicas y las entidades del artículo 35.4 se identifican mediante:"
  options:
  - id: a
    text:
      es: "su denominación social y su domicilio fiscal."
  - id: b
    text:
      es: "su razón social y la identificación de sus administradores."
  - id: c
    text:
      es: "su NIF y la cifra de negocios del último ejercicio."
  - id: d
    correct: true
    text:
      es: "su razón o denominación social completa y su NIF."
  explanation:
    es: "Las personas jurídicas y entidades del artículo 35.4 se identifican por su razón o denominación social completa y su NIF. El domicilio fiscal, los administradores y la cifra de negocios no figuran."
  citation: "art. 95 bis.2 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "contenido"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0106
  prompt:
    es: "De acuerdo con el artículo 95 bis.2.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, además de la identificación de los deudores, los listados incluyen:"
  options:
  - id: a
    text:
      es: "el detalle de cada deuda y de cada sanción con su fecha de vencimiento y su concepto."
  - id: b
    correct: true
    text:
      es: "el importe conjunto de las deudas y sanciones pendientes de pago tenidas en cuenta a efectos de la publicación."
  - id: c
    text:
      es: "el importe de las deudas aplazadas o suspendidas que no se hayan tenido en cuenta."
  - id: d
    text:
      es: "la indicación de los recursos o reclamaciones que el deudor haya interpuesto."
  explanation:
    es: "El listado recoge el importe conjunto de lo pendiente de pago tenido en cuenta para la publicación. No detalla cada deuda con su vencimiento, no incluye las aplazadas o suspendidas, que quedan fuera, y no informa de recursos o reclamaciones."
  citation: "art. 95 bis.2 LGT"
  difficulty: 3
  tags:
  - "listados de deudores"
  - "contenido"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0108
  prompt:
    es: "Ferretería Costa, S.L., debía 900.000 euros a 31 de diciembre de 2025, sin aplazar ni suspender. Le comunican la propuesta de inclusión en el listado y, dentro del plazo de alegaciones, paga la totalidad de la cantidad adeudada a esa fecha. Según el artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿se incluye en el listado?"
  options:
  - id: a
    text:
      es: "Sí, porque los requisitos se aprecian a la fecha de referencia y el pago posterior no los modifica."
  - id: b
    text:
      es: "No, pero solo si además abona un recargo del 5 por ciento sobre la cantidad adeudada."
  - id: c
    text:
      es: "Sí, aunque en el listado se hará constar que la deuda ha sido pagada."
  - id: d
    correct: true
    text:
      es: "No, porque pagó la totalidad de lo adeudado a la fecha de referencia antes de que finalizara el plazo para formular alegaciones."
  explanation:
    es: "Si los deudores pagan la totalidad de la cantidad adeudada a la fecha de referencia antes de que termine el plazo de alegaciones, no se incluyen (art. 95 bis.4). El pago en ese plazo sí cambia el resultado, no se exige recargo y no hay una mención de deuda pagada."
  citation: "art. 95 bis.4 LGT"
  difficulty: 3
  tags:
  - "listados de deudores"
  - "pago"
  - "alegaciones"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0109
  prompt:
    es: "De acuerdo con el artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el deudor al que se comunica la propuesta de inclusión en el listado puede formular alegaciones en el plazo de 10 días, contados:"
  options:
  - id: a
    text:
      es: "a partir de la fecha de la propuesta de inclusión."
  - id: b
    text:
      es: "a partir del día siguiente al de publicación del acuerdo en el «Boletín Oficial del Estado»."
  - id: c
    correct: true
    text:
      es: "a partir del siguiente al de recepción de la comunicación."
  - id: d
    text:
      es: "a partir del 31 de diciembre del año anterior al del acuerdo."
  explanation:
    es: "El plazo de diez días se cuenta desde el siguiente al de la recepción de la comunicación. No parte de la fecha de la propuesta, de una publicación en el Boletín Oficial del Estado ni de la fecha de referencia."
  citation: "art. 95 bis.4 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "alegaciones"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0110
  prompt:
    es: "Conforme al artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para entender realizada la comunicación de la propuesta de inclusión en el listado basta con que la Administración acredite:"
  options:
  - id: a
    text:
      es: "dos intentos de notificación con el texto íntegro de la comunicación en el domicilio fiscal del interesado, en días distintos."
  - id: b
    correct: true
    text:
      es: "un intento de notificación con el texto íntegro de la comunicación en el domicilio fiscal del interesado."
  - id: c
    text:
      es: "la publicación de un anuncio en el «Boletín Oficial del Estado» citando al interesado."
  - id: d
    text:
      es: "la puesta a disposición de la comunicación en la dirección electrónica habilitada."
  explanation:
    es: "Basta acreditar un intento de notificación con el texto íntegro en el domicilio fiscal. No se exigen dos intentos, ni la publicación del anuncio, que sigue a los intentos fallidos en la notificación por comparecencia, ni la puesta a disposición electrónica."
  citation: "art. 95 bis.4 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "comunicación"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0111
  prompt:
    es: "De acuerdo con el artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las alegaciones del deudor a la propuesta de inclusión en el listado:"
  options:
  - id: a
    text:
      es: "Podrán referirse a la procedencia de la deuda y a la validez de las liquidaciones de las que derive."
  - id: b
    text:
      es: "Podrán referirse a cualquier circunstancia que afecte a la situación económica del deudor."
  - id: c
    text:
      es: "Habrán de referirse exclusivamente a la existencia de recursos pendientes de resolución."
  - id: d
    correct: true
    text:
      es: "Habrán de referirse exclusivamente a errores materiales, de hecho o aritméticos en los requisitos del apartado 1 o a los pagos efectuados."
  explanation:
    es: "Las alegaciones se limitan a errores materiales, de hecho o aritméticos sobre los requisitos del apartado 1 o a los pagos efectuados. No sirven para discutir la procedencia de la deuda, que se impugna por su vía, ni la situación económica, ni los recursos pendientes."
  citation: "art. 95 bis.4 LGT"
  difficulty: 2
  tags:
  - "listados de deudores"
  - "alegaciones"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0112
  prompt:
    es: "Según el artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la fecha de publicación del listado de deudores, que deberá producirse en todo caso durante el primer semestre de cada año, se establece mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "orden ministerial."
  - id: b
    text:
      es: "resolución del Director General de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "acuerdo del Consejo de Ministros a propuesta del Ministerio de Hacienda."
  - id: d
    text:
      es: "instrucción de la Subdirección General de Recaudación."
  explanation:
    es: "La orden ministerial fija la fecha de publicación, que ha de caer en el primer semestre. Ni el Director General de la Agencia, ni el Consejo de Ministros, ni una instrucción de una subdirección tienen esa competencia en el artículo."
  citation: "art. 95 bis.4 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "publicación"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0113
  prompt:
    es: "De acuerdo con el artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la fecha de publicación del listado de deudores deberá producirse, en todo caso, durante:"
  options:
  - id: a
    correct: true
    text:
      es: "el primer semestre de cada año."
  - id: b
    text:
      es: "el primer trimestre de cada año."
