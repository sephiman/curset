  explanation:
    es: "El reflejo triple escribe tres copias y «necesita al menos tres dominios de error de hardware», que con Espacios de almacenamiento directo son tres servidores. Dos dominios de error son el mínimo del reflejo bidireccional, no el del triple. Cuatro dominios de error son el mínimo de la paridad dual, no el del reflejo triple. La página fija el mínimo del reflejo triple en tres dominios de error, no en seis."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q217
  prompt:
    es: "En Espacios de almacenamiento directo, ¿cuántos errores de hardware a la vez tolera la paridad única, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "Dos errores a la vez."
  - id: b
    text:
      es: "Tres errores a la vez."
  - id: c
    text:
      es: "Ningún error."
  - id: d
    correct: true
    text:
      es: "Un solo error cada vez."
  explanation:
    es: "La paridad única mantiene un solo símbolo de paridad y, según la página, da «tolerancia a errores frente a un solo error cada vez». Dos errores a la vez es lo que tolera la paridad dual, y también el reflejo triple: «hasta dos errores a la vez». Tres errores no es la cifra que la página da a ninguna resiliencia. Y «ningún error» contradice que la paridad única sí proporciona tolerancia a errores."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 2
