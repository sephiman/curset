# anchor: boe-a-1978-31229-art-153
- id: m01-l04-q0060
  prompt:
    es: "De acuerdo con el artículo 153 de la Constitución Española de 1978, el control del ejercicio de funciones delegadas en las Comunidades Autónomas por ley orgánica del Estado se ejercerá:"
  options:
  - id: a
    text:
      es: "Por el Tribunal Constitucional, previo requerimiento del Gobierno."
  - id: b
    text:
      es: "Por el Tribunal de Cuentas, previo informe de las Cortes Generales."
  - id: c
    text:
      es: "Por la jurisdicción contencioso-administrativa, a instancia del Gobierno."
  - id: d
    correct: true
    text:
      es: "Por el Gobierno, previo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 153.b) atribuye «al Gobierno, previo dictamen del Consejo de Estado», el control «del ejercicio de funciones delegadas a que se refiere el apartado 2 del artículo 150». El Tribunal Constitucional controla las normas con fuerza de ley. El Tribunal de Cuentas, lo económico y presupuestario. La jurisdicción contencioso-administrativa, la administración autónoma y sus reglamentos."
  citation: "art. 153.b) CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-153
- id: m01-l04-q0061
  prompt:
    es: "Señale la respuesta correcta sobre el control que ejerce el Tribunal Constitucional sobre la actividad de los órganos de las Comunidades Autónomas, según la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Controla la constitucionalidad de sus disposiciones normativas con fuerza de ley."
  - id: b
    text:
      es: "Controla la administración autónoma y sus normas reglamentarias."
  - id: c
    text:
      es: "Controla la actividad económica y presupuestaria de la Comunidad Autónoma."
  - id: d
    text:
      es: "Controla el ejercicio de las funciones delegadas por el Estado."
  explanation:
    es: "El artículo 153.a) atribuye al Tribunal Constitucional el control «relativo a la constitucionalidad de sus disposiciones normativas con fuerza de ley». La administración autónoma y sus reglamentos los controla la jurisdicción contencioso-administrativa. Lo económico y presupuestario, el Tribunal de Cuentas. Las funciones delegadas, el Gobierno previo dictamen del Consejo de Estado."
  citation: "art. 153.a) CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-153
- id: m01-l04-q0066
  prompt:
    es: "Según el artículo 153 de la Constitución Española de 1978, el control económico y presupuestario de la actividad de los órganos de las Comunidades Autónomas se ejerce:"
  options:
  - id: a
    correct: true
    text:
      es: "Por el Tribunal de Cuentas."
  - id: b
    text:
      es: "Por el Tribunal Constitucional."
  - id: c
    text:
      es: "Por el Gobierno, previo dictamen del Consejo de Estado."
  - id: d
    text:
      es: "Por la jurisdicción contencioso-administrativa."
  explanation:
    es: "El control económico y presupuestario corresponde al Tribunal de Cuentas. El Tribunal Constitucional controla la constitucionalidad de las disposiciones con fuerza de ley. El Gobierno, previo dictamen del Consejo de Estado, controla las funciones delegadas por ley orgánica. La jurisdicción contencioso-administrativa controla la administración autónoma y sus normas reglamentarias."
  citation: "art. 153.d) CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-140
- id: m01-l04-q0068
  prompt:
    es: "De acuerdo con el artículo 140 de la Constitución Española de 1978, el gobierno y la administración de los municipios corresponde:"
  options:
  - id: a
    text:
      es: "A sus respectivos Plenos, integrados por los Concejales y presididos por el Alcalde."
  - id: b
    correct: true
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales."
  - id: c
    text:
      es: "A sus respectivos Ayuntamientos, integrados por los Alcaldes y los Tenientes de Alcalde."
  - id: d
    text:
      es: "A las Diputaciones Provinciales, integradas por los Presidentes y los Diputados."
  explanation:
    es: "El artículo 140 CE dice que el gobierno y la administración de los municipios «corresponde a sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales». El Pleno es un órgano del Ayuntamiento, no el titular de su gobierno. Los Tenientes de Alcalde no sustituyen a los Concejales en esa fórmula. La Diputación gobierna la provincia, no el municipio."
  citation: "art. 140 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1978-31229-art-140
- id: m01-l04-q0072
  prompt:
    es: "De acuerdo con el artículo 140 de la Constitución Española de 1978, la ley regulará las condiciones en las que proceda:"
  options:
  - id: a
    text:
      es: "La fusión de municipios limítrofes."
  - id: b
    text:
      es: "La creación de mancomunidades de municipios."
  - id: c
    correct: true
    text:
      es: "El régimen del concejo abierto."
  - id: d
    text:
      es: "La disolución de los Ayuntamientos."
  explanation:
    es: "El artículo 140 remite a la ley la regulación de las condiciones en que proceda el régimen del concejo abierto. La fusión de municipios, las mancomunidades y la disolución de los Ayuntamientos no figuran en ese artículo."
  citation: "art. 140 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-3
- id: m01-l04-q0073
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las Entidades Locales territoriales según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "El Municipio, la Provincia y la Comarca en todas las Comunidades Autónomas."
  - id: b
    text:
      es: "El Municipio, la Provincia y las Áreas Metropolitanas de las grandes ciudades."
  - id: c
    text:
      es: "El Municipio, la Mancomunidad de Municipios y la Isla en los archipiélagos."
  - id: d
    correct: true
    text:
      es: "El Municipio, la Provincia y la Isla en los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.1 LBRL dice que son Entidades Locales territoriales «el Municipio», «la Provincia» y «la Isla en los archipiélagos balear y canario». Las Comarcas, las Áreas Metropolitanas y las Mancomunidades de Municipios son entidades locales, pero el artículo 3.2 las pone en el otro grupo, el de las no territoriales."
  citation: "art. 3.1 LBRL"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-3
- id: m01-l04-q0074
  prompt:
    es: "¿Cuál de las siguientes goza de la condición de Entidad Local sin ser Entidad Local territorial, según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Áreas Metropolitanas de grandes aglomeraciones urbanas."
  - id: b
    text:
      es: "Las Diputaciones Provinciales de régimen común."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Las Islas de los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.2 LBRL da la condición de Entidades Locales a las Comarcas, a «las Áreas Metropolitanas» y a las Mancomunidades de Municipios. La Diputación no es una entidad: es el órgano de gobierno de la Provincia, que es entidad territorial. Las Delegaciones del Gobierno son órganos de la Administración General del Estado. La Isla es entidad local territorial según el artículo 3.1."
  citation: "art. 3.2 LBRL"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-1978-31229-art-141
- id: m01-l04-q0067
  prompt:
    es: "Según el artículo 141.2 de la Constitución Española de 1978, el gobierno y la administración autónoma de las provincias estarán encomendados:"
  options:
  - id: a
    correct: true
    text:
      es: "A Diputaciones u otras Corporaciones de carácter representativo."
  - id: b
    text:
      es: "A las Diputaciones Provinciales, con exclusión de cualquier otra Corporación."
  - id: c
    text:
      es: "A las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "A los Consejos de Gobierno de las Comunidades Autónomas."
  explanation:
    es: "El artículo 141.2 CE encomienda el gobierno y la administración autónoma de las provincias «a Diputaciones u otras Corporaciones de carácter representativo». La Constitución admite otras Corporaciones, así que la exclusión es falsa. Las Delegaciones del Gobierno y los Consejos de Gobierno autonómicos no son órganos de la provincia."
  citation: "art. 141.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-141
- id: m01-l04-q0070
  prompt:
    es: "Según el artículo 141.1 de la Constitución Española de 1978, cualquier alteración de los límites provinciales habrá de ser aprobada por:"
  options:
  - id: a
    text:
      es: "El Gobierno mediante Real Decreto del Consejo de Ministros."
  - id: b
    text:
      es: "Las Diputaciones de las provincias afectadas por acuerdo de sus Plenos."
  - id: c
    text:
      es: "Las Comunidades Autónomas afectadas mediante ley autonómica."
  - id: d
    correct: true
    text:
      es: "Las Cortes Generales mediante ley orgánica."
  explanation:
    es: "Los límites provinciales los altera una ley orgánica de las Cortes Generales, según el artículo 141.1. El Gobierno por Real Decreto no tiene esa competencia. Las Diputaciones gobiernan cada provincia, pero no deciden sobre sus límites. Las Comunidades Autónomas tampoco: sus leyes no pueden modificar la división provincial."
  citation: "art. 141.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-41
- id: m01-l04-q0119
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Cabildos Insulares Canarios se rigen, supletoriamente, por las normas que regulan:"
  options:
  - id: a
    text:
      es: "La organización y funcionamiento de los municipios de gran población."
  - id: b
    text:
      es: "La organización y funcionamiento de las mancomunidades provinciales interinsulares."
  - id: c
    correct: true
    text:
      es: "La organización y funcionamiento de las Diputaciones provinciales."
  - id: d
    text:
      es: "La organización y funcionamiento de los Consejos Insulares de las Islas Baleares."
  explanation:
    es: "El artículo 41.1 LBRL dice que los Cabildos Insulares Canarios se rigen por la disposición adicional decimocuarta «y supletoriamente por las normas que regulan la organización y funcionamiento de las Diputaciones provinciales», cuyas competencias asumen. El régimen de gran población es municipal. Las mancomunidades provinciales interinsulares son solo órganos de representación (art. 41.2). Los Consejos Insulares de Baleares tienen su propia regla en el artículo 41.3."
  citation: "art. 41.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: celex-12016m-txt-art-13
- id: m01-l04-q0124
  prompt:
    es: "¿Cuál de los siguientes órganos figura entre las instituciones de la Unión que enumera el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Comité Económico y Social."
  - id: b
    text:
      es: "El Comité de las Regiones."
  - id: c
    text:
      es: "El Banco Europeo de Inversiones."
  - id: d
    correct: true
    text:
      es: "El Tribunal de Cuentas."
  explanation:
    es: "El artículo 13.1 TUE enumera siete instituciones y la última es «El Tribunal de Cuentas». El Comité Económico y Social y el Comité de las Regiones son órganos consultivos que asisten al Parlamento, al Consejo y a la Comisión (art. 13.4 TUE), no instituciones. El Banco Europeo de Inversiones tampoco está en la lista; el banco que sí es institución es el Banco Central Europeo."
  citation: "art. 13.1 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: celex-12016m-txt-art-13
- id: m01-l04-q0125
  prompt:
    es: "De acuerdo con el artículo 13 del Tratado de la Unión Europea, el Parlamento Europeo, el Consejo y la Comisión estarán asistidos por:"
  options:
  - id: a
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones legislativas compartidas."
  - id: b
    text:
      es: "Un Comité Económico y Social y el Tribunal de Cuentas, que ejercerán funciones consultivas."
  - id: c
    correct: true
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones consultivas."
  - id: d
    text:
      es: "Un Comité de Representantes Permanentes y un Comité de las Regiones, que ejercerán funciones consultivas."
  explanation:
    es: "La opción correcta es la del Comité Económico y Social y el Comité de las Regiones con funciones consultivas: el artículo 13.4 TUE dice que esas tres instituciones «estarán asistidos por un Comité Económico y Social y por un Comité de las Regiones que ejercerán funciones consultivas». Los dos comités no ejercen funciones legislativas. El Tribunal de Cuentas es una institución (art. 13.1 TUE), no un comité consultivo. El Comité de Representantes Permanentes prepara los trabajos del Consejo (art. 16.7 TUE)."
  citation: "art. 13.4 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: celex-12016m-txt-art-13
- id: m01-l04-q0127
  prompt:
    es: "Señale cuál de los siguientes órganos es una institución de la Unión Europea, según el artículo 13.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Comité de las Regiones."
  - id: b
    correct: true
    text:
      es: "El Banco Central Europeo."
  - id: c
    text:
      es: "El Comité Económico y Social."
  - id: d
    text:
      es: "El Banco Europeo de Inversiones."
  explanation:
    es: "El Banco Central Europeo figura en la lista de instituciones del artículo 13.1. El Comité de las Regiones y el Comité Económico y Social asisten al Parlamento, al Consejo y a la Comisión con funciones consultivas, según el artículo 13.4. El Banco Europeo de Inversiones no está en la lista."
  citation: "art. 13.1 TUE"
  difficulty: 2
  tags:
  - "estructura"
