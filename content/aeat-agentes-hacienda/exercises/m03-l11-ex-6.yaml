# anchor: boe-a-2003-23186-art-167
- id: m03-l11-q0089
  prompt:
    es: "De acuerdo con el artículo 167.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de apremio se iniciará:"
  options:
  - id: a
    text:
      es: "Mediante diligencia de embargo notificada al obligado tributario."
  - id: b
    text:
      es: "Mediante requerimiento de pago notificado al responsable subsidiario."
  - id: c
    text:
      es: "Mediante resolución del órgano judicial a instancia de la Administración."
  - id: d
    correct: true
    text:
      es: "Mediante providencia notificada al obligado tributario."
  explanation:
    es: "El apremio se inicia mediante providencia notificada al obligado tributario. La diligencia de embargo es un acto posterior, y no se inicia con un requerimiento al responsable ni con una resolución judicial."
  citation: "art. 167.1 LGT"
  difficulty: 1
  tags:
  - "providencia de apremio"
  - "inicio"
# anchor: boe-a-2003-23186-art-167
- id: m03-l11-q0090
  prompt:
    es: "Conforme al artículo 167.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la providencia mediante la que se inicia el procedimiento de apremio:"
  options:
  - id: a
    text:
      es: "Identifica la deuda pendiente, liquida los intereses de demora del período voluntario y declara embargados los bienes."
  - id: b
    correct: true
    text:
      es: "Identifica la deuda pendiente, liquida los recargos del artículo 28 y requiere al obligado para que efectúe el pago."
  - id: c
    text:
      es: "Identifica la deuda pendiente y concede un nuevo plazo voluntario de ingreso sin recargos."
  - id: d
    text:
      es: "Liquida los recargos del artículo 27 y requiere al obligado para que presente la autoliquidación omitida."
  explanation:
    es: "La providencia identifica la deuda pendiente, liquida los recargos del artículo 28 y requiere el pago. No declara embargados los bienes: el embargo se advierte para el caso de impago. Tampoco concede otro plazo voluntario, y los recargos que liquida son los del período ejecutivo, no los del artículo 27."
  citation: "art. 167.1 LGT"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2003-23186-art-167
- id: m03-l11-q0091
  prompt:
    es: "Según el artículo 167.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la providencia de apremio será título suficiente para iniciar el procedimiento de apremio y tendrá:"
  options:
  - id: a
    text:
      es: "Una fuerza ejecutiva inferior a la sentencia judicial, que exige autorización del juez para embargar."
  - id: b
    correct: true
    text:
      es: "La misma fuerza ejecutiva que la sentencia judicial para proceder contra los bienes y derechos de los obligados tributarios."
  - id: c
    text:
      es: "La misma fuerza ejecutiva que la sentencia judicial, pero solo respecto de los bienes inscritos en registros."
  - id: d
    text:
      es: "Fuerza ejecutiva solo cuando haya transcurrido el plazo de pago del artículo 62.5 sin ingreso."
  explanation:
    es: "La providencia es título suficiente y tiene la misma fuerza ejecutiva que la sentencia judicial para proceder contra bienes y derechos. No necesita autorización judicial, no se limita a los bienes inscritos y su fuerza no depende de que transcurra el plazo del artículo 62.5."
  citation: "art. 167.2 LGT"
  difficulty: 1
  tags:
  - "providencia de apremio"
  - "fuerza ejecutiva"
# anchor: boe-a-2003-23186-art-167
- id: m03-l11-q0092
  prompt:
    es: "¿Con qué acto judicial equipara el artículo 167.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria la fuerza ejecutiva de la providencia de apremio para proceder contra los bienes y derechos de los obligados tributarios?"
  options:
  - id: a
    text:
      es: "Con el auto de despacho de ejecución."
  - id: b
    correct: true
    text:
      es: "Con la sentencia judicial."
  - id: c
    text:
      es: "Con el decreto del letrado de la Administración de Justicia."
  - id: d
    text:
      es: "Con el mandamiento de embargo del juzgado."
  explanation:
    es: "El artículo 167.2 equipara la providencia a la sentencia judicial. No la equipara a un auto de despacho de ejecución, a un decreto del letrado de la Administración de Justicia ni a un mandamiento de embargo."
  citation: "art. 167.2 LGT"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "fuerza ejecutiva"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0093
  prompt:
    es: "Conforme al artículo 70.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la providencia de apremio es el acto de la Administración que ordena:"
  options:
  - id: a
    text:
      es: "El embargo de los bienes y derechos señalados por el obligado al pago."
  - id: b
    text:
      es: "La liquidación de los intereses de demora devengados en el período voluntario."
  - id: c
    correct: true
    text:
      es: "La ejecución contra el patrimonio del obligado al pago."
  - id: d
    text:
      es: "La ejecución de las garantías constituidas por el obligado al pago."
  explanation:
    es: "La providencia es el acto que ordena la ejecución contra el patrimonio del obligado al pago. No ordena solo el embargo de los bienes que él señale, ni liquida intereses del período voluntario, ni se limita a ejecutar garantías."
  citation: "art. 70.1 RGR"
  difficulty: 1
  tags:
  - "providencia de apremio"
  - "concepto"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0094
  prompt:
    es: "¿Cuál de los siguientes datos del obligado al pago debe contener la providencia de apremio conforme al artículo 70.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Su nombre y apellidos o razón social, número de identificación fiscal y relación de sus bienes embargables."
  - id: b
    correct: true
    text:
      es: "Su nombre y apellidos o razón social o denominación completa, número de identificación fiscal y domicilio."
  - id: c
    text:
      es: "Su denominación completa, domicilio fiscal y el nombre de su representante o apoderado."
  - id: d
    text:
      es: "Su número de identificación fiscal y el código cuenta cliente de su domiciliación bancaria."
  explanation:
    es: "La providencia identifica al obligado con su nombre o razón social o denominación completa, su NIF y su domicilio. No incluye una relación de bienes embargables, ni el nombre de un representante, ni la cuenta bancaria, que son datos de otros escritos."
  citation: "art. 70.2.a RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0095
  prompt:
    es: "De acuerdo con el artículo 70.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la providencia de apremio deberá contener, respecto de la deuda:"
  options:
  - id: a
    text:
      es: "El concepto, el importe de la deuda y la fecha de su vencimiento en voluntaria."
  - id: b
    text:
      es: "El importe de la deuda, los intereses de demora y las costas devengadas hasta la fecha."
  - id: c
    text:
      es: "El concepto, el órgano que dictó la liquidación y el importe de los recargos exigibles."
  - id: d
    correct: true
    text:
      es: "El concepto, el importe de la deuda y el período al que corresponde."
  explanation:
    es: "La providencia indica el concepto, el importe de la deuda y el período al que corresponde. La fecha de vencimiento, las costas devengadas hasta la fecha y el órgano que dictó la liquidación no son el contenido que fija el apartado b)."
  citation: "art. 70.2.b RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0096
  prompt:
    es: "Según el artículo 70.2.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la providencia de apremio debe contener indicación expresa de que la deuda no ha sido satisfecha, de haber finalizado el plazo de ingreso en período voluntario y:"
  options:
  - id: a
    correct: true
    text:
      es: "Del comienzo del devengo de los intereses de demora."
  - id: b
    text:
      es: "Del comienzo del devengo del recargo de apremio ordinario."
  - id: c
    text:
      es: "De la apertura de un plazo para alegaciones frente a la deuda."
  - id: d
    text:
      es: "De la liquidación definitiva de los intereses de demora."
  explanation:
    es: "La providencia indica el comienzo del devengo de los intereses de demora. El recargo se liquida en el apartado d), no en este, y el apartado c) no menciona el de apremio ordinario. No abre un plazo de alegaciones frente a la deuda ni liquida de forma definitiva los intereses."
  citation: "art. 70.2.c RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0097
  prompt:
    es: "Conforme al artículo 70.2.d del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la providencia de apremio debe contener:"
  options:
  - id: a
    text:
      es: "La liquidación de las costas del procedimiento de apremio."
  - id: b
    correct: true
    text:
      es: "La liquidación del recargo del período ejecutivo."
  - id: c
    text:
      es: "La liquidación de los intereses de demora hasta la fecha de emisión."
  - id: d
    text:
      es: "La liquidación de los recargos por declaración extemporánea."
  explanation:
    es: "La providencia contiene la liquidación del recargo del período ejecutivo. Las costas se repercuten al notificarla, pero su liquidación no es contenido del apartado d). Los intereses se liquidan después, y el recargo por declaración extemporánea es del artículo 27."
  citation: "art. 70.2.d RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0099
  prompt:
    es: "Conforme al artículo 70.2.f del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre la advertencia que debe incluir la providencia de apremio para la deuda que quede sin ingresar en plazo:"
  options:
  - id: a
    text:
      es: "Se procederá al embargo de sus bienes o a la ejecución de las garantías, con inclusión del recargo de apremio del 10 por ciento y de los intereses de demora."
  - id: b
    text:
      es: "Se procederá al embargo de sus bienes o a la ejecución de las garantías, con inclusión del recargo ejecutivo del 5 por ciento, sin intereses de demora."
  - id: c
    text:
      es: "Se procederá al embargo de sus bienes, sin que pueda ejecutarse la garantía existente hasta una nueva notificación."
  - id: d
    correct: true
    text:
      es: "Se procederá al embargo de sus bienes o a la ejecución de las garantías, con inclusión del recargo de apremio del 20 por ciento y de los intereses de demora."
  explanation:
    es: "La advertencia anuncia el embargo o la ejecución de las garantías con el recargo de apremio del 20 por ciento y los intereses de demora hasta la cancelación de la deuda. El diez por ciento es el recargo reducido, que se incluye en el requerimiento de pago en plazo, y el cinco por ciento el ejecutivo. Y la garantía puede ejecutarse sin nueva notificación."
  citation: "art. 70.2.f RGR"
  difficulty: 3
  tags:
  - "providencia de apremio"
  - "contenido"
  - "recargos"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0100
  prompt:
    es: "Según el artículo 70.2.g del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué fecha debe constar en la providencia de apremio?"
  options:
  - id: a
    correct: true
    text:
      es: "La fecha de emisión de la providencia de apremio."
  - id: b
    text:
      es: "La fecha de vencimiento del plazo de ingreso en período voluntario."
  - id: c
    text:
      es: "La fecha de notificación de la liquidación que originó la deuda."
  - id: d
    text:
      es: "La fecha límite del plazo de pago del artículo 62.5 para el obligado."
  explanation:
    es: "El apartado g) exige la fecha de emisión de la providencia. El vencimiento del período voluntario, la notificación de la liquidación y la fecha límite del plazo de pago no son la fecha que el reglamento pide."
  citation: "art. 70.2.g RGR"
  difficulty: 1
  tags:
  - "providencia de apremio"
  - "contenido"
# anchor: boe-a-2005-14803-art-70
- id: m03-l11-q0101
  prompt:
    es: "De acuerdo con el artículo 70.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale cuál de los siguientes datos NO debe contener la providencia de apremio:"
  options:
  - id: a
    text:
      es: "El concepto, el importe de la deuda y el período al que corresponde."
  - id: b
    text:
      es: "El requerimiento expreso para que se efectúe el pago de la deuda en el plazo del artículo 62.5."
  - id: c
    correct: true
    text:
      es: "La liquidación de los intereses de demora devengados hasta la fecha de emisión."
  - id: d
    text:
      es: "La fecha de emisión de la providencia de apremio."
  explanation:
    es: "La providencia indica el comienzo del devengo de los intereses de demora, pero no los liquida: el artículo 70.2 no exige una liquidación de intereses hasta la fecha de emisión. Los otros tres datos sí figuran: concepto, importe y período (apartado b), requerimiento de pago en el plazo del 62.5 (apartado e) y fecha de emisión (apartado g)."
  citation: "art. 70.2 RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "contenido"
  - "negativa"
# anchor: boe-a-2005-14803-art-71
- id: m03-l11-q0102
  prompt:
    es: "Según el artículo 71 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en la notificación de la providencia de apremio se harán constar, al menos, el lugar de ingreso de la deuda y del recargo y:"
  options:
  - id: a
    correct: true
    text:
      es: "La repercusión de costas del procedimiento."
  - id: b
    text:
      es: "La relación de bienes del obligado que serán embargados."
  - id: c
    text:
      es: "La liquidación definitiva de los intereses de demora."
  - id: d
    text:
      es: "El nombre del funcionario que ejecutará el embargo."
  explanation:
    es: "Entre los extremos de la notificación está la repercusión de costas del procedimiento. La relación de bienes a embargar, la liquidación definitiva de intereses y el nombre del funcionario ejecutor no figuran en la lista del artículo 71."
  citation: "art. 71 RGR"
  difficulty: 1
  tags:
  - "providencia de apremio"
  - "notificación"
# anchor: boe-a-2005-14803-art-71
- id: m03-l11-q0103
  prompt:
    es: "¿Cuál de los siguientes extremos debe hacerse constar, al menos, en la notificación de la providencia de apremio conforme al artículo 71 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    correct: true
    text:
      es: "La posibilidad de solicitar aplazamiento o fraccionamiento de pago."
  - id: b
    text:
      es: "La posibilidad de solicitar la condonación de los recargos del período ejecutivo."
  - id: c
    text:
      es: "La posibilidad de pagar en especie con bienes del patrimonio histórico."
  - id: d
    text:
      es: "La posibilidad de designar los bienes que prefiera el obligado para el embargo."
  explanation:
    es: "La notificación debe informar de la posibilidad de solicitar aplazamiento o fraccionamiento. No menciona la condonación de recargos, el pago en especie ni la designación de bienes para el embargo."
  citation: "art. 71 RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "notificación"
# anchor: boe-a-2005-14803-art-71
- id: m03-l11-q0104
  prompt:
    es: "En relación con el artículo 71 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre lo que se hace constar en la notificación de la providencia de apremio:"
  options:
  - id: a
    text:
      es: "Los recursos que proceden, sin que deba indicarse el plazo para su interposición."
  - id: b
    text:
      es: "Los motivos de oposición, sin mención de los órganos ante los que pueden interponerse los recursos."
  - id: c
    text:
      es: "Los recursos que proceden y el efecto suspensivo automático de su interposición."
  - id: d
    correct: true
    text:
      es: "Los recursos que proceden, los órganos ante los que pueden interponerse y el plazo para su interposición."
  explanation:
    es: "La notificación indica los recursos que proceden, los órganos ante los que pueden interponerse y el plazo. No puede omitir el plazo ni los órganos, y no promete un efecto suspensivo automático: lo que se indica es que la suspensión se produce en los casos y condiciones de la normativa vigente."
  citation: "art. 71 RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "notificación"
# anchor: boe-a-2005-14803-art-71
- id: m03-l11-q0105
  prompt:
    es: "De acuerdo con el artículo 71 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en la notificación de la providencia de apremio se hará constar la indicación expresa de que la suspensión del procedimiento se producirá:"
  options:
  - id: a
    correct: true
    text:
      es: "En los casos y condiciones previstos en la normativa vigente."
  - id: b
    text:
      es: "En todo caso, cuando se interponga un recurso contra la providencia."
  - id: c
    text:
      es: "En los casos en que lo acuerde el órgano de recaudación competente."
  - id: d
    text:
      es: "En los casos y condiciones previstos en el propio escrito de la providencia."
  explanation:
    es: "La notificación advierte de que la suspensión se produce en los casos y condiciones de la normativa vigente. No se suspende en todo caso por recurrir, ni a discreción del órgano de recaudación, ni según lo que diga la providencia."
  citation: "art. 71 RGR"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "notificación"
  - "suspensión"
# anchor: boe-a-2003-23186-art-167
- id: m03-l11-q0106
  prompt:
    es: "Según el artículo 167.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué se procederá a hacer si el obligado tributario no efectúa el pago dentro del plazo del artículo 62.5?"
  options:
  - id: a
    text:
      es: "A la ejecución de la garantía, sin posibilidad de embargar otros bienes."
  - id: b
    text:
      es: "A la notificación de una nueva providencia con el recargo de apremio ordinario."
  - id: c
    text:
      es: "A la declaración de fallido del obligado tributario y de sus responsables."
  - id: d
    correct: true
    text:
      es: "Al embargo de sus bienes, advirtiéndose así en la providencia de apremio."
  explanation:
    es: "Si no se paga dentro del plazo del artículo 62.5, se procede al embargo de los bienes del obligado, y así se advierte en la providencia. No hace falta una segunda providencia, el artículo habla de embargar los bienes y no de ejecutar solo la garantía, y la declaración de fallido pertenece a otra fase."
  citation: "art. 167.4 LGT"
  difficulty: 2
  tags:
  - "providencia de apremio"
  - "embargo"
