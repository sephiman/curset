m09-case-a-q10:
  key:
    anchor: kafka-design#enforcement
    sentence: Byte-rate and thread utilization are measured over multiple small windows (e.g. 30 windows of 1 second each) in order to detect and correct quota violations quickly.
  wrong:
  - option: To smooth traffic, since large windows average bursts out
    anchor: kafka-design#enforcement
    sentence: Typically, having large measurement windows (for e.g. 10 windows of 30 seconds each) leads to large bursts of traffic followed by long delays
  - option: To share one quota across all brokers of the cluster
    anchor: kafka-design#enforcement
    sentence: By default, each unique client group receives a fixed quota as configured by the cluster. This quota is defined on a per-broker basis.
  - option: To let a throttled client keep sending without being blocked
    anchor: kafka-design#enforcement
    sentence: Therefore, requests from a throttled client are effectively blocked from both sides.
