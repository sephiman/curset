# anchor: boe-a-2022-22128-da-trigesima
- id: m05-l04-q037
  prompt:
    es: "La disposición adicional trigésima segunda de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, respecto al artículo 26.3 del Real Decreto 462/2002, dispone que:"
  options:
  - id: a
    text:
      es: "Se deroga ese artículo desde el 1 de enero de 2023."
  - id: b
    correct: true
    text:
      es: "Se mantiene la suspensión de la eficacia de ese artículo."
  - id: c
    text:
      es: "Se actualiza su cuantía con el incremento general de retribuciones."
  - id: d
    text:
      es: "Se extiende su aplicación a todo el personal destinado en territorio nacional."
  explanation:
    es: "La disposición adicional trigésima segunda dice que «se mantiene la suspensión de la eficacia del artículo 26.3» del Real Decreto 462/2002. La opción de la derogación convierte la suspensión en una pérdida de vigencia definitiva. La de la actualización de la cuantía atribuye a la disposición un contenido económico que no tiene. La de la extensión al territorio nacional invierte su sentido, porque la disposición suspende el artículo y no amplía su ámbito."
  citation: "disposición adicional trigésima segunda Ley 31/2022"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1992-19493-apartado-5
- id: m05-l04-q038
  prompt:
    es: "¿Cuál de las siguientes claves de retribución es correcta según el apartado 5.1.4 de la Orden de 30 de julio de 1992 sobre instrucciones para la confección de nóminas?"
  options:
  - id: a
    correct: true
    text:
      es: "La clave 03 corresponde a la paga extraordinaria."
  - id: b
    text:
      es: "La clave 02 corresponde al sueldo."
  - id: c
    text:
      es: "La clave 05 corresponde al complemento de destino."
  - id: d
    text:
      es: "La clave 07 corresponde al complemento de productividad."
  explanation:
    es: "El apartado 5.1.4 asigna la clave 03 a la paga extraordinaria. El sueldo lleva la clave 01, y la clave 02 es la antigüedad (trienios). El complemento de destino lleva la clave 04, y la 05 es el complemento específico. La clave 07 es la gratificación por servicios extraordinarios, no el complemento de productividad."
  citation: "apartado 5.1.4 Orden de 30-7-1992"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1992-19493-apartado-2
- id: m05-l04-q039
  prompt:
    es: "Según el apartado 2 de la Orden de 30 de julio de 1992 sobre instrucciones para la confección de nóminas, ¿qué se considera alta en nómina?"
  options:
  - id: a
    text:
      es: "La exclusión de la nómina de un perceptor que figuraba en la del mes anterior."
  - id: b
    text:
      es: "La modificación del importe de un perceptor que figuraba en la nómina del mes anterior."
  - id: c
    text:
      es: "La inclusión en la nómina de un perceptor que ya figuraba en la del mes anterior."
  - id: d
    correct: true
    text:
      es: "La inclusión en la nómina de un perceptor que no figuraba en la del mes anterior."
  explanation:
    es: "El apartado 2 considera alta «la inclusión en la nómina de un perceptor que no figuraba en la del mes anterior». La exclusión de quien figuraba es la baja, que define el apartado 3. La modificación del importe no cambia la presencia del perceptor en la nómina. Incluir a quien ya figuraba en la nómina anterior no es un alta, porque no es una inclusión nueva."
  citation: "apartados 2 y 3 Orden de 30-7-1992"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1992-19493-apartado-2
- id: m05-l04-q040
  prompt:
    es: "En la confección de nóminas del personal al servicio de la Administración del Estado, ¿con qué se justifican las altas y bajas en nómina?"
  options:
  - id: a
    text:
      es: "Con una única certificación del Registro Central de Personal para todos los casos."
  - id: b
    text:
      es: "Con la mera comunicación del propio perceptor al habilitado."
  - id: c
    correct: true
    text:
      es: "Con la documentación que la Orden de 30 de julio de 1992 indica para cada caso."
  - id: d
    text:
      es: "Con la resolución de la Intervención delegada que fiscaliza la nómina."
  explanation:
    es: "Según la Orden, las altas y las bajas «se justificarán con la documentación que en cada caso se indica»: cada supuesto lleva sus propios documentos. Una certificación única para todos los casos ignora esa distinción. La comunicación del perceptor no sustituye a la documentación exigida. La resolución de la Intervención delegada es un trámite de fiscalización que la Orden no prevé como justificante."
  citation: "apartados 2 y 3 Orden de 30-7-1992"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-23
- id: m05-l04-q041
  prompt:
    es: "Según el artículo 23 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las retribuciones básicas, que se fijan en la Ley de Presupuestos Generales del Estado, estarán integradas única y exclusivamente por:"
  options:
  - id: a
    text:
      es: "El sueldo asignado a cada Subgrupo o Grupo, los trienios y el complemento específico."
  - id: b
    text:
      es: "El sueldo asignado a cada Subgrupo o Grupo, los trienios y el complemento de productividad."
  - id: c
    correct: true
    text:
      es: "El sueldo asignado a cada Subgrupo o Grupo y los trienios."
  - id: d
    text:
      es: "El sueldo asignado a cada Subgrupo o Grupo, los trienios y las gratificaciones por servicios extraordinarios."
  explanation:
    es: "El artículo 23 integra las retribuciones básicas «única y exclusivamente» por el sueldo de cada Subgrupo o Grupo y los trienios. El complemento específico, el de productividad y las gratificaciones por servicios extraordinarios son retribuciones complementarias: añadirlos rompe la exclusividad que fija el artículo."
  citation: "art. 23 TREBEP"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q043
  prompt:
    es: "Según el artículo 23.2.b) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, si un funcionario cambia de grupo antes de completar un trienio, la fracción de tiempo transcurrido se considera:"
  options:
  - id: a
    text:
      es: "Perdida, y el cómputo del trienio comienza de nuevo en el nuevo grupo."
  - id: b
    correct: true
    text:
      es: "Tiempo de servicios prestados en el nuevo grupo."
  - id: c
    text:
      es: "Tiempo de servicios prestados mitad en el grupo anterior y mitad en el nuevo."
  - id: d
    text:
      es: "Tiempo de servicios que se abona aparte, como fracción de trienio del grupo anterior."
  explanation:
    es: "El artículo 23.2.b) dispone que la fracción de tiempo transcurrido «se considerará como tiempo de servicios prestados en el nuevo grupo». La opción que la pierde y reinicia el cómputo contradice ese aprovechamiento. El reparto por mitades entre los dos grupos no está en la norma. La opción que abona la fracción aparte, con la cuantía del grupo anterior, tampoco: la fracción se suma al tiempo del nuevo grupo."
  citation: "art. 23.2.b) Ley 30/1984"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-22
- id: m05-l04-q046
  prompt:
    es: "Según el artículo 22.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, cada una de las dos pagas extraordinarias anuales será por el importe de:"
  options:
  - id: a
    text:
      es: "Una mensualidad del sueldo y trienios como mínimo, sin incluir retribuciones complementarias."
  - id: b
    text:
      es: "Una mensualidad de sueldo, trienios y complemento de destino mensual que se perciba."
  - id: c
    text:
      es: "Una mensualidad de retribuciones básicas y de la totalidad de las complementarias, sin excepción alguna."
  - id: d
    correct: true
    text:
      es: "Una mensualidad de retribuciones básicas y de la totalidad de las complementarias, salvo las de las letras c) y d) del artículo 24."
  explanation:
    es: "El artículo 22.4 fija cada paga en «una mensualidad de retribuciones básicas y de la totalidad de las retribuciones complementarias», salvo las de las letras c) y d) del artículo 24: el rendimiento y los servicios extraordinarios. La opción de sueldo y trienios como mínimo es la regla de la Ley 30/1984. La de sueldo, trienios y complemento de destino es la de la Ley 31/2022. La que no admite excepciones omite que el propio artículo excluye esas retribuciones."
  citation: "art. 22.4 TREBEP"
  difficulty: 3
  tags:
  - "composición"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q047
  prompt:
    es: "Según la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, las pagas extraordinarias serán dos al año, por un importe mínimo cada una de una mensualidad:"
  options:
  - id: a
    text:
      es: "Del sueldo, trienios y complemento de destino, y se devengarán los meses de junio y diciembre."
  - id: b
    text:
      es: "Del sueldo y trienios, y se devengarán los meses de julio y diciembre."
  - id: c
    correct: true
    text:
      es: "Del sueldo y trienios, y se devengarán los meses de junio y diciembre."
  - id: d
    text:
      es: "Del sueldo, y se devengarán los meses de junio y diciembre."
  explanation:
    es: "El artículo 23.2.c) fija un importe mínimo de «una mensualidad del sueldo y trienios» y el devengo en junio y diciembre. La opción con complemento de destino traslada la composición de la Ley 31/2022. La de julio y diciembre cambia un mes de devengo. La que cita solo el sueldo omite los trienios, que forman parte de la mensualidad mínima."
  citation: "art. 23.2.c) Ley 30/1984"
  difficulty: 2
  tags:
  - "composición"
  - "fecha"
# anchor: boe-a-2022-22128-art-23
- id: m05-l04-q048
  prompt:
    es: "Según el artículo 23.Uno.B de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, cada paga extraordinaria incluye las cuantías de sueldo y trienios fijadas en su artículo 19.Cinco.2 y:"
  options:
  - id: a
    correct: true
    text:
      es: "El complemento de destino mensual que se perciba."
  - id: b
    text:
      es: "El complemento específico mensual que se perciba."
  - id: c
    text:
      es: "El complemento de productividad devengado en el semestre."
  - id: d
    text:
      es: "Las gratificaciones por servicios extraordinarios del semestre."
  explanation:
    es: "El artículo 23.Uno.B incluye en cada paga extraordinaria el sueldo, los trienios y «el complemento de destino mensual que se perciba». El complemento específico se percibe en catorce pagas, pero no integra la paga extraordinaria según este artículo. El de productividad y las gratificaciones por servicios extraordinarios no se incluyen en ella."
  citation: "art. 23.Uno.B Ley 31/2022"
  difficulty: 3
  tags:
  - "composición"
# anchor: boe-a-2022-22128-art-23
- id: m05-l04-q049
  prompt:
    es: "Según el artículo 23.Uno.B de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿qué ocurre con la paga extraordinaria si hubo jornada reducida los seis meses anteriores a junio o diciembre?"
  options:
  - id: a
    text:
      es: "Se abona íntegra, porque la reducción de jornada no afecta a las pagas extraordinarias."
  - id: b
    text:
      es: "Se pierde, porque exige haber prestado jornada completa los seis meses anteriores."
  - id: c
    text:
      es: "Se reduce a la mitad, con independencia de la duración de la jornada reducida."
  - id: d
    correct: true
    text:
      es: "Su importe experimenta la correspondiente reducción proporcional."
  explanation:
    es: "El artículo 23.Uno.B de la Ley 31/2022 dice que, cuando los funcionarios hubieran prestado jornada reducida durante los seis meses anteriores a junio o diciembre, «el importe de la paga extraordinaria experimentará la correspondiente reducción proporcional». Abonarla íntegra contradice esa reducción. Perderla no coincide con lo que dice la frase: la paga se reduce, no se pierde, y la frase no exige jornada completa. Reducirla a la mitad con independencia de la duración de la jornada contradice «la correspondiente», que liga la reducción a la jornada prestada."
  citation: "art. 23.Uno.B Ley 31/2022"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-24
- id: m05-l04-q050
  prompt:
    es: "Conforme al artículo 24 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la cuantía y estructura de las retribuciones complementarias de los funcionarios se establecerán por:"
  options:
  - id: a
    text:
      es: "Un real decreto del Consejo de Ministros común a todas las Administraciones Públicas."
  - id: b
    text:
      es: "El convenio colectivo de cada ámbito, negociado en la Mesa General de Negociación."
  - id: c
    correct: true
    text:
      es: "Las correspondientes leyes de cada Administración Pública."
  - id: d
    text:
      es: "Una resolución anual de la Secretaría de Estado de Función Pública."
  explanation:
    es: "El artículo 24 remite la cuantía y estructura de las retribuciones complementarias a «las correspondientes leyes de cada Administración Pública». Un real decreto común del Consejo de Ministros desconoce que cada Administración fija las suyas. El convenio colectivo es la fuente de las retribuciones del personal laboral. La resolución anual de la Secretaría de Estado no es una ley de la Administración correspondiente."
  citation: "art. 24 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-24
- id: m05-l04-q051
  prompt:
    es: "¿Cuál de los siguientes es uno de los factores para fijar las retribuciones complementarias que enumera el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "La antigüedad del funcionario en el Subgrupo o Grupo de clasificación."
  - id: b
    correct: true
    text:
      es: "Los servicios extraordinarios prestados fuera de la jornada normal de trabajo."
  - id: c
    text:
      es: "La titulación exigida para el ingreso en el Cuerpo o Escala."
  - id: d
    text:
      es: "El número de personas a cargo del funcionario."
  explanation:
    es: "El artículo 24 enumera, entre otros factores, los servicios extraordinarios prestados fuera de la jornada normal de trabajo. La antigüedad en el Subgrupo o Grupo retribuye mediante los trienios, que son una retribución básica. La titulación determina el grupo de clasificación, también básico. Las cargas familiares no son un factor del artículo."
  citation: "art. 24 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q052
  prompt:
    es: "En el sistema retributivo de los funcionarios del Estado, el complemento de destino es el que corresponde:"
  options:
  - id: a
    text:
      es: "Al grupo de clasificación del Cuerpo o Escala."
  - id: b
    text:
      es: "A la antigüedad del funcionario en la Administración."
  - id: c
    correct: true
    text:
      es: "Al nivel del puesto que se desempeñe."
  - id: d
    text:
      es: "A la especial dificultad técnica del puesto."
  explanation:
    es: "El artículo 23.3.a) define el complemento de destino como el «correspondiente al nivel del puesto que se desempeñe». El grupo de clasificación determina el sueldo, que es retribución básica. La antigüedad se retribuye con los trienios. La especial dificultad técnica es uno de los factores del complemento específico."
  citation: "art. 23.3 Ley 30/1984"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q053
  prompt:
    es: "El complemento específico retribuye las condiciones particulares de algunos puestos de trabajo en atención a su especial:"
  options:
  - id: a
    text:
      es: "Rendimiento, actividad extraordinaria e interés o iniciativa en el desempeño del trabajo."
  - id: b
    text:
      es: "Nivel dentro de la escala de puestos de trabajo, sin atender a las condiciones del puesto."
  - id: c
    correct: true
    text:
      es: "Dificultad técnica, dedicación, responsabilidad, incompatibilidad, peligrosidad o penosidad."
  - id: d
    text:
      es: "Dedicación fuera de la jornada normal, con carácter fijo en su cuantía y periódico en su devengo."
  explanation:
    es: "El artículo 23.3.b) vincula el complemento específico a la especial dificultad técnica, dedicación, responsabilidad, incompatibilidad, peligrosidad o penosidad del puesto. El rendimiento, la actividad extraordinaria y el interés o iniciativa son los factores del complemento de productividad. El nivel del puesto define el complemento de destino. La dedicación fuera de la jornada normal corresponde a las gratificaciones por servicios extraordinarios, que no pueden ser fijas ni periódicas."
  citation: "art. 23.3 Ley 30/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q054
  prompt:
    es: "Según el artículo 23.3.b) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿cuántos complementos específicos pueden asignarse a cada puesto de trabajo?"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso más de uno."
  - id: b
    text:
      es: "Hasta dos, si el puesto exige dedicación e incompatibilidad."
  - id: c
    text:
      es: "Uno por cada condición particular que concurra en el puesto."
  - id: d
    text:
      es: "Los que fije la Ley de Presupuestos Generales del Estado de cada año."
  explanation:
    es: "El artículo 23.3.b) añade que «en ningún caso podrá asignarse más de un complemento específico a cada puesto de trabajo». La opción de hasta dos solo cuando concurran dedicación e incompatibilidad crea una excepción que no existe. La de uno por cada condición particular multiplica el complemento según las condiciones del puesto. La remisión a la Ley de Presupuestos no tiene apoyo en el artículo."
  citation: "art. 23.3.b) Ley 30/1984"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q055
  prompt:
    es: "Señale la afirmación correcta sobre las gratificaciones por servicios extraordinarios que prevé la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública:"
  options:
  - id: a
    correct: true
    text:
      es: "Se prestan fuera de la jornada normal y en ningún caso pueden ser fijas en su cuantía y periódicas en su devengo."
  - id: b
    text:
      es: "Se prestan dentro de la jornada normal y pueden ser fijas en su cuantía y periódicas en su devengo."
  - id: c
    text:
      es: "Se prestan fuera de la jornada normal y han de ser fijas en su cuantía, aunque no periódicas en su devengo."
  - id: d
    text:
      es: "Se prestan fuera de la jornada normal y se abonan junto al complemento de destino en catorce pagas."
  explanation:
    es: "El artículo 23.3.d) las define como gratificaciones por servicios extraordinarios fuera de la jornada normal, que «en ningún caso podrán ser fijas en su cuantía y periódicas en su devengo». Las opciones que las sitúan dentro de la jornada normal o las hacen fijas o periódicas contradicen esa regla. La de las catorce pagas atribuye a la gratificación el régimen de pago del complemento específico, que es otra retribución."
  citation: "art. 23.3 Ley 30/1984"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2022-22128-art-23
- id: m05-l04-q057
  prompt:
    es: "Según el artículo 23.Uno.D de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿en cuántas pagas se percibe el complemento específico anual?"
  options:
  - id: a
    text:
      es: "En doce pagas iguales, todas de percepción mensual."
  - id: b
    text:
      es: "En catorce pagas, doce mensuales y dos adicionales de importe doble, en junio y diciembre."
  - id: c
    text:
      es: "En trece pagas iguales: doce mensuales y una adicional, en diciembre."
  - id: d
    correct: true
    text:
      es: "En catorce pagas iguales: doce mensuales y dos adicionales, en junio y diciembre."
  explanation:
    es: "El complemento específico anual «se percibirá en catorce pagas iguales de las que doce serán de percepción mensual y dos adicionales, del mismo importe que una mensual, en los meses de junio y diciembre». Las doce pagas omiten las dos adicionales. La opción de pagas adicionales de importe doble altera el importe, que es igual al de una mensual. Las trece pagas dejan una sola adicional."
  citation: "art. 23.Uno.D Ley 31/2022"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l04-q058
  prompt:
    es: "En la clasificación económica de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, ¿a qué concepto se imputan las asistencias por participación en tribunales de oposiciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Al concepto 233, «Otras indemnizaciones», del artículo 23."
  - id: b
    text:
      es: "Al subconcepto 162.04, «Acción social», del capítulo 1."
  - id: c
    text:
      es: "Al concepto 231, «Locomoción», del artículo 23."
  - id: d
    text:
      es: "Al concepto 232, «Traslado», del artículo 23."
  explanation:
    es: "El concepto 233, «Otras indemnizaciones», incluye entre otros gastos las asistencias por participación en tribunales. El subconcepto 162.04 es la acción social, del capítulo 1. El concepto 231, «Locomoción», recoge gastos de desplazamiento. El 232, «Traslado», recoge los gastos de los traslados de residencia."
  citation: "anexo IV, art. 23, concepto 233, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l04-q059
  prompt:
    es: "Según el anexo II de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿dónde se clasifica la «Acción social» del personal?"
  options:
