# anchor: boe-a-2015-10566-art-39
- id: m02-l04-q161
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, se entiende por portal de internet el punto de acceso electrónico cuya titularidad corresponda a:"
  options:
  - id: a
    text:
      es: "Un órgano colegiado de la Administración General del Estado de carácter consultivo."
  - id: b
    text:
      es: "Exclusivamente el Ministerio competente en materia de administración digital."
  - id: c
    correct: true
    text:
      es: "Una Administración Pública, organismo público o entidad de Derecho Público."
  - id: d
    text:
      es: "Una entidad privada que preste servicios públicos mediante un convenio de colaboración."
  explanation:
    es: "La titularidad corresponde a una Administración Pública, organismo público o entidad de Derecho Público. Una entidad privada, un único ministerio o un órgano colegiado cambian o restringen el criterio."
  citation: "art. 39 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q162
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la sede electrónica es aquella dirección electrónica disponible para los ciudadanos a través de:"
  options:
  - id: a
    text:
      es: "Oficinas de asistencia en materia de registros."
  - id: b
    text:
      es: "Las oficinas 060 de las Delegaciones del Gobierno."
  - id: c
    correct: true
    text:
      es: "Redes de telecomunicaciones."
  - id: d
    text:
      es: "Los canales presenciales de cada Departamento."
  explanation:
    es: "La sede se pone a disposición de los ciudadanos a través de redes de telecomunicaciones. Las oficinas de asistencia, los canales presenciales y las oficinas 060 son vías presenciales."
  citation: "art. 38.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q177
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la sede electrónica es aquella dirección electrónica disponible para los ciudadanos a través de:"
  options:
  - id: a
    correct: true
    text:
      es: "Redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública o a organismos públicos."
  - id: b
    text:
      es: "Redes internas de la Administración, cuya titularidad corresponde en exclusiva a cada Ministerio."
  - id: c
    text:
      es: "Aplicaciones móviles, cuya titularidad corresponde a las entidades locales."
  - id: d
    text:
      es: "Portales de internet, cuya gestión y titularidad corresponden al Punto de Acceso General de la Administración."
  explanation:
    es: "La sede es una dirección electrónica disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias. Las redes internas de un Ministerio no están disponibles para los ciudadanos. El Punto de Acceso General no gestiona las sedes, y la titularidad no se reserva a las entidades locales."
  citation: "art. 38.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q178
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, en el ámbito estatal, la creación de un portal de internet requerirá informe favorable de:"
