# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q241
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes descripciones corresponde a la extensión mp3?"
