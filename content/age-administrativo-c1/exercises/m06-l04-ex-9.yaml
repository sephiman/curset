# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q383
  prompt:
    es: "¿Cuál de las siguientes opciones de impresión de Opciones de Word (Mostrar) imprime todo el texto con formato oculto en Word 365?"
  options:
  - id: a
    text:
      es: "Imprimir imágenes y colores de fondo"
  - id: b
    text:
      es: "Imprimir propiedades del documento"
  - id: c
    correct: true
    text:
      es: "Imprimir texto oculto"
  - id: d
    text:
      es: "Actualizar campos antes de imprimir"
  explanation:
    es: "La página dice de Imprimir texto oculto: «Seleccione esta opción para imprimir todo el texto con formato oculto». «Imprimir imágenes y colores de fondo» imprime «todos los colores e imágenes de fondo». «Imprimir propiedades del documento» imprime el resumen en una página independiente. «Actualizar campos antes de imprimir» actualiza todos los campos del documento antes de imprimirlo. Ninguna imprime texto oculto."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "configuración"
