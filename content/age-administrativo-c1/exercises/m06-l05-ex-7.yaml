# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q242
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función EXTRAE?"
  options:
  - id: a
    text:
      es: "Devuelve los caracteres del lado izquierdo de un valor de texto"
  - id: b
    text:
      es: "Devuelve el número de caracteres de una cadena de texto dada"
  - id: c
    correct: true
    text:
      es: "Devuelve un número específico de caracteres de una cadena de texto desde una posición"
  - id: d
    text:
      es: "Divide las cadenas de texto mediante delimitadores de columna y fila"
  explanation:
    es: "EXTRAE devuelve un número específico de caracteres de una cadena de texto a partir de la posición que se especifique. Los caracteres del lado izquierdo son de IZQUIERDA, el número de caracteres es de LARGO y dividir por delimitadores es de DIVIDIRTEXTO."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de texto»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q243
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función DIVIDIRTEXTO?"
  options:
  - id: a
    correct: true
    text:
      es: "Divide las cadenas de texto mediante delimitadores de columna y fila"
  - id: b
    text:
      es: "Combina el texto de varios rangos o cadenas"
  - id: c
    text:
      es: "Devuelve una matriz de valores de texto de cualquier rango especificado"
  - id: d
    text:
      es: "Devuelve los caracteres del lado izquierdo de un valor de texto"
  explanation:
    es: "DIVIDIRTEXTO divide las cadenas de texto mediante delimitadores de columna y fila. Combinar el texto de varios rangos lo hace la función de unión de texto, devolver una matriz de valores de texto es de MATRIZATEXTO y los caracteres de la izquierda son de IZQUIERDA."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de texto»"
  difficulty: 1
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m06-l05-q244
  prompt:
    es: "En Excel 365, A2 contiene el texto 1,2,3;4,5,6. ¿Cómo desborda =DIVIDIRTEXTO(A2; \",\"; \";\") el resultado?"
  options:
  - id: a
    text:
      es: "En una matriz de 3 filas y 2 columnas"
  - id: b
    correct: true
    text:
      es: "En una matriz de 2 filas y 3 columnas"
  - id: c
    text:
      es: "En una sola fila de 6 celdas"
  - id: d
    text:
      es: "En una sola columna de 6 celdas"
  explanation:
    es: "El delimitador de columna es la coma y el de fila el punto y coma, así que 1,2,3;4,5,6 se divide en una matriz de 2×3, como indica el ejemplo de la página: dos filas de tres valores. Un delimitador de fila separa filas, no se ignora."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m06-l05-q245
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe cómo puede desbordar el texto la función DIVIDIRTEXTO?"
  options:
  - id: a
    text:
      es: "Solo entre columnas, nunca por filas"
  - id: b
    correct: true
    text:
      es: "Entre columnas o hacia abajo por filas"
  - id: c
    text:
      es: "Solo hacia abajo por filas, nunca entre columnas"
  - id: d
    text:
      es: "En una sola celda, separando las partes con espacios"
  explanation:
    es: "DIVIDIRTEXTO permite dividir entre columnas o hacia abajo por filas, según el delimitador que se use."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Introducción»"
  difficulty: 1
  tags:
  - "función"
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m06-l05-q246
  prompt:
    es: "En Excel 365, la función DIVIDIRTEXTO funciona igual que una herramienta, pero en formato de fórmula. ¿Cuál de las siguientes es esa herramienta?"
  options:
  - id: a
    text:
      es: "El asistente para funciones"
  - id: b
    text:
      es: "El asistente para fórmulas"
  - id: c
    text:
      es: "El Relleno rápido"
  - id: d
    correct: true
    text:
      es: "El asistente de texto a columnas"
  explanation:
    es: "La página dice que DIVIDIRTEXTO funciona igual que el asistente de texto a columnas, pero en formato de fórmula. El asistente para funciones ayuda con los argumentos, el asistente para fórmulas muestra la sintaxis al escribir y el Relleno rápido reconoce patrones en columnas adyacentes."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m06-l05-q247
  prompt:
    es: "En Excel 365, para dividir un texto por una coma y un punto a la vez con DIVIDIRTEXTO, ¿qué hay que usar como delimitador?"
  options:
  - id: a
    correct: true
    text:
      es: "Una constante de matriz con ambos delimitadores"
  - id: b
    text:
      es: "Los dos caracteres escritos seguidos entre comillas"
  - id: c
    text:
      es: "Dos argumentos de delimitador de columna consecutivos"
  - id: d
    text:
      es: "Una función SI que elija uno de los dos"
  explanation:
    es: "Si hay más de un delimitador, se debe usar una constante de matriz: para dividir por una coma y un punto, {\",\",\".\"}."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "función"
  - "requisito"
# anchor: fuente-ms-excel-funcion-dividirtexto-html
- id: m06-l05-q248
  prompt:
    es: "En Excel 365, si el texto tiene dos delimitadores consecutivos y no se cambia el argumento ignore_empty, ¿qué crea DIVIDIRTEXTO entre ellos?"
  options:
  - id: a
    text:
      es: "Una celda con el valor 0"
  - id: b
    text:
      es: "Una celda con un espacio"
  - id: c
    correct: true
    text:
      es: "Una celda vacía"
  - id: d
    text:
      es: "Ninguna celda, porque los omite"
  explanation:
    es: "ignore_empty vuelve al valor predeterminado FALSO, lo que crea una celda vacía. Omitir los delimitadores consecutivos solo ocurre si se especifica VERDADERO."
  citation: "fuente: `ms-excel-funcion-dividirtexto.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m06-l05-q249
  prompt:
    es: "En Excel 365, A2 contiene la fecha 27 de octubre de 2026. ¿Qué muestra la celda con =DIA(A2)?"
  options:
  - id: a
    text:
      es: "10"
  - id: b
    correct: true
    text:
      es: "27"
  - id: c
    text:
      es: "2026"
  - id: d
    text:
      es: "31"
  explanation:
    es: "DIA devuelve el día de una fecha como un número entero entre 1 y 31: en el 27 de octubre de 2026, 27. 10 es el mes, 2026 el año y 31 no es el día de esa fecha."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Descripción»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m06-l05-q250
  prompt:
    es: "En Excel 365, si una fecha tiene un formato de presentación Hijri, ¿qué valores devuelven las funciones AÑO, MES y DIA?"
  options:
  - id: a
    correct: true
    text:
      es: "Valores gregorianos, sea cual sea el formato"
  - id: b
    text:
      es: "Valores Hijri, como el formato de presentación"
  - id: c
    text:
      es: "Un error #¡VALOR! en las tres funciones"
  - id: d
    text:
      es: "Valores Hijri para el año y gregorianos para el mes y el día"
  explanation:
    es: "Los valores devueltos por AÑO, MES y DIA son valores gregorianos independientemente del formato de presentación; con formato Hijri, corresponden a la fecha gregoriana equivalente."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "comportamiento"
