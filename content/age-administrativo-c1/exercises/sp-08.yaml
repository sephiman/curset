# anchor: boe-a-2003-21614-art-47
- id: q16
  lesson: m05-l02
  prompt:
    es: "Conforme a los límites del artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué importe máximo puede imputar el SEPE al ejercicio 2029 con cargo a la aplicación presupuestaria del servicio de atención telefónica?"
  options:
  - id: a
    text:
      es: "140.000 euros, el 70 por ciento del crédito inicial de 2027."
  - id: b
    text:
      es: "100.000 euros, el 50 por ciento del crédito inicial de 2027."
  - id: c
    text:
      es: "150.000 euros, la anualidad prevista para 2028."
  - id: d
    correct: true
    text:
      es: "120.000 euros, el 60 por ciento del crédito inicial de 2027."
  explanation:
    es: "El gasto imputado a cada ejercicio posterior no puede exceder del 70 por ciento del crédito inicial en el ejercicio inmediato siguiente, el 60 por ciento en el segundo y el 50 por ciento en el tercero y el cuarto. El gasto se compromete en 2027 con un crédito inicial de 200.000 euros: 2028 es el ejercicio inmediato y 2029 el segundo, con el 60 por ciento, es decir, 120.000 euros. La opción de 140.000 euros aplica el 70 por ciento, que es el límite de 2028. La de 100.000 euros aplica el 50 por ciento, el de los ejercicios tercero y cuarto. La de 150.000 euros es la anualidad de 2028, que además supera su propio límite."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "mayoría"
# anchor: boe-a-2003-21614-art-52
- id: q17
  lesson: m05-l02
  prompt:
    es: "¿Puede el SEPE minorar con una transferencia de crédito, en octubre de 2027, el crédito de la aplicación de las ayudas que suplementó en abril?"
  options:
  - id: a
    text:
      es: "Sí, con la autorización de su Director General, por tratarse de créditos del mismo programa."
  - id: b
    correct: true
    text:
      es: "No, porque las transferencias no pueden minorar créditos que se hayan suplementado en el ejercicio."
  - id: c
    text:
      es: "Sí, previo informe favorable de la Intervención Delegada, que sustituye a cualquier otra restricción."
  - id: d
    text:
      es: "No, porque las transferencias solo pueden hacerse entre créditos de un mismo artículo del presupuesto."
  explanation:
    es: "Las transferencias pueden hacerse entre los diferentes créditos del presupuesto, pero no minoran créditos extraordinarios ni créditos que se hayan suplementado o ampliado en el ejercicio, y el de las ayudas se suplementó en abril de 2027. La opción de la autorización del Director General por ser del mismo programa se refiere a quién autoriza, y no salva la restricción. La del informe favorable de la Intervención Delegada tampoco, porque ese informe no sustituye las restricciones del artículo 52.1. La del mismo artículo del presupuesto inventa una limitación que la ley no contiene."
  citation: "art. 52.1 LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-155
- id: q18
  lesson: m05-l03
  prompt:
    es: "¿Ante quién y por conducto de quién plantea el SEPE la discrepancia por el reparo de la Intervención Delegada que no acepta?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante la Intervención General de la Administración del Estado, a través de la Dirección General del propio SEPE."
  - id: b
    text:
      es: "Ante la Intervención General de la Administración del Estado, por conducto de la Subsecretaría del Ministerio de Trabajo y Economía Social."
  - id: c
    text:
      es: "Ante el Consejo de Ministros, a través de la Dirección General del propio SEPE."
  - id: d
    text:
      es: "Ante el Tribunal de Cuentas, por conducto de la Subsecretaría del Ministerio de Trabajo y Economía Social."
  explanation:
    es: "Cuando el órgano gestor no acepta el reparo, plantea la discrepancia a la Intervención General de la Administración del Estado por conducto de la Subsecretaría en los ministerios y a través de los presidentes o directores de los organismos en los demás casos. El SEPE es un organismo autónomo, así que va a través de su dirección, y el reparo es de una intervención delegada, cuya discrepancia conoce la Intervención General. La opción de la Subsecretaría es la vía de los ministerios. El Consejo de Ministros solo resuelve si el reparo es de la Intervención General y la discrepancia subsiste. El Tribunal de Cuentas no interviene en las discrepancias."
  citation: "art. 155 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1989-14441-art-9
- id: q23
  lesson: m05-l05
  prompt:
    es: "Según el artículo 9.1 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, el estado de situación de Tesorería del sistema del SEPE que se formula como mínimo en la primera quincena de octubre de 2027 se refiere al día:"
  options:
  - id: a
    text:
      es: "El viernes, 15 de octubre de 2027."
  - id: b
    text:
      es: "El domingo, 31 de octubre de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 30 de septiembre de 2027."
  - id: d
    text:
      es: "El viernes, 1 de octubre de 2027."
  explanation:
    es: "Los estados de situación de Tesorería se formulan como mínimo en las primeras quincenas de enero, abril, julio y octubre, y se refieren al último día del trimestre inmediato anterior (art. 9.1 RD 725/1989). El estado de octubre de 2027 se refiere al último día del trimestre que acaba, el jueves, 30 de septiembre de 2027. El viernes, 15 de octubre de 2027, es el último día de la quincena en que se formula, no la fecha a la que se refiere. El domingo, 31 de octubre de 2027, es el fin del mes de la formulación. El viernes, 1 de octubre de 2027, es el primer día del trimestre siguiente, y no el último del anterior."
  citation: "art. 9.1 RD 725/1989"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1987-12158-art-10
- id: q24
  lesson: m05-l05
  prompt:
    es: "Según el artículo 10.1 del Real Decreto 640/1987, de 8 de mayo, sobre pagos librados «a justificar», si el Cajero pagador del SEPE paga otro gasto de las jornadas de Lisboa el miércoles, 6 de octubre de 2027, ¿hasta qué fecha debe justificar su aplicación, sin ampliación del plazo?"
  options:
  - id: a
    text:
      es: "El sábado, 6 de noviembre de 2027."
  - id: b
    text:
      es: "El viernes, 5 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 8 de noviembre de 2027."
  - id: d
    text:
      es: "El martes, 7 de diciembre de 2027."
  explanation:
    es: "Los Cajeros pagadores justifican dentro del mes siguiente a la inversión y, en todo caso, en tres meses desde la percepción de los fondos, y rige el plazo que acaba antes. Los plazos por meses se cuentan de fecha a fecha desde el día siguiente (art. 30.4 LPAC) y, si acaban en día inhábil, pasan al primer día hábil siguiente (art. 30.5 LPAC). El mes siguiente al pago del miércoles, 6 de octubre de 2027, acaba el sábado, 6 de noviembre, y pasa al lunes, 8 de noviembre de 2027. Los tres meses desde la percepción, el lunes, 6 de septiembre de 2027, acaban el lunes, 6 de diciembre, festivo, y pasan al martes, 7 de diciembre, más tarde. Termina el lunes, 8 de noviembre de 2027. La fecha del sábado, 6 de noviembre de 2027, deja el plazo en día inhábil sin trasladarlo. La del viernes, 5 de noviembre de 2027, cuenta el día del pago como primero del mes. La del martes, 7 de diciembre de 2027, es el límite de tres meses, que solo manda cuando el pago es posterior."
  citation: "art. 10.1 RD 640/1987"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
