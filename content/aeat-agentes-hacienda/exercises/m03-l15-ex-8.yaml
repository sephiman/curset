# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0236
  prompt:
    es: "¿Cómo se califican, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los intereses que percibe una persona física por la cesión a terceros de capitales propios, como el saldo de un depósito bancario?"
  options:
  - id: a
    text:
      es: "Como rendimientos de actividades económicas."
  - id: b
    text:
      es: "Como rendimientos del capital inmobiliario."
  - id: c
    correct: true
    text:
      es: "Como rendimientos del capital mobiliario."
  - id: d
    text:
      es: "Como ganancias patrimoniales."
  explanation:
    es: "Los intereses por la cesión a terceros de capitales propios son rendimientos del capital mobiliario (art. 25.2 LIRPF). El capital inmobiliario deriva de bienes inmuebles, las actividades económicas exigen ordenar medios de producción y recursos humanos, y las ganancias patrimoniales proceden de alteraciones del patrimonio."
  citation: "art. 25.2 LIRPF"
  difficulty: 1
  tags:
  - "capital mobiliario"
  - "calificación"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0237
  prompt:
    es: "¿Cómo se califica, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la renta que obtiene un contribuyente por alquilar una embarcación de su propiedad sin que ese alquiler constituya una actividad económica?"
  options:
  - id: a
    text:
      es: "Como rendimiento de actividades económicas."
  - id: b
    text:
      es: "Como ganancia patrimonial."
  - id: c
    text:
      es: "Como rendimiento del capital inmobiliario."
  - id: d
    correct: true
    text:
      es: "Como rendimiento del capital mobiliario."
  explanation:
    es: "El arrendamiento de bienes muebles que no constituya actividad económica es capital mobiliario (art. 25.4.c) LIRPF). El capital inmobiliario es propio de los inmuebles, y las actividades económicas exigen que el alquiler constituya una actividad. Y las ganancias patrimoniales derivan de la transmisión, no del arrendamiento."
  citation: "art. 25.4 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "calificación"
# anchor: boe-a-2006-20764-art-22
- id: m03-l15-q0239
  prompt:
    es: "¿Cómo se califica, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la renta que obtiene el propietario de un inmueble urbano que lo arrienda y gestiona él solo, sin utilizar ninguna persona empleada?"
  options:
  - id: a
    correct: true
    text:
      es: "Como rendimiento del capital inmobiliario."
  - id: b
    text:
      es: "Como rendimiento de actividades económicas."
  - id: c
    text:
      es: "Como ganancia patrimonial."
  - id: d
    text:
      es: "Como rendimiento del capital mobiliario."
  explanation:
    es: "El arrendamiento de un inmueble sin persona empleada con contrato laboral y jornada completa es capital inmobiliario (arts. 22.1 y 27.2 LIRPF). No es actividad económica sin ese empleado. El capital mobiliario se refiere a bienes muebles, y no hay alteración patrimonial que genere ganancia."
  citation: "art. 22.1 LIRPF"
  difficulty: 2
  tags:
  - "capital inmobiliario"
  - "calificación"
# anchor: boe-a-2006-20764-art-26
- id: m03-l15-q0250
  prompt:
    es: "¿En cuál de los siguientes rendimientos se deducen, con carácter general, exclusivamente los gastos de administración y depósito de valores negociables, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En los rendimientos del capital mobiliario."
  - id: b
    text:
      es: "En los rendimientos del trabajo."
  - id: c
    text:
      es: "En los rendimientos del capital inmobiliario."
  - id: d
    text:
      es: "En los rendimientos de actividades económicas."
  explanation:
    es: "El artículo 26.1 LIRPF limita los gastos del capital mobiliario, con carácter general, a los de administración y depósito de valores negociables. En el trabajo hay otra lista exclusiva, en el capital inmobiliario se deducen todos los gastos necesarios, y en las actividades económicas se siguen las normas del Impuesto sobre Sociedades."
  citation: "art. 26.1 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "comparación"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0279
  prompt:
    es: "Quien no ejerce actividad económica alguna adquirió en 2024 los derechos de explotación de una novela de la que no es autor y cobra en 2026 sus regalías anuales. De acuerdo con el artículo 25.4.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se califican esas regalías?"
  options:
  - id: a
    text:
      es: "Como rendimientos del trabajo, porque derivan de la elaboración de una obra literaria cuyo derecho de explotación se cede."
  - id: b
    correct: true
    text:
      es: "Como rendimientos del capital mobiliario, porque proceden de la propiedad intelectual y el contribuyente no es el autor."
  - id: c
    text:
      es: "Como ganancias patrimoniales, porque son variaciones del valor del patrimonio del contribuyente en el año."
  - id: d
    text:
      es: "Como rendimientos del capital inmobiliario, porque derivan de la cesión de derechos de uso o disfrute sobre un bien."
  explanation:
    es: "Son rendimientos del capital mobiliario los procedentes de la propiedad intelectual cuando el contribuyente no sea el autor (art. 25.4.a). Los rendimientos del trabajo del artículo 17.2.d) son los derivados de la elaboración de obras literarias, artísticas o científicas con cesión del derecho de explotación, es decir, los del autor, y aquí el contribuyente no lo es. El capital inmobiliario es el que procede de bienes inmuebles y de derechos reales sobre ellos (art. 22.1), y una novela no lo es. Las ganancias y pérdidas patrimoniales no incluyen lo que la ley califique como rendimientos (art. 33.1), y esta renta la califica como del capital mobiliario."
  citation: "art. 25.4 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "propiedad intelectual"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0280
  prompt:
    es: "Según el artículo 25.4.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos íntegros del capital mobiliario los procedentes de la prestación de asistencia técnica, salvo que dicha prestación:"
  options:
  - id: a
    correct: true
    text:
      es: "Tenga lugar en el ámbito de una actividad económica que realice el contribuyente."
  - id: b
    text:
      es: "Se retribuya con una contraprestación en especie."
  - id: c
    text:
      es: "Dure más de un año natural completo."
  - id: d
    text:
      es: "Se preste a una persona vinculada con el contribuyente."
  explanation:
    es: "La asistencia técnica es rendimiento del capital mobiliario salvo que la prestación tenga lugar en el ámbito de una actividad económica, en cuyo caso es rendimiento de actividades económicas (art. 25.4.b). La vinculación con el destinatario no aparece entre las excepciones. Tampoco la duración: el artículo no fija ningún período mínimo ni máximo. La contraprestación en especie no cambia la calificación, porque los rendimientos del capital incluyen las utilidades dinerarias o en especie (art. 21.1)."
  citation: "art. 25.4 LIRPF"
  difficulty: 2
  tags:
  - "capital mobiliario"
  - "asistencia técnica"
# anchor: boe-a-2006-20764-art-23
- id: m03-l15-q0285
  prompt:
    es: "¿Sobre qué valor se aplica el 3 por ciento para que la amortización de un inmueble cumpla el requisito de efectividad, según el artículo 23.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Sobre el valor de mercado del inmueble en la fecha de cada devengo, sin incluir el valor del suelo."
  - id: b
    text:
      es: "Sobre el menor entre el coste de adquisición satisfecho y el valor catastral, sin incluir el valor del suelo."
  - id: c
    text:
      es: "Sobre el mayor entre el coste de adquisición satisfecho y el valor catastral, incluido el valor del suelo."
  - id: d
    correct: true
    text:
      es: "Sobre el mayor entre el coste de adquisición satisfecho y el valor catastral, sin incluir el valor del suelo."
  explanation:
    es: "En los inmuebles, la amortización cumple el requisito de efectividad si no excede del 3 por ciento aplicado sobre el mayor de dos valores, el coste de adquisición satisfecho o el valor catastral, sin incluir el valor del suelo (art. 23.1.b). Tomar el menor de los dos cambia la regla. Incluir el suelo la contradice, porque el suelo no se amortiza. El valor de mercado a la fecha de devengo no es ninguno de los dos valores que fija el artículo."
  citation: "art. 23.1.b) LIRPF"
  difficulty: 1
  tags:
  - "capital inmobiliario"
  - "amortización"
# anchor: boe-a-2006-20764-art-25
- id: m03-l15-q0286
  prompt:
    es: "Según el artículo 25.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando se percibe un capital diferido de un contrato de seguro de vida, el rendimiento del capital mobiliario viene determinado por la diferencia entre el capital percibido y:"
  options:
  - id: a
    text:
      es: "El importe de la provisión matemática constituida a la fecha de cobro."
  - id: b
    correct: true
    text:
      es: "El importe de las primas satisfechas."
  - id: c
    text:
      es: "El importe de las primas satisfechas más los intereses legales devengados."
  - id: d
    text:
      es: "El valor de rescate del contrato en la fecha de la primera prima."
  explanation:
    es: "El rendimiento es la diferencia entre el capital percibido y el importe de las primas satisfechas (art. 25.3.a).1.º). Ni el valor de rescate en la primera prima ni la provisión matemática a la fecha de cobro son el término de comparación que fija la norma. Añadir los intereses legales a las primas tampoco figura en la regla, que resta solo las primas, con la detracción adicional del capital en riesgo en las condiciones del propio número 1.º."
  citation: "art. 25.3 LIRPF"
  difficulty: 1
  tags:
  - "capital mobiliario"
  - "seguros de vida"
# anchor: boe-a-2006-20764-art-27
- id: m03-l15-q0180
  prompt:
    es: "De acuerdo con el artículo 27.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos íntegros de actividades económicas los que supongan por parte del contribuyente la ordenación por cuenta propia de medios de producción y de recursos humanos o de uno de ambos, con la finalidad de:"
  options:
  - id: a
    text:
      es: "satisfacer necesidades de consumo personal o familiar del contribuyente."
  - id: b
    text:
      es: "obtener rentas de capitales propios cedidos a terceros."
  - id: c
    correct: true
    text:
      es: "intervenir en la producción o distribución de bienes o servicios."
  - id: d
    text:
      es: "prestar servicios exclusivamente a entidades vinculadas con el contribuyente."
  explanation:
    es: "La finalidad que define la actividad económica es intervenir en la producción o distribución de bienes o servicios (art. 27.1 LIRPF). La cesión de capitales propios da capital mobiliario, el consumo personal no es una actividad y la vinculación del cliente no forma parte del concepto."
  citation: "art. 27.1 LIRPF"
  difficulty: 1
  tags:
  - "actividades económicas"
  - "concepto"
# anchor: boe-a-2006-20764-art-27
- id: m03-l15-q0181
  prompt:
    es: "Conforme al artículo 27.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el arrendamiento de inmuebles se realiza como actividad económica únicamente cuando para la ordenación de esta se utilice, al menos:"
  options:
  - id: a
    text:
      es: "una persona empleada con contrato laboral, aunque sea a jornada parcial."
  - id: b
    text:
      es: "un local destinado en exclusiva a la gestión de los inmuebles arrendados."
  - id: c
    correct: true
    text:
      es: "una persona empleada con contrato laboral y a jornada completa."
  - id: d
    text:
      es: "dos personas empleadas con contrato laboral y a jornada completa."
  explanation:
    es: "El arrendamiento de inmuebles es actividad económica solo si se utiliza al menos una persona empleada con contrato laboral y a jornada completa (art. 27.2 LIRPF). Dos personas elevan la exigencia, la jornada parcial no cumple el texto, y el local no sustituye al empleado."
  citation: "art. 27.2 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "arrendamiento"
# anchor: boe-a-2006-20764-art-27
- id: m03-l15-q0182
  prompt:
    es: "Según el artículo 27.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se califican los rendimientos del arrendamiento de tres pisos que su propietario gestiona él solo, sin contratar a nadie?"
  options:
  - id: a
    text:
      es: "Como rendimientos del capital mobiliario, porque el alquiler es una cesión de bienes."
  - id: b
    text:
      es: "Como rendimientos de actividades económicas, porque alquila más de un inmueble."
  - id: c
    correct: true
    text:
      es: "Como rendimientos del capital inmobiliario, porque no utiliza al menos una persona empleada con contrato laboral y a jornada completa."
  - id: d
    text:
      es: "Como rendimientos de actividades económicas, porque los gestiona de forma habitual y personal."
  explanation:
    es: "Sin una persona empleada con contrato laboral y jornada completa, el arrendamiento no es actividad económica y produce capital inmobiliario (art. 27.2 LIRPF). El número de inmuebles y la gestión personal no bastan. El arrendamiento de inmuebles no se califica como capital mobiliario, que es el de bienes muebles, negocios o minas."
  citation: "art. 27.2 LIRPF"
  difficulty: 2
  tags:
  - "arrendamiento"
# anchor: boe-a-2006-20764-art-16
- id: m03-l15-q0183
  prompt:
    es: "Según el artículo 16.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en la determinación de los rendimientos de actividades económicas la estimación directa se aplica como método:"
  options:
  - id: a
    text:
      es: "general, y admite tres modalidades: la normal, la simplificada y la objetiva."
  - id: b
    correct: true
    text:
      es: "general, y admite dos modalidades: la normal y la simplificada."
  - id: c
    text:
      es: "opcional, y admite dos modalidades: la normal y la objetiva."
  - id: d
    text:
      es: "subsidiario, y admite dos modalidades: la normal y la simplificada."
  explanation:
    es: "La estimación directa es el método general y admite dos modalidades: normal y simplificada (art. 16.2.a) LIRPF). No es subsidiaria. La estimación objetiva es un método distinto, y no una modalidad de la directa."
  citation: "art. 16.2 LIRPF"
  difficulty: 1
  tags:
  - "métodos"
  - "estimación directa"
# anchor: boe-a-2006-20764-art-16
- id: m03-l15-q0184
  prompt:
    es: "De acuerdo con el artículo 16.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la estimación indirecta de los rendimientos de actividades económicas:"
  options:
  - id: a
    text:
      es: "Se tienen en cuenta, preferentemente, los rendimientos declarados en la modalidad simplificada de la estimación directa."
  - id: b
    text:
      es: "Se aplica de conformidad con la normativa del Impuesto sobre Sociedades, sin referencia a los módulos de la estimación objetiva."
  - id: c
    correct: true
    text:
      es: "Se tienen en cuenta, preferentemente, los signos, índices o módulos de la estimación objetiva cuando se trate de contribuyentes que hayan renunciado a este último método."
  - id: d
    text:
      es: "Se tienen en cuenta, preferentemente, los signos, índices o módulos de la estimación objetiva cuando se trate de contribuyentes excluidos de la estimación directa por superar sus límites."
  explanation:
    es: "En la estimación indirecta se atienden preferentemente los módulos de la estimación objetiva cuando el contribuyente ha renunciado a ella (art. 16.3 LIRPF). La exclusión de la directa no es el supuesto, la modalidad simplificada no es la referencia y el método se aplica conforme a la normativa general tributaria, no la del Impuesto sobre Sociedades."
  citation: "art. 16.3 LIRPF"
  difficulty: 3
  tags:
  - "métodos"
  - "estimación indirecta"
# anchor: boe-a-2006-20764-art-28
- id: m03-l15-q0185
  prompt:
    es: "Según el artículo 28.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el rendimiento neto de las actividades económicas se determina según las normas del:"
  options:
  - id: a
    text:
      es: "Código de Comercio, sin perjuicio de las reglas especiales de los artículos 28, 30 y 31."
  - id: b
    text:
      es: "Impuesto sobre el Patrimonio, sin perjuicio de las reglas especiales de los artículos 28, 30 y 31."
  - id: c
    text:
      es: "Impuesto sobre el Valor Añadido, sin perjuicio de las reglas especiales de los artículos 28, 30 y 31."
  - id: d
    correct: true
    text:
      es: "Impuesto sobre Sociedades, sin perjuicio de las reglas especiales de los artículos 28, 30 y 31."
  explanation:
    es: "El rendimiento neto de las actividades económicas se calcula con las normas del Impuesto sobre Sociedades, con las reglas especiales de los artículos 28, 30 y 31 (art. 28.1 LIRPF). Las demás normas no son la remisión del precepto."
  citation: "art. 28.1 LIRPF"
  difficulty: 1
  tags:
  - "actividades económicas"
  - "rendimiento neto"
# anchor: boe-a-2006-20764-art-28
- id: m03-l15-q0186
  prompt:
    es: "Conforme al artículo 28.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las ganancias o pérdidas patrimoniales derivadas de los elementos patrimoniales afectos a las actividades económicas:"
  options:
  - id: a
    text:
      es: "Se incluyen en el rendimiento neto solo cuando se determine por la modalidad normal."
  - id: b
    correct: true
    text:
      es: "No se incluyen en el rendimiento neto de las actividades económicas."
  - id: c
    text:
      es: "Se incluyen en el rendimiento neto solo cuando excedan de 300.000 euros anuales."
  - id: d
    text:
      es: "Se incluyen en el rendimiento neto de las actividades económicas."
  explanation:
    es: "Las ganancias y pérdidas de los elementos afectos no integran el rendimiento neto, y tributan como ganancias y pérdidas patrimoniales (art. 28.2 LIRPF). No hay excepción por cuantía ni por modalidad."
  citation: "art. 28.2 LIRPF"
  difficulty: 2
  tags:
  - "actividades económicas"
  - "rendimiento neto"
# anchor: boe-a-2006-20764-art-30
- id: m03-l15-q0187
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la modalidad simplificada de la estimación directa se aplica para determinadas actividades económicas cuyo importe neto de cifra de negocios, para el conjunto de actividades del contribuyente, no supere:"
  options:
  - id: a
    correct: true
    text:
      es: "los 600.000 euros en el año inmediato anterior, salvo que renuncie a su aplicación."
  - id: b
    text:
      es: "los 600.000 euros en el año en curso, salvo que renuncie a su aplicación."
  - id: c
    text:
      es: "los 300.000 euros en el año inmediato anterior, salvo que renuncie a su aplicación."
  - id: d
    text:
      es: "los 1.000.000 de euros en el año inmediato anterior, salvo que renuncie a su aplicación."
  explanation:
    es: "El límite es de 600.000 euros de importe neto de cifra de negocios en el año inmediato anterior (art. 30.1 LIRPF). Trescientos mil y un millón son cifras que el artículo no fija, y la comparación se hace con el año anterior, no con el año en curso."
  citation: "art. 30.1 LIRPF"
  difficulty: 1
  tags:
  - "estimación directa"
  - "simplificada"
# anchor: boe-a-2006-20764-art-30
- id: m03-l15-q0188
  prompt:
    es: "Señale la respuesta CORRECTA sobre la renuncia o exclusión de la modalidad simplificada de la estimación directa, de acuerdo con el artículo 30.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por la modalidad normal durante los cinco años siguientes."
  - id: b
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por la modalidad normal durante los dos años siguientes."
  - id: c
    text:
      es: "El contribuyente determina por la modalidad normal el rendimiento neto solo de la actividad que superó el límite, durante el año siguiente."
  - id: d
    correct: true
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por la modalidad normal durante los tres años siguientes."
  explanation:
    es: "Tras la renuncia o exclusión, todas las actividades pasan a la modalidad normal durante tres años (art. 30.1 LIRPF). Dos y cinco años no son el plazo. Y el efecto alcanza a todas las actividades, no solo a la que superó el límite."
  citation: "art. 30.1 LIRPF"
  difficulty: 2
  tags:
  - "estimación directa"
  - "plazo"
# anchor: boe-a-2006-20764-art-30
- id: m03-l15-q0189
  prompt:
    es: "Conforme al artículo 30.2.4.ª de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las reglas especiales de cuantificación de gastos de difícil justificación y provisiones en la modalidad simplificada de la estimación directa:"
  options:
  - id: a
    text:
      es: "No pueden dar un conjunto superior a 300 euros anuales."
  - id: b
    text:
      es: "No pueden dar un conjunto superior a 600.000 euros anuales."
  - id: c
    text:
      es: "No pueden dar un conjunto superior a 5.000 euros anuales."
  - id: d
    correct: true
    text:
      es: "No pueden dar un conjunto superior a 2.000 euros anuales."
  explanation:
    es: "El conjunto de gastos de difícil justificación y provisiones no puede superar 2.000 euros anuales en la modalidad simplificada (art. 30.2.4.ª LIRPF). Los 600.000 euros son el límite de la cifra de negocios de la modalidad, y los 300 euros, el límite de los gastos de defensa jurídica del rendimiento del trabajo."
  citation: "art. 30.2 LIRPF"
  difficulty: 2
  tags:
  - "estimación directa"
  - "gastos"
# anchor: boe-a-2006-20764-art-30
- id: m03-l15-q0190
  prompt:
    es: "De acuerdo con el artículo 30.2.5.ª.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, tiene la consideración de gasto deducible el de manutención del propio contribuyente incurrido en el desarrollo de la actividad económica, siempre que se produzca en establecimientos de restauración y hostelería y se abone:"
  options:
  - id: a
    correct: true
    text:
      es: "utilizando cualquier medio electrónico de pago, con los límites reglamentarios para las dietas de manutención de los trabajadores."
  - id: b
    text:
      es: "mediante transferencia bancaria, y sin límite cuantitativo alguno."
  - id: c
    text:
      es: "en efectivo, siempre que se justifique con factura completa del establecimiento."
  - id: d
    text:
      es: "con tarjeta de crédito, con los límites que fije la Administración tributaria en cada caso."
  explanation:
    es: "El gasto de manutención del propio contribuyente es deducible si se produce en restauración y hostelería y se paga con cualquier medio electrónico, con los límites de las dietas de manutención de los trabajadores (art. 30.2.5.ª.c) LIRPF). El pago en efectivo no cumple el requisito, la transferencia no es el único medio y el límite es reglamentario."
  citation: "art. 30.2 LIRPF"
  difficulty: 3
  tags:
  - "estimación directa"
  - "gastos"
# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0191
  prompt:
    es: "Según el artículo 31.1.1.ª de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los contribuyentes que reúnan las circunstancias de las normas reguladoras de la estimación objetiva determinan sus rendimientos conforme a ese método, salvo que:"
  options:
  - id: a
    text:
      es: "opten por la estimación indirecta, en los términos que reglamentariamente se establezcan."
  - id: b
    text:
      es: "ejerzan más de una actividad económica, en los términos que reglamentariamente se establezcan."
  - id: c
    text:
      es: "lo decida la Administración tributaria, en los términos que reglamentariamente se establezcan."
  - id: d
    correct: true
    text:
      es: "renuncien a su aplicación, en los términos que reglamentariamente se establezcan."
  explanation:
    es: "La aplicación de la estimación objetiva es la regla para quien cumple las circunstancias, salvo que renuncie (art. 31.1.1.ª LIRPF). No es obligatoria en todo caso. La estimación indirecta es un método para otros supuestos, la Administración no decide la renuncia y el ejercicio de varias actividades no es la excepción."
  citation: "art. 31.1.1.ª LIRPF"
  difficulty: 2
  tags:
  - "estimación objetiva"
# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0192
  prompt:
    es: "De acuerdo con el artículo 31.1.5.ª de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los supuestos de renuncia o exclusión de la estimación objetiva:"
  options:
  - id: a
    text:
      es: "El contribuyente determina el rendimiento neto de la actividad afectada por el método de estimación directa durante el año siguiente."
  - id: b
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por el método de estimación indirecta durante los tres años siguientes."
  - id: c
    correct: true
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por el método de estimación directa durante los tres años siguientes."
  - id: d
    text:
      es: "El contribuyente determina el rendimiento neto de todas sus actividades económicas por el método de estimación directa durante los cinco años siguientes."
  explanation:
    es: "Tras la renuncia o exclusión de la estimación objetiva se aplica la estimación directa a todas las actividades durante tres años (art. 31.1.5.ª LIRPF). Cinco años no es el plazo, la estimación indirecta es otro método y el efecto no se limita a una actividad ni a un año."
  citation: "art. 31.1.5.ª LIRPF"
  difficulty: 2
  tags:
  - "estimación objetiva"
  - "plazo"
# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0193
  prompt:
    es: "Para el período impositivo 2026, señale la respuesta CORRECTA sobre el volumen de rendimientos íntegros del año inmediato anterior que excluye la estimación objetiva para el conjunto de actividades económicas, excepto las agrícolas, ganaderas y forestales, de acuerdo con el artículo 31.1.3.ª.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "El método no puede aplicarse cuando el volumen supera 250.000 euros anuales."
  - id: b
    text:
      es: "El método no puede aplicarse cuando el volumen supera 600.000 euros anuales."
  - id: c
    correct: true
    text:
      es: "El método no puede aplicarse cuando el volumen supera 150.000 euros anuales."
  - id: d
    text:
      es: "El método no puede aplicarse cuando el volumen supera 75.000 euros anuales."
  explanation:
    es: "El límite para las actividades distintas de las agrícolas, ganaderas y forestales es de 150.000 euros anuales de rendimientos íntegros del año anterior (art. 31.1.3.ª.b) LIRPF), a lo que remite el artículo 3.1.a) de la Orden HAC/1425/2025 para 2026. Los 250.000 euros son el límite de las actividades agrícolas, ganaderas y forestales, los 75.000, el de las operaciones facturadas a empresarios o profesionales, y los 600.000, el de la modalidad simplificada."
  citation: "art. 31.1.3.ª LIRPF"
  difficulty: 2
  tags:
  - "estimación objetiva"
  - "cifra anual"
# anchor: boe-a-2006-20764-art-31
- id: m03-l15-q0194
  prompt:
    es: "Para el período impositivo 2026, señale la respuesta CORRECTA sobre el volumen de rendimientos íntegros del año inmediato anterior correspondiente a operaciones por las que se esté obligado a expedir factura cuando el destinatario sea empresario o profesional, según el artículo 31.1.3.ª.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "El método de estimación objetiva no puede aplicarse cuando dicho volumen supera 150.000 euros anuales."
  - id: b
    correct: true
    text:
      es: "El método de estimación objetiva no puede aplicarse cuando dicho volumen supera 75.000 euros anuales."
  - id: c
    text:
      es: "El método de estimación objetiva no puede aplicarse cuando dicho volumen supera 50.000 euros anuales."
  - id: d
    text:
      es: "El método de estimación objetiva no puede aplicarse cuando dicho volumen supera 250.000 euros anuales."
  explanation:
    es: "Para las operaciones facturadas a empresarios o profesionales el límite es de 75.000 euros anuales, sin perjuicio del general de 150.000 (art. 31.1.3.ª.b) LIRPF). Los 150.000 son el límite global, los 250.000 el de las actividades agrícolas, ganaderas y forestales, y los 50.000 no figuran en el artículo."
  citation: "art. 31.1.3.ª LIRPF"
  difficulty: 2
  tags:
  - "estimación objetiva"
  - "cifra anual"
