    - id: m03-l11
      title:
        es: 'Las actuaciones y el procedimiento de recaudación tributaria: la recaudación en período ejecutivo.
          Iniciación. Efectos. Recargos del período ejecutivo. Procedimiento de apremio: características,
          concurrencia y suspensión del procedimiento. Providencia de apremio: concepto y plazos para el pago.
          Las garantías de la deuda tributaria: tipos y ejecución de garantías.'
      summary:
        es: 'El RGR define la gestión recaudatoria y regula los órganos de recaudación del Estado y las entidades
          colaboradoras. El período ejecutivo se inicia, para las deudas liquidadas por la Administración, el día
          siguiente al del vencimiento del plazo de ingreso del artículo 62 de la LGT, y para las autoliquidadas sin
          ingreso, al día siguiente de la finalización del plazo de ingreso o, si este ya hubiera concluido, el día
          siguiente a la presentación de la autoliquidación; sus recargos son del 5 %, del 10 % o del 20 %, según el
          momento del pago, y la deuda apremiada se paga en los plazos del artículo 62.5 de la LGT. Las garantías de
          la deuda tributaria que trata la lección son el derecho de prelación, la hipoteca legal tácita, la afección
          de bienes, el derecho de retención, las medidas cautelares y las garantías para el aplazamiento y
          fraccionamiento, y la lección trata también la ejecución de garantías.'
