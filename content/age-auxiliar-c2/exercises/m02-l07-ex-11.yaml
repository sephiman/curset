# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q188
  prompt:
    es: "Según la página de Microsoft sobre las herramientas del sistema, ¿qué es el Registro de Windows 11 al que se accede con el Editor del Registro?"
  options:
  - id: a
    text:
      es: "Una copia de seguridad automática de las bibliotecas en una unidad externa o en una ubicación de red"
  - id: b
    correct: true
    text:
      es: "Una base de datos que almacena la configuración de bajo nivel de Windows y de las aplicaciones que lo usan"
  - id: c
    text:
      es: "Un registro cronológico de los eventos del sistema, la seguridad y las aplicaciones, con su origen y su fecha"
  - id: d
    text:
      es: "Una carpeta del Panel de control con herramientas para administradores y usuarios avanzados de Windows"
  explanation:
    es: "El Registro es una base de datos con la configuración de bajo nivel de Windows y de las aplicaciones que optan por usarlo. El registro de eventos es el que muestra el Visor de eventos, la carpeta del Panel de control es Herramientas de Windows y la copia de las bibliotecas es el Historial de archivos."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Registro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-windows-html
- id: m02-l07-q189
  prompt:
    es: "Según la ayuda de Microsoft, ¿cuál de las siguientes descripciones corresponde a la carpeta Herramientas de Windows de Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Una carpeta del Panel de control con herramientas para administradores y usuarios avanzados"
  - id: b
    text:
      es: "Una carpeta del menú Inicio con los accesorios de dibujo y captura"
  - id: c
    text:
      es: "Una carpeta del Explorador de archivos con las bibliotecas del usuario"
  - id: d
    text:
      es: "Una carpeta de Configuración con las opciones de privacidad y seguridad"
  explanation:
    es: "Herramientas de Windows es una carpeta del Panel de control de Windows 11 con herramientas para administradores y usuarios avanzados. Los accesorios como Paint o Recortes son aplicaciones aparte, las opciones de privacidad están en Configuración y las bibliotecas son una función del Explorador."
  citation: "fuente: `ms-win-herramientas-windows.html`; «Herramientas de Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-certmgr-html
- id: m02-l07-q192
  prompt:
    es: "En Windows 11, ¿qué se abre al escribir certmgr.msc en el cuadro de diálogo Ejecutar, según la página de Microsoft sobre certificados?"
  options:
  - id: a
    correct: true
    text:
      es: "El Administrador de certificados del usuario actual"
  - id: b
    text:
      es: "El Administrador de certificados del dispositivo local"
  - id: c
    text:
      es: "El Editor del Registro"
  - id: d
    text:
      es: "La consola de Administración de equipos"
  explanation:
    es: "certmgr.msc abre el Administrador de certificados para el usuario actual; el del dispositivo local se abre con certlm.msc. La consola de Administración de equipos se abre con compmgmt.msc y el Editor del Registro con regedit."
  citation: "fuente: `ms-win-certmgr.html`; «Visualización de certificados con la herramienta Administrador de certificados»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-certmgr-html
- id: m02-l07-q193
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones se escribe en el cuadro Ejecutar para abrir el Administrador de certificados del dispositivo local?"
  options:
  - id: a
    text:
      es: "eventvwr.msc"
  - id: b
    correct: true
    text:
      es: "certlm.msc"
  - id: c
    text:
      es: "certmgr.msc"
  - id: d
    text:
      es: "compmgmt.msc"
  explanation:
    es: "certlm.msc abre el Administrador de certificados del dispositivo local. certmgr.msc abre el del usuario actual, eventvwr.msc el Visor de eventos y compmgmt.msc la consola de Administración de equipos."
  citation: "fuente: `ms-win-certmgr.html`; «Visualización de certificados con la herramienta Administrador de certificados»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-certmgr-html
- id: m02-l07-q195
  prompt:
    es: "Si una persona no es administradora del dispositivo con Windows 11, ¿qué certificados puede administrar con el complemento de certificados de MMC?"
  options:
  - id: a
    text:
      es: "Los del ordenador local, pero no los de su cuenta"
  - id: b
    text:
      es: "Solo los de las cuentas de servicio"
  - id: c
    text:
      es: "Los de todas las cuentas del equipo"
  - id: d
    correct: true
    text:
      es: "Solo los de su propia cuenta de usuario"
  explanation:
    es: "Quien no es administrador solo puede administrar certificados de su cuenta de usuario. Los de todas las cuentas o los del ordenador local exigen ser administrador, y las cuentas de servicio tampoco son su alcance."
  citation: "fuente: `ms-win-certmgr.html`; «Visualización de los certificados en el complemento de MMC»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win-cmd-html
- id: m02-l07-q196
  prompt:
    es: "En Windows 11, ¿qué muestra el comando cmd cuando se ejecuta sin parámetros, según la referencia de Microsoft?"
  options:
  - id: a
    text:
      es: "La lista de todos los comandos disponibles con su sintaxis"
  - id: b
    correct: true
    text:
      es: "La versión y la información de copyright del sistema operativo"
  - id: c
    text:
      es: "Los procesos en ejecución y su consumo de memoria y CPU"
  - id: d
    text:
      es: "La configuración de red del equipo y su dirección IP actual"
  explanation:
    es: "Sin parámetros, cmd muestra la versión y la información de copyright del sistema operativo. La ayuda con la sintaxis se obtiene con /?, los procesos y su memoria se ven en el Administrador de tareas y la configuración de red no es salida de cmd."
  citation: "fuente: `ms-win-cmd.html`; «cmd»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q199
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas lleva a Windows Update para buscar actualizaciones manualmente?"
  options:
  - id: a
    text:
      es: "Inicio › Configuración › Privacidad & seguridad › Buscar en Windows"
  - id: b
    text:
      es: "Panel de control › Sistema y seguridad › Historial de archivos"
  - id: c
    text:
      es: "Inicio › Configuración › Sistema › Almacenamiento"
  - id: d
    correct: true
    text:
      es: "Inicio › Configuración › Windows Update"
  explanation:
    es: "La búsqueda manual de actualizaciones está en Inicio › Configuración › Windows Update. Sistema › Almacenamiento lleva a las recomendaciones de limpieza, el Historial de archivos está en el Panel de control y Buscar en Windows es la configuración de indexación."
  citation: "fuente: `ms-win-update.html`; «Resumen»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q200
  prompt:
    es: "Según la página de Microsoft sobre Windows Update, ¿cómo trata Windows 11 las actualizaciones de forma predeterminada?"
  options:
  - id: a
    text:
      es: "Solo las instala cuando el usuario las solicita en Windows Update"
  - id: b
    correct: true
    text:
      es: "Las descarga e instala automáticamente"
  - id: c
    text:
      es: "Las descarga automáticamente, pero cada instalación debe aprobarla el usuario"
  - id: d
    text:
      es: "Solo instala las de seguridad y deja las demás sin aplicar"
  explanation:
    es: "Windows 11 descarga e instala las actualizaciones por sí solo, con correcciones y actualizaciones de seguridad. No espera la aprobación de cada instalación ni una petición del usuario, y no se limita a las de seguridad."
  citation: "fuente: `ms-win-update.html`; «Resumen»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q201
  prompt:
    es: "En Windows 11, ¿qué ocurre al seleccionar una duración junto a Pausar actualizaciones en Windows Update?"
  options:
  - id: a
    text:
      es: "Se desinstalan las actualizaciones instaladas durante el periodo elegido"
  - id: b
    correct: true
    text:
      es: "Se detienen temporalmente la descarga y la instalación, pero no por completo"
  - id: c
    text:
      es: "Se detienen por completo las actualizaciones hasta que el usuario las reactive"
  - id: d
    text:
      es: "Se detiene la búsqueda de actualizaciones, pero se instalan las ya descargadas"
  explanation:
    es: "Pausar actualizaciones solo las detiene un tiempo: al alcanzar el límite de pausa hay que instalar las últimas para poder pausar de nuevo. Las actualizaciones no se pueden detener por completo, y pausar no desinstala nada ni deja instalar las ya descargadas."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo hacer que las actualizaciones dejen de descargarse e instalarse?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q202
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones de Windows Update permite elegir un momento conveniente para el reinicio que termina de instalar una actualización?"
  options:
  - id: a
    text:
      es: "Buscar actualizaciones"
  - id: b
    correct: true
    text:
      es: "Programar el reinicio"
  - id: c
    text:
      es: "Historial de actualizaciones"
  - id: d
    text:
      es: "Pausar actualizaciones"
  explanation:
    es: "Programar el reinicio permite elegir la hora. Pausar actualizaciones detiene la instalación un tiempo, Buscar actualizaciones consulta las disponibles y el Historial de actualizaciones enumera las instaladas."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo asegurarme de que mi dispositivo se reiniciará para instalar actualizaciones en un momento conveniente?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q206
  prompt:
    es: "Según la página de Microsoft sobre Windows Update, ¿cuál de las siguientes descripciones corresponde a las actualizaciones de calidad de Windows 11?"
  options:
  - id: a
    text:
      es: "Nuevas funcionalidades y capacidades, y son menos frecuentes que las de seguridad"
  - id: b
    text:
      es: "Solo versiones nuevas de las aplicaciones de Microsoft 365 para suscriptores"
  - id: c
    correct: true
    text:
      es: "Pequeñas correcciones y actualizaciones de seguridad, y son más frecuentes"
  - id: d
    text:
      es: "Solo controladores de dispositivos, instalados a petición del usuario en cada caso"
  explanation:
    es: "Las actualizaciones de calidad son más frecuentes e incluyen sobre todo pequeñas correcciones y actualizaciones de seguridad. Las nuevas funcionalidades son propias de las actualizaciones de funciones, y no se limitan a controladores ni a aplicaciones de Microsoft 365."
  citation: "fuente: `ms-win-update.html`; «¿Cuál es la diferencia entre una actualización de funciones y una actualización de calidad?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l07-q207
  prompt:
    es: "Según el glosario de términos de ciberseguridad del INCIBE, ¿cómo se aplica una actualización de seguridad en el software de un dispositivo?"
  options:
  - id: a
    text:
      es: "Solo con el dispositivo desconectado de la red"
  - id: b
    text:
      es: "Solo de forma automática, sin intervención del usuario"
  - id: c
    text:
      es: "Solo de forma manual, desde el sitio del fabricante"
  - id: d
    correct: true
    text:
      es: "De forma automática o manual"
  explanation:
    es: "El glosario habla de modificaciones aplicadas de forma automática o manual. Reducirlo a solo automática, solo manual o solo sin red cambia la definición."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Actualización de seguridad»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l07-q209
  prompt:
    es: "Según el glosario del INCIBE, ¿quién desarrolla generalmente los parches de seguridad, y cuándo lo hace?"
  options:
  - id: a
    text:
      es: "El administrador de la red, al configurar el cortafuegos"
  - id: b
    text:
      es: "El proveedor de Internet, al renovar el contrato del cliente"
  - id: c
    correct: true
    text:
      es: "El fabricante del software, tras detectar una vulnerabilidad"
  - id: d
    text:
      es: "El usuario, cuando instala una aplicación nueva"
  explanation:
    es: "Los parches de seguridad los desarrolla generalmente el fabricante del software tras detectar una vulnerabilidad, y pueden instalarse de forma automática o manual. El usuario, el administrador de red y el proveedor de Internet no los desarrollan: como mucho los instalan."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Parche de seguridad»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q211
  prompt:
    es: "¿Cuál de las siguientes rutas lleva en Windows 11 a las Recomendaciones de limpieza, según la ayuda de Microsoft para liberar espacio?"
  options:
  - id: a
    correct: true
    text:
      es: "Inicio › Configuración › Sistema › Almacenamiento › Recomendaciones de limpieza"
  - id: b
    text:
      es: "Panel de control › Sistema y seguridad › Recomendaciones de limpieza"
  - id: c
    text:
      es: "Inicio › Configuración › Sistema › Acerca de › Especificaciones › Recomendaciones de limpieza"
  - id: d
    text:
      es: "Inicio › Configuración › Windows Update › Opciones avanzadas › Recomendaciones de limpieza"
  explanation:
    es: "Las Recomendaciones de limpieza están en Sistema › Almacenamiento. Acerca de muestra los datos del dispositivo, Windows Update gestiona las actualizaciones y el Panel de control › Sistema y seguridad contiene el Historial de archivos."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Liberar espacio con las recomendaciones de limpieza»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q215
  prompt:
    es: "En Windows 11, ¿qué ocurre si se elimina la versión anterior de Windows, es decir, la carpeta Windows.old, para liberar espacio?"
  options:
  - id: a
    text:
      es: "Se puede restaurar desde la Papelera de reciclaje durante 10 días"
  - id: b
    text:
      es: "Se conserva una copia en OneDrive para volver a ella"
  - id: c
    text:
      es: "Solo se elimina de la unidad y se puede recuperar con Restaurar versiones anteriores"
  - id: d
    correct: true
    text:
      es: "No se puede deshacer y ya no se puede volver a la versión anterior"
  explanation:
    es: "Eliminar la versión anterior elimina la carpeta Windows.old, que da la opción de volver a la versión previa; la acción no se puede deshacer. La Papelera, OneDrive o Restaurar versiones anteriores no la recuperan."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Liberar espacio con las recomendaciones de limpieza»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q223
  prompt:
    es: "En Windows, ¿qué guarda en el disco duro Archivos a petición de OneDrive para ahorrar espacio, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Un archivo de marcador de posición más pequeño en lugar del archivo completo"
  - id: b
    text:
      es: "Una copia comprimida en zip del archivo completo"
  - id: c
    text:
      es: "Solo las miniaturas de los archivos de OneDrive"
  - id: d
    text:
      es: "El archivo completo, pero cifrado y sin permisos de edición"
  explanation:
    es: "Archivos a petición de OneDrive almacena un marcador de posición más pequeño en lugar del archivo de tamaño completo guardado en la nube. No crea copias zip, no guarda el archivo completo y no se limita a miniaturas."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Activar Archivos a petición de OneDrive»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q282
  prompt:
    es: "Al configurar el Historial de archivos en Windows 11, si no hay ninguna unidad seleccionada de manera predeterminada, ¿cuál de las siguientes opciones permite elegir una diferente?"
  options:
  - id: a
    text:
      es: "Activar"
  - id: b
    correct: true
    text:
      es: "Seleccionar unidad"
  - id: c
    text:
      es: "Abrir en el Historial de archivos"
  - id: d
    text:
      es: "Restaurar en..."
  explanation:
    es: "Seleccionar unidad permite elegir la unidad externa o la ubicación de red para las copias. Activar habilita el Historial, y Restaurar en... y Abrir en el Historial de archivos son opciones de la restauración."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q283
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del menú contextual de una carpeta fuera de las bibliotecas la agrega a una biblioteca para el Historial de archivos?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Enviar a › Escritorio (crear acceso directo)"
  - id: b
    correct: true
    text:
      es: "Mostrar más opciones › Incluir en biblioteca"
  - id: c
    text:
      es: "Restaurar versiones anteriores"
  - id: d
    text:
      es: "Anclar a acceso rápido"
  explanation:
    es: "Con clic derecho en la carpeta, Mostrar más opciones › Incluir en biblioteca la agrega a una biblioteca. Enviar a › Escritorio crea un acceso directo, Anclar a acceso rápido la fija en Inicio y Restaurar versiones anteriores sirve para restaurar."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m02-l07-q284
  prompt:
    es: "Señale la afirmación correcta sobre cómo restaurar con el Historial de archivos de Windows 11 un archivo incluido en una biblioteca:"
  options:
  - id: a
    text:
      es: "Se hace clic con el botón derecho en la unidad externa donde está la copia"
  - id: b
    text:
      es: "Se abre Windows Update y se selecciona la opción Desinstalar actualizaciones"
  - id: c
    text:
      es: "Se hace clic con el botón derecho en la biblioteca, que restaura todos sus archivos a la vez"
  - id: d
    correct: true
    text:
      es: "Se hace clic con el botón derecho en el archivo o carpeta en su ubicación, no en la biblioteca"
  explanation:
    es: "Para restaurar una versión anterior de un elemento de una biblioteca se usa el menú del elemento en su ubicación, no el de la biblioteca. La unidad externa guarda las copias pero no es el punto de partida, y Desinstalar actualizaciones quita actualizaciones de Windows."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-certmgr-html
- id: m02-l07-q295
  prompt:
    es: "Señale la afirmación correcta sobre el Administrador de certificados de Windows 11, según la página de Microsoft sobre certificados:"
  options:
  - id: a
    correct: true
    text:
      es: "certmgr.msc abre el del usuario actual y certlm.msc el del dispositivo local"
  - id: b
    text:
      es: "certmgr.msc abre el del dispositivo local y certlm.msc el del usuario actual"
  - id: c
    text:
      es: "certlm.msc abre la consola MMC vacía, sin ningún complemento cargado"
  - id: d
    text:
      es: "certmgr.msc y certlm.msc abren el mismo almacén de certificados"
  explanation:
    es: "certmgr.msc abre el almacén del usuario actual y certlm.msc el del dispositivo local. Intercambiar los comandos contradice la página, los dos no abren el mismo almacén, y certlm.msc abre el Administrador de certificados, no una consola MMC vacía."
  citation: "fuente: `ms-win-certmgr.html`; «Visualización de certificados con la herramienta Administrador de certificados»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q297
  prompt:
    es: "Señale la afirmación correcta sobre el historial de actualizaciones de Windows Update en Windows 11, según Microsoft:"
  options:
  - id: a
    text:
      es: "Permite quitar cualquier actualización y Microsoft lo recomienda en cada reinicio"
  - id: b
    correct: true
    text:
      es: "Permite ver qué actualizaciones se instalaron y cuándo, y desinstalar algunas"
  - id: c
    text:
      es: "Solo muestra las actualizaciones de funciones y no permite quitar ninguna"
  - id: d
    text:
      es: "Se abre con Programar el reinicio y muestra las horas activas del equipo"
  explanation:
    es: "El historial de actualizaciones muestra qué se instaló y cuándo; ahí se puede quitar una actualización con Desinstalar actualizaciones, aunque no se recomienda y no todas se pueden quitar. Programar el reinicio es otra opción de Windows Update."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo ver las actualizaciones instaladas?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q315
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la aplicación Configuración, según la tabla de métodos abreviados con la tecla Windows?"
  options:
  - id: a
    text:
      es: "Windows+E"
  - id: b
    text:
      es: "Windows+Ctrl+Q"
  - id: c
    text:
      es: "Windows+D"
  - id: d
    correct: true
    text:
      es: "Windows+I"
  explanation:
