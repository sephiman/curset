# anchor: fuente-ms-access-dividir-html
- id: m06-l06-q029
  prompt:
    es: "Señale cómo se archivan los datos según la ayuda de Microsoft sobre dividir una base de datos de Access 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Moviendo periódicamente los registros antiguos a una base de datos diferente"
  - id: b
    text:
      es: "Moviendo las tablas a una base back-end y los demás objetos a una front-end"
  - id: c
    text:
      es: "Compactando la base de datos para eliminar los registros más antiguos"
  - id: d
    text:
      es: "Guardando la base de datos como archivo compilado .accde de solo lectura"
  explanation:
    es: "La página advierte que dividir no es lo mismo que archivar, y que «los datos se archivan moviendo periódicamente registros antiguos a una base de datos diferente». Mover las tablas a la back-end es dividir. Compactar elimina espacio no utilizado, no registros, y el .accde impide cambiar el diseño de los objetos."
  citation: "fuente: `ms-access-dividir.html`; «Dividir una base de datos de Access»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q030
  prompt:
    es: "En Access 365, ¿cuál de las siguientes listas contiene solo tipos de gráfico que se pueden crear en un formulario o informe?"
  options:
  - id: a
    text:
      es: "Cascada, embudo, superficie y nubes de palabras"
  - id: b
    text:
      es: "Cascada, rectángulos, anillos y nubes de palabras"
  - id: c
    text:
      es: "Mapas, embudo, anillos y nubes de palabras"
  - id: d
    correct: true
    text:
      es: "Cascada, embudo, anillos y nubes de palabras"
  explanation:
    es: "La página enumera los gráficos que se pueden crear en Access: «columnas, líneas, barras, áreas, radares, circulares, combinados, arcos, cajas y bigotes, burbujas, anillos, embudos, dispersiones, cascadas y nubes de palabras». Superficie, rectángulos y mapas no están en esa lista."
  citation: "fuente: `ms-access-graficos.html`; «¿Qué gráficos se pueden crear?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q031
  prompt:
    es: "En Access 365, ¿dónde se puede agregar un gráfico para visualizar los datos, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "En un formulario o en un informe, enlazado a una tabla o consulta"
  - id: b
    text:
      es: "En una tabla o en una consulta, enlazado a un formulario o informe"
  - id: c
    text:
      es: "Solo en un informe, enlazado a una consulta de parámetros"
  - id: d
    text:
      es: "Solo en un formulario, enlazado a una tabla de la base back-end"
  explanation:
    es: "La página dice: «Puede agregar un gráfico a un formulario o informe en Access» y «puede enlazar el gráfico a una tabla o consulta». La opción de tabla o consulta invierte dónde va el gráfico y a qué se enlaza. Las que dicen «solo» dejan fuera el formulario o el informe."
  citation: "fuente: `ms-access-graficos.html`; «Crear un gráfico en un formulario o informe»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q032
  prompt:
    es: "En Access 365, ¿cuál de las siguientes ternas recoge las dimensiones a las que se asignan los campos de un gráfico?"
  options:
  - id: a
    text:
      es: "Eje (categoría), Filtro (página) y Valores (eje Y)"
  - id: b
    text:
      es: "Filas (categoría), Columnas (serie) y Valores (eje Y)"
  - id: c
    text:
      es: "Eje (categoría), Leyenda (serie) y Tamaño (burbuja)"
  - id: d
    correct: true
    text:
      es: "Eje (categoría), Leyenda (serie) y Valores (eje Y)"
  explanation:
    es: "La página dice que «las dimensiones Eje (categoría), Leyenda (serie), y Valores (eje Y) se organizan de diferentes maneras en función del tipo de gráfico». Filtro, Filas, Columnas y Tamaño no son dimensiones del gráfico en esa página."
  citation: "fuente: `ms-access-graficos.html`; «Crear un gráfico»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q033
  prompt:
    es: "En un gráfico de un formulario de Access 365, ¿qué agregación aplica Access de forma predeterminada a un campo de texto seleccionado en Valores (eje Y)?"
  options:
  - id: a
    text:
      es: "La agregación Suma"
  - id: b
    text:
      es: "La agregación Promedio"
  - id: c
    correct: true
    text:
      es: "La agregación Cuenta"
  - id: d
    text:
      es: "Ninguna agregación"
  explanation:
    es: "La página dice que en los campos numéricos y de moneda la agregación predeterminada es Suma y que «en el resto de campos, la agregación predeterminada es Cuenta»; añade que los campos de texto deben usar la agregación de recuentos. Suma es la de los campos numéricos y de moneda, Promedio no es la predeterminada de ningún campo, y Ninguno es una opción que hay que elegir para quitar la agregación."
  citation: "fuente: `ms-access-graficos.html`; «Configuración de los datos»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "función"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q034
  prompt:
    es: "En el panel Configuración de gráfico de Access 365, ¿cuántos campos se pueden seleccionar en la sección Leyenda (serie)?"
  options:
  - id: a
    text:
      es: "Hasta dos campos"
  - id: b
    text:
      es: "Hasta diez campos"
  - id: c
    text:
      es: "Todos los del origen"
  - id: d
    correct: true
    text:
      es: "Un solo campo"
  explanation:
    es: "La página dice: «Solo puede seleccionar un campo de Leyenda (Serie), pero puede seleccionar más de un campo de las secciones Valores (eje Y) o Eje (Categoría)». Las opciones de dos, diez o todos los campos contradicen ese límite."
  citation: "fuente: `ms-access-graficos.html`; «Configuración de los datos»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q035
  prompt:
    es: "En el panel Configuración de gráfico de Access 365, si se seleccionan dos o más campos en Valores (eje Y), ¿cuál de las siguientes afirmaciones sobre la leyenda es correcta?"
  options:
  - id: a
    text:
      es: "Hay que elegir un campo de Leyenda distinto para cada campo de Valores"
  - id: b
    text:
      es: "El primer campo de Valores pasa automáticamente a la sección Leyenda"
  - id: c
    correct: true
    text:
      es: "No se puede elegir un campo de Leyenda y los campos de Valores forman la leyenda"
  - id: d
    text:
      es: "La leyenda se oculta y el gráfico muestra solo los campos de la sección Eje"
  explanation:
    es: "La página dice: «Al seleccionar dos o más campos de Valores (eje Y), no puede seleccionar un campo de Leyenda (Serie). Los campos Valores (eje Y) se convierten en la leyenda de forma predeterminada». No se elige un campo de Leyenda por cada valor, ningún campo pasa a la sección Leyenda y la leyenda no se oculta."
  citation: "fuente: `ms-access-graficos.html`; «Configuración de los datos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q037
  prompt:
    es: "Señale la afirmación correcta sobre el gráfico clásico de Access 365, frente al gráfico basado en la tecnología moderna:"
  options:
  - id: a
    text:
      es: "Es un control ActiveX y ya no se puede agregar a un formulario ni a un informe"
  - id: b
    text:
      es: "Se basa en la tecnología moderna y no puede convivir con el gráfico nuevo"
  - id: c
    text:
      es: "Es un control ActiveX que solo se puede agregar a tablas y a consultas"
  - id: d
    correct: true
    text:
      es: "Es un control ActiveX y se puede seguir usando, incluso junto al gráfico nuevo"
  explanation:
    es: "La página dice que el gráfico clásico «es un control ActiveX» y que «puede seguir usando el gráfico clásico e, incluso, agregarlo a un formulario o a un informe que tenga el nuevo gráfico». Por eso no es cierto que ya no se pueda agregar ni que no conviva con el nuevo. La tecnología moderna es la del gráfico nuevo, y los gráficos van en formularios e informes, no en tablas ni consultas."
  citation: "fuente: `ms-access-graficos.html`; «Consideraciones importantes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q038
  prompt:
    es: "En Access 365, ¿cuál es la combinación predeterminada de un gráfico combinado con dos series de datos?"
  options:
  - id: a
    text:
      es: "Línea en la primera serie y Columna agrupada en la segunda"
  - id: b
    text:
      es: "Barra agrupada en la primera serie y Línea en la segunda"
  - id: c
    text:
      es: "Columna apilada en la primera serie y Área en la segunda"
  - id: d
    correct: true
    text:
      es: "Columna agrupada en la primera serie y Línea en la segunda"
  explanation:
    es: "La página da como combinación predeterminada del gráfico combinado la de Columna agrupada seguida de Línea, una por serie de datos. La opción que empieza por Línea invierte el orden; las de Barra agrupada y Columna apilada con Área cambian uno de los tipos por otro que Access también ofrece pero que no es el predeterminado."
  citation: "fuente: `ms-access-graficos.html`; «Configuración del formato»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q039
  prompt:
    es: "En Access 365, al crear un gráfico circular en un formulario o informe, ¿qué campos indica la ayuda de Microsoft que se seleccionen?"
  options:
  - id: a
    text:
      es: "Un campo de Eje (categoría), uno de Leyenda (serie) y uno de Valores (eje Y)"
  - id: b
    text:
      es: "Varios campos de Valores (eje Y) y ninguno de Eje (categoría)"
  - id: c
    correct: true
    text:
      es: "Un solo campo de Eje (categoría) y un solo campo de Valores (eje Y)"
  - id: d
    text:
      es: "Un campo de Leyenda (serie) y varios campos de Valores (eje Y)"
  explanation:
    es: "Para el gráfico circular la página dice: «Seleccione solo un campo para la dimensión Eje (Categoría) y solo un campo para la dimensión Valores (eje Y). No use el campo Leyenda (serie)», porque el Eje se convierte en la leyenda. Las opciones con Leyenda contradicen esa indicación, y la de varios valores sin eje deja fuera el campo de Eje que la página pide."
  citation: "fuente: `ms-access-graficos.html`; «Circular»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q040
  prompt:
    es: "En Access 365, ¿cuál de las siguientes descripciones corresponde a un gráfico de nube de palabras?"
  options:
  - id: a
    text:
      es: "Muestra un total acumulado de datos financieros al sumar o restar valores"
  - id: b
    correct: true
    text:
      es: "Muestra qué palabras tienen la mayor frecuencia en el origen de datos"
  - id: c
    text:
      es: "Muestra la distribución de los datos en cuartiles, con la media y los valores atípicos"
  - id: d
    text:
      es: "Muestra los cambios de los valores con respecto a un punto central del gráfico"
  explanation:
    es: "La página dice que una nube de palabras «transmite rápidamente qué palabras tienen la mayor frecuencia en el origen de datos». El total acumulado es el gráfico de cascada, los cuartiles y valores atípicos son el de cajas y bigotes, y los cambios respecto a un punto central, el radar."
  citation: "fuente: `ms-access-graficos.html`; «Nube de palabras»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-graficos-html
- id: m06-l06-q042
  prompt:
    es: "En un gráfico de Access 365, si se seleccionan campos de Eje (categoría), de Valores (eje Y) y de Leyenda (serie), ¿cuál de las siguientes es la consulta en que Access convierte el origen de la fila?"
  options:
  - id: a
    correct: true
    text:
      es: "Una consulta de tabla de referencias cruzadas con la instrucción TRANSFORM"
  - id: b
    text:
      es: "Una instrucción SELECT sencilla, sin agregaciones ni agrupación"
  - id: c
    text:
      es: "Una instrucción con GROUP BY, sin columnas de valores dinamizados"
  - id: d
    text:
      es: "Una consulta de acción que crea una tabla nueva con los datos del gráfico"
  explanation:
    es: "La página dice: «Si se selecciona también un campo Leyenda (serie), Access convierte el origen de la fila en una consulta de tabla de referencias cruzadas (usando para ello la instrucción de consulta SQL TRANSFORM)», porque la leyenda dinamiza los valores del campo en encabezados de columna. La instrucción SELECT sencilla es lo que la página da para Eje y Valores sin agregaciones. La instrucción con GROUP BY y sin columnas dinamizadas es lo que da para Eje y Valores con agregación. Y la consulta de acción que crea una tabla no es ninguna de las instrucciones que la página dice que se almacenan en la propiedad Origen de la fila: SELECT, GROUP BY o TRANSFORM."
  citation: "fuente: `ms-access-graficos.html`; «Consideraciones importantes»"
  difficulty: 3
  tags:
  - "comportamiento"
