# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q047
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Objetivos y las metas de la Agenda 2030 para el Desarrollo Sostenible es correcta, según su preámbulo?"
  options:
  - id: a
    text:
      es: "Conjugan dos dimensiones del desarrollo sostenible: la económica y la social."
  - id: b
    correct: true
    text:
      es: "Son de carácter integrado e indivisible."
  - id: c
    text:
      es: "Estimularán la acción durante los próximos diez años."
  - id: d
    text:
      es: "Dan por cumplidos los Objetivos de Desarrollo del Milenio."
  explanation:
    es: "El preámbulo dice que los Objetivos y las metas «son de carácter integrado e indivisible». Conjugan tres dimensiones, no dos: económica, social y ambiental. Estimularán la acción durante 15 años. No dan por cumplidos los Objetivos de Desarrollo del Milenio: pretenden «conseguir lo que estos no lograron»."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "concepto"
