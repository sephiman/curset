# anchor: boe-a-2015-11719-art-63
- id: m04-l04-q026
  prompt:
    es: "Según el artículo 63 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes NO es causa de pérdida de la condición de funcionario de carrera?"
  options:
  - id: a
    text:
      es: "La renuncia a la condición de funcionario."
  - id: b
    correct: true
    text:
      es: "La declaración en situación de servicios especiales."
  - id: c
    text:
      es: "La jubilación total del funcionario."
  - id: d
    text:
      es: "La pena firme de inhabilitación especial para cargo público."
  explanation:
    es: "El artículo 63 enumera cinco causas: renuncia, pérdida de la nacionalidad, jubilación total, separación del servicio firme e inhabilitación firme. La renuncia, la jubilación total y la inhabilitación especial firme están en esa lista. Los servicios especiales son una situación administrativa, y el funcionario conserva su condición."
  citation: "art. 63 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-63
- id: m04-l04-q027
  prompt:
    es: "Una funcionaria es sancionada con la separación del servicio y recurre la sanción. Según el artículo 63 del texto refundido de la Ley del Estatuto Básico del Empleado Público, mientras la sanción no sea firme:"
  options:
  - id: a
    correct: true
    text:
      es: "No pierde por esa causa la condición de funcionaria de carrera."
  - id: b
    text:
      es: "Pierde la condición desde que se le notifica la sanción."
  - id: c
    text:
      es: "Pierde la condición, que recupera si se estima el recurso."
  - id: d
    text:
      es: "Pierde la condición y pasa a excedencia forzosa hasta la resolución."
  explanation:
    es: "El artículo 63.d) hace perder la condición por «la sanción disciplinaria de separación del servicio que tuviere carácter firme». Una sanción recurrida todavía no es firme, así que la funcionaria conserva la condición. Perderla desde la notificación omite la firmeza que pide la letra d). Perderla y recuperarla si se estima el recurso contradice la misma letra: sin firmeza no hay pérdida, y no hay nada que recuperar. El artículo 63 enumera cinco causas de pérdida, y son estas: renuncia (a), pérdida de la nacionalidad (b), jubilación total (c), separación del servicio firme (d) y pena de inhabilitación firme (e). La excedencia forzosa no es ninguna de las cinco, y recurrir la sanción no cambia la situación de la funcionaria."
  citation: "art. 63 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-64
- id: m04-l04-q028
  prompt:
    es: "La renuncia voluntaria a la condición de funcionario de carrera, que es causa de pérdida de esa condición:"
  options:
  - id: a
    text:
      es: "Se manifiesta por escrito y se entiende aceptada si no hay respuesta en un mes."
  - id: b
    text:
      es: "Puede manifestarse de palabra ante el superior jerárquico, que la acepta."
  - id: c
    correct: true
    text:
      es: "Se manifiesta por escrito y la Administración la acepta expresamente."
  - id: d
    text:
      es: "Se manifiesta por escrito y surte efecto sin necesidad de aceptación."
  explanation:
    es: "El artículo 64.1 dice que la renuncia «habrá de ser manifestada por escrito y será aceptada expresamente por la Administración». La opción de la falta de respuesta en un mes introduce una aceptación tácita. La renuncia de palabra prescinde del escrito. La que surte efecto sin aceptación suprime la aceptación expresa."
  citation: "art. 64.1 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-11719-art-64
- id: m04-l04-q029
  prompt:
    es: "Según el artículo 64.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué circunstancia impide aceptar la renuncia a la condición de funcionario?"
  options:
  - id: a
    correct: true
    text:
      es: "Que tenga dictado auto de apertura de juicio oral por un delito."
  - id: b
    text:
      es: "Que tenga reconocida la compatibilidad para una actividad privada."
  - id: c
    text:
      es: "Que se encuentre en excedencia voluntaria por interés particular."
  - id: d
    text:
      es: "Que tenga anotada una sanción por falta leve ya cumplida."
  explanation:
    es: "El artículo 64.2 impide aceptar la renuncia cuando el funcionario «esté sujeto a expediente disciplinario o haya sido dictado en su contra auto de procesamiento o de apertura de juicio oral por la comisión de algún delito». El auto de apertura de juicio oral está en esa lista. La compatibilidad reconocida, la excedencia por interés particular y una sanción leve ya cumplida no figuran en ella."
  citation: "art. 64.2 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2015-11719-art-64
- id: m04-l04-q030
  prompt:
    es: "Cuatro funcionarios presentan por escrito su renuncia. Según el artículo 64.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de ellos puede ver aceptada su renuncia?"
  options:
  - id: a
    text:
      es: "El que está sujeto a un expediente disciplinario todavía sin resolver."
  - id: b
    text:
      es: "El que tiene dictado en su contra auto de procesamiento por un delito."
  - id: c
    correct: true
    text:
      es: "El que tuvo un expediente disciplinario que se archivó antes de renunciar."
  - id: d
    text:
      es: "El que tiene dictado auto de apertura de juicio oral por un delito."
  explanation:
    es: "El artículo 64.2 impide aceptar la renuncia mientras el funcionario «esté sujeto a expediente disciplinario» o tenga dictado auto de procesamiento o de apertura de juicio oral por algún delito. Quien tuvo un expediente ya archivado no está sujeto a él, y su renuncia escrita se acepta expresamente (art. 64.1). El expediente sin resolver, el auto de procesamiento y el auto de apertura de juicio oral son los tres impedimentos del artículo."
  citation: "art. 64.2 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-64
- id: m04-l04-q031
  prompt:
    es: "Un funcionario presenta por escrito su renuncia a la condición de funcionario después de dictarse en su contra auto de procesamiento por un delito. ¿Qué debe hacer la Administración?"
  options:
  - id: a
    text:
      es: "Aceptarla, porque la renuncia por escrito no puede rechazarse."
  - id: b
    correct: true
    text:
      es: "No aceptar la renuncia, porque se ha dictado auto de procesamiento."
  - id: c
    text:
      es: "Aceptarla si el delito no guarda relación con sus funciones."
  - id: d
    text:
      es: "Aceptarla y comunicar después la renuncia al órgano judicial."
  explanation:
    es: "El artículo 64.2 TREBEP dice que no podrá ser aceptada la renuncia cuando se haya dictado contra el funcionario «auto de procesamiento o de apertura de juicio oral por la comisión de algún delito». El artículo no distingue según el delito tenga o no relación con las funciones. Las tres opciones que aceptan la renuncia contradicen ese impedimento."
  citation: "art. 64.2 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-2015-11719-art-65
- id: m04-l04-q032
  prompt:
    es: "Según el artículo 65 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la pérdida de la nacionalidad tenida en cuenta para el nombramiento no hace perder la condición de funcionario si:"
  options:
  - id: a
    correct: true
    text:
      es: "Se adquiere a la vez la de otro Estado miembro de la Unión Europea."
  - id: b
    text:
      es: "Se adquiere la nacionalidad de otro Estado miembro dentro del año siguiente."
  - id: c
    text:
      es: "El funcionario acredita más de cinco años de servicios efectivos."
  - id: d
    text:
      es: "La pérdida se produce por una causa ajena a la voluntad del funcionario."
  explanation:
    es: "El artículo 65 hace perder la condición «salvo que simultáneamente se adquiera la nacionalidad de alguno de dichos Estados»: España, los demás Estados miembros de la Unión Europea y aquellos a los que se aplica la libre circulación de trabajadores. La adquisición tiene que ser simultánea, y un año después ya no salva la condición. Los años de servicios y la causa de la pérdida no aparecen en el artículo."
  citation: "art. 65 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-65
- id: m04-l04-q033
  prompt:
    es: "Una funcionaria nombrada con su nacionalidad portuguesa pierde esa nacionalidad y adquiere en ese mismo momento la española. Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué ocurre con su condición?"
  options:
  - id: a
    text:
      es: "La pierde, aunque puede pedir después la rehabilitación."
  - id: b
    correct: true
    text:
      es: "La conserva, porque adquiere a la vez la nacionalidad española."
  - id: c
    text:
      es: "La pierde, salvo que la Administración la rehabilite de oficio."
  - id: d
    text:
      es: "Queda en suspenso hasta que se inscriba la nueva nacionalidad."
  explanation:
    es: "El artículo 65 TREBEP hace perder la condición de funcionario a quien pierde la nacionalidad de un Estado miembro de la Unión Europea «que haya sido tenida en cuenta para el nombramiento», «salvo que simultáneamente se adquiera la nacionalidad de alguno de dichos Estados». La funcionaria adquiere la española a la vez que pierde la portuguesa, y España es uno de esos Estados, así que conserva la condición. Las dos opciones que hablan de rehabilitación, a petición suya o de oficio, parten de una pérdida que la excepción impide. La suspensión hasta inscribir la nueva nacionalidad añade un trámite que la salvedad no exige: basta con que la adquisición sea simultánea."
  citation: "art. 65 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-art-65
- id: m04-l04-q034
  prompt:
    es: "De acuerdo con el artículo 65 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la pérdida de la condición de funcionario se produce al perder la nacionalidad:"
  options:
  - id: a
    text:
      es: "De origen del funcionario, se tuviera o no en cuenta para el nombramiento."
  - id: b
    correct: true
    text:
      es: "Que haya sido tenida en cuenta para el nombramiento."
  - id: c
    text:
      es: "Que el funcionario tuviera al presentar la solicitud de participación."
  - id: d
    text:
      es: "Que figure como principal en el Registro Central de Personal."
  explanation:
    es: "El artículo 65 se refiere a la nacionalidad española o de otro de los Estados que cita «que haya sido tenida en cuenta para el nombramiento». La nacionalidad de origen, la que se tenía al presentar la solicitud o la que figure en un registro no son el criterio del artículo."
  citation: "art. 65 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-65
- id: m04-l04-q035
  prompt:
    es: "Un funcionario nombrado con la nacionalidad española la pierde y no adquiere a la vez la de ningún Estado miembro de la Unión Europea ni de otro Estado con libre circulación de trabajadores. ¿Qué consecuencia tiene?"
  options:
  - id: a
    text:
      es: "Pasa a la situación de suspensión de funciones."
  - id: b
    correct: true
    text:
      es: "Pierde la condición de funcionario de carrera."
  - id: c
    text:
      es: "Conserva la condición si lleva cinco años de servicios."
  - id: d
    text:
      es: "Pasa a la situación de excedencia forzosa."
  explanation:
    es: "El artículo 65 TREBEP dice que la pérdida de la nacionalidad tenida en cuenta para el nombramiento «determinará la pérdida de la condición de funcionario», salvo adquisición simultánea de la de alguno de los Estados que cita, y aquí no la hay. La suspensión de funciones y la excedencia forzosa son situaciones en las que se sigue siendo funcionario. Los años de servicios no aparecen en el artículo."
  citation: "art. 65 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-66
- id: m04-l04-q036
  prompt:
    es: "La pena principal o accesoria de inhabilitación especial, impuesta por sentencia firme, produce la pérdida de la condición de funcionario respecto de:"
  options:
  - id: a
    text:
      es: "Todos los empleos o cargos que tuviere el funcionario."
  - id: b
    text:
      es: "Todos los empleos o cargos del mismo cuerpo o escala."
  - id: c
    correct: true
    text:
      es: "Los empleos o cargos especificados en la sentencia."
  - id: d
    text:
      es: "Todos los empleos o cargos de la misma Administración."
  explanation:
    es: "El artículo 66 limita el efecto de la inhabilitación especial firme a «aquellos empleos o cargos especificados en la sentencia». Todos los empleos o cargos es el efecto de la inhabilitación absoluta. Las opciones del mismo cuerpo o escala y de la misma Administración no se apoyan en el artículo."
  citation: "art. 66 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-66
- id: m04-l04-q037
  prompt:
    es: "De acuerdo con el artículo 66 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la pena principal o accesoria de inhabilitación absoluta produce la pérdida de la condición de funcionario:"
  options:
  - id: a
    text:
      es: "Respecto de los empleos o cargos que especifique la sentencia firme."
  - id: b
    text:
      es: "Respecto de todos sus empleos o cargos, desde la apertura del juicio oral."
  - id: c
    text:
      es: "Respecto del cargo en que se cometió el delito, desde la primera sentencia."
  - id: d
    correct: true
    text:
      es: "Respecto de todos sus empleos o cargos, cuando la sentencia sea firme."
  explanation:
    es: "El artículo 66 dice que la inhabilitación absoluta, «cuando hubiere adquirido firmeza la sentencia que la imponga», produce la pérdida «respecto a todos los empleos o cargos que tuviere». Los cargos especificados en la sentencia son el efecto de la inhabilitación especial. Las opciones de la apertura del juicio oral y de la primera sentencia prescinden de la firmeza."
  citation: "art. 66 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-66
- id: m04-l04-q038
  prompt:
    es: "Un funcionario es condenado en primera instancia a la pena de inhabilitación absoluta y recurre la sentencia. Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, mientras se resuelve el recurso:"
  options:
  - id: a
    text:
      es: "Pierde la condición respecto de todos sus empleos desde la sentencia."
  - id: b
    text:
      es: "Pierde la condición solo respecto del cargo en que cometió el delito."
  - id: c
    correct: true
    text:
      es: "No pierde la condición de funcionario, porque la sentencia no es firme."
  - id: d
    text:
      es: "Pierde la condición, pero la recupera si el recurso prospera."
  explanation:
    es: "El artículo 66 liga la pérdida por inhabilitación absoluta al momento en que «hubiere adquirido firmeza la sentencia que la imponga». Recurrida la sentencia, no hay firmeza y la condición se conserva. Las otras tres opciones adelantan la pérdida a una sentencia que todavía no es firme; la del cargo concreto confunde además la inhabilitación absoluta con la especial."
  citation: "art. 66 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q039
  prompt:
    es: "Según el artículo 67.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la jubilación de los funcionarios podrá ser:"
  options:
  - id: a
    correct: true
    text:
      es: "Voluntaria, forzosa o por incapacidad permanente para las funciones de su cuerpo o escala."
  - id: b
    text:
      es: "Voluntaria o forzosa; la incapacidad permanente lleva a la excedencia forzosa."
  - id: c
    text:
      es: "Forzosa o por incapacidad permanente; la voluntaria solo cabe en cuerpos con normas específicas."
  - id: d
    text:
      es: "Voluntaria, forzosa o anticipada por reasignación de efectivos."
  explanation:
    es: "El artículo 67.1 TREBEP dice que la jubilación puede ser voluntaria, a solicitud del funcionario; forzosa, al cumplir la edad legal; o por incapacidad permanente para las funciones de su cuerpo o escala. La opción que manda la incapacidad a la excedencia forzosa suprime la tercera clase, que la letra c) recoge. La que limita la voluntaria a ciertos cuerpos contradice el apartado 2, que la admite siempre que el funcionario reúna los requisitos del régimen de Seguridad Social aplicable. La jubilación anticipada por reasignación de efectivos no es ninguna de las tres clases de las letras a), b) y c)."
  citation: "art. 67.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q040
  prompt:
    es: "De las clases de jubilación que pueden corresponder a un funcionario de carrera, la jubilación forzosa es la que se produce:"
  options:
  - id: a
    correct: true
    text:
      es: "Al cumplir el funcionario la edad legalmente establecida."
  - id: b
    text:
      es: "A solicitud del funcionario que reúna los requisitos de su régimen."
  - id: c
    text:
      es: "Por la declaración de incapacidad permanente para su cuerpo o escala."
  - id: d
    text:
      es: "Por la imposición firme de la sanción de separación del servicio."
  explanation:
    es: "El artículo 67.1.b) TREBEP define la jubilación forzosa como la que se produce «al cumplir la edad legalmente establecida». La solicitud del funcionario es la jubilación voluntaria. La incapacidad permanente es la tercera clase del mismo apartado. La separación firme del servicio es una sanción y una causa de pérdida distinta."
  citation: "art. 67.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q041
  prompt:
    es: "De acuerdo con el artículo 67.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la jubilación voluntaria procede, a solicitud del interesado, siempre que el funcionario:"
  options:
  - id: a
    text:
      es: "Cuente con informe favorable de la unidad de personal de su departamento."
  - id: b
    text:
      es: "Haya cumplido sesenta y cinco años, sea cual sea su régimen de Seguridad Social."
  - id: c
    text:
      es: "Justifique ante su departamento que su jubilación no perjudica las necesidades del servicio."
  - id: d
    correct: true
    text:
      es: "Reúna los requisitos y condiciones del Régimen de Seguridad Social que le sea aplicable."
  explanation:
    es: "El artículo 67.2 dice que procede la jubilación voluntaria «siempre que el funcionario reúna los requisitos y condiciones establecidos en el Régimen de Seguridad Social que le sea aplicable». El informe de la unidad de personal y las necesidades del servicio no figuran en el artículo. La edad de sesenta y cinco años para cualquier régimen sustituye la remisión al régimen de cada funcionario por una edad única."
  citation: "art. 67.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q042
  prompt:
    es: "Según el artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿a qué edad se declara de oficio la jubilación forzosa del funcionario, como regla de ese apartado?"
  options:
  - id: a
    text:
      es: "Al cumplir los sesenta años de edad."
  - id: b
    text:
      es: "Al cumplir los sesenta y tres años de edad."
  - id: c
    text:
      es: "Al cumplir los setenta años de edad."
  - id: d
    correct: true
    text:
      es: "Al cumplir los sesenta y cinco años de edad."
  explanation:
    es: "El artículo 67.3 dice que «La jubilación forzosa se declarará de oficio al cumplir el funcionario los sesenta y cinco años de edad». Sesenta y sesenta y tres años no aparecen en el artículo. Setenta años es el límite máximo de la prolongación en el servicio activo, no la edad de la declaración de oficio."
  citation: "art. 67.3 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q043
  prompt:
    es: "Un funcionario sin normas estatales específicas de jubilación puede solicitar la prolongación de su permanencia en el servicio activo como máximo hasta que:"
  options:
  - id: a
    correct: true
    text:
      es: "Cumpla setenta años de edad."
  - id: b
    text:
      es: "Cumpla sesenta y ocho años de edad."
  - id: c
    text:
      es: "Cumpla setenta y dos años de edad."
  - id: d
    text:
      es: "Complete cuarenta años de servicios efectivos."
  explanation:
    es: "El artículo 67.3 permite solicitar la prolongación de la permanencia en el servicio activo «como máximo hasta que se cumpla setenta años de edad», sobre la jubilación forzosa a los sesenta y cinco. Sesenta y ocho y setenta y dos años no son esa cifra: el apartado dice setenta. Los cuarenta años de servicios miden otra cosa: el límite del apartado es una edad."
  citation: "art. 67.3 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q044
  prompt:
    es: "Según el artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ante una solicitud de prolongación de la permanencia en el servicio activo, la Administración Pública competente:"
  options:
  - id: a
    text:
      es: "Debe aceptarla siempre que el funcionario no haya cumplido setenta años."
  - id: b
    correct: true
    text:
      es: "Debe resolver de forma motivada la aceptación o la denegación."
  - id: c
    text:
      es: "Solo debe motivar la denegación; la aceptación no requiere motivación."
  - id: d
    text:
      es: "Se entiende que la acepta si no resuelve en el plazo de un mes."
  explanation:
    es: "El artículo 67.3 dice que la Administración «deberá de resolver de forma motivada la aceptación o denegación de la prolongación». Aceptarla siempre que el funcionario no haya cumplido setenta años elimina la posibilidad de denegar, que el apartado contempla. Motivar solo la denegación contradice «de forma motivada la aceptación o denegación»: la motivación alcanza a las dos. La aceptación por falta de respuesta en un mes sustituye una resolución expresa por un silencio, y el apartado obliga a «resolver»."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q045
  prompt:
    es: "De acuerdo con el artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la prolongación de la permanencia en el servicio activo se solicita en los términos de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: b
    text:
      es: "Las normas de la Seguridad Social sobre la pensión de jubilación."
  - id: c
    text:
      es: "Las órdenes ministeriales que apruebe cada departamento."
  - id: d
    text:
      es: "Los acuerdos de la Mesa General de Negociación de cada Administración."
  explanation:
    es: "El artículo 67.3 dice que la prolongación se solicita «en los términos de las leyes de Función Pública que se dicten en desarrollo de este Estatuto». Las normas de la Seguridad Social son a las que remite el apartado 4 para la edad del funcionario del Régimen General. Las órdenes de cada departamento y los acuerdos de negociación no figuran en el artículo."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q046
  prompt:
    es: "Según el artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, quedan excluidos de la jubilación forzosa a los sesenta y cinco años y de la prolongación:"
  options:
  - id: a
    text:
      es: "Los funcionarios que tengan normas autonómicas específicas de jubilación."
  - id: b
    text:
      es: "Los funcionarios que ocupen puestos de trabajo de libre designación."
  - id: c
    correct: true
    text:
      es: "Los funcionarios que tengan normas estatales específicas de jubilación."
  - id: d
    text:
      es: "Los funcionarios que se encuentren en situación de servicios especiales."
  explanation:
    es: "El último párrafo del artículo 67.3 excluye de los dos párrafos anteriores a «los funcionarios que tengan normas estatales específicas de jubilación». La opción de las normas autonómicas cambia «estatales» por «autonómicas». La libre designación y los servicios especiales no figuran en el artículo."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-67
- id: m04-l04-q047
  prompt:
    es: "De acuerdo con el artículo 67.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la edad de jubilación forzosa del funcionario incluido en el Régimen General de la Seguridad Social es:"
  options:
  - id: a
    correct: true
    text:
      es: "La que fije ese régimen para la pensión contributiva sin coeficiente reductor por edad."
  - id: b
    text:
      es: "La de sesenta y cinco años del apartado 3, cualquiera que sea su régimen."
  - id: c
    text:
      es: "La que fije ese régimen para la jubilación anticipada por voluntad del interesado."
  - id: d
    text:
      es: "La que fije ese régimen para la pensión contributiva con el coeficiente reductor que corresponda."
  explanation:
    es: "El artículo 67.4 dice que, «con independencia de la edad legal de jubilación forzosa establecida en el apartado 3», la edad del funcionario del Régimen General es la que prevean sus normas para la pensión contributiva «sin coeficiente reductor por razón de la edad». Por eso no rigen para él los sesenta y cinco años del apartado 3. La jubilación anticipada y la pensión con coeficiente reductor son justo lo que el artículo descarta."
  citation: "art. 67.4 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-205
- id: m04-l04-q048
  prompt:
    es: "Según el artículo 205.1.a) del texto refundido de la Ley General de la Seguridad Social, aplicable desde 2027, la pensión de jubilación del Régimen General exige haber cumplido:"
  options:
  - id: a
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y cinco años cotizados."
  - id: b
    text:
      es: "Sesenta y cinco años, o sesenta y tres con treinta y ocho años y seis meses cotizados."
  - id: c
    correct: true
    text:
      es: "Sesenta y siete años, o sesenta y cinco con treinta y ocho años y seis meses cotizados."
  - id: d
    text:
      es: "Sesenta y seis años, o sesenta y cuatro con treinta y siete años cotizados."
  explanation:
    es: "El artículo 205.1.a) LGSS exige «Haber cumplido sesenta y siete años de edad, o sesenta y cinco años cuando se acrediten treinta y ocho años y seis meses de cotización», y la disposición transitoria séptima aplica esas cifras desde 2027. Es la edad a la que remite el artículo 67.4 TREBEP para el funcionario del Régimen General. Las otras tres opciones cambian la edad o los años cotizados."
  citation: "art. 205.1.a) LGSS"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1984-17387-art-33
- id: m04-l04-q050
  prompt:
    es: "Según el artículo 33 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, si el funcionario prolonga voluntariamente su permanencia en servicio activo, la declaración de jubilación forzosa:"
  options:
  - id: a
    text:
      es: "Se produce a los sesenta y cinco años, aunque siga prestando servicios."
  - id: b
    correct: true
    text:
      es: "No se produce hasta que cese en el servicio activo, como máximo a los setenta años."
  - id: c
    text:
      es: "No se produce hasta que cese en el servicio activo, sin límite de edad."
  - id: d
    text:
      es: "No se produce hasta que cese en el servicio activo, como máximo a los setenta y dos años."
  explanation:
    es: "El artículo 33 Ley 30/1984 dice que la declaración de jubilación forzosa «no se producirá hasta el momento en que los funcionarios cesen en la situación de servicio activo», cuando voluntariamente prolonguen su permanencia «hasta, como máximo, los setenta años de edad». La declaración a los sesenta y cinco años ignora la prolongación. La opción sin límite de edad suprime el máximo. La de setenta y dos años lo altera."
  citation: "art. 33 Ley 30/1984"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1984-17387-art-33
- id: m04-l04-q051
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, quedan exceptuados de la prolongación voluntaria en servicio activo:"
  options:
  - id: a
    text:
      es: "Los funcionarios con más de cuarenta años de servicios efectivos."
  - id: b
    correct: true
    text:
      es: "Los funcionarios de cuerpos y escalas con normas específicas de jubilación."
  - id: c
    text:
      es: "Los funcionarios que desempeñen puestos de libre designación."
  - id: d
    text:
      es: "Los funcionarios que hayan sido sancionados por falta grave."
  explanation:
    es: "El artículo 33 Ley 30/1984 exceptúa «los funcionarios de aquellos cuerpos y escalas que tengan normas específicas de jubilación». Los años de servicios, la libre designación y las sanciones por falta grave no figuran en el artículo."
  citation: "art. 33 Ley 30/1984"
  difficulty: 2
  tags:
  - "excepción"
