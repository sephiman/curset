type: quiz
variants:
- id: m10-l03-q01
  prompt:
    en: On a Linux node, how does the kernel enforce the `cpu` limit of a container when the container approaches
      that limit?
  options:
  - id: a
    correct: true
    text:
      en: By CPU throttling
  - id: b
    text:
      en: By out of memory (OOM) kills
  - id: c
    text:
      en: By terminating the Pod through the container runtime
  - id: d
    text:
      en: By lowering the weighting of the container below its request
  explanation:
    en: The kernel enforces `cpu` limits by CPU throttling. OOM kills are wrong because they enforce `memory` limits.
      Terminating the Pod is wrong because container runtimes do not terminate Pods or containers for excessive
      CPU usage. Lowering the weighting is wrong because the weighting comes from the CPU request, not the limit.
  citation: k8s-resource-management#requests-and-limits; k8s-resource-management#how-pods-with-resource-limits-are-run
  extract:
    en: cpu limits are enforced by CPU throttling.
- id: m10-l03-q03
  prompt:
    en: When a Node runs out of resources and Kubernetes must evict some of its Pods under node pressure, which
      Pods does it evict first?
  options:
  - id: a
    text:
      en: '`Burstable` Pods'
  - id: b
    text:
      en: '`Guaranteed` Pods'
  - id: c
    correct: true
    text:
      en: '`BestEffort` Pods'
  - id: d
    text:
      en: Pods that stay below their resource requests
  explanation:
    en: '`BestEffort` Pods are evicted first. `Burstable` Pods and `Guaranteed` Pods are both excluded, because
      eviction goes `BestEffort` first, then `Burstable`, and `Guaranteed` last. Pods below their requests are wrong
      because under resource pressure only Pods exceeding resource requests are candidates for eviction.'
  citation: k8s-qos#quality-of-service-classes
  extract:
    en: When a Node runs out of resources, Kubernetes will first evict BestEffort Pods running on that Node, followed
      by Burstable and finally Guaranteed Pods.
- id: m10-l03-q04
  prompt:
    en: Which are the quality of service classes that Kubernetes assigns to every Pod based on the resource requests
      and limits of its Containers?
  options:
  - id: a
    text:
      en: '`Guaranteed`, `Standard` and `BestEffort`'
  - id: b
    correct: true
    text:
      en: '`Guaranteed`, `Burstable` and `BestEffort`'
  - id: c
    text:
      en: '`Critical`, `Burstable` and `BestEffort`'
  - id: d
    text:
      en: '`Guaranteed`, `Burstable`, `BestEffort` and `Preemptible`'
  explanation:
    en: The classes are `Guaranteed`, `Burstable` and `BestEffort`. The sets with `Standard`, with `Critical` and
      with `Preemptible` are all excluded, because those three are the only possible quality of service classes.
  citation: k8s-qos#quality-of-service-classes
  extract:
    en: The possible QoS classes are Guaranteed, Burstable, and BestEffort.
- id: m10-l03-q05
  prompt:
    en: A `HorizontalPodAutoscaler` sees a current metric value of 200m against a desired value of 100m. What happens
      to the number of replicas?
  options:
  - id: a
    correct: true
    text:
      en: It is doubled
  - id: b
    text:
      en: It is halved
  - id: c
    text:
      en: It stays unchanged
  - id: d
    text:
      en: It is increased by one
  explanation:
    en: The number of replicas is doubled. The options that it is halved, that it stays unchanged and that it is
      increased by one are all excluded, because a ratio of 200 to 100 doubles the number of replicas.
  citation: k8s-hpa#algorithm-details
  extract:
    en: if the current metric value is 200m, and the desired value is 100m, the number of replicas will be doubled
- id: m10-l03-q06
  prompt:
    en: By default, within which tolerance of 1.0 does the `HorizontalPodAutoscaler` control plane skip a scaling
      action because the ratio is sufficiently close?
  options:
  - id: a
    text:
      en: '0.01'
  - id: b
    text:
      en: '0.25'
  - id: c
    correct: true
    text:
      en: '0.1'
  - id: d
    text:
      en: '0.5'
  explanation:
    en: The default tolerance is 0.1. The tolerances 0.01, 0.25 and 0.5 are all excluded, because the control plane
      documents 0.1 as the default.
  citation: k8s-hpa#algorithm-details
  extract:
    en: The control plane skips any scaling action if the ratio is sufficiently close to 1.0 (within a configurable
      tolerance, 0.1 by default).
- id: m10-l03-q07
  prompt:
    en: What is the default of the `--horizontal-pod-autoscaler-downscale-stabilization` command line option, which
      sets the window of scale recommendations the `HorizontalPodAutoscaler` considers?
  options:
  - id: a
    text:
      en: 30 seconds
  - id: b
    correct: true
    text:
      en: 5 minutes
  - id: c
    text:
      en: 15 minutes
  - id: d
    text:
      en: 1 hour
  explanation:
    en: The default is 5 minutes. The defaults 30 seconds, 15 minutes and 1 hour are all excluded, because the option
      defaults to 5 minutes.
  citation: k8s-hpa#algorithm-details
  extract:
    en: You can configure this value using the --horizontal-pod-autoscaler-downscale-stabilization command line
      option, which defaults to 5 minutes.
- id: m10-l03-q08
  prompt:
    en: A `HorizontalPodAutoscaler` specifies several metrics. How does it choose its desired replica count once
      it has calculated one for each metric?
  options:
  - id: a
    text:
      en: It chooses the smallest of the desired replica counts
  - id: b
    text:
      en: It chooses the average of the desired replica counts
  - id: c
    text:
      en: It chooses the count of the first metric listed
  - id: d
    correct: true
    text:
      en: It chooses the largest of the desired replica counts
  explanation:
    en: The largest of the desired replica counts is chosen. The smallest, the average and the count of the first
      metric are all excluded, because the calculation is done per metric and the largest result wins.
  citation: k8s-hpa#algorithm-details
  extract:
    en: If multiple metrics are specified in a HorizontalPodAutoscaler, this calculation is done for each metric,
      and then the largest of the desired replica counts is chosen.
- id: m10-l03-q10
  prompt:
    en: Right before the `HorizontalPodAutoscaler` scales its target, it considers all recommendations within a
      configurable window. Which recommendation from that window does it choose?
  options:
  - id: a
    text:
      en: The lowest recommendation
  - id: b
    text:
      en: The most recent recommendation
  - id: c
    correct: true
    text:
      en: The highest recommendation
  - id: d
    text:
      en: The average of the recommendations
  explanation:
    en: The highest recommendation is chosen. The lowest, the most recent and the average are all excluded, because
      the controller chooses the highest recommendation within the window.
  citation: k8s-hpa#algorithm-details
  extract:
    en: The controller considers all recommendations within a configurable window choosing the highest recommendation
      from within that window.
