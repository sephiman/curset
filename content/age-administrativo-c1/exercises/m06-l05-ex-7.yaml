# anchor: fuente-ms-excel-funcion-contara-html
- id: m06-l05-q231
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función CONTARA?"
  options:
  - id: a
    text:
      es: "Cuenta cuántos números hay en la lista de argumentos"
  - id: b
    text:
      es: "Cuenta las celdas del rango que cumplen el criterio especificado"
  - id: c
    correct: true
    text:
      es: "Cuenta el número de celdas que no están vacías en un rango"
  - id: d
    text:
      es: "Cuenta las celdas del rango que cumplen varios criterios"
  explanation:
    es: "CONTARA cuenta el número de celdas que no están vacías en un rango. Contar números es CONTAR, y contar según uno o varios criterios es CONTAR.SI y CONTAR.SI.CONJUNTO."
  citation: "fuente: `ms-excel-funcion-contara.html`; «Descripción»"
  difficulty: 1
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-contara-html
- id: m06-l05-q232
  prompt:
    es: "Señale la función de Excel 365 que se usa para contar solo las celdas de un rango que contienen números."
  options:
  - id: a
    correct: true
    text:
      es: "CONTAR"
  - id: b
    text:
      es: "CONTARA"
  - id: c
    text:
      es: "CONTAR.SI"
  - id: d
    text:
      es: "CONTAR.SI.CONJUNTO"
  explanation:
    es: "La página indica que, para contar solo las celdas que contienen números, se use CONTAR. CONTARA cuenta también texto, valores lógicos y errores, y las otras dos cuentan según criterios."
  citation: "fuente: `ms-excel-funcion-contara.html`; «Observaciones»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-contara-html
- id: m06-l05-q233
  prompt:
    es: "En Excel 365, A1:A6 contienen 10, el texto Norte, VERDADERO, #¡DIV/0!, una celda vacía y 7,5. ¿Qué devuelve =CONTARA(A1:A6)?"
  options:
  - id: a
    text:
      es: "6"
  - id: b
    correct: true
    text:
      es: "5"
  - id: c
    text:
      es: "4"
  - id: d
    text:
      es: "2"
  explanation:
    es: "CONTARA cuenta las celdas que contienen cualquier tipo de información, incluidos errores, y no cuenta las celdas vacías: 10, Norte, VERDADERO, #¡DIV/0! y 7,5 son 5. 6 contaría la celda vacía, 4 excluiría el error y 2 son solo los números."
  citation: "fuente: `ms-excel-funcion-contara.html`; «Observaciones»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-contara-html
- id: m06-l05-q234
  prompt:
    es: "En Excel 365, A1:A6 contienen 10, el texto Norte, VERDADERO, #¡DIV/0!, una celda vacía y 7,5. ¿Qué devuelve =CONTAR(A1:A6)?"
  options:
  - id: a
    correct: true
    text:
      es: "2"
  - id: b
    text:
      es: "5"
  - id: c
    text:
      es: "3"
  - id: d
    text:
      es: "4"
  explanation:
