  citation: "art. 95 bis.4 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "publicación"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0114
  prompt:
    es: "Conforme al artículo 95 bis.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los listados de deudores dejarán de ser accesibles una vez transcurrido el plazo de:"
  options:
  - id: a
    text:
      es: "un mes desde la fecha de publicación del listado."
  - id: b
    correct: true
    text:
      es: "tres meses desde la fecha de publicación del listado."
  - id: c
    text:
      es: "seis meses desde la fecha de publicación del listado."
  - id: d
    text:
      es: "un año desde la fecha de publicación del listado."
  explanation:
    es: "La publicación es electrónica y los listados dejan de ser accesibles pasados tres meses desde la fecha de publicación. Un mes, seis meses y un año no son el plazo del artículo."
  citation: "art. 95 bis.4 LGT"
  difficulty: 1
  tags:
  - "listados de deudores"
  - "publicación"
# anchor: boe-a-2003-23186-art-95-bis
- id: m03-l05-q0115
  prompt:
    es: "Según el artículo 95 bis.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el ámbito del Estado es competente para dictar los acuerdos de publicación del listado de deudores:"
  options:
  - id: a
    correct: true
    text:
      es: "el Director General de la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "el Ministro de Hacienda, a propuesta de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "el Director del Departamento de Recaudación de la Agencia Tributaria."
