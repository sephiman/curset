# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q030
  prompt:
    es: "De acuerdo con el artículo 78 de la Constitución Española de 1978, la Diputación Permanente de cada Cámara está compuesta por:"
  options:
  - id: a
    text:
      es: "Un mínimo de veintiún miembros, que representarán por igual a todos los grupos parlamentarios."
  - id: b
    text:
      es: "Un mínimo de quince miembros, que representarán a los grupos parlamentarios en proporción a su importancia numérica."
  - id: c
    correct: true
    text:
      es: "Un mínimo de veintiún miembros, que representarán a los grupos parlamentarios en proporción a su importancia numérica."
  - id: d
    text:
      es: "Un máximo de veintiún miembros, que representarán a los grupos parlamentarios en proporción a su importancia numérica."
  explanation:
    es: "El artículo 78.1 dice que la Diputación Permanente se compone de «un mínimo de veintiún miembros, que representarán a los grupos parlamentarios, en proporción a su importancia numérica». Veintiuno es un mínimo, no un máximo, y la cifra no es quince. La representación es proporcional, no igual para todos los grupos."
  citation: "art. 78.1 CE"
  difficulty: 1
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q031
  prompt:
    es: "¿Qué ocurre con las Diputaciones Permanentes cuando expira el mandato de las Cortes Generales o estas son disueltas, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Cesan en sus funciones el mismo día de la expiración del mandato o de la disolución."
  - id: b
    text:
      es: "Siguen ejerciendo sus funciones hasta la proclamación de los Diputados y Senadores electos."
  - id: c
    correct: true
    text:
      es: "Siguen ejerciendo sus funciones hasta la constitución de las nuevas Cortes Generales."
  - id: d
    text:
      es: "Se integran en una Diputación Permanente única de las Cortes Generales."
  explanation:
    es: "El artículo 78.3 dice que, expirado el mandato o en caso de disolución, las Diputaciones Permanentes «seguirán ejerciendo sus funciones hasta la constitución de las nuevas Cortes Generales». No cesan con la expiración o la disolución. Su función no termina con la proclamación de los electos. Hay una Diputación Permanente en cada Cámara (art. 78.1), no una única."
  citation: "art. 78.3 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q032
  prompt:
    es: "¿Quién preside la Diputación Permanente de cada una de las Cámaras de las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente de la Cámara respectiva."
  - id: b
    text:
      es: "El miembro de la Diputación Permanente de mayor edad."
  - id: c
    text:
      es: "El portavoz del grupo parlamentario con más miembros."
  - id: d
    text:
      es: "El Vicepresidente primero de la Cámara respectiva."
  explanation:
    es: "El artículo 78.2 dice que las Diputaciones Permanentes «estarán presididas por el Presidente de la Cámara respectiva». La Constitución no da la presidencia al miembro de más edad, a un portavoz ni a un Vicepresidente."
  citation: "art. 78.2 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1982-5196-art-57
- id: m01-l03-q033
  prompt:
    es: "Según el artículo 57 del Reglamento del Congreso de 10 de febrero de 1982, en los casos de disolución o expiración del mandato del Congreso, ¿qué facultades asume la Diputación Permanente?"
  options:
  - id: a
    text:
      es: "Las relativas a los Decretos-leyes y a la moción de censura."
  - id: b
    correct: true
    text:
      es: "Las relativas a los Decretos-leyes y a los estados de alarma, excepción y sitio."
  - id: c
    text:
      es: "Las relativas a los estados de alarma, excepción y sitio y a la investidura."
  - id: d
    text:
      es: "Las relativas a los Decretos-leyes y a las leyes orgánicas declaradas urgentes."
  explanation:
    es: "El artículo 57 del Reglamento le atribuye las facultades que el artículo 86 de la Constitución da al Congreso sobre los Decretos-leyes y las competencias del artículo 116 «respecto de los estados de alarma, excepción y sitio». La moción de censura, la investidura y las leyes orgánicas no están entre ellas."
  citation: "art. 57 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-79
- id: m01-l03-q034
  prompt:
    es: "De acuerdo con el artículo 79 de la Constitución Española de 1978, para adoptar acuerdos, las Cámaras deben estar reunidas reglamentariamente y con asistencia de:"
  options:
  - id: a
    text:
      es: "Un tercio de sus miembros."
  - id: b
    text:
      es: "Las tres quintas partes de sus miembros."
  - id: c
    correct: true
    text:
      es: "La mayoría de sus miembros."
  - id: d
    text:
      es: "La cuarta parte de sus miembros."
  explanation:
    es: "El artículo 79.1 exige que las Cámaras estén reunidas reglamentariamente «y con asistencia de la mayoría de sus miembros». Un tercio y la cuarta parte no alcanzan ese quórum. Las tres quintas partes no son lo que pide el precepto."
  citation: "art. 79.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-79
- id: m01-l03-q035
  prompt:
    es: "¿Qué mayoría exige la Constitución Española de 1978, como regla general, para que los acuerdos de las Cámaras sean válidos?"
  options:
  - id: a
    text:
      es: "La mayoría absoluta de los miembros de la Cámara."
  - id: b
    correct: true
    text:
      es: "La mayoría de los miembros presentes."
  - id: c
    text:
      es: "La mayoría de tres quintos de los miembros presentes."
  - id: d
    text:
      es: "La mayoría de dos tercios de los miembros presentes."
  explanation:
    es: "El artículo 79.2 dice que los acuerdos, «para ser válidos, deberán ser aprobados por la mayoría de los miembros presentes». La mayoría absoluta y las mayorías de tres quintos o dos tercios son mayorías especiales, que solo rigen cuando la Constitución, las leyes orgánicas o los Reglamentos las establecen."
  citation: "art. 79.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-79
- id: m01-l03-q036
  prompt:
    es: "¿Qué carácter tiene el voto de Senadores y Diputados según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El voto es personal, pero delegable en otro miembro del grupo."
  - id: b
    correct: true
    text:
      es: "El voto es personal e indelegable."
  - id: c
    text:
      es: "El voto es delegable solo en caso de enfermedad grave."
  - id: d
    text:
      es: "El voto es personal y secreto en todas las votaciones."
  explanation:
    es: "El artículo 79.3 dice: «El voto de Senadores y Diputados es personal e indelegable». Al ser indelegable, no cabe delegarlo en otro miembro del grupo ni por enfermedad. La Constitución no dice que sea secreto en todas las votaciones."
  citation: "art. 79.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-80
- id: m01-l03-q037
  prompt:
    es: "De acuerdo con el artículo 80 de la Constitución Española de 1978, las sesiones plenarias de las Cámaras serán públicas:"
  options:
  - id: a
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría de tres quintos."
  - id: b
    correct: true
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento."
  - id: c
    text:
      es: "En todo caso, sin excepción alguna."
  - id: d
    text:
      es: "Salvo acuerdo en contrario de la Mesa, adoptado con arreglo al Reglamento."
  explanation:
    es: "El artículo 80 dice que las sesiones plenarias serán públicas, «salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento». La mayoría no es de tres quintos. Sí hay excepción, y el acuerdo es de la Cámara, no de la Mesa."
  citation: "art. 80 CE"
  difficulty: 2
  tags:
  - "excepción"
  - "mayoría"
# anchor: boe-a-1994-10830-art-93
- id: m01-l03-q038
  prompt:
    es: "De acuerdo con el artículo 93 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, salvo las mayorías especiales, los acuerdos se adoptarán por:"
  options:
  - id: a
    text:
      es: "La mayoría absoluta de Senadores, siempre que esté presente la mitad más uno de los miembros del órgano."
  - id: b
    correct: true
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano."
  - id: c
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté un tercio de los miembros del órgano."
  - id: d
    text:
      es: "La mayoría simple de Senadores presentes, sin exigencia de quórum de asistencia."
  explanation:
    es: "El artículo 93.1 del Reglamento del Senado dice que los acuerdos se adoptan «por la mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano de que se trate». La regla general no es la mayoría absoluta. El quórum es la mitad más uno, no un tercio, y sí se exige."
  citation: "art. 93.1 Reglamento del Senado"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1982-5196-art-30
- id: m01-l03-q039
  prompt:
    es: "De acuerdo con el artículo 30 del Reglamento del Congreso de 10 de febrero de 1982, la Mesa del Congreso está compuesta por:"
  options:
  - id: a
    text:
      es: "La Presidencia, dos Vicepresidencias y cuatro Secretarías."
  - id: b
    text:
      es: "La Presidencia, cuatro Vicepresidencias y dos Secretarías."
  - id: c
    correct: true
    text:
      es: "La Presidencia, cuatro Vicepresidencias y cuatro Secretarías."
  - id: d
    text:
      es: "La Presidencia, dos Vicepresidencias y dos Secretarías."
  explanation:
    es: "El artículo 30.2 del Reglamento dice: «La Mesa estará compuesta por la Presidencia del Congreso, cuatro Vicepresidencias y cuatro Secretarías». Dos Vicepresidencias y cuatro Secretarios es la Mesa del Senado (art. 5.1 del Reglamento del Senado). Dos Vicepresidencias y dos Secretarías es la Mesa de las Comisiones del Congreso (art. 41.1)."
  citation: "art. 30.2 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1982-5196-art-37
- id: m01-l03-q040
  prompt:
    es: "Según el artículo 37 del Reglamento del Congreso de 10 de febrero de 1982, ¿qué ocurre si en la elección de la Presidencia nadie obtiene en primera votación la mayoría absoluta?"
  options:
  - id: a
    text:
      es: "Se repite la elección entre las tres personas más votadas y se exige de nuevo la mayoría absoluta."
  - id: b
    correct: true
    text:
      es: "Se repite la elección entre quienes hayan alcanzado las dos mayores votaciones y se elige a quien obtenga más votos."
  - id: c
    text:
      es: "Se repite la elección entre quienes hayan alcanzado las dos mayores votaciones y se exige la mayoría absoluta."
  - id: d
    text:
      es: "Resulta elegida la persona de mayor edad entre las dos más votadas en la primera votación."
  explanation:
    es: "El artículo 37.1 dice: «Si nadie obtuviera en primera votación dicha mayoría, se repetirá la elección entre quienes hayan alcanzado las dos mayores votaciones y se elegirá a quien obtenga más votos». La repetición es entre dos, no entre tres. En la segunda votación no se exige mayoría absoluta. La edad no decide la elección."
  citation: "art. 37.1 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: boe-a-1982-5196-art-39
- id: m01-l03-q041
  prompt:
    es: "¿Con qué criterio adopta sus decisiones la Junta de Portavoces según el Reglamento del Congreso de 10 de febrero de 1982?"
  options:
  - id: a
    correct: true
    text:
      es: "Siempre en función del criterio de voto ponderado."
  - id: b
    text:
      es: "Por mayoría simple de los portavoces presentes."
  - id: c
    text:
      es: "Por unanimidad de los portavoces de los grupos."
  - id: d
    text:
      es: "Por mayoría absoluta de los grupos parlamentarios constituidos."
  explanation:
    es: "El artículo 39.4 del Reglamento dice: «Las decisiones de la Junta de Portavoces se adoptarán siempre en función del criterio de voto ponderado». Cada portavoz pesa según su grupo. Por eso no se decide por mayoría de portavoces, por unanimidad ni por mayoría de grupos."
  citation: "art. 39.4 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1982-5196-art-23
- id: m01-l03-q042
  prompt:
    es: "De acuerdo con el artículo 23 del Reglamento del Congreso de 10 de febrero de 1982, en su redacción para la XVI legislatura, pueden constituirse en Grupo Parlamentario, sin otro requisito, las diputadas y diputados en número no inferior a:"
  options:
  - id: a
    correct: true
    text:
      es: "Quince diputadas y diputados de la Cámara."
  - id: b
    text:
      es: "Diez diputadas y diputados de la Cámara."
  - id: c
    text:
      es: "Doce diputadas y diputados de la Cámara."
  - id: d
    text:
      es: "Veinte diputadas y diputados de la Cámara."
  explanation:
    es: "El artículo 23.1 del Reglamento, en la redacción que entra en vigor en la XVI legislatura, dice: «Las diputadas y los diputados, en número no inferior a quince, podrán constituirse en Grupo Parlamentario». Diez es el mínimo de un Grupo en el Senado (art. 27.1 del Reglamento del Senado). Doce y veinte no aparecen en el precepto."
  citation: "art. 23.1 Reglamento del Congreso"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
  - "cambio-pendiente"
# anchor: boe-a-1982-5196-art-23
- id: m01-l03-q043
  prompt:
    es: "¿Cuál de los siguientes requisitos permite constituir Grupo Parlamentario sin reunir quince diputados, según el Reglamento del Congreso de 10 de febrero de 1982 en su redacción para la XVI legislatura?"
  options:
  - id: a
    text:
      es: "Tres escaños y una media del 10 por 100 de los votos válidos en las circunscripciones con representación."
  - id: b
    text:
      es: "Cuatro escaños y el 3 por 100 de los votos válidos emitidos en el conjunto de la Nación."
  - id: c
    text:
      es: "Cinco escaños y una media del 5 por 100 de los votos válidos en las circunscripciones con representación."
  - id: d
    correct: true
    text:
      es: "Cinco escaños y una media del 10 por 100 de los votos válidos en las circunscripciones con representación."
  explanation:
    es: "El artículo 23.1 del Reglamento, en la redacción para la XVI legislatura, exige «un número de escaños no inferior a cinco y, al menos, una media del 10 por 100 de los votos válidos emitidos en el conjunto de las circunscripciones en que hubieren obtenido representación o el 3 por 100 de los votos válidos emitidos en el conjunto de la Nación». Tres y cuatro escaños no llegan al mínimo de cinco. Una media del 5 por 100 no alcanza el 10 por 100."
  citation: "art. 23.1 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
  - "cambio-pendiente"
# anchor: boe-a-1982-5196-art-24
- id: m01-l03-q044
  prompt:
    es: "De acuerdo con el artículo 24 del Reglamento del Congreso de 10 de febrero de 1982, la constitución de Grupos Parlamentarios se hará, mediante escrito dirigido a la Mesa de la Cámara:"
  options:
  - id: a
    text:
      es: "Dentro de los diez días siguientes a la sesión constitutiva del Congreso."
  - id: b
    correct: true
    text:
      es: "Dentro de los cinco días siguientes a la sesión constitutiva del Congreso."
  - id: c
    text:
      es: "Dentro de los cinco días hábiles siguientes a la celebración de las elecciones."
  - id: d
    text:
      es: "Dentro de los quince días siguientes a la sesión constitutiva del Congreso."
  explanation:
    es: "El artículo 24.1 del Reglamento dice que la constitución de Grupos se hará «dentro de los cinco días siguientes a la sesión constitutiva del Congreso, mediante escrito dirigido a la Mesa de la Cámara». Diez días es el plazo para constituir las Comisiones Permanentes. El plazo se cuenta desde la sesión constitutiva, no desde las elecciones. Quince días no aparece."
  citation: "art. 24.1 Reglamento del Congreso"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1982-5196-art-41
- id: m01-l03-q045
  prompt:
    es: "De acuerdo con el artículo 41 del Reglamento del Congreso de 10 de febrero de 1982, las Comisiones, con las excepciones previstas en el Reglamento, eligen de entre sus miembros una Mesa compuesta por:"
  options:
  - id: a
    text:
      es: "Una Presidencia, cuatro Vicepresidencias y cuatro Secretarías."
  - id: b
    text:
      es: "Una Presidencia, una Vicepresidencia y una Secretaría."
  - id: c
    text:
      es: "Una Presidencia, dos Vicepresidencias y cuatro Secretarías."
  - id: d
    correct: true
    text:
      es: "Una Presidencia, dos Vicepresidencias y dos Secretarías."
  explanation:
    es: "El artículo 41.1 del Reglamento dice que las Comisiones eligen «una Mesa, compuesta por una Presidencia, dos Vicepresidencias y dos Secretarías». Cuatro Vicepresidencias y cuatro Secretarías son las de la Mesa del Congreso (art. 30.2). Dos Vicepresidentes y cuatro Secretarios forman la Mesa del Senado. Una sola Vicepresidencia y una sola Secretaría no aparecen."
  citation: "art. 41.1 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "composición"
# anchor: boe-a-1982-5196-art-46
- id: m01-l03-q046
  prompt:
    es: "Según el artículo 46 del Reglamento del Congreso de 10 de febrero de 1982, además de las Comisiones Permanentes Legislativas, ¿cuáles son también Comisiones Permanentes?"
  options:
  - id: a
    text:
      es: "Las de investigación y las de Reglamento, Estatuto y Peticiones."
  - id: b
    text:
      es: "Las que deban constituirse por disposición legal y las de investigación."
  - id: c
    correct: true
    text:
      es: "Las que deban constituirse por disposición legal y las de Reglamento, Estatuto y Peticiones."
  - id: d
    text:
      es: "Las de Reglamento, Estatuto y Peticiones, y las Ponencias de cada Comisión."
  explanation:
    es: "El artículo 46.2 del Reglamento dice: «Son también Comisiones Permanentes aquellas que deban constituirse por disposición legal y las siguientes: 1ª. Reglamento. 2ª. Estatuto. 3ª. Peticiones». Las Comisiones de investigación no están en esa lista. Las Ponencias no son Comisiones Permanentes."
  citation: "art. 46.2 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "estructura"
