# anchor: boe-a-2015-11719-art-55
- id: m04-l02-q001
  prompt:
    es: "De acuerdo con el artículo 55.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las Administraciones Públicas seleccionarán, mediante procedimientos que garanticen los principios constitucionales y los que el artículo enumera:"
  options:
  - id: a
    text:
      es: "A su personal funcionario, eventual y laboral"
  - id: b
    correct: true
    text:
      es: "A su personal funcionario y a su personal laboral"
  - id: c
    text:
      es: "Solo a su personal funcionario de carrera"
  - id: d
    text:
      es: "Solo a su personal laboral fijo, no al funcionario"
  explanation:
    es: "El artículo 55.2 dice que las Administraciones «seleccionarán a su personal funcionario y laboral» mediante esos procedimientos. La opción que lo limita al funcionario de carrera deja fuera al laboral. La que lo limita al laboral fijo deja fuera al funcionario. La opción que añade al personal eventual nombra a un personal que el artículo 55.2 no incluye."
  citation: "art. 55.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-1
- id: m04-l02-q002
  prompt:
    es: "Según el artículo 1.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, de 10 de marzo, el Reglamento se aplica a los procedimientos de ingreso del personal:"
  options:
  - id: a
    correct: true
    text:
      es: "De la Administración General del Estado y sus Organismos autónomos"
  - id: b
    text:
      es: "De la Administración General del Estado, excluidos sus Organismos autónomos"
  - id: c
    text:
      es: "De todas las Administraciones Públicas, con carácter básico"
  - id: d
    text:
      es: "De las comunidades autónomas y de las entidades locales"
  explanation:
    es: "El artículo 1.1 aplica el Reglamento «a los procedimientos de ingreso del personal de la Administración General del Estado y sus Organismos autónomos». No tiene carácter básico para todas las Administraciones ni se dirige a las comunidades autónomas y entidades locales. La opción que excluye a los Organismos autónomos contradice el texto, que los incluye expresamente."
  citation: "art. 1.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-105
- id: m04-l02-q003
  prompt:
    es: "Según el artículo 105.5 del Real Decreto-ley 6/2023, de 19 de diciembre, ¿qué se entiende por Administración del Estado a efectos de lo dispuesto en ese texto?"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración General del Estado y sus organismos y entidades vinculados o dependientes"
  - id: b
    text:
      es: "Todas las Administraciones Públicas incluidas en el ámbito del Estatuto Básico"
  - id: c
    text:
      es: "Solo la Administración General del Estado, sin sus organismos públicos"
  - id: d
    text:
      es: "La Administración General del Estado y las Administraciones de las comunidades autónomas"
  explanation:
    es: "El artículo 105.5 entiende por Administración del Estado «la Administración General del Estado, sus organismos y entidades vinculados o dependientes» y las demás entidades de ámbito estatal de su ámbito de aplicación. La opción que deja fuera a los organismos contradice ese texto. Las comunidades autónomas y el conjunto de Administraciones del Estatuto Básico no son Administración del Estado."
  citation: "art. 105.5 RDL 6/2023"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l02-q004
  prompt:
    es: "Según el apartado 2 de la disposición final cuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo:"
  options:
  - id: a
    text:
      es: "Quedan derogadas todas las normas anteriores sobre ordenación, planificación y gestión de recursos humanos"
  - id: b
    text:
      es: "Siguen en vigor las normas vigentes sobre ordenación, planificación y gestión de recursos humanos, aunque se opongan al Estatuto"
  - id: c
    text:
      es: "Cada Administración aplica las normas estatales sobre gestión de recursos humanos, aunque tenga normas propias"
  - id: d
    correct: true
    text:
      es: "Siguen en vigor las normas vigentes sobre ordenación, planificación y gestión de recursos humanos que no se opongan al Estatuto"
  explanation:
    es: "La disposición final cuarta.2 mantiene en vigor «en cada Administración Pública las normas vigentes sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan a lo establecido en este Estatuto». No las deroga todas. Tampoco las mantiene cuando se oponen al Estatuto. Y habla de las normas vigentes en cada Administración, no de imponer las estatales."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-70
- id: m04-l02-q005
  prompt:
    es: "En las Administraciones Públicas, son objeto de la Oferta de empleo público las necesidades de recursos humanos:"
  options:
  - id: a
    text:
      es: "Con asignación presupuestaria, que deban proveerse mediante concurso de traslados"
  - id: b
    correct: true
    text:
      es: "Con asignación presupuestaria, que deban proveerse mediante personal de nuevo ingreso"
  - id: c
    text:
      es: "Que deban cubrirse con personal de nuevo ingreso, aunque carezcan de asignación presupuestaria"
  - id: d
    text:
      es: "Con o sin asignación presupuestaria, que deban cubrirse con personal temporal"
  explanation:
    es: "El artículo 70.1 del Estatuto Básico lleva a la Oferta «las necesidades de recursos humanos, con asignación presupuestaria, que deban proveerse mediante la incorporación de personal de nuevo ingreso». Las opciones que prescinden de la asignación presupuestaria contradicen el texto. El concurso de traslados provee puestos con personal que ya es funcionario, no con personal de nuevo ingreso. El personal temporal tampoco es el que nombra el artículo."
  citation: "art. 70.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-70
- id: m04-l02-q006
  prompt:
    es: "Según el artículo 70.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué obligación comporta la Oferta de empleo público?"
  options:
  - id: a
    correct: true
    text:
      es: "Convocar los procesos selectivos para las plazas comprometidas y hasta un diez por cien adicional"
  - id: b
    text:
      es: "Convocar los procesos selectivos solo para las plazas comprometidas, sin ningún margen adicional"
  - id: c
    text:
      es: "Convocar los procesos selectivos para las plazas comprometidas y hasta un veinte por cien adicional"
  - id: d
    text:
      es: "Nombrar funcionarios en todas las plazas comprometidas dentro del mismo año natural"
  explanation:
    es: "La Oferta comporta «la obligación de convocar los correspondientes procesos selectivos para las plazas comprometidas y hasta un diez por cien adicional» (artículo 70.1). La opción sin margen adicional y la del veinte por cien alteran esa cifra. La obligación es convocar, no nombrar funcionarios en el mismo año: el artículo da a la ejecución de la oferta un plazo de tres años."
  citation: "art. 70.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-2015-11719-art-70
- id: m04-l02-q007
  prompt:
    es: "Conforme al artículo 70.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la ejecución de la oferta de empleo público debe desarrollarse dentro de un plazo de tres años que:"
  options:
  - id: a
    correct: true
    text:
      es: "No admite prórroga en ningún caso"
  - id: b
    text:
      es: "Puede ampliarlo el órgano de Gobierno que aprobó la oferta"
  - id: c
    text:
      es: "Puede prorrogarse un año más por causa justificada"
  - id: d
    text:
      es: "Se suspende mientras haya recursos contra las convocatorias"
  explanation:
    es: "El artículo 70.1 dice que «en todo caso, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años». Un plazo improrrogable no se prorroga por causa justificada ni lo amplía el órgano que aprobó la oferta. El artículo tampoco prevé que se suspenda por los recursos contra las convocatorias."
  citation: "art. 70.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-70
- id: m04-l02-q008
  prompt:
    es: "Según el Estatuto Básico del Empleado Público, la Oferta de empleo público o instrumento similar de cada Administración Pública:"
  options:
  - id: a
    text:
      es: "Se aprueba anualmente por los órganos de Gobierno y no requiere publicación en un diario oficial"
  - id: b
    text:
      es: "Se aprueba anualmente por los parlamentos autonómicos y las Cortes y se publica en el Diario oficial"
  - id: c
    correct: true
    text:
      es: "Se aprueba anualmente por los órganos de Gobierno y se publica en el Diario oficial correspondiente"
  - id: d
    text:
      es: "Se aprueba cada tres años por los órganos de Gobierno y se publica en el Diario oficial correspondiente"
  explanation:
    es: "El artículo 70.2 dice que la Oferta «se aprobará anualmente por los órganos de Gobierno de las Administraciones Públicas» y «deberá ser publicada en el Diario oficial correspondiente». Los tres años son el plazo de ejecución del artículo 70.1, no la periodicidad de la aprobación. La aprueban los órganos de Gobierno, no los parlamentos. Y la publicación es obligatoria."
  citation: "art. 70.2 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q009
  prompt:
    es: "Según el artículo 108.3 del Real Decreto-ley 6/2023, de 19 de diciembre, la oferta de empleo público incluirá para promoción interna un porcentaje no inferior al treinta por ciento:"
  options:
  - id: a
    text:
      es: "De las vacantes de cada cuerpo o escala que se convoque"
  - id: b
    correct: true
    text:
      es: "De las plazas de acceso libre"
  - id: c
    text:
      es: "Del total de plazas de la oferta, incluidas las de promoción"
  - id: d
    text:
      es: "De las plazas reservadas a personas con discapacidad"
  explanation:
    es: "El artículo 108.3 fija el porcentaje sobre «las plazas de acceso libre». No se calcula sobre el total de la oferta ni sobre las vacantes de cada cuerpo o escala. Las plazas reservadas a personas con discapacidad son otra reserva, la del artículo 108.4."
  citation: "art. 108.3 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q010
  prompt:
    es: "La oferta de empleo público de la Administración del Estado incluye un porcentaje no inferior al treinta por ciento de las plazas de acceso libre:"
  options:
  - id: a
    text:
      es: "Para la estabilización del personal interino"
  - id: b
    text:
      es: "Para la selección de personal laboral fijo"
  - id: c
    correct: true
    text:
      es: "Para el turno de promoción interna"
  - id: d
    text:
      es: "Para el turno de personas con discapacidad"
  explanation:
    es: "El artículo 108.3 del Real Decreto-ley 6/2023 destina ese porcentaje «para promoción interna». La reserva por discapacidad es otra, del diez por ciento de las plazas convocadas (artículo 108.4). Ninguna norma destina ese treinta por ciento a estabilizar interinos ni a seleccionar personal laboral fijo."
  citation: "art. 108.3 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-1984-17387-art-18
- id: m04-l02-q011
  prompt:
    es: "Según el artículo 18.6 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿quién aprueba la Oferta de Empleo Público, a propuesta del que el artículo llama “Ministerio para las Administraciones Públicas”?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno"
  - id: b
    text:
      es: "La Comisión Superior de Personal"
  - id: c
    text:
      es: "Las Cortes Generales"
  - id: d
    text:
      es: "La Dirección General de la Función Pública"
  explanation:
    es: "El artículo 18.6 dice que «la Oferta de Empleo Público será aprobada por el Gobierno a propuesta del Ministerio para las Administraciones Públicas» (hoy, el Ministerio para la Transformación Digital y de la Función Pública). Las Cortes Generales no la aprueban. La Comisión Superior de Personal y la Dirección General de la Función Pública son órganos de nivel inferior al Gobierno y el artículo no les da esa aprobación."
  citation: "art. 18.6 Ley 30/1984"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2023-23537-art-22
- id: m04-l02-q012
  prompt:
    es: "Con la estructura ministerial vigente, ¿a qué ministerio corresponde la propuesta y ejecución de la política del Gobierno en materia de función pública?"
  options:
  - id: a
    correct: true
    text:
      es: "Al Ministerio para la Transformación Digital y de la Función Pública"
  - id: b
    text:
      es: "Al Ministerio de Política Territorial y Memoria Democrática"
  - id: c
    text:
      es: "Al Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  - id: d
    text:
      es: "Al Ministerio de Hacienda"
  explanation:
    es: "El artículo 22.2 del Real Decreto 829/2023, de 20 de noviembre, atribuye al Ministerio para la Transformación Digital y de la Función Pública «la propuesta y ejecución de la política del Gobierno en materia de administración pública, función pública, y gobernanza pública». El Ministerio de Hacienda tiene la hacienda pública, los presupuestos y los gastos (artículo 5). El de la Presidencia, Justicia y Relaciones con las Cortes tiene los asuntos de relevancia constitucional y el programa legislativo (artículo 3). El de Política Territorial y Memoria Democrática tiene la política territorial y la memoria democrática (artículo 12)."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-8
- id: m04-l02-q013
  prompt:
    es: "¿En qué periodo del año se aprueba la oferta de empleo público de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "En el último trimestre del año anterior"
  - id: b
    correct: true
    text:
      es: "En el primer trimestre de cada año"
  - id: c
    text:
      es: "En el mes siguiente a la aprobación de los Presupuestos"
  - id: d
    text:
      es: "En el segundo trimestre de cada año"
  explanation:
    es: "El artículo 8.1 del Real Decreto 364/1995 dice que la oferta «será aprobada, en su caso, por el Gobierno […] en el primer trimestre de cada año». No se aprueba en el último trimestre del año anterior ni en el segundo trimestre. El artículo no la liga al mes siguiente a la aprobación de los Presupuestos."
  citation: "art. 8.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-9
- id: m04-l02-q015
  prompt:
    es: "Según el artículo 9 del Real Decreto 364/1995, de 10 de marzo, aprobada la oferta de empleo público, ¿quién convoca los procedimientos selectivos de acceso a un Cuerpo o Escala de funcionarios?"
  options:
  - id: a
    text:
      es: "La Comisión Permanente de Selección del Cuerpo o Escala"
  - id: b
    text:
      es: "La Dirección General de la Función Pública, para todos los Cuerpos"
  - id: c
    text:
      es: "El Gobierno, en el mismo real decreto que aprueba la oferta"
  - id: d
    correct: true
    text:
      es: "El Departamento al que figure adscrito el Cuerpo o Escala"
  explanation:
    es: "El artículo 9 dice que «los Departamentos a los que figuren adscritos los correspondientes Cuerpos y Escalas de funcionarios procederán a la convocatoria». La Dirección General de la Función Pública solo emite el informe favorable previo. El Gobierno aprueba la oferta, pero no convoca. La Comisión Permanente de Selección desarrolla y califica las pruebas (artículo 12.1), no las convoca."
  citation: "art. 9 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q016
  prompt:
    es: "¿Cuándo deben publicarse las convocatorias de las plazas incluidas en la oferta de empleo público de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Dentro del primer trimestre del año siguiente al de la publicación de la oferta"
  - id: b
    text:
      es: "En el año natural siguiente al de la publicación de la oferta en el «Boletín Oficial del Estado»"
  - id: c
    correct: true
    text:
      es: "En el mismo año natural de la publicación de la oferta en el «Boletín Oficial del Estado»"
  - id: d
    text:
      es: "En cualquier momento dentro del plazo de tres años de ejecución de la oferta"
  explanation:
    es: "El artículo 108.2 del Real Decreto-ley 6/2023 dice que «las convocatorias deberán publicarse en el mismo año natural de la publicación en el “Boletín Oficial del Estado” de la oferta de empleo público». Las opciones del año siguiente y del primer trimestre del año siguiente contradicen esa regla. Los tres años son el plazo de ejecución de la oferta (artículo 70.1 del Estatuto Básico), no el de publicación de las convocatorias."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q017
  prompt:
    es: "Según el artículo 108.2 del Real Decreto-ley 6/2023, de 19 de diciembre, las convocatorias de la oferta de empleo público de la Administración del Estado deberán ejecutarse:"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo máximo de dos años desde su publicación"
  - id: b
    text:
      es: "En el plazo máximo de dos años desde la publicación de la oferta"
  - id: c
    text:
      es: "En el plazo máximo de un año desde su publicación"
  - id: d
    text:
      es: "En el plazo máximo de seis meses desde su publicación"
  explanation:
    es: "El artículo 108.2 dice que «las convocatorias deberán ejecutarse en el plazo máximo de dos años desde su publicación». El año es el plazo de la fase de oposición, no el de toda la convocatoria. Los seis meses no están en el artículo. Los dos años se cuentan desde la publicación de cada convocatoria, no desde la de la oferta."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q018
  prompt:
    es: "¿En qué plazo debe ejecutarse la fase de oposición de cada convocatoria de la oferta de empleo público de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "En tres meses, prorrogables por otros tres"
  - id: b
    text:
      es: "En seis meses, salvo causa justificada"
  - id: c
    correct: true
    text:
      es: "En un año, salvo causa justificada"
  - id: d
    text:
      es: "En un año, sin excepción alguna"
  explanation:
    es: "El artículo 108.2 del Real Decreto-ley 6/2023 dice que las convocatorias se ejecutan en dos años «y las respectivas fases de oposición en un año, salvo causa justificada». La opción «sin excepción alguna» suprime la salvedad de la causa justificada. Los seis meses y los tres meses prorrogables no están en el artículo."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q019
  prompt:
    es: "De acuerdo con el artículo 108.2 del Real Decreto-ley 6/2023, de 19 de diciembre, las plazas no cubiertas en la ejecución de una convocatoria podrán convocarse nuevamente siempre que:"
  options:
  - id: a
    text:
      es: "No hayan transcurrido más de cuatro años desde la publicación de la oferta"
  - id: b
    text:
      es: "No hayan transcurrido más de cinco años desde la publicación de la convocatoria"
  - id: c
    text:
      es: "Lo autorice el órgano convocante, sin límite de tiempo desde la oferta"
  - id: d
    correct: true
    text:
      es: "No hayan transcurrido más de tres años desde la publicación de la oferta"
  explanation:
    es: "El artículo 108.2 permite convocar de nuevo las plazas no cubiertas «siempre que no hayan transcurrido más de tres años desde la publicación de la oferta». Los cuatro y cinco años alargan ese límite, y la opción de los cinco años además lo cuenta desde la convocatoria. La opción sin límite de tiempo contradice el artículo, que sí lo fija."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2023-25758-art-108
- id: m04-l02-q020
  prompt:
    es: "En la Administración del Estado, ¿qué informe se requiere para convocar nuevamente las plazas que quedaron sin cubrir en la ejecución de una convocatoria?"
  options:
  - id: a
    text:
      es: "Informe previo de la Comisión Permanente de Selección del cuerpo afectado"
  - id: b
    correct: true
    text:
      es: "Informe previo del departamento con competencias en materia de función pública"
  - id: c
    text:
      es: "Informe previo de la Abogacía del Estado en el departamento convocante"
  - id: d
    text:
      es: "Informe previo de la Intervención General de la Administración del Estado"
  explanation:
    es: "El artículo 108.2 del Real Decreto-ley 6/2023 exige convocarlas «previo informe del departamento con competencias en materia de función pública», que puede asignarlas a otros cuerpos o escalas. No pide informe de la Intervención General, de la Abogacía del Estado ni de una Comisión Permanente de Selección, que solo desarrolla y califica pruebas (artículo 12.1 del Real Decreto 364/1995)."
  citation: "art. 108.2 RDL 6/2023"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-11719-art-60
- id: m04-l02-q021
  prompt:
    es: "¿A qué principios relativos a sus miembros debe ajustarse la composición de los órganos de selección del personal de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Representación paritaria de la Administración y del personal"
  - id: b
    text:
      es: "Jerarquía y antigüedad de sus miembros en el servicio"
  - id: c
    text:
      es: "Representatividad sindical y profesionalidad de sus miembros"
  - id: d
    correct: true
    text:
      es: "Imparcialidad y profesionalidad de sus miembros"
  explanation:
    es: "El artículo 60.1 del Estatuto Básico dice que la composición de los órganos de selección «deberá ajustarse a los principios de imparcialidad y profesionalidad de sus miembros». La representatividad sindical y la representación paritaria chocan con el artículo 60.3: la pertenencia es a título individual, nunca en representación de nadie. La jerarquía y la antigüedad no figuran en el artículo."
  citation: "art. 60.1 TREBEP"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-2015-11719-art-60
- id: m04-l02-q022
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los órganos de selección recoge el artículo 60.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Son colegiados y sus miembros actúan en representación de la Administración convocante"
  - id: b
    correct: true
    text:
      es: "Son colegiados y en su composición se tiende a la paridad entre mujer y hombre"
  - id: c
    text:
      es: "Son unipersonales y en su composición se tiende a la paridad entre mujer y hombre"
  - id: d
    text:
      es: "Son colegiados y en su composición se exige una paridad estricta entre mujer y hombre"
  explanation:
    es: "El artículo 60.1 dice que los órganos de selección «serán colegiados» y que «se tenderá, asimismo, a la paridad entre mujer y hombre». No son unipersonales. La paridad es una tendencia, no una exigencia estricta. Sus miembros no actúan en representación de nadie: la pertenencia es siempre a título individual (artículo 60.3)."
  citation: "art. 60.1 TREBEP"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2015-11719-art-60
- id: m04-l02-q023
  prompt:
    es: "Según el artículo 60.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué personal queda excluido de los órganos de selección?"
  options:
  - id: a
    text:
      es: "El personal laboral fijo y los funcionarios de carrera de otras Administraciones"
  - id: b
    text:
      es: "El personal eventual, pero no los funcionarios interinos ni el de designación política"
  - id: c
    correct: true
    text:
      es: "El de elección o designación política, los funcionarios interinos y el personal eventual"
  - id: d
    text:
      es: "Los funcionarios interinos, pero no el personal eventual ni el de designación política"
  explanation:
    es: "El artículo 60.2 dice que «el personal de elección o de designación política, los funcionarios interinos y el personal eventual no podrán formar parte de los órganos de selección». Las dos opciones que excluyen solo al eventual o solo a los interinos dejan fuera a personal que el artículo también excluye. El artículo no excluye al personal laboral fijo ni a los funcionarios de carrera de otras Administraciones."
  citation: "art. 60.2 TREBEP"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2015-11719-art-60
- id: m04-l02-q024
  prompt:
    es: "La pertenencia a los órganos de selección de los procesos de acceso al empleo público es:"
  options:
  - id: a
    correct: true
    text:
      es: "Siempre a título individual, sin representación ni cuenta de nadie"
  - id: b
    text:
      es: "En representación de la organización sindical que la propone"
  - id: c
    text:
      es: "Por cuenta del órgano convocante que efectúa el nombramiento"
  - id: d
    text:
      es: "A título individual, salvo la de los vocales de designación sindical"
  explanation:
    es: "El artículo 60.3 del Estatuto Básico dice que la pertenencia «será siempre a título individual, no pudiendo ostentarse ésta en representación o por cuenta de nadie»; el artículo 115.3 del Real Decreto-ley 6/2023 repite la regla. No se pertenece en representación de un sindicato ni por cuenta del órgano convocante. La opción que salva a los vocales de designación sindical añade una excepción que el artículo no tiene."
  citation: "art. 60.3 TREBEP"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2023-25758-art-115
- id: m04-l02-q025
  prompt:
    es: "Según el artículo 115.2 del Real Decreto-ley 6/2023, de 19 de diciembre, además del personal que excluye el Estatuto Básico, ¿a quiénes excluye de los órganos de selección de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "A los funcionarios de carrera del mismo Cuerpo o Escala que se selecciona"
  - id: b
    text:
      es: "A los funcionarios jubilados y al personal laboral fijo de la Administración"
  - id: c
    text:
      es: "A quienes ocupen puestos de libre designación y al personal laboral fijo"
  - id: d
    correct: true
    text:
      es: "A quienes tengan la consideración de alto cargo y al personal laboral no fijo"
  explanation:
    es: "El artículo 115.2 excluye a «quienes tengan la consideración de alto cargo, de acuerdo con lo establecido en la Ley 3/2015, de 30 de marzo» y al «personal laboral no fijo», junto con el personal que ya excluye el artículo 60.2 del Estatuto. No excluye a los funcionarios del mismo Cuerpo o Escala: el artículo 13.1 del Real Decreto 364/1995 solo impide que formen la mayoría. Tampoco nombra a los jubilados, al personal laboral fijo ni a quienes ocupan puestos de libre designación."
  citation: "art. 115.2 RDL 6/2023"
  difficulty: 3
  tags:
  - "composición"
# anchor: boe-a-1995-8729-art-10
- id: m04-l02-q026
  prompt:
    es: "Según el artículo 10 del Real Decreto 364/1995, de 10 de marzo, las Comisiones Permanentes de Selección son:"
  options:
  - id: a
    correct: true
    text:
      es: "Una de las dos clases de órganos de selección, junto con los Tribunales"
  - id: b
    text:
      es: "Órganos que asesoran a los Tribunales, sin función de calificar las pruebas"
  - id: c
    text:
      es: "Los únicos órganos de selección para el ingreso en la Administración del Estado"
  - id: d
    text:
      es: "Órganos que revisan en alzada las calificaciones otorgadas por los Tribunales"
  explanation:
    es: "El artículo 10 dice: «Son órganos de selección los Tribunales y las Comisiones Permanentes de Selección». Las Comisiones no asesoran a los Tribunales: desarrollan y califican las pruebas de ciertos Cuerpos y Escalas (artículo 12.1). No revisan las calificaciones de los Tribunales. Y no son los únicos órganos de selección, porque el mismo artículo nombra a los Tribunales."
  citation: "art. 10 RD 364/1995"
  difficulty: 1
  tags:
  - "estructura"
  - "órgano"
