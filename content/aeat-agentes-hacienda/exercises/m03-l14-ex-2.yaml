- id: m03-l14-q0026
  prompt:
    es: "Según el artículo 217.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes resoluciones o acuerdos pone fin a la vía administrativa en el procedimiento de nulidad de pleno derecho?"
  options:
  - id: a
    text:
      es: "La propuesta de resolución elevada al Ministro de Hacienda."
  - id: b
    correct: true
    text:
      es: "El acuerdo de inadmisión a trámite de la solicitud del interesado."
  - id: c
    text:
      es: "El acuerdo de iniciación de oficio del procedimiento."
  - id: d
    text:
      es: "El dictamen favorable del Consejo de Estado."
  explanation:
    es: "El artículo 217.7 dice que la resolución expresa o presunta y el acuerdo de inadmisión a trámite ponen fin a la vía administrativa. El acuerdo de iniciación, el dictamen y la propuesta de resolución son trámites del procedimiento, no resoluciones que lo cierren."
  citation: "art. 217.7 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "vía administrativa"
