# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q324
  prompt:
    es: "En el nuevo Outlook para Windows, ¿para qué sirven las casillas de la parte inferior al crear una firma?"
  options:
  - id: a
    text:
      es: "Para elegir si se aplica solo a mensajes con importancia alta"
  - id: b
    text:
      es: "Para elegir el tamaño máximo de las imágenes de la firma"
  - id: c
    correct: true
    text:
      es: "Para elegir si se aplica a mensajes nuevos y a respuestas y reenvíos"
  - id: d
    text:
      es: "Para elegir si se guarda solo en el equipo o también en la cuenta"
  explanation:
    es: "Las casillas de la parte inferior eligen si la firma se aplica a los mensajes nuevos y a las respuestas y reenvíos; si se dejan en blanco, la firma se agrega al redactar. Elegir dónde se guarda, el tamaño de las imágenes o la importancia de los mensajes contradice esa descripción."
  citation: "fuente: `ms-outlook-firma.html`; «Crear y agregar una firma de correo electrónico en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "configuración"
