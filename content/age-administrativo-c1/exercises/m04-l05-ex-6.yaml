# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q159
  prompt:
    es: "Un funcionario reduce su jornada por el cáncer de su hijo, nacido el miércoles 10 de marzo de 2004, al que antes de cumplir 23 años se reconoce una discapacidad del 70 por ciento, sin gran discapacidad ni gran dependencia. ¿Hasta cuándo puede mantener la reducción?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta que el hijo cumpla 26 años, el domingo 10 de marzo de 2030."
  - id: b
    text:
      es: "Hasta que el hijo cumpla 30 años, el viernes 10 de marzo de 2034."
  - id: c
    text:
      es: "Hasta que el hijo cumpla 23 años, el miércoles 10 de marzo de 2027."
  - id: d
    text:
      es: "Hasta que el hijo cumpla 25 años, el sábado 10 de marzo de 2029."
  explanation:
    es: "La reducción dura como máximo hasta los 23 años, pero «se mantendrá el derecho a esta reducción de jornada hasta que la persona a su cargo cumpla 26 años si, antes de alcanzar los 23 años, acreditara, además, un grado de discapacidad igual o superior al 65 por ciento». Un 70 por ciento reconocido antes de los 23 lleva el límite a los 26 años, el domingo 10 de marzo de 2030. Los 23 años son el límite sin esa discapacidad. Ni 25 ni 30 años figuran en el artículo."
  citation: "art. 49.e) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q160
  prompt:
    es: "Según el artículo 49.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, en la redacción vigente desde el 23 de octubre de 2026, si el hijo tiene gran discapacidad o gran dependencia, la reducción de jornada:"
  options:
  - id: a
    text:
      es: "Se extingue en todo caso cuando el hijo cumple 26 años, aunque persista la necesidad de cuidado."
  - id: b
    text:
      es: "Puede prorrogarse más allá de los límites de edad, aunque no se mantenga la convivencia."
  - id: c
    text:
      es: "Puede prorrogarse hasta que el hijo cumpla 30 años si persiste la necesidad de cuidado, aunque no haya convivencia."
  - id: d
    correct: true
    text:
      es: "Puede prorrogarse más allá de los límites de edad mientras persistan la necesidad de cuidado y la convivencia."
  explanation:
    es: "El artículo 49.e), con la modificación de la Ley 4/2026, dice que en esos casos la reducción «podrá prorrogarse más allá de los límites de edad previstos, mientras persista la necesidad de cuidado debidamente acreditada y se mantenga la convivencia». No se extingue a los 26 años. No hay un nuevo límite de 30 años. La convivencia es requisito de la prórroga."
  citation: "art. 49.e) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q161
  prompt:
    es: "Conforme al artículo 49.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, desde el 23 de octubre de 2026, en los supuestos de gran discapacidad o gran dependencia, ambos progenitores pueden compartir la reducción de jornada:"
  options:
  - id: a
    text:
      es: "Hasta el 50 % entre ambos, de forma simultánea y proporcional a lo asumido por cada uno."
  - id: b
    text:
      es: "Hasta el 75 %, de forma simultánea y proporcional al tiempo asumido por cada uno."
  - id: c
    text:
      es: "Hasta el 100 %, de forma sucesiva y nunca simultánea entre ambos progenitores."
  - id: d
    correct: true
    text:
      es: "Hasta el 100 %, de forma simultánea y proporcional al tiempo asumido por cada uno."
  explanation:
    es: "El artículo 49.e) permite compartir «el porcentaje de reducción de jornada hasta el máximo de 100% entre los dos progenitores, de forma simultánea y proporcional al tiempo de reducción asumido por cada uno de ellos». No es un reparto sucesivo. El máximo es el 100 %, no el 50 % ni el 75 %."
  citation: "art. 49.e) TREBEP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q162
  prompt:
    es: "Ambos progenitores, funcionarios, cumplen los requisitos del permiso por cuidado de hijo con cáncer, y la madre ya cobra sus retribuciones íntegras por este permiso. ¿Qué corresponde al padre?"
  options:
  - id: a
    text:
      es: "Ningún derecho, porque el permiso solo puede disfrutarlo un progenitor."
  - id: b
    correct: true
    text:
      es: "Solo la reducción de jornada, con la consiguiente reducción de retribuciones."
  - id: c
    text:
      es: "La reducción de jornada con retribuciones íntegras, igual que la madre."
  - id: d
    text:
      es: "La reducción de jornada con la mitad de las retribuciones que deje de percibir."
  explanation:
    es: "El artículo 49.e) da retribuciones íntegras «siempre que la otra persona progenitora … no cobre sus retribuciones íntegras en virtud de este permiso». Si la madre ya las cobra, «sólo se tendrá derecho a la reducción de jornada, con la consiguiente reducción de retribuciones». El padre no cobra íntegras. Conserva la reducción, porque el artículo la deja a salvo. No hay una compensación de la mitad."
  citation: "art. 49.e) TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q163
  prompt:
    es: "Según el artículo 49.f) del texto refundido de la Ley del Estatuto Básico del Empleado Público, los funcionarios víctimas del terrorismo tienen derecho a reducción de jornada o reordenación del tiempo de trabajo, previo reconocimiento de:"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministerio del Interior o sentencia judicial firme."
  - id: b
    text:
      es: "El Ministerio del Interior, sin que baste una sentencia judicial."
  - id: c
    text:
      es: "El Ministerio de Justicia o sentencia judicial firme."
  - id: d
    text:
      es: "La Delegación del Gobierno en su comunidad autónoma."
  explanation:
    es: "El artículo 49.f) exige el «previo reconocimiento del Ministerio del Interior o de sentencia judicial firme». No es el Ministerio de Justicia ni la Delegación del Gobierno. La sentencia judicial firme sí basta: es la alternativa al reconocimiento del Ministerio."
  citation: "art. 49.f) TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q164
  prompt:
    es: "El permiso parental para el cuidado de un hijo, hija o menor acogido hasta el momento en que el menor cumpla ocho años:"
  options:
  - id: a
    text:
      es: "No es retribuido y dura como máximo dieciséis semanas, siempre continuas."
  - id: b
    text:
      es: "Es retribuido solo en sus dos primeras semanas y dura como máximo ocho."
  - id: c
    correct: true
    text:
      es: "No es retribuido y dura como máximo ocho semanas, continuas o discontinuas."
  - id: d
    text:
      es: "Es retribuido y dura como máximo ocho semanas, continuas o discontinuas."
  explanation:
    es: "El artículo 49.g) dice que el permiso parental «no tendrá carácter retribuido y tendrá una duración no superior a ocho semanas, continuas o discontinuas». No es retribuido, ni en todo ni en parte. No llega a dieciséis semanas y no tiene que ser continuo."
  citation: "art. 49.g) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q165
  prompt:
    es: "Una funcionaria quiere disfrutar en septiembre de 2027 el permiso parental no retribuido por su hijo, nacido el domingo 3 de marzo de 2019. ¿Puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque el permiso parental alcanza hasta que el hijo cumpla diez años."
  - id: b
    correct: true
    text:
      es: "No, porque el hijo cumplió ocho años en marzo de 2027."
  - id: c
    text:
      es: "Sí, porque el permiso parental alcanza hasta que el hijo cumpla doce años."
  - id: d
    text:
      es: "No, porque el permiso parental solo alcanza hasta que el hijo cumpla seis años."
  explanation:
    es: "El permiso parental del artículo 49.g) llega «hasta el momento en que el menor cumpla ocho años». El hijo nació el 3 de marzo de 2019 y cumplió ocho años el miércoles 3 de marzo de 2027, así que en septiembre ya no cabe. El límite no es de diez ni de doce años. Tampoco es de seis: el niño, con seis o siete años, aún estaba dentro."
  citation: "art. 49.g) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q166
  prompt:
    es: "Según el artículo 49.g) del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando las necesidades del servicio lo permitan, las fechas de disfrute del permiso parental:"
  options:
  - id: a
    text:
      es: "Las especifica el progenitor y las comunica con un mes de antelación."
  - id: b
    text:
      es: "Las especifica el progenitor y las comunica con siete días de antelación."
  - id: c
    text:
      es: "Las fija la Administración, oído el progenitor, con quince días de antelación."
  - id: d
    correct: true
    text:
      es: "Las especifica el progenitor y las comunica con quince días de antelación."
  explanation:
    es: "El artículo 49.g) dice que corresponde a la persona progenitora «especificar la fecha de inicio y fin del disfrute», comunicándolo «con una antelación de quince días». Las fechas no las fija la Administración. La antelación no es de un mes ni de siete días."
  citation: "art. 49.g) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q167
  prompt:
    es: "Una funcionaria cuya hija nació el jueves 14 de enero de 2027 quiere disfrutar en marzo de 2028 semanas del párrafo 2.º del artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público. ¿Puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque esas once semanas pueden ejercerse hasta que la hija cumpla dos años."
  - id: b
    text:
      es: "Sí, porque esas once semanas pueden ejercerse hasta que la hija cumpla ocho años."
  - id: c
    correct: true
    text:
      es: "No, porque esas once semanas solo pueden ejercerse hasta que la hija cumpla doce meses."
  - id: d
    text:
      es: "No, porque esas once semanas solo pueden ejercerse hasta que la hija cumpla seis meses."
  explanation:
    es: "Las once semanas del párrafo 2.º se ejercen «desde la finalización del descanso obligatorio posterior al parto hasta que el hijo o la hija cumpla doce meses». La hija cumplió doce meses el viernes 14 de enero de 2028, así que en marzo de 2028 ya no caben. Los ocho años son el límite de las dos semanas del párrafo 3.º. Dos años y seis meses no figuran en el artículo."
  citation: "art. 49.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q168
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, a efectos de las vacaciones de los funcionarios públicos, los sábados:"
  options:
  - id: a
    correct: true
    text:
      es: "No se consideran días hábiles, sin perjuicio de las adaptaciones para horarios especiales."
  - id: b
    text:
      es: "Se consideran días hábiles, sin perjuicio de las adaptaciones para horarios especiales."
  - id: c
    text:
      es: "Se consideran días hábiles cuando las vacaciones se disfrutan por semanas completas."
  - id: d
    text:
      es: "Se consideran días hábiles cuando las vacaciones se disfrutan fuera del verano."
  explanation:
    es: "El artículo 50.1 dice que «no se considerarán como días hábiles los sábados, sin perjuicio de las adaptaciones que se establezcan para los horarios especiales». La regla general excluye los sábados. El artículo no distingue entre verano y resto del año ni entre semanas completas y días sueltos."
  citation: "art. 50.1 TREBEP"
  difficulty: 1
  tags:
  - "cómputo"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q169
  prompt:
    es: "Un funcionario con jornada de lunes a viernes inicia el lunes 3 de agosto de 2026 sus veintidós días hábiles de vacaciones. Sin más festivo en el periodo que el sábado 15 de agosto, ¿cuál es su último día de vacaciones?"
  options:
  - id: a
    text:
      es: "El jueves 3 de septiembre de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 1 de septiembre de 2026."
  - id: c
    text:
      es: "El viernes 28 de agosto de 2026."
  - id: d
    text:
      es: "El lunes 24 de agosto de 2026."
  explanation:
    es: "Las vacaciones son de «veintidós días hábiles» y los sábados no son hábiles (artículo 50.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público). El festivo cae en sábado y no altera la cuenta. Del 3 al 28 de agosto hay veinte días hábiles; el lunes 31 es el vigésimo primero y el martes 1 de septiembre el vigésimo segundo. El lunes 24 sale de contar días naturales. El viernes 28 solo llega a veinte días. El jueves 3 cuenta veinticuatro."
  citation: "art. 50.1 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q170
  prompt:
    es: "Un funcionario toma posesión el miércoles 1 de julio de 2026 y presta servicios los seis meses restantes del año. ¿Cuántos días de vacaciones le corresponden en 2026?"
  options:
  - id: a
    correct: true
    text:
      es: "Once días hábiles, la parte proporcional de veintidós."
  - id: b
    text:
      es: "Quince días hábiles, el mínimo del periodo anual."
  - id: c
    text:
      es: "Veintidós días hábiles, por año natural de servicio."
  - id: d
    text:
      es: "Once días naturales, la parte proporcional de veintidós."
  explanation:
    es: "El artículo 50.1 da veintidós días hábiles «o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor». Con medio año de servicio corresponden once días, y siguen siendo hábiles. Los veintidós días son el año completo. No hay un mínimo de quince días."
  citation: "art. 50.1 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2026-8287-apartado-9
- id: m04-l05-q171
  prompt:
    es: "Una funcionaria de la Administración General del Estado en Madrid, con veinte años de servicio y jornada de lunes a viernes, inicia el lunes 6 de julio de 2026 todas sus vacaciones anuales. Sin festivos en el periodo, ¿cuál es su último día de vacaciones?"
  options:
  - id: a
    text:
      es: "El martes 4 de agosto de 2026."
  - id: b
    text:
      es: "El miércoles 5 de agosto de 2026."
  - id: c
    text:
      es: "El lunes 10 de agosto de 2026."
  - id: d
    correct: true
    text:
      es: "El jueves 6 de agosto de 2026."
  explanation:
    es: "Con veinte años de servicio corresponden «veinticuatro días hábiles» (apartado 9.1 de la Resolución de 14 de abril de 2026), y los sábados no cuentan. Del 6 al 31 de julio hay veinte días hábiles; del lunes 3 al jueves 6 de agosto, cuatro más. El martes 4 corresponde a los veintidós días generales. El miércoles 5, a los veintitrés de los quince años. El lunes 10, a veintiséis, los de treinta años."
  citation: "apartado 9.1 Resolución de 14-04-2026"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-da-decimocuarta
- id: m04-l05-q172
  prompt:
    es: "¿Cuál de las siguientes medidas puede establecer cada Administración Pública, en función del tiempo de servicios prestados, según la disposición adicional decimocuarta del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Hasta un máximo de seis días adicionales de vacaciones."
  - id: b
    text:
      es: "Hasta un máximo de dos días adicionales de vacaciones."
  - id: c
    correct: true
    text:
      es: "Hasta un máximo de cuatro días adicionales de vacaciones."
  - id: d
    text:
      es: "Un día adicional de vacaciones por cada trienio cumplido."
  explanation:
    es: "La disposición permite «hasta un máximo de cuatro días adicionales de vacaciones en función del tiempo de servicios prestados». No son dos ni seis. Un día por trienio no es la regla: la referencia a los trienios está en la disposición decimotercera, la de asuntos particulares."
  citation: "disposición adicional decimocuarta TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2026-8287-apartado-9
- id: m04-l05-q173
  prompt:
    es: "De acuerdo con el apartado 9.1 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, ¿con cuántos años de servicio se alcanzan veintiséis días hábiles de vacaciones?"
  options:
  - id: a
    text:
      es: "Con veinticinco o más años de servicio."
  - id: b
    text:
      es: "Con treinta y cinco o más años de servicio."
  - id: c
    correct: true
    text:
      es: "Con treinta o más años de servicio."
  - id: d
    text:
      es: "Con veintiocho o más años de servicio."
  explanation:
    es: "El apartado 9.1 da «treinta o más años de servicio: veintiséis días hábiles». Con veinticinco años corresponden veinticinco días. Veintiocho y treinta y cinco años no son tramos del apartado."
  citation: "apartado 9.1 Resolución de 14-04-2026"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q175
  prompt:
    es: "¿Cuál de las siguientes situaciones permite, según el artículo 50.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, disfrutar las vacaciones después de terminado el año natural?"
  options:
  - id: a
    text:
      es: "Una comisión de servicios en otra localidad durante el último trimestre."
  - id: b
    text:
      es: "Un permiso por matrimonio que coincide con las fechas previstas de vacaciones."
  - id: c
    text:
      es: "Un permiso parental no retribuido que coincide con las vacaciones previstas."
  - id: d
    correct: true
    text:
      es: "Una incapacidad temporal que impide iniciar las vacaciones dentro del año."
  explanation:
    es: "El artículo 50.2 enumera el permiso de maternidad, la incapacidad temporal, el riesgo durante la lactancia y el riesgo durante el embarazo. La incapacidad temporal está en la lista. El permiso por matrimonio, el permiso parental y la comisión de servicios no están."
  citation: "art. 50.2 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q176
  prompt:
    es: "Según el artículo 50.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las vacaciones que un riesgo durante el embarazo impidió iniciar pueden disfrutarse siempre que no hayan transcurrido más de dieciocho meses desde:"
  options:
  - id: a
    text:
      es: "El inicio de la situación que impidió disfrutarlas."
  - id: b
    correct: true
    text:
      es: "El final del año en que se originaron."
  - id: c
    text:
      es: "La fecha en que se solicitaron las vacaciones."
  - id: d
    text:
      es: "El fin de la situación que impidió disfrutarlas."
  explanation:
    es: "El artículo 50.2 cuenta los dieciocho meses «a partir del final del año en que se hayan originado». No se cuentan desde el fin ni desde el inicio de la situación. Tampoco desde la solicitud de las vacaciones."
  citation: "art. 50.2 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q177
  prompt:
    es: "Según el artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué accidente grave da al funcionario el mismo permiso que el accidente grave de su cónyuge?"
  options:
  - id: a
    correct: true
    text:
      es: "El de su pareja de hecho."
  - id: b
    text:
      es: "El de un familiar suyo de tercer grado que no conviva con él."
  - id: c
    text:
      es: "El de un familiar suyo de segundo grado por consanguinidad."
  - id: d
    text:
      es: "El de un familiar suyo de segundo grado por afinidad."
  explanation:
    es: "El artículo 48.a) da cinco días hábiles por el accidente o la enfermedad graves «del cónyuge, pareja de hecho o parientes hasta el primer grado». La pareja de hecho está en la misma regla que el cónyuge. Los familiares de segundo grado, por consanguinidad o por afinidad, tienen un permiso menor, de cuatro días hábiles. Un familiar de tercer grado que no convive con el funcionario no da permiso."
  citation: "art. 48.a) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q178
  prompt:
    es: "En los supuestos de parto múltiple, la ampliación del permiso por nacimiento por cada hijo a partir del segundo corresponde:"
  options:
  - id: a
    text:
      es: "A ambos progenitores conjuntamente, que se reparten una única semana."
  - id: b
    correct: true
    text:
      es: "A cada uno de los progenitores, una semana para cada uno."
  - id: c
    text:
      es: "Solo al progenitor que lo solicite primero, con una semana por hijo."
  - id: d
    text:
      es: "Solo a la madre biológica, que no puede cederla al otro progenitor."
  explanation:
    es: "El artículo 49.a) amplía el permiso «para ambos progenitores» y, por cada hijo a partir del segundo en el parto múltiple, «una para cada uno de los progenitores». No es una ampliación solo de la madre biológica. Tampoco es una semana única que se reparten ni un derecho del primero que la pide."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q179
  prompt:
    es: "¿Cuándo puede disfrutarse a tiempo parcial el permiso de una funcionaria por adopción, salvo sus seis semanas obligatorias?"
  options:
  - id: a
    text:
      es: "Cuando lo acuerden ambos adoptantes, sin que se tengan en cuenta las necesidades del servicio."
  - id: b
    text:
      es: "Siempre que lo solicite el adoptante, aunque las necesidades del servicio no lo permitan."
  - id: c
    correct: true
    text:
      es: "Cuando las necesidades del servicio lo permitan, en los términos que se determinen reglamentariamente."
  - id: d
    text:
      es: "Solo cuando el menor adoptado tenga discapacidad, previa acreditación ante la Administración."
  explanation:
    es: "El artículo 49.b) dice que el permiso de los párrafos 2.º y 3.º «podrá disfrutarse a jornada completa o a tiempo parcial, cuando las necesidades del servicio lo permitan, y en los términos que reglamentariamente se determinen». La condición son las necesidades del servicio. El acuerdo de los adoptantes no la sustituye. La solicitud del adoptante no basta si el servicio no lo permite. La discapacidad del menor no es requisito."
  citation: "art. 49.b) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q180
  prompt:
    es: "Conforme al artículo 49.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando el progenitor diferente de la madre biológica disfruta su permiso de forma interrumpida, cada periodo de disfrute:"
  options:
  - id: a
    text:
      es: "Se realiza por días hábiles sueltos."
  - id: b
    text:
      es: "Se realiza por quincenas completas."
  - id: c
    text:
      es: "Se realiza por meses naturales completos."
  - id: d
    correct: true
    text:
      es: "Se realiza por semanas completas."
  explanation:
    es: "El artículo 49.c) dice que, en el disfrute interrumpido del permiso, se requiere preaviso para cada período «y se realizará por semanas completas». Los días hábiles sueltos contradicen «semanas completas». Las quincenas confunden la unidad con el preaviso: el apartado fija «un preaviso de al menos quince días», no un periodo de disfrute de quince días. Los meses naturales completos no son la unidad del apartado, que es la semana."
  citation: "art. 49.c) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: m04-l05-q181
  prompt:
    es: "¿En qué caso el permiso por nacimiento del progenitor diferente de la madre biológica, funcionario, es de treinta y dos semanas?"
  options:
  - id: a
    text:
      es: "Cuando el hijo tiene una discapacidad acreditada."
  - id: b
    text:
      es: "Cuando la madre biológica renuncia a su propio permiso."
  - id: c
    text:
      es: "En el parto múltiple, cuando nacen gemelos o más hijos."
  - id: d
    correct: true
    text:
      es: "En la monoparentalidad, por existir una única persona progenitora."
  explanation:
    es: "El artículo 49.c) da diecinueve semanas y dice: «En el supuesto de monoparentalidad, por existir una única persona progenitora, el permiso será de treinta y dos semanas». El parto múltiple añade una semana por cada hijo a partir del segundo. La discapacidad del hijo añade dos. La madre biológica no puede ceder su permiso, que es un derecho individual suyo."
  citation: "art. 49.c) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2015-11719-art-50
- id: m04-l05-q183
  prompt:
    es: "Según el artículo 50.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué ocurre si una incapacidad temporal sobreviene cuando el funcionario ya ha iniciado sus vacaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Puede disfrutar el periodo pendiente aunque haya terminado el año natural."
  - id: b
    text:
      es: "Las vacaciones siguen corriendo y los días que coinciden con la baja se pierden."
  - id: c
    text:
      es: "Los días pendientes se le abonan como compensación económica al final del año."
  - id: d
    text:
      es: "Los días pendientes se suman a sus días de permiso por asuntos particulares."
  explanation:
    es: "El artículo 50.2 prevé que, si una vez iniciado el periodo vacacional sobreviene una incapacidad temporal, «el periodo vacacional se podrá disfrutar aunque haya terminado el año natural». Los días no se pierden. El artículo 50.3 dice que el periodo de vacaciones «no puede ser sustituido por una cuantía económica», así que no se abonan. Tampoco se convierten en días de asuntos particulares."
  citation: "art. 50.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-52
- id: m04-l05-q201
  prompt:
    es: "De acuerdo con el artículo 52 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos deberán desempeñar con diligencia las tareas que tengan asignadas y:"
  options:
  - id: a
    text:
      es: "Velar por los intereses de la unidad en que estén destinados con sujeción a las instrucciones de sus superiores jerárquicos."
  - id: b
    text:
      es: "Velar por los intereses del Departamento en que presten servicios con sujeción a su relación de puestos de trabajo."
  - id: c
    text:
      es: "Velar por los intereses de los ciudadanos de su ámbito territorial con sujeción a los acuerdos de su Administración."
  - id: d
    correct: true
    text:
      es: "Velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico."
  explanation:
    es: "El artículo 52 obliga a «velar por los intereses generales con sujeción y observancia de la Constitución y del resto del ordenamiento jurídico». El interés que se protege es el general, no el de la unidad, el del Departamento ni el de los ciudadanos de un territorio. La sujeción es a la Constitución y al ordenamiento, no a las instrucciones de los superiores, a la relación de puestos ni a los acuerdos de una Administración."
  citation: "art. 52 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-52
- id: m04-l05-q202
  prompt:
    es: "¿Cuáles de los siguientes son principios con arreglo a los cuales deben actuar los empleados públicos, según el artículo 52 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Los de objetividad, integridad, neutralidad e imparcialidad."
  - id: b
    text:
      es: "Los de jerarquía, descentralización, desconcentración y coordinación."
  - id: c
    text:
      es: "Los de subsidiariedad, proporcionalidad, cooperación y planificación."
  - id: d
    text:
      es: "Los de autonomía, suficiencia financiera, solidaridad y coordinación."
  explanation:
    es: "El artículo 52 enumera, entre otros, los principios de «objetividad, integridad, neutralidad, responsabilidad, imparcialidad». Jerarquía, descentralización, desconcentración y coordinación son principios de actuación de la Administración, no de la conducta del empleado. Subsidiariedad, proporcionalidad, cooperación y planificación, y autonomía, suficiencia financiera y solidaridad, no figuran en la lista del artículo 52."
  citation: "art. 52 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
