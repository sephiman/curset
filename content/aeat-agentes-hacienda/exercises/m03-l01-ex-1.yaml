# anchor: boe-a-2003-23186-art-2
- id: m03-l01-q0001
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos son los ingresos públicos que consisten en prestaciones pecuniarias exigidas por una Administración pública como consecuencia de la realización del supuesto de hecho al que la ley vincula:"
  options:
  - id: a
    text:
      es: "El deber de contribuir, con el fin primordial de financiar solo los servicios que cada obligado recibe de esa Administración."
  - id: b
    correct: true
    text:
      es: "El deber de contribuir, con el fin primordial de obtener los ingresos necesarios para el sostenimiento de los gastos públicos."
  - id: c
    text:
      es: "La capacidad económica del contribuyente, con el fin primordial de obtener los ingresos necesarios para el sostenimiento de los gastos públicos."
  - id: d
    text:
      es: "El derecho a una contraprestación, con el fin primordial de equilibrar el reparto de la riqueza entre los territorios."
  explanation:
    es: "El artículo 2.1 liga la prestación pecuniaria al deber de contribuir y fija como fin primordial los ingresos para el sostenimiento de los gastos públicos. Decir que financia solo los servicios que recibe cada obligado limita ese fin, y la norma no lo hace. La capacidad económica es el rasgo del impuesto en el artículo 2.2.c), no aquello a lo que la ley vincula la prestación. Un derecho a contraprestación contradice la idea de deber de contribuir."
  citation: "art. 2.1 LGT"
  difficulty: 2
  tags:
  - "tributo"
  - "concepto"
# anchor: boe-a-2003-23186-art-2
- id: m03-l01-q0002
  prompt:
    es: "¿Cómo define el artículo 2.2.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria a los impuestos, dentro de la clasificación de los tributos?"
  options:
  - id: a
    text:
      es: "Tributos exigidos con contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del obligado."
  - id: b
    text:
      es: "Tributos exigidos sin contraprestación cuyo hecho imponible consiste en un beneficio o aumento de valor de los bienes del obligado por una obra pública."
  - id: c
    correct: true
    text:
      es: "Tributos exigidos sin contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente."
  - id: d
    text:
      es: "Tributos exigidos por la utilización del dominio público o la prestación de servicios que beneficien de modo particular al obligado tributario."
  explanation:
    es: "El impuesto se exige sin contraprestación y su hecho imponible son negocios, actos o hechos que revelan capacidad económica. Con contraprestación el tributo cambia de figura, porque el impuesto se define precisamente por la ausencia de ella. El beneficio por una obra pública describe la contribución especial. El uso del dominio público o la prestación de servicios que benefician al obligado describe la tasa."
  citation: "art. 2.2.c) LGT"
  difficulty: 1
  tags:
  - "impuesto"
  - "concepto"
# anchor: boe-a-2003-23186-art-2
- id: m03-l01-q0003
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la clasificación de los tributos en tasas, contribuciones especiales e impuestos se aplica:"
  options:
  - id: a
    text:
      es: "Según la denominación que utilice la norma que establezca cada tributo."
  - id: b
    text:
      es: "Solo a los tributos que establezca el Estado mediante ley."
  - id: c
    text:
      es: "Únicamente a los tributos exigidos por la Administración General del Estado."
  - id: d
    correct: true
    text:
      es: "Cualquiera que sea la denominación que reciba cada tributo."
  explanation:
    es: "El artículo 2.2 dice que los tributos se clasifican así cualquiera que sea su denominación, de modo que el nombre que les dé la norma no cambia la clase. Supeditar la clase a la denominación de la norma invierte esa regla. La clasificación tampoco se limita a los tributos estatales, porque el concepto de tributo del artículo 2.1 habla de una Administración pública cualquiera. No se reserva a la Administración General del Estado."
  citation: "art. 2.2 LGT"
  difficulty: 1
  tags:
  - "tributo"
  - "clasificación"
# anchor: boe-a-2003-23186-art-3
- id: m03-l01-q0005
  prompt:
    es: "De acuerdo con el artículo 3.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la aplicación del sistema tributario se basará en los principios de:"
  options:
  - id: a
    text:
      es: "Justicia, generalidad, igualdad, progresividad y no confiscatoriedad."
  - id: b
    text:
      es: "Legalidad, eficacia y limitación de los costes directos de la gestión tributaria."
  - id: c
    correct: true
    text:
      es: "Proporcionalidad, eficacia y limitación de costes indirectos derivados del cumplimiento de obligaciones formales."
  - id: d
    text:
      es: "Proporcionalidad, equidad y reducción de los plazos de pago."
  explanation:
    es: "El artículo 3.2 enumera la proporcionalidad, la eficacia y la limitación de costes indirectos por obligaciones formales. Justicia, generalidad, igualdad, progresividad y no confiscatoriedad son principios de la ordenación del sistema, del artículo 3.1. La legalidad no figura entre los de aplicación, y los costes que se limitan son los indirectos, no los de gestión. La equidad y la reducción de plazos tampoco aparecen en el precepto."
  citation: "art. 3.2 LGT"
  difficulty: 2
  tags:
  - "principios"
  - "aplicación"
# anchor: boe-a-2003-23186-art-3
- id: m03-l01-q0006
  prompt:
    es: "¿Qué asegura la aplicación del sistema tributario, además de basarse en los principios de proporcionalidad y eficacia, de acuerdo con el artículo 3.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La recaudación íntegra de las deudas devengadas por cada obligado."
  - id: b
    text:
      es: "La equitativa distribución de la carga tributaria entre Administraciones."
  - id: c
    correct: true
    text:
      es: "El respeto de los derechos y garantías de los obligados tributarios."
  - id: d
    text:
      es: "La igualdad de trato entre tributos estatales, autonómicos y locales."
  explanation:
    es: "El artículo 3.2 añade que la aplicación del sistema asegura el respeto de los derechos y garantías de los obligados tributarios. La recaudación íntegra no se menciona como finalidad en ese apartado. La equitativa distribución de la carga es un principio de la ordenación, en el artículo 3.1, y se refiere a las personas obligadas, no a las Administraciones. La igualdad de trato entre tributos de distintas Haciendas no figura en el precepto."
  citation: "art. 3.2 LGT"
  difficulty: 2
  tags:
  - "principios"
  - "aplicación"
# anchor: boe-a-1978-31229-art-31
- id: m03-l01-q0009
  prompt:
    es: "Una ley aprueba un tributo cuya cuota, aplicada a un contribuyente con una renta anual de 40.000 euros, absorbe la totalidad de esa renta. Ninguna otra norma limita la cuota. ¿Qué exigencia del artículo 31.1 de la Constitución Española no respeta el tributo?"
  options:
  - id: a
    text:
      es: "La de que el sistema tributario se ordene según el criterio de que todos paguen la misma cuota."
  - id: b
    text:
      es: "La de que todo tributo se establezca por una norma con rango de ley."
  - id: c
    correct: true
    text:
      es: "La de que el sistema tributario no tenga, en ningún caso, alcance confiscatorio."
  - id: d
    text:
      es: "La de que el sistema tributario se base en la solidaridad entre las Comunidades Autónomas."
  explanation:
    es: "Una cuota que absorbe toda la renta tiene alcance confiscatorio, y el artículo 31.1 lo prohíbe en todo caso. El tributo se aprobó por ley, de modo que la reserva de ley del artículo 31.3 queda cumplida. La igualdad que exige el artículo 31.1 no significa que todos paguen la misma cuota. La solidaridad entre Comunidades Autónomas no es una exigencia del sistema tributario en ese apartado."
  citation: "art. 31.1 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "no-confiscatoriedad"
# anchor: boe-a-1978-31229-art-31
- id: m03-l01-q0010
  prompt:
    es: "Según el artículo 31.2 de la Constitución Española, ¿cuál de las siguientes figuras realiza una asignación equitativa de los recursos públicos?"
  options:
  - id: a
    text:
      es: "El sistema tributario, cuya ordenación responde a los principios de igualdad y progresividad."
  - id: b
    text:
      es: "El Presupuesto del Estado, cuya aprobación corresponde a las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "El gasto público, cuya programación y ejecución responden a los criterios de eficiencia y economía."
  - id: d
    text:
      es: "La Hacienda autonómica, cuya financiación responde a los principios de coordinación y solidaridad."
  explanation:
    es: "El artículo 31.2 atribuye al gasto público la asignación equitativa de los recursos y somete su programación y ejecución a la eficiencia y la economía. La igualdad y la progresividad son principios del sistema tributario, del apartado 1. El Presupuesto y su aprobación por las Cortes Generales se regulan en el artículo 134. La coordinación y la solidaridad son principios de la autonomía financiera de las Comunidades Autónomas, del artículo 156."
  citation: "art. 31.2 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "gasto-público"
# anchor: boe-a-1978-31229-art-133
- id: m03-l01-q0013
  prompt:
    es: "De acuerdo con el artículo 133.2 de la Constitución Española, las Comunidades Autónomas y las Corporaciones locales podrán establecer y exigir tributos de acuerdo con:"
  options:
  - id: a
    text:
      es: "La Constitución y los Estatutos de Autonomía."
  - id: b
    text:
      es: "Las leyes autonómicas y las ordenanzas fiscales."
  - id: c
    text:
      es: "La Constitución y los reglamentos que dicte el Gobierno."
  - id: d
    correct: true
    text:
      es: "La Constitución y las leyes."
  explanation:
    es: "El artículo 133.2 somete a Comunidades Autónomas y Corporaciones locales a la Constitución y a las leyes. Los Estatutos de Autonomía no son el marco que cita el precepto. Las leyes autonómicas y las ordenanzas tampoco lo agotan, porque el límite incluye la Constitución y las leyes en general. Los reglamentos del Gobierno no son la referencia del artículo."
  citation: "art. 133.2 CE"
  difficulty: 1
  tags:
  - "constitución"
  - "potestad-tributaria"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0016
  prompt:
    es: "De acuerdo con el artículo 134.1 de la Constitución Española, señale la respuesta CORRECTA sobre la elaboración y aprobación de los Presupuestos Generales del Estado:"
  options:
  - id: a
    text:
      es: "Corresponde al Gobierno su elaboración y al Congreso de los Diputados, en exclusiva, su examen, enmienda y aprobación."
  - id: b
    text:
      es: "Corresponde al Ministerio de Hacienda su elaboración y al Senado su aprobación definitiva."
  - id: c
    correct: true
    text:
      es: "Corresponde al Gobierno su elaboración y a las Cortes Generales su examen, enmienda y aprobación."
  - id: d
    text:
      es: "Corresponde al Gobierno su elaboración y al Tribunal de Cuentas su examen y aprobación."
  explanation:
    es: "El Gobierno elabora los Presupuestos y las Cortes Generales los examinan, enmiendan y aprueban. Reservar esa función al Congreso en exclusiva deja fuera al Senado, que forma parte de las Cortes. El Ministerio de Hacienda no es el sujeto de la elaboración que fija el precepto, y el Senado no aprueba de forma definitiva por sí solo. El Tribunal de Cuentas no interviene en la aprobación."
  citation: "art. 134.1 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0017
  prompt:
    es: "De acuerdo con el artículo 134.2 de la Constitución Española, los Presupuestos Generales del Estado tienen carácter anual, incluyen la totalidad de los gastos e ingresos del sector público estatal y en ellos se consigna el importe de:"
  options:
  - id: a
    text:
      es: "Las deudas tributarias aplazadas o fraccionadas por la Administración tributaria."
  - id: b
    correct: true
    text:
      es: "Los beneficios fiscales que afecten a los tributos del Estado."
  - id: c
    text:
      es: "Los tributos propios que establezcan las Comunidades Autónomas."
  - id: d
    text:
      es: "Las prestaciones patrimoniales de carácter público exigidas por las entidades locales."
  explanation:
    es: "El artículo 134.2 manda consignar en los Presupuestos el importe de los beneficios fiscales que afectan a los tributos del Estado. Las deudas aplazadas, los tributos autonómicos y las prestaciones locales no se mencionan ahí, y los dos últimos pertenecen a otras Haciendas, no al sector público estatal."
  citation: "art. 134.2 CE"
  difficulty: 1
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0018
  prompt:
    es: "¿Qué ámbito de gastos e ingresos incluyen los Presupuestos Generales del Estado, de acuerdo con el artículo 134.2 de la Constitución Española?"
  options:
  - id: a
    correct: true
    text:
      es: "La totalidad de los gastos e ingresos del sector público estatal."
  - id: b
    text:
      es: "Solo los ingresos tributarios de la Administración General del Estado y de sus organismos autónomos."
  - id: c
    text:
      es: "Los gastos e ingresos del sector público estatal y de las Comunidades Autónomas."
  - id: d
    text:
      es: "Únicamente los gastos de las Administraciones Públicas Centrales, sin sus ingresos."
  explanation:
    es: "Los Presupuestos incluyen la totalidad de los gastos e ingresos del sector público estatal. Limitarlos a los ingresos tributarios de la Administración General del Estado recorta el ámbito. Añadir las Comunidades Autónomas lo amplía, y estas tienen sus propios presupuestos. Excluir los ingresos contradice la palabra totalidad."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0019
  prompt:
    es: "De acuerdo con el artículo 134.3 de la Constitución Española, el Gobierno debe presentar ante el Congreso de los Diputados los Presupuestos Generales del Estado al menos:"
  options:
  - id: a
    text:
      es: "Seis meses antes de la expiración de los del año anterior."
  - id: b
    text:
      es: "Un mes antes de la expiración de los del año anterior."
  - id: c
    text:
      es: "Quince días antes de la expiración de los del año anterior."
  - id: d
    correct: true
    text:
      es: "Tres meses antes de la expiración de los del año anterior."
  explanation:
    es: "El plazo mínimo de presentación es de tres meses antes de que expiren los Presupuestos del año anterior. Seis meses, un mes y quince días son plazos distintos del que fija el artículo 134.3, y ninguno de ellos aparece en el precepto."
  citation: "art. 134.3 CE"
  difficulty: 1
  tags:
  - "constitución"
  - "presupuestos"
  - "plazo"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0020
  prompt:
    es: "Un grupo parlamentario presenta una enmienda al proyecto de Presupuestos Generales del Estado que aumenta los créditos de una partida. Según el artículo 134.6 de la Constitución Española, ¿qué requiere su tramitación?"
  options:
  - id: a
    text:
      es: "El informe favorable del Consejo de Estado sobre su coste."
  - id: b
    correct: true
    text:
      es: "La conformidad del Gobierno para su tramitación."
  - id: c
    text:
      es: "La mayoría absoluta del Congreso de los Diputados en la votación de totalidad."
  - id: d
    text:
      es: "La autorización previa del Tribunal de Cuentas sobre la partida afectada."
  explanation:
    es: "Una enmienda que aumenta los créditos o disminuye los ingresos requiere la conformidad del Gobierno para su tramitación. El Consejo de Estado y el Tribunal de Cuentas no intervienen en ese trámite según el precepto, y la mayoría absoluta del Congreso no es lo que el artículo exige."
  citation: "art. 134.6 CE"
  difficulty: 2
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0021
  prompt:
    es: "De acuerdo con el artículo 134.7 de la Constitución Española, señale la respuesta CORRECTA sobre la Ley de Presupuestos y los tributos:"
  options:
  - id: a
    text:
      es: "Puede crear tributos y modificarlos libremente, por ser una ley de vigencia anual."
  - id: b
    text:
      es: "No puede crear ni modificar tributos, aunque una ley tributaria sustantiva así lo prevea."
  - id: c
    text:
      es: "Puede crear tributos cuando una ley tributaria sustantiva lo prevea, pero no modificarlos."
  - id: d
    correct: true
    text:
      es: "No puede crear tributos, pero podrá modificarlos cuando una ley tributaria sustantiva así lo prevea."
  explanation:
    es: "La Ley de Presupuestos no puede crear tributos y solo puede modificarlos si una ley tributaria sustantiva lo prevé. Crearlos o modificarlos sin límite contradice el precepto. Prohibir también la modificación niega la excepción que el artículo admite. Invertir los verbos cambia la regla: lo que no puede es crear, no modificar."
  citation: "art. 134.7 CE"
  difficulty: 3
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0022
  prompt:
    es: "La Ley de Presupuestos Generales del Estado de un ejercicio incluye un artículo que crea un impuesto nuevo, sin que ninguna ley tributaria sustantiva lo prevea. Conforme al artículo 134.7 de la Constitución Española, ¿cuál es la valoración correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Contraviene el precepto, porque la Ley de Presupuestos no puede crear tributos."
  - id: b
    text:
      es: "Es conforme, porque la Ley de Presupuestos tiene rango de ley y la potestad originaria es del Estado."
  - id: c
    text:
      es: "Es conforme, porque la Ley de Presupuestos puede crear tributos cuando sean de vigencia anual."
  - id: d
    text:
      es: "Contraviene el precepto, porque la Ley de Presupuestos solo puede crear tributos con el voto del Senado."
  explanation:
    es: "El artículo 134.7 prohíbe a la Ley de Presupuestos crear tributos, y lo hace aunque tenga rango de ley. La vigencia anual no abre excepción alguna. La objeción no es de mayoría ni del Senado: la Ley de Presupuestos puede modificar tributos si una ley sustantiva lo prevé, pero crearlos le está vedado."
  citation: "art. 134.7 CE"
  difficulty: 3
  tags:
  - "constitución"
  - "presupuestos"
# anchor: boe-a-2003-23186-art-2
- id: m03-l01-q0093
  prompt:
    es: "De acuerdo con el artículo 2.2.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los impuestos son los tributos exigidos sin contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto:"
  options:
  - id: a
    text:
      es: "La capacidad contributiva de la Administración que los exige."
  - id: b
    text:
      es: "La riqueza del territorio en que se realiza el hecho imponible."
  - id: c
    text:
      es: "El beneficio que obtiene el obligado del servicio público financiado."
  - id: d
    correct: true
    text:
      es: "La capacidad económica del contribuyente."
  explanation:
    es: "El hecho imponible del impuesto son negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente. La capacidad de la Administración, la riqueza del territorio y el beneficio del servicio financiado son referencias ajenas al artículo. Además, el beneficio obtenido caracteriza a otros tributos con contraprestación, no al impuesto."
  citation: "art. 2.2.c) LGT"
  difficulty: 2
  tags:
  - "impuesto"
  - "concepto"
# anchor: boe-a-2003-23186-art-2
- id: m03-l01-q0094
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos son prestaciones pecuniarias exigidas por una Administración pública con el fin primordial de:"
  options:
  - id: a
    correct: true
    text:
      es: "Obtener los ingresos necesarios para el sostenimiento de los gastos públicos."
  - id: b
    text:
      es: "Redistribuir la renta entre los ciudadanos con arreglo a su capacidad económica."
  - id: c
    text:
      es: "Financiar únicamente los servicios prestados por la Administración que los exige."
  - id: d
    text:
      es: "Garantizar la igualdad de trato entre todos los obligados tributarios."
  explanation:
    es: "El fin primordial de los tributos es obtener los ingresos necesarios para el sostenimiento de los gastos públicos. Redistribuir la renta no es el fin que fija el artículo 2.1. Financiar solo los servicios de la propia Administración restringe el destino de los ingresos, porque el precepto habla de gastos públicos en general. La igualdad de trato es un principio del sistema, del artículo 3, no el fin de la prestación."
  citation: "art. 2.1 LGT"
  difficulty: 2
  tags:
  - "tributo"
  - "concepto"
# anchor: boe-a-2003-23186-art-3
- id: m03-l01-q0107
  prompt:
    es: "De acuerdo con el artículo 3.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la afirmación INCORRECTA sobre los principios en que se basa la aplicación del sistema tributario:"
  options:
  - id: a
    text:
      es: "La aplicación del sistema tributario se basa en el principio de proporcionalidad."
  - id: b
    text:
      es: "La aplicación del sistema tributario se basa en el principio de eficacia."
  - id: c
    text:
      es: "La aplicación del sistema tributario se basa en el principio de limitación de costes indirectos derivados de las obligaciones formales."
  - id: d
    correct: true
    text:
      es: "La aplicación del sistema tributario se basa en el principio de progresividad."
  explanation:
    es: "La progresividad es un principio de la ordenación del sistema tributario, del artículo 3.1, y no de su aplicación, por eso es la afirmación incorrecta. La proporcionalidad, la eficacia y la limitación de costes indirectos derivados de las obligaciones formales sí son los principios del artículo 3.2."
  citation: "art. 3.2 LGT"
  difficulty: 3
  tags:
  - "principios"
  - "aplicación"
# anchor: boe-a-1978-31229-art-134
- id: m03-l01-q0112
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el carácter y el contenido de los Presupuestos Generales del Estado recoge el artículo 134.2 de la Constitución Española?"
  options:
  - id: a
    text:
      es: "Tienen carácter plurianual y en ellos se consigna el importe de los beneficios fiscales que afecten a los tributos del Estado."
  - id: b
    correct: true
    text:
      es: "Tienen carácter anual y en ellos se consigna el importe de los beneficios fiscales que afecten a los tributos del Estado."
  - id: c
    text:
      es: "Tienen carácter anual y en ellos no se consigna el importe de los beneficios fiscales de los tributos del Estado."
  - id: d
    text:
      es: "Tienen carácter anual y en ellos se consigna el importe de los tributos cedidos a las Comunidades Autónomas."
  explanation:
    es: "Los Presupuestos son anuales y consignan el importe de los beneficios fiscales que afecten a los tributos del Estado. Hablar de carácter plurianual cambia su duración. Negar la consignación de los beneficios fiscales contradice el precepto. Lo que se consigna son los beneficios fiscales, no los tributos cedidos."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
