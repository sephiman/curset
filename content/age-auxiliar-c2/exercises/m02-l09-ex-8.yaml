  prompt:
    es: "Según la ayuda de Microsoft para Microsoft Excel 365, A1 contiene un domingo. ¿Qué devuelve =DIASEM(A1)?"
  options:
  - id: a
    text:
      es: "0"
  - id: b
    text:
      es: "7"
  - id: c
    text:
      es: "6"
  - id: d
    correct: true
    text:
      es: "1"
  explanation:
    es: "Con el tipo omitido, la página numera del 1 (domingo) al 7 (sábado), así que el domingo es 1. «0»: con el tipo omitido el rango es 1-7; el 0 solo existe en el tipo 3. «6»: con el tipo 3, el domingo es 6. «7»: con el tipo 2, el domingo es 7."
  citation: "fuente: `ms-excel-funcion-diasem.html`; «Sintaxis»"
