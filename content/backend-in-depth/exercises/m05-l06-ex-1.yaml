- id: m05-l06-q02
  prompt:
    en: Where does Spring Security register the security `Filter` beans that belong to a `SecurityFilterChain`,
      given that `DelegatingFilterProxy` is the filter known to the Servlet container?
  options:
  - id: a
    text:
      en: Directly with the Servlet container, one registration per security filter
  - id: b
    text:
      en: With `DelegatingFilterProxy`, which holds one proxy per security filter
  - id: c
    correct: true
    text:
      en: With `FilterChainProxy` instead of `DelegatingFilterProxy`
  - id: d
    text:
      en: With no registration, because `HttpSecurity` invokes the filters directly
  explanation:
    en: The security filters are registered with `FilterChainProxy` instead of `DelegatingFilterProxy`. Registering
      each filter with the container or with `DelegatingFilterProxy` is the alternative that `FilterChainProxy`
      improves on, because it offers a number of advantages over both. Direct invocation does not happen, because
      the security filters are inserted into the `FilterChainProxy` with the `SecurityFilterChain` API.
  citation: spring-security-servlet-architecture#servlet-securityfilterchain
- id: m05-l06-q04
  prompt:
    en: In Spring Security's JWT resource server support, which component converts the `Jwt` into a collection of
      granted authorities once `JwtAuthenticationProvider` has the decoded token?
  options:
  - id: a
    text:
      en: '`JwtDecoder`'
  - id: b
    correct: true
    text:
      en: '`JwtAuthenticationConverter`'
  - id: c
    text:
      en: '`ProviderManager`'
  - id: d
    text:
      en: '`BearerTokenAuthenticationToken`'
  explanation:
    en: '`JwtAuthenticationProvider` then uses the `JwtAuthenticationConverter` to convert the `Jwt` into a collection
      of granted authorities. `JwtDecoder` does not map authorities, because `JwtAuthenticationProvider` uses it
      to decode, verify and validate the `Jwt`. `ProviderManager` does not convert tokens, because it is only configured
      to use an `AuthenticationProvider` of type `JwtAuthenticationProvider`. `BearerTokenAuthenticationToken` is
      not a converter, because the authentication filter passes it to the `AuthenticationManager` as the input of
      authentication.'
  citation: spring-security-servlet-oauth2-resource-server-jwt#oauth2resourceserver-jwt-architecture
- id: m05-l06-q05
  prompt:
    en: A resource server uses `JwtIssuerAuthenticationManagerResolver.fromTrustedIssuers(...)` with two issuers.
      Why can the application start while those authorization servers are not available?
  options:
  - id: a
    correct: true
    text:
      en: The `JwtAuthenticationProvider` for an issuer is created only when the first request with that issuer
        arrives
  - id: b
    text:
      en: The resolver accepts tokens from an unavailable issuer without validating their signature
  - id: c
    text:
      en: The resolver loads the keys of every issuer at startup and ignores any failure
  - id: d
    text:
      en: The resolver builds an `AuthenticationManager` at runtime for any issuer found in the token
  explanation:
    en: The corresponding `JwtAuthenticationProvider` is instantiated only when the first request with the corresponding
      issuer is sent. Signatures are still validated, because Resource Server validates the signature against a
      public key obtained from the `jwks_url` endpoint during startup or on first request. Nothing is loaded at
      startup, because the issuer endpoints are loaded lazily. Arbitrary issuers are not trusted, because it would
      be unsafe to construct an `AuthenticationManager` from any issuer.
  citation: spring-security-servlet-oauth2-resource-server-multitenancy#_resolving_the_tenant_by_claim
- id: m05-l06-q06
  prompt:
    en: In the `authorizeHttpRequests` DSL of Spring Security, with the default role prefix unchanged, which rule
      is `hasRole("ADMIN")` a shortcut for?
  options:
  - id: a
    text:
      en: '`hasAuthority("ADMIN")`'
  - id: b
    correct: true
    text:
      en: '`hasAuthority("ROLE_ADMIN")`'
  - id: c
    text:
      en: '`denyAll()`'
  - id: d
    text:
      en: '`permitAll()`'
  explanation:
    en: '`hasRole` is a shortcut for `hasAuthority` that prefixes `ROLE_`. `hasAuthority("ADMIN")` has no prefix,
      because `hasRole` prefixes `ROLE_` or whatever is configured as the default prefix. `denyAll()` is a different
      rule, because it does not allow the request under any circumstances. `permitAll()` is a different rule, because
      it requires no authorization and makes a public endpoint.'
  citation: spring-security-servlet-authorization-authorize-http-requests#authorize-requests
- id: m05-l06-q07
  prompt:
    en: With the default JWT resource server configuration in Spring Security, to which authority is the scope `messages`
      of a well-formed JWT mapped?
  options:
  - id: a
    text:
      en: '`ROLE_messages`'
  - id: b
    text:
      en: '`messages`'
  - id: c
    correct: true
    text:
      en: '`SCOPE_messages`'
  - id: d
    text:
      en: '`AUTHORITY_messages`'
  explanation:
    en: Resource Server maps each scope to an authority with the prefix `SCOPE_`. `ROLE_messages`, `messages` and
      `AUTHORITY_messages` are not the mapped authority, because each scope is mapped to an authority with the prefix
      `SCOPE_`.
  citation: spring-security-servlet-oauth2-resource-server-jwt#_runtime_expectations
