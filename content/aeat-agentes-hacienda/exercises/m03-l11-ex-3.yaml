# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0043
  prompt:
    es: "Según el artículo 81.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los efectos de las medidas cautelares cesarán, salvo en los supuestos que el propio artículo prevé, en el plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "Seis meses desde su adopción."
  - id: b
    text:
      es: "Tres meses desde su adopción."
  - id: c
    text:
      es: "Seis meses desde la notificación de la deuda al obligado."
  - id: d
    text:
      es: "Un año desde su adopción, prorrogable por otro año."
  explanation:
    es: "Las medidas cesan en seis meses desde su adopción, salvo los supuestos del propio artículo. Tres meses es un plazo más corto del que fija la ley. El plazo no se cuenta desde la notificación de la deuda. Y un año prorrogable por otro año no es la regla: la ampliación por acuerdo motivado no puede exceder de seis meses."
  citation: "art. 81.7 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "plazos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0044
  prompt:
    es: "Según el artículo 81.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre si se amplía el plazo de seis meses de las medidas cautelares mediante acuerdo motivado?"
  options:
  - id: a
    text:
      es: "La ampliación no puede exceder de tres meses."
  - id: b
    text:
      es: "La ampliación puede ser por el tiempo que la Administración considere necesario."
  - id: c
    correct: true
    text:
      es: "La ampliación no puede exceder de seis meses."
  - id: d
    text:
      es: "La ampliación solo es posible una vez, por el mismo plazo, a solicitud del interesado."
  explanation:
    es: "El plazo puede ampliarse mediante acuerdo motivado, sin que la ampliación pueda exceder de seis meses. No hay tope de tres meses ni ampliación sin límite. Y no depende de la solicitud del interesado: es la Administración quien la acuerda de forma motivada."
  citation: "art. 81.7 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "plazos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0045
  prompt:
    es: "En relación con el artículo 81.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale cuál de los siguientes supuestos permite que los efectos de las medidas cautelares se mantengan más allá de los seis meses desde su adopción:"
  options:
  - id: a
    text:
      es: "Que el obligado tributario presente recurso contra la medida, con efecto suspensivo de los seis meses."
  - id: b
    text:
      es: "Que el obligado tributario solicite el aplazamiento de la deuda cuyo cobro aseguran."
  - id: c
    text:
      es: "Que se declare el concurso del obligado tributario durante los seis meses siguientes."
  - id: d
    correct: true
    text:
      es: "Que se conviertan en embargos en el procedimiento de apremio, con efectos desde la fecha de adopción de la medida cautelar."
  explanation:
    es: "Las medidas cautelares subsisten si se convierten en embargos del procedimiento de apremio, y entonces tienen efectos desde la fecha de adopción de la cautelar. El artículo no prevé que un recurso suspenda el plazo, ni que lo haga una solicitud de aplazamiento, ni que lo haga el concurso del obligado."
  citation: "art. 81.7 LGT"
  difficulty: 3
  tags:
  - "medidas cautelares"
  - "plazos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0046
  prompt:
    es: "¿Cuál de las siguientes circunstancias hace cesar los efectos de las medidas cautelares conforme al artículo 81.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Que desaparezcan las circunstancias que motivaron su adopción."
  - id: b
    text:
      es: "Que el obligado tributario ofrezca bienes en garantía sin que se acepten."
  - id: c
    text:
      es: "Que se dicte providencia de apremio contra el obligado tributario."
  - id: d
    text:
      es: "Que el obligado tributario cambie de domicilio fiscal a otro municipio."
  explanation:
    es: "Los efectos cesan, entre otros supuestos, cuando desaparecen las circunstancias que motivaron la adopción. Ofrecer bienes que no se aceptan no sustituye la medida. La providencia de apremio no hace cesar las cautelares: aquellas pueden convertirse en embargos. Y un cambio de domicilio fiscal no está entre las causas del artículo."
  citation: "art. 81.7 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "plazos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0047
  prompt:
    es: "Según el artículo 81.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las medidas cautelares no cesan a los seis meses si, a solicitud del interesado, se acordase su sustitución por:"
  options:
  - id: a
    text:
      es: "Una declaración responsable del obligado sobre su solvencia patrimonial."
  - id: b
    correct: true
    text:
      es: "Otra garantía que se estime suficiente."
  - id: c
    text:
      es: "La promesa de pago del obligado dentro de los dos meses siguientes."
  - id: d
    text:
      es: "El compromiso del obligado de no enajenar sus bienes durante seis meses."
  explanation:
    es: "La sustitución se admite por otra garantía que se estime suficiente, a solicitud del interesado. Una declaración sobre la solvencia, una promesa de pago o un compromiso de no enajenar no son una garantía que sustituya a la medida: lo que cuenta es que la garantía se estime suficiente."
  citation: "art. 81.7 LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "plazos"
# anchor: boe-a-2003-23186-art-82
- id: m03-l11-q0049
  prompt:
    es: "Según el artículo 82.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para garantizar los aplazamientos o fraccionamientos de la deuda tributaria, la Administración podrá exigir que se constituya a su favor:"
  options:
  - id: a
    text:
      es: "Hipoteca inmobiliaria sobre bienes de valor superior a la deuda aplazada, en todo caso."
  - id: b
    text:
      es: "Fianza personal y solidaria de dos obligados tributarios al corriente de sus obligaciones."
  - id: c
    text:
      es: "Depósito en efectivo por el importe de la primera fracción de la deuda fraccionada."
  - id: d
    correct: true
    text:
      es: "Aval solidario de entidad de crédito o sociedad de garantía recíproca o certificado de seguro de caución."
  explanation:
    es: "La garantía ordinaria es el aval solidario de entidad de crédito o sociedad de garantía recíproca, o el certificado de seguro de caución. La hipoteca, la fianza personal y solidaria o la prenda son alternativas excepcionales cuando no se puede obtener el aval o compromete la viabilidad. El depósito de la primera fracción no figura en el artículo."
  citation: "art. 82.1 LGT"
  difficulty: 2
  tags:
  - "garantías"
  - "aplazamiento"
# anchor: boe-a-2003-23186-art-82
- id: m03-l11-q0050
  prompt:
    es: "De acuerdo con el artículo 82.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración podrá admitir garantías que consistan en hipoteca, prenda, fianza personal y solidaria u otra que se estime suficiente cuando se justifique que:"
  options:
  - id: a
    text:
      es: "El obligado carece de bienes inmuebles sobre los que constituir la hipoteca."
  - id: b
    correct: true
    text:
      es: "No es posible obtener el aval o certificado, o que su aportación compromete gravemente la viabilidad de la actividad económica."
  - id: c
    text:
      es: "El aval solicitado por la Administración supera el importe de la deuda tributaria aplazada."
  - id: d
    text:
      es: "La deuda se ha solicitado aplazar o fraccionar por segunda vez respecto de la misma liquidación."
  explanation:
    es: "Las garantías alternativas solo se admiten si se justifica que no es posible obtener el aval o el certificado de seguro de caución, o que su aportación compromete gravemente la viabilidad de la actividad económica. Carecer de inmuebles, un aval superior a la deuda o un segundo aplazamiento no son la causa que fija este apartado."
  citation: "art. 82.1 LGT"
  difficulty: 2
  tags:
  - "garantías"
  - "aplazamiento"
# anchor: boe-a-2005-14803-art-66
- id: m03-l11-q0051
  prompt:
    es: "Según el artículo 66.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en relación con otras deudas puede constituirse voluntariamente, como garantía en favor de la Hacienda pública, hipoteca inmobiliaria, hipoteca mobiliaria, prenda sin desplazamiento de la posesión o:"
  options:
  - id: a
    text:
      es: "Cualquier otro derecho personal de garantía."
  - id: b
    text:
      es: "Cualquier garantía que ofrezca un tercero distinto del obligado."
  - id: c
    correct: true
    text:
      es: "Cualquier otro derecho real de garantía."
  - id: d
    text:
      es: "Cualquier depósito que se constituya en entidad de crédito."
  explanation:
    es: "La lista termina en cualquier otro derecho real de garantía. Un derecho personal de garantía, como el aval o la fianza, no es un derecho real. Tampoco se alude a garantías de terceros ni a depósitos bancarios."
  citation: "art. 66.2 RGR"
  difficulty: 2
  tags:
  - "garantías"
  - "derechos reales"
# anchor: boe-a-2005-14803-art-66
- id: m03-l11-q0052
  prompt:
    es: "¿En cuál de los siguientes casos puede constituirse voluntariamente hipoteca inmobiliaria como garantía en favor de la Hacienda pública según el artículo 66.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Solo en los casos de aplazamiento y fraccionamiento de deudas del período voluntario."
  - id: b
    correct: true
    text:
      es: "En los casos de aplazamiento y fraccionamiento o en los demás supuestos previstos en la normativa aplicable."
  - id: c
    text:
      es: "Únicamente cuando la Administración la exija al obligado dentro del procedimiento de apremio."
  - id: d
    text:
      es: "Solo cuando el obligado carezca de bienes muebles suficientes para garantizar la deuda."
  explanation:
    es: "La constitución voluntaria procede en los casos de aplazamiento y fraccionamiento o en los demás supuestos que prevea la normativa aplicable. No se limita a los aplazamientos del período voluntario. Y se trata de una constitución voluntaria, no de una garantía que se exija en el apremio ni condicionada a la falta de bienes muebles."
  citation: "art. 66.2 RGR"
  difficulty: 2
  tags:
  - "garantías"
  - "derechos reales"
# anchor: boe-a-2003-23186-art-80
- id: m03-l11-q0127
  prompt:
    es: "¿Sobre qué bienes tiene derecho de retención frente a todos la Administración tributaria conforme al artículo 80 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Sobre las mercancías declaradas en las aduanas, para el pago de la deuda aduanera y fiscal."
  - id: b
    text:
      es: "Sobre los bienes inmuebles del obligado inscritos en el registro, para el pago de los tributos."
  - id: c
    text:
      es: "Sobre los bienes embargados al obligado, hasta que se resuelva el recurso contra el embargo."
  - id: d
    text:
      es: "Sobre los pagos que realice la Administración al obligado, para el cobro de cualquier deuda."
  explanation:
    es: "El derecho de retención recae sobre las mercancías declaradas en las aduanas, para el pago de la deuda aduanera y fiscal. Los inmuebles inscritos se protegen por la hipoteca legal tácita, y la retención de pagos de la Administración es una medida cautelar del artículo 81.4, no el derecho de retención del artículo 80."
  citation: "art. 80 LGT"
  difficulty: 2
  tags:
  - "derecho de retención"
  - "garantías"
# anchor: boe-a-2003-23186-art-77
- id: m03-l11-q0130
  prompt:
    es: "Según el artículo 77.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el derecho de prelación de la Hacienda Pública:"
  options:
  - id: a
    text:
      es: "Se refiere a todos los créditos tributarios, vencidos o no, aunque estén satisfechos parcialmente."
  - id: b
    text:
      es: "Se refiere a los créditos tributarios vencidos, aunque concurra con acreedores de derecho real inscrito antes."
  - id: c
    text:
      es: "Se refiere solo a los créditos tributarios que hayan sido objeto de embargo en el procedimiento de apremio."
  - id: d
    correct: true
    text:
      es: "Se refiere a los créditos tributarios vencidos y no satisfechos, en cuanto concurra con otros acreedores."
  explanation:
    es: "La prelación cubre los créditos tributarios vencidos y no satisfechos cuando la Hacienda concurre con otros acreedores. No incluye los no vencidos, cede ante los acreedores con derecho real inscrito antes y no depende de que se haya embargado."
  citation: "art. 77.1 LGT"
  difficulty: 2
  tags:
  - "prelación"
  - "garantías"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0131
  prompt:
    es: "En relación con el artículo 81.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las medidas cautelares que puede adoptar la Administración tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Son de carácter provisional y sirven para asegurar el cobro de las deudas para cuya recaudación es competente."
  - id: b
    text:
      es: "Son de carácter definitivo y sirven para asegurar el cobro de cualquier deuda, aunque no sea competente para su recaudación."
  - id: c
    text:
      es: "Son de carácter provisional y solo pueden adoptarse una vez notificada la providencia de apremio."
  - id: d
    text:
      es: "Son de carácter provisional y sirven para garantizar el cobro de las deudas de otros Estados exclusivamente."
  explanation:
    es: "Las medidas son de carácter provisional y aseguran el cobro de las deudas para cuya recaudación es competente la Administración. No son definitivas ni se extienden a cualquier deuda, y no hace falta que exista providencia de apremio. Tampoco se limitan a las deudas de otros Estados."
  citation: "art. 81.1 LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "garantías"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0132
  prompt:
    es: "De acuerdo con el artículo 81.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las medidas cautelares que pueden adoptarse para asegurar el cobro de las deudas:"
  options:
  - id: a
    text:
      es: "Pueden consistir en la declaración de fallido del obligado y de sus responsables y en la prohibición de enajenar, gravar o disponer de bienes o derechos."
  - id: b
    text:
      es: "Pueden consistir en el embargo definitivo de bienes y derechos y en la prohibición de salir del territorio español."
  - id: c
    correct: true
    text:
      es: "Pueden consistir en el embargo preventivo de bienes y derechos y en la prohibición de enajenar, gravar o disponer de bienes o derechos."
  - id: d
    text:
      es: "Pueden consistir en la suspensión de la actividad del obligado y en la retención de sus bienes en el domicilio."
  explanation:
    es: "El embargo preventivo de bienes y derechos y la prohibición de enajenar, gravar o disponer son dos de las medidas del artículo 81.4, apartados b) y c). La declaración de fallido, el embargo definitivo, la prohibición de salir del territorio y la suspensión de la actividad no figuran en la lista."
  citation: "art. 81.4 LGT"
  difficulty: 3
  tags:
  - "medidas cautelares"
  - "tipos"
# anchor: boe-a-2003-23186-art-78
- id: m03-l11-q0134
  prompt:
    es: "En relación con la hipoteca legal tácita regulada en el artículo 78 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se aplica a los tributos que graven las transmisiones de bienes, cualquiera que sea el poseedor de los bienes transmitidos."
  - id: b
    text:
      es: "Se aplica a todos los tributos del obligado, con preferencia sobre cualquier acreedor aunque no haya inscrito su derecho."
  - id: c
    text:
      es: "Se aplica a los tributos que graven periódicamente bienes inscribibles, pero cede ante los acreedores que hayan inscrito sus derechos."
  - id: d
    correct: true
    text:
      es: "Se aplica a los tributos que graven periódicamente bienes o derechos inscribibles en un registro público o sus productos directos, ciertos o presuntos."
  explanation:
    es: "La hipoteca legal tácita se aplica a los tributos que gravan periódicamente bienes o derechos inscribibles en un registro público o sus productos. La segunda opción describe la afección del artículo 79.2, que es otra garantía. No alcanza a todos los tributos. Y la preferencia opera aunque los demás acreedores hayan inscrito sus derechos, de modo que no cede ante ellos."
  citation: "art. 78 LGT"
  difficulty: 3
  tags:
  - "hipoteca legal tácita"
  - "garantías"
