# anchor: boe-a-2003-23186-art-157
- id: m03-l08-q0305
  prompt:
    es: "La inspección extiende el 14 de abril de 2026 un acta de disconformidad a Carpintería Olmo, S.L., que se le notifica el 16 de abril de 2026. Según el artículo 157.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿ante qué órgano y en qué plazo puede la sociedad formular alegaciones?"
  options:
  - id: a
    text:
      es: "Ante el actuario que extendió el acta, en 15 días desde que se extendió el acta o desde su notificación."
  - id: b
    correct: true
    text:
      es: "Ante el órgano competente para liquidar, en 15 días desde que se extendió el acta o desde su notificación."
  - id: c
    text:
      es: "Ante el órgano competente para liquidar, en un mes desde que se extendió el acta o desde su notificación."
  - id: d
    text:
      es: "Ante el órgano competente para liquidar, en diez días desde que se extendió el acta, sin otra posibilidad de cómputo."
  explanation:
    es: "En el plazo de 15 días desde la fecha en que se haya extendido el acta o desde la notificación de la misma, el obligado puede formular alegaciones ante el órgano competente para liquidar (art. 157.3). Presentarlas ante el actuario cambia el órgano, y la norma da un único destinatario. Un mes es el plazo del acta de conformidad (art. 156.3) y diez días el de la liquidación en el acta con acuerdo (art. 155.5), no el de alegaciones. Además, la norma permite contar desde el acta o desde su notificación, no solo desde el acta."
  citation: "art. 157.3 LGT"
  difficulty: 1
  tags:
  - "acta de disconformidad"
  - "alegaciones"
  - "órgano competente"
# anchor: boe-a-2003-23186-art-146
- id: m03-l08-q0079
  prompt:
    es: "Conforme al artículo 146.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las medidas cautelares podrán consistir, en su caso, en el precinto, depósito o incautación de las mercancías o productos sometidos a gravamen, así como de:"
  options:
  - id: a
    text:
      es: "Cuentas corrientes, depósitos y créditos del obligado que puedan contener la información de que se trate."
  - id: b
    text:
      es: "Libros, registros, documentos y archivos, pero no locales ni equipos electrónicos de tratamiento de datos."
  - id: c
    correct: true
    text:
      es: "Libros, registros, documentos, archivos, locales o equipos electrónicos de tratamiento de datos que puedan contener la información de que se trate."
  - id: d
    text:
      es: "Bienes inmuebles y vehículos del obligado, hasta el importe de la deuda tributaria que se estime."
  explanation:
    es: "El artículo 146.1 incluye libros, registros, documentos, archivos, locales y equipos electrónicos de tratamiento de datos. Las cuentas, los inmuebles y los vehículos son bienes embargables en recaudación y no son soporte de la información de que se trate, y excluir locales y equipos recorta el texto."
  citation: "art. 146.1 LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "objeto"
# anchor: boe-a-2003-23186-art-146
- id: m03-l08-q0080
  prompt:
    es: "Según el artículo 146.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los límites de las medidas cautelares en el procedimiento de inspección:"
  options:
  - id: a
    text:
      es: "Serán proporcionadas y limitadas temporalmente a sus fines, y excepcionalmente podrán adoptarse aunque produzcan un perjuicio de difícil reparación, previa motivación."
  - id: b
    correct: true
    text:
      es: "Serán proporcionadas y limitadas temporalmente a sus fines, sin que puedan adoptarse las que puedan producir un perjuicio de difícil o imposible reparación."
  - id: c
    text:
      es: "Serán proporcionadas, pero no tienen límite temporal mientras dure el procedimiento inspector."
  - id: d
    text:
      es: "Serán proporcionadas y limitadas temporalmente, sin que puedan adoptarse las que supongan precinto de locales."
  explanation:
    es: "El artículo 146.2 exige proporcionalidad y limitación temporal y prohíbe las que puedan producir un perjuicio de difícil o imposible reparación, sin excepciones. Tampoco declara ilimitadas las medidas en el tiempo ni prohíbe el precinto de locales, que el apartado 1 admite."
  citation: "art. 146.2 LGT"
  difficulty: 3
  tags:
  - "medidas cautelares"
  - "límites"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0081
  prompt:
    es: "De acuerdo con el artículo 181.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las medidas cautelares necesarias para el aseguramiento de los elementos de prueba en el procedimiento de inspección podrán ser adoptadas por:"
  options:
  - id: a
    correct: true
    text:
      es: "Los funcionarios que estén desarrollando las actuaciones."
  - id: b
    text:
      es: "El órgano competente para liquidar, previa audiencia del obligado."
  - id: c
    text:
      es: "El delegado o el director de departamento, a propuesta del actuario."
  - id: d
    text:
      es: "La autoridad judicial, a solicitud de la inspección."
  explanation:
    es: "El artículo 181.1 faculta a los funcionarios que desarrollan las actuaciones para adoptar las medidas. El órgano que liquida las ratifica después. El delegado o el director de departamento intervienen en la entrada y en las actuaciones fuera de jornada, y la autoridad judicial no adopta las medidas del procedimiento inspector."
  citation: "art. 181.1 RGAT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "competencia"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0082
  prompt:
    es: "Conforme al artículo 181.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el precinto se realizará mediante la ligadura sellada o por cualquier otro medio que permita el cierre o atado de los elementos de prueba, a fin de que:"
  options:
  - id: a
    text:
      es: "No se abran sin la presencia de un notario o del secretario del órgano competente para liquidar."
  - id: b
    text:
      es: "Queden bajo la custodia de la persona física o jurídica que se determine por la Administración."
  - id: c
    correct: true
    text:
      es: "No se abran sin la autorización y control de los órganos de inspección."
  - id: d
    text:
      es: "La Administración tome posesión de ellos y adopte las medidas precisas para su conservación."
  explanation:
    es: "El precinto cierra los elementos de prueba para que no se abran sin autorización y control de los órganos de inspección (art. 181.2). Poner los elementos bajo custodia de una persona es el depósito y tomar posesión de ellos es la incautación. La presencia de un notario no se exige."
  citation: "art. 181.2 RGAT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "precinto"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0084
  prompt:
    es: "Según el artículo 181.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la incautación consiste en la toma de posesión de elementos de prueba de carácter mueble, y se deberán adoptar:"
  options:
  - id: a
    text:
      es: "Las medidas necesarias para su devolución al obligado en el plazo de cinco días."
  - id: b
    text:
      es: "Las medidas para su traslado inmediato a un depósito judicial."
  - id: c
    text:
      es: "Las medidas para su valoración por perito antes de la ratificación."
  - id: d
    correct: true
    text:
      es: "Las medidas que fueran precisas para su adecuada conservación."
  explanation:
    es: "El artículo 181.2 impone adoptar las medidas precisas para la adecuada conservación de lo incautado. No fija devolución en cinco días, traslado a un depósito judicial ni valoración por perito."
  citation: "art. 181.2 RGAT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "incautación"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0086
  prompt:
    es: "De acuerdo con el artículo 181.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, para la adopción de las medidas cautelares se podrá recabar el auxilio y colaboración de:"
  options:
  - id: a
    text:
      es: "Las autoridades judiciales, que deberán autorizar previamente cada medida cautelar."
  - id: b
    text:
      es: "Las entidades de crédito, que deberán retener los fondos del obligado tributario."
  - id: c
    text:
      es: "Los órganos de recaudación, que deberán ejecutar las medidas por orden del órgano competente para liquidar en el plazo de cinco días."
  - id: d
    correct: true
    text:
      es: "Las autoridades competentes y sus agentes, que deberán prestarlo en los términos del artículo 142.4 de la Ley General Tributaria."
  explanation:
    es: "El artículo 181.3 permite recabar el auxilio de las autoridades competentes y sus agentes, en los términos del artículo 142.4 de la Ley. No exige autorización judicial para cada medida, no se dirige a entidades de crédito y no encomienda la ejecución a la recaudación."
  citation: "art. 181.3 RGAT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "auxilio"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0087
  prompt:
    es: "Conforme al artículo 181.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la adopción de las medidas cautelares deberá documentarse mediante diligencia en la que, junto a la medida adoptada, se harán constar el inventario de los bienes afectados y:"
  options:
  - id: a
    correct: true
    text:
      es: "Sucintamente las circunstancias y la finalidad que determinan su adopción, informando al obligado de su derecho a formular alegaciones."
  - id: b
    text:
      es: "Con detalle las circunstancias y la finalidad que determinan su adopción, sin informar al obligado de sus alegaciones hasta la ratificación."
  - id: c
    text:
      es: "La valoración económica de los bienes afectados y el plazo en que se levantará la medida."
  - id: d
    text:
      es: "El nombre del órgano competente para liquidar que ratificará la medida y la fecha de ratificación."
  explanation:
    es: "La diligencia recoge la medida, el inventario, sucintamente las circunstancias y la finalidad, y la información al obligado sobre su derecho a formular alegaciones (art. 181.4). No exige valoración económica ni plazo de levantamiento, ni la fecha de una ratificación futura, y la información sobre alegaciones se da desde la propia diligencia."
  citation: "art. 181.4 RGAT"
  difficulty: 3
  tags:
  - "medidas cautelares"
  - "diligencia"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0097
  prompt:
    es: "Conforme al artículo 181.6 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando las medidas cautelares adoptadas se levanten, se documentará esta circunstancia:"
  options:
  - id: a
    correct: true
    text:
      es: "En diligencia, que deberá comunicarse al obligado."
  - id: b
    text:
      es: "En informe del actuario, que deberá notificarse al órgano de recaudación."
  - id: c
    text:
      es: "En acta de inspección, que deberá firmar el obligado tributario."
  - id: d
    text:
      es: "En acuerdo motivado, que deberá publicarse en el boletín oficial."
  explanation:
    es: "El levantamiento de las medidas se documenta en diligencia y se comunica al obligado (art. 181.6). No se hace en informe, en acta ni en acuerdo publicado."
  citation: "art. 181.6 RGAT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "levantamiento"
# anchor: boe-a-2003-23186-art-146
- id: m03-l08-q0132
  prompt:
    es: "¿Qué ocurre con las medidas cautelares adoptadas en el procedimiento de inspección, según el artículo 146.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si desaparecen las circunstancias que las motivaron?"
  options:
  - id: a
    correct: true
    text:
      es: "Se levantan."
  - id: b
    text:
      es: "Se mantienen hasta que el órgano competente para liquidar ratifique su levantamiento."
  - id: c
    text:
      es: "Se mantienen hasta la terminación del procedimiento, aunque cambien las circunstancias iniciales."
  - id: d
    text:
      es: "Se convierten en medidas de aseguramiento del cobro, que ejecuta el órgano de recaudación."
  explanation:
    es: "El artículo 146.3 las hace desaparecer con sus causas: se levantarán si desaparecen las circunstancias que las motivaron. No hace falta ratificar el levantamiento, no se mantienen hasta el fin del procedimiento y no se transforman en medidas de cobro."
  citation: "art. 146.3 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "levantamiento"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0133
  prompt:
    es: "¿A quién debe remitirse inmediatamente copia de la diligencia en que se documenta la adopción de una medida cautelar, según el artículo 181.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Al obligado tributario."
  - id: b
    text:
      es: "Al órgano judicial competente, que debe autorizar la medida."
  - id: c
    text:
      es: "Al órgano de recaudación, que debe preparar la ejecución de la medida."
  - id: d
    text:
      es: "Al delegado de la Agencia Tributaria, que debe aprobar la medida."
  explanation:
    es: "El artículo 181.4 ordena remitir inmediatamente copia de la diligencia al obligado. No se envía al juez, al órgano de recaudación ni al delegado como trámite de la medida."
  citation: "art. 181.4 RGAT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "diligencia"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0135
  prompt:
    es: "De acuerdo con el artículo 181.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿en qué consiste la incautación como medida cautelar en el procedimiento de inspección?"
  options:
  - id: a
    text:
      es: "En poner los elementos de prueba bajo la custodia de la persona que determine la Administración."
  - id: b
    text:
      es: "En el cierre o atado de los elementos de prueba mediante ligadura sellada para impedir su apertura."
  - id: c
    text:
      es: "En la entrega de los elementos de prueba al órgano judicial para su custodia hasta la liquidación."
  - id: d
    correct: true
    text:
      es: "En la toma de posesión de elementos de prueba de carácter mueble."
  explanation:
    es: "La incautación es la toma de posesión de elementos de prueba muebles (art. 181.2). Poner los elementos bajo custodia de la persona que determine la Administración es el depósito, el cierre con ligadura sellada es el precinto, y no se entregan a un juez."
  citation: "art. 181.2 RGAT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "incautación"
# anchor: boe-a-2007-15984-art-181
- id: m03-l08-q0317
  prompt:
    es: "Conforme al artículo 181.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, la inspección adopta como medida cautelar el depósito de varios ordenadores de Bufete Luna, S.L., pero un corte general del suministro eléctrico, ajeno a la Administración, impide extender la diligencia en ese momento. ¿Cuándo debe extenderse?"
  options:
  - id: a
    text:
      es: "En el plazo de 15 días desde la adopción de la medida, junto con el acuerdo de ratificación."
  - id: b
    text:
      es: "Dentro de las 24 horas siguientes a la adopción de la medida, aunque persistan las causas que lo impiden."
  - id: c
    correct: true
    text:
      es: "En cuanto desaparezcan las causas que lo impiden, remitiendo inmediatamente copia de la diligencia al obligado."
  - id: d
    text:
      es: "Cuando el órgano competente para liquidar ratifique la medida, para que la diligencia recoja su acuerdo."
  explanation:
    es: "La diligencia se extiende en el mismo momento en que se adopta la medida, salvo que no sea posible por causas no imputables a la Administración, y en ese caso se extiende en cuanto desaparezcan las causas que lo impiden y se remite inmediatamente copia al obligado (art. 181.4). Un corte de suministro ajeno a la Administración es una causa no imputable. Los 15 días son el plazo de ratificación de la medida, no el de la diligencia. Las 24 horas no figuran en la norma, que condiciona el momento a que desaparezca la causa. Esperar a la ratificación retrasa un documento que debe extenderse al adoptarse la medida o en cuanto sea posible."
  citation: "art. 181.4 RGAT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "diligencia"
  - "depósito"
