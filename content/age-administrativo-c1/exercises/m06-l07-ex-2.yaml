# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q048
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de los siguientes niveles de permisos deja al invitado solo leer los elementos de una carpeta compartida?"
  options:
