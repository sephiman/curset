# anchor: boe-a-2015-11719-art-18
- id: m04-l05-q247
  prompt:
    es: "De acuerdo con el artículo 18.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, para la promoción interna los funcionarios deberán:"
  options:
  - id: a
    text:
      es: "Poseer los requisitos de ingreso, tener al menos cinco años de servicio activo en el inferior Subgrupo y superar las pruebas selectivas."
  - id: b
    correct: true
    text:
      es: "Poseer los requisitos de ingreso, tener al menos dos años de servicio activo en el inferior Subgrupo y superar las pruebas selectivas."
  - id: c
    text:
      es: "Poseer los requisitos de ingreso, tener al menos dos años de servicio activo en el inferior Subgrupo y superar un curso de formación."
  - id: d
    text:
      es: "Tener al menos dos años de servicio activo en el inferior Subgrupo y grado personal consolidado, sin superar pruebas selectivas."
  explanation:
    es: "El artículo 18.2 exige «poseer los requisitos exigidos para el ingreso, tener una antigüedad de, al menos, dos años de servicio activo en el inferior Subgrupo […] y superar las correspondientes pruebas selectivas». La antigüedad es de dos años, no de cinco. Lo que se supera son pruebas selectivas, no un curso de formación. El precepto no pide grado consolidado ni prescinde de las pruebas."
  citation: "art. 18.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-18
- id: m04-l05-q248
  prompt:
    es: "Según el artículo 18.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿dónde deben haberse prestado los dos años de servicio activo exigidos para la promoción interna?"
  options:
  - id: a
    text:
      es: "En el mismo puesto de trabajo desde el que se participa en el proceso selectivo."
  - id: b
    text:
      es: "En la misma Administración Pública que convoca el proceso de promoción interna."
  - id: c
    text:
      es: "En cualquier Subgrupo, sea o no inferior al del Cuerpo al que se aspira."
  - id: d
    correct: true
    text:
      es: "En el inferior Subgrupo, o en el Grupo de clasificación si este no tiene Subgrupo."
  explanation:
    es: "El artículo 18.2 exige dos años de servicio activo «en el inferior Subgrupo, o Grupo de clasificación profesional, en el supuesto de que éste no tenga Subgrupo». No exige un mismo puesto ni una misma Administración. El Subgrupo ha de ser el inferior, no uno cualquiera."
  citation: "art. 18.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-18
- id: m04-l05-q249
  prompt:
    es: "De acuerdo con el artículo 18.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de los requisitos de ingreso y de la antigüedad mínima, el funcionario que aspira a la promoción interna debe:"
  options:
  - id: a
    text:
      es: "Tener consolidado un grado personal dentro del intervalo del Cuerpo de destino."
  - id: b
    text:
      es: "Haber desempeñado un puesto de libre designación durante un año."
  - id: c
    correct: true
    text:
      es: "Superar las correspondientes pruebas selectivas."
  - id: d
    text:
      es: "Contar con informe favorable del Subsecretario de su Departamento."
  explanation:
    es: "El tercer requisito del artículo 18.2 es «superar las correspondientes pruebas selectivas». El precepto no exige grado personal consolidado, un puesto previo de libre designación ni un informe del Subsecretario."
  citation: "art. 18.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l05-q250
  prompt:
    es: "De acuerdo con la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, lo establecido en el capítulo II del título III, donde está la promoción interna, producirá efectos:"
  options:
  - id: a
    text:
      es: "A partir del día siguiente al de la publicación del texto refundido en el Boletín Oficial del Estado."
  - id: b
    text:
      es: "A partir del 1 de enero del año siguiente al de la publicación del texto refundido."
  - id: c
    correct: true
    text:
      es: "A partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: d
    text:
      es: "A partir de la aprobación por cada Administración de su primera oferta de empleo público."
  explanation:
    es: "La disposición final cuarta.1 dice que lo establecido en esos capítulos «producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo de este Estatuto». No depende de la publicación del texto refundido, de una fecha fija ni de las ofertas de empleo público."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-73
- id: m04-l05-q251
  prompt:
    es: "De acuerdo con el artículo 73 del Real Decreto 364/1995, de 10 de marzo, la promoción interna consiste en el ascenso desde Cuerpos o Escalas de un Grupo de titulación:"
  options:
  - id: a
    correct: true
    text:
      es: "A otro del inmediato superior, o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  - id: b
    text:
      es: "A cualquier otro superior, o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  - id: c
    text:
      es: "A otro del inmediato superior, sin incluir el acceso a Cuerpos o Escalas del mismo Grupo."
  - id: d
    text:
      es: "A otro del inmediato superior, o en el acceso a puestos de nivel superior dentro del mismo Cuerpo."
  explanation:
    es: "El artículo 73 dice: «La promoción interna consiste en el ascenso desde Cuerpos o Escalas de un Grupo de titulación a otro del inmediato superior o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación». El ascenso es al Grupo inmediato superior, no a cualquiera. El acceso a otro Cuerpo del mismo Grupo sí está incluido. Subir a un puesto de nivel superior en el mismo Cuerpo es provisión, no promoción interna."
  citation: "art. 73 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-73
- id: m04-l05-q252
  prompt:
    es: "Un funcionario de un Cuerpo de un Grupo de titulación participa en pruebas para acceder a otro Cuerpo del mismo Grupo de titulación. ¿Es promoción interna en la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "No, porque solo es promoción interna el ascenso al Grupo inmediato superior."
  - id: b
    text:
      es: "No, porque el paso a otro Cuerpo del mismo Grupo se hace por concurso de provisión."
  - id: c
    text:
      es: "Sí, pero solo si el nuevo Cuerpo está adscrito al mismo Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Sí, porque incluye el acceso a Cuerpos o Escalas del mismo Grupo de titulación."
  explanation:
    es: "El artículo 73 del Real Decreto 364/1995 define la promoción interna como el ascenso al Grupo inmediato superior «o en el acceso a Cuerpos o Escalas del mismo Grupo de titulación». El acceso a otro Cuerpo del mismo Grupo es promoción interna. El concurso de provisión adjudica puestos, no da acceso a otro Cuerpo. El precepto no exige que el nuevo Cuerpo esté en el mismo Departamento."
  citation: "art. 73 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-76
- id: m04-l05-q253
  prompt:
    es: "Según el artículo 76 del Real Decreto 364/1995, de 10 de marzo, ¿dónde debe tenerse la antigüedad mínima de dos años exigida para participar en pruebas de promoción interna?"
  options:
  - id: a
    text:
      es: "En el puesto de trabajo que desempeñe el funcionario."
  - id: b
    correct: true
    text:
      es: "En el Cuerpo o Escala a que pertenezca el funcionario."
  - id: c
    text:
      es: "En el Departamento que convoca las pruebas selectivas."
  - id: d
    text:
      es: "En cualquier Cuerpo de la Administración General del Estado."
  explanation:
    es: "El artículo 76 exige «una antigüedad de, al menos, dos años en el Cuerpo o Escala a que pertenezcan». La antigüedad se mide en el Cuerpo o Escala propio, no en el puesto, en el Departamento convocante ni en cualquier Cuerpo de la Administración."
  citation: "art. 76 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-76
- id: m04-l05-q254
  prompt:
    es: "De acuerdo con el artículo 76 del Real Decreto 364/1995, de 10 de marzo, la antigüedad de al menos dos años exigida para participar en pruebas de promoción interna debe tenerse:"
  options:
  - id: a
    text:
      es: "El día de la publicación de la convocatoria en el Boletín Oficial del Estado."
  - id: b
    correct: true
    text:
      es: "El día de la finalización del plazo de presentación de solicitudes."
  - id: c
    text:
      es: "El día de celebración del primer ejercicio de la fase de oposición."
  - id: d
    text:
      es: "El día de la toma de posesión en el Cuerpo o Escala de destino."
  explanation:
    es: "El artículo 76 fija la antigüedad «el día de la finalización del plazo de presentación de solicitudes de participación». La publicación de la convocatoria, el primer ejercicio y la toma de posesión son otros momentos del proceso que el precepto no utiliza."
  citation: "art. 76 RD 364/1995"
  difficulty: 1
  tags:
  - "fecha"
  - "requisito"
# anchor: boe-a-1995-8729-art-76
- id: m04-l05-q255
  prompt:
    es: "Según el artículo 76 del Real Decreto 364/1995, de 10 de marzo, además de la antigüedad, ¿qué deben poseer los funcionarios para participar en pruebas de promoción interna?"
  options:
  - id: a
    text:
      es: "La titulación exigida para el Cuerpo o Escala al que ya pertenecen y un grado personal consolidado."
  - id: b
    correct: true
    text:
      es: "La titulación y los demás requisitos generales de acceso al Cuerpo o Escala en que aspiran a ingresar."
  - id: c
    text:
      es: "Un grado personal consolidado igual o superior al nivel mínimo del intervalo del Cuerpo de destino."
  - id: d
    text:
      es: "La titulación del Cuerpo de destino, sin que se les exija ningún otro requisito general de acceso."
  explanation:
    es: "El artículo 76 exige «poseer la titulación y el resto de los requisitos establecidos con carácter general para el acceso al Cuerpo o Escala en el que aspiran a ingresar». La referencia es el Cuerpo de destino, no el de origen. No se exige grado consolidado. Además de la titulación se piden los demás requisitos generales."
  citation: "art. 76 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q258
  prompt:
    es: "De acuerdo con el artículo 54.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las órdenes de los superiores que constituyan una infracción manifiesta del ordenamiento jurídico se pondrán inmediatamente en conocimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "De los órganos de inspección procedentes."
  - id: b
    text:
      es: "Del Defensor del Pueblo o de la institución autonómica análoga."
  - id: c
    text:
      es: "Del superior jerárquico de quien dictó la orden."
  - id: d
    text:
      es: "De la junta de personal de su centro de trabajo."
  explanation:
    es: "El artículo 54.3 dice que esas órdenes se pondrán «inmediatamente en conocimiento de los órganos de inspección procedentes». El precepto no menciona al Defensor del Pueblo, al superior de quien dictó la orden ni a la junta de personal."
  citation: "art. 54.3 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q259
  prompt:
    es: "Un funcionario con grado 16 consolidado ocupó un puesto de nivel 18 durante dieciocho meses, hasta el 28 de febrero de 2027, cuando pasó a excedencia voluntaria por interés particular. Reingresó el lunes 3 de abril de 2028 en otro de nivel 18. ¿Cuándo cumple el tiempo del grado 18?"
  options:
  - id: a
    text:
      es: "El miércoles 3 de abril de 2030."
  - id: b
    correct: true
    text:
      es: "El miércoles 3 de octubre de 2029."
  - id: c
    text:
      es: "El jueves 3 de abril de 2031."
  - id: d
    text:
      es: "El martes 3 de abril de 2029."
  explanation:
    es: "El puesto de nivel 18 supera el grado 16 en dos niveles, no en más de dos, así que rige la regla general del artículo 70.2 del Real Decreto 364/1995: «dos años continuados o tres con interrupción». Antes de la excedencia acumuló dieciocho meses (del 1 de septiembre de 2025 al 28 de febrero de 2027). Para llegar a tres años con interrupción le faltan dieciocho meses: contados de fecha a fecha desde el lunes 3 de abril de 2028, se cumplen el miércoles 3 de octubre de 2029. Dos años continuados desde el reingreso llegarían más tarde, el miércoles 3 de abril de 2030. El jueves 3 de abril de 2031 desprecia el tiempo anterior a la excedencia. El martes 3 de abril de 2029 solo da treinta meses en total."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q260
  prompt:
    es: "Según el Real Decreto-ley 6/2023, de 19 de diciembre, hasta que se apruebe la normativa reglamentaria, el intervalo de niveles del Subgrupo A2 es:"
  options:
  - id: a
    text:
      es: "Del nivel 18 al nivel 24."
  - id: b
    text:
      es: "Del nivel 20 al nivel 28."
  - id: c
    text:
      es: "Del nivel 22 al nivel 26."
  - id: d
    correct: true
    text:
      es: "Del nivel 20 al nivel 26."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo A2 el nivel mínimo 20 y el máximo 26. Del 18 al 24 es el Grupo B. El 28 como máximo y el 22 como mínimo no aparecen en la tabla."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-dt-sexta
- id: m04-l05-q261
  prompt:
    es: "Un funcionario del Cuerpo General Administrativo pertenece al Subgrupo C1. Según el Real Decreto-ley 6/2023, de 19 de diciembre, hasta que se apruebe la normativa reglamentaria, ¿cuál es el nivel máximo del intervalo de su Subgrupo?"
  options:
  - id: a
    text:
      es: "El nivel 18."
  - id: b
    text:
      es: "El nivel 20."
  - id: c
    correct: true
    text:
      es: "El nivel 22."
  - id: d
    text:
      es: "El nivel 24."
  explanation:
    es: "La disposición transitoria sexta fija para el Subgrupo C1 un intervalo del nivel 16 al 22, así que el máximo es el 22. El 18 es el máximo del Subgrupo C2, el 24 el del Grupo B y el 20 es el mínimo del Subgrupo A2."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
