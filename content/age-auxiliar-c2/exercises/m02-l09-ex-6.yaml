- id: m02-l09-q094
  prompt:
    es: "En una hoja de Excel 365, A2 contiene el valor 50. ¿Qué muestra la celda que contiene =NO(A2>100)?"
  options:
  - id: a
    text:
      es: "FALSO"
  - id: b
    correct: true
    text:
      es: "VERDADERO"
  - id: c
    text:
      es: "50"
  - id: d
    text:
      es: "100"
  explanation:
    es: "A2>100 es FALSO, y si el valor lógico es FALSO, NO devuelve VERDADERO. FALSO sería el resultado sin invertir; 50 y 100 son valores de entrada, no un resultado lógico."
