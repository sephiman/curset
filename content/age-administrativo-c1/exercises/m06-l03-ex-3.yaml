# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q061
  prompt:
    es: "En el Explorador de archivos de Windows 11, según la tabla de métodos abreviados de Microsoft, arrastrar un archivo con el ratón manteniendo pulsada la tecla Ctrl:"
  options:
  - id: a
    text:
      es: "Cambia el tamaño de los iconos de los archivos."
  - id: b
    text:
      es: "Mueve el archivo a la ubicación donde se suelta."
  - id: c
    correct: true
    text:
      es: "Crea una copia del archivo donde se suelta."
  - id: d
    text:
      es: "Selecciona varios archivos de la ventana a la vez."
  explanation:
    es: "La tabla asigna a Ctrl y arrastrar un archivo: «Cuando suelte el archivo, cree una copia en esa ubicación». Moverlo es arrastrar con Mayús; seleccionar varios elementos se hace con Mayús y las teclas de dirección, y el tamaño de los iconos cambia con Ctrl y la rueda del ratón, no arrastrando."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
