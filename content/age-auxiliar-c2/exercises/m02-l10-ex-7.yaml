- id: m02-l10-q224
  prompt:
    es: "En Access 365, ¿con qué frecuencia aparece la sección Detalle de un informe cuando este se imprime o se ve en vista previa?"
  options:
  - id: a
    text:
      es: "Una vez al inicio de cada página"
  - id: b
    text:
      es: "Una vez al final de cada grupo de registros"
  - id: c
    text:
      es: "Una sola vez, al final del informe"
  - id: d
    correct: true
    text:
      es: "Una vez por cada fila del origen de registros"
  explanation:
    es: "La ayuda dice de Detalle: «Aparece una vez por cada fila del origen de registros». «Una vez al inicio de cada página» es lo que hace el encabezado de página: «Al principio de cada página». «Una vez al final de cada grupo» es lo que hace el pie del grupo: «Al final de cada grupo de registros». «Una sola vez, al final del informe» es lo que hace el pie del informe."
