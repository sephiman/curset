# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0108
  prompt:
    es: "¿Cuál es la base de la sanción en la infracción de dejar de ingresar la deuda tributaria que debiera resultar de una autoliquidación, de acuerdo con el artículo 191.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La cuantía no ingresada en la autoliquidación como consecuencia de la comisión de la infracción."
  - id: b
    text:
      es: "La diferencia entre la cuantía ingresada en la autoliquidación y la cuantía ingresada en el período anterior."
  - id: c
    text:
      es: "La deuda tributaria total resultante de la regularización, incluidos los intereses de demora y los recargos."
  - id: d
    text:
      es: "La cuota íntegra del tributo en el período impositivo al que se refiera la autoliquidación presentada."
  explanation:
    es: "El artículo 191.1 LGT fija como base de la sanción la cuantía no ingresada en la autoliquidación por la comisión de la infracción. No se toma la cuota íntegra ni la deuda con intereses y recargos, ni una diferencia con el período anterior."
  citation: "art. 191.1 LGT"
  difficulty: 2
  tags:
  - "base"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0109
  prompt:
    es: "Según el artículo 191.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la infracción por dejar de ingresar la deuda tributaria que debiera resultar de una autoliquidación:"
  options:
  - id: a
    text:
      es: "Constituye infracción dejar de ingresar dentro del plazo la deuda, aunque se regularice con arreglo al artículo 27."
  - id: b
    text:
      es: "Constituye infracción dejar de ingresar dentro del plazo la deuda, salvo que se regularice con arreglo al artículo 62."
  - id: c
    text:
      es: "Constituye infracción dejar de ingresar dentro del plazo la totalidad de la deuda, pero no una parte de ella."
  - id: d
    correct: true
    text:
      es: "Constituye infracción dejar de ingresar dentro del plazo la totalidad o parte de la deuda, salvo que se regularice con arreglo al artículo 27."
  explanation:
    es: "El artículo 191.1 LGT alcanza a la totalidad o a una parte de la deuda que debiera resultar de la autoliquidación correcta, y excluye los casos en que se regulariza con arreglo al artículo 27 (recargos por declaración extemporánea). No se limita a la deuda completa, la regularización del artículo 27 sí excluye la infracción, y el artículo 62 regula plazos de pago, no la regularización voluntaria."
  citation: "art. 191.1 LGT"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0111
  prompt:
    es: "De acuerdo con el artículo 191.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción por dejar de ingresar la deuda tributaria que debiera resultar de una autoliquidación es leve cuando la base de la sanción sea inferior o igual a:"
  options:
  - id: a
    text:
      es: "3.000 euros o, siendo superior, no existan medios fraudulentos."
  - id: b
    text:
      es: "3.000 euros, cualquiera que sea la ocultación que concurra."
  - id: c
    text:
      es: "6.000 euros o, siendo superior, no exista ocultación."
  - id: d
    correct: true
    text:
      es: "3.000 euros o, siendo superior, no exista ocultación."
  explanation:
    es: "El artículo 191.2 LGT califica de leve la infracción si la base no pasa de 3.000 euros o, aun pasando, no hay ocultación. No se fija en 6.000 euros, no se ignora la ocultación y el límite no depende de que haya medios fraudulentos, que determinan la calificación de muy grave."
  citation: "art. 191.2 LGT"
  difficulty: 1
  tags:
  - "importe"
  - "calificación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0112
  prompt:
    es: "Joaquín Rey dejó de ingresar 2.500 euros en una autoliquidación de 2025 sin que concurra ocultación ni otra circunstancia que impida calificar la infracción de leve. No hay reducciones ni criterios de graduación. Según el artículo 191.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué sanción procede?"
  options:
  - id: a
    correct: true
    text:
      es: "1.250 euros, el 50 por ciento de la base de la sanción."
  - id: b
    text:
      es: "2.500 euros, la totalidad de la base de la sanción."
  - id: c
    text:
      es: "625 euros, el 25 por ciento de la base de la sanción."
  - id: d
    text:
      es: "3.750 euros, el 150 por ciento de la base de la sanción."
  explanation:
    es: "La infracción es leve, porque la base de 2.500 euros no supera los 3.000. El artículo 191.2 LGT la sanciona con una multa proporcional del 50 por ciento: 2.500 × 0,50 = 1.250 euros. El 25 por ciento no es un porcentaje de este artículo, la totalidad de la base ignora la multa proporcional y el 150 por ciento es el máximo de la infracción muy grave."
  citation: "art. 191.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0113
  prompt:
    es: "De acuerdo con el artículo 191.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción no será leve, cualquiera que sea la cuantía de la base de la sanción, cuando:"
  options:
  - id: a
    text:
      es: "La base de la sanción supere los 3.000 euros, aunque no exista ocultación de datos a la Administración."
  - id: b
    text:
      es: "Se haya presentado la autoliquidación con retraso, sin requerimiento previo de la Administración tributaria."
  - id: c
    correct: true
    text:
      es: "Se hayan dejado de ingresar cantidades retenidas o que se hubieran debido retener, o ingresos a cuenta."
  - id: d
    text:
      es: "La incidencia de la llevanza incorrecta de los libros o registros sea inferior al 10 por ciento de la base."
  explanation:
    es: "El artículo 191.2.c LGT excluye la calificación de leve cuando se han dejado de ingresar cantidades retenidas o ingresos a cuenta. La presentación tardía, una llevanza incorrecta de libros por debajo del 10 por ciento o una base superior a 3.000 euros sin ocultación no impiden que la infracción sea leve."
  citation: "art. 191.2 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0114
  prompt:
    es: "¿Cuál de las siguientes circunstancias hace que la infracción del artículo 191 de la Ley 58/2003, de 17 de diciembre, General Tributaria sea grave, cualquiera que sea la cuantía de la base de la sanción, según el artículo 191.3?"
  options:
  - id: a
    text:
      es: "Que las retenciones practicadas y no ingresadas representen más del 50 por ciento del importe de la base de la sanción."
  - id: b
    correct: true
    text:
      es: "Que la incidencia de la llevanza incorrecta de libros o registros sea superior al 10 por ciento e inferior o igual al 50 por ciento de la base."
  - id: c
    text:
      es: "Que la incidencia de la llevanza incorrecta de libros o registros sea superior al 50 por ciento de la base de la sanción."
  - id: d
    text:
      es: "Que la incidencia de la llevanza incorrecta de libros o registros sea inferior o igual al 10 por ciento de la base."
  explanation:
    es: "El artículo 191.3.b LGT hace grave la infracción si la llevanza incorrecta de libros afecta a más del 10 y no más del 50 por ciento de la base. Por encima del 50 por ciento hay anomalía sustancial y, con ella, medios fraudulentos: infracción muy grave. Las retenciones no ingresadas por encima del 50 por ciento son muy graves (artículo 191.4). Por debajo del 10 por ciento no es una causa que impida la calificación de leve."
  citation: "art. 191.3 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0115
  prompt:
    es: "De acuerdo con el artículo 191.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción por infracción grave consistirá en una multa pecuniaria proporcional:"
  options:
  - id: a
    text:
      es: "Del 100 al 150 por ciento."
  - id: b
    correct: true
    text:
      es: "Del 50 al 100 por ciento."
  - id: c
    text:
      es: "Del 15 al 50 por ciento."
  - id: d
    text:
      es: "Del 50 al 150 por ciento."
  explanation:
    es: "La infracción grave del artículo 191.3 LGT se sanciona con una multa proporcional del 50 al 100 por ciento. El tramo del 100 al 150 por ciento es el de la muy grave (artículo 191.4). Los otros dos rangos no existen en el artículo."
  citation: "art. 191.3 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0116
  prompt:
    es: "Conforme al artículo 191.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la graduación de la multa por infracción grave de dejar de ingresar la deuda de una autoliquidación:"
  options:
  - id: a
    text:
      es: "No se gradúa, porque el artículo 191.3 fija un porcentaje único para todas las infracciones graves."
  - id: b
    text:
      es: "Se incrementa el porcentaje mínimo según la comisión repetida, el perjuicio económico y la facturación, con los incrementos de los párrafos a), b) y c) del artículo 187.1."
  - id: c
    correct: true
    text:
      es: "Se incrementa el porcentaje mínimo según la comisión repetida y el perjuicio económico, con los incrementos de los párrafos a) y b) del artículo 187.1."
  - id: d
    text:
      es: "Se incrementa el porcentaje máximo según la comisión repetida y el perjuicio económico, con los incrementos del artículo 187.1."
  explanation:
    es: "El artículo 191.3 LGT gradúa la multa del 50 al 100 por ciento incrementando el mínimo por comisión repetida y perjuicio económico, con los incrementos de los párrafos a) y b) del artículo 187.1. El criterio de facturación no está en la remisión. El incremento se suma al mínimo, no al máximo, y la multa sí se gradúa porque va por tramos."
  citation: "art. 191.3 LGT"
  difficulty: 3
  tags:
  - "graduación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0117
  prompt:
    es: "De acuerdo con el artículo 191.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la infracción por dejar de ingresar la deuda tributaria que debiera resultar de una autoliquidación es muy grave cuando:"
  options:
  - id: a
    text:
      es: "Se hayan utilizado facturas falsas, sin que ello constituya medio fraudulento."
  - id: b
    text:
      es: "Se haya producido ocultación, siempre que la base supere los 3.000 euros."
  - id: c
    correct: true
    text:
      es: "Se hubieran utilizado medios fraudulentos."
  - id: d
    text:
      es: "Se haya dejado de ingresar una cantidad que supere los 6.000 euros."
  explanation:
    es: "Según el artículo 191.4 LGT, la utilización de medios fraudulentos determina la calificación de muy grave. La ocultación con base superior a 3.000 euros da lugar a una infracción grave, y las facturas falsas sin medio fraudulento también son graves. La cuantía por sí sola no califica la infracción como muy grave."
  citation: "art. 191.4 LGT"
  difficulty: 1
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0118
  prompt:
    es: "Según el artículo 191.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las retenciones y los ingresos a cuenta no ingresados:"
  options:
  - id: a
    correct: true
    text:
      es: "Es muy grave, aunque no se hayan usado medios fraudulentos, si lo no ingresado representa más del 50 por ciento de la base de la sanción."
  - id: b
    text:
      es: "Es grave en todo caso, cualquiera que sea el porcentaje de la base que representen las retenciones no ingresadas."
  - id: c
    text:
      es: "Es muy grave solo si, además de superar el 50 por ciento de la base, se han usado medios fraudulentos."
  - id: d
    text:
      es: "Es muy grave, aunque no se hayan usado medios fraudulentos, si lo no ingresado representa el 50 por ciento o más de la base de la sanción."
  explanation:
    es: "El artículo 191.4 LGT considera muy grave la infracción cuando las retenciones y los ingresos a cuenta no ingresados suponen más del 50 por ciento de la base, aunque no haya medios fraudulentos. El 50 por ciento exacto no basta: en ese caso la infracción es grave, según el artículo 191.3.c. Tampoco se exige fraude, y sobre el 50 por ciento no es solo grave."
  citation: "art. 191.4 LGT"
  difficulty: 3
  tags:
  - "porcentaje"
  - "condición"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0119
  prompt:
    es: "De acuerdo con el artículo 191.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción por infracción muy grave consistirá en una multa pecuniaria proporcional del 100 al 150 por ciento, que se gradúa:"
  options:
  - id: a
    text:
      es: "Incrementando el porcentaje mínimo conforme a la comisión repetida y al perjuicio económico, con incrementos duplicados respecto de los de la grave."
  - id: b
    text:
      es: "Incrementando el porcentaje mínimo conforme a los cuatro criterios del artículo 187.1, sin que se limite al perjuicio económico."
  - id: c
    correct: true
    text:
      es: "Incrementando el porcentaje mínimo conforme a la comisión repetida y al perjuicio económico, con los mismos incrementos que la infracción grave."
  - id: d
    text:
      es: "Reduciendo el porcentaje máximo conforme a la comisión repetida y al perjuicio económico, con las reducciones del artículo 188."
  explanation:
    es: "El artículo 191.4 LGT gradúa la multa muy grave con los mismos criterios e incrementos que la grave: comisión repetida y perjuicio económico, de los párrafos a) y b) del artículo 187.1. No hay incrementos duplicados, no se parte del máximo y los criterios de facturación y conformidad no forman parte de esa remisión."
  citation: "art. 191.4 LGT"
  difficulty: 3
  tags:
  - "graduación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0120
  prompt:
    es: "Según el artículo 191.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando el obligado hubiera obtenido indebidamente una devolución y procediera una sanción del artículo 191, ¿cómo se entiende que es la cuantía no ingresada?"
  options:
  - id: a
    text:
      es: "La diferencia entre la devolución obtenida y la que hubiera correspondido, sin adicionar cuantía alguna."
  - id: b
    text:
      es: "La cuantía total que hubiera debido ingresarse en la autoliquidación, sin tener en cuenta la devolución."
  - id: c
    correct: true
    text:
      es: "El resultado de adicionar al importe de la devolución obtenida indebidamente la cuantía total que hubiera debido ingresarse en la autoliquidación."
  - id: d
    text:
      es: "El importe de la devolución obtenida indebidamente, sin añadir la cuantía que debió ingresarse."
  explanation:
    es: "El artículo 191.5 LGT suma la devolución obtenida indebidamente y la cuantía total que debió ingresarse en la autoliquidación. Considerar solo la diferencia, solo la devolución o solo la cuantía que debió ingresarse no recoge la regla."
  citation: "art. 191.5 LGT"
  difficulty: 3
  tags:
  - "base"
  - "cómputo"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0121
  prompt:
    es: "En los supuestos del artículo 191.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué porcentaje se entiende que alcanza el perjuicio económico para la Hacienda Pública?"
  options:
  - id: a
    text:
      es: "El que resulte de dividir la devolución por la cuantía total que debió ingresarse."
  - id: b
    correct: true
    text:
      es: "El cien por cien."
  - id: c
    text:
      es: "El que resulte de dividir la base por la devolución inicialmente obtenida."
  - id: d
    text:
      es: "El setenta y cinco por ciento, que es el umbral del último tramo."
  explanation:
    es: "El artículo 191.5 LGT presume que, cuando se obtiene indebidamente una devolución y procede sanción por el artículo 191, el perjuicio económico es del 100 por ciento. No se calcula con las fórmulas del artículo 187.1.b, y el tramo del 75 por ciento es solo el umbral de la franja superior a 75."
  citation: "art. 191.5 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
  - "perjuicio económico"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0122
  prompt:
    es: "Cuando se sanciona la infracción del artículo 191 de la Ley 58/2003, de 17 de diciembre, General Tributaria por haber obtenido indebidamente una devolución, ¿qué ocurre, según el artículo 191.5, con la infracción de obtener indebidamente una devolución del artículo 193?"
  options:
  - id: a
    text:
      es: "Se sanciona en lugar de la del artículo 191 cuando es más grave."
  - id: b
    text:
      es: "Se sanciona solo si la devolución indebida supera los 3.000 euros."
  - id: c
    correct: true
    text:
      es: "No es sancionable en esos supuestos."
  - id: d
    text:
      es: "Se sanciona además, y ambas sanciones se acumulan."
  explanation:
    es: "El artículo 191.5 LGT dice que, en esos supuestos, no es sancionable la infracción del artículo 193 consistente en obtener indebidamente una devolución. Evita así sancionar dos veces. Por eso no se acumulan, no depende de una cuantía de 3.000 euros ni sustituye a la sanción del artículo 191."
  citation: "art. 191.5 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0123
  prompt:
    es: "Conforme al artículo 191.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la falta de ingreso en plazo de tributos o pagos a cuenta incluidos por el mismo obligado en una autoliquidación presentada con posterioridad sin cumplir los requisitos del artículo 27.4:"
  options:
  - id: a
    text:
      es: "Constituye infracción grave si la base de la sanción supera los 3.000 euros."
  - id: b
    text:
      es: "No constituye infracción, porque se regulariza por el obligado antes de cualquier requerimiento."
  - id: c
    correct: true
    text:
      es: "Siempre constituye infracción leve."
  - id: d
    text:
      es: "Constituye infracción leve solo si el obligado ingresa además el recargo del artículo 27.2."
  explanation:
    es: "El artículo 191.6 LGT dice que esa falta de ingreso siempre es infracción leve, con independencia de la cuantía de la base. No pasa a grave por superar los 3.000 euros, sí es infracción y no depende de que se ingrese el recargo, ya que precisamente no se cumplen los requisitos del artículo 27.4."
  citation: "art. 191.6 LGT"
  difficulty: 1
  tags:
  - "calificación"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0124
  prompt:
    es: "¿En cuál de los siguientes casos queda excluida la regla del artículo 191.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, según la cual siempre es leve la falta de ingreso incluida después en una autoliquidación presentada sin cumplir los requisitos del artículo 27.4?"
  options:
  - id: a
    text:
      es: "Cuando la autoliquidación la presente un obligado que ya hubiera sido sancionado en los cuatro años anteriores."
  - id: b
    text:
      es: "Cuando la autoliquidación incluya una cuantía superior a 3.000 euros, ya que entonces hay ocultación."
  - id: c
    text:
      es: "Cuando la autoliquidación se presente transcurridos más de seis meses desde el fin del plazo de ingreso."
  - id: d
    correct: true
    text:
      es: "Cuando la autoliquidación incluya ingresos correspondientes a conceptos y períodos respecto de los que se hubiera notificado antes un requerimiento."
  explanation:
    es: "El artículo 191.6 LGT excluye su regla cuando la autoliquidación incluye ingresos de conceptos y períodos sobre los que se había notificado un requerimiento. El retraso de seis meses, la cuantía superior a 3.000 euros o una sanción anterior no están entre las excepciones del precepto."
  citation: "art. 191.6 LGT"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-23186-art-192
- id: m03-l13-q0126
  prompt:
    es: "¿Cuál es la base de la sanción en la infracción de incumplir la obligación de presentar de forma completa y correcta declaraciones o documentos necesarios para practicar liquidaciones, según el artículo 192.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando no se hubiera presentado declaración?"
  options:
  - id: a
    text:
      es: "La cuantía no ingresada en la autoliquidación que debió presentarse."
  - id: b
    text:
      es: "La cuantía ingresada por el obligado en el período anterior."
  - id: c
    correct: true
    text:
      es: "La cuantía de la liquidación que se practique."
  - id: d
    text:
      es: "La cuantía de la cuota íntegra, sin descontar los pagos a cuenta."
  explanation:
    es: "Si no se presentó la declaración, el artículo 192.1 LGT toma como base la cuantía de la liquidación. Si se presentó con datos incorrectos, es la diferencia entre la liquidación adecuada y la que resultaría de lo declarado. La cuantía no ingresada en la autoliquidación es la base del artículo 191, que afecta a los tributos que se autoliquidan."
  citation: "art. 192.1 LGT"
  difficulty: 1
  tags:
  - "base"
# anchor: boe-a-2003-23186-art-192
- id: m03-l13-q0127
  prompt:
    es: "Según el artículo 192.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la infracción de incumplir la obligación de presentar de forma completa y correcta las declaraciones o documentos necesarios para practicar liquidaciones:"
  options:
  - id: a
    text:
      es: "Se refiere solo a los tributos aduaneros, que se liquidan siempre por la Administración."
  - id: b
    text:
      es: "Se refiere a los tributos que se exigen por el procedimiento de autoliquidación."
  - id: c
    text:
      es: "Se refiere a todos los tributos, aunque se regularice con arreglo al artículo 27."
  - id: d
    correct: true
    text:
      es: "Se refiere a los tributos que no se exigen por el procedimiento de autoliquidación."
  explanation:
    es: "El artículo 192.1 LGT alcanza a la adecuada liquidación de los tributos que no se exigen por autoliquidación; los que sí se autoliquidan quedan en el artículo 191. Excluye los casos regularizados con arreglo al artículo 27, y no se limita a los tributos aduaneros, que solo se mencionan a propósito de ciertas declaraciones."
  citation: "art. 192.1 LGT"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-23186-art-192
- id: m03-l13-q0128
  prompt:
    es: "¿Cuál de las siguientes sanciones corresponde, según el artículo 192.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a la infracción muy grave por incumplir la obligación de presentar de forma completa y correcta declaraciones o documentos necesarios para practicar liquidaciones?"
  options:
  - id: a
    text:
      es: "Multa pecuniaria proporcional del 50 por ciento, sin incremento por comisión repetida ni perjuicio."
  - id: b
    text:
      es: "Multa pecuniaria proporcional del 50 al 100 por ciento, con los incrementos del artículo 187.1.a y b."
  - id: c
    correct: true
    text:
      es: "Multa pecuniaria proporcional del 100 al 150 por ciento, con los incrementos del artículo 187.1.a y b."
  - id: d
    text:
      es: "Multa pecuniaria fija de 300 euros, con los incrementos del artículo 187.1.a y b."
  explanation:
    es: "La infracción muy grave del artículo 192.4 LGT se sanciona con una multa proporcional del 100 al 150 por ciento, y se incrementa el mínimo con los criterios del artículo 187.1.a y b. El tramo del 50 al 100 es el de la infracción grave, el 50 por ciento el de la leve y los 300 euros fijos son la sanción del artículo 194.2."
