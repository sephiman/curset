# anchor: boe-a-2017-12902-art-100
- id: q27
  lesson: m05-l03
  prompt:
    es: "Según el artículo 100.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es el límite máximo de gasto que, en virtud del contrato de obras de la escollera, puede comprometer el órgano de contratación?"
  options:
  - id: a
    text:
      es: "1.080.000 euros, el precio de adjudicación sin incluir el IVA."
  - id: b
    text:
      es: "1.200.000 euros, el presupuesto base de licitación sin incluir el IVA."
  - id: c
    text:
      es: "1.306.800 euros, el precio de adjudicación incluido el IVA."
  - id: d
    correct: true
    text:
      es: "1.452.000 euros, el presupuesto base de licitación incluido el IVA."
  explanation:
    es: "El presupuesto base de licitación es el límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el IVA (art. 100.1 LCSP): 1.200.000 euros más el 21 % (252.000 euros) suman 1.452.000 euros. La opción de 1.200.000 euros deja fuera el IVA. La de 1.306.800 euros aplica el IVA al precio de adjudicación, que no es el presupuesto base. La de 1.080.000 euros combina ambos errores."
  citation: "art. 100.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2017-12902-art-193
- id: q28
  lesson: m03-l04
  prompt:
    es: "Si la Administración opta por imponer penalidades diarias por la demora en la entrega de la obra de la escollera, ¿cuánto suman conforme a la proporción del artículo 193.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "16.848 euros, a razón de 648 euros por cada día de demora."
  - id: b
    text:
      es: "17.496 euros, a razón de 648 euros por cada día de demora."
  - id: c
    text:
      es: "18.720 euros, a razón de 720 euros por cada día de demora."
  - id: d
    text:
      es: "20.386,08 euros, a razón de 784,08 euros por cada día de demora."
  explanation:
    es: "La penalidad diaria es de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido (art. 193.3 LCSP): 1.080.000 euros son 1.080 millares, que a 0,60 euros dan 648 euros al día, y por 26 días suman 16.848 euros. La opción de 17.496 euros cuenta 27 días. La de 18.720 euros parte del presupuesto base de licitación en lugar del precio de adjudicación. La de 20.386,08 euros parte del precio con IVA."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-103
- id: q29
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 103.5 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿puede la empresa adjudicataria exigir la revisión de precios del contrato de obras de la escollera cuando entrega la obra, el miércoles, 9 de febrero de 2028?"
  options:
  - id: a
    text:
      es: "Sí, porque en los contratos de obras basta con haber ejecutado el 20 por ciento de su importe total."
  - id: b
    text:
      es: "No, porque en los contratos de obras no cabe la revisión de precios, aunque el pliego la prevea."
  - id: c
    correct: true
    text:
      es: "No, porque no ha pasado un año desde la formalización, aunque se haya ejecutado más del 20 por ciento."
  - id: d
    text:
      es: "Sí, porque transcurridos seis meses desde la formalización cabe la revisión en cualquier contrato de obras."
  explanation:
    es: "La revisión procede cuando el contrato se ha ejecutado al menos en el 20 por ciento de su importe y ha transcurrido un año desde su formalización (art. 103.5 LCSP). El contrato se formalizó el lunes 2 de agosto de 2027, así que el año se cumple el miércoles 2 de agosto de 2028, posterior a la entrega del miércoles 9 de febrero de 2028. La opción que exige solo el 20 por ciento omite el requisito del año. La que niega la revisión en obras contradice el artículo 103.2, que la admite. La de los seis meses inventa un plazo que la ley no fija."
  citation: "art. 103.5 LCSP"
  difficulty: 3
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2017-12902-art-159
- id: q44
  lesson: m03-l04
  prompt:
    es: "Según el artículo 159.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es la fecha más temprana en que puede terminar el plazo de proposiciones de la reparación de la escollera, si su anuncio se publica el miércoles, 14 de abril de 2027?"
  options:
  - id: a
    text:
      es: "Lunes, 3 de mayo de 2027."
  - id: b
    correct: true
    text:
      es: "Martes, 4 de mayo de 2027."
  - id: c
    text:
      es: "Jueves, 29 de abril de 2027."
  - id: d
    text:
      es: "Miércoles, 12 de mayo de 2027."
  explanation:
    es: "En el abierto simplificado el plazo de proposiciones no es inferior a quince días desde el siguiente a la publicación del anuncio, y en los contratos de obras es de veinte como mínimo (art. 159.3 LCSP). Son días naturales, porque la ley no dice hábiles (disposición adicional duodécima LCSP). Desde el jueves 15 de abril, el vigésimo día natural es el martes 4 de mayo de 2027, día hábil. La fecha del jueves 29 de abril aplica los quince días de los contratos que no son de obras. La del lunes 3 de mayo cuenta como primer día el de la publicación. La del miércoles 12 de mayo cuenta veinte días hábiles."
  citation: "art. 159.3 LCSP"
  difficulty: 1
  tags:
  - "plazo"
