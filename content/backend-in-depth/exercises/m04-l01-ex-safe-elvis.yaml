variants:
- id: m04-l01-v-kotlin-safe-elvis-001
  prompt:
    en: |-
      What does this program print? The type of `users` is `Map<String, String?>`, so a lookup can give null.

      ```kotlin
      fun fallback(): String {
          println("fallback")
          return "guest"
      }

      fun main() {
          val users: Map<String, String?> = mapOf("ann" to "Ann Lee", "bo" to null, "cy" to "Cy Wu")
          val name: String? = users["ann"]
          println(name?.uppercase() ?: fallback())
      }
      ```
  options:
  - id: a
    text:
      en: '`ANN LEE`'
    correct: true
  - id: b
    text:
      en: '`Ann Lee`'
  - id: c
    text:
      en: '`fallback`, `ANN LEE`'
  - id: d
    text:
      en: '`fallback`, `guest`'
  explanation:
    en: '`name` is `users["ann"]`. The map holds `Ann Lee` under `ann`, so `name` is not null: the safe call produces a value
      and the right-hand side of `?:` is not evaluated, so `fallback()` prints nothing. The program prints `ANN LEE`. `Ann
      Lee` comes from this mistake: skipping the operation on the present value. When `name` is not null the safe call applies
      `uppercase()` to it before the Elvis operator returns it. `fallback`, `ANN LEE` comes from this mistake: calling the
      fallback before using the value. The right-hand side of `?:` is evaluated only if the left-hand side is null, so `fallback()`
      does not run for a present value. `fallback`, `guest` comes from this mistake: always taking the right-hand side. The
      Elvis operator returns its left-hand side whenever that is not null.'
  family: kotlin-safe-elvis
  code_reading: true
  citation: kotlin-docs-null-safety#elvis-operator
  difficulty: 2
  tags: &id001
  - kotlin
  - null-safety
