# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q047
  prompt:
    es: "En Outlook clásico, al compartir una carpeta, ¿cuál de los siguientes es el nivel de permisos con los mínimos derechos en la escala que desciende desde Propietario?"
  options:
  - id: a
    text:
      es: "Autor no editor"
  - id: b
    correct: true
    text:
      es: "Colaborador"
  - id: c
    text:
      es: "Autor"
  - id: d
    text:
      es: "Editor de publicación"
  explanation:
    es: "La página dice que en Outlook clásico los permisos descienden de Propietario, con todos los derechos, hasta Colaborador, con los mínimos derechos. Autor y Autor no editor pueden además leer elementos y gestionar los suyos. Editor de publicación está en lo alto de la escala: crea, lee, modifica y elimina todo y crea subcarpetas."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Propietario de una carpeta o buzón: Conceder permisos a una carpeta»"
