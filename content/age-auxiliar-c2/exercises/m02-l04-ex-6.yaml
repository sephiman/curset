  prompt:
    es: "Según la Orden HAP/1949/2014, de 13 de octubre, por la que se regula el Punto de Acceso General de la Administración General del Estado y se crea su sede electrónica, ¿con qué dominios ofrece el PAG la información a los ciudadanos y empresas?"
