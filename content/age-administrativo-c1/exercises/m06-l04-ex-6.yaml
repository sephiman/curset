      es: "Alt, N"
  - id: c
    text:
      es: "Alt, Z, A"
  - id: d
    correct: true
    text:
      es: "Alt, F"
  explanation:
    es: "La tabla de teclas de acceso dice: «Abrir la página Archivo para usar la vista Backstage. Alt, F». Alt, H abre la pestaña Inicio. Alt, N abre la pestaña Insertar. Alt, Z, A activa o desactiva Autoguardado."
