- id: m03-l05-q0161
  prompt:
    es: "Una empresa solicita en plazo la ampliación de un plazo de 20 días para atender un requerimiento. Cumple los requisitos y la Administración no responde ni notifica denegación alguna antes de que termine el plazo inicial. Según el artículo 91.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿qué ocurre?"
  options:
  - id: a
    correct: true
    text:
      es: "Se entiende automáticamente concedida la ampliación por la mitad del plazo inicial, es decir, 10 días."
  - id: b
    text:
      es: "Se entiende denegada por silencio y el plazo inicial no se amplía."
  - id: c
    text:
      es: "Se entiende concedida por un plazo igual al inicial, es decir, 20 días."
  - id: d
    text:
