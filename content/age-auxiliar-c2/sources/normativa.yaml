# Normativa del programa: Cuerpo General Auxiliar de la AGE, ingreso libre.
# Fuente del programa: Resolución de 18-12-2025 (BOE-A-2025-26262), Anexo I, punto 3 (28 temas: I 1–16, II 1–12).
# Norma común 11.1: rige la legislación vigente a la fecha de cada ejercicio.
# Construido: 2026-11-05 (ronda R0a del curso age-auxiliar-c2), a partir de content/age-administrativo-c1/sources/normativa.yaml
# (construido 2026-10-16) y de las normas citadas en los ocho cuestionarios del Auxiliar (2020–2025).
# Verificación: la página https://www.boe.es/buscar/act.php?id=<ID> («Última actualización publicada el») leída el 2026-11-05
# para cada norma con boe_id, y la API de datos abiertos del BOE (legislacion-consolidada/id/<ID>/metadatos y /analisis).
# Normas de la UE: no se reverificaron; se toman de C1 (SPARQL de la Oficina de Publicaciones, 2026-10-16/18).
#
# Campos: los mismos que en C1 (véase la cabecera de su normativa.yaml), con estas diferencias:
#   temas               temas del programa del Auxiliar (I.1–I.16, II.1–II.12)
#   consolidated_as_of  «Última actualización publicada el» en boe.es el 2026-11-05; sin esa línea (norma nunca
#                       modificada), la fecha de publicación
#   origen              «copiado de age-administrativo-c1»: el fichero se copió del curso C1 con el mismo nombre y se
#                       comprobó que el sha256 es el mismo; «descarga nueva»: C1 no lo tiene o boe.es tiene una
#                       consolidación posterior a la copia de C1
#   cambios_pendientes  solo modificaciones con efectos posteriores al 2026-11-05.
#   cambios_aplicados   (ronda R1, 2026-11-06, como la auditoría de vigencia de C1 del 2026-11-05) los cambios cuya entrada
#                       en vigor ya pasó, con los mismos campos que cambios_pendientes; el texto citado es ya el vigente.
#                       Hoy: la Ley 4/2026 (en vigor el 23-10-2026) en las seis normas que modifica.
# Normas de C1 que no entran: las de temas del Administrativo que el programa del Auxiliar no tiene (contratos,
# subvenciones, gestión financiera salvo el presupuesto, personal laboral, incompatibilidades, control del gasto).
# Normas que los cuestionarios citan y que no entran por derogadas: LO 15/1999 y RD 1720/2007 (conv2020 extr. P1 18),
# Ley 51/2003 (conv2024 P2 3, solo como referencia histórica en el enunciado). «Real Decreto 203/2023» (conv2022 P2 9)
# es una errata del cuestionario por el RD 203/2021.

# ======================================================================
# Bloque I. Organización pública
# ======================================================================

