# anchor: boe-a-2003-21614-art-41
- id: m01-l15-q174
  prompt:
    es: "Señale qué se distingue entre los ingresos de capital en la clasificación económica de los estados de ingresos, según el artículo 41.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "Los impuestos indirectos y las transferencias de capital."
  - id: b
    text:
      es: "La enajenación de inversiones reales y los pasivos financieros."
  - id: c
    text:
      es: "Los activos financieros y los pasivos financieros."
  - id: d
    correct: true
    text:
      es: "La enajenación de inversiones reales y las transferencias de capital."
  explanation:
    es: "Entre los ingresos de capital el artículo 41.b) distingue la enajenación de inversiones reales y las transferencias de capital. Los impuestos indirectos son ingresos corrientes, y los pasivos financieros y los activos financieros pertenecen a las operaciones financieras, que son un grupo aparte de la clasificación económica."
  citation: "art. 41.b) LGP"
  difficulty: 2
  tags:
  - "lista"
  - "concepto"
# anchor: boe-a-2003-21614-art-41
- id: m01-l15-q175
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge lo que se distingue entre los ingresos corrientes, según el artículo 41.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Impuestos directos y cotizaciones sociales, impuestos indirectos, tasas, precios públicos y otros ingresos, transferencias de capital e ingresos patrimoniales."
  - id: b
    correct: true
    text:
      es: "Impuestos directos y cotizaciones sociales, impuestos indirectos, tasas, precios públicos y otros ingresos, transferencias corrientes e ingresos patrimoniales."
  - id: c
    text:
      es: "Impuestos directos y cotizaciones sociales, impuestos indirectos, tasas, precios públicos y otros ingresos, transferencias corrientes y enajenación de inversiones reales."
  - id: d
    text:
      es: "Impuestos directos y cotizaciones sociales, tasas, precios públicos y otros ingresos, transferencias corrientes, activos financieros e ingresos patrimoniales."
  explanation:
    es: "La enumeración correcta es la que el artículo 41.b) da para los ingresos corrientes, con las cinco partidas. Las otras tres cambian una partida por una ajena: las transferencias de capital y la enajenación de inversiones reales son ingresos de capital, y los activos financieros son una operación financiera."
  citation: "art. 41.b) LGP"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2003-21614-art-41
- id: m01-l15-q176
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los estados de ingresos de los presupuestos se estructuran siguiendo las clasificaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Orgánica y económica."
  - id: b
    text:
      es: "Orgánica, por programas y económica."
  - id: c
    text:
      es: "Por programas y económica."
  - id: d
    text:
      es: "Orgánica y funcional."
  explanation:
    es: "Los estados de ingresos usan solo dos clasificaciones, la orgánica y la económica. La clasificación por programas pertenece a los estados de gastos, que tienen tres clasificaciones, y la funcional no es una de las clasificaciones del artículo para los ingresos."
  citation: "art. 41 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q177
  prompt:
    es: "Conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la clasificación económica de los estados de gastos agrupa los créditos por capítulos, separando las operaciones corrientes, las de capital, las financieras y:"
  options:
  - id: a
    text:
      es: "Los créditos de los programas plurianuales."
  - id: b
    correct: true
    text:
      es: "El Fondo de Contingencia de ejecución presupuestaria."
  - id: c
    text:
      es: "Los créditos extraordinarios y los suplementos de crédito."
  - id: d
    text:
      es: "Las transferencias de crédito entre secciones."
  explanation:
    es: "Además de las tres clases de operaciones, la clasificación económica separa el Fondo de Contingencia de ejecución presupuestaria, que recoge la dotación para necesidades imprevistas. Los programas plurianuales, los créditos extraordinarios con sus suplementos y las transferencias de crédito son figuras de otros apartados, no una agrupación de la clasificación económica."
  citation: "art. 40.1.c) LGP"
  difficulty: 2
  tags:
  - "lista"
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q178
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en la clasificación económica de los estados de gastos los conceptos pueden dividirse en:"
  options:
  - id: a
    text:
      es: "Secciones."
  - id: b
    text:
      es: "Servicios."
  - id: c
    correct: true
    text:
      es: "Subconceptos."
  - id: d
    text:
      es: "Programas."
  explanation:
    es: "Los conceptos pueden dividirse en subconceptos, último escalón de la clasificación económica. Las secciones y los servicios son los grupos de la clasificación orgánica, y los programas pertenecen a la clasificación por programas."
  citation: "art. 40.1.c) LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q179
  prompt:
    es: "¿Cuál de las siguientes opciones describe cómo agrupa los créditos la clasificación orgánica de los estados de gastos, según el artículo 40.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Por capítulos y artículos, según la naturaleza económica del gasto."
  - id: b
    text:
      es: "Por programas y objetivos, según las políticas de gasto."
  - id: c
    text:
      es: "Por operaciones corrientes y de capital, según su finalidad."
  - id: d
    correct: true
    text:
      es: "Por secciones y servicios, según los centros gestores de gasto."
  explanation:
    es: "La clasificación orgánica agrupa los créditos por secciones y servicios, según los centros gestores de gasto a los que se asignan. Agrupar por capítulos y artículos corresponde a la clasificación económica, hacerlo por programas y objetivos a la clasificación por programas, y separar operaciones corrientes y de capital es también un rasgo de la económica."
  citation: "art. 40.1.a) LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-art-6
- id: m01-l15-q189
  prompt:
    es: "¿Cuál de las siguientes finalidades tienen los programas instrumentales y de gestión según la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027?"
  options:
  - id: a
    text:
      es: "Asignar objetivos cuantificables e indicadores de ejecución mensurables."
  - id: b
    text:
      es: "Elevar al acuerdo del Gobierno el anteproyecto de ley de presupuestos."
  - id: c
    correct: true
    text:
      es: "Apoyar a un programa finalista."
  - id: d
    text:
      es: "Estudiar los programas de gasto en las Comisiones de Análisis de Programas."
  explanation:
    es: "Entre las finalidades de los programas instrumentales y de gestión está el apoyo a un programa finalista. Asignar objetivos cuantificables con indicadores mensurables es lo propio de los programas finalistas, y elevar el anteproyecto y estudiar los programas de gasto son pasos de la elaboración que corresponden al Ministerio de Hacienda y a las Comisiones, no finalidades de un tipo de programa."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-41
- id: m01-l15-q194
  prompt:
    es: "¿Cuál de las siguientes parejas se distingue en las operaciones financieras de la clasificación económica de los estados de ingresos, según el artículo 41.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Enajenación de inversiones reales y activos financieros."
  - id: b
    text:
      es: "Ingresos patrimoniales y pasivos financieros."
  - id: c
    correct: true
    text:
      es: "Activos financieros y pasivos financieros."
  - id: d
    text:
      es: "Transferencias corrientes y transferencias de capital."
  explanation:
    es: "En las operaciones financieras de ingresos el artículo 41.b) distingue activos financieros y pasivos financieros. La enajenación de inversiones reales es un ingreso de capital. Los ingresos patrimoniales son un ingreso corriente. Las transferencias corrientes y las de capital se reparten entre los ingresos corrientes y los de capital, no entre las operaciones financieras."
  citation: "art. 41.b) LGP"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q038
  prompt:
    es: "¿Cuál es la secuencia de fases en que se realiza la gestión del presupuesto de gastos del Estado según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Aprobación del gasto, reconocimiento de la obligación, compromiso de gasto, ordenación del pago y pago material."
  - id: b
    text:
      es: "Compromiso de gasto, aprobación del gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  - id: c
    text:
      es: "Aprobación del gasto, compromiso de gasto, ordenación del pago, reconocimiento de la obligación y pago material."
  - id: d
    correct: true
    text:
      es: "Aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  explanation:
    es: "El artículo 73.1 enumera cinco fases en este orden: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. Las demás secuencias contienen las mismas fases con dos de ellas permutadas, y el orden lógico del gasto no lo permite."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q051
  prompt:
    es: "Según el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál es la última de las fases a través de las que se realiza la gestión del presupuesto de gastos del Estado?"
  options:
  - id: a
    text:
      es: "La ordenación del pago."
  - id: b
    correct: true
    text:
      es: "El pago material."
  - id: c
    text:
      es: "La liquidación del presupuesto."
  - id: d
    text:
      es: "El reconocimiento de la obligación."
  explanation:
    es: "El artículo 73.1 enumera las fases en este orden: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. El reconocimiento de la obligación y la ordenación del pago preceden al pago material. La liquidación del presupuesto no figura entre las fases del artículo."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q103
  prompt:
    es: "¿Cuál es el orden de las fases de la gestión del Presupuesto de gastos del Estado en la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Aprobación del gasto, compromiso de gasto, ordenación del pago, reconocimiento de la obligación y pago material."
  - id: b
    correct: true
    text:
      es: "Aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  - id: c
    text:
      es: "Aprobación del gasto, reconocimiento de la obligación, compromiso de gasto, ordenación del pago y pago material."
  - id: d
    text:
      es: "Compromiso de gasto, aprobación del gasto, reconocimiento de la obligación, ordenación del pago y pago material."
  explanation:
    es: "El artículo 73.1 enumera las fases en este orden: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. La opción que adelanta la ordenación del pago la coloca antes del reconocimiento de la obligación, que es lo que la origina. La que sitúa el reconocimiento antes del compromiso reconocería una obligación sin gasto comprometido. La que empieza por el compromiso comprometería un gasto que aún no se ha aprobado."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q104
  prompt:
    es: "¿Cómo denomina la Ley 47/2003, de 26 de noviembre, General Presupuestaria a la primera fase de la gestión del Presupuesto de gastos del Estado?"
  options:
  - id: a
    text:
      es: "Autorización del gasto, antes de su compromiso con terceros."
  - id: b
    correct: true
    text:
      es: "Aprobación del gasto, antes de su compromiso con terceros."
  - id: c
    text:
      es: "Retención de crédito, antes de la aprobación del gasto."
  - id: d
    text:
      es: "Propuesta de gasto, antes de la aprobación del crédito."
  explanation:
    es: "El artículo 73.1 dice que la gestión del Presupuesto de gastos del Estado «se realizará a través de las siguientes fases: a) Aprobación del gasto. b) Compromiso de gasto. c) Reconocimiento de la obligación. d) Ordenación del pago. e) Pago material.»; la primera es la aprobación del gasto. La autorización del gasto no es el nombre que la Ley da a esa fase: el artículo 73.2 dice: «La aprobación es el acto mediante el cual se autoriza la realización de un gasto determinado», de modo que autorizar es lo que hace la aprobación. La retención de crédito no es ninguna de las cinco fases de esa lista; la Instrucción de operatoria contable dice que se solicita «Al inicio de la tramitación de un expediente de gasto» (regla 14.1). La propuesta de gasto tampoco es ninguna de las cinco fases que enumera el artículo 73.1."
  citation: "art. 73.1 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q105
  prompt:
    es: "Además del Estado, el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria aplica la gestión del Presupuesto de gastos por fases a sus organismos autónomos y a:"
  options:
  - id: a
    text:
      es: "las sociedades mercantiles estatales y las fundaciones del sector público estatal con presupuesto estimativo."
  - id: b
    correct: true
    text:
      es: "las entidades estatales con presupuesto limitativo y las entidades gestoras y servicios comunes de la Seguridad Social."
  - id: c
    text:
      es: "las entidades locales y las comunidades autónomas que reciban transferencias del Estado."
  - id: d
    text:
      es: "los consorcios participados por el Estado y las entidades gestoras de la Seguridad Social, sin sus servicios comunes."
  explanation:
    es: "El artículo 73.1 aplica las fases al Presupuesto de gastos del Estado, de sus organismos autónomos y de las entidades integrantes del sector público estatal con presupuesto limitativo, así como de las entidades gestoras y servicios comunes de la Seguridad Social. Las sociedades y fundaciones con presupuesto estimativo no están en esa lista. Las entidades locales y las comunidades autónomas tienen su propio presupuesto, no el del Estado. Los consorcios no figuran, y la Seguridad Social entra con sus entidades gestoras y también con sus servicios comunes."
  citation: "art. 73.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q106
  prompt:
    es: "Según el artículo 73.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la aprobación es el acto por el que se autoriza la realización de un gasto determinado por una cuantía:"
  options:
  - id: a
    text:
      es: "cierta, nunca aproximada, reservando la totalidad de un crédito presupuestario."
  - id: b
    correct: true
    text:
      es: "cierta o aproximada, reservando la totalidad o parte de un crédito presupuestario."
  - id: c
    text:
      es: "determinada o determinable, reservando la totalidad o parte de un crédito presupuestario."
  - id: d
    text:
      es: "máxima o mínima, reservando una parte del crédito del ejercicio corriente."
  explanation:
    es: "El artículo 73.2 dice que la aprobación autoriza un gasto «determinado por una cuantía cierta o aproximada, reservando a tal fin la totalidad o parte de un crédito presupuestario». La cuantía puede ser aproximada, así que exigir una cuantía cierta es falso. «Determinado o determinable» es la fórmula del compromiso, no de la aprobación. La Ley no habla de cuantía máxima o mínima ni limita la reserva al ejercicio corriente."
  citation: "art. 73.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q107
  prompt:
    es: "¿Con quién genera relaciones la aprobación del gasto, cuando inicia el procedimiento de ejecución, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Con el contratista, que queda vinculado a la cuantía y condiciones del gasto."
  - id: b
    text:
      es: "Con el acreedor, que adquiere un crédito exigible contra la Hacienda Pública."
  - id: c
    text:
      es: "Con las entidades financieras que ejecutarán después el pago material del gasto."
  - id: d
    correct: true
    text:
      es: "Con ningún tercero ajeno a la Hacienda Pública estatal ni a la Seguridad Social."
  explanation:
    es: "Según el artículo 73.2, la aprobación inicia el procedimiento de ejecución del gasto «sin que implique relaciones con terceros ajenos a la Hacienda Pública estatal o a la Seguridad Social». Vincular al contratista es el efecto del compromiso, que tiene relevancia jurídica para con terceros. El crédito exigible del acreedor nace con el reconocimiento de la obligación. Las entidades financieras intervienen en el pago, que es una fase posterior."
  citation: "art. 73.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q108
  prompt:
    es: "De acuerdo con el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el compromiso es el acto por el que se acuerda, tras cumplir los trámites legales, la realización de gastos previamente aprobados, por un importe:"
  options:
  - id: a
    correct: true
    text:
      es: "determinado o determinable."
  - id: b
    text:
      es: "cierto o aproximado."
  - id: c
    text:
      es: "máximo o mínimo."
  - id: d
    text:
      es: "provisional o definitivo."
  explanation:
    es: "El artículo 73.3 define el compromiso como el acto que acuerda gastos previamente aprobados «por un importe determinado o determinable». «Cierta o aproximada» es la cuantía de la aprobación en el artículo 73.2. Los importes máximo o mínimo y provisional o definitivo no figuran en el artículo."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q109
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el compromiso de gasto es correcta según el artículo 73.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Inicia el procedimiento de ejecución del gasto sin que implique relaciones con terceros ajenos a la Hacienda Pública estatal."
  - id: b
    text:
      es: "Declara la existencia de un crédito exigible contra la Hacienda Pública estatal y comporta la propuesta de pago correspondiente."
  - id: c
    correct: true
    text:
      es: "Tiene relevancia jurídica para con terceros y vincula a la Hacienda Pública estatal a la realización del gasto."
  - id: d
    text:
      es: "Reserva la totalidad o parte de un crédito presupuestario para un gasto de cuantía cierta o aproximada, sin vincular a terceros."
  explanation:
    es: "El artículo 73.3 dice que el compromiso es un acto con relevancia jurídica para con terceros y que vincula a la Hacienda Pública estatal a realizar el gasto en la cuantía y condiciones establecidas. Iniciar el procedimiento sin relaciones con terceros es lo propio de la aprobación. Declarar un crédito exigible con propuesta de pago es el reconocimiento de la obligación. Reservar crédito para un gasto de cuantía cierta o aproximada vuelve a ser la aprobación."
  citation: "art. 73.3 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q110
  prompt:
    es: "Según el artículo 73.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué exige el reconocimiento de obligaciones con cargo a la Hacienda Pública estatal?"
  options:
  - id: a
    text:
      es: "Obtener el informe previo de la Intervención General de la Administración del Estado sobre el gasto aprobado y comprometido."
  - id: b
    correct: true
    text:
      es: "Acreditar documentalmente ante el órgano competente la realización de la prestación o el derecho del acreedor."
  - id: c
    text:
      es: "Haber ordenado el pago material al acreedor con anterioridad al reconocimiento."
  - id: d
    text:
      es: "Acreditar que el crédito presupuestario correspondiente ha sido objeto de retención previa."
  explanation:
    es: "El artículo 73.4 exige la acreditación documental previa ante el órgano competente de la realización de la prestación o del derecho del acreedor, conforme a los acuerdos que aprobaron y comprometieron el gasto. El informe previo de la Intervención General no es un requisito de ese apartado. El pago material es la fase final, posterior al reconocimiento. La retención previa del crédito es un trámite de inicio del expediente y el artículo no la exige para reconocer."
  citation: "art. 73.4 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: m01-l15-q111
  prompt:
    es: "¿Qué acto declara la existencia de un crédito exigible contra la Hacienda Pública estatal o contra la Seguridad Social, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "La fase de aprobación del gasto."
  - id: b
    text:
      es: "La fase de compromiso de gasto."
  - id: c
    text:
      es: "La fase de ordenación del pago."
  - id: d
    correct: true
    text:
      es: "La fase de reconocimiento de la obligación."
  explanation:
    es: "El artículo 73.4 define el reconocimiento de la obligación como el acto que declara la existencia de un crédito exigible, derivado de un gasto aprobado y comprometido. La aprobación solo reserva crédito y no genera relaciones con terceros. El compromiso vincula a la Hacienda a realizar el gasto, pero no declara un crédito exigible. La ordenación del pago es posterior a la obligación reconocida."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
