      es: "No se publica; se notifica al aspirante nombrado."
  explanation:
    es: "El artículo 62.1.b) dice que el nombramiento «será publicado en el Diario Oficial correspondiente». El tablón de anuncios y la sede electrónica, como únicos medios, no son un diario oficial. La opción de la simple notificación suprime la publicación que el artículo exige."
  citation: "art. 62.1 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q006
  prompt:
    es: "Una aspirante aprobada es nombrada y presta el acatamiento, pero no toma posesión en plazo. Según el artículo 62.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿es funcionaria de carrera?"
  options:
  - id: a
    text:
      es: "Sí, desde la publicación de su nombramiento en el Diario Oficial."
  - id: b
    correct: true
    text:
      es: "No, porque le falta el último requisito: la toma de posesión en plazo."
  - id: c
    text:
      es: "Sí, desde que prestó el acto de acatamiento de la Constitución y del Ordenamiento."
  - id: d
    text:
      es: "Sí, desde que superó el proceso selectivo y fue nombrada."
  explanation:
    es: "El artículo 62.1 exige el cumplimiento sucesivo de cuatro requisitos, y el último es la «Toma de posesión dentro del plazo que se establezca». Sin ella la condición no se adquiere. Las otras tres opciones fijan la adquisición en un momento anterior: la publicación del nombramiento, el acatamiento o la superación del proceso. En ninguno de ellos se han cumplido todavía los cuatro requisitos."
  citation: "art. 62.1 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q007
  prompt:
    es: "Según el artículo 62.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, quienes, superado el proceso selectivo, no acrediten que reúnen los requisitos y condiciones exigidos en la convocatoria:"
  options:
  - id: a
    text:
      es: "Serán nombrados funcionarios en prácticas hasta que acrediten esos requisitos."
  - id: b
    text:
      es: "Podrán ser nombrados y dispondrán de un plazo para acreditar esos requisitos."
  - id: c
    text:
      es: "Serán nombrados y perderán la condición si no los acreditan en un año."
  - id: d
    correct: true
    text:
      es: "No podrán ser funcionarios y quedarán sin efecto las actuaciones relativas a ellos."
  explanation:
    es: "El artículo 62.2 dice que «no podrán ser funcionarios y quedarán sin efecto las actuaciones relativas a quienes no acrediten, una vez superado el proceso selectivo, que reúnen los requisitos y condiciones exigidos en la convocatoria». Las opciones del nombramiento en prácticas, del plazo para acreditar y de la pérdida al cabo de un año permiten nombrar a quien no ha acreditado los requisitos, y el artículo lo impide."
  citation: "art. 62.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-11719-art-62
- id: m04-l04-q008
  prompt:
    es: "Un aspirante supera el proceso selectivo, pero no acredita la nacionalidad exigida en la convocatoria. Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué sucede?"
  options:
  - id: a
    text:
      es: "Es nombrado funcionario interino hasta que acredite la nacionalidad exigida."
  - id: b
    text:
      es: "Es nombrado funcionario de carrera y pierde después la condición por esa causa."
  - id: c
    text:
      es: "Conserva su plaza y puede acreditar la nacionalidad al tomar posesión."
  - id: d
    correct: true
    text:
      es: "No puede ser funcionario y quedan sin efecto sus actuaciones en el proceso."
  explanation:
    es: "El artículo 62.2 impide ser funcionario a quien, superado el proceso selectivo, no acredita que reúne los requisitos y condiciones de la convocatoria, y deja sin efecto las actuaciones relativas a él. El nombramiento como interino no tiene apoyo en el artículo. La opción del nombramiento seguido de pérdida confunde la falta de un requisito de acceso con una causa de pérdida del artículo 63. La de acreditarla al tomar posesión permite llegar al nombramiento sin el requisito acreditado."
  citation: "art. 62.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q009
  prompt:
    es: "Según el artículo 114.12 del Real Decreto-ley 6/2023, de 19 de diciembre, el plazo para que el funcionario de carrera tome posesión se cuenta a partir de:"
  options:
  - id: a
    correct: true
    text:
      es: "La publicación oficial de su nombramiento."
  - id: b
    text:
      es: "La notificación personal del nombramiento al aspirante."
  - id: c
    text:
      es: "La publicación de la relación definitiva de aprobados."
  - id: d
    text:
      es: "La firma del acto de acatamiento de la Constitución."
  explanation:
    es: "El artículo 114.12 da al funcionario de carrera quince días naturales «a partir de la publicación del nombramiento», o un mes si cambia de localidad de residencia. Cuenta la publicación, no la notificación personal. La relación de aprobados es anterior al nombramiento. El acatamiento es otro requisito del artículo 62.1 TREBEP y no marca el inicio del plazo."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q010
  prompt:
    es: "De acuerdo con el artículo 114.12 del Real Decreto-ley 6/2023, de 19 de diciembre, cuando el nombramiento suponga cambio de localidad de residencia, el funcionario de carrera tomará posesión:"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de un mes a partir de la publicación del nombramiento."
  - id: b
    text:
      es: "Dentro de veinte días naturales a partir de la publicación del nombramiento."
  - id: c
    text:
      es: "Dentro de dos meses a partir de la publicación del nombramiento."
  - id: d
    text:
      es: "Dentro de un mes a partir de su llegada a la nueva localidad."
  explanation:
    es: "El artículo 114.12 RDL 6/2023 fija quince días naturales para tomar posesión desde la publicación del nombramiento, plazo «que será de un mes cuando suponga cambio de localidad de residencia». Veinte días naturales no es ninguno de los dos plazos del apartado: son quince y un mes. Dos meses duplica el plazo con cambio de residencia. Un mes desde la llegada a la nueva localidad acierta con la duración, pero el apartado cuenta desde la publicación del nombramiento."
