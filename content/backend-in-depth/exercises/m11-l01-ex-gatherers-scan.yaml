- id: m11-l01-v-gatherers-scan-001
  prompt:
    en: |-
      Since Java 24, where gatherers are final, what does this program print? The stream is ordered, and the result is printed as a list.

      ```java
      import java.util.stream.Gatherers;
      import java.util.stream.Stream;

      public class Main {
          public static void main(String[] args) {
              System.out.println(Stream.of(1, 2, 3, 4, 5, 6).gather(Gatherers.scan(() -> 0, Integer::sum)).toList());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[1, 3, 6, 10, 15, 21]`'
    correct: true
  - id: b
    text:
      en: '`[21]`'
  - id: c
    text:
      en: '`[3, 6, 10, 15, 21]`'
  - id: d
    text:
      en: '`[2, 4, 7, 11, 16, 22]`'
  explanation:
    en: '`scan` starts from the seed 0 and applies `Integer::sum` to the running value and each element in order. It emits
      the value after each element, and the seed itself is not emitted. The program prints `[1, 3, 6, 10, 15, 21]`. `[21]`
      comes from this mistake: using `fold` where `scan` was written. `[3, 6, 10, 15, 21]` comes from this mistake: leaving
      out the first running value. `[2, 4, 7, 11, 16, 22]` comes from this mistake: starting from one instead of the seed
      written.'
  family: gatherers-scan
  code_reading: true
  citation: javadoc-gatherers#scan(java.util.function.Supplier,java.util.function.BiFunction)
  difficulty: 3
  tags: &id001
  - streams
  - gatherers
