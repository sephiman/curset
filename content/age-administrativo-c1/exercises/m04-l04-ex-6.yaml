# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q153
  prompt:
    es: "Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes condiciones debe reunir el familiar para que el funcionario pueda obtener la excedencia para su cuidado?"
  options:
  - id: a
    text:
      es: "Que tenga reconocida una discapacidad igual o superior al 65 por ciento."
  - id: b
    text:
      es: "Que conviva con el funcionario y carezca de rentas propias."
  - id: c
    correct: true
    text:
      es: "Que no pueda valerse por sí mismo y no desempeñe actividad retribuida."
  - id: d
    text:
      es: "Que no pueda valerse por sí mismo, aunque trabaje a tiempo parcial."
  explanation:
    es: "El artículo 89.4 exige un familiar a cargo «que por razones de edad, accidente, enfermedad o discapacidad no pueda valerse por sí mismo y no desempeñe actividad retribuida». No pide un grado de discapacidad, convivencia ni falta de rentas. El trabajo a tiempo parcial es una actividad retribuida, que el artículo excluye."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q154
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la excedencia para atender al cuidado de un familiar a cargo tiene una duración:"
  options:
  - id: a
    correct: true
    text:
      es: "No superior a tres años por cada sujeto causante."
  - id: b
    text:
      es: "No superior a dos años por cada sujeto causante."
  - id: c
    text:
      es: "No superior a un año, prorrogable por otro igual."
  - id: d
    text:
      es: "No superior a cinco años en toda la vida administrativa."
  explanation:
    es: "El artículo 89.4 da derecho a «un período de excedencia de duración no superior a tres años, para atender al cuidado de un familiar», y el periodo «será único por cada sujeto causante». Dos años es el tiempo de reserva del puesto, no la duración. El año prorrogable y los cinco años en toda la vida administrativa no están en el artículo."
  citation: "art. 89.4 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q155
  prompt:
    es: "Un funcionario en excedencia por su primer hijo desde el lunes 4 de enero de 2027 pide otra por el segundo, nacido el 10 de noviembre, desde el martes 16 de noviembre de 2027. Según el artículo 89.4 del Estatuto Básico del Empleado Público, ¿cuándo termina la excedencia anterior?"
  options:
  - id: a
    text:
      es: "El miércoles 10 de noviembre de 2027, día del nacimiento del segundo hijo."
  - id: b
    correct: true
    text:
      es: "El martes 16 de noviembre de 2027, al iniciarse la nueva excedencia."
  - id: c
    text:
      es: "El jueves 4 de enero de 2029, al cumplirse dos años de excedencia."
  - id: d
    text:
      es: "El viernes 4 de enero de 2030, al cumplirse tres años de excedencia."
  explanation:
    es: "El artículo 89.4 dice que «cuando un nuevo sujeto causante diera origen a una nueva excedencia, el inicio del período de la misma pondrá fin al que se viniera disfrutando». La nueva excedencia empieza el martes 16 de noviembre de 2027, y ese día termina la del primer hijo. El nacimiento del miércoles 10 de noviembre no pone fin a nada por sí solo. Las fechas de 2029 y 2030 suponen que la excedencia del primer hijo sigue corriendo, y el artículo dice que termina."
  citation: "art. 89.4 TREBEP"
  difficulty: 3
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q156
  prompt:
    es: "Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, si dos funcionarios generan el derecho a la excedencia por cuidado de familiares por el mismo sujeto causante:"
  options:
  - id: a
    text:
      es: "Ambos pueden disfrutarla a la vez sin que la Administración pueda limitar su ejercicio."
  - id: b
    correct: true
    text:
      es: "La Administración puede limitar su ejercicio simultáneo por razones justificadas del funcionamiento de los servicios."
  - id: c
    text:
      es: "La Administración debe denegarla al funcionario con menor antigüedad en el servicio."
  - id: d
    text:
      es: "Cada uno de ellos puede disfrutarla, pero solo por la mitad del periodo máximo."
  explanation:
    es: "El artículo 89.4 dice que en ese caso «la Administración podrá limitar su ejercicio simultáneo por razones justificadas relacionadas con el funcionamiento de los servicios». La Administración sí puede limitarlo. El artículo no obliga a denegarla al de menor antigüedad ni reparte el periodo por mitades."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q157
  prompt:
    es: "¿En cuál de las siguientes excedencias computa el tiempo de permanencia a efectos de trienios del funcionario de carrera?"
  options:
  - id: a
    correct: true
    text:
      es: "En la excedencia por cuidado de familiares."
  - id: b
    text:
      es: "En la excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "En la excedencia voluntaria por agrupación familiar."
  - id: d
    text:
      es: "En la excedencia voluntaria incentivada."
  explanation:
    es: "El artículo 89.4 TREBEP dice que en la excedencia por cuidado de familiares «el tiempo de permanencia en esta situación será computable a efectos de trienios, carrera y derechos en el régimen de Seguridad Social». En las de interés particular y agrupación familiar el tiempo no computa para trienios (artículo 89.2 y 89.3 TREBEP), y el artículo 19 del Real Decreto 365/1995 tampoco lo computa en las excedencias voluntarias, la incentivada incluida."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q158
  prompt:
    es: "Una funcionaria pasa el lunes 1 de marzo de 2027 a excedencia para cuidar de su madre dependiente. Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿hasta cuándo, al menos, se le reserva su puesto?"
  options:
  - id: a
    text:
      es: "Hasta el miércoles 1 de septiembre de 2027."
  - id: b
    text:
      es: "Hasta el miércoles 1 de marzo de 2028."
  - id: c
    correct: true
    text:
      es: "Hasta el jueves 1 de marzo de 2029."
  - id: d
    text:
      es: "Hasta el viernes 1 de marzo de 2030."
  explanation:
    es: "El artículo 89.4 dice que «el puesto de trabajo desempeñado se reservará, al menos, durante dos años». Desde el lunes 1 de marzo de 2027, dos años llevan al jueves 1 de marzo de 2029. El miércoles 1 de septiembre de 2027 son seis meses, el plazo de reserva de la excedencia por violencia de género. El miércoles 1 de marzo de 2028 es un año. El viernes 1 de marzo de 2030 son tres años, la duración máxima de la excedencia, no el mínimo de reserva."
  citation: "art. 89.4 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q159
  prompt:
    es: "De acuerdo con el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, transcurridos dos años de excedencia para cuidar de un familiar a cargo, la reserva lo es:"
  options:
  - id: a
    correct: true
    text:
      es: "A un puesto en la misma localidad y de igual retribución."
  - id: b
    text:
      es: "Al mismo puesto de trabajo que desempeñaba el funcionario."
  - id: c
    text:
      es: "A un puesto en cualquier localidad y de igual retribución."
  - id: d
    text:
      es: "A un puesto en la misma localidad, sin garantía de retribución."
  explanation:
    es: "El artículo 89.4 dice que, transcurridos los dos años de reserva del puesto, «dicha reserva lo será a un puesto en la misma localidad y de igual retribución». Ya no es el mismo puesto. Tampoco sirve cualquier localidad, y la retribución está garantizada."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-14
- id: m04-l04-q160
  prompt:
    es: "Según el artículo 14.2 del Real Decreto 365/1995, de 10 de marzo, el funcionario en excedencia para el cuidado de hijos tiene derecho a la reserva del puesto de trabajo y al cómputo del tiempo a efectos de:"
  options:
  - id: a
    text:
      es: "Trienios y derechos pasivos, pero no de consolidación de grado."
  - id: b
    text:
      es: "Consolidación de grado personal, pero no de trienios."
  - id: c
    correct: true
    text:
      es: "Trienios, consolidación de grado personal y derechos pasivos."
  - id: d
    text:
      es: "Derechos pasivos, pero no de trienios ni de grado personal."
  explanation:
    es: "El artículo 14.2 reconoce «el derecho a la reserva del puesto de trabajo y a su cómputo a efectos de trienios, consolidación de grado personal, derechos pasivos y solicitud de excedencia voluntaria por interés particular». Las opciones que excluyen el grado personal, los trienios o ambos dejan fuera efectos que el artículo incluye."
  citation: "art. 14.2 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-14
- id: m04-l04-q161
  prompt:
    es: "De acuerdo con el artículo 14.3 del Real Decreto 365/1995, de 10 de marzo, si el funcionario no solicita el reingreso antes de que termine su excedencia por cuidado de hijos:"
  options:
  - id: a
    correct: true
    text:
      es: "Se le declara de oficio en excedencia voluntaria por interés particular."
  - id: b
    text:
      es: "Se le declara de oficio en la situación de excedencia forzosa."
  - id: c
    text:
      es: "Pierde la condición de funcionario de carrera de forma automática."
  - id: d
    text:
      es: "Se le prorroga la excedencia hasta que pida el reingreso al servicio activo."
  explanation:
    es: "El artículo 14.3 dice que, si no solicita el reingreso antes de la finalización del periodo, «el funcionario será declarado de oficio en la situación de excedencia voluntaria por interés particular». No pasa a la excedencia forzosa, no pierde la condición de funcionario y la excedencia no se prorroga."
  citation: "art. 14.3 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q162
  prompt:
    es: "Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en la excedencia por cuidado de un menor en acogimiento permanente, ¿desde cuándo se cuentan los tres años de duración máxima?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde la fecha de la resolución judicial o administrativa."
  - id: b
    text:
      es: "Desde la fecha en que el funcionario presenta la solicitud."
  - id: c
    text:
      es: "Desde la fecha en que la Administración concede la excedencia."
  - id: d
    text:
      es: "Desde la fecha de inscripción del menor en el Registro Civil."
  explanation:
    es: "El artículo 89.4 incluye a «cada menor sujeto a guarda con fines de adopción o acogimiento permanente» y cuenta los tres años «desde la fecha de nacimiento o, en su caso, de la resolución judicial o administrativa». Para el acogimiento la fecha es la de la resolución, no la de la solicitud, la de la concesión ni la de una inscripción."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q163
  prompt:
    es: "Según el artículo 89.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las funcionarias víctimas de violencia de género o de violencia sexual pueden solicitar la excedencia:"
  options:
  - id: a
    text:
      es: "Tras dos años de servicios previos y sin plazo de permanencia exigible."
  - id: b
    text:
      es: "Sin tiempo mínimo de servicios previos, pero con una permanencia de seis meses."
  - id: c
    correct: true
    text:
      es: "Sin tiempo mínimo de servicios previos y sin plazo de permanencia exigible."
  - id: d
    text:
      es: "Tras un año de servicios previos y con una permanencia mínima de un año."
  explanation:
    es: "El artículo 89.5 reconoce el derecho a solicitarla «sin tener que haber prestado un tiempo mínimo de servicios previos y sin que sea exigible plazo de permanencia en la misma». No hay años de servicios previos ni permanencia mínima. Los seis meses son el periodo de reserva del puesto, no un plazo de permanencia."
  citation: "art. 89.5 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q164
  prompt:
    es: "Una funcionaria víctima de violencia de género pasa a la excedencia por esa causa el martes 2 de febrero de 2027. Sin prórroga, ¿hasta cuándo tiene derecho a la reserva de su puesto de trabajo?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes 2 de agosto de 2027."
  - id: b
    text:
      es: "Hasta el viernes 2 de abril de 2027."
  - id: c
    text:
      es: "Hasta el martes 2 de noviembre de 2027."
  - id: d
    text:
      es: "Hasta el miércoles 2 de agosto de 2028."
  explanation:
    es: "El artículo 89.5 da derecho a la reserva del puesto «durante los seis primeros meses». Desde el martes 2 de febrero de 2027, seis meses llevan al lunes 2 de agosto de 2027. El viernes 2 de abril son dos meses, el periodo de retribuciones íntegras. El martes 2 de noviembre son nueve meses, seis más una prórroga de tres que la pregunta excluye. El miércoles 2 de agosto de 2028 son dieciocho meses, el máximo con prórrogas."
  citation: "art. 89.5 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q165
  prompt:
    es: "¿Qué percibe la funcionaria de carrera durante los dos primeros meses de la excedencia por razón de violencia de género o de violencia sexual?"
  options:
  - id: a
    text:
      es: "Solo las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: b
    correct: true
    text:
      es: "Las retribuciones íntegras y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: c
    text:
      es: "El setenta y cinco por ciento de las retribuciones del puesto que desempeñaba."
  - id: d
    text:
      es: "Solo las prestaciones familiares por hijo a cargo, sin ninguna retribución."
  explanation:
    es: "El artículo 89.5 dice que «durante los dos primeros meses de esta excedencia la funcionaria tendrá derecho a percibir las retribuciones íntegras y, en su caso, las prestaciones familiares por hijo a cargo». No son solo las básicas ni un porcentaje, y tampoco se queda sin retribución."
  citation: "art. 89.5 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q166
  prompt:
    es: "De acuerdo con el artículo 89.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando las actuaciones judiciales lo exijan, el periodo de reserva del puesto en la excedencia por violencia de género o sexual:"
  options:
  - id: a
    text:
      es: "Podrá prorrogarse por seis meses, con un máximo de dieciocho."
  - id: b
    text:
      es: "Podrá prorrogarse por tres meses, con un máximo de veinticuatro."
  - id: c
    text:
      es: "Podrá prorrogarse una sola vez, por otros seis meses."
  - id: d
    correct: true
    text:
      es: "Podrá prorrogarse por tres meses, con un máximo de dieciocho."
  explanation:
    es: "El artículo 89.5 dice que «cuando las actuaciones judiciales lo exigieran se podrá prorrogar este periodo por tres meses, con un máximo de dieciocho». La prórroga es por tres meses, no por seis ni de una sola vez, y el máximo es dieciocho, no veinticuatro."
  citation: "art. 89.5 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q167
  prompt:
    es: "Según el artículo 89.6 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los funcionarios que han sufrido daños físicos o psíquicos como consecuencia de la actividad terrorista tienen derecho a una excedencia:"
  options:
  - id: a
    correct: true
    text:
      es: "En las mismas condiciones que las víctimas de violencia de género o sexual."
  - id: b
    text:
      es: "En las mismas condiciones que la excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "En las mismas condiciones que la excedencia por cuidado de familiares."
  - id: d
    text:
      es: "En las mismas condiciones que la excedencia voluntaria por agrupación familiar."
  explanation:
    es: "El artículo 89.6 les reconoce «un periodo de excedencia en las mismas condiciones que las víctimas de violencia de género o de violencia sexual». No se asimila a la de interés particular, que exige cinco años de servicios, ni a la de cuidado de familiares o la de agrupación familiar, que tienen otros requisitos y efectos."
  citation: "art. 89.6 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q168
  prompt:
    es: "¿Qué se exige para que un funcionario amenazado en los términos del artículo 5 de la Ley 29/2011, de 22 de septiembre, tenga derecho a la excedencia por razón de violencia terrorista?"
  options:
  - id: a
    text:
      es: "La previa denuncia de la amenaza ante las Fuerzas y Cuerpos de Seguridad."
  - id: b
    correct: true
    text:
      es: "El previo reconocimiento del Ministerio del Interior o una sentencia judicial firme."
  - id: c
    text:
      es: "El informe favorable de la Subsecretaría de su departamento ministerial."
  - id: d
    text:
      es: "Cinco años de servicios efectivos en cualquier Administración Pública."
  explanation:
    es: "El artículo 89.6 exige el «previo reconocimiento del Ministerio del Interior o de sentencia judicial firme». La denuncia y el informe de la Subsecretaría no son los requisitos del artículo. Los cinco años de servicios son el requisito de la excedencia por interés particular; esta excedencia se rige por las condiciones de la de violencia de género, que no exige servicios previos."
  citation: "art. 89.6 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q201
  prompt:
    es: "Según el artículo 15.1 del Real Decreto 365/1995, de 10 de marzo, pasa a excedencia voluntaria por prestación de servicios en el sector público el funcionario de carrera en servicio activo en otro cuerpo o escala:"
  options:
  - id: a
    text:
      es: "Solo de la Administración General del Estado, salvo que hubiera obtenido la oportuna compatibilidad."
  - id: b
    text:
      es: "De una comunidad autónoma, siempre que haya accedido a él por concurso."
  - id: c
    correct: true
    text:
      es: "De cualquiera de las Administraciones públicas, salvo que hubiera obtenido la oportuna compatibilidad."
  - id: d
    text:
      es: "De cualquiera de las Administraciones públicas, aunque hubiera obtenido la oportuna compatibilidad."
  explanation:
    es: "El artículo 15.1 se refiere al funcionario en servicio activo en otro cuerpo o escala «de cualquiera de las Administraciones públicas, salvo que hubieran obtenido la oportuna compatibilidad». La opción limitada a la Administración General del Estado recorta un ámbito que el artículo da completo. La opción que dice «aunque hubiera obtenido» la compatibilidad invierte la excepción: con compatibilidad no se pasa a esta excedencia. La opción de la comunidad autónoma por concurso añade un requisito que el artículo no pone."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q202
  prompt:
    es: "¿Cuál de los siguientes funcionarios de carrera pasa a excedencia voluntaria por prestación de servicios en el sector público, según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El que pasa a ocupar un puesto como funcionario interino en un ayuntamiento."
  - id: b
    text:
      es: "El que es contratado como personal laboral temporal en un organismo autónomo."
  - id: c
    text:
      es: "El que es nombrado personal eventual en el gabinete de un ministro."
  - id: d
    correct: true
    text:
      es: "El que pasa a ser laboral fijo en un organismo del sector público sin quedar en servicio activo."
  explanation:
    es: "El artículo 15.1 incluye a los funcionarios que «pasen a prestar servicios como personal laboral fijo en organismos o entidades del sector público y no les corresponda quedar en las situaciones de servicio activo o servicios especiales». El puesto de funcionario interino y el de laboral temporal están excluidos de forma expresa: «no habilitará para pasar a esta situación administrativa». El nombramiento como personal eventual no lleva a esta excedencia, sino a servicios especiales si el funcionario no opta por seguir en servicio activo (art. 87.1.i) TREBEP)."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q203
  prompt:
    es: "Respecto de la excedencia voluntaria por prestación de servicios en el sector público, el desempeño de un puesto como funcionario interino o como personal laboral temporal:"
  options:
  - id: a
    text:
      es: "Habilita para pasar a ella solo si el puesto está en otra Administración."
  - id: b
    correct: true
    text:
      es: "No habilita para pasar a esa situación, cualquiera que sea su duración."
  - id: c
    text:
      es: "Habilita para pasar a ella si el nombramiento supera los seis meses."
  - id: d
    text:
      es: "Habilita para pasar a ella si antes se obtiene la oportuna compatibilidad."
  explanation:
    es: "El artículo 15.1 RD 365/1995 dice que «el desempeño de puestos con carácter de funcionario interino o de personal laboral temporal no habilitará para pasar a esta situación administrativa». La exclusión no tiene excepciones: ni la duración del nombramiento, ni que el puesto esté en otra Administración, ni la compatibilidad la levantan. La compatibilidad solo opera en el otro supuesto del artículo, el del funcionario en servicio activo en otro cuerpo o escala."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q204
  prompt:
    es: "Según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿cómo se declara la excedencia voluntaria por prestación de servicios en el sector público?"
  options:
  - id: a
    text:
      es: "A instancia de parte, previo informe favorable de la Subsecretaría."
  - id: b
    correct: true
    text:
      es: "De oficio o a instancia de parte."
  - id: c
    text:
      es: "Solo de oficio, por el departamento al que esté adscrito el cuerpo."
  - id: d
    text:
      es: "Solo a instancia del funcionario interesado, nunca de oficio."
  explanation:
    es: "El artículo 15.1 empieza: «Procederá declarar, de oficio o a instancia de parte, en la situación regulada en este artículo». Las dos vías caben, así que son incorrectas la opción que la reserva a la solicitud del funcionario y la que la reserva a la actuación de oficio del departamento. El informe favorable de la Subsecretaría es un requisito que el artículo no contiene."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q205
  prompt:
    es: "Conforme al artículo 15.3 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, el funcionario en excedencia voluntaria por prestación de servicios en el sector público puede permanecer en ella:"
  options:
  - id: a
    text:
      es: "Un mínimo de dos años y un máximo de quince años continuados."
  - id: b
    text:
      es: "Un período máximo de un año, tras el cual pasa a excedencia forzosa."
  - id: c
    text:
      es: "Un período máximo de cinco años, sin posibilidad de prórroga."
  - id: d
    correct: true
    text:
      es: "En tanto se mantenga la relación de servicios que dio origen a la misma."
  explanation:
    es: "El artículo 15.3: «Los funcionarios podrán permanecer en esta situación en tanto se mantenga la relación de servicios que dio origen a la misma». Los dos a quince años son la duración de la excedencia por agrupación familiar (art. 17 RD 365/1995). Los cinco años son los de la excedencia voluntaria incentivada (art. 18.4). El año máximo seguido de excedencia forzosa es la regla de la expectativa de destino (art. 12.2)."
  citation: "art. 15.3 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q206
  prompt:
    es: "Según el artículo 15.3 del Real Decreto 365/1995, de 10 de marzo, ¿qué ocurre si quien está en excedencia por prestación de servicios en el sector público cesa como laboral fijo y no pide el reingreso en un mes?"
  options:
  - id: a
    text:
      es: "Pierde la condición de funcionario de carrera."
  - id: b
    correct: true
    text:
      es: "Se le declara en excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "Se le declara en excedencia forzosa con derecho a retribuciones básicas."
  - id: d
    text:
      es: "Se le adscribe de oficio con carácter provisional a un puesto vacante."
  explanation:
    es: "El artículo 15.3 obliga a pedir el reingreso «en el plazo máximo de un mes, declarándoseles, de no hacerlo, en la situación de excedencia voluntaria por interés particular». La excedencia forzosa con retribuciones básicas es la de los artículos 13 y 22.5. La pérdida de la condición es la consecuencia de no pedir el reingreso al final de la propia excedencia por interés particular (art. 16.4). La adscripción provisional es una forma de reingreso (art. 62.2 RD 364/1995), no la consecuencia de no pedirlo."
  citation: "art. 15.3 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q207
  prompt:
    es: "Un funcionario de la Administración General del Estado en excedencia voluntaria por prestación de servicios en el sector público cesa como personal laboral fijo el martes, 12 de enero de 2027. ¿Hasta qué día puede pedir el reingreso al servicio activo?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 12 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el viernes, 12 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el martes, 26 de enero de 2027."
  - id: d
    text:
      es: "Hasta el viernes, 12 de marzo de 2027."
  explanation:
    es: "El artículo 15.3 da un plazo máximo de un mes desde el cese. El mes se cuenta de fecha a fecha, como hace la lección con el mes del artículo 9.1 aplicando el artículo 30.4 LPAC: empieza el miércoles 13 de enero y termina el mismo día del mes siguiente, el viernes 12 de febrero de 2027. El martes 26 de enero es el décimo día hábil, un plazo en días que el artículo no usa. El 12 de marzo son dos meses y el 12 de julio, seis."
  citation: "art. 15.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8730-art-15
- id: m04-l04-q208
  prompt:
    es: "Una funcionaria del Estado en excedencia por prestación de servicios en el sector público cesa como funcionaria de carrera de una comunidad autónoma el lunes, 31 de agosto de 2026. Según el Real Decreto 365/1995, de 10 de marzo, ¿hasta qué día puede pedir el reingreso?"
  options:
  - id: a
    text:
      es: "Hasta el martes, 15 de septiembre de 2026."
  - id: b
    text:
      es: "Hasta el lunes, 30 de noviembre de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el miércoles, 30 de septiembre de 2026."
  - id: d
    text:
      es: "Hasta el jueves, 1 de octubre de 2026."
  explanation:
    es: "El artículo 15.3 da un mes máximo desde el cese. Contado de fecha a fecha con el artículo 30.4 LPAC, el día equivalente sería el 31 de septiembre, que no existe; cuando el mes de vencimiento no tiene día equivalente, el plazo expira el último día del mes: el miércoles 30 de septiembre de 2026, día hábil. Pasar al 1 de octubre es arrastrar el día que falta, algo que el artículo 30.4 no permite. El 15 de septiembre corresponde a quince días naturales y el 30 de noviembre a tres meses."
  citation: "art. 15.3 RD 365/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8730-art-12
- id: m04-l04-q209
  prompt:
    es: "De acuerdo con el artículo 12.1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, pasan a expectativa de destino los funcionarios afectados por un procedimiento de reasignación de efectivos que:"
  options:
  - id: a
    text:
      es: "No hayan obtenido puesto en ninguna de las fases del procedimiento."
  - id: b
    correct: true
    text:
      es: "No hayan obtenido puesto en las dos primeras fases del procedimiento."
  - id: c
    text:
      es: "Hayan rechazado el puesto ofrecido en la primera fase del procedimiento."
  - id: d
    text:
      es: "No hayan obtenido puesto en la primera fase del procedimiento."
  explanation:
    es: "El artículo 12.1 lleva a la expectativa de destino a los afectados por la reasignación de efectivos «que no hayan obtenido puesto en las dos primeras fases». No basta con no obtenerlo en la primera fase. No obtenerlo en ninguna fase no es el supuesto: la situación se declara al terminar la segunda. El rechazo de un puesto ofrecido no es la causa que el artículo describe."
  citation: "art. 12.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
