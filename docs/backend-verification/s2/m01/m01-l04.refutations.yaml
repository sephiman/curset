m01-l04-q01:
  key:
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: This means that self-invocation (in effect, a method within the target object calling another method of the target object) does not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.
  wrong:
  - option: The annotation on `b()` is enough to activate the transactional behavior, so a transaction starts
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: However, the mere presence of the @Transactional annotation is not enough to activate the transactional behavior.
  - option: The proxy intercepts the call that `a()` makes on its own bean, so a transaction starts for `b()`
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: In proxy mode (which is the default), only external method calls coming in through the proxy are intercepted.
  - option: Spring rejects the call with an exception, because self-invocation of an annotated method is not allowed
    anchor: spring-fw-aop-proxying#aop-understanding-aop-proxies
    sentence: In other words, self invocation via an explicit or implicit this reference will bypass the advice.
m01-l04-q02:
  key:
    anchor: javadoc-forkjoinpool#commonPool()
    sentence: However this pool and any ongoing processing are automatically terminated upon program System.exit(int).
  wrong:
  - option: The pool waits for its ongoing processing to complete before the program terminates
    anchor: javadoc-forkjoinpool#commonPool()
    sentence: Any program that relies on asynchronous task processing to complete before program termination should invoke commonPool().awaitQuiescence, before exit.
  - option: The pool keeps running until `shutdownNow()` is called on it
    anchor: javadoc-forkjoinpool#commonPool()
    sentence: This pool is statically constructed; its run state is unaffected by attempts to shutdown() or shutdownNow().
  - option: The pool keeps the program alive, because its worker threads are not daemon threads
    anchor: javadoc-forkjoinpool#class-forkjoinpool
    sentence: All worker threads are initialized with Thread.isDaemon() set true.
