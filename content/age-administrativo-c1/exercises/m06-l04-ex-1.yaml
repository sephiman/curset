- id: m06-l04-q024
  prompt:
    es: "En Word 365, ¿cómo se selecciona un objeto que está debajo de otros, desplazándose hacia delante por la pila de objetos?"
  options:
  - id: a
    text:
      es: "Se selecciona el objeto superior y se presiona Mayús+F10."
  - id: b
    text:
      es: "Se selecciona el objeto superior y se presiona Mayús+Tab."
  - id: c
    correct: true
    text:
      es: "Se selecciona el objeto superior y se presiona Tab."
  - id: d
    text:
      es: "Se selecciona el objeto superior y se presiona F8."
  explanation:
    es: "Según la tabla de consejos, para desplazarse hacia delante por la pila hay que seleccionar el objeto superior y presionar «la tecla TAB». Mayús+Tab recorre la pila hacia atrás. F8 extiende la selección de texto, y Mayús+F10 muestra el menú contextual del elemento seleccionado."
  citation: "fuente: `ms-word-seleccionar-objetos.html`; «Consejos para seleccionar formas y objetos»"
