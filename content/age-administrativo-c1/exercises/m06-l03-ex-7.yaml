# anchor: fuente-ms-win-bloc-notas-html
- id: m06-l03-q224
  prompt:
    es: "En el Bloc de notas de Windows 11, ¿en qué opción del menú Archivo se introducen los comandos del encabezado y del pie de página?"
  options:
  - id: a
    text:
      es: "Guardar como"
  - id: b
    text:
      es: "Imprimir"
  - id: c
    correct: true
    text:
      es: "Configurar página"
  - id: d
    text:
      es: "Abrir"
  explanation:
    es: "La página dice que se selecciona Configurar página en el menú Archivo y se introducen los comandos en los cuadros de texto de Encabezado y Pie de página. Guardar como sirve para guardar el archivo con un nombre, como en el ejemplo del archivo de registro, y la página sitúa esta configuración en Configurar página, no en Abrir ni en Imprimir."
