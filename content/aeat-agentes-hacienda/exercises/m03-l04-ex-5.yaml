# anchor: boe-a-2003-23186-art-46
- id: m03-l04-q0065
  prompt:
    es: "De acuerdo con el artículo 46.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para los actos de mero trámite se presume concedida:"
  options:
  - id: a
    text:
      es: "la representación, siempre que conste inscrita en un registro público."
  - id: b
    text:
      es: "la representación, solo si el representante es asesor fiscal."
  - id: c
    text:
      es: "la representación, siempre que el obligado haya comparecido personalmente."
  - id: d
    correct: true
    text:
      es: "la representación."
  explanation:
    es: "Para los actos de mero trámite la representación se presume concedida, sin más requisitos (art. 46.3). La inscripción registral, la condición de asesor fiscal y la comparecencia personal son medios o requisitos de acreditación para los actos del artículo 46.2, no para los de trámite."
  citation: "art. 46.3 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-46
- id: m03-l04-q0066
  prompt:
    es: "Según el artículo 46.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando concurren varios titulares en una misma obligación tributaria, ¿a quién se presume otorgada la representación y a quiénes se notifica la liquidación?"
  options:
  - id: a
    correct: true
    text:
      es: "Se presume otorgada a cualquiera de ellos, salvo manifestación expresa en contrario, y la liquidación se notifica a todos los titulares."
  - id: b
    text:
      es: "Se presume otorgada al titular de mayor participación, y la liquidación se notifica solo a este."
  - id: c
    text:
      es: "Se presume otorgada a cualquiera de ellos, y la liquidación se notifica solo al que actúe como representante."
  - id: d
    text:
      es: "No se presume otorgada a ninguno, y la liquidación se notifica a todos los titulares."
  explanation:
    es: "El artículo 46.6 presume la representación en cualquiera de los titulares, salvo manifestación expresa en contrario, y exige notificar la liquidación a todos. No hay preferencia por el de mayor participación, y notificar solo al representante o prescindir de toda presunción contradice el texto."
  citation: "art. 46.6 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0067
  prompt:
    es: "De acuerdo con el artículo 111.2.d) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, cuando la representación conste en el documento normalizado aprobado por la Administración tributaria, el representante responde con su firma de:"
  options:
  - id: a
    text:
      es: "la veracidad de los datos económicos de la declaración."
  - id: b
    correct: true
    text:
      es: "la autenticidad de la firma de su representado."
  - id: c
    text:
      es: "las deudas tributarias que se deriven del acto representado."
  - id: d
    text:
      es: "la capacidad de obrar del representado en el momento de otorgarla."
  explanation:
    es: "El artículo 111.2.d) entiende otorgada la representación con el documento normalizado y hace al representante responder con su firma de la autenticidad de la de su representado. No responde por la veracidad de los datos económicos, por las deudas ni por la capacidad del representado."
  citation: "art. 111.2 RGAT"
  difficulty: 1
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0068
  prompt:
    es: "De acuerdo con el artículo 111.6 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la renuncia a la representación no tiene efectos ante el órgano actuante hasta que se acredite que se ha comunicado de forma fehaciente:"
  options:
  - id: a
    text:
      es: "al registro público donde conste inscrita la representación."
  - id: b
    text:
      es: "a la Administración tributaria competente por el propio representante."
  - id: c
    text:
      es: "al notario que legitimó la firma del documento de representación."
  - id: d
    correct: true
    text:
      es: "al representado."
  explanation:
    es: "El artículo 111.6 condiciona la eficacia de la renuncia ante el órgano actuante a que se acredite su comunicación fehaciente al representado. La comunicación al registro, a la Administración o al notario no es la que exige el precepto."
  citation: "art. 111.6 RGAT"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2007-15984-art-112
- id: m03-l04-q0069
  prompt:
    es: "De acuerdo con el artículo 112.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre la falta de acreditación de la representación:"
  options:
  - id: a
    correct: true
    text:
      es: "Si el representante no acredita la representación, el acto se tiene por no realizado, salvo que el obligado ratifique las actuaciones realizadas en su nombre."
  - id: b
    text:
      es: "Si el representante no acredita la representación, el acto se tiene por realizado y se sanciona al obligado tributario."
  - id: c
    text:
      es: "Si el representante no acredita la representación, el acto se tiene por no realizado, sin posibilidad de ratificación."
  - id: d
    text:
      es: "Si el representante no acredita la representación, el acto se tiene por realizado cuando lo ratifique la Administración."
  explanation:
    es: "El artículo 112.1 dispone que, si el representante no acredita la representación, el acto se tiene por no realizado o al obligado por no personado, salvo que este ratifique lo hecho en su nombre. La posibilidad de ratificación existe, la sanción no figura y la ratificación corresponde al obligado, no a la Administración."
  citation: "art. 112.1 RGAT"
  difficulty: 2
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-47
- id: m03-l04-q0070
  prompt:
    es: "De acuerdo con el artículo 47 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios que no residan en España deben designar un representante:"
  options:
  - id: a
    text:
      es: "en todo caso, cuando realicen operaciones sujetas a tributación en España."
  - id: b
    correct: true
    text:
      es: "cuando lo establezca expresamente la normativa tributaria."
  - id: c
    text:
      es: "solo cuando lo requiera la Administración tributaria en un procedimiento."
  - id: d
    text:
      es: "únicamente si actúan en España mediante un establecimiento permanente."
  explanation:
    es: "El artículo 47 obliga al no residente a designar representante cuando lo establezca expresamente la normativa tributaria, y a comunicar la designación a la Administración. No es obligación general por tributar en España, ni depende del requerimiento de la Administración ni de que haya establecimiento permanente."
  citation: "art. 47 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "sujeto"
# anchor: boe-a-2012-14696-art-3
- id: m03-l04-q0086
  prompt:
    es: "De acuerdo con el artículo 3.1 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, no existe obligación de expedir factura, salvo en los supuestos del artículo 2.2, por las operaciones:"
  options:
  - id: a
    text:
      es: "exentas del IVA en virtud de cualquier precepto de la Ley del Impuesto, sin excepción."
  - id: b
    correct: true
    text:
      es: "exentas del IVA en virtud del artículo 20 de la Ley del Impuesto, con las excepciones que el propio artículo señala."
  - id: c
    text:
      es: "sujetas al IVA cuyo importe no exceda de 400 euros, IVA incluido."
  - id: d
    text:
      es: "realizadas a consumidores finales por empresarios en régimen general."
  explanation:
    es: "El artículo 3.1.a) exime de factura las operaciones exentas por el artículo 20 de la Ley del IVA, con las excepciones que ese artículo señale. No vale cualquier exención. Las operaciones de hasta 400 euros se documentan con factura simplificada, no se dispensan, y las ventas a consumidores finales tampoco están exceptuadas."
  citation: "art. 3.1 RD 1619/2012"
  difficulty: 2
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2012-14696-art-3
- id: m03-l04-q0088
  prompt:
    es: "De acuerdo con el artículo 3.1.c) del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, los empresarios del régimen especial simplificado no están obligados a expedir factura, salvo que la determinación de las cuotas devengadas se efectúe en atención:"
  options:
  - id: a
    text:
      es: "al volumen de ingresos, y deben expedirla en todo caso por las ventas a consumidores finales."
  - id: b
    text:
      es: "al número de empleados, y deben expedirla en todo caso por las transmisiones de activos fijos."
  - id: c
    text:
      es: "al volumen de compras, y deben expedirla en todo caso por las entregas de inmuebles."
  - id: d
    correct: true
    text:
      es: "al volumen de ingresos, y deben expedirla en todo caso por las transmisiones de activos fijos."
  explanation:
    es: "En el régimen simplificado no hay obligación de expedir factura salvo que las cuotas se determinen por el volumen de ingresos, y en todo caso debe expedirse por las transmisiones de activos fijos del artículo 123.Uno.B).3.º de la Ley del IVA (art. 3.1.c). Número de empleados y volumen de compras no son criterios del precepto, y las entregas de inmuebles son la excepción del recargo de equivalencia."
  citation: "art. 3.1 RD 1619/2012"
  difficulty: 2
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2012-14696-art-3
- id: m03-l04-q0089
  prompt:
    es: "¿Qué órgano puede autorizar, según el artículo 3.1.d) del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, que no se expida factura en relación con sectores empresariales o profesionales o empresas determinadas?"
  options:
  - id: a
    text:
      es: "La Dirección General de Tributos del Ministerio de Hacienda."
  - id: b
    correct: true
    text:
      es: "El Departamento de Gestión Tributaria de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "El Departamento de Inspección Financiera y Tributaria de la Agencia Estatal de Administración Tributaria."
  - id: d
    text:
      es: "El Departamento de Recaudación de la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "El artículo 3.1.d) atribuye la autorización al Departamento de Gestión Tributaria de la Agencia Estatal de Administración Tributaria, y el artículo 4.3 le da también la de la factura simplificada en supuestos distintos. Ni la Dirección General de Tributos ni los Departamentos de Inspección o de Recaudación figuran en el reglamento para esta autorización."
  citation: "art. 3.1 RD 1619/2012"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2012-14696-art-3
- id: m03-l04-q0090
  prompt:
    es: "De acuerdo con el artículo 3.3 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, los empresarios o profesionales acogidos al régimen especial de la agricultura, ganadería y pesca no están obligados a expedir factura, pero deben expedirla en todo caso por:"
  options:
  - id: a
    text:
      es: "las entregas de bienes a otros empresarios por importe superior a 400 euros."
  - id: b
    text:
      es: "las transmisiones de activos fijos del artículo 123.Uno.B).3.º de la Ley del IVA."
  - id: c
    correct: true
    text:
      es: "las entregas de inmuebles del segundo párrafo del apartado uno del artículo 129 de la Ley del IVA."
  - id: d
    text:
      es: "todas las operaciones realizadas con otros empresarios o profesionales."
  explanation:
    es: "En el régimen especial de la agricultura, ganadería y pesca no hay obligación de expedir factura, salvo, entre otras, las entregas de inmuebles del artículo 129.Uno, párrafo segundo, de la Ley del IVA (art. 3.3). Los activos fijos son la excepción del régimen simplificado. Ni existe una regla por importes ni se obliga a facturar todas las operaciones con empresarios."
  citation: "art. 3.3 RD 1619/2012"
  difficulty: 3
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0091
  prompt:
    es: "De acuerdo con el artículo 4.1 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, la obligación de expedir factura puede cumplirse mediante factura simplificada, además de cuando el importe no exceda de 400 euros, cuando:"
  options:
  - id: a
    text:
      es: "el destinatario sea una persona física que no actúe como empresario."
  - id: b
    text:
      es: "la operación esté exenta del IVA en virtud del artículo 20 de la Ley del Impuesto."
  - id: c
    text:
      es: "el destinatario solicite expresamente una factura con menos datos."
  - id: d
    correct: true
    text:
      es: "deba expedirse una factura rectificativa."
  explanation:
    es: "Según el artículo 4.1.b), la factura simplificada es posible cuando deba expedirse una factura rectificativa. Que el destinatario sea persona física no basta, las operaciones exentas del artículo 20 quedan sin obligación de factura (art. 3.1.a), y la petición del destinatario no es una causa que prevea el reglamento."
  citation: "art. 4.1 RD 1619/2012"
  difficulty: 1
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0094
  prompt:
    es: "¿Cuál de las siguientes operaciones permite factura simplificada hasta 3.000 euros, IVA incluido, según el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación?"
  options:
  - id: a
    text:
      es: "Los transportes de mercancías entre empresarios."
  - id: b
    text:
      es: "Los servicios de asesoría prestados a empresarios."
  - id: c
    text:
      es: "Las entregas de bienes de equipo a empresarios."
  - id: d
    correct: true
    text:
      es: "Los transportes de personas y sus equipajes."
  explanation:
    es: "El artículo 4.2.d) incluye los transportes de personas y sus equipajes. El transporte de mercancías, la asesoría y la entrega de bienes de equipo a empresarios no están en la lista cerrada de operaciones de ese artículo."
  citation: "art. 4.2 RD 1619/2012"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0096
  prompt:
    es: "¿Para cuál de las siguientes operaciones NO puede expedirse factura simplificada según el artículo 4.4 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación?"
  options:
  - id: a
    text:
      es: "Las ventas al por menor a consumidores finales por importe de hasta 3.000 euros."
  - id: b
    correct: true
    text:
      es: "Las entregas de bienes destinados a otro Estado miembro a que se refiere el artículo 25 de la Ley del IVA."
  - id: c
    text:
      es: "Los servicios de peluquería prestados por institutos de belleza."
  - id: d
    text:
      es: "Las facturas rectificativas que deban expedirse."
  explanation:
    es: "El artículo 4.4.a) excluye de la factura simplificada las entregas de bienes destinados a otro Estado miembro del artículo 25 de la Ley del IVA. Las ventas al por menor y los servicios de peluquería entran en la lista del artículo 4.2, y la factura rectificativa es una de las causas que permite la simplificada (art. 4.1.b)."
  citation: "art. 4.4 RD 1619/2012"
  difficulty: 2
  tags:
  - "requisito"
