# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q258
  prompt:
    es: "El límite máximo que fija el artículo 60.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria para los anticipos de Tesorería en cada ejercicio se calcula sobre:"
  options:
  - id: a
    text:
      es: "los ingresos previstos en el presupuesto del Estado para el ejercicio de que se trate."
  - id: b
    text:
      es: "los créditos de la sección del ministerio que solicita el anticipo de Tesorería."
  - id: c
    text:
      es: "el saldo de la Tesorería a 31 de diciembre del ejercicio anterior al del anticipo."
  - id: d
    correct: true
    text:
      es: "los créditos autorizados al Estado por la Ley de Presupuestos Generales del Estado para ese ejercicio."
  explanation:
    es: "El artículo 60.1 mide el límite, el uno por ciento, sobre los créditos autorizados al Estado por la Ley de Presupuestos Generales del Estado. No se calcula sobre los ingresos previstos, ni sobre los créditos de una sección, ni sobre el saldo de la Tesorería."
  citation: "art. 60.1 LGP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q260
  prompt:
    es: "Según el artículo 60.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Gobierno puede conceder un anticipo de Tesorería cuando, iniciada la tramitación de un crédito extraordinario o suplemento:"
  options:
  - id: a
    text:
      es: "haya informado favorablemente la Intervención General de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "haya dictaminado favorablemente el Consejo de Estado."
  - id: c
    text:
      es: "haya aprobado el Congreso de los Diputados el proyecto de ley."
  - id: d
    text:
      es: "haya autorizado el Ministro de Hacienda la minoración de otros créditos."
  explanation:
    es: "La letra a) exige que, iniciada la tramitación de los expedientes de crédito extraordinario o suplemento, haya dictaminado favorablemente el Consejo de Estado. Un informe de la Intervención General, la aprobación del Congreso o una autorización del Ministro de Hacienda no son el requisito de esa letra."
  citation: "art. 60.1.a) LGP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q261
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, puede concederse un anticipo de Tesorería cuando se haya promulgado una ley que establezca obligaciones cuyo cumplimiento exija conceder:"
  options:
  - id: a
    text:
      es: "una ampliación de crédito o una incorporación de remanentes."
  - id: b
    text:
      es: "una generación de crédito o una transferencia entre secciones."
  - id: c
    correct: true
    text:
      es: "un crédito extraordinario o un suplemento de crédito."
  - id: d
    text:
      es: "una aportación del Estado a un organismo autónomo."
  explanation:
    es: "La letra b) se refiere a una ley promulgada cuyas obligaciones exijan un crédito extraordinario o un suplemento de crédito. Ampliación, incorporación, generación, transferencia y aportación a organismos son otras figuras, y el artículo 60.1 no las menciona."
  citation: "art. 60.1.b) LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q263
  prompt:
    es: "Cuando se cancela un anticipo de Tesorería, el artículo 60.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria dispone que se haga con cargo a los créditos del departamento o del organismo autónomo cuya minoración ocasione:"
  options:
  - id: a
    correct: true
    text:
      es: "menos trastornos para el servicio público."
  - id: b
    text:
      es: "menor importe de obligaciones pendientes de reconocer."
  - id: c
    text:
      es: "menor repercusión sobre el Fondo de Contingencia."
  - id: d
    text:
      es: "menos retrasos en los pagos del ejercicio siguiente."
  explanation:
    es: "El criterio del artículo 60.3 es que la minoración ocasione menos trastornos para el servicio público. El importe de las obligaciones pendientes, el Fondo de Contingencia y los retrasos de pago del ejercicio siguiente no son criterios que cite el artículo."
  citation: "art. 60.3 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q265
  prompt:
    es: "Una transferencia entre créditos para operaciones corrientes de dos programas de una misma sección presupuestaria, según el artículo 52.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "queda prohibida, porque la letra b) impide transferir entre programas de distinto servicio."
  - id: b
    correct: true
    text:
      es: "no choca con ninguna de sus restricciones, que no alcanzan a los traspasos entre programas de una sección."
  - id: c
    text:
      es: "queda prohibida, salvo que los dos programas pertenezcan además al mismo servicio."
  - id: d
    text:
      es: "solo es posible si el Gobierno la acuerda a propuesta del Ministro de Hacienda."
  explanation:
    es: "Las restricciones del artículo 52.1 se refieren a operaciones financieras, a créditos de capital hacia corrientes, a distintas secciones, a créditos extraordinarios, suplementados o ampliados y a créditos ampliables de la Seguridad Social. Pasar crédito corriente entre programas de una misma sección no cae en ninguna. Lo que cambia con el servicio es quién la autoriza, no si es posible: dentro de un servicio, el titular del ministerio (art. 63.1.a)); entre servicios, el Ministro de Hacienda (art. 62.1.a)). El Gobierno solo interviene en las transferencias entre secciones."
  citation: "art. 52.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q267
  prompt:
    es: "La condición que el artículo 63.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, pone a las transferencias que autoriza el titular del ministerio es que:"
  options:
  - id: a
    text:
      es: "no minoren créditos del capítulo 2 destinados a la compra de bienes corrientes y servicios."
  - id: b
    correct: true
    text:
      es: "no afecten a créditos de personal ni incrementen los créditos que enumera el apartado 2 del artículo 43."
  - id: c
    text:
      es: "no creen créditos nuevos de ninguna clase, ni siquiera para inversiones reales."
  - id: d
    text:
      es: "no superen el diez por ciento del crédito inicial del programa del que se transfiere."
  explanation:
    es: "El artículo 63.1.a) limita la competencia del titular a transferencias que no afecten a los créditos de personal ni incrementen los del artículo 43.2; si los afectan, corresponde al Ministro de Hacienda por el artículo 62.1.a). El capítulo 2 es precisamente el de bienes corrientes y servicios, el artículo permite crear créditos nuevos para esos gastos y para inversiones reales, y no fija ningún porcentaje del crédito inicial."
  citation: "art. 63.1.a) LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "competencia"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q268
  prompt:
    es: "Según el artículo 63.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las transferencias que autoriza el titular del ministerio pueden incluso crear créditos nuevos cuando estén destinados a:"
  options:
  - id: a
    text:
      es: "subvenciones nominativas a entidades privadas sin ánimo de lucro."
  - id: b
    text:
      es: "la adquisición de activos financieros de entidades públicas."
  - id: c
    correct: true
    text:
      es: "la compra de bienes corrientes y servicios o a inversiones reales."
  - id: d
    text:
      es: "las retribuciones de personal de nuevo ingreso en el departamento."
  explanation:
    es: "El artículo 63.1.a) permite crear créditos nuevos solo en el caso de los destinados a compra de bienes corrientes y servicios o a inversiones reales. Los créditos para subvenciones nominativas quedan fuera, porque el artículo 52.3 impide que las transferencias los creen, los activos financieros no figuran en la lista y los de personal están excluidos de la competencia del titular."
  citation: "art. 63.1.a) LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-52
- id: m05-l02-q269
  prompt:
    es: "Las transferencias que se efectúen para dar cumplimiento a la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español quedan, según el artículo 52.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    text:
      es: "sometidas a todas las restricciones del apartado 1, aunque sin informe previo."
  - id: b
    text:
      es: "reservadas en todo caso al Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: c
    text:
      es: "limitadas al uno por ciento de los créditos autorizados al Estado en el ejercicio."
  - id: d
    correct: true
    text:
      es: "fuera de las restricciones del apartado 1 de ese artículo."
  explanation:
    es: "El artículo 52.2 enumera entre las transferencias que no quedan afectadas por las restricciones del apartado 1 las que se efectúen para dar cumplimiento a la Ley 16/1985. No las somete a esas restricciones, no las reserva al Consejo de Ministros y el uno por ciento es el límite de los anticipos de Tesorería del artículo 60.1, no de estas transferencias."
  citation: "art. 52.2 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "concepto"
# anchor: boe-a-2022-22128-art-10
- id: m05-l02-q270
  prompt:
    es: "¿Qué restricción del artículo 52.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, queda sin aplicar a las transferencias del artículo 9.Dos, apartados 2 a 5, de la Ley 31/2022, de 23 de diciembre?"
  options:
  - id: a
    correct: true
    text:
      es: "La que impide transferir entre créditos de distintas secciones presupuestarias."
  - id: b
    text:
      es: "La que impide minorar créditos extraordinarios o suplementados en el ejercicio."
  - id: c
    text:
      es: "La que impide transferir desde créditos financieros al resto de los créditos."
  - id: d
    text:
      es: "La que impide minorar créditos ampliables de la Seguridad Social, salvo para financiar otros ampliables."
  explanation:
    es: "El artículo 10.Dos de la Ley 31/2022 declara no aplicables las limitaciones del artículo 52.1.b) cuando las transferencias se efectúan en uso de la autorización de los apartados 2, 3, 4 y 5 del artículo 9.Dos, es decir, la prohibición de transferir entre secciones. Las otras tres restricciones, sobre créditos extraordinarios o suplementados, sobre créditos financieros y sobre créditos ampliables de la Seguridad Social, siguen vigentes para esas transferencias."
  citation: "art. 10.Dos Ley 31/2022"
  difficulty: 3
  tags:
  - "excepción"
  - "concepto"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q271
  prompt:
    es: "Según el artículo 9.Siete de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿quién autoriza en su presupuesto las transferencias entre créditos del capítulo 1 de programas distintos de un organismo autónomo?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, previo informe de la Intervención Delegada."
  - id: b
    correct: true
    text:
      es: "Su presidente o su director, que actúan sobre su propio presupuesto."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: d
    text:
      es: "El Director General de Presupuestos del Ministerio de Hacienda."
  explanation:
    es: "El artículo 9.Siete atribuye a los presidentes o directores de los organismos autónomos autorizar en sus respectivos presupuestos las transferencias entre créditos del capítulo 1, aunque afecten a distintos servicios o programas, con exclusión de los incentivos al rendimiento y los gastos sociales. Ni el Ministro de Hacienda, ni el Consejo de Ministros, ni la Dirección General de Presupuestos tienen aquí competencia."
  citation: "art. 9.Siete Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q273
  prompt:
    es: "Si las Cortes Generales no aprueban el proyecto de ley de concesión del crédito extraordinario o del suplemento, ¿quién dispone la cancelación del anticipo de Tesorería según el artículo 60.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, previo dictamen del Consejo de Estado."
  - id: b
    text:
      es: "Las Cortes Generales, a propuesta del Gobierno."
  - id: c
    text:
      es: "El Gobierno, a propuesta del titular del departamento que recibió el anticipo."
  - id: d
    correct: true
    text:
      es: "El Gobierno, a propuesta del Ministro de Hacienda."
  explanation:
    es: "El artículo 60.3 dispone que el Gobierno, a propuesta del Ministro de Hacienda, cancela el anticipo con cargo a los créditos del departamento ministerial u organismo autónomo cuya minoración ocasione menos trastornos para el servicio público. No lo cancela el Ministro de Hacienda por sí solo ni con dictamen del Consejo de Estado, ni lo hacen las Cortes, que son las que han rechazado el proyecto, ni se propone a iniciativa del departamento beneficiario."
  citation: "art. 60.3 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-60
- id: m05-l02-q277
  prompt:
    es: "Según el artículo 60.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué órgano puede conceder, con carácter excepcional, los anticipos de Tesorería para atender gastos inaplazables?"
  options:
  - id: a
    text:
      es: "Las Cortes Generales."
  - id: b
    text:
      es: "El Consejo de Estado."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    correct: true
    text:
      es: "El Gobierno."
  explanation:
    es: "El artículo 60.1 atribuye al Gobierno, con carácter excepcional, conceder anticipos de Tesorería para atender gastos inaplazables. Las Cortes Generales aprueban la ley de concesión del crédito, no el anticipo; el Consejo de Estado solo dictamina en el supuesto de la letra a), y la Intervención General no concede anticipos."
  citation: "art. 60.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
