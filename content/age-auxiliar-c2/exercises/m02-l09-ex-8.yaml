# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q127
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función EXTRAE?"
  options:
  - id: a
    text:
      es: "Devuelve los caracteres del lado izquierdo de un valor de texto"
  - id: b
    text:
      es: "Devuelve el número de caracteres de una cadena de texto dada"
  - id: c
    correct: true
    text:
      es: "Devuelve un número específico de caracteres de una cadena de texto desde una posición"
  - id: d
    text:
      es: "Divide las cadenas de texto mediante delimitadores de columna y fila"
  explanation:
    es: "EXTRAE devuelve un número específico de caracteres de una cadena de texto a partir de la posición que se especifique. Los caracteres del lado izquierdo son de IZQUIERDA, el número de caracteres es de LARGO y dividir por delimitadores es de DIVIDIRTEXTO."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de texto»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q128
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función DIVIDIRTEXTO?"
  options:
  - id: a
    correct: true
    text:
      es: "Divide las cadenas de texto mediante delimitadores de columna y fila"
  - id: b
    text:
      es: "Combina el texto de varios rangos o cadenas"
  - id: c
    text:
      es: "Devuelve una matriz de valores de texto de cualquier rango especificado"
  - id: d
    text:
      es: "Devuelve los caracteres del lado izquierdo de un valor de texto"
  explanation:
    es: "DIVIDIRTEXTO divide las cadenas de texto mediante delimitadores de columna y fila. Combinar el texto de varios rangos lo hace la función de unión de texto, devolver una matriz de valores de texto es de MATRIZATEXTO y los caracteres de la izquierda son de IZQUIERDA."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de texto»"
  difficulty: 1
  tags:
  - "función"
