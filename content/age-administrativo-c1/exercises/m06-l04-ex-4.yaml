# anchor: fuente-ms-word-macros-html
- id: m06-l04-q148
  prompt:
    es: "En Word 365, ¿en cuál de las siguientes ubicaciones se selecciona Macros para escribir una macro desde cero en Visual Basic?"
  options:
  - id: a
    text:
      es: "En la pestaña Revisar, grupo Idioma"
  - id: b
    text:
      es: "En la pestaña Referencias, grupo Índice"
  - id: c
    text:
      es: "En la pestaña Correspondencia, grupo Código"
  - id: d
    correct: true
    text:
      es: "En la pestaña Programador, grupo Código"
  explanation:
    es: "La página dice: «En la pestaña Programador, en el grupo Código, seleccione Macros». La pestaña Revisar, según la página de atajos de Word, sirve «para usar la Revisión ortográfica, establecer los idiomas de revisión y para realizar un seguimiento y revisar los cambios de su documento». La pestaña Referencias, «para agregar una tabla de contenido, notas al pie, o una tabla de citas». Y la pestaña Correspondencia, «para administrar tareas de combinación de correspondencia y para trabajar con sobres y etiquetas»."
  citation: "fuente: `ms-word-macros.html`; «Escribir una macro desde cero en Visual Basic»"
