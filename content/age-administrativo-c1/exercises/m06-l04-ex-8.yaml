    es: "En Word 365, ¿qué elementos de la cinta de opciones se pueden renombrar al personalizar la cinta?"
  options:
  - id: a
    text:
      es: "Solo las pestañas y los grupos personalizados"
  - id: b
    text:
      es: "Todos los comandos, también los predeterminados"
  - id: c
    correct: true
    text:
      es: "Pestañas y grupos, y comandos de grupos personalizados"
  - id: d
    text:
      es: "Solo los comandos, no las pestañas ni los grupos"
  explanation:
    es: "La página dice: «Puede cambiar el nombre de una pestaña o grupo predeterminado o personalizado. Solo puede cambiar el nombre de los comandos que haya agregado a un grupo personalizado». La página dice que también se puede cambiar el nombre de una pestaña o grupo predeterminado. No es posible cambiar el nombre de los comandos predeterminados. La página dice que se puede cambiar el nombre de una pestaña o grupo."
