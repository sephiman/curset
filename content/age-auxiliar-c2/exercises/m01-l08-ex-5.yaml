# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q139
  prompt:
    es: "Según el artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿de quién depende inmediatamente el Subdelegado del Gobierno en cada provincia de las Comunidades Autónomas pluriprovinciales?"
  options:
  - id: a
    text:
      es: "Del Ministro del Interior."
  - id: b
    correct: true
    text:
      es: "Del Delegado del Gobierno."
  - id: c
    text:
      es: "Del Presidente de la Comunidad Autónoma."
  - id: d
    text:
      es: "Del Secretario General de la Delegación."
  explanation:
    es: "El artículo 69.4 pone al Subdelegado bajo la inmediata dependencia del Delegado del Gobierno. No depende del Ministro del Interior, ni del Presidente autonómico, ni del Secretario General, que gestiona los servicios comunes de la Delegación."
  citation: "art. 69.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q140
  prompt:
    es: "Conforme al artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en las Comunidades Autónomas uniprovinciales pueden crearse Subdelegaciones del Gobierno, cuando la población o el volumen de gestión lo justifiquen, mediante:"
  options:
  - id: a
    text:
      es: "Ley orgánica."
  - id: b
    text:
      es: "Orden del Ministro del Interior."
  - id: c
    text:
      es: "Acuerdo del Consejo de Gobierno de la Comunidad."
  - id: d
    correct: true
    text:
      es: "Real Decreto."
  explanation:
    es: "El artículo 69.4 prevé que se creen por Real Decreto. No se exige una ley orgánica, ni basta una orden del Ministro del Interior, ni es competente el Consejo de Gobierno de la Comunidad, que no forma parte de la Administración General del Estado."
  citation: "art. 69.4 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q141
  prompt:
    es: "Conforme al artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en una Comunidad Autónoma pluriprovincial existe un Subdelegado del Gobierno:"
  options:
  - id: a
    text:
      es: "Solo en la provincia donde radique la sede de la Delegación."
  - id: b
    text:
      es: "En cada partido judicial."
  - id: c
    correct: true
    text:
      es: "En cada provincia."
  - id: d
    text:
      es: "En cada comarca."
  explanation:
    es: "El artículo 69.4 prevé un Subdelegado en cada provincia de las Comunidades pluriprovinciales. No existe solo en la provincia de la sede, y ni los partidos judiciales ni las comarcas son la circunscripción de las Subdelegaciones."
  citation: "art. 69.4 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-2015-10566-art-71
