# anchor: boe-a-2003-23186-art-210
- id: m03-l13-q0181
  prompt:
    es: "De acuerdo con el artículo 210.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la propuesta de sanción se incorpora al acuerdo de iniciación, este se notifica al interesado indicándole la puesta de manifiesto del expediente y concediéndole un plazo para alegar y presentar documentos, justificantes y pruebas de:"
  options:
  - id: a
    correct: true
    text:
      es: "Quince días desde la notificación del acuerdo."
  - id: b
    text:
      es: "Seis meses desde la notificación del acuerdo de inicio."
  - id: c
    text:
      es: "Diez días desde la notificación del acuerdo."
  - id: d
    text:
      es: "Un mes desde la notificación del acuerdo."
  explanation:
    es: "El plazo del artículo 210.5 LGT es de 15 días, igual que el del 210.4. Los 10 días son los de las alegaciones tras la rectificación de la propuesta (artículo 24.2 RGRST), el mes es el de la conformidad del artículo 211.1 y los seis meses el plazo máximo de duración."
  citation: "art. 210.5 LGT"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0187
  prompt:
    es: "¿Qué ocurre con la tramitación del procedimiento sancionador cuando el obligado tributario renuncia a la tramitación separada, de acuerdo con el artículo 208.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que se tramita separadamente, pero por el mismo órgano que el de aplicación de los tributos."
  - id: b
    text:
      es: "Que se tramita antes que el procedimiento de aplicación de los tributos."
  - id: c
    text:
      es: "Que se archiva, porque sin tramitación separada no puede imponerse sanción."
  - id: d
    correct: true
    text:
      es: "Que se tramita conjuntamente con el procedimiento de aplicación de los tributos."
  explanation:
    es: "Según el artículo 208.1 LGT, la renuncia a la tramitación separada hace que el procedimiento sancionador se tramite conjuntamente con el de aplicación de los tributos. No pasa a tramitarse antes ni se archiva, y tampoco sigue siendo separado."
  citation: "art. 208.1 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-207
- id: m03-l13-q0188
  prompt:
    es: "Según el artículo 207 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la regulación del procedimiento sancionador en materia tributaria:"
  options:
  - id: a
    text:
      es: "Se regula por las normas del título III de la ley, relativas a los procedimientos de aplicación de los tributos."
  - id: b
    text:
      es: "Se regula por las normas del título V de la ley, relativas a la revisión en vía administrativa."
  - id: c
    correct: true
    text:
      es: "Se regula por las normas especiales del título IV de la ley y su normativa reglamentaria de desarrollo."
  - id: d
    text:
      es: "Se regula únicamente por las normas del procedimiento sancionador en materia administrativa."
  explanation:
    es: "El artículo 207 LGT somete el procedimiento a las normas especiales del título IV y a su reglamento de desarrollo, y solo en su defecto al procedimiento sancionador administrativo. No se rige únicamente por este ni por los títulos III y V."
  citation: "art. 207 LGT"
  difficulty: 3
  tags:
  - "remisión"
# anchor: boe-a-2003-23186-art-208
- id: m03-l13-q0189
  prompt:
    es: "Conforme al artículo 208.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las cuestiones relativas a las infracciones en los supuestos de actas con acuerdo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se analizan en el procedimiento de aplicación de los tributos, y la propuesta de sanción se incluye en el acta con acuerdo."
  - id: b
    text:
      es: "Se analizan en el procedimiento sancionador, pero la renuncia a su tramitación separada no se hace constar en el acta con acuerdo."
  - id: c
    text:
      es: "Se analizan en el procedimiento de aplicación de los tributos, y la propuesta de sanción se notifica por separado."
  - id: d
    text:
      es: "Se analizan en un procedimiento sancionador separado, que se inicia tras la firma del acta con acuerdo."
  explanation:
    es: "En las actas con acuerdo, el artículo 208.2 LGT lleva las cuestiones sobre infracciones al procedimiento de aplicación de los tributos, hace constar la renuncia al procedimiento separado en el acta e incluye en ella la propuesta de sanción motivada. No hay procedimiento separado posterior ni notificación aparte."
  citation: "art. 208.2 LGT"
  difficulty: 3
  tags:
  - "actas con acuerdo"
  - "procedimiento"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0190
  prompt:
    es: "De acuerdo con el artículo 211.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la terminación del procedimiento sancionador en materia tributaria:"
  options:
  - id: a
    text:
      es: "Termina mediante resolución, por caducidad o por el pago voluntario de la sanción propuesta."
  - id: b
    text:
      es: "Termina únicamente mediante resolución expresa, sin que la caducidad sea una forma de terminación."
  - id: c
    text:
      es: "Termina mediante resolución, por caducidad o por renuncia del obligado tributario a la sanción."
  - id: d
    correct: true
    text:
      es: "Termina mediante resolución o por caducidad."
  explanation:
    es: "El artículo 211.1 LGT limita la terminación del procedimiento sancionador a dos formas: la resolución y la caducidad. No hay terminación por renuncia del obligado ni por pago de la sanción propuesta, y la caducidad sí está entre ellas."
  citation: "art. 211.1 LGT"
  difficulty: 1
  tags:
  - "procedimiento"
  - "terminación"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0191
  prompt:
    es: "Según el artículo 211.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el procedimiento sancionador iniciado como consecuencia de un procedimiento de inspección cuando el interesado presta su conformidad a la propuesta de resolución:"
  options:
  - id: a
    text:
      es: "Debe dictarse resolución expresa en el plazo de un mes desde la conformidad, y su falta produce la caducidad del procedimiento."
  - id: b
    text:
      es: "Se entiende dictada y notificada la resolución, de acuerdo con la propuesta, en el momento en que el interesado manifiesta su conformidad."
  - id: c
    correct: true
    text:
      es: "Se entiende dictada y notificada la resolución, de acuerdo con la propuesta, por el transcurso de un mes desde la fecha en que se manifestó la conformidad."
  - id: d
    text:
      es: "Se entiende dictada la resolución por el transcurso de seis meses desde que se manifestó la conformidad, sin necesidad de notificación."
  explanation:
    es: "El artículo 211.1 LGT entiende dictada y notificada la resolución, conforme a la propuesta, cuando pasa un mes desde la conformidad, sin nueva notificación expresa. No es inmediata, el plazo no es de seis meses y su transcurso produce la resolución presunta, no la caducidad."
  citation: "art. 211.1 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "conformidad"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0192
  prompt:
    es: "De acuerdo con el artículo 211.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la resolución se entiende dictada y notificada por el transcurso de un mes desde la conformidad del interesado a la propuesta, salvo que en dicho plazo el órgano competente notifique al interesado:"
  options:
  - id: a
    text:
      es: "Una nueva propuesta de resolución con un incremento en la cuantía de la sanción propuesta."
  - id: b
    text:
      es: "La resolución expresa del procedimiento, con indicación de los recursos que procedan."
  - id: c
    correct: true
    text:
      es: "Un acuerdo con alguno de los contenidos a los que se refieren los párrafos del apartado 3 del artículo 156."
  - id: d
    text:
      es: "Un acuerdo de ampliación del plazo máximo del procedimiento por otros seis meses."
  explanation:
    es: "El artículo 211.1 LGT exceptúa el caso en que el órgano competente notifique, dentro del mes, un acuerdo con alguno de los contenidos del artículo 156.3. No contempla una nueva propuesta con más sanción ni una ampliación del plazo, y notificar la resolución expresa sería lo mismo que dictarla, no una excepción."
  citation: "art. 211.1 LGT"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0194
  prompt:
    es: "De acuerdo con el artículo 211.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento sancionador se entiende concluido, a efectos del plazo máximo, en la fecha en que:"
  options:
  - id: a
    text:
      es: "Se intente la notificación de la resolución por primera vez, con independencia del resultado."
  - id: b
    text:
      es: "Se formule la propuesta de resolución por el instructor, una vez concluidas las actuaciones."
  - id: c
    text:
      es: "Se dicte el acto administrativo de resolución, aunque se notifique con posterioridad."
  - id: d
    correct: true
    text:
      es: "Se notifique el acto administrativo de resolución del mismo."
  explanation:
    es: "El artículo 211.2 LGT entiende que el procedimiento concluye en la fecha en que se notifica la resolución, no en la que se dicta. Para entender cumplida la obligación de notificar se aplican las reglas del artículo 104.2. La propuesta de resolución no concluye el procedimiento y el simple intento de notificación no basta si no hay las condiciones de ese artículo."
  citation: "art. 211.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0195
  prompt:
    es: "Según el artículo 211.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las circunstancias del artículo 150.5 que concurran en el procedimiento inspector del que trae causa el procedimiento sancionador:"
  options:
  - id: a
    correct: true
    text:
      es: "El plazo para concluir el procedimiento sancionador se extiende por el mismo período que resulte procedente de acuerdo con ese apartado."
  - id: b
    text:
      es: "El plazo para concluir el procedimiento sancionador se extiende, en todo caso, por seis meses adicionales."
  - id: c
    text:
      es: "El plazo para concluir el procedimiento sancionador no se ve afectado por esas circunstancias, que solo afectan a la duración de la inspección."
  - id: d
    text:
      es: "El plazo para concluir el procedimiento sancionador queda suspendido hasta que termine el procedimiento inspector."
  explanation:
    es: "El artículo 211.2 LGT dice que, si en el procedimiento inspector del que trae causa concurre alguna circunstancia del artículo 150.5, el plazo sancionador se extiende por el mismo período que corresponda con arreglo a ese apartado. No es una ampliación fija de seis meses, ni una suspensión, y sí le afectan."
  citation: "art. 211.2 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "extensión"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0197
  prompt:
    es: "De acuerdo con el artículo 211.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la resolución expresa del procedimiento sancionador contiene la fijación de los hechos, la valoración de las pruebas practicadas, la determinación de la infracción cometida, la identificación de la persona o entidad infractora y:"
  options:
  - id: a
    text:
      es: "La determinación de la sanción accesoria y la declaración de la responsabilidad solidaria de los administradores."
  - id: b
    text:
      es: "La cuantificación de la sanción, sin que deba indicar los criterios de graduación, que constan en la propuesta de resolución y en el acuerdo de inicio."
  - id: c
    text:
      es: "La cuantificación de la sanción y el plazo de interposición de recurso, con indicación del órgano ante el que se presenta."
  - id: d
    correct: true
    text:
      es: "La cuantificación de la sanción, con indicación de los criterios de graduación y de la reducción que proceda conforme al artículo 188."
  explanation:
    es: "El artículo 211.3 LGT exige cuantificar la sanción, con los criterios de graduación y la reducción del artículo 188 que proceda. No basta remitirse a la propuesta, y el texto no menciona entre su contenido el plazo de recurso ni la responsabilidad de administradores."
  citation: "art. 211.3 LGT"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0198
  prompt:
    es: "Cuando no procede sancionar, ¿qué contiene en su caso la resolución expresa del procedimiento sancionador, según el artículo 211.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La declaración de que la deuda tributaria queda extinguida por pago."
  - id: b
    correct: true
    text:
      es: "La declaración de inexistencia de infracción o responsabilidad."
  - id: c
    text:
      es: "La declaración de prescripción del derecho a imponer la sanción en todo caso."
  - id: d
    text:
      es: "La orden de archivo de las actuaciones por caducidad del procedimiento."
  explanation:
    es: "El artículo 211.3 LGT incluye, cuando proceda, la declaración de inexistencia de infracción o responsabilidad. La prescripción y la caducidad son causas distintas, con otro régimen, y el pago de la deuda no es lo que declara la resolución sancionadora."
  citation: "art. 211.3 LGT"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0199
  prompt:
    es: "De acuerdo con el artículo 211.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la declaración de caducidad del procedimiento sancionador puede dictarse:"
  options:
  - id: a
    text:
      es: "Solo a instancia del interesado, y ordena la devolución de las cantidades ingresadas."
  - id: b
    correct: true
    text:
      es: "De oficio o a instancia del interesado, y ordena el archivo de las actuaciones."
  - id: c
    text:
      es: "Solo de oficio, y ordena la retroacción de las actuaciones al momento de la propuesta."
  - id: d
    text:
      es: "De oficio o a instancia del interesado, y ordena la reanudación del procedimiento con nuevo plazo."
  explanation:
    es: "El artículo 211.4 LGT permite declarar la caducidad de oficio o a instancia del interesado, y ordena el archivo de las actuaciones. No es solo a instancia, no retrotrae actuaciones y no reanuda el procedimiento."
  citation: "art. 211.4 LGT"
  difficulty: 2
  tags:
  - "caducidad"
  - "efecto"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0200
  prompt:
    es: "Conforme al artículo 211.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los efectos de la caducidad del procedimiento sancionador:"
  options:
  - id: a
    text:
      es: "Permite iniciar un nuevo procedimiento sancionador, mientras no haya prescrito la infracción."
  - id: b
    correct: true
    text:
      es: "Impide la iniciación de un nuevo procedimiento sancionador."
  - id: c
    text:
      es: "Impide iniciar un nuevo procedimiento, salvo que se trate de infracciones graves o muy graves."
  - id: d
    text:
      es: "Permite iniciar un nuevo procedimiento sancionador, siempre que no hayan transcurrido seis meses."
  explanation:
    es: "El artículo 211.4 LGT dice que la caducidad impide la iniciación de un nuevo procedimiento sancionador. No hay segunda oportunidad dentro de seis meses ni hasta la prescripción, y no distingue por la gravedad de la infracción."
  citation: "art. 211.4 LGT"
  difficulty: 1
  tags:
  - "caducidad"
  - "efecto"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0201
  prompt:
    es: "¿Qué produce el vencimiento del plazo máximo del procedimiento sancionador sin que se haya notificado resolución expresa, de acuerdo con el artículo 211.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La caducidad del procedimiento."
  - id: b
    text:
      es: "La prescripción de la infracción tributaria."
  - id: c
    text:
      es: "La terminación del procedimiento por silencio administrativo positivo."
  - id: d
    text:
      es: "La resolución presunta favorable al obligado tributario."
  explanation:
    es: "El artículo 211.4 LGT liga el vencimiento del plazo sin resolución expresa a la caducidad. No produce la prescripción de la infracción, ni una resolución presunta ni silencio positivo: la caducidad exige además declararse y archivar."
  citation: "art. 211.4 LGT"
  difficulty: 1
  tags:
  - "caducidad"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0202
  prompt:
    es: "¿Qué órgano es competente para imponer la sanción de suspensión del ejercicio de profesiones oficiales, empleo o cargo público, según el artículo 211.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: b
    text:
      es: "El Ministro de Hacienda, o el órgano en quien delegue."
  - id: c
    text:
      es: "El órgano competente para el reconocimiento del beneficio o incentivo fiscal."
  - id: d
    text:
      es: "El órgano competente para liquidar la deuda tributaria de la que deriva la sanción."
  explanation:
    es: "El artículo 211.5.a LGT atribuye al Consejo de Ministros la sanción de suspensión del ejercicio de profesiones oficiales, empleo o cargo público. El Ministro de Hacienda impone las sanciones de pérdida de beneficios o subvenciones y la prohibición de contratar, y las otras dos opciones son competentes en los demás supuestos de las letras c y d."
  citation: "art. 211.5 LGT"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0203
  prompt:
    es: "De acuerdo con el artículo 211.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son órganos competentes para imponer las sanciones que consistan en la pérdida de la posibilidad de obtener subvenciones o ayudas públicas o en la prohibición de contratar con la Administración pública correspondiente:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, el órgano equivalente de las comunidades autónomas y el órgano competente de las entidades locales."
  - id: b
    correct: true
    text:
      es: "El Ministro de Hacienda, el órgano equivalente de las comunidades autónomas, el órgano competente de las entidades locales u órganos en quienes deleguen."
  - id: c
    text:
      es: "El órgano competente para liquidar o el órgano superior inmediato de la unidad administrativa que propuso el inicio."
  - id: d
    text:
      es: "El Director General de la Agencia Estatal de Administración Tributaria o el órgano en quien delegue."
  explanation:
    es: "El artículo 211.5.b LGT atribuye esas sanciones al Ministro de Hacienda, al órgano equivalente de las comunidades autónomas, al competente de las entidades locales o a quienes deleguen. El Consejo de Ministros solo impone la suspensión de profesiones oficiales. El órgano que liquida es el competente para las sanciones pecuniarias, y el Director General de la AEAT no figura."
  citation: "art. 211.5 LGT"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0204
  prompt:
    es: "Según el artículo 211.5.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué órgano impone la sanción que consiste en la pérdida del derecho a aplicar un beneficio o incentivo fiscal, salvo lo dispuesto para el Ministro de Hacienda?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: b
    text:
      es: "El órgano superior inmediato de la unidad que propuso el inicio del procedimiento."
  - id: c
    correct: true
    text:
      es: "El órgano competente para el reconocimiento del beneficio o incentivo fiscal."
  - id: d
    text:
      es: "El órgano competente para liquidar la deuda tributaria que corresponda."
  explanation:
    es: "El artículo 211.5.c LGT atribuye la sanción de pérdida del beneficio o incentivo fiscal al órgano competente para reconocerlo. El órgano que liquida o su superior inmediato es el competente en el resto de casos (letra d), y el Consejo de Ministros solo impone la suspensión de profesiones oficiales."
  citation: "art. 211.5 LGT"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-211
- id: m03-l13-q0205
  prompt:
    es: "Según el artículo 211.5.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué órgano es competente para imponer las sanciones que no encajan en las letras anteriores del mismo artículo?"
  options:
  - id: a
    text:
      es: "El órgano que haya instruido el procedimiento sancionador, que dicta también la propuesta de resolución."
  - id: b
    correct: true
    text:
      es: "El órgano competente para liquidar o el órgano superior inmediato de la unidad administrativa que ha propuesto el inicio del procedimiento sancionador."
  - id: c
    text:
      es: "El Director del departamento de la Agencia Estatal de Administración Tributaria competente por razón de la materia."
  - id: d
    text:
      es: "El Ministro de Hacienda, el órgano equivalente de las comunidades autónomas o el de las entidades locales."
  explanation:
    es: "La letra d del artículo 211.5 LGT atribuye el resto de las sanciones al órgano competente para liquidar o al superior inmediato de la unidad que propuso el inicio. El instructor propone y no resuelve, el Director de departamento no figura en el artículo y el Ministro impone solo las sanciones de la letra b."
  citation: "art. 211.5 LGT"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-212
- id: m03-l13-q0206
  prompt:
    es: "Según el artículo 212.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el recurso contra el acto de resolución del procedimiento sancionador:"
  options:
  - id: a
    text:
      es: "Solo puede impugnarse junto con la liquidación de la deuda tributaria de la que deriva."
  - id: b
    text:
      es: "Puede ser objeto de recurso, pero no de reclamación económico-administrativa."
