# anchor: boe-a-2000-323-art-606
- id: m03-l12-q0230
  prompt:
    es: "¿Cuáles de los siguientes bienes son inembargables del ejecutado, según el artículo 606 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil?"
  options:
  - id: a
    text:
      es: "Los bienes que carezcan por sí solos de contenido patrimonial, aunque no estén declarados inembargables por la ley."
  - id: b
    text:
      es: "Las joyas y objetos de valor histórico del ejecutado que no sean de uso personal."
  - id: c
    correct: true
    text:
      es: "Los bienes sacros y los dedicados al culto de las religiones legalmente registradas."
  - id: d
    text:
      es: "Los animales de compañía y las rentas que los mismos puedan generar."
  explanation:
    es: "Los bienes sacros y los dedicados al culto de las religiones legalmente registradas figuran en el artículo 606.3.º LEC. Los animales de compañía son inembargables en absoluto (art. 605), aunque sus rentas sí se pueden embargar. Los bienes sin contenido patrimonial también están en el artículo 605. Las joyas y objetos de valor histórico no figuran como inembargables."
  citation: "art. 606 LEC"
  difficulty: 2
  tags:
  - "inembargabilidad"
# anchor: boe-a-2000-323-art-606
- id: m03-l12-q0231
  prompt:
    es: "¿Qué mobiliario y ropas del ejecutado y de su familia son inembargables, según el artículo 606.1.º de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil?"
  options:
  - id: a
    correct: true
    text:
      es: "El mobiliario y el menaje de la casa y las ropas, en lo que no pueda considerarse superfluo."
  - id: b
    text:
      es: "El mobiliario y el menaje de la casa cuyo valor no exceda del salario mínimo interprofesional."
  - id: c
    text:
      es: "Solo el mobiliario de los dormitorios y las ropas de uso diario del ejecutado."
  - id: d
    text:
      es: "Todo el mobiliario y el menaje de la casa y las ropas, incluso los de carácter superfluo."
  explanation:
    es: "Lo inembargable es el mobiliario, el menaje y las ropas del ejecutado y su familia en lo que no sea superfluo (art. 606.1.º LEC). No lo es lo superfluo. Tampoco se limita a los dormitorios, ni se mide con el salario mínimo interprofesional."
  citation: "art. 606 LEC"
  difficulty: 2
  tags:
  - "inembargabilidad"
# anchor: boe-a-2000-323-art-607
- id: m03-l12-q0233
  prompt:
    es: "¿Qué porcentaje se embarga de la cuantía adicional hasta el importe equivalente a un quinto salario mínimo interprofesional, según la escala del artículo 607.2 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil?"
  options:
  - id: a
    text:
      es: "El 50 por 100 de esa cuantía adicional."
  - id: b
    text:
      es: "El 60 por 100 de esa cuantía adicional."
  - id: c
    text:
      es: "El 90 por 100 de esa cuantía adicional."
  - id: d
    correct: true
    text:
      es: "El 75 por 100 de esa cuantía adicional."
  explanation:
    es: "El cuarto tramo, hasta el quinto salario mínimo, se embarga al 75 por 100 (art. 607.2.4.º LEC). El 60 por 100 es el tramo hasta el cuarto, el 90 por 100 lo que excede del quinto y el 50 por 100 el tramo hasta el tercero."
  citation: "art. 607.2 LEC"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-82
- id: m03-l12-q0242
  prompt:
    es: "Según el artículo 82.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el embargo de sueldos, salarios y pensiones se efectúa teniendo en cuenta lo establecido en:"
  options:
  - id: a
    correct: true
    text:
      es: "la Ley de Enjuiciamiento Civil."
  - id: b
    text:
      es: "la Ley General Tributaria, que fija las cuantías inembargables en su artículo 169."
  - id: c
    text:
      es: "el propio reglamento, que establece una escala específica para las deudas con la Hacienda pública."
  - id: d
    text:
      es: "la Ley del Salario Mínimo Interprofesional, que regula las cuantías embargables."
  explanation:
    es: "El reglamento remite a la Ley de Enjuiciamiento Civil, cuyo artículo 607 fija el mínimo inembargable y la escala (art. 82.1 RGR). El artículo 169 LGT trata el orden y las inembargabilidades en general, no la escala salarial. No existe una ley del salario mínimo que regule el embargo, y el reglamento no establece escala propia."
  citation: "art. 82.1 RGR"
  difficulty: 1
  tags:
  - "norma"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0260
  prompt:
    es: "¿Qué principio debe respetarse siempre al embargar los bienes y derechos del obligado tributario en cuantía suficiente para cubrir la deuda, según el artículo 169.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El principio de mayor rapidez en la enajenación de los bienes."
  - id: b
    text:
      es: "El principio de igualdad de trato entre los obligados tributarios."
  - id: c
    text:
      es: "El principio de menor onerosidad para la Hacienda pública."
  - id: d
    correct: true
    text:
      es: "El principio de proporcionalidad."
  explanation:
    es: "El artículo 169.1 LGT impone respetar siempre el principio de proporcionalidad al embargar. La menor onerosidad que menciona el artículo 169.2 es para el obligado, no para la Hacienda, y la rapidez o la igualdad de trato no son el principio que fija este apartado."
  citation: "art. 169.1 LGT"
  difficulty: 1
  tags:
  - "principio"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0261
  prompt:
    es: "¿Hasta cuándo se embargan sucesivamente los bienes o derechos conocidos por la Administración tributaria, siguiendo el orden establecido, según el artículo 169.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta que se presuma cubierta la deuda."
  - id: b
    text:
      es: "Hasta que se agote el patrimonio conocido del obligado tributario."
  - id: c
    text:
      es: "Hasta que se alcance el doble del importe de la deuda y las costas."
  - id: d
    text:
      es: "Hasta que el obligado tributario designe otros bienes de mayor valor."
  explanation:
    es: "Se embarga hasta que se presuma cubierta la deuda (art. 169.4 LGT), no hasta agotar el patrimonio ni hasta doblar el importe. La designación de otros bienes por el obligado solo permite alterar el orden si garantizan el cobro con la misma eficacia y prontitud."
  citation: "art. 169.4 LGT"
  difficulty: 1
  tags:
  - "criterio"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0277
  prompt:
    es: "Según el artículo 169.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, siguiendo el orden de embargo establecido, se embargan sucesivamente los bienes o derechos:"
  options:
  - id: a
    text:
      es: "inscritos en registros públicos, hasta que se agoten, y después los no inscritos."
  - id: b
    text:
      es: "de mayor valor de mercado, hasta que se alcance el importe de la deuda y de los intereses devengados."
  - id: c
    text:
      es: "que el obligado tributario haya incluido en su relación patrimonial, hasta cubrir el doble de la deuda."
  - id: d
    correct: true
    text:
      es: "conocidos en ese momento por la Administración tributaria, hasta que se presuma cubierta la deuda."
  explanation:
    es: "El embargo sigue el orden con los bienes conocidos por la Administración en ese momento, hasta que se presuma cubierta la deuda (art. 169.4 LGT). No se limita a los de la relación del obligado ni se busca el doble de la deuda, y el valor de mercado o la inscripción no son criterios de orden."
  citation: "art. 169.4 LGT"
  difficulty: 2
  tags:
  - "criterio"
# anchor: boe-a-2000-323-art-607
- id: m03-l12-q0284
  prompt:
    es: "Conforme al artículo 607 de la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil, señale la respuesta CORRECTA sobre el embargo de salarios, sueldos y pensiones:"
  options:
  - id: a
    correct: true
    text:
      es: "Es inembargable lo que no exceda del salario mínimo interprofesional y lo que supera esa cuantía se embarga conforme a una escala de porcentajes crecientes."
  - id: b
    text:
      es: "Es embargable la totalidad del salario, pero el ejecutado puede solicitar que se le deje el equivalente a un salario mínimo."
  - id: c
    text:
      es: "Es inembargable lo que no exceda del doble del salario mínimo interprofesional, y lo que supera esa cuantía se embarga al 50 por 100."
  - id: d
    text:
      es: "Es inembargable lo que no exceda del salario mínimo interprofesional, y lo que lo supera se embarga siempre al 30 por 100."
  explanation:
    es: "El salario mínimo interprofesional queda fuera del embargo y el exceso se embarga según una escala creciente: 30, 50, 60, 75 y 90 por 100 (art. 607.1 y 607.2 LEC). El doble del salario mínimo es el límite del primer tramo, no del mínimo inembargable. La totalidad no es embargable, y el 30 por 100 solo vale para el primer tramo."
  citation: "art. 607.1 LEC"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-169
- id: m03-l12-q0294
  prompt:
    es: "¿Cuál de los siguientes conceptos entra en la cuantía para cuya cobertura se embargan los bienes y derechos del obligado tributario, según el artículo 169.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los intereses devengados exclusivamente hasta la fecha de la providencia de apremio."
  - id: b
    correct: true
    text:
      es: "Los recargos del período ejecutivo."
  - id: c
    text:
      es: "Las sanciones pendientes de otros procedimientos del obligado."
  - id: d
    text:
      es: "Los recargos por declaración extemporánea sin requerimiento previo."
  explanation:
    es: "El embargo cubre la deuda no ingresada, los intereses hasta el ingreso en el Tesoro, los recargos del período ejecutivo y las costas del apremio (art. 169.1 LGT). Las sanciones de otros procedimientos y los recargos por declaración extemporánea no están en la lista. Los intereses llegan hasta el ingreso en el Tesoro, no hasta la providencia."
  citation: "art. 169.1 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0001
  prompt:
    es: "De acuerdo con el artículo 170.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, contra la diligencia de embargo solo son admisibles los siguientes motivos de oposición:"
  options:
  - id: a
    text:
      es: "Extinción de la deuda o prescripción del derecho a exigir el pago, falta de notificación de la providencia de apremio, incumplimiento de las normas reguladoras del embargo contenidas en la Ley de Enjuiciamiento Civil y suspensión del procedimiento de recaudación."
  - id: b
    text:
      es: "Extinción de la deuda o prescripción del derecho a exigir el pago, falta de notificación de la liquidación de la que deriva la deuda, incumplimiento de las normas reguladoras del embargo contenidas en la Ley General Tributaria y suspensión del procedimiento de recaudación."
  - id: c
    correct: true
    text:
      es: "Extinción de la deuda o prescripción del derecho a exigir el pago, falta de notificación de la providencia de apremio, incumplimiento de las normas reguladoras del embargo contenidas en la Ley General Tributaria y suspensión del procedimiento de recaudación."
  - id: d
    text:
      es: "Extinción de la deuda o prescripción del derecho a exigir el pago, falta de notificación de la providencia de apremio, incumplimiento de las normas reguladoras del embargo contenidas en la Ley General Tributaria y solicitud de aplazamiento o fraccionamiento de la deuda."
  explanation:
    es: "El artículo 170.3 LGT enumera cuatro motivos: extinción de la deuda o prescripción del derecho a exigir el pago, falta de notificación de la providencia de apremio, incumplimiento de las normas del embargo contenidas en la LGT y suspensión del procedimiento de recaudación. La falta de notificación que cuenta es la de la providencia de apremio, no la de la liquidación. Las normas del embargo que se pueden invocar son las de la LGT, no las de la Ley de Enjuiciamiento Civil. La solicitud de aplazamiento o fraccionamiento no figura en la lista, que es cerrada."
  citation: "art. 170.3 LGT"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0002
  prompt:
    es: "Señale la respuesta CORRECTA sobre los motivos de oposición a la diligencia de embargo que admite el artículo 170.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Es admisible oponer la falta de notificación de la liquidación que originó la deuda."
  - id: b
    text:
      es: "Es admisible oponer el desacuerdo del obligado con el importe de la liquidación de la que deriva la deuda."
  - id: c
    text:
      es: "Es admisible oponer la disconformidad del obligado con la valoración de los bienes embargados."
  - id: d
    correct: true
    text:
      es: "Es admisible oponer la suspensión del procedimiento de recaudación."
  explanation:
    es: "La suspensión del procedimiento de recaudación es el cuarto motivo del artículo 170.3 LGT. La disconformidad con la valoración, la falta de notificación de la liquidación y el desacuerdo con el importe de la liquidación no están en la lista, que el artículo declara cerrada con la palabra «solo». El motivo de notificación que sí cuenta es el de la providencia de apremio."
  citation: "art. 170.3 LGT"
  difficulty: 1
  tags:
  - "lista"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0003
  prompt:
    es: "El 8 de febrero de 2027 se notifica a Marcos Peña una diligencia de embargo por una deuda de 12.000 euros. Marcos alega que el derecho de la Administración a exigir ese pago prescribió en 2026. Según el artículo 170.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿es admisible ese motivo de oposición?"
  options:
  - id: a
    text:
      es: "No, porque contra la diligencia de embargo solo cabe alegar el incumplimiento de las normas reguladoras del embargo."
  - id: b
    text:
      es: "No, porque la prescripción solo puede alegarse contra la providencia de apremio, que inicia el procedimiento de apremio, y no contra la diligencia de embargo."
  - id: c
    correct: true
    text:
      es: "Sí, porque la prescripción del derecho a exigir el pago es uno de los motivos de oposición admisibles contra la diligencia de embargo."
  - id: d
    text:
      es: "Sí, pero únicamente si la prescripción se ha declarado antes en una resolución firme del órgano de recaudación."
  explanation:
    es: "El artículo 170.3 LGT incluye, en su primera letra, la extinción de la deuda o la prescripción del derecho a exigir el pago. No hace falta una declaración previa de prescripción, que el texto no exige. Tampoco la reserva a la providencia de apremio: la diligencia de embargo se puede oponer por ese motivo. Y la lista no se limita al incumplimiento de las normas del embargo, que es solo una de las cuatro letras."
  citation: "art. 170.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0004
  prompt:
    es: "Casa Montero, S.L. recibe el 3 de mayo de 2027 una diligencia de embargo sobre un local valorado en 90.000 euros. La sociedad se opone alegando únicamente que la valoración es demasiado alta. Conforme al artículo 170.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo debe tratarse ese motivo?"
  options:
  - id: a
    text:
      es: "No es admisible contra la diligencia, pero sí contra el acuerdo de enajenación en cualquier caso."
  - id: b
    text:
      es: "Es admisible, porque supone un incumplimiento de las normas reguladoras del embargo contenidas en la Ley General Tributaria."
  - id: c
    correct: true
    text:
      es: "No es uno de los motivos admisibles contra la diligencia de embargo, porque la lista del artículo 170.3 es cerrada."
  - id: d
    text:
      es: "Es admisible, porque la valoración excesiva equivale a la extinción de la deuda a efectos del artículo 170.3."
  explanation:
    es: "El artículo 170.3 LGT admite únicamente cuatro motivos, y la discrepancia con la valoración no es ninguno. La valoración tiene su propio cauce: el obligado puede presentar una valoración contradictoria (art. 97.3 RGR). No es un incumplimiento de las normas del embargo ni una forma de extinguir la deuda. El acuerdo de enajenación, por su parte, solo se impugna por los motivos del artículo 170.3 (art. 172.1 LGT), así que no abre una vía nueva."
  citation: "art. 170.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0079
  prompt:
    es: "De acuerdo con el artículo 170.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cada actuación de embargo se documentará en diligencia, que se notificará:"
  options:
  - id: a
    text:
      es: "al Registro de la Propiedad del lugar de los bienes."
  - id: b
    text:
      es: "al cónyuge del obligado tributario en todos los casos."
  - id: c
    correct: true
    text:
      es: "a la persona con la que se entienda dicha actuación."
  - id: d
    text:
      es: "al órgano que dictó la providencia de apremio."
  explanation:
    es: "La diligencia de cada actuación se notifica a la persona con la que esta se entiende (art. 170.1 LGT). Es un acto que dicta el propio órgano de recaudación, así que no se notifica a quien lo dicta. Al registro se le dirige el mandamiento de anotación (art. 170.2). La notificación al cónyuge se limita a los bienes gananciales."
  citation: "art. 170.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0083
  prompt:
    es: "Si los bienes embargados son inscribibles en un registro público, el artículo 170.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que el órgano competente expedirá mandamiento, y que este tendrá:"
  options:
  - id: a
    text:
      es: "un valor meramente informativo hasta que lo ratifique un juez."
  - id: b
    text:
      es: "el valor de un título ejecutivo que permite la venta directa del bien."
  - id: c
    correct: true
    text:
      es: "el mismo valor que si se tratara de mandamiento judicial de embargo."
  - id: d
    text:
      es: "el valor de una certificación de dominio expedida por el registrador."
  explanation:
    es: "El mandamiento del órgano competente vale como mandamiento judicial de embargo (art. 170.2 LGT). No es un título que autorice la venta directa, ni una certificación registral, ni un documento que necesite la ratificación de un juez."
  citation: "art. 170.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0084
  prompt:
    es: "Según el artículo 170.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el registrador hace constar por nota al margen de la anotación de embargo:"
  options:
  - id: a
    correct: true
    text:
      es: "la expedición de la certificación de cargas, con su fecha y el procedimiento al que se refiere."
  - id: b
    text:
      es: "el importe de la deuda perseguida, con sus recargos, y la fecha prevista para la subasta del bien."
  - id: c
    text:
      es: "la notificación del embargo al obligado tributario y a su cónyuge."
  - id: d
    text:
      es: "la identidad de los titulares de cargas anteriores a la anotación de embargo."
  explanation:
    es: "La nota marginal recoge la expedición de la certificación de cargas con su fecha y el procedimiento (art. 170.2 LGT). No refleja el importe ni la fecha de subasta, ni la identidad de los titulares de cargas, ni las notificaciones al obligado y su cónyuge."
  citation: "art. 170.2 LGT"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0085
  prompt:
    es: "¿A cuál de los siguientes titulares se notifica el embargo cuando el registrador ha hecho constar por nota marginal la expedición de la certificación de cargas, según el artículo 170.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "A todos los titulares de cargas que figuren en el registro, con independencia de su fecha."
  - id: b
    text:
      es: "A los titulares de cargas posteriores a la nota marginal de expedición de la certificación."
  - id: c
    correct: true
    text:
      es: "A los titulares de cargas posteriores a la anotación de embargo y anteriores a la nota marginal de expedición de la certificación."
  - id: d
    text:
      es: "A los titulares de cargas anteriores a la anotación de embargo."
  explanation:
    es: "Se notifica a quienes inscribieron su carga después de la anotación de embargo y antes de la nota marginal (art. 170.2 LGT). Las cargas anteriores a la anotación ya constan en la certificación y no son las que se notifican. Quien inscribe después de la nota marginal no es notificado, y el artículo no manda notificar a todos los titulares."
  citation: "art. 170.2 LGT"
  difficulty: 3
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0088
  prompt:
    es: "Se ha ordenado el embargo del establecimiento de Panadería Orbe, S.L., cuya gerencia, a juicio del órgano de recaudación, podría perjudicar la solvencia de la sociedad. Conforme al artículo 170.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué trámite debe preceder al nombramiento de un funcionario para que intervenga la gestión?"
  options:
  - id: a
    text:
      es: "La notificación de la providencia de apremio a todos los socios."
  - id: b
    correct: true
    text:
      es: "La audiencia del titular del negocio o del órgano de administración de la entidad."
  - id: c
    text:
      es: "La autorización previa del juez de lo contencioso-administrativo."
  - id: d
    text:
      es: "La aprobación previa de la junta de acreedores de la sociedad y del titular del negocio."
  explanation:
    es: "El nombramiento exige oír antes al titular del negocio o al órgano de administración (art. 170.5 LGT). No hace falta autorización judicial. Tampoco interviene una junta de acreedores, que es una figura concursal. Y la notificación de la providencia a los socios no es requisito del artículo."
  citation: "art. 170.5 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0089
  prompt:
    es: "La Administración tributaria puede acordar, según el artículo 170.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la prohibición de disponer sobre los bienes inmuebles de una sociedad, sin necesidad de que el procedimiento recaudatorio se dirija contra ella, cuando:"
  options:
  - id: a
    text:
      es: "la sociedad haya incumplido su obligación de presentar cuentas anuales en el Registro Mercantil."
  - id: b
    text:
      es: "el obligado sea administrador de la sociedad, aunque no se hayan embargado sus acciones o participaciones."
  - id: c
    text:
      es: "la sociedad haya sido declarada responsable solidaria de la deuda del obligado tributario."
  - id: d
    correct: true
    text:
      es: "se hayan embargado al obligado acciones o participaciones de aquella y este ejerza el control efectivo sobre la sociedad titular de los inmuebles."
  explanation:
    es: "La medida exige dos presupuestos: el embargo de acciones o participaciones y el control efectivo del obligado sobre la sociedad (art. 170.6 LGT). No depende de una declaración de responsabilidad, ni basta con que el obligado sea administrador, ni se vincula al depósito de cuentas."
  citation: "art. 170.6 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0090
  prompt:
    es: "Según el artículo 170.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recurso contra la prohibición de disponer sobre los inmuebles de una sociedad solo puede fundarse en:"
  options:
  - id: a
    correct: true
    text:
      es: "la falta de alguno de los presupuestos de hecho que permiten su adopción."
  - id: b
    text:
      es: "la disconformidad con la valoración de los inmuebles de la sociedad."
  - id: c
    text:
      es: "la extinción de la deuda tributaria del obligado, únicamente."
  - id: d
    text:
      es: "la falta de notificación de la providencia de apremio al obligado tributario."
  explanation:
    es: "El recurso solo puede invocar que falta algún presupuesto de hecho de la medida (art. 170.6 LGT). La falta de notificación de la providencia es un motivo contra la diligencia de embargo (art. 170.3). La valoración y la extinción de la deuda no son el único fundamento que el artículo permite."
  citation: "art. 170.6 LGT"
  difficulty: 3
  tags:
  - "recurso"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0091
  prompt:
    es: "De acuerdo con el artículo 170.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la medida de prohibición de disponer sobre los inmuebles de una sociedad se alza cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "por cualquier causa se extinga el embargo de las participaciones o acciones pertenecientes al obligado tributario."
  - id: b
    text:
      es: "el obligado tributario deje de ser administrador de la sociedad."
  - id: c
    text:
      es: "transcurra un año desde que se acordó la prohibición de disponer."
  - id: d
    text:
      es: "la sociedad ofrezca garantía suficiente por el importe de la deuda."
  explanation:
    es: "La prohibición depende del embargo de las acciones o participaciones y cae con él (art. 170.6 LGT). Dejar de ser administrador, ofrecer garantía o el paso de un año no están previstos como causas de alzamiento."
  citation: "art. 170.6 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-88-bis
- id: m03-l12-q0092
  prompt:
    es: "Para la prohibición de disponer sobre los inmuebles de una sociedad, el artículo 88 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación establece que la Administración solicita anotación preventiva sobre los bienes inmuebles, sobre la base de un título cuya vigencia viene determinada por:"
  options:
  - id: a
    text:
      es: "un plazo fijo de cuatro años desde la anotación."
  - id: b
    text:
      es: "la del procedimiento de apremio frente a la sociedad titular."
  - id: c
    correct: true
    text:
      es: "la del embargo del que trae causa."
  - id: d
    text:
      es: "la voluntad del registrador, que la renueva cada año."
  explanation:
    es: "El título de la anotación vale mientras dura el embargo de las participaciones del que procede (art. 88 bis.1 RGR). El procedimiento no se dirige contra la sociedad titular. No hay un plazo fijo de cuatro años en el artículo, ni renovación anual por el registrador."
  citation: "art. 88 bis.1 RGR"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0239
  prompt:
    es: "Según el artículo 170.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si los bienes embargados son inscribibles en un registro público, ¿qué derecho tiene la Administración tributaria?"
  options:
  - id: a
    text:
      es: "A que el registrador califique la anotación preventiva antes de su práctica, en el plazo de un mes."
  - id: b
    text:
      es: "A que se inscriba la propiedad de los bienes a su favor en el registro correspondiente."
  - id: c
    correct: true
    text:
      es: "A que se practique anotación preventiva de embargo en el registro correspondiente."
  - id: d
    text:
      es: "A que se cancelen las cargas anteriores al embargo que figuren en el registro correspondiente."
  explanation:
    es: "Si el bien es inscribible, la Administración tiene derecho a la anotación preventiva de embargo (art. 170.2 LGT). No se inscribe la propiedad a su favor, ni el artículo impone calificación en un mes, ni se cancelan las cargas anteriores: estas subsisten (art. 97.6 RGR)."
  citation: "art. 170.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0273
  prompt:
    es: "Efectuado el embargo de los bienes o derechos, el artículo 170.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que la diligencia se notifica al obligado tributario y, en su caso, al tercero titular, poseedor o depositario de los bienes:"
  options:
  - id: a
    text:
      es: "si los bienes están inscritos en un registro público a nombre del tercero."
  - id: b
    text:
      es: "en todo caso, aunque se hubieran llevado a cabo con ellos las actuaciones."
  - id: c
    text:
      es: "si lo solicitan por escrito en el plazo de diez días desde el embargo."
  - id: d
    correct: true
    text:
      es: "si no se hubieran llevado a cabo con ellos las actuaciones."
  explanation:
    es: "Al tercero titular, poseedor o depositario se le notifica la diligencia solo si no se han llevado a cabo con él las actuaciones (art. 170.1 LGT). No es en todo caso. No depende de una solicitud escrita ni de que los bienes estén inscritos a su nombre."
  citation: "art. 170.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-88-bis
- id: m03-l12-q0286
  prompt:
    es: "¿Qué solicita la Administración sobre los bienes inmuebles de la sociedad y los derechos sobre estos para hacer efectiva la prohibición de disponer del artículo 170.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, según el artículo 88 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Inscripción de la propiedad de los inmuebles a nombre de la Hacienda pública."
  - id: b
    correct: true
    text:
      es: "Anotación preventiva sobre los bienes inmuebles y derechos sobre estos."
  - id: c
    text:
      es: "Cancelación de las hipotecas que graven los inmuebles de la sociedad titular."
  - id: d
    text:
      es: "Nota marginal de adjudicación de los inmuebles en la hoja registral de la sociedad."
  explanation:
    es: "La Administración solicita anotación preventiva sobre los inmuebles y los derechos sobre ellos, con un título cuya vigencia depende de la del embargo del que trae causa (art. 88 bis.1 RGR). No pide inscripción de la propiedad a su favor ni nota de adjudicación, ni cancela hipotecas."
  citation: "art. 88 bis.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
