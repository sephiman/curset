# anchor: boe-a-2015-10565-art-114
- id: m03-l06-q065
  prompt:
    es: "Conforme al artículo 114.1.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la resolución administrativa de los procedimientos de responsabilidad patrimonial pone fin a la vía administrativa:"
  options:
  - id: a
    text:
      es: "Solo cuando derive de una relación sujeta al Derecho público, nunca de una privada."
  - id: b
    correct: true
    text:
      es: "Cualquiera que fuese el tipo de relación, pública o privada, de que derive."
  - id: c
    text:
      es: "Solo cuando la dicte el Consejo de Ministros o un Ministro."
  - id: d
    text:
      es: "Solo cuando haya precedido el dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 114.1.e) LPAC dice que pone fin a la vía administrativa «la resolución administrativa de los procedimientos de responsabilidad patrimonial, cualquiera que fuese el tipo de relación, pública o privada, de que derive». La opción de la relación de Derecho público contradice ese «pública o privada». Las opciones que lo limitan a ciertos órganos o a que haya dictamen añaden condiciones que la letra e) no tiene."
  citation: "art. 114.1.e) LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-114
- id: m03-l06-q066
  prompt:
    es: "Señale la respuesta correcta sobre la resolución de una reclamación de responsabilidad patrimonial derivada de una relación de derecho privado de la Administración, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "No pone fin a la vía administrativa, porque la relación de la que deriva la reclamación es privada."
  - id: b
    text:
      es: "Pone fin a la vía administrativa solo si la reclamación alcanza los 50.000 euros."
  - id: c
    text:
      es: "No pone fin a la vía administrativa hasta que se resuelva el recurso de alzada."
  - id: d
    correct: true
    text:
      es: "Pone fin a la vía administrativa, como cualquier otra resolución de responsabilidad patrimonial."
  explanation:
    es: "El artículo 114.1.e) LPAC dice que pone fin a la vía administrativa la resolución de estos procedimientos «cualquiera que fuese el tipo de relación, pública o privada, de que derive». La opción que lo niega por ser privada la relación contradice esa letra. La cuantía de 50.000 euros solo hace preceptivo el dictamen. La opción del recurso de alzada supone que la resolución no agota la vía, cuando la ley dice lo contrario."
  citation: "art. 114.1.e) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-96
- id: m03-l06-q067
  prompt:
    es: "Según el artículo 96.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el órgano competente considera inequívocos la causalidad, la valoración del daño y el cálculo de la cuantía:"
  options:
  - id: a
    correct: true
    text:
      es: "Podrá acordar de oficio la suspensión del procedimiento general y la iniciación de un procedimiento simplificado."
  - id: b
    text:
      es: "Deberá acordar, a solicitud del interesado, la tramitación de urgencia del procedimiento general."
  - id: c
    text:
      es: "Podrá resolver sin recabar el informe del servicio ni dar el trámite de audiencia a los interesados."
  - id: d
    text:
      es: "Podrá acordar de oficio la terminación convencional del procedimiento sin intervención del interesado."
  explanation:
    es: "El artículo 96.4 LPAC dice que en ese caso el órgano «podrá acordar de oficio la suspensión del procedimiento general y la iniciación de un procedimiento simplificado». La tramitación de urgencia es otra figura y el artículo no la pide a solicitud del interesado. La opción que suprime el informe y la audiencia y la opción de la terminación convencional sin el interesado describen efectos que el apartado no recoge."
  citation: "art. 96.4 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-96
- id: m03-l06-q068
  prompt:
    es: "¿Qué debe considerar inequívoco el órgano competente para acordar el procedimiento simplificado en materia de responsabilidad patrimonial, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La relación de causalidad, aunque la valoración del daño y la cuantía sigan pendientes."
  - id: b
    text:
      es: "La valoración del daño, aunque la relación de causalidad esté discutida."
  - id: c
    correct: true
    text:
      es: "La relación de causalidad, así como la valoración del daño y el cálculo de la cuantía."
  - id: d
    text:
      es: "La identidad del empleado público que causó el daño y su grado de culpa."
  explanation:
    es: "El artículo 96.4 LPAC exige que el órgano considere «inequívoca la relación de causalidad entre el funcionamiento del servicio público y la lesión, así como la valoración del daño y el cálculo de la cuantía de la indemnización». Las dos opciones que dan por suficiente una sola de esas partes recortan el requisito. La identidad y la culpa del empleado no son condiciones del artículo."
  citation: "art. 96.4 LPAC"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-10565-preambulo
- id: m03-l06-q069
  prompt:
    es: "Según su preámbulo, la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas regula el procedimiento de responsabilidad patrimonial:"
  options:
  - id: a
    text:
      es: "Como un procedimiento especial regulado en un título separado."
  - id: b
    text:
      es: "Como un procedimiento regulado solo en la Ley 40/2015."
  - id: c
    text:
      es: "Como un procedimiento que remite a un reglamento propio."
  - id: d
    correct: true
    text:
      es: "Como una especialidad del procedimiento administrativo común."
  explanation:
    es: "El preámbulo de la LPAC explica que los procedimientos especiales sobre potestad sancionadora y responsabilidad patrimonial, que la Ley 30/1992 regulaba en títulos separados, «ahora se han integrado como especialidades del procedimiento administrativo común». La opción del título separado describe el sistema anterior. La Ley 40/2015 recoge los principios de la responsabilidad, no el procedimiento. La opción del reglamento propio no se corresponde con el preámbulo."
  citation: "preámbulo LPAC"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-33
- id: m03-l06-q070
  prompt:
    es: "Según el artículo 33.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿en qué supuesto responden las Administraciones intervinientes frente al particular, en todo caso, de forma solidaria?"
  options:
  - id: a
    text:
      es: "Cuando la Administración actúe en relaciones de derecho privado a través de una entidad de derecho privado."
  - id: b
    text:
      es: "Cuando los daños a terceros se deban a una orden inmediata y directa de la Administración en un contrato."
  - id: c
    correct: true
    text:
      es: "Cuando la responsabilidad derive de fórmulas conjuntas de actuación entre varias Administraciones públicas."
  - id: d
    text:
      es: "Cuando los daños deriven de la aplicación de una norma con rango de ley declarada inconstitucional."
  explanation:
    es: "El artículo 33.1 LRJSP liga la responsabilidad solidaria a la que se derive «de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas». Cuando la Administración actúa en relaciones de derecho privado, su responsabilidad se exige conforme a los artículos 32 y siguientes (art. 35 LRJSP), sin regla de solidaridad. Los daños causados a terceros por una orden inmediata y directa de la Administración en un contrato son responsabilidad de la Administración (art. 196.2 LCSP), no de varias de forma solidaria. Los daños de una norma con rango de ley declarada inconstitucional son un supuesto de responsabilidad del Estado legislador (art. 32.3 LRJSP)."
  citation: "art. 33.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2015-10566-art-33
- id: m03-l06-q071
  prompt:
    es: "Cuando varias Administraciones públicas gestionan un servicio mediante una fórmula conjunta de actuación, su responsabilidad solidaria frente al particular rige, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Solo cuando lo prevea el instrumento que regule la actuación conjunta."
  - id: b
    correct: true
    text:
      es: "En todo caso, sin condición alguna."
  - id: c
    text:
      es: "Solo cuando la cuantía reclamada alcance los 50.000 euros."
  - id: d
    text:
      es: "Solo cuando el daño sea de carácter físico o psíquico."
  explanation:
    es: "El artículo 33.1 LRJSP dice que las Administraciones intervinientes «responderán frente al particular, en todo caso, de forma solidaria». La ley no hace depender esa solidaridad de lo que diga el instrumento de la actuación conjunta, de la cuantía reclamada ni del tipo de daño. Los 50.000 euros solo hacen preceptivo el dictamen (art. 81.2 LPAC), y el daño físico o psíquico solo cambia el inicio del plazo para reclamar (art. 67.1 LPAC)."
  citation: "art. 33.1 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-10565-art-91
- id: m03-l06-q072
  prompt:
    es: "Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué evita que, a los seis meses del inicio del procedimiento, la resolución pueda entenderse contraria a la indemnización?"
  options:
  - id: a
    text:
      es: "Que en ese plazo haya recaído resolución expresa, aunque todavía no se haya notificado al interesado."
  - id: b
    text:
      es: "Que en ese plazo el órgano instructor haya formulado y remitido la propuesta de resolución."
  - id: c
    text:
      es: "Que en ese plazo el interesado haya presentado sus alegaciones en el trámite de audiencia."
  - id: d
    correct: true
    text:
      es: "Que en ese plazo haya recaído y se haya notificado resolución expresa o se haya formalizado el acuerdo."
  explanation:
    es: "El artículo 91.3 LPAC permite entender la resolución contraria a la indemnización cuando pasan seis meses desde el inicio «sin que haya recaído y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo». La opción de la resolución dictada pero no notificada omite la notificación, que el artículo exige. La propuesta de resolución y las alegaciones de audiencia son trámites anteriores a la resolución y no la sustituyen."
  citation: "art. 91.3 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-68
- id: m03-l06-q076
  prompt:
    es: "Conforme al artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se requiere al interesado para que subsane la falta cuando su solicitud de iniciación no reúne:"
  options:
  - id: a
    text:
      es: "únicamente los requisitos del artículo 66, sin que la legislación específica aplicable pueda exigir otros."
  - id: b
    text:
      es: "los requisitos del artículo 66 y, en todo caso, los del artículo 69, sobre declaración responsable y comunicación."
  - id: c
    text:
      es: "los requisitos de los artículos 66 y 67, pero no los que exija la legislación específica aplicable."
  - id: d
    correct: true
    text:
      es: "los requisitos del artículo 66 y, en su caso, los del artículo 67 u otros que exija la legislación específica aplicable."
  explanation:
    es: "El artículo 68.1 LPAC manda requerir al interesado cuando la solicitud no reúne «los requisitos que señala el artículo 66, y, en su caso, los que señala el artículo 67 u otros exigidos por la legislación específica aplicable». Limitarlo al artículo 66 deja fuera las dos remisiones del «y, en su caso». Añadir en todo caso los del artículo 69 sustituye esas remisiones por otra que el apartado no hace: el apartado nombra los artículos 66 y 67 y la legislación específica. Excluir la legislación específica contradice «u otros exigidos por la legislación específica aplicable»."
  citation: "art. 68.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-68
- id: m03-l06-q077
  prompt:
    es: "Según el artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo debe proceder la Administración si la solicitud de iniciación no reúne los requisitos del artículo 66?"
  options:
  - id: a
    text:
      es: "Archivar la solicitud y notificarle al interesado el archivo sin más trámite."
  - id: b
    correct: true
    text:
      es: "Requerirle para que subsane la falta o acompañe los documentos preceptivos."
  - id: c
    text:
      es: "Inadmitir la solicitud mediante resolución motivada y notificársela al interesado."
  - id: d
    text:
      es: "Desestimar la solicitud por no cumplir los requisitos que señala el artículo 66."
  explanation:
    es: "El artículo 68.1 LPAC manda que «se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos». Archivar sin más trámite, inadmitir o desestimar se saltan ese requerimiento. El apartado fija la consecuencia de no atenderlo: se tendrá al interesado «por desistido de su petición, previa resolución». El desistimiento llega después del requerimiento, no es una de las tres salidas inmediatas."
  citation: "art. 68.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
