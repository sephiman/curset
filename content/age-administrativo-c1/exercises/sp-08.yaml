# anchor: boe-a-2017-12902-art-193
- id: q10
  lesson: m03-l04
  prompt:
    es: "Si el SEPE opta por penalizar la demora de la empresa adjudicataria en la puesta en marcha del servicio, ¿qué importe total de penalidades corresponde a los doce días naturales de retraso?"
  options:
  - id: a
    correct: true
    text:
      es: "2.160,00 euros, a razón de 0,60 euros por cada 1.000 euros del precio sin IVA."
  - id: b
    text:
      es: "2.613,60 euros, a razón de 0,60 euros por cada 1.000 euros del precio con IVA."
  - id: c
    text:
      es: "3.240,00 euros, a razón de 0,60 euros por cada 1.000 euros del valor estimado."
  - id: d
    text:
      es: "1.080,00 euros, a razón de 0,60 euros por cada 1.000 euros del precio de un año."
  explanation:
    es: "Salvo otras penalidades del pliego, la ley permite penalizar la demora con 0,60 euros diarios por cada 1.000 euros del precio del contrato, IVA excluido. El precio de los dos años es de 300.000 euros, que son 300 miles: 300 × 0,60 = 180 euros al día, y por doce días, 2.160,00 euros. El importe de 2.613,60 euros parte del precio con IVA, 363.000 euros. El de 3.240,00 euros parte del valor estimado de 450.000 euros, que incluye la prórroga. El de 1.080,00 euros parte del precio de un solo año."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-1995-8729-art-58
- id: q11
  lesson: m04-l05
  prompt:
    es: "Según el artículo 58.2 del Real Decreto 364/1995, de 10 de marzo, de Ingreso y Provisión de Puestos, ¿cuál es el nivel más bajo del puesto al que puede adscribirse provisionalmente al Jefe de Servicio cesado?"
  options:
  - id: a
    text:
      es: "Un puesto de nivel 20."
  - id: b
    text:
      es: "Un puesto de nivel 24."
  - id: c
    correct: true
    text:
      es: "Un puesto de nivel 22."
  - id: d
    text:
      es: "Un puesto de nivel 26."
  explanation:
    es: "El funcionario cesado en un puesto de libre designación queda adscrito provisionalmente a un puesto de su Cuerpo o Escala no inferior en más de dos niveles al de su grado personal, en el mismo municipio. Su grado personal es 24, y dos niveles menos son 22, que es el mínimo. El nivel 20 queda tres niveles por debajo del grado personal. El nivel 24 y el 26 también cumplirían el requisito, pero no son el más bajo posible, y el 26 es el del puesto que deja, que no sirve de referencia."
  citation: "art. 58.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cantidad"
  - "competencia"
