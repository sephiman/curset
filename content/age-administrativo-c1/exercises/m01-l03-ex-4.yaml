# anchor: boe-a-1994-10830-art-5
- id: m01-l03-q047
  prompt:
    es: "De acuerdo con el artículo 5 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, la Mesa del Senado está formada por:"
  options:
  - id: a
    text:
      es: "El Presidente, cuatro Vicepresidentes y cuatro Secretarios."
  - id: b
    text:
      es: "El Presidente, dos Vicepresidentes y dos Secretarios."
  - id: c
    text:
      es: "El Presidente, un Vicepresidente y dos Secretarios."
  - id: d
    correct: true
    text:
      es: "El Presidente, dos Vicepresidentes y cuatro Secretarios."
  explanation:
    es: "El artículo 5.1 del Reglamento del Senado dice que la Mesa «estará formada por el Presidente, dos Vicepresidentes y cuatro Secretarios». Cuatro Vicepresidencias y cuatro Secretarías son las de la Mesa del Congreso. Dos Vicepresidentes y dos Secretarios forman la Mesa de cada Comisión del Senado (art. 53.2). Un solo Vicepresidente no aparece."
  citation: "art. 5.1 Reglamento del Senado"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1994-10830-art-27
- id: m01-l03-q048
  prompt:
    es: "¿Cuántos Senadores, como mínimo, componen cada Grupo parlamentario según el texto refundido del Reglamento del Senado de 3 de mayo de 1994?"
  options:
  - id: a
    text:
      es: "Quince Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: b
    correct: true
    text:
      es: "Diez Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: c
    text:
      es: "Seis Senadores, sin que ninguno pueda formar parte de más de un Grupo."
  - id: d
    text:
      es: "Diez Senadores, pudiendo cada uno formar parte de dos Grupos."
  explanation:
    es: "El artículo 27.1 del Reglamento del Senado dice: «Cada Grupo parlamentario estará compuesto, al menos, de diez Senadores. Ningún Senador podrá formar parte de más de un Grupo parlamentario». Quince es el mínimo general en el Congreso. Seis es la cifra por debajo de la cual un Grupo ya constituido se disuelve al final del período de sesiones (art. 27.2). Nadie puede estar en dos Grupos."
  citation: "art. 27.1 Reglamento del Senado"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1994-10830-art-55
- id: m01-l03-q049
  prompt:
    es: "Según el artículo 55 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, ¿cómo está integrada la Mesa de la Comisión General de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Por un Presidente, dos Vicepresidentes y dos Secretarios."
  - id: b
    text:
      es: "Por un Presidente, cuatro Vicepresidentes y cuatro Secretarios."
  - id: c
    correct: true
    text:
      es: "Por un Presidente, dos Vicepresidentes y cuatro Secretarios."
  - id: d
    text:
      es: "Por un Presidente, un Vicepresidente y dos Secretarios."
  explanation:
    es: "El artículo 55 del Reglamento del Senado dice que esta Mesa «estará integrada por un Presidente, dos Vicepresidentes y cuatro Secretarios». Es una excepción a la regla de las demás Comisiones, cuya Mesa tiene dos Secretarios (art. 53.2). Cuatro Vicepresidentes y un solo Vicepresidente no aparecen."
  citation: "art. 55 Reglamento del Senado"
  difficulty: 3
  tags:
  - "composición"
  - "excepción"
# anchor: boe-a-1978-31229-art-81
- id: m01-l03-q050
  prompt:
    es: "¿Cuál de las siguientes mayorías exige la Constitución Española de 1978 para la aprobación, modificación o derogación de las leyes orgánicas?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta del Congreso y del Senado, en votaciones separadas de cada artículo."
  - id: b
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  explanation:
    es: "El artículo 81.2 exige «mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto». La mayoría absoluta se exige al Congreso, no también al Senado, y la votación es final, no artículo por artículo. No se piden tres quintos ni basta la mayoría simple."
  citation: "art. 81.2 CE"
  difficulty: 1
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-82
- id: m01-l03-q051
  prompt:
    es: "De acuerdo con el artículo 82 de la Constitución Española de 1978, las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley:"
  options:
  - id: a
    text:
      es: "Sobre cualquier materia, incluidas las reservadas a ley orgánica."
  - id: b
    correct: true
    text:
      es: "Sobre materias determinadas que no estén reservadas a ley orgánica."
  - id: c
    text:
      es: "Sobre materias reservadas a ley orgánica, previa autorización del Congreso."
  - id: d
    text:
      es: "Sobre materias determinadas, incluido el régimen electoral general."
  explanation:
    es: "El artículo 82.1 permite delegar «sobre materias determinadas no incluidas en el artículo anterior», que es el de las leyes orgánicas. Por eso no cabe delegar materias reservadas a ley orgánica, ni siquiera con autorización del Congreso. El régimen electoral general es materia de ley orgánica (art. 81.1)."
  citation: "art. 82.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-82
- id: m01-l03-q052
  prompt:
    es: "Según la Constitución Española de 1978, señale la respuesta correcta sobre la forma de otorgar al Gobierno la delegación legislativa:"
  options:
  - id: a
    text:
      es: "Mediante una ley orgánica cuando su objeto sea la formación de textos articulados."
  - id: b
    text:
      es: "Mediante una ley de bases cuando se trate de refundir varios textos legales en uno solo."
  - id: c
    correct: true
    text:
      es: "Mediante una ley de bases cuando su objeto sea la formación de textos articulados."
  - id: d
    text:
      es: "Mediante un decreto legislativo cuando se trate de refundir varios textos legales en uno solo."
  explanation:
    es: "El artículo 82.2 dice que la delegación «deberá otorgarse mediante una ley de bases cuando su objeto sea la formación de textos articulados o por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo». No se otorga por ley orgánica. Para refundir textos se usa una ley ordinaria, no una ley de bases. El decreto legislativo es la norma que dicta el Gobierno en uso de la delegación (art. 85), no la que la otorga."
  citation: "art. 82.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-86
- id: m01-l03-q053
  prompt:
    es: "¿En qué plazo deben someterse los Decretos-leyes a debate y votación de totalidad del Congreso de los Diputados, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "En el plazo de los quince días siguientes a su promulgación."
  - id: b
    text:
      es: "En el plazo de los sesenta días siguientes a su promulgación."
  - id: c
    correct: true
    text:
      es: "En el plazo de los treinta días siguientes a su promulgación."
  - id: d
    text:
      es: "En el plazo de los veinte días naturales siguientes a su promulgación."
  explanation:
    es: "El artículo 86.2 dice que los Decretos-leyes se someten al Congreso «en el plazo de los treinta días siguientes a su promulgación». Quince y sesenta días no aparecen. Veinte días naturales es el plazo del Senado en los proyectos urgentes (art. 90.3)."
  citation: "art. 86.2 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-87
- id: m01-l03-q055
  prompt:
    es: "¿Cuántas firmas acreditadas exige, como mínimo, la Constitución Española de 1978 para la iniciativa popular de proposiciones de ley?"
  options:
  - id: a
    correct: true
    text:
      es: "No menos de 500.000 firmas acreditadas."
  - id: b
    text:
      es: "No menos de 250.000 firmas acreditadas."
  - id: c
    text:
      es: "No menos de 750.000 firmas acreditadas."
  - id: d
    text:
      es: "No menos de 1.000.000 de firmas acreditadas."
  explanation:
    es: "El artículo 87.3 dice: «En todo caso se exigirán no menos de 500.000 firmas acreditadas». Las cifras de 250.000, 750.000 y un millón no están en la Constitución."
  citation: "art. 87.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q056
  prompt:
    es: "De acuerdo con el artículo 90 de la Constitución Española de 1978, el Senado puede, mediante mensaje motivado, oponer su veto o introducir enmiendas a un proyecto de ley en el plazo de:"
  options:
  - id: a
    text:
      es: "Tres meses a partir del día de la recepción del texto."
  - id: b
    text:
      es: "Dos meses a partir de la aprobación del proyecto por el Congreso."
  - id: c
    correct: true
    text:
      es: "Dos meses a partir del día de la recepción del texto."
  - id: d
    text:
      es: "Un mes a partir del día de la recepción del texto."
  explanation:
    es: "El artículo 90.2 dice que el Senado dispone de «dos meses, a partir del día de la recepción del texto». No son tres meses ni uno. El plazo corre desde la recepción del texto, no desde la aprobación en el Congreso."
  citation: "art. 90.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q057
  prompt:
    es: "Según el artículo 90 de la Constitución Española de 1978, ¿qué mayoría exige el veto que el Senado opone a un proyecto de ley?"
  options:
  - id: a
    text:
      es: "Deberá ser aprobado por mayoría simple."
  - id: b
    text:
      es: "Deberá ser aprobado por mayoría de tres quintos."
  - id: c
    text:
      es: "Deberá ser aprobado por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Deberá ser aprobado por mayoría absoluta."
  explanation:
    es: "El artículo 90.2 dice: «El veto deberá ser aprobado por mayoría absoluta». La mayoría simple basta al Congreso para pronunciarse sobre las enmiendas, no al Senado para vetar. Tres quintos y dos tercios no aparecen en el precepto."
  citation: "art. 90.2 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q058
  prompt:
    es: "¿Qué mayoría necesita el Congreso para ratificar el texto inicial tras el veto del Senado, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Mayoría absoluta en todo caso, sin que el transcurso del tiempo la reduzca."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta o, transcurridos dos meses desde la interposición del veto, mayoría simple."
  - id: c
    text:
      es: "Mayoría de tres quintos o, transcurridos dos meses desde el veto, mayoría absoluta."
  - id: d
    text:
      es: "Mayoría simple en todo caso, desde el momento de la interposición del veto."
  explanation:
    es: "El artículo 90.2 exige que el Congreso ratifique «por mayoría absoluta, en caso de veto, el texto inicial, o por mayoría simple, una vez transcurridos dos meses desde la interposición del mismo». La mayoría absoluta no se exige siempre: pasados dos meses basta la simple. Nunca se piden tres quintos. Antes de los dos meses la mayoría simple no basta."
  citation: "art. 90.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "plazo"
# anchor: boe-a-1978-31229-art-90
- id: m01-l03-q059
  prompt:
    es: "De acuerdo con el artículo 90 de la Constitución Española de 1978, en los proyectos declarados urgentes por el Gobierno o por el Congreso de los Diputados, el plazo del Senado para vetar o enmendar se reduce a:"
  options:
  - id: a
    text:
      es: "Un plazo de veinte días hábiles."
  - id: b
    correct: true
    text:
      es: "Un plazo de veinte días naturales."
  - id: c
    text:
      es: "Un plazo de quince días naturales."
  - id: d
    text:
      es: "Un plazo de treinta días naturales."
  explanation:
    es: "El artículo 90.3 dice que el plazo de dos meses «se reducirá al de veinte días naturales en los proyectos declarados urgentes». Son días naturales, no hábiles. Quince días es el plazo de la sanción real (art. 91). Treinta días no es el plazo del Senado."
  citation: "art. 90.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-91
- id: m01-l03-q060
  prompt:
    es: "¿En qué plazo sancionará el Rey las leyes aprobadas por las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de quince días."
  - id: b
    text:
      es: "En el plazo de veinte días naturales."
  - id: c
    text:
      es: "En el plazo de un mes."
  - id: d
    text:
      es: "En el plazo de treinta días."
  explanation:
    es: "El artículo 91 dice: «El Rey sancionará en el plazo de quince días las leyes aprobadas por las Cortes Generales». Veinte días naturales es el plazo del Senado en los proyectos urgentes (art. 90.3). Un mes y treinta días no son el plazo de la sanción."
  citation: "art. 91 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-92
- id: m01-l03-q061
  prompt:
    es: "Según el artículo 92 de la Constitución Española de 1978, ¿cómo se convoca el referéndum consultivo sobre decisiones políticas de especial trascendencia?"
  options:
  - id: a
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por las Cortes Generales."
  - id: b
    text:
      es: "Lo convoca el Presidente del Gobierno, previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Lo convoca el Rey, mediante propuesta del Congreso de los Diputados, previamente autorizada por el Senado."
  - id: d
    correct: true
    text:
      es: "Lo convoca el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados."
  explanation:
    es: "El artículo 92.2 dice: «El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados». La autorización es solo del Congreso, no de las Cortes Generales ni del Senado. Lo convoca el Rey, no el Presidente del Gobierno, que hace la propuesta."
  citation: "art. 92.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-94
- id: m01-l03-q062
  prompt:
    es: "¿Cuál de los siguientes tratados o convenios requiere la previa autorización de las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los que tengan por objeto la cooperación cultural entre Estados."
  - id: b
    text:
      es: "Los que tengan por objeto la cooperación científica y técnica."
  - id: c
    correct: true
    text:
      es: "Los que impliquen obligaciones financieras para la Hacienda Pública."
  - id: d
    text:
      es: "Los que se refieran al intercambio de información administrativa."
  explanation:
    es: "El artículo 94.1.d) exige la previa autorización de las Cortes Generales para los tratados o convenios «que impliquen obligaciones financieras para la Hacienda Pública». La cooperación cultural, la científica y técnica y el intercambio de información no están en la lista del artículo 94.1. De la conclusión de esos tratados el Congreso y el Senado solo son informados (art. 94.2)."
  citation: "art. 94.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-134
- id: m01-l03-q063
  prompt:
    es: "De acuerdo con el artículo 134 de la Constitución Española de 1978, la Ley de Presupuestos:"
  options:
  - id: a
    correct: true
    text:
      es: "No puede crear tributos, y podrá modificarlos cuando una ley tributaria sustantiva así lo prevea."
  - id: b
    text:
      es: "Puede crear tributos cuando una ley tributaria sustantiva así lo prevea."
  - id: c
    text:
      es: "No puede crear ni modificar tributos en ningún caso."
  - id: d
    text:
      es: "Puede modificar tributos sin necesidad de previsión en una ley tributaria sustantiva."
  explanation:
    es: "El artículo 134.7 dice: «La Ley de Presupuestos no puede crear tributos. Podrá modificarlos cuando una ley tributaria sustantiva así lo prevea». Crear tributos le está vedado en todo caso. Modificarlos sí puede, pero solo con esa previsión en una ley tributaria sustantiva."
  citation: "art. 134.7 CE"
  difficulty: 2
  tags:
  - "excepción"
  - "competencia"
# anchor: boe-a-1978-31229-art-71
- id: m01-l03-q064
  prompt:
    es: "En relación con las prerrogativas que la Constitución reconoce a los Diputados y Senadores, es correcto afirmar que:"
  options:
  - id: a
    text:
      es: "Los Diputados y Senadores no podrán ser detenidos durante su mandato, ni siquiera en caso de flagrante delito."
  - id: b
    text:
      es: "Los Diputados y Senadores gozarán de inmunidad aun después de haber cesado en su mandato."
  - id: c
    text:
      es: "La asignación que perciben los Diputados y Senadores será fijada por el Gobierno."
  - id: d
    correct: true
    text:
      es: "En las causas contra Diputados y Senadores será competente la Sala de lo Penal del Tribunal Supremo."
  explanation:
    es: "El artículo 71.3 de la Constitución dice: «En las causas contra Diputados y Senadores será competente la Sala de lo Penal del Tribunal Supremo». Los demás enunciados alteran otros apartados del mismo artículo. El artículo 71.2 permite detenerlos en caso de flagrante delito. La inmunidad dura «durante el período de su mandato» (art. 71.2); lo que sigue después del cese es la inviolabilidad (art. 10 del Reglamento del Congreso). La asignación la fijan «las respectivas Cámaras» (art. 71.4), no el Gobierno."
  citation: "art. 71.3 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
