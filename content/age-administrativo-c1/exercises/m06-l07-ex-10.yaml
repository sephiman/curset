# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q316
  prompt:
    es: "Señale la ruta de Outlook 365 clásico que lleva al cuadro para crear una firma desde un mensaje nuevo:"
  options:
  - id: a
    text:
      es: "Revisar › Firma › Firmas"
  - id: b
    text:
      es: "Opciones › Firma › Firmas"
  - id: c
    text:
      es: "Inicio › Firma › Firmas"
  - id: d
    correct: true
    text:
      es: "Mensaje › Firma › Firmas"
  explanation:
    es: "En un mensaje nuevo, la ayuda indica el menú Mensaje y Firma, con la opción Firmas. Las rutas que empiezan por Inicio, Opciones o Revisar contradicen esa frase, que fija la pestaña Mensaje."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q318
  prompt:
    es: "En Outlook 365 clásico, ¿qué lista de Elegir firma predeterminada permite elegir la firma que se agrega a los mensajes de respuesta y reenvío?"
  options:
  - id: a
    text:
      es: "Seleccionar firma para editar"
  - id: b
    correct: true
    text:
      es: "Respuestas/reenvíos"
  - id: c
    text:
      es: "Nuevos mensajes"
  - id: d
    text:
      es: "Cuenta de correo electrónico"
  explanation:
    es: "La lista Respuestas/reenvíos permite elegir la firma que aparece en las respuestas y reenvíos. Nuevos mensajes elige la que se agrega a los mensajes nuevos. Cuenta de correo electrónico elige la cuenta a la que se asocia la firma. Seleccionar firma para editar es el apartado donde se elige Nueva y se edita la firma."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q319
  prompt:
    es: "En Outlook 365 clásico, al crear una firma que se aplica a todos los mensajes nuevos, ¿qué ocurre con el mensaje que estaba abierto al crearla?"
  options:
  - id: a
    text:
      es: "Outlook le agrega la firma, pero solo en las respuestas"
  - id: b
    text:
      es: "Outlook le agrega la firma solo si se cierra y se vuelve a abrir"
  - id: c
    text:
      es: "Outlook le agrega la firma al aceptar el cuadro de firmas"
  - id: d
    correct: true
    text:
      es: "Outlook no le agrega la firma y hay que insertarla manualmente"
  explanation:
    es: "Outlook clásico no agrega la firma nueva al mensaje abierto en el paso 1, aunque se aplique a todos los mensajes nuevos, y hay que agregarla manualmente. Que la agregue al aceptar contradice esa frase. Que la agregue al cerrarlo y reabrirlo la contradice también: la ayuda dice que hay que agregarla manualmente a ese mensaje y que la llevan los mensajes futuros. Agregarla solo en respuestas contradice que se aplique a los mensajes nuevos."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q320
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se inserta manualmente una firma en un mensaje si no se ha elegido insertarla automáticamente?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Mensaje, con Firma, eligiendo la firma en el menú"
  - id: b
    text:
      es: "En la pestaña Inicio, con Firma, eligiendo la firma en el menú"
  - id: c
    text:
      es: "En la pestaña Opciones, con Firmas, eligiendo la firma en el menú"
  - id: d
    text:
      es: "En la pestaña Revisar, con Firma, eligiendo la firma en el menú"
  explanation:
    es: "En el mensaje, en la pestaña Mensaje, se selecciona Firma y se elige la firma en el menú emergente. Las pestañas Opciones, Inicio y Revisar contradicen esa frase, que indica la pestaña Mensaje."
  citation: "fuente: `ms-outlook-firma.html`; «Insertar una firma manualmente en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q321
  prompt:
    es: "En Outlook 365 clásico, ¿dónde se almacenan las firmas creadas en un equipo, según la nota de la ayuda de Microsoft sobre firmas?"
  options:
  - id: a
    text:
      es: "En el servidor de correo, disponibles en cualquier dispositivo"
  - id: b
    correct: true
    text:
      es: "Localmente en el dispositivo donde se crearon"
  - id: c
    text:
      es: "En la carpeta Borrador de cada cuenta de correo"
  - id: d
    text:
      es: "En la cuenta de Microsoft, disponibles en cualquier dispositivo"
  explanation:
    es: "Las firmas se almacenan localmente en el dispositivo donde se crearon y es posible que no estén disponibles en otro dispositivo. Guardarlas en el servidor o en la cuenta de Microsoft contradice esa frase: la ayuda aconseja administrarlas a través de la cuenta de Microsoft para usarlas en todas las experiencias. La carpeta Borrador contradice que se guarden en el dispositivo."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q322
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se crea una firma más sólida con viñetas, tablas o bordes, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Con Imagen: se inserta una imagen de la firma ya maquetada"
  - id: b
    text:
      es: "Con la minibarra de formato: inserta tablas y bordes en Editar firma"
  - id: c
    text:
      es: "Con Excel: se crea una hoja y se inserta en el cuadro Editar firma"
  - id: d
    correct: true
    text:
      es: "Con Word: se crea y se copia y pega en el cuadro Editar firma"
  explanation:
    es: "Para una firma con viñetas, tablas o bordes, la ayuda indica usar Word para crear y dar formato al texto y copiarlo y pegarlo en el cuadro Editar firma. Excel contradice que se use Word. La minibarra de formato sirve para vínculos, imágenes, fuentes, colores y justificar el texto. El botón Imagen inserta un archivo de imagen."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-firma-html
- id: m06-l07-q323
  prompt:
    es: "En Outlook 365 clásico, ¿qué casilla de la pestaña Tamaño hay que mantener marcada para conservar las proporciones de una imagen de la firma?"
  options:
  - id: a
    correct: true
    text:
      es: "Bloquear relación de aspecto"
  - id: b
    text:
      es: "Incluir subcarpetas"
  - id: c
    text:
      es: "No mover los mensajes marcados"
  - id: d
    text:
      es: "Detener el procesamiento de más reglas"
  explanation:
    es: "Para mantener las proporciones se deja marcada la casilla Bloquear relación de aspecto. Incluir subcarpetas pertenece a Ejecutar reglas ahora. Detener el procesamiento de más reglas pertenece a la creación de reglas. No mover los mensajes marcados pertenece a las opciones de Limpieza de conversación."
  citation: "fuente: `ms-outlook-firma.html`; «Agregar un logotipo o una imagen a la firma en la versión clásica de Outlook para Windows»"
