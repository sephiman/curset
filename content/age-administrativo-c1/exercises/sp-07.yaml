  lesson: m05-l03
  prompt:
    es: "Si la Mutualidad no acepta el reparo que recibe de la Intervención Delegada, puede plantear la discrepancia, contando días hábiles, hasta:"
  options:
  - id: a
    text:
      es: "El jueves, 18 de noviembre de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 19 de noviembre de 2027."
  - id: c
    text:
      es: "El miércoles, 17 de noviembre de 2027."
  - id: d
    text:
      es: "El jueves, 11 de noviembre de 2027."
  explanation:
    es: "El órgano gestor que no acepta el reparo plantea la discrepancia en quince días, que cuentan desde el siguiente a la recepción, el miércoles, 27 de octubre de 2027. Contados como hábiles y sin el lunes, 1 de noviembre, festivo en toda España, ni el martes, 9 de noviembre, festivo en Madrid, el decimoquinto día es el viernes, 19 de noviembre de 2027. La fecha del jueves, 18 de noviembre de 2027, olvida el festivo de Madrid. La del miércoles, 17 de noviembre de 2027, olvida los dos festivos. La del jueves, 11 de noviembre de 2027, cuenta quince días naturales."
