# anchor: boe-a-1978-31229-art-41
- id: m01-l01-q0051
  prompt:
    es: "Conforme al artículo 41 de la Constitución Española de 1978, los poderes públicos mantendrán, para todos los ciudadanos, un régimen público de:"
  options:
  - id: a
    text:
      es: "Seguros sociales gestionados por entidades privadas."
  - id: b
    correct: true
    text:
      es: "Seguridad Social."
  - id: c
    text:
      es: "Asistencia sanitaria gratuita y universal."
  - id: d
    text:
      es: "Previsión social complementaria obligatoria."
  explanation:
    es: "El artículo 41 manda mantener un régimen público de Seguridad Social para todos los ciudadanos. Los seguros privados no son un régimen público. La asistencia sanitaria es materia del artículo 43, que reconoce el derecho a la protección de la salud. La asistencia y prestaciones complementarias, según el propio artículo 41, serán libres, no obligatorias."
  citation: "art. 41 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-43
- id: m01-l01-q0052
  prompt:
    es: "¿Cuál de los siguientes derechos reconoce el artículo 43 del capítulo tercero del título I de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El derecho a disfrutar de una vivienda digna y adecuada."
  - id: b
    text:
      es: "El derecho a un medio ambiente adecuado para el desarrollo de la persona."
  - id: c
    text:
      es: "El derecho a la defensa de los consumidores y usuarios."
  - id: d
    correct: true
    text:
      es: "El derecho a la protección de la salud."
  explanation:
    es: "El artículo 43 reconoce el derecho a la protección de la salud. La vivienda es el artículo 47, el medio ambiente el 45 y la defensa de los consumidores y usuarios el 51: los tres son mandatos del mismo capítulo, pero de otros artículos."
  citation: "art. 43 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-45
- id: m01-l01-q0053
  prompt:
    es: "Conforme al artículo 45 de la Constitución Española de 1978, todos tienen el derecho a disfrutar de un medio ambiente adecuado para:"
  options:
  - id: a
    correct: true
    text:
      es: "El desarrollo de la persona."
  - id: b
    text:
      es: "La actividad económica de las empresas."
  - id: c
    text:
      es: "La conservación del patrimonio histórico y cultural."
  - id: d
    text:
      es: "El progreso social y económico de los pueblos de España."
  explanation:
    es: "El artículo 45.1 vincula el medio ambiente adecuado con el desarrollo de la persona, y añade el deber de conservarlo. La actividad económica de las empresas, el patrimonio histórico y cultural y el progreso social y económico son fines distintos de los que el apartado asigna a ese derecho."
  citation: "art. 45 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q0078
  prompt:
    es: "¿Cuál de los siguientes órganos determina la duración del estado de sitio, según el artículo 116.4 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Congreso de los Diputados."
  - id: b
    text:
      es: "El Gobierno, en el decreto de declaración."
  - id: c
    text:
      es: "El Senado, a propuesta del Gobierno."
  - id: d
    text:
      es: "El Rey, mediante real decreto."
  explanation:
    es: "El artículo 116.4 dice que el Congreso determina el ámbito territorial, la duración y las condiciones del estado de sitio, a diferencia de la alarma y la excepción, con plazos fijados en la Constitución. El Gobierno solo propone la declaración. El Senado y el Rey no determinan la duración: esa decisión es del Congreso."
  citation: "art. 116.2–4 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1978-31229-art-20
- id: m01-l01-q0085
  prompt:
    es: "De acuerdo con el artículo 20.5 de la Constitución Española de 1978, el secuestro de publicaciones, grabaciones y otros medios de información solo podrá acordarse:"
  options:
  - id: a
    text:
      es: "En virtud de resolución judicial o, en caso de urgencia, gubernativa."
  - id: b
    correct: true
    text:
      es: "En virtud de resolución judicial."
  - id: c
    text:
      es: "En virtud de resolución del Ministerio Fiscal, con posterior control judicial."
  - id: d
    text:
      es: "En virtud de resolución motivada de la autoridad administrativa competente."
  explanation:
    es: "El artículo 20.5 dice: «Sólo podrá acordarse el secuestro de publicaciones, grabaciones y otros medios de información en virtud de resolución judicial». No admite resolución gubernativa por urgencia, ni del Ministerio Fiscal, ni de una autoridad administrativa."
  citation: "art. 20.5 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-159
- id: m01-l01-q0105
  prompt:
    es: "Según el artículo 159.2 de la Constitución Española de 1978, los miembros del Tribunal Constitucional se nombran entre Magistrados y Fiscales, Profesores de Universidad, funcionarios públicos y Abogados, que han de ser todos ellos:"
  options:
  - id: a
    text:
      es: "Doctores en Derecho con cátedra."
  - id: b
    text:
      es: "Letrados de las Cortes o del Consejo de Estado."
  - id: c
    text:
      es: "Magistrados del Supremo con diez años de carrera."
  - id: d
    correct: true
    text:
      es: "Juristas de reconocida competencia."
  explanation:
    es: "El artículo 159.2 exige que todos sean «juristas de reconocida competencia» con más de quince años de ejercicio profesional. Un doctorado con cátedra, la condición de Letrado de las Cortes o del Consejo de Estado y una antigüedad judicial de diez años son requisitos que el artículo no fija. Tampoco hay que ser Magistrado del Supremo."
  citation: "art. 159.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1979-23709-art-18
- id: m01-l01-q0106
  prompt:
    es: "Señale la opción correcta. Además de lo que exige la Constitución, el artículo 18 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional dispone que los miembros del Tribunal Constitucional se nombran entre:"
  options:
  - id: a
    correct: true
    text:
      es: "Ciudadanos españoles que reúnan las condiciones profesionales exigidas."
  - id: b
    text:
      es: "Ciudadanos españoles de nacimiento, sin otra condición."
  - id: c
    text:
      es: "Ciudadanos de cualquier Estado miembro de la Unión Europea."
  - id: d
    text:
      es: "Residentes en España durante al menos diez años."
  explanation:
    es: "El artículo 18 dice que se nombran «entre ciudadanos españoles» que sean Magistrados, Fiscales, Profesores de Universidad, funcionarios públicos o Abogados con la competencia y los años exigidos. La nacionalidad española de nacimiento es la exigencia que la Constitución hace al tutor del Rey menor, no a los Magistrados. Un ciudadano de otro Estado de la Unión o un simple residente no cumple el artículo."
  citation: "art. 18 LOTC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-161
- id: m01-l01-q0113
  prompt:
    es: "Señale la afirmación correcta sobre los conflictos de competencia de los que conoce el Tribunal Constitucional, de acuerdo con el artículo 161.1.c) de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Solo pueden enfrentar al Estado con una Comunidad Autónoma, nunca a dos de ellas entre sí."
  - id: b
    text:
      es: "Enfrentan a las Comunidades Autónomas con los Ayuntamientos de su territorio."
  - id: c
    text:
      es: "Los resuelve el Tribunal Supremo y el Tribunal Constitucional conoce solo de su revisión."
  - id: d
    correct: true
    text:
      es: "Pueden enfrentar al Estado con una Comunidad Autónoma o a dos Comunidades Autónomas entre sí."
  explanation:
    es: "El artículo 161.1.c) atribuye al Tribunal «los conflictos de competencia entre el Estado y las Comunidades Autónomas o de los de éstas entre sí». Excluir los conflictos entre dos Comunidades recorta ese texto. Los Ayuntamientos no son parte en estos conflictos, y es el propio Tribunal Constitucional, no el Supremo, quien los resuelve."
  citation: "art. 161.1 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-161
- id: m01-l01-q0115
  prompt:
    es: "Señale la opción correcta. Conforme al artículo 161.2 de la Constitución Española de 1978, cuando el Gobierno impugna una disposición autonómica ante el Tribunal Constitucional, la impugnación produce:"
  options:
  - id: a
    text:
      es: "La anulación de la disposición."
  - id: b
    text:
      es: "La remisión previa del asunto al Consejo de Estado para dictamen."
  - id: c
    text:
      es: "Ningún efecto sobre la vigencia de la disposición hasta la sentencia."
  - id: d
    correct: true
    text:
      es: "La suspensión de la disposición recurrida."
  explanation:
    es: "El artículo 161.2 dice que la impugnación «producirá la suspensión de la disposición o resolución recurrida». No la anula: el Tribunal debe ratificar o levantar la suspensión. Tampoco hay trámite previo ante el Consejo de Estado. Y que no haya efecto sobre la vigencia contradice el texto, que prevé la suspensión desde la impugnación."
  citation: "art. 161.2 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-162
- id: m01-l01-q0118
  prompt:
    es: "Conforme al artículo 162.1.a) de la Constitución Española de 1978, para interponer el recurso de inconstitucionalidad están legitimados, entre otros, determinados parlamentarios en número de:"
  options:
  - id: a
    text:
      es: "Treinta Diputados o treinta Senadores."
  - id: b
    correct: true
    text:
      es: "Cincuenta Diputados o cincuenta Senadores."
  - id: c
    text:
      es: "Setenta y cinco Diputados o setenta y cinco Senadores."
  - id: d
    text:
      es: "Un décimo de los miembros de cualquiera de las Cámaras."
  explanation:
    es: "El artículo 162.1.a) habla de «50 Diputados, 50 Senadores». Treinta y setenta y cinco son cifras inventadas. La décima parte de los miembros de cualquiera de las Cámaras es la cifra que el artículo 167.3 exige para pedir el referéndum de reforma, no para este recurso."
  citation: "art. 162.1.a CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1978-31229-art-163
- id: m01-l01-q0121
  prompt:
    es: "Conforme al artículo 163 de la Constitución Española de 1978, la cuestión de inconstitucionalidad ante el Tribunal Constitucional la plantea:"
  options:
  - id: a
    correct: true
    text:
      es: "Un órgano judicial que dude de la validez de una norma con rango de ley aplicable al caso."
  - id: b
    text:
      es: "Cualquiera de las partes del proceso, directamente ante el Tribunal Constitucional."
  - id: c
    text:
      es: "El Ministerio Fiscal, a petición de los ciudadanos afectados."
  - id: d
    text:
      es: "El Tribunal Supremo, solo en recursos de casación."
  explanation:
    es: "El artículo 163 atribuye el planteamiento al «órgano judicial» que considere, en algún proceso, que una norma con rango de ley aplicable al caso puede ser contraria a la Constitución. Las partes no acuden directamente, el Ministerio Fiscal no actúa a petición de los ciudadanos y no se limita a recursos de casación ni al Tribunal Supremo."
  citation: "art. 163 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q0136
  prompt:
    es: "¿Cuál de las siguientes figuras prevé el artículo 167.1 de la Constitución Española de 1978 para intentar el acuerdo entre ambas Cámaras cuando no lo hay sobre un proyecto de reforma?"
  options:
  - id: a
    text:
      es: "Una Comisión Mixta formada por miembros del Gobierno y del Consejo de Estado."
  - id: b
    text:
      es: "Una Ponencia del Tribunal Constitucional con ocho Magistrados."
  - id: c
    correct: true
    text:
      es: "Una Comisión de composición paritaria de Diputados y Senadores."
  - id: d
    text:
      es: "Una Comisión del Congreso de los Diputados con mayoría de los Grupos mayoritarios."
  explanation:
    es: "El artículo 167.1 prevé «una Comisión de composición paritaria de Diputados y Senadores», que presenta un texto votado por el Congreso y el Senado. Ni el Gobierno con el Consejo de Estado, ni una ponencia del Tribunal Constitucional, ni una Comisión del Congreso solo intervienen en ese trámite."
  citation: "art. 167.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-62
- id: m01-l01-q0164
  prompt:
    es: "Conforme al artículo 62 de la Constitución Española de 1978, en relación con las leyes aprobadas por las Cortes Generales, corresponde al Rey:"
  options:
  - id: a
    text:
      es: "Aprobar y sancionar las leyes."
  - id: b
    text:
      es: "Promulgar las leyes que sancionen las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Sancionar y promulgar las leyes."
  - id: d
    text:
      es: "Sancionar las leyes y refrendar su publicación."
  explanation:
    es: "El artículo 62.a atribuye al Rey «sancionar y promulgar las leyes». Aprobar las leyes no es función del Rey: las aprueban las Cortes Generales. La sanción es del Rey, no de las Cortes. El Rey no refrenda: sus actos son los que se refrendan (art. 64.1)."
  citation: "art. 62.a CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-92
- id: m01-l01-q0166
  prompt:
    es: "De acuerdo con el artículo 92.2 de la Constitución Española de 1978, el referéndum consultivo será convocado por el Rey:"
  options:
  - id: a
    text:
      es: "Mediante propuesta del Presidente del Gobierno, previamente autorizada por las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados."
  - id: c
    text:
      es: "Mediante propuesta del Congreso de los Diputados, previamente autorizada por el Senado."
  - id: d
    text:
      es: "Mediante propuesta del Consejo de Ministros, sin necesidad de autorización parlamentaria."
  explanation:
    es: "El artículo 92.2 dice: «El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados». La autorización es del Congreso, no de las Cortes Generales ni del Senado. La propuesta es del Presidente del Gobierno, y sí necesita autorización."
  citation: "art. 92.2 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-100
- id: m01-l01-q0168
  prompt:
    es: "¿A propuesta de quién nombra y separa el Rey a los demás miembros del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "A propuesta del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Congreso de los Diputados."
  - id: c
    text:
      es: "A propuesta del Consejo de Ministros."
  - id: d
    text:
      es: "A propuesta del Presidente, previa autorización del Congreso."
  explanation:
    es: "El artículo 100 dice: «Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente». El artículo 62.e lo repite. No proponen el Congreso ni el Consejo de Ministros, y el texto no exige autorización del Congreso."
  citation: "art. 100 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-114
- id: m01-l01-q0173
  prompt:
    es: "Conforme al artículo 114.2 de la Constitución Española de 1978, si el Congreso adopta una moción de censura, el candidato incluido en ella:"
  options:
  - id: a
    text:
      es: "Deberá someterse a una votación de investidura antes de ser nombrado por el Rey."
  - id: b
    correct: true
    text:
      es: "Se entenderá investido de la confianza de la Cámara, y el Rey le nombrará Presidente del Gobierno."
  - id: c
    text:
      es: "Será propuesto por el Rey al Congreso tras consultar a los Grupos políticos."
  - id: d
    text:
      es: "Será nombrado Presidente del Gobierno por el Presidente del Congreso."
  explanation:
    es: "El artículo 114.2 dice que el candidato «se entenderá investido de la confianza de la Cámara a los efectos previstos en el artículo 99. El Rey le nombrará Presidente del Gobierno». No hay una votación de investidura aparte ni una nueva ronda de consultas del Rey. El nombramiento es del Rey; el Presidente del Congreso lo refrenda (art. 64.1)."
  citation: "art. 114.2 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-63
- id: m01-l01-q0184
  prompt:
    es: "Según el artículo 63.2 de la Constitución Española de 1978, al Rey corresponde manifestar el consentimiento del Estado para obligarse internacionalmente por medio de:"
  options:
  - id: a
    text:
      es: "Convenios que apruebe el Gobierno sin intervención de las Cortes Generales."
  - id: b
    text:
      es: "Declaraciones unilaterales del Presidente del Gobierno."
  - id: c
    correct: true
    text:
      es: "Tratados, de conformidad con la Constitución y las leyes."
  - id: d
    text:
      es: "Resoluciones del Ministro de Asuntos Exteriores, Unión Europea y Cooperación."
  explanation:
    es: "El artículo 63.2 dice «por medio de tratados, de conformidad con la Constitución y las leyes». No se obliga por convenios del Gobierno al margen de las Cortes, ni por declaraciones del Presidente, ni por resoluciones del Ministro de Asuntos Exteriores."
  citation: "art. 63.2 CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-115
- id: m01-l01-q0188
  prompt:
    es: "Según el artículo 115.1 de la Constitución Española de 1978, el decreto con el que el Rey acuerda la disolución del Congreso, del Senado o de las Cortes Generales fijará:"
  options:
  - id: a
    text:
      es: "La fecha de la investidura."
  - id: b
    text:
      es: "El número de escaños de cada circunscripción."
  - id: c
    correct: true
    text:
      es: "La fecha de las elecciones."
  - id: d
    text:
      es: "La composición de la Diputación Permanente."
  explanation:
    es: "El artículo 115.1 dice que «el decreto de disolución fijará la fecha de las elecciones». La investidura, los escaños de cada circunscripción y la Diputación Permanente no los fija ese decreto."
  citation: "art. 115.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "fecha"
# anchor: boe-a-1978-31229-art-58
- id: m01-l01-q0206
  prompt:
    es: "Señale la respuesta correcta sobre la Reina consorte o el consorte de la Reina, de acuerdo con el artículo 58 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Ejercen las funciones constitucionales del Rey cuando este se encuentra ausente."
  - id: b
    text:
      es: "Pueden asumir funciones constitucionales si las Cortes Generales las autorizan."
  - id: c
    correct: true
    text:
      es: "No pueden asumir funciones constitucionales, salvo lo dispuesto para la Regencia."
  - id: d
    text:
      es: "Asumen la tutela del Rey menor en todo caso."
  explanation:
    es: "El artículo 58 dice que no pueden asumir funciones constitucionales, «salvo lo dispuesto para la Regencia». No sustituyen al Rey en su ausencia, las Cortes no pueden autorizarles esas funciones y la tutela del Rey menor se rige por el artículo 60, no por su condición de consorte."
  citation: "art. 58 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1979-23709-art-7
- id: m01-l01-q0225
  prompt:
    es: "¿Cuántas Salas tiene el Tribunal Constitucional y cuántos Magistrados componen cada una, según la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "Dos Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: b
    text:
      es: "Tres Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: c
    text:
      es: "Cuatro Salas, compuestas cada una por tres Magistrados nombrados por el Presidente."
  - id: d
    correct: true
    text:
      es: "Dos Salas, compuestas cada una por seis Magistrados nombrados por el Tribunal en Pleno."
  explanation:
    es: "El artículo 7.1 de la LOTC dice que el Tribunal «consta de dos Salas» y que cada una «está compuesta por seis Magistrados nombrados por el Tribunal en Pleno». Las demás opciones cambian el número de Salas o de Magistrados. Las unidades de tres Magistrados son las Secciones (art. 8.1 LOTC), no las Salas."
  citation: "art. 7.1 LOTC"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1979-23709-art-76
- id: m01-l01-q0226
  prompt:
    es: "Según el artículo 76 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿en qué plazo puede el Gobierno impugnar las disposiciones normativas sin fuerza de ley y resoluciones de cualquier órgano de las Comunidades Autónomas?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los dos meses siguientes a su publicación o, en defecto de esta, desde que llegue a su conocimiento."
  - id: b
    text:
      es: "Dentro de los tres meses siguientes a su publicación en el diario oficial correspondiente."
  - id: c
    text:
      es: "Dentro de los cinco meses siguientes a su publicación, sin otra forma de cómputo."
  - id: d
    text:
      es: "Dentro de los nueve meses siguientes a su publicación, previo acuerdo de la Comisión Bilateral."
  explanation:
    es: "El artículo 76 de la LOTC fija «los dos meses siguientes a la fecha de su publicación o, en defecto de la misma, desde que llegare a su conocimiento». Tres meses es el plazo general del recurso de inconstitucionalidad (art. 33.1). Cinco meses es el plazo del Tribunal para ratificar o levantar la suspensión (art. 161.2 CE). Nueve meses es el plazo especial del artículo 33.2."
