- id: q093
  kind: single_choice
  prompt:
    es: 'De acuerdo con el artículo 70 del Código Aduanero de la Unión, aprobado por el Reglamento (UE) Nº 952/2013
      del Parlamento Europeo y del Consejo, la base principal para determinar el valor en aduana de las mercancías
      será:'
  options:
  - id: a
    text:
      es: El valor de transacción de mercancías idénticas que se vendan para su exportación al territorio aduanero
        de la Unión y se exporten a ella al mismo tiempo que las mercancías que deban valorarse o en una fecha próxima.
    correct: false
  - id: b
    text:
      es: El valor de transacción de mercancías similares que se vendan para su exportación al territorio aduanero
        de la Unión y se exporten a ella al mismo tiempo que las mercancías que deban valorarse o en una fecha próxima.
    correct: false
  - id: c
    text:
      es: El valor de transacción, que es el precio realmente pagado o por pagar por ellas cuando se vendan para
        su exportación al territorio aduanero de la Unión, ajustado, en su caso.
    correct: true
  - id: d
    text:
      es: El valor basado en el precio unitario al que se venda en el territorio aduanero de la Unión a personas
        no vinculadas con los vendedores la mayor cantidad total de las mercancías importadas o de otras mercancías
        idénticas o similares también importadas.
    correct: false
