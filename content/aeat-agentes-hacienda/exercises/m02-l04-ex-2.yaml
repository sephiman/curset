  prompt:
    es: "Según el artículo 83.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, para la información pública se publica un anuncio, a fin de que cualquier persona física o jurídica pueda examinar el expediente, en:"
