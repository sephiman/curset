# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q241
  prompt:
    es: "En Windows 11, al capturar un recorte con la herramienta Recortes, este se copia automáticamente:"
  options:
  - id: a
    text:
      es: "en el Portapapeles de Windows, sin abrir ninguna ventana ni guardarlo en ningún archivo"
  - id: b
    text:
      es: "en el escritorio, como un archivo de imagen nuevo con el nombre de la captura"
  - id: c
    correct: true
    text:
      es: "en la ventana de Recortes, donde se hacen cambios, se guarda y se comparte"
  - id: d
    text:
      es: "en la carpeta Descargas, como un archivo de imagen con la fecha de la captura"
  explanation:
    es: "La página dice que, cuando se captura un recorte, se copia automáticamente en la ventana de la herramienta Recortes, donde se realizan cambios, se guarda y se comparte. Además, el recorte se guarda automáticamente en la carpeta Capturas de pantalla."
  citation: "fuente: `ms-win-recortes.html`; «Captura cualquiera de los siguientes tipos de recortes»"
  difficulty: 2
  tags:
