- id: g-persistence-context
  term:
    en: persistence context
  definition:
    en: Both the org.hibernate.Session API and jakarta.persistence.EntityManager API represent a context for dealing with persistent data. This concept is called a persistence context.
  origin: m05-l07
  citation: hibernate-user-guide#pc
- id: g-detached-entity
  term:
    en: detached entity
  definition:
    en: A detached entity instance is an instance with a persistent identity that is not (or no longer) associated with a persistence context.
  origin: m05-l07
  citation: jakarta-persistence-spec#a1929
