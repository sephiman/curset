# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q005
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe la Alianza para el Gobierno Abierto (Open Government Partnership, OGP), según el Portal de la Transparencia?"
  options:
  - id: a
    text:
      es: "Es un órgano de la OCDE formado por representantes de los Gobiernos de sus Estados miembros."
  - id: b
    text:
      es: "Es un programa de las Naciones Unidas creado para el seguimiento de la Agenda 2030."
  - id: c
    text:
      es: "Es el espacio español de diálogo entre Administraciones públicas y sociedad civil con igual número de representantes."
  - id: d
    correct: true
    text:
      es: "Es una organización multilateral integrada por reformadores de las Administraciones públicas y de la sociedad civil."
  explanation:
    es: "El Portal la describe como «una organización multilateral integrada por reformadores de las Administraciones públicas y de la sociedad civil». No es un órgano de la OCDE ni un programa de las Naciones Unidas. El espacio español paritario de Administraciones y sociedad civil es el Foro de Gobierno Abierto."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q006
  prompt:
    es: "En la Alianza para el Gobierno Abierto (OGP), ¿quién evalúa el cumplimiento de los compromisos que cada miembro adquiere en sus planes de acción?"
  options:
  - id: a
    correct: true
    text:
      es: "El Mecanismo de Revisión Independiente (MRI) de la propia Alianza."
  - id: b
    text:
      es: "El Comité de Gobernanza Pública de la OCDE."
  - id: c
    text:
      es: "El foro político de alto nivel de las Naciones Unidas."
  - id: d
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  explanation:
    es: "El Portal de la Transparencia dice que la evaluación del cumplimiento de los compromisos «la realiza el Mecanismo de Revisión Independiente (MRI) de la Alianza». El Comité de Gobernanza Pública es de la OCDE. El foro político de alto nivel sigue la Agenda 2030. El Consejo de Transparencia y Buen Gobierno es un órgano español y no evalúa los planes de la OGP."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 2
  tags:
  - "órgano"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q007
  prompt:
    es: "¿En qué año se unió España a la Alianza para el Gobierno Abierto (Open Government Partnership, OGP)?"
  options:
  - id: a
    correct: true
    text:
      es: "En 2011, el mismo año de fundación de la Alianza."
  - id: b
    text:
      es: "En 2012, el primer año de su I Plan de Gobierno Abierto."
  - id: c
    text:
      es: "En 2014, el año en que comenzó su II Plan de Gobierno Abierto."
  - id: d
    text:
      es: "En 2017, el primer año de su III Plan de Gobierno Abierto."
  explanation:
    es: "La OGP se fundó en septiembre de 2011 y España se unió a ella «en el mismo año de su fundación». 2012, 2014 y 2017 son los años en que empezaron el I, el II y el III Plan, que España desarrolló ya como miembro."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 1
  tags:
  - "fecha"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l06-q008
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los principios de Gobierno Abierto que nombra la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017?"
  options:
  - id: a
    correct: true
    text:
      es: "Transparencia, integridad, rendición de cuentas y participación de las partes interesadas."
  - id: b
    text:
      es: "Transparencia, colaboración, participación ciudadana y rendición de cuentas."
  - id: c
    text:
      es: "Publicidad activa, derecho de acceso, buen gobierno e integridad pública."
  - id: d
    text:
      es: "Transparencia, integridad, eficacia y participación de las partes interesadas."
  explanation:
    es: "La Recomendación nombra cuatro principios: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. Una opción cambia la integridad por la colaboración. Otra mezcla el contenido de la Ley 19/2013 (publicidad activa, acceso y buen gobierno). Otra pone la eficacia en lugar de la rendición de cuentas."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
