- id: g-quality-of-service-class
  term: {en: quality of service (QoS) class}
  definition: {en: "A classification Kubernetes assigns to every Pod, based on the resource requests and limits of its component Containers. The possible QoS classes are Guaranteed, Burstable, and BestEffort."}
