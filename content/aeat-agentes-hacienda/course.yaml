# SPDX-License-Identifier: AGPL-3.0-only
# aeat-agentes-hacienda course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/aeat-agentes-course-requirements.md v1.1 (a delta to the C1 and C2 requirements). Programme:
# sources/programa.md (Anexo I, BOE-A-2025-27056). Module mNN is part NN of the programme (01 = I, 02 = II, 03 = III;
# the BOE does not number its three epígrafes, the course does) and lesson mNN-lMM its tema MM, so ids follow the
# official numbering. Block «Proceso selectivo» sits before the programme: m00 is the two exercises.
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are placeholders until round R2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: aeat-agentes-hacienda
  title:
    es: Agentes de la Hacienda Pública (C1)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: AEAT · acceso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Administrativo de la Administración del Estado, especialidad de Agentes de la
      Hacienda Pública, acceso libre, resumido tema a tema.
  languages: [es]
  status: draft
  # Stage 2 brings the first-exercise bank (requirements R6.1); this course has no exercises until then. The schema
  # requires at least one type, so quiz stands in; platform delta section M allows an empty list (R5.1).
  exercise_types: [quiz]
  # «Por tema» instead of «Por lección» in results and stats.
  lesson_noun:
    es: tema
  option_labels: letters
  # The PDF exports theory only.
  pdf_exercises: false
  # glyph / color: left for the publication round (docs/identity.md; R2.2 of the course requirements), with a glyph
  # distinct from C1's and C2's in the same family. No figures: this course has no figures/ tree.
blocks:
- id: block-a
  title:
    es: Proceso selectivo
  modules:
  - id: m00
    title:
      es: Los ejercicios
    summary:
      es: Las reglas de los dos ejercicios de la convocatoria de acceso libre.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el proceso selectivo
      summary:
        es: El primer ejercicio es un test de 80 preguntas sobre todo el programa, con un cuarto de penalización por
          error. El segundo son diez supuestos prácticos de los temas tributarios, contestados por escrito. La lección
          explica cómo se puntúan y qué cubre el curso.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización del Estado y funcionamiento de la Administración General del Estado
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m01-l01
      title:
        es: 'La Constitución Española de 1978: Estructura y contenido. Derechos y deberes fundamentales. Su garantía y
          suspensión. La Corona. El Tribunal Constitucional.'
      summary:
        es: Resumen pendiente.
    - id: m01-l02
      title:
        es: 'Las Cortes Generales: Composición, atribuciones y funcionamiento. El Defensor del Pueblo. El Poder Judicial.
          El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial española.'
      summary:
        es: Resumen pendiente.
    - id: m01-l03
      title:
        es: 'El Gobierno: Nombramiento y cese. Las funciones del Gobierno. La Administración Pública: Principios
          constitucionales informadores. La Administración central y periférica del Estado. Tipos de Entes
          Públicos.'
      summary:
        es: Resumen pendiente.
    - id: m01-l04
      title:
        es: 'La organización territorial del Estado. Comunidades y Ciudades Autónomas. Las Entidades Locales. Las
          Instituciones de la Unión Europea: El Consejo, el Parlamento Europeo, la Comisión, el Tribunal de
          Justicia.'
      summary:
        es: Resumen pendiente.
    - id: m01-l05
      title:
        es: 'El funcionamiento electrónico del sector público. Derecho y obligación de relacionarse electrónicamente con
          las Administraciones Públicas, registros y archivo electrónico. El Gobierno abierto, la
          transparencia, el acceso a la información pública, la participación en la rendición de cuentas y el
          buen gobierno. Normativa reguladora de la protección de datos personales: principios, derechos de
          las personas y ejercicios de los derechos.'
      summary:
        es: Resumen pendiente.
    - id: m01-l06
      title:
        es: 'Políticas de igualdad de género, no discriminación y contra la violencia de género. Discapacidad y
          dependencia: régimen jurídico.'
      summary:
        es: Resumen pendiente.
    - id: m01-l07
      title:
        es: Régimen jurídico del personal al servicio de las Administraciones Públicas. El Estatuto Básico del Empleado
          Público. Derechos y deberes de los funcionarios. La provisión de puestos de trabajo y la carrera
          administrativa. Situaciones administrativas. Incompatibilidades y régimen disciplinario. El régimen
          de Seguridad Social de los funcionarios.
      summary:
        es: Resumen pendiente.
  - id: m02
    title:
      es: Derecho Administrativo General
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m02-l01
      title:
        es: Las fuentes del Derecho Administrativo. La jerarquía de las fuentes. La Constitución. La Ley. El Reglamento.
          El ordenamiento jurídico de la Unión Europea.
      summary:
        es: Resumen pendiente.
    - id: m02-l02
      title:
        es: Los actos administrativos. Concepto y clases. Motivación, forma y eficacia de los actos administrativos.
          Notificación y publicación. Nulidad y anulabilidad. La revisión de oficio.
      summary:
        es: Resumen pendiente.
    - id: m02-l03
      title:
        es: El procedimiento administrativo común. La capacidad de obrar y el concepto de interesado. Representación.
          Identificación y firma de los interesados. Derechos del interesado en el procedimiento
          administrativo. Obligación de resolver y silencio administrativo. Términos y plazos.
      summary:
        es: Resumen pendiente.
    - id: m02-l04
      title:
        es: 'Las fases del procedimiento administrativo: Iniciación, ordenación, instrucción y finalización. La ejecución
          de los actos y resoluciones administrativas.'
      summary:
        es: Resumen pendiente.
    - id: m02-l05
      title:
        es: 'Los recursos administrativos: concepto y clases. Recurso de alzada. Recurso potestativo de reposición.
          Recurso extraordinario de revisión. La jurisdicción contencioso-administrativa: objeto y plazos de
          interposición del recurso contencioso-administrativo.'
      summary:
        es: Resumen pendiente.
  - id: m03
    title:
      es: Organización de la Hacienda Pública y Derecho Tributario
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m03-l01
      title:
        es: El sistema fiscal español. Principios impositivos en la Constitución Española. Los impuestos de titularidad
          estatal y sus características. La Hacienda Pública Estatal, Autonómica y Local.
      summary:
        es: Resumen pendiente.
    - id: m03-l02
      title:
        es: 'La Agencia Estatal de Administración Tributaria: creación, naturaleza, objetivos, funciones y organización.'
      summary:
        es: Resumen pendiente.
    - id: m03-l03
      title:
        es: 'Derecho Tributario: concepto y contenido. Fuentes. Los tributos: concepto y clasificación. La obligación
          tributaria. Hecho imponible. Devengo. Base imponible y liquidable. Cuota y deuda tributaria.'
      summary:
        es: Resumen pendiente.
    - id: m03-l04
      title:
        es: Obligaciones tributarias formales. Derechos y garantías de los obligados tributarios. Los obligados
          tributarios. La capacidad de obrar en el orden tributario. Representación y domicilio fiscal. Plazos
          de prescripción.
      summary:
        es: Resumen pendiente.
    - id: m03-l05
      title:
        es: 'Información y Asistencia a los obligados tributarios. La colaboración social en la aplicación de los
          tributos. Carácter reservado de los datos con trascendencia tributaria. Normas comunes sobre
          actuaciones y procedimientos tributarios: fases. Las liquidaciones tributarias. Obligación de
          resolver y plazos de resolución. Carga de la prueba. Las notificaciones.'
      summary:
        es: Resumen pendiente.
    - id: m03-l06
      title:
        es: 'Las declaraciones tributarias: concepto y clases. Las autoliquidaciones. Las comunicaciones de datos. Los
          pagos a cuenta.'
      summary:
        es: Resumen pendiente.
    - id: m03-l07
      title:
        es: 'Actuaciones y procedimiento de gestión tributaria. Los procedimientos de gestión tributaria: iniciación,
          trámites y terminación. El procedimiento de verificación de datos. El procedimiento de comprobación
          de valores. El procedimiento de comprobación limitada. Rectificación de autoliquidaciones,
          declaraciones, comunicaciones de datos e iniciación del procedimiento de devolución.'
      summary:
        es: Resumen pendiente.
    - id: m03-l08
      title:
        es: 'Actuaciones y procedimiento de inspección: funciones y facultades. Documentación de las actuaciones de
          inspección. La personación de la inspección en el domicilio o locales del contribuyente. El
          procedimiento de inspección: iniciación, desarrollo y terminación. Las medidas cautelares en el
          procedimiento inspector.'
      summary:
        es: Resumen pendiente.
    - id: m03-l09
      title:
        es: 'La extinción de la deuda tributaria (I). Medios de extinción de la deuda. El pago o cumplimiento: forma,
          momento, plazos, imputación, consignación y medios de pago. Aplazamiento y fraccionamiento del
          pago.'
      summary:
        es: Resumen pendiente.
    - id: m03-l10
      title:
        es: 'La extinción de la deuda tributaria (II). Otras formas de extinción de las deudas: la compensación, la
          extinción de deudas de las entidades de derecho público mediante deducciones sobre transferencias.
          La condonación. Baja provisional por insolvencia. Terminación del procedimiento de apremio.'
      summary:
        es: Resumen pendiente.
    - id: m03-l11
      title:
        es: 'Las actuaciones y el procedimiento de recaudación tributaria: la recaudación en período ejecutivo.
          Iniciación. Efectos. Recargos del período ejecutivo. Procedimiento de apremio: características,
          concurrencia y suspensión del procedimiento. Providencia de apremio: concepto y plazos para el pago.
          Las garantías de la deuda tributaria: tipos y ejecución de garantías.'
      summary:
        es: Resumen pendiente.
    - id: m03-l12
      title:
        es: 'El embargo. Facultades de la recaudación. Las diligencias de embargo: concepto y motivos de oposición.
          Práctica del embargo de bienes y derechos. Depósito y enajenación de los bienes embargados. El
          procedimiento frente a responsables. Procedimiento de recaudación frente a los sucesores.'
      summary:
        es: Resumen pendiente.
    - id: m03-l13
      title:
        es: 'La potestad sancionadora en materia tributaria. Principios. Sujetos responsables. Concepto y clases de
          infracciones y sanciones tributarias. Cuantificación de las sanciones tributarias pecuniarias.
          Extinción de la responsabilidad derivada de las infracciones tributarias y extinción de las
          sanciones tributarias. Procedimiento sancionador en materia tributaria: iniciación, instrucción y
          terminación.'
      summary:
        es: Resumen pendiente.
    - id: m03-l14
      title:
        es: Revisión en vía administrativa. El recurso de reposición. Las reclamaciones económico-administrativas. Los
          Tribunales Económico-Administrativos.
      summary:
        es: Resumen pendiente.
    - id: m03-l15
      title:
        es: 'El Impuesto sobre la Renta de las Personas Físicas (I). Naturaleza, objeto y ámbito de aplicación. Sujeción
          al impuesto: aspectos materiales, personales y temporales. Rendimientos del trabajo, rendimientos
          del capital mobiliario, rendimientos del capital inmobiliario, rendimientos de actividades
          económicas. Imputación de rentas inmobiliarias. Ganancias y pérdidas patrimoniales.'
      summary:
        es: Resumen pendiente.
    - id: m03-l16
      title:
        es: 'El Impuesto sobre la Renta de las Personas Físicas (II): clases de Renta. Integración y compensación de
          rentas. Base liquidable general y del ahorro. Adecuación del impuesto a las circunstancias
          personales y familiares del contribuyente. Cálculo del impuesto estatal. Cuota diferencial.
          Tributación familiar. Gestión del Impuesto.'
      summary:
        es: Resumen pendiente.
    - id: m03-l17
      title:
        es: 'El Impuesto sobre Sociedades: naturaleza y ámbito de aplicación. Hecho imponible. Contribuyentes. Concepto y
          determinación de la base imponible. Reglas de imputación temporal. Reducciones en la base imponible.
          Período impositivo y devengo del impuesto. Tipo de gravamen y cuota íntegra. Deducciones para evitar
          la doble imposición internacional. Bonificaciones. Declaración, autoliquidación y liquidación
          provisional. Devolución.'
      summary:
        es: Resumen pendiente.
    - id: m03-l18
      title:
        es: 'El Impuesto sobre el Valor Añadido (I). Naturaleza y ámbito de aplicación. Entregas de bienes y prestaciones
          de servicios: hecho imponible. Exenciones. Lugar de realización del hecho imponible.'
      summary:
        es: Resumen pendiente.
    - id: m03-l19
      title:
        es: 'El Impuesto sobre el Valor Añadido (II). Sujetos pasivos. Repercusión del impuesto. Devengo del impuesto.
          Base imponible. Deducciones: requisitos subjetivos de la deducción y limitaciones del derecho a
          deducir. Régimen de deducciones en sectores diferenciados de la actividad empresarial o profesional.
          Regla de prorrata. Regularización de deducciones por bienes de inversión. Devoluciones.'
      summary:
        es: Resumen pendiente.
    - id: m03-l20
      title:
        es: 'La Aduana: representación aduanera. Deuda aduanera de importación y deuda aduanera de exportación. Inclusión
          de mercancías en un régimen aduanero: disposiciones generales.'
      summary:
        es: Resumen pendiente.
