# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q035
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta abre la ventana Relaciones?"
  options:
  - id: a
    text:
      es: "Datos externos › Relaciones › Relaciones"
  - id: b
    correct: true
    text:
      es: "Herramientas de base de datos › Relaciones › Relaciones"
  - id: c
    text:
      es: "Crear › Tablas › Relaciones"
  - id: d
    text:
      es: "Diseño de tabla › Herramientas › Relaciones"
  explanation:
    es: "La ayuda dice: «En la pestaña Herramientas de base de datos, en el grupo Relaciones, haga clic en Relaciones». «Datos externos › Relaciones» no existe en la ayuda: esa pestaña agrupa importación y exportación. «Crear › Tablas» sirve para crear tablas. «Diseño de tabla › Herramientas» contiene, por ejemplo, la Clave principal."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q036
  prompt:
    es: "En Access 365, ¿cuál de los siguientes comandos de la pestaña Diseño de relaciones muestra todas las relaciones y tablas relacionadas de la base de datos?"
  options:
  - id: a
    text:
      es: "Relaciones directas"
  - id: b
    text:
      es: "Agregar tablas"
  - id: c
    correct: true
    text:
      es: "Todas las relaciones"
  - id: d
    text:
      es: "Informe de relaciones"
  explanation:
    es: "La ayuda dice: De Todas las relaciones: «Muestra todas las relaciones y tablas relacionadas de la base de datos en la ventana Relaciones». «Relaciones directas» muestra las de la tabla seleccionada. «Agregar tablas» permite seleccionar tablas para mostrarlas. «Informe de relaciones» crea un informe con las tablas y relaciones."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q037
  prompt:
    es: "En Access 365, ¿cuál de los siguientes comandos de la pestaña Diseño de relaciones muestra las relaciones y tablas relacionadas de la tabla seleccionada?"
  options:
  - id: a
    text:
      es: "Todas las relaciones"
  - id: b
    text:
      es: "Ocultar tabla"
  - id: c
    text:
      es: "Borrar diseño"
  - id: d
    correct: true
    text:
      es: "Relaciones directas"
  explanation:
    es: "La ayuda dice: De Relaciones directas: «Muestra todas las relaciones y tablas relacionadas de la tabla seleccionada en la ventana Relaciones, si aún no se muestran». «Todas las relaciones» muestra las de toda la base de datos. «Ocultar tabla» oculta la tabla seleccionada. «Borrar diseño» quita las tablas y relaciones de la ventana, aunque solo las oculta."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q038
  prompt:
    es: "Según la ayuda de Access 365, ¿qué hace el comando Borrar diseño de la ventana Relaciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Quita tablas y relaciones de la ventana, pero no las elimina"
  - id: b
    text:
      es: "Elimina las relaciones de la base de datos"
  - id: c
    text:
      es: "Elimina las tablas y los datos relacionados"
  - id: d
    text:
      es: "Quita solo las relaciones sin integridad referencial"
  explanation:
    es: "La ayuda dice: De Borrar diseño: «Quita todas las tablas y relaciones para que no se muestren en la ventana Relaciones. Observe que este comando solo oculta las relaciones y tablas, no las elimina». Por eso «elimina las relaciones de la base de datos» y «elimina las tablas y los datos relacionados» son falsos. «Quita solo las relaciones sin integridad referencial» tampoco figura: quita todas, de la vista."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q039
  prompt:
    es: "En Access 365, ¿cómo se abre el cuadro de diálogo Modificar relaciones para cambiar una relación de tabla?"
  options:
  - id: a
    text:
      es: "Con Borrar diseño, y luego Informe de relaciones"
  - id: b
    correct: true
    text:
      es: "Con Editar relaciones o doble clic en la línea"
  - id: c
    text:
      es: "Con Relaciones directas, sobre la tabla del lado «varios»"
  - id: d
    text:
      es: "Con Cerrar, guardando los cambios del diseño"
  explanation:
    es: "La ayuda dice de Editar relaciones: «Abre el cuadro de diálogo Modificar relaciones», y añade: «También puede hacer doble clic en la línea de relación». «Con Borrar diseño, y luego Informe de relaciones» no sirve: Borrar diseño solo oculta tablas y relaciones, e Informe de relaciones crea un informe. «Con Relaciones directas, sobre la tabla del lado «varios»» tampoco: ese comando muestra las relaciones y tablas relacionadas de la tabla seleccionada. «Con Cerrar, guardando los cambios del diseño» cierra la ventana Relaciones y, si se hicieron cambios, pide guardarlos."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q040
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de las siguientes opciones describe cómo se representa en la ventana Relaciones una relación que exige integridad referencial?"
  options:
  - id: a
    text:
      es: "Con una línea delgada entre los campos comunes"
  - id: b
    text:
      es: "Con una línea de puntos entre las dos tablas"
  - id: c
    correct: true
    text:
      es: "Línea gruesa en los extremos, con el 1 y el símbolo ∞"
  - id: d
    text:
      es: "Con una línea gruesa, sin símbolos en los extremos"
  explanation:
    es: "La ayuda dice: «Si exige la integridad referencial, la línea aparecerá más gruesa en los extremos. Además, aparece el número 1 sobre la parte gruesa de un extremo […] y aparece el símbolo de infinito (∞) en la parte gruesa del otro extremo». Una línea delgada entre los campos comunes es, según la página, la relación que no exige integridad referencial. La línea de puntos no es una de las representaciones que la página describe: solo habla de línea delgada, de línea más gruesa al seleccionar la relación y de línea gruesa en los extremos. Y la línea gruesa sin símbolos omite el 1 y el ∞, que la página incluye en la relación con integridad referencial."
  citation: "fuente: `ms-access-relaciones.html`; «Ver relaciones de tablas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q041
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de las siguientes afirmaciones describe cómo se representa una relación de uno a varios en el diseño de la base de datos?"
  options:
  - id: a
    text:
      es: "La clave principal del lado «varios» se agrega a la tabla del lado «uno»"
  - id: b
    text:
      es: "Se crea una tabla de unión con las claves de ambas tablas"
  - id: c
    text:
      es: "Se unen las dos tablas en una sola con todos los campos"
  - id: d
    correct: true
    text:
      es: "La clave principal del lado «uno» pasa a la tabla del lado «varios»"
  explanation:
    es: "La ayuda dice: «tome la clave principal del lado \"uno\" de la relación y agréguela como campo o campos adicionales a la tabla en el lado \"varios\" de la relación». Agregar la clave principal del lado varios a la tabla del lado uno invierte los lados. «Se crea una tabla de unión» es la solución de la relación varios a varios. «Se unen las dos tablas en una sola» se parece más a una relación uno a uno, que suele resolverse almacenando la información en la misma tabla."
  citation: "fuente: `ms-access-relaciones.html`; «Tipos de relaciones de tablas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q043
  prompt:
    es: "En Access 365, ¿cuál de los siguientes usos tiene una relación uno a uno, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Para evitar que dos registros compartan el mismo valor en un campo"
  - id: b
    correct: true
    text:
      es: "Para dividir una tabla con muchos campos o por seguridad"
  - id: c
    text:
      es: "Para representar que cada producto aparece en muchos pedidos"
  - id: d
    text:
      es: "Para almacenar siempre toda la información en una única tabla"
  explanation:
    es: "La ayuda dice: «Puede usar la relación uno a uno para dividir una tabla con muchos campos, para aislar parte de una tabla por razones de seguridad o para almacenar información que solo se aplica a un subconjunto de la tabla principal». «Evitar que dos registros compartan el mismo valor» describe un índice sin duplicados. «Cada producto aparece en muchos pedidos» describe una relación varios a varios. «Almacenar siempre toda la información en una única tabla» contradice el uso que da la ayuda a esta relación."
  citation: "fuente: `ms-access-relaciones.html`; «Tipos de relaciones de tablas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q046
  prompt:
    es: "En Access 365, con la integridad referencial aplicada y la opción Eliminar en cascada los registros relacionados seleccionada, ¿qué ocurre al eliminar un registro del lado de la clave principal?"
  options:
  - id: a
    text:
      es: "Access rechaza la eliminación mientras existan registros relacionados"
  - id: b
    correct: true
    text:
      es: "Access elimina automáticamente los registros que la referencian"
  - id: c
    text:
      es: "Access deja los registros relacionados sin clave externa"
  - id: d
    text:
      es: "Access actualiza los campos relacionados con el nuevo valor"
  explanation:
    es: "La ayuda dice: «se elimina un registro en el lado de la clave principal de la relación, Access elimina automáticamente todos los registros que hacen referencia a la clave principal». «Rechaza la eliminación mientras existan registros relacionados» es el comportamiento de la integridad referencial sin la opción de cascada. «Deja los registros relacionados sin clave externa» crearía huérfanos, justo lo que la integridad evita. «Actualiza los campos relacionados» es lo que hace la otra opción, Actualizar en cascada los campos relacionados."
  citation: "fuente: `ms-access-relaciones.html`; «Descripción de la integridad referencial»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q047
  prompt:
    es: "En Access 365, ¿qué hace la opción Actualizar en cascada los campos relacionados cuando se actualiza una clave principal con la integridad referencial aplicada?"
  options:
  - id: a
    text:
      es: "Elimina los registros relacionados con la clave principal anterior"
  - id: b
    text:
      es: "Rechaza el cambio de clave principal mientras existan pedidos relacionados"
  - id: c
    correct: true
    text:
      es: "Actualiza todos los campos que hacen referencia a la clave principal"
  - id: d
    text:
      es: "Crea una copia de la clave principal en la tabla relacionada"
  explanation:
    es: "La ayuda dice que, con la opción Actualizar en cascada los campos relacionados, al actualizar una clave principal «Access actualiza automáticamente todos los campos que hacen referencia a la clave principal». Eliminar los registros relacionados es el efecto de otra opción, Eliminar en cascada los registros relacionados. Rechazar el cambio es lo que hace la integridad referencial sin ninguna de las dos opciones: la página dice que Access rechaza las actualizaciones que cambian el destino de una referencia. Y crear una copia de la clave en la tabla relacionada no es lo que describe: los campos que ya hacen referencia se actualizan."
  citation: "fuente: `ms-access-relaciones.html`; «Descripción de la integridad referencial»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-relaciones-html
- id: m02-l10-q048
  prompt:
    es: "En Access 365, ¿cuál de las siguientes formas permite crear relaciones de tablas, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Solo con el Asistente para consultas de la pestaña Crear"
  - id: b
    text:
      es: "Solo escribiendo una instrucción SQL con la cláusula WHERE"
  - id: c
    text:
      es: "Solo exportando las tablas desde la pestaña Datos externos"
  - id: d
    correct: true
    text:
      es: "En la ventana Relaciones o arrastrando un campo desde Lista de campos"
  explanation:
    es: "La ayuda dice: «Puede crear relaciones de tablas explícitamente mediante la ventana Relaciones, o bien arrastrando un campo desde el panel Lista de campos». «Solo con el Asistente para consultas», «solo escribiendo una instrucción SQL» y «solo exportando las tablas» limitan a una vía que la ayuda no da como única para crear relaciones."
  citation: "fuente: `ms-access-relaciones.html`; «¿Por qué crear relaciones de tablas?»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q050
  prompt:
    es: "Según la ayuda de Access 365, ¿qué ocurre con la hoja de cálculo de origen al importar datos de Excel a una tabla?"
  options:
  - id: a
    text:
      es: "Access mueve los datos a la tabla y vacía la hoja de origen"
  - id: b
    text:
      es: "Access crea una tabla vinculada que refleja los cambios de la hoja"
  - id: c
    text:
      es: "Access guarda el libro de Excel como una base de datos de Access"
  - id: d
    correct: true
    text:
      es: "Access copia los datos en una tabla y no altera la hoja de origen"
  explanation:
    es: "La página dice: «Al importar datos, Access crea una copia de los datos en una tabla nueva o existente sin alterar la hoja de cálculo de origen de Excel». «Access mueve los datos a la tabla y vacía la hoja de origen» contradice que no se altere el origen. «Crea una tabla vinculada que refleja los cambios» describe la vinculación, no la importación. «Access guarda el libro de Excel como una base de datos de Access» no es posible: «No existe ninguna forma de guardar un libro de Excel como base de datos de Access»."
  citation: "fuente: `ms-access-importar-excel.html`; «Comprender la importación de datos de Excel»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q051
  prompt:
    es: "En Access 365, ¿cuál es el número máximo de columnas de origen que se pueden importar desde una hoja de Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "255"
  - id: b
    text:
      es: "256"
  - id: c
    text:
      es: "128"
  - id: d
    text:
      es: "1.024"
  explanation:
    es: "La página dice: «El número de columnas de origen que desea importar no puede ser superior a 255 porque Access no admite más de 255 campos en una tabla». Por eso 256 supera el máximo por una columna, 128 se queda corto y 1.024 queda muy por encima."
  citation: "fuente: `ms-access-importar-excel.html`; «Preparar la hoja de cálculo»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q052
  prompt:
    es: "En Access 365, ¿cuántas hojas de cálculo se pueden importar a la vez durante una operación de importación?"
  options:
  - id: a
    text:
      es: "Todas las hojas del libro de Excel a la vez"
  - id: b
    correct: true
    text:
      es: "Una sola; hay que repetir la operación con cada hoja"
  - id: c
    text:
      es: "Hasta tres hojas, si tienen las mismas columnas"
  - id: d
    text:
      es: "Todas las hojas cuyo nombre coincida con una tabla"
  explanation:
    es: "La página dice: «puede importar solo una hoja de cálculo a la vez durante una operación de importación. Para importar datos de varias hojas de cálculo, repita la operación de importación para cada hoja de cálculo». Por eso «Todas las hojas del libro de Excel a la vez» es falso, y también «hasta tres hojas, si tienen las mismas columnas» y «todas las hojas cuyo nombre coincida con una tabla», que no figuran en la página."
  citation: "fuente: `ms-access-importar-excel.html`; «Preparar la hoja de cálculo»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q053
  prompt:
    es: "En Access 365, ¿cuál de las siguientes formas permite importar solo una parte de una hoja de cálculo de Excel?"
  options:
  - id: a
    text:
      es: "Filtrando las filas que sobran en el asistente de importación"
  - id: b
    text:
      es: "Omitiendo las filas sobrantes con la casilla Saltar del asistente"
  - id: c
    correct: true
    text:
      es: "Definiendo en Excel un rango con nombre que incluya solo esas celdas"
  - id: d
    text:
      es: "Escribiendo el rango de celdas en el cuadro Nombre de archivo"
  explanation:
    es: "La página dice: «Si desea importar solo una parte de una hoja de cálculo, puede definir un rango con nombre que incluya solo las celdas que desea importar». Filtrar las filas en el asistente y omitirlas con una casilla contradicen la página: «No puede filtrar ni omitir filas durante la operación de importación». Y escribir el rango en el cuadro Nombre de archivo no es el procedimiento: el rango se define con nombre en Excel y el asistente pide buscar el archivo de origen y elegir la hoja."
  citation: "fuente: `ms-access-importar-excel.html`; «Preparar la hoja de cálculo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q055
  prompt:
    es: "En Access 365, ¿cuántas filas de origen explora Access en cada columna para determinar el tipo de datos de los campos de la tabla al importar?"
  options:
  - id: a
    correct: true
    text:
      es: "Las ocho primeras"
  - id: b
    text:
      es: "La primera"
  - id: c
    text:
      es: "Las cien primeras"
  - id: d
    text:
      es: "Todas"
  explanation:
    es: "La página dice: «Access explora las ocho primeras filas de origen para determinar el tipo de datos de los campos de la tabla». Por eso «la primera» y «las cien primeras» no son las filas que explora, y «todas» tampoco: la página advierte de que los valores de tipos distintos tras la fila ocho pueden omitirse o convertirse mal."
  citation: "fuente: `ms-access-importar-excel.html`; «Preparar la hoja de cálculo»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q056
  prompt:
    es: "En Access 365, al importar una hoja de Excel a una tabla existente con la opción de anexar, ¿qué debe coincidir exactamente con los nombres de los campos de la tabla?"
  options:
  - id: a
    text:
      es: "El nombre de la hoja de cálculo de origen"
  - id: b
    correct: true
    text:
      es: "Los encabezados de las columnas de la hoja de origen"
  - id: c
    text:
      es: "El nombre del archivo de Excel de origen"
  - id: d
    text:
      es: "El nombre del rango con nombre de origen"
  explanation:
    es: "La página dice: «Si está anexando datos a una tabla existente, asegúrese de que los encabezados de columna en la hoja de cálculo de origen coincidan exactamente con los nombres de los campos en la tabla de destino». El nombre de la hoja de cálculo sirve para elegir qué importar: el asistente pide «seleccione la hoja de cálculo o el rango con nombre que desee importar». El nombre del archivo de Excel es el que se escribe «en el cuadro Nombre de archivo» para localizar los datos. Y el nombre del rango sirve para acotar el origen: «Si desea importar solo una parte de una hoja de cálculo, puede definir un rango con nombre que incluya solo las celdas que desea importar»."
  citation: "fuente: `ms-access-importar-excel.html`; «Si está anexando datos a una tabla existente, asegúrese de que los encabezados de columna en la hoja de cálculo de origen coincidan exactamente con los nombres de los campos en la tabla de destino.»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q059
  prompt:
    es: "Al importar a Access 365 una celda de Excel que contiene una fórmula, se importa:"
  options:
  - id: a
    correct: true
    text:
      es: "El resultado del cálculo, pero no la fórmula"
  - id: b
    text:
      es: "La fórmula, pero no el resultado"
  - id: c
    text:
      es: "La fórmula y el resultado, en dos campos"
  - id: d
    text:
      es: "Ni la fórmula ni el resultado"
  explanation:
    es: "La página dice: «Se importan los resultados de una columna o las celdas calculadas pero no la formula base». Por eso «la fórmula, pero no el resultado» es lo contrario. «La fórmula y el resultado, en dos campos» y «ni la fórmula ni el resultado» tampoco figuran en la página."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q060
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de los siguientes elementos de una hoja de Excel hay que agregar manualmente a la base de datos tras importarla?"
  options:
  - id: a
    text:
      es: "Los resultados de las celdas calculadas"
  - id: b
    correct: true
    text:
      es: "Los logotipos, gráficos e imágenes"
  - id: c
    text:
      es: "El texto con formato de negrita o cursiva"
  - id: d
    text:
      es: "Las fechas de las celdas con formato de fecha"
  explanation:
    es: "La página dice: «No se pueden importar elementos gráficos como logotipos, gráficos e imágenes. Agréguelos manualmente a la base de datos después de finalizar la operación de importación». «Los resultados de las celdas calculadas» sí se importan: «Se importan los resultados de una columna o las celdas calculadas pero no la formula base». «El texto con formato de negrita o cursiva» también se importa: «el texto se importa, pero se pierde el formato». «Las fechas de las celdas con formato de fecha» se importan, con los desajustes de sistema de fechas que la página describe."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q062
  prompt:
    es: "Una lista de valores separados por punto y coma de una celda de Excel se trata, al importarla a Access 365:"
  options:
  - id: a
    text:
      es: "Como un campo con compatibilidad con varios valores"
  - id: b
    text:
      es: "Como un registro distinto para cada valor"
  - id: c
    text:
      es: "Como una columna distinta para cada valor"
  - id: d
    correct: true
    text:
      es: "Como un valor único en un campo de texto"
  explanation:
    es: "La página dice: «Access no habilita la compatibilidad con varios valores en un campo, incluso si la columna de origen contiene una lista de valores separados por punto y coma (;). La lista de valores se trata como un valor único y se incluye en un campo de texto». Por eso «un campo con compatibilidad con varios valores» es falso, y «un registro distinto» y «una columna distinta» para cada valor tampoco figuran en la página."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q063
  prompt:
    es: "En Access 365, ¿cuál de las siguientes expresiones de una consulta de actualización corrige las fechas importadas desplazadas cuatro años?"
  options:
  - id: a
    correct: true
    text:
      es: "[nombre de campo de fecha] + 1462"
  - id: b
    text:
      es: "[nombre de campo de fecha] + 1461"
  - id: c
    text:
      es: "[nombre de campo de fecha] + 365"
  - id: d
    text:
      es: "[nombre de campo de fecha] - 1462"
  explanation:
    es: "La página dice: «ejecute una consulta de actualización que utilice la expresión [nombre de campo de fecha] + 1462 para corregir las fechas». Por eso «+ 1461» se queda a un día, «+ 365» corrige solo un año y «- 1462» resta en lugar de sumar."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 3
  tags:
  - "función"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q064
  prompt:
    es: "En Access 365, ¿cuáles son los tres campos de la tabla de registro de errores de una operación de importación?"
  options:
  - id: a
    text:
      es: "Error, Tabla y Registro"
  - id: b
    text:
      es: "Mensaje, Hoja y Columna"
  - id: c
    correct: true
    text:
      es: "Error, Campo y Fila"
  - id: d
    text:
      es: "Campo, Valor y Fila"
  explanation:
    es: "La página dice: «La tabla tiene tres campos: Error, Campo y Fila». Por eso «Error, Tabla y Registro», «Mensaje, Hoja y Columna» y «Campo, Valor y Fila» no son los campos de esa tabla, aunque cada una comparta algún nombre con ella."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q065
  prompt:
    es: "En la tabla de registro de errores de una importación a Access 365, ¿cuál de los siguientes significados tiene el error Infracción de clave?"
  options:
  - id: a
    text:
      es: "Que un valor es demasiado grande para el tamaño del campo"
  - id: b
    text:
      es: "Que un valor infringe la regla de validación del campo"
  - id: c
    text:
      es: "Que se ha intentado guardar un valor nulo en un campo requerido"
  - id: d
    correct: true
    text:
      es: "Que el valor de clave principal ya existe en la tabla"
  explanation:
    es: "Del error Infracción de clave la página dice: «El valor de clave principal de este registro es un duplicado que ya existe en la tabla». «Que un valor es demasiado grande para el tamaño del campo» es el error Truncamiento de campo. «Que un valor infringe la regla de validación del campo» es el error de regla de validación. «Que se ha intentado guardar un valor nulo en un campo requerido» es el error Nulo en campo requerido."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q066
  prompt:
    es: "Señale qué significa el mensaje Error al intentar importar el archivo que muestra Access 365 al terminar una importación:"
  options:
  - id: a
    correct: true
    text:
      es: "Que la operación de importación se ejecutó de forma totalmente incorrecta"
  - id: b
    text:
      es: "Que se importaron solo algunos datos del archivo"
  - id: c
    text:
      es: "Que la importación terminó, con errores anotados en una tabla de registro"
  - id: d
    text:
      es: "Que el libro de Excel de origen estaba abierto"
  explanation:
    es: "La página dice: «Si recibe el mensaje Error al intentar importar el archivo, la operación de importación se ejecutó de forma totalmente incorrecta». Si importó todos o parte de los datos, Access pide guardar la información de la operación y la tabla de registro de errores recoge los errores, lo que descarta «Que se importaron solo algunos datos del archivo» y «Que la importación terminó, con errores anotados en una tabla de registro». «Que el libro de Excel de origen estaba abierto» puede producir errores de conversión, pero no es lo que indica ese mensaje."
  citation: "fuente: `ms-access-importar-excel.html`; «Solucionar valores que faltan o son incorrectos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-importar-excel-html
- id: m02-l10-q067
  prompt:
    es: "Según la ayuda de Access 365, ¿qué ocurre con los cambios hechos en las celdas de origen de Excel cuando se vincula una hoja desde Access?"
  options:
  - id: a
    text:
      es: "No aparecen hasta repetir la operación de vinculación"
  - id: b
    correct: true
    text:
      es: "Aparecen en la tabla vinculada, de solo lectura"
  - id: c
    text:
      es: "Aparecen en la tabla vinculada, que se edita en Access"
  - id: d
    text:
      es: "Se copian a una tabla nueva que se puede editar"
  explanation:
    es: "La página dice: «Cualquier cambio que realice en las celdas de origen en Excel aparece en la tabla vinculada. No obstante, no puede editar el contenido de la tabla correspondiente en Access». Por eso «No aparecen hasta repetir la operación de vinculación» es falso, y «que se edita en Access» contradice que sea de solo lectura. «Se copian a una tabla nueva que se puede editar» describe una importación, no una vinculación."
  citation: "fuente: `ms-access-importar-excel.html`; «Vincular a datos en Excel»"
  difficulty: 3
  tags:
  - "comportamiento"
