# anchor: boe-a-2015-10565-art-77
- id: q04
  lesson: m03-l03
  prompt:
    es: "El lunes, 1 de febrero de 2027, el Instituto abre un período de prueba en un procedimiento instruido en Madrid y fija el plazo máximo que permite la ley. ¿Hasta qué fecha puede durar ese período?"
  options:
  - id: a
    text:
