# anchor: boe-a-1978-31229-art-134
- id: m01-l15-q006
  prompt:
    es: "Según el artículo 134.3 de la Constitución Española, el Gobierno deberá presentar ante el Congreso de los Diputados los Presupuestos Generales del Estado:"
  options:
  - id: a
    text:
      es: "Al menos dos meses antes de la expiración de los del año anterior."
  - id: b
    text:
      es: "Antes del último día del primer mes del ejercicio siguiente."
  - id: c
    text:
      es: "Dentro de los tres meses siguientes a la expiración de los del año anterior."
  - id: d
    correct: true
    text:
      es: "Al menos tres meses antes de la expiración de los del año anterior."
  explanation:
    es: "El artículo 134.3 exige la presentación al menos tres meses antes de la expiración de los presupuestos del año anterior. Dos meses es una antelación inferior a la exigida. La presentación en el primer mes del ejercicio llega cuando los presupuestos anteriores ya han expirado. Hacerlo después de la expiración invierte el sentido del plazo: el artículo exige antelación, no demora."
  citation: "art. 134.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-134
- id: m01-l15-q007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la tramitación de los Presupuestos Generales del Estado es correcta según la Constitución Española?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno los presenta ante el Congreso de los Diputados y las Cortes Generales los examinan, enmiendan y aprueban."
  - id: b
    text:
      es: "El Gobierno los presenta ante el Senado y las Cortes Generales los examinan, enmiendan y aprueban."
  - id: c
    text:
      es: "El Gobierno los presenta ante el Congreso de los Diputados y este los aprueba sin intervención del Senado."
  - id: d
    text:
      es: "El Gobierno los presenta ante las Cortes Generales y él mismo los aprueba tras su examen y enmienda."
  explanation:
    es: "El Gobierno presenta los presupuestos ante el Congreso de los Diputados (art. 134.3), y su examen, enmienda y aprobación corresponden a las Cortes Generales (art. 134.1). Presentarlos ante el Senado cambia la Cámara a la que se dirigen. Atribuir la aprobación solo al Congreso deja fuera a las Cortes Generales como titulares de esa función. Que el Gobierno los apruebe a sí mismo invierte el reparto: él los elabora y las Cortes los aprueban."
  citation: "art. 134.3 CE"
  difficulty: 1
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-1978-31229-art-134
- id: m01-l15-q008
  prompt:
    es: "Según el artículo 134.4 de la Constitución Española, si la Ley de Presupuestos no se aprobara antes del primer día del ejercicio económico correspondiente, se considerarán automáticamente:"
  options:
  - id: a
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior durante seis meses como máximo."
  - id: b
    correct: true
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior hasta la aprobación de los nuevos."
  - id: c
    text:
      es: "Sustituidos por un presupuesto provisional que fijará el Gobierno por decreto-ley."
  - id: d
    text:
      es: "Prorrogados los Presupuestos del ejercicio anterior, previo acuerdo del Consejo de Ministros."
  explanation:
    es: "El artículo 134.4 prevé la prórroga automática de los presupuestos del ejercicio anterior hasta la aprobación de los nuevos. La opción de seis meses inventa un tope temporal que el artículo no fija. El presupuesto provisional por decreto-ley tampoco existe en el texto. Exigir un acuerdo del Consejo de Ministros contradice la palabra «automáticamente»."
  citation: "art. 134.4 CE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-32
- id: m01-l15-q012
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado constituyen la expresión cifrada, conjunta y sistemática de:"
  options:
  - id: a
    text:
      es: "Los derechos y obligaciones a liquidar durante el ejercicio solo por la Administración General del Estado."
  - id: b
    text:
      es: "Los ingresos y gastos previstos cada ejercicio por el Estado y por las Administraciones territoriales."
  - id: c
    correct: true
    text:
      es: "Los derechos y obligaciones a liquidar durante el ejercicio por cada órgano y entidad del sector público estatal."
  - id: d
    text:
      es: "Las obligaciones reconocidas y los pagos realizados durante el ejercicio por los órganos del sector público estatal."
  explanation:
    es: "El artículo 32 define los presupuestos como la expresión cifrada de los derechos y obligaciones a liquidar durante el ejercicio por cada órgano y entidad del sector público estatal. Limitarlos a la Administración General del Estado reduce el sujeto. Incluir a las Administraciones territoriales lo amplía. Las obligaciones ya reconocidas y los pagos realizados describen la ejecución, no la expresión cifrada de lo que se prevé liquidar."
  citation: "art. 32 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-2
- id: m01-l15-q172
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los organismos públicos vinculados o dependientes de la Administración General del Estado, según el artículo 2.2.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Organismos autónomos, entidades públicas empresariales y consorcios adscritos."
  - id: b
    text:
      es: "Organismos autónomos, agencias estatales y fundaciones del sector público."
  - id: c
    correct: true
    text:
      es: "Organismos autónomos, entidades públicas empresariales y agencias estatales."
  - id: d
    text:
      es: "Entidades públicas empresariales, agencias estatales y universidades públicas no transferidas."
  explanation:
    es: "El artículo 2.2.a) clasifica esos organismos en organismos autónomos, entidades públicas empresariales y agencias estatales. Los consorcios adscritos, las fundaciones del sector público y las universidades públicas no transferidas integran el sector público institucional estatal, pero el artículo 2.2 los recoge en las letras d), e) y g), no como organismos públicos de la letra a)."
  citation: "art. 2.2.a) LGP"
  difficulty: 2
  tags:
  - "lista"
  - "concepto"
# anchor: boe-a-2003-21614-art-2
- id: m01-l15-q173
  prompt:
    es: "Señale qué entidad integra el sector público institucional estatal, junto con las autoridades administrativas independientes y las sociedades mercantiles estatales, según el artículo 2.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    correct: true
    text:
      es: "Los fondos sin personalidad jurídica."
  - id: b
    text:
      es: "Las entidades locales y sus organismos autónomos."
  - id: c
    text:
      es: "Las comunidades autónomas y sus entes públicos."
  - id: d
    text:
      es: "Las empresas privadas concesionarias de servicios públicos."
  explanation:
    es: "El artículo 2.2 incluye en la letra f) los fondos sin personalidad jurídica, que son entidades distintas de los organismos públicos de la letra a). Las entidades locales y las comunidades autónomas no son sector público estatal, y las empresas privadas concesionarias de servicios públicos no figuran en ninguna letra del artículo."
  citation: "art. 2.2 LGP"
  difficulty: 2
  tags:
  - "lista"
  - "concepto"
# anchor: boe-a-2003-21614-art-2
- id: m01-l15-q193
  prompt:
    es: "¿Cuál de las siguientes entidades forma parte del sector público estatal, junto con la Administración General del Estado, según el artículo 2.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Las Entidades Locales y sus organismos autónomos."
  - id: b
    text:
      es: "Las Comunidades Autónomas y sus entes públicos."
  - id: c
    correct: true
    text:
      es: "El sector público institucional estatal."
  - id: d
    text:
      es: "Los colegios profesionales y demás corporaciones de derecho público."
  explanation:
    es: "El artículo 2.1 compone el sector público estatal con la Administración General del Estado y el sector público institucional estatal. Las Entidades Locales con sus organismos y las Comunidades Autónomas con sus entes son otras Administraciones Públicas, ajenas al sector público estatal. Los colegios profesionales y demás corporaciones de derecho público no figuran en el artículo."
  citation: "art. 2.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-26
- id: m01-l15-q013
  prompt:
    es: "Según el artículo 26.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la programación presupuestaria se regirá por los principios de:"
  options:
  - id: a
    text:
      es: "Estabilidad presupuestaria, sostenibilidad financiera, anualidad, transparencia, eficiencia, responsabilidad y lealtad institucional."
  - id: b
    text:
      es: "Estabilidad presupuestaria, equilibrio territorial, plurianualidad, transparencia, eficiencia, responsabilidad y lealtad institucional."
  - id: c
    text:
      es: "Estabilidad presupuestaria, sostenibilidad financiera, plurianualidad, transparencia, eficacia, responsabilidad y solidaridad institucional."
  - id: d
    correct: true
    text:
      es: "Estabilidad presupuestaria, sostenibilidad financiera, plurianualidad, transparencia, eficiencia, responsabilidad y lealtad institucional."
  explanation:
    es: "El artículo 26.1 enumera siete principios: estabilidad presupuestaria, sostenibilidad financiera, plurianualidad, transparencia, eficiencia en la asignación y utilización de los recursos públicos, responsabilidad y lealtad institucional. La lista con anualidad sustituye la plurianualidad, que es el principio propio de la programación. La del equilibrio territorial cambia la sostenibilidad financiera por un principio que no figura. La que cambia eficiencia por eficacia sustituye también lealtad por solidaridad institucional."
  citation: "art. 26.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-26
- id: m01-l15-q014
  prompt:
    es: "¿Cuál de las siguientes parejas de principios rige la programación presupuestaria conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los principios de anualidad y unidad presupuestaria."
  - id: b
    text:
      es: "Los principios de especialidad cualitativa y no afectación."
  - id: c
    correct: true
    text:
      es: "Los principios de plurianualidad y de transparencia."
  - id: d
    text:
      es: "Los principios de gestión por objetivos y equilibrio territorial."
  explanation:
    es: "La plurianualidad y la transparencia están en la lista del artículo 26.1. La anualidad y la unidad, la especialidad y la no afectación son principios clásicos del derecho presupuestario, pero el artículo 26.1 no los enumera para la programación. La gestión por objetivos y el equilibrio territorial no figuran en él."
  citation: "art. 26.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2012-5730-art-3
- id: m01-l15-q017
  prompt:
    es: "Según la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera, ¿qué es la estabilidad presupuestaria para las entidades públicas empresariales, sociedades mercantiles y demás entes dependientes de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La posición de equilibrio financiero."
  - id: b
    text:
      es: "La posición de superávit financiero."
  - id: c
    text:
      es: "La posición de equilibrio patrimonial."
  - id: d
    text:
      es: "La posición de equilibrio coyuntural."
  explanation:
    es: "El artículo 3.3 LO 2/2012 dice que, para los sujetos del artículo 2.2 (entidades públicas empresariales, sociedades mercantiles y demás entes dependientes), «se entenderá por estabilidad presupuestaria la posición de equilibrio financiero». El superávit es una exigencia mayor: el apartado 2 habla de «equilibrio o superávit estructural» para las Administraciones Públicas, y el apartado 3 solo pide equilibrio a estos entes. El equilibrio coyuntural no es el término del apartado 3: el apartado 2 usa «estructural» para las Administraciones, y el 3, «financiero» para estos entes. El equilibrio patrimonial cambia «financiero» por otra magnitud."
  citation: "art. 3.3 LO 2/2012"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2012-5730-art-5
- id: m01-l15-q018
  prompt:
    es: "Según el artículo 5 de la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera, la elaboración de los Presupuestos se encuadrará en un marco presupuestario:"
  options:
  - id: a
    text:
      es: "A largo plazo, que sustituye al principio de anualidad en la aprobación y ejecución de los Presupuestos."
  - id: b
    text:
      es: "Anual, compatible con el principio de plurianualidad por el que se rigen la aprobación y ejecución de los Presupuestos."
  - id: c
    text:
      es: "A medio plazo, compatible con el principio de anualidad por el que se rigen la elaboración y el control de los Presupuestos."
  - id: d
    correct: true
    text:
      es: "A medio plazo, compatible con el principio de anualidad por el que se rigen la aprobación y ejecución de los Presupuestos."
  explanation:
    es: "El artículo 5 encuadra la elaboración en un marco a medio plazo, compatible con la anualidad que rige la aprobación y la ejecución. La versión a largo plazo hace que la plurianualidad sustituya a la anualidad, y el artículo habla de compatibilidad. La versión anual invierte los dos principios. La que menciona elaboración y control cambia los momentos en que rige la anualidad: aprobación y ejecución, no elaboración y control."
  citation: "art. 5 LO 2/2012"
  difficulty: 3
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q020
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿la actividad de qué sector público programan los escenarios presupuestarios plurianuales?"
  options:
  - id: a
    text:
      es: "Todo el sector público, con y sin presupuesto limitativo."
  - id: b
    correct: true
    text:
      es: "El sector público estatal con presupuesto limitativo."
  - id: c
    text:
      es: "Las Administraciones Públicas territoriales y el Estado."
  - id: d
    text:
      es: "El sector público estatal con presupuesto estimativo."
  explanation:
    es: "El artículo 28.1 refiere la programación al sector público estatal con presupuesto limitativo. Extenderla a todo el sector público o a las Administraciones territoriales amplía el ámbito. El presupuesto estimativo es el de las entidades sin presupuesto limitativo, que el artículo deja fuera."
  citation: "art. 28.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q021
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué casos debe respetar la acción de gobierno los límites de los escenarios presupuestarios plurianuales?"
  options:
  - id: a
    text:
      es: "En todas sus decisiones, con independencia de su incidencia presupuestaria."
  - id: b
    correct: true
    text:
      es: "En los casos en que sus decisiones tengan incidencia presupuestaria."
  - id: c
    text:
      es: "Solo en las decisiones que afecten a gastos de personal."
  - id: d
    text:
      es: "Únicamente cuando así lo disponga la Ley de Presupuestos de cada año."
  explanation:
    es: "Los límites se imponen a la acción de gobierno en los casos en que sus decisiones tengan incidencia presupuestaria (art. 28.1). No alcanzan a todas las decisiones, ni se limitan a los gastos de personal, ni dependen de que la ley anual lo disponga."
  citation: "art. 28.1 LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q022
  prompt:
    es: "¿A cuántos ejercicios se refieren los límites que determinan los escenarios presupuestarios plurianuales, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "A los tres ejercicios anteriores."
  - id: b
    text:
      es: "A los seis ejercicios siguientes."
  - id: c
    correct: true
    text:
      es: "A los tres ejercicios siguientes."
  - id: d
    text:
      es: "Al ejercicio siguiente, ampliable a un segundo ejercicio."
  explanation:
    es: "El artículo 28.1 LGP dice que los escenarios presupuestarios plurianuales «determinarán los límites, referidos a los tres ejercicios siguientes». Los tres anteriores miran al pasado, y el apartado habla de los ejercicios siguientes. Seis ejercicios duplica la cifra. Un ejercicio ampliable a un segundo cambia la cifra del apartado, que son tres."
  citation: "art. 28.1 LGP"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q023
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿a qué objetivo de estabilidad presupuestaria se ajustan los escenarios presupuestarios plurianuales?"
  options:
  - id: a
    text:
      es: "Al correspondiente al Estado y a las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Al correspondiente al Estado y a la Seguridad Social."
  - id: c
    text:
      es: "Al correspondiente al Estado y a las Corporaciones Locales."
  - id: d
    text:
      es: "Al correspondiente a todas las Administraciones Públicas en su conjunto."
  explanation:
    es: "El artículo 28.2 ajusta los escenarios al objetivo de estabilidad del Estado y de la Seguridad Social. Las Comunidades Autónomas y las Corporaciones Locales tienen sus propios objetivos y no figuran en este artículo, y tampoco lo hace el conjunto de las Administraciones Públicas."
  citation: "art. 28.2 LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q024
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los escenarios presupuestarios plurianuales es correcta según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los confecciona el Ministerio de Hacienda, que da cuenta de ellos a las Cortes Generales después de aprobar el proyecto de Ley de Presupuestos."
  - id: b
    correct: true
    text:
      es: "Los confecciona el Ministerio de Hacienda, que da cuenta de ellos al Consejo de Ministros antes de aprobar el proyecto de Ley de Presupuestos."
  - id: c
    text:
      es: "Los confecciona la Intervención General de la Administración del Estado, que da cuenta de ellos al Consejo de Ministros cada año."
  - id: d
    text:
      es: "Los confecciona el Ministerio de Hacienda, sin que deba dar cuenta de ellos antes de aprobar el proyecto de Ley de Presupuestos."
  explanation:
    es: "El artículo 28.3 encarga la confección al Ministerio de Hacienda, que da cuenta al Consejo de Ministros con anterioridad a la aprobación del proyecto de Ley de Presupuestos. La opción de las Cortes Generales cambia el destinatario y el momento. La de la Intervención General cambia quién los confecciona. La que suprime la rendición de cuentas elimina una obligación que el artículo impone."
  citation: "art. 28.3 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q025
  prompt:
    es: "Según el artículo 28.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿ante qué órgano da cuenta el Ministerio de Hacienda de los escenarios presupuestarios plurianuales antes de aprobarse el proyecto de Ley de Presupuestos?"
  options:
  - id: a
    text:
      es: "Ante el Consejo de Estado."
  - id: b
    text:
      es: "Ante la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "Ante el Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "Ante el Consejo de Ministros."
  explanation:
    es: "El Ministerio de Hacienda da cuenta de los escenarios al Consejo de Ministros con anterioridad a la aprobación del proyecto (art. 28.3). El Consejo de Estado, la Intervención General y el Tribunal de Cuentas no reciben esa cuenta en el artículo."
  citation: "art. 28.3 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-28
- id: m01-l15-q026
  prompt:
    es: "Según el artículo 28.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los escenarios presupuestarios plurianuales contendrán, en su caso, la actualización de las previsiones contenidas en:"
  options:
  - id: a
    text:
      es: "Los presupuestos prorrogados del ejercicio en curso."
  - id: b
    correct: true
    text:
      es: "Los escenarios presupuestarios aprobados en el ejercicio anterior."
  - id: c
    text:
      es: "Los programas plurianuales de las entidades públicas empresariales."
  - id: d
    text:
      es: "La liquidación de los presupuestos del año anterior."
  explanation:
    es: "El artículo 28.3 manda actualizar, en su caso, las previsiones de los escenarios aprobados el ejercicio anterior. Los presupuestos prorrogados, los programas de las entidades públicas empresariales y la liquidación del año anterior son otros documentos presupuestarios que no son el objeto de esa actualización."
  citation: "art. 28.3 LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-29
- id: m01-l15-q028
  prompt:
    es: "Según el artículo 29.6 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los programas plurianuales fijarán los objetivos plurianuales:"
  options:
  - id: a
    text:
      es: "De forma flexible, anual y revisable."
  - id: b
    text:
      es: "De forma genérica, cualitativa y no vinculante."
  - id: c
    correct: true
    text:
      es: "De forma objetiva, clara y mensurable."
  - id: d
    text:
      es: "De forma cuantitativa, global y provisional."
  explanation:
    es: "El artículo 29.6.a) exige que los objetivos plurianuales se expresen de forma objetiva, clara y mensurable. Una formulación flexible y anual, genérica y no vinculante o global y provisional se aleja de esa exigencia de medición."
  citation: "art. 29.6 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-29
- id: m01-l15-q050
  prompt:
    es: "De acuerdo con el artículo 29.6 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los indicadores de ejecución que establecen los programas plurianuales irán asociados:"
  options:
  - id: a
    text:
      es: "A cada uno de los créditos que se ponen a disposición del gestor."
  - id: b
    text:
      es: "A cada una de las inversiones reales y financieras a realizar."
  - id: c
    correct: true
    text:
      es: "A cada uno de los objetivos que fija el propio programa."
  - id: d
    text:
      es: "A cada uno de los centros gestores que dependen del ministerio."
  explanation:
    es: "El artículo 29.6 incluye en el contenido de los programas plurianuales «los indicadores de ejecución asociados a cada uno de los objetivos». Los créditos que se proponen poner a disposición de los centros gestores y las inversiones reales y financieras son otros extremos del mismo apartado, no aquello a lo que se asocian los indicadores. El artículo tampoco asocia los indicadores a cada centro gestor."
  citation: "art. 29.6 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1978-31229-art-135
- id: m01-l15-q185
  prompt:
    es: "Señale para qué habrán de estar autorizados por ley el Estado y las Comunidades Autónomas, según el artículo 135.3 de la Constitución Española:"
  options:
  - id: a
    text:
      es: "Prorrogar los Presupuestos del ejercicio anterior."
  - id: b
    text:
      es: "Reconocer obligaciones sin crédito presupuestario."
  - id: c
    correct: true
    text:
      es: "Emitir deuda pública o contraer crédito."
  - id: d
    text:
      es: "Elaborar sus presupuestos anuales."
  explanation:
    es: "El artículo 135.3 exige autorización por ley para emitir deuda pública o contraer crédito. La prórroga de los presupuestos no la autoriza una ley: opera automáticamente según el artículo 134.4. Reconocer obligaciones sin crédito y elaborar presupuestos anuales no figuran en ese apartado."
  citation: "art. 135.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-134
- id: m01-l15-q186
  prompt:
    es: "¿Cuál de las siguientes opciones recoge lo que incluirán los Presupuestos Generales del Estado, que tendrán carácter anual, según el artículo 134.2 de la Constitución Española?"
  options:
  - id: a
    text:
      es: "Solo los gastos e ingresos de la Administración General del Estado."
  - id: b
    text:
      es: "Los gastos e ingresos de la Administración General del Estado y de las Comunidades Autónomas."
  - id: c
    text:
      es: "Únicamente los gastos de los organismos autónomos y de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "La totalidad de los gastos e ingresos del sector público estatal."
  explanation:
    es: "El artículo 134.2 manda incluir la totalidad de los gastos e ingresos del sector público estatal, que es más que la Administración General del Estado sola. Tampoco alcanza a las Comunidades Autónomas, que no forman parte del sector público estatal, ni se limita a los organismos autónomos y la Seguridad Social."
  citation: "art. 134.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-29
- id: m01-l15-q188
  prompt:
    es: "Señale qué contienen los escenarios presupuestarios plurianuales, según el artículo 29.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria:"
  options:
  - id: a
    correct: true
    text:
      es: "La distribución orgánica de los recursos disponibles."
  - id: b
    text:
      es: "La distribución por programas de los créditos extraordinarios."
  - id: c
    text:
      es: "La estimación de los beneficios fiscales de cada ejercicio."
  - id: d
    text:
      es: "El detalle de las obligaciones reconocidas en el ejercicio anterior."
  explanation:
    es: "Los escenarios contienen la distribución orgánica de los recursos disponibles y se desarrollan en programas plurianuales. No recogen créditos extraordinarios por programas, la estimación de beneficios fiscales, que determinan los Presupuestos anuales, ni las obligaciones ya reconocidas el año anterior."
  citation: "art. 29.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2012-5730-art-3
- id: m01-l15-q190
  prompt:
    es: "¿Cuál de las siguientes definiciones de estabilidad presupuestaria de las Administraciones Públicas recoge el artículo 3.2 de la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera?"
  options:
  - id: a
    text:
      es: "La situación de equilibrio o superávit coyuntural."
  - id: b
    correct: true
    text:
      es: "La situación de equilibrio o superávit estructural."
  - id: c
    text:
      es: "La situación de equilibrio o déficit estructural."
  - id: d
    text:
      es: "La situación de equilibrio o superávit presupuestario anual."
  explanation:
    es: "Para las Administraciones Públicas, el artículo 3.2 define la estabilidad presupuestaria como la situación de equilibrio o superávit estructural. Hablar de superávit coyuntural cambia el carácter del saldo, de estructural a coyuntural. Admitir el déficit estructural contradice el equilibrio o superávit que exige el artículo. Referirlo al presupuesto anual sustituye el saldo estructural por uno puramente anual."
  citation: "art. 3.2 LO 2/2012"
  difficulty: 3
  tags:
  - "concepto"
