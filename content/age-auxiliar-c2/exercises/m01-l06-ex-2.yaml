- id: m01-l06-q081
  prompt:
    es: "Señale qué órgano alcanzó el acuerdo final sobre el IV Plan de Gobierno Abierto de España 2020-2024 en la sesión celebrada el 29 de octubre de 2020:"
  options:
  - id: a
    text:
      es: "La Comisión Sectorial de Gobierno Abierto."
  - id: b
    correct: true
    text:
      es: "El pleno del Foro de Gobierno Abierto."
  - id: c
    text:
      es: "El Consejo de Ministros."
  - id: d
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  explanation:
    es: "El acuerdo final sobre el IV Plan lo alcanzó el pleno del Foro de Gobierno Abierto. La Comisión Sectorial de Gobierno Abierto, el Consejo de Ministros y el Consejo de Transparencia y Buen Gobierno son otros órganos, pero no tomaron el acuerdo final del Plan."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 2
  tags:
  - "órgano"
