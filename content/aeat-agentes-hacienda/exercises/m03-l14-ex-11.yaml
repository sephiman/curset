# anchor: boe-a-2003-23186-art-247
- id: m03-l14-q0217
  prompt:
    es: "Dolores Chacón Ríos interpone el miércoles 3 de junio de 2026 una reclamación que se tramita por el procedimiento abreviado. El plazo se cuenta según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas y no hay festivos que lo alteren. Conforme al artículo 247.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el tribunal puede notificar la resolución hasta el:"
  options:
  - id: a
    text:
      es: "Jueves 3 de junio de 2027."
  - id: b
    text:
      es: "Viernes 4 de diciembre de 2026."
  - id: c
    text:
      es: "Jueves 3 de septiembre de 2026."
  - id: d
    correct: true
    text:
      es: "Jueves 3 de diciembre de 2026."
  explanation:
    es: "El plazo del procedimiento abreviado es de seis meses desde la interposición (art. 247.2). Contado desde el 4 de junio de 2026, termina el mismo día seis meses después, el jueves 3 de diciembre de 2026 (art. 30.4 LPAC). El 3 de septiembre sería a tres meses y el 3 de junio de 2027 a un año, el plazo del general. El 4 de diciembre queda un día fuera."
  citation: "art. 247.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "abreviado"
  - "cómputo"
# anchor: boe-a-2003-23186-art-248
- id: m03-l14-q0218
  prompt:
    es: "De acuerdo con el artículo 248 de la Ley 58/2003, de 17 de diciembre, General Tributaria, contra las resoluciones que se dicten en el procedimiento abreviado no puede interponerse recurso de alzada ordinario, pero pueden proceder, en su caso:"
  options:
  - id: a
    text:
      es: "Únicamente el recurso contencioso-administrativo."
  - id: b
    text:
      es: "Únicamente el recurso de reposición ante el tribunal."
  - id: c
    correct: true
    text:
      es: "Los demás recursos regulados en la sección anterior."
  - id: d
    text:
      es: "Ningún otro recurso en vía económico-administrativa."
  explanation:
    es: "El artículo 248 excluye solo el alzada ordinario y deja abiertos los demás recursos de la sección anterior, como el de anulación o los extraordinarios. No cierra toda la vía económico-administrativa, no remite a la reposición y el contencioso no es el único camino."
  citation: "art. 248 LGT"
  difficulty: 2
  tags:
  - "abreviado"
  - "recursos"
# anchor: boe-a-2003-23186-art-249
- id: m03-l14-q0220
  prompt:
    es: "Conforme al artículo 249 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las resoluciones que pongan fin a la vía económico-administrativa son susceptibles de recurso:"
  options:
  - id: a
    correct: true
    text:
      es: "Contencioso-administrativo ante el órgano jurisdiccional competente."
  - id: b
    text:
      es: "De alzada ante el Ministro de Hacienda."
  - id: c
    text:
      es: "Civil ante el juzgado de primera instancia."
  - id: d
    text:
      es: "De reposición ante el propio tribunal económico-administrativo que resolvió la reclamación."
  explanation:
    es: "Las resoluciones que ponen fin a la vía económico-administrativa se recurren ante el órgano jurisdiccional competente por la vía contencioso-administrativa (art. 249). No cabe reposición ni alzada ante el Ministro. Y la vía civil no es la competente."
  citation: "art. 249 LGT"
  difficulty: 1
  tags:
  - "contencioso"
  - "vía"
