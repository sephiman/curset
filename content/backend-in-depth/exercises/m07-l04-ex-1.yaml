# Generated by docs/backend-verification/s2/tools/build_quiz.py from m07-l04.questions.json.
type: quiz
variants:
- id: m07-l04-q02
  prompt:
    en: Which statement defines an idempotent request method in RFC 9110, regarding multiple identical requests
      sent to the origin server?
  options:
  - id: a
    correct: true
    text:
      en: The intended effect on the server of multiple identical requests is the same as the effect of a single
        request
  - id: b
    text:
      en: Every identical request gets a byte-identical response from the server
  - id: c
    text:
      en: The server does not log or record the repeated requests
  - id: d
    text:
      en: The client does not request or expect any state change on the origin server
  explanation:
    en: Idempotence means that repeating an identical request has the same intended effect as sending it once. Byte-identical
      responses are wrong because the response might differ. Not logging repeats is wrong because a server is free
      to log each request separately. No expected state change is wrong because that is the definition of a safe
      method.
  citation: rfc9110#section-9.2.2
  extract:
    en: A request method is considered "idempotent" if the intended effect on the server of multiple identical requests
      with that method is the same as the effect for a single such request.
- id: m07-l04-q03
  prompt:
    en: Which statement about automatic retries of requests after a communication failure is correct according to
      RFC 9110?
  options:
  - id: a
    correct: true
    text:
      en: A proxy must not automatically retry non-idempotent requests
  - id: b
    text:
      en: A client can always retry a `POST` request after the connection closed, because the server never applied
        it
  - id: c
    text:
      en: A client should keep retrying a failed automatic retry until it succeeds
  - id: d
    text:
      en: Idempotent requests cannot be repeated automatically, because the first request may have succeeded
  explanation:
    en: A proxy must not automatically retry non-idempotent requests. Retrying a `POST` always is wrong because
      a client should not automatically retry a non-idempotent request without a means to know it is safe. Retrying
      a failed retry until success is wrong because a client should not retry a failed automatic retry. Never repeating
      idempotent requests is wrong because idempotent methods exist so that the request can be repeated automatically.
  citation: rfc9110#section-9.2.2
  extract:
    en: A proxy MUST NOT automatically retry non-idempotent requests.
- id: m07-l04-q04
  prompt:
    en: According to RFC 9110, which pair of redirect status codes was added to unambiguously indicate method-preserving
      redirects?
  options:
  - id: a
    text:
      en: '`301` and `302`'
  - id: b
    text:
      en: '`303` alone'
  - id: c
    text:
      en: '`300` and `304`'
  - id: d
    correct: true
    text:
      en: '`307` and `308`'
  explanation:
    en: '`307` and `308` were added to indicate method-preserving redirects. `301` and `302` are wrong because early
      user agents split on whether to redirect a `POST` as `POST` or as `GET`, so they are not unambiguous. `303`
      is wrong because it was defined for a redirection that changes the method to `GET`. `300` and `304` are wrong
      because `304` redirects to a previously stored result and is not a method-preserving redirect.'
  citation: rfc9110#section-15.4
  extract:
    en: 307 (Temporary Redirect) and 308 (Permanent Redirect) [RFC7538] were later added to unambiguously indicate
      method-preserving redirects, and status codes 301 and 302 have been adjusted to allow a POST request to be
      redirected as GET.
- id: m07-l04-q06
  prompt:
    en: RFC 9111 says that cache directives are unidirectional. Which statement about `Cache-Control` directives
      follows from the RFC?
  options:
  - id: a
    text:
      en: A proxy that implements no cache may drop the directives it forwards, because nothing in it can use them
  - id: b
    text:
      en: A directive can be addressed to one specific cache along the chain
  - id: c
    correct: true
    text:
      en: A directive in a request does not imply that the same directive is present or copied in the response
  - id: d
    text:
      en: Directive names are case-sensitive tokens
  explanation:
    en: A directive in a request does not imply the same directive in the response. Dropping the forwarded directives
      is wrong because a proxy must pass them through whether or not it implements a cache. Addressing one cache
      is wrong because it is not possible to target a directive to a specific cache. Case-sensitive names are wrong
      because directive tokens are compared case-insensitively.
  citation: rfc9111#section-5.2
  extract:
    en: Cache directives are unidirectional, in that the presence of a directive in a request does not imply that
      the same directive is present or copied in the response.
- id: m07-l04-q08
  prompt:
    en: An origin server generates an entity tag that does not satisfy all the characteristics of a strong validator.
      What must it do, according to RFC 9110?
  options:
  - id: a
    text:
      en: Omit the `ETag` field, because only strong validators may be sent
  - id: b
    text:
      en: Send the entity tag only in a trailer section
  - id: c
    correct: true
    text:
      en: Mark the entity tag as weak by prefixing its opaque value with `W/`
  - id: d
    text:
      en: Prefix the opaque value with a lowercase `w/`
  explanation:
    en: The server must mark the tag as weak with the `W/` prefix. Omitting `ETag` is wrong because an entity tag
      can be either a weak or a strong validator. A trailer-only `ETag` is wrong because it is preferable to send
      it as a header field. The lowercase `w/` is wrong because the `W/` prefix is case-sensitive.
  citation: rfc9110#section-8.8.3
  extract:
    en: then the origin server MUST mark the entity tag as weak by prefixing its opaque value with "W/" (case-sensitive).
- id: m07-l04-q09
  prompt:
    en: A client sends a `GET` request with an `If-None-Match` header field, and the condition evaluates to false
      at the origin server. Which status code does the server respond with?
  options:
  - id: a
    text:
      en: '`200`'
  - id: b
    correct: true
    text:
      en: '`304`'
  - id: c
    text:
      en: '`412`'
  - id: d
    text:
      en: '`204`'
  explanation:
    en: For `GET` or `HEAD` the server responds with `304`. `200`, `412` and `204` are all excluded, because the
      server must not perform the method and must answer `304` for `GET` or `HEAD`, with `412` reserved for all
      other request methods.
  citation: rfc9110#section-13.1.2
  extract:
    en: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the
      condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified)
      status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other
      request methods.
- id: m07-l04-q10
  prompt:
    en: 'A client sends `PUT` with the header `If-None-Match: *`. What does RFC 9110 say this header can achieve?'
  options:
  - id: a
    text:
      en: It makes the `PUT` succeed only when a current representation already exists
  - id: b
    text:
      en: It makes the server answer the `PUT` with `304 Not Modified`
  - id: c
    text:
      en: It can be combined with entity tags in one list, such as `*, "xyzzy"`
  - id: d
    correct: true
    text:
      en: It prevents the `PUT` from inadvertently modifying an existing representation when the client believes
        none exists
  explanation:
    en: '`If-None-Match: *` stops a `PUT` from overwriting an existing representation when the client believes none
      exists. Succeeding only when a representation exists is wrong because the condition is false when the server
      has a current representation. A `304` answer is wrong because for a method other than `GET` or `HEAD` the
      server answers `412`. Combining `*` with entity tags is wrong because such a list is syntactically invalid.'
  citation: rfc9110#section-13.1.2
  extract:
    en: If-None-Match can also be used with a value of "*" to prevent an unsafe request method (e.g., PUT) from
      inadvertently modifying an existing representation of the target resource when the client believes that the
      resource does not have a current representation (Section 9.2.1).
- id: m07-l04-q11
  prompt:
    en: A `Vary` header field that lists request header field names has two purposes according to RFC 9110. Which
      one is one of them?
  options:
  - id: a
    text:
      en: It tells caches how long the response stays fresh
  - id: b
    correct: true
    text:
      en: It expands the cache key needed to match a new request to the stored cache entry
  - id: c
    text:
      en: It carries the entity tag that validates the stored response
  - id: d
    text:
      en: It forbids caches from storing the response at all
  explanation:
    en: '`Vary` expands the cache key used to match a new request to a stored entry. Setting freshness is wrong
      because freshness comes from `Expires` or `max-age`. Carrying the validator is wrong because the `ETag` field
      provides the entity tag. Forbidding storage is wrong because a `Vary` header is generated on a cacheable response
      so that it can be selectively reused.'
  citation: rfc9110#section-12.5.5
  extract:
    en: In other words, Vary expands the cache key required to match a new request to the stored cache entry.
- id: m07-l04-q12
  prompt:
    en: Which of these is a disadvantage of proactive content negotiation, in which the server chooses the representation,
      as RFC 9110 lists the disadvantages?
  options:
  - id: a
    text:
      en: The server must send the user agent a list of representations to choose from
  - id: b
    correct: true
    text:
      en: It limits the reusability of responses for shared caching
  - id: c
    text:
      en: A user agent can rely on its preferences always being honored by the origin server
  - id: d
    text:
      en: It avoids exposing the user agent's capabilities, since few request header fields are sent
  explanation:
    en: Proactive negotiation limits the reusability of responses for shared caching. Sending a list of representations
      is wrong because that describes reactive negotiation. Reliable honoring of preferences is wrong because a
      user agent cannot rely on the preferences being consistently honored. Not exposing capabilities is wrong because
      describing them in every request is inefficient and a risk to the user's privacy.
  citation: rfc9110#section-12.1
  extract:
    en: It limits the reusability of responses for shared caching.
- id: m07-l04-q14
  prompt:
    en: What is the `Content-Encoding` header field primarily used for in HTTP responses, according to RFC 9110?
  options:
  - id: a
    correct: true
    text:
      en: To let a representation's data be compressed without losing the identity of its underlying media type
  - id: b
    text:
      en: To list the content codings that the user agent accepts in the response
  - id: c
    text:
      en: To list the content codings in the order that the server prefers them
  - id: d
    text:
      en: To apply a coding to one connection hop only, between two intermediaries
  explanation:
    en: '`Content-Encoding` allows the data to be compressed while keeping the identity of the media type. Listing
      accepted codings is wrong because `Accept-Encoding` does that. Listing codings by server preference is wrong
      because the codings are listed in the order in which they were applied. A single-hop coding is wrong because,
      unlike `Transfer-Encoding`, the codings are a characteristic of the representation.'
  citation: rfc9110#section-8.4
  extract:
    en: Content-Encoding is primarily used to allow a representation's data to be compressed without losing the
      identity of its underlying media type.
