- id: m02-l07-q242
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál corresponde a un archivo de solo ejecución de Microsoft Access?"
  options:
  - id: a
    text:
      es: "accdr"
  - id: b
    text:
      es: "accdb"
  - id: c
    correct: true
    text:
      es: "accde"
  - id: d
    text:
      es: "accdt"
