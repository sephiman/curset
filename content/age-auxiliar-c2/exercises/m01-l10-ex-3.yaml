  prompt:
    es: "Conforme al artículo 16.1 del Tratado de la Unión Europea, el Consejo ejercerá conjuntamente con el Parlamento Europeo la función legislativa y la presupuestaria, y ejercerá también funciones de definición de políticas y de:"
