- id: g-liveness-probe
  term:
    en: liveness probe
  definition:
    en: Liveness probes determine when to restart a container. For example, liveness probes could catch a deadlock, where an application is running, but unable to make progress.
  origin: m10-l05
  citation: k8s-pod-lifecycle#liveness-probe
- id: g-readiness-probe
  term:
    en: readiness probe
  definition:
    en: Readiness probes determine when a container is ready to accept traffic.
  origin: m10-l05
  citation: k8s-pod-lifecycle#readiness-probe
- id: g-startup-probe
  term:
    en: startup probe
  definition:
    en: Startup probes verify whether the application within a container is started.
  origin: m10-l05
  citation: k8s-pod-lifecycle#startup-probe
- id: g-pod-disruption-budget
  term:
    en: PodDisruptionBudget
  definition:
    en: A PDB limits the number of Pods of a replicated application that are down simultaneously from voluntary disruptions.
  origin: m10-l05
  citation: k8s-disruptions#pod-disruption-budgets
- id: g-progressive-delivery
  term:
    en: progressive delivery
  definition:
    en: Progressive delivery is the process of releasing updates of a product in a controlled and gradual manner, thereby reducing the risk of the release, typically coupling automation and metric analysis to drive the automated promotion or rollback of the update.
  origin: m10-l05
  citation: argo-rollouts-concepts#progressive-delivery
- id: g-canary-deployment
  term:
    en: canary deployment
  definition:
    en: A Canary deployment exposes a subset of users to the new version of the application while serving the rest of the traffic to the old version.
  origin: m10-l05
  citation: argo-rollouts-concepts#canary
- id: g-blue-green-deployment
  term:
    en: blue-green deployment
  definition:
    en: A Blue-Green deployment has both the new and old version of the application deployed at the same time. During this time, only the old version of the application will receive production traffic.
  origin: m10-l05
  citation: argo-rollouts-concepts#blue-green
