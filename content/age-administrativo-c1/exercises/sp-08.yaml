type: case
title:
  es: "Las ayudas a la contratación del SEPE"
scenario:
  es: "El Servicio Público de Empleo Estatal (SEPE), organismo autónomo adscrito al Ministerio de Trabajo y Economía Social, está en Madrid. Son festivos el 25 y el 26 de marzo, el 1 de noviembre y el 6 y el 8 de diciembre. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027. Ningún otro festivo afecta a los plazos.\n\nEl SEPE concede en concurrencia competitiva ayudas a la contratación. Talleres Montoya, S.L. presenta su solicitud sin un documento exigido y, requerida, pide cinco días más. Servicios Alcarreños, S.L. no justificó su ayuda, y el viernes, 16 de enero de 2026, el SEPE acordó iniciar el reintegro.\n\nConstrucciones Hermanos Peña, S.L. no recurrió la denegación de otra ayuda, notificada el martes, 26 de septiembre de 2023, y descubre un error de hecho que resulta del expediente. Ingeniería Tormes, S.L. conoce el viernes, 11 de junio de 2027, documentos de valor esencial, posteriores a su resolución firme, que evidencian el error.\n\nDoña Mercedes Arroyo Vidal reclama por responsabilidad patrimonial tras una caída en la sede del SEPE. El jueves, 14 de octubre de 2027, el instructor pide el informe del servicio de Régimen Interior, y el lunes, 8 de noviembre de 2027, notifica la audiencia.\n\nEl SEPE licita un servicio de atención telefónica, sujeto a regulación armonizada, de dos años, con prórroga posible de un año y valor estimado de 450.000 euros, IVA excluido. El lunes, 22 de marzo de 2027, requiere la documentación y la garantía definitiva a la empresa con la mejor oferta, y el miércoles, 12 de mayo de 2027, le notifica la adjudicación por 300.000 euros, IVA excluido, para los dos años. La empresa inició el servicio doce días naturales tarde por causa imputable a ella; el pliego no prevé otras penalidades.\n\nDon Ignacio Palomar Bernal, funcionario de carrera con grado personal 24, ocupaba por libre designación una Jefatura de Servicio de nivel 26, y lo cesan sin imputarle falta. El lunes, 21 de junio de 2027, se publica en el «Boletín Oficial del Estado» la convocatoria de ese puesto por libre designación. Doña Lucía Garrido Soler, funcionaria de carrera, da a luz y su hijo sigue hospitalizado veintiún días; su pareja es el otro progenitor. Doña Beatriz Calvo Heredia, funcionaria de carrera, es concejala de un ayuntamiento con dedicación exclusiva y retribución. Don Alberto Ferrándiz Lozano, funcionario de carrera, falta un día sin justificar: falta leve.\n\nEl gasto del servicio telefónico se reparte en 75.000, 150.000 y 75.000 euros en 2027, 2028 y 2029; su aplicación tenía en 2027 un crédito inicial de 200.000 euros. En abril de 2027 el SEPE suplementó el crédito de la aplicación de las ayudas y en octubre quiere minorarlo con una transferencia. La Intervención Delegada formula un reparo por escrito y el SEPE no lo acepta. Su Director General establece el sistema de anticipos de caja fija; el crédito vigente de gastos corrientes en bienes y servicios es de 8.400.000 euros. El lunes, 6 de septiembre de 2027, libra fondos a justificar a su Cajero pagador para unas jornadas en Lisboa; este paga los gastos el jueves, 25 de noviembre de 2027, y el Director General no amplía el plazo.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-68
- id: q01
  lesson: m03-l03
  prompt:
    es: "¿Puede el SEPE ampliar el plazo de subsanación que concedió a Talleres Montoya, S.L. en su requerimiento, como la empresa solicita, y con qué fundamento?"
  options:
  - id: a
    text:
      es: "Sí, hasta cinco días, a petición de la empresa, si la aportación presenta dificultades especiales."
  - id: b
    correct: true
    text:
      es: "No, porque la ampliación del plazo no cabe en los procedimientos de concurrencia competitiva."
  - id: c
    text:
      es: "Sí, hasta la mitad del plazo, porque la Administración puede ampliar cualquier plazo de oficio o a petición."
  - id: d
    text:
      es: "No, porque el plazo de subsanación de diez días es improrrogable en todo procedimiento a solicitud."
  explanation:
    es: "El plazo de diez días del requerimiento de subsanación puede ampliarse prudencialmente hasta cinco días, pero el artículo 68.2 lo excluye en los procedimientos selectivos o de concurrencia competitiva, y el SEPE concede así las ayudas. La opción que admite los cinco días a petición de la empresa olvida esa excepción. La de la ampliación hasta la mitad del plazo aplica la regla general del artículo 32.1, que cede ante el precepto especial. La que declara el plazo improrrogable en todo procedimiento a solicitud es falsa, porque fuera de la concurrencia sí cabe ampliarlo."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-10565-art-82
- id: q02
  lesson: m03-l03
  prompt:
    es: "Si el instructor concede a Doña Mercedes el plazo máximo que permite la ley, ¿hasta qué fecha puede alegar y presentar documentos en el trámite de audiencia?"
  options:
  - id: a
    text:
      es: "El martes, 23 de noviembre de 2027."
  - id: b
    text:
      es: "El lunes, 29 de noviembre de 2027."
  - id: c
    text:
      es: "El jueves, 9 de diciembre de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 30 de noviembre de 2027."
  explanation:
    es: "El plazo de audiencia no es inferior a diez días ni superior a quince, y los plazos por días son hábiles, sin sábados, domingos ni festivos. Se cuenta desde el martes, 9 de noviembre de 2027, que es festivo en Madrid y no cuenta: del miércoles 10 al viernes 12 de noviembre van 3 días, del lunes 15 al viernes 19 van 8, del lunes 22 al viernes 26 van 13, y el lunes 29 y el martes 30 completan los 15. Termina el martes, 30 de noviembre de 2027. La fecha del martes, 23 de noviembre de 2027, cuenta quince días naturales. La del lunes, 29 de noviembre de 2027, no descuenta el festivo del 9 de noviembre. La del jueves, 9 de diciembre de 2027, cuenta veinte días hábiles, el mínimo de la información pública."
  citation: "art. 82.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-20977-art-42
- id: q03
  lesson: m05-l06
  prompt:
    es: "¿Hasta qué fecha puede el SEPE resolver y notificar el reintegro de la ayuda de Servicios Alcarreños, S.L., antes de que caduque el procedimiento, si no se ha suspendido ni ampliado el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 18 de enero de 2027."
  - id: b
    text:
      es: "El viernes, 15 de enero de 2027."
  - id: c
    text:
      es: "El sábado, 16 de enero de 2027."
  - id: d
    text:
      es: "El lunes, 11 de enero de 2027."
  explanation:
    es: "El plazo máximo para resolver y notificar el reintegro es de doce meses desde la fecha del acuerdo de iniciación, y los plazos en meses terminan el mismo día del mes de vencimiento. El acuerdo es del viernes, 16 de enero de 2026, y los doce meses acaban el sábado, 16 de enero de 2027. Como el último día es inhábil, el plazo pasa al primer día hábil siguiente, el lunes, 18 de enero de 2027 (el domingo 17 también lo es). La fecha del viernes, 15 de enero de 2027, retrocede al día hábil anterior. La del sábado, 16 de enero de 2027, olvida que el último día inhábil se prorroga. La del lunes, 11 de enero de 2027, cuenta doce meses de treinta días."
  citation: "art. 42.4 LGS"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-125
