type: case
title:
  es: "Una extracción ilegal de agua"
scenario:
  es: "La Confederación Hidrográfica del Guadalquivir, organismo autónomo adscrito al Ministerio para la Transición Ecológica y el Reto Demográfico, tiene su sede en Sevilla. En 2027 son festivos el martes, 12 de octubre, y el lunes, 1 de noviembre; ningún otro cae dentro de los plazos por días.\n\nHortofrutícola del Alcor, S.L., extrajo agua del río Guadalquivir por encima del caudal de su concesión hasta el miércoles, 11 de agosto de 2027. El martes, 14 de septiembre de 2027, el órgano competente acuerda y notifica el inicio de un procedimiento sancionador, califica la infracción de leve y adopta la tramitación simplificada, a la que la empresa no se opone. La sanción propuesta es de 9.000 euros, solo pecuniaria. La empresa reconoce su responsabilidad, paga voluntariamente antes de la resolución y renuncia a recurrir en vía administrativa. La tramitación ordinaria sería más larga.\n\nHace meses, el Comisario de Aguas otorgó un aprovechamiento en el río Guadiana, cuenca de otra Confederación Hidrográfica, y nadie recurrió la resolución. El lunes, 4 de octubre de 2027, el órgano competente acuerda iniciar de oficio su revisión de oficio.\n\nDon Baltasar Núñez Cobos reclama 18.400 euros por los daños que la apertura de las compuertas de un canal causó en su maquinaria. El martes, 19 de octubre de 2027, el órgano instructor pide informe al Servicio de Explotación, que recibe la petición ese día.\n\nEl contrato de mantenimiento de las estaciones de aforo se ejecuta de 2027 a 2029 y tiene un valor estimado de 126.000 euros, IVA excluido. El miércoles, 13 de octubre de 2027, el órgano de contratación publica en el perfil de contratante la adjudicación a Hidroaforos Andalucía, S.L., y ese mismo día la notifica a esta y a Aforos del Sur, S.A. Sondas del Guadalquivir, S.L., entrega dieciocho días naturales tarde un suministro de sondas de 85.000 euros, IVA excluido, y la Administración opta por las penalidades diarias de la ley.\n\nDoña Soledad Arjona Prieto, funcionaria de carrera, ocupa desde el lunes, 4 de octubre de 2027, un puesto de la Comisaría de Aguas. Víctima de violencia de género, debe dejarlo para hacer efectiva su protección. Sus retribuciones íntegras son 2.350 euros al mes. Valora la excedencia, el traslado y la reducción de su jornada de 7,5 a 5,5 horas diarias. Don Nicolás Ayala Fuentes, Jefe de Servicio, tiene un expediente disciplinario, y el lunes, 20 de septiembre de 2027, la autoridad que lo incoó le suspende provisionalmente. Don Fermín Cabello Ortega nació el viernes, 2 de junio de 1967, y presta servicios efectivos al Estado desde el lunes, 1 de diciembre de 1997. Pertenece a Clases Pasivas y pide la jubilación voluntaria el jueves, 28 de octubre de 2027.\n\nUna aplicación del capítulo 4, que atiende obligaciones derivadas de una ley y es ampliable según el anexo II de la ley de presupuestos, tiene un crédito inicial de 640.000 euros y las obligaciones que debe reconocer este año ascienden a 915.000 euros. El contrato de mantenimiento se imputa a una aplicación de crédito inicial en 2027 de 90.000 euros. El organismo tiene anticipos de caja fija.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-96
- id: q01
  lesson: m03-l03
  prompt:
    es: "¿Hasta qué fecha debe resolverse el procedimiento sancionador de la empresa extractora, conforme al artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 14 de octubre de 2027."
  - id: b
    text:
      es: "Hasta el martes, 26 de octubre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el miércoles, 27 de octubre de 2027."
  - id: d
    text:
      es: "Hasta el martes, 14 de diciembre de 2027."
  explanation:
    es: "El acuerdo se notifica el martes, 14 de septiembre de 2027. La tramitación simplificada se resuelve en treinta días desde el día siguiente, y los días son hábiles (art. 30.2 LPAC). El primer día es el miércoles, 15 de septiembre de 2027. No cuentan los sábados, los domingos ni el martes, 12 de octubre, festivo, y el día treinta es el miércoles, 27 de octubre de 2027. La fecha del martes, 26 de octubre de 2027, olvida el festivo. La del jueves, 14 de octubre de 2027, cuenta treinta días naturales. La del martes, 14 de diciembre de 2027, aplica los tres meses de la tramitación ordinaria, que no resta menos."
  citation: "art. 96.6 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-85
- id: q21
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuánto deja de pagar, como mínimo, la empresa extractora respecto de la sanción propuesta?"
  options:
  - id: a
    text:
      es: "1.800 euros: una única reducción del 20 % sobre la sanción propuesta."
  - id: b
    text:
      es: "3.240 euros: dos reducciones del 20 %, la segunda sobre el resto ya reducido."
  - id: c
    text:
      es: "2.700 euros: una reducción del 30 % sobre la sanción propuesta."
  - id: d
    correct: true
    text:
      es: "3.600 euros: dos reducciones del 20 % sobre la sanción propuesta, acumuladas."
  explanation:
    es: "Cuando la sanción es solo pecuniaria, la ley aplica reducciones de, al menos, el 20 % sobre la sanción propuesta, acumulables entre sí, si el infractor reconoce su responsabilidad y paga antes de la resolución, y su efecto exige renunciar a recurrir en vía administrativa (art. 85.3 LPAC). La empresa cumple las tres condiciones. Dos reducciones del 20 % son el 40 %: 3.600 euros de 9.000. La cifra de 1.800 euros aplica una sola reducción. La de 3.240 euros calcula el segundo 20 % sobre el resto, y la ley lo toma sobre la sanción propuesta. La de 2.700 euros supone un 30 % que la ley no fija."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10566-art-30
- id: q03
  lesson: m03-l03
  prompt:
    es: "Si la ley que tipifica la infracción no fija plazos de prescripción, el plazo de prescripción de la infracción de la empresa extractora comienza a correr desde el día en que:"
  options:
  - id: a
    correct: true
    text:
      es: "finalizó la conducta infractora, por ser una infracción permanente."
  - id: b
    text:
      es: "se produjo la primera extracción por encima del caudal de su concesión."
  - id: c
    text:
      es: "se notificó a la empresa el acuerdo de iniciación del procedimiento sancionador."
  - id: d
    text:
      es: "la resolución sancionadora adquirió firmeza o venció el plazo para recurrirla."
  explanation:
    es: "En las infracciones continuadas o permanentes, el plazo de prescripción corre desde que finalizó la conducta infractora (art. 30.2 LRJSP). La empresa extrajo agua por encima de su caudal hasta el 11 de agosto, y desde esa fecha se cuenta. La extracción inicial sería el comienzo solo si la infracción fuera instantánea. El acuerdo de iniciación no abre el plazo: interrumpe la prescripción. La firmeza de la resolución es el inicio del plazo de las sanciones, no el de las infracciones."
  citation: "art. 30.2 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-10565-art-47
- id: q04
  lesson: m03-l02
  prompt:
    es: "Señale la respuesta correcta sobre la naturaleza del vicio de la resolución del Comisario de Aguas, conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Es anulable, porque la incompetencia por razón del territorio solo determina la anulabilidad."
  - id: b
    text:
      es: "Es anulable, pero puede convalidarla el superior jerárquico del órgano que la dictó."
  - id: c
    correct: true
    text:
      es: "Es nula de pleno derecho, por incompetencia manifiesta del órgano por razón del territorio."
  - id: d
    text:
      es: "Es válida mientras un órgano jurisdiccional no la declare contraria a derecho."
  explanation:
    es: "Son nulos de pleno derecho los actos dictados por órgano manifiestamente incompetente por razón de la materia o del territorio (art. 47.1.b LPAC). El Comisario de una Confederación no puede otorgar un aprovechamiento en la cuenca de otra. La opción de la anulabilidad confunde esta incompetencia con una infracción ordinaria (art. 48.1 LPAC). La convalidación por el superior jerárquico solo cabe en la incompetencia no determinante de nulidad (art. 52.3 LPAC). La validez hasta una declaración judicial desconoce que el acto nulo lo es de pleno derecho."
  citation: "art. 47.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2015-10565-art-108
- id: q27
  lesson: m03-l03
  prompt:
    es: "Según el artículo 108 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué puede acordar el órgano competente respecto a la ejecución de la resolución del Comisario de Aguas, iniciada ya la revisión de oficio?"
  options:
  - id: a
    correct: true
    text:
      es: "Suspenderla, si su ejecución pudiera causar perjuicios de imposible o difícil reparación."
  - id: b
    text:
      es: "Suspenderla siempre, porque el inicio de la revisión suspende la ejecución del acto."
  - id: c
    text:
      es: "Suspenderla solo después de recibir el dictamen favorable del Consejo de Estado."
  - id: d
    text:
      es: "Suspenderla solo si lo pide la empresa titular del aprovechamiento."
  explanation:
    es: "Iniciado el procedimiento de revisión de oficio, el órgano competente para declarar la nulidad puede suspender la ejecución del acto cuando esta pudiera causar perjuicios de imposible o difícil reparación (art. 108 LPAC). La revisión de la resolución del Comisario de Aguas ya está iniciada desde el lunes, 4 de octubre de 2027. La suspensión automática de toda resolución en revisión no está en la ley: es una facultad con una condición. Esperar al dictamen del Consejo de Estado para suspender tampoco figura: la suspensión llega con el inicio de la revisión. Condicionarla a la petición de la empresa titular añade un requisito que el artículo no exige, porque el órgano puede suspender de oficio."
  citation: "art. 108 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: q06
  lesson: m03-l06
  prompt:
    es: "¿Hasta qué fecha debe emitir el Servicio de Explotación el informe que le pide el órgano instructor, según el artículo 81.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 29 de octubre de 2027."
  - id: b
    text:
      es: "Hasta el martes, 2 de noviembre de 2027."
  - id: c
    text:
      es: "Hasta el viernes, 19 de noviembre de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el miércoles, 3 de noviembre de 2027."
  explanation:
    es: "El informe del servicio cuyo funcionamiento ha ocasionado la lesión no puede exceder de diez días (art. 81.1 LPAC), y los días son hábiles (art. 30.2 LPAC). La petición llega el martes, 19 de octubre de 2027. El primer día es el miércoles, 20 de octubre, y, sin contar sábados, domingos ni el lunes, 1 de noviembre, festivo, el décimo es el miércoles, 3 de noviembre de 2027. La fecha del martes, 2 de noviembre de 2027, olvida el festivo. La del viernes, 29 de octubre de 2027, cuenta diez días naturales. La del viernes, 19 de noviembre de 2027, aplica un mes."
  citation: "art. 81.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-215
- id: q22
  lesson: m03-l04
  prompt:
    es: "Hidroaforos Andalucía, S.L., subcontrata con un tercero parte del mantenimiento de las estaciones de aforo. Según el artículo 215.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿ante quién queda obligado el subcontratista y quién responde de la ejecución frente a la Administración?"
  options:
  - id: a
    text:
      es: "Ante la Administración y ante la empresa principal, que responden solidariamente de la ejecución del contrato."
  - id: b
    correct: true
    text:
      es: "Solo ante la empresa contratista principal, que asume la total responsabilidad de la ejecución frente a la Administración."
  - id: c
    text:
      es: "Ante la Administración, que puede dirigirse directamente contra él, mientras la empresa principal responde solo de su parte."
  - id: d
    text:
      es: "Solo ante la empresa principal, que responde frente a la Administración únicamente de la parte que ejecuta ella."
  explanation:
    es: "Los subcontratistas quedan obligados solo ante el contratista principal, y este asume la total responsabilidad de la ejecución del contrato frente a la Administración (art. 215.4 LCSP). Hidroaforos Andalucía, S.L., adjudicataria, responde por tanto de todo el mantenimiento, también de la parte subcontratada. La responsabilidad solidaria de ambos no existe en la ley. La acción directa de la Administración contra el subcontratista tampoco. Limitar la responsabilidad de la principal a la parte que ejecuta ella contradice que asuma la ejecución del contrato entero."
  citation: "art. 215.4 LCSP"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2017-12902-art-50
- id: q23
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué día puede Aforos del Sur, S.A., presentar recurso especial en materia de contratación contra la adjudicación del contrato de mantenimiento, según el artículo 50.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 28 de octubre de 2027."
  - id: b
    text:
      es: "Hasta el miércoles, 3 de noviembre de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el jueves, 4 de noviembre de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 15 de noviembre de 2027."
  explanation:
    es: "El recurso especial cabe contra la adjudicación de un servicio de valor estimado superior a cien mil euros (art. 44.1 LCSP), y el de mantenimiento llega a 126.000. Se presenta en quince días hábiles desde el día siguiente a la notificación (art. 50.1 LCSP). Como la adjudicación se publica en el perfil de contratante el mismo día del envío, el plazo se cuenta desde el envío, el miércoles, 13 de octubre de 2027 (disposición adicional decimoquinta LCSP). El primer día es el jueves, 14 de octubre. Sin sábados, domingos ni el lunes, 1 de noviembre, festivo, el día quince es el jueves, 4 de noviembre de 2027. La fecha del jueves, 28 de octubre de 2027, cuenta quince días naturales. La del miércoles, 3 de noviembre de 2027, olvida el festivo. La del lunes, 15 de noviembre de 2027, aplica un mes, el plazo de la alzada, y pasa el sábado al lunes."
  citation: "art. 50.1 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-193
- id: q09
  lesson: m03-l04
  prompt:
    es: "Conforme a la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué importe de penalidades diarias corresponde a Sondas del Guadalquivir, S.L., por la demora en la entrega de las sondas?"
  options:
  - id: a
    correct: true
    text:
      es: "918 euros, a 51 euros diarios durante los dieciocho días de demora."
  - id: b
    text:
      es: "1.110,78 euros, calculados sobre el precio del contrato con el IVA incluido."
  - id: c
    text:
      es: "91,80 euros, a 0,06 euros diarios por cada 1.000 euros del precio."
  - id: d
    text:
      es: "4.250 euros, el 5 % del precio del contrato, IVA excluido."
  explanation:
    es: "Por la demora caben penalidades diarias de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido (art. 193.3 LCSP). Sobre 85.000 euros son 51 euros al día, y en dieciocho días suman 918 euros. Los 1.110,78 euros parten del precio con IVA. Los 91,80 euros usan 0,06 euros por cada 1.000. Los 4.250 euros son el 5 % del precio, el múltiplo que faculta para resolver el contrato (art. 193.4 LCSP), no una penalidad."
  citation: "art. 193.3 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-89
- id: q10
  lesson: m04-l04
  prompt:
    es: "¿Puede Doña Soledad Arjona Prieto solicitar la excedencia por violencia de género, con su tiempo actual en el puesto, según el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "No, porque debe haber permanecido al menos dos años en el puesto de destino definitivo."
  - id: b
    text:
      es: "No, porque necesita cinco años de servicios efectivos inmediatamente anteriores."
  - id: c
    text:
      es: "Sí, pero solo después de que se le conceda el traslado por violencia de género."
  - id: d
    correct: true
    text:
      es: "Sí, porque no se exige un tiempo mínimo de servicios previos ni plazo de permanencia."
  explanation:
    es: "Las funcionarias víctimas de violencia de género pueden solicitar la excedencia sin un tiempo mínimo de servicios previos y sin plazo de permanencia (art. 89.5 TREBEP). Doña Soledad Arjona Prieto ocupa su puesto desde el 4 de octubre, y eso no se lo impide. Los dos años en el puesto son la regla del concurso (art. 41.2 RD 364/1995). Los cinco años de servicios son el requisito de la excedencia por interés particular (art. 89.2 TREBEP). El traslado es otra medida, no un paso previo."
  citation: "art. 89.5 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-67
- id: q24
  lesson: m04-l04
  prompt:
    es: "¿En qué fecha se declara de oficio la jubilación forzosa de Don Fermín Cabello Ortega, si no pide prolongar su servicio activo, conforme al artículo 67.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre?"
  options:
  - id: a
    text:
      es: "El jueves, 28 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 2 de junio de 2032."
  - id: c
    text:
      es: "El viernes, 2 de junio de 2034."
  - id: d
    text:
      es: "El martes, 2 de junio de 2037."
  explanation:
    es: "La jubilación forzosa se declara de oficio al cumplir el funcionario los sesenta y cinco años (art. 67.3 TREBEP). Don Fermín nació el viernes, 2 de junio de 1967, así que los cumple el miércoles, 2 de junio de 2032. La fecha del jueves, 28 de octubre de 2027, es la de su solicitud de jubilación voluntaria, que no es forzosa. La del viernes, 2 de junio de 2034, corresponde a los sesenta y siete años, edad del Régimen General de la Seguridad Social, al que no pertenece. La del martes, 2 de junio de 2037, suma los setenta años, el máximo de la prolongación voluntaria, que él no pide."
  citation: "art. 67.3 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-11719-art-82
- id: q12
  lesson: m04-l05
  prompt:
    es: "Si Doña Soledad Arjona Prieto opta por el traslado, ¿qué derecho le reconoce el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "A un puesto de su cuerpo, solo si está vacante, dotado presupuestariamente y de necesaria cobertura."
  - id: b
    text:
      es: "A un traslado a la localidad que elija, que tiene la consideración de voluntario."
  - id: c
    correct: true
    text:
      es: "A un puesto de su cuerpo, de análogas características, aunque no sea vacante de necesaria cobertura."
  - id: d
    text:
      es: "A un puesto de nivel superior al que ocupa, aunque pertenezca a otro cuerpo."
  explanation:
    es: "La funcionaria obligada a dejar su puesto en la localidad para hacer efectiva su protección tiene derecho al traslado a un puesto de su cuerpo, escala o categoría, de análogas características, sin necesidad de que sea vacante de necesaria cobertura (art. 82.1 TREBEP). La opción que exige vacante de necesaria cobertura invierte la regla. El traslado tiene la consideración de forzoso, no de voluntario. El derecho es a un puesto análogo, no de nivel superior ni de otro cuerpo."
  citation: "art. 82.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-49
- id: q13
  lesson: m04-l05
  prompt:
    es: "¿Cuál es la retribución mensual de Doña Soledad Arjona Prieto si reduce su jornada, según el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "1.723,33 euros, en proporción a las horas que trabaja."
  - id: b
    text:
      es: "1.566,67 euros, las dos terceras partes de su retribución."
  - id: c
    text:
      es: "1.175 euros, la mitad de su retribución mensual íntegra."
  - id: d
    correct: true
    text:
      es: "2.350 euros, pues la reducción no pasa de un tercio."
  explanation:
    es: "La funcionaria víctima de violencia de género que reduce su jornada mantiene sus retribuciones íntegras si la reducción es de un tercio o menos (art. 49.d) TREBEP). De 7,5 a 5,5 horas se pierden 2 horas, el 26,7 % de la jornada, menos de un tercio, así que cobra 2.350 euros. Los 1.723,33 euros son la proporción de 5,5 sobre 7,5, que solo se aplica cuando la reducción supera un tercio. Los 1.566,67 euros descuentan un tercio entero. Los 1.175 euros, la mitad."
  citation: "art. 49.d) TREBEP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1986-1216-art-36
- id: q28
  lesson: m04-l06
  prompt:
    es: "Según el artículo 36 del Real Decreto 33/1986, de 10 de enero, ¿hasta qué fecha puede Don Nicolás Ayala Fuentes contestar el pliego de cargos que se le notifica el miércoles, 6 de octubre de 2027?"
  options:
  - id: a
    text:
      es: "Hasta el miércoles, 20 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el jueves, 21 de octubre de 2027."
  - id: c
    text:
      es: "Hasta el lunes, 18 de octubre de 2027."
  - id: d
    text:
      es: "Hasta el jueves, 28 de octubre de 2027."
  explanation:
    es: "El pliego de cargos se notifica al inculpado con un plazo de diez días para contestarlo (art. 36 RD 33/1986). El reglamento no dice si son hábiles o naturales, y se aplican las reglas de la LPAC: los días son hábiles y se cuentan desde el día siguiente a la notificación (art. 30.2–3 LPAC). Desde el miércoles, 6 de octubre de 2027, el décimo día hábil es el jueves, 21 de octubre de 2027, porque el martes, 12 de octubre de 2027, es festivo. El miércoles, 20 de octubre de 2027, olvida el festivo. El lunes, 18 de octubre de 2027, cuenta diez días naturales, que acaban el sábado, 16 de octubre de 2027, y pasan al lunes. El jueves, 28 de octubre de 2027, cuenta quince días hábiles, el plazo de la audiencia del artículo 82.2 LPAC."
  citation: "art. 36 RD 33/1986"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1987-12636-art-28
- id: q15
  lesson: m04-l07
  prompt:
    es: "Según el artículo 28.2 del Real Decreto Legislativo 670/1987, de 30 de abril, por el que se aprueba el texto refundido de Ley de Clases Pasivas del Estado, ¿desde qué fecha reúne Don Fermín Cabello Ortega los requisitos de la jubilación voluntaria?"
  options:
  - id: a
    text:
      es: "Desde el miércoles, 2 de junio de 2027."
  - id: b
    correct: true
    text:
      es: "Desde el miércoles, 1 de diciembre de 2027."
  - id: c
    text:
      es: "Desde el jueves, 28 de octubre de 2027."
  - id: d
    text:
      es: "Desde el miércoles, 2 de junio de 2032."
  explanation:
    es: "La jubilación voluntaria exige tener cumplidos sesenta años de edad y reconocidos treinta años de servicios efectivos al Estado (art. 28.2 TRLCPE). Don Fermín cumple sesenta el miércoles, 2 de junio de 2027, pero sus treinta años de servicios, contados desde el lunes, 1 de diciembre de 1997, se completan el miércoles, 1 de diciembre de 2027. Reúne los dos requisitos desde esa fecha. La del miércoles, 2 de junio de 2027, cuenta solo la edad. La del jueves, 28 de octubre de 2027, es el día de la solicitud, cuando aún no tiene treinta años de servicios. La del miércoles, 2 de junio de 2032, es la de sus sesenta y cinco años, que no es requisito de la jubilación voluntaria."
  citation: "art. 28.2 TRLCPE"
  difficulty: 3
  tags:
  - "requisito"
  - "cómputo"
# anchor: boe-a-2003-21614-art-54
- id: q16
  lesson: m05-l02
  prompt:
    es: "¿En qué importe máximo puede incrementarse el crédito ampliable del capítulo 4, conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "915.000 euros, el importe total de las obligaciones reconocidas este año."
  - id: b
    text:
      es: "128.000 euros, el 20 % del crédito inicial de la aplicación."
  - id: c
    correct: true
    text:
      es: "275.000 euros, lo que las obligaciones superan al crédito inicial."
  - id: d
    text:
      es: "64.000 euros, el 10 % del crédito inicial de la aplicación."
  explanation:
    es: "Los créditos ampliables pueden incrementarse hasta el importe que alcancen las respectivas obligaciones (art. 54.1 LGP). Las obligaciones son 915.000 euros y el crédito inicial 640.000, así que el incremento máximo es de 275.000 euros. Los 915.000 euros son el crédito total tras ampliar, no el incremento. Los 128.000 y los 64.000 euros toman el 20 % y el 10 % del crédito inicial, cifras de otras modificaciones, no límites de la ampliación."
  citation: "art. 54.1 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-52
- id: q17
  lesson: m05-l02
  prompt:
    es: "Una vez ampliado dicho crédito, ¿puede minorarse mediante una transferencia de crédito para financiar otro gasto del organismo, conforme al artículo 52.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque las transferencias no minoran créditos ampliados en el ejercicio."
  - id: b
    text:
      es: "Sí, siempre que la transferencia se haga dentro del mismo programa de gasto."
  - id: c
    text:
      es: "Sí, si la autoriza el Presidente del organismo autónomo en su presupuesto."
  - id: d
    text:
      es: "No, salvo que la transferencia se destine a financiar créditos del capítulo 1."
  explanation:
    es: "Las transferencias no minoran créditos extraordinarios ni créditos que se hayan suplementado o ampliado en el ejercicio, salvo los ampliables de la Seguridad Social y los de la Deuda Pública (art. 52.1.c LGP). El crédito del capítulo 4 es de un organismo autónomo y la excepción no le alcanza. Quedarse en el mismo programa no evita la restricción, ni la evita la autorización del Presidente: el límite lo pone la ley. Destinar el dinero a personal tampoco lo evita."
  citation: "art. 52.1 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47
- id: q18
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué importe máximo puede comprometerse en 2029 con cargo a la aplicación a la que se imputa el contrato de mantenimiento?"
  options:
  - id: a
    text:
      es: "63.000 euros, el 70 % del crédito inicial de 2027."
  - id: b
    text:
      es: "45.000 euros, el 50 % del crédito inicial de 2027."
  - id: c
    text:
      es: "90.000 euros, el crédito inicial de 2027 completo."
  - id: d
    correct: true
    text:
      es: "54.000 euros, el 60 % del crédito inicial de 2027."
  explanation:
    es: "El gasto que se impute a cada ejercicio posterior no puede exceder del porcentaje del crédito inicial: el 70 % en el ejercicio inmediato siguiente, el 60 % en el segundo y el 50 % en el tercero y el cuarto (art. 47.2 LGP). Con 90.000 euros de crédito inicial en 2027, 2028 es el ejercicio inmediato siguiente y 2029 el segundo: el 60 % son 54.000 euros. Los 63.000 euros son el 70 %, el límite de 2028. Los 45.000 euros, el 50 %, el de 2030. Los 90.000 euros no aplican porcentaje."
  citation: "art. 47.2 LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2014-879-anexo-iv
- id: q25
  lesson: m05-l05
  prompt:
    es: "La Confederación alquila durante un año ordenadores portátiles, sin opción de compra. Según el anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, ¿a qué artículo se imputa el gasto?"
  options:
  - id: a
    text:
      es: "Inversión nueva asociada al funcionamiento operativo de los servicios, del capítulo 6."
  - id: b
    correct: true
    text:
      es: "Arrendamientos y cánones, del capítulo 2."
  - id: c
    text:
      es: "Gastos de inversiones de carácter inmaterial, del capítulo 6."
  - id: d
    text:
      es: "Material, suministros y otros, del capítulo 2."
  explanation:
    es: "La Confederación se rige por el anexo IV, que incluye en el artículo 20, arrendamientos y cánones, el alquiler de equipos informáticos, y el leasing solo si no se va a ejercitar la opción de compra. Los portátiles se alquilan sin opción de compra, así que el gasto va al capítulo 2. La inversión nueva del capítulo 6 supone adquirir los bienes, y aquí solo se alquilan. Los gastos de inversiones de carácter inmaterial no se materializan en activos, y los ordenadores sí son un bien. El artículo de material, suministros y otros recoge material de oficina y suministros, no alquileres."
  citation: "anexo IV, art. 20, Resolución de 20-01-2014"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1989-14441-art-6
- id: q26
  lesson: m05-l05
  prompt:
    es: "Según el artículo 6.2 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, ¿quién puede autorizar la existencia de efectivo en las Cajas pagadoras de la Confederación para necesidades imprevistas y gastos de menor cuantía?"
  options:
  - id: a
    text:
      es: "El Ministro para la Transición Ecológica y el Reto Demográfico, al que está adscrita la Confederación."
  - id: b
    text:
      es: "El Interventor delegado, al informar el establecimiento del sistema de anticipos de caja fija."
  - id: c
    text:
      es: "El Director General del Tesoro y Política Financiera, que ordena los pagos extrapresupuestarios de los anticipos."
  - id: d
    correct: true
    text:
      es: "El Presidente o Director del organismo autónomo, y el Cajero pagador responde de su custodia."
  explanation:
    es: "Los Jefes de los Departamentos ministeriales y los Presidentes o Directores de los organismos autónomos pueden autorizar efectivo en las Cajas pagadoras para necesidades imprevistas y gastos de menor cuantía, y el Cajero pagador responde directamente de su custodia (art. 6.2 RD 725/1989). La Confederación es un organismo autónomo, así que lo autoriza su Presidente o Director. El Ministro es la autoridad de los Departamentos ministeriales, no de sus organismos autónomos. El Interventor delegado solo informa el establecimiento del sistema, limitado a que se respete el límite del 7 por 100. El Director General del Tesoro ordena los pagos extrapresupuestarios de los anticipos de los Departamentos, no autoriza efectivo."
  citation: "art. 6.2 RD 725/1989"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
