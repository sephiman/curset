# anchor: boe-a-2015-10565-art-43
- id: m02-l04-q112
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones por medios electrónicos se entenderán practicadas en el momento en que se produzca:"
  options:
  - id: a
    correct: true
    text:
      es: "El acceso a su contenido."
  - id: b
    text:
      es: "El envío de un aviso al dispositivo del interesado."
  - id: c
    text:
      es: "La puesta a disposición en la sede electrónica."
  - id: d
    text:
      es: "La firma de la resolución por el órgano competente."
  explanation:
    es: "La notificación electrónica se entiende practicada cuando se accede a su contenido. La puesta a disposición solo marca el inicio de los diez días para el rechazo. El aviso al dispositivo no sirve para notificar, y la firma de la resolución no la notifica."
  citation: "art. 43.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-43
- id: m02-l04-q113
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones por medios electrónicos se practicarán mediante comparecencia en la sede electrónica, a través de la dirección electrónica habilitada única o mediante ambos sistemas, según disponga:"
  options:
  - id: a
    text:
      es: "El Punto de Acceso General electrónico."
  - id: b
    correct: true
    text:
      es: "Cada Administración u Organismo."
  - id: c
    text:
      es: "La Secretaría General de Administración Digital."
  - id: d
    text:
      es: "La persona interesada al comunicar su elección."
  explanation:
    es: "El sistema lo elige cada Administración u Organismo actuante. El interesado, la Secretaría General de Administración Digital y el Punto de Acceso General no deciden el sistema de notificación."
  citation: "art. 43.1 LPAC"
  difficulty: 3
  tags:
  - "órgano"
