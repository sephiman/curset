  - "tributos-cedidos"
# anchor: boe-a-1980-21166-art-11
- id: m03-l01-q0073
  prompt:
    es: "¿Cuál de los siguientes tributos puede ser cedido a las Comunidades Autónomas según el artículo 11 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "El Impuesto sobre Sociedades."
  - id: b
    correct: true
    text:
      es: "El Impuesto sobre Sucesiones y Donaciones."
  - id: c
    text:
      es: "El Impuesto sobre la Renta de no Residentes."
  - id: d
    text:
      es: "El impuesto temporal de solidaridad de las grandes fortunas."
  explanation:
    es: "El Impuesto sobre Sucesiones y Donaciones está en la lista cerrada del artículo 11. El Impuesto sobre Sociedades y el de no Residentes no figuran en ella. El impuesto temporal de solidaridad de las grandes fortunas tampoco, y su propia ley dice que no puede cederse."
  citation: "art. 11 LOFCA"
  difficulty: 1
  tags:
  - "lofca"
  - "tributos-cedidos"
# anchor: boe-a-1980-21166-art-11
- id: m03-l01-q0074
  prompt:
    es: "Si una ley estatal proyecta ceder a una Comunidad Autónoma, con carácter parcial, el 70 por ciento de la recaudación del Impuesto sobre el Valor Añadido, ¿es posible conforme al artículo 11 de la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Sí, porque el límite máximo de cesión parcial del Impuesto sobre el Valor Añadido es del 58 por ciento."
  - id: b
    text:
      es: "Sí, porque el Impuesto sobre el Valor Añadido puede cederse en su totalidad."
  - id: c
    correct: true
    text:
      es: "No, porque el Impuesto sobre el Valor Añadido solo puede cederse con carácter parcial con el límite máximo del 50 por ciento."
  - id: d
    text:
      es: "No, porque el Impuesto sobre el Valor Añadido no es un tributo susceptible de cesión."
  explanation:
    es: "El IVA se cede con carácter parcial con el límite máximo del 50 por ciento, de modo que el 70 por ciento lo supera. El 58 por ciento es el límite de los impuestos especiales de fabricación. La cesión total no está prevista para este impuesto. El IVA sí figura en la lista de tributos cedibles."
  citation: "art. 11 LOFCA"
  difficulty: 3
  tags:
  - "lofca"
  - "tributos-cedidos"
  - "cifras"
# anchor: boe-a-2009-20375-art-25
- id: m03-l01-q0075
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 22/2009, de 18 de diciembre, por la que se regula el sistema de financiación de las Comunidades Autónomas de régimen común y Ciudades con Estatuto de Autonomía, señale la respuesta CORRECTA sobre el Impuesto sobre el Patrimonio en relación con la cesión a las Comunidades Autónomas:"
  options:
  - id: a
    text:
      es: "No se cede a las Comunidades Autónomas, porque su rendimiento corresponde en exclusiva al Estado."
  - id: b
    text:
      es: "Se cede únicamente a las Comunidades Autónomas que hayan asumido competencias sobre el Impuesto sobre Sucesiones y Donaciones."
  - id: c
    text:
      es: "Se cede solo a las Corporaciones locales, que perciben su rendimiento total en su territorio."
  - id: d
    correct: true
    text:
      es: "Se cede a las Comunidades Autónomas su rendimiento total o parcial en su territorio."
  explanation:
    es: "El Impuesto sobre el Patrimonio figura entre los tributos cuyo rendimiento total o parcial en su territorio se cede a las Comunidades Autónomas, según el artículo 25.1.b). El impuesto temporal de solidaridad de las grandes fortunas es el que no se cede, no este. La cesión no depende de competencias sobre otro impuesto. Los destinatarios son las Comunidades Autónomas, no las Corporaciones locales."
  citation: "art. 25.1.b) Ley 22/2009"
  difficulty: 2
  tags:
  - "ley-22-2009"
  - "cesión"
