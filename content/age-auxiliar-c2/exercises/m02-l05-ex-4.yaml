# anchor: fuente-moodle-codigo-abierto-html
- id: m02-l05-q210
  prompt:
    es: "¿Qué permite la licencia del código fuente de Moodle LMS, plataforma de aprendizaje de código abierto, según la página oficial de Moodle?"
  options:
  - id: a
    text:
      es: "Consultar el código, pero sin modificarlo ni compartirlo con otras personas ni instituciones"
  - id: b
    text:
      es: "Usar el software solo previo pago de una licencia anual por cada usuario de la plataforma"
  - id: c
    text:
      es: "Instalarlo únicamente en los servidores del propio proveedor, sin posibilidad de alojarlo fuera"
  - id: d
    correct: true
    text:
      es: "Descargar gratis todo el software y personalizar su funcionamiento"
  explanation:
    es: "La licencia permite a cualquiera descargar gratuitamente el software y personalizar su funcionamiento. «Consultar el código, pero sin modificarlo ni compartirlo con otras personas ni instituciones» contradice la página, que habla de modificar y compartir. «Usar el software solo previo pago de una licencia anual por cada usuario de la plataforma» contradice la página: no hay tarifas de licencia. «Instalarlo únicamente en los servidores del propio proveedor, sin posibilidad de alojarlo fuera» contradice la página, que da flexibilidad para ejecutarlo donde se quiera."
  citation: "fuente: `moodle-codigo-abierto.html`; «El camino del \"código abierto»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-moodle-codigo-abierto-html
- id: m02-l05-q213
  prompt:
    es: "¿Cuántos desarrolladores como mínimo participan en el desarrollo de Moodle, coordinados por los equipos principales de su sede, según la página sobre el código abierto?"
  options:
  - id: a
    text:
      es: "Más de 100"
  - id: b
    text:
      es: "Más de 10 000"
  - id: c
    correct: true
    text:
      es: "Más de 1000"
  - id: d
    text:
      es: "Menos de 500"
  explanation:
    es: "La página dice que Moodle está mantenido por más de 1000 desarrolladores. «Más de 100» es una cifra diez veces menor que la que da la página. «Más de 10 000» es una cifra diez veces mayor que la que da la página. «Menos de 500» contradice la página, que habla de más de mil."
  citation: "fuente: `moodle-codigo-abierto.html`; «El camino del \"código abierto»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-hp-plotter-designjet-html
- id: m02-l05-q215
  prompt:
    es: "¿Cuál de las siguientes anchuras de impresión tiene el plotter multifunción HP DesignJet T830, según la ficha de producto de HP?"
  options:
  - id: a
    text:
      es: "914 mm, que son 36 pulgadas"
  - id: b
    text:
      es: "1118 mm, que son 44 pulgadas"
  - id: c
    correct: true
    text:
      es: "610 mm, que son 24 pulgadas"
  - id: d
    text:
      es: "420 mm, que son 16,5 pulgadas"
  explanation:
    es: "La página da 610 mm (24 pulgadas) para el T830. «914 mm, que son 36 pulgadas» es la anchura de las series T1600 y T2600, no la del T830. «1118 mm, que son 44 pulgadas» es la anchura de la serie T1700, no la del T830. «420 mm, que son 16,5 pulgadas» no es la anchura que da la página para el T830. Lo que dice la fuente: «610 mm (24 pulgadas)»."
  citation: "fuente: `hp-plotter-designjet.html`; «Plotter multifunción HP DesignJet T830»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-hp-plotter-designjet-html
- id: m02-l05-q216
  prompt:
    es: "¿Qué cantidad de memoria interna tiene el plotter multifunción HP DesignJet T830, según la página de producto de HP?"
  options:
  - id: a
    text:
      es: "64 MB"
  - id: b
    text:
      es: "512 MB"
  - id: c
    text:
      es: "4 GB"
  - id: d
    correct: true
    text:
      es: "1 GB"
  explanation:
    es: "La página indica 1 GB de memoria interna para el T830. «64 MB» es una cifra muy inferior a la que da la página. «512 MB» es la mitad de la memoria que da la página. «4 GB» es cuatro veces la memoria que da la página."
  citation: "fuente: `hp-plotter-designjet.html`; «Plotter multifunción HP DesignJet T830»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-sistemas-numericos-html
- id: m02-l05-q218
  prompt:
    es: "¿Cuántos símbolos distintos usa el sistema numérico hexadecimal, que tiene valor base 16, según la tabla de la página de Microsoft sobre sistemas numéricos?"
  options:
  - id: a
    text:
      es: "Diez: los dígitos del 0 al 9"
  - id: b
    text:
      es: "Ocho: los dígitos del 0 al 7"
  - id: c
    text:
      es: "Seis: solo las letras de A a F"
  - id: d
    correct: true
    text:
      es: "Dieciséis: los dígitos del 0 al 9 y las letras de A a F"
  explanation:
    es: "La tabla da para el hexadecimal base 16 con los símbolos 0 a 9 y A a F. «Diez: los dígitos del 0 al 9» son los símbolos del sistema decimal, de base 10. «Ocho: los dígitos del 0 al 7» son los símbolos del sistema octal, de base 8. «Seis: solo las letras de A a F» son solo las letras del hexadecimal, que usa además los dígitos del 0 al 9."
  citation: "fuente: `ms-excel-sistemas-numericos.html`; «Convertir números de un sistema numérico en otro»"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-ms-excel-sistemas-numericos-html
- id: m02-l05-q219
  prompt:
    es: "¿Cuál es el valor base del sistema de numeración octal, cuyos símbolos son los dígitos del 0 al 7, según la página de Microsoft sobre sistemas numéricos?"
  options:
  - id: a
    correct: true
    text:
      es: "8"
  - id: b
    text:
      es: "2"
  - id: c
    text:
      es: "10"
  - id: d
    text:
      es: "16, el del sistema hexadecimal"
  explanation:
    es: "El sistema octal tiene valor base 8. «2» es la base del sistema binario. «10» es la base del sistema decimal. «16, el del sistema hexadecimal» es la base del sistema hexadecimal."
  citation: "fuente: `ms-excel-sistemas-numericos.html`; «Octal — 8 — 0, 1, 2, 3, 4, 5, 6, 7»"
  difficulty: 3
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-ms-excel-sistemas-numericos-html
- id: m02-l05-q220
  prompt:
    es: "¿Qué juego de símbolos usa el sistema numérico decimal, el más común, que tiene un valor base de 10, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Solo 0 y 1"
  - id: b
    text:
      es: "Del 0 al 7"
  - id: c
    text:
      es: "Del 0 al 9 y las letras A a F"
  - id: d
    correct: true
    text:
      es: "Del 0 al 9"
  explanation:
    es: "La página indica que el decimal usa los símbolos 0, 1, 2, 3, 4, 5, 6, 7, 8 y 9. «Solo 0 y 1» son los símbolos del sistema binario. «Del 0 al 7» son los símbolos del sistema octal. «Del 0 al 9 y las letras A a F» son los símbolos del sistema hexadecimal."
  citation: "fuente: `ms-excel-sistemas-numericos.html`; «El sistema numérico más común es decimal, que tiene un valor base de 10 y un juego de caracteres simbólico de 0, 1, 2, 3, 4, 5, 6, 7, 8 y 9.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-sistemas-numericos-html
- id: m02-l05-q221
  prompt:
    es: "¿Por qué usan los equipos el sistema de números binarios, de valor base 2, según la página de Microsoft sobre sistemas numéricos?"
  options:
  - id: a
    text:
      es: "Porque tiene más símbolos que el decimal y por eso agrupa mejor los números en forma compacta"
  - id: b
    text:
      es: "Porque su valor base es 16 y permite una escritura más compacta de los números de memoria"
  - id: c
    correct: true
    text:
      es: "Porque usan la lógica booleana para calcular"
  - id: d
    text:
      es: "Porque es el único sistema numérico que reconocen las personas, y los equipos lo adoptan por esa razón"
  explanation:
    es: "La página relaciona el uso del binario con la lógica booleana de los cálculos del equipo. «Porque tiene más símbolos que el decimal y por eso agrupa mejor los números en forma compacta» contradice la página: el binario solo tiene los símbolos 0 y 1. «Porque su valor base es 16 y permite una escritura más compacta de los números de memoria» es el valor base del hexadecimal, no del binario. «Porque es el único sistema numérico que reconocen las personas, y los equipos lo adoptan por esa razón» no es lo que dice la página, que habla de la lógica booleana. Lo que dice la fuente: «dado que los equipos utilizan la lógica booleana para realizar cálculos y operaciones, usan el sistema de números binarios, que tiene un valor base de 2»."
  citation: "fuente: `ms-excel-sistemas-numericos.html`; «Convertir números de un sistema numérico en otro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-configuracion-red-html
- id: m02-l05-q222
  prompt:
    es: "En Windows 11, ¿qué sección de la aplicación Configuración permite administrar los dispositivos conectados al equipo, como mouse, teclados, altavoces y auriculares inalámbricos?"
  options:
  - id: a
    text:
      es: "Red e Internet, para las conexiones"
  - id: b
    text:
      es: "Accesibilidad y asistencia"
  - id: c
    correct: true
    text:
      es: "Bluetooth y dispositivos"
  - id: d
    text:
      es: "Personalización del escritorio"
  explanation:
    es: "La página indica que esa sección administra los dispositivos conectados, incluidos periféricos inalámbricos. «Red e Internet, para las conexiones» administra las conexiones de red, no los periféricos conectados. «Accesibilidad y asistencia» reúne opciones para facilitar el uso del equipo, no administra los periféricos. «Personalización del escritorio» cambia el aspecto del escritorio, no administra los periféricos."
  citation: "fuente: `ms-win-configuracion-red.html`; «Navegar por la configuración de Bluetooth y dispositivos»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q223
  prompt:
    es: "¿Qué es la informática en la nube, según la guía para principiantes de Microsoft Azure, que enumera servidores, almacenamiento, redes y software entre sus servicios?"
  options:
  - id: a
    text:
      es: "La instalación de servidores en el centro de datos propio de la empresa"
  - id: b
    text:
      es: "El almacenamiento de datos en discos externos conectados por USB"
  - id: c
    text:
      es: "La venta de equipos informáticos con pago por suscripción"
  - id: d
    correct: true
    text:
      es: "La entrega de servicios informáticos a través de Internet"
  explanation:
    es: "La guía la define como entrega de servicios informáticos a través de Internet. «La instalación de servidores en el centro de datos propio de la empresa» es lo que la guía contrapone a la nube, que elimina la inversión en centros de datos locales. «El almacenamiento de datos en discos externos conectados por USB» no es lo que define la guía, que habla de servicios a través de Internet. «La venta de equipos informáticos con pago por suscripción» no es lo que define la guía, que habla de servicios entregados por Internet. Lo que dice la fuente: «La informática en la nube es la entrega de servicios informáticos, como servidores, almacenamiento, bases de datos, redes, software, análisis e inteligencia, a través de Internet»."
  citation: "fuente: `azure-computacion-nube.html`; «¿Qué es la informática en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q224
  prompt:
    es: "¿Cuál de las siguientes categorías de servicios en la nube consiste en alquilar servidores, máquinas virtuales, almacenamiento, redes y sistemas operativos a un proveedor de pago por uso?"
  options:
  - id: a
    text:
      es: "Plataforma como servicio (PaaS), de desarrollo"
  - id: b
    correct: true
    text:
      es: "Infraestructura como servicio (IaaS)"
  - id: c
    text:
      es: "Software como servicio (SaaS), de aplicaciones"
  - id: d
    text:
      es: "Informática sin servidor, por eventos"
  explanation:
    es: "La guía describe IaaS como el alquiler de servidores, máquinas virtuales, almacenamiento, redes y sistemas operativos. «Plataforma como servicio (PaaS), de desarrollo» suministra un entorno para desarrollar, probar, entregar y administrar aplicaciones, no alquila la infraestructura. «Software como servicio (SaaS), de aplicaciones» entrega aplicaciones a través de Internet, no alquila la infraestructura. «Informática sin servidor, por eventos» se centra en crear funcionalidad sin administrar servidores, no en alquilarlos."
  citation: "fuente: `azure-computacion-nube.html`; «Con infraestructura como servicio (IaaS), se alquilan servidores de infraestructura de TI y máquinas virtuales (VM), almacenamiento, redes y sistemas operativos de un proveedor de nube de pago por uso.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q225
  prompt:
    es: "¿Cuál de las siguientes categorías de servicios en la nube suministra un entorno a petición para desarrollar, probar, entregar y administrar aplicaciones?"
  options:
  - id: a
    text:
      es: "Infraestructura como servicio (IaaS)"
  - id: b
    correct: true
    text:
      es: "Plataforma como servicio (PaaS)"
  - id: c
    text:
      es: "Software como servicio (SaaS)"
  - id: d
    text:
      es: "Almacenamiento de objetos"
  explanation:
    es: "La guía describe PaaS como un entorno a petición para desarrollar, probar, entregar y administrar aplicaciones. «Infraestructura como servicio (IaaS)» alquila servidores, almacenamiento y redes, no suministra el entorno de desarrollo. «Software como servicio (SaaS)» entrega aplicaciones ya hechas por Internet, no un entorno de desarrollo. «Almacenamiento de objetos» es un tipo de almacenamiento en la nube, no una categoría de servicios."
  citation: "fuente: `azure-computacion-nube.html`; «Plataforma como servicio (PaaS) hace referencia a los servicios informáticos en la nube que suministran un entorno a petición para desarrollar, probar, entregar y administrar aplicaciones.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q226
  prompt:
    es: "¿Cuál de los siguientes agentes hospeda y administra las aplicaciones y la infraestructura subyacente en el modelo de software como servicio (SaaS) de la guía de Microsoft Azure?"
  options:
  - id: a
    text:
      es: "El propio usuario, en sus equipos locales"
  - id: b
    text:
      es: "El administrador de red de la organización cliente"
  - id: c
    text:
      es: "El fabricante del navegador que usa el cliente"
  - id: d
    correct: true
    text:
      es: "Los proveedores de nube"
  explanation:
    es: "La guía dice que con SaaS los proveedores de nube hospedan y administran las aplicaciones y la infraestructura. «El propio usuario, en sus equipos locales» contradice la guía: el usuario solo se conecta a la aplicación a través de Internet. «El administrador de red de la organización cliente» contradice la guía, que atribuye esa tarea al proveedor de nube. «El fabricante del navegador que usa el cliente» no es lo que dice la guía, que habla de los proveedores de nube. Lo que dice la fuente: «Con SaaS, los proveedores de nube hospedan y administran las aplicaciones y la infraestructura subyacente»."
  citation: "fuente: `azure-computacion-nube.html`; «¿Qué es la informática en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q227
  prompt:
    es: "¿Cuál de los siguientes modelos de implementación en la nube es propiedad de proveedores de servicios de terceros y se accede a él desde un explorador web?"
  options:
  - id: a
    correct: true
    text:
      es: "La nube pública"
  - id: b
    text:
      es: "La nube privada"
  - id: c
    text:
      es: "La nube híbrida"
  - id: d
    text:
      es: "La nube local"
  explanation:
    es: "La guía dice que las nubes públicas son propiedad de proveedores de terceros y se administran desde un explorador web. «La nube privada» la usa en exclusiva una sola organización, no es propiedad de un proveedor de terceros para todos. «La nube híbrida» combina nubes públicas y privadas, no es el modelo de propiedad exclusiva de terceros. «La nube local» no figura entre los tres modelos de implementación de la guía. Lo que dice la fuente: «Nubes públicas son propiedad de proveedores de servicios en la nube de terceros , que proporcionan recursos informáticos como servidores y almacenamiento a través de Internet»."
  citation: "fuente: `azure-computacion-nube.html`; «¿Qué es la informática en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q228
  prompt:
    es: "¿Cuál de las siguientes formas de cobro emplean los proveedores de la nube, según la guía de Microsoft Azure sobre qué es la informática en la nube?"
  options:
  - id: a
    text:
      es: "Con una cuota fija anual, independiente del uso"
  - id: b
    text:
      es: "Con una compra única de licencia para cada servidor virtual"
  - id: c
    correct: true
    text:
      es: "Con un modelo de pago por uso, solo por los servicios que se usan"
  - id: d
    text:
      es: "Con un pago inicial por la instalación de un centro de datos local"
  explanation:
    es: "La guía indica que los proveedores emplean un modelo de pago por uso. «Con una cuota fija anual, independiente del uso» contradice la guía, que habla de pagar solo por lo que se usa. «Con una compra única de licencia para cada servidor virtual» contradice la guía, que lo opone a la inversión de capital en hardware y software. «Con un pago inicial por la instalación de un centro de datos local» contradice la guía, que dice que la nube elimina esa inversión."
  citation: "fuente: `azure-computacion-nube.html`; «Los proveedores de nube suelen emplear un modelo de precios de pago por uso, lo que significa que las organizaciones solo pagan por los servicios en la nube que usan.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q229
  prompt:
    es: "¿Cuál de las siguientes ventajas atribuye la guía de Microsoft Azure a la informática en la nube por la forma en que los datos se reflejan en varios sitios redundantes?"
  options:
  - id: a
    text:
      es: "La velocidad, porque los recursos de cómputo se aprovisionan en minutos con unos pocos clics y sin planificar la capacidad"
  - id: b
    text:
      es: "El coste, porque elimina la inversión de capital en hardware y software propios y en centros de datos locales"
  - id: c
    text:
      es: "La escala global, porque ofrece los recursos de cómputo, almacenamiento y ancho de banda desde la ubicación geográfica adecuada"
  - id: d
    correct: true
    text:
      es: "La fiabilidad, porque facilita y abarata las copias de seguridad y la recuperación ante desastres"
  explanation:
    es: "La guía asocia los sitios redundantes con la fiabilidad, las copias de seguridad y la recuperación ante desastres. «La velocidad, porque los recursos de cómputo se aprovisionan en minutos con unos pocos clics y sin planificar la capacidad» es otra ventaja de la guía, ligada al autoservicio, no a los sitios redundantes. «El coste, porque elimina la inversión de capital en hardware y software propios y en centros de datos locales» es otra ventaja de la guía, ligada a la inversión de capital, no a los sitios redundantes. «La escala global, porque ofrece los recursos de cómputo, almacenamiento y ancho de banda desde la ubicación geográfica adecuada» es otra ventaja de la guía, ligada a la elasticidad, no a los sitios redundantes."
  citation: "fuente: `azure-computacion-nube.html`; «La informática en la nube facilita y abarata la creación de copias de seguridad de los datos, la recuperación ante desastres, y la continuidad empresarial, ya que los datos se pueden reflejar en varios sitios redundantes en la red del proveedor de servicios en la nube.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q230
  prompt:
    es: "¿Qué implica la informática multinube, según las preguntas frecuentes de la guía de Microsoft Azure sobre la informática en la nube?"
  options:
  - id: a
    correct: true
    text:
      es: "Usar servicios en la nube de más de un proveedor para las mismas cargas"
  - id: b
    text:
      es: "Usar solo una nube privada alojada en el centro de datos propio de la organización y administrada por ella"
  - id: c
    text:
      es: "Combinar una nube pública y una privada enlazadas por tecnología que permite compartir datos y aplicaciones"
  - id: d
    text:
      es: "Instalar un único proveedor de nube en varios países a la vez, con un solo contrato de servicio"
  explanation:
    es: "La guía define la multinube como el uso de servicios de más de un proveedor para las mismas cargas. «Usar solo una nube privada alojada en el centro de datos propio de la organización y administrada por ella» no es la multinube, que implica más de un proveedor. «Combinar una nube pública y una privada enlazadas por tecnología que permite compartir datos y aplicaciones» es la nube híbrida, no la multinube. «Instalar un único proveedor de nube en varios países a la vez, con un solo contrato de servicio» no es la multinube, que se define por el uso de varios proveedores. Lo que dice la fuente: «La informática multinube implica el uso de varios servicios de informática en la nube de más de un proveedor de nube para el mismo tipo de cargas de trabajo o soluciones de TI»."
  citation: "fuente: `azure-computacion-nube.html`; «¿Qué es la informática en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-computacion-nube-html
- id: m02-l05-q231
  prompt:
    es: "¿Cuál de las siguientes categorías de servicios en la nube se superpone con PaaS y solo usa los recursos cuando ocurre una función o un desencadenador específicos?"
  options:
  - id: a
    text:
      es: "La infraestructura como servicio"
  - id: b
    correct: true
    text:
      es: "La informática sin servidor"
  - id: c
    text:
      es: "El software como servicio"
  - id: d
    text:
      es: "La nube híbrida"
  explanation:
    es: "La guía dice que la informática sin servidor se superpone con PaaS y usa recursos solo ante un evento. «La infraestructura como servicio» alquila servidores y redes de forma continua, no solo ante un desencadenador. «El software como servicio» entrega aplicaciones completas por Internet, no se basa en eventos. «La nube híbrida» es un modelo de implementación, no una categoría de servicio."
  citation: "fuente: `azure-computacion-nube.html`; «¿Qué es la informática en la nube?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q306
  prompt:
    es: "Según la RFC 3629 que define UTF-8, ¿cuántos octetos ocupa la secuencia de un carácter cuyo número va de U+0800 a U+FFFF?"
  options:
  - id: a
    text:
      es: "Un octeto"
  - id: b
    text:
      es: "Dos octetos"
  - id: c
    correct: true
    text:
      es: "Tres octetos"
  - id: d
    text:
      es: "Cuatro octetos"
  explanation:
    es: "La tabla de la RFC asigna a los números de carácter de U+0800 a U+FFFF una secuencia de tres octetos, con el patrón 1110xxxx 10xxxxxx 10xxxxxx. Un octeto es la secuencia de los números de U+0000 a U+007F, el repertorio US-ASCII. Dos octetos es la secuencia de los números de U+0080 a U+07FF. Cuatro octetos es la secuencia de los números de U+10000 a U+10FFFF."
  citation: "fuente: `rfc3629-utf8.txt`; «0000 0800-0000 FFFF — 1110xxxx 10xxxxxx 10xxxxxx»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-rfc3629-utf8-txt
- id: m02-l05-q307
  prompt:
    es: "Según la RFC 3629 que define UTF-8, ¿quién ideó esta codificación en septiembre de 1992 para usarla en el sistema operativo Plan9?"
  options:
  - id: a
    correct: true
    text:
      es: "Ken Thompson"
  - id: b
    text:
      es: "Rob Pike"
  - id: c
    text:
      es: "Federico Faggin"
  - id: d
    text:
      es: "Jeffrey Snover"
  explanation:
    es: "La RFC dice que UTF-8 fue ideado en septiembre de 1992 por Ken Thompson. Rob Pike solo especificó los criterios de diseño que guiaron a Thompson. Federico Faggin es el ingeniero que diseñó el Intel 4004, según la nota de prensa de Intel. Jeffrey Snover es el inventor de PowerShell, según la página de Microsoft Learn."
  citation: "fuente: `rfc3629-utf8.txt`; «UTF-8 was devised in September 1992 by Ken Thompson, guided by design criteria specified by Rob Pike, with the objective of defining a UCS transformation format usable in the Plan9 operating system in a non- disruptive manner.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-todo-bienvenida-html
- id: m02-l05-q309
  prompt:
    es: "Señale cuál de las siguientes opciones de Microsoft To Do sirve para registrar detalles adicionales de una tarea, según la página de bienvenida de Microsoft:"
  options:
  - id: a
    text:
      es: "Los pasos"
  - id: b
    correct: true
    text:
      es: "Las notas"
  - id: c
    text:
      es: "Las fechas de vencimiento"
  - id: d
    text:
      es: "Destacar la tarea"
  explanation:
    es: "La página dice que las notas sirven para registrar detalles adicionales. Los pasos sirven para dividir las tareas más grandes en partes más manejables. Las fechas de vencimiento y los recordatorios sirven para mantener todo bajo control. Destacar una tarea sirve para marcar las tareas más importantes."
  citation: "fuente: `ms-todo-bienvenida.html`; «Le damos la bienvenida a Microsoft To Do»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-todo-bienvenida-html
- id: m02-l05-q310
  prompt:
    es: "¿Cuántas listas adicionales puede crear el usuario de Microsoft To Do, además de trabajar en Mi día, según la página de bienvenida de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquier número de ellas"
  - id: b
    text:
      es: "Hasta diez como máximo"
  - id: c
    text:
      es: "Una por cada día de la semana"
  - id: d
    text:
      es: "Solo las que cree un administrador de Exchange Online"
  explanation:
    es: "La página dice que, además de trabajar las tareas del día en Mi día, se puede crear cualquier número de listas adicionales para organizar el trabajo, la compra o los viajes. Un máximo de diez y una lista por día contradicen «cualquier número». Que solo las cree un administrador de Exchange Online contradice que sea el propio usuario quien las crea; Exchange Online solo es donde se almacenan las tareas."
  citation: "fuente: `ms-todo-bienvenida.html`; «Le damos la bienvenida a Microsoft To Do»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-plug-and-play-html
- id: m02-l05-q311
  prompt:
    es: "¿Qué hace el administrador de Plug and Play de Windows 11 cuando se agrega un dispositivo nuevo que requiere recursos de hardware que ya están en uso?"
  options:
  - id: a
    text:
      es: "Pide al usuario que configure el dispositivo a mano"
  - id: b
    correct: true
    text:
      es: "Vuelve a configurar las asignaciones de recursos"
  - id: c
    text:
      es: "Deja que el controlador del dispositivo asigne sus propios recursos"
  - id: d
    text:
      es: "Rechaza el dispositivo hasta que se reinicie el sistema"
  explanation:
    es: "La página dice que el administrador de PnP vuelve a configurar las asignaciones de recursos cuando hace falta, por ejemplo cuando se agrega un dispositivo que requiere recursos ya en uso. Pedir una configuración manual contradice a Plug and Play, que permite agregar y quitar dispositivos sin configuración manual. Que el controlador asigne los recursos contradice la página: los controladores de dispositivos PnP no asignan recursos. Rechazar el dispositivo contradice que el administrador reasigne los recursos."
  citation: "fuente: `ms-win-plug-and-play.html`; «Introducción a Plug and Play»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-plug-and-play-html
- id: m02-l05-q312
  prompt:
    es: "¿Qué parte de Windows 11 permite a un sistema informático adaptarse a los cambios de hardware con una intervención mínima del usuario?"
  options:
  - id: a
    text:
      es: "Windows Update"
  - id: b
    text:
      es: "Seguridad de Windows"
  - id: c
    text:
      es: "El administrador de memoria"
  - id: d
    correct: true
    text:
      es: "Plug and Play"
  explanation:
    es: "La página define Plug and Play como la parte de Windows que permite adaptarse a los cambios de hardware con una intervención mínima del usuario, de modo que se puedan agregar y quitar dispositivos sin configuración manual. Windows Update descarga e instala las actualizaciones. Seguridad de Windows reúne el antivirus y el firewall. El administrador de memoria del kernel administra la memoria física."
  citation: "fuente: `ms-win-plug-and-play.html`; «Introducción a Plug and Play»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-python-tutorial-introduccion-html
- id: m02-l05-q315
  prompt:
    es: "Según el tutorial oficial de Python, ¿qué tipo tienen los números enteros, como 2, 4 o 20?"
  options:
  - id: a
    text:
      es: "float"
  - id: b
    text:
      es: "str"
  - id: c
    text:
      es: "complex"
  - id: d
    correct: true
    text:
      es: "int"
  explanation:
    es: "El tutorial dice que los números enteros tienen tipo int. El tipo float corresponde a los números con parte fraccionaria, como 5.0 o 1.6. El tipo str es el del texto, conocido como cadenas de caracteres. Los números complejos, como 3+5j, usan el sufijo j o J para la parte imaginaria."
  citation: "fuente: `python-tutorial-introduccion.html`; «Una introducción informal a Python»"
  difficulty: 1
  tags:
  - "concepto"
