- id: m06-l04-q02
  prompt:
    en: In Liquibase 5.1, which statement about what a changeset holds and how it is identified is correct?
  options:
  - id: a
    text:
      en: It is uniquely tagged by its `id` attribute alone
  - id: b
    text:
      en: Its `id` decides the order in which changesets run
  - id: c
    text:
      en: It runs as a separate transaction for each statement by default
  - id: d
    correct: true
    text:
      en: It contains change types, such as creating a table or adding a column
  explanation:
    en: A changeset contains change types that specify what each change does. The `id` alone does not tag it, because
      the tag is `author`, `id` and the changelog file path. The `id` does not direct the order in which changes
      are run. By default Liquibase runs a changeset as a single transaction, not one per statement.
  citation: liquibase-changeset#main-header
- id: m06-l04-q05
  prompt:
    en: In Flyway 13, which statement about migrations and the environments they are deployed to is correct?
  options:
  - id: a
    text:
      en: The scripts are kept out of version control and copied by hand
  - id: b
    correct: true
    text:
      en: The same scripts are run in the same order on each environment
  - id: c
    text:
      en: The scripts can capture schema changes only, never data changes
  - id: d
    text:
      en: The scripts are captured from the production database after each release
  explanation:
    en: The same scripts run in the same order on each environment, which makes the deployment repeatable. Migrations
      should be tracked in version control, so keeping them out is wrong. They can capture schema and data changes,
      such as `INSERT` and `UPDATE`. They capture incremental changes to a development database, not a production
      one.
  citation: flyway-migrations#migrations
- id: m06-l04-q07
  prompt:
    en: In PostgreSQL 18, which statement about building an index with `CREATE INDEX CONCURRENTLY` on a table that
      live production traffic is writing to is correct?
  options:
  - id: a
    correct: true
    text:
      en: It performs two table scans and waits for existing transactions
  - id: b
    text:
      en: It leaves writers blocked until the build finishes, as a standard build does
  - id: c
    text:
      en: It can be run inside a transaction block like a regular `CREATE INDEX`
  - id: d
    text:
      en: It cannot build an expression index or a partial index
  explanation:
    en: A concurrent build must perform two table scans and wait for all existing transactions that could modify
      or use the index to terminate. Leaving writers blocked describes a standard build, while this option builds
      without locking out writes. `CREATE INDEX CONCURRENTLY` cannot be performed within a transaction block. Concurrent
      builds of expression and partial indexes are supported.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: PostgreSQL must perform two scans of the table
- id: m06-l04-q08
  prompt:
    en: In PostgreSQL 18, which statement about the cost of `CREATE INDEX CONCURRENTLY` compared with a standard
      `CREATE INDEX` on the same large table is correct?
  options:
  - id: a
    correct: true
    text:
      en: It needs more total work and takes much longer
  - id: b
    text:
      en: It finishes faster because it performs a single scan of the table
  - id: c
    text:
      en: It needs the same total work and only differs in the lock it takes
  - id: d
    text:
      en: It adds no load, since other operations are never slowed
  explanation:
    en: A concurrent build requires more total work and takes significantly longer. The standard build is the one
      that performs a single scan, while the concurrent build performs two. Because it does extra work, the total
      is not the same. The extra CPU and I/O load imposed by the index creation might slow other operations.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: this method requires more total work than a standard index build and takes significantly longer to complete
- id: m06-l04-q09
  prompt:
    en: In PostgreSQL 18, a `CREATE INDEX CONCURRENTLY` fails with a deadlock while scanning the table. Which statement
      about what remains is correct?
  options:
  - id: a
    text:
      en: Nothing remains, because the failed command leaves no catalog entry
  - id: b
    correct: true
    text:
      en: An invalid index remains, ignored for queries but costing updates
  - id: c
    text:
      en: The command can be repaired by running `ANALYZE` and waiting
  - id: d
    text:
      en: The invalid index is rebuilt by the planner on the next query
  explanation:
    en: A failed build leaves behind an invalid index that is ignored for querying and still consumes update overhead.
      The command does fail but leaves that index, so nothing is not right. The recommended recovery is to drop
      the index and try again, not `ANALYZE`. The planner ignores the index because it might be incomplete, so it
      does not rebuild it.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: the CREATE INDEX command will fail but leave behind an “invalid” index
- id: m06-l04-q10
  prompt:
    en: In PostgreSQL 18, a unique index is built with `CREATE INDEX CONCURRENTLY` while other transactions write
      to the table. Which statement about uniqueness is correct?
  options:
  - id: a
    text:
      en: An invalid index left by a failed second scan stops enforcing uniqueness
  - id: b
    text:
      en: Two concurrent builds of unique indexes can run on the table at once
  - id: c
    text:
      en: A concurrent build blocks all reads of the table until the index is valid
  - id: d
    correct: true
    text:
      en: The uniqueness constraint is enforced against other transactions once the second scan begins
  explanation:
    en: The uniqueness constraint is already enforced against other transactions when the second table scan begins.
      If the second scan fails, the invalid index continues to enforce its uniqueness constraint. Only one concurrent
      index build can occur on a table at a time. The method allows normal operations to continue while the index
      is built.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: the uniqueness constraint is already being enforced against other transactions when the second table scan
      begins
- id: m06-l04-q11
  prompt:
    en: In PostgreSQL 18, which statement about running several index builds on one table at the same time is correct?
  options:
  - id: a
    text:
      en: '`CREATE INDEX CONCURRENTLY` lets writers wait until the build finishes'
  - id: b
    correct: true
    text:
      en: Only one concurrent index build can occur on a table at a time
  - id: c
    text:
      en: A concurrent build needs only a single scan of the table
  - id: d
    text:
      en: Partial indexes cannot be built with `CREATE INDEX CONCURRENTLY`
  explanation:
    en: Only one concurrent index build can occur on a table at a time. A concurrent build is the one that builds
      without locking out writes. It must perform two table scans, not one. Concurrent builds of expression indexes
      and partial indexes are supported.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: only one concurrent index build can occur on a table at a time
- id: m06-l04-q12
  prompt:
    en: In PostgreSQL 18, a team must index a partitioned table and keep write lock-out short. Which approach does
      the documentation give?
  options:
  - id: a
    correct: true
    text:
      en: Build the index concurrently on each partition, then create the partitioned index non-concurrently
  - id: b
    text:
      en: Run `CREATE INDEX CONCURRENTLY` on the partitioned table itself
  - id: c
    text:
      en: Run a regular `CREATE INDEX`, since it never locks out writers
  - id: d
    text:
      en: Run `CREATE INDEX CONCURRENTLY` on each partition inside one transaction block
  explanation:
    en: You may build the index concurrently on each partition and then create the partitioned index non-concurrently,
      which is a metadata only operation. Concurrent builds on partitioned tables are currently not supported. A
      regular build normally locks the table against writes. `CREATE INDEX CONCURRENTLY` cannot be performed within
      a transaction block.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: you may concurrently build the index on each partition individually and then finally create the partitioned
      index non-concurrently
- id: m06-l04-q13
  prompt:
    en: In PostgreSQL 18, a `CREATE INDEX CONCURRENTLY` command has just terminated successfully. Which statement
      about using the new index for queries is correct?
  options:
  - id: a
    text:
      en: It was marked valid right after the first table scan, so it is always usable
  - id: b
    correct: true
    text:
      en: It may not be usable immediately, and in the worst case waits for transactions that predate the build
  - id: c
    text:
      en: It is usable from the moment it is entered in the system catalogs
  - id: d
    text:
      en: It is never usable until it is rebuilt with `REINDEX INDEX CONCURRENTLY`
  explanation:
    en: Even after the command terminates, in the worst case the index cannot be used as long as transactions exist
      that predate the start of the build. The index is marked valid only after the last wait, not after the first
      scan. It is first entered in the catalogs as invalid. The `REINDEX INDEX CONCURRENTLY` command is mentioned
      as a recovery for a failed build, not as a step for a successful one.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: in the worst case, it cannot be used as long as transactions exist that predate the start of the index build
- id: m06-l04-q14
  prompt:
    en: In PostgreSQL 18, a standard `CREATE INDEX` runs on a busy table. Which statement about what other transactions
      can do meanwhile is correct?
  options:
  - id: a
    text:
      en: They are blocked from reading as well as from writing
  - id: b
    text:
      en: The lock is only taken when the table is large enough
  - id: c
    text:
      en: It takes no lock at all and scans the table twice in a row
  - id: d
    correct: true
    text:
      en: Reads continue, but inserts, updates and deletes block
  explanation:
    en: A standard build locks the table against writes while other transactions can still read it. Reads are therefore
      not blocked. Even for smaller tables, a build can lock out writers for unacceptably long periods, so the lock
      does not depend on size. A standard build performs the entire build with a single scan under that lock.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: Other transactions can still read the table, but if they try to insert, update, or delete rows in the table
      they will block until the index build is finished.
- id: m06-l04-q15
  prompt:
    en: In PostgreSQL 18, which statement about the effect of `CREATE INDEX CONCURRENTLY` on a database that keeps
      serving traffic is correct?
  options:
  - id: a
    text:
      en: It blocks all other operations, reads included, until the build finishes
  - id: b
    correct: true
    text:
      en: The extra CPU and I/O load of the build might slow other operations
  - id: c
    text:
      en: It locks out writers for the whole build
  - id: d
    text:
      en: It starts without waiting for any existing transaction
  explanation:
    en: The extra CPU and I/O load imposed by the index creation might slow other operations. It does not block
      readers, since it allows normal operations to continue while the index is built. It also builds without locking
      out writes. It must wait for all existing transactions that could modify or use the index.
  citation: pg-sql-createindex#SQL-CREATEINDEX-CONCURRENTLY
  extract:
    en: the extra CPU and I/O load imposed by the index creation might slow other operations
- id: m06-l04-q21
  prompt:
    en: Which `ALTER TABLE` subform in PostgreSQL 18 acquires only a `SHARE ROW EXCLUSIVE` lock, where most constraint
      forms need `ACCESS EXCLUSIVE`?
  options:
  - id: a
    text:
      en: '`ADD` a `CHECK` constraint'
  - id: b
    text:
      en: '`SET STATISTICS`'
  - id: c
    correct: true
    text:
      en: '`ADD FOREIGN KEY`'
  - id: d
    text:
      en: '`DROP COLUMN`'
  explanation:
    en: '`ADD FOREIGN KEY` requires only a `SHARE ROW EXCLUSIVE` lock, and it takes one on the referenced table
      too. Most other forms of `ADD table_constraint`, such as a `CHECK` constraint, require `ACCESS EXCLUSIVE`.
      `SET STATISTICS` acquires a `SHARE UPDATE EXCLUSIVE` lock. `DROP COLUMN` is not noted otherwise, so it takes
      `ACCESS EXCLUSIVE`.'
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: ADD FOREIGN KEY requires only a SHARE ROW EXCLUSIVE lock
- id: m06-l04-q22
  prompt:
    en: Which `ALTER TABLE` subform in PostgreSQL 18 acquires a `SHARE UPDATE EXCLUSIVE` lock instead of the default
      lock level?
  options:
  - id: a
    text:
      en: '`ADD FOREIGN KEY`'
  - id: b
    text:
      en: '`SET DATA TYPE`'
  - id: c
    text:
      en: '`ADD` a `CHECK` constraint'
  - id: d
    correct: true
    text:
      en: '`SET STATISTICS`'
  explanation:
    en: '`SET STATISTICS` acquires a `SHARE UPDATE EXCLUSIVE` lock. `ADD FOREIGN KEY` requires a `SHARE ROW EXCLUSIVE`
      lock. `SET DATA TYPE` is not explicitly noted, so it takes `ACCESS EXCLUSIVE`. Most forms of `ADD table_constraint`,
      a `CHECK` constraint included, require `ACCESS EXCLUSIVE`.'
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: SET STATISTICS acquires a SHARE UPDATE EXCLUSIVE lock.
- id: m06-l04-q24
  prompt:
    en: In PostgreSQL 18, a team wants to add a `CHECK` constraint to a large table without the potentially lengthy
      scan of its existing rows. Which command does that?
  options:
  - id: a
    text:
      en: '`ALTER TABLE ... ADD CONSTRAINT ... CHECK (...)` with no extra option'
  - id: b
    text:
      en: '`ALTER TABLE ... ADD PRIMARY KEY (...) NOT VALID`'
  - id: c
    correct: true
    text:
      en: '`ALTER TABLE ... ADD CONSTRAINT ... CHECK (...) NOT VALID`'
  - id: d
    text:
      en: '`ALTER TABLE ... ALTER COLUMN ... SET NOT NULL` with no `CHECK` constraint present'
  explanation:
    en: With `NOT VALID`, the scan that verifies existing rows is skipped. Without it, `ADD table_constraint` normally
      scans the table to verify all existing rows. `NOT VALID` is currently only allowed for foreign-key, `CHECK`
      and not-null constraints, so it is not allowed for a primary key. `SET NOT NULL` is ordinarily checked by
      scanning the entire table unless a valid `CHECK` constraint proves no `NULL` can exist.
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: if the NOT VALID option is used, this potentially-lengthy scan is skipped
- id: m06-l04-q25
  prompt:
    en: In PostgreSQL 18, which `ALTER TABLE` operation requires a full table scan to verify that the columns contain
      no nulls?
  options:
  - id: a
    text:
      en: '`ADD UNIQUE USING INDEX` on an existing unique index'
  - id: b
    text:
      en: '`ADD FOREIGN KEY ... NOT VALID`'
  - id: c
    correct: true
    text:
      en: '`ADD PRIMARY KEY USING INDEX` on columns not yet marked `NOT NULL`'
  - id: d
    text:
      en: '`SET NOT NULL` when a valid `CHECK` constraint proves no `NULL` exists'
  explanation:
    en: If the index's columns are not already marked `NOT NULL`, `ADD PRIMARY KEY USING INDEX` attempts `SET NOT
      NULL` on each, which requires a full table scan. In all other cases, including a `UNIQUE` constraint, the
      operation is fast. `NOT VALID` skips the scan of existing rows. A valid `CHECK` constraint that proves no
      `NULL` can exist lets the table scan be skipped.
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: That requires a full table scan to verify the column(s) contain no nulls.
- id: m06-l04-q27
  prompt:
    en: In PostgreSQL 18, a column has no null values and `SET NOT NULL` is run on it. Which statement is correct?
  options:
  - id: a
    correct: true
    text:
      en: A valid `CHECK` constraint that proves no `NULL` can exist lets it skip the table scan
  - id: b
    text:
      en: It never scans the table, since it trusts the application
  - id: c
    text:
      en: It succeeds on a column holding nulls and replaces them with the default
  - id: d
    text:
      en: A column with an invalid not-null constraint stays unvalidated afterwards
  explanation:
    en: If a valid `CHECK` constraint exists which proves no `NULL` can exist, the table scan is skipped. Otherwise
      the table is ordinarily scanned. `SET NOT NULL` may only be applied when none of the records contain a `NULL`,
      so nulls are not replaced. If a column has an invalid not-null constraint, `SET NOT NULL` validates it.
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: if a valid CHECK constraint exists (and is not dropped in the same command) which proves no NULL can exist,
      then the table scan is skipped
- id: m06-l04-q28
  prompt:
    en: In PostgreSQL 18, a partitioned table has a column marked `NOT NULL`. Which statement about its partitions
      is correct?
  options:
  - id: a
    correct: true
    text:
      en: '`DROP NOT NULL` cannot be performed on that column of a single partition'
  - id: b
    text:
      en: A partition cannot be marked `NOT NULL` unless its parent is too
  - id: c
    text:
      en: '`DROP NOT NULL` on the parent keeps the constraint on every partition'
  - id: d
    text:
      en: '`DROP NOT NULL ... ONLY` on the parent also removes it from the children'
  explanation:
    en: If a column is marked `NOT NULL` in the parent table, one cannot perform `DROP NOT NULL` on it in a partition.
      A partition can be marked `NOT NULL` even where the parent allows nulls, so it does not depend on the parent.
      Performing `DROP NOT NULL` on the parent drops the constraint from all the partitions. Dropping it from `ONLY`
      the parent does not remove it from the children.
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: If this table is a partition, one cannot perform DROP NOT NULL on a column if it is marked NOT NULL in the
      parent table.
- id: m06-l04-q29
  prompt:
    en: In PostgreSQL 18, a `CHECK` constraint was added with `NOT VALID` and has not been validated. Which statement
      is correct?
  options:
  - id: a
    text:
      en: The database assumes it holds for all rows already in the table
  - id: b
    text:
      en: Adding it scanned the table to verify the existing rows
  - id: c
    correct: true
    text:
      en: New inserts and updates are still checked against it
  - id: d
    text:
      en: A `UNIQUE` constraint can be added with the same `NOT VALID` option
  explanation:
    en: The constraint is still applied against subsequent inserts or updates. The database does not assume it holds
      for all rows until it is validated with `VALIDATE CONSTRAINT`. The `NOT VALID` option skips the scan of existing
      rows. It is currently only allowed for foreign-key, `CHECK` and not-null constraints, which leaves out `UNIQUE`.
  citation: pg-sql-altertable#id-1.9.3.35.5
  extract:
    en: The constraint will still be applied against subsequent inserts or updates
