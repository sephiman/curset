- id: m02-l07-q310
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la tecla Flecha derecha con una carpeta contraída seleccionada en el panel de navegación?"
  options:
  - id: a
    text:
      es: "Contrae la selección actual si está expandida o selecciona la carpeta que la contenía"
  - id: b
    text:
      es: "Expande todas las carpetas del árbol del panel de navegación"
  - id: c
    correct: true
    text:
      es: "Muestra su contenido o selecciona la primera subcarpeta"
  - id: d
    text:
      es: "Va a la carpeta siguiente del historial de navegación"
