# anchor: boe-a-2015-11719-art-49
- id: q13
  lesson: m04-l05
  prompt:
    es: "¿Cuántas semanas dura el permiso por nacimiento de Doña Lucía Garrido, teniendo en cuenta la hospitalización de su hijo recién nacido tras el parto?"
  options:
  - id: a
    text:
      es: "Diecinueve semanas, porque la hospitalización del neonato no amplía el permiso."
  - id: b
    correct: true
    text:
      es: "Veintidós semanas: las diecinueve del permiso más los veintiún días de hospitalización."
  - id: c
    text:
      es: "Veinte semanas: las diecinueve del permiso más una por la hospitalización del neonato."
  - id: d
    text:
      es: "Treinta y dos semanas, por ser la madre biológica de un recién nacido hospitalizado."
  explanation:
    es: "El permiso por nacimiento de la madre biológica dura diecinueve semanas y, si el neonato debe permanecer hospitalizado tras el parto, se amplía en tantos días como dure la hospitalización, con un máximo de trece semanas adicionales. Son 19 × 7 = 133 días más 21 días, 154 días, es decir, 22 semanas. La opción de diecinueve semanas niega la ampliación. La de veinte semanas la cuenta como una semana, no como veintiún días. La de treinta y dos semanas es la del permiso en la monoparentalidad, y aquí hay otro progenitor."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
