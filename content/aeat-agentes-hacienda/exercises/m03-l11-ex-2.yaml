# anchor: boe-a-2003-23186-art-62
- id: m03-l11-q0018
  prompt:
    es: "A Hermanos Valverde, S.L. se le notifica la providencia de apremio el martes 15 de septiembre de 2026. Suponga que no hay ningún día festivo en el cómputo y que son hábiles los días de lunes a viernes. Conforme al artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué día puede pagar la deuda?"
  options:
  - id: a
    text:
      es: "Hasta el domingo 20 de septiembre de 2026."
  - id: b
    text:
      es: "Hasta el lunes 5 de octubre de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el lunes 21 de septiembre de 2026."
  - id: d
    text:
      es: "Hasta el viernes 18 de septiembre de 2026."
  explanation:
    es: "El día 15 está entre el uno y el 15, así que se aplica la letra a): hasta el día 20 del mismo mes. El 20 de septiembre de 2026 es domingo, no hábil, y el plazo se prolonga hasta el inmediato hábil siguiente: el lunes 21. Mantener el domingo ignora la regla del día inhábil. El cinco de octubre sería el plazo de una notificación posterior al día 15. Y el viernes 18 no es el límite que fija el artículo."
  citation: "art. 62.5.a LGT"
  difficulty: 3
  tags:
  - "plazos de pago"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2003-23186-art-62
- id: m03-l11-q0019
  prompt:
    es: "A Talleres Ibáñez, S.L. se le notifica la providencia de apremio el lunes 31 de agosto de 2026. Suponga que no hay ningún día festivo en el cómputo y que son hábiles los días de lunes a viernes. Conforme al artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué día puede pagar la deuda?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes 7 de septiembre de 2026."
  - id: b
    text:
      es: "Hasta el sábado 5 de septiembre de 2026."
  - id: c
    text:
      es: "Hasta el lunes 21 de septiembre de 2026."
  - id: d
    text:
      es: "Hasta el miércoles 30 de septiembre de 2026."
  explanation:
    es: "El 31 es el último día del mes, así que se aplica la letra b): hasta el día cinco del mes siguiente. El cinco de septiembre de 2026 es sábado y no es hábil, de modo que el plazo llega hasta el inmediato hábil siguiente, el lunes 7. El sábado no vale por ser inhábil. El 21 de septiembre de 2026 es el plazo de una notificación de los días uno a 15 de septiembre, no de una del 31 de agosto. Y el 30 de septiembre no es límite en ninguna de las dos letras."
  citation: "art. 62.5.b LGT"
  difficulty: 3
  tags:
  - "plazos de pago"
  - "cómputo"
  - "supuesto"
# anchor: boe-a-2015-10565-art-30
- id: m03-l11-q0021
  prompt:
    es: "Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, aplicable de forma supletoria a los plazos tributarios señalados por días, ¿qué días se excluyen del cómputo?"
  options:
  - id: a
    text:
      es: "Solo los domingos y los declarados festivos."
  - id: b
    text:
      es: "Solo los declarados festivos, y se cuentan los sábados y los domingos."
  - id: c
    correct: true
    text:
      es: "Los sábados, los domingos y los declarados festivos."
  - id: d
    text:
      es: "Los domingos, los declarados festivos y los días 24 y 31 de diciembre."
  explanation:
    es: "Los plazos por días se cuentan en días hábiles, y se excluyen sábados, domingos y festivos. Cuando el plazo acaba un sábado, por tanto, se pasa al lunes hábil. Excluir solo domingos y festivos cuenta los sábados como hábiles, y lo mismo ocurre si solo se excluyen los festivos. El 24 y el 31 de diciembre no figuran como días inhábiles en el artículo."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "cómputo de plazos"
  - "días hábiles"
# anchor: boe-a-2003-23186-art-62
- id: m03-l11-q0123
  prompt:
    es: "¿Desde qué momento se cuenta el plazo para pagar la deuda apremiada que establece el artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una vez iniciado el período ejecutivo y notificada la providencia de apremio?"
  options:
  - id: a
    text:
      es: "Desde la fecha de emisión de la providencia de apremio."
  - id: b
    text:
      es: "Desde el día siguiente al del vencimiento del plazo de pago en período voluntario."
  - id: c
    text:
      es: "Desde la fecha en que se practique la diligencia de embargo."
  - id: d
    correct: true
    text:
      es: "Desde la fecha de recepción de la notificación de la providencia."
  explanation:
    es: "El plazo corre desde la fecha de recepción de la notificación de la providencia, no desde su emisión. Tampoco desde el fin del plazo voluntario, que marca el inicio del período ejecutivo, ni desde el embargo, que llega cuando el plazo ya ha vencido sin pago."
  citation: "art. 62.5 LGT"
  difficulty: 2
  tags:
  - "plazos de pago"
  - "providencia de apremio"
# anchor: boe-a-2003-23186-art-62
- id: m03-l11-q0128
  prompt:
    es: "De acuerdo con el artículo 62.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el pago de la deuda una vez iniciado el período ejecutivo y notificada la providencia de apremio:"
  options:
  - id: a
    text:
      es: "Si la providencia se notifica el día 16, el plazo llega hasta el día 20 del mismo mes; si se notifica el día 15, hasta el día cinco del mes siguiente."
  - id: b
    correct: true
    text:
      es: "Si la providencia se notifica el día 16, el plazo llega hasta el día cinco del mes siguiente; si se notifica el día 15, hasta el día 20 del mismo mes."
  - id: c
    text:
      es: "Si la providencia se notifica el día 16, el plazo llega hasta el día 20 del mes siguiente; si se notifica el día 15, hasta el día 20 del mismo mes."
  - id: d
    text:
      es: "Si la providencia se notifica el día 16, el plazo llega hasta el día cinco del mes siguiente; si se notifica el día 15, hasta el día cinco del mismo mes."
  explanation:
    es: "El corte está entre los días 15 y 16: las notificaciones del uno al 15 pagan hasta el día 20 del mismo mes, y las del 16 al último, hasta el día cinco del mes siguiente. Las demás combinaciones invierten los plazos o inventan un día 20 del mes siguiente o un día cinco del mismo mes que el artículo no recoge."
  citation: "art. 62.5 LGT"
  difficulty: 3
  tags:
  - "plazos de pago"
  - "providencia de apremio"
# anchor: boe-a-2003-23186-art-77
- id: m03-l11-q0023
  prompt:
    es: "Según el artículo 77.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a qué normativa quedan sometidos los créditos tributarios en el proceso concursal?"
  options:
  - id: a
    text:
      es: "A lo establecido en la Ley General Presupuestaria, con preferencia sobre cualquier otra."
  - id: b
    correct: true
    text:
      es: "A lo establecido en la normativa concursal."
  - id: c
    text:
      es: "A las reglas de prelación del artículo 77.1 de la propia Ley General Tributaria."
  - id: d
    text:
      es: "A lo que acuerde el órgano de recaudación en cada caso con el administrador concursal."
  explanation:
    es: "En el proceso concursal los créditos tributarios quedan sometidos a la normativa concursal. La Ley General Presupuestaria aparece en el artículo 164.2 como complemento, en su caso, y no desplaza la normativa concursal. Las reglas del 77.1 rigen fuera del concurso. Y ningún acuerdo de la recaudación con el administrador sustituye a la norma."
  citation: "art. 77.2 LGT"
  difficulty: 1
  tags:
  - "prelación"
  - "concurso"
# anchor: boe-a-2005-14803-art-64
- id: m03-l11-q0024
  prompt:
    es: "Según el artículo 64.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando existan anotaciones de embargo practicadas con anterioridad a la del crédito de la Hacienda pública sobre unos mismos bienes, el órgano de recaudación podrá elevar el expediente al órgano competente para acordar, si procede:"
  options:
  - id: a
    correct: true
    text:
      es: "El ejercicio de la acción de tercería de mejor derecho, previo informe del órgano con funciones de asesoramiento jurídico."
  - id: b
    text:
      es: "El ejercicio de la acción de tercería de dominio, previo informe del órgano con funciones de asesoramiento jurídico."
  - id: c
    text:
      es: "El levantamiento de la anotación de embargo anterior, previo informe del Registro de la Propiedad o del Registro de Bienes Muebles competente."
  - id: d
    text:
      es: "La ejecución inmediata de los bienes embargados, previa audiencia de los titulares de las anotaciones anteriores."
  explanation:
    es: "El reglamento prevé la tercería de mejor derecho, que defiende el crédito de la Hacienda frente a acreedores con anotaciones anteriores, y exige el informe del órgano de asesoramiento jurídico. La tercería de dominio discute la titularidad de los bienes y no es la acción de este precepto. La Administración no puede levantar por sí misma una anotación ajena, ni ejecutar los bienes sin más."
  citation: "art. 64.1 RGR"
  difficulty: 2
  tags:
  - "prelación"
  - "tercería de mejor derecho"
# anchor: boe-a-2003-23186-art-78
- id: m03-l11-q0025
  prompt:
    es: "De acuerdo con el artículo 78 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los tributos que graven periódicamente los bienes o derechos inscribibles en un registro público, la preferencia sobre cualquier otro acreedor o adquirente alcanza a las deudas devengadas y no satisfechas correspondientes:"
  options:
  - id: a
    text:
      es: "Al año natural en que se exija el pago y a los cuatro anteriores."
  - id: b
    text:
      es: "Solo al año natural en que se exija el pago."
  - id: c
    correct: true
    text:
      es: "Al año natural en que se exija el pago y al inmediato anterior."
  - id: d
    text:
      es: "Al año natural en que se exija el pago y al inmediato posterior."
  explanation:
    es: "La hipoteca legal tácita cubre el año natural en que se exige el pago y el inmediato anterior. Ampliarla a cuatro años anteriores confunde esta garantía con el plazo de prescripción. Limitarla al año en curso deja fuera el año anterior que sí incluye el artículo. Y un año posterior no puede estar devengado cuando se exige el pago."
  citation: "art. 78 LGT"
  difficulty: 1
  tags:
  - "hipoteca legal tácita"
  - "garantías"
# anchor: boe-a-2003-23186-art-78
- id: m03-l11-q0026
  prompt:
    es: "¿Cuál de los siguientes sujetos tiene, conforme al artículo 78 de la Ley 58/2003, de 17 de diciembre, General Tributaria, preferencia sobre cualquier otro acreedor o adquirente, aunque hayan inscrito sus derechos, en los tributos que gravan periódicamente bienes inscribibles?"
  options:
  - id: a
    text:
      es: "Solo el Estado, y las comunidades autónomas y las entidades locales ceden ante los acreedores inscritos."
  - id: b
    correct: true
    text:
      es: "El Estado, las comunidades autónomas y las entidades locales, en los tributos que gravan periódicamente esos bienes."
  - id: c
    text:
      es: "Cualquier acreedor hipotecario cuyo derecho conste inscrito en el registro público correspondiente."
  - id: d
    text:
      es: "El adquirente de buena fe que haya inscrito su derecho antes de que se exija el pago."
  explanation:
    es: "El artículo 78 da la preferencia al Estado, a las comunidades autónomas y a las entidades locales, aunque los demás acreedores o adquirentes hayan inscrito sus derechos. No se limita al Estado. Y el acreedor hipotecario inscrito o el adquirente de buena fe, que invoca otra garantía, no tienen esa preferencia frente a esta hipoteca legal tácita."
  citation: "art. 78 LGT"
  difficulty: 1
  tags:
  - "hipoteca legal tácita"
  - "garantías"
# anchor: boe-a-2005-14803-art-65
- id: m03-l11-q0027
  prompt:
    es: "A efectos de la hipoteca legal tácita, el artículo 65.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación entiende que se exige el pago:"
  options:
  - id: a
    text:
      es: "Cuando se notifica la providencia de apremio de los débitos del ejercicio en que se inscribió el derecho o se transmitieron los bienes."
  - id: b
    correct: true
    text:
      es: "Cuando se inicia el procedimiento de recaudación en período voluntario de los débitos del ejercicio en que se inscribió el derecho o se transmitieron los bienes."
  - id: c
    text:
      es: "Cuando se practica la diligencia de embargo sobre los bienes inscribibles de los débitos del ejercicio de la transmisión."
  - id: d
    text:
      es: "Cuando finaliza el plazo de ingreso en período voluntario de los débitos del ejercicio en que se inscribió el derecho."
  explanation:
    es: "Se entiende que se exige el pago cuando se inicia la recaudación en período voluntario de los débitos del ejercicio en que se inscribió el derecho o se hizo la transmisión. No hay que esperar a la providencia, al embargo ni al fin del plazo voluntario: el momento es el inicio de la recaudación voluntaria."
  citation: "art. 65.1 RGR"
  difficulty: 2
  tags:
  - "hipoteca legal tácita"
  - "garantías"
# anchor: boe-a-2003-23186-art-79
- id: m03-l11-q0028
  prompt:
    es: "De acuerdo con el artículo 79.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los adquirentes de bienes afectos por ley al pago de la deuda tributaria:"
  options:
  - id: a
    text:
      es: "Responden solidariamente con todo su patrimonio, desde el momento de la adquisición de los bienes afectos."
  - id: b
    text:
      es: "Responden subsidiariamente con todo su patrimonio, si la deuda no se paga por el transmitente."
  - id: c
    text:
      es: "No responden de la deuda, porque la afección solo permite embargar los bienes al transmitente."
  - id: d
    correct: true
    text:
      es: "Responden subsidiariamente con ellos, por derivación de la acción tributaria, si la deuda no se paga."
  explanation:
    es: "Los adquirentes responden subsidiariamente con los bienes afectos, por derivación de la acción tributaria, si la deuda no se paga. La responsabilidad es subsidiaria, no solidaria, y se limita a los bienes afectos, no a todo el patrimonio. Tampoco es cierto que los adquirentes queden fuera: la afección sigue al bien."
  citation: "art. 79.1 LGT"
  difficulty: 1
  tags:
  - "afección de bienes"
  - "responsabilidad"
# anchor: boe-a-2003-23186-art-79
- id: m03-l11-q0029
  prompt:
    es: "Según el artículo 79.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los bienes y derechos transmitidos quedan afectos a la responsabilidad del pago de los tributos que graven tales transmisiones, cualquiera que sea su poseedor, salvo que este sea:"
  options:
  - id: a
    correct: true
    text:
      es: "Un tercero protegido por la fe pública registral."
  - id: b
    text:
      es: "Un tercero que haya adquirido los bienes a título gratuito."
  - id: c
    text:
      es: "Un tercero que desconociera la existencia de la deuda tributaria."
  - id: d
    text:
      es: "Un tercero que haya pagado un precio superior al valor de los bienes."
  explanation:
    es: "La excepción del artículo 79.2 protege al tercero amparado por la fe pública registral, o a quien justifica adquirir con buena fe y justo título en establecimiento mercantil o industrial bienes muebles no inscribibles. Adquirir gratis, ignorar la deuda o pagar mucho no bastan por sí solos: no son los requisitos que fija el artículo."
  citation: "art. 79.2 LGT"
  difficulty: 2
  tags:
  - "afección de bienes"
  - "garantías"
# anchor: boe-a-2003-23186-art-79
- id: m03-l11-q0030
  prompt:
    es: "¿En qué caso de bienes muebles no inscribibles deja de operar la afección del artículo 79.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria si se justifica la adquisición con buena fe y justo título?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la adquisición se hizo en un establecimiento mercantil o industrial."
  - id: b
    text:
      es: "Cuando la adquisición se hizo en una subasta pública o en un mercadillo ocasional."
  - id: c
    text:
      es: "Cuando la adquisición se hizo entre particulares, mediante documento privado fechado."
  - id: d
    text:
      es: "Cuando la adquisición se hizo en el domicilio fiscal del transmitente de los bienes."
  explanation:
    es: "Para bienes muebles no inscribibles, el artículo 79.2 exige que la adquisición, con buena fe y justo título, se haya hecho en un establecimiento mercantil o industrial. La subasta pública, la venta entre particulares y la compra en el domicilio del transmitente no figuran como supuestos del artículo."
  citation: "art. 79.2 LGT"
  difficulty: 1
  tags:
  - "afección de bienes"
  - "garantías"
# anchor: boe-a-2003-23186-art-79
- id: m03-l11-q0031
  prompt:
    es: "Según el artículo 79.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la ley concede un beneficio fiscal cuya efectividad depende de un requisito posterior, ¿cómo se hace constar el importe de la liquidación que habría debido girarse sin el beneficio?"
  options:
  - id: a
    text:
      es: "Por anotación preventiva de embargo que practica el órgano de recaudación en el registro."
  - id: b
    text:
      es: "Por inscripción de una hipoteca legal tácita a favor de la Hacienda Pública estatal."
  - id: c
    correct: true
    text:
      es: "Por nota marginal de afección que hacen constar los titulares de los registros públicos correspondientes."
  - id: d
    text:
      es: "Por diligencia de embargo preventivo notificada al obligado tributario beneficiario."
  explanation:
    es: "La Administración hace figurar el importe total de la liquidación que se habría girado sin el beneficio, y los registros públicos lo hacen constar por nota marginal de afección. No es una anotación de embargo, ni una hipoteca legal tácita, que es otra garantía y afecta a otros tributos, ni un embargo preventivo."
  citation: "art. 79.3 LGT"
  difficulty: 2
  tags:
  - "afección de bienes"
  - "garantías"
# anchor: boe-a-2005-14803-art-67
- id: m03-l11-q0032
  prompt:
    es: "De acuerdo con el artículo 67.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, para el ejercicio del derecho de afección se requerirá:"
  options:
  - id: a
    text:
      es: "La declaración de responsabilidad solidaria en los términos de los artículos 174 y 176 de la propia Ley General Tributaria."
  - id: b
    text:
      es: "La previa providencia de apremio dictada contra el adquirente de los bienes afectos."
  - id: c
    correct: true
    text:
      es: "La declaración de responsabilidad subsidiaria en los términos de los artículos 174 y 176 de la Ley General Tributaria."
  - id: d
    text:
      es: "La previa autorización judicial para embargar los bienes afectos en poder del adquirente."
  explanation:
    es: "El reglamento exige la declaración de responsabilidad subsidiaria, en los términos de los artículos 174 y 176 de la Ley General Tributaria. No basta la solidaria, que es otra figura. Tampoco se exige providencia previa contra el adquirente ni autorización judicial: el requisito es la declaración de responsabilidad."
  citation: "art. 67.1 RGR"
  difficulty: 2
  tags:
  - "afección de bienes"
  - "responsabilidad"
# anchor: boe-a-2003-23186-art-80
- id: m03-l11-q0033
  prompt:
    es: "Conforme al artículo 80 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria tiene derecho de retención frente a todos sobre las mercancías declaradas en las aduanas para el pago de la deuda aduanera y fiscal, si:"
  options:
  - id: a
    text:
      es: "El obligado tributario no ha presentado la declaración aduanera en plazo."
  - id: b
    text:
      es: "El valor de las mercancías es superior al de los derechos liquidados."
  - id: c
    correct: true
    text:
      es: "No se garantiza de forma suficiente el pago de la deuda."
  - id: d
    text:
      es: "La deuda aduanera ha sido recurrida y el recurso está pendiente de resolución."
  explanation:
    es: "La retención procede por el importe de los derechos e impuestos liquidados, de no garantizarse de forma suficiente el pago. El artículo no la condiciona a una declaración fuera de plazo, al valor de las mercancías ni a que haya un recurso pendiente."
  citation: "art. 80 LGT"
  difficulty: 1
  tags:
  - "derecho de retención"
  - "garantías"
# anchor: boe-a-2005-14803-art-67
- id: m03-l11-q0034
  prompt:
    es: "Según el artículo 67.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿por quién se ejerce el derecho de retención sobre las mercancías?"
  options:
  - id: a
    text:
      es: "Por los órganos de recaudación de la delegación en cuyo territorio se encuentre el obligado."
  - id: b
    text:
      es: "Por el órgano que haya dictado la liquidación de los derechos e impuestos."
  - id: c
    text:
      es: "Por el órgano judicial competente, a instancia de la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Por los órganos a los que se hayan presentado o entregado las mercancías."
  explanation:
    es: "El derecho de retención lo ejercen los órganos a los que se hayan presentado o entregado las mercancías. No corresponde a la delegación del obligado ni al órgano liquidador por esa condición, y tampoco hace falta intervención judicial: es un derecho de la propia Administración."
  citation: "art. 67.2 RGR"
  difficulty: 1
  tags:
  - "derecho de retención"
  - "órgano"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0035
  prompt:
    es: "De acuerdo con el artículo 81.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria podrá adoptar medidas cautelares de carácter provisional para asegurar el cobro de las deudas cuando existan:"
  options:
  - id: a
    text:
      es: "Pruebas concluyentes de que el obligado tributario va a ocultar o enajenar sus bienes."
  - id: b
    text:
      es: "Indicios de que el obligado tributario ha incumplido el plazo de pago de una deuda anterior."
  - id: c
    text:
      es: "Indicios racionales de que el obligado tributario ha cometido una infracción tributaria grave en el ejercicio anterior."
  - id: d
    correct: true
    text:
      es: "Indicios racionales de que, en otro caso, dicho cobro se vería frustrado o gravemente dificultado."
  explanation:
    es: "El presupuesto del artículo 81.1 son indicios racionales de que el cobro se vería frustrado o gravemente dificultado. No se exigen pruebas concluyentes, que sería un estándar mayor. Un impago anterior o una infracción grave no son el presupuesto del precepto."
  citation: "art. 81.1 LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "garantías"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0036
  prompt:
    es: "Conforme al artículo 81.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la notificación de la medida cautelar:"
  options:
  - id: a
    text:
      es: "Debe notificarse al afectado con posterioridad, una vez resuelta la audiencia previa a la medida."
  - id: b
    correct: true
    text:
      es: "Debe notificarse al afectado con expresa mención de los motivos que justifican su aplicación."
  - id: c
    text:
      es: "Debe notificarse al afectado con mención de la cuantía, sin necesidad de expresar los motivos."
  - id: d
    text:
      es: "Debe notificarse solo cuando el afectado la solicite y acredite un interés legítimo."
  explanation:
    es: "La medida cautelar se notifica al afectado con expresa mención de los motivos que justifican su aplicación. El artículo no prevé una audiencia previa que retrase la notificación. Tampoco permite omitir los motivos ni limitar la notificación a quien lo solicite."
  citation: "art. 81.1 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "notificación"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0037
  prompt:
    es: "Según el artículo 81.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las medidas cautelares habrán de ser proporcionadas al daño que se pretenda evitar y:"
  options:
  - id: a
    text:
      es: "Adoptarse sobre bienes cuyo valor no supere en ningún caso el de la deuda."
  - id: b
    text:
      es: "Adoptarse en la cuantía que determine la Administración, sin otro límite que la deuda total."
  - id: c
    correct: true
    text:
      es: "Adoptarse en la cuantía estrictamente necesaria para asegurar el cobro de la deuda."
  - id: d
    text:
      es: "Adoptarse sobre el patrimonio del obligado en la cuantía de la deuda más los recargos del período ejecutivo."
  explanation:
    es: "Las medidas han de ser proporcionadas al daño y adoptarse en la cuantía estrictamente necesaria para asegurar el cobro. El artículo no impone un tope rígido de valor de los bienes, ni deja a la Administración sin límite, ni calcula la cuantía sumando recargos que todavía no se han devengado."
  citation: "art. 81.3 LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "proporcionalidad"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0038
  prompt:
    es: "De acuerdo con el artículo 81.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en relación con las medidas cautelares que puede adoptar la Administración tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Se podrán adoptar las que produzcan un perjuicio de difícil reparación si la deuda es de elevada cuantía."
  - id: b
    text:
      es: "Se adoptarán sin límite alguno mientras exista un riesgo de impago de la deuda tributaria."
  - id: c
    correct: true
    text:
      es: "En ningún caso se adoptarán las que puedan producir un perjuicio de difícil o imposible reparación."
  - id: d
    text:
      es: "Solo se podrán adoptar las que consistan en la retención del pago de devoluciones tributarias."
  explanation:
    es: "El artículo 81.3 prohíbe, en ningún caso, las medidas que puedan producir un perjuicio de difícil o imposible reparación. No admite excepciones por la cuantía de la deuda ni deja las medidas sin límite. Y el artículo 81.4 recoge más medidas que la retención de devoluciones."
  citation: "art. 81.3 LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "proporcionalidad"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0039
  prompt:
    es: "¿Cuál de las siguientes medidas puede adoptar la Administración tributaria como medida cautelar según el artículo 81.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La declaración de fallido del obligado tributario y de sus responsables."
  - id: b
    text:
      es: "La suspensión de la ejecutividad de la liquidación recurrida por el obligado."
  - id: c
    text:
      es: "La imposición de una sanción provisional en cuantía equivalente a la deuda."
  - id: d
    correct: true
    text:
      es: "La prohibición de enajenar, gravar o disponer de bienes o derechos."
  explanation:
    es: "La prohibición de enajenar, gravar o disponer de bienes o derechos está en el artículo 81.4.c. La declaración de fallido pertenece a la fase de cobro de créditos incobrables, no a las cautelares. La suspensión es una medida a favor del recurrente, y no una medida para asegurar el cobro. Y las cautelares del artículo 81.4 no son sanciones."
  citation: "art. 81.4.c LGT"
  difficulty: 2
  tags:
  - "medidas cautelares"
  - "tipos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0040
  prompt:
    es: "De acuerdo con el artículo 81.4.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, una de las medidas cautelares es el embargo preventivo de bienes y derechos, del que se practicará, en su caso:"
  options:
  - id: a
    correct: true
    text:
      es: "Anotación preventiva."
  - id: b
    text:
      es: "Inscripción definitiva de la hipoteca legal."
  - id: c
    text:
      es: "Nota marginal de afección."
  - id: d
    text:
      es: "Anotación de la tercería de mejor derecho."
  explanation:
    es: "Del embargo preventivo se practica, en su caso, anotación preventiva. La nota marginal de afección se vincula a los beneficios fiscales condicionados del artículo 79.3. La hipoteca legal tácita no necesita una inscripción de esta medida, y la anotación de tercería no es un efecto del embargo preventivo."
  citation: "art. 81.4.b LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "tipos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0041
  prompt:
    es: "Según el artículo 81.4.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las medidas cautelares figura la retención del pago de devoluciones tributarias o de otros pagos que deba realizar:"
  options:
  - id: a
    correct: true
    text:
      es: "La propia Administración tributaria."
  - id: b
    text:
      es: "El Registro de la Propiedad en el que consten los bienes del obligado."
  - id: c
    text:
      es: "El órgano judicial que conozca del procedimiento concursal del obligado."
  - id: d
    text:
      es: "La entidad de crédito donde el obligado tenga abiertas sus cuentas."
  explanation:
    es: "La medida consiste en retener devoluciones tributarias u otros pagos que deba realizar la propia Administración tributaria al obligado. No es una retención de los pagos de un registro, de un juzgado o de un banco."
  citation: "art. 81.4.a LGT"
  difficulty: 1
  tags:
  - "medidas cautelares"
  - "tipos"
# anchor: boe-a-2003-23186-art-81
- id: m03-l11-q0042
  prompt:
    es: "De acuerdo con el artículo 81.4.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las medidas cautelares que puede adoptar la Administración tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "La retención de la totalidad de los pagos que cualquier cliente del obligado tributario le deba efectuar."
  - id: b
    text:
      es: "La retención de un porcentaje de las retribuciones de los trabajadores del obligado tributario deudor."
  - id: c
    correct: true
    text:
      es: "La retención de un porcentaje de los pagos de las empresas que subcontraten obras o servicios de su actividad principal a los contratistas."
  - id: d
    text:
      es: "La retención de las cuotas de IVA soportado por el obligado hasta que satisfaga la deuda."
  explanation:
    es: "La medida del artículo 81.4.d es la retención de un porcentaje de los pagos que las empresas que contratan o subcontratan obras o servicios de su actividad principal hacen a contratistas o subcontratistas. No alcanza a la totalidad de los pagos de cualquier cliente, ni a retribuciones de trabajadores, ni a las cuotas de IVA soportado."
  citation: "art. 81.4.d LGT"
  difficulty: 3
  tags:
  - "medidas cautelares"
  - "tipos"
