# anchor: boe-a-2015-11719-da-decimoseptima
- id: m04-l03-q026
  prompt:
    es: "¿Qué compensación da el texto refundido de la Ley del Estatuto Básico del Empleado Público al funcionario interino afectado por el incumplimiento del plazo máximo de permanencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Veinte días de sus retribuciones fijas por año de servicio, hasta un máximo de doce mensualidades"
  - id: b
    text:
      es: "Treinta y tres días de sus retribuciones fijas por año de servicio, hasta veinticuatro mensualidades"
  - id: c
    text:
      es: "Veinte días de sus retribuciones totales por año de servicio, sin límite de mensualidades"
  - id: d
    text:
      es: "Doce días de sus retribuciones fijas por año de servicio, hasta un máximo de seis mensualidades"
  explanation:
    es: "El apartado 4 fija una compensación «equivalente a veinte días de sus retribuciones fijas por año de servicio, prorrateándose por meses los períodos de tiempo inferiores a un año, hasta un máximo de doce mensualidades». Los treinta y tres días con tope de veinticuatro mensualidades, los doce días con tope de seis y las retribuciones totales sin tope no son las cifras de la disposición: el cálculo se hace sobre las retribuciones fijas y tiene un límite de doce mensualidades."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m04-l03-q028
  prompt:
    es: "Un funcionario interino cesa tras dos años y seis meses en un nombramiento que incumplió el plazo máximo de permanencia. ¿Qué compensación le corresponde según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Cincuenta días de sus retribuciones fijas"
  - id: b
    text:
      es: "Cuarenta días de sus retribuciones fijas"
  - id: c
    text:
      es: "Sesenta días de sus retribuciones fijas"
  - id: d
    text:
      es: "Cuarenta y cinco días de sus retribuciones fijas"
  explanation:
    es: "La disposición adicional decimoséptima.4 da veinte días de retribuciones fijas por año de servicio y prorratea por meses los periodos inferiores a un año. Dos años dan cuarenta días. Los seis meses restantes son medio año: diez días más. El total es de cincuenta días. Cuarenta días resultan de ignorar el prorrateo de los seis meses. Sesenta días resultan de contar los seis meses como un año entero. Cuarenta y cinco días no salen de la regla de la disposición."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m04-l03-q029
  prompt:
    es: "¿Desde cuándo nace, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, el derecho del funcionario interino a la compensación por incumplimiento del plazo máximo de permanencia?"
  options:
  - id: a
    text:
      es: "A partir de la fecha en que se cumple el plazo máximo de permanencia"
  - id: b
    correct: true
    text:
      es: "A partir de la fecha del cese efectivo del funcionario interino"
  - id: c
    text:
      es: "A partir de la fecha de publicación de la convocatoria de la plaza"
  - id: d
    text:
      es: "A partir de la fecha de su nombramiento"
  explanation:
    es: "El apartado 4 dice que «el derecho a esta compensación nacerá a partir de la fecha del cese efectivo». No nace al cumplirse el plazo máximo de permanencia, ni al publicarse la convocatoria de la plaza, ni en la fecha del nombramiento."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m04-l03-q030
  prompt:
    es: "La cuantía de la compensación económica del personal funcionario interino por incumplimiento del plazo máximo de permanencia está referida:"
  options:
  - id: a
    text:
      es: "A la suma de todos los nombramientos encadenados en la misma Administración"
  - id: b
    text:
      es: "Al conjunto de servicios prestados como interino en cualquier Administración"
  - id: c
    text:
      es: "Al último año de servicios anterior a la fecha del cese efectivo"
  - id: d
    correct: true
    text:
      es: "Exclusivamente al nombramiento del que traiga causa el incumplimiento"
  explanation:
    es: "La disposición adicional decimoséptima.4 del texto refundido dice que «la cuantía estará referida exclusivamente al nombramiento del que traiga causa el incumplimiento». No suma los nombramientos encadenados en la misma Administración ni los servicios como interino en otras. Tampoco se limita al último año: se calcula por año de servicio de ese nombramiento."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q031
  prompt:
    es: "¿Qué edad mínima exige el texto refundido de la Ley del Estatuto Básico del Empleado Público para poder participar en los procesos selectivos?"
  options:
  - id: a
    text:
      es: "Tener cumplidos diecisiete años de edad"
  - id: b
    correct: true
    text:
      es: "Tener cumplidos dieciséis años de edad"
  - id: c
    text:
      es: "Tener cumplidos veintiún años de edad"
  - id: d
    text:
      es: "La que fije cada convocatoria, sin mínimo legal"
  explanation:
    es: "La letra c) del artículo 56.1 exige «tener cumplidos dieciséis años». Diecisiete años no es la cifra del artículo. Veintiún años es la edad que el artículo 57.2 usa para los descendientes, no la edad mínima de acceso. La edad mínima la fija la ley, no cada convocatoria."
  citation: "art. 56.1.c) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q032
  prompt:
    es: "Según el artículo 56.1.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, una edad máxima para el acceso al empleo público distinta de la edad de jubilación forzosa:"
  options:
  - id: a
    text:
      es: "Podrá fijarse en cada convocatoria según la naturaleza de las funciones"
  - id: b
    text:
      es: "Podrá fijarse por real decreto del Consejo de Ministros"
  - id: c
    correct: true
    text:
      es: "Solo podrá establecerse por ley"
  - id: d
    text:
      es: "No podrá establecerse en ningún caso para el acceso"
  explanation:
    es: "La letra c) del artículo 56.1 fija como límite general no exceder la edad máxima de jubilación forzosa y añade: «Sólo por ley podrá establecerse otra edad máxima, distinta de la edad de jubilación forzosa, para el acceso al empleo público». Ni la convocatoria ni un real decreto pueden fijarla. Tampoco está prohibida en todo caso: la ley puede establecerla."
  citation: "art. 56.1.c) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q033
  prompt:
    es: "Según el artículo 56.1.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, para participar en los procesos selectivos será necesario tener la nacionalidad española:"
  options:
  - id: a
    text:
      es: "Desde al menos cinco años antes de la publicación de la convocatoria"
  - id: b
    text:
      es: "O la de cualquier Estado con residencia legal en España, para cualquier empleo"
  - id: c
    text:
      es: "Salvo para los empleos que se cubran por el sistema de concurso-oposición"
  - id: d
    correct: true
    text:
      es: "Sin perjuicio de lo dispuesto sobre el acceso de nacionales de otros Estados"
  explanation:
    es: "La letra a) del artículo 56.1 exige «tener la nacionalidad española, sin perjuicio de lo dispuesto en el artículo siguiente», que regula el acceso de nacionales de otros Estados. El artículo no pide una antigüedad de cinco años en la nacionalidad. La residencia legal en España abre a los extranjeros el acceso como personal laboral (artículo 57.4), no a cualquier empleo. El sistema de concurso-oposición no exime del requisito."
  citation: "art. 56.1.a) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q034
  prompt:
    es: "¿Cuál de los siguientes es un requisito general para poder participar en los procesos selectivos según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Acreditar experiencia previa en el desempeño de tareas similares"
  - id: b
    text:
      es: "Estar inscrito como demandante de empleo en el servicio público de empleo"
  - id: c
    text:
      es: "Poseer un certificado de nivel avanzado en una lengua extranjera"
  - id: d
    correct: true
    text:
      es: "Poseer la capacidad funcional para el desempeño de las tareas"
  explanation:
    es: "La letra b) del artículo 56.1 exige «poseer la capacidad funcional para el desempeño de las tareas». Los demás requisitos generales son la nacionalidad, la edad, no haber sido separado ni estar inhabilitado y la titulación. La experiencia previa, la inscripción como demandante de empleo y un certificado de lengua extranjera no están en esa lista."
  citation: "art. 56.1.b) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q035
  prompt:
    es: "De acuerdo con el artículo 56.1.d) del texto refundido de la Ley del Estatuto Básico del Empleado Público, no puede participar en los procesos selectivos quien haya sido separado mediante expediente disciplinario del servicio de:"
  options:
  - id: a
    text:
      es: "La Administración Pública que convoca el proceso selectivo, pero no de otras Administraciones"
  - id: b
    text:
      es: "Cualquier Administración Pública, si la separación se produjo hace menos de cinco años"
  - id: c
    correct: true
    text:
      es: "Cualquiera de las Administraciones Públicas o de los órganos constitucionales o estatutarios de las comunidades autónomas"
  - id: d
    text:
      es: "Cualquiera de las Administraciones Públicas, pero no de los órganos constitucionales o estatutarios autonómicos"
  explanation:
    es: "La letra d) del artículo 56.1 exige «no haber sido separado mediante expediente disciplinario del servicio de cualquiera de las Administraciones Públicas o de los órganos constitucionales o estatutarios de las Comunidades Autónomas». No se limita a la Administración convocante. No fija un plazo de cinco años tras la separación. Y alcanza a los órganos constitucionales o estatutarios, que la opción de solo las Administraciones Públicas excluye."
  citation: "art. 56.1.d) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-56
- id: m04-l03-q036
  prompt:
    es: "Según el artículo 56.1.d) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué se exige al nacional de otro Estado para poder participar en los procesos selectivos?"
  options:
  - id: a
    text:
      es: "Acreditar cinco años de residencia legal en España antes de la publicación de la convocatoria"
  - id: b
    text:
      es: "Contar con una oferta de empleo previa de la Administración convocante"
  - id: c
    correct: true
    text:
      es: "No hallarse inhabilitado ni sancionado de forma que se le impida en su Estado el acceso al empleo público"
  - id: d
    text:
      es: "Haber prestado servicios en la función pública de su propio Estado durante al menos un año"
  explanation:
    es: "La letra d) del artículo 56.1 dice que el nacional de otro Estado no debe «hallarse inhabilitado o en situación equivalente ni haber sido sometido a sanción disciplinaria o equivalente que impida, en su Estado, en los mismos términos el acceso al empleo público». El artículo no exige cinco años de residencia legal, ni una oferta de empleo previa de la Administración convocante, ni servicios previos en la función pública de su Estado."
  citation: "art. 56.1.d) TREBEP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q037
  prompt:
    es: "¿Quién determina, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, las agrupaciones de funcionarios a las que no pueden acceder los nacionales de otros Estados?"
  options:
  - id: a
    text:
      es: "Las Cortes Generales, mediante ley orgánica de desarrollo del Estatuto"
  - id: b
    text:
      es: "Las instituciones de la Unión Europea, mediante reglamento"
  - id: c
    correct: true
    text:
      es: "Los órganos de gobierno de las Administraciones Públicas"
  - id: d
    text:
      es: "Los órganos de selección de cada proceso, en sus bases"
  explanation:
    es: "El segundo párrafo del artículo 57.1 dice que «los órganos de gobierno de las Administraciones Públicas determinarán las agrupaciones de funcionarios contempladas en el artículo 76 a las que no puedan acceder los nacionales de otros Estados». No lo hacen las Cortes Generales por ley orgánica, ni las instituciones de la Unión Europea, ni los órganos de selección, que aplican las bases y no las aprueban."
  citation: "art. 57.1 TREBEP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q038
  prompt:
    es: "Según el artículo 57.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los nacionales de los Estados miembros de la Unión Europea no pueden acceder como personal funcionario a los empleos públicos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Impliquen directa o indirectamente una participación en el ejercicio del poder público"
  - id: b
    text:
      es: "Exijan para el acceso un título universitario de Grado o superior"
  - id: c
    text:
      es: "Correspondan a cuerpos o escalas del Subgrupo A1 de clasificación profesional"
  - id: d
    text:
      es: "Se cubran por el sistema de concurso-oposición en el turno libre de acceso"
  explanation:
    es: "El artículo 57.1 les abre el acceso en igualdad de condiciones con los españoles, «con excepción de aquellos que directa o indirectamente impliquen una participación en el ejercicio del poder público» o en la salvaguardia de los intereses del Estado o de las Administraciones Públicas. El criterio es la función, no la titulación exigida, el subgrupo del cuerpo ni el sistema selectivo."
  citation: "art. 57.1 TREBEP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q039
  prompt:
    es: "Según el artículo 57.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el mismo régimen alcanza a los descendientes de españoles y de nacionales de la Unión, y a los de su cónyuge, que sean:"
  options:
  - id: a
    text:
      es: "Menores de dieciocho años o mayores de dicha edad dependientes"
  - id: b
    text:
      es: "Menores de veinticinco años que convivan con sus progenitores"
  - id: c
    text:
      es: "Menores de veintiún años, siempre que residan en España"
  - id: d
    correct: true
    text:
      es: "Menores de veintiún años o mayores de dicha edad dependientes"
  explanation:
    es: "El artículo 57.2 extiende el régimen a los descendientes del español o del nacional de otro Estado miembro y a los de su cónyuge, «siempre que no estén separados de derecho, sean menores de veintiún años o mayores de dicha edad dependientes». Dieciocho y veinticinco años no son la cifra del artículo. El artículo no exige que residan en España ni que convivan con sus progenitores."
  citation: "art. 57.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q040
  prompt:
    es: "Según el artículo 57.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿a qué cónyuges de españoles se aplica el régimen de acceso como personal funcionario previsto para los nacionales de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "A los de cualquier nacionalidad, siempre que no estén separados de derecho"
  - id: b
    text:
      es: "Solo a los que sean nacionales de un Estado miembro de la Unión Europea"
  - id: c
    text:
      es: "A los de cualquier nacionalidad, tras tres años de matrimonio inscrito"
  - id: d
    text:
      es: "A los de cualquier nacionalidad, siempre que residan legalmente en España"
  explanation:
    es: "El artículo 57.2 aplica esas previsiones, «cualquiera que sea su nacionalidad, al cónyuge de los españoles y de los nacionales de otros Estados miembros de la Unión Europea, siempre que no estén separados de derecho». No exige que el cónyuge sea nacional de la Unión, ni años de matrimonio, ni residencia legal en España: la única condición es no estar separados de derecho."
  citation: "art. 57.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q041
  prompt:
    es: "Según el artículo 57.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el acceso al empleo público como personal funcionario se extiende igualmente a las personas incluidas en el ámbito de aplicación de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Tratados Internacionales celebrados por la Unión Europea y ratificados por España en que rija la libre circulación de trabajadores"
  - id: b
    text:
      es: "Los convenios bilaterales de doble nacionalidad suscritos por España con países iberoamericanos y ratificados por las Cortes"
  - id: c
    text:
      es: "Los acuerdos de reconocimiento mutuo de títulos académicos y profesionales suscritos por el Estado español"
  - id: d
    text:
      es: "Los Tratados Internacionales ratificados por España en materia de protección internacional y asilo"
  explanation:
    es: "El artículo 57.3 extiende el acceso a las personas incluidas «en el ámbito de aplicación de los Tratados Internacionales celebrados por la Unión Europea y ratificados por España en los que sea de aplicación la libre circulación de trabajadores». Los convenios de doble nacionalidad, los acuerdos de reconocimiento de títulos y los tratados de protección internacional y asilo no son el supuesto del artículo: lo que cuenta es que el tratado aplique la libre circulación de trabajadores."
  citation: "art. 57.3 TREBEP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-57
- id: m04-l03-q042
  prompt:
    es: "¿Por qué norma puede eximirse del requisito de la nacionalidad para el acceso a la condición de personal funcionario según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Ley de las Cortes Generales o de las asambleas legislativas de las comunidades autónomas"
  - id: b
    text:
      es: "Real decreto del Consejo de Ministros, a propuesta del ministerio competente"
  - id: c
    text:
      es: "Las bases de la convocatoria, motivadas por la naturaleza de las funciones"
  - id: d
    text:
      es: "Ley de las Cortes Generales, sin que puedan hacerlo las comunidades autónomas"
  explanation:
    es: "El artículo 57.5 dice: «Sólo por ley de las Cortes Generales o de las asambleas legislativas de las comunidades autónomas podrá eximirse del requisito de la nacionalidad por razones de interés general». Un real decreto o las bases de una convocatoria no bastan. Las asambleas legislativas autonómicas sí pueden hacerlo, lo que descarta la opción que lo reserva a las Cortes Generales."
  citation: "art. 57.5 TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-61
- id: m04-l03-q043
  prompt:
    es: "Según el artículo 61.6 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los sistemas selectivos de funcionarios de carrera son los de oposición y concurso-oposición, y el sistema de concurso:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo puede aplicarse en virtud de ley y con carácter excepcional"
  - id: b
    text:
      es: "Puede aplicarse cuando lo prevea la convocatoria por la naturaleza de las funciones"
  - id: c
    text:
      es: "Puede aplicarse en la promoción interna sin necesidad de una ley"
  - id: d
    text:
      es: "No puede aplicarse en ningún caso a los funcionarios de carrera"
  explanation:
    es: "El artículo 61.6 dice: «Sólo en virtud de ley podrá aplicarse, con carácter excepcional, el sistema de concurso que consistirá únicamente en la valoración de méritos». En el texto refundido no basta con que lo prevea la convocatoria por la naturaleza de las funciones, ni la promoción interna exime de la ley. Tampoco está prohibido: la ley puede preverlo con carácter excepcional."
  citation: "art. 61.6 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-11719-art-61
- id: m04-l03-q044
  prompt:
    es: "Según el artículo 61.6 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué consiste el sistema de concurso cuando una ley permite aplicarlo a la selección de funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "En la valoración de méritos y una entrevista personal"
  - id: b
    text:
      es: "En una prueba de capacidad y la valoración de méritos"
  - id: c
    text:
      es: "En la superación de un curso selectivo sin pruebas previas"
  - id: d
    correct: true
    text:
      es: "Únicamente en la valoración de méritos"
  explanation:
    es: "El artículo 61.6 dice que el sistema de concurso «consistirá únicamente en la valoración de méritos». Añadir una entrevista personal cambia el sistema. La prueba de capacidad seguida de la valoración de méritos describe el concurso-oposición. El curso selectivo es una fase que puede completar las pruebas (artículo 61.5), no el contenido del concurso."
  citation: "art. 61.6 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-61
- id: m04-l03-q045
  prompt:
    es: "¿Cuál de las siguientes exigencias impone el texto refundido de la Ley del Estatuto Básico del Empleado Público a la oposición y al concurso-oposición como sistemas selectivos de funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "Incluir en todo caso un curso selectivo o un periodo de prácticas evaluable tras la fase de oposición"
  - id: b
    text:
      es: "Incluir en todo caso una entrevista personal y un reconocimiento médico de los aspirantes"
  - id: c
    text:
      es: "Incluir una fase de méritos que valga al menos la mitad de la puntuación total"
  - id: d
    correct: true
    text:
      es: "Incluir una o varias pruebas para determinar la capacidad de los aspirantes y establecer el orden de prelación"
  explanation:
    es: "El artículo 61.6 dice que la oposición y el concurso-oposición «deberán incluir, en todo caso, una o varias pruebas para determinar la capacidad de los aspirantes y establecer el orden de prelación». Los cursos, los periodos de prácticas, las entrevistas y los reconocimientos médicos son complementos que el artículo 61.5 permite («podrán completarse», «podrán exigirse»), no exigencias en todo caso. El artículo 61.3 pide que la valoración de méritos tenga una puntuación proporcionada que no determine por sí sola el resultado, no que valga la mitad."
  citation: "art. 61.6 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-4
- id: m04-l03-q046
  prompt:
    es: "Según el artículo 4.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, ¿cuál es el sistema ordinario de ingreso del personal funcionario?"
  options:
  - id: a
    text:
      es: "El concurso-oposición, salvo que la convocatoria establezca la oposición"
  - id: b
    correct: true
    text:
      es: "La oposición, salvo que por la naturaleza de las funciones sea más adecuado otro sistema"
  - id: c
    text:
      es: "El concurso, salvo que la convocatoria prevea la realización de pruebas"
  - id: d
    text:
      es: "La oposición, sin que quepa otro sistema en el ingreso del personal funcionario"
  explanation:
    es: "El artículo 4.1 dice: «La oposición será el sistema ordinario de ingreso, salvo cuando, por la naturaleza de las funciones a desempeñar, sea más adecuada la utilización del concurso-oposición y, excepcionalmente, del concurso». El concurso-oposición y el concurso no son el sistema ordinario. La opción que excluye cualquier otro sistema contradice el mismo artículo, que admite el ingreso por concurso-oposición o concurso libres."
  citation: "art. 4.1 RD 364/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-4
- id: m04-l03-q047
  prompt:
    es: "De acuerdo con el artículo 4.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, el ingreso del personal funcionario por el sistema de concurso procede:"
  options:
  - id: a
    text:
      es: "Con carácter ordinario, cuando el número de plazas convocadas sea reducido"
  - id: b
    text:
      es: "Únicamente para el ingreso en los cuerpos y escalas del Subgrupo A1 de la Administración"
  - id: c
    text:
      es: "Siempre que la convocatoria prevea además un curso selectivo o un período de prácticas"
  - id: d
    correct: true
    text:
      es: "Excepcionalmente, cuando por la naturaleza de las funciones sea el sistema más adecuado"
  explanation:
    es: "El artículo 4.1 admite el ingreso por oposición, concurso-oposición o concurso libres, y dice que la oposición es el sistema ordinario «salvo cuando, por la naturaleza de las funciones a desempeñar, sea más adecuada la utilización del concurso-oposición y, excepcionalmente, del concurso». El concurso no es un sistema ordinario ni depende del número de plazas. El artículo no lo limita al Subgrupo A1 ni lo condiciona a un curso selectivo."
  citation: "art. 4.1 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2023-25758-art-114
- id: m04-l03-q051
  prompt:
    es: "¿Cuál de las siguientes reglas sobre la fase de concurso del concurso-oposición establece el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    text:
      es: "Su valoración no puede superar en ningún caso el diez por ciento de la puntuación total"
  - id: b
    text:
      es: "Su puntuación determina por sí sola el resultado cuando hay empate en la oposición"
  - id: c
    correct: true
    text:
      es: "Su valoración es proporcionada y su puntuación no determina por sí sola el resultado"
  - id: d
    text:
      es: "Su valoración la fija libremente el órgano de selección tras conocer los resultados"
  explanation:
    es: "El artículo 114.7 dice: «La valoración de la fase de concurso será proporcionada y, en ningún caso, su puntuación determinará por sí sola el resultado del proceso selectivo». El artículo no fija un tope del diez por ciento. Tampoco prevé que la fase de concurso decida sola en caso de empate: eso es justo lo que excluye «en ningún caso». Y no deja la valoración a la libre decisión del órgano de selección después de conocer los resultados."
  citation: "art. 114.7 RDL 6/2023"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-25758-art-114
- id: m04-l03-q052
  prompt:
    es: "¿Qué condición tiene la persona aspirante durante la fase de curso selectivo de un proceso de selección de personal funcionario de carrera según el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    text:
      es: "Personal funcionario interino"
  - id: b
    correct: true
    text:
      es: "Personal funcionario en prácticas"
  - id: c
    text:
      es: "Personal funcionario de carrera"
  - id: d
    text:
      es: "Aspirante sin vinculación con la Administración"
  explanation:
    es: "El artículo 114.8 dice que durante esta fase «la persona aspirante tendrá la condición de personal funcionario en prácticas». No es personal funcionario interino, que se nombra por necesidad y urgencia para desempeñar un puesto. Tampoco es todavía funcionario de carrera. Y sí tiene una vinculación con la Administración: la de funcionario en prácticas."
  citation: "art. 114.8 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-114
- id: m04-l03-q053
  prompt:
    es: "¿Cuál de las siguientes describe el curso selectivo que pueden incorporar los sistemas de selección de personal funcionario de carrera según el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    correct: true
    text:
      es: "Un periodo formativo o de prácticas evaluable, de contenido distinto de lo valorado en las fases previas"
  - id: b
    text:
      es: "Un periodo formativo no evaluable, que solo condiciona la adjudicación del primer destino"
  - id: c
    text:
      es: "Un periodo de prácticas evaluable que repite las materias valoradas en la fase de oposición"
  - id: d
    text:
      es: "Una prueba final de conocimientos que sustituye a la fase de concurso"
  explanation:
    es: "El artículo 114.8 describe el curso selectivo como «la realización de un periodo formativo o de prácticas evaluable, cuyo contenido y desarrollo diferirá de lo valorado en las fases previas». Por eso es evaluable y no repite lo valorado antes. Tampoco es una prueba final que sustituya a la fase de concurso: es una fase más del sistema de selección."
  citation: "art. 114.8 RDL 6/2023"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-22
- id: m04-l03-q054
  prompt:
    es: "Según el artículo 22.3 del Real Decreto 364/1995, de 10 de marzo, ¿en qué caso el número de aprobados en las pruebas selectivas puede ser superior al de plazas convocadas?"
  options:
  - id: a
    text:
      es: "Cuando el proceso selectivo comprende, además de las pruebas, un período de prácticas"
  - id: b
    text:
      es: "Cuando el tribunal lo acuerda por empate de puntuación en la última plaza"
  - id: c
    text:
      es: "Cuando las plazas convocadas están reservadas a personas con discapacidad"
  - id: d
    correct: true
    text:
      es: "Cuando el proceso selectivo comprende, además de las pruebas, un curso selectivo"
  explanation:
    es: "El artículo 22.3 dice que el proceso selectivo puede comprender un curso selectivo o un período de prácticas y que «sólo en el primer caso el número de aprobados en las pruebas selectivas podrá ser superior al de plazas convocadas». El período de prácticas, por tanto, no lo permite. El artículo no da esa facultad al tribunal en caso de empate ni la vincula a las plazas reservadas a personas con discapacidad."
  citation: "art. 22.3 RD 364/1995"
  difficulty: 3
  tags:
  - "excepción"
