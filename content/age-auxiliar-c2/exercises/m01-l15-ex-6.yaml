# anchor: boe-a-2026-12037-art-6
- id: m01-l15-q057
  prompt:
    es: "¿Cuál de los siguientes rasgos define a los programas finalistas según la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027?"
  options:
  - id: a
    text:
      es: "Que sus créditos se consignan en el capítulo de inversiones reales."
  - id: b
    correct: true
    text:
      es: "Que se les puede asignar objetivos cuantificables e indicadores de ejecución mensurables."
  - id: c
    text:
      es: "Que su ejecución corresponde a un organismo autónomo y no a un ministerio."
  - id: d
    text:
      es: "Que sus créditos tienen la condición de ampliables durante el ejercicio."
  explanation:
    es: "La Orden define los programas finalistas como «aquellos a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables» (art. 6, apartado 1.1). El presupuesto de gastos se estructura teniendo en cuenta tres criterios distintos, las finalidades u objetivos, la organización de los entes y la naturaleza económica de los gastos (art. 6.1), y la clase de programa sale del primero. Por eso la opción de las inversiones reales, que es un criterio económico, y la del organismo autónomo, que es un criterio orgánico, no definen la clase de programa. La opción de los créditos ampliables tampoco: la Orden no clasifica los programas por el régimen de sus créditos."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-art-6
- id: m01-l15-q058
  prompt:
    es: "En la estructura de programas de gasto de los Presupuestos Generales del Estado, los programas a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables son los programas:"
  options:
  - id: a
    text:
      es: "De transferencias y libramientos internos."
  - id: b
    text:
      es: "De dirección y servicios generales."
  - id: c
    correct: true
    text:
      es: "De gasto de carácter finalista."
  - id: d
    text:
      es: "De inversiones y operaciones de capital."
  explanation:
    es: "La estructura de programas «diferenciará los programas de gasto de carácter finalista de los programas instrumentales y de gestión», y los finalistas son aquellos a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables (art. 6, apartado 1.1, Orden HAC/557/2026). «Transferencias y libramientos internos» es el nombre de un programa concreto, el 000X, en el que se consignan dotaciones para financiar transferencias (art. 6, apartado 1.1), no una clase de programas. Los programas de dirección y servicios generales llevan en el anexo I una letra de la «M» a la «Z» en el cuarto carácter, la de los instrumentales y de gestión. Las inversiones y operaciones de capital pertenecen a la clasificación económica del gasto, no a la de programas."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-art-6
- id: m01-l15-q059
  prompt:
    es: "Según la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿qué clase de objetivos se puede asignar a los programas finalistas?"
  options:
  - id: a
    correct: true
    text:
      es: "Objetivos cuantificables, con indicadores de ejecución mensurables."
  - id: b
    text:
      es: "Objetivos de una actividad que se perfecciona por su propia realización."
  - id: c
    text:
      es: "Objetivos de administración de recursos para la ordenación y la regulación."
  - id: d
    text:
      es: "Objetivos que no admiten ninguna cuantificación material."
  explanation:
    es: "A los programas finalistas «se puede asignar objetivos cuantificables e indicadores de ejecución mensurables» (art. 6, apartado 1.1). Las otras tres opciones toman rasgos que la misma Orden da a los programas instrumentales y de gestión, la clase opuesta: la ejecución de una actividad que se perfecciona por su propia realización, la administración de los recursos necesarios para actividades generales de ordenación, regulación y planificación, y la imposibilidad de proceder a una cuantificación material de sus objetivos."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q060
  prompt:
    es: "De acuerdo con el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán las obligaciones económicas que:"
  options:
  - id: a
    text:
      es: "Como mínimo, deben reconocer los sujetos que el artículo 33.1.a) incluye en los presupuestos de carácter limitativo."
  - id: b
    correct: true
    text:
      es: "Como máximo, pueden reconocer los sujetos que el artículo 33.1.a) incluye en los presupuestos de carácter limitativo."
  - id: c
    text:
      es: "Como máximo, pueden reconocer las entidades de los sectores empresarial y fundacional, de presupuesto estimativo."
  - id: d
    text:
      es: "Como máximo, pueden reconocer los consorcios y las universidades no transferidas, con presupuesto de carácter estimativo."
  explanation:
    es: "El artículo 33.2.a) habla de las obligaciones que, «como máximo», pueden reconocer los sujetos del artículo 33.1.a): el presupuesto limita, no obliga a gastar. La opción del mínimo cambia ese límite en un suelo. Las dos opciones de las entidades empresariales, fundacionales, consorcios y universidades describen a los sujetos del artículo 33.1.b), de presupuesto estimativo, que no reconocen obligaciones con ese límite."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q061
  prompt:
    es: "Según el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán las operaciones no financieras y financieras a realizar por:"
  options:
  - id: a
    text:
      es: "Los órganos y entidades de presupuesto limitativo que enumera el artículo 33.1.a), como los organismos autónomos."
  - id: b
    correct: true
    text:
      es: "Las entidades de presupuesto estimativo que enumera el artículo 33.1.b), como los consorcios y los fondos."
  - id: c
    text:
      es: "Únicamente la Administración General del Estado y sus organismos autónomos, de presupuesto limitativo."
  - id: d
    text:
      es: "Todas las entidades del sector público estatal, sin distinción entre presupuesto limitativo y presupuesto estimativo."
  explanation:
    es: "Las operaciones no financieras y financieras son el contenido que el artículo 33.2.c) asigna a las entidades del artículo 33.1.b), las de presupuesto estimativo. Los sujetos del artículo 33.1.a), de presupuesto limitativo, aparecen en otro apartado: las obligaciones que como máximo pueden reconocer. La opción de la Administración General del Estado y sus organismos autónomos también describe sujetos del artículo 33.1.a). La opción de todas las entidades sin distinguir borra la diferencia que la ley hace entre los dos tipos de presupuesto."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q062
  prompt:
    es: "Con arreglo al artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán, para cada gestor responsable de programas:"
  options:
  - id: a
    text:
      es: "Los ingresos que debe recaudar en el ejercicio con los medios humanos y materiales que se le asignan."
  - id: b
    correct: true
    text:
      es: "Los objetivos a alcanzar en el ejercicio con los recursos que el respectivo presupuesto le asigna al efecto."
  - id: c
    text:
      es: "Los créditos que podrá transferir libremente a otros programas durante el ejercicio, sin autorización."
  - id: d
    text:
      es: "Las plazas de personal que podrá cubrir en el ejercicio con cargo a los créditos de sus programas."
  explanation:
    es: "El artículo 33.2.d) pide que el presupuesto fije los objetivos que cada gestor de programas debe alcanzar en el ejercicio con los recursos asignados. Los ingresos a recaudar, la libre transferencia de créditos y las plazas a cubrir no son contenido que el artículo atribuya al gestor de programas; la transferencia de créditos, además, exige autorización conforme a la ley."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m01-l15-q063
  prompt:
    es: "Según el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán todo lo siguiente, EXCEPTO:"
  options:
  - id: a
    correct: true
    text:
      es: "La retribución individual de cada empleado público estatal en el ejercicio."
  - id: b
    text:
      es: "Los derechos que los entes del artículo 33.1.a) reconocerán durante el correspondiente ejercicio."
  - id: c
    text:
      es: "Las obligaciones que como máximo pueden reconocer los sujetos del artículo 33.1.a)."
  - id: d
    text:
      es: "La estimación de los beneficios fiscales que afecten a los tributos del Estado."
  explanation:
    es: "El artículo 33.2 enumera cinco contenidos: las obligaciones máximas, los derechos a reconocer, las operaciones de las entidades de presupuesto estimativo, los objetivos de cada gestor y los beneficios fiscales. La retribución individual de cada empleado no figura entre ellos. Las otras tres opciones reproducen tres de esos contenidos."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q064
  prompt:
    es: "Según el artículo 40.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los estados de gastos de los Presupuestos Generales del Estado se estructuran de acuerdo con las clasificaciones:"
  options:
  - id: a
    text:
      es: "La orgánica, la económica y la territorial."
  - id: b
    correct: true
    text:
      es: "La orgánica, la de programas y la económica, por este orden."
  - id: c
    text:
      es: "La de programas, la económica y la temporal."
  - id: d
    text:
      es: "La orgánica, la de programas y la subjetiva."
  explanation:
    es: "El artículo 40.1 enumera tres clasificaciones: la orgánica, la de programas y la económica. Las clasificaciones territorial, temporal y subjetiva no existen en la estructura de los estados de gastos."
  citation: "art. 40.1 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q067
  prompt:
    es: "Conforme al artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones corrientes se distinguirán:"
  options:
  - id: a
    text:
      es: "Gastos de personal, inversiones reales, gastos financieros y transferencias corrientes."
  - id: b
    correct: true
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, gastos financieros y transferencias corrientes."
  - id: c
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, activos financieros y transferencias corrientes."
  - id: d
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, gastos financieros y transferencias de capital."
  explanation:
    es: "Las operaciones corrientes comprenden los gastos de personal, los gastos corrientes en bienes y servicios, los gastos financieros y las transferencias corrientes. Cada alternativa cambia uno de los cuatro por uno de otro bloque: las inversiones reales y las transferencias de capital son operaciones de capital, y los activos financieros son operaciones financieras."
  citation: "art. 40.1.c) LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-52
- id: m01-l15-q070
  prompt:
    es: "Según el artículo 52.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la restricción de transferir entre créditos de distintas secciones presupuestarias no afecta a los créditos:"
  options:
  - id: a
    text:
      es: "ampliables de las entidades de la Seguridad Social."
  - id: b
    text:
      es: "de la sección 06 Deuda Pública."
  - id: c
    correct: true
    text:
      es: "del programa de contratación centralizada."
  - id: d
    text:
      es: "extraordinarios concedidos durante el ejercicio."
  explanation:
    es: "El artículo 52.1.b) prohíbe las transferencias entre créditos de distintas secciones y añade que la restricción no afecta a los créditos del programa de contratación centralizada. Los créditos ampliables de la Seguridad Social y los de la sección 06 Deuda Pública son las salvedades de la letra c), que trata de minorar créditos extraordinarios, suplementados o ampliados. Los créditos extraordinarios del ejercicio no son una salvedad: la letra c) prohíbe minorarlos."
  citation: "art. 52.1.b) LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q071
  prompt:
    es: "Conforme al artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones de capital se distinguirán:"
  options:
  - id: a
    text:
      es: "las inversiones reales y los activos financieros."
  - id: b
    correct: true
    text:
      es: "las inversiones reales y las transferencias de capital."
  - id: c
    text:
      es: "los gastos financieros y las transferencias de capital."
  - id: d
    text:
      es: "las transferencias de capital y los pasivos financieros."
  explanation:
    es: "Las operaciones de capital comprenden las inversiones reales y las transferencias de capital, los capítulos 6 y 7. Los activos y los pasivos financieros son las operaciones financieras, y los gastos financieros son operaciones corrientes."
  citation: "art. 40.1.c) LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q072
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, la clasificación económica de gastos agrupa las operaciones financieras en dos capítulos. ¿Cómo se denominan, por este orden, los capítulos 8 y 9?"
  options:
  - id: a
    correct: true
    text:
      es: "Activos financieros y Pasivos financieros."
  - id: b
    text:
      es: "Gastos financieros y Pasivos financieros."
  - id: c
    text:
      es: "Transferencias de capital y Activos financieros."
  - id: d
    text:
      es: "Activos financieros y Gastos financieros."
  explanation:
    es: "El anexo II denomina el capítulo 8 «Activos financieros» y el 9 «Pasivos financieros». «Gastos financieros» es el capítulo 3, de las operaciones corrientes, y «Transferencias de capital» es el 7, de las de capital."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q073
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, la clasificación económica de gastos cierra las operaciones corrientes con los capítulos 3 y 4. ¿Cómo se denominan, por este orden?"
  options:
  - id: a
    correct: true
    text:
      es: "Gastos financieros y Transferencias corrientes."
  - id: b
    text:
      es: "Transferencias corrientes y Gastos financieros."
  - id: c
    text:
      es: "Gastos financieros y Transferencias de capital."
  - id: d
    text:
      es: "Gastos de personal y Transferencias corrientes."
  explanation:
    es: "El anexo II denomina el capítulo 3 «Gastos financieros» y el 4 «Transferencias corrientes», los dos últimos de las operaciones corrientes. La opción que invierte el orden pone las denominaciones en el capítulo equivocado. «Transferencias de capital» es el capítulo 7, y «Gastos de personal» es el 1."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q074
  prompt:
    es: "Conforme al anexo II de la Orden HAC/557/2026, de 3 de junio, el artículo 23 «Indemnizaciones por razón del servicio» pertenece al capítulo de:"
  options:
  - id: a
    text:
      es: "inversiones reales."
  - id: b
    correct: true
    text:
      es: "gastos corrientes en bienes y servicios."
  - id: c
    text:
      es: "transferencias de capital."
  - id: d
    text:
      es: "fondo de contingencia y otros imprevistos."
  explanation:
    es: "El anexo II ordena la clasificación económica por dígitos: el artículo 23 «Indemnizaciones por razón del servicio» va en el capítulo 2, «Gastos corrientes en bienes y servicios». Las inversiones reales son el capítulo 6, las transferencias de capital el 7 y el fondo de contingencia el 5."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m01-l15-q075
  prompt:
    es: "Según el artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones financieras se distinguirán:"
  options:
  - id: a
    text:
      es: "Las de gastos financieros y las de activos financieros."
  - id: b
    correct: true
    text:
      es: "Las de activos financieros y las de pasivos financieros."
  - id: c
    text:
      es: "Las de pasivos financieros y las de transferencias de capital."
  - id: d
    text:
      es: "Las de inversiones reales y las de gastos financieros."
  explanation:
    es: "Las operaciones financieras se dividen en activos financieros y pasivos financieros (capítulos 8 y 9). Los gastos financieros son operaciones corrientes, y las inversiones reales y las transferencias de capital son operaciones de capital."
  citation: "art. 40.1.c) LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q076
  prompt:
    es: "En el capítulo 6 del anexo II de la Orden HAC/557/2026, de 3 de junio, ¿en qué se distinguen por su denominación los artículos 62 y 63?"
  options:
  - id: a
    correct: true
    text:
      es: "El 62 es inversión nueva y el 63 inversión de reposición, ambos asociados al funcionamiento operativo de los servicios."
  - id: b
    text:
      es: "El 62 es inversión de reposición y el 63 inversión nueva, ambos asociados al funcionamiento operativo de los servicios."
  - id: c
    text:
      es: "El 62 es inversión nueva en infraestructura de uso general y el 63 inversión de reposición en esa misma infraestructura."
  - id: d
    text:
      es: "El 62 es inversión civil y el 63 inversión militar, ambos asociados al funcionamiento operativo de los servicios."
  explanation:
    es: "El artículo 62 se denomina «Inversión nueva asociada al funcionamiento operativo de los servicios» y el 63, «Inversión de reposición asociada al funcionamiento operativo de los servicios». La opción que invierte los dos adjetivos cambia el orden de las denominaciones. La inversión en infraestructura de uso general corresponde a los artículos 60 y 61, y la inversión militar, a los artículos 65 a 67: ninguna de las dos describe al 62 y al 63."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q077
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, un artículo denominado «A organismos autónomos» figura en dos capítulos de la clasificación económica de gastos. ¿Cuáles son?"
  options:
  - id: a
    text:
      es: "El 2, «Gastos corrientes en bienes y servicios», y el 6, «Inversiones reales»."
  - id: b
    text:
      es: "El 3, «Gastos financieros», y el 8, «Activos financieros»."
  - id: c
    text:
      es: "El 1, «Gastos de personal», y el 9, «Pasivos financieros»."
  - id: d
    correct: true
    text:
      es: "El 4, «Transferencias corrientes», y el 7, «Transferencias de capital»."
  explanation:
    es: "Los artículos 41 y 71 se denominan «A organismos autónomos» y cuelgan de los capítulos 4, «Transferencias corrientes», y 7, «Transferencias de capital». Los capítulos de bienes y servicios, inversiones reales, gastos financieros, activos financieros, personal y pasivos financieros no tienen ningún artículo con ese nombre."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
