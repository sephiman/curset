# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q037
  prompt:
    es: "De acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán motivados los actos que se separen:"
  options:
  - id: a
    text:
      es: "Del criterio seguido en actuaciones precedentes, pero no del dictamen de órganos consultivos."
  - id: b
    text:
      es: "De las instrucciones del superior jerárquico o de las circulares de servicio."
  - id: c
    text:
      es: "De la práctica de otras Administraciones Públicas o de sus órganos consultivos."
  - id: d
    correct: true
    text:
      es: "Del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos."
  explanation:
    es: "El artículo 35.1.c) exige motivar los actos «que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos». Comprende los dos supuestos, así que la opción que deja fuera el dictamen de órganos consultivos es incorrecta. Las instrucciones del superior y la práctica de otras Administraciones no figuran en esa letra."
  citation: "art. 35.1.c) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q039
  prompt:
    es: "En un procedimiento administrativo de carácter sancionador debe motivarse, con sucinta referencia de hechos y fundamentos de derecho:"
  options:
  - id: a
    text:
      es: "La admisión de las pruebas propuestas por el interesado."
  - id: b
    text:
      es: "La remisión del expediente al órgano que resuelve."
  - id: c
    correct: true
    text:
      es: "La propuesta de resolución que formule el órgano instructor."
  - id: d
    text:
      es: "La comunicación de la fecha de recepción del escrito."
  explanation:
    es: "El artículo 35.1.h) de la Ley 39/2015 exige motivar «las propuestas de resolución en los procedimientos de carácter sancionador». La remisión del expediente y la comunicación de la fecha de recepción no figuran en el artículo 35.1. En materia de prueba se motiva el rechazo de las propuestas por los interesados (letra f), no su admisión."
  citation: "art. 35.1.h) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q040
  prompt:
    es: "Según el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo han de motivarse los actos que enumera?"
  options:
  - id: a
    text:
      es: "Con exposición detallada de los hechos y de la jurisprudencia aplicable."
  - id: b
    text:
      es: "Con remisión a los informes y dictámenes que obren en el expediente."
  - id: c
    text:
      es: "Con sucinta referencia a la norma que atribuye la competencia al órgano."
  - id: d
    correct: true
    text:
      es: "Con sucinta referencia de hechos y fundamentos de derecho."
  explanation:
    es: "El artículo 35.1 dice: «Serán motivados, con sucinta referencia de hechos y fundamentos de derecho». La exposición detallada contradice «sucinta». La jurisprudencia no es uno de los dos contenidos que el apartado nombra: hechos y fundamentos de derecho. La referencia a la norma de competencia deja fuera los hechos, que el apartado exige. La remisión a informes no basta por sí sola: el artículo 88.6 dice que la aceptación de informes o dictámenes sirve de motivación cuando se incorporan al texto de la resolución."
  citation: "art. 35.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q041
  prompt:
    es: "En materia de prueba, ¿cuál de los siguientes actos debe motivarse según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El que acuerde la práctica de pruebas de oficio."
  - id: b
    text:
      es: "El que señale el lugar, fecha y hora de la prueba."
  - id: c
    text:
      es: "El que admita las pruebas propuestas por los interesados."
  - id: d
    correct: true
    text:
      es: "El que rechace pruebas propuestas por los interesados."
  explanation:
    es: "El artículo 35.1.f) exige motivar «los actos que rechacen pruebas propuestas por los interesados». La admisión de pruebas, su práctica de oficio y el señalamiento de lugar y fecha no figuran entre los actos del artículo 35.1."
  citation: "art. 35.1.f) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q042
  prompt:
    es: "Los acuerdos de suspensión de actos administrativos deben motivarse, con sucinta referencia de hechos y fundamentos de derecho:"
  options:
  - id: a
    text:
      es: "Salvo que la suspensión dure menos de un mes."
  - id: b
    text:
      es: "Sólo cuando la suspensión la solicite el interesado."
  - id: c
    correct: true
    text:
      es: "Cualquiera que sea el motivo de la suspensión."
  - id: d
    text:
      es: "Sólo cuando la suspensión se acuerde de oficio."
  explanation:
    es: "El artículo 35.1.d) de la Ley 39/2015 incluye «los acuerdos de suspensión de actos, cualquiera que sea el motivo de ésta». No distingue según quién la promueva ni según su duración."
  citation: "art. 35.1.d) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q043
  prompt:
    es: "De acuerdo con el artículo 35.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, serán motivados los actos que se dicten en el ejercicio de:"
  options:
  - id: a
    correct: true
    text:
      es: "Potestades discrecionales."
  - id: b
    text:
      es: "Potestades de autoorganización."
  - id: c
    text:
      es: "Potestades regladas."
  - id: d
    text:
      es: "Potestades de ejecución forzosa."
  explanation:
    es: "El artículo 35.1.i) incluye «los actos que se dicten en el ejercicio de potestades discrecionales». Las potestades regladas, la autoorganización y la ejecución forzosa no aparecen en esa letra."
  citation: "art. 35.1.i) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q044
  prompt:
    es: "Deben motivarse, con sucinta referencia de hechos y fundamentos de derecho, los actos administrativos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Limiten derechos subjetivos o intereses legítimos."
  - id: b
    text:
      es: "Concedan íntegramente lo solicitado por el interesado."
  - id: c
    text:
      es: "Tengan por destinatario a una pluralidad de personas."
  - id: d
    text:
      es: "Se notifiquen al interesado por medios electrónicos."
  explanation:
    es: "El artículo 35.1.a) de la Ley 39/2015 incluye «los actos que limiten derechos subjetivos o intereses legítimos». El acto que concede íntegramente lo solicitado no limita derechos. El número de destinatarios cuenta para la publicación (art. 45.1.a), no para la motivación. El medio de notificación tampoco influye en ella."
  citation: "art. 35.1.a) LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q045
  prompt:
    es: "Según el artículo 35.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará:"
  options:
  - id: a
    text:
      es: "Con sucinta referencia a la puntuación obtenida por cada uno de los aspirantes."
  - id: b
    correct: true
    text:
      es: "De conformidad con lo que dispongan las normas que regulen sus convocatorias."
  - id: c
    text:
      es: "Mediante un informe del órgano de selección que se unirá al expediente."
  - id: d
    text:
      es: "De conformidad con lo que acuerde en cada caso el órgano que resuelva."
  explanation:
    es: "El artículo 35.2 remite a «lo que dispongan las normas que regulen sus convocatorias». No fija la puntuación como contenido de la motivación ni exige un informe del órgano de selección. La remisión es a las normas de la convocatoria, no a lo que decida el órgano que resuelve."
  citation: "art. 35.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-35
- id: m03-l02-q046
  prompt:
    es: "Según el artículo 35.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe quedar acreditado en todo caso en un procedimiento selectivo o de concurrencia competitiva?"
  options:
  - id: a
    text:
      es: "La puntuación de cada uno de los aspirantes."
  - id: b
    correct: true
    text:
      es: "Los fundamentos de la resolución que se adopte."
  - id: c
    text:
      es: "La conformidad de los interesados con ella."
  - id: d
    text:
      es: "La identidad de quienes integran el órgano."
  explanation:
    es: "El artículo 35.2 añade que deben «en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte». Ni la puntuación de cada aspirante, ni la identidad de los miembros del órgano, ni la conformidad de los interesados figuran en el artículo."
  citation: "art. 35.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-40
- id: m03-l02-q047
  prompt:
    es: "Según el artículo 40.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, notificará las resoluciones y actos administrativos a los interesados cuyos derechos e intereses resulten afectados:"
  options:
  - id: a
    text:
      es: "El órgano que haya instruido el procedimiento."
  - id: b
    text:
      es: "El superior jerárquico del órgano que los dicte."
  - id: c
    text:
      es: "La oficina de asistencia en materia de registro."
  - id: d
    correct: true
    text:
      es: "El órgano que dicte esas resoluciones y actos."
  explanation:
    es: "El artículo 40.1 dice: «El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses sean afectados por aquéllos». La obligación no recae en el instructor, en la oficina de registro ni en el superior jerárquico."
  citation: "art. 40.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-40
- id: m03-l02-q048
  prompt:
    es: "Conforme al artículo 40.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, toda notificación deberá ser cursada dentro del plazo de diez días contados:"
  options:
  - id: a
    text:
      es: "A partir de la fecha de la solicitud del interesado."
  - id: b
    correct: true
    text:
      es: "A partir de la fecha en que el acto haya sido dictado."
  - id: c
    text:
      es: "A partir de la fecha en que el acto se publique."
  - id: d
    text:
      es: "A partir de la fecha en que el acto sea firme."
  explanation:
    es: "El artículo 40.2 dice que la notificación «deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado». El plazo no cuenta desde la firmeza, desde la solicitud ni desde una publicación."
  citation: "art. 40.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-40
- id: m03-l02-q049
  prompt:
    es: "Un órgano de la Administración General del Estado dicta una resolución el martes 10 de noviembre de 2026. Sin festivos en el periodo, ¿cuál es el último día para cursar su notificación conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El martes 17 de noviembre de 2026."
  - id: b
    text:
      es: "El viernes 20 de noviembre de 2026."
  - id: c
    correct: true
    text:
      es: "El martes 24 de noviembre de 2026."
  - id: d
    text:
      es: "El martes 1 de diciembre de 2026."
  explanation:
    es: "El artículo 40.2 da diez días a partir de la fecha en que el acto se dictó, y el artículo 30.2 los hace hábiles: se excluyen sábados, domingos y festivos. La cuenta empieza el día siguiente, miércoles 11 de noviembre. Del 11 al 13 van tres días hábiles; del lunes 16 al viernes 20, cinco más, ocho en total. El lunes 23 es el noveno y el martes 24, el décimo. El viernes 20 sale de contar diez días naturales. El martes 17 son cinco días hábiles y el martes 1 de diciembre, quince."
  citation: "art. 40.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10565-art-30
- id: m03-l02-q050
  prompt:
    es: "Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los plazos se señalan por días, ¿cómo se entienden?"
  options:
  - id: a
    correct: true
    text:
      es: "Como hábiles, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: b
    text:
      es: "Como naturales, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: c
    text:
      es: "Como naturales, salvo que el órgano que dicte el acto disponga otra cosa."
  - id: d
    text:
      es: "Como hábiles, salvo que una disposición reglamentaria exprese otro cómputo distinto."
  explanation:
    es: "El artículo 30.2 dice: «Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles». La regla son los días hábiles, no los naturales. La excepción la fija una ley o el Derecho de la Unión Europea, no un reglamento ni el órgano que dicta el acto."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-40
- id: m03-l02-q051
  prompt:
    es: "Según el artículo 40.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, además del texto íntegro de la resolución, ¿qué debe contener toda notificación?"
  options:
  - id: a
    text:
      es: "La indicación de si el acto es firme y la identidad de los demás interesados en el procedimiento."
  - id: b
    text:
      es: "La fecha en que el acto adquirirá firmeza si no se interpone recurso alguno contra él."
  - id: c
    correct: true
    text:
      es: "La indicación de si pone fin o no a la vía administrativa y los recursos que procedan."
  - id: d
    text:
      es: "El informe jurídico que sirvió de fundamento a la resolución notificada."
  explanation:
    es: "El artículo 40.2 exige el texto íntegro de la resolución «con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan», el órgano ante el que presentarlos y el plazo. No exige identificar a los demás interesados ni adjuntar informes. Tampoco pide indicar la fecha de firmeza."
  citation: "art. 40.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-40
- id: m03-l02-q052
  prompt:
    es: "La expresión de los recursos procedentes que debe contener la notificación de una resolución administrativa se entiende:"
  options:
  - id: a
    text:
      es: "Exigible sólo cuando la resolución que se notifica ponga fin a la vía administrativa."
  - id: b
    text:
      es: "Referida sólo a los recursos en vía administrativa, no a los de la vía judicial."
  - id: c
    correct: true
    text:
      es: "Sin perjuicio de que los interesados puedan ejercitar cualquier otro que estimen procedente."
  - id: d
    text:
      es: "Como un límite: los interesados sólo pueden interponer los recursos expresados en ella."
  explanation:
    es: "El artículo 40.2 de la Ley 39/2015 exige expresar los recursos que procedan «en vía administrativa y judicial», «sin perjuicio de que los interesados puedan ejercitar, en su caso, cualquier otro que estimen procedente». La lista no limita a los interesados. Incluye la vía judicial. Se exige en toda notificación, ponga o no fin a la vía administrativa."
  citation: "art. 40.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q053
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones se practicarán en todo caso por medios electrónicos cuando:"
  options:
  - id: a
    text:
      es: "El interesado haya comunicado una dirección de correo electrónico."
  - id: b
    correct: true
    text:
      es: "El interesado resulte obligado a recibirlas por esta vía."
  - id: c
    text:
      es: "El acto que se notifique ponga fin a la vía administrativa."
  - id: d
    text:
      es: "El interesado haya presentado su solicitud por medios electrónicos."
  explanation:
    es: "El artículo 41.1 dice que las notificaciones se practicarán preferentemente por medios electrónicos «y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía». Presentar la solicitud por medios electrónicos no basta por sí solo. El tipo de acto no decide el medio. La dirección de correo electrónico comunicada sirve para los avisos, no para practicar notificaciones."
  citation: "art. 41.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q055
  prompt:
    es: "Según el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué supuesto podrán las Administraciones practicar las notificaciones por medios no electrónicos?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el interesado comparezca espontáneamente en una oficina de asistencia en materia de registro y pida allí la notificación."
  - id: b
    text:
      es: "Cuando el interesado obligado a relacionarse electrónicamente pida por escrito que se le notifique en papel en su domicilio habitual."
  - id: c
    text:
      es: "Cuando el acto que haya de notificarse sea de gravamen o desfavorable para el interesado o su representante."
  - id: d
    text:
      es: "Cuando el interesado no haya accedido a una notificación electrónica anterior en el plazo de diez días naturales."
  explanation:
    es: "El artículo 41.1.a) permite la notificación no electrónica «con ocasión de la comparecencia espontánea del interesado o su representante en las oficinas de asistencia en materia de registro» cuando solicite en ese momento la notificación personal. El obligado a relacionarse electrónicamente no puede pedir el papel. El carácter desfavorable del acto no cambia el medio. Si no se accede a una notificación electrónica obligatoria en diez días naturales, se entiende rechazada (art. 43.2)."
  citation: "art. 41.1.a) LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q056
  prompt:
    es: "Conforme al artículo 41.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en ningún caso se efectuarán por medios electrónicos las notificaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Que contengan medios de pago a favor de los obligados, tales como cheques."
  - id: b
    text:
      es: "Que contengan actos de gravamen o desfavorables para el interesado."
  - id: c
    text:
      es: "Que se practiquen en procedimientos de carácter sancionador."
  - id: d
    text:
      es: "Que vayan dirigidas a personas físicas no obligadas a relacionarse electrónicamente."
  explanation:
    es: "El artículo 41.2.b) excluye «las que contengan medios de pago a favor de los obligados, tales como cheques». Las personas no obligadas pueden elegir que se les notifique por medios electrónicos (art. 41.1). Ni los actos de gravamen ni los procedimientos sancionadores figuran en el artículo 41.2."
  citation: "art. 41.2.b) LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q058
  prompt:
    es: "Señale la respuesta correcta sobre el aviso de puesta a disposición de una notificación, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Su falta de práctica no impedirá que la notificación sea considerada plenamente válida."
  - id: b
    text:
      es: "Su falta de práctica determina la anulabilidad de la notificación, practicada en papel o electrónicamente."
  - id: c
    text:
      es: "Se envía al interesado sólo si lo pide de nuevo en cada procedimiento."
  - id: d
    text:
      es: "Sólo se envía cuando la notificación se practica por medios electrónicos."
  explanation:
    es: "El artículo 41.6 dice: «La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida». El aviso se envía «con independencia de que la notificación se realice en papel o por medios electrónicos». Va al dispositivo o a la dirección de correo que el interesado haya comunicado; no hay que pedirlo en cada procedimiento."
  citation: "art. 41.6 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-41
- id: m03-l02-q059
  prompt:
    es: "Una interesada recibe la notificación en papel de una resolución el lunes 19 de octubre de 2026 y accede a ella en la sede electrónica el miércoles 21. ¿Qué fecha de notificación se tomará según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes 19 de octubre de 2026."
  - id: b
    text:
      es: "El martes 20 de octubre de 2026."
  - id: c
    text:
      es: "El miércoles 21 de octubre de 2026."
  - id: d
    text:
      es: "El jueves 22 de octubre de 2026."
  explanation:
    es: "El artículo 41.7 dice: «Cuando el interesado fuera notificado por distintos cauces, se tomará como fecha de notificación la de aquélla que se hubiera producido en primer lugar». La entrega en papel del lunes 19 se produjo antes que el acceso electrónico del miércoles 21. El martes 20 y el jueves 22 son los días siguientes a cada notificación: desde ellos se cuentan los plazos (art. 30.3), pero no son la fecha de notificación."
  citation: "art. 41.7 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-42
- id: m03-l02-q060
  prompt:
    es: "De acuerdo con el artículo 42.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, todas las notificaciones que se practiquen en papel deberán:"
  options:
  - id: a
    text:
      es: "Ser publicadas además en el tablón de edictos de la Administración u Organismo actuante."
  - id: b
    text:
      es: "Ser remitidas también, en formato electrónico, a la dirección de correo electrónico que el interesado haya comunicado."
  - id: c
    text:
      es: "Ser entregadas en mano al interesado por un empleado público de la Administración notificante."
  - id: d
    correct: true
    text:
      es: "Ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante."
  explanation:
    es: "El artículo 42.1 dice que todas las notificaciones en papel «deberán ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante». El tablón de edictos no es una regla general: el artículo 44 lo prevé como publicación facultativa y previa en la notificación infructuosa, con el anuncio en el «Boletín Oficial del Estado» como vía principal. La copia por correo electrónico no sustituye a la sede: el artículo 41.6 manda enviar un aviso a la dirección que el interesado haya comunicado, y su falta de práctica no invalida la notificación. La entrega en mano por un empleado público no es la regla del artículo 42.1: es la regla del domicilio del artículo 42.2, donde puede recibirla cualquier persona mayor de catorce años."
  citation: "art. 42.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-42
- id: m03-l02-q061
  prompt:
    es: "Según el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el interesado no se halla en su domicilio al entregarse la notificación, ¿quién podrá hacerse cargo de ella?"
  options:
  - id: a
    text:
      es: "Cualquier persona mayor de dieciocho años que se encuentre en el domicilio y haga constar su identidad."
  - id: b
    text:
      es: "Sólo un familiar mayor de edad que conviva con el interesado y haga constar su identidad."
  - id: c
    correct: true
    text:
      es: "Cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad."
  - id: d
    text:
      es: "Cualquier persona mayor de dieciséis años que se encuentre en el domicilio y acredite su parentesco."
  explanation:
    es: "El artículo 42.2 dice: «podrá hacerse cargo de la misma cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad». La edad es catorce años, no dieciséis ni dieciocho. No exige parentesco ni convivencia."
  citation: "art. 42.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-10565-art-42
- id: m03-l02-q062
  prompt:
    es: "Según el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si nadie se hace cargo de la notificación en el domicilio, ¿cómo se repetirá el intento?"
  options:
  - id: a
    text:
      es: "Hasta dos veces y en horas distintas dentro de los tres días siguientes."
  - id: b
    text:
      es: "Por una sola vez y a la misma hora dentro de los diez días siguientes."
  - id: c
    text:
      es: "Por una sola vez y en hora distinta dentro de los quince días siguientes."
  - id: d
    correct: true
    text:
      es: "Por una sola vez y en una hora distinta dentro de los tres días siguientes."
  explanation:
    es: "El artículo 42.2 dice que el intento «se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes». No hay dos repeticiones. La hora tiene que ser distinta. El plazo es de tres días, no de diez ni de quince."
  citation: "art. 42.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-42
- id: m03-l02-q063
  prompt:
    es: "El primer intento de notificación en papel en el domicilio se hace el lunes 16 de noviembre de 2026 a las 17:00, sin éxito. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo puede hacerse el segundo intento?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes 17 de noviembre, a las 11:00."
  - id: b
    text:
      es: "El martes 17 de noviembre, a las 15:30."
  - id: c
    text:
      es: "El martes 17 de noviembre, a las 18:00."
  - id: d
    text:
      es: "El martes 17 de noviembre, a las 20:00."
  explanation:
    es: "El artículo 42.2 dice: «En caso de que el primer intento de notificación se haya realizado antes de las quince horas, el segundo intento deberá realizarse después de las quince horas y viceversa», con al menos tres horas de diferencia. El primer intento fue a las 17:00, después de las quince horas, así que el segundo tiene que hacerse antes de las quince. El martes 17 está dentro de los tres días siguientes y sólo las 11:00 cumplen la condición. Las 15:30, las 18:00 y las 20:00 son posteriores a las quince horas."
  citation: "art. 42.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-43
- id: m03-l02-q064
  prompt:
    es: "Según el artículo 43.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones por medios electrónicos se practicarán:"
  options:
  - id: a
    text:
      es: "Mediante su envío a la dirección de correo electrónico o al dispositivo que el interesado haya comunicado a la Administración."
  - id: b
    text:
      es: "Sólo a través de la dirección electrónica habilitada única, sin que quepa nunca la comparecencia en la sede electrónica."
  - id: c
    correct: true
    text:
      es: "Mediante comparecencia en la sede electrónica, a través de la dirección electrónica habilitada única o por ambos sistemas."
  - id: d
    text:
      es: "Sólo mediante comparecencia en la sede electrónica, sin que quepa usar la dirección electrónica habilitada."
  explanation:
    es: "El artículo 43.1 dice que se practicarán «mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas, según disponga cada Administración u Organismo». El correo electrónico comunicado sirve para avisos, no para notificar. El artículo admite los dos sistemas y su uso conjunto; no excluye ninguno."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
