m11-l02-q12:
  key:
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: This means that self-invocation (in effect, a method within the target object calling another method of the target object) does not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.
  wrong:
  - option: A transaction is started for the called method, because that method is itself marked `@Transactional`
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: This means that self-invocation (in effect, a method within the target object calling another method of the target object) does not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.
  - option: A transaction is started for the called method, because local calls within the same class are intercepted by the default advice mode
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: Local calls within the same class cannot get intercepted that way.
  - option: A transaction is started for the called method, because `@EnableTransactionManagement` wraps every method call of the bean
    anchor: spring-fw-tx-declarative-annotations#using-transactional
    sentence: In proxy mode (which is the default), only external method calls coming in through the proxy are intercepted.
