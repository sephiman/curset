# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q046
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué puede hacer en una carpeta compartida el invitado que tiene el nivel de permisos Colaborador?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo crear elementos."
  - id: b
    text:
      es: "Crear y leer elementos, y eliminar los que cree."
  - id: c
    text:
      es: "Crear, leer, modificar y eliminar todos los elementos."
  - id: d
    text:
      es: "Solo leer elementos."
  explanation:
    es: "La tabla de niveles de permisos da a Colaborador una sola actividad: solo crear elementos. Solo leer elementos es el nivel Revisor. Crear y leer, y eliminar lo propio, es Autor no editor. Crear, leer, modificar y eliminar todos los elementos es Editor."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Comprender los permisos de uso compartido»"
  difficulty: 1
