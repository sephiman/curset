  prompt:
    es: "Conforme al artículo 259 del Tratado de Funcionamiento de la Unión Europea, la falta de dictamen de la Comisión no será obstáculo para que un Estado recurra al Tribunal si ha transcurrido desde la solicitud el plazo de:"
  options:
  - id: a
    text:
      es: "Un mes."
  - id: b
    correct: true
    text:
      es: "Tres meses."
  - id: c
    text:
      es: "Dos meses."
  - id: d
    text:
      es: "Seis meses."
  explanation:
    es: "La falta de dictamen no impide recurrir pasados tres meses desde la solicitud. Un mes y dos meses son plazos más cortos que el del artículo y seis meses uno más largo."
