type: quiz
variants:
- id: m07-l05-q01
  prompt:
    en: In RFC 9110, which condition makes an HTTP request method idempotent, so that a client may repeat the request
      automatically after a communication failure?
  options:
  - id: a
    text:
      en: The server returns the identical response to every repeated request with that method
  - id: b
    text:
      en: The server keeps no log of the repeated requests and produces no side effect at all
  - id: c
    correct: true
    text:
      en: The intended effect on the server of several identical requests equals the effect of a single such request
  - id: d
    text:
      en: The method is safe, so repeating the request can never change the state of the resource
  explanation:
    en: A method is idempotent when the intended effect on the server of multiple identical requests equals the
      effect of a single one. The claim that the server returns an identical response is wrong, because repeating
      an idempotent request has the same intended effect even if the original request succeeded, though the response
      might differ. The claim that the server logs nothing and has no side effect is wrong, because a server is
      free to log each request separately and to implement other non-idempotent side effects for each idempotent
      request. The claim that only safe methods qualify is wrong, because `PUT` and `DELETE` are idempotent as well,
      besides the safe request methods.
  citation: rfc9110#section-9.2.2
  extract:
    en: A request method is considered "idempotent" if the intended effect on the server of multiple identical requests
      with that method is the same as the effect for a single such request.
- id: m07-l05-q02
  prompt:
    en: A connection closes after a client sent a `POST` request and before any response arrived. Which statement
      about retrying that request automatically is correct under RFC 9110?
  options:
  - id: a
    text:
      en: A proxy on the path may retry the request automatically, because proxies hold no state
  - id: b
    correct: true
    text:
      en: The client SHOULD NOT retry unless it knows the request is actually idempotent or can detect the original
        was never applied
  - id: c
    text:
      en: The client may retry again, without limit, whenever an automatic retry itself fails
  - id: d
    text:
      en: The client may always retry, because `POST` is a safe method
  explanation:
    en: A client should not automatically retry a non-idempotent request unless it knows the semantics are idempotent
      or can detect that the original request was never applied. The claim that a proxy may retry is wrong, because
      a proxy MUST NOT automatically retry non-idempotent requests. The claim that a failed automatic retry may
      be retried again is wrong, because a client SHOULD NOT automatically retry a failed automatic retry. The claim
      that `POST` is safe is wrong, because a `POST` request is potentially unsafe.
  citation: rfc9110#section-9.2.2
  extract:
    en: A client SHOULD NOT automatically retry a request with a non-idempotent method unless it has some means
      to know that the request semantics are actually idempotent, regardless of the method, or some means to detect
      that the original request was never applied.
- id: m07-l05-q03
  prompt:
    en: In the IETF Idempotency-Key draft, an HTTP API lets clients retry a `POST` safely. What is an idempotency
      key in that draft?
  options:
  - id: a
    text:
      en: A checksum that the resource computes from the request payload data
  - id: b
    correct: true
    text:
      en: A unique value generated by the client, which the resource uses to recognize retries of the same request
  - id: c
    text:
      en: A sequence number that the client must increase with every new request
  - id: d
    text:
      en: A token that the server issues in its first response, which the client then echoes on every retry of that
        request
  explanation:
    en: An idempotency key is a unique value generated by the client, and the resource uses it to recognize subsequent
      retries of the same request. The claim that the resource computes a checksum from the payload describes the
      idempotency fingerprint, which is generated from request payload data by the resource and only used in conjunction
      with a key. The claim that the key is an increasing sequence number is wrong, because the draft RECOMMENDS
      a UUID or a similar random identifier. The claim that the server issues the key is wrong, because clients
      MAY choose to send an `Idempotency-Key` field with any valid value to indicate the intent to perform the action
      only once.
  citation: ietf-httpapi-idempotency-key#content
  extract:
    en: An idempotency key is a unique value generated by the client which the resource uses to recognize subsequent
      retries of the same request.
- id: m07-l05-q05
  prompt:
    en: A client sends `PUT` with an `If-Match` header whose entity tag no longer matches the current representation.
      What does RFC 9110 prescribe for the origin server?
  options:
  - id: a
    correct: true
    text:
      en: It MUST NOT perform the method, and it MAY respond with `412` (Precondition Failed)
  - id: b
    text:
      en: It applies the `PUT` and returns the new entity tag in the response
  - id: c
    text:
      en: It compares the entity tags with the weak comparison function and applies the method on a weak match
  - id: d
    text:
      en: It answers `428` (Precondition Required) because the condition evaluated to false
  explanation:
    en: The origin server MUST NOT perform the method when the condition is false, and it MAY indicate the failure
      with a `412` status code. The claim that the server applies the `PUT` is wrong, because an origin server that
      evaluates an `If-Match` condition MUST NOT perform the requested method if the condition evaluates to false.
      The claim that a weak comparison is used is wrong, because an origin server MUST use the strong comparison
      function when comparing entity tags for `If-Match`. The claim that `428` reports a false condition is wrong,
      because `428` means the origin server requires the request to be conditional.
  citation: rfc9110#section-13.1.1
  extract:
    en: Instead, the origin server MAY indicate that the conditional request failed by responding with a 412 (Precondition
      Failed) status code.
- id: m07-l05-q06
  prompt:
    en: RFC 6585 defines the `428 Precondition Required` status code. In which situation does an origin server answer
      with it?
  options:
  - id: a
    text:
      en: The user sent too many requests in a given amount of time
  - id: b
    text:
      en: One or more conditions in the request header fields evaluated to false on the server
  - id: c
    correct: true
    text:
      en: It requires the request to be conditional
  - id: d
    text:
      en: The request has been accepted for processing, but the processing has not been completed
  explanation:
    en: '`428` means the origin server requires the request to be conditional. The claim that the user sent too
      many requests describes `429`, which indicates too many requests in a given amount of time. The claim that
      a condition evaluated to false describes `412` (Precondition Failed), which reports conditions that evaluated
      to false when tested on the server. The claim that the request is still being processed describes `202` (Accepted),
      which says the request has been accepted for processing without completing it.'
  citation: rfc6585#section-3
  extract:
    en: The 428 status code indicates that the origin server requires the request to be conditional.
- id: m07-l05-q07
  prompt:
    en: In RFC 9110, how does an origin server mark an entity tag in the `ETag` field as a weak validator?
  options:
  - id: a
    text:
      en: It appends the suffix `/weak` after the closing double quote
  - id: b
    correct: true
    text:
      en: It prefixes the opaque value with `W/`, which is case-sensitive
  - id: c
    text:
      en: It sends the tag in a separate `Weak-ETag` response header field
  - id: d
    text:
      en: It prefixes the quoted string with a lowercase `w/`
  explanation:
    en: The origin server marks a tag as weak by prefixing its opaque value with `W/`, case-sensitive. The claim
      that a suffix marks the tag is wrong, because the grammar is `entity-tag = [ weak ] opaque-tag`, which puts
      the weakness indicator before the opaque tag. The claim that a separate field carries weak tags is wrong,
      because an entity tag consists of an opaque quoted string, possibly prefixed by a weakness indicator. The
      claim that a lowercase prefix works is wrong, because the grammar fixes `weak` as the case-sensitive string
      `W/`.
  citation: rfc9110#section-8.8.3
  extract:
    en: then the origin server MUST mark the entity tag as weak by prefixing its opaque value with "W/" (case-sensitive).
- id: m07-l05-q08
  prompt:
    en: In RFC 9457, an HTTP API defines a new problem type for an error condition. What are problem details meant
      to expose?
  options:
  - id: a
    correct: true
    text:
      en: Greater detail about the HTTP interface itself
  - id: b
    text:
      en: Implementation internals, such as stack traces, to help the client debug
  - id: c
    text:
      en: A replacement for the domain-specific error formats that an application already defines
  - id: d
    text:
      en: Generic conditions that apply to any resource, such as a forbidden write
  explanation:
    en: Problem details expose greater detail about the HTTP interface itself. The claim that problem details expose
      implementation internals is wrong, because designers must take into account the risk of exposing attack vectors
      by exposing implementation internals through error messages. The claim that problem details replace domain-specific
      formats is wrong, because they are intended to avoid new error document formats, not to replace existing domain-specific
      formats. The claim that problem details suit generic conditions is wrong, because truly generic problems are
      usually better expressed as plain status codes.
  citation: rfc9457#section-4
  extract:
    en: Problem details are not a debugging tool for the underlying implementation; rather, they are a way to expose
      greater detail about the HTTP interface itself.
- id: m07-l05-q09
  prompt:
    en: RFC 9457 says what a new problem type definition MUST document. Which list of items does the definition
      have to include?
  options:
  - id: a
    correct: true
    text:
      en: A type URI, a title and the HTTP status code it is used with
  - id: b
    text:
      en: A type URI, a title and the `Retry-After` value that clients must honour
  - id: c
    text:
      en: A type URI, a title and the additional members of the problem details object
  - id: d
    text:
      en: A type URI, a title and an HTML page that explains how to resolve the problem
  explanation:
    en: A new problem type definition MUST document a type URI, a title and the HTTP status code for it to be used
      with. The claim that the `Retry-After` value is required is wrong, because a problem type definition MAY specify
      the use of the `Retry-After` response header in appropriate circumstances. The claim that additional members
      are required is wrong, because a problem type definition MAY specify additional members on the problem details
      object. The claim that an HTML page is required is wrong, because the problem type URI only SHOULD resolve
      to HTML documentation that explains how to resolve the problem.
  citation: rfc9457#section-4
  extract:
    en: New problem type definitions MUST document:¶ a type URI (typically, with the "http" or "https" scheme)¶
      a title that appropriately describes it (think short)¶ the HTTP status code for it to be used with¶
- id: m07-l05-q10
  prompt:
    en: In Spring Framework, which type is the representation of an RFC 9457 problem detail, a simple container
      for both the standard fields and non-standard ones?
  options:
  - id: a
    text:
      en: '`ErrorResponse`'
  - id: b
    text:
      en: '`ErrorResponseException`'
  - id: c
    correct: true
    text:
      en: '`ProblemDetail`'
  - id: d
    text:
      en: '`ResponseEntityExceptionHandler`'
  explanation:
    en: '`ProblemDetail` is the representation for an RFC 9457 problem detail. `ErrorResponse` is wrong, because
      it is the contract to expose HTTP error response details including the status, the response headers and a
      body, and all Spring MVC exceptions implement it. `ErrorResponseException` is wrong, because it is a basic
      `ErrorResponse` implementation that others can use as a convenient base class. `ResponseEntityExceptionHandler`
      is wrong, because it is a convenient base class for a `@ControllerAdvice` that handles all Spring MVC exceptions
      and renders an error response with a body.'
  citation: spring-fw-webmvc-ann-rest-exceptions#page-title
  extract:
    en: ProblemDetail — representation for an RFC 9457 problem detail; a simple container for both standard fields
      defined in the spec, and for non-standard ones.
- id: m07-l05-q11
  prompt:
    en: A server answers a request with the `202` (Accepted) status code according to RFC 9110. What does that status
      code tell the client about the processing?
  options:
  - id: a
    correct: true
    text:
      en: The request was accepted for processing, but the processing has not been completed
  - id: b
    text:
      en: A new resource was created, and a `Location` header identifies it
  - id: c
    text:
      en: The request will certainly be acted upon later, so the client need not check
  - id: d
    text:
      en: The server will later send the final status code over the same connection
  explanation:
    en: '`202` says the request has been accepted for processing, but the processing has not been completed. The
      claim that a resource was created describes `201` (Created), which a server SHOULD send with a `Location`
      header when a `POST` has created resources. The claim that the request will certainly be acted upon is wrong,
      because the request might or might not eventually be acted upon, as it might be disallowed when processing
      actually takes place. The claim that the server re-sends a final status code is wrong, because there is no
      facility in HTTP for re-sending a status code from an asynchronous operation.'
  citation: rfc9110#section-15.3.3
  extract:
    en: The 202 (Accepted) status code indicates that the request has been accepted for processing, but the processing
      has not been completed.
- id: m07-l05-q12
  prompt:
    en: In RFC 9110, a server sends the `Retry-After` header field with a response. Which two value forms can that
      field take?
  options:
  - id: a
    text:
      en: An HTTP-date, or a number of milliseconds to delay
  - id: b
    text:
      en: An ISO 8601 duration, or a number of seconds to delay
  - id: c
    text:
      en: An HTTP-date, or a signed number of seconds that may be negative, counted from the moment the server sent
        the response
  - id: d
    correct: true
    text:
      en: An HTTP-date, or a number of seconds to delay after receiving the response
  explanation:
    en: 'The `Retry-After` value is either an HTTP-date or a number of seconds to delay after receiving the response.
      The claim that the number is in milliseconds is wrong, because in the example `Retry-After: 120` the delay
      is 2 minutes, so the number counts seconds. The claim that an ISO 8601 duration is allowed is wrong, because
      the grammar is `Retry-After = HTTP-date / delay-seconds`. The claim that the number may be negative is wrong,
      because a `delay-seconds` value is a non-negative decimal integer.'
  citation: rfc9110#section-10.2.3
  extract:
    en: The Retry-After field value can be either an HTTP-date or a number of seconds to delay after receiving the
      response.
- id: m07-l05-q13
  prompt:
    en: In the IETF draft on `RateLimit` header fields, what does the `r` parameter of a service limit item in the
      `RateLimit` field convey?
  options:
  - id: a
    text:
      en: The quota allocated by the policy, measured in quota units
  - id: b
    correct: true
    text:
      en: The available quota under the identified policy
  - id: c
    text:
      en: The number of seconds within which the client can use no more than the available quota
  - id: d
    text:
      en: The partition key associated to the corresponding request
  explanation:
    en: The `r` parameter conveys the available quota under the identified policy. The claim that `r` is the allocated
      quota describes the `q` parameter of a quota policy item, which indicates the quota allocated by the policy.
      The claim that `r` is a number of seconds describes the `t` parameter, which conveys the effective window
      under the identified policy. The claim that `r` is a partition key describes the `pk` parameter, which conveys
      the partition key associated to the request.
  citation: ietf-httpapi-ratelimit-headers#content
  extract:
    en: 'r: This REQUIRED parameter value conveys the available quota under the identified policy'
- id: m07-l05-q14
  prompt:
    en: 'A response carries the header `RateLimit: "default";r=5;t=30` from the IETF draft on `RateLimit` header
      fields. What may the client assume about further requests?'
  options:
  - id: a
    text:
      en: The server guarantees five more requests, because it advertised the quota
  - id: b
    text:
      en: The full limit is restored exactly when the 30 seconds of the window have elapsed
  - id: c
    text:
      en: The quota and the window stay fixed between requests, so the values can be cached
  - id: d
    correct: true
    text:
      en: 'Nothing: a positive available quota does not guarantee that further requests will be served'
  explanation:
    en: A client MUST NOT assume that a positive available quota is a guarantee that further requests will be served.
      The claim that the server guarantees five requests is wrong, because conveyed quota hints do not imply any
      service guarantee. The claim that the full limit returns after the window is wrong, because the client MUST
      NOT assume that all its service limit will be fully restored after the time indicated by the effective window
      parameter. The claim that the values stay fixed is wrong, because the server MAY arbitrarily alter the available
      quota and effective window between subsequent requests.
  citation: ietf-httpapi-ratelimit-headers#content
  extract:
    en: Clients MUST NOT assume that a positive available quota is a guarantee that further requests will be served.
- id: m07-l05-q15
  prompt:
    en: In the OpenAPI Specification, which field of the OpenAPI Object is a REQUIRED string with the version number
      of the specification that the document uses?
  options:
  - id: a
    text:
      en: '`info.version`'
  - id: b
    text:
      en: '`$self`'
  - id: c
    text:
      en: '`jsonSchemaDialect`'
  - id: d
    correct: true
    text:
      en: '`openapi`'
  explanation:
    en: The `openapi` field holds the version number of the OpenAPI Specification that the document uses. `info.version`
      is wrong, because the `openapi` field is not related to it and it describes the version of the OpenAPI document.
      `$self` is wrong, because it holds the self-assigned URI of the document, which also serves as its base URI.
      `jsonSchemaDialect` is wrong, because it is the default value for the `$schema` keyword within Schema Objects
      of the document.
  citation: openapi-spec#x4-1-1-fixed-fields
  extract:
    en: REQUIRED. This string MUST be the version number of the OpenAPI Specification that the OpenAPI document
      uses.
