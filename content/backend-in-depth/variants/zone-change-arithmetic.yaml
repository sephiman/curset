exercise: m11-l02-ex-zone-change-arithmetic
lesson: m11-l02
citation: javadoc-zoneddatetime#plusDays(long)
file: Main.java
prompt: A `ZonedDateTime` in `Europe/Madrid`, where the clocks change in 2026, is moved with one `plus` method. What does this program print, line by line?
difficulty: 3
tags:
- time
- zones
parameters: {}
cases:
- y: 2026
  mo: 3
  d: 28
  h: 12
  mi: 0
  call: plusDays(1)
  swapped: plusHours(24)
  citation: javadoc-zoneddatetime#plusDays(long); javadoc-zoneddatetime#plusHours(long)
  why: The first line is the start, `2026-03-28T12:00+01:00[Europe/Madrid]`. `plusDays(1)` works on the local time-line, so it adds 1 day to the local date-time `2026-03-28T12:00` and the zone rules then
    give the offset. The local date-time `2026-03-29T12:00` has offset `+02:00` in `Europe/Madrid`.
- y: 2026
  mo: 3
  d: 28
  h: 12
  mi: 0
  call: plusHours(24)
  swapped: plusDays(1)
  citation: javadoc-zoneddatetime#plusHours(long); javadoc-zoneddatetime#plusDays(long)
  why: The first line is the start, `2026-03-28T12:00+01:00[Europe/Madrid]`. `plusHours(24)` works on the instant time-line, so the result is exactly 24 hours after `2026-03-28T12:00+01:00[Europe/Madrid]`.
    The local date-time `2026-03-29T13:00` has offset `+02:00`, because the clocks changed in between.
