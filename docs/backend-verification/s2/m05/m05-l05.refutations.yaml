m05-l05-q09:
  key:
    anchor: spring-fw-webflux-new-framework#webflux-framework-choice
    sentence: If you have blocking persistence APIs (JPA, JDBC) or networking APIs to use, Spring MVC is the best choice for common architectures at least.
  wrong:
  - option: Spring WebFlux with annotated controllers
    anchor: spring-fw-webflux-new-framework#webflux-framework-choice
    sentence: It is technically feasible with both Reactor and RxJava to perform blocking calls on a separate thread but you would not be making the most of a non-blocking web stack.
    exclusive: true
  - option: Spring WebFlux functional endpoints
    anchor: spring-fw-webflux-new-framework#webflux-framework-choice
    sentence: It is technically feasible with both Reactor and RxJava to perform blocking calls on a separate thread but you would not be making the most of a non-blocking web stack.
    exclusive: true
  - option: Spring WebFlux, because every Spring MVC application should be migrated
    anchor: spring-fw-webflux-new-framework#webflux-framework-choice
    sentence: If you have a Spring MVC application that works fine, there is no need to change.
