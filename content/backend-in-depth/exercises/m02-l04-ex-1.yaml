- id: m02-l04-q03
  prompt:
    en: Three unions chain the elements 0, 1, 2 and 3 in a parent array, where each union links the leader of the
      first set under the leader of the second. A `find(0)` with path compression follows. What is printed?
  options:
  - id: a
    text:
      en: 'before [1, 2, 3, 3]

        after find(0) [1, 2, 3, 3]

        components 1'
  - id: b
    text:
      en: 'before [1, 2, 3, 3]

        after find(0) [3, 2, 3, 3]

        components 1'
  - id: c
    text:
      en: 'before [1, 2, 3, 3]

        after find(0) [3, 3, 3, 3]

        components 4'
  - id: d
    correct: true
    text:
      en: 'before [1, 2, 3, 3]

        after find(0) [3, 3, 3, 3]

        components 1'
  explanation:
    en: The unions leave the chain 0, 1, 2, 3 with leader 3, and `find(0)` redirects the pointers of 0, 1 and 2
      to 3, so it prints `after find(0) [3, 3, 3, 3]` and one leader. The array `[1, 2, 3, 3]` after the call shows
      a `find` without path compression. The array `[3, 2, 3, 3]` compresses only the pointer of 0, but the recursion
      also updates every ancestor on the way up. The count `components 4` counts elements, but a component is a
      set with one leader.
  citation: erickson-union-find#p4
