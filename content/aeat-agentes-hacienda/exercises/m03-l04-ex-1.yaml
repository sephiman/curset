# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0302
  prompt:
    es: "De acuerdo con el artículo 34.1.g) de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el derecho a obtener copia sellada de los documentos presentados ante la Administración:"
  options:
  - id: a
    text:
      es: "Permite obtener la copia sellada aunque el obligado no aporte los originales para su cotejo."
  - id: b
    text:
      es: "Comprende la devolución de los originales aunque deban obrar en el expediente."
  - id: c
    text:
      es: "Se limita a la certificación de las declaraciones presentadas, sin incluir copia de ellas."
  - id: d
    correct: true
    text:
      es: "Comprende el derecho a la devolución de los originales presentados para su cotejo, en el caso de que no deban obrar en el expediente."
  explanation:
    es: "El artículo 34.1.g) reconoce la copia sellada si se aportan los originales para el cotejo y la devolución de estos cuando no deban obrar en el expediente. Sin originales no hay copia sellada, los que deben constar en el expediente no se devuelven y el derecho no se limita a la certificación, porque incluye copia de las declaraciones presentadas."
