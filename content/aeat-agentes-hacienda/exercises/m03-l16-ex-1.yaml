# anchor: boe-a-2006-20764-art-44
- id: m03-l16-q0001
  prompt:
    es: "De acuerdo con el artículo 44 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, a efectos del cálculo del impuesto las rentas del contribuyente se clasifican, según proceda, como:"
  options:
  - id: a
    text:
      es: "renta ordinaria o renta extraordinaria."
  - id: b
    text:
      es: "renta sujeta o renta exenta de gravamen."
  - id: c
    text:
      es: "renta del trabajo o renta del capital."
  - id: d
    correct: true
    text:
      es: "renta general o renta del ahorro."
  explanation:
    es: "El artículo 44 solo conoce dos clases a efectos del cálculo: la renta general y la renta del ahorro. La distinción entre renta ordinaria y extraordinaria no aparece en la ley. Sujeta y exenta es una clasificación previa, que decide si la renta entra en el impuesto, no cómo se calcula. Rendimientos del trabajo y del capital son categorías de rendimientos que luego se reparten entre las dos clases."
  citation: "art. 44 LIRPF"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-45
- id: m03-l16-q0002
  prompt:
    es: "De acuerdo con el artículo 45 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la renta general:"
  options:
  - id: a
    text:
      es: "Las imputaciones de renta de los artículos 85, 91, 92 y 95 de la ley forman la renta del ahorro."
  - id: b
    text:
      es: "Solo la forman los rendimientos del trabajo y de actividades económicas, sin ganancias patrimoniales."
  - id: c
    correct: true
    text:
      es: "Forman parte de ella las imputaciones de renta a que se refieren los artículos 85, 91, 92 y 95 de la ley."
  - id: d
    text:
      es: "Los rendimientos del capital mobiliario del apartado 1 del artículo 25 forman parte de ella."
  explanation:
    es: "La renta general incluye los rendimientos y las ganancias y pérdidas patrimoniales que no sean renta del ahorro, y además las imputaciones de renta de los artículos 85, 91, 92 y 95. Esas imputaciones no figuran en el artículo 46, así que no son renta del ahorro. Limitar la renta general al trabajo y a las actividades económicas deja fuera, entre otras, las ganancias patrimoniales que no derivan de transmisiones. Los rendimientos del apartado 1 del artículo 25 son renta del ahorro según el artículo 46.a)."
  citation: "art. 45 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-46
- id: m03-l16-q0003
  prompt:
    es: "Según el artículo 46 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de las siguientes rentas constituye renta del ahorro?"
  options:
  - id: a
    text:
      es: "Los rendimientos del capital inmobiliario derivados del arrendamiento de viviendas."
  - id: b
    correct: true
    text:
      es: "Los rendimientos del capital mobiliario previstos en los apartados 1, 2 y 3 del artículo 25 de esa ley."
  - id: c
    text:
      es: "Los rendimientos íntegros del trabajo satisfechos por un único pagador."
  - id: d
    text:
      es: "Las imputaciones de rentas inmobiliarias a que se refiere el artículo 85 de esa ley."
  explanation:
    es: "El artículo 46.a) incluye en la renta del ahorro los rendimientos del capital mobiliario de los apartados 1, 2 y 3 del artículo 25. Los rendimientos del capital inmobiliario y los del trabajo no figuran en la lista del artículo 46 y van a la renta general, igual que las imputaciones del artículo 85, que el artículo 45 asigna expresamente a la renta general."
  citation: "art. 46 LIRPF"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-46
- id: m03-l16-q0004
  prompt:
    es: "Según el artículo 46 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué parte de los rendimientos del capital mobiliario del apartado 2 del artículo 25 forma parte de la renta general?"
  options:
  - id: a
    text:
      es: "La correspondiente al exceso de los capitales propios cedidos a una entidad vinculada respecto de multiplicar por dos los fondos propios, en la parte que corresponda a la participación del contribuyente."
  - id: b
    correct: true
    text:
      es: "La correspondiente al exceso de los capitales propios cedidos a una entidad vinculada respecto de multiplicar por tres los fondos propios, en la parte que corresponda a la participación del contribuyente."
  - id: c
    text:
      es: "La correspondiente al exceso de los capitales propios cedidos a una entidad vinculada respecto de multiplicar por tres el capital social, en la parte que corresponda a la participación del contribuyente."
  - id: d
    text:
      es: "La totalidad de los rendimientos cuando el contribuyente participe en la entidad vinculada en más del 25 por ciento."
  explanation:
    es: "El artículo 46.a) lleva a la renta general los rendimientos del exceso de capitales propios cedidos a una entidad vinculada sobre el triple de los fondos propios, en la parte que corresponde a la participación del contribuyente. Multiplicar por dos cambia el coeficiente, y el capital social no es la magnitud que fija la ley, que habla de fondos propios. Integrar la totalidad de los rendimientos por superar un porcentaje de participación inventa un umbral que la regla no contiene."
  citation: "art. 46 LIRPF"
  difficulty: 3
  tags:
  - "cifra"
# anchor: boe-a-2006-20764-art-46
- id: m03-l16-q0005
  prompt:
    es: "Conforme al artículo 46 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si la vinculación con la entidad no se define en función de la relación socios o partícipes-entidad, el porcentaje de participación que se considera para computar el exceso de capitales propios es:"
  options:
  - id: a
    correct: true
    text:
      es: "el 25 por ciento de participación."
  - id: b
    text:
      es: "el 20 por ciento de participación."
  - id: c
    text:
      es: "el 30 por ciento de participación."
  - id: d
    text:
      es: "el 50 por ciento de participación."
  explanation:
    es: "Cuando la vinculación no se mide por la relación entre la entidad y sus socios o partícipes, el artículo 46.a) fija un porcentaje de participación del 25 por ciento para computar el exceso. El 20 y el 50 por ciento no figuran en la regla. El 30 por ciento es la cifra del límite de las reducciones por previsión social del artículo 52, ajena a este cómputo."
  citation: "art. 46 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-46
- id: m03-l16-q0006
  prompt:
    es: "De acuerdo con el artículo 46 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, constituyen renta del ahorro las ganancias y pérdidas patrimoniales que:"
  options:
  - id: a
    text:
      es: "se pongan de manifiesto con ocasión de cualquier variación en la composición del patrimonio."
  - id: b
    text:
      es: "procedan de ayudas públicas recibidas por el contribuyente en el período impositivo."
  - id: c
    text:
      es: "deriven de premios obtenidos en juegos, rifas o concursos."
  - id: d
    correct: true
    text:
      es: "se pongan de manifiesto con ocasión de transmisiones de elementos patrimoniales."
  explanation:
    es: "Solo las ganancias y pérdidas que se ponen de manifiesto con ocasión de transmisiones de elementos patrimoniales son renta del ahorro (art. 46.b). Las demás ganancias, como las que provienen de ayudas públicas o de premios, no derivan de una transmisión y quedan en la renta general según el artículo 45. La referencia a cualquier variación del patrimonio es demasiado amplia: incluye ganancias sin transmisión."
  citation: "art. 46.b) LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-17
- id: m03-l16-q0124
  prompt:
    es: "Conforme al artículo 17.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las remuneraciones en concepto de gastos de representación se califican como:"
  options:
  - id: a
    text:
      es: "rendimientos del capital mobiliario, que forman parte de la renta del ahorro."
  - id: b
    text:
      es: "ganancias patrimoniales, que forman parte de la renta general."
  - id: c
    text:
      es: "rendimientos de actividades económicas, que forman parte de la renta general."
  - id: d
    correct: true
    text:
      es: "rendimientos íntegros del trabajo, que forman parte de la renta general."
  explanation:
    es: "Las remuneraciones por gastos de representación son rendimientos íntegros del trabajo (art. 17.1.c) y, como no figuran en el artículo 46, forman parte de la renta general. No son rendimientos del capital mobiliario, ni ganancias patrimoniales, ni rendimientos de actividades económicas."
  citation: "art. 17.1.c) LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-46
- id: m03-l16-q0196
  prompt:
    es: "Conforme al artículo 46 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los rendimientos del capital mobiliario de los apartados 1, 2 y 3 del artículo 25:"
  options:
  - id: a
    text:
      es: "Constituyen renta general, salvo los del apartado 3, que son renta del ahorro cuando proceden de la transmisión de elementos patrimoniales del contribuyente, y los del apartado 2 que correspondan a entidades vinculadas."
  - id: b
    correct: true
    text:
      es: "Constituyen renta del ahorro, salvo los del apartado 2 correspondientes al exceso de capitales propios cedidos a una entidad vinculada sobre el triple de los fondos propios."
  - id: c
    text:
      es: "Constituyen renta del ahorro sin excepción alguna, incluido el exceso de capitales propios cedidos a una entidad vinculada."
  - id: d
    text:
      es: "Constituyen renta del ahorro solo si proceden de entidades residentes en territorio español."
  explanation:
    es: "Los rendimientos de los apartados 1, 2 y 3 del artículo 25 son renta del ahorro, con la salvedad del exceso de capitales propios cedidos a una entidad vinculada sobre tres veces los fondos propios, que va a la renta general (art. 46.a). No son renta general por defecto, la excepción existe y la ley no limita la regla a entidades residentes."
  citation: "art. 46 LIRPF"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-47
- id: m03-l16-q0007
  prompt:
    es: "De acuerdo con el artículo 47 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, atendiendo a la clasificación de la renta, la base imponible se divide en dos partes:"
  options:
  - id: a
    text:
      es: "la base imponible regular y la base imponible irregular."
  - id: b
    text:
      es: "la base imponible estatal y la base imponible autonómica."
  - id: c
    correct: true
    text:
      es: "la base imponible general y la base imponible del ahorro."
  - id: d
    text:
      es: "la base imponible de los rendimientos y la de las ganancias patrimoniales."
  explanation:
    es: "El artículo 47.2 divide la base imponible según la clasificación de la renta: general y del ahorro. Regular e irregular no son conceptos de la ley. La separación entre estatal y autonómica opera en la cuota, no en la base. Rendimientos y ganancias patrimoniales se integran dentro de cada una de las dos bases."
  citation: "art. 47 LIRPF"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-50
- id: m03-l16-q0018
  prompt:
    es: "De acuerdo con el artículo 50.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la base liquidable general es el resultado de practicar en la base imponible general, exclusivamente y por este orden, las reducciones por:"
  options:
  - id: a
    text:
      es: "pensiones compensatorias y anualidades por alimentos, previsión social, sistemas a favor de personas con discapacidad, patrimonios protegidos, y las de la disposición adicional undécima."
  - id: b
    text:
      es: "previsión social, sistemas a favor de personas con discapacidad, patrimonios protegidos, pensiones compensatorias y anualidades por alimentos, y por obtención de rendimientos del trabajo."
  - id: c
    correct: true
    text:
      es: "previsión social, sistemas a favor de personas con discapacidad, patrimonios protegidos, pensiones compensatorias y anualidades por alimentos, y las de la disposición adicional undécima."
  - id: d
    text:
      es: "previsión social, patrimonios protegidos, pensiones compensatorias y anualidades por alimentos, y las de la disposición adicional undécima, sin incluir las de sistemas a favor de personas con discapacidad."
  explanation:
    es: "El artículo 50.1 enumera, exclusivamente y por este orden, los artículos 51, 53, 54, 55 y la disposición adicional undécima: previsión social, sistemas a favor de personas con discapacidad, patrimonios protegidos y pensiones compensatorias y anualidades por alimentos, más la disposición adicional. Alterar el orden contradice la palabra \"orden\" del precepto. La reducción por rendimientos del trabajo se practica al calcular los rendimientos (art. 20), no en la base imponible general. Y los sistemas a favor de personas con discapacidad (art. 53) sí están en la lista."
  citation: "art. 50.1 LIRPF"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-50
- id: m03-l16-q0020
  prompt:
    es: "Según el artículo 50.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la base liquidable del ahorro es el resultado de disminuir la base imponible del ahorro en:"
  options:
  - id: a
    text:
      es: "el remanente, si lo hubiera, de las reducciones de los artículos 51, 53 y 54, sin que pueda resultar negativa."
  - id: b
    correct: true
    text:
      es: "el remanente, si lo hubiera, de la reducción prevista en el artículo 55, sin que pueda resultar negativa."
  - id: c
    text:
      es: "el importe íntegro del mínimo personal y familiar, sin que pueda resultar negativa."
  - id: d
    text:
      es: "el saldo negativo de la base liquidable general de los cuatro años anteriores."
  explanation:
    es: "La base liquidable del ahorro solo se reduce con el remanente de la reducción por pensiones compensatorias y anualidades por alimentos del artículo 55, que no pudo aplicarse en la base general. Las reducciones de los artículos 51, 53 y 54 se practican únicamente en la base general. El mínimo personal y familiar no es una reducción de la base: se tiene en cuenta al aplicar la escala. Los saldos negativos de la base general se compensan con bases generales posteriores, no con la del ahorro."
  citation: "art. 50.2 LIRPF"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-50
- id: m03-l16-q0021
  prompt:
    es: "De acuerdo con el artículo 50.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si la base liquidable general resultase negativa, su importe podrá ser compensado con los de las bases liquidables generales positivas que se obtengan:"
  options:
  - id: a
    correct: true
    text:
      es: "en los cuatro años siguientes."
  - id: b
    text:
      es: "en los cinco años siguientes."
  - id: c
    text:
      es: "en los dos años siguientes."
  - id: d
    text:
      es: "en el mismo período impositivo, con la base liquidable del ahorro."
  explanation:
    es: "La base liquidable general negativa se compensa con las bases liquidables generales positivas de los cuatro años siguientes (art. 50.3). Cinco años es el plazo del artículo 52.2 para las aportaciones a previsión social. Dos años acorta el plazo. Y la base del ahorro no sirve de contrapartida: la compensación es entre bases generales."
  citation: "art. 50.3 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-18
- id: m03-l16-q0123
  prompt:
    es: "De acuerdo con los artículos 18.2 y 20 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la reducción por obtención de rendimientos del trabajo y la de rendimientos con período de generación superior a dos años se practican:"
  options:
  - id: a
    text:
      es: "en la base imponible general, antes de las reducciones por previsión social."
  - id: b
    text:
      es: "en la base liquidable del ahorro, por el remanente que no haya cabido."
  - id: c
    text:
      es: "en la cuota íntegra estatal, una vez aplicada la escala."
  - id: d
    correct: true
    text:
      es: "en el cálculo de los rendimientos, no en la base imponible general."
  explanation:
    es: "Ambas reducciones se practican al calcular el rendimiento neto, no en la base imponible general, que solo admite las reducciones del artículo 50.1. No se aplican en la base del ahorro ni en la cuota íntegra, porque minoran el rendimiento antes de integrarlo."
  citation: "arts. 18.2 y 20 LIRPF"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2006-20764-art-50
- id: m03-l16-q0193
  prompt:
    es: "Según el artículo 50.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la base liquidable general que resulte negativa:"
  options:
  - id: a
    text:
      es: "Su importe puede compensarse con la base liquidable del ahorro del mismo período impositivo."
  - id: b
    text:
      es: "Su importe puede compensarse con las bases liquidables generales positivas de los cinco años siguientes."
  - id: c
    text:
      es: "Su importe se pierde, salvo que el contribuyente aporte a un plan de pensiones en el ejercicio siguiente una cantidad equivalente a la base negativa, en cuyo caso se reduce de la base imponible general de ese ejercicio."
  - id: d
    correct: true
    text:
      es: "Su importe puede compensarse con las bases liquidables generales positivas de los cuatro años siguientes, en la cuantía máxima que permita cada uno de ellos."
  explanation:
    es: "La base liquidable general negativa se compensa con las positivas de los cuatro años siguientes, en la cuantía máxima de cada uno (art. 50.3). No se compensa con la base del ahorro del mismo período. Cinco años es el plazo de las aportaciones a previsión social. Y la ley no la extingue ni la condiciona a aportaciones posteriores."
  citation: "art. 50.3 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
