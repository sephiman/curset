# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q015
  prompt:
    es: "De acuerdo con el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde a los Ministros aprobar y comprometer los gastos propios de sus presupuestos, salvo los casos reservados por la Ley a la competencia:"
  options:
  - id: a
    correct: true
    text:
      es: "del Consejo de Ministros."
  - id: b
    text:
      es: "del Ministro de Hacienda."
  - id: c
    text:
      es: "de la Presidencia del Gobierno."
  - id: d
    text:
      es: "de la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 74.1 reserva a la competencia del Consejo de Ministros los casos que la Ley así establezca. El Ministro de Hacienda no tiene reservada esa competencia en el artículo. La Presidencia del Gobierno tampoco. La Intervención General de la Administración del Estado controla el gasto, no lo aprueba."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q016
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, por debajo de los límites que fijan los Ministros, aprobar y comprometer gastos corresponde, en su ámbito respectivo, a:"
  options:
  - id: a
    text:
      es: "los Directores Generales y Subdirectores Generales del departamento."
  - id: b
    text:
      es: "los Secretarios Generales Técnicos de cada departamento ministerial."
  - id: c
    text:
      es: "los Delegados del Gobierno y Subdelegados en cada provincia."
  - id: d
    correct: true
    text:
      es: "los Secretarios de Estado y el Subsecretario del departamento."
  explanation:
    es: "El artículo 74.1 dice que los Ministros fijan los límites por debajo de los cuales esas competencias corresponden, en su ámbito respectivo, a los Secretarios de Estado y Subsecretario del departamento. Los directores generales, los secretarios generales técnicos y los delegados del Gobierno no aparecen en ese párrafo."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q017
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, además de aprobar y comprometer gastos, ¿qué competencias tienen los Ministros respecto de las obligaciones y los pagos?"
  options:
  - id: a
    text:
      es: "Reconocer las obligaciones económicas y ordenar directamente la realización de los pagos."
  - id: b
    text:
      es: "Interesar del Ordenador general de pagos del Estado el reconocimiento de las obligaciones y su pago."
  - id: c
    text:
      es: "Proponer al Consejo de Ministros el reconocimiento de las obligaciones y la realización de los pagos."
  - id: d
    correct: true
    text:
      es: "Reconocer las obligaciones económicas e interesar del Ordenador general de pagos del Estado el pago."
  explanation:
    es: "El artículo 74.1 atribuye a los Ministros reconocer las obligaciones económicas e interesar del Ordenador general de pagos del Estado la realización de los pagos. Ordenar los pagos corresponde al Ordenador general, no al Ministro. Reconocer la obligación es del propio Ministro, que no lo interesa de otro órgano. El Consejo de Ministros no interviene en ese reconocimiento."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q018
  prompt:
    es: "Un gasto del presupuesto de un ministerio es de los que la Ley reserva al Consejo de Ministros. Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede el Ministro aprobarlo y comprometerlo por sí?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 74.1 exceptúa los casos reservados por la Ley al Consejo de Ministros."
  - id: b
    text:
      es: "Sí, porque aprobar y comprometer los gastos propios de su presupuesto le corresponde siempre."
  - id: c
    text:
      es: "Sí, si el importe supera el límite que él mismo ha fijado para los Secretarios de Estado."
  - id: d
    text:
      es: "No, porque la aprobación de todo gasto corresponde al Ordenador general de pagos del Estado."
  explanation:
    es: "El artículo 74.1 atribuye a los Ministros aprobar y comprometer los gastos de su presupuesto, pero salva los casos reservados por la Ley al Consejo de Ministros. Por eso no pueden aprobarlo por sí. Decir que la competencia es siempre del Ministro ignora la salvedad. Superar el límite que fija para los Secretarios de Estado no le da competencia sobre un gasto reservado. El Ordenador general de pagos ordena pagos y no aprueba gastos."
  citation: "art. 74.1 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q020
  prompt:
    es: "De acuerdo con el artículo 74.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, además de en los organismos autónomos del Estado, compete al presidente o director aprobar y comprometer el gasto, reconocer y pagar las obligaciones en:"
  options:
  - id: a
    text:
      es: "las sociedades mercantiles estatales con presupuesto estimativo."
  - id: b
    text:
      es: "las fundaciones del sector público estatal con presupuesto estimativo."
  - id: c
    correct: true
    text:
      es: "las entidades integrantes del sector público estatal con presupuesto limitativo."
  - id: d
    text:
      es: "los departamentos ministeriales a los que estén adscritos."
  explanation:
    es: "El artículo 74.2 atribuye esas competencias a los presidentes o directores de los organismos autónomos y de las entidades integrantes del sector público estatal con presupuesto limitativo. Las sociedades y fundaciones con presupuesto estimativo no están en el precepto. Los departamentos ministeriales se rigen por el apartado 1, donde el competente es el Ministro."
  citation: "art. 74.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q022
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el pago de las obligaciones es correcta según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "El Ministro reconoce las obligaciones y las paga directamente, mientras que el director de un organismo autónomo solo las reconoce y propone su pago."
  - id: b
    correct: true
    text:
      es: "Al presidente o director de un organismo autónomo le compete pagar las obligaciones, mientras que el Ministro interesa su pago del Ordenador general de pagos."
  - id: c
    text:
      es: "El presidente o director de un organismo autónomo reconoce las obligaciones, pero su pago corresponde siempre al Ministro del departamento de adscripción."
  - id: d
    text:
      es: "Tanto el Ministro como el director de un organismo autónomo ordenan y realizan por sí mismos los pagos materiales de las obligaciones."
  explanation:
    es: "El artículo 74.2 atribuye a los presidentes o directores de los organismos autónomos el reconocimiento y el pago de las obligaciones. El artículo 74.1 da al Ministro reconocer las obligaciones e interesar del Ordenador general de pagos la realización de los pagos. Las opciones que invierten los papeles o que atribuyen al Ministro el pago directo o al Ministro el pago de las obligaciones del organismo no coinciden con el texto. Ordenar el pago es función del Ordenador general de pagos."
  citation: "art. 74.2 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q023
  prompt:
    es: "Un gasto de un organismo autónomo del Estado es de los que la Ley reserva al Consejo de Ministros. Según el artículo 74.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede su director aprobarlo y comprometerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque el artículo 74.2 no contiene ninguna salvedad a favor del Consejo de Ministros."
  - id: b
    text:
      es: "Sí, siempre que el Ministro del departamento de adscripción lo autorice por escrito."
  - id: c
    correct: true
    text:
      es: "No, porque el artículo 74.2 contiene la misma salvedad legal a favor del Consejo de Ministros."
  - id: d
    text:
      es: "No, porque en los organismos autónomos el gasto lo aprueba siempre el Ministro de adscripción."
  explanation:
    es: "El artículo 74.2 empieza con «con la misma salvedad legal»: la competencia del presidente o director cede ante los casos que la Ley reserva al Consejo de Ministros. Negar que haya salvedad contradice el texto. La autorización escrita del Ministro no está prevista. La aprobación del gasto en un organismo autónomo no corresponde siempre al Ministro de adscripción."
  citation: "art. 74.2 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1996-2627-regla-14
- id: m05-l03-q025
  prompt:
    es: "¿Qué se solicita al expedir un documento RC al inicio de un expediente de gasto, según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Que se autorice la realización del gasto por una cuantía cierta o aproximada."
  - id: b
    text:
      es: "Que se declare la existencia de un crédito exigible contra la Hacienda Pública."
  - id: c
    text:
      es: "Que se acuerde con un tercero la realización del gasto previamente aprobado."
  - id: d
    correct: true
    text:
      es: "Que se certifique la existencia de crédito disponible para realizar el gasto."
  explanation:
    es: "Con el RC el Servicio Gestor solicita que se certifique la existencia de crédito disponible para el gasto. Autorizar el gasto por una cuantía cierta o aproximada es la aprobación, que se documenta con el A. Declarar un crédito exigible es el reconocimiento de la obligación, que se documenta con el OK. Acordar con un tercero la realización del gasto es el compromiso, que se documenta con el D."
  citation: "regla 14.1 IOC"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-6
- id: m05-l03-q027
  prompt:
    es: "Según la regla 6.1 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, ¿en qué momento se retiene el importe de una transferencia de crédito en las aplicaciones presupuestarias que van a ser minoradas?"
  options:
  - id: a
    correct: true
    text:
      es: "Con carácter previo a la tramitación del expediente de transferencia de crédito."
  - id: b
    text:
      es: "Una vez aprobada la transferencia por el órgano que tenga atribuida la competencia."
  - id: c
    text:
      es: "Cuando la Dirección General de Presupuestos expide el documento MC de la transferencia."
  - id: d
    text:
      es: "Al cierre del ejercicio, con las minoraciones de crédito definitivas."
  explanation:
    es: "La regla 6.1 dice que, «con carácter previo a la tramitación de un expediente de transferencia de crédito, se deberá retener su importe en las aplicaciones presupuestarias que vayan a ser minoradas». Retenerlo una vez aprobada la transferencia llega tarde: la regla 6.2 sitúa en la aprobación la expedición de los dos documentos MC, y la regla 6.3 consigna en el MC negativo el registro de «la retención de crédito efectuada con anterioridad». Retenerlo al expedir el documento MC también llega tarde: el MC negativo ya lleva el número de una retención hecha antes. Retenerlo al cierre del ejercicio llega todavía más tarde: la retención precede a la tramitación del expediente, y las minoraciones definitivas son su resultado."
  citation: "regla 6.1 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "fecha"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q029
  prompt:
    es: "Según el artículo 73.7 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué determina que se acumulen en un solo acto las fases de ejecución precisas?"
  options:
  - id: a
    text:
      es: "La cuantía del gasto, si no supera el límite que fije el Ministro."
  - id: b
    text:
      es: "La solicitud del tercero con quien se contrata el gasto."
  - id: c
    text:
      es: "El acuerdo previo del Consejo de Ministros en cada caso."
  - id: d
    correct: true
    text:
      es: "La naturaleza de la operación o gasto."
  explanation:
    es: "El artículo 73.7 acumula en un solo acto las fases precisas cuando lo determine la naturaleza de la operación o gasto. El límite de cuantía que fijan los Ministros sirve para repartir competencias entre órganos, no para acumular fases. La solicitud del tercero no figura. Tampoco se exige acuerdo del Consejo de Ministros."
  citation: "art. 73.7 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1996-2627-regla-24
- id: m05-l03-q030
  prompt:
    es: "Un servicio gestor autoriza y compromete en un único acto el gasto de un suministro menor del ejercicio corriente. Según la regla 24.2 de la Instrucción de operatoria contable, ¿qué documento expide?"
  options:
  - id: a
    text:
      es: "Un documento mixto ADOK."
  - id: b
    text:
      es: "Un documento A y, a continuación, un documento D."
  - id: c
    correct: true
    text:
      es: "Un documento mixto AD."
  - id: d
    text:
      es: "Un documento RC seguido de un documento OK."
  explanation:
    es: "La regla 24.2 prevé el documento mixto AD cuando la autorización y el compromiso del gasto se acuerdan en un acto único. El ADOK exige acumular además el reconocimiento de la obligación. Con un solo acto no hay dos documentos separados. El RC es un trámite de inicio del expediente y el OK documenta el reconocimiento."
  citation: "regla 24.2 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-24
- id: m05-l03-q031
  prompt:
    es: "¿En cuál de los siguientes casos expide el Servicio gestor un documento mixto ADOK según la regla 24.2 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Cuando en un mismo acto se acumulan la autorización del gasto y su compromiso con el tercero."
  - id: b
    text:
      es: "Cuando en un mismo acto se acumulan el compromiso del gasto y el reconocimiento de la obligación."
  - id: c
    correct: true
    text:
      es: "Cuando en un mismo acto se acumulan la autorización, el compromiso y el reconocimiento de la obligación."
  - id: d
    text:
      es: "Cuando en un mismo acto se acumulan la autorización del gasto, su compromiso y la ordenación del pago."
  explanation:
    es: "El documento ADOK reúne autorización, compromiso y reconocimiento de la obligación en un mismo acto. Si solo se acumulan autorización y compromiso, el documento es el AD. La regla 24.2 no prevé un documento mixto para compromiso y reconocimiento por sí solos. La ordenación del pago no es una de las fases que la regla acumula en ADOK."
  citation: "regla 24.2 IOC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q034
  prompt:
    es: "¿Qué documento se utiliza en las operaciones de autorización del gasto imputables a Presupuestos futuros, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El documento D de ejercicios posteriores."
  - id: b
    correct: true
    text:
      es: "El documento A de ejercicios posteriores."
  - id: c
    text:
      es: "El documento AD de ejercicios posteriores."
  - id: d
    text:
      es: "El documento RC de ejercicios posteriores."
  explanation:
    es: "El apartado sexto.1.h) asigna el documento A de ejercicios posteriores a la autorización del gasto imputable a Presupuestos futuros. El D de ejercicios posteriores recoge el compromiso. El AD de ejercicios posteriores combina autorización y compromiso. El RC de ejercicios posteriores sirve para solicitar el certificado de cumplimiento de los límites."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q035
  prompt:
    es: "¿En qué operaciones se utiliza el documento D de ejercicio corriente, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "En las operaciones de autorización del gasto imputables al Presupuesto corriente."
  - id: b
    text:
      es: "En las operaciones que combinen autorización y compromiso de gasto del Presupuesto corriente."
  - id: c
    text:
      es: "En las operaciones de reconocimiento de obligaciones del Presupuesto corriente."
  - id: d
    correct: true
    text:
      es: "En las operaciones de compromiso de gasto imputables al Presupuesto corriente."
  explanation:
    es: "El apartado sexto.1.f) dice que el documento D de ejercicio corriente se utiliza en las operaciones de compromiso de gasto imputables al Presupuesto corriente. La autorización se documenta con el A. La combinación de autorización y compromiso, con el AD. El reconocimiento de obligaciones, con el OK."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 3
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q036
  prompt:
    es: "¿Para qué operaciones se utiliza el documento OK, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Para las operaciones de reconocimiento de obligaciones."
  - id: b
    text:
      es: "Para las operaciones que combinen autorización, compromiso y reconocimiento de obligaciones."
  - id: c
    text:
      es: "Para proponer el pago de obligaciones reconocidas con anterioridad a la Orden."
  - id: d
    text:
      es: "Para las operaciones de compromiso de gasto imputables al Presupuesto corriente."
  explanation:
    es: "El apartado sexto.1.n) dice que el documento OK se utiliza en operaciones de reconocimiento de obligaciones. Las que combinan autorización, compromiso y reconocimiento llevan el ADOK. Proponer el pago de obligaciones reconocidas con anterioridad corresponde al documento K. El compromiso de gasto se documenta con el D."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 1
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q037
  prompt:
    es: "¿En qué ámbito se utiliza exclusivamente el documento O, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "En la gestión de los anticipos de caja fija, cuando se repone el fondo del cajero."
  - id: b
    correct: true
    text:
      es: "En la gestión de la Deuda del Estado, cuando al reconocer la obligación no se propone el pago."
  - id: c
    text:
      es: "En los contratos de arrendamiento financiero, cuando se aprueba el cuadro financiero."
  - id: d
    text:
      es: "En las transferencias de crédito, cuando se retiene el importe de las aplicaciones minoradas."
  explanation:
    es: "El apartado sexto.1.o) limita el documento O a la gestión de la Deuda del Estado, cuando al reconocer la obligación no se propone el pago. La propuesta se hace después con el documento K. Los anticipos de caja fija, los arrendamientos financieros y las transferencias de crédito no figuran en ese apartado como ámbito del documento O."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 3
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q040
  prompt:
    es: "Según el apartado sexto.2 de la Orden de 1 de febrero de 1996 sobre documentos contables de la Administración General del Estado, ¿qué documento se expide para anular una operación registrada con un documento contable del presupuesto de gastos?"
  options:
  - id: a
    text:
      es: "Un documento MC que minore el crédito en el importe de la operación anulada."
  - id: b
    correct: true
    text:
      es: "Un documento idéntico al de la operación que se anula, pero de signo contrario."
  - id: c
    text:
      es: "Un documento idéntico al de la operación que se anula, pero con fecha posterior."
  - id: d
    text:
      es: "Un documento de la fase siguiente, por el mismo importe que el de la operación anulada."
  explanation:
    es: "El apartado sexto.2 dice que se expide un documento idéntico al de la operación, pero de signo contrario. El MC sirve para modificar créditos, no para anular operaciones de gestión. Un documento idéntico con fecha posterior duplicaría la operación en lugar de anularla. Un documento de la fase siguiente registraría una fase nueva."
  citation: "apartado sexto.2 Orden de documentos contables"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2749-anexo-i
- id: m05-l03-q041
  prompt:
    es: "En un documento contable de signo negativo, ¿qué se consigna en la casilla de la nota 3 del anexo I de la Orden de 1 de febrero de 1996 sobre documentos contables de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Un cero (0)."
  - id: b
    correct: true
    text:
      es: "Una barra (/)."
  - id: c
    text:
      es: "Un signo menos (-)."
  - id: d
    text:
      es: "Un asterisco (*)."
  explanation:
    es: "La nota 3 dice que la casilla se deja en blanco si la operación es de signo positivo y que se consigna una barra (/) si es de signo negativo. El cero, el signo menos y el asterisco no figuran en esa nota."
  citation: "anexo I Orden de documentos contables"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l03-q046
  prompt:
    es: "En un arrendamiento de bienes inmuebles a utilizar por organismos del Estado, ¿cuándo se formula el documento AD de ejercicios posteriores según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Al inicio del expediente de contratación, junto con el RC de ejercicio corriente."
  - id: b
    correct: true
    text:
      es: "Una vez formalizado el contrato, junto con el AD de ejercicio corriente."
  - id: c
    text:
