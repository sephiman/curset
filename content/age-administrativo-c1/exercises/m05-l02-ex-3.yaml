# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q063
  prompt:
    es: "Según el artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones financieras se distinguirán:"
  options:
  - id: a
    text:
      es: "Las de gastos financieros y las de activos financieros."
  - id: b
    correct: true
    text:
      es: "Las de activos financieros y las de pasivos financieros."
  - id: c
    text:
      es: "Las de pasivos financieros y las de transferencias de capital."
  - id: d
    text:
      es: "Las de inversiones reales y las de gastos financieros."
  explanation:
    es: "Las operaciones financieras se dividen en activos financieros y pasivos financieros (capítulos 8 y 9). Los gastos financieros son operaciones corrientes, y las inversiones reales y las transferencias de capital son operaciones de capital."
  citation: "art. 40.1.c) LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q064
  prompt:
    es: "¿A qué nivel se especifican las inversiones reales, según los artículos 43.1 y 44.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el presupuesto del Estado y en el de los organismos autónomos?"
  options:
  - id: a
    text:
      es: "A nivel de artículo en el Estado y de capítulo en los organismos autónomos."
  - id: b
    text:
      es: "A nivel de concepto en el Estado y de capítulo en los organismos autónomos."
  - id: c
    correct: true
    text:
      es: "A nivel de capítulo, tanto en el presupuesto del Estado como en el de los organismos autónomos."
  - id: d
    text:
      es: "A nivel de capítulo en el Estado y de concepto en los organismos autónomos."
  explanation:
    es: "Las inversiones reales se especifican a nivel de capítulo en los dos presupuestos: así lo dicen el artículo 43.1 para el Estado y el 44.1 para los organismos autónomos. Las demás opciones dan a uno de los dos un nivel (artículo o concepto) que la ley no fija para las inversiones."
  citation: "arts. 43.1 y 44.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q066
  prompt:
    es: "En el capítulo 6 del anexo II de la Orden HAC/557/2026, de 3 de junio, ¿en qué se distinguen por su denominación los artículos 62 y 63?"
  options:
  - id: a
    correct: true
    text:
      es: "El 62 es inversión nueva y el 63 inversión de reposición, ambos asociados al funcionamiento operativo de los servicios."
  - id: b
    text:
      es: "El 62 es inversión de reposición y el 63 inversión nueva, ambos asociados al funcionamiento operativo de los servicios."
  - id: c
    text:
      es: "El 62 es inversión nueva en infraestructura de uso general y el 63 inversión de reposición en esa misma infraestructura."
  - id: d
    text:
      es: "El 62 es inversión civil y el 63 inversión militar, ambos asociados al funcionamiento operativo de los servicios."
  explanation:
    es: "El artículo 62 se denomina «Inversión nueva asociada al funcionamiento operativo de los servicios» y el 63, «Inversión de reposición asociada al funcionamiento operativo de los servicios». La opción que invierte los dos adjetivos cambia el orden de las denominaciones. La inversión en infraestructura de uso general corresponde a los artículos 60 y 61, y la inversión militar, a los artículos 65 a 67: ninguna de las dos describe al 62 y al 63."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q067
  prompt:
    es: "En el anexo II de la Orden HAC/557/2026, de 3 de junio, un artículo denominado «A organismos autónomos» figura en dos capítulos de la clasificación económica de gastos. ¿Cuáles son?"
  options:
  - id: a
    text:
      es: "El 2, «Gastos corrientes en bienes y servicios», y el 6, «Inversiones reales»."
  - id: b
    text:
      es: "El 3, «Gastos financieros», y el 8, «Activos financieros»."
  - id: c
    text:
      es: "El 1, «Gastos de personal», y el 9, «Pasivos financieros»."
  - id: d
    correct: true
    text:
      es: "El 4, «Transferencias corrientes», y el 7, «Transferencias de capital»."
  explanation:
    es: "Los artículos 41 y 71 se denominan «A organismos autónomos» y cuelgan de los capítulos 4, «Transferencias corrientes», y 7, «Transferencias de capital». Los capítulos de bienes y servicios, inversiones reales, gastos financieros, activos financieros, personal y pasivos financieros no tienen ningún artículo con ese nombre."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q069
  prompt:
    es: "Según el anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, el concepto 221 incluye el combustible. ¿Cómo se denomina?"
  options:
  - id: a
    text:
      es: "Recibe la denominación de «Material de oficina»."
  - id: b
    text:
      es: "Recibe la denominación de «Gastos diversos»."
  - id: c
    correct: true
    text:
      es: "Recibe la denominación de «Suministros»."
  - id: d
    text:
      es: "Recibe la denominación de «Comunicaciones»."
  explanation:
    es: "En el artículo 22 de la Resolución, el concepto 221 es «Suministros» y agrupa agua, gas, electricidad y otros abastecimientos, entre ellos el combustible del subconcepto 03. El material de oficina es el concepto 220, los gastos diversos el 226 y las comunicaciones el 222."
  citation: "anexo IV, art. 22, Resolución de 20-01-2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-879-anexo-iv
- id: m05-l02-q070
  prompt:
    es: "Conforme al anexo IV de la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, el combustible se imputa al subconcepto 221.03, salvo que:"
  options:
  - id: a
    text:
      es: "Se destine a la calefacción de edificios de uso administrativo."
  - id: b
    correct: true
    text:
      es: "Tratándose de alquileres de edificios, esté comprendido en el precio de los mismos."
  - id: c
    text:
      es: "Se adquiera en cantidades superiores a las del consumo ordinario de la unidad."
  - id: d
    text:
      es: "Lo compre un organismo autónomo y no la Administración General del Estado."
  explanation:
    es: "La Resolución imputa a los subconceptos de suministros los gastos de este tipo, salvo en el caso de que, tratándose de alquileres de edificios, estén comprendidos en el precio de los mismos. La calefacción de edificios administrativos, el consumo superior al ordinario y la condición de organismo autónomo no son excepciones que la norma recoja."
  citation: "anexo IV, art. 22, Resolución de 20-01-2014"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q071
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el gasto imputable a los ejercicios tercero y cuarto, que son los últimos que admite la ley, no podrá exceder de:"
  options:
  - id: a
    text:
      es: "El 60 por ciento del crédito inicial a que corresponda la operación."
  - id: b
    correct: true
    text:
      es: "El 50 por ciento del crédito inicial a que corresponda la operación."
  - id: c
    text:
      es: "El 70 por ciento del crédito inicial a que corresponda la operación."
  - id: d
    text:
      es: "El 40 por ciento del crédito inicial a que corresponda la operación."
  explanation:
    es: "El artículo 47.2 LGP dice que el número de ejercicios no será superior a cuatro y que el gasto de cada ejercicio posterior no podrá exceder, sobre el crédito inicial, del 70 por ciento en el inmediato siguiente, del 60 por ciento en el segundo y del 50 por ciento «en los ejercicios tercero y cuarto». El 70 por ciento es el límite del ejercicio inmediato siguiente y el 60 por ciento el del segundo. El 40 por ciento no es el porcentaje de ningún ejercicio del apartado: los tres porcentajes son 70, 60 y 50."
  citation: "art. 47.2 LGP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q072
  prompt:
    es: "De acuerdo con el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán la estimación de los beneficios fiscales que afecten a los tributos:"
  options:
  - id: a
    text:
      es: "Propios de las Comunidades Autónomas, aunque los gestione el Estado."
  - id: b
    correct: true
    text:
      es: "Del Estado, y no los propios de otras Administraciones territoriales."
  - id: c
    text:
      es: "De las Entidades Locales, como el impuesto sobre bienes inmuebles."
  - id: d
    text:
      es: "De las entidades de presupuesto estimativo, como los consorcios."
  explanation:
    es: "El artículo 33.2.e) incluye la estimación de los beneficios fiscales que afecten a los tributos del Estado. Los tributos propios de las Comunidades Autónomas y los de las Entidades Locales son de otras Administraciones, y las entidades de presupuesto estimativo no son titulares de tributos."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q073
  prompt:
    es: "Según el artículo 40.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la clasificación por programas permite a los centros gestores establecer los objetivos a conseguir de acuerdo con:"
  options:
  - id: a
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "El Consejo de Ministros."
  - id: c
    text:
      es: "El Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "El Ministerio de Hacienda."
  explanation:
    es: "El artículo 40.1.b) dice que los centros gestores establecen los objetivos «de acuerdo con el Ministerio de Hacienda». Ni la Intervención General ni el Consejo de Ministros ni el Tribunal de Cuentas intervienen en esa fijación según el artículo."
  citation: "art. 40.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q075
  prompt:
    es: "Según el anexo II de la Orden HAC/557/2026, de 3 de junio, ¿qué denominación recibe el capítulo 5 de la clasificación económica de gastos?"
  options:
  - id: a
    text:
      es: "Imprevistos y créditos extraordinarios del ejercicio."
  - id: b
    correct: true
    text:
      es: "Fondo de contingencia y otros imprevistos."
  - id: c
    text:
      es: "Reservas de crédito para gastos plurianuales futuros."
  - id: d
    text:
      es: "Dotaciones de contingencia para gastos de personal."
  explanation:
    es: "El capítulo 5 se denomina «Fondo de contingencia y otros imprevistos», y es el único capítulo que no es de operaciones corrientes, de capital ni financieras. Las otras denominaciones no existen en el anexo II."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q076
  prompt:
    es: "Según el artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué clase de operaciones se distinguen los gastos financieros de la clasificación económica?"
  options:
  - id: a
    text:
      es: "En las financieras, junto a los activos financieros y los pasivos financieros."
  - id: b
    correct: true
    text:
      es: "En las corrientes, junto a los gastos de personal y las transferencias corrientes."
  - id: c
    text:
      es: "En las de capital, junto a las inversiones reales y las transferencias de capital."
  - id: d
    text:
      es: "En el Fondo de Contingencia, junto a los imprevistos de ejecución presupuestaria."
  explanation:
    es: "Entre las operaciones corrientes se distinguen los gastos de personal, los gastos corrientes en bienes y servicios, los gastos financieros y las transferencias corrientes. Que se llamen «financieros» no los lleva a las operaciones financieras, que distinguen solo activos y pasivos financieros; las de capital reúnen inversiones reales y transferencias de capital."
  citation: "art. 40.1.c) LGP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q078
  prompt:
    es: "En la aplicación 33.101.921O.227.06, el código 227 es un concepto del artículo 22 del anexo II de la Orden HAC/557/2026, de 3 de junio. ¿Cómo se denomina?"
  options:
  - id: a
    correct: true
    text:
      es: "Recibe la denominación de «Trabajos realizados por otras empresas y profesionales»."
  - id: b
    text:
      es: "Recibe la denominación de «Gastos diversos»."
  - id: c
    text:
      es: "Recibe la denominación de «Suministros»."
  - id: d
    text:
      es: "Recibe la denominación de «Transportes»."
  explanation:
    es: "El concepto 227 es «Trabajos realizados por otras empresas y profesionales». Los gastos diversos son el concepto 226, los suministros el 221 y los transportes el 223; cada uno tiene su código propio dentro del artículo 22."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-44
- id: m05-l02-q082
  prompt:
    es: "Conforme al artículo 44.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el presupuesto de los organismos autónomos los gastos corrientes en bienes y servicios se especifican a nivel de:"
  options:
  - id: a
    correct: true
    text:
      es: "Capítulo, como los gastos de personal y las inversiones reales."
  - id: b
    text:
      es: "Artículo, como en el presupuesto del Estado."
  - id: c
    text:
      es: "Concepto, que es el nivel general de especificación."
  - id: d
    text:
      es: "Subconcepto, que es el mayor desglose de la clasificación económica."
  explanation:
    es: "En los organismos autónomos, la Seguridad Social y las demás entidades del artículo 3.1, el nivel general es el concepto, pero los gastos de personal, los gastos corrientes en bienes y servicios y las inversiones reales se especifican a nivel de capítulo. El nivel de artículo es el del presupuesto del Estado para bienes y servicios, y el subconcepto no es nivel de especificación del artículo."
  citation: "art. 44.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q083
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el presupuesto del Estado se agota el crédito 226.01 «Atenciones protocolarias y representativas» y queda crédito en otro subconcepto del 226. ¿Hace falta una modificación para cubrirlo?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque esos créditos se especifican a su concreta clasificación económica."
  - id: b
    text:
      es: "No, porque los gastos corrientes en bienes y servicios vinculan a nivel de artículo y ambos son del artículo 22."
  - id: c
    text:
      es: "No, porque ambos subconceptos son del mismo concepto 226, que es el nivel general de vinculación."
  - id: d
    text:
      es: "No, porque en el Estado todos los créditos del capítulo 2 vinculan entre sí."
  explanation:
    es: "El artículo 43.2.a) saca los créditos de atenciones protocolarias y representativas de la regla general y los especifica a su concreta clasificación económica, de modo que el subconcepto 226.01 no se cubre con otro. La vinculación por artículo, por concepto o por capítulo solo rige para los créditos que no están en la lista del 43.2."
  citation: "art. 43.2 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q084
  prompt:
    es: "¿Cuál de los siguientes créditos del presupuesto del Estado se especifica, según el artículo 43.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, a su concreta clasificación económica?"
  options:
  - id: a
    text:
      es: "Los destinados a gastos de personal funcionario."
  - id: b
    text:
      es: "Los destinados a inversiones reales de cualquier programa."
  - id: c
    correct: true
    text:
      es: "Los declarados ampliables conforme al artículo 54 de la Ley."
  - id: d
    text:
      es: "Los destinados a gastos corrientes en bienes y servicios."
  explanation:
    es: "Los créditos ampliables figuran en la lista del artículo 43.2.c), que se especifica a la concreta clasificación económica. Los de personal y de bienes y servicios se rigen por la regla de artículo, y las inversiones reales por la de capítulo, que son las reglas del 43.1."
  citation: "art. 43.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
