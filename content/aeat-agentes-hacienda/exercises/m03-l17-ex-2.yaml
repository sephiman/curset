# anchor: boe-a-2014-12328-art-110
- id: m03-l17-q0027
  prompt:
    es: "¿Cuál de las siguientes rentas está exenta para las entidades parcialmente exentas según el artículo 110.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Las derivadas de transmisiones a título oneroso de cualquier bien de su patrimonio, aunque no esté afecto a su objeto ni se reinvierta su producto en nuevas inversiones del inmovilizado."
  - id: b
    correct: true
    text:
      es: "Las derivadas de adquisiciones y de transmisiones a título lucrativo, siempre que se obtengan o realicen en cumplimiento de su objeto o finalidad específica."
  - id: c
    text:
      es: "Las procedentes de la explotación de bienes mediante una actividad económica, cuando su producto se destine a fines sociales."
  - id: d
    text:
      es: "Las derivadas del patrimonio de la entidad, siempre que se distribuyan entre sus asociados."
  explanation:
    es: "Están exentas las rentas de adquisiciones y transmisiones a título lucrativo hechas en cumplimiento del objeto o finalidad específica. Las transmisiones onerosas solo quedan exentas si los bienes están afectos al objeto y el producto se reinvierte. Los rendimientos de actividades económicas y las rentas del patrimonio están fuera de la exención según el apartado 2, sea cual sea su destino."
  citation: "art. 110.1.b) LIS"
  difficulty: 2
  tags:
  - "exenciones"
  - "entidades parcialmente exentas"
# anchor: boe-a-2014-12328-art-10
- id: m03-l17-q0028
  prompt:
    es: "De acuerdo con el artículo 10.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la base imponible está constituida por el importe de la renta obtenida en el período impositivo minorada por:"
  options:
  - id: a
    text:
      es: "las deducciones y bonificaciones de la cuota íntegra que correspondan al contribuyente."
  - id: b
    text:
      es: "las retenciones e ingresos a cuenta soportados durante el período impositivo."
  - id: c
    text:
      es: "los pagos fraccionados ingresados a cuenta de la liquidación del período impositivo."
  - id: d
    correct: true
    text:
      es: "la compensación de bases imponibles negativas de períodos impositivos anteriores."
  explanation:
    es: "La base imponible es la renta del período menos la compensación de bases imponibles negativas de períodos anteriores. Las deducciones y bonificaciones se aplican sobre la cuota íntegra, no sobre la base. Las retenciones, los ingresos a cuenta y los pagos fraccionados se restan de la cuota resultante de la autoliquidación y dan lugar, en su caso, a la devolución."
  citation: "art. 10.1 LIS"
  difficulty: 1
  tags:
  - "base imponible"
# anchor: boe-a-2014-12328-art-10
- id: m03-l17-q0029
  prompt:
    es: "Conforme al artículo 10.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre los métodos de determinación de la base imponible:"
  options:
  - id: a
    text:
      es: "Se determina por estimación objetiva con carácter general y, subsidiariamente, por estimación directa."
  - id: b
    correct: true
    text:
      es: "Se determina por estimación directa, por estimación objetiva cuando la ley determine su aplicación y, subsidiariamente, por estimación indirecta."
  - id: c
    text:
      es: "Se determina por estimación directa o por estimación indirecta, a elección del contribuyente."
  - id: d
    text:
      es: "Se determina por estimación directa y, subsidiariamente, por estimación objetiva, sin que quepa en ningún caso la estimación indirecta del impuesto."
  explanation:
    es: "La base se determina por estimación directa; por estimación objetiva cuando la ley determine su aplicación; y, subsidiariamente, por estimación indirecta, de conformidad con la Ley General Tributaria. Invertir el orden y hacer general la objetiva contradice el carácter excepcional de esta. La elección del contribuyente entre directa e indirecta no existe: la indirecta es subsidiaria. Y excluirla en favor de la objetiva niega el último método que el artículo prevé."
  citation: "art. 10.2 LIS"
  difficulty: 2
  tags:
  - "base imponible"
  - "métodos"
# anchor: boe-a-2014-12328-art-17
- id: m03-l17-q0038
  prompt:
    es: "De acuerdo con el artículo 17.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las variaciones de valor originadas por aplicación del criterio del valor razonable no tienen efectos fiscales mientras:"
  options:
  - id: a
    text:
      es: "no hayan transcurrido tres períodos impositivos desde la valoración."
  - id: b
    correct: true
    text:
      es: "no deban imputarse a la cuenta de pérdidas y ganancias o, si una norma lo establece, a una cuenta de reservas."
  - id: c
    text:
      es: "no las apruebe la Administración tributaria en la forma que reglamentariamente se determine para los criterios de imputación temporal."
  - id: d
    text:
      es: "no se transmita el elemento patrimonial a un tercero no vinculado con la entidad."
  explanation:
    es: "Las variaciones por valor razonable no tienen efectos fiscales mientras no deban imputarse a la cuenta de pérdidas y ganancias o a una cuenta de reservas, si una norma legal o reglamentaria así lo establece. El artículo no fija un número de períodos desde la valoración. La aprobación de la Administración es la condición del artículo 11.2 para los criterios de imputación temporal excepcionales, no la de este apartado. Y la transmisión a un tercero no vinculado no figura como requisito."
  citation: "art. 17.1 LIS"
  difficulty: 3
  tags:
  - "valoración"
# anchor: boe-a-2014-12328-art-20
- id: m03-l17-q0041
  prompt:
    es: "De acuerdo con el artículo 20 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la entidad adquirente de un elemento patrimonial no amortizable del inmovilizado, con diferente valoración contable y fiscal, integra la diferencia en su base imponible:"
  options:
  - id: a
    correct: true
    text:
      es: "en el período impositivo en que el elemento se transmita o se dé de baja."
  - id: b
    text:
      es: "en el período impositivo en que el elemento motive el devengo de un ingreso o un gasto."
  - id: c
    text:
      es: "en los períodos impositivos que resten de vida útil, según el método de amortización."
  - id: d
    text:
      es: "en el período impositivo en que se reciba el elemento, junto con su precio."
  explanation:
    es: "Los elementos no amortizables del inmovilizado integran la diferencia cuando se transmiten o se dan de baja. El devengo de un ingreso o un gasto es el momento del activo circulante. El reparto en los períodos de vida útil corresponde a los elementos amortizables. Y el período en que se recibe es el criterio de los servicios, no el de un elemento del inmovilizado."
  citation: "art. 20 LIS"
  difficulty: 2
  tags:
  - "valoración"
  - "efectos"
# anchor: boe-a-2014-12328-art-20
- id: m03-l17-q0042
  prompt:
    es: "Ferrer Logística SL adquiere el 1 de enero de 2026 una máquina amortizable del inmovilizado, con valor contable de 100.000 euros y valor fiscal de 70.000 euros. Le quedan 10 años de vida útil y la amortiza de forma lineal. Si no la transmite antes, conforme al artículo 20 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué importe integra en su base imponible por esa diferencia cada año?"
  options:
  - id: a
    text:
      es: "30.000 euros, íntegros en el período impositivo 2026."
  - id: b
    text:
      es: "30.000 euros, íntegros en el período impositivo en que transmita la máquina o la dé de baja."
  - id: c
    correct: true
    text:
      es: "3.000 euros cada año, durante los 10 períodos de vida útil que restan."
  - id: d
    text:
      es: "7.000 euros cada año, que es la décima parte del valor fiscal."
  explanation:
    es: "La diferencia entre los valores contable y fiscal es 100.000 - 70.000 = 30.000 euros. Para un elemento amortizable la entidad adquirente la integra en los períodos que restan de vida útil, aplicando el método de amortización del elemento: 30.000 / 10 = 3.000 euros al año. Integrar los 30.000 en 2026 ignora el reparto. Integrarlos al transmitir o dar de baja es la regla de los no amortizables, y aquí la transmisión solo adelantaría la integración del resto. Y la décima parte del valor fiscal aplica la amortización a una cifra que no es la diferencia."
  citation: "art. 20 LIS"
  difficulty: 3
  tags:
  - "valoración"
  - "efectos"
  - "cómputo"
# anchor: boe-a-2014-12328-art-20
- id: m03-l17-q0043
  prompt:
    es: "Conforme al artículo 20 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre los servicios con diferente valoración contable y fiscal:"
  options:
  - id: a
    text:
      es: "La entidad adquirente integra la diferencia en el período en que pague su precio, aunque los haya recibido antes o después de ese pago, en todo caso."
  - id: b
    correct: true
    text:
      es: "La entidad adquirente integra la diferencia en el período en que los reciba, salvo que su importe deba incorporarse a un elemento patrimonial."
  - id: c
    text:
      es: "La entidad adquirente integra la diferencia en los períodos que resten de vida útil del servicio."
  - id: d
    text:
      es: "La entidad adquirente integra la diferencia en el período en que los dé de baja, en todo caso."
  explanation:
    es: "Para los servicios la diferencia se integra en el período en que se reciben, y si el importe debe incorporarse a un elemento patrimonial se aplican las reglas de ese elemento. El pago del precio no es el criterio. Un servicio no tiene vida útil que repartir, y ese reparto es la regla de los elementos amortizables. Y darlo de baja es el momento de los elementos no amortizables, que no se aplica a los servicios."
  citation: "art. 20 LIS"
  difficulty: 2
  tags:
  - "valoración"
  - "efectos"
# anchor: boe-a-2014-12328-art-11
- id: m03-l17-q0031
  prompt:
    es: "Según el artículo 11.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los ingresos y gastos derivados de las transacciones o hechos económicos se imputan al período impositivo:"
  options:
  - id: a
    text:
      es: "en que se produzca su pago o su cobro, con independencia de la fecha de su devengo contable y de la correlación entre ingresos y gastos."
  - id: b
    text:
      es: "en que se aprueben las cuentas anuales por la junta general, con independencia de su devengo."
  - id: c
    correct: true
    text:
      es: "en que se produzca su devengo, con arreglo a la normativa contable, con independencia de la fecha de su pago o de su cobro."
  - id: d
    text:
      es: "en que se emita la factura correspondiente, con arreglo a la normativa del Impuesto sobre el Valor Añadido."
  explanation:
    es: "La regla general es el devengo, con arreglo a la normativa contable y sin atender a la fecha de pago o cobro, respetando la correlación entre ingresos y gastos. El criterio de caja, que sigue el pago o el cobro, es el contrario. La aprobación de cuentas por la junta no decide el período. Y la factura sigue el criterio del IVA, que no es el que fija el artículo 11.1 para este impuesto."
  citation: "art. 11.1 LIS"
  difficulty: 1
  tags:
  - "imputación temporal"
# anchor: boe-a-2014-12328-art-11
- id: m03-l17-q0033
  prompt:
    es: "Conforme al artículo 11.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre la eficacia fiscal de los criterios de imputación temporal distintos de los del apartado 1, que el contribuyente utiliza excepcionalmente para conseguir la imagen fiel:"
  options:
  - id: a
    text:
      es: "Es plena desde que el contribuyente los comunique en la declaración del período impositivo en que los aplique por primera vez."
  - id: b
    text:
      es: "Está supeditada a la aprobación del Instituto de Contabilidad y Auditoría de Cuentas."
  - id: c
    correct: true
    text:
      es: "Está supeditada a la aprobación por la Administración tributaria, en la forma que reglamentariamente se determine."
  - id: d
    text:
      es: "Queda condicionada a que el contribuyente los hubiera aplicado durante tres períodos impositivos consecutivos."
  explanation:
    es: "Esos criterios excepcionales solo tienen eficacia fiscal si los aprueba la Administración tributaria, en la forma que se determine reglamentariamente. La mera comunicación en la declaración no basta. El Instituto de Contabilidad y Auditoría de Cuentas no interviene: la aprobación corresponde a la Administración tributaria. Y el artículo no exige un período de aplicación previo."
  citation: "art. 11.2 LIS"
  difficulty: 2
  tags:
  - "imputación temporal"
# anchor: boe-a-2014-12328-art-11
- id: m03-l17-q0034
  prompt:
    es: "De acuerdo con el artículo 11.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, no serán fiscalmente deducibles los gastos que no se hayan imputado contablemente:"
  options:
  - id: a
    correct: true
    text:
      es: "en la cuenta de pérdidas y ganancias o en una cuenta de reservas, si así lo establece una norma legal o reglamentaria."
  - id: b
    text:
      es: "en la cuenta de pérdidas y ganancias, sin que quepa su imputación a una cuenta de reservas en ningún caso, aunque una norma lo establezca."
  - id: c
    text:
      es: "en el balance de situación, aunque no se hayan reflejado en la cuenta de pérdidas y ganancias."
  - id: d
    text:
      es: "en la memoria de las cuentas anuales, con independencia de su contabilización en otras cuentas."
  explanation:
    es: "La deducibilidad exige imputación contable en la cuenta de pérdidas y ganancias o, si una norma legal o reglamentaria lo establece, en una cuenta de reservas. Excluir las reservas en todo caso ignora esa posibilidad. El balance y la memoria son documentos de las cuentas anuales, pero no son las cuentas en las que debe imputarse el gasto según el artículo."
  citation: "art. 11.3 LIS"
  difficulty: 1
  tags:
  - "imputación temporal"
# anchor: boe-a-2014-12328-art-11
- id: m03-l17-q0036
  prompt:
    es: "Según el artículo 11.5 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, no se integra en la base imponible:"
  options:
  - id: a
    text:
      es: "la reversión de un deterioro o corrección de valor que haya sido fiscalmente deducible."
  - id: b
    correct: true
    text:
      es: "la reversión de gastos que no hayan sido fiscalmente deducibles."
  - id: c
    text:
      es: "la eliminación de provisiones por no haberse aplicado a su finalidad, cuando la dotación fue gasto deducible."
  - id: d
    text:
      es: "la renta pendiente de imputación cuando se produce el endoso, descuento o cobro anticipado de importes aplazados."
  explanation:
    es: "La reversión de gastos que no fueron deducibles no tributa, porque el gasto no redujo antes la base. En los otros tres supuestos sí se integra. La reversión de un deterioro deducible se imputa en el período en que se produce, según el apartado 6. La eliminación de provisiones deducibles se integra en la base de la entidad que las dotó, según el apartado 7. Y el endoso o cobro anticipado hace obtenida en ese momento la renta pendiente, según el apartado 4."
  citation: "art. 11.5 LIS"
  difficulty: 2
  tags:
  - "imputación temporal"
  - "reversión"
# anchor: boe-a-2014-12328-art-11
- id: m03-l17-q0037
  prompt:
    es: "Conforme al artículo 11.6 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre la reversión de un deterioro o corrección de valor que haya sido fiscalmente deducible:"
  options:
  - id: a
    text:
      es: "Se imputa en el período en que se dotó el deterioro, mediante la rectificación de la autoliquidación de ese período."
  - id: b
    text:
      es: "No se integra en la base imponible, igual que la reversión de gastos que no fueron deducibles."
  - id: c
    text:
      es: "Se imputa en la base imponible solo cuando la reversión se produce en la misma entidad que practicó la corrección, y no en otra entidad vinculada con ella."
  - id: d
    correct: true
    text:
      es: "Se imputa en la base imponible del período en que se produce la reversión, sea en la entidad que practicó la corrección o en otra vinculada con ella."
  explanation:
    es: "La reversión de un deterioro deducible se imputa en el período de la reversión, y da igual que ocurra en la entidad que corrigió el valor o en otra vinculada. Imputarla al período de la dotación obligaría a rectificar un período cerrado, y el artículo no lo prevé. No integrarla es el trato de la reversión de gastos no deducibles, que es otro supuesto. Y limitarla a la misma entidad ignora que el artículo incluye a la entidad vinculada."
  citation: "art. 11.6 LIS"
  difficulty: 2
  tags:
  - "imputación temporal"
  - "reversión"
