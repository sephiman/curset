# anchor: boe-a-2006-20764-art-51
- id: m03-l16-q0125
  prompt:
    es: "Según el artículo 51 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de las siguientes primas satisface los requisitos del artículo y puede reducirse en la base imponible general?"
  options:
  - id: a
    text:
      es: "Las primas satisfechas a seguros de salud de la unidad familiar."
  - id: b
    text:
      es: "Las primas satisfechas a seguros de responsabilidad civil profesional."
  - id: c
    correct: true
    text:
      es: "Las primas satisfechas a los planes de previsión asegurados."
  - id: d
    text:
      es: "Las primas satisfechas a seguros de vida ahorro sin cobertura de jubilación."
  explanation:
    es: "El artículo 51.3 admite las primas satisfechas a los planes de previsión asegurados, contratos de seguro cuya cobertura principal es la jubilación. Los seguros de salud, de responsabilidad civil y de vida ahorro sin cobertura de jubilación no figuran entre los sistemas de previsión social que enumera el artículo."
  citation: "art. 51 LIRPF"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-51
- id: m03-l16-q0126
  prompt:
    es: "De acuerdo con el artículo 51 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, entre las aportaciones que pueden reducirse en la base imponible general están las realizadas por los trabajadores a los planes de previsión social empresarial, incluyendo:"
  options:
  - id: a
    text:
      es: "las comisiones de gestión de la entidad aseguradora."
  - id: b
    correct: true
    text:
      es: "las contribuciones del tomador."
  - id: c
    text:
      es: "los rendimientos obtenidos por el plan en el ejercicio."
  - id: d
    text:
      es: "las prestaciones percibidas por jubilación."
  explanation:
    es: "Los planes de previsión social empresarial permiten reducir las aportaciones de los trabajadores, incluyendo las contribuciones del tomador (art. 51.4). Las comisiones de gestión, los rendimientos del plan y las prestaciones cobradas no son aportaciones ni contribuciones del tomador."
  citation: "art. 51 LIRPF"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0127
  prompt:
    es: "De acuerdo con el artículo 81.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los requisitos de la deducción por maternidad:"
  options:
  - id: a
    correct: true
    text:
      es: "La mujer debe percibir, en el momento del nacimiento, prestaciones contributivas o asistenciales de desempleo, o estar dada de alta en la Seguridad Social o mutualidad en ese momento o en uno posterior."
  - id: b
    text:
      es: "La mujer debe estar dada de alta en la Seguridad Social en el momento del nacimiento, sin que valga la situación posterior, y haber cotizado al menos 30 días en el período impositivo anterior al nacimiento del hijo, sin tener en cuenta las prestaciones de desempleo."
  - id: c
    text:
      es: "La mujer debe haber percibido prestaciones de desempleo durante todo el período impositivo."
  - id: d
    text:
      es: "La mujer debe tener derecho a la deducción por familia numerosa del artículo 81 bis."
  explanation:
    es: "La mujer cumple el requisito si en el momento del nacimiento percibe prestaciones de desempleo, o si en ese momento o en cualquier momento posterior está dada de alta en la Seguridad Social o mutualidad con un mínimo de 30 días cotizados (art. 81.1). Exigir el alta solo en el momento del nacimiento descarta el alta posterior. El desempleo se mira en el nacimiento, no durante todo el período. Y la deducción por familia numerosa es otra, que no condiciona esta."
  citation: "art. 81.1 LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81
- id: m03-l16-q0128
  prompt:
    es: "Conforme al artículo 81.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el incremento de la deducción por maternidad por gastos de custodia:"
  options:
  - id: a
    correct: true
    text:
      es: "Se refiere a gastos de custodia del hijo menor de tres años en guarderías o centros de educación infantil autorizados."
  - id: b
    text:
      es: "Se refiere a gastos de comedor y transporte del hijo en centros de educación primaria."
  - id: c
    text:
      es: "Se refiere a cualquier gasto de cuidado del hijo satisfecho a un familiar o a una persona contratada."
  - id: d
    text:
      es: "Se refiere a gastos de custodia del hijo menor de seis años en centros de educación infantil."
  explanation:
    es: "El incremento exige gastos de custodia del hijo menor de tres años en guarderías o centros de educación infantil autorizados (art. 81.2). La educación primaria, el cuidado por un familiar o persona contratada y la edad de seis años no son el supuesto de la ley."
  citation: "art. 81.2 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0129
  prompt:
    es: "Según el artículo 81 bis.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la deducción por familia numerosa y por ascendiente separado:"
  options:
  - id: a
    text:
      es: "Puede aplicarla el ascendiente separado legalmente con un solo hijo, aunque este tenga derecho a anualidades por alimentos, siempre que el ascendiente tenga derecho a la totalidad del mínimo del artículo 58 por ese hijo."
  - id: b
    text:
      es: "Puede aplicarla el ascendiente separado legalmente con dos hijos, aunque tenga derecho solo a la mitad del mínimo del artículo 58."
  - id: c
    text:
      es: "Solo pueden aplicarla los ascendientes que formen parte de una familia numerosa, no los separados legalmente."
  - id: d
    correct: true
    text:
      es: "Puede aplicarla el ascendiente separado legalmente, o sin vínculo matrimonial, con dos hijos sin derecho a anualidades por alimentos y por los que tenga derecho a la totalidad del mínimo del artículo 58."
  explanation:
    es: "La letra c) incluye al ascendiente separado legalmente, o sin vínculo matrimonial, con dos hijos sin derecho a anualidades por alimentos y por los que tenga derecho a la totalidad del mínimo del artículo 58. Un solo hijo, o con derecho a alimentos, o con derecho solo a parte del mínimo, no cumple el supuesto. Y limitar la deducción a las familias numerosas deja fuera el caso expreso del separado."
  citation: "art. 81 bis.1.c) LIRPF"
  difficulty: 3
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0130
  prompt:
    es: "De acuerdo con el artículo 81 bis.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los incrementos de la deducción por familia numerosa y el límite del apartado 2:"
  options:
  - id: a
    text:
      es: "Los incrementos del 100 por ciento y de 600 euros se tienen en cuenta a efectos del límite del apartado 2."
  - id: b
    text:
      es: "Solo el incremento del 100 por ciento queda fuera del límite del apartado 2."
  - id: c
    correct: true
    text:
      es: "Los incrementos del 100 por ciento y de 600 euros no se tienen en cuenta a efectos del límite del apartado 2."
  - id: d
    text:
      es: "Solo el incremento de 600 euros queda fuera del límite del apartado 2."
  explanation:
    es: "El artículo 81 bis.1.c) dice que ni el incremento del 100 por ciento ni el de 600 euros se tienen en cuenta a efectos del límite de las cotizaciones y cuotas del apartado 2. Sostener que cuentan, o que solo queda fuera uno de los dos, contradice las dos frases del precepto, que repiten la exclusión."
  citation: "art. 81 bis.1.c) LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-81-bis
- id: m03-l16-q0131
  prompt:
    es: "Según el artículo 81 bis.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la deducción de hasta 1.200 euros anuales por familia numerosa puede aplicarla, además del ascendiente, el:"
  options:
  - id: a
    text:
      es: "tío del contribuyente que conviva con la familia numerosa."
  - id: b
    correct: true
    text:
      es: "hermano huérfano de padre y madre que forme parte de la familia numerosa."
  - id: c
    text:
      es: "cónyuge no separado legalmente del ascendiente, aunque no forme parte de la familia numerosa."
  - id: d
    text:
      es: "hijo mayor de edad de la familia numerosa que no tenga rentas."
  explanation:
    es: "El artículo 81 bis.1.c) menciona al ascendiente y al hermano huérfano de padre y madre que forme parte de la familia numerosa. No cita a los tíos, ni al cónyuge que no forme parte de ella, ni a los hijos mayores."
  citation: "art. 81 bis.1.c) LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0132
  prompt:
    es: "De acuerdo con el artículo 96.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el contribuyente que obtiene exclusivamente rendimientos íntegros del trabajo de un único pagador:"
  options:
  - id: a
    text:
      es: "No tiene que declarar si sus rendimientos íntegros del trabajo no superan 15.876 euros anuales."
  - id: b
    correct: true
    text:
      es: "No tiene que declarar si sus rendimientos íntegros del trabajo no superan 22.000 euros anuales."
  - id: c
    text:
      es: "No tiene que declarar si sus rendimientos íntegros del trabajo no superan 1.600 euros anuales."
  - id: d
    text:
      es: "Tiene que declarar siempre que sus rendimientos íntegros del trabajo superen 1.000 euros anuales."
  explanation:
    es: "Con un único pagador, los rendimientos íntegros del trabajo no obligan a declarar hasta 22.000 euros anuales (art. 96.2.a). Los 15.876 euros son el límite de los supuestos del apartado 3, como el de varios pagadores. Los 1.600 euros son el límite conjunto de las rentas del capital mobiliario y las ganancias sometidas a retención. Y los 1.000 euros son un límite conjunto de otras rentas, no del trabajo."
  citation: "art. 96.2.a) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0133
  prompt:
    es: "Conforme al artículo 96.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, no tienen que declarar los contribuyentes cuyos rendimientos íntegros del capital mobiliario y ganancias patrimoniales sometidos a retención o ingreso a cuenta no superen el límite conjunto de:"
  options:
  - id: a
    correct: true
    text:
      es: "un importe de 1.600 euros anuales."
  - id: b
    text:
      es: "un importe de 1.000 euros anuales."
  - id: c
    text:
      es: "un importe de 1.500 euros anuales."
  - id: d
    text:
      es: "un importe de 3.000 euros anuales."
  explanation:
    es: "El límite conjunto de las rentas del capital mobiliario y las ganancias patrimoniales sometidas a retención es de 1.600 euros anuales (art. 96.2.b). Los 1.000 euros son el de la letra c) y el de la regla final del apartado. Los 1.500 euros son el límite de lo percibido de pagadores secundarios del apartado 3, y los 3.000 euros no figuran en el artículo."
  citation: "art. 96.2.b) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0134
  prompt:
    es: "Según el artículo 96.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el límite conjunto de 1.600 euros anuales de los rendimientos del capital mobiliario y las ganancias patrimoniales sometidos a retención:"
  options:
  - id: a
    text:
      es: "Se aplica a todas las ganancias procedentes de reembolsos de participaciones en instituciones de inversión colectiva, sea cual sea su base de retención, con independencia de que esta se determine o no por la cuantía a integrar en la base imponible."
  - id: b
    text:
      es: "Se aplica a los rendimientos del capital mobiliario, pero no a las ganancias patrimoniales sometidas a retención."
  - id: c
    text:
      es: "Se aplica a las rentas sometidas a retención o no, con tal de que no superen el límite."
  - id: d
    correct: true
    text:
      es: "No se aplica a las ganancias procedentes de transmisiones o reembolsos de participaciones en instituciones de inversión colectiva cuya base de retención no se determine por la cuantía a integrar en la base imponible."
  explanation:
    es: "La letra b) excluye las ganancias de transmisiones o reembolsos de participaciones en instituciones de inversión colectiva cuando la base de retención no se determina por la cuantía que se integra en la base imponible (art. 96.2.b). Aplicarla a todas ellas ignora la excepción. Los rendimientos del capital mobiliario y las ganancias sometidas a retención entran los dos en el límite. Y las rentas no sometidas a retención no figuran en esta letra."
  citation: "art. 96.2.b) LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0135
  prompt:
    es: "Según el artículo 96.2.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las rentas inmobiliarias imputadas del artículo 85, las letras del Tesoro no sujetas a retención y las ayudas públicas no obligan a declarar con el límite conjunto de:"
  options:
  - id: a
    text:
      es: "un importe de 1.600 euros anuales."
  - id: b
    text:
      es: "un importe de 1.500 euros anuales."
  - id: c
    correct: true
    text:
      es: "un importe de 1.000 euros anuales."
  - id: d
    text:
      es: "un importe de 500 euros anuales."
  explanation:
    es: "El límite conjunto de la letra c) es de 1.000 euros anuales (art. 96.2.c). Los 1.600 euros son el de la letra b), los 1.500 euros el de los pagadores secundarios del apartado 3 y los 500 euros el límite de las pérdidas patrimoniales de la regla final."
  citation: "art. 96.2.c) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0136
  prompt:
    es: "Según el artículo 96.2.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de las siguientes rentas se computa en el límite conjunto de 1.000 euros anuales para no estar obligado a declarar?"
  options:
  - id: a
    text:
      es: "Los rendimientos íntegros de actividades económicas en estimación directa."
  - id: b
    text:
      es: "Los rendimientos íntegros del trabajo satisfechos por un único pagador."
  - id: c
    correct: true
    text:
      es: "Los rendimientos íntegros del capital mobiliario no sujetos a retención derivados de letras del Tesoro."
  - id: d
    text:
      es: "Los rendimientos del capital inmobiliario procedentes de alquileres de viviendas."
  explanation:
    es: "El límite de la letra c) agrupa las rentas inmobiliarias imputadas del artículo 85, los rendimientos de capital mobiliario no sujetos a retención derivados de letras del Tesoro y las subvenciones y ayudas públicas. Los rendimientos de actividades económicas, los del trabajo de un único pagador y los alquileres de viviendas no figuran en esa letra."
  citation: "art. 96.2.c) LIRPF"
  difficulty: 2
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0137
  prompt:
    es: "Conforme al artículo 96.2.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes contribuyentes, que obtiene exclusivamente las rentas que se indican, está obligado a declarar?"
  options:
  - id: a
    text:
      es: "El que obtiene 300 euros de rentas inmobiliarias imputadas, 300 euros de letras del Tesoro no sujetas a retención y 200 euros de una subvención para vivienda de protección oficial."
  - id: b
    correct: true
    text:
      es: "El que obtiene 300 euros de rentas inmobiliarias imputadas, 500 euros de letras del Tesoro no sujetas a retención y 400 euros de una subvención para vivienda de protección oficial."
  - id: c
    text:
      es: "El que obtiene 400 euros de rentas inmobiliarias imputadas y 500 euros de letras del Tesoro no sujetas a retención."
  - id: d
    text:
      es: "El que obtiene 250 euros de rentas inmobiliarias imputadas, 250 euros de letras del Tesoro no sujetas a retención y 400 euros de una subvención para vivienda de protección oficial."
  explanation:
    es: "Las tres rentas computan juntas en el límite de 1.000 euros de la letra c). La suma de 300 + 500 + 400 es 1.200 euros, que supera el límite y obliga a declarar. Las demás combinaciones suman 800, 900 y 900 euros, y no lo superan."
  citation: "art. 96.2.c) LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0138
  prompt:
    es: "De acuerdo con el artículo 96.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en ningún caso tienen que declarar quienes obtengan exclusivamente rendimientos íntegros del trabajo, de capital o de actividades económicas, y ganancias patrimoniales, con el límite conjunto de:"
  options:
  - id: a
    correct: true
    text:
      es: "1.000 euros anuales y pérdidas patrimoniales de cuantía inferior a 500 euros."
  - id: b
    text:
      es: "1.000 euros anuales y pérdidas patrimoniales de cuantía inferior a 1.000 euros."
  - id: c
    text:
      es: "1.600 euros anuales y pérdidas patrimoniales de cuantía inferior a 500 euros."
  - id: d
    text:
      es: "500 euros anuales y pérdidas patrimoniales de cuantía inferior a 1.000 euros."
  explanation:
    es: "La regla final fija un límite conjunto de 1.000 euros anuales para esas rentas y de 500 euros para las pérdidas patrimoniales (art. 96.2). Subir el segundo a 1.000 euros, usar 1.600 euros como límite conjunto o intercambiar las cifras no coincide con el texto."
  citation: "art. 96.2 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0140
  prompt:
    es: "¿Cuál es el límite para no tener que declarar por rendimientos íntegros del trabajo que proceden de más de un pagador, con carácter general, según el artículo 96.3.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Es de 22.000 euros anuales."
  - id: b
    text:
      es: "Es de 1.500 euros anuales."
  - id: c
    text:
      es: "Es de 1.600 euros anuales."
  - id: d
    correct: true
    text:
      es: "Es de 15.876 euros anuales."
  explanation:
    es: "Con más de un pagador el límite general es de 15.876 euros anuales (art. 96.3.a). Los 22.000 euros son el límite con un único pagador, o con varios cuando lo de los pagadores secundarios no supera 1.500 euros. Los 1.500 y 1.600 euros son el umbral de esos pagadores y el límite del capital mobiliario."
  citation: "art. 96.3.a) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0141
  prompt:
    es: "De acuerdo con el artículo 96.3.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, con rendimientos del trabajo de más de un pagador, el límite es de 22.000 euros anuales si la suma de las cantidades percibidas del segundo y restantes pagadores, por orden de cuantía, no supera en su conjunto:"
  options:
  - id: a
    text:
      es: "la cantidad de 1.000 euros anuales."
  - id: b
    text:
      es: "la cantidad de 1.600 euros anuales."
  - id: c
    correct: true
    text:
      es: "la cantidad de 1.500 euros anuales."
  - id: d
    text:
      es: "la cantidad de 15.876 euros anuales."
  explanation:
    es: "El umbral de los pagadores secundarios es de 1.500 euros anuales en su conjunto (art. 96.3.a, número 1.º). Los 1.000 y 1.600 euros son límites de las letras b) y c) del apartado 2, y los 15.876 euros, el límite general con varios pagadores."
  citation: "art. 96.3.a) LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0143
  prompt:
    es: "Conforme al artículo 96.3.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el límite de 22.000 euros cuando hay más de un pagador:"
  options:
  - id: a
    correct: true
    text:
      es: "Se mantiene cuando los únicos rendimientos del trabajo son prestaciones pasivas del artículo 17.2.a) y la retención se ha determinado por el procedimiento especial reglamentario."
  - id: b
    text:
      es: "Se mantiene cuando los únicos rendimientos del trabajo son prestaciones pasivas, aunque la retención no se haya determinado por el procedimiento especial."
  - id: c
    text:
      es: "Se reduce a 15.876 euros cuando los únicos rendimientos del trabajo son prestaciones pasivas con retención por el procedimiento especial."
  - id: d
    text:
      es: "Se mantiene únicamente cuando lo percibido del segundo pagador supera 1.500 euros anuales."
  explanation:
    es: "El límite de 22.000 euros se mantiene con varios pagadores en dos supuestos: que lo de los pagadores secundarios no supere 1.500 euros, o que los únicos rendimientos sean prestaciones pasivas del artículo 17.2.a) con retención por el procedimiento especial (art. 96.3.a, número 2.º). Sin ese procedimiento, el supuesto no se cumple. El límite no baja a 15.876 euros en este caso. Y superar 1.500 euros en el segundo pagador produce el efecto contrario."
  citation: "art. 96.3.a) LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0144
  prompt:
    es: "De acuerdo con el artículo 96.3.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el límite de 15.876 euros para quienes perciban rendimientos íntegros del trabajo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se aplica cuando se perciban pensiones compensatorias del cónyuge o anualidades por alimentos distintas de las previstas en el artículo 7."
  - id: b
    text:
      es: "Se aplica cuando se perciban anualidades por alimentos a favor de los hijos exentas por el artículo 7."
  - id: c
    text:
      es: "Se aplica solo cuando las pensiones compensatorias superen 8.000 euros anuales."
  - id: d
    text:
      es: "No se aplica a las pensiones compensatorias del cónyuge, que mantienen el límite de 22.000 euros."
  explanation:
    es: "El límite baja a 15.876 euros cuando se perciban pensiones compensatorias del cónyuge o anualidades por alimentos diferentes de las del artículo 7 (art. 96.3.b). Las anualidades a favor de los hijos del artículo 7 son justo las excluidas. La ley no fija un mínimo de 8.000 euros para las pensiones. Y mantener los 22.000 euros con pensión compensatoria contradice la letra b)."
  citation: "art. 96.3.b) LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0145
  prompt:
    es: "Según el artículo 96.3.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en qué supuesto el límite para no declarar por rendimientos íntegros del trabajo es de 15.876 euros en lugar de 22.000 euros?"
  options:
  - id: a
    text:
      es: "Cuando el pagador de los rendimientos del trabajo practique retención al tipo general."
  - id: b
    text:
      es: "Cuando los rendimientos del trabajo procedan de un único pagador y superen 15.876 euros."
  - id: c
    text:
      es: "Cuando los rendimientos del trabajo sean prestaciones pasivas con retención por el procedimiento especial."
  - id: d
    correct: true
    text:
      es: "Cuando el pagador de los rendimientos del trabajo no esté obligado a retener de acuerdo con lo previsto reglamentariamente."
  explanation:
    es: "Si el pagador no está obligado a retener según el reglamento, el límite es de 15.876 euros (art. 96.3.c). Que practique retención al tipo general no cambia el límite. Superar 15.876 euros con un único pagador no es un supuesto del apartado 3. Y las prestaciones pasivas con retención especial mantienen los 22.000 euros incluso con varios pagadores."
  citation: "art. 96.3.c) LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0146
  prompt:
    es: "Conforme al artículo 96.3.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando se perciban rendimientos íntegros del trabajo sujetos a tipo fijo de retención, el límite para no tener que declarar es de:"
  options:
  - id: a
    text:
      es: "una cifra de 22.000 euros anuales."
  - id: b
    text:
      es: "una cifra de 1.600 euros anuales."
  - id: c
    correct: true
    text:
      es: "una cifra de 15.876 euros anuales."
  - id: d
    text:
      es: "una cifra de 1.500 euros anuales."
  explanation:
    es: "Los rendimientos sujetos a tipo fijo de retención rebajan el límite de 22.000 a 15.876 euros (art. 96.3.d). Mantener 22.000 euros ignora el apartado 3. Los 1.600 y 1.500 euros son umbrales de otras rentas y de los pagadores secundarios."
  citation: "art. 96.3.d) LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0147
  prompt:
    es: "Según el artículo 96.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en cuál de los siguientes supuestos NO es de 15.876 euros el límite para no declarar por rendimientos íntegros del trabajo?"
  options:
  - id: a
    text:
      es: "Cuando se perciben pensiones compensatorias del cónyuge distintas de las del artículo 7."
  - id: b
    correct: true
    text:
      es: "Cuando los rendimientos proceden de dos pagadores y lo percibido del segundo no supera 1.500 euros anuales."
  - id: c
    text:
      es: "Cuando el pagador no está obligado a retener según lo previsto reglamentariamente."
  - id: d
    text:
      es: "Cuando se perciben rendimientos del trabajo sujetos a tipo fijo de retención."
  explanation:
    es: "Con dos pagadores, si lo percibido del segundo no supera 1.500 euros anuales, el límite es de 22.000 euros (art. 96.3.a, número 1.º). Las pensiones compensatorias, el pagador sin obligación de retener y el tipo fijo de retención son supuestos del apartado 3 en los que el límite baja a 15.876 euros."
  citation: "art. 96.3 LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-96
- id: m03-l16-q0148
  prompt:
    es: "De acuerdo con el artículo 96.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes contribuyentes está obligado a declarar en todo caso?"
  options:
  - id: a
    text:
      es: "El que obtiene únicamente 20.000 euros de rendimientos del trabajo de un único pagador."
  - id: b
    correct: true
    text:
      es: "El que tiene derecho a la deducción por doble imposición internacional."
  - id: c
    text:
      es: "El que obtiene únicamente 1.200 euros de intereses de cuentas sometidos a retención."
  - id: d
    text:
      es: "El que percibe únicamente una pensión compensatoria de 6.000 euros anuales."
  explanation:
    es: "Quien tiene derecho a la deducción por doble imposición internacional está obligado a declarar en todo caso (art. 96.4). Con un único pagador, 20.000 euros no superan 22.000. Los 1.200 euros de intereses con retención no superan 1.600. Y 6.000 euros de pensión compensatoria no superan 15.876."
  citation: "art. 96.4 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
