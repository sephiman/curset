# anchor: fuente-ms-access-informes-html
- id: m02-l10-q227
  prompt:
    es: "En Access 365, al imprimir un informe o verlo en vista previa, ¿dónde aparece el pie del informe respecto al pie de página?"
  options:
  - id: a
    text:
      es: "Debajo del pie de página, al final de la hoja"
  - id: b
    text:
      es: "Antes del encabezado de página, en la primera hoja"
  - id: c
    text:
      es: "Dentro del pie de página, en la misma línea"
  - id: d
    correct: true
    text:
      es: "Encima del pie de página, tras el último grupo o detalle"
  explanation:
    es: "La nota de la ayuda dice que, fuera de la vista Diseño, «el pie de informe aparece encima del pie de página, inmediatamente después del último pie de grupo o línea de detalle en la última página». Debajo del pie de página es lo que la nota da solo para la vista Diseño. Antes del encabezado de página es el lugar del encabezado del informe, que según la página se imprime antes del encabezado de página. Y dentro del pie de página no cuadra con las funciones de cada sección: el pie de página imprime números de página o datos de cada página, y el pie de informe, totales o resúmenes de todo el informe."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q228
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas del grupo Informes crea un informe sencillo y tabular con todos los campos del origen seleccionado?"
  options:
  - id: a
    text:
      es: "Diseño de informe"
  - id: b
    correct: true
    text:
      es: "Informe"
  - id: c
    text:
      es: "Informe en blanco"
  - id: d
    text:
      es: "Asistente para informes"
  explanation:
    es: "La ayuda dice de Informe: «Crea un informe sencillo y tabular que contiene todos los campos en el origen de registros seleccionado en el panel de navegación». «Diseño de informe» abre un informe en blanco en vista Diseño. «Informe en blanco» lo abre en la vista Presentación con la lista de campos. «Asistente para informes» muestra un asistente de varios pasos."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q229
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas de informe muestra un asistente de varios pasos para especificar campos, niveles de agrupación y ordenación?"
  options:
  - id: a
    correct: true
    text:
      es: "Asistente para informes"
  - id: b
    text:
      es: "Etiquetas"
  - id: c
    text:
      es: "Diseño de informe"
  - id: d
    text:
      es: "Informe en blanco"
  explanation:
    es: "La ayuda dice del Asistente para informes: «Muestra un asistente de varios pasos que le permite especificar campos, niveles de agrupación y ordenación, y opciones de diseño». «Etiquetas» muestra un asistente distinto, para tamaños de etiqueta y campos. «Diseño de informe» e «Informe en blanco» abren un informe vacío, sin asistente."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q230
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas del grupo Informes muestra un asistente para seleccionar tamaños de etiqueta personalizados o estándar?"
  options:
  - id: a
    text:
      es: "Asistente para informes"
  - id: b
    correct: true
    text:
      es: "Etiquetas"
  - id: c
    text:
      es: "Informe"
  - id: d
    text:
      es: "Diseño de informe"
  explanation:
    es: "La ayuda dice de Etiquetas: «Muestra un asistente que permite seleccionar tamaños de etiqueta personalizados o estándar, así como los campos que se van a mostrar». «Asistente para informes» especifica campos, niveles de agrupación y ordenación. «Informe» crea un informe tabular sin asistente. «Diseño de informe» abre un informe en blanco en vista Diseño."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q232
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite agregar formato condicional a los controles de un informe abierto en la vista Presentación?"
  options:
  - id: a
    text:
      es: "Diseño de informe › Agrupación y totales › Formato condicional"
  - id: b
    text:
      es: "Diseño de presentación de informe › Temas › Formato condicional"
  - id: c
    text:
      es: "Crear › Informes › Formato condicional"
  - id: d
    correct: true
    text:
      es: "Formato › Formato del control › Formato condicional"
  explanation:
    es: "La ayuda dice: «En la pestaña Formato, en el grupo Formato del control, haga clic en Formato condicional». «Diseño de informe › Agrupación y totales» contiene Agrupar y ordenar. «Diseño de presentación de informe › Temas» contiene los temas de color y fuentes. «Crear › Informes» agrupa las herramientas para crear informes."
  citation: "fuente: `ms-access-informes.html`; «Resaltar datos con formato condicional»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q233
  prompt:
    es: "En el cuadro Nueva regla de formato de Access 365, ¿cuál de los siguientes tipos de regla compara los registros entre sí mediante barras de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Compare con otros registros"
  - id: b
    text:
      es: "Comprobar valores del registro actual o use una expresión"
  - id: c
    text:
      es: "Evaluar cada registro individualmente"
  - id: d
    text:
      es: "Aplicar el tema del informe"
  explanation:
    es: "La ayuda dice: «Para crear una regla que compare registros entre sí mediante barras de datos, haga clic en Compare con otros registros». «Comprobar valores del registro actual o use una expresión» crea una regla que evalúa cada registro individualmente. «Evaluar cada registro individualmente» describe esa misma regla, no la comparación. «Aplicar el tema del informe» no es un tipo de regla."
  citation: "fuente: `ms-access-informes.html`; «Resaltar datos con formato condicional»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q234
  prompt:
    es: "En Access 365, ¿cuál de los siguientes comandos de la pestaña Diseño de presentación de informe permite probar temas de color y fuentes con vista previa?"
  options:
  - id: a
    text:
      es: "Logotipo"
  - id: b
    correct: true
    text:
      es: "Temas"
  - id: c
    text:
      es: "Imagen de fondo"
  - id: d
    text:
      es: "Formato condicional"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de presentación de informe, haga clic en Temas y coloque el cursor sobre los distintos temas de la galería para obtener una vista previa de los efectos». «Logotipo» agrega una imagen en el encabezado o pie de página. «Imagen de fondo» está en el grupo Fondo de la pestaña Formato. «Formato condicional» resalta datos con reglas."
  citation: "fuente: `ms-access-informes.html`; «Personalizar el color y las fuentes»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q235
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas agrega una imagen de logotipo a un informe abierto en la vista Presentación?"
  options:
  - id: a
    text:
      es: "Diseño de presentación de informe › Fondo › Logotipo"
  - id: b
    text:
      es: "Diseño de presentación de informe › Temas › Logotipo"
  - id: c
    correct: true
    text:
      es: "Diseño de presentación de informe › Encabezado o pie de página › Logotipo"
  - id: d
    text:
      es: "Diseño de presentación de informe › Controles › Logotipo"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de presentación de informe, en el grupo Encabezado o pie de página, haga clic en Logotipo». El grupo Fondo no está en esa pestaña: la página sitúa Imagen de fondo en el grupo Fondo de la pestaña Formato. Temas es el comando con el que la página elige un tema de la galería, no una imagen. Y el grupo Controles no es donde la página pone Logotipo: lo pone en Encabezado o pie de página."
  citation: "fuente: `ms-access-informes.html`; «Agregar un logotipo o una imagen de fondo»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q236
  prompt:
    es: "En Access 365, ¿cómo se obtiene una vista previa de un informe desde el panel de navegación?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en el informe y Vista previa de impresión"
  - id: b
    text:
      es: "Doble clic en el informe y Vista Diseño"
  - id: c
    text:
      es: "Clic con el botón derecho y Imprimir"
  - id: d
    text:
      es: "Archivo › Exportar › PDF o XPS"
  explanation:
    es: "La ayuda dice: «Haga clic con el botón derecho en el informe en el panel de navegación y seleccione Vista previa de impresión». «Imprimir» con el botón derecho envía el informe a la impresora predeterminada, sin vista previa. «Vista Diseño» muestra la estructura del informe. «Archivo › Exportar › PDF o XPS» no es la ruta que da la ayuda: la exportación a PDF está en Datos externos."
  citation: "fuente: `ms-access-informes.html`; «Obtener una vista previa de un informe»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m02-l10-q237
  prompt:
    es: "Señale qué ocurre en Access 365 al hacer clic con el botón derecho en un informe del panel de navegación y seleccionar Imprimir:"
  options:
  - id: a
    text:
      es: "Se abre un cuadro para elegir la impresora y las copias"
  - id: b
    correct: true
    text:
      es: "El informe se envía a la impresora predeterminada"
  - id: c
    text:
      es: "Se abre la vista previa de impresión"
  - id: d
    text:
      es: "Se exporta el informe a un archivo PDF"
  explanation:
    es: "La ayuda dice: «Haga clic con el botón derecho en el informe en el panel de navegación y seleccione Imprimir. El informe se envía a la impresora predeterminada». El cuadro para elegir impresora y copias aparece, según la nota de la página, al seleccionar Imprimir en la pestaña Archivo, no con el menú del panel. La vista previa de impresión es otro comando del mismo menú, con su propio procedimiento. Y exportar a PDF contradice que el informe se envíe a la impresora."
  citation: "fuente: `ms-access-informes.html`; «Imprimir un informe»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-especificaciones-html
- id: m02-l10-q238
  prompt:
    es: "Según las especificaciones de Access 365, ¿cuál es el número máximo de encabezados y pies de página de grupo que admite un informe?"
  options:
  - id: a
    text:
      es: "5"
  - id: b
    text:
      es: "20"
  - id: c
    text:
      es: "100"
  - id: d
    correct: true
    text:
      es: "10"
  explanation:
    es: "Las especificaciones dicen: «1 encabezado o pie de página; 1 encabezado / pie de página; 10 encabezados/pies de página de grupo». Por eso 5 y 20 no son el máximo, y 100 lo supera con mucho."
  citation: "fuente: `ms-access-especificaciones.html`; «Formulario e informe»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m02-l10-q239
  prompt:
    es: "Según las especificaciones de Access 365, ¿cuál es el número máximo de páginas impresas de un informe?"
  options:
  - id: a
    correct: true
    text:
      es: "65 536"
  - id: b
    text:
      es: "32 768"
  - id: c
    text:
      es: "10 000"
  - id: d
    text:
      es: "1 048 576"
  explanation:
    es: "Las especificaciones dicen: «Número de páginas impresas en un informe», con el valor «65 536». Por eso 32 768 y 10 000 se quedan cortos y 1 048 576 se pasa del máximo que fija la página."
  citation: "fuente: `ms-access-especificaciones.html`; «Formulario e informe»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-access-dias-entre-fechas-html
- id: m02-l10-q264
  prompt:
    es: "En un cuadro de texto de un formulario de Access 365, ¿cuál de las siguientes propiedades de la hoja de propiedades recibe la expresión =DifFecha para calcular los días hasta el vencimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "Origen del control, en la pestaña Datos"
  - id: b
    text:
      es: "Formato, en la pestaña Formato"
  - id: c
    text:
      es: "Al hacer clic, en la pestaña Evento"
  - id: d
    text:
      es: "Regla de validación, en la pestaña Datos"
  explanation:
    es: "La expresión se escribe en la propiedad Origen del control, en la pestaña Datos de la hoja de propiedades del cuadro de texto. Al hacer clic, en la pestaña Evento, es donde se adjunta una macro o un procedimiento de evento a un botón de comando. Formato define cómo se muestra el dato, pero no lo calcula. Regla de validación limita los valores aceptados, y no calcula."
  citation: "fuente: `ms-access-dias-entre-fechas.html`; «Calcular el número de días entre dos fechas»"
  difficulty: 2
  tags:
  - "configuración"
