# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q122
  prompt:
    es: "En un formato personalizado de fecha de Excel 365 sin valores de hora, ¿cuál de las siguientes opciones describe lo que muestra el código mm?"
  options:
  - id: a
    correct: true
    text:
      es: "Los meses como 01-12"
  - id: b
    text:
      es: "Los meses como 1-12"
  - id: c
    text:
      es: "Los días como 01-31"
  - id: d
    text:
      es: "Los años como 00-99"
