# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q064
  prompt:
    es: "De acuerdo con el artículo 61.1 de la Constitución Española de 1978, el Rey, al ser proclamado ante las Cortes Generales, jurará desempeñar fielmente sus funciones, guardar y hacer guardar la Constitución y las leyes y:"
  options:
  - id: a
    text:
      es: "Respetar los derechos de los ciudadanos y de los pueblos de España."
  - id: b
    text:
      es: "Defender la unidad de la Nación y la integridad de su territorio."
  - id: c
    correct: true
    text:
      es: "Respetar los derechos de los ciudadanos y de las Comunidades Autónomas."
  - id: d
    text:
      es: "Respetar los derechos de los ciudadanos y la autonomía de los municipios."
  explanation:
    es: "El artículo 61.1 dice que el Rey jura «respetar los derechos de los ciudadanos y de las Comunidades Autónomas». Los pueblos de España y la autonomía de los municipios sustituyen a las Comunidades Autónomas, que son las que nombra el texto. Defender la unidad de la Nación y la integridad del territorio no forma parte del juramento."
  citation: "art. 61.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q065
  prompt:
    es: "¿Cuál de los siguientes juramentos prestan el Príncipe heredero y los Regentes, además del mismo que presta el Rey, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El de fidelidad al Rey."
  - id: b
    text:
      es: "El de fidelidad a las Cortes Generales."
  - id: c
    text:
      es: "El de obediencia al Gobierno de la Nación."
  - id: d
    text:
      es: "El de lealtad al Presidente del Gobierno."
  explanation:
    es: "El artículo 61.2 dice que el Príncipe heredero y el Regente o Regentes prestan el mismo juramento que el Rey, «así como el de fidelidad al Rey». El juramento añadido no es a las Cortes, al Gobierno ni a su Presidente."
  citation: "art. 61.2 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q158
  prompt:
    es: "El Rey, al ser proclamado, presta juramento de desempeñar fielmente sus funciones y de respetar los derechos de los ciudadanos y de las Comunidades Autónomas. ¿Ante quién lo presta?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante las Cortes Generales."
  - id: b
    text:
      es: "Ante el Tribunal Constitucional."
  - id: c
    text:
      es: "Ante el Presidente del Gobierno."
  - id: d
    text:
      es: "Ante el Consejo de Estado."
  explanation:
    es: "El artículo 61.1 dice que el Rey, «al ser proclamado ante las Cortes Generales, prestará juramento». No lo presta ante el Tribunal Constitucional, el Presidente del Gobierno o el Consejo de Estado."
  citation: "art. 61.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-61
- id: m01-l02-q159
  prompt:
    es: "Según el artículo 61.2 de la Constitución Española de 1978, el Príncipe heredero presta el juramento, además del de fidelidad al Rey:"
  options:
  - id: a
    text:
      es: "Al ser proclamado el Rey ante las Cortes Generales."
  - id: b
    text:
      es: "Desde su nacimiento, por ministerio de la Constitución."
  - id: c
    text:
      es: "Al cumplir los veinticinco años."
  - id: d
    correct: true
    text:
      es: "Al alcanzar la mayoría de edad."
  explanation:
    es: "El artículo 61.2 sitúa el juramento del Príncipe heredero «al alcanzar la mayoría de edad». No jura cuando se proclama el Rey ni al nacer, y los veinticinco años no son la edad de referencia."
  citation: "art. 61.2 CE"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q002
  prompt:
    es: "¿Por qué mayoría propone el Senado a los cuatro miembros del Tribunal Constitucional que le corresponden, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría de tres quintos de sus miembros, idéntica a la del Congreso."
  - id: b
    text:
      es: "Por mayoría absoluta de sus miembros."
  - id: c
    text:
      es: "Por mayoría de dos tercios de sus miembros."
  - id: d
    text:
      es: "Por mayoría simple de los senadores presentes."
  explanation:
    es: "El artículo 159.1 dice que cuatro miembros se nombran a propuesta del Congreso «por mayoría de tres quintos de sus miembros» y cuatro a propuesta del Senado, «con idéntica mayoría». La mayoría absoluta, la de dos tercios y la simple no son las que fija el artículo."
  citation: "art. 159.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-159
- id: m01-l02-q003
  prompt:
    es: "Según el artículo 159.2 de la Constitución Española de 1978, los miembros del Tribunal Constitucional se nombrarán entre Magistrados y Fiscales, Profesores de Universidad, funcionarios públicos y Abogados, todos ellos juristas de reconocida competencia con:"
  options:
  - id: a
    text:
      es: "Más de diez años de ejercicio profesional."
  - id: b
    correct: true
    text:
      es: "Más de quince años de ejercicio profesional."
  - id: c
    text:
      es: "Más de veinte años de ejercicio profesional."
  - id: d
    text:
      es: "Más de doce años de ejercicio profesional."
  explanation:
    es: "El artículo 159.2 exige juristas de reconocida competencia «con más de quince años de ejercicio profesional». Diez, doce y veinte años no son la cifra del artículo."
  citation: "art. 159.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1979-23709-art-16
- id: m01-l02-q006
  prompt:
    es: "De acuerdo con el artículo 16 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ningún Magistrado podrá ser propuesto al Rey para otro período inmediato:"
  options:
  - id: a
    text:
      es: "Salvo que hubiera ocupado el cargo por un plazo no superior a seis años."
  - id: b
    correct: true
    text:
      es: "Salvo que hubiera ocupado el cargo por un plazo no superior a tres años."
  - id: c
    text:
      es: "Salvo que lo proponga el mismo órgano que lo propuso la primera vez."
  - id: d
    text:
      es: "Salvo que hubiera sido Presidente del Tribunal durante su mandato."
  explanation:
    es: "El artículo 16.4 de la LOTC dice: «Ningún Magistrado podrá ser propuesto al Rey para otro período inmediato, salvo que hubiera ocupado el cargo por un plazo no superior a tres años». El límite es de tres años, no de seis. El órgano proponente y el haber sido Presidente no abren ninguna excepción."
  citation: "art. 16.4 LOTC"
  difficulty: 3
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-1978-31229-art-160
- id: m01-l02-q007
  prompt:
    es: "Según el artículo 160 de la Constitución Española de 1978, el Presidente del Tribunal Constitucional será nombrado entre sus miembros por el Rey:"
  options:
  - id: a
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de nueve años."
  - id: b
    text:
      es: "A propuesta del Gobierno y por un período de tres años."
  - id: c
    correct: true
    text:
      es: "A propuesta del mismo Tribunal en pleno y por un período de tres años."
  - id: d
    text:
      es: "A propuesta del Congreso de los Diputados y por un período de cinco años."
  explanation:
    es: "El artículo 160 dice que el Presidente será nombrado por el Rey «a propuesta del mismo Tribunal en pleno y por un período de tres años». Nueve años es el mandato de los Magistrados. Ni el Gobierno ni el Congreso proponen al Presidente."
  citation: "art. 160 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1979-23709-art-7
- id: m01-l02-q008
  prompt:
    es: "¿Cuántas Salas tiene el Tribunal Constitucional y cuántos Magistrados componen cada una, según la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional?"
  options:
  - id: a
    text:
      es: "Dos Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: b
    text:
      es: "Tres Salas, compuestas cada una por cuatro Magistrados nombrados por el Tribunal en Pleno."
  - id: c
    text:
      es: "Cuatro Salas, compuestas cada una por tres Magistrados nombrados por el Presidente."
  - id: d
    correct: true
    text:
      es: "Dos Salas, compuestas cada una por seis Magistrados nombrados por el Tribunal en Pleno."
  explanation:
    es: "El artículo 7.1 de la LOTC dice que el Tribunal «consta de dos Salas» y que cada una «está compuesta por seis Magistrados nombrados por el Tribunal en Pleno». Las demás opciones cambian el número de Salas o de Magistrados. Las unidades de tres Magistrados son las Secciones (art. 8.1 LOTC), no las Salas."
  citation: "art. 7.1 LOTC"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1979-23709-art-76
- id: m01-l02-q009
  prompt:
    es: "Según el artículo 76 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿en qué plazo puede el Gobierno impugnar las disposiciones normativas sin fuerza de ley y resoluciones de cualquier órgano de las Comunidades Autónomas?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los dos meses siguientes a su publicación o, en defecto de esta, desde que llegue a su conocimiento."
  - id: b
    text:
      es: "Dentro de los tres meses siguientes a su publicación en el diario oficial correspondiente."
  - id: c
    text:
      es: "Dentro de los cinco meses siguientes a su publicación, sin otra forma de cómputo."
  - id: d
    text:
      es: "Dentro de los nueve meses siguientes a su publicación, previo acuerdo de la Comisión Bilateral."
  explanation:
    es: "El artículo 76 de la LOTC fija «los dos meses siguientes a la fecha de su publicación o, en defecto de la misma, desde que llegare a su conocimiento». Tres meses es el plazo general del recurso de inconstitucionalidad (art. 33.1). Cinco meses es el plazo del Tribunal para ratificar o levantar la suspensión (art. 161.2 CE). Nueve meses es el plazo especial del artículo 33.2."
  citation: "art. 76 LOTC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1979-23709-art-33
- id: m01-l02-q011
  prompt:
    es: "Conforme al artículo 33.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el recurso de inconstitucionalidad se formulará, con carácter general, dentro del plazo de:"
  options:
  - id: a
    text:
      es: "Dos meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  - id: b
    text:
      es: "Nueve meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  - id: c
    text:
      es: "Tres meses a partir de la entrada en vigor de la ley, disposición o acto con fuerza de ley impugnado."
  - id: d
    correct: true
    text:
      es: "Tres meses a partir de la publicación de la ley, disposición o acto con fuerza de ley impugnado."
  explanation:
    es: "El artículo 33.1 de la LOTC fija «el plazo de tres meses a partir de la publicación de la Ley, disposición o acto con fuerza de Ley impugnado». Dos meses es el plazo del artículo 76 para las disposiciones sin fuerza de ley. Nueve meses es el plazo especial del artículo 33.2. El cómputo empieza con la publicación, no con la entrada en vigor."
  citation: "art. 33.1 LOTC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1979-23709-art-33
- id: m01-l02-q012
  prompt:
    es: "Conforme al artículo 33.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Presidente del Gobierno y los órganos colegiados ejecutivos autonómicos pueden recurrir en nueve meses cuando, para evitar el recurso:"
  options:
  - id: a
    correct: true
    text:
      es: "Se reúne la Comisión Bilateral de Cooperación y acuerda iniciar negociaciones para resolver las discrepancias."
  - id: b
    text:
      es: "Se reúne la Conferencia Sectorial competente y acuerda iniciar negociaciones para resolver las discrepancias."
  - id: c
    text:
      es: "Se reúne la Comisión General de las Comunidades Autónomas del Senado y propone una modificación del texto."
  - id: d
    text:
      es: "El Consejo de Estado emite dictamen favorable a la apertura de negociaciones entre ambas Administraciones."
  explanation:
    es: "El artículo 33.2 de la LOTC exige que se reúna «la Comisión Bilateral de Cooperación entre la Administración General del Estado y la respectiva Comunidad Autónoma» y que en ella se adopte «un acuerdo sobre iniciación de negociaciones para resolver las discrepancias». No menciona la Conferencia Sectorial, la Comisión General de las Comunidades Autónomas del Senado ni el Consejo de Estado."
  citation: "art. 33.2 LOTC"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1979-23709-art-44
- id: m01-l02-q013
  prompt:
    es: "Según la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿en qué plazo se interpone el recurso de amparo contra una violación de derechos con origen inmediato y directo en un acto u omisión de un órgano judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "En el de 30 días, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: b
    text:
      es: "En el de 20 días, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: c
    text:
      es: "En el de tres meses, a partir de la notificación de la resolución recaída en el proceso judicial."
  - id: d
    text:
      es: "En el de 30 días, a partir de que la resolución recaída en el proceso judicial sea firme."
  explanation:
    es: "El artículo 44.2 de la LOTC dice: «El plazo para interponer el recurso de amparo será de 30 días, a partir de la notificación de la resolución recaída en el proceso judicial». Veinte días es el plazo frente a actos del Gobierno o la Administración (art. 43.2). Tres meses es el plazo frente a actos sin valor de ley de las Cortes o las Asambleas (art. 42). El cómputo empieza con la notificación."
  citation: "art. 44.2 LOTC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q067
  prompt:
    es: "¿Cuál de las siguientes competencias NO atribuye la Constitución Española de 1978 a las Cortes Generales en relación con la Corona?"
  options:
  - id: a
    text:
      es: "Autorizar al Rey a declarar la guerra y hacer la paz."
  - id: b
    text:
      es: "Nombrar la Regencia cuando no haya persona a quien corresponda."
  - id: c
    text:
      es: "Proveer a la sucesión si se extinguen todas las líneas llamadas en Derecho."
  - id: d
    correct: true
    text:
      es: "Nombrar y relevar a los miembros civiles y militares de la Casa del Rey."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». Esa competencia es del Rey, no de las Cortes. Las otras tres sí son de las Cortes Generales: autorizar la guerra y la paz (art. 63.3), nombrar la Regencia (art. 59.3) y proveer a la sucesión (art. 57.3)."
  citation: "art. 65.2 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
