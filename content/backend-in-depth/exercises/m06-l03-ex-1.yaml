- id: m06-l03-q03
  prompt:
    en: In PostgreSQL 18, a table has a B-tree index on `(a, b, c)` and a query filters `WHERE a = 5 AND b >= 42
      AND c < 77`. Which constraints are always used to limit the portion of the index that is scanned?
  options:
  - id: a
    text:
      en: Only the equality on `a`
  - id: b
    text:
      en: The equality on `a`, the inequality on `b` and the inequality on `c`
  - id: c
    text:
      en: Only the inequality on `c`
  - id: d
    correct: true
    text:
      en: The equality on `a` and the inequality on `b`
  explanation:
    en: Equality constraints on leading columns, plus inequality constraints on the first column without an equality
      constraint, always limit the scan, which here means `a` and `b`. Stopping at the equality on `a` misses the
      inequality on `b`. The inequality on `c` is on a column to the right, which does not necessarily reduce the
      portion scanned, so it is not guaranteed to limit it. The inequality on `c` alone ignores the leading columns
      that carry the rule.
  citation: pg-indexes-multicolumn#INDEXES-MULTICOLUMN
  extract:
    en: equality constraints on leading columns, plus any inequality constraints on the first column that does not
      have an equality constraint, will always be used to limit the portion of the index that is scanned
- id: m06-l03-q05
  prompt:
    en: In PostgreSQL 18, an index on `(x, y)` meets the query `WHERE y = 7700`. When does the planner generally
      choose a skip scan on that index?
  options:
  - id: a
    text:
      en: When `x` has many distinct values, so every repeated search is cheap
  - id: b
    correct: true
    text:
      en: When `x` has so few distinct values that most of the index can be skipped
  - id: c
    text:
      en: Only when the query also has an equality constraint on `x`
  - id: d
    text:
      en: Never, because a query must constrain the leading column to use the index
  explanation:
    en: The planner generally takes this approach only when there are so few distinct `x` values that the scan skips
      most of the index. With many distinct `x` values the entire index has to be scanned. Skip scan is meant for
      a column that lacks an equality constraint, so requiring one on `x` is wrong. A B-tree index scan might apply
      the skip scan optimization to a query without a constraint on the leading column, so it is not ruled out.
  citation: pg-indexes-multicolumn#INDEXES-MULTICOLUMN
  extract:
    en: This approach is generally only taken when there are so few distinct x values that the planner expects the
      scan to skip over most of the index
- id: m06-l03-q09
  prompt:
    en: Given a PostgreSQL 18 index on columns `x` and `y` of a table that also has a column `z`, which query could
      use an index-only scan?
  options:
  - id: a
    text:
      en: '`SELECT x, z FROM tab WHERE x = ''key''`'
  - id: b
    text:
      en: '`SELECT x FROM tab WHERE x = ''key'' AND z < 42`'
  - id: c
    text:
      en: '`SELECT z FROM tab WHERE x = ''key'' AND y < 42`'
  - id: d
    correct: true
    text:
      en: '`SELECT x FROM tab WHERE x = ''key'' AND y < 42`'
  explanation:
    en: The query that references only `x` and `y` uses columns stored in the index. Selecting `z` needs a column
      the index does not store. Filtering on `z` references an unstored column as well. The last query selects `z`
      too, so it cannot be answered from the index alone.
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: SELECT x FROM tab WHERE x = 'key' AND y < 42;
- id: m06-l03-q16
  prompt:
    en: In PostgreSQL 18 `EXPLAIN ANALYZE`, an index scan node shows `actual time=0.003..0.003 rows=1.00 loops=10`.
      About how much total time was spent in the node?
  options:
  - id: a
    text:
      en: 0.003 ms, because the actual time is already the total
  - id: b
    text:
      en: About 0.0003 ms, the per-execution time divided by 10
  - id: c
    correct: true
    text:
      en: About 0.030 ms, the per-execution time times 10
  - id: d
    text:
      en: About 10 ms, one millisecond per loop
  explanation:
    en: With `loops` above 1, the actual time and rows are averages per execution, so multiplying by `loops` gives
      the total, about 0.030 ms. Reading the actual time as the total ignores that it is a per-execution average.
      Dividing by `loops` goes the wrong way. The figure is in milliseconds already, so 10 ms is far too large.
  citation: pg-using-explain#USING-EXPLAIN-ANALYZE
  extract:
    en: Multiply by the loops value to get the total time actually spent in the node.
- id: m06-l03-q20
  prompt:
    en: In PostgreSQL 18, which plan do you nearly always get on a table that occupies only one disk page?
  options:
  - id: a
    text:
      en: An index scan, because it reads fewer rows
  - id: b
    text:
      en: A bitmap heap scan, because it sorts row locations
  - id: c
    correct: true
    text:
      en: A sequential scan, whether or not indexes exist
  - id: d
    text:
      en: An index-only scan, because the page is cached
  explanation:
    en: Reading the table takes one page read either way, so there is no value in spending more page reads on an
      index, and a sequential scan results. An index scan would need extra page reads. A bitmap heap scan is also
      an index plan and shares that cost. An index-only scan has the same problem.
  citation: pg-using-explain#USING-EXPLAIN-CAVEATS
  extract:
    en: on a table that only occupies one disk page, you'll nearly always get a sequential scan plan whether indexes
      are available or not
- id: m06-l03-q25
  prompt:
    en: In PostgreSQL 18, one range partition is from 1 to 10 and the next from 10 to 20. In which partition does
      the value 10 belong?
  options:
  - id: a
    text:
      en: The first partition
  - id: b
    text:
      en: Both partitions
  - id: c
    correct: true
    text:
      en: The second partition
  - id: d
    text:
      en: Neither partition, so the insert is rejected
  explanation:
    en: Range bounds are inclusive at the lower end and exclusive at the upper end, so 10 belongs to the second
      partition. It is excluded from the first because the first range's upper bound is exclusive. It cannot be
      in both, because ranges do not overlap. The second range includes 10, so the insert is accepted.
  citation: pg-ddl-partitioning#DDL-PARTITIONING-OVERVIEW
  extract:
    en: then value 10 belongs to the second partition not the first.
- id: m06-l03-q27
  prompt:
    en: In PostgreSQL 18, a partition is pruned during initialization of the query plan using a `PREPARE` parameter.
      Which statement is true?
  options:
  - id: a
    correct: true
    text:
      en: It is hidden from `EXPLAIN`, but still locked when execution begins
  - id: b
    text:
      en: It shows as `(never executed)` in `EXPLAIN ANALYZE`
  - id: c
    text:
      en: It is never locked at all, because it is excluded before execution begins
  - id: d
    text:
      en: It is pruned only if the value is known at planning time
  explanation:
    en: Partitions pruned at this stage do not show up in `EXPLAIN` or `EXPLAIN ANALYZE`, yet they are still locked
      at the start of execution. The `(never executed)` marker belongs to pruning during actual execution. Pruning
      can also happen during execution, so planning time is not the only moment.
  citation: pg-ddl-partitioning#DDL-PARTITION-PRUNING
  extract:
    en: any partitions removed by the partition pruning done at this stage are still locked at the beginning of
      execution
- id: m06-l03-q34
  prompt:
    en: In PostgreSQL 18, an index on `orders (order_nr)` has the predicate `WHERE amount < 2`, and a prepared query
      filters `WHERE amount < ?` with a parameter. Why is the partial index not usable for that query?
  options:
  - id: a
    text:
      en: The predicate column `amount` differs from the indexed column `order_nr`, which a partial index does not
        allow
  - id: b
    correct: true
    text:
      en: Matching takes place at planning time, so the parameterized clause cannot be shown to imply the predicate
  - id: c
    text:
      en: Inequality predicates are never recognized, so only an `=` predicate can match a query clause
  - id: d
    text:
      en: The planner defers the match to run time, when the parameter is bound, and that check fails for values
        above 2
  explanation:
    en: 'Matching takes place at query planning time, so a parameterized clause such as `amount < ?` never implies
      `amount < 2` for all possible parameter values (`pg-indexes-partial#INDEXES-PARTIAL`). The indexed column
      and the predicate column do not need to match, since PostgreSQL supports partial indexes with arbitrary predicates
      over columns of the indexed table (`pg-indexes-partial#INDEXES-PARTIAL`). Inequalities are recognized: the
      system can recognize simple inequality implications, for example that `x < 1` implies `x < 2` (`pg-indexes-partial#INDEXES-PARTIAL`).
      A run-time match does not exist, because matching takes place at query planning time, not at run time (`pg-indexes-partial#INDEXES-PARTIAL`).'
  citation: pg-indexes-partial#INDEXES-PARTIAL
  extract:
    en: Matching takes place at query planning time, not at run time.
- id: m06-l03-q35
  prompt:
    en: In PostgreSQL 18, which reason does the documentation give for GIN indexes being unable to support index-only
      scans?
  options:
  - id: a
    correct: true
    text:
      en: Each index entry typically holds only part of the original data value
  - id: b
    text:
      en: A GIN index stores its entries inside the table's heap pages, mixed with the table rows
  - id: c
    text:
      en: GIN indexes cannot be defined on more than one column, so they never cover a query
  - id: d
    text:
      en: GIN index entries carry no visibility information, unlike the entries of every other index type
  explanation:
    en: GIN indexes cannot support index-only scans because each index entry typically holds only part of the original
      data value (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). Storage location is not the cause, since
      each index is stored separately from the table's main data area, the heap (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
      The column count is not the cause either, because the B-tree, GiST, GIN and BRIN index types all support multiple-key-column
      indexes (`pg-indexes-multicolumn#INDEXES-MULTICOLUMN`). Visibility is not specific to GIN, because visibility
      information is not stored in index entries of any type, only in heap entries (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS; pg-indexes-multicolumn#INDEXES-MULTICOLUMN
  extract:
    en: GIN indexes cannot support index-only scans because each index entry typically holds only part of the original
      data value
- id: m06-l03-q37
  prompt:
    en: In PostgreSQL 18, you add the `ANALYZE` option to a plain `EXPLAIN` of a `SELECT` statement. What does the
      server do with the statement?
  options:
  - id: a
    text:
      en: It only plans the query and shows more precise cost estimates, without executing it
  - id: b
    text:
      en: Nothing changes, because the `ANALYZE` option defaults to `TRUE` and is already active
  - id: c
    text:
      en: It executes the query but leaves out buffer usage unless the `BUFFERS` option is also given
  - id: d
    correct: true
    text:
      en: It actually executes the query and shows the true row counts and run times of each plan node
  explanation:
    en: With `ANALYZE`, `EXPLAIN` actually executes the query and then displays the true row counts and true run
      time accumulated within each plan node (`pg-using-explain#USING-EXPLAIN-ANALYZE`). Planning only is ruled
      out because the option is described as carrying out the command and showing actual run times and other statistics
      (`pg-sql-explain#id-1.9.3.148.8`). Being already active is ruled out because the `ANALYZE` parameter defaults
      to `FALSE` (`pg-sql-explain#id-1.9.3.148.8`). Missing buffer usage is ruled out because buffers information
      is automatically included when `ANALYZE` is used (`pg-sql-explain#id-1.9.3.148.8`).
  citation: pg-using-explain#USING-EXPLAIN-ANALYZE; pg-sql-explain#id-1.9.3.148.8
  extract:
    en: EXPLAIN actually executes the query, and then displays the true row counts and true run time accumulated
      within each plan node
- id: m06-l03-q38
  prompt:
    en: In PostgreSQL 18, a query combines `ORDER BY` with `LIMIT 20 OFFSET 100000`. Which statement from the documentation
      explains why it might be inefficient?
  options:
  - id: a
    text:
      en: '`OFFSET` rows are counted toward the `LIMIT`, so the server must fetch 100020 rows twice'
  - id: b
    correct: true
    text:
      en: The rows skipped by `OFFSET` still have to be computed inside the server
  - id: c
    text:
      en: '`OFFSET` makes the optimizer ignore `LIMIT`, so the plan is built for the whole result'
  - id: d
    text:
      en: '`OFFSET` makes the row order unpredictable even with `ORDER BY`, so a second sort is needed'
  explanation:
    en: The rows skipped by an `OFFSET` clause still have to be computed inside the server, so a large `OFFSET`
      might be inefficient (`pg-queries-limit#QUERIES-LIMIT`). Counting toward the limit is ruled out because `OFFSET`
      rows are skipped before starting to count the `LIMIT` rows that are returned (`pg-queries-limit#QUERIES-LIMIT`).
      Ignoring `LIMIT` is ruled out because the query optimizer takes `LIMIT` into account when generating query
      plans (`pg-queries-limit#QUERIES-LIMIT`). An unpredictable order is ruled out because it arises only without
      `ORDER BY`, and the ordering is unknown unless you specified `ORDER BY` (`pg-queries-limit#QUERIES-LIMIT`).
  citation: pg-queries-limit#QUERIES-LIMIT
  extract:
    en: The rows skipped by an OFFSET clause still have to be computed inside the server
- id: m06-l03-q39
  prompt:
    en: In PostgreSQL 18, when does an index-only scan on a B-tree index pay off compared with a standard index
      scan on the same index?
  options:
  - id: a
    correct: true
    text:
      en: Only if a significant fraction of the table's heap pages have their all-visible map bits set
  - id: b
    text:
      en: Whenever the query references only columns stored in the index
  - id: c
    text:
      en: When most rows were modified recently, because fresh rows are visible to every transaction
  - id: d
    text:
      en: Whenever the index has `INCLUDE` columns, whatever the table's rate of change
  explanation:
    en: An index-only scan will be a win only if a significant fraction of the table's heap pages have their all-visible
      map bits set (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). Referencing only index columns is ruled
      out because it makes the scan only physically possible, with the visibility requirement still pending (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
      Recent modification is ruled out because the heap access is still needed if the table row has been modified
      recently (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`). `INCLUDE` columns are ruled out because
      there is little point in them unless the table changes slowly enough that an index-only scan is likely to
      not need to access the heap (`pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS`).
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: it will be a win only if a significant fraction of the table's heap pages have their all-visible map bits
      set
