- id: m11-l02-v-integer-overflow-001
  prompt:
    en: |-
      The `exact` method calls a `Math` method on two `int` values and catches `ArithmeticException`. What does this program print, line by line?

      ```java
      public class Main {
          static String exact(int x, int y) {
              try {
                  return String.valueOf(Math.addExact(x, y));
              } catch (ArithmeticException e) {
                  return "overflow";
              }
          }

          public static void main(String[] args) {
              System.out.println(exact(2147483647, 3));
              System.out.println(exact(2000000000, -460));
              System.out.println(exact(2147483647, 2));
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`overflow`, `1999999540`, `overflow`'
    correct: true
  - id: b
    text:
      en: '`-2147483646`, `1999999540`, `-2147483647`'
  - id: c
    text:
      en: '`2147483650`, `1999999540`, `2147483649`'
  - id: d
    text:
      en: '`2147483644`, `2000000460`, `2147483645`'
  explanation:
    en: '`Math.addExact` returns the result of `x + y` when it fits in an `int` and throws `ArithmeticException` when it does
      not, and `exact` turns that exception into `overflow`. `2147483647 + 3` is `2147483650`, which does not fit in an `int`,
      so `Math.addExact` throws `ArithmeticException` and `exact(2147483647, 3)` returns `overflow`. `2000000000 + -460` is
      `1999999540`, which fits in an `int`, so `exact(2000000000, -460)` returns it as text. `2147483647 + 2` is `2147483649`,
      which does not fit in an `int`, so `Math.addExact` throws `ArithmeticException` and `exact(2147483647, 2)` returns `overflow`.
      The program prints `overflow`, `1999999540`, `overflow`. `-2147483646`, `1999999540`, `-2147483647` comes from this
      mistake: using the plain `+` operator instead of `Math.addExact`. `Math.addExact` throws `ArithmeticException` when
      the result overflows an `int`, so an overflowing call never returns a wrapped value. `2147483650`, `1999999540`, `2147483649`
      comes from this mistake: computing the result as a `long` instead of calling `Math.addExact`. `Math.addExact(int, int)`
      takes `int` values and throws when the `int` result overflows, so it never returns a wider result. `2147483644`, `2000000460`,
      `2147483645` comes from this mistake: reading `Math.addExact` as `Math.subtractExact`. `Math.addExact` combines its
      arguments with `+`, and no other operation is applied.'
