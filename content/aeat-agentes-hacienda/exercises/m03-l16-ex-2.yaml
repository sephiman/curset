# anchor: boe-a-2006-20764-art-79
- id: m03-l16-q0074
  prompt:
    es: "De acuerdo con el artículo 79 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la cuota diferencial es el resultado de minorar la cuota líquida total del impuesto, que es la suma de las cuotas líquidas:"
  options:
  - id: a
    correct: true
    text:
      es: "estatal y autonómica, en los importes que enumera el artículo."
  - id: b
    text:
      es: "estatal y municipal, en los importes que enumera el artículo."
  - id: c
    text:
      es: "estatal y autonómica, solo en el importe de las retenciones practicadas."
  - id: d
    text:
      es: "íntegra estatal y líquida autonómica, en los importes que enumera el artículo."
  explanation:
    es: "La cuota líquida total suma las cuotas líquidas estatal y autonómica, y la cuota diferencial resulta de minorarla en los importes del artículo 79 (doble imposición internacional, retenciones, ingresos a cuenta, pagos fraccionados, etc.). No existe cuota municipal. Limitarla a las retenciones deja fuera el resto de la lista. Y sumar la cuota íntegra estatal con la líquida autonómica mezcla magnitudes distintas."
  citation: "art. 79 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-79
- id: m03-l16-q0075
  prompt:
    es: "Según el artículo 79 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes importes minora la cuota líquida total para obtener la cuota diferencial?"
  options:
  - id: a
    text:
      es: "La reducción por pensiones compensatorias a favor del cónyuge fijadas por decisión judicial, que se practica en la base imponible general antes de aplicar la escala."
  - id: b
    text:
      es: "El mínimo personal y familiar del contribuyente."
  - id: c
    text:
      es: "Las aportaciones a planes de pensiones del período impositivo."
  - id: d
    correct: true
    text:
      es: "Las retenciones, los ingresos a cuenta y los pagos fraccionados previstos en la ley y en sus normas reglamentarias de desarrollo."
  explanation:
    es: "El artículo 79.e) minora la cuota líquida total en las retenciones, ingresos a cuenta y pagos fraccionados. La reducción por pensiones compensatorias, el mínimo personal y familiar y las aportaciones a planes de pensiones operan antes, sobre la base o en la escala, y no sobre la cuota líquida total."
  citation: "art. 79 LIRPF"
  difficulty: 1
  tags:
  - "lista"
# anchor: boe-a-2006-20764-art-79
- id: m03-l16-q0076
  prompt:
    es: "Conforme al artículo 79 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el contribuyente que adquiere su condición por cambio de residencia:"
  options:
  - id: a
    text:
      es: "Minoran la cuota líquida total las cuotas del Impuesto sobre Sociedades devengadas en el período del cambio de residencia."
  - id: b
    text:
      es: "Minoran la cuota líquida total las cuotas del Impuesto sobre la Renta de no Residentes devengadas en cualquier período anterior al cambio."
  - id: c
    text:
      es: "Minoran la cuota líquida total las cuotas del Impuesto sobre la Renta de no Residentes únicamente si procedían de otro Estado miembro de la Unión Europea."
  - id: d
    correct: true
    text:
      es: "Minoran la cuota líquida total las cuotas satisfechas del Impuesto sobre la Renta de no Residentes devengadas en el período impositivo en que se produce el cambio de residencia."
  explanation:
    es: "Quien adquiere la condición de contribuyente por cambio de residencia minora la cuota líquida total, entre otros importes, con las cuotas satisfechas del Impuesto sobre la Renta de no Residentes devengadas en el período en que se produce el cambio (art. 79.d). El Impuesto sobre Sociedades no figura en el precepto. Las cuotas de períodos anteriores tampoco. Y la ley no restringe la regla a rentas obtenidas en la Unión Europea."
  citation: "art. 79 LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-80
- id: m03-l16-q0077
  prompt:
    es: "De acuerdo con el artículo 80.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando entre las rentas del contribuyente figuren rendimientos o ganancias patrimoniales obtenidos y gravados en el extranjero, la deducción por doble imposición internacional es:"
  options:
  - id: a
    text:
      es: "la mayor del importe efectivo satisfecho en el extranjero por un impuesto de naturaleza idéntica o análoga y del resultado de aplicar el tipo medio efectivo de gravamen a la parte de base liquidable gravada en el extranjero."
  - id: b
    text:
      es: "la suma del importe efectivo satisfecho en el extranjero por un impuesto de naturaleza idéntica o análoga y del resultado de aplicar el tipo medio efectivo de gravamen a la parte de base liquidable gravada en el extranjero."
  - id: c
    correct: true
    text:
      es: "la menor del importe efectivo satisfecho en el extranjero por un impuesto de naturaleza idéntica o análoga y del resultado de aplicar el tipo medio efectivo de gravamen a la parte de base liquidable gravada en el extranjero."
  - id: d
    text:
      es: "el importe efectivo satisfecho en el extranjero por un impuesto de naturaleza idéntica o análoga, sin otro límite."
  explanation:
    es: "Se deduce la menor de dos cantidades: lo efectivamente pagado en el extranjero por un impuesto idéntico o análogo, o el tipo medio efectivo aplicado a la parte de base liquidable gravada fuera (art. 80.1). La mayor o la suma de ambas darían una deducción superior a la prevista. Y sin otro límite se ignora el segundo tope."
  citation: "art. 80.1 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-80
- id: m03-l16-q0078
  prompt:
    es: "Un contribuyente obtiene rendimientos gravados en el extranjero por los que satisface allí 2.000 euros de un impuesto de naturaleza idéntica al IRPF. La parte de su base liquidable gravada en el extranjero es de 10.000 euros y su tipo medio efectivo de gravamen es del 12 por ciento. Aplicando el artículo 80.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe corresponde a la deducción por doble imposición internacional?"
  options:
  - id: a
    text:
      es: "La deducción es de 2.000 euros."
  - id: b
    correct: true
    text:
      es: "La deducción es de 1.200 euros."
  - id: c
    text:
      es: "La deducción es de 3.200 euros."
  - id: d
    text:
      es: "La deducción es de 1.600 euros."
  explanation:
    es: "Se deduce la menor de dos cantidades: lo satisfecho en el extranjero (2.000 euros) y el tipo medio efectivo aplicado a la base gravada fuera (12 % de 10.000 = 1.200 euros). La deducción es de 1.200 euros. Los 2.000 euros ignoran el segundo límite. Los 3.200 euros suman ambas cantidades. Y los 1.600 euros son su media aritmética, que la ley no usa."
  citation: "art. 80.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2006-20764-art-79
- id: m03-l16-q0178
  prompt:
    es: "De acuerdo con el artículo 79 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la deducción por doble imposición internacional del artículo 80:"
  options:
  - id: a
    text:
      es: "Minora la base liquidable general antes de aplicar la escala."
  - id: b
    text:
      es: "Minora únicamente la cuota líquida autonómica."
  - id: c
    correct: true
    text:
      es: "Minora la cuota líquida total del impuesto para obtener la cuota diferencial."
  - id: d
    text:
      es: "Minora la cuota íntegra estatal, antes de las deducciones del artículo 68."
  explanation:
    es: "La deducción del artículo 80 es uno de los importes que minoran la cuota líquida total, suma de la estatal y la autonómica, para obtener la cuota diferencial (art. 79.a). No actúa sobre la base liquidable, ni solo sobre la cuota autonómica, ni sobre la cuota íntegra estatal."
  citation: "art. 79 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-80
- id: m03-l16-q0179
  prompt:
    es: "Conforme al artículo 80.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el impuesto satisfecho en el extranjero que se tiene en cuenta para la deducción por doble imposición internacional:"
  options:
  - id: a
    text:
      es: "Puede ser cualquier impuesto indirecto que haya gravado la renta en el extranjero."
  - id: b
    correct: true
    text:
      es: "Debe ser un impuesto de naturaleza idéntica o análoga al IRPF o al Impuesto sobre la Renta de no Residentes."
  - id: c
    text:
      es: "Debe ser un impuesto idéntico al IRPF, sin que cuente el análogo al Impuesto sobre la Renta de no Residentes."
  - id: d
    text:
      es: "Puede ser cualquier tributo local sobre los rendimientos obtenidos en el extranjero."
  explanation:
    es: "Cuenta lo satisfecho por un impuesto de naturaleza idéntica o análoga al IRPF o al Impuesto sobre la Renta de no Residentes (art. 80.1.a). Los impuestos indirectos y los tributos locales no son de esa naturaleza, y el precepto no excluye los análogos al de no residentes."
  citation: "art. 80.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
