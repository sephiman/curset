# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q129
  prompt:
    es: "Según el artículo 56.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los límites que determinan la competencia para autorizar créditos extraordinarios y suplementarios de un organismo autónomo se refieren:"
  options:
  - id: a
    text:
      es: "A cada modificación considerada de forma aislada, sin sumar otras del mismo ejercicio presupuestario ni del anterior."
  - id: b
    text:
      es: "Al conjunto de las modificaciones del ejercicio, computadas todas juntas sin distinguir la naturaleza del gasto afectado."
  - id: c
    text:
      es: "Al conjunto de las modificaciones de los dos últimos ejercicios, computadas por capítulos de gasto y no por naturaleza."
  - id: d
    correct: true
    text:
      es: "Al conjunto de las modificaciones del ejercicio, computadas por separado para personal, para el artículo 44.2 y para el resto."
  explanation:
    es: "El artículo 56.4 LGP dice que los límites «se referirán al conjunto de las efectuadas en el ejercicio presupuestario, computándose de forma independiente según afecte a gastos de personal o a los incluidos en el apartado 2 del artículo 44 o se trate del resto de los gastos». Considerar cada modificación aislada contradice «al conjunto de las efectuadas». Computarlo todo junto contradice «de forma independiente» según la naturaleza del gasto. Sumar los dos últimos ejercicios contradice «en el ejercicio presupuestario», y la suma por capítulos sustituye las tres clases de gasto que fija el apartado."
  citation: "art. 56.4 LGP"
  difficulty: 2
  tags:
  - "cómputo"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q130
  prompt:
    es: "Según el artículo 56.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, no se computan para los límites de competencia las modificaciones de un organismo autónomo que se financien con:"
  options:
  - id: a
    text:
      es: "Remanente de tesorería no aplicado al fin del ejercicio anterior."
  - id: b
    text:
      es: "Baja en créditos del Fondo de Contingencia."
  - id: c
    correct: true
    text:
      es: "Incremento en la aportación del Estado."
  - id: d
    text:
      es: "Operaciones de endeudamiento del propio organismo."
  explanation:
    es: "Solo quedan fuera del cómputo las modificaciones financiadas con más aportación del Estado. Las financiadas con remanente de tesorería sí computan. El Fondo de Contingencia y el endeudamiento propio no son fuentes de financiación de los créditos extraordinarios de un organismo autónomo."
  citation: "art. 56.4 LGP"
  difficulty: 2
  tags:
  - "excepción"
  - "cómputo"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q131
  prompt:
    es: "¿Qué fuente de financiación puede utilizar un organismo autónomo para una ampliación de crédito, pero no para un suplemento de crédito propio?"
  options:
  - id: a
    text:
      es: "El remanente de tesorería no aplicado al fin del ejercicio anterior."
  - id: b
    correct: true
    text:
      es: "La baja en otros créditos de su presupuesto no financiero."
  - id: c
    text:
      es: "Los mayores ingresos sobre los previstos inicialmente."
  - id: d
    text:
      es: "La baja en créditos del Fondo de Contingencia."
  explanation:
    es: "Las ampliaciones de un organismo autónomo pueden financiarse con remanente no aplicado, con mayores ingresos o con baja en otros créditos de su presupuesto no financiero (art. 54.3). Los suplementos solo admiten las dos primeras (art. 56.2). El Fondo de Contingencia no figura entre las fuentes del organismo en ninguna de las dos."
  citation: "art. 54.3 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2003-21614-art-56
- id: m05-l02-q133
  prompt:
    es: "Un organismo autónomo debe pagar una factura de 90.000 euros de un ejercicio anterior, para la que no se anuló crédito en ese ejercicio. Tramita un suplemento. ¿Cuál de los siguientes órganos lo autoriza, pese a su escasa cuantía?"
  options:
  - id: a
    text:
      es: "El Presidente o Director del organismo, dando cuenta al Ministro de Hacienda."
  - id: b
    correct: true
    text:
      es: "Las Cortes Generales, mediante ley, con independencia de su cuantía."
  - id: c
    text:
      es: "El Ministro de Hacienda, previo informe de la Dirección General de Presupuestos."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  explanation:
    es: "Cuando se atienden obligaciones de ejercicios anteriores sin crédito anulado, se remite un proyecto de ley a las Cortes Generales (art. 56.7), con independencia de la cuantía. Los umbrales del artículo 56.3 no se aplican a este caso."
  citation: "art. 56.7 LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2003-21614-art-61
- id: m05-l02-q134
  prompt:
    es: "Según el artículo 61.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué modificaciones del presupuesto de los organismos autónomos autoriza el Gobierno, a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados?"
  options:
  - id: a
    correct: true
    text:
      es: "Los créditos extraordinarios y suplementarios que superan los límites del Presidente y del Ministro de Hacienda."
  - id: b
    text:
      es: "Los créditos extraordinarios y suplementarios que no superan el diez por ciento del capítulo del presupuesto."
  - id: c
    text:
      es: "Las generaciones de crédito por ventas de bienes y prestación de servicios del propio organismo autónomo."
  - id: d
    text:
      es: "Las ampliaciones de crédito de los organismos autónomos previstas en el artículo 54.1 de la Ley."
  explanation:
    es: "El artículo 61.b) remite al artículo 56.3.c: los restantes casos, es decir, los que exceden de las competencias del Presidente o Director y del Ministro de Hacienda. Los de hasta el diez por ciento los autoriza el Presidente, las generaciones por ventas el propio organismo y las ampliaciones del artículo 54.1 el Ministro de Hacienda."
  citation: "art. 61.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q135
  prompt:
    es: "Según el artículo 54.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, tienen excepcionalmente la condición de ampliables los créditos para pensiones de Clases Pasivas del Estado y los destinados a atender obligaciones específicas del ejercicio:"
  options:
  - id: a
    text:
      es: "Derivadas de cualquier norma, que el Ministro de Hacienda declare ampliables durante el ejercicio."
  - id: b
    text:
      es: "Derivadas de normas con rango de ley, aunque no se relacionen en el estado de gastos."
  - id: c
    correct: true
    text:
      es: "Derivadas de normas con rango de ley, que de modo taxativo se relacionen en el estado de gastos."
  - id: d
    text:
      es: "Derivadas de contratos plurianuales, que de modo taxativo se relacionen en el estado de gastos."
  explanation:
    es: "Son ampliables las obligaciones específicas derivadas de normas con rango de ley relacionadas de modo taxativo y explícito en el estado de gastos. Las demás opciones suprimen una de las dos condiciones o cambian el origen de la obligación."
  citation: "art. 54.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q136
  prompt:
    es: "Según el artículo 54.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿hasta qué importe puede incrementarse la cuantía de un crédito ampliable?"
  options:
  - id: a
    text:
      es: "Hasta el importe del Fondo de Contingencia disponible en el ejercicio."
  - id: b
    text:
      es: "Hasta el límite que fije el Ministro de Hacienda en cada autorización."
  - id: c
    text:
      es: "Hasta el doble del crédito inicial consignado en el estado de gastos."
  - id: d
    correct: true
    text:
      es: "Hasta el importe que alcancen las respectivas obligaciones."
  explanation:
    es: "La ampliación incrementa el crédito hasta lo que alcancen las obligaciones del ejercicio a las que se destina. El Fondo, un límite fijado por el Ministro y el doble del crédito inicial son topes que el artículo no establece."
  citation: "art. 54.1 LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q137
  prompt:
    es: "¿Cuál de los siguientes créditos tiene la condición de ampliable por el propio artículo 54.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los destinados a inversiones reales de los ministerios y de sus organismos autónomos dependientes."
  - id: b
    correct: true
    text:
      es: "Los destinados a intereses y amortizaciones de la Deuda del Estado y de sus organismos autónomos."
  - id: c
    text:
      es: "Los destinados a subvenciones nominativas del Estado a entidades públicas y privadas sin ánimo de lucro."
  - id: d
    text:
      es: "Los destinados a gastos de funcionamiento de los organismos autónomos y de los departamentos ministeriales."
  explanation:
    es: "El artículo 54.1 declara ampliables los créditos de la Deuda del Estado y de sus organismos autónomos, tanto por intereses y amortizaciones como por los gastos de emisión, conversión, canje o amortización. Las inversiones, las subvenciones nominativas y los gastos de funcionamiento no son ampliables por ese artículo."
  citation: "art. 54.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-54
- id: m05-l02-q140
  prompt:
    es: "Según el artículo 54.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con cargo a qué se financian las ampliaciones de crédito que afectan a operaciones del presupuesto del Estado?"
  options:
  - id: a
    text:
      es: "Al remanente de tesorería no aplicado al fin del ejercicio anterior en el presupuesto del Estado."
  - id: b
    text:
      es: "A Deuda Pública o a la baja en otros créditos de la misma naturaleza financiera."
  - id: c
    text:
      es: "A los mayores ingresos sobre los previstos inicialmente en el presupuesto del Estado."
  - id: d
    correct: true
    text:
      es: "Al Fondo de Contingencia o a la baja en otros créditos del presupuesto no financiero."
  explanation:
    es: "En el Estado, la ampliación se financia con el Fondo de Contingencia (art. 50) o con baja en otros créditos no financieros. El remanente de tesorería y los mayores ingresos son fuentes de los organismos autónomos. La Deuda Pública financia los créditos extraordinarios de operaciones financieras."
  citation: "art. 54.3 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "concepto"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q143
  prompt:
    es: "Con los presupuestos de 2023 prorrogados, un ministerio necesita ampliar su capítulo 1 y lo financia con baja en otros créditos del mismo capítulo que no son incentivos ni gastos sociales. ¿Quién autoriza la ampliación?"
  options:
  - id: a
    correct: true
    text:
      es: "El titular del ministerio, sin necesidad de acudir al Ministro de Hacienda."
  - id: b
    text:
      es: "El Ministro de Hacienda, previo informe de la Dirección General de Presupuestos."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: d
    text:
      es: "El Director General de Presupuestos, por delegación del ministro."
  explanation:
    es: "El artículo 9.Siete de la Ley 31/2022 da al titular del ministerio la ampliación de capítulo 1 financiada con créditos del mismo capítulo. La competencia general sobre ampliaciones del Ministro de Hacienda (art. 62.1.d LGP) queda desplazada en este caso. El Consejo de Ministros y el Director General de Presupuestos no intervienen."
  citation: "art. 9.Siete Ley 31/2022"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2022-22128-art-11
- id: m05-l02-q145
  prompt:
    es: "Según el artículo 11.Uno de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿qué créditos tienen la condición de ampliables a efectos del artículo 54 de la Ley General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los que fija cada año el Consejo de Ministros mediante acuerdo."
  - id: b
    text:
      es: "Los que relaciona el anexo VII de la propia ley."
  - id: c
    text:
      es: "Los que determina el Ministro de Hacienda mediante orden."
  - id: d
    correct: true
    text:
      es: "Los que se relacionan en el anexo II de la propia ley."
  explanation:
    es: "El artículo 11.Uno remite al anexo II de la Ley 31/2022 para los créditos ampliables. El anexo VII lista los remanentes incorporables (art. 11.Dos). Ni el Consejo de Ministros ni el Ministro de Hacienda amplían esa relación por acuerdo u orden."
  citation: "art. 11.Uno Ley 31/2022"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q146
  prompt:
    es: "Según el artículo 53.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las generaciones son modificaciones que incrementan los créditos como consecuencia de la realización de determinados ingresos:"
  options:
  - id: a
    text:
      es: "Previstos en el presupuesto inicial y realizados antes del comienzo del ejercicio."
  - id: b
    text:
      es: "Inferiores a los contemplados en el presupuesto inicial, con baja de otros créditos."
  - id: c
    correct: true
    text:
      es: "No previstos o superiores a los contemplados en el presupuesto inicial."
  - id: d
    text:
      es: "Procedentes solo de aportaciones del Estado a organismos autónomos."
  explanation:
    es: "Una generación incrementa créditos por ingresos que el presupuesto inicial no preveía o que superan lo previsto. Las demás opciones cambian la relación entre el ingreso y la previsión, o limitan la figura a una sola de sus fuentes, cuando el artículo 53.2 enumera seis."
  citation: "art. 53.1 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q147
  prompt:
    es: "¿Cuál de los siguientes ingresos puede dar lugar a una generación de crédito conforme al artículo 53.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los reembolsos de préstamos."
  - id: b
    text:
      es: "Los saldos de tesorería anteriores."
  - id: c
    text:
      es: "Los tributos recaudados en exceso."
  - id: d
    text:
      es: "Las operaciones de endeudamiento autorizadas."
  explanation:
    es: "El artículo 53.2 enumera seis fuentes, entre ellas los reembolsos de préstamos. Los saldos de ejercicios anteriores se tratan como remanentes, los ingresos tributarios mayores y el endeudamiento no figuran en la lista."
  citation: "art. 53.2 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q148
  prompt:
    es: "Según el artículo 53.2.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, generan crédito las aportaciones entre el Estado, los organismos autónomos y otras personas para financiar conjuntamente gastos que:"
  options:
  - id: a
    text:
      es: "Por su cuantía superen los créditos iniciales del organismo que realiza la aportación."
  - id: b
    correct: true
    text:
      es: "Por su naturaleza estén comprendidos en los fines u objetivos asignados a ellos."
  - id: c
    text:
      es: "Por su naturaleza figuren en un convenio previamente aprobado por el Consejo de Ministros."
  - id: d
    text:
      es: "Por su plazo se ejecuten en el ejercicio siguiente al de la aportación."
  explanation:
    es: "La aportación genera crédito si financia gastos que, por su naturaleza, entran en los fines u objetivos de los organismos que los comparten. La cuantía, el convenio del Consejo de Ministros y el plazo de ejecución no son requisitos del artículo."
  citation: "art. 53.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q151
  prompt:
    es: "Según el artículo 63.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los titulares de los ministerios autorizan generaciones de crédito por aportaciones, reembolsos de préstamos y reintegros de pagos indebidos, previo informe favorable de:"
  options:
  - id: a
    text:
      es: "La Dirección General de Presupuestos."
  - id: b
    correct: true
    text:
      es: "La Intervención Delegada competente en el propio ministerio."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "La Abogacía del Estado en el departamento."
  explanation:
    es: "El informe favorable que condiciona estas generaciones es el de la Intervención Delegada competente en el ministerio. La Dirección General de Presupuestos, la Intervención General y la Abogacía del Estado no figuran en el artículo."
  citation: "art. 63.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q152
  prompt:
    es: "Según el artículo 63.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué generaciones de crédito pueden autorizar los titulares de los ministerios, previo informe favorable de la Intervención Delegada?"
  options:
  - id: a
    text:
      es: "Las de enajenaciones de inmovilizado, reembolsos de préstamos y reintegros de pagos indebidos."
  - id: b
    text:
      es: "Las de ventas de bienes, prestación de servicios y enajenaciones de inmovilizado."
  - id: c
    correct: true
    text:
      es: "Las de aportaciones, reembolsos de préstamos y reintegros de pagos indebidos."
  - id: d
    text:
      es: "Las de ingresos legalmente afectados, ventas de bienes y aportaciones."
  explanation:
    es: "Los ministros autorizan las generaciones de los supuestos a), d) y f) del artículo 53.2: aportaciones, reembolsos y reintegros. Las enajenaciones de inmovilizado las autoriza el Ministro de Hacienda, y también las ventas y los ingresos afectados del presupuesto del Estado."
  citation: "art. 63.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q154
  prompt:
    es: "Según el artículo 62.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué generaciones de crédito autoriza el Ministro de Hacienda en el presupuesto del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Las de enajenaciones de inmovilizado, ventas y prestación de servicios, e ingresos legalmente afectados."
  - id: b
    text:
      es: "Las de aportaciones, reembolsos de préstamos y reintegros de pagos indebidos del presupuesto del Estado."
  - id: c
    text:
      es: "Las de ventas y servicios y las de ingresos legalmente afectados, pero no las de enajenaciones de inmovilizado."
  - id: d
    text:
      es: "Todas las del artículo 53.2 cuando el presupuesto afectado sea el del Estado, sin excepción alguna."
  explanation:
    es: "El Ministro de Hacienda autoriza las del supuesto c) y, en el presupuesto del Estado, las de los supuestos b) y e). Las de aportaciones, reembolsos y reintegros son de los titulares de los ministerios. Excluir las enajenaciones o extender la competencia a todas las del artículo 53.2 altera la lista."
  citation: "art. 62.1.b) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q159
  prompt:
    es: "Según el artículo 53.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los organismos autónomos la generación por aportaciones puede realizarse, además de con el ingreso ya efectuado, cuando:"
  options:
  - id: a
    text:
      es: "Exista un compromiso firme de aportación, aunque el ingreso se prevea realizar durante el ejercicio siguiente."
  - id: b
    text:
      es: "Se haya solicitado la aportación al Estado, sin necesidad de reconocimiento del derecho ni de compromiso."
  - id: c
    text:
      es: "El ministro del que dependen haya aprobado la transferencia de la aportación al organismo."
  - id: d
    correct: true
    text:
      es: "Se reconozca el derecho o exista compromiso firme de aportación, con ingreso previsto en el propio ejercicio."
  explanation:
    es: "En organismos autónomos y Seguridad Social, la generación por aportaciones admite el reconocimiento del derecho o el compromiso firme de aportación, siempre que el ingreso se prevea realizar en el propio ejercicio. Las demás opciones eliminan esa condición o exigen menos o algo distinto."
  citation: "art. 53.3 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-53
- id: m05-l02-q160
  prompt:
    es: "Un organismo autónomo tiene un compromiso firme de aportación del Estado, pero el ingreso se prevé para enero del ejercicio siguiente. ¿Puede generar ahora crédito con esa aportación?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque esa generación exige que el ingreso se prevea realizar en el propio ejercicio."
  - id: b
    text:
      es: "Sí, porque para los organismos autónomos basta el compromiso firme de aportación del Estado."
  - id: c
    text:
      es: "Sí, pero solo si la Intervención Delegada informa favorablemente la generación."
  - id: d
    text:
      es: "No, porque toda generación exige siempre el ingreso efectivo, sin ninguna excepción posible."
  explanation:
    es: "El compromiso firme permite generar antes del ingreso, pero solo si el ingreso se prevé realizar en el propio ejercicio (art. 53.3). Con ingreso previsto para el ejercicio siguiente no se cumple esa condición. La opción del ingreso efectivo sin excepciones ignora la excepción de los organismos autónomos."
  citation: "art. 53.3 LGP"
  difficulty: 3
  tags:
  - "requisito"
