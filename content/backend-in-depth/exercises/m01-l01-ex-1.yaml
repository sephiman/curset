- id: m01-l01-q04
  prompt:
    en: In Java 25, a record `Order` has a component of type `List<String>`. How does the `Record` Javadoc describe
      the immutability of a record class like this one?
  options:
  - id: a
    text:
      en: A deeply immutable carrier, because the canonical constructor copies every mutable component
  - id: b
    text:
      en: An immutable carrier only when every component has a primitive type, and a mutable bean otherwise
  - id: c
    correct: true
    text:
      en: A shallowly immutable, transparent carrier for a fixed set of values
  - id: d
    text:
      en: A mutable carrier whose component fields are updated through generated setter methods
  explanation:
    en: The Javadoc calls a record class a shallowly immutable, transparent carrier for a fixed set of values. The
      claim of deep immutability is wrong because copying mutable components is something the programmer provides
      with an explicit canonical constructor, not a guarantee. The claim that a record is immutable only with primitive
      components is wrong because the shallow immutability does not depend on component types. The claim of generated
      setters is wrong because each component has a `private` `final` field and only an accessor method.
  citation: javadoc-record#class-record; jls-8-records#jls-8.10.3
- id: m01-l01-q07
  prompt:
    en: In Java 25, a record declares no `equals` method of its own. How does the `Record` Javadoc say the implicit
      `equals`, `hashCode` and `toString` are derived?
  options:
  - id: a
    text:
      en: From the first component only, which acts as the identity of the record
  - id: b
    text:
      en: From the object identity of the instance, as `Object.equals` does
  - id: c
    correct: true
    text:
      en: From all of the component fields of the record
  - id: d
    text:
      en: From the return values of the accessor methods, so an explicit accessor changes the result
  explanation:
    en: The implicit declarations are derived from all of the component fields. The first-component claim is wrong
      because every component takes part. The object-identity claim is wrong because a copy built from the same
      components must be equal to the original under the required invariant. The accessor claim is wrong because
      equality, hash code values and string representations are determined by looking at the component fields directly,
      rather than by invoking accessor methods.
  citation: javadoc-record#class-record; jls-8-records#jls-8.10.3
- id: m01-l01-q08
  prompt:
    en: In Java 25, which reasons does the `Record` Javadoc give as the primary ones to provide an explicit declaration
      of the canonical constructor or the accessor methods?
  options:
  - id: a
    text:
      en: To add instance variables beyond the components and initialise them in the constructor
  - id: b
    correct: true
    text:
      en: To validate constructor arguments, perform defensive copies on mutable components, or normalize groups
        of components
  - id: c
    text:
      en: To make the record class non-final so that frameworks can create proxies of it
  - id: d
    text:
      en: To supply `equals` and `hashCode`, which a record does not have unless they are written
  explanation:
    en: The Javadoc names validation, defensive copies on mutable components and normalization of groups of components.
      Extra instance variables are not a reason because a record may not explicitly declare instance variables.
      Making the class non-final is not a reason because a record class is implicitly final. Supplying `equals`
      and `hashCode` is not a reason because implicit implementations are derived from all of the component fields.
  citation: javadoc-record#class-record; jls-8-records#jls-8.10.3; jls-8-records#jls-8.10
- id: m01-l01-q09
  prompt:
    en: In Java 25, `SmallPoint(int x, int y)` declares accessors that clip values above 100. For `p1 = new SmallPoint(200,
      300)` and `p3 = new SmallPoint(p1.x(), p1.y())`, what does `p1.equals(p3)` evaluate to?
  options:
  - id: a
    text:
      en: '`true`, because the implicit `equals` calls the accessors and both sides clip to the same values'
  - id: b
    text:
      en: '`true`, because every copy built from a record''s own accessors equals the original'
  - id: c
    text:
      en: A compile-time error, because accessors that change the returned value are not allowed in a record
  - id: d
    correct: true
    text:
      en: '`false`, because the implicit `equals` compares the component fields directly while `p3` was built from
        the clipped values'
  explanation:
    en: The result is `false`, because equality is determined from the component fields directly and the clipped
      values make `p3` differ from `p1`. The claim that `equals` calls the accessors is wrong because it looks at
      the fields rather than invoking accessor methods. The claim that every copy built from accessors is equal
      is wrong because it holds only when the accessors respect the invariant, and these clipping accessors do not.
      The compile-time error claim is wrong because the specification calls such accessors bad style and says a
      compiler cannot generally check them.
  citation: jls-8-records#jls-8.10.3
  extract:
    en: Note that equality, hash code values, and string representations are determined by looking at the values
      of component fields directly, rather than by invoking accessor methods.
- id: m01-l01-q12
  prompt:
    en: In Java 25, can a record class implement a `sealed` interface, and what reason does the Java Language Specification
      give?
  options:
  - id: a
    text:
      en: Yes, because a record class is implicitly `non-sealed`
  - id: b
    correct: true
    text:
      en: Yes, because a record class is implicitly final
  - id: c
    text:
      en: No, because a record class cannot declare an `implements` clause
  - id: d
    text:
      en: No, because every direct subclass of a sealed interface must be declared `sealed`
  explanation:
    en: A record class can implement a sealed interface because it is implicitly final. The implicitly `non-sealed`
      claim is wrong because the record is final and not `non-sealed`. The claim that a record cannot implement
      an interface is wrong because the specification shows a record with an `implements` clause that inherits a
      default method. The claim that every subclass must be `sealed` is wrong because a direct subclass may be `final`,
      `sealed` or `non-sealed`.
  citation: jls-8-records#jls-8.1.1.2; jls-8-records#jls-8.10.3
  extract:
    en: Similarly, a record class is implicitly final, so it can also implement a sealed interface.
- id: m01-l01-q28
  prompt:
    en: In Java 25, this snippet copies a list into one record and not into the other, adds `milk` to the original
      list, and then validates a blank `id`. What does the program print?
  options:
  - id: a
    correct: true
    text:
      en: '```text

        Order[id=A1, lines=[tea, milk]]

        SafeOrder[id=A1, lines=[tea]]

        true

        id is blank

        ```'
  - id: b
    text:
      en: '```text

        Order[id=A1, lines=[tea]]

        SafeOrder[id=A1, lines=[tea, milk]]

        true

        id is blank

        ```'
  - id: c
    text:
      en: '```text

        Order[id=A1, lines=[tea, milk]]

        SafeOrder[id=A1, lines=[tea, milk]]

        true

        id is blank

        ```'
  - id: d
    text:
      en: '```text

        Order[id=A1, lines=[tea, milk]]

        SafeOrder[id=A1, lines=[tea]]

        false

        id is blank

        ```'
  explanation:
    en: The first record holds the caller's list, so it shows `milk` after the later `add`. The second record stored
      a copy made by `List.copyOf`, so it keeps only `tea`. The output with the copy on the first record is wrong
      because only the second record copies the list. The output where both show `milk` is wrong because `List.copyOf`
      made an independent list. The `false` output is wrong because the first record equals a record rebuilt from
      its own accessors.
  citation: javadoc-record#class-record
  snippet: m01-l01/ShallowRecord.java
