    es: "Conforme al artículo 59.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Direcciones Generales se crean, modifican y suprimen por Real Decreto del Consejo de Ministros, a iniciativa del:"
