# Tax-part summaries, batch 5 (III.15–III.20 and module m03), staged for the blind check.
m03: El módulo trata el sistema fiscal español y sus principios constitucionales, la Hacienda Pública estatal, autonómica
  y local y la Agencia Estatal de Administración Tributaria. De la Ley General Tributaria y sus reglamentos recoge, entre
  otras materias, los tributos, los obligados tributarios, la gestión, la inspección, la recaudación, las sanciones y la revisión.
  Siguen el IRPF, el Impuesto sobre Sociedades, el IVA y la Aduana.
m03-l15: 'El IRPF grava la renta de las personas físicas: los rendimientos del trabajo, del capital y de las actividades económicas,
  las ganancias y pérdidas patrimoniales y las imputaciones de renta. La LIRPF regula, entre otras materias, quién es contribuyente,
  las rentas exentas, el período impositivo y el devengo, y cómo se calcula cada clase de renta. El artículo 85 de la LIRPF
  imputa renta por los inmuebles urbanos, y por los rústicos con construcciones no indispensables para explotaciones agrícolas,
  ganaderas o forestales, no afectos a actividades económicas ni generadores de rendimientos del capital, excluida la vivienda
  habitual y el suelo no edificado; desde el 01-01-2027 rige una redacción nueva de su apartado 1 (Real Decreto-ley 29/2026,
  convalidación pendiente).'
m03-l16: La renta del IRPF se clasifica en general y del ahorro, y sus componentes se integran y compensan para formar la
  base imponible general y la del ahorro, de las que se obtienen las bases liquidables. La parte de la base liquidable que
  corresponde al mínimo personal y familiar no se somete a tributación. La LIRPF regula también el cálculo del impuesto estatal,
  la cuota diferencial, la tributación conjunta de la unidad familiar y la gestión del impuesto.
m03-l17: El Impuesto sobre Sociedades es un tributo de carácter directo y naturaleza personal que grava la renta de las sociedades
  y demás entidades jurídicas. En el método de estimación directa, su base imponible se calcula corrigiendo el resultado contable
  mediante los preceptos de la LIS, con reglas de imputación temporal y reducciones. El tipo general es del 25 por ciento,
  con los tipos especiales del artículo 29 de la LIS, y sobre la cuota íntegra se aplican las bonificaciones y deducciones
  que procedan, entre ellas las deducciones para evitar la doble imposición internacional.
m03-l18: El IVA es un tributo de naturaleza indirecta que recae sobre el consumo y grava las entregas de bienes y prestaciones
  de servicios de empresarios o profesionales, las adquisiciones intracomunitarias de bienes y las importaciones. La LIVA
  define el hecho imponible, las operaciones no sujetas y las asimiladas, como el autoconsumo. Regula también las exenciones,
  entre ellas las del artículo 20, y el lugar de realización de las entregas y de los servicios.
m03-l19: La LIVA regula los sujetos pasivos del impuesto, la repercusión, el devengo y la base imponible. Regula también los
  requisitos y las limitaciones del derecho a deducir, las deducciones en sectores diferenciados de la actividad empresarial
  o profesional, la regla de prorrata, la regularización de las deducciones por bienes de inversión y las devoluciones.
m03-l20: El Código Aduanero de la Unión permite a toda persona nombrar un representante aduanero, con una representación que
  puede ser directa o indirecta. La deuda aduanera de importación nace, entre otros casos, al incluir mercancías no pertenecientes
  a la Unión sujetas a derechos de importación en el despacho a libre práctica, y la de exportación al incluir mercancías
  sujetas a derechos de exportación en el régimen de exportación o de perfeccionamiento pasivo. Las mercancías que vayan a
  incluirse en un régimen aduanero, salvo el de zona franca, son objeto de una declaración en aduana.
