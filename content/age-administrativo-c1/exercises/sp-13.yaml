type: case
title:
  es: "Las encuestas del CIS"
scenario:
  es: "El Centro de Investigaciones Sociológicas (CIS) es un organismo autónomo con sede en Madrid. En los plazos por días hábiles de este caso, los únicos días inhábiles son los sábados, los domingos y el martes, 12 de octubre de 2027; los plazos por meses se cuentan de fecha a fecha.\n\nEl lunes, 1 de marzo de 2027, Doña Rebeca Tolosa Medrano, persona física no obligada a relacionarse electrónicamente, comunica al CIS que quiere hacerlo por esa vía, y el CIS tiene constancia ese día. Ese mismo día presenta en el registro electrónico una solicitud con plazo máximo de tres meses. El martes, 8 de junio de 2027, el CIS le requiere documentación en otro expediente y le concede diez días hábiles para aportarla, y ella la presenta por el registro electrónico el sábado, 12 de junio de 2027, a las 22:00.\n\nEl lunes, 14 de junio de 2027, el CIS suscribe con una universidad pública un convenio en el que asume compromisos económicos por 720.000 euros.\n\nEl CIS licita por procedimiento abierto, sin regulación armonizada, el contrato de servicios del trabajo de campo de un barómetro, con valor estimado de 130.000 euros, IVA excluido. Se admiten ofertas electrónicas. El anuncio se publica en el perfil de contratante el jueves, 26 de agosto de 2027. La mejor oferta es de 110.000 euros, IVA excluido. El CIS notifica la adjudicación el viernes, 1 de octubre de 2027, y la publica ese día en el perfil de contratante. El CIS ordena por escrito a la empresa entrevistar en una urbanización cerrada, y un entrevistador daña su verja al cumplir esa orden. El CIS contrata, como contrato menor, la traducción de los cuestionarios por 12.000 euros. La Intervención Delegada en el CIS formula reparo por insuficiencia de crédito en el expediente de otro estudio, y el CIS no lo acepta.\n\nEl CIS quiere cubrir con ingreso libre un puesto vacante de personal laboral del IV Convenio único, y propone como vocal del órgano de selección a Don Gabriel Soler Mendiola, personal laboral temporal del mismo grupo profesional que el puesto. Doña Irene Sandoval Rueda, funcionaria de carrera del Cuerpo de Gestión de la Administración Civil del Estado y mutualista de la MUFACE, está de licencia por enfermedad desde el lunes, 1 de febrero de 2027. Don Mateo Lorente Cabrera, funcionario de carrera del CIS con ocho años de servicios efectivos, pide la excedencia voluntaria por interés particular, y se le instruye un expediente disciplinario. El CIS convoca por libre designación un puesto que su relación de puestos de trabajo reserva a ese sistema; el plazo de solicitudes termina el miércoles, 30 de junio de 2027. Doña Berta Quintanilla Ortega, funcionaria de carrera destinada en el CIS, obtiene por concurso un destino en otro Departamento, y la resolución se publica en el «Boletín Oficial del Estado» el viernes, 9 de julio de 2027.\n\nEl capítulo 2 del presupuesto inicial de gastos del CIS es de 6.200.000 euros. Para pagar un estudio que no puede demorarse necesita un crédito extraordinario, sin otras modificaciones en el ejercicio. En 2027 ha cobrado 38.000 euros por la venta de publicaciones y servicios, y tiene otros 12.000 euros reconocidos como derechos que aún no ha cobrado.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2021-5032-art-3
- id: q01
  lesson: m02-l03
  prompt:
    es: "Según el artículo 3.2 del Real Decreto 203/2021, de 30 de marzo, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, ¿desde qué fecha produce efectos la comunicación de Doña Rebeca Tolosa Medrano de que quiere relacionarse electrónicamente con el CIS?"
  options:
  - id: a
    text:
      es: "El viernes, 5 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 8 de marzo de 2027."
  - id: c
    text:
      es: "El jueves, 11 de marzo de 2027."
  - id: d
    text:
      es: "El martes, 2 de marzo de 2027."
  explanation:
    es: "Los efectos de la comunicación de la persona física no obligada empiezan el quinto día hábil siguiente a aquel en que el órgano tuvo constancia de ella (art. 3.2 RD 203/2021). El CIS la recibe el lunes, 1 de marzo de 2027, y los cinco días hábiles siguientes son el martes 2, el miércoles 3, el jueves 4, el viernes 5 y el lunes 8 de marzo. La fecha del viernes, 5 de marzo de 2027, cuenta el día de la constancia como primero. La del jueves, 11 de marzo de 2027, aplica los diez días naturales de la notificación electrónica rechazada. La del martes, 2 de marzo de 2027, da efecto al día siguiente."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-24
- id: q02
  lesson: m03-l03
  prompt:
    es: "Según el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe el CIS expedir de oficio el certificado acreditativo del silencio de la solicitud de Doña Rebeca Tolosa Medrano, si no la resuelve de forma expresa?"
  options:
  - id: a
    text:
      es: "El lunes, 21 de junio de 2027."
  - id: b
    text:
      es: "El miércoles, 16 de junio de 2027."
  - id: c
    text:
      es: "El jueves, 1 de julio de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 22 de junio de 2027."
  explanation:
    es: "El certificado del silencio se expide de oficio en quince días desde que expire el plazo máximo para resolver (art. 24.4 LPAC). El plazo de tres meses de una solicitud presentada el lunes, 1 de marzo de 2027, termina el martes, 1 de junio de 2027 (art. 30.4 LPAC). Los quince días son hábiles porque ninguna ley dispone otro cómputo (art. 30.2 LPAC): del miércoles, 2 de junio, al martes, 22 de junio de 2027, sin festivos. La fecha del lunes, 21 de junio de 2027, cuenta el 1 de junio como primer día. La del miércoles, 16 de junio de 2027, usa quince días naturales. La del jueves, 1 de julio de 2027, toma un mes en lugar de quince días hábiles."
  citation: "art. 24.4 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-31
- id: q03
  lesson: m03-l03
  prompt:
    es: "Señale la respuesta correcta. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la documentación que Doña Rebeca Tolosa Medrano presenta por el registro electrónico del CIS dentro del plazo de diez días hábiles se entiende presentada:"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 14 de junio de 2027."
  - id: b
    text:
      es: "El sábado, 12 de junio de 2027."
  - id: c
    text:
      es: "El viernes, 11 de junio de 2027."
  - id: d
    text:
      es: "El martes, 22 de junio de 2027."
  explanation:
    es: "A efectos del cómputo de plazos en días hábiles, la presentación en un día inhábil se entiende hecha a primera hora del primer día hábil siguiente (art. 31.2 LPAC). El sábado, 12 de junio de 2027, es inhábil, y el primer día hábil siguiente es el lunes, 14 de junio. La opción del sábado toma la fecha real de la presentación. La del viernes, 11 de junio de 2027, retrocede al último día hábil anterior. La del martes, 22 de junio de 2027, es el último día de los diez días hábiles que empezaron el miércoles, 9 de junio, y no la fecha en que se entiende presentada."
  citation: "art. 31.2 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10566-art-51
- id: q21
  lesson: m03-l03
  prompt:
    es: "Si la universidad pública incumple los compromisos del convenio que firma con el CIS, ¿qué puede hacer el CIS, según el artículo 51.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, para que quede resuelto?"
  options:
  - id: a
    correct: true
    text:
      es: "Requerirle que cumpla en un plazo y, si el incumplimiento persiste, notificar a los firmantes la causa de resolución."
  - id: b
    text:
      es: "Pedir a un juez que declare la resolución, porque ninguna parte puede resolver el convenio por sí misma."
  - id: c
    text:
      es: "Resolverlo sin requerimiento previo, porque el incumplimiento de una parte extingue el convenio por sí solo."
  - id: d
    text:
      es: "Requerirle que cumpla en un plazo y, si persiste, resolver solo con el acuerdo unánime de todos los firmantes."
  explanation:
    es: "Ante el incumplimiento de una firmante, la otra parte notifica a la incumplidora un requerimiento para que cumpla en un determinado plazo, lo comunica al responsable del seguimiento y a los demás firmantes y, si el incumplimiento persiste, notifica a los firmantes la causa de resolución y el convenio se entiende resuelto (art. 51.2.c) LRJSP). La opción de acudir a un juez exige una decisión judicial que el artículo reserva a la declaración de nulidad. La de resolver sin requerimiento omite el trámite previo que la ley impone. La del acuerdo unánime confunde esta causa con la de la unanimidad de los firmantes, que es otra causa distinta y no se exige aquí."
  citation: "art. 51.2 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10566-art-53
- id: q05
  lesson: m03-l03
  prompt:
    es: "Según el artículo 53.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿hasta qué fecha debe remitirse electrónicamente al Tribunal de Cuentas el convenio que el CIS suscribe con la universidad pública?"
  options:
  - id: a
    text:
      es: "El lunes, 13 de septiembre de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 14 de septiembre de 2027."
  - id: c
    text:
      es: "El domingo, 12 de septiembre de 2027."
  - id: d
    text:
      es: "El miércoles, 14 de julio de 2027."
  explanation:
    es: "Si los compromisos económicos asumidos superan los 600.000 euros, el convenio se remite electrónicamente al Tribunal de Cuentas dentro de los tres meses siguientes a la suscripción (art. 53.1 LRJSP). Los 720.000 euros del CIS superan esa cifra. Tres meses de fecha a fecha desde el lunes, 14 de junio de 2027, terminan el martes, 14 de septiembre de 2027, día hábil. La fecha del lunes, 13 de septiembre de 2027, cuenta el día de la firma como primero. La del domingo, 12 de septiembre de 2027, usa noventa días naturales. La del miércoles, 14 de julio de 2027, toma un mes."
  citation: "art. 53.1 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-156
- id: q06
  lesson: m03-l04
  prompt:
    es: "¿Qué día termina como mínimo el plazo de presentación de proposiciones del contrato de servicios del trabajo de campo, si el CIS publica el anuncio de licitación en el perfil de contratante el jueves, 26 de agosto de 2027?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes, 10 de septiembre de 2027."
  - id: b
    text:
      es: "El jueves, 9 de septiembre de 2027."
  - id: c
    text:
      es: "El domingo, 5 de septiembre de 2027."
  - id: d
    text:
      es: "El jueves, 30 de septiembre de 2027."
  explanation:
    es: "En el abierto sin regulación armonizada, el plazo de proposiciones no es inferior a quince días contados desde el día siguiente al de la publicación del anuncio en el perfil de contratante (art. 156.6 LCSP). Son días naturales, porque la ley no dice hábiles (disposición adicional duodécima LCSP): del viernes, 27 de agosto, al viernes, 10 de septiembre de 2027, día hábil. La fecha del jueves, 9 de septiembre de 2027, cuenta el día de la publicación como primero. La del domingo, 5 de septiembre de 2027, resta cinco días por las ofertas electrónicas, reducción que el artículo 156.3.c) da solo al plazo general de los contratos con regulación armonizada. La del jueves, 30 de septiembre de 2027, aplica los treinta y cinco días de esos contratos."
  citation: "art. 156.6 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-107
- id: q07
  lesson: m03-l04
  prompt:
    es: "¿Qué garantía definitiva debe constituir el licitador que presenta la mejor oferta del contrato del trabajo de campo, si el pliego no lo exime de ella?"
  options:
  - id: a
    text:
      es: "6.500 euros, el 5 por 100 del valor estimado del contrato."
  - id: b
    text:
      es: "6.655 euros, el 5 por 100 del precio ofertado, IVA incluido."
  - id: c
    text:
      es: "3.300 euros, el 3 por 100 del precio ofertado, IVA excluido."
  - id: d
    correct: true
    text:
      es: "5.500 euros, el 5 por 100 del precio ofertado, IVA excluido."
  explanation:
    es: "Quien presenta la mejor oferta constituye una garantía definitiva del 5 por 100 del precio final ofertado, excluido el IVA (art. 107.1 LCSP): el 5 por 100 de 110.000 euros son 5.500 euros. La opción de 6.500 euros calcula el porcentaje sobre el valor estimado, que no es el precio ofertado. La de 6.655 euros lo calcula sobre la oferta con el IVA del 21 % incluido. La de 3.300 euros aplica el 3 por 100, tope de la garantía provisional."
  citation: "art. 107.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-153
- id: q08
  lesson: m03-l04
  prompt:
    es: "¿Desde qué fecha puede el CIS formalizar el contrato del trabajo de campo, si ningún licitador interpone recurso contra la adjudicación?"
  options:
  - id: a
    text:
      es: "El lunes, 25 de octubre de 2027."
  - id: b
    text:
      es: "El martes, 19 de octubre de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 26 de octubre de 2027."
  - id: d
    text:
      es: "El jueves, 7 de octubre de 2027."
  explanation:
    es: "Un contrato de servicios de valor estimado superior a 100.000 euros admite recurso especial (art. 44.1 LCSP), y entonces no se formaliza antes de que pasen quince días hábiles desde la remisión de la notificación de la adjudicación (art. 153.3 LCSP). El CIS la publica el mismo día en el perfil de contratante, así que el cómputo parte del viernes, 1 de octubre de 2027 (disposición adicional decimoquinta LCSP). Con el martes, 12 de octubre, festivo, el decimoquinto día hábil es el lunes, 25 de octubre, y el primer día en que puede formalizarse es el martes, 26 de octubre de 2027. La fecha del lunes, 25 de octubre de 2027, es la de quien olvida el festivo y, con él descontado, todavía es día de espera. La del martes, 19 de octubre de 2027, cuenta diez días hábiles. La del jueves, 7 de octubre de 2027, cuenta cinco días naturales, el plazo del requerimiento posterior."
  citation: "art. 153.3 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-196
- id: q09
  lesson: m03-l06
  prompt:
    es: "¿Quién responde frente a la comunidad de vecinos del daño que el entrevistador causa en la verja al cumplir la orden escrita del CIS de entrevistar en la urbanización?"
  options:
  - id: a
    text:
      es: "La empresa adjudicataria, que debe indemnizar todos los daños que cause a terceros al ejecutar el contrato."
  - id: b
    correct: true
    text:
      es: "El CIS, dentro de los límites señalados en las leyes, porque el daño nace de una orden suya."
  - id: c
    text:
      es: "El CIS, pero solo si el daño procede de vicios del proyecto que él mismo elaboró."
  - id: d
    text:
      es: "Ninguno de los dos, hasta que la comunidad requiera al órgano de contratación para que informe sobre la responsabilidad."
  explanation:
    es: "Cuando los daños a terceros son consecuencia inmediata y directa de una orden de la Administración, esta responde dentro de los límites señalados en las leyes (art. 196.2 LCSP), y el CIS ordenó por escrito entrevistar en la urbanización. La opción de la empresa aplica la regla general del artículo 196.1, que cede ante la orden. La del CIS solo por vicios del proyecto toma el otro supuesto del artículo 196.2, propio del contrato de obras. La del requerimiento previo convierte en condición una facultad: los terceros pueden requerir al órgano de contratación en el año siguiente al hecho (art. 196.3 LCSP)."
  citation: "art. 196.2 LCSP"
  difficulty: 2
  tags:
  - "competencia"
  - "efecto"
# anchor: boe-a-2019-7414-art-27
- id: q10
  lesson: m04-l08
  prompt:
    es: "¿Qué debe haber hecho el CIS antes de incluir el puesto vacante de personal laboral en la convocatoria de ingreso libre, según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Haber pedido a los servicios públicos de empleo la preselección de cinco candidatos por puesto."
  - id: b
    text:
      es: "Haber obtenido el informe favorable de la Comisión Paritaria sobre su inclusión en la convocatoria."
  - id: c
    text:
      es: "Haberlo ofertado antes a los funcionarios de carrera del CIS mediante un concurso de méritos."
  - id: d
    correct: true
    text:
      es: "Haberlo ofertado antes en una convocatoria del concurso abierto y permanente o por promoción interna."
  explanation:
    es: "Antes de incluir un puesto en una convocatoria de ingreso libre debe haberse ofertado en una convocatoria del concurso abierto y permanente o a través de la promoción interna (art. 27.2 IV Convenio único). La opción de los servicios públicos de empleo describe la preselección del personal temporal (art. 33.2). La del informe de la Comisión Paritaria no es un requisito del artículo 27.2. La de los funcionarios de carrera confunde el procedimiento del personal laboral con el de los funcionarios."
  citation: "art. 27.2 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2019-7414-art-31
- id: q11
  lesson: m04-l08
  prompt:
    es: "Señale la respuesta correcta sobre la propuesta del CIS de nombrar vocal del órgano de selección a Don Gabriel Soler Mendiola, personal laboral temporal del mismo grupo profesional que el puesto convocado:"
  options:
  - id: a
    correct: true
    text:
      es: "No puede ser vocal, porque el personal laboral temporal no puede formar parte de los órganos de selección."
  - id: b
    text:
      es: "Puede ser vocal, porque pertenece a un grupo profesional igual al del puesto convocado."
  - id: c
    text:
      es: "Puede ser vocal, si lo proponen los sindicatos presentes en la Comisión Paritaria y actúa a título individual."
  - id: d
    text:
      es: "No puede ser vocal, porque solo los funcionarios de carrera del grupo equivalente forman parte de esos órganos."
  explanation:
    es: "Los miembros del órgano de selección pertenecen a un grupo profesional igual o superior al del puesto, pero no puede formar parte de ellos el personal laboral temporal (art. 31.3 IV Convenio único). Don Gabriel es temporal, así que no puede ser vocal aunque su grupo sea el del puesto. La opción del grupo igual enuncia solo una de las dos condiciones. La de la propuesta sindical atribuye a los sindicatos un nombramiento que la regla no permite a un temporal. La de los funcionarios de carrera restringe la composición a un colectivo que el convenio no limita así."
  citation: "art. 31.3 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
  - "composición"
# anchor: boe-a-2000-12140-art-21
- id: q12
  lesson: m04-l07
  prompt:
    es: "¿Qué percibe Doña Irene Sandoval Rueda el lunes, 17 de mayo de 2027, si sigue de licencia por enfermedad desde el lunes, 1 de febrero de 2027?"
  options:
  - id: a
    text:
      es: "La totalidad de sus retribuciones, a cargo de los órganos de personal, igual que durante los tres primeros meses."
  - id: b
    text:
      es: "Solo un subsidio por incapacidad temporal a cargo de la MUFACE, sin retribuciones básicas."
  - id: c
    correct: true
    text:
      es: "Las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio a cargo de la MUFACE."
  - id: d
    text:
      es: "Las retribuciones básicas y las complementarias, a cargo de la MUFACE durante toda la licencia."
  explanation:
    es: "Durante los tres primeros meses el mutualista percibe la totalidad de sus retribuciones, y desde el cuarto mes percibe las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio a cargo de la MUFACE (art. 21.1.b) RDL 4/2000). La licencia de Doña Irene empieza el lunes, 1 de febrero de 2027; febrero, marzo y abril son los tres primeros meses, y el lunes, 17 de mayo, está en el cuarto. La opción de la totalidad de las retribuciones describe lo que cobra hasta el 30 de abril. La del subsidio sin retribuciones básicas omite parte de la prestación. La de la MUFACE durante toda la licencia le atribuye también los tres primeros meses y las retribuciones complementarias."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1995-8729-art-56
- id: q13
  lesson: m04-l05
  prompt:
    es: "¿Hasta qué fecha, como máximo y con la prórroga, debe efectuarse el nombramiento del puesto que el CIS provee por libre designación?"
  options:
  - id: a
    text:
      es: "El viernes, 30 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 30 de agosto de 2027."
  - id: c
    text:
      es: "El martes, 31 de agosto de 2027."
  - id: d
    text:
      es: "El jueves, 30 de septiembre de 2027."
  explanation:
    es: "Los nombramientos de libre designación se efectúan en el plazo máximo de un mes desde la finalización del de presentación de solicitudes, y ese plazo puede prorrogarse hasta un mes más (art. 56.1 RD 364/1995). Contado de fecha a fecha (art. 30.4 LPAC), un mes desde el miércoles, 30 de junio de 2027, termina el viernes, 30 de julio, y el mes de prórroga, el lunes, 30 de agosto de 2027, día hábil. La fecha del viernes, 30 de julio de 2027, es la del plazo sin prórroga. La del martes, 31 de agosto de 2027, toma el último día del mes en lugar del mismo día. La del jueves, 30 de septiembre de 2027, suma dos meses de prórroga."
  citation: "art. 56.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-48
- id: q14
  lesson: m04-l05
  prompt:
    es: "¿Cuál es la fecha límite para que cese Doña Berta Quintanilla Ortega en su puesto actual, si el Departamento no difiere el cese?"
  options:
  - id: a
    text:
      es: "El lunes, 12 de julio de 2027."
  - id: b
    text:
      es: "El viernes, 6 de agosto de 2027."
  - id: c
    text:
      es: "El lunes, 9 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 14 de julio de 2027."
  explanation:
    es: "El cese debe efectuarse dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el «Boletín Oficial del Estado» (art. 48.1 RD 364/1995). Publicada el viernes, 9 de julio de 2027, los tres días hábiles son el lunes 12, el martes 13 y el miércoles 14 de julio. La fecha del lunes, 12 de julio de 2027, cuenta tres días naturales. La del viernes, 6 de agosto de 2027, suma los veinte días hábiles que el Subsecretario puede diferir el cese. La del lunes, 9 de agosto de 2027, toma el mes del plazo posesorio."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-89
- id: q15
  lesson: m04-l04
  prompt:
    es: "Según el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿puede declararse la excedencia voluntaria por interés particular que pide Don Mateo Lorente Cabrera?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque no puede declararse cuando al funcionario se le instruye un expediente disciplinario."
  - id: b
    text:
      es: "Sí, porque acredita más de cinco años de servicios efectivos y la excedencia es un derecho del funcionario."
  - id: c
    text:
      es: "Sí, pero conservará la reserva de su puesto de trabajo durante los dos primeros años."
  - id: d
    text:
      es: "No, porque esta excedencia exige haber prestado diez años de servicios efectivos en las Administraciones Públicas."
  explanation:
    es: "Los funcionarios con cinco años de servicios efectivos pueden obtener la excedencia voluntaria por interés particular, pero no puede declararse cuando se les instruye un expediente disciplinario (art. 89.2 TREBEP). Don Mateo tiene ocho años de servicios, y el expediente en curso impide declararla. La opción del derecho del funcionario ignora que la concesión queda subordinada a las necesidades del servicio y al expediente. La de la reserva del puesto atribuye a esta excedencia un efecto que no tiene: no devenga retribuciones ni reserva. La de los diez años eleva el mínimo de cinco años."
  citation: "art. 89.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-56
- id: q16
  lesson: m05-l02
  prompt:
    es: "¿Hasta qué importe puede autorizar el Presidente del CIS el crédito extraordinario del capítulo 2 que necesita para pagar el estudio, si no ha autorizado otras modificaciones en el ejercicio?"
  options:
  - id: a
    text:
      es: "620.000 euros, el 10 % del capítulo 2 de su presupuesto inicial de gastos."
  - id: b
    text:
      es: "1.000.000 de euros, el límite de los créditos que autoriza el Ministro de Hacienda."
  - id: c
    correct: true
    text:
      es: "500.000 euros, porque el 10 % del capítulo supera ese límite."
  - id: d
    text:
      es: "1.240.000 euros, el 20 % del capítulo 2 de su presupuesto inicial de gastos."
  explanation:
    es: "En un organismo autónomo, su Presidente autoriza créditos extraordinarios hasta el 10 % del capítulo de su presupuesto inicial de gastos, cuando no supere los 500.000 euros (art. 56.3.a) LGP). El 10 % de 6.200.000 euros son 620.000 euros, cifra que supera los 500.000: el límite es de 500.000 euros. La opción de 620.000 euros aplica solo el porcentaje. La de 1.000.000 de euros es el techo del Ministro de Hacienda. La de 1.240.000 euros es el 20 % del capítulo, el otro límite de ese Ministro."
  citation: "art. 56.3.a LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-2003-21614-art-53
- id: q17
  lesson: m05-l02
  prompt:
    es: "Con los ingresos que ya ha cobrado por la venta de publicaciones y servicios, y con los derechos reconocidos que aún no ha cobrado, el CIS puede generar crédito en 2027 por un importe de:"
  options:
  - id: a
    text:
      es: "50.000 euros, los ingresos efectuados y los derechos reconocidos que aún no ha cobrado."
  - id: b
    correct: true
    text:
      es: "38.000 euros, los ingresos ya efectuados."
  - id: c
    text:
      es: "12.000 euros, los derechos reconocidos que aún no ha cobrado."
  - id: d
    text:
      es: "Ninguno, porque las ventas y la prestación de servicios no dan lugar a generaciones de crédito."
  explanation:
    es: "La generación solo puede realizarse cuando se han efectuado los ingresos que la justifican (art. 53.3 LGP), y las ventas de bienes y la prestación de servicios son ingresos que la originan (art. 53.2.b) LGP). El CIS puede generar crédito por los 38.000 euros cobrados. La excepción de los organismos autónomos, que permite generar con el derecho reconocido, vale para las aportaciones del apartado 2.a), no para las ventas, y por eso la cifra de 50.000 euros es errónea. La de 12.000 euros toma solo lo pendiente de cobro. La que niega la generación ignora la letra b) del apartado 2."
  citation: "art. 53.3 LGP"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2003-21614-art-73
- id: q18
  lesson: m05-l03
  prompt:
    es: "Una vez que la empresa del trabajo de campo entrega el informe final y la factura, ¿qué debe acreditarse documentalmente ante el órgano competente del CIS para reconocer la obligación?"
  options:
  - id: a
    text:
      es: "La orden de pago expedida a favor de la empresa por el Ordenador de pagos."
  - id: b
    text:
      es: "El informe favorable de la Intervención General sobre la propuesta de pago de la factura."
  - id: c
    text:
      es: "Los fondos disponibles en la tesorería del CIS para atender el pago en el ejercicio."
  - id: d
    correct: true
    text:
      es: "La realización de la prestación por la empresa, conforme a los acuerdos que aprobaron y comprometieron el gasto."
  explanation:
    es: "El reconocimiento de la obligación exige la acreditación documental previa, ante el órgano competente, de la realización de la prestación o del derecho del acreedor, conforme a los acuerdos que aprobaron y comprometieron el gasto (art. 73.4 LGP). La opción de la orden de pago describe la fase siguiente, la ordenación del pago, que es posterior al reconocimiento. La del informe de la Intervención General confunde el reconocimiento con el control. La de los fondos en tesorería se refiere al pago material, no al reconocimiento."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-155
- id: q19
  lesson: m05-l03
  prompt:
    es: "Si el CIS no acepta el reparo que formula su Intervención Delegada, ¿ante quién y por conducto de quién debe plantear la discrepancia motivada por escrito?"
  options:
  - id: a
    correct: true
    text:
      es: "Ante la Intervención General de la Administración del Estado, a través del Presidente del CIS."
  - id: b
    text:
      es: "Ante la Intervención General de la Administración del Estado, por conducto de la Subsecretaría del Ministerio de adscripción."
  - id: c
    text:
      es: "Ante el Consejo de Ministros, a través del Presidente del CIS, que adopta la resolución definitiva."
  - id: d
    text:
      es: "Ante la propia Intervención Delegada, por conducto de la Secretaría General del CIS, que reconsidera el reparo."
  explanation:
    es: "El órgano gestor que no acepta el reparo plantea la discrepancia a la Intervención General de la Administración del Estado, por conducto de la Subsecretaría en los ministerios y a través de los presidentes o directores en los demás casos (art. 155 LGP). El CIS es un organismo autónomo, así que actúa a través de su Presidente. La opción de la Subsecretaría es el conducto de los ministerios. La del Consejo de Ministros corresponde al reparo formulado por la propia Intervención General, no al de una Intervención Delegada. La de la propia Intervención Delegada no prevé la ley: resuelve la Intervención General."
  citation: "art. 155 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-151
- id: q20
  lesson: m05-l03
  prompt:
    es: "¿Está sometida a fiscalización previa la contratación de la traducción de los cuestionarios por 12.000 euros, que el CIS tramita como contrato menor?"
  options:
  - id: a
    text:
      es: "Sí, porque supera los 5.000 euros, límite de los gastos exentos de fiscalización previa."
  - id: b
    text:
      es: "Sí, porque toda adquisición de compromisos de gasto del organismo está sometida a fiscalización previa."
  - id: c
    correct: true
    text:
      es: "No, porque los contratos menores no están sometidos a fiscalización previa."
  - id: d
    text:
      es: "No, pero solo si el CIS paga la traducción mediante anticipo de caja fija."
  explanation:
    es: "No están sometidos a la fiscalización previa los contratos menores (art. 151.a) LGP), y la traducción de 12.000 euros es un contrato menor del CIS. La opción de los 5.000 euros mezcla la regla de los gastos menores pagados por anticipo de caja fija, que es otra excepción. La de toda adquisición de compromisos describe la regla general, que el artículo 151 exceptúa. La del anticipo de caja fija condiciona a un modo de pago una exención que el contrato menor tiene por sí mismo."
  citation: "art. 151 LGP"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
