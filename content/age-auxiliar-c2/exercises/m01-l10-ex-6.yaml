# anchor: celex-12016e-txt-art-259
- id: m01-l10-q129
  prompt:
    es: "Según el Tratado de Funcionamiento de la Unión Europea, ¿a qué institución debe someter un Estado miembro el asunto antes de interponer contra otro Estado miembro un recurso por un supuesto incumplimiento?"
  options:
  - id: a
    text:
      es: "El Consejo."
  - id: b
    text:
      es: "El Parlamento Europeo."
  - id: c
    correct: true
    text:
      es: "La Comisión."
  - id: d
    text:
      es: "El Consejo Europeo."
  explanation:
    es: "El Estado que quiere recurrir contra otro debe someter antes el asunto a la Comisión. No lo debe someter al Consejo, al Parlamento ni al Consejo Europeo."
  citation: "art. 259 TFUE"
  difficulty: 2
  tags:
  - "procedimiento"
