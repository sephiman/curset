    slsa-build-track-basics#build-l3-hardened-builds; slsa-source-requirements#basics
  extract:
    en: In practice, this means that builds run on a hosted platform that generates and signs
- id: m10-l06-q16
  prompt:
    en: In the STRIDE table of the OWASP Threat Modeling Cheat Sheet, which security attribute does an attacker's
      unintended update to a database violate, as in the Tampering category?
  options:
  - id: a
    text:
      en: Authentication
  - id: b
    text:
      en: Confidentiality
  - id: c
    correct: true
    text:
      en: Integrity
  - id: d
    text:
      en: Availability
  explanation:
    en: Tampering violates integrity. Authentication, confidentiality and availability are ruled out as one group,
      because the cheat sheet lists integrity as the attribute that Tampering violates, with the example of an attacker
      abusing the application to perform unintended updates to a database.
  citation: owasp-cs-threat-modeling#threat-identification
  extract:
    en: Tampering Integrity An attacker abuses the application to perform unintended updates to a database.
- id: m10-l06-q17
  prompt:
    en: A team generates software bills of materials with CycloneDX. Which statement about the CycloneDX specification
      is correct?
  options:
  - id: a
    text:
      en: It inventories only third-party components, not first-party ones
  - id: b
    text:
      en: It describes software only, not hardware devices or machine learning models
  - id: c
    correct: true
    text:
      en: Its dependency graph can represent both direct and transitive relationships
  - id: d
    text:
      en: Components that depend on services cannot be represented in it
  explanation:
    en: The CycloneDX dependency graph is capable of representing both direct and transitive relationships. A third-party-only
      inventory is ruled out because components describe the complete inventory of first-party and third-party components.
      A software-only scope is ruled out because the specification can represent software, hardware devices, machine
      learning models, source code and configurations. Missing service dependencies are ruled out because components
      that depend on services can be represented in the dependency graph.
  citation: cyclonedx-spec#dependencies; cyclonedx-spec#components
- id: m10-l06-q18
  prompt:
    en: A team signs release artifacts with Sigstore without managing long-lived keys. Which statement about keyless
      signing and verification in Sigstore is correct?
  options:
  - id: a
    text:
      en: Fulcio issues long-lived certificates bound to a developer's permanent private key
  - id: b
    text:
      en: Signing events are recorded only on the signer's own machine
  - id: c
    text:
      en: Verification relies on the signature alone, without comparing a log entry
  - id: d
    correct: true
    text:
      en: Keyless signing associates identities, rather than keys, with an artifact signature
  explanation:
    en: Keyless signing associates identities, rather than keys, with an artifact signature. Long-lived certificates
      are ruled out because Fulcio issues short-lived certificates binding an ephemeral key to an OpenID Connect
      identity. Local-only records are ruled out because signing events are logged in Rekor, a signature transparency
      log. Verification on the signature alone is ruled out because Sigstore compares a tuple of signature, key
      or certificate, and artifact against the timestamped Rekor entry.
  citation: sigstore-cosign-signing#overview; sigstore-cosign-signing#verifying-the-signed-artifact
- id: m10-l06-q19
  prompt:
    en: The lesson snippet resolves the client-supplied relative path `../etc/passwd` against the upload directory
      `/var/uploads`, normalizes the result, and tests it with `startsWith`. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: /var/etc/passwd false
  - id: b
    text:
      en: /var/uploads/../etc/passwd true
  - id: c
    text:
      en: /var/etc/passwd true
  - id: d
    text:
      en: /etc/passwd false
  explanation:
    en: The snippet prints `/var/etc/passwd false`, because `normalize()` removes the `..` segment together with
      `uploads` and the remaining path does not start with `/var/uploads`. The output `/var/uploads/../etc/passwd
      true` is what skipping `normalize()` produces, since the unnormalized path still starts with `/var/uploads`.
      The output `/var/etc/passwd true` assumes the normalized path stays inside the upload directory, but `startsWith(uploads)`
      is false for it. The output `/etc/passwd false` removes one segment too many, since `..` removes only `uploads`.
  citation: owasp-cs-file-upload#filename-safety
  extract:
    en: Restrict use of leading periods (hidden files) and sequential periods (directory traversal).
  snippet: m10-l06/PathTraversal.java
