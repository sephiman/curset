  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-4
- id: m02-l03-q117
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el impulso del funcionamiento de los Patronatos de los Archivos Históricos de carácter nacional es una de las vías mediante las que la Administración General del Estado promueve e impulsa:"
  options:
