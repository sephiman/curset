  prompt:
    es: "En Excel 365, ¿qué diferencia hay entre CONCAT y UNIRCADENAS, según la lista de funciones de texto?"
  options:
  - id: a
    text:
      es: "CONCAT solo admite dos cadenas de texto en cada llamada a la función"
  - id: b
    text:
      es: "CONCAT es de la versión 2013 y UNIRCADENAS de la 2019"
  - id: c
