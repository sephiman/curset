# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q320
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de las siguientes teclas se mantiene presionada para seleccionar más de un elemento de una segmentación de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl"
  - id: b
    text:
      es: "Mayús"
  - id: c
    text:
      es: "Alt"
  - id: d
    text:
      es: "Tab"
  explanation:
    es: "La página dice que, para seleccionar más de un elemento, se mantiene presionada la tecla Ctrl y se seleccionan los elementos. «Mayús»: la página pide mantener presionada la tecla Ctrl. «Alt»: la página pide Ctrl, y Alt abre las teclas de acceso de la cinta. «Tab»: Tab mueve entre celdas o controles, y no sirve para seleccionar varios elementos."
  citation: "fuente: `ms-excel-segmentacion.html`; «Crear una segmentación de datos para filtrar datos en una tabla o tabla dinámica»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q321
  prompt:
    es: "En Excel 365, ¿a qué tablas dinámicas se puede conectar una segmentación de datos ya existente?"
  options:
  - id: a
    text:
      es: "A cualquier tabla dinámica del libro"
  - id: b
    correct: true
    text:
      es: "A las que comparten el mismo origen de datos"
  - id: c
    text:
      es: "Solo a la tabla dinámica en la que se creó"
  - id: d
    text:
      es: "A las tablas dinámicas que estén en la misma hoja"
  explanation:
    es: "La página dice que las segmentaciones solo se pueden conectar a tablas dinámicas que compartan el mismo origen de datos. «A cualquier tabla dinámica del libro»: la página dice que solo se conectan a las que comparten el origen de datos. «Solo a la tabla dinámica en la que se creó»: se pueden conectar a otras que compartan el origen. «A las tablas dinámicas que estén en la misma hoja»: la condición es el origen de datos compartido, no la hoja."
  citation: "fuente: `ms-excel-segmentacion.html`; «Las segmentaciones solo se pueden conectar a tablas dinámicas que compartan el mismo origen de datos.»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q322
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes comandos de la pestaña Segmentación comparte una segmentación con otra tabla dinámica?"
  options:
  - id: a
    text:
      es: "Insertar segmentaciones"
  - id: b
    text:
      es: "Filtrar conexiones"
  - id: c
    correct: true
    text:
      es: "Conexiones de informe"
  - id: d
    text:
      es: "Borrar filtro"
  explanation:
    es: "La página dice que se usa Conexiones de informe en la pestaña Segmentación y se activa la casilla de la otra tabla dinámica. «Filtrar conexiones»: es el comando de la pestaña Analizar de tabla dinámica para desconectar la segmentación. «Borrar filtro»: es el botón que quita los filtros de la segmentación. «Insertar segmentaciones»: es el cuadro de diálogo que crea segmentaciones."
  citation: "fuente: `ms-excel-segmentacion.html`; «Hacer que una segmentación de datos esté disponible en otra tabla dinámica»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-formato-condicional-html
- id: m02-l09-q323
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que representa la longitud de una barra de datos del formato condicional?"
  options:
  - id: a
    text:
      es: "El porcentaje de celdas con formato"
  - id: b
    text:
      es: "La posición de la celda en el rango"
  - id: c
    correct: true
    text:
      es: "El valor de la celda"
  - id: d
    text:
      es: "El número de caracteres de la celda"
  explanation:
    es: "La página dice que la longitud de la barra de datos representa el valor de la celda: más larga, valor más alto. «El número de caracteres de la celda»: la página dice que la longitud de la barra representa el valor de la celda. «La posición de la celda en el rango»: la longitud depende del valor de la celda, no de su posición. «El porcentaje de celdas con formato»: la barra compara el valor de la celda con los demás valores, sin contar celdas."
  citation: "fuente: `ms-excel-formato-condicional.html`; «Aplicar formato a las celdas empleando barras de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formato-condicional-html
- id: m02-l09-q324
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de las siguientes rutas de la cinta de opciones aplica formato condicional con barras de datos?"
  options:
  - id: a
    text:
      es: "Inicio › Número › Barras de datos"
  - id: b
    text:
      es: "Insertar › Gráficos › Barras apiladas › Barras de datos de la hoja"
  - id: c
    text:
      es: "Datos › Ordenar y filtrar › Barras de datos"
  - id: d
    correct: true
    text:
      es: "Inicio › Estilos › Formato condicional › Barras de datos"
  explanation:
    es: "La página da «Inicio > Estilos > Formato condicional > Barras de datos» para aplicar barras de datos. «Insertar › Gráficos › Barras apiladas › Barras de datos de la hoja»: Insertar › Gráficos crea gráficos y no formato condicional. «Datos › Ordenar y filtrar › Barras de datos»: Ordenar y filtrar contiene comandos de orden y filtro. «Inicio › Número › Barras de datos»: el grupo Número contiene formatos de número."
  citation: "fuente: `ms-excel-formato-condicional.html`; «Aplicar formato a las celdas empleando barras de datos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-formato-condicional-html
- id: m02-l09-q328
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados muestra el botón de Análisis rápido, que aplica formato condicional a los datos seleccionados?"
  options:
  - id: a
    text:
      es: "Ctrl+E"
  - id: b
    correct: true
    text:
      es: "Ctrl+Q"
  - id: c
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+L"
  explanation:
    es: "La página dice que se hace clic en Análisis rápido o se presiona Ctrl+Q. «Ctrl+E»: la página lo da para seleccionar la hoja completa. «Ctrl+T»: crea una tabla con el cuadro Crear tabla. «Ctrl+L»: la página lo da para mostrar el cuadro Crear tabla, igual que Ctrl+T."
  citation: "fuente: `ms-excel-formato-condicional.html`; «Haga clic en Análisis rápido o presione Ctrl+Q.»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-formato-condicional-html
- id: m02-l09-q329
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que ocurre con el formato condicional si una celda del rango contiene una fórmula que devuelve un error?"
  options:
  - id: a
    text:
      es: "No se aplica solo a la celda con el error"
  - id: b
    text:
      es: "Se aplica a todas las celdas y marca el error en rojo"
  - id: c
    text:
      es: "Se aplica solo a las celdas anteriores al error"
  - id: d
    correct: true
    text:
      es: "No se aplica a ninguna celda del rango"
  explanation:
    es: "La página dice que, si una celda con una fórmula devuelve un error, el formato condicional no se aplica a ninguna celda del rango, y recomienda ES o SIERROR. «No se aplica solo a la celda con el error»: la página dice que el formato no se aplica a ninguna celda del rango. «Se aplica a todas las celdas y marca el error en rojo»: la página dice que no se aplica a ninguna celda. «Se aplica solo a las celdas anteriores al error»: la página dice que no se aplica a ninguna celda del rango."
  citation: "fuente: `ms-excel-formato-condicional.html`; «Aplicar formato a las celdas empleando una escala de dos colores»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-formato-condicional-html
- id: m02-l09-q330
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes comandos de Formato condicional permite agregar, duplicar o editar reglas desde un cuadro de diálogo?"
  options:
  - id: a
    text:
      es: "Reglas superiores e inferiores"
  - id: b
    correct: true
    text:
      es: "Administrar reglas"
  - id: c
    text:
      es: "Borrar reglas"
  - id: d
    text:
      es: "Resaltar reglas de celdas"
  explanation:
    es: "La página dice que Administrar reglas abre el Administrador de reglas de formato condicionales, con Nueva regla, Duplicar regla y Editar regla. «Borrar reglas»: ese comando quita reglas de formato. «Resaltar reglas de celdas»: ese comando aplica un formato rápido a celdas según un operador de comparación. «Reglas superiores e inferiores»: ese comando da formato a los valores más altos, más bajos o por encima del promedio."
  citation: "fuente: `ms-excel-formato-condicional.html`; «Formato avanzado»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-imprimir-html
- id: m02-l09-q332
  prompt:
    es: "En Excel 365, ¿qué requisito deben cumplir los libros para imprimir varios de forma simultánea?"
  options:
  - id: a
    correct: true
    text:
      es: "Estar todos en la misma carpeta"
  - id: b
    text:
      es: "Estar guardados en formato PDF"
  - id: c
    text:
      es: "Estar abiertos en la misma ventana"
  - id: d
    text:
      es: "Tener las mismas hojas"
  explanation:
    es: "La página dice que todos los archivos de libro que se quieran imprimir deben estar en la misma carpeta; se seleccionan con Ctrl y se elige Imprimir. «Estar abiertos en la misma ventana»: la página pide que los archivos estén en la misma carpeta. «Tener las mismas hojas»: la página pide que los archivos estén en la misma carpeta, y no que tengan las mismas hojas. «Estar guardados en formato PDF»: la página pide la misma carpeta, y los libros se abren con Archivo › Abrir."
  citation: "fuente: `ms-excel-imprimir.html`; «Imprimir varios libros de forma simultánea»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q014
  prompt:
    es: "Señale el método abreviado de Excel 365 que contrae la cinta de opciones cuando está expandida:"
  options:
  - id: a
    text:
      es: "Alt+F1"
  - id: b
    text:
      es: "F10"
  - id: c
    text:
      es: "Ctrl+F2"
  - id: d
    correct: true
    text:
      es: "Ctrl+F1"
  explanation:
    es: "La página dice, para contraer la cinta expandida: «Presione CTRL+F1». «Alt+F1» crea un gráfico incrustado a partir de los datos del rango actual. «F10» activa la barra de menús. «Ctrl+F2» edita la celda activa en la barra de fórmulas. Ninguna contrae la cinta."
  citation: "fuente: `ms-office-cinta.html`; «Ocultar o mostrar la cinta de opciones»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q015
  prompt:
    es: "En Excel 365, ¿qué ocurre con las personalizaciones de la cinta de opciones respecto a las demás aplicaciones de Office?"
  options:
  - id: a
    text:
      es: "Se aplican a todas las aplicaciones de Office del equipo"
  - id: b
    correct: true
    text:
      es: "Solo se aplican al programa en el que se hicieron"
  - id: c
    text:
      es: "Se aplican a todas las aplicaciones que usan la misma cuenta"
  - id: d
    text:
      es: "Se aplican solo al libro que está abierto"
  explanation:
    es: "La página dice: «las personalizaciones solo se aplican al programa de Office en el que está trabajando en ese momento». «Se aplican a todas las aplicaciones de Office del equipo» y «se aplican a todas las aplicaciones que usan la misma cuenta» lo contradicen: la página pone el ejemplo de personalizar PowerPoint sin que los cambios se vean en otro programa. «Se aplican solo al libro que está abierto» tampoco: el ámbito es el programa, no el libro."
  citation: "fuente: `ms-office-cinta.html`; «Lo que puede personalizar»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l09-q019
  prompt:
    es: "En Excel 365, ¿cuál es la única forma de aumentar el tamaño de los botones de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Activar una opción de tamaño en Microsoft Office"
  - id: b
    text:
      es: "Mostrar la barra en varias líneas"
  - id: c
    correct: true
    text:
      es: "Bajar la resolución de pantalla"
  - id: d
    text:
      es: "Arrastrar el borde de la barra"
  explanation:
    es: "La página dice: «La única forma de aumentar el tamaño de los botones es bajar la resolución de pantalla que se usa». «Activar una opción de tamaño en Microsoft Office» la contradice: la página dice que no se puede con una opción. «Mostrar la barra en varias líneas» tampoco: «No puede mostrar la barra de herramientas de acceso rápido en varias líneas». «Arrastrar el borde de la barra» no lo cita la página, que da una única forma."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l09-q151
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes elementos se puede agregar a la barra de herramientas de acceso rápido?"
  options:
  - id: a
    correct: true
    text:
      es: "Un comando"
  - id: b
    text:
      es: "Los valores de sangría"
  - id: c
    text:
      es: "Los estilos individuales de la galería"
  - id: d
    text:
      es: "El contenido de la lista de espaciado"
  explanation:
    es: "Solo se pueden agregar comandos a la barra de herramientas de acceso rápido: el contenido de la mayoría de las listas, como los valores de sangría y espaciado, y los estilos individuales, no se puede agregar."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q334
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes acciones contrae la cinta de opciones cuando está expandida?"
  options:
  - id: a
    text:
      es: "Pulsar F11"
  - id: b
    text:
      es: "Hacer doble clic en la barra de fórmulas de la hoja"
  - id: c
    text:
      es: "Pulsar Ctrl+F2"
  - id: d
    correct: true
    text:
      es: "Hacer doble clic en cualquiera de sus pestañas"
  explanation:
    es: "La página da tres maneras: doble clic en una pestaña, clic derecho en una pestaña y Contraer la cinta de opciones, o Ctrl+F1. «Hacer doble clic en la barra de fórmulas de la hoja»: la página usa las pestañas de la cinta, no la barra de fórmulas. «Pulsar Ctrl+F2»: la página da Ctrl+F1 para expandir o contraer la cinta. «Pulsar F11»: F11 crea un gráfico en una hoja de gráfico distinta."
  citation: "fuente: `ms-office-cinta.html`; «Ocultar o mostrar la cinta de opciones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q335
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes pestañas de la cinta de opciones NO se puede ocultar ni mover?"
  options:
  - id: a
    text:
      es: "Vista"
  - id: b
    text:
      es: "Inicio"
  - id: c
    text:
      es: "Insertar"
  - id: d
    correct: true
    text:
      es: "Archivo"
  explanation:
    es: "La página dice que no se puede cambiar la ubicación de la pestaña Archivo ni ocultarla. «Inicio»: la página dice que se puede cambiar el orden de Inicio, Insertar y otras. «Insertar»: la página dice que se puede cambiar el orden de Insertar. «Vista»: la página dice que las pestañas, salvo Archivo, se pueden ocultar."
  citation: "fuente: `ms-office-cinta.html`; «Personalice las pestañas de su cinta: cambie el orden, agregue, oculte, elimine»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q336
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que indica la palabra «(Personalizado)» tras el nombre de una pestaña en la ventana Personalizar la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Que es una pestaña oculta"
  - id: b
    text:
      es: "Que la pestaña no se puede quitar"
  - id: c
    correct: true
    text:
      es: "Que es una pestaña personalizada; la palabra no aparece en la cinta"
  - id: d
    text:
      es: "Que es una pestaña oculta, y la palabra aparece en la cinta de opciones al activarla"
  explanation:
    es: "La página dice que las pestañas y grupos personalizados llevan «(Personalizado)» en la lista, pero esa palabra no aparece en la cinta. «Que es una pestaña oculta»: la página usa la casilla desactivada para ocultar pestañas. «Que es una pestaña oculta, y la palabra aparece en la cinta de opciones al activarla»: la página dice que las personalizaciones se aplican al programa donde se hicieron, sin usar esa palabra. «Que la pestaña no se puede quitar»: la página dice que las personalizadas son las únicas que se pueden quitar."
  citation: "fuente: `ms-office-cinta.html`; «Quitar una pestaña personalizada»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-cinta-html
- id: m02-l09-q337
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones de la cinta de opciones NO se puede personalizar, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Los comandos que se usan con menos frecuencia en cada grupo"
  - id: b
    text:
      es: "El orden de las pestañas"
  - id: c
    correct: true
    text:
      es: "El tamaño de la cinta, del texto y de los iconos"
  - id: d
    text:
      es: "Las pestañas que se muestran"
  explanation:
    es: "La página dice que no se puede reducir el tamaño de la cinta ni el del texto y los iconos; solo cambiando la resolución de pantalla. «El orden de las pestañas»: la página dice que se puede cambiar el orden de las pestañas. «Las pestañas que se muestran»: la página dice que se pueden ocultar o mostrar pestañas. «Los comandos que se usan con menos frecuencia en cada grupo»: la página dice que se pueden ocultar los comandos poco usados."
  citation: "fuente: `ms-office-cinta.html`; «Introducción»"
  difficulty: 2
  tags:
  - "concepto"
