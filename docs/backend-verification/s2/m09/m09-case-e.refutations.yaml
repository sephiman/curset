m09-case-e-q01:
  key:
    anchor: rfc9562#section-2.1
    sentence: The fact that UUIDs can be used to create unique, reasonably short values in distributed systems without requiring coordination makes them a good alternative
  wrong:
  - option: Coordinating sequential identifiers across the network is cheap
    anchor: rfc9562#section-2.1
    sentence: 'do not work well: the effort required to coordinate sequential numeric identifiers across a network can easily become a burden.'
  - option: UUIDv4 values have good database-index locality
    anchor: rfc9562#section-2.1
    sentence: UUID versions that are not time ordered, such as UUIDv4 (described in Section 5.4), have poor database-index locality.
  - option: UUIDv1 timestamps use the familiar Unix Epoch
    anchor: rfc9562#section-2.1
    sentence: is uncommon and difficult to represent accurately using a standard number format
m09-case-e-q02:
  key:
    anchor: rfc9562#section-2.1
    sentence: new values created in succession are not close to each other in the index; thus, they require inserts to be performed at random locations.
  wrong:
  - option: Their node field exposes MAC addresses that locate network interfaces
    anchor: rfc9562#section-2.1
    sentence: Privacy and network security issues arise from using a Media Access Control (MAC) address in the node field of UUIDv1. Exposed MAC addresses can be used as an attack surface to locate network interfaces
  - option: Their time-ordered value field makes every insert hit the newest page
    anchor: rfc9562#section-5.7
    sentence: UUIDv7 features a time-ordered value field derived from the widely implemented and well-known Unix Epoch timestamp source, the number of milliseconds since midnight 1 Jan 1970 UTC, leap seconds excluded.
  - option: Their Gregorian Epoch timestamp is hard to represent accurately
    anchor: rfc9562#section-2.1
    sentence: is uncommon and difficult to represent accurately using a standard number format
m09-case-e-q03:
  key:
    anchor: rfc9562#section-5.7
    sentence: UUIDv7 values are created by allocating a Unix timestamp in milliseconds in the most significant 48 bits and filling the remaining 74 bits, excluding the required version and variant bits, with random bits for each new UUIDv7 generated to provide uniqueness
  wrong:
  - option: A Unix timestamp in whole seconds
    anchor: rfc9562#section-6.1
    sentence: while UUIDv7 features a millisecond level of precision by default within the Unix Epoch
  - option: A Gregorian Epoch timestamp in 100-nanosecond units
    anchor: rfc9562#section-6.1
    sentence: UUIDv1 and UUIDv6 both utilize a Gregorian Epoch timestamp, while UUIDv7 utilizes a Unix Epoch timestamp.
  - option: A custom epoch chosen by each service
    anchor: rfc9562#section-6.1
    sentence: If other timestamp sources or a custom timestamp Epoch are required, UUIDv8 MUST be used.
