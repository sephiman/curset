# anchor: celex-12016e-txt-art-238
- id: m01-l10-q089
  prompt:
    es: "Conforme al artículo 238.1 del Tratado de Funcionamiento de la Unión Europea, cuando deba adoptar un acuerdo por mayoría simple, el Consejo se pronunciará por mayoría de:"
