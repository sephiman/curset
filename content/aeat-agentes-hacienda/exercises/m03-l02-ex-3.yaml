# anchor: boe-a-2007-21228-art-1
- id: m03-l02-q0032
  prompt:
    es: "Conforme al artículo 1.1 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, señale la respuesta CORRECTA sobre los Departamentos de la Agencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Se integran en la organización central, con dependencia directa de la Dirección General de la Agencia y rango de dirección general."
  - id: b
    text:
      es: "Se integran en la organización territorial, con dependencia directa de las Delegaciones Especiales y rango de subdirección general."
  - id: c
    text:
      es: "Se integran en la organización central, con dependencia directa de la Presidencia de la Agencia y rango de dirección general."
  - id: d
    text:
      es: "Se integran en la organización central, con dependencia directa de la Dirección General de la Agencia y rango de dirección adjunta."
  explanation:
    es: "El artículo 1.1 integra los Departamentos en la organización central, con dependencia directa de la Dirección General y todos con rango de dirección general. No dependen de la Presidencia. Su rango tampoco es el de dirección adjunta, que corresponde a los Servicios Centrales. Y no son órganos territoriales: las Delegaciones Especiales son la organización periférica."
  citation: "art. 1.1 Orden PRE/3581/2007"
  difficulty: 1
  tags:
  - "Departamentos"
  - "rango"
# anchor: boe-a-2007-21228-art-1
- id: m03-l02-q0033
  prompt:
    es: "¿Cuál de las siguientes denominaciones corresponde a un Departamento de la organización central de la Agencia, según el artículo 1.1 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias?"
  options:
  - id: a
    correct: true
    text:
      es: "Departamento de Aduanas e Impuestos Especiales."
  - id: b
    text:
      es: "Departamento de Planificación y Relaciones Institucionales."
  - id: c
    text:
      es: "Departamento de Organización, Planificación y Relaciones Institucionales."
  - id: d
    text:
      es: "Departamento de Auditoría Interna y Control Financiero."
  explanation:
    es: "El artículo 1.1 enumera seis Departamentos, entre ellos el de Aduanas e Impuestos Especiales. El de Organización, Planificación y Relaciones Institucionales no figura en esa lista: el artículo 3 que lo preveía no tiene contenido. La auditoría interna la lleva el Servicio de Auditoría Interna, un órgano central con rango de dirección adjunta, no un Departamento. Y la planificación y las relaciones institucionales son competencia de un Servicio, no de un Departamento."
  citation: "art. 1.1 Orden PRE/3581/2007"
  difficulty: 1
  tags:
  - "Departamentos"
# anchor: boe-a-2007-21228-art-2
- id: m03-l02-q0035
  prompt:
    es: "Según el artículo 2.1 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, los Directores de los Departamentos son los responsables de la dirección general y jefatura superior de:"
  options:
  - id: a
    text:
      es: "los órganos y unidades de toda la Agencia y del personal de sus Servicios Centrales."
  - id: b
    text:
      es: "los órganos territoriales de la Agencia y del personal de las Delegaciones Especiales."
  - id: c
    correct: true
    text:
      es: "los órganos y unidades y del personal de cada uno de ellos, así como del desarrollo de sus funciones y competencias."
  - id: d
    text:
      es: "las Delegaciones Especiales de su ámbito funcional, pero no del personal de los Departamentos."
  explanation:
    es: "Cada Director responde de la dirección general y la jefatura superior de los órganos y unidades y del personal de su Departamento, y del desarrollo de sus funciones. No se extiende a toda la Agencia. Tampoco a los órganos territoriales, que dependen de las Delegaciones Especiales. Y sí alcanza al personal del Departamento."
  citation: "art. 2.1 Orden PRE/3581/2007"
  difficulty: 2
  tags:
  - "Directores de Departamento"
# anchor: boe-a-2007-21228-art-2
- id: m03-l02-q0036
  prompt:
    es: "Según el artículo 2.2 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, ¿a quiénes dirigen los Directores de los Departamentos, en sus respectivos ámbitos funcionales, criterios de actuación?"
  options:
  - id: a
    correct: true
    text:
      es: "A los Delegados Central de Grandes Contribuyentes y Especiales."
  - id: b
    text:
      es: "A los titulares de las Dependencias Regionales de cada Delegación Especial."
  - id: c
    text:
      es: "Al Presidente y al Director General de la Agencia."
  - id: d
    text:
      es: "A los Delegados Especiales Adjuntos y a los Delegados de la Agencia Tributaria."
  explanation:
    es: "Los Directores dictan criterios de actuación dirigidos a los Delegados Central de Grandes Contribuyentes y Especiales. No los dirigen a los Adjuntos ni a los Delegados de la Agencia Tributaria. Tampoco a los titulares de las Dependencias Regionales, que no se nombran en ese apartado. Y no a los órganos rectores: el Presidente y el Director General están por encima de los Directores."
  citation: "art. 2.2 Orden PRE/3581/2007"
  difficulty: 2
  tags:
  - "Directores de Departamento"
  - "criterios de actuación"
# anchor: boe-a-2007-21228-art-10
- id: m03-l02-q0037
  prompt:
    es: "¿Cuál de las siguientes reglas establece el artículo 10 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias para los casos de vacante, ausencia o enfermedad del titular de la Dirección General de la Agencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Sus funciones las desempeñan temporalmente los titulares de los Departamentos, por el orden en el que se mencionan en el artículo 1."
  - id: b
    text:
      es: "Sus funciones las desempeña temporalmente el Presidente de la Agencia, mientras dure la vacante, ausencia o enfermedad."
  - id: c
    text:
      es: "Sus funciones las desempeñan temporalmente los Delegados Especiales, por orden de antigüedad en el cargo."
  - id: d
    text:
      es: "Sus funciones las desempeña temporalmente el titular del Departamento de Recursos Humanos, por ser el responsable del personal."
  explanation:
    es: "El artículo 10 llama a los titulares de los Departamentos, por el orden en que el artículo 1 los menciona. No sustituye el Presidente. Tampoco hay un llamamiento especial al Departamento de Recursos Humanos por razón del personal. Y los Delegados Especiales son órganos territoriales, a los que el artículo no llama."
  citation: "art. 10 Orden PRE/3581/2007"
  difficulty: 2
  tags:
  - "suplencia"
  - "Director General"
# anchor: boe-a-2007-21228-art-10
- id: m03-l02-q0038
  prompt:
    es: "El Director General de la Agencia Estatal de Administración Tributaria cae enfermo en marzo de 2027 y todos los titulares de los Departamentos están disponibles. Conforme al artículo 10 de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, ¿quién desempeña sus funciones en primer lugar?"
  options:
  - id: a
    correct: true
    text:
      es: "El titular del Departamento de Gestión Tributaria, por ser el primero que menciona el artículo 1."
  - id: b
    text:
      es: "El titular del Departamento de Inspección Financiera y Tributaria, por ser el segundo que menciona el artículo 1."
  - id: c
    text:
      es: "El titular del Departamento de Recursos Humanos, por ser el último que menciona el artículo 1."
  - id: d
    text:
      es: "El titular del Departamento de Aduanas e Impuestos Especiales, por ser el cuarto que menciona el artículo 1."
  explanation:
    es: "Los titulares de los Departamentos sustituyen por el orden del artículo 1, que empieza por Gestión Tributaria. Inspección Financiera y Tributaria es el segundo. Aduanas e Impuestos Especiales es el cuarto. Y Recursos Humanos es el último de la lista, por lo que sustituye en último lugar."
  citation: "art. 10 Orden PRE/3581/2007"
  difficulty: 3
  tags:
  - "suplencia"
  - "supuesto"
# anchor: boe-a-2007-21228-art-6
- id: m03-l02-q0040
  prompt:
    es: "En 2027 la Administración General del Estado debe transferir una cantidad a una Comunidad Autónoma y la Agencia inicia un expediente de deducción sobre ella. Según el artículo 6.1.l) de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, ¿qué Departamento resuelve ese expediente?"
  options:
  - id: a
    text:
      es: "El Departamento de Inspección Financiera y Tributaria."
  - id: b
    correct: true
    text:
      es: "El Departamento de Recaudación."
  - id: c
    text:
      es: "El Departamento de Informática Tributaria."
  - id: d
    text:
      es: "El Departamento de Aduanas e Impuestos Especiales."
  explanation:
    es: "La resolución de los expedientes de deducción sobre las cantidades que el Estado deba transferir a los entes territoriales es del Departamento de Recaudación. Una Comunidad Autónoma es uno de esos entes territoriales. Inspección Financiera y Tributaria no tiene esa función en el artículo 6.1.l). Tampoco Aduanas e Impuestos Especiales, que se ocupa del tráfico exterior y de los impuestos especiales. Y a Informática Tributaria le corresponden los sistemas informáticos, no la resolución de estos expedientes."
  citation: "art. 6.1.l) Orden PRE/3581/2007"
  difficulty: 1
  tags:
  - "Departamento de Recaudación"
  - "supuesto"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0042
  prompt:
    es: "De acuerdo con el apartado primero.2 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria, señale la respuesta CORRECTA sobre el Servicio de Estudios Tributarios y Estadísticas:"
  options:
  - id: a
    text:
      es: "Es una Subdirección General del Departamento de Gestión Tributaria, con rango de subdirección general."
  - id: b
    correct: true
    text:
      es: "Es un órgano central de la Agencia, con rango de dirección adjunta."
  - id: c
    text:
      es: "Es un Departamento de la organización central, con rango de dirección general."
  - id: d
    text:
      es: "Es un órgano territorial integrado en las Delegaciones Especiales, con rango de dirección adjunta."
  explanation:
    es: "El apartado primero.2 incluye ese Servicio entre los órganos centrales con rango de dirección adjunta. No es un Departamento, que tendría rango de dirección general. Tampoco una Subdirección General del Departamento de Gestión Tributaria. Y no es órgano territorial: los órganos territoriales son las Delegaciones y las Administraciones."
  citation: "apartado primero.2 Orden de 2 de junio de 1994"
  difficulty: 1
  tags:
  - "Servicio de Estudios Tributarios"
  - "rango"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0043
  prompt:
    es: "¿Cuál de los siguientes órganos centrales de la Agencia tiene rango de dirección adjunta, según el apartado primero.2 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Servicio de Auditoría Interna."
  - id: b
    text:
      es: "Delegación Especial de la Agencia Tributaria."
  - id: c
    text:
      es: "Departamento de Informática Tributaria."
  - id: d
    text:
      es: "Comité de Coordinación de la Dirección Territorial."
  explanation:
    es: "El Servicio de Auditoría Interna es uno de los cinco órganos centrales con rango de dirección adjunta. El Departamento de Informática Tributaria tiene rango de dirección general. La Delegación Especial es un órgano territorial. Y el Comité de Coordinación de la Dirección Territorial es un cauce de coordinación, no un órgano con rango."
  citation: "apartado primero.2 Orden de 2 de junio de 1994"
  difficulty: 2
  tags:
  - "Servicios Centrales"
  - "rango"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0044
  prompt:
    es: "Conforme al apartado primero.2 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria, existen, con rango de dirección adjunta, el Servicio Jurídico, el Servicio de Auditoría Interna, el Servicio de Gestión Económica, el Servicio de Estudios Tributarios y Estadísticas y el:"
  options:
  - id: a
    correct: true
    text:
      es: "Servicio de Planificación y Relaciones Institucionales."
  - id: b
    text:
      es: "Servicio de Informática y Seguridad Tributaria."
  - id: c
    text:
      es: "Servicio de Organización, Planificación y Recursos Humanos."
  - id: d
    text:
      es: "Servicio de Recaudación y Relaciones Institucionales."
  explanation:
    es: "El quinto órgano central con rango de dirección adjunta es el Servicio de Planificación y Relaciones Institucionales. El Servicio de Organización, Planificación y Recursos Humanos no existe: los recursos humanos son materia de un Departamento. El Servicio de Informática y Seguridad Tributaria tampoco: la informática tributaria es de otro Departamento. Y el Servicio de Recaudación y Relaciones Institucionales mezcla la recaudación, que es de un Departamento, con las relaciones institucionales del quinto Servicio."
  citation: "apartado primero.2 Orden de 2 de junio de 1994"
  difficulty: 2
  tags:
  - "Servicios Centrales"
# anchor: boe-a-2021-671-apartado-primero
- id: m03-l02-q0047
  prompt:
    es: "Según el apartado primero.1 de la Resolución de 13 de enero de 2021, de la Presidencia de la Agencia Estatal de Administración Tributaria, por la que se establece la estructura orgánica de la Delegación Central de Grandes Contribuyentes, ¿con arreglo a qué criterios actúa la Delegación Central de Grandes Contribuyentes?"
  options:
  - id: a
    text:
      es: "Con arreglo a los determinados por los Delegados Especiales de la Agencia Tributaria en sus respectivos territorios."
  - id: b
    text:
      es: "Con arreglo a los determinados por el Servicio de Planificación y Relaciones Institucionales para todos los órganos centrales."
  - id: c
    correct: true
    text:
      es: "Con arreglo a los determinados por los Directores de los Departamentos en el ejercicio de sus respectivas funciones."
  - id: d
    text:
      es: "Con arreglo a los que fije el Comité de Coordinación de la Dirección Territorial, por mayoría de sus miembros."
  explanation:
    es: "La Delegación actúa de acuerdo con los criterios que los Directores de los Departamentos determinan en el ejercicio de sus funciones. Los Delegados Especiales son órganos territoriales y no le marcan criterios. El Comité de Coordinación de la Dirección Territorial es un cauce de coordinación e información, no fija criterios. Y el Servicio de Planificación y Relaciones Institucionales no figura como fuente de criterios en el apartado."
  citation: "apartado primero.1 Resolución de 13-01-2021 (Delegación Central de Grandes Contribuyentes)"
  difficulty: 2
  tags:
  - "Delegación Central de Grandes Contribuyentes"
  - "criterios"
# anchor: boe-a-2021-671-apartado-cuarto
- id: m03-l02-q0048
  prompt:
    es: "Conforme al apartado cuarto.2 de la Resolución de 13 de enero de 2021, de la Presidencia de la Agencia Estatal de Administración Tributaria, por la que se establece la estructura orgánica de la Delegación Central de Grandes Contribuyentes, señale la respuesta CORRECTA sobre las Dependencias que integran la Delegación Central de Grandes Contribuyentes:"
  options:
  - id: a
    correct: true
    text:
      es: "Está integrada por la Dependencia de Control Tributario y Aduanero, la Dependencia de Asistencia y Servicios Tributarios y la Dependencia de Gestión de Medios y Recursos."
  - id: b
    text:
      es: "Está integrada por las Dependencias de Inspección, de Gestión Tributaria y de Recaudación."
  - id: c
    text:
      es: "Está integrada por las Dependencias de Control Tributario y Aduanero, de Asistencia y Servicios Tributarios, de Gestión de Medios y Recursos y de Informática Tributaria."
  - id: d
    text:
      es: "Está integrada por la Dependencia de Control Tributario y Aduanero y la Dependencia de Asistencia y Servicios Tributarios."
  explanation:
    es: "El apartado cuarto.2 enumera tres Dependencias: Control Tributario y Aduanero, Asistencia y Servicios Tributarios y Gestión de Medios y Recursos. Las Dependencias de Inspección, de Gestión Tributaria y de Recaudación son regionales, propias de las Delegaciones Especiales. Con solo dos falta una. Y con una cuarta de Informática Tributaria sobra una: la lista no la incluye."
  citation: "apartado cuarto.2 Resolución de 13-01-2021 (Delegación Central de Grandes Contribuyentes)"
  difficulty: 3
  tags:
  - "Delegación Central de Grandes Contribuyentes"
  - "Dependencias"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0050
  prompt:
    es: "Según el apartado primero.4 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria, ¿cuál es la función del Comité Permanente de Dirección de la Agencia?"
  options:
  - id: a
    text:
      es: "Dirigir la ejecución del Plan de Actuaciones y el funcionamiento ordinario de los servicios de la Agencia."
  - id: b
    text:
      es: "Ser el cauce institucional de coordinación e información entre la Dirección de la Agencia y su organización territorial."
  - id: c
    text:
      es: "Aprobar la estructura orgánica de la Agencia y los nombramientos del personal directivo."
  - id: d
    correct: true
    text:
      es: "Ser el cauce habitual para el análisis y coordinación de las decisiones directivas de la Agencia."
  explanation:
    es: "El Comité Permanente de Dirección es el cauce habitual para analizar y coordinar las decisiones directivas. El cauce de coordinación e información con la organización territorial es el Comité de Coordinación de la Dirección Territorial. Aprobar la estructura orgánica es facultad del Presidente. Y dirigir la ejecución del Plan de Actuaciones es función del Director General."
  citation: "apartado primero.4 Orden de 2 de junio de 1994"
  difficulty: 2
  tags:
  - "Comité Permanente de Dirección"
  - "funciones"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0051
  prompt:
    es: "Conforme al apartado primero.5 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria, señale la respuesta CORRECTA sobre la composición del Comité de Coordinación de la Dirección Territorial:"
  options:
  - id: a
    text:
      es: "Lo integran los Delegados especiales y los Delegados de la Agencia Tributaria, sin los miembros del Comité de Dirección."
  - id: b
    correct: true
    text:
      es: "Lo integran los miembros del Comité de Dirección, el Delegado Central de Grandes Contribuyentes y los Delegados especiales de la Agencia."
  - id: c
    text:
      es: "Lo integran los miembros del Comité de Dirección y los Jefes de las Dependencias Regionales de cada Delegación Especial."
  - id: d
    text:
      es: "Lo integran los Directores de los Departamentos y los Delegados Especiales Adjuntos de cada Delegación Especial."
  explanation:
    es: "El Comité de Coordinación de la Dirección Territorial está integrado por los miembros del Comité de Dirección, el Delegado Central de Grandes Contribuyentes y los Delegados especiales. Los Jefes de las Dependencias Regionales no forman parte de él. Tampoco los Delegados de la Agencia Tributaria, y sí los miembros del Comité de Dirección. Y los Delegados Especiales Adjuntos no figuran entre sus miembros."
  citation: "apartado primero.5 Orden de 2 de junio de 1994"
  difficulty: 3
  tags:
  - "Comité de Coordinación de la Dirección Territorial"
# anchor: boe-a-1994-12973-apartado-primero
- id: m03-l02-q0052
  prompt:
    es: "¿Cuál es el cauce institucional de coordinación e información entre la Dirección de la Agencia y su organización territorial, según el apartado primero.5 de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    text:
      es: "La Delegación Central de Grandes Contribuyentes."
  - id: b
    text:
      es: "El Servicio de Planificación y Relaciones Institucionales."
  - id: c
    correct: true
    text:
      es: "El Comité de Coordinación de la Dirección Territorial."
  - id: d
    text:
      es: "El Comité Permanente de Dirección de la Agencia."
  explanation:
    es: "El cauce institucional con la organización territorial es el Comité de Coordinación de la Dirección Territorial. El Comité Permanente de Dirección es el cauce habitual de análisis y coordinación de las decisiones directivas. La Delegación Central de Grandes Contribuyentes es un órgano central, no un cauce. Y el Servicio de Planificación y Relaciones Institucionales es un órgano central con funciones de planificación, no ese cauce."
  citation: "apartado primero.5 Orden de 2 de junio de 1994"
  difficulty: 1
  tags:
  - "Comité de Coordinación de la Dirección Territorial"
# anchor: boe-a-1994-12973-apartado-segundo
- id: m03-l02-q0053
  prompt:
    es: "¿Qué Subdirección General integra el Departamento de Gestión Tributaria, según el apartado segundo de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    text:
      es: "Subdirección General de Organización y Planificación."
  - id: b
    text:
      es: "Subdirección General de Inspección Territorial."
  - id: c
    correct: true
    text:
      es: "Subdirección General de Técnica Tributaria."
  - id: d
    text:
      es: "Subdirección General de Gestión Aduanera."
  explanation:
    es: "La Subdirección General de Técnica Tributaria es una de las cinco del Departamento de Gestión Tributaria. La de Inspección Territorial es del Departamento de Inspección Financiera y Tributaria. La de Organización y Planificación es del Departamento de Recaudación. Y la de Gestión Aduanera es del Departamento de Aduanas e Impuestos Especiales."
  citation: "apartado segundo Orden de 2 de junio de 1994"
  difficulty: 1
  tags:
  - "Subdirecciones Generales"
  - "Gestión Tributaria"
# anchor: boe-a-1994-12973-apartado-tercero
- id: m03-l02-q0055
  prompt:
    es: "Según el apartado tercero de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria, el Departamento de Inspección Financiera y Tributaria está integrado por las Subdirecciones Generales de Ordenación Legal y Asistencia Jurídica, de Estudios, Métodos y Procedimientos, de Planificación y Control y por la:"
  options:
