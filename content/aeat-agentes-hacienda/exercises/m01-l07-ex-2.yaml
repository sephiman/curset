# anchor: boe-a-1985-151-art-1
- id: m01-l07-q0002
  prompt:
    es: "Según el artículo 1.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, la prohibición de compatibilizar un segundo puesto de trabajo en el sector público alcanza a su desempeño:"
  options:
  - id: a
    text:
      es: "Solo por sí mismo, no mediante sustitución."
  - id: b
    text:
      es: "Solo mediante una sustitución retribuida."
  - id: c
    correct: true
    text:
      es: "Tanto por sí mismo como mediante sustitución."
  - id: d
    text:
      es: "Solo si el segundo puesto es de otra Administración."
  explanation:
    es: "El artículo 1.1 habla del desempeño «por sí o mediante sustitución» de un segundo puesto. Por eso alcanza también la sustitución, retribuida o no. La opción que deja fuera la sustitución contradice ese texto. La que limita la prohibición a la sustitución retribuida añade una condición que el artículo no pone. La que la limita a los puestos de otra Administración también es falsa: el artículo habla del «sector público» sin distinguir Administraciones."
  citation: "art. 1.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-3
- id: m01-l07-q0003
  prompt:
    es: "¿Para cuál de las siguientes funciones prevé la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas supuestos de segundo puesto de trabajo en el sector público?"
  options:
  - id: a
    correct: true
    text:
      es: "Para las funciones docente y sanitaria."
  - id: b
    text:
      es: "Para las funciones de inspección y control."
  - id: c
    text:
      es: "Para las funciones de gestión económica y presupuestaria."
  - id: d
    text:
      es: "Para las funciones de registro y atención a la ciudadanía."
  explanation:
    es: "El artículo 3.1 permite el segundo puesto «en los supuestos previstos en la misma para las funciones docente y sanitaria», además de los casos de los artículos 5 y 6 y los que fije el Consejo de Ministros por razón de interés público. Las funciones de inspección y control, las de gestión económica y presupuestaria y las de registro y atención a la ciudadanía no aparecen en esa lista."
  citation: "art. 3.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1985-151-art-7
- id: m01-l07-q0009
  prompt:
    es: "Según el artículo 7.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, para autorizar la compatibilidad, lo percibido por ambos puestos tiene como tope la remuneración presupuestaria de:"
  options:
  - id: a
    correct: true
    text:
      es: "El cargo de Director General."
  - id: b
    text:
      es: "El cargo de Subdirector General."
  - id: c
    text:
      es: "El cargo de Secretario de Estado."
  - id: d
    text:
      es: "El cargo de Secretario General Técnico."
  explanation:
    es: "El artículo 7.1 toma como tope «la remuneración prevista en los Presupuestos Generales del Estado para el cargo de Director General». El Subdirector General está un nivel por debajo y el Secretario de Estado por encima. El Secretario General Técnico tiene rango de Director General, pero el artículo no lo nombra como referencia."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1985-151-art-7
- id: m01-l07-q0011
  prompt:
    es: "¿Cuál de los siguientes incrementos sobre la retribución del puesto principal admite la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas para los funcionarios del grupo D o personal equivalente?"
  options:
  - id: a
    correct: true
    text:
      es: "En un 45 por 100."
  - id: b
    text:
      es: "En un 35 por 100."
  - id: c
    text:
      es: "En un 40 por 100."
  - id: d
    text:
      es: "En un 50 por 100."
  explanation:
    es: "Para el grupo D el artículo 7.1 fija «Un 45 por 100, para los funcionarios del grupo D o personal equivalente». El 35 por 100 corresponde al grupo B, el 40 por 100 al grupo C y el 50 por 100 al grupo E."
  citation: "art. 7.1 Ley 53/1984"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1985-151-art-9
- id: m01-l07-q0018
  prompt:
    es: "Según el artículo 9 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, en el Estado la autorización de compatibilidad para un segundo puesto público se acuerda a propuesta de:"
  options:
  - id: a
    text:
      es: "La Dirección General de la Función Pública."
  - id: b
    correct: true
    text:
      es: "La Subsecretaría del Departamento correspondiente."
  - id: c
    text:
      es: "La Secretaría General Técnica del Departamento correspondiente."
  - id: d
    text:
      es: "La Oficina de Conflictos de Intereses."
  explanation:
    es: "El artículo 9 atribuye la autorización o denegación al ministerio que nombra, «a propuesta de la Subsecretaría del Departamento correspondiente». Ni la Dirección General de la Función Pública, ni la Secretaría General Técnica, ni la Oficina de Conflictos de Intereses aparecen en el artículo como proponentes."
  citation: "art. 9 Ley 53/1984"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1985-151-art-9
- id: m01-l07-q0019
  prompt:
    es: "Según el artículo 9 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, si ambos puestos son de la Administración del Estado, ¿quién emite el informe favorable sobre el segundo puesto?"
  options:
  - id: a
    text:
      es: "La Subsecretaría del Departamento al que corresponda el puesto principal."
  - id: b
    text:
      es: "La Secretaría General Técnica del Departamento del segundo puesto."
  - id: c
    correct: true
    text:
      es: "La Subsecretaría del Departamento al que corresponda el segundo puesto."
  - id: d
    text:
      es: "La Dirección General de la Función Pública, oída la Subsecretaría."
  explanation:
    es: "El artículo 9 dice: «Si los dos puestos correspondieran a la Administración del Estado, emitirá este informe la Subsecretaría del Departamento al que corresponda el segundo puesto». La Subsecretaría del puesto principal es la que propone la autorización, no la que informa sobre el segundo puesto. La Secretaría General Técnica y la Dirección General de la Función Pública no aparecen en el artículo."
  citation: "art. 9 Ley 53/1984"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1985-151-art-14
- id: m01-l07-q0032
  prompt:
    es: "De acuerdo con el artículo 14 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera de las Administraciones Públicas requiere:"
  options:
  - id: a
    text:
      es: "La previa y expresa autorización de compatibilidad."
  - id: b
    correct: true
    text:
      es: "El previo reconocimiento de compatibilidad."
  - id: c
    text:
      es: "Una comunicación posterior al órgano de personal."
  - id: d
    text:
      es: "El informe favorable de la Oficina de Conflictos de Intereses."
  explanation:
    es: "El artículo catorce de la Ley 53/1984 dice que el ejercicio de actividades profesionales, laborales, mercantiles o industriales fuera de las Administraciones Públicas «requerirá el previo reconocimiento de compatibilidad». La previa y expresa autorización es la figura del artículo noveno para un segundo puesto o actividad del sector público. Una comunicación posterior contradice «previo». La Oficina de Conflictos de Intereses no interviene: el artículo atribuye la resolución al Ministerio de la Presidencia, al órgano competente de la Comunidad Autónoma o al Pleno de la Corporación Local."
  citation: "art. 14 Ley 53/1984"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-df-cuarta
- id: m01-l07-q0039
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, mientras no surta efectos la nueva redacción del artículo 16.1 de la Ley 53/1984, la autorización o denegación de compatibilidades:"
  options:
  - id: a
    text:
      es: "Se regirá directamente por la nueva redacción del artículo 16.1."
  - id: b
    text:
      es: "Quedará en suspenso hasta la aprobación de las leyes de Función Pública."
  - id: c
    text:
      es: "Se regirá por las instrucciones que dicte cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Continuará rigiéndose por la actual normativa."
  explanation:
    es: "La disposición final cuarta.1, párrafo segundo, dice: «Hasta que se hagan efectivos esos supuestos la autorización o denegación de compatibilidades continuará rigiéndose por la actual normativa». La nueva redacción del artículo 16.1 no se aplica todavía de forma directa. Las autorizaciones no quedan en suspenso. La disposición no remite a instrucciones de cada Departamento."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m01-l07-q0040
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuándo produce efectos en cada Administración la nueva redacción del artículo 16.1 de la Ley 53/1984?"
  options:
  - id: a
    text:
      es: "Con la entrada en vigor del texto refundido, en todas las Administraciones a la vez."
  - id: b
    correct: true
    text:
      es: "Con la entrada en vigor del capítulo III del título III, al aprobarse las leyes de Función Pública."
  - id: c
    text:
      es: "Con la aprobación de un real decreto de desarrollo por el Consejo de Ministros."
  - id: d
    text:
      es: "Con la publicación de la relación de puestos de trabajo de cada Administración."
  explanation:
    es: "La disposición dice que la final tercera, que da la nueva redacción al artículo 16.1, «producirá efectos en cada Administración Pública a partir de la entrada en vigor del capítulo III del título III con la aprobación de las leyes de Función Pública». No surtió efectos con el propio texto refundido ni a la vez en todas las Administraciones. Un real decreto de desarrollo o la relación de puestos de trabajo no son el hecho que la disposición señala."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-1985-151-art-16
- id: m01-l07-q0041
  prompt:
    es: "En la redacción que el texto refundido de la Ley del Estatuto Básico del Empleado Público da al artículo 16.1 de la Ley 53/1984, se excluye de toda compatibilidad al personal cuyas retribuciones complementarias incluyan:"
  options:
  - id: a
    text:
      es: "El factor de dedicación del puesto."
  - id: b
    text:
      es: "El factor de responsabilidad del puesto."
  - id: c
    text:
      es: "El factor de especial dificultad técnica del puesto."
  - id: d
    correct: true
    text:
      es: "El factor de incompatibilidad del puesto."
  explanation:
    es: "La nueva redacción del artículo 16.1, dada por la disposición final tercera del texto refundido, excluye al personal «cuando las retribuciones complementarias […] incluyan el factor de incompatibilidad». La dedicación, la responsabilidad y la especial dificultad técnica son otros factores que pueden retribuirse con el complemento, pero el artículo 16.1 no los nombra."
  citation: "art. 16.1 Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-16
- id: m01-l07-q0045
  prompt:
    es: "Según el artículo 16.4 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿cabe compatibilidad para actividades privadas con 18.400 euros de retribución básica (trienios: 2.400) y 5.000 de complemento específico?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque 5.000 euros superan el 30 por 100 de 16.000 euros."
  - id: b
    text:
      es: "Sí, porque 5.000 euros no superan el 30 por 100 de 18.400 euros."
  - id: c
    text:
      es: "Sí, porque 5.000 euros no superan el 35 por 100 de 16.000 euros."
  - id: d
    text:
      es: "No, porque quien percibe complemento específico nunca obtiene compatibilidad."
  explanation:
    es: "El artículo 16.4 compara el complemento con «el 30 por 100 de su retribución básica, excluidos los conceptos que tengan su origen en la antigüedad». Sin los trienios, la base es 16.000 euros y su 30 por 100 son 4.800 euros: los 5.000 euros del complemento lo superan. Calcular sobre 18.400 euros mete los trienios, que el artículo excluye. El 35 por 100 no es el porcentaje de la Ley. Decir que nunca cabe compatibilidad ignora la excepción del propio artículo 16.4."
  citation: "art. 16.4 Ley 53/1984"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-11719-art-93
- id: m01-l07-q0058
  prompt:
    es: "Según el artículo 93.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes es la responsabilidad de quienes inducen a otros a cometer una falta disciplinaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La misma responsabilidad en que incurren quienes realizan esos actos o conductas."
  - id: b
    text:
      es: "La de una falta de grado inmediatamente inferior al de la falta cometida."
  - id: c
    text:
      es: "Ninguna, salvo que participen ellos mismos en la ejecución de los actos."
  - id: d
    text:
      es: "La misma responsabilidad, pero solo si la falta inducida es muy grave."
  explanation:
    es: "Quienes inducen a otros a cometer una falta «incurrirán en la misma responsabilidad que éstos». El artículo no rebaja la falta un grado ni exige que el inductor participe en la ejecución. Tampoco limita la regla a las faltas muy graves: vale para cualquier falta disciplinaria."
  citation: "art. 93.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-93
- id: m01-l07-q0059
  prompt:
    es: "De acuerdo con el artículo 93.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, incurren en responsabilidad quienes encubran:"
  options:
  - id: a
    correct: true
    text:
      es: "Las faltas consumadas muy graves o graves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: b
    text:
      es: "Las faltas consumadas de cualquier clase, incluidas las leves, cuando de ello se derive daño grave para la Administración o los ciudadanos."
  - id: c
    text:
      es: "Las faltas consumadas muy graves o graves, aunque de ello no se derive daño alguno para la Administración."
  - id: d
    text:
      es: "Las faltas muy graves, consumadas o intentadas, cuando de ello se derive un daño para los ciudadanos."
  explanation:
    es: "El artículo 93.3 exige dos cosas: que la falta encubierta sea consumada y muy grave o grave, y que del encubrimiento «se derive daño grave para la Administración o los ciudadanos». Encubrir una falta leve no entra. Sin daño grave tampoco hay responsabilidad. La falta intentada no figura: el texto habla de faltas consumadas."
  citation: "art. 93.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
