# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0002
  prompt:
    es: "Según el artículo 5.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién concede el plazo para subsanar la falta de acreditación de la representación, y de cuántos días es como regla?"
  options:
  - id: a
    text:
      es: "La oficina de registro, que debe conceder diez días al efecto."
  - id: b
    text:
      es: "El órgano administrativo, que debe conceder un mes al efecto."
  - id: c
    text:
      es: "El superior jerárquico del instructor, que debe conceder tres días."
  - id: d
    correct: true
    text:
      es: "El órgano administrativo, que debe conceder diez días al efecto."
  explanation:
    es: "El artículo 5.6 LPAC habla del «plazo de diez días que deberá conceder al efecto el órgano administrativo». Lo concede el órgano que tramita, no la oficina de registro ni el superior jerárquico del instructor. El plazo de la regla es de diez días, no de un mes ni de tres días."
  citation: "art. 5.6 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0006
  prompt:
    es: "Señale la actuación en nombre de otra persona para la que debe acreditarse la representación, según el artículo 5.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Interponer recursos."
  - id: b
    text:
      es: "Realizar gestiones de mero trámite."
  - id: c
    text:
      es: "Consultar el estado de un expediente."
  - id: d
    text:
      es: "Pedir cita previa."
  explanation:
    es: "El artículo 5.3 exige acreditar la representación para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Para los actos y gestiones de mero trámite, como consultar un expediente o pedir cita, la representación se presume."
  citation: "art. 5.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la acreditación de la representación es correcta, conforme al artículo 5.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Puede hacerse por cualquier medio válido en Derecho que deje constancia fidedigna de su existencia."
  - id: b
    text:
      es: "Solo puede hacerse mediante escritura pública otorgada ante notario."
  - id: c
    text:
      es: "Solo puede hacerse mediante apoderamiento apud acta ante un funcionario."
  - id: d
    text:
      es: "Debe hacerse siempre mediante inscripción previa en el registro electrónico de apoderamientos."
  explanation:
    es: "El artículo 5.4 admite cualquier medio válido en Derecho que deje constancia fidedigna de la representación. La escritura notarial, el apoderamiento apud acta y la inscripción en el registro electrónico de apoderamientos son medios válidos, pero la ley no obliga a usar uno solo de ellos."
  citation: "art. 5.4 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-3
- id: m02-l03-q0009
  prompt:
    es: "Conforme al artículo 3.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los menores de edad tienen capacidad de obrar para los derechos cuya actuación permita el ordenamiento sin la asistencia de:"
  options:
  - id: a
    text:
      es: "El Ministerio Fiscal, en todo caso."
  - id: b
    text:
      es: "Un Abogado designado por el órgano."
  - id: c
    correct: true
    text:
      es: "Quien ejerza la patria potestad, tutela o curatela."
  - id: d
    text:
      es: "Un representante legal designado por el órgano que tramite el procedimiento."
  explanation:
    es: "El artículo 3.b) reconoce capacidad de obrar a los menores para los derechos e intereses cuya actuación esté permitida sin la asistencia de quien ejerza la patria potestad, tutela o curatela. No se requiere la intervención del Ministerio Fiscal, de un Abogado ni de un representante designado por el órgano."
  citation: "art. 3.b) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-3
- id: m02-l03-q0010
  prompt:
    es: "¿Cuál de las siguientes normas determina la capacidad de obrar de las personas físicas o jurídicas ante las Administraciones Públicas, conforme al artículo 3.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Las normas del Derecho penal."
  - id: b
    correct: true
    text:
      es: "Las normas del Derecho civil."
  - id: c
    text:
      es: "Las normas del Derecho mercantil."
  - id: d
    text:
      es: "Las normas del Derecho administrativo."
  explanation:
    es: "El artículo 3.a) da capacidad de obrar ante las Administraciones a las personas físicas o jurídicas que la ostenten con arreglo a las normas civiles. Las normas del Derecho penal, mercantil y administrativo no son la referencia que fija ese apartado, aunque el interesado actúe ante una Administración."
  citation: "art. 3.a) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-11
- id: m02-l03-q0011
  prompt:
    es: "¿Cuál de las siguientes actuaciones exige a los interesados el uso obligatorio de firma, conforme al artículo 11.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Ver el expediente."
  - id: b
    text:
      es: "Aportar documentos en el trámite de audiencia."
  - id: c
    correct: true
    text:
      es: "Interponer recursos."
  - id: d
    text:
      es: "Consultar el estado de su procedimiento en la sede electrónica."
  explanation:
    es: "El artículo 11.2 exige firma para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Ver el expediente, aportar documentos en la audiencia y consultar el estado del procedimiento en la sede electrónica no figuran en esa lista, y para ellos basta acreditar la identidad, como dice el artículo 11.1."
  citation: "art. 11.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-3
- id: m02-l03-q0068
  prompt:
    es: "Según el artículo 3.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo tienen capacidad de obrar ante las Administraciones Públicas los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos?"
  options:
  - id: a
    text:
      es: "Cuando así lo autorice el órgano que tramite el procedimiento."
  - id: b
    text:
      es: "Cuando así lo acuerden sus miembros por unanimidad."
  - id: c
    text:
      es: "Cuando hayan sido reconocidos por una resolución administrativa previa."
  - id: d
    correct: true
    text:
      es: "Cuando la Ley así lo declare expresamente."
  explanation:
    es: "El artículo 3.c) condiciona su capacidad de obrar a que la Ley lo declare expresamente. Ni la autorización del órgano que tramita, ni el acuerdo unánime de sus miembros, ni un reconocimiento administrativo previo la otorgan: la fuente es siempre la Ley."
  citation: "art. 3.c) LPAC"
  difficulty: 1
  tags:
  - "capacidad"
  - "condición"
# anchor: boe-a-2015-10565-art-4
- id: m02-l03-q0069
  prompt:
    es: "Conforme al artículo 4.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, se consideran interesados en el procedimiento administrativo quienes lo promuevan como titulares de:"
  options:
  - id: a
    text:
      es: "derechos subjetivos, con exclusión de los intereses legítimos colectivos."
  - id: b
    text:
      es: "intereses legítimos individuales, con exclusión de los colectivos."
  - id: c
    correct: true
    text:
      es: "derechos o intereses legítimos individuales o colectivos."
  - id: d
    text:
      es: "derechos reconocidos previamente por resolución firme."
  explanation:
    es: "El artículo 4.1.a) incluye a quienes promueven el procedimiento como titulares de derechos o intereses legítimos, individuales o colectivos. Excluir los intereses colectivos, o limitarse a los derechos subjetivos, recorta el texto, y exigir un reconocimiento previo por resolución firme añade un requisito que la norma no contiene."
  citation: "art. 4.1.a) LPAC"
  difficulty: 1
  tags:
  - "concepto"
  - "interesado"
# anchor: boe-a-2015-10565-art-4
- id: m02-l03-q0071
  prompt:
    es: "De acuerdo con el artículo 4.1.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son interesados aquellos cuyos intereses legítimos puedan resultar afectados por la resolución, si se personan en el procedimiento:"
  options:
  - id: a
    text:
      es: "dentro de los diez días siguientes a la notificación de la iniciación."
  - id: b
    correct: true
    text:
      es: "en tanto no haya recaído resolución definitiva."
  - id: c
    text:
      es: "hasta que se dicte la propuesta de resolución."
  - id: d
    text:
      es: "antes del trámite de audiencia a los interesados."
  explanation:
    es: "El artículo 4.1.c) permite personarse mientras no haya recaído resolución definitiva. No lo limita a diez días desde la iniciación, ni a la propuesta de resolución, ni al trámite de audiencia, momentos anteriores a la resolución definitiva que la ley no fija como tope."
  citation: "art. 4.1.c) LPAC"
  difficulty: 1
  tags:
  - "interesado"
  - "plazo"
# anchor: boe-a-2015-10565-art-4
- id: m02-l03-q0072
  prompt:
    es: "Según el artículo 4.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué términos son titulares de intereses legítimos colectivos las asociaciones y organizaciones representativas de intereses económicos y sociales?"
  options:
  - id: a
    correct: true
    text:
      es: "En los términos que la Ley reconozca."
  - id: b
    text:
      es: "En los términos que fijen sus propios estatutos."
  - id: c
    text:
      es: "En los términos que determine el órgano que tramite el procedimiento."
  - id: d
    text:
      es: "En los términos que acuerden sus asociados en asamblea."
  explanation:
    es: "El artículo 4.2 remite a la Ley: lo son en los términos que esta reconozca. Ni los estatutos, ni el órgano que tramita, ni la asamblea de asociados pueden atribuirles esa titularidad."
  citation: "art. 4.2 LPAC"
  difficulty: 1
  tags:
  - "interesado"
  - "fuente"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0074
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados con capacidad de obrar pueden actuar por medio de representante, y las actuaciones administrativas se entienden con este:"
  options:
  - id: a
    text:
      es: "en todo caso, sin que el interesado pueda manifestar lo contrario."
  - id: b
    text:
      es: "salvo que la Administración considere necesaria la comparecencia del interesado."
  - id: c
    correct: true
    text:
      es: "salvo manifestación expresa en contra del interesado."
  - id: d
    text:
      es: "siempre que el representante esté colegiado como abogado o procurador."
  explanation:
    es: "El artículo 5.1 establece una sola salvedad: la manifestación expresa en contra del interesado. Por eso no puede decirse que no quepa manifestar lo contrario, ni que la Administración pueda exigir la comparecencia del interesado a su criterio, ni que el representante deba ser abogado o procurador."
  citation: "art. 5.1 LPAC"
  difficulty: 1
  tags:
  - "representación"
  - "condición"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0076
  prompt:
    es: "Conforme al artículo 5.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la actuación en nombre de otra persona para la que NO debe acreditarse la representación, porque se presume:"
  options:
  - id: a
    text:
      es: "Formular solicitudes."
  - id: b
    correct: true
    text:
      es: "Los actos y gestiones de mero trámite."
  - id: c
    text:
      es: "Presentar declaraciones responsables o comunicaciones."
  - id: d
    text:
      es: "Desistir de acciones y renunciar a derechos."
  explanation:
    es: "Para los actos y gestiones de mero trámite el artículo 5.3 presume la representación. En cambio debe acreditarse para formular solicitudes, para presentar declaraciones responsables o comunicaciones, y para desistir de acciones y renunciar a derechos, además de para interponer recursos."
  citation: "art. 5.3 LPAC"
  difficulty: 2
  tags:
  - "representación"
  - "negativa"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0077
  prompt:
    es: "De acuerdo con el artículo 5.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, para los actos y gestiones de mero trámite realizados en nombre de otra persona, la representación:"
  options:
  - id: a
    correct: true
    text:
      es: "se presume."
  - id: b
    text:
      es: "debe acreditarse en todo caso, igual que para formular solicitudes."
  - id: c
    text:
      es: "debe acreditarse solo si lo pide expresamente el interesado."
  - id: d
    text:
      es: "se presume solo cuando el representante es abogado o procurador."
  explanation:
    es: "El artículo 5.3 presume la representación en los actos y gestiones de mero trámite. Exigir su acreditación siempre equipara esos actos a los que sí la exigen, subordinarla a que lo pida el interesado inventa una condición, y limitar la presunción a abogados o procuradores restringe una regla que no distingue por profesión."
  citation: "art. 5.3 LPAC"
  difficulty: 1
  tags:
  - "representación"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0079
  prompt:
    es: "El miércoles 11 de marzo de 2026 se notifica a don Mateo un requerimiento para acreditar la representación con la que actuó por su hermana. Se le concede el plazo de diez días del artículo 5.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en marzo. ¿Cuándo vence el plazo?"
  options:
  - id: a
    text:
      es: "El sábado 21 de marzo de 2026."
  - id: b
    text:
      es: "El lunes 23 de marzo de 2026."
  - id: c
    text:
      es: "El martes 24 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "El miércoles 25 de marzo de 2026."
  explanation:
    es: "Los diez días del artículo 5.6 son hábiles (artículo 30.2) y se cuentan desde el día siguiente a la notificación (artículo 30.3): del jueves 12 al viernes 13 son dos, del lunes 16 al viernes 20 son siete y el lunes 23, martes 24 y miércoles 25 completan diez. El sábado 21 sale de contar diez días naturales. El lunes 23 sale de esos mismos días naturales prorrogados por acabar en sábado, y tampoco procede. El martes 24 resulta de contar el día de la notificación como primero."
  citation: "art. 5.6 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0080
  prompt:
    es: "Según el artículo 5.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si falta o es insuficiente la acreditación de la representación, el órgano concede diez días para subsanar el defecto, o un plazo superior:"
  options:
  - id: a
    text:
      es: "cuando lo solicite el representante dentro de los cinco primeros días."
  - id: b
    text:
      es: "cuando el interesado resida fuera de la localidad del órgano."
  - id: c
    correct: true
    text:
      es: "cuando las circunstancias del caso así lo requieran."
  - id: d
    text:
      es: "cuando la representación se hubiera otorgado apud acta."
  explanation:
    es: "El artículo 5.6 admite un plazo superior a diez días cuando las circunstancias del caso lo requieran, criterio general que decide el órgano. No exige que lo pida el representante en los cinco primeros días, ni limita la ampliación a quien reside fuera de la localidad, ni la liga a que el poder sea apud acta."
  citation: "art. 5.6 LPAC"
  difficulty: 1
  tags:
  - "representación"
  - "plazo"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0082
  prompt:
    es: "Conforme al artículo 5.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la habilitación general o específica que las Administraciones Públicas pueden dar a personas físicas o jurídicas autorizadas se refiere a la realización de determinadas:"
  options:
  - id: a
    correct: true
    text:
      es: "transacciones electrónicas en representación de los interesados."
  - id: b
    text:
      es: "notificaciones postales en nombre de los interesados."
  - id: c
    text:
      es: "inscripciones en el registro de apoderamientos por cuenta de la Administración."
  - id: d
    text:
      es: "actuaciones de inspección en representación de la Administración."
  explanation:
    es: "El artículo 5.7 prevé la habilitación para determinadas transacciones electrónicas en representación de los interesados. No se trata de notificaciones postales, ni de inscribir poderes en el registro por cuenta de la Administración, ni de actuaciones de inspección, que son de la propia Administración y no de los representantes."
  citation: "art. 5.7 LPAC"
  difficulty: 1
  tags:
  - "representación"
  - "habilitación"
# anchor: boe-a-2015-10565-art-5
- id: m02-l03-q0083
  prompt:
    es: "Según el artículo 5.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, aunque la Administración haya habilitado a un representante para determinadas transacciones electrónicas, ¿qué puede hacer siempre el interesado?"
  options:
  - id: a
    correct: true
    text:
      es: "Comparecer por sí mismo en el procedimiento."
  - id: b
    text:
      es: "Revocar la habilitación con efectos retroactivos."
  - id: c
    text:
      es: "Exigir que sea la Administración quien acredite la representación."
  - id: d
    text:
      es: "Designar a otro habilitado sin comunicarlo al órgano."
  explanation:
    es: "El artículo 5.7 cierra diciendo que siempre podrá comparecer el interesado por sí mismo en el procedimiento. La norma no habla de revocar con efectos retroactivos, ni traslada a la Administración la carga de acreditar la representación (que, al contrario, puede requerirla en cualquier momento), ni permite designar a otro habilitado sin comunicarlo."
  citation: "art. 5.7 LPAC"
  difficulty: 1
  tags:
  - "representación"
  - "habilitación"
