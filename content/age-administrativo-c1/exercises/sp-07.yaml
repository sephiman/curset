type: case
title:
  es: "El mantenimiento del sistema informático de la MUFACE"
scenario:
  es: "La Mutualidad General de Funcionarias y Funcionarios Civiles del Estado (MUFACE), organismo autónomo adscrito al Ministerio para la Transformación Digital y de la Función Pública, está en Madrid. Son festivos el 1 de noviembre. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027. Ningún otro festivo afecta a los plazos.\n\nDoña Pilar Arnal Gimeno, funcionaria de carrera del Ministerio de Hacienda, presenta el lunes, 11 de enero de 2027, en el registro de su Ministerio una solicitud de ayuda, que entra en el registro electrónico de esta el jueves, 14 de enero de 2027. Doña Pilar ha elegido recibir notificaciones por medios electrónicos. El martes, 2 de febrero de 2027, se pone a su disposición el trámite de audiencia en la sede electrónica y ella no accede a su contenido.\n\nA Don Mateo Lasheras Ortiz se le notifica el lunes, 22 de febrero de 2027, que tiene diez días hábiles para aportar un informe médico indispensable para resolver su solicitud. Pide en plazo una ampliación. No lo aporta y el jueves, 18 de marzo de 2027, accede en la sede electrónica a la advertencia de que el procedimiento está paralizado por su causa.\n\nLa Mutualidad licita por procedimiento abierto un contrato de servicios de mantenimiento informático, desde el viernes, 1 de octubre de 2027, hasta el domingo, 30 de septiembre de 2029, con una prórroga posible de un año y valor estimado de 165.000 euros. Don Julián Tello Ruiz, funcionario de la Mutualidad, que valora las ofertas técnicas el lunes, 18 de enero de 2027, prestó servicios profesionales a Infosoporte Central, S.A., licitadora, hasta el miércoles, 30 de abril de 2025. El martes, 9 de febrero de 2027, se notifica la adjudicación a Soluciones Informáticas Ebro, S.L., y a Infosoporte Central, S.A., que quedó segunda.\n\nDoña Elena Ortigosa Ferrer, funcionaria de carrera del Ministerio de Trabajo y Economía Social y mutualista, con más de seis meses cotizados, está en incapacidad temporal desde el lunes, 4 de enero de 2027. Don Sergio Bernal Lacruz, funcionario de carrera del Ministerio de Hacienda, recibe el miércoles, 8 de septiembre de 2027, la notificación de su excedencia voluntaria por interés particular. Don Rubén Sarasa Pina, del Cuerpo de Gestión, tiene un expediente disciplinario cuya Instructora es Doña Teresa Giménez Cebrián, del Cuerpo General Administrativo. Doña Irene Lafuente Roca, funcionaria, pasa a excedencia por cuidado de su hijo. Doña Carmen Esteban Lorente, funcionaria, tiene pendientes las vacaciones de 2025. La Mutualidad convoca un concurso para un puesto de Jefe de Sección.\n\nEl Estado se compromete de forma firme a aportar este año 600.000 euros a la Mutualidad para un gasto conjunto, aún no ingresados. La Mutualidad incorpora a 2027 el remanente de un crédito extraordinario concedido por ley en diciembre de 2026. Tiene establecido el sistema de anticipos de caja fija, y quiere tramitar un libramiento por una factura de 480 euros de material de oficina. El expediente de un contrato de suministro entra en la Intervención Delegada el miércoles, 20 de octubre de 2027, con tramitación urgente, y el reparo que formula lo recibe la Mutualidad el miércoles, 27 de octubre de 2027, sin aceptarlo.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-21
- id: q01
  lesson: m03-l03
  prompt:
    es: "Si la norma reguladora no fija plazo máximo y el plazo no se suspende, conforme al artículo 21 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede la Mutualidad resolver y notificar la solicitud de Doña Pilar?"
  options:
  - id: a
    text:
      es: "El lunes, 12 de abril de 2027."
  - id: b
    text:
      es: "El martes, 13 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 14 de abril de 2027."
  - id: d
    text:
      es: "El miércoles, 14 de julio de 2027."
  explanation:
    es: "Si la norma reguladora no fija el plazo máximo, este es de tres meses, y en los procedimientos iniciados a solicitud se cuenta desde que la solicitud entra en el registro electrónico del organismo competente para tramitarla. La solicitud entró en el registro de la Mutualidad el jueves, 14 de enero de 2027. Los tres meses terminan el mismo día del mes de vencimiento, el miércoles, 14 de abril de 2027, que es día hábil. La fecha del lunes, 12 de abril de 2027, parte de la presentación en el registro del Ministerio de Hacienda y pasa al lunes el domingo en que acabaría. La del martes, 13 de abril de 2027, cuenta el día de entrada como primero. La del miércoles, 14 de julio de 2027, aplica los seis meses, que son el tope de la norma reguladora y no el plazo supletorio."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-43
- id: q02
  lesson: m02-l03
  prompt:
    es: "¿En qué fecha se entiende rechazada la notificación electrónica del trámite de audiencia que Doña Pilar no abre en la sede electrónica de la Mutualidad?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes, 12 de febrero de 2027."
  - id: b
    text:
      es: "El jueves, 11 de febrero de 2027."
  - id: c
    text:
      es: "El martes, 16 de febrero de 2027."
  - id: d
    text:
      es: "El miércoles, 17 de febrero de 2027."
  explanation:
    es: "Una notificación electrónica elegida por el interesado se entiende rechazada cuando pasan diez días naturales desde su puesta a disposición sin acceder a su contenido. La puesta a disposición fue el martes, 2 de febrero de 2027, y los diez días naturales, del 3 al 12 de febrero, terminan el viernes, 12 de febrero de 2027. La fecha del jueves, 11 de febrero de 2027, cuenta el día de la puesta a disposición como primero. La del martes, 16 de febrero de 2027, cuenta diez días hábiles, que no es el cómputo de este precepto. La del miércoles, 17 de febrero de 2027, aplica quince días."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: q24
  lesson: m03-l03
  prompt:
    es: "¿Hasta qué fecha, como máximo y contando días hábiles, puede ampliarse el plazo que Don Mateo tiene para aportar el informe médico?"
  options:
  - id: a
    text:
      es: "El viernes, 12 de marzo de 2027."
  - id: b
    text:
      es: "El martes, 23 de marzo de 2027."
  - id: c
    text:
      es: "El lunes, 8 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 15 de marzo de 2027."
  explanation:
    es: "La Administración puede ampliar un plazo, si se pide antes de que venza, en no más de la mitad de su duración. Los diez días hábiles empiezan el martes, 23 de febrero de 2027, y vencen el lunes, 8 de marzo de 2027; la mitad son cinco días hábiles más, que terminan el lunes, 15 de marzo de 2027. La fecha del viernes, 12 de marzo de 2027, cuenta el mismo día del vencimiento como primero de la ampliación. La del martes, 23 de marzo de 2027, duplica el plazo con diez días hábiles más, sin contar el viernes, 19 de marzo, festivo en Madrid. La del lunes, 8 de marzo de 2027, es el vencimiento sin ampliación."
  citation: "art. 32.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-95
- id: q04
  lesson: m03-l03
  prompt:
    es: "Paralizado el procedimiento de Don Mateo por causa que le es imputable, la Mutualidad le advierte de que caducará si no reanuda la tramitación. Si no realiza las actividades necesarias, el plazo de caducidad termina:"
  options:
  - id: a
    text:
      es: "El jueves, 17 de junio de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 18 de junio de 2027."
  - id: c
    text:
      es: "El miércoles, 16 de junio de 2027."
  - id: d
    text:
      es: "El lunes, 24 de mayo de 2027."
  explanation:
    es: "Si el procedimiento iniciado a solicitud se paraliza por causa imputable al interesado, la Administración le advierte de que, transcurridos tres meses, se producirá la caducidad. Los tres meses cuentan desde el día siguiente al del acceso a la notificación, el jueves, 18 de marzo de 2027, y terminan el mismo día del mes de vencimiento, el viernes, 18 de junio de 2027. La fecha del jueves, 17 de junio de 2027, cuenta el día del acceso como primero. La del miércoles, 16 de junio de 2027, cuenta noventa días naturales. La del lunes, 24 de mayo de 2027, parte de la notificación del plazo para aportar el informe, que no es la advertencia."
  citation: "art. 95.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10566-art-23
- id: q05
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 23 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿debe abstenerse Don Julián Tello Ruiz de valorar las ofertas técnicas de la licitación?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque prestó servicios profesionales a una de las licitadoras en los dos últimos años."
  - id: b
    text:
      es: "No, porque la causa exige una relación de servicio vigente con la empresa licitadora."
  - id: c
    text:
      es: "No, porque solo debe abstenerse quien administra la sociedad licitadora, no quien le prestó servicios."
  - id: d
    text:
      es: "Sí, pero solo si la licitadora resulta adjudicataria del contrato de mantenimiento."
  explanation:
    es: "Es motivo de abstención tener relación de servicio con la persona interesada directamente en el asunto o haberle prestado en los dos últimos años servicios profesionales de cualquier tipo. Don Julián prestó servicios a Infosoporte Central, S.A., que licita, hasta el miércoles, 30 de abril de 2025, y valora las ofertas el lunes, 18 de enero de 2027, menos de dos años después. No hace falta una relación de servicio vigente: la causa alcanza también a quien prestó servicios profesionales en los dos últimos años. Administrar la sociedad es otro motivo distinto, y tampoco importa quién resulte adjudicatario."
  citation: "art. 23.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2017-12902-art-159
- id: q06
  lesson: m03-l04
  prompt:
    es: "¿Podía la Mutualidad tramitar el contrato de mantenimiento informático por el procedimiento abierto simplificado, dada la cuantía de su valor estimado?"
  options:
  - id: a
    text:
      es: "Sí, porque el límite del abierto simplificado en servicios es de 216.000 euros de valor estimado."
  - id: b
    text:
      es: "Sí, porque en suministros y servicios el límite es de 2.000.000 de euros de valor estimado."
  - id: c
    correct: true
    text:
      es: "No, porque su valor estimado no es inferior a 140.000 euros, límite de los organismos autónomos."
  - id: d
    text:
      es: "No, porque solo cabe en contratos de servicios con un valor estimado inferior a 100.000 euros."
  explanation:
    es: "El abierto simplificado exige, en servicios, un valor estimado inferior a la cantidad del artículo 22.1.a) de la Ley 9/2017, que es de 140.000 euros cuando adjudica la Administración General del Estado o uno de sus organismos autónomos, como la Mutualidad. El valor estimado del contrato, 165.000 euros, no cumple esa condición. Los 216.000 euros son el límite de las demás entidades del sector público; los 2.000.000 de euros, el de las obras; y los 100.000 euros son el umbral del recurso especial, no el del abierto simplificado."
  citation: "art. 159.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2017-12902-art-153
- id: q23
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 153.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si nadie recurre la adjudicación y Soluciones Informáticas Ebro, S.L., recibe el jueves, 4 de marzo de 2027, el requerimiento para formalizar, ¿cuál es la última fecha que puede señalarle el requerimiento?"
  options:
  - id: a
    text:
      es: "El jueves, 11 de marzo de 2027."
  - id: b
    text:
      es: "El lunes, 8 de marzo de 2027."
  - id: c
    text:
      es: "El jueves, 18 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 9 de marzo de 2027."
  explanation:
    es: "Transcurrido el plazo del recurso especial sin que se interponga, los servicios del órgano de contratación requieren al adjudicatario para que formalice el contrato en un plazo no superior a cinco días a contar desde el siguiente a la recepción del requerimiento (art. 153.3 LCSP). Los plazos por días de la LCSP son naturales salvo que diga que son hábiles, y aquí no lo dice (disposición adicional duodécima LCSP). Desde el viernes, 5 de marzo de 2027, cinco días naturales llegan al martes, 9 de marzo de 2027, día hábil. La fecha del jueves, 11 de marzo de 2027, cuenta cinco días hábiles. La del lunes, 8 de marzo de 2027, cuenta el día de la recepción como primero. La del jueves, 18 de marzo de 2027, aplica los diez días hábiles que tiene el licitador para presentar la documentación (art. 150.2 LCSP), que no regulan este requerimiento."
  citation: "art. 153.3 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-29
- id: q08
  lesson: m03-l04
  prompt:
    es: "Si el pliego no fija un preaviso mayor que el legal, ¿cuál es el último día en que la Mutualidad puede preavisar la prórroga del contrato de mantenimiento para que obligue a la empresa adjudicataria?"
  options:
  - id: a
    text:
      es: "El miércoles, 1 de agosto de 2029."
  - id: b
    text:
      es: "El jueves, 30 de agosto de 2029."
  - id: c
    text:
      es: "El sábado, 30 de junio de 2029."
  - id: d
    correct: true
    text:
      es: "El lunes, 30 de julio de 2029."
  explanation:
    es: "La prórroga obliga al empresario si el órgano de contratación la preavisa al menos con dos meses de antelación a la finalización del contrato, salvo que el pliego fije un plazo mayor. El contrato termina el domingo, 30 de septiembre de 2029, y dos meses antes es el lunes, 30 de julio de 2029. La fecha del miércoles, 1 de agosto de 2029, cuenta sesenta días naturales hacia atrás. La del jueves, 30 de agosto de 2029, cuenta un solo mes. La del sábado, 30 de junio de 2029, exige tres meses, que ni la ley ni el pliego piden."
  citation: "art. 29.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2000-12140-art-21
- id: q09
  lesson: m04-l07
  prompt:
    es: "En el tercer mes de licencia de Doña Elena, sus retribuciones básicas, con la sexta parte de una paga extraordinaria, suman 1.500 euros y las complementarias, 2.100 euros. ¿Qué cuantía mensual tiene su subsidio por incapacidad temporal desde el cuarto mes?"
  options:
  - id: a
    correct: true
    text:
      es: "El subsidio es de 1.575 euros al mes."
  - id: b
    text:
      es: "El subsidio es de 1.200 euros al mes."
  - id: c
    text:
      es: "El subsidio es de 1.680 euros al mes."
  - id: d
    text:
      es: "El subsidio es de 1.125 euros al mes."
  explanation:
    es: "Desde el cuarto mes el subsidio a cargo de la MUFACE es la mayor de dos cantidades: el 80 por ciento de las retribuciones básicas, con la sexta parte de una paga extraordinaria, del tercer mes, o el 75 por ciento de las retribuciones complementarias de ese mes. El 80 por ciento de 1.500 euros son 1.200 euros y el 75 por ciento de 2.100 euros son 1.575 euros; se abona la mayor, 1.575 euros, fija e invariable mientras dure la incapacidad. Los 1.200 euros salen solo del 80 por ciento de las básicas; los 1.680 euros aplican el 80 por ciento a las complementarias; los 1.125 euros aplican el 75 por ciento a las básicas."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-89
- id: q22
  lesson: m04-l04
  prompt:
    es: "Conforme al artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué efectos tiene la excedencia voluntaria de Don Sergio sobre sus retribuciones y sobre el cómputo de ese tiempo?"
  options:
  - id: a
    text:
      es: "Percibe las retribuciones básicas, pero el tiempo no se computa para ascensos, trienios ni Seguridad Social."
  - id: b
    text:
      es: "No devenga retribuciones, pero el tiempo se computa a efectos de trienios y derechos de Seguridad Social."
  - id: c
    correct: true
    text:
      es: "No devenga retribuciones ni se le computa el tiempo para ascensos, trienios y Seguridad Social."
  - id: d
    text:
      es: "No devenga retribuciones, pero se le reserva el puesto dos años y el tiempo se computa a efectos de antigüedad."
  explanation:
    es: "Quien está en excedencia voluntaria por interés particular no devenga retribuciones, y el tiempo en esa situación no se le computa a efectos de ascensos, trienios ni derechos en el régimen de Seguridad Social (art. 89.2 TREBEP). Don Sergio queda así sin sueldo y sin cómputo. Percibir las retribuciones básicas contradice la falta de devengo. Computar el tiempo para trienios y Seguridad Social contradice la exclusión de ambos. La reserva del puesto durante dos años y el cómputo para antigüedad son efectos de la excedencia por cuidado de familiares, no de esta."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-7527-art-10
- id: q11
  lesson: m04-l07
  prompt:
    es: "La excedencia de Don Sergio tiene efectos desde el viernes, 1 de octubre de 2027. ¿Hasta qué fecha puede ejercer ante la MUFACE la opción de mantenerse como mutualista voluntario?"
  options:
  - id: a
    text:
      es: "El viernes, 8 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 2 de noviembre de 2027."
  - id: c
    text:
      es: "El lunes, 1 de noviembre de 2027."
  - id: d
    text:
      es: "El domingo, 31 de octubre de 2027."
  explanation:
    es: "La opción se ejerce ante la MUFACE en el plazo de un mes desde la recepción de la notificación de la excedencia voluntaria o desde su fecha de efectos, si esta es posterior. Don Sergio recibió la notificación el miércoles, 8 de septiembre de 2027, y los efectos empiezan después, el viernes, 1 de octubre de 2027, así que el mes cuenta desde el día siguiente al 1 de octubre. Termina el mismo día del mes de vencimiento, el lunes, 1 de noviembre de 2027, festivo en toda España, y pasa al primer día hábil, el martes, 2 de noviembre de 2027. La fecha del viernes, 8 de octubre de 2027, parte de la recepción. La del lunes, 1 de noviembre de 2027, no pasa al día hábil. La del domingo, 31 de octubre de 2027, cuenta treinta días y tampoco es hábil."
  citation: "art. 10.3 RD 375/2003"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1986-1216-art-30
- id: q12
  lesson: m04-l06
  prompt:
    es: "En el expediente disciplinario de Don Rubén, conforme al Real Decreto 33/1986, de 10 de enero, por el que se aprueba el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, señale la respuesta correcta sobre el nombramiento de Doña Teresa como Instructora:"
  options:
  - id: a
    text:
      es: "Es válido, porque basta con que sea funcionaria de carrera de la propia Mutualidad."
  - id: b
    text:
      es: "Es válido, siempre que el Subsecretario autorice su nombramiento como Instructora del expediente."
  - id: c
    text:
      es: "No es válido, porque la Instructora debe pertenecer a un Departamento distinto al de Don Rubén."
  - id: d
    correct: true
    text:
      es: "No es válido, porque la Instructora debe ser de un cuerpo o escala de igual o superior grupo."
  explanation:
    es: "En la resolución que incoa el procedimiento se nombra un Instructor que debe ser funcionario de un cuerpo o escala de igual o superior grupo al del inculpado. Doña Teresa es del Cuerpo General Administrativo, de grupo inferior al del Cuerpo de Gestión de Don Rubén, y no puede ser Instructora. No basta con ser funcionaria de la propia Mutualidad: falta el grupo. La autorización del Subsecretario se exige solo si el Instructor depende de otro Departamento, y nada obliga a que dependa de uno distinto."
  citation: "art. 30 RD 33/1986"
  difficulty: 1
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2015-11719-art-89
- id: q13
  lesson: m04-l04
  prompt:
    es: "Conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, señale la respuesta correcta sobre la reserva del puesto de Doña Irene durante su excedencia por cuidado de hijo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se reserva al menos durante dos años y después se reserva un puesto de la misma localidad y de igual retribución."
  - id: b
    text:
      es: "Se reserva durante los seis primeros meses y después un puesto de la misma localidad y de igual retribución."
  - id: c
    text:
      es: "Se reserva durante el primer año de excedencia, sin reserva de ningún puesto después."
  - id: d
    text:
      es: "Se reserva durante los tres años de la excedencia, siempre el mismo puesto de trabajo."
  explanation:
    es: "Quien está en excedencia por cuidado de un hijo tiene reservado el puesto de trabajo al menos durante dos años; transcurrido ese periodo, la reserva lo es a un puesto de la misma localidad y de igual retribución. El tiempo computa además a efectos de trienios, carrera y Seguridad Social. Los seis primeros meses de reserva son los de la excedencia por violencia de género. No existe una reserva de un solo año sin puesto después, ni una reserva del mismo puesto durante los tres años que puede durar la excedencia."
  citation: "art. 89.4 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-11719-art-50
- id: q14
  lesson: m04-l05
  prompt:
    es: "Doña Carmen Esteban Lorente estuvo en incapacidad temporal desde el martes, 4 de noviembre de 2025, hasta el viernes, 27 de febrero de 2026, y no pudo empezar sus vacaciones de 2025. ¿Hasta qué fecha puede disfrutarlas?"
  options:
  - id: a
    text:
      es: "El jueves, 31 de diciembre de 2026."
  - id: b
    text:
      es: "El martes, 4 de mayo de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 30 de junio de 2027."
  - id: d
    text:
      es: "El viernes, 27 de agosto de 2027."
  explanation:
    es: "Si la incapacidad temporal impide iniciar las vacaciones dentro del año natural al que corresponden, se pueden disfrutar siempre que no hayan pasado más de dieciocho meses desde el final del año en que se originaron. Las vacaciones de 2025 se originaron en 2025, que acabó el miércoles, 31 de diciembre de 2025; sumados dieciocho meses, el límite es el miércoles, 30 de junio de 2027. La fecha del jueves, 31 de diciembre de 2026, cuenta solo doce meses. La del martes, 4 de mayo de 2027, cuenta dieciocho meses desde el inicio de la incapacidad. La del viernes, 27 de agosto de 2027, los cuenta desde su fin."
  citation: "art. 50.2 TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-47
- id: q15
