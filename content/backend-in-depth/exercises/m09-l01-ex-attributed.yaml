variants:
- id: m09-l01-qa01
  prompt:
    en: According to Chris Jones and his co-authors in Chapter 4 - Service Level Objectives, which statement about
      service level agreements does the chapter make?
  options:
  - id: a
    correct: true
    text:
      en: An SLA is a contract with users that has consequences for the SLOs
  - id: b
    text:
      en: An SLA is an internal target that carries no consequence when it is missed
  - id: c
    text:
      en: SRE typically leads the construction of SLAs, since they are technical targets
  - id: d
    text:
      en: Google Search has a public SLA that covers every user of the service
  explanation:
    en: The chapter's authors write that SLAs are service level agreements, an explicit or implicit contract with
      users that includes consequences of meeting or missing the SLOs they contain. They write that where there
      is no explicit consequence you are almost certainly looking at an SLO, which contradicts an SLA with no consequence.
      They write that SRE does not typically get involved in constructing SLAs because they are tied to business
      and product decisions, which contradicts SRE leading them. They write that Google Search does not have an
      SLA for the public, which contradicts a public SLA.
  citation: sre-book-slo#agreements-q8sZhAcV
  extract:
    en: an explicit or implicit contract with your users that includes consequences of meeting (or missing) the
      SLOs they contain
- id: m09-l01-qa02
  prompt:
    en: According to Chris Jones and his co-authors in Chapter 4 - Service Level Objectives, which statement about
      service level indicators does the chapter make?
  options:
  - id: a
    text:
      en: Server-side latency is generally more user-relevant than client-side latency
  - id: b
    correct: true
    text:
      en: Sometimes only a proxy for the desired measure is available
  - id: c
    text:
      en: Near-100% availability is rarely achievable in practice
  - id: d
    text:
      en: Availability counts malformed requests among those that succeed
  explanation:
    en: The chapter's authors write that sometimes only a proxy is available because the desired measure may be
      hard to obtain or interpret. They write that client-side latency is often the more user-relevant metric, which
      contradicts server-side latency being more relevant. They write that near-100% availability is often readily
      achievable, which contradicts calling it rarely achievable. They write that availability is often defined
      as the fraction of well-formed requests that succeed, which contradicts counting malformed requests.
  citation: sre-book-slo#indicators-o8seIAcZ
  extract:
    en: sometimes only a proxy is available because the desired measure may be hard to obtain or interpret
- id: m09-l01-qa04
  prompt:
    en: According to Steven Thurgood and David Ferguson in Chapter 2 - Implementing SLOs, which statement about
      reliability targets for a service does the chapter make?
  options:
  - id: a
    text:
      en: Each extra nine adds steadily more marginal utility for customers
  - id: b
    correct: true
    text:
      en: A 100% reliability target is the wrong choice for an SLO
  - id: c
    text:
      en: An SLO of 100% leaves plenty of time for proactive engineering work
  - id: d
    text:
      en: The number one source of outages is hardware failure, not change
  explanation:
    en: Thurgood and Ferguson write that their experience has shown 100% reliability is the wrong target. They write
      that each extra nine comes at an increased cost while the marginal utility to customers steadily approaches
      zero, which contradicts steadily growing utility. They write that an SLO of 100% means you only have time
      to be reactive, which contradicts plenty of proactive time. They write that the number one source of outages
      is change, which contradicts hardware failure.
  citation: sre-workbook-implementing-slos#reliability-targets-and-error-budgets
  extract:
    en: Our experience has shown that 100% reliability is the wrong target
- id: m09-l01-qa05
  prompt:
    en: According to Rob Ewaschuk in Chapter 6 - Monitoring Distributed Systems, which statement about monitoring
      latency and its distribution does the chapter make?
  options:
  - id: a
    text:
      en: CPU and database use is balanced, so a mean describes it well
  - id: b
    text:
      en: Collecting actual latencies is the simplest way to separate a slow average from a slow tail
  - id: c
    correct: true
    text:
      en: An average latency of 100 ms can hide 1% of requests taking 5 seconds
  - id: d
    text:
      en: One backend's 99th percentile rarely shows up in a frontend's median response
  explanation:
    en: Ewaschuk writes that a web service with an average latency of 100 ms at 1,000 requests per second might
      easily have 1% of requests taking 5 seconds. He writes that CPUs and databases can easily be utilized in a
      very imbalanced way, which contradicts balanced use that a mean describes well. He writes that the simplest
      way to tell a slow average from a very slow tail is to collect request counts bucketed by latency rather than
      actual latencies, which contradicts collecting actual latencies. He writes that the 99th percentile of one
      backend can easily become the median response of the frontend, which contradicts it rarely showing up.
  citation: sre-book-monitoring#worrying-about-your-tail-or-instrumentation-and-performance-Yms9Ck
  extract:
    en: If you run a web service with an average latency of 100 ms at 1,000 requests per second, 1% of requests
      might easily take 5 seconds.
- id: m09-l01-qa06
  prompt:
    en: According to Rob Ewaschuk in Chapter 6 - Monitoring Distributed Systems, which statement about the four
      golden signals of monitoring does the chapter make?
  options:
  - id: a
    correct: true
    text:
      en: The golden signals are latency, traffic, errors and saturation
  - id: b
    text:
      en: The latency of failed requests should be filtered out of overall latency
  - id: c
    text:
      en: A slow error is less harmful than a fast error for users
  - id: d
    text:
      en: Traffic for a web service is usually measured as CPU utilization
  explanation:
    en: Ewaschuk writes that the four golden signals of monitoring are latency, traffic, errors and saturation.
      He writes that it is important to track error latency as opposed to just filtering out errors, which contradicts
      filtering failed requests out. He writes that a slow error is even worse than a fast error, which contradicts
      a slow error being less harmful. He writes that for a web service traffic is usually HTTP requests per second,
      which contradicts CPU utilization.
  citation: sre-book-monitoring#xref_monitoring_golden-signals
  extract:
    en: The four golden signals of monitoring are latency, traffic, errors, and saturation.
