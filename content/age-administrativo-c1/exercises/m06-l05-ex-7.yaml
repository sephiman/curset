      es: "0"
  - id: d
    correct: true
    text:
      es: "3"
  explanation:
    es: "CONTARA cuenta el texto vacío (\"\"): si el rango contiene una fórmula que devuelve una cadena vacía, la cuenta. Por tanto cuenta las tres celdas."
