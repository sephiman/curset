# SPDX-License-Identifier: AGPL-3.0-only
# age-auxiliar-c2 course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/age-auxiliar-course-requirements.md (a delta to the C1 requirements). Programme:
# sources/programa.md (Anexo I, BOE-A-2025-26262). Module mNN is bloque NN of the programme (01 = I, 02 = II) and
# lesson mNN-lMM its tema MM, so ids follow the official numbering. Block «Proceso de selección» sits before the
# programme: m00 is the exam, ps the psicotécnicos (not a bloque, so it takes no number and keeps mNN = bloque NN).
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are placeholders until round R2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: age-auxiliar-c2
  title:
    es: Auxiliar Administrativo del Estado (C2)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: Ingreso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Auxiliar de la Administración del Estado, ingreso libre, resumido tema a
      tema, con preguntas tipo test y psicotécnicos como los del examen.
  languages: [es]
  status: draft
  # psicotécnico joins this list once platform delta section L adds the generated item type (R6.2); until then
  # the schema knows only the stored multiple-choice kind.
  exercise_types: [quiz]
  # «Por tema» instead of «Por lección» in results and stats.
  lesson_noun:
    es: tema
  # Questions are practised per tema from its «Practicar» page; the lessons embed none.
  lesson_practice: true
  option_labels: letters
  # The PDF exports theory only: questions stay on the practice and exam pages.
  pdf_exercises: false
  # glyph / color: left for the identity round (docs/identity.md; R2.2 of the course requirements), with a glyph
  # distinct from C1's in the same family. No figures: this course has no figures/ tree.
blocks:
- id: block-a
  title:
    es: Proceso de selección
  modules:
  - id: m00
    title:
      es: El examen
    summary:
      es: Las reglas del ejercicio único de la convocatoria.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el examen
      summary:
        es: El ejercicio único tiene dos partes, dura noventa minutos y cada error resta un tercio de acierto. La
          puntuación directa de cada parte se transforma en una calificación de 0 a 50, con 25 en la nota de corte.
          La lección da las notas de corte que fijó la Comisión en 2025.
  - id: ps
    title:
      es: Psicotécnicos
    summary:
      es: Los tipos de pregunta psicotécnica de la primera parte.
    lessons:
    - id: ps-l01
      title:
        es: Cómo son los psicotécnicos
      summary:
        es: Las 30 preguntas psicotécnicas de la primera parte se agrupan en 16 tipos, sacados de los cuestionarios
          del Auxiliar de 2020 a 2025. Cada tipo lleva una pregunta oficial resuelta, con su clave.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización pública
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m01-l01
      title:
        es: La Constitución Española de 1978. Características. Los principios constitucionales y los valores superiores.
          Derechos y deberes fundamentales. Su garantía y suspensión.
      summary:
        es: Resumen pendiente.
    - id: m01-l02
      title:
        es: 'El Tribunal Constitucional. La reforma de la Constitución. La Corona: funciones constitucionales del Rey.
          Sucesión y regencia.'
      summary:
        es: Resumen pendiente.
    - id: m01-l03
      title:
        es: 'Las Cortes Generales: composición, atribuciones y funcionamiento del Congreso de los Diputados y Senado. El
          Defensor del Pueblo.'
      summary:
        es: Resumen pendiente.
    - id: m01-l04
      title:
        es: El Poder Judicial. El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial española.
      summary:
        es: Resumen pendiente.
    - id: m01-l05
      title:
        es: El Gobierno y la Administración. El Presidente del Gobierno. El Consejo de Ministros. Designación, causas de
          cese y responsabilidad del Gobierno.
      summary:
        es: Resumen pendiente.
    - id: m01-l06
      title:
        es: 'El Gobierno Abierto: concepto y principios informadores. La Agenda 2030 y los Objetivos de Desarrollo Sostenible.'
      summary:
        es: Resumen pendiente.
    - id: m01-l07
      title:
        es: La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno.
      summary:
        es: Resumen pendiente.
    - id: m01-l08
      title:
        es: La Administración General del Estado. Órganos centrales. Órganos superiores y órganos directivos. Órganos territoriales.
          Otros órganos administrativos. La Administración del Estado en el exterior.
      summary:
        es: Resumen pendiente.
    - id: m01-l09
      title:
        es: 'La Organización territorial del Estado. Las Comunidades Autónomas: Constitución y distribución de competencias
          entre el Estado y las Comunidades Autónomas. La Administración local: entidades que la integran. La provincia,
          el municipio y la isla.'
      summary:
        es: Resumen pendiente.
    - id: m01-l10
      title:
        es: La organización de la Unión Europea. El Consejo Europeo, el Consejo, el Parlamento Europeo, la Comisión Europea
          y el Tribunal de Justicia de la Unión Europea.
      summary:
        es: Resumen pendiente.
    - id: m01-l11
      title:
        es: 'Las Leyes del Procedimiento Administrativo Común de las Administraciones Públicas y del Régimen Jurídico del
          Sector Público. El procedimiento administrativo común y sus fases. La revisión de los actos en vía administrativa:
          revisión de oficio y recursos administrativos. El recurso contencioso-administrativo. Actividad administrativa
          impugnable. Las partes: capacidad, legitimación, representación y defensa.'
      summary:
        es: Resumen pendiente.
    - id: m01-l12
      title:
        es: 'La protección de datos personales y su régimen jurídico: principios, derechos y obligaciones.'
      summary:
        es: Resumen pendiente.
    - id: m01-l13
      title:
        es: 'El personal funcionario al servicio de las Administraciones públicas: concepto y clases. Régimen jurídico.
          El Registro Central de Personal. Programación de efectivos y Oferta de Empleo Público. Selección. Provisión de
          puestos de trabajo. Situaciones administrativas de los funcionarios.'
      summary:
        es: Resumen pendiente.
    - id: m01-l14
      title:
        es: Derechos y deberes de los funcionarios. La carrera administrativa. Promoción interna. El sistema de retribuciones
          e indemnizaciones. Régimen disciplinario. El régimen de la Seguridad Social de los funcionarios.
      summary:
        es: Resumen pendiente.
    - id: m01-l15
      title:
        es: El presupuesto del Estado en España. Contenido, elaboración y estructura. Fases del ciclo presupuestario.
      summary:
        es: Resumen pendiente.
    - id: m01-l16
      title:
        es: 'Políticas de igualdad y contra la violencia de género. Políticas de igualdad de trato y no discriminación
          de las personas LGTBI. Discapacidad y dependencia: régimen jurídico.'
      summary:
        es: Resumen pendiente.
  - id: m02
    title:
      es: Actividad administrativa y ofimática
    summary:
      es: Resumen pendiente.
    lessons:
    - id: m02-l01
      title:
        es: 'Atención al público: acogida e información al ciudadano. Atención de personas con discapacidad.'
      summary:
        es: Resumen pendiente.
    - id: m02-l02
      title:
        es: Los servicios de información administrativa. Información general y particular al ciudadano. Iniciativas. Reclamaciones.
          Quejas. Peticiones.
      summary:
        es: Resumen pendiente.
    - id: m02-l03
      title:
        es: Concepto de documento, registro y archivo. Funciones del registro y del archivo. Clases de archivo y criterios
          de ordenación.
      summary:
        es: Resumen pendiente.
    - id: m02-l04
      title:
        es: Administración electrónica y servicios al ciudadano. La información administrativa. Análisis de principales
          páginas web de carácter público. Servicios telemáticos. Oficinas integradas de atención al ciudadano. Ventanilla
          única empresarial. El Punto de Acceso General de la Administración General del Estado.
      summary:
        es: Resumen pendiente.
    - id: m02-l05
      title:
        es: 'Informática básica: conceptos fundamentales sobre el hardware y el software. Sistemas de almacenamiento de
          datos. Sistemas operativos. Nociones básicas de seguridad informática.'
      summary:
        es: Resumen pendiente.
    - id: m02-l06
      title:
        es: 'Introducción al sistema operativo: el entorno Windows. Fundamentos. Trabajo en el entorno gráfico de Windows:
          ventanas, iconos, menús contextuales, cuadros de diálogo. El escritorio y sus elementos. El menú inicio. Copilot.'
      summary:
        es: Resumen pendiente.
    - id: m02-l07
      title:
        es: El explorador de Windows. Gestión de carpetas y archivos. Operaciones de búsqueda. Herramientas «Este equipo»
          y «Acceso rápido». Accesorios. Herramientas del sistema.
      summary:
        es: Resumen pendiente.
    - id: m02-l08
      title:
        es: 'Procesadores de texto: Word 365. Principales funciones y utilidades. Creación y estructuración del documento.
          Gestión, grabación, recuperación e impresión de ficheros. Personalización del entorno de trabajo.'
      summary:
        es: Resumen pendiente.
    - id: m02-l09
      title:
        es: 'Hojas de cálculo: Excel 365. Principales funciones y utilidades. Libros, hojas y celdas. Configuración. Introducción
          y edición de datos. Fórmulas y funciones. Gráficos. Gestión de datos. Personalización del entorno de trabajo.'
      summary:
        es: Resumen pendiente.
    - id: m02-l10
      title:
        es: 'Bases de datos: Access 365. Principales funciones y utilidades. Tablas. Consultas. Formularios. Informes.
          Relaciones. Importación, vinculación y exportación de datos.'
      summary:
        es: Resumen pendiente.
    - id: m02-l11
      title:
        es: 'Correo electrónico: Outlook 365. Conceptos elementales y funcionamiento. El entorno de trabajo. Enviar, recibir,
          responder y reenviar mensajes. Creación de mensajes. Reglas de mensaje. Libreta de direcciones.'
      summary:
        es: Resumen pendiente.
    - id: m02-l12
      title:
        es: 'La Red Internet: origen, evolución y estado actual. Conceptos elementales sobre protocolos y servicios en
          Internet. Funcionalidades básicas de los navegadores web.'
      summary:
        es: Resumen pendiente.
# exams: not declared yet. The presets need a bank to draw from (the load fails when a pool cannot supply a
# preset) and part 1 mixes stored questions with generated psicotécnico items, which is platform delta section L.
# R7.1 of the course requirements, scored per R7.2 (sources/programa.md: Anexo I 2.3 and the CPS notes):
# - «Simulacro oficial»: 90 minutes for both parts, pause never, tema labels hidden, option letters A–D. Part 1:
#   60 questions (30 from m01 + 30 generated psicotécnicos in the type weights of the last official exam) + 5
#   reserve. Part 2: 50 questions from m02 + 5 reserve, graded only if part 1 reaches its minimum. A wrong answer
#   costs 1/3, a blank nothing; each part 0–50, pass 25, CPS transformation with the 2025 cut-offs of the
#   sistema general as exact fractions: part 1 minimum_raw 29, part 2 minimum_raw 64/3 (printed 21,33); 0–100.
# - «Parte 1» and «Parte 2» alone, with the same counts, reserve and scoring.
# - «Bloque N» per bloque (m01, m02) and «Tema» per tema.
# - «Psicotécnicos»: 30 generated items in the official type weights, timed as the exam's share.
# - The official-exam sets (2025 A/B, 2024 A/B, 2024 extraordinario, 2022, OEP 2020 and its extraordinario), real
#   psicotécnico questions included, from docs/age-c2-official-exams-ledger.md.
