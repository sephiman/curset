- id: m02-l11-q123
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con un mensaje que no es de nadie de la lista de remitentes seguros cuando el nivel de protección es Solo listas seguras?"
  options:
  - id: a
    text:
      es: "Se elimina permanentemente sin revisarlo"
  - id: b
    correct: true
    text:
      es: "Se clasifica como correo no deseado"
  - id: c
    text:
      es: "Se conserva en la Bandeja de entrada"
  - id: d
    text:
      es: "Se evalúa solo con la lista de remitentes bloqueados"
  explanation:
    es: "Con Solo listas seguras, cualquier mensaje que no sea de un remitente de la lista segura se clasifica como correo no deseado. Conservarlo en la Bandeja de entrada contradice esa frase. Eliminarlo permanentemente exige activar otra casilla, Eliminar permanentemente los mensajes sospechosos. Evaluarlo solo con la lista de remitentes bloqueados es lo que ocurre con Sin filtrado automático."
