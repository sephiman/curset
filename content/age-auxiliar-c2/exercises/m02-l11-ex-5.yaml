# anchor: fuente-ms-outlook-panel-lectura-html
- id: m02-l11-q205
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica cuántas líneas de cada mensaje puede mostrar la Vista previa del mensaje en la lista, junto con el remitente y el asunto?"
  options:
  - id: a
    correct: true
    text:
      es: "De una a tres"
  - id: b
    text:
      es: "De dos a cuatro"
  - id: c
    text:
      es: "De una a cinco"
  - id: d
    text:
      es: "Solo una"
  explanation:
    es: "La Vista previa del mensaje permite mostrar entre una y tres líneas de cada mensaje, junto con el nombre del remitente y el asunto. De una a cinco, solo una y de dos a cuatro no coinciden con ese intervalo de la página."
  citation: "fuente: `ms-outlook-panel-lectura.html`; «Mostrar una vista previa de mensaje en la lista de mensajes de Outlook clásico»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-ignorar-html
- id: m02-l11-q207
  prompt:
    es: "¿Cuál de los siguientes comandos del grupo Eliminar de la pestaña Inicio de Outlook 365 clásico quita todos los mensajes de una conversación y manda los futuros a Elementos eliminados?"
  options:
  - id: a
    text:
      es: "Dejar de ignorar"
  - id: b
    correct: true
    text:
      es: "Ignorar"
  - id: c
    text:
      es: "Bloquear"
  - id: d
    text:
      es: "Limpiar"
  explanation:
    es: "Ignorar, en el grupo Eliminar de la pestaña Inicio, quita la conversación y desvía los mensajes futuros a Elementos eliminados. Limpiar elimina solo los mensajes redundantes de una conversación o carpeta. Bloquear lleva a las opciones de correo electrónico no deseado. Dejar de ignorar hace lo contrario: devuelve la conversación a la Bandeja de entrada."
  citation: "fuente: `ms-outlook-ignorar.html`; «Ignorar una conversación»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-ignorar-html
- id: m02-l11-q208
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes condiciones debe cumplirse para poder recuperar una conversación ignorada?"
  options:
  - id: a
    text:
      es: "Solo si se vuelve a activar la Vista de conversación con Mostrar como Conversaciones."
  - id: b
    text:
      es: "En cualquier momento, desde la Bandeja de entrada."
  - id: c
    text:
      es: "Solo si se activó antes la opción Mostrar mensajes de otras carpetas."
  - id: d
    correct: true
    text:
      es: "Solo si todavía está disponible en la carpeta Elementos eliminados."
  explanation:
    es: "Una conversación ignorada solo se puede recuperar si todavía está en Elementos eliminados. Desde la Bandeja de entrada no, porque los mensajes ignorados ya no están allí. Mostrar mensajes de otras carpetas es una opción de conversación que añade a la vista los mensajes movidos y los enviados, y no recupera nada. Mostrar como Conversaciones solo activa o desactiva la vista de conversación."
  citation: "fuente: `ms-outlook-ignorar.html`; «Dejar de ignorar una conversación»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-ignorar-html
- id: m02-l11-q209
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones de Inicio › Eliminar › Ignorar se selecciona para que una conversación ignorada vuelva a la Bandeja de entrada?"
  options:
  - id: a
    correct: true
    text:
      es: "Dejar de ignorar la conversación"
  - id: b
    text:
      es: "Ignorar conversación"
  - id: c
    text:
      es: "Mostrar como Conversaciones"
  - id: d
    text:
      es: "Limpiar conversación"
  explanation:
    es: "En la carpeta Elementos eliminados se selecciona la conversación, y con Ignorar se elige Dejar de ignorar la conversación; los mensajes futuros llegan de nuevo a la Bandeja de entrada. Ignorar conversación es el comando que la ignora. Limpiar conversación elimina mensajes redundantes de la conversación actual. Mostrar como Conversaciones, en la pestaña Ver, activa o desactiva la vista de conversación."
  citation: "fuente: `ms-outlook-ignorar.html`; «Dejar de ignorar una conversación»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-ignorar-html
- id: m02-l11-q210
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes definiciones corresponde a una conversación de correo, es decir, a un hilo de mensajes?"
  options:
  - id: a
    correct: true
    text:
      es: "La cadena de mensajes con el mismo asunto, del primero a todas las respuestas."
  - id: b
    text:
      es: "Los mensajes de una carpeta que tienen la misma fecha de recepción."
  - id: c
    text:
      es: "Un mensaje y sus datos adjuntos, agrupados con el mismo remitente."
  - id: d
    text:
      es: "Todos los mensajes que ha enviado una misma persona durante un día, aunque tengan asuntos distintos."
  explanation:
    es: "Una conversación es la cadena completa de mensajes, del primero a todas las respuestas, y todos tienen el mismo tema, lo que se conoce como hilo de correo. Agrupar por remitente y día no es lo que define la página: lo que une a los mensajes es el asunto. Un mensaje con sus adjuntos no es una cadena de respuestas. La fecha de recepción tampoco agrupa los mensajes de una conversación."
  citation: "fuente: `ms-outlook-ignorar.html`; «Ignorar todos los mensajes de correo electrónico en una conversación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-conversacion-html
- id: m02-l11-q211
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica cómo se ordenan los mensajes dentro de cada conversación en la vista Conversación?"
  options:
  - id: a
    text:
      es: "Por remitente, en orden alfabético."
  - id: b
    correct: true
    text:
      es: "El más reciente primero, sin posibilidad de cambiar este criterio."
  - id: c
    text:
      es: "El más reciente primero, aunque se puede cambiar en Ver › Configuración de conversación."
  - id: d
    text:
      es: "El más antiguo primero, sin posibilidad de cambiar este criterio."
  explanation:
    es: "Dentro de cada conversación, los mensajes se ordenan con el más reciente primero y la página dice que no se puede cambiar este criterio. El más antiguo primero invierte el orden. El orden alfabético por remitente no existe: Mostrar remitentes encima del asunto solo cambia lo que se muestra en la parte superior. Cambiar el criterio desde Configuración de conversación contradice la frase que dice que no se puede."
  citation: "fuente: `ms-outlook-conversacion.html`; «Usar la vista Conversación en Outlook clásico»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-conversacion-html
- id: m02-l11-q213
  prompt:
    es: "En la lista de mensajes de Outlook 365 clásico, ¿cómo se señala una conversación que incluye mensajes no leídos?"
  options:
  - id: a
    text:
      es: "Con la conversación expandida de forma permanente."
  - id: b
    correct: true
    text:
      es: "Con el asunto en negrita y el número de mensajes no leídos junto a él."
  - id: c
    text:
      es: "Con el asunto en cursiva y un icono triangular a su izquierda."
  - id: d
    text:
      es: "Con un signo de exclamación rojo junto al asunto, como en los mensajes de importancia alta."
  explanation:
    es: "Una conversación con mensajes no leídos tiene el asunto en negrita y el número de no leídos junto al asunto. El signo de exclamación rojo lo ve el destinatario de un mensaje enviado con importancia alta. El icono triangular indica cualquier conversación con varios mensajes, para expandirla o contraerla, y no su estado de lectura. Expandir siempre la conversación es una opción de conversación aplicable solo a la seleccionada en ese momento."
  citation: "fuente: `ms-outlook-conversacion.html`; «Usar la vista Conversación en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-conversacion-html
- id: m02-l11-q214
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones de conversación muestra también los mensajes movidos a otras carpetas y los enviados que están en Elementos enviados?"
  options:
  - id: a
    text:
      es: "Usar la vista con sangría clásica"
  - id: b
    correct: true
    text:
      es: "Mostrar mensajes de otras carpetas"
  - id: c
    text:
      es: "Expandir siempre la conversación seleccionada"
  - id: d
    text:
      es: "Mostrar remitentes encima del asunto"
  explanation:
    es: "Mostrar mensajes de otras carpetas añade a la conversación los mensajes movidos a otras carpetas y los enviados guardados en Elementos enviados. Mostrar remitentes encima del asunto cambia solo el texto que encabeza la conversación. Expandir siempre la conversación seleccionada mantiene abierta la que está elegida. La vista con sangría clásica sangra los mensajes según su posición en la conversación."
  citation: "fuente: `ms-outlook-conversacion.html`; «Cambiar las opciones de conversación en Outlook clásico»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-conversacion-html
- id: m02-l11-q215
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones de organización de mensajes evita que los correos se agrupen por conversación?"
  options:
  - id: a
    text:
      es: "Agrupar mensajes por ramas dentro de las conversaciones"
  - id: b
    correct: true
    text:
      es: "No agrupar mensajes"
  - id: c
    text:
      es: "Agrupar mensajes por conversación"
  - id: d
    text:
      es: "Mostrar como Conversaciones"
  explanation:
    es: "No agrupar mensajes impide que los correos se agrupen por conversación. Agrupar mensajes por conversación es la opción que los agrupa. Agrupar mensajes por ramas dentro de las conversaciones los muestra como ramas dentro de cada conversación, así que sigue agrupando. Mostrar como Conversaciones es el comando de la pestaña Ver de Outlook clásico, no una opción del nuevo Outlook."
  citation: "fuente: `ms-outlook-conversacion.html`; «Ver mensajes agrupados por conversación en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-barra-todo-html
- id: m02-l11-q216
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que ocurre con una tarea creada arrastrando un mensaje al icono Tareas si después se elimina el mensaje original?"
  options:
  - id: a
    text:
      es: "La tarea desaparece de la lista de tareas y de la vista Tareas."
  - id: b
    text:
      es: "La tarea se convierte en una nota con el asunto del mensaje."
  - id: c
    correct: true
    text:
      es: "La tarea sigue disponible, con el contenido copiado."
  - id: d
    text:
      es: "La tarea pasa a Elementos eliminados junto con el mensaje."
  explanation:
    es: "Al crear una tarea desde un mensaje, la tarea es independiente: si se elimina el mensaje, la tarea sigue disponible con el contenido copiado. Que desaparezca es lo que ocurre con un mensaje marcado, que no crea una tarea independiente. Convertirse en nota no figura en la página. Pasar a Elementos eliminados tampoco: la tarea no depende del mensaje."
  citation: "fuente: `ms-outlook-barra-todo.html`; «Crear una tarea a partir de un mensaje frente a marcar el mensaje»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-barra-todo-html
- id: m02-l11-q217
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica cómo se agrega un mensaje como datos adjuntos a una nueva tarea en lugar de pegar su texto en el cuerpo?"
  options:
  - id: a
    text:
      es: "Arrastrándolo con el botón izquierdo a la pestaña Tareas pendientes del panel Mi día."
  - id: b
    text:
      es: "Marcándolo para seguimiento, con lo que se crea una tarea independiente."
  - id: c
    text:
      es: "Creando una regla con el botón derecho que mueva el mensaje a la carpeta Tareas y lo adjunte."
  - id: d
    correct: true
    text:
      es: "Botón derecho, arrastrar a la lista de tareas y Copiar aquí como tarea con datos adjuntos."
  explanation:
    es: "Para adjuntar el elemento se hace clic con el botón derecho, se arrastra a la lista de tareas y se elige Copiar aquí como tarea con datos adjuntos. Marcar un mensaje no crea una tarea independiente: solo aparece en la lista de To-Do mientras exista el mensaje. La pestaña Tareas pendientes del panel Mi día es el destino del arrastre en el nuevo Outlook. Una regla actúa sola sobre el correo que llega, no crea tareas con adjuntos."
  citation: "fuente: `ms-outlook-barra-todo.html`; «Crear una tarea desde un elemento de Outlook»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-barra-todo-html
- id: m02-l11-q219
  prompt:
    es: "¿Cuál de los siguientes métodos abreviados de teclado crea una tarea nueva en Outlook 365 clásico configurado en español?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+K"
  - id: b
    text:
      es: "Ctrl+Mayús+M"
  - id: c
    text:
      es: "Ctrl+Mayús+A"
  - id: d
    text:
      es: "Ctrl+Mayús+N"
  explanation:
    es: "Ctrl+Mayús+K crea una tarea. Ctrl+Mayús+A crea una cita. Ctrl+Mayús+N crea una nota. Ctrl+Mayús+M crea un mensaje desde cualquier vista de Outlook."
  citation: "fuente: `ms-outlook-barra-todo.html`; «Crear una tarea»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-barra-todo-html
- id: m02-l11-q220
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe con acierto lo que es la barra de To-Do?"
  options:
  - id: a
    text:
      es: "Un panel a la izquierda con los iconos de Correo, Calendario, People y To Do."
  - id: b
    correct: true
    text:
      es: "Un panel estrecho a la derecha con eventos, tareas o contactos del calendario a la vista."
  - id: c
    text:
      es: "El panel con la lista de carpetas de cada buzón."
  - id: d
    text:
      es: "El panel que muestra el contenido del mensaje que se selecciona en la lista de mensajes de la carpeta."
  explanation:
    es: "La barra de To-Do es un panel estrecho en el lado derecho de Outlook que mantiene a la vista eventos, tareas o contactos del calendario. El panel de navegación con los iconos de las vistas está a la izquierda. El panel de lectura muestra el mensaje seleccionado. El panel de carpetas lista las carpetas, y es otro panel entre los que se desplaza con Ctrl+Mayús+Tab."
  citation: "fuente: `ms-outlook-barra-todo.html`; «Crear y ver tareas con la Barra de Tareas Pendientes en Outlook clásico»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-version-html
- id: m02-l11-q226
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones enumera las pestañas que muestra la cinta de opciones al abrirlo?"
  options:
  - id: a
    text:
      es: "Archivo, Inicio, Enviar y recibir, Carpeta y Vista"
  - id: b
    text:
      es: "Inicio, Mensaje, Opciones y Ayuda"
  - id: c
    text:
      es: "Inicio, Calendario, People y To Do"
  - id: d
    correct: true
    text:
      es: "Inicio, Ver y Ayuda"
  explanation:
    es: "Al abrir el nuevo Outlook, la cinta muestra Inicio, Ver y Ayuda, y Configuración está en el encabezado de navegación. Archivo, Inicio, Enviar y recibir, Carpeta y Vista son las pestañas de la cinta de Outlook clásico. Mensaje y Opciones son pestañas de la ventana de un mensaje, no de la cinta principal. Calendario, People y To Do son vistas del panel lateral, no pestañas de la cinta."
  citation: "fuente: `ms-outlook-version.html`; «Nuevo Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-version-html
- id: m02-l11-q227
  prompt:
    es: "En Outlook clásico para Windows, ¿cuál de las siguientes rutas muestra la versión y el número de compilación del producto?"
  options:
  - id: a
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: b
    correct: true
    text:
      es: "Archivo › Cuenta de Office, en Información del producto"
  - id: c
    text:
      es: "Configuración › General › Acerca de Outlook"
  - id: d
    text:
      es: "Vista › Configuración de vista › Columnas"
  explanation:
    es: "En Outlook clásico se elige Archivo y Cuenta de Office, y la versión y la compilación salen en Información del producto. Configuración › General › Acerca de Outlook es la ruta del nuevo Outlook. Vista › Configuración de vista › Columnas sirve para agregar columnas, como Mención, a la lista de mensajes. Archivo › Herramientas › Limpieza de buzón muestra el tamaño del buzón y de sus carpetas."
  citation: "fuente: `ms-outlook-version.html`; «Comprobar qué versión de Outlook clásico usa»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q236
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda de proyect, con la concordancia de prefijos?"
  options:
  - id: a
    text:
      es: "Solo mensajes que contengan exactamente la palabra proyect."
  - id: b
    text:
      es: "Solo mensajes cuyo remitente se llame proyect."
  - id: c
    text:
      es: "Solo mensajes que contengan proyect en el asunto."
  - id: d
    correct: true
    text:
      es: "Mensajes con proyecto, proyectos, proyector o proyectar en el remitente, el asunto, el cuerpo o los adjuntos."
  explanation:
    es: "Con la concordancia de prefijos, proyect devuelve los mensajes con proyecto, proyectos, proyector, proyectar y similares en cualquier parte del nombre del remitente, el asunto, el cuerpo o los adjuntos. La palabra exacta proyect contradice la concordancia de prefijos, que amplía la búsqueda a las palabras que empiezan así. Limitarla al asunto o al remitente contradice la página, que la extiende a todos esos lugares."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q237
  prompt:
    es: "En Outlook 365, ¿qué ocurre al buscar 9810 con la intención de encontrar un mensaje que contiene 98101?"
  options:
  - id: a
    text:
      es: "Se encuentra el mensaje, pero solo si está entre los primeros 1000 resultados."
  - id: b
    correct: true
    text:
      es: "Ningún resultado, porque se omiten los números de menos de cinco dígitos."
  - id: c
    text:
      es: "Se encuentra el mensaje, porque la búsqueda actúa por prefijos."
  - id: d
    text:
      es: "Se encuentra el mensaje solo si se escribe entre comillas dobles."
  explanation:
    es: "Las cadenas de números de menos de cinco dígitos se omiten, así que 9810 no devuelve nada aunque el mensaje contenga 98101. La coincidencia por prefijos se aplica a las palabras, pero no salva esa regla de los números. Las comillas dobles sirven para buscar una frase exacta, no para activar números cortos. El límite de los primeros 1000 resultados es otra regla, que solo recorta las listas largas."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q238
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda miguel O tórrez, con el operador en mayúsculas, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Los elementos con miguel, pero no los que contienen tórrez."
  - id: b
    text:
      es: "Solo los elementos que contienen miguel y tórrez a la vez."
  - id: c
    correct: true
    text:
      es: "Los elementos con miguel, los que tienen tórrez o los que contienen ambos términos."
  - id: d
    text:
      es: "Solo los elementos con la frase exacta miguel tórrez."
  explanation:
    es: "El operador O devuelve los elementos con miguel, los que contienen tórrez o los que tienen ambos términos. Solo los que tienen ambos es el resultado del operador Y. Con miguel pero sin tórrez es el resultado de NO. La frase exacta se busca con comillas dobles alrededor del texto, no con O."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m02-l11-q240
  prompt:
    es: "En Outlook 365 clásico, ¿dónde se guardan los elementos antiguos que se archivan con Autoarchivar, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "En la carpeta Conflictos del buzón."
  - id: b
    correct: true
    text:
      es: "En un archivo de datos de Outlook (.pst) independiente, que se puede abrir desde Outlook."
  - id: c
    text:
      es: "En la carpeta Elementos eliminados del buzón."
  - id: d
    text:
      es: "En un sitio de grupo, en OneDrive o en una carpeta del equipo."
  explanation:
    es: "Los elementos antiguos que se quieren conservar se mueven a un archivo de datos de Outlook (.pst) independiente, que se abre desde Outlook cuando haga falta. Elementos eliminados es la carpeta que se vacía, no un archivo. Conflictos es la carpeta cuyo tamaño se ve y que se puede eliminar. Un sitio de grupo, OneDrive o las carpetas del equipo son los lugares que la página propone para los datos adjuntos que se quieran conservar."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «Procedimientos recomendados para mantener el buzón de correo eficiente»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m02-l11-q241
  prompt:
    es: "En Outlook 365 clásico, ¿qué permite hacer la herramienta Limpieza de buzón con la carpeta Conflictos, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
