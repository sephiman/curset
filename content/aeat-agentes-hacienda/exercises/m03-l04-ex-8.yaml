# anchor: boe-a-2007-15984-art-29
- id: m03-l04-q0226
  prompt:
    es: "De acuerdo con el artículo 29.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los libros registro deben conservarse, salvo lo dispuesto en la normativa tributaria:"
  options:
  - id: a
    correct: true
    text:
      es: "en el domicilio fiscal del obligado tributario."
  - id: b
    text:
      es: "en la sede de la Agencia Estatal de Administración Tributaria correspondiente."
  - id: c
    text:
      es: "en el domicilio social del obligado tributario, aunque no coincida con el fiscal."
  - id: d
    text:
      es: "en el lugar donde se realicen las operaciones anotadas."
  explanation:
    es: "El artículo 29.1 manda conservar los libros registro en el domicilio fiscal del obligado, salvo disposición tributaria en contrario. No se conservan en la Administración, ni en el domicilio social cuando difiere del fiscal, ni en el lugar de las operaciones."
  citation: "art. 29.1 RGAT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1885-6627-art-30
- id: m03-l04-q0228
  prompt:
    es: "¿Qué deben conservar los empresarios durante seis años, a partir del último asiento realizado en los libros, según el artículo 30.1 del Real Decreto de 22 de agosto de 1885 por el que se publica el Código de Comercio?"
  options:
  - id: a
    text:
      es: "Únicamente los libros de contabilidad, sin la correspondencia ni los justificantes."
  - id: b
    text:
      es: "Los libros, la correspondencia y la documentación, pero no los justificantes."
  - id: c
    correct: true
    text:
      es: "Los libros, la correspondencia, la documentación y los justificantes concernientes a su negocio, debidamente ordenados."
  - id: d
    text:
      es: "Los libros y justificantes concernientes a su negocio, sin necesidad de ordenarlos."
  explanation:
    es: "El artículo 30.1 exige conservar libros, correspondencia, documentación y justificantes del negocio, debidamente ordenados, durante seis años desde el último asiento. Quitar la correspondencia, los justificantes o el orden recorta el contenido de la obligación."
  citation: "art. 30.1 Código de Comercio"
  difficulty: 1
  tags:
  - "requisito"
  - "definición"
# anchor: boe-a-1992-28925-art-62
- id: m03-l04-q0229
  prompt:
    es: "¿Qué libros registro del Impuesto sobre el Valor Añadido deben llevar, con carácter general, los empresarios o profesionales y otros sujetos pasivos conforme al artículo 62.1 del Real Decreto 1624/1992, de 29 de diciembre, por el que se aprueba el Reglamento del Impuesto?"
  options:
  - id: a
    text:
      es: "Los de ventas e ingresos, compras y gastos y bienes de inversión."
  - id: b
    text:
      es: "Los de facturas expedidas, facturas recibidas y provisiones de fondos y suplidos."
  - id: c
    text:
      es: "Solo los de facturas expedidas y facturas recibidas, sin los de bienes de inversión."
  - id: d
    correct: true
    text:
      es: "Los de facturas expedidas, facturas recibidas, bienes de inversión y determinadas operaciones intracomunitarias."
  explanation:
    es: "El artículo 62.1 enumera cuatro libros: facturas expedidas, facturas recibidas, bienes de inversión y determinadas operaciones intracomunitarias. Los de ventas e ingresos, compras y gastos y bienes de inversión son los del IRPF para actividades no mercantiles, y el de provisiones de fondos y suplidos es de los profesionales en el IRPF. Tampoco se reducen a dos."
  citation: "art. 62.1 RIVA"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-1992-28925-art-40
- id: m03-l04-q0231
  prompt:
    es: "De acuerdo con el artículo 40.1 del Real Decreto 1624/1992, de 29 de diciembre, por el que se aprueba el Reglamento del Impuesto sobre el Valor Añadido, los sujetos pasivos acogidos al régimen simplificado por actividades cuyos índices o módulos operan sobre el volumen de ingresos llevan, además del libro de facturas recibidas, un libro registro:"
  options:
  - id: a
    text:
      es: "de facturas expedidas por las actividades no acogidas a ese régimen."
  - id: b
    text:
      es: "de bienes de inversión de todas sus actividades."
  - id: c
    correct: true
    text:
      es: "de las operaciones efectuadas en esas actividades."
  - id: d
    text:
      es: "de los índices o módulos aplicados en cada período."
  explanation:
    es: "Cuando los módulos operan sobre el volumen de ingresos, el artículo 40.1 añade un libro registro de las operaciones efectuadas en esas actividades. No es un libro de facturas de otras actividades, ni de bienes de inversión, ni de módulos."
  citation: "art. 40.1 RIVA"
  difficulty: 3
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-1992-28925-art-61
- id: m03-l04-q0232
  prompt:
    es: "De acuerdo con el artículo 61.2 del Real Decreto 1624/1992, de 29 de diciembre, por el que se aprueba el Reglamento del Impuesto sobre el Valor Añadido, los sujetos pasivos a los que sea aplicable el régimen especial del recargo de equivalencia no están obligados, con las excepciones del propio artículo, a llevar:"
  options:
  - id: a
    text:
      es: "el libro registro de facturas expedidas, pero sí el de facturas recibidas."
  - id: b
    text:
      es: "el libro registro de bienes de inversión, pero sí el de facturas recibidas."
  - id: c
    text:
      es: "libros registro, pero sí a conservar las facturas durante seis años."
  - id: d
    correct: true
    text:
      es: "registros contables en relación con el Impuesto sobre el Valor Añadido."
  explanation:
    es: "El artículo 61.2 exime a estos sujetos pasivos de llevar registros contables relacionados con el IVA, salvo las excepciones que enumera. No es una exención parcial de un solo libro, y tampoco se formula como conservación durante seis años."
  citation: "art. 61.2 RIVA"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-1992-28925-art-69-bis
- id: m03-l04-q0233
  prompt:
    es: "De acuerdo con el artículo 69 bis.1 del Real Decreto 1624/1992, de 29 de diciembre, por el que se aprueba el Reglamento del Impuesto sobre el Valor Añadido, las facturas expedidas se suministran en cuatro días naturales desde su expedición, u ocho si las expide el destinatario o un tercero, y en ambos casos:"
  options:
  - id: a
    correct: true
    text:
      es: "antes del día 16 del mes siguiente a aquel en que se hubiera producido el devengo del impuesto."
  - id: b
    text:
      es: "antes del día 16 del mes siguiente a aquel en que se hubiera presentado la declaración-liquidación."
  - id: c
    text:
      es: "antes del día 10 del mes siguiente a aquel en que se hubiera producido el devengo del impuesto."
  - id: d
    text:
      es: "antes del último día del mes siguiente a aquel en que se hubiera producido el devengo del impuesto."
  explanation:
    es: "El artículo 69 bis.1.a) añade, en ambos casos, el límite del día 16 del mes siguiente al devengo. No se mide desde la presentación de la declaración-liquidación, y el día 10 o el último día del mes no son las fechas del precepto."
  citation: "art. 69 bis.1 RIVA"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1992-28925-art-69-bis
- id: m03-l04-q0235
  prompt:
    es: "De acuerdo con el artículo 69 bis.1 del Real Decreto 1624/1992, de 29 de diciembre, por el que se aprueba el Reglamento del Impuesto sobre el Valor Añadido, señale la respuesta CORRECTA sobre el cómputo de los plazos de cuatro u ocho días naturales para el suministro de los registros de facturación:"
  options:
  - id: a
    text:
      es: "Se excluyen únicamente los domingos y los festivos de la localidad del obligado."
  - id: b
    text:
      es: "No se excluye ningún día, porque son días naturales."
  - id: c
    text:
      es: "Se excluyen los sábados, los domingos y todos los días inhábiles, incluidos los festivos autonómicos."
  - id: d
    correct: true
    text:
      es: "Se excluyen los sábados, los domingos y los declarados festivos nacionales."
  explanation:
    es: "Aunque los plazos sean de días naturales, el artículo 69 bis.1 excluye del cómputo los sábados, los domingos y los declarados festivos nacionales. No se excluyen solo los domingos ni los festivos locales, ni se cuentan todos los días, ni se excluyen los autonómicos."
  citation: "art. 69 bis.1 RIVA"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0238
  prompt:
    es: "De acuerdo con el artículo 68.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, los contribuyentes del IRPF están obligados a conservar los justificantes y documentos acreditativos de las operaciones, rentas, gastos, ingresos, reducciones y deducciones que deban constar en sus declaraciones durante:"
  options:
  - id: a
    text:
      es: "seis años a partir del último asiento en los libros."
  - id: b
    text:
      es: "el plazo de cuatro años desde la presentación de la declaración."
  - id: c
    text:
      es: "diez años a partir de la finalización del período impositivo."
  - id: d
    correct: true
    text:
      es: "el plazo máximo de prescripción."
  explanation:
    es: "El artículo 68.1 manda conservar esos justificantes durante el plazo máximo de prescripción. Los seis años desde el último asiento son los del Código de Comercio, y los otros plazos no son los del precepto."
  citation: "art. 68.1 RIRPF"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0239
  prompt:
    es: "De acuerdo con el artículo 68.2 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las obligaciones contables de quienes desarrollan actividades empresariales en la modalidad normal de la estimación directa:"
  options:
  - id: a
    correct: true
    text:
      es: "Están obligados a llevar contabilidad ajustada a lo dispuesto en el Código de Comercio."
  - id: b
    text:
      es: "Están obligados a llevar únicamente los libros registro de ventas e ingresos, compras y gastos y bienes de inversión."
  - id: c
    text:
      es: "Están obligados a llevar los libros registro de ingresos, gastos, bienes de inversión y provisiones de fondos y suplidos."
  - id: d
    text:
      es: "Están obligados a llevar un libro registro de facturas expedidas y otro de facturas recibidas."
  explanation:
    es: "La modalidad normal de la estimación directa exige contabilidad ajustada al Código de Comercio (art. 68.2). Los tres libros registro son los de la actividad no mercantil o la modalidad simplificada, los cuatro con provisiones de fondos y suplidos son los de los profesionales, y los libros de facturas son de IVA."
  citation: "art. 68.2 RIRPF"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0240
  prompt:
    es: "De acuerdo con el artículo 68.10 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, los contribuyentes distintos de los de la modalidad normal de la estimación directa que desarrollan actividades empresariales llevan los libros registro de los apartados anteriores:"
  options:
  - id: a
    text:
      es: "salvo cuando lleven contabilidad ajustada al Código de Comercio."
  - id: b
    correct: true
    text:
      es: "aun cuando lleven contabilidad ajustada al Código de Comercio."
  - id: c
    text:
      es: "solo si no llevan contabilidad ajustada al Código de Comercio."
  - id: d
    text:
      es: "siempre que el órgano competente de la Administración tributaria lo exija."
  explanation:
    es: "El artículo 68.10 obliga a esos contribuyentes a llevar los libros registro aun cuando lleven contabilidad ajustada al Código de Comercio. No los dispensa por llevarla, no los limita a quien no la lleva y no depende de una exigencia de la Administración."
  citation: "art. 68.10 RIRPF"
  difficulty: 3
  tags:
  - "condición"
  - "requisito"
# anchor: boe-a-2007-15984-art-3
- id: m03-l04-q0242
  prompt:
    es: "¿Quiénes forman parte del Censo de Empresarios, Profesionales y Retenedores por efectuar adquisiciones intracomunitarias de bienes según el artículo 3.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "Quienes efectúen adquisiciones intracomunitarias de bienes exentas del IVA actuando como empresarios o profesionales en territorio español."
  - id: b
    correct: true
    text:
      es: "Quienes efectúen adquisiciones intracomunitarias de bienes sujetas al IVA sin actuar como empresarios o profesionales."
  - id: c
    text:
      es: "Quienes efectúen cualquier adquisición de bienes en otro Estado miembro, con independencia de su sujeción al IVA."
  - id: d
    text:
      es: "Quienes efectúen entregas intracomunitarias de bienes sujetas al IVA actuando como empresarios o profesionales."
  explanation:
    es: "El artículo 3.2 incluye en el censo a quienes efectúen adquisiciones intracomunitarias de bienes sujetas al IVA sin actuar como empresarios o profesionales, pues los que actúan como tales ya figuran por sus actividades. No bastan las exentas ni cualquier adquisición, y las entregas no son adquisiciones."
  citation: "art. 3.2 RGAT"
  difficulty: 3
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2007-15984-art-18
- id: m03-l04-q0246
  prompt:
    es: "De acuerdo con el artículo 18.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, las personas físicas y jurídicas, así como los obligados tributarios del artículo 35.4 de la Ley General Tributaria, tienen un número de identificación fiscal para:"
  options:
  - id: a
    text:
      es: "sus relaciones con la Administración tributaria y los órganos jurisdiccionales únicamente."
  - id: b
    text:
      es: "las operaciones por importe superior a 3.000 euros."
  - id: c
    correct: true
    text:
      es: "sus relaciones de naturaleza o con trascendencia tributaria."
  - id: d
    text:
      es: "el ejercicio de actividades empresariales o profesionales."
  explanation:
    es: "El artículo 18.1 ofrece el número fiscal a todos para sus relaciones de naturaleza o con trascendencia tributaria, no solo para las que se tengan con la Administración. No se limita a las operaciones por importe elevado ni a quien ejerce actividades empresariales o profesionales."
  citation: "art. 18.1 RGAT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2007-15984-art-20
- id: m03-l04-q0247
  prompt:
    es: "De acuerdo con el artículo 20.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, para las personas físicas que carezcan de la nacionalidad española, el número de identificación fiscal es:"
  options:
  - id: a
    text:
      es: "el número del documento nacional de identidad seguido de un código de verificación."
  - id: b
    text:
      es: "el número que asigne la Administración tributaria con la letra inicial L."
  - id: c
    text:
      es: "el número del pasaporte con una letra inicial de verificación."
  - id: d
    correct: true
    text:
      es: "el número de identidad de extranjero."
  explanation:
    es: "El artículo 20.1 da a los extranjeros el número de identidad de extranjero como número fiscal. El número del documento nacional de identidad es el de los españoles (art. 19.1), la L es la inicial de los españoles residentes en el extranjero, y el pasaporte no es base del número."
  citation: "art. 20.1 RGAT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
