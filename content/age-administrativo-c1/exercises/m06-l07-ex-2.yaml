# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q050
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué permite el nivel de permisos Autor que no permite el nivel Autor no editor en una carpeta compartida?"
  options:
  - id: a
    text:
      es: "Crear subcarpetas dentro de la carpeta compartida."
  - id: b
    text:
      es: "Leer los elementos que haya en la carpeta compartida."
  - id: c
    correct: true
    text:
      es: "Modificar los elementos que el invitado haya creado."
  - id: d
    text:
      es: "Eliminar los elementos que el invitado haya creado."
  explanation:
    es: "La tabla da a Autor crear y leer elementos, y modificar y eliminar los que cree; a Autor no editor, crear y leer elementos, y eliminar los que cree. La diferencia es modificar los propios. Los dos leen y los dos eliminan lo que crean. Ninguno de los dos crea subcarpetas: eso lo permite Autor de publicación."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Comprender los permisos de uso compartido»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q051
  prompt:
    es: "En Outlook 365, ¿qué ocurre si, tras elegir un nivel de permisos para una carpeta compartida, se desactiva una de sus casillas de permisos?"
  options:
  - id: a
    text:
      es: "El nivel de permisos vuelve a ser Propietario."
  - id: b
    text:
      es: "El nivel de permisos pasa a Revisor."
  - id: c
    text:
      es: "El nivel de permisos cambia a Ninguno."
  - id: d
    correct: true
    text:
      es: "El nivel de permisos cambia a Personalizado."
  explanation:
    es: "La página lo dice para los dos clientes: si se quita una de las casillas asociadas a un nivel, el nivel cambia a Personalizado; en Outlook clásico, ajustar botones o casillas cambia el nivel a Personalizado. Ninguno, Revisor y Propietario son niveles integrados con actividades fijas, no el resultado de cambiar una casilla."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Propietario de una carpeta o buzón: Conceder permisos a una carpeta»"
  difficulty: 2
  tags:
  - "comportamiento"
