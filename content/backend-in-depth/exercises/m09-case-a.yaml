type: case
title:
  en: Distributed rate limiter for a public API
scenario:
  en: 'A company exposes a public REST API through 12 gateway instances behind a load balancer. Each client is identified
    by an API key, and every key has a quota of 100 requests per 60-second window. Heavy clients must be slowed
    down, and a client that exceeds its quota must receive a `429` response.


    The first version kept a counter per API key in the memory of each gateway instance. Clients quickly learned
    that spreading their calls over different instances let them exceed the quota, so the team moved the counters
    to a shared store that every instance queries before it forwards a request. That check runs on the request path
    of every call, so it has to stay fast.


    The platform team is now deciding how the limiter works in detail:


    - The limiter state lives in Redis, with atomic fixed-window counters, and an alternative based on the Resilience4j
    `RateLimiter` library is used for outbound calls to partner services.

    - Responses advertise the quota with the `RateLimit-Policy` and `RateLimit` header fields of the IETF HTTP API
    draft, and may also carry `Retry-After`.

    - The ingestion path into Kafka is protected with broker quotas, so a noisy producer cannot starve the others.'
questions:
- id: m09-case-a-q01
  lesson: m09-l04
  prompt:
    en: A public API runs on 12 instances behind a load balancer, and every request passes a per-client rate-limit
      check first. According to the Redis rate-limiting guide, what must the shared store the limiter queries be
      able to do?
  options:
  - id: a
    text:
      en: Hold counters for the client IP address only, never for API keys or tenants
  - id: b
    text:
      en: Remove expired counters only through a cleanup job that the team schedules
  - id: c
    correct: true
    text:
      en: Sit on the request path without adding meaningful latency
  - id: d
    text:
      en: Keep one counter per instance so that instances never need to coordinate
  explanation:
    en: The guide requires a centralized store fast enough to sit on the request path without adding meaningful
      latency. Counters scoped to the client IP address only is wrong, because counters live behind keys scoped
      to user, IP, API key, tenant or model. A separately scheduled cleanup job is wrong, because `INCR` and `EXPIRE`
      give fixed-window counters with automatic time-window cleanup. One counter per instance is wrong, because
      local per-process counters break behind load balancers and let the same client bypass limits.
  citation: redis-rate-limiter#why-the-problem-is-hard
- id: m09-case-a-q02
  lesson: m09-l04
  prompt:
    en: A Java service creates a Resilience4j `RateLimiter` for an outbound call without choosing any implementation
      class. Which class does Resilience4j use by default as the implementation of `RateLimiter`?
  options:
  - id: a
    text:
      en: '`SemaphoreBasedRateLimiter`'
  - id: b
    text:
      en: '`TokenBucketRateLimiter`'
  - id: c
    text:
      en: '`FixedWindowRateLimiter`'
  - id: d
    correct: true
    text:
      en: '`AtomicRateLimiter`'
  explanation:
    en: '`AtomicRateLimiter` is the default implementation and manages its state via `AtomicReference`. `SemaphoreBasedRateLimiter`
      is wrong because the default implementation is `AtomicRateLimiter`. `TokenBucketRateLimiter` is wrong because
      the default implementation is `AtomicRateLimiter`. `FixedWindowRateLimiter` is wrong because the default implementation
      is `AtomicRateLimiter`.'
  citation: resilience4j-ratelimiter#internals
- id: m09-case-a-q03
  lesson: m09-l04
  prompt:
    en: In the Resilience4j `AtomicRateLimiter`, the immutable `AtomicRateLimiter.State` keeps track of the last
      call. Which value does the state field `activeCycle` hold?
  options:
  - id: a
    text:
      en: The count of permissions available after the last call
  - id: b
    text:
      en: The count of nanoseconds to wait for permission on the last call
  - id: c
    text:
      en: The duration of one cycle configured in `limitRefreshPeriod`
  - id: d
    correct: true
    text:
      en: The cycle number that was used by the last call
  explanation:
    en: '`activeCycle` is the cycle number that was used by the last call. The count of available permissions is
      wrong, because that is `activePermissions`, which can even be negative. The nanoseconds to wait is wrong,
      because that is the state field `nanosToWait`. The cycle duration is wrong, because each cycle has a duration
      configured by `RateLimiterConfig.limitRefreshPeriod`, not a state field.'
  citation: resilience4j-ratelimiter#internals
- id: m09-case-a-q04
  lesson: m09-l04
  prompt:
    en: A rate-limited endpoint answers `429` with both a `RateLimit` field and a `Retry-After` field that disagree
      about when the client may retry. According to the IETF `RateLimit` header draft, which field takes precedence?
  options:
  - id: a
    correct: true
    text:
      en: '`Retry-After`, and the effective window may be ignored'
  - id: b
    text:
      en: '`RateLimit`, because it carries the quota currently available'
  - id: c
    text:
      en: '`RateLimit-Policy`, because the policy is defined by the server'
  - id: d
    text:
      en: Whichever of the two fields appears first in the response
  explanation:
    en: When both fields are present, `Retry-After` MUST take precedence and the effective window MAY be ignored.
      `RateLimit` taking precedence is wrong, because the draft says `Retry-After` MUST take precedence. `RateLimit-Policy`
      taking precedence is wrong, because the draft says `Retry-After` MUST take precedence. The first field taking
      precedence is wrong, because the draft fixes `Retry-After` as the winner regardless of order.
  citation: ietf-httpapi-ratelimit-headers#content
- id: m09-case-a-q05
  lesson: m09-l04
  prompt:
    en: A server publishes its quota through the IETF `RateLimit-Policy` and `RateLimit` header fields on every
      response. Which of the two should stay consistent over a sequence of HTTP responses, according to the draft?
  options:
  - id: a
    correct: true
    text:
      en: '`RateLimit-Policy`'
  - id: b
    text:
      en: '`RateLimit`'
  - id: c
    text:
      en: Both `RateLimit-Policy` and `RateLimit`
  - id: d
    text:
      en: Neither field, since the draft sets no consistency rule
  explanation:
    en: '`RateLimit-Policy` SHOULD remain consistent over a sequence of responses, unlike `RateLimit`. `RateLimit`
      staying consistent is wrong, because it carries information that MAY change on every request. Both staying
      consistent is wrong, because only `RateLimit-Policy` is meant to be stable while `RateLimit` may change on
      every request. Neither being constrained is wrong, because the draft says `RateLimit-Policy` SHOULD remain
      consistent.'
  citation: ietf-httpapi-ratelimit-headers#content
- id: m09-case-a-q08
  lesson: m09-l04
  prompt:
    en: A team already runs a token bucket limiter and wants to publish its state with the IETF `RateLimit` header
      fields. Which throttling algorithm must the server use for those fields to be valid under the draft?
  options:
  - id: a
    text:
      en: Token bucket only, because quota `q` is consumed by requests
  - id: b
    correct: true
    text:
      en: None in particular, because the draft mandates no specific algorithm
  - id: c
    text:
      en: Fixed window only, because the window `w` is a number of seconds
  - id: d
    text:
      en: Sliding window only, because `RateLimit` reports the remaining quota
  explanation:
    en: The draft does not mandate a specific throttling algorithm. Token bucket only is wrong, because the draft
      does not mandate a specific throttling algorithm. Fixed window only is wrong, because the draft does not mandate
      a specific throttling algorithm. Sliding window only is wrong, because the draft does not mandate a specific
      throttling algorithm.
  citation: ietf-httpapi-ratelimit-headers#content
- id: m09-case-a-q09
  lesson: m09-l04
  prompt:
    en: A Kafka cluster limits each client group with request rate quotas rather than network bandwidth quotas.
      According to the Kafka documentation, what threshold does a request rate quota define?
  options:
  - id: a
    correct: true
    text:
      en: CPU utilization as a percentage of network and I/O threads
  - id: b
    text:
      en: A byte-rate threshold in bytes per second
  - id: c
    text:
      en: A maximum count of requests per second
  - id: d
    text:
      en: A maximum number of open connections per client group
  explanation:
    en: Request rate quotas define CPU utilization thresholds as a percentage of network and I/O threads. A byte-rate
      threshold is wrong, because network bandwidth quotas define byte-rate thresholds. A request count per second
      is wrong, because request rate quotas define CPU utilization thresholds. A connection count is wrong, because
      request rate quotas define CPU utilization thresholds.
  citation: kafka-design#quotas
- id: m09-case-a-q10
  lesson: m08-l04
  prompt:
    en: A Kafka broker enforces a client quota measured over 30 windows of 1 second each rather than over one window
      of 30 seconds. According to the Kafka documentation, why does it use many small windows?
  options:
  - id: a
    text:
      en: To smooth traffic, since large windows average bursts out
  - id: b
    correct: true
    text:
      en: To detect and correct quota violations quickly
  - id: c
    text:
      en: To share one quota across all brokers of the cluster
  - id: d
    text:
      en: To let a throttled client keep sending without being blocked
  explanation:
    en: Kafka measures over multiple small windows to detect and correct quota violations quickly. Smoothing through
      large windows is wrong, because large measurement windows lead to large bursts of traffic followed by long
      delays. A quota shared across brokers is wrong, because the quota is defined on a per-broker basis. Unblocked
      sending is wrong, because requests from a throttled client are effectively blocked from both sides, the broker
      and the client.
  citation: kafka-design#enforcement
- id: m09-case-a-q11
  lesson: m09-l04
  prompt:
    en: A Resilience4j rate limiter must refresh its permissions with a scheduler that runs after each `limitRefreshPeriod`
      and must use semaphores. Which implementation matches that description?
  options:
  - id: a
    text:
      en: '`AtomicRateLimiter`'
  - id: b
    text:
      en: '`SemaphoreBulkhead`'
  - id: c
    correct: true
    text:
      en: '`SemaphoreBasedRateLimiter`'
  - id: d
    text:
      en: '`TimeLimiter`'
  explanation:
    en: The `SemaphoreBasedRateLimiter` uses semaphores and a scheduler that refreshes permissions after each `limitRefreshPeriod`.
      `AtomicRateLimiter` is wrong, because it manages its state via `AtomicReference` and is the default implementation.
      `SemaphoreBulkhead` is wrong, because it is a bulkhead implementation that limits the number of concurrent
      executions. `TimeLimiter` is wrong, because `TimeLimiterConfig` configures a timeout duration and whether
      cancel is called on the running future.
  citation: resilience4j-ratelimiter#internals
- id: m09-case-a-q12
  lesson: m09-l04
  prompt:
    en: A server wants clients to avoid being throttled by its rate limiter. According to the IETF draft for the
      `RateLimit` header fields, what do the `RateLimit-Policy` and `RateLimit` fields let a server do?
  options:
  - id: a
    text:
      en: Mandate one throttling algorithm that every client must follow
  - id: b
    correct: true
    text:
      en: Advertise its quota policies and current service limits
  - id: c
    text:
      en: Replace `Retry-After`, which they make obsolete on `429` responses
  - id: d
    text:
      en: Advertise windows with millisecond precision
  explanation:
    en: The fields are for servers to advertise their quota policies and the current service limits, thereby allowing
      clients to avoid being throttled. Mandating one algorithm is wrong, because the draft does not mandate a specific
      throttling algorithm. Replacing `Retry-After` is wrong, because when a response has both, the `Retry-After`
      field MUST take precedence. Millisecond windows are wrong, because sub-second precision is not supported.
  citation: ietf-httpapi-ratelimit-headers#content
- id: m09-case-a-q13
  lesson: m09-l04
  prompt:
    en: A shared Redis limiter must apply separate quotas per tenant and per model for an AI gateway. According
      to the Redis rate-limiting guide, how are the counters keyed?
  options:
  - id: a
    text:
      en: By client IP address only, whatever the limited dimension
  - id: b
    text:
      en: By API key only, with tenants derived afterwards
  - id: c
    correct: true
    text:
      en: By keys scoped to the dimension being limited, such as user, IP, API key, tenant or model
  - id: d
    text:
      en: By instance identifier, so each instance keeps its own counters
  explanation:
    en: Counters live behind keys scoped to the dimension you are limiting on (user, IP, API key, tenant, model).
      IP address only is wrong, because counters live behind keys scoped to user, IP, API key, tenant or model.
      API key only is wrong, because counters are scoped to the dimension being limited, which can be tenant or
      model. Per-instance counters are wrong, because local per-process counters break behind load balancers and
      the same client bypasses limits.
  citation: redis-rate-limiter#how-redis-supports-the-solution
