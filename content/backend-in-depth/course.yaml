# SPDX-License-Identifier: AGPL-3.0-only
# backend-in-depth course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/backend-in-depth-course-requirements.md v1.1. Programme: programme.md (section 9, locked in S0).
# Module mNN is programme module NN and lesson mNN-lMM its subsection NN.MM; titles verbatim from the programme.
# Block «About this course» sits before the programme. The blocks below are generated by
# docs/backend-verification/s0/scripts/skeleton.py; summaries are placeholders until S2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: backend-in-depth
  title:
    en: Backend Engineering in Depth
  subtitle:
    en: Backend Engineering in Depth
  description:
    en: >-
      A self-paced course for senior backend engineers: Java and Kotlin, Spring, persistence, networking, distributed
      systems, system design, operations and technical leadership, written from the primary documentation of pinned
      versions.
  languages: [en]
  # Requirements 8.1: published at the end of S3 (2026-11-14).
  status: published
  # Generators of requirements 6.3 are the psicotecnico type; the static bank (6.1) is quiz; the design cases (6.4) are case.
  exercise_types: [psicotecnico, quiz, case]
  # Requirements 6.5: unseen questions first, failed ones return at growing intervals.
  practice_scheduler: spaced
  # Requirements 6.6: the practice presets the course page offers; no official mock exam, the generators' clock optional.
  lesson_practice: true
  practice_presets: [lesson, module, review, code-reading, generators]
  option_labels: letters
  pdf_exercises: true
  # Requirements 6.3 runtime generators: equal weights, levels 1 and 2 drawn equally (no index fixes a mix).
  practice_generators:
  - generator: capacity-estimation
    title:
      en: Capacity estimation
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: quorum-reads
    title:
      en: Quorums and stale reads
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: rate-limiter-state
    title:
      en: Rate limiter state
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: circuit-breaker-state
    title:
      en: Circuit breaker state
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: retry-backoff-bounds
    title:
      en: Retry backoff bounds
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: logical-clocks
    title:
      en: Lamport and vector clocks
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: kafka-consumer-lag
    title:
      en: Kafka offsets and consumer lag
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: isolation-anomaly
    title:
      en: Isolation levels and anomalies
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: composite-index-usage
    title:
      en: Composite index usage
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: consistent-hashing-owner
    title:
      en: Consistent hashing
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: lru-cache-contents
    title:
      en: LRU cache contents
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: binary-heap-contents
    title:
      en: Binary heap contents
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: loop-complexity
    title:
      en: Loop complexity
    weight: 1
    difficulty: {1: 1, 2: 1}
  # The identity round (docs/identity.md): a server rack, distinct from the other four glyphs; green accent on paper
  # and on ink.
  glyph: server-rack
  color:
    light: "#296c2e"
    dark: "#44b34d"
blocks:
- id: block-a
  title:
    en: About this course
  modules:
  - id: m00
    title:
      en: How this course works
    summary:
      en: What the course covers, how its content is sourced and verified, and how to practise.
    lessons:
    - id: m00-l01
      title:
        en: How this course works
      summary:
        en: Summary pending.
- id: block-b
  title:
    en: Programme
  modules:
  - id: m01
    title:
      en: 'Pragmatic software design and patterns'
    summary:
      en: Summary pending.
    lessons:
    - id: m01-l01
      title:
        en: 'Design principles, pragmatism and data-oriented programming'
      summary:
        en: 'Records, sealed types and pattern matching in Java 25 as the building blocks of data-oriented design, with the single responsibility principle, DRY, KISS and yagni attributed to their authors.'
      exercises:
      - id: m01-l01-ex-1
        type: quiz
    - id: m01-l02
      title:
        en: 'GoF patterns in modern backend code'
      summary:
        en: 'JDK dynamic proxies and Spring AOP proxying mechanics, with the Gang of Four catalogue pointed to by chapter and a builder, a proxy and a strategy-with-observer run as snippets.'
      exercises:
      - id: m01-l02-ex-1
        type: quiz
    - id: m01-l03
      title:
        en: 'Application architecture and modular evolution'
      summary:
        en: 'Spring Modulith modules and ArchUnit rules keep module boundaries and layers checked by tests, and Spring Data aggregate roots publish domain events.'
      exercises:
      - id: m01-l03-ex-1
        type: quiz
    - id: m01-l04
      title:
        en: 'Auditing and defending AI-assisted code'
      summary:
        en: 'Self-invocation silently skips Spring proxies, `CompletableFuture` defaults to the shared common pool, and swallowing an `InterruptedException` loses the interrupt status.'
      exercises:
      - id: m01-l04-ex-1
        type: quiz
  - id: m02
    title:
      en: 'Algorithms and data structures'
    summary:
      en: Summary pending.
    lessons:
    - id: m02-l01
      title:
        en: 'Complexity and Java collections internals'
      summary:
        en: 'Amortised cost averages a sequence of operations, each Java collection documents the structure and cost of its operations, and `equals`, `hashCode` and `compareTo` carry contracts that hash tables and sorted maps rely on.'
      exercises:
      - id: m02-l01-ex-1
        type: quiz
    - id: m02-l02
      title:
        en: 'Arrays, strings and hashing'
      summary:
        en: 'Two pointers, sliding windows, prefix sums and map counting are shown as running code, `binarySearch` returns `-(insertion point) - 1` for a missing key, and Java sorts primitives with a Dual-Pivot Quicksort and objects with a stable merge sort.'
      exercises:
      - id: m02-l02-ex-1
        type: quiz
    - id: m02-l03
      title:
        en: 'Linear structures and trees'
      summary:
        en: 'A `Deque` serves as stack and queue, a binary tree is walked recursively, iteratively or level by level, and a `BinaryHeap` stored in an array keeps the smallest element at position 0.'
      exercises:
      - id: m02-l03-ex-1
        type: quiz
    - id: m02-l04
      title:
        en: 'Graphs'
      summary:
        en: 'Graphs are stored as adjacency matrices or lists and searched breadth-first or depth-first, which gives components, cycle detection and topological order, with union-find for components and Dijkstra''s algorithm for shortest paths.'
      exercises:
      - id: m02-l04-ex-1
        type: quiz
    - id: m02-l05
      title:
        en: 'Algorithm design techniques'
      summary:
        en: 'Recursion, backtracking, dynamic programming, greedy algorithms and bit manipulation, with runnable snippets that show what pruning, memoisation and greedy choices change.'
      exercises:
      - id: m02-l05-ex-1
        type: quiz
    - id: m02-l06
      title:
        en: 'Design structures common in interviews'
      summary:
        en: 'An access-ordered linked hash map as an LRU cache, an iterator over nested lists and two priority queues for a running median, each with a recorded snippet run.'
      exercises:
      - id: m02-l06-ex-1
        type: quiz
    - id: m02-l07
      title:
        en: 'Pattern recognition'
      summary:
        en: 'Naive and better solutions are told apart by the signals Erickson names for backtracking, dynamic programming and greedy algorithms, with the costs he states for text segmentation and the longest increasing subsequence.'
  - id: m03
    title:
      en: 'Modern JVM, concurrency and performance'
    summary:
      en: Summary pending.
    lessons:
    - id: m03-l01
      title:
        en: 'JVM internals, memory management and cloud efficiency'
      summary:
        en: 'The JVM''s run-time data areas, allocation with TLABs, how G1 and generational ZGC collect and are tuned, how to find memory leaks with heap dumps and thread dumps, and what AppCDS, the AOT cache, Spring AOT and GraalVM Native Image change at start-up.'
      exercises:
      - id: m03-l01-ex-1
        type: quiz
    - id: m03-l02
      title:
        en: 'Classic concurrency and the Java Memory Model'
      summary:
        en: 'Visibility, atomicity and ordering under the Java Memory Model with `volatile`, happens-before and the `Atomic*` classes, then `CompletableFuture`, executors, locks, semaphores and the concurrent collections, and what makes a data race or a deadlock.'
      exercises:
      - id: m03-l02-ex-1
        type: quiz
    - id: m03-l03
      title:
        en: 'Project Loom: virtual threads, structured concurrency and scoped values'
      summary:
        en: 'Virtual threads and their carriers, pinning before and after JEP 491, the Java 25 state of structured concurrency (still a preview API) and scoped values as the alternative to thread-local variables.'
      exercises:
      - id: m03-l03-ex-1
        type: quiz
    - id: m03-l04
      title:
        en: 'Profiling, benchmarking and measuring performance'
      summary:
        en: 'Java Flight Recorder and JDK Mission Control, async-profiler, the JMH pitfalls of dead-code elimination, constant folding and forks, coordinated omission in latency measurement, and the SRE book''s hypothesis-driven troubleshooting attributed as judgement.'
      exercises:
      - id: m03-l04-ex-1
        type: quiz
  - id: m04
    title:
      en: 'Kotlin for Java developers'
    summary:
      en: Summary pending.
    lessons:
    - id: m04-l01
      title:
        en: 'Type system and null safety'
      summary:
        en: 'How Kotlin separates nullable from non-nullable types and what smart casts and lateinit add, how platform types and nullability annotations cover Java values, and how declaration-site variance, projections and reified type parameters work.'
      exercises:
      - id: m04-l01-ex-1
        type: quiz
    - id: m04-l02
      title:
        en: 'Idiomatic Kotlin'
      summary:
        en: 'The members the compiler generates for data classes and data objects, sealed hierarchies with exhaustive when and guard conditions, object declarations and value classes, extension and scope functions, read-only collections, sequences and delegation, and how these compare with Java records, sealed classes and pattern matching.'
      exercises:
      - id: m04-l02-ex-1
        type: quiz
    - id: m04-l03
      title:
        en: 'Coroutines'
      summary:
        en: 'How suspend functions become continuation-passing state machines, how structured concurrency, Job, SupervisorJob and cooperative cancellation scope coroutines and their failures, how dispatchers move work between threads, how cold and hot flows and their buffers behave, and how coroutines differ from JVM threads and virtual threads.'
      exercises:
      - id: m04-l03-ex-1
        type: quiz
    - id: m04-l04
      title:
        en: 'Kotlin in Spring Boot'
      summary:
        en: 'Why Spring and JPA need the all-open and no-arg compiler plugins, what data classes do to JPA entities, how suspend functions and Flow appear in controllers, repositories and transactions, and how MockK and runTest test them.'
      exercises:
      - id: m04-l04-ex-1
        type: quiz
    - id: m04-l05
      title:
        en: 'Interoperability and migration from Java'
      summary:
        en: 'How Kotlin functions look to Java callers with @JvmStatic, @JvmOverloads and @Throws, how Kotlin treats Java checked exceptions, and what the Kotlin documentation says about adding Kotlin to a Java project.'
      exercises:
      - id: m04-l05-ex-1
        type: quiz
  - id: m05
    title:
      en: 'Spring Framework and Spring Boot internals'
    summary:
      en: Summary pending.
    lessons:
    - id: m05-l01
      title:
        en: 'IoC container and bean lifecycle'
      summary:
        en: 'How the Spring container defines, creates, wires and destroys beans, including scopes, post-processors, injection styles, configuration classes, conditions and profiles.'
      exercises:
      - id: m05-l01-ex-1
        type: quiz
    - id: m05-l02
      title:
        en: 'Spring Boot auto-configuration'
      summary:
        en: 'How Spring Boot discovers, orders and conditions auto-configurations, how starters and externalised configuration work, and how an auto-configuration and a starter are written and tested.'
      exercises:
      - id: m05-l02-ex-1
        type: quiz
    - id: m05-l03
      title:
        en: 'AOP and proxies'
      summary:
        en: 'How Spring AOP proxies work, with JDK dynamic proxies, CGLIB, self-invocation and proxy limits, and how proxy-based annotations and advice are ordered.'
      exercises:
      - id: m05-l03-ex-1
        type: quiz
    - id: m05-l04
      title:
        en: 'Transaction management'
      summary:
        en: 'How Spring manages transactions with a transaction manager strategy, the @Transactional settings, rollback rules, transactional event listeners and asynchronous or reactive execution.'
      exercises:
      - id: m05-l04-ex-1
        type: quiz
    - id: m05-l05
      title:
        en: 'Web layer'
      summary:
        en: 'How a request travels from the servlet filters through the DispatcherServlet and message converters, how validation and controller advice build the error model, when MVC or WebFlux and virtual threads fit, and how RestClient, WebClient and HTTP service interfaces call other services.'
      exercises:
      - id: m05-l05-ex-1
        type: quiz
    - id: m05-l06
      title:
        en: 'Spring Security'
      summary:
        en: 'How DelegatingFilterProxy, FilterChainProxy and SecurityFilterChain order the security filters, how the SecurityContext and ProviderManager authenticate a request and cross threads, how request and method authorization differ, and how a JWT resource server validates tokens and maps issuers.'
      exercises:
      - id: m05-l06-ex-1
        type: quiz
    - id: m05-l07
      title:
        en: 'Spring Data and JPA'
      summary:
        en: 'How Spring Data repositories, derived queries, @Query, projections and specifications work, how Hibernate''s persistence context tracks entity states, flushes and orders statements, and how auditing, optimistic locking and JDBC batching are configured.'
      exercises:
      - id: m05-l07-ex-1
        type: quiz
    - id: m05-l08
      title:
        en: 'Operating and testing Spring Boot applications'
      summary:
        en: 'How Actuator exposes endpoints, health groups and metrics, which events a SpringApplication sends and how it shuts down gracefully, and how test slices, the test context cache and Testcontainers service connections behave.'
      exercises:
      - id: m05-l08-ex-1
        type: quiz
  - id: m06
    title:
      en: 'Relational persistence, transactions and SQL optimisation'
    summary:
      en: 'Transactions and MVCC in PostgreSQL 18, concurrency anomalies and locking, indexes and query plans, and schema changes without downtime.'
    lessons:
    - id: m06-l01
      title:
        en: 'ACID, MVCC and PostgreSQL internals'
      summary:
        en: 'PostgreSQL 18''s multiversion model, write-ahead log, vacuuming and transaction ID wraparound, and the Read Committed, Repeatable Read and Serializable levels as it implements them.'
      exercises:
      - id: m06-l01-ex-1
        type: quiz
    - id: m06-l02
      title:
        en: 'Concurrency anomalies, locking and connection pooling'
      summary:
        en: 'The four isolation phenomena and what each PostgreSQL 18 level allows, optimistic and pessimistic locking, row locks, HikariCP pool sizing and PgBouncer pooling modes.'
      exercises:
      - id: m06-l02-ex-1
        type: quiz
    - id: m06-l03
      title:
        en: 'Advanced indexing, partitioning and SQL optimisation'
      summary:
        en: 'How PostgreSQL 18 index types, multicolumn, partial and covering indexes, EXPLAIN plans, offset versus keyset pagination and declarative partitioning work, and which ORM fetching and batching patterns cost extra queries.'
      exercises:
      - id: m06-l03-ex-1
        type: quiz
    - id: m06-l04
      title:
        en: 'Zero-downtime schema evolution'
      summary:
        en: 'Zero-downtime schema changes with Flyway and Liquibase, the lock levels of ALTER TABLE, CREATE INDEX CONCURRENTLY and its failure modes, and constraints added with NOT VALID.'
      exercises:
      - id: m06-l04-ex-1
        type: quiz
  - id: m07
    title:
      en: 'Networking and API design'
    summary:
      en: Summary pending.
    lessons:
    - id: m07-l01
      title:
        en: 'Networking fundamentals for backend engineers'
      summary:
        en: 'TCP set-up, teardown, congestion control and keep-alives, DNS caching in the JVM and Kubernetes, the TLS 1.3 handshake with certificates, SNI and ALPN, and timeouts and stale connections in HTTP clients.'
      exercises:
      - id: m07-l01-ex-1
        type: quiz
    - id: m07-l02
      title:
        en: 'HTTP/1.1, HTTP/2 and HTTP/3'
      summary:
        en: 'What persistent connections and pipelining give HTTP/1.1, how HTTP/2 streams, flow control and HPACK work, how QUIC and HTTP/3 change the transport, and how WebSockets and Server-Sent Events keep a channel open.'
      exercises:
      - id: m07-l02-ex-1
        type: quiz
    - id: m07-l03
      title:
        en: 'Load balancing and the edge'
      summary:
        en: 'How Kubernetes Services, readiness and termination steer traffic, what reverse proxies, Ingress and Gateway API are, and which HTTP cache rules apply to shared caches and CDNs.'
      exercises:
      - id: m07-l03-ex-1
        type: quiz
    - id: m07-l04
      title:
        en: 'HTTP semantics'
      summary:
        en: 'Safe and idempotent methods and when requests may be retried, the five status code classes and the redirect codes, HTTP caching with Cache-Control, ETag, conditional requests and Vary, and content negotiation and content codings.'
      exercises:
      - id: m07-l04-ex-1
        type: quiz
    - id: m07-l05
      title:
        en: 'REST API design'
      summary:
        en: 'Resource modelling, idempotency keys and safe retries, ETag and If-Match, links for paging, Problem Details, 202 for long-running work, 429 with Retry-After and RateLimit fields, and what an OpenAPI description holds.'
      exercises:
      - id: m07-l05-ex-1
        type: quiz
    - id: m07-l06
      title:
        en: 'gRPC, GraphQL and asynchronous APIs'
      summary:
        en: 'gRPC call types, deadlines, cancellation, status codes and Protocol Buffers field-number rules; the GraphQL schema, resolvers and the N+1 problem with DataLoader; AsyncAPI documents; and where REST, gRPC, GraphQL and messaging fit.'
      exercises:
      - id: m07-l06-ex-1
        type: quiz
    - id: m07-l07
      title:
        en: 'API evolution and governance'
      summary:
        en: 'Which Protocol Buffers changes are wire-safe, conditionally safe or unsafe, how Spring maps API versions, why the tolerant reader is no longer a blanket rule, the Deprecation and Sunset signals, and how Google''s AIPs govern API design.'
      exercises:
      - id: m07-l07-ex-1
        type: quiz
  - id: m08
    title:
      en: 'Distributed systems, messaging and resilience'
    summary:
      en: Summary pending.
    lessons:
    - id: m08-l01
      title:
        en: 'Fundamentals of distributed systems'
      summary:
        en: 'CAP and PACELC, the consistency guarantees etcd and ZooKeeper actually give, and how NTP and logical clocks order events.'
      exercises:
      - id: m08-l01-ex-1
        type: quiz
    - id: m08-l02
      title:
        en: 'Event-driven architecture (Kafka and RabbitMQ)'
      summary:
        en: 'Kafka replication, acknowledgements, consumer groups and rebalancing, schema compatibility, partition keys, dead letters and retries, and delivery semantics, with RabbitMQ as the contrast.'
      exercises:
      - id: m08-l02-ex-1
        type: quiz
    - id: m08-l03
      title:
        en: 'Distributed transactions without 2PC'
      summary:
        en: 'Why a database write and a broker publish cannot be one transaction, and how an outbox read by polling or by Debezium and a saga with compensating actions replace two-phase commit.'
      exercises:
      - id: m08-l03-ex-1
        type: quiz
    - id: m08-l04
      title:
        en: 'Stability, resilience and traffic control'
      summary:
        en: 'Circuit breaker states and windows, retries with exponential backoff and jitter, bulkheads, rate limits and quotas, load shedding, deadline propagation and backpressure.'
      exercises:
      - id: m08-l04-ex-1
        type: quiz
    - id: m08-l05
      title:
        en: 'Consensus and coordination'
      summary:
        en: 'Failure models and detectors, Raft and Paxos, quorums and split brain in etcd, ZooKeeper, Redis Sentinel and KRaft, leases and fencing tokens, two-phase commit, and SWIM gossip membership.'
      exercises:
      - id: m08-l05-ex-1
        type: quiz
    - id: m08-l06
      title:
        en: 'Event sourcing and CQRS'
      summary:
        en: 'Event-sourced entities, snapshots and the consistency marker, CQRS with Axon queries and event processors, event versioning, token-based projections with replay, the Axon command bus and sagas, crypto-shredding, and Martin Fowler''s cautions on when not to use them.'
      exercises:
      - id: m08-l06-ex-1
        type: quiz
    - id: m08-l07
      title:
        en: 'Stream processing'
      summary:
        en: 'Batch versus stream and event time versus processing time, tumbling, hopping, sliding and session windows with watermarks and grace periods, Kafka Streams state stores, tables and joins, exactly-once with idempotent producers and transactions, and Flink checkpoints, savepoints and back pressure.'
      exercises:
      - id: m08-l07-ex-1
        type: quiz
  - id: m09
    title:
      en: 'System design and data scalability'
    summary:
      en: Summary pending.
    lessons:
    - id: m09-l01
      title:
        en: 'A step-by-step framework for system design'
      summary:
        en: 'Quantiles and percentiles, capacity estimates computed from stated assumptions, API contract and storage-engine choices, and the diagram types of a high-level design.'
      exercises:
      - id: m09-l01-ex-1
        type: quiz
    - id: m09-l02
      title:
        en: 'Data scalability: replication, sharding and caching'
      summary:
        en: 'Choosing between scaling up, replicas, partitions and shards, how PostgreSQL, Redis, Elasticsearch and Dynamo replicate and shard data, and how Redis caches and evicts keys.'
      exercises:
      - id: m09-l02-ex-1
        type: quiz
    - id: m09-l03
      title:
        en: 'Multi-tenant architecture and data isolation'
      summary:
        en: 'Schema per tenant and row-level security in PostgreSQL, Kafka quotas, bulkheads and Kubernetes limits as isolation between tenants, and per-customer limits that may exceed capacity.'
      exercises:
      - id: m09-l03-ex-1
        type: quiz
    - id: m09-l04
      title:
        en: 'Blueprints'
      summary:
        en: 'Distributed rate limiters, contention-safe booking, notification delivery, telemetry ingestion, ID generation, search and autocomplete, and MCP-based agent platforms, each from the documentation of the tools involved.'
      exercises:
      - id: m09-l04-ex-1
        type: quiz
      - id: m09-case-a
        type: case
      - id: m09-case-b
        type: case
      - id: m09-case-c
        type: case
      - id: m09-case-e
        type: case
      - id: m09-case-f
        type: case
      - id: m09-case-g
        type: case
    - id: m09-l05
      title:
        en: 'Storage engines and non-relational databases'
      summary:
        en: 'LSM-trees against B-trees with Bigtable and Bloom filters, Elasticsearch index modes, Redis persistence, eviction, Sentinel and Cluster, Elasticsearch shards, refresh, translog and merges, and a sourced guide to choosing a data store model.'
      exercises:
      - id: m09-l05-ex-1
        type: quiz
  - id: m10
    title:
      en: 'Platform, observability, security and AI integration'
    summary:
      en: Summary pending.
    lessons:
    - id: m10-l01
      title:
        en: 'Observability of distributed systems'
      summary:
        en: 'Structured logs with trace correlation, OpenTelemetry spans and context propagation, Micrometer and Prometheus metric types and percentiles, the USE and RED methods, and SLO burn-rate alerting.'
      exercises:
      - id: m10-l01-ex-1
        type: quiz
    - id: m10-l02
      title:
        en: 'Security, identity and compliance'
      summary:
        en: 'Zero trust between services with SPIFFE identities, TLS client authentication, default-deny NetworkPolicies and dynamic secrets, OAuth 2.0 and OpenID Connect flows, JWT validation and key identifiers, RBAC and ABAC, and GDPR, encryption and audit-log obligations.'
      exercises:
      - id: m10-l02-ex-1
        type: quiz
    - id: m10-l03
      title:
        en: 'FinOps and infrastructure efficiency'
      summary:
        en: 'Kubernetes requests, limits and QoS classes, HPA and KEDA autoscaling, zone-aware traffic routing, telemetry sampling and Prometheus retention sizing, and StorageClass reclaim policy, with the sizing arithmetic run in a snippet.'
      exercises:
      - id: m10-l03-ex-1
        type: quiz
    - id: m10-l04
      title:
        en: 'Platform engineering and architecture of systems with AI'
      summary:
        en: 'Threat-modelling and agent-versus-workflow judgement, then the facts of MCP authorization and security, least privilege for sensitive data and indirect prompt injection.'
      exercises:
