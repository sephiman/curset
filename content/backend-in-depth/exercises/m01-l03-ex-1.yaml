type: quiz
variants:
- id: m01-l03-q01
  prompt:
    en: In Spring Modulith 2.1.2, which part of an application module in a Spring Boot application is usually referred
      to as its provided interface, as opposed to its internals?
  options:
  - id: a
    text:
      en: The internal implementation components that other modules are not supposed to access
  - id: b
    text:
      en: The Spring bean dependencies, application events listened to and configuration properties exposed by the
        module
  - id: c
    correct: true
    text:
      en: The Spring bean instances and application events that the module publishes to other modules
  - id: d
    text:
      en: Every package of the module, because any package may receive incoming dependencies from other modules
  explanation:
    en: The API exposed to other modules, implemented by Spring bean instances and the application events the module
      publishes, is the provided interface. Internal implementation components are not supposed to be accessed by
      other modules, so they are not an interface. References to other modules' API as bean dependencies, events
      listened to and configuration properties are the required interface, not the provided one. By default only
      the base package is the API package and allows incoming dependencies, so not every package is exposed.
  citation: spring-modulith-fundamentals#modules; spring-modulith-fundamentals#modules.named-interfaces
  extract:
    en: An API exposed to other modules implemented by Spring bean instances and application events published by
      the module, usually referred to as provided interface
- id: m01-l03-q03
  prompt:
    en: In Spring Modulith 2.1.2, how do you expose an additional package, besides the base package, to the other
      application modules of a Spring Boot application?
  options:
  - id: a
    correct: true
    text:
      en: Annotate the `package-info.java` of that package with `@NamedInterface`
  - id: b
    text:
      en: Annotate the `package-info.java` of that package with `@ApplicationModule(allowedDependencies = …)`
  - id: c
    text:
      en: Annotate the types of that package with `@Service` so other modules can inject them
  - id: d
    text:
      en: 'Write `"order :: *"` in a `@NamedInterface` annotation on that package'
  explanation:
    en: 'Exposing an additional package means annotating its `package-info.java`, or a `@PackageInfo` type, with
      `@NamedInterface`. The `allowedDependencies` attribute is declared by the consuming module to name what it
      may depend on, so it does not expose a package. By default the base package is the only package that allows
      incoming dependencies, so a `@Service` annotation exposes nothing more. The asterisk form `order :: *` is
      a value of `allowedDependencies` for all declared named interfaces, not of `@NamedInterface`.'
  citation: spring-modulith-fundamentals#modules.named-interfaces
  extract:
    en: You achieve that by annotating the package-info.java file of those packages with @NamedInterface
- id: m01-l03-q04
  prompt:
    en: 'In Spring Modulith 2.1.2, the `inventory` module declares `@ApplicationModule(allowedDependencies = "order
      :: spi")`. Which dependency on the `order` module may its code have?'
  options:
  - id: a
    correct: true
    text:
      en: A dependency on `SomeSpiInterface` and other code in the `order.spi` named interface
  - id: b
    text:
      en: A dependency on `OrderManagement` in the `order` base package
  - id: c
    text:
      en: A dependency on every named interface that `order` declares
  - id: d
    text:
      en: A dependency on other application modules too, because the attribute only adds permitted targets
  explanation:
    en: 'With `order :: spi`, code in `inventory` may depend on `SomeSpiInterface` and other code in the `order.spi`
      named interface. It may not depend on `OrderManagement`. The asterisk form, `order :: *`, is the one that
      covers all declared named interfaces. When allowed dependencies are configured, dependencies to other application
      modules are rejected, so the attribute restricts rather than adds.'
  citation: spring-modulith-fundamentals#modules.named-interfaces; spring-modulith-verification#page-title
  extract:
    en: code in inventory would be allowed to depend on SomeSpiInterface and other code residing in the order.spi
      interface, but not on OrderManagement for example
- id: m01-l03-q07
  prompt:
    en: In Spring Modulith 2.1.2, which reference does the efferent-access rule of `ApplicationModules.verify()`
      reject in a project with no explicit `allowedDependencies`?
  options:
  - id: a
    text:
      en: A reference to a type in the base package of another module
  - id: b
    correct: true
    text:
      en: A reference to a type that resides in an internal package of another module
  - id: c
    text:
      en: A reference to a type in an internal package of an open application module
  - id: d
    text:
      en: A reference to a type in a named interface package of another module
  explanation:
    en: All references to types that reside in application module internal packages are rejected. A reference to
      a type in the base package is accepted, because the base package is the API package by default. Dependencies
      into internals of open application modules are allowed. A named interface exposes its package to other modules,
      so references to it are accepted too.
  citation: spring-modulith-verification#page-title; spring-modulith-fundamentals#modules.named-interfaces
  extract:
    en: all references to types that reside in application module internal packages are rejected
- id: m01-l03-q10
  prompt:
    en: In Spring Modulith 2.1.2, what does the reference documentation say should be the primary means of interaction
      between application modules, and why?
  options:
  - id: a
    text:
      en: Direct calls to Spring beans of the other module, which keep components easy to test
  - id: b
    text:
      en: Event publication, delivered asynchronously by default to keep modules decoupled
  - id: c
    text:
      en: Calls through `@NamedInterface` packages only, never through events
  - id: d
    correct: true
    text:
      en: Event publication and consumption, so the originating module need not know all interested parties
  explanation:
    en: Interaction should primarily be event publication and consumption, which avoids the originating module knowing
      all interested parties. Depending on another module's beans makes the component harder to test, because instances
      of those beans are needed. Event publication happens synchronously by default, not asynchronously. Named interfaces
      expose packages for allowed dependencies, but events are the primary means.
  citation: spring-modulith-events#page-title
  extract:
    en: their primary means of interaction should be event publication and consumption
- id: m01-l03-q11
  prompt:
    en: In the Spring Modulith 2.1.2 `OrderManagement` example that uses `ApplicationEventPublisher`, when does
      `complete(…)` publish the `OrderCompleted` event?
  options:
  - id: a
    text:
      en: Before the state transitions, so listeners can veto them
  - id: b
    text:
      en: After the transaction commits, because publication is asynchronous by default
  - id: c
    text:
      en: Only after `InventoryManagement.updateStockFor` has returned
  - id: d
    correct: true
    text:
      en: Once it has completed the state transitions on the primary aggregate
  explanation:
    en: The event is published once the state transitions on the primary aggregate are complete. Publishing before
      the state transitions so that listeners can veto them is not what the example does, because it publishes after
      they are complete. Publication is synchronous by default, so it does not wait for the commit. The example
      replaces the direct call to `InventoryManagement` with the event, so no such call exists.
  citation: spring-modulith-events#page-title
  extract:
    en: to publish a domain event once we have completed the state transitions on the primary aggregate
- id: m01-l03-q13
  prompt:
    en: In Spring Modulith 2.1.2, what happens to the event publication log entry when its transactional event listener
      fails?
  options:
  - id: a
    text:
      en: The entry is marked completed anyway
  - id: b
    text:
      en: The registry republishes the event immediately by default
  - id: c
    correct: true
    text:
      en: The entry stays untouched so that retry mechanisms can be deployed
  - id: d
    text:
      en: The registry retries the listener until it succeeds
  explanation:
    en: On failure the log entry stays untouched so that retry mechanisms can be deployed. Only a successful listener
      marks its entry completed. Automatic re-publication can be enabled through a property, so it is not on by
      default. Retry mechanisms are deployed depending on the application's needs, so the registry does not retry
      by itself.
  citation: spring-modulith-events#publication-registry
  extract:
    en: the log entry stays untouched so that retry mechanisms can be deployed
- id: m01-l03-q14
  prompt:
    en: In Spring Modulith 2.1.2, which event listeners does the event publication registry consider by default
      when it writes entries into the publication log?
  options:
  - id: a
    text:
      en: All listeners annotated with `@EventListener`, transactional or not
  - id: b
    correct: true
    text:
      en: All listeners annotated or meta-annotated with `@TransactionalEventListener`
  - id: c
    text:
      en: Only the listeners selected by `spring.modulith.events.republish-outstanding-events-on-restart`
  - id: d
    text:
      en: Only listeners of events published through `@DomainEvents` methods
  explanation:
    en: By default all event listeners (meta-)annotated with `@TransactionalEventListener` are considered. Plain
      `@EventListener` methods are not triggers unless the trigger annotation is customised. The republish property
      enables automatic re-publication of outstanding events on restart and does not select listeners. Events published
      through `ApplicationEventPublisher` are considered, so the origin of the event does not limit the listeners.
  citation: spring-modulith-events#publication-registry
  extract:
    en: all event listeners (meta-)annotated with @TransactionalEventListener are considered
- id: m01-l03-q16
  prompt:
    en: In ArchUnit 1.5.1, an `ArchRule` has been specified with the fluent API. How is it evaluated against a set
      of imported classes?
  options:
  - id: a
    correct: true
    text:
      en: By calling `check(importedClasses)` on the rule
  - id: b
    text:
      en: By calling `CycleDetector.detectCycles(nodes, edges)` with the rule
  - id: c
    text:
      en: By calling `layeredArchitecture()` on the rule
  - id: d
    text:
      en: By calling `matching(..)` on the rule
  explanation:
    en: The rule is evaluated by calling `check(importedClasses)`. `CycleDetector.detectCycles` is the core cycle
      detection that custom checks use on nodes and edges. `layeredArchitecture()` is the entrance for layer checks,
      which build a rule instead of evaluating one. `matching(..)` takes a package pattern to sort classes into
      slices.
  citation: archunit-user-guide#_asserting_architectural_constraints; archunit-user-guide#_the_cycle_detection_core_api;
    archunit-user-guide#_layer_checks; archunit-user-guide#_slices
- id: m01-l03-q17
  prompt:
    en: In the `layeredArchitecture()` example of the ArchUnit 1.5.1 user guide, which access to the `Service` layer
      is allowed?
  options:
  - id: a
    text:
      en: Access from the `Controller` and the `Persistence` layers
  - id: b
    text:
      en: Access from any layer, because only `Controller` has an access rule
  - id: c
    text:
      en: No access at all, because every layer is declared with `mayNotBeAccessedByAnyLayer()`
  - id: d
    correct: true
    text:
      en: Only access from the `Controller` layer
  explanation:
    en: The rule `mayOnlyBeAccessedByLayers("Controller")` on `Service` allows only the `Controller` layer. The
      `Persistence` layer is allowed only to be accessed by `Service`, so it is not a caller of `Service` in this
      setup. Each of the three layers has its own `whereLayer` rule, so `Controller` is not the only one. Only `Controller`
      is declared with `mayNotBeAccessedByAnyLayer()`.
  citation: archunit-user-guide#_layer_checks
- id: m01-l03-q21
  prompt:
    en: In ArchUnit 1.5.1, which class holds the cycle detection that the `slices()` rule uses, so that custom checks
      can run it without any rule syntax?
  options:
  - id: a
    text:
      en: '`SlicesRuleDefinition`, the entrance point for slice rules in the library'
  - id: b
    text:
      en: '`ArchRuleDefinition`, the entry point for specifying rules'
  - id: c
    text:
      en: '`SliceAssignment`, which maps a `JavaClass` to a slice'
  - id: d
    correct: true
    text:
      en: '`CycleDetector`, in the `cycle_detection` package of the library'
  explanation:
    en: '`CycleDetector` is the core class of the cycle detection, and `CycleDetector.detectCycles(nodes, edges)`
      returns the cycles found. `SlicesRuleDefinition` is the entrance point of the rule syntax around it. `ArchRuleDefinition`
      is the entry point for specifying general rules. `SliceAssignment` maps classes to slice identifiers for custom
      slice creation.'
  citation: archunit-user-guide#_the_cycle_detection_core_api; archunit-user-guide#_slices; archunit-user-guide#_asserting_architectural_constraints
- id: m01-l03-q22
  prompt:
    en: In Spring Data Commons 4.1.2, which statement about a method of an aggregate root annotated with `@DomainEvents`
      is correct?
  options:
  - id: a
    text:
      en: It must return a `Collection<Object>` of events and it takes the aggregate root as its only argument
  - id: b
    text:
      en: It must return `void` and publish through `ApplicationEventPublisher` itself
  - id: c
    correct: true
    text:
      en: It can return a single event instance or a collection of events, and it must not take any arguments
  - id: d
    text:
      en: It is called only when `save(…)` is called on the repository
  explanation:
    en: The method can return a single event instance or a collection and must not take arguments. It does not take
      the aggregate root, because it takes no arguments, and a single instance is allowed as well as a collection.
      It returns the events to publish rather than publishing them itself. It is called for `save(…)`, `saveAll(…)`
      and the delete methods listed, not for `save(…)` alone.
  citation: spring-data-commons-domain-events#page-title
- id: m01-l03-q25
  prompt:
    en: In Spring Modulith 2.1.1, an `@Async` listener annotated with `@TransactionalEventListener` handles `OrderCompleted`.
      Which risk does the documentation name when that listener fails for whatever reason?
  options:
  - id: a
    text:
      en: The original business transaction expands to include the failed listener and rolls back with it
  - id: b
    text:
      en: The event is always delivered again, because the system cannot fail before the method is invoked
  - id: c
    correct: true
    text:
      en: The event publication is lost, unless each listener implements its own safety net
  - id: d
    text:
      en: The status change of the order is rolled back together with the failed listener
  explanation:
    en: The documentation warns that a failing listener loses the event publication unless the listener implements
      its own safety net. It says the arrangement avoids the expansion of the original business transaction, so
      the transaction does not grow to include the listener. It also says the system might fail before the method
      is even invoked, so delivery is not guaranteed. The arrangement decouples the original transaction from the
      execution of the listener, so the order's status change is not rolled back with it.
  citation: spring-modulith-events#page-title
  extract:
    en: if the listener fails for whatever reason, the event publication is lost, unless each listener actually
      implements its own safety net
- id: m01-l03-q27
  prompt:
    en: In Spring Modulith 2.1.1, which part marks an entry of the event publication log as completed after the
      event reached a transactional event listener?
  options:
  - id: a
    text:
      en: The registry itself, at the moment the event is published
  - id: b
    correct: true
    text:
      en: An aspect wrapped around the listener, when its execution succeeds
  - id: c
    text:
      en: The listener's own code, which has to update the log entry
  - id: d
    text:
      en: A restart of the application with automatic re-publication enabled
  explanation:
    en: Each transactional event listener is wrapped into an aspect that marks its log entry as completed if the
      execution succeeds. At publication the registry only writes the entries, so they exist before any listener
      ran. The aspect does the marking, so the listener's own code does not have to update the entry. The re-publication
      property only republishes outstanding events on restart and does not mark entries completed.
  citation: spring-modulith-events#publication-registry
  extract:
    en: Each transactional event listener is wrapped into an aspect that marks that log entry as completed if the
      execution of the listener succeeds
- id: m01-l03-q31
  prompt:
    en: In ArchUnit 1.5.1, a custom `SliceAssignment` returns `SliceIdentifier.ignore()` for a class that matches
      none of its mappings. What happens to that class when the slice rule is evaluated?
  options:
  - id: a
    text:
      en: It is put into the `Legacy` slice together with the `com.oldapp` classes
  - id: b
    correct: true
    text:
      en: It is left out of every slice, so the rule does not check it
  - id: c
    text:
      en: It is put into the `ESB` slice together with the classes whose name contains `.esb.`
  - id: d
    text:
      en: It makes the rule fail with the text from `getDescription()`
  explanation:
    en: A class that matches nothing is ignored by returning `SliceIdentifier.ignore()`. The `Legacy` slice holds
      only classes whose package name starts with `com.oldapp`. The `ESB` slice holds only classes whose name contains
      `.esb.`. The text from `getDescription()` is part of the rule description when the test fails, and it is not
      an effect of ignoring a class.
  citation: archunit-user-guide#_slices
- id: m01-l03-q34
  prompt:
    en: The ArchUnit 1.5.1 user guide says the Library API currently offers two slice rules. Which pair of assertions
      do its slice examples use?
  options:
  - id: a
    correct: true
    text:
      en: '`beFreeOfCycles()` and `notDependOnEachOther()`'
  - id: b
    text:
      en: '`beFreeOfCycles()` and `mayNotBeAccessedByAnyLayer()`'
  - id: c
    text:
      en: '`notDependOnEachOther()` and `onlyBeAccessed()`'
  - id: d
    text:
      en: '`beFreeOfCycles()` and `detectCycles(nodes, edges)`'
  explanation:
    en: The slice examples assert `beFreeOfCycles()` and `notDependOnEachOther()`. `mayNotBeAccessedByAnyLayer()`
      belongs to the layer checks. `onlyBeAccessed()` belongs to the `ArchRuleDefinition` rule syntax. `detectCycles(nodes,
      edges)` is the cycle detection core API that runs without any rule syntax.
  citation: archunit-user-guide#_slices; archunit-user-guide#_layer_checks; archunit-user-guide#_asserting_architectural_constraints;
    archunit-user-guide#_the_cycle_detection_core_api
