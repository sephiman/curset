# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q025
  prompt:
    es: "Señale la respuesta correcta sobre la prescripción de las sanciones impuestas por faltas graves cuando la ley no fija plazos, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Prescriben al año, la mitad que las infracciones graves."
  - id: b
    correct: true
    text:
      es: "Prescriben a los dos años, igual que las infracciones graves."
  - id: c
    text:
      es: "Prescriben a los tres años, uno más que las infracciones graves."
  - id: d
    text:
      es: "Prescriben a los cinco años, como las impuestas por faltas muy graves."
  explanation:
    es: "Según el artículo 30.1, las sanciones «impuestas por faltas graves [prescribirán] a los dos años», el mismo plazo que «las graves» entre las infracciones. Un año es el plazo de las sanciones por faltas leves y tres años el de las faltas muy graves. Las sanciones por faltas muy graves prescriben a los tres años, no a los cinco."
  citation: "art. 30.1 LRJSP"
  difficulty: 2
  tags:
