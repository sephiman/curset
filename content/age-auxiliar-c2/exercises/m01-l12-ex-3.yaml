# anchor: celex-32016r0679-art-37
- id: m01-l12-q034
  prompt:
    es: "Según el artículo 37.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, se designará un delegado de protección de datos siempre que el tratamiento lo lleve a cabo una autoridad u organismo público:"
  options:
  - id: a
    correct: true
    text:
      es: "Excepto los tribunales que actúen en ejercicio de su función judicial."
  - id: b
    text:
      es: "Excepto las entidades locales de menos de veinte mil habitantes."
  - id: c
    text:
      es: "Siempre que emplee a doscientas cincuenta personas o más."
  - id: d
    text:
      es: "Excepto los organismos públicos que no traten categorías especiales de datos."
  explanation:
    es: "El artículo 37.1.a) exige el delegado cuando el tratamiento lo lleva a cabo una autoridad u organismo público, «excepto los tribunales que actúen en ejercicio de su función judicial». El Reglamento no exceptúa a las entidades locales pequeñas. No pone un mínimo de 250 personas: esa cifra es la del registro de actividades. Tampoco exceptúa a quien no trata categorías especiales."
  citation: "art. 37.1 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-34
- id: m01-l12-q035
  prompt:
    es: "Según el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál de las siguientes entidades debe designar en todo caso un delegado de protección de datos?"
  options:
  - id: a
    text:
      es: "Las federaciones deportivas, aunque no traten datos de menores."
  - id: b
    correct: true
    text:
      es: "Los colegios profesionales y sus consejos generales."
  - id: c
    text:
      es: "Las comunidades de propietarios en régimen de propiedad horizontal."
  - id: d
    text:
      es: "Las asociaciones de consumidores y usuarios."
  explanation:
    es: "El artículo 34.1.a) incluye entre las entidades obligadas «los colegios profesionales y sus consejos generales». Las federaciones deportivas solo están obligadas «cuando traten datos de menores de edad». Las comunidades de propietarios y las asociaciones de consumidores no figuran en la lista."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-34
- id: m01-l12-q036
  prompt:
    es: "Una entidad aseguradora tiene treinta empleados. Según el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿debe designar un delegado de protección de datos?"
  options:
  - id: a
    text:
      es: "Solo si trata a gran escala categorías especiales de datos."
  - id: b
    text:
      es: "No, porque la designación es voluntaria para las entidades privadas."
  - id: c
    correct: true
    text:
      es: "Sí, en todo caso, por ser una entidad aseguradora."
  - id: d
    text:
      es: "Solo si se lo requiere la Agencia Española de Protección de Datos."
  explanation:
    es: "El artículo 34.1.g) obliga a designar delegado «en todo caso» a «las entidades aseguradoras y reaseguradoras», sin atender al número de empleados. La obligación no depende de tratar categorías especiales a gran escala ni de un requerimiento de la Agencia. Para estas entidades la designación no es voluntaria."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-34
- id: m01-l12-q037
  prompt:
    es: "¿En cuál de los siguientes casos exige el artículo 34.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales designar en todo caso un delegado de protección de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un hospital privado legalmente obligado a mantener las historias clínicas de sus pacientes."
  - id: b
    text:
      es: "Una odontóloga obligada a llevar historias clínicas que ejerce a título individual."
  - id: c
    text:
      es: "Una comunidad de propietarios que dispone de un sistema de videovigilancia."
  - id: d
    text:
      es: "Un comercio minorista que conserva los datos de contacto de sus clientes."
  explanation:
    es: "El artículo 34.1.l) incluye «los centros sanitarios legalmente obligados al mantenimiento de las historias clínicas de los pacientes», como un hospital. Exceptúa a «los profesionales de la salud» que, aun obligados a mantener historias clínicas, «ejerzan su actividad a título individual», como la odontóloga. Las comunidades de propietarios y los comercios minoristas no figuran en la lista."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-34
- id: m01-l12-q038
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿en qué plazo se comunican a la autoridad de protección de datos las designaciones, nombramientos y ceses de los delegados de protección de datos?"
  options:
  - id: a
    text:
      es: "En el plazo de un mes."
  - id: b
    text:
      es: "En el plazo de quince días."
  - id: c
    text:
      es: "En el plazo de setenta y dos horas."
  - id: d
    correct: true
    text:
      es: "En el plazo de diez días."
  explanation:
    es: "El artículo 34.3 dice que los responsables y encargados comunicarán «en el plazo de diez días» las designaciones, nombramientos y ceses a la Agencia o, en su caso, a las autoridades autonómicas. Un mes, quince días y setenta y dos horas no son el plazo de esta comunicación."
  citation: "art. 34.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2018-16673-art-36
- id: m01-l12-q039
  prompt:
    es: "Según el artículo 36.2 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, el delegado persona física integrada en la organización solo podrá ser removido o sancionado por desempeñar sus funciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Si incurre en dolo o negligencia grave en su ejercicio."
  - id: b
    text:
      es: "Si incurre en dolo, culpa o negligencia leve en su ejercicio."
  - id: c
    text:
      es: "Previo informe favorable de la Agencia Española de Protección de Datos."
  - id: d
    text:
      es: "Si lo acuerda el más alto nivel jerárquico del responsable."
  explanation:
    es: "El artículo 36.2 dice que ese delegado no podrá ser removido ni sancionado por desempeñar sus funciones «salvo que incurriera en dolo o negligencia grave en su ejercicio». La negligencia leve no basta. La ley no prevé un informe de la Agencia. El más alto nivel jerárquico es a quien el delegado rinde cuentas, no una vía para removerlo."
  citation: "art. 36.2 LOPDGDD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-36
- id: m01-l12-q040
  prompt:
    es: "Señale la respuesta correcta sobre el acceso del delegado de protección de datos a los datos personales y procesos de tratamiento, según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales:"
  options:
  - id: a
    text:
      es: "El responsable o el encargado pueden oponerle el deber de confidencialidad del artículo 5 de la ley."
  - id: b
    text:
      es: "El responsable o el encargado pueden oponerle el secreto profesional de sus empleados."
  - id: c
    correct: true
    text:
      es: "El responsable o el encargado no pueden oponerle ningún deber de confidencialidad o secreto."
  - id: d
    text:
      es: "El responsable o el encargado pueden limitarle el acceso a las categorías especiales de datos."
  explanation:
    es: "El artículo 36.3 dice que el delegado tendrá acceso a los datos personales y procesos de tratamiento, «no pudiendo oponer a este acceso el responsable o el encargado del tratamiento la existencia de cualquier deber de confidencialidad o secreto, incluyendo el previsto en el artículo 5». El deber del artículo 5 está incluido expresamente. El secreto profesional de los empleados es un deber de secreto más. La ley no limita el acceso a las categorías especiales."
  citation: "art. 36.3 LOPDGDD"
  difficulty: 2
  tags:
  - "efecto"
# anchor: celex-32016r0679-art-39
- id: m01-l12-q041
  prompt:
    es: "Según el artículo 39.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el delegado de protección de datos actuará como punto de contacto de la autoridad de control para cuestiones relativas al tratamiento:"
  options:
  - id: a
    text:
      es: "Excluida la consulta previa, que corresponde en exclusiva al responsable o al encargado del tratamiento."
  - id: b
    text:
      es: "Incluida la consulta previa, sin poder realizar consultas sobre ningún otro asunto."
  - id: c
    text:
      es: "Solo cuando el responsable le haya delegado expresamente esa función por escrito."
  - id: d
    correct: true
    text:
      es: "Incluida la consulta previa, y realizará consultas, en su caso, sobre cualquier otro asunto."
  explanation:
    es: "El artículo 39.1.e) atribuye al delegado «actuar como punto de contacto de la autoridad de control para cuestiones relativas al tratamiento, incluida la consulta previa […], y realizar consultas, en su caso, sobre cualquier otro asunto». La consulta previa está incluida, no excluida. Puede consultar sobre cualquier otro asunto. Es una función mínima que le da el Reglamento, sin delegación del responsable."
  citation: "art. 39.1 RGPD"
  difficulty: 3
  tags:
  - "competencia"
# anchor: celex-32016r0679-art-39
- id: m01-l12-q042
  prompt:
    es: "¿Cuál de las siguientes es una de las funciones mínimas del delegado de protección de datos según el Reglamento (UE) 2016/679?"
  options:
  - id: a
    text:
      es: "Imponer multas administrativas al responsable."
  - id: b
    correct: true
    text:
      es: "Cooperar con la autoridad de control."
  - id: c
    text:
      es: "Autorizar la contratación de otros encargados."
  - id: d
    text:
      es: "Determinar los fines y medios del tratamiento."
  explanation:
    es: "El artículo 39.1.d) incluye entre las funciones mínimas del delegado «cooperar con la autoridad de control». Imponer multas es un poder de la autoridad de control. Autorizar a otros encargados corresponde al responsable (artículo 28.2). Determinar los fines y medios es lo que define al responsable."
  citation: "art. 39.1 RGPD"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2018-16673-art-37
- id: m01-l12-q044
  prompt:
    es: "Según el artículo 37.2 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿quién puede remitir una reclamación al delegado de protección de datos para que este responda?"
  options:
  - id: a
    text:
      es: "El responsable del tratamiento, antes de resolver sobre la reclamación recibida."
  - id: b
    text:
      es: "El órgano superior jerárquico del responsable del tratamiento."
  - id: c
    correct: true
    text:
      es: "La autoridad de protección de datos ante la que el afectado presentó la reclamación."
  - id: d
    text:
      es: "El juzgado de lo contencioso-administrativo que conozca del recurso interpuesto por el afectado."
  explanation:
    es: "El artículo 37.2 dice que, cuando el afectado reclama ante la Agencia o, en su caso, ante una autoridad autonómica, «aquellas podrán remitir la reclamación al delegado de protección de datos a fin de que este responda en el plazo de un mes». La remisión no la hace el responsable ni su órgano superior. Tampoco un juzgado."
  citation: "art. 37.2 LOPDGDD"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2018-16673-art-4
- id: m01-l12-q053
  prompt:
    es: "Según el artículo 4.2 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el responsable con todas las medidas razonables de corrección queda exento si obtuvo los datos inexactos:"
  options:
  - id: a
    text:
      es: "De una red social."
  - id: b
    text:
      es: "De un tercero que no actúa como intermediario del sector."
  - id: c
    correct: true
    text:
      es: "De un registro público."
  - id: d
    text:
      es: "De un tratamiento anterior del propio responsable."
  explanation:
    es: "La letra d) del artículo 4.2 libera al responsable de la inexactitud de los datos obtenidos de un registro público, siempre que haya tomado todas las medidas razonables para suprimirlos o rectificarlos sin dilación. Una fuente de acceso público en internet, un tercero que no sea un intermediario del sector y sus propios tratamientos anteriores no figuran entre los supuestos."
  citation: "art. 4.2 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-4
- id: m01-l12-q054
  prompt:
    es: "Señale quién asume, según el artículo 4.2.b) de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, la responsabilidad de comunicar al responsable datos distintos de los del afectado:"
  options:
  - id: a
    correct: true
    text:
      es: "El mediador o intermediario."
  - id: b
    text:
      es: "El propio afectado."
  - id: c
    text:
      es: "El encargado del tratamiento."
  - id: d
    text:
      es: "La autoridad de control."
  explanation:
    es: "El artículo 4.2.b) pone la responsabilidad en el mediador o intermediario que recoge los datos en nombre propio y los transmite al responsable. No la asume el afectado, ni el encargado, ni la autoridad de control."
  citation: "art. 4.2.b) LOPDGDD"
  difficulty: 2
  tags:
  - "órgano"
