# anchor: fuente-ms-outlook-reglas-html
- id: m02-l11-q038
  prompt:
    es: "En el nuevo Outlook para Windows, ¿sobre qué mensajes se ejecuta de forma predeterminada una regla de bandeja de entrada después de crearla?"
  options:
  - id: a
    correct: true
    text:
      es: "Sobre los mensajes entrantes que llegan después de crear la regla"
  - id: b
    text:
      es: "Solo sobre los mensajes con datos adjuntos que ya estaban en la bandeja"
  - id: c
    text:
      es: "Sobre todos los mensajes de la bandeja de entrada, también los ya recibidos"
  - id: d
    text:
      es: "Solo sobre los mensajes no leídos de la bandeja de entrada"
  explanation:
    es: "La ayuda dice que, de forma predeterminada, una regla se ejecuta en mensajes entrantes después de que se haya creado. Ejecutarla sobre todos los ya recibidos contradice esa frase, y para ejecutarla en mensajes existentes hay que seleccionar el botón junto a la regla. Solo los no leídos y solo los que ya tenían adjuntos también la contradicen."
  citation: "fuente: `ms-outlook-reglas.html`; «Ejecutar reglas de bandeja de entrada en mensajes existentes en el nuevo Outlook para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
