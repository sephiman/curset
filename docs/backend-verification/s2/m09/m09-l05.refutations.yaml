m09-l05-q05:
  key:
    anchor: redis-eviction#eviction-policies
    sentence: 'noeviction: Keys are not evicted but the server will return an error when you try to execute commands that cache new data.'
  wrong:
  - option: The server evicts the least recently used keys to make room
    anchor: redis-eviction#eviction-policies
    sentence: 'allkeys-lru: Evict the least recently used (LRU) keys.'
  - option: The server evicts keys at random to make room
    anchor: redis-eviction#eviction-policies
    sentence: 'allkeys-random: Evict keys at random.'
  - option: The server returns the same error for read commands as well
    anchor: redis-eviction#eviction-policies
    sentence: Note that commands that only read existing data still work as normal.
m09-l05-q06:
  key:
    anchor: redis-eviction#eviction-policies
    sentence: The volatile-xxx policies behave like noeviction if no keys have an associated expiration.
  wrong:
  - option: 'Like `allkeys-lru`: it evicts the least recently used keys whether or not they expire'
    anchor: redis-eviction#eviction-policies
    sentence: 'volatile-lru: Evict the least recently used keys that have an associated expiration (TTL).'
  - option: 'Like `volatile-ttl`: it evicts the keys with the shortest remaining TTL'
    anchor: redis-eviction#eviction-policies
    sentence: 'volatile-ttl: Evict keys with an associated expiration (TTL) that have the shortest remaining TTL value.'
  - option: 'Like `allkeys-random`: it evicts keys at random until memory is free'
    anchor: redis-eviction#eviction-policies
    sentence: 'allkeys-random: Evict keys at random.'
m09-l05-q07:
  key:
    anchor: redis-scaling#redis-cluster-consistency-guarantees
    sentence: if your client writes something, B acknowledges the write, but crashes before being able to send the write to its replicas, one of the replicas (that did not receive the write) can be promoted to master, losing the write forever.
  wrong:
  - option: The replicas refuse promotion until they hold the write, so no acknowledged write is lost
    anchor: redis-scaling#redis-cluster-consistency-guarantees
    sentence: one of the replicas (that did not receive the write) can be promoted to master, losing the write forever
  - option: The `WAIT` command makes losing the write impossible even in this case
    anchor: redis-scaling#redis-cluster-consistency-guarantees
    sentence: However, note that Redis Cluster does not implement strong consistency even when synchronous replication is used
  - option: The master had waited for its replicas to acknowledge the write before replying OK
    anchor: redis-scaling#redis-cluster-consistency-guarantees
    sentence: does not wait for an acknowledgement from B1, B2, B3 before replying to the client
m09-l05-q08:
  key:
    anchor: redis-sentinel#sentinel-as-a-distributed-system
    sentence: Failure detection is performed when multiple Sentinels agree about the fact a given master is no longer available. This lowers the probability of false positives.
  wrong:
  - option: Failover only works while every Sentinel process is running
    anchor: redis-sentinel#sentinel-as-a-distributed-system
    sentence: Sentinel works even if not all the Sentinel processes are working, making the system robust against failures.
  - option: Failure detection is faster because one Sentinel can declare a master unavailable alone
    anchor: redis-sentinel#sentinel-as-a-distributed-system
    sentence: Failure detection is performed when multiple Sentinels agree about the fact a given master is no longer available.
  - option: One Sentinel is enough, because a failover system cannot be a single point of failure
    anchor: redis-sentinel#sentinel-as-a-distributed-system
    sentence: There is no fun in having a failover system which is itself a single point of failure, after all.
m09-l05-q09:
  key:
    anchor: es-index-modules#dynamic-index-settings
    sentence: The value defaults to 1s in Elastic Stack and 5s in Serverless.
  wrong:
