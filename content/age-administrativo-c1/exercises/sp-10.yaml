type: case
title:
  es: "Las subvenciones del FEGA"
scenario:
  es: "El Fondo Español de Garantía Agraria, O.A. (FEGA), organismo autónomo adscrito al Ministerio de Agricultura, Pesca y Alimentación, está en Madrid. Son festivos el 1 de noviembre y el 6 y el 8 de diciembre. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027. Ningún otro festivo cae en los plazos por días.\n\nConservas Riberas del Júcar, S.L. recurrió en alzada la resolución del FEGA que le denegó una ayuda, y la persona titular del Ministerio la desestimó expresamente. La notificación en su domicilio no pudo practicarse y se publica el anuncio el miércoles, 30 de junio de 2027. Hortalizas de la Mancha Alta, S.A. recibe el martes, 14 de septiembre de 2027, la notificación del FEGA que le exige el reintegro de otra subvención, y quiere recurrirlo. El miércoles, 8 de septiembre de 2027, el FEGA requiere a Frutas del Jarama, S.L. que justifique una subvención. En el reintegro de Ganadería Sierra Norte, S.L., la Presidencia acuerda actuaciones complementarias y lo notifica el martes, 26 de octubre de 2027.\n\nEl FEGA licita por procedimiento abierto un contrato de servicios de auditoría de valor estimado de 120.000 euros, IVA excluido, con varios criterios de adjudicación; la Mesa abre las proposiciones el jueves, 17 de junio de 2027. El jueves, 15 de julio de 2027, adjudica el contrato y lo notifica el lunes, 19 de julio de 2027. Controles Integrales del Centro, S.L., quiere recurrir. Seguridad Digital Meseta, S.L. entrega el informe final el jueves, 4 de noviembre de 2027; el pliego no fija plazo de recepción.\n\nDon Abel Quintanilla Soto hace en el FEGA el curso selectivo de ingreso en el Cuerpo de Gestión de la Administración Civil del Estado. El viernes, 16 de julio de 2027, se publica el nombramiento de Doña Leonor Escudero Navas como funcionaria de carrera destinada en Madrid, donde reside. Don Gaspar Ibarra Ledesma, funcionario de carrera, estaba en excedencia voluntaria por prestación de servicios en el sector público, como laboral fijo de una universidad pública, y cesó el martes, 31 de agosto de 2027. Las solicitudes a la libre designación de una Subdirección General terminan el jueves, 29 de julio de 2027. El suegro de Doña Valeria Cortés Ugarte, funcionaria de carrera, ingresa en un hospital por una enfermedad grave. Don Cristóbal Aranda Ferrer, funcionario de carrera, es suspendido provisionalmente el lunes, 30 de agosto de 2027, en un expediente disciplinario.\n\nLa Presidencia del FEGA quiere transferir 30.000 euros entre dos aplicaciones de gastos corrientes en bienes y servicios del mismo programa, sin afectar a créditos de personal, y el Ministerio no avoca. El miércoles, 27 de octubre de 2027, el FEGA remite a la Intervención Delegada el expediente de gasto de un convenio y declara urgente su tramitación. El martes, 16 de noviembre de 2027, la Intervención Delegada notifica un reparo al de otro convenio, y el FEGA no lo acepta. El FEGA contrata una campaña de 24.000 euros sin pedir la fiscalización previa, que era preceptiva. El FEGA debe pagar un gasto inaplazable para el que no tiene crédito y tramita un crédito extraordinario en el Presupuesto del Estado; cuando el Consejo de Estado dictamina favorablemente, el Gobierno le concede un anticipo de Tesorería.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-44
- id: q01
  lesson: m03-l02
  prompt:
    es: "¿Dónde debe publicarse necesariamente el anuncio con el que el FEGA notifica a Conservas Riberas del Júcar, S.L. la desestimación de su alzada?"
  options:
  - id: a
    text:
      es: "En el boletín oficial de la Comunidad Autónoma del último domicilio, que basta para notificar."
  - id: b
    correct: true
    text:
      es: "En el «Boletín Oficial del Estado», sin perjuicio de otras publicaciones facultativas."
  - id: c
    text:
      es: "En el tablón de edictos del Ayuntamiento del último domicilio de la empresa."
  - id: d
    text:
      es: "En el «Boletín Oficial del Estado» y en el de la provincia, que son obligatorios ambos."
  explanation:
    es: "Cuando se ignora el lugar de la notificación o, intentada, no ha podido practicarse, la notificación se hace por un anuncio publicado en el «Boletín Oficial del Estado» (art. 44 LPAC). Antes pueden publicarse, con carácter facultativo, anuncios en el boletín autonómico o provincial, en el tablón de edictos del Ayuntamiento del último domicilio o en el consulado. Las opciones del boletín de la Comunidad Autónoma y del tablón de edictos toman esos anuncios facultativos por la notificación misma. La de los dos boletines, el estatal y el de la provincia, hace obligatorio un anuncio que la ley deja a elección de la Administración."
  citation: "art. 44 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-122
- id: q28
  lesson: m03-l03
  prompt:
    es: "El FEGA notificó a Conservas Riberas del Júcar, S.L. la denegación de la ayuda el miércoles, 31 de marzo de 2027. Según el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha podía interponer el recurso de alzada?"
  options:
  - id: a
    text:
      es: "El sábado, 1 de mayo de 2027."
  - id: b
    text:
      es: "El jueves, 29 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El viernes, 30 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 31 de mayo de 2027."
  explanation:
    es: "El plazo para interponer la alzada es de un mes si el acto es expreso (art. 122.1 LPAC). Los plazos por meses se cuentan desde el día siguiente a la notificación y, si el mes de vencimiento no tiene día equivalente, el plazo expira el último día del mes (art. 30.4 LPAC). Abril no tiene día 31, así que el plazo acaba el viernes, 30 de abril de 2027, día hábil. La fecha del sábado, 1 de mayo de 2027, salta a mayo como si abril tuviera día 31. La del jueves, 29 de abril de 2027, cuenta el día de la notificación como primero. La del lunes, 31 de mayo de 2027, aplica los dos meses del recurso contencioso-administrativo, no el mes de la alzada."
  citation: "art. 122.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-124
- id: q26
  lesson: m03-l03
  prompt:
    es: "Hortalizas de la Mancha Alta, S.A. presenta reposición contra el reintegro el viernes, 24 de septiembre de 2027. Según el artículo 124.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe resolverse y notificarse?"
  options:
  - id: a
    correct: true
    text:
      es: "Lunes, 25 de octubre de 2027."
  - id: b
    text:
      es: "Domingo, 24 de octubre de 2027."
  - id: c
    text:
      es: "Sábado, 23 de octubre de 2027."
  - id: d
    text:
      es: "Viernes, 24 de diciembre de 2027."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución de la reposición es de un mes (art. 124.2 LPAC). Los plazos por meses se cuentan de fecha a fecha desde el día siguiente a la entrada del recurso (art. 30.4 LPAC) y, si el último día es inhábil, pasa al primer día hábil siguiente (art. 30.5 LPAC): desde el viernes, 24 de septiembre de 2027, el mes acaba el domingo, 24 de octubre, y el plazo se prolonga hasta el lunes, 25 de octubre de 2027. La fecha del domingo 24 de octubre deja el plazo en el día inhábil sin trasladarlo. La del sábado 23 de octubre cuenta el día de entrada como primero. La del viernes 24 de diciembre aplica los tres meses de la alzada, que no es el recurso interpuesto."
  citation: "art. 124.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
