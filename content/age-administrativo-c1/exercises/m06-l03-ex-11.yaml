# anchor: fuente-ms-win-herramientas-sistema-html
- id: m06-l03-q387
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes descripciones corresponde al Registro, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Un registro de los eventos del sistema, la seguridad y las aplicaciones"
  - id: b
    text:
      es: "Una copia de seguridad de los archivos de sistema en una unidad USB"
  - id: c
    text:
      es: "Una lista de los programas que se ejecutan al iniciar Windows y su impacto"
  - id: d
    correct: true
    text:
      es: "Una base de datos con la configuración de bajo nivel de Windows y sus aplicaciones"
  explanation:
    es: "La página dice que el Registro es una base de datos que almacena la configuración de bajo nivel para Windows y para las aplicaciones que optan por usarlo. El registro de eventos es el Visor de eventos, la copia de los archivos de sistema en USB es la Unidad de recuperación y la lista de programas de inicio se administra en el Administrador de tareas."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Editor del Registro»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q388
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones describe lo que crea la utilidad Unidad de recuperación?"
  options:
  - id: a
    text:
      es: "Copias periódicas de las bibliotecas en una unidad externa"
  - id: b
    text:
      es: "Una conexión remota para que otra persona controle el equipo"
  - id: c
    correct: true
    text:
      es: "Un medio de recuperación USB para restaurar el equipo de fábrica"
  - id: d
    text:
      es: "Un registro detallado de los eventos del sistema y la seguridad"
  explanation:
    es: "La página dice que la utilidad Unidad de recuperación crea un medio de recuperación USB que puede restaurar el dispositivo Windows a su configuración de fábrica, incluso si se reemplaza el disco duro o se borra la unidad. Las copias periódicas son del Historial de archivos, la conexión remota es de la Asistencia rápida y el registro de eventos es del Visor de eventos."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Unidad de recuperación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q390
  prompt:
    es: "En Windows 11, ¿qué datos del usuario quedan fuera de los medios de recuperación creados con la Unidad de recuperación?"
  options:
  - id: a
    correct: true
    text:
      es: "Los archivos personales del usuario"
  - id: b
    text:
      es: "Los archivos de Windows integrados"
  - id: c
    text:
      es: "Las actualizaciones instaladas al crearlos"
  - id: d
    text:
      es: "Las personalizaciones del fabricante del equipo"
  explanation:
    es: "La página dice que los medios de recuperación no incluyen los archivos personales, por lo que hay que usar otro método de copia de seguridad, como Copias de seguridad de Windows o Historial de archivos. Los archivos de Windows integrados, las actualizaciones instaladas y las personalizaciones del fabricante sí están incluidos."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Unidad de recuperación»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q391
  prompt:
    es: "Al crear una unidad de recuperación en Windows 11, los datos que ya hay en la unidad USB:"
  options:
  - id: a
    correct: true
    text:
      es: "se borran todos"
  - id: b
    text:
      es: "se conservan y se añaden los archivos de recuperación"
  - id: c
    text:
      es: "se conservan solo los archivos personales"
  - id: d
    text:
      es: "se guardan en una carpeta aparte de la unidad"
  explanation:
    es: "La advertencia de la página dice que hay que usar una unidad USB vacía, ya que el proceso borrará todos los datos que ya estén almacenados en la unidad. Conservarlos, conservar los personales o guardarlos aparte contradice esa advertencia."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Crear una unidad de recuperación»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q392
  prompt:
    es: "En Windows 11, para incluir las últimas actualizaciones, se recomienda volver a crear los medios de recuperación:"
  options:
  - id: a
    text:
      es: "mensualmente"
  - id: b
    text:
      es: "semanalmente"
  - id: c
    text:
      es: "cada cinco años"
  - id: d
    correct: true
    text:
      es: "anualmente"
  explanation:
    es: "La página recomienda volver a crear los medios de recuperación anualmente. Mensual, semanal o cada cinco años contradicen el intervalo anual que recomienda la página."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Unidad de recuperación»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q393
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos abre la Unidad de recuperación, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "regedit"
  - id: b
    text:
      es: "wsreset.exe"
  - id: c
    correct: true
    text:
      es: "recoverydrive.exe"
  - id: d
    text:
      es: "msinfo32"
  explanation:
    es: "La página dice que la Unidad de recuperación se abre buscando Recovery Drive en Inicio o usando el comando recoverydrive.exe. regedit abre el Editor del Registro, wsreset.exe restablece la caché de Microsoft Store y msinfo32 abre Información del sistema."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Crear una unidad de recuperación»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q394
  prompt:
    es: "Al crear una unidad de recuperación en Windows 11, ¿qué opción debe estar seleccionada antes de elegir Siguiente?"
  options:
  - id: a
    text:
      es: "Solo quitar mis archivos"
  - id: b
    correct: true
    text:
      es: "Realizar una copia de seguridad de los archivos de sistema en la unidad de recuperación"
  - id: c
    text:
      es: "Limpiar completamente la unidad"
  - id: d
    text:
      es: "Recuperar desde una unidad"
  explanation:
    es: "La página dice que, cuando se abre la herramienta, hay que asegurarse de que la opción Realizar una copia de seguridad de los archivos de sistema en la unidad de recuperación está seleccionada y elegir Siguiente. Las otras tres son opciones del proceso de reinstalación con el medio de recuperación."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Crear una unidad de recuperación»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-unidad-recuperacion-html
- id: m06-l03-q395
  prompt:
    es: "Al reinstalar Windows 11 con un medio de recuperación, ¿qué se selecciona una vez cargado el Entorno de recuperación de Windows (Windows RE)?"
  options:
  - id: a
    text:
      es: "Solo quitar mis archivos"
  - id: b
    correct: true
    text:
      es: "Recuperar desde una unidad"
  - id: c
    text:
      es: "Limpiar completamente la unidad"
  - id: d
    text:
      es: "Realizar una copia de seguridad de los archivos de sistema"
  explanation:
    es: "La página dice que, una vez cargado Windows RE, se selecciona Recuperar desde una unidad. Solo quitar mis archivos y Limpiar completamente la unidad se eligen después, según las preferencias, y la copia de los archivos de sistema es el paso de creación del medio."
  citation: "fuente: `ms-win-unidad-recuperacion.html`; «Reinstalar Windows con una unidad de recuperación»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q397
  prompt:
    es: "En Windows 11, ¿qué hay que seleccionar para habilitar el Historial de archivos, una vez en su configuración del Panel de control?"
  options:
  - id: a
    text:
      es: "Seleccionar unidad"
  - id: b
    text:
      es: "Restaurar"
  - id: c
    correct: true
    text:
      es: "Activar"
  - id: d
    text:
      es: "Aceptar"
  explanation:
    es: "La página dice que se selecciona Activar para habilitar el Historial de archivos. Seleccionar unidad permite elegir otra unidad de copia, Restaurar recupera una versión anterior y Aceptar confirma la unidad elegida."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q398
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft, el Historial de archivos guarda las copias periódicas de las bibliotecas:"
  options:
  - id: a
    text:
      es: "en una carpeta oculta de la unidad C del propio equipo"
  - id: b
    text:
      es: "en la Papelera de reciclaje, hasta que se vacía"
  - id: c
    correct: true
    text:
      es: "en una unidad externa o en una ubicación de red"
  - id: d
    text:
      es: "en una unidad USB de recuperación creada con Recovery Drive"
  explanation:
    es: "La página dice que el Historial de archivos realiza copias de seguridad periódicas en una unidad externa o ubicación de red, y que hay que conectar la unidad o configurar la ubicación de red. Una carpeta oculta de la unidad C o la Papelera no son esos destinos, y la unidad USB de recuperación se crea con la Unidad de recuperación para reinstalar Windows."
  citation: "fuente: `ms-win-historial-archivos.html`; «Historial de archivos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q399
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones permite incluir en las copias del Historial de archivos una carpeta que está fuera de las bibliotecas?"
  options:
  - id: a
    correct: true
    text:
      es: "Agregarla a una biblioteca existente o a una nueva"
  - id: b
    text:
      es: "Anclarla a Acceso rápido con el clic derecho en la carpeta"
  - id: c
    text:
      es: "Anclarla al menú Inicio con el clic derecho en la carpeta"
  - id: d
    text:
      es: "Compartirla con Conceder acceso a › Personas específicas"
  explanation:
    es: "La página dice que las carpetas de otra ubicación se pueden agregar a una biblioteca existente o a una biblioteca nueva, por ejemplo con el clic derecho en la carpeta y Mostrar más opciones › Incluir en biblioteca. Anclar a Acceso rápido o a Inicio solo cambia dónde aparece la carpeta y Conceder acceso a sirve para compartirla en la red."
  citation: "fuente: `ms-win-historial-archivos.html`; «Configurar el historial de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q400
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones del menú contextual de una carpeta permite restaurar un archivo o una carpeta a un estado anterior con el Historial de archivos?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Incluir en biblioteca"
  - id: b
    text:
      es: "Abrir en el Historial de archivos"
  - id: c
    text:
      es: "Anclar a acceso rápido"
  - id: d
    correct: true
    text:
      es: "Restaurar versiones anteriores"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en el nombre de la carpeta y se selecciona Restaurar versiones anteriores. Incluir en biblioteca agrega la carpeta a una biblioteca, Abrir en el Historial de archivos solo muestra una vista previa de la versión elegida y Anclar a acceso rápido ancla la carpeta."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q402
  prompt:
    es: "En Windows 11, ¿qué enumera la pestaña Versiones anteriores de un archivo o carpeta, en la restauración con el Historial de archivos?"
  options:
  - id: a
    text:
      es: "Las unidades externas y ubicaciones de red conectadas"
  - id: b
    correct: true
    text:
      es: "Las versiones anteriores disponibles del elemento"
  - id: c
    text:
      es: "Los eventos de recuperación del sistema y de la seguridad"
  - id: d
    text:
      es: "Los archivos que están en la Papelera de reciclaje"
  explanation:
    es: "La página dice que la pestaña Versiones anteriores enumera las versiones anteriores disponibles del archivo o carpeta. Las unidades y ubicaciones de red se eligen al configurar el Historial, los eventos se ven en el Visor de eventos y la Papelera guarda temporalmente lo eliminado."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q403
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones permite obtener una vista previa del contenido de la versión seleccionada en el Historial de archivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir y, después, Abrir en el Historial de archivos"
  - id: b
    text:
      es: "Restaurar y, después, Restaurar en..."
  - id: c
    text:
      es: "Seleccionar unidad y, después, Aceptar"
  - id: d
    text:
      es: "Activar y, después, Seleccionar unidad"
  explanation:
    es: "La página dice que, para obtener una vista previa del contenido de la versión seleccionada, se expande Abrir y se selecciona Abrir en el Historial de archivos. Restaurar en... restaura a otra ubicación y las demás parejas pertenecen a la configuración de la unidad de copia."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q404
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones restaura una versión del Historial de archivos a otra ubicación, para no sobrescribir la versión actual?"
  options:
  - id: a
    correct: true
    text:
      es: "Restaurar en..."
  - id: b
    text:
      es: "Restaurar"
  - id: c
    text:
      es: "Abrir en el Historial de archivos"
  - id: d
    text:
      es: "Seleccionar unidad"
  explanation:
    es: "La página dice que, para evitar sobrescribir la versión actual, se puede restaurar a otra ubicación expandiendo Restaurar y seleccionando Restaurar en.... Restaurar reemplaza la versión actual, Abrir en el Historial de archivos solo la muestra y Seleccionar unidad elige dónde se guardan las copias."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-historial-archivos-html
- id: m06-l03-q405
  prompt:
    es: "Señale la afirmación correcta sobre la restauración de una versión con el botón Restaurar del Historial de archivos de Windows 11:"
  options:
  - id: a
    text:
      es: "El archivo o carpeta se guarda junto a la versión actual y se puede deshacer"
  - id: b
    text:
      es: "El archivo o carpeta se restaura solo a una unidad externa, sin tocar el equipo"
  - id: c
    text:
      es: "El archivo o carpeta se envía a la Papelera de reciclaje y se pierde la versión"
  - id: d
    correct: true
    text:
      es: "El archivo o carpeta reemplaza la versión actual y no se puede deshacer"
  explanation:
    es: "La advertencia de la página dice que el archivo o carpeta reemplaza la versión actual guardada en el equipo y que esta operación no se puede deshacer. Las otras afirmaciones hablan de guardar junto a la actual, de restaurar solo a una unidad externa o de enviar a la Papelera."
  citation: "fuente: `ms-win-historial-archivos.html`; «Restaurar archivos con el Historial de archivos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m06-l03-q276
  prompt:
    es: "En Windows 11, ¿qué aparece en la página Acerca de justo debajo del nombre del dispositivo?"
  options:
  - id: a
    text:
      es: "La edición de Windows que utiliza el equipo"
  - id: b
    correct: true
    text:
      es: "El nombre del modelo del dispositivo"
  - id: c
    text:
      es: "El espacio de almacenamiento disponible"
  - id: d
    text:
      es: "La cuenta de Microsoft con la que se inició sesión"
  explanation:
    es: "La página dice que el nombre del dispositivo aparece con el nombre del modelo justo debajo. La edición de Windows se comprueba en Especificaciones de Windows, según la página. Para el espacio en disco, la página indica seleccionar Sistema y elegir Almacenamiento. La cuenta de Microsoft no aparece en la página entre los datos que Acerca de muestra."
  citation: "fuente: `ms-win-info-dispositivo.html`; «El nombre del dispositivo aparece en la página, con el nombre del modelo justo debajo.»"
  difficulty: 2
  tags:
  - "concepto"
