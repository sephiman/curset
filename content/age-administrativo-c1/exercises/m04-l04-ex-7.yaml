# anchor: boe-a-1995-8730-art-12
- id: m04-l04-q210
  prompt:
    es: "Según el artículo 12.2 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, los funcionarios en expectativa de destino pasan a excedencia forzosa cuando han permanecido en aquella situación:"
  options:
  - id: a
    text:
      es: "Durante el período máximo de cinco años."
  - id: b
    text:
      es: "Durante el período máximo de seis meses."
  - id: c
    correct: true
    text:
      es: "Durante el período máximo de un año."
  - id: d
    text:
      es: "Durante el período máximo de dos años."
  explanation:
    es: "El artículo 12.2: «Los funcionarios permanecerán en esta situación un período máximo de un año, transcurrido el cual pasarán a la situación de excedencia forzosa». Seis meses es el límite de la suspensión provisional en un expediente disciplinario (art. 21.3). Dos años es la duración mínima de la excedencia por interés particular (art. 16.3) y cinco años la de la excedencia voluntaria incentivada (art. 18.4)."
  citation: "art. 12.2 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1984-17387-art-29
- id: m04-l04-q211
  prompt:
    es: "Según el artículo 29.5 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, si un funcionario pasa a expectativa de destino el lunes, 1 de junio de 2026, ¿hasta cuándo puede durar como máximo esa situación?"
  options:
  - id: a
    text:
      es: "Hasta el jueves, 1 de junio de 2028."
  - id: b
    text:
      es: "Hasta el martes, 1 de septiembre de 2026."
  - id: c
    text:
      es: "Hasta el martes, 1 de diciembre de 2026."
  - id: d
    correct: true
    text:
      es: "Hasta el martes, 1 de junio de 2027."
  explanation:
    es: "El artículo 29.5 dice que «el período máximo de duración de la situación de expectativa de destino será de un año». Un año contado de fecha a fecha desde el lunes 1 de junio de 2026 llega al martes 1 de junio de 2027; después se pasa a excedencia forzosa. El 1 de septiembre de 2026 corresponde a tres meses, el 1 de diciembre de 2026 a seis meses y el 1 de junio de 2028 a dos años."
  citation: "art. 29.5 Ley 30/1984"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8730-art-12
- id: m04-l04-q212
  prompt:
    es: "De acuerdo con el artículo 12.5 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, la situación de expectativa de destino, salvo en las retribuciones:"
  options:
  - id: a
    text:
      es: "Se equipara a la de excedencia forzosa a todos los efectos, incluidas las incompatibilidades."
  - id: b
    text:
      es: "No se equipara a ninguna otra situación ni computa a efecto alguno."
  - id: c
    text:
      es: "Se equipara a la de servicio activo, salvo en el régimen de incompatibilidades."
  - id: d
    correct: true
    text:
      es: "Se equipara a la de servicio activo a los restantes efectos, incluidas las incompatibilidades."
  explanation:
    es: "El artículo 12.5: «A los restantes efectos, incluido el régimen de incompatibilidades, esta situación se equipara a la de servicio activo». La equiparación es con el servicio activo, no con la excedencia forzosa. Las incompatibilidades están dentro de la equiparación, no fuera. Y como se equipara al servicio activo, no es cierto que no compute a ningún efecto."
  citation: "art. 12.5 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-12
- id: m04-l04-q213
  prompt:
    es: "¿Qué régimen de incompatibilidades se aplica al funcionario de la Administración General del Estado que se encuentra en situación de expectativa de destino?"
  options:
  - id: a
    text:
      es: "El mismo que se aplica al funcionario en excedencia voluntaria."
  - id: b
    text:
      es: "Ninguno mientras dure la expectativa de destino."
  - id: c
    text:
      es: "El mismo que se aplica al funcionario en excedencia forzosa."
  - id: d
    correct: true
    text:
      es: "El mismo que se aplica al funcionario en servicio activo."
  explanation:
    es: "El artículo 12.5 RD 365/1995 equipara la expectativa de destino al servicio activo, salvo en las retribuciones, «incluido el régimen de incompatibilidades». Por eso no se le aplica el régimen de otra situación, ni la excedencia forzosa ni la voluntaria, y tampoco queda libre de incompatibilidades."
  citation: "art. 12.5 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-13
- id: m04-l04-q214
  prompt:
    es: "Conforme al artículo 13.6 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, los funcionarios en excedencia forzosa tienen derecho a percibir:"
  options:
  - id: a
    text:
      es: "Las retribuciones íntegras durante los dos primeros meses de la excedencia."
  - id: b
    correct: true
    text:
      es: "Las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: c
    text:
      es: "Las retribuciones básicas y el 50 por 100 del complemento específico del último puesto."
  - id: d
    text:
      es: "Una mensualidad de retribuciones por cada año completo de servicios efectivos."
  explanation:
    es: "El artículo 13.6 reconoce a los excedentes forzosos «las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo». El 50 por 100 del complemento específico forma parte de las retribuciones de la expectativa de destino (art. 12.5). Las retribuciones íntegras de los dos primeros meses son de la excedencia por violencia de género o sexual (art. 89.5 TREBEP). La mensualidad por año de servicios es de la excedencia voluntaria incentivada (art. 18.5)."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1995-8730-art-13
- id: m04-l04-q215
  prompt:
    es: "Según el artículo 13.6 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿a qué efectos computa el tiempo pasado en excedencia forzosa?"
  options:
  - id: a
    correct: true
    text:
      es: "A efectos de derechos pasivos y de trienios."
  - id: b
    text:
      es: "A efectos de ascensos, trienios y promoción interna."
  - id: c
    text:
      es: "Solo a efectos de derechos pasivos."
  - id: d
    text:
      es: "A efectos de trienios y de consolidación del grado personal."
  explanation:
    es: "El artículo 13.6 da derecho «al cómputo del tiempo en dicha situación a efectos de derechos pasivos y de trienios». Quitar los trienios deja la regla incompleta. La consolidación del grado personal, los ascensos y la promoción interna no están en la lista del artículo."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-13
- id: m04-l04-q216
  prompt:
    es: "¿Cuál de las siguientes situaciones da derecho a percibir las retribuciones básicas, según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "La situación de excedencia voluntaria incentivada."
  - id: b
    text:
      es: "La situación de excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "La situación de excedencia voluntaria por agrupación familiar."
  - id: d
    correct: true
    text:
      es: "La situación de excedencia forzosa."
  explanation:
    es: "El artículo 13.6 reconoce a los excedentes forzosos el derecho a «percibir las retribuciones básicas». En las excedencias voluntarias no se devengan retribuciones (art. 19). La incentivada solo da derecho a una mensualidad por año completo de servicios (art. 18.5), que no son retribuciones básicas. La de interés particular y la de agrupación familiar no dan derecho a ninguna cantidad."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-1995-8730-art-13
- id: m04-l04-q217
  prompt:
    es: "Señale la respuesta correcta sobre el cómputo del tiempo de servicios según el Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "El tiempo en excedencia forzosa computa a efectos de trienios y derechos pasivos."
  - id: b
    text:
      es: "El tiempo en excedencia voluntaria por interés particular computa a efectos de trienios."
  - id: c
    text:
      es: "El tiempo en expectativa de destino no computa a efectos de trienios ni derechos pasivos."
  - id: d
    text:
      es: "El tiempo en excedencia voluntaria incentivada computa a efectos de trienios y derechos pasivos."
  explanation:
    es: "El artículo 13.6 da a los excedentes forzosos el cómputo del tiempo «a efectos de derechos pasivos y de trienios». En cambio, en las excedencias voluntarias, incentivada e interés particular incluidas, el tiempo no computa «a efectos de promoción, trienios y derechos pasivos» (art. 19). La expectativa de destino se equipara al servicio activo salvo en las retribuciones (art. 12.5), así que su tiempo sí computa."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q218
  prompt:
    es: "De acuerdo con el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, durante la excedencia voluntaria incentivada el funcionario:"
  options:
  - id: a
    text:
      es: "Puede desempeñar puestos en el sector público si obtiene la oportuna compatibilidad."
  - id: b
    text:
      es: "No puede desempeñar puestos en la Administración General del Estado, pero sí en otras."
  - id: c
    correct: true
    text:
      es: "No puede desempeñar puestos en el sector público bajo ningún tipo de relación."
  - id: d
    text:
      es: "Puede desempeñar puestos en el sector público solo como personal laboral temporal."
  explanation:
    es: "El artículo 18.4 dice que la excedencia incentivada «impedirá desempeñar puestos de trabajo en el sector público, bajo ningún tipo de relación funcionarial o contractual, sea ésta de naturaleza laboral o administrativa». No hay excepción para el laboral temporal ni para quien obtenga compatibilidad. La prohibición alcanza a todo el sector público, no solo a la Administración General del Estado."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q219
  prompt:
    es: "Según el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿qué ocurre si, concluidos los cinco años de excedencia voluntaria incentivada, el funcionario no pide el reingreso dentro del mes siguiente?"
  options:
  - id: a
    text:
      es: "Se le declara en expectativa de destino durante un año."
  - id: b
    text:
      es: "Pierde de forma automática la condición de funcionario de carrera."
  - id: c
    correct: true
    text:
      es: "Se le declara en excedencia voluntaria por interés particular."
  - id: d
    text:
      es: "Reingresa de oficio con adscripción provisional a un puesto."
  explanation:
    es: "El artículo 18.4: si no se solicita el reingreso dentro del mes siguiente al final del período, el departamento «le declarará en excedencia voluntaria por interés particular». La expectativa de destino es la situación de quien no obtiene puesto en las dos primeras fases de una reasignación de efectivos (art. 12.1). La pérdida de la condición sigue a la falta de reingreso al final de la excedencia por interés particular (art. 16.4). El reingreso por adscripción provisional exige que el funcionario lo pida (art. 62.2 RD 364/1995)."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q220
  prompt:
    es: "Señale la respuesta correcta sobre la excedencia voluntaria incentivada regulada en el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "Dura como máximo quince años e impide desempeñar puestos en el sector público."
  - id: b
    correct: true
    text:
      es: "Dura cinco años e impide desempeñar puestos de trabajo en el sector público."
  - id: c
    text:
      es: "Dura cinco años y permite desempeñar puestos en el sector público como laboral."
  - id: d
    text:
      es: "Dura lo que el plan de empleo e impide desempeñar puestos en el sector público."
  explanation:
    es: "El artículo 18.4: la excedencia incentivada «tendrá una duración de cinco años e impedirá desempeñar puestos de trabajo en el sector público, bajo ningún tipo de relación funcionarial o contractual, sea ésta de naturaleza laboral o administrativa». La prohibición incluye la relación laboral. Quince años es el máximo de la excedencia por interés particular y de la de agrupación familiar (arts. 16.3 y 17). La duración no depende del plan de empleo: es fija."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q221
  prompt:
    es: "¿Cuál de las siguientes situaciones tiene una duración fija de cinco años, según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "La situación de excedencia voluntaria por agrupación familiar."
  - id: b
    text:
      es: "La situación de expectativa de destino."
  - id: c
    text:
      es: "La excedencia voluntaria por prestación de servicios en el sector público."
  - id: d
    correct: true
    text:
      es: "La situación de excedencia voluntaria incentivada."
  explanation:
    es: "El artículo 18.4 dice que la excedencia incentivada «tendrá una duración de cinco años». La expectativa de destino dura un máximo de un año (art. 12.2). La excedencia por prestación de servicios en el sector público dura lo que la relación que la originó (art. 15.3). La de agrupación familiar va de dos a quince años (art. 17)."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q222
  prompt:
    es: "Conforme al artículo 18.5 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, la mensualidad de la excedencia voluntaria incentivada se calcula sobre las retribuciones de carácter periódico:"
  options:
  - id: a
    text:
      es: "Excluida solo la productividad, según la media de los doce meses anteriores."
  - id: b
    correct: true
    text:
      es: "Excluidas las pagas extraordinarias y la productividad, devengadas en el último puesto desempeñado."
  - id: c
    text:
      es: "Excluidas las pagas extraordinarias y el complemento específico, del puesto de mayor nivel desempeñado."
  - id: d
    text:
      es: "Incluidas las pagas extraordinarias y la productividad, devengadas en el último puesto desempeñado."
  explanation:
    es: "El artículo 18.5 da una mensualidad «de las retribuciones de carácter periódico, excluidas las pagas extraordinarias y el complemento de productividad, devengadas en el último puesto de trabajo desempeñado». Incluir las pagas extraordinarias y la productividad invierte las dos exclusiones. Excluir solo la productividad deja dentro las pagas extraordinarias, que el apartado excluye. Excluir el complemento específico cambia la segunda exclusión, que es la productividad. Referirse al puesto de mayor nivel o a la media de los doce meses anteriores sustituye «el último puesto de trabajo desempeñado»."
  citation: "art. 18.5 RD 365/1995"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q223
  prompt:
    es: "Un funcionario con quince años y ocho meses de servicios efectivos pasa a excedencia voluntaria incentivada. ¿Cuántas mensualidades de retribuciones de carácter periódico le corresponden?"
  options:
  - id: a
    correct: true
    text:
      es: "Doce mensualidades de retribuciones periódicas."
  - id: b
    text:
      es: "Cinco mensualidades de retribuciones periódicas."
  - id: c
    text:
      es: "Quince mensualidades de retribuciones periódicas."
  - id: d
    text:
      es: "Dieciséis mensualidades de retribuciones periódicas."
  explanation:
    es: "El artículo 18.5 RD 365/1995 da una mensualidad «por cada año completo de servicios efectivos y con un máximo de doce mensualidades». Quince años completos darían quince, pero el tope es doce. Dieciséis redondea al alza los ocho meses, que no forman un año completo, y además supera el tope. Cinco es la duración en años de esta excedencia, no el número de mensualidades."
  citation: "art. 18.5 RD 365/1995"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-1995-8730-art-18
- id: m04-l04-q224
  prompt:
    es: "Según el artículo 18.5 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿cuántas mensualidades corresponden a quien pasa a excedencia voluntaria incentivada con nueve años y once meses de servicios efectivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Nueve mensualidades de retribuciones periódicas."
  - id: b
    text:
      es: "Doce mensualidades de retribuciones periódicas."
  - id: c
    text:
      es: "Diez mensualidades de retribuciones periódicas."
  - id: d
    text:
      es: "Cinco mensualidades de retribuciones periódicas."
  explanation:
    es: "El artículo 18.5 da una mensualidad «por cada año completo de servicios efectivos y con un máximo de doce mensualidades». Nueve años y once meses son nueve años completos: nueve mensualidades. Diez redondea al alza una fracción de año que no cuenta. Doce es el máximo, que solo alcanza quien tiene doce años completos o más. Cinco son los años que dura la excedencia."
  citation: "art. 18.5 RD 365/1995"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-1995-8730-art-19
- id: m04-l04-q225
  prompt:
    es: "De acuerdo con el artículo 19 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, las distintas modalidades de excedencia voluntaria:"
  options:
  - id: a
    correct: true
    text:
      es: "No producen, en ningún caso, reserva de puesto de trabajo."
  - id: b
    text:
      es: "Producen reserva de un puesto en la misma localidad y de igual retribución."
  - id: c
    text:
      es: "Producen reserva del puesto de trabajo durante los seis primeros meses."
  - id: d
    text:
      es: "Producen reserva del puesto de trabajo durante los dos primeros años."
  explanation:
    es: "El artículo 19: las modalidades de excedencia voluntaria «no producen, en ningún caso, reserva de puesto de trabajo». La reserva durante dos años y la posterior en la misma localidad y con igual retribución son de la excedencia por cuidado de familiares (art. 89.4 TREBEP). Los seis primeros meses de reserva son de la excedencia por violencia de género o sexual (art. 89.5 TREBEP). Ninguna de las dos es una excedencia voluntaria."
  citation: "art. 19 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-19
- id: m04-l04-q227
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las excedencias voluntarias es correcta, según el Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Ninguna da derecho a percibir cantidad alguna, tampoco la incentivada."
  - id: b
    text:
      es: "La de interés particular da derecho a una mensualidad por año completo de servicios."
  - id: c
    correct: true
    text:
      es: "Solo la incentivada da derecho a una cantidad: una mensualidad por año completo de servicios."
  - id: d
    text:
      es: "Todas dan derecho a las retribuciones básicas durante los dos primeros meses."
  explanation:
    es: "El artículo 19 dice que en las excedencias voluntarias no se devengan retribuciones, «salvo lo previsto en el apartado 5 del artículo anterior»: la mensualidad de la incentivada por cada año completo de servicios efectivos (art. 18.5). Ninguna excedencia voluntaria da retribuciones básicas. La mensualidad no corresponde a la de interés particular. Negar también la de la incentivada borra la única excepción del artículo."
  citation: "art. 19 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-art-90
- id: m04-l04-q228
  prompt:
    es: "De acuerdo con el artículo 90.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario declarado en suspensión queda privado, mientras permanece en ella:"
  options:
  - id: a
    correct: true
    text:
      es: "Del ejercicio de sus funciones y de todos los derechos inherentes a la condición."
  - id: b
    text:
      es: "Del ejercicio de sus funciones, pero conserva los derechos inherentes a la condición."
  - id: c
    text:
      es: "De sus retribuciones complementarias, pero no del ejercicio de sus funciones."
  - id: d
    text:
      es: "Del ejercicio de sus funciones y de la condición de funcionario de carrera."
  explanation:
    es: "El artículo 90.1: el suspenso «quedará privado durante el tiempo de permanencia en la misma del ejercicio de sus funciones y de todos los derechos inherentes a la condición». Pierde también los derechos, así que no los conserva. Pierde el ejercicio de las funciones, no solo una parte de las retribuciones. No pierde la condición de funcionario: la suspensión es una situación administrativa del funcionario (art. 85.1 TREBEP)."
  citation: "art. 90.1 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-90
- id: m04-l04-q229
  prompt:
    es: "Según el artículo 90.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuándo determina la suspensión de funciones la pérdida del puesto de trabajo?"
  options:
  - id: a
    text:
      es: "Cuando la suspensión exceda de dos años."
  - id: b
    text:
      es: "Cuando la suspensión exceda de un año."
  - id: c
    text:
      es: "Cuando la suspensión exceda de tres meses."
  - id: d
    correct: true
    text:
      es: "Cuando la suspensión exceda de seis meses."
  explanation:
    es: "El artículo 90.1: «La suspensión determinará la pérdida del puesto de trabajo cuando exceda de seis meses». Los tres meses, el año y los dos años no son el umbral del artículo."
  citation: "art. 90.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-art-90
- id: m04-l04-q230
  prompt:
    es: "A un funcionario de carrera se le impone, por sanción disciplinaria, una suspensión firme de funciones de cuatro meses. ¿Pierde por ello su puesto de trabajo?"
  options:
  - id: a
    text:
      es: "Sí, porque toda suspensión firme determina la pérdida del puesto."
  - id: b
    correct: true
    text:
      es: "No, porque la suspensión no excede de seis meses."
  - id: c
    text:
      es: "No, salvo que la sanción se imponga por una falta muy grave."
  - id: d
    text:
      es: "Sí, porque la suspensión firme excede de tres meses."
  explanation:
    es: "El artículo 90.1 TREBEP dice que la suspensión determina la pérdida del puesto «cuando exceda de seis meses»; el artículo 22.1 RD 365/1995 dice lo mismo para la firme. Cuatro meses no superan ese límite, así que el funcionario conserva el puesto. No toda suspensión firme hace perder el puesto, y el umbral no es de tres meses. La gravedad de la falta no cambia la regla: el criterio es solo la duración."
  citation: "art. 90.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2015-11719-art-90
- id: m04-l04-q231
  prompt:
    es: "Conforme al artículo 90.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la suspensión firme se impone:"
  options:
  - id: a
    text:
      es: "Solo en virtud de sanción disciplinaria por la comisión de una falta muy grave."
  - id: b
    text:
      es: "Por acuerdo del órgano que ordenó la incoación del expediente disciplinario."
  - id: c
    correct: true
    text:
      es: "En virtud de sentencia dictada en causa criminal o de sanción disciplinaria."
  - id: d
    text:
      es: "En virtud de sentencia dictada en causa criminal, nunca por sanción disciplinaria."
  explanation:
    es: "El artículo 90.2: «La suspensión firme se impondrá en virtud de sentencia dictada en causa criminal o en virtud de sanción disciplinaria». Caben las dos vías, así que son incorrectas la que solo admite la sanción y la que solo admite la sentencia. El acuerdo de la autoridad que ordenó incoar el expediente es la vía de la suspensión provisional (art. 21.3 RD 365/1995), no de la firme."
  citation: "art. 90.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-90
- id: m04-l04-q232
  prompt:
    es: "Según el artículo 90.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué duración máxima tiene la suspensión firme impuesta por sanción disciplinaria?"
  options:
  - id: a
    text:
      es: "No puede exceder de seis meses."
  - id: b
    text:
      es: "No puede exceder de cuatro años."
  - id: c
    text:
      es: "No puede exceder de tres años."
  - id: d
    correct: true
    text:
      es: "No puede exceder de seis años."
  explanation:
    es: "El artículo 90.2: «La suspensión firme por sanción disciplinaria no podrá exceder de seis años». Seis meses es el límite de la suspensión provisional en un expediente disciplinario (art. 21.3 RD 365/1995) y el umbral de la pérdida del puesto (art. 90.1). Tres y cuatro años no aparecen en el artículo."
  citation: "art. 90.2 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-21
- id: m04-l04-q233
  prompt:
    es: "Según el artículo 21.1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿durante qué procedimientos puede acordarse la suspensión provisional de funciones?"
  options:
  - id: a
    text:
      es: "Durante la tramitación de un expediente de compatibilidad o disciplinario."
  - id: b
    correct: true
    text:
      es: "Durante la tramitación de un procedimiento judicial o disciplinario."
  - id: c
    text:
      es: "Solo durante la tramitación de un procedimiento penal contra el funcionario."
  - id: d
    text:
      es: "Solo durante la tramitación de un expediente disciplinario por falta muy grave."
  explanation:
    es: "El artículo 21.1: «La suspensión provisional podrá acordarse preventivamente durante la tramitación de un procedimiento judicial o disciplinario». Caben los dos procedimientos, sin limitarlos a las faltas muy graves ni a la vía penal. El expediente de compatibilidad no está entre ellos."
  citation: "art. 21.1 RD 365/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8730-art-21
- id: m04-l04-q234
  prompt:
    es: "De acuerdo con el artículo 21.3 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, la suspensión provisional acordada en un expediente disciplinario no puede exceder de seis meses:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo en caso de paralización del procedimiento imputable al interesado."
  - id: b
    text:
      es: "Salvo en caso de paralización del procedimiento imputable a la Administración."
  - id: c
    text:
      es: "Salvo que el expediente se tramite por la comisión de una falta muy grave."
  - id: d
    text:
      es: "Salvo prórroga por otros seis meses mediante resolución motivada."
  explanation:
    es: "El artículo 21.3 dice que la suspensión provisional no puede exceder de seis meses, «salvo en caso de paralización del procedimiento imputable al interesado». Esa es la única excepción del apartado. La paralización imputable a la Administración no alarga la suspensión, porque el apartado habla del interesado. La gravedad de la falta tampoco es excepción, ni lo es una prórroga de otros seis meses por resolución motivada: el apartado fija un tope de seis meses y una sola salvedad."
  citation: "art. 21.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1995-8730-art-21
- id: m04-l04-q235
  prompt:
    es: "En un expediente disciplinario se acuerda la suspensión provisional de un funcionario con efectos del lunes, 2 de marzo de 2026. Si no hay paralización imputable al interesado, ¿hasta cuándo puede durar como máximo?"
  options:
  - id: a
    text:
      es: "Hasta el martes, 2 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el martes, 2 de marzo de 2032."
  - id: c
    correct: true
    text:
      es: "Hasta el miércoles, 2 de septiembre de 2026."
  - id: d
    text:
      es: "Hasta el martes, 2 de junio de 2026."
  explanation:
    es: "El artículo 21.3 RD 365/1995 limita la suspensión provisional en un expediente disciplinario a seis meses, salvo paralización imputable al interesado. El artículo 98.3 TREBEP pone el mismo límite. Seis meses contados de fecha a fecha desde el lunes 2 de marzo de 2026 llegan al miércoles 2 de septiembre de 2026. El 2 de junio corresponde a tres meses y el 2 de marzo de 2027, a un año. El 2 de marzo de 2032 aplica los seis años, que son el máximo de la suspensión firme por sanción (art. 90.2 TREBEP)."
  citation: "art. 21.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
