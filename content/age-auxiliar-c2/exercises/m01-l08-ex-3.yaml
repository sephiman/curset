# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q108
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quién nombra y separa a los titulares de los órganos directivos del Ministerio si la competencia no está atribuida a otro órgano?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro."
  - id: b
    text:
      es: "El Presidente del Gobierno."
  - id: c
    text:
      es: "El Secretario general técnico."
  - id: d
    text:
      es: "El Delegado del Gobierno."
  explanation:
    es: "El artículo 61.f atribuye al Ministro esos nombramientos y ceses cuando no corresponden al Consejo de Ministros, a otro órgano o al propio organismo. El Presidente del Gobierno, un Secretario general técnico o un Delegado del Gobierno no tienen esa competencia general."
  citation: "art. 61.f LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1997-25336-art-4
