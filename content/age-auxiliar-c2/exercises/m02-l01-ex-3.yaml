# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q050
  prompt:
    es: "¿Qué principio en materia de discapacidad supone que las actuaciones de las Administraciones Públicas comprendan las políticas generales de cualquier ámbito y no solo planes y acciones específicos para estas personas?"
  options:
  - id: a
    text:
      es: "El diálogo civil."
  - id: b
    correct: true
    text:
      es: "La transversalidad de las políticas."
  - id: c
    text:
      es: "Los ajustes razonables."
  - id: d
    text:
      es: "La igualdad de oportunidades."
  explanation:
    es: "La transversalidad del artículo 2.o) obliga a incluir las necesidades de las personas con discapacidad en las políticas generales. El diálogo civil se refiere a la participación de las organizaciones de personas con discapacidad, los ajustes razonables a las adaptaciones al caso concreto y la igualdad de oportunidades a la ausencia de discriminación."
  citation: "art. 2.o) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-28
- id: m02-l01-q051
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, las condiciones básicas de accesibilidad y no discriminación de las oficinas públicas, dispositivos y servicios de atención al ciudadano son exigibles en:"
  options:
  - id: a
    correct: true
    text:
      es: "Los plazos y términos establecidos reglamentariamente."
  - id: b
    text:
      es: "Los plazos y términos que fije cada Administración por convenio."
  - id: c
    text:
      es: "Cualquier momento, desde la entrada en vigor de la ley."
  - id: d
    text:
      es: "Los plazos que determine la Conferencia Sectorial de Asuntos Sociales."
  explanation:
    es: "El artículo 28.1 remite a los plazos y términos establecidos reglamentariamente. No los fija cada Administración por convenio, no son exigibles desde la entrada en vigor de la ley sin más y no los determina la Conferencia Sectorial."
  citation: "art. 28.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q054
  prompt:
    es: "Conforme al Real Decreto 366/2007, de 16 de marzo, las condiciones de accesibilidad que regula se aplican a las Oficinas de Atención al Ciudadano, los impresos y cualquier otro medio que la Administración General del Estado dedica específicamente a:"
  options:
  - id: a
    text:
      es: "La gestión interna de sus empleados."
  - id: b
    correct: true
    text:
      es: "Las relaciones con los ciudadanos."
  - id: c
    text:
      es: "La contratación de obras y servicios."
  - id: d
    text:
      es: "La formación de su personal."
  explanation:
    es: "El artículo 1.1 se refiere a los medios que la Administración General del Estado dedica específicamente a las relaciones con los ciudadanos. La gestión interna de empleados, la contratación y la formación del personal no son el objeto de esa regulación."
  citation: "art. 1.1 RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q055
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, los modelos normalizados son uno de los dos medios preferentes de relación con los ciudadanos que deben cumplir las condiciones de accesibilidad, junto con:"
  options:
  - id: a
    correct: true
    text:
      es: "Las Oficinas de Atención al Ciudadano."
  - id: b
    text:
      es: "Las sedes electrónicas de cada departamento."
  - id: c
    text:
      es: "Las unidades de información administrativa."
  - id: d
    text:
      es: "Los servicios de atención telefónica."
  explanation:
    es: "El artículo 1.2 enumera dos medios preferentes: las Oficinas de Atención al Ciudadano y los modelos normalizados. Las sedes electrónicas, las unidades de información administrativa y los servicios telefónicos no figuran en esa enumeración, que contiene solo esas dos letras."
  citation: "art. 1.2 RD 366/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q057
  prompt:
    es: "¿Cómo se denomina, a efectos de accesibilidad, el impreso que la Administración General del Estado pone a disposición de los ciudadanos para formular una alegación?"
  options:
  - id: a
    text:
      es: "Documento básico de información."
  - id: b
    text:
      es: "Formato alternativo."
  - id: c
    text:
      es: "Medio auxiliar facilitador."
  - id: d
    correct: true
    text:
      es: "Modelo normalizado."
  explanation:
    es: "El artículo 1.2.b) llama modelos normalizados a los impresos para formular solicitudes, declaraciones, alegaciones o recursos. El documento básico de información, el formato alternativo y el medio auxiliar son conceptos de los artículos 12 a 14 con otro contenido."
  citation: "art. 1.2.b) RD 366/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q058
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la Administración General del Estado asegura a los ciudadanos con discapacidad la efectividad de sus derechos mediante la garantía de la igualdad de oportunidades, la no discriminación por razón de discapacidad y:"
  options:
  - id: a
    text:
      es: "El diseño universal."
  - id: b
    correct: true
    text:
      es: "La accesibilidad universal."
  - id: c
    text:
      es: "La inclusión social."
  - id: d
    text:
      es: "La igualdad de trato."
  explanation:
    es: "El artículo 2.a) termina con la accesibilidad universal. El diseño universal y la inclusión son conceptos del texto refundido de 2013, y la igualdad de trato no forma parte de esa letra."
  citation: "art. 2.a) RD 366/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q059
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la Administración General del Estado asegura los derechos de los ciudadanos con discapacidad mediante la puesta a disposición, en su caso, de medios y apoyos:"
  options:
  - id: a
    text:
      es: "Técnicos y económicos permanentes."
  - id: b
    text:
      es: "Personales e informáticos sustitutivos."
  - id: c
    text:
      es: "Humanos y financieros excepcionales."
  - id: d
    correct: true
    text:
      es: "Humanos y materiales suplementarios."
  explanation:
    es: "El artículo 2.c) habla de medios y apoyos humanos y materiales suplementarios. Los técnicos y económicos permanentes, los personales e informáticos sustitutivos o los humanos y financieros excepcionales alteran la naturaleza o el carácter suplementario de esos apoyos."
  citation: "art. 2.c) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-3
- id: m02-l01-q060
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la Administración General del Estado determina las Oficinas de Atención al Ciudadano que han de ajustarse a las condiciones de accesibilidad mediante:"
  options:
  - id: a
    text:
      es: "Orden del Ministerio de Trabajo y Asuntos Sociales, previo informe del Consejo Nacional de la Discapacidad."
  - id: b
    text:
      es: "Real Decreto del Consejo de Ministros, a propuesta del departamento al que pertenezca cada Oficina."
  - id: c
    correct: true
    text:
      es: "Resolución de la Secretaría General para la Administración Pública, previa consulta con los Departamentos Ministeriales afectados."
  - id: d
    text:
      es: "Resolución de la Subsecretaría de cada departamento, previa consulta con las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 3 atribuye la determinación a una resolución de la Secretaría General para la Administración Pública, previa consulta con los Departamentos Ministeriales afectados. Ni una orden ministerial, ni un real decreto del Consejo de Ministros, ni una resolución de cada Subsecretaría con consulta a las Delegaciones del Gobierno son el instrumento ni el procedimiento del artículo."
  citation: "art. 3 RD 366/2007"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2007-6239-art-3
- id: m02-l01-q061
  prompt:
    es: "Tras determinar las Oficinas de Atención al Ciudadano que han de ajustarse a las condiciones de accesibilidad, ¿qué debe hacer la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Hacer pública una relación de ellas, permanentemente actualizada."
  - id: b
    text:
      es: "Elaborar una relación reservada a los Departamentos Ministeriales afectados."
  - id: c
    text:
      es: "Publicar la relación una sola vez, sin actualizaciones posteriores."
  - id: d
    text:
      es: "Notificar la determinación únicamente a cada Oficina afectada."
  explanation:
    es: "El artículo 3 manda hacer pública una relación permanentemente actualizada y a disposición pública. Una relación reservada a los departamentos, una publicación única sin actualizar o una notificación solo a las Oficinas contradicen esa publicidad permanente."
  citation: "art. 3 RD 366/2007"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q062
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la Administración General del Estado ubicará las Oficinas de Atención al Ciudadano en entornos que garanticen:"
  options:
  - id: a
    text:
      es: "La proximidad a los centros de transporte público."
  - id: b
    text:
      es: "La seguridad de los empleados públicos."
  - id: c
    correct: true
    text:
      es: "El acceso de las personas con discapacidad."
  - id: d
    text:
      es: "La afluencia del mayor número de ciudadanos."
  explanation:
    es: "El artículo 4.1 exige entornos que garanticen el acceso de las personas con discapacidad. La proximidad al transporte, la seguridad de los empleados y la afluencia de ciudadanos no son el criterio del artículo."
  citation: "art. 4.1 RD 366/2007"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q063
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, las decisiones sobre la ubicación de las Oficinas de Atención al Ciudadano tendrán en consideración las siguientes:"
  options:
  - id: a
    text:
      es: "Prescripciones obligatorias de accesibilidad."
  - id: b
    text:
      es: "Autorizaciones previas de accesibilidad."
  - id: c
    text:
      es: "Resoluciones singulares de accesibilidad."
  - id: d
    correct: true
    text:
      es: "Recomendaciones de accesibilidad."
  explanation:
    es: "El artículo 4.2 enumera recomendaciones que se tienen en consideración al decidir la ubicación. No son prescripciones obligatorias, autorizaciones previas ni resoluciones singulares."
  citation: "art. 4.2 RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q064
  prompt:
    es: "Para el Real Decreto 366/2007, de 16 de marzo, la ubicación de la Oficina de Atención al Ciudadano en planta a nivel de la vía pública es una recomendación:"
  options:
  - id: a
    correct: true
    text:
      es: "Preferente, siempre que resulte posible."
  - id: b
    text:
      es: "Obligatoria en todo caso."
  - id: c
    text:
      es: "Exigible solo a las Oficinas de nueva creación."
  - id: d
    text:
      es: "Sustituible por cualquier otra ubicación sin condiciones."
  explanation:
    es: "El artículo 4.2.a) la formula con carácter preferente y siempre que resulte posible; no es obligatoria en todo caso. Tampoco se limita a las Oficinas nuevas, y no es sustituible sin condiciones: si no se cumple, el propio artículo exige rampas o ascensores."
  citation: "art. 4.2.a) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q065
  prompt:
    es: "Según las recomendaciones de ubicación del Real Decreto 366/2007, de 16 de marzo, la Oficina de Atención al Ciudadano debe estar correctamente señalizada visualmente desde:"
  options:
  - id: a
    text:
      es: "El vestíbulo de recepción."
  - id: b
    correct: true
    text:
      es: "El exterior de la Oficina."
  - id: c
    text:
      es: "Los puestos de atención."
  - id: d
    text:
      es: "Las zonas de espera."
  explanation:
    es: "El artículo 4.2.b) pide una señalización visual correcta desde el exterior, para que la Oficina sea fácilmente identificable. El vestíbulo, los puestos de atención y las zonas de espera están en el interior; su señalización interior se trata en otros artículos."
  citation: "art. 4.2.b) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q067
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, las plazas de aparcamiento que reserven las Oficinas de Atención al Ciudadano estarán destinadas en exclusividad a:"
  options:
  - id: a
    text:
      es: "Visitantes con cita previa."
  - id: b
    text:
      es: "Empleados de la Oficina con discapacidad."
  - id: c
    text:
      es: "Vehículos oficiales de la Administración."
  - id: d
    correct: true
    text:
      es: "Personas con movilidad reducida."
  explanation:
    es: "El artículo 4.2.d) destina esas plazas en exclusividad a personas con movilidad reducida. Los visitantes con cita, los empleados con discapacidad y los vehículos oficiales no son sus destinatarios."
  citation: "art. 4.2.d) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q069
  prompt:
    es: "Según las recomendaciones de señalización interior del Real Decreto 366/2007, de 16 de marzo, los paneles de información gráfica, además de situarse paralelamente a la dirección de la marcha y adyacentes a una pared:"
  options:
  - id: a
    correct: true
    text:
      es: "No se protegerán con cristales."
  - id: b
    text:
      es: "Se protegerán con cristales antirreflectantes."
  - id: c
    text:
      es: "Se instalarán sobre soportes giratorios."
  - id: d
    text:
      es: "Se cubrirán con una lámina translúcida."
  explanation:
    es: "El artículo 7.a) dice que los paneles no se protegerán con cristales. Un cristal antirreflectante, un soporte giratorio o una lámina translúcida contradicen esa recomendación o no figuran en ella."
  citation: "art. 7.a) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q070
  prompt:
    es: "Las tres modalidades sensoriales a las que se refiere la señalización interior accesible del Real Decreto 366/2007, de 16 de marzo, son:"
  options:
  - id: a
    text:
      es: "Visual, acústica y gestual."
  - id: b
    text:
      es: "Visual, textual y táctil."
  - id: c
    text:
      es: "Acústica, táctil y olfativa."
  - id: d
    correct: true
    text:
      es: "Visual, acústica y táctil."
  explanation:
    es: "El artículo 7.c) menciona las modalidades visual, acústica y táctil. La gestual, la textual y la olfativa no figuran entre ellas."
  citation: "art. 7.c) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q071
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, los puntos con información telefónica estarán dotados con sistemas de telefonía de texto, de fax y, de permitirlo técnicamente, de:"
  options:
  - id: a
    text:
      es: "Sistemas de mensajería instantánea."
  - id: b
    text:
      es: "Sistemas de telefonía por internet."
  - id: c
    correct: true
    text:
      es: "Sistemas de videotelefonía."
  - id: d
    text:
      es: "Sistemas de buzón de voz."
  explanation:
    es: "El artículo 8.2.e) añade la videotelefonía, si es técnicamente posible, para facilitar la lectura labial. La mensajería instantánea, la telefonía por internet y el buzón de voz no son los sistemas que cita."
  citation: "art. 8.2.e) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-11
- id: m02-l01-q072
  prompt:
    es: "Si concurren circunstancias de infraestructura o protección del patrimonio que hagan imposible su aplicación, el Real Decreto 366/2007, de 16 de marzo, permite exceptuar las condiciones de accesibilidad de las Oficinas:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma parcial."
  - id: b
    text:
      es: "De forma total."
  - id: c
    text:
      es: "De forma temporal."
  - id: d
    text:
      es: "De forma gradual."
  explanation:
    es: "El artículo 11.1 habla de excepciones parciales. No permite una exención total y no prevé una exención temporal o gradual."
  citation: "art. 11.1 RD 366/2007"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2007-6239-art-12
- id: m02-l01-q073
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la disponibilidad de los documentos e impresos en condiciones de plena accesibilidad se garantiza mediante su ubicación en estantes, dispensadores u otro mobiliario que permitan:"
  options:
  - id: a
    text:
      es: "La atención de estas personas por un empleado especializado."
  - id: b
    correct: true
    text:
      es: "La máxima autonomía de estas personas para obtenerlos."
  - id: c
    text:
      es: "La entrega exclusiva a través del personal de apoyo."
  - id: d
    text:
      es: "El control de su distribución por la propia Oficina."
  explanation:
    es: "El artículo 12.1 busca la máxima autonomía de las personas con discapacidad para obtener los documentos. Atención de un empleado, entrega exclusiva por personal de apoyo o control de la distribución por la Oficina limitan esa autonomía."
  citation: "art. 12.1 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-12
- id: m02-l01-q074
  prompt:
    es: "¿En qué formato deben estar disponibles en todo caso, en las páginas web correspondientes, los documentos e impresos destinados al ciudadano en la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Formato electrónico accesible."
  - id: b
    text:
      es: "Formato electrónico editable."
  - id: c
    text:
      es: "Formato electrónico comprimido."
  - id: d
    text:
      es: "Papel y formato electrónico estándar."
  explanation:
    es: "El artículo 12.3 exige formato electrónico accesible. Editable, comprimido o estándar no garantizan la accesibilidad que pide el artículo."
  citation: "art. 12.3 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-13
- id: m02-l01-q077
  prompt:
    es: "Desde el 2 de enero de 2027, según el artículo 13.1 del Real Decreto 366/2007, de 16 de marzo, los documentos, impresos y demás documentación deben cumplir los requisitos del artículo 10 del:"
  options:
  - id: a
    text:
      es: "Reglamento general de protección de datos."
  - id: b
    text:
      es: "Reglamento de accesibilidad de los sitios web del sector público."
  - id: c
    text:
      es: "Reglamento de ejecución de la Ley General de derechos de las personas con discapacidad."
  - id: d
    correct: true
    text:
      es: "Reglamento de las condiciones básicas de accesibilidad cognitiva."
  explanation:
    es: "El artículo 13.1, con la redacción del Real Decreto 707/2026 que entra en vigor el 2 de enero de 2027, remite al artículo 10 del Reglamento de las condiciones básicas de accesibilidad cognitiva. Los reglamentos de protección de datos, de accesibilidad de sitios web y de ejecución de la ley general no son la norma a la que remite."
  citation: "art. 13.1 RD 366/2007"
  difficulty: 3
  tags:
  - "requisito"
  - "fecha"
# anchor: boe-a-2007-6239-art-13
- id: m02-l01-q078
  prompt:
    es: "En los impresos destinados a cumplimentación por los ciudadanos, según el Real Decreto 366/2007, de 16 de marzo, se evitará la utilización de:"
  options:
  - id: a
    text:
      es: "Espacios apropiados en tamaño para rellenarlos con comodidad."
  - id: b
    text:
      es: "Instrucciones claras y concisas junto al impreso."
  - id: c
    text:
      es: "Tipografías grandes o ampliadas en el cuerpo del texto."
  - id: d
    correct: true
    text:
      es: "Fondos con dibujos y tintas que presenten poco contraste."
  explanation:
    es: "El artículo 13.2 manda evitar los fondos con dibujos y tintas de poco contraste. Los espacios apropiados en tamaño y las instrucciones claras son exigencias del mismo apartado, y las tipografías grandes son un formato alternativo del artículo 12.2: no se evitan."
  citation: "art. 13.2 RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-13
- id: m02-l01-q079
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, los impresos destinados a cumplimentación por los ciudadanos deberán ir acompañados de:"
  options:
  - id: a
    text:
      es: "Un modelo cumplimentado a modo de ejemplo."
  - id: b
    text:
      es: "Un resumen jurídico del procedimiento."
  - id: c
    correct: true
    text:
      es: "Instrucciones claras y concisas."
  - id: d
    text:
      es: "Un listado de siglas y abreviaturas."
  explanation:
    es: "El artículo 13.2 exige instrucciones claras y concisas. Un modelo cumplimentado, un resumen jurídico y un listado de siglas no figuran en el apartado; el listado de siglas choca con la vieja exigencia de no usarlas."
  citation: "art. 13.2 RD 366/2007"
