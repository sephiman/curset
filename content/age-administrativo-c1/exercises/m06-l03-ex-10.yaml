# anchor: fuente-ms-win-calculadora-html
- id: m06-l03-q367
  prompt:
    es: "En la Calculadora de Windows 11, ¿qué menú se selecciona para cambiar entre los modos de cálculo?"
  options:
  - id: a
    text:
      es: "Historial"
  - id: b
    correct: true
    text:
      es: "Abrir navegación (☰)"
  - id: c
    text:
      es: "Mantener en la parte superior"
  - id: d
    text:
      es: "Moneda"
  explanation:
    es: "La página dice que el menú Abrir navegación (☰) permite cambiar entre los modos Standard, Científica, Gráficos, Programador y Cálculo de fechas. Historial revisa los cálculos anteriores, Mantener en la parte superior deja la Calculadora visible y Moneda es un convertidor."
  citation: "fuente: `ms-win-calculadora.html`; «Elegir un modo de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
