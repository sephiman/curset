- id: m05-l08-q02
  prompt:
    en: By default, when no `HealthIndicator` returns a status that the `StatusAggregator` knows, which overall
      health status does Spring Boot Actuator report for the system?
  options:
  - id: a
    correct: true
    text:
      en: '`UNKNOWN`'
  - id: b
    text:
      en: '`DOWN`'
  - id: c
    text:
      en: '`UP`'
  - id: d
    text:
      en: '`OUT_OF_SERVICE`'
  explanation:
    en: An `UNKNOWN` status is used when no `HealthIndicator` returns a status that is known to the `StatusAggregator`.
      Neither `DOWN`, `UP` nor `OUT_OF_SERVICE` is reported, because an `UNKNOWN` status is used when no `HealthIndicator`
      returns a known status.
  citation: spring-boot-actuator-endpoints#actuator.endpoints.health
- id: m05-l08-q03
  prompt:
    en: A `SpringApplication` sends several application events during start-up. Relative to the application and
      command-line runners, when is `ApplicationStartedEvent` sent?
  options:
  - id: a
    text:
      en: After all application and command-line runners have been called
  - id: b
    text:
      en: Before the `ApplicationContext` is created, once the `Environment` is known
  - id: c
    correct: true
    text:
      en: After the context has been refreshed but before any runners have been called
  - id: d
    text:
      en: Only when there is an exception on startup
  explanation:
    en: An `ApplicationStartedEvent` is sent after the context has been refreshed but before any application and
      command-line runners have been called. Sending it after the runners describes `ApplicationReadyEvent`, which
      is the event sent after any runners have been called. Sending it before the context exists describes `ApplicationEnvironmentPreparedEvent`,
      which is sent when the `Environment` is known but before the context is created. A startup exception is not
      the trigger, because `ApplicationFailedEvent` is the event sent if there is an exception on startup.
  citation: spring-boot-features-spring-application#features.spring-application.application-events-and-listeners
- id: m05-l08-q04
  prompt:
    en: In the Spring `TestContext` framework, the context cache is bounded. What is its default maximum size, expressed
      as a number of cached application contexts?
  options:
  - id: a
    text:
      en: 256 contexts
  - id: b
    text:
      en: 64 contexts
  - id: c
    correct: true
    text:
      en: 32 contexts
  - id: d
    text:
      en: No limit, so contexts are never evicted
  explanation:
    en: The size of the context cache is bounded with a default maximum size of 32. Neither 256 contexts, 64 contexts
      nor an unbounded cache is the default, because the context cache is bounded with a default maximum size of
      32.
  citation: spring-fw-testing-ctx-caching#page-title
  extract:
    en: The size of the context cache is bounded with a default maximum size of 32.
- id: m05-l08-q05
  prompt:
    en: When Testcontainers containers are declared as Spring beans in a test, when does Spring stop them relative
      to the other beans of the application context?
  options:
  - id: a
    correct: true
    text:
      en: After the destruction of all other beans
  - id: b
    text:
      en: Before the destruction of the other beans, so that clients can lose their connection
  - id: c
    text:
      en: In no guaranteed order relative to the other beans
  - id: d
    text:
      en: At the end of each test method that uses them
  explanation:
    en: Container beans are stopped after the destruction of all other beans. Containers are not stopped first,
      because container beans are stopped after the destruction of all other beans. The order is guaranteed, because
      it ensures that beans relying on the containers are cleaned up whilst the container is still available. They
      do not stop after each test method, because container beans are stopped as part of the application context
      shutdown process of the `TestContext` framework.
  citation: spring-boot-testing-testcontainers#testing.testcontainers.lifecycle
- id: m05-l08-q07
  prompt:
    en: In Spring Boot 4, what is the default value of `management.endpoint.health.show-details`, which controls
      whether the health endpoint shows details?
  options:
  - id: a
    text:
      en: '`always`'
  - id: b
    text:
      en: '`when-authorized`'
  - id: c
    text:
      en: '`on-demand`'
  - id: d
    correct: true
    text:
      en: '`never`'
  explanation:
    en: The default value of `management.endpoint.health.show-details` is `never`. `always`, `when-authorized` and
      `on-demand` are not the default, because the default value is `never`.
  citation: spring-boot-actuator-endpoints#actuator.endpoints.health
- id: m05-l08-q09
  prompt:
    en: In Spring Boot 4, Spring Security is on the classpath and no `SecurityFilterChain` bean exists. Which actuator
      endpoint is not secured by the auto-configuration?
  options:
  - id: a
    text:
      en: '`/info`'
  - id: b
    text:
      en: '`/metrics`'
  - id: c
    text:
      en: '`/env`'
  - id: d
    correct: true
    text:
      en: '`/health`'
  explanation:
    en: All actuators other than `/health` are secured by Spring Boot auto-configuration. `/info`, `/metrics` and
      `/env` are secured, because all actuators other than `/health` are secured by Spring Boot auto-configuration.
  citation: spring-boot-actuator-endpoints#actuator.endpoints.security
- id: m05-l08-q10
  prompt:
    en: Several beans implement `ExitCodeGenerator` and `SpringApplication.exit()` is called. Which of the generated
      exit codes does Spring Boot use?
  options:
  - id: a
    correct: true
    text:
      en: The first non-zero exit code that is generated
  - id: b
    text:
      en: The highest exit code that is generated
  - id: c
    text:
      en: The last non-zero exit code that is generated
  - id: d
    text:
      en: The sum of all generated exit codes
  explanation:
    en: If there is more than one `ExitCodeGenerator`, the first non-zero exit code that is generated is used. The
      highest, the last non-zero and the sum of the codes are not used, because the first non-zero exit code that
      is generated is used.
  citation: spring-boot-features-spring-application#features.spring-application.application-exit
- id: m05-l08-q11
  prompt:
    en: In Spring Boot 4, for which embedded web servers is graceful shutdown enabled by default, in reactive and
      servlet-based web applications?
  options:
  - id: a
    text:
      en: Only Tomcat
  - id: b
    correct: true
    text:
      en: 'All three: Jetty, Reactor Netty and Tomcat'
  - id: c
    text:
      en: Only Reactor Netty, for reactive applications
  - id: d
    text:
      en: None, it must be enabled with a property
  explanation:
    en: Graceful shutdown is enabled by default with all three embedded web servers, Jetty, Reactor Netty and Tomcat.
      Only one server, only the reactive stack or none is not the default, because graceful shutdown is enabled
      by default with all three embedded web servers and both kinds of application.
  citation: spring-boot-web-graceful-shutdown#page-title
- id: m05-l08-q13
  prompt:
    en: In Spring Boot 4, what happens by default to the changes made to the database by a test annotated with `@DataJpaTest`
      once that test ends?
  options:
  - id: a
    text:
      en: They are committed
  - id: b
    correct: true
    text:
      en: They are rolled back
  - id: c
    text:
      en: They are kept until the last test of the class ends
  - id: d
    text:
      en: They are committed only when the test fails
  explanation:
    en: By default, data JPA tests are transactional and roll back at the end of each test. Committing, keeping
      or committing after the class is not the default, because data JPA tests roll back at the end of each test.
  citation: spring-boot-testing-spring-boot-applications#testing.spring-boot-applications.autoconfigured-spring-data-jpa
