# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q292
  prompt:
    es: "En Windows 11, si se desancló una carpeta conocida como Documentos, ¿cómo se restaura en Acceso rápido, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "En Configuración › Sistema › Almacenamiento › Carpetas conocidas del usuario"
  - id: b
    text:
      es: "Con Ver › Mostrar › Panel de navegación en el Explorador de archivos de Windows"
  - id: c
    correct: true
    text:
      es: "En Inicio, con la flecha Arriba, y clic derecho en la carpeta › Anclar a acceso rápido"
  - id: d
    text:
      es: "En Este equipo, con clic derecho en la carpeta › Anclar a Inicio del Explorador"
  explanation:
    es: "En Inicio del Explorador se selecciona la flecha Arriba, que muestra las seis carpetas conocidas, y con clic derecho en la carpeta se elige Anclar a acceso rápido. Este equipo ya no muestra esas carpetas, Almacenamiento no restaura carpetas, y Panel de navegación solo muestra u oculta el panel."
