- id: m06-l07-q338
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué ocurre con algunas reglas creadas en Outlook clásico que se migran al nuevo Outlook?"
  options:
  - id: a
    text:
      es: "Se procesan, pero solo cuando Outlook está cerrado"
  - id: b
    correct: true
    text:
      es: "No se pueden procesar, por ser reglas del lado cliente"
  - id: c
    text:
      es: "Se eliminan sin aviso al migrar la cuenta"
  - id: d
    text:
      es: "Se procesan todas, porque el nuevo Outlook admite reglas del lado cliente"
  explanation:
    es: "La nota dice que algunas reglas creadas en Outlook clásico no se pueden procesar en el nuevo Outlook porque son reglas del lado cliente, y que hay que crear una nueva para reemplazarla. Procesarlas todas contradice esa frase. Procesarlas solo con Outlook cerrado y eliminarlas sin aviso contradicen que lo que se hace sea crear una regla nueva."
  citation: "fuente: `ms-outlook-reglas.html`; «Editar una regla de bandeja de entrada en el nuevo Outlook para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q339
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se pausa temporalmente una regla sin eliminarla, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Con el botón de alternancia junto al nombre de la regla"
  - id: b
    text:
      es: "Con Más acciones › Editar regla y descartando los cambios"
  - id: c
    text:
      es: "Con Más acciones › Eliminar regla"
  - id: d
    text:
      es: "Con la casilla Detener el procesamiento de más reglas"
  explanation:
    es: "Para deshabilitar o habilitar una regla se usa el botón de alternancia situado junto a su nombre. Más acciones › Eliminar regla la elimina. Editar regla abre la regla para guardar cambios. Detener el procesamiento de más reglas evita que se ejecuten reglas posteriores, y no pausa la regla actual."
  citation: "fuente: `ms-outlook-reglas.html`; «Deshabilitar y habilitar reglas en el nuevo Outlook para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q340
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se suspende temporalmente una regla sin eliminarla, según la recomendación de la ayuda?"
  options:
  - id: a
    text:
      es: "Seleccionando Cambiar regla y borrando su condición"
  - id: b
    text:
      es: "Seleccionando la regla y eligiendo Eliminar"
  - id: c
    correct: true
    text:
      es: "Desactivando la casilla de verificación junto a la regla"
  - id: d
    text:
      es: "Seleccionando Ejecutar reglas ahora y cancelándola"
  explanation:
    es: "Para suspender temporalmente una regla se desactiva la casilla de verificación junto a ella, lo que permite mantenerla y activarla más tarde. Eliminar la quita. Cambiar regla y borrar su condición la deja sin condición. Ejecutar reglas ahora la ejecuta una vez, sin suspenderla."
  citation: "fuente: `ms-outlook-reglas.html`; «Eliminar una regla en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q341
  prompt:
    es: "En Outlook 365 clásico, ¿dónde y cuándo se ejecuta una regla con una acción personalizada, según la nota de la ayuda?"
  options:
  - id: a
    text:
      es: "En cualquier equipo donde se use la misma cuenta"
  - id: b
    correct: true
    text:
      es: "Solo en el equipo donde está instalada y con Outlook en uso"
  - id: c
    text:
      es: "En el servidor de correo, aunque Outlook esté cerrado"
  - id: d
    text:
      es: "Solo en el equipo donde está instalada, aunque Outlook esté cerrado"
  explanation:
    es: "Una regla con acción personalizada solo se ejecuta en el equipo en el que está instalada y solo cuando se está trabajando con Outlook. Ejecutarse en el servidor o en cualquier equipo contradice esa frase. Ejecutarse con Outlook cerrado la contradice en su segunda parte."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear reglas de acciones personalizadas en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
