# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q115
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, la oficina de asistencia en materia de registros de la Administración General del Estado practica notificaciones, en su ámbito de actuación, cuando el interesado o su representante:"
  options:
  - id: a
    text:
      es: "Estén obligados a relacionarse electrónicamente con la Administración Pública competente."
  - id: b
    text:
      es: "Hayan sido notificados sin éxito en su domicilio por el servicio de Correos del Estado."
  - id: c
    correct: true
    text:
      es: "Comparezcan de forma espontánea en la Oficina y soliciten la notificación personal en ese momento."
  - id: d
    text:
      es: "Hayan rechazado previamente la notificación por medios electrónicos de la Administración."
  explanation:
    es: "La oficina notifica cuando el interesado o su representante comparecen espontáneamente y piden la notificación personal en ese momento. El rechazo previo, la obligación de relación electrónica y el intento fallido en el domicilio no son esa causa."
