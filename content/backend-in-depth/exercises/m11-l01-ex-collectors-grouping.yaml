- id: m11-l01-v-collectors-grouping-001
  prompt:
    en: |-
      What does this program print? The outer map is a `TreeMap`, so its entries come in key order, and each partition is read with `get(false)` and `get(true)`.

      ```java
      import java.util.List;
      import java.util.TreeMap;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> words = List.of("apple", "avocado", "fig", "banana", "kiwi");
              var result = words.stream().collect(
                      Collectors.groupingBy(w -> w.charAt(0), TreeMap::new,
                              Collectors.partitioningBy(w -> w.length() > 3, Collectors.counting())));
              result.forEach((group, split) -> System.out.println(group + ": [" + split.get(false) + "] [" + split.get(true) + "]"));
          }
      }
      ```
