# anchor: boe-a-2003-23186-art-103
- id: m03-l05-q0186
  prompt:
    es: "Según el artículo 103.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe hacer la Administración tributaria, además de resolver expresamente todas las cuestiones que se planteen en los procedimientos de aplicación de los tributos?"
  options:
  - id: a
    text:
      es: "Publicar dicha resolución en el «Boletín Oficial del Estado»."
  - id: b
    correct: true
    text:
      es: "Notificar dicha resolución expresa."
  - id: c
    text:
      es: "Comunicar dicha resolución al órgano superior jerárquico."
  - id: d
    text:
      es: "Ejecutar dicha resolución en el plazo de diez días."
  explanation:
    es: "El artículo 103.1 obliga a resolver expresamente y a notificar la resolución. La publicación en el Boletín Oficial del Estado, la comunicación al superior y la ejecución en diez días no son obligaciones que fije."
  citation: "art. 103.1 LGT"
  difficulty: 1
  tags:
  - "obligación de resolver"
  - "deber"
# anchor: boe-a-2003-23186-art-103
- id: m03-l05-q0187
  prompt:
    es: "Conforme al artículo 103.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los supuestos en que no existe obligación de resolver expresamente:"
  options:
  - id: a
    text:
      es: "En cualquier procedimiento iniciado a instancia del obligado, cuando transcurran seis meses sin que se haya resuelto."
  - id: b
    text:
      es: "En los procedimientos de ejercicio de derechos que solo deban comunicarse, cuando el obligado no aporte la documentación requerida."
  - id: c
    correct: true
    text:
      es: "En los procedimientos de ejercicio de derechos que solo deban comunicarse, cuando se produzca caducidad, pérdida sobrevenida del objeto, renuncia o desistimiento."
  - id: d
    text:
      es: "En los procedimientos iniciados de oficio, cuando se produzca la renuncia del obligado al derecho en que se fundaba la solicitud."
  explanation:
    es: "No hay obligación de resolver expresamente en los procedimientos de ejercicio de derechos que solo deban comunicarse y en los que se produzca caducidad, pérdida sobrevenida del objeto, renuncia o desistimiento. No basta el transcurso de seis meses, la falta de documentación ni la renuncia en un procedimiento de oficio."
  citation: "art. 103.2 LGT"
  difficulty: 2
  tags:
  - "obligación de resolver"
  - "excepciones"
# anchor: boe-a-2003-23186-art-103
- id: m03-l05-q0188
  prompt:
    es: "Conforme al artículo 103.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿está obligada la Administración a contestar al obligado que solicita expresamente que declare el desistimiento de un procedimiento relativo a un derecho que solo debía comunicarse?"
  options:
  - id: a
    text:
      es: "No, porque en esos procedimientos nunca existe obligación de resolver expresamente."
  - id: b
    correct: true
    text:
      es: "Sí, porque cuando el interesado solicita expresamente esa declaración la Administración queda obligada a contestar a su petición."
  - id: c
    text:
      es: "Sí, pero solo si el desistimiento se presentó dentro del primer mes del procedimiento."
  - id: d
    text:
      es: "No, salvo que el órgano superior ordene la contestación por escrito."
  explanation:
    es: "Aunque no exista obligación de resolver expresamente en esos procedimientos, si el interesado pide expresamente que se declare el desistimiento o la caducidad, la Administración queda obligada a contestar (art. 103.2). No hay plazo de un mes ni hace falta orden superior."
  citation: "art. 103.2 LGT"
  difficulty: 2
  tags:
  - "obligación de resolver"
  - "desistimiento"
# anchor: boe-a-2003-23186-art-103
- id: m03-l05-q0190
  prompt:
    es: "De acuerdo con el artículo 103.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los actos de liquidación, los de comprobación de valor y los que impongan una obligación serán motivados:"
  options:
  - id: a
    correct: true
    text:
      es: "con referencia sucinta a los hechos y fundamentos de derecho."
  - id: b
    text:
      es: "con una referencia extensa a los hechos, sin necesidad de fundamentos de derecho."
  - id: c
    text:
      es: "con remisión íntegra al informe del órgano instructor del procedimiento."
  - id: d
    text:
      es: "con indicación del importe y la identificación del obligado únicamente."
  explanation:
    es: "La motivación debe ser sucinta e incluir hechos y fundamentos de derecho. No basta una referencia a los hechos, una remisión al informe del instructor ni la mera identificación del obligado y el importe."
  citation: "art. 103.3 LGT"
  difficulty: 1
  tags:
  - "obligación de resolver"
  - "motivación"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0193
  prompt:
    es: "El jueves 12 de febrero de 2026 se notifica a Distribuciones Mora, S.L., el acuerdo de inicio de un procedimiento tributario iniciado de oficio. La normativa del procedimiento no fija plazo máximo y no hay dilaciones ni interrupciones. Según el artículo 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo vence el plazo de resolución?"
  options:
  - id: a
    text:
      es: "El jueves 13 de agosto de 2026."
  - id: b
    correct: true
    text:
      es: "El miércoles 12 de agosto de 2026."
  - id: c
    text:
      es: "El martes 12 de mayo de 2026."
  - id: d
    text:
      es: "El viernes 12 de febrero de 2027."
  explanation:
    es: "Sin plazo propio rige el máximo de seis meses (art. 104.1), que en un procedimiento de oficio se cuenta desde la notificación del acuerdo de inicio. Los plazos de meses se computan desde el día siguiente y concluyen el mismo día del mes de vencimiento (art. 30.4 de la Ley 39/2015): el 12 de agosto de 2026, miércoles. El 13 de agosto suma un día de más, el 12 de mayo aplica tres meses y el 12 de febrero de 2027 aplica doce. En el examen 2025 (pregunta 20) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 104.1 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "cómputo"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0194
  prompt:
    es: "El miércoles 12 de noviembre de 2025 tiene entrada, en el registro del órgano competente para su tramitación, una solicitud de Marta Quesada que inicia un procedimiento tributario. La normativa del procedimiento no fija plazo máximo y no hay dilaciones. Según el artículo 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo vence el plazo de resolución?"
  options:
  - id: a
    text:
      es: "El miércoles 13 de mayo de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 12 de mayo de 2026."
  - id: c
    text:
      es: "El jueves 12 de febrero de 2026."
  - id: d
    text:
      es: "El jueves 12 de noviembre de 2026."
  explanation:
    es: "En un procedimiento iniciado a instancia del interesado el plazo de seis meses se cuenta desde la entrada del documento en el registro del órgano competente (art. 104.1.b). Computado de fecha a fecha (art. 30.4 de la Ley 39/2015), concluye el 12 de mayo de 2026. El 13 de mayo suma un día, el 12 de febrero aplica tres meses y el 12 de noviembre de 2026 aplica doce. En el examen 2025 (pregunta 20) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 104.1 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "cómputo"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0197
  prompt:
    es: "¿Hasta cuándo pueden extenderse las actuaciones del procedimiento de apremio, que queda excluido del plazo máximo de resolución, según el artículo 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Seis meses desde la notificación de la providencia de apremio."
  - id: b
    correct: true
    text:
      es: "El plazo de prescripción del derecho de cobro."
  - id: c
    text:
      es: "Un año desde la finalización del período voluntario de pago."
  - id: d
    text:
      es: "El plazo de ingreso que conceda la providencia de apremio."
  explanation:
    es: "El artículo 104.1 excluye el apremio del plazo máximo y permite que sus actuaciones se extiendan hasta el plazo de prescripción del derecho de cobro. Seis meses, un año y el plazo de ingreso de la providencia no son ese límite."
  citation: "art. 104.1 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "apremio"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0198
  prompt:
    es: "La Administración tributaria intenta notificar a una persona física la resolución de un procedimiento el último día del plazo máximo. El texto íntegro de la resolución consta en el envío, pero el destinatario no se encuentra en su domicilio. Según el artículo 104.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿se entiende cumplida la obligación de notificar en plazo?"
  options:
  - id: a
    text:
      es: "No, porque son necesarios tres intentos de notificación en días distintos."
  - id: b
    correct: true
    text:
      es: "Sí, porque a esos solos efectos basta acreditar un intento de notificación que contenga el texto íntegro de la resolución."
  - id: c
    text:
      es: "No, porque la obligación solo se cumple cuando el destinatario recibe efectivamente la resolución."
  - id: d
    text:
      es: "Sí, pero solo si se publica además un anuncio en el «Boletín Oficial del Estado»."
  explanation:
    es: "A los solos efectos de entender cumplida la obligación de notificar dentro del plazo máximo basta acreditar un intento de notificación con el texto íntegro (art. 104.2). No hacen falta tres intentos ni la recepción efectiva ni un anuncio en el Boletín Oficial del Estado."
  citation: "art. 104.2 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "notificación"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0200
  prompt:
    es: "Conforme al artículo 104.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a los solos efectos de entender cumplida la obligación de notificar dentro del plazo máximo, es suficiente acreditar:"
  options:
  - id: a
    correct: true
    text:
      es: "que se ha realizado un intento de notificación que contenga el texto íntegro de la resolución."
  - id: b
    text:
      es: "que la resolución se ha dictado dentro del plazo, aunque no se intente notificar."
  - id: c
    text:
      es: "que se ha publicado la resolución en el «Boletín Oficial del Estado» antes del vencimiento del plazo máximo."
  - id: d
    text:
      es: "que se ha avisado al obligado de la existencia de la resolución por correo ordinario."
  explanation:
    es: "Basta acreditar un intento de notificación con el texto íntegro de la resolución. Dictarla sin intentar notificarla, publicarla en el Boletín Oficial del Estado o enviar un simple aviso postal no cumplen el requisito."
  citation: "art. 104.2 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "notificación"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0202
  prompt:
    es: "Según el artículo 104.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los períodos de interrupción justificada que se especifiquen reglamentariamente, las dilaciones por causa no imputable a la Administración y los períodos de suspensión:"
  options:
  - id: a
    text:
      es: "reinician el cómputo del plazo de resolución desde el día en que terminan."
  - id: b
    text:
      es: "se incluyen en el cómputo, pero amplían el plazo de resolución en tres meses."
  - id: c
    text:
      es: "se incluyen en el cómputo cuando su duración supera los diez días naturales."
  - id: d
    correct: true
    text:
      es: "no se incluyen en el cómputo del plazo de resolución."
  explanation:
    es: "Estos períodos no se incluyen en el cómputo del plazo de resolución, es decir, se descuentan. No lo reinician, no lo amplían una cantidad fija y no cuentan según su duración."
  citation: "art. 104.2 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "cómputo"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0205
  prompt:
    es: "Conforme al artículo 103.a) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la interrupción justificada por la petición de datos, informes o documentos a otros órganos o Administraciones no puede exceder, para todas las peticiones, de:"
  options:
  - id: a
    text:
      es: "tres meses, plazo que será de seis meses si se trata de solicitudes formuladas a otros Estados."
  - id: b
    text:
      es: "seis meses por cada petición, sin límite global, y de 12 meses si se dirigen a otros Estados."
  - id: c
    text:
      es: "doce meses en todo caso, tanto para órganos nacionales como para otros Estados."
  - id: d
    correct: true
    text:
      es: "seis meses, plazo que será de 12 meses si se trata de solicitudes formuladas a otros Estados."
  explanation:
    es: "El máximo es de seis meses para todas las peticiones a órganos o Administraciones, y de 12 meses si se formulan a otros Estados. No es de tres meses, no se aplica por petición y no es de doce meses para todos los casos."
  citation: "art. 103 RGAT"
  difficulty: 2
  tags:
  - "interrupción justificada"
  - "límite"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0206
  prompt:
    es: "Durante un procedimiento tributario, la Administración pide un informe a otro órgano de la misma Administración y lo recibe ocho meses después. Según el artículo 103.a) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuánto tiempo se considera interrupción justificada?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo seis meses, que es el máximo para todas las peticiones a otros órganos."
  - id: b
    text:
      es: "Los ocho meses, porque la interrupción dura lo que tarde en llegar el informe."
  - id: c
    text:
      es: "Doce meses, porque es el máximo cuando el informe se pide a otra Administración."
  - id: d
    text:
      es: "Tres meses, porque es el máximo para informes solicitados dentro de la misma Administración."
  explanation:
    es: "La interrupción dura desde que se remite la petición hasta que se recibe, pero no puede exceder de seis meses para todas las peticiones. Los dos meses restantes computan en el plazo de resolución. Los doce meses solo valen para solicitudes a otros Estados, y no existe un máximo de tres meses."
  citation: "art. 103 RGAT"
  difficulty: 3
  tags:
  - "interrupción justificada"
  - "cómputo"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0207
  prompt:
    es: "Según el artículo 103.b) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el plazo de interrupción de 12 meses por peticiones a otro Estado como consecuencia de la información recibida en el marco de la asistencia mutua es:"
  options:
  - id: a
    text:
      es: "común con el de la letra a), de modo que entre ambos no pueden superar 12 meses."
  - id: b
    text:
      es: "acumulable al de la letra a) hasta un máximo conjunto de 18 meses."
  - id: c
    correct: true
    text:
      es: "independiente del regulado en la letra a) de ese mismo artículo."
  - id: d
    text:
      es: "subsidiario del de la letra a), que se aplica primero en todo caso."
  explanation:
    es: "La letra b) declara el plazo de 12 meses independiente del de la letra a). No se comparte con él, no se acumula hasta un tope de 18 meses y no es subsidiario."
  citation: "art. 103 RGAT"
  difficulty: 2
  tags:
  - "interrupción justificada"
  - "límite"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0208
  prompt:
    es: "Durante un procedimiento tributario, la Administración aprecia indicios de delito contra la Hacienda Pública y remite el expediente al Ministerio Fiscal. Conforme al artículo 103.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cómo afecta esa remisión al cómputo del plazo de resolución?"
  options:
  - id: a
    text:
      es: "Es una dilación por causa no imputable a la Administración que se cuenta desde la notificación del inicio."
  - id: b
    correct: true
    text:
      es: "Es interrupción justificada: no se cuenta el tiempo desde la remisión hasta la recepción del expediente devuelto o de la resolución judicial."
  - id: c
    text:
      es: "No afecta al cómputo, porque el plazo de resolución sigue corriendo durante la intervención del Ministerio Fiscal."
  - id: d
    text:
      es: "Suspende el plazo durante un máximo de seis meses, transcurridos los cuales vuelve a computarse."
  explanation:
    es: "La remisión del expediente al Ministerio Fiscal por indicios de delito es una interrupción justificada y dura hasta la recepción del expediente devuelto o de la resolución judicial (art. 103.c). No es una dilación imputable al obligado, no deja correr el plazo y no tiene el tope de seis meses de la letra a)."
  citation: "art. 103 RGAT"
  difficulty: 3
  tags:
  - "interrupción justificada"
  - "delito"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0209
  prompt:
    es: "De acuerdo con el artículo 103.d) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, es período de interrupción justificada el que se origina cuando la determinación o imputación de la obligación tributaria dependa directamente de:"
  options:
  - id: a
    text:
      es: "una reclamación económico-administrativa pendiente de resolución."
  - id: b
    correct: true
    text:
      es: "actuaciones judiciales en el ámbito penal."
  - id: c
    text:
      es: "un procedimiento contencioso-administrativo promovido por otro obligado."
  - id: d
    text:
      es: "una consulta tributaria escrita pendiente de contestación."
  explanation:
    es: "La letra d) se refiere a las actuaciones judiciales en el ámbito penal de las que dependa directamente la obligación tributaria. Una reclamación económico-administrativa, un proceso contencioso-administrativo ajeno o una consulta pendiente no están en ese supuesto."
  citation: "art. 103 RGAT"
  difficulty: 2
  tags:
  - "interrupción justificada"
  - "causa"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0210
  prompt:
    es: "Conforme al artículo 103.e) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, cuando concurra una causa de fuerza mayor que obligue a la Administración a interrumpir sus actuaciones, la interrupción dura:"
  options:
  - id: a
    text:
      es: "un máximo de tres meses, sea cual sea la duración de la causa."
  - id: b
    text:
      es: "el tiempo que fije el órgano que tramita el procedimiento."
  - id: c
    correct: true
    text:
      es: "el tiempo de duración de dicha causa."
  - id: d
    text:
      es: "seis meses en todo caso, prorrogables por otros seis."
  explanation:
    es: "La interrupción por fuerza mayor dura lo que dure la causa (art. 103.e). No se fija un máximo de tres meses, no la determina el órgano tramitador y no es de seis meses prorrogables."
  citation: "art. 103 RGAT"
  difficulty: 1
  tags:
  - "interrupción justificada"
  - "fuerza mayor"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0211
  prompt:
    es: "Según el artículo 103.f) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, cuando se plantee el conflicto de competencias ante las Juntas Arbitrales, la interrupción justificada dura desde el planteamiento del conflicto hasta:"
  options:
  - id: a
    text:
      es: "la notificación del acuerdo que resuelva el procedimiento tributario."
  - id: b
    text:
      es: "la firmeza de la resolución judicial que se dicte sobre el conflicto."
  - id: c
    text:
      es: "la contestación del Tribunal Constitucional a la cuestión planteada."
  - id: d
    correct: true
    text:
      es: "la resolución dictada por la respectiva Junta Arbitral."
  explanation:
    es: "La letra f) fija como final la resolución dictada por la respectiva Junta Arbitral. No se espera a la notificación del acuerdo del procedimiento, a una resolución judicial firme ni al Tribunal Constitucional."
  citation: "art. 103 RGAT"
  difficulty: 3
  tags:
  - "interrupción justificada"
  - "Juntas Arbitrales"
# anchor: boe-a-2007-15984-art-103
- id: m03-l05-q0212
  prompt:
    es: "¿Cuál de las siguientes situaciones es un período de interrupción justificada del plazo de resolución según el artículo 103 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "La paralización del procedimiento iniciado a instancia del obligado por no cumplimentar un trámite indispensable."
  - id: b
    correct: true
    text:
      es: "La causa de fuerza mayor que obliga a la Administración a interrumpir sus actuaciones."
  - id: c
    text:
      es: "La presentación de solicitudes de devolución complementarias de otras presentadas con anterioridad."
  - id: d
    text:
      es: "La concesión de una ampliación del plazo para cumplir un trámite solicitada por el obligado."
  explanation:
    es: "La fuerza mayor está en la letra e) del artículo 103 y es interrupción justificada. La paralización por trámite sin cumplimentar, las solicitudes de devolución complementarias y la ampliación de plazos son dilaciones por causa no imputable a la Administración (art. 104)."
  citation: "art. 103 RGAT"
  difficulty: 2
  tags:
  - "interrupción justificada"
  - "dilaciones"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0215
  prompt:
    es: "Conforme al artículo 104.a) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, la dilación por retraso del obligado en una comparecencia se computa desde:"
  options:
  - id: a
    text:
      es: "la fecha fijada para la comparecencia."
  - id: b
    text:
      es: "el día de la notificación del requerimiento que fijó la comparecencia."
  - id: c
    correct: true
    text:
      es: "el día siguiente al de la fecha fijada para la comparecencia."
  - id: d
    text:
      es: "el día siguiente a la presentación del escrito de alegaciones del obligado."
  explanation:
    es: "El cómputo empieza el día siguiente al de la fecha fijada para la comparecencia. No cuenta ese mismo día ni el de la notificación del requerimiento, y las alegaciones no marcan el inicio."
  citation: "art. 104 RGAT"
  difficulty: 1
  tags:
  - "dilaciones"
  - "cómputo"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0216
  prompt:
    es: "Según el artículo 104.b) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la dilación por aportación de nuevos documentos y pruebas tras el trámite de audiencia se computa desde el día siguiente al de finalización del plazo de dicho trámite hasta:"
  options:
  - id: a
    text:
      es: "la fecha de la propuesta de resolución."
  - id: b
    text:
      es: "la fecha en que la Administración los valore."
  - id: c
    text:
      es: "el día siguiente al de su aportación."
  - id: d
    correct: true
    text:
      es: "la fecha en que se aporten."
  explanation:
    es: "La dilación termina en la fecha en que se aportan los nuevos documentos y pruebas (art. 104.b). No acaba con la propuesta de resolución, con su valoración por la Administración ni al día siguiente de la aportación."
  citation: "art. 104 RGAT"
  difficulty: 1
  tags:
  - "dilaciones"
  - "cómputo"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0217
  prompt:
    es: "El plazo para cumplir un trámite concluye el lunes 20 de abril de 2026 y, a petición del obligado, se concede una ampliación que lo extiende hasta el jueves 30 de abril de 2026. Conforme al artículo 104.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuántos días de dilación por causa no imputable a la Administración se generan?"
  options:
  - id: a
    text:
      es: "9 días naturales, del 21 al 29 de abril de 2026."
  - id: b
    correct: true
    text:
      es: "10 días naturales, del 21 al 30 de abril de 2026."
  - id: c
    text:
      es: "11 días naturales, del 20 al 30 de abril de 2026."
  - id: d
    text:
      es: "5 días naturales, la mitad del plazo ampliado."
  explanation:
    es: "La concesión de una ampliación es dilación por el tiempo que media desde el día siguiente al de la finalización del plazo previsto hasta la fecha fijada en segundo lugar (art. 104.c). Del 21 al 30 de abril, ambos incluidos, hay 10 días naturales. Contar desde el 20, acabar el 29 o dividir por la mitad no responde a la regla."
  citation: "art. 104 RGAT"
  difficulty: 3
  tags:
  - "dilaciones"
  - "cómputo"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0219
  prompt:
    es: "La Administración intenta sin éxito notificar a una empresa la propuesta de liquidación el miércoles 3 de junio de 2026 y la notificación se produce el viernes 19 de junio de 2026. Según el artículo 104.e) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuántos días de dilación por causa no imputable a la Administración se computan por ese retraso?"
  options:
  - id: a
    text:
      es: "15 días naturales, del 4 al 18 de junio de 2026."
  - id: b
    text:
      es: "17 días naturales, del 3 al 19 de junio de 2026."
  - id: c
    text:
      es: "12 días naturales, solo los hábiles entre ambas fechas."
  - id: d
    correct: true
    text:
      es: "16 días naturales, del 4 al 19 de junio de 2026."
  explanation:
    es: "El retraso en la notificación de propuestas de resolución o liquidación cuenta desde el día siguiente al del intento hasta que la notificación se produce (art. 104.e): del 4 al 19 de junio, ambos incluidos, son 16 días naturales. Contar desde el día del intento, acabar el día anterior o solo los días hábiles no responde a la regla."
  citation: "art. 104 RGAT"
  difficulty: 3
  tags:
  - "dilaciones"
  - "cómputo"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0220
  prompt:
    es: "De acuerdo con el artículo 104.f) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, es dilación no imputable a la Administración la presentación por el obligado de declaraciones del artículo 128 de la ley, comunicaciones de datos o solicitudes de devolución:"
  options:
  - id: a
    correct: true
    text:
      es: "complementarias o sustitutivas de otras presentadas con anterioridad."
  - id: b
    text:
      es: "extemporáneas respecto del plazo de ingreso en período voluntario de la deuda tributaria."
  - id: c
    text:
      es: "presentadas por medios telemáticos en lugar de por escrito."
  - id: d
    text:
      es: "con errores que no impidan su tramitación por la Administración."
  explanation:
    es: "La letra f) se refiere a declaraciones, comunicaciones o solicitudes complementarias o sustitutivas de otras presentadas antes. Que sean extemporáneas, telemáticas o contengan errores no es el supuesto."
  citation: "art. 104 RGAT"
  difficulty: 1
  tags:
  - "dilaciones"
  - "presentación"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0221
  prompt:
    es: "Según el artículo 104.g) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la dilación por falta de presentación en plazo de la declaración informativa con el contenido de los libros registro se computa desde:"
  options:
  - id: a
    text:
      es: "el día siguiente al vencimiento del plazo de presentación, hasta la fecha de su presentación efectiva."
  - id: b
    text:
      es: "la notificación del acuerdo de inicio de cualquier procedimiento, hasta su resolución."
  - id: c
    correct: true
    text:
      es: "el inicio de un procedimiento en el que pueda surtir efectos, hasta la fecha de su presentación."
  - id: d
    text:
      es: "el requerimiento que formule la Administración, hasta su cumplimiento por el obligado."
  explanation:
    es: "La dilación del apartado g) va desde el inicio de un procedimiento en el que la declaración pueda surtir efectos hasta que se presenta. No se cuenta desde el vencimiento del plazo, ni desde la notificación del acuerdo de inicio hasta la resolución, ni desde un requerimiento."
  citation: "art. 104 RGAT"
  difficulty: 2
  tags:
  - "dilaciones"
  - "libros registro"
# anchor: boe-a-2007-15984-art-104
- id: m03-l05-q0222
  prompt:
    es: "Conforme al artículo 104 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre la enumeración de dilaciones por causa no imputable a la Administración:"
  options:
  - id: a
    text:
      es: "Es una lista cerrada, de modo que no cabe apreciar otras dilaciones que las enumeradas."
  - id: b
    correct: true
    text:
      es: "Enumera, entre otras, las dilaciones por causa no imputable a la Administración, por lo que no es una lista cerrada."
  - id: c
    text:
      es: "Es una lista abierta que cada órgano de tramitación puede ampliar mediante instrucción interna."
  - id: d
    text:
      es: "Es una lista cerrada que solo puede ampliarse mediante una ley."
  explanation:
    es: "El reglamento introduce la lista con «entre otras», de modo que no es cerrada. No es una lista que pueda ampliarse por instrucción interna y no exige ley para apreciar otras dilaciones."
  citation: "art. 104 RGAT"
  difficulty: 3
  tags:
  - "dilaciones"
  - "enumeración"
