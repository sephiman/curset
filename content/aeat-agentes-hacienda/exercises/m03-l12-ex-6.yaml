  prompt:
    es: "¿Cuál de los siguientes datos contiene el acuerdo de enajenación mediante subasta, según el artículo 101.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El número de postores que se admiten y el precio mínimo de adjudicación."
  - id: b
    correct: true
    text:
      es: "El tipo para la subasta y la duración del plazo para la presentación de ofertas."
  - id: c
    text:
      es: "El nombre del adjudicatario previsto y el plazo para ingresar el remate."
  - id: d
    text:
      es: "La fecha de la certificación del acta de adjudicación y el importe del depósito reservado."
  explanation:
    es: "El acuerdo identifica al deudor y los bienes, fija el tipo y la duración del plazo de ofertas e indica que se presentan electrónicamente en el Portal de Subastas (art. 101.1 RGR). El número de postores y el precio mínimo no figuran. La certificación del acta y el adjudicatario son posteriores a la subasta."
  citation: "art. 101.1 RGR"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-101
- id: m03-l12-q0141
  prompt:
    es: "Según el artículo 101.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, entre los datos esenciales de la subasta se incluye la obligación de constituir un depósito, ¿de qué cuantía?"
  options:
  - id: a
    correct: true
    text:
      es: "Del 5 o del 10 por ciento del tipo de subasta del bien o lote por el que se desea pujar."
  - id: b
    text:
      es: "Del 5 o del 10 por ciento del precio de adjudicación del bien o lote."
  - id: c
    text:
      es: "Del 5 por ciento de la valoración del bien o lote por el que se desea pujar."
  - id: d
    text:
      es: "Del 10 o del 20 por ciento del tipo de subasta del bien o lote por el que se desea pujar."
  explanation:
    es: "El anuncio incluye la obligación de constituir un depósito del 5 o 10 por ciento del tipo de subasta, conforme al artículo 103 bis (art. 101.4 RGR). No se calcula sobre el precio de adjudicación, que aún no existe, ni sobre la valoración. El 20 por ciento no figura entre los porcentajes."
  citation: "art. 101.4 RGR"
  difficulty: 2
  tags:
  - "porcentaje"
