# SPDX-License-Identifier: AGPL-3.0-only
# age-administrativo-c1 course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/age-administrativo-course-requirements.md. Programme: sources/programa.md (Anexo III,
# BOE-A-2025-26262). Module mNN is bloque NN of the programme and lesson mNN-lMM its tema MM, so ids follow
# the official numbering; m00 is the introduction and sits before bloque I.
# Lesson titles are the tema paragraphs of the BOE, verbatim. Summaries are written bloque by bloque in round R2
# (bloque I done); the rest are placeholders.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: age-administrativo-c1
  title:
    es: Administrativo del Estado (C1)
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    es: Ingreso libre · convocatoria OEP 2026
  description:
    es: >-
      El programa del Cuerpo General Administrativo de la Administración del Estado, ingreso libre, resumido
      tema a tema, con preguntas tipo test como las del examen.
  languages: [es]
  status: draft
  exercise_types: [quiz]
  # «Por tema» instead of «Por lección» in results and stats.
  lesson_noun:
    es: tema
  # glyph / color: not set. The schema has no such fields yet; the identity round (R2a.3 of
  # docs/curset-multicourse-requirements.md, R2.2 of the course requirements) adds both here.
blocks:
- id: block-a
  title:
    es: Proceso de selección
  modules:
  - id: m00
    title:
      es: El examen
    summary:
      es: Las reglas del ejercicio único de la convocatoria.
    lessons:
    - id: m00-l01
      title:
        es: Cómo es el examen
      summary:
        es: El ejercicio único tiene dos partes, dura cien minutos y cada error resta un tercio de acierto. La puntuación
          directa de cada parte se transforma en una calificación de 0 a 50, con 25 en la nota de corte. La lección
          da las notas de corte que fijó la Comisión en 2025.
- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización del Estado y de la Administración pública
    summary:
      es: >-
        La organización del Estado según la Constitución de 1978: la Corona, las Cortes Generales, el Poder
        Judicial, el Gobierno y la organización territorial. Incluye la Administración General del Estado, la
        local, la transparencia y el Gobierno Abierto, y las instituciones de la Unión Europea.
    lessons:
    - id: m01-l01
      title:
        es: 'La Constitución Española de 1978: estructura y contenido. Derechos y deberes fundamentales. Su garantía
          y suspensión. El Tribunal Constitucional. El Defensor del Pueblo. Reforma de la Constitución.'
      summary:
        es: >-
          La Constitución de 1978 tiene un título preliminar, diez títulos y 169 artículos, y se ha reformado
          cuatro veces. El título I reparte los derechos en tres niveles de protección y regula su suspensión en
          los estados de excepción y de sitio. La lección cierra con el Tribunal Constitucional, el Defensor del
          Pueblo y los dos procedimientos de reforma.
      exercises:
      - id: m01-l01-ex-1
        type: quiz
      - id: m01-l01-ex-2
        type: quiz
      - id: m01-l01-ex-3
        type: quiz
      - id: m01-l01-ex-4
        type: quiz
    - id: m01-l02
      title:
        es: 'La Jefatura del Estado. La Corona: funciones constitucionales del Rey. Sucesión y regencia.'
      summary:
        es: >-
          El Rey es el Jefe del Estado de una Monarquía parlamentaria, es inviolable y sus actos necesitan
          refrendo del Presidente del Gobierno, de los Ministros o, en tres casos, del Presidente del Congreso.
          La lección recorre las funciones de los artículos 62 y 63 de la Constitución y las que el Rey ejerce
          en la formación del Gobierno y en el nombramiento de otros órganos. Cierra con el orden de sucesión,
          la Regencia y la tutela del Rey menor.
      exercises:
      - id: m01-l02-ex-1
        type: quiz
      - id: m01-l02-ex-2
        type: quiz
      - id: m01-l02-ex-3
        type: quiz
      - id: m01-l02-ex-4
        type: quiz
    - id: m01-l03
      title:
        es: 'Las Cortes Generales: composición, atribuciones y funcionamiento del Congreso de los Diputados y del
          Senado.'
      summary:
        es: >-
          Las Cortes Generales son el Congreso, de 300 a 400 Diputados, y el Senado, la Cámara de representación
          territorial, con cuatro Senadores por provincia y los que designan las Comunidades Autónomas. Cada
          Cámara funciona en Pleno y por Comisiones, con su Mesa, su Junta de Portavoces, sus Grupos
          Parlamentarios y una Diputación Permanente de al menos veintiún miembros. La lección sigue el título
          III de la Constitución y los dos Reglamentos: períodos de sesiones, quórum y mayorías, elaboración de
          las leyes y tratados internacionales.
      exercises:
      - id: m01-l03-ex-1
        type: quiz
      - id: m01-l03-ex-2
        type: quiz
      - id: m01-l03-ex-3
        type: quiz
      - id: m01-l03-ex-4
        type: quiz
    - id: m01-l04
      title:
        es: El Poder Judicial. El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial
          española.
      summary:
        es: >-
          Los Jueces y Magistrados son independientes, inamovibles, responsables y sometidos únicamente al
          imperio de la ley, y el Consejo General del Poder Judicial, con su Presidente y veinte Vocales
          nombrados por cinco años, es el órgano de gobierno del Poder Judicial. El Tribunal Supremo es el
          órgano jurisdiccional superior en todos los órdenes, salvo en materia de garantías constitucionales.
          Desde la Ley Orgánica 1/2025, los antiguos Juzgados son Secciones de los Tribunales de Instancia, uno
          por partido judicial.
      exercises:
      - id: m01-l04-ex-1
        type: quiz
      - id: m01-l04-ex-2
        type: quiz
      - id: m01-l04-ex-3
        type: quiz
    - id: m01-l05
      title:
        es: El Gobierno y la Administración. El Presidente del Gobierno. El Consejo de Ministros. Designación, causas
          de cese y responsabilidad del Gobierno. Las funciones del Gobierno. Relaciones entre el Gobierno y las
          Cortes Generales.
      summary:
        es: >-
          El Gobierno se compone del Presidente, los Vicepresidentes y los Ministros, y se reúne en Consejo de
          Ministros y en Comisiones Delegadas. El Presidente obtiene la confianza del Congreso en la investidura
          y el Gobierno cesa tras las elecciones, por pérdida de la confianza parlamentaria o por dimisión o
          fallecimiento de su Presidente. El Gobierno responde ante el Congreso, que puede exigir esa
          responsabilidad con la moción de censura.
      exercises:
      - id: m01-l05-ex-1
        type: quiz
      - id: m01-l05-ex-2
        type: quiz
      - id: m01-l05-ex-3
        type: quiz
      - id: m01-l05-ex-4
        type: quiz
    - id: m01-l06
      title:
        es: 'El Gobierno Abierto: concepto y principios informadores. La Agenda 2030 y los Objetivos de Desarrollo
          Sostenible.'
      summary:
        es: >-
          El Gobierno Abierto es una cultura de gobernanza que promueve la transparencia, la integridad, la
          rendición de cuentas y la participación, y en España avanza mediante planes de Gobierno Abierto, hoy
          el V Plan 2025-2029. La Ley 19/2013, la LRJSP y la consulta pública del artículo 133 de la LPAC dan
          base legal a la transparencia y la participación. La Agenda 2030, aprobada por la Asamblea General de
          las Naciones Unidas el 25 de septiembre de 2015, fija 17 Objetivos de Desarrollo Sostenible y 169
          metas.
      exercises:
      - id: m01-l06-ex-1
        type: quiz
      - id: m01-l06-ex-2
        type: quiz
      - id: m01-l06-ex-3
        type: quiz
    - id: m01-l07
      title:
        es: La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno.
      summary:
        es: >-
          La Ley 19/2013 regula la publicidad activa, el derecho de acceso a la información pública y el buen
          gobierno de los altos cargos. La solicitud de acceso se resuelve en un mes, ampliable por otro, y
          contra la resolución cabe una reclamación potestativa ante el Consejo de Transparencia y Buen Gobierno
          en el plazo de un mes. El título III regula ese Consejo: su Comisión y su Presidente, nombrado por
          cinco años no renovables.
      exercises:
      - id: m01-l07-ex-1
        type: quiz
      - id: m01-l07-ex-2
        type: quiz
      - id: m01-l07-ex-3
        type: quiz
      - id: m01-l07-ex-4
        type: quiz
    - id: m01-l08
      title:
        es: La Administración General del Estado. Órganos centrales. Órganos superiores y directivos. Órganos territoriales.
          La Administración del Estado en el Exterior.
      summary:
        es: >-
          La Administración General del Estado se divide en organización central, territorial y en el exterior,
          con Ministros y Secretarios de Estado como órganos superiores y el resto como órganos directivos. La
          lección da, órgano por órgano, quién nombra y separa a cada titular, su rango y si debe ser
          funcionario del Subgrupo A1. Cierra con las Delegaciones y Subdelegaciones del Gobierno y con las
          Misiones Diplomáticas y Oficinas Consulares de la Ley 2/2014.
      exercises:
      - id: m01-l08-ex-1
        type: quiz
      - id: m01-l08-ex-2
        type: quiz
      - id: m01-l08-ex-3
        type: quiz
      - id: m01-l08-ex-4
        type: quiz
    - id: m01-l09
      title:
        es: 'La Organización territorial del Estado: las Comunidades Autónomas. Constitución y distribución de competencias
          entre el Estado y las Comunidades Autónomas. Estatutos de Autonomía.'
      summary:
        es: >-
          El Estado se organiza territorialmente en municipios, provincias y Comunidades Autónomas, que acceden
          a la autonomía por la vía del artículo 143 o por la del artículo 151 y se rigen por su Estatuto, la
          norma institucional básica de cada Comunidad. Los artículos 148 y 149 reparten las competencias, y el
          artículo 150 permite leyes marco, transferencia o delegación y armonización. El control de las
          Comunidades, el artículo 155 y la financiación cierran el título VIII.
      exercises:
      - id: m01-l09-ex-1
        type: quiz
      - id: m01-l09-ex-2
        type: quiz
      - id: m01-l09-ex-3
        type: quiz
      - id: m01-l09-ex-4
        type: quiz
    - id: m01-l10
      title:
        es: 'La Administración local: entidades que la integran. La provincia, el municipio y la isla.'
      summary:
        es: >-
          La Constitución garantiza la autonomía de los municipios y fija la provincia y la isla; la LBRL
          distingue las entidades locales territoriales de las comarcas, áreas metropolitanas y mancomunidades.
          En el municipio, el Alcalde, los Tenientes de Alcalde y el Pleno existen en todos los ayuntamientos, y
          la Junta de Gobierno Local en los de más de 5.000 habitantes y en los que la prevean. La provincia se
          gobierna por la Diputación, y los municipios de gran población tienen su propio régimen de
          organización.
      exercises:
      - id: m01-l10-ex-1
        type: quiz
      - id: m01-l10-ex-2
        type: quiz
      - id: m01-l10-ex-3
        type: quiz
    - id: m01-l11
      title:
        es: La organización de la Unión Europea. El Consejo Europeo, el Consejo, el Parlamento Europeo, la Comisión
          Europea y el Tribunal de Justicia de la Unión Europea. Efectos de la integración europea sobre la organización
          del Estado español.
      summary:
        es: >-
          La Unión Europea actúa a través de siete instituciones; esta lección recorre las cinco del programa
          con su composición, sus mayorías y sus plazos según el TUE y el TFUE. El Consejo comparte con el
          Parlamento Europeo la función legislativa y la presupuestaria, y el Consejo Europeo no legisla. La
          integración se apoya en el artículo 93 de la Constitución, que permite ceder por ley orgánica el
          ejercicio de competencias.
      exercises:
      - id: m01-l11-ex-1
        type: quiz
      - id: m01-l11-ex-2
        type: quiz
      - id: m01-l11-ex-3
        type: quiz
      - id: m01-l11-ex-4
        type: quiz
  - id: m02
    title:
      es: Organización de oficinas públicas
    summary:
      es: >-
        La atención al público y la información administrativa, las quejas, sugerencias y peticiones y la
        accesibilidad de las oficinas para personas con discapacidad. Incluye también el documento, el
        registro y el archivo, la administración electrónica con el Punto de Acceso General de la
        Administración General del Estado, y la protección de datos personales con los derechos digitales.
    lessons:
    - id: m02-l01
      title:
        es: Atención al público. Atención de personas con discapacidad. Los servicios de información administrativa.
          Información general y particular al ciudadano. Iniciativas. Reclamaciones. Quejas. Peticiones.
      summary:
        es: >-
          La atención al ciudadano y la red de oficinas de información siguen el RD 208/1996, que distingue
          la información general, sin exigir legitimación, de la particular, reservada a los interesados.
          Las cartas de servicios y las quejas y sugerencias siguen el RD 951/2005: contestación en 20 días
          hábiles, seguimiento por la Inspección General de Servicios y ningún efecto de recurso
          administrativo. La accesibilidad para personas con discapacidad sigue el RD 366/2007 y el RDL
          1/2013, y las peticiones, la LO 4/2001.
    - id: m02-l02
      title:
        es: Concepto de documento, registro y archivo. Funciones del registro y del archivo. Clases de archivo y
          criterios de ordenación.
      summary:
        es: >-
          La lección define el documento con la Ley del Patrimonio Histórico, el RD 1708/2011, la LPAC y el
          RD 203/2021. Recorre el Registro Electrónico General, los asientos, los lugares de presentación de
          documentos y las oficinas de asistencia en materia de registros, además del archivo electrónico
          único. Las cuatro clases de archivo del RD 1708/2011 se dan con sus funciones, y la ordenación
          sigue el Diccionario de Terminología Archivística del Ministerio de Cultura.
    - id: m02-l03
      title:
        es: Administración electrónica y servicios al ciudadano. Análisis de principales páginas web de carácter
          público. Servicios telemáticos. Oficinas integradas de atención al ciudadano. Ventanilla única empresarial.
          El Punto de Acceso General de la Administración General del Estado.
      summary:
        es: >-
          La lección recorre el derecho y la obligación de relacionarse electrónicamente, la identificación
          y firma de interesados y Administraciones, la sede electrónica, el portal de internet y la
          accesibilidad de los sitios web del RD 1112/2018. Trata las notificaciones electrónicas, la
          Dirección Electrónica Habilitada única y las oficinas integradas de atención al ciudadano. Cierra
          con los Puntos de Atención al Emprendedor y CIRCE del RD 127/2015 y con el Punto de Acceso
          General, su sede y la Carpeta Ciudadana.
    - id: m02-l04
      title:
        es: 'La protección de datos personales y su régimen Jurídico: principios, derechos, responsable y encargado
          del tratamiento, delegado y autoridades de protección de datos. Derechos digitales.'
      summary:
        es: >-
          El RGPD y la LOPDGDD fijan los principios y las bases de licitud del tratamiento de datos
          personales y los derechos del interesado, que el responsable atiende en un mes, prorrogable otros
          dos meses. El responsable notifica las violaciones de la seguridad a la autoridad de control, de
          ser posible, en 72 horas, y el delegado de protección de datos es obligatorio, entre otros casos,
          cuando el tratamiento lo lleva a cabo una autoridad u organismo público. La Agencia Española de
          Protección de Datos es una autoridad administrativa independiente, y el título X de la LOPDGDD
          regula los derechos digitales, entre ellos la desconexión digital y el testamento digital.
  - id: m03
    title:
      es: Derecho administrativo general
    summary:
      es: >-
        Las fuentes del derecho administrativo, el acto administrativo y el procedimiento administrativo común,
        con los plazos, el silencio, la revisión de oficio, los recursos administrativos y el recurso
        contencioso-administrativo. Incluye también los contratos del sector público, las formas de la actividad
        administrativa, la responsabilidad patrimonial y las políticas de igualdad, discapacidad y dependencia.
    lessons:
    - id: m03-l01
      title:
        es: 'Las fuentes del derecho administrativo. La jerarquía de las fuentes. La ley. Las disposiciones del
          Ejecutivo con fuerza de ley: decreto-ley y decreto legislativo. El reglamento: concepto, clases y límites.
          Otras fuentes del derecho administrativo.'
      summary:
        es: >-
          Las fuentes del ordenamiento son la ley, la costumbre y los principios generales del derecho, y
          carecen de validez las disposiciones que contradicen otra de rango superior. Las Cortes pueden
          delegar en el Gobierno la potestad de dictar decretos legislativos sobre materias determinadas no
          reservadas a ley orgánica, y el Gobierno puede dictar decretos-leyes en caso de extraordinaria y
          urgente necesidad, sin afectar a las materias que excluye el artículo 86.1 de la Constitución; el
          Congreso se pronuncia sobre su convalidación o derogación en los treinta días siguientes a su
          promulgación. Los reglamentos no pueden vulnerar la Constitución ni las leyes ni regular materias
          reservadas a la ley, y su elaboración empieza, salvo excepciones, con una consulta pública.
    - id: m03-l02
      title:
        es: 'El acto administrativo: concepto, clases y elementos. Eficacia y validez de los actos administrativos.
          Su motivación y notificación.'
      summary:
        es: >-
          Los actos administrativos están en el título III de la LPAC, que regula sus requisitos, su
          eficacia y su nulidad y anulabilidad. Se presumen válidos y producen efectos desde la fecha en que se
          dictan, salvo que en ellos se disponga otra cosa; son nulos de pleno derecho en los casos del artículo
          47.1 y anulables por cualquier infracción del ordenamiento jurídico, incluso la desviación de poder. La
          notificación se cursa en diez días, preferentemente por medios electrónicos, y la electrónica obligatoria
          o elegida se entiende rechazada a los diez días naturales sin acceso a su contenido.
    - id: m03-l03
      title:
        es: 'Las Leyes del Procedimiento Administrativo Común de las Administraciones Públicas y del Régimen Jurídico
          del Sector Público. Procedimiento administrativo común y su alcance: iniciación, ordenación, instrucción
          y terminación. La revisión de los actos en vía administrativa: revisión de oficio y recursos administrativos.
          El recurso contencioso-administrativo. Actividad administrativa impugnable. Las partes: capacidad, legitimación,
          representación y defensa.'
      summary:
        es: >-
          Los plazos señalados por días son hábiles, salvo otro cómputo legal, y el plazo máximo para resolver
          es de tres meses si la norma reguladora no fija otro. Contra un acto expreso, la alzada y la
          reposición potestativa se interponen en un mes, y el recurso contencioso-administrativo en dos
          meses. La revisión de oficio declara la nulidad de los actos que hayan puesto fin a la vía
          administrativa o no se hayan recurrido en plazo, en los supuestos del artículo 47.1, previo dictamen
          favorable del Consejo de Estado u órgano consultivo equivalente, y los actos favorables anulables se
          impugnan ante el orden contencioso-administrativo previa declaración de lesividad, que no puede
          adoptarse pasados cuatro años desde que se dictó el acto.
    - id: m03-l04
      title:
        es: 'Los contratos del sector público: concepto y clases. Preparación, adjudicación, efectos, cumplimiento
          y extinción. La revisión de precios y otras alteraciones contractuales. Régimen de invalidez y recursos.'
      summary:
        es: >-
          La LCSP define los tipos de contrato y, desde el 1 de enero de 2026 (Orden HAC/1517/2025), están
          sujetos a regulación armonizada los contratos de un poder adjudicador de obras de valor estimado
          igual o superior a 5.404.000 euros y los de suministros y servicios de la Administración General del
          Estado desde 140.000 euros. Son contratos menores los de obras de valor estimado inferior a 40.000
          euros y los de suministro o servicios inferiores a 15.000 euros. El recurso especial en materia de
          contratación se interpone, con carácter general, en quince días hábiles, y la formalización de un
          contrato recurrible espera ese mismo plazo desde la remisión de la notificación de la adjudicación.
    - id: m03-l05
      title:
        es: Procedimientos y formas de la actividad administrativa. La actividad de limitación, arbitral, de servicio
          público y de fomento. Formas de gestión de los servicios públicos.
      summary:
        es: >-
          Las medidas que limitan derechos o exigen requisitos aplican el principio de proporcionalidad y
          eligen la medida menos restrictiva, y la declaración responsable permite iniciar la actividad desde
          el día de su presentación, sin perjuicio de las facultades de comprobación de la Administración. La
          potestad sancionadora exige una norma con rango de Ley y el procedimiento previsto, y con sanción
          únicamente pecuniaria el reconocimiento o el pago voluntario dan reducciones de, al menos, el 20 %
          en las condiciones del artículo 85 de la LPAC. Los servicios públicos locales se gestionan de forma
          directa o indirecta, y la subvención es una disposición dineraria sin contraprestación directa,
          sujeta al cumplimiento de un objetivo, un proyecto, una actividad, un comportamiento singular o una
          situación, que fomenta una actividad de utilidad pública o interés social o promueve una finalidad
          pública.
    - id: m03-l06
      title:
        es: La responsabilidad patrimonial de las Administraciones públicas. Concepto y clases. Requisitos generales.
          Efectos.
      summary:
        es: >-
          Los particulares tienen derecho a ser indemnizados de toda lesión que sea consecuencia del
          funcionamiento normal o anormal de los servicios públicos, salvo fuerza mayor o daños que tengan el
          deber jurídico de soportar. El daño ha de ser efectivo, evaluable económicamente e individualizado,
          y el derecho a reclamar prescribe, con carácter general, al año de producido el hecho o de
          manifestarse su efecto lesivo. Transcurridos seis meses desde que se inició el procedimiento sin
          resolución expresa ni acuerdo formalizado, puede entenderse que la resolución es contraria a la
          indemnización, y el dictamen del Consejo de Estado es preceptivo cuando se reclaman 50.000 euros o
          más.
    - id: m03-l07
      title:
        es: 'Políticas de igualdad y contra la violencia de género. Políticas de igualdad de trato y no discriminación
          de las personas LGTBI. Discapacidad y dependencia: régimen jurídico.'
      summary:
        es: >-
          La LO 3/2007 define la discriminación directa e indirecta por razón de sexo y el acoso, y fija la
          composición equilibrada en un máximo del sesenta y un mínimo del cuarenta por ciento de cada sexo.
          El Gobierno aprueba al inicio de cada legislatura un Plan para la Igualdad entre mujeres y hombres
          en la Administración General del Estado, y la Ley 4/2023 permite a las personas de nacionalidad
          española mayores de dieciséis años solicitar por sí mismas la rectificación de la mención registral
          relativa al sexo. La Ley 39/2006 clasifica la dependencia en grados y, desde el 23 de octubre de
          2026, fija un plazo máximo de tres meses para resolver su reconocimiento.
  - id: m04
    title:
      es: Gestión de personal
    summary:
      es: >-
        Las clases de personal al servicio de las Administraciones Públicas, su selección y la Oferta de Empleo
        Público, la adquisición y pérdida de la condición de funcionario, las situaciones administrativas, la provisión
        de puestos, los derechos, permisos y deberes, la carrera y la promoción interna. Incluye también las
        incompatibilidades, el régimen disciplinario, la Seguridad Social de los funcionarios y del personal laboral, y
        el IV Convenio único para el personal laboral de la Administración General del Estado.
    lessons:
    - id: m04-l01
      title:
        es: 'El personal al servicio de las Administraciones públicas: concepto y clases. El texto refundido del
          Estatuto Básico del Empleado Público y demás normativa de aplicación. Las competencias en materia de personal.
          El Registro Central de Personal.'
      summary:
        es: >-
          Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al
          servicio de los intereses generales, y se clasifican en funcionarios de carrera, funcionarios
          interinos, personal laboral y personal eventual, cuyo nombramiento y cese son libres. El TREBEP
          deroga una lista de artículos de la Ley 30/1984 con el alcance del apartado 2 de su disposición
          final cuarta, que mantiene en vigor en cada Administración Pública las normas vigentes sobre
          ordenación, planificación y gestión de recursos humanos en tanto no se opongan al Estatuto, hasta
          que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo. En el Registro
          Central de Personal se inscribe el personal de la Administración General del Estado y se anotan los
          actos que afecten a su vida administrativa, que los órganos de personal comunican en un plazo máximo
          de tres días.
    - id: m04-l02
      title:
        es: Selección de personal. Los procesos selectivos en la Administración pública y su conexión con la Oferta
          de Empleo Público. Principios constitucionales. Acceso al empleo público y provisión de puestos de trabajo
          de las personas con discapacidad.
      summary:
        es: >-
          La Oferta de Empleo Público recoge las necesidades de personal de nuevo ingreso con asignación
          presupuestaria y su ejecución debe desarrollarse en un plazo improrrogable de tres años; en la
          Administración del Estado incluye no menos del treinta por ciento de las plazas de acceso libre para
          promoción interna. Los órganos de selección son colegiados, y en la Administración General del
          Estado son los Tribunales y las Comisiones Permanentes de Selección. Las ofertas reservan a personas
          con discapacidad un cupo no inferior al siete por ciento de las vacantes, que en la Administración
          del Estado es no inferior al diez por ciento de las plazas convocadas, con al menos un dos por
          ciento para discapacidad intelectual.
    - id: m04-l03
      title:
        es: 'El personal funcionario al servicio de las Administraciones públicas: funcionarios de carrera y funcionarios
          interinos. La selección de los funcionarios.'
      summary:
        es: >-
          Los funcionarios interinos se nombran por plazas vacantes sin cobertura posible por funcionarios de
          carrera hasta un máximo de tres años, para la sustitución transitoria de los titulares durante el
          tiempo estrictamente necesario, para programas de carácter temporal de hasta tres años, ampliables
          hasta doce meses más por las leyes de Función Pública de desarrollo, o por exceso o acumulación de
          tareas hasta nueve meses dentro de un periodo de dieciocho. Para participar en los procesos
          selectivos hay que tener, entre otros requisitos, la nacionalidad española, sin perjuicio de lo
          dispuesto en el Estatuto para los nacionales de otros Estados, y dieciséis años cumplidos sin
          exceder, en su caso, la edad máxima de jubilación forzosa. Los sistemas selectivos de funcionarios
          de carrera son la oposición y el concurso-oposición, y el concurso solo cabe con carácter
          excepcional y en virtud de ley.
    - id: m04-l04
      title:
        es: Adquisición y pérdida de la condición de funcionario. Situaciones administrativas de los funcionarios.
          Supuestos y efectos de cada una de ellas.
      summary:
        es: >-
          La condición de funcionario de carrera se adquiere por la superación del proceso selectivo, el
          nombramiento publicado, el acatamiento de la Constitución y, en su caso, del Estatuto de Autonomía
          correspondiente y del resto del Ordenamiento Jurídico, y la toma de posesión, que en la
          Administración del Estado debe hacerse en quince días naturales desde la publicación del
          nombramiento o en un mes si supone cambio de localidad de residencia. Se pierde por renuncia,
          pérdida de la nacionalidad, jubilación total, separación del servicio firme o inhabilitación firme.
          Las situaciones son el servicio activo, los servicios especiales, el servicio en otras
          Administraciones Públicas, la excedencia en sus modalidades y la suspensión de funciones, y el
          Reglamento de Situaciones Administrativas añade, entre otras, la expectativa de destino y la
          excedencia voluntaria por prestación de servicios en el sector público.
    - id: m04-l05
      title:
        es: Provisión de puestos de trabajo en la función pública. Los deberes y derechos de los funcionarios. La
          carrera administrativa. Promoción interna.
      summary:
        es: >-
          El concurso es el sistema normal de provisión y la libre designación solo cubre los puestos que el
          Reglamento enumera, como los de Subdirector general; para concursar hay que permanecer, salvo
          excepciones, dos años en el puesto definitivo, y la toma de posesión se hace en tres días hábiles o
          en un mes si hay cambio de residencia o reingreso al servicio activo. Los funcionarios tienen, entre
          otros, seis días de asuntos particulares, diecinueve semanas de permiso por nacimiento, veintidós
          días hábiles de vacaciones y un código de conducta de principios éticos y de conducta. El grado
          personal se consolida con dos años continuados o tres con interrupción, y la promoción interna exige
          al menos dos años de servicio activo en el Subgrupo inferior.
    - id: m04-l06
      title:
        es: 'Las incompatibilidades. Régimen disciplinario: faltas, sanciones y procedimiento.'
      summary:
        es: >-
          El personal de las Administraciones Públicas solo puede desempeñar un segundo puesto o actividad en
          el sector público en los supuestos de la Ley 53/1984 y con la previa y expresa autorización de
          compatibilidad, y las actividades privadas requieren el previo reconocimiento de compatibilidad,
          salvo las actividades exceptuadas. El TREBEP enumera las faltas muy graves y fija la prescripción de
          las faltas en tres años, dos años y seis meses y la de las sanciones en tres años, dos años y un
          año, y el RD 33/1986 tipifica las faltas graves y leves y regula el procedimiento con Instructor y
          pliego de cargos. La suspensión provisional del funcionario durante el expediente disciplinario no
          puede exceder de seis meses, salvo paralización imputable al interesado.
    - id: m04-l07
      title:
        es: El régimen de la Seguridad Social de los funcionarios. La MUFACE y las clases pasivas.
      summary:
        es: >-
          El Régimen especial de la Seguridad Social de los Funcionarios Civiles del Estado lo integran el
          Régimen de Clases Pasivas y el mutualismo administrativo que gestiona la MUFACE, un organismo
          público, y quienes ingresan desde el 1 de enero de 2011 quedan en el Régimen General a los
          exclusivos efectos de pensiones. En incapacidad temporal el funcionario percibe la totalidad de sus
          retribuciones los tres primeros meses y, desde el cuarto, las retribuciones básicas y un subsidio de
          la MUFACE que es la mayor de dos cantidades: el 80 por ciento de las básicas o el 75 por ciento de
          las complementarias del tercer mes. La jubilación voluntaria en Clases Pasivas exige sesenta años de
          edad y treinta de servicios efectivos al Estado, y la pensión ordinaria de jubilación, quince años
          de servicios efectivos.
    - id: m04-l08
      title:
        es: 'El personal laboral al servicio de las Administraciones públicas. Selección. Derechos, deberes e incompatibilidades.
          El IV Convenio único para el personal laboral de la Administración General del Estado: ámbito de aplicación
          y sistema de clasificación.'
      summary:
        es: >-
          El personal laboral se rige por la legislación laboral, las demás normas convencionalmente
          aplicables y los preceptos del TREBEP que así lo dispongan, y los sistemas selectivos del personal
          laboral fijo son la oposición, el concurso-oposición y el concurso de valoración de méritos. El IV
          Convenio único se aplica al personal laboral de la Administración General del Estado y sus
          organismos autónomos, y excluye, entre otros, al que presta servicios en el exterior. Establece los
          grupos profesionales M3, M2, M1, E2, E1 y E0 de acuerdo con la titulación exigida para el ingreso en
          los mismos.
    - id: m04-l09
      title:
        es: El régimen de la Seguridad Social del personal laboral. La acción protectora. Tipos y características
          de las prestaciones.
      summary:
        es: >-
          El personal civil no funcionario de las administraciones públicas está comprendido en el Régimen
          General de la Seguridad Social, salvo que una ley especial lo incluya en otro régimen obligatorio de
          previsión social. Las prestaciones no pueden retenerse, sin perjuicio de su tributación, cederse,
          compensarse ni descontarse salvo por obligaciones alimenticias a favor del cónyuge e hijos u
          obligaciones contraídas por el beneficiario dentro de la Seguridad Social, y las pensiones
          contributivas por contingencias comunes se pagan en catorce pagas. La incapacidad temporal dura como
          máximo trescientos sesenta y cinco días, prorrogables por otros ciento ochenta cuando se presuma que
          durante ellos puede el trabajador ser dado de alta médica por curación, y desde 2027 la jubilación
          exige sesenta y siete años, o sesenta y cinco con treinta y ocho años y seis meses cotizados.
  - id: m05
    title:
      es: Gestión financiera
    summary:
      es: >-
        El presupuesto y sus principios, el ciclo presupuestario, la estructura de los Presupuestos Generales del
        Estado, los créditos y sus modificaciones, y la ejecución del gasto con sus fases, documentos contables, pagos,
        control y Tribunal de Cuentas. Incluye también las retribuciones e indemnizaciones del personal, la
        clasificación económica de los gastos, los anticipos de caja fija y los pagos a justificar, y la gestión
        económica de los contratos y de las subvenciones.
    lessons:
    - id: m05-l01
      title:
        es: 'El presupuesto: concepto. Los principios presupuestarios. El ciclo presupuestario. El presupuesto por
          programas: concepto y fases. Terminología y desarrollo del proceso presupuestario.'
      summary:
        es: >-
          Los Presupuestos Generales del Estado son la expresión cifrada, conjunta y sistemática de los
          derechos y obligaciones a liquidar durante el ejercicio, que coincide con el año natural; los
          elabora el Gobierno y los aprueban las Cortes Generales. El proyecto se remite a las Cortes antes
          del 1 de octubre del año anterior, y si la ley no se aprueba antes del primer día del ejercicio se
          prorrogan automáticamente los presupuestos iniciales del anterior; a 17-10-2026 rigen prorrogados
          los de 2023. Los escenarios presupuestarios plurianuales los confecciona el Ministerio de Hacienda
          para los tres ejercicios siguientes, y los programas finalistas son los que admiten objetivos
          cuantificables e indicadores de ejecución mensurables.
    - id: m05-l02
      title:
        es: 'El presupuesto del Estado en España: concepto y estructura. Los créditos presupuestarios: clasificación.
          Gastos plurianuales. Las modificaciones presupuestarias: créditos extraordinarios y suplementos de crédito.
          Ampliaciones de crédito. Generaciones de crédito. Transferencias de crédito. Incorporaciones de crédito.
          Anticipos de tesorería.'
      summary:
        es: >-
          Las modificaciones de crédito son transferencias, generaciones, ampliaciones, créditos
          extraordinarios y suplementos e incorporaciones; las transferencias tienen restricciones, entre
          ellas no ir de operaciones de capital a corrientes ni entre secciones, salvo las excepciones de la
          ley, y las autoriza el titular del ministerio, previo informe favorable de la Intervención Delegada,
          dentro de un programa o entre programas de un servicio cuando no afectan a personal ni incrementan
          otros créditos que la ley especifica aparte; las demás, el Ministro de Hacienda o el órgano que fije
          la ley, y las de reorganizaciones entre secciones, el Gobierno. En un organismo autónomo el
          suplemento lo autoriza su Presidente o Director hasta el 10 % del correspondiente capítulo de su
          presupuesto inicial de gastos sin superar 500.000 euros, salvo en gastos de personal y otros
          créditos especificados aparte; el Ministro de Hacienda mientras no se alcance el 20 % ni se superen
          1.000.000 de euros, y el Consejo de Ministros en los demás casos, con los límites computados sobre
          el conjunto de las modificaciones del ejercicio, por separado para personal, para esos otros
          créditos y para el resto, y sin contar las financiadas con incremento de la aportación del Estado;
          si atiende obligaciones de ejercicios anteriores sin crédito anulado, se remite un proyecto de ley a
          las Cortes; se financia con remanente de tesorería no aplicado o mayores ingresos. Un gasto
          plurianual se aplica como máximo a cuatro ejercicios, y lo imputado a cada ejercicio posterior no
          excede del 70, 60, 50 y 50 por ciento del crédito inicial, salvo en la carga financiera de la Deuda
          y los arrendamientos de inmuebles; el Gobierno puede modificar esos límites en casos especialmente
          justificados.
    - id: m05-l03
      title:
        es: 'El procedimiento administrativo de ejecución del presupuesto de gasto. Órganos competentes. Fases del
          procedimiento y sus documentos contables. Compromisos de gasto para ejercicios posteriores. La ordenación
          del pago: concepto y competencia. Realización del pago: modos y perceptores. Control del gasto público.
          Clases. Especial referencia al control de legalidad. El Tribunal de Cuentas.'
      summary:
        es: >-
          El gasto se ejecuta en aprobación, compromiso, reconocimiento de la obligación, ordenación del pago
          y pago material; en los ministerios los Ministros aprueban y comprometen, salvo los casos reservados
          por la ley al Consejo de Ministros, y reconocen las obligaciones, en los organismos autónomos sus
          presidentes o directores, con la misma salvedad, aprueban, comprometen, reconocen y pagan, y el
          Director General del Tesoro y Política Financiera ordena los pagos del Estado. Cada fase de la IOC
          tiene su documento contable (A, D y OK, con un RC al iniciar el expediente, o AD y ADOK si se
          acumulan fases), y las propuestas de pago se expiden a favor de los acreedores directos o, en los
          supuestos que fija la Orden PRE/1576/2002, de agentes mediadores en el pago. La Intervención General
          ejerce el control interno mediante la función interventora, el control financiero permanente y la
          auditoría pública, y el Tribunal de Cuentas, de doce Consejeros, ejerce el control externo y examina
          la Cuenta General del Estado en seis meses.
    - id: m05-l04
      title:
        es: 'Las retribuciones e indemnizaciones de los funcionarios públicos y del personal laboral al servicio
          de la Administración pública. Nóminas: estructura y normas de confección. Altas y bajas: su justificación.
          Retribuciones básicas: sueldos, trienios, pagas extraordinarias. Retribuciones complementarias y otras
          remuneraciones. Devengo y liquidación de derechos económicos. El pago de las retribuciones del personal
          en activo. Formas de pago.'
      summary:
        es: >-
          Las retribuciones de los funcionarios son básicas, como el sueldo y los trienios, y complementarias,
          como los complementos de destino, específico y de productividad y las gratificaciones por servicios
          extraordinarios, que nunca son fijas en su cuantía ni periódicas en su devengo; las pagas
          extraordinarias son dos al año. Las cuantías cambian cada año, y en 2026 rige la ley de presupuestos
          de 2023 prorrogada, con un incremento global máximo del 1,5 por ciento de un real decreto-ley, más
          un 0,5 por ciento adicional si la variación del IPC de 2026 es igual o superior al 1,5 por ciento;
          las retribuciones fijas y mensuales se liquidan por días, entre otros casos, en el mes de toma de
          posesión del primer destino en un Cuerpo o Escala. Las dietas de las comisiones de servicio con
          derecho a indemnización dependen del grupo, con reglas de manutención por la hora de salida y de
          regreso, y el uso del automóvil particular se indemniza a 0,26 euros por kilómetro.
    - id: m05-l05
      title:
        es: 'Gastos para la compra de bienes y servicios. Gastos de inversión. Gastos de transferencias: corrientes
          y de capital. Pagos: concepto y tipos. Pagos por obligaciones presupuestarias. Anticipos de caja fija.
          Pagos «a justificar». Justificación de libramientos.'
      summary:
        es: >-
          El capítulo 2 recoge los gastos corrientes en bienes y servicios que no aumentan el capital o el
          patrimonio público, el capítulo 6 las inversiones reales, como los bienes inventariables para el
          funcionamiento operativo de los servicios, y los capítulos 4 y 7 los pagos sin contrapartida directa
          que el receptor destina a gastos corrientes o a operaciones de capital. Los anticipos de caja fija
          son provisiones extrapresupuestarias para gastos periódicos o repetitivos del capítulo 2, que los
          ministerios y organismos autónomos establecen por acuerdo de su titular, sin pasar del 7 % de ese
          capítulo ni de 5.000 euros por pago, salvo excepciones, y cuyas cuentas aprueban los Jefes de las
          Unidades Administrativas de las Cajas o, si la organización lo requiere, los Órganos centrales. Los
          fondos a justificar se libran a Cajas pagadoras cuando, entre otros casos, la documentación
          justificativa no puede aportarse al reconocer la obligación, y los Cajeros justifican dentro del mes
          siguiente a la inversión y en todo caso en tres meses desde la percepción, salvo ampliación o plazo
          especial.
    - id: m05-l06
      title:
        es: Gestión económica y financiera de los contratos del sector público. Gestión económica y financiera de
          subvenciones.
      summary:
        es: >-
          La Administración aprueba la conformidad en los treinta días siguientes a la entrega o prestación y
          paga en los treinta días siguientes a esa aprobación; si la demora supera cuatro meses el
          contratista puede, en su caso, suspender el cumplimiento del contrato avisando con un mes de
          antelación, y si supera seis, resolverlo. En la tramitación anticipada de un contrato el Servicio
          gestor expide un RC de «tramitación anticipada» con el importe de cada ejercicio posterior, y si el
          contrato se resuelve expide documentos AD y RC negativos por el importe no ejecutado. En las
          subvenciones la aprobación del gasto precede a la convocatoria o a la concesión directa, la
          concesión conlleva el compromiso del gasto, el pago exige justificación previa salvo los pagos
          anticipados que prevea la normativa reguladora, y el derecho a reconocer o liquidar el reintegro
          prescribe a los cuatro años.
  - id: m06
    title:
      es: Informática básica y ofimática
    summary:
      es: >-
        Informática básica y Windows 11: hardware, software, almacenamiento, seguridad, el entorno gráfico, el
        Explorador de archivos, los accesorios y las herramientas del sistema. Las aplicaciones de Microsoft 365 de
        escritorio Word, Excel, Access y Outlook, e Internet con sus protocolos y el navegador.
    lessons:
    - id: m06-l01
      title:
        es: 'Informática básica: conceptos fundamentales sobre el hardware y el software. Sistemas de almacenamiento
          de datos. Sistemas operativos. Nociones básicas de seguridad informática.'
      summary:
        es: >-
          Hardware, software, almacenamiento, sistemas operativos y seguridad, con los conceptos que preguntan los
          exámenes: CPU, RAM, caché, múltiplos del byte, NTFS, malware, antivirus y cortafuegos. Incluye los
          requisitos de Windows 11, RAID, la nube, la autenticación multifactor y el ENS.
    - id: m06-l02
      title:
        es: 'Introducción al sistema operativo: el entorno Windows. Fundamentos. Trabajo en el entorno gráfico de
          Windows: ventanas, iconos, menús contextuales, cuadros de diálogo. El escritorio y sus elementos. El menú
          inicio. Copilot.'
      summary:
        es: >-
          Windows 11: ventanas, menús contextuales y cuadros de diálogo, con sus teclas. El escritorio, la barra de
          tareas, las notificaciones, varios escritorios, varias pantallas y el menú Inicio. Copilot en Windows, Word,
          Excel y Outlook.
    - id: m06-l03
      title:
        es: El explorador de Windows. Gestión de carpetas y archivos. Operaciones de búsqueda. Herramientas «Este
          equipo» y «Acceso rápido». Accesorios. Herramientas del sistema.
      summary:
        es: >-
          El Explorador de archivos de Windows 11: diseños, extensiones, menú contextual, rutas UNC, Inicio, Acceso
          rápido y Este equipo. Gestión de archivos con sus teclas, búsqueda con indexación y Buscar en Windows.
          Accesorios (Bloc de notas, Recortes, Paint, Calculadora) y herramientas del sistema (Administrador de
          tareas, Visor de eventos, Historial de archivos).
    - id: m06-l04
      title:
        es: 'Procesadores de texto: Word 365. Principales funciones y utilidades. Creación y estructuración del
          documento. Gestión, grabación, recuperación e impresión de ficheros. Personalización del entorno de trabajo.'
      summary:
        es: >-
          Word de Microsoft 365: la cinta, la barra de estado, la revisión, Lectura en voz alta, Transcribir, combinar
          correspondencia y macros. Estilos de título, tabla de contenido, índice, notas, secciones, encabezados y
          tablas. Formatos y plantillas, Autoguardado, Autorrecuperación, PDF, impresión y personalización de la cinta
          y la barra de herramientas de acceso rápido.
    - id: m06-l05
      title:
        es: 'Hojas de cálculo: Excel 365. Principales funciones y utilidades. Libros, hojas y celdas. Configuración.
          Introducción y edición de datos. Fórmulas y funciones. Gráficos. Gestión de datos. Personalización del
          entorno de trabajo.'
      summary:
        es: >-
          Excel de Microsoft 365: hojas, rangos, protección, Inmovilizar paneles y formatos de fecha personalizados.
          Referencias relativas, absolutas, a otras hojas y estructuradas; SI, NO, O, SI.ERROR, CONTARA, BUSCARV y el
          error #N/A. Gráficos recomendados, ordenar, Autofiltro, Subtotales, tablas dinámicas, segmentación de datos,
          Power Query, Validación de datos, Imprimir y la cinta.
    - id: m06-l06
      title:
        es: 'Bases de datos: Access 365. Principales funciones y utilidades. Tablas. Consultas. Formularios. Informes.
          Relaciones. Importación, vinculación y exportación de datos.'
      summary:
        es: >-
          Access de Microsoft 365: objetos, límites, Compactar y reparar base de datos y Dividir la base de datos.
          Tipos de datos, propiedades de campo, clave principal y reglas de validación; consultas de selección, de
          acción y de parámetros, criterios y WHERE. Formularios y subformularios, informes y sus secciones,
          relaciones con integridad referencial, e importar, vincular y exportar datos.
    - id: m06-l07
      title:
        es: 'Correo electrónico: Outlook 365. Conceptos elementales y funcionamiento. El entorno de trabajo. Enviar,
          recibir, responder y reenviar mensajes. Creación de mensajes. Reglas de mensaje. Libreta de direcciones.'
      summary:
        es: >-
          Outlook de Microsoft 365 en sus dos clientes, Outlook clásico y el nuevo Outlook: IMAP, POP y S/MIME,
          grupos, permisos de carpeta y acceso delegado. Búsqueda, Buzón actual, categorías, Limpieza de buzón y
          Archivar; responder, reenviar, recuperar mensaje y programar envío, importancia y firmas. Reglas sobre
          mensajes nuevos y existentes, libreta de direcciones y grupos de contactos.
    - id: m06-l08
      title:
        es: 'La Red Internet: origen, evolución y estado actual. Conceptos elementales sobre protocolos y servicios
          en Internet. Funcionalidades básicas de los navegadores web.'
      summary:
        es: >-
          ARPANET, el paso a TCP/IP en 1983, la World Wide Web y la Web 4.0. Protocolos y servicios de Internet: capas
          TCP/IP, dirección IP y direcciones privadas, DNS, HTTP y HTTPS, FTP, SMTP, HTML, JavaScript, diseño
          adaptable y spam. En el navegador (Microsoft Edge): cookies, historial, favoritos, descargas, InPrivate,
          extensiones y anclar un sitio a Inicio.
# exams: not declared yet. The presets schema exists (docs/curset-platform-delta-exams.md, part A), but part 1
