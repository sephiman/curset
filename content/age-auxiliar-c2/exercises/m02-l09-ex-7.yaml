# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q113
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función FORMULATEXTO?"
  options:
  - id: a
    text:
      es: "Devuelve VERDADERO si hay una referencia a una celda con fórmula"
  - id: b
    text:
      es: "Devuelve información sobre el formato, la ubicación o el contenido de una celda"
  - id: c
    correct: true
    text:
      es: "Devuelve la fórmula de la referencia dada como texto"
  - id: d
    text:
      es: "Devuelve un valor convertido en un número"
  explanation:
    es: "FORMULATEXTO devuelve la fórmula de la referencia dada como texto. Detectar si una celda tiene fórmula es ESFORMULA, CELDA da información sobre formato, ubicación o contenido y N convierte un valor en un número."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
