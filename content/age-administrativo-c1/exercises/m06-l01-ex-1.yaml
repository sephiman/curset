# anchor: fuente-ms-sql-bits-html
- id: m06-l01-q030
  prompt:
    es: "Según la documentación de Microsoft sobre manipulación de bits, ¿a qué número decimal equivale la secuencia binaria 00000111, calculada con potencias de 2?"
  options:
  - id: a
    text:
      es: "Al número 3."
  - id: b
    correct: true
    text:
      es: "Al número 7."
  - id: c
    text:
      es: "Al número 111."
  - id: d
    text:
      es: "Al número 8."
  explanation:
    es: "La página lo calcula así: 00000111 = 2^2 + 2^1 + 2^0 = 4 + 2 + 1 = 7. El 3 suma solo dos de los tres bits a 1, el 111 lee la secuencia como si fuera decimal y el 8 es 2^3, un bit que en esta secuencia vale 0."
  citation: "fuente: `ms-sql-bits.html`; «Funciones de manipulación de bits»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q031
  prompt:
    es: "Con el prefijo decimal giga del Sistema Internacional de Unidades, y no con el prefijo binario gibi, ¿cuántos bytes son 1 gigabyte (1 GB)?"
  options:
  - id: a
    text:
      es: "1.073.741.824 bytes (2^30)."
  - id: b
    text:
      es: "1.000.000 bytes (10^6)."
  - id: c
    correct: true
    text:
      es: "1.000.000.000 bytes (10^9)."
  - id: d
    text:
      es: "1.048.576 bytes (2^20)."
  explanation:
    es: "El NIST da 1 GB = 10^9 B = 1.000.000.000 B. 1.073.741.824 bytes es 1 GiB, con el prefijo binario gibi (2^30) que el enunciado excluye; 1.000.000 bytes es 1 MB; y 1.048.576 bytes es 1 MiB (2^20)."
  citation: "fuente: `nist-prefijos-binarios.html`; «Examples and comparisons with SI prefixes»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q032
  prompt:
    es: "¿Cuál de las siguientes igualdades es correcta si se usan los prefijos decimales del Sistema Internacional de Unidades para los múltiplos del byte?"
  options:
  - id: a
    text:
      es: "1 GB equivale a 1.000 KB."
  - id: b
    text:
      es: "1 MB equivale a 1.000 GB."
  - id: c
    text:
      es: "1 TB equivale a 1.000 MB."
  - id: d
    correct: true
    text:
      es: "1 GB equivale a 1.000 MB."
  explanation:
    es: "El NIST da 1 MB = 10^6 B y 1 GB = 10^9 B, así que 1 GB son 10^9 / 10^6 = 1.000 MB. Con kilo = 10^3, 1 GB son 1.000.000 KB, no 1.000; 1 MB es la milésima parte de un GB, no mil GB; y tera = (10^3)^4 hace que 1 TB sean 1.000.000 MB."
  citation: "fuente: `nist-prefijos-binarios.html`; «Examples and comparisons with SI prefixes»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-nist-prefijos-binarios-html
- id: m06-l01-q033
  prompt:
    es: "¿Qué prefijo del Sistema Internacional de Unidades sigue inmediatamente al prefijo peta en la escala de múltiplos del byte, según la tabla del NIST?"
  options:
  - id: a
    correct: true
    text:
      es: "Exa (E), de factor (10^3)^6."
  - id: b
    text:
      es: "Exbi (Ei), de factor (2^10)^6."
  - id: c
    text:
      es: "Pebi (Pi), de factor (2^10)^5."
  - id: d
    text:
      es: "Giga (G), de factor (10^3)^3."
  explanation:
    es: "En la tabla del NIST, peta vale (10^3)^5 y exa vale (10^3)^6: exa es el siguiente prefijo decimal. Exbi y pebi son prefijos binarios, que según el NIST no forman parte del Sistema Internacional; y giga, (10^3)^3, está por debajo de peta."
  citation: "fuente: `nist-prefijos-binarios.html`; «Prefixes for binary multiples»"
  difficulty: 2
  tags:
  - "cantidad"
