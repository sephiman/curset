m07-l05-q01:
  key:
    anchor: rfc9110#section-9.2.2
    sentence: A request method is considered "idempotent" if the intended effect on the server of multiple identical requests with that method is the same as the effect for a single such request.
  wrong:
  - option: The server returns the identical response to every repeated request with that method
    anchor: rfc9110#section-9.2.2
    sentence: It knows that repeating the request will have the same intended effect, even if the original request succeeded, though the response might differ.
  - option: The server keeps no log of the repeated requests and produces no side effect at all
    anchor: rfc9110#section-9.2.2
    sentence: a server is free to log each request separately, retain a revision control history, or implement other non-idempotent side effects for each idempotent request.
  - option: The method is safe, so repeating the request can never change the state of the resource
    anchor: rfc9110#section-9.2.2
    sentence: Of the request methods defined by this specification, PUT, DELETE, and safe request methods are idempotent.
m07-l05-q02:
  key:
    anchor: rfc9110#section-9.2.2
    sentence: A client SHOULD NOT automatically retry a request with a non-idempotent method unless it has some means to know that the request semantics are actually idempotent, regardless of the method, or some means to detect that the original request was never applied.
  wrong:
  - option: A proxy on the path may retry the request automatically, because proxies hold no state
    anchor: rfc9110#section-9.2.2
    sentence: A proxy MUST NOT automatically retry non-idempotent requests.
  - option: The client may retry again, without limit, whenever an automatic retry itself fails
    anchor: rfc9110#section-9.2.2
    sentence: A client SHOULD NOT automatically retry a failed automatic retry.
  - option: The client may always retry, because `POST` is a safe method
    anchor: rfc9110#section-9.3.3
    sentence: In contrast, a POST request cannot be satisfied by a cached POST response because POST is potentially unsafe; see Section 4 of [CACHING].
m07-l05-q03:
  key:
    anchor: ietf-httpapi-idempotency-key#content
    sentence: An idempotency key is a unique value generated by the client which the resource uses to recognize subsequent retries of the same request.
  wrong:
  - option: A checksum that the resource computes from the request payload data
    anchor: ietf-httpapi-idempotency-key#content
    sentence: Such a fingerprint is generated from request payload data by the resource.
  - option: A sequence number that the client must increase with every new request
    anchor: ietf-httpapi-idempotency-key#content
    sentence: It is RECOMMENDED that a UUID [RFC9562] or a similar random identifier be used as an idempotency key.
  - option: A token that the server issues in its first response, which the client then echoes on every retry of that request
    anchor: ietf-httpapi-idempotency-key#content
    sentence: Clients MAY choose to send an Idempotency-Key field with any valid value to indicate the user's intent is to only perform this action once.
m07-l05-q04:
  key:
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If there is an attempt to reuse an idempotency key with a different request payload, the resource SHOULD reply with an HTTP 422 status code
  wrong:
  - option: '`400`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If the Idempotency-Key request header is missing for a documented idempotent operation requiring this header, the resource SHOULD reply with an HTTP 400 status code
  - option: '`409`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If the request is retried, while the original request is still being processed, the resource SHOULD reply with an HTTP 409 status code
  - option: '`200`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: The idempotency key MUST be unique and MUST NOT be reused with another request with a different request payload.
m07-l05-q05:
  key:
    anchor: rfc9110#section-13.1.1
    sentence: Instead, the origin server MAY indicate that the conditional request failed by responding with a 412 (Precondition Failed) status code.
  wrong:
  - option: It applies the `PUT` and returns the new entity tag in the response
    anchor: rfc9110#section-13.1.1
    sentence: An origin server that evaluates an If-Match condition MUST NOT perform the requested method if the condition evaluates to false.
  - option: It compares the entity tags with the weak comparison function and applies the method on a weak match
    anchor: rfc9110#section-13.1.1
    sentence: An origin server MUST use the strong comparison function when comparing entity tags for If-Match (Section 8.8.3.2)
  - option: It answers `428` (Precondition Required) because the condition evaluated to false
    anchor: rfc6585#section-3
    sentence: The 428 status code indicates that the origin server requires the request to be conditional.
m07-l05-q06:
  key:
    anchor: rfc6585#section-3
    sentence: The 428 status code indicates that the origin server requires the request to be conditional.
  wrong:
  - option: The user sent too many requests in a given amount of time
    anchor: rfc6585#section-4
    sentence: The 429 status code indicates that the user has sent too many requests in a given amount of time ("rate limiting").
  - option: One or more conditions in the request header fields evaluated to false on the server
    anchor: rfc9110#section-15.5.13
    sentence: The 412 (Precondition Failed) status code indicates that one or more conditions given in the request header fields evaluated to false when tested on the server (Section 13).
  - option: The request has been accepted for processing, but the processing has not been completed
    anchor: rfc9110#section-15.3.3
    sentence: The 202 (Accepted) status code indicates that the request has been accepted for processing, but the processing has not been completed.
m07-l05-q07:
  key:
    anchor: rfc9110#section-8.8.3
    sentence: then the origin server MUST mark the entity tag as weak by prefixing its opaque value with "W/" (case-sensitive).
  wrong:
  - option: It appends the suffix `/weak` after the closing double quote
    anchor: rfc9110#section-8.8.3
    sentence: ETag = entity-tag entity-tag = [ weak ] opaque-tag
  - option: It sends the tag in a separate `Weak-ETag` response header field
    anchor: rfc9110#section-8.8.3
    sentence: An entity tag consists of an opaque quoted string, possibly prefixed by a weakness indicator.
  - option: It prefixes the quoted string with a lowercase `w/`
    anchor: rfc9110#section-8.8.3
    sentence: weak = %s"W/"
m07-l05-q08:
  key:
    anchor: rfc9457#section-4
    sentence: Problem details are not a debugging tool for the underlying implementation; rather, they are a way to expose greater detail about the HTTP interface itself.
  wrong:
  - option: Implementation internals, such as stack traces, to help the client debug
    anchor: rfc9457#section-4
    sentence: Designers of new problem types need to carefully take into account the Security Considerations (Section 5), in particular, the risk of exposing attack vectors by exposing implementation internals through error messages.
  - option: A replacement for the domain-specific error formats that an application already defines
    anchor: rfc9457#section-4
    sentence: Problem details are intended to avoid the necessity of establishing new "fault" or "error" document formats, not to replace existing domain-specific formats.
  - option: Generic conditions that apply to any resource, such as a forbidden write
    anchor: rfc9457#section-4
    sentence: Likewise, truly generic problems -- i.e., conditions that might apply to any resource on the Web -- are usually better expressed as plain status codes.
m07-l05-q09:
  key:
    anchor: rfc9457#section-4
    sentence: New problem type definitions MUST document:¶ a type URI (typically, with the "http" or "https" scheme)¶ a title that appropriately describes it (think short)¶ the HTTP status code for it to be used with¶
  wrong:
  - option: A type URI, a title and the `Retry-After` value that clients must honour
    anchor: rfc9457#section-4
    sentence: Problem type definitions MAY specify the use of the Retry-After response header ([HTTP], Section 10.2.3) in appropriate circumstances.
  - option: A type URI, a title and the additional members of the problem details object
    anchor: rfc9457#section-4
    sentence: A problem type definition MAY specify additional members on the problem details object.
  - option: A type URI, a title and an HTML page that explains how to resolve the problem
    anchor: rfc9457#section-4
    sentence: A problem type URI SHOULD resolve to HTML [HTML5] documentation that explains how to resolve the problem.
m07-l05-q10:
  key:
    anchor: spring-fw-webmvc-ann-rest-exceptions#page-title
    sentence: ProblemDetail — representation for an RFC 9457 problem detail; a simple container for both standard fields defined in the spec, and for non-standard ones.
  wrong:
  - option: '`ErrorResponse`'
    anchor: spring-fw-webmvc-ann-rest-exceptions#page-title
    sentence: ErrorResponse — contract to expose HTTP error response details including HTTP status, response headers, and a body in the format of RFC 9457; this allows exceptions to encapsulate and expose the details of how they map to an HTTP response.
  - option: '`ErrorResponseException`'
    anchor: spring-fw-webmvc-ann-rest-exceptions#page-title
    sentence: ErrorResponseException — basic ErrorResponse implementation that others can use as a convenient base class.
  - option: '`ResponseEntityExceptionHandler`'
    anchor: spring-fw-webmvc-ann-rest-exceptions#page-title
    sentence: ResponseEntityExceptionHandler — convenient base class for an @ControllerAdvice that handles all Spring MVC exceptions, and any ErrorResponseException, and renders an error response with a body.
m07-l05-q11:
  key:
    anchor: rfc9110#section-15.3.3
    sentence: The 202 (Accepted) status code indicates that the request has been accepted for processing, but the processing has not been completed.
  wrong:
  - option: A new resource was created, and a `Location` header identifies it
    anchor: rfc9110#section-9.3.3
    sentence: the origin server SHOULD send a 201 (Created) response containing a Location header field that provides an identifier for the primary resource created
  - option: The request will certainly be acted upon later, so the client need not check
    anchor: rfc9110#section-15.3.3
    sentence: The request might or might not eventually be acted upon, as it might be disallowed when processing actually takes place.
  - option: The server will later send the final status code over the same connection
    anchor: rfc9110#section-15.3.3
    sentence: There is no facility in HTTP for re-sending a status code from an asynchronous operation.
m07-l05-q12:
  key:
    anchor: rfc9110#section-10.2.3
    sentence: The Retry-After field value can be either an HTTP-date or a number of seconds to delay after receiving the response.
  wrong:
  - option: An HTTP-date, or a number of milliseconds to delay
    anchor: rfc9110#section-10.2.3
    sentence: In the latter example, the delay is 2 minutes.
  - option: An ISO 8601 duration, or a number of seconds to delay
    anchor: rfc9110#section-10.2.3
    sentence: Retry-After = HTTP-date / delay-seconds
  - option: An HTTP-date, or a signed number of seconds that may be negative, counted from the moment the server sent the response
    anchor: rfc9110#section-10.2.3
    sentence: A delay-seconds value is a non-negative decimal integer, representing time in seconds.
m07-l05-q13:
  key:
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: 'r: This REQUIRED parameter value conveys the available quota under the identified policy'
  wrong:
  - option: The quota allocated by the policy, measured in quota units
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: 'q: The REQUIRED "q" parameter indicates the quota allocated by this policy measured in quota units.'
  - option: The number of seconds within which the client can use no more than the available quota
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: 't: This OPTIONAL parameter value conveys the effective window under the identified policy: the time within which the client can use no more than the available quota'
  - option: The partition key associated to the corresponding request
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: 'pk: The OPTIONAL "pk" parameter value conveys the partition key associated to the corresponding request.'
m07-l05-q14:
  key:
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: Clients MUST NOT assume that a positive available quota is a guarantee that further requests will be served.
  wrong:
  - option: The server guarantees five more requests, because it advertised the quota
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: Conveyed quota hints do not imply any service guarantee.
  - option: The full limit is restored exactly when the 30 seconds of the window have elapsed
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: The client MUST NOT assume that all its service limit will be fully restored after the time indicated by the effective window parameter.
  - option: The quota and the window stay fixed between requests, so the values can be cached
    anchor: ietf-httpapi-ratelimit-headers#content
    sentence: The server MAY arbitrarily alter the available quota and effective window between subsequent requests
m07-l05-q15:
  key:
    anchor: openapi-spec#x4-1-1-fixed-fields
    sentence: REQUIRED. This string MUST be the version number of the OpenAPI Specification that the OpenAPI document uses.
  wrong:
  - option: '`info.version`'
    anchor: openapi-spec#x4-1-1-fixed-fields
    sentence: This is not related to the info.version string, which describes the OpenAPI document’s version.
  - option: '`$self`'
    anchor: openapi-spec#x4-1-1-fixed-fields
    sentence: The $self field provides the self-assigned URI of this document, which also serves as its base URI
  - option: '`jsonSchemaDialect`'
    anchor: openapi-spec#x4-1-1-fixed-fields
    sentence: The default value for the $schema keyword within Schema Objects contained within this OAS document.
m07-l05-q16:
  key:
    anchor: openapi-spec#x4-12-1-parameter-locations
    sentence: A parameter that treats the entire URL query string as a value which MUST be specified using the content field
  wrong:
  - option: '`query`'
    anchor: openapi-spec#x4-12-1-parameter-locations
    sentence: Parameters that are appended to the URL with the ? character (or for subsequent query parameters, with the & character)
  - option: '`path`'
    anchor: openapi-spec#x4-12-1-parameter-locations
    sentence: Used together with Path Templating, where the parameter value is actually part of the operation’s URL.
  - option: '`header`'
    anchor: openapi-spec#x4-12-1-parameter-locations
    sentence: Custom headers that are expected as part of the request.
