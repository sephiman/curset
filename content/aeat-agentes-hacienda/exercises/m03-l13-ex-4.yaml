# anchor: boe-a-2003-23186-art-185
- id: m03-l13-q0042
  prompt:
    es: "De acuerdo con el artículo 185.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las infracciones tributarias se sancionarán mediante la imposición de sanciones pecuniarias y:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando proceda, de sanciones no pecuniarias de carácter accesorio."
  - id: b
    text:
      es: "Solo en las infracciones leves, de amonestación escrita que sustituya a la multa."
  - id: c
    text:
      es: "En todo caso, de sanciones no pecuniarias de carácter principal, junto con la multa."
  - id: d
    text:
      es: "Cuando proceda, de la pérdida definitiva del derecho a aplicar beneficios fiscales."
  explanation:
    es: "El artículo 185.1 LGT prevé sanciones pecuniarias y, cuando proceda, sanciones no pecuniarias de carácter accesorio. No hay sanciones no pecuniarias principales obligatorias, la pérdida de beneficios es temporal según el artículo 186 y la amonestación no existe como sanción tributaria."
  citation: "art. 185.1 LGT"
  difficulty: 1
  tags:
  - "clases"
# anchor: boe-a-2003-23186-art-185
- id: m03-l13-q0043
  prompt:
    es: "¿En qué pueden consistir las sanciones pecuniarias por infracciones tributarias, de acuerdo con el artículo 185.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Multa fija, proporcional o progresiva, según la base de la sanción."
  - id: b
    text:
      es: "Multa proporcional, sin que quepa la multa fija en ninguna infracción."
  - id: c
    text:
      es: "Multa fija o proporcional, y además recargo sobre la deuda tributaria regularizada."
  - id: d
    correct: true
    text:
      es: "Multa fija o proporcional."
  explanation:
    es: "El artículo 185.2 LGT define dos formas de sanción pecuniaria: la multa fija, que es una cantidad determinada (por ejemplo, los 300 euros del artículo 194.2), y la proporcional. No hay multa progresiva, la multa fija sí existe y el recargo es otra figura."
  citation: "art. 185.2 LGT"
  difficulty: 1
  tags:
  - "clases"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0044
  prompt:
    es: "Cuando se hubiera utilizado el criterio de comisión repetida, ¿a partir de qué importe de la multa por infracción grave o muy grave se pueden imponer sanciones accesorias, según el artículo 186.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Igual o superior a 30.000 euros."
  - id: b
    text:
      es: "Igual o superior a 60.000 euros."
  - id: c
    text:
      es: "Superior a 3.000 euros."
  - id: d
    text:
      es: "Igual o superior a 150.000 euros."
  explanation:
    es: "El umbral del artículo 186.1 LGT para infracciones graves o muy graves es una multa igual o superior a 30.000 euros, con comisión repetida. Los 60.000 euros son el umbral del artículo 186.2, solo para infracciones muy graves. Los 3.000 euros distinguen la infracción leve de la grave en el artículo 191, y los 150.000 euros son el segundo escalón del apartado 2."
  citation: "art. 186.1 LGT"
  difficulty: 1
  tags:
  - "importe"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0045
  prompt:
    es: "A Inversiones Calderón, S.L. se le impone por una infracción grave una multa de 40.000 euros y se ha aplicado el criterio de comisión repetida de infracciones. Según el artículo 186.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿durante qué plazo se le puede privar de la posibilidad de obtener subvenciones y ayudas públicas?"
  options:
  - id: a
    text:
      es: "Dos años, porque la multa impuesta supera los 30.000 euros con comisión repetida."
  - id: b
    text:
      es: "Ninguno, porque esa sanción accesoria solo se puede imponer en las infracciones muy graves."
  - id: c
    correct: true
    text:
      es: "Un año, porque la infracción cometida es grave y la multa es de al menos 30.000 euros."
  - id: d
    text:
      es: "Tres años, porque la multa impuesta supera los 30.000 euros y la sociedad es reincidente."
  explanation:
    es: "El artículo 186.1.a LGT permite esa privación durante un año si la infracción es grave y dos si es muy grave, a partir de multas de 30.000 euros con comisión repetida. La multa de 40.000 euros y la infracción grave dan un año. Los dos años corresponden a la muy grave y los tres años al apartado 2, que exige infracción muy grave y 60.000 euros."
  citation: "art. 186.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "plazo"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0046
  prompt:
    es: "De acuerdo con el artículo 186.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción accesoria de prohibición para contratar se refiere a la contratación con:"
  options:
  - id: a
    text:
      es: "Cualquier Administración pública, con independencia de cuál haya impuesto la sanción."
  - id: b
    text:
      es: "Las entidades del sector público de la comunidad autónoma donde esté el domicilio fiscal."
  - id: c
    correct: true
    text:
      es: "La Administración pública que hubiera impuesto la sanción."
  - id: d
    text:
      es: "La Administración General del Estado y sus organismos autónomos, en todo caso."
  explanation:
    es: "El artículo 186.1.b LGT limita la prohibición de contratar a la Administración pública que hubiera impuesto la sanción. No alcanza a cualquier Administración ni se fija por el domicilio fiscal ni se reserva a la estatal."
  citation: "art. 186.1 LGT"
  difficulty: 1
  tags:
  - "alcance"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0047
  prompt:
    es: "De acuerdo con el artículo 186.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, la sanción accesoria de pérdida de la posibilidad de obtener subvenciones o ayudas públicas se extiende también a la pérdida del derecho a aplicar:"
  options:
  - id: a
    correct: true
    text:
      es: "Beneficios e incentivos fiscales de carácter rogado."
  - id: b
    text:
      es: "Todos los beneficios e incentivos fiscales, tanto de carácter rogado como automático."
  - id: c
    text:
      es: "Beneficios e incentivos fiscales de aplicación automática, en cuanto estén ya reconocidos."
  - id: d
    text:
      es: "Las reducciones por conformidad y por pronto pago del artículo 188 sobre las sanciones."
  explanation:
    es: "La letra a del artículo 186.1 LGT habla de beneficios e incentivos fiscales de carácter rogado, los que hay que solicitar. No se extiende a los de aplicación automática ni a todos los beneficios. Las reducciones del artículo 188 son un derecho sobre la sanción, no un beneficio fiscal de esta clase."
  citation: "art. 186.1 LGT"
  difficulty: 1
  tags:
  - "alcance"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0048
  prompt:
    es: "A Cristalería Sanz, S.A. se le impone por infracción grave una multa de 50.000 euros. Al graduar la sanción no se ha aplicado el criterio de comisión repetida de infracciones tributarias. Según el artículo 186.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿pueden imponerse sanciones accesorias?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque esas sanciones accesorias exigen que se haya utilizado el criterio de graduación de comisión repetida."
  - id: b
    text:
      es: "Sí, pero solo durante seis meses, porque no se ha aplicado el criterio de comisión repetida."
  - id: c
    text:
      es: "Sí, pero solo la prohibición de contratar, y no la pérdida de la posibilidad de obtener subvenciones."
  - id: d
    text:
      es: "Sí, porque la multa supera los 30.000 euros, que es el único requisito para las sanciones accesorias."
  explanation:
    es: "El artículo 186.1 LGT exige dos cosas: multa de al menos 30.000 euros por infracción grave o muy grave y que se haya utilizado el criterio de comisión repetida. Falta la segunda. Que sea una infracción grave no impide las accesorias: es el apartado 2 el que se reserva a muy graves y 60.000 euros."
  citation: "art. 186.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "condición"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0049
  prompt:
    es: "De acuerdo con el artículo 186.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la multa por infracción muy grave y comisión repetida sea igual o superior a 60.000, 150.000 o 300.000 euros, las sanciones accesorias se imponen durante un plazo, respectivamente, de:"
  options:
  - id: a
    text:
      es: "Uno, dos o tres años."
  - id: b
    text:
      es: "Dos, tres o cuatro años."
  - id: c
    text:
      es: "Tres, cinco o siete años, respectivamente."
  - id: d
    correct: true
    text:
      es: "Tres, cuatro o cinco años."
  explanation:
    es: "El artículo 186.2 LGT gradúa la duración de las accesorias de las infracciones muy graves: tres años desde 60.000 euros, cuatro desde 150.000 y cinco desde 300.000. Uno y dos años son los plazos del apartado 1 para graves y muy graves de 30.000 euros."
  citation: "art. 186.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "importe"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0050
  prompt:
    es: "A Distribuciones Ferrer, S.A. se le impone por infracción muy grave una multa de 200.000 euros y se ha utilizado el criterio de comisión repetida. Según el artículo 186.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿durante cuánto tiempo puede imponérsele la prohibición de contratar con la Administración pública que impuso la sanción?"
  options:
  - id: a
    text:
      es: "Cinco años, porque la multa es superior a 150.000 euros y la infracción es muy grave."
  - id: b
    text:
      es: "Tres años, porque la multa es igual o superior a 60.000 euros, que es el umbral del apartado."
  - id: c
    text:
      es: "Dos años, porque la infracción es muy grave y la multa es superior a 30.000 euros."
  - id: d
    correct: true
    text:
      es: "Cuatro años, porque la multa es igual o superior a 150.000 euros e inferior a 300.000."
  explanation:
    es: "En el artículo 186.2 LGT, 200.000 euros cae entre 150.000 y 300.000, que corresponde a cuatro años. Tres años se aplican solo entre 60.000 y 150.000 euros, cinco desde 300.000 y dos años son el plazo del apartado 1 para muy graves de 30.000 euros, pero este caso entra en el apartado 2."
  citation: "art. 186.2 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0051
  prompt:
    es: "A una sociedad se le impone por infracción grave una multa de 70.000 euros y se ha aplicado el criterio de comisión repetida. Según los artículos 186.1 y 186.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿por cuánto tiempo puede perder la posibilidad de obtener subvenciones y ayudas públicas?"
  options:
  - id: a
    text:
      es: "Dos años, porque la multa es superior al doble del umbral de 30.000 euros."
  - id: b
    text:
      es: "Tres años, porque la multa supera los 60.000 euros del apartado 2."
  - id: c
    text:
      es: "No puede perder esa posibilidad, porque la multa se impuso por infracción grave y no muy grave."
  - id: d
    correct: true
    text:
      es: "Un año, porque el apartado 2 solo opera con infracciones muy graves y aquí es grave."
  explanation:
    es: "El artículo 186.2 LGT, con sus tres a cinco años, se limita a la infracción muy grave. La sociedad cometió una infracción grave, así que solo se le puede aplicar el artículo 186.1.a, que fija un año. La cuantía de 70.000 euros no cambia el plazo, y las graves sí admiten sanciones accesorias."
  citation: "art. 186.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "plazo"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0052
  prompt:
    es: "De acuerdo con el artículo 186.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la suspensión del ejercicio de profesiones oficiales, empleo o cargo público por un plazo de tres meses puede imponerse a las autoridades o personas que ejerzan profesiones oficiales cuando, vulnerando los deberes de colaboración de los artículos 93 y 94, hayan desatendido:"
  options:
  - id: a
    text:
      es: "Dos requerimientos consecutivos según lo previsto en el artículo 203."
  - id: b
    text:
      es: "Un requerimiento notificado con apercibimiento de sanción conforme al artículo 203."
  - id: c
    correct: true
    text:
      es: "Tres requerimientos según lo previsto en el artículo 203."
  - id: d
    text:
      es: "Tres requerimientos según lo previsto en el artículo 202, relativo al número de identificación fiscal."
  explanation:
    es: "El artículo 186.3 LGT exige haber desatendido tres requerimientos, según el artículo 203, que sanciona la resistencia, obstrucción, excusa o negativa a las actuaciones de la Administración. Dos requerimientos o uno con apercibimiento no bastan, y el artículo 202 se refiere a los números de identificación fiscal."
  citation: "art. 186.3 LGT"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0053
  prompt:
    es: "De acuerdo con el artículo 186.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la suspensión del ejercicio de profesiones oficiales, empleo o cargo público será por un plazo de doce meses si el sujeto infractor ya hubiera sido sancionado con esa sanción accesoria en virtud de resolución firme en vía administrativa dentro de:"
  options:
  - id: a
    text:
      es: "Los cuatro años anteriores a la notificación de la resolución sancionadora."
  - id: b
    correct: true
    text:
      es: "Los cuatro años anteriores a la comisión de la infracción."
  - id: c
    text:
      es: "Los dos años anteriores a la comisión de la infracción."
  - id: d
    text:
      es: "Los seis años anteriores a la comisión de la infracción."
  explanation:
    es: "El artículo 186.3 LGT sube la suspensión de tres a doce meses si hubo una sanción accesoria igual, firme en vía administrativa, en los cuatro años anteriores a la comisión de la infracción. El plazo de cuatro años coincide con el de la comisión repetida, pero se cuenta hacia atrás desde la infracción, no desde la resolución."
  citation: "art. 186.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0229
  prompt:
    es: "Conforme al artículo 186.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las sanciones accesorias por infracción muy grave de multa igual o superior a 60.000 euros:"
  options:
  - id: a
    text:
      es: "Pueden imponerse también cuando la infracción sea grave, si la multa supera los 60.000 euros."
  - id: b
    correct: true
    text:
      es: "Pueden imponerse si se ha utilizado el criterio de graduación de comisión repetida de infracciones tributarias."
  - id: c
    text:
      es: "Pueden imponerse si se ha utilizado el criterio de perjuicio económico en su tramo superior al 75 por ciento de la base de la sanción."
  - id: d
    text:
      es: "Pueden imponerse aunque no se haya utilizado el criterio de graduación de comisión repetida."
  explanation:
    es: "El artículo 186.2 LGT exige multa por infracción muy grave de al menos 60.000 euros y que se haya utilizado la comisión repetida. No basta el perjuicio económico, y la infracción grave queda en el apartado 1, con otras consecuencias."
  citation: "art. 186.2 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-186
- id: m03-l13-q0245
  prompt:
    es: "De acuerdo con el artículo 186.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, la prohibición para contratar con la Administración pública que hubiera impuesto la sanción dura:"
  options:
  - id: a
    text:
      es: "Un año si la infracción cometida hubiera sido leve o dos años si hubiera sido grave."
  - id: b
    text:
      es: "Dos años si la infracción cometida hubiera sido grave o tres años si hubiera sido muy grave."
  - id: c
    correct: true
    text:
      es: "Un año si la infracción cometida hubiera sido grave o dos años si hubiera sido muy grave."
  - id: d
    text:
      es: "Seis meses si la infracción cometida hubiera sido grave o un año si hubiera sido muy grave."
  explanation:
    es: "El artículo 186.1.b LGT fija un año para la infracción grave y dos para la muy grave, con multa de al menos 30.000 euros y comisión repetida. La infracción leve no admite sanciones accesorias, y los tres años pertenecen al apartado 2, que es solo para infracciones muy graves de 60.000 euros o más."
  citation: "art. 186.1 LGT"
  difficulty: 2
  tags:
  - "plazo"
