m08-l01-q01:
  key:
    anchor: paper-gilbert-lynch-cap#p3
    sentence: it is impossible for any web service to implement an atomic read/write shared memory that guarantees a response to every request.
  wrong:
  - option: Returning any response at all, because a partitioned server has to stay silent
    anchor: paper-gilbert-lynch-cap#p3
    sentence: It has the choice to either eventually return a response (and risk returning the wrong response) or to never return a response.
  - option: Implementing a trivial service, such as one that returns the value of a constant
    anchor: paper-gilbert-lynch-cap#p2
    sentence: trivial services do not fall within the scope of the CAP Theorem.
  - option: Implementing a weakly consistent service, such as a distributed web cache
    anchor: paper-gilbert-lynch-cap#p2
    sentence: there has been much work attempting to develop weaker consistency requirements that still provide useful services and yet avoid sacrificing availability.
