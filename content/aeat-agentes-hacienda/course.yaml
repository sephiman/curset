    - id: m03-l18
      title:
        es: 'El Impuesto sobre el Valor Añadido (I). Naturaleza y ámbito de aplicación. Entregas de bienes y prestaciones
          de servicios: hecho imponible. Exenciones. Lugar de realización del hecho imponible.'
      summary:
        es: 'El IVA es un tributo de naturaleza indirecta que recae sobre el consumo y grava las entregas de bienes y
          prestaciones de servicios de empresarios o profesionales, las adquisiciones intracomunitarias de bienes y las
          importaciones de bienes. La LIVA define el hecho imponible, las operaciones no sujetas y las asimiladas, como
          el autoconsumo. Regula también las exenciones en operaciones interiores, en exportaciones y operaciones
          asimiladas, en las situaciones de depósito temporal y otras situaciones, en los regímenes aduaneros y fiscales
          y en las entregas a otro Estado miembro, y el lugar de realización de las entregas y de los servicios.'
