# anchor: boe-a-2003-21614-art-151
- id: m05-l03-q260
  prompt:
    es: "¿Cuál de los siguientes contratos queda fuera de la fiscalización previa que regula el artículo 151 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los contratos de obras adjudicados por procedimiento abierto, sea cual sea su valor."
  - id: b
    text:
      es: "Los contratos de servicios cuyo valor estimado supera el de un contrato menor."
  - id: c
    correct: true
    text:
      es: "Los contratos menores y los asimilados a ellos por la legislación contractual."
  - id: d
    text:
      es: "Los contratos de suministro financiados con fondos de la Unión Europea."
  explanation:
    es: "El artículo 151.a) saca de la fiscalización previa los contratos menores y los asimilados a ellos por la legislación contractual. Los contratos de obras por procedimiento abierto y los de servicios que superan el valor de un contrato menor siguen sometidos a ella, porque el artículo no los excluye. La fuente de financiación de un contrato de suministro tampoco lo exime."
  citation: "art. 151 LGP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-151
- id: m05-l03-q261
  prompt:
    es: "Según el artículo 151 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, quedan exentos de fiscalización previa los gastos pagados por anticipo de caja fija cuyo importe sea:"
  options:
  - id: a
    text:
      es: "Menor de 1.500 euros cada uno."
  - id: b
    correct: true
    text:
      es: "Menor de 5.000 euros cada uno."
  - id: c
    text:
      es: "Menor de 12.000 euros cada uno."
  - id: d
    text:
      es: "Menor de 15.000 euros cada uno."
  explanation:
    es: "El artículo 151.c) exime de la fiscalización previa los gastos menores de 5.000 euros cuyo pago se realice por anticipo de caja fija. Las cifras de 1.500, 12.000 y 15.000 euros no figuran en ese artículo."
  citation: "art. 151 LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "excepción"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q262
  prompt:
    es: "De acuerdo con el artículo 154.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el régimen de requisitos básicos de fiscalización previa solo procede formular reparo cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "No se cumple alguno de los extremos de necesaria comprobación del artículo 152.1."
  - id: b
    text:
      es: "El expediente presenta graves irregularidades en la documentación justificativa del reconocimiento de la obligación."
  - id: c
    text:
      es: "Se han omitido trámites que podrían dar lugar a la nulidad del acto."
  - id: d
    text:
      es: "La continuación de la gestión podría causar quebrantos económicos al Tesoro Público."
  explanation:
    es: "El artículo 154.3 limita el reparo del régimen de requisitos básicos a los casos en que no se cumpla alguno de los extremos del artículo 152.1. Las irregularidades graves en la documentación, la omisión de trámites que podrían anular el acto y los quebrantos económicos son causas de reparo del régimen general (artículo 154.2), no de este régimen especial."
  citation: "art. 154.3 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-148
- id: m05-l03-q264
  prompt:
    es: "¿Sobre qué actos del sector público estatal recae la función interventora, que los controla antes de que sean aprobados?"
  options:
  - id: a
    correct: true
    text:
      es: "Los que dan lugar al reconocimiento de derechos o a la realización de gastos."
  - id: b
    text:
      es: "Solo los de ordenación del pago y de realización material del pago."
  - id: c
    text:
      es: "Los que aprueban las cuentas anuales de las entidades del sector público."
  - id: d
    text:
      es: "Los que dan lugar a gastos, pero no los que reconocen derechos."
  explanation:
    es: "El artículo 148 define la función interventora como el control, antes de su aprobación, de los actos que dan lugar al reconocimiento de derechos o a la realización de gastos. Limitarla al pago deja fuera la fase de aprobación, que es precisamente la que controla. La aprobación de cuentas anuales es materia de otro control, y excluir el reconocimiento de derechos contradice el texto, que lo incluye."
  citation: "art. 148 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q265
  prompt:
    es: "Según el artículo 155 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cómo plantea el órgano gestor la discrepancia cuando no acepta el reparo de la Intervención?"
  options:
  - id: a
    text:
      es: "Por escrito, pero sin necesidad de motivación, bastando la firma del órgano gestor."
  - id: b
    text:
      es: "De forma motivada, pero verbalmente, ante el interventor que formuló el reparo."
  - id: c
    correct: true
    text:
      es: "Motivada y por escrito, con cita de los preceptos legales en que sustente su criterio."
  - id: d
    text:
      es: "Mediante recurso de alzada contra el reparo ante el titular del departamento."
  explanation:
    es: "El artículo 155 exige que la discrepancia sea motivada y por escrito, con cita de los preceptos legales en que se apoya el órgano gestor. Sin motivación o de forma verbal no cumple esa forma, y el reparo no se combate con un recurso de alzada, sino con este procedimiento especial de discrepancia ante la IGAE."
  citation: "art. 155 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-136
- id: m05-l03-q267
  prompt:
    es: "¿De qué órgano depende directamente el Tribunal de Cuentas, supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado?"
  options:
  - id: a
    text:
      es: "El Gobierno de la Nación."
  - id: b
    text:
      es: "El Consejo de Estado."
  - id: c
    text:
      es: "El Congreso de los Diputados."
  - id: d
    correct: true
    text:
      es: "Las Cortes Generales."
  explanation:
    es: "El artículo 136.1 dice que el Tribunal de Cuentas depende directamente de las Cortes Generales. No depende del Gobierno, cuya gestión fiscaliza, ni del Consejo de Estado, y tampoco solo del Congreso de los Diputados, que es una de las dos Cámaras que forman las Cortes."
  citation: "art. 136.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-131
- id: m05-l03-q268
  prompt:
    es: "¿Qué órgano forma la Cuenta General del Estado de cada año, antes de elevarla al Gobierno para su remisión al Tribunal de Cuentas?"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "El artículo 131.1 atribuye la formación de la Cuenta General del Estado a la Intervención General de la Administración del Estado. El Tribunal de Cuentas no la forma, sino que la examina y comprueba una vez rendida. Tampoco la forman la Dirección General de Presupuestos ni el Consejo de Ministros."
  citation: "art. 131.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1982-11584-art-10
- id: m05-l03-q269
  prompt:
    es: "La Cuenta General del Estado se rinde al Tribunal el jueves, 7 de enero de 2027. Según el artículo 10 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, el examen dura seis meses desde la rendición, de fecha a fecha. ¿Cuándo vence el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles, 7 de julio de 2027."
  - id: b
    text:
      es: "El martes, 6 de julio de 2027."
  - id: c
    text:
      es: "El jueves, 8 de julio de 2027."
  - id: d
    text:
      es: "El jueves, 7 de octubre de 2027."
  explanation:
    es: "El artículo 10 da seis meses desde que se rinde la cuenta. Contados de fecha a fecha, el plazo que empieza el 7 de enero vence el mismo día seis meses después, el miércoles 7 de julio de 2027. El martes 6 de julio resulta de contar ciento ochenta días en lugar de seis meses. El jueves 8 de julio añade un día de más. El jueves 7 de octubre suma nueve meses."
  citation: "art. 10 LO 2/1982"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1988-8678-art-33
- id: m05-l03-q270
  prompt:
    es: "La IGAE concluye la Cuenta General del Estado el viernes, 27 de agosto de 2027. Según el artículo 33.1 de la Ley 7/1988, de 5 de abril, de Funcionamiento del Tribunal de Cuentas, se remite dentro de los dos meses siguientes, de fecha a fecha. ¿Cuándo vence el plazo?"
  options:
  - id: a
    text:
      es: "El martes, 26 de octubre de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 27 de octubre de 2027."
  - id: c
    text:
      es: "El jueves, 28 de octubre de 2027."
  - id: d
    text:
      es: "El sábado, 27 de noviembre de 2027."
  explanation:
    es: "El artículo 33.1 da dos meses desde la conclusión de la cuenta. Contados de fecha a fecha, el plazo que empieza el 27 de agosto vence el mismo día dos meses después, el miércoles 27 de octubre de 2027. El martes 26 de octubre resulta de contar sesenta días en lugar de dos meses. El jueves 28 de octubre añade un día de más. El sábado 27 de noviembre suma tres meses."
  citation: "art. 33.1 Ley 7/1988"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-21614-art-156
- id: m05-l03-q271
  prompt:
    es: "Si se hubiese omitido una función interventora preceptiva, el artículo 156.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria prohíbe, hasta que se subsane la omisión, reconocer la obligación, tramitar el pago y:"
  options:
  - id: a
    text:
      es: "Remitir el expediente a la Intervención General."
  - id: b
    text:
      es: "Informar sobre los defectos del expediente."
  - id: c
    text:
      es: "Revisar el acto dictado con infracción del ordenamiento."
  - id: d
    correct: true
    text:
      es: "Intervenir favorablemente esas mismas actuaciones."
  explanation:
    es: "El artículo 156.1 prohíbe, mientras no se subsane la omisión, reconocer la obligación, tramitar el pago e intervenir favorablemente esas actuaciones. Remitir el expediente, informar sobre los defectos o revisar el acto no están prohibidos: de hecho, el artículo 156.2 exige el informe de la Intervención sobre la omisión."
  citation: "art. 156.1 LGP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-131
- id: m05-l03-q272
  prompt:
    es: "Según el artículo 131.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado eleva la Cuenta General del Estado, para su remisión al Tribunal de Cuentas:"
  options:
  - id: a
    text:
      es: "Al Ministro de Hacienda."
  - id: b
    text:
      es: "A las Cortes Generales."
  - id: c
    correct: true
    text:
      es: "Al Gobierno."
  - id: d
    text:
      es: "Al Consejo de Estado."
  explanation:
    es: "El artículo 131.1 manda elevar la Cuenta General al Gobierno para que la remita al Tribunal de Cuentas. No se eleva al Ministro de Hacienda ni al Consejo de Estado. Las Cortes Generales tampoco la reciben en ese paso: el Tribunal la examina por delegación suya después."
  citation: "art. 131.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1996-2627-regla-20
- id: m05-l03-q273
  prompt:
    es: "Según la regla 20.1 de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, ¿cuál es la primera de las fases en que se realiza la ejecución de los gastos presupuestarios?"
  options:
  - id: a
    text:
      es: "La retención de crédito para gastar."
  - id: b
    correct: true
    text:
      es: "La autorización del gasto."
  - id: c
    text:
      es: "El compromiso del gasto."
  - id: d
    text:
      es: "El reconocimiento de la obligación."
  explanation:
    es: "La regla 20.1 enumera las fases en este orden: «a) Autorización del gasto. b) Compromiso del gasto. c) Reconocimiento de la obligación.» Encabeza la lista la autorización; le siguen el compromiso y el reconocimiento de la obligación. La retención de crédito no es una de las tres fases: es el documento RC que el Servicio Gestor expide al inicio del expediente para que se certifique la existencia de crédito disponible (regla 14.1)."
  citation: "regla 20.1 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
