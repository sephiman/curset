# anchor: boe-a-2015-11724-art-136
- id: m04-l09-q001
  prompt:
    es: "Según el artículo 136.1 del texto refundido de la Ley General de la Seguridad Social, están obligatoriamente incluidos en el campo de aplicación del Régimen General:"
  options:
  - id: a
    correct: true
    text:
      es: "Los trabajadores por cuenta ajena y los asimilados, salvo que por su actividad deban estar en un régimen especial"
  - id: b
    text:
      es: "Los trabajadores por cuenta ajena y por cuenta propia, salvo que opten expresamente por un régimen especial"
  - id: c
    text:
      es: "Los trabajadores por cuenta ajena y los asimilados, aunque por su actividad correspondan a un régimen especial"
  - id: d
    text:
      es: "Solo los trabajadores por cuenta ajena con contrato indefinido, salvo que deban estar en un régimen especial"
  explanation:
    es: "El artículo 136.1 incluye obligatoriamente a «los trabajadores por cuenta ajena y los asimilados», «salvo que por razón de su actividad deban quedar comprendidos en el campo de aplicación de algún régimen especial». Los trabajadores por cuenta propia no están en ese apartado, y la ley no deja la inclusión a una opción del trabajador. La opción que los incluye aunque su actividad corresponda a un régimen especial invierte la salvedad. La ley no distingue por la duración del contrato, así que la opción del contrato indefinido añade un requisito que no existe."
  citation: "art. 136.1 LGSS"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-11724-art-136
- id: m04-l09-q002
  prompt:
    es: "Según el artículo 136.2 del texto refundido de la Ley General de la Seguridad Social, ¿con qué condición se declara comprendido en el Régimen General el personal civil no funcionario de las administraciones públicas?"
  options:
  - id: a
    text:
      es: "Que no haya optado voluntariamente por el mutualismo administrativo dentro del plazo reglamentario"
  - id: b
    text:
      es: "Que preste servicios con contrato indefinido y a jornada completa en la Administración"
  - id: c
    correct: true
    text:
      es: "Que no esté incluido, en virtud de una ley especial, en otro régimen obligatorio de previsión social"
  - id: d
    text:
      es: "Que no esté incluido, por convenio colectivo, en otro régimen voluntario de previsión social"
  explanation:
    es: "La letra k) del artículo 136.2 comprende a este personal «siempre que no estén incluidos en virtud de una ley especial en otro régimen obligatorio de previsión social». La exclusión la decide una ley especial, no una opción por el mutualismo ni un convenio colectivo, y el régimen excluyente es obligatorio, no voluntario. La ley tampoco exige contrato indefinido ni jornada completa."
  citation: "art. 136.2.k) LGSS"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11724-art-136
- id: m04-l09-q003
  prompt:
    es: "¿Cuál de los siguientes colectivos se declara expresamente comprendido en el Régimen General de la Seguridad Social, según el texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Los funcionarios civiles del Estado incluidos en el Régimen de Clases Pasivas del Estado"
  - id: b
    correct: true
    text:
      es: "El personal funcionario de la disposición adicional tercera, en los términos previstos en ella"
  - id: c
    text:
      es: "El personal civil no funcionario incluido por una ley especial en otro régimen obligatorio"
  - id: d
    text:
      es: "Los trabajadores por cuenta propia o autónomos mayores de dieciocho años de edad"
  explanation:
    es: "La letra m) del artículo 136.2 declara comprendido «el personal funcionario a que se refiere la disposición adicional tercera, en los términos previstos en ella». La letra l) deja fuera a los funcionarios incluidos en el Régimen de Clases Pasivas del Estado. La letra k) excluye al personal civil no funcionario que una ley especial incluya en otro régimen obligatorio. Los trabajadores por cuenta propia no son trabajadores por cuenta ajena ni asimilados, que es el campo del Régimen General según el artículo 136.1."
  citation: "art. 136.2.m) LGSS"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-165
- id: m04-l09-q004
  prompt:
    es: "De acuerdo con el artículo 165.1 del texto refundido de la Ley General de la Seguridad Social, para causar derecho a las prestaciones del Régimen General se exige, como requisito general, estar afiliado y:"
  options:
  - id: a
    text:
      es: "En alta en el momento de presentar la solicitud de la prestación ante la entidad gestora"
  - id: b
    text:
      es: "En alta, sin interrupción, durante los cinco años anteriores a la contingencia protegida"
  - id: c
    text:
      es: "En alta o en situación asimilada en la fecha de la resolución que reconozca la prestación"
  - id: d
    correct: true
    text:
      es: "En alta o en situación asimilada a la de alta al sobrevenir la contingencia o situación protegida"
  explanation:
    es: "El artículo 165.1 exige «el requisito general de estar afiliadas y en alta en dicho Régimen o en situación asimilada a la de alta al sobrevenir la contingencia o situación protegida». El momento que cuenta es el de la contingencia, no el de la solicitud ni el de la resolución. El artículo no pide cinco años de alta continuada: los períodos de cotización son requisitos particulares de cada prestación."
  citation: "art. 165.1 LGSS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q005
  prompt:
    es: "Según el artículo 42.1.a) del Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social, la asistencia sanitaria por enfermedad comprende:"
  options:
  - id: a
    correct: true
    text:
      es: "Tanto la enfermedad común como la enfermedad profesional"
  - id: b
    text:
      es: "Solo la enfermedad profesional, no la enfermedad común"
  - id: c
    text:
      es: "Solo la enfermedad común, no la enfermedad profesional"
  - id: d
    text:
      es: "La enfermedad común o profesional que cause incapacidad permanente"
  explanation:
    es: "El artículo 42.1.a) incluye la asistencia sanitaria «en los casos de maternidad, de enfermedad común o profesional y de accidente, sea o no de trabajo». Cubre las dos clases de enfermedad, así que las opciones que dejan fuera la común o la profesional son incorrectas. El artículo no limita la asistencia a la enfermedad que acabe en incapacidad permanente."
  citation: "art. 42.1.a) LGSS"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q006
  prompt:
    es: "Una trabajadora del Régimen General sufre un accidente doméstico un domingo, fuera de su jornada. ¿Comprende la acción protectora de la Seguridad Social su asistencia sanitaria?"
  options:
  - id: a
    text:
      es: "No, porque el accidente no laboral solo da derecho a prestaciones económicas"
  - id: b
    text:
      es: "Sí, pero solo si acredita ciento ochenta días cotizados en los cinco años anteriores"
  - id: c
    correct: true
    text:
      es: "Sí, porque comprende la asistencia sanitaria en caso de accidente, sea o no de trabajo"
  - id: d
    text:
      es: "No, porque la asistencia sanitaria se limita a la maternidad y a la enfermedad"
  explanation:
    es: "El artículo 42.1.a) incluye la asistencia sanitaria «de accidente, sea o no de trabajo», así que el accidente doméstico está cubierto. El accidente no laboral no queda reducido a prestaciones económicas, y la asistencia sanitaria también cubre el accidente, no solo la maternidad y la enfermedad. Los ciento ochenta días cotizados en cinco años son el período del subsidio de incapacidad temporal por enfermedad común (artículo 172), no un requisito de la asistencia sanitaria por accidente."
  citation: "art. 42.1.a) LGSS"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q007
  prompt:
    es: "De acuerdo con el artículo 42.1 del texto refundido de la Ley General de la Seguridad Social, la acción protectora comprende la recuperación profesional cuya procedencia se aprecie:"
  options:
  - id: a
    text:
      es: "Solo en los casos de accidente de trabajo o de enfermedad profesional"
  - id: b
    correct: true
    text:
      es: "En cualquiera de los casos en que la ley prevé la asistencia sanitaria"
  - id: c
    text:
      es: "Solo cuando se haya declarado una incapacidad permanente total"
  - id: d
    text:
      es: "En los casos que determine el convenio colectivo de aplicación"
  explanation:
    es: "La letra b) del artículo 42.1 incluye «la recuperación profesional, cuya procedencia se aprecie en cualquiera de los casos que se mencionan en la letra anterior», que es la de la asistencia sanitaria: maternidad, enfermedad común o profesional y accidente, sea o no de trabajo. No se limita a las contingencias profesionales ni a la incapacidad permanente total, y no la fija el convenio colectivo."
  citation: "art. 42.1.b) LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q008
  prompt:
    es: "La acción protectora del sistema de la Seguridad Social comprende las prestaciones económicas por desempleo:"
  options:
  - id: a
    text:
      es: "Solo en su nivel contributivo, no en el asistencial"
  - id: b
    text:
      es: "En sus niveles contributivo, asistencial y complementario"
  - id: c
    text:
      es: "Solo en su nivel asistencial, como subsidio"
  - id: d
    correct: true
    text:
      es: "En sus niveles contributivo y asistencial"
  explanation:
    es: "La letra c) del artículo 42.1 incluye el «desempleo, en sus niveles contributivo y asistencial». Quien dice «solo contributivo» deja fuera el asistencial, y quien dice «solo asistencial» deja fuera el contributivo: la letra c) nombra los dos. Un nivel complementario no es ninguno de los dos que cita la letra: «contributivo y asistencial»."
  citation: "art. 42.1.c) LGSS"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q010
  prompt:
    es: "Según el artículo 42.1.c) del Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social, entre las prestaciones económicas de la acción protectora figuran:"
  options:
  - id: a
    text:
      es: "La indemnización por despido improcedente y el ingreso mínimo vital"
  - id: b
    correct: true
    text:
      es: "La protección por cese de actividad y el ingreso mínimo vital"
  - id: c
    text:
      es: "La protección por cese de actividad y la indemnización por despido"
  - id: d
    text:
      es: "Las prestaciones del Fondo de Garantía Salarial y el ingreso mínimo vital"
  explanation:
    es: "La letra c) del artículo 42.1 nombra, entre las prestaciones económicas, la «protección por cese de actividad» y el «ingreso mínimo vital». La indemnización por despido improcedente la abona el empresario, según el artículo 56.1 del Estatuto de los Trabajadores, y no figura en la lista de la letra c), que sí cita la indemnización por muerte por accidente de trabajo o enfermedad profesional. El Fondo de Garantía Salarial es un organismo autónomo que abona salarios pendientes por insolvencia del empresario, según el artículo 33.1 del Estatuto de los Trabajadores, y la lista de la letra c) no lo recoge."
  citation: "art. 42.1.c) LGSS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q011
  prompt:
    es: "La acción protectora del sistema de la Seguridad Social comprende las prestaciones familiares de la Seguridad Social:"
  options:
  - id: a
    text:
      es: "Solo en su modalidad no contributiva, sujeta a un límite de ingresos"
  - id: b
    text:
      es: "Solo en su modalidad contributiva, ligada a la excedencia por cuidado de hijos"
  - id: c
    correct: true
    text:
      es: "En sus modalidades contributiva y no contributiva"
  - id: d
    text:
      es: "Solo como mejora voluntaria de la acción protectora del sistema"
  explanation:
    es: "El artículo 42.1.d) del texto refundido de la Ley General de la Seguridad Social incluye «las prestaciones familiares de la Seguridad Social, en sus modalidades contributiva y no contributiva». Las dos modalidades forman parte de la acción protectora, así que las opciones que dejan solo una son incorrectas. Tampoco son una mejora voluntaria: están en la lista de la acción protectora."
  citation: "art. 42.1.d) LGSS"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-42
- id: m04-l09-q012
  prompt:
    es: "Según el artículo 42.1.e) del texto refundido de la Ley General de la Seguridad Social, ¿qué materias nombra expresamente para las prestaciones de servicios sociales que puedan establecerse?"
  options:
  - id: a
    text:
      es: "La vivienda de las personas con discapacidad y la asistencia a las personas mayores dependientes"
  - id: b
    text:
      es: "La formación y rehabilitación de personas con discapacidad, solo si deriva de accidente de trabajo"
  - id: c
    text:
      es: "La formación profesional de las personas desempleadas y la asistencia a sus familias"
  - id: d
    correct: true
    text:
      es: "La formación y rehabilitación de personas con discapacidad y la asistencia a las personas mayores"
  explanation:
    es: "La letra e) del artículo 42.1 nombra las prestaciones de servicios sociales «en materia de formación y rehabilitación de personas con discapacidad y de asistencia a las personas mayores», y añade «aquellas otras materias en que se considere conveniente». La vivienda y la formación de los desempleados no son las materias que nombra. La formación y rehabilitación de personas con discapacidad no se limita a la que deriva de accidente de trabajo."
  citation: "art. 42.1.e) LGSS"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11724-art-44
- id: m04-l09-q013
  prompt:
    es: "Según el artículo 44.1 del texto refundido de la Ley General de la Seguridad Social, las prestaciones pueden ser objeto de retención para cumplir obligaciones alimenticias a favor:"
  options:
  - id: a
    correct: true
    text:
      es: "Del cónyuge y de los hijos del beneficiario"
  - id: b
    text:
      es: "De los ascendientes y descendientes del beneficiario"
  - id: c
    text:
      es: "De cualquier pariente del beneficiario hasta el segundo grado"
  - id: d
    text:
      es: "Del cónyuge, de los hijos y de los padres que convivan con él"
  explanation:
    es: "El artículo 44.1.a) admite la retención «en orden al cumplimiento de las obligaciones alimenticias a favor del cónyuge e hijos». No menciona a los ascendientes, a otros parientes hasta el segundo grado ni a los padres que convivan con el beneficiario."
  citation: "art. 44.1 LGSS"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-11724-art-44
- id: m04-l09-q014
  prompt:
    es: "Según el artículo 44.1 del texto refundido de la Ley General de la Seguridad Social, además de las obligaciones alimenticias, ¿qué obligaciones permiten retener, compensar o descontar las prestaciones?"
  options:
  - id: a
    text:
      es: "Las contraídas por el beneficiario con cualquier Administración pública"
  - id: b
    text:
      es: "Las contraídas por el beneficiario con entidades de crédito"
  - id: c
    correct: true
    text:
      es: "Las contraídas por el beneficiario dentro de la Seguridad Social"
  - id: d
    text:
      es: "Las contraídas por el beneficiario con su última empresa"
  explanation:
    es: "El artículo 44.1.b) admite la segunda excepción «cuando se trate de obligaciones contraídas por el beneficiario dentro de la Seguridad Social». Las deudas con otras administraciones, con entidades de crédito o con la empresa no están entre los dos casos que el artículo permite."
  citation: "art. 44.1 LGSS"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-11724-art-44
- id: m04-l09-q015
  prompt:
    es: "De acuerdo con el artículo 44.1 del texto refundido de la Ley General de la Seguridad Social, la prohibición de retener las prestaciones se entiende sin perjuicio de lo previsto sobre:"
  options:
  - id: a
    text:
      es: "Su revalorización anual, conforme a la ley de presupuestos"
  - id: b
    correct: true
    text:
      es: "Su tributación, conforme al apartado 2 del mismo artículo"
  - id: c
    text:
      es: "Su compatibilidad con el trabajo, conforme a cada prestación"
  - id: d
    text:
      es: "Su prescripción, conforme a las reglas generales del sistema"
  explanation:
    es: "El artículo 44.1 prohíbe la retención «sin perjuicio de lo previsto en el apartado 2», y el apartado 2 sujeta las percepciones de la Seguridad Social a tributación en los términos de cada impuesto. La revalorización, la compatibilidad con el trabajo y la prescripción no son la salvedad que hace el artículo."
  citation: "art. 44.1 LGSS"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11724-art-46
- id: m04-l09-q016
  prompt:
    es: "¿En qué meses se devengan las dos pagas extraordinarias de las pensiones contributivas de la Seguridad Social derivadas de contingencias comunes?"
  options:
  - id: a
    text:
      es: "En los meses de junio y diciembre"
  - id: b
    text:
      es: "En los meses de julio y diciembre"
  - id: c
    text:
      es: "En los meses de mayo y noviembre"
  - id: d
    correct: true
    text:
      es: "En los meses de junio y noviembre"
  explanation:
    es: "El artículo 46.1 dice que estas pensiones se pagan en catorce pagas, una por cada mes del año y «dos pagas extraordinarias que se devengarán en los meses de junio y noviembre». Diciembre, julio y mayo no son los meses que fija el artículo."
  citation: "art. 46.1 LGSS"
  difficulty: 1
  tags:
  - "fecha"
  - "cantidad"
# anchor: boe-a-2015-11724-art-46
- id: m04-l09-q017
  prompt:
    es: "Según el artículo 46.1 del texto refundido de la Ley General de la Seguridad Social, se satisfacen en catorce pagas, con dos extraordinarias en junio y noviembre, las pensiones contributivas derivadas de:"
  options:
  - id: a
    correct: true
    text:
      es: "Contingencias comunes de cualquiera de los regímenes del sistema"
  - id: b
    text:
      es: "Contingencias profesionales del Régimen General únicamente"
  - id: c
    text:
      es: "Contingencias comunes del Régimen General únicamente"
  - id: d
    text:
      es: "Cualquier contingencia, común o profesional, del Régimen General"
  explanation:
    es: "El artículo 46.1 se refiere a «las pensiones contributivas derivadas de contingencias comunes de cualquiera de los regímenes que integran el sistema». No se limita al Régimen General, y no menciona las pensiones derivadas de contingencias profesionales."
  citation: "art. 46.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
  - "concepto"
