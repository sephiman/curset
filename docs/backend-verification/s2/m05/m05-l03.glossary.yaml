- id: g-jdk-dynamic-proxy
  term:
    en: JDK dynamic proxy
  definition:
    en: If the target object to be proxied implements at least one interface, a JDK dynamic proxy is used, and all of the interfaces implemented by the target type are proxied.
  origin: m05-l03
  citation: spring-fw-aop-proxying#proxying-mechanisms
- id: g-cglib-proxy
  term:
    en: CGLIB proxy
  definition:
    en: If the target object does not implement any interfaces, a CGLIB proxy is created which is a runtime-generated subclass of the target type.
  origin: m05-l03
  citation: spring-fw-aop-proxying#proxying-mechanisms
