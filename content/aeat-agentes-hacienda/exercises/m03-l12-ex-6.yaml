# anchor: boe-a-2005-14803-art-103-bis
- id: m03-l12-q0009
  prompt:
    es: "Conforme al artículo 103 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, todo licitador debe constituir un depósito del 10 por ciento del tipo de subasta cuando los bienes o lotes por los que desee pujar sean:"
  options:
  - id: a
    text:
      es: "bienes muebles o contengan al menos un bien mueble."
  - id: b
    text:
      es: "bienes de valor superior a 100.000 euros, sean muebles o inmuebles."
  - id: c
    correct: true
    text:
      es: "exclusivamente bienes muebles."
  - id: d
    text:
      es: "bienes inmuebles o contengan al menos un bien inmueble."
  explanation:
    es: "El depósito del 10 por ciento es el de los lotes formados solo por bienes muebles. Si el lote es de inmuebles o incluye aunque sea uno, el depósito es del 5 por ciento (art. 103 bis.1.b RGR). El valor del bien no cambia el porcentaje, y un lote con algún mueble pero también un inmueble tampoco paga el 10 por ciento."
  citation: "art. 103 bis.1 RGR"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-103-bis
- id: m03-l12-q0011
  prompt:
    es: "Hermanos Lozano, S.L. quiere pujar por un lote compuesto por un local comercial y dos furgonetas. El tipo de subasta del lote es de 120.000 euros. Conforme al artículo 103 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué depósito debe constituir para ser admitido como licitador?"
  options:
  - id: a
    text:
      es: "12.000 euros, el 10 por ciento del tipo, porque el lote contiene bienes muebles."
  - id: b
    text:
      es: "18.000 euros, el 15 por ciento del tipo, por tratarse de un lote mixto."
  - id: c
    correct: true
    text:
      es: "6.000 euros, el 5 por ciento del tipo, porque el lote contiene al menos un bien inmueble."
  - id: d
    text:
      es: "No debe constituir depósito alguno, porque el lote incluye bienes muebles e inmuebles de distinta clase."
  explanation:
    es: "El lote contiene un local, que es un bien inmueble, y por eso el depósito es del 5 por ciento del tipo: 120.000 × 0,05 = 6.000 euros (art. 103 bis.1.b RGR). El 10 por ciento solo se aplica si el lote es exclusivamente de muebles. No existe un 15 por ciento para lotes mixtos, y el depósito es obligatorio para ser admitido como licitador."
  citation: "art. 103 bis.1 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-103-bis
- id: m03-l12-q0012
  prompt:
    es: "Raquel Soto va a pujar en una subasta por un lote formado solo por maquinaria y mobiliario, sin ningún inmueble, con un tipo de subasta de 45.000 euros. Según el artículo 103 bis.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el depósito que debe constituir?"
  options:
  - id: a
    text:
      es: "2.250 euros, el 5 por ciento del tipo de subasta."
  - id: b
    text:
      es: "6.750 euros, el 15 por ciento del tipo de subasta."
  - id: c
    correct: true
    text:
      es: "4.500 euros, el 10 por ciento del tipo de subasta."
  - id: d
    text:
      es: "9.000 euros, el 20 por ciento del tipo de subasta."
  explanation:
    es: "Un lote exclusivamente de bienes muebles exige el 10 por ciento del tipo: 45.000 × 0,10 = 4.500 euros (art. 103 bis.1.a RGR). Los 2.250 euros son el 5 por ciento, que se reserva a los lotes con algún inmueble. El 15 y el 20 por ciento no son porcentajes de este artículo."
  citation: "art. 103 bis.1 RGR"
  difficulty: 1
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-101
- id: m03-l12-q0014
  prompt:
    es: "Señale la respuesta CORRECTA sobre el anuncio y la apertura de la subasta, según el artículo 101.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "La subasta se anuncia en el Boletín Oficial del Estado y se abre el mismo día de la publicación del anuncio."
  - id: b
    text:
      es: "La subasta se anuncia en el Boletín Oficial del Estado y se abre transcurridos al menos 15 días desde la publicación del anuncio en dicho boletín."
  - id: c
    text:
      es: "La subasta se anuncia en el boletín oficial de la provincia y se abre transcurridas al menos 24 horas desde la publicación."
  - id: d
    correct: true
    text:
      es: "La subasta se anuncia en el Boletín Oficial del Estado y se abre transcurridas al menos 24 horas desde la publicación del anuncio."
  explanation:
    es: "El anuncio se publica en el BOE y la subasta se abre pasadas al menos 24 horas (art. 101.3 RGR). Los 15 días son el mínimo entre las notificaciones del acuerdo de enajenación y la celebración de la subasta (art. 101.2), no entre anuncio y apertura. El anuncio no se hace en un boletín provincial, y la apertura el mismo día incumple el mínimo."
  citation: "art. 101.3 RGR"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104
- id: m03-l12-q0016
  prompt:
    es: "En una subasta electrónica cuyo plazo de pujas, según el anuncio, termina el 1 de julio de 2027 a las 12:00 horas, se realiza una puja a las 11:40 de ese día. Conforme al artículo 104.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo se cierra como pronto la subasta?"
  options:
  - id: a
    text:
      es: "El 2 de julio de 2027 a las 11:40 horas, veinticuatro horas después de la última puja."
  - id: b
    text:
      es: "El 1 de julio de 2027 a las 12:00 horas, en el momento fijado inicialmente."
  - id: c
    correct: true
    text:
      es: "El 1 de julio de 2027 a las 12:40 horas, una hora después de la última puja."
  - id: d
    text:
      es: "El 1 de julio de 2027 a las 12:10 horas, diez minutos después de terminado el plazo inicial."
  explanation:
    es: "La subasta no se cierra hasta que pase una hora desde la última puja, aunque eso alargue el plazo inicial: 11:40 más una hora son las 12:40 (art. 104.3 RGR). El cierre a las 12:00 ignora la regla de la hora. Las 12:10 no corresponden a ninguna regla del artículo. Las 24 horas son el límite máximo de ampliación del plazo, no el tiempo que se espera tras cada puja."
  citation: "art. 104.3 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0017
  prompt:
    es: "Conforme al artículo 104 bis.3.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el adjudicatario debe pagar la diferencia entre el precio total de adjudicación y el importe del depósito:"
  options:
  - id: a
    text:
      es: "en los 5 días siguientes a la fecha de la notificación de la adjudicación."
  - id: b
    text:
      es: "en los 10 días siguientes a la fecha de la notificación de la adjudicación."
  - id: c
    correct: true
    text:
      es: "en los 15 días siguientes a la fecha de la notificación de la adjudicación."
  - id: d
    text:
      es: "en los 15 días siguientes a la fecha de celebración de la subasta."
  explanation:
    es: "El plazo es de 15 días y se cuenta desde la notificación de la adjudicación, no desde la celebración de la subasta (art. 104 bis.3.b RGR). Los 5 días son el plazo para optar por la escritura pública de venta (art. 111.1 RGR), y los 10 no son una cifra de este artículo."
  citation: "art. 104 bis.3.b RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-104-bis
- id: m03-l12-q0018
  prompt:
    es: "¿Qué consecuencia prevé el artículo 104 bis.3.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación para el adjudicatario que no completa el pago de la diferencia en el plazo señalado en la notificación de la adjudicación?"
  options:
  - id: a
    correct: true
    text:
      es: "Pierde el importe del depósito, que se aplica a la cancelación de las deudas objeto del procedimiento."
  - id: b
    text:
      es: "Conserva la adjudicación y paga intereses de demora sobre la diferencia."
  - id: c
    text:
      es: "Debe abonar un recargo del 20 por ciento sobre la diferencia pendiente."
  - id: d
    text:
      es: "Se le devuelve el depósito y se declara desierta la subasta del bien."
  explanation:
    es: "La advertencia de la notificación es que, si no completa el pago, pierde el depósito, y este se aplica a cancelar las deudas del procedimiento (art. 104 bis.3.b RGR). No se le devuelve. Tampoco se prevé un recargo del 20 por ciento ni que conserve la adjudicación pagando intereses."
  citation: "art. 104 bis.3.b RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-107
- id: m03-l12-q0019
  prompt:
    es: "De acuerdo con el artículo 107.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, procede la adjudicación directa de los bienes o derechos embargados cuando, después de realizado el concurso:"
  options:
  - id: a
    text:
      es: "se declare desierta la primera subasta."
  - id: b
    correct: true
    text:
      es: "queden bienes o derechos sin adjudicar."
  - id: c
    text:
      es: "la oferta más alta sea inferior al 50 por ciento del tipo."
  - id: d
    text:
      es: "el obligado al pago no haya presentado valoración contradictoria."
  explanation:
    es: "La primera causa de adjudicación directa es que, realizado el concurso, queden bienes sin adjudicar (art. 107.1.a RGR). La subasta no es el presupuesto: esa causa se refiere al concurso. La valoración contradictoria y el 50 por ciento del tipo pertenecen a otros trámites (arts. 97.3 y 104 bis.1.b RGR)."
  citation: "art. 107.1 RGR"
  difficulty: 2
  tags:
  - "supuesto-legal"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0026
  prompt:
    es: "Conforme al artículo 97.6.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si sobre los bienes embargados existen cargas o gravámenes de carácter real anteriores que no exceden de la valoración del bien, el tipo para la subasta es:"
  options:
  - id: a
    text:
      es: "el importe de la valoración, sin descontar el valor de las cargas o gravámenes anteriores."
  - id: b
    text:
      es: "el importe de los débitos y costas, siempre que no supere el valor fijado al bien."
  - id: c
    correct: true
    text:
      es: "la diferencia entre dicha valoración y el valor actual de las cargas o gravámenes anteriores al derecho anotado."
  - id: d
    text:
      es: "el valor actual de las cargas o gravámenes anteriores al derecho anotado."
  explanation:
    es: "Si las cargas anteriores no superan la valoración, el tipo es la valoración menos el valor actual de esas cargas (art. 97.6.b.1.º RGR). Tomar la valoración íntegra es la regla de los bienes sin cargas. El importe de los débitos y costas es el tipo cuando las cargas exceden de la valoración. El valor de las cargas por sí solo no es tipo en ningún caso."
  citation: "art. 97.6.b RGR"
  difficulty: 2
  tags:
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0028
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el tipo para la subasta de bienes embargados sin cargas ni gravámenes es la correcta, según el artículo 97.6.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "El tipo es la valoración reducida en un 20 por ciento."
  - id: b
    text:
      es: "El tipo es el importe de los débitos y costas del procedimiento de apremio."
  - id: c
    text:
      es: "El tipo es el importe de la valoración más el de las costas del procedimiento."
  - id: d
    correct: true
    text:
      es: "El tipo es el importe de la valoración."
  explanation:
    es: "Sin cargas ni gravámenes, el tipo es la valoración y nada más (art. 97.6.a RGR). Los débitos y costas solo intervienen cuando las cargas anteriores exceden de la valoración. La reducción del 20 por ciento y la suma de las costas no están en el artículo. Los coeficientes correctores del artículo 97.7 son de 0,8 y 0,6 y se aplican a convocatorias posteriores a la primera."
  citation: "art. 97.6.a RGR"
  difficulty: 1
  tags:
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0029
  prompt:
    es: "Almacenes Duero, S.L. tiene embargado un inmueble valorado en 300.000 euros. El registro muestra una hipoteca anterior al derecho anotado, cuyo valor actual es de 40.000 euros. Según el artículo 97.6.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el tipo de la primera subasta?"
  options:
  - id: a
    text:
      es: "300.000 euros, la valoración sin descontar el valor de la hipoteca."
  - id: b
    text:
      es: "340.000 euros, la valoración más el valor actual de la hipoteca."
  - id: c
    text:
      es: "40.000 euros, el valor actual de la hipoteca anterior."
  - id: d
    correct: true
    text:
      es: "260.000 euros, la valoración menos el valor actual de la hipoteca."
  explanation:
    es: "La hipoteca es una carga real anterior y su valor actual (40.000) no excede de la valoración (300.000). El tipo es la diferencia: 300.000 − 40.000 = 260.000 euros (art. 97.6.b.1.º RGR). Los 300.000 euros omiten la carga. Los 340.000 suman la carga en lugar de restarla. Los 40.000 euros son el valor de la carga, no el tipo."
  citation: "art. 97.6.b RGR"
  difficulty: 1
  tags:
  - "cómputo"
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0030
  prompt:
    es: "Un inmueble de Frutas Calatrava, S.L. está valorado en 150.000 euros y soporta cargas reales anteriores al derecho anotado cuyo valor actual es de 180.000 euros. Los débitos y costas ascienden a 90.000 euros. Conforme al artículo 97.6.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el tipo de subasta?"
  options:
  - id: a
    text:
      es: "180.000 euros, el valor actual de las cargas anteriores."
  - id: b
    text:
      es: "150.000 euros, el importe de la valoración del inmueble."
  - id: c
    correct: true
    text:
      es: "90.000 euros, el importe de los débitos y costas."
  - id: d
    text:
      es: "60.000 euros, la diferencia entre valoración y débitos."
  explanation:
    es: "Las cargas (180.000) exceden de la valoración (150.000), así que el tipo es el importe de los débitos y costas, 90.000 euros, porque no supera el valor fijado al bien (art. 97.6.b.2.º RGR). Los 150.000 euros serían el tipo solo si los débitos y costas superasen la valoración. Los 180.000 son el valor de las cargas. Los 60.000 resultan de restar los débitos a la valoración, operación que el artículo no prevé en este caso."
  citation: "art. 97.6.b RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0031
  prompt:
    es: "Un inmueble de Aceites Cabra, S.L. está valorado en 150.000 euros y tiene cargas reales anteriores al derecho anotado con un valor actual de 180.000 euros. Los débitos y costas son 170.000 euros. Según el artículo 97.6.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el tipo de subasta?"
  options:
  - id: a
    text:
      es: "180.000 euros, el valor actual de las cargas anteriores."
  - id: b
    text:
      es: "20.000 euros, la diferencia entre débitos y valoración."
  - id: c
    text:
      es: "170.000 euros, el importe de los débitos y costas."
  - id: d
    correct: true
    text:
      es: "150.000 euros, el importe de la valoración del inmueble."
  explanation:
    es: "Las cargas exceden de la valoración, y los débitos y costas (170.000) la superan. En ese caso el tipo es la valoración del bien, 150.000 euros (art. 97.6.b.2.º RGR). Los 170.000 euros sobrepasan el valor fijado al bien, que es el techo. Los 180.000 son las cargas. Los 20.000 son la diferencia entre débitos y valoración, que no define ningún tipo."
  citation: "art. 97.6.b RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0032
  prompt:
    es: "A efectos de fijar el tipo para la subasta, ¿qué cargas o gravámenes tiene en cuenta el artículo 97.6.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación cuando se resta su valor actual de la valoración del bien?"
  options:
  - id: a
    text:
      es: "Solo las cargas hipotecarias, con independencia de la fecha de su inscripción."
  - id: b
    text:
      es: "Todas las cargas y gravámenes inscritos sobre el bien, sean anteriores o posteriores al derecho anotado."
  - id: c
    text:
      es: "Las cargas o gravámenes de carácter real posteriores al derecho anotado."
  - id: d
    correct: true
    text:
      es: "Las cargas o gravámenes de carácter real anteriores al derecho anotado."
  explanation:
    es: "Solo cuentan las cargas reales anteriores al derecho anotado (art. 97.6.b.1.º RGR). Las posteriores no se restan, porque no preceden al embargo. Restringir la regla a las hipotecas añade una condición que el texto no tiene."
  citation: "art. 97.6.b RGR"
  difficulty: 2
  tags:
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0033
  prompt:
    es: "Señale la respuesta CORRECTA sobre las cargas y gravámenes anteriores de un bien subastado, según el artículo 97.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Se cancelan de oficio por el órgano de recaudación en el momento de la adjudicación."
  - id: b
    correct: true
    text:
      es: "Quedan subsistentes, sin aplicar a su extinción el precio del remate."
  - id: c
    text:
      es: "Se trasladan al adjudicatario solo si este lo acepta expresamente en la puja."
  - id: d
    text:
      es: "Se extinguen con el precio del remate, que se aplica primero a su pago."
  explanation:
    es: "Las cargas anteriores siguen vivas tras la subasta y el precio no se destina a extinguirlas (art. 97.6 RGR). Por eso se restan del tipo. Ni se pagan con el remate ni se cancelan de oficio, y su subsistencia no depende de que el adjudicatario las acepte al pujar."
  citation: "art. 97.6 RGR"
  difficulty: 2
  tags:
  - "tipo-subasta"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0034
  prompt:
    es: "Según el artículo 97.7 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, para los bienes o lotes que, habiendo sido objeto de un procedimiento de enajenación, han quedado sin adjudicar, la valoración se multiplica por un coeficiente corrector que es del 0,8 cuando el bien va a ser objeto de:"
  options:
  - id: a
    text:
      es: "la segunda subasta, y del 0,9 para terceras y posteriores convocatorias."
  - id: b
    correct: true
    text:
      es: "la segunda subasta, y del 0,6 para terceras y posteriores convocatorias."
  - id: c
    text:
      es: "la segunda subasta, y del 0,5 para terceras y posteriores convocatorias."
  - id: d
    text:
      es: "la tercera subasta, y del 0,6 para las posteriores convocatorias."
  explanation:
    es: "El coeficiente es 0,8 en la segunda subasta y 0,6 desde la tercera (art. 97.7 RGR). El 0,5 y el 0,9 no son cifras del artículo, y el 0,8 no se reserva a la tercera subasta."
  citation: "art. 97.7 RGR"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0035
  prompt:
    es: "Un inmueble embargado a Cerámicas Ruiz, S.L. tiene una valoración de 200.000 euros, sin cargas. Quedó sin adjudicar en la primera subasta y también en la segunda. Según el artículo 97.7 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuál es el tipo de la tercera subasta?"
  options:
  - id: a
    correct: true
    text:
      es: "120.000 euros, resultado de multiplicar la valoración por 0,6."
  - id: b
    text:
      es: "96.000 euros, resultado de multiplicar por 0,6 el tipo de la segunda subasta."
  - id: c
    text:
      es: "160.000 euros, resultado de multiplicar la valoración por 0,8."
  - id: d
    text:
      es: "100.000 euros, resultado de multiplicar la valoración por 0,5."
  explanation:
    es: "En terceras y posteriores convocatorias el coeficiente corrector es 0,6 sobre la valoración: 200.000 × 0,6 = 120.000 euros (art. 97.7 RGR). Los 160.000 euros (0,8) son el importe de la segunda subasta. El 0,5 no existe. Los 96.000 euros encadenan el coeficiente sobre un tipo ya corregido, cuando el artículo lo aplica a la valoración."
  citation: "art. 97.7 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0037
  prompt:
    es: "La Administración valora en 100.000 euros los bienes embargados a Lácteos del Sur, S.L. y el perito de la empresa los valora en 115.000 euros. Conforme al artículo 97.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué valor se estima para los bienes?"
  options:
  - id: a
    text:
      es: "Hay que convocar al obligado al pago para dirimir las diferencias, porque la diferencia es de 15.000 euros y supera el límite fijado para estimar la tasación más alta."
  - id: b
    text:
      es: "107.500 euros, la media de las dos valoraciones, porque la diferencia no excede del 20 por ciento."
  - id: c
    text:
      es: "100.000 euros, porque prevalece la valoración de la Administración salvo acuerdo con el obligado."
  - id: d
    correct: true
    text:
      es: "115.000 euros, porque la diferencia no excede del 20 por ciento de la valoración menor y se toma la tasación más alta."
  explanation:
    es: "La diferencia es de 15.000 euros, el 15 por ciento de la menor (100.000), y no excede del 20 por ciento. Entonces se estima como valor el de la tasación más alta: 115.000 euros (art. 97.3 RGR). No se hace media. Tampoco prevalece la valoración de la Administración. La convocatoria al obligado solo procede si la diferencia supera el 20 por ciento."
  citation: "art. 97.3 RGR"
  difficulty: 2
  tags:
  - "cómputo"
