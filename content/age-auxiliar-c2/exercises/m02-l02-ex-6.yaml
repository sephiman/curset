# anchor: boe-a-2001-21090-art-1
- id: m02-l02-q128
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, pueden ejercer el derecho de petición las personas naturales o jurídicas, prescindiendo de su nacionalidad, y pueden hacerlo:"
  options:
  - id: a
    text:
      es: "Solo de forma individual, aunque sean personas jurídicas."
  - id: b
    correct: true
    text:
      es: "Individual o colectivamente."
  - id: c
    text:
      es: "Solo colectivamente, a través de organizaciones representativas."
  - id: d
    text:
      es: "Individual o colectivamente, salvo las personas jurídicas, que solo pueden hacerlo colectivamente."
  explanation:
    es: "El artículo 1.1 permite ejercer el derecho de petición individual o colectivamente. Limitarlo a lo individual, aunque se trate de personas jurídicas, recorta lo que el texto concede a toda persona natural o jurídica. Exigir lo colectivo y una organización representativa añade un requisito que la ley no contiene. Reservar a las personas jurídicas solo la forma colectiva distingue entre titulares donde la ley dice «toda persona natural o jurídica»."
  citation: "art. 1.1 LO 4/2001"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q131
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, cuando la inadmisión de una petición traiga causa de la existencia de otros procedimientos específicos para satisfacer su objeto, la declaración de inadmisión deberá indicar expresamente las disposiciones a cuyo amparo deba sustanciarse y:"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano competente para sustanciar ese procedimiento."
  - id: b
    text:
      es: "El plazo de que dispone el peticionario para recurrir la inadmisión."
  - id: c
    text:
      es: "El plazo máximo en que ese órgano deberá contestar al peticionario."
  - id: d
    text:
      es: "El funcionario que haya tramitado la petición inadmitida."
  explanation:
    es: "El artículo 9.1 exige que la declaración indique las disposiciones a cuyo amparo deba sustanciarse el procedimiento específico y el órgano competente para ello. Los plazos para recurrir o para contestar no figuran entre esas menciones, y el artículo 11.1 fija el de contestación solo para las peticiones admitidas a trámite. El funcionario que tramitó la petición no es el órgano competente para el procedimiento que la sustituye."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-11
- id: m02-l02-q132
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, admitida a trámite una petición, la autoridad u órgano competente está obligado a contestar y a notificar la contestación en el plazo máximo de tres meses, que se cuenta desde:"
  options:
  - id: a
    text:
      es: "La fecha en que se declara su admisión a trámite."
  - id: b
    correct: true
    text:
      es: "La fecha de presentación de la petición."
  - id: c
    text:
      es: "La fecha en que se acusa recibo de ella al interesado."
  - id: d
    text:
      es: "La fecha en que el peticionario subsana los defectos de su escrito."
  explanation:
    es: "El artículo 11.1 cuenta los tres meses desde la fecha de presentación de la petición. La admisión a trámite es el presupuesto de la obligación de contestar, no el momento en que empieza el plazo. El acuse de recibo, a los diez días de la recepción, y la subsanación de defectos, en quince días, son otros trámites con plazo propio, que no desplazan el comienzo del cómputo de la contestación."
  citation: "art. 11.1 LO 4/2001"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2001-21090-art-10
- id: m02-l02-q137
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, cuando la inadmisibilidad de una petición se base en la falta de competencia de su destinatario, este la remitirá a la institución, administración u organismo que estime competente en diez días y lo comunicará así:"
  options:
  - id: a
    text:
      es: "Al Defensor del Pueblo."
  - id: b
    text:
      es: "Al Ministerio Fiscal."
  - id: c
    correct: true
    text:
      es: "Al propio peticionario."
  - id: d
    text:
      es: "A la Inspección General de Servicios."
  explanation:
    es: "El artículo 10.1 manda comunicar la remisión al peticionario, que es quien debe saber ante quién sigue su petición. El Defensor del Pueblo, el Ministerio Fiscal y la Inspección General de Servicios no aparecen en el artículo: la Inspección interviene en el programa de quejas y sugerencias del Real Decreto 951/2005, no en las peticiones."
  citation: "art. 10.1 LO 4/2001"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2001-21090-art-10
- id: m02-l02-q138
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, el destinatario de una petición cuya inadmisibilidad se base en su falta de competencia la remitirá a la institución, administración u organismo que estime competente en:"
  options:
  - id: a
    text:
      es: "Un plazo de cinco días."
  - id: b
    text:
      es: "Un plazo de quince días."
  - id: c
    text:
      es: "Un plazo de cuarenta y cinco días hábiles."
  - id: d
    correct: true
    text:
      es: "Un plazo de diez días."
  explanation:
    es: "El artículo 10.1 fija diez días para remitir la petición a quien se estime competente. Cinco días no es plazo de la ley. Quince días es el de subsanación del artículo 7.2. Cuarenta y cinco días hábiles es el de la declaración de inadmisibilidad, en el artículo 9.1, que no es el de la remisión."
  citation: "art. 10.1 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q046
  prompt:
    es: "Don Aurelio Ledesma Ortigosa pide en el mostrador el estado de tramitación del expediente de su hermana. Según el artículo 3.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿a quién puede facilitarse esa información?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo a quienes tengan la condición de interesados en el procedimiento o a sus representantes legales."
  - id: b
    text:
      es: "A cualquier ciudadano que la pida, sin exigir para ello la acreditación de legitimación alguna."
  - id: c
    text:
      es: "A los familiares de la persona interesada hasta el segundo grado, si acreditan el parentesco."
  - id: d
    text:
      es: "A cualquier persona que se identifique, previa autorización escrita de la persona titular de la Jefatura."
  explanation:
    es: "El estado de los procedimientos en tramitación es información particular, y solo se facilita a quienes son interesados en cada procedimiento o a sus representantes legales (art. 3.1 RD 208/1996). Don Aurelio no es parte ni representante de su hermana, y el parentesco no cambia eso. La opción que la abre a cualquier ciudadano sin legitimación describe la información general (art. 2.2 RD 208/1996). La de los familiares hasta el segundo grado añade una categoría que la norma no recoge. La que exige autorización escrita de la persona titular de la Jefatura tampoco figura en el artículo."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
