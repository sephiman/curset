# anchor: celex-32016r0679-art-5
- id: m01-l12-q055
  prompt:
    es: "Señale el nombre que da el Reglamento (UE) 2016/679, de 27 de abril de 2016, al principio según el cual los datos se recogen con fines determinados, explícitos y legítimos:"
  options:
  - id: a
    text:
      es: "Minimización de datos."
  - id: b
    text:
      es: "Exactitud."
  - id: c
    correct: true
    text:
      es: "Limitación de la finalidad."
  - id: d
    text:
      es: "Limitación del plazo de conservación."
  explanation:
    es: "El artículo 5.1.b) llama «limitación de la finalidad» al principio de recoger los datos con fines determinados, explícitos y legítimos. La minimización se refiere a la cantidad de datos, la exactitud a que estén al día y la limitación del plazo de conservación al tiempo durante el que se identifica a los interesados."
  citation: "art. 5.1 RGPD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-5
- id: m01-l12-q057
  prompt:
    es: "Conforme al artículo 5.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, están sujetos al deber de confidencialidad los responsables y encargados del tratamiento y:"
  options:
  - id: a
    text:
      es: "Únicamente el delegado de protección de datos."
  - id: b
    text:
      es: "Solo los empleados con funciones directivas."
  - id: c
    text:
      es: "Los interesados cuyos datos se tratan."
  - id: d
    correct: true
    text:
      es: "Todas las personas que intervengan en cualquier fase de este."
  explanation:
    es: "El artículo 5.1 extiende el deber de confidencialidad, además de a responsables y encargados, a todas las personas que intervengan en cualquier fase del tratamiento. No se limita al delegado ni a los directivos, y los interesados son los titulares de los datos, no obligados."
  citation: "art. 5.1 LOPDGDD"
  difficulty: 1
  tags:
  - "órgano"
  - "concepto"
# anchor: celex-32016r0679-art-4
- id: m01-l12-q058
  prompt:
    es: "Según el Reglamento (UE) 2016/679, de 27 de abril de 2016, el encargado del tratamiento es quien trata datos personales:"
  options:
  - id: a
    text:
      es: "Por cuenta del interesado."
  - id: b
    correct: true
    text:
      es: "Por cuenta del responsable del tratamiento."
  - id: c
    text:
      es: "Por cuenta de la autoridad de control."
  - id: d
    text:
      es: "Determinando los fines y medios del tratamiento."
  explanation:
    es: "El artículo 4.8 define al encargado como quien trata datos por cuenta del responsable. No actúa por cuenta del interesado ni de la autoridad de control, y determinar los fines y medios es lo que define al responsable."
  citation: "art. 4.8 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-4
- id: m01-l12-q059
  prompt:
    es: "Según el artículo 4.9 del Reglamento (UE) 2016/679, de 27 de abril de 2016, es destinatario el organismo al que se comuniquen datos personales:"
  options:
  - id: a
    text:
      es: "Siempre que sea un tercero ajeno al tratamiento."
  - id: b
    correct: true
    text:
      es: "Se trate o no de un tercero."
  - id: c
    text:
      es: "Solo si es una autoridad pública."
  - id: d
    text:
      es: "Únicamente cuando sea un encargado del tratamiento."
  explanation:
    es: "El artículo 4.9 define al destinatario como quien recibe datos personales, se trate o no de un tercero. No exige que sea un tercero ajeno al tratamiento, ni que sea una autoridad pública, ni que sea un encargado: puede serlo cualquier persona u organismo al que se comuniquen los datos."
  citation: "art. 4.9 RGPD"
  difficulty: 3
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-4
- id: m01-l12-q060
  prompt:
    es: "Señale a quién llama «el interesado» el Reglamento (UE) 2016/679, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales:"
  options:
  - id: a
    text:
      es: "A la persona que determina los fines y medios del tratamiento."
  - id: b
    text:
      es: "A la persona que trata los datos por cuenta del responsable."
  - id: c
    text:
      es: "A la persona a la que se comunican los datos personales."
  - id: d
    correct: true
    text:
      es: "A la persona física identificada o identificable a la que se refieren los datos personales."
  explanation:
    es: "El artículo 4.1 llama «el interesado» a la persona física identificada o identificable a la que se refieren los datos. Quien determina los fines y medios es el responsable, quien trata por cuenta de este es el encargado y quien recibe los datos es el destinatario."
  citation: "art. 4.1 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-6
- id: m01-l12-q061
  prompt:
    es: "Señale las notas que caracterizan la manifestación de voluntad en que consiste el consentimiento del afectado, según el artículo 6.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales:"
  options:
  - id: a
    correct: true
    text:
      es: "Libre, específica, informada e inequívoca."
  - id: b
    text:
      es: "Libre, expresa, informada y escrita."
  - id: c
    text:
      es: "Voluntaria, específica, previa y documentada."
  - id: d
    text:
      es: "Libre, tácita, informada e inequívoca."
  explanation:
    es: "El artículo 6.1 exige una manifestación de voluntad libre, específica, informada e inequívoca. Cada una de las otras series cambia alguna nota: expresa y escrita, previa y documentada o tácita no son las que fija el artículo."
  citation: "art. 6.1 LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-12
- id: m01-l12-q062
  prompt:
    es: "Según el Reglamento (UE) 2016/679, de 27 de abril de 2016, el responsable informará al interesado de sus actuaciones sobre su solicitud sin dilación indebida y, en cualquier caso, en el plazo de:"
  options:
  - id: a
    text:
      es: "Diez días a partir de la recepción de la solicitud."
  - id: b
    text:
      es: "Quince días a partir de la recepción de la solicitud."
  - id: c
    correct: true
    text:
      es: "Un mes a partir de la recepción de la solicitud."
  - id: d
    text:
      es: "Tres meses a partir de la recepción de la solicitud."
  explanation:
    es: "El artículo 12.3 fija un mes desde la recepción de la solicitud, prorrogable otros dos meses en caso necesario. Diez y quince días son plazos más cortos que la ley no prevé, y tres meses es el máximo con la prórroga, no el plazo general."
  citation: "art. 12.3 RGPD"
  difficulty: 1
  tags:
  - "plazo"
# anchor: celex-32016r0679-art-12
- id: m01-l12-q063
  prompt:
    es: "Según el artículo 12.5 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ante solicitudes manifiestamente infundadas o excesivas, el responsable podrá negarse a actuar o:"
  options:
  - id: a
    text:
      es: "Imponer una sanción económica al solicitante."
  - id: b
    correct: true
    text:
      es: "Cobrar un canon razonable en función de los costes administrativos."
  - id: c
    text:
      es: "Exigir un depósito previo para tramitar la solicitud."
  - id: d
    text:
      es: "Remitir la solicitud a la autoridad de control."
  explanation:
    es: "El artículo 12.5 permite, ante solicitudes manifiestamente infundadas o excesivas, cobrar un canon razonable según los costes administrativos o negarse a actuar. No autoriza a sancionar al solicitante, a exigir un depósito ni a remitir la solicitud a la autoridad de control."
  citation: "art. 12.5 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: celex-32016r0679-art-17
- id: m01-l12-q065
  prompt:
    es: "¿Cuál de las siguientes denominaciones da el artículo 17 del Reglamento (UE) 2016/679, de 27 de abril de 2016, al derecho de supresión?"
  options:
  - id: a
    text:
      es: "«El derecho al anonimato»."
  - id: b
    text:
      es: "«El derecho a la desconexión digital»."
  - id: c
    text:
      es: "«El derecho de oposición»."
  - id: d
    correct: true
    text:
      es: "«El derecho al olvido»."
  explanation:
    es: "El título del artículo 17 llama al derecho de supresión «el derecho al olvido». El anonimato y la desconexión digital no son denominaciones de la supresión, y la oposición es otro derecho, el del artículo 21."
  citation: "art. 17 RGPD"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-17
- id: m01-l12-q066
  prompt:
    es: "¿Cuál de los siguientes supuestos obliga al responsable a suprimir sin dilación indebida los datos personales, según el artículo 17.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016?"
  options:
  - id: a
    text:
      es: "Que los datos se traten con fines estadísticos."
  - id: b
    correct: true
    text:
      es: "Que los datos hayan sido tratados ilícitamente."
  - id: c
    text:
      es: "Que los datos se hayan obtenido del propio interesado."
  - id: d
    text:
      es: "Que los datos se comuniquen a un encargado del tratamiento."
  explanation:
    es: "La letra d) del artículo 17.1 obliga a suprimir los datos tratados ilícitamente. Tratarlos con fines estadísticos o comunicarlos a un encargado no genera esa obligación, y obtenerlos del propio interesado es la forma normal de recogerlos."
  citation: "art. 17.1 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-17
- id: m01-l12-q067
  prompt:
    es: "¿Cuál de las siguientes finalidades hace inaplicable el derecho de supresión, según el artículo 17.3 del Reglamento (UE) 2016/679, de 27 de abril de 2016?"
  options:
  - id: a
    text:
      es: "La mejora del servicio que se ofrece al interesado."
  - id: b
    text:
      es: "El envío de comunicaciones comerciales."
  - id: c
    text:
      es: "La gestión interna de los archivos del responsable y de sus encargados."
  - id: d
    correct: true
    text:
      es: "La formulación, el ejercicio o la defensa de reclamaciones."
  explanation:
    es: "La letra e) del artículo 17.3 exceptúa el tratamiento necesario para formular, ejercer o defender reclamaciones. Mejorar un servicio, enviar comunicaciones comerciales o gestionar archivos internos no figuran entre las excepciones."
  citation: "art. 17.3 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: celex-32016r0679-art-18
- id: m01-l12-q068
  prompt:
    es: "Según el artículo 18.1.a) del Reglamento (UE) 2016/679, de 27 de abril de 2016, el interesado puede pedir la limitación del tratamiento si impugna la exactitud de los datos, durante un plazo que permita al responsable:"
  options:
  - id: a
    text:
      es: "Suprimir los datos inexactos."
  - id: b
    correct: true
    text:
      es: "Verificar la exactitud de los mismos."
  - id: c
    text:
      es: "Notificar la rectificación a los destinatarios."
  - id: d
    text:
      es: "Comunicar la impugnación a la autoridad de control."
  explanation:
    es: "La letra a) del artículo 18.1 da la limitación mientras el responsable verifica la exactitud de los datos impugnados. Suprimir los datos, notificar la rectificación a los destinatarios o avisar a la autoridad de control no son lo que ese plazo permite."
  citation: "art. 18.1.a) RGPD"
  difficulty: 3
  tags:
  - "requisito"
  - "plazo"
# anchor: celex-32016r0679-art-21
- id: m01-l12-q069
  prompt:
    es: "Según el Reglamento (UE) 2016/679, de 27 de abril de 2016, cuando el tratamiento tenga por objeto la mercadotecnia directa, el interesado tiene derecho a oponerse:"
  options:
  - id: a
    text:
      es: "Solo durante el primer mes del tratamiento."
  - id: b
    correct: true
    text:
      es: "En todo momento."
  - id: c
    text:
      es: "Solo por motivos relacionados con su situación particular."
  - id: d
    text:
      es: "Solo si el responsable no acredita motivos legítimos imperiosos."
  explanation:
    es: "El artículo 21.2 permite oponerse a la mercadotecnia directa en todo momento. Las condiciones de motivos de situación particular o de motivos legítimos imperiosos son las del artículo 21.1, y el plazo del primer mes no existe."
  citation: "art. 21.2 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-22
- id: m01-l12-q070
  prompt:
    es: "Según el artículo 22.3 del Reglamento (UE) 2016/679, de 27 de abril de 2016, en las decisiones automatizadas basadas en un contrato o en el consentimiento explícito, el responsable garantizará como mínimo el derecho a obtener:"
  options:
  - id: a
    text:
      es: "Una indemnización por la decisión adoptada."
  - id: b
    text:
      es: "Una revisión por la autoridad de control."
  - id: c
    text:
      es: "El borrado inmediato de los datos tratados."
  - id: d
    correct: true
    text:
      es: "Intervención humana por parte del responsable."
  explanation:
    es: "El artículo 22.3 impone como mínimo el derecho a obtener intervención humana, a expresar el punto de vista y a impugnar la decisión. No prevé una indemnización automática, ni una revisión por la autoridad de control, ni el borrado inmediato de los datos."
  citation: "art. 22.3 RGPD"
  difficulty: 3
  tags:
  - "efecto"
# anchor: celex-32016r0679-art-30
- id: m01-l12-q071
  prompt:
    es: "Según el Reglamento (UE) 2016/679, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales, cada responsable llevará un registro de:"
  options:
  - id: a
    text:
      es: "Los empleados con acceso a datos personales."
  - id: b
    text:
      es: "Las auditorías externas que se le hayan practicado."
  - id: c
    correct: true
    text:
      es: "Las actividades de tratamiento efectuadas bajo su responsabilidad."
  - id: d
    text:
      es: "Las reclamaciones presentadas ante la autoridad de control."
  explanation:
    es: "El artículo 30.1 manda llevar un registro de las actividades de tratamiento efectuadas bajo la responsabilidad del responsable. Los empleados con acceso, las auditorías externas y las reclamaciones ante la autoridad no son el objeto de ese registro."
  citation: "art. 30.1 RGPD"
  difficulty: 1
  tags:
  - "estructura"
# anchor: celex-32016r0679-art-33
- id: m01-l12-q072
  prompt:
    es: "Conforme al artículo 33.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el responsable notificará una violación de la seguridad a la autoridad de control sin dilación indebida y, de ser posible, a más tardar:"
  options:
  - id: a
    correct: true
    text:
      es: "72 horas después de que haya tenido constancia de ella."
  - id: b
    text:
      es: "24 horas después de que haya tenido constancia de ella."
  - id: c
    text:
      es: "48 horas después de que haya tenido constancia de ella."
  - id: d
    text:
      es: "10 días después de que haya tenido constancia de ella."
  explanation:
    es: "El artículo 33.1 fija 72 horas desde que el responsable tuvo constancia de la violación, y si se supera debe indicar los motivos de la dilación. 24 y 48 horas son plazos más cortos que no figuran en el artículo, y diez días lo excede con mucho."
  citation: "art. 33.1 RGPD"
  difficulty: 1
  tags:
  - "plazo"
# anchor: celex-32016r0679-art-35
- id: m01-l12-q073
  prompt:
    es: "¿Cuál de las siguientes medidas debe adoptar el responsable antes del tratamiento si es probable que entrañe un alto riesgo, según el artículo 35.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016?"
  options:
  - id: a
    text:
      es: "Una consulta pública sobre las operaciones previstas."
  - id: b
    text:
      es: "Una auditoría externa de sus sistemas."
  - id: c
    text:
      es: "Una notificación a los interesados afectados."
  - id: d
    correct: true
    text:
      es: "Una evaluación del impacto en la protección de datos personales."
  explanation:
    es: "El artículo 35.1 exige una evaluación del impacto de las operaciones de tratamiento en la protección de datos personales antes de realizarlas. No exige una consulta pública, ni una auditoría externa, ni notificar a los interesados."
  citation: "art. 35.1 RGPD"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: celex-32016r0679-art-38
- id: m01-l12-q074
  prompt:
    es: "Conforme al artículo 38.3 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el delegado de protección de datos rendirá cuentas directamente:"
  options:
  - id: a
    correct: true
    text:
      es: "Al más alto nivel jerárquico del responsable o encargado."
  - id: b
    text:
      es: "Ante la autoridad de control."
  - id: c
    text:
      es: "Al departamento jurídico del responsable y a su comité de dirección."
  - id: d
    text:
      es: "Ante el interesado cuyos datos se traten."
  explanation:
    es: "El artículo 38.3 dice que el delegado rinde cuentas directamente al más alto nivel jerárquico del responsable o encargado. No depende de la autoridad de control, ni de un departamento jurídico, ni responde ante cada interesado."
  citation: "art. 38.3 RGPD"
  difficulty: 2
  tags:
  - "órgano"
# anchor: celex-32016r0679-art-39
- id: m01-l12-q075
  prompt:
    es: "¿Cuál de las siguientes es una función mínima del delegado de protección de datos, según el artículo 39.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016?"
  options:
  - id: a
    text:
      es: "Resolver los recursos contra las decisiones de la autoridad de control."
  - id: b
    text:
      es: "Aprobar las medidas de seguridad del responsable."
  - id: c
    correct: true
    text:
      es: "Supervisar el cumplimiento de la normativa y de las políticas de protección de datos."
  - id: d
    text:
      es: "Autorizar las comunicaciones de datos a terceros países."
  explanation:
    es: "La letra b) del artículo 39.1 incluye supervisar el cumplimiento del Reglamento, de otras disposiciones y de las políticas del responsable o encargado. El delegado no resuelve recursos contra la autoridad de control, no aprueba las medidas de seguridad, que decide el responsable, ni autoriza comunicaciones a terceros países."
  citation: "art. 39.1 RGPD"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2018-16673-art-34
- id: m01-l12-q076
  prompt:
    es: "Conforme al artículo 34.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, deben designar en todo caso un delegado de protección de datos:"
  options:
  - id: a
    text:
      es: "Las asociaciones de vecinos."
  - id: b
    text:
      es: "Los profesionales de la salud que ejerzan su actividad a título individual."
  - id: c
    correct: true
    text:
      es: "Las Universidades públicas y privadas."
  - id: d
    text:
      es: "Las cooperativas agrarias."
  explanation:
    es: "La letra b) del artículo 34.1 incluye a los centros docentes y a las Universidades públicas y privadas. Las asociaciones de vecinos y las cooperativas agrarias no figuran en la lista, y los profesionales de la salud que ejercen a título individual están exceptuados expresamente."
  citation: "art. 34.1 LOPDGDD"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2018-16673-art-37
- id: m01-l12-q077
  prompt:
    es: "Según el artículo 37.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el delegado comunicará su decisión al afectado que reclame ante él en el plazo máximo de:"
  options:
  - id: a
    text:
      es: "Un mes desde la recepción de la reclamación."
  - id: b
    text:
      es: "Diez días desde la recepción de la reclamación."
  - id: c
    correct: true
    text:
      es: "Dos meses desde la recepción de la reclamación."
  - id: d
    text:
      es: "Tres meses desde la recepción de la reclamación."
  explanation:
    es: "El artículo 37.1 da al delegado dos meses desde que recibe la reclamación. Un mes es el plazo del artículo 37.2, cuando la autoridad le remite la reclamación presentada ante ella. Diez días y tres meses no figuran en este apartado."
  citation: "art. 37.1 LOPDGDD"
  difficulty: 1
  tags:
  - "plazo"
