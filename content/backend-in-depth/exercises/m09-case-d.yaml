# Generated by docs/backend-verification/s2/tools/build_case.py from m09-case-d.questions.json.
type: case
title:
  en: Telemetry and event ingestion pipeline
scenario:
  en: 'A fleet-management company receives position and engine events from 400,000 vehicles. Each vehicle sends
    a small event every few seconds, and traffic peaks in bursts when many vehicles reconnect at once. The pipeline
    must accept the events without losing them, keep each vehicle''s events together, and let analysts query metrics
    a few seconds later.


    The design the team is discussing has four stages:


    - Ingest. An edge service writes every event to Kafka. Producers batch and compress the events, and the topic
    is keyed by vehicle owner so that one owner''s events stay together.

    - Broker. Kafka stores events in a log on commodity disks and serves consumers from the page cache. Shared clusters
    give each client group a quota per broker.

    - Stream processing. A Flink job aggregates the events into per-minute metrics and takes checkpoints. Some jobs
    need very low latency and some need strong guarantees.

    - Storage. The aggregated metrics go to a replicated key-value store that replicates each item on several nodes
    and uses read and write quorums.'
questions:
- id: m09-case-d-q04
  lesson: m09-l04
  prompt:
    en: A Kafka producer compresses batches of telemetry events before sending them to the broker. Which set of
      compression protocols does Kafka support, according to the Kafka design documentation?
  options:
  - id: a
    text:
      en: '`GZIP` only'
  - id: b
    text:
      en: '`GZIP` and `Snappy` only'
  - id: c
    text:
      en: '`LZ4` and `ZStandard` only'
  - id: d
    correct: true
    text:
      en: '`GZIP`, `Snappy`, `LZ4` and `ZStandard`'
  explanation:
    en: Kafka supports `GZIP`, `Snappy`, `LZ4` and `ZStandard` compression protocols. `GZIP` only is wrong, because
      Kafka supports `GZIP`, `Snappy`, `LZ4` and `ZStandard`. `GZIP` and `Snappy` only is wrong, because Kafka also
      supports `LZ4` and `ZStandard`. `LZ4` and `ZStandard` only is wrong, because Kafka also supports `GZIP` and
      `Snappy`.
  citation: kafka-design#end-to-end-batch-compression
- id: m09-case-d-q06
  lesson: m09-l04
  prompt:
    en: A Flink job aggregates telemetry streams and takes checkpoints. According to the Flink documentation, which
      operators perform stream alignment during a checkpoint?
  options:
  - id: a
    text:
      en: Only operators with multiple predecessors, which are the join operators
  - id: b
    text:
      en: Only the sink operators of the job
  - id: c
    correct: true
    text:
      en: Joins and operators after a shuffle
  - id: d
    text:
      en: Every operator of the job, including `map()` and `filter()` operators
  explanation:
    en: Alignment happens only for operators with multiple predecessors (joins) as well as operators with multiple
      senders (after a repartitioning or shuffle). Only joins is wrong, because alignment also happens for operators
      with multiple senders after a repartitioning or shuffle. Only sinks is wrong, because alignment happens for
      operators with multiple predecessors and operators with multiple senders. Every operator is wrong, because
      alignment happens only for operators with multiple predecessors or multiple senders.
  citation: flink-stateful-stream-processing#exactly-once-vs-at-least-once
- id: m09-case-d-q08
  lesson: m09-l04
  prompt:
    en: According to the Kafka design documentation, once poor disk access patterns have been eliminated, a telemetry
      system of this type has two common causes of inefficiency. Which are they?
  options:
  - id: a
    correct: true
    text:
      en: Small I/O operations and byte copying
  - id: b
    text:
      en: Too many large sequential writes and slow compression of batches
  - id: c
    text:
      en: Garbage collection pauses and too few partitions per topic
  - id: d
    text:
      en: Too many consumers and excessive replication between brokers
  explanation:
    en: The two common causes are too many small I/O operations and excessive byte copying. Large sequential writes
      and slow compression are wrong, because the two causes are small I/O operations and byte copying. Garbage
      collection pauses and too few partitions are wrong, because the two causes are small I/O operations and byte
      copying. Too many consumers and excessive replication are wrong, because the two causes are small I/O operations
      and byte copying.
  citation: kafka-design#efficiency
- id: m09-case-d-q09
  lesson: m09-l02
  prompt:
    en: A telemetry store replicates each item on N=5 nodes and requires W=3 nodes for a successful write. According
      to the Dynamo paper, what is the smallest read quorum R that yields a quorum-like system?
  options:
  - id: a
    text:
      en: '2'
  - id: b
    text:
      en: '1'
  - id: c
    correct: true
    text:
      en: '3'
  - id: d
    text:
      en: '4'
  explanation:
    en: Setting R and W such that R + W > N yields a quorum-like system, so with W of 3 and N of 5 the smallest
      R is 3. R of 2 is wrong, because R + W of 5 is not greater than N of 5, so the system is not quorum-like.
      R of 1 is wrong, because R + W of 4 is not greater than N of 5, so the system is not quorum-like. R of 4 is
      wrong as the smallest value, because R of 3 already gives R + W above N, which is enough.
  citation: paper-dynamo#p7
- id: m09-case-d-q10
  lesson: m09-l04
  prompt:
    en: A telemetry pipeline sends events to Kafka, and the Kafka protocol groups messages together. According to
      the Kafka design documentation, around which abstraction is the protocol built?
  options:
  - id: a
    text:
      en: A single-message request that the broker never combines
  - id: b
    correct: true
    text:
      en: A message set grouping messages
  - id: c
    text:
      en: A byte stream with no message boundaries
  - id: d
    text:
      en: A key-value record that is always compressed alone
  explanation:
    en: The Kafka protocol is built around a message set abstraction that naturally groups messages together. A
      single-message request is wrong, because the protocol is built around a message set abstraction that groups
      messages together. A byte stream with no boundaries is wrong, because the protocol is built around a message
      set abstraction. A record compressed alone is wrong, because efficient compression requires compressing multiple
      messages together rather than each message individually.
  citation: kafka-design#efficiency
- id: m09-case-d-q11
  lesson: m09-l04
  prompt:
    en: A broker sends log data to a consumer socket on the common data path, without `sendfile`. According to the
      Kafka design documentation, how many copies and system calls does that path take?
  options:
  - id: a
    text:
      en: Two copies and one system call
  - id: b
    correct: true
    text:
      en: Four copies and two system calls
  - id: c
    text:
      en: Three copies and three system calls
  - id: d
    text:
      en: Six copies and four system calls
  explanation:
    en: The common data path for transfer of data from file to socket has four copies and two system calls. Two
      copies and one system call is wrong, because the common path has four copies and two system calls. Three copies
      and three system calls is wrong, because the common path has four copies and two system calls. Six copies
      and four system calls is wrong, because the common path has four copies and two system calls.
  citation: kafka-design#efficiency
- id: m09-case-d-q14
  lesson: m09-l02
  prompt:
    en: A telemetry index in Elasticsearch has 5 primary shards and 1 replica per shard. According to the Elasticsearch
      documentation, to how many primary shards does each document belong?
  options:
  - id: a
    text:
      en: Every primary shard of the index
  - id: b
    correct: true
    text:
      en: One primary shard
  - id: c
    text:
      en: All shards, including the replica shards
  - id: d
    text:
      en: Two primary shards, for redundancy
  explanation:
    en: Each document in an index belongs to one primary shard. Every primary shard is wrong, because each shard
      holds only a subset of the documents in the index. All shards is wrong, because a replica shard is a copy
      of a primary shard, not a second home of the document. Two primary shards is wrong, because each document
      belongs to one primary shard.
  citation: es-clusters-nodes-shards#elastic-docs-v3
- id: m09-case-d-q16
  lesson: m09-l04
  prompt:
    en: A producer sends Kafka a compressed batch of 500 telemetry records, and the batch header states 500 records.
      According to the Kafka design documentation, why does the broker decompress that batch?
  options:
  - id: a
    text:
      en: To store the records uncompressed so that consumers read them without decompressing
  - id: b
    text:
      en: To decompress it on behalf of the consumer, which cannot decompress data itself
  - id: c
    correct: true
    text:
      en: To validate it, for example the record count against the batch header
  - id: d
    text:
      en: To split it into single records that the broker appends to its log one at a time
  explanation:
    en: The broker decompresses the batch in order to validate it, for example that the number of records matches
      what the batch header states. Storing the records uncompressed is wrong, because the batch is written to disk
      in compressed form. Decompressing for the consumer is wrong, because the consumer decompresses any compressed
      data that it receives. Appending single records one at a time is wrong, because the server appends chunks
      of messages to its log in one go.
  citation: kafka-design#end-to-end-batch-compression
- id: m09-case-d-q17
  lesson: m09-l04
  prompt:
    en: A Flink job aggregates vehicle telemetry with checkpointing enabled and needs consistently super low latencies
      of a few milliseconds for all records. According to the Flink documentation, what does Flink offer for that
      requirement?
  options:
  - id: a
    correct: true
    text:
      en: A switch to skip the stream alignment during a checkpoint
  - id: b
    text:
      en: A switch to postpone the checkpoint snapshots until the job is idle
  - id: c
    text:
      en: A switch to align every operator, including operators with a single predecessor
  - id: d
    text:
      en: A switch to lose records on restore instead of replaying them
  explanation:
    en: For applications that require consistently super low latencies, Flink has a switch to skip the stream alignment
      during a checkpoint. Postponing the snapshots is wrong, because checkpoint snapshots are still drawn as soon
      as an operator has seen the checkpoint barrier from each input. Aligning every operator is wrong, because
      alignment happens only for operators with multiple predecessors or multiple senders. Losing records on restore
      is wrong, because with alignment skipped the records occur as duplicates and are replayed after the restore.
  citation: flink-stateful-stream-processing#exactly-once-vs-at-least-once
- id: m09-case-d-q19
  lesson: m09-l02
  prompt:
    en: A telemetry store replicates each item on N=3 nodes and must accept a write as long as a single node has
      durably stored it. According to the Dynamo paper, which setting gives applications that highest level of write
      availability?
  options:
  - id: a
    correct: true
    text:
      en: '`W` set to 1'
  - id: b
    text:
      en: '`R` set to 1'
  - id: c
    text:
      en: '`W` set to 2'
  - id: d
    text:
      en: '`W` set to 3'
  explanation:
    en: Applications that need the highest level of availability can set `W` to 1, which ensures that a write is
      accepted as long as a single node has durably written the key. `R` set to 1 is wrong, because `W` is the minimum
      number of nodes that must participate in a successful write operation, not `R`. `W` set to 2 and `W` set to
      3 are wrong, because only `W` set to 1 ensures that a write is accepted as long as a single node has durably
      written the key.
  citation: paper-dynamo-columns#p15
- id: m09-case-d-q21
  lesson: m09-l02
  prompt:
    en: A telemetry store assigns each node one random position on a consistent-hashing ring. According to the Dynamo
      paper, what first challenge does the random position assignment of each node create for the basic algorithm?
  options:
  - id: a
    text:
      en: Every node must store a copy of every key on the ring
  - id: b
    text:
      en: Every arrival or departure of a node forces all other nodes to move data
  - id: c
    text:
      en: The output range of the hash function cannot be treated as a ring
  - id: d
    correct: true
    text:
      en: Non-uniform data and load distribution
  explanation:
    en: The random position assignment of each node on the ring leads to non-uniform data and load distribution.
      Storing every key on every node is wrong, because each node is responsible only for the region of the ring
      between it and its predecessor. Forcing all other nodes to move data is wrong, because departure or arrival
      of a node only affects its immediate neighbors. An unusable ring is wrong, because the output range of a hash
      function is treated as a fixed circular space or ring.
  citation: paper-dynamo-columns#p11
