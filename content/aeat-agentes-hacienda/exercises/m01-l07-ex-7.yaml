# anchor: boe-a-2015-11719-art-90
- id: m01-l07-q0279
  prompt:
    es: "De acuerdo con el artículo 90.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario declarado en suspensión queda privado, mientras permanece en ella:"
  options:
  - id: a
    correct: true
    text:
      es: "Del ejercicio de sus funciones y de todos los derechos inherentes a la condición."
  - id: b
    text:
      es: "Del ejercicio de sus funciones, pero conserva los derechos inherentes a la condición."
  - id: c
    text:
      es: "De sus retribuciones complementarias, pero no del ejercicio de sus funciones."
  - id: d
    text:
      es: "Del ejercicio de sus funciones y de la condición de funcionario de carrera."
  explanation:
    es: "El artículo 90.1: el suspenso «quedará privado durante el tiempo de permanencia en la misma del ejercicio de sus funciones y de todos los derechos inherentes a la condición». Pierde también los derechos, así que no los conserva. Pierde el ejercicio de las funciones, no solo una parte de las retribuciones. No pierde la condición de funcionario: la suspensión es una situación administrativa del funcionario (art. 85.1 TREBEP)."
  citation: "art. 90.1 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-22
- id: m01-l07-q0283
  prompt:
    es: "Conforme al artículo 22.3 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, el funcionario que perdió su puesto de trabajo por condena o sanción debe pedir el reingreso al servicio activo:"
  options:
  - id: a
    correct: true
    text:
      es: "Con un mes de antelación a la finalización del período de suspensión."
  - id: b
    text:
      es: "Dentro de los quince días siguientes a la finalización de la suspensión."
  - id: c
    text:
      es: "Con seis meses de antelación a la finalización del período de suspensión."
  - id: d
    text:
      es: "Dentro del mes siguiente a la finalización del período de suspensión."
  explanation:
    es: "El artículo 22.3 obliga a solicitar el reingreso «con un mes de antelación a la finalización del período de duración de la suspensión». La petición se hace antes del final, no en el mes siguiente ni en los quince días siguientes. La antelación es de un mes, no de seis meses. Seis meses es el plazo que tiene la Administración para conceder el reingreso antes de que el funcionario pase a excedencia forzosa (art. 22.5)."
  citation: "art. 22.3 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-91
- id: m01-l07-q0285
  prompt:
    es: "De acuerdo con el artículo 91 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los plazos, procedimientos y condiciones para solicitar el reingreso al servicio activo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se regulan reglamentariamente, según las situaciones administrativas de procedencia."
  - id: b
    text:
      es: "Se regulan en el propio Estatuto, iguales para todas las situaciones de procedencia."
  - id: c
    text:
      es: "Se fijan en cada convocatoria de concurso, según el puesto que se solicite."
  - id: d
    text:
      es: "Se regulan por ley de cada Administración, sin distinguir la situación de procedencia."
  explanation:
    es: "El artículo 91: «Reglamentariamente se regularán los plazos, procedimientos y condiciones, según las situaciones administrativas de procedencia, para solicitar el reingreso». El Estatuto remite al reglamento, no fija él mismo las reglas. Tampoco las deja a cada convocatoria ni a una ley. Las reglas cambian según la situación de procedencia, como muestran los plazos distintos del RD 365/1995."
  citation: "art. 91 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1984-17387-art-29-bis
- id: m01-l07-q0286
  prompt:
    es: "Conforme al artículo 29 bis.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, el reingreso al servicio activo de los funcionarios sin reserva de plaza y destino se efectúa:"
  options:
  - id: a
    text:
      es: "Mediante su participación en las convocatorias de concursos, nunca de libre designación."
  - id: b
    text:
      es: "Mediante su participación en un nuevo proceso selectivo de acceso al cuerpo."
  - id: c
    text:
      es: "Mediante nombramiento directo del Subsecretario del departamento de adscripción."
  - id: d
    correct: true
    text:
      es: "Mediante su participación en las convocatorias de concursos o de libre designación."
  explanation:
    es: "El artículo veintinueve bis.1 dice que el reingreso de quienes no tienen reserva de plaza y destino «se efectuará mediante su participación en las convocatorias de concursos o de libre designación para la provisión de puestos de trabajo». «Nunca de libre designación» contradice «o de libre designación». Un nuevo proceso selectivo no hace falta: el reingreso se hace por convocatorias de provisión de puestos, no de acceso al cuerpo. El nombramiento directo del Subsecretario tampoco es la vía: el apartado 2 solo prevé una adscripción provisional, y el apartado 3 manda convocar ese puesto para su provisión definitiva en el plazo máximo de un año."
  citation: "art. 29 bis.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-48
- id: m01-l07-q0291
  prompt:
    es: "Conforme al artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, si la resolución de un concurso comporta el reingreso al servicio activo, el plazo de toma de posesión es:"
  options:
  - id: a
    text:
      es: "De un mes, computado desde el día siguiente al del cese en el puesto."
  - id: b
    text:
      es: "De quince días naturales, computados desde la publicación de la resolución."
  - id: c
    text:
      es: "De tres días hábiles, computados desde el día siguiente al del cese."
  - id: d
    correct: true
    text:
      es: "De un mes, computado desde la publicación de la resolución del concurso."
  explanation:
    es: "El artículo 48.1 da un mes de plazo cuando la resolución «comporta cambio de residencia o el reingreso al servicio activo», y añade: «Si la resolución comporta el reingreso al servicio activo, el plazo de toma de posesión deberá computarse desde dicha publicación». Los tres días hábiles son para quien no cambia de residencia. El cómputo desde el cese es la regla general, y el que reingresa no cesa en ningún puesto. Los quince días naturales son el plazo de la toma de posesión tras el nombramiento como funcionario de carrera (art. 114.12 RDL 6/2023)."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-dd-unica
- id: m01-l07-q0299
  prompt:
    es: "¿Cuál de los siguientes preceptos de la Ley 30/1984, de 2 de agosto, figura en la lista de la disposición derogatoria única b) del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El que establece la dependencia orgánica de todo el personal al servicio de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "El que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado."
  - id: c
    text:
      es: "El que atribuye al Gobierno la dirección de la política de personal y la potestad reglamentaria."
  - id: d
    text:
      es: "El que crea el Registro Central en el que se inscribe a todo el personal de la Administración del Estado."
  explanation:
    es: "La lista de la disposición derogatoria única b) incluye el artículo 20.2 de la Ley 30/1984, que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado. Quedan fuera de la lista los artículos 2 (dependencia orgánica), 3.1 (el Gobierno dirige la política de personal y ejerce la potestad reglamentaria) y 13.1 (Registro Central de Personal)."
  citation: "disposición derogatoria única b) TREBEP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1995-8729-art-1
- id: m01-l07-q0302
  prompt:
    es: "Según el artículo 1.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, de 10 de marzo, el Reglamento se aplica a los procedimientos de ingreso del personal:"
  options:
  - id: a
    correct: true
    text:
      es: "De la Administración General del Estado y sus Organismos autónomos"
  - id: b
    text:
      es: "De la Administración General del Estado, excluidos sus Organismos autónomos"
  - id: c
    text:
      es: "De todas las Administraciones Públicas, con carácter básico"
  - id: d
    text:
      es: "De las comunidades autónomas y de las entidades locales"
  explanation:
    es: "El artículo 1.1 aplica el Reglamento «a los procedimientos de ingreso del personal de la Administración General del Estado y sus Organismos autónomos». No tiene carácter básico para todas las Administraciones ni se dirige a las comunidades autónomas y entidades locales. La opción que excluye a los Organismos autónomos contradice el texto, que los incluye expresamente."
  citation: "art. 1.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-122
- id: m01-l07-q0321
  prompt:
    es: "De acuerdo con el artículo 122.1 del Real Decreto-ley 6/2023, de 19 de diciembre, la carrera horizontal consiste en el reconocimiento del desarrollo profesional del personal funcionario de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante su progresión en un sistema de tramos, sin necesidad de cambiar de puesto de trabajo."
  - id: b
    text:
      es: "Mediante su ascenso en la estructura de puestos de trabajo por los procedimientos de provisión previstos."
  - id: c
    text:
      es: "Mediante su acceso a Cuerpos o Escalas de un Subgrupo superior por promoción interna."
  - id: d
    text:
      es: "Mediante su progresión en un sistema de tramos, que exige ocupar un puesto de nivel superior."
  explanation:
    es: "El artículo 122.1 define la carrera horizontal como el reconocimiento del desarrollo profesional «mediante su progresión a través del ascenso en un sistema de tramos […] sin necesidad de cambiar de puesto de trabajo». El ascenso por los procedimientos de provisión y el acceso a un Subgrupo superior por promoción interna son otras figuras. Exigir un puesto de nivel superior contradice el «sin necesidad de cambiar de puesto»."
  citation: "art. 122.1 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-70
- id: m01-l07-q0322
  prompt:
    es: "De acuerdo con el artículo 70.2 del Real Decreto 364/1995, de 10 de marzo, los funcionarios de carrera adquieren un grado personal por el desempeño de uno o más puestos del nivel correspondiente durante:"
  options:
  - id: a
    text:
      es: "Tres años continuados o cuatro con interrupción."
  - id: b
    text:
      es: "Dos años, sean continuados o con interrupción."
  - id: c
    text:
      es: "Un año continuado o dos con interrupción."
  - id: d
    correct: true
    text:
      es: "Dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 70.2 dice que el grado se adquiere «por el desempeño de uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción». Con interrupción hacen falta tres años, no dos. Las parejas de tres y cuatro años o de uno y dos años no están en el precepto."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1984-17387-art-21
- id: m01-l07-q0323
  prompt:
    es: "Según el artículo 21.1.d) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿cómo se adquiere el grado personal por el desempeño de puestos?"
  options:
  - id: a
    text:
      es: "Tomando posesión de un puesto del nivel correspondiente, sin exigir un tiempo mínimo de desempeño."
  - id: b
    text:
      es: "Prestando dos años de servicio activo en el Cuerpo o Escala, cualquiera que sea el nivel del puesto."
  - id: c
    text:
      es: "Desempeñando un único puesto del nivel correspondiente durante dos años continuados, sin cambiar de puesto."
  - id: d
    correct: true
    text:
      es: "Desempeñando uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 21.1.d) dice: «El grado personal se adquiere por el desempeño de uno o más puestos de nivel correspondiente durante dos años continuados o tres con interrupción». La toma de posesión sola no basta: hace falta tiempo de desempeño. Cuenta el nivel de los puestos, no el mero servicio en el Cuerpo. Pueden ser varios puestos del mismo nivel, no uno solo."
  citation: "art. 21.1.d) Ley 30/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2023-25758-dt-sexta
- id: m01-l07-q0328
  prompt:
    es: "De acuerdo con la disposición transitoria sexta del Real Decreto-ley 6/2023, de 19 de diciembre, hasta que se apruebe la normativa reglamentaria, el intervalo de niveles del Subgrupo C1 es:"
  options:
  - id: a
    text:
      es: "Del nivel 18 al nivel 24."
  - id: b
    text:
      es: "Del nivel 14 al nivel 18."
  - id: c
    text:
      es: "Del nivel 20 al nivel 26."
  - id: d
    correct: true
    text:
      es: "Del nivel 16 al nivel 22."
  explanation:
    es: "La disposición transitoria sexta fija para el Grupo C1 el nivel mínimo 16 y el máximo 22. Del 18 al 24 es el Grupo B. Del 14 al 18 es el C2. Del 20 al 26 es el A2."
  citation: "disposición transitoria sexta RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1995-8729-art-71
- id: m01-l07-q0332
  prompt:
    es: "¿Para cuáles de los siguientes grupos fija intervalos de niveles el artículo 71.1 del Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    correct: true
    text:
      es: "Para los Grupos A, B, C, D y E."
  - id: b
    text:
      es: "Para los Subgrupos A1, A2, C1 y C2 y el Grupo B."
  - id: c
    text:
      es: "Para los Grupos A, B y C, sin dividirlos en Subgrupos."
  - id: d
    text:
      es: "Para los Subgrupos A1 y A2 y los Grupos B y C."
  explanation:
    es: "El artículo 71.1 contiene una tabla con los Grupos A, B, C, D y E, la clasificación anterior al TREBEP. Los Subgrupos A1, A2, C1 y C2 y el Grupo B son los de la disposición transitoria sexta del Real Decreto-ley 6/2023. La tabla del artículo 71.1 no se queda en tres grupos ni mezcla Subgrupos con Grupos."
  citation: "art. 71.1 RD 364/1995"
  difficulty: 3
  tags:
  - "estructura"
