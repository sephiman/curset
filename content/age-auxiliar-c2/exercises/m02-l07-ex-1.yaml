# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q003
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de los diseños de iconos que enumera Microsoft muestra los archivos y carpetas con el mayor tamaño?"
  options:
  - id: a
    correct: true
    text:
      es: "Iconos extra grandes"
  - id: b
    text:
      es: "Iconos medianos"
  - id: c
    text:
      es: "Iconos pequeños"
  - id: d
    text:
      es: "Iconos grandes"
  explanation:
    es: "La página de Microsoft enumera los diseños «iconos extra grandes, iconos grandes, iconos medianos, iconos pequeños, detalles, iconos o contenido». De los diseños de iconos, el de mayor tamaño es el de iconos extra grandes; los grandes, los medianos y los pequeños van por debajo, en ese orden."
  citation: "fuente: `ms-win-explorador-lector.html`; «Navegar por el panel de contenido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q006
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones cambia el estilo de vista a iconos grandes?"
  options:
  - id: a
    text:
      es: "Ctrl+2"
  - id: b
    text:
      es: "Alt+Mayús+P"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+2"
  - id: d
    text:
      es: "Ctrl+Mayús+6"
  explanation:
    es: "Según la tabla de métodos abreviados, Ctrl+Mayús+Número cambia el estilo de vista, y «2 son iconos grandes y 6 son detalles». Ctrl+2, sin Mayús, se desplaza a la pestaña número 2; Ctrl+Mayús+6 pone la vista en detalles, y Alt+Mayús+P muestra u oculta el panel de detalles."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q008
  prompt:
    es: "En el Explorador de archivos de Windows 11, la combinación Ctrl+Signo más (+), que según Microsoft requiere el uso de un teclado numérico:"
  options:
  - id: a
    text:
      es: "Abre una pestaña nueva y cambia a ella de inmediato."
  - id: b
    correct: true
    text:
      es: "Cambia el tamaño de todas las columnas para ajustarse al texto."
  - id: c
    text:
      es: "Aumenta el tamaño y cambia la apariencia de los iconos."
  - id: d
    text:
      es: "Expande todas las carpetas del árbol del panel de navegación."
  explanation:
    es: "La tabla asigna a Ctrl+Signo más (+) «Cambiar el tamaño de todas las columnas para ajustarse al texto», con la nota de que requiere un teclado numérico. Cambiar el tamaño y la apariencia de los iconos es Ctrl + rueda del ratón; abrir una pestaña nueva es Ctrl+T, y expandir las carpetas del árbol es Ctrl+Mayús+E."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q009
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué contiene la barra de estado, situada en la parte inferior derecha de la ventana?"
  options:
  - id: a
    text:
      es: "Las pestañas abiertas y la opción de agregar una pestaña nueva"
  - id: b
    text:
      es: "Los botones Atrás, Adelante, Arriba y Actualizar de la ventana"
  - id: c
    text:
      es: "El acceso a las carpetas, unidades y bibliotecas"
  - id: d
    correct: true
    text:
      es: "Botones para cambiar la vista y el diseño del Explorador"
  explanation:
    es: "La página de Microsoft describe la barra de estado como el área de la parte inferior derecha que «contiene botones para cambiar la vista y el diseño del Explorador de archivos». Los botones Atrás, Adelante, Arriba y Actualizar están en la barra de herramientas; las pestañas, en la parte superior de la ventana, y el acceso a carpetas, unidades y bibliotecas es el panel de navegación."
  citation: "fuente: `ms-win-explorador-lector.html`; «Recorrer los elementos principales de la pantalla»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q010
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+Mayús+P, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Muestra u oculta el panel de vista previa"
  - id: b
    text:
      es: "Sube un nivel en la ruta de la carpeta"
  - id: c
    correct: true
    text:
      es: "Muestra u oculta el panel de detalles"
  - id: d
    text:
      es: "Muestra el menú contextual del elemento"
  explanation:
    es: "La tabla asigna a Alt+Mayús+P «Mostrar u ocultar el panel de detalles». El panel de vista previa se muestra u oculta con Alt+P, sin Mayús; el menú contextual del elemento seleccionado se abre con Mayús+F10, y Alt+Flecha arriba sube un nivel en la ruta de acceso de la carpeta."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q011
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ruta se sigue para ver las extensiones de nombre de archivo cuando no se muestran?"
  options:
  - id: a
    text:
      es: "Ver › Mostrar › Elementos ocultos"
  - id: b
    text:
      es: "Ver › Mostrar › Panel de navegación"
  - id: c
    text:
      es: "Mostrar más opciones › Enviar a › Carpeta comprimida (en zip)"
  - id: d
    correct: true
    text:
      es: "Ver › Mostrar › Extensiones de nombre de archivo"
  explanation:
    es: "La página de extensiones indica: «En el Explorador de archivos, seleccione Ver>mostrar>extensiones de nombre de archivo». En el mismo menú Ver › Mostrar, Elementos ocultos muestra los archivos y carpetas ocultos y Panel de navegación vuelve a mostrar el panel izquierdo. Mostrar más opciones › Enviar a › Carpeta comprimida (en zip) crea una carpeta comprimida con el archivo."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo comunes en Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q012
  prompt:
    es: "Señale la afirmación correcta sobre los archivos y carpetas ocultos en el Explorador de archivos de Windows 11:"
  options:
  - id: a
    text:
      es: "Se muestran seleccionando Ver › Mostrar › Panel de navegación."
  - id: b
    text:
      es: "Se muestran seleccionando Ver › Mostrar › Extensiones de nombre de archivo."
  - id: c
    text:
      es: "Se muestran seleccionando Mostrar más opciones › Enviar a."
  - id: d
    correct: true
    text:
      es: "Se muestran seleccionando Ver › Mostrar › Elementos ocultos."
  explanation:
    es: "La ayuda del Explorador indica que, para ver los archivos y carpetas ocultos, se selecciona Ver › Mostrar y después «Elementos ocultos» (la página imprime la ruta como «Ver>presentación»). Extensiones de nombre de archivo, en el mismo menú, muestra la parte del nombre tras el punto; Panel de navegación muestra el panel izquierdo, y Mostrar más opciones › Enviar a es la ruta del menú contextual que lleva a destinos como Carpeta comprimida (en zip)."
  citation: "fuente: `ms-win-explorador.html`; «Mostrar archivos ocultos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q013
  prompt:
    es: "En el Explorador de archivos de Windows 11, si se ha ocultado el panel de navegación izquierdo, ¿cómo se vuelve a mostrar?"
  options:
  - id: a
    correct: true
    text:
      es: "Seleccionando Ver › Mostrar › Panel de navegación"
  - id: b
    text:
      es: "Pulsando Alt+P en la ventana del Explorador"
  - id: c
    text:
      es: "Seleccionando Ver › Mostrar › Elementos ocultos"
  - id: d
    text:
      es: "Pulsando Ctrl+Mayús+E en la ventana del Explorador"
  explanation:
    es: "La ayuda del Explorador da estos pasos: «Seleccione Ver en la barra de comandos», después «Mostrar» y «Panel de navegación». Elementos ocultos, en el mismo menú, muestra los archivos y carpetas ocultos. Alt+P muestra u oculta el panel de vista previa, y Ctrl+Mayús+E expande las carpetas del árbol del panel de navegación, no lo vuelve a mostrar."
  citation: "fuente: `ms-win-explorador.html`; «Seleccione Mostrar y, a continuación, seleccione Panel de navegación.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q014
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué se consigue al activar las casillas de verificación de elementos desde el menú Ver?"
  options:
  - id: a
    text:
      es: "Ver los archivos y las carpetas que Windows tiene ocultos"
  - id: b
    text:
      es: "Ver la parte del nombre que indica el tipo de cada archivo"
  - id: c
    text:
      es: "Ver un panel con información adicional del elemento seleccionado"
  - id: d
    correct: true
    text:
      es: "Ver una casilla junto a cada archivo y carpeta para seleccionarlos"
  explanation:
    es: "La ayuda del Explorador dice que, al activar las casillas de verificación de elementos, se ve «una casilla junto a los archivos y carpetas para seleccionarlos». Ver la parte del nombre que indica el tipo es lo que hacen las extensiones de nombre de archivo; los archivos ocultos se ven con Elementos ocultos, y la información adicional del elemento la da el panel de detalles."
  citation: "fuente: `ms-win-explorador.html`; «Casillas Mostrar elemento»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q015
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre cambiar la extensión de nombre de un archivo en Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "No está permitido, porque Windows bloquea el cambio de cualquier extensión."
  - id: b
    correct: true
    text:
      es: "No convierte el archivo a otro formato ni cambia nada salvo el nombre."
  - id: c
    text:
      es: "Convierte el archivo solo si una aplicación instalada admite la extensión."
  - id: d
    text:
      es: "Convierte el archivo al formato que corresponde a la nueva extensión."
  explanation:
    es: "La página de extensiones dice: «Puedes cambiar una extensión de nombre de archivo, pero eso no convertirá el archivo a otro formato ni cambiará nada más, excepto el nombre de archivo». Por eso no hay conversión, ni siempre ni cuando una aplicación instalada admite la extensión, y el cambio sí está permitido."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo comunes en Windows»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q016
  prompt:
    es: "En Windows 11, ¿qué define la extensión que sigue al punto en el nombre de un archivo, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "El tipo de archivo de que se trata"
  - id: b
    text:
      es: "La carpeta en la que se guarda el archivo"
  - id: c
    text:
      es: "La fecha en que se creó el archivo"
  - id: d
    text:
      es: "El espacio que ocupa el archivo en el disco"
  explanation:
    es: "La página dice que el nombre de un archivo tiene dos partes separadas por un punto y que la extensión «define el tipo de archivo». La carpeta en la que se guarda no es parte del nombre: la extensión indica qué aplicación puede abrir el archivo y qué icono mostrar. La fecha de creación tampoco: la página no la liga al nombre, y los dos datos que sí liga a la extensión son la aplicación y el icono. El espacio que ocupa no está en la extensión: la página dice incluso que cambiarla no cambia nada más que el nombre del archivo."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo comunes en Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q019
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes extensiones corresponde a una plantilla de Microsoft Word?"
  options:
  - id: a
    correct: true
    text:
      es: "dotx"
  - id: b
    text:
      es: "docm"
  - id: c
    text:
      es: "docx"
  - id: d
    text:
      es: "xltx"
  explanation:
    es: "En la lista de Microsoft, dotx es «Plantilla de Microsoft Word». docm es el documento de Word habilitado para macros, docx el documento de Word y xltx la plantilla de Excel posterior a Excel 2007."
  citation: "fuente: `ms-win-extensiones.html`; «dotx — Plantilla de Microsoft Word»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q020
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿qué formato indica la extensión accdb?"
  options:
  - id: a
    text:
      es: "Archivo de solo ejecución de Microsoft Access"
  - id: b
    text:
      es: "Plantilla de base de datos de Microsoft Access"
  - id: c
    correct: true
    text:
      es: "Archivo de base de datos de Microsoft Access"
  - id: d
    text:
      es: "Base de datos de tiempo de ejecución de Microsoft Access"
  explanation:
    es: "La lista de Microsoft da para accdb «Archivo de base de datos de Microsoft Access». El archivo de solo ejecución es accde, la plantilla de base de datos es accdt y la base de datos de tiempo de ejecución es accdr."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q021
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes corresponde a un documento de Microsoft Word habilitado para macros?"
  options:
  - id: a
    text:
      es: "docx"
  - id: b
    text:
      es: "xlsm"
  - id: c
    text:
      es: "dotx"
  - id: d
    correct: true
    text:
      es: "docm"
  explanation:
    es: "En la lista de Microsoft, docm es «Documento habilitado para macros de Microsoft Word». dotx es la plantilla de Word, docx el documento de Word sin macros y xlsm la hoja de cálculo de Excel habilitada para macros."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q022
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes corresponde a una hoja de cálculo de Microsoft Excel anterior a Excel 2007?"
  options:
  - id: a
    correct: true
    text:
      es: "xls"
  - id: b
    text:
      es: "xltx"
  - id: c
    text:
      es: "xlsx"
  - id: d
    text:
      es: "xlsm"
  explanation:
    es: "En la lista de Microsoft, xls es «Hoja de cálculo de Microsoft Excel antes de Excel 2007». xlsx es la hoja de cálculo posterior a Excel 2007, xlsm la habilitada para macros y xltx la plantilla de Excel."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q023
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes corresponde a una base de datos de Microsoft Access anterior a Access 2007?"
  options:
  - id: a
    correct: true
    text:
      es: "mdb"
  - id: b
    text:
      es: "accde"
  - id: c
    text:
      es: "accdt"
  - id: d
    text:
      es: "accdb"
  explanation:
    es: "En la lista de Microsoft, mdb es «Base de datos de Microsoft Access antes de Access 2007». accdb es el archivo de base de datos de Access actual, accde el de solo ejecución y accdt la plantilla de base de datos."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
