# anchor: fuente-ms-excel-funcion-extrae-html
- id: m06-l05-q238
  prompt:
    es: "En Excel 365, A1 contiene Hoja de cálculo. ¿Qué muestra la celda con =EXTRAE(A1; 9; 7)?"
  options:
  - id: a
    text:
      es: "álculo"
  - id: b
    text:
      es: " cálcul"
  - id: c
    text:
      es: "Hoja de"
  - id: d
    correct: true
    text:
      es: "cálculo"
  explanation:
    es: "EXTRAE devuelve 7 caracteres comenzando por la posición 9, y el primer carácter del texto es la posición 1: en Hoja de cálculo la posición 9 es el carácter c de cálculo. Empezar en la 10 daría álculo, en la 8 un espacio antes, y Hoja de serían los 7 primeros caracteres."
  citation: "fuente: `ms-excel-funcion-extrae.html`; «Ejemplo»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-extrae-html
- id: m06-l05-q239
  prompt:
    es: "En Excel 365, A1 contiene Excel y B1 contiene =EXTRAE(A1; 20; 3). ¿Qué muestra B1?"
  options:
  - id: a
    correct: true
    text:
      es: "Texto vacío"
  - id: b
    text:
      es: "Excel"
  - id: c
    text:
      es: "cel"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "Si posición_inicial es mayor que la longitud del texto, EXTRAE devuelve texto vacío (\"\"). La posición 20 supera los 5 caracteres de Excel, por lo que no devuelve el texto, sus últimos caracteres ni un error."
  citation: "fuente: `ms-excel-funcion-extrae.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-extrae-html
- id: m06-l05-q240
  prompt:
    es: "En Excel 365, A1 contiene Presupuesto anual y B1 contiene =EXTRAE(A1; 13; 20). ¿Qué muestra B1?"
  options:
  - id: a
    text:
      es: "anual seguido de espacios hasta completar 20 caracteres"
  - id: b
    correct: true
    text:
      es: "anual"
  - id: c
    text:
      es: "Texto vacío"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "La posición 13 es el carácter a de anual, y como la posición inicial más los 20 caracteres excede la longitud del texto, EXTRAE devuelve los caracteres hasta el final. Según el ejemplo de la página, no se agregan espacios al final."
  citation: "fuente: `ms-excel-funcion-extrae.html`; «Sintaxis»"
