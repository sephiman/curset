# anchor: boe-a-2007-6239-art-14
- id: m02-l01-q080
  prompt:
    es: "En la formación del personal de la Administración General del Estado que presta servicios de atención al ciudadano se atenderá especialmente, según el Real Decreto 366/2007, de 16 de marzo, al conocimiento de:"
  options:
  - id: a
    text:
      es: "Las distintas lenguas oficiales y su uso en los servicios."
  - id: b
    correct: true
    text:
      es: "Las distintas discapacidades y sus consecuencias en el desarrollo de los servicios."
  - id: c
    text:
      es: "Las distintas normas de accesibilidad y su régimen sancionador."
  - id: d
    text:
      es: "Los distintos procedimientos y sus plazos de resolución."
  explanation:
    es: "El artículo 14.2 pone el acento en conocer las distintas discapacidades y sus consecuencias en el desarrollo de los servicios de atención. Las lenguas oficiales, el régimen sancionador y los plazos de resolución no son el contenido que cita."
  citation: "art. 14.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-14
- id: m02-l01-q081
  prompt:
    es: "La formación del personal que presta servicios de atención al ciudadano incluye, según el Real Decreto 366/2007, de 16 de marzo, el uso de medios auxiliares:"
  options:
  - id: a
    correct: true
    text:
      es: "Facilitadores del trato con las personas con discapacidad."
  - id: b
    text:
      es: "Sustitutivos de la atención presencial a estas personas."
  - id: c
    text:
      es: "Obligatorios para toda la plantilla de la Oficina."
  - id: d
    text:
      es: "Homologados por la Secretaría General para la Administración Pública."
  explanation:
    es: "El artículo 14.2 se refiere a medios auxiliares facilitadores del trato e interacción con las personas con discapacidad. No sustituyen la atención presencial, no se declaran obligatorios para toda la plantilla y no se menciona que los homologue la Secretaría General."
  citation: "art. 14.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
