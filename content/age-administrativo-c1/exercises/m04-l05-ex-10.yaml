# anchor: boe-a-1995-8729-art-64
- id: m04-l05-q262
  prompt:
    es: "Según el artículo 64.1 del Real Decreto 364/1995, de 10 de marzo, además de que el puesto esté vacante, ¿qué se exige para cubrirlo en comisión de servicios de carácter voluntario?"
  options:
  - id: a
    text:
      es: "Un concurso declarado desierto y un funcionario destinado en el mismo Departamento."
  - id: b
    text:
      es: "Un Plan de Empleo aprobado y un funcionario cuyo puesto haya quedado suprimido por él."
  - id: c
    correct: true
    text:
      es: "Una urgente e inaplazable necesidad y un funcionario que reúna los requisitos del puesto."
  - id: d
    text:
      es: "Un informe del servicio médico oficial y un puesto de nivel no superior al de origen."
  explanation:
    es: "El artículo 64.1 permite cubrir el puesto vacante «en caso de urgente e inaplazable necesidad, en comisión de servicios de carácter voluntario, con un funcionario que reúna los requisitos establecidos para su desempeño en la relación de puestos de trabajo». El concurso desierto y el funcionario del mismo Departamento son los presupuestos de la comisión de servicios forzosa (artículo 64.2). El Plan de Empleo y la supresión del puesto llevan a la reasignación de efectivos (artículo 60.1). El informe del servicio médico oficial y el puesto de nivel no superior corresponden a la movilidad por razones de salud (artículo 66 bis)."
  citation: "art. 64.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1995-8729-art-64
- id: m04-l05-q263
  prompt:
    es: "De acuerdo con el artículo 64.3 del Real Decreto 364/1995, de 10 de marzo, la comisión de servicios, cuya duración máxima es de un año, puede prorrogarse por otro:"
  options:
  - id: a
    correct: true
    text:
      es: "en caso de no haberse cubierto el puesto con carácter definitivo."
  - id: b
    text:
      es: "en caso de que el funcionario lo solicite antes de su vencimiento."
  - id: c
    text:
      es: "en caso de que el órgano que la acordó aprecie nuevas necesidades."
  - id: d
    text:
      es: "en caso de que el funcionario haya consolidado el grado del puesto."
  explanation:
    es: "El artículo 64.3 dice que las comisiones de servicios «tendrán una duración máxima de un año prorrogable por otro en caso de no haberse cubierto el puesto con carácter definitivo». La única condición de la prórroga es que el puesto siga sin cubrirse con carácter definitivo. El artículo no la hace depender de una solicitud del funcionario, de nuevas necesidades apreciadas por el órgano que acordó la comisión ni del grado que el funcionario haya consolidado."
  citation: "art. 64.3 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-1995-8729-art-64
- id: m04-l05-q264
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuándo puede destinarse con carácter forzoso a un funcionario en comisión de servicios?"
  options:
  - id: a
    text:
      es: "Cuando el puesto quede vacante y ningún funcionario solicite la comisión voluntaria."
  - id: b
    text:
      es: "Cuando el puesto del funcionario se suprima como consecuencia de un Plan de Empleo."
  - id: c
    text:
      es: "Cuando el funcionario haya sido removido del puesto que había obtenido por concurso de méritos."
  - id: d
    correct: true
    text:
      es: "Cuando, celebrado concurso, la vacante se declare desierta y sea urgente su provisión."
  explanation:
    es: "El artículo 64.2 dispone que, «cuando, celebrado concurso para la provisión de una vacante, ésta se declare desierta y sea urgente para el servicio su provisión», podrá destinarse con carácter forzoso a un funcionario. No basta que nadie pida la comisión voluntaria: hace falta un concurso celebrado y declarado desierto. La supresión del puesto por un Plan de Empleo lleva a la reasignación de efectivos (artículo 60.1), y la remoción del puesto obtenido por concurso lleva a la adscripción provisional (artículo 63)."
  citation: "art. 64.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1995-8729-art-64
- id: m04-l05-q265
  prompt:
    es: "Según el artículo 64.2 del Real Decreto 364/1995, de 10 de marzo, en la comisión de servicios forzosa, ¿a qué funcionario se destina cuando los posibles candidatos están en igualdad de condiciones?"
  options:
  - id: a
    text:
      es: "Al funcionario de mayor antigüedad."
  - id: b
    correct: true
    text:
      es: "Al funcionario de menor antigüedad."
  - id: c
    text:
      es: "Al funcionario de grado personal más bajo."
  - id: d
    text:
      es: "Al funcionario con más cargas familiares."
  explanation:
    es: "El artículo 64.2 destina al funcionario «que preste servicios en el mismo Departamento […] en el municipio más próximo o con mejores facilidades de desplazamiento y que tenga menores cargas familiares y, en igualdad de condiciones, al de menor antigüedad». El desempate es la menor antigüedad, no la mayor. El grado personal no figura entre los criterios. Las cargas familiares sí cuentan, pero a favor de quien tiene menos, no de quien tiene más."
  citation: "art. 64.2 RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-63
- id: m04-l05-q266
  prompt:
    es: "De acuerdo con el artículo 63 del Real Decreto 364/1995, de 10 de marzo, los puestos de trabajo pueden proveerse por adscripción provisional en el supuesto de:"
  options:
  - id: a
    correct: true
    text:
      es: "reingreso al servicio activo de un funcionario sin reserva de puesto de trabajo."
  - id: b
    text:
      es: "vacante no cubierta en el concurso convocado para su provisión definitiva."
  - id: c
    text:
      es: "solicitud del funcionario por motivos de salud o de rehabilitación propios."
  - id: d
    text:
      es: "aumento temporal de las tareas de una unidad que sus titulares no puedan atender a tiempo."
  explanation:
    es: "El artículo 63 admite la adscripción provisional «únicamente» en tres supuestos: la remoción o el cese en un puesto obtenido por concurso o libre designación, la supresión del puesto y el «reingreso al servicio activo de los funcionarios sin reserva de puesto de trabajo». La vacante que el concurso deja sin cubrir se cubre, si es urgente, por comisión de servicios forzosa (artículo 64.2). Los motivos de salud o de rehabilitación llevan a la movilidad del artículo 66 bis. El aumento temporal de tareas no es ninguno de los tres supuestos del artículo 63."
  citation: "art. 63 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-1995-8729-art-72
- id: m04-l05-q267
  prompt:
    es: "Según el artículo 72.2 del Real Decreto 364/1995, de 10 de marzo, los puestos cubiertos mediante adscripción provisional:"
  options:
  - id: a
    text:
      es: "se convocan para su cobertura definitiva, y quien los desempeña no puede participar en la convocatoria."
  - id: b
    text:
      es: "pasan a ser destino definitivo de quien los desempeña cuando cumple un año en ellos."
  - id: c
    correct: true
    text:
      es: "se convocan para su cobertura definitiva, y quien los desempeña debe participar en la convocatoria."
  - id: d
    text:
      es: "se mantienen hasta que quien los desempeña obtiene otro destino por concurso."
  explanation:
    es: "El artículo 72.2 dice que «los puestos cubiertos mediante adscripción provisional se convocarán para su cobertura con carácter definitivo» y que los funcionarios que los desempeñen «tendrán la obligación de participar en las correspondientes convocatorias». Participar es una obligación, no algo prohibido. La adscripción provisional no se convierte en destino definitivo por el paso del tiempo, y el puesto no espera a que su ocupante obtenga otro destino, porque se convoca."
  citation: "art. 72.2 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-1995-8729-art-59
- id: m04-l05-q268
  prompt:
    es: "Conforme al artículo 59.1 del Real Decreto 364/1995, de 10 de marzo, el funcionario que ocupa con carácter definitivo un puesto no singularizado puede ser adscrito por redistribución de efectivos a otro puesto:"
  options:
  - id: a
    text:
      es: "de la misma naturaleza y nivel de complemento de destino, aunque suponga un cambio de municipio."
  - id: b
    correct: true
    text:
      es: "de la misma naturaleza, nivel de complemento de destino y complemento específico, sin cambio de municipio."
  - id: c
    text:
      es: "de cualquier naturaleza o nivel, siempre que para su provisión esté previsto el mismo procedimiento."
  - id: d
    text:
      es: "de nivel de complemento de destino superior en no más de dos niveles, y sin cambio de municipio alguno."
  explanation:
    es: "El artículo 59.1 permite adscribir a esos funcionarios «a otros de la misma naturaleza, nivel de complemento de destino y complemento específico, siempre que para la provisión de los referidos puestos esté previsto el mismo procedimiento y sin que ello suponga cambio de municipio». La redistribución nunca implica cambio de municipio. El mismo procedimiento de provisión es un requisito más, que no sustituye a la misma naturaleza. El nivel tiene que ser el mismo, no uno superior."
  citation: "art. 59.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-59
- id: m04-l05-q269
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿con qué carácter se ocupa el puesto de trabajo al que se accede por redistribución de efectivos?"
  options:
  - id: a
    text:
      es: "Con carácter provisional, hasta que el puesto se convoque a concurso."
  - id: b
    text:
      es: "Con carácter provisional, por un año prorrogable por otro año más."
  - id: c
    text:
      es: "Con carácter definitivo, pero solo tras dos años de permanencia."
  - id: d
    correct: true
    text:
      es: "Con carácter definitivo, igual que el puesto que se desempeñaba."
  explanation:
    es: "El artículo 59.1 dice que «el puesto de trabajo al que se acceda a través de la redistribución de efectivos tendrá asimismo carácter definitivo». El carácter definitivo es inmediato, no espera a dos años de permanencia. La provisionalidad hasta la convocatoria es propia de la adscripción provisional (artículo 72.2). El año prorrogable por otro es la duración de la comisión de servicios (artículo 64.3)."
  citation: "art. 59.1 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-1995-8729-art-60
- id: m04-l05-q270
  prompt:
    es: "De acuerdo con el artículo 60.3 del Real Decreto 364/1995, de 10 de marzo, en la primera fase de la reasignación de efectivos, el funcionario puede ser reasignado en su Departamento en el plazo máximo de:"
  options:
  - id: a
    text:
      es: "tres meses desde la supresión del puesto de trabajo."
  - id: b
    correct: true
    text:
      es: "seis meses desde la supresión del puesto de trabajo."
  - id: c
    text:
      es: "seis meses desde la aprobación del Plan de Empleo."
  - id: d
    text:
      es: "un año desde la aprobación del Plan de Empleo."
  explanation:
    es: "Según el artículo 60.3, en la fase 1.ª, «en el plazo máximo de seis meses desde la supresión del puesto de trabajo», el funcionario puede ser reasignado en el ámbito del mismo Departamento. Tres meses es el plazo de la fase 2.ª, para un puesto en otro Departamento. El plazo se cuenta desde la supresión del puesto, no desde la aprobación del Plan de Empleo, y no llega al año."
  citation: "art. 60.3 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-60
- id: m04-l05-q271
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál es la situación del funcionario que no obtiene puesto en las dos primeras fases de la reasignación de efectivos?"
  options:
  - id: a
    correct: true
    text:
      es: "La situación administrativa de expectativa de destino."
  - id: b
    text:
      es: "La situación administrativa de excedencia forzosa."
  - id: c
    text:
      es: "La situación administrativa de servicios especiales."
  - id: d
    text:
      es: "La de servicio activo, con un puesto en adscripción provisional."
  explanation:
    es: "El artículo 60.3, fase 3.ª, dice que los funcionarios que tras las fases anteriores no hayan obtenido un puesto «serán adscritos […] a través de relaciones específicas de puestos en reasignación, siendo declarados en la situación administrativa de expectativa de destino». No pasan a excedencia forzosa ni a servicios especiales. Tampoco siguen en servicio activo con adscripción provisional: el mismo apartado dice que su reasignación posterior «conllevará el reingreso al servicio activo»."
  citation: "art. 60.3 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-66-bis
- id: m04-l05-q272
  prompt:
    es: "Según el artículo 66 bis del Real Decreto 364/1995, de 10 de marzo, la movilidad por razones de salud o de rehabilitación puede pedirse por motivos del propio funcionario o de:"
  options:
  - id: a
    text:
      es: "sus parientes hasta el segundo grado."
  - id: b
    text:
      es: "cualquier persona que conviva con él."
  - id: c
    correct: true
    text:
      es: "su cónyuge o los hijos a su cargo."
  - id: d
    text:
      es: "sus padres, si dependen de su cuidado."
  explanation:
    es: "El artículo 66 bis.1 exige una «solicitud basada en motivos de salud o rehabilitación del funcionario, su cónyuge, o los hijos a su cargo», con informe previo del servicio médico oficial. No incluye a los parientes hasta el segundo grado, a otros convivientes ni a los padres: esos círculos de personas aparecen en otros derechos, como los permisos del artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público, pero no en esta movilidad."
  citation: "art. 66 bis RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-66-bis
- id: m04-l05-q273
  prompt:
    es: "En la movilidad por razones de salud o de rehabilitación del funcionario de la Administración General del Estado, el puesto de destino debe estar vacante, dotado presupuestariamente, ser de necesaria provisión y tener:"
  options:
  - id: a
    text:
      es: "complementos de destino y específico exactamente iguales a los del puesto de origen."
  - id: b
    text:
      es: "un nivel de complemento de destino no inferior al de su grado personal."
  - id: c
    text:
      es: "complementos no superiores en más de dos niveles a los del puesto de origen."
  - id: d
    correct: true
    text:
      es: "complementos de destino y específico no superiores a los del puesto de origen."
  explanation:
    es: "El artículo 66 bis.2 del Real Decreto 364/1995 condiciona la adscripción a que exista un puesto vacante, dotado presupuestariamente, «cuyo nivel de complemento de destino y específico no sea superior al del puesto de origen, y que sea de necesaria provisión». Basta con que no sean superiores: no se exige que sean iguales. El grado personal no es el límite que fija el artículo. Tampoco se admite un puesto hasta dos niveles por encima: el límite es el nivel del puesto de origen."
  citation: "art. 66 bis RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-66-ter
- id: m04-l05-q274
  prompt:
    es: "Según el artículo 66 ter del Real Decreto 364/1995, de 10 de marzo, ¿en qué plazo deben producirse el cese y la toma de posesión de la funcionaria víctima de violencia de género que obtiene el traslado?"
  options:
  - id: a
    correct: true
    text:
      es: "En tres días hábiles sin cambio de residencia, o en un mes con cambio de residencia."
  - id: b
    text:
      es: "En tres días hábiles sin cambio de residencia, o en ocho días con cambio de residencia."
  - id: c
    text:
      es: "En ocho días hábiles sin cambio de residencia, o en un mes con cambio de residencia."
  - id: d
    text:
      es: "En tres días hábiles sin cambio de residencia, o en dos meses con cambio de residencia."
  explanation:
    es: "El artículo 66 ter.2 dice que el cese y la toma de posesión «deberán producirse en el plazo de tres días hábiles si no implica cambio de residencia de la funcionaria, o de un mes si comporta cambio de residencia». Los ocho días son el plazo de la comisión de servicios voluntaria con cambio de residencia (artículo 64.4), no el de este traslado. Sin cambio de residencia el plazo es de tres días hábiles, no de ocho, y con cambio de residencia es de un mes, no de dos."
  citation: "art. 66 ter RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-82
- id: m04-l05-q275
  prompt:
    es: "De acuerdo con el artículo 82.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las funcionarias víctimas de violencia de género o sexual tienen derecho al traslado si se ven obligadas a dejar su puesto:"
  options:
  - id: a
    text:
      es: "para atender el cuidado directo de hijos o de familiares a su cargo."
  - id: b
    correct: true
    text:
      es: "para hacer efectiva su protección o el derecho a la asistencia social integral."
  - id: c
    text:
      es: "por motivos de salud o rehabilitación acreditados por el servicio médico."
  - id: d
    text:
      es: "para acompañar a su cónyuge, destinado de forma definitiva en otra localidad."
  explanation:
    es: "El artículo 82.1 reconoce el derecho al traslado a las mujeres víctimas de violencia de género o de violencia sexual que se vean obligadas a abandonar su puesto «para hacer efectiva su protección o el derecho a la asistencia social integral». El cuidado de hijos o familiares no es la finalidad de este traslado. Los motivos de salud o rehabilitación con informe médico son los de la movilidad del artículo 66 bis del Real Decreto 364/1995. El destino del cónyuge en otra localidad tampoco es la causa que fija el artículo."
  citation: "art. 82.1 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q276
  prompt:
    es: "Un funcionario con jornada de lunes a viernes inicia el jueves 4 de marzo de 2027 el permiso por el fallecimiento de su hermana, familiar de segundo grado, en su misma localidad. Sin festivos en el periodo, ¿cuál es el último día del permiso?"
  options:
  - id: a
    text:
      es: "El lunes 8 de marzo de 2027."
  - id: b
    text:
      es: "El martes 9 de marzo de 2027."
  - id: c
    text:
      es: "El miércoles 10 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes 5 de marzo de 2027."
  explanation:
    es: "El fallecimiento de un familiar de segundo grado en la misma localidad da «dos días hábiles» (artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público). Cuentan el jueves 4 y el viernes 5 de marzo. El sábado 6 y el domingo 7 no son hábiles. El lunes 8 corresponde a tres días hábiles, que es el fallecimiento de primer grado en la misma localidad. El martes 9, a cuatro, que es el de segundo grado en distinta localidad. El miércoles 10, a cinco, que es el de primer grado en distinta localidad."
  citation: "art. 48.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q277
  prompt:
    es: "Según el artículo 48.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, los funcionarios tienen permiso para realizar funciones sindicales o de representación del personal:"
  options:
  - id: a
    text:
      es: "por seis días al año como máximo."
  - id: b
    text:
      es: "durante los días de las elecciones."
  - id: c
    correct: true
    text:
      es: "en los términos que se determine."
  - id: d
    text:
      es: "por un día al mes, sin descuento."
  explanation:
    es: "El artículo 48.c) concede el permiso «para realizar funciones sindicales o de representación del personal, en los términos que se determine». El artículo no fija ninguna duración. Los seis días al año son los de asuntos particulares (artículo 48.k). El artículo no limita el permiso a los días de elecciones ni a un día al mes."
  citation: "art. 48.c) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q278
  prompt:
    es: "Según el artículo 48.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿para qué tiene permiso, por el tiempo indispensable, el funcionario en un procedimiento de adopción, acogimiento o guarda con fines de adopción?"
  options:
  - id: a
    text:
      es: "Para las visitas de seguimiento del menor durante el primer año posterior a la constitución de la adopción."
  - id: b
    correct: true
    text:
      es: "Para las preceptivas sesiones de información y preparación y los informes previos a la declaración de idoneidad."
  - id: c
    text:
      es: "Para todas las gestiones notariales y registrales que exija la constitución de la adopción o del acogimiento familiar."
  - id: d
    text:
      es: "Para las sesiones de información y preparación, aunque se realicen fuera de su jornada de trabajo."
  explanation:
    es: "El artículo 48.e) concede el permiso, en los casos de adopción, acogimiento o guarda con fines de adopción, «para la asistencia a las preceptivas sesiones de información y preparación y para la realización de los preceptivos informes psicológicos y sociales previos a la declaración de idoneidad, que deban realizarse dentro de la jornada de trabajo». No cubre las visitas de seguimiento posteriores a la adopción ni las gestiones notariales y registrales. Si las sesiones se hacen fuera de la jornada, no hay permiso."
  citation: "art. 48.e) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m04-l05-q279
  prompt:
    es: "De acuerdo con el artículo 48.j) del texto refundido de la Ley del Estatuto Básico del Empleado Público, hay permiso por el tiempo indispensable para cumplir un deber inexcusable de carácter público o personal y:"
  options:
  - id: a
    correct: true
    text:
      es: "por deberes relacionados con la conciliación de la vida familiar y laboral."
  - id: b
    text:
      es: "por la asistencia a cursos de formación que se celebren fuera de la jornada."
  - id: c
    text:
      es: "por el traslado de domicilio del funcionario sin cambio de residencia."
  - id: d
    text:
      es: "por el cuidado directo de un familiar de segundo grado que no pueda valerse."
  explanation:
    es: "El artículo 48.j) concede el permiso «por tiempo indispensable para el cumplimiento de un deber inexcusable de carácter público o personal y por deberes relacionados con la conciliación de la vida familiar y laboral». El artículo 48 abre con «los siguientes permisos» y los cierra en la letra m): enfermedad o fallecimiento de familiares (a), traslado de domicilio (b), funciones sindicales (c), exámenes finales (d), exámenes prenatales y preparación al parto (e), lactancia (f), hijos prematuros hospitalizados (g), guarda legal (h), cuidado de un familiar de primer grado con enfermedad muy grave (i), deber inexcusable y conciliación (j), asuntos particulares (k), matrimonio o pareja de hecho (l) y actos preparatorios de la donación de órganos (m). Ninguno de los trece es asistir a cursos de formación fuera de la jornada. El traslado de domicilio sin cambio de residencia tiene su propio permiso de un día en la letra b). El cuidado directo de un familiar hasta el segundo grado que no pueda valerse por sí mismo da, en la letra h), derecho a reducir la jornada con la disminución de retribuciones que corresponda, no el permiso de la letra j)."
  citation: "art. 48.j) TREBEP"
  difficulty: 2
