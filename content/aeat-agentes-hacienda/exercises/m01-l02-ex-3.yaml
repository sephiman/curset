# anchor: boe-a-1978-31229-art-79
- id: m01-l02-q0125
  prompt:
    es: "De acuerdo con el artículo 79 de la Constitución Española de 1978, para adoptar acuerdos, las Cámaras deben estar reunidas reglamentariamente y con asistencia de:"
  options:
  - id: a
    text:
      es: "Un tercio de sus miembros."
  - id: b
    text:
      es: "Las tres quintas partes de sus miembros."
  - id: c
    correct: true
    text:
      es: "La mayoría de sus miembros."
  - id: d
    text:
      es: "La cuarta parte de sus miembros."
  explanation:
    es: "El artículo 79.1 exige que las Cámaras estén reunidas reglamentariamente «y con asistencia de la mayoría de sus miembros». Un tercio y la cuarta parte no alcanzan ese quórum. Las tres quintas partes no son lo que pide el precepto."
  citation: "art. 79.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-80
- id: m01-l02-q0127
  prompt:
    es: "De acuerdo con el artículo 80 de la Constitución Española de 1978, las sesiones plenarias de las Cámaras serán públicas:"
  options:
  - id: a
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría de tres quintos."
  - id: b
    correct: true
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento."
  - id: c
    text:
      es: "En todo caso, sin excepción alguna."
  - id: d
    text:
      es: "Salvo acuerdo en contrario de la Mesa, adoptado con arreglo al Reglamento."
  explanation:
    es: "El artículo 80 dice que las sesiones plenarias serán públicas, «salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento». La mayoría no es de tres quintos. Sí hay excepción, y el acuerdo es de la Cámara, no de la Mesa."
  citation: "art. 80 CE"
  difficulty: 2
  tags:
  - "excepción"
  - "mayoría"
# anchor: boe-a-1994-10830-art-93
- id: m01-l02-q0128
  prompt:
    es: "De acuerdo con el artículo 93 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, salvo las mayorías especiales, los acuerdos se adoptarán por:"
  options:
  - id: a
    text:
      es: "La mayoría absoluta de Senadores, siempre que esté presente la mitad más uno de los miembros del órgano."
  - id: b
    correct: true
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano."
  - id: c
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté un tercio de los miembros del órgano."
  - id: d
    text:
      es: "La mayoría simple de Senadores presentes, sin exigencia de quórum de asistencia."
  explanation:
    es: "El artículo 93.1 del Reglamento del Senado dice que los acuerdos se adoptan «por la mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano de que se trate». La regla general no es la mayoría absoluta. El quórum es la mitad más uno, no un tercio, y sí se exige."
  citation: "art. 93.1 Reglamento del Senado"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-117
- id: m01-l02-q0130
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Jueces y Magistrados integrantes del poder judicial es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Son independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley."
  - id: b
    text:
      es: "Son independientes, inamovibles, inviolables y sometidos únicamente al imperio de la ley."
  - id: c
    text:
      es: "Pueden ser trasladados o jubilados por acuerdo del Gobierno, oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Pueden pertenecer a partidos políticos mientras se hallen en activo, pero no a sindicatos."
  explanation:
    es: "El artículo 117.1 CE dice que los Jueces y Magistrados son «independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley». Una opción cambia «responsables» por «inviolables», que es la nota que el artículo 56.3 CE da a la persona del Rey. La del traslado «por acuerdo del Gobierno» contradice el artículo 117.2 CE: solo pueden ser trasladados o jubilados por las causas y con las garantías previstas en la ley. La que admite partidos «pero no sindicatos» contradice el artículo 127.1 CE, que les prohíbe pertenecer a partidos políticos y también a sindicatos."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-121
- id: m01-l02-q0137
  prompt:
    es: "¿A cargo de quién corre, según la Constitución Española de 1978, la indemnización de los daños causados por error judicial?"
  options:
  - id: a
    text:
      es: "A cargo del Juez o Magistrado que haya causado el daño."
  - id: b
    text:
      es: "A cargo del Consejo General del Poder Judicial, con cargo a su presupuesto."
  - id: c
    correct: true
    text:
      es: "A cargo del Estado, conforme a la ley."
  - id: d
    text:
      es: "A cargo de la Comunidad Autónoma con competencias asumidas en materia de Justicia."
  explanation:
    es: "El artículo 121 CE dice que los daños causados por error judicial y los debidos al funcionamiento anormal de la Administración de Justicia «darán derecho a una indemnización a cargo del Estado, conforme a la ley». No la paga el juez, ni el Consejo General del Poder Judicial, ni la Comunidad Autónoma."
  citation: "art. 121 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-124
- id: m01-l02-q0139
  prompt:
    es: "De acuerdo con el artículo 124 de la Constitución Española de 1978, el Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno:"
  options:
  - id: a
    text:
      es: "Previo informe favorable del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "Oído el Pleno del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Previa aprobación del Congreso de los Diputados por mayoría absoluta."
  explanation:
    es: "El artículo 124.4 dice: «El Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial». Un informe favorable es un requisito más fuerte que ser «oído»: el Gobierno tendría que atenerse a él. El órgano oído es el Consejo General del Poder Judicial, no el Pleno del Consejo de Estado. La cadena que describe el artículo es Rey, Gobierno y Consejo oído, sin ninguna aprobación del Congreso por mayoría absoluta."
  citation: "art. 124.4 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-118
- id: m01-l02-q0143
  prompt:
    es: "Según la Constitución Española de 1978, todos están obligados, en relación con las decisiones de los Jueces y Tribunales, a cumplir:"
  options:
  - id: a
    text:
      es: "Las sentencias desde que se dictan, aunque no sean firmes."
  - id: b
    text:
      es: "Solo las sentencias firmes del Tribunal Supremo y del Tribunal Constitucional."
  - id: c
    correct: true
    text:
      es: "Las sentencias y demás resoluciones firmes de los Jueces y Tribunales."
  - id: d
    text:
      es: "Las resoluciones de los Jueces y Tribunales cuando el Ministerio Fiscal lo solicite."
  explanation:
    es: "El artículo 118 obliga a cumplir «las sentencias y demás resoluciones firmes de los Jueces y Tribunales». No basta con que se hayan dictado: han de ser firmes. Tampoco se limita a las sentencias de los dos Tribunales superiores, ni depende de que el Ministerio Fiscal lo pida."
  citation: "art. 118 CE"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1978-31229-art-119
- id: m01-l02-q0144
  prompt:
    es: "Según la Constitución Española de 1978, la justicia será gratuita cuando así lo disponga la ley y, en todo caso, respecto de:"
  options:
  - id: a
    text:
      es: "Quienes ejerzan la acción popular en un proceso penal."
  - id: b
    text:
      es: "Quienes litiguen contra la Administración del Estado."
  - id: c
    text:
      es: "Quienes sean beneficiarios de una pensión pública."
  - id: d
    correct: true
    text:
      es: "Quienes acrediten insuficiencia de recursos para litigar."
  explanation:
    es: "El artículo 119 garantiza la gratuidad «en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar». Ejercer la acción popular, litigar contra el Estado o cobrar una pensión no dan por sí solos derecho a ella."
  citation: "art. 119 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-120
- id: m01-l02-q0145
  prompt:
    es: "Según la Constitución Española de 1978, las actuaciones judiciales serán públicas como regla general, aunque admiten excepciones, que podrán prever:"
  options:
  - id: a
    text:
      es: "Un reglamento del Consejo."
  - id: b
    correct: true
    text:
      es: "Las leyes de procedimiento."
  - id: c
    text:
      es: "Los acuerdos de la Sala de Gobierno de cada Tribunal."
  - id: d
    text:
      es: "Las resoluciones motivadas de cada Juez."
  explanation:
    es: "El artículo 120.1 remite a «las leyes de procedimiento». Un reglamento del Consejo General del Poder Judicial, un acuerdo de la Sala de Gobierno o la resolución de un Juez no pueden fijar excepciones a la publicidad."
  citation: "art. 120.1 CE"
  difficulty: 1
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-125
- id: m01-l02-q0149
  prompt:
    es: "¿Cuál de las siguientes facultades pueden ejercer los ciudadanos, además de participar en la Administración de Justicia mediante el Jurado, según el artículo 125 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "La acción popular."
  - id: b
    text:
      es: "La acción de nulidad contra las leyes."
  - id: c
    text:
      es: "La iniciativa legislativa en materia judicial."
  - id: d
    text:
      es: "La potestad jurisdiccional en los procesos de menor cuantía."
  explanation:
    es: "El artículo 125 dice que los ciudadanos «podrán ejercer la acción popular». La nulidad de las leyes la decide el Tribunal Constitucional y no es una acción ciudadana. La iniciativa legislativa no figura en ese artículo y la potestad jurisdiccional corresponde en exclusiva a Juzgados y Tribunales (artículo 117.3)."
  citation: "art. 125 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-122
- id: m01-l02-q0150
  prompt:
    es: "Según la Constitución Española de 1978, la constitución, el funcionamiento y el gobierno de los Juzgados y Tribunales los determina:"
  options:
  - id: a
    text:
      es: "Un reglamento del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "La ley ordinaria que apruebe cada Comunidad Autónoma."
  - id: c
    correct: true
    text:
      es: "La ley orgánica del poder judicial."
  - id: d
    text:
      es: "Un real decreto del Gobierno."
  explanation:
    es: "El artículo 122.1 dice que «la ley orgánica del poder judicial determinará la constitución, funcionamiento y gobierno de los Juzgados y Tribunales». Ni un reglamento del Consejo, ni una ley autonómica, ni un real decreto pueden hacerlo."
  citation: "art. 122.1 CE"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-12666-art-26
- id: m01-l02-q0167
  prompt:
    es: "¿Cuál de los siguientes órganos NO figura entre los Tribunales a los que atribuye la potestad jurisdiccional el artículo 26 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Tribunales Superiores de Justicia."
  - id: b
    correct: true
    text:
      es: "El Tribunal Constitucional."
  - id: c
    text:
      es: "Los jueces y juezas de paz."
  - id: d
    text:
      es: "Las Audiencias Provinciales."
  explanation:
    es: "El artículo 26 enumera los jueces de paz, los Tribunales de Instancia, las Audiencias Provinciales, los Tribunales Superiores de Justicia, el Tribunal Central de Instancia, la Audiencia Nacional y el Tribunal Supremo. El Tribunal Constitucional no está en la lista: la Constitución lo regula aparte, en su título IX."
  citation: "art. 26 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
