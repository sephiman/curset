    execution: m07-l02/WebSocketAccept.java
    mistake: base64 comparison ignored
m07-l02-q10:
  key:
    anchor: rfc6455#section-1.4
    sentence: Upon receiving such a frame, the other peer sends a Close frame in response, if it hasn't already sent one.
  wrong:
  - option: It closes the TCP connection at once without replying
    anchor: rfc6455#section-1.4
    sentence: Upon receiving _that_ control frame, the first peer then closes the connection, safe in the knowledge that no further data is forthcoming.
  - option: It keeps sending its pending data until the first peer closes
    anchor: rfc6455#section-1.4
    sentence: After sending a control frame indicating the connection should be closed, a peer does not send any further data; after receiving a control frame indicating the connection should be closed, a peer discards any further data received.
  - option: It waits for the TCP FIN/ACK exchange to finish before answering
    anchor: rfc6455#section-1.4
    sentence: The closing handshake is intended to complement the TCP closing handshake (FIN/ACK), on the basis that the TCP closing handshake is not always reliable end-to-end, especially in the presence of intercepting proxies and other intermediaries.
m07-l02-q11:
  key:
    anchor: whatwg-html-sse#server-sent-events-intro
    sentence: Clients will reconnect if the connection is closed; a client can be told to stop reconnecting using the HTTP 204 No Content response code.
  wrong:
  - option: By answering with a `301` redirect to the same URL
    anchor: whatwg-html-sse#server-sent-events-intro
    sentence: Event stream requests can be redirected using HTTP 301 and 307 redirects as with normal HTTP requests.
  - option: By closing the connection after the last event
    anchor: whatwg-html-sse#server-sent-events-intro
    sentence: Clients will reconnect if the connection is closed; a client can be told to stop reconnecting using the HTTP 204 No Content response code.
  - option: By sending a `Last-Event-ID` header with the final event ID
    anchor: whatwg-html-sse#the-last-event-id-header
    sentence: HTTP request header reports an EventSource object's last event ID string to the server when the user agent is to reestablish the connection.
m07-l02-q12:
  key:
    anchor: whatwg-html-sse#parsing-an-event-stream
    sentence: Event streams in this format must always be encoded as UTF-8.
  wrong:
  - option: The one named in the charset parameter of the `Content-Type` header
    anchor: whatwg-html-sse#server-sent-events-intro
    sentence: Event streams are always decoded as UTF-8. There is no way to specify another character encoding.
  - option: ISO-8859-1 unless the stream starts with a byte order mark
    anchor: whatwg-html-sse#parsing-an-event-stream
    sentence: Event streams in this format must always be encoded as UTF-8.
    exclusive: true
  - option: US-ASCII with other characters escaped
    anchor: whatwg-html-sse#parsing-an-event-stream
    sentence: Event streams in this format must always be encoded as UTF-8.
    exclusive: true
m07-l02-q13:
  key:
    anchor: rfc9113#section-5.2
    sentence: HTTP/2 provides for flow control through use of the WINDOW_UPDATE frame (Section 6.9).
  wrong:
  - option: '`CONTINUATION`'
    anchor: rfc9113#section-4.3
    sentence: each of which could be followed by CONTINUATION (Section 6.10) frames to carry subsequent field block fragments.
  - option: '`SETTINGS`'
    anchor: rfc9113#section-5.1.2
    sentence: A peer can limit the number of concurrently active streams using the SETTINGS_MAX_CONCURRENT_STREAMS parameter (see Section 6.5.2) within a SETTINGS frame.
  - option: '`HEADERS`'
    anchor: rfc9113#section-4.3
    sentence: The first field block fragment is transmitted within the frame payload of HEADERS (Section 6.2) or PUSH_PROMISE (Section 6.6)
m07-l02-q14:
  key:
    anchor: rfc9113#section-4.3
    sentence: Field blocks MUST be transmitted as a contiguous sequence of frames, with no interleaved frames of any other type or from any other stream.
  wrong:
  - option: Interleaved with `DATA` frames of other streams so the connection stays busy
    anchor: rfc9113#section-4.3
    sentence: Field blocks MUST be transmitted as a contiguous sequence of frames, with no interleaved frames of any other type or from any other stream.
    exclusive: true
  - option: Interleaved with `HEADERS` frames of other streams, which all share one compression context
    anchor: rfc9113#section-4.3
    sentence: Field blocks MUST be transmitted as a contiguous sequence of frames, with no interleaved frames of any other type or from any other stream.
    exclusive: true
  - option: In one `HEADERS` frame only, because continuation frames are not allowed
    anchor: rfc9113#section-4.3
    sentence: a HEADERS or PUSH_PROMISE frame with the END_HEADERS flag unset and one or more CONTINUATION frames, where the last CONTINUATION frame has the END_HEADERS flag set.
