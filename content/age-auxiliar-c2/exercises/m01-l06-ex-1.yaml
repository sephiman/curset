# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l06-q052
  prompt:
    es: "¿Cuál de los siguientes NO es uno de los principios que nombra la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017?"
  options:
  - id: a
    correct: true
    text:
      es: "La eficacia administrativa."
  - id: b
    text:
      es: "La transparencia."
  - id: c
    text:
      es: "La integridad."
  - id: d
    text:
      es: "La rendición de cuentas."
  explanation:
    es: "La Recomendación nombra cuatro principios: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. La eficacia administrativa no figura entre ellos, aunque sea un principio de actuación de las Administraciones en otra norma. Las otras tres opciones son principios de la Recomendación."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`; «The implementation of open government principles - transparency, integrity, accountability and stakeholder participation - constitutes a paradigm shift for the relationship between governments and citizens, making it more dynamic, mutually beneficial and based on reciprocal trust.»"
