# anchor: boe-a-1986-18101-art-15
- id: m04-l01-q066
  prompt:
    es: "Según el artículo 15.1 del Reglamento aprobado por el Real Decreto 1405/1986, de 6 de junio, ¿quién constituye los Registros de Personal en los que debe inscribirse el personal de cada Administración?"
  options:
  - id: a
    correct: true
    text:
      es: "Cada Administración Pública, respecto de todo su personal."
  - id: b
    text:
      es: "El Registro Central, para todas las Administraciones."
  - id: c
    text:
      es: "Las comunidades autónomas, respecto de su personal y del de sus entidades locales."
  - id: d
    text:
      es: "La Dirección General de Función Pública, mediante convenio con cada Administración."
  explanation:
    es: "El artículo 15.1 dice que las Administraciones Públicas «constituirán sus correspondientes Registros de Personal, en los que deberá inscribirse todo el personal dependiente de las mismas». Cada una constituye el suyo. El Registro Central de Personal es el de la Administración General del Estado. Las comunidades autónomas no constituyen el Registro de las entidades locales; sólo cooperan cuando estas no tienen capacidad suficiente (art. 15.2). El artículo no atribuye esa tarea a la Dirección General de Función Pública."
  citation: "art. 15.1 RD 1405/1986"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2000-1007-art-13
- id: m04-l01-q067
  prompt:
    es: "Según el artículo 13.1.b) del Reglamento del Registro Central de Personal, en la redacción del Real Decreto 2073/1999, de 30 de diciembre, ¿respecto de qué personal se anotan las bajas temporales y la finalización o resolución del contrato?"
  options:
  - id: a
    correct: true
    text:
      es: "Respecto del personal laboral inscrito en el Registro."
  - id: b
    text:
      es: "Respecto del personal eventual inscrito en el Registro."
  - id: c
    text:
      es: "Respecto de los funcionarios interinos inscritos en el Registro."
  - id: d
    text:
      es: "Respecto de los funcionarios en prácticas inscritos en el Registro."
  explanation:
    es: "La lista del artículo 13.1.b), que es la del personal laboral, incluye las «bajas temporales» y la «finalización o resolución del contrato». Al personal eventual y a los funcionarios interinos y en prácticas se les aplica la lista del artículo 13.1.a), que no recoge esos actos: ellos no tienen contrato de trabajo, sino nombramiento, y sus actos son tomas de posesión, ceses o cambios de situación administrativa."
  citation: "art. 13.1.b) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
