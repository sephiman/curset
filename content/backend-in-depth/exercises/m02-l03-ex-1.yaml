- id: m02-l03-q02
  prompt:
    en: In Java 25, what does the `Deque` interface say about implementations that allow null elements, and what
      reason does it give for its advice?
  options:
  - id: a
    text:
      en: Implementations are required to reject null with a `NullPointerException`, because the interface forbids
        it
  - id: b
    correct: true
    text:
      en: Implementations are strongly encouraged to prohibit null, because null is the special return value that
        signals an empty deque
  - id: c
    text:
      en: Implementations are encouraged to accept null, because `peekFirst` uses it to mark the end of the deque
  - id: d
    text:
      en: Implementations may accept null freely, because every empty-deque case is reported by an exception
  explanation:
    en: Implementations are strongly encouraged to prohibit null, because null is used as the special return value
      for an empty deque. The claim that rejection is required is wrong, because implementations are not strictly
      required to prohibit null. The claim that null is encouraged is wrong, because users are strongly encouraged
      not to take advantage of the ability to insert nulls. The claim that an exception reports every empty case
      is wrong, because one form of each method returns a special value, either null or false.
  citation: javadoc-deque#interface-deque-e
- id: m02-l03-q03
  prompt:
    en: In Java 25, which statement about the `Deque` interface is correct when it is compared with the `List` interface
      and with the legacy `Stack` class?
  options:
  - id: a
    correct: true
    text:
      en: It provides no indexed access to elements, unlike the `List` interface
  - id: b
    text:
      en: Its implementations generally define element-based `equals` and `hashCode` methods
  - id: c
    text:
      en: It should be avoided in favor of the legacy `Stack` class when a LIFO structure is needed
  - id: d
    text:
      en: Every implementation places a fixed limit on the number of elements it may contain
  explanation:
    en: '`Deque` provides no indexed access to elements, unlike `List`. The claim of element-based `equals` and
      `hashCode` is wrong, because implementations generally inherit the identity-based versions from `Object`.
      The claim that it should be avoided is wrong, because the interface should be used in preference to the legacy
      `Stack` class. The claim of a fixed limit is wrong, because most implementations place no fixed limits on
      the number of elements.'
  citation: javadoc-deque#interface-deque-e
- id: m02-l03-q04
  prompt:
    en: According to Open Data Structures, when are linked list structures such as `DLList` well-suited, and what
      makes them so?
  options:
  - id: a
    correct: true
    text:
      en: When references to list nodes can be obtained externally, because the work at a known node takes constant
        time
  - id: b
    text:
      en: When elements are read by index, because finding the relevant node takes constant time
  - id: c
    text:
      en: When elements are rarely added or removed, because shifting array items is cheap in array-based lists
  - id: d
    text:
      en: When a `LinkedHashSet` removes an element, because it has to traverse the list to find the node
  explanation:
    en: Linked list structures are well-suited when references to list nodes can be obtained through external means,
      because the work at a known node takes constant time. The claim about reading by index is wrong, because the
      only expensive part of operations on a `DLList` is finding the relevant node. The claim that shifting array
      items is cheap is wrong, because addition or removal in an array requires shifting elements and takes non-constant
      time. The claim about traversal in a `LinkedHashSet` is wrong, because its hash table finds the relevant list
      node in constant time.
  citation: ods-3-2-dllist-doubly-linked-li#SECTION00622000000000000000
  extract:
    en: linked list structures are well-suited to applications where references to list nodes can be obtained through
      external means.
- id: m02-l03-q05
  prompt:
    en: According to Open Data Structures, which statement about the breadth-first traversal of a binary tree is
      correct?
  options:
  - id: a
    correct: true
    text:
      en: It is implemented using a queue
  - id: b
    text:
      en: It is implemented using a stack, so the most recently added child is visited next
  - id: c
    text:
      en: It follows the same pattern as the recursive size and height functions
  - id: d
    text:
      en: It visits the nodes from the deepest level up to the root, left to right
  explanation:
    en: Breadth-first traversal is implemented using a queue. The claim of a stack is wrong, because the traversal
      uses a queue to hold the nodes still to be processed. The claim of the recursive pattern is wrong, because
      breadth-first traversal does not fit the pattern of the recursive functions. The claim of a bottom-up visit
      is wrong, because the nodes are visited level by level starting at the root and moving down.
  citation: ods-6-1-binarytree-basic-binary#SECTION00912000000000000000
  extract:
    en: Breadth-first traversal is implemented using a queue
- id: m02-l03-q06
  prompt:
    en: According to Open Data Structures, which statement about traversing a binary tree without recursion is correct?
  options:
  - id: a
    text:
      en: Without recursion a binary tree can be traversed only breadth-first, never by following its links
  - id: b
    text:
      en: A non-recursive traversal needs a parent field and is impossible without one
  - id: c
    text:
      en: A recursive traversal never crashes, because the recursion depth is bounded by the number of nodes in
        the call
  - id: d
    correct: true
    text:
      en: If the nodes have no parent field, a non-recursive traversal still works but must keep the path to the
        root in a `List` or `Stack`
  explanation:
    en: Without a parent field, a non-recursive traversal is still possible but must use a `List` or `Stack` to
      keep track of the path to the root. The claim that only breadth-first works is wrong, because an algorithm
      that relies on where it came from determines where it goes next. The claim that a parent field is required
      is wrong, because the non-recursive implementation is still possible without it. The claim that recursion
      never crashes is wrong, because a very large height can use more stack space than is available and cause a
      crash.
  citation: ods-6-1-binarytree-basic-binary#SECTION00912000000000000000
  extract:
    en: a non-recursive implementation is still possible, but the implementation has to use a List (or Stack) to
      keep track of the path from the current node to the root.
- id: m02-l03-q07
