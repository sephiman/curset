    - id: m03-l09
      title:
        es: 'La extinción de la deuda tributaria (I). Medios de extinción de la deuda. El pago o cumplimiento: forma,
          momento, plazos, imputación, consignación y medios de pago. Aplazamiento y fraccionamiento del
          pago.'
      summary:
        es: 'Las deudas tributarias pueden extinguirse por pago, prescripción, compensación o condonación, por los medios
          previstos en la normativa aduanera y por los demás medios previstos en las leyes. La LGT y el RGR regulan la
          forma, el momento, los plazos, la imputación y la consignación del pago. El aplazamiento y el
          fraccionamiento se conceden previa solicitud del obligado, devengan intereses de demora y deben
          garantizarse; no se exigen garantías cuando la deuda en conjunto no excede de 50.000 euros, límite que fija
          la Orden HFP/311/2023.'
