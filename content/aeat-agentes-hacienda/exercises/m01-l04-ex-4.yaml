# anchor: boe-a-1978-31229-art-148
- id: m01-l04-q0040
  prompt:
    es: "De acuerdo con el artículo 148.1 de la Constitución Española de 1978, en materia de medio ambiente las Comunidades Autónomas podrán asumir competencias sobre:"
  options:
  - id: a
    text:
      es: "La legislación básica sobre protección del medio ambiente."
  - id: b
    text:
      es: "La legislación básica y la gestión en materia de protección del medio ambiente."
  - id: c
    correct: true
    text:
      es: "La gestión en materia de protección del medio ambiente."
  - id: d
    text:
      es: "La legislación exclusiva sobre protección del medio ambiente en su territorio."
  explanation:
    es: "El artículo 148.1.9.ª incluye «la gestión en materia de protección del medio ambiente». La legislación básica sobre protección del medio ambiente es competencia exclusiva del Estado (art. 149.1.23.ª), así que no vale ninguna respuesta que la incluya. Las Comunidades pueden establecer normas adicionales de protección, pero no tienen una legislación exclusiva."
  citation: "art. 148.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l04-q0041
  prompt:
    es: "¿Qué facultad reserva la Constitución Española de 1978 a las Comunidades Autónomas frente a la legislación básica del Estado sobre protección del medio ambiente?"
  options:
  - id: a
    text:
      es: "La de dejar sin efecto la legislación básica estatal en su territorio."
  - id: b
    text:
      es: "La de dictar la legislación básica cuando el Estado no la haya aprobado."
  - id: c
    text:
      es: "La de sustituir la legislación básica estatal por normas propias de igual protección."
  - id: d
    correct: true
    text:
      es: "La de establecer normas adicionales de protección."
  explanation:
    es: "El artículo 149.1.23.ª atribuye al Estado la «legislación básica sobre protección del medio ambiente, sin perjuicio de las facultades de las Comunidades Autónomas de establecer normas adicionales de protección». Las Comunidades añaden protección; no desplazan, suplen ni sustituyen la legislación básica, que es competencia exclusiva del Estado."
  citation: "art. 149.1.23.ª CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-149
- id: m01-l04-q0043
  prompt:
    es: "Según el artículo 149.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias pertenece a la competencia exclusiva del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Legislación sobre propiedad intelectual e industrial."
  - id: b
    text:
      es: "Fomento de la cultura y de la investigación de la Comunidad Autónoma."
  - id: c
    text:
      es: "Patrimonio monumental de interés de la Comunidad Autónoma."
  - id: d
    text:
      es: "Ordenación del territorio, urbanismo y vivienda."
  explanation:
    es: "El artículo 149.1.9.ª reserva al Estado la «legislación sobre propiedad intelectual e industrial». El fomento de la cultura y de la investigación (art. 148.1.17.ª), el patrimonio monumental de interés de la Comunidad (148.1.16.ª) y la ordenación del territorio, urbanismo y vivienda (148.1.3.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-150
- id: m01-l04-q0046
  prompt:
    es: "De acuerdo con el artículo 150.1 de la Constitución Española de 1978, en cada ley marco por la que las Cortes atribuyen a las Comunidades la facultad de dictar normas legislativas se establecerá:"
  options:
  - id: a
    text:
      es: "La correspondiente transferencia de medios financieros y las formas de control que se reserve el Estado."
  - id: b
    correct: true
    text:
      es: "La modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas."
  - id: c
    text:
      es: "El control del Gobierno, previo dictamen del Consejo de Estado, sobre estas normas legislativas."
  - id: d
    text:
      es: "La apreciación de su necesidad por las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.1 dice que «en cada ley marco se establecerá la modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas». La transferencia de medios financieros y las formas de control del Estado son de la ley orgánica de transferencia o delegación (art. 150.2). El control del Gobierno con dictamen del Consejo de Estado se refiere a las funciones delegadas (art. 153.b). La apreciación por mayoría absoluta de cada Cámara es de las leyes de armonización (art. 150.3)."
  citation: "art. 150.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-150
- id: m01-l04-q0047
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Constitución Española de 1978, apreciar si el interés general exige dictar leyes que armonicen las disposiciones normativas de las Comunidades Autónomas corresponde:"
  options:
  - id: a
    text:
      es: "Al Gobierno, previo dictamen del Consejo de Estado y audiencia de las Comunidades Autónomas afectadas."
  - id: b
    text:
      es: "Al Congreso de los Diputados, por mayoría absoluta, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Al Tribunal Constitucional, a instancia del Gobierno, de cincuenta Diputados o de cincuenta Senadores."
  - id: d
    correct: true
    text:
      es: "A las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.3 dice: «Corresponde a las Cortes Generales, por mayoría absoluta de cada Cámara, la apreciación de esta necesidad». No la aprecia el Gobierno, con o sin dictamen del Consejo de Estado. La mayoría absoluta del Congreso en una votación final sobre el conjunto es la regla de las leyes orgánicas (art. 81.2): aquí votan las dos Cámaras. El Tribunal Constitucional controla la constitucionalidad de las leyes, pero no aprecia la necesidad de armonizar."
  citation: "art. 150.3 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-150
- id: m01-l04-q0048
  prompt:
    es: "Conforme al artículo 150.2 de la Constitución Española de 1978, la ley orgánica por la que el Estado transfiere o delega facultades en las Comunidades Autónomas preverá en cada caso:"
  options:
  - id: a
    correct: true
    text:
      es: "La transferencia de medios financieros y las formas de control que se reserve el Estado."
  - id: b
    text:
      es: "La modalidad del control de las Cortes Generales sobre las normas autonómicas."
  - id: c
    text:
      es: "Los principios necesarios para armonizar las normas de las Comunidades."
  - id: d
    text:
      es: "La apreciación por las Cortes Generales de la necesidad de la transferencia."
  explanation:
    es: "El artículo 150.2 manda a la ley prever la transferencia de medios financieros y las formas de control que se reserve el Estado. La modalidad del control de las Cortes Generales es el contenido de cada ley marco del artículo 150.1. Los principios de armonización son el objeto de las leyes del artículo 150.3. La apreciación por las Cortes Generales de la necesidad corresponde a las leyes de armonización del artículo 150.3, no a la transferencia."
  citation: "art. 150.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l04-q0054
  prompt:
    es: "¿Cuál de las siguientes materias relativas a puertos y aeropuertos pueden asumir las Comunidades Autónomas, según el artículo 148.1 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Los puertos y aeropuertos deportivos."
  - id: b
    text:
      es: "Los puertos de interés general."
  - id: c
    text:
      es: "Los aeropuertos de interés general."
  - id: d
    text:
      es: "El control del espacio aéreo y el tránsito aéreo."
  explanation:
    es: "Las Comunidades pueden asumir los puertos de refugio, los puertos y aeropuertos deportivos y, en general, los que no desarrollen actividades comerciales. Los puertos y aeropuertos de interés general, y el control del espacio aéreo y el tránsito aéreo, son competencias exclusivas del Estado en el artículo 149.1.20.ª."
  citation: "art. 148.1.6.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-155
- id: m01-l04-q0062
  prompt:
    es: "De acuerdo con el artículo 155.1 de la Constitución Española de 1978, antes de adoptar las medidas necesarias para obligar a una Comunidad Autónoma al cumplimiento forzoso de sus obligaciones, el Gobierno dirige un requerimiento:"
  options:
  - id: a
    text:
      es: "A la Asamblea Legislativa de la Comunidad Autónoma."
  - id: b
    correct: true
    text:
      es: "Al Presidente de la Comunidad Autónoma."
  - id: c
    text:
      es: "Al Consejo de Gobierno de la Comunidad Autónoma."
  - id: d
    text:
      es: "Al Tribunal Superior de Justicia de la Comunidad Autónoma."
  explanation:
    es: "El artículo 155.1 exige «previo requerimiento al Presidente de la Comunidad Autónoma». El requerimiento no se dirige a la Asamblea, al Consejo de Gobierno ni al Tribunal Superior de Justicia."
  citation: "art. 155.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-137
- id: m01-l04-q0069
  prompt:
    es: "Según el artículo 137 de la Constitución Española de 1978, los municipios, las provincias y las Comunidades Autónomas que se constituyan:"
  options:
  - id: a
    text:
      es: "Gozan de soberanía para la gestión de sus respectivos intereses."
  - id: b
    text:
      es: "Gozan de autonomía para la gestión de los intereses generales del Estado."
  - id: c
    text:
      es: "Gozan de autonomía política y legislativa en sus respectivos territorios."
  - id: d
    correct: true
    text:
      es: "Gozan de autonomía para la gestión de sus respectivos intereses."
  explanation:
    es: "El artículo 137 CE dice que todas estas entidades «gozan de autonomía para la gestión de sus respectivos intereses». La soberanía no es de ellas. La autonomía se refiere a sus propios intereses, no a los generales del Estado. El artículo no atribuye potestad legislativa a municipios ni a provincias."
  citation: "art. 137 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-11
- id: m01-l04-q0075
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el Municipio:"
  options:
  - id: a
    text:
      es: "Es la entidad local intermedia entre la Provincia y la Comunidad Autónoma."
  - id: b
    text:
      es: "Es la entidad territorial básica de la organización de las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "Es la entidad local básica de la organización territorial del Estado."
  - id: d
    text:
      es: "Es una entidad local sin personalidad jurídica propia, distinta del Ayuntamiento."
  explanation:
    es: "El artículo 11.1 LBRL dice que «el Municipio es la entidad local básica de la organización territorial del Estado». No es una entidad intermedia: la Provincia es la que agrupa municipios. El artículo habla de la organización territorial del Estado, no de la de las Comunidades Autónomas. El mismo apartado le reconoce personalidad jurídica y plena capacidad."
  citation: "art. 11.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-13
- id: m01-l04-q0076
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la alteración de términos municipales es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Se regula por la legislación autonómica sobre régimen local y no puede suponer modificación de los límites provinciales."
  - id: b
    text:
      es: "Se regula por ley orgánica de las Cortes Generales, igual que la alteración de los límites provinciales."
  - id: c
    text:
      es: "Se regula por la legislación autonómica y puede modificar los límites provinciales con informe del Estado."
  - id: d
    text:
      es: "Se regula por la legislación estatal y requiere la aprobación del Consejo de Ministros."
  explanation:
    es: "El artículo 13.1 LBRL remite la alteración de términos municipales a «la legislación de las Comunidades Autónomas sobre régimen local», sin que pueda suponer, «en ningún caso, modificación de los límites provinciales». La ley orgánica de las Cortes es la que exige el artículo 141.1 CE para los límites provinciales, no para los términos municipales. Ningún informe permite tocar los límites provinciales por esta vía. La ley no atribuye la decisión al Estado ni al Consejo de Ministros."
  citation: "art. 13.1 LBRL"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1985-5392-art-13
- id: m01-l04-q0077
  prompt:
    es: "De acuerdo con el artículo 13.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la creación de nuevos municipios solo podrá realizarse sobre la base de núcleos de población territorialmente diferenciados:"
  options:
  - id: a
    text:
      es: "De al menos 2.000 habitantes."
  - id: b
    correct: true
    text:
      es: "De al menos 4.000 habitantes."
  - id: c
    text:
      es: "De al menos 5.000 habitantes."
  - id: d
    text:
      es: "De al menos 1.000 habitantes."
  explanation:
    es: "El artículo 13.2 LBRL exige núcleos de población territorialmente diferenciados «de al menos 4.000 habitantes». Las cifras de 1.000 y 5.000 habitantes aparecen en la LBRL para otras reglas: los servicios de secretaría e intervención que garantiza la Diputación y la Junta de Gobierno Local. La de 2.000 no está en el artículo."
  citation: "art. 13.2 LBRL"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
