- id: g-three-way-handshake
  term: {en: three-way handshake}
  definition: {en: "The procedure used to establish a connection. It normally is initiated by one TCP peer and responded to by another TCP peer."}
  origin: m07-l01
  citation: "rfc9293#section-3.5"
- id: g-time-wait
  term: {en: TIME-WAIT}
  definition: {en: "A TCP state that represents waiting for enough time to pass to be sure the remote TCP peer received the acknowledgment of its connection termination request and to avoid new connections being impacted by delayed segments from previous connections."}
  origin: m07-l01
  citation: "rfc9293#section-3.3.2"
- id: g-congestion-window
  term: {en: congestion window (cwnd)}
  definition: {en: "A sender-side limit on the amount of data the sender can transmit into the network before receiving an acknowledgment (ACK)."}
  origin: m07-l01
  citation: "rfc5681#section-3.1"
- id: g-slow-start-threshold
  term: {en: slow start threshold (ssthresh)}
  definition: {en: "A state variable used to determine whether the slow start or congestion avoidance algorithm is used to control data transmission."}
  origin: m07-l01
  citation: "rfc5681#section-3.1"
- id: g-server-name-indication
  term: {en: Server Name Indication (SNI)}
  definition: {en: "An extension of type \"server_name\" that clients may include in the extended client hello to tell a server the name of the server they are contacting."}
  origin: m07-l01
  citation: "rfc6066#section-3"
- id: g-application-layer-protocol-negotiation
  term: {en: Application-Layer Protocol Negotiation (ALPN)}
  definition: {en: "A TLS extension that the client may include in its ClientHello message to advertise a list of protocols, in descending order of preference, from which the server selects one."}
  origin: m07-l01
  citation: "rfc7301#section-3.1"
- id: g-headless-service
  term: {en: headless Service}
  definition: {en: "A Kubernetes Service created by explicitly specifying \"None\" for the cluster IP address (.spec.clusterIP), for which there is no load balancing or proxying done by the platform."}
  origin: m07-l01
  citation: "k8s-service#headless-services"
