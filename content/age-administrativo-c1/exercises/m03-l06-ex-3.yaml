# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q039
  prompt:
    es: "De acuerdo con el artículo 34.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la cuantía de la indemnización se calculará con referencia:"
  options:
  - id: a
    text:
      es: "Al día en que se inició el procedimiento de responsabilidad."
  - id: b
    text:
      es: "Al día en que emitió su dictamen el Consejo de Estado."
  - id: c
    text:
      es: "Al día en que se notifique la resolución que la fije."
  - id: d
    correct: true
    text:
      es: "Al día en que la lesión efectivamente se produjo."
  explanation:
    es: "El artículo 34.3 LRJSP dice que la cuantía «se calculará con referencia al día en que la lesión efectivamente se produjo», sin perjuicio de su actualización. La opción del inicio del procedimiento, la del dictamen del Consejo de Estado y la de la notificación de la resolución toman momentos posteriores que el artículo no usa como referencia."
  citation: "art. 34.3 LRJSP"
  difficulty: 1
  tags:
  - "cantidad"
  - "fecha"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q040
  prompt:
    es: "Según el artículo 34.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿con arreglo a qué índice, y fijado por quién, se actualiza la cuantía de la indemnización?"
  options:
  - id: a
    text:
      es: "El Índice de Precios de Consumo, fijado por el Instituto Nacional de Estadística."
  - id: b
    text:
      es: "El Índice de Garantía de la Competitividad, fijado por el Banco de España."
  - id: c
    correct: true
    text:
      es: "El Índice de Garantía de la Competitividad, fijado por el Instituto Nacional de Estadística."
  - id: d
    text:
      es: "El tipo del interés legal del dinero, fijado por la Ley de Presupuestos Generales del Estado."
  explanation:
    es: "El artículo 34.3 LRJSP actualiza la cuantía «con arreglo al Índice de Garantía de la Competitividad, fijado por el Instituto Nacional de Estadística». La opción del Índice de Precios de Consumo cambia el índice. La opción del Banco de España cambia el organismo que lo fija. La opción del interés legal del dinero cambia la actualización por otra figura que el artículo no usa."
  citation: "art. 34.3 LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "órgano"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q041
  prompt:
    es: "En un procedimiento de responsabilidad patrimonial, la cuantía de la indemnización, calculada al día de la lesión, se actualizará según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "A la fecha en que el particular presentó su reclamación ante la Administración."
  - id: b
    text:
      es: "A la fecha en que se emitió el informe del servicio afectado."
  - id: c
    correct: true
    text:
      es: "A la fecha en que se ponga fin al procedimiento de responsabilidad."
  - id: d
    text:
      es: "A la fecha en que se pague efectivamente la indemnización."
  explanation:
    es: "El artículo 34.3 LRJSP prevé la «actualización a la fecha en que se ponga fin al procedimiento de responsabilidad». La opción de la reclamación y la del informe del servicio usan fechas intermedias. La opción del pago efectivo confunde la actualización con los intereses de demora, que el mismo apartado prevé por separado."
  citation: "art. 34.3 LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "fecha"
# anchor: boe-a-2015-10566-art-34
- id: m03-l06-q042
  prompt:
    es: "Además de su actualización, ¿qué otra cantidad prevé la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público sobre la cuantía de la indemnización fijada en un procedimiento de responsabilidad patrimonial?"
  options:
  - id: a
    correct: true
    text:
      es: "Los intereses que procedan por demora en el pago de la indemnización fijada."
  - id: b
    text:
      es: "Un recargo del diez por ciento si el procedimiento dura más de los seis meses previstos."
  - id: c
    text:
      es: "Las costas causadas al particular durante el procedimiento administrativo."
  - id: d
    text:
      es: "Los intereses legales devengados desde la presentación de la reclamación."
  explanation:
    es: "El artículo 34.3 LRJSP añade a la actualización «los intereses que procedan por demora en el pago de la indemnización fijada». El recargo del diez por ciento y las costas del procedimiento administrativo no aparecen en el artículo. La opción de los intereses legales desde la reclamación cambia el motivo de los intereses: el artículo los vincula a la demora en pagar la indemnización ya fijada."
  citation: "art. 34.3 LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-65
- id: m03-l06-q043
  prompt:
    es: "Según el artículo 65.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando las Administraciones Públicas decidan iniciar de oficio un procedimiento de responsabilidad patrimonial, será necesario:"
  options:
  - id: a
    text:
      es: "Que el interesado haya presentado antes una reclamación previa por escrito."
  - id: b
    text:
      es: "Que el daño reclamable alcance la cuantía de 50.000 euros."
  - id: c
    text:
      es: "Que lo autorice previamente el Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Que no haya prescrito el derecho a la reclamación del interesado."
  explanation:
    es: "El artículo 65.1 LPAC exige, para iniciar de oficio, que «no haya prescrito el derecho a la reclamación del interesado». La reclamación previa del interesado no se exige, porque el inicio es de oficio. La cuantía de 50.000 euros solo hace preceptivo el dictamen (art. 81.2 LPAC). El artículo no pide autorización del Consejo de Ministros."
  citation: "art. 65.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q044
  prompt:
    es: "¿Cuál de los siguientes extremos debe especificar la solicitud de iniciación de un procedimiento de responsabilidad patrimonial, además de lo previsto con carácter general en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La identificación de la autoridad o del empleado público cuya actuación causó las lesiones alegadas."
  - id: b
    correct: true
    text:
      es: "La presunta relación de causalidad entre las lesiones y el funcionamiento del servicio público."
  - id: c
    text:
      es: "El informe pericial firmado por técnico competente que acredite la valoración del daño."
  - id: d
    text:
      es: "La garantía que asegure el pago de los gastos del procedimiento."
  explanation:
    es: "El artículo 67.2 LPAC exige que la solicitud especifique «las lesiones producidas, la presunta relación de causalidad entre éstas y el funcionamiento del servicio público, la evaluación económica de la responsabilidad patrimonial, si fuera posible, y el momento en que la lesión efectivamente se produjo». No pide identificar al empleado causante, ni un informe pericial, ni una garantía de gastos."
  citation: "art. 67.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q045
  prompt:
    es: "Según el artículo 67.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo debe la solicitud del interesado especificar la evaluación económica de la responsabilidad patrimonial?"
  options:
  - id: a
    text:
      es: "Siempre, con un informe pericial."
  - id: b
    correct: true
    text:
      es: "Solo cuando fuera posible hacerla."
  - id: c
    text:
      es: "Solo en los daños físicos o psíquicos."
  - id: d
    text:
      es: "Solo si reclama 50.000 euros o más."
  explanation:
    es: "El artículo 67.2 LPAC pide que la solicitud especifique «la evaluación económica de la responsabilidad patrimonial, si fuera posible». «Siempre, con informe pericial» convierte en obligatorio lo que el apartado condiciona a que sea posible. Los daños físicos o psíquicos intervienen en el artículo 67.1, en el cómputo del plazo de prescripción desde la curación o la determinación de las secuelas, no en la evaluación económica. Los 50.000 euros son el umbral del dictamen preceptivo del Consejo de Estado, en el artículo 81.2, no una condición para evaluar."
  citation: "art. 67.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-67
- id: m03-l06-q046
  prompt:
    es: "La solicitud de iniciación de un procedimiento de responsabilidad patrimonial especificará, entre otros extremos, conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "El momento en que el interesado identificó al causante."
  - id: b
    text:
      es: "El momento en que la Administración conoció la lesión."
  - id: c
    text:
      es: "El momento en que el interesado inició el tratamiento."
  - id: d
    correct: true
    text:
      es: "El momento en que la lesión efectivamente se produjo."
  explanation:
    es: "El artículo 67.2 LPAC incluye entre los extremos de la solicitud «el momento en que la lesión efectivamente se produjo». Esa fecha sirve también para calcular la cuantía (art. 34.3 LRJSP). El momento en que se identificó al causante, el momento en que la Administración conoció la lesión y el inicio del tratamiento no figuran en el artículo."
  citation: "art. 67.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "fecha"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q047
  prompt:
    es: "De acuerdo con el artículo 81.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de responsabilidad patrimonial el informe del servicio cuyo funcionamiento haya ocasionado la presunta lesión:"
  options:
  - id: a
    correct: true
    text:
      es: "Es preceptivo y su plazo de emisión no puede exceder de diez días."
  - id: b
    text:
      es: "Es preceptivo y su plazo de emisión no puede exceder de dos meses."
  - id: c
    text:
      es: "Solo es preceptivo si la cuantía reclamada alcanza 50.000 euros."
  - id: d
    text:
      es: "Es preceptivo y se pide una vez emitido el dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 81.1 LPAC dice que «será preceptivo solicitar informe al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable, no pudiendo exceder de diez días el plazo de su emisión». Dos meses es el plazo del dictamen del Consejo de Estado y del informe del Consejo General del Poder Judicial. Los 50.000 euros son la cuantía que hace preceptivo el dictamen, no el informe. El informe del servicio se pide en la instrucción, antes de la audiencia, y el dictamen llega después de ella (art. 82.1 LPAC)."
  citation: "art. 81.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q048
  prompt:
    es: "En un procedimiento de responsabilidad patrimonial, ¿a quién es preceptivo solicitar informe según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "A la Intervención General de la Administración del Estado, en todos los procedimientos."
  - id: b
    text:
      es: "Al Consejo General del Poder Judicial, en cualquier reclamación."
  - id: c
    correct: true
    text:
      es: "Al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable."
  - id: d
    text:
      es: "A la Inspección General de Servicios del departamento afectado."
  explanation:
    es: "El artículo 81.1 LPAC hace preceptivo «solicitar informe al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable». La Intervención General y la Inspección General de Servicios no aparecen en el artículo. El informe del Consejo General del Poder Judicial solo es preceptivo en las reclamaciones por el funcionamiento anormal de la Administración de Justicia (art. 81.3 LPAC), no en cualquiera."
  citation: "art. 81.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q049
  prompt:
    es: "El servicio causante de la presunta lesión recibe la petición de informe el lunes 2 de febrero de 2026. Sin festivos en el periodo, ¿qué día vence el plazo máximo de emisión según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El jueves 12 de febrero de 2026."
  - id: b
    text:
      es: "El viernes 13 de febrero de 2026."
  - id: c
    text:
      es: "El lunes 23 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "El lunes 16 de febrero de 2026."
  explanation:
    es: "El informe se emite en un plazo que no puede exceder «de diez días» (art. 81.1 LPAC). Los plazos en días son hábiles y excluyen sábados, domingos y festivos (art. 30.2 LPAC), y se cuentan desde el día siguiente (art. 30.3 LPAC). El primer día es el martes 3 de febrero; sin contar los fines de semana, el décimo día hábil es el lunes 16 de febrero de 2026. El jueves 12 de febrero sale de contar diez días naturales. El viernes 13 de febrero es el noveno día hábil. El lunes 23 de febrero es el decimoquinto día hábil."
  citation: "art. 81.1 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q050
  prompt:
    es: "Conforme al artículo 81.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando las indemnizaciones reclamadas sean de cuantía igual o superior a 50.000 euros será preceptivo solicitar dictamen:"
  options:
  - id: a
    text:
      es: "Del Consejo de Estado en todo caso, también en las reclamaciones a una Comunidad Autónoma."
  - id: b
    correct: true
    text:
      es: "Del Consejo de Estado o, en su caso, del órgano consultivo de la Comunidad Autónoma."
  - id: c
    text:
      es: "De la Abogacía General del Estado o, en su caso, de los servicios jurídicos autonómicos."
  - id: d
    text:
      es: "Del Tribunal de Cuentas o, en su caso, del órgano autonómico de control externo."
  explanation:
    es: "El artículo 81.2 LPAC hace preceptivo «solicitar dictamen del Consejo de Estado o, en su caso, del órgano consultivo de la Comunidad Autónoma». La opción del Consejo de Estado en todo caso borra el órgano consultivo autonómico. La Abogacía General del Estado y el Tribunal de Cuentas, con sus equivalentes autonómicos, no son los órganos que nombra el artículo."
  citation: "art. 81.2 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q051
  prompt:
    es: "Un particular reclama a un ministerio una indemnización de 50.000 euros exactos. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿es preceptivo el dictamen del Consejo de Estado?"
  options:
  - id: a
    text:
      es: "No, porque la cuantía reclamada debe superar los 50.000 euros."
  - id: b
    text:
      es: "No, porque cuenta la cuantía que estime la Administración, no la reclamada."
  - id: c
    correct: true
    text:
      es: "Sí, porque la cuantía reclamada es igual o superior a 50.000 euros."
  - id: d
    text:
      es: "Sí, pero solo si el daño reclamado es físico o psíquico."
  explanation:
    es: "El artículo 81.2 LPAC hace preceptivo el dictamen del Consejo de Estado «cuando las indemnizaciones reclamadas sean de cuantía igual o superior a 50.000 euros». Con 50.000 euros exactos se cumple el «igual». Exigir superar esa cifra olvida el «igual». Contar la cuantía que estime la Administración cambia el verbo del apartado: el criterio son las indemnizaciones «reclamadas». Limitar el dictamen a los daños físicos o psíquicos añade una condición que el apartado 81.2 no pone: la cuantía, y no la clase de daño, es el criterio, y los daños físicos o psíquicos solo cuentan en el cómputo del plazo de prescripción del artículo 67.1."
  citation: "art. 81.2 LPAC"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q052
  prompt:
    es: "¿Cuál de los siguientes supuestos hace preceptivo el dictamen del Consejo de Estado en un procedimiento de responsabilidad patrimonial, además de la cuantía, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Los casos que disponga la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado."
  - id: b
    text:
      es: "Los casos en que el órgano instructor considere dudosa la relación de causalidad entre servicio y lesión."
  - id: c
    text:
      es: "Los casos en que el interesado lo solicite en su escrito de reclamación."
  - id: d
    text:
      es: "Los casos en que la reclamación derive de una relación de derecho privado."
  explanation:
    es: "El artículo 81.2 LPAC hace preceptivo el dictamen por la cuantía «así como en aquellos casos que disponga la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado». Las dudas del instructor sobre la causalidad y la petición del interesado no aparecen como supuestos. La relación de derecho privado no cambia el régimen: se exige conforme a la misma ley (art. 35 LRJSP)."
  citation: "art. 81.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1980-8648-art-22
- id: m03-l06-q053
  prompt:
    es: "Según el artículo 22.13 de la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, las reclamaciones de indemnización por daños y perjuicios a la Administración General del Estado, en los supuestos establecidos por las leyes, se consultarán:"
  options:
  - id: a
    correct: true
    text:
      es: "A la Comisión Permanente del Consejo de Estado."
  - id: b
    text:
      es: "Al Pleno del Consejo de Estado."
  - id: c
    text:
      es: "A la Comisión de Estudios del Consejo de Estado."
  - id: d
    text:
      es: "Al Presidente del Consejo de Estado."
  explanation:
    es: "El artículo 22 de la LO 3/1980 enumera los asuntos en que «la Comisión Permanente del Consejo de Estado deberá ser consultada», y su apartado trece incluye las «reclamaciones que, en concepto de indemnización por daños y perjuicios, se formulen a la Administración General del Estado en los supuestos establecidos por las leyes». El Pleno, la Comisión de Estudios y el Presidente no son el órgano que nombra ese artículo."
  citation: "art. 22.13 LO 3/1980"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q054
  prompt:
    es: "Conforme al artículo 81.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando el dictamen sea preceptivo, el órgano instructor remitirá la propuesta de resolución al órgano competente para solicitarlo:"
  options:
  - id: a
    text:
      es: "En el plazo de cinco días a contar desde la finalización del trámite de audiencia."
  - id: b
    text:
      es: "En el plazo de diez días a contar desde la recepción del informe del servicio."
  - id: c
    correct: true
    text:
      es: "En el plazo de diez días a contar desde la finalización del trámite de audiencia."
  - id: d
    text:
      es: "En el plazo de quince días a contar desde la finalización del trámite de audiencia."
  explanation:
    es: "El artículo 81.2 LPAC dice que «el órgano instructor, en el plazo de diez días a contar desde la finalización del trámite de audiencia, remitirá al órgano competente para solicitar el dictamen una propuesta de resolución». Cinco días desde la audiencia es el plazo de la propuesta en el procedimiento contra el propio personal (art. 36.4 LRJSP). La opción de la recepción del informe cambia el inicio del cómputo. Quince días no es el plazo del artículo."
  citation: "art. 81.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m03-l06-q055
  prompt:
    es: "En un procedimiento de responsabilidad patrimonial que requiere dictamen del Consejo de Estado, ¿en qué momento se da audiencia a los interesados, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Después de la emisión del dictamen del Consejo de Estado."
  - id: b
    text:
      es: "A la vez que se solicita el dictamen del Consejo de Estado."
  - id: c
    text:
      es: "Entre la solicitud del dictamen y su emisión."
  - id: d
    correct: true
    text:
      es: "Antes de la solicitud del dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 82.1 LPAC dice que «la audiencia a los interesados será anterior a […] la solicitud del Dictamen del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, en el caso que éstos formaran parte del procedimiento». La opción de después de la emisión, la de a la vez que la solicitud y la de entre la solicitud y la emisión sitúan la audiencia cuando el dictamen ya se ha pedido, contra el artículo."
  citation: "art. 82.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q056
  prompt:
    es: "Según el artículo 81.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo se emitirá el dictamen del Consejo de Estado en un procedimiento de responsabilidad patrimonial?"
  options:
  - id: a
    text:
      es: "En el plazo de un mes."
  - id: b
    correct: true
    text:
      es: "En el plazo de dos meses."
  - id: c
    text:
      es: "En el plazo de diez días."
  - id: d
    text:
      es: "En el plazo de tres meses."
  explanation:
    es: "El artículo 81.2 LPAC dice que «el dictamen se emitirá en el plazo de dos meses». Diez días es el plazo del informe del servicio y el de remisión de la propuesta. Un mes y tres meses no son plazos del artículo."
  citation: "art. 81.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q057
  prompt:
    es: "¿Sobre qué debe pronunciarse el dictamen del Consejo de Estado en un procedimiento de responsabilidad patrimonial, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Solo sobre la cuantía y el modo de la indemnización, sin entrar en la relación de causalidad."
  - id: b
    correct: true
    text:
      es: "Sobre la relación de causalidad y, en su caso, sobre la valoración del daño y la cuantía y modo de la indemnización."
  - id: c
    text:
      es: "Sobre la relación de causalidad, sin entrar en la valoración del daño ni en la cuantía y modo de la indemnización."
  - id: d
    text:
      es: "Sobre la responsabilidad del personal causante del daño y la cantidad que debe reintegrar a la Administración."
  explanation:
    es: "El artículo 81.2 LPAC dice que el dictamen «deberá pronunciarse sobre la existencia o no de relación de causalidad entre el funcionamiento del servicio público y la lesión producida y, en su caso, sobre la valoración del daño causado y la cuantía y modo de la indemnización». La opción que excluye la causalidad y la que excluye la valoración y la cuantía recortan una de las dos partes. La responsabilidad del personal se exige en otro procedimiento (art. 36.2 LRJSP)."
  citation: "art. 81.2 LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q058
  prompt:
    es: "Conforme al artículo 81.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en las reclamaciones por el funcionamiento anormal de la Administración de Justicia, el plazo para dictar resolución:"
  options:
  - id: a
    correct: true
    text:
      es: "Quedará suspendido entre la solicitud del informe del Consejo General del Poder Judicial y su recepción, sin exceder de dos meses."
  - id: b
    text:
      es: "Quedará suspendido hasta que se reciba el informe del Consejo General del Poder Judicial, sin límite de tiempo."
  - id: c
    text:
      es: "Se ampliará automáticamente en dos meses desde que se solicite el informe del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "No se verá afectado por la solicitud del informe del Consejo General del Poder Judicial, que se tramita en paralelo."
  explanation:
    es: "El artículo 81.3 LPAC dice que «el plazo para dictar resolución quedará suspendido por el tiempo que medie entre la solicitud del informe y su recepción, no pudiendo exceder dicho plazo de los citados dos meses». La opción sin límite de tiempo suprime el tope. La opción de la ampliación fija cambia la suspensión por otra figura. La opción de que no se ve afectado niega la suspensión."
  citation: "art. 81.3 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-81
- id: m03-l06-q059
  prompt:
    es: "En una reclamación de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, ¿qué informe es preceptivo según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El de la Fiscalía General del Estado, que se evacuará en el plazo máximo de dos meses."
  - id: b
    text:
      es: "El del Tribunal Supremo, que se evacuará en el plazo máximo de dos meses."
  - id: c
    text:
      es: "El de la Sala de Gobierno del tribunal afectado, que se evacuará en el plazo máximo de un mes."
  - id: d
    correct: true
    text:
      es: "El del Consejo General del Poder Judicial, que se evacuará en el plazo máximo de dos meses."
  explanation:
    es: "El artículo 81.3 LPAC dice que «será preceptivo el informe del Consejo General del Poder Judicial que será evacuado en el plazo máximo de dos meses». La Fiscalía General del Estado, el Tribunal Supremo y la Sala de Gobierno del tribunal afectado no son el órgano que nombra el artículo."
  citation: "art. 81.3 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-91
- id: m03-l06-q061
  prompt:
    es: "Sin resolución expresa notificada ni acuerdo formalizado, ¿cuánto tiempo debe pasar para entender contraria a la indemnización la resolución de una reclamación, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Tres meses desde que se inició el procedimiento."
  - id: b
    text:
      es: "Seis meses desde que se emitió el dictamen."
  - id: c
    correct: true
    text:
      es: "Seis meses desde que se inició el procedimiento."
  - id: d
    text:
      es: "Un año desde que se inició el procedimiento."
  explanation:
    es: "El artículo 91.3 LPAC fija «seis meses desde que se inició el procedimiento». La opción de tres meses cambia la cifra. La opción del dictamen cambia el momento inicial. La opción de un año confunde este plazo con el de prescripción del derecho a reclamar (art. 67.1 LPAC)."
  citation: "art. 91.3 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-91
- id: m03-l06-q062
  prompt:
    es: "Un procedimiento de responsabilidad patrimonial se inició el martes 31 de marzo de 2026. Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué día vence el plazo de seis meses tras el que podrá entenderse contraria la resolución?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 30 de septiembre de 2026."
  - id: b
    text:
      es: "El jueves 1 de octubre de 2026."
  - id: c
    text:
      es: "El martes 30 de junio de 2026."
  - id: d
    text:
      es: "El miércoles 31 de marzo de 2027."
  explanation:
    es: "El artículo 91.3 LPAC cuenta «seis meses desde que se inició el procedimiento». Un plazo en meses concluye el mismo día del mes de vencimiento y, si ese mes no tiene día equivalente, el último día del mes (art. 30.4 LPAC). Septiembre no tiene día 31, así que el plazo vence el miércoles 30 de septiembre de 2026, día hábil. La opción del 1 de octubre pasa al mes siguiente. La opción del 30 de junio cuenta tres meses y la del 31 de marzo de 2027 cuenta un año."
  citation: "art. 91.3 LPAC"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-92
- id: m03-l06-q063
  prompt:
    es: "De acuerdo con el artículo 92 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en la Administración General del Estado los procedimientos de responsabilidad patrimonial se resolverán:"
  options:
  - id: a
    text:
      es: "Por el Subsecretario del departamento, o por el Ministro respectivo cuando la cuantía sea de 50.000 euros o más."
  - id: b
    text:
      es: "Por el Consejo de Ministros en todo caso, previo dictamen del Consejo de Estado sobre la reclamación."
  - id: c
    text:
      es: "Por el Ministro de Hacienda, cualquiera que sea el departamento cuyo servicio haya causado el daño."
  - id: d
    correct: true
    text:
      es: "Por el Ministro respectivo, o por el Consejo de Ministros en los casos del Estado legislador o cuando una ley lo disponga."
  explanation:
    es: "El artículo 92 LPAC dice que se resolverán «por el Ministro respectivo o por el Consejo de Ministros en los casos del artículo 32.3 de la Ley de Régimen Jurídico del Sector Público o cuando una ley así lo disponga». La opción del Subsecretario baja un nivel el órgano. La opción del Consejo de Ministros en todo caso convierte la excepción en regla. La opción del Ministro de Hacienda cambia el ministro del departamento por otro."
  citation: "art. 92 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-92
- id: m03-l06-q064
  prompt:
    es: "Según el artículo 92 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién resuelve en la Administración General del Estado una reclamación de responsabilidad patrimonial por la aplicación de actos legislativos?"
  options:
  - id: a
    text:
      es: "Corresponde resolverla al Ministro respectivo."
  - id: b
    correct: true
    text:
      es: "Corresponde resolverla al Consejo de Ministros."
  - id: c
    text:
      es: "Corresponde resolverla al Ministro de Hacienda."
  - id: d
    text:
      es: "Corresponde resolverla al Presidente del Gobierno."
  explanation:
    es: "El artículo 92 LPAC atribuye la resolución al Consejo de Ministros «en los casos del artículo 32.3 de la Ley de Régimen Jurídico del Sector Público», que es la responsabilidad del Estado legislador. El Ministro respectivo resuelve los demás casos, no este. El Ministro de Hacienda y el Presidente del Gobierno no aparecen en el artículo."
  citation: "art. 92 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
