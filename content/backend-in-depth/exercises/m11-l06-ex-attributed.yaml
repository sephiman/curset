- id: m11-l06-qa02
  prompt:
    en: According to Martin Fowler in Eradicating Non-Determinism in Tests, which way of getting isolation between
      tests does he prefer in general, and why?
  options:
  - id: a
    text:
      en: Having each test clean up after itself, since the failing test then holds the bug
  - id: b
    correct: true
    text:
      en: Rebuilding the starting state from scratch, since it is easier to find the source of a problem
  - id: c
    text:
      en: Ordering tests through explicit dependencies, since a fixed order eases parallel runs
  - id: d
    text:
      en: Building one shared fixture that tests may change freely, since it saves rebuild time
  explanation:
    en: Fowler says he generally prefers always rebuilding the starting state from scratch, as it is often easier
      and in particular easier to find the source of a problem. With clean-up, he writes, one test contains the
      bug but another test fails, so the real problem is hard to find; a failing test holding the bug contradicts
      his account. He states that he prefers isolation because it gives more flexibility in running subsets of tests
      and parallelizing them, which contradicts ordering tests through explicit dependencies. A shared fixture that
      tests change freely contradicts his instruction that the tests must not change that initial state, or must
      reverse their changes in tear-down.
  citation: fowler-eradicating-non-determinism#LackOfIsolation
- id: m11-l06-qa04
  prompt:
    en: According to Martin Fowler in Eradicating Non-Determinism in Tests, which practice does he recommend for
      dealing with the system clock in tests?
  options:
  - id: a
    text:
      en: Allow direct calls to the system clock in code and review them by hand
  - id: b
    text:
      en: Combine moving old test data and clock seeds with other changes to the tests
  - id: c
    correct: true
    text:
      en: Always wrap the system clock so that tests can substitute a seeded value
  - id: d
    text:
      en: Share a frozen clock stub between tests without re-initialising it
  explanation:
    en: Fowler calls it the most important thing to always wrap the system clock with routines that can be replaced
      with a seeded value for testing. He says he would argue for code analysis that detects any direct call to
      the system clock and fails the build right there, which contradicts allowing such calls and reviewing them
      by hand. On moving old test data and clock seeds, his text is that this should be the only thing done at that
      point, so combining it with other changes contradicts it. In his account, each test that uses the clock stub
      should ensure it is properly re-initialized; sharing a frozen stub without re-initialising it contradicts
      the instruction.
  citation: fowler-eradicating-non-determinism#Time
- id: m11-l06-qa05
  prompt:
    en: According to Martin Fowler in Eradicating Non-Determinism in Tests, how do his contract tests compare a
      test double with the remote system it stands in for?
  options:
  - id: a
    text:
      en: They require the double to return exactly the same results as the remote system
  - id: b
    text:
      en: They run inside the system's deployment pipeline on every single build
  - id: c
    text:
      en: They run once, when the double is first written, and not again afterwards
  - id: d
    correct: true
    text:
      en: They run the same interaction against the remote system and the double, checking they match
  explanation:
    en: Fowler says contract tests run the same interaction with the remote system and the double, and check that
      the two match. Fowler writes that a match may not mean the same result, given the non-determinism, but results
      that share the same essential structure; demanding exactly the same results contradicts that. According to
      his text, these tests need to be run frequently but not as part of the system's deployment pipeline, so running
      them on every build contradicts it. His text says periodic running based on the rate of change of the remote
      system is usually best, which leaves no place for running them once and never again.
  citation: fowler-eradicating-non-determinism#RemoteServices
- id: m11-l06-qa06
  prompt:
    en: According to Ham Vocke in The Practical Test Pyramid, which statement about unit tests and the implementation
      of the production code does he make?
  options:
  - id: a
    correct: true
    text:
      en: They should not be tied to the implementation too closely
  - id: b
    text:
      en: They should reflect the internal code structure of the production class
  - id: c
    text:
      en: They should test getters and setters to reach a high coverage
  - id: d
    text:
      en: They should call private methods directly through the test class
  explanation:
    en: Vocke writes that unit tests should ensure all non-trivial code paths are tested while not being tied to
      the implementation too closely. Vocke says not to reflect the internal code structure within the unit tests,
      which contradicts unit tests that reflect the internal code structure of the production class. The page states
      that testing simple getters, setters or other trivial implementations gains nothing, which contradicts testing
      them to reach high coverage. In the same passage, he says private methods cannot be tested since they cannot
      be called from a different test class; calling them directly through the test class contradicts his statement.
  citation: fowler-practical-test-pyramid#what-to-test
