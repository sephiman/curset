# anchor: boe-a-2018-16673-art-44
- id: m02-l04-q050
  prompt:
    es: "¿Cuál es la denominación oficial de la Agencia Española de Protección de Datos según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    text:
      es: "«Agencia Española de Protección de Datos, Agencia Estatal»."
  - id: b
    text:
      es: "«Autoridad Española de Protección de Datos, Organismo Público Independiente»."
  - id: c
    correct: true
    text:
      es: "«Agencia Española de Protección de Datos, Autoridad Administrativa Independiente»."
  - id: d
    text:
      es: "«Agencia Española de Protección de Datos, Autoridad Independiente de Control»."
  explanation:
    es: "El artículo 44.1 fija como denominación oficial «Agencia Española de Protección de Datos, Autoridad Administrativa Independiente». No es una agencia estatal. Las otras dos denominaciones cambian palabras del nombre legal."
  citation: "art. 44.1 LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q052
  prompt:
    es: "Según el artículo 48.3 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, la Comisión de Justicia del Congreso ratifica la propuesta de Presidencia y Adjunto de la Agencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Por tres quintos de sus miembros en primera votación o, si no se alcanza, por mayoría absoluta en segunda."
  - id: b
    text:
      es: "Por mayoría absoluta en primera votación o, si no se alcanza, por mayoría simple en segunda votación."
  - id: c
    text:
      es: "Por dos tercios de sus miembros en primera votación o, si no se alcanza, por tres quintos en segunda."
  - id: d
    text:
      es: "Por tres quintos de sus miembros en una única votación, sin posibilidad de una segunda votación."
  explanation:
    es: "El artículo 48.3 exige la ratificación por la Comisión de Justicia «por mayoría de tres quintos de sus miembros en primera votación o, de no alcanzarse ésta, por mayoría absoluta en segunda votación». La primera votación no es por mayoría absoluta ni por dos tercios. La segunda votación existe."
  citation: "art. 48.3 LOPDGDD"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q053
  prompt:
    es: "Según el artículo 48.5 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el mandato de la Presidencia y del Adjunto de la Agencia Española de Protección de Datos:"
  options:
  - id: a
    text:
      es: "Dura cuatro años y puede renovarse para otro período de igual duración."
  - id: b
    text:
      es: "Dura cinco años y no puede renovarse."
  - id: c
    text:
      es: "Dura seis años y puede renovarse una sola vez por tres años."
  - id: d
    correct: true
    text:
      es: "Dura cinco años y puede renovarse para otro período de igual duración."
  explanation:
    es: "El artículo 48.5 dice que el mandato «tiene una duración de cinco años y puede ser renovado para otro período de igual duración». No dura cuatro ni seis años. Sí puede renovarse, y por otros cinco."
  citation: "art. 48.5 LOPDGDD"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q054
  prompt:
    es: "Según el artículo 48.5 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿en cuál de los siguientes supuestos de separación de la Presidencia de la Agencia NO es necesaria su ratificación parlamentaria?"
  options:
  - id: a
    text:
      es: "El incumplimiento grave de sus obligaciones."
  - id: b
    text:
      es: "La incapacidad sobrevenida para el ejercicio de su función."
  - id: c
    correct: true
    text:
      es: "La condena firme por delito doloso."
  - id: d
    text:
      es: "La incompatibilidad."
  explanation:
    es: "El artículo 48.5 enumera cuatro causas de separación y dice que «en los supuestos previstos en las letras a), b) y c) será necesaria la ratificación de la separación por las mayorías parlamentarias». Esos supuestos son el incumplimiento grave, la incapacidad sobrevenida y la incompatibilidad. La condena firme por delito doloso, el artículo 48.5.d), no la necesita."
  citation: "art. 48.5 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q055
  prompt:
    es: "Según el artículo 48.6 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, los actos y disposiciones dictados por la Presidencia de la Agencia Española de Protección de Datos:"
  options:
  - id: a
    text:
      es: "No ponen fin a la vía administrativa y son recurribles en alzada ante el Consejo de Ministros."
  - id: b
    text:
      es: "Ponen fin a la vía administrativa y solo son recurribles en reposición ante la propia Presidencia."
  - id: c
    text:
      es: "Ponen fin a la vía administrativa y son recurribles ante la Sala de lo Contencioso-administrativo del Tribunal Superior de Justicia de Madrid."
  - id: d
    correct: true
    text:
      es: "Ponen fin a la vía administrativa y son recurribles directamente ante la Sala de lo Contencioso-administrativo de la Audiencia Nacional."
  explanation:
    es: "El artículo 48.6 dice que esos actos y disposiciones «ponen fin a la vía administrativa, siendo recurribles, directamente, ante la Sala de lo Contencioso-administrativo de la Audiencia Nacional». Como ponen fin a la vía administrativa, no cabe alzada. No se limitan a la reposición. El órgano judicial es la Audiencia Nacional, no un Tribunal Superior de Justicia."
  citation: "art. 48.6 LOPDGDD"
  difficulty: 1
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-2018-16673-art-65
- id: m02-l04-q056
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuándo podrá la Agencia Española de Protección de Datos inadmitir a trámite una reclamación que ha remitido al delegado de protección de datos?"
  options:
  - id: a
    text:
      es: "Cuando el delegado de protección de datos no responda a la remisión dentro del plazo de un mes desde que la recibió."
  - id: b
    correct: true
    text:
      es: "Cuando el responsable o encargado demuestre haber adoptado medidas para cumplir la normativa aplicable."
  - id: c
    text:
      es: "Cuando el reclamante no se haya dirigido antes al delegado de protección de datos."
  - id: d
    text:
      es: "Cuando el responsable o encargado se comprometa a indemnizar al reclamante."
  explanation:
    es: "El artículo 65.4 dice que, si tras la remisión «el responsable o encargado del tratamiento demuestra haber adoptado medidas para el cumplimiento de la normativa aplicable», la Agencia «podrá inadmitir a trámite la reclamación». Si el delegado no responde en el mes, la autoridad continúa el procedimiento (artículo 37.2). Acudir antes al delegado es una opción del afectado, no un requisito. La ley no prevé un compromiso de indemnizar."
  citation: "art. 65.4 LOPDGDD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2018-16673-art-65
- id: m02-l04-q057
  prompt:
    es: "Según el artículo 65.5 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, la decisión sobre la admisión o inadmisión de una reclamación deberá notificarse al reclamante en el plazo de:"
  options:
  - id: a
    text:
      es: "Un mes."
  - id: b
    correct: true
    text:
      es: "Tres meses."
  - id: c
    text:
      es: "Dos meses."
  - id: d
    text:
      es: "Seis meses."
  explanation:
    es: "El artículo 65.5 dice que la decisión sobre la admisión o inadmisión «deberá notificarse al reclamante en el plazo de tres meses». Un mes es el plazo del delegado del artículo 37.2. Dos meses es el del artículo 37.1. Seis meses no es el plazo de esta notificación."
  citation: "art. 65.5 LOPDGDD"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2018-16673-art-65
- id: m02-l04-q058
  prompt:
    es: "Si vence el plazo sin que la Agencia notifique al reclamante la decisión sobre la admisión a trámite de su reclamación, ¿qué prevé la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    correct: true
    text:
      es: "Que prosigue la tramitación desde que se cumplen tres meses de la entrada de la reclamación en la Agencia."
  - id: b
    text:
      es: "Que prosigue la tramitación desde que se cumple un mes de la entrada de la reclamación en la Agencia."
  - id: c
    text:
      es: "Que la reclamación se entiende inadmitida y el reclamante puede acudir a la Audiencia Nacional."
  - id: d
    text:
      es: "Que prosigue la tramitación y la Agencia ya no podrá archivar la reclamación de forma expresa."
  explanation:
    es: "El artículo 65.5 dice que, sin notificación en plazo, «se entenderá que prosigue la tramitación de la reclamación […] a partir de la fecha en que se cumpliesen tres meses desde que la reclamación tuvo entrada en la Agencia». La fecha es la de los tres meses, no la de un mes. El silencio no equivale a inadmisión. La Agencia conserva la facultad de archivar después y de forma expresa."
  citation: "art. 65.5 LOPDGDD"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2018-16673-art-73
- id: m02-l04-q060
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, la contratación por un encargado del tratamiento de otros encargados sin contar con la autorización previa del responsable constituye una infracción:"
  options:
  - id: a
    text:
      es: "Leve, que prescribe al año."
  - id: b
    correct: true
    text:
      es: "Grave, que prescribe a los dos años."
  - id: c
    text:
      es: "Muy grave, que prescribe a los tres años."
  - id: d
    text:
      es: "Grave, que prescribe al año."
  explanation:
    es: "El artículo 73.l) califica como grave «la contratación por un encargado del tratamiento de otros encargados sin contar con la autorización previa del responsable», y el artículo 73 dice que las graves «prescribirán a los dos años». No es leve ni muy grave. Un año es la prescripción de las leves."
  citation: "art. 73 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2018-16673-art-78
- id: m02-l04-q061
  prompt:
    es: "Según el artículo 78.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿en qué plazo prescribe una sanción de 40.000 euros impuesta en aplicación de esa ley?"
  options:
  - id: a
    text:
      es: "A los dos años."
  - id: b
    correct: true
    text:
      es: "Al año."
  - id: c
    text:
      es: "A los tres años."
  - id: d
    text:
      es: "A los seis meses."
  explanation:
    es: "El artículo 78.1.a) dice que las sanciones «por importe igual o inferior a 40.000 euros, prescriben en el plazo de un año». Una sanción de exactamente 40.000 euros entra en ese tramo. Los dos años son para las comprendidas entre 40.001 y 300.000 euros y los tres para las superiores a 300.000. Seis meses no es un plazo del artículo."
  citation: "art. 78.1 LOPDGDD"
  difficulty: 3
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2018-16673-art-77
- id: m02-l04-q062
  prompt:
    es: "Según el artículo 77.2 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, si la Administración General del Estado comete una infracción de esa ley, la autoridad de protección de datos dictará resolución:"
  options:
  - id: a
    text:
      es: "Imponiendo la multa administrativa que corresponda, reducida a la mitad de su importe."
  - id: b
    correct: true
    text:
      es: "Declarando la infracción y, en su caso, las medidas para que cese la conducta, sin imponer multa."
  - id: c
    text:
      es: "Imponiendo la multa administrativa que corresponda, que se ingresará en el Tesoro Público."
  - id: d
    text:
      es: "Archivando las actuaciones y remitiéndolas al Defensor del Pueblo para su conocimiento."
  explanation:
    es: "El artículo 77.2 dice que la autoridad «dictará resolución declarando la infracción y estableciendo, en su caso, las medidas que proceda adoptar para que cese la conducta», con excepción de la multa administrativa del artículo 58.2.i) del RGPD. No se impone multa, ni entera ni reducida. Tampoco se archivan las actuaciones: la resolución declara la infracción."
  citation: "art. 77.2 LOPDGDD"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2018-16673-art-96
- id: m02-l04-q063
  prompt:
    es: "¿Cuál de los siguientes derechos regula el título X de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    text:
      es: "El derecho a la identidad digital."
  - id: b
    text:
      es: "El derecho al anonimato en Internet."
  - id: c
    correct: true
    text:
      es: "El derecho al testamento digital."
  - id: d
    text:
      es: "El derecho a la firma electrónica gratuita."
  explanation:
    es: "El título X, «Garantía de los derechos digitales», regula en su artículo 96 el «Derecho al testamento digital». La identidad digital, el anonimato en Internet y la firma electrónica gratuita no figuran entre los derechos de los artículos 80 a 97."
  citation: "art. 96.1.a) LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-88
- id: m02-l04-q064
  prompt:
    es: "Según el artículo 88.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, los empleados públicos tienen derecho a la desconexión digital para garantizar, fuera del tiempo de trabajo:"
  options:
  - id: a
    text:
      es: "El respeto de su tiempo de descanso, salvo durante los permisos y las vacaciones."
  - id: b
    correct: true
    text:
      es: "El respeto de su tiempo de descanso, permisos y vacaciones, y de su intimidad personal y familiar."
  - id: c
    text:
      es: "La compensación económica de las comunicaciones atendidas durante su descanso."
  - id: d
    text:
      es: "El respeto de su tiempo de descanso, solo si lo prevé la negociación colectiva."
  explanation:
    es: "El artículo 88.1 reconoce la desconexión digital «a fin de garantizar, fuera del tiempo de trabajo legal o convencionalmente establecido, el respeto de su tiempo de descanso, permisos y vacaciones, así como de su intimidad personal y familiar». Los permisos y las vacaciones están incluidos. El derecho no es una compensación económica. No depende de que lo prevea la negociación colectiva."
  citation: "art. 88.1 LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2018-16673-art-89
- id: m02-l04-q065
  prompt:
    es: "¿En cuál de los siguientes lugares prohíbe en todo caso la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales instalar sistemas de videovigilancia o de grabación de sonidos?"
  options:
  - id: a
    text:
      es: "En los vestíbulos de acceso al centro de trabajo."
  - id: b
    text:
      es: "En los aparcamientos del centro de trabajo."
  - id: c
    correct: true
    text:
      es: "En los comedores destinados al descanso de los empleados públicos."
  - id: d
    text:
      es: "En las zonas de atención al público del centro."
  explanation:
    es: "El artículo 89.2 dice que «en ningún caso se admitirá» la instalación de esos sistemas «en lugares destinados al descanso o esparcimiento de los trabajadores o los empleados públicos, tales como vestuarios, aseos, comedores y análogos». Los vestíbulos, los aparcamientos y las zonas de atención al público no son lugares de descanso o esparcimiento."
  citation: "art. 89.2 LOPDGDD"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-96
- id: m02-l04-q066
  prompt:
    es: "Según el artículo 96.1.a) de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, si el fallecido prohibió expresamente el acceso a sus contenidos en servicios de la sociedad de la información, esa prohibición:"
  options:
  - id: a
    text:
      es: "Impide a los herederos todo acceso, incluso a los contenidos que formen parte del caudal relicto."
  - id: b
    text:
      es: "Solo es eficaz si consta en un testamento otorgado ante notario."
  - id: c
    correct: true
    text:
      es: "No afecta al derecho de los herederos a acceder a los contenidos que formen parte del caudal relicto."
  - id: d
    text:
      es: "Puede dejarse sin efecto por las personas vinculadas al fallecido por razones de hecho."
  explanation:
    es: "El artículo 96.1.a) dice que esa prohibición «no afectará al derecho de los herederos a acceder a los contenidos que pudiesen formar parte del caudal relicto». No impide todo acceso. La ley no exige testamento notarial para la prohibición. Las personas vinculadas por razones de hecho quedan sujetas a ella; no pueden dejarla sin efecto."
  citation: "art. 96.1.a) LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q067
  prompt:
    es: "Según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿qué papel tiene la Comisión de Justicia del Congreso en la designación de la Presidencia de la Agencia Española de Protección de Datos?"
  options:
  - id: a
    text:
      es: "Emite un informe no vinculante sobre la propuesta del Gobierno, que es quien nombra."
  - id: b
    text:
      es: "Elabora una terna de candidatos entre los que el Gobierno elige después a quien nombra."
  - id: c
    text:
      es: "Recibe la comunicación del nombramiento una vez publicado el real decreto."
  - id: d
    correct: true
    text:
      es: "Ratifica la propuesta del Gobierno, que es quien nombra a la Presidencia."
  explanation:
    es: "El artículo 48.3 dice que la Presidencia y su Adjunto «serán nombrados por el Gobierno» y que la propuesta del Gobierno «deberá ser ratificada por la Comisión de Justicia». La Comisión no se limita a un informe no vinculante: sin su ratificación no hay nombramiento. No elabora ninguna terna, porque la propuesta es del Gobierno. Tampoco interviene solo después del real decreto: su ratificación es previa."
  citation: "art. 48.3 LOPDGDD"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2018-16673-art-48
- id: m02-l04-q068
  prompt:
    es: "Según el artículo 48.3 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, la Presidencia de la Agencia Española de Protección de Datos y su Adjunto se nombran:"
  options:
  - id: a
    text:
      es: "Entre funcionarios de carrera del subgrupo A1 con al menos diez años de servicios prestados."
  - id: b
    correct: true
    text:
      es: "Entre personas de reconocida competencia profesional, en particular en protección de datos."
  - id: c
    text:
      es: "Entre magistrados y fiscales con más de quince años de ejercicio profesional acreditado en la materia."
  - id: d
    text:
      es: "Entre los titulares de los órganos directivos de la Agencia con nivel de subdirección general."
  explanation:
    es: "El artículo 48.3 dice que la Presidencia y su Adjunto se nombran «entre personas de reconocida competencia profesional, en particular en materia de protección de datos». La ley no exige ser funcionario del subgrupo A1 ni magistrado o fiscal. Tampoco limita el nombramiento a quienes ya dirigen órganos de la Agencia."
  citation: "art. 48.3 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
