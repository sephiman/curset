# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q119
  prompt:
    es: "En Windows 11, para conectar Windows Search con una cuenta de Microsoft o una cuenta profesional, ¿en cuál de las siguientes secciones de Configuración se agrega la cuenta?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuentas usadas por otras aplicaciones"
  - id: b
    text:
      es: "Cuentas conectadas"
  - id: c
    text:
      es: "Opciones de inicio de sesión"
  - id: d
    text:
      es: "Encontrar mis archivos"
  explanation:
    es: "La página indica que, para conectar Windows Search con las cuentas, en «Cuentas usadas por otras aplicaciones» se elige «Agregar una cuenta de Microsoft» o «Agregar una cuenta profesional o educativa». «Cuentas conectadas» es donde se ve, desde Opciones del panel de búsqueda, qué cuentas están conectadas. «Opciones de inicio de sesión» son las formas de iniciar sesión. «Encontrar mis archivos» elige el modo de indexación."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «En Cuentas usadas por otras aplicaciones, selecciona una opción:»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q120
  prompt:
    es: "En Windows 11, en la configuración de permisos de búsqueda, ¿qué botón del apartado Historial borra el historial de búsqueda guardado en el dispositivo?"
  options:
  - id: a
    text:
      es: "Personalizar ubicaciones de búsqueda"
  - id: b
    correct: true
    text:
      es: "Borrar historial de búsqueda de dispositivos"
  - id: c
    text:
      es: "Quitar del acceso rápido"
  - id: d
    text:
      es: "Borrar historial de búsqueda en la nube"
  explanation:
    es: "La página indica que, en Historial, se selecciona el botón «Borrar historial de búsqueda de dispositivos». «Personalizar ubicaciones de búsqueda» abre las opciones de indexación. «Quitar del acceso rápido» quita archivos de Acceso rápido en Windows 10. El historial asociado a la cuenta de Microsoft se ve y se elimina en el Panel de privacidad de Microsoft, no con un botón de ese nombre."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Historial de búsqueda en este dispositivo»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q121
  prompt:
    es: "En Windows 11, en la Búsqueda segura de Windows Search, ¿qué ocurre si se selecciona Estricto según la ayuda de Microsoft sobre búsqueda y privacidad?"
  options:
  - id: a
    text:
      es: "Bing usa la configuración SafeSearch de la página de Bing.com"
  - id: b
    text:
      es: "Windows Search deja de mostrar resultados web"
  - id: c
    correct: true
    text:
      es: "La configuración se comparte con Bing en el explorador"
  - id: d
    text:
      es: "Se ocultan los resultados de OneDrive y Outlook"
  explanation:
    es: "La página dice que, si se selecciona Estricto, la configuración se comparte con Bing en el explorador, y Bing respeta Estricto con independencia de lo fijado en Bing.com. Usar la configuración SafeSearch de Bing.com es lo que ocurre con Moderado o Desactivado. Búsqueda segura mantiene el contenido adulto fuera de las vistas previas; no quita los resultados web ni los de OneDrive y Outlook."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda segura»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q122
  prompt:
    es: "En Windows 11, ¿desde cuál de las siguientes ubicaciones del Explorador de archivos indica Microsoft que se busquen archivos relevantes del PC y de la nube?"
  options:
  - id: a
    text:
      es: "Desde la Papelera de reciclaje del escritorio"
  - id: b
    text:
      es: "Desde la carpeta Red del panel de navegación"
  - id: c
    text:
      es: "Desde el cuadro Carpeta de Asignar unidad de red"
  - id: d
    correct: true
    text:
      es: "Desde Inicio del Explorador de archivos"
  explanation:
    es: "La página dice que, para buscar archivos relevantes desde el PC y la nube, se busca desde Inicio del Explorador de archivos. La Papelera de reciclaje guarda lo eliminado. Red muestra los dispositivos de la red que comparten archivos. El cuadro Carpeta de Asignar unidad de red recibe la ruta de la carpeta que se conecta como unidad."
  citation: "fuente: `ms-win-explorador.html`; «Explorador de archivos en Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q123
  prompt:
    es: "En Windows 11, para habilitar la búsqueda en la nube desde Inicio del Explorador de archivos, ¿en qué apartado de Configuración se inicia sesión en las cuentas en la nube?"
  options:
  - id: a
    correct: true
    text:
      es: "Configuración › Cuentas"
  - id: b
    text:
      es: "Configuración › Sistema › Acerca de"
  - id: c
    text:
      es: "Configuración › Sistema › Multitarea"
  - id: d
    text:
      es: "Configuración › Personalización › Temas"
  explanation:
    es: "La nota de la página dice que se inicia sesión en las cuentas en la nube desde Inicio › Configuración › Cuentas para habilitar la búsqueda en la nube. «Acerca de» muestra los datos del dispositivo, «Multitarea» los ajustes de ventanas y escritorios y «Temas» la apariencia del escritorio."
  citation: "fuente: `ms-win-explorador.html`; «Inicie sesión en sus cuentas en la nube desde Inicio>Configuración>Cuentas para habilitar la búsqueda en la nube.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q124
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft sobre búsqueda y privacidad, ¿qué permite hacer la Búsqueda segura de Windows Search?"
  options:
  - id: a
    correct: true
    text:
      es: "Mantener el contenido adulto fuera de las vistas previas de sitios web"
  - id: b
    text:
      es: "Borrar el historial de búsqueda guardado en el dispositivo"
  - id: c
    text:
      es: "Elegir si se busca en Documentos, Imágenes y Música o en todo el PC"
  - id: d
    text:
      es: "Conectar Windows Search con la cuenta profesional o educativa"
  explanation:
    es: "La página dice que Búsqueda segura «permite mantener el contenido adulto fuera de las vistas previas de sitios web». Borrar el historial del dispositivo es el botón del apartado Historial. Elegir entre Documentos, Imágenes y Música o todo el equipo se hace en la página Buscar en Windows. Conectar la cuenta profesional se hace en Cuentas usadas por otras aplicaciones."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda segura»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q125
  prompt:
    es: "En Windows 11, tras seleccionar el icono de lupa de la barra de tareas y, en la esquina superior derecha, Opciones, ¿qué aparece en «Cuentas conectadas»?"
  options:
  - id: a
    text:
      es: "La lista de carpetas indexadas del equipo"
  - id: b
    text:
      es: "El historial de búsqueda guardado con la cuenta de Microsoft"
  - id: c
    text:
      es: "Los dispositivos de la red que comparten archivos"
  - id: d
    correct: true
    text:
      es: "El nombre y el tipo de cada cuenta conectada a Windows Search"
  explanation:
    es: "La página dice que, en Opciones, «el nombre de cuenta y el tipo de cuenta aparecen en Cuentas conectadas». Las ubicaciones indexadas se ven con Modificar, en Personalizar ubicaciones de búsqueda. El historial asociado a la cuenta de Microsoft se ve en el Panel de privacidad de Microsoft. Los dispositivos de la red que comparten archivos se ven en Red."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda de contenido en la nube»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q126
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft sobre búsqueda y privacidad, ¿qué puede ocurrir al elegir buscar en todo el equipo?"
  options:
  - id: a
    text:
      es: "Que mejore la duración de la batería y se reduzca el consumo de CPU"
  - id: b
    text:
      es: "Que se desactive la búsqueda en las carpetas de usuario"
  - id: c
    text:
      es: "Que la indexación se limite a Documentos, Imágenes y Música"
  - id: d
    correct: true
    text:
      es: "Que se afecten la duración de la batería y el consumo de CPU"
  explanation:
    es: "La página dice: «Buscar en todo el equipo puede afectar a la duración de la batería y al consumo de CPU». Mejorar la batería y reducir la CPU es lo contrario. El modo que indexa todo el equipo incluye todas las carpetas y archivos de usuario, así que no desactiva la búsqueda en ellas. Documentos, Imágenes y Música son las carpetas del modo Clásico."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda en Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q127
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿dónde se almacenan los datos que recopila la indexación semántica, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "En OneDrive, para sincronizarlos con los demás dispositivos del usuario"
  - id: b
    text:
      es: "En los servidores de Microsoft, para entrenar modelos de inteligencia artificial"
  - id: c
    correct: true
    text:
      es: "De forma local en el equipo, sin enviarlos a Microsoft"
  - id: d
    text:
      es: "En la cuenta de Microsoft del usuario, junto con el historial de búsqueda"
  explanation:
    es: "La página dice que los datos de la indexación semántica «se almacenan localmente en el equipo» y que «ninguno de ellos se envía a Microsoft ni se utiliza para entrenar modelos de inteligencia artificial». Eso descarta los servidores de Microsoft para entrenar modelos y la cuenta de Microsoft con el historial de búsqueda, porque ningún dato sale a Microsoft. OneDrive para sincronizar con otros dispositivos es también un envío fuera del equipo, que choca con que se almacenen localmente."
  citation: "fuente: `ms-win-indexacion.html`; «¿Dónde se almacena la información del índice?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l07-q256
  prompt:
    es: "En Windows 11, en la configuración de la barra de tareas, ¿qué muestra la opción «Icono y etiqueta de búsqueda» del menú del área de búsqueda?"
  options:
  - id: a
    text:
      es: "Solo el icono de búsqueda, sin etiqueta"
  - id: b
    text:
      es: "Un cuadro de texto completo para escribir la búsqueda"
  - id: c
    correct: true
    text:
      es: "Un icono de búsqueda junto con la etiqueta «Buscar»"
  - id: d
    text:
      es: "Nada: quita la búsqueda de la barra de tareas"
  explanation:
    es: "Icono y etiqueta de búsqueda muestra un icono junto con la etiqueta «Buscar». El cuadro de texto completo es la opción Cuadro de búsqueda, solo el icono es Solo el icono de búsqueda y quitar la búsqueda es Ocultar."
  citation: "fuente: `ms-win-barra-tareas.html`; «Búsqueda»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l07-q258
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes NO es una opción del menú que configura el área de búsqueda de la barra de tareas?"
  options:
  - id: a
    text:
      es: "Solo el icono de búsqueda"
  - id: b
    correct: true
    text:
      es: "Solo la etiqueta de búsqueda"
  - id: c
    text:
      es: "Ocultar"
  - id: d
    text:
      es: "Cuadro de búsqueda"
  explanation:
    es: "El menú ofrece Cuadro de búsqueda, Icono y etiqueta de búsqueda, Solo el icono de búsqueda y Ocultar. No hay una opción que muestre solo la etiqueta."
  citation: "fuente: `ms-win-barra-tareas.html`; «Búsqueda»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l07-q259
  prompt:
    es: "En Windows 11, ¿dónde se configura si la barra de tareas muestra el cuadro de búsqueda, solo el icono o nada?"
  options:
  - id: a
    correct: true
    text:
      es: "En Configuración de la barra de tareas, con clic derecho en la barra"
  - id: b
    text:
      es: "En Configuración › Privacidad & seguridad › Buscar en Windows"
  - id: c
    text:
      es: "En Opciones de indexación › Avanzadas"
  - id: d
    text:
      es: "En Configuración › Sistema › Multitarea"
  explanation:
    es: "La búsqueda de la barra se configura con clic derecho en la barra de tareas y Configuración de la barra de tareas. Buscar en Windows decide qué se indexa, Multitarea regula los escritorios y la ventana Opciones de indexación controla los tipos de archivo del índice."
  citation: "fuente: `ms-win-barra-tareas.html`; «Búsqueda»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l07-q260
  prompt:
    es: "En Windows 11, además del cuadro de búsqueda de la barra de tareas y de Windows+S, ¿qué otra forma indica Microsoft para iniciar una búsqueda con Windows Search?"
  options:
  - id: a
    text:
      es: "Abrir el Explorador de archivos y pulsar F5 para actualizar la ventana"
  - id: b
    correct: true
    text:
      es: "Abrir el menú Inicio y escribir la consulta directamente"
  - id: c
    text:
      es: "Abrir Configuración y seleccionar Windows Update para buscar actualizaciones"
  - id: d
    text:
      es: "Pulsar Windows+Tab para abrir la Vista de tareas y escribir la consulta"
  explanation:
    es: "También se puede iniciar una búsqueda abriendo el menú Inicio y escribiendo la consulta. F5 solo actualiza la ventana del Explorador, Windows Update gestiona actualizaciones y Windows+Tab abre la Vista de tareas."
  citation: "fuente: `ms-win-barra-tareas.html`; «Búsqueda»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q264
  prompt:
    es: "En Windows 11, con la Búsqueda segura de Windows Search, ¿qué ocurre si se selecciona Moderado o Desactivado, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "La configuración se comparte con Bing en el explorador y se aplica siempre"
  - id: b
    text:
      es: "Se bloquean todas las vistas previas de sitios web de la búsqueda"
  - id: c
    text:
      es: "Se borra el historial de búsqueda guardado en el dispositivo y en la nube"
  - id: d
    correct: true
    text:
      es: "Bing usa de forma predeterminada su propia configuración de SafeSearch de Bing.com"
  explanation:
    es: "Con Moderado o Desactivado, Bing usa de forma predeterminada su propia configuración de SafeSearch. Compartir la configuración con Bing en el explorador es lo que ocurre con Estricto, y bloquear vistas previas o borrar el historial no son efectos de esas opciones."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda segura»"
  difficulty: 3
  tags:
  - "configuración"
