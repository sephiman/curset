# anchor: boe-a-2017-12902-art-100
- id: m05-l03-q048
  prompt:
    es: "¿Cuál de las siguientes definiciones del presupuesto base de licitación es la que recoge la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, excluido el IVA, salvo disposición en contrario."
  - id: b
    text:
      es: "El precio ofertado por el adjudicatario en su proposición, incluido el IVA, salvo disposición en contrario."
  - id: c
    correct: true
    text:
      es: "El límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el IVA, salvo disposición en contrario."
  - id: d
    text:
      es: "El importe mínimo de gasto que el órgano de contratación debe comprometer en el contrato, incluido el IVA."
  explanation:
    es: "El artículo 100.1 define el presupuesto base de licitación como el límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el IVA, salvo disposición en contrario. Excluir el IVA contradice el texto. El precio ofertado se conoce tras la licitación y no es el presupuesto base. Hablar de un importe mínimo cambia un límite máximo por un suelo."
  citation: "art. 100.1 LCSP"
  difficulty: 3
  tags:
