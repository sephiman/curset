# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0038
  prompt:
    es: "La Administración valora en 100.000 euros los bienes embargados a Pinturas Delta, S.L. y el perito del obligado en 130.000 euros. Según el artículo 97.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué debe hacer el órgano de recaudación?"
  options:
  - id: a
    text:
      es: "Estimar como valor de los bienes los 130.000 euros, porque se toma la tasación más alta."
  - id: b
    text:
      es: "Estimar como valor los 100.000 euros, porque la valoración de la Administración se presume correcta."
  - id: c
    text:
      es: "Solicitar de inmediato una nueva valoración por perito, sin convocar antes al obligado."
  - id: d
    correct: true
    text:
      es: "Convocar al obligado al pago para dirimir las diferencias, porque la diferencia es del 30 por ciento de la valoración menor."
  explanation:
    es: "La diferencia es de 30.000 euros, el 30 por ciento de la menor, y excede del 20 por ciento. El artículo 97.3 RGR dispone entonces convocar al obligado para dirimir las diferencias; si hay acuerdo, el valor acordado es el aplicable. Tomar la tasación más alta vale solo hasta el 20 por ciento. La nueva valoración por perito solo se pide cuando no hay acuerdo (art. 97.4 RGR), y la valoración de la Administración no se presume correcta."
  citation: "art. 97.3 RGR"
  difficulty: 3
  tags:
  - "cómputo"
  - "procedimiento"
# anchor: boe-a-2005-14803-art-97
- id: m03-l12-q0039
  prompt:
    es: "Cuando no hay acuerdo entre el obligado y el órgano de recaudación sobre la valoración, el artículo 97.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que el órgano de recaudación solicitará una nueva valoración por perito adecuado, en plazo no superior a:"
  options:
  - id: a
    correct: true
    text:
      es: "15 días, que debe estar comprendida entre los límites de las efectuadas anteriormente."
  - id: b
    text:
      es: "10 días, que debe coincidir con la media de las valoraciones anteriores."
  - id: c
    text:
      es: "15 días, que puede fijarse libremente por encima o por debajo de las valoraciones anteriores."
  - id: d
    text:
      es: "un mes, que debe estar comprendida entre los límites de las efectuadas anteriormente."
  explanation:
    es: "La nueva valoración se pide en un plazo no superior a 15 días y debe quedar entre los límites de las anteriores, y es la definitivamente aplicable (art. 97.4 RGR). No se fija libremente, ni se limita a una media, y el plazo no es de un mes ni de 10 días."
