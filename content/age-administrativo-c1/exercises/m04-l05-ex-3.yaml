# anchor: boe-a-1995-8729-art-42
- id: m04-l05-q052
  prompt:
    es: "La convocatoria de un concurso de la Administración General del Estado se publica en el «Boletín Oficial del Estado» el jueves, 22 de enero de 2026. Sin festivos en el periodo, ¿cuál es el último día para presentar la solicitud?"
  options:
  - id: a
    text:
      es: "El viernes, 6 de febrero de 2026."
  - id: b
    text:
      es: "El miércoles, 11 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El jueves, 12 de febrero de 2026."
  - id: d
    text:
      es: "El viernes, 13 de febrero de 2026."
  explanation:
    es: "El artículo 42.2 RD 364/1995 da «quince días hábiles, contados a partir del siguiente al de la publicación de la convocatoria». El cómputo empieza el viernes 23 de enero. Sin sábados, domingos ni festivos, los días hábiles 1 a 15 van del viernes 23 de enero al jueves 12 de febrero de 2026. El viernes 6 de febrero sale de contar quince días naturales. El miércoles 11 de febrero sale de contar el propio día de publicación. El viernes 13 de febrero añade un día hábil de más."
  citation: "art. 42.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-53
- id: m04-l05-q053
  prompt:
    es: "La convocatoria de un puesto de libre designación de un Ministerio se publica en el «Boletín Oficial del Estado» el sábado, 7 de febrero de 2026. Sin festivos en el periodo, ¿hasta qué día pueden presentarse las solicitudes?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 20 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el lunes, 23 de febrero de 2026."
  - id: c
    text:
      es: "Hasta el jueves, 26 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "Hasta el viernes, 27 de febrero de 2026."
  explanation:
    es: "El artículo 53 RD 364/1995 da «quince días hábiles siguientes al de la publicación de la convocatoria». El domingo 8 no es hábil, así que el primer día hábil es el lunes 9 de febrero. Excluidos sábados y domingos, el decimoquinto día hábil es el viernes 27 de febrero de 2026. El viernes 20 de febrero solo recoge diez días hábiles. El lunes 23 de febrero sale de contar quince días naturales y pasar al lunes el domingo 22. El jueves 26 de febrero se queda en catorce días hábiles, como si el plazo empezara el sábado."
  citation: "art. 53 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-47
- id: m04-l05-q054
  prompt:
    es: "El plazo de solicitudes de un concurso de la Administración General del Estado terminó el viernes, 13 de febrero de 2026. La convocatoria guarda silencio sobre el plazo de resolución. Si el concurso se resuelve el martes, 14 de abril de 2026, ¿se ha resuelto en plazo?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo de dos meses termina el martes, 14 de abril de 2026."
  - id: b
    correct: true
    text:
      es: "No, porque el plazo de dos meses terminó el lunes, 13 de abril de 2026."
  - id: c
    text:
      es: "Sí, porque el plazo para resolver es de tres meses y termina el 13 de mayo."
  - id: d
    text:
      es: "No, porque el plazo de un mes terminó el viernes, 13 de marzo de 2026."
  explanation:
    es: "El artículo 47.1 RD 364/1995 da dos meses «contados desde el día siguiente al de la finalización del de la presentación de solicitudes», salvo otro de la convocatoria, que aquí no lo fija. Con la regla de los plazos en meses del artículo 30.4 LPAC, el cómputo empieza el sábado 14 de febrero y termina el mismo día del mes de vencimiento: el lunes 13 de abril de 2026. El martes 14 de abril ya está fuera. Contar hasta el 14 añade un día al plazo. El plazo no es de tres meses ni de un mes."
  citation: "art. 47.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-47
- id: m04-l05-q055
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, si la convocatoria de un concurso se publica en el BOE el lunes, 18 de enero de 2027, sin festivos en el plazo de solicitudes y sin plazo propio de resolución, ¿hasta qué día puede resolverse?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 8 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el lunes, 8 de marzo de 2027."
  - id: c
    text:
      es: "Hasta el jueves, 18 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "Hasta el jueves, 8 de abril de 2027."
  explanation:
    es: "Primero, el plazo de solicitudes: quince días hábiles desde el día siguiente a la publicación (artículo 42.2 RD 364/1995). Empieza el martes 19 de enero y, excluidos sábados y domingos, termina el lunes 8 de febrero de 2027. Después, el artículo 47.1 da dos meses «contados desde el día siguiente al de la finalización del de la presentación de solicitudes». Con el artículo 30.4 LPAC terminan el mismo día del mes de vencimiento: el jueves 8 de abril de 2027. El lunes 8 de febrero es el final del plazo de solicitudes, no el de resolución. El lunes 8 de marzo es un solo mes. El jueves 18 de marzo cuenta los dos meses desde la publicación."
  citation: "art. 47.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q056
  prompt:
    es: "Un Ministerio publica en el BOE la convocatoria de un concurso el jueves, 21 de enero de 2027. Sin festivos en el periodo, ¿hasta qué fecha puede una funcionaria completar los dos años en su puesto de destino definitivo para poder participar?"
  options:
  - id: a
    text:
      es: "Hasta la fecha en que se publique en el BOE la resolución del concurso."
  - id: b
    text:
      es: "Hasta el jueves, 21 de enero de 2027, fecha de publicación de la convocatoria."
  - id: c
    text:
      es: "Hasta el viernes, 5 de febrero de 2027, fecha final del plazo de solicitudes."
  - id: d
    correct: true
    text:
      es: "Hasta el jueves, 11 de febrero de 2027, fecha final del plazo de solicitudes."
  explanation:
    es: "El artículo 41.1 RD 364/1995 exige reunir los requisitos «en la fecha que termine el plazo de presentación de las solicitudes de participación», y la permanencia de dos años del artículo 41.2 es uno de ellos. El plazo es de quince días hábiles desde el día siguiente a la publicación (artículo 42.2): empieza el viernes 22 de enero y, excluidos sábados y domingos, termina el jueves 11 de febrero de 2027. El viernes 5 de febrero sale de contar quince días naturales. La fecha de publicación es anterior a la de referencia, y la de la resolución, posterior."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-54
- id: m04-l05-q057
  prompt:
    es: "Para nombrar por libre designación a un funcionario de otro Departamento, se pide a este su informe el lunes, 2 de febrero de 2026. El jueves, 19 de febrero de 2026, sigue sin emitirlo. ¿Cuál es la situación?"
  options:
  - id: a
    correct: true
    text:
      es: "El informe se considera favorable, porque han pasado los quince días naturales."
  - id: b
    text:
      es: "El plazo aún no ha terminado, porque son quince días hábiles y acaban el día 23."
  - id: c
    text:
      es: "El informe se considera desfavorable, y el nombramiento exige una autorización."
  - id: d
    text:
      es: "El nombramiento no puede hacerse hasta que el Departamento emita su informe."
  explanation:
    es: "El artículo 54.1 RD 364/1995 dice que, si el informe del otro Departamento no se emite «en el plazo de quince días naturales se considerará favorable». Contados desde el martes 3 de febrero, los quince días naturales terminan el martes 17 de febrero de 2026. El jueves 19 el plazo ya ha pasado y el informe se tiene por favorable. Los quince días hábiles terminarían el lunes 23, pero el artículo dice naturales. El silencio no equivale a informe desfavorable, y el nombramiento no queda a la espera del informe."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
  - "cómputo"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q059
  prompt:
    es: "La resolución de un concurso de la Administración General del Estado se publica en el BOE el jueves, 21 de mayo de 2026. Sin diferimiento del cese ni festivos en el periodo, ¿cuál es el último día para cesar en el puesto anterior?"
  options:
  - id: a
    text:
      es: "El lunes, 25 de mayo de 2026."
  - id: b
    correct: true
    text:
      es: "El martes, 26 de mayo de 2026."
  - id: c
    text:
      es: "El miércoles, 27 de mayo de 2026."
  - id: d
    text:
      es: "El lunes, 22 de junio de 2026."
  explanation:
    es: "El artículo 48.1 RD 364/1995 dice que el cese «deberá efectuarse dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso». Los días hábiles siguientes al jueves 21 son el viernes 22, el lunes 25 y el martes 26 de mayo de 2026. El lunes 25 sale de contar el propio día de publicación. El miércoles 27 es el cuarto día hábil. El lunes 22 de junio aplica un mes, que es un plazo de toma de posesión, no de cese."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q060
  prompt:
    es: "Un funcionario obtiene por concurso un puesto en su misma localidad. La resolución se publica en el BOE el jueves, 19 de noviembre de 2026. Si apura al máximo el cese, sin festivos en el periodo, ¿cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El martes, 24 de noviembre de 2026."
  - id: b
    text:
      es: "El jueves, 26 de noviembre de 2026."
  - id: c
    correct: true
    text:
      es: "El viernes, 27 de noviembre de 2026."
  - id: d
    text:
      es: "El jueves, 24 de diciembre de 2026."
  explanation:
    es: "El artículo 48.1 RD 364/1995 encadena dos plazos. El cese se hace dentro de los tres días hábiles siguientes a la publicación: viernes 20, lunes 23 y martes 24 de noviembre. Sin cambio de residencia, la toma de posesión tiene tres días hábiles «a partir del día siguiente al del cese»: miércoles 25, jueves 26 y viernes 27 de noviembre de 2026. El martes 24 es el último día de cese, no de posesión. El jueves 26 cuenta el día del cese como primero. El jueves 24 de diciembre aplica un mes, que solo corresponde con cambio de residencia."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q061
  prompt:
    es: "Una funcionaria cesa el viernes, 23 de octubre de 2026, en su puesto para incorporarse al obtenido por concurso en la misma localidad, y toma posesión el jueves, 29 de octubre. Sin festivos en el periodo, ¿lo hace en plazo?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo de tres días hábiles termina el jueves, 29 de octubre de 2026."
  - id: b
    text:
      es: "Sí, porque el plazo es de un mes y termina el lunes, 23 de noviembre de 2026."
  - id: c
    correct: true
    text:
      es: "No, porque el plazo de tres días hábiles terminó el miércoles, 28 de octubre de 2026."
  - id: d
    text:
      es: "No, porque el plazo de tres días naturales terminó el lunes, 26 de octubre de 2026."
  explanation:
    es: "Sin cambio de residencia, el artículo 48.1 RD 364/1995 da tres días hábiles, contados «a partir del día siguiente al del cese». Excluidos sábado y domingo, son el lunes 26, el martes 27 y el miércoles 28 de octubre de 2026. El jueves 29 está fuera de plazo. Llegar al jueves supone contar un cuarto día hábil. El mes es para el cambio de residencia o el reingreso. Los días no son naturales sino hábiles."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q062
  prompt:
    es: "Un funcionario cesa el lunes, 31 de mayo de 2027, y su nuevo destino, obtenido por concurso, implica cambio de residencia, sin prórroga de incorporación. Si toma posesión el jueves, 1 de julio de 2027, ¿lo hace en plazo?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo de un mes se cuenta desde el día siguiente y acaba el 1 de julio."
  - id: b
    correct: true
    text:
      es: "No, porque al no haber día 31 en junio, el plazo terminó el miércoles, 30 de junio."
  - id: c
    text:
      es: "Sí, porque el plazo de un mes se cuenta en días hábiles y aún no ha terminado."
  - id: d
    text:
      es: "No, porque el plazo era de tres días hábiles y terminó el jueves, 3 de junio de 2027."
  explanation:
    es: "Con cambio de residencia, el artículo 48.1 RD 364/1995 da un mes a partir del día siguiente al del cese. El artículo 48 no dice cómo se computa el mes; con el artículo 30.4 LPAC termina el mismo día del cese en el mes de vencimiento o, si no hay día equivalente, el último día del mes. Junio no tiene día 31, así que el plazo terminó el miércoles 30 de junio de 2027 y el 1 de julio está fuera. Contar hasta el 1 de julio desplaza el final. Los plazos en meses no se cuentan en días hábiles. Los tres días hábiles corresponden al destino sin cambio de residencia."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q063
  prompt:
    es: "Una funcionaria en excedencia obtiene por concurso un puesto que comporta su reingreso al servicio activo. La resolución se publica en el BOE el martes, 14 de abril de 2026. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El viernes, 17 de abril de 2026."
  - id: b
    text:
      es: "El miércoles, 29 de abril de 2026."
  - id: c
    text:
      es: "El miércoles, 13 de mayo de 2026."
  - id: d
    correct: true
    text:
      es: "El jueves, 14 de mayo de 2026."
  explanation:
    es: "El artículo 48.1 RD 364/1995 da un mes cuando el destino comporta el reingreso al servicio activo, y en ese caso el plazo «deberá computarse desde dicha publicación». Con el artículo 30.4 LPAC, el mes empieza el día siguiente, miércoles 15 de abril, y termina el mismo día de la publicación en el mes de vencimiento: el jueves 14 de mayo de 2026. El viernes 17 de abril aplica tres días hábiles, plazo del destino sin cambio de residencia ni reingreso. El miércoles 29 de abril sale de contar quince días naturales, un plazo que el artículo no da. El miércoles 13 de mayo deja el plazo un día corto."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q065
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, si el nuevo destino implica cambio de residencia y el interesado lo solicita por razones justificadas, la prórroga de incorporación podrá alcanzar:"
  options:
  - id: a
    correct: true
    text:
      es: "un máximo de veinte días hábiles."
  - id: b
    text:
      es: "un máximo de veinte días naturales."
  - id: c
    text:
      es: "un máximo de diez días hábiles."
  - id: d
    text:
      es: "un máximo de un mes adicional."
  explanation:
    es: "El artículo 48.2 permite al Subsecretario del Departamento del nuevo destino conceder «una prórroga de incorporación hasta un máximo de veinte días hábiles» si el destino implica cambio de residencia y el interesado lo solicita por razones justificadas. Veinte días naturales cambia la clase de días: el apartado dice hábiles. Diez días hábiles rebaja la cifra: el apartado dice veinte. Un mes adicional cambia la unidad y la cifra del tercer párrafo, que fija días hábiles y un máximo de veinte."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2023-23537-art-22
- id: m04-l05-q066
  prompt:
    es: "Según el artículo 22.3 del Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales, la Secretaría de Estado de Función Pública es un órgano superior del:"
  options:
  - id: a
    text:
      es: "Ministerio de Hacienda, junto a la Secretaría de Estado de Presupuestos y Gastos."
  - id: b
    text:
      es: "Ministerio de Política Territorial y Memoria Democrática."
  - id: c
    text:
      es: "Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    correct: true
    text:
      es: "Ministerio para la Transformación Digital y de la Función Pública."
  explanation:
    es: "El artículo 22.3 RD 829/2023 estructura el Ministerio para la Transformación Digital y de la Función Pública en tres órganos superiores, y la letra c) es «La Secretaría de Estado de Función Pública». Ni el Ministerio de Hacienda, ni el de Política Territorial y Memoria Democrática, ni el de la Presidencia, Justicia y Relaciones con las Cortes la tienen entre sus órganos superiores."
  citation: "art. 22.3.c) RD 829/2023"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q067
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre el inicio del plazo de toma de posesión en un destino sin reingreso al servicio activo es correcta?"
  options:
  - id: a
    text:
      es: "Empieza a contarse siempre desde la publicación de la resolución en el BOE."
  - id: b
    text:
      es: "Empieza a contarse desde la notificación personal de la resolución al funcionario."
  - id: c
    correct: true
    text:
      es: "Empieza a contarse a partir del día siguiente al del cese en el puesto anterior."
  - id: d
    text:
      es: "Empieza a contarse desde el mismo día del cese en el puesto anterior."
  explanation:
    es: "El artículo 48.1 RD 364/1995 dice que el plazo de toma de posesión «empezará a contarse a partir del día siguiente al del cese». La publicación de la resolución es el punto de partida solo cuando el destino comporta el reingreso al servicio activo. El artículo no cuenta el plazo desde una notificación personal. Tampoco desde el mismo día del cese, sino desde el siguiente."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q068
  prompt:
    es: "En la Administración General del Estado, el desempeño provisional de un puesto que se atribuye al funcionario removido del que obtuvo por concurso se mantiene:"
  options:
  - id: a
    text:
      es: "un año como máximo, prorrogable por otro año más."
  - id: b
    correct: true
    text:
      es: "en tanto no obtenga otro puesto con carácter definitivo."
  - id: c
    text:
      es: "seis meses, tras los que pasa a expectativa de destino."
  - id: d
    text:
      es: "hasta que se resuelva el siguiente concurso del Departamento."
  explanation:
    es: "El artículo 50.5 RD 364/1995 atribuye al removido el desempeño provisional de un puesto «en tanto no obtengan otro con carácter definitivo». No tiene un plazo fijo. El año prorrogable por otro es la duración máxima de la comisión de servicios. Los seis meses y la expectativa de destino pertenecen a la reasignación de efectivos. El artículo no lo liga a la resolución del siguiente concurso."
  citation: "art. 50.5 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l05-q069
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes partes del Estatuto producirá efectos a partir de la entrada en vigor de las leyes de Función Pública?"
  options:
  - id: a
    correct: true
    text:
      es: "El capítulo III del título V."
  - id: b
    text:
      es: "El capítulo I del título III."
  - id: c
    text:
      es: "El capítulo II del título IV."
  - id: d
    text:
      es: "El capítulo I del título V."
  explanation:
    es: "La disposición final cuarta.1 TREBEP difiere a las leyes de Función Pública «lo establecido en los capítulos II y III del título III, excepto el artículo 25.2, y en el capítulo III del título V». De las opciones, solo el capítulo III del título V está en esa lista. El capítulo I del título III, el capítulo II del título IV y el capítulo I del título V no aparecen en ella."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "estructura"
  - "efecto"
