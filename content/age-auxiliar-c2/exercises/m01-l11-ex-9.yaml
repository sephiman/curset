# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q120
  prompt:
    es: "Según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si las leyes que establecen las infracciones no fijan plazos de prescripción, las infracciones prescribirán:"
  options:
  - id: a
    text:
      es: "las muy graves a los cinco años, las graves a los tres años y las leves al año."
  - id: b
    text:
      es: "las muy graves a los tres años, las graves a los dos años y las leves al año."
  - id: c
    text:
      es: "las muy graves a los cuatro años, las graves a los dos años y las leves a los seis meses."
  - id: d
    correct: true
    text:
      es: "las muy graves a los tres años, las graves a los dos años y las leves a los seis meses."
  explanation:
    es: "El artículo 30.1 LRJSP dice que, a falta de plazo en la ley, «las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses». La serie de cinco, tres y un año no es la de la ley. Poner las leves en un año confunde la infracción leve con la sanción por falta leve, que sí prescribe al año. Cuatro años no es el plazo de las muy graves."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q121
  prompt:
    es: "Conforme al artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, si las leyes no fijan plazos de prescripción, las sanciones prescribirán:"
  options:
  - id: a
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves a los dos años y por leves a los seis meses."
  - id: b
    text:
      es: "las impuestas por faltas muy graves a los cinco años, por graves a los tres años y por leves al año."
  - id: c
    correct: true
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves a los dos años y por leves al año."
  - id: d
    text:
      es: "las impuestas por faltas muy graves a los tres años, por graves al año y por leves a los seis meses."
  explanation:
    es: "El artículo 30.1 LRJSP dice que «las sanciones impuestas por faltas muy graves prescribirán a los tres años, las impuestas por faltas graves a los dos años y las impuestas por faltas leves al año». Seis meses es el plazo de la infracción leve, no de la sanción leve. Cinco y tres años no son los plazos de la ley. Un año es el de la sanción leve, no el de la grave."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q122
  prompt:
    es: "Una ley tipifica una infracción leve sin fijar su plazo de prescripción. Conforme al régimen general del sector público, ¿en qué plazo prescribe la infracción?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de seis meses."
  - id: b
    text:
      es: "En el plazo de un año."
  - id: c
    text:
      es: "En el plazo de tres meses."
  - id: d
    text:
      es: "En el plazo de dos años."
  explanation:
    es: "El artículo 30.1 LRJSP dice que, si las leyes no fijan plazos, «las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses». Un año es el plazo de la sanción impuesta por falta leve, no el de la infracción. Dos años es el plazo de las infracciones graves. Tres meses no es ninguno de los tres plazos de infracciones del apartado, que son tres años, dos años y seis meses."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q123
  prompt:
    es: "Cuando la ley que las establece no fija plazos, ¿cuál de estas afirmaciones es correcta según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La infracción leve y la sanción por falta leve prescriben a los seis meses."
  - id: b
    correct: true
    text:
      es: "La infracción leve prescribe a los seis meses y la sanción por falta leve, al año."
  - id: c
    text:
      es: "La infracción leve prescribe al año y la sanción por falta leve, a los seis meses."
  - id: d
    text:
      es: "La infracción leve y la sanción por falta leve prescriben al año."
  explanation:
    es: "El artículo 30.1 LRJSP da plazos distintos a la infracción leve, «a los seis meses», y a la sanción impuesta por falta leve, «al año». Las opciones que igualan los dos plazos borran esa diferencia. La que da un año a la infracción y seis meses a la sanción los cambia de sitio."
  citation: "art. 30.1 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q124
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las infracciones y sanciones prescribirán:"
  options:
  - id: a
    text:
      es: "en los plazos de ese artículo, que prevalecen siempre sobre los que fijen las leyes sectoriales."
  - id: b
    text:
      es: "según disponga el reglamento que tipifique la infracción, sin que existan plazos supletorios."
  - id: c
    text:
      es: "en el plazo que fije en cada caso la resolución que imponga la sanción correspondiente."
  - id: d
    correct: true
    text:
      es: "según dispongan las leyes que las establezcan y, en su defecto, en los plazos de ese artículo."
  explanation:
    es: "El artículo 30.1 LRJSP empieza: «Las infracciones y sanciones prescribirán según lo dispuesto en las leyes que las establezcan. Si éstas no fijan plazos de prescripción», se aplican los del propio artículo. Los plazos de la LRJSP son supletorios, no prevalecen sobre los de la ley sectorial. Remiten a las leyes, no a un reglamento, y sí hay plazos supletorios. La resolución sancionadora no fija el plazo de prescripción."
  citation: "art. 30.1 LRJSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10566-art-30
- id: m01-l11-q125
  prompt:
    es: "Si la ley que las establece no fija plazos, señale la afirmación INCORRECTA sobre la prescripción según el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Las infracciones leves prescriben al año."
  - id: b
    text:
      es: "Las infracciones graves prescriben a los dos años."
  - id: c
    text:
      es: "Las sanciones por faltas muy graves prescriben a los tres años."
  - id: d
    text:
      es: "Las sanciones por faltas graves prescriben a los dos años."
  explanation:
    es: "La afirmación incorrecta es la que da un año a las infracciones leves: el artículo 30.1 LRJSP dice que «las leves [prescriben] a los seis meses»; el año es el plazo de las sanciones impuestas por faltas leves. Las otras tres opciones copian el artículo: infracciones graves a los dos años, sanciones por faltas muy graves a los tres y sanciones por faltas graves a los dos."
  citation: "art. 30.1 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q128
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en defecto de otro cómputo legal o europeo, los plazos señalados por horas:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entienden hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."
  - id: b
    text:
      es: "Se entienden naturales, y se cuentan todas las horas del día, sea este hábil o inhábil."
  - id: c
    text:
      es: "Se entienden hábiles, y solo lo son las horas en que abren las oficinas de registro."
  - id: d
    text:
      es: "Se entienden hábiles, y solo lo son las horas de la jornada ordinaria de un día hábil."
  explanation:
    es: "El artículo 30.1 dice que las horas «son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». No se cuentan como naturales: las horas de un sábado, un domingo o un festivo no corren. Tampoco se limitan a las horas de apertura de las oficinas ni a la jornada ordinaria: cuenta el día hábil entero, de las 0:00 a las 24:00."
  citation: "art. 30.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q129
  prompt:
    es: "Según el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué duración máxima pueden tener los plazos expresados por horas?"
  options:
  - id: a
    text:
      es: "Cuarenta y ocho horas; si fuera mayor, el plazo se expresará en días."
  - id: b
    text:
      es: "Setenta y dos horas; si fuera mayor, el plazo se expresará en días."
  - id: c
    text:
      es: "Doce horas; si fuera mayor, el plazo se expresará en días hábiles."
  - id: d
    correct: true
    text:
      es: "Veinticuatro horas; si fuera mayor, el plazo se expresará en días."
  explanation:
    es: "Los plazos por horas «no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días». Un plazo de cuarenta y ocho o de setenta y dos horas no cabe: se fija en días. El límite tampoco es de doce horas."
  citation: "art. 30.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q130
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los plazos se señalen por días y no se exprese otro cómputo:"
  options:
  - id: a
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo solo los domingos y los declarados festivos."
  - id: b
    text:
      es: "Se entiende que son naturales, salvo que la notificación indique expresamente que se trata de días hábiles."
  - id: c
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo solo los días declarados festivos de carácter nacional."
  - id: d
    correct: true
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo los sábados, los domingos y los declarados festivos."
  explanation:
    es: "El artículo 30.2 dice que los plazos por días «son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos». Los sábados también se excluyen, y los festivos que se excluyen no son solo los nacionales. La regla no es la de días naturales: los naturales necesitan una ley o una norma europea que lo diga."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q131
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando una ley o el Derecho de la Unión Europea señalen un plazo por días naturales:"
  options:
  - id: a
    text:
      es: "Esta circunstancia se hará constar en el calendario anual de días inhábiles."
  - id: b
    text:
      es: "Esta circunstancia se hará constar en el acuerdo de iniciación, no en las notificaciones."
  - id: c
    correct: true
    text:
      es: "Esta circunstancia se hará constar en las correspondientes notificaciones."
  - id: d
    text:
      es: "Esta circunstancia solo se hará constar si el plazo es superior a quince días."
  explanation:
    es: "El artículo 30.2 dice que, cuando los plazos se señalen por días naturales, «se hará constar esta circunstancia en las correspondientes notificaciones». El lugar es la notificación, no el calendario de días inhábiles ni solo el acuerdo de iniciación. La ley no limita el deber a los plazos de más de quince días."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q132
  prompt:
    es: "Una ley fija un plazo de diez días naturales y así consta en la notificación, practicada el jueves 5 de febrero de 2026. Sin festivos en el periodo, ¿cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El viernes 13 de febrero de 2026."
  - id: b
    text:
      es: "El domingo 15 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 16 de febrero de 2026."
  - id: d
    text:
      es: "El jueves 19 de febrero de 2026."
  explanation:
    es: "Los días naturales se cuentan todos, sábados y domingos incluidos, desde el día siguiente a la notificación (art. 30.3): el primero es el viernes 6 de febrero y el décimo, el domingo 15. El último día es inhábil, así que el plazo se prorroga al primer día hábil siguiente (art. 30.5): el lunes 16 de febrero de 2026. El domingo 15 olvida la prórroga. El viernes 13 lleva el vencimiento al día hábil anterior, que la ley no prevé. El jueves 19 sale de contar diez días hábiles, y el plazo era de naturales."
  citation: "art. 30.5 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q135
  prompt:
    es: "De acuerdo con el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un plazo en meses vence en un mes sin día equivalente al de inicio del cómputo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entenderá que el plazo expira el último día del mes."
  - id: b
    text:
      es: "Se entenderá que el plazo expira el primer día del mes siguiente."
  - id: c
    text:
      es: "Se entenderá que el plazo expira el primer día hábil del mes siguiente."
  - id: d
    text:
      es: "Se contará el plazo por días naturales, a razón de treinta días por mes."
  explanation:
    es: "El artículo 30.4 dice que, si en el mes de vencimiento no hay día equivalente, «se entenderá que el plazo expira el último día del mes». El plazo no pasa al mes siguiente, ni a su primer día ni a su primer día hábil. Los meses se cuentan de fecha a fecha, no como treinta días naturales."
  citation: "art. 30.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q136
  prompt:
    es: "Un acto notificado el viernes 30 de enero de 2026 concede al interesado un plazo de un mes. Sin festivos en el periodo, ¿cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El viernes 27 de febrero de 2026."
  - id: b
    text:
      es: "El sábado 28 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 2 de marzo de 2026."
  - id: d
    text:
      es: "El lunes 30 de marzo de 2026."
  explanation:
    es: "El plazo de un mes empieza el día siguiente a la notificación y concluye el mismo día del mes de vencimiento (art. 30.4). Febrero de 2026 no tiene día 30, así que el plazo expira el último día del mes, el sábado 28 de febrero. Ese día es inhábil y el plazo se prorroga al primer día hábil siguiente (art. 30.5): el lunes 2 de marzo de 2026. El sábado 28 olvida la prórroga. El viernes 27 adelanta el vencimiento al hábil anterior, que la ley no prevé. El lunes 30 de marzo cuenta dos meses."
  citation: "art. 30.4 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q137
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre cuando el último día de un plazo es inhábil?"
  options:
  - id: a
    text:
      es: "Se entiende vencido el último día hábil anterior."
  - id: b
    text:
      es: "Se entiende prorrogado al segundo día hábil siguiente."
  - id: c
    text:
      es: "Se entiende ampliado en la mitad del plazo inicial."
  - id: d
    correct: true
    text:
      es: "Se entiende prorrogado al primer día hábil siguiente."
  explanation:
    es: "El artículo 30.5 dice que, cuando el último día del plazo sea inhábil, «se entenderá prorrogado al primer día hábil siguiente». El plazo no se adelanta al hábil anterior ni salta al segundo hábil. La ampliación en la mitad del plazo es otra figura, la del artículo 32.1, que la Administración acuerda y que no opera sola."
  citation: "art. 30.5 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q138
  prompt:
    es: "Según el artículo 30.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se considera un día hábil donde reside el interesado e inhábil en la sede del órgano?"
  options:
  - id: a
    correct: true
    text:
      es: "Inhábil en todo caso, tanto para el interesado como para la Administración."
  - id: b
    text:
      es: "Hábil en todo caso, porque prevalece el calendario del interesado."
  - id: c
    text:
      es: "Hábil para el interesado e inhábil para la Administración."
  - id: d
    text:
      es: "Hábil o inhábil según lo que decida el órgano en cada procedimiento."
  explanation:
    es: "El artículo 30.6 dice que un día hábil en el municipio o Comunidad Autónoma del interesado e inhábil en la sede del órgano, o a la inversa, «se considerará inhábil en todo caso». No prevalece el calendario del interesado, no hay un régimen distinto para cada parte y el órgano no decide en cada caso."
  citation: "art. 30.6 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q139
  prompt:
    es: "De acuerdo con el artículo 30.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el calendario de días inhábiles a efectos de cómputo de plazos:"
  options:
  - id: a
    text:
      es: "Lo fija la Administración General del Estado para todas las Administraciones, y se publica antes del comienzo de cada año."
  - id: b
    text:
      es: "Lo fijan la Administración General del Estado y las Comunidades Autónomas, y se publica en el primer mes de cada año."
  - id: c
    text:
      es: "Lo fija cada Entidad Local para su término municipal, y se publica antes del comienzo de cada año."
  - id: d
    correct: true
    text:
      es: "Lo fijan la Administración General del Estado y las Comunidades Autónomas, y se publica antes del comienzo de cada año."
  explanation:
    es: "El artículo 30.7 dice que la Administración General del Estado y las de las Comunidades Autónomas «fijarán, en su respectivo ámbito, el calendario de días inhábiles», que «deberá publicarse antes del comienzo de cada año». El Estado no fija el de todas las Administraciones. No se publica en enero, sino antes. Las Entidades Locales no aprueban el suyo: sus días inhábiles van en el calendario de su Comunidad Autónoma."
  citation: "art. 30.7 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q140
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de un día como hábil o inhábil a efectos de plazos es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "No determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas."
  - id: b
    text:
      es: "Determina por sí sola la apertura o el cierre de los centros de trabajo de las Administraciones Públicas."
  - id: c
    text:
      es: "Obliga a cerrar las oficinas de asistencia en materia de registros en los días declarados inhábiles."
  - id: d
    text:
      es: "Fija el régimen de jornada y horarios del personal de las Administraciones Públicas en esos días."
  explanation:
    es: "El artículo 30.8 dice que la declaración de un día como hábil o inhábil «no determina por sí sola el funcionamiento de los centros de trabajo», ni la organización del tiempo de trabajo ni el régimen de jornada y horarios. No abre ni cierra oficinas por sí misma, tampoco las de asistencia en materia de registros, y no fija la jornada del personal."
  citation: "art. 30.8 LPAC"
  difficulty: 2
  tags:
  - "efecto"
