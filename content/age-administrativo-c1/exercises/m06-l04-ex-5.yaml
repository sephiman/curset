# anchor: fuente-ms-word-indice-html
- id: m06-l04-q163
  prompt:
    es: "En Word 365, ¿qué hay que hacer si se marcan más entradas después de crear el índice?"
  options:
  - id: a
    text:
      es: "Nada: el índice se actualiza solo al marcar"
  - id: b
    correct: true
    text:
      es: "Actualizar el índice para ver las entradas nuevas"
  - id: c
    text:
      es: "Eliminar el índice y volver a marcar todas las entradas"
  - id: d
    text:
      es: "Volver a insertar la tabla de contenido"
  explanation:
    es: "La página dice: «Si marca más entradas tras la creación del índice, tendrá que actualizar el índice para verlas». La página dice que hay que actualizar el índice para verlas. La página dice que hay que actualizar el índice. La tabla de contenido es otra cosa; el índice se actualiza."
