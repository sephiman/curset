# anchor: boe-a-1997-25336-art-15
- id: m01-l03-q0070
  prompt:
    es: "Según el artículo 15.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, además del Presidente del Gobierno, ¿quién puede proponer al Consejo de Ministros el nombramiento de un Secretario de Estado?"
  options:
  - id: a
    text:
      es: "El Subsecretario del Departamento."
  - id: b
    text:
      es: "El Presidente del Congreso de los Diputados."
  - id: c
    text:
      es: "El Abogado General del Estado."
  - id: d
    correct: true
    text:
      es: "El miembro del Gobierno a cuyo Departamento pertenezca el Secretario de Estado."
  explanation:
    es: "El artículo 15.1 recoge dos proponentes: el Presidente del Gobierno y el miembro del Gobierno a cuyo Departamento pertenezcan los Secretarios de Estado. El Subsecretario es un órgano directivo del Departamento y no propone el nombramiento. El Presidente del Congreso interviene en la investidura, no en estos nombramientos. El Abogado General del Estado asiste a la Comisión General de Secretarios de Estado y Subsecretarios, pero no propone."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-11
- id: m01-l03-q0071
  prompt:
    es: "De acuerdo con el artículo 11 de la Ley 50/1997, de 27 de noviembre, del Gobierno, para ser miembro del Gobierno se requiere, entre otros requisitos, disfrutar de:"
  options:
  - id: a
    text:
      es: "La condición de Diputado o de Senador."
  - id: b
    text:
      es: "La condición de funcionario de carrera del Estado."
  - id: c
    correct: true
    text:
      es: "Los derechos de sufragio activo y pasivo."
  - id: d
    text:
      es: "Diez años de residencia continuada en España."
  explanation:
    es: "El artículo 11 exige ser español, mayor de edad y disfrutar de los derechos de sufragio activo y pasivo, entre otros requisitos. No exige ser parlamentario ni funcionario de carrera, ni una residencia de diez años."
  citation: "art. 11 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-12
- id: m01-l03-q0073
  prompt:
    es: "Conforme al artículo 12.2 bis de la Ley 50/1997, de 27 de noviembre, del Gobierno, en el nombramiento de Vicepresidentes y Ministros cada sexo debe suponer, como mínimo:"
  options:
  - id: a
    text:
      es: "El treinta por ciento en su conjunto."
  - id: b
    text:
      es: "El cincuenta por ciento en cada Departamento."
  - id: c
    text:
      es: "El veinticinco por ciento en su conjunto."
  - id: d
    correct: true
    text:
      es: "El cuarenta por ciento en su conjunto."
  explanation:
    es: "El artículo 12.2 bis fija el cuarenta por ciento como mínimo para cada sexo en el conjunto de las Vicepresidencias y los Ministerios. El treinta y el veinticinco por ciento son porcentajes menores. El cincuenta por ciento en cada Departamento cambia la cifra y el modo de medirla."
  citation: "art. 12.2 bis Ley 50/1997"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-99
- id: m01-l03-q0074
  prompt:
    es: "¿Cuál de los siguientes órganos es el cauce a través del cual el Rey propone un candidato a la Presidencia del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno en funciones."
  - id: b
    correct: true
    text:
      es: "El Presidente del Congreso."
  - id: c
    text:
      es: "El Presidente del Senado."
  - id: d
    text:
      es: "El Presidente del Consejo de Estado."
  explanation:
    es: "El artículo 99.1 dice que el Rey hace la propuesta a través del Presidente del Congreso. El Presidente del Gobierno en funciones, el del Senado y el del Consejo de Estado no son el cauce."
  citation: "art. 99.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l03-q0075
  prompt:
    es: "De acuerdo con el artículo 99.2 de la Constitución Española de 1978, el candidato propuesto expone ante el Congreso de los Diputados el programa político del Gobierno que pretenda formar y solicita:"
  options:
  - id: a
    text:
      es: "La autorización del Rey."
  - id: b
    text:
      es: "El dictamen del Consejo de Estado."
  - id: c
    text:
      es: "La aprobación de las Cortes Generales en sesión conjunta."
  - id: d
    correct: true
    text:
      es: "La confianza de la Cámara."
  explanation:
    es: "El artículo 99.2 hace que el candidato solicite la confianza de la Cámara. No pide autorización al Rey, que le propone. No hay dictamen del Consejo de Estado. Y la votación es del Congreso, no de las Cortes reunidas en sesión conjunta."
  citation: "art. 99.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l03-q0077
  prompt:
    es: "Según el artículo 99.5 de la Constitución Española de 1978, si pasan dos meses desde la primera votación de investidura sin que ningún candidato obtenga la confianza, el Rey, con el refrendo del Presidente del Congreso, disuelve:"
  options:
  - id: a
    text:
      es: "Solo el Congreso de los Diputados y convoca elecciones generales."
  - id: b
    text:
      es: "Solo el Congreso de los Diputados y propone un nuevo candidato."
  - id: c
    correct: true
    text:
      es: "Ambas Cámaras y convoca nuevas elecciones."
  - id: d
    text:
      es: "Ambas Cámaras y nombra Presidente al candidato con más votos."
  explanation:
    es: "El artículo 99.5 dice que el Rey disuelve ambas Cámaras y convoca nuevas elecciones. Limitar la disolución al Congreso, o nombrar Presidente al más votado, cambia el resultado que prevé el artículo."
  citation: "art. 99.5 CE"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-98
- id: m01-l03-q0086
  prompt:
    es: "Conforme al artículo 98.3 de la Constitución Española de 1978, los miembros del Gobierno no podrán ejercer otras funciones representativas que las del mandato parlamentario, ni otra función pública que no derive de su cargo, ni:"
  options:
  - id: a
    text:
      es: "Actividad mercantil, aunque sí profesional."
  - id: b
    text:
      es: "Actividad profesional, aunque sí mercantil."
  - id: c
    correct: true
    text:
      es: "Actividad profesional o mercantil alguna."
  - id: d
    text:
      es: "Actividad profesional o mercantil sin autorización del Consejo de Ministros."
  explanation:
    es: "El artículo 98.3 prohíbe toda actividad profesional o mercantil. Permitir una de las dos, o condicionarlas a la autorización del Consejo de Ministros, rebaja una prohibición que el artículo formula sin excepciones."
  citation: "art. 98.3 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-103
- id: m01-l03-q0087
  prompt:
    es: "Conforme al artículo 103.1 de la Constitución Española de 1978, la Administración Pública, que actúa con sometimiento pleno a la ley y al Derecho, sirve con objetividad:"
  options:
  - id: a
    correct: true
    text:
      es: "Los intereses generales."
  - id: b
    text:
      es: "Los intereses del Gobierno."
  - id: c
    text:
      es: "Los intereses de los Departamentos ministeriales."
  - id: d
    text:
      es: "Los intereses de las Cortes Generales."
  explanation:
    es: "El artículo 103.1 dice que la Administración Pública sirve con objetividad los intereses generales. No sirve los intereses del Gobierno de turno, ni los de cada Departamento ministerial, ni los de las Cortes Generales."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-3
- id: m01-l03-q0089
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas sirven con objetividad los intereses generales y actúan con sometimiento pleno:"
  options:
  - id: a
    text:
      es: "A la Constitución y a la jurisprudencia del Tribunal Supremo."
  - id: b
    text:
      es: "A la Ley y a los reglamentos del Gobierno."
  - id: c
    correct: true
    text:
      es: "A la Constitución, a la Ley y al Derecho."
  - id: d
    text:
      es: "A los tratados internacionales y a la Ley."
  explanation:
    es: "El artículo 3.1 dice que actúan con sometimiento pleno a la Constitución, a la Ley y al Derecho. Las otras opciones sustituyen el Derecho por la jurisprudencia del Tribunal Supremo, por los reglamentos del Gobierno o por los tratados internacionales, y dejan fuera uno de los tres términos."
  citation: "art. 3.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-55
- id: m01-l03-q0094
  prompt:
    es: "Según el artículo 55.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las excepciones a la división funcional en Departamentos y a la gestión territorial integrada son las previstas por:"
  options:
  - id: a
    text:
      es: "El Real Decreto de estructura de cada Departamento."
  - id: b
    text:
      es: "El Estatuto de Autonomía de cada Comunidad."
  - id: c
    text:
      es: "Un acuerdo del Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "La propia Ley 40/2015."
  explanation:
    es: "El artículo 55.1 remite las excepciones a «esta Ley», es decir, a la propia Ley 40/2015. No las fija el Real Decreto de estructura de un Departamento, ni un Estatuto de Autonomía, ni un acuerdo del Consejo de Ministros."
  citation: "art. 55.1 LRJSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10566-art-55
- id: m01-l03-q0095
  prompt:
    es: "De acuerdo con la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Organización Central de la Administración General del Estado integra:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Ministerios y los servicios comunes."
  - id: b
    text:
      es: "Los Ministerios y los Organismos públicos."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno y los servicios comunes."
  - id: d
    text:
      es: "Los Departamentos ministeriales y las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 55.2.a dice que la Organización Central integra los Ministerios y los servicios comunes. Los Organismos públicos no figuran en ese apartado. Las Delegaciones del Gobierno pertenecen a la Organización Territorial."
  citation: "art. 55.2 LRJSP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l03-q0103
  prompt:
    es: "Conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los titulares de los órganos superiores y directivos son nombrados atendiendo a criterios de:"
  options:
  - id: a
    text:
      es: "Antigüedad en el Cuerpo y titulación."
  - id: b
    correct: true
    text:
      es: "Competencia profesional y experiencia."
  - id: c
    text:
      es: "Confianza política y afinidad con el Gobierno."
  - id: d
    text:
      es: "Oposición libre y concurso de méritos."
  explanation:
    es: "El artículo 55.11 manda nombrar a los titulares atendiendo a criterios de competencia profesional y experiencia. La antigüedad, la afinidad política y la oposición o el concurso no son los criterios que fija ese apartado."
  citation: "art. 55.11 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
