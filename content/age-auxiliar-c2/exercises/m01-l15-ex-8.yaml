# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q101
  prompt:
    es: "¿Cuál de las siguientes es la denominación que da al artículo 62 del capítulo 6 «Inversiones reales» el anexo II de la Orden HAC/557/2026, de 3 de junio?"
  options:
  - id: a
    text:
      es: "«Inversión nueva en infraestructura y bienes destinados al uso general»."
  - id: b
    text:
      es: "«Inversión de reposición en infraestructura y bienes destinados al uso general»."
  - id: c
    text:
      es: "«Inversiones militares asociadas al funcionamiento de los servicios»."
  - id: d
    correct: true
    text:
      es: "«Inversión nueva asociada al funcionamiento operativo de los servicios»."
  explanation:
    es: "El anexo II denomina el artículo 62 «Inversión nueva asociada al funcionamiento operativo de los servicios». Las otras tres denominaciones son de otros artículos del mismo capítulo 6: la inversión nueva en infraestructura y bienes de uso general es el 60, la de reposición en esa misma infraestructura es el 61 y las inversiones militares asociadas al funcionamiento de los servicios son el 66."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-anexo-ii
- id: m01-l15-q102
  prompt:
    es: "En la aplicación 33.101.921O.227.06, ¿qué designa el código 06 con el que termina la parte económica, según el anexo II de la Orden HAC/557/2026, de 3 de junio?"
  options:
  - id: a
    text:
      es: "El subconcepto «Limpieza y aseo» del concepto 227."
  - id: b
    text:
      es: "El subconcepto «Valoraciones y peritajes» del concepto 227."
  - id: c
    text:
      es: "El concepto «Estudios y trabajos técnicos» del artículo 22."
  - id: d
    correct: true
    text:
      es: "El subconcepto «Estudios y trabajos técnicos» del concepto 227."
  explanation:
    es: "La parte económica 227.06 se lee como concepto 227 «Trabajos realizados por otras empresas y profesionales» y subconcepto 06 «Estudios y trabajos técnicos». El 06 no es un concepto del artículo 22: el concepto es el 227, y el 06 lo divide. Limpieza y aseo y valoraciones y peritajes son subconceptos del mismo concepto 227, con los códigos 00 y 02."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-34
- id: m01-l15-q112
  prompt:
    es: "Según el artículo 34.1.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, al ejercicio presupuestario se imputan las obligaciones económicas reconocidas hasta:"
  options:
  - id: a
    text:
      es: "el fin del mes de enero siguiente, aunque el gasto se hubiera realizado en el ejercicio anterior."
  - id: b
    text:
      es: "el fin del mes de noviembre, si corresponden a gastos realizados dentro del ejercicio."
  - id: c
    text:
      es: "la fecha del pago material, si el gasto se realizó dentro del ejercicio."
  - id: d
    correct: true
    text:
      es: "el fin del mes de diciembre, si corresponden a gastos realizados dentro del ejercicio."
  explanation:
    es: "El artículo 34.1.b) imputa al ejercicio las obligaciones reconocidas hasta el fin del mes de diciembre, siempre que correspondan a gastos realizados dentro del ejercicio y con cargo a los respectivos créditos. Ampliar el plazo a enero no está en el texto. Cerrarlo en noviembre tampoco. Lo que cuenta es la fecha del reconocimiento y no la del pago material."
  citation: "art. 34.1.b) LGP"
  difficulty: 2
  tags:
  - "fecha"
  - "concepto"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q114
  prompt:
    es: "Salvo los casos reservados al Consejo de Ministros, ¿cuál de las siguientes afirmaciones sobre los presidentes o directores de los organismos autónomos del Estado es correcta según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Aprueban y comprometen el gasto; el Subsecretario reconoce las obligaciones."
  - id: b
    text:
      es: "Reconocen y pagan las obligaciones; el Secretario de Estado aprueba el gasto."
  - id: c
    text:
      es: "Aprueban el gasto; el Director General de Presupuestos reconoce las obligaciones."
  - id: d
    correct: true
    text:
      es: "Aprueban y comprometen el gasto, y también reconocen y pagan las obligaciones."
  explanation:
    es: "El artículo 74.2 atribuye a los presidentes o directores de los organismos autónomos del Estado, con la misma salvedad legal, «la aprobación y compromiso del gasto, así como el reconocimiento y el pago de las obligaciones». Las opciones que dan el reconocimiento de las obligaciones al Subsecretario, la aprobación al Secretario de Estado o el reconocimiento al Director General de Presupuestos reparten entre otros órganos actos que el artículo 74.2 reúne en el presidente o director del organismo."
  citation: "art. 74.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-162
- id: m01-l15-q116
  prompt:
    es: "Según el artículo 162 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué forma de control consiste en la verificación, realizada con posterioridad y de forma sistemática, de la actividad económico-financiera del sector público estatal?"
  options:
  - id: a
    text:
      es: "El control financiero permanente."
  - id: b
    text:
      es: "La función interventora."
  - id: c
    text:
      es: "La intervención material del pago."
  - id: d
    correct: true
    text:
      es: "La auditoría pública."
  explanation:
    es: "El artículo 162 define la auditoría pública como «la verificación, realizada con posterioridad y efectuada de forma sistemática, de la actividad económico-financiera del sector público estatal». El control financiero permanente verifica «de una forma continua» (art. 157). La función interventora controla los actos antes de que sean aprobados (art. 148), y la intervención material del pago es una de sus modalidades (art. 150.2)."
  citation: "art. 162 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q117
  prompt:
    es: "De acuerdo con el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde a los Ministros aprobar y comprometer los gastos propios de sus presupuestos, salvo los casos reservados por la Ley a la competencia:"
  options:
  - id: a
    correct: true
    text:
      es: "del Consejo de Ministros."
  - id: b
    text:
      es: "del Ministro de Hacienda."
  - id: c
    text:
      es: "de la Presidencia del Gobierno."
  - id: d
    text:
      es: "de la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 74.1 reserva a la competencia del Consejo de Ministros los casos que la Ley así establezca. El Ministro de Hacienda no tiene reservada esa competencia en el artículo. La Presidencia del Gobierno tampoco. La Intervención General de la Administración del Estado controla el gasto, no lo aprueba."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q118
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, por debajo de los límites que fijan los Ministros, aprobar y comprometer gastos corresponde, en su ámbito respectivo, a:"
  options:
  - id: a
    text:
      es: "los Directores Generales y Subdirectores Generales del departamento."
  - id: b
    text:
      es: "los Secretarios Generales Técnicos de cada departamento ministerial."
  - id: c
    text:
      es: "los Delegados del Gobierno y Subdelegados en cada provincia."
  - id: d
    correct: true
    text:
      es: "los Secretarios de Estado y el Subsecretario del departamento."
  explanation:
    es: "El artículo 74.1 dice que los Ministros fijan los límites por debajo de los cuales esas competencias corresponden, en su ámbito respectivo, a los Secretarios de Estado y Subsecretario del departamento. Los directores generales, los secretarios generales técnicos y los delegados del Gobierno no aparecen en ese párrafo."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q119
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, además de aprobar y comprometer gastos, ¿qué competencias tienen los Ministros respecto de las obligaciones y los pagos?"
  options:
  - id: a
    text:
      es: "Reconocer las obligaciones económicas y ordenar directamente la realización de los pagos."
  - id: b
    text:
      es: "Interesar del Ordenador general de pagos del Estado el reconocimiento de las obligaciones y su pago."
  - id: c
    text:
      es: "Proponer al Consejo de Ministros el reconocimiento de las obligaciones y la realización de los pagos."
  - id: d
    correct: true
    text:
      es: "Reconocer las obligaciones económicas e interesar del Ordenador general de pagos del Estado el pago."
  explanation:
    es: "El artículo 74.1 atribuye a los Ministros reconocer las obligaciones económicas e interesar del Ordenador general de pagos del Estado la realización de los pagos. Ordenar los pagos corresponde al Ordenador general, no al Ministro. Reconocer la obligación es del propio Ministro, que no lo interesa de otro órgano. El Consejo de Ministros no interviene en ese reconocimiento."
  citation: "art. 74.1 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q120
  prompt:
    es: "Un gasto del presupuesto de un ministerio es de los que la Ley reserva al Consejo de Ministros. Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede el Ministro aprobarlo y comprometerlo por sí?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el artículo 74.1 exceptúa los casos reservados por la Ley al Consejo de Ministros."
  - id: b
    text:
      es: "Sí, porque aprobar y comprometer los gastos propios de su presupuesto le corresponde siempre."
  - id: c
    text:
      es: "Sí, si el importe supera el límite que él mismo ha fijado para los Secretarios de Estado."
  - id: d
    text:
      es: "No, porque la aprobación de todo gasto corresponde al Ordenador general de pagos del Estado."
  explanation:
    es: "El artículo 74.1 atribuye a los Ministros aprobar y comprometer los gastos de su presupuesto, pero salva los casos reservados por la Ley al Consejo de Ministros. Por eso no pueden aprobarlo por sí. Decir que la competencia es siempre del Ministro ignora la salvedad. Superar el límite que fija para los Secretarios de Estado no le da competencia sobre un gasto reservado. El Ordenador general de pagos ordena pagos y no aprueba gastos."
  citation: "art. 74.1 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q121
  prompt:
    es: "De acuerdo con el artículo 74.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, además de en los organismos autónomos del Estado, compete al presidente o director aprobar y comprometer el gasto, reconocer y pagar las obligaciones en:"
  options:
  - id: a
    text:
      es: "las sociedades mercantiles estatales con presupuesto estimativo."
  - id: b
    text:
      es: "las fundaciones del sector público estatal con presupuesto estimativo."
  - id: c
    correct: true
    text:
      es: "las entidades integrantes del sector público estatal con presupuesto limitativo."
  - id: d
    text:
      es: "los departamentos ministeriales a los que estén adscritos."
  explanation:
    es: "El artículo 74.2 atribuye esas competencias a los presidentes o directores de los organismos autónomos y de las entidades integrantes del sector público estatal con presupuesto limitativo. Las sociedades y fundaciones con presupuesto estimativo no están en el precepto. Los departamentos ministeriales se rigen por el apartado 1, donde el competente es el Ministro."
  citation: "art. 74.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q122
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el pago de las obligaciones es correcta según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "El Ministro reconoce las obligaciones y las paga directamente, mientras que el director de un organismo autónomo solo las reconoce y propone su pago."
  - id: b
    correct: true
    text:
      es: "Al presidente o director de un organismo autónomo le compete pagar las obligaciones, mientras que el Ministro interesa su pago del Ordenador general de pagos."
  - id: c
    text:
      es: "El presidente o director de un organismo autónomo reconoce las obligaciones, pero su pago corresponde siempre al Ministro del departamento de adscripción."
  - id: d
    text:
      es: "Tanto el Ministro como el director de un organismo autónomo ordenan y realizan por sí mismos los pagos materiales de las obligaciones."
  explanation:
    es: "El artículo 74.2 atribuye a los presidentes o directores de los organismos autónomos el reconocimiento y el pago de las obligaciones. El artículo 74.1 da al Ministro reconocer las obligaciones e interesar del Ordenador general de pagos la realización de los pagos. Las opciones que invierten los papeles o que atribuyen al Ministro el pago directo o al Ministro el pago de las obligaciones del organismo no coinciden con el texto. Ordenar el pago es función del Ordenador general de pagos."
  citation: "art. 74.2 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q123
  prompt:
    es: "Un gasto de un organismo autónomo del Estado es de los que la Ley reserva al Consejo de Ministros. Según el artículo 74.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿puede su director aprobarlo y comprometerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque el artículo 74.2 no contiene ninguna salvedad a favor del Consejo de Ministros."
  - id: b
    text:
      es: "Sí, siempre que el Ministro del departamento de adscripción lo autorice por escrito."
  - id: c
    correct: true
    text:
      es: "No, porque el artículo 74.2 contiene la misma salvedad legal a favor del Consejo de Ministros."
  - id: d
    text:
      es: "No, porque en los organismos autónomos el gasto lo aprueba siempre el Ministro de adscripción."
  explanation:
    es: "El artículo 74.2 empieza con «con la misma salvedad legal»: la competencia del presidente o director cede ante los casos que la Ley reserva al Consejo de Ministros. Negar que haya salvedad contradice el texto. La autorización escrita del Ministro no está prevista. La aprobación del gasto en un organismo autónomo no corresponde siempre al Ministro de adscripción."
  citation: "art. 74.2 LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q126
  prompt:
    es: "¿Ante qué órgano interesan los Ministros la realización de los pagos correspondientes a las obligaciones que reconocen, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Ante el Director General de Presupuestos."
  - id: b
    text:
      es: "Ante la Intervención General de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "Ante el Ordenador general de pagos del Estado."
  - id: d
    text:
      es: "Ante el Consejo de Ministros."
  explanation:
    es: "El artículo 74.1 dice que los Ministros interesan del Ordenador general de pagos del Estado la realización de los pagos. La Dirección General de Presupuestos gestiona los créditos y las modificaciones, no los pagos. La Intervención General controla. El Consejo de Ministros no interviene en cada pago."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q127
  prompt:
    es: "El Ministro ha fijado un límite de 500.000 euros por debajo del cual no aprueba gastos. Un gasto de su departamento es de 300.000 euros. Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿a quién corresponde aprobarlo?"
  options:
  - id: a
    text:
      es: "Al Director General del Tesoro y Política Financiera."
  - id: b
    correct: true
    text:
      es: "Al Secretario de Estado o al Subsecretario del departamento."
  - id: c
    text:
      es: "Al Consejo de Ministros, por razón de la cuantía."
  - id: d
    text:
      es: "Al Ordenador general de pagos del Estado."
  explanation:
    es: "Por debajo del límite que fija el Ministro, la competencia para aprobar y comprometer pasa a los Secretarios de Estado y al Subsecretario del departamento. El Director General del Tesoro es el Ordenador general de pagos. El Consejo de Ministros solo interviene en los casos que la Ley le reserva. El Ordenador general de pagos no aprueba gastos."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m01-l15-q135
  prompt:
    es: "Según el artículo 74.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Ministros aprueban y comprometen los gastos propios de sus presupuestos, salvo los casos reservados por la ley a la competencia del:"
