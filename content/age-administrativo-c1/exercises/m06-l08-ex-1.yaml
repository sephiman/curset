# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q022
  prompt:
    es: "¿Cuál de los siguientes rasgos incluye la definición de «Internet» aprobada por el FNC en 1995 para el sistema de información global?"
  options:
  - id: a
    text:
      es: "Admitir comunicaciones solo con TCP/IP, sin otros protocolos compatibles con IP"
  - id: b
    text:
      es: "Estar enlazado por un espacio de direcciones basado en el protocolo NCP"
  - id: c
    correct: true
    text:
      es: "Estar enlazado por un espacio de direcciones único basado en el protocolo IP"
  - id: d
    text:
      es: "Ofrecer solo transporte de datos, sin servicios de alto nivel sobre la infraestructura"
  explanation:
    es: "La definición exige un espacio de direcciones globalmente único basado en el Protocolo de Internet (IP) o sus extensiones. El espacio de direcciones se basa en IP, no en NCP, que se sustituyó en 1983. La definición admite TCP/IP «y/o» otros protocolos compatibles con IP, no solo TCP/IP. La definición incluye que el sistema proporciona, usa o hace accesibles servicios de alto nivel sobre esa infraestructura."
  citation: "fuente: `isoc-historia-internet.html`; «History of the Future»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q023
  prompt:
    es: "¿Quién estableció en 1969, cuando trabajaba en la UCLA, la serie de notas Request for Comments (RFC)?"
  options:
  - id: a
    text:
      es: "Jon Postel, que fue después su editor"
  - id: b
    text:
      es: "Bob Kahn, que organizó la demostración pública de 1972"
  - id: c
    correct: true
    text:
      es: "S. Crocker, como forma informal y rápida de compartir ideas"
  - id: d
    text:
      es: "Elizabeth Feinler, que mantenía el directorio de las RFC en el SRI"
  explanation:
    es: "S. Crocker, entonces en la UCLA, estableció en 1969 la serie de RFC. Postel fue el editor de las RFC y gestionó la asignación de números de protocolo, pero no creó la serie. Feinler dirigía el Network Information Center, que mantenía en línea los directorios. Kahn organizó la demostración pública de ARPANET en 1972."
  citation: "fuente: `isoc-historia-internet.html`; «The Role of Documentation»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q024
  prompt:
    es: "¿Cuál de las siguientes características tenían las RFC, según la historia de Internet, frente al ciclo normal de la publicación académica?"
  options:
  - id: a
    text:
      es: "Eran artículos formales revisados antes de publicarse en revistas académicas"
  - id: b
    text:
      es: "Eran manuales del protocolo NCP, distribuidos solo en papel"
  - id: c
    text:
      es: "Eran especificaciones obligatorias que DARPA imponía a cada nodo"
  - id: d
    correct: true
    text:
      es: "Eran memorandos informales de distribución rápida para compartir ideas entre investigadores"
  explanation:
    es: "Las RFC eran memorandos informales para repartir rápidamente ideas entre investigadores de redes, a diferencia del ciclo académico, demasiado formal y lento. Los artículos formales son justo el ciclo académico que la página califica de demasiado formal y lento. Las RFC no eran obligatorias: servían para proponer ideas, y solo cuando había consenso se preparaba una especificación. Al principio se imprimían en papel, pero al usarse FTP se prepararon como ficheros en línea y se accedía a ellas por FTP."
  citation: "fuente: `isoc-historia-internet.html`; «These memos were intended to be an informal fast distribution way to share ideas with other network researchers.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q025
  prompt:
    es: "¿Quién fue el editor de las RFC y gestionó la asignación centralizada de los números de protocolo hasta su muerte, en octubre de 1998?"
  options:
  - id: a
    text:
      es: "Elizabeth Feinler, que dirigía el Network Information Center"
  - id: b
    text:
      es: "Dan Lynch, que organizó con la IAB un taller para fabricantes"
  - id: c
    correct: true
    text:
      es: "Jon Postel, que desempeñó esas funciones hasta su muerte"
  - id: d
    text:
      es: "Steve Crocker, que creó la serie de RFC en 1969"
  explanation:
    es: "Jon Postel fue el editor de las RFC y gestionó la asignación de números de protocolo hasta su muerte en 1998. Crocker creó la serie de RFC, pero no fue su editor. Feinler dirigía el Network Information Center del SRI, que mantenía los directorios en línea. Lynch organizó con la IAB un taller de tres días sobre TCP/IP para fabricantes."
  citation: "fuente: `isoc-historia-internet.html`; «The Role of Documentation»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q026
  prompt:
    es: "¿Qué cambio de velocidad de línea se hizo en el diseño de ARPANET, tras conocerse el concepto de red de paquetes del NPL británico?"
  options:
  - id: a
    text:
      es: "Se mejoró de 2,4 kbps a 24 kbps"
  - id: b
    text:
      es: "Se redujo de 50 kbps a 2,4 kbps"
  - id: c
    correct: true
    text:
      es: "Se mejoró de 2,4 kbps a 50 kbps"
  - id: d
    text:
      es: "Se mejoró de 5 kbps a 50 kbps"
  explanation:
    es: "La velocidad de línea propuesta para ARPANET pasó de 2,4 kbps a 50 kbps. Reducir la velocidad de 50 a 2,4 kbps invierte el cambio: la mejora fue de 2,4 a 50 kbps. La velocidad final fue 50 kbps, no 24 kbps. La velocidad de partida era 2,4 kbps, no 5 kbps."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 2
  tags:
  - "cantidad"
