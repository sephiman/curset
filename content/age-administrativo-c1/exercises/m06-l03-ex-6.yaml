    es: "En el Explorador de archivos de Windows 11, para quitar una carpeta de Acceso rápido cuando ya no se necesita, se selecciona con el clic derecho la opción:"
  options:
  - id: a
    text:
      es: "Anclar a acceso rápido"
  - id: b
    correct: true
    text:
      es: "Desanclar del acceso rápido"
  - id: c
    text:
      es: "Desanclar de Inicio"
  - id: d
    text:
      es: "Desanclar de la barra de tareas"
